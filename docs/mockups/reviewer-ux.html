<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviewer Screens</title>
<meta name="description" content="Reviewer screens: the review queue and its facets, pointer tags, second-speaker views, review from the deck view, reviewer key and check, and the quiet checked-by line (Plan-Reviewer-UX).">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&display=swap">
<style>
/* ===== The page around the phones (not the app) ===== */
:root{--page-bg:#F3F1EF;--page-fg:#1E1B1A;--page-muted:#57504D;--page-card:#FFFFFF;--page-line:#D6CFCC;--page-acc:#8F4C36}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page-bg:#121010;--page-fg:#ECE6E3;--page-muted:#B4ABA7;--page-card:#1D1A19;--page-line:#3A3331;--page-acc:#FFB59E}}
:root[data-theme="dark"]{--page-bg:#121010;--page-fg:#ECE6E3;--page-muted:#B4ABA7;--page-card:#1D1A19;--page-line:#3A3331;--page-acc:#FFB59E}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--page-bg);color:var(--page-fg);font-family:Roboto,"Noto Sans Devanagari","Noto Sans Bengali",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:28px 16px 72px}
h1{font-size:28px;line-height:36px;margin:0 0 8px;font-weight:700}
h2{font-size:20px;line-height:28px;margin:0 0 4px;font-weight:700}
.cap1{margin:0 0 16px;color:var(--page-muted);font-size:14px}
.tw{display:flex;flex-wrap:wrap;gap:10px 24px;margin:0 0 14px}
.tg{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--page-muted);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--page-line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;min-height:40px;padding:0 14px;border:0;background:var(--page-card);color:var(--page-fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--page-acc);color:var(--page-bg);font-weight:600}
section.opt{margin:0 0 52px;padding-top:20px;border-top:1px solid var(--page-line)}
.frames{display:flex;flex-wrap:wrap;gap:20px 24px;align-items:flex-start}
.fcol{display:flex;flex-direction:column;gap:6px;width:360px;max-width:100%}
.fcap{font-size:13px;line-height:18px;font-weight:600;color:var(--page-muted)}
.sticky{position:sticky;top:0;z-index:20;background:var(--page-bg);padding:10px 0 4px;margin-bottom:12px;border-bottom:1px solid var(--page-line)}
/* ===== The app: lib/ui/theme.dart (M3, Roboto; ColorScheme.fromSeed of the forest seed) =====
   Every size is calc(N px * var(--t)), t = 1.4, the app's text cap (#505). Icons do not scale. */
.ph{--t:1.4;width:360px;max-width:100%;height:740px;border-radius:20px;overflow:hidden;position:relative;display:flex;flex-direction:column;
 background:var(--s);color:var(--onS);font-family:Roboto,"Noto Sans Devanagari","Noto Sans Bengali",sans-serif;
 box-shadow:0 0 0 1px var(--page-line);-webkit-font-smoothing:antialiased}
.ph button{font-family:inherit;color:inherit;cursor:pointer}
.appbar{flex:none;min-height:56px;display:flex;align-items:center;padding:0 4px 0 8px;color:var(--onSv);gap:2px}
.appbar .ttl{flex:1;min-width:0;font-size:calc(20px*var(--t));line-height:1.2;font-weight:500;color:var(--onS);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:48px;height:48px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:24px;padding:0;color:var(--onSv);flex:none}
svg.i{width:24px;height:24px;fill:currentColor;display:block;flex:none}
.sp{flex:1}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 16px 16px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.t-body{font-size:calc(14px*var(--t));line-height:1.4;margin:0}
.t-sm{font-size:calc(12px*var(--t));line-height:1.35;color:var(--onSv);margin:0}
.t-lab{font-size:calc(12px*var(--t));line-height:1.3;font-weight:600;letter-spacing:.4px;color:var(--onSv);text-transform:uppercase;margin:14px 0 6px}
.t-h{font-size:calc(16px*var(--t));line-height:1.3;font-weight:500;margin:0}
.script{font-family:"Noto Sans Devanagari","Noto Sans Bengali",Roboto,sans-serif}
.nowrap{white-space:nowrap}
/* language bar */
.lbar{display:flex;gap:8px;padding:0 16px 10px;flex:none}
.pill{border:1px solid var(--ol);border-radius:8px;min-height:32px;padding:0 12px;font-size:calc(14px*var(--t));font-weight:500;display:inline-flex;align-items:center;gap:6px;background:none;color:var(--onSv)}
.pill.on{background:var(--sc);color:var(--onSc);border-color:transparent}
/* buttons */
.btn{min-height:calc(40px*var(--t));border-radius:calc(20px*var(--t));border:0;font-size:calc(14px*var(--t));line-height:1.2;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 16px}
.btn.fill{background:var(--p);color:var(--onP)}
.btn.tonal{background:var(--sc);color:var(--onSc)}
.btn.out{background:none;border:1px solid var(--ol);color:var(--p)}
.btn.text{background:none;color:var(--p);padding:6px 12px}
.btn.full{width:100%}
.btn.sm{min-height:48px;border-radius:24px}
/* cards */
.card{background:var(--sLow);border-radius:16px;padding:14px 16px;margin:0 0 12px;display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0}
.card .tx{flex:1;min-width:0}
.card .ic{flex:none;width:40px;height:40px;border-radius:20px;background:var(--sc);color:var(--onSc);display:flex;align-items:center;justify-content:center}
/* bottom nav */
.nav{flex:none;display:flex;background:var(--sLow);box-shadow:0 -1px 0 var(--olv);padding:8px 4px 10px}
.nav div{flex:1;text-align:center;font-size:calc(11px*var(--t));line-height:1.2;color:var(--onSv);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav div .pl{width:56px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.nav div.on{color:var(--onS);font-weight:600}
.nav div.on .pl{background:var(--sc);color:var(--onSc)}
/* settings rows */
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:3}
.sheet{position:absolute;z-index:4;left:0;right:0;bottom:0;background:var(--sLow);border-radius:28px 28px 0 0;display:flex;flex-direction:column;max-height:88%}
.sheet .grab{flex:none;width:32px;height:4px;border-radius:2px;background:var(--onSv);opacity:.4;margin:10px auto 6px}
.sheet .scroll{padding:6px 20px 20px}
.sheet h3{margin:0 0 4px;font-size:calc(20px*var(--t));font-weight:500;line-height:1.2}
.opt-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:6px 0;min-height:48px;font-size:calc(14px*var(--t));line-height:1.3}
.opt-row .tx{flex:1;min-width:0}
.opt-row .tx small{display:block;font-size:calc(12px*var(--t));color:var(--onSv);line-height:1.3}
.box{flex:none;width:20px;height:20px;border-radius:3px;border:2px solid var(--onSv);display:flex;align-items:center;justify-content:center}
.box.rd{border-radius:50%}
.opt-row[aria-checked="true"] .box{background:var(--p);border-color:var(--p)}
.box svg{width:16px;height:16px;fill:var(--onP);opacity:0}
.opt-row[aria-checked="true"] .box svg{opacity:1}
.sep{border-top:1px solid var(--olv);margin:6px 0}
/* word rows */
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;border-top:1px solid var(--olv);padding:10px 0;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.wrow .w{font-size:calc(20px*var(--t));line-height:1.25;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .rd{font-size:calc(12px*var(--t));line-height:1.3;color:var(--onSv);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .mn{font-size:calc(14px*var(--t));line-height:1.3;grid-column:1}
.wrow .act{grid-column:2;grid-row:1/4;display:flex;align-items:center;gap:0}
.wrow.unl .w,.wrow.unl .rd,.wrow.unl .mn{opacity:.78}
.mastery{display:inline-flex;align-items:center;height:calc(18px*var(--t));padding:0 8px;border-radius:calc(9px*var(--t));font-size:calc(11px*var(--t));line-height:1;font-weight:600;letter-spacing:.3px}
.m-new{box-shadow:inset 0 0 0 1px var(--ol);color:var(--onSv)}
.m-learning{background:var(--sc);color:var(--onSc)}
.m-known{background:var(--p);color:var(--onP)}
.audio{width:48px;height:48px;border-radius:24px;border:0;background:var(--sc);color:var(--onSc);display:flex;align-items:center;justify-content:center;flex:none}
.audio.sm{width:40px;height:40px}
.bottom{flex:none;padding:12px 16px 16px;background:var(--sLow);box-shadow:0 -1px 0 var(--olv)}
/* key-value (inspect) */
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0}
.kv dt{font-size:calc(12px*var(--t));color:var(--onSv);line-height:1.5}
.kv dd{margin:0;font-size:calc(14px*var(--t));line-height:1.4;min-width:0;overflow-wrap:anywhere}
.mono{font-family:ui-monospace,"Roboto Mono",monospace;font-size:calc(12px*var(--t))}
.blk{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:12px 14px;background:var(--sHigh);margin:8px 0}
.blk p{margin:0;font-size:calc(14px*var(--t));line-height:1.35}
.blk .tt{font-size:calc(12px*var(--t));font-weight:700;letter-spacing:.3px;text-transform:uppercase;margin:0 0 2px;color:var(--onSv)}
/* conversation */
.turns{display:flex;flex-direction:column;gap:12px;padding:4px 0}
.turn{max-width:92%;border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.turn.a{align-self:flex-start;background:var(--sLow);border-bottom-left-radius:6px}
.turn.b{align-self:flex-end;background:var(--sc);color:var(--onSc);border-bottom-right-radius:6px}
.turn .who{font-size:calc(11px*var(--t));font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.turn.a .who{color:var(--onSv)}
.turn .tl{font-size:calc(20px*var(--t));line-height:1.45;font-weight:500}
.turn .tl button{background:none;border:0;padding:0 1px;font:inherit;color:inherit;cursor:pointer;border-bottom:2px dotted currentColor}
.turn .tl button.sel{background:var(--p);color:var(--onP);border-radius:6px;border-bottom-color:transparent}
.turn .rdg{font-size:calc(13px*var(--t));line-height:1.3;opacity:.95}
.turn .ml{font-size:calc(14px*var(--t));line-height:1.3;opacity:.95}
.turn.live .tl{opacity:.85}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--E);margin-right:6px}
.mic{display:flex;gap:12px;padding:12px 16px 16px;background:var(--sLow);box-shadow:0 -1px 0 var(--olv);align-items:stretch}
.mic .btn{flex:1;min-height:calc(48px*var(--t));flex-direction:column;gap:2px;border-radius:24px;font-size:calc(13px*var(--t))}
.mic .btn svg.i{width:28px;height:28px}
.mic .btn.on{outline:3px solid var(--onS);outline-offset:2px}
.status{display:flex;align-items:center;gap:8px;padding:0 16px 8px;flex:none}
/* highlight of what changed */
.hl-on .chg{outline:2px dashed var(--E);outline-offset:3px;position:relative;border-radius:14px}
.hl-on .chg::after{content:"new";position:absolute;top:-10px;right:6px;background:var(--E);color:var(--onE);font-size:11px;font-weight:700;line-height:1;padding:3px 6px;border-radius:6px;z-index:2;letter-spacing:.3px}
.hl-on .chg.upd::after{content:"changed"}
.hl-on .chg.gone::after{content:"removed"}
.ghost{opacity:.55;text-decoration:line-through;pointer-events:none}
.hide{display:none!important}
.note{font-size:13px;color:var(--page-muted);margin:6px 0 14px;max-width:760px}
.tabs{flex:none;display:flex;overflow-x:auto;scrollbar-width:none;box-shadow:0 -1px 0 var(--olv) inset;padding:0 4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:48px;padding:0 12px;border:0;background:none;font-size:calc(14px*var(--t));font-weight:500;color:var(--onSv);display:flex;align-items:center;gap:6px;border-bottom:3px solid transparent;white-space:nowrap}
.tab .n{font-size:calc(12px*var(--t));font-weight:600;background:var(--sc);color:var(--onSc);border-radius:10px;padding:1px 7px}
.tab[aria-selected="true"]{color:var(--p);border-bottom-color:var(--p);font-weight:700}
.tab .best{width:6px;height:6px;border-radius:3px;background:var(--p)}
.sbox{margin:0 16px 8px;flex:none;display:flex;align-items:center;gap:8px;background:var(--sHigh);border-radius:28px;min-height:56px;padding:0 8px 0 16px}
.sbox .q{flex:1;min-width:0;font-size:calc(16px*var(--t));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.chp{border:1px solid var(--ol);border-radius:8px;min-height:32px;padding:0 10px;font-size:calc(12px*var(--t));display:inline-flex;align-items:center;gap:4px;background:none;color:var(--onSv);font-weight:500}
.chp.on{background:var(--sc);color:var(--onSc);border-color:transparent}
.tag{display:inline-flex;align-items:center;gap:4px;height:calc(18px*var(--t));padding:0 7px;border-radius:calc(9px*var(--t));font-size:calc(11px*var(--t));line-height:1;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.tag.lv{box-shadow:inset 0 0 0 1px var(--ol);color:var(--onSv)}
.tag.pro{background:var(--pl);color:var(--onPl)}
.tag.up{background:none;box-shadow:inset 0 0 0 1px var(--pl);color:var(--pl)}
.tag.kind{background:var(--sc);color:var(--onSc)}
.tag.pr{background:var(--pr);color:var(--onPr)}
.rrow{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--olv);padding:12px 0;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.rrow .ico{flex:none;width:40px;height:40px;border-radius:12px;background:var(--sc);color:var(--onSc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(14px*var(--t))}
.rrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rrow .nm{font-size:calc(16px*var(--t));line-height:1.3;font-weight:500}
.rrow .sub{font-size:calc(12px*var(--t));line-height:1.35;color:var(--onSv)}
.rrow .rt{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rrow.up{opacity:.8}
.rrow.up .nm{font-weight:400}
.bar{height:6px;border-radius:3px;background:var(--olv);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--p)}
.ex{font-size:calc(14px*var(--t));line-height:1.4;background:var(--sHigh);border-radius:10px;padding:6px 10px;margin-top:2px}
.corr{font-size:calc(12px*var(--t));color:var(--onSv);margin:0 0 6px;line-height:1.4}
.corr b{color:var(--onS)}
.big{font-size:calc(20px*var(--t));line-height:1.3;font-weight:500}
.more{display:flex;align-items:center;justify-content:center;min-height:48px;border-top:1px solid var(--olv);color:var(--p);font-size:calc(14px*var(--t));font-weight:600;width:100%;background:none;border-left:0;border-right:0;border-bottom:0}
.empty{text-align:center;padding:28px 8px;color:var(--onSv)}
.empty .big{color:var(--onS);margin:8px 0 4px}
.empty svg.i{width:48px;height:48px;opacity:.7;margin:0 auto}
.hint{font-size:calc(12px*var(--t));color:var(--onSv);line-height:1.35;margin:0 0 8px}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.addb{min-height:48px;border-radius:24px;border:1px solid var(--ol);background:none;color:var(--p);font-weight:600;font-size:calc(13px*var(--t));padding:0 12px;display:inline-flex;align-items:center;gap:4px}
.thumb{flex:none;width:72px;height:72px;border-radius:14px;background:var(--sHigh);display:flex;align-items:center;justify-content:center;color:var(--onSv);position:relative;overflow:hidden}
.thumb svg.i{width:32px;height:32px;opacity:.6}
.thumb.ph2{background:repeating-linear-gradient(45deg,var(--sHigh) 0 8px,var(--sLow) 8px 16px);box-shadow:inset 0 0 0 1px var(--ol)}
.cred{font-size:calc(11px*var(--t));line-height:1.3;color:var(--onSv)}
.tl{position:relative;margin:6px 0 6px 8px;padding-left:16px;border-left:2px solid var(--olv)}
.tl .ev{position:relative;padding:0 0 12px}
.tl .ev::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:6px;background:var(--s);box-shadow:inset 0 0 0 2px var(--ol)}
.tl .ev.met::before{background:var(--p);box-shadow:none}
.tl .ev.this::before{background:var(--pl);box-shadow:0 0 0 3px var(--sc)}
.tl .ev.now::before{background:var(--pr);box-shadow:none}
.tl .ev b{font-size:calc(13px*var(--t));display:block;font-weight:600}
.tl .ev span{font-size:calc(12px*var(--t));color:var(--onSv);line-height:1.35}
.strip{display:flex;gap:0;overflow:hidden;margin:6px 0;position:relative;padding-top:10px}
.strip::before{content:"";position:absolute;left:0;right:0;top:15px;height:2px;background:var(--olv)}
.strip .d{flex:1;min-width:0;text-align:center;position:relative;font-size:calc(10px*var(--t));line-height:1.2;color:var(--onSv)}
.strip .d i{display:block;width:12px;height:12px;border-radius:6px;margin:0 auto 4px;background:var(--s);box-shadow:inset 0 0 0 2px var(--ol);position:relative;top:-4px}
.strip .d.met i{background:var(--p);box-shadow:none}.strip .d.this i{background:var(--pl);box-shadow:0 0 0 3px var(--sc)}.strip .d.now i{background:var(--pr);box-shadow:none}
.strip .d.this{color:var(--onS);font-weight:700}
.qt{border-left:4px solid var(--p);padding:4px 0 4px 12px;margin:6px 0}
.qt .big{font-size:calc(22px*var(--t))}
.src{font-size:calc(11px*var(--t));line-height:1.4;color:var(--onSv)}
.legacy{border-radius:16px;padding:12px 14px;background:var(--sHigh);margin:8px 0}
.legacy .tt{font-size:calc(12px*var(--t));font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--onSv);margin:0 0 4px}
.legacy li{font-size:calc(13px*var(--t));line-height:1.35;margin:0 0 4px}
.legacy ul{margin:4px 0 0;padding-left:18px}
.sw2{width:52px;height:32px;border-radius:16px;background:var(--olv);position:relative;flex:none}
.sw2::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:var(--onSv)}
.sw2.on{background:var(--p)}.sw2.on::after{left:24px;background:var(--onP)}
.frames.wide .fcol{width:360px}
.opt h2 small{font-weight:400;color:var(--page-muted);font-size:14px}
.qs{margin:0 0 40px;padding:14px 16px;border:1px solid var(--page-line);border-radius:12px;background:var(--page-card);max-width:760px;font-size:14px}
.hl-on .tabs.chg,.hl-on .chips.chg,.hl-on .corr.chg{margin-bottom:10px;margin-top:4px}.hl-on .tabs.chg{margin-left:4px;margin-right:4px}

body,.ph,.script{font-family:Roboto,"Noto Sans Devanagari","Noto Sans JP",system-ui,sans-serif}
.ph{--t:var(--tt,1.4)}
.ph.tall{height:auto;min-height:740px}.ph.tall .scroll{overflow:visible;flex:none}.ph.h2{height:900px}
body,.ph,.script{font-family:Roboto,"Noto Sans Devanagari","Noto Sans Bengali",system-ui,sans-serif}
h2.grp{margin:34px 0 4px;padding-top:18px;border-top:1px solid var(--page-line)}
.prog{height:4px;background:var(--olv);flex:none;margin:0 16px 8px;border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;background:var(--p)}
.fx{background:var(--sLow);border-radius:16px;padding:12px 14px;margin:0 0 10px}
.fx.sel{box-shadow:inset 0 0 0 2px var(--p)}
.fh{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.fl{font-size:calc(12px*var(--t));font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--onSv);flex:1}
.fs{font-size:calc(12px*var(--t));font-weight:600;display:inline-flex;align-items:center;gap:4px;color:var(--p)}

 return ph('1f · End of 20 (closing at any point keeps answers)',hdr(x.unit),body);}
// 2
const TAGS=[['Meaning wrong','meaning'],['Reading wrong','reading'],['IPA wrong','ipa'],['Spelling wrong','word'],['Unnatural or rare','word'],['Wrong register','meaning'],['Offensive','offence'],['Example wrong','example'],['Note wrong','note'],['Wrong unit','unit'],['Audio wrong','audio']];
function tagsHtml(sel,first){const ord=TAGS.slice().sort((a,b)=>(a[1]==first?0:1)-(b[1]==first?0:1));
 return `<div class="chips">${ord.map(t=>`<button class="chp ${sel.includes(t[0])?'on':''}" aria-pressed="${sel.includes(t[0])}">${sel.includes(t[0])?ic('check',14)+' ':''}${t[0]}</button>`).join('')}</div>`;}
const sheetF=(cap,title,inner,tt)=>ph(cap,hdr(d().unit),'','',`<div class="scrim"></div><div class="sheet"><div class="grab"></div><div class="scroll"><h3 class="sh">${title}</h3>${inner}</div></div>`,'h2');
function f2a(){const x=d();
 return sheetF('2a · Tags for Reading: prefilled field, engine candidates, paste','Reading',`${tagsHtml(['Reading wrong'],'reading')}
 <div class="pillrow" style="margin:0">${x.rdC.map((c,i)=>`<button class="chp ${i==1?'on':''}">${c}</button>`).join('')}</div>
 <div class="field foc"><span class="v">${x.rdC[1]}<span class="caret"></span></span><button class="ib" style="width:40px;height:40px" aria-label="Paste">${ic('paste')}</button></div>
 <button class="btn fill full" style="margin-top:10px">Save</button>`);}
function f2b(){const x=d();
 return sheetF('2b · Tags for Word spelling: dictionary variants, card reading beside the field, keyboard hint','Spelling',`${tagsHtml(['Spelling wrong'],'word')}
 <div class="pillrow" style="margin:0">${x.spV.map((c,i)=>`<button class="chp script ${i==0?'on':''}" style="font-size:calc(14px*var(--t))">${c}</button>`).join('')}</div>
 <div class="field foc"><span class="v script">${x.spV[0]}<span class="caret"></span></span><span class="t-sm" style="margin:0">${x.spR}</span><button class="ib" style="width:40px;height:40px" aria-label="Paste">${ic('paste')}</button></div>
 <p class="hint" style="display:flex;gap:6px;align-items:center;margin:6px 0 0">${ic('kbd',18)}<span>Enable the ${x.lang} keyboard in phone settings.</span></p>
 <button class="btn fill full" style="margin-top:10px">Save</button>`);}
function f2c(){const x=d();
 return sheetF('2c · Fallback: plain field with the current text','Note',`${tagsHtml(['Note wrong','Unnatural or rare'],'note')}
 <div class="field foc" style="align-items:flex-start;min-height:calc(96px*var(--t))"><span class="v t-body" style="font-size:calc(14px*var(--t))">${x.note}<span class="caret"></span></span></div>
 <button class="btn fill full" style="margin-top:10px">Save</button>`);}
// 3
function f3a(){const x=d();
 return ph('3a · Blind verdict: the card only, no earlier answer',hdr(x.unit),cl(12,20)+`<p class="mk" style="margin:0 0 6px">${ic('person',16)} Needs another speaker's check</p>`+card({s:{rd:'ok'}}),'','','tall');}
function f3b(){const x=d();
 const body=`<p class="lb" style="font-size:calc(11px*var(--t));font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--onSv);margin:0">Note</p>
 <div class="two"><div><p class="lb">Now</p><p class="t-body">${x.note}</p></div><div class="nw"><p class="lb">Proposed</p><p class="t-body">${x.newn}</p></div></div>
 <div class="stack"><button class="btn fill full">Accept</button><button class="btn out full">Reject</button><button class="btn text full">Offer another</button></div>`;
 return ph('3b · Open check of a proposal: original beside the proposal',hdr(x.unit),cl(3,8)+body);}
function f3c(){const x=d();
 const opts=[[x.note,1],[x.alt[0]],[x.alt[1]],['None of these']];
 const body=`<p class="lb" style="font-size:calc(11px*var(--t));font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--onSv);margin:0 0 4px">Note</p><div role="radiogroup">${opts.map((o,i)=>`<button class="opt-row" role="radio" aria-checked="${i==1}" style="align-items:flex-start;border-top:1px solid var(--olv);padding:10px 0"><span class="box rd" style="margin-top:2px">${ic('check')}</span><span class="tx">${o[0]}${o[1]?'<small>Now</small>':''}</span></button>`).join('')}</div>
 <div class="stack"><button class="btn fill full">Choose</button><button class="btn text full">Offer another</button></div>`;
 return ph('3c · Rival fixes: pick one',hdr(x.unit),cl(5,8)+body);}
function f3d(){const x=d();
 const it=(l,w,pill,done)=>`<div class="fr" style="align-items:flex-start;flex-wrap:wrap"><div class="c"><p class="lb">${l}</p><span class="script t-h">${w}</span><div style="margin-top:4px"><span class="tag pr">${pill}</span></div></div>${done?`<span class="ib tk on" style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:20px">${ic('check',22)}</span>`:`<button class="ib tk" aria-label="Right">${ic('check',22)}</button><button class="ib fg" aria-label="Not right">${ic('flag',22)}</button>`}${done?`<div class="rv" style="flex-basis:100%;display:flex;gap:8px;align-items:flex-start">${ic('quote',18)}<span>${x.reason}</span></div>`:''}</div>`;
 const body=it('Reading',x.rd+' → '+x.rdC[1],'Changed',0)+it('Meaning',x.m,'Contested',0)+it('Note',x.note,'Changed',1);
 return ph('3d · Digest of one unit: changed or contested only; reason after the verdict',hdr(x.unit),body,'','','tall');}
// 4
function f4a(){const x=d();
 const body=`<p class="t-h">${x.unit.split(' · ')[1]}</p><p class="t-sm">6 lessons</p>
 <button class="btn tonal full chg" style="margin:10px 0">${ic('flag',20)} Review this unit</button>
 <button class="card"><div class="ic">1</div><div class="tx"><p class="t-h">Lesson 1</p></div></button><button class="card"><div class="ic">2</div><div class="tx"><p class="t-h">Lesson 2</p></div></button>`;
 return ph('4a · Unit in the deck view',abar(x.unit.split(' · ')[0],true),body,nav('Decks'));}
function f4b(){const x=d();
 const body=`<div style="padding:4px 0 8px"><span class="big script" style="font-size:calc(28px*var(--t))">${x.w}</span><div class="t-body" style="color:var(--onSv)">${x.rd} · ${x.ipa}</div><div class="t-body" style="margin-top:4px">${x.m}</div></div>
 <button class="audio" aria-label="Play" style="margin:0 0 8px">${ic('vol')}</button>
 <div class="legacy"><div class="script t-h">${x.ex}</div><div class="t-sm">${x.exr}</div></div>
 <button class="btn tonal full chg" style="margin-top:10px">${ic('flag',20)} Review this card</button>`;
 return ph('4b · Single card in the deck view',abar('Card',true),body);}
function f4c(){const x=d();return ph('4c · All-details review screen (from a unit or a card)',hdr(x.unit),cl2('Card 5')+card({s:{rd:'ok'}}),'','','tall');}
// 5
function f5a(){
 const body=`<button class="srow"><span style="width:24px"></span><span class="tx">Reviewing</span><span class="sw2 on"></span></button>
 <button class="srow"><span style="width:24px"></span><span class="tx">Daily questions<small>5 left today</small></span>${ic('chev')}</button>
 <button class="srow chg">${ic('key')}<span class="tx">I have a reviewer key</span>${ic('chev')}</button>
 <button class="srow chg">${ic('verified')}<span class="tx">Take the check</span>${ic('chev')}</button>`;
 return ph('5a · Settings > Reviewing',abar('Reviewing',true),body,nav('Settings'));}
function f5b(){
 const body=`<div class="field foc"><span class="v mono" style="font-size:calc(12px*var(--t));overflow-wrap:anywhere">FLK1.eyJrIjoiMDQy••••••••••••••••••••<span class="caret"></span></span><button class="ib" style="width:40px;height:40px" aria-label="Paste">${ic('paste')}</button></div>
 <button class="btn fill full" style="margin-top:12px">Unlock</button>`;
 return ph('5b · Paste the key',abar('Reviewing',true),'','',`<div class="scrim"></div><div class="sheet"><div class="grab"></div><div class="scroll"><h3 class="sh">Reviewer key</h3>${body}</div></div>`);}
function f5c(){const x=d();
 const body=`<div style="display:flex;align-items:center;gap:10px;margin:4px 0 8px;color:var(--p)">${ic('verified',28)}<span class="t-h" style="color:var(--onS)">Verified</span></div>
 ${[x.c1,x.c2].map(c=>`<div class="srow" style="min-height:48px"><span style="color:var(--p)">${ic('check')}</span><span class="tx">${c}</span></div>`).join('')}`;
 return ph('5c · Key accepted: tier and assigned courses',abar('Reviewer key',true),body);}
function f5d(){const x=d();
 const body=`<button class="srow"><span style="width:24px"></span><span class="tx">${x.c1}</span>${ic('chev')}</button>
 <div class="srow dis"><span style="width:24px"></span><span class="tx">${x.c2}<small>Retake in 5 days</small></span></div>
 <div class="srow dis"><span style="width:24px"></span><span class="tx">Telugu<small>Use a reviewer key</small></span></div>`;
 return ph('5d · Take the check: pick a course',abar('Take the check',true),body);}
function f5e(){const x=d();
 const body=`<div class="empty" style="padding:14px 8px 4px">${ic('star',48)}<p class="big">B1 and above</p></div>
 <div class="legacy chg" style="margin-top:14px"><p class="t-body" style="margin:0 0 8px">Help check ${x.lang} cards?</p><button class="btn tonal full">Take the check</button><button class="btn text full" style="margin-top:4px">No thanks</button></div>`;
 return ph('5e · Offer after a top-band placement (once per course)',abar('Find my level',true),body);}
function f6(){const x=d();
 const body=`<div style="padding:4px 0 8px"><span class="big script" style="font-size:calc(28px*var(--t))">${x.w}</span><div class="t-body" style="color:var(--onSv)">${x.rd} · ${x.ipa}</div><div class="t-body" style="margin-top:4px">${x.m}</div></div>
 <button class="audio" aria-label="Play" style="margin:0 0 8px">${ic('vol')}</button>
 <div class="legacy"><div class="script t-h">${x.ex}</div><div class="t-sm">${x.exr}</div><div class="t-body">${x.exm}</div></div>
 <p class="src chg" style="margin-top:12px;display:inline-block;padding:2px 4px">Checked by 3 speakers</p>`;
 return ph('6 · Card detail, learner view',abar('Card',true),body);}
function build(){
 const root=document.getElementById('root');theme(S,root);root.style.setProperty('--tt',S.tt);
 const g=(h,fr)=>`<h2 class="grp">${h}</h2><div class="frames">${fr.join('')}</div>`;
 root.innerHTML=g('1 · Review queue',[f1a(),f1b(),f1c(),f1d(),f1e(),f1f()])+g('2 · Pointer tags',[f2a(),f2b(),f2c()])+g('3 · Second speaker',[f3a(),f3b(),f3c(),f3d()])+g('4 · From the deck view',[f4a(),f4b(),f4c()])+g('5 · Settings > Reviewing',[f5a(),f5b(),f5c(),f5d(),f5e()])+g('6 · Card detail',[f6()]);
 sync(S);
}
wire(S,build);build();
</script>
</body>
</html>
