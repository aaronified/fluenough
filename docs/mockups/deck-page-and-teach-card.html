<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck Page and Teach Card</title>
<meta name="description" content="The deck page (#693), the word sheet and the one-screen teach card (#691) with its pronunciation and dictionary popups. Hindustani in light, Bengali in dark, 1.4x text.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&display=swap">
<style>
/* ===== The page around the phones (not the app) ===== */
:root{--page-bg:#F3F1EF;--page-fg:#1E1B1A;--page-muted:#57504D;--page-card:#FFFFFF;--page-line:#D6CFCC;--page-acc:#8F4C36}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page-bg:#121010;--page-fg:#ECE6E3;--page-muted:#B4ABA7;--page-card:#1D1A19;--page-line:#3A3331;--page-acc:#FFB59E}}
:root[data-theme="dark"]{--page-bg:#121010;--page-fg:#ECE6E3;--page-muted:#B4ABA7;--page-card:#1D1A19;--page-line:#3A3331;--page-acc:#FFB59E}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--page-bg);color:var(--page-fg);font-family:Roboto,"Noto Sans Devanagari","Noto Sans Bengali",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:28px 16px 72px}
h1{font-size:28px;line-height:36px;margin:0 0 8px;font-weight:700}
h2{font-size:20px;line-height:28px;margin:0 0 4px;font-weight:700}
section.opt{margin:0 0 44px}
.frames{display:flex;flex-wrap:wrap;gap:20px 24px;align-items:flex-start}
.fcol{display:flex;flex-direction:column;gap:6px;width:360px;max-width:100%}
.fcap{font-size:13px;line-height:18px;font-weight:600;color:var(--page-muted)}
/* ===== The app: lib/ui/theme.dart (M3, Roboto; ColorScheme.fromSeed of the forest seed) =====
   Every size is calc(N px * var(--t)), t = 1.4, the app's text cap (#505). Icons do not scale. */
.ph{--t:1.4;width:360px;max-width:100%;height:740px;border-radius:20px;overflow:hidden;position:relative;display:flex;flex-direction:column;
 background:var(--s);color:var(--onS);font-family:Roboto,"Noto Sans Devanagari","Noto Sans Bengali",sans-serif;
 box-shadow:0 0 0 1px var(--page-line);-webkit-font-smoothing:antialiased}
.ph button{font-family:inherit;color:inherit;cursor:pointer}
.fs{font-size:calc(var(--n)*1px*var(--t))}
.appbar{flex:none;height:56px;display:flex;align-items:center;padding:0 4px;color:var(--onSv)}
.ib{width:48px;height:48px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:24px;padding:0;color:var(--onSv)}
.ib svg,.ic svg{width:24px;height:24px;fill:currentColor;display:block}
.sp{flex:1}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 16px 16px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.t-title{font-size:calc(24px*var(--t));line-height:1.2;font-weight:600;margin:0}
.t-body{font-size:calc(14px*var(--t));line-height:1.4;margin:0}
.t-sm{font-size:calc(12px*var(--t));line-height:1.35;color:var(--onSv)}
.t-lab{font-size:calc(12px*var(--t));line-height:1.3;font-weight:600;letter-spacing:.4px;color:var(--onSv);text-transform:uppercase;margin:0 0 6px}
.script{font-family:"Noto Sans Devanagari","Noto Sans Bengali",Roboto,sans-serif}

/* deck page */
.meta{margin:4px 0 18px}
.meta .t-sm{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{border:1px solid var(--ol);background:none;border-radius:8px;min-height:32px;padding:0 12px;font-size:calc(14px*var(--t));line-height:1.3;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--onSv)}
.chip[aria-pressed="true"]{background:var(--sc);color:var(--onSc);border-color:transparent}
.chip svg{width:18px;height:18px;fill:currentColor}
.chip:not([aria-pressed="true"]) svg{display:none}
.count{margin:0 0 4px}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--olv);padding:12px 0;align-items:start}
.row .w{display:block;white-space:nowrap;font-size:calc(20px*var(--t));line-height:1.25;font-weight:500}
.row .rd{display:block;font-size:calc(12px*var(--t));line-height:1.3;color:var(--onSv)}
.row .mn{font-size:calc(14px*var(--t));line-height:1.3;text-align:right}
.row .mc{grid-column:2;justify-self:end}
.mastery{display:inline-flex;align-items:center;gap:4px;height:calc(18px*var(--t));padding:0 8px;border-radius:calc(9px*var(--t));font-size:calc(11px*var(--t));line-height:1;font-weight:600;letter-spacing:.3px}
.m-new{box-shadow:inset 0 0 0 1px var(--ol);color:var(--onSv)}
.m-learning{background:var(--sc);color:var(--onSc)}
.m-known{background:var(--p);color:var(--onP)}
.empty{padding:24px 0;color:var(--onSv)}
.bottom{flex:none;display:flex;gap:12px;padding:12px 16px 16px;background:var(--sLow);box-shadow:0 -1px 0 var(--olv)}
.btn{flex:1;min-height:calc(40px*var(--t));border-radius:calc(20px*var(--t));border:0;font-size:calc(14px*var(--t));line-height:1.2;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 12px}
.btn svg{width:20px;height:20px;fill:currentColor}
.btn.tonal{background:var(--sc);color:var(--onSc)}
.btn.fill{background:var(--p);color:var(--onP)}
.btn.text{background:none;color:var(--p);flex:none;padding:0 14px}
.btn[disabled]{opacity:.4;cursor:default}

/* scrim, popup, sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:3}
.scrim.on{opacity:1;pointer-events:auto}
.dlg{position:absolute;z-index:4;left:16px;right:16px;top:50%;transform:translateY(-50%) scale(.96);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;background:var(--sHigh);border-radius:28px;padding:22px 20px 14px}
.dlg.on{opacity:1;transform:translateY(-50%);pointer-events:auto}
.dlg h3{margin:0 0 4px;font-size:calc(20px*var(--t));line-height:1.2;font-weight:500}
.dlg .t-sm{margin:0 0 8px}
.opt-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:6px 0;min-height:48px;font-size:calc(14px*var(--t));line-height:1.3}
.box{flex:none;width:18px;height:18px;border-radius:3px;border:2px solid var(--onSv);display:flex;align-items:center;justify-content:center}
.opt-row[aria-checked="true"] .box{background:var(--p);border-color:var(--p)}
.box svg{width:16px;height:16px;fill:var(--onP);opacity:0}
.opt-row[aria-checked="true"] .box svg{opacity:1}
.opt-row.all{font-weight:600;border-bottom:1px solid var(--olv);margin-bottom:2px}
.dacts{display:flex;justify-content:flex-end;gap:4px;margin-top:8px}
.sheet{position:absolute;z-index:4;left:0;right:0;bottom:0;top:96px;background:var(--sLow);border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.on{transform:none}
.grab{flex:none;width:32px;height:4px;border-radius:2px;background:var(--onSv);opacity:.4;margin:10px auto 6px;border:0;padding:0}
.sheet .scroll{padding:6px 20px 24px}

/* the teach card: one component in lessons, the walkthrough and the word sheet */
.tc{display:flex;flex-direction:column;gap:12px;padding-top:2px}
.hero{display:flex;flex-direction:column;gap:2px}
.hero .big{white-space:nowrap;font-size:calc(40px*var(--t));line-height:1.15;font-weight:500;margin:0}
.hero .read{font-size:calc(18px*var(--t));line-height:1.3;color:var(--onSv)}
.say{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.audio{width:48px;height:48px;border-radius:24px;border:0;background:var(--sc);color:var(--onSc);display:flex;align-items:center;justify-content:center;flex:none}
.audio svg{width:24px;height:24px;fill:currentColor}
.ipa{font-size:calc(14px*var(--t));color:var(--onSv)}
button.ipa{min-height:48px;padding:0 16px;border-radius:24px;border:1px solid var(--ol);background:none;color:var(--onS);font-size:calc(14px*var(--t));font-weight:500}
.mrow{display:flex;gap:12px;align-items:stretch}
.mean{font-size:calc(22px*var(--t));line-height:1.25;font-weight:500;margin:0}
.line{font-size:calc(14px*var(--t));line-height:1.3;color:var(--onSv);margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mdiv{flex:1;min-width:0}
button.meanb{flex:1;min-width:0;text-align:left;border:0;background:var(--sHigh);color:var(--onS);border-radius:16px;padding:10px 12px 10px 16px;display:flex;gap:8px;align-items:center}
button.meanb .mt{flex:1;min-width:0}
button.meanb svg{flex:none;width:24px;height:24px;fill:var(--p)}
.img{flex:none;width:72px;border-radius:16px;background:var(--sc);color:var(--onSc);display:flex;align-items:center;justify-content:center}
.img svg{width:36px;height:36px;fill:currentColor;opacity:.9}
.blk{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:12px 16px;background:var(--sHigh)}
.blk .ic{flex:none;width:24px;height:24px}
.blk.note .ic{color:var(--p)}
.blk.warn{background:var(--tC);color:var(--onTC)}
.blk.warn .ic{color:var(--onTC)}
.blk .tt{font-size:calc(12px*var(--t));line-height:1.3;font-weight:700;letter-spacing:.3px;margin:0 0 4px;text-transform:uppercase}
.blk p{margin:0;font-size:calc(14px*var(--t));line-height:1.35}
.clamp p:not(.tt){display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blk .tx{min-width:0}
.ex{border-left:3px solid var(--p);padding:2px 0 2px 14px;margin-bottom:12px}
.ex .e1{font-size:calc(18px*var(--t));line-height:1.35;margin:0}
.ex .e2{font-size:calc(12px*var(--t));line-height:1.35;color:var(--onSv);margin:2px 0 0}
.ex .e3{font-size:calc(14px*var(--t));line-height:1.35;margin:2px 0 0}
.kv{display:flex;flex-wrap:wrap;gap:8px}
.tag{border-radius:8px;padding:2px 10px;font-size:calc(12px*var(--t));line-height:1.4;background:var(--sc);color:var(--onSc)}
.dict ol{margin:0;padding-left:22px;font-size:calc(14px*var(--t));line-height:1.4}
.dict li{margin:0 0 4px}
.dict .et{margin:8px 0 12px;font-size:calc(12px*var(--t));line-height:1.4;color:var(--onSv)}
.foot{display:flex;align-items:center;gap:8px;justify-content:space-between;color:var(--onSv)}
.rep{border:0;background:none;color:var(--p);font-size:calc(14px*var(--t));font-weight:600;display:flex;align-items:center;gap:6px;min-height:48px;padding:0 8px}
.rep svg{width:20px;height:20px;fill:currentColor}
/* IPA rows: in the pronunciation popup and inline on the word sheet */
.sy{display:grid;grid-template-columns:56px minmax(0,1fr);gap:2px 12px;padding:10px 0;border-top:1px solid var(--olv)}
.sy:first-child{border-top:0}
.sy .g{font-size:calc(22px*var(--t));line-height:1.2;font-weight:500;color:var(--p)}
.sy .d{font-size:calc(14px*var(--t));line-height:1.3}
.sy .x{font-size:calc(12px*var(--t));line-height:1.3;color:var(--onSv)}
.sy .a{grid-column:2;display:flex;align-items:center;gap:8px}
.sy .audio{width:48px;height:48px}
.btn.pr{flex:none;min-height:48px;padding:0 16px;background:none;box-shadow:inset 0 0 0 1px var(--ol);color:var(--p)}
.ipahead{margin:0 0 4px}
.dlg.big{max-height:calc(100% - 48px);display:flex;flex-direction:column}
.dlg .db{overflow-y:auto;min-height:0;scrollbar-width:none}
.dlg .db::-webkit-scrollbar{display:none}
.btn.fill.lw{position:relative}
.lwrap{flex:1;position:relative;display:flex}
.badge{position:absolute;top:-8px;right:-4px;min-width:calc(20px*var(--t));height:calc(20px*var(--t));padding:0 6px;border-radius:calc(10px*var(--t));background:var(--E);color:var(--onE);font-size:calc(11px*var(--t));line-height:calc(20px*var(--t));font-weight:700;text-align:center;box-shadow:0 0 0 2px var(--sLow)}

/* the walkthrough / lesson slide */
.lbar{flex:none;display:flex;align-items:center;gap:12px;padding:0 16px 0 4px;height:52px}
.prog{flex:1;height:4px;border-radius:2px;background:var(--olv);overflow:hidden}
.prog i{display:block;height:100%;background:var(--p);transition:width .2s}
.lbar .t-sm{white-space:nowrap}
.vp{flex:1;min-height:0;overflow:hidden;position:relative}
.track{display:flex;height:100%;width:200%}
.track.s1{transform:translateX(-50%)}
.vp{touch-action:pan-y;user-select:none}
.chev{position:absolute;top:50%;margin-top:-24px;z-index:2;width:40px;height:48px;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:var(--sc);color:var(--onSc);opacity:0;pointer-events:none;transition:opacity .15s}
.chev svg{width:24px;height:24px;fill:currentColor}
.chev.l{left:0;border-radius:0 24px 24px 0}.chev.r{right:0;border-radius:24px 0 0 24px}
.ph.touch .chev:not(.off){opacity:.92;pointer-events:auto}
.ph.touch .chev:not(.off) svg{animation:wig .25s ease-in-out 1}
@keyframes wig{0%,100%{transform:translateX(0)}17%{transform:translateX(-3px)}34%{transform:translateX(3px)}51%{transform:translateX(-3px)}68%{transform:translateX(3px)}85%{transform:translateX(-2px)}}
.slide{width:50%;height:100%;overflow-y:auto;padding:0 20px 8px;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
</style>
</head>

/* the one teach card. full=false: the lesson card, which fits one screen. full=true: the word sheet, all inline. */
function teachCard(c,full,lang){
 const L=`lang="${lang}"`, B=[];
 const ipa=full?`<span class="ipa">${c.ipa}</span>`:`<button class="ipa" type="button" data-ipa aria-label="Pronunciation ${c.ipa}">${c.ipa}</button>`;
 B.push(`<div class="hero"><p class="big script" ${L}>${c.w}</p><span class="read">${c.r}</span><div class="say"><button class="audio" type="button" aria-label="Play audio">${I.vol}</button>${ipa}</div></div>`);
 if(full){
  B.push(`<div><p class="t-lab">Pronunciation · IPA course</p>${symRows(c,L)}</div>`);
  B.push(`<div><p class="mean">${c.mean}</p><p class="line" style="white-space:normal">${c.line}</p><p class="line" style="white-space:normal">Also means: ${c.also}</p><p class="line" style="white-space:normal">Also accepted: ${c.accept}</p></div>`);
  B.push(`<div class="img" role="img" aria-label="Picture" style="width:100%;height:120px">${I.pic}</div>`);
  B.push(blk('note',I.excl,{tt:'Note',tx:c.note},true));
  if(c.warn)B.push(blk('warn',I.hear,c.warn,true));
  if(c.other)B.push(blk('warn',I.trans,c.other,true));
  B.push(`<div><p class="t-lab">Dictionary · Wiktionary</p>${dictHtml(c)}</div>`);
  B.push(`<div><p class="t-lab">Examples</p>${c.exs.map(e=>exHtml(e,L)).join('')}</div>`);
  B.push(`<div><p class="t-lab">Tags</p><div class="kv">${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>`);
  B.push(`<div class="foot"><span class="t-sm">${c.id}</span><button class="rep" type="button">${I.flag}Report</button></div>`);
 }else{
  B.push(`<div class="mrow"><button class="meanb" type="button" data-dict aria-label="Dictionary: ${c.mean}"><span class="mt"><p class="mean">${c.mean}</p><p class="line">${c.line}</p></span>${I.book}</button><div class="img" role="img" aria-label="Picture">${I.pic}</div></div>`);
  B.push(blk('note',I.excl,{tx:c.note},false));
  const w=c.warn?blk('warn',I.hear,c.warn,false):c.other?blk('warn',I.trans,c.other,false):'';
  if(w)B.push(w);
 }
 return `<div class="tc">${B.join('')}</div>`;
}

 /* swipe: the card follows the finger, then springs to the next, the previous, or back */
 vp.addEventListener('pointerdown',e=>{
  if(drag||(e.pointerType==='mouse'&&e.button!==0))return;
  anim=null;const n=Math.max(0,Math.min(N-1,Math.round(pos/W())));
  drag={id:e.pointerId,x0:e.clientX,y0:e.clientY,pos0:pos,startIdx:n,mode:'undecided',raw:pos,samples:[{t:performance.now(),p:pos}]};
 });
 vp.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  let dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
  if(drag.mode==='undecided'){
   if(Math.hypot(dx,dy)<SLOP)return;
   if(Math.abs(dx)>Math.abs(dy)){drag.mode='h';try{vp.setPointerCapture(e.pointerId)}catch(_){}drag.x0=e.clientX;drag.pos0=pos;dx=0;drag.samples=[{t:performance.now(),p:pos}]}
   else drag.mode='v';
  }
  if(drag.mode==='h'){
   drag.raw=drag.pos0-dx;pos=withRubber(drag.raw);
   const now=performance.now();drag.samples.push({t:now,p:drag.raw});
   while(drag.samples.length>2&&now-drag.samples[0].t>100)drag.samples.shift();
   render();
  }
 });
 function release(e,cancelled){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;
  if(d.mode!=='h')return;
  const now=performance.now(),s=d.samples,f=s[0],l=s[s.length-1];let v=0;
  if(now-l.t<80&&l.t>f.t)v=(l.p-f.p)/((l.t-f.t)/1000);
  const dist=d.raw-d.startIdx*W();let t=d.startIdx;
  if(!cancelled){if(Math.abs(v)>=MIN_FLING)t=d.startIdx+(v>0?1:-1);else if(Math.abs(dist)>W()/2)t=d.startIdx+(dist>0?1:-1)}
  t=Math.max(0,Math.min(N-1,Math.max(d.startIdx-1,Math.min(d.startIdx+1,t))));
  const mix=Math.max(0,Math.min(1,(Math.abs(v)-300)/(FAST-300)));
  spring(t*W(),v,1+(Z-1)*mix);
 }
 vp.addEventListener('pointerup',e=>release(e,false));vp.addEventListener('pointercancel',e=>release(e,true));

/* ---------- contrast self-check: computed here, printed only in the console (results are in the .md) ---------- */
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lum=c=>{const a=c.map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]};
const ratio=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function selfCheck(){
 const out=[];
 for(const th of ['light','dark']){
  const S=Object.fromEntries(Object.entries(SCHEMES[th]).map(([k,v])=>[k,hex(v)]));
  const add=(what,fg,bg,need)=>{const r=ratio(S[fg],S[bg]);out.push({theme:th,pair:what,ratio:+r.toFixed(2),needs:need,ok:r>=need})};
  add('body text: onS on s','onS','s',4.5);
  add('reading, captions: onSv on s','onSv','s',4.5);
  add('captions on bottom bar: onSv on sLow','onSv','sLow',4.5);
  add('meaning button and note text: onS on sHigh','onS','sHigh',4.5);
  add('dictionary icon and note icon: p on sHigh','p','sHigh',3);
  add('IPA button text: onS on s','onS','s',4.5);
  add('IPA button outline: ol on s','ol','s',3);
  add('warning: onTC on tC','onTC','tC',4.5);
  add('chip selected, Learning, Practice, play button, image tile: onSc on sc','onSc','sc',4.5);
  add('chip unselected and New: onSv on s','onSv','s',4.5);
  add('chip and New outline: ol on s','ol','s',3);
  add('Known chip and + Learn / Relearn: onP on p','onP','p',4.5);
  add('badge: onE on E','onE','E',4.5);
  add('badge against bottom bar: E on sLow','E','sLow',3);
  add('popup text: onS on sHigh','onS','sHigh',4.5);
  add('popup buttons, IPA symbols: p on sHigh','p','sHigh',4.5);
  add('Practise outline: ol on sHigh','ol','sHigh',3);
  add('popup captions: onSv on sHigh','onSv','sHigh',4.5);
  add('example rule: p on s','p','s',3);
  add('sheet text: onS on sLow','onS','sLow',4.5);
  add('IPA symbols and buttons on sheet: p on sLow','p','sLow',4.5);
 }
 window.__check=out;
 console.log('CONTRAST '+JSON.stringify(out));
}
