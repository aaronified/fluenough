<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Situations</title>
<meta name="description" content="Mockup for #724: situation buttons on Today, a situation sheet and its inspect view. Telugu first, other courses blank with the upcoming pill. Light and dark, 1.4x text.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&display=swap">
<style>
/* ===== The page around the phones (not the app) ===== */
:root{--page-bg:#F3F1EF;--page-fg:#1E1B1A;--page-muted:#57504D;--page-card:#FFFFFF;--page-line:#D6CFCC;--page-acc:#8F4C36}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page-bg:#121010;--page-fg:#ECE6E3;--page-muted:#B4ABA7;--page-card:#1D1A19;--page-line:#3A3331;--page-acc:#FFB59E}}
:root[data-theme="dark"]{--page-bg:#121010;--page-fg:#ECE6E3;--page-muted:#B4ABA7;--page-card:#1D1A19;--page-line:#3A3331;--page-acc:#FFB59E}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--page-bg);color:var(--page-fg);font-family:Roboto,"Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Telugu",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:28px 16px 72px}
h1{font-size:28px;line-height:36px;margin:0 0 8px;font-weight:700}
h2{font-size:20px;line-height:28px;margin:0 0 4px;font-weight:700}
.cap1{margin:0 0 16px;color:var(--page-muted);font-size:14px}
.tw{display:flex;flex-wrap:wrap;gap:10px 24px;margin:0 0 14px}
.tg{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--page-muted);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--page-line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;min-height:40px;padding:0 14px;border:0;background:var(--page-card);color:var(--page-fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--page-acc);color:var(--page-bg);font-weight:600}
section.opt{margin:0 0 52px;padding-top:20px;border-top:1px solid var(--page-line)}
.frames{display:flex;flex-wrap:wrap;gap:20px 24px;align-items:flex-start}
.fcol{display:flex;flex-direction:column;gap:6px;width:360px;max-width:100%}
.fcap{font-size:13px;line-height:18px;font-weight:600;color:var(--page-muted)}
.sticky{position:sticky;top:0;z-index:20;background:var(--page-bg);padding:10px 0 4px;margin-bottom:12px;border-bottom:1px solid var(--page-line)}
/* ===== The app: lib/ui/theme.dart (M3, Roboto; ColorScheme.fromSeed of the forest seed) =====
   Every size is calc(N px * var(--t)), t = 1.4, the app's text cap (#505). Icons do not scale. */
.ph{--t:1.4;width:360px;max-width:100%;height:740px;border-radius:20px;overflow:hidden;position:relative;display:flex;flex-direction:column;
 background:var(--s);color:var(--onS);font-family:Roboto,"Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Telugu",sans-serif;
 box-shadow:0 0 0 1px var(--page-line);-webkit-font-smoothing:antialiased}
.ph button{font-family:inherit;color:inherit;cursor:pointer}
.appbar{flex:none;min-height:56px;display:flex;align-items:center;padding:0 4px 0 8px;color:var(--onSv);gap:2px}
.appbar .ttl{flex:1;min-width:0;font-size:calc(20px*var(--t));line-height:1.2;font-weight:500;color:var(--onS);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:48px;height:48px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:24px;padding:0;color:var(--onSv);flex:none}
svg.i{width:24px;height:24px;fill:currentColor;display:block;flex:none}
.sp{flex:1}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 16px 16px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.t-body{font-size:calc(14px*var(--t));line-height:1.4;margin:0}
.t-sm{font-size:calc(12px*var(--t));line-height:1.35;color:var(--onSv);margin:0}
.t-lab{font-size:calc(12px*var(--t));line-height:1.3;font-weight:600;letter-spacing:.4px;color:var(--onSv);text-transform:uppercase;margin:14px 0 6px}
.t-h{font-size:calc(16px*var(--t));line-height:1.3;font-weight:500;margin:0}
.script{font-family:"Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Telugu",Roboto,sans-serif}
.nowrap{white-space:nowrap}
/* language bar */
.lbar{display:flex;gap:8px;padding:0 16px 10px;flex:none}
.pill{border:1px solid var(--ol);border-radius:8px;min-height:32px;padding:0 12px;font-size:calc(14px*var(--t));font-weight:500;display:inline-flex;align-items:center;gap:6px;background:none;color:var(--onSv)}
.pill.on{background:var(--sc);color:var(--onSc);border-color:transparent}
/* buttons */
.btn{min-height:calc(40px*var(--t));border-radius:calc(20px*var(--t));border:0;font-size:calc(14px*var(--t));line-height:1.2;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 16px}
.btn.fill{background:var(--p);color:var(--onP)}
.btn.tonal{background:var(--sc);color:var(--onSc)}
.btn.out{background:none;border:1px solid var(--ol);color:var(--p)}
.btn.text{background:none;color:var(--p);padding:6px 12px}
.btn.full{width:100%}
.btn.sm{min-height:48px;border-radius:24px}
/* cards */
.card{background:var(--sLow);border-radius:16px;padding:14px 16px;margin:0 0 12px;display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0}
.card .tx{flex:1;min-width:0}
.card .ic{flex:none;width:40px;height:40px;border-radius:20px;background:var(--sc);color:var(--onSc);display:flex;align-items:center;justify-content:center}
/* bottom nav */
.nav{flex:none;display:flex;background:var(--sLow);box-shadow:0 -1px 0 var(--olv);padding:8px 4px 10px}
.nav div{flex:1;text-align:center;font-size:calc(11px*var(--t));line-height:1.2;color:var(--onSv);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav div .pl{width:56px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.nav div.on{color:var(--onS);font-weight:600}
.nav div.on .pl{background:var(--sc);color:var(--onSc)}
/* settings rows */
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:3}
.sheet{position:absolute;z-index:4;left:0;right:0;bottom:0;background:var(--sLow);border-radius:28px 28px 0 0;display:flex;flex-direction:column;max-height:88%}
.sheet .grab{flex:none;width:32px;height:4px;border-radius:2px;background:var(--onSv);opacity:.4;margin:10px auto 6px}
.sheet .scroll{padding:6px 20px 20px}
.sheet h3{margin:0 0 4px;font-size:calc(20px*var(--t));font-weight:500;line-height:1.2}
.opt-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:6px 0;min-height:48px;font-size:calc(14px*var(--t));line-height:1.3}
.opt-row .tx{flex:1;min-width:0}
.opt-row .tx small{display:block;font-size:calc(12px*var(--t));color:var(--onSv);line-height:1.3}
.box{flex:none;width:20px;height:20px;border-radius:3px;border:2px solid var(--onSv);display:flex;align-items:center;justify-content:center}
.box.rd{border-radius:50%}
.opt-row[aria-checked="true"] .box{background:var(--p);border-color:var(--p)}
.box svg{width:16px;height:16px;fill:var(--onP);opacity:0}
.opt-row[aria-checked="true"] .box svg{opacity:1}
.sep{border-top:1px solid var(--olv);margin:6px 0}
/* word rows */
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;border-top:1px solid var(--olv);padding:10px 0;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.wrow .w{font-size:calc(20px*var(--t));line-height:1.25;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .rd{font-size:calc(12px*var(--t));line-height:1.3;color:var(--onSv);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .mn{font-size:calc(14px*var(--t));line-height:1.3;grid-column:1}
.wrow .act{grid-column:2;grid-row:1/4;display:flex;align-items:center;gap:0}
.wrow.unl .w,.wrow.unl .rd,.wrow.unl .mn{opacity:.78}
.mastery{display:inline-flex;align-items:center;height:calc(18px*var(--t));padding:0 8px;border-radius:calc(9px*var(--t));font-size:calc(11px*var(--t));line-height:1;font-weight:600;letter-spacing:.3px}
.m-new{box-shadow:inset 0 0 0 1px var(--ol);color:var(--onSv)}
.m-learning{background:var(--sc);color:var(--onSc)}
.m-known{background:var(--p);color:var(--onP)}
.audio{width:48px;height:48px;border-radius:24px;border:0;background:var(--sc);color:var(--onSc);display:flex;align-items:center;justify-content:center;flex:none}
.audio.sm{width:40px;height:40px}
.bottom{flex:none;padding:12px 16px 16px;background:var(--sLow);box-shadow:0 -1px 0 var(--olv)}
/* key-value (inspect) */
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0}
.kv dt{font-size:calc(12px*var(--t));color:var(--onSv);line-height:1.5}
.kv dd{margin:0;font-size:calc(14px*var(--t));line-height:1.4;min-width:0;overflow-wrap:anywhere}
.mono{font-family:ui-monospace,"Roboto Mono",monospace;font-size:calc(12px*var(--t))}
.blk{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:12px 14px;background:var(--sHigh);margin:8px 0}
.blk p{margin:0;font-size:calc(14px*var(--t));line-height:1.35}
.blk .tt{font-size:calc(12px*var(--t));font-weight:700;letter-spacing:.3px;text-transform:uppercase;margin:0 0 2px;color:var(--onSv)}
/* conversation */
.turns{display:flex;flex-direction:column;gap:12px;padding:4px 0}
.turn{max-width:92%;border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.turn.a{align-self:flex-start;background:var(--sLow);border-bottom-left-radius:6px}
.turn.b{align-self:flex-end;background:var(--sc);color:var(--onSc);border-bottom-right-radius:6px}
.turn .who{font-size:calc(11px*var(--t));font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.turn.a .who{color:var(--onSv)}
.turn .tl{font-size:calc(20px*var(--t));line-height:1.45;font-weight:500}
.turn .tl button{background:none;border:0;padding:0 1px;font:inherit;color:inherit;cursor:pointer;border-bottom:2px dotted currentColor}
.turn .tl button.sel{background:var(--p);color:var(--onP);border-radius:6px;border-bottom-color:transparent}
.turn .rdg{font-size:calc(13px*var(--t));line-height:1.3;opacity:.95}
.turn .ml{font-size:calc(14px*var(--t));line-height:1.3;opacity:.95}
.turn.live .tl{opacity:.85}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--E);margin-right:6px}
.mic{display:flex;gap:12px;padding:12px 16px 16px;background:var(--sLow);box-shadow:0 -1px 0 var(--olv);align-items:stretch}
.mic .btn{flex:1;min-height:calc(48px*var(--t));flex-direction:column;gap:2px;border-radius:24px;font-size:calc(13px*var(--t))}
.mic .btn svg.i{width:28px;height:28px}
.mic .btn.on{outline:3px solid var(--onS);outline-offset:2px}
.status{display:flex;align-items:center;gap:8px;padding:0 16px 8px;flex:none}
/* highlight of what changed */
.hl-on .chg{outline:2px dashed var(--E);outline-offset:3px;position:relative;border-radius:14px}
.hl-on .chg::after{content:"new";position:absolute;top:-10px;right:6px;background:var(--E);color:var(--onE);font-size:11px;font-weight:700;line-height:1;padding:3px 6px;border-radius:6px;z-index:2;letter-spacing:.3px}
.hl-on .chg.upd::after{content:"changed"}
.hl-on .chg.gone::after{content:"removed"}
.ghost{opacity:.55;text-decoration:line-through;pointer-events:none}
.hide{display:none!important}
.note{font-size:13px;color:var(--page-muted);margin:6px 0 14px;max-width:760px}

/* #724 situations */
.sit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sit{background:var(--sLow);border:0;border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:48px;text-align:center}
.sit .ic{width:40px;height:40px;border-radius:20px;background:var(--sc);color:var(--onSc);display:flex;align-items:center;justify-content:center}
.sit .lb{font-size:calc(14px*var(--t));line-height:1.2;font-weight:500}
.sit .ct{font-size:calc(11px*var(--t));line-height:1.2;color:var(--onSv);min-height:calc(13px*var(--t))}
.sit-row{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.sit-row .sit{flex:none;width:96px}
.sit.off{opacity:.38}
.badge{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:12px;background:var(--sHigh);color:var(--onSv);font-size:calc(11px*var(--t));font-weight:600;letter-spacing:.3px}
.sec-h{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.sec-h .t-h{flex:1}
.dot{flex:none;width:8px;height:8px;border-radius:4px;background:var(--p);display:inline-block}
.wrow2{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:2px 8px;align-items:center;border-top:1px solid var(--olv);padding:10px 0}
.wrow2 .w{font-size:calc(20px*var(--t));line-height:1.3;font-weight:500;overflow-wrap:anywhere}
.wrow2 .rd{font-size:calc(12px*var(--t));line-height:1.3;color:var(--onSv)}
.wrow2 .mn{font-size:calc(14px*var(--t));line-height:1.3}
.wrow2 .mk{grid-column:1;grid-row:1}
.wrow2 .tx{grid-column:2;display:flex;flex-direction:column;gap:1px;min-width:0}
.wrow2 .act{grid-column:3;display:flex;align-items:center}
.audio.on{background:var(--p);color:var(--onP)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.strip button{flex:none;min-width:40px;height:40px;border-radius:12px;border:1px solid var(--ol);background:none;font-size:calc(13px*var(--t));font-weight:500;position:relative}
.strip button[aria-current="true"]{background:var(--sc);color:var(--onSc);border-color:transparent;font-weight:700}
.strip button .dot{position:absolute;top:4px;right:4px;width:6px;height:6px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--onS);color:var(--s);border-radius:8px;padding:10px 14px;font-size:calc(13px*var(--t));z-index:5}
</style>
</head>
<body>
<div class="wrap" id="wrap">
<h1>Situations</h1>
<p class="cap1">Mockup for #724 (owner answers, 2026-10-30). Phone 360 dp at 1.4x text, ColorScheme.fromSeed of the forest seed. Red dashed outlines mark what is new. Telugu has sheets first; other courses show the Upcoming pill.</p>
<div class="sticky tw" id="g-tw">
 <div class="tg">Theme <span class="seg" data-k="theme"><button data-v="light">Light</button><button data-v="dark">Dark</button></span></div>
 <div class="tg">Course <span class="seg" data-k="course"><button data-v="te">Telugu</button><button data-v="hi">Hindustani</button><button data-v="bn">Bengali</button></span></div>
 <div class="tg">Preview sheets in other courses <span class="seg" data-k="preview"><button data-v="0">No</button><button data-v="1">Yes</button></span></div>
 <div class="tg">Highlight changes <span class="seg" data-k="hl"><button data-v="1">On</button><button data-v="0">Off</button></span></div>
</div>
<div id="root"></div>
</div>

const S={theme:null,course:'te',hl:'1',preview:'0',
 layout:'grid',count:'show',mark:'dot',shown:'all',inspMode:'one',inspEntry:'row',idx:2,playing:-1,toast:false};

const chg=(c,x)=>`<div class="chg ${c||''}">${x}</div>`;

const sc=(c,t)=>`<span class="script" lang="${c.lang}">${t}</span>`;
function phone(inner,cap,extra=''){return `<div class="fcol"><div class="fcap">${cap}</div><div class="ph" ${extra}>${inner}</div></div>`}
function nav(on){const it=[['today','Today'],['decks','Decks'],['prog','Progress'],['gear','Settings']];
 return `<div class="nav">${it.map(([k,t])=>`<div class="${k===on?'on':''}"><span class="pl">${ic(k)}</span>${t}</div>`).join('')}</div>`}
function lbar(c){return `<div class="lbar"><span class="pill on">${sc(c,c.native)} ${c.name} ${ic('drop','')}</span></div>`}
const mark=(it)=>it.s==='new'?(S.mark==='dot'?`<span class="dot mk" role="img" aria-label="Not learnt yet" title="Not learnt yet"></span>`:''):(S.mark==='dot'?`<span class="mk"></span>`:'');
const chipMark=it=>S.mark==='chip'&&it.s==='new'?` <span class="mastery m-new">New</span>`:'';

/* ===== 1. Today ===== */
function todayScreen(c,has,cap){
 const tiles=SIT.map(([id,t,i,n,k])=>{
  const nw=has?(c.items.filter(x=>x.s==='new').length&&id==='taxi'?c.items.filter(x=>x.s==='new').length:(n-k)):0;
  const ct=has&&S.count==='show'?`<span class="ct">${nw} new</span>`:`<span class="ct"></span>`;
  return `<button class="sit ${has?'':'off'}" ${has?'':'aria-disabled="true"'} title="${t}"><span class="ic">${ic(i)}</span><span class="lb">${t}</span>${ct}</button>`}).join('');
 let body;
 if(S.layout==='card'){
  body=`<button class="card ${has?'':'off'}" style="${has?'':'opacity:.38'}"><span class="ic">${ic('way')}</span><span class="tx"><span class="t-h" style="display:block">Situations</span><span class="t-sm">Taxi, shops, the doctor and more</span></span>${has?ic('chev'):''}</button>`;
 } else if(S.layout==='row'){
  body=`<div class="sit-row">${tiles}</div>`;
 } else body=`<div class="sit-grid">${tiles}</div>`;
 const head=`<div class="sec-h"><span class="t-h">Situations</span>${has?`<span class="t-sm" style="display:flex;align-items:center;gap:4px" title="Works offline">${ic('offline')}Offline</span>`:`<span class="badge">Upcoming</span>`}</div>`;
 const daily=`<div class="card" style="flex-direction:column;align-items:stretch;gap:8px"><span class="t-sm">Today</span><span class="t-h">12 of 15 min</span><button class="btn fill full">Continue</button></div>`;
 return phone(`<div class="appbar"><span class="ttl">Today</span></div>${lbar(c)}<div class="scroll">${daily}${chg('',head+body)}${has?'':`<p class="t-sm" style="margin-top:8px">Sheets for ${c.name} are upcoming.</p>`}</div>${nav('today')}`,cap);
}
function listScreen(c){
 const rows=SIT.map(([id,t,i,n,k])=>`<button class="card" style="margin-bottom:8px"><span class="ic">${ic(i)}</span><span class="tx"><span class="t-h" style="display:block">${t}</span><span class="t-sm">${n} items${S.count==='show'?', '+(n-k)+' new':''}</span></span>${ic('chev')}</button>`).join('');
 return phone(`<div class="appbar"><button class="ib" aria-label="Back" title="Back">${ic('back')}</button><span class="ttl">Situations</span></div><div class="scroll">${rows}</div>${nav('today')}`,'The card opens a list (card layout only)');
}

/* ===== 2. Sheet ===== */
function sheetItems(c){return c.items.filter(x=>S.shown==='all'||x.s!=='new')}
function sheetRow(c,x,i){
 const ix=c.items.indexOf(x);
 return `<div class="wrow2" style="${S.mark==='dot'?'':'grid-template-columns:minmax(0,1fr) auto;'}">${S.mark==='dot'?mark(x):''}<span class="tx" style="${S.mark==='dot'?'':'grid-column:1'}"><span class="w">${sc(c,x.w)}</span><span class="rd">${x.r}</span><span class="mn">${x.m}${chipMark(x)}</span></span><span class="act" style="${S.mark==='dot'?'':'grid-column:2'}"><button class="audio sm ${S.playing===ix?'on':''}" data-act="play" data-i="${ix}" aria-label="Play" title="Play">${ic('vol')}</button>${S.inspEntry==='row'?`<button class="ib" data-act="insp" data-i="${ix}" aria-label="Inspect" title="Inspect">${ic('info')}</button>`:''}</span></div>`;
}
function sheet(c,cap){
 const its=sheetItems(c),nw=c.items.filter(x=>x.s==='new').length;
 const ph=its.filter(x=>x.k==='p'),wd=its.filter(x=>x.k==='w');
 const grp=(t,a)=>a.length?`<div class="t-lab">${t}</div>${a.map(x=>sheetRow(c,x)).join('')}`:'';
 return phone(`<div class="appbar"><button class="ib" aria-label="Back" title="Back">${ic('back')}</button><span class="ttl">Taxi</span>${S.inspEntry==='bar'?`<button class="ib" data-act="insp" data-i="${S.idx}" aria-label="Inspect" title="Inspect">${ic('info')}</button>`:''}</div>
 <div class="scroll"><p class="t-sm" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 2px">${ic('offline')}Offline · ${c.items.length} items${S.mark==='dot'?` · <span class="dot"></span> ${nw} not learnt`:`, ${nw} new`}</p>
 ${grp('Phrases',ph)}${grp('Words',wd)}</div>
 <div class="bottom">${chg('',`<button class="btn fill full" data-act="practise">${ic('bolt')}Practise this sheet</button>`)}</div>
 ${S.toast?`<div class="toast" role="status">Teaches the ${nw} new items first</div>`:''}`,cap);
}

/* ===== 3. Inspect ===== */
function block(c,x){
 return `<div style="display:flex;align-items:center;gap:8px"><div style="flex:1;min-width:0"><div style="font-size:calc(26px*1.4);line-height:1.25;font-weight:500">${sc(c,x.w)}</div><div class="t-sm">${x.r}</div></div><button class="audio" aria-label="Play" title="Play">${ic('vol')}</button></div>
  <div class="blk"><div><p class="tt">Notes</p><p>${x.notes}</p></div></div>
  <div class="blk"><div><p class="tt">Example</p><p>${sc(c,x.ex[0])}</p><p class="t-sm">${x.ex[1]}</p><p class="t-sm">${x.ex[2]}</p></div></div>
  <div class="t-lab">Card data</div>
  <dl class="kv"><dt>Meaning</dt><dd>${x.m}</dd><dt>IPA</dt><dd>${x.ipa}</dd><dt>Type</dt><dd>${x.pos}</dd><dt>Card id</dt><dd class="mono">${x.card}</dd><dt>Deck</dt><dd>${x.deck}, ${x.unit}</dd><dt>Audio</dt><dd class="mono">${x.audio}</dd><dt>On sheets</dt><dd>${x.on}</dd><dt>You</dt><dd>${mast(x.s)}${x.s==='new'?' not learnt yet':x.s==='learning'?' next review in 2 days':' next review in 3 weeks'}</dd></dl>`;
}
function inspect(c,cap){
 const n=c.items.length;if(S.idx>=n)S.idx=n-1;
 const x=c.items[S.idx];
 let main;
 if(S.inspMode==='one'){
  main=`<div class="strip" role="tablist">${c.items.map((y,i)=>`<button data-act="insp" data-i="${i}" aria-current="${i===S.idx}" aria-label="Card ${i+1}" title="Card ${i+1}">${i+1}${y.s==='new'?'<span class="dot"></span>':''}</button>`).join('')}</div>
   <div class="t-lab" style="margin-top:2px">${x.k==='p'?'Phrase':'Word'} ${S.idx+1} of ${n}</div>${chg('',block(c,x))}`;
 } else {
  main=c.items.map((y,i)=>`<div class="t-lab">${i+1} of ${n} · ${y.k==='p'?'Phrase':'Word'}${y.s==='new'?' · not learnt':''}</div><div class="blk" style="flex-direction:column;gap:2px"><div style="display:flex;gap:8px;align-items:center;width:100%"><div style="flex:1;min-width:0;font-size:calc(20px*var(--t));font-weight:500">${sc(c,y.w)}</div><button class="audio sm" aria-label="Play" title="Play">${ic('vol')}</button></div><p class="t-sm">${y.r}</p><p>${y.m}</p><p class="t-sm mono">${y.card}</p><p class="t-sm">${y.notes}</p></div>`).join('');
  main=chg('',main);
 }
 const bar=S.inspMode==='one'?`<div class="bottom" style="display:flex;gap:8px"><button class="btn out" style="flex:1" data-act="step" data-d="-1" aria-label="Previous card" title="Previous">${ic('prev')}</button><button class="btn out" style="flex:2">Open in deck</button><button class="btn tonal" style="flex:1" data-act="step" data-d="1" aria-label="Next card" title="Next">${ic('chev')}</button></div>`:'';
 return phone(`<div class="appbar"><button class="ib" aria-label="Back" title="Back">${ic('back')}</button><span class="ttl">Inspect: Taxi</span></div><div class="scroll">${main}</div>${bar}`,cap);
}

/* ===== page ===== */
function render(){
 const c=C[S.course],has=c.has||S.preview==='1';
 const sc2=has?c:C.te;
 document.documentElement.setAttribute('data-theme',S.theme);
 const P=PAL[S.theme];
 root.className=S.hl==='1'?'hl-on':'';
 root.style.cssText=Object.entries(P).map(([k,v])=>`--${k}:${v}`).join(';');
 const blank=c.has?C.hi:c;
 const sheetCap=has||c.has?'Sheet: Taxi':'Sheet: Taxi (Telugu, the only course with sheets)';
 root.innerHTML=`
 <section class="opt" id="s1"><h2>1. Today: situations buttons</h2>
  <p class="note">Six buttons below the daily button, each an icon and one word, the count of items not learnt yet under it in small type. A course without sheets shows the same buttons dimmed (like a feature incoming) with the Upcoming pill and no counts. Long-press names an icon-only control (#913).</p>
  <div class="tw">${seg('layout',[['grid','3 by 2 grid'],['row','Scrolling row'],['card','One card, list inside']],'Entry')}${seg('count',[['show','Count shown'],['hide','No count']],'Unlearned count')}</div>
  <div class="frames">${todayScreen(c,has,has?'Today, '+c.name+(c.has?'':' (sheets previewed)'):'Today, '+c.name+': no sheets yet')}${c.has?todayScreen(blank,false,'Today, a course without sheets ('+blank.name+')'):''}${S.layout==='card'?listScreen(c):''}</div></section>
 <section class="opt" id="s2"><h2>2. A situation sheet</h2>
  <p class="note">Everything on the sheet is shown, in the course's order, phrases then words. A small mark shows what is not learnt yet. Practise this sheet teaches those first. Tap the play button, the info icon or Practise.</p>
  <div class="tw">${seg('shown',[['all','Everything, unlearned marked (owner)'],['learned','Learned only (rejected)']],'Shows')}${seg('mark',[['dot','Dot'],['chip','New chip']],'Mark')}${seg('inspEntry',[['row','Info icon per row'],['bar','Inspect in the app bar']],'Inspect opens from')}</div>
  <div class="frames">${sheet(sc2,sheetCap)}</div></section>
 <section class="opt" id="s3"><h2>3. Inspect the sheet's cards</h2>
  <p class="note">Every card of the sheet in full: script, reading, meaning, audio, notes, example, IPA, card id, deck, audio file, the other sheets it is on and your progress. The numbers jump to a card; a dot marks the unlearned.</p>
  <div class="tw">${seg('inspMode',[['one','One card, step through'],['all','All cards in one scroll']],'Inspect shows')}</div>
  <div class="frames">${inspect(sc2,'Inspect: '+(S.inspMode==='one'?'card '+(S.idx+1):'all cards'))}</div></section>`;
 document.querySelectorAll('#g-tw .seg').forEach(s=>{const k=s.dataset.k;s.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(S[k])===b.dataset.v))});
}
document.addEventListener('click',e=>{
 const gb=e.target.closest('#g-tw .seg button');
 if(gb){S[gb.parentNode.dataset.k]=gb.dataset.v;S.idx=Math.min(S.idx,C[S.course].items.length-1);render();return}
 const b=e.target.closest('[data-sk] button');
 if(b){S[b.parentNode.dataset.sk]=b.dataset.v;render();return}
 const a=e.target.closest('[data-act]');if(!a)return;
 const k=a.dataset.act;
 if(k==='play'){const i=+a.dataset.i;S.playing=S.playing===i?-1:i;render()}
 else if(k==='insp'){S.idx=+a.dataset.i;render();const t=document.getElementById('s3');if(e.target.closest('#s2'))t.scrollIntoView({block:'start'})}
 else if(k==='step'){const n=(C[S.course].has||S.preview==='1'?C[S.course]:C.te).items.length;S.idx=(S.idx+ +a.dataset.d+n)%n;render()}
 else if(k==='practise'){S.toast=true;render();setTimeout(()=>{S.toast=false;render()},1800)}
});
render();

/* ===== contrast self-check: console only ===== */
function lum(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function cr(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
const PAIRS=[['body text','onS','s',4.5],['readings, captions on page','onSv','s',4.5],['situation tile label','onS','sLow',4.5],['tile count, sheet captions','onSv','sLow',4.5],['tile icon','onSc','sc',4.5],['Upcoming pill text','onSv','sHigh',4.5],['filled button','onP','p',4.5],['playing audio button','onP','p',4.5],['audio button','onSc','sc',4.5],['not-learnt dot on page','p','s',3],['not-learnt dot on card','p','sLow',3],['New chip text','onSv','sLow',4.5],['New chip outline','ol','sLow',3],['Learning chip','onSc','sc',4.5],['Known chip','onP','p',4.5],['text on raised block','onS','sHigh',4.5],['caption on raised block','onSv','sHigh',4.5],['card strip outline','ol','sLow',3],['strip number, current','onSc','sc',4.5],['toast','s','onS',4.5],['change tag','onE','E',4.5],['change outline on page','E','s',3],['change outline on card','E','sLow',3],['icons (info, offline)','onSv','sLow',3]];
window.__contrast=[];
['light','dark'].forEach(t=>PAIRS.forEach(([n,f,b,need])=>{const r=cr(PAL[t][f],PAL[t][b]);window.__contrast.push({theme:t,pair:n,fg:f,bg:b,ratio:+r.toFixed(2),need,pass:r>=need})}));
console.log('contrast',JSON.stringify(window.__contrast));

</script>
</body>
