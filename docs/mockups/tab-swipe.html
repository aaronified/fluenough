<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab swipe animation test</title>
<style>
  :root {
    --bg: #eef0f4; --surface: #fbfbfe; --nav: #f0f1f7; --on: #1b1b1f; --muted: #5d5f68;
    --indicator: #d9e2ff; --accent: #3b5bb5; --panel: #ffffff; --line: #c9ccd6;
    --blob: #d6d8df; --blob2: #c3c6cf;
    --t0: #e9eefc; --t1: #f6ecf8; --t2: #e8f4ea; --t3: #faf0e2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1013; --surface: #121316; --nav: #1f2024; --on: #e4e2e6; --muted: #a9abb4;
      --indicator: #2d4584; --accent: #b0c6ff; --panel: #1a1b1f; --line: #3b3d45;
      --blob: #34363d; --blob2: #44464e;
      --t0: #171c2b; --t1: #261a2b; --t2: #162419; --t3: #2b2013;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1013; --surface: #121316; --nav: #1f2024; --on: #e4e2e6; --muted: #a9abb4;
    --indicator: #2d4584; --accent: #b0c6ff; --panel: #1a1b1f; --line: #3b3d45;
    --blob: #34363d; --blob2: #44464e;
    --t0: #171c2b; --t1: #261a2b; --t2: #162419; --t3: #2b2013;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--on); font: 14px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; padding: 20px 16px 40px; gap: 16px; min-height: 100vh; }
  .phone { width: 390px; height: 800px; max-width: 100%; border-radius: 36px; border: 8px solid #000;
           outline: 1px solid var(--line); background: var(--surface); position: relative; overflow: hidden;
           user-select: none; -webkit-user-select: none; flex: none; }
  .pager { position: absolute; left: 0; right: 0; top: 0; height: 720px; overflow: hidden; touch-action: pan-y; }
  .page { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; will-change: transform;
          padding: 24px 16px 40px; scrollbar-width: none; }
  .page::-webkit-scrollbar { display: none; }
  .page .inner { display: flex; flex-direction: column; gap: 14px; }
  .p0 { background: var(--t0); } .p1 { background: var(--t1); } .p2 { background: var(--t2); } .p3 { background: var(--t3); }
  .b { background: var(--blob); border-radius: 12px; flex: none; }
  .b.d { background: var(--blob2); }
  .title { height: 44px; width: 55%; border-radius: 22px; background: var(--blob2); margin: 18px 0 6px; }
  .row { display: flex; gap: 12px; flex: none; }
  .circle { border-radius: 50%; }
  .label { position: absolute; top: 8px; right: 14px; font-size: 11px; color: var(--muted); }
  nav { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: var(--nav); display: flex;
        padding: 12px 8px 16px; }
  nav button { flex: 1; background: none; border: 0; color: var(--muted); font: 500 12px system-ui, sans-serif;
               display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 0; }
  nav .pill { width: 64px; height: 32px; border-radius: 16px; display: grid; place-items: center; transition: background .15s; }
  nav button[aria-current="true"] { color: var(--on); }
  nav button[aria-current="true"] .pill { background: var(--indicator); }
  nav svg { width: 24px; height: 24px; fill: currentColor; }
  .panel { width: 390px; max-width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
           padding: 14px 16px; display: grid; gap: 10px; }
  .panel label { display: grid; grid-template-columns: 110px 1fr 56px; align-items: center; gap: 8px; }
  .panel output { text-align: right; font-variant-numeric: tabular-nums; }
  .panel .check { display: flex; gap: 8px; align-items: center; }
  .read { font-variant-numeric: tabular-nums; color: var(--muted); display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
  .read b { color: var(--on); font-weight: 600; }
  .panel button { justify-self: start; font: inherit; color: var(--on); background: none; border: 1px solid var(--line);
                  border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  input[type=range] { accent-color: var(--accent); width: 100%; }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="pager" id="pager"></div>
  <nav id="nav" aria-label="Destinations"></nav>
</div>

<div class="panel" id="panel">
  <label>Stiffness <input id="k" type="range" min="60" max="600" step="10" value="400"><output id="kv"></output></label>
  <label>Damping ratio <input id="z" type="range" min="0.2" max="1.2" step="0.05" value="0.75"><output id="zv"></output></label>
  <div class="check"><input id="rm" type="checkbox"><label for="rm" style="display:inline">Reduce motion (taps switch instantly, drags still track)</label></div>
  <div class="read">
    <span>Last release velocity</span><b id="rv">-</b>
    <span>Settle duration</span><b id="sd">-</b>
    <span>Peak overshoot past target</span><b id="po">-</b>
    <span>Current page</span><b id="cp">Today</b>
  </div>
  <button id="theme" type="button">Theme: auto (tap to toggle)</button>
</div>

<script>
(function () {
  'use strict';
  var W = 390 - 16;             // pager width: phone 390 minus 2x8px border (border-box)
  var NAMES = ['Today', 'Decks', 'Progress', 'Settings'];
  var N = 4;
  var SLOP = 8;                 // touch slop, px
  var MIN_FLING = 200;          // px/s; Flutter kMinFlingVelocity is 50, raised a bit so a tiny flick does not commit
  var FAST = 1500;              // px/s at which the spring is fully "bouncy"
  var TAP_MS = 300;

  var pager = document.getElementById('pager');
  var phone = document.getElementById('phone');
  var nav = document.getElementById('nav');
  var pages = [], navBtns = [];

  // ---------- placeholder content (a different shape mix per page) ----------
  function blob(cls, w, h, extra) { return '<div class="b ' + cls + '" style="width:' + w + ';height:' + h + ';' + (extra || '') + '"></div>'; }
  var tpl = [
    function () { // Today: big hero card + list rows
      var s = '<div class="title"></div>' + blob('', '100%', '180px', 'border-radius:28px');
      for (var i = 0; i < 9; i++) s += '<div class="row">' + blob('circle d', '48px', '48px') + '<div style="flex:1;display:grid;gap:8px">' + blob('', '80%', '14px') + blob('', '55%', '14px') + '</div></div>';
      return s; },
    function () { // Decks: 2-column grid of tall cards
      var s = '<div class="title" style="width:40%"></div>';
      for (var i = 0; i < 6; i++) s += '<div class="row">' + blob('', '50%', i % 2 ? '150px' : '120px', 'flex:1;border-radius:20px') + blob('d', '50%', i % 2 ? '120px' : '150px', 'flex:1;border-radius:20px') + '</div>';
      return s; },
    function () { // Progress: big ring + bars
      var s = '<div class="title" style="width:65%"></div>' + '<div class="row" style="justify-content:center">' + blob('circle d', '170px', '170px') + '</div>';
      for (var i = 0; i < 10; i++) s += blob(i % 2 ? '' : 'd', (30 + ((i * 17) % 65)) + '%', '22px', 'border-radius:11px');
      return s; },
    function () { // Settings: full-width list tiles with switches
      var s = '<div class="title" style="width:48%;border-radius:8px"></div>';
      for (var i = 0; i < 12; i++) s += '<div class="row" style="align-items:center">' + blob('d', '36px', '36px', 'border-radius:8px') + blob('', '50%', '16px', 'flex:1') + blob('d', '44px', '24px', 'border-radius:12px') + '</div>';
      return s; }
  ];
  var icons = [
    '<path d="M12 3 3 10v11h6v-6h6v6h6V10z"/>',
    '<path d="M3 5h8v8H3zm10 0h8v5h-8zM3 15h8v4H3zm10-3h8v7h-8z"/>',
    '<path d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/>',
    '<path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8 5v-2l-2.1-.4a6 6 0 0 0-.7-1.7l1.2-1.8-1.4-1.4-1.8 1.2a6 6 0 0 0-1.7-.7L13 4h-2l-.4 2.1a6 6 0 0 0-1.7.7L7 5.6 5.6 7l1.2 1.8a6 6 0 0 0-.7 1.7L4 11v2l2.1.4c.1.6.4 1.2.7 1.7L5.6 17 7 18.4l1.8-1.2c.5.3 1.1.6 1.7.7L11 20h2l.4-2.1c.6-.1 1.2-.4 1.7-.7l1.8 1.2 1.4-1.4-1.2-1.8c.3-.5.6-1.1.7-1.7z"/>'
  ];
  for (var i = 0; i < N; i++) {
    var p = document.createElement('div');
    p.className = 'page p' + i;
    p.innerHTML = '<span class="label">' + NAMES[i] + '</span><div class="inner">' + tpl[i]() + '</div>';
    pager.appendChild(p); pages.push(p);
    var b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '<span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true">' + icons[i] + '</svg></span><span>' + NAMES[i] + '</span>';
    (function (idx) { b.addEventListener('click', function () { goTo(idx); }); })(i);
    nav.appendChild(b); navBtns.push(b);
  }

  // ---------- state ----------
  var pos = 0;                   // pager position in px: page i is centred when pos == i*W
  var anim = null;               // {type:'spring'|'tap', ...}
  var lastTs = 0, raf = 0;
  var drag = null;
  var K = 220, Z = 0.5;
  var reduce = false;
  var shown = 0;
  var maxPos = (N - 1) * W;

  function $(id) { return document.getElementById(id); }
  function render() {
    for (var i = 0; i < N; i++) {
      var x = Math.round((i * W - pos) * 100) / 100;
      pages[i].style.transform = 'translate3d(' + x + 'px,0,0)';
      pages[i].style.visibility = Math.abs(x) >= W + 1 ? 'hidden' : 'visible';
    }
    pager.dataset.pos = pos.toFixed(2);
    var idx = Math.max(0, Math.min(N - 1, Math.round(pos / W)));
    if (idx !== shown) {
      shown = idx;
      navBtns.forEach(function (b, j) { if (j === idx) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); });
      $('cp').textContent = NAMES[idx];
    }
    pager.dataset.page = String(idx);
  }
  navBtns[0].setAttribute('aria-current', 'true');

  // rubber band: offset x (px past the end) -> shown offset, ~0.3x at first, diminishing
  function rubber(x) { return (0.3 * x) / (1 + x / (0.9 * W)); }
  function withRubber(raw) {
    if (raw < 0) return -rubber(-raw);
    if (raw > maxPos) return maxPos + rubber(raw - maxPos);
    return raw;
  }

  // ---------- animation loop ----------
  function ensureLoop() { if (!raf) { lastTs = performance.now(); raf = requestAnimationFrame(tick); } }
  function bezier(x1, y1, x2, y2) {
    function cx(t) { return 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t; }
    function cy(t) { return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t; }
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      var lo = 0, hi = 1, t = x;
      for (var i = 0; i < 30; i++) { t = (lo + hi) / 2; if (cx(t) < x) lo = t; else hi = t; }
      return cy(t);
    };
  }
  var standard = bezier(0.2, 0, 0, 1);

  function tick(now) {
    raf = 0;
    if (!anim) return;
    var dt = Math.min(now - lastTs, 40) / 1000;
    lastTs = now;
    if (anim.type === 'tap') {
      var u = (now - anim.t0) / TAP_MS;
      if (u >= 1) { pos = anim.to; finish(now); }
      else pos = anim.from + (anim.to - anim.from) * standard(u);
    } else {
      var h = 1 / 480, steps = Math.max(1, Math.round(dt / h));
      for (var i = 0; i < steps; i++) {
        var a = -anim.k * (pos - anim.target) - anim.c * anim.v;
        anim.v += a * h;
        pos += anim.v * h;
        var over = (pos - anim.target) * anim.dir;
        if (over > anim.peak) anim.peak = over;
      }
      if (Math.abs(pos - anim.target) < 0.3 && Math.abs(anim.v) < 8) { pos = anim.target; finish(now); }
    }
    render();
    if (anim) raf = requestAnimationFrame(tick);
  }
  function finish(now) {
    var a = anim; anim = null;
    $('sd').textContent = Math.round(now - a.t0) + ' ms' + (a.type === 'tap' ? ' (tap)' : '');
    $('po').textContent = a.type === 'tap' ? '0.0 px' : Math.max(0, a.peak).toFixed(1) + ' px';
    pager.dataset.settled = String(Math.round(now - a.t0));
    pager.dataset.peak = a.type === 'tap' ? '0' : String(Math.max(0, a.peak));
  }

  function startSpring(target, v0, dir) {
    var speed = Math.abs(v0);
    // slow release: critically damped (no bounce). Fast: ramp toward the slider's damping ratio.
    var mix = Math.max(0, Math.min(1, (speed - 300) / (FAST - 300)));
    var zeta = 1 + (Z - 1) * mix;
    anim = { type: 'spring', target: target, v: v0, k: K, c: 2 * zeta * Math.sqrt(K), t0: performance.now(), peak: 0,
             dir: dir || (target >= pos ? 1 : -1) };
    pager.dataset.settled = ''; pager.dataset.zeta = zeta.toFixed(2);
    ensureLoop();
  }

  function goTo(idx) {
    var from = pos, to = idx * W;
    if (drag) return;
    if (Math.abs(from - to) < 0.5) return;
    if (reduce) { anim = null; pos = to; render(); $('sd').textContent = '0 ms (instant)'; $('po').textContent = '-'; pager.dataset.settled = '0'; return; }
    anim = { type: 'tap', from: from, to: to, t0: performance.now() };
    pager.dataset.settled = '';
    ensureLoop();
  }

  // ---------- pointer handling ----------
  pager.addEventListener('pointerdown', function (e) {
    if (drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
    anim = null;                                       // interrupt: catch the pages where they are
    var nearest = Math.max(0, Math.min(N - 1, Math.round(pos / W)));
    var pg = pages[nearest];
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, pos0: pos, startIdx: nearest, mode: 'undecided',
             samples: [{ t: performance.now(), p: pos }], raw: pos, scroll0: pg.scrollTop, page: pg, type: e.pointerType };
  });
  pager.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (drag.mode === 'undecided') {
      if (Math.hypot(dx, dy) < SLOP) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        drag.mode = 'h';
        try { pager.setPointerCapture(e.pointerId); } catch (_) {}
        // start tracking from the slop point so the pages do not jump; 1:1 from here
        drag.x0 = e.clientX; drag.pos0 = pos; dx = 0;
        drag.samples = [{ t: performance.now(), p: pos }];
      } else { drag.mode = 'v'; }
    }
    if (drag.mode === 'h') {
      drag.raw = drag.pos0 - dx;
      pos = withRubber(drag.raw);
      var now = performance.now();
      drag.samples.push({ t: now, p: drag.raw });
      while (drag.samples.length > 2 && now - drag.samples[0].t > 100) drag.samples.shift();
      render();
    } else if (drag.mode === 'v' && drag.type !== 'touch') {
      drag.page.scrollTop = drag.scroll0 - dy;       // touch scrolls natively via touch-action: pan-y
    }
  });
  function release(e, cancelled) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag; drag = null;
    if (d.mode !== 'h') { render(); return; }
    var now = performance.now();
    var s = d.samples, first = s[0], last = s[s.length - 1], v = 0;
    if (now - last.t < 80 && last.t > first.t) v = (last.p - first.p) / ((last.t - first.t) / 1000);
    var dist = d.raw - d.startIdx * W;
    var target = d.startIdx;
    if (!cancelled) {
      if (Math.abs(v) >= MIN_FLING) target = d.startIdx + (v > 0 ? 1 : -1);
      else if (Math.abs(dist) > W / 2) target = d.startIdx + (dist > 0 ? 1 : -1);
    }
    target = Math.max(0, Math.min(N - 1, Math.max(d.startIdx - 1, Math.min(d.startIdx + 1, target))));  // one page per fling
    $('rv').textContent = Math.round(v) + ' px/s';
    pager.dataset.release = String(Math.round(v)); pager.dataset.target = String(target);
    startSpring(target * W, v, target * W >= pos ? 1 : -1);
  }
  pager.addEventListener('pointerup', function (e) { release(e, false); });
  pager.addEventListener('pointercancel', function (e) { release(e, true); });

  // ---------- controls ----------
  function sync() {
    K = +$('k').value; Z = +$('z').value; reduce = $('rm').checked;
    $('kv').textContent = K; $('zv').textContent = Z.toFixed(2);
  }
  ['k', 'z', 'rm'].forEach(function (id) { $(id).addEventListener('input', sync); });
  sync();

  var mode = 'auto';
  $('theme').addEventListener('click', function () {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
      (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    mode = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', mode);
    this.textContent = 'Theme: ' + mode + ' (tap to toggle)';
  });

  render();
})();
</script>
</body>
</html>
