<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Languages I'm learning</title>
<meta name="description" content="The Languages I'm learning page and its sheets: a script-only course and a language with scripts, before and after learning starts, and the script switches. Hindustani and Bengali, light and dark, 1.4x text.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ===== The page around the phones (not the app) ===== */
:root{--page-bg:#F3F1EF;--page-fg:#1E1B1A;--page-muted:#57504D;--page-card:#FFFFFF;--page-line:#D6CFCC;--page-acc:#8F4C36}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page-bg:#121010;--page-fg:#ECE6E3;--page-muted:#B4ABA7;--page-card:#1D1A19;--page-line:#3A3331;--page-acc:#FFB59E}}
:root[data-theme="dark"]{--page-bg:#121010;--page-fg:#ECE6E3;--page-muted:#B4ABA7;--page-card:#1D1A19;--page-line:#3A3331;--page-acc:#FFB59E}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--page-bg);color:var(--page-fg);font-family:Roboto,"Noto Sans Devanagari","Noto Sans Bengali","Noto Naskh Arabic",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:28px 16px 72px}
h1{font-size:28px;line-height:36px;margin:0 0 8px;font-weight:700}
h2{font-size:20px;line-height:28px;margin:0 0 4px;font-weight:700}
.cap1{margin:0 0 16px;color:var(--page-muted);font-size:14px;max-width:820px}
.tw{display:flex;flex-wrap:wrap;gap:10px 24px;margin:0 0 14px}
.tg{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--page-muted);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--page-line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;min-height:40px;padding:0 14px;border:0;background:var(--page-card);color:var(--page-fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--page-acc);color:var(--page-bg);font-weight:600}
section.opt{margin:0 0 52px;padding-top:20px;border-top:1px solid var(--page-line)}
.frames{display:flex;flex-wrap:wrap;gap:20px 24px;align-items:flex-start}
.fcol{display:flex;flex-direction:column;gap:6px;width:360px;max-width:100%}
.fcap{font-size:13px;line-height:18px;font-weight:600;color:var(--page-muted)}
.sticky{position:sticky;top:0;z-index:20;background:var(--page-bg);padding:10px 0 4px;margin-bottom:12px;border-bottom:1px solid var(--page-line)}
.note{font-size:13px;color:var(--page-muted);margin:6px 0 14px;max-width:820px}
/* ===== The app: lib/ui/theme.dart (M3, Roboto; ColorScheme.fromSeed). Every size is calc(N px * var(--t)), t = 1.4, the app's text cap (#505). Icons do not scale. ===== */
.ph{--t:1.4;width:360px;max-width:100%;height:740px;border-radius:20px;overflow:hidden;position:relative;display:flex;flex-direction:column;
 background:var(--s);color:var(--onS);font-family:Roboto,"Noto Sans Devanagari","Noto Sans Bengali","Noto Naskh Arabic",sans-serif;
 box-shadow:0 0 0 1px var(--page-line);-webkit-font-smoothing:antialiased}
.ph button{font-family:inherit;color:inherit;cursor:pointer}
svg.i{width:24px;height:24px;fill:currentColor;display:block;flex:none}
.appbar{flex:none;min-height:56px;display:flex;align-items:center;padding:0 4px 0 8px;color:var(--onSv);gap:2px}
.appbar .ttl{flex:1;min-width:0;font-size:calc(20px*var(--t));line-height:1.2;font-weight:500;color:var(--onS);padding:0 8px}
.ib{width:48px;height:48px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:24px;padding:0;color:var(--onSv);flex:none}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 16px 16px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.script{font-family:"Noto Sans Devanagari","Noto Sans Bengali","Noto Naskh Arabic",Roboto,sans-serif}
.btn{min-height:calc(40px*var(--t));border-radius:calc(20px*var(--t));border:0;font-size:calc(14px*var(--t));line-height:1.2;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 20px}
.btn.fill{background:var(--p);color:var(--onP)}
.btn.tonal{background:var(--sc);color:var(--onSc)}
.btn.out{background:none;border:1px solid var(--ol);color:var(--p)}
.btn.full{width:100%}
/* list page */
.upd{margin:8px 0 0;align-self:flex-start;min-height:56px;padding:0 24px}
.last{font-size:calc(14px*var(--t));line-height:1.3;color:var(--onSv);margin:8px 0 6px}
.auto{display:flex;align-items:center;gap:12px;padding:4px 0}
.auto .tx{flex:1;min-width:0}
.auto b{display:block;font-size:calc(14px*var(--t));line-height:1.25;font-weight:600}
.auto small{display:block;font-size:calc(12px*var(--t));line-height:1.3;color:var(--onSv)}
.search{display:flex;align-items:center;gap:16px;min-height:56px;border-radius:28px;background:var(--sHigh);color:var(--onSv);padding:0 16px;margin:12px 0 8px;font-size:calc(16px*var(--t))}
.sec{font-size:calc(14px*var(--t));line-height:1.3;font-weight:700;color:var(--p);margin:16px 0 6px}
.row{padding:10px 0;border-top:1px solid var(--olv)}
.row:first-of-type{border-top:0}
.row .hd{gap:12px;display:flex;align-items:center;gap:8px;min-height:48px}
.row .nm{flex:1;min-width:0;font-size:calc(16px*var(--t));line-height:1.25;font-weight:600}
.row .st{padding-left:52px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 4px}
.tick{flex:none;width:32px;height:32px;border-radius:16px;background:var(--p);color:var(--onP);display:flex;align-items:center;justify-content:center;margin:0 8px 0 0}
.tick svg{width:20px;height:20px}
.badge{display:inline-flex;align-items:center;height:calc(24px*var(--t));padding:0 12px;border-radius:calc(8px*var(--t));font-size:calc(12px*var(--t));font-weight:700;background:var(--tc);color:var(--onTc)}
.you{font-size:calc(12px*var(--t));line-height:1.3;font-weight:700;color:var(--p)}
.sub{padding-left:52px;display:flex;align-items:center;font-size:calc(14px*var(--t));color:var(--onSv);min-height:48px;gap:8px}
.sub span:first-child{flex:1}
.mins{display:flex;justify-content:space-between;align-items:center;font-size:calc(16px*var(--t));min-height:48px}
.mins b{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px 8px;margin:4px 0 8px}
.chip{min-height:48px;min-width:56px;padding:0 16px;border-radius:12px;border:1px solid var(--ol);background:none;font-size:calc(14px*var(--t));font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip.on{background:var(--sc);color:var(--onSc);border-color:transparent}
.chip svg{width:18px;height:18px}
.est{font-size:calc(14px*var(--t));line-height:1.35;color:var(--onSv);margin:0 0 8px}
.meta{display:flex;align-items:center;gap:10px;padding-left:52px;margin:0 0 4px;min-height:36px;flex-wrap:wrap}
.meta .mn{display:inline-flex;align-items:center;gap:4px;font-size:calc(14px*var(--t));color:var(--onSv);font-weight:500}
.meta .mn svg{width:20px;height:20px}
.tile.sm{width:28px;height:28px;border-radius:14px;font-size:calc(13px*var(--t))}
.rbtn{flex:none;width:48px;height:48px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.rbtn span{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--p);color:var(--onP)}
.rbtn span.x{background:none;color:var(--onSv);box-shadow:inset 0 0 0 2px var(--ol)}
.rbtn svg{width:22px;height:22px}
.dl{padding-left:52px;display:flex;align-items:center;gap:12px;margin:0 0 4px}
.dl .bar{flex:1;margin:0}
.dl b{font-size:calc(14px*var(--t));font-variant-numeric:tabular-nums}
.stp{display:flex;align-items:center;gap:8px;margin:2px 0}
.stp button{flex:none;width:48px;height:48px;border-radius:24px;border:0;background:var(--sc);color:var(--onSc);display:flex;align-items:center;justify-content:center;padding:0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.stp button svg{width:24px;height:24px}
.stp button[aria-disabled="true"]{opacity:.38;cursor:default}
.stp .mv{flex:1;text-align:center;font-size:calc(20px*var(--t));font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.brow{display:flex;gap:12px;align-items:stretch}
.dbtn{flex:none;width:calc(48px*var(--t));min-height:calc(48px*var(--t));border-radius:calc(24px*var(--t));border:1px solid var(--ol);background:none;color:var(--E);display:flex;align-items:center;justify-content:center;padding:0}
.dbtn svg{width:24px;height:24px}
.dlg.chg{position:absolute}
.scrim2{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:5}
.dlg{position:absolute;z-index:6;left:16px;right:16px;top:50%;transform:translateY(-50%);background:var(--sHigh);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:12px}
.dlg h4{margin:0;font-size:calc(22px*var(--t));line-height:1.2;font-weight:500}
.dlg p{margin:0;font-size:calc(14px*var(--t));line-height:1.35;color:var(--onSv)}
.dlg label{font-size:calc(14px*var(--t));line-height:1.3;color:var(--onS)}
.dlg input{width:100%;min-height:56px;border-radius:4px;border:1px solid var(--ol);background:none;color:var(--onS);font:inherit;font-size:calc(16px*var(--t));padding:0 16px}
.dlg input:focus{outline:2px solid var(--p);outline-offset:0;border-color:var(--p)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.dlg .acts button{min-height:48px;border-radius:24px;border:0;background:none;color:var(--p);font-size:calc(14px*var(--t));font-weight:600;padding:0 16px}
.dlg .acts button.del{background:var(--E);color:var(--onE)}
.dlg .acts button.del:disabled{background:var(--sHst);color:var(--onSv);opacity:.6;cursor:default}
.bottom{flex:none;padding:12px 16px 16px;background:var(--sLow);box-shadow:0 -1px 0 var(--olv)}
.bottom.pg{background:var(--sMid)}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:3}
.sheet{position:absolute;z-index:4;left:0;right:0;bottom:0;background:var(--sLow);border-radius:28px 28px 0 0;display:flex;flex-direction:column;max-height:94%;color:var(--onS)}
.sheet .grab{flex:none;width:32px;height:4px;border-radius:2px;background:var(--onSv);opacity:.5;margin:10px auto 6px}
.sheet .scroll{padding:6px 20px 16px}
.sheet h3{margin:6px 0 8px;font-size:calc(20px*var(--t));font-weight:700;line-height:1.2}
.sheet .bottom{background:var(--sLow)}
.badges{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:0 0 4px}
.badges .meta{font-size:calc(14px*var(--t));color:var(--onS)}
.h{font-size:calc(14px*var(--t));line-height:1.3;font-weight:700;color:var(--p);margin:20px 0 8px}
.blk{margin:0 0 14px}
.lab{font-size:calc(14px*var(--t));line-height:1.3;font-weight:700;color:var(--onSv);margin:0}
.val{font-size:calc(16px*var(--t));line-height:1.35;margin:0}
.val.sm{font-size:calc(14px*var(--t));color:var(--onSv)}
.two{display:flex;align-items:center;gap:12px}
.two .tx{flex:1;min-width:0}
.cline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.cline i{display:block;height:6px;border-radius:3px;background:var(--sHst);overflow:hidden}
.cline i u{display:block;height:100%;background:var(--p);border-radius:3px}
.cline span{display:block;font-size:calc(12px*var(--t));font-weight:700;color:var(--onSv);margin-top:6px}
.bar{height:6px;border-radius:3px;background:var(--sHst);overflow:hidden;margin:6px 0 0}
.bar u{display:block;height:100%;background:var(--p);border-radius:3px}
.link{display:flex;align-items:center;gap:12px;min-height:56px;padding:4px 0}
.link .ic{flex:none;color:var(--onSv)}
.link .tx{flex:1;min-width:0}
.link .tx b{display:block;font-size:calc(16px*var(--t));line-height:1.25;font-weight:700}
.link .tx small{display:block;font-size:calc(14px*var(--t));color:var(--onSv);line-height:1.3}
.chev{color:var(--onSv)}
.tile{flex:none;width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:var(--sc);color:var(--onSc);font-size:calc(16px*var(--t));font-weight:600;line-height:1}
.tile svg{width:22px;height:22px}
.tile.p{background:var(--p);color:var(--onP)}
.tile.pc{background:var(--pc);color:var(--onPc)}
.tile.tc{background:var(--tc);color:var(--onTc)}
.tile.off{background:var(--sHst);color:var(--onSv)}
.kvr{display:flex;gap:14px;align-items:flex-start;margin:0 0 14px}
.kvr .blk{margin:0;flex:1;min-width:0}
.h{display:flex;align-items:center;gap:8px}
.h svg{width:20px;height:20px}
.badge.pc{background:var(--pc);color:var(--onPc)}
.cline div:nth-child(2) u{background:var(--tt)}
.cline div:nth-child(3) u{background:var(--onSc)}
.cline div:nth-child(1) span{color:var(--p)}
.cline div:nth-child(2) span{color:var(--tt)}
.cline div:nth-child(3) span{color:var(--onSc)}
.shared{font-size:calc(14px*var(--t));line-height:1.35;color:var(--onSv);margin:6px 0 0}
.off-note{font-size:calc(14px*var(--t));line-height:1.35;color:var(--onSv);margin:0 0 8px}
.srow{padding:8px 0;border-top:1px solid var(--olv)}
.srow:first-of-type{border-top:0}
.cb{flex:none;width:24px;height:24px;border-radius:4px;border:2px solid var(--onSv);display:flex;align-items:center;justify-content:center;background:none;padding:0}
.cb[aria-checked="true"]{background:var(--p);border-color:var(--p)}
.cb svg{width:18px;height:18px;fill:var(--onP);opacity:0}
.cb[aria-checked="true"] svg{opacity:1}
.nat{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 0}
/* M3 switch */
.sw{flex:none;width:52px;height:32px;border-radius:16px;border:2px solid var(--ol);background:var(--sHst);position:relative;padding:0;display:block}
.sw::after{content:"";position:absolute;top:50%;left:6px;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--ol);transition:all .12s}
.sw[aria-checked="true"]{background:var(--p);border-color:var(--p)}
.sw[aria-checked="true"]::after{left:24px;width:24px;height:24px;margin-top:-12px;left:22px;background:var(--onP)}
.swhit{flex:none;width:56px;height:48px;display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0}
/* highlight of what changed */
.chg{position:relative}
.hl-on .chg{outline:2px dashed var(--E);outline-offset:3px;border-radius:14px}
.hl-on .chg::after{content:"changed";position:absolute;top:-10px;right:6px;background:var(--E);color:var(--onE);font-size:11px;font-weight:700;line-height:1;padding:3px 6px;border-radius:6px;z-index:2;letter-spacing:.3px}
.hl-on .chg.new::after{content:"new"}
.hide{display:none!important}
</style></head>

</div>

function init(){

 const set=(k,v)=>{if(!ST[S.course+k])ST[S.course+k]=v.slice();return S.course+k};

function render(){

 frames.push(`<section class="opt"><h2>Delete data: ${c.name}</h2><div class="frames">${dialogPhone('Name not typed','d0',c.name,'',ll)}${dialogPhone('Name typed','d1',c.name,c.name,ll)}</div></section>`);

/* minutes a day: 5 to 60 in steps of 5; a long press repeats every 0.3 s */
const MN={min:5,max:60,step:5,tick:300};
function showMins(k){
 const v=S.mins[k];
 document.querySelectorAll(`.mv[data-k="${k}"]`).forEach(e=>e.textContent=v+' min');
 document.querySelectorAll(`.mn-v[data-k="${k}"]`).forEach(e=>e.textContent=v+' min');
 document.querySelectorAll(`.estv[data-k="${k}"]`).forEach(e=>e.textContent='About '+cards(v)+' cards');
 document.querySelectorAll(`[data-mn][data-k="${k}"]`).forEach(b=>b.setAttribute('aria-disabled',String(b.dataset.mn==='-'?v<=MN.min:v>=MN.max)));
}
function stepMins(k,d){const v=Math.min(MN.max,Math.max(MN.min,S.mins[k]+d*MN.step));if(v!==S.mins[k]){S.mins[k]=v;showMins(k)}}
let hold=null,held=false;
function stopHold(){clearInterval(hold);clearTimeout(hold);hold=null}
document.addEventListener('pointerdown',e=>{
 const b=e.target.closest('[data-mn]');if(!b)return;
 const k=b.dataset.k,d=b.dataset.mn==='+'?1:-1;held=true;stepMins(k,d);stopHold();
 hold=setTimeout(()=>{hold=setInterval(()=>stepMins(k,d),MN.tick)},MN.tick);
});
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t,e=>{if(hold!=null&&(t!=='pointerleave'||e.target.closest&&e.target.closest('[data-mn]')))stopHold()},true));
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-mn]'))e.preventDefault()});
document.addEventListener('input',e=>{
 const i=e.target.closest('[data-ty]');if(!i)return;
 TY[i.dataset.ty]=i.value;
 const d=document.querySelector(`[data-del="${i.dataset.ty}"]`);if(d)d.disabled=i.value!==i.dataset.name;
});
document.addEventListener('click',e=>{
 const m=e.target.closest('[data-mn]');
 if(m){if(held){held=false}else stepMins(m.dataset.k,m.dataset.mn==='+'?1:-1);return}
 const gb=e.target.closest('#g-tw .seg button');
 if(gb){S[gb.parentNode.dataset.k]=gb.dataset.v;render();return}
 const s=e.target.closest('[data-sw]');
 if(s){const [id,i]=s.dataset.sw.split(':');ST[id][+i]=!ST[id][+i];render()}
});
render();
/* ===== contrast self-check: console only ===== */
function lum(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function cr(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
const PAIRS=[['body text on the sheet','onS','sLow',4.5],['label and value text on the sheet','onSv','sLow',4.5],['section heading and You: line','p','sLow',4.5],['section heading on the page','p','s',4.5],['badge','onTc','tc',4.5],['tonal button','onSc','sc',4.5],['filled button','onP','p',4.5],['outlined button text','p','sLow',4.5],['hint text on the page','onSv','s',4.5],['search hint','onSv','sHigh',4.5],['switch thumb on, on its track','onP','p',3],['switch thumb off, on its track','ol','sHst',3],['switch track outline off','ol','sLow',3],['progress fill on its track','p','sHst',3],['chip outline','ol','s',3],['Delete data bin on the sheet','E','sLow',3],['Delete button text','onE','E',4.5],['input outline','ol','sHigh',3],['dialog body text','onSv','sHigh',4.5],['stepper icon on its button','onSc','sc',4.5],['check on its round button','onP','p',3],['Complete badge, icon on its tile','onPc','pc',4.5],['script glyph, learning','onP','p',4.5],['script glyph, off','onSv','sHst',4.5],['A2 segment on its track','tt','sHst',3],['B1 segment on its track','onSc','sHst',3],['A2 label','tt','sLow',3],['B1 label','onSc','sLow',3]];
window.__contrast=[];
['clay','forest'].forEach(pl=>['light','dark'].forEach(t=>PAIRS.forEach(([n,f,b,need])=>{const P=PALS[pl+'_'+t];const r=cr(P[f],P[b]);window.__contrast.push({seed:pl,theme:t,pair:n,fg:f,bg:b,ratio:+r.toFixed(2),need,pass:r>=need})})));
console.log('contrast',JSON.stringify(window.__contrast));
</script>
