# The citations the Research and standards page shows (#214, #286).
#
# Read by the app (lib/core/data/citations.dart) and by the tools' test
# (tools/check_citations.py), which apply the same rules. One list, in
# groups: the standards the app follows, then the research behind the design.
# The decks' own sources come from the decks, not from here (ADR-0062).
#
# A citation is `checked: true` only once it has been compared with the
# publisher's own record. Every research entry below came from abstracts and
# summaries (docs/research/skill-evidence-claims.json) and is unchecked. The
# page says so beside each line. `confidence` is the note the research
# carried, kept as data; the page does not grade the science.
#
# `appliesWhen` on a group names an app feature (the Feature enum's name);
# the group shows only while that feature is visible.
#
# Strings are quoted; `schema` and `checked` are a number and a boolean.
