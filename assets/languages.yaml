# The languages a learner can say they know, on first launch and in Settings
# (#53, #490). A fork or a contributor adds one by adding an entry here: no
# code change. The list is India's 22 scheduled languages, English, the
# widely spoken ones beside them, and every language a course path teaches
# or plans (#613, #959). Planned languages are listed with no decks yet
# (owner, 2026-10-31, #959: "the 40+ list", with Latin, Old English and
# Middle English added; 2026-11-01: all 65 entries): the living ones, the
# ancient and reconstructed ones (Mycenaean Greek, Sumerian, Egyptian,
# Proto-Indo-European, Vedic Sanskrit, Latin, Old and Middle English, the
# Archaic, Classical Attic and Koine stages of Ancient Greek, Pali, Imperial
# Aramaic and Ashokan Prakrit; owner, 2026-11-01), two
# sign languages and the constructed ones of fiction. This replaces the
# "spoken ones only" rule of 2026-10-23. A language with no course is shown
# on Add a language as having none yet.
#
#   code, iso639_3  the code decks use, and its ISO 639-3 code
#   name, own_name  its English name, and its name for itself (in its script)
#   scripts         the scripts it is written in, as deck files name them
#                   (`latin`, `bengali`), its own first: the one its courses
#                   are written in, which the review-pair rule compares (#551).
#                   Languages you know asks which of them the learner reads.
#                   A script's name is the app's (`bengali` is Eastern
#                   Nagari), never the language's: see `scriptName` in
#                   lib/l10n/app_en.arb, where a new script is named too.
#   aliases         optional: other names a search finds it by, such as
#                   "Urdu" for Hindustani, which has no entry of its own
#                   (#623)
#   family          indo_aryan, dravidian, tibeto_burman, austroasiatic,
#                   germanic, romance, sinitic, koreanic, japonic,
#                   constructed, slavic, hellenic, italic, celtic, uralic,
#                   turkic, afroasiatic, austronesian, kra_dai, niger_congo,
#                   quechuan, indo_european, isolate or sign: the folded
#                   group it is listed in. A new family is named in
#                   `knownFamily` in lib/l10n/app_en.arb and listed in
#                   `_families` in lib/features/languages/add_language_page.dart.
#   code            two or three letters. A language with no ISO 639-1 code
#                   uses its 639-3 code; one with no ISO code at all (Dothraki,
#                   High Valyrian) takes a private-use code, qaa to qtz, as
#                   English Braille's `qbe` does. ISO 639-3 has the one code
#                   `grc` for all Ancient Greek, so the Classical Attic
#                   course takes it, and Archaic (Homeric) Greek, Koine
#                   Greek and Ashokan Prakrit take `qgh`, `qgk` and `qap`
#                   (owner, 2026-11-01). `brahmi`, the script of Ashoka's
#                   inscriptions, is named in the app; it has no font yet,
#                   so Ashokan Prakrit is written in Devanagari for now.
#   scripts omitted a sign language has no written script of its own here:
#                   leave `scripts` out.
#   dialect         optional: the one dialect the app teaches, by its proper
#                   name, shown on the Languages page above Speak and Hear
#                   (#907). Without it the page says "Standard" and the
#                   language's name. A name the course does not state is the
#                   widely accepted name of the standard variety it teaches,
#                   for the owner or a native reviewer to confirm.
#   script_only     optional, `true` for a course that teaches a script and
#                   no speech (English Braille): Read and Write only.
#   script_question, script_can_read
#                   optional: the sheet's question and its "I can read it"
#                   answer, written in the language's own script by a speaker
#                   of it, never put together from parts. Without them the
#                   sheet asks in English only, until they are written.
#   scripts_question, script_can_read (a map)
#                   for a language written in several scripts, the sheet's
#                   heading ("Which scripts do you read X in?") and one
#                   "I can read it" answer per script key, in the language's
#                   own first script (#552). A script with no answer is
#                   asked in English.
#
#   script_text     optional: `"unchecked"` marks an entry's texts above as
#                   written by Claude (#552), not by a speaker: not yet
#                   checked by a speaker. It no longer hides them. The sheet
#                   shows every language's own-script texts, checked or not,
#                   each with its English under it, and marks nothing
#                   (owner, 2026-10-18: "The script questions are still in
#                   latin script. Why! Fix this right away"; this replaces
#                   2026-10-17's "English for all unchecked"). A speaker who
#                   has checked and corrected the texts removes the mark.
#
# The texts marked "Claude-written" were written by Claude (#552), not by a
# speaker: each is to be checked by a speaker of the language, as deck text
# is, and corrected here.
