# The languages a learner can say they speak, on first launch and in
# Settings (#53). A fork or a contributor adds one by adding an entry here:
# no code change. `own_name` is the language's name for itself, shown beside
# its English name. `script` is the script it is written in, as decks name it
# (`latin`, `bengali`): Languages you know asks whether the learner reads it.
schema: 1
kind: languages
languages:
  - { code: en, iso639_3: eng, name: "English", own_name: "English", script: "latin" }
  - { code: bn, iso639_3: ben, name: "Bengali", own_name: "বাংলা", script: "bengali" }
  - { code: hi, iso639_3: hin, name: "Hindi", own_name: "हिन्दी", script: "devanagari" }
