# The languages a learner can say they know, on first launch and in Settings
# (#53, #490). A fork or a contributor adds one by adding an entry here: no
# code change. The list is India's 22 scheduled languages, English, and the
# widely spoken ones beside them.
#
#   code, iso639_3  the code decks use, and its ISO 639-3 code
#   name, own_name  its English name, and its name for itself (in its script)
#   scripts         the scripts it is written in, as deck files name them
#                   (`latin`, `bengali`), its own first: the one its courses
#                   are written in, which the review-pair rule compares (#551).
#                   Languages you know asks which of them the learner reads.
#                   A script's name is the app's (`bengali` is Eastern
#                   Nagari), never the language's: see `scriptName` in
#                   lib/l10n/app_en.arb, where a new script is named too.
#   family          indo_aryan, dravidian, tibeto_burman, austroasiatic or
#                   germanic: the folded group it is listed in
#   script_question, script_can_read
#                   optional: the sheet's question and its "I can read it"
#                   answer, written in the language's own script by a speaker
#                   of it, never put together from parts. Without them the
#                   sheet asks in English, a fallback until they are written.
#   scripts_question, script_can_read (a map)
#                   for a language written in several scripts, the sheet's
#                   heading ("Which scripts do you read X in?") and one
#                   "I can read it" answer per script key, in the language's
#                   own first script (#552). A script with no answer is
#                   asked in English.
#
# The texts marked "Claude-written" were written by Claude (#552), not by a
# speaker: each is to be checked by a speaker of the language, as deck text
# is, and corrected here. The marked entries are the ones not yet checked.
schema: 1
kind: languages
languages:
  - { code: "en", iso639_3: "eng", name: "English", own_name: "English", scripts: ["latin"], family: "germanic",
