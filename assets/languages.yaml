# The languages a learner can say they know, on first launch and in Settings
# (#53, #490). A fork or a contributor adds one by adding an entry here: no
# code change. The list is India's 22 scheduled languages, English, and the
# widely spoken ones beside them.
#
#   code, iso639_3  the code decks use, and its ISO 639-3 code
#   name, own_name  its English name, and its name for itself (in its script)
#   scripts         the scripts it is written in, as deck files name them
#                   (`latin`, `bengali`), its own first: the one its courses
#                   are written in, which the review-pair rule compares (#551).
#                   Languages you know asks which of them the learner reads.
#                   A script's name is the app's (`bengali` is Eastern
#                   Nagari), never the language's: see `scriptName` in
#                   lib/l10n/app_en.arb, where a new script is named too.
#   family          indo_aryan, dravidian, tibeto_burman, austroasiatic or
#                   germanic: the folded group it is listed in
#   script_question, script_can_read
#                   optional: the sheet's question and its "I can read it"
#                   answer, written in the language's own script by a speaker
#                   of it, never put together from parts. Without them the
#                   sheet asks in English, a fallback until they are written.
schema: 1
kind: languages
languages:
  - { code: "en", iso639_3: "eng", name: "English", own_name: "English", scripts: ["latin"], family: "germanic",
      script_question: "Can you read the English script?", script_can_read: "I can read the English script" }
  - { code: "bn", iso639_3: "ben", name: "Bengali", own_name: "বাংলা", scripts: ["bengali"], family: "indo_aryan",
      script_question: "আপনি কি বাংলা লিপি পড়তে পারেন?", script_can_read: "আমি বাংলা লিপি পড়তে পারি" }
  - { code: "hi", iso639_3: "hin", name: "Hindi", own_name: "हिन्दी", scripts: ["devanagari"], family: "indo_aryan",
      script_question: "क्या आपको हिंदी लिपि पढ़नी आती है?", script_can_read: "मुझे हिंदी लिपि पढ़नी आती है" }
  - { code: "as", iso639_3: "asm", name: "Assamese", own_name: "অসমীয়া", scripts: ["bengali"], family: "indo_aryan" }
  - { code: "brx", iso639_3: "brx", name: "Bodo", own_name: "बड़ो", scripts: ["devanagari"], family: "tibeto_burman" }
  - { code: "doi", iso639_3: "doi", name: "Dogri", own_name: "डोगरी", scripts: ["devanagari"], family: "indo_aryan" }
  - { code: "gu", iso639_3: "guj", name: "Gujarati", own_name: "ગુજરાતી", scripts: ["gujarati"], family: "indo_aryan" }
  - { code: "kn", iso639_3: "kan", name: "Kannada", own_name: "ಕನ್ನಡ", scripts: ["kannada"], family: "dravidian" }
  - { code: "ks", iso639_3: "kas", name: "Kashmiri", own_name: "کٲشُر", scripts: ["arabic", "devanagari"], family: "indo_aryan" }
  - { code: "kok", iso639_3: "kok", name: "Konkani", own_name: "कोंकणी", scripts: ["devanagari", "kannada", "malayalam"], family: "indo_aryan" }
  - { code: "mai", iso639_3: "mai", name: "Maithili", own_name: "मैथिली", scripts: ["devanagari"], family: "indo_aryan" }
  - { code: "ml", iso639_3: "mal", name: "Malayalam", own_name: "മലയാളം", scripts: ["malayalam"], family: "dravidian" }
  - { code: "mni", iso639_3: "mni", name: "Manipuri", own_name: "মৈতৈলোন্", scripts: ["bengali", "meitei_mayek"], family: "tibeto_burman" }
  - { code: "mr", iso639_3: "mar", name: "Marathi", own_name: "मराठी", scripts: ["devanagari"], family: "indo_aryan" }
  - { code: "ne", iso639_3: "npi", name: "Nepali", own_name: "नेपाली", scripts: ["devanagari"], family: "indo_aryan" }
  - { code: "or", iso639_3: "ory", name: "Odia", own_name: "ଓଡ଼ିଆ", scripts: ["odia"], family: "indo_aryan" }
