  - { code: "sa", iso639_3: "san", name: "Sanskrit", own_name: "संस्कृतम्", scripts: ["devanagari"], family: "indo_aryan" }
  - { code: "sat", iso639_3: "sat", name: "Santali", own_name: "ᱥᱟᱱᱛᱟᱲᱤ", scripts: ["ol_chiki", "latin", "devanagari", "bengali"], family: "austroasiatic" }
  - { code: "sd", iso639_3: "snd", name: "Sindhi", own_name: "سنڌي", scripts: ["arabic", "devanagari"], family: "indo_aryan" }
