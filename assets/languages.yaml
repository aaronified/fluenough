# The languages a learner can say they know, on first launch and in Settings
# (#53, #490). A fork or a contributor adds one by adding an entry here: no
# code change. The list is India's 22 scheduled languages, English, and the
# widely spoken ones beside them.
#
#   code, iso639_3  the code decks use, and its ISO 639-3 code
#   name, own_name  its English name, and its name for itself (in its script)
#   script          the script its courses are written in, as deck files name
#                   it (`latin`, `bengali`): Languages you know asks whether
#                   the learner reads it, and the review-pair rule compares it
#   family          indo_aryan, dravidian, tibeto_burman, austroasiatic or
#                   germanic: the folded group it is listed in
#   script_question, script_can_read
#                   optional: the sheet's question and its "I can read it"
#                   answer, written in the language's own script by a speaker
#                   of it, never put together from parts. Without them the
#                   sheet asks in English, a fallback until they are written.
schema: 1
kind: languages
languages:
  - { code: "en", iso639_3: "eng", name: "English", own_name: "English", script: "latin", family: "germanic",
      script_question: "Can you read the English script?", script_can_read: "I can read the English script" }
  - { code: "bn", iso639_3: "ben", name: "Bengali", own_name: "বাংলা", script: "bengali", family: "indo_aryan",
      script_question: "আপনি কি বাংলা লিপি পড়তে পারেন?", script_can_read: "আমি বাংলা লিপি পড়তে পারি" }
  - { code: "hi", iso639_3: "hin", name: "Hindi", own_name: "हिन्दी", script: "devanagari", family: "indo_aryan",
