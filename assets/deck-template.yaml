  #   target: "बाज़ार"
  #   native: "market"
  #   reading: "bāzār"
  #   pos: "noun"
  #   # Gender, on a noun: one of the language's classes (Hindi: m or f).
  #   # Leave it out in a language without gender, such as Bengali.
  #   gender: "m"
  #   # A word that is its own root says so.
  #   bases: "self"
