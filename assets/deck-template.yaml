  #   # Examples: sentences that use the word, each with its meaning and
  #   # reading. A word card is to have at least 2. One taken from
  #   # elsewhere, such as Tatoeba, names where in its source.
  #   examples:
  #     - { target: "मैं ठीक हूँ।", native: "I am fine.", reading: "maim̐ ṭhīk hūm̐." }
  #     - { target: "मैं घर जाता हूँ।", native: "I go home.", reading: "maim̐ ghar jātā hūm̐.", source: "https://tatoeba.org/en/sentences/show/<n>" }
