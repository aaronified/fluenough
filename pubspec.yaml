name: fluenough
description: >-
  Language-agnostic drilling for basic language skills: recognition,
  production, listening and grammar, scheduled by spaced repetition.
publish_to: none
version: 0.7.0+27

# Verified against Flutter 3.47.1 / Dart 3.13.1 (stable, 2026-08-19).
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # Interface strings are tokens, never literals — see ADR-0006. `intl: any`
  # is deliberate: flutter_localizations pins it, and naming a version here
  # only creates a conflict to resolve on every SDK bump.
  flutter_localizations:
    sdk: flutter
  intl: any

  # Local database: cards, scheduling state, append-only review log.
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  # The Decks search's FTS5 index (#527, ADR-0049) opens its own in-memory
  # database. drift already depends on it, so the version is left to drift's.
  sqlite3: any
  http: ^1.6.0

  # Text to speech. Wraps android.speech.tts and AVSpeechSynthesizer.
  flutter_tts: ^4.2.5

  # Deck parsing. Decks are authored as YAML, see docs/DECK-FORMAT.md.
  yaml: ^3.1.4

  # Deck import/export from the device filesystem.
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  speech_to_text: ^7.5.0
  record: ^7.1.1
  audioplayers: ^6.8.1

  # Reads the phone's media volume, so that a listening card can ask for it
  # to be raised rather than play into silence. Agreed with the maintainer
  # (ADR-0026).
  flutter_volume_controller: ^2.0.2

  # Opens links in the browser: the issues page, HeliBoard, and the release
  # page when an update cannot install. Agreed with the maintainer for the
  # update check (ADR-0017).
  url_launcher: ^6.3.2

  # Downloads the newest release's APK into the app's own storage and opens
  # Android's installer on it. Agreed with the maintainer (ADR-0017).
  ota_update: ^7.1.0

  # The daily reminder's local notifications (#90). Agreed with the owner
  # (2026-10-30): the plugin, scheduled inexactly with no exact-alarm
  # permission, and timezone, which its zonedSchedule takes. Pinned to
  # releases at least two weeks old. Reached only through
  # lib/app/plugin_reminder_scheduler.dart, which only lib/main.dart imports,
  # so the web build never compiles it.
  flutter_local_notifications: 22.3.2
  timezone: 0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.4.0
  # analyzer 14.5.0 (2026-10-06) removed a setter build_runner 2.16.1 uses, so
  # build_runner no longer compiles. Remove this bound once a build_runner
  # release supports it.
  analyzer: ">=14.0.0 <14.5.0"

flutter:
  uses-material-design: true
  # Builds AppLocalizations from lib/l10n/*.arb on `flutter pub get`.
  generate: true
  # The decks are not bundled: the app downloads them from the repository's
  # main branch, by decks/index.json (#210, ADR-0037). Only the theme list
  # and the spoken languages ship inside the app.
  assets:
    # The release notes' source, read at the first launch after an update for
    # the "What's new" sheet (#944); the release workflow dates its section
    # before it builds.
    - CHANGELOG.md
    - assets/deck-template.yaml
    - assets/languages.yaml
    - assets/voice_apps.yaml
    - assets/pictures/
    - assets/synonyms/en.yaml
    - decks/themes.yaml
  # Braille's shadow-dot font (#835, ADR-0043): every cell drawn with all its
  # positions, raised dots solid, unraised ones rings. Bundled, not
  # downloaded, since braille can appear in any deck's notes. Built by
  # tools/make_braille_font.py.
  fonts:
    # The interface font, bundled so that it looks the same on every phone:
    # on Android, Flutter asks the phone for "Roboto", and some phones answer
    # with another font (wide word gaps after a One UI update). Apache-2.0,
    # assets/fonts/ROBOTO-LICENSE.txt.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: FluenoughBraille
      fonts:
        - asset: assets/fonts/BrailleShadow.ttf
