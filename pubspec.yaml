name: fluenough
description: >-
  Language-agnostic drilling for basic language skills: recognition,
  production, listening and grammar, scheduled by spaced repetition.
publish_to: none
version: 0.1.0+1

# Verified against Flutter 3.47.1 / Dart 3.13.1 (stable, 2026-08-19).
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # Local database: cards, scheduling state, append-only review log.
  drift: ^2.35.0
  drift_flutter: ^0.3.1

  # Text to speech. Wraps android.speech.tts and AVSpeechSynthesizer.
  flutter_tts: ^4.2.5

  # Deck parsing. Decks are authored as YAML, see docs/DECK-FORMAT.md.
  yaml: ^3.1.4

  # Deck import/export from the device filesystem.
  path_provider: ^2.1.6
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - decks/
