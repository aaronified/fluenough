# The order German is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner
# from English is taught de-en-home for de-home (ADR-0013, ADR-0036).
#
# This is also German's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"): every
# unit from the first words to B1, with its size in words, its grammar
# topics, the three milestones, and for each planned unit its listening and
# reading passages. No German deck is written yet, so every unit is
# planned: the course teaches each as "Coming" until its deck is written.
# Sizes follow the plan's levels (about 700, 900 and 1,200 words; low
# confidence) and are one number for every native language. German is FSI
# category II (docs/plans/language-paths.md: 900 hours, x1.5): the tier
# stretches the days a level takes, not the words in it, and the Goethe and
# telc word lists for A1, A2 and B1 (about 650, 1,300 and 2,400 words in)
# agree with the plan's sizes. A theme named here that decks/themes.yaml
# does not list yet is added to it with its first deck.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"):
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units;
# 3. no script units: German is written in Latin letters. Its four extra
#    letters, ä ö ü and ß, are taught in the script guide (de-script.yaml)
#    and the sounds unit, not in alphabet decks, so `alphabet` is empty;
# 4. a core of about 200 common words in themed units, before the large
#    tables ("Yes, smaller (~200)");
# 5. rules as forms: articles and gender, noun plurals, sein and haben, the
#    present, verb-second order, negation, then the cases, practised on the
#    words already known;
# 6. sentences, each after its words and rules; then the other themes,
#    each its words, then its rules, then its sentences.
# German's grammar keeps the Germanic order of
# docs/plans/language-paths-scheme.md within each level: articles and
# gender, verb-second order, the present, modals, separable verbs, the
# perfect, subordinate clause order, the passive; with German's
# adjustments, "4 cases after articles; adjective endings late". So the
# nominative and accusative come in A1 after the articles, the dative in
# A1 with the prepositions, the two-way prepositions in A2, the genitive
# in B1; the adjective endings close A2, and the endings with no article
# and the weak nouns come in B1.
#
# The course teaches the standard German of Germany. Austrian and Swiss
# standard words (Jänner, Paradeiser, Velo, grüezi) are given in region
# notes on the cards that differ, and gathered in B1's last unit,
# de-varieties. Which standard to teach is to confirm with the owner and a
# native reviewer.
#
# The core's order is by judgement, most common first: about me, everyday
# verbs, the common adverbs and function words, how much and how many,
# describing words, where things are, more verbs. It was meant to come from
# Wikipedia's counts (tools/wikipedia_frequency.py, #516); no German
# Wikipedia dump was fetched here (2026-10-18): order the core again from
# the counts once they are written.
#
# A planned unit holds one core id. Where a written unit will hold more
# than one deck, as Telugu's do, the others are named in a comment over
# the unit they join; a theme's sentence deck, de-<theme>-sentences, joins
# its theme's unit once written.
#
# Every deck of German is listed exactly once.
schema: 1
kind: "path"
id: "de-path"
language: "de"
# The gender classes a noun's gender is one of (#512; DECK-FORMAT.md, Card
# data): masculine der, feminine die and neuter das. A plural takes no
# gender of its own.
genders: ["m", "f", "n"]
# Where German is spoken, for a rater's region and a card's region note
# (ADR-0036): Germany in its three dialect areas (Low German in the north,
# Central German, Upper German in the south), then Austria and Switzerland,
# whose standard German has words and forms of its own. Each is named with
# example cities so that a rater can place themselves. Low confidence at
# the edges (Berlin, Vorarlberg, South Tyrol, Liechtenstein, Luxembourg and
# eastern Belgium): a native reviewer checks this list before any rating
# names a region. The ids are permanent, as card ids are; rename a name,
# never an id. The app adds "Elsewhere" after them.
regions:
  - id: "germany-north"
    name: { "en": "Northern Germany (Hamburg, Bremen, Hanover, Kiel, Rostock)" }
  - id: "germany-central"
    name: { "en": "Central Germany (Cologne, Frankfurt, Leipzig, Dresden, Berlin)" }
  - id: "germany-south"
    name: { "en": "Southern Germany (Munich, Stuttgart, Nuremberg, Freiburg)" }
  - id: "austria"
    name: { "en": "Austria (Vienna, Graz, Linz, Innsbruck)" }
  - id: "switzerland"
    name: { "en": "Switzerland (Zurich, Bern, Basel, Lucerne)" }
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  # 1. The phrasebook, taught whole from the first lesson.
  # de-first-words joins it when written.
  # The first words are written: de-first-words is taught with the
  # phrasebook (10 words).
  - decks: ["de-phrasebook", "de-first-words", "*"]
    words: 10
  # 2. The first word units. The sounds English lacks first: ü and ö, the
  # two sounds of ch, the long and short vowels, and the final -b, -d and -g
  # said as p, t and k.
  - planned: { id: "de-sound-differences", grammar: "sound-differences", words: 12 }
    listening_passages:
      - { id: "sounds-alike", text: { "en": "Pairs said one after the other: schon and schön, Mutter and Mütter, Stadt and Staat" } }
    reading_passages:
      - { id: "umlaut-words", text: { "en": "A short list of everyday words spelled with ä, ö, ü and ß" } }
  - planned: { id: "de-questions", theme: "questions", words: 15 }
    listening_passages:
      - { id: "asking-around", text: { "en": "Asking who, what, where and when at a station" } }
    reading_passages:
      - { id: "tourist-leaflet", text: { "en": "A leaflet answering the questions a visitor asks" } }
  - planned: { id: "de-addressing", theme: "addressing", words: 15 }
    listening_passages:
      - { id: "du-or-sie", text: { "en": "Greeting a neighbour's child with du and an older stranger with Sie" } }
    reading_passages:
      - { id: "name-badges", text: { "en": "Name badges at a meeting, with Herr, Frau and surnames" } }
  - planned: { id: "de-pronouns", theme: "pronouns", words: 20 }
    listening_passages:
      - { id: "who-is-who", text: { "en": "Pointing out who is who at a family gathering: he, she, they" } }
    reading_passages:
      - { id: "seating-chart", text: { "en": "A seating chart for a party, with names and who sits where" } }
  - planned: { id: "de-family", theme: "family", words: 30 }
    listening_passages:
      - { id: "my-family", text: { "en": "Someone describes the people in a family photo" } }
    reading_passages:
      - { id: "family-tree", text: { "en": "A small family tree with names and relations" } }
  - planned: { id: "de-numbers-1-20", theme: "numbers-1-20", words: 20 }
    listening_passages:
      - { id: "counting-aloud", text: { "en": "Counting objects aloud, from one to twenty" } }
    reading_passages:
      - { id: "room-numbers", text: { "en": "Room numbers on a row of doors" } }
  # 3. No script units: German is written in Latin letters.
  # 4. The core: about 200 common words, most common first (by judgement
  # until the Wikipedia counts are written, #516).
  - planned: { id: "de-about-me", theme: "about-me", words: 25 }
    listening_passages:
      - { id: "introducing-yourself", text: { "en": "Introducing yourself to a new classmate" } }
    reading_passages:
      - { id: "registration-form", text: { "en": "A simple registration form: name, age, country, language" } }
  - planned: { id: "de-everyday-verbs", theme: "everyday-verbs", words: 40 }
    listening_passages:
      - { id: "morning-routine", text: { "en": "A father says what each person in the house does in the morning" } }
    reading_passages:
      - { id: "fridge-note", text: { "en": "A note on the fridge: what to eat, what to drink and where things are" } }
  - planned: { id: "de-adverbs", theme: "adverbs", words: 35 }
    listening_passages:
      - { id: "how-often", text: { "en": "Saying how often and how well things are done" } }
    reading_passages:
      - { id: "habit-survey", text: { "en": "A short survey about everyday habits" } }
  - planned: { id: "de-quantities", theme: "quantities", words: 25 }
    listening_passages:
      - { id: "at-the-bakery", text: { "en": "Asking how much and how many at a bakery counter" } }
    reading_passages:
      - { id: "recipe-amounts", text: { "en": "A recipe card with amounts" } }
  - planned: { id: "de-describing", theme: "describing", words: 40 }
    listening_passages:
      - { id: "how-are-you-feeling", text: { "en": "A friend asks how you feel today, and you answer" } }
    reading_passages:
      - { id: "postcard-from-the-sea", text: { "en": "A short postcard from the Baltic coast: the weather and the food" } }
  - planned: { id: "de-location", theme: "location", words: 15 }
    listening_passages:
      - { id: "where-are-my-keys", text: { "en": "Looking for keys: here, there, inside, outside, above, below" } }
    reading_passages:
