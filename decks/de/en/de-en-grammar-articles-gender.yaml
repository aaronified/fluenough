name: "Articles and gender"
license: "CC-BY-SA-4.0"
description: "The words for the and a with 25 nouns taught so far: der, die, das, ein and eine, and die in the plural. Each row shows one thing with the, one thing with a, and more than one with the, all in the nominative. Not yet checked by a German speaker: please report any mistake."
pattern:
  name: "The article, gender and number"
  slot_name: "form"
  slots:
    "def-sg": "the, one (der, die, das)"
    "indef-sg": "a or an (ein, eine)"
    "def-pl": "the, more than one (die)"
  entries:
    "vater": "father"
    "bruder": "brother"
    "sohn": "son"
    "name": "name (plural Namen)"
    "freund": "friend (man or boy)"
    "geburtstag": "birthday"
    "kollege": "colleague (man)"
    "nachbar": "neighbour (man)"
    "mutter": "mother"
    "schwester": "sister"
    "tochter": "daughter"
    "tante": "aunt"
    "frau": "woman; wife"
    "familie": "family"
    "stadt": "city; town"
    "adresse": "address"
    "sprache": "language"
    "freundin": "friend (woman or girl); girlfriend"
    "kollegin": "colleague (woman)"
    "nummer": "number"
    "kind": "child"
    "maedchen": "girl (neuter, though it means a girl)"
    "land": "country; land"
    "dorf": "village"
    "foto": "photo"
  notes: "Every German noun has a gender, masculine, feminine or neuter, and the word for the and for a changes with it. In the nominative, the case of the word that does the verb, masculine takes der and ein (der Vater, ein Vater), feminine die and eine (die Mutter, eine Mutter), neuter das and ein (das Kind, ein Kind). In the plural, every gender takes die (die Väter, die Mütter, die Kinder). Ein has no plural, as English a has none: say the noun alone, or use kein. Learn each noun with its word for the: Wiktionary's declension table for every noun here gives its gender and plural. A few endings tell the gender, as Wikipedia's page on gender in German lists: nouns ending in -in are feminine (die Freundin, die Kollegin), and nouns ending in -chen or -lein are neuter (das Mädchen), so das Mädchen is neuter although it means a girl. Most nouns, such as Vater, Stadt and Land, show no such sign, and the gender is learned with the word. Wikipedia's page on German declension explains the case system. Sources: en.wiktionary's declension table of each noun, and the Wikipedia pages Grammatical gender in German and German declension."
