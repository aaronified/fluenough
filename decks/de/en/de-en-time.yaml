    native: "today"
    notes:
      "n1": "Heute is today. Heute is an adverb: it has no article and no plural."
    examples:
      "Ich bin heute hier.":
        native: "I am here today."
        bases:
          "Ich": "I"
          "bin": "to be (I am)"
          "heute": "today"
          "hier": "here"
      "Du bist heute da.":
        native: "You are there today."
        bases:
          "Du": "you"
          "bist": "to be (you are)"
          "heute": "today"
          "da": "there"
