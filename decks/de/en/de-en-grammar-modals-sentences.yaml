schema: 1
id: "de-en-grammar-modals-sentences"
kind: "layer"
core: "de-grammar-modals-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Modal verbs in sentences"
license: "CC-BY-SA-4.0"
description: "25 short sentences with modal verbs, written from the table. Not yet checked by a German speaker: please report any mistake."
cards:
  "de-4500":
    native: "I can wait here."
    notes:
      "n1": "Können: ich kann; the infinitive warten goes to the end."
  "de-4501":
    native: "Can you cook?"
    notes:
      "n1": "In a yes or no question the modal comes first and the infinitive stays last."
  "de-4502":
    native: "He can cook well."
    notes:
      "n1": "Er kann has no ending, the same as ich kann."
  "de-4503":
    native: "We can stay here."
    notes:
      "n1": "Können: wir können is the infinitive."
  "de-4504":
    native: "You can sleep here."
    notes:
      "n1": "Können: ihr könnt."
    bases:
      "Ihr": "you (plural); her; their"
  "de-4505":
    native: "They can eat here."
    notes:
      "n1": "Können: sie (they) können is the infinitive."
    bases:
      "Sie": "she; they"
  "de-4506":
    native: "I have to work."
    notes:
      "n1": "Müssen: ich muss, with no ending."
  "de-4507":
    native: "You have to wait."
    notes:
      "n1": "Müssen: du musst."
  "de-4508":
    native: "He has to learn a lot."
    notes:
      "n1": "The infinitive lernen is last, after viel."
  "de-4509":
    native: "We have to wait here."
    notes:
      "n1": "Müssen: wir müssen is the infinitive."
  "de-4510":
    native: "I want to drink coffee."
    notes:
      "n1": "Wollen: ich will; the infinitive trinken is last."
  "de-4511":
    native: "Do you want to drink tea?"
    notes:
      "n1": "Wollen: du willst; the question starts with the modal."
  "de-4512":
    native: "He wants to buy a mobile phone."
    notes:
      "n1": "Wollen: er will; kaufen is last."
    bases:
      "ein": "a; an"
  "de-4513":
    native: "You want to live here."
    notes:
      "n1": "Wollen: ihr wollt."
    bases:
      "Ihr": "you (plural); her; their"
  "de-4514":
    native: "I would like to drink water."
    notes:
      "n1": "Möchten: ich möchte; the infinitive trinken is last."
  "de-4515":
    native: "Would you like tea?"
    notes:
      "n1": "Möchten: du möchtest; the modal can stand with a thing wanted."
  "de-4516":
    native: "Would you like coffee?"
    notes:
      "n1": "Möchten Sie: the polite you takes the same form as sie, möchten."
  "de-4517":
    native: "We would like to eat here."
    notes:
      "n1": "Möchten: wir möchten."
  "de-4518":
    native: "May I sit here?"
    notes:
      "n1": "Dürfen: ich darf; the question starts with the modal."
  "de-4519":
    native: "You may sleep here."
    notes:
      "n1": "Dürfen: du darfst."
  "de-4520":
    native: "The child may play."
    notes:
      "n1": "Dürfen: er, sie, es and a singular noun take darf."
    bases:
      "Das": "that; the (neuter)"
  "de-4521":
    native: "I am supposed to wait."
    notes:
      "n1": "Sollen: ich soll."
  "de-4522":
    native: "The child is supposed to sleep."
    notes:
      "n1": "Sollen: das Kind soll."
    bases:
      "Das": "that; the (neuter)"
  "de-4523":
    native: "Where can I eat?"
    notes:
      "n1": "The question word is first, the modal second and the infinitive last."
  "de-4524":
    native: "What would you like?"
    notes:
      "n1": "The question word is first and the modal second."
