      "n1": "Notfall is emergency: der Notfall. Its plural is Notfälle; the vowel takes an umlaut."
    forms: { "pl": "plural" }
    examples:
      "Das ist der Notfall.":
        native: "That is the emergency."
        bases:
          "Das": "that"
          "ist": "to be (it is)"
          "der": "the"
          "Notfall": "emergency"
      "Das ist kein Notfall.":
        native: "That is not an emergency."
