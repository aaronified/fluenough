native: { code: "en", iso639_3: "eng", name: "English" }
name: "The present tense: regular verbs"
license: "CC-BY-SA-4.0"
description: "The present tense of 24 everyday verbs for six persons: the endings -e, -st, -t, -en, -t, -en, and the verbs that add an e or drop an s. Not yet checked by a German speaker: please report any mistake."
pattern:
  name: "The present of regular verbs"
  slot_name: "person"
  slots:
    "ich": "I (ich)"
    "du": "you, one person you know (du)"
    "er-sie-es": "he, she, it (er, sie, es)"
    "wir": "we (wir)"
    "ihr": "you, more than one person (ihr)"
    "sie": "they (sie); you, formal (Sie)"
  entries:
    "wohnen": "to live (somewhere)"
    "kommen": "to come"
    "machen": "to do; to make"
    "lernen": "to learn"
    "kaufen": "to buy"
    "spielen": "to play"
    "hoeren": "to hear"
    "sagen": "to say"
    "fragen": "to ask"
    "brauchen": "to need"
    "kochen": "to cook"
    "suchen": "to look for"
    "zeigen": "to show"
    "gehen": "to go"
    "trinken": "to drink"
    "schreiben": "to write"
    "bleiben": "to stay"
    "besuchen": "to visit"
    "arbeiten": "to work (adds e before -st and -t)"
    "finden": "to find (adds e before -st and -t)"
    "warten": "to wait (adds e before -st and -t)"
    "antworten": "to answer (adds e before -st and -t)"
    "oeffnen": "to open (adds e before -st and -t)"
    "heissen": "to be called (du heißt: one s)"
  notes: "To make the present, take the ending -en (or -n) off the infinitive and add the ending for the person: ich -e, du -st, er, sie, es -t, wir -en, ihr -t, sie -en. So wohnen gives ich wohne, du wohnst, er wohnt, wir wohnen, ihr wohnt, sie wohnen. The wir form and the sie (they) form are always the same as the infinitive, and the ihr form is the same as the er form. Two spelling changes keep the endings easy to say, as Wikipedia's page on German verbs lists. An e is put in before -st and -t when the stem ends in -d, -t, or a consonant and n: du arbeitest, er arbeitet, ihr arbeitet; du findest; du wartest; du antwortest; du öffnest. When the stem ends in -s, -ß, -x or -z, the du ending is only -t, because the s is already there: heißen gives du heißt, er heißt, ihr heißt. Some verbs here, such as kommen, gehen, trinken and finden, are strong verbs, which change their vowel in the past tense, taught later; their present tense is regular like the others. Wiktionary's conjugation table of each verb gives every form. Sie, the polite you, takes the sie (they) form: Sie wohnen. Sources: en.wiktionary's conjugation table of each verb, and the Wikipedia page German verbs."
