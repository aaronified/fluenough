description: "23 short sentences with prepositions, written from the table. Not yet checked by a German speaker: please report any mistake."
cards:
  "de-4600":
    native: "The mobile phone is for the father."
    notes:
      "n1": "Für takes the accusative: der Vater becomes den Vater."
    bases:
      "Das": "that; the (neuter)"
      "den": "the (masculine)"
  "de-4601":
    native: "The book is for the mother."
    notes:
      "n1": "Für takes the accusative: die Mutter stays the same."
    bases:
      "Das": "that; the (neuter)"
      "die": "the (feminine and plural)"
  "de-4602":
    native: "The photo is for the child."
    notes:
      "n1": "Für takes the accusative: das Kind stays the same."
    bases:
      "Das": "that; the (neuter)"
  "de-4603":
    native: "The train goes through the city."
    notes:
      "n1": "Durch takes the accusative: die Stadt."
    bases:
      "Der": "the (masculine)"
      "die": "the (feminine and plural)"
  "de-4604":
    native: "We play against the neighbour."
    notes:
      "n1": "Gegen takes the accusative: den Nachbarn."
    bases:
      "den": "the (masculine)"
  "de-4605":
    native: "I drink coffee without sugar."
    notes:
      "n1": "Ohne takes the accusative, but a noun with no article has no ending to show it."
  "de-4606":
    native: "He comes without the dog."
    notes:
      "n1": "Ohne takes the accusative: den Hund."
    bases:
      "den": "the (masculine)"
  "de-4607":
    native: "The street is around the corner."
    notes:
      "n1": "Um takes the accusative: die Ecke."
    bases:
      "Die": "the (feminine and plural)"
  "de-4608":
    native: "We walk around the station."
    notes:
      "n1": "Um takes the accusative: den Bahnhof."
    bases:
      "den": "the (masculine)"
  "de-4609":
    native: "I go by train."
    notes:
      "n1": "Mit takes the dative: dem Zug."
    bases:
      "dem": "the (masculine)"
  "de-4610":
    native: "He comes with the family."
    notes:
      "n1": "Mit takes the dative: der Familie."
    bases:
      "der": "the (masculine)"
  "de-4611":
    native: "After work I eat."
    notes:
      "n1": "Nach takes the dative: der Arbeit. The verb stays second, so ich comes after it."
    bases:
      "der": "the (masculine)"
  "de-4612":
    native: "We travel to Berlin."
    notes:
      "n1": "With the name of a city, nach means to."
    bases:
      "Berlin": "Berlin (a city)"
  "de-4613":
    native: "He lives with the family."
    notes:
      "n1": "Bei takes the dative: der Familie."
    bases:
      "der": "the (masculine)"
  "de-4614":
    native: "I live with my parents."
    notes:
      "n1": "Bei takes the dative: den Eltern."
    bases:
      "den": "the (masculine)"
  "de-4615":
    native: "That is a photo of the family."
    notes:
      "n1": "Von takes the dative: der Familie."
    bases:
      "Das": "that; the (neuter)"
      "ein": "a; an"
      "der": "the (masculine)"
  "de-4616":
    native: "We are coming from work."
    notes:
      "n1": "Von takes the dative: der Arbeit."
    bases:
      "der": "the (masculine)"
  "de-4617":
    native: "I am going to the station."
    notes:
      "n1": "Zum is zu dem: zu takes the dative."
  "de-4618":
    native: "I am going to work."
    notes:
      "n1": "Zur is zu der: zu takes the dative."
  "de-4619":
    native: "I come from the city."
    notes:
      "n1": "Aus takes the dative: der Stadt."
    bases:
      "der": "the (masculine)"
  "de-4620":
    native: "He comes from the village."
    notes:
      "n1": "Aus takes the dative: dem Dorf."
    bases:
      "dem": "the (masculine)"
  "de-4621":
    native: "He has been ill since the birthday."
    notes:
      "n1": "Seit takes the dative: dem Geburtstag."
    bases:
      "dem": "the (masculine)"
  "de-4622":
    native: "I have been waiting since breakfast."
    notes:
      "n1": "Seit takes the dative: dem Frühstück."
    bases:
      "dem": "the (masculine)"
