schema: 1
id: "de-en-grammar-dative-sentences"
kind: "layer"
core: "de-grammar-dative-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The dative in sentences"
license: "CC-BY-SA-4.0"
description: "18 short sentences with a dative object, written from the table. Not yet checked by a German speaker: please report any mistake."
cards:
  "de-4550":
    native: "I help the father."
    notes:
      "n1": "Helfen takes the dative: dem Vater."
    bases:
      "dem": "the (masculine)"
  "de-4551":
    native: "I help the mother."
    notes:
      "n1": "Feminine dative: die becomes der."
    bases:
      "der": "the (masculine)"
  "de-4552":
    native: "He helps the child."
    notes:
      "n1": "Neuter dative: das becomes dem."
    bases:
      "dem": "the (masculine)"
  "de-4553":
    native: "We help the children."
    notes:
      "n1": "Dative plural: die becomes den and the noun adds -n."
    bases:
      "den": "the (masculine)"
  "de-4554":
    native: "We help the friends."
    notes:
      "n1": "Dative plural: den, and -n on the noun: Freunden."
    bases:
      "den": "the (masculine)"
  "de-4555":
    native: "He helps a female friend."
    notes:
      "n1": "Feminine dative: eine becomes einer."
    bases:
      "einer": "a; an"
  "de-4556":
    native: "You help the neighbour."
    notes:
      "n1": "Nachbar is a weak noun and keeps its -n: dem Nachbarn."
    bases:
      "dem": "the (masculine)"
  "de-4557":
    native: "The mobile phone belongs to the child."
    notes:
      "n1": "Gehören takes the dative: dem Kind says who owns it."
    bases:
      "Das": "that; the (neuter)"
      "dem": "the (masculine)"
  "de-4558":
    native: "The book belongs to the mother."
    notes:
      "n1": "Gehören takes the dative: der Mutter."
    bases:
      "Das": "that; the (neuter)"
      "der": "the (masculine)"
  "de-4559":
    native: "The dog belongs to the brother."
    notes:
      "n1": "Gehören takes the dative: dem Bruder."
    bases:
      "Der": "the (masculine)"
      "dem": "the (masculine)"
  "de-4560":
    native: "The mobile phone belongs to a friend."
    notes:
      "n1": "Masculine dative: ein becomes einem."
    bases:
      "Das": "that; the (neuter)"
      "einem": "a; an"
  "de-4561":
    native: "I give the child the book."
    notes:
      "n1": "Geben has two objects: dem Kind, the dative, who receives, and das Buch, the accusative, what is given."
    bases:
      "dem": "the (masculine)"
      "das": "that; the (neuter)"
  "de-4562":
    native: "He gives the mother the mobile phone."
    notes:
      "n1": "The dative der Mutter comes first, then the accusative das Handy."
    bases:
      "der": "the (masculine)"
      "das": "that; the (neuter)"
  "de-4563":
    native: "I give the dog water."
    notes:
      "n1": "The dative dem Hund is who receives; Wasser is what is given."
    bases:
      "dem": "the (masculine)"
  "de-4564":
    native: "She gives the brother the photo."
    notes:
      "n1": "The dative dem Bruder is who receives; das Foto is what is given."
    bases:
      "Sie": "she; they"
      "dem": "the (masculine)"
      "das": "that; the (neuter)"
  "de-4565":
    native: "He answers the colleague."
    notes:
      "n1": "Antworten takes the dative, and Kollege keeps its -n: dem Kollegen."
    bases:
      "dem": "the (masculine)"
  "de-4566":
    native: "I answer the woman."
    notes:
      "n1": "Antworten takes the dative: der Frau."
    bases:
      "der": "the (masculine)"
  "de-4567":
    native: "We answer the parents."
    notes:
      "n1": "Eltern already ends in -n, so the dative plural adds nothing: den Eltern."
    bases:
      "den": "the (masculine)"
