kind: "layer"
core: "de-grammar-separable-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Separable verbs"
license: "CC-BY-SA-4.0"
description: "The present tense of 14 separable verbs for six persons, each with its prefix at the end: stehe auf, komme an, fahre ab. Not yet checked by a German speaker: please report any mistake."
pattern:
  name: "The present of separable verbs"
  slot_name: "person"
  slots:
    "ich": "I (ich)"
    "du": "you, one person you know (du)"
    "er-sie-es": "he, she, it (er, sie, es)"
    "wir": "we (wir)"
    "ihr": "you, more than one person (ihr)"
    "sie": "they (sie); you, formal (Sie)"
  entries:
    "aufstehen": "to get up (auf- comes off)"
    "ankommen": "to arrive (an- comes off)"
    "abfahren": "to depart; to leave (ab- comes off)"
    "einkaufen": "to shop (ein- comes off)"
    "anrufen": "to call; to phone (an- comes off)"
    "mitkommen": "to come along (mit- comes off)"
    "anfangen": "to begin; to start (an- comes off)"
    "einsteigen": "to get on; to get in (ein- comes off)"
    "aussteigen": "to get off; to get out (aus- comes off)"
    "umsteigen": "to change (trains, buses) (um- comes off)"
    "aufmachen": "to open (auf- comes off)"
    "zumachen": "to close; to shut (zu- comes off)"
    "mitbringen": "to bring along (mit- comes off)"
    "fernsehen": "to watch television (fern- comes off)"
  notes: "A separable verb has a prefix that comes off. In a main clause the conjugated verb stands in second place and the prefix goes to the very end: aufstehen gives Ich stehe um sieben Uhr auf; ankommen gives Der Zug kommt bald an. Wikipedia's page on German word order says separable particles are placed at the end of the sentence, with the other non-finite parts. In the infinitive, and after a modal verb, the verb and its prefix stay together: Ich muss früh aufstehen. In a yes or no question the verb is first and the prefix still goes last: Kommst du mit? The prefix, such as auf, an, ab, ein, aus, um, mit, zu and fern, is the stressed part of the verb: Wiktionary's pronunciation for aufstehen puts the stress mark on auf. Not every prefix comes off. Wikipedia's page on German verbs says the prefixes ver-, be- and ge- are permanent, so verbs such as verstehen and bekommen are not split: ich verstehe, ich bekomme. Wiktionary's conjugation table of each verb here shows the split forms, such as stehe auf and komme an. Sources: en.wiktionary's conjugation tables of each verb, and the Wikipedia pages German word order and German verbs."
