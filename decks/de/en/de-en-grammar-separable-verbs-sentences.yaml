schema: 1
id: "de-en-grammar-separable-verbs-sentences"
kind: "layer"
core: "de-grammar-separable-verbs-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Separable verbs in sentences"
license: "CC-BY-SA-4.0"
description: "24 short sentences with separable verbs, written from the table. Not yet checked by a German speaker: please report any mistake."
cards:
  "de-4700":
    native: "I get up early."
    notes:
      "n1": "The prefix auf goes to the end of the clause."
  "de-4701":
    native: "You get up early."
    notes:
      "n1": "Stehen: du stehst; auf is last."
  "de-4702":
    native: "We get up at seven o’clock."
    notes:
      "n1": "The time phrase comes before the prefix, which stays last."
  "de-4703":
    native: "I have to get up early."
    notes:
      "n1": "After a modal verb the verb stays whole, at the end."
  "de-4704":
    native: "The train arrives."
    notes:
      "n1": "Ankommen splits: kommt is second and an is last."
    bases:
      "Der": "the (masculine)"
  "de-4705":
    native: "When does the train arrive?"
    notes:
      "n1": "In a question with a question word the prefix is still last."
    bases:
      "der": "the (masculine)"
  "de-4706":
    native: "The bus leaves."
    notes:
      "n1": "Abfahren splits: fährt is second and ab is last."
    bases:
      "Der": "the (masculine)"
  "de-4707":
    native: "When does the bus leave?"
    notes:
      "n1": "The prefix ab stays at the end of the question."
    bases:
      "der": "the (masculine)"
  "de-4708":
    native: "I am shopping today."
    notes:
      "n1": "Einkaufen splits: kaufe is second and ein is last."
  "de-4709":
    native: "We buy bread."
    notes:
      "n1": "The object comes before the prefix: Brot ein."
  "de-4710":
    native: "I call the mother."
    notes:
      "n1": "Anrufen splits: rufe is second and an is last, after the object."
    bases:
      "die": "the (feminine and plural)"
  "de-4711":
    native: "I have to call the mother."
    notes:
      "n1": "After a modal verb the verb stays whole at the end."
    bases:
      "die": "the (feminine and plural)"
  "de-4712":
    native: "Are you coming along?"
    notes:
      "n1": "A yes or no question puts the verb first; mit is last."
  "de-4713":
    native: "I like to come along."
    notes:
      "n1": "Mitkommen splits: komme is second and mit is last."
  "de-4714":
    native: "The work starts soon."
    notes:
      "n1": "Anfangen splits: fängt is second and an is last."
    bases:
      "Die": "the (feminine and plural)"
  "de-4715":
    native: "When does the work start?"
    notes:
      "n1": "Fangen changes its vowel: fängt; an is last."
    bases:
      "die": "the (feminine and plural)"
  "de-4716":
    native: "We get off here."
    notes:
      "n1": "Aussteigen splits: steigen is second and aus is last."
  "de-4717":
    native: "We have to change."
    notes:
      "n1": "After a modal verb the verb stays whole at the end."
  "de-4718":
    native: "I open the door."
    notes:
      "n1": "Aufmachen splits: mache is second and auf is last, after the object."
    bases:
      "die": "the (feminine and plural)"
  "de-4719":
    native: "He closes the door."
    notes:
      "n1": "Zumachen splits: macht is second and zu is last."
    bases:
      "die": "the (feminine and plural)"
  "de-4720":
    native: "I bring coffee along."
    notes:
      "n1": "Mitbringen splits: bringe is second and mit is last."
  "de-4721":
    native: "What are you bringing along?"
    notes:
      "n1": "The question word is first, the verb second and mit last."
  "de-4722":
    native: "The child is watching television."
    notes:
      "n1": "Fernsehen changes its vowel: sieht; fern is last."
    bases:
      "Das": "that; the (neuter)"
  "de-4723":
    native: "We are watching television today."
    notes:
      "n1": "Fern goes to the end of the clause."
