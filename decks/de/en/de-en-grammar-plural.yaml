schema: 1
id: "de-en-grammar-plural"
kind: "layer"
core: "de-grammar-plural"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Noun plurals"
license: "CC-BY-SA-4.0"
description: "The singular and plural of 31 nouns taught so far, with the way each plural is made: an ending, an umlaut, both, or nothing. Not yet checked by a German speaker: please report any mistake."
pattern:
  name: "The plural of nouns"
  slot_name: "number"
  slots:
    "sg": "the, one thing"
    "pl": "the, more than one thing"
  entries:
    "freund": "friend (man or boy) (adds -e)"
    "geburtstag": "birthday (adds -e)"
    "sohn": "son (umlaut and -e)"
    "stadt": "city; town (umlaut and -e)"
    "vater": "father (umlaut only)"
    "bruder": "brother (umlaut only)"
    "mutter": "mother (umlaut only)"
    "tochter": "daughter (umlaut only)"
    "kind": "child (adds -er)"
    "land": "country; land (umlaut and -er)"
    "dorf": "village (umlaut and -er)"
    "mann": "man; husband (umlaut and -er)"
    "schwester": "sister (adds -n)"
    "tante": "aunt (adds -n)"
    "frau": "woman; wife (adds -en)"
    "familie": "family (adds -n)"
    "adresse": "address (adds -n)"
    "sprache": "language (adds -n)"
    "name": "name (adds -n)"
    "kollege": "colleague (man) (adds -n)"
    "nachbar": "neighbour (man) (adds -n)"
    "mensch": "person; human being (adds -en)"
    "dame": "lady (adds -n)"
    "nummer": "number (adds -n)"
    "freundin": "friend (woman or girl) (adds -nen)"
    "kollegin": "colleague (woman) (adds -nen)"
    "maedchen": "girl (no change)"
    "foto": "photo (adds -s)"
    "opa": "grandpa (adds -s)"
    "oma": "grandma (adds -s)"
    "cousin": "cousin (male) (adds -s)"
  notes: "A noun's plural is made in one of a few ways, and the singular does not tell you which: it adds -e (Freund, Freunde), adds -n or -en (Tante, Tanten; Frau, Frauen), adds -er (Kind, Kinder), adds nothing (Mädchen, Mädchen), or adds -s (Foto, Fotos). Many plurals also take an umlaut, a changed vowel: a becomes ä, o becomes ö, u becomes ü (Vater, Väter; Sohn, Söhne; Stadt, Städte). The umlaut can come with no ending (Vater, Väter), with -e (Sohn, Söhne) or with -er (Land, Länder). Nouns in -in double the n and add -en: Freundin, Freundinnen. Wikipedia's page on German nouns says plurals are normally formed with -e, -en, -er or nothing, sometimes with the umlaut, and that recent loanwords from French and English often keep -s, as Foto does here. The word for the in the plural is always die, whatever the gender. In the dative plural every noun adds -n unless it already ends in -n or -s (die Kinder, den Kindern), as Wikipedia's page on German declension says; the dative is taught later. Wiktionary's declension table of each noun gives its plural, so learn the plural with each new noun. Sources: en.wiktionary's declension table of each noun, and the Wikipedia pages German nouns and German declension."
