id: "de-en-grammar-possessives-sentences"
kind: "layer"
core: "de-grammar-possessives-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Possessives in sentences"
license: "CC-BY-SA-4.0"
description: "23 short sentences with possessives, written from the table. Not yet checked by a German speaker: please report any mistake."
cards:
  "de-4450":
    native: "That is my father."
    notes:
      "n1": "Mein goes before a masculine noun."
    bases:
      "Das": "that; the (neuter)"
  "de-4451":
    native: "That is my mother."
    notes:
      "n1": "A feminine noun takes the ending -e: meine Mutter."
    bases:
      "Das": "that; the (neuter)"
  "de-4452":
    native: "That is my child."
    notes:
      "n1": "A neuter noun takes no ending in the nominative: mein Kind."
    bases:
      "Das": "that; the (neuter)"
  "de-4453":
    native: "Those are my children."
    notes:
      "n1": "A plural noun takes the ending -e: meine Kinder."
    bases:
      "Das": "that; the (neuter)"
  "de-4454":
    native: "What is your brother called?"
    notes:
      "n1": "Dein is your, to a person you call du."
  "de-4455":
    native: "Your sister is here."
    notes:
      "n1": "The ending -e follows the feminine noun Schwester."
  "de-4456":
    native: "That is your mobile phone."
    notes:
      "n1": "Neuter, so no ending: dein Handy."
    bases:
      "Das": "that; the (neuter)"
  "de-4457":
    native: "His father is old."
    notes:
      "n1": "Sein is his: it belongs to er, and the noun Vater is masculine, so there is no ending."
  "de-4458":
    native: "His mother is young."
    notes:
      "n1": "The ending -e follows the feminine noun Mutter, not the owner."
  "de-4459":
    native: "Her brother lives here."
    notes:
      "n1": "Ihr is her: it belongs to sie, and Bruder is masculine, so there is no ending."
  "de-4460":
    native: "Her family is big."
    notes:
      "n1": "The ending -e follows the feminine noun Familie."
  "de-4461":
    native: "Our dog is sleeping."
    notes:
      "n1": "Unser goes before a masculine noun."
  "de-4462":
    native: "Our children are here."
    notes:
      "n1": "A plural noun takes unsere."
  "de-4463":
    native: "Your father is cooking."
    notes:
      "n1": "Euer is your, to several people you call ihr."
  "de-4464":
    native: "Your mother works here."
    notes:
      "n1": "Euer loses its e before an ending: eure Mutter."
  "de-4465":
    native: "What is your brother called?"
    notes:
      "n1": "Ihr with a capital I is the polite your, to a person you call Sie."
  "de-4466":
    native: "Is that your family?"
    notes:
      "n1": "The polite Ihre has a capital I and takes -e before a feminine noun."
    bases:
      "das": "that; the (neuter)"
  "de-4467":
    native: "I know your brother."
    notes:
      "n1": "A masculine object takes -en: deinen Bruder."
  "de-4468":
    native: "We visit our uncle."
    notes:
      "n1": "A masculine object takes -en: unseren Onkel."
  "de-4469":
    native: "He is looking for his dog."
    notes:
      "n1": "A masculine object takes -en: seinen Hund."
  "de-4470":
    native: "I am looking for my dog."
    notes:
      "n1": "A masculine object takes -en: meinen Hund."
  "de-4471":
    native: "You have your bag."
    notes:
      "n1": "A feminine object takes -e, the same as in the nominative."
  "de-4472":
    native: "She has her dog."
    notes:
      "n1": "A masculine object takes -en: ihren Hund."
    bases:
      "Sie": "she; they"
