cards:
  "de-1650":
    native: "to be called; to have a name; to mean"
    notes:
      "n1": "Heißen is to be called, to have a name. Das heißt means: it means."
    examples:
      "Das heißt ja.":
        native: "That means yes."
        bases:
          "Das": "the; that"
          "heißt": "means (it means)"
          "ja": "yes"
      "Das heißt nicht gut.":
        native: "That does not mean it is good."
        bases:
          "Das": "the; that"
          "heißt": "means (it means)"
          "nicht": "not"
          "gut": "good"
  "de-1651":
    native: "to live; to reside; to dwell"
    notes:
      "n1": "Wohnen is to live in a place, as in ich wohne hier: I live here."
