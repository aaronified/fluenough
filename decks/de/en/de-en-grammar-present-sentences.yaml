schema: 1
id: "de-en-grammar-present-sentences"
kind: "layer"
core: "de-grammar-present-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The present tense in sentences"
license: "CC-BY-SA-4.0"
description: "22 short sentences with the present tense of regular verbs, written from the table. Not yet checked by a German speaker: please report any mistake."
cards:
  "de-4200":
    native: "I live here."
    notes:
      "n1": "Wohnen: ich wohne, with -e."
  "de-4201":
    native: "Where do you live?"
    notes:
      "n1": "Wohnen: du wohnst, with -st. The question word comes first and the verb second."
  "de-4202":
    native: "Where do you come from?"
    notes:
      "n1": "Kommen: du kommst, with -st."
  "de-4203":
    native: "The child is coming."
    notes:
      "n1": "Kommen: er, sie, es and a singular noun take -t: das Kind kommt. German has one present, so it means both comes and is coming."
    bases:
      "Das": "that; the (neuter)"
  "de-4204":
    native: "We learn a lot."
    notes:
      "n1": "Lernen: wir lernen is the same as the infinitive."
  "de-4205":
    native: "You work a lot."
    notes:
      "n1": "The stem arbeit- ends in t, so an e goes in before -st: du arbeitest."
  "de-4206":
    native: "He works here."
    notes:
      "n1": "The e goes in before -t too: er arbeitet."
  "de-4207":
    native: "I wait here."
    notes:
      "n1": "Warten: ich warte, with -e."
  "de-4208":
    native: "You wait here."
    notes:
      "n1": "Ihr takes -t, and the stem ends in t, so an e goes in: ihr wartet."
    bases:
      "Ihr": "you (plural); her; their"
  "de-4209":
    native: "The child is playing."
    notes:
      "n1": "Spielen: das Kind spielt, with -t."
    bases:
      "Das": "that; the (neuter)"
  "de-4210":
    native: "They play here."
    notes:
      "n1": "Spielen: sie (they) spielen is the same as the infinitive."
    bases:
      "Sie": "she; they"
  "de-4211":
    native: "We buy a mobile phone."
    notes:
      "n1": "Kaufen: wir kaufen."
    bases:
      "ein": "a; an"
  "de-4212":
    native: "You look for the photo."
    notes:
      "n1": "Suchen: du suchst, with -st."
    bases:
      "das": "that; the (neuter)"
  "de-4213":
    native: "He finds the mobile phone."
    notes:
      "n1": "The stem find- ends in d, so an e goes in before -t: er findet."
    bases:
      "das": "that; the (neuter)"
  "de-4214":
    native: "I open the book."
    notes:
      "n1": "Öffnen: ich öffne, with -e."
    bases:
      "das": "that; the (neuter)"
  "de-4215":
    native: "The dog drinks water."
    notes:
      "n1": "Trinken: er, sie, es and a singular noun take -t: der Hund trinkt."
    bases:
      "Der": "the (masculine)"
  "de-4216":
    native: "What are you called?"
    notes:
      "n1": "The stem heiß- ends in ß, so the du ending is -t only: du heißt."
  "de-4217":
    native: "My name is Anna."
    notes:
      "n1": "Heißen: ich heiße, with -e."
    bases:
      "Anna": "Anna (a woman's name)"
  "de-4218":
    native: "He writes a lot."
    notes:
      "n1": "Schreiben: er schreibt, with -t."
  "de-4219":
    native: "You stay here."
    notes:
      "n1": "Bleiben: ihr bleibt, with -t, the same as er bleibt."
    bases:
      "Ihr": "you (plural); her; their"
  "de-4220":
    native: "We visit the family."
    notes:
      "n1": "Besuchen: wir besuchen is the same as the infinitive."
    bases:
      "die": "the (feminine and plural)"
  "de-4221":
    native: "I hear well."
    notes:
      "n1": "Hören: ich höre, with -e."
