schema: 1
id: "de-en-grammar-negation-sentences"
kind: "layer"
core: "de-grammar-negation-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Nicht and kein in sentences"
license: "CC-BY-SA-4.0"
description: "19 short sentences with nicht and kein, written from the table. Not yet checked by a German speaker: please report any mistake."
cards:
  "de-4350":
    native: "I am not tired."
    notes:
      "n1": "Nicht goes before an adjective."
  "de-4351":
    native: "He is not old."
    notes:
      "n1": "Nicht goes before an adjective."
  "de-4352":
    native: "The child is not small."
    notes:
      "n1": "Nicht goes before an adjective."
    bases:
      "Das": "that; the (neuter)"
  "de-4353":
    native: "We are not here."
    notes:
      "n1": "Nicht goes after the verb sind and before the place word hier."
  "de-4354":
    native: "I do not live here."
    notes:
      "n1": "German has no word for do: the verb stays in second place and nicht follows it."
  "de-4355":
    native: "He does not work here."
    notes:
      "n1": "Nicht follows the verb."
  "de-4356":
    native: "The train is not coming."
    notes:
      "n1": "Nicht at the end, after the verb."
    bases:
      "Der": "the (masculine)"
  "de-4357":
    native: "I do not know it."
    notes:
      "n1": "Nicht comes at the end, after es."
  "de-4358":
    native: "I do not have the mobile phone."
    notes:
      "n1": "A noun with das is negated with nicht, which goes at the end."
    bases:
      "das": "that; the (neuter)"
  "de-4359":
    native: "That is not the father."
    notes:
      "n1": "A noun with der is negated with nicht, which goes before it."
    bases:
      "Das": "that; the (neuter)"
      "der": "the (masculine)"
  "de-4360":
    native: "That is not good."
    notes:
      "n1": "Nicht goes before an adjective."
    bases:
      "Das": "that; the (neuter)"
  "de-4361":
    native: "I do not have a mobile phone."
    notes:
      "n1": "Ein becomes kein: ein Handy, kein Handy."
  "de-4362":
    native: "You do not have a sister."
    notes:
      "n1": "Eine becomes keine: eine Schwester, keine Schwester."
  "de-4363":
    native: "That is not a dog."
    notes:
      "n1": "Ein becomes kein before a masculine noun."
    bases:
      "Das": "that; the (neuter)"
  "de-4364":
    native: "We do not have a child."
    notes:
      "n1": "Ein becomes kein before a neuter noun."
  "de-4365":
    native: "He does not have children."
    notes:
      "n1": "A plural noun with no article takes keine."
  "de-4366":
    native: "Those are not books."
    notes:
      "n1": "A plural noun with no article takes keine."
    bases:
      "Das": "that; the (neuter)"
  "de-4367":
    native: "Do you not have a mobile phone?"
    notes:
      "n1": "A yes or no question starts with the verb; kein stays before the noun."
  "de-4368":
    native: "No, I do not have a mobile phone."
    notes:
      "n1": "Nein answers the question, and kein negates the noun."
