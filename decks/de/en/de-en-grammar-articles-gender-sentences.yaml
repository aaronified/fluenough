schema: 1
id: "de-en-grammar-articles-gender-sentences"
kind: "layer"
core: "de-grammar-articles-gender-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Articles in sentences"
license: "CC-BY-SA-4.0"
description: "18 short sentences with der, die, das, ein and eine, written from the table. Not yet checked by a German speaker: please report any mistake."
cards:
  "de-4050":
    native: "The father is here."
    notes:
      "n1": "Der goes with a masculine noun in the nominative: der Vater."
    bases:
      "Der": "the (masculine)"
      "ist": "to be"
  "de-4051":
    native: "The mother is here."
    notes:
      "n1": "Die goes with a feminine noun: die Mutter."
    bases:
      "Die": "the (feminine and plural)"
      "ist": "to be"
  "de-4052":
    native: "The child is here."
    notes:
      "n1": "Das goes with a neuter noun: das Kind."
    bases:
      "Das": "that; the (neuter)"
      "ist": "to be"
  "de-4053":
    native: "The children are here."
    notes:
      "n1": "The plural of das Kind is die Kinder; die is the word for the in the plural, and the verb is sind."
    bases:
      "Die": "the (feminine and plural)"
      "sind": "to be"
  "de-4054":
    native: "Where is the brother?"
    notes:
      "n1": "The subject is der Bruder, masculine, so der."
    bases:
      "ist": "to be"
      "der": "the (masculine)"
  "de-4055":
    native: "Where is the sister?"
    notes:
      "n1": "Schwester is feminine, so die."
    bases:
      "ist": "to be"
      "die": "the (feminine and plural)"
  "de-4056":
    native: "Where is the girl?"
    notes:
      "n1": "Mädchen ends in -chen, so it is neuter: das Mädchen, though it means a girl."
    bases:
      "ist": "to be"
      "das": "that; the (neuter)"
  "de-4057":
    native: "That is a friend (a man)."
    notes:
      "n1": "Freund is masculine, so ein; the same noun with a woman is a Freundin."
    bases:
      "Das": "that; the (neuter)"
      "ist": "to be"
      "ein": "a; an"
  "de-4058":
    native: "That is a friend (a woman)."
    notes:
      "n1": "Freundin ends in -in, so it is feminine: eine Freundin."
    bases:
      "Das": "that; the (neuter)"
      "ist": "to be"
      "eine": "a; an"
  "de-4059":
    native: "That is a child."
    notes:
      "n1": "Kind is neuter, and ein is the same as for a masculine noun in the nominative."
    bases:
      "Das": "that; the (neuter)"
      "ist": "to be"
      "ein": "a; an"
  "de-4060":
    native: "That is a photo."
    notes:
      "n1": "Foto is neuter: das Foto, ein Foto."
    bases:
      "Das": "that; the (neuter)"
      "ist": "to be"
      "ein": "a; an"
  "de-4061":
    native: "That is a family."
    notes:
      "n1": "Familie is feminine: die Familie, eine Familie."
    bases:
      "Das": "that; the (neuter)"
      "ist": "to be"
      "eine": "a; an"
  "de-4062":
    native: "The aunt is young."
    notes:
      "n1": "Tante is feminine, so die."
    bases:
      "Die": "the (feminine and plural)"
      "ist": "to be"
  "de-4063":
    native: "The neighbour is old."
    notes:
      "n1": "Nachbar is masculine: der Nachbar."
    bases:
      "Der": "the (masculine)"
      "ist": "to be"
  "de-4064":
    native: "The city is big."
    notes:
      "n1": "Stadt is feminine: die Stadt."
    bases:
      "Die": "the (feminine and plural)"
      "ist": "to be"
  "de-4065":
    native: "The village is small."
    notes:
      "n1": "Dorf is neuter: das Dorf."
    bases:
      "Das": "that; the (neuter)"
      "ist": "to be"
  "de-4066":
    native: "The country is big."
    notes:
      "n1": "Land is neuter: das Land."
    bases:
      "Das": "that; the (neuter)"
      "ist": "to be"
  "de-4067":
    native: "Where is the woman?"
    notes:
      "n1": "Frau is feminine: die Frau."
    bases:
      "ist": "to be"
      "die": "the (feminine and plural)"
