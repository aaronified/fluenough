native: { code: "en", iso639_3: "eng", name: "English" }
name: "The accusative in sentences"
license: "CC-BY-SA-4.0"
description: "20 short sentences with an accusative object, written from the table. Not yet checked by a German speaker: please report any mistake."
cards:
  "de-4400":
    native: "The father sees the dog."
    notes:
      "n1": "Der Vater is the subject, so der; den Hund is the object, so der becomes den."
    bases:
      "Der": "the (masculine)"
      "den": "the (masculine)"
  "de-4401":
    native: "The dog sees the father."
    notes:
      "n1": "The meaning changes with der and den: here the dog sees and the father is seen."
    bases:
      "Der": "the (masculine)"
      "den": "the (masculine)"
  "de-4402":
    native: "I see the dog."
    notes:
      "n1": "The masculine object takes den."
    bases:
      "den": "the (masculine)"
  "de-4403":
    native: "I see the mother."
    notes:
      "n1": "A feminine object keeps die."
    bases:
      "die": "the (feminine and plural)"
  "de-4404":
    native: "We know the brother."
    notes:
      "n1": "The masculine object takes den."
    bases:
      "den": "the (masculine)"
  "de-4405":
    native: "He knows the name."
    notes:
      "n1": "Name adds -n in the accusative like a weak noun: den Namen. Its genitive is Namens."
    bases:
      "den": "the (masculine)"
  "de-4406":
    native: "I know the colleague."
    notes:
      "n1": "Kollege is a weak noun: it adds -n in the accusative, den Kollegen."
    bases:
      "den": "the (masculine)"
  "de-4407":
    native: "We visit the neighbour."
    notes:
      "n1": "Nachbar adds -n in the accusative: den Nachbarn."
    bases:
      "den": "the (masculine)"
  "de-4408":
    native: "I have a brother."
    notes:
      "n1": "Haben takes an object: ein becomes einen before a masculine noun."
    bases:
      "einen": "a; an"
  "de-4409":
    native: "You have a dog."
    notes:
      "n1": "Ein becomes einen before a masculine noun."
    bases:
      "einen": "a; an"
  "de-4410":
    native: "He has a son."
    notes:
      "n1": "Ein becomes einen before a masculine noun."
    bases:
      "einen": "a; an"
  "de-4411":
    native: "You do not have a dog."
    notes:
      "n1": "Kein becomes keinen before a masculine object."
  "de-4412":
    native: "I do not have a brother."
    notes:
      "n1": "Kein becomes keinen before a masculine object."
  "de-4413":
    native: "He reads the book."
    notes:
      "n1": "A neuter object keeps das."
    bases:
      "das": "that; the (neuter)"
  "de-4414":
    native: "I am looking for the train."
    notes:
      "n1": "Suchen takes an object: der Zug becomes den Zug."
    bases:
      "den": "the (masculine)"
  "de-4415":
    native: "He finds the dog."
    notes:
      "n1": "The masculine object takes den."
    bases:
      "den": "the (masculine)"
  "de-4416":
    native: "You need a friend."
    notes:
      "n1": "Brauchen takes an object: ein Freund becomes einen Freund."
    bases:
      "einen": "a; an"
  "de-4417":
    native: "I take the train."
    notes:
      "n1": "The masculine object takes den."
    bases:
