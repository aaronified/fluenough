schema: 1
id: "de-en-quantities"
kind: "layer"
core: "de-quantities"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Quantities"
description: "Words for amounts: much and little, more and less, enough and each, and the units people count and measure in: a bit, a lot, a piece, a pair, a dozen, a litre, a kilo, a gram, a portion, a pack, a bottle, a cup, a glass, a slice, half, a part, the rest and weight. Not yet checked by a German speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "de-1860":
    native: "much, many"
    notes:
      "n1": "Viel is much or many, as in viel Wasser, much water."
    examples:
      "Ich habe viel Wasser.":
        native: "I have a lot of water."
        bases:
          "Ich": "I"
          "habe": "have"
          "viel": "much"
          "Wasser": "water"
      "Das ist nicht viel.":
        native: "That is not much."
        bases:
          "Das": "that"
          "ist": "is"
          "nicht": "not"
          "viel": "much"
  "de-1861":
    native: "little, few"
    notes:
      "n1": "Wenig is little or few: das ist wenig, that is little."
    examples:
      "Das ist wenig.":
        native: "That is little."
        bases:
          "Das": "that"
          "ist": "is"
          "wenig": "little"
      "Ich habe wenig.":
        native: "I have little."
        bases:
          "Ich": "I"
          "habe": "have"
          "wenig": "little"
  "de-1862":
