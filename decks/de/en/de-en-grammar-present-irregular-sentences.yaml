description: "27 short sentences with verbs that change their vowel, written from the table. Not yet checked by a German speaker: please report any mistake."
cards:
  "de-4250":
    native: "I talk a lot."
    notes:
      "n1": "Sprechen: ich spreche keeps the e."
  "de-4251":
    native: "You speak well."
    notes:
      "n1": "The e becomes i in the du form: du sprichst."
  "de-4252":
    native: "He talks a lot."
    notes:
      "n1": "The e becomes i in the er form: er spricht."
  "de-4253":
    native: "You talk a lot."
    notes:
      "n1": "The ihr form keeps the e: ihr sprecht."
    bases:
      "Ihr": "you (plural); her; their"
  "de-4254":
    native: "You eat a lot."
    notes:
      "n1": "Essen: du isst; the stem ends in s, so the ending is only -t."
  "de-4255":
    native: "He eats well."
    notes:
      "n1": "Essen: er isst."
  "de-4256":
    native: "I read a book."
    notes:
      "n1": "Lesen: ich lese keeps the e."
    bases:
      "ein": "a; an"
  "de-4257":
    native: "You read a book."
    notes:
      "n1": "The e becomes ie in the du form: du liest."
    bases:
      "ein": "a; an"
  "de-4258":
