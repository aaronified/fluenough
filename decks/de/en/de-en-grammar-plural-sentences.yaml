core: "de-grammar-plural-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Plurals in sentences"
license: "CC-BY-SA-4.0"
description: "16 short sentences with plural nouns, written from the table. Not yet checked by a German speaker: please report any mistake."
cards:
  "de-4100":
    native: "Those are the children."
    notes:
      "n1": "Kind is neuter; its plural Kinder adds -er."
    bases:
      "Das": "that; the (neuter)"
      "sind": "to be"
      "die": "the (feminine and plural)"
  "de-4101":
    native: "Where are the children?"
    notes:
      "n1": "With a plural subject the verb is sind, not ist."
    bases:
      "sind": "to be"
      "die": "the (feminine and plural)"
  "de-4102":
    native: "Those are the brothers."
    notes:
      "n1": "Bruder takes an umlaut and no ending: Brüder."
    bases:
      "Das": "that; the (neuter)"
      "sind": "to be"
      "die": "the (feminine and plural)"
  "de-4103":
    native: "The mothers are here."
    notes:
      "n1": "Mutter takes an umlaut and no ending: Mütter."
    bases:
      "Die": "the (feminine and plural)"
      "sind": "to be"
  "de-4104":
    native: "The fathers are there."
    notes:
      "n1": "Vater takes an umlaut and no ending: Väter."
    bases:
      "Die": "the (feminine and plural)"
      "sind": "to be"
  "de-4105":
    native: "I have two sisters."
    notes:
      "n1": "Schwester adds -n in the plural: Schwestern. After a number the noun is in the plural."
    bases:
      "habe": "to have"
  "de-4106":
    native: "I have three children."
    notes:
      "n1": "After drei the noun is in the plural: Kinder."
    bases:
      "habe": "to have"
  "de-4107":
    native: "Those are two photos."
    notes:
      "n1": "Foto takes -s in the plural: Fotos."
    bases:
      "Das": "that; the (neuter)"
      "sind": "to be"
  "de-4108":
    native: "The cities are big."
    notes:
      "n1": "Stadt takes an umlaut and -e: Städte."
    bases:
      "Die": "the (feminine and plural)"
      "sind": "to be"
  "de-4109":
    native: "The villages are small."
    notes:
      "n1": "Dorf takes an umlaut and -er: Dörfer."
    bases:
      "Die": "the (feminine and plural)"
      "sind": "to be"
  "de-4110":
    native: "The countries are big."
    notes:
      "n1": "Land takes an umlaut and -er: Länder."
    bases:
      "Die": "the (feminine and plural)"
      "sind": "to be"
  "de-4111":
    native: "The friends are here."
    notes:
      "n1": "Freund adds -e in the plural: Freunde."
    bases:
      "Die": "the (feminine and plural)"
      "sind": "to be"
  "de-4112":
    native: "The women are there."
    notes:
