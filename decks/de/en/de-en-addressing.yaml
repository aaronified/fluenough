schema: 1
id: "de-en-addressing"
kind: "layer"
core: "de-addressing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Addressing people"
description: "Words for the people you talk to and about: a man, a woman, a boy, a girl, a friend, a colleague, a neighbour, the words for a name, and the polite you (Sie). Not yet checked by a German speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "de-1370":
    native: "man; gentleman"
    notes:
      "n1": "Herr is man or gentleman: der Herr. Its plural is Herren."
    examples:
      "Das ist der Herr.":
        native: "That is the gentleman."
        bases:
          "Das": "that"
          "ist": "is"
          "der": "the"
          "Herr": "man"
      "Wo ist der Herr?":
        native: "Where is the gentleman?"
        bases:
          "Wo": "where"
          "ist": "is"
          "der": "the"
          "Herr": "man"
  "de-1371":
    native: "woman"
    notes:
      "n1": "Frau is woman: die Frau. Its plural is Frauen."
    examples:
