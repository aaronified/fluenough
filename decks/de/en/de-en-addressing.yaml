          "Frau": "woman"
  "de-1372":
    native: "formal you; you (formal)"
    notes:
      "n1": "Sie with a capital S is the polite word for you, for one person or for more than one. It is a different word from sie, she or they."
    examples:
      "Sie sind hier.":
        native: "You are here."
        bases:
          "Sie": "you (formal)"
          "sind": "are"
          "hier": "here"
      "Wo sind Sie?":
        native: "Where are you?"
        bases:
          "Wo": "where"
          "sind": "are"
          "Sie": "you (formal)"
