name: "Separable verbs"
license: "CC-BY-SA-4.0"
description: "14 separable verbs, each as a word card with its own examples: aufstehen, ankommen, abfahren, einkaufen, anrufen, mitkommen, anfangen, einsteigen, aussteigen, umsteigen, aufmachen, zumachen, mitbringen and fernsehen. Not yet checked by a German speaker: please report any mistake."
cards:
  "de-1240":
    native: "to get up"
    notes:
      "n1": "Aufstehen is a separable verb: its prefix auf comes off in a main clause and goes to the end, ich stehe auf. Wiktionary's conjugation table gives the present: ich stehe auf, du stehst auf, er steht auf, wir stehen auf, ihr steht auf, sie stehen auf."
      "n2": "With a modal verb or in the infinitive the verb stays whole: Ich muss aufstehen. The prefix auf is the stressed part, as the stress mark in Wiktionary's pronunciation shows."
    examples:
      "Ich stehe um sieben Uhr auf.":
        native: "I get up at seven o’clock."
        bases:
          "stehe": "to get up"
          "auf": "to get up"
      "Ich muss früh aufstehen.":
        native: "I have to get up early."
        bases:
          "aufstehen": "to get up"
