name: "More verbs"
description: "Common everyday verbs: to get and to begin, to end and to happen, to forget and to tell, to visit and to meet, to lose and to win, to cost and to order, to reserve, try, choose, call, send, give, explain, pay, belong and last. Not yet checked by a German speaker: please report any mistake."
