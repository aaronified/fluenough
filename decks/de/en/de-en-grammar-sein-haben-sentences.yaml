description: "18 short sentences with sein and haben, written from the table. Not yet checked by a German speaker: please report any mistake."
cards:
  "de-4150":
    native: "I am here."
    notes:
      "n1": "Sein: ich bin."
  "de-4151":
    native: "You are tired."
    notes:
      "n1": "Sein: du bist."
  "de-4152":
    native: "He is old."
    notes:
      "n1": "Sein: er ist."
  "de-4153":
    native: "She is young."
    notes:
      "n1": "Sie ist is she is; the verb is ist, as for er."
    bases:
      "Sie": "she; they"
  "de-4154":
    native: "It is hot."
    notes:
      "n1": "Sein: es ist."
  "de-4155":
    native: "We are here."
    notes:
      "n1": "Sein: wir sind."
  "de-4156":
    native: "You are there."
    notes:
      "n1": "Sein: ihr seid; ihr is you, more than one person."
    bases:
      "Ihr": "you (plural); her; their"
  "de-4157":
    native: "They are big."
    notes:
      "n1": "Sie sind is they are; with a capital S in the middle of a sentence it would be the polite you."
    bases:
      "Sie": "she; they"
  "de-4158":
    native: "How old are you?"
    notes:
      "n1": "The question word comes first and the verb second: wie alt bist du."
  "de-4159":
    native: "Are you tired?"
    notes:
      "n1": "A yes or no question puts the verb first: Bist du müde?"
  "de-4160":
    native: "Who is that?"
    notes:
      "n1": "Sein: das ist."
    bases:
      "das": "that; the (neuter)"
  "de-4161":
    native: "I have a sister."
    notes:
      "n1": "Haben: ich habe."
    bases:
      "eine": "a; an"
  "de-4162":
    native: "You have a child."
    notes:
      "n1": "Haben: du hast, without the b."
    bases:
      "ein": "a; an"
  "de-4163":
    native: "He has a daughter."
    notes:
      "n1": "Haben: er hat, without the b."
    bases:
      "eine": "a; an"
  "de-4164":
    native: "We have two children."
    notes:
      "n1": "Haben: wir haben."
  "de-4165":
    native: "You have a family."
    notes:
      "n1": "Haben: ihr habt."
    bases:
      "Ihr": "you (plural); her; their"
      "eine": "a; an"
  "de-4166":
    native: "They have a photo."
    notes:
      "n1": "Haben: sie haben."
    bases:
      "Sie": "she; they"
      "ein": "a; an"
  "de-4167":
    native: "Do you have a mobile phone?"
    notes:
      "n1": "A yes or no question puts the verb first: Hast du ein Handy?"
    bases:
      "ein": "a; an"
