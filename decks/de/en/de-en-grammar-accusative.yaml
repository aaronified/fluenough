native: { code: "en", iso639_3: "eng", name: "English" }
name: "The accusative"
license: "CC-BY-SA-4.0"
description: "The nominative and accusative of 17 nouns taught so far, with the and a: only the masculine changes, der to den and ein to einen. Not yet checked by a German speaker: please report any mistake."
pattern:
  name: "The accusative case"
  slot_name: "case"
  slots:
    "nom-def": "the, as the subject (nominative)"
    "acc-def": "the, as the object (accusative)"
    "nom-indef": "a, as the subject (nominative)"
    "acc-indef": "a, as the object (accusative)"
  entries:
    "vater": "father"
    "bruder": "brother"
    "sohn": "son"
    "onkel": "uncle"
    "freund": "friend (man or boy)"
    "hund": "dog"
    "zug": "train"
    "kollege": "colleague (man; adds -n)"
    "name": "name (adds -n)"
    "nachbar": "neighbour (man; adds -n)"
    "mutter": "mother (no change)"
    "familie": "family (no change)"
    "schwester": "sister (no change)"
    "kind": "child (no change)"
    "handy": "mobile phone (no change)"
    "buch": "book (no change)"
    "kinder": "children (plural; no change)"
  notes: "The accusative is the case of the direct object, the thing the verb acts on: in Der Vater sieht den Hund, der Vater does the seeing (nominative) and den Hund is seen (accusative). In German only the masculine singular changes: der becomes den and ein becomes einen (der Hund, den Hund; ein Hund, einen Hund). Feminine nouns, neuter nouns and plurals look the same in the accusative as in the nominative: die Mutter, eine Mutter, das Kind, ein Kind, die Kinder. Kein follows ein, so kein becomes keinen before a masculine noun (Ich habe keinen Hund). A few masculine nouns, called weak nouns, also add -n or -en to the noun itself in every case except the singular nominative, as Wikipedia's page on German declension says: der Kollege, den Kollegen; der Name, den Namen (its genitive is Namens); der Nachbar, den Nachbarn (Wiktionary gives Nachbarn here, with the bare form as a variant). Wiktionary's declension table of each noun gives its nominative and accusative. Pronouns have their own accusative forms, taught later. Sources: en.wiktionary's declension tables and the Wikipedia page German declension."
