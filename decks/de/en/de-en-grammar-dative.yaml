kind: "layer"
core: "de-grammar-dative"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The dative"
license: "CC-BY-SA-4.0"
description: "The nominative, accusative and dative of 17 nouns taught so far: der and das become dem, die becomes der, and the plural takes den and adds -n to the noun. Not yet checked by a German speaker: please report any mistake."
pattern:
  name: "The dative case"
  slot_name: "case"
  slots:
    "nom-def": "the, as the subject (nominative)"
    "acc-def": "the, as the object (accusative)"
    "dat-def": "the, for the one who receives (dative)"
    "dat-indef": "a, for the one who receives (dative)"
  entries:
    "vater": "father"
    "bruder": "brother"
    "hund": "dog"
    "zug": "train"
    "freund": "friend (man or boy)"
    "kollege": "colleague (man; adds -n)"
    "nachbar": "neighbour (man; adds -n)"
    "mutter": "mother"
    "schwester": "sister"
    "familie": "family"
    "frau": "woman; wife"
    "kind": "child"
    "handy": "mobile phone"
    "buch": "book"
    "kinder": "children (the plural of Kind; adds -n)"
    "freunde": "friends (the plural of Freund; adds -n)"
    "frauen": "women (the plural of Frau; no -n added, it ends in -n)"
  notes: "The dative is the case of the person or thing that receives or that is helped. In Ich gebe dem Kind das Buch, das Buch is the thing given (accusative) and dem Kind is who receives it (dative). Wiktionary marks some verbs as taking the dative: helfen (to help someone), gehören (to belong to someone), antworten (to answer someone), and geben, which takes a dative of the person and an accusative of the thing. The dative changes the word for the: der and das become dem (dem Vater, dem Kind), die becomes der (der Mutter), and the plural die becomes den (den Kindern). Ein becomes einem before a masculine or neuter noun and einer before a feminine noun (einem Vater, einem Kind, einer Mutter). In the dative plural every noun adds -n unless it already ends in -n or -s: die Kinder, den Kindern; die Frauen, den Frauen; Wikipedia's page on German declension says the same. The weak nouns keep the -n they have in the accusative: dem Kollegen, dem Nachbarn. Wiktionary's declension table of each noun gives its dative; where it lists a rare variant, such as dem Hunde, only the usual form is shown here. Sources: en.wiktionary's declension tables of each noun and its entries for helfen, gehören, antworten and geben, and the Wikipedia page German declension."
