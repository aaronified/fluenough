schema: 1
id: "de-en-grammar-conjunctions-sentences"
kind: "layer"
core: "de-grammar-conjunctions-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Conjunctions in sentences"
license: "CC-BY-SA-4.0"
description: "18 short sentences with und, oder, aber, denn and sondern, written from the table. Not yet checked by a German speaker: please report any mistake."
cards:
  "de-4650":
    native: "The father and the mother are here."
    notes:
      "n1": "Und joins two nouns."
    bases:
      "Der": "the (masculine)"
      "die": "the (feminine and plural)"
  "de-4651":
    native: "I buy coffee and cake."
    notes:
      "n1": "Und joins two nouns; Wiktionary gives Kaffee und Kuchen as its example."
  "de-4652":
    native: "I work, and you learn."
    notes:
      "n1": "Und joins two clauses; the second keeps its verb in second place."
  "de-4653":
    native: "The dog is sleeping and the child is playing."
    notes:
      "n1": "Und joins two clauses, each with its verb in second place."
    bases:
      "Der": "the (masculine)"
      "das": "that; the (neuter)"
  "de-4654":
    native: "Do you want coffee or tea?"
    notes:
      "n1": "Oder joins two things to choose from."
  "de-4655":
    native: "Are you coming, or are you staying here?"
    notes:
      "n1": "Oder joins two clauses; the second keeps its verb in second place."
  "de-4656":
    native: "I eat cake or bread."
    notes:
      "n1": "Oder joins two nouns."
  "de-4657":
    native: "The village is small, but beautiful."
    notes:
      "n1": "Aber joins two adjectives and sets one against the other."
    bases:
      "Das": "that; the (neuter)"
  "de-4658":
    native: "I am tired, but I am working."
    notes:
      "n1": "Aber joins two clauses; the second keeps its verb in second place."
  "de-4659":
    native: "I do not have coffee, but I have tea."
    notes:
      "n1": "Aber after a negative announces what you do have, as in Wiktionary’s example."
  "de-4660":
    native: "He has no mobile phone, but he has a book."
    notes:
      "n1": "Aber joins two clauses."
    bases:
      "ein": "a; an"
  "de-4661":
    native: "I am staying here, because I am tired."
    notes:
      "n1": "Denn gives the reason, and the verb of its clause stays second: denn ich bin müde."
  "de-4662":
    native: "He is not coming, because he is working."
    notes:
      "n1": "Denn gives the reason for the first clause."
  "de-4663":
    native: "We are waiting, because the train is coming soon."
    notes:
      "n1": "Denn does not move the verb: der Zug kommt."
    bases:
      "der": "the (masculine)"
  "de-4664":
    native: "I do not drink coffee, but tea."
    notes:
      "n1": "Sondern follows a negative, here keinen, and says what is true instead."
  "de-4665":
    native: "He is not tired, but hungry."
    notes:
      "n1": "Sondern follows nicht and says what is true instead."
  "de-4666":
    native: "That is not the father, but the brother."
    notes:
      "n1": "Sondern follows nicht and names the right person."
    bases:
      "Das": "that; the (neuter)"
      "der": "the (masculine)"
  "de-4667":
    native: "We are not staying here, but leaving."
    notes:
      "n1": "Sondern joins two clauses; the second keeps its verb in second place."
