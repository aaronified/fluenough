schema: 1
kind: "phonetics"
id: "de-phonetics"
language: "de"
variety: "Standard German (Hochdeutsch), as the course's broad ipa writes it (tools/transcribe.py german_ipa(): stress marked, ɐ and ɐ̯ for r after a vowel, ʁ elsewhere, ts pf tʃ dʒ as letter pairs, diphthongs without the non-syllabic mark), not a regional or Austrian or Swiss accent"
description: "Rules that turn a card's broad ipa into its narrow [ ] form, in order. Written for tools/derive_phonetic.py, never read by the app. Each rule applies the regular expression to the whole ipa string and replaces every match; the next rule works on the result. Only attested standard German allophony is here: the glottal stop before every word-initial vowel and every stressed vowel, aspiration of every word-initial or stressed-onset p t k (words alone and sentences alike), the uvular [χ] of /x/ after a, aː, ʊ, ɔ, syllabic n l m after an obstruent, the non-syllabic offglide of aɪ aʊ ɔɪ, and tie bars on the affricates. Already in the broad ipa, so not repeated: final devoicing, the ç and x of the ich- and ach-Laut, ɐ and ɐ̯ for r after a vowel, ɛː, and vowel length. Left out, on purpose, because the sources read give no rule: the nasal [ŋ] before k ɡ across a morpheme boundary (Eingang, einkaufen, ankommen, Pfannkuchen), the diminutive -chen as a syllabic n (always [-çən]), the devoiced [ʁ̥] after a voiceless obstruent and the approximant [ʁ̞] (neither appears on Wiktionary's German appendix), the replacement of ɛː by eː (regional), and any place assimilation of a syllabic n after p b k ɡ. The hand-written broad forms use kh for a compound boundary (Parkhaus), which is left alone. Sources are Wikipedia Standard German phonology and Wiktionary Appendix:German pronunciation, both read 2026-11-28; not verified by a German phonetician, so the rules ship unreviewed."
rules:
- id: "de-glottal-stressed"
  pattern: "ˈ(?=[aeiouyɛɪɔʊøœʏɑə])"
  replace: "ˈʔ"
  source: "en.wiktionary.org, \"Appendix:German pronunciation\", stress table and footnote 4, read 2026-11-28 (CC BY-SA 4.0): Beamter [bəˈʔamtɐ]; \"In most standard varieties of German, all initial vowels are preceded by [ʔ]\"; Wikipedia, \"Standard German phonology\", Consonants, read 2026-11-28 (CC BY-SA 4.0): the glottal stop \"occurs in careful speech before word stems that begin with a vowel\". Written only before a stressed vowel-initial syllable, word-initial or after a prefix."
- id: "de-glottal-word-initial"
  pattern: "(?:^|(?<= ))(?=[aeiouyɛɪɔʊøœʏɑə])"
  replace: "ʔ"
  source: "en.wiktionary.org, \"Appendix:German pronunciation\", footnote 4, read 2026-11-28 (CC BY-SA 4.0): \"In most standard varieties of German, all initial vowels are preceded by [ʔ]\"; Wikipedia, \"Standard German phonology\", Consonants, read 2026-11-28 (CC BY-SA 4.0): the glottal stop \"occurs in careful speech before word stems that begin with a vowel\". Written before every word-initial vowel, in a word alone and in a sentence alike (ich is [ʔɪç] everywhere), after the stressed-syllable rule above has handled the vowel after a stress mark."
- id: "de-x-uvular"
  pattern: "(?:(?<=a)|(?<=aː)|(?<=ʊ)|(?<=ɔ))x"
  replace: "χ"
  source: "en.wiktionary.org, \"Appendix:German pronunciation\", consonant table footnote 2, read 2026-11-28 (CC BY-SA 4.0): \"/x/ is realized as a uvular fricative [χ] after [a], [aː], and often [ʊ], [ɔ], and [aʊ]\". After oː and uː it stays [x]. Runs before the diphthong rule so that aʊ is still plain."
- id: "de-aspiration"
  pattern: "(?:^|(?<=[ ˈ]))([ptk])(?![sʃfh])"
  replace: "\\1ʰ"
  source: "Wikipedia, \"Standard German phonology\", Consonants, read 2026-11-28 (CC BY-SA 4.0): the voiceless stops \"are strongly aspirated at the start of a word or stressed syllable\"; \"The aspiration is strongest in the onset of a stressed syllable\". Written on every word-initial p, t, k and every p, t, k right after a stress mark, in a word alone and in a sentence alike (Kind, kauft, Kaffee [kʰaˈfeː]); the weaker aspiration of an unstressed word-initial stop is not marked apart. Not before s, ʃ or f (the affricates ts, tʃ, pf are not aspirated stops) nor before h (the k of a compound such as Parkhaus), and not after ʃ or s (ʃp, ʃt, sp, st), since the stop is then not the first sound of the syllable."
- id: "de-syllabic-n"
  pattern: "(?<![ts]ç)(?<=[pbtdkɡfvszʃʒçxχ])ən(?=$| )"
  replace: "n̩"
  source: "Wikipedia, \"Standard German phonology\", Vowels, notes on /ə/, read 2026-11-28 (CC BY-SA 4.0): \"If a sonorant follows in the syllable coda, the schwa often disappears so that the sonorant becomes syllabic\", Kissen [ˈkɪsn̩]; en.wiktionary.org, \"Appendix:German pronunciation\", footnote 9, read 2026-11-28 (CC BY-SA 4.0). Only word-final -en after an obstruent, and not the diminutive -chen (Mädchen, Brötchen, bisschen: tçən, sçən), which Wikipedia says is always [-çən], so those keep the schwa; sprechen, with ç after a vowel, does get n̩: after a sonorant or a vowel (lernen, sehen) the schwa is kept, and a place assimilation of the n after p, b, k, g is not written."
- id: "de-syllabic-l"
  pattern: "(?<=[pbtdkɡfvszʃʒçxχ])əl(?=$| )"
  replace: "l̩"
  source: "en.wiktionary.org, \"Appendix:German pronunciation\", footnote 9, read 2026-11-28 (CC BY-SA 4.0): \"/ə/, before sonorants /l/, /m/, and /n/ in the syllable coda, often disappears so that they become syllabic\", [l̩]; Wikipedia, \"Standard German phonology\", Vowels, notes on /ə/, read 2026-11-28 (CC BY-SA 4.0). Word-final -el after an obstruent only."
- id: "de-syllabic-m"
  pattern: "(?<=[pbtdkɡfvszʃʒçxχ])əm(?=$| )"
  replace: "m̩"
  source: "en.wiktionary.org, \"Appendix:German pronunciation\", footnote 9, read 2026-11-28 (CC BY-SA 4.0): the schwa of /əm/ in the coda \"often disappears so that they become syllabic\", [m̩]; Wikipedia, \"Standard German phonology\", Vowels, notes on /ə/, read 2026-11-28 (CC BY-SA 4.0). Word-final -em after an obstruent only."
- id: "de-diphthong-offglide"
  pattern: "(aɪ|aʊ|ɔɪ)(?!̯)"
  replace: "\\1̯"
  source: "en.wiktionary.org, \"Appendix:German pronunciation\", Diphthongs, read 2026-11-28 (CC BY-SA 4.0): /aɪ̯/ (weit), /aʊ̯/ (Haut), /ɔɪ̯/ (Heu, Räuber), the second element non-syllabic; Wikipedia, \"Standard German phonology\", Vowels, Diphthongs, read 2026-11-28 (CC BY-SA 4.0). The broad ipa writes them without the mark."
- id: "de-affricate-pf"
  pattern: "(?<!ˈʔa)pf|(?<=ˈʔa)pf(?=ə)"
  replace: "p͡f"
  source: "en.wiktionary.org, \"Appendix:German pronunciation\", consonant table, read 2026-11-28 (CC BY-SA 4.0): /p͡f/ is written with a tie bar; Wikipedia, \"Standard German phonology\", Consonants, read 2026-11-28 (CC BY-SA 4.0): the majority view accepts /pf/ and /ts/ as affricates. Not across the prefix boundary of abfahren, Abfall, Abflug (ab- then f: ˈʔapfaːʁən keeps p and f apart, as the word-initial ap is the prefix ab-): the pattern exempts pf after a word-initial ˈʔa unless a schwa follows, so Apfel (ˈʔapfəl) keeps its affricate [ˈʔap͡fl̩]."
- id: "de-affricate-ts"
  pattern: "ts"
  replace: "t͡s"
  source: "en.wiktionary.org, \"Appendix:German pronunciation\", consonant table, read 2026-11-28 (CC BY-SA 4.0): /t͡s/ is written with a tie bar; Wikipedia, \"Standard German phonology\", Consonants, read 2026-11-28 (CC BY-SA 4.0)."
- id: "de-affricate-tsh"
  pattern: "tʃ"
  replace: "t͡ʃ"
  source: "en.wiktionary.org, \"Appendix:German pronunciation\", consonant table, read 2026-11-28 (CC BY-SA 4.0): /t͡ʃ/ is written with a tie bar (a loan sound, as in Deutsch)."
- id: "de-affricate-dzh"
  pattern: "dʒ"
  replace: "d͡ʒ"
  source: "en.wiktionary.org, \"Appendix:German pronunciation\", consonant table, read 2026-11-28 (CC BY-SA 4.0): /d͡ʒ/ is written with a tie bar (a loan sound, as in Job)."
