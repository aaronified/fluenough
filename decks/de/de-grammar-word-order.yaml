schema: 1
id: "de-grammar-word-order"
part: "core"
kind: "grammar"
language: { code: "de", iso639_3: "deu", name: "German", script: "latin", tts: "de-DE", icon: "De" }
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
pattern:
  slots: ["statement", "other-first", "yes-no", "question-word"]
  entries:
    - lemma: "wohnen"
      key: "wohnen"
      ipa: "ˈvoːnən"
      forms:
        "statement": "Ich wohne hier."
        "other-first": "Hier wohne ich."
        "yes-no": "Wohnst du hier?"
        "question-word": "Wo wohnst du?"
      ipas:
        "statement": "ɪç ˈvoːnə hiːɐ̯"
        "other-first": "hiːɐ̯ ˈvoːnə ɪç"
        "yes-no": "voːnst duː hiːɐ̯"
        "question-word": "voː voːnst duː"
    - lemma: "arbeiten"
      key: "arbeiten"
      ipa: "ˈaʁbaɪtən"
      forms:
        "statement": "Er arbeitet oft hier."
        "other-first": "Oft arbeitet er hier."
        "yes-no": "Arbeitet er hier?"
        "question-word": "Wo arbeitet er?"
      ipas:
        "statement": "eːɐ̯ ˈaʁbaɪtət ɔft hiːɐ̯"
        "other-first": "ɔft ˈaʁbaɪtət eːɐ̯ hiːɐ̯"
        "yes-no": "ˈaʁbaɪtət eːɐ̯ hiːɐ̯"
        "question-word": "voː ˈaʁbaɪtət eːɐ̯"
