schema: 1
kind: "phonetics"
id: "ko-phonetics"
language: "ko"
variety: "Standard (Seoul) Korean, as the course's broad ipa writes it: the South Korean standard's regular allophones and sound changes, not Pyongyang or other dialectal speech, and not fast or casual speech"
description: "Rules that turn a card's broad ipa into its narrow [ ] form, in order. Written for tools/derive_phonetic.py, never read by the app. Each rule applies the regular expression to the whole ipa string and replaces every match; the next rule works on the result. Only rules that are attested are here. The course's broad ipa for Korean (tools/transcribe.py korean(), the comment block above _HG_IPA_ONSET) is phonemic: plain k t p tɕ, tense k\u0348 t\u0348 p\u0348 t\u0348ɕ s\u0348 (the combining mark U+0348), aspirated kʰ tʰ pʰ tɕʰ, s and h, ɾ for ㄹ before a vowel and l at the end of a syllable (ll when two meet), ŋ for ㅇ at the end of a syllable, every coda written as the plain phoneme k t p, the vowels a ʌ o u ɯ i e (ㅐ and ㅔ merged), the glides j w and ɰi, with liaison, nasalisation, ㄹ's changes, ㅎ's aspiration and cluster reduction already made, and an obstruent coda tensing a following plain ㄱ ㄷ ㅂ ㅅ ㅈ. So the rules add what it does not say: the geminate of ㄹ (ko-l-palatal-geminate, ko-l-geminate), ㄹ as a flap before ㅎ (ko-l-flap-before-h), the coronal-plus-ㅅ geminate (ko-coronal-geminate-s), the voicing of the plain stops and the affricate between voiced sounds (ko-k-voiced-medial, ko-t-voiced-medial, ko-p-voiced-medial, ko-tc-voiced-medial), the voiced and palatal/velar/labial allophones of ㅎ (the ko-h rules), ㅅ before i or j as ɕ and a word-initial ㅅ aspirated (ko-s-palatal, ko-s-initial-aspirated), the absorbed glide after a palatal consonant (ko-palatal-glide-drop), the unreleased final stops k\u031A t\u031A p\u031A (the three -unreleased-final rules), ㅟ as ɥi (ko-wi-front-rounded), and the Seoul vowel qualities ɐ e\u031E ʌ\u0339 (the last three rules, which run last because the consonant rules name plain vowel letters). The vowels i o u ɯ and the glide ɰi are left as the broad ipa writes them. Sources: Wikipedia, Korean phonology and Help:IPA/Korean (CC BY-SA 4.0), raw wikitext of both read in full on 2026-11-26; Wiktionary, Module:ko-pron (CC BY-SA 4.0), the pronunciation module whose tidy_ipa function holds the conventions Wiktionary writes, read on 2026-11-26. Wiktionary's narrow Korean forms themselves are not imported (tools/phonetic_languages.yaml, entry ko: they use the tie bar, a stress mark and other conventions the broad ipa does not). Left out, on purpose, and why (not handled): (0) everything that needs the word, not the sounds: tensing after a verb stem's ㄴ or ㅁ (신다, 안다) and in compounds or after a Sino-Korean ㄹ (발달, 일정), the tense ㅅ/ㅈ after ㄹ some words have (the page: lexical exceptions), vowel length (the broad ipa has none; the page says length is almost lost), ㄷ ㅌ + 이 palatalisation across a suffix (같이 -> 가치), the word-initial ㄹ said n or dropped in native and Sino-Korean words against ɾ in loans (the engine writes ɾ; no source rule is deterministic without knowing the word), ㅢ read e as the particle 'of', and the reading of ㅎ after ㄴ ㅁ ㅇ ㄹ as silent in fast speech; (1) variation the sources give as optional: the aspiration of initial plain stops ([k ~ kʰ], younger speakers), the denasalised word-initial ㅁ ㄴ ([m\u034A n\u034A]), voicing of ㅅ between vowels ('possible'), voicing of the aspirated stops (10 to 15 percent), the silent ㅎ after a consonant, the long ɘː, the affrication of ㅋ before i and ɯ ([cçi], [kxɯ]: 'often'), the monophthong [y] for ㅟ and [ø] for ㅚ, and the retention of ɛ against e; (2) sources that conflict or are single-source: the palatalised consonant before a glide ([kʲoː] in one of Wikipedia's examples, [ɲ] for nj in Wiktionary's module, no statement in the other pages), ㅅ before wi as [ʃ] (Wiktionary only), and the exact narrow symbol of ㅏ (ɐ on Wikipedia, a\u0320 on Wiktionary: Wikipedia's is written); (3) the quality of ㅗ and ㅜ (Wikipedia proposes [u\u0339] and [u\u031C] as alternatives; the plain letters are the form both pages list), the dental against alveolar place of t and n (not stated for Seoul), and the release of tense stops; (4) the tie bar of the affricates and the stress mark, which the course's ipa does not use. (5) a gap in the broad ipa that the rules cannot fully repair: korean() writes a coda ㅅ ㅆ ㅈ ㅊ ㅌ ㅍ ㄲ ㅋ before ㅎ as k/t/p + h (따뜻하다 t\u0348at\u0348ɯthata), where the standard has the aspirate; ko-obstruent-h-aspiration merges it in the narrow form only, and the broad ipa stays as the engine wrote it, to be fixed in tools/transcribe.py. A rule left out is not a claim that it does not exist. The rules ship unreviewed: they follow the written sources, but a Korean phonetician should check the h-allophone rules (ko-h-*), the aspirated word-initial ㅅ and the choice of ɐ before they count as checked; the unreleased rule marks a stop before another consonant, which the page writes in its sequence table, not in every sentence-level recording."
rules:
  - id: "ko-obstruent-h-aspiration"
    pattern: "([ktp])h"
    replace: "\\1ʰ"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section Consonant assimilation: After /h/, tenuis stops become aspirated; its sequence table, column ㅎ h-: velar stops -k + ㅎ is [.kʰ], coronal stops -t + ㅎ is [.tʰ], labial stops -p + ㅎ is [.pʰ]; Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26: ㅋ ㅌ ㅍ come from ㄱㅎ ㅎㄱ, ㄷㅎ ㅎㄷ, ㅂㅎ ㅎㅂ (석회 seokhoe, 맞흥정 matheungjeong, 잡학 japhak). The engine (tools/transcribe.py korean()) merges ㅎ with a plain stop next to it for the letters ㄱ ㄷ ㅂ ㅈ, but a coda ㅅ ㅆ ㅈ ㅊ ㅌ ㅍ ㄲ ㅋ before ㅎ (따뜻하다 t\u0348ɯthata) is said t k p first and leaves the sequence th kh ph in the broad ipa; a k t p directly before h is always that sequence, so the rule merges it into the aspirate. First rule, so every later rule sees kʰ tʰ pʰ. Reported to the engine owner as a gap in the broad ipa."
  - id: "ko-l-palatal-geminate"
    pattern: "ll(?:j|(?=i))"
    replace: "ʎː"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, table 'Allophones of consonants before vowels', row ㄹ geminated: [ʎː] before /i, j/ and [lː] elsewhere; prose of 'Sonorants': ㄹ is 'palatalized to [ʎ] before /i, j/ ... next to another /l/'. Wiktionary, Module:ko-pron (CC BY-SA 4.0), raw source read 2026-11-26, function tidy_ipa writes the same ('ɭɭi' -> 'ʎʎi', 'ɭɭj' -> 'ʎʎ', the glide j absorbed). The broad ipa (tools/transcribe.py korean()) writes two ㄹ that meet (신라, 설날) as ll, so ll before i or j is ʎː, with a j dropped as the palatal consonant already has it. First of the rules, so the next one only sees the other ll."
  - id: "ko-l-geminate"
    pattern: "ll"
    replace: "lː"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, table 'Allophones of consonants before vowels', row ㄹ geminated: [lː] before every vowel but /i, j/; section 'Consonant assimilation': both ⫽nl⫽ and ⫽ln⫽ are [lː]; Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, footnote on ㄹ: 'ㄹㄴ and ㄴㄹ may be [ɭː]'. The broad ipa writes it ll; the narrow form uses the length mark. Plain ㄹ at the end of a syllable stays [l] ([l] or [ɭ] per both pages: the first is taken)."
  - id: "ko-l-flap-before-h"
    pattern: "(?<=[aeiouʌɯjwɰ])l(?=h)"
    replace: "ɾ"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section 'Sonorants': 'ㄹ /l/ is an alveolar flap [ɾ] between vowels or between a vowel and an /h/'; its table 'Phonetic realization of underlying consonant sequences' row ㄹ -l, column ㅎ h-: 'l.ɦ ~ .ɾ'. The broad ipa writes a syllable-final ㄹ before ㅎ as l (말하다 malhada), so after a vowel it becomes the flap; the ㅎ then voices by ko-h-voiced-between-voiced. After a consonant (the ll case is above) it is left alone."
  - id: "ko-coronal-geminate-s"
    pattern: "ts\u0348"
    replace: "s\u0348ː"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section 'Consonant assimilation': 'Before the fricatives /s, s\u0348/, coronal obstruents assimilate to a fricative, resulting in a geminate. That is, ⫽tʰs⫽ is pronounced /ss\u0348/ ([s\u0348ː])'; the sequence table, row coronal stops -t, columns ㅅ and ㅆ: 's.s\u0348'. The broad ipa writes a coronal obstruent coda (ㄷ ㅅ ㅆ ㅈ ㅊ ㅌ, all t) before ㅅ as t + s\u0348, because the engine tenses ㅅ after an obstruent, so ts\u0348 is always that sequence and becomes s\u0348ː. Before i or j the palatalisation rule below makes it ɕ\u0348ː, as the page's '[ɕɕ\u0348] (that is, [ɕ\u0348ː])'. Runs before the unreleased-stop rule, so the t is gone."
  - id: "ko-k-voiced-medial"
    pattern: "(?<=[aeiouʌɯjwɰmnŋlɾ])k(?=[aeiouʌɯjwɰ])"
    replace: "ɡ"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section 'Plain': '/p, t, tɕ, k/ are voiced [b, d, dʑ, ɡ] between sonorants (including all vowels and certain consonants) but voiceless elsewhere'; section 'Positional allophones', medial allophone ㄱ = [ɡ]; the sequence table writes voiced stops after ŋ, n, l and m (ŋ.ɡ, n.ɡ, l.ɡ, m.ɡ). Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, footnote: the plain stops and affricate are voiced 'between voiced sounds' (마개 magae). Applies to a plain k that follows a vowel, glide, m, n, ŋ, l or ɾ inside a word and is followed by a vowel or glide; a word-initial k (after a space or at the start) is not voiced, and the tense kʰ, k\u0348 never match. The fricative or aspirated variants some speakers use are not taken (see the file description)."
  - id: "ko-t-voiced-medial"
    pattern: "(?<=[aeiouʌɯjwɰmnŋlɾ])t(?=[aeiouʌɯjwɰ])"
    replace: "d"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section 'Plain' (/t/ voiced to [d] between sonorants) and 'Positional allophones' (medial allophone ㄷ = [d]); the sequence table (ŋ.d, n.d, l.d, m.d); Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, footnote on ㄷ: 민들레 mindeulle [d] after n. Same environment as ko-k-voiced-medial; t before ɕ (the affricate tɕ) is not followed by a vowel and is left for the next rule."
  - id: "ko-p-voiced-medial"
    pattern: "(?<=[aeiouʌɯjwɰmnŋlɾ])p(?=[aeiouʌɯjwɰ])"
    replace: "b"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section 'Plain' (/p/ voiced to [b] between sonorants), 'Positional allophones' (medial allophone ㅂ = [b]) and the sequence table (ŋ.b, l.b, m.b); Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, footnote on ㅂ: 이불 ibul [b]. Same environment as ko-k-voiced-medial."
  - id: "ko-tc-voiced-medial"
    pattern: "(?<=[aeiouʌɯjwɰmnŋlɾ])tɕ(?=[aeiouʌɯjwɰ])"
    replace: "dʑ"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section 'Plain' (/tɕ/ voiced to [dʑ] between sonorants), 'Positional allophones' (medial allophone ㅈ = [dʑ]), the sequence table (ŋ.dʑ, n.dʑ, l.dʑ, m.dʑ); Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, footnote on ㅈ: 아버지 abeoji [dʑ]. The Seoul affricate is alveolo-palatal [tɕ ~ dʑ] (the page: Pyongyang [ts ~ dz] is another variety). tɕ before ʰ is the aspirate ㅊ and tɕ after a tense mark is not this symbol, so neither matches (a vowel must follow)."
  - id: "ko-h-voiced-between-voiced"
    pattern: "(?<=[aeiouʌɯjwɰmnŋlɾ])h(?=[aeiouʌɯjwɰ])"
    replace: "ɦ"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section 'Fricatives': ㅎ 'Intervocalically ... is realized as voiced [ɦ], and after voiced consonants it is either [ɦ] or silent'; its sequence table writes 'n.ɦ ~ .n', 'ŋ.ɦ ~ .ŋ', 'l.ɦ ~ .ɾ', 'm.ɦ ~ .m'; Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, footnote: 'ㅎ is voiced between voiced sounds' (더하기 deohagi [ɦ]). The silent variant after a consonant is an option and is not taken: ɦ, the form both pages list first. Environment: after a vowel, glide, m, n, ŋ, l or ɾ and before a vowel or glide."
  - id: "ko-h-palatal-voiced"
    pattern: "ɦj|ɦ(?=i)"
    replace: "ʝ"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, table 'Allophones of consonants before vowels', row ㅎ intervocalically: [ʝ] before /i, j/; Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26: ㅎ [ʝ] in 감히 gamhi. The glide j after the palatal fricative is not written, as Wiktionary, Module:ko-pron (CC BY-SA 4.0), raw source read 2026-11-26, function tidy_ipa (gsub 'ɦj' -> 'ʝ') and Help:IPA/Korean do (흉내 hyungnae begins with the one symbol ç)."
  - id: "ko-h-velar-voiced"
    pattern: "ɦ(?=ɯ)"
    replace: "ɣ"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, table 'Allophones of consonants before vowels', row ㅎ intervocalically: [ɣ] before /ɯ/; Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26: ㅎ [ɣ] in 마흔 maheun; Wiktionary, Module:ko-pron (CC BY-SA 4.0), raw source read 2026-11-26, function tidy_ipa: 'ɦɯ' -> 'ɣɯ'."
  - id: "ko-h-labial-voiced"
    pattern: "ɦw|ɦ(?=[ou])"
    replace: "βʷ"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, table 'Allophones of consonants before vowels', row ㅎ intervocalically: [βʷ] before /o, u, w/; Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26: 'βʷ' for ㅎ in 오후 ohu. The glide w after it is not written: the labialised fricative already has it (Help:IPA/Korean lists 활 hwal under the ɸʷ symbol). Wiktionary, Module:ko-pron (CC BY-SA 4.0), raw source read 2026-11-26, function tidy_ipa instead keeps the glide and writes βw; the two sources differ here and the Wikipedia pages are followed."
  - id: "ko-h-initial-palatal"
    pattern: "hj|h(?=i)"
    replace: "ç"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section 'Palatalization': 'ㅎ /h/ ... becomes a palatal [ç] before /i/ or /j/'; its table, row ㅎ word-initially: [ç] before /i, j/; Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26: ㅎ [ç] in 힘 him and 흉내 hyungnae; Wiktionary, Module:ko-pron (CC BY-SA 4.0), raw source read 2026-11-26, function tidy_ipa: 'hi' -> 'çi', 'hj' -> 'ç'. After this rule and the three voiced ones above no ㅎ stays between voiced sounds, so every remaining h is word-initial (the engine merges ㅎ with a neighbouring stop and drops it after other consonants). The glide j is absorbed in the palatal consonant."
  - id: "ko-h-initial-velar"
    pattern: "h(?=ɯ)"
    replace: "x"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, sections 'Palatalization' and the allophone table: ㅎ is 'a velar [x] before /ɯ/' (word-initially); Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26: ㅎ [x] in 흙 heuk; Wiktionary, Module:ko-pron (CC BY-SA 4.0), raw source read 2026-11-26, function tidy_ipa: 'hɯ' -> 'xɯ'."
  - id: "ko-h-initial-labial"
    pattern: "hw|h(?=[ou])"
    replace: "ɸʷ"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, sections 'Palatalization' and the allophone table: ㅎ is 'a bilabial [ɸʷ] before /o/, /u/ and /w/' (word-initially); Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26: ㅎ [ɸʷ] in 활 hwal and 훗날 hunnal. A following w is absorbed, as in ko-h-labial-voiced; Wiktionary, Module:ko-pron (CC BY-SA 4.0), raw source read 2026-11-26, function tidy_ipa keeps it (ɸw), the Wikipedia pages are followed."
  - id: "ko-s-palatal"
    pattern: "s(?=\u0348?ː?[ij])"
    replace: "ɕ"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section 'Palatalization': 'The vowel that most affects consonants is /i/, which, along with its semivowel homologue /j/, palatalizes /s/ and /s\u0348/ to alveolo-palatal [ɕ] and [ɕ\u0348] for most speakers'; its table, rows ㅅ and ㅆ: [ɕ] and [ɕ\u0348] before /i, j/, [s] and [s\u0348] elsewhere (also before /ɯ/); Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, footnote on ɕ. The tense mark and a geminate length mark stay (s\u0348 -> ɕ\u0348, s\u0348ː -> ɕ\u0348ː). The page notes the Pyongyang variety and some Seoul speakers before back vowels keep [s]; the Seoul standard is written. Not applied before wi (쉬), see the file description."
  - id: "ko-s-initial-aspirated"
    pattern: "(?<![^\\s])([sɕ])(?!\u0348)"
    replace: "\\1ʰ"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section 'Fricatives': ㅅ 'shows moderate aspiration word-initially but no aspiration word-medially'; Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26: ㅅ [sʰ] in 수박 subak (the plain ㅅ before i is [ɕ] in the same page, the aspirated one is written ɕʰ by Wiktionary, Module:ko-pron (CC BY-SA 4.0), raw source read 2026-11-26, function tidy_ipa, whose tidy_ipa rules match 's([ʰ\u0348])' and 'ɕ' with an optional ʰ). Only the first ㅅ of a word is written aspirated (after a space or at the start); a tense ㅆ is not (no ʰ after s\u0348 or ɕ\u0348). The initial plain stops are said [k ~ kʰ], [t ~ tʰ], [p ~ pʰ], [tɕ ~ tɕʰ] by the page's table and are left plain, see the file description."
  - id: "ko-palatal-glide-drop"
    pattern: "([ɕʑ])([ʰ\u0348]?ː?)j"
    replace: "\\1\\2"
    source: "Wiktionary, Module:ko-pron (CC BY-SA 4.0), raw source read 2026-11-26, function tidy_ipa: gsub(ipa, '([ʑɕ])([ʰ\u0348]?)j', '%1%2'), the glide j after an alveolo-palatal sibilant or affricate (tɕ, dʑ, t\u0348ɕ, tɕʰ, ɕ, ɕʰ, ɕ\u0348) is not written, because the consonant is already palatal; the same sequence is how Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26 and Wikipedia's page write 샤 and 져 (the page's table gives tɕ as the affricate of /tɕ/, /tɕʰ/, /t\u0348ɕ/ before every vowel with no glide). The broad ipa writes the glide of ㅑ ㅕ ㅛ ㅠ ㅖ after ㅈ ㅉ ㅊ and ㅅ ㅆ before ㅑ ㅕ ㅛ ㅠ (져 tɕjʌ, 샤 sja), the standard pronunciation says them without it. Runs after the rules that write ɕ and dʑ."
  - id: "ko-k-unreleased-final"
    pattern: "k(?![aeiouʌɯjwɰʰ\u0348])"
    replace: "k\u031A"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section 'Positional allophones': 'All obstruents become stops with no audible release at the end of a word: all coronals collapse to [t\u031A], all labials to [p\u031A], and all velars to [k\u031A]', the final allophone of ㄱ ㅋ ㄲ is [k\u031A], and the sequence table writes 'k\u031A.k\u0348', 'k\u031A.t\u0348', 'k\u031A.tɕʰ' for a velar before another consonant; Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26: ㄱ ㅋ [k\u031A] at the end of a syllable (바지락 bajirak). The broad ipa writes every coda as the plain phoneme k t p, so a k that no vowel or glide follows (and that is not the aspirate kʰ or the tense k\u0348) is a coda, at the end of a word or before another consonant; the nasalised case (ŋ) was already made by the engine."
  - id: "ko-t-unreleased-final"
    pattern: "t(?![aeiouʌɯjwɰʰ\u0348ɕ])"
    replace: "t\u031A"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section 'Positional allophones' (all coronal obstruents collapse to [t\u031A] finally) and the sequence table ('t\u031A.k\u0348', 't\u031A.p\u0348', 't\u031A.tɕʰ'); Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26: ㄷ ㅌ ㅅ ㅈ ㅊ [t\u031A] at the end of a syllable (곧 got). A t that no vowel, glide, aspiration mark, tense mark or ɕ follows is a coda (t followed by ɕ is the affricate tɕ; a coda t before ㅅ was turned into a geminate by ko-coronal-geminate-s)."
  - id: "ko-p-unreleased-final"
    pattern: "p(?![aeiouʌɯjwɰʰ\u0348])"
    replace: "p\u031A"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section 'Positional allophones' (all labials collapse to [p\u031A] finally) and the sequence table ('p\u031A.k\u0348', 'p\u031A.t\u0348', 'p\u031A.pʰ'); Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26: ㅂ ㅍ [p\u031A] at the end of a syllable (잎 ip). Same environment as ko-k-unreleased-final."
  - id: "ko-wi-front-rounded"
    pattern: "wi"
    replace: "ɥi"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section 'Diphthongs and glides': ㅟ is /wi ~ y/ [ɥi] ('Korean used to have two additional phonemes, ø ㅚ and y ㅟ, but they are replaced by the diphthongs [we] and [ɥi] by the majority of speakers'; example 뒤 dwi [twi] in the table, [ɥi] as the realisation). The broad ipa writes ㅟ as wi (and ㅚ ㅙ ㅞ as we), and w + i occurs only as ㅟ, so wi becomes ɥi. The [y] monophthong some speakers have is not taken."
  - id: "ko-a-central"
    pattern: "a"
    replace: "ɐ"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section 'Vowels': 'Korean /a/ is phonetically [ɐ]' (monophthong table, Seoul: ㅏ [ɐ]; diphthong table: /ja/ [jɐ], /wa/ [wɐ]); Wikipedia, Help:IPA/Korean (CC BY-SA 4.0), raw wikitext read in full 2026-11-26: ㅏ [ɐ]. Wiktionary's pages write [a\u0320] for the same vowel (Wiktionary, Module:ko-pron (CC BY-SA 4.0), raw source read 2026-11-26, function tidy_ipa, example [ˈmʌ\u0339ɭda\u0320]); the Wikipedia symbol is used because two pages agree. Runs last with the other vowel rules, so the consonant rules above see plain vowel letters."
  - id: "ko-e-lowered"
    pattern: "e"
    replace: "e\u031E"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section 'Vowels': the Seoul vowels ㅔ and ㅐ are both [e\u031E] ('both are most commonly realized as [e\u031E]', the distinction being lost in South Korean dialects); in the diphthong table /je/ [je\u031E], /we/ [kwe\u031E]. The broad ipa writes ㅔ ㅐ ㅖ ㅒ ㅚ ㅙ ㅞ with e (the same merger). The older ɛ for ㅐ is not written: the course teaches the merged Seoul vowel."
  - id: "ko-vowel-open-mid-back"
    pattern: "ʌ"
    replace: "ʌ\u0339"
    source: "Wikipedia, Korean phonology (CC BY-SA 4.0), raw wikitext read in full 2026-11-26, section 'Vowels', Seoul monophthong table: ㅓ [ʌ\u0339] (a slightly rounded open-mid back vowel); Wiktionary, Module:ko-pron (CC BY-SA 4.0), raw source read 2026-11-26, function tidy_ipa writes ʌ\u0339 as well (tidy_ipa: 'ʌ\u0339(ː)' -> 'ɘ(ː)' for the long vowel). The long variant [ɘː] used by speakers who keep vowel length is not written (the broad ipa has no length)."
