# Unit 44 (ko-grammar-future). Sources read: en.wiktionary.org entries -을 것이다 (will / intention and supposition; 거예요 is the colloquial form; the contrast with -겠-; the example 저는 내일 시험 공부 할 거예요) and -을까 / -ㄹ까 (the question 'should we ...?'; 음악이나 들을까요?),
# the conjugation table of every verb (its future determiner -을/-ㄹ, e.g. 먹을, 갈, is copied from it) and en.wikipedia.org 'Korean verbs' (the attributive future ending -을/-ㄹ).
