schema: 1
id: "ko-en-family-sentences"
kind: "layer"
core: "ko-family-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Family in sentences"
license: "CC-BY-SA-4.0"
description: "Nine family sentences to put in order, each in the polite -요 (-yo) style. Not yet checked by a Korean speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "ko-4040":
    "native": "My father is an office worker."
    "confusables":
      "w1":
        "why": "어머니 (eomeoni) is mother, not father."
      "w2":
        "why": "아들 (adeul) is son, not father."
  "ko-4041":
    "native": "What is Dad's name?"
    "confusables":
      "w1":
        "why": "엄마 (eomma) is mum, not dad."
      "w2":
        "why": "아버지 (abeoji) is father, the more formal word."
  "ko-4042":
    "native": "Do you have a younger sibling?"
    "confusables":
      "w1":
        "why": "누나 (nuna) is an older sister, said by a male."
      "w2":
        "why": "남동생 (namdongsaeng) is a younger brother, not a sibling of either gender."
  "ko-4043":
    "native": "My older sister is a doctor."
    "confusables":
      "w1":
        "why": "오빠 (oppa) is an older brother, said by a female."
      "w2":
        "why": "누나 (nuna) is an older sister, said by a male."
  "ko-4044":
    "native": "Thank you, grandmother."
    "confusables":
      "w1":
        "why": "할아버지 (harabeoji) is grandfather."
      "w2":
        "why": "외할머니 (oehalmeoni) is a maternal grandmother."
  "ko-4045":
    "native": "How many people are in your family?"
    "confusables":
      "w1":
        "why": "부모 (bumo) is parents, not the whole family."
      "w2":
        "why": "형제 (hyeongje) is brothers."
  "ko-4046":
    "native": "Is your wife a teacher?"
    "confusables":
      "w1":
        "why": "남편 (nampyeon) is husband."
      "w2":
        "why": "어머니 (eomeoni) is mother."
  "ko-4047":
    "native": "Where is your maternal aunt?"
    "confusables":
      "w1":
        "why": "고모 (gomo) is a paternal aunt."
      "w2":
        "why": "외할머니 (oehalmeoni) is a maternal grandmother."
  "ko-4048":
    "native": "What is the child's name?"
    "confusables":
      "w1":
        "why": "자녀 (janyeo) is children, in a more general sense."
      "w2":
        "why": "동생 (dongsaeng) is a younger sibling."
