"schema": 1
"id": "ko-en-directions"
"kind": "layer"
"core": "ko-directions"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Directions and signs"
"license": "CC-BY-SA-4.0"
"description": "Twenty-nine words for the way: the compass points, straight on, front and back, crossroads, traffic lights and signs. Each has a polite -요 (-yo) example. Not yet checked by a Korean speaker: please report any mistake."
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ko-2740":
    "native": "north, the north side"
    "notes":
      "n1": "The opposite is 남쪽 (namjjok), the south. 쪽 (jjok) is the word for a side or a direction."
    "examples":
      "북쪽이 어디예요?":
        "native": "Where is the north?"
        "bases":
          "북쪽이": "north, with the subject particle 이 (i)"
      "이 방은 북쪽에 있어요.":
        "native": "This room is in the north."
        "bases":
          "북쪽에": "north, with the place particle 에 (e)"
          "있어요": "be, exist, polite form"
  "ko-2741":
    "native": "south, the south side"
    "notes":
      "n1": "The opposite of 북쪽 (bukjjok), north. The dictionary gloss also names the South as a country; this card is the direction."
    "examples":
      "남쪽이 어디예요?":
        "native": "Where is the south?"
        "bases":
          "남쪽이": "south, with the subject particle 이 (i)"
      "이 방은 남쪽에 있어요.":
        "native": "This room is in the south."
        "bases":
          "남쪽에": "south, with the place particle 에 (e)"
          "있어요": "be, exist, polite form"
  "ko-2742":
    "native": "east, the east side"
    "notes":
      "n1": "The opposite of 서쪽 (seojjok), west. The sun rises in the east, 동쪽 (dongjjok)."
    "examples":
      "동쪽이 어디예요?":
        "native": "Where is the east?"
        "bases":
          "동쪽이": "east, with the subject particle 이 (i)"
      "동쪽에 물이 있어요.":
        "native": "There is water in the east."
        "bases":
          "동쪽에": "east, with the place particle 에 (e)"
          "있어요": "be, exist, polite form"
  "ko-2743":
    "native": "west, the west side"
    "notes":
      "n1": "The opposite of 동쪽 (dongjjok), east."
    "examples":
      "서쪽이 어디예요?":
        "native": "Where is the west?"
        "bases":
          "서쪽이": "west, with the subject particle 이 (i)"
      "서쪽에 커피가 있어요.":
        "native": "There is coffee in the west."
        "bases":
          "서쪽에": "west, with the place particle 에 (e)"
          "있어요": "be, exist, polite form"
  "ko-2744":
    "native": "north-east"
    "notes":
      "n1": "A compass point between 북쪽 (bukjjok), north, and 동쪽 (dongjjok), east."
    "examples": {}
  "ko-2745":
    "native": "south-west"
    "notes":
      "n1": "A compass point between 남쪽 (namjjok), south, and 서쪽 (seojjok), west."
    "examples": {}
  "ko-2746":
    "native": "going straight on"
    "notes":
      "n1": "The noun for going straight on; the phrase is said with 해요 (haeyo), as in 직진 (jikjin) 해 (hae)요 (jikjin haeyo), go straight."
    "examples":
      "직진 해요.":
        "native": "Go straight on."
        "bases":
          "해요": "do, polite form"
      "직진 해요?":
        "native": "Do you go straight on?"
        "bases":
          "해요": "do, polite form"
  "ko-2747":
    "native": "straight on, without turning"
    "notes":
      "n1": "Used with a verb of going: 곧장 (gotjang) 가요 (gayo), go straight on, with no turn."
    "examples":
      "곧장 가요.":
        "native": "Go straight on."
        "bases":
          "가요": "go, polite form"
      "학생이 곧장 가요.":
        "native": "The student goes straight on."
        "bases":
          "가요": "go, polite form"
  "ko-2748":
    "native": "the front"
    "notes":
      "n1": "The front part of a place. The opposite is 뒤쪽 (dwijjok), the back."
    "examples":
      "앞쪽에 방이 있어요.":
        "native": "There is a room in front."
        "bases":
          "앞쪽에": "front, with the place particle 에 (e)"
          "있어요": "be, exist, polite form"
      "앞쪽이 어디예요?":
        "native": "Where is the front?"
        "bases":
          "앞쪽이": "front, with the subject particle 이 (i)"
  "ko-2749":
    "native": "the back, the rear"
    "notes":
      "n1": "The back part of a place. The opposite is 앞쪽 (apjjok), the front."
    "examples":
      "뒤쪽에 물이 있어요.":
        "native": "There is water at the back."
        "bases":
          "뒤쪽에": "back, with the place particle 에 (e)"
          "있어요": "be, exist, polite form"
      "뒤쪽이 어디예요?":
        "native": "Where is the back?"
        "bases":
          "뒤쪽이": "back, with the subject particle 이 (i)"
  "ko-2750":
    "native": "crossroads, intersection"
    "notes":
      "n1": "A place where roads cross; a crossing with four ways is 사거리 (sageori)."
    "examples":
      "교차로가 어디예요?":
        "native": "Where is the crossroads?"
        "bases":
          "교차로가": "crossroads, with the subject particle 가 (ga)"
      "교차로에 신호등이 있어요.":
        "native": "There is a traffic light at the crossroads."
        "bases":
          "교차로에": "crossroads, with the place particle 에 (e)"
          "있어요": "be, exist, polite form"
  "ko-2751":
    "native": "four-way crossroads"
    "notes":
      "n1": "The first syllable, 사 (sa), is the Sino-Korean number four, so the word means a crossing of four roads."
    "examples":
      "사거리가 어디예요?":
        "native": "Where is the four-way crossroads?"
        "bases":
          "사거리가": "four-way crossroads, with the subject particle 가 (ga)"
  "ko-2752":
    "native": "crosswalk, pedestrian crossing"
    "notes":
      "n1": "The word for a crosswalk in South Korea; the dictionary tags it as used there, and a Korean reviewer checks it."
    "examples":
      "횡단보도가 어디예요?":
        "native": "Where is the crosswalk?"
        "bases":
          "횡단보도가": "crosswalk, with the subject particle 가 (ga)"
      "횡단보도에 신호등이 있어요.":
        "native": "There is a traffic light at the crosswalk."
        "bases":
          "횡단보도에": "crosswalk, with the place particle 에 (e)"
          "있어요": "be, exist, polite form"
  "ko-2753":
    "native": "traffic light"
    "notes":
      "n1": "The light that tells people and cars when to stop and go; it is put at a 교차로 (gyocharo), a crossroads."
    "examples":
      "신호등이 있어요?":
        "native": "Is there a traffic light?"
        "bases":
          "신호등이": "traffic light, with the subject particle 이 (i)"
          "있어요": "be, exist, polite form"
      "이 신호등이 있어요.":
        "native": "There is this traffic light."
        "bases":
          "신호등이": "traffic light, with the subject particle 이 (i)"
          "있어요": "be, exist, polite form"
  "ko-2754":
    "native": "cross, go across"
    "notes":
      "n1": "Used for crossing a road, a river or a ridge; the place crossed is the object."
    "examples":
      "학생이 건너요.":
        "native": "The student crosses."
        "bases":
          "건너요": "cross, polite form"
      "선생님이 건너요?":
        "native": "Is the teacher crossing?"
        "bases":
          "건너요": "cross, polite form"
  "ko-2755":
    "native": "turn, spin, go round"
    "notes":
      "n1": "돌다 (dolda) keeps its ㄹ (l) before 아 (a), so the polite form is 돌아요 (dorayo). The dictionary tags one sense as colloquial; a reviewer checks it."
    "examples":
      "차가 돌아요.":
        "native": "The car turns."
        "bases":
          "돌아요": "turn, polite form"
      "학생이 돌아요?":
        "native": "Does the student turn?"
        "bases":
          "돌아요": "turn, polite form"
  "ko-2756":
    "native": "pass by, go past"
    "notes":
      "n1": "Used for passing a place, and for time passing."
    "examples":
      "차가 지나요.":
        "native": "The car goes past."
        "bases":
          "지나요": "pass, polite form"
      "학생이 지나요?":
        "native": "Does the student pass by?"
        "bases":
          "지나요": "pass, polite form"
  "ko-2757":
    "native": "exit, way out"
    "notes":
      "n1": "The way out of a building or a station. The opposite is 입구 (ipgu), the entrance."
    "examples":
      "출구가 어디예요?":
        "native": "Where is the exit?"
        "bases":
          "출구가": "exit, with the subject particle 가 (ga)"
      "출구에 물이 있어요.":
        "native": "There is water at the exit."
        "bases":
          "출구에": "exit, with the place particle 에 (e)"
          "있어요": "be, exist, polite form"
  "ko-2758":
    "native": "entrance, way in"
    "notes":
      "n1": "The way into a building or a place. The opposite is 출구 (chulgu), the exit."
    "examples":
      "입구가 어디예요?":
        "native": "Where is the entrance?"
        "bases":
          "입구가": "entrance, with the subject particle 가 (ga)"
      "입구에 커피가 있어요.":
        "native": "There is coffee at the entrance."
        "bases":
          "입구에": "entrance, with the place particle 에 (e)"
          "있어요": "be, exist, polite form"
  "ko-2759":
    "native": "direction"
    "notes":
      "n1": "The way something faces or goes; 어느 (eoneu) before it asks which direction, as in 어느 (eoneu) 방 (bang)향 (eoneu banghyang)."
    "examples":
      "어느 방향이에요?":
        "native": "Which direction is it?"
        "bases":
          "방향이에요": "direction, with the polite 'is' 이에요 (ieyo)"
  "ko-2760":
    "native": "location, position"
    "notes":
      "n1": "The place where a thing is; 어디 (eodi) asks where it is."
    "examples":
      "위치가 어디예요?":
        "native": "Where is the location?"
        "bases":
          "위치가": "location, with the subject particle 가 (ga)"
  "ko-2761":
    "native": "map"
    "notes":
      "n1": "A map of a place, on paper or on a phone."
    "examples":
      "지도가 있어요?":
        "native": "Is there a map?"
        "bases":
          "지도가": "map, with the subject particle 가 (ga)"
          "있어요": "be, exist, polite form"
      "이 지도가 있어요.":
        "native": "There is this map."
        "bases":
          "지도가": "map, with the subject particle 가 (ga)"
          "있어요": "be, exist, polite form"
  "ko-2762":
    "native": "sign, signboard"
    "notes":
      "n1": "A sign put up beside a road or on a building to show the way."
    "examples":
      "표지판이 있어요?":
        "native": "Is there a sign?"
        "bases":
          "표지판이": "sign, with the subject particle 이 (i)"
          "있어요": "be, exist, polite form"
      "표지판이 있어요.":
        "native": "There is a sign."
        "bases":
          "표지판이": "sign, with the subject particle 이 (i)"
          "있어요": "be, exist, polite form"
  "ko-2763":
    "native": "corner"
    "notes":
      "n1": "The corner where two streets or walls meet."
    "examples":
      "모퉁이에 커피가 있어요.":
        "native": "There is coffee at the corner."
        "bases":
          "모퉁이에": "corner, with the place particle 에 (e)"
          "있어요": "be, exist, polite form"
      "모퉁이가 어디예요?":
        "native": "Where is the corner?"
        "bases":
          "모퉁이가": "corner, with the subject particle 가 (ga)"
  "ko-2764":
    "native": "end, the end"
    "notes":
      "n1": "The end of a line, a road or a thing. The opposite is 처음 (cheoeum), the beginning."
    "examples":
      "끝이 어디예요?":
        "native": "Where is the end?"
        "bases":
          "끝이": "end, with the subject particle 이 (i)"
  "ko-2765":
    "native": "the middle"
    "notes":
      "n1": "The middle of a place or between two things, as in a line."
    "examples":
      "중간에 방이 있어요.":
        "native": "There is a room in the middle."
        "bases":
          "중간에": "middle, with the place particle 에 (e)"
          "있어요": "be, exist, polite form"
      "중간이 어디예요?":
        "native": "Where is the middle?"
        "bases":
          "중간이": "middle, with the subject particle 이 (i)"
  "ko-2766":
    "native": "the inside, the inner part"
    "notes":
      "n1": "The inner part of a place. The opposite is the outer part, 바깥쪽 (bakkatjjok)."
    "examples":
      "안쪽에 빵이 있어요.":
        "native": "There is bread inside."
        "bases":
          "안쪽에": "inside, with the place particle 에 (e)"
          "있어요": "be, exist, polite form"
      "안쪽이 어디예요?":
        "native": "Where is the inside?"
        "bases":
          "안쪽이": "inside, with the subject particle 이 (i)"
  "ko-2767":
    "native": "near, close by"
    "notes":
      "n1": "Used for something close to you in place; the opposite is 멀리 (meolli), far away."
    "examples":
      "방이 가까이 있어요.":
        "native": "The room is near."
        "bases":
          "있어요": "be, exist, polite form"
      "가까이 있어요?":
        "native": "Is it near?"
        "bases":
          "있어요": "be, exist, polite form"
  "ko-2768":
    "native": "far, far away"
    "notes":
      "n1": "Used for something at a distance; the opposite is 가까이 (gakkai), near."
    "examples":
      "방이 멀리 있어요.":
        "native": "The room is far away."
        "bases":
          "있어요": "be, exist, polite form"
      "멀리 있어요?":
        "native": "Is it far away?"
        "bases":
          "있어요": "be, exist, polite form"
