id: "ko-en-hangul-vowels"
kind: "layer"
core: "ko-hangul-vowels"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hangul vowels"
license: "CC-BY-SA-4.0"
description: "The ten basic vowels, each written as a syllable on a silent ㅇ (ieung), which holds the place where a consonant would go. Each vowel letter is a dot, a short line or a long line, and a second dot or line makes its 'y' sound: ㅏ (a) and ㅑ (ya), ㅓ (eo) and ㅕ (yeo), ㅗ (o) and ㅛ (yo), ㅜ (u) and ㅠ (yu). Not yet checked by a Korean speaker: please report any mistake."
tags: ["unreviewed"]
"cards":
  "ko-0120":
    "native": "a, as in 'father'"
    "notes":
      "n1": "아 (a) is the vowel ㅏ (a), a short line with one dot on its right, written after a silent ㅇ (ieung). The ㅇ (ieung) has no sound at the start of a syllable."
      "look-ya": "아 (a) and 야 (ya) differ by one dot: ㅏ (a) has one dot on its right, and ㅑ (ya) has two. The second dot adds the 'y' before the vowel."
  "ko-0121":
    "native": "ya, as in 'yard'"
    "notes":
      "n1": "야 (ya) is the vowel ㅑ (ya), the same line as ㅏ (a) with two dots on its right. The 'y' is said before the 'a'."
      "look-a": "야 (ya) and 아 (a) differ by one dot: ㅑ (ya) has two dots on its right, and ㅏ (a) has one. Say the 'y' to hear the difference."
  "ko-0122":
    "native": "eo, like the 'u' of 'fun'"
    "notes":
      "n1": "어 (eo) is the vowel ㅓ (eo), a short line with one dot on its left, written after a silent ㅇ (ieung). It is an open vowel said with the mouth relaxed, as the 'u' of 'fun'."
      "look-yeo": "어 (eo) and 여 (yeo) differ by one dot: ㅓ (eo) has one dot on its left, and ㅕ (yeo) has two. The second dot adds the 'y' before the vowel."
  "ko-0123":
    "native": "yeo, with a 'y' before eo"
    "notes":
      "n1": "여 (yeo) is the vowel ㅕ (yeo), the same line as ㅓ (eo) with two dots on its left. Say the 'y' before the 'eo'."
      "look-eo": "여 (yeo) and 어 (eo) differ by one dot: ㅕ (yeo) has two dots on its left, and ㅓ (eo) has one. Say the 'y' to hear the difference."
  "ko-0124":
    "native": "o, like the 'o' of 'go' without the 'w'"
    "notes":
      "n1": "오 (o) is the vowel ㅗ (o), a long line with one dot above it, written after a silent ㅇ (ieung). Keep the lips rounded and tight, with no 'w' after it."
      "look-yo": "오 (o) and 요 (yo) differ by one dot: ㅗ (o) has one dot above its line, and ㅛ (yo) has two. The second dot adds the 'y' before the vowel."
  "ko-0125":
    "native": "yo, with a 'y' before o"
    "notes":
      "n1": "요 (yo) is the vowel ㅛ (yo), the same line as ㅗ (o) with two dots above it. It is also the ending that makes a word polite, as in 좋아요 (joayo), good."
      "look-o": "요 (yo) and 오 (o) differ by one dot: ㅛ (yo) has two dots above its line, and ㅗ (o) has one. Say the 'y' to hear the difference."
  "ko-0126":
    "native": "u, like the 'oo' of 'food' but short"
    "notes":
      "n1": "우 (u) is the vowel ㅜ (u), a long line with one dot below it, written after a silent ㅇ (ieung). Round the lips, and keep the sound short and tight."
      "look-yu": "우 (u) and 유 (yu) differ by one dot: ㅜ (u) has one dot below its line, and ㅠ (yu) has two. The second dot adds the 'y' before the vowel."
  "ko-0127":
    "native": "yu, like the 'you' of 'you'"
    "notes":
      "n1": "유 (yu) is the vowel ㅠ (yu), the same line as ㅜ (u) with two dots below it. Say the 'y' before the 'u'."
      "look-u": "유 (yu) and 우 (u) differ by one dot: ㅠ (yu) has two dots below its line, and ㅜ (u) has one. Say the 'y' to hear the difference."
  "ko-0128":
    "native": "eu, the 'oo' of 'book' with the lips spread"
    "notes":
      "n1": "으 (eu) is the vowel ㅡ (eu), a short horizontal line, written after a silent ㅇ (ieung). Say it with the lips spread, not rounded, as in 'book' said with a smile. It has no dot. It is in 그 (geu), that, which is taught in the first words."
  "ko-0129":
    "native": "i, like the 'ee' of 'see'"
    "notes":
      "n1": "이 (i) is the vowel ㅣ (i), a long vertical line with no dot, written after a silent ㅇ (ieung). Keep the sound high and short, as in 'see' said short."
      "same-this": "이 (i) is also the word 'this', as in 이거 (igeo), this one. The spelling and the sound are the same as the vowel, and the word is taught in its own card."
