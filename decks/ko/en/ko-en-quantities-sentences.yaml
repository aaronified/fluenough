schema: 1
id: "ko-en-quantities-sentences"
kind: "layer"
core: "ko-quantities-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How much and how many in sentences"
license: "CC-BY-SA-4.0"
description: "Sentences built from this unit with confusables from the unit. Not yet checked by a Korean speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
cards:
  "ko-4240":
    "native": "There is a lot of water."
    "bases":
      "많아요": "to be many, to be much (polite)"
    "confusables":
      "w1":
        "why": "적다 (jeokda) means few or little, the opposite."
      "w2":
        "why": "충분하다 (chungbunhada) means enough, not a lot."
  "ko-4241":
    "native": "Half a coffee, please."
    "bases":
      "반": "half"
      "주세요": "to give, please (polite request)"
    "confusables":
      "w1":
        "why": "절반 (jeolban) also means half."
      "w2":
        "why": "약간 (yakgan) means a little, not half."
  "ko-4242":
    "native": "How much is everything?"
    "bases":
      "전부": "everything"
    "confusables":
      "w1":
        "why": "모두 (modu) means all, as an adverb."
      "w2":
        "why": "전체 (jeonche) means the whole of one thing."
  "ko-4243":
    "native": "All the students are here."
    "bases":
      "모든": "all, every"
      "있어요": "to be here, to have (polite)"
    "confusables":
      "w1":
        "why": "여러 (yeoreo) means several, not all."
      "w2":
        "why": "대부분 (daebubun) means most."
  "ko-4244":
    "native": "There are many students."
    "bases":
      "있어요": "to be here, to have (polite)"
    "confusables":
      "w1":
        "why": "한두 (handu) means one or two."
      "w2":
        "why": "많다 (manta) describes a large amount of a thing, and is not used for a group of people."
  "ko-4245":
    "native": "I drink a little at a time."
    "bases":
      "조금씩": "bit by bit"
      "마셔요": "to drink (polite)"
    "confusables":
      "w1":
        "why": "약간 (yakgan) means a little, a single amount."
      "w2":
        "why": "가득 (gadeuk) means full."
  "ko-4246":
    "native": "How much is the rest?"
    "bases":
      "나머지는": "the rest, with the topic particle 는 (neun)"
    "confusables":
      "w1":
        "why": "전체 (jeonche) means the whole."
      "w2":
        "why": "일부 (ilbu) means part of a whole."
