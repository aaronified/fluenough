cards:
  "ko-4360":
    "native": "It is inside the room."
    "bases":
      "안에": "inside, with the place particle 에 (e)"
      "있어요": "to be here, to have (polite)"
    "confusables":
      "w1":
        "why": "가운데 (gaunde) is the middle, not inside."
      "w2":
        "why": "밖 (bak) is outside, the opposite."
  "ko-4361":
    "native": "Is it next to this?"
    "bases":
      "이거": "this one"
      "옆에": "next to, with the place particle 에 (e)"
      "있어요": "to be here, to have (polite)"
    "confusables":
      "w1":
        "why": "뒤 (dwi) is behind, not next to."
      "w2":
        "why": "아래 (arae) is below."
  "ko-4362":
    "native": "It is near the school."
    "bases":
      "학교": "school"
      "근처에": "nearby area, with the place particle 에 (e)"
      "있어요": "to be here, to have (polite)"
    "confusables":
      "w1":
        "why": "부근 (bugeun) also means the vicinity."
      "w2":
        "why": "맞은편 (majeunpyeon) means the opposite side."
  "ko-4363":
    "native": "Is it on the left?"
    "bases":
      "왼쪽에": "left side, with the place particle 에 (e)"
      "있어요": "to be here, to have (polite)"
    "confusables":
      "w1":
        "why": "오른쪽 (oreunjjok) is the right side."
      "w2":
        "why": "여기 (yeogi) is here."
  "ko-4364":
    "native": "Is it there?"
    "bases":
      "거기": "there"
      "있어요": "to be here, to have (polite)"
    "confusables":
      "w1":
        "why": "여기 (yeogi) is here, the opposite."
      "w2":
        "why": "안 (an) is inside."
  "ko-4365":
    "native": "Is the teacher in the room?"
    "bases":
      "있어요": "to be here, to have (polite)"
    "confusables":
      "w1":
        "why": "가운데 (gaunde) is the middle of one thing."
      "w2":
        "why": "옆 (yeop) is beside."
