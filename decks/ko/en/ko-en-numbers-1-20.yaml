      "n1": "공 (gong) is the digit zero, as in phone numbers: 010 is read 공일공 (gongilgong). 공 (gong) is also the word for \"ball\", a different word."
  "ko-1499":
    "native": "native numbers one to ten"
    "explanation": "The native Korean numbers one to ten: 하나 (hana), 둘 (dul), 셋 (set), 넷 (net), 다섯 (daseot), 여섯 (yeoseot), 일곱 (ilgop), 여덟 (yeodeol), 아홉 (ahop) and 열 (yeol). They count things and people, and before a counter 하나 (hana), 둘 (dul), 셋 (set) and 넷 (net) take the shorter forms 한 (han), 두 (du), 세 (se) and 네 (ne)."
