native: { code: "en", iso639_3: "eng", name: "English" }
name: "Numbers one to twenty"
license: "CC-BY-SA-4.0"
description: "Native Korean numbers one to twenty, the Sino-Korean numbers from one to twenty and the two zeros. The Sino-Korean and zero words have no examples yet. Not yet checked by a Korean speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "ko-1460":
    "native": "one (said on its own, without a counter)"
    "notes":
      "n1": "Before a counter 하나 (hana) becomes 한 (han)."
      "n2": "Native numbers count things and people, give ages and tell the hours. Sino-Korean numbers give minutes, dates, money and phone numbers."
    "examples":
      "커피 하나 주세요.":
        "native": "One coffee, please."
        "bases":
          "하나": "one"
          "주세요": "to give; please give"
      "물 하나 주세요.":
        "native": "One water, please."
        "bases":
          "하나": "one"
          "주세요": "to give; please give"
  "ko-1461":
    "native": "two"
    "notes":
      "n1": "Before a counter 둘 (dul) becomes 두 (du)."
    "examples":
      "학생이 둘이에요.":
        "native": "There are two students."
        "bases":
          "둘이에요": "two, with the copula 이에요 (ieyo)"
      "남자가 둘이에요.":
        "native": "There are two men."
        "bases":
          "둘이에요": "two, with the copula 이에요 (ieyo)"
