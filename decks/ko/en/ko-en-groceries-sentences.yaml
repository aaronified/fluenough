cards:
  "ko-4600":
    native: "Is the fruit cheap?"
    confusables:
      "w1":
        why: "채소 (chaeso) is vegetables, not fruit."
      "w2":
        why: "딸기 (ttalgi) is one kind of fruit."
  "ko-4601":
    native: "I drink milk."
    confusables:
      "w1":
        why: "쌀 (ssal) is uncooked rice, not a drink."
      "w2":
        why: "계란 (gyeran) is an egg, not a drink."
  "ko-4602":
    native: "I buy bread."
    confusables:
      "w1":
        why: "라면 (ramyeon) is instant noodles, not bread."
      "w2":
        why: "두부 (dubu) is tofu."
  "ko-4603":
    native: "Are there eggs?"
    confusables:
      "w1":
        why: "계란 (gyeran) is also an egg, the Sino-Korean word."
      "w2":
        why: "고기 (gogi) is meat."
  "ko-4604":
    native: "The meat is expensive."
    confusables:
      "w1":
        why: "생선 (saengseon) is fish as food."
      "w2":
        why: "닭고기 (dakgogi) is chicken meat."
  "ko-4605":
    native: "Is there soy sauce?"
    confusables:
      "w1":
        why: "식초 (sikcho) is vinegar."
      "w2":
        why: "참기름 (chamgireum) is sesame oil."
  "ko-4606":
    native: "Please give me onions."
    confusables:
      "w1":
        why: "마늘 (maneul) is garlic."
      "w2":
        why: "감자 (gamja) is potato."
  "ko-4607":
    native: "The watermelon is good."
    confusables:
      "w1":
        why: "포도 (podo) is grape."
      "w2":
        why: "딸기 (ttalgi) is strawberry."
  "ko-4608":
    native: "There is a lot of rice."
    confusables:
      "w1":
        why: "설탕 (seoltang) is sugar."
      "w2":
        why: "소금 (sogeum) is salt."
