name: "Nasalisation: k, t and p before n and m"
description: "Eight words where a final ㄱ (g), ㄷ (d) or ㅂ (b) is said as a nasal because a nasal consonant follows, written the way they sound. Sources: the en.wikipedia.org page 'Korean phonology' (obstruents become nasal stops before nasals: 한국말 (hangungmal) is said 한궁말 (hangungmal)), the en.wiktionary.org entries 한국말 (hangungmal), 학년 (hangnyeon), 작년 (jangnyeon), 십만 (simman) and 감사합니다 (gamsahamnida) ('Phonetic hangul'), and the conjugation tables of 먹다 (meokda), 읽다 (ikda) and 있다 (itda). Not yet checked by a Korean speaker: please report any mistake."
