name: "The polite present: -아요 (-ayo) and -어요 (-eoyo)"
description: "Fifteen everyday verbs in the polite present, the style used with strangers and in shops, and the same verb after 저는 (jeoneun). Sources: the en.wikipedia.org pages 'Korean verbs', 'Korean grammar' and 'Korean honorifics' and the en.wiktionary.org conjugation table of each verb, from which every form is copied. The formal -ㅂ니다 (-mnida) and the casual endings are later units. Not yet checked by a Korean speaker: please report any mistake."
