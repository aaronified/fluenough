id: "ko-en-adverbs-sentences"
kind: "layer"
core: "ko-adverbs-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Adverbs in sentences"
license: "CC-BY-SA-4.0"
description: "Sentences built from this unit with confusables from the unit. Not yet checked by a Korean speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
cards:
  "ko-4200":
    "native": "It is very good."
    "bases":
      "매우": "very"
      "좋아요": "to be good (polite)"
    "confusables":
      "w1":
        "why": "아주 (aju) also means very, so both fit."
      "w2":
        "why": "정말 (jeongmal) means really, which changes the sense."
  "ko-4201":
    "native": "I always go."
    "bases":
      "항상": "always"
      "가요": "to go (polite)"
    "confusables":
      "w1":
        "why": "자주 (jaju) means often, not always."
      "w2":
        "why": "가끔 (gakkeum) means sometimes, not always."
  "ko-4202":
    "native": "I never go."
    "bases":
      "절대": "never"
      "안": "not (before a verb)"
      "가요": "to go (polite)"
    "confusables":
      "w1":
        "why": "전혀 (jeonhyeo) means not at all, about a thing rather than a habit."
      "w2":
        "why": "아직 (ajik) means still or yet."
  "ko-4203":
    "native": "Please say it again."
    "bases":
      "다시": "again"
      "말해": "to say"
      "주세요": "to give, please (polite request)"
    "confusables":
      "w1":
        "why": "또 (tto) means again or also, not after a stop."
      "w2":
        "why": "더 (deo) means more."
  "ko-4204":
    "native": "Go quickly."
    "bases":
      "빨리": "quickly"
      "가요": "to go (polite)"
    "confusables":
      "w1":
        "why": "천천히 (cheoncheonhi) means slowly, the opposite."
      "w2":
        "why": "곧 (got) means soon."
  "ko-4205":
    "native": "I sleep sometimes."
    "bases":
      "가끔": "sometimes"
      "자요": "to sleep (polite)"
    "confusables":
      "w1":
        "why": "자주 (jaju) means often."
      "w2":
        "why": "때때로 (ttaettaero) means sometimes, the same sense."
  "ko-4206":
    "native": "Let's eat together."
    "bases":
      "같이": "together"
      "먹어요": "to eat (polite)"
    "confusables":
      "w1":
        "why": "함께 (hamkke) means together, with no 'with' sense."
      "w2":
        "why": "그냥 (geunyang) means simply, not together."
