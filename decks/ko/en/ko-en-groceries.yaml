cards:
  "ko-2500":
    native: "vegetable"
    notes:
      "n1": "채소 (chaeso) is the general word for vegetables; 과일 (gwail) is fruit."
    examples:
      "채소가 싸요.":
        native: "The vegetables are cheap."
        bases:
          "채소가": "vegetable, with the subject particle 가 (ga)"
      "채소가 많아요.":
        native: "There are many vegetables."
        bases:
          "채소가": "vegetable, with the subject particle 가 (ga)"
          "많아요": "to be many, polite"
