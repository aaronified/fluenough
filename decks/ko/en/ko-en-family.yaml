schema: 1
id: "ko-en-family"
kind: "layer"
core: "ko-family"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Family"
license: "CC-BY-SA-4.0"
description: "Thirty-four words for the family: parents, children, grandparents, aunts, uncles, siblings and in-laws, with notes on which word a speaker uses for an older sibling. Not yet checked by a Korean speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "ko-1380":
    "native": "family; household"
    "examples":
      "저는 가족이 좋아요.":
        "native": "I like my family."
        "bases":
          "가족이": "family, with the subject particle 이 (i)"
      "가족이 몇이에요?":
        "native": "How many people are in your family?"
        "bases":
          "가족이": "family, with the subject particle 이 (i)"
  "ko-1381":
    "native": "father"
    "notes":
      "n1": "아버지 (abeoji) is \"father\". People use it for their own father, and 어머니 (eomeoni) for their own mother."
    "examples":
      "아버지는 선생님이에요.":
        "native": "My father is a teacher."
        "bases":
          "아버지는": "father, with the topic particle 는 (neun)"
      "아버지 이름은 뭐예요?":
        "native": "What is your father's name?"
        "bases":
          "아버지": "father"
  "ko-1382":
    "native": "mother"
    "examples":
      "어머니는 의사예요.":
        "native": "My mother is a doctor."
        "bases":
          "어머니는": "mother, with the topic particle 는 (neun)"
      "어머니가 괜찮아요?":
        "native": "Is your mother all right?"
        "bases":
          "어머니가": "mother, with the subject particle 가 (ga)"
  "ko-1383":
    "native": "dad, papa"
    "notes":
      "n1": "아빠 (appa) is the everyday word for dad. In more formal talk speakers say 아버지 (abeoji)."
    "examples":
      "아빠는 회사원이에요.":
        "native": "Dad is an office worker."
        "bases":
          "아빠는": "dad, with the topic particle 는 (neun)"
      "아빠, 안녕하세요.":
        "native": "Hello, Dad."
  "ko-1384":
    "native": "mum, mummy"
    "notes":
      "n1": "엄마 (eomma) is the everyday word for mum. In more formal talk speakers say 어머니 (eomeoni)."
    "examples":
      "엄마는 선생님이에요.":
        "native": "Mum is a teacher."
        "bases":
          "엄마는": "mum, with the topic particle 는 (neun)"
      "엄마, 감사해요.":
        "native": "Thank you, Mum."
  "ko-1385":
    "native": "parents"
    "examples":
      "저는 부모가 있어요.":
        "native": "I have parents."
        "bases":
          "부모가": "parents, with the subject particle 가 (ga)"
          "있어요": "to have; to be (in a place)"
      "부모가 괜찮아요?":
        "native": "Are your parents all right?"
        "bases":
          "부모가": "parents, with the subject particle 가 (ga)"
  "ko-1386":
    "native": "son"
    "examples":
      "아들은 학생이에요.":
        "native": "My son is a student."
        "bases":
          "아들은": "son, with the topic particle 은 (eun)"
      "아들이 있어요?":
        "native": "Do you have a son?"
        "bases":
          "아들이": "son, with the subject particle 이 (i)"
          "있어요": "to have; to be (in a place)"
  "ko-1387":
    "native": "children; sons and daughters"
    "examples":
      "자녀가 있어요?":
        "native": "Do you have children?"
        "bases":
          "자녀가": "children, with the subject particle 가 (ga)"
          "있어요": "to have; to be (in a place)"
      "자녀는 학생이에요.":
        "native": "The children are students."
        "bases":
          "자녀는": "children, with the topic particle 는 (neun)"
  "ko-1388":
    "native": "grandfather; an elderly man"
    "notes":
      "n1": "할아버지 (harabeoji) also means an elderly man, as 할머니 (halmeoni) means an elderly woman."
    "examples":
      "할아버지는 의사예요.":
        "native": "Grandfather is a doctor."
        "bases":
          "할아버지는": "grandfather, with the topic particle 는 (neun)"
      "할아버지, 안녕하세요.":
        "native": "Hello, grandfather."
  "ko-1389":
    "native": "grandmother; an elderly woman"
    "notes":
      "n1": "할머니 (halmeoni) also means an elderly woman, as 할아버지 (harabeoji) means an elderly man."
    "examples":
      "할머니는 선생님이에요.":
        "native": "Grandmother is a teacher."
        "bases":
          "할머니는": "grandmother, with the topic particle 는 (neun)"
      "할머니, 감사해요.":
        "native": "Thank you, grandmother."
  "ko-1390":
    "native": "maternal grandfather"
    "notes":
      "n1": "외 (oe) marks the mother's side of the family, as in 외할머니 (oehalmeoni), the maternal grandmother."
    "examples":
      "외할아버지는 의사예요.":
        "native": "My maternal grandfather is a doctor."
        "bases":
          "외할아버지는": "maternal grandfather, with the topic particle 는 (neun)"
      "외할아버지, 안녕하세요.":
        "native": "Hello, grandfather on your mother's side."
  "ko-1391":
    "native": "maternal grandmother"
    "examples":
      "외할머니는 선생님이에요.":
        "native": "My maternal grandmother is a teacher."
        "bases":
          "외할머니는": "maternal grandmother, with the topic particle 는 (neun)"
      "외할머니, 감사해요.":
        "native": "Thank you, grandmother."
  "ko-1392":
    "native": "uncle (a male sibling of a parent)"
    "notes":
      "n1": "삼촌 (samchon) is a father's or a mother's brother. For a father's sister say 고모 (gomo); for a mother's sister say 이모 (imo)."
    "examples":
      "삼촌은 회사원이에요.":
        "native": "My uncle is an office worker."
        "bases":
          "삼촌은": "uncle, with the topic particle 은 (eun)"
      "삼촌, 안녕하세요.":
        "native": "Hello, uncle."
  "ko-1393":
    "native": "maternal aunt (one's mother's sister)"
    "notes":
      "n1": "이모 (imo) is one's mother's sister, and a familiar word for her. 고모 (gomo) is one's father's sister."
    "examples":
      "이모는 의사예요.":
        "native": "My maternal aunt is a doctor."
        "bases":
          "이모는": "maternal aunt, with the topic particle 는 (neun)"
      "이모, 감사해요.":
        "native": "Thank you, aunt."
  "ko-1394":
    "native": "paternal aunt (one's father's sister)"
    "examples":
      "고모는 선생님이에요.":
        "native": "My paternal aunt is a teacher."
        "bases":
          "고모는": "paternal aunt, with the topic particle 는 (neun)"
      "고모, 안녕하세요.":
        "native": "Hello, aunt."
  "ko-1395":
    "native": "nephew or niece (a sibling's child)"
    "examples":
      "조카는 학생이에요.":
        "native": "My nephew or niece is a student."
        "bases":
          "조카는": "nephew or niece, with the topic particle 는 (neun)"
      "조카 이름은 뭐예요?":
        "native": "What is your nephew's name?"
        "bases":
          "조카": "nephew or niece"
  "ko-1396":
    "native": "grandson; grandchild"
    "examples":
      "손자는 학생이에요.":
        "native": "My grandson is a student."
        "bases":
          "손자는": "grandson, with the topic particle 는 (neun)"
      "손자 이름은 뭐예요?":
        "native": "What is your grandson's name?"
        "bases":
          "손자": "grandson"
  "ko-1397":
    "native": "granddaughter"
    "examples":
      "손녀는 학생이에요.":
        "native": "My granddaughter is a student."
        "bases":
          "손녀는": "granddaughter, with the topic particle 는 (neun)"
      "손녀 이름은 뭐예요?":
        "native": "What is your granddaughter's name?"
        "bases":
          "손녀": "granddaughter"
  "ko-1398":
    "native": "husband"
    "examples":
      "남편은 회사원이에요.":
        "native": "My husband is an office worker."
        "bases":
          "남편은": "husband, with the topic particle 은 (eun)"
      "남편 이름은 뭐예요?":
        "native": "What is your husband's name?"
        "bases":
          "남편": "husband"
  "ko-1399":
    "native": "wife (one's own)"
    "notes":
      "n1": "아내 (anae) is the word for one's own wife. It is humble, so it is used in speech about one's own wife."
    "examples":
      "아내는 의사예요.":
        "native": "My wife is a doctor."
        "bases":
          "아내는": "wife, with the topic particle 는 (neun)"
      "아내 이름은 뭐예요?":
        "native": "What is my wife's name?"
        "bases":
          "아내": "wife"
  "ko-1400":
    "native": "older brother (said by a male)"
    "notes":
      "n1": "A male says 형 (hyeong) for an older brother and 누나 (nuna) for an older sister. A female says 오빠 (oppa) for an older brother and 언니 (eonni) for an older sister."
    "examples":
      "형은 회사원이에요.":
        "native": "My older brother is an office worker."
        "bases":
          "형은": "older brother, with the topic particle 은 (eun)"
      "형 이름은 뭐예요?":
        "native": "What is your older brother's name?"
        "bases":
          "형": "older brother"
  "ko-1401":
    "native": "older sister (said by a male)"
    "notes":
      "n1": "A male says 누나 (nuna) for an older sister and 형 (hyeong) for an older brother."
    "examples":
      "누나는 의사예요.":
        "native": "My older sister is a doctor."
        "bases":
          "누나는": "older sister, with the topic particle 는 (neun)"
      "누나, 감사해요.":
        "native": "Thank you, sister."
  "ko-1402":
    "native": "older brother (said by a female)"
    "notes":
      "n1": "A female says 오빠 (oppa) for an older brother and 언니 (eonni) for an older sister."
    "examples":
      "오빠는 학생이에요.":
        "native": "My older brother is a student."
        "bases":
          "오빠는": "older brother, with the topic particle 는 (neun)"
      "오빠, 감사해요.":
        "native": "Thank you, brother."
  "ko-1403":
    "native": "older sister (said by a female)"
    "notes":
      "n1": "A female says 언니 (eonni) for an older sister and 오빠 (oppa) for an older brother."
    "examples":
      "언니는 선생님이에요.":
        "native": "My older sister is a teacher."
        "bases":
          "언니는": "older sister, with the topic particle 는 (neun)"
      "언니, 안녕하세요.":
        "native": "Hello, sister."
  "ko-1404":
    "native": "younger sibling"
    "notes":
      "n1": "동생 (dongsaeng) is a younger sibling of either gender. 남동생 (namdongsaeng) is a younger brother and 여동생 (yeodongsaeng) a younger sister."
    "examples":
      "동생은 학생이에요.":
        "native": "My younger sibling is a student."
        "bases":
          "동생은": "younger sibling, with the topic particle 은 (eun)"
      "동생이 있어요?":
        "native": "Do you have a younger sibling?"
        "bases":
          "동생이": "younger sibling, with the subject particle 이 (i)"
          "있어요": "to have; to be (in a place)"
  "ko-1405":
    "native": "little brother; younger brother"
    "examples":
      "남동생은 학생이에요.":
        "native": "My younger brother is a student."
        "bases":
          "남동생은": "younger brother, with the topic particle 은 (eun)"
      "남동생이 있어요?":
        "native": "Do you have a younger brother?"
        "bases":
          "남동생이": "younger brother, with the subject particle 이 (i)"
          "있어요": "to have; to be (in a place)"
  "ko-1406":
    "native": "little sister; younger sister"
    "examples":
      "여동생은 학생이에요.":
        "native": "My younger sister is a student."
        "bases":
          "여동생은": "younger sister, with the topic particle 은 (eun)"
      "여동생이 있어요?":
        "native": "Do you have a younger sister?"
        "bases":
          "여동생이": "younger sister, with the subject particle 이 (i)"
          "있어요": "to have; to be (in a place)"
  "ko-1407":
    "native": "brothers"
    "examples":
      "형제가 있어요?":
        "native": "Do you have brothers?"
        "bases":
          "형제가": "brothers, with the subject particle 가 (ga)"
          "있어요": "to have; to be (in a place)"
      "형제는 학생이에요.":
        "native": "The brothers are students."
        "bases":
          "형제는": "brothers, with the topic particle 는 (neun)"
  "ko-1408":
    "native": "sisters"
    "examples":
      "자매가 있어요?":
        "native": "Do you have sisters?"
        "bases":
          "자매가": "sisters, with the subject particle 가 (ga)"
          "있어요": "to have; to be (in a place)"
      "자매는 선생님이에요.":
        "native": "The sisters are teachers."
        "bases":
          "자매는": "sisters, with the topic particle 는 (neun)"
  "ko-1409":
    "native": "child; kid"
    "notes":
      "n1": "아이 (ai) is \"child\" or \"kid\", said warmly."
    "examples":
      "아이는 학생이에요.":
        "native": "The child is a student."
        "bases":
          "아이는": "child, with the topic particle 는 (neun)"
      "아이 이름은 뭐예요?":
        "native": "What is the child's name?"
        "bases":
          "아이": "child"
  "ko-1410":
    "native": "son-in-law"
    "notes":
      "n1": "사위 (sawi) is a daughter's husband. 며느리 (myeoneuri) is a son's wife."
    "examples":
      "사위는 회사원이에요.":
        "native": "My son-in-law is an office worker."
        "bases":
          "사위는": "son-in-law, with the topic particle 는 (neun)"
      "사위 이름은 뭐예요?":
        "native": "What is your son-in-law's name?"
        "bases":
          "사위": "son-in-law"
  "ko-1411":
    "native": "daughter-in-law"
    "notes":
      "n1": "며느리 (myeoneuri) is a son's wife. 사위 (sawi) is a daughter's husband."
    "examples":
      "며느리는 의사예요.":
        "native": "My daughter-in-law is a doctor."
        "bases":
          "며느리는": "daughter-in-law, with the topic particle 는 (neun)"
      "며느리 이름은 뭐예요?":
        "native": "What is your daughter-in-law's name?"
        "bases":
          "며느리": "daughter-in-law"
  "ko-1412":
    "native": "father-in-law (husband's father)"
    "notes":
      "n1": "시 (si) marks the husband's side, so 시아버지 (siabeoji) is the husband's father."
    "examples":
      "시아버지는 선생님이에요.":
        "native": "My father-in-law is a teacher."
        "bases":
          "시아버지는": "father-in-law, with the topic particle 는 (neun)"
      "시아버지, 안녕하세요.":
        "native": "Hello, father-in-law."
  "ko-1413":
    "native": "mother-in-law (wife's mother)"
    "notes":
      "n1": "장모 (jangmo) is the wife's mother. The 장 (jang) part marks the wife's side."
    "examples":
      "장모는 의사예요.":
        "native": "My mother-in-law is a doctor."
        "bases":
          "장모는": "mother-in-law, with the topic particle 는 (neun)"
      "장모, 안녕하세요.":
        "native": "Hello, mother-in-law."
