schema: 1
id: "ko-en-loanwords"
kind: "layer"
core: "ko-loanwords"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Loanwords"
license: "CC-BY-SA-4.0"
description: "Words borrowed from English and other languages, as Korean says them: computers, food, shops and things you buy. Each card says where its word comes from, as Wiktionary gives it. Not yet checked by a Korean speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "ko-2340":
    "native": "computer"
    "notes":
      "n1": "Borrowed from English 'computer' (Wiktionary)."
    "examples":
      "컴퓨터가 괜찮아요?":
        "native": "Is the computer OK?"
        "bases":
          "컴퓨터가": "computer, with the subject particle 가 (ga)"
          "괜찮아요": "OK, with the polite ending 아요 (ayo)"
