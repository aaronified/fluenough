schema: 1
id: "ko-en-time-sentences"
kind: "layer"
core: "ko-time-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Time in sentences"
license: "CC-BY-SA-4.0"
description: "Nine sentences about time to put in order, each in the polite -요 (-yo) style. Not yet checked by a Korean speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "ko-4320":
    "native": "I drink coffee in the morning."
    "confusables":
      "w1":
        "why": "저녁 (jeonyeok) is evening, not morning."
      "w2":
        "why": "낮 (nat) is daytime."
  "ko-4321":
    "native": "What time is it now?"
    "confusables":
      "w1":
        "why": "시간 (sigan) is time, not the hour."
      "w2":
        "why": "초 (cho) is a second."
  "ko-4322":
    "native": "What are you doing tomorrow?"
    "confusables":
      "w1":
        "why": "오늘 (oneul) is today."
      "w2":
        "why": "모레 (more) is the day after tomorrow."
  "ko-4323":
    "native": "Where are you going now?"
    "confusables":
      "w1":
        "why": "오늘 (oneul) is today."
      "w2":
        "why": "내일 (naeil) is tomorrow."
  "ko-4324":
    "native": "Do you go to school in the afternoon?"
    "confusables":
      "w1":
        "why": "오전 (ojeon) is morning, a.m."
      "w2":
        "why": "밤 (bam) is night."
  "ko-4325":
    "native": "What do you do each day?"
    "confusables":
      "w1":
        "why": "매일 (maeil) is every day."
      "w2":
        "why": "일주일 (iljuil) is a week."
  "ko-4326":
    "native": "Are you a student this year?"
    "confusables":
      "w1":
        "why": "작년 (jangnyeon) is last year."
      "w2":
        "why": "내년 (naenyeon) is next year."
  "ko-4327":
    "native": "Do you have time?"
    "confusables":
      "w1":
        "why": "일주일 (iljuil) is a week."
      "w2":
        "why": "초 (cho) is a second."
  "ko-4328":
    "native": "What do you do before that?"
    "confusables":
      "w1":
        "why": "후 (hu) is after."
      "w2":
        "why": "하루 (haru) is a day."
