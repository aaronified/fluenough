name: "The polite past: -았어요 (-asseoyo) and -었어요 (-eosseoyo)"
description: "Sixteen verbs in the polite past, alone and after 어제 (eoje), yesterday. Sources: the en.wikipedia.org page 'Korean verbs' and the en.wiktionary.org conjugation table of each verb, from which every form is copied. Not yet checked by a Korean speaker: please report any mistake."
