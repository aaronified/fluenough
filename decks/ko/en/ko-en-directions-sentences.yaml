"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Directions and signs in sentences"
"license": "CC-BY-SA-4.0"
"description": "Ten sentences about where things are and which way to go, with the words of this unit, in the polite -요 (-yo) style. Not yet checked by a Korean speaker: please report any mistake."
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ko-4720":
    "native": "Where is the traffic light?"
    "confusables":
      "w1":
        "why": "횡단보도 (hoengdanbodo) is a crosswalk, not a traffic light."
      "w2":
        "why": "교차로 (gyocharo) is a crossroads, where lights may be."
  "ko-4721":
    "native": "Is there a student in front?"
    "confusables":
      "w1":
        "why": "뒤쪽 (dwijjok) means the back, the opposite."
      "w2":
        "why": "안쪽 (anjjok) means the inside, not the front."
  "ko-4722":
    "native": "Is the teacher at the back?"
    "confusables":
      "w1":
        "why": "앞쪽 (apjjok) means the front, the opposite."
      "w2":
        "why": "중간 (junggan) means the middle."
  "ko-4723":
    "native": "Does the teacher go straight on?"
    "confusables":
      "w1":
        "why": "직진 (jikjin) is the noun for going straight; the adverb is the one in the sentence."
      "w2":
        "why": "멀리 (meolli) means far away, not straight on."
  "ko-4724":
    "native": "Is the coffee far away?"
    "confusables":
      "w1":
        "why": "가까이 (gakkai) means near, the opposite."
      "w2":
        "why": "안쪽 (anjjok) means the inside."
  "ko-4725":
    "native": "Is the coffee near?"
    "confusables":
      "w1":
        "why": "멀리 (meolli) means far away, the opposite."
      "w2":
        "why": "끝 (kkeut) means the end, not near."
  "ko-4726":
    "native": "Is there a student in the east?"
    "confusables":
      "w1":
        "why": "서쪽 (seojjok) means west, the opposite."
      "w2":
        "why": "남쪽 (namjjok) means south."
  "ko-4727":
    "native": "There is bread in the west."
    "confusables":
      "w1":
        "why": "동쪽 (dongjjok) means east, the opposite."
      "w2":
        "why": "북쪽 (bukjjok) means north."
  "ko-4728":
    "native": "Where is the map?"
    "confusables":
      "w1":
        "why": "표지판 (pyojipan) is a sign, not a map."
      "w2":
        "why": "방향 (banghyang) means direction, not a map."
  "ko-4729":
    "native": "Does the car turn?"
    "confusables":
      "w1":
        "why": "건너다 (geonneoda) means cross, not turn."
      "w2":
        "why": "지나다 (jinada) means pass by."
