name: "Native numbers before a counter: 한 (han), 두 (du), 세 (se), 네 (ne), 스무 (seumu)"
description: "Seven native numbers as they are said alone and in front of a counter. Sources: the en.wikipedia.org page 'Korean numerals' (the attributive forms of native Korean cardinals, with the table of 1, 2, 3, 4 and 20 and the examples 한 번 (han beon), 두 개 (du gae), 세 시 (se si), 네 명 (ne myeong), 스무 마리 (seumu mari)). Not yet checked by a Korean speaker: please report any mistake."
