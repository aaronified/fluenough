schema: 1
id: "ko-en-market"
kind: "layer"
core: "ko-market"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Market"
license: "CC-BY-SA-4.0"
description: "Thirty-nine words for a market: the stalls, the shop, prices, paying, and buying and selling. Not yet checked by a Korean speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
cards:
  "ko-2420":
    native: "market"
    notes:
      "n1": "시장 (sijang) is a market, a place with many stalls. 시장에 (sijange) means at the market."
    examples:
      "시장에 가요.":
        native: "I go to the market."
        bases:
          "시장에": "market, with the place particle 에 (e)"
          "가요": "to go, polite"
      "시장이 좋아요.":
        native: "The market is good."
        bases:
          "시장이": "market, with the subject particle 이 (i)"
          "좋아요": "to be good, polite"
  "ko-2421":
    native: "shop"
    notes:
      "n1": "가게 (gage) is the everyday word for a small shop; 상점 (sangjeom) is a more formal word for one."
    examples:
      "가게가 많아요.":
        native: "There are many shops."
        bases:
          "가게가": "shop, with the subject particle 가 (ga)"
          "많아요": "to be many, polite"
      "가게에 가요.":
        native: "I go to the shop."
        bases:
          "가게에": "shop, with the place particle 에 (e)"
          "가요": "to go, polite"
  "ko-2422":
    native: "store"
    notes:
      "n1": "상점 (sangjeom) is a store, a more formal word than 가게 (gage)."
    examples:
      "상점에 가요.":
        native: "I go to the store."
        bases:
          "상점에": "store, with the place particle 에 (e)"
          "가요": "to go, polite"
      "상점이 있어요.":
        native: "There is a store."
        bases:
          "상점이": "store, with the subject particle 이 (i)"
          "있어요": "to be there, polite"
  "ko-2423":
    native: "mart, supermarket"
    notes:
      "n1": "마트 (mateu) is a loanword from English \"mart\": a large shop that sells food and goods."
    examples:
      "마트에 가요.":
        native: "I go to the mart."
        bases:
          "마트에": "mart, with the place particle 에 (e)"
          "가요": "to go, polite"
      "마트에서 사요.":
        native: "I buy it at the mart."
        bases:
          "마트에서": "mart, with the place particle 에서 (eseo)"
  "ko-2424":
    native: "bag, sack"
    notes:
      "n1": "봉지 (bongji) is a bag or sack; 비닐봉지 (binilbongji) is a plastic bag."
    examples:
      "봉지가 있어요?":
        native: "Is there a bag?"
        bases:
          "봉지가": "bag, with the subject particle 가 (ga)"
          "있어요": "to have, polite"
      "봉지를 주세요.":
        native: "Please give me a bag."
        bases:
          "봉지를": "bag, with the object particle 를 (reul)"
          "주세요": "to give, polite request"
  "ko-2425":
    native: "plastic bag"
    notes:
      "n1": "비닐봉지 (binilbongji) is a plastic bag, from 비닐 (binil), the word for vinyl or plastic."
    examples:
      "비닐봉지 주세요.":
        native: "Please give me a plastic bag."
        bases:
          "비닐봉지": "plastic bag"
          "주세요": "to give, polite request"
      "비닐봉지가 있어요?":
        native: "Is there a plastic bag?"
        bases:
          "비닐봉지가": "plastic bag, with the subject particle 가 (ga)"
          "있어요": "to have, polite"
  "ko-2426":
    native: "shopping"
    notes:
      "n1": "쇼핑 (syoping) is a loanword from English \"shopping\"; 쇼핑하다 (syopinghada) is the verb."
    examples:
      "쇼핑을 해요.":
        native: "I go shopping."
        bases:
          "쇼핑을": "shopping, with the object particle 을 (eul)"
          "해요": "to do, polite"
      "쇼핑이 좋아요.":
        native: "Shopping is good."
        bases:
          "쇼핑이": "shopping, with the subject particle 이 (i)"
          "좋아요": "to be good, polite"
  "ko-2427":
    native: "to shop"
    notes:
      "n1": "쇼핑하다 (syopinghada) is a 하다 (hada) verb; its polite form 쇼핑해요 (syopinghaeyo) is in the examples."
    examples:
      "쇼핑해요.":
        native: "I shop."
        bases:
          "쇼핑해요": "to shop, polite"
      "저는 쇼핑해요.":
        native: "I shop."
        bases:
          "쇼핑해요": "to shop, polite"
  "ko-2431":
    native: "money"
    notes:
      "n1": "돈 (don) is money. 돈 (don) is money; 없다 (eopda) means to have none, to be not there."
    examples:
      "돈이 없어요.":
        native: "I have no money."
        bases:
          "돈이": "money, with the subject particle 이 (i)"
          "없어요": "to have none, polite"
      "돈을 주세요.":
        native: "Please give me the money."
        bases:
          "돈을": "money, with the object particle 을 (eul)"
          "주세요": "to give, polite request"
  "ko-2432":
    native: "cash"
    notes:
      "n1": "현금 (hyeongeum) is cash, as opposed to 카드 (kadeu), a card."
    examples:
      "현금이 있어요?":
        native: "Do you have cash?"
        bases:
          "현금이": "cash, with the subject particle 이 (i)"
          "있어요": "to have, polite"
      "현금을 주세요.":
        native: "Please give me cash."
        bases:
          "현금을": "cash, with the object particle 을 (eul)"
          "주세요": "to give, polite request"
  "ko-2433":
    native: "card, payment card"
    notes:
      "n1": "카드 (kadeu) is a loanword from English \"card\"; at a shop it means a payment card."
    examples:
      "카드가 있어요?":
        native: "Do you have a card?"
        bases:
          "카드가": "card, with the subject particle 가 (ga)"
          "있어요": "to have, polite"
      "카드 주세요.":
        native: "A card, please."
        bases:
          "카드": "card"
          "주세요": "to give, polite request"
  "ko-2434":
    native: "bill, payment at a till"
    notes:
      "n1": "계산 (gyesan) means calculation; at a till it means the payment. 계산하다 (gyesanhada) is the verb."
    examples:
      "계산은 카드예요.":
        native: "Payment is by card."
        bases:
          "계산은": "payment, with the topic particle 은 (eun)"
      "계산은 현금이에요.":
        native: "Payment is in cash."
        bases:
          "계산은": "payment, with the topic particle 은 (eun)"
  "ko-2435":
    native: "receipt"
    notes:
      "n1": "영수증 (yeongsujeung) is a receipt, a written proof of payment."
    examples:
      "영수증 주세요.":
        native: "Please give me the receipt."
        bases:
          "영수증": "receipt"
          "주세요": "to give, polite request"
      "영수증이 있어요?":
        native: "Do you have the receipt?"
        bases:
          "영수증이": "receipt, with the subject particle 이 (i)"
          "있어요": "to have, polite"
  "ko-2436":
    native: "discount"
    notes:
      "n1": "할인 (harin) is a discount; 할인하다 (harinhada) is the verb, to give one."
    examples:
      "할인이 있어요?":
        native: "Is there a discount?"
        bases:
          "할인이": "discount, with the subject particle 이 (i)"
          "있어요": "to have, polite"
      "할인이 많아요.":
        native: "There are many discounts."
        bases:
          "할인이": "discount, with the subject particle 이 (i)"
          "많아요": "to be many, polite"
  "ko-2437":
    native: "to give a discount"
    notes:
      "n1": "할인하다 (harinhada) is a 하다 (hada) verb; its polite form is 할인해요 (harinhaeyo)."
    examples:
      "할인해요?":
        native: "Do you give a discount?"
        bases:
          "할인해요": "to give a discount, polite"
      "마트가 할인해요.":
        native: "The mart gives a discount."
        bases:
          "할인해요": "to give a discount, polite"
  "ko-2438":
    native: "sale"
    notes:
      "n1": "세일 (seil) is a loanword from English \"sale\": goods sold at a lower price."
    examples:
      "세일이 좋아요.":
        native: "The sale is good."
        bases:
          "세일이": "sale, with the subject particle 이 (i)"
          "좋아요": "to be good, polite"
      "마트에 세일이 있어요.":
        native: "There is a sale at the mart."
        bases:
          "세일이": "sale, with the subject particle 이 (i)"
          "있어요": "to have, polite"
  "ko-2439":
    native: "bargain sale"
    notes:
      "n1": "바겐세일 (bagenseil) is a loanword for a bargain sale; the dictionary treats it as a kind of 세일 (seil)."
    examples:
      "바겐세일이 좋아요?":
        native: "Is the bargain sale good?"
        bases:
          "바겐세일이": "bargain sale, with the subject particle 이 (i)"
          "좋아요": "to be good, polite"
      "바겐세일이 있어요.":
        native: "There is a bargain sale."
        bases:
          "바겐세일이": "bargain sale, with the subject particle 이 (i)"
          "있어요": "to have, polite"
  "ko-2440":
    native: "customer, guest"
    notes:
      "n1": "손님 (sonnim) is a customer or a guest; in a shop it is the everyday word for a customer. The dictionary also tags it honorific and euphemistic."
    examples:
      "손님이 많아요.":
        native: "There are many customers."
        bases:
          "손님이": "customer, with the subject particle 이 (i)"
          "많아요": "to be many, polite"
      "손님이 있어요.":
        native: "There is a customer."
        bases:
          "손님이": "customer, with the subject particle 이 (i)"
          "있어요": "to be there, polite"
  "ko-2441":
    native: "owner"
    notes:
      "n1": "주인 (juin) is the owner of a shop or a house; 사장님 (sajangnim) is the boss of a business."
    examples:
      "주인은 친절해요.":
        native: "The owner is kind."
        bases:
          "주인은": "owner, with the topic particle 은 (eun)"
          "친절해요": "to be kind, polite"
      "주인이 없어요.":
        native: "The owner is not here."
        bases:
          "주인이": "owner, with the subject particle 이 (i)"
          "없어요": "to be not there, polite"
  "ko-2442":
    native: "shop assistant"
    notes:
      "n1": "점원 (jeomwon) is a shop assistant who serves the customers; 직원 (jigwon) is a member of staff at a company."
    examples:
      "점원이 친절해요.":
        native: "The shop assistant is kind."
        bases:
          "점원이": "shop assistant, with the subject particle 이 (i)"
          "친절해요": "to be kind, polite"
      "점원이 있어요?":
        native: "Is there a shop assistant?"
        bases:
          "점원이": "shop assistant, with the subject particle 이 (i)"
          "있어요": "to be there, polite"
  "ko-2443":
    native: "staff, employee"
    notes:
      "n1": "직원 (jigwon) is an employee or member of staff; 점원 (jeomwon) is a shop assistant."
    examples:
      "직원이 많아요.":
        native: "There are many staff."
        bases:
          "직원이": "staff, with the subject particle 이 (i)"
          "많아요": "to be many, polite"
      "직원은 친절해요.":
        native: "The staff are kind."
        bases:
          "직원은": "staff, with the topic particle 은 (eun)"
          "친절해요": "to be kind, polite"
  "ko-2444":
    native: "salesperson"
    notes:
      "n1": "판매원 (panmaewon) is a salesperson who sells goods."
    examples:
      "판매원이 있어요.":
        native: "There is a salesperson."
        bases:
          "판매원이": "salesperson, with the subject particle 이 (i)"
          "있어요": "to be there, polite"
      "판매원이 친절해요.":
        native: "The salesperson is kind."
        bases:
          "판매원이": "salesperson, with the subject particle 이 (i)"
          "친절해요": "to be kind, polite"
  "ko-2445":
    native: "store; shop (the sales area)"
    notes:
      "n1": "매장 (maejang) is the part of a shop where goods are sold, the sales floor."
    examples:
      "매장에 손님이 많아요.":
        native: "There are many customers in the store."
        bases:
          "매장에": "store, with the place particle 에 (e)"
          "많아요": "to be many, polite"
      "매장에 가요.":
        native: "I go to the store."
        bases:
          "매장에": "store, with the place particle 에 (e)"
          "가요": "to go, polite"
  "ko-2446":
    native: "weight"
    notes:
      "n1": "무게 (muge) is weight; 저울 (jeoul) is a scale for weighing."
    examples:
      "무게가 얼마예요?":
        native: "How heavy is it?"
        bases:
          "무게가": "weight, with the subject particle 가 (ga)"
      "무게가 있어요.":
        native: "It has weight."
        bases:
          "무게가": "weight, with the subject particle 가 (ga)"
          "있어요": "to have, polite"
  "ko-2447":
    native: "scale"
    notes:
      "n1": "저울 (jeoul) is a scale for weighing things."
    examples:
      "저울이 있어요?":
        native: "Is there a scale?"
        bases:
          "저울이": "scale, with the subject particle 이 (i)"
          "있어요": "to be there, polite"
      "저울이 좋아요.":
        native: "The scale is good."
        bases:
          "저울이": "scale, with the subject particle 이 (i)"
          "좋아요": "to be good, polite"
  "ko-2448":
    native: "size, clothing size"
    notes:
      "n1": "사이즈 (saijeu) is a loanword from English \"size\", a size of clothes or shoes; 크기 (keugi) is size in general."
    examples:
      "사이즈가 좋아요.":
        native: "The size is good."
        bases:
          "사이즈가": "size, with the subject particle 가 (ga)"
          "좋아요": "to be good, polite"
      "사이즈가 있어요?":
        native: "Do you have my size?"
        bases:
          "사이즈가": "size, with the subject particle 가 (ga)"
          "있어요": "to be there, polite"
  "ko-2449":
    native: "size"
    notes:
      "n1": "크기 (keugi) is size in general, how big or small something is; 사이즈 (saijeu) is a clothing size."
    examples:
      "크기가 얼마예요?":
        native: "How big is it?"
        bases:
          "크기가": "size, with the subject particle 가 (ga)"
      "크기가 좋아요.":
        native: "The size is good."
        bases:
          "크기가": "size, with the subject particle 가 (ga)"
          "좋아요": "to be good, polite"
  "ko-2450":
    native: "colour"
    notes:
      "n1": "색깔 (saekkkal) is colour, what colour something is."
    examples:
      "색깔이 좋아요.":
        native: "The colour is good."
        bases:
          "색깔이": "colour, with the subject particle 이 (i)"
          "좋아요": "to be good, polite"
      "색깔이 뭐예요?":
        native: "What colour is it?"
        bases:
          "색깔이": "colour, with the subject particle 이 (i)"
  "ko-2451":
    native: "exchange"
    notes:
      "n1": "교환 (gyohwan) is an exchange of goods, swapping one for another, as at a shop."
    examples:
      "교환이 돼요?":
        native: "Is an exchange possible?"
        bases:
          "교환이": "exchange, with the subject particle 이 (i)"
          "돼요": "to be possible, polite"
      "교환을 해요.":
        native: "We do an exchange."
        bases:
          "교환을": "exchange, with the object particle 을 (eul)"
          "해요": "to do, polite"
  "ko-2452":
    native: "refund"
    notes:
      "n1": "환불 (hwanbul) is a refund, money paid back to the buyer."
    examples:
      "환불이 돼요?":
        native: "Is a refund possible?"
        bases:
          "환불이": "refund, with the subject particle 이 (i)"
          "돼요": "to be possible, polite"
      "환불이 있어요?":
        native: "Is there a refund?"
        bases:
          "환불이": "refund, with the subject particle 이 (i)"
          "있어요": "to be there, polite"
  "ko-2453":
    native: "order"
    notes:
      "n1": "주문 (jumun) is an order for goods or food; 주문해요 (jumunhaeyo) is the polite verb form of ordering."
    examples:
      "주문이 많아요.":
        native: "There are many orders."
        bases:
          "주문이": "order, with the subject particle 이 (i)"
          "많아요": "to be many, polite"
      "주문을 해요.":
        native: "I place an order."
        bases:
          "주문을": "order, with the object particle 을 (eul)"
          "해요": "to do, polite"
  "ko-2454":
    native: "delivery"
    notes:
      "n1": "배달 (baedal) is delivery, for example of food to a home."
    examples:
      "배달이 돼요?":
        native: "Is delivery possible?"
        bases:
          "배달이": "delivery, with the subject particle 이 (i)"
          "돼요": "to be possible, polite"
      "배달이 좋아요.":
        native: "Delivery is good."
        bases:
          "배달이": "delivery, with the subject particle 이 (i)"
          "좋아요": "to be good, polite"
  "ko-2455":
    native: "free of charge"
    notes:
      "n1": "무료 (muryo) means free of charge, costing nothing."
    examples:
      "무료예요.":
        native: "It is free."
        bases:
          "무료예요": "free of charge, with the polite copula 예요 (yeyo)"
      "이거 무료예요?":
        native: "Is this free?"
        bases:
          "이거": "this"
          "무료예요": "free of charge, with the polite copula 예요 (yeyo)"
  "ko-2456":
    native: "business, trade"
    notes:
      "n1": "장사 (jangsa) is business or trade, such as selling in a market."
    examples:
      "장사가 잘 돼요.":
        native: "Business is going well."
        bases:
          "장사가": "business, with the subject particle 가 (ga)"
          "잘": "well"
          "돼요": "to go well, polite"
  "ko-2457":
    native: "price"
    notes:
      "n1": "값 (gapt) is the everyday word for a price; 가격 (gagyeok) is a more formal word for it."
    examples:
      "값이 얼마예요?":
        native: "How much is the price?"
        bases:
          "값이": "price, with the subject particle 이 (i)"
      "값이 싸요.":
        native: "The price is cheap."
        bases:
          "값이": "price, with the subject particle 이 (i)"
  "ko-2458":
    native: "price"
    notes:
      "n1": "가격 (gagyeok) is the price, a more formal word than 값 (gapt)."
    examples:
      "가격이 얼마예요?":
        native: "What is the price?"
        bases:
          "가격이": "price, with the subject particle 이 (i)"
      "가격이 비싸요.":
        native: "The price is high."
        bases:
          "가격이": "price, with the subject particle 이 (i)"
