schema: 1
id: "ko-en-hangul-compound-vowels"
kind: "layer"
core: "ko-hangul-compound-vowels"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hangul compound vowels"
license: "CC-BY-SA-4.0"
description: "The compound vowels: a vowel with a 'w' or a 'y' said before it, or two vowels written together. Each is written after a silent ㅇ (ieung), as the basic vowels are. Many speakers today say ㅐ (ae) and ㅔ (e) alike, and ㅚ (oe) and ㅞ (we) alike, though the spelling keeps each pair apart; the notes say which pairs. The mirror-image pairs ㅐ (ae) and ㅔ (e), ㅒ (yae) and ㅖ (ye) differ in where their short strokes lie. Not yet checked by a Korean speaker: please report any mistake."
tags: ["unreviewed"]
"cards":
  "ko-0148":
    "native": "ae, like the 'e' of 'bed', said open; many speakers now say it as 에 (e)"
    "notes":
      "n1": "애 (ae) is the vowel ㅐ (ae): ㅏ (a) with one more short stroke, so it has two short strokes on the right of its long line. It is written after a silent ㅇ (ieung)."
      "pair-e": "애 (ae) and 에 (e) sound almost the same to many speakers today, though the spelling keeps them apart: ㅐ (ae) and ㅔ (e) are two letters."
      "look-e": "ㅐ (ae) has its two short strokes on the right of its long line, and ㅔ (e) has them on the left."
  "ko-0149":
    "native": "e, like the 'e' of 'bed'"
    "notes":
      "n1": "에 (e) is the vowel ㅔ (e): ㅓ (eo) with one more short stroke, so it has two short strokes on the left of its long line. It is written after a silent ㅇ (ieung)."
      "pair-ae": "에 (e) and 애 (ae) sound almost the same to many speakers today, though the spelling keeps them apart: ㅔ (e) and ㅐ (ae) are two letters."
      "look-ae": "ㅔ (e) has its two short strokes on the left of its long line, and ㅐ (ae) has them on the right."
  "ko-0150":
    "native": "yae, the 'ya' of 'yard' with the vowel of 'bed'"
    "notes":
      "n1": "얘 (yae) is the vowel ㅒ (yae): ㅐ (ae) with a 'y' said before it. It has three short strokes on the right of its long line, where ㅐ (ae) has two."
      "pair-ye": "얘 (yae) and 예 (ye) sound almost the same to many speakers today, though the spelling keeps them apart: ㅒ (yae) and ㅖ (ye) are two letters."
      "look-ye": "ㅒ (yae) has three short strokes on the right of its long line, and ㅖ (ye) has three on the left."
  "ko-0151":
    "native": "ye, the 'ye' of 'yes'"
    "notes":
      "n1": "예 (ye) is the vowel ㅖ (ye): ㅔ (e) with a 'y' said before it. It has three short strokes on the left of its long line, where ㅔ (e) has two."
      "pair-yae": "예 (ye) and 얘 (yae) sound almost the same to many speakers today, though the spelling keeps them apart: ㅖ (ye) and ㅒ (yae) are two letters."
      "look-yae": "ㅖ (ye) has three short strokes on the left of its long line, and ㅒ (yae) has them on the right."
  "ko-0152":
    "native": "wa, the 'wa' of 'want'"
    "notes":
      "n1": "와 (wa) is the vowel ㅘ (wa): a 'w' said before ㅏ (a), written with ㅗ (o) and ㅏ (a) together."
  "ko-0153":
    "native": "wae, a 'w' before the vowel of 'bed'"
    "notes":
      "n1": "왜 (wae) is the vowel ㅙ (wae): a 'w' said before ㅐ (ae), written with ㅗ (o) and ㅐ (ae) together."
      "pair-we": "왜 (wae) and 웨 (we) sound almost the same to many speakers today, though the spelling keeps them apart: ㅙ (wae) and ㅞ (we) are two letters."
      "same-why": "왜 (wae) is also the everyday word 'why', which has its own card. The spelling and the sound are the same as the vowel."
  "ko-0154":
    "native": "oe, from 'o' towards 'e' with the lips rounded"
    "notes":
      "n1": "외 (oe) is the vowel ㅚ (oe): ㅗ (o) with a vertical line added on its right, said from o towards e with the lips rounded."
      "pair-we": "외 (oe) and 웨 (we) sound almost the same to many speakers today: ㅚ (oe) and ㅞ (we) are two letters."
      "look-wi": "ㅚ (oe) has one dot above its long line, and ㅟ (wi) has its dot below it."
  "ko-0155":
    "native": "wo, the 'wo' of 'won'"
    "notes":
      "n1": "워 (wo) is the vowel ㅝ (wo): a 'w' said before ㅓ (eo), written with ㅜ (u) and ㅓ (eo) together."
  "ko-0156":
    "native": "we, the 'we' of 'wet'"
    "notes":
      "n1": "웨 (we) is the vowel ㅞ (we): a 'w' said before ㅔ (e), written with ㅜ (u) and ㅔ (e) together."
      "pair-oe": "웨 (we) and 외 (oe) sound almost the same to many speakers today, though the spelling keeps them apart: ㅞ (we) and ㅚ (oe) are two letters."
      "pair-wae": "웨 (we) and 왜 (wae) sound almost the same to many speakers today, though the spelling keeps them apart: ㅞ (we) and ㅙ (wae) are two letters."
  "ko-0157":
    "native": "wi, like the 'wee' of 'week' said short"
    "notes":
      "n1": "위 (wi) is the vowel ㅟ (wi): a 'w' said before ㅣ (i), written with ㅜ (u) and ㅣ (i) together."
      "look-oe": "ㅟ (wi) has one dot below its long line, and ㅚ (oe) has its dot above it."
  "ko-0158":
    "native": "ui, said as one quick glide from 'oo' to 'ee'"
    "notes":
      "n1": "의 (ui) is the vowel ㅢ (ui): ㅡ (eu) with a vertical line added on its right, said as one quick glide from u to i. When it is not at the start of a word, many speakers say it as e, as 에 (e) is said."
