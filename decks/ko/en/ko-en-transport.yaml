      "노선도 주세요.":
        "native": "A transit map, please."
        "bases":
          "노선도": "transit map"
          "주세요": "please give (polite request)"
      "노선도가 어디예요?":
        "native": "Where is the transit map?"
        "bases":
          "노선도가": "transit map, with the subject particle 가 (ga)"
  "ko-2683":
    "native": "to drive."
    "examples":
      "저는 운전해요.":
        "native": "I drive."
        "bases":
          "운전해요": "drive (polite)"
      "버스를 운전해요.":
        "native": "I drive a bus."
        "bases":
          "운전해요": "to drive (polite)"
  "ko-2684":
    "native": "parking."
    "notes":
      "n1": "주차 (jucha) is the act of parking. The place is 주차장 (juchajang), the car park."
    "examples":
      "주차가 안 돼요.":
        "native": "Parking is not allowed."
        "bases":
          "주차가": "parking, with the subject particle 가 (ga)"
          "안": "not, before a verb"
          "돼요": "to be allowed, to work (polite)"
      "주차가 있어요?":
        "native": "Is there parking?"
        "bases":
          "주차가": "parking, with the subject particle 가 (ga)"
          "있어요": "there is, to have (polite)"
  "ko-2685":
    "native": "car park, parking lot."
    "examples":
      "주차장이 어디예요?":
        "native": "Where is the car park?"
        "bases":
          "주차장이": "car park, with the subject particle 이 (i)"
      "주차장에 자동차가 많아요.":
        "native": "There are many cars in the car park."
        "bases":
          "주차장에": "car park, with the particle 에 (e) for a place"
          "많아요": "many, a lot (polite)"
  "ko-2686":
    "native": "road, thoroughfare."
