"schema": 1
"id": "ko-en-transport"
"kind": "layer"
"core": "ko-transport"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Transport words"
"license": "CC-BY-SA-4.0"
"description": "Thirty-four words for getting around: vehicles, stations, tickets, and the verbs ride, get off, change and drive. Not yet checked by a Korean speaker: please report any mistake."
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ko-2660":
    "native": "bus."
    "examples":
      "버스를 타요.":
        "native": "I take the bus."
        "bases":
          "버스를": "bus, with the object particle 를 (reul)"
      "버스가 많아요.":
        "native": "There are many buses."
        "bases":
          "버스가": "bus, with the subject particle 가 (ga)"
          "많아요": "many, a lot (polite)"
  "ko-2661":
    "native": "taxi."
    "examples":
      "택시를 타요.":
        "native": "I take a taxi."
        "bases":
          "택시를": "taxi, with the object particle 를 (reul)"
      "택시가 없어요.":
        "native": "There is no taxi."
        "bases":
          "택시가": "taxi, with the subject particle 가 (ga)"
          "없어요": "there is not, to not have (polite)"
  "ko-2662":
    "native": "subway."
    "examples":
      "지하철을 타요.":
        "native": "I take the subway."
        "bases":
          "지하철을": "subway, with the object particle 을 (eul)"
      "지하철 역이 어디예요?":
        "native": "Where is the subway station?"
        "bases":
          "지하철": "subway"
  "ko-2663":
    "native": "train."
    "notes":
      "n1": "기차 (gicha) and 열차 (yeolcha) both mean train. Both are taught as train; the next card is the other word."
    "examples":
      "기차가 없어요.":
        "native": "There is no train."
        "bases":
          "기차가": "train, with the subject particle 가 (ga)"
          "없어요": "there is not, to not have (polite)"
      "기차 표가 있어요?":
        "native": "Do you have a train ticket?"
        "bases":
          "기차": "train"
          "있어요": "there is, to have (polite)"
  "ko-2664":
    "native": "train."
    "notes":
      "n1": "열차 (yeolcha) means train, like 기차 (gicha) before it."
    "examples":
      "열차가 없어요.":
        "native": "There is no train."
        "bases":
          "열차가": "train, with the subject particle 가 (ga)"
          "없어요": "there is not, to not have (polite)"
      "열차 표가 있어요?":
        "native": "Do you have a train ticket?"
        "bases":
          "열차": "train"
          "있어요": "there is, to have (polite)"
  "ko-2665":
    "native": "automobile, car."
    "examples":
      "자동차가 많아요.":
        "native": "There are many cars."
        "bases":
          "자동차가": "car, with the subject particle 가 (ga)"
          "많아요": "many, a lot (polite)"
      "저는 자동차가 없어요.":
        "native": "I have no car."
        "bases":
          "자동차가": "automobile, car, with the subject particle 가 (ga)"
          "없어요": "there is not, to not have (polite)"
  "ko-2666":
    "native": "bicycle."
    "examples":
      "자전거를 타요.":
        "native": "I ride a bicycle."
        "bases":
          "자전거를": "bicycle, with the object particle 를 (reul)"
      "자전거가 싸요.":
        "native": "The bicycle is cheap."
        "bases":
          "자전거가": "bicycle, with the subject particle 가 (ga)"
  "ko-2667":
    "native": "motorcycle."
    "examples":
      "오토바이가 있어요.":
        "native": "There is a motorcycle."
        "bases":
          "오토바이가": "motorcycle, with the subject particle 가 (ga)"
          "있어요": "there is, to have (polite)"
      "오토바이를 운전해요?":
        "native": "Do you drive a motorcycle?"
        "bases":
          "오토바이를": "motorcycle, with the object particle 를 (reul)"
  "ko-2668":
    "native": "airplane."
    "examples":
      "비행기를 타요.":
        "native": "I take a plane."
        "bases":
          "비행기를": "airplane, with the object particle 를 (reul)"
      "비행기 표가 있어요?":
        "native": "Do you have a plane ticket?"
        "bases":
          "비행기": "airplane"
          "있어요": "there is, to have (polite)"
  "ko-2669":
    "native": "ship, boat, of any size."
    "notes":
      "n1": "배 (bae) as a ship is a different word from 배 (bae), the belly. They are written and said the same, so the sentence tells them apart: 배를 (baereul) 타요 (tayo) means I take a ship."
    "examples":
      "배를 타요.":
        "native": "I take a ship."
        "bases":
          "배를": "ship, with the object particle 를 (reul)"
      "배가 없어요.":
        "native": "There is no ship."
        "bases":
          "배가": "ship, with the subject particle 가 (ga)"
          "없어요": "there is not, to not have (polite)"
  "ko-2670":
    "native": "airport."
    "examples":
      "공항이 어디예요?":
        "native": "Where is the airport?"
        "bases":
          "공항이": "airport, with the subject particle 이 (i)"
      "공항에 가요.":
        "native": "I go to the airport."
        "bases":
          "공항에": "airport, with the particle 에 (e) for a place"
          "가요": "go (polite)"
  "ko-2671":
    "native": "(railway, subway) station."
    "examples":
      "역이 어디예요?":
        "native": "Where is the station?"
        "bases":
          "역이": "station, with the subject particle 이 (i)"
      "역에 가요.":
        "native": "I go to the station."
        "bases":
          "역에": "station, with the particle 에 (e) for a place"
          "가요": "go (polite)"
  "ko-2672":
    "native": "bus stop."
    "examples":
      "정류장이 어디예요?":
        "native": "Where is the bus stop?"
        "bases":
          "정류장이": "stop, with the subject particle 이 (i)"
      "버스 정류장에 가요.":
        "native": "I go to the bus stop."
        "bases":
          "정류장에": "stop, with the particle 에 (e) for a place"
          "가요": "go (polite)"
  "ko-2673":
    "native": "terminal."
    "examples":
      "터미널이 어디예요?":
        "native": "Where is the terminal?"
        "bases":
          "터미널이": "terminal, with the subject particle 이 (i)"
      "터미널에 가요.":
        "native": "I go to the terminal."
        "bases":
          "터미널에": "terminal, with the particle 에 (e) for a place"
          "가요": "go (polite)"
  "ko-2674":
    "native": "ticket."
    "examples":
      "표가 없어요.":
        "native": "There is no ticket."
        "bases":
          "표가": "ticket, with the subject particle 가 (ga)"
          "없어요": "there is not, to not have (polite)"
      "표 주세요.":
        "native": "A ticket, please."
        "bases":
          "표": "ticket"
          "주세요": "please give (polite request)"
  "ko-2675":
    "native": "boarding."
    "examples":
      "언제 탑승해요?":
        "native": "When do you board?"
        "bases":
          "탑승해요": "board (polite)"
  "ko-2677":
    "native": "to get off, to come down."
    "notes":
      "n1": "The gloss is the first sense of 내리다 (naerida). Its second sense is get off, which is the one used here."
    "examples":
      "역에서 내려요.":
        "native": "I get off at the station."
        "bases":
          "내려요": "get off (polite)"
      "버스에서 내려요.":
        "native": "I get off the bus."
        "bases":
          "내려요": "to get off, to come down (polite)"
  "ko-2678":
    "native": "to change, to transfer."
    "examples":
      "역에서 갈아타요.":
        "native": "I change trains at the station."
        "bases":
          "갈아타요": "change (polite)"
      "지하철을 갈아타요.":
        "native": "I change to the subway."
        "bases":
          "갈아타요": "to change, to transfer (polite)"
  "ko-2679":
    "native": "departure."
    "examples":
      "출발이 언제예요?":
        "native": "When is the departure?"
        "bases":
          "출발이": "departure, with the subject particle 이 (i)"
      "출발 역이 어디예요?":
        "native": "Where is the departure station?"
        "bases":
          "출발": "departure"
  "ko-2680":
    "native": "arrival."
    "examples":
      "도착이 언제예요?":
        "native": "When is the arrival?"
        "bases":
          "도착이": "arrival, with the subject particle 이 (i)"
      "도착 역이 어디예요?":
        "native": "Where is the arrival station?"
        "bases":
          "도착": "arrival"
  "ko-2681":
    "native": "line; route."
    "examples":
      "이 노선이 어디예요?":
        "native": "Where is this line?"
        "bases":
          "노선이": "line, with the subject particle 이 (i)"
      "노선이 많아요.":
        "native": "There are many lines."
        "bases":
          "노선이": "line, with the subject particle 이 (i)"
          "많아요": "many, a lot (polite)"
  "ko-2682":
    "native": "transit map."
