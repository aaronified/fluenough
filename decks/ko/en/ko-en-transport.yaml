      "도로가 많아요.":
        "native": "There are many roads."
        "bases":
          "도로가": "road, with the subject particle 가 (ga)"
          "많아요": "many, a lot (polite)"
      "도로에 자동차가 없어요.":
        "native": "There are no cars on the road."
        "bases":
          "도로에": "road, with the particle 에 (e) for a place"
          "없어요": "there is not, to not have (polite)"
  "ko-2687":
    "native": "fee, charge, fare."
    "examples":
      "요금이 얼마예요?":
        "native": "How much is the fare?"
        "bases":
          "요금이": "fare, with the subject particle 이 (i)"
      "버스 요금이 싸요.":
        "native": "The bus fare is cheap."
        "bases":
          "요금이": "fee, charge, fare, with the subject particle 이 (i)"
  "ko-2688":
    "native": "transportation."
    "examples":
      "교통이 어때요?":
        "native": "How is the transport?"
        "bases":
          "교통이": "transport, with the subject particle 이 (i)"
      "지하철 교통이 좋아요.":
        "native": "The subway transport is good."
        "bases":
          "교통이": "transportation, with the subject particle 이 (i)"
  "ko-2689":
    "native": "transportation card, farecard."
    "examples":
      "교통카드가 있어요?":
        "native": "Do you have a transport card?"
        "bases":
          "교통카드가": "transport card, with the subject particle 가 (ga)"
          "있어요": "there is, to have (polite)"
      "교통카드 주세요.":
        "native": "A transport card, please."
        "bases":
          "교통카드": "transport card"
          "주세요": "please give (polite request)"
  "ko-2690":
    "native": "express bus."
    "examples":
      "고속버스를 타요.":
        "native": "I take the express bus."
        "bases":
          "고속버스를": "express bus, with the object particle 를 (reul)"
      "고속버스가 없어요.":
        "native": "There is no express bus."
        "bases":
          "고속버스가": "express bus, with the subject particle 가 (ga)"
          "없어요": "there is not, to not have (polite)"
  "ko-2692":
    "native": "road, path, street."
    "examples":
      "길을 걸어요.":
        "native": "I walk along the road."
        "bases":
          "길을": "road, with the object particle 을 (eul)"
      "길이 없어요.":
        "native": "There is no road."
        "bases":
          "길이": "road, with the subject particle 이 (i)"
          "없어요": "there is not, to not have (polite)"
  "ko-2693":
    "native": "driving."
    "notes":
      "n1": "운전 (unjeon) is the noun for driving. The verb is 운전하다 (unjeonhada), to drive."
    "examples":
      "운전은 어때요?":
        "native": "How about driving?"
        "bases":
          "운전은": "driving, with the topic particle 은 (eun)"
      "저는 운전이 좋아요.":
        "native": "I like driving."
        "bases":
          "운전이": "driving, with the subject particle 이 (i)"
