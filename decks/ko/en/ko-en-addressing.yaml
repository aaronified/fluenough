schema: 1
id: "ko-en-addressing"
kind: "layer"
core: "ko-addressing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Addressing people"
license: "CC-BY-SA-4.0"
description: "Twenty words for the people you meet and how to call them: the title after a name, the teacher, the professor, the boss, a friend, the family name, a man or woman, the uncle and aunt of the street, an adult and a child, a business card and a greeting. Korean uses titles, not 'you', to speak to someone, so most examples name the person. Not yet checked by a Korean speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "ko-0088":
    "native": "Mr., Ms. (after a name)"
    "notes":
      "n1": "씨 (ssi) goes after a person's name, as Mr. or Ms.: 박 씨 (bak ssi), Mr. Park. It is written apart from the name, and it is not used for yourself. It is also the word for a seed, which is not taught here."
    "examples":
      "민수 씨는 학생이에요.":
        "native": "Mr. Minsu is a student."
        "bases":
          "민수": "Minsu, a given name"
          "씨는": "Mr. or Ms., with the topic particle 는 (neun)"
      "박 씨는 선생님이에요.":
        "native": "Mr. Park is a teacher."
        "bases":
          "박": "Park, a family name"
          "씨는": "Mr. or Ms., with the topic particle 는 (neun)"
  "ko-0089":
    "native": "professor"
    "notes":
      "n1": "교수님 (gyosunim) is a professor, said with respect. The honorific 님 (nim) makes a title respectful, as in 선생님 (seonsaengnim), teacher. Use it for the person you speak of or to, not for yourself."
    "examples":
      "교수님은 어디예요?":
        "native": "Where is the professor?"
        "bases":
          "교수님은": "professor, with the topic particle 은 (eun)"
      "교수님, 안녕하세요.":
        "native": "Professor, hello."
        "bases":
          "안녕하세요": "hello (polite)"
  "ko-0090":
    "native": "boss, head of a company"
    "notes":
      "n1": "사장님 (sajangnim) is the boss or the owner of a company or a shop, said with respect. A shopkeeper is often called 사장님 (sajangnim) by a customer."
    "examples":
      "사장님은 어디예요?":
        "native": "Where is the boss?"
        "bases":
          "사장님은": "boss, with the topic particle 은 (eun)"
      "사장님, 물 주세요.":
        "native": "Boss, water please."
        "bases":
          "주세요": "give, please (polite)"
  "ko-0091":
    "native": "friend"
    "notes":
      "n1": "친구 (chingu) is a friend, of the same age or a classmate. It is not used for a teacher or an older person, who get 님 (nim)."
    "examples":
      "친구는 회사원이에요.":
        "native": "A friend is an office worker."
        "bases":
          "친구는": "friend, with the topic particle 는 (neun)"
          "회사원이에요": "office worker, with the polite 'is' 이에요 (ieyo)"
      "친구는 어디예요?":
        "native": "Where is the friend?"
        "bases":
          "친구는": "friend, with the topic particle 는 (neun)"
  "ko-0092":
    "native": "family name, surname"
    "notes":
      "n1": "성 (seong) is the family name. In Korean the family name comes first, and the given name follows: 박 (bak) is the family name of Mr. Park. 이름 (ireum), name, is the whole name in everyday speech."
    "examples":
      "성이 뭐예요?":
        "native": "What is the family name?"
        "bases":
          "성이": "family name, with the subject particle 이 (i)"
      "성은 박이에요.":
        "native": "The family name is Park."
        "bases":
          "성은": "family name, with the topic particle 은 (eun)"
          "박이에요": "Park, with the polite 'is' 이에요 (ieyo)"
  "ko-0093":
    "native": "name (polite)"
    "notes":
      "n1": "성함 (seongham) is the polite word for someone else's name. For your own name, or in an everyday question, 이름 (ireum) is used. A teacher's name is asked for with 성함 (seongham)."
    "examples":
      "성함이 뭐예요?":
        "native": "What is the name (polite)?"
        "bases":
          "성함이": "name (polite), with the subject particle 이 (i)"
      "선생님 성함은 뭐예요?":
        "native": "What is the teacher's name (polite)?"
        "bases":
          "성함은": "name (polite), with the topic particle 은 (eun)"
  "ko-0094":
    "native": "man"
    "notes":
      "n1": "남자 (namja) is a man. Its pair is 여자 (yeoja), woman. A middle-aged man is called 아저씨 (ajeossi), as in the next card."
    "examples":
      "남자는 학생이에요?":
        "native": "Is the man a student?"
        "bases":
          "남자는": "man, with the topic particle 는 (neun)"
      "남자는 의사예요?":
        "native": "Is the man a doctor?"
        "bases":
          "남자는": "man, with the topic particle 는 (neun)"
          "의사예요": "doctor, with the polite 'is' 예요 (yeyo)"
  "ko-0095":
    "native": "woman"
    "notes":
      "n1": "여자 (yeoja) is a woman. 여자 (yeoja) before a job, as in 여자 선생님 (yeoja seonsaengnim), makes it a female teacher. A middle-aged woman is 아줌마 (ajumma)."
    "examples":
      "여자는 회사원이에요?":
        "native": "Is the woman an office worker?"
        "bases":
          "여자는": "woman, with the topic particle 는 (neun)"
          "회사원이에요": "office worker, with the polite 'is' 이에요 (ieyo)"
      "여자 선생님이에요.":
        "native": "(She) is a female teacher."
  "ko-0096":
    "native": "office worker"
    "notes":
      "n1": "회사원 (hoesawon) is a worker in an office, a company employee. 회사 (hoesa) is the company, and 회사원 (hoesawon) is the person who works there."
    "examples":
      "저는 회사원이에요.":
        "native": "I am an office worker."
        "bases":
          "회사원이에요": "office worker, with the polite 'is' 이에요 (ieyo)"
      "회사원은 회사에 가요.":
        "native": "An office worker goes to the company."
        "bases":
          "회사원은": "office worker, with the topic particle 은 (eun)"
          "회사에": "company, with the place particle 에 (e)"
          "가요": "to go (polite)"
  "ko-0097":
    "native": "doctor"
    "notes":
      "n1": "의사 (uisa) is a doctor. The same spelling also means 'intention' in writing, which is not taught here."
    "examples":
      "의사는 어디예요?":
        "native": "Where is the doctor?"
        "bases":
          "의사는": "doctor, with the topic particle 는 (neun)"
      "여자는 의사예요?":
        "native": "Is the woman a doctor?"
        "bases":
          "여자는": "woman, with the topic particle 는 (neun)"
          "의사예요": "doctor, with the polite 'is' 예요 (yeyo)"
  "ko-0098":
    "native": "business card"
    "notes":
      "n1": "명함 (myeongham) is a business card, with a name, a job and a number. A 명함 (myeongham) is often exchanged when two people meet for the first time."
    "examples":
      "명함이 어디예요?":
        "native": "Where is the business card?"
        "bases":
          "명함이": "business card, with the subject particle 이 (i)"
      "명함이 있어요.":
        "native": "There is a business card."
        "bases":
          "명함이": "business card, with the subject particle 이 (i)"
          "있어요": "to be, to have (polite)"
  "ko-0099":
    "native": "introduction"
    "notes":
      "n1": "소개 (sogae) is an introduction, of one person to another. 소개해 주세요 (sogaehae juseyo) asks someone to introduce a person, and 자기소개 (jagisogae) is a self-introduction."
    "examples":
      "소개해 주세요.":
        "native": "Please introduce (someone)."
        "bases":
          "소개해": "to introduce (polite)"
          "주세요": "give, please (polite)"
      "소개가 뭐예요?":
        "native": "What is an introduction?"
        "bases":
          "소개가": "introduction, with the subject particle 가 (ga)"
  "ko-0100":
    "native": "greeting"
    "notes":
      "n1": "인사 (insa) is a greeting, a hello or a bow. 인사해요 (insahaeyo) is to greet someone. A greeting is said with 안녕하세요 (annyeonghaseyo), hello."
    "examples":
      "인사가 좋아요.":
        "native": "The greeting is good."
        "bases":
          "인사가": "greeting, with the subject particle 가 (ga)"
      "친구가 인사해요.":
        "native": "The friend greets."
        "bases":
          "친구가": "friend, with the subject particle 가 (ga)"
          "인사해요": "to greet (polite)"
  "ko-0101":
    "native": "middle-aged man, uncle"
    "notes":
      "n1": "아저씨 (ajeossi) is a middle-aged man, and an uncle. It is also how a stranger is called to get his attention, 'sir'. For a man of your own age, use 남자 (namja) or 씨 (ssi) with the name."
    "examples":
      "아저씨는 누구예요?":
        "native": "Who is the middle-aged man?"
        "bases":
          "아저씨는": "middle-aged man, with the topic particle 는 (neun)"
      "아저씨, 물 주세요.":
        "native": "Sir, water please."
        "bases":
          "주세요": "give, please (polite)"
  "ko-0102":
    "native": "middle-aged woman, aunt"
    "notes":
      "n1": "아줌마 (ajumma) is a middle-aged woman, and an aunt. It is how a stranger is called to get her attention, 'madam'. For a young woman, use 아가씨 (agassi)."
    "examples":
      "아줌마는 어디예요?":
        "native": "Where is the middle-aged woman?"
        "bases":
          "아줌마는": "middle-aged woman, with the topic particle 는 (neun)"
      "아줌마, 커피 주세요.":
        "native": "Madam, coffee please."
        "bases":
          "주세요": "give, please (polite)"
  "ko-0103":
    "native": "young woman, miss"
    "notes":
      "n1": "아가씨 (agassi) is a young woman, and a way to call one to get her attention, 'miss'. Shop assistants are called this, too. For a middle-aged woman, use 아줌마 (ajumma)."
    "examples":
      "아가씨, 이거 얼마예요?":
        "native": "Miss, how much is this?"
        "bases":
          "이거": "this, a short form of 이것 (igeot)"
      "아가씨는 학생이에요?":
        "native": "Is the young woman a student?"
        "bases":
          "아가씨는": "young woman, with the topic particle 는 (neun)"
  "ko-0104":
    "native": "adult"
    "notes":
      "n1": "어른 (eoreun) is an adult, a grown-up. It is the opposite of 어린이 (eorini), a child."
    "examples":
      "어른이 가요.":
        "native": "The adult goes."
        "bases":
          "어른이": "adult, with the subject particle 이 (i)"
          "가요": "to go (polite)"
      "어른은 어디예요?":
        "native": "Where is the adult?"
        "bases":
          "어른은": "adult, with the topic particle 은 (eun)"
  "ko-0105":
    "native": "child"
    "notes":
      "n1": "어린이 (eorini) is a child, a young person. It is the opposite of 어른 (eoreun), an adult."
    "examples":
      "어린이는 학생이에요?":
        "native": "Is the child a student?"
        "bases":
          "어린이는": "child, with the topic particle 는 (neun)"
      "어린이는 어디예요?":
        "native": "Where is the child?"
        "bases":
          "어린이는": "child, with the topic particle 는 (neun)"
  "ko-0106":
    "native": "first, the first time"
    "notes":
      "n1": "처음 (cheoeum) is first, the first time, or at first. 처음이에요 (cheoeumieyo) says that it is the first time, as when two people meet for the first time."
    "examples":
      "처음이에요.":
        "native": "It is the first time."
        "bases":
          "처음이에요": "first time, with the polite 'is' 이에요 (ieyo)"
      "처음이에요?":
        "native": "Is it the first time?"
        "bases":
          "처음이에요": "first time, with the polite 'is' 이에요 (ieyo)"
  "ko-0107":
    "native": "to meet"
    "notes":
      "n1": "만나다 (manada) is to meet a person, by arrangement or by chance. 만나요 (manayo) is its polite form. The person met is marked with 을 (eul) or 를 (reul), as in 친구를 (chingureul), a friend."
    "examples":
      "저는 친구를 만나요.":
        "native": "I meet a friend."
        "bases":
          "친구를": "friend, with the object particle 를 (reul)"
          "만나요": "to meet (polite)"
      "교수님을 만나요?":
        "native": "(Do you) meet the professor?"
        "bases":
          "교수님을": "professor, with the object particle 을 (eul)"
          "만나요": "to meet (polite)"
