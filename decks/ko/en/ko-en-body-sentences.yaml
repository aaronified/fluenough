"name": "Body sentences"
"license": "CC-BY-SA-4.0"
"description": "Seven sentences about where it hurts, built with the body words, each in the polite -요 (-yo) style. Not yet checked by a Korean speaker: please report any mistake."
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ko-4760":
    "native": "My head hurts."
    "confusables":
      "w1":
        "why": "얼굴 (eolgul) is the face, not the head."
      "w2":
        "why": "눈 (nun) is the eye, not the head."
  "ko-4761":
    "native": "Does your belly hurt?"
    "confusables":
      "w1":
        "why": "위 (wi) is the stomach, a different part from the belly."
      "w2":
        "why": "배탈 (baetal) is a stomachache, the illness, not the body part."
  "ko-4762":
    "native": "My tooth hurts."
    "confusables":
      "w1":
        "why": "치아 (chia) is a tooth too, and the word for teeth in general."
      "w2":
        "why": "입 (ip) is the mouth, which the tooth is in."
  "ko-4763":
    "native": "Is your knee all right?"
    "confusables":
      "w1":
        "why": "다리 (dari) is the whole leg, not the knee."
      "w2":
        "why": "발가락 (balgarak) is a toe, not the knee."
  "ko-4764":
    "native": "Do you have a headache?"
    "confusables":
      "w1":
        "why": "머리 (meori) is the head, not the pain."
      "w2":
        "why": "배탈 (baetal) is a stomachache, not a headache."
  "ko-4765":
    "native": "My chest hurts."
    "confusables":
      "w1":
        "why": "몸 (mom) is the whole body, not the chest."
      "w2":
        "why": "등 (deung) is the back, not the chest."
  "ko-4766":
    "native": "The skin is good."
    "confusables":
      "w1":
        "why": "뼈 (ppyeo) is bone, under the skin."
      "w2":
        "why": "몸 (mom) is the whole body, not the skin."
