"cards":
  "ko-4000":
    "native": "What is this?"
    "confusables":
      "w1":
        "why": "그것 (geugeot) is that, near the listener, not this."
      "w2":
        "why": "저것 (jeogeot) is that over there, far from you."
  "ko-4001":
    "native": "Where is this place?"
    "confusables":
      "w1":
        "why": "거기 (geogi) is there, near the listener, not here."
      "w2":
        "why": "저기 (jeogi) is over there, far from both of you."
  "ko-4002":
    "native": "Who is that person over there?"
    "confusables":
      "w1":
        "why": "그분 (geubun) is that person near the listener, not over there."
      "w2":
        "why": "이분 (ibun) is this person."
  "ko-4003":
    "native": "We are students."
    "confusables":
      "w1":
        "why": "저희 (jeohui) is the humble we, used to people you respect."
      "w2":
        "why": "사람 (saram) is one person, not we."
  "ko-4004":
    "native": "This person is the teacher."
    "confusables":
      "w1":
        "why": "그분 (geubun) is that person, not this one."
      "w2":
        "why": "저분 (jeobun) is that person over there."
  "ko-4005":
    "native": "This one, please."
    "confusables":
      "w1":
        "why": "그것 (geugeot) is that, near the listener."
      "w2":
        "why": "저것 (jeogeot) is that over there."
  "ko-4006":
    "native": "That is coffee."
    "confusables":
      "w1":
        "why": "이것 (igeot) is this, near the speaker."
      "w2":
        "why": "저것 (jeogeot) is that over there."
  "ko-4007":
    "native": "Is that over there OK?"
    "confusables":
      "w1":
        "why": "그것 (geugeot) is that near the listener."
      "w2":
        "why": "이것 (igeot) is this, near the speaker."
