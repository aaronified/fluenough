description: "Eight sentences about yourself to put in order, each in the polite -요 (-yo) style. Not yet checked by a Korean speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "ko-4120":
    "native": "I am an office worker."
    "confusables":
      "w1":
        "why": "주부 (jubu) is housewife, not office worker."
      "w2":
        "why": "직업 (jigeop) is job in general, not a person."
  "ko-4121":
    "native": "Are you Korean?"
    "confusables":
      "w1":
        "why": "나라 (nara) is country, not person."
      "w2":
        "why": "고향 (gohyang) is hometown."
  "ko-4122":
    "native": "Where is your hometown?"
    "confusables":
      "w1":
        "why": "나라 (nara) is country, not hometown."
      "w2":
        "why": "한국 (hanguk) is Korea."
  "ko-4123":
    "native": "What is your age?"
    "confusables":
      "w1":
        "why": "직업 (jigeop) is job, not age."
      "w2":
        "why": "사람 (saram) is person."
  "ko-4124":
    "native": "Where do you live?"
    "confusables":
      "w1":
        "why": "있다 (itda) is to be in a place, not to live."
      "w2":
        "why": "고향 (gohyang) is hometown, the place you come from."
  "ko-4125":
    "native": "There is no business card."
    "confusables":
      "w1":
        "why": "아니다 (anida) is to not be something."
      "w2":
        "why": "있다 (itda) is to have or to be in a place."
  "ko-4126":
    "native": "I am not a student."
    "confusables":
      "w1":
        "why": "없다 (eopda) is to have none."
      "w2":
        "why": "있다 (itda) is to have or to be in a place."
  "ko-4127":
    "native": "What is a housewife?"
    "confusables":
      "w1":
        "why": "직업 (jigeop) is job, not a kind of person."
      "w2":
        "why": "사람 (saram) is person."
