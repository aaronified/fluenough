"cards":
  "ko-4880":
    "native": "Where is the police station?"
    "confusables":
      "w1":
        "why": "경찰 (gyeongchal) is the police, not the station."
      "w2":
        "why": "병원 (byeongwon) is a hospital, not a police station."
  "ko-4881":
    "native": "I go to the hospital."
    "confusables":
      "w1":
        "why": "응급 (eunggeup) is an emergency, not a place to go."
      "w2":
        "why": "응급실 (eunggeupsil) is the emergency room, which is a part of a hospital."
  "ko-4882":
    "native": "Where is the emergency room?"
    "confusables":
      "w1":
        "why": "병원 (byeongwon) is a hospital in general."
      "w2":
        "why": "응급처치 (eunggeupcheochi) is first aid, not a room."
  "ko-4883":
    "native": "Do you make a call?"
    "confusables":
      "w1":
        "why": "번호 (beonho) is a number, not a call."
      "w2":
        "why": "신고 (singo) is a report, not a phone call."
  "ko-4884":
    "native": "Is there an accident?"
    "confusables":
      "w1":
        "why": "화재 (hwajae) is a fire as a disaster."
      "w2":
        "why": "위험 (wiheom) is danger, not an accident."
  "ko-4885":
    "native": "Please help me."
    "confusables":
      "w1":
        "why": "신고 (singo) is a report, not help."
      "w2":
        "why": "다치다 (dachida) is to get hurt, not to help."
  "ko-4886":
    "native": "Where is the pharmacy?"
    "confusables":
      "w1":
        "why": "병원 (byeongwon) is a hospital, not a pharmacy."
      "w2":
        "why": "경찰서 (gyeongchalseo) is a police station, not a pharmacy."
