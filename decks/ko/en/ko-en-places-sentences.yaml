"name": "Places in town in sentences"
"license": "CC-BY-SA-4.0"
"description": "Nine sentences that ask where a place is or say what is in it, with the places of this unit, in the polite -요 (-yo) style. Not yet checked by a Korean speaker: please report any mistake."
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ko-4800":
    "native": "Where is that bank?"
    "confusables":
      "w1":
        "why": "병원 (byeongwon) is a hospital, not a bank."
      "w2":
        "why": "우체국 (ucheguk) is a post office, not a bank."
  "ko-4801":
    "native": "Is the student in the library?"
    "confusables":
      "w1":
        "why": "학교 (hakgyo) is a school, not a library."
      "w2":
        "why": "서점 (seojeom) is a bookshop, where books are sold."
  "ko-4802":
    "native": "Does the teacher go to the hospital?"
    "confusables":
      "w1":
        "why": "약국 (yakguk) is a pharmacy, where medicine is bought."
      "w2":
        "why": "경찰서 (gyeongchalseo) is a police station."
  "ko-4803":
    "native": "Is there coffee in the café?"
    "confusables":
      "w1":
        "why": "식당 (sikdang) is a restaurant, for meals."
      "w2":
        "why": "편의점 (pyeonuijeom) is a convenience store."
  "ko-4804":
    "native": "Is there a room in the hotel?"
    "confusables":
      "w1":
        "why": "사무실 (samusil) is an office, for work."
      "w2":
        "why": "회사 (hoesa) is a company."
  "ko-4805":
    "native": "Is there bread in the department store?"
    "confusables":
      "w1":
        "why": "마트 (mateu) is a mart, a shop for food and goods."
      "w2":
        "why": "슈퍼마켓 (syupeomaket) is a supermarket."
  "ko-4806":
    "native": "Is there a student on the beach?"
    "confusables":
      "w1":
        "why": "바다 (bada) is the sea, not the beach."
      "w2":
        "why": "강 (gang) is a river."
  "ko-4807":
    "native": "Is there a car in the car park?"
    "confusables":
      "w1":
        "why": "공원 (gongwon) is a park, not a car park."
      "w2":
        "why": "학교 (hakgyo) is a school."
  "ko-4808":
    "native": "Where is this city?"
    "confusables":
      "w1":
        "why": "동네 (dongne) is a neighbourhood, smaller than a city."
      "w2":
        "why": "시내 (sinae) is the downtown of a city."
