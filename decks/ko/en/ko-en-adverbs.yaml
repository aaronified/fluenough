schema: 1
id: "ko-en-adverbs"
kind: "layer"
core: "ko-adverbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Adverbs"
license: "CC-BY-SA-4.0"
description: "Thirty adverbs of degree, time, frequency and manner, each with a polite example. Not yet checked by a Korean speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
cards:
  "ko-1700":
    "native": "very"
    "examples":
      "매우 좋아요.":
        "native": "It is very good."
        "bases":
          "매우": "very"
          "좋아요": "to be good (polite)"
  "ko-1701":
    "native": "very"
    "examples":
      "아주 작아요.":
        "native": "It is very small."
        "bases":
          "아주": "very"
          "작아요": "to be small (polite)"
  "ko-1702":
    "native": "really"
    "examples":
      "정말 좋아요?":
        "native": "Is it really good?"
        "bases":
          "정말": "really"
          "좋아요": "to be good (polite)"
  "ko-1703":
    "native": "too"
    "examples":
      "너무 많아요.":
        "native": "There are too many."
        "bases":
          "너무": "too"
          "많아요": "to be many (polite)"
  "ko-1704":
    "native": "a lot"
    "examples":
      "물을 많이 마셔요.":
        "native": "I drink a lot of water."
        "bases":
          "많이": "a lot"
          "마셔요": "to drink (polite)"
  "ko-1705":
    "native": "a little"
    "examples":
      "조금 싸요.":
        "native": "It is a little cheap."
        "bases":
          "조금": "a little"
          "싸요": "to be cheap (polite)"
  "ko-1706":
    "native": "quickly"
    "notes":
      "n1": "빨리 (ppalli) on its own also urges someone to hurry, so 빨리 (ppalli) 가요 (ppalli gayo) can mean 'hurry up'."
    "examples":
      "빨리 가요.":
        "native": "Go quickly."
        "bases":
          "빨리": "quickly"
          "가요": "to go (polite)"
  "ko-1707":
    "native": "slowly"
    "examples":
      "천천히 말해요.":
        "native": "I speak slowly."
        "bases":
          "천천히": "slowly"
          "말해요": "to speak (polite)"
  "ko-1708":
    "native": "always"
    "examples":
      "저는 항상 가요.":
        "native": "I always go."
        "bases":
          "항상": "always"
          "가요": "to go (polite)"
  "ko-1709":
    "native": "often"
    "examples":
      "친구는 자주 와요.":
        "native": "A friend often comes."
        "bases":
          "자주": "often"
          "와요": "to come (polite)"
  "ko-1710":
    "native": "sometimes"
    "notes":
      "n1": "가끔 (gakkeum) and 때때로 (ttaettaero) both mean sometimes, and 가끔 (gakkeum) is used for something that happens now and then."
    "examples":
      "가끔 자요.":
        "native": "I sleep sometimes."
        "bases":
          "가끔": "sometimes"
          "자요": "to sleep (polite)"
  "ko-1711":
    "native": "sometimes"
    "notes":
      "n1": "때때로 (ttaettaero) and 가끔 (gakkeum) both mean sometimes; the two are interchangeable here."
    "examples":
      "때때로 쉬어요.":
        "native": "I rest sometimes."
        "bases":
          "때때로": "sometimes"
          "쉬어요": "to rest (polite)"
  "ko-1712":
    "native": "not at all"
    "examples":
      "전혀 없어요.":
        "native": "There is none at all."
        "bases":
          "전혀": "not at all"
          "없어요": "to be absent, not to be there (polite)"
  "ko-1713":
    "native": "never"
    "notes":
      "n1": "절대 (jeoldae) with 안 (an) before a verb means never, as in 절대 (jeoldae) 안 (an) 가요 (jeoldae an gayo)."
    "examples":
      "절대 안 가요.":
        "native": "I never go."
        "bases":
          "절대": "never"
          "안": "not (before a verb)"
          "가요": "to go (polite)"
  "ko-1714":
    "native": "again, also"
    "examples":
      "또 와요.":
        "native": "Come again."
        "bases":
          "또": "again, also"
          "와요": "to come (polite)"
  "ko-1715":
    "native": "again"
    "examples":
      "다시 말해 주세요.":
        "native": "Please say it again."
        "bases":
          "다시": "again"
          "말해": "to say"
          "주세요": "to give, please (polite request)"
  "ko-1716":
    "native": "still, yet"
    "examples":
      "아직 안 가요.":
        "native": "I am still not going."
        "bases":
          "아직": "still, yet"
          "안": "not (before a verb)"
          "가요": "to go (polite)"
  "ko-1717":
    "native": "already"
    "examples":
      "벌써 가요?":
        "native": "Are you going already?"
        "bases":
          "벌써": "already"
          "가요": "to go (polite)"
  "ko-1718":
    "native": "already"
    "examples":
      "이미 있어요.":
        "native": "It is already here."
        "bases":
          "이미": "already"
          "있어요": "to be here, to have (polite)"
  "ko-1719":
    "native": "soon"
    "examples":
      "곧 가요.":
        "native": "I will go soon."
        "bases":
          "곧": "soon"
          "가요": "to go (polite)"
  "ko-1720":
    "native": "together"
    "examples":
      "함께 가요.":
        "native": "Let's go together."
        "bases":
          "함께": "together"
          "가요": "to go (polite)"
  "ko-1721":
    "native": "together"
    "notes":
      "n1": "같이 (gachi) and 함께 (hamkke) both mean together."
    "examples":
      "같이 먹어요.":
        "native": "Let's eat together."
        "bases":
          "같이": "together"
          "먹어요": "to eat (polite)"
  "ko-1722":
    "native": "well"
    "examples":
      "잘 자요.":
        "native": "I sleep well."
        "bases":
          "잘": "well"
          "자요": "to sleep (polite)"
  "ko-1723":
    "native": "more"
    "examples":
      "더 주세요.":
        "native": "Please give more."
        "bases":
          "더": "more"
          "주세요": "to give, please (polite request)"
  "ko-1724":
    "native": "less"
    "examples":
      "덜 주세요.":
        "native": "Please give less."
        "bases":
          "덜": "less"
          "주세요": "to give, please (polite request)"
  "ko-1725":
    "native": "most"
    "notes":
      "n1": "가장 (gajang) and 제일 (jeil) both put 'most' before an adjective, as in 가장 (gajang) 좋아요 (gajang joayo), it is the best."
    "examples":
      "가장 좋아요.":
        "native": "It is the best."
        "bases":
          "가장": "most"
          "좋아요": "to be good (polite)"
  "ko-1726":
    "native": "most"
    "notes":
      "n1": "제일 (jeil) and 가장 (gajang) both put 'most' before an adjective, as in 제일 (jeil) 좋아요 (jeil joayo), it is the best."
    "examples":
      "제일 좋아요.":
        "native": "It is the best."
        "bases":
          "제일": "most"
          "좋아요": "to be good (polite)"
  "ko-1727":
    "native": "perhaps"
    "examples":
      "아마 좋아요.":
        "native": "Perhaps it is good."
        "bases":
          "아마": "perhaps"
          "좋아요": "to be good (polite)"
  "ko-1728":
    "native": "as expected, also"
    "examples":
      "역시 좋아요.":
        "native": "As expected, it is good."
        "bases":
          "역시": "as expected, also"
          "좋아요": "to be good (polite)"
  "ko-1729":
    "native": "simply"
    "examples":
      "그냥 가요.":
        "native": "Just go."
        "bases":
          "그냥": "simply"
          "가요": "to go (polite)"
