name: "-을까요 (-eulkkayo) and -ㄹ까요 (-lkkayo): shall we?"
description: "Thirteen verbs with the question ending -ㄹ까요 (-lkkayo) and -을까요 (-eulkkayo), and the question after 우리 (uri), 'we'. Sources: the en.wiktionary.org entries -을까 (-eulkka) (example 음악이나 들을까요 (eumagina deureulkkayo)) and -ㄹ까 (-lkka), and the conjugation table of each verb (the future form is copied from it). Not yet checked by a Korean speaker: please report any mistake."
