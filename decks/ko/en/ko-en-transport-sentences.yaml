"name": "Transport sentences"
"license": "CC-BY-SA-4.0"
"description": "Nine sentences on getting around, built with the transport words, to put in order, each in the polite -요 (-yo) style. Not yet checked by a Korean speaker: please report any mistake."
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ko-4680":
    "native": "Where is the bus stop?"
    "confusables":
      "w1":
        "why": "언제 (eonje) asks when, not where."
      "w2":
        "why": "뭐 (mwo) asks what, not where."
  "ko-4681":
    "native": "I take the subway."
    "confusables":
      "w1":
        "why": "내리다 (naerida) means get off, not get on."
      "w2":
        "why": "갈아타다 (garatada) means change, not get on."
  "ko-4682":
    "native": "When is the departure?"
    "confusables":
      "w1":
        "why": "도착 (dochak) is arrival, the other end of a journey."
      "w2":
        "why": "어디 (eodi) asks where, not when."
  "ko-4683":
    "native": "Where is the arrival station?"
    "confusables":
      "w1":
        "why": "출발 (chulbal) is departure, the start of a journey."
      "w2":
        "why": "정류장 (jeongnyujang) is a bus stop, not a station."
  "ko-4684":
    "native": "There is no taxi."
    "confusables":
      "w1":
        "why": "버스 (beoseu) is a bus, not a taxi."
      "w2":
        "why": "기차 (gicha) is a train, not a taxi."
  "ko-4685":
    "native": "How much is the fare?"
    "confusables":
      "w1":
        "why": "몇 (myeot) asks how many, not how much money."
      "w2":
        "why": "어때요 (eottaeyo) asks how something is, not its price."
  "ko-4686":
    "native": "The bicycle is cheap."
    "confusables":
      "w1":
        "why": "자동차 (jadongcha) is a car, not a bicycle."
      "w2":
        "why": "오토바이 (otobai) is a motorcycle, not a bicycle."
  "ko-4687":
    "native": "A transport card, please."
    "confusables":
      "w1":
        "why": "표 (pyo) is a ticket, not a transport card."
      "w2":
        "why": "교통 (gyotong) is transport in general, not a card."
  "ko-4688":
    "native": "I walk along the road."
    "confusables":
      "w1":
        "why": "타다 (tada) means to ride, not to walk."
      "w2":
        "why": "도로 (doro) is a road for vehicles."
