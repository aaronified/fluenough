"cards":
  "ko-4080":
    "native": "There are six students."
    "confusables":
      "w1":
        "why": "다섯 (daseot) is five, not six."
      "w2":
        "why": "일곱 (ilgop) is seven, not six."
  "ko-4081":
    "native": "Are there fifteen friends?"
    "confusables":
      "w1":
        "why": "열 (yeol) is ten, not fifteen."
      "w2":
        "why": "다섯 (daseot) is five, not fifteen."
  "ko-4082":
    "native": "There are nine teachers."
    "confusables":
      "w1":
        "why": "여덟 (yeodeolp) is eight, not nine."
      "w2":
        "why": "열 (yeol) is ten, not nine."
  "ko-4083":
    "native": "There are four men."
    "confusables":
      "w1":
        "why": "셋 (set) is three, not four."
      "w2":
        "why": "둘 (dul) is two, not four."
  "ko-4084":
    "native": "There are twenty friends."
    "confusables":
      "w1":
        "why": "열 (yeol) is ten, not twenty."
      "w2":
        "why": "스무 (seumu) is twenty before a counter, not on its own."
  "ko-4085":
    "native": "There are three children."
    "confusables":
      "w1":
        "why": "둘 (dul) is two, not three."
      "w2":
        "why": "넷 (net) is four, not three."
  "ko-4086":
    "native": "There are five women."
    "confusables":
      "w1":
        "why": "여섯 (yeoseot) is six, not five."
      "w2":
        "why": "넷 (net) is four, not five."
  "ko-4087":
    "native": "There are thirteen students."
    "confusables":
      "w1":
        "why": "열다섯 (yeoldaseot) is fifteen, not thirteen."
      "w2":
        "why": "열 (yeol) is ten, not thirteen."
