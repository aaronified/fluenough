kind: "layer"
core: "ko-hangul-batchim"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Final consonants"
license: "CC-BY-SA-4.0"
description: "The seven sounds a final consonant (batchim) can have, each heard at the end of a syllable: ㄱ (k), ㄴ (n), ㄹ (l), ㅁ (m), ㅂ (p) and ㅇ (ng). A final ㄲ (kk) or ㅋ (k) is said as ㄱ (k), and a final ㅍ (p) as ㅂ (p): each becomes a stop that is closed and gives no puff of breath. The letter ㄷ (d) is not in this unit. Sources: the en.wikipedia.org pages 'Korean phonology' (the final-consonant mapping, the lateral ㄹ and the voiced medial form) and 'Hangul' (the silent initial ㅇ and 악마 (angma) said as 앙마 (angma)), and the en.wiktionary.org page 'Appendix:Korean pronunciation' (the seven final sounds). Not yet checked by a Korean speaker: please report any mistake."
tags: ["unreviewed"]
"cards":
  "ko-1000":
    "native": "ak, the 'ck' of 'back' said with no puff of breath and no burst after the k"
    "notes":
      "n1": "악 (ak) ends in ㄱ (g), which at the end of a syllable is an unreleased k. The finals ㄲ (kk) and ㅋ (k) are said the same way, so a learner needs only this one sound at the end."
      "n2": "Before a nasal the final ㄱ (g) turns into ng: 악마 (angma) is said as 앙마 (angma), though the spelling stays 악마 (angma). The en.wikipedia.org 'Hangul' article gives this example."
      "n3": "A final consonant moves into a following vowel: 한국어 (hangugeo), where the final ㄱ of 국 (guk) is said at the start of the next syllable, 어 (eo), and the reading shows it."
  "ko-1001":
    "native": "an, the 'n' of 'sun' at the end of the syllable, then the 'a' of 'father'"
    "notes":
      "n1": "안 (an) ends in ㄴ (n). It is the same nasal as the ㄴ (n) at the start of 나 (na), and it stays a nasal at the end of a syllable."
  "ko-1003":
    "native": "al, the 'l' of 'bowl' with the tongue tip on the ridge behind the upper teeth"
    "notes":
      "n1": "알 (al) ends in ㄹ (r). At the end of a syllable ㄹ (r) is a lateral: the air goes out at the sides of the tongue, as the 'l' of 'bowl'. It is not the tapped r of 라 (ra) between vowels."
  "ko-1004":
    "native": "am, the 'm' of 'sum' with the lips closed at the end of the syllable"
    "notes":
      "n1": "암 (am) ends in ㅁ (m), the same sound as the ㅁ (m) at the start of 마 (ma). The lips close for it and the sound comes through the nose."
  "ko-1005":
    "native": "ap, the 'p' of 'top' with the lips closed and no puff of breath after it"
    "notes":
      "n1": "압 (ap) ends in ㅂ (b), which at the end of a syllable is an unreleased p. The final ㅍ (p) is said the same way."
  "ko-1006":
    "native": "ang, the 'ng' of 'sing', said through the nose with no 'g' after it"
    "notes":
      "n1": "앙 (ang) ends in ㅇ (ng). The same letter at the start of a syllable is silent, as in 아 (a), and it is written only as a place-holder."
