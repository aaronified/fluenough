"schema": 1
"id": "ko-en-help"
"kind": "layer"
"core": "ko-help"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Help and emergencies"
"license": "CC-BY-SA-4.0"
"description": "Words for asking for help when lost, and the places and things for help: police, hospital, emergency room, fire, pharmacy. The emergency numbers are not taught here. Not yet checked by a Korean speaker: please report any mistake."
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ko-3060":
    "native": "help; assistance."
    "examples":
      "도움 주세요.":
        "native": "Please help."
        "bases":
          "도움": "help"
          "주세요": "please give (polite request)"
  "ko-3061":
    "native": "police."
    "notes":
      "n1": "경찰 (gyeongchal) means the police. Its second sense, a police officer, is not taught on this card."
    "examples":
      "경찰은 어디예요?":
        "native": "Where are the police?"
        "bases":
          "경찰은": "police, with the topic particle 은 (eun)"
      "저는 경찰이 아니에요.":
        "native": "I am not a police officer."
        "bases":
          "경찰이": "police, with the subject particle 이 (i)"
          "아니에요": "is not (polite)"
  "ko-3064":
    "native": "emergency."
    "examples":
      "응급이에요!":
        "native": "It is an emergency!"
        "bases":
          "응급이에요": "emergency, with the copula 이에요 (ieyo)"
      "응급실이 어디예요?":
        "native": "Where is the emergency room?"
  "ko-3065":
    "native": "emergency room."
    "examples":
      "응급실이 어디예요?":
        "native": "Where is the emergency room?"
        "bases":
          "응급실이": "emergency room, with the subject particle 이 (i)"
      "응급실에 가요.":
        "native": "I go to the emergency room."
        "bases":
          "응급실에": "emergency room, with the particle 에 (e) for a place"
          "가요": "go (polite)"
  "ko-3066":
    "native": "first aid."
    "examples":
      "응급처치가 있어요?":
        "native": "Is there first aid?"
        "bases":
          "응급처치가": "first aid, with the subject particle 가 (ga)"
          "있어요": "there is, to have (polite)"
      "응급처치를 해요.":
        "native": "I give first aid."
        "bases":
          "응급처치를": "first aid, with the object particle 를 (reul)"
          "해요": "do (polite)"
  "ko-3067":
    "native": "ambulance."
    "examples":
      "구급차가 어디예요?":
        "native": "Where is the ambulance?"
        "bases":
          "구급차가": "ambulance, with the subject particle 가 (ga)"
      "구급차가 있어요?":
        "native": "Is there an ambulance?"
        "bases":
          "구급차가": "ambulance, with the subject particle 가 (ga)"
          "있어요": "there is, to have (polite)"
  "ko-3068":
    "native": "fire engine, firetruck."
    "examples":
      "소방차가 있어요?":
        "native": "Is there a fire engine?"
        "bases":
          "소방차가": "fire engine, with the subject particle 가 (ga)"
          "있어요": "there is, to have (polite)"
      "소방차가 어디예요?":
        "native": "Where is the fire engine?"
        "bases":
          "소방차가": "fire engine, firetruck, with the subject particle 가 (ga)"
  "ko-3069":
    "native": "fire station."
    "examples":
      "소방서가 어디예요?":
        "native": "Where is the fire station?"
        "bases":
          "소방서가": "fire station, with the subject particle 가 (ga)"
      "소방서에 가요.":
        "native": "I go to the fire station."
        "bases":
          "소방서에": "fire station, with the particle 에 (e) for a place"
          "가요": "go (polite)"
  "ko-3070":
    "native": "danger."
    "notes":
      "n1": "위험 (wiheom) is the noun, danger. The adjective is 위험하다 (wiheomhada), dangerous, and 위험해요 (wiheomhaeyo) is its polite form."
    "examples":
      "위험이 있어요?":
        "native": "Is there danger?"
        "bases":
          "위험이": "danger, with the subject particle 이 (i)"
          "있어요": "there is, to have (polite)"
      "위험해요.":
        "native": "It is dangerous."
  "ko-3071":
    "native": "to be dangerous."
    "examples":
      "위험해요.":
        "native": "It is dangerous."
        "bases":
          "위험해요": "dangerous (polite)"
      "길이 위험해요?":
        "native": "Is the road dangerous?"
        "bases":
          "위험해요": "to be dangerous (polite)"
  "ko-3072":
    "native": "to lose."
    "examples":
      "표를 잃어버려요?":
        "native": "Do you lose the ticket?"
        "bases":
          "잃어버려요": "lose (polite)"
      "저는 표를 잃어버려요.":
        "native": "I lose the ticket."
        "bases":
          "잃어버려요": "to lose (polite)"
  "ko-3073":
    "native": "telephone, phone."
    "examples":
      "전화가 있어요?":
        "native": "Do you have a phone?"
        "bases":
          "전화가": "phone, with the subject particle 가 (ga)"
          "있어요": "there is, to have (polite)"
      "전화를 해요.":
        "native": "I make a phone call."
        "bases":
          "전화를": "phone, with the object particle 를 (reul)"
          "해요": "do (polite)"
  "ko-3074":
    "native": "number."
    "examples":
      "번호가 뭐예요?":
        "native": "What is the number?"
        "bases":
          "번호가": "number, with the subject particle 가 (ga)"
      "번호 주세요.":
        "native": "A number, please."
        "bases":
          "번호": "number"
          "주세요": "please give (polite request)"
  "ko-3076":
    "native": "report, declaration."
    "notes":
      "n1": "신고 (singo) is the noun, report. The verb is 신고하다 (singohada), to report."
    "examples":
      "경찰에 신고해요.":
        "native": "I report it to the police."
      "신고가 있어요?":
        "native": "Is there a report?"
        "bases":
          "신고가": "report, with the subject particle 가 (ga)"
          "있어요": "there is, to have (polite)"
  "ko-3077":
    "native": "to report, to notify."
    "examples":
      "경찰에 신고해요.":
        "native": "I report it to the police."
        "bases":
          "신고해요": "report (polite)"
      "사고를 신고해요.":
        "native": "I report an accident."
        "bases":
          "신고해요": "to report, to notify (polite)"
  "ko-3078":
    "native": "to get hurt, to be injured."
    "examples":
      "머리를 다쳐요?":
        "native": "Do you hurt your head?"
        "bases":
          "다쳐요": "get hurt (polite)"
      "발을 다쳐요.":
        "native": "I hurt my foot."
        "bases":
          "다쳐요": "to get hurt, to be injured (polite)"
  "ko-3079":
    "native": "accident."
    "examples":
      "사고가 있어요?":
        "native": "Is there an accident?"
        "bases":
          "사고가": "accident, with the subject particle 가 (ga)"
          "있어요": "there is, to have (polite)"
      "사고가 없어요.":
        "native": "There is no accident."
        "bases":
          "사고가": "accident, with the subject particle 가 (ga)"
          "없어요": "there is not, to not have (polite)"
  "ko-3080":
    "native": "fire, as a disaster."
    "examples":
      "화재가 있어요?":
        "native": "Is there a fire?"
        "bases":
          "화재가": "fire, with the subject particle 가 (ga)"
          "있어요": "there is, to have (polite)"
      "화재가 없어요.":
        "native": "There is no fire."
        "bases":
          "화재가": "fire, as a disaster, with the subject particle 가 (ga)"
          "없어요": "there is not, to not have (polite)"
  "ko-3081":
    "native": "safety."
    "examples":
      "안전이 어때요?":
        "native": "How is the safety?"
        "bases":
          "안전이": "safety, with the subject particle 이 (i)"
      "안전이 좋아요.":
        "native": "The safety is good."
        "bases":
          "안전이": "safety, with the subject particle 이 (i)"