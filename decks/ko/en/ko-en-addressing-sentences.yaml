native: { code: "en", iso639_3: "eng", name: "English" }
name: "Addressing in sentences"
license: "CC-BY-SA-4.0"
description: "Six short sentences with the addressing words, each in the polite -요 (-yo) style, to put in order. Not yet checked by a Korean speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "ko-0108":
    "native": "Mr. Park is a professor."
    "confusables":
      "w1":
        "why": "사장님 (sajangnim) is a boss, not a professor."
      "w2":
        "why": "의사 (uisa) is a doctor."
  "ko-0109":
    "native": "I have a business card."
    "confusables":
      "w1":
        "why": "커피 (keopi) is coffee, not a business card."
      "w2":
        "why": "물 (mul) is water, not a business card."
  "ko-0110":
    "native": "Mr. Minsu is an office worker."
    "confusables":
      "w1":
        "why": "의사 (uisa) is a doctor, not an office worker."
      "w2":
        "why": "교수님 (gyosunim) is a professor, not an office worker."
  "ko-0111":
    "native": "Who is the teacher's friend?"
    "confusables":
      "w1":
        "why": "뭐 (mwo) asks what, not who."
      "w2":
        "why": "어디 (eodi) asks where, not who."
  "ko-0112":
    "native": "The man is a middle-aged man."
    "confusables":
      "w1":
        "why": "아줌마 (ajumma) is a middle-aged woman, not a man."
      "w2":
        "why": "여자 (yeoja) is a woman, not a man."
  "ko-0113":
    "native": "(Do you) meet the boss?"
    "confusables":
      "w1":
        "why": "교수님 (gyosunim) is a professor, not a boss."
      "w2":
        "why": "인사 (insa) is a greeting, not a meeting."
