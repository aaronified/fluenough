"cards":
  "ko-2900":
    "native": "school"
    "notes":
      "n1": "The general word for a school. A university is 대학교 (daehakgyo)."
    "examples":
      "학교가 어디예요?":
        "native": "Where is the school?"
        "bases":
          "학교가": "school, with the subject particle 가 (ga)"
      "저는 학교에 가요.":
        "native": "I go to the school."
        "bases":
          "학교에": "school, with the place particle 에 (e)"
          "가요": "go, polite form"
