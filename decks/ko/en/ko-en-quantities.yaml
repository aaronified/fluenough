schema: 1
id: "ko-en-quantities"
kind: "layer"
core: "ko-quantities"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How much and how many"
license: "CC-BY-SA-4.0"
description: "Nineteen words for how much and how many: amounts, parts, all and each. The question word 몇 (myeot) is taught with the question words. Not yet checked by a Korean speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
cards:
  "ko-1780":
    "native": "to be many, to be much"
    "notes":
      "n1": "많다 (manta) is the adjective; 많이 (mani) is the adverb from it, as in 많이 (mani) 마셔요 (mani masyeoyo), drink a lot."
    "examples":
      "물이 많아요.":
        "native": "There is a lot of water."
        "bases":
          "많아요": "to be many, to be much (polite)"
  "ko-1781":
    "native": "to be few, to be little"
    "examples":
      "커피가 적어요.":
        "native": "There is little coffee."
        "bases":
          "적어요": "to be few, to be little (polite)"
  "ko-1782":
    "native": "a little"
    "examples":
      "약간 싸요.":
        "native": "It is a little cheap."
        "bases":
          "약간": "a little"
          "싸요": "to be cheap (polite)"
  "ko-1783":
    "native": "several"
    "examples":
      "여러 학생이 있어요.":
        "native": "There are several students."
        "bases":
          "여러": "several"
          "있어요": "to be here, to have (polite)"
  "ko-1784":
    "native": "everything"
    "examples":
      "전부 얼마예요?":
        "native": "How much is everything?"
        "bases":
          "전부": "everything"
  "ko-1785":
    "native": "half"
    "notes":
      "n1": "반 (ban) means half. Please check whether any other sense of 반 (ban) needs a separate card."
    "examples":
      "커피 반 주세요.":
        "native": "Half a coffee, please."
        "bases":
          "반": "half"
          "주세요": "to give, please (polite request)"
  "ko-1786":
    "native": "half"
    "examples":
      "절반 주세요.":
        "native": "Half, please."
        "bases":
          "절반": "half"
          "주세요": "to give, please (polite request)"
  "ko-1787":
    "native": "the rest"
    "examples":
      "나머지는 얼마예요?":
        "native": "How much is the rest?"
        "bases":
          "나머지는": "the rest, with the topic particle 는 (neun)"
  "ko-1788":
    "native": "to be enough"
    "examples":
      "충분해요.":
        "native": "It is enough."
        "bases":
          "충분해요": "to be enough (polite)"
  "ko-1789":
    "native": "most"
    "examples":
      "대부분 좋아요.":
        "native": "Most are good."
        "bases":
          "대부분": "most"
          "좋아요": "to be good (polite)"
  "ko-1790":
    "native": "the whole"
    "examples":
      "전체 얼마예요?":
        "native": "How much is the whole?"
        "bases":
          "전체": "the whole"
  "ko-1791":
    "native": "all, every"
    "examples":
      "모든 학생이 있어요.":
        "native": "All the students are here."
        "bases":
          "모든": "all, every"
          "있어요": "to be here, to have (polite)"
  "ko-1792":
    "native": "each"
    "examples":
      "각각 얼마예요?":
        "native": "How much is each?"
        "bases":
          "각각": "each"
  "ko-1793":
    "native": "part"
    "examples":
      "일부 좋아요.":
        "native": "Some of it is good."
        "bases":
          "일부": "part, some"
          "좋아요": "to be good (polite)"
  "ko-1794":
    "native": "bit by bit"
    "examples":
      "조금씩 마셔요.":
        "native": "I drink a little at a time."
        "bases":
          "조금씩": "bit by bit"
          "마셔요": "to drink (polite)"
  "ko-1795":
    "native": "full"
    "examples":
      "물이 가득 있어요.":
        "native": "There is plenty of water."
        "bases":
          "있어요": "be, exist, polite form"
  "ko-1796":
    "native": "two or three"
    "notes":
      "n1": "두세 (duse) and 한두 (handu) go before a noun, not after it."
    "examples": {}
  "ko-1797":
    "native": "one or two"
    "examples": {}
  "ko-1798":
    "native": "all"
    "examples":
      "모두 좋아요.":
        "native": "All of them are good."
        "bases":
          "모두": "all"
          "좋아요": "to be good (polite)"
