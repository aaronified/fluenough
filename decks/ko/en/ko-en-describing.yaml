"schema": 1
"id": "ko-en-describing"
"kind": "layer"
"core": "ko-describing"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Describing things and feelings"
"license": "CC-BY-SA-4.0"
"description": "Thirty-four adjectives for size, temperature, taste, feeling and looks, each with the polite -요 (-yo) form in its example. Not yet checked by a Korean speaker: please report any mistake."
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ko-1860":
    "native": "be big, large"
    "notes":
      "n1": "크다 (keuda) is irregular: before a vowel ending the stem changes, so the polite form is a contraction, 커요 (keoyo). It is big in size and in scope, as English big is. No example is given for it, as its polite form changes the first letter of the stem."
    "examples": {}
  "ko-1861":
    "native": "be small"
    "notes":
      "n1": "The opposite is 크다 (keuda), big. Used for size, as in a small room or a small bread."
    "examples":
      "이 방은 작아요.":
        "native": "This room is small."
        "bases":
          "작아요": "small, polite form"
      "이 빵은 작아요.":
        "native": "This bread is small."
        "bases":
          "작아요": "small, polite form"
  "ko-1862":
    "native": "be good"
    "notes":
      "n1": "좋아요 (joayo) is also said alone to agree, as in the first words: okay, good. The dictionary form is 좋다 (jota)."
    "examples":
      "이 커피는 좋아요.":
        "native": "This coffee is good."
        "bases":
          "좋아요": "good, polite form"
      "커피가 좋아요.":
        "native": "The coffee is good."
        "bases":
          "좋아요": "good, polite form"
  "ko-1863":
    "native": "be bad"
    "notes":
      "n1": "나쁘다 (nappeuda) is irregular: the 으 (eu) drops before 아 (a) or 어 (eo), so the polite form is 나빠요 (nappayo)."
    "examples":
      "이 빵은 나빠요.":
        "native": "This bread is bad."
        "bases":
          "나빠요": "bad, polite form"
      "이 차는 나빠요?":
        "native": "Is this car bad?"
        "bases":
          "나빠요": "bad, polite form"
  "ko-1864":
    "native": "be new"
    "notes":
      "n1": "새롭다 (saeropda) is irregular: the ㅂ (p) turns into 우 (u) and then 워 (wo) before the -요 (yo) ending, so the polite form is 새로워요 (saerowoyo)."
    "examples":
      "이 방은 새로워요.":
        "native": "This room is new."
        "bases":
          "새로워요": "new, polite form"
      "이 차는 새로워요.":
        "native": "This car is new."
        "bases":
          "새로워요": "new, polite form"
  "ko-1865":
    "native": "be worn out, old"
    "notes":
      "n1": "Said of a thing that has worn out with age or use, as a car or a bread that has gone stale."
    "examples":
      "이 차는 낡아요.":
        "native": "This car is worn out."
        "bases":
          "낡아요": "worn out, polite form"
  "ko-1866":
    "native": "have been around a long time, be old"
    "notes":
      "n1": "In speech and writing 되어요 (doeeoyo) is contracted to 돼요 (dwaeyo), so the polite form is 오래돼요 (oraedwaeyo)."
    "examples":
      "이 차는 오래돼요.":
        "native": "This car is old."
        "bases":
          "오래돼요": "old, polite form"
  "ko-1867":
    "native": "be hot to the touch"
    "notes":
      "n1": "뜨겁다 (tteugeopda) is irregular: the ㅂ (p) turns into 워 (wo) before the -어요 (eoyo) ending, so the polite form is 뜨거워요 (tteugeowoyo)."
    "examples":
      "커피가 뜨거워요.":
        "native": "The coffee is hot."
        "bases":
          "뜨거워요": "hot, polite form"
      "물이 뜨거워요.":
        "native": "The water is hot."
        "bases":
          "뜨거워요": "hot, polite form"
  "ko-1868":
    "native": "be cold to the touch"
    "notes":
      "n1": "차갑다 (chagapda) is irregular: the ㅂ (p) turns into 워 (wo) before the -어요 (eoyo) ending, so the polite form is 차가워요 (chagawoyo)."
    "examples":
      "이 물은 차가워요.":
        "native": "This water is cold."
        "bases":
          "차가워요": "cold, polite form"
      "이 커피는 차가워요.":
        "native": "This coffee is cold."
        "bases":
          "차가워요": "cold, polite form"
  "ko-1869":
    "native": "be warm"
    "notes":
      "n1": "Warm to the touch, or of the weather. Its opposite is 차갑다 (chagapda), cold to the touch."
    "examples":
      "이 물은 따뜻해요.":
        "native": "This water is warm."
        "bases":
          "따뜻해요": "warm, polite form"
      "커피가 따뜻해요.":
        "native": "The coffee is warm."
        "bases":
          "따뜻해요": "warm, polite form"
  "ko-1870":
    "native": "be cool, refreshing"
    "notes":
      "n1": "Said of a pleasant coolness, such as a cool drink or a breeze. For cold in general, 차갑다 (chagapda) is used."
    "examples":
      "이 물은 시원해요.":
        "native": "This water is refreshing."
        "bases":
          "시원해요": "refreshing, polite form"
      "방이 시원해요.":
        "native": "The room is cool."
        "bases":
          "시원해요": "cool, polite form"
  "ko-1871":
    "native": "be hot, of the weather or the air"
    "notes":
      "n1": "덥다 (deopda) is irregular: the ㅂ (p) turns into 워 (wo) before the -어요 (eoyo) ending, so the polite form is 더워요 (deowoyo)."
    "examples":
      "이 방은 더워요.":
        "native": "This room is hot."
        "bases":
          "더워요": "hot, polite form"
      "방이 더워요.":
        "native": "The room is hot."
        "bases":
          "더워요": "hot, polite form"
  "ko-1872":
    "native": "be cold, of the weather or the air"
    "notes":
      "n1": "춥다 (chupda) is irregular: the ㅂ (p) turns into 워 (wo) before the -어요 (eoyo) ending, so the polite form is 추워요 (chuwoyo)."
    "examples":
      "방이 추워요.":
        "native": "The room is cold."
        "bases":
          "추워요": "cold, polite form"
      "이 방은 추워요?":
        "native": "Is this room cold?"
        "bases":
          "추워요": "cold, polite form"
  "ko-1873":
    "native": "be expensive"
    "notes":
      "n1": "The opposite is 싸요 (ssayo), cheap, which is already in the deck as the polite form."
    "examples":
      "이 커피는 비싸요.":
        "native": "This coffee is expensive."
        "bases":
          "비싸요": "expensive, polite form"
      "이 빵은 비싸요?":
        "native": "Is this bread expensive?"
        "bases":
          "비싸요": "expensive, polite form"
  "ko-1875":
    "native": "be pretty, lovely"
    "notes":
      "n1": "예쁘다 (yeppeuda) is irregular: the 으 (eu) drops before 어 (eo), so the polite form is 예뻐요 (yeppeoyo)."
    "examples":
      "이 빵은 예뻐요.":
        "native": "This bread is pretty."
        "bases":
          "예뻐요": "pretty, polite form"
      "이 방은 예뻐요.":
        "native": "This room is pretty."
        "bases":
          "예뻐요": "pretty, polite form"
  "ko-1876":
    "native": "be beautiful"
    "notes":
      "n1": "아름답다 (areumdapda) is irregular: the ㅂ (p) turns into 워 (wo) before the -어요 (eoyo) ending, so the polite form is 아름다워요 (areumdawoyo)."
    "examples":
      "이 방은 아름다워요.":
        "native": "This room is beautiful."
        "bases":
          "아름다워요": "beautiful, polite form"
  "ko-1877":
    "native": "be high, tall"
    "notes":
      "n1": "Said of height and of a high value or number, not of a room's brightness or heat."
    "examples": {}
  "ko-1878":
    "native": "be low"
    "notes":
      "n1": "The opposite is 높다 (nopda), high or tall."
    "examples":
      "방이 낮아요.":
        "native": "The room has a low ceiling."
        "bases":
          "낮아요": "low, polite form"
  "ko-1879":
    "native": "be long"
    "notes":
      "n1": "길다 (gilda) is regular in the polite form, 길어요 (gireoyo). Its ㄹ (l) drops only before the ㄴ, ㅂ and ㅅ endings, which this unit does not teach."
    "examples":
      "이 차는 길어요.":
        "native": "This car is long."
        "bases":
          "길어요": "long, polite form"
      "이 빵은 길어요?":
        "native": "Is this bread long?"
        "bases":
          "길어요": "long, polite form"
  "ko-1880":
    "native": "be short"
    "notes":
      "n1": "The opposite is 길다 (gilda), long."
    "examples":
      "이 차는 짧아요.":
        "native": "This car is short."
        "bases":
          "짧아요": "short, polite form"
  "ko-1881":
    "native": "be fast, quick"
    "notes":
      "n1": "빠르다 (ppareuda) is irregular: the 르 (reu) becomes ㄹㄹ before 아 (a) or 어 (eo), so the polite form is 빨라요 (ppallayo)."
    "examples":
      "이 차는 빨라요.":
        "native": "This car is fast."
        "bases":
          "빨라요": "fast, polite form"
  "ko-1882":
    "native": "be slow"
    "notes":
      "n1": "The opposite is 빠르다 (ppareuda), fast."
    "examples":
      "이 차는 느려요.":
        "native": "This car is slow."
        "bases":
          "느려요": "slow, polite form"
  "ko-1883":
    "native": "be tasty, delicious"
    "notes":
      "n1": "The everyday word for food that tastes good. Its opposite is 맛없다 (maseopda)."
    "examples":
      "커피가 맛있어요.":
        "native": "The coffee is delicious."
        "bases":
          "맛있어요": "delicious, polite form"
      "이 빵은 맛있어요.":
        "native": "This bread is delicious."
        "bases":
          "맛있어요": "delicious, polite form"
  "ko-1884":
    "native": "be not tasty"
    "notes":
      "n1": "The opposite of 맛있다 (masitda), tasty."
    "examples":
      "이 빵은 맛없어요.":
        "native": "This bread is not tasty."
        "bases":
          "맛없어요": "not tasty, polite form"
      "커피가 맛없어요?":
        "native": "Is the coffee not tasty?"
        "bases":
          "맛없어요": "not tasty, polite form"
  "ko-1885":
    "native": "be difficult, hard"
    "notes":
      "n1": "어렵다 (eoryeopda) is irregular: the ㅂ (p) turns into 워 (wo) before the -어요 (eoyo) ending, so the polite form is 어려워요 (eoryeowoyo)."
    "examples":
      "한국말이 어려워요.":
        "native": "Korean is difficult."
        "bases":
          "한국말이": "Korean language, with the subject particle 이 (i)"
          "어려워요": "difficult, polite form"
      "영어가 어려워요?":
        "native": "Is English difficult?"
        "bases":
          "영어가": "English, with the subject particle 가 (ga)"
          "어려워요": "difficult, polite form"
  "ko-1886":
    "native": "be easy"
    "notes":
      "n1": "쉽다 (swipda) is irregular: the ㅂ (p) turns into 워 (wo) before the -어요 (eoyo) ending, so the polite form is 쉬워요 (swiwoyo). The opposite is 어렵다 (eoryeopda)."
    "examples":
      "영어가 쉬워요.":
        "native": "English is easy."
        "bases":
          "영어가": "English, with the subject particle 가 (ga)"
          "쉬워요": "easy, polite form"
      "한국말이 쉬워요?":
        "native": "Is Korean easy?"
        "bases":
          "한국말이": "Korean language, with the subject particle 이 (i)"
          "쉬워요": "easy, polite form"
  "ko-1887":
    "native": "be happy"
    "notes":
      "n1": "Said of a lasting good feeling as well as of a happy moment; 기쁘다 (gippeuda) is glad about one thing."
    "examples":
      "선생님은 행복해요.":
        "native": "The teacher is happy."
        "bases":
          "행복해요": "happy, polite form"
      "저는 행복해요.":
        "native": "I am happy."
        "bases":
          "행복해요": "happy, polite form"
  "ko-1888":
    "native": "be sad"
    "notes":
      "n1": "슬프다 (seulpeuda) is irregular: the 으 (eu) drops before 어 (eo), so the polite form is 슬퍼요 (seulpeoyo)."
    "examples":
      "학생이 슬퍼요.":
        "native": "The student is sad."
        "bases":
          "슬퍼요": "sad, polite form"
      "선생님이 슬퍼요?":
        "native": "Is the teacher sad?"
        "bases":
          "슬퍼요": "sad, polite form"
  "ko-1889":
    "native": "be glad"
    "notes":
      "n1": "기쁘다 (gippeuda) is irregular: the 으 (eu) drops before 어 (eo), so the polite form is 기뻐요 (gippeoyo)."
    "examples":
      "학생이 기뻐요.":
        "native": "The student is glad."
        "bases":
          "기뻐요": "glad, polite form"
      "선생님이 기뻐요.":
        "native": "The teacher is glad."
        "bases":
          "기뻐요": "glad, polite form"
  "ko-1890":
    "native": "be tired"
    "notes":
      "n1": "Said of being tired after work or a long day; it does not mean being sleepy."
    "examples":
      "선생님이 피곤해요.":
        "native": "The teacher is tired."
        "bases":
          "피곤해요": "tired, polite form"
      "저는 피곤해요.":
        "native": "I am tired."
        "bases":
          "피곤해요": "tired, polite form"
  "ko-1891":
    "native": "hurt, be in pain, be ill"
    "notes":
      "n1": "아프다 (apeuda) is irregular: the 으 (eu) drops before 아 (a), so the polite form is 아파요 (apayo)."
    "examples":
      "발이 아파요.":
        "native": "My foot hurts."
        "bases":
          "아파요": "hurt, polite form"
      "저는 아파요.":
        "native": "I am ill."
        "bases":
          "아파요": "ill, polite form"
  "ko-1892":
    "native": "be bright"
    "notes":
      "n1": "The opposite is 어둡다 (eodupda), dark."
    "examples":
      "방이 밝아요.":
        "native": "The room is bright."
        "bases":
          "밝아요": "bright, polite form"
      "이 방은 밝아요.":
        "native": "This room is bright."
        "bases":
          "밝아요": "bright, polite form"
  "ko-1893":
    "native": "be dark"
    "notes":
      "n1": "어둡다 (eodupda) is irregular: the ㅂ (p) turns into 워 (wo) before the -어요 (eoyo) ending, so the polite form is 어두워요 (eoduwoyo)."
    "examples":
      "방이 어두워요.":
        "native": "The room is dark."
        "bases":
          "어두워요": "dark, polite form"
      "이 방은 어두워요?":
        "native": "Is this room dark?"
        "bases":
          "어두워요": "dark, polite form"
  "ko-1874":
    "native": "be kind, friendly"
    "notes":
      "n1": "Said of a person who is kind and polite to others. The noun 친절 (chinjeol), kindness, is said with 하다 (hada)."
    "examples":
      "선생님은 친절해요.":
        "native": "The teacher is kind."
        "bases":
          "친절해요": "kind, polite form"
      "학생이 친절해요?":
        "native": "Is the student kind?"
        "bases":
          "친절해요": "kind, polite form"
  "ko-1894":
    "native": "be heavy"
    "notes":
      "n1": "무겁다 (mugeopda) is irregular: the ㅂ (p) turns into 워 (wo) before the -어요 (eoyo) ending, so the polite form is 무거워요 (mugeowoyo)."
    "examples":
      "이 차는 무거워요.":
        "native": "This car is heavy."
        "bases":
          "무거워요": "heavy, polite form"
