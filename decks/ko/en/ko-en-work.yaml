schema: 1
id: "ko-en-work"
kind: "layer"
core: "ko-work"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Work"
license: "CC-BY-SA-4.0"
description: "Words for work and jobs: the places, the jobs and the things done at work, from work and office to salary and interview. Not yet checked by a Korean speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "ko-2180":
    "native": "work, a job or task you do for pay"
    "notes":
      "n1": "일 (il) is the everyday word for work, the thing you do for pay. 직업 (jigeop) is the word for an occupation, the job you have."
    "examples":
      "일이 좋아요?":
        "native": "Is the work good?"
        "bases":
          "일이": "work, with the subject particle 이 (i)"
      "일이 괜찮아요?":
        "native": "Is the work OK?"
        "bases":
          "일이": "work, with the subject particle 이 (i)"
          "괜찮아요": "OK, with the polite ending 아요 (ayo)"
  "ko-2182":
    "native": "workplace, the place where you work"
    "examples":
      "직장이 어디예요?":
        "native": "Where is the workplace?"
        "bases":
          "직장이": "workplace, with the subject particle 이 (i)"
      "직장은 괜찮아요?":
        "native": "Is the workplace OK?"
        "bases":
          "직장은": "workplace, with the topic particle 은 (eun)"
          "괜찮아요": "OK, with the polite ending 아요 (ayo)"
  "ko-2185":
    "native": "factory"
    "examples":
      "공장이 어디예요?":
        "native": "Where is the factory?"
        "bases":
          "공장이": "factory, with the subject particle 이 (i)"
  "ko-2186":
    "native": "nurse"
    "examples":
      "저는 간호사예요.":
        "native": "I am a nurse."
        "bases":
          "간호사예요": "nurse, with the polite copula 예요 (yeyo)"
  "ko-2187":
    "native": "police officer"
    "notes":
      "n1": "경찰관 (gyeongchalgwan) is an officer. 경찰 (gyeongchal) is the police as a force."
    "examples":
      "저는 경찰관이에요.":
        "native": "I am a police officer."
        "bases":
          "경찰관이에요": "police officer, with the polite copula 이에요 (ieyo)"
  "ko-2189":
    "native": "reporter, journalist"
    "examples":
      "저는 기자예요.":
        "native": "I am a reporter."
        "bases":
          "기자예요": "reporter, with the polite copula 예요 (yeyo)"
  "ko-2190":
    "native": "singer, usually a professional one"
    "examples":
      "저는 가수예요.":
        "native": "I am a singer."
        "bases":
          "가수예요": "singer, with the polite copula 예요 (yeyo)"
  "ko-2191":
    "native": "actor, a person who performs in a play or film"
    "examples":
      "저는 배우예요.":
        "native": "I am an actor."
        "bases":
          "배우예요": "actor, with the polite copula 예요 (yeyo)"
  "ko-2192":
    "native": "public official, civil servant"
    "examples":
      "저는 공무원이에요.":
        "native": "I am a civil servant."
        "bases":
          "공무원이에요": "civil servant, with the polite copula 이에요 (ieyo)"
  "ko-2193":
    "native": "soldier"
    "examples":
      "저는 군인이에요.":
        "native": "I am a soldier."
        "bases":
          "군인이에요": "soldier, with the polite copula 이에요 (ieyo)"
  "ko-2194":
    "native": "farmer"
    "examples":
      "저는 농부예요.":
        "native": "I am a farmer."
        "bases":
          "농부예요": "farmer, with the polite copula 예요 (yeyo)"
  "ko-2195":
    "native": "beautician, a person who does hair styling and beauty treatments"
    "examples":
      "저는 미용사예요.":
        "native": "I am a beautician."
        "bases":
          "미용사예요": "beautician, with the polite copula 예요 (yeyo)"
  "ko-2196":
    "native": "lawyer"
    "examples":
      "저는 변호사예요.":
        "native": "I am a lawyer."
        "bases":
          "변호사예요": "lawyer, with the polite copula 예요 (yeyo)"
  "ko-2197":
    "native": "designer"
    "examples":
      "저는 디자이너예요.":
        "native": "I am a designer."
        "bases":
          "디자이너예요": "designer, with the polite copula 예요 (yeyo)"
  "ko-2198":
    "native": "bank clerk"
    "examples":
      "저는 은행원이에요.":
        "native": "I am a bank clerk."
        "bases":
          "은행원이에요": "bank clerk, with the polite copula 이에요 (ieyo)"
  "ko-2199":
    "native": "going to work"
    "notes":
      "n1": "출근 (chulgeun) is going to work, a noun. With 하다 (hada) it becomes a verb: 출근해요 (chulgeunhaeyo), I go to work."
    "examples":
      "출근해요?":
        "native": "Are you going to work?"
        "bases":
          "출근해요": "go to work, with the polite ending 해요 (haeyo)"
  "ko-2200":
    "native": "leaving work, finishing work"
    "notes":
      "n1": "퇴근 (toegeun) is leaving work, a noun. 퇴근해요 (toegeunhaeyo) means 'I leave work'."
    "examples":
      "퇴근해요?":
        "native": "Are you leaving work?"
        "bases":
          "퇴근해요": "leave work, with the polite ending 해요 (haeyo)"
  "ko-2201":
    "native": "work, duty at a company"
    "notes":
      "n1": "근무 (geunmu) is work at a job, such as at a company. 근무해요 (geunmuhaeyo) means 'I work there'."
    "examples":
      "근무해요?":
        "native": "Do you work (at a company)?"
        "bases":
          "근무해요": "work, with the polite ending 해요 (haeyo)"
  "ko-2203":
    "native": "monthly salary"
    "examples":
      "월급이 좋아요?":
        "native": "Is the salary good?"
        "bases":
          "월급이": "salary, with the subject particle 이 (i)"
      "월급이 괜찮아요?":
        "native": "Is the salary OK?"
        "bases":
          "월급이": "salary, with the subject particle 이 (i)"
          "괜찮아요": "OK, with the polite ending 아요 (ayo)"
  "ko-2204":
    "native": "head of a company, CEO"
    "notes":
      "n1": "사장 (sajang) is the title of the head of a company. To address a boss politely, use 사장님 (sajangnim), as in the addressing unit."
    "examples":
      "저는 사장이에요.":
        "native": "I am the head of the company."
        "bases":
          "사장이에요": "head of a company, with the polite copula 이에요 (ieyo)"
  "ko-2207":
    "native": "part-time job, side job"
    "notes":
      "n1": "아르바이트 (areubaiteu) is a part-time or side job, from German Arbeit, work (Wiktionary). In speech it is often shortened to 알바 (alba), which Wiktionary tags colloquial."
    "examples":
      "저는 아르바이트를 해요.":
        "native": "I work part-time."
        "bases":
          "아르바이트를": "part-time job, with the object particle 를 (reul)"
          "해요": "do, polite form"
  "ko-2208":
    "native": "face-to-face meeting, personal interview"
    "examples":
      "면접이 괜찮아요?":
        "native": "Is the interview OK?"
        "bases":
          "면접이": "interview, with the subject particle 이 (i)"
          "괜찮아요": "OK, with the polite ending 아요 (ayo)"
  "ko-2209":
    "native": "résumé, CV"
    "examples":
      "이 이력서는 괜찮아요?":
        "native": "Is this résumé OK?"
        "bases":
          "이력서는": "résumé, with the topic particle 는 (neun)"
          "괜찮아요": "OK, with the polite ending 아요 (ayo)"
  "ko-2210":
    "native": "meeting"
    "examples":
      "회의가 어디예요?":
        "native": "Where is the meeting?"
        "bases":
          "회의가": "meeting, with the subject particle 가 (ga)"
      "회의가 좋아요?":
        "native": "Is the meeting good?"
        "bases":
          "회의가": "meeting, with the subject particle 가 (ga)"
