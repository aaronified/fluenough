id: "ko-en-market-sentences"
kind: "layer"
core: "ko-market-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Market sentences"
license: "CC-BY-SA-4.0"
description: "Eleven sentences of market words, each with its confusables. Not yet checked by a Korean speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
cards:
  "ko-4560":
    native: "What do you buy at the market?"
    confusables:
      "w1":
        why: "가게 (gage) is one shop, not the whole market."
      "w2":
        why: "마트 (mateu) is a supermarket, not a market with stalls."
  "ko-4561":
    native: "How much is the price?"
    confusables:
      "w1":
        why: "무게 (muge) asks about weight, not price."
      "w2":
        why: "크기 (keugi) asks about size."
  "ko-4562":
    native: "Do you have cash?"
    confusables:
      "w1":
        why: "카드 (kadeu) is a card, not cash."
      "w2":
        why: "돈 (don) is money in general."
  "ko-4563":
    native: "Please give me the receipt."
    confusables:
      "w1":
        why: "봉지 (bongji) is a bag, not a receipt."
      "w2":
        why: "계산 (gyesan) is the payment at a till."
  "ko-4564":
    native: "There are many customers at the shop."
    confusables:
      "w1":
        why: "점원 (jeomwon) is a shop assistant, not a customer."
      "w2":
        why: "직원 (jigwon) is a member of staff."
  "ko-4565":
    native: "Are there many discounts?"
    confusables:
      "w1":
        why: "세일 (seil) is a sale of goods at lower prices."
      "w2":
        why: "바겐세일 (bagenseil) is a bargain sale."
  "ko-4566":
    native: "The owner is kind."
    confusables:
      "w1":
        why: "점원 (jeomwon) is a shop assistant, not the owner."
      "w2":
        why: "판매원 (panmaewon) is a salesperson."
  "ko-4567":
    native: "Is the size good?"
    confusables:
      "w1":
        why: "크기 (keugi) is size in general."
      "w2":
        why: "색깔 (saekkkal) is colour."
  "ko-4568":
    native: "Business is going well."
    confusables:
      "w1":
        why: "가게 (gage) is a shop, not the business."
      "w2":
        why: "매장 (maejang) is the sales floor."
  "ko-4569":
    native: "Is delivery possible?"
    confusables:
      "w1":
        why: "주문 (jumun) is an order."
      "w2":
        why: "교환 (gyohwan) is an exchange of goods."
  "ko-4570":
    native: "Is a refund possible?"
    confusables:
      "w1":
        why: "교환 (gyohwan) is an exchange, not money paid back."
      "w2":
        why: "할인 (harin) is a discount."
