"name": "Describing things and feelings in sentences"
"license": "CC-BY-SA-4.0"
"description": "Ten sentences that describe things and people with the words of this unit, in the polite -요 (-yo) style. Not yet checked by a Korean speaker: please report any mistake."
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ko-4280":
    "native": "Is this coffee hot?"
    "confusables":
      "w1":
        "why": "따뜻하다 (ttatteuthada) means warm, not hot to the touch."
      "w2":
        "why": "시원하다 (siwonhada) means cool and pleasant, as a breeze."
  "ko-4281":
    "native": "Is the water cold?"
    "confusables":
      "w1":
        "why": "시원하다 (siwonhada) means refreshing, not cold to the touch."
      "w2":
        "why": "춥다 (chupda) is cold of the weather or the air, not of a drink."
  "ko-4282":
    "native": "Is the room cold?"
    "confusables":
      "w1":
        "why": "덥다 (deopda) means hot, the opposite."
      "w2":
        "why": "차갑다 (chagapda) is cold to the touch, not of a room."
  "ko-4283":
    "native": "I am happy."
    "confusables":
      "w1":
        "why": "피곤하다 (pigonhada) means tired."
      "w2":
        "why": "기쁘다 (gippeuda) means glad about one thing, not a lasting state."
  "ko-4284":
    "native": "I am sad."
    "confusables":
      "w1":
        "why": "기쁘다 (gippeuda) means glad, the opposite."
      "w2":
        "why": "아프다 (apeuda) means hurt or ill, not sad."
  "ko-4285":
    "native": "Is the bread delicious?"
    "confusables":
      "w1":
        "why": "맛없다 (maseopda) means not tasty, the opposite."
      "w2":
        "why": "예쁘다 (yeppeuda) is about looks, not taste."
  "ko-4286":
    "native": "Is the room bright?"
    "confusables":
      "w1":
        "why": "어둡다 (eodupda) means dark, the opposite."
      "w2":
        "why": "새롭다 (saeropda) means new, not bright."
  "ko-4287":
    "native": "Is this car long?"
    "confusables":
      "w1":
        "why": "짧다 (jjalda) means short, the opposite."
      "w2":
        "why": "높다 (nopda) means high, not long."
  "ko-4288":
    "native": "Is Korean easy?"
    "confusables":
      "w1":
        "why": "어렵다 (eoryeopda) means difficult, the opposite."
      "w2":
        "why": "좋다 (jota) means good, not easy."
  "ko-4289":
    "native": "Is the teacher tired?"
    "confusables":
      "w1":
        "why": "행복하다 (haengbokada) means happy, the opposite."
      "w2":
        "why": "아프다 (apeuda) means hurt or ill."
