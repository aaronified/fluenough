schema: 1
id: "ko-en-everyday-verbs"
kind: "layer"
core: "ko-everyday-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Everyday verbs"
license: "CC-BY-SA-4.0"
description: "Thirty-three everyday verbs, carded in their dictionary form, each with a polite example. Six irregular verbs have a note and no example. Not yet checked by a Korean speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
cards:
  "ko-1620":
    "native": "to eat"
    "examples":
      "저는 빵을 먹어요.":
        "native": "I eat bread."
        "bases":
          "먹어요": "to eat (polite)"
      "이거 먹어요?":
        "native": "Are you eating this?"
        "bases":
          "이거": "this one"
          "먹어요": "to eat (polite)"
  "ko-1621":
    "native": "to drink"
    "examples":
      "저는 물을 마셔요.":
        "native": "I drink water."
        "bases":
          "마셔요": "to drink (polite)"
      "커피를 마셔요?":
        "native": "Do you drink coffee?"
        "bases":
          "마셔요": "to drink (polite)"
  "ko-1622":
    "native": "to sleep"
    "examples":
      "학생은 자요?":
        "native": "Is the student sleeping?"
        "bases":
          "자요": "to sleep (polite)"
  "ko-1623":
    "native": "to get up"
    "examples":
      "저는 일어나요.":
        "native": "I get up."
        "bases":
          "일어나요": "to get up (polite)"
      "선생님은 일어나요?":
        "native": "Does the teacher get up?"
        "bases":
          "일어나요": "to get up (polite)"
  "ko-1624":
    "native": "to go"
    "examples":
      "저는 학교에 가요.":
        "native": "I go to school."
        "bases":
          "학교에": "school, with the place particle 에 (e)"
          "가요": "to go (polite)"
      "어디 가요?":
        "native": "Where are you going?"
        "bases":
          "가요": "to go (polite)"
  "ko-1625":
    "native": "to come"
    "examples":
      "친구가 와요?":
        "native": "Is a friend coming?"
        "bases":
          "와요": "to come (polite)"
      "선생님이 와요.":
        "native": "The teacher is coming."
        "bases":
          "와요": "to come (polite)"
  "ko-1626":
    "native": "to read"
    "examples":
      "저는 책을 읽어요.":
        "native": "I read a book."
        "bases":
          "책을": "book, with the object particle 을 (eul)"
          "읽어요": "to read (polite)"
      "선생님은 책을 읽어요?":
        "native": "Is the teacher reading a book?"
        "bases":
          "책을": "book, with the object particle 을 (eul)"
          "읽어요": "to read (polite)"
  "ko-1627":
    "native": "to write"
    "notes":
      "n1": "쓰다 (sseuda) loses its 으 (eu) before 어 (eo), so its polite form is 써요 (sseoyo). No example uses it here."
  "ko-1628":
    "native": "to see, to look at"
    "examples":
      "저는 선생님을 봐요.":
        "native": "I see the teacher."
        "bases":
          "선생님을": "teacher, with the object particle 을 (eul)"
          "봐요": "to see (polite)"
      "이거 봐요.":
        "native": "Look at this."
        "bases":
          "이거": "this one"
          "봐요": "to look (polite)"
  "ko-1629":
    "native": "to listen, to hear"
    "notes":
      "n1": "듣다 (deutda) is irregular before 어 (eo): its polite form is 들어요 (deureoyo). No example uses it here."
  "ko-1630":
    "native": "to wash"
    "examples":
      "저는 씻어요.":
        "native": "I wash up."
        "bases":
          "씻어요": "to wash (polite)"
  "ko-1631":
    "native": "to wipe, to polish"
    "examples":
      "이 방을 닦아요?":
        "native": "Are you wiping this room?"
        "bases":
          "닦아요": "to wipe, to polish (polite)"
  "ko-1632":
    "native": "to buy"
    "examples":
      "저는 커피를 사요.":
        "native": "I buy coffee."
        "bases":
          "사요": "to buy (polite)"
      "이거 사요?":
        "native": "Are you buying this?"
        "bases":
          "이거": "this one"
          "사요": "to buy (polite)"
  "ko-1633":
    "native": "to sell"
    "notes":
      "n1": "팔다 (palda) is irregular in some endings, as in 파는 (paneun), that sells, and 팝니다 (pamnida). No example uses it here."
  "ko-1634":
    "native": "to sit"
    "examples":
      "선생님은 앉아요?":
        "native": "Is the teacher sitting down?"
        "bases":
          "앉아요": "to sit (polite)"
      "저는 앉아요.":
        "native": "I sit down."
        "bases":
          "앉아요": "to sit (polite)"
  "ko-1635":
    "native": "to stand"
    "examples":
      "저는 서요.":
        "native": "I stand."
        "bases":
          "서요": "to stand (polite)"
      "학생은 서요?":
        "native": "Is the student standing?"
        "bases":
          "서요": "to stand (polite)"
  "ko-1636":
    "native": "to work"
    "examples":
      "저는 일해요.":
        "native": "I work."
        "bases":
          "일해요": "to work (polite)"
      "교수님은 일해요?":
        "native": "Does the professor work?"
        "bases":
          "일해요": "to work (polite)"
  "ko-1637":
    "native": "to study"
    "examples":
      "학생은 공부해요.":
        "native": "The student studies."
        "bases":
          "공부해요": "to study (polite)"
      "저는 한국말을 공부해요.":
        "native": "I study Korean."
        "bases":
          "한국말을": "Korean language, with the object particle 을 (eul)"
          "공부해요": "to study (polite)"
  "ko-1638":
    "native": "to speak, to talk"
    "examples":
      "저는 말해요.":
        "native": "I speak."
        "bases":
          "말해요": "to speak (polite)"
      "선생님은 말해요?":
        "native": "Is the teacher speaking?"
        "bases":
          "말해요": "to speak (polite)"
  "ko-1639":
    "native": "to walk"
    "notes":
      "n1": "걷다 (geotda) is irregular before 어 (eo): its polite form is 걸어요 (georeoyo). No example uses it here."
  "ko-1640":
    "native": "to run"
    "examples":
      "저는 뛰어요.":
        "native": "I run."
        "bases":
          "뛰어요": "to run (polite)"
      "친구는 뛰어요?":
        "native": "Is the friend running?"
        "bases":
          "뛰어요": "to run (polite)"
  "ko-1641":
    "native": "to rest"
    "examples":
      "저는 쉬어요.":
        "native": "I rest."
        "bases":
          "쉬어요": "to rest (polite)"
      "선생님은 쉬어요?":
        "native": "Is the teacher resting?"
        "bases":
          "쉬어요": "to rest (polite)"
  "ko-1642":
    "native": "to cook"
    "examples":
      "저는 요리해요.":
        "native": "I cook."
        "bases":
          "요리해요": "to cook (polite)"
      "친구는 요리해요?":
        "native": "Does the friend cook?"
        "bases":
          "요리해요": "to cook (polite)"
  "ko-1643":
    "native": "to receive, to take"
    "examples":
      "이거 받아요?":
        "native": "Do you take this?"
        "bases":
          "이거": "this one"
          "받아요": "to receive (polite)"
      "선생님이 받아요.":
        "native": "The teacher receives it."
        "bases":
          "받아요": "to receive (polite)"
  "ko-1644":
    "native": "to send"
    "examples":
      "이거 보내요?":
        "native": "Are you sending this?"
        "bases":
          "이거": "this one"
          "보내요": "to send (polite)"
      "저는 책을 보내요.":
        "native": "I send a book."
        "bases":
          "책을": "book, with the object particle 을 (eul)"
          "보내요": "to send (polite)"
  "ko-1645":
    "native": "to call, to name"
    "notes":
      "n1": "부르다 (bureuda) is irregular before 어 (eo): its polite form is 불러요 (bulleoyo). No example uses it here."
  "ko-1646":
    "native": "to wait for"
    "examples":
      "저는 기다려요.":
        "native": "I wait."
        "bases":
          "기다려요": "to wait (polite)"
      "저는 친구를 기다려요.":
        "native": "I wait for a friend."
        "bases":
          "기다려요": "to wait for (polite)"
  "ko-1647":
    "native": "to look for"
    "examples":
      "저는 책을 찾아요.":
        "native": "I look for a book."
        "bases":
          "책을": "book, with the object particle 을 (eul)"
          "찾아요": "to look for (polite)"
      "이거 찾아요?":
        "native": "Are you looking for this?"
        "bases":
          "이거": "this one"
          "찾아요": "to look for (polite)"
  "ko-1648":
    "native": "to lose"
    "examples":
      "저는 책을 잃어요.":
        "native": "I lose a book."
        "bases":
          "책을": "book, with the object particle 을 (eul)"
          "잃어요": "to lose (polite)"
  "ko-1649":
    "native": "to know"
    "notes":
      "n1": "알다 (alda) is irregular in some endings, as in 아는 (aneun), that knows, and 압니다 (amnida). No example uses it here."
  "ko-1650":
    "native": "to think"
    "examples":
      "저는 생각해요.":
        "native": "I think."
        "bases":
          "생각해요": "to think (polite)"
      "선생님은 생각해요?":
        "native": "Is the teacher thinking?"
        "bases":
          "생각해요": "to think (polite)"
  "ko-1651":
    "native": "to wear, to put on"
    "examples":
      "선생님은 입어요?":
        "native": "Is the teacher wearing it?"
        "bases":
          "입어요": "to wear (polite)"
  "ko-1652":
    "native": "to ride, to take"
    "examples":
      "저는 차를 타요.":
        "native": "I ride in a car."
        "bases":
          "타요": "to ride (polite)"
