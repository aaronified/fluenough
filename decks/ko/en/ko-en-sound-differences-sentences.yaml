schema: 1
id: "ko-en-sound-differences-sentences"
kind: "layer"
core: "ko-sound-differences-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sound words in sentences"
license: "CC-BY-SA-4.0"
description: "Six sentences that use the sound-difference words, to put in order: plain, tense and aspirated consonants. Not yet checked by a Korean speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "ko-0048":
    "native": "My daughter is a student."
    "confusables":
      "w1":
        "why": "달 (dal) is moon: its d is plain, not tense."
      "w2":
        "why": "탈 (tal) is mask: its t has a puff of breath."
  "ko-0049":
    "native": "There is fire and water."
    "bases":
      "있어요": "to be; to have (polite)"
    "confusables":
      "w1":
        "why": "뿔 (ppul) is horn: its pp is tense, with no breath."
      "w2":
        "why": "풀 (pul) is grass: its p has a puff of breath."
  "ko-0050":
    "native": "There is bread in the room."
    "bases":
      "있어요": "to be; to have (polite)"
    "confusables":
      "w1":
        "why": "밥 (bap) would say cooked rice, or a meal, not bread."
      "w2":
        "why": "밤 (bam) would say night, not room."
  "ko-0051":
    "native": "The rabbit has no axe."
    "bases":
      "없어요": "not to be; not to have (polite)"
    "confusables":
      "w1":
        "why": "고기 (gogi) would say meat, not axe."
      "w2":
        "why": "모기 (mogi) would say mosquito, not rabbit."
  "ko-0052":
    "native": "This tea is cheap."
    "confusables":
      "w1":
        "why": "사요 (sayo) is buy: it has a plain s."
      "w2":
        "why": "자 (ja) is ruler, with a plain j."
  "ko-0053":
    "native": "My foot hurts, and my arm hurts too."
    "bases":
      "아파요": "to hurt; to be sick (polite)"
    "confusables":
      "w1":
        "why": "말 (mal) would say horse or word, not foot."
      "w2":
        "why": "살 (sal) would say flesh or years of age, not arm."
