name: "-으세요 (-euseyo) and -세요 (-seyo): the respectful polite form"
description: "Seventeen verbs in the honorific polite form, alone and after 선생님은 (seonsaengnimeun), 'the teacher'. Sources: the en.wiktionary.org entries -으세요 (-euseyo), -세요 (-seyo), 주다 (juda) and the tables of each verb; the en.wikipedia.org pages 'Korean honorifics' and 'Korean verbs'. Not yet checked by a Korean speaker: please report any mistake."
