pattern:
  name: "The honorific polite form"
  slot_name: "form"
  slots:
    "euseyo": "the honorific polite form: please, or a respected person does it"
    "teacher": "'The teacher ...': 선생님은 (seonsaengnimeun) and the honorific polite form"
  entries:
    "anda": "to sit"
    "ikda": "to read"
    "ipda": "to wear (clothes)"
    "chatda": "to look for"
    "gada": "to go"
    "oda": "to come"
    "boda": "to see, to watch"
    "sada": "to buy"
    "swida": "to rest"
    "gidarida": "to wait for"
    "mannada": "to meet"
    "gongbuhada": "to study"
    "juda": "to give"
    "meokda": "to eat (its own honorific verb)"
    "masida": "to drink (its own honorific verb)"
    "jada": "to sleep (its own honorific verb)"
    "itda": "to be (there) (its own honorific verb)"
  notes: "-으세요 (-euseyo) and -세요 (-seyo) are the polite present with the honorific suffix -으시- (-eusi-) or -시- (-si-) inside it: -시- (-si-) plus -어요 (-eoyo) contracts to -세요 (-seyo) (Wiktionary's -으세요 (-euseyo) entry). Wikipedia says the honorific suffix is used when the subject is older or higher in rank than the speaker. After a stem that ends in a consonant it is -으세요 (-euseyo): 앉으세요 (anjeuseyo), 읽으세요 (ilgeuseyo). After a vowel it is -세요 (-seyo): 가세요 (gaseyo), 기다리세요 (gidariseyo), 공부하세요 (gongbuhaseyo), and the greeting 안녕하세요 (annyeonghaseyo) is 하다 (hada) in this form. One form does several jobs, depending on context: it states what a respected person does, asks a respected person a question, and gives a polite command (Wiktionary: declarative, interrogative, imperative, suggestive). So 앉으세요 (anjeuseyo) can mean 'please sit' or 'you sit'. Four verbs have a separate honorific verb instead: 먹다 (meokda) and 마시다 (masida) both give 드세요 (deuseyo) (from 드시다 (deusida)), 자다 (jada) gives 주무세요 (jumuseyo) (from 주무시다 (jumusida)), and 있다 (itda) gives 계세요 (gyeseyo) (from 계시다 (gyesida)): Wikipedia's honorifics and verbs articles list these. 주다 (juda) gives 주세요 (juseyo), 'please give', as in 이거 주세요 (igeo juseyo). The polite word 'do not' is 마세요 (maseyo), the honorific of 말다 (malda), whose ㄹ (l) drops before the suffix: Wiktionary's example is 담배 피우지 마세요 (dambae piuji maseyo), 'do not smoke here, please'. Each form is copied from Wiktionary's table of the verb."
