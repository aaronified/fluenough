name: "이 (i) and 가 (ga): the subject particle"
description: "Eight nouns with the subject particle 이 (i) or 가 (ga), and the same noun in the sentence '(the noun) is good'. Sources: the en.wikipedia.org page 'Korean postpositions' and the en.wiktionary.org entries -이 (-i), -가 (-ga) and 좋다 (jota). Not yet checked by a Korean speaker: please report any mistake."
