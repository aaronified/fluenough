tags: ["beginner", "unreviewed"]
cards:
  "ko-4160":
    "native": "I drink water."
    "bases":
      "마셔요": "to drink (polite)"
    "confusables":
      "w1":
        "why": "Only food is eaten, and 마시다 (masida) is for drinks: 물을 (mureul) is water to drink."
      "w2":
        "why": "자다 (jada) is to sleep, not to drink."
  "ko-4161":
    "native": "Is the teacher sitting down?"
    "bases":
      "앉아요": "to sit (polite)"
    "confusables":
      "w1":
        "why": "서다 (seoda) is to stand, not to sit."
      "w2":
        "why": "쉬다 (swida) is to rest, which may be done sitting or lying."
  "ko-4162":
    "native": "I wait for a friend."
    "bases":
      "기다려요": "to wait for (polite)"
    "confusables":
      "w1":
        "why": "찾다 (chatda) is to look for something, and 기다리다 (gidarida) is to wait."
      "w2":
        "why": "보다 (boda) is to see, not to wait."
  "ko-4163":
    "native": "Is the friend running?"
    "bases":
      "뛰어요": "to run (polite)"
    "confusables":
      "w1":
        "why": "가다 (gada) is to go, and 뛰다 (ttwida) is to run."
      "w2":
        "why": "쉬다 (swida) is to rest, not to run."
  "ko-4164":
    "native": "I read a book."
    "bases":
      "책을": "book, with the object particle 을 (eul)"
      "읽어요": "to read (polite)"
    "confusables":
      "w1":
        "why": "보다 (boda) is to see or look, and 읽다 (ikda) is to read words."
      "w2":
        "why": "찾다 (chatda) is to look for, not to read."
  "ko-4165":
    "native": "I ride in a car."
    "bases":
      "타요": "to ride (polite)"
    "confusables":
      "w1":
        "why": "가다 (gada) is to go, and 타다 (tada) is to ride in or on."
      "w2":
        "why": "오다 (oda) is to come, not to ride."
  "ko-4166":
    "native": "Are you buying this?"
    "bases":
      "이거": "this one"
      "사요": "to buy (polite)"
    "confusables":
      "w1":
        "why": "받다 (batda) is to receive, not to buy."
      "w2":
        "why": "팔다 (palda) is to sell, the other way round."
