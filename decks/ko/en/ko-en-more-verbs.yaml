"id": "ko-en-more-verbs"
"kind": "layer"
"core": "ko-more-verbs"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "More verbs"
"license": "CC-BY-SA-4.0"
"description": "Thirty verbs for liking, helping, starting and finishing, opening and going, each with the polite -요 (-yo) form in its example. Not yet checked by a Korean speaker: please report any mistake."
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ko-2100":
    "native": "not know, be ignorant of"
    "notes":
      "n1": "모르다 (moreuda) is irregular: the 르 (reu) becomes ㄹㄹ before 아 (a) or 어 (eo), so the polite form is 몰라요 (mollayo). Its opposite is 알다 (alda), to know."
    "examples":
      "저는 몰라요.":
        "native": "I don't know."
        "bases":
          "몰라요": "not know, polite form"
      "이름을 몰라요.":
        "native": "I don't know the name."
        "bases":
          "몰라요": "not know, polite form"
  "ko-2101":
    "native": "like, be fond of"
    "notes":
      "n1": "Used for liking a thing or a person. Its opposite is 싫어하다 (sileohada), to dislike."
    "examples":
      "저는 커피를 좋아해요.":
        "native": "I like coffee."
        "bases":
          "좋아해요": "like, polite form"
      "선생님은 커피를 좋아해요?":
        "native": "Does the teacher like coffee?"
        "bases":
          "좋아해요": "like, polite form"
  "ko-2102":
    "native": "dislike, hate"
    "notes":
      "n1": "The opposite of 좋아하다 (joahada), to like."
    "examples":
      "저는 커피를 싫어해요.":
        "native": "I dislike coffee."
        "bases":
          "싫어해요": "dislike, polite form"
      "선생님은 빵을 싫어해요.":
        "native": "The teacher dislikes bread."
        "bases":
          "싫어해요": "dislike, polite form"
  "ko-2103":
    "native": "love"
    "notes":
      "n1": "Said of love for people and for things, a stronger feeling than 좋아하다 (joahada), to like."
    "examples":
      "저는 한국말을 사랑해요.":
        "native": "I love Korean."
        "bases":
          "한국말을": "Korean language, with the object particle 을 (eul)"
          "사랑해요": "love, polite form"
      "선생님은 학생을 사랑해요.":
        "native": "The teacher loves the student."
        "bases":
          "사랑해요": "love, polite form"
  "ko-2104":
    "native": "worry, be concerned"
    "notes":
      "n1": "Used when someone feels worried about a person or a thing; it is said as a feeling, not as an action."
    "examples":
      "저는 걱정해요.":
        "native": "I am worried."
        "bases":
          "걱정해요": "worry, polite form"
      "선생님이 걱정해요.":
        "native": "The teacher is worried."
        "bases":
          "걱정해요": "worry, polite form"
  "ko-2105":
    "native": "laugh, smile"
    "notes":
      "n1": "웃다 (utda) is regular in the polite form: 웃어요 (useoyo). The same verb is used for a smile and for a laugh."
    "examples":
      "학생이 웃어요.":
        "native": "The student laughs."
        "bases":
          "웃어요": "laugh, polite form"
      "선생님이 웃어요?":
        "native": "Is the teacher smiling?"
        "bases":
          "웃어요": "smile, polite form"
  "ko-2106":
    "native": "cry, weep"
    "notes":
      "n1": "울다 (ulda) loses its ㄹ (l) only before some endings, not in the polite form, so it is 울어요 (ureoyo). Its opposite is 웃다 (utda), to laugh."
    "examples":
      "학생이 울어요.":
        "native": "The student cries."
        "bases":
          "울어요": "cry, polite form"
      "선생님이 울어요?":
        "native": "Is the teacher crying?"
        "bases":
          "울어요": "cry, polite form"
  "ko-2107":
    "native": "borrow"
    "notes":
      "n1": "Used for borrowing a thing from someone, and for hiring a car or a room for a time."
    "examples":
      "저는 차를 빌려요.":
        "native": "I borrow a car."
        "bases":
          "빌려요": "borrow, polite form"
      "이 차를 빌려요?":
        "native": "Do you borrow this car?"
        "bases":
          "빌려요": "borrow, polite form"
  "ko-2108":
    "native": "help, assist"
    "notes":
      "n1": "돕다 (dopda) is irregular: the ㅂ (p) turns into 오 (o) and then 와 (wa) before the -아요 (ayo) ending, so the polite form is 도와요 (dowayo)."
    "examples":
      "선생님이 도와요.":
        "native": "The teacher helps."
        "bases":
          "도와요": "help, polite form"
      "저는 학생을 도와요.":
        "native": "I help the student."
        "bases":
          "도와요": "help, polite form"
  "ko-2109":
    "native": "help, give a hand"
    "notes":
      "n1": "In speech and writing the polite form is contracted: 도와주어요 (dowajueoyo) becomes 도와줘요 (dowajwoyo)."
    "examples":
      "선생님이 도와줘요.":
        "native": "The teacher helps."
        "bases":
          "도와줘요": "help, polite form"
      "학생이 저를 도와줘요.":
        "native": "The student helps me."
        "bases":
          "도와줘요": "help, polite form"
  "ko-2110":
    "native": "begin, start"
    "notes":
      "n1": "Used for starting an action or an event; the opposite is 끝내다 (kkeunnaeda), to finish something."
    "examples":
      "선생님이 시작해요.":
        "native": "The teacher starts."
        "bases":
          "시작해요": "start, polite form"
      "학생이 시작해요?":
        "native": "Does the student start?"
        "bases":
          "시작해요": "start, polite form"
  "ko-2111":
    "native": "finish something, end"
    "notes":
      "n1": "Used with an object: to finish a thing. The one-word form for a thing that ends by itself is 끝나다 (kkeunnada)."
    "examples":
      "저는 커피를 끝내요.":
        "native": "I finish the coffee."
        "bases":
          "끝내요": "finish, polite form"
      "학생이 빵을 끝내요?":
        "native": "Does the student finish the bread?"
        "bases":
          "끝내요": "finish, polite form"
  "ko-2112":
    "native": "come to an end, be finished"
    "notes":
      "n1": "Used for a thing that ends by itself, without an object. Its opposite is 시작하다 (sijakada), to begin."
    "examples":
      "커피가 끝나요.":
        "native": "The coffee is finished."
        "bases":
          "끝나요": "finished, polite form"
      "빵이 끝나요?":
        "native": "Is the bread finished?"
        "bases":
          "끝나요": "finished, polite form"
  "ko-2113":
    "native": "order, place an order"
    "notes":
      "n1": "The word to use when ordering food or goods in a shop or at a restaurant."
    "examples":
      "커피를 주문해요.":
        "native": "I order coffee."
        "bases":
          "주문해요": "order, polite form"
      "빵을 주문해요?":
        "native": "Do you order bread?"
        "bases":
          "주문해요": "order, polite form"
  "ko-2114":
    "native": "calculate; pay the bill"
    "notes":
      "n1": "In a shop it means to pay at the till, as in the phrasebook phrase 계산해 (gyesanhae) 주세요 (juseyo), please take my payment."
    "examples":
      "학생이 계산해요.":
        "native": "The student calculates."
        "bases":
          "계산해요": "calculate, polite form"
      "선생님이 계산해요?":
        "native": "Is the teacher paying?"
        "bases":
          "계산해요": "pay, polite form"
  "ko-2115":
    "native": "prepare, get ready"
    "notes":
      "n1": "Used for getting something ready before it is needed, as for a class or a meal."
    "examples":
      "선생님이 준비해요.":
        "native": "The teacher prepares."
        "bases":
          "준비해요": "prepare, polite form"
      "학생이 커피를 준비해요.":
        "native": "The student prepares the coffee."
        "bases":
          "준비해요": "prepare, polite form"
  "ko-2116":
    "native": "clean"
    "notes":
      "n1": "Used for cleaning a room or a place, with the room as the object."
    "examples":
      "방을 청소해요.":
        "native": "I clean the room."
        "bases":
          "청소해요": "clean, polite form"
      "학생이 방을 청소해요?":
        "native": "Does the student clean the room?"
        "bases":
          "청소해요": "clean, polite form"
  "ko-2117":
    "native": "order food; have someone do something"
    "notes":
      "n1": "In a restaurant it means to order food, as in 시켜요 (sikyeoyo). It also means to have someone do a job."
    "examples":
      "저는 커피를 시켜요.":
        "native": "I order a coffee."
        "bases":
          "시켜요": "order, polite form"
  "ko-2118":
    "native": "turn off, put out"
    "notes":
      "n1": "끄다 (kkeuda) is irregular: the 으 (eu) drops before 어 (eo), so the polite form is 꺼요 (kkeoyo). 불 (bul) here means a light or a fire."
    "examples":
      "불을 꺼요.":
        "native": "I turn off the light."
        "bases":
          "꺼요": "turn off, polite form"
  "ko-2119":
    "native": "open"
    "notes":
      "n1": "Used for opening a thing, such as a car door. Its opposite is 닫다 (datda), to close."
    "examples":
      "차를 열어요.":
        "native": "I open the car."
        "bases":
          "열어요": "open, polite form"
  "ko-2120":
    "native": "close, shut"
    "notes":
      "n1": "The opposite of 열다 (yeolda), to open."
    "examples":
      "방을 닫아요.":
        "native": "I close the room."
        "bases":
          "닫아요": "close, polite form"
      "학생이 방을 닫아요?":
        "native": "Does the student close the room?"
        "bases":
          "닫아요": "close, polite form"
  "ko-2121":
    "native": "talk, have a conversation"
    "notes":
      "n1": "Used for a talk or a conversation between people, in person or on the phone."
    "examples":
      "학생이 이야기해요.":
        "native": "The student talks."
        "bases":
          "이야기해요": "talk, polite form"
      "선생님이 이야기해요?":
        "native": "Is the teacher talking?"
        "bases":
          "이야기해요": "talk, polite form"
  "ko-2122":
    "native": "call by telephone"
    "notes":
      "n1": "Used for making a call; the call itself is done by phone and needs no object."
    "examples":
      "저는 전화해요.":
        "native": "I make a call."
        "bases":
          "전화해요": "call, polite form"
      "선생님이 전화해요?":
        "native": "Is the teacher calling?"
        "bases":
          "전화해요": "call, polite form"
  "ko-2123":
    "native": "play games"
    "notes":
      "n1": "Used for playing a game, on a phone or a computer or with others. 게임 (geim) is the noun for a game."
    "examples":
      "저는 게임해요.":
        "native": "I play games."
        "bases":
          "게임해요": "play games, polite form"
      "학생이 게임해요?":
        "native": "Does the student play games?"
        "bases":
          "게임해요": "play games, polite form"
  "ko-2124":
    "native": "go back, return"
    "notes":
      "n1": "Used for going back to a place. The dictionary tags it as honorific in one sense; a Korean reviewer checks its register."
    "examples":
      "학생이 돌아가요.":
        "native": "The student goes back."
        "bases":
          "돌아가요": "go back, polite form"
      "선생님이 돌아가요?":
        "native": "Is the teacher going back?"
        "bases":
          "돌아가요": "go back, polite form"
  "ko-2125":
    "native": "go in, enter"
    "notes":
      "n1": "Used for going into a place; the opposite is 나가다 (nagada), to go out."
    "examples":
      "방에 들어가요.":
        "native": "I go into the room."
        "bases":
          "들어가요": "go in, polite form"
      "학생이 방에 들어가요?":
        "native": "Does the student go into the room?"
        "bases":
          "들어가요": "go in, polite form"
  "ko-2126":
    "native": "go out, leave"
    "notes":
      "n1": "Used for leaving a place, such as a room. The dictionary gives other senses that this unit does not teach."
    "examples":
      "학생이 방을 나가요.":
        "native": "The student leaves the room."
        "bases":
          "나가요": "go out, polite form"
      "선생님이 나가요?":
        "native": "Is the teacher going out?"
        "bases":
          "나가요": "go out, polite form"
  "ko-2127":
    "native": "come out, come forth"
    "notes":
      "n1": "Before 아 (a) the 오 (o) contracts to 와 (wa), so the polite form is 나와요 (nawayo)."
    "examples":
      "학생이 나와요.":
        "native": "The student comes out."
        "bases":
          "나와요": "come out, polite form"
      "선생님이 나와요?":
        "native": "Is the teacher coming out?"
        "bases":
          "나와요": "come out, polite form"
  "ko-2128":
    "native": "go up, rise, ascend"
    "notes":
      "n1": "Used for going up a slope, stairs or a floor. Its opposite is 내려가다 (naeryeogada), to go down."
    "examples":
      "학생이 올라가요.":
        "native": "The student goes up."
        "bases":
          "올라가요": "go up, polite form"
      "선생님이 올라가요?":
        "native": "Is the teacher going up?"
        "bases":
          "올라가요": "go up, polite form"
  "ko-2129":
    "native": "go down, descend"
    "notes":
      "n1": "Used for going down stairs, a slope or to a lower floor. The opposite is 올라가다 (ollagada), to go up."
    "examples":
      "학생이 내려가요.":
        "native": "The student goes down."
        "bases":
          "내려가요": "go down, polite form"
      "선생님이 내려가요?":
        "native": "Is the teacher going down?"
        "bases":
          "내려가요": "go down, polite form"
