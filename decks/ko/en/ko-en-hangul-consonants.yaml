schema: 1
id: "ko-en-hangul-consonants"
kind: "layer"
core: "ko-hangul-consonants"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hangul consonants"
license: "CC-BY-SA-4.0"
description: "The consonants of the basic syllables, each written with the vowel ㅏ (a) so that it can be heard: the plain letters, then the tense letters, which are written doubled and said tighter with no puff of breath. The aspirated letters ㅋ (k), ㅌ (t), ㅍ (p) and ㅊ (ch) breathe out after the sound and have one more stroke than their plain partner. ㅇ (ieung) is not in this unit: it has no sound at the start of a syllable (it comes with the vowels) and is 'ng' at the end (it comes with the final consonants). Not yet checked by a Korean speaker: please report any mistake."
tags: ["unreviewed"]
"cards":
  "ko-0130":
    "native": "ga, between the 'g' of 'go' and the 'k' of 'sky', with no puff of breath"
    "notes":
      "n1": "가 (ga) is the consonant ㄱ (g) with the vowel ㅏ (a). At the start of a word ㄱ (g) is not voiced and has no puff of breath, so it sounds between a 'g' and a 'k'."
      "pair-kka": "ㄱ (g) and ㄲ (kk) differ only in tension: ㄲ (kk) is said tighter, with no puff of breath. 가 (ga) and 까 (kka) are the plain and the tense form."
      "pair-ka": "ㄱ (g) is plain, and ㅋ (k) breathes out after the sound. 가 (ga) and 카 (ka) differ in the puff of breath."
      "look-ka": "ㅋ (k) has one stroke more than ㄱ (g); the stroke marks the puff of breath."
  "ko-0131":
    "native": "na, as the 'n' of 'no' and the 'a' of 'father'"
    "notes":
      "n1": "나 (na) is the consonant ㄴ (n) with the vowel ㅏ (a). ㄴ (n) is said with the tip of the tongue on the ridge behind the upper teeth, as the 'n' of 'no'."
  "ko-0132":
    "native": "da, between the 'd' of 'do' and the 't' of 'stop', with no puff of breath"
    "notes":
      "n1": "다 (da) is the consonant ㄷ (d) with ㅏ (a). Like ㄱ (g) it is plain: not voiced at the start of a word, and with no puff of breath."
      "pair-tta": "ㄷ (d) and ㄸ (tt) differ only in tension: ㄸ (tt) is said tighter, with no puff of breath. 다 (da) and 따 (tta) are the plain and the tense form."
      "pair-ta": "ㄷ (d) is plain, and ㅌ (t) breathes out after the sound. 다 (da) and 타 (ta) differ in the puff of breath."
      "look-ta": "ㅌ (t) has one stroke more than ㄷ (d); the stroke marks the puff of breath."
  "ko-0133":
    "native": "ra, a quick tap of the tongue, like the 'dd' of 'ladder' in American English"
    "notes":
      "n1": "라 (ra) is the consonant ㄹ (r) with ㅏ (a). Between vowels ㄹ (r) is a single quick tap of the tongue. Before a consonant or at the end of a syllable it is said as an 'l'."
  "ko-0134":
    "native": "ma, as the 'm' of 'mother' and the 'a' of 'father'"
    "notes":
      "n1": "마 (ma) is the consonant ㅁ (m) with ㅏ (a). The lips close for ㅁ (m), as in 'mother'."
  "ko-0135":
    "native": "ba, between the 'b' of 'boy' and the 'p' of 'spy', with no puff of breath"
    "notes":
      "n1": "바 (ba) is the consonant ㅂ (b) with ㅏ (a). It is plain: not voiced at the start of a word, with no puff of breath."
      "pair-ppa": "ㅂ (b) and ㅃ (pp) differ only in tension: ㅃ (pp) is said tighter, with no puff of breath. 바 (ba) and 빠 (ppa) are the plain and the tense form."
      "pair-pa": "ㅂ (b) is plain, and ㅍ (p) breathes out after the sound. 바 (ba) and 파 (pa) differ in the puff of breath."
      "look-pa": "ㅍ (p) has one stroke more than ㅂ (b); the stroke marks the puff of breath."
  "ko-0136":
    "native": "sa, as the 's' of 'sun' and the 'a' of 'father'"
    "notes":
      "n1": "사 (sa) is the consonant ㅅ (s) with ㅏ (a), as the 's' of 'sun'. Before the vowel ㅣ (i) it is said more like 'sh'."
      "pair-ssa": "ㅅ (s) and ㅆ (ss) differ only in tension: ㅆ (ss) is written with two ㅅ (s)s and said tighter. 사 (sa) and 싸 (ssa) are the plain and the tense form."
  "ko-0137":
    "native": "ja, between the 'j' of 'jam' and the 'ch' of 'church', with no puff of breath"
    "notes":
      "n1": "자 (ja) is the consonant ㅈ (j) with ㅏ (a). It is plain: between the 'j' of 'jam' and the 'ch' of 'church', with no puff of breath."
      "pair-jja": "ㅈ (j) and ㅉ (jj) differ only in tension: ㅉ (jj) is written with two ㅈ (j)s and said tighter. 자 (ja) and 짜 (jja) are the plain and the tense form."
      "pair-cha": "ㅈ (j) is plain, and ㅊ (ch) breathes out after the sound. 자 (ja) and 차 (cha) differ in the puff of breath."
      "look-cha": "ㅊ (ch) has one stroke more than ㅈ (j); the stroke marks the puff of breath."
      "same-ruler": "자 (ja) is also the word for a ruler, 자 (ja), which has its own card. The spelling and the sound are the same as the syllable."
  "ko-0138":
    "native": "cha, as the 'ch' of 'church', said with a puff of breath"
    "notes":
      "n1": "차 (cha) is the consonant ㅊ (ch) with ㅏ (a), as the 'ch' of 'church' said with a puff of breath."
      "pair-ja": "ㅊ (ch) breathes out, and ㅈ (j) is plain. 차 (cha) and 자 (ja) differ in the puff of breath."
      "look-ja": "ㅊ (ch) has one stroke more than ㅈ (j); the stroke marks the puff of breath."
      "same-tea": "차 (cha) is also the word for tea or a car, 차 (cha), which has its own card. The spelling and the sound are the same as the syllable."
  "ko-0139":
    "native": "ka, as the 'k' of 'kite', with a puff of breath"
    "notes":
      "n1": "카 (ka) is the consonant ㅋ (k) with ㅏ (a), as the 'k' of 'kite' said with a puff of breath."
      "pair-ga": "ㅋ (k) breathes out, and ㄱ (g) is plain. 카 (ka) and 가 (ga) differ in the puff of breath."
      "look-ga": "ㅋ (k) has one stroke more than ㄱ (g); the stroke marks the puff of breath."
  "ko-0140":
    "native": "ta, as the 't' of 'top', with a puff of breath"
    "notes":
      "n1": "타 (ta) is the consonant ㅌ (t) with ㅏ (a), as the 't' of 'top' said with a puff of breath."
      "pair-da": "ㅌ (t) breathes out, and ㄷ (d) is plain. 타 (ta) and 다 (da) differ in the puff of breath."
      "look-da": "ㅌ (t) has one stroke more than ㄷ (d); the stroke marks the puff of breath."
  "ko-0141":
    "native": "pa, as the 'p' of 'pot', with a puff of breath"
    "notes":
      "n1": "파 (pa) is the consonant ㅍ (p) with ㅏ (a), as the 'p' of 'pot' said with a puff of breath."
      "pair-ba": "ㅍ (p) breathes out, and ㅂ (b) is plain. 파 (pa) and 바 (ba) differ in the puff of breath."
      "look-ba": "ㅍ (p) has one stroke more than ㅂ (b); the stroke marks the puff of breath."
  "ko-0142":
    "native": "ha, as the 'h' of 'hat' and the 'a' of 'father'"
    "notes":
      "n1": "하 (ha) is the consonant ㅎ (h) with ㅏ (a), as the 'h' of 'hat'. ㅎ (h) is a letter of its own and has no tense form."
  "ko-0143":
    "native": "kka, the 'k' of 'sky' said tight, with no puff of breath"
    "notes":
      "n1": "까 (kka) is the tense consonant ㄲ (kk) with ㅏ (a). It is written with two ㄱ (g)s and said tighter, with no puff of breath."
      "pair-ga": "ㄲ (kk) and ㄱ (g) differ only in tension: ㄲ (kk) is said tighter, with no puff of breath. 까 (kka) and 가 (ga) are the tense and the plain form."
  "ko-0144":
    "native": "tta, the 't' of 'stop' said tight, with no puff of breath"
    "notes":
      "n1": "따 (tta) is the tense consonant ㄸ (tt) with ㅏ (a). It is written with two ㄷ (d)s and said tighter, with no puff of breath."
      "pair-da": "ㄸ (tt) and ㄷ (d) differ only in tension: ㄸ (tt) is said tighter, with no puff of breath. 따 (tta) and 다 (da) are the tense and the plain form."
  "ko-0145":
    "native": "ppa, the 'p' of 'spot' said tight, with no puff of breath"
    "notes":
      "n1": "빠 (ppa) is the tense consonant ㅃ (pp) with ㅏ (a). It is written with two ㅂ (b)s and said tighter, with no puff of breath."
      "pair-ba": "ㅃ (pp) and ㅂ (b) differ only in tension: ㅃ (pp) is said tighter, with no puff of breath. 빠 (ppa) and 바 (ba) are the tense and the plain form."
  "ko-0146":
    "native": "ssa, the 's' of 'sun' said tight"
    "notes":
      "n1": "싸 (ssa) is the tense consonant ㅆ (ss) with ㅏ (a). It is written with two ㅅ (s)s and said tighter."
      "pair-sa": "ㅆ (ss) and ㅅ (s) differ only in tension: ㅆ (ss) is said tighter. 싸 (ssa) and 사 (sa) are the tense and the plain form."
  "ko-0147":
    "native": "jja, the 'j' of 'jam' said tight, with no puff of breath"
    "notes":
      "n1": "짜 (jja) is the tense consonant ㅉ (jj) with ㅏ (a). It is written with two ㅈ (j)s and said tighter, with no puff of breath."
      "pair-ja": "ㅉ (jj) and ㅈ (j) differ only in tension: ㅉ (jj) is said tighter, with no puff of breath. 짜 (jja) and 자 (ja) are the tense and the plain form."
