"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "More verbs in sentences"
"license": "CC-BY-SA-4.0"
"description": "Nine sentences that use the verbs of this unit with the words already taught, in the polite -요 (-yo) style. Not yet checked by a Korean speaker: please report any mistake."
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ko-4400":
    "native": "Does the teacher like bread?"
    "confusables":
      "w1":
        "why": "싫어하다 (sileohada) means dislike, the opposite."
      "w2":
        "why": "사랑하다 (saranghada) means love, a stronger feeling."
  "ko-4401":
    "native": "Does the student help the teacher?"
    "confusables":
      "w1":
        "why": "주문하다 (jumunhada) means order, not help."
      "w2":
        "why": "시작하다 (sijakada) means begin."
  "ko-4402":
    "native": "I borrow a car."
    "confusables":
      "w1":
        "why": "열다 (yeolda) means open, not borrow."
      "w2":
        "why": "닫다 (datda) means close, the opposite of open."
  "ko-4403":
    "native": "Do you clean the room?"
    "confusables":
      "w1":
        "why": "준비하다 (junbihada) means prepare, before a task."
      "w2":
        "why": "끝내다 (kkeunnaeda) means finish something."
  "ko-4404":
    "native": "I laugh."
    "confusables":
      "w1":
        "why": "울다 (ulda) means cry, the opposite."
      "w2":
        "why": "기쁘다 (gippeuda) means glad, a feeling, not an action."
  "ko-4405":
    "native": "Is the teacher going out?"
    "confusables":
      "w1":
        "why": "들어가다 (deureogada) means go in, the opposite."
      "w2":
        "why": "나오다 (naoda) means come out, not leave."
  "ko-4406":
    "native": "Is the teacher calling?"
    "confusables":
      "w1":
        "why": "이야기하다 (iyagihada) means talk in person, not call."
      "w2":
        "why": "게임하다 (geimhada) means play games."
  "ko-4407":
    "native": "I pay for the coffee."
    "confusables":
      "w1":
        "why": "주문하다 (jumunhada) means order, before paying."
      "w2":
        "why": "준비하다 (junbihada) means prepare."
  "ko-4408":
    "native": "The teacher helps me."
    "confusables":
      "w1":
        "why": "도와주다 (dowajuda) means help in everyday speech; both mean help."
      "w2":
        "why": "시작하다 (sijakada) means begin."
