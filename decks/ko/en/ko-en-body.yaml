"description": "Parts of the body and the word for hurt, for telling a doctor where it hurts. Homographs are noted: 이 (tooth, this), 배 (belly, ship) and 위 (stomach, above). Not yet checked by a Korean speaker: please report any mistake."
"tags":
  - "beginner"
  - "unreviewed"
