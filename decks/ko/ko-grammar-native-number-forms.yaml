# Unit 31 (ko-grammar-counters). Sources read: en.wikipedia.org 'Korean numerals' (native and Sino-Korean sets, the attributive forms 한, 두, 세, 네, 스무 before counters, 석 and 넉, which system goes with which counter, 시 with native numerals and 분 with Sino-Korean, 6월 = 유월 and 10월 = 시월) and 'Korean count word' (the list of count words),
