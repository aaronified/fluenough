# The order Korean is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner
# from English is taught ko-en-<name> for ko-<name> (ADR-0013, ADR-0036).
#
# This is also Korean's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"):
# every unit from the first words to B1, the first written and the rest planned, with its size
# in words, its grammar topics, the three milestones, and for each planned
# unit its listening and reading passages. A unit with no deck yet is
# planned: the course teaches it as "Coming" until a deck is written. A
# theme named here that decks/themes.yaml does not list yet is added to it
# with its first deck.
#
# Sizes. The plan's levels are about 700, 900 and 1,200 words (low
# confidence). Korean is tier V (docs/plans/language-paths-scheme.md,
# x3.7 in time), and a Korean B1 needs more words than a Romance one (the
# word lists behind TOPIK levels 1 to 3 are usually given as about 800,
# 1,500 to 2,000 and 3,000 or more words; low confidence), so the levels
# here are raised to about 800, 1,050 and 1,500 words, about 3,350 in all,
# as Japanese's are: the most the validator's range (2,000-3,500 up to
# B1, each level within half to one and a half times its size) allows. The
# tier stretches the time a level takes, not the words it holds. Sizes are
# one number for every native language.
#
# Readings are based on the Revised Romanization of Korean (RR, 2000), the
# standard romanisation of South Korea, as Japanese's are based on Hepburn:
# a card's reading follows how the word is said, so it shows the sound
# changes between syllables (hangugeo, gamsahamnida), as RR does; the
# course's romanisation file says where a reading differs from RR's
# spelling rules. The romanisation is never claimed to follow RR strictly.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"):
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units, read in the romanisation;
# 3. the script, Hangul, after the first word units ("After units 4-6"):
#    it comes after unit 4, the earliest the design allows, because Hangul
#    is small (24 letters, 40 with the doubled consonants and compound
#    vowels) and regular, so the rest of the course can be read in it; a
#    learner who learns without the script skips it (#554). Hanja are not
#    taught (#379);
# 4. a core of about 200 common words in themed units, before the large
#    tables ("Yes, smaller (~200)");
# 5. rules as forms: the copula and the particles first (Korean's
#    postpositions), then the polite verb endings, practised on the words
#    already known;
# 6. sentences, each after its words and rules; then the other themes,
#    each its words, then its rules, then its sentences.
# Korean's grammar keeps the order of docs/plans/language-paths-scheme.md
# within each level: Hangul, the sound changes, greetings, native and
# Sino-Korean numbers, the particles, the polite -yo, the tenses, the
# connective endings, the speech levels, then the honorifics. The polite
# speech level (haeyo-che) is taught first and used through A1; the
# formal (hamnida-che) and the casual (banmal) come in A2, the written
# plain style (haera-che) in B1. The sound changes between syllables come
# in three steps: linking with the final consonants in the script, then
# nasalisation, tensing and the rest as rules beside the words that show
# them.
#
# Script units not written yet. The format has no planned form for an
# alphabet unit, which counts neither words nor grammar: a planned unit is
# a theme, which counts words, or a grammar topic. So each planned script
# unit is planned as a grammar unit of 0 words with a topic named
# script-..., and when its deck is written it becomes a plain list unit,
# its deck goes into alphabet, and its topic leaves the grammar count.
#
# Korean is written with spaces between phrases (eojeol), not between
# words: a particle or an ending is written joined to the word before it
# (jeoneun, "I" with the topic particle). So the B1 checks that split a
# card's text into words will meet joined forms, and each needs its base
# word given (DECK-FORMAT.md, "Base words: bases").
#
# The core's order is by judgement, most common first: about me, everyday
# verbs, the common adverbs and function words, how much and how many,
# describing words, time, where things are, more verbs. It was meant to
# come from Wikipedia's counts (tools/wikipedia_frequency.py, #516): order
# the core again from the counts once they are written.
#
# Every deck of Korean is listed exactly once.
schema: 1
kind: "path"
id: "ko-path"
language: "ko"
# No gender classes: a noun takes no gender (#512; DECK-FORMAT.md, Card data).
genders: []
# Where Korean is spoken, for a rater's region and a card's region note
# (ADR-0036): the usual dialect areas of the peninsula, which mostly follow
# the old provinces. The Central dialects are split into Seoul and
# Gyeonggi, whose speech is the basis of the South's standard, and Gangwon
# and Chungcheong, which raters tell apart; Gyeongsang (south-east) and
# Jeolla (south-west) each have one region, Jeju has its own, as its speech
# is the most distinct; North Korea is one region, whose standard
# (munhwaeo) is based on Pyongyang speech. Each is named with example
# cities so that a rater can place themselves. Low confidence on the
# grouping, on one region for all of North Korea, and on leaving out the
# Korean of Yanbian in China: a native reviewer checks this list before
# any rating names a region. The ids are permanent, as card ids are;
# rename a name, never an id. The app adds "Elsewhere" after them.
regions:
  - id: "seoul-gyeonggi"
    name: { "en": "Seoul and Gyeonggi (Seoul, Incheon, Suwon)" }
  - id: "gangwon"
    name: { "en": "Gangwon (Chuncheon, Gangneung, Wonju)" }
  - id: "chungcheong"
    name: { "en": "Chungcheong (Daejeon, Cheongju, Sejong)" }
  - id: "gyeongsang"
    name: { "en": "Gyeongsang (Busan, Daegu, Ulsan, Changwon)" }
  - id: "jeolla"
    name: { "en": "Jeolla (Gwangju, Jeonju, Mokpo, Yeosu)" }
  - id: "jeju"
    name: { "en": "Jeju (Jeju City, Seogwipo)" }
  - id: "north-korea"
    name: { "en": "North Korea (Pyongyang, Hamhung, Chongjin)" }
# The decks that need the alphabet: a learner who learns without it
# skips them. The planned script units join it as each is written.
alphabet: []
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  # 1. The phrasebook, taught whole from the first lesson, with the first
  # words beside it: ko-phrasebook (19 survival phrases, which count no
  # words) and ko-first-words (12 words).
  - decks: ["ko-phrasebook", "ko-first-words", "*"]
    words: 12
  # 2. The first word units, read in the romanisation.
  - decks: ["ko-sound-differences", "ko-sound-differences-sentences", "ko-reading-sound-differences", "*"]
    words: 16
    listening_passages:
      - { id: "plain-tense-aspirated", text: { "en": "Words told apart by a plain, a tense or an aspirated consonant: dal, ttal and tal; bul, ppul and pul" } }
    reading_passages:
      - { id: "sound-pairs-list", text: { "en": "A list of word triples in the romanisation that differ by one consonant" } }
  - decks: ["ko-questions", "ko-questions-sentences", "ko-reading-questions", "*"]
    words: 15
    listening_passages:
      - { id: "at-the-information-desk", text: { "en": "Asking who, what, where and when at an information desk" } }
    reading_passages:
      - { id: "visitor-faq", text: { "en": "A short visitor's sheet of questions and answers" } }
  - planned: { id: "ko-addressing", theme: "addressing", words: 20 }
    listening_passages:
      - { id: "ssi-and-seonsaengnim", text: { "en": "Meeting a teacher and a classmate: names with ssi and seonsaengnim, and no 'you'" } }
    reading_passages:
      - { id: "name-cards", text: { "en": "Business cards exchanged at a meeting, family name first" } }
  # 3. The script, Hangul, after the first four word units (#554: skipped
  # by a learner who learns without it): the basic vowels, the consonants
  # with their tense and aspirated sets, the compound vowels, then the
  # final consonants and how they link into the next syllable.
  - planned: { id: "ko-hangul-vowels", grammar: "script-hangul-vowels", words: 0 }
    listening_passages:
      - { id: "ten-vowels", text: { "en": "The ten basic vowels said slowly, each on its silent ieung: a, ya, eo, yeo, o, yo, u, yu, eu, i" } }
    reading_passages:
      - { id: "vowel-chart", text: { "en": "A chart of the basic vowels, built from a dot, a short line and a long line" } }
  - planned: { id: "ko-hangul-consonants", grammar: "script-hangul-consonants", words: 0 }
    listening_passages:
      - { id: "ga-kka-ka", text: { "en": "Each consonant with the vowel a, in its plain, tense and aspirated forms: ga, kka, ka; da, tta, ta" } }
    reading_passages:
      - { id: "first-syllable-blocks", text: { "en": "Simple syllable blocks on signs: a cafe, a bus, a bank" } }
  - planned: { id: "ko-hangul-compound-vowels", grammar: "script-hangul-compound-vowels", words: 0 }
    listening_passages:
      - { id: "ae-and-e", text: { "en": "The compound vowels, and the pairs most speakers no longer tell apart: ae and e, oe and we" } }
    reading_passages:
      - { id: "menu-words", text: { "en": "Words on a cafe menu with compound vowels: coffee, tea, water" } }
  - planned: { id: "ko-hangul-batchim", grammar: "script-hangul-batchim", words: 0 }
    listening_passages:
      - { id: "final-consonants", text: { "en": "The seven sounds a final consonant can have, and how one links into a following vowel: hangugeo" } }
    reading_passages:
      - { id: "street-names", text: { "en": "Street and station names with final consonants" } }
  - planned: { id: "ko-pronouns", theme: "pronouns", words: 20 }
    listening_passages:
      - { id: "who-is-that", text: { "en": "Pointing out who is who in a group photo: I, the humble I, this person, that person" } }
    reading_passages:
      - { id: "class-photo-caption", text: { "en": "A caption under a class photo naming each person" } }
  - planned: { id: "ko-family", theme: "family", words: 35 }
    listening_passages:
      - { id: "older-brother-older-sister", text: { "en": "Naming your older brother and sister, which depends on whether you are a man or a woman: hyeong, oppa, nuna, eonni" } }
    reading_passages:
      - { id: "family-introduction", text: { "en": "A short self-introduction naming the family" } }
  - planned: { id: "ko-numbers-1-20", theme: "numbers-1-20", words: 25 }
    listening_passages:
      - { id: "two-ways-to-count", text: { "en": "Counting from one to ten twice: hana, dul, set and il, i, sam" } }
    reading_passages:
      - { id: "locker-numbers", text: { "en": "Locker numbers at a subway station" } }
  # 4. The core: about 200 common words, most common first (by judgement
  # until the Wikipedia counts are written, #516).
  - planned: { id: "ko-about-me", theme: "about-me", words: 20 }
    listening_passages:
      - { id: "self-introduction", text: { "en": "A self-introduction on the first day at a language school" } }
    reading_passages:
      - { id: "registration-card", text: { "en": "A registration card: name, age, country, job" } }
  - planned: { id: "ko-everyday-verbs", theme: "everyday-verbs", words: 35 }
    listening_passages:
      - { id: "a-morning-at-home", text: { "en": "A mother says what each person in the house does in the morning" } }
    reading_passages:
      - { id: "note-on-the-fridge", text: { "en": "A note on the fridge: what to eat, what to drink, when to come home" } }
  - planned: { id: "ko-adverbs", theme: "adverbs", words: 30 }
    listening_passages:
      - { id: "how-often", text: { "en": "Saying how often and how well things are done" } }
    reading_passages:
      - { id: "habit-survey", text: { "en": "A short survey about everyday habits" } }
  - planned: { id: "ko-quantities", theme: "quantities", words: 20 }
    listening_passages:
      - { id: "how-many-do-you-want", text: { "en": "Asking how much and how many at a bakery" } }
    reading_passages:
      - { id: "recipe-amounts", text: { "en": "The amounts on a recipe card" } }
  - planned: { id: "ko-describing", theme: "describing", words: 35 }
    listening_passages:
      - { id: "how-is-it", text: { "en": "A friend asks about your new room: big, quiet, clean" } }
    reading_passages:
      - { id: "postcard-from-busan", text: { "en": "A short postcard from Busan: the weather, the food, the sea" } }
  - planned: { id: "ko-time", theme: "time", words: 25 }
    listening_passages:
      - { id: "what-time-is-it", text: { "en": "Asking and telling the time: native numbers for the hours, Sino-Korean for the minutes" } }
    reading_passages:
      - { id: "shop-hours", text: { "en": "The opening hours on a shop door" } }
  - planned: { id: "ko-location", theme: "location", words: 15 }
    listening_passages:
      - { id: "where-is-my-key", text: { "en": "Looking for a key: on, under, in, next to" } }
    reading_passages:
      - { id: "room-layout", text: { "en": "A note saying where things are in a room" } }
  - planned: { id: "ko-more-verbs", theme: "more-verbs", words: 30 }
    listening_passages:
      - { id: "weekend-chores", text: { "en": "Someone lists what they will do this weekend" } }
    reading_passages:
      - { id: "to-do-list", text: { "en": "A short to-do list" } }
  # 5. Rules as forms, practised on the words known: how syllables change
  # each other, the copula and the particles first, then the polite
  # present, negation, existence, the demonstratives and more particles.
  - planned: { id: "ko-grammar-sound-changes-1", grammar: ["liaison", "nasalisation"] }
    listening_passages:
      - { id: "said-not-spelled", text: { "en": "Words said otherwise than spelled: a final consonant moving on (meogeoyo), and k, t, p turning nasal before n and m (gamsahamnida, hangnyeon)" } }
    reading_passages:
      - { id: "spelling-and-sound", text: { "en": "A short list of words with their spelling and how they are said, side by side" } }
  - planned: { id: "ko-grammar-copula", grammar: ["copula-ieyo", "copula-aniyeyo"] }
    listening_passages:
      - { id: "i-am-a-student", text: { "en": "Saying who and what you are, and are not: a student, not a teacher" } }
    reading_passages:
      - { id: "profile-card", text: { "en": "A profile card: what each person is and is not" } }
  - planned: { id: "ko-grammar-topic-subject", grammar: ["particle-eun-neun", "particle-i-ga"] }
    listening_passages:
      - { id: "as-for-me", text: { "en": "Saying what you are talking about and who does it: eun and neun, i and ga, after a consonant and after a vowel" } }
    reading_passages:
      - { id: "introductions-board", text: { "en": "A class board where each pupil writes one line about themselves" } }
  - planned: { id: "ko-grammar-object-place", grammar: ["particle-eul-reul", "particle-e", "particle-eseo"] }
    listening_passages:
      - { id: "who-does-what-where", text: { "en": "Saying what you eat, where you go and where you do it" } }
    reading_passages:
      - { id: "diary-lines", text: { "en": "A few diary lines: where I ate, what I bought, where I went" } }
  - planned: { id: "ko-grammar-haeyo-present", grammar: ["haeyo-present", "verb-stems"] }
    listening_passages:
      - { id: "what-do-you-do-on-sundays", text: { "en": "Saying politely what you do on Sundays: the endings ayo, eoyo and haeyo" } }
    reading_passages:
      - { id: "weekly-routine", text: { "en": "A weekly routine written in polite forms" } }
  - planned: { id: "ko-grammar-negation", grammar: ["an-negation", "ji-anayo"] }
    listening_passages:
      - { id: "i-dont-eat-meat", text: { "en": "Saying what you do not do, in the short form with an and the long form with ji anayo" } }
    reading_passages:
      - { id: "diet-card", text: { "en": "A card a diner gives a restaurant: what they do not eat" } }
  - planned: { id: "ko-grammar-isseoyo", grammar: ["isseoyo", "eopseoyo"] }
    listening_passages:
      - { id: "is-there-a-bank", text: { "en": "Asking whether there is a bank nearby, and saying what you have and do not have" } }
    reading_passages:
      - { id: "floor-guide", text: { "en": "A floor guide in a department store: what is on each floor" } }
  - planned: { id: "ko-grammar-demonstratives", grammar: "i-geu-jeo" }
    listening_passages:
      - { id: "this-one-that-one", text: { "en": "Pointing at things in a shop: this, that, that over there, which" } }
    reading_passages:
      - { id: "shop-labels", text: { "en": "Labels in a shop window pointing at its goods" } }
  - planned: { id: "ko-grammar-more-particles", grammar: ["particle-do", "particle-ui", "particle-hago", "buteo-kkaji", "particle-ege"] }
    listening_passages:
      - { id: "from-nine-to-six", text: { "en": "Saying from when to when, with whom, whose, to whom, and 'too'" } }
    reading_passages:
      - { id: "office-hours-note", text: { "en": "A note on office hours and who is in, from when to when" } }
  # 6. Sentences, each after its words and rules; then the other A1
  # themes, each its words, its rules, then its sentences.
  - planned: { id: "ko-work", theme: "work", words: 35 }
    listening_passages:
      - { id: "what-is-your-job", text: { "en": "Two people ask each other what they do for a living" } }
    reading_passages:
