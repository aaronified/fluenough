# Unit 26 (ko-grammar-isseoyo). Sources read: en.wikipedia.org 'Korean grammar' (copulative and existential verbs: 있다 'there is', 없다 'there isn't', the honorific 계시다) and 'Korean verbs' (existential verbs conjugate like action verbs; negation by a suppletive negative form),
# en.wiktionary.org entries 있다 and 없다 (senses, the example 전 은행 계좌가 없어요, the conjugation tables from which the polite forms 있어요 and 없어요 are copied), 안 (inherently negative verbs such as 없다).
