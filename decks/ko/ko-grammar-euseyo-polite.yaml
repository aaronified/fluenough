# Unit 43 (ko-grammar-requests). Sources read: en.wiktionary.org entries -으세요 / -세요 (honorific informal polite: declarative, interrogative, imperative; -세요 after a vowel and ㄹ; 마세요; 안녕하세요), 주다 (auxiliary after the infinitive: 도와주세요 'please help'),
# the honorific tables of each verb (…으세요, …세요 copied from them), and 드시다, 주무시다, 계시다 (their own tables); en.wikipedia.org 'Korean honorifics' (honorific suffix -시/-으시; suppletive 있다 -> 계시다, 먹다/마시다 -> 드시다) and 'Korean verbs' (자다 -> 주무시다).
