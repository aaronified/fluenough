# Unit 28 (ko-grammar-more-particles). Sources read: en.wikipedia.org 'Korean postpositions' (도, 의, 와/과/랑, 하고, 부터, 까지, 에게/한테, 께) and 'Korean grammar' (case and informational clitics; the topic and additive markers override 이/가 and 을/를),
# en.wiktionary.org entries -도, -의, -하고, -부터, -까지, -에게 (senses and usage notes) and the conjugation table of 전화하다 and 가다 for the polite verbs. Forms are built by rule and checked against tools/transcribe.py ko.
