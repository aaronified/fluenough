# Unit 36 (ko-grammar-past). Sources read: en.wikipedia.org 'Korean verbs' (the past suffix -았/-었 after the infinitive and its contractions: 가 is 갔, 오 is 왔, 하 is 했; the polite suffix 요) and 'Korean grammar',
# en.wiktionary.org: the conjugation table of every verb used (the informal polite past is copied from it), the entries -이다 and 아니다 (copula past forms -이었어요, -였어요, 아니었어요) and example sentences on 하다, 신, 나라 and 내 (…이었다, …였다) read in the kaikki.org Korean extract.
