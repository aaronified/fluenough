# Unit 21 (ko-grammar-copula). Sources read: en.wiktionary.org pages -이다 (the copula: polite -이에요 / -예요, the 이 dropping after a vowel, written joined to the noun) and 아니다 (the negative copula: written after a space, its complement takes -이 or -가, polite 아니에요), and en.wikipedia.org 'Korean grammar' (copulative verbs).
