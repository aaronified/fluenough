# Unit 20 (ko-grammar-sound-changes-1). Sources read: en.wikipedia.org 'Korean phonology' (consonant assimilation: obstruents become nasals before nasals),
# en.wiktionary.org pages 한국어, 한국말, 학년, 작년, 십만, 감사합니다, 직업, 영어 (pronunciation: 'Phonetic hangul') and the conjugation tables of 먹다, 읽다, 있다 (their Revised Romanization of 먹는, 읽는, 있는).
# Respelled forms of noun + particle are rule-derived and checked against tools/transcribe.py: the reading of the respelling equals the reading of the spelling.
