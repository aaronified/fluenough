schema: 1
id: "lus-en-first-words"
kind: "layer"
core: "lus-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "The pronouns I, you, he or she, we and they, the numbers one to ten, the family words mother, father and child, and a few everyday words such as water, rice, good and here. Not yet checked by a Mizo speaker: please report any mistake."
cards:
  "lus-0001":
    native: "I"
    notes:
      "n1": "Ka is 'I'. It is the plain form used in ordinary speech."
  "lus-0002":
    native: "you (singular)"
    notes:
      "n1": "Nang is 'you' for one person. Mizo has a separate word for many people, which is not taught here."
  "lus-0003":
    native: "he; she"
    notes:
      "n1": "A is 'he' or 'she'. Mizo does not mark gender in its pronouns, so the same word serves both."
  "lus-0004":
    native: "we"
    notes:
      "n1": "Kan is 'we'. It includes the person you are speaking to."
  "lus-0005":
    native: "they"
    notes:
      "n1": "An is 'they', for more than one person."
  "lus-0006":
    native: "one"
    notes:
      "n1": "Pakhat is 'one'. The pa- is a prefix used when counting people and things, as in pahnih (two)."
  "lus-0007":
    native: "two"
    notes:
      "n1": "Pahnih is 'two'."
  "lus-0008":
    native: "three"
    notes:
      "n1": "Pathum is 'three'."
  "lus-0009":
    native: "four"
    notes:
      "n1": "Pali is 'four'."
  "lus-0010":
    native: "five"
    notes:
      "n1": "Panga is 'five'."
  "lus-0011":
    native: "six"
    notes:
      "n1": "Paruk is 'six'."
  "lus-0012":
    native: "seven"
    notes:
      "n1": "Pasarih is 'seven'."
  "lus-0013":
    native: "eight"
    notes:
      "n1": "Pariat is 'eight'."
  "lus-0014":
    native: "nine"
    notes:
      "n1": "Pakua is 'nine'."
  "lus-0015":
    native: "ten"
    notes:
      "n1": "Sawm is 'ten'. Numbers from eleven are made with leh (and)."
  "lus-0016":
    native: "mother"
    notes:
      "n1": "Nu is 'mother'. The word for 'your mother' is i nu."
  "lus-0017":
    native: "father"
    notes:
      "n1": "Pa is 'father'. The word for 'my father' is ka pa."
  "lus-0018":
    native: "child"
    notes:
      "n1": "Naupang is 'child'. An older grammar glosses it as 'boy', so check it with a speaker before use."
  "lus-0019":
    native: "man; person"
    notes:
      "n1": "Mi is 'man' or 'person'."
    examples:
      "Mi tha.":
        native: "A good man."
        bases:
          "Mi": "man"
          "tha": "good"
  "lus-0020":
    native: "water"
    notes:
      "n1": "Tui is 'water'. It also means any liquid."
  "lus-0021":
    native: "rice"
    notes:
      "n1": "Buh is 'rice'. It is listed as the word for rice in an older grammar."
  "lus-0022":
    native: "good"
    notes:
      "n1": "Tha is 'good'."
  "lus-0023":
    native: "big; large"
    notes:
      "n1": "Lian is 'big' or 'large'."
  "lus-0024":
    native: "here"
    notes:
      "n1": "Heta is 'here'."
  "lus-0025":
    native: "what"
    notes:
      "n1": "Eng is 'what'. A question is made by adding -nge, as in eng-nge (what?)."
  "lus-0026":
    native: "who"
    notes:
      "n1": "Tu is 'who'. A question is made by adding -nge, as in tu-nge (who?)."
  "lus-0027":
    native: "where"
    notes:
      "n1": "Khoi is 'where'. An older grammar gives it in the question khoi-a-nge (where?). Check it with a speaker before use."
  "lus-0028":
    native: "yes"
    notes:
      "n1": "Aw is 'yes'. An older grammar gives it as the answer yes. Check it with a speaker before use."
  "lus-0029":
    native: "no"
    notes:
      "n1": "Nilo is given as 'no' in an older grammar. Check it with a speaker before use."
