description: "Twenty-one things to say from the first day, before their words are taught: greetings and goodbyes, thanks and sorry, please, the way to say you do not understand or know, to ask a price or a place, to ask for help, and how to say your name. Po is a polite word added to show respect to elders and strangers. Not yet checked by a Filipino speaker: please report any mistake."
