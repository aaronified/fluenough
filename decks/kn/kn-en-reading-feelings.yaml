passages:
  - id: "kn-feelings-passage"
    title: "A letter to a friend"
    sentences:
      - text: "ಗೆಳೆಯ, ನನಗೆ ಈಗ ಚಿಂತೆ ಇದೆ."
        reading: "geḷeya, nanage īga cinte ide."
        ipa: "ɡeɭeja nanaɡe iːɡa tʃint̪e id̪e"
      - text: "ಪರೀಕ್ಷೆಯ ಭಯ ಇದೆ."
        reading: "parīkṣeya bhaya ide."
        ipa: "pariːkʂeja bʱaja id̪e"
      - text: "ನಿನ್ನ ಸಹಾಯ ಇದೆ, ನೆಮ್ಮದಿ ಆಯಿತು."
        reading: "ninna sahāya ide, nemmadi āyitu."
        ipa: "ninna sahaːja id̪e nemmad̪i aːjit̪u"
      - text: "ನಿನ್ನನ್ನು ನೋಡಿ ಖುಷಿ ಆಗುತ್ತಿದೆ."
        reading: "ninnannu nōḍi khuṣi āguttide."
        ipa: "ninnannu noːɖi kʰuʂi aːɡut̪t̪id̪e"
      - text: "ಬೇಗ ಬಾ."
        reading: "bēga bā."
        ipa: "beːɡa baː"
    questions:
      - id: "kn-9024"
        prompt: { en: "What does the writer feel about the exam?" }
        options:
          - { en: "Fear" }
          - { en: "Pride" }
          - { en: "Jealousy" }
        answer: 1
      - id: "kn-9025"
        prompt: { en: "Your help brought peace to the writer." }
        answer: true
      - id: "kn-9026"
        prompt: { en: "The writer asks the friend to come soon." }
        answer: true
