schema: 1
id: kn-en-grammar-conjunctions
name: "Joining words"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN, icon: "ಕ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "And, but, or, because, if: joining words and sentences. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: kn-0504
    target: "ಮತ್ತು"
    native: "and"
    reading: "mattu"
    ipa: "mat̪t̪u"
    pos: "other"
    notes: "Between two nouns speech often puts -ಊ on both: ಅಪ್ಪನೂ ಅಮ್ಮನೂ, father and mother."
  - id: kn-0505
    target: "ಆದರೆ"
    native: "but"
    reading: "ādare"
    ipa: "aːd̪are"
    pos: "other"
    notes: "Also 'if it is': ಹಾಗಾದರೆ (hāgādare), if so, then."
  - id: kn-0506
    target: "ಅಥವಾ"
    native: "or"
    reading: "athavā"
    ipa: "at̪ʰaʋaː"
    pos: "other"
    notes: "In a question, speech asks twice: ಟೀ ಬೇಕಾ, ಕಾಫಿ ಬೇಕಾ? tea or coffee?"
  - id: kn-0507
    target: "ಯಾಕೆಂದರೆ"
    native: "because"
    reading: "yākendare"
    ipa: "jaːkend̪are"
    alt_target: ["ಏಕೆಂದರೆ"]
    pos: "other"
    notes: "'If you say why': the reason comes after it."
  - id: kn-0508
    target: "ಅದಕ್ಕೆ"
    native: "that's why; so"
    reading: "adakke"
    ipa: "ad̪akke"
    pos: "other"
    notes: "Literally 'for that'."
  - id: kn-0509
    target: "ಅಂತ"
    native: "that (quoting what is said or thought)"
    reading: "anta"
    ipa: "ant̪a"
    alt_target: ["ಎಂದು"]
    pos: "other"
    notes: "After the words quoted: ಅವನು ಬರುತ್ತೇನೆ ಅಂತ ಹೇಳಿದ, he said he would come. Written ಎಂದು (endu)."
  - id: kn-0510
    target: "ಬಂದರೆ"
    native: "if (someone) comes"
    reading: "bandare"
    ipa: "band̪are"
    pos: "other"
    notes: "'If' is the ending -ಅರೆ: ಮಾಡಿದರೆ, if (you) do; ಹೋದರೆ, if (you) go."
  - id: kn-0511
    target: "ಕೂಡ"
    native: "also; too; even"
    reading: "kūḍa"
    ipa: "kuːɖa"
    alt_target: ["ಕೂಡಾ"]
    pos: "other"
    notes: "Also the ending -ಊ: ನಾನೂ, me too."
  - ref: kn-0446
  - id: kn-0512
    target: "ಇಲ್ಲದಿದ್ದರೆ"
    native: "otherwise; or else"
    reading: "illadiddare"
    ipa: "illad̪id̪d̪are"
    pos: "other"
