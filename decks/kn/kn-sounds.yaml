# Kannada's sound contrasts: pairs of letters or signs that change a word,
# for the speaking drill's feedback (#89) and the minimal-pair drill (#31).
# Each id is the tag the language's sound-differences deck uses. See
# ADR-0015 and docs/DECK-FORMAT.md.
schema: 1
kind: "sounds"
part: "core"
id: "kn-sounds"
language: "kn"
contrasts:
  - id: "vowel-length"
    pairs: [["", "ಾ"], ["ಿ", "ೀ"], ["ು", "ೂ"], ["ೆ", "ೇ"], ["ೊ", "ೋ"], ["ಅ", "ಆ"], ["ಇ", "ಈ"], ["ಉ", "ಊ"], ["ಎ", "ಏ"], ["ಒ", "ಓ"]]
  - id: "dental-retroflex"
    pairs: [["ತ", "ಟ"], ["ಥ", "ಠ"], ["ದ", "ಡ"], ["ಧ", "ಢ"], ["ನ", "ಣ"]]
  - id: "lateral"
    pairs: [["ಲ", "ಳ"]]
  - id: "gemination"
    pairs: [["ಕ", "ಕ್ಕ"], ["ಗ", "ಗ್ಗ"], ["ಚ", "ಚ್ಚ"], ["ಟ", "ಟ್ಟ"], ["ಡ", "ಡ್ಡ"], ["ತ", "ತ್ತ"], ["ದ", "ದ್ದ"], ["ನ", "ನ್ನ"], ["ಣ", "ಣ್ಣ"], ["ಪ", "ಪ್ಪ"], ["ಬ", "ಬ್ಬ"], ["ಮ", "ಮ್ಮ"], ["ಲ", "ಲ್ಲ"], ["ಳ", "ಳ್ಳ"], ["ಯ", "ಯ್ಯ"]]
  - id: "aspiration"
    pairs: [["ಕ", "ಖ"], ["ಗ", "ಘ"], ["ಚ", "ಛ"], ["ಜ", "ಝ"], ["ಟ", "ಠ"], ["ಡ", "ಢ"], ["ತ", "ಥ"], ["ದ", "ಧ"], ["ಪ", "ಫ"], ["ಬ", "ಭ"]]
