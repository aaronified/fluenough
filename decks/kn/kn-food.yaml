  - id: "kn-0756"
    target: "ಚಹಾ"
    reading: "cahā"
    ipa: "tʃahaː"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ನಾನು ಬೆಳಿಗ್ಗೆ ಚಹಾ ಕುಡಿಯುತ್ತೇನೆ.", reading: "nānu beḷigge cahā kuḍiyuttēne.", ipa: "naːnu beɭiɡɡe tʃahaː kuɖijut̪t̪eːne", bases: [{ word: "ಬೆಳಿಗ್ಗೆ", base: "ಬೆಳಿಗ್ಗೆ", reading: "beḷigge" }, { word: "ಕುಡಿಯುತ್ತೇನೆ", base: "ಕುಡಿ", reading: "kuḍi" }, { word: "ನಾನು", base: "ನಾನು", reading: "nānu" }] }
