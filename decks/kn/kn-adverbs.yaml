      - { target: "ಇನ್ನೂ ಊಟ ಆಗಿಲ್ಲ.", reading: "innū ūṭa āgilla.", ipa: "innuː uːʈa aːɡilla", bases: [{ word: "ಊಟ", base: "ಊಟ", reading: "ūṭa" }, { word: "ಆಗಿಲ್ಲ", base: "ಆಗು", reading: "āgu" }] }
  - id: "kn-0671"
    target: "ಸದಾ"
