    examples:
      - { target: "ಬಹುಶಃ ಅವನು ಬರುತ್ತಾನೆ.", reading: "bahuśaḥ avanu baruttāne.", ipa: "bahuʃah aʋanu barut̪t̪aːne", bases: [{ word: "ಬರುತ್ತಾನೆ", base: "ಬಾ", reading: "bā" }] }
      - { target: "ಬಹುಶಃ ಮಳೆ ಬರುತ್ತದೆ.", reading: "bahuśaḥ maḷe baruttade.", ipa: "bahuʃah maɭe barut̪t̪ad̪e", bases: [{ word: "ಮಳೆ", base: "ಮಳೆ", reading: "maḷe" }, { word: "ಬರುತ್ತದೆ", base: "ಬಾ", reading: "bā" }] }
  - id: "kn-0673"
    target: "ಸಾಮಾನ್ಯವಾಗಿ"
    reading: "sāmānyavāgi"
    ipa: "saːmaːnjaʋaːɡi"
    pos: "adv"
    notes:
