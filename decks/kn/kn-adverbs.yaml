    examples:
      - { target: "ಅವಳು ಸಾಮಾನ್ಯವಾಗಿ ಬೆಳಿಗ್ಗೆ ಬೇಗ ಏಳುತ್ತಾಳೆ.", reading: "avaḷu sāmānyavāgi beḷigge bēga ēḷuttāḷe.", ipa: "aʋaɭu saːmaːnjaʋaːɡi beɭiɡɡe beːɡa eːɭut̪t̪aːɭe", bases: [{ word: "ಬೆಳಿಗ್ಗೆ", base: "ಬೆಳಿಗ್ಗೆ", reading: "beḷigge" }, { word: "ಏಳುತ್ತಾಳೆ", base: "ಏಳು", reading: "ēḷu" }] }
      - { target: "ನಾನು ಸಾಮಾನ್ಯವಾಗಿ ಮನೆಯಲ್ಲಿ ಇರುತ್ತೇನೆ.", reading: "nānu sāmānyavāgi maneyalli iruttēne.", ipa: "naːnu saːmaːnjaʋaːɡi manejalli irut̪t̪eːne", bases: [{ word: "ಮನೆಯಲ್ಲಿ", base: "ಮನೆ", reading: "mane" }, { word: "ಇರುತ್ತೇನೆ", base: "ಇರು", reading: "iru" }] }
  - id: "kn-0674"
