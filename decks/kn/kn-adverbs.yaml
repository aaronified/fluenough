cards:
  - id: "kn-0657"
    target: "ಕೆಲವೊಮ್ಮೆ"
    reading: "kelavomme"
    ipa: "kelaʋomme"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ನಾನು ಕೆಲವೊಮ್ಮೆ ಸಿನಿಮಾ ನೋಡುತ್ತೇನೆ.", reading: "nānu kelavomme sinimā nōḍuttēne.", ipa: "naːnu kelaʋomme sinimaː noːɖut̪t̪eːne", bases: [{ word: "ಸಿನಿಮಾ", base: "ಸಿನಿಮಾ", reading: "sinimā" }, { word: "ನೋಡುತ್ತೇನೆ", base: "ನೋಡು", reading: "nōḍu" }] }
      - { target: "ಅವನು ಕೆಲವೊಮ್ಮೆ ತಡವಾಗಿ ಬರುತ್ತಾನೆ.", reading: "avanu kelavomme taḍavāgi baruttāne.", ipa: "aʋanu kelaʋomme t̪aɖaʋaːɡi barut̪t̪aːne", bases: [{ word: "ತಡವಾಗಿ", base: "ತಡ", reading: "taḍa" }, { word: "ಬರುತ್ತಾನೆ", base: "ಬಾ", reading: "bā" }] }
  - id: "kn-0658"
    target: "ಎಂದೂ"
    reading: "endū"
    ipa: "end̪uː"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ನಾನು ಎಂದೂ ಸುಳ್ಳು ಹೇಳುವುದಿಲ್ಲ.", reading: "nānu endū suḷḷu hēḷuvudilla.", ipa: "naːnu end̪uː suɭɭu heːɭuʋud̪illa", bases: [{ word: "ಸುಳ್ಳು", base: "ಸುಳ್ಳು", reading: "suḷḷu" }, { word: "ಹೇಳುವುದಿಲ್ಲ", base: "ಹೇಳು", reading: "hēḷu" }] }
      - { target: "ಅವಳು ಎಂದೂ ತಡ ಮಾಡುವುದಿಲ್ಲ.", reading: "avaḷu endū taḍa māḍuvudilla.", ipa: "aʋaɭu end̪uː t̪aɖa maːɖuʋud̪illa", bases: [{ word: "ತಡ", base: "ತಡ", reading: "taḍa" }, { word: "ಮಾಡುವುದಿಲ್ಲ", base: "ಮಾಡು", reading: "māḍu" }] }
  - id: "kn-0659"
    target: "ಆಗಾಗ"
    reading: "āgāga"
    ipa: "aːɡaːɡa"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ಅವರು ಆಗಾಗ ಊರಿಗೆ ಹೋಗುತ್ತಾರೆ.", reading: "avaru āgāga ūrige hōguttāre.", ipa: "aʋaru aːɡaːɡa uːriɡe hoːɡut̪t̪aːre", bases: [{ word: "ಊರಿಗೆ", base: "ಊರು", reading: "ūru" }, { word: "ಹೋಗುತ್ತಾರೆ", base: "ಹೋಗು", reading: "hōgu" }] }
      - { target: "ನಾನು ಆಗಾಗ ಚಹಾ ಕುಡಿಯುತ್ತೇನೆ.", reading: "nānu āgāga cahā kuḍiyuttēne.", ipa: "naːnu aːɡaːɡa tʃahaː kuɖijut̪t̪eːne", bases: [{ word: "ಚಹಾ", base: "ಚಹಾ", reading: "cahā" }, { word: "ಕುಡಿಯುತ್ತೇನೆ", base: "ಕುಡಿ", reading: "kuḍi" }] }
  - id: "kn-0660"
    target: "ಅಪರೂಪಕ್ಕೆ"
    reading: "aparūpakke"
    ipa: "aparuːpakke"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ಅವನು ಅಪರೂಪಕ್ಕೆ ಸಿನಿಮಾ ನೋಡುತ್ತಾನೆ.", reading: "avanu aparūpakke sinimā nōḍuttāne.", ipa: "aʋanu aparuːpakke sinimaː noːɖut̪t̪aːne", bases: [{ word: "ಸಿನಿಮಾ", base: "ಸಿನಿಮಾ", reading: "sinimā" }, { word: "ನೋಡುತ್ತಾನೆ", base: "ನೋಡು", reading: "nōḍu" }] }
      - { target: "ಅವಳು ಅಪರೂಪಕ್ಕೆ ಹೊರಗೆ ಊಟ ಮಾಡುತ್ತಾಳೆ.", reading: "avaḷu aparūpakke horage ūṭa māḍuttāḷe.", ipa: "aʋaɭu aparuːpakke horaɡe uːʈa maːɖut̪t̪aːɭe", bases: [{ word: "ಹೊರಗೆ", base: "ಹೊರಗೆ", reading: "horage" }, { word: "ಊಟ", base: "ಊಟ", reading: "ūṭa" }, { word: "ಮಾಡುತ್ತಾಳೆ", base: "ಮಾಡು", reading: "māḍu" }] }
  - id: "kn-0661"
    target: "ಬೇಗ"
    reading: "bēga"
    ipa: "beːɡa"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ನಾನು ಬೇಗ ಏಳುತ್ತೇನೆ.", reading: "nānu bēga ēḷuttēne.", ipa: "naːnu beːɡa eːɭut̪t̪eːne", bases: [{ word: "ಏಳುತ್ತೇನೆ", base: "ಏಳು", reading: "ēḷu" }] }
      - { target: "ಅವನು ಬೇಗ ಬಂದ.", reading: "avanu bēga banda.", ipa: "aʋanu beːɡa band̪a", bases: [{ word: "ಬಂದ", base: "ಬಾ", reading: "bā" }] }
  - id: "kn-0662"
    target: "ತಡವಾಗಿ"
    reading: "taḍavāgi"
    ipa: "t̪aɖaʋaːɡi"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ಅವರು ತಡವಾಗಿ ಮಲಗುತ್ತಾರೆ.", reading: "avaru taḍavāgi malaguttāre.", ipa: "aʋaru t̪aɖaʋaːɡi malaɡut̪t̪aːre", bases: [{ word: "ಮಲಗುತ್ತಾರೆ", base: "ಮಲಗು", reading: "malagu" }] }
      - { target: "ರೈಲು ತಡವಾಗಿ ಬಂದಿತು.", reading: "railu taḍavāgi banditu.", ipa: "railu t̪aɖaʋaːɡi band̪it̪u", bases: [{ word: "ರೈಲು", base: "ರೈಲು", reading: "railu" }, { word: "ಬಂದಿತು", base: "ಬಾ", reading: "bā" }] }
  - id: "kn-0663"
    target: "ನಿಧಾನವಾಗಿ"
    reading: "nidhānavāgi"
    ipa: "nid̪ʱaːnaʋaːɡi"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ದಯವಿಟ್ಟು ನಿಧಾನವಾಗಿ ಮಾತನಾಡಿ.", reading: "dayaviṭṭu nidhānavāgi mātanāḍi.", ipa: "d̪ajaʋiʈʈu nid̪ʱaːnaʋaːɡi maːt̪anaːɖi", bases: [{ word: "ದಯವಿಟ್ಟು", base: "ದಯವಿಟ್ಟು", reading: "dayaviṭṭu" }, { word: "ಮಾತನಾಡಿ", base: "ಮಾತನಾಡು", reading: "mātanāḍu" }] }
      - { target: "ಅವನು ನಿಧಾನವಾಗಿ ನಡೆಯುತ್ತಾನೆ.", reading: "avanu nidhānavāgi naḍeyuttāne.", ipa: "aʋanu nid̪ʱaːnaʋaːɡi naɖejut̪t̪aːne", bases: [{ word: "ನಡೆಯುತ್ತಾನೆ", base: "ನಡೆ", reading: "naḍe" }] }
  - id: "kn-0664"
    target: "ಚೆನ್ನಾಗಿ"
    reading: "cennāgi"
    ipa: "tʃennaːɡi"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ಅವಳು ಚೆನ್ನಾಗಿ ಹಾಡುತ್ತಾಳೆ.", reading: "avaḷu cennāgi hāḍuttāḷe.", ipa: "aʋaɭu tʃennaːɡi haːɖut̪t̪aːɭe", bases: [{ word: "ಹಾಡುತ್ತಾಳೆ", base: "ಹಾಡು", reading: "hāḍu" }] }
      - { target: "ನೀನು ಚೆನ್ನಾಗಿದ್ದೀಯ?", reading: "nīnu cennāgiddīya?", ipa: "niːnu tʃennaːɡid̪d̪iːja", bases: [{ word: "ಚೆನ್ನಾಗಿದ್ದೀಯ", base: "ಚೆನ್ನಾಗಿರು", reading: "cennāgiru" }] }
  - id: "kn-0665"
    target: "ಕೆಟ್ಟದಾಗಿ"
    reading: "keṭṭadāgi"
    ipa: "keʈʈad̪aːɡi"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ಅವನು ಕೆಟ್ಟದಾಗಿ ಓದುತ್ತಾನೆ.", reading: "avanu keṭṭadāgi ōduttāne.", ipa: "aʋanu keʈʈad̪aːɡi oːd̪ut̪t̪aːne", bases: [{ word: "ಓದುತ್ತಾನೆ", base: "ಓದು", reading: "ōdu" }] }
      - { target: "ಈ ಕೆಲಸ ಕೆಟ್ಟದಾಗಿ ಆಯಿತು.", reading: "ī kelasa keṭṭadāgi āyitu.", ipa: "iː kelasa keʈʈad̪aːɡi aːjit̪u", bases: [{ word: "ಕೆಲಸ", base: "ಕೆಲಸ", reading: "kelasa" }, { word: "ಆಯಿತು", base: "ಆಗು", reading: "āgu" }] }
  - id: "kn-0666"
    target: "ನಂತರ"
    reading: "nantara"
    ipa: "nant̪ara"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ನಂತರ ಮಾತನಾಡೋಣ.", reading: "nantara mātanāḍōṇa.", ipa: "nant̪ara maːt̪anaːɖoːɳa", bases: [{ word: "ಮಾತನಾಡೋಣ", base: "ಮಾತನಾಡು", reading: "mātanāḍu" }] }
      - { target: "ಊಟದ ನಂತರ ಕಾಫಿ ಕುಡಿಯುತ್ತೇನೆ.", reading: "ūṭada nantara kāfi kuḍiyuttēne.", ipa: "uːʈad̪a nant̪ara kaːfi kuɖijut̪t̪eːne", bases: [{ word: "ಊಟದ", base: "ಊಟ", reading: "ūṭa" }, { word: "ಕಾಫಿ", base: "ಕಾಫಿ", reading: "kāfi" }, { word: "ಕುಡಿಯುತ್ತೇನೆ", base: "ಕುಡಿ", reading: "kuḍi" }] }
  - id: "kn-0667"
    target: "ಮೊದಲು"
    reading: "modalu"
    ipa: "mod̪alu"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ನೀನು ಮೊದಲು ಹೋಗು.", reading: "nīnu modalu hōgu.", ipa: "niːnu mod̪alu hoːɡu", bases: [{ word: "ಹೋಗು", base: "ಹೋಗು", reading: "hōgu" }] }
      - { target: "ನಾನು ಮೊದಲು ಬಂದೆ.", reading: "nānu modalu bande.", ipa: "naːnu mod̪alu band̪e", bases: [{ word: "ಬಂದೆ", base: "ಬಾ", reading: "bā" }] }
  - id: "kn-0668"
    target: "ತುಂಬಾ"
    reading: "tumbā"
    ipa: "t̪umbaː"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ಈ ಮನೆ ತುಂಬಾ ದೊಡ್ಡದು.", reading: "ī mane tumbā doḍḍadu.", ipa: "iː mane t̪umbaː d̪oɖɖad̪u", bases: [{ word: "ಈ", base: "ಈ", reading: "ī" }, { word: "ಮನೆ", base: "ಮನೆ", reading: "mane" }, { word: "ದೊಡ್ಡದು", base: "ದೊಡ್ಡ", reading: "doḍḍa" }] }
      - { target: "ಅವನು ತುಂಬಾ ಊಟ ಮಾಡುತ್ತಾನೆ.", reading: "avanu tumbā ūṭa māḍuttāne.", ipa: "aʋanu t̪umbaː uːʈa maːɖut̪t̪aːne", bases: [{ word: "ಊಟ", base: "ಊಟ", reading: "ūṭa" }, { word: "ಮಾಡುತ್ತಾನೆ", base: "ಮಾಡು", reading: "māḍu" }] }
  - id: "kn-0669"
    target: "ಮತ್ತೆ"
    reading: "matte"
    ipa: "mat̪t̪e"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ಮತ್ತೆ ಹೇಳು.", reading: "matte hēḷu.", ipa: "mat̪t̪e heːɭu", bases: [{ word: "ಹೇಳು", base: "ಹೇಳು", reading: "hēḷu" }] }
      - { target: "ನಾಳೆ ಮತ್ತೆ ಬರುತ್ತೇನೆ.", reading: "nāḷe matte baruttēne.", ipa: "naːɭe mat̪t̪e barut̪t̪eːne", bases: [{ word: "ಬರುತ್ತೇನೆ", base: "ಬಾ", reading: "bā" }] }
  - id: "kn-0670"
    target: "ಇನ್ನೂ"
    reading: "innū"
    ipa: "innuː"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
