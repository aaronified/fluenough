      - { target: "ಅವರು ಸದಾ ನಗುತ್ತಾರೆ.", reading: "avaru sadā naguttāre.", ipa: "aʋaru sad̪aː naɡut̪t̪aːre", bases: [{ word: "ನಗುತ್ತಾರೆ", base: "ನಗು", reading: "nagu" }] }
      - { target: "ಅವನು ಸದಾ ಕೆಲಸ ಮಾಡುತ್ತಾನೆ.", reading: "avanu sadā kelasa māḍuttāne.", ipa: "aʋanu sad̪aː kelasa maːɖut̪t̪aːne", bases: [{ word: "ಕೆಲಸ", base: "ಕೆಲಸ", reading: "kelasa" }, { word: "ಮಾಡುತ್ತಾನೆ", base: "ಮಾಡು", reading: "māḍu" }] }
  - id: "kn-0672"
    target: "ಬಹುಶಃ"
    reading: "bahuśaḥ"
    ipa: "bahuʃah"
    pos: "adv"
    notes:
