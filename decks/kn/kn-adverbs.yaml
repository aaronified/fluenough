      - { target: "ನಿನ್ನ ಉತ್ತರ ಸರಿಯಾಗಿದೆ.", reading: "ninna uttara sariyāgide.", ipa: "ninna ut̪t̪ara sarijaːɡid̪e", bases: [{ word: "ಉತ್ತರ", base: "ಉತ್ತರ", reading: "uttara" }, { word: "ಸರಿಯಾಗಿದೆ", base: "ಸರಿ", reading: "sari" }] }
  - id: "kn-0675"
    target: "ಜೋರಾಗಿ"
