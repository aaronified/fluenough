cards:
  - id: kn-0366
    target: "… ಎಲ್ಲಿದೆ?"
    native: "Where is …?"
    reading: "… ellide?"
    pos: "phrase"
    notes: "ಎಲ್ಲಿ (where) + ಇದೆ (is): ಬಸ್ ನಿಲ್ದಾಣ ಎಲ್ಲಿದೆ? Where is the bus stop?"
  - id: kn-0367
    target: "ಬಲಕ್ಕೆ"
    native: "to the right"
    reading: "balakke"
    pos: "other"
    notes: "ಬಲ (bala), the right side, + -ಕ್ಕೆ. On the right: ಬಲಗಡೆ (balagade)."
  - id: kn-0368
    target: "ಎಡಕ್ಕೆ"
    native: "to the left"
    reading: "edakke"
    pos: "other"
    notes: "ಎಡ (eda), the left side. On the left: ಎಡಗಡೆ (edagade)."
  - id: kn-0369
    target: "ನೇರವಾಗಿ"
    native: "straight on"
    reading: "neeravaagi"
    alt_target: ["ಸೀದಾ"]
    pos: "other"
    notes: "In speech also ಸೀದಾ (siidaa)."
  - id: kn-0370
    target: "ತಿರುಗಿ"
    native: "please turn"
    reading: "tirugi"
    pos: "other"
    notes: "ಎಡಕ್ಕೆ ತಿರುಗಿ, turn left, please."
  - id: kn-0371
    target: "ಮುಂದೆ"
    native: "ahead; in front"
    reading: "munde"
    pos: "other"
  - id: kn-0372
    target: "ಹಿಂದೆ"
    native: "behind; back"
    reading: "hinde"
    pos: "other"
  - id: kn-0373
    target: "ಹತ್ತಿರ"
    native: "near"
    reading: "hattira"
    pos: "other"
    notes: "After a noun: ಸ್ಟೇಷನ್ ಹತ್ತಿರ, near the station."
  - id: kn-0374
    target: "ದೂರ"
    native: "far; distance"
    reading: "duura"
    pos: "other"
  - id: kn-0375
    target: "ಇಲ್ಲಿ"
    native: "here"
    reading: "illi"
    pos: "other"
