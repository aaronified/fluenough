    target: "ದಾರಿ"
    native: "way; route"
    reading: "daari"
    pos: "noun"
    notes: "ದಾರಿ ತಪ್ಪಿದೆ (daari tappide), I've lost my way."
  - id: kn-0378
    target: "ರಸ್ತೆ"
    native: "road"
    reading: "raste"
    pos: "noun"
