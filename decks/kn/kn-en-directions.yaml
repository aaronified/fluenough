description: "Left, right, straight on, and asking where something is. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: kn-0366
    target: "… ಎಲ್ಲಿದೆ?"
    native: "Where is …?"
    reading: "... ellide?"
    ipa: "ellid̪e"
    pos: "phrase"
    notes: "ಎಲ್ಲಿ (where) + ಇದೆ (is): ಬಸ್ ನಿಲ್ದಾಣ ಎಲ್ಲಿದೆ (bas nildāṇa ellide)? Where is the bus stop?"
  - id: kn-0367
    target: "ಬಲಕ್ಕೆ"
    native: "to the right"
    reading: "balakke"
    ipa: "balakke"
    pos: "other"
    notes: "ಬಲ (bala), the right side, + -ಕ್ಕೆ (-kke). On the right: ಬಲಗಡೆ (balagaḍe)."
  - id: kn-0368
    target: "ಎಡಕ್ಕೆ"
    native: "to the left"
    reading: "eḍakke"
    ipa: "eɖakke"
    pos: "other"
    notes: "ಎಡ (eḍa), the left side. On the left: ಎಡಗಡೆ (eḍagaḍe)."
  - id: kn-0369
    target: "ನೇರವಾಗಿ"
    native: "straight on"
    reading: "nēravāgi"
    ipa: "neːraʋaːɡi"
    alt_target: ["ಸೀದಾ"]
    pos: "other"
    notes: "In speech also ಸೀದಾ (sīdā)."
  - id: kn-0370
    target: "ತಿರುಗಿ"
    native: "please turn"
    reading: "tirugi"
    ipa: "t̪iruɡi"
    pos: "other"
    notes: "ಎಡಕ್ಕೆ ತಿರುಗಿ (eḍakke tirugi), turn left, please."
  - id: kn-0371
    target: "ಮುಂದೆ"
    native: "ahead; in front"
    reading: "munde"
    ipa: "mund̪e"
    pos: "other"
  - id: kn-0372
    target: "ಹಿಂದೆ"
    native: "behind; back"
    reading: "hinde"
    ipa: "hind̪e"
    pos: "other"
  - id: kn-0373
    target: "ಹತ್ತಿರ"
    native: "near"
    reading: "hattira"
    ipa: "hat̪t̪ira"
    pos: "other"
    notes: "After a noun: ಸ್ಟೇಷನ್ ಹತ್ತಿರ (sṭēṣan hattira), near the station."
  - id: kn-0374
    target: "ದೂರ"
