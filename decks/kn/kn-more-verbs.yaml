      - { target: "ಅವನು ಸಕ್ಕರೆ ಹಾಲಿನಲ್ಲಿ ಬೆರೆಸುತ್ತಾನೆ.", reading: "avanu sakkare hālinalli beresuttāne.", ipa: "aʋanu sakkare haːlinalli beresut̪t̪aːne", bases: [{ word: "ಸಕ್ಕರೆ", base: "ಸಕ್ಕರೆ", reading: "sakkare" }, { word: "ಹಾಲಿನಲ್ಲಿ", base: "ಹಾಲು", reading: "hālu" }, { word: "ಬೆರೆಸುತ್ತಾನೆ", base: "ಬೆರೆಸು", reading: "beresu" }, { word: "ಅವನು", base: "ಅವನು", reading: "avanu" }] }
  - id: "kn-0736"
