    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ಅವಳು ಈರುಳ್ಳಿ ಕತ್ತರಿಸುತ್ತಾಳೆ.", reading: "avaḷu īruḷḷi kattarisuttāḷe.", ipa: "aʋaɭu iːruɭɭi kat̪t̪arisut̪t̪aːɭe", bases: [{ word: "ಈರುಳ್ಳಿ", base: "ಈರುಳ್ಳಿ", reading: "īruḷḷi" }, { word: "ಕತ್ತರಿಸುತ್ತಾಳೆ", base: "ಕತ್ತರಿಸು", reading: "kattarisu" }, { word: "ಅವಳು", base: "ಅವಳು", reading: "avaḷu" }] }
