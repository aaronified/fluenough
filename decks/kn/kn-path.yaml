# The order Kannada is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner
# from English is taught kn-en-home for kn-home (ADR-0013, ADR-0036).
#
# This is also Kannada's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"): every
# unit from the first words to B1, written or planned, with its size in
# words, its grammar topics, the three milestones, and for each planned unit
# its listening and reading passages. A unit with no deck yet is planned:
# the course teaches it as "Coming" until a deck is written. Sizes follow
# the plan's levels (about 700, 900 and 1,200 words; low confidence) and are
# one number for every native language; a written unit's size is what its
# decks hold today. A theme named here that decks/themes.yaml does not list
# yet is added to it with its first deck.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"):
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units;
# 3. the script, after the first six units ("After units 4-6"); a
#    learner who already reads it skips it (#554);
# 4. a core of about 200 common words in themed units, before the large
#    tables ("Yes, smaller (~200)");
# 5. rules as forms: noun endings, postpositions and conjunctions first,
#    then pronoun and verb forms, practised on the words already known;
# 6. sentences, each after its words and rules; then the other themes,
#    each its words, then its rules, then its sentences.
# Kannada's grammar keeps its own order within each level: be, the present,
# the imperatives, case endings, verbs by gender and number, the dative of
# experience, the past, then the written past-more unit with its conjunct
# and compound verbs (right after the simple past; its decks already teach
# the habitual past and the past continuous, so no habitual unit is
# planned), the perfect, the conjunctive participle (-ಇ (-i)), then the
# relative participles and the rest of B1.
#
# The core's order is by judgement, most common first:
# about me, everyday verbs (planned), the common adverbs and function
# words (planned), how much and how many (planned), describing words
# (planned), time, more verbs (planned), work.
# It was meant to come from Wikipedia's counts
# (tools/wikipedia_frequency.py, #516), but
# no Kannada Wikipedia dump could be fetched here (2026-10-17):
# order the core again from the counts once they are written.
#
# Every deck of Kannada is listed exactly once.
schema: 1
kind: "path"
id: "kn-path"
language: "kn"
# The gender classes a noun's gender is one of (#512; DECK-FORMAT.md, Card data).
genders: ["m", "f", "n"]
# The decks that need the alphabet: a learner who learns without it
# skips them.
alphabet:
  - "kn-script-vowels"
  - "kn-script-consonants"
  - "kn-script-reading"
  - "kn-script-vowel-signs"
  - "kn-script-conjuncts"
  - "kn-script-digits"
  - "kn-spelling"
  - "kn-reading-ravi"
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  # 1. The phrasebook, taught whole from the first lesson.
  - decks: ["kn-phrasebook", "kn-first-words", "*"]
    words: 1
  # 2. The first word units.
  - decks: ["kn-sound-differences"]
    words: 12
  - decks: ["kn-questions", "*"]
    words: 9
  - decks: ["kn-addressing", "*"]
    words: 12
  - decks: ["kn-pronouns", "*"]
    words: 24
    listening_passages:
      - { id: "who-is-who", text: { "en": "Pointing out who is who at a family gathering: he, she, they" } }
    reading_passages:
      - { id: "seating-chart", text: { "en": "A seating chart for a wedding lunch, with names and who is related to whom" } }
  - decks: ["kn-family", "*"]
    words: 23
  # 3. The script, after the first six units (#554: skipped by a learner
  # who already reads it).
  - ["kn-script-vowels", "kn-script-consonants", "kn-script-reading"]
  - ["kn-script-vowel-signs", "kn-script-conjuncts", "kn-script-digits"]
  # Numbers 1–20 follow the script, so it comes after the first six units.
  - decks: ["kn-numbers-1-20", "*"]
    words: 20
  # 4. The core: about 200 common words, most common first (by judgement
  # until the Wikipedia counts are written, #516).
  - decks: ["kn-about-me", "*"]
    words: 7
  - decks: ["kn-verbs", "*"]
    words: 30
    listening_passages:
      - { id: "morning-routine", text: { "en": "A mother says what each person in the house does in the morning" } }
    reading_passages:
      - { id: "fridge-note", text: { "en": "A note on the fridge: what to eat, what to drink and where things are" } }
  - decks: ["kn-adverbs", "*"]
