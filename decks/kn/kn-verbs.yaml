    reading: "hōgu"
    ipa: "hoːɡu"
    pos: "verb"
    notes:
      - { id: "n1", kind: "behaviour" }
    examples:
      - { target: "ಅವಳು ಶಾಲೆಗೆ ಹೋಗುತ್ತಾಳೆ.", reading: "avaḷu śālege hōguttāḷe.", ipa: "aʋaɭu ʃaːleɡe hoːɡut̪t̪aːɭe", bases: [{ word: "ಶಾಲೆಗೆ", base: "ಶಾಲೆ", reading: "śāle" }, { word: "ಹೋಗುತ್ತಾಳೆ", base: "ಹೋಗು", reading: "hōgu" }] }
      - { target: "ನಾವು ನಾಳೆ ಊರಿಗೆ ಹೋಗುತ್ತೇವೆ.", reading: "nāvu nāḷe ūrige hōguttēve.", ipa: "naːʋu naːɭe uːriɡe hoːɡut̪t̪eːʋe", bases: [{ word: "ಊರಿಗೆ", base: "ಊರು", reading: "ūru" }, { word: "ಹೋಗುತ್ತೇವೆ", base: "ಹೋಗು", reading: "hōgu" }] }
