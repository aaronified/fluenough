  - id: "kn-0630"
    target: "ಮಾಡು"
    reading: "māḍu"
    ipa: "maːɖu"
    pos: "verb"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ನಾನು ಕೆಲಸ ಮಾಡುತ್ತೇನೆ.", reading: "nānu kelasa māḍuttēne.", ipa: "naːnu kelasa maːɖut̪t̪eːne", bases: [{ word: "ಕೆಲಸ", base: "ಕೆಲಸ", reading: "kelasa" }, { word: "ಮಾಡುತ್ತೇನೆ", base: "ಮಾಡು", reading: "māḍu" }] }
      - { target: "ಅವನು ಊಟ ಮಾಡಿದನು.", reading: "avanu ūṭa māḍidanu.", ipa: "aʋanu uːʈa maːɖid̪anu", bases: [{ word: "ಊಟ", base: "ಊಟ", reading: "ūṭa" }, { word: "ಮಾಡಿದನು", base: "ಮಾಡು", reading: "māḍu" }] }
  - id: "kn-0631"
