schema: 1
id: kn-en-first-words
name: "First words"
kind: vocab
theme: first-words
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Greetings, the respect Kannada builds into them, and how to say you are still learning. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: kn-0142
    target: "ನಮಸ್ಕಾರ"
    native: "hello; goodbye"
    reading: "namaskaara"
    alt_target: ["ನಮಸ್ತೆ"]
    pos: "other"
    tags: ["greeting"]
    notes: "Said with palms pressed together, to anyone. In a family, younger people often greet elders by touching their feet; a visitor is not expected to."
  - id: kn-0143
    target: "ನೀವು"
    native: "you (respectful); you (plural)"
    reading: "niivu"
    pos: "other"
    tags: ["honorific"]
    notes: "Kannada has two words for 'you': ನೀವು for strangers, elders and anyone you respect, and ನೀನು (niinu) for friends, children and the very close. The verb changes with each. A learner is always safe with ನೀವು."
  - id: kn-0144
    target: "ಹೇಗಿದ್ದೀರಿ?"
    native: "How are you? (respectful)"
    reading: "heegiddiiri?"
    alt_target: ["ಹೇಗಿದ್ದೀರಾ?"]
    pos: "phrase"
    tags: ["greeting"]
    notes: "Literally 'how are you?'. To a friend: ಹೇಗಿದ್ದೀಯ? (heegiddiiya?)."
  - id: kn-0145
    target: "ಚೆನ್ನಾಗಿದ್ದೇನೆ."
    native: "I'm fine."
    reading: "chennaagiddeene."
    alt_target: ["ಚೆನ್ನಾಗಿದ್ದೀನಿ."]
    pos: "phrase"
    tags: ["greeting"]
    notes: "ಚೆನ್ನಾಗಿ (chennaagi) is 'well'. In speech, ಚೆನ್ನಾಗಿದ್ದೀನಿ (chennaagiddiini)."
  - id: kn-0146
    target: "ಧನ್ಯವಾದಗಳು"
    native: "thank you"
    reading: "dhanyavaadagalu"
    alt_target: ["ಧನ್ಯವಾದ"]
    pos: "other"
    tags: ["polite"]
    notes: "Formal. Many people simply say 'thanks' in English, and among family thanks are often left out."
  - id: kn-0147
    target: "ಸರಿ"
    native: "OK; all right; correct"
    reading: "sari"
    pos: "other"
  - id: kn-0148
    target: "ಹೋಗಿ ಬರುತ್ತೇನೆ"
    native: "goodbye (said by the one leaving)"
    reading: "hoogi barutteene"
    alt_target: ["ಹೋಗಿ ಬರ್ತೀನಿ", "ಹೋಗಿಬರುತ್ತೇನೆ"]
    pos: "phrase"
    tags: ["greeting"]
    notes: "Literally 'I'll go and come back'. A plain 'I'm going' can sound final. The one staying says ಹೋಗಿ ಬನ್ನಿ (hoogi banni), go and come back."
  - id: kn-0149
    target: "ನನಗೆ ಕನ್ನಡ ಬರುವುದಿಲ್ಲ."
    native: "I don't know Kannada."
    reading: "nanage kannada baruvudilla."
    alt_target: ["ನಂಗೆ ಕನ್ನಡ ಬರಲ್ಲ.", "ಕನ್ನಡ ಬರಲ್ಲ."]
    pos: "phrase"
    notes: "Literally 'Kannada does not come to me'. In speech, ಕನ್ನಡ ಬರಲ್ಲ (kannada baralla)."
  - id: kn-0150
    target: "ನಾನು ಇನ್ನೂ ಕನ್ನಡ ಕಲಿಯುತ್ತಿದ್ದೇನೆ."
    native: "I'm still learning Kannada."
    reading: "naanu innuu kannada kaliyuttiddeene."
    alt_target: ["ನಾನು ಇನ್ನೂ ಕನ್ನಡ ಕಲೀತಿದ್ದೀನಿ."]
    pos: "phrase"
  - id: kn-0151
    target: "ನಿಧಾನವಾಗಿ ಮಾತಾಡಿ."
    native: "Please speak slowly."
    reading: "nidhaanavaagi maataadi."
    alt_target: ["ನಿಧಾನವಾಗಿ ಮಾತನಾಡಿ."]
    pos: "phrase"
    tags: ["polite"]
    notes: "The ending -ಇ makes a polite request: ಕುಳಿತುಕೊಳ್ಳಿ (kulitukolli), please sit."
  - id: kn-0152
    target: "ಇನ್ನೊಮ್ಮೆ ಹೇಳಿ."
    native: "Please say that again."
    reading: "innomme heeli."
    pos: "phrase"
    tags: ["polite"]
  - id: kn-0153
    target: "ಕ್ಷಮಿಸಿ"
    native: "sorry; excuse me"
    reading: "kshamisi"
    pos: "other"
    tags: ["polite"]
    notes: "Literally 'forgive'. Also to get past someone or to get their attention."
