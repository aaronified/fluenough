schema: 1
id: kn-en-transport
name: "Bus, auto, cab"
kind: vocab
theme: transport
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN, icon: "ಕ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Getting a ride, agreeing the fare and getting off where you want. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: kn-0342
    target: "ಬಸ್ಸು"
    native: "bus"
    reading: "bassu"
    alt_target: ["ಬಸ್"]
    pos: "noun"
    notes: "Also ಬಸ್ (bas). Kannada likes a word to end in a vowel, so many words from English gain a u."
  - id: kn-0343
    target: "ಆಟೋ"
    native: "auto-rickshaw"
    reading: "ato"
    pos: "noun"
  - id: kn-0344
    target: "ಟ್ಯಾಕ್ಸಿ"
    native: "taxi"
    reading: "tyaksi"
    alt_target: ["ಕ್ಯಾಬ್"]
    pos: "noun"
    notes: "A booked one is often ಕ್ಯಾಬ್ (kyab), cab."
  - id: kn-0345
    target: "ಬಾಡಿಗೆ"
    native: "fare; hire; rent"
    reading: "badige"
    pos: "noun"
  - id: kn-0346
    target: "ಮೀಟರ್ ಹಾಕಿ."
    native: "Please put the meter on."
    reading: "mitar haki."
    pos: "phrase"
    notes: "ಹಾಕು (haku) is 'to put'. Otherwise agree the fare first: ಎಷ್ಟು ಆಗುತ್ತೆ? how much will it be?"
  - id: kn-0347
    target: "ನಾನು ರೈಲು ನಿಲ್ದಾಣಕ್ಕೆ ಹೋಗಬೇಕು."
    native: "I need to go to the railway station."
    reading: "nanu railu nildanakke hogabeku."
    pos: "phrase"
    notes: "In speech most people say ಸ್ಟೇಷನ್ (steshan). -ಬೇಕು on a verb is 'must, need to'."
  - id: kn-0348
    target: "ಎಷ್ಟು ಹೊತ್ತು ಆಗುತ್ತದೆ?"
    native: "How long will it take?"
    reading: "eshtu hottu aguttade?"
    alt_target: ["ಎಷ್ಟು ಹೊತ್ತು ಆಗುತ್ತೆ?"]
    pos: "phrase"
    notes: "ಹೊತ್ತು (hottu) is 'time, a while'. In speech, ಆಗುತ್ತೆ (agutte)."
  - id: kn-0349
    target: "ಇಲ್ಲಿ ನಿಲ್ಲಿಸಿ."
    native: "Stop here, please."
    reading: "illi nillisi."
    pos: "phrase"
  - id: kn-0350
    target: "ನಿಲ್ದಾಣ"
    native: "station; stop"
    reading: "nildana"
    pos: "noun"
    notes: "On signs: ಬಸ್ ನಿಲ್ದಾಣ, bus stop; ರೈಲು ನಿಲ್ದಾಣ, railway station."
  - id: kn-0351
    target: "ರೈಲು"
    native: "train"
    reading: "railu"
    pos: "noun"
  - id: kn-0352
    target: "ಟಿಕೆಟ್"
    native: "ticket"
    reading: "tiket"
    pos: "noun"
  - id: kn-0353
    target: "ಸೀಟು"
    native: "seat"
    reading: "situ"
    alt_target: ["ಸೀಟ್"]
    pos: "noun"
  - id: kn-0354
    target: "ಹೋಗೋಣ"
    native: "let's go"
    reading: "hogona"
    pos: "other"
    notes: "-ಓಣ makes 'let's': ಮಾಡೋಣ (madona), let's do it."
