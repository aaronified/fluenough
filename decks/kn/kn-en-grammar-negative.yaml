      forms:
        "won't; doesn't": ["ಕುಡಿಯುವುದಿಲ್ಲ", "ಕುಡಿಯಲ್ಲ", "ಕುಡಿಯೋದಿಲ್ಲ"]
        "didn't": ["ಕುಡಿಯಲಿಲ್ಲ", "ಕುಡೀಲಿಲ್ಲ"]
        "isn't …ing now": ["ಕುಡಿಯುತ್ತಿಲ್ಲ", "ಕುಡೀತಿಲ್ಲ"]
        "don't! (to ನೀನು)": "ಕುಡಿಯಬೇಡ"
        "please don't (to ನೀವು)": "ಕುಡಿಯಬೇಡಿ"
      readings:
        "won't; doesn't": ["kuḍiyuvudilla", "kuḍiyalla", "kuḍiyōdilla"]
        "didn't": ["kuḍiyalilla", "kuḍīlilla"]
        "isn't …ing now": ["kuḍiyuttilla", "kuḍītilla"]
        "don't! (to ನೀನು)": "kuḍiyabēḍa"
        "please don't (to ನೀವು)": "kuḍiyabēḍi"
      ipas:
        "won't; doesn't": "kuɖijuʋud̪illa"
        "didn't": "kuɖijalilla"
