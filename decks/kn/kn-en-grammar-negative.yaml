schema: 1
id: kn-en-grammar-negative
name: "Won't, didn't and don't"
kind: grammar
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I won't go, she didn't come, don't eat: Kannada's 'not' is one ending for every person. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Negatives"
  slot_name: "form"
  slots: ["won't; doesn't", "didn't", "isn't …ing now", "don't! (to ನೀನು)", "please don't (to ನೀವು)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The negative is the same for every person: ನಾನು ಬರುವುದಿಲ್ಲ, ಅವಳು ಬರುವುದಿಲ್ಲ, I won't come, she won't come. The future and the habit take -ಉವುದಿಲ್ಲ, in speech -ಅಲ್ಲ; the past takes -ಅಲಿಲ್ಲ; what is not happening now takes -ಉತ್ತಿಲ್ಲ. 'Don't!' is -ಬೇಡ, and -ಬೇಡಿ to someone you respect. Where several forms are given, the first is written Kannada; all are accepted."
  entries:
    - lemma: "ಮಾಡು"
      key: maadu
      gloss: "to do"
      forms:
        "won't; doesn't": ["ಮಾಡುವುದಿಲ್ಲ", "ಮಾಡಲ್ಲ", "ಮಾಡೋದಿಲ್ಲ"]
        "didn't": ["ಮಾಡಲಿಲ್ಲ", "ಮಾಡ್ಲಿಲ್ಲ"]
        "isn't …ing now": ["ಮಾಡುತ್ತಿಲ್ಲ", "ಮಾಡ್ತಿಲ್ಲ"]
        "don't! (to ನೀನು)": "ಮಾಡಬೇಡ"
        "please don't (to ನೀವು)": "ಮಾಡಬೇಡಿ"
    - lemma: "ಹೋಗು"
      key: hoogu
      gloss: "to go"
      forms:
        "won't; doesn't": ["ಹೋಗುವುದಿಲ್ಲ", "ಹೋಗಲ್ಲ", "ಹೋಗೋದಿಲ್ಲ"]
        "didn't": ["ಹೋಗಲಿಲ್ಲ", "ಹೋಗ್ಲಿಲ್ಲ"]
        "isn't …ing now": ["ಹೋಗುತ್ತಿಲ್ಲ", "ಹೋಗ್ತಿಲ್ಲ"]
        "don't! (to ನೀನು)": "ಹೋಗಬೇಡ"
        "please don't (to ನೀವು)": "ಹೋಗಬೇಡಿ"
    - lemma: "ಬರು"
      key: baru
      gloss: "to come"
      forms:
        "won't; doesn't": ["ಬರುವುದಿಲ್ಲ", "ಬರಲ್ಲ", "ಬರೋದಿಲ್ಲ"]
        "didn't": ["ಬರಲಿಲ್ಲ", "ಬರ್ಲಿಲ್ಲ"]
        "isn't …ing now": ["ಬರುತ್ತಿಲ್ಲ", "ಬರ್ತಿಲ್ಲ"]
        "don't! (to ನೀನು)": "ಬರಬೇಡ"
        "please don't (to ನೀವು)": "ಬರಬೇಡಿ"
    - lemma: "ತಿನ್ನು"
      key: tinnu
      gloss: "to eat"
      forms:
        "won't; doesn't": ["ತಿನ್ನುವುದಿಲ್ಲ", "ತಿನ್ನಲ್ಲ", "ತಿನ್ನೋದಿಲ್ಲ"]
        "didn't": ["ತಿನ್ನಲಿಲ್ಲ", "ತಿನ್ಲಿಲ್ಲ"]
        "isn't …ing now": ["ತಿನ್ನುತ್ತಿಲ್ಲ", "ತಿಂತಿಲ್ಲ"]
        "don't! (to ನೀನು)": "ತಿನ್ನಬೇಡ"
        "please don't (to ನೀವು)": "ತಿನ್ನಬೇಡಿ"
    - lemma: "ಕುಡಿ"
      key: kudi
      gloss: "to drink"
      forms:
        "won't; doesn't": ["ಕುಡಿಯುವುದಿಲ್ಲ", "ಕುಡಿಯಲ್ಲ", "ಕುಡಿಯೋದಿಲ್ಲ"]
        "didn't": ["ಕುಡಿಯಲಿಲ್ಲ", "ಕುಡೀಲಿಲ್ಲ"]
        "isn't …ing now": ["ಕುಡಿಯುತ್ತಿಲ್ಲ", "ಕುಡೀತಿಲ್ಲ"]
        "don't! (to ನೀನು)": "ಕುಡಿಯಬೇಡ"
        "please don't (to ನೀವು)": "ಕುಡಿಯಬೇಡಿ"
