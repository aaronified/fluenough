schema: 1
id: kn-en-grammar-adjectives
name: "Describing words"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Good, big, new: a describing word before a noun never changes; after it, it becomes a noun. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: kn-0400
    target: "ಒಳ್ಳೆಯ"
    native: "good"
    reading: "olleya"
    alt_target: ["ಒಳ್ಳೆ"]
    pos: "adj"
    notes: "Before a noun: ಒಳ್ಳೆಯ ಹುಡುಗ, a good boy. In speech often ಒಳ್ಳೆ (olle)."
  - id: kn-0401
    target: "ಕೆಟ್ಟ"
    native: "bad"
    reading: "ketta"
    pos: "adj"
  - id: kn-0402
    target: "ದೊಡ್ಡ"
    native: "big; elder"
    reading: "dodda"
    pos: "adj"
    notes: "ದೊಡ್ಡಪ್ಪ, father's elder brother, is 'big father'."
  - id: kn-0403
    target: "ಚಿಕ್ಕ"
    native: "small; younger"
    reading: "chikka"
    pos: "adj"
  - id: kn-0404
    target: "ಹೊಸ"
    native: "new"
    reading: "hosa"
    pos: "adj"
  - id: kn-0405
    target: "ಹಳೆಯ"
    native: "old (of things)"
    reading: "haleya"
    alt_target: ["ಹಳೆ"]
    pos: "adj"
    notes: "An old person is ವಯಸ್ಸಾದ (vayassaada), 'aged'."
  - id: kn-0406
    target: "ಬಿಸಿ"
    native: "hot"
    reading: "bisi"
    pos: "adj"
    notes: "ಬಿಸಿ ಬಿಸಿ, said twice, is 'piping hot'."
  - id: kn-0407
    target: "ತಣ್ಣನೆಯ"
    native: "cold; cool"
    reading: "tannaneya"
    pos: "adj"
  - id: kn-0408
    target: "ಸುಂದರ"
    native: "beautiful"
    reading: "sundara"
    pos: "adj"
    notes: "Before a noun often ಸುಂದರವಾದ (sundaravaada): ಸುಂದರವಾದ ಊರು, a beautiful town."
  - id: kn-0409
    target: "ಸ್ವಚ್ಛ"
    native: "clean"
    reading: "svachchha"
    pos: "adj"
  - id: kn-0410
    target: "ಇದು ಒಳ್ಳೆಯ ಪುಸ್ತಕ."
    native: "This is a good book."
    reading: "idu olleya pustaka."
    pos: "phrase"
  - id: kn-0411
    target: "ಈ ಕೋಣೆ ದೊಡ್ಡದಾಗಿದೆ."
    native: "This room is big."
    reading: "ii koone doddadaagide."
    alt_target: ["ಈ ಕೋಣೆ ದೊಡ್ಡದು."]
    pos: "phrase"
    notes: "After the noun the describing word becomes a noun, ದೊಡ್ಡದು (a big one), often with ಆಗಿದೆ. Also simply ಈ ಕೋಣೆ ದೊಡ್ಡದು."
  - id: kn-0412
    target: "ಕಾಫಿ ತುಂಬಾ ಬಿಸಿಯಾಗಿದೆ."
    native: "The coffee is very hot."
    reading: "kaafi tumbaa bisiyaagide."
    pos: "phrase"
    notes: "-ಆಗಿ turns a describing word into 'in that way': ಬಿಸಿಯಾಗಿ, hot."
