schema: 1
id: kn-en-grammar-adjectives
name: "Describing words"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN, icon: "ಕ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Good, big, new: a describing word before a noun never changes; after it, it becomes a noun. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: kn-0400
    target: "ಒಳ್ಳೆಯ"
    native: "good"
    reading: "oḷḷeya"
    ipa: "oɭɭeja"
    alt_target: ["ಒಳ್ಳೆ"]
    pos: "adj"
    notes: "Before a noun: ಒಳ್ಳೆಯ ಹುಡುಗ (oḷḷeya huḍuga), a good boy. In speech often ಒಳ್ಳೆ (oḷḷe)."
  - id: kn-0401
    target: "ಕೆಟ್ಟ"
    native: "bad"
    reading: "keṭṭa"
    ipa: "keʈʈa"
    pos: "adj"
  - id: kn-0402
    target: "ದೊಡ್ಡ"
    native: "big; elder"
    reading: "doḍḍa"
    ipa: "d̪oɖɖa"
    pos: "adj"
    notes: "ದೊಡ್ಡಪ್ಪ (doḍḍappa), father's elder brother, is 'big father'."
  - id: kn-0403
    target: "ಚಿಕ್ಕ"
    native: "small; younger"
    reading: "cikka"
    ipa: "tʃikka"
    pos: "adj"
  - id: kn-0404
    target: "ಹೊಸ"
    native: "new"
    reading: "hosa"
    ipa: "hosa"
    pos: "adj"
  - id: kn-0405
    target: "ಹಳೆಯ"
    native: "old (of things)"
    reading: "haḷeya"
    ipa: "haɭeja"
    alt_target: ["ಹಳೆ"]
    pos: "adj"
    notes: "An old person is ವಯಸ್ಸಾದ (vayassāda), 'aged'."
  - id: kn-0406
    target: "ಬಿಸಿ"
    native: "hot"
    reading: "bisi"
    ipa: "bisi"
    pos: "adj"
    notes: "ಬಿಸಿ ಬಿಸಿ (bisi bisi), said twice, is 'piping hot'."
  - id: kn-0407
    target: "ತಣ್ಣನೆಯ"
    native: "cold; cool"
    reading: "taṇṇaneya"
    ipa: "t̪aɳɳaneja"
    pos: "adj"
  - id: kn-0408
    target: "ಸುಂದರ"
    native: "beautiful"
    reading: "sundara"
    ipa: "sund̪ara"
    pos: "adj"
    notes: "Before a noun often ಸುಂದರವಾದ (sundaravāda): ಸುಂದರವಾದ ಊರು (sundaravāda ūru), a beautiful town."
  - id: kn-0409
    target: "ಸ್ವಚ್ಛ"
    native: "clean"
    reading: "svaccha"
    ipa: "sʋatʃtʃʰa"
    pos: "adj"
  - id: kn-0410
    target: "ಇದು ಒಳ್ಳೆಯ ಪುಸ್ತಕ."
    native: "This is a good book."
    reading: "idu oḷḷeya pustaka."
    ipa: "id̪u oɭɭeja pust̪aka"
    pos: "phrase"
  - id: kn-0411
    target: "ಈ ಕೋಣೆ ದೊಡ್ಡದಾಗಿದೆ."
    native: "This room is big."
    reading: "ī kōṇe doḍḍadāgide."
    ipa: "iː koːɳe d̪oɖɖad̪aːɡid̪e"
    alt_target: ["ಈ ಕೋಣೆ ದೊಡ್ಡದು."]
    pos: "phrase"
    notes: "After the noun the describing word becomes a noun, ದೊಡ್ಡದು (a big one), often with ಆಗಿದೆ (āgide). Also simply ಈ ಕೋಣೆ ದೊಡ್ಡದು (ī kōṇe doḍḍadu)."
  - id: kn-0412
    target: "ಕಾಫಿ ತುಂಬಾ ಬಿಸಿಯಾಗಿದೆ."
    native: "The coffee is very hot."
    reading: "kāfi tumbā bisiyāgide."
    ipa: "kaːfi t̪umbaː bisijaːɡid̪e"
    pos: "phrase"
    notes: "-ಆಗಿ (-āgi) turns a describing word into 'in that way': ಬಿಸಿಯಾಗಿ (bisiyāgi), hot."
