schema: 1
id: kn-en-grammar-postpositions
name: "Case endings and postpositions"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "In, to, from, with: endings on the noun, and words after it. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: kn-0355
    target: "ಮನೆಯಲ್ಲಿ"
    native: "at home; in the house"
    reading: "maneyalli"
    alt_target: ["ಮನೇಲಿ"]
    pos: "other"
    notes: "-ಅಲ್ಲಿ, 'in', on ಮನೆ, joined by a y. In speech, ಮನೇಲಿ (maneeli)."
  - id: kn-0356
    target: "ಬೆಂಗಳೂರಿನಿಂದ"
    native: "from Bengaluru"
    reading: "bengaluurininda"
    pos: "other"
    notes: "-ಇಂದ is 'from'. A noun in -u often takes -ಇನ- first: ಊರು, ಊರಿನಿಂದ."
  - id: kn-0357
    target: "ರಾಮುವಿಗೆ ಕೊಡಿ."
    native: "Give it to Ramu, please."
    reading: "raamuvige kodi."
    alt_target: ["ರಾಮುಗೆ ಕೊಡಿ."]
    pos: "phrase"
    notes: "-ಗೆ, 'to', after a joining v. In speech often ರಾಮುಗೆ."
  - id: kn-0358
    target: "ನನ್ನ ಜೊತೆ"
    native: "with me"
    reading: "nanna jote"
    pos: "phrase"
    notes: "ಜೊತೆ, 'company', after the possessive: 'my company'."
  - id: kn-0359
    target: "ಮೇಜಿನ ಮೇಲೆ"
    native: "on the table"
    reading: "meejina meele"
    pos: "phrase"
    notes: "Words of place follow the noun in its 'of' form: ಮೇಜು, ಮೇಜಿನ, of the table."
  - id: kn-0360
    target: "ಮೇಜಿನ ಕೆಳಗೆ"
    native: "under the table"
    reading: "meejina kelage"
    pos: "phrase"
  - id: kn-0361
    target: "ಸ್ಟೇಷನ್ ಹತ್ತಿರ"
    native: "near the station"
    reading: "steeshan hattira"
    pos: "phrase"
  - id: kn-0362
    target: "ನಿಮಗಾಗಿ"
    native: "for you"
    reading: "nimagaagi"
    pos: "other"
    notes: "-ಗಾಗಿ, 'for the sake of': ನಿಮಗೆ + ಆಗಿ."
  - id: kn-0363
    target: "ಊಟದ ನಂತರ"
    native: "after the meal"
    reading: "uutada nantara"
    alt_target: ["ಊಟ ಆದಮೇಲೆ"]
    pos: "phrase"
    notes: "In speech also ಊಟ ಆದಮೇಲೆ (uuta aadameele), 'when the meal is over'."
  - id: kn-0364
    target: "ಊಟಕ್ಕೆ ಮುಂಚೆ"
    native: "before the meal"
    reading: "uutakke munche"
    pos: "phrase"
    notes: "ಮುಂಚೆ, 'before', takes the 'to' form: ಊಟ + -ಕ್ಕೆ."
  - id: kn-0365
    target: "ಪೆನ್ನಿನಿಂದ"
    native: "with a pen"
    reading: "penninda"
    pos: "other"
    notes: "-ಇಂದ is also 'with, by means of': ಪೆನ್ನಿನಿಂದ ಬರೆಯಿರಿ, please write with a pen."
