  - id: "kn-newspaper-feature"
    title: "Newspaper feature"
    sentences:
      - text: "ಈ ವಾರ ನಮ್ಮ ಊರಿನಲ್ಲಿ ಹೊಸ ಶಾಲೆ ಆರಂಭಿಸಲಾಗಿದೆ."
        reading: "ī vāra namma ūrinalli hosa śāle ārambhisalāgide."
        ipa: "iː ʋaːra namma uːrinalli hosa ʃaːle aːrambʱisalaːɡid̪e"
      - text: "ಶಿಕ್ಷಕರು ಹೇಳಿದರು."
        reading: "śikṣakaru hēḷidaru."
        ipa: "ʃikʂakaru heːɭid̪aru"
      - text: "ಮಕ್ಕಳು ತುಂಬಾ ಸಂತೋಷ ಪಡುತ್ತಾರೆ."
        reading: "makkaḷu tumbā santōṣa paḍuttāre."
        ipa: "makkaɭu t̪umbaː sant̪oːʂa paɖut̪t̪aːre"
      - text: "ಮುಂದಿನ ವರ್ಷ ಒಂದು ಶಾಲೆ ಕಟ್ಟಲಾಗುವುದು."
        reading: "mundina varṣa ondu śāle kaṭṭalāguvudu."
        ipa: "mund̪ina ʋarʂa ond̪u ʃaːle kaʈʈalaːɡuʋud̪u"
    questions:
      - id: "kn-9733"
        prompt: { en: "What was started in the town?" }
