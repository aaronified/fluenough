    sentences:
      - text: "ನಮ್ಮ ಕ್ಲಬ್‌ನಲ್ಲಿ ಸಂಗೀತ ಇದೆ."
        reading: "namma klabnalli saṅgīta ide."
        ipa: "namma klabnalli saŋɡiːt̪a id̪e"
      - text: "ಕೊಳಲು ಮತ್ತು ತಬಲ ನುಡಿಸಲು ಕಲಿಯಿರಿ."
        reading: "koḷalu mattu tabala nuḍisalu kaliyiri."
        ipa: "koɭalu mat̪t̪u t̪abala nuɖisalu kalijiri"
      - text: "ಚಿತ್ರಕಲೆ ಮತ್ತು ಫೋಟೋ ಆಸಕ್ತಿ ಇರುವವರು ಬನ್ನಿ."
        reading: "citrakale mattu phōṭō āsakti iruvavaru banni."
        ipa: "tʃit̪rakale mat̪t̪u pʰoːʈoː aːsakt̪i iruʋaʋaru banni"
      - text: "ಭಾನುವಾರ ಬೆಳಿಗ್ಗೆ ಓಟ ಮತ್ತು ನಡಿಗೆ ಇದೆ."
        reading: "bhānuvāra beḷigge ōṭa mattu naḍige ide."
        ipa: "bʱaːnuʋaːra beɭiɡɡe oːʈa mat̪t̪u naɖiɡe id̪e"
