schema: 1
id: kn-en-grammar-nouns
name: "Nouns: plural and case"
kind: grammar
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN, icon: "ಕ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The plural, and the endings for 'in', 'to', 'from' and 'of', often joined by a y or an -ಇನ-. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Noun endings"
  slot_name: "form"
  slots: ["plural", "in: -ಅಲ್ಲಿ", "to: -ಗೆ or -ಕ್ಕೆ", "from: -ಇಂದ", "of: -ಅ"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "-ಗಳು makes a plural. A noun in -e or -i joins its endings with a y: ಮನೆಯಲ್ಲಿ. A noun in -a takes -ದ- before them and -ಕ್ಕೆ for 'to': ಪುಸ್ತಕದಲ್ಲಿ, ಪುಸ್ತಕಕ್ಕೆ. Many nouns in -u take -ಇನ-: ಊರಿನಲ್ಲಿ. Where two forms are given, the second is everyday speech."
  entries:
    - lemma: "ಮನೆ"
      key: mane
      reading: "mane"
      gloss: "house"
      forms:
        "plural": "ಮನೆಗಳು"
        "in: -ಅಲ್ಲಿ": ["ಮನೆಯಲ್ಲಿ", "ಮನೇಲಿ"]
        "to: -ಗೆ or -ಕ್ಕೆ": "ಮನೆಗೆ"
        "from: -ಇಂದ": "ಮನೆಯಿಂದ"
        "of: -ಅ": "ಮನೆಯ"
      readings:
        "plural": "manegalu"
        "in: -ಅಲ್ಲಿ": ["maneyalli", "maneli"]
        "to: -ಗೆ or -ಕ್ಕೆ": "manege"
        "from: -ಇಂದ": "maneyinda"
        "of: -ಅ": "maneya"
    - lemma: "ಪುಸ್ತಕ"
      key: pustaka
      reading: "pustaka"
      gloss: "book"
      forms:
        "plural": "ಪುಸ್ತಕಗಳು"
        "in: -ಅಲ್ಲಿ": "ಪುಸ್ತಕದಲ್ಲಿ"
        "to: -ಗೆ or -ಕ್ಕೆ": "ಪುಸ್ತಕಕ್ಕೆ"
        "from: -ಇಂದ": "ಪುಸ್ತಕದಿಂದ"
        "of: -ಅ": "ಪುಸ್ತಕದ"
      readings:
        "plural": "pustakagalu"
        "in: -ಅಲ್ಲಿ": "pustakadalli"
        "to: -ಗೆ or -ಕ್ಕೆ": "pustakakke"
        "from: -ಇಂದ": "pustakadinda"
        "of: -ಅ": "pustakada"
    - lemma: "ಅಂಗಡಿ"
      key: angadi
      reading: "angadi"
      gloss: "shop"
      forms:
        "plural": "ಅಂಗಡಿಗಳು"
        "in: -ಅಲ್ಲಿ": ["ಅಂಗಡಿಯಲ್ಲಿ", "ಅಂಗಡೀಲಿ"]
        "to: -ಗೆ or -ಕ್ಕೆ": "ಅಂಗಡಿಗೆ"
        "from: -ಇಂದ": "ಅಂಗಡಿಯಿಂದ"
        "of: -ಅ": "ಅಂಗಡಿಯ"
      readings:
        "plural": "angadigalu"
        "in: -ಅಲ್ಲಿ": ["angadiyalli", "angadili"]
        "to: -ಗೆ or -ಕ್ಕೆ": "angadige"
        "from: -ಇಂದ": "angadiyinda"
        "of: -ಅ": "angadiya"
    - lemma: "ಕೋಣೆ"
      key: koone
      reading: "kone"
      gloss: "room"
      forms:
        "plural": "ಕೋಣೆಗಳು"
        "in: -ಅಲ್ಲಿ": "ಕೋಣೆಯಲ್ಲಿ"
        "to: -ಗೆ or -ಕ್ಕೆ": "ಕೋಣೆಗೆ"
        "from: -ಇಂದ": "ಕೋಣೆಯಿಂದ"
        "of: -ಅ": "ಕೋಣೆಯ"
      readings:
        "plural": "konegalu"
        "in: -ಅಲ್ಲಿ": "koneyalli"
        "to: -ಗೆ or -ಕ್ಕೆ": "konege"
        "from: -ಇಂದ": "koneyinda"
        "of: -ಅ": "koneya"
    - lemma: "ಬಸ್ಸು"
      key: bassu
      reading: "bassu"
      gloss: "bus"
      forms:
        "plural": "ಬಸ್ಸುಗಳು"
        "in: -ಅಲ್ಲಿ": ["ಬಸ್ಸಿನಲ್ಲಿ", "ಬಸ್ಸಲ್ಲಿ"]
        "to: -ಗೆ or -ಕ್ಕೆ": "ಬಸ್ಸಿಗೆ"
        "from: -ಇಂದ": "ಬಸ್ಸಿನಿಂದ"
        "of: -ಅ": "ಬಸ್ಸಿನ"
      readings:
        "plural": "bassugalu"
        "in: -ಅಲ್ಲಿ": ["bassinalli", "bassalli"]
        "to: -ಗೆ or -ಕ್ಕೆ": "bassige"
        "from: -ಇಂದ": "bassininda"
        "of: -ಅ": "bassina"
    - lemma: "ಊರು"
      key: uuru
      reading: "uru"
      gloss: "town"
      forms:
        "plural": "ಊರುಗಳು"
        "in: -ಅಲ್ಲಿ": ["ಊರಿನಲ್ಲಿ", "ಊರಲ್ಲಿ"]
        "to: -ಗೆ or -ಕ್ಕೆ": "ಊರಿಗೆ"
        "from: -ಇಂದ": "ಊರಿನಿಂದ"
        "of: -ಅ": "ಊರಿನ"
      readings:
        "plural": "urugalu"
        "in: -ಅಲ್ಲಿ": ["urinalli", "uralli"]
        "to: -ಗೆ or -ಕ್ಕೆ": "urige"
        "from: -ಇಂದ": "urininda"
        "of: -ಅ": "urina"
