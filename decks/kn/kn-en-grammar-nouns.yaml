schema: 1
id: kn-en-grammar-nouns
name: "Nouns: plural and case"
kind: grammar
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The plural, and the endings for 'in', 'to', 'from' and 'of', often joined by a y or an -ಇನ-. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Noun endings"
  slot_name: "form"
  slots: ["plural", "in: -ಅಲ್ಲಿ", "to: -ಗೆ or -ಕ್ಕೆ", "from: -ಇಂದ", "of: -ಅ"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "-ಗಳು makes a plural. A noun in -e or -i joins its endings with a y: ಮನೆಯಲ್ಲಿ. A noun in -a takes -ದ- before them and -ಕ್ಕೆ for 'to': ಪುಸ್ತಕದಲ್ಲಿ, ಪುಸ್ತಕಕ್ಕೆ. Many nouns in -u take -ಇನ-: ಊರಿನಲ್ಲಿ. Where two forms are given, the second is everyday speech."
  entries:
    - lemma: "ಮನೆ"
      key: mane
      reading: "mane"
      ipa: "mane"
      gloss: "house"
      forms:
        "plural": "ಮನೆಗಳು"
        "in: -ಅಲ್ಲಿ": ["ಮನೆಯಲ್ಲಿ", "ಮನೇಲಿ"]
        "to: -ಗೆ or -ಕ್ಕೆ": "ಮನೆಗೆ"
        "from: -ಇಂದ": "ಮನೆಯಿಂದ"
        "of: -ಅ": "ಮನೆಯ"
      readings:
        "plural": "manegaḷu"
        "in: -ಅಲ್ಲಿ": ["maneyalli", "manēli"]
        "to: -ಗೆ or -ಕ್ಕೆ": "manege"
        "from: -ಇಂದ": "maneyinda"
        "of: -ಅ": "maneya"
      ipas:
        "plural": "maneɡaɭu"
        "in: -ಅಲ್ಲಿ": "manejalli"
        "to: -ಗೆ or -ಕ್ಕೆ": "maneɡe"
        "from: -ಇಂದ": "manejind̪a"
        "of: -ಅ": "maneja"
    - lemma: "ಪುಸ್ತಕ"
      key: pustaka
      reading: "pustaka"
      ipa: "pust̪aka"
      gloss: "book"
      forms:
        "plural": "ಪುಸ್ತಕಗಳು"
        "in: -ಅಲ್ಲಿ": "ಪುಸ್ತಕದಲ್ಲಿ"
        "to: -ಗೆ or -ಕ್ಕೆ": "ಪುಸ್ತಕಕ್ಕೆ"
        "from: -ಇಂದ": "ಪುಸ್ತಕದಿಂದ"
        "of: -ಅ": "ಪುಸ್ತಕದ"
      readings:
        "plural": "pustakagaḷu"
        "in: -ಅಲ್ಲಿ": "pustakadalli"
        "to: -ಗೆ or -ಕ್ಕೆ": "pustakakke"
        "from: -ಇಂದ": "pustakadinda"
        "of: -ಅ": "pustakada"
      ipas:
        "plural": "pust̪akaɡaɭu"
        "in: -ಅಲ್ಲಿ": "pust̪akad̪alli"
        "to: -ಗೆ or -ಕ್ಕೆ": "pust̪akakke"
        "from: -ಇಂದ": "pust̪akad̪ind̪a"
        "of: -ಅ": "pust̪akad̪a"
    - lemma: "ಅಂಗಡಿ"
      key: angadi
      reading: "aṅgaḍi"
      ipa: "aŋɡaɖi"
      gloss: "shop"
      forms:
        "plural": "ಅಂಗಡಿಗಳು"
        "in: -ಅಲ್ಲಿ": ["ಅಂಗಡಿಯಲ್ಲಿ", "ಅಂಗಡೀಲಿ"]
        "to: -ಗೆ or -ಕ್ಕೆ": "ಅಂಗಡಿಗೆ"
        "from: -ಇಂದ": "ಅಂಗಡಿಯಿಂದ"
        "of: -ಅ": "ಅಂಗಡಿಯ"
      readings:
        "plural": "aṅgaḍigaḷu"
        "in: -ಅಲ್ಲಿ": ["aṅgaḍiyalli", "aṅgaḍīli"]
        "to: -ಗೆ or -ಕ್ಕೆ": "aṅgaḍige"
        "from: -ಇಂದ": "aṅgaḍiyinda"
        "of: -ಅ": "aṅgaḍiya"
      ipas:
        "plural": "aŋɡaɖiɡaɭu"
        "in: -ಅಲ್ಲಿ": "aŋɡaɖijalli"
        "to: -ಗೆ or -ಕ್ಕೆ": "aŋɡaɖiɡe"
        "from: -ಇಂದ": "aŋɡaɖijind̪a"
        "of: -ಅ": "aŋɡaɖija"
    - lemma: "ಕೋಣೆ"
      key: koone
      reading: "kōṇe"
      ipa: "koːɳe"
      gloss: "room"
      forms:
        "plural": "ಕೋಣೆಗಳು"
        "in: -ಅಲ್ಲಿ": "ಕೋಣೆಯಲ್ಲಿ"
        "to: -ಗೆ or -ಕ್ಕೆ": "ಕೋಣೆಗೆ"
        "from: -ಇಂದ": "ಕೋಣೆಯಿಂದ"
        "of: -ಅ": "ಕೋಣೆಯ"
      readings:
        "plural": "kōṇegaḷu"
        "in: -ಅಲ್ಲಿ": "kōṇeyalli"
        "to: -ಗೆ or -ಕ್ಕೆ": "kōṇege"
        "from: -ಇಂದ": "kōṇeyinda"
        "of: -ಅ": "kōṇeya"
      ipas:
        "plural": "koːɳeɡaɭu"
        "in: -ಅಲ್ಲಿ": "koːɳejalli"
        "to: -ಗೆ or -ಕ್ಕೆ": "koːɳeɡe"
        "from: -ಇಂದ": "koːɳejind̪a"
        "of: -ಅ": "koːɳeja"
    - lemma: "ಬಸ್ಸು"
      key: bassu
      reading: "bassu"
      ipa: "bassu"
      gloss: "bus"
      forms:
        "plural": "ಬಸ್ಸುಗಳು"
        "in: -ಅಲ್ಲಿ": ["ಬಸ್ಸಿನಲ್ಲಿ", "ಬಸ್ಸಲ್ಲಿ"]
        "to: -ಗೆ or -ಕ್ಕೆ": "ಬಸ್ಸಿಗೆ"
        "from: -ಇಂದ": "ಬಸ್ಸಿನಿಂದ"
        "of: -ಅ": "ಬಸ್ಸಿನ"
      readings:
        "plural": "bassugaḷu"
        "in: -ಅಲ್ಲಿ": ["bassinalli", "bassalli"]
        "to: -ಗೆ or -ಕ್ಕೆ": "bassige"
        "from: -ಇಂದ": "bassininda"
        "of: -ಅ": "bassina"
      ipas:
        "plural": "bassuɡaɭu"
        "in: -ಅಲ್ಲಿ": "bassinalli"
        "to: -ಗೆ or -ಕ್ಕೆ": "bassiɡe"
        "from: -ಇಂದ": "bassinind̪a"
        "of: -ಅ": "bassina"
    - lemma: "ಊರು"
      key: uuru
      reading: "ūru"
      ipa: "uːru"
      gloss: "town"
      forms:
        "plural": "ಊರುಗಳು"
        "in: -ಅಲ್ಲಿ": ["ಊರಿನಲ್ಲಿ", "ಊರಲ್ಲಿ"]
        "to: -ಗೆ or -ಕ್ಕೆ": "ಊರಿಗೆ"
        "from: -ಇಂದ": "ಊರಿನಿಂದ"
        "of: -ಅ": "ಊರಿನ"
      readings:
        "plural": "ūrugaḷu"
        "in: -ಅಲ್ಲಿ": ["ūrinalli", "ūralli"]
        "to: -ಗೆ or -ಕ್ಕೆ": "ūrige"
        "from: -ಇಂದ": "ūrininda"
        "of: -ಅ": "ūrina"
      ipas:
        "plural": "uːruɡaɭu"
        "in: -ಅಲ್ಲಿ": "uːrinalli"
        "to: -ಗೆ or -ಕ್ಕೆ": "uːriɡe"
        "from: -ಇಂದ": "uːrinind̪a"
        "of: -ಅ": "uːrina"
