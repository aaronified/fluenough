cards:
  "kn-7860":
    notes:
      "n1": "ಅನಿಸುತ್ತದೆ (anisuttade) means it seems or it feels that, from the verb ಅನಿಸು (anisu)."
    native: "This seems true."
  "kn-7861":
    native: "I agree."
  "kn-7862":
    notes:
      "n1": "ನಿಮ್ಮನ್ನು (nimmannu) is you as the object of the verb, with the ending ನ್ನು (nnu)."
    native: "He praises you."
  "kn-7863":
    native: "That is good."
  "kn-7864":
    notes:
      "n1": "ಅದನ್ನು (adannu), it as the object: the ending ನ್ನು (nnu) marks the object."
    native: "I criticise it."
  "kn-7865":
    notes:
      "n1": "ಮಾಡು (māḍu), to do, follows a noun to make a verb: ಚರ್ಚೆ (carce) ಮಾಡು (māḍu), to discuss."
    native: "We discuss."
  "kn-7866":
    native: "That is true."
  "kn-7867":
    native: "What is your reason?"
  "kn-7868":
    notes:
      "n1": "The person is named with the ending ಗೆ (ge): ನಿಮಗೆ (nimage), to you."
    native: "Congratulations to you."
  "kn-7869":
    notes:
      "n1": "ಸರಿಯಲ್ಲ (sariyalla) is ಸರಿ (sari), right, with ಅಲ್ಲ (alla), not, in one word."
    native: "Your argument is not right."
