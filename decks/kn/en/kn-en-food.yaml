schema: 1
id: "kn-en-food"
kind: "layer"
core: "kn-food"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Food and drink"
license: "CC-BY-SA-4.0"
description: "Dishes, sweets, drinks and fruit, and how to order them. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-0756":
    native: "tea"
    notes:
      "n1": "Tea with milk is ಹಾಲಿನ ಚಹಾ (hālina cahā), milk tea."
    examples:
      "ನಾನು ಬೆಳಿಗ್ಗೆ ಚಹಾ ಕುಡಿಯುತ್ತೇನೆ.": { native: "I drink tea in the morning.", bases: { "ಬೆಳಿಗ್ಗೆ": "in the morning", "ಕುಡಿಯುತ್ತೇನೆ": "to drink", "ನಾನು": "I" } }
      "ಅವನು ಸಕ್ಕರೆ ಹಾಕಿ ಚಹಾ ಮಾಡಿದ.": { native: "He made tea with sugar.", bases: { "ಸಕ್ಕರೆ": "sugar", "ಹಾಕಿ": "to add", "ಮಾಡಿದ": "to do", "ಅವನು": "he" } }
  "kn-0757":
    native: "curry; soup"
    notes:
      "n1": "A thin curry of lentils and spices: ಸಾರು (sāru) is eaten with rice."
    examples:
      "ಅವಳು ಸಾರು ಬೇಯಿಸುತ್ತಾಳೆ.": { native: "She cooks the curry.", bases: { "ಬೇಯಿಸುತ್ತಾಳೆ": "to cook", "ಅವಳು": "she" } }
      "ಸಾರು ಬಿಸಿ ಇದೆ.": { native: "The curry is hot.", bases: { "ಬಿಸಿ": "hot", "ಇದೆ": "to be" } }
  "kn-0758":
    native: "chicken"
    notes:
      "n1": "Chicken is non-vegetarian food, ಮಾಂಸಾಹಾರ (māmsāhāra)."
    examples:
      "ಅವನು ಚಿಕನ್ ತಿನ್ನುತ್ತಾನೆ.": { native: "He eats chicken.", bases: { "ತಿನ್ನುತ್ತಾನೆ": "to eat", "ಅವನು": "he" } }
      "ಚಿಕನ್ ಖಾರ ಇದೆ.": { native: "The chicken is spicy.", bases: { "ಖಾರ": "spicy", "ಇದೆ": "to be" } }
  "kn-0759":
    native: "sugar"
    notes:
      "n1": "Sweet tea needs ಸಕ್ಕರೆ (sakkare), sugar."
    examples:
      "ನನಗೆ ಸಕ್ಕರೆ ಬೇಕು.": { native: "I need sugar.", bases: { "ನನಗೆ": "to me", "ಬೇಕು": "to need" } }
      "ಚಹಾದಲ್ಲಿ ಸಕ್ಕರೆ ಹಾಕು.": { native: "Put sugar in the tea.", bases: { "ಚಹಾದಲ್ಲಿ": "in the tea", "ಹಾಕು": "to add" } }
  "kn-0760":
    native: "salt"
    notes:
      "n1": "Food without it is ಉಪ್ಪಿಲ್ಲದ (uppillada), unsalted."
    examples:
      "ಸಾರಿನಲ್ಲಿ ಉಪ್ಪು ಸ್ವಲ್ಪ ಹಾಕು.": { native: "Add a little salt to the curry.", bases: { "ಸಾರಿನಲ್ಲಿ": "in the curry", "ಸ್ವಲ್ಪ": "a little", "ಹಾಕು": "to add" } }
      "ಈ ಊಟದಲ್ಲಿ ಉಪ್ಪು ಜಾಸ್ತಿ.": { native: "This meal has too much salt.", bases: { "ಈ": "this", "ಊಟದಲ್ಲಿ": "in the meal", "ಜಾಸ್ತಿ": "too much" } }
  "kn-0761":
    native: "fruit"
    notes:
      "n1": "Fruit in general: ಹಣ್ಣು (haṇṇu); a particular fruit has its own name."
    examples:
      "ಮಕ್ಕಳು ಹಣ್ಣು ತಿನ್ನುತ್ತಾರೆ.": { native: "Children eat fruit.", bases: { "ಮಕ್ಕಳು": "children", "ತಿನ್ನುತ್ತಾರೆ": "to eat" } }
      "ಹಣ್ಣು ತಾಜಾ ಇದೆ.": { native: "The fruit is fresh.", bases: { "ತಾಜಾ": "fresh", "ಇದೆ": "to be" } }
  "kn-0762":
    native: "mango"
    notes:
      "n1": "The mango is also ಮಾವಿನಕಾಯಿ (māvinakāyi) when raw."
    examples:
      "ನನಗೆ ಮಾವು ಇಷ್ಟ.": { native: "I like mango.", bases: { "ನನಗೆ": "to me", "ಇಷ್ಟ": "liked" } }
      "ಮಾವು ಸಿಹಿ ಇದೆ.": { native: "The mango is sweet.", bases: { "ಸಿಹಿ": "sweet", "ಇದೆ": "to be" } }
  "kn-0763":
    native: "roti; flatbread"
    notes:
      "n1": "A flatbread made of wheat or millet, ರೊಟ್ಟಿ (roṭṭi)."
    examples:
      "ಅವಳು ರೊಟ್ಟಿ ಮಾಡುತ್ತಾಳೆ.": { native: "She makes flatbread.", bases: { "ಮಾಡುತ್ತಾಳೆ": "to do", "ಅವಳು": "she" } }
      "ರೊಟ್ಟಿ ಮೃದು ಇದೆ.": { native: "The flatbread is soft.", bases: { "ಮೃದು": "soft", "ಇದೆ": "to be" } }
  "kn-0764":
    native: "restaurant"
    notes:
      "n1": "A restaurant: ಹೋಟೆಲಿಗೆ (hōṭelige), to the restaurant."
    examples:
      "ನಾವು ಹೋಟೆಲಿಗೆ ಹೋಗುತ್ತೇವೆ.": { native: "We go to the restaurant.", bases: { "ಹೋಟೆಲಿಗೆ": "to the restaurant", "ಹೋಗುತ್ತೇವೆ": "to go", "ನಾವು": "we" } }
      "ಈ ಹೋಟೆಲ್ ಚೆನ್ನಾಗಿದೆ.": { native: "This restaurant is good.", bases: { "ಈ": "this", "ಚೆನ್ನಾಗಿದೆ": "to be good" } }
  "kn-0765":
    native: "menu"
    notes:
      "n1": "A menu is ಮೆನು (menu); in a sentence it takes ಮೆನುವಿನಲ್ಲಿ (menuvinalli), on the menu."
    examples:
      "ಮೆನು ತೋರಿಸಿ.": { native: "Show me the menu.", bases: { "ತೋರಿಸಿ": "to show" } }
      "ಮೆನುವಿನಲ್ಲಿ ಏನು ಇದೆ?": { native: "What is on the menu?", bases: { "ಮೆನುವಿನಲ್ಲಿ": "on the menu", "ಇದೆ": "to be" } }
  "kn-0766":
    native: "bill"
    notes:
      "n1": "The bill in a restaurant: ಬಿಲ್ ಕೊಡಿ (bil koḍi), give the bill."
    examples:
      "ಬಿಲ್ ಕೊಡಿ.": { native: "Give me the bill.", bases: { "ಕೊಡಿ": "to give" } }
      "ಬಿಲ್ ಎಷ್ಟು?": { native: "How much is the bill?", bases: { "ಎಷ್ಟು": "how much" } }
  "kn-0767":
    native: "spice"
    notes:
      "n1": "Spices in a dish: ಮಸಾಲೆ ಹಾಕು (masāle hāku), add spices."
    examples:
      "ಈ ಅಡುಗೆಯಲ್ಲಿ ಮಸಾಲೆ ಜಾಸ್ತಿ.": { native: "This dish has a lot of spice.", bases: { "ಈ": "this", "ಅಡುಗೆಯಲ್ಲಿ": "in the dish", "ಜಾಸ್ತಿ": "a lot" } }
      "ಅವಳು ಮಸಾಲೆ ಹಾಕಿದಳು.": { native: "She added spices.", bases: { "ಹಾಕಿದಳು": "to add", "ಅವಳು": "she" } }
  "kn-0768":
    native: "ghee"
    notes:
      "n1": "Clarified butter: ತುಪ್ಪ (tuppa), ghee."
    examples:
      "ರೊಟ್ಟಿಗೆ ತುಪ್ಪ ಹಾಕು.": { native: "Add ghee to the flatbread.", bases: { "ರೊಟ್ಟಿಗೆ": "to the flatbread", "ಹಾಕು": "to add" } }
      "ತುಪ್ಪ ಬಿಸಿ ಇದೆ.": { native: "The ghee is warm.", bases: { "ಬಿಸಿ": "warm", "ಇದೆ": "to be" } }
  "kn-0769":
    native: "butter"
    notes:
      "n1": "Fresh butter: ಬೆಣ್ಣೆ (beṇṇe)."
    examples:
      "ದೋಸೆಗೆ ಬೆಣ್ಣೆ ಹಾಕು.": { native: "Put butter on the dosa.", bases: { "ದೋಸೆಗೆ": "on the dosa", "ಹಾಕು": "to put" } }
      "ಬೆಣ್ಣೆ ಮೃದು ಇದೆ.": { native: "The butter is soft.", bases: { "ಮೃದು": "soft", "ಇದೆ": "to be" } }
  "kn-0770":
    native: "cake"
    notes:
      "n1": "A cake for a birthday: ಹುಟ್ಟುಹಬ್ಬದ ಕೇಕ್ (huṭṭuhabbada kēk)."
    examples:
      "ಮಕ್ಕಳು ಕೇಕ್ ತಿನ್ನುತ್ತಾರೆ.": { native: "The children eat cake.", bases: { "ಮಕ್ಕಳು": "children", "ತಿನ್ನುತ್ತಾರೆ": "to eat" } }
      "ಅವಳು ಕೇಕ್ ತಯಾರಿಸಿದಳು.": { native: "She made a cake.", bases: { "ತಯಾರಿಸಿದಳು": "to make", "ಅವಳು": "she" } }
  "kn-0771":
    native: "bread"
    notes:
      "n1": "Sliced bread: ಬ್ರೆಡ್ (breḍ)."
    examples:
      "ಬೆಳಿಗ್ಗೆ ಬ್ರೆಡ್ ತಿನ್ನು.": { native: "Eat bread in the morning.", bases: { "ಬೆಳಿಗ್ಗೆ": "in the morning", "ತಿನ್ನು": "to eat" } }
      "ಬ್ರೆಡ್ ಮೃದು.": { native: "The bread is soft.", bases: { "ಮೃದು": "soft" } }
  "kn-0772":
    native: "chutney"
    notes:
      "n1": "A chutney eaten with ಇಡ್ಲಿ (iḍli), idli."
    examples:
      "ಇಡ್ಲಿಗೆ ಚಟ್ನಿ ಕೊಡಿ.": { native: "Give chutney with the idli.", bases: { "ಇಡ್ಲಿಗೆ": "with the idli", "ಕೊಡಿ": "to give" } }
      "ಚಟ್ನಿ ಖಾರ ಇದೆ.": { native: "The chutney is spicy.", bases: { "ಖಾರ": "spicy", "ಇದೆ": "to be" } }
  "kn-0773":
    native: "apple"
    notes:
      "n1": "An apple: ಸೇಬು (sēbu)."
    examples:
      "ಮಕ್ಕಳು ಸೇಬು ತಿನ್ನುತ್ತಾರೆ.": { native: "The children eat apples.", bases: { "ಮಕ್ಕಳು": "children", "ತಿನ್ನುತ್ತಾರೆ": "to eat" } }
      "ಈ ಸೇಬು ಕೆಂಪು.": { native: "This apple is red.", bases: { "ಈ": "this", "ಕೆಂಪು": "red" } }
  "kn-0774":
    native: "orange"
    notes:
      "n1": "An orange: ಕಿತ್ತಳೆ ರಸ (kittaḷe rasa), orange juice."
    examples:
      "ನನಗೆ ಕಿತ್ತಳೆ ರಸ ಬೇಕು.": { native: "I need orange juice.", bases: { "ನನಗೆ": "to me", "ರಸ": "juice", "ಬೇಕು": "to need" } }
      "ಕಿತ್ತಳೆ ಸಿಹಿ ಇದೆ.": { native: "The orange is sweet.", bases: { "ಸಿಹಿ": "sweet", "ಇದೆ": "to be" } }
  "kn-0775":
    native: "grape"
    notes:
      "n1": "Grapes: ದ್ರಾಕ್ಷಿ (drākṣi), usually eaten raw."
    examples:
      "ಅವಳು ದ್ರಾಕ್ಷಿ ತಿನ್ನುತ್ತಾಳೆ.": { native: "She eats grapes.", bases: { "ತಿನ್ನುತ್ತಾಳೆ": "to eat", "ಅವಳು": "she" } }
      "ದ್ರಾಕ್ಷಿ ಹಸಿರು.": { native: "The grapes are green.", bases: { "ಹಸಿರು": "green" } }
  "kn-0776":
    native: "biryani"
    notes:
      "n1": "A rice dish with spices and meat: ಬಿರಿಯಾನಿ (biriyāni)."
    examples:
      "ಭಾನುವಾರ ಬಿರಿಯಾನಿ ಮಾಡುತ್ತೇವೆ.": { native: "We make biryani on Sunday.", bases: { "ಭಾನುವಾರ": "on Sunday", "ಮಾಡುತ್ತೇವೆ": "to make" } }
      "ಬಿರಿಯಾನಿ ಖಾರ ಇದೆ.": { native: "The biryani is spicy.", bases: { "ಖಾರ": "spicy", "ಇದೆ": "to be" } }
  "kn-0777":
    native: "payasa (a sweet pudding)"
    notes:
      "n1": "A sweet pudding made at festivals."
    examples:
      "ಹಬ್ಬಕ್ಕೆ ಪಾಯಸ ಮಾಡುತ್ತಾರೆ.": { native: "They make payasa for the festival.", bases: { "ಹಬ್ಬಕ್ಕೆ": "for the festival", "ಮಾಡುತ್ತಾರೆ": "to make" } }
      "ಪಾಯಸ ಸಿಹಿ.": { native: "Payasa is sweet.", bases: { "ಸಿಹಿ": "sweet" } }
  "kn-0778":
    native: "laddoo (a round sweet)"
    notes:
      "n1": "A round sweet of flour and sugar."
    examples:
      "ಅಮ್ಮ ಲಡ್ಡು ಮಾಡಿದಳು.": { native: "Mother made laddoos.", bases: { "ಅಮ್ಮ": "mother", "ಮಾಡಿದಳು": "to make" } }
      "ಒಂದು ಲಡ್ಡು ತೆಗೆದುಕೊ.": { native: "Take one laddoo.", bases: { "ಒಂದು": "one", "ತೆಗೆದುಕೊ": "to take" } }
  "kn-0779":
    native: "sweets"
    notes:
      "n1": "Sweets from a shop: ಮಿಠಾಯಿ (miṭhāyi)."
    examples:
      "ಮಕ್ಕಳಿಗೆ ಮಿಠಾಯಿ ಇಷ್ಟ.": { native: "The children like sweets.", bases: { "ಮಕ್ಕಳಿಗೆ": "the children", "ಇಷ್ಟ": "liked" } }
      "ಅಂಗಡಿಯಲ್ಲಿ ಮಿಠಾಯಿ ಇದೆ.": { native: "There are sweets in the shop.", bases: { "ಅಂಗಡಿಯಲ್ಲಿ": "in the shop", "ಇದೆ": "to be" } }
  "kn-0780":
    native: "kulfi (frozen milk dessert)"
    notes:
      "n1": "A frozen sweet of milk, eaten in summer."
    examples:
      "ಬೇಸಿಗೆಯಲ್ಲಿ ಕುಲ್ಫಿ ತಿನ್ನು.": { native: "Eat kulfi in summer.", bases: { "ಬೇಸಿಗೆಯಲ್ಲಿ": "in summer", "ತಿನ್ನು": "to eat" } }
      "ಕುಲ್ಫಿ ತಣ್ಣಗಿದೆ.": { native: "The kulfi is cold.", bases: { "ತಣ್ಣಗಿದೆ": "to be cold" } }
  "kn-0781":
    native: "juice"
    notes:
      "n1": "Fresh juice: ತಾಜಾ ರಸ (tājā rasa)."
    examples:
      "ತಾಜಾ ರಸ ಕುಡಿ.": { native: "Drink fresh juice.", bases: { "ತಾಜಾ": "fresh", "ಕುಡಿ": "to drink" } }
      "ಅವನು ಕಬ್ಬಿನ ರಸ ಕುಡಿದ.": { native: "He drank sugarcane juice.", bases: { "ಕಬ್ಬಿನ": "of sugarcane", "ಕುಡಿದ": "to drink", "ಅವನು": "he" } }
  "kn-0782":
    native: "buttermilk"
    notes:
      "n1": "Buttermilk is drunk after a meal."
    examples:
      "ಊಟದ ನಂತರ ಮಜ್ಜಿಗೆ ಕುಡಿ.": { native: "Drink buttermilk after the meal.", bases: { "ಊಟದ": "of the meal", "ನಂತರ": "after", "ಕುಡಿ": "to drink" } }
      "ಮಜ್ಜಿಗೆ ತಣ್ಣಗಿದೆ.": { native: "The buttermilk is cold.", bases: { "ತಣ್ಣಗಿದೆ": "to be cold" } }
  "kn-0783":
    native: "lassi (a yoghurt drink)"
    notes:
      "n1": "A drink of yoghurt, sweet or salted."
    examples:
      "ನನಗೆ ಲಸ್ಸಿ ಇಷ್ಟ.": { native: "I like lassi.", bases: { "ನನಗೆ": "to me", "ಇಷ್ಟ": "liked" } }
      "ಅವರು ಲಸ್ಸಿ ಕುಡಿಯುತ್ತಾರೆ.": { native: "They drink lassi.", bases: { "ಕುಡಿಯುತ್ತಾರೆ": "to drink" } }
  "kn-0784":
    native: "samosa"
    notes:
      "n1": "A triangle of fried pastry with a filling."
    examples:
      "ಒಂದು ಸಮೋಸಾ ಕೊಡಿ.": { native: "Give me a samosa.", bases: { "ಒಂದು": "one", "ಕೊಡಿ": "to give" } }
      "ಸಮೋಸಾ ಬಿಸಿ ಇದೆ.": { native: "The samosa is hot.", bases: { "ಬಿಸಿ": "hot", "ಇದೆ": "to be" } }
  "kn-0785":
    native: "vada (a fried savoury)"
    notes:
      "n1": "A fried savoury snack of lentils."
    examples:
      "ಅವಳು ವಡೆ ಮಾಡುತ್ತಾಳೆ.": { native: "She makes vadas.", bases: { "ಮಾಡುತ್ತಾಳೆ": "to make", "ಅವಳು": "she" } }
      "ವಡೆ ಗರಿಗರಿ.": { native: "The vada is crisp.", bases: { "ಗರಿಗರಿ": "crisp" } }
  "kn-0786":
    native: "bajji (fritters)"
    notes:
      "n1": "Fritters fried in gram flour."
    examples:
      "ಮಳೆಯಲ್ಲಿ ಬಜ್ಜಿ ತಿನ್ನು.": { native: "Eat fritters in the rain.", bases: { "ಮಳೆಯಲ್ಲಿ": "in the rain", "ತಿನ್ನು": "to eat" } }
      "ಬಜ್ಜಿ ಬಿಸಿ ಇದೆ.": { native: "The fritters are hot.", bases: { "ಬಿಸಿ": "hot", "ಇದೆ": "to be" } }
  "kn-0787":
    native: "puri (fried bread)"
    notes:
      "n1": "A round bread fried until it puffs up."
    examples:
      "ಭಾನುವಾರ ಪೂರಿ ಮಾಡು.": { native: "Make puri on Sunday.", bases: { "ಭಾನುವಾರ": "on Sunday", "ಮಾಡು": "to make" } }
      "ಅವನು ಎರಡು ಪೂರಿ ತಿಂದ.": { native: "He ate two puris.", bases: { "ಎರಡು": "two", "ತಿಂದ": "to eat", "ಅವನು": "he" } }
  "kn-0788":
    native: "upma (savoury semolina)"
    notes:
      "n1": "A breakfast dish of semolina."
    examples:
      "ಬೆಳಿಗ್ಗೆ ಉಪ್ಪಿಟ್ಟು ತಿಂದೆ.": { native: "I ate upma in the morning.", bases: { "ಬೆಳಿಗ್ಗೆ": "in the morning", "ತಿಂದೆ": "to eat" } }
      "ಉಪ್ಪಿಟ್ಟು ಬಿಸಿ.": { native: "The upma is hot.", bases: { "ಬಿಸಿ": "hot" } }
  "kn-0789":
    native: "sugarcane"
    notes:
      "n1": "Sugarcane is chewed or pressed for its juice: ಕಬ್ಬಿನ ರಸ (kabbina rasa)."
    examples:
      "ಅವನು ಕಬ್ಬು ತಿನ್ನುತ್ತಾನೆ.": { native: "He eats sugarcane.", bases: { "ತಿನ್ನುತ್ತಾನೆ": "to eat", "ಅವನು": "he" } }
      "ಕಬ್ಬಿನ ರಸ ಸಿಹಿ.": { native: "Sugarcane juice is sweet.", bases: { "ಕಬ್ಬಿನ": "of sugarcane", "ರಸ": "juice", "ಸಿಹಿ": "sweet" } }
  "kn-0790":
    native: "sambar"
    notes:
      "n1": "A lentil stew with vegetables, eaten with idli or dosa."
    examples:
      "ಇಡ್ಲಿ ಜೊತೆ ಸಾಂಬಾರ್ ಕೊಡಿ.": { native: "Give sambar with the idli.", bases: { "ಇಡ್ಲಿ": "idli", "ಜೊತೆ": "with", "ಕೊಡಿ": "to give" } }
      "ಸಾಂಬಾರ್ ಖಾರ ಇದೆ.": { native: "The sambar is spicy.", bases: { "ಖಾರ": "spicy", "ಇದೆ": "to be" } }
  "kn-0791":
    native: "pulses; grains"
    notes:
      "n1": "Dried beans and pulses: ಹೆಸರು ಕಾಳು (hesaru kāḷu), green gram."
    examples:
      "ಹೆಸರು ಕಾಳು ನೆನೆಸು.": { native: "Soak the green gram.", bases: { "ಹೆಸರು": "green gram", "ನೆನೆಸು": "to soak" } }
      "ಕಾಳು ಬೇಯಿಸು.": { native: "Cook the pulses.", bases: { "ಬೇಯಿಸು": "to cook" } }
  "kn-0792":
    native: "wheat"
    notes:
      "n1": "Wheat, ground into flour: ಗೋಧಿ ಹಿಟ್ಟು (gōdhi hiṭṭu)."
    examples:
      "ಗೋಧಿ ಹಿಟ್ಟು ತನ್ನಿ.": { native: "Bring wheat flour.", bases: { "ಹಿಟ್ಟು": "flour", "ತನ್ನಿ": "to bring" } }
      "ಈ ರೊಟ್ಟಿ ಗೋಧಿಯಿಂದ ಮಾಡಿದ್ದು.": { native: "This flatbread is made of wheat.", bases: { "ಈ": "this", "ರೊಟ್ಟಿ": "flatbread", "ಗೋಧಿಯಿಂದ": "of wheat", "ಮಾಡಿದ್ದು": "made" } }
  "kn-0793":
    native: "groundnut; peanut"
    notes:
      "n1": "Peanuts: ಶೇಂಗಾ ಎಣ್ಣೆ (śēṅgā eṇṇe), groundnut oil."
    examples:
      "ಶೇಂಗಾ ಚಟ್ನಿ ಮಾಡು.": { native: "Make groundnut chutney.", bases: { "ಚಟ್ನಿ": "chutney", "ಮಾಡು": "to make" } }
      "ಶೇಂಗಾ ಎಣ್ಣೆ ಇದೆ.": { native: "There is groundnut oil.", bases: { "ಎಣ್ಣೆ": "oil", "ಇದೆ": "to be" } }
  "kn-0794":
    native: "coriander"
    notes:
      "n1": "The leaves are used in cooking: ಕೊತ್ತಂಬರಿ ಸೊಪ್ಪು (kottambari soppu), coriander leaves."
    examples:
      "ಕೊತ್ತಂಬರಿ ಸೊಪ್ಪು ತಾಜಾ.": { native: "The coriander leaves are fresh.", bases: { "ಸೊಪ್ಪು": "leaves", "ತಾಜಾ": "fresh" } }
      "ಸಾರಿಗೆ ಕೊತ್ತಂಬರಿ ಹಾಕು.": { native: "Add coriander to the curry.", bases: { "ಸಾರಿಗೆ": "to the curry", "ಹಾಕು": "to add" } }
