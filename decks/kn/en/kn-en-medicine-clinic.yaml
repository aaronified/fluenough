id: "kn-en-medicine-clinic"
kind: "layer"
core: "kn-medicine-clinic"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Medicine: a clinic appointment"
license: "CC-BY-SA-4.0"
description: "Phrases and words for a visit to the doctor: the symptoms and the instructions the doctor gives."
cards:
  "kn-6500":
    native: "What is the trouble?"
    notes: { n1: "ನಿಮಗೆ (nimage), to you, is the polite form a doctor uses with an adult patient; ತೊಂದರೆ (tondare) means trouble, so the question is literally what trouble you have." }
  "kn-6501":
    native: "I have had a fever since yesterday."
  "kn-6502":
    native: "Where does it hurt?"
  "kn-6503":
    native: "Please sit down here."
    notes: { n1: "ಕುಳಿತುಕೊಳ್ಳಿ (kuḷitukoḷḷi) is the polite command of ಕುಳಿತುಕೊಳ್ಳು (kuḷitukoḷḷu), to sit." }
  "kn-6504":
    native: "Open your mouth."
    notes: { n1: "ತೆರೆಯಿರಿ (tereyiri) is the polite command of ತೆರೆ (tere), to open; the ending is -ಯಿರಿ (-yiri) on a stem that ends in a vowel, for one person you respect." }
  "kn-6505":
    native: "Breathe deeply."
  "kn-6506":
    native: "Take this tablet twice a day."
    notes: { n1: "ಮಾತ್ರೆಯನ್ನು (mātreyannu) is ಮಾತ್ರೆ (mātre), tablet, with -ಯನ್ನು (-yannu) added because the object follows a word ending in ಎ (e)." }
  "kn-6507":
    native: "Come back after a week."
    notes: { n1: "ಬನ್ನಿ (banni) is the polite command of ಬರು (baru), to come; to a child you would say ಬಾ (bā)." }
  "kn-6508":
    native: "Do you have any allergy?"
  "kn-6509":
    native: "Your blood pressure is high."
    notes: { n1: "ನಿಮ್ಮ (nimma), your, is the form of ನೀವು (nīvu), you, before a noun." }
