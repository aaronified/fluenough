schema: 1
id: "kn-en-places"
kind: "layer"
core: "kn-places"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Places"
license: "CC-BY-SA-4.0"
description: "Places in a town, in the country and by the sea: where you study, pray, bank, wait and walk. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-0826":
    native: "school"
    notes:
      "n1": "Go to school: ಶಾಲೆಗೆ ಹೋಗು (śālege hōgu)."
    examples:
      "ಮಕ್ಕಳು ಶಾಲೆಗೆ ಹೋಗುತ್ತಾರೆ.": { native: "The children go to school.", bases: { "ಮಕ್ಕಳು": "children", "ಶಾಲೆಗೆ": "to school", "ಹೋಗುತ್ತಾರೆ": "to go" } }
      "ಅವಳು ಶಾಲೆಯಲ್ಲಿ ಕಲಿಸುತ್ತಾಳೆ.": { native: "She teaches at school.", bases: { "ಶಾಲೆಯಲ್ಲಿ": "at school", "ಕಲಿಸುತ್ತಾಳೆ": "to teach", "ಅವಳು": "she" } }
  "kn-0827":
    native: "college"
    notes:
      "n1": "The college: ಕಾಲೇಜು (kālēju), after school."
    examples:
      "ಅವನು ಕಾಲೇಜಿಗೆ ಹೋಗುತ್ತಾನೆ.": { native: "He goes to college.", bases: { "ಕಾಲೇಜಿಗೆ": "to college", "ಹೋಗುತ್ತಾನೆ": "to go", "ಅವನು": "he" } }
      "ಕಾಲೇಜು ದೊಡ್ಡದು.": { native: "The college is big.", bases: { "ದೊಡ್ಡದು": "big" } }
  "kn-0828":
    native: "bank"
    notes:
      "n1": "The bank: ಬ್ಯಾಂಕು (byāṅku), a loan word."
    examples:
      "ಬ್ಯಾಂಕು ಬೆಳಿಗ್ಗೆ ತೆರೆಯುತ್ತದೆ.": { native: "The bank opens in the morning.", bases: { "ಬೆಳಿಗ್ಗೆ": "in the morning", "ತೆರೆಯುತ್ತದೆ": "to open" } }
      "ನಾನು ಬ್ಯಾಂಕಿಗೆ ಹೋಗಬೇಕು.": { native: "I have to go to the bank.", bases: { "ಬ್ಯಾಂಕಿಗೆ": "to the bank", "ಹೋಗಬೇಕು": "to have to go", "ನಾನು": "I" } }
  "kn-0829":
    native: "post office; post"
    notes:
      "n1": "The post office: ಅಂಚೆ ಕಚೇರಿ (añce kacēri), the post office."
    examples:
      "ಈ ಪತ್ರ ಅಂಚೆಯಲ್ಲಿ ಕಳುಹಿಸು.": { native: "Send this letter by post.", bases: { "ಈ": "this", "ಪತ್ರ": "letter", "ಅಂಚೆಯಲ್ಲಿ": "by post", "ಕಳುಹಿಸು": "to send" } }
      "ಅಂಚೆ ಎಲ್ಲಿದೆ?": { native: "Where is the post office?", bases: { "ಎಲ್ಲಿದೆ": "is where" } }
  "kn-0830":
    native: "temple"
    notes:
      "n1": "A temple: ದೇವಸ್ಥಾನಕ್ಕೆ (dēvasthānakke), to the temple."
    examples:
      "ಅಮ್ಮ ದೇವಸ್ಥಾನಕ್ಕೆ ಹೋಗುತ್ತಾಳೆ.": { native: "Mother goes to the temple.", bases: { "ಅಮ್ಮ": "mother", "ದೇವಸ್ಥಾನಕ್ಕೆ": "to the temple", "ಹೋಗುತ್ತಾಳೆ": "to go" } }
      "ದೇವಸ್ಥಾನ ಹಳೆಯದು.": { native: "The temple is old.", bases: { "ಹಳೆಯದು": "old" } }
  "kn-0831":
    native: "mosque"
    notes:
      "n1": "A mosque, a place of prayer."
    examples:
      "ಮಸೀದಿ ಹತ್ತಿರ ಇದೆ.": { native: "The mosque is near.", bases: { "ಹತ್ತಿರ": "near", "ಇದೆ": "to be" } }
      "ಮಸೀದಿಯಲ್ಲಿ ಶಾಂತಿ ಇದೆ.": { native: "There is peace in the mosque.", bases: { "ಮಸೀದಿಯಲ್ಲಿ": "in the mosque", "ಶಾಂತಿ": "peace", "ಇದೆ": "to be" } }
  "kn-0832":
    native: "church"
    notes:
      "n1": "A church: ಚರ್ಚು (carcu), a loan word."
    examples:
      "ಭಾನುವಾರ ಚರ್ಚಿಗೆ ಹೋಗುತ್ತಾರೆ.": { native: "They go to church on Sunday.", bases: { "ಭಾನುವಾರ": "on Sunday", "ಚರ್ಚಿಗೆ": "to church", "ಹೋಗುತ್ತಾರೆ": "to go" } }
      "ಚರ್ಚು ದೊಡ್ಡದು.": { native: "The church is big.", bases: { "ದೊಡ್ಡದು": "big" } }
  "kn-0833":
    native: "park; garden"
    notes:
      "n1": "A park: ಉದ್ಯಾನ (udyāna), with trees and paths."
    examples:
      "ಮಕ್ಕಳು ಉದ್ಯಾನದಲ್ಲಿ ಆಡುತ್ತಾರೆ.": { native: "The children play in the park.", bases: { "ಮಕ್ಕಳು": "children", "ಉದ್ಯಾನದಲ್ಲಿ": "in the park", "ಆಡುತ್ತಾರೆ": "to play" } }
      "ಉದ್ಯಾನ ಸುಂದರ.": { native: "The park is beautiful.", bases: { "ಸುಂದರ": "beautiful" } }
  "kn-0834":
    native: "lake; pond"
    notes:
      "n1": "A lake or a pond: ಕೆರೆ (kere)."
    examples:
      "ಕೆರೆಯಲ್ಲಿ ನೀರು ಇದೆ.": { native: "There is water in the lake.", bases: { "ಕೆರೆಯಲ್ಲಿ": "in the lake", "ನೀರು": "water", "ಇದೆ": "to be" } }
      "ಕೆರೆ ದೊಡ್ಡದು.": { native: "The lake is big.", bases: { "ದೊಡ್ಡದು": "big" } }
  "kn-0835":
    native: "river"
    notes:
      "n1": "A river: ನದಿ (nadi), which flows."
    examples:
      "ನದಿ ಹರಿಯುತ್ತದೆ.": { native: "The river flows.", bases: { "ಹರಿಯುತ್ತದೆ": "to flow" } }
      "ನದಿಯಲ್ಲಿ ಈಜುತ್ತಾರೆ.": { native: "They swim in the river.", bases: { "ನದಿಯಲ್ಲಿ": "in the river", "ಈಜುತ್ತಾರೆ": "to swim" } }
  "kn-0836":
    native: "hill"
    notes:
      "n1": "A hill is smaller than a mountain: ಬೆಟ್ಟ (beṭṭa)."
    examples:
      "ಬೆಟ್ಟ ಎತ್ತರ ಇದೆ.": { native: "The hill is high.", bases: { "ಎತ್ತರ": "high", "ಇದೆ": "to be" } }
      "ಬೆಟ್ಟದ ಮೇಲೆ ಮರ ಇದೆ.": { native: "There is a tree on the hill.", bases: { "ಬೆಟ್ಟದ": "of the hill", "ಮೇಲೆ": "on", "ಮರ": "tree", "ಇದೆ": "to be" } }
  "kn-0837":
    native: "forest"
    notes:
      "n1": "A forest: ಕಾಡು (kāḍu), dense with trees."
    examples:
      "ಕಾಡಿನಲ್ಲಿ ಹುಲಿ ಇದೆ.": { native: "There is a tiger in the forest.", bases: { "ಕಾಡಿನಲ್ಲಿ": "in the forest", "ಹುಲಿ": "tiger", "ಇದೆ": "to be" } }
      "ಕಾಡು ದಟ್ಟ.": { native: "The forest is dense.", bases: { "ದಟ್ಟ": "dense" } }
  "kn-0838":
    native: "field; farm"
    notes:
      "n1": "A field: ಹೊಲ (hola), where crops grow."
    examples:
      "ರೈತ ಹೊಲದಲ್ಲಿ ಕೆಲಸ ಮಾಡುತ್ತಾನೆ.": { native: "The farmer works in the field.", bases: { "ರೈತ": "farmer", "ಹೊಲದಲ್ಲಿ": "in the field", "ಕೆಲಸ": "work", "ಮಾಡುತ್ತಾನೆ": "to do" } }
      "ಹೊಲ ವಿಶಾಲ.": { native: "The field is wide.", bases: { "ವಿಶಾಲ": "wide" } }
  "kn-0839":
    native: "footpath"
    notes:
      "n1": "A footpath: ಕಾಲುದಾರಿ (kāludāri), for people on foot."
    examples:
      "ಕಾಲುದಾರಿಯಲ್ಲಿ ನಡೆ.": { native: "Walk on the footpath.", bases: { "ಕಾಲುದಾರಿಯಲ್ಲಿ": "on the footpath", "ನಡೆ": "to walk" } }
      "ಕಾಲುದಾರಿ ಕಿರಿದು.": { native: "The footpath is narrow.", bases: { "ಕಿರಿದು": "narrow" } }
  "kn-0840":
    native: "cinema; film"
    notes:
      "n1": "A film: ಸಿನಿಮಾ (sinimā), a loan word."
    examples:
      "ಭಾನುವಾರ ಸಿನಿಮಾ ನೋಡುತ್ತೇನೆ.": { native: "I watch a film on Sunday.", bases: { "ಭಾನುವಾರ": "on Sunday", "ನೋಡುತ್ತೇನೆ": "to see" } }
      "ಸಿನಿಮಾ ಶುರು ಆಯಿತು.": { native: "The film has started.", bases: { "ಶುರು": "start", "ಆಯಿತು": "to happen" } }
  "kn-0841":
    native: "theatre"
    notes:
      "n1": "A theatre for plays: ರಂಗಮಂದಿರ (raṅgamandira)."
    examples:
      "ರಂಗಮಂದಿರ ಹತ್ತಿರ ಇದೆ.": { native: "The theatre is near.", bases: { "ಹತ್ತಿರ": "near", "ಇದೆ": "to be" } }
      "ರಂಗಮಂದಿರದಲ್ಲಿ ನಾಟಕ ಇದೆ.": { native: "There is a play in the theatre.", bases: { "ರಂಗಮಂದಿರದಲ್ಲಿ": "in the theatre", "ನಾಟಕ": "play", "ಇದೆ": "to be" } }
  "kn-0842":
    native: "library"
    notes:
      "n1": "A library: ಗ್ರಂಥಾಲಯ (granthālaya), a place to read."
    examples:
      "ಗ್ರಂಥಾಲಯದಲ್ಲಿ ಓದು.": { native: "Read in the library.", bases: { "ಗ್ರಂಥಾಲಯದಲ್ಲಿ": "in the library", "ಓದು": "to read" } }
      "ಗ್ರಂಥಾಲಯ ಶಾಂತ.": { native: "The library is quiet.", bases: { "ಶಾಂತ": "quiet" } }
  "kn-0843":
    native: "ground; playground"
    notes:
      "n1": "An open ground: ಮೈದಾನ (maidāna), for games."
    examples:
      "ಮಕ್ಕಳು ಮೈದಾನದಲ್ಲಿ ಆಡುತ್ತಾರೆ.": { native: "The children play on the ground.", bases: { "ಮಕ್ಕಳು": "children", "ಮೈದಾನದಲ್ಲಿ": "on the ground", "ಆಡುತ್ತಾರೆ": "to play" } }
      "ಮೈದಾನ ದೊಡ್ಡದು.": { native: "The ground is big.", bases: { "ದೊಡ್ಡದು": "big" } }
  "kn-0844":
    native: "market"
    notes:
      "n1": "A market: ಮಾರುಕಟ್ಟೆ (mārukaṭṭe), where things are sold."
    examples:
      "ಮಾರುಕಟ್ಟೆಯಲ್ಲಿ ತರಕಾರಿ ಇದೆ.": { native: "There are vegetables in the market.", bases: { "ಮಾರುಕಟ್ಟೆಯಲ್ಲಿ": "in the market", "ತರಕಾರಿ": "vegetables", "ಇದೆ": "to be" } }
      "ಮಾರುಕಟ್ಟೆ ಬೆಳಿಗ್ಗೆ ತೆರೆಯುತ್ತದೆ.": { native: "The market opens in the morning.", bases: { "ಬೆಳಿಗ್ಗೆ": "in the morning", "ತೆರೆಯುತ್ತದೆ": "to open" } }
  "kn-0845":
    native: "fort"
    notes:
      "n1": "A fort: ಕೋಟೆ (kōṭe), built on a hill."
    examples:
      "ಕೋಟೆ ಎತ್ತರ ಇದೆ.": { native: "The fort is high.", bases: { "ಎತ್ತರ": "high", "ಇದೆ": "to be" } }
      "ನಾವು ಕೋಟೆಗೆ ಹೋಗುತ್ತೇವೆ.": { native: "We go to the fort.", bases: { "ಕೋಟೆಗೆ": "to the fort", "ಹೋಗುತ್ತೇವೆ": "to go", "ನಾವು": "we" } }
  "kn-0846":
    native: "sea"
    notes:
      "n1": "The sea: ಸಮುದ್ರ (samudra), salty."
    examples:
      "ಸಮುದ್ರ ನೀಲಿ.": { native: "The sea is blue.", bases: { "ನೀಲಿ": "blue" } }
      "ಸಮುದ್ರದಲ್ಲಿ ನೀರು ಉಪ್ಪು.": { native: "The sea water is salty.", bases: { "ಸಮುದ್ರದಲ್ಲಿ": "in the sea", "ನೀರು": "water", "ಉಪ್ಪು": "salty" } }
  "kn-0847":
    native: "mountain"
    notes:
      "n1": "A mountain: ಪರ್ವತ (parvata), bigger than a hill."
    examples:
      "ಪರ್ವತ ತುಂಬ ಎತ್ತರ.": { native: "The mountain is very high.", bases: { "ತುಂಬ": "very", "ಎತ್ತರ": "high" } }
      "ಪರ್ವತದ ಮೇಲೆ ಹಿಮ ಇದೆ.": { native: "There is snow on the mountain.", bases: { "ಪರ್ವತದ": "of the mountain", "ಮೇಲೆ": "on", "ಹಿಮ": "snow", "ಇದೆ": "to be" } }
  "kn-0848":
    native: "waterfall"
    notes:
      "n1": "A waterfall: ಜಲಪಾತ (jalapāta)."
    examples:
      "ಜಲಪಾತ ಸುಂದರ.": { native: "The waterfall is beautiful.", bases: { "ಸುಂದರ": "beautiful" } }
      "ಜಲಪಾತದ ನೀರು ತಣ್ಣಗಿದೆ.": { native: "The waterfall's water is cold.", bases: { "ಜಲಪಾತದ": "of the waterfall", "ನೀರು": "water", "ತಣ್ಣಗಿದೆ": "to be cold" } }
  "kn-0849":
    native: "desert"
    notes:
      "n1": "A desert: ಮರುಭೂಮಿ (marubhūmi), dry and hot."
    examples:
      "ಮರುಭೂಮಿ ಬಿಸಿ ಇದೆ.": { native: "The desert is hot.", bases: { "ಬಿಸಿ": "hot", "ಇದೆ": "to be" } }
      "ಮರುಭೂಮಿಯಲ್ಲಿ ನೀರು ಕಡಿಮೆ.": { native: "There is little water in the desert.", bases: { "ಮರುಭೂಮಿಯಲ್ಲಿ": "in the desert", "ನೀರು": "water", "ಕಡಿಮೆ": "little" } }
  "kn-0850":
    native: "statue"
    notes:
      "n1": "A statue: ಪ್ರತಿಮೆ (pratime), standing in a town."
    examples:
      "ಊರಿನಲ್ಲಿ ಪ್ರತಿಮೆ ಇದೆ.": { native: "There is a statue in the town.", bases: { "ಊರಿನಲ್ಲಿ": "in the town", "ಇದೆ": "to be" } }
      "ಪ್ರತಿಮೆ ಎತ್ತರ.": { native: "The statue is tall.", bases: { "ಎತ್ತರ": "tall" } }
  "kn-0851":
    native: "residential area"
    notes:
      "n1": "A housing colony or area: ಬಡಾವಣೆ (baḍāvaṇe)."
    examples:
      "ನನ್ನ ಬಡಾವಣೆ ದೊಡ್ಡದು.": { native: "My area is big.", bases: { "ನನ್ನ": "my", "ದೊಡ್ಡದು": "big" } }
      "ಬಡಾವಣೆಯಲ್ಲಿ ಉದ್ಯಾನ ಇದೆ.": { native: "There is a park in the area.", bases: { "ಬಡಾವಣೆಯಲ್ಲಿ": "in the area", "ಉದ್ಯಾನ": "park", "ಇದೆ": "to be" } }
  "kn-0852":
    native: "factory"
    notes:
      "n1": "A factory: ಕಾರ್ಖಾನೆ (kārkhāne), where goods are made."
    examples:
      "ಕಾರ್ಖಾನೆ ನಗರದ ಹೊರಗೆ ಇದೆ.": { native: "The factory is outside the city.", bases: { "ನಗರದ": "of the city", "ಹೊರಗೆ": "outside", "ಇದೆ": "to be" } }
      "ಕಾರ್ಖಾನೆಯಲ್ಲಿ ಜನ ಕೆಲಸ ಮಾಡುತ್ತಾರೆ.": { native: "People work in the factory.", bases: { "ಕಾರ್ಖಾನೆಯಲ್ಲಿ": "in the factory", "ಜನ": "people", "ಕೆಲಸ": "work", "ಮಾಡುತ್ತಾರೆ": "to do" } }
  "kn-0853":
    native: "port; harbour"
    notes:
      "n1": "A port: ಬಂದರು (bandaru), where ships come."
    examples:
      "ಬಂದರು ದೊಡ್ಡದು.": { native: "The port is big.", bases: { "ದೊಡ್ಡದು": "big" } }
      "ಹಡಗು ಬಂದರಿನಲ್ಲಿ ಇದೆ.": { native: "The ship is in the port.", bases: { "ಹಡಗು": "ship", "ಬಂದರಿನಲ್ಲಿ": "in the port", "ಇದೆ": "to be" } }
  "kn-0854":
    native: "stadium"
    notes:
      "n1": "A stadium: ಕ್ರೀಡಾಂಗಣ (krīḍāṅgaṇa), a sports ground."
    examples:
      "ಕ್ರೀಡಾಂಗಣ ದೊಡ್ಡದು.": { native: "The stadium is big.", bases: { "ದೊಡ್ಡದು": "big" } }
      "ಕ್ರೀಡಾಂಗಣದಲ್ಲಿ ಪಂದ್ಯ ಇದೆ.": { native: "There is a match in the stadium.", bases: { "ಕ್ರೀಡಾಂಗಣದಲ್ಲಿ": "in the stadium", "ಪಂದ್ಯ": "match", "ಇದೆ": "to be" } }
  "kn-0855":
    native: "cinema hall"
    notes:
      "n1": "A cinema hall: ಚಿತ್ರಮಂದಿರ (citramandira)."
    examples:
      "ಚಿತ್ರಮಂದಿರ ಹತ್ತಿರ ಇದೆ.": { native: "The cinema hall is near.", bases: { "ಹತ್ತಿರ": "near", "ಇದೆ": "to be" } }
      "ಚಿತ್ರಮಂದಿರದಲ್ಲಿ ಜನ ಇದ್ದಾರೆ.": { native: "There are people in the cinema hall.", bases: { "ಚಿತ್ರಮಂದಿರದಲ್ಲಿ": "in the cinema hall", "ಜನ": "people", "ಇದ್ದಾರೆ": "to be" } }
  "kn-0856":
    native: "university"
    notes:
      "n1": "A university: ವಿಶ್ವವಿದ್ಯಾಲಯ (viśvavidyālaya)."
    examples:
      "ನನ್ನ ಅಣ್ಣ ವಿಶ್ವವಿದ್ಯಾಲಯದಲ್ಲಿ ಓದುತ್ತಾನೆ.": { native: "My elder brother studies at the university.", bases: { "ಅಣ್ಣ": "elder brother", "ವಿಶ್ವವಿದ್ಯಾಲಯದಲ್ಲಿ": "at the university", "ಓದುತ್ತಾನೆ": "to study", "ನನ್ನ": "my" } }
      "ವಿಶ್ವವಿದ್ಯಾಲಯ ದೂರ ಇದೆ.": { native: "The university is far.", bases: { "ದೂರ": "far", "ಇದೆ": "to be" } }
  "kn-0857":
    native: "hostel"
    notes:
      "n1": "A hostel: ಹಾಸ್ಟೆಲ್ (hāsṭel), a loan word."
    examples:
      "ಅವನು ಹಾಸ್ಟೆಲಿನಲ್ಲಿ ಇರುತ್ತಾನೆ.": { native: "He lives in the hostel.", bases: { "ಹಾಸ್ಟೆಲಿನಲ್ಲಿ": "in the hostel", "ಇರುತ್ತಾನೆ": "to live", "ಅವನು": "he" } }
      "ಹಾಸ್ಟೆಲ್ ಸ್ವಚ್ಛ ಇದೆ.": { native: "The hostel is clean.", bases: { "ಸ್ವಚ್ಛ": "clean", "ಇದೆ": "to be" } }
  "kn-0858":
    native: "kindergarten"
    notes:
      "n1": "A kindergarten for small children: ಬಾಲವಾಡಿ (bālavāḍi)."
    examples:
      "ಮಗು ಬಾಲವಾಡಿಗೆ ಹೋಗುತ್ತದೆ.": { native: "The child goes to kindergarten.", bases: { "ಮಗು": "child", "ಬಾಲವಾಡಿಗೆ": "to kindergarten", "ಹೋಗುತ್ತದೆ": "to go" } }
      "ಬಾಲವಾಡಿ ಚಿಕ್ಕದು.": { native: "The kindergarten is small.", bases: { "ಚಿಕ್ಕದು": "small" } }
  "kn-0859":
    native: "hall"
    notes:
      "n1": "A hall for meetings: ಸಭಾಂಗಣ (sabhāṅgaṇa)."
    examples:
      "ಸಭಾಂಗಣದಲ್ಲಿ ಜನ ಇದ್ದಾರೆ.": { native: "There are people in the hall.", bases: { "ಸಭಾಂಗಣದಲ್ಲಿ": "in the hall", "ಜನ": "people", "ಇದ್ದಾರೆ": "to be" } }
      "ಸಭಾಂಗಣ ದೊಡ್ಡದು.": { native: "The hall is big.", bases: { "ದೊಡ್ಡದು": "big" } }
  "kn-0860":
    native: "court"
    notes:
      "n1": "A court of law: ನ್ಯಾಯಾಲಯ (nyāyālaya)."
    examples:
      "ನ್ಯಾಯಾಲಯ ಎಲ್ಲಿದೆ?": { native: "Where is the court?", bases: { "ಎಲ್ಲಿದೆ": "is where" } }
      "ಅವನು ನ್ಯಾಯಾಲಯಕ್ಕೆ ಹೋಗುತ್ತಾನೆ.": { native: "He goes to court.", bases: { "ನ್ಯಾಯಾಲಯಕ್ಕೆ": "to court", "ಹೋಗುತ್ತಾನೆ": "to go", "ಅವನು": "he" } }
  "kn-0861":
    native: "pharmacy"
    notes:
      "n1": "A pharmacy: ಔಷಧಾಲಯ (auṣadhālaya), where medicine is sold."
    examples:
      "ಔಷಧಾಲಯ ಬೆಳಿಗ್ಗೆ ತೆರೆಯುತ್ತದೆ.": { native: "The pharmacy opens in the morning.", bases: { "ಬೆಳಿಗ್ಗೆ": "in the morning", "ತೆರೆಯುತ್ತದೆ": "to open" } }
      "ಔಷಧಿ ಔಷಧಾಲಯದಲ್ಲಿ ಸಿಗುತ್ತದೆ.": { native: "Medicine is available at the pharmacy.", bases: { "ಔಷಧಾಲಯದಲ್ಲಿ": "at the pharmacy", "ಸಿಗುತ್ತದೆ": "to be available" } }
  "kn-0862":
    native: "museum"
    notes:
      "n1": "A museum: ವಸ್ತುಸಂಗ್ರಹಾಲಯ (vastusaṅgrahālaya), which keeps old things."
    examples:
      "ವಸ್ತುಸಂಗ್ರಹಾಲಯ ನಾಳೆ ಮುಚ್ಚಿದೆ.": { native: "The museum is closed tomorrow.", bases: { "ನಾಳೆ": "tomorrow", "ಮುಚ್ಚಿದೆ": "closed" } }
      "ನಾವು ವಸ್ತುಸಂಗ್ರಹಾಲಯ ನೋಡಿದೆವು.": { native: "We saw the museum.", bases: { "ನಾವು": "we", "ನೋಡಿದೆವು": "to see" } }
  "kn-0863":
    native: "office"
    notes:
      "n1": "An office: ಕಚೇರಿ (kacēri), where people work."
    examples:
      "ಕಚೇರಿ ಬೆಳಿಗ್ಗೆ ಶುರು ಆಗುತ್ತದೆ.": { native: "The office starts in the morning.", bases: { "ಬೆಳಿಗ್ಗೆ": "in the morning", "ಶುರು": "start", "ಆಗುತ್ತದೆ": "to start" } }
      "ಅವಳು ಕಚೇರಿಗೆ ಹೋಗುತ್ತಾಳೆ.": { native: "She goes to the office.", bases: { "ಕಚೇರಿಗೆ": "to the office", "ಹೋಗುತ್ತಾಳೆ": "to go", "ಅವಳು": "she" } }
  "kn-0864":
    native: "bus"
    notes:
      "n1": "A bus: ಬಸ್ (bas), which stops at a station."
    examples:
      "ಬಸ್ ಇಲ್ಲಿ ನಿಲ್ಲುತ್ತದೆ.": { native: "The bus stops here.", bases: { "ಇಲ್ಲಿ": "here", "ನಿಲ್ಲುತ್ತದೆ": "to stop" } }
      "ಬಸ್ ಬಂತು.": { native: "The bus came.", bases: { "ಬಂತು": "came" } }
  "kn-0865":
    native: "garden; orchard"
    notes:
      "n1": "A garden of plants: ತೋಟ (tōṭa)."
    examples:
      "ಮನೆಯ ಹಿಂದೆ ತೋಟ ಇದೆ.": { native: "There is a garden behind the house.", bases: { "ಮನೆಯ": "of the house", "ಹಿಂದೆ": "behind", "ಇದೆ": "to be" } }
      "ತೋಟದಲ್ಲಿ ಹೂ ಅರಳಿದೆ.": { native: "Flowers have bloomed in the garden.", bases: { "ತೋಟದಲ್ಲಿ": "in the garden", "ಹೂ": "flower", "ಅರಳಿದೆ": "to bloom" } }
  "kn-0866":
    native: "market (weekly)"
    notes:
      "n1": "A weekly market in a town: ಸಂತೆ (sante)."
    examples:
      "ಭಾನುವಾರ ಸಂತೆ ಇರುತ್ತದೆ.": { native: "There is a market on Sunday.", bases: { "ಭಾನುವಾರ": "on Sunday", "ಇರುತ್ತದೆ": "to be" } }
      "ಸಂತೆಯಲ್ಲಿ ತರಕಾರಿ ಅಗ್ಗ.": { native: "Vegetables are cheap at the market.", bases: { "ಸಂತೆಯಲ್ಲಿ": "at the market", "ತರಕಾರಿ": "vegetables", "ಅಗ್ಗ": "cheap" } }
  "kn-0867":
    native: "street"
    notes:
      "n1": "A street: ಬೀದಿ (bīdi), in a town."
    examples:
      "ಬೀದಿಯಲ್ಲಿ ಜನ ಓಡಾಡುತ್ತಾರೆ.": { native: "People walk about in the street.", bases: { "ಬೀದಿಯಲ್ಲಿ": "in the street", "ಜನ": "people", "ಓಡಾಡುತ್ತಾರೆ": "to walk about" } }
      "ಬೀದಿ ಅಗಲ ಇದೆ.": { native: "The street is wide.", bases: { "ಅಗಲ": "wide", "ಇದೆ": "to be" } }
  "kn-0868":
    native: "village"
    notes:
      "n1": "A village: ಹಳ್ಳಿ (haḷḷi), smaller than a town."
    examples:
      "ಹಳ್ಳಿ ಶಾಂತ.": { native: "The village is peaceful.", bases: { "ಶಾಂತ": "peaceful" } }
      "ಅವನು ಹಳ್ಳಿಯಲ್ಲಿ ವಾಸಿಸುತ್ತಾನೆ.": { native: "He lives in a village.", bases: { "ಹಳ್ಳಿಯಲ್ಲಿ": "in a village", "ವಾಸಿಸುತ್ತಾನೆ": "to live", "ಅವನು": "he" } }
  "kn-0869":
    native: "shrine; small temple"
    notes:
      "n1": "A small temple: ಗುಡಿ (guḍi)."
    examples:
      "ಗುಡಿ ಹಳೆಯದು.": { native: "The shrine is old.", bases: { "ಹಳೆಯದು": "old" } }
      "ಅಮ್ಮ ಗುಡಿಗೆ ಹೋದಳು.": { native: "Mother went to the shrine.", bases: { "ಅಮ್ಮ": "mother", "ಗುಡಿಗೆ": "to the shrine", "ಹೋದಳು": "went" } }
  "kn-0870":
    native: "pond"
    notes:
      "n1": "A small pond: ಕೊಳ (koḷa)."
    examples:
      "ಕೊಳದಲ್ಲಿ ಮೀನು ಇದೆ.": { native: "There are fish in the pond.", bases: { "ಕೊಳದಲ್ಲಿ": "in the pond", "ಮೀನು": "fish", "ಇದೆ": "to be" } }
      "ಕೊಳ ಚಿಕ್ಕದು.": { native: "The pond is small.", bases: { "ಚಿಕ್ಕದು": "small" } }
  "kn-0871":
    native: "valley"
    notes:
      "n1": "A valley between hills: ಕಣಿವೆ (kaṇive)."
    examples:
      "ಕಣಿವೆ ಆಳ ಇದೆ.": { native: "The valley is deep.", bases: { "ಆಳ": "deep", "ಇದೆ": "to be" } }
      "ಕಣಿವೆಯಲ್ಲಿ ಹೊಳೆ ಹರಿಯುತ್ತದೆ.": { native: "A stream flows in the valley.", bases: { "ಕಣಿವೆಯಲ್ಲಿ": "in the valley", "ಹೊಳೆ": "stream", "ಹರಿಯುತ್ತದೆ": "to flow" } }
  "kn-0872":
    native: "stream"
    notes:
      "n1": "A stream: ಹೊಳೆ (hoḷe), smaller than a river."
    examples:
      "ಹೊಳೆ ಶುದ್ಧ ಇದೆ.": { native: "The stream is clean.", bases: { "ಶುದ್ಧ": "clean", "ಇದೆ": "to be" } }
      "ಹೊಳೆಯಲ್ಲಿ ನೀರು ಹರಿಯುತ್ತದೆ.": { native: "Water flows in the stream.", bases: { "ಹೊಳೆಯಲ್ಲಿ": "in the stream", "ನೀರು": "water", "ಹರಿಯುತ್ತದೆ": "to flow" } }
  "kn-0873":
    native: "cave"
    notes:
      "n1": "A cave: ಗುಹೆ (guhe), dark inside."
    examples:
      "ಗುಹೆ ಕತ್ತಲು.": { native: "The cave is dark.", bases: { "ಕತ್ತಲು": "dark" } }
      "ಅವರು ಗುಹೆಯೊಳಗೆ ಹೋದರು.": { native: "They went into the cave.", bases: { "ಗುಹೆಯೊಳಗೆ": "into the cave", "ಹೋದರು": "went" } }
  "kn-0874":
    native: "reservoir"
    notes:
      "n1": "A reservoir of water: ಜಲಾಶಯ (jalāśaya)."
    examples:
      "ಜಲಾಶಯದಲ್ಲಿ ನೀರು ಇದೆ.": { native: "There is water in the reservoir.", bases: { "ಜಲಾಶಯದಲ್ಲಿ": "in the reservoir", "ನೀರು": "water", "ಇದೆ": "to be" } }
      "ಜಲಾಶಯ ದೊಡ್ಡದು.": { native: "The reservoir is big.", bases: { "ದೊಡ್ಡದು": "big" } }
