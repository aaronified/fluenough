cards:
  "kn-7027":
    native: "Where is the shop?"
  "kn-7028":
    notes:
      "n1": "ಬೆಲೆ ಎಷ್ಟು (bele eṣṭu) is the usual way to ask a price."
    native: "What is the price?"
  "kn-7029":
    notes:
      "n1": "ಜಾಸ್ತಿ (jāsti), too much or more, is said of a price."
    native: "That's too much!"
  "kn-7030":
    notes:
      "n1": "After a number the noun stays singular: ಒಂದು ಕೆಜಿ (ondu keji), one kilo."
    native: "Please give me one kilo."
  "kn-7031":
    native: "Please give me two litres of milk."
  "kn-7032":
    native: "How many rupees is a kilo?"
  "kn-7033":
    notes:
      "n1": "ದುಡ್ಡು (duḍḍu) is the everyday word for money in speech."
    native: "Where is the money?"
  "kn-7034":
    notes:
      "n1": "ಚಿಲ್ಲರೆ (cillare) is small change, the coins or notes given back."
    native: "Where is the change?"
  "kn-7035":
    notes:
      "n1": "ಮಾಡಿ (māḍi) is the polite command of ಮಾಡು (māḍu), do, here used to ask for a lower price."
    native: "Please lower the price a little."
