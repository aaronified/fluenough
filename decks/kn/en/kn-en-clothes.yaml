schema: 1
id: "kn-en-clothes"
kind: "layer"
core: "kn-clothes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Clothes"
license: "CC-BY-SA-4.0"
description: "Clothes and what you wear with them, from shirts and saris to shoes and jewellery. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-0900":
    native: "cloth; clothes"
    notes:
      "n1": "ಬಟ್ಟೆ (baṭṭe) is the general word for clothes and for cloth."
    examples:
      "ಅವಳು ಹೊಸ ಬಟ್ಟೆ ಕೊಂಡಳು.": { native: "She bought new clothes.", bases: { "ಹೊಸ": "new", "ಕೊಂಡಳು": "bought", "ಅವಳು": "she" } }
      "ಈ ಬಟ್ಟೆ ಮೃದು.": { native: "This cloth is soft.", bases: { "ಈ": "this", "ಮೃದು": "soft" } }
  "kn-0901":
    native: "shirt"
    notes:
      "n1": "A shirt for men or women: ಅಂಗಿ (aṅgi) is worn on the upper body."
    examples:
      "ಅವನು ನೀಲಿ ಅಂಗಿ ಹಾಕಿಕೊಂಡ.": { native: "He put on a blue shirt.", bases: { "ನೀಲಿ": "blue", "ಹಾಕಿಕೊಂಡ": "put on", "ಅವನು": "he" } }
      "ಅಂಗಿ ತೊಳೆಯಬೇಕು.": { native: "The shirt needs washing.", bases: { "ತೊಳೆಯಬೇಕು": "needs washing" } }
  "kn-0902":
    native: "trousers"
    notes:
      "n1": "Trousers are ಪ್ಯಾಂಟ್ (pyāṇṭ); the word is used for both men and women."
    examples:
      "ನನ್ನ ಪ್ಯಾಂಟ್ ಉದ್ದ.": { native: "My trousers are long.", bases: { "ಉದ್ದ": "long", "ನನ್ನ": "my" } }
      "ಅವನು ಪ್ಯಾಂಟ್ ಹಾಕಿಕೊಂಡ.": { native: "He put on trousers.", bases: { "ಹಾಕಿಕೊಂಡ": "put on", "ಅವನು": "he" } }
  "kn-0903":
    native: "sari"
    notes:
      "n1": "A sari is worn by many women in India, wrapped around the body."
    examples:
      "ಅವಳು ಕೆಂಪು ಸೀರೆ ಉಟ್ಟಳು.": { native: "She wore a red sari.", bases: { "ಕೆಂಪು": "red", "ಉಟ್ಟಳು": "wore", "ಅವಳು": "she" } }
      "ಸೀರೆ ಚೆನ್ನಾಗಿದೆ.": { native: "The sari is good.", bases: { "ಚೆನ್ನಾಗಿದೆ": "is good" } }
  "kn-0904":
    native: "shorts; underwear"
    notes:
      "n1": "Shorts for play and for sleep: ಚಡ್ಡಿ (caḍḍi) is short trousers."
    examples:
      "ಮಕ್ಕಳು ಚಡ್ಡಿ ಹಾಕಿಕೊಂಡು ಆಡುತ್ತಾರೆ.": { native: "The children play in shorts.", bases: { "ಮಕ್ಕಳು": "children", "ಹಾಕಿಕೊಂಡು": "wearing", "ಆಡುತ್ತಾರೆ": "play" } }
      "ನನ್ನ ಚಡ್ಡಿ ಹಳೆಯದು.": { native: "My shorts are old.", bases: { "ಹಳೆಯದು": "old", "ನನ್ನ": "my" } }
  "kn-0905":
    native: "lungi"
    notes:
      "n1": "A lungi is a long cloth wrapped around the waist, worn by men in the south."
    examples:
      "ಅವನು ಲುಂಗಿ ಉಟ್ಟ.": { native: "He wore a lungi.", bases: { "ಉಟ್ಟ": "wore", "ಅವನು": "he" } }
      "ಲುಂಗಿ ಮೃದು.": { native: "The lungi is soft.", bases: { "ಮೃದು": "soft" } }
  "kn-0906":
    native: "cap; hat"
    notes:
      "n1": "A cap or hat for the head: ಟೋಪಿ (ṭōpi) keeps off the sun."
    examples:
      "ಬಿಸಿಲಿಗೆ ಟೋಪಿ ಹಾಕು.": { native: "Wear a cap in the sun.", bases: { "ಬಿಸಿಲಿಗೆ": "in the sun", "ಹಾಕು": "wear" } }
      "ಟೋಪಿ ಹೊಸದು.": { native: "The cap is new.", bases: { "ಹೊಸದು": "new one" } }
  "kn-0907":
    native: "shoe"
    notes:
      "n1": "Shoes for walking or sport: ಶೂ (śū) covers the whole foot."
    examples:
      "ನನ್ನ ಶೂ ಬಿಗಿ.": { native: "My shoes are tight.", bases: { "ಬಿಗಿ": "tight", "ನನ್ನ": "my" } }
      "ಶೂ ಹಾಕಿಕೊಂಡು ನಡೆ.": { native: "Walk wearing shoes.", bases: { "ಹಾಕಿಕೊಂಡು": "wearing", "ನಡೆ": "walk" } }
  "kn-0908":
    native: "sandal; slipper"
    notes:
      "n1": "Open footwear: ಚಪ್ಪಲಿ (cappali) is worn at home and on the street."
    examples:
      "ಚಪ್ಪಲಿ ಎಲ್ಲಿವೆ?": { native: "Where are the sandals?", bases: { "ಎಲ್ಲಿವೆ": "where are" } }
      "ಅವನು ಚಪ್ಪಲಿ ಹಾಕಿಕೊಂಡು ಹೋದ.": { native: "He went out wearing sandals.", bases: { "ಹಾಕಿಕೊಂಡು": "wearing", "ಹೋದ": "went", "ಅವನು": "he" } }
  "kn-0909":
    native: "socks"
    notes:
      "n1": "Socks are worn inside shoes: ಸಾಕ್ಸ್ (sāks) keep the feet warm."
    examples:
      "ಸಾಕ್ಸ್ ಬೆಚ್ಚಗಿವೆ.": { native: "The socks are warm.", bases: { "ಬೆಚ್ಚಗಿವೆ": "are warm" } }
      "ನನ್ನ ಸಾಕ್ಸ್ ಎಲ್ಲಿವೆ?": { native: "Where are my socks?", bases: { "ಎಲ್ಲಿವೆ": "where are", "ನನ್ನ": "my" } }
  "kn-0910":
    native: "jacket"
    notes:
      "n1": "A jacket keeps the body warm in cold weather."
    examples:
      "ಚಳಿ ಇದೆ, ಜಾಕೆಟ್ ಹಾಕಿಕೊ.": { native: "It is cold; put on a jacket.", bases: { "ಚಳಿ": "cold", "ಇದೆ": "is", "ಹಾಕಿಕೊ": "put on" } }
      "ಜಾಕೆಟ್ ಬೆಚ್ಚಗಿದೆ.": { native: "The jacket is warm.", bases: { "ಬೆಚ್ಚಗಿದೆ": "is warm" } }
  "kn-0911":
    native: "sweater"
    notes:
      "n1": "A woollen top for winter: ಸ್ವೆಟರ್ (sveṭar) is worn over a shirt."
    examples:
      "ಅವಳು ಸ್ವೆಟರ್ ಹಾಕಿಕೊಂಡಳು.": { native: "She put on a sweater.", bases: { "ಹಾಕಿಕೊಂಡಳು": "put on", "ಅವಳು": "she" } }
      "ಸ್ವೆಟರ್ ದಪ್ಪ.": { native: "The sweater is thick.", bases: { "ದಪ್ಪ": "thick" } }
  "kn-0912":
    native: "belt"
    notes:
      "n1": "A belt holds the trousers up: ಬೆಲ್ಟ್ (belṭ) goes round the waist."
    examples:
      "ಬೆಲ್ಟ್ ಸಡಿಲ.": { native: "The belt is loose.", bases: { "ಸಡಿಲ": "loose" } }
      "ನನ್ನ ಬೆಲ್ಟ್ ಎಲ್ಲಿದೆ?": { native: "Where is my belt?", bases: { "ಎಲ್ಲಿದೆ": "where is", "ನನ್ನ": "my" } }
  "kn-0913":
    native: "spectacles; glasses"
    notes:
      "n1": "Glasses to see better: ಕನ್ನಡಕ (kannaḍaka) is worn on the face."
    examples:
      "ಅಜ್ಜಿ ಕನ್ನಡಕ ಹಾಕಿಕೊಂಡರು.": { native: "Grandmother put on her glasses.", bases: { "ಅಜ್ಜಿ": "grandmother", "ಹಾಕಿಕೊಂಡರು": "put on" } }
      "ನನ್ನ ಕನ್ನಡಕ ಮುರಿದಿದೆ.": { native: "My glasses are broken.", bases: { "ಮುರಿದಿದೆ": "is broken", "ನನ್ನ": "my" } }
  "kn-0914":
    native: "ring"
    notes:
      "n1": "A finger ring: ಉಂಗುರ (uṅgura) is worn on the hand."
    examples:
      "ಅವಳ ಉಂಗುರ ಚಿನ್ನದ್ದು.": { native: "Her ring is gold.", bases: { "ಅವಳ": "her", "ಚಿನ್ನದ್ದು": "gold" } }
      "ಉಂಗುರ ಬೆರಳಿನಲ್ಲಿದೆ.": { native: "The ring is on the finger.", bases: { "ಬೆರಳಿನಲ್ಲಿದೆ": "is on the finger" } }
  "kn-0915":
    native: "earring"
    notes:
      "n1": "An earring for the ear: ಓಲೆ (ōle) is worn in pairs."
    examples:
      "ಅವಳು ಓಲೆ ಹಾಕಿಕೊಂಡಳು.": { native: "She put on earrings.", bases: { "ಹಾಕಿಕೊಂಡಳು": "put on", "ಅವಳು": "she" } }
      "ಓಲೆ ಚಿನ್ನದ್ದು.": { native: "The earrings are gold.", bases: { "ಚಿನ್ನದ್ದು": "gold" } }
  "kn-0916":
    native: "necklace; chain"
    notes:
      "n1": "A chain worn round the neck: ಸರ (sara) can be gold or silver."
    examples:
      "ಅವಳ ಸರ ಉದ್ದ.": { native: "Her chain is long.", bases: { "ಅವಳ": "her", "ಉದ್ದ": "long" } }
      "ಸರ ಕುತ್ತಿಗೆಯಲ್ಲಿದೆ.": { native: "The chain is round the neck.", bases: { "ಕುತ್ತಿಗೆಯಲ್ಲಿದೆ": "is round the neck" } }
  "kn-0917":
    native: "dupatta; scarf"
    notes:
      "n1": "A long scarf worn with a churidar: ದುಪ್ಪಟ್ಟ (duppaṭṭa) covers the shoulders."
    examples:
      "ಅವಳು ದುಪ್ಪಟ್ಟ ಹಾಕಿಕೊಂಡಳು.": { native: "She put on a dupatta.", bases: { "ಹಾಕಿಕೊಂಡಳು": "put on", "ಅವಳು": "she" } }
      "ದುಪ್ಪಟ್ಟ ಬಣ್ಣದ್ದು.": { native: "The dupatta is coloured.", bases: { "ಬಣ್ಣದ್ದು": "coloured" } }
  "kn-0918":
    native: "handkerchief"
    notes:
      "n1": "A small cloth for the face and nose: ಕರವಸ್ತ್ರ (karavastra) is kept in a pocket."
    examples:
      "ಕರವಸ್ತ್ರ ಕೊಡು.": { native: "Give me a handkerchief.", bases: { "ಕೊಡು": "give" } }
      "ನನ್ನ ಬಳಿ ಕರವಸ್ತ್ರ ಇದೆ.": { native: "I have a handkerchief.", bases: { "ಬಳಿ": "with", "ಇದೆ": "is", "ನನ್ನ": "my" } }
  "kn-0919":
    native: "head cloth; turban"
    notes:
      "n1": "A cloth for the head or a scarf for the neck: ರುಮಾಲು (rumālu) is worn in cold weather."
    examples:
      "ಅವನು ಬಿಳಿ ರುಮಾಲು ಕಟ್ಟಿಕೊಂಡ.": { native: "He tied a white head cloth.", bases: { "ಬಿಳಿ": "white", "ಕಟ್ಟಿಕೊಂಡ": "tied", "ಅವನು": "he" } }
      "ರುಮಾಲು ಬೆಚ್ಚಗಿದೆ.": { native: "The head cloth is warm.", bases: { "ಬೆಚ್ಚಗಿದೆ": "is warm" } }
  "kn-0920":
    native: "coat"
    notes:
      "n1": "A long coat for winter: ಕೋಟು (kōṭu) is worn over other clothes."
    examples:
      "ಚಳಿಗೆ ಕೋಟು ಹಾಕಿಕೊ.": { native: "Put on a coat for the cold.", bases: { "ಚಳಿಗೆ": "for the cold", "ಹಾಕಿಕೊ": "put on" } }
      "ಕೋಟು ದುಬಾರಿ.": { native: "The coat is expensive.", bases: { "ದುಬಾರಿ": "expensive" } }
  "kn-0921":
    native: "vest; undershirt"
    notes:
      "n1": "A thin vest worn under a shirt: ಬನಿಯನ್ (baniyan) is a common word."
    examples:
      "ಅವನು ಬನಿಯನ್ ಹಾಕಿಕೊಂಡ.": { native: "He put on a vest.", bases: { "ಹಾಕಿಕೊಂಡ": "put on", "ಅವನು": "he" } }
      "ಬನಿಯನ್ ಬಿಳಿ.": { native: "The vest is white.", bases: { "ಬಿಳಿ": "white" } }
  "kn-0922":
    native: "churidar"
    notes:
      "n1": "A tight trouser suit for women, worn with a dupatta: ಚೂಡಿದಾರ (cūḍidāra)."
    examples:
      "ಅವಳು ಹಸಿರು ಚೂಡಿದಾರ ಹಾಕಿಕೊಂಡಳು.": { native: "She put on a green churidar.", bases: { "ಹಸಿರು": "green", "ಹಾಕಿಕೊಂಡಳು": "put on", "ಅವಳು": "she" } }
      "ಚೂಡಿದಾರ ಚೆನ್ನಾಗಿದೆ.": { native: "The churidar is nice.", bases: { "ಚೆನ್ನಾಗಿದೆ": "is nice" } }
  "kn-0923":
    native: "skirt"
    notes:
      "n1": "A skirt worn by girls and women: ಲಂಗ (laṅga) is worn with a blouse."
    examples:
      "ಮಗಳು ಕೆಂಪು ಲಂಗ ಹಾಕಿಕೊಂಡಳು.": { native: "My daughter put on a red skirt.", bases: { "ಮಗಳು": "daughter", "ಕೆಂಪು": "red", "ಹಾಕಿಕೊಂಡಳು": "put on" } }
      "ಲಂಗ ಉದ್ದ.": { native: "The skirt is long.", bases: { "ಉದ್ದ": "long" } }
  "kn-0924":
    native: "dhoti"
    notes:
      "n1": "A long cloth wrapped round the lower body, worn by men: ಪಂಚೆ (pañce)."
    examples:
      "ಅವನು ಬಿಳಿ ಪಂಚೆ ಉಟ್ಟ.": { native: "He wore a white dhoti.", bases: { "ಬಿಳಿ": "white", "ಉಟ್ಟ": "wore", "ಅವನು": "he" } }
      "ಪಂಚೆ ಸ್ವಚ್ಛ.": { native: "The dhoti is clean.", bases: { "ಸ್ವಚ್ಛ": "clean" } }
  "kn-0925":
    native: "muffler; scarf"
    notes:
      "n1": "A woollen scarf for winter: ಮಫ್ಲರ್ (maflar) is wrapped round the neck."
    examples:
      "ಚಳಿಗೆ ಮಫ್ಲರ್ ಹಾಕಿಕೊ.": { native: "Put on a scarf for the cold.", bases: { "ಚಳಿಗೆ": "for the cold", "ಹಾಕಿಕೊ": "put on" } }
      "ಮಫ್ಲರ್ ಉದ್ದ.": { native: "The muffler is long.", bases: { "ಉದ್ದ": "long" } }
