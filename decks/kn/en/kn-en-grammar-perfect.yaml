schema: 1
id: "kn-en-grammar-perfect"
kind: "layer"
core: "kn-grammar-perfect"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The perfect: I have done"
license: "CC-BY-SA-4.0"
description: "I have done, she has gone: what has already happened, by person and number. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "Perfect"
  slot_name: "person"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "maadu": "to do"
    "hoogu": "to go"
    "baru": "to come"
    "noodu": "to see"
  notes: "The perfect adds ದ್ದ (dda) to the past stem, then the present of ಇರು (iru): ಮಾಡಿದ್ದೇನೆ (māḍiddēne), I have done. For things (ಅದು (adu)) the verb ends in ದೆ (de): ಮಾಡಿದೆ (māḍide), it has done. For ಬಾ (bā), to come, it is ಬಂದಿದ್ದೇನೆ (bandiddēne), I have come."
