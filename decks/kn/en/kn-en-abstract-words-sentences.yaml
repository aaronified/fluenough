cards:
  "kn-7167":
    notes:
      "n1": "The question word ಏನು (ēnu), what, follows the noun it asks about, and Kannada needs no word for 'is': ಅರ್ಥ (artha) ಏನು (ēnu)? asks what the meaning is."
    native: "What is the meaning?"
  "kn-7168":
    notes:
      "n1": "ನನ್ನ (nanna), my, is the form of ನಾನು (nānu), I, before a noun, and the sentence needs no word for 'is'."
    native: "This is my life."
  "kn-7169":
    notes:
      "n1": "The question word ಏನು (ēnu), what, follows the noun, with no word for 'is': ಧರ್ಮ (dharma) ಏನು (ēnu)? asks what religion is."
    native: "What is religion?"
  "kn-7170":
    notes:
      "n1": "The question word ಏನು (ēnu), what, follows the noun, with no word for 'is': ನ್ಯಾಯ (nyāya) ಏನು (ēnu)? asks what justice is."
    native: "What is justice?"
  "kn-7171":
    notes:
      "n1": "The question word ಏನು (ēnu), what, follows the noun, with no word for 'is': ಸೌಂದರ್ಯ (saundarya) ಏನು (ēnu)? asks what beauty is."
    native: "What is beauty?"
  "kn-7172":
    notes:
      "n1": "ಅಲ್ಲ (alla), not, makes the noun before it negative, as in 'this is not the value': ಇದು (idu) ಮೌಲ್ಯ (maulya) ಅಲ್ಲ (alla)."
    native: "This is not the value."
  "kn-7173":
    notes:
      "n1": "ಯಾವಾಗ (yāvāga), when, follows the noun it asks about, with no word for 'is': ಆರಂಭ (ārambha) ಯಾವಾಗ (yāvāga)? asks when the beginning is."
    native: "When is the beginning?"
  "kn-7174":
    notes:
      "n1": "ಯಾವಾಗ (yāvāga), when, follows the noun it asks about, with no word for 'is': ಅಂತ್ಯ (antya) ಯಾವಾಗ (yāvāga)? asks when the end is."
    native: "When is the end?"
  "kn-7175":
    notes:
      "n1": "ಎಷ್ಟು (eṣṭu), how much, follows the noun it asks about, with no word for 'is': ಸಾಮರ್ಥ್ಯ (sāmarthya) ಎಷ್ಟು (eṣṭu)? asks how much ability there is."
    native: "How much ability is there?"
  "kn-7176":
    notes:
      "n1": "The question word ಏನು (ēnu), what, follows the noun, with no word for 'is': ಫಲಿತಾಂಶ (phalitāmśa) ಏನು (ēnu)? asks what the result is."
    native: "What is the result?"
  "kn-7177":
    native: "Which is the tradition?"
  "kn-7178":
    notes:
      "n1": "The question word ಏನು (ēnu), what, follows the noun, with no word for 'is': ಸಂಸ್ಕೃತಿ (samskruti) ಏನು (ēnu)? asks what culture is."
    native: "What is culture?"
  "kn-7179":
    notes:
      "n1": "The question word ಏನು (ēnu), what, follows the noun, with no word for 'is': ಕನಸು (kanasu) ಏನು (ēnu)? asks what a dream is."
    native: "What is a dream?"
