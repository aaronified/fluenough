schema: 1
id: "kn-en-abstract-words"
kind: "layer"
core: "kn-abstract-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Ideas and values: meaning, justice, life and culture"
license: "CC-BY-SA-4.0"
description: "Words for ideas and values: the meaning and the idea, justice and equality, knowledge and hope, the culture and the tradition, and life itself. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1656":
    native: "meaning"
    notes:
      "n1": "The meaning of a word or a sentence."
    examples:
      "ಈ ಪದದ ಅರ್ಥ ಏನು?": "What is the meaning of this word?"
      "ಅರ್ಥ ಚೆನ್ನಾಗಿದೆ.": "The meaning is good."
  "kn-1657":
    native: "idea, imagination"
    notes:
      "n1": "An idea, or imagination, a picture made in the mind."
    examples:
      "ಕಲ್ಪನೆ ಚೆನ್ನಾಗಿದೆ.": "The idea is good."
      "ಅವಳ ಕಲ್ಪನೆ ಜಾಸ್ತಿ.": "Her imagination is great."
  "kn-1658":
    native: "thought, topic"
    notes:
      "n1": "A thought, or a topic to talk about."
    examples:
      "ವಿಚಾರ ಚೆನ್ನಾಗಿದೆ.": "The thought is good."
      "ವಿಚಾರ ಬೇಕು.": "I need the thought."
  "kn-1659":
    native: "religion, duty"
    notes:
      "n1": "Religion, or the right way of living and duty."
    examples:
      "ಧರ್ಮ ಇದೆ.": { native: "There is religion.", bases: { "ಇದೆ": "there is" } }
      "ಧರ್ಮ ಬೇಕು.": "Religion is needed."
  "kn-1660":
    native: "justice, fairness"
    notes:
      "n1": "Justice, what is fair and right."
    examples:
      "ನ್ಯಾಯ ಬೇಕು.": "Justice is needed."
      "ನ್ಯಾಯ ಇದೆ.": { native: "There is justice.", bases: { "ಇದೆ": "there is" } }
  "kn-1661":
    native: "equality"
    notes:
      "n1": "Equality, the same rights for all people."
    examples:
      "ಸಮಾನತೆ ಬೇಕು.": "Equality is needed."
      "ಸಮಾನತೆ ಇದೆ.": { native: "There is equality.", bases: { "ಇದೆ": "there is" } }
  "kn-1662":
    native: "knowledge"
    notes:
      "n1": "Knowledge, what one knows and has learnt."
    examples:
      "ಜ್ಞಾನ ಬೇಕು.": "Knowledge is needed."
      "ಓದು ಜ್ಞಾನ ಕೊಡುತ್ತದೆ.": "Reading gives knowledge."
  "kn-1663":
    native: "intelligence, mind"
    notes:
      "n1": "Intelligence, the sharp mind that thinks and understands."
    examples:
      "ಅವನಿಗೆ ಬುದ್ಧಿ ಇದೆ.": { native: "He is intelligent.", bases: { "ಇದೆ": "has" } }
      "ಬುದ್ಧಿ ಬಳಸು.": "Use your mind."
  "kn-1664":
    native: "dream"
    notes:
      "n1": "A dream, what one sees while sleeping, or a hope for the future."
    examples:
      "ಕನಸು ಚೆನ್ನಾಗಿದೆ.": "The dream is good."
      "ರಾತ್ರಿ ಕನಸು ಇತ್ತು.": { native: "There was a dream at night.", bases: { "ಇತ್ತು": "was" } }
  "kn-1665":
    native: "hope, promise"
    notes:
      "n1": "Hope, or a promise that something will be done."
    examples:
      "ಭರವಸೆ ಇದೆ.": { native: "There is hope.", bases: { "ಇದೆ": "there is" } }
      "ಅವನು ಭರವಸೆ ಕೊಟ್ಟ.": "He gave a promise."
  "kn-1666":
    native: "purpose, aim"
    notes:
      "n1": "A purpose or an aim, the reason one does a thing."
    examples:
      "ಉದ್ದೇಶ ಏನು?": "What is the purpose?"
      "ಅವನ ಉದ್ದೇಶ ಒಳ್ಳೆಯದು.": "His purpose is good."
  "kn-1667":
    native: "ability, capacity"
    notes:
      "n1": "Ability, the power to do a thing well."
    examples:
      "ಅವಳಿಗೆ ಸಾಮರ್ಥ್ಯ ಇದೆ.": { native: "She has ability.", bases: { "ಇದೆ": "has" } }
      "ಸಾಮರ್ಥ್ಯ ಬೇಕು.": "Ability is needed."
  "kn-1668":
    native: "quality, virtue"
    notes:
      "n1": "A quality or a virtue of a person or a thing."
    examples:
      "ಗುಣ ಚೆನ್ನಾಗಿದೆ.": "The quality is good."
      "ಅವನ ಗುಣ ಸುಂದರ.": "His virtue is beautiful."
  "kn-1669":
    native: "value"
    notes:
      "n1": "A value, the worth of a thing or a principle."
    examples:
      "ಮೌಲ್ಯ ಇದೆ.": { native: "There is value.", bases: { "ಇದೆ": "there is" } }
      "ಸತ್ಯದ ಮೌಲ್ಯ ದೊಡ್ಡದು.": "The value of truth is big."
  "kn-1670":
    native: "desire, wish"
    notes:
      "n1": "A desire, a strong wish for something."
    examples:
      "ಆಸೆ ಇದೆ.": { native: "There is a desire.", bases: { "ಇದೆ": "there is" } }
      "ಆಸೆ ಬೇಡ.": "No desire."
  "kn-1671":
    native: "beauty"
    notes:
      "n1": "Beauty, what is pleasing to see."
    examples:
      "ಸೌಂದರ್ಯ ಇದೆ.": { native: "There is beauty.", bases: { "ಇದೆ": "there is" } }
      "ಈ ಊರಿನ ಸೌಂದರ್ಯ ದೊಡ್ಡದು.": "The beauty of this town is big."
  "kn-1672":
    native: "joy, bliss"
    notes:
      "n1": "Joy, a deep and calm happiness."
    examples:
      "ಆನಂದ ಆಯಿತು.": "I felt joy."
      "ಆನಂದ ಬೇಕು.": "Joy is needed."
  "kn-1673":
    native: "culture"
    notes:
      "n1": "Culture, the way of life and the arts of a people."
    examples:
      "ಕನ್ನಡ ಸಂಸ್ಕೃತಿ ಸುಂದರ.": "Kannada culture is beautiful."
      "ಸಂಸ್ಕೃತಿ ಇಷ್ಟ.": "I like culture."
  "kn-1674":
    native: "tradition, heritage"
    notes:
      "n1": "A tradition or a heritage, handed down from the past."
    examples:
      "ಪರಂಪರೆ ಬೇಕು.": "Tradition is needed."
      "ನಮ್ಮ ಪರಂಪರೆ ಹಳೆ.": "Our tradition is old."
  "kn-1675":
    native: "result"
    notes:
      "n1": "A result, what comes out of an effort or a test."
    examples:
      "ಫಲಿತಾಂಶ ಬಂತು.": "The result came."
      "ಪರೀಕ್ಷೆಯ ಫಲಿತಾಂಶ ಇದೆ.": { native: "There is the test result.", bases: { "ಇದೆ": "there is" } }
  "kn-1676":
    native: "effect, consequence"
    notes:
      "n1": "An effect, what happens because of a cause."
    examples:
      "ಪರಿಣಾಮ ದೊಡ್ಡದು.": "The effect is big."
      "ಪರಿಣಾಮ ಏನು?": "What is the effect?"
  "kn-1677":
    native: "beginning, start"
    notes:
      "n1": "The beginning of something."
    examples:
      "ಆರಂಭ ಚೆನ್ನಾಗಿದೆ.": "The beginning is good."
      "ಆರಂಭ ಬೇಕು.": "A beginning is needed."
  "kn-1678":
    native: "end"
    notes:
      "n1": "The end of something."
    examples:
      "ಅಂತ್ಯ ಇದೆ.": { native: "There is an end.", bases: { "ಇದೆ": "there is" } }
      "ಕಥೆಯ ಅಂತ್ಯ ಚೆನ್ನಾಗಿದೆ.": "The end of the story is good."
  "kn-1679":
    native: "life"
    notes:
      "n1": "Life, the time one lives on the earth."
    examples:
      "ಜೀವನ ಸುಂದರ.": "Life is beautiful."
      "ಅವನ ಜೀವನ ಚೆನ್ನಾಗಿದೆ.": "His life is good."
