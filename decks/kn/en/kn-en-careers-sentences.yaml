core: "kn-careers-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Careers: jobs, work and interviews: sentences"
description: "Sentences about work and careers: a new job, an interview, experience and skills, and a permanent post. They use the words of the careers unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8261":
    notes:
      "n1": "ನನಗೆ (nanage), to me, goes with ಬೇಕು (bēku): the thing needed is the subject, and the person needing it takes the dative."
    native: "I need a new job."
    bases:
      "ನನಗೆ": "I, in the dative: to me"
  "kn-8262":
    notes:
      "n1": "ನನಗೆ (nanage), to me, with ಇದೆ (ide), there is, means 'I have': the thing had is the subject, and the person takes the dative."
    native: "I have experience."
    bases:
      "ನನಗೆ": "I, in the dative: to me"
      "ಇದೆ": "to be or exist, here for a thing"
  "kn-8263":
    notes:
      "n1": "The question word ಯಾವಾಗ (yāvāga), when, follows the noun, with no word for 'is': ಸಂದರ್ಶನ (sandarśana) ಯಾವಾಗ (yāvāga)? asks when the interview is."
    native: "When is the interview?"
  "kn-8264":
    notes:
      "n1": "ನಿನ್ನ (ninna), your, is the informal form; ನಿಮ್ಮ (nimma) is the polite form, for an elder or a stranger."
    native: "Your skill is good."
  "kn-8265":
    notes:
      "n1": "ನನ್ನ (nanna), my, is the form of ನಾನು (nānu), I, before a noun, with no word for 'is'."
    native: "This is my job."
  "kn-8266":
    notes:
      "n1": "A job noun needs no word for 'is': ಉದ್ಯಮಿ (udyami), businessman, follows ಅವನು (avanu), he, directly."
    native: "He is a businessman."
  "kn-8267":
    notes:
      "n1": "A job noun needs no word for 'is': ಬಾಣಸಿಗ (bāṇasiga), cook, follows ಅವನು (avanu), he, directly."
    native: "He is a cook."
  "kn-8268":
    notes:
      "n1": "This yes or no question has no question word: the rising voice alone marks it."
    native: "Is this a permanent job?"
  "kn-8269":
    notes:
      "n1": "ಅವರ (avara), his or her, is the form of ಅವರು (avaru), he or she (polite), before a noun; the question word ಏನು (ēnu), what, follows the noun."
    native: "What is his degree?"
  "kn-8270":
    notes:
      "n1": "ರಾಜೀನಾಮೆ ಕೊಡು (rājīnāme koḍu) is a set phrase for 'to resign', literally 'give a resignation'; ಕೊಡುತ್ತೇನೆ (koḍuttēne) ends in -ುತ್ತೇನೆ (-uttēne) for 'I'."
    native: "I will resign."
    bases:
      "ಕೊಡುತ್ತೇನೆ": "to give, here in the first-person present"
