id: "kn-en-grammar-likes"
kind: "layer"
core: "kn-grammar-likes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Likes"
license: "CC-BY-SA-4.0"
description: "ಇಷ್ಟ (iṣṭa) and ಇಷ್ಟವಾಗು (iṣṭavāgu): what you like, and what you liked. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0513":
    native: "liking; dear to someone"
    notes:
      "n1": "The one who likes takes -ಗೆ (-ge), and nothing else changes: ನನಗೆ ಇಷ್ಟ (nanage iṣṭa), ಅವಳಿಗೆ ಇಷ್ಟ (avaḷige iṣṭa), I like it, she likes it."
    "examples": {
      "ಇತಿಹಾಸ ಇಷ್ಟ.": {"native": "I like history.", "bases": {}},
      "ಒಡನಾಟ ಇಷ್ಟ.": {"native": "I like companionship.", "bases": {}}
    }
  "kn-0514":
    native: "I like mangoes."
    notes:
      "n1": "ನನಗೆ (nanage) 'to me' is the dative, and the thing liked is the subject: ಮಾವಿನಹಣ್ಣು (māvinahaṇṇu) 'mangoes' with ಇಷ್ಟ (iṣṭa) 'liked'."
    bases:
      "ನನಗೆ": "I"
      "ಮಾವಿನಹಣ್ಣು": "mango"
  "kn-0515":
    native: "I don't like coffee."
    notes:
      "n1": "ಇಲ್ಲ (illa) 'not' comes after ಇಷ್ಟ (iṣṭa) to make the negative, and the dative ನನಗೆ (nanage) stays."
    bases:
      "ನನಗೆ": "I"
  "kn-0516":
    native: "What do you like?"
    notes:
      "n1": "ನಿಮಗೆ (nimage) is the polite 'to you', and ಏನು (ēnu) 'what' comes before ಇಷ್ಟ (iṣṭa)."
  "kn-0517":
    native: "I like watching films."
    notes:
      "n1": "ನೋಡುವುದು (nōḍuvudu), watching, is the verb made a noun. In speech, ನೋಡೋದು (nōḍōdu)."
    bases:
      "ನನಗೆ": "I"
      "ಸಿನಿಮಾ": "film"
      "ನೋಡುವುದು": "to see; to watch"
  "kn-0518":
    native: "to be liked; to please"
    notes:
      "n1": "What happened: 'it became liked to me'."
  "kn-0519":
    native: "I liked it."
    notes:
      "n1": "ಇಷ್ಟವಾಯಿತು (iṣṭavāyitu) is the past of ಇಷ್ಟವಾಗು (iṣṭavāgu) 'to please': literally 'it pleased me'."
    bases:
      "ನನಗೆ": "I"
  "kn-0520":
    native: "I didn't like it."
    notes:
      "n1": "ಇಷ್ಟವಾಗಲಿಲ್ಲ (iṣṭavāgalilla) is the past negative of ಇಷ್ಟವಾಗು (iṣṭavāgu): literally 'it did not please me'."
    bases:
      "ನನಗೆ": "I"
  "kn-0521":
    native: "Did you like it?"
    notes:
      "n1": "ಇಷ್ಟವಾಯಿತಾ (iṣṭavāyitā) adds ಆ (ā) to the past to make a question, and ನಿಮಗೆ (nimage) is the polite 'to you'."
    bases:
      "ಇದು": "this"
  "kn-0479":
    notes:
      "n1": "With the one who likes as the doer: ಅವನು ಅವಳನ್ನು ಇಷ್ಟಪಡುತ್ತಾನೆ (avanu avaḷannu iṣṭapaḍuttāne), he is fond of her."
  "kn-0522":
    native: "I love you."
    notes:
      "n1": "ಪ್ರೀತಿಸು (prītisu) 'love' takes a direct object, unlike ಇಷ್ಟ (iṣṭa) 'liked', which takes ನನಗೆ (nanage) 'to me'. ನಿನ್ನನ್ನು (ninnannu) is the object form of ನೀನು (nīnu), the informal 'you'."
    bases:
      "ನಾನು": "I"
      "ನಿನ್ನನ್ನು": "you (to a friend)"
      "ಪ್ರೀತಿಸುತ್ತೇನೆ": "to love"
