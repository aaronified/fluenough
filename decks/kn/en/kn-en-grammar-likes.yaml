schema: 1
id: "kn-en-grammar-likes"
kind: "layer"
core: "kn-grammar-likes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Likes"
license: "CC0-1.0"
description: "ಇಷ್ಟ (iṣṭa) and ಇಷ್ಟವಾಗು (iṣṭavāgu): what you like, and what you liked. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0513":
    native: "liking; dear to someone"
    notes:
      "n1": "The one who likes takes -ಗೆ (-ge), and nothing else changes: ನನಗೆ ಇಷ್ಟ (nanage iṣṭa), ಅವಳಿಗೆ ಇಷ್ಟ (avaḷige iṣṭa), I like it, she likes it."
  "kn-0514":
    native: "I like mangoes."
    bases:
      "ನನಗೆ": "I"
      "ಮಾವಿನಹಣ್ಣು": "mango"
  "kn-0515":
    native: "I don't like coffee."
    bases:
      "ನನಗೆ": "I"
  "kn-0516":
    native: "What do you like?"
  "kn-0517":
    native: "I like watching films."
    notes:
      "n1": "ನೋಡುವುದು (nōḍuvudu), watching, is the verb made a noun. In speech, ನೋಡೋದು (nōḍōdu)."
    bases:
      "ನನಗೆ": "I"
      "ಸಿನಿಮಾ": "film"
      "ನೋಡುವುದು": "to see; to watch"
  "kn-0518":
    native: "to be liked; to please"
    notes:
      "n1": "What happened: 'it became liked to me'."
  "kn-0519":
    native: "I liked it."
    bases:
      "ನನಗೆ": "I"
  "kn-0520":
    native: "I didn't like it."
    bases:
      "ನನಗೆ": "I"
  "kn-0521":
    native: "Did you like it?"
    bases:
      "ಇದು": "this"
  "kn-0479":
    notes:
      "n1": "With the one who likes as the doer: ಅವನು ಅವಳನ್ನು ಇಷ್ಟಪಡುತ್ತಾನೆ (avanu avaḷannu iṣṭapaḍuttāne), he is fond of her."
  "kn-0522":
    native: "I love you."
    bases:
      "ನಾನು": "I"
      "ನಿನ್ನನ್ನು": "you (to a friend)"
      "ಪ್ರೀತಿಸುತ್ತೇನೆ": "to love"
