# Layer for kn-culture-1: each item's English rendering and a note on it.
schema: 1
id: "kn-en-culture-1"
kind: "layer"
core: "kn-culture-1"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: Pampa's Vikramarjuna Vijaya"
description: "Eighteen whole verses of Pampa's tenth-century Kannada epic, each with its English rendering and a note. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "kn-6000":
    native: "Narayana won Lakshmi from the ocean, took the earth by begging, and wore a diadem; King Arikesari, a nobler Narayana, won the earth without begging, by pressing down enemy kings, and took his crown by right; May he give us a mass of happiness."
    notes:
      "n1": "Verse 1 of ashvasa 1, the opening praise. Pampa compares his patron Arikesari to Narayana and says he is greater, because he won the earth by defeating enemies instead of begging for it. The English follows the prose paraphrase on the Wikisource page; it is not checked by a Kannada speaker."

  "kn-6001":
    native: "Arikesari's anger is the fire of Shiva's forehead eye, his favour is Shiva's gracious gift, his bright fame is the ash on Shiva's body, his royal power is Shiva's Shakti, and his clear jewels are the serpent ornaments; May Arikesari, famous as the generous Maheshvara, give us enjoyment."
    notes:
      "n1": "Verse 2 of ashvasa 1. The poet praises Arikesari as Shiva, matching each of the king's qualities to a mark of Shiva. The English follows the prose paraphrase on the Wikisource page; it is not checked by a Kannada speaker."

  "kn-6002":
    native: "As the fierce sun drives away darkness, so Arikesari drives off the dark crowd of enemy armies, while the lotus beds open in love and swarms of begging bees follow and praise him; May this mighty sun-like king open the lotus of my heart with the rays of his own words."
    notes:
      "n1": "Verse 3 of ashvasa 1. Arikesari is praised as the sun, the enemy armies are darkness, the lotuses are the happy people and the bees are those who beg. The English follows the prose paraphrase on the Wikisource page; it is not checked by a Kannada speaker."

  "kn-6003":
    native: "A poem full of meaning, rich in figures of speech, soft in its lines and beautiful in its speech, famed as a work of art: the poet gives it, like a young daughter, to Arikesari; would he give it to anyone else?"
    notes:
      "n1": "Verse 9 of ashvasa 1. Pampa says his poem is like a young daughter and he will give it only to his patron Arikesari. The English follows the word-by-word gloss and paraphrase on the Wikisource page; it is not checked by a Kannada speaker."

  "kn-6004":
    native: "The Mahabharata story is long, and before me no great poet told all of it freshly without spoiling the body of the story; Scholars said that only Pampa could tell it so that the descriptions fit the story, and they pressed me again and again to explain it, so I began this work."
    notes:
      "n1": "Verse 11 of ashvasa 1, where Pampa says why he took up the Mahabharata. The English follows the word-by-word gloss and paraphrase on the Wikisource page; it is not checked by a Kannada speaker."

  "kn-6005":
    native: "A work by ignorant people, forced out without lovely words or the grace of true poetry, is only trouble for the scribe's hands, a waste of the smooth palm leaves, and a waste of sense when it is read aloud; does a bad poet who boasts, swells with pride and chases fame count as a poet?"
    notes:
      "n1": "Verse 12 of ashvasa 1, where Pampa mocks bad poets. The English follows the word-by-word gloss and paraphrase on the Wikisource page; it is not checked by a Kannada speaker."

  "kn-6006":
    native: "Some make a man with no wide fame or virtue their hero and liken him to kings of old; but this noble king, matched with the earlier kings in goodness and fitted into the story, gives me joy: I like to compare King Gunarnava (Arikesari) with Kiriti (Arjuna)."
    notes:
      "n1": "Verse 14 of ashvasa 1, where Pampa explains why he links his patron to Arjuna. The first half is read as the Wikisource commentary reads it; a Kannada speaker should check the English."

  "kn-6007":
    native: "In battle the son of the river (Ganga) made me flee and carried you off, so I have become a woman too; how can women join with women, helpless one?"
    notes:
      "n1": "Verse 76 of ashvasa 1, under the page's heading on Amba's wanderings. The page's paraphrase ends it with the words of Salva, who tells Amba he cannot marry her: Bhishma, the son of Ganga, defeated him and carried her off. The English follows the word-by-word gloss and prose paraphrase on the Wikisource page; it is not checked by a Kannada speaker."

  "kn-6008":
    native: "A kingdom is perishable, so why should I want the tangle of a kingdom; if my life went against my pledge of truth and I too spoke two words, would Vishnu, Shiva and Brahma not laugh?"
    notes:
      "n1": "Verse 82 of ashvasa 1. The gloss says a kingdom is not lasting and that going back on a pledge of truth would make the three gods laugh. The English follows the word-by-word gloss and prose paraphrase on the Wikisource page; it is not checked by a Kannada speaker."

  "kn-6009":
    native: "While she was growing up, the sage Durvasa was pleased by a service the lotus-faced girl had done and kindly gave her shining mantra syllables."
    notes:
      "n1": "Verse 89 of ashvasa 1, in the page's section on the birth of Karna. The page's paraphrase names the lotus-faced girl as Kunti; the verses that follow show her using the mantra. The English follows the word-by-word gloss and prose paraphrase on the Wikisource page; it is not checked by a Kannada speaker."

  "kn-6010":
    native: "Why did you make me come, girl; she said she wanted to know what the great sage's mantra was worth, that she was a fool and had called him knowing and not knowing, and told him to leave now, but it was not possible to go."
    notes:
      "n1": "Verse 93 of ashvasa 1. The page's paraphrase has the sun god ask Kunti why she called him and Kunti answer that she was testing the sage's mantra; its gloss closes with the words that going was not possible. The English follows the word-by-word gloss and prose paraphrase on the Wikisource page; it is not checked by a Kannada speaker."

  "kn-6011":
    native: "I cannot go without giving the boon you asked for first, lotus-faced one; you will have a son equal to me; in the womb that came to be, a son like the friend of the lotus (the sun) was born."
    notes:
      "n1": "Verse 94 of ashvasa 1. The page's paraphrase makes the first half the words of the sun god to Kunti and the second half the birth of a son who looks like the sun. The English follows the word-by-word gloss and prose paraphrase on the Wikisource page; it is not checked by a Kannada speaker."

  "kn-6012":
    native: "With the jewelled earrings born with him and the armour born with him fixed on his body, the son was born and then made the girl tremble."
    notes:
      "n1": "Verse 95 of ashvasa 1. The printed verse ends on the word for girl with its ending, so its sentence runs on into the next verse; the card gives the gloss's sense of the lines as printed. The English follows the word-by-word gloss and prose paraphrase on the Wikisource page; it is not checked by a Kannada speaker."

  "kn-6013":
    native: "It was as if a treasure had suddenly been found in a pit being dug; the child's beauty was beyond compare on earth, people said, and then the name Vasushena came to him."
    notes:
      "n1": "Verse 97 of ashvasa 1. The name Vasushena is the first name of Karna in the poem, and the next verse tells how he came to be called Karna. The English follows the word-by-word gloss and prose paraphrase on the Wikisource page; it is not checked by a Kannada speaker."

  "kn-6014":
    native: "As Vasushena's valour grew to the ends of the world, the news passed in order from ear to ear among the people, and he came to be called Karna."
    notes:
      "n1": "Verse 98 of ashvasa 1. A pun: the word for ear in the verse is the same as the name Karna, so the name is explained as the hero whose fame passed from ear to ear. The English follows the word-by-word gloss and prose paraphrase on the Wikisource page; it is not checked by a Kannada speaker."

  "kn-6015":
    native: "Thinking that Karna would cut out and throw away even his right ribs if asked, Indra came in the form of a young Brahmin student and asked for the armour and earrings born with him."
    notes:
      "n1": "Verse 100 of ashvasa 1. The verse does not name Indra; the page's paraphrase does, and the next verses show him taking the armour. The English follows the word-by-word gloss and prose paraphrase on the Wikisource page; it is not checked by a Kannada speaker."

  "kn-6016":
    native: "When Karna said to cut off what he asked for and Indra said he could not touch what he asked for, Radheya (Karna) said take it without wavering, cut off the armour and threw it to Indra."
    notes:
      "n1": "Verse 101 of ashvasa 1. Radheya, the son of Radha, is a name of Karna. The page's gloss reads the first half as the two men's words and the second half as what Karna did. The English follows the word-by-word gloss and prose paraphrase on the Wikisource page; it is not checked by a Kannada speaker."

  "kn-6017":
    native: "Did he say go away, or say wait, or say he would give something else, or cry out in pain; the son of the sun said take it without fear, what a hero and what a giver!"
    notes:
      "n1": "Verse 102 of ashvasa 1, which praises Karna for giving his armour without a word of complaint. The son of the sun is Karna. The English follows the word-by-word gloss and prose paraphrase on the Wikisource page; it is not checked by a Kannada speaker."
