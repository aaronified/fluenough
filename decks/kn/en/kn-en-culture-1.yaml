cards:
  "kn-6000":
    native: "Like Narayana, who took the earth and its riches from the ocean, the king has won the earth by overcoming his enemies."
    notes:
      "n1": "The first line of verse 1 of the first ashvasa of Pampa's Vikramarjuna Vijaya (Pampa Bharata), the opening praise of the king Arikesari as Narayana. The English is a rough rendering, not checked by a Kannada speaker."

  "kn-6001":
    native: "His anger is the fire of Shiva's forehead eye, and he is pleased by the fresh grace of poetry."
    notes:
      "n1": "The first line of verse 2 of the first ashvasa of Pampa's Vikramarjuna Vijaya, the praise of the king Arikesari as Shiva. The English is a rough rendering, not checked by a Kannada speaker."

  "kn-6002":
    native: "Fierce against his enemies' armies, like the sun that scatters deep darkness, he wakes the lotus."
    notes:
      "n1": "The first line of verse 3 of the first ashvasa of Pampa's Vikramarjuna Vijaya, the praise of the king Arikesari as the sun. The English is a rough rendering, not checked by a Kannada speaker."

