tags: ["beginner", "unreviewed"]
cards:
  "kn-7017":
    notes:
      "n1": "A job is said with no verb for is: ಅವಳು (avaḷu) ಡಾಕ್ಟರ್ (ḍākṭar), she is a doctor."
    native: "She is a doctor."
  "kn-7018":
    native: "He is a teacher."
  "kn-7019":
    native: "I am an engineer."
  "kn-7020":
    notes:
      "n1": "ಅಲ್ಲ (alla) makes it negative after the job word, with no verb: ವಕೀಲ (vakīla) ಅಲ್ಲ (alla)."
    native: "He is not a lawyer."
  "kn-7021":
    native: "Today is a day off."
  "kn-7022":
    native: "Tomorrow is not a day off."
  "kn-7023":
    native: "Where is the office now?"
  "kn-7024":
    notes:
      "n1": "ಅವಳ (avaḷa), her, is the of-form of ಅವಳು (avaḷu), she."
    native: "What is her salary?"
  "kn-7025":
    notes:
      "n1": "The ending ಯವರು (yavaru) makes a person of a place or work: ಅಂಗಡಿಯವರು (aṅgaḍiyavaru), the shopkeeper."
    native: "Who is the shopkeeper?"
  "kn-7026":
    notes:
      "n1": "ಅವರ (avara), their, is the of-form of ಅವರು (avaru), they."
    native: "Where is their business?"
