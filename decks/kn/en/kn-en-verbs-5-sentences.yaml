schema: 1
id: "kn-en-verbs-5-sentences"
kind: "layer"
core: "kn-verbs-5-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sequence actions: what happened next: sentences"
description: "Sentences about what happened next: preparing a meal, finishing and starting work, going back home and the evening turning dark. They use the words of the sequence-actions unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8302":
    notes:
      "n1": "ತಯಾರಿಸು (tayārisu), prepare, is the plain command, ending in -ು (-u); the polite command ends in -ಿ (-i)."
    native: "Prepare the meal."
  "kn-8303":
    notes:
      "n1": "ಮುಗಿಸು (mugisu), finish, is the plain command, ending in -ು (-u); the polite command ends in -ಿ (-i)."
    native: "Finish the work."
  "kn-8304":
    notes:
      "n1": "ಕತ್ತಲಾಗುತ್ತದೆ (kattalāguttade) is ಕತ್ತಲು (kattalu), darkness, with ಆಗು (āgu), become, and ends in -ುತ್ತದೆ (-uttade) for 'it' in the present."
    native: "It gets dark in the evening."
    bases:
      "ಕತ್ತಲಾಗುತ್ತದೆ": "to become dark, here in the third-person neuter present"
  "kn-8305":
    notes:
      "n1": "ಮನೆಗೆ (manege), to the house, takes the dative -ಗೆ (-ge); ಹಿಂತಿರುಗು (hintirugu), go back, is the plain command, ending in -ು (-u)."
    native: "Go back home."
    bases:
      "ಮನೆಗೆ": "house, here with the ending -ಗೆ (-ge): to the house"
  "kn-8306":
    notes:
      "n1": "ಆರಂಭಿಸು (ārambhisu), start, is the plain command, ending in -ು (-u); the polite command ends in -ಿ (-i)."
    native: "Start the work."
  "kn-8307":
    notes:
      "n1": "ಅಪ್ಪನನ್ನು (appanannu) takes the object ending -ನ್ನು (-nnu); ಕರೆಸುತ್ತಾಳೆ (karesuttāḷe) is built on ಕರೆಸು (karesu), to send for, a causative of ಕರೆ (kare), call."
    native: "Mom sends for Dad."
    bases:
      "ಅಪ್ಪನನ್ನು": "father, here as the one sent for: Dad"
      "ಕರೆಸುತ್ತಾಳೆ": "to send for someone, here in the third-person feminine present"
  "kn-8309":
    notes:
      "n1": "ಅಂಟಿಸು (aṇṭisu), stick, is the plain command, ending in -ು (-u); the polite command ends in -ಿ (-i)."
    native: "Stick the picture."
  "kn-8310":
    notes:
      "n1": "ಕೊನೆಗೊಳಿಸು (konegoḷisu), end, is the plain command, ending in -ು (-u); the polite command ends in -ಿ (-i)."
    native: "End the meeting."
  "kn-8311":
    notes:
      "n1": "ಹೇಗೆ (hēge), how, comes before the verb; ಸಂಭವಿಸಿತು (sambhavisitu), happened, is the past tense of ಸಂಭವಿಸು (sambhavisu), happen."
    native: "How did this happen?"
    bases:
      "ಸಂಭವಿಸಿತು": "to happen, here in the past tense"
