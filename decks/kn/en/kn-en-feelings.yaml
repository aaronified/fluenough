schema: 1
id: "kn-en-feelings"
kind: "layer"
core: "kn-feelings"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Feelings and moods"
license: "CC-BY-SA-4.0"
description: "How people feel: happy, sad, angry, afraid, worried or proud, and the words to say so to a friend. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1319":
    native: "feeling, emotion"
    notes:
      "n1": "A feeling, or an emotion, of joy, fear or sadness."
    examples:
      "ಭಾವನೆ ಹೇಳು.": "Say your feeling."
      "ಅವಳ ಭಾವನೆ ಚೆನ್ನಾಗಿದೆ.": "Her feeling is good."
  "kn-1320":
    native: "fear"
    notes:
      "n1": "Fear, of something that may harm you."
    examples:
      "ಭಯ ಆಗುತ್ತಿದೆ.": { native: "I am afraid.", bases: { "ಆಗುತ್ತಿದೆ": "is becoming" } }
      "ಭಯ ಬೇಡ.": "Do not be afraid."
  "kn-1321":
    native: "shyness, embarrassment"
    notes:
      "n1": "Shyness, or embarrassment in front of others."
    examples:
      "ನಾಚಿಕೆ ಆಯಿತು.": "I felt embarrassed."
      "ಅವಳಿಗೆ ನಾಚಿಕೆ ಇದೆ.": { native: "She is shy.", bases: { "ಇದೆ": "is" } }
  "kn-1322":
    native: "surprise"
    notes:
      "n1": "Surprise, when something is not expected."
    examples:
      "ಆಶ್ಚರ್ಯ ಆಯಿತು.": "I was surprised."
      "ಇದು ದೊಡ್ಡ ಆಶ್ಚರ್ಯ.": "This is a big surprise."
  "kn-1323":
    native: "boredom, sadness"
    notes:
      "n1": "Boredom, or a dull sadness, when nothing is fun."
    examples:
      "ಬೇಸರ ಆಗುತ್ತಿದೆ.": { native: "I am getting bored.", bases: { "ಆಗುತ್ತಿದೆ": "is becoming" } }
      "ಬೇಸರ ಬೇಡ.": "Do not be bored."
  "kn-1324":
    native: "worry"
    notes:
      "n1": "Worry, a heavy thought about the future."
    examples:
      "ಚಿಂತೆ ಬೇಡ.": "Do not worry."
      "ನನಗೆ ಚಿಂತೆ ಇದೆ.": { native: "I am worried.", bases: { "ಇದೆ": "am" } }
  "kn-1325":
    native: "happiness, delight"
    notes:
      "n1": "Delight, a bright happiness. Happy is ಖುಷಿ (khuṣi) too."
    examples:
      "ಖುಷಿ ಆಯಿತು.": "I was delighted."
      "ಅವರಿಗೆ ಖುಷಿ.": { native: "They are happy.", bases: { "ಅವರಿಗೆ": "to them" } }
  "kn-1326":
    native: "anxiety"
    notes:
      "n1": "Anxiety, a worry that makes you uneasy."
    examples:
      "ಆತಂಕ ಇದೆ.": { native: "There is anxiety.", bases: { "ಇದೆ": "there is" } }
      "ಆತಂಕ ಬೇಡ.": "Do not be anxious."
  "kn-1327":
    native: "peace of mind"
    notes:
      "n1": "Peace of mind, calm and rest in the heart."
    examples:
      "ನೆಮ್ಮದಿ ಬೇಕು.": "I need peace of mind."
      "ಮನಸ್ಸಿಗೆ ನೆಮ್ಮದಿ ಇದೆ.": { native: "The mind has peace.", bases: { "ಇದೆ": "has" } }
  "kn-1328":
    native: "loneliness"
    notes:
      "n1": "Loneliness, when you are alone and sad."
    examples:
      "ಒಂಟಿತನ ಇದೆ.": { native: "There is loneliness.", bases: { "ಇದೆ": "there is" } }
      "ಒಂಟಿತನ ಬೇಡ.": "No loneliness."
  "kn-1329":
    native: "love"
    notes:
      "n1": "Love, for a person, a child or a country."
    examples:
      "ಅಮ್ಮನ ಪ್ರೀತಿ ತುಂಬಾ.": "Mum's love is great."
      "ಅವನಿಗೆ ಪ್ರೀತಿ ಇದೆ.": { native: "He has love.", bases: { "ಇದೆ": "has" } }
  "kn-1330":
    native: "hatred"
    notes:
      "n1": "Hatred, a strong dislike of someone."
    examples:
      "ದ್ವೇಷ ಬೇಡ.": "No hatred."
      "ಅವರಿಗೆ ದ್ವೇಷ ಇದೆ.": { native: "They have hatred.", bases: { "ಇದೆ": "have", "ಅವರಿಗೆ": "to them" } }
  "kn-1331":
    native: "pride"
    notes:
      "n1": "Pride, a good feeling about what you or your family did."
    examples:
      "ನನಗೆ ಹೆಮ್ಮೆ ಇದೆ.": { native: "I am proud.", bases: { "ಇದೆ": "am" } }
      "ಅಪ್ಪನಿಗೆ ಹೆಮ್ಮೆ ಆಯಿತು.": "Dad felt proud."
  "kn-1332":
    native: "jealousy"
    notes:
      "n1": "Jealousy, wanting what another has."
    examples:
      "ಅಸೂಯೆ ಬೇಡ.": "No jealousy."
      "ಅವನಿಗೆ ಅಸೂಯೆ ಆಯಿತು.": "He became jealous."
  "kn-1333":
    native: "pity, kindness"
    notes:
      "n1": "Pity, or a kind feeling towards someone who suffers."
    examples:
      "ಅವನ ಮೇಲೆ ಕರುಣೆ ಇದೆ.": { native: "I have pity for him.", bases: { "ಇದೆ": "there is" } }
      "ಕರುಣೆ ತೋರಿಸು.": "Show kindness."
  "kn-1334":
    native: "distress, pain of heart"
    notes:
      "n1": "Distress, a deep pain of the heart."
    examples:
      "ಸಂಕಟ ಆಗುತ್ತಿದೆ.": { native: "I am distressed.", bases: { "ಆಗುತ್ತಿದೆ": "is becoming" } }
      "ಅವಳ ಸಂಕಟ ದೊಡ್ಡದು.": "Her distress is big."
  "kn-1335":
    native: "fatigue, tiredness"
    notes:
      "n1": "Fatigue, when you are tired after work."
    examples:
      "ಆಯಾಸ ಆಗಿದೆ.": { native: "I am tired.", bases: { "ಆಗಿದೆ": "has become" } }
      "ಆಯಾಸ ಹೋಗು.": "Let the tiredness go."
  "kn-1336":
    native: "confusion"
    notes:
      "n1": "Confusion, when you do not know what to do."
    examples:
      "ಗೊಂದಲ ಆಯಿತು.": "I was confused."
      "ಗೊಂದಲ ಬೇಡ.": "No confusion."
  "kn-1337":
    native: "disappointment"
    notes:
      "n1": "Disappointment, when things do not go as hoped."
    examples:
      "ನಿರಾಶೆ ಆಯಿತು.": "I was disappointed."
      "ನಿರಾಶೆ ಬೇಡ.": "Do not be disappointed."
  "kn-1338":
    native: "sad"
    notes:
      "n1": "Sad, feeling sorrow. Happy is ಖುಷಿ (khuṣi)."
    examples:
      "ಅವಳು ದುಃಖಿ.": "She is sad."
      "ದುಃಖಿ ಮುಖ.": "A sad face."
  "kn-1339":
    native: "angry, short-tempered"
    notes:
      "n1": "Angry, short-tempered, quick to get upset."
    examples:
      "ಅವನು ಕೋಪಿಷ್ಠ.": "He is short-tempered."
      "ಕೋಪಿಷ್ಠ ಅಪ್ಪ.": "A short-tempered dad."
  "kn-1340":
    native: "to be afraid"
    notes:
      "n1": "To be afraid, to feel fear."
    examples:
      "ಮಕ್ಕಳು ಹೆದರುತ್ತಾರೆ.": { native: "The children are afraid.", bases: { "ಹೆದರುತ್ತಾರೆ": "are afraid" } }
      "ಹೆದರಬೇಡ.": { native: "Do not be afraid.", bases: { "ಹೆದರಬೇಡ": "do not be afraid" } }
