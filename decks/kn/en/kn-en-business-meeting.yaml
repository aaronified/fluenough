schema: 1
id: "kn-en-business-meeting"
kind: "layer"
core: "kn-business-meeting"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Business: a meeting"
license: "CC-BY-SA-4.0"
description: "Phrases and words for a work meeting: opening it, giving an opinion, agreeing and fixing a deadline."
cards:
  "kn-6600":
    native: "Let us start the meeting."
    notes: { n1: "ಮಾಡೋಣ (māḍōṇa) is the form of ಮಾಡು (māḍu), to do, that means let us do." }
  "kn-6601":
    native: "This is today's agenda."
    notes: { n1: "ಇಂದಿನ (indina) is ಇಂದು (indu), today, with -ಇನ (-ina), so it means of today." }
  "kn-6602":
    native: "What is your opinion?"
  "kn-6603":
    native: "I agree with what you say."
    notes: { n1: "ಮಾತಿಗೆ (mātige) is ಮಾತು (mātu), word, with -ಗೆ (-ge): the final ಉ (u) becomes ಇ (i); ಒಪ್ಪು (oppu), to agree, takes this -ಗೆ (-ge) form." }
  "kn-6604":
    native: "Please say it once more."
  "kn-6605":
    native: "When is the next meeting?"
  "kn-6606":
    native: "Who is responsible for this work?"
    notes: { n1: "ಯಾರದು (yāradu) means whose: the question asks whose the responsibility for this work is." }
  "kn-6607":
    native: "The deadline is Friday."
  "kn-6608":
    native: "Thank you, everyone."
