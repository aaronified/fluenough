schema: 1
id: "kn-en-medicine-pharmacy"
kind: "layer"
core: "kn-medicine-pharmacy"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Medicine: at the pharmacy"
license: "CC-BY-SA-4.0"
description: "Phrases and words for buying medicine at a pharmacy: asking for it, the dose and the price."
cards:
  "kn-6520":
    native: "Do you have any medicine for a headache?"
    notes: { n1: "ತಲೆನೋವಿಗೆ (talenōvige) is ತಲೆನೋವು (talenōvu), headache, with -ಗೆ (-ge): the final ಉ (u) becomes ಇ (i) before -ಗೆ (-ge)." }
  "kn-6521":
    native: "Do you have something for a cough?"
  "kn-6522":
    native: "Do you have the doctor's prescription?"
    notes: { n1: "ವೈದ್ಯರ (vaidyara) is ವೈದ್ಯ (vaidya), doctor, with the respectful ending -ರ (-ra); ಚೀಟಿ (cīṭi) is a slip of paper, here the prescription." }
  "kn-6523":
    native: "How many times a day should I take this?"
  "kn-6524":
    native: "Take it after a meal."
    notes: { n1: "ಊಟದ (ūṭada) is ಊಟ (ūṭa), meal, with -ದ (-da), which links it to ನಂತರ (nantara), after." }
  "kn-6525":
    native: "Take it before a meal."
  "kn-6526":
    native: "Does it have any side effects?"
    notes: { n1: "ಇದರಿಂದ (idarinda) is ಇದು (idu), this, with -ರಿಂದ (-rinda); ಅಡ್ಡ ಪರಿಣಾಮ (aḍḍa pariṇāma) is a side effect, literally a crosswise effect." }
  "kn-6527":
    native: "I have an allergy."
  "kn-6528":
    native: "How much is this?"
    notes: { n1: "ಇದರ (idara) is the form of ಇದು (idu), this, before a noun; the question is literally what the price of this is." }
  "kn-6529":
    native: "Can it be given to children?"
