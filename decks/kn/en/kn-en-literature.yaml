schema: 1
id: "kn-en-literature"
kind: "layer"
core: "kn-literature"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Literature: books, poems and writers"
license: "CC-BY-SA-4.0"
description: "Books and poems: the writer and the poet, the novel and the verse, the lines and the rhymes, and the readers who read them. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1697":
    native: "literature"
    notes:
      "n1": "Literature, written works such as novels, poems and plays."
    examples:
      "ಸಾಹಿತ್ಯ ಇಷ್ಟ.": "I like literature."
      "ಕನ್ನಡ ಸಾಹಿತ್ಯ ದೊಡ್ಡದು.": "Kannada literature is big."
  "kn-1698":
    native: "poem"
    notes:
      "n1": "A poem, a short piece of verse. The word ಕವಿತೆ (kavite) is also used."
    examples:
      "ಕವನ ಓದು.": "Read the poem."
      "ಈ ಕವನ ಸುಂದರ.": "This poem is beautiful."
  "kn-1699":
    native: "poet"
    notes:
      "n1": "A poet, a person who writes poems."
    examples:
      "ಕವಿ ಬಂದರು.": "The poet came."
      "ಕವಿ ಕವನ ಬರೆದರು.": "The poet wrote a poem."
  "kn-1700":
    native: "writer, author"
    notes:
      "n1": "A writer or author, a man who writes books. A woman writer is ಲೇಖಕಿ (lēkhaki)."
    examples:
      "ಲೇಖಕ ಬಂದ.": "The writer came."
      "ಲೇಖಕ ಹೊಸ ಪುಸ್ತಕ ಬರೆದ.": "The writer wrote a new book."
  "kn-1701":
    native: "writer, author (woman)"
    notes:
      "n1": "A woman writer or author."
    examples:
      "ಲೇಖಕಿ ಬಂದರು.": "The writer came."
      "ಲೇಖಕಿ ಕಾದಂಬರಿ ಬರೆದರು.": "The writer wrote a novel."
  "kn-1702":
    native: "novel"
    notes:
      "n1": "A novel, a long story in a book."
    examples:
      "ಕಾದಂಬರಿ ಓದು.": "Read the novel."
      "ಈ ಕಾದಂಬರಿ ದೊಡ್ಡದು.": "This novel is long."
  "kn-1703":
    native: "chapter"
    notes:
      "n1": "A chapter, one part of a book."
    examples:
      "ಅಧ್ಯಾಯ ಓದು.": "Read the chapter."
      "ಅಧ್ಯಾಯ ಚಿಕ್ಕದು.": "The chapter is short."
  "kn-1704":
    native: "verse"
    notes:
      "n1": "A verse, a line or a piece of poetry in rhythm."
    examples:
      "ಪದ್ಯ ಸುಂದರ.": "The verse is beautiful."
      "ಪದ್ಯ ಹಾಡು.": "Sing the verse."
  "kn-1705":
    native: "prose"
    notes:
      "n1": "Prose, writing that is not in verse."
    examples:
      "ಗದ್ಯ ಓದು.": "Read the prose."
      "ಗದ್ಯ ಚೆನ್ನಾಗಿದೆ.": "The prose is good."
  "kn-1706":
    native: "poetry"
    notes:
      "n1": "Poetry, the art of verse."
    examples:
      "ಕಾವ್ಯ ಇಷ್ಟ.": "I like poetry."
      "ಕಾವ್ಯ ಬರೆ.": "Write poetry."
  "kn-1707":
    native: "line"
    notes:
      "n1": "A line of writing or of a poem."
    examples:
      "ಈ ಸಾಲು ಚೆನ್ನಾಗಿದೆ.": "This line is good."
      "ಕವನದ ಸಾಲು ಓದು.": { native: "Read a line of the poem.", bases: { "ಕವನದ": "of the poem" } }
  "kn-1708":
    native: "rhyme"
    notes:
      "n1": "A rhyme, words that end with the same sound."
    examples:
      "ಪ್ರಾಸ ಇದೆ.": { native: "There is a rhyme.", bases: { "ಇದೆ": "there is" } }
      "ಪ್ರಾಸ ಸುಂದರ.": "The rhyme is beautiful."
  "kn-1709":
    native: "word, sound"
    notes:
      "n1": "A word, or a sound."
    examples:
      "ಶಬ್ದ ಅರ್ಥ ಏನು?": "What is the meaning of the word?"
      "ಶಬ್ದ ಕೇಳಿಸಿತು.": { native: "A sound was heard.", bases: { "ಕೇಳಿಸಿತು": "was heard" } }
  "kn-1710":
    native: "humour"
    notes:
      "n1": "Humour, what makes people laugh in a story or a play."
    examples:
      "ಹಾಸ್ಯ ಇದೆ.": { native: "There is humour.", bases: { "ಇದೆ": "there is" } }
      "ಈ ಕಥೆ ಹಾಸ್ಯ.": "This story is humorous."
  "kn-1711":
    native: "style"
    notes:
      "n1": "A style of writing or of speaking."
    examples:
      "ಅವನ ಶೈಲಿ ಚೆನ್ನಾಗಿದೆ.": "His style is good."
      "ಶೈಲಿ ಬೇಕು.": "A style is needed."
  "kn-1712":
    native: "translation"
    notes:
      "n1": "A translation, a text put into another language."
    examples:
      "ಅನುವಾದ ಚೆನ್ನಾಗಿದೆ.": "The translation is good."
      "ಈ ಪುಸ್ತಕದ ಅನುವಾದ ಬೇಕು.": "I need a translation of this book."
  "kn-1713":
    native: "famous"
    notes:
      "n1": "Famous, known to many people."
    examples:
      "ಪ್ರಸಿದ್ಧ ಕವಿ.": "A famous poet."
      "ಈ ಪುಸ್ತಕ ಪ್ರಸಿದ್ಧ.": "This book is famous."
  "kn-1714":
    native: "reader"
    notes:
      "n1": "A reader, a person who reads books."
    examples:
      "ಓದುಗ ಬಂದ.": "The reader came."
      "ಓದುಗರು ಹೆಚ್ಚು.": { native: "There are many readers.", bases: { "ಓದುಗರು": "readers" } }
  "kn-1715":
    native: "book, scripture"
    notes:
      "n1": "A book, a formal word for a book or a sacred text."
    examples:
      "ಗ್ರಂಥ ದೊಡ್ಡದು.": "The book is big."
      "ಗ್ರಂಥ ಇದೆ.": { native: "There is a book.", bases: { "ಇದೆ": "there is" } }
  "kn-1716":
    native: "satire, irony"
    notes:
      "n1": "Satire, a witty way of showing what is wrong."
    examples:
      "ವ್ಯಂಗ್ಯ ಇದೆ.": { native: "There is satire.", bases: { "ಇದೆ": "there is" } }
      "ವ್ಯಂಗ್ಯ ಕವನ ಓದು.": "Read a satirical poem."
  "kn-1717":
    native: "letter (of alphabet)"
    notes:
      "n1": "A letter of the alphabet, a written sign."
    examples:
      "ಅಕ್ಷರ ಸುಂದರ.": "The letter is beautiful."
      "ಅಕ್ಷರ ಕಲಿ.": "Learn the letters."
