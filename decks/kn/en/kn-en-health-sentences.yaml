cards:
  "kn-7852":
    native: "I do yoga."
    notes:
      "n1": "ಮಾಡು (māḍu) 'do' is used with an activity noun, so ಯೋಗ (yōga) 'yoga' takes it as its verb."
  "kn-7853":
    native: "I exercise in the morning."
    notes:
      "n1": "ಬೆಳಿಗ್ಗೆ (beḷigge) 'in the morning' comes before the object, not at the start."
  "kn-7854":
    native: "Eat healthy food."
    notes:
      "n1": "ತಿನ್ನಿ (tinni) is the polite command 'eat'. The informal form is ತಿನ್ನು (tinnu)."
  "kn-7855":
    native: "I sleep well."
    notes:
      "n1": "ಚೆನ್ನಾಗಿ (cennāgi) 'well' is ಚೆನ್ನ (cenna) 'good' with the ಆಗಿ (āgi) ending, and it comes before the verb."
  "kn-7856":
    native: "Breathe slowly."
    notes:
      "n1": "ನಿಧಾನವಾಗಿ (nidhānavāgi) 'slowly' takes the ಆಗಿ (āgi) ending, and ಉಸಿರಾಡಿ (usirāḍi) is the polite command 'breathe'."
  "kn-7857":
    native: "His energy is high."
    notes:
      "n1": "ಅವನ (avana) 'his' is the possessive form of ಅವನು (avanu) and comes before ಶಕ್ತಿ (śakti) 'energy'."
  "kn-7858":
    native: "Meditate."
    notes:
      "n1": "ಮಾಡಿ (māḍi) is the polite command of ಮಾಡು (māḍu) 'do'."
  "kn-7859":
    native: "The doctor does a check-up."
    notes:
      "n1": "ವೈದ್ಯರು (vaidyaru) 'doctor' takes the plural verb ending ಆರೆ (āre) as a respectful form."
