    "baru": "to come"
  notes: "The same form is the future and the habit: ನಾನು ಕಾಫಿ ಕುಡಿಯುತ್ತೇನೆ (nānu kāfi kuḍiyuttēne) is 'I will drink coffee' and 'I drink coffee'. Speech shortens -ಉತ್ತ- (-utta-) to -ತ್- (-t-): ಮಾಡ್ತೀನಿ (māḍtīni). The verb agrees with the doer's person and number. In the third person a man, a woman and a thing each have a form of their own: ಅವನು ಬಂದನು (avanu bandanu), ಅವಳು ಬಂದಳು (avaḷu bandaḷu), ಅದು ಬಂತು (adu bantu). ನೀವು (nīvu), plural or respectful, takes the plural, and so does ಅವರು (avaru), they, or he or she with respect. Where two forms are given, the first is written Kannada and the second everyday speech; both are accepted."
