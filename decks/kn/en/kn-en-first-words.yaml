description: "The respect Kannada builds into 'you': ನೀವು (nīvu) and ನೀನು (nīnu). Greetings and saying you are still learning are in the phrasebook. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0143":
    native: "you (respectful); you (plural)"
    notes:
      "n1": "Kannada has two words for 'you': ನೀವು (nīvu) for strangers, elders and anyone you respect, and ನೀನು (nīnu) for friends, children and the very close. The verb changes with each. A learner is always safe with ನೀವು (nīvu)."
  "kn-0950":
    native: "good; it's fine"
    notes:
      "n1": "ಒಳ್ಳೆಯದು (oḷḷeyadu) is 'good', used of a thing or a plan: 'it's good', 'that's fine'. Before a noun it is ಒಳ್ಳೆಯ (oḷḷeya), as in ಒಳ್ಳೆಯ ಮನುಷ್ಯ (oḷḷeya manuṣya), a good person."
    examples:
      "ಇದು ಒಳ್ಳೆಯದು.":
        native: "This is good."
        bases:
          "ಇದು": "this"
          "ಒಳ್ಳೆಯದು": "good"
      "ಸರಿ, ಒಳ್ಳೆಯದು.":
        native: "Okay, that's good."
        bases:
          "ಸರಿ": "okay"
          "ಒಳ್ಳೆಯದು": "good"
  "kn-0951":
    native: "all right; done"
    notes:
      "n1": "ಆಯಿತು (āyitu) means 'it is settled' or 'it is done'. It is the everyday way to say 'okay' when you agree, and to say a task is finished."
    examples:
      "ಸರಿ, ಆಯಿತು.":
        native: "Okay, all right."
        bases:
          "ಸರಿ": "okay"
          "ಆಯಿತು": "all right"
      "ಕೆಲಸ ಆಯಿತು.":
        native: "The work is done."
        bases:
          "ಕೆಲಸ": "work"
          "ಆಯಿತು": "done"
  "kn-0952":
    native: "like that; so"
    notes:
      "n1": "ಹಾಗೆ (hāge) is 'like that'. Its pair is ಹೀಗೆ (hīge), 'like this'. ಹಾಗೆ (hāge) alone with ಅಲ್ಲ (alla) is 'not like that'."
    examples:
      "ಹಾಗೆ ಮಾಡಿ.":
        native: "Do it like that."
        bases:
          "ಹಾಗೆ": "like that"
          "ಮಾಡಿ": "do"
      "ಹಾಗೆ ಅಲ್ಲ.":
        native: "Not like that."
        bases:
          "ಹಾಗೆ": "like that"
          "ಅಲ್ಲ": "not"
