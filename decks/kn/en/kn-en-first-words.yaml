native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC0-1.0"
description: "Greetings, the respect Kannada builds into them, and how to say you are still learning. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0142":
    native: "hello; goodbye"
    notes:
      "n1": "Said with palms pressed together, to anyone. In a family, younger people often greet elders by touching their feet; a visitor is not expected to."
  "kn-0143":
    native: "you (respectful); you (plural)"
    notes:
      "n1": "Kannada has two words for 'you': ನೀವು (nīvu) for strangers, elders and anyone you respect, and ನೀನು (nīnu) for friends, children and the very close. The verb changes with each. A learner is always safe with ನೀವು (nīvu)."
  "kn-0144":
    native: "How are you? (respectful)"
    notes:
      "n1": "Literally 'how are you?'. To a friend: ಹೇಗಿದ್ದೀಯ? (hegiddiya?)."
  "kn-0145":
    native: "I'm fine."
    notes:
      "n1": "ಚೆನ್ನಾಗಿ (cennāgi) is 'well'. In speech, ಚೆನ್ನಾಗಿದ್ದೀನಿ (cennāgiddīni)."
  "kn-0146":
    native: "thank you"
    notes:
      "n1": "Formal. Many people simply say 'thanks' in English, and among family thanks are often left out."
  "kn-0147":
    native: "OK; all right; correct"
  "kn-0148":
    native: "goodbye (said by the one leaving)"
    notes:
      "n1": "Literally 'I'll go and come back'. A plain 'I'm going' can sound final. The one staying says ಹೋಗಿ ಬನ್ನಿ (hōgi banni), go and come back."
  "kn-0149":
    native: "I don't know Kannada."
    notes:
      "n1": "Literally 'Kannada does not come to me'. In speech, ಕನ್ನಡ ಬರಲ್ಲ (kannaḍa baralla)."
  "kn-0150":
    native: "I'm still learning Kannada."
  "kn-0151":
    native: "Please speak slowly."
    notes:
      "n1": "The ending -ಇ (-i) makes a polite request: ಕುಳಿತುಕೊಳ್ಳಿ (kuḷitukoḷḷi), please sit."
  "kn-0152":
    native: "Please say that again."
  "kn-0153":
    native: "sorry; excuse me"
    notes:
      "n1": "Literally 'forgive'. Also to get past someone or to get their attention."
