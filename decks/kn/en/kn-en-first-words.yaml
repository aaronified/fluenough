description: "The respect Kannada builds into 'you': ನೀವು (nīvu) and ನೀನು (nīnu). Greetings and saying you are still learning are in the phrasebook. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0143":
    native: "you (respectful); you (plural)"
    notes:
      "n1": "Kannada has two words for 'you': ನೀವು (nīvu) for strangers, elders and anyone you respect, and ನೀನು (nīnu) for friends, children and the very close. The verb changes with each. A learner is always safe with ನೀವು (nīvu)."
