schema: 1
id: "kn-en-animals"
kind: "layer"
core: "kn-animals"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Animals"
license: "CC-BY-SA-4.0"
description: "Animals at home, on the farm, in the forest and in the air, and what they do. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-0926":
    native: "dog"
    notes:
      "n1": "A pet dog is ನಾಯಿ (nāyi); the verb ಬೊಗಳು (bogaḷu) means to bark."
    examples:
      "ನಮ್ಮ ಮನೆಯಲ್ಲಿ ನಾಯಿ ಇದೆ.": { native: "There is a dog in our home.", bases: { "ನಮ್ಮ": "our", "ಮನೆಯಲ್ಲಿ": "in the house", "ಇದೆ": "is" } }
      "ನಾಯಿ ಬೊಗಳುತ್ತಿದೆ.": { native: "The dog is barking.", bases: { "ಬೊಗಳುತ್ತಿದೆ": "is barking" } }
  "kn-0927":
    native: "cat"
    notes:
      "n1": "A cat is a common pet: ಬೆಕ್ಕು (bekku) is also the word for a tomcat."
    examples:
      "ಬೆಕ್ಕು ಹಾಲು ಕುಡಿಯುತ್ತಿದೆ.": { native: "The cat is drinking milk.", bases: { "ಹಾಲು": "milk", "ಕುಡಿಯುತ್ತಿದೆ": "is drinking" } }
      "ಬೆಕ್ಕು ಮೇಜಿನ ಕೆಳಗೆ ಮಲಗಿದೆ.": { native: "The cat is sleeping under the table.", bases: { "ಮೇಜಿನ": "of the table", "ಕೆಳಗೆ": "under", "ಮಲಗಿದೆ": "is sleeping" } }
  "kn-0928":
    native: "cow"
    notes:
      "n1": "A cow gives milk: ಹಸು (hasu) is kept on farms."
    examples:
      "ಹಸು ಹುಲ್ಲು ತಿನ್ನುತ್ತಿದೆ.": { native: "The cow is eating grass.", bases: { "ಹುಲ್ಲು": "grass", "ತಿನ್ನುತ್ತಿದೆ": "is eating" } }
      "ಹಸು ಹಾಲು ಕೊಡುತ್ತದೆ.": { native: "The cow gives milk.", bases: { "ಕೊಡುತ್ತದೆ": "gives", "ಹಾಲು": "milk" } }
  "kn-0929":
    native: "buffalo"
    notes:
      "n1": "A buffalo is bigger than a cow and gives more milk: ಎಮ್ಮೆ (emme)."
    examples:
      "ಎಮ್ಮೆ ಕೆರೆಯಲ್ಲಿ ಇದೆ.": { native: "The buffalo is in the pond.", bases: { "ಕೆರೆಯಲ್ಲಿ": "in the pond", "ಇದೆ": "is" } }
      "ಎಮ್ಮೆ ದೊಡ್ಡದು.": { native: "The buffalo is big.", bases: { "ದೊಡ್ಡದು": "big one" } }
  "kn-0930":
    native: "horse"
    notes:
      "n1": "A horse is ridden: the verb ಸವಾರಿ ಮಾಡು (savāri māḍu) means to ride."
    examples:
      "ಕುದುರೆ ವೇಗವಾಗಿ ಓಡುತ್ತದೆ.": { native: "The horse runs fast.", bases: { "ವೇಗವಾಗಿ": "fast", "ಓಡುತ್ತದೆ": "runs" } }
      "ಅವನು ಕುದುರೆ ಮೇಲೆ ಕುಳಿತ.": { native: "He sat on the horse.", bases: { "ಮೇಲೆ": "on", "ಕುಳಿತ": "sat", "ಅವನು": "he" } }
  "kn-0931":
    native: "elephant"
    notes:
      "n1": "An elephant is very big: ಆನೆ (āne) has a long trunk."
    examples:
      "ಆನೆ ತುಂಬಾ ದೊಡ್ಡದು.": { native: "The elephant is very big.", bases: { "ತುಂಬಾ": "very", "ದೊಡ್ಡದು": "big one" } }
      "ಕಾಡಿನಲ್ಲಿ ಆನೆ ಇದೆ.": { native: "There is an elephant in the forest.", bases: { "ಕಾಡಿನಲ್ಲಿ": "in the forest", "ಇದೆ": "is" } }
  "kn-0932":
    native: "tiger"
    notes:
      "n1": "A tiger lives in the forest: ಹುಲಿ (huli) is a large cat."
    examples:
      "ಹುಲಿ ಕಾಡಿನಲ್ಲಿ ವಾಸಿಸುತ್ತದೆ.": { native: "The tiger lives in the forest.", bases: { "ಕಾಡಿನಲ್ಲಿ": "in the forest", "ವಾಸಿಸುತ್ತದೆ": "lives" } }
      "ಹುಲಿ ಬಹಳ ವೇಗವಾಗಿ ಓಡುತ್ತದೆ.": { native: "The tiger runs very fast.", bases: { "ಬಹಳ": "very", "ವೇಗವಾಗಿ": "fast", "ಓಡುತ್ತದೆ": "runs" } }
  "kn-0933":
    native: "lion"
    notes:
      "n1": "A lion is called the king of the forest: ಸಿಂಹ (simha)."
    examples:
      "ಸಿಂಹ ಗರ್ಜಿಸುತ್ತಿದೆ.": { native: "The lion is roaring.", bases: { "ಗರ್ಜಿಸುತ್ತಿದೆ": "is roaring" } }
      "ಸಿಂಹ ಕಾಡಿನ ರಾಜ.": { native: "The lion is the king of the forest.", bases: { "ಕಾಡಿನ": "of the forest", "ರಾಜ": "king" } }
  "kn-0934":
    native: "rabbit"
    notes:
      "n1": "A rabbit has long ears: ಮೊಲ (mola) runs quickly."
    examples:
      "ಮೊಲ ಓಡುತ್ತಿದೆ.": { native: "The rabbit is running.", bases: { "ಓಡುತ್ತಿದೆ": "is running" } }
      "ಮಕ್ಕಳು ಮೊಲ ನೋಡಿದರು.": { native: "The children saw the rabbit.", bases: { "ಮಕ್ಕಳು": "children", "ನೋಡಿದರು": "saw" } }
  "kn-0935":
    native: "sheep"
    notes:
      "n1": "Sheep give wool: ಕುರಿ (kuri) is kept on a farm."
    examples:
      "ಕುರಿಗಳು ಹುಲ್ಲು ತಿನ್ನುತ್ತಿವೆ.": { native: "The sheep are eating grass.", bases: { "ಕುರಿಗಳು": "sheep", "ಹುಲ್ಲು": "grass", "ತಿನ್ನುತ್ತಿವೆ": "are eating" } }
      "ಕುರಿ ಬೆಚ್ಚಗಿನ ಉಣ್ಣೆ ಕೊಡುತ್ತದೆ.": { native: "The sheep gives warm wool.", bases: { "ಬೆಚ್ಚಗಿನ": "warm", "ಉಣ್ಣೆ": "wool", "ಕೊಡುತ್ತದೆ": "gives" } }
  "kn-0936":
    native: "goat"
    notes:
      "n1": "A goat eats leaves: ಮೇಕೆ (mēke) is kept for milk."
    examples:
      "ಮೇಕೆ ಎಲೆ ತಿನ್ನುತ್ತಿದೆ.": { native: "The goat is eating leaves.", bases: { "ಎಲೆ": "leaves", "ತಿನ್ನುತ್ತಿದೆ": "is eating" } }
      "ಮೇಕೆ ಪುಟ್ಟದು.": { native: "The goat is small.", bases: { "ಪುಟ್ಟದು": "small one" } }
  "kn-0937":
    native: "bird"
    notes:
      "n1": "A bird flies: ಹಕ್ಕಿ (hakki) sings in the morning."
    examples:
      "ಮರದ ಮೇಲೆ ಹಕ್ಕಿ ಇದೆ.": { native: "There is a bird on the tree.", bases: { "ಮರದ": "of the tree", "ಮೇಲೆ": "on", "ಇದೆ": "is" } }
      "ಹಕ್ಕಿ ಹಾರುತ್ತಿದೆ.": { native: "The bird is flying.", bases: { "ಹಾರುತ್ತಿದೆ": "is flying" } }
  "kn-0938":
    native: "crow"
    notes:
      "n1": "A crow is black: ಕಾಗೆ (kāge) is seen in towns and villages."
    examples:
      "ಕಾಗೆ ಕೂಗುತ್ತಿದೆ.": { native: "The crow is calling.", bases: { "ಕೂಗುತ್ತಿದೆ": "is calling" } }
      "ಕಾಗೆ ಕಪ್ಪು.": { native: "The crow is black.", bases: { "ಕಪ್ಪು": "black" } }
  "kn-0939":
    native: "parrot"
    notes:
      "n1": "A green bird that can speak: ಗಿಳಿ (giḷi) is often kept as a pet."
    examples:
      "ಗಿಳಿ ಹಸಿರು.": { native: "The parrot is green.", bases: { "ಹಸಿರು": "green" } }
      "ಗಿಳಿ ಮಾತನಾಡುತ್ತದೆ.": { native: "The parrot talks.", bases: { "ಮಾತನಾಡುತ್ತದೆ": "talks" } }
  "kn-0940":
    native: "pigeon"
    notes:
      "n1": "A pigeon is a grey bird that lives in towns: ಪಾರಿವಾಳ (pārivāḷa)."
    examples:
      "ಪಾರಿವಾಳ ಮನೆಯ ಮೇಲೆ ಕುಳಿತಿದೆ.": { native: "The pigeon is sitting on the house.", bases: { "ಮನೆಯ": "of the house", "ಮೇಲೆ": "on", "ಕುಳಿತಿದೆ": "is sitting" } }
      "ಪಾರಿವಾಳಗಳು ಹಾರುತ್ತಿವೆ.": { native: "The pigeons are flying.", bases: { "ಪಾರಿವಾಳಗಳು": "pigeons", "ಹಾರುತ್ತಿವೆ": "are flying" } }
  "kn-0941":
    native: "snake"
    notes:
      "n1": "A snake crawls: ಹಾವು (hāvu) can be dangerous."
    examples:
      "ಹಾವು ಹುಲ್ಲಿನಲ್ಲಿ ಇದೆ.": { native: "The snake is in the grass.", bases: { "ಹುಲ್ಲಿನಲ್ಲಿ": "in the grass", "ಇದೆ": "is" } }
      "ಹಾವು ಅಪಾಯಕಾರಿ.": { native: "The snake is dangerous.", bases: { "ಅಪಾಯಕಾರಿ": "dangerous" } }
  "kn-0942":
    native: "frog"
    notes:
      "n1": "A frog jumps: ಕಪ್ಪೆ (kappe) lives near water."
    examples:
      "ಕೊಳದಲ್ಲಿ ಕಪ್ಪೆ ಇದೆ.": { native: "There is a frog in the pond.", bases: { "ಕೊಳದಲ್ಲಿ": "in the pond", "ಇದೆ": "is" } }
      "ಕಪ್ಪೆ ಜಿಗಿಯುತ್ತದೆ.": { native: "The frog jumps.", bases: { "ಜಿಗಿಯುತ್ತದೆ": "jumps" } }
  "kn-0943":
    native: "ant"
    notes:
      "n1": "Ants are very small: ಇರುವೆ (iruve) live in groups."
    examples:
      "ಇರುವೆ ಸಕ್ಕರೆ ತಿನ್ನುತ್ತಿದೆ.": { native: "The ant is eating sugar.", bases: { "ಸಕ್ಕರೆ": "sugar", "ತಿನ್ನುತ್ತಿದೆ": "is eating" } }
      "ಇರುವೆ ಚಿಕ್ಕದು.": { native: "The ant is tiny.", bases: { "ಚಿಕ್ಕದು": "small one" } }
  "kn-0944":
    native: "fly"
    notes:
      "n1": "A fly buzzes around food: ನೊಣ (noṇa) is a common insect."
    examples:
      "ನೊಣ ಹಾರುತ್ತಿದೆ.": { native: "The fly is flying.", bases: { "ಹಾರುತ್ತಿದೆ": "is flying" } }
      "ಊಟದ ಮೇಲೆ ನೊಣ ಇದೆ.": { native: "There is a fly on the food.", bases: { "ಊಟದ": "of the food", "ಮೇಲೆ": "on", "ಇದೆ": "is" } }
  "kn-0945":
    native: "butterfly"
    notes:
      "n1": "A butterfly has coloured wings: ಚಿಟ್ಟೆ (ciṭṭe) flies from flower to flower."
    examples:
      "ಚಿಟ್ಟೆ ಹೂವಿನ ಮೇಲೆ ಕುಳಿತಿದೆ.": { native: "The butterfly is sitting on the flower.", bases: { "ಹೂವಿನ": "of the flower", "ಮೇಲೆ": "on", "ಕುಳಿತಿದೆ": "is sitting" } }
      "ಚಿಟ್ಟೆ ಸುಂದರ.": { native: "The butterfly is beautiful.", bases: { "ಸುಂದರ": "beautiful" } }
  "kn-0946":
    native: "cockroach"
    notes:
      "n1": "A cockroach is found in dirty places: ಜಿರಳೆ (jiraḷe) is not wanted in a home."
    examples:
      "ಅಡುಗೆಮನೆಯಲ್ಲಿ ಜಿರಳೆ ಇದೆ.": { native: "There is a cockroach in the kitchen.", bases: { "ಅಡುಗೆಮನೆಯಲ್ಲಿ": "in the kitchen", "ಇದೆ": "is" } }
      "ಜಿರಳೆ ಓಡಿತು.": { native: "The cockroach ran away.", bases: { "ಓಡಿತು": "ran" } }
  "kn-0947":
    native: "camel"
    notes:
      "n1": "A camel lives in the desert: ಒಂಟೆ (oṇṭe) can go a long time without water."
    examples:
      "ಒಂಟೆ ಮರುಭೂಮಿಯಲ್ಲಿ ಇದೆ.": { native: "The camel is in the desert.", bases: { "ಮರುಭೂಮಿಯಲ್ಲಿ": "in the desert", "ಇದೆ": "is" } }
      "ಒಂಟೆ ಎತ್ತರ.": { native: "The camel is tall.", bases: { "ಎತ್ತರ": "tall" } }
  "kn-0948":
    native: "bear"
    notes:
      "n1": "A bear is big and strong: ಕರಡಿ (karaḍi) lives in forests."
    examples:
      "ಕರಡಿ ಕಾಡಿನಲ್ಲಿ ವಾಸಿಸುತ್ತದೆ.": { native: "The bear lives in the forest.", bases: { "ಕಾಡಿನಲ್ಲಿ": "in the forest", "ವಾಸಿಸುತ್ತದೆ": "lives" } }
      "ಕರಡಿ ಬಲಿಷ್ಠ.": { native: "The bear is strong.", bases: { "ಬಲಿಷ್ಠ": "strong" } }
  "kn-0949":
    native: "fox; jackal"
    notes:
      "n1": "A fox is clever: ನರಿ (nari) hunts small animals at night."
    examples:
      "ನರಿ ರಾತ್ರಿ ಓಡುತ್ತದೆ.": { native: "The fox runs at night.", bases: { "ರಾತ್ರಿ": "at night", "ಓಡುತ್ತದೆ": "runs" } }
      "ನರಿ ಚುರುಕು.": { native: "The fox is clever.", bases: { "ಚುರುಕು": "clever" } }
