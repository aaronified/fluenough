schema: 1
id: "kn-en-numbers-1-20"
kind: "layer"
core: "kn-numbers-1-20"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Numbers 1–20"
license: "CC-BY-SA-4.0"
description: "One to twenty, the building blocks of every Kannada number. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0244":
    native: "1, one"
    notes:
      "n1": "Before a noun too: ಒಂದು ಕಾಫಿ (ondu kāfi), one coffee. People are counted apart: ಒಬ್ಬ (obba), one man; ಒಬ್ಬಳು (obbaḷu), one woman. Kannada has its own digits, ೧ ೨ ೩ (1 2 3), but prices and bus numbers use 1 2 3."
    "examples": {
      "ಒಂದು ಕ್ಲಿಕ್ ಸಾಕು.": {"native": "One click is enough.", "bases": {}},
      "ಒಂದು ಮೀಟರ್ ಎಷ್ಟು?": {"native": "How much is one metre?", "bases": {}}
    }
  "kn-0245":
    native: "2, two"
    notes:
      "n1": "Two people: ಇಬ್ಬರು (ibbaru)."
    "examples": {
      "ಪ್ಲಾಟ್ಫಾರ್ಮ್ ಎರಡು.": {"native": "Platform two.", "bases": {}},
      "ಎರಡು ಆಯ್ಕೆ ಇದೆ.": {"native": "There are two options.", "bases": {"ಇದೆ": "there are"}}
    }
  "kn-0246":
    native: "3, three"
    notes:
      "n1": "Three people: ಮೂವರು (mūvaru)."
    "examples": {
      "ಮೂರು ಪುಸ್ತಕಗಳು": {"native": "three books", "bases": {"ಪುಸ್ತಕಗಳು": "book"}}
    }
  "kn-0247":
    native: "4, four"
  "kn-0248":
    native: "5, five"
    "examples": {
      "ಸಮಿತಿಯಲ್ಲಿ ಐದು ಜನ ಇದ್ದಾರೆ.": {"native": "There are five people in the committee.", "bases": {"ಸಮಿತಿಯಲ್ಲಿ": "in the committee", "ಇದ್ದಾರೆ": "there are"}}
    }
  "kn-0249":
    native: "6, six"
    "examples": {
      "ಅನ್ನ ಆರಿತು.": {"native": "The rice cooled.", "bases": {"ಆರಿತು": "cooled"}}
    }
  "kn-0250":
    native: "7, seven"
    notes:
      "n1": "Also the verb 'get up': ಏಳು ಗಂಟೆಗೆ ಏಳುತ್ತೇನೆ (ēḷu gaṇṭege ēḷuttēne), I get up at seven."
    "examples": {
      "ನಾನು ಬೇಗ ಏಳುತ್ತೇನೆ.": {"native": "I get up early.", "bases": {"ಏಳುತ್ತೇನೆ": "to get up"}},
      "ಅವಳು ಸಾಮಾನ್ಯವಾಗಿ ಬೆಳಿಗ್ಗೆ ಬೇಗ ಏಳುತ್ತಾಳೆ.": {"native": "She usually gets up early in the morning.", "bases": {"ಬೆಳಿಗ್ಗೆ": "in the morning", "ಏಳುತ್ತಾಳೆ": "to get up"}}
    }
  "kn-0251":
    native: "8, eight"
  "kn-0252":
    native: "9, nine"
  "kn-0253":
    native: "10, ten"
    notes:
      "n1": "ಹತ್ತು (hattu) also means 'to climb; to get on': ಬಸ್ ಹತ್ತಿ (bas hatti), get on the bus."
  "kn-0254":
    native: "11, eleven"
    "examples": {
      "ನಾನು ರಾತ್ರಿ ಹನ್ನೊಂದು ಗಂಟೆಗೆ ಮಲಗುತ್ತೇನೆ.": {"native": "I go to bed at eleven at night.", "bases": {"ನಾನು": "I"}}
    }
  "kn-0255":
    native: "12, twelve"
  "kn-0256":
    native: "13, thirteen"
    notes:
      "n1": "From 13 to 18, ten is ಹದಿ- (hadi-): ಹದಿ (hadi) + ಮೂರು (mūru)."
  "kn-0257":
    native: "14, fourteen"
  "kn-0258":
    native: "15, fifteen"
  "kn-0259":
    native: "16, sixteen"
  "kn-0260":
    native: "17, seventeen"
  "kn-0261":
    native: "18, eighteen"
  "kn-0262":
    native: "19, nineteen"
    notes:
      "n1": "Ten and nine: ಹತ್ತು (hattu) + ಒಂಬತ್ತು (ombattu)."
  "kn-0263":
    native: "20, twenty"
    "examples": {
      "ನನ್ನ ವಯಸ್ಸು ಇಪ್ಪತ್ತು.": {"native": "My age is twenty.", "bases": {}}
    }
