schema: 1
id: "kn-en-illness"
kind: "layer"
core: "kn-illness"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Illness and the doctor"
license: "CC-BY-SA-4.0"
description: "Being ill: fever, cold and cough, pain, the doctor, the hospital, the pharmacy and the medicine. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1058":
    native: "runny nose, a cold"
    notes:
      "n1": "A cold, with a runny nose. A cough is ಕೆಮ್ಮು (kemmu)."
    examples:
      "ನನಗೆ ನೆಗಡಿ ಆಗಿದೆ.": { native: "I have a cold.", bases: { "ಆಗಿದೆ": "has become" } }
      "ನೆಗಡಿ ಇದ್ದರೆ ನೀರು ಕುಡಿ.": { native: "If you have a cold, drink water.", bases: { "ಇದ್ದರೆ": "if there is" } }
  "kn-1059":
    native: "cough"
    notes:
      "n1": "A cough, which can be dry or with phlegm."
    examples:
      "ರಾತ್ರಿ ಕೆಮ್ಮು ಜಾಸ್ತಿ.": "The cough is worse at night."
      "ಕೆಮ್ಮು ಔಷಧ ತೆಗೆದುಕೊ.": "Take the cough medicine."
  "kn-1060":
    native: "headache"
    notes:
      "n1": "A headache: a head with pain, as ತಲೆ ನೋವು (tale nōvu)."
    examples:
      "ತಲೆನೋವು ಇದೆ.": { native: "I have a headache.", bases: { "ಇದೆ": "has" } }
      "ತಲೆನೋವು ಇದ್ದರೆ ವಿಶ್ರಾಂತಿ ತೆಗೆದುಕೊ.": { native: "If you have a headache, take rest.", bases: { "ಇದ್ದರೆ": "if there is" } }
  "kn-1061":
    native: "stomach ache"
    notes:
      "n1": "A pain in the stomach."
    examples:
      "ಹೊಟ್ಟೆನೋವು ಇದೆ.": { native: "I have a stomach ache.", bases: { "ಇದೆ": "has" } }
      "ಹೊಟ್ಟೆನೋವಿಗೆ ಮಾತ್ರೆ ಕೊಡು.": { native: "Give a tablet for the stomach ache.", bases: { "ಹೊಟ್ಟೆನೋವಿಗೆ": "for the stomach ache" } }
  "kn-1062":
    native: "to hurt"
    notes:
      "n1": "To hurt, said of a part of the body."
    examples:
      "ಕಾಲು ನೋಯುತ್ತಿದೆ.": { native: "My leg is hurting.", bases: { "ನೋಯುತ್ತಿದೆ": "is hurting" } }
      "ಹೊಟ್ಟೆ ನೋಯುತ್ತಿದೆ.": { native: "My stomach is hurting.", bases: { "ನೋಯುತ್ತಿದೆ": "is hurting" } }
  "kn-1063":
    native: "doctor"
    notes:
      "n1": "A doctor. The woman doctor is also ವೈದ್ಯೆ (vaidye)."
    examples:
      "ವೈದ್ಯರು ಬಂದರು.": { native: "The doctor came.", bases: { "ವೈದ್ಯರು": "the doctor" } }
      "ವೈದ್ಯರಿಗೆ ತೋರಿಸು.": { native: "Show it to the doctor.", bases: { "ವೈದ್ಯರಿಗೆ": "to the doctor" } }
  "kn-1065":
    native: "tablet"
    notes:
      "n1": "A tablet of medicine, taken with water."
    examples:
      "ದಿನಕ್ಕೆ ಎರಡು ಮಾತ್ರೆ.": "Two tablets a day."
      "ಮಾತ್ರೆ ತೆಗೆದುಕೊ.": "Take the tablet."
  "kn-1066":
    native: "syrup"
    notes:
      "n1": "A medicine in liquid form, from a bottle."
    examples:
      "ಸಿರಪ್ ಕುಡಿ.": "Drink the syrup."
      "ಸಿರಪ್ ಬೇಕು.": "I need syrup."
  "kn-1067":
    native: "injection"
    notes:
      "n1": "An injection, given with a needle."
    examples:
      "ಚುಚ್ಚುಮದ್ದು ಕೊಟ್ಟರು.": "They gave an injection."
      "ಚುಚ್ಚುಮದ್ದು ನೋವು ಇದೆ.": { native: "The injection hurts.", bases: { "ಇದೆ": "has" } }
  "kn-1068":
    native: "to recover, to heal"
    notes:
      "n1": "To get well again after an illness."
    examples:
      "ಬೇಗ ಗುಣವಾಗು.": "Get well soon."
      "ಅವಳಿಗೆ ಗುಣವಾಯಿತು.": { native: "She recovered.", bases: { "ಗುಣವಾಯಿತು": "recovered" } }
  "kn-1069":
    native: "health"
    notes:
      "n1": "Health, of body and mind."
    examples:
      "ಆರೋಗ್ಯ ಚೆನ್ನಾಗಿದೆ.": "My health is good."
      "ನಿನ್ನ ಆರೋಗ್ಯ ಹೇಗಿದೆ?": "How is your health?"
  "kn-1070":
    native: "ill health"
    notes:
      "n1": "Being ill; the opposite of health ಆರೋಗ್ಯ (ārōgya)."
    examples:
      "ಅವನಿಗೆ ಅನಾರೋಗ್ಯ ಇದೆ.": { native: "He is ill.", bases: { "ಇದೆ": "has" } }
      "ಅನಾರೋಗ್ಯ ಇದ್ದರೆ ವಿಶ್ರಾಂತಿ ತೆಗೆದುಕೊ.": { native: "If you are ill, take rest.", bases: { "ಇದ್ದರೆ": "if there is" } }
  "kn-1071":
    native: "not well, ill"
    notes:
      "n1": "Not well, said of a person who is ill."
    examples:
      "ನನಗೆ ಹುಷಾರಿಲ್ಲ.": "I am not well."
      "ಇಂದು ಹುಷಾರಿಲ್ಲ.": "I am not well today."
  "kn-1072":
    native: "rest"
    notes:
      "n1": "Rest, time to relax after an illness or work."
    examples:
      "ವಿಶ್ರಾಂತಿ ತೆಗೆದುಕೊ.": "Take rest."
      "ಸ್ವಲ್ಪ ವಿಶ್ರಾಂತಿ ಬೇಕು.": "I need a little rest."
  "kn-1073":
    native: "wound, injury"
    notes:
      "n1": "A wound, a cut or an injury to the skin."
    examples:
      "ಕೈಯಲ್ಲಿ ಗಾಯ ಆಗಿದೆ.": { native: "I have a wound on the hand.", bases: { "ಆಗಿದೆ": "has become" } }
      "ಗಾಯಕ್ಕೆ ಔಷಧ ಹಚ್ಚು.": { native: "Put medicine on the wound.", bases: { "ಗಾಯಕ್ಕೆ": "on the wound", "ಹಚ್ಚು": "put on" } }
  "kn-1074":
    native: "bandage"
    notes:
      "n1": "A bandage, wrapped round a wound."
    examples:
      "ಬ್ಯಾಂಡೇಜ್ ಹಾಕು.": { native: "Put on a bandage.", bases: { "ಹಾಕು": "put on" } }
      "ಬ್ಯಾಂಡೇಜ್ ಬೇಕು.": "I need a bandage."
  "kn-1075":
    native: "vomiting"
    notes:
      "n1": "Vomiting, when the stomach throws up food."
    examples:
      "ವಾಂತಿ ಆಯಿತು.": "I vomited."
      "ವಾಂತಿ ಇದ್ದರೆ ವೈದ್ಯರಿಗೆ ಹೇಳು.": { native: "If you vomit, tell the doctor.", bases: { "ಇದ್ದರೆ": "if there is", "ವೈದ್ಯರಿಗೆ": "to the doctor" } }
  "kn-1076":
    native: "diarrhoea"
    notes:
      "n1": "Diarrhoea, with loose stools."
    examples:
      "ಭೇದಿ ಇದೆ.": { native: "I have diarrhoea.", bases: { "ಇದೆ": "has" } }
      "ಭೇದಿಯಲ್ಲಿ ನೀರು ಕುಡಿ.": { native: "In diarrhoea, drink water.", bases: { "ಭೇದಿಯಲ್ಲಿ": "in diarrhoea" } }
  "kn-1077":
    native: "tiredness"
    notes:
      "n1": "Being tired and weak, as after an illness."
    examples:
      "ತುಂಬಾ ಸುಸ್ತು.": "I am very tired."
      "ಸುಸ್ತು ಆಗಿದೆ.": { native: "I am tired.", bases: { "ಆಗಿದೆ": "has become" } }
  "kn-1078":
    native: "test, examination"
    notes:
      "n1": "A test or a check-up by a doctor."
    examples:
      "ವೈದ್ಯರು ಪರೀಕ್ಷೆ ಮಾಡುತ್ತಾರೆ.": { native: "The doctor does a check-up.", bases: { "ವೈದ್ಯರು": "the doctor" } }
      "ರಕ್ತ ಪರೀಕ್ಷೆ ಬೇಕು.": "A blood test is needed."
  "kn-1079":
    native: "blood"
    notes:
      "n1": "Blood, which flows in the body."
    examples:
      "ರಕ್ತ ಬಂತು.": "Blood came."
      "ರಕ್ತ ಬೇಕು.": "Blood is needed."
  "kn-1080":
    native: "treatment"
    notes:
      "n1": "Treatment for an illness, by a doctor."
    examples:
      "ಚಿಕಿತ್ಸೆ ಮುಗಿಯಿತು.": { native: "The treatment is over.", bases: { "ಮುಗಿಯಿತು": "is over" } }
      "ಚಿಕಿತ್ಸೆ ಬೇಕು.": "I need treatment."
  "kn-1081":
    native: "disease"
    notes:
      "n1": "A disease or an illness."
    examples:
      "ಇದು ಯಾವ ರೋಗ?": "What disease is this?"
      "ರೋಗ ಬೇಗ ಗುಣವಾಯಿತು.": { native: "The disease healed quickly.", bases: { "ಗುಣವಾಯಿತು": "healed" } }
  "kn-1082":
    native: "swelling"
    notes:
      "n1": "A swelling of a part of the body."
    examples:
      "ಕಾಲಿನಲ್ಲಿ ಊತ ಇದೆ.": { native: "There is swelling in the leg.", bases: { "ಇದೆ": "is" } }
      "ಊತ ಕಡಿಮೆ ಆಯಿತು.": "The swelling went down."
  "kn-1083":
    native: "to examine"
    notes:
      "n1": "To examine a patient, as a doctor does."
    examples:
      "ವೈದ್ಯರು ಪರೀಕ್ಷಿಸುತ್ತಾರೆ.": { native: "The doctor examines.", bases: { "ವೈದ್ಯರು": "the doctor", "ಪರೀಕ್ಷಿಸುತ್ತಾರೆ": "examines" } }
      "ನನ್ನನ್ನು ಪರೀಕ್ಷಿಸು.": "Examine me."
  "kn-1084":
    native: "infection"
    notes:
      "n1": "An infection, from germs, in a wound or in the body."
    examples:
      "ಗಾಯದಲ್ಲಿ ಸೋಂಕು ಆಯಿತು.": { native: "An infection came in the wound.", bases: { "ಗಾಯದಲ್ಲಿ": "in the wound" } }
      "ಸೋಂಕು ಇದ್ದರೆ ವೈದ್ಯರು ನೋಡುತ್ತಾರೆ.": { native: "If there is an infection, the doctor looks at it.", bases: { "ಇದ್ದರೆ": "if there is", "ವೈದ್ಯರು": "the doctor" } }
  "kn-1085":
    native: "allergy"
    notes:
      "n1": "An allergy, a reaction to food or medicine."
    examples:
      "ನನಗೆ ಅಲರ್ಜಿ ಇದೆ.": { native: "I have an allergy.", bases: { "ಇದೆ": "has" } }
      "ಔಷಧಕ್ಕೆ ಅಲರ್ಜಿ ಇಲ್ಲ.": { native: "There is no allergy to the medicine.", bases: { "ಔಷಧಕ್ಕೆ": "to the medicine" } }
