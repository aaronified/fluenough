schema: 1
id: "kn-en-market"
kind: "layer"
core: "kn-market"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Market"
license: "CC0-1.0"
description: "Asking the price, bargaining, paying: what a market stall needs. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0297":
    native: "How much is it?"
    notes:
      "n1": "Also ಇದಕ್ಕೆ ಎಷ್ಟು? (idakke eshtu?), 'for this, how much?'."
    bases:
      "ಇದು": "this"
  "kn-0298":
    native: "price"
    notes:
      "n1": "Short e, plain l. Compare ಬೇಳೆ (bēḷe), lentils, with a long e and the curled-back l."
  "kn-0299":
    native: "rupee"
  "kn-0300":
    native: "money"
    notes:
      "n1": "The everyday word. ಹಣ (haṇa) is more formal."
  "kn-0301":
    native: "change; small notes and coins"
    notes:
      "n1": "ಚಿಲ್ಲರೆ ಇದೆಯಾ? (chillare ideya?), do you have change?"
  "kn-0302":
    native: "That's too much!"
    notes:
      "n1": "ತುಂಬಾ (tumbā), very; ಜಾಸ್ತಿ (jāsti), more, too much."
    bases:
      "ತುಂಬಾ": "very; a lot"
      "ಜಾಸ್ತಿ": "too much; more"
  "kn-0303":
    native: "Please lower it a little."
    notes:
      "n1": "ಕಡಿಮೆ (kaḍime) is 'less'."
    bases:
      "ಕಡಿಮೆ": "less"
      "ಮಾಡಿ": "to do; to make"
  "kn-0304":
    native: "shop"
  "kn-0305":
    native: "please give (me)"
    notes:
      "n1": "The polite form of ಕೊಡು (koḍu): ಅರ್ಧ ಕೆಜಿ ಕೊಡಿ (ardha keji koḍi), half a kilo, please."
  "kn-0306":
    native: "kilo"
    notes:
      "n1": "Also ಕಿಲೋ (kilō). ಒಂದು ಕೆಜಿಗೆ ಎಷ್ಟು (ondu kejige eṣṭu)? How much for a kilo?"
  "kn-0307":
    native: "a little; a bit"
    notes:
      "n1": "Also softens a request: ಸ್ವಲ್ಪ ಬನ್ನಿ (svalpa banni), come here a moment, please."
  "kn-0308":
    native: "Nothing else."
    notes:
      "n1": "'Anything else isn't wanted'. ಬೇರೆ (bēre) is 'other'."
    bases:
      "ಬೇರೆ": "other; else"
      "ಏನೂ": "anything; nothing"
