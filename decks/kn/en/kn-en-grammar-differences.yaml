id: "kn-en-grammar-differences"
kind: "layer"
core: "kn-grammar-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How Kannada grammar differs from English"
license: "CC0-1.0"
description: "Before any theme: the verb last, no is, endings for in and to, a verb that tells a man from a woman and a thing, two yous, no articles, and how Kannada says have, know, not and questions. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0124":
    native: "I eat rice."
    notes:
      "n1": "The verb comes last: subject, object, verb. Word for word, 'I rice eat'. In everyday speech, ತಿಂತೀನಿ (tintīni)."
  "kn-0125":
    native: "He is a doctor. (respectful)"
    notes:
      "n1": "No 'is' when you say what someone is: 'he doctor'. ಅವರು (avaru) is 'he' or 'she' said with respect, and 'they'."
  "kn-0126":
    native: "in the room"
    notes:
      "n1": "Kannada puts 'in' after the noun, as an ending: ಕೋಣೆ (kōṇe, room) + -ಅಲ್ಲಿ (-alli), joined by a y."
  "kn-0127":
    native: "to school"
    notes:
      "n1": "'To' is the ending -ಗೆ (-ge): ಶಾಲೆ (śāle, school) + -ಗೆ (-ge). A noun ending in a takes -ಕ್ಕೆ (-kke): ಊಟಕ್ಕೆ (ūṭakke), to the meal."
  "kn-0128":
    native: "with mother"
    notes:
      "n1": "'With' is ಜೊತೆ (jote), a word after the noun, and the noun takes -ಅ (-a), 'of': 'mother's company'."
  "kn-0129":
    native: "He came."
    notes:
      "n1": "The verb shows that 'he' is a man: -ಅನು (-anu). Speech drops the -ನು (-nu): ಅವನು ಬಂದ (avanu banda)."
  "kn-0130":
    native: "She came."
    notes:
      "n1": "A woman has an ending of her own, -ಅಳು (-aḷu)."
  "kn-0131":
    native: "It came."
    notes:
      "n1": "A thing or an animal takes -ತು (-tu). Unlike Telugu, Kannada never gives a woman the ending of a thing."
  "kn-0132":
    native: "Come! (to a friend)"
    notes:
      "n1": "Two words for 'you': ನೀನು (nīnu) to a friend, a child or a younger person."
  "kn-0133":
    native: "Please come."
    notes:
      "n1": "ನೀವು (nīvu) is the respectful 'you', and the plural, and its request ends in -ಇ (-i): ಬನ್ನಿ (banni), ಕೊಡಿ (koḍi), ಹೇಳಿ (hēḷi)."
  "kn-0134":
    native: "I'll come."
    notes:
      "n1": "The ending -ಏನೆ (-ēne) says 'I', so ನಾನು (nānu) can be left out. In speech, ಬರ್ತೀನಿ (bartīni)."
  "kn-0135":
    native: "a book; one book"
    notes:
      "n1": "No word for 'the', and ಒಂದು (ondu), 'one', serves for 'a'."
  "kn-0136":
    native: "I have a book."
    notes:
      "n1": "No verb 'have': 'near me a book is'."
  "kn-0137":
    native: "I know Kannada."
    notes:
      "n1": "'Kannada comes to me': the one who knows takes -ಗೆ (-ge), 'to'. So too ನನಗೆ ಗೊತ್ತು (nanage gottu), I know (it)."
  "kn-0138":
    native: "I won't come."
    notes:
      "n1": "'Not' is ಇಲ್ಲ (illa) after the verb, the same for every person: ಅವಳು ಬರುವುದಿಲ್ಲ (avaḷu baruvudilla), she won't come. In speech, ಬರಲ್ಲ (baralla)."
  "kn-0139":
    native: "There's no time."
    notes:
      "n1": "ಇಲ್ಲ (illa) is 'there is not', the opposite of ಇದೆ (ide), 'there is'."
  "kn-0140":
    native: "I'm not a doctor."
    notes:
      "n1": "A second 'not', ಅಲ್ಲ (alla), says what someone or something is not. ಇಲ್ಲ (illa) says something isn't there."
  "kn-0141":
    native: "Will you come?"
    notes:
      "n1": "A yes-or-no question ends in -ಆ (-ā): ನೀವು ಬರುತ್ತೀರಿ (you will come) becomes ನೀವು ಬರುತ್ತೀರಾ (nīvu baruttīrā)?, the last i turned into a long a."
