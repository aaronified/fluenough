schema: 1
id: "kn-en-more-verbs-sentences"
kind: "layer"
core: "kn-more-verbs-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs: sentences"
description: "Sentences about the kitchen and the house: boiling, pouring, washing and sweeping, with the words of the more-verbs unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8149":
    notes:
      "n1": "The object ಹಾಲು (hālu), milk, takes no ending because it means milk in general, not one particular milk."
    native: "She boils the milk now."
    bases:
      "ಕುದಿಸುತ್ತಾಳೆ": "to boil something, here in the third-person feminine present"
  "kn-8150":
    notes:
      "n1": "ಲೋಟಕ್ಕೆ (lōṭakke) is the dative, 'into the glass', showing where the milk goes."
    native: "I pour milk into the glass."
    bases:
      "ಲೋಟಕ್ಕೆ": "glass, here with the ending -ಕ್ಕೆ (-kke): into the glass"
      "ಸುರಿಯುತ್ತೇನೆ": "to pour, here in the first-person present"
  "kn-8151":
    notes:
      "n1": "ಬಟ್ಟಲನ್ನು (baṭṭalannu) is a particular bowl as object: ಬಟ್ಟಲು (baṭṭalu) drops its final u and takes the object ending."
    native: "Mom washes the bowl."
    bases:
      "ಬಟ್ಟಲನ್ನು": "bowl, here as the thing washed: the bowl"
      "ತೊಳೆಯುತ್ತಾಳೆ": "to wash, here in the third-person feminine present"
  "kn-8152":
    notes:
      "n1": "ಮನೆಯನ್ನು (maneyannu) is the object: after a noun ending in a vowel, ಮನೆ (mane) takes ಯನ್ನು (yannu) for the object."
    native: "Mom sweeps the house."
    bases:
      "ಮನೆಯನ್ನು": "house, here as the place swept: the house"
      "ಗುಡಿಸುತ್ತಾಳೆ": "to sweep, here in the third-person feminine present"
  "kn-8153":
    notes:
      "n1": "ಕಾರನ್ನು (kārannu) is the object from ಕಾರು (kāru): the final u drops and the object ending is added."
    native: "You wash the car."
    bases:
      "ಕಾರನ್ನು": "car, here as the thing washed: the car"
      "ತೊಳೆಯುತ್ತೀಯ": "to wash, here in the second-person present"
  "kn-8154":
    notes:
      "n1": "ಕಾರನ್ನು ನಿಲ್ಲಿಸು (kārannu nillisu) is the usual way to say 'park the car'; ನಿಲ್ಲಿಸು (nillisu) means 'stop' or 'make stop'."
    native: "Dad parks the car at night."
    bases:
      "ಕಾರನ್ನು": "car, here as the thing parked: the car"
      "ನಿಲ್ಲಿಸುತ್ತಾನೆ": "to stop or park something, here in the third-person masculine present"
  "kn-8155":
    notes:
      "n1": "ಊರಿಗೆ (ūrige) is 'to the village or town', the dative of ಊರು (ūru); with ನಾಳೆ (nāḷe), tomorrow, the present form ಹೋಗುತ್ತಾನೆ (hōguttāne) is used for the future."
    native: "Tomorrow the elder brother goes to the village."
    bases:
      "ಊರಿಗೆ": "village or town, here with the ending -ಗೆ (-ge): to the village"
      "ಹೋಗುತ್ತಾನೆ": "to go, here in the third-person masculine present"
  "kn-8156":
    notes:
      "n1": "ಮಗಳನ್ನು (magaḷannu) is the object from ಮಗಳು (magaḷu): the final u drops and the object ending is added."
    native: "Mom calls the daughter."
    bases:
      "ಮಗಳನ್ನು": "daughter, here as the one called: the daughter"
      "ಕರೆಯುತ್ತಾಳೆ": "to call, here in the third-person feminine present"
  "kn-8157":
    notes:
      "n1": "ನೀನು (nīnu) and the verb ending -ಈಯ (-īya) are informal; to a stranger or elder say ನೀವು (nīvu) with ಹೋಗುತ್ತೀರಾ (hōguttīrā)."
    native: "Where do you go in the morning?"
    bases:
      "ಹೋಗುತ್ತೀಯ": "to go, here in the second-person present"
  "kn-8158":
    notes:
      "n1": "ಸುರಿ (suri) is the verb for rain pouring down; ಮಳೆ ಬೀಳುತ್ತದೆ (maḷe bīḷuttade) is also said."
    native: "It rains."
    bases:
      "ಸುರಿಯುತ್ತದೆ": "to pour, here for rain, in the third-person neuter present"
  "kn-8159":
    notes:
      "n1": "ತುಂಬು (tumbu) is the informal command; to a stranger say the polite ತುಂಬಿ (tumbi)."
    native: "Fill the bottle."
    bases:
      "ಬಾಟಲಿಯನ್ನು": "bottle, here as the thing filled: the bottle"
  "kn-8160":
    notes:
      "n1": "The object ಹಾಲು (hālu) takes no ending here either, as milk in general."
    native: "I drink milk today."
    bases:
      "ಕುಡಿಯುತ್ತೇನೆ": "to drink, here in the first-person present"
