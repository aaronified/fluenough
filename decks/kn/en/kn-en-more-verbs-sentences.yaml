cards:
  "kn-8149":
    native: "She boils the milk now."
    bases:
      "ಕುದಿಸುತ್ತಾಳೆ": "to boil something, here in the third-person feminine present"
  "kn-8150":
    native: "I pour milk into the glass."
    bases:
      "ಲೋಟಕ್ಕೆ": "glass, here with the ending -ಕ್ಕೆ: into the glass"
      "ಸುರಿಯುತ್ತೇನೆ": "to pour, here in the first-person present"
  "kn-8151":
    native: "Mom washes the bowl."
    bases:
      "ಬಟ್ಟಲನ್ನು": "bowl, here as the thing washed: the bowl"
      "ತೊಳೆಯುತ್ತಾಳೆ": "to wash, here in the third-person feminine present"
  "kn-8152":
    native: "Mom sweeps the house."
    bases:
      "ಮನೆಯನ್ನು": "house, here as the place swept: the house"
      "ಗುಡಿಸುತ್ತಾಳೆ": "to sweep, here in the third-person feminine present"
  "kn-8153":
    native: "You wash the car."
    bases:
      "ಕಾರನ್ನು": "car, here as the thing washed: the car"
      "ತೊಳೆಯುತ್ತೀಯ": "to wash, here in the second-person present"
  "kn-8154":
    native: "Dad parks the car at night."
