      "ಊರಿಗೆ": "village or town, here with the ending -ಗೆ: to the village"
      "ಹೋಗುತ್ತಾನೆ": "to go, here in the third-person masculine present"
  "kn-8156":
    native: "Mom calls the daughter."
    bases:
      "ಮಗಳನ್ನು": "daughter, here as the one called: the daughter"
      "ಕರೆಯುತ್ತಾಳೆ": "to call, here in the third-person feminine present"
  "kn-8157":
    native: "Where do you go in the morning?"
    bases:
      "ಹೋಗುತ್ತೀಯ": "to go, here in the second-person present"
  "kn-8158":
    native: "It rains."
    bases:
      "ಸುರಿಯುತ್ತದೆ": "to pour, here for rain, in the third-person neuter present"
  "kn-8159":
    native: "Fill the bottle."
    bases:
      "ಬಾಟಲಿಯನ್ನು": "bottle, here as the thing filled: the bottle"
  "kn-8160":
    native: "I drink milk today."
