      "ಕಾರನ್ನು": "car, here as the thing parked: the car"
      "ನಿಲ್ಲಿಸುತ್ತಾನೆ": "to stop or park something, here in the third-person masculine present"
  "kn-8155":
    native: "Tomorrow the elder brother goes to the village."
