schema: 1
id: "kn-en-grammar-can-must"
kind: "layer"
core: "kn-grammar-can-must"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Can, may and must"
license: "CC0-1.0"
description: "Ability, permission, need and duty: each is an ending on the verb, or a skill that 'comes to' you. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0571":
    native: "I can speak Kannada."
    notes:
      "n1": "A skill 'comes to' you: -ಅಲು (-alu), to, and ಬರುತ್ತದೆ (baruttade). ನಾನು ಕನ್ನಡ ಮಾತಾಡಬಲ್ಲೆ (nānu kannaḍa mātāḍaballe), with -ಬಲ್ಲೆ (-balle), is more formal."
    bases:
      "ನನಗೆ": "I"
      "ಕನ್ನಡ": "Kannada"
      "ಮಾತಾಡಲು": "to speak"
  "kn-0572":
    native: "Can you come tomorrow?"
    notes:
      "n1": "What you can manage 'becomes' for you: ಆಗು (āgu). In speech, ನಾಳೆ ಬರಕ್ಕಾಗುತ್ತಾ (nāḷe barakkāguttā)?"
    bases:
      "ಬರಲು": "to come"
      "ಆಗುತ್ತದೆಯೇ": "to become; to happen; to be possible"
  "kn-0573":
    native: "I can't come."
    bases:
      "ನನಗೆ": "I"
      "ಬರಲು": "to come"
      "ಆಗುವುದಿಲ್ಲ": "to become; to happen; to be possible"
  "kn-0574":
    native: "I can swim."
    notes:
      "n1": "'Swimming comes to me'."
    bases:
      "ನನಗೆ": "I"
      "ಈಜು": "to swim"
  "kn-0149":
    notes:
      "n1": "Can't, as a skill: 'Kannada doesn't come to me'."
  "kn-0575":
    native: "You may come in."
    notes:
      "n1": "-ಬಹುದು (-bahudu) is 'may': permission, and also 'might': ಮಳೆ ಬರಬಹುದು (maḷe barabahudu), it might rain."
    bases:
      "ಒಳಗೆ": "inside"
      "ಬರಬಹುದು": "to come"
  "kn-0576":
    native: "May I come in?"
    notes:
      "n1": "-ಬಹುದು (-bahudu) with the question -ಆ (-ā) asks permission."
  "kn-0577":
    native: "You mustn't take photos here."
    notes:
      "n1": "-ಬಾರದು (-bāradu) is 'must not'."
    bases:
      "ಫೋಟೋ": "photo"
      "ತೆಗೆಯಬಾರದು": "to take (a photo); to take out"
  "kn-0578":
    native: "You must come tomorrow."
    bases:
      "ಬರಬೇಕು": "to come"
  "kn-0579":
    native: "I don't have to go."
    bases:
      "ನಾನು": "I"
      "ಹೋಗಬೇಕಾಗಿಲ್ಲ": "to go"
