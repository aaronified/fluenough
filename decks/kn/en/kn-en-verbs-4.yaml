schema: 1
id: "kn-en-verbs-4"
kind: "layer"
core: "kn-verbs-4"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Story actions"
license: "CC-BY-SA-4.0"
description: "Verbs for telling a story: turning, pushing and throwing, spreading and putting, with a sentence for he and for they. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1635":
    native: "to turn, spin"
    notes:
      "n1": "To turn round, or to spin."
    examples:
      "ಅವನು ತಿರುಗುತ್ತಾನೆ.": { native: "He turns.", bases: { "ತಿರುಗುತ್ತಾನೆ": "turns" } }
      "ಅವರು ತಿರುಗುತ್ತಾರೆ.": { native: "They turn.", bases: { "ತಿರುಗುತ್ತಾರೆ": "turn" } }
  "kn-1636":
    native: "to roll"
    notes:
      "n1": "To roll over and over, like a ball."
    examples:
      "ಅವನು ಉರುಳುತ್ತಾನೆ.": { native: "He rolls.", bases: { "ಉರುಳುತ್ತಾನೆ": "rolls" } }
      "ಅವರು ಉರುಳುತ್ತಾರೆ.": { native: "They roll.", bases: { "ಉರುಳುತ್ತಾರೆ": "roll" } }
  "kn-1637":
    native: "to slip"
    notes:
      "n1": "To slip on a wet floor."
    examples:
      "ಅವನು ಜಾರುತ್ತಾನೆ.": { native: "He slips.", bases: { "ಜಾರುತ್ತಾನೆ": "slips" } }
      "ಅವರು ಜಾರುತ್ತಾರೆ.": { native: "They slip.", bases: { "ಜಾರುತ್ತಾರೆ": "slip" } }
  "kn-1638":
    native: "to push"
    notes:
      "n1": "To push a thing away. The opposite is ಎಳೆ (eḷe), to pull."
    examples:
      "ಅವನು ತಳ್ಳುತ್ತಾನೆ.": { native: "He pushes.", bases: { "ತಳ್ಳುತ್ತಾನೆ": "pushes" } }
      "ಅವರು ತಳ್ಳುತ್ತಾರೆ.": { native: "They push.", bases: { "ತಳ್ಳುತ್ತಾರೆ": "push" } }
  "kn-1639":
    native: "to hit, strike"
    notes:
      "n1": "To hit with a hand or a stick."
    examples:
      "ಅವನು ಹೊಡೆಯುತ್ತಾನೆ.": { native: "He hits.", bases: { "ಹೊಡೆಯುತ್ತಾನೆ": "hits" } }
      "ಅವರು ಹೊಡೆಯುತ್ತಾರೆ.": { native: "They hit.", bases: { "ಹೊಡೆಯುತ್ತಾರೆ": "hit" } }
  "kn-1640":
    native: "to kick"
    notes:
      "n1": "To kick with the foot."
    examples:
      "ಅವನು ಒದೆಯುತ್ತಾನೆ.": { native: "He kicks.", bases: { "ಒದೆಯುತ್ತಾನೆ": "kicks" } }
      "ಅವರು ಒದೆಯುತ್ತಾರೆ.": { native: "They kick.", bases: { "ಒದೆಯುತ್ತಾರೆ": "kick" } }
  "kn-1641":
    native: "to throw"
    notes:
      "n1": "To throw a thing away or across the air."
    examples:
      "ಅವನು ಎಸೆಯುತ್ತಾನೆ.": { native: "He throws.", bases: { "ಎಸೆಯುತ್ತಾನೆ": "throws" } }
      "ಅವರು ಎಸೆಯುತ್ತಾರೆ.": { native: "They throw.", bases: { "ಎಸೆಯುತ್ತಾರೆ": "throw" } }
  "kn-1642":
    native: "to go round, wrap"
    notes:
      "n1": "To go round a place, or to wrap a cloth round."
    examples:
      "ಅವನು ಸುತ್ತುತ್ತಾನೆ.": { native: "He goes round.", bases: { "ಸುತ್ತುತ್ತಾನೆ": "goes round" } }
      "ಅವರು ಸುತ್ತುತ್ತಾರೆ.": { native: "They go round.", bases: { "ಸುತ್ತುತ್ತಾರೆ": "go round" } }
  "kn-1643":
    native: "to spread"
    notes:
      "n1": "To spread out, or to spread news."
    examples:
      "ಅವನು ಹರಡುತ್ತಾನೆ.": { native: "He spreads.", bases: { "ಹರಡುತ್ತಾನೆ": "spreads" } }
      "ಅವರು ಹರಡುತ್ತಾರೆ.": { native: "They spread.", bases: { "ಹರಡುತ್ತಾರೆ": "spread" } }
  "kn-1644":
    native: "to draw, smoke"
    notes:
      "n1": "To draw water from a well, or to smoke."
    examples:
      "ಅವನು ಸೇದುತ್ತಾನೆ.": { native: "He draws.", bases: { "ಸೇದುತ್ತಾನೆ": "draws" } }
      "ಅವರು ಸೇದುತ್ತಾರೆ.": { native: "They draw.", bases: { "ಸೇದುತ್ತಾರೆ": "draw" } }
  "kn-1645":
    native: "to plough"
    notes:
      "n1": "To plough the land before sowing."
    examples:
      "ಅವನು ಉಳುತ್ತಾನೆ.": { native: "He ploughs.", bases: { "ಉಳುತ್ತಾನೆ": "ploughs" } }
      "ಅವರು ಉಳುತ್ತಾರೆ.": { native: "They plough.", bases: { "ಉಳುತ್ತಾರೆ": "plough" } }
  "kn-1646":
    native: "to see, appear"
    notes:
      "n1": "To see, or to appear to view."
    examples:
      "ಅವನು ಕಾಣುತ್ತಾನೆ.": { native: "He sees.", bases: { "ಕಾಣುತ್ತಾನೆ": "sees" } }
      "ಅವರು ಕಾಣುತ್ತಾರೆ.": { native: "They see.", bases: { "ಕಾಣುತ್ತಾರೆ": "see" } }
  "kn-1647":
    native: "to bloom, open"
    notes:
      "n1": "To bloom, said of a flower."
    examples:
      "ಅವನು ಅರಳುತ್ತಾನೆ.": { native: "He blooms.", bases: { "ಅರಳುತ್ತಾನೆ": "blooms" } }
      "ಅವರು ಅರಳುತ್ತಾರೆ.": { native: "They bloom.", bases: { "ಅರಳುತ್ತಾರೆ": "bloom" } }
  "kn-1648":
    native: "to beat"
    notes:
      "n1": "To beat a drum or a person."
    examples:
      "ಅವನು ಬಡಿಯುತ್ತಾನೆ.": { native: "He beats.", bases: { "ಬಡಿಯುತ್ತಾನೆ": "beats" } }
      "ಅವರು ಬಡಿಯುತ್ತಾರೆ.": { native: "They beat.", bases: { "ಬಡಿಯುತ್ತಾರೆ": "beat" } }
  "kn-1649":
    native: "to spread out"
    notes:
      "n1": "To spread out a mat or a sheet on the floor."
    examples:
      "ಅವನು ಹಾಸುತ್ತಾನೆ.": { native: "He spreads out.", bases: { "ಹಾಸುತ್ತಾನೆ": "spreads out" } }
      "ಅವರು ಹಾಸುತ್ತಾರೆ.": { native: "They spread out.", bases: { "ಹಾಸುತ್ತಾರೆ": "spread out" } }
  "kn-1650":
    native: "to put, place"
    notes:
      "n1": "To put a thing in its place."
    examples:
      "ಅವನು ಇಡುತ್ತಾನೆ.": { native: "He puts.", bases: { "ಇಡುತ್ತಾನೆ": "puts" } }
      "ಅವರು ಇಡುತ್ತಾರೆ.": { native: "They put.", bases: { "ಇಡುತ್ತಾರೆ": "put" } }
  "kn-1651":
    native: "to stop, prevent"
    notes:
      "n1": "To stop a thing from happening, or to hold back."
    examples:
      "ಅವನು ತಡೆಯುತ್ತಾನೆ.": { native: "He stops.", bases: { "ತಡೆಯುತ್ತಾನೆ": "stops" } }
      "ಅವರು ತಡೆಯುತ್ತಾರೆ.": { native: "They stop.", bases: { "ತಡೆಯುತ್ತಾರೆ": "stop" } }
  "kn-1652":
    native: "to serve food"
    notes:
      "n1": "To serve food at a meal."
    examples:
      "ಅವನು ಬಡಿಸುತ್ತಾನೆ.": { native: "He serves.", bases: { "ಬಡಿಸುತ್ತಾನೆ": "serves" } }
      "ಅವರು ಬಡಿಸುತ್ತಾರೆ.": { native: "They serve.", bases: { "ಬಡಿಸುತ್ತಾರೆ": "serve" } }
  "kn-1653":
    native: "to dance"
    notes:
      "n1": "To dance, with the body."
    examples:
      "ಅವನು ಕುಣಿಯುತ್ತಾನೆ.": { native: "He dances.", bases: { "ಕುಣಿಯುತ್ತಾನೆ": "dances" } }
      "ಅವರು ಕುಣಿಯುತ್ತಾರೆ.": { native: "They dance.", bases: { "ಕುಣಿಯುತ್ತಾರೆ": "dance" } }
  "kn-1654":
    native: "to tremble, shiver"
    notes:
      "n1": "To shake with cold or fear."
    examples:
      "ಅವನು ನಡುಗುತ್ತಾನೆ.": { native: "He trembles.", bases: { "ನಡುಗುತ್ತಾನೆ": "trembles" } }
      "ಅವರು ನಡುಗುತ್ತಾರೆ.": { native: "They tremble.", bases: { "ನಡುಗುತ್ತಾರೆ": "tremble" } }
  "kn-1655":
    native: "to move aside"
    notes:
      "n1": "To move a thing to one side."
    examples:
      "ಅವನು ಸರಿಸುತ್ತಾನೆ.": { native: "He moves aside.", bases: { "ಸರಿಸುತ್ತಾನೆ": "moves aside" } }
      "ಅವರು ಸರಿಸುತ್ತಾರೆ.": { native: "They move aside.", bases: { "ಸರಿಸುತ್ತಾರೆ": "move aside" } }
