schema: 1
id: "kn-en-eating-out"
kind: "layer"
core: "kn-eating-out"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Eating out"
license: "CC-BY-SA-4.0"
description: "Ordering, asking for less spice, and paying the bill. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0491":
    native: "meal; food"
    notes:
      "n1": "ಊಟ ಆಯ್ತಾ? (uta ayta?), have you eaten?, is how people ask after you."
    "examples": {
      "ಊಟಕ್ಕೆ ಮುಂಚೆ": {"native": "before the meal", "bases": {"ಮುಂಚೆ": "before", "ಊಟಕ್ಕೆ": "meal; food"}},
      "ಊಟದ ನಂತರ": {"native": "after the meal", "bases": {"ನಂತರ": "after", "ಊಟದ": "meal; food"}}
    }
  "kn-0492":
    native: "water"
    "examples": {
      "ನೀರು ಇಲ್ಲ.": {"native": "There's no water.", "bases": {}},
      "ನೀರು ಉಳಿಸು.": {"native": "Save water.", "bases": {}}
    }
  "kn-0493":
    native: "tea"
    notes:
      "n1": "Also ಚಹಾ (cahā)."
  "kn-0494":
    native: "coffee"
    notes:
      "n1": "Karnataka grows most of India's coffee, and filter coffee is the drink of the morning."
    "examples": {
      "ಕಾಫಿ ಕುಡಿಯುತ್ತೀರಾ?": {"native": "Will you have coffee?", "bases": {"ಕುಡಿಯುತ್ತೀರಾ": "to drink"}},
      "ಒಂದು ಕಾಫಿ ಕೊಡಿ.": {"native": "One coffee, please.", "bases": {}}
    }
  "kn-0062":
    native: "cooked rice; a meal of rice"
  "kn-0495":
    native: "dosa"
    notes:
      "n1": "ಮಸಾಲೆ ದೋಸೆ (masāle dōse), a dosa with spiced potato inside, is said to come from Udupi."
    "examples": {
      "ತವದಲ್ಲಿ ದೋಸೆ ಹುರಿ.": {"native": "Fry the dosa on the griddle.", "bases": {"ತವದಲ್ಲಿ": "on the griddle"}},
      "ದೋಸೆಗೆ ಬೆಣ್ಣೆ ಹಾಕು.": {"native": "Put butter on the dosa.", "bases": {"ದೋಸೆಗೆ": "on the dosa", "ಹಾಕು": "to put"}}
    }
  "kn-0496":
    native: "I'd like …; I need …"
    notes:
      "n1": "'To me … is wanted': ನನಗೆ ಒಂದು ಕಾಫಿ ಬೇಕು (nanage ondu kāfi bēku), I'd like a coffee."
    bases:
      "ನನಗೆ": "I"
  "kn-0497":
    native: "a little more"
    notes:
      "n1": "ಇನ್ನೂ (innū) is 'more, still'."
    bases:
      "ಇನ್ನೂ": "still; more"
  "kn-0498":
    native: "spicy heat; a spicy snack"
    notes:
      "n1": "ಖಾರ ಕಡಿಮೆ (khāra kaḍime), less spicy."
    "examples": {
      "ಖಾರ ಕಡಿಮೆ ಮಾಡಿ.": {"native": "Not too spicy, please.", "bases": {"ಕಡಿಮೆ": "less", "ಮಾಡಿ": "to do; to make"}},
      "ಚಟ್ನಿ ಖಾರ ಇದೆ.": {"native": "The chutney is spicy.", "bases": {"ಖಾರ": "spicy", "ಇದೆ": "to be"}}
    }
  "kn-0499":
    native: "Not too spicy, please."
    bases:
      "ಕಡಿಮೆ": "less"
      "ಮಾಡಿ": "to do; to make"
  "kn-0500":
    native: "sweet"
    notes:
      "n1": "A sweet is ಸಿಹಿ ತಿಂಡಿ (sihi tiṇḍi)."
    "examples": {
      "ಪಾಯಸ ಸಿಹಿ.": {"native": "Payasa is sweet.", "bases": {"ಸಿಹಿ": "sweet"}},
      "ಬೆಲ್ಲ ಸಿಹಿ.": {"native": "Jaggery is sweet.", "bases": {}}
    }
  "kn-0501":
    native: "vegetarian food"
    notes:
      "n1": "On menus also ವೆಜ್ (vej). Meat is ಮಾಂಸಾಹಾರ (māmsāhāra), or ನಾನ್ ವೆಜ್ (nān vej)."
  "kn-0502":
    native: "The bill, please."
    bases:
      "ಬಿಲ್": "bill"
  "kn-0503":
    native: "It's very good."
    notes:
      "n1": "For food also ತುಂಬಾ ರುಚಿಯಾಗಿದೆ (tumbā ruciyāgide), it's very tasty."
    bases:
      "ತುಂಬಾ": "very; a lot"
      "ಚೆನ್ನಾಗಿದೆ": "well; good"
