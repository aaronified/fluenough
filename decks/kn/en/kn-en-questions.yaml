schema: 1
id: "kn-en-questions"
kind: "layer"
core: "kn-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Yes, no and questions"
license: "CC0-1.0"
description: "Yes and no, the question words, and how a sentence becomes a question. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0164":
    native: "yes; that's right"
    notes:
      "n1": "Often with a nod or a sideways tilt of the head, which also means yes."
  "kn-0165":
    native: "no; there isn't"
    notes:
      "n1": "The everyday 'no': ಕಾಫಿ ಇದೆಯಾ (kāfi ideyā)? ಇಲ್ಲ (illa). Is there coffee? No."
  "kn-0166":
    native: "no; it is not"
    notes:
      "n1": "'No, it isn't that': ಇದು ನಿಮ್ಮ ಪುಸ್ತಕವಾ (idu nimma pustakavā)? ಅಲ್ಲ (alla). Is this your book? No."
  "kn-0167":
    native: "what"
    notes:
      "n1": "ಇದು ಏನು (idu ēnu)? What is this? In speech often ಏನ್ (ēn)."
  "kn-0168":
    native: "who"
  "kn-0169":
    native: "where"
    notes:
      "n1": "With -ಗೆ (-ge), to: ಎಲ್ಲಿಗೆ? (ellige?), where to?"
  "kn-0170":
    native: "when"
  "kn-0171":
    native: "why"
    notes:
      "n1": "Written also ಏಕೆ (ēke)."
  "kn-0172":
    native: "how"
  "kn-0173":
    native: "how much; how many"
  "kn-0174":
    native: "which one"
    notes:
      "n1": "Before a noun, ಯಾವ (yāva): ಯಾವ ಬಸ್ಸು (yāva bassu)? Which bus?"
  "kn-0175":
    native: "Really?"
    notes:
      "n1": "ಹೌದು (haudu) with the question ending -ಆ (-ā)."
