schema: 1
id: "kn-en-questions"
kind: "layer"
core: "kn-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Yes, no and questions"
license: "CC-BY-SA-4.0"
description: "Yes and no, the question words, and how a sentence becomes a question. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0166":
    native: "no; it is not"
    notes:
      "n1": "'No, it isn't that': ಇದು ನಿಮ್ಮ ಪುಸ್ತಕವಾ (idu nimma pustakavā)? ಅಲ್ಲ (alla). Is this your book? No."
    "examples": {
      "ಹಾಗೆ ಅಲ್ಲ.": {"native": "Not like that.", "bases": {"ಹಾಗೆ": "like that", "ಅಲ್ಲ": "not"}},
      "ಇದು ನೀರು ಅಲ್ಲ.": {"native": "This isn't water.", "bases": {"ಇದು": "this"}}
    }
  "kn-0167":
    native: "what"
    notes:
      "n1": "ಇದು ಏನು (idu ēnu)? What is this? In speech often ಏನ್ (ēn)."
    "examples": {
      "ಇದು ಏನು?": {"native": "What is this?", "bases": {"ಇದು": "this"}},
      "ಉದ್ದೇಶ ಏನು?": {"native": "What is the purpose?", "bases": {}}
    }
  "kn-0168":
    native: "who"
  "kn-0169":
    native: "where"
    notes:
      "n1": "With -ಗೆ (-ge), to: ಎಲ್ಲಿಗೆ? (ellige?), where to?"
    "examples": {
      "ಎಟಿಎಂ ಎಲ್ಲಿ?": {"native": "Where is the ATM?", "bases": {}},
      "ಕಡತ ಎಲ್ಲಿ?": {"native": "Where is the file?", "bases": {}}
    }
  "kn-0170":
    native: "when"
    "examples": {
      "ಕೇಸ್ ಯಾವಾಗ?": {"native": "When is the case?", "bases": {}},
      "ಚುನಾವಣೆ ಯಾವಾಗ?": {"native": "When is the election?", "bases": {}}
    }
  "kn-0171":
    native: "why"
    notes:
      "n1": "Written also ಏಕೆ (ēke)."
    "examples": {
      "ಅವಳು ಯಾಕೆ ಅಳುತ್ತಾಳೆ?": {"native": "Why does she cry?", "bases": {"ಯಾಕೆ": "why", "ಅಳುತ್ತಾಳೆ": "to cry", "ಅವಳು": "she"}},
      "ನೀವು ಕನ್ನಡ ಯಾಕೆ ಕಲಿಯುತ್ತಿದ್ದೀರಿ?": {"native": "Why are you learning Kannada?", "bases": {"ಕನ್ನಡ": "Kannada", "ಕಲಿಯುತ್ತಿದ್ದೀರಿ": "to learn"}}
    }
  "kn-0172":
    native: "how"
  "kn-0173":
    native: "how much; how many"
    "examples": {
      "ಅಳತೆ ಎಷ್ಟು?": {"native": "What size is it?", "bases": {}},
      "ಆದಾಯ ಎಷ್ಟು?": {"native": "What is the income?", "bases": {}}
    }
  "kn-0174":
    native: "which one"
    notes:
      "n1": "Before a noun, ಯಾವ (yāva): ಯಾವ ಬಸ್ಸು (yāva bassu)? Which bus?"
  "kn-0175":
    native: "Really?"
    notes:
      "n1": "ಹೌದು (haudu) with the question ending -ಆ (-ā)."
