cards:
  "kn-7767":
    notes:
      "n1": "ಮನೆಗೆ (manege), to the house or home: the ending ಗೆ (ge) means to."
    native: "I am going home tomorrow."
  "kn-7768":
    notes:
      "n1": "ನೀವು (nīvu) takes a verb ending in ಈರಿ (īri), as in ಮಾಡುತ್ತೀರಿ (māḍuttīri); the informal ನೀನು (nīnu) takes ಈಯ (īya)."
    native: "What are you doing today?"
  "kn-7769":
    notes:
      "n1": "ಬೆಳಿಗ್ಗೆ (beḷigge) takes no ending for in the morning."
    native: "In the morning I drink something."
  "kn-7770":
    notes:
      "n1": "ರಾತ್ರಿ (rātri) takes no ending for at night."
    native: "At night she studies."
  "kn-7771":
    notes:
      "n1": "The past of ಹೋಗು (hōgu), to go, is built on ಹೋದ (hōda): ಹೋದೆ (hōde), I went."
    native: "I went home yesterday."
  "kn-7772":
    native: "Where are you going in the evening?"
  "kn-7773":
    notes:
      "n1": "ಸೋಮವಾರ (sōmavāra) takes no ending for on Monday."
    native: "I study on Monday."
  "kn-7774":
    notes:
      "n1": "The one being told takes the ending ಗೆ (ge), as in ನನಗೆ (nanage), to me."
    native: "Now he tells me."
  "kn-7775":
    notes:
      "n1": "ಪ್ರತಿ (prati), every, comes before the noun: ಪ್ರತಿ ದಿನ (prati dina), every day."
    native: "I study every day."
