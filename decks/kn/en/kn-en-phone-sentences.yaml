schema: 1
id: "kn-en-phone-sentences"
kind: "layer"
core: "kn-phone-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phone: sentences"
description: "Sentences about using a phone: the battery, turning it on and off, sending a message and asking for the number or the password. They use the words of the phone unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8221":
    notes:
      "n1": "ಇದೆ (ide), there is, is the verb for a thing; ಕಡಿಮೆ (kaḍime), low, comes before it."
    native: "The battery is low."
    bases:
      "ಇದೆ": "to be or exist, here for a thing"
  "kn-8222":
    notes:
      "n1": "ಆನ್ (ān), on, is an English word; with ಮಾಡು (māḍu), do, it makes 'turn on': ಆನ್ ಮಾಡು (ān māḍu)."
    native: "Turn it on."
  "kn-8223":
    notes:
      "n1": "ಆಫ್ (āph), off, is an English word; with ಮಾಡು (māḍu), do, it makes 'turn off': ಆಫ್ ಮಾಡು (āph māḍu)."
    native: "Turn it off."
  "kn-8224":
    notes:
      "n1": "The question word ಏನು (ēnu), what, follows the noun, with no word for 'is': ಸಂಖ್ಯೆ (saṅkhye) ಏನು (ēnu)? asks what the number is."
    native: "What is the number?"
  "kn-8225":
    notes:
      "n1": "ಕಳುಹಿಸು (kaḷuhisu), send, is the plain command, ending in -ು (-u); the polite command ends in -ಿ (-i)."
    native: "Send a message."
  "kn-8226":
    notes:
      "n1": "The question word ಏನು (ēnu), what, follows the noun, with no word for 'is': ಪಾಸ್ವರ್ಡ್ (pāsvarḍ) ಏನು (ēnu)? asks what the password is."
    native: "What is the password?"
  "kn-8227":
    notes:
      "n1": "ಇದ್ದೇನೆ (iddēne), I am, is ಇರು (iru), be, with the ending -ೇನೆ (-ēne) for 'I'; for things the verb is ಇದೆ (ide)."
    native: "I am busy."
    bases:
      "ಇದ್ದೇನೆ": "to be, here for the first person"
  "kn-8228":
    notes:
      "n1": "ಇಲ್ಲ (illa), there is not, is the negative of ಇದೆ (ide), there is, for things."
    native: "There is no network."
  "kn-8229":
    notes:
      "n1": "The question word ಎಲ್ಲಿ (elli), where, follows the noun, with no word for 'is': ಚಾರ್ಜರ್ (cārjar) ಎಲ್ಲಿ (elli)? asks where the charger is."
    native: "Where is the charger?"
  "kn-8230":
    notes:
      "n1": "ಪರದೆಯನ್ನು (paradeyannu), the screen, takes the object ending -ಯನ್ನು (-yannu); ನೋಡು (nōḍu), look, is the plain command, ending in -ು (-u)."
    native: "Look at the screen."
    bases:
      "ಪರದೆಯನ್ನು": "screen, here as the thing looked at: the screen"
