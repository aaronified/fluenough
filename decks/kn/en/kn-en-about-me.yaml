schema: 1
id: "kn-en-about-me"
kind: "layer"
core: "kn-about-me"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "About me"
license: "CC-BY-SA-4.0"
description: "Your name, where you are from, where you live, and the people around you. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0196":
    native: "name"
    "examples": {
      "ನನ್ನ ಹೆಸರು ರವಿ.": {"native": "My name is Ravi.", "bases": {"ಹೆಸರು": "name", "ರವಿ": "Ravi"}}
    }
  "kn-0199":
    native: "I'm from England."
    notes:
      "n1": "Literally 'I have come from England'. -ಇಂದ (-inda) is 'from'. ಬರು (baru) changes its stem in the past: ಬಂದ- (banda-)."
    bases:
      "ನಾನು": "I"
      "ಇಂಗ್ಲೆಂಡಿನಿಂದ": "England"
      "ಬಂದಿದ್ದೇನೆ": "to come"
  "kn-0200":
    native: "I live in Bengaluru."
    notes:
      "n1": "ಇರು (iru) is both 'to be' and 'to live, to stay'. In speech, ಬೆಂಗಳೂರಲ್ಲಿ ಇದ್ದೀನಿ (beṅgaḷūralli iddīni). ಇರು (iru) changes its stem: ಇದ್ದ- (idda-)."
    bases:
      "ನಾನು": "I"
      "ಬೆಂಗಳೂರಿನಲ್ಲಿ": "Bengaluru"
      "ಇದ್ದೇನೆ": "to be; to have; to live"
  "kn-0201":
    native: "home; house"
    notes:
      "n1": "ಮನೆಗೆ (manege), home, to the house; ಮನೆಯಲ್ಲಿ (maneyalli), at home."
    "examples": {
      "ಇಕ್ಕಟ್ಟು ಮನೆ.": {"native": "A cramped house.", "bases": {}},
      "ಮನೆ ಶಾಂತ.": {"native": "The house is quiet.", "bases": {}}
    }
  "kn-0202":
    native: "family"
    notes:
      "n1": "Also ಮನೆಯವರು (maneyavaru), 'the people of the house'."
  "kn-0203":
    native: "work; a job"
    "examples": {
      "ಉತ್ತಮ ಕೆಲಸ.": {"native": "Excellent work.", "bases": {}},
      "ಕೆಲಸ ಆಯಿತು.": {"native": "The work is done.", "bases": {"ಕೆಲಸ": "work", "ಆಯಿತು": "done"}}
    }
  "kn-0204":
    native: "town; home town"
    notes:
      "n1": "ನಿಮ್ಮ ಊರು ಯಾವುದು? (nimma uru yavudu?), where are you from? Asked of almost everyone."
    "examples": {
      "ಅವರು ಊರು ತಲುಪಿದರು.": {"native": "They reached the town.", "bases": {"ತಲುಪಿದರು": "reached"}},
      "ಈ ಊರು ಪ್ರೇಕ್ಷಣೀಯ.": {"native": "This town is scenic.", "bases": {}}
    }
  "kn-0205":
    native: "country"
    "examples": {
      "ದೇಶಕ್ಕೆ ಸ್ವಾತಂತ್ರ್ಯ ಸಿಕ್ಕಿತು.": {"native": "The country got independence.", "bases": {"ಸಿಕ್ಕಿತು": "got", "ದೇಶಕ್ಕೆ": "country"}},
      "ಪ್ರಪಂಚದಲ್ಲಿ ಎಷ್ಟು ದೇಶ?": {"native": "How many countries are there in the world?", "bases": {"ಪ್ರಪಂಚದಲ್ಲಿ": "in the world"}}
    }
  "kn-0206":
    native: "language"
    notes:
      "n1": "ಕನ್ನಡ ಭಾಷೆ (kannaḍa bhāṣe), the Kannada language."
    "examples": {
      "ಭಾರತದಲ್ಲಿ ಹಲವು ಭಾಷೆ ಇದೆ.": {"native": "There are many languages in India.", "bases": {"ಭಾರತದಲ್ಲಿ": "in India", "ಇದೆ": "there are"}}
    }
