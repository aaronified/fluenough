cards:
  "kn-7418":
    notes:
      "n1": "ನನ್ನ (nanna), my, goes before the noun and does not change."
    native: "This is my book."
  "kn-7419":
    native: "Where is my pen?"
  "kn-7420":
    notes:
      "n1": "Things take ಇದೆ (ide) for 'is here' or 'is there'; people take a different verb."
    native: "The clock is here."
    bases:
      "ಇದೆ": "is"
  "kn-7421":
    notes:
      "n1": "ನನಗೆ (nanage) with ಬೇಕು (bēku) means 'I need', with the thing needed as the subject."
    native: "I need a key."
    bases:
      "ನನಗೆ": "to me"
      "ಬೇಕು": "needed"
  "kn-7422":
    native: "This is my phone."
  "kn-7423":
    native: "Where is the mirror?"
  "kn-7424":
    notes:
      "n1": "ಹಾಸಿಗೆಯಲ್ಲಿ (hāsigeyalli) is 'on the bed': -ಅಲ್ಲಿ (-alli) joins to ಹಾಸಿಗೆ (hāsige) with a y."
    native: "The pillow is on the bed."
    bases:
      "ಹಾಸಿಗೆಯಲ್ಲಿ": "on the bed"
      "ಇದೆ": "is"
  "kn-7425":
    native: "There is paper."
    bases:
      "ಇದೆ": "is there"
  "kn-7426":
    native: "Where are the scissors?"
