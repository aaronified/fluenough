schema: 1
id: "kn-en-geography"
kind: "layer"
core: "kn-geography"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Geography: the world, maps and places"
license: "CC-BY-SA-4.0"
description: "The world and its places: countries and states, cities and villages, maps, directions and borders. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1280":
    native: "geography"
    notes:
      "n1": "Geography, the study of the land, the seas and the places."
    examples:
      "ಭೂಗೋಳ ಇಷ್ಟ.": "I like geography."
      "ಭೂಗೋಳ ಪುಸ್ತಕ ಓದು.": "Read the geography book."
  "kn-1281":
    native: "map"
    notes:
      "n1": "A map, which shows the places and the roads."
    examples:
      "ನಕ್ಷೆ ಎಲ್ಲಿ?": "Where is the map?"
      "ನಕ್ಷೆಯಲ್ಲಿ ನದಿ ಇದೆ.": { native: "There is a river on the map.", bases: { "ನಕ್ಷೆಯಲ್ಲಿ": "on the map", "ಇದೆ": "there is" } }
  "kn-1282":
    native: "world"
    notes:
      "n1": "The whole world, all the countries of the earth."
    examples:
      "ಪ್ರಪಂಚ ದೊಡ್ಡದು.": "The world is big."
      "ಪ್ರಪಂಚದಲ್ಲಿ ಎಷ್ಟು ದೇಶ?": { native: "How many countries are there in the world?", bases: { "ಪ್ರಪಂಚದಲ್ಲಿ": "in the world" } }
  "kn-1283":
    native: "India"
    notes:
      "n1": "India, the country where Kannada is spoken."
    examples:
      "ಭಾರತದಲ್ಲಿ ಹಲವು ಭಾಷೆ ಇದೆ.": { native: "There are many languages in India.", bases: { "ಭಾರತದಲ್ಲಿ": "in India", "ಇದೆ": "there are" } }
      "ಭಾರತ ಸುಂದರ.": "India is beautiful."
  "kn-1284":
    native: "state"
    notes:
      "n1": "A state, one part of a country such as India."
    examples:
      "ಭಾರತದಲ್ಲಿ ಹಲವು ರಾಜ್ಯ ಇದೆ.": { native: "There are many states in India.", bases: { "ಭಾರತದಲ್ಲಿ": "in India", "ಇದೆ": "there are" } }
      "ರಾಜ್ಯದಲ್ಲಿ ನದಿ ಇದೆ.": { native: "There are rivers in the state.", bases: { "ರಾಜ್ಯದಲ್ಲಿ": "in the state", "ಇದೆ": "there are" } }
  "kn-1285":
    native: "district"
    notes:
      "n1": "A district, a part of a state."
    examples:
      "ಈ ಜಿಲ್ಲೆ ದೊಡ್ಡದು.": "This district is big."
      "ಜಿಲ್ಲೆಯ ನಕ್ಷೆ ಎಲ್ಲಿ?": { native: "Where is the district map?", bases: { "ಜಿಲ್ಲೆಯ": "of the district" } }
  "kn-1286":
    native: "village"
    notes:
      "n1": "A village, a small place in the country."
    examples:
      "ಗ್ರಾಮ ಶಾಂತ.": "The village is quiet."
      "ಗ್ರಾಮದಲ್ಲಿ ಮನೆ ಇದೆ.": { native: "There is a house in the village.", bases: { "ಗ್ರಾಮದಲ್ಲಿ": "in the village", "ಇದೆ": "there is" } }
  "kn-1287":
    native: "capital"
    notes:
      "n1": "The capital city, where the government sits."
    examples:
      "ರಾಜಧಾನಿ ಎಲ್ಲಿ?": "Where is the capital?"
      "ರಾಜಧಾನಿ ದೊಡ್ಡದು.": "The capital is big."
  "kn-1288":
    native: "population"
    notes:
      "n1": "The population, the number of people who live in a place."
    examples:
      "ಜನಸಂಖ್ಯೆ ಎಷ್ಟು?": "What is the population?"
      "ನಗರದ ಜನಸಂಖ್ಯೆ ದೊಡ್ಡದು.": "The population of the city is big."
  "kn-1289":
    native: "border"
    notes:
      "n1": "The border between two countries or states."
    examples:
      "ಗಡಿ ಹತ್ತಿರ ಇದೆ.": { native: "The border is near.", bases: { "ಇದೆ": "is" } }
      "ಗಡಿಯಲ್ಲಿ ಮರ ಇದೆ.": { native: "There is a tree at the border.", bases: { "ಗಡಿಯಲ್ಲಿ": "at the border", "ಇದೆ": "there is" } }
  "kn-1290":
    native: "area, region"
    notes:
      "n1": "An area or a region of land."
    examples:
      "ಈ ಪ್ರದೇಶ ಸುಂದರ.": "This area is beautiful."
      "ಪ್ರದೇಶದಲ್ಲಿ ಮಳೆ ಬರುತ್ತದೆ.": { native: "Rain comes in the area.", bases: { "ಪ್ರದೇಶದಲ್ಲಿ": "in the area" } }
  "kn-1291":
    native: "land, earth"
    notes:
      "n1": "The land, or the earth on which we live."
    examples:
      "ಭೂಮಿ ಒಣ ಆಗಿದೆ.": { native: "The land has become dry.", bases: { "ಆಗಿದೆ": "has become" } }
      "ಭೂಮಿ ಮೇಲೆ ಜನ ಇದ್ದಾರೆ.": { native: "There are people on the earth.", bases: { "ಇದ್ದಾರೆ": "there are" } }
  "kn-1292":
    native: "ocean"
    notes:
      "n1": "The ocean, a very large sea."
    examples:
      "ಸಾಗರ ದೊಡ್ಡದು.": "The ocean is big."
      "ಸಾಗರದಲ್ಲಿ ಮೀನು ಇದೆ.": { native: "There are fish in the ocean.", bases: { "ಸಾಗರದಲ್ಲಿ": "in the ocean", "ಇದೆ": "there are" } }
  "kn-1293":
    native: "east"
    notes:
      "n1": "East, the direction where the sun rises."
    examples:
      "ಸೂರ್ಯ ಪೂರ್ವದಲ್ಲಿ ಉದಯಿಸುತ್ತಾನೆ.": { native: "The sun rises in the east.", bases: { "ಪೂರ್ವದಲ್ಲಿ": "in the east", "ಉದಯಿಸುತ್ತಾನೆ": "rises" } }
      "ಪೂರ್ವ ದಿಕ್ಕು.": "The east direction."
  "kn-1294":
    native: "west"
    notes:
      "n1": "West, the direction where the sun sets."
    examples:
      "ಪಶ್ಚಿಮದಲ್ಲಿ ಸೂರ್ಯ ಮುಳುಗುತ್ತಾನೆ.": { native: "The sun sets in the west.", bases: { "ಪಶ್ಚಿಮದಲ್ಲಿ": "in the west", "ಮುಳುಗುತ್ತಾನೆ": "sets" } }
      "ಪಶ್ಚಿಮ ದಿಕ್ಕು.": "The west direction."
  "kn-1295":
    native: "south"
    notes:
      "n1": "South, the direction on your right when you face the sun in the east."
    examples:
      "ದಕ್ಷಿಣಕ್ಕೆ ಹೋಗು.": { native: "Go south.", bases: { "ದಕ್ಷಿಣಕ್ಕೆ": "to the south" } }
      "ದಕ್ಷಿಣ ಭಾರತ ಬಿಸಿ.": "South India is hot."
  "kn-1296":
    native: "direction"
    notes:
      "n1": "A direction, such as north or south."
    examples:
      "ಯಾವ ದಿಕ್ಕು?": "Which direction?"
      "ಈ ದಿಕ್ಕಿನಲ್ಲಿ ನದಿ ಇದೆ.": { native: "There is a river in this direction.", bases: { "ದಿಕ್ಕಿನಲ್ಲಿ": "in this direction", "ಇದೆ": "there is" } }
  "kn-1297":
    native: "middle, centre"
    notes:
      "n1": "The middle or the centre of a place."
    examples:
      "ಊರಿನ ಮಧ್ಯ ಇದೆ.": { native: "It is in the middle of the town.", bases: { "ಇದೆ": "is" } }
      "ಮಧ್ಯದಲ್ಲಿ ಮರ ಇದೆ.": { native: "There is a tree in the middle.", bases: { "ಮಧ್ಯದಲ್ಲಿ": "in the middle", "ಇದೆ": "there is" } }
