schema: 1
id: "kn-en-grammar-questions"
kind: "layer"
core: "kn-grammar-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Basic questions"
license: "CC0-1.0"
description: "Yes/no questions with -ಆ (-ā), and question words. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0176":
    native: "Do you speak Kannada?"
    notes:
      "n1": "The -ಆ (-ā) at the end makes the question."
  "kn-0177":
    native: "Will you have coffee?"
    notes:
      "n1": "No need for ನೀವು (nīvu): the ending says it."
  "kn-0178":
    native: "What is this?"
    notes:
      "n1": "The question word stands where the answer would: ಇದು ಪುಸ್ತಕ (idu pustaka), this is a book."
  "kn-0179":
    native: "Where are you going?"
    notes:
      "n1": "ಎಲ್ಲಿಗೆ (ellige), where to: ಎಲ್ಲಿ (elli) + -ಗೆ (-ge)."
  "kn-0180":
    native: "Who is he? Who is she? (respectful)"
  "kn-0181":
    native: "When will you come?"
  "kn-0182":
    native: "Why are you learning Kannada?"
    notes:
      "n1": "The question word goes just before the verb."
  "kn-0183":
    native: "How many children do you have?"
    notes:
      "n1": "'To you how many children?'"
  "kn-0184":
    native: "How is it?"
    notes:
      "n1": "ಹೇಗೆ (how) + ಇದೆ (is)."
  "kn-0185":
    native: "It's good, isn't it?"
    notes:
      "n1": "ಅಲ್ವಾ (alvā), 'isn't it?', asks for agreement. Written ಅಲ್ಲವೇ (allavē)."
