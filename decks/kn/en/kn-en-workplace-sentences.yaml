schema: 1
id: "kn-en-workplace-sentences"
kind: "layer"
core: "kn-workplace-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The workplace: sentences"
description: "Sentences at work: a meeting, a colleague, a report and an email, and who is the manager. They use the words of the workplace unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8231":
    notes:
      "n1": "ಇದೆ (ide), there is, is used for things and places; for people Kannada uses ಇದ್ದಾರೆ (iddāre)."
    native: "There is a meeting today."
    bases:
      "ಇದೆ": "to be or exist, here for a thing"
  "kn-8232":
    notes:
      "n1": "ನನ್ನ (nanna), my, is the form of ನಾನು (nānu), I, before a noun; the question word ಯಾರು (yāru), who, follows the noun it asks about."
    native: "Who is my manager?"
  "kn-8233":
    notes:
      "n1": "ನನ್ನ (nanna), my, is the form of ನಾನು (nānu), I, before a noun, with no word for 'is'."
    native: "This is my colleague."
  "kn-8234":
    notes:
      "n1": "ಕಳುಹಿಸು (kaḷuhisu), send, is the plain command, ending in -ು (-u); the polite command ends in -ಿ (-i)."
    native: "Send the report."
  "kn-8235":
    notes:
      "n1": "ಯೋಚಿಸುತ್ತೇನೆ (yōcisuttēne), I think, ends in -ುತ್ತೇನೆ (-uttēne) for 'I' in the present."
    native: "I will think about it."
    bases:
      "ಯೋಚಿಸುತ್ತೇನೆ": "to think, here in the first-person present"
  "kn-8236":
    notes:
      "n1": "ಸಭೆಯನ್ನು (sabheyannu), the meeting, takes the object ending -ಯನ್ನು (-yannu); ಮಾಡುತ್ತಾರೆ (māḍuttāre) ends in -ುತ್ತಾರೆ (-uttāre) for 'they' in the polite present. ಶುರು ಮಾಡು (śuru māḍu) means 'to start': the noun ಶುರು (śuru) with the verb ಮಾಡು (māḍu), do."
    native: "The manager starts the meeting."
    bases:
      "ಸಭೆಯನ್ನು": "meeting, here as the thing started: the meeting"
      "ಮಾಡುತ್ತಾರೆ": "to do or make, here in the third-person polite present"
  "kn-8237":
    native: "Cooperation is good."
  "kn-8238":
    notes:
      "n1": "ಆನ್ (ān), on, is an English word; with ಮಾಡು (māḍu), do, it makes 'turn on': ಆನ್ ಮಾಡು (ān māḍu)."
    native: "Turn on the computer."
  "kn-8239":
    native: "Our team is good."
  "kn-8240":
    notes:
      "n1": "The question word ಯಾರು (yāru), who, follows the noun, with no word for 'is': ಮೇಲಧಿಕಾರಿ (mēladhikāri) ಯಾರು (yāru)? asks who the boss is."
    native: "Who is the boss?"
