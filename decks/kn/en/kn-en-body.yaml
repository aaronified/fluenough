schema: 1
id: "kn-en-body"
kind: "layer"
core: "kn-body"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The body"
license: "CC-BY-SA-4.0"
description: "The parts of the body, and where it hurts. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-0795":
    native: "head"
    notes:
      "n1": "A headache: ತಲೆ ನೋವು (tale nōvu)."
    examples:
      "ನನ್ನ ತಲೆ ನೋಯುತ್ತಿದೆ.": { native: "My head hurts.", bases: { "ನೋಯುತ್ತಿದೆ": "to hurt", "ನನ್ನ": "my" } }
      "ಅವನ ತಲೆ ಭಾರ ಇದೆ.": { native: "His head is heavy.", bases: { "ಭಾರ": "heavy", "ಇದೆ": "to be", "ಅವನ": "his" } }
  "kn-0796":
    native: "eye"
    notes:
      "n1": "The plural is also ಕಣ್ಣುಗಳು (kaṇṇugaḷu), eyes."
    examples:
      "ಅವಳ ಕಣ್ಣು ದೊಡ್ಡದು.": { native: "Her eyes are big.", bases: { "ದೊಡ್ಡದು": "big", "ಅವಳ": "her" } }
      "ಕಣ್ಣು ಮುಚ್ಚು.": { native: "Close your eyes.", bases: { "ಮುಚ್ಚು": "to close" } }
  "kn-0797":
    native: "ear"
    notes:
      "n1": "To listen carefully, say ಕಿವಿ ಕೊಟ್ಟು ಕೇಳು (kivi koṭṭu kēḷu)."
    examples:
      "ನನ್ನ ಕಿವಿ ನೋಯುತ್ತಿದೆ.": { native: "My ear hurts.", bases: { "ನೋಯುತ್ತಿದೆ": "to hurt", "ನನ್ನ": "my" } }
      "ಚೆನ್ನಾಗಿ ಕಿವಿ ಕೊಟ್ಟು ಕೇಳು.": { native: "Listen carefully.", bases: { "ಚೆನ್ನಾಗಿ": "carefully", "ಕೊಟ್ಟು": "giving", "ಕೇಳು": "to listen" } }
  "kn-0798":
    native: "nose"
    notes:
      "n1": "A runny nose is ಮೂಗು ಸೋರುವುದು (mūgu sōruvudu)."
    examples:
      "ಅವನ ಮೂಗು ಕೆಂಪು.": { native: "His nose is red.", bases: { "ಕೆಂಪು": "red", "ಅವನ": "his" } }
      "ಮೂಗು ಸೋರುತ್ತಿದೆ.": { native: "The nose is running.", bases: { "ಸೋರುತ್ತಿದೆ": "to run" } }
  "kn-0799":
    native: "mouth"
    notes:
      "n1": "Open your mouth: ಬಾಯಿ ತೆರೆ (bāyi tere)."
    examples:
      "ಬಾಯಿ ತೆರೆ.": { native: "Open your mouth.", bases: { "ತೆರೆ": "to open" } }
      "ಬಾಯಿ ಮುಚ್ಚು.": { native: "Close your mouth.", bases: { "ಮುಚ್ಚು": "to close" } }
  "kn-0800":
    native: "tooth"
    notes:
      "n1": "To brush the teeth: ಹಲ್ಲು ಉಜ್ಜು (hallu ujju)."
    examples:
      "ನನ್ನ ಹಲ್ಲು ನೋಯುತ್ತಿದೆ.": { native: "My tooth hurts.", bases: { "ನೋಯುತ್ತಿದೆ": "to hurt", "ನನ್ನ": "my" } }
      "ಹಲ್ಲು ಉಜ್ಜು.": { native: "Brush your teeth.", bases: { "ಉಜ್ಜು": "to rub; to brush" } }
  "kn-0801":
    native: "hair"
    notes:
      "n1": "The hair on the head: ತಲೆ ಕೂದಲು (tale kūdalu)."
    examples:
      "ಅವಳ ಕೂದಲು ಉದ್ದ.": { native: "Her hair is long.", bases: { "ಉದ್ದ": "long", "ಅವಳ": "her" } }
      "ಕೂದಲು ಕಪ್ಪು.": { native: "The hair is black.", bases: { "ಕಪ್ಪು": "black" } }
  "kn-0802":
    native: "neck"
    notes:
      "n1": "The neck: ಕುತ್ತಿಗೆ ನೋಯುತ್ತಿದೆ (kuttige nōyuttide), the neck hurts."
    examples:
      "ನನ್ನ ಕುತ್ತಿಗೆ ನೋಯುತ್ತಿದೆ.": { native: "My neck hurts.", bases: { "ನೋಯುತ್ತಿದೆ": "to hurt", "ನನ್ನ": "my" } }
      "ಅವನು ಕುತ್ತಿಗೆ ತಿರುಗಿಸಿದ.": { native: "He turned his neck.", bases: { "ತಿರುಗಿಸಿದ": "to turn", "ಅವನು": "he" } }
  "kn-0803":
    native: "shoulder"
    notes:
      "n1": "Pain in the shoulder: ಭುಜ ನೋವು (bhuja nōvu)."
    examples:
      "ಅವಳ ಭುಜ ನೋವು ಮಾಡುತ್ತಿದೆ.": { native: "Her shoulder hurts.", bases: { "ನೋವು": "pain", "ಮಾಡುತ್ತಿದೆ": "to make", "ಅವಳ": "her" } }
      "ಭುಜದ ಮೇಲೆ ಕೈ ಇಡು.": { native: "Put your hand on the shoulder.", bases: { "ಭುಜದ": "of the shoulder", "ಮೇಲೆ": "on", "ಇಡು": "to put" } }
  "kn-0804":
    native: "finger; toe"
    notes:
      "n1": "A finger or toe: ಬೆರಳು (beraḷu)."
    examples:
      "ನಾನು ಬೆರಳು ಕತ್ತರಿಸಿಕೊಂಡೆ.": { native: "I cut my finger.", bases: { "ಕತ್ತರಿಸಿಕೊಂಡೆ": "to cut oneself", "ನಾನು": "I" } }
      "ಬೆರಳು ಉದ್ದ ಇದೆ.": { native: "The finger is long.", bases: { "ಉದ್ದ": "long", "ಇದೆ": "to be" } }
  "kn-0805":
    native: "stomach"
    notes:
      "n1": "A stomach ache: ಹೊಟ್ಟೆ ನೋವು (hoṭṭe nōvu)."
    examples:
      "ನನ್ನ ಹೊಟ್ಟೆ ನೋಯುತ್ತಿದೆ.": { native: "My stomach hurts.", bases: { "ನೋಯುತ್ತಿದೆ": "to hurt", "ನನ್ನ": "my" } }
      "ಅವನ ಹೊಟ್ಟೆ ತುಂಬಿದೆ.": { native: "His stomach is full.", bases: { "ತುಂಬಿದೆ": "to fill", "ಅವನ": "his" } }
  "kn-0806":
    native: "leg; foot"
    notes:
      "n1": "On foot is ಕಾಲಿನಿಂದ (kālininda), by the foot."
    examples:
      "ಅವಳ ಕಾಲು ನೋಯುತ್ತಿದೆ.": { native: "Her leg hurts.", bases: { "ನೋಯುತ್ತಿದೆ": "to hurt", "ಅವಳ": "her" } }
      "ಕಾಲಿನಿಂದ ನಡೆ.": { native: "Walk on foot.", bases: { "ಕಾಲಿನಿಂದ": "on foot", "ನಡೆ": "to walk" } }
  "kn-0807":
    native: "knee"
    notes:
      "n1": "Bend the knee: ಮೊಣಕಾಲು ಬಗ್ಗಿಸು (moṇakālu baggisu)."
    examples:
      "ನನ್ನ ಮೊಣಕಾಲು ನೋಯುತ್ತಿದೆ.": { native: "My knee hurts.", bases: { "ನೋಯುತ್ತಿದೆ": "to hurt", "ನನ್ನ": "my" } }
      "ಮೊಣಕಾಲು ಬಗ್ಗಿಸು.": { native: "Bend the knee.", bases: { "ಬಗ್ಗಿಸು": "to bend" } }
  "kn-0808":
    native: "back"
    notes:
      "n1": "Keep your back straight: ಬೆನ್ನು ನೇರವಾಗಿ ಇಡು (bennu nēravāgi iḍu)."
    examples:
      "ಅವನ ಬೆನ್ನು ನೋಯುತ್ತಿದೆ.": { native: "His back hurts.", bases: { "ನೋಯುತ್ತಿದೆ": "to hurt", "ಅವನ": "his" } }
      "ಬೆನ್ನು ನೇರವಾಗಿ ಇಡು.": { native: "Keep your back straight.", bases: { "ನೇರವಾಗಿ": "straight", "ಇಡು": "to keep" } }
  "kn-0809":
    native: "chest"
    notes:
      "n1": "The heartbeat in the chest: ಎದೆ ಬಡಿತ (ede baḍita)."
    examples:
      "ನನ್ನ ಎದೆ ನೋಯುತ್ತಿದೆ.": { native: "My chest hurts.", bases: { "ನೋಯುತ್ತಿದೆ": "to hurt", "ನನ್ನ": "my" } }
      "ಎದೆ ಬಡಿತ ಜೋರಾಗಿದೆ.": { native: "The heartbeat is loud.", bases: { "ಬಡಿತ": "beat", "ಜೋರಾಗಿದೆ": "loud" } }
  "kn-0810":
    native: "lip"
    notes:
      "n1": "The lips: ತುಟಿ (tuṭi) is singular; the plural is ತುಟಿಗಳು (tuṭigaḷu)."
    examples:
      "ಅವಳ ತುಟಿ ಒಣಗಿದೆ.": { native: "Her lips are dry.", bases: { "ಒಣಗಿದೆ": "to dry", "ಅವಳ": "her" } }
      "ತುಟಿ ಕೆಂಪು ಇದೆ.": { native: "The lips are red.", bases: { "ಕೆಂಪು": "red", "ಇದೆ": "to be" } }
  "kn-0811":
    native: "tongue"
    notes:
      "n1": "Stick out your tongue: ನಾಲಿಗೆ ಹೊರಗೆ ತೆಗೆ (nālige horage tege)."
    examples:
      "ಬಿಸಿ ಚಹಾದಿಂದ ನಾಲಿಗೆ ಸುಟ್ಟಿತು.": { native: "The hot tea burned my tongue.", bases: { "ಬಿಸಿ": "hot", "ಚಹಾದಿಂದ": "from the tea", "ಸುಟ್ಟಿತು": "to burn" } }
      "ನಾಲಿಗೆ ಹೊರಗೆ ತೆಗೆ.": { native: "Stick out your tongue.", bases: { "ಹೊರಗೆ": "outside", "ತೆಗೆ": "to take out" } }
  "kn-0812":
    native: "face"
    notes:
      "n1": "The face: ಮುಖ ತೊಳೆ (mukha toḷe), wash your face."
    examples:
      "ಅವನ ಮುಖ ಸಂತೋಷದಿಂದ ಇದೆ.": { native: "His face is happy.", bases: { "ಸಂತೋಷದಿಂದ": "happily", "ಇದೆ": "to be", "ಅವನ": "his" } }
      "ಮುಖ ತೊಳೆ.": { native: "Wash your face.", bases: { "ತೊಳೆ": "to wash" } }
  "kn-0813":
    native: "heart"
    notes:
      "n1": "The heart beats: ಹೃದಯ ಬಡಿಯುತ್ತಿದೆ (hrudaya baḍiyuttide)."
    examples:
      "ನನ್ನ ಹೃದಯ ವೇಗವಾಗಿ ಬಡಿಯುತ್ತಿದೆ.": { native: "My heart is beating fast.", bases: { "ವೇಗವಾಗಿ": "fast", "ಬಡಿಯುತ್ತಿದೆ": "to beat", "ನನ್ನ": "my" } }
      "ಅವನ ಹೃದಯ ಚೆನ್ನಾಗಿದೆ.": { native: "His heart is good.", bases: { "ಚೆನ್ನಾಗಿದೆ": "to be good", "ಅವನ": "his" } }
  "kn-0814":
    native: "brain"
    notes:
      "n1": "The brain: ಮೆದುಳು (meduḷu), the organ of thought."
    examples:
      "ಮೆದುಳು ಕೆಲಸ ಮಾಡುತ್ತದೆ.": { native: "The brain works.", bases: { "ಕೆಲಸ": "work", "ಮಾಡುತ್ತದೆ": "to do" } }
      "ನನ್ನ ಮೆದುಳು ದಣಿದಿದೆ.": { native: "My brain is tired.", bases: { "ದಣಿದಿದೆ": "to be tired", "ನನ್ನ": "my" } }
  "kn-0815":
    native: "nail"
    notes:
      "n1": "The nails: ಉಗುರು (uguru), to be cut."
    examples:
      "ಅವಳ ಉಗುರು ಉದ್ದ.": { native: "Her nails are long.", bases: { "ಉದ್ದ": "long", "ಅವಳ": "her" } }
      "ಉಗುರು ಕತ್ತರಿಸು.": { native: "Cut the nails.", bases: { "ಕತ್ತರಿಸು": "to cut" } }
  "kn-0816":
    native: "throat"
    notes:
      "n1": "A sore throat: ಗಂಟಲು ನೋವು (gaṇṭalu nōvu)."
    examples:
      "ನನ್ನ ಗಂಟಲು ನೋಯುತ್ತಿದೆ.": { native: "My throat hurts.", bases: { "ನೋಯುತ್ತಿದೆ": "to hurt", "ನನ್ನ": "my" } }
      "ಗಂಟಲು ಒಣಗಿದೆ.": { native: "The throat is dry.", bases: { "ಒಣಗಿದೆ": "to dry" } }
  "kn-0817":
    native: "waist"
    notes:
      "n1": "At the waist: ಸೊಂಟದಲ್ಲಿ (soṇṭadalli)."
    examples:
      "ಅವನ ಸೊಂಟ ನೋಯುತ್ತಿದೆ.": { native: "His waist hurts.", bases: { "ನೋಯುತ್ತಿದೆ": "to hurt", "ಅವನ": "his" } }
      "ಸೊಂಟ ಬಗ್ಗಿಸು.": { native: "Bend at the waist.", bases: { "ಬಗ್ಗಿಸು": "to bend" } }
  "kn-0818":
    native: "fever"
    notes:
      "n1": "To have a fever: ಜ್ವರ ಬಂದಿದೆ (jvara bandide)."
    examples:
      "ನನಗೆ ಜ್ವರ ಬಂದಿದೆ.": { native: "I have a fever.", bases: { "ನನಗೆ": "to me", "ಬಂದಿದೆ": "to come" } }
      "ಮಗುವಿಗೆ ಜ್ವರ ಇದೆ.": { native: "The child has a fever.", bases: { "ಮಗುವಿಗೆ": "the child", "ಇದೆ": "to be" } }
  "kn-0819":
    native: "elbow"
    notes:
      "n1": "The elbow: ಮೊಣಕೈ (moṇakai), the joint of the arm."
    examples:
      "ಅವಳ ಮೊಣಕೈ ನೋಯುತ್ತಿದೆ.": { native: "Her elbow hurts.", bases: { "ನೋಯುತ್ತಿದೆ": "to hurt", "ಅವಳ": "her" } }
      "ಮೊಣಕೈ ಮೇಜಿನ ಮೇಲೆ ಇಡಬೇಡ.": { native: "Do not put your elbow on the table.", bases: { "ಮೇಜಿನ": "of the table", "ಮೇಲೆ": "on", "ಇಡಬೇಡ": "do not put" } }
  "kn-0820":
    native: "thigh"
    notes:
      "n1": "The thigh: ತೊಡೆ (toḍe), between the hip and the knee."
    examples:
      "ನನ್ನ ತೊಡೆ ನೋಯುತ್ತಿದೆ.": { native: "My thigh hurts.", bases: { "ನೋಯುತ್ತಿದೆ": "to hurt", "ನನ್ನ": "my" } }
      "ಮಗು ತೊಡೆ ಮೇಲೆ ಕುಳಿತಿದೆ.": { native: "The child is sitting on the lap.", bases: { "ಮಗು": "child", "ಮೇಲೆ": "on", "ಕುಳಿತಿದೆ": "to sit" } }
  "kn-0821":
    native: "eyelid"
    notes:
      "n1": "The eyelid: ರೆಪ್ಪೆ (reppe), which opens and closes."
    examples:
      "ಅವನ ರೆಪ್ಪೆ ಅಲುಗಾಡುತ್ತಿದೆ.": { native: "His eyelid is twitching.", bases: { "ಅಲುಗಾಡುತ್ತಿದೆ": "to twitch", "ಅವನ": "his" } }
      "ರೆಪ್ಪೆ ಮುಚ್ಚು.": { native: "Close your eyelids.", bases: { "ಮುಚ್ಚು": "to close" } }
  "kn-0822":
    native: "eyebrow"
    notes:
      "n1": "The eyebrow: ಹುಬ್ಬು (hubbu), above the eye."
    examples:
      "ಅವಳ ಹುಬ್ಬು ಕಪ್ಪು.": { native: "Her eyebrow is black.", bases: { "ಕಪ್ಪು": "black", "ಅವಳ": "her" } }
      "ಹುಬ್ಬು ಮೇಲೆ ಎತ್ತು.": { native: "Raise your eyebrows.", bases: { "ಮೇಲೆ": "up", "ಎತ್ತು": "to raise" } }
  "kn-0823":
    native: "cheek"
    notes:
      "n1": "The cheek: ಕೆನ್ನೆ (kenne), on the side of the face."
    examples:
      "ಅವಳ ಕೆನ್ನೆ ಕೆಂಪು.": { native: "Her cheek is red.", bases: { "ಕೆಂಪು": "red", "ಅವಳ": "her" } }
      "ಮಗುವಿನ ಕೆನ್ನೆ ಮೃದು.": { native: "The child's cheek is soft.", bases: { "ಮಗುವಿನ": "of the child", "ಮೃದು": "soft" } }
  "kn-0824":
    native: "chin"
    notes:
      "n1": "The chin: ಗಲ್ಲ (galla), below the mouth."
    examples:
      "ಅವನ ಗಲ್ಲ ದೊಡ್ಡದು.": { native: "His chin is big.", bases: { "ದೊಡ್ಡದು": "big", "ಅವನ": "his" } }
      "ಗಲ್ಲ ಮೇಲೆ ಗಾಯ ಆಗಿದೆ.": { native: "There is a wound on the chin.", bases: { "ಮೇಲೆ": "on", "ಗಾಯ": "wound", "ಆಗಿದೆ": "to be" } }
  "kn-0825":
    native: "forehead"
    notes:
      "n1": "The forehead: ಹಣೆ (haṇe), above the eyes."
    examples:
      "ನನ್ನ ಹಣೆ ಬಿಸಿ ಇದೆ.": { native: "My forehead is warm.", bases: { "ಬಿಸಿ": "warm", "ಇದೆ": "to be", "ನನ್ನ": "my" } }
      "ಅವಳು ಹಣೆ ಮುಟ್ಟಿದಳು.": { native: "She touched the forehead.", bases: { "ಮುಟ್ಟಿದಳು": "to touch", "ಅವಳು": "she" } }
