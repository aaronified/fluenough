kind: "layer"
core: "kn-hospitality-reception"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hospitality: hotel reception"
license: "CC-BY-SA-4.0"
description: "Phrases and words for checking in at a hotel: the booking, the room, meals and the check-out."
cards:
  "kn-6540":
    native: "I have booked a room in my name."
    notes: { n1: "ಹೆಸರಿನಲ್ಲಿ (hesarinalli) is ಹೆಸರು (hesaru), name, with -ಇನ್ (-in) added before -ಅಲ್ಲಿ (-alli), in: the final ಉ (u) drops." }
  "kn-6541":
    native: "Is a room free for two nights?"
  "kn-6542":
    native: "What is the rate for one day?"
  "kn-6543":
    native: "What time is breakfast?"
    notes: { n1: "ಬೆಳಗಿನ (beḷagina) is ಬೆಳಗು (beḷagu), morning, with -ಇನ (-ina), so it means of the morning; in speech breakfast is also ತಿಂಡಿ (tiṇḍi)." }
  "kn-6544":
    native: "Is there wifi in the room?"
    notes: { n1: "ಕೊಠಡಿಯಲ್ಲಿ (koṭhaḍiyalli) is ಕೊಠಡಿ (koṭhaḍi), room, with -ಯಲ್ಲಿ (-yalli): ಯ (ya) joins a word ending in a vowel to the ending." }
  "kn-6545":
    native: "Your room is on the second floor."
  "kn-6546":
    native: "Check-out time is twelve o'clock."
  "kn-6547":
    native: "Can we leave our luggage here?"
  "kn-6548":
    native: "Please call a taxi."
    notes: { n1: "ಕರೆಯಿರಿ (kareyiri) is the polite command of ಕರೆ (kare), to call; the ending is -ಯಿರಿ (-yiri) on a stem that ends in a vowel, for a person you respect." }
