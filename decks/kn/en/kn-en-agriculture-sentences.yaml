native: { code: "en", iso639_3: "eng", name: "English" }
name: "Agriculture: farms, crops and the harvest: sentences"
description: "Sentences with the words of the agriculture: farms, crops and the harvest unit and the units before it. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-7493":
    native: "There is farming in my town."
    notes:
      "n1": "ಇದೆ (ide) 'there is' is used for a thing, and ಊರು (ūru) 'village' takes ಇನಲ್ಲಿ (inalli) for 'in'."
    bases:
      "ಊರಿನಲ್ಲಿ": "in the town"
      "ಇದೆ": "is"
  "kn-7494":
    native: "They farm."
    notes:
      "n1": "ಬೇಸಾಯ (bēsāya) 'farming' is a noun, and ಮಾಡು (māḍu) 'do' makes it the verb: they farm."
    bases:
      "ಮಾಡುತ್ತಾರೆ": "to do (they)"
  "kn-7495":
    native: "I sow the seed."
    notes:
      "n1": "ಬಿತ್ತನೆ (bittane) 'sowing' is a noun, and ಮಾಡು (māḍu) 'do' is used to make it the verb: I sow."
    bases:
      "ಮಾಡುತ್ತೇನೆ": "to do (I)"
  "kn-7496":
    native: "The crop is good."
  "kn-7497":
    native: "The plough is here."
    notes:
      "n1": "ಇಲ್ಲಿ (illi) 'here' comes before ಇದೆ (ide) 'is' for a thing."
    bases:
      "ಇದೆ": "is"
  "kn-7498":
    native: "Fertiliser is needed."
    notes:
      "n1": "ಬೇಕು (bēku) 'is needed' has no person in the sentence, so the thing needed is the subject."
    bases:
      "ಬೇಕು": "needed"
  "kn-7499":
    native: "When is the harvest?"
    notes:
      "n1": "ಯಾವಾಗ (yāvāga) 'when' asks about time and comes after the noun, with no verb."
  "kn-7500":
    native: "Is there a tractor?"
    notes:
      "n1": "ಇದೆಯಾ (ideyā) adds ಯಾ (yā) to ಇದೆ (ide) to make a yes or no question."
    bases:
      "ಇದೆಯಾ": "is there (question)"
