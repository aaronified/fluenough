id: "kn-en-registers"
kind: "layer"
core: "kn-registers"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Written Kannada and spoken Kannada"
license: "CC0-1.0"
description: "Written Kannada keeps fuller forms than speech: ಮಾಡುತ್ತೇನೆ (māḍuttēne) on paper, ಮಾಡ್ತೀನಿ (māḍtīni) in the street. These decks show the written form and accept the spoken one; here they are side by side, with the formal words seen on signs. Recognition only. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0504":
    notes:
      "n1": "Written and formal. In speech Kannada often puts -ಊ (-ū) on both words instead: ನಾನೂ ನೀನೂ (nānū nīnū), you and I."
  "kn-0146":
    notes:
      "n1": "Formal. Between friends, often ಥ್ಯಾಂಕ್ಸ್ (thyāṅks)."
  "kn-0543":
    native: "I do; I'll do (written); in speech ಮಾಡ್ತೀನಿ (māḍtīni)"
    notes:
      "n1": "Written Kannada keeps -ಉತ್ತ- (-utta-) whole; speech shortens it: ಬರುತ್ತೇನೆ (baruttēne), ಬರ್ತೀನಿ (bartīni)."
  "kn-0544":
    native: "it comes; it will come (written); in speech ಬರುತ್ತೆ (barutte)"
  "kn-0545":
    native: "doing; to do (written); in speech ಮಾಡೋದು (māḍōdu)"
    notes:
      "n1": "Speech turns -ಉವು- (-uvu-) into -ಓ- (-ō-): ನೋಡುವುದು (nōḍuvudu), ನೋಡೋದು (nōḍōdu)."
  "kn-0546":
    native: "to go, in order to go (written); in speech ಹೋಗೋಕೆ (hōgōke)"
    notes:
      "n1": "Also ಹೋಗಕ್ಕೆ (hōgakke) in speech."
  "kn-0355":
    notes:
      "n1": "Written. In speech ಮನೇಲಿ (manēli): -ಯಲ್ಲಿ (-yalli) becomes -ಏಲಿ (-ēli)."
  "kn-0547":
    native: "today (written); in speech ಇವತ್ತು (ivattu)"
  "kn-0548":
    native: "therefore (written); in speech ಅದಕ್ಕೆ (adakke)"
  "kn-0549":
    native: "he said (written); in speech ಹೇಳಿದ (hēḷida)"
    notes:
      "n1": "Speech drops the -ನು (-nu) of a man's past."
  "kn-0550":
    native: "please (formal, written)"
    notes:
      "n1": "In speech a polite verb ending usually does the work: ಕೊಡಿ (koḍi), please give."
  "kn-0551":
    native: "welcome (on signs)"
  "kn-0552":
    native: "entry; way in (on signs)"
  "kn-0553":
    native: "exit; way out (on signs)"
  "kn-0554":
    native: "caution; warning (on signs)"
  "kn-0555":
    native: "no smoking (on signs)"
    notes:
      "n1": "Literally 'smoking has been forbidden'."
  "kn-0556":
    native: "toilet (formal, on signs)"
