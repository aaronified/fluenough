tags: ["beginner", "unreviewed"]
cards:
  "kn-7375":
    native: "Hello, sir."
    notes:
      "n1": "ಸರ್ (sar), sir, is the usual word for a man in an office or a teacher, said after ನಮಸ್ಕಾರ (namaskāra), hello."
  "kn-7376":
    native: "This is my younger brother."
    notes:
      "n1": "ಇವನು (ivanu), this man, and ಇವಳು (ivaḷu), this woman, are used for people; ನನ್ನ (nanna), my, comes before the noun."
    bases:
      "ಇವನು": "this man"
  "kn-7377":
    native: "This is my younger sister."
    bases:
      "ಇವಳು": "this woman"
  "kn-7378":
    notes:
      "n1": "ಹೋಗುತ್ತೀರಿ (hōguttīri) is ಹೋಗು (hōgu), to go, with the ending -ತ್ತೀರಿ (-ttīri), the form that goes with ನೀವು (nīvu), you, when it is polite or plural."
    native: "Grandmother, where are you going?"
    bases:
      "ಹೋಗುತ್ತೀರಿ": "to go (you, polite)"
  "kn-7379":
    native: "Madam, thank you."
    notes:
      "n1": "ಧನ್ಯವಾದಗಳು (dhanyavādagaḷu), thank you, takes the plural -ಗಳು (-gaḷu), the usual form of thanks."
  "kn-7380":
    notes:
      "n1": "ಬರುತ್ತೇನೆ (baruttēne) comes from ಬಾ (bā), to come, whose stem changes to ಬರು (baru) before the ending -ತ್ತೇನೆ (-ttēne), I will or I do."
    native: "Sir, I will come."
    bases:
      "ಬರುತ್ತೇನೆ": "to come (I)"
  "kn-7381":
    native: "Aunty, will you drink?"
    notes:
      "n1": "ಕುಡಿಯುತ್ತೀರಾ (kuḍiyuttīrā) is the polite form of ಕುಡಿ (kuḍi), drink, with -ಆ (-ā), the question ending."
    bases:
      "ಕುಡಿಯುತ್ತೀರಾ": "to drink (you)"
  "kn-7382":
    native: "Little brother, come."
    notes:
      "n1": "ಬಾ (bā), come, is the familiar command; to an elder or a stranger say ಬನ್ನಿ (banni)."
  "kn-7383":
    native: "Friend, who are you?"
    notes:
      "n1": "ನೀನು (nīnu), you, is for a friend or a child; to an elder or a stranger use ನೀವು (nīvu)."
