  "kn-7375":
    native: "Hello, sir."
  "kn-7376":
    native: "This is my younger brother."
    bases:
      "ಇವನು": "this man"
  "kn-7377":
    native: "This is my younger sister."
    bases:
      "ಇವಳು": "this woman"
  "kn-7378":
    notes:
      "n1": "ಹೋಗುತ್ತೀರಿ (hōguttīri) is ಹೋಗು (hōgu), to go, with the ending -ತ್ತೀರಿ (-ttīri), the form that goes with ನೀವು (nīvu), you, when it is polite or plural."
    native: "Grandmother, where are you going?"
    bases:
      "ಹೋಗುತ್ತೀರಿ": "to go (you, polite)"
  "kn-7379":
    native: "Madam, thank you."
  "kn-7380":
    notes:
      "n1": "ಬರುತ್ತೇನೆ (baruttēne) comes from ಬಾ (bā), to come, whose stem changes to ಬರು (baru) before the ending -ತ್ತೇನೆ (-ttēne), I will or I do."
    native: "Sir, I will come."
    bases:
      "ಬರುತ್ತೇನೆ": "to come (I)"
  "kn-7381":
    native: "Aunty, will you drink?"
    bases:
      "ಕುಡಿಯುತ್ತೀರಾ": "to drink (you)"
  "kn-7382":
    native: "Little brother, come."
  "kn-7383":
    native: "Friend, who are you?"
