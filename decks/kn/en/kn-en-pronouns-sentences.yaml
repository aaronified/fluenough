cards:
  "kn-7750":
    native: "I am going."
    notes:
      "n1": "ಹೋಗುತ್ತೇನೆ (hōguttēne) ends in ಏನೆ (ēne), the 'I' verb ending."
  "kn-7751":
    native: "What are you doing?"
    notes:
      "n1": "ಏನು (ēnu) 'what' stays before the verb, as in English. ಮಾಡುತ್ತೀಯ (māḍuttīya) ends in ಈಯ (īya), the informal 'you' verb ending."
  "kn-7752":
    native: "He is going."
    notes:
      "n1": "ಹೋಗುತ್ತಾನೆ (hōguttāne) ends in ಆನೆ (āne), the 'he' verb ending."
  "kn-7753":
    native: "She reads."
    notes:
      "n1": "ಓದುತ್ತಾಳೆ (ōduttāḷe) ends in ಆಳೆ (āḷe), the 'she' verb ending."
  "kn-7754":
    native: "We read."
    notes:
      "n1": "ಓದುತ್ತೇವೆ (ōduttēve) ends in ಏವೆ (ēve), the 'we' verb ending."
  "kn-7755":
    native: "Who is he?"
    notes:
      "n1": "ಯಾರು (yāru) 'who' is used for a person, and the sentence has no verb for 'is'."
  "kn-7756":
    native: "This is good."
  "kn-7757":
    native: "Who are these people?"
    notes:
      "n1": "ಇವರು (ivaru) is used for 'these people' or for one person with respect, while ಯಾರು (yāru) asks 'who'."
  "kn-7758":
    notes:
      "n1": "ನನಗೆ (nanage) is the dative of ನಾನು (nānu), I, so the telling goes to me."
    native: "He tells me."
