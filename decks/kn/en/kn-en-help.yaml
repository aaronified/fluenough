description: "Asking for help, doctors and medicine, and saying you are lost. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0523":
    native: "help"
    "examples": {
      "ಸಹಾಯ ಕೇಳು.": {"native": "Ask for help.", "bases": {}},
      "ಸಹಾಯ ಮಾಡು": {"native": "to help", "bases": {"ಮಾಡು": "to do; to make"}}
    }
  "kn-0526":
    native: "Stop!; Wait, please!"
    notes:
      "n1": "To a friend: ನಿಲ್ಲು! (nillu!)."
  "kn-0527":
    native: "police"
  "kn-0528":
    native: "hospital"
    notes:
      "n1": "From the English 'hospital'."
  "kn-0529":
    native: "medicine"
    notes:
      "n1": "Also ಔಷಧ (auṣadha). A chemist's is a ಮೆಡಿಕಲ್ ಶಾಪ್ (meḍikal śāp)."
    "examples": {
      "ಔಷಧಿ ಔಷಧಾಲಯದಲ್ಲಿ ಸಿಗುತ್ತದೆ.": {"native": "Medicine is available at the pharmacy.", "bases": {"ಔಷಧಾಲಯದಲ್ಲಿ": "at the pharmacy", "ಸಿಗುತ್ತದೆ": "to be available"}}
    }
  "kn-0530":
    native: "pain"
    notes:
      "n1": "ತಲೆ ನೋವು (tale nōvu), a headache; ಹೊಟ್ಟೆ ನೋವು (hoṭṭe nōvu), a stomach ache."
    "examples": {
      "ಚುಚ್ಚುಮದ್ದು ನೋವು ಇದೆ.": {"native": "The injection hurts.", "bases": {"ಇದೆ": "has"}},
      "ಅವಳ ಭುಜ ನೋವು ಮಾಡುತ್ತಿದೆ.": {"native": "Her shoulder hurts.", "bases": {"ನೋವು": "pain", "ಮಾಡುತ್ತಿದೆ": "to make", "ಅವಳ": "her"}}
    }
