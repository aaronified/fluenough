schema: 1
id: "kn-en-help"
kind: "layer"
core: "kn-help"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Help"
license: "CC0-1.0"
description: "Asking for help, doctors and medicine, and saying you are lost. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0523":
    native: "help"
  "kn-0524":
    native: "Please help!"
    notes:
      "n1": "ದಯವಿಟ್ಟು (dayaviṭṭu) is a formal 'please'."
  "kn-0525":
    native: "Help! Save me!"
  "kn-0526":
    native: "Stop! Wait, please!"
    notes:
      "n1": "To a friend: ನಿಲ್ಲು! (nillu!)."
  "kn-0527":
    native: "police"
  "kn-0528":
    native: "hospital"
    notes:
      "n1": "From the English 'hospital'."
  "kn-0529":
    native: "medicine"
    notes:
      "n1": "Also ಔಷಧ (auṣadha). A chemist's is a ಮೆಡಿಕಲ್ ಶಾಪ್ (meḍikal śāp)."
  "kn-0530":
    native: "pain"
    notes:
      "n1": "ತಲೆ ನೋವು (tale nōvu), a headache; ಹೊಟ್ಟೆ ನೋವು (hoṭṭe nōvu), a stomach ache."
  "kn-0531":
    native: "I'm lost."
    notes:
      "n1": "'I have missed the way'."
  "kn-0532":
    native: "I didn't understand."
    notes:
      "n1": "'To me the meaning did not come about'."
  "kn-0533":
    native: "Where is the toilet?"
    notes:
      "n1": "ಶೌಚಾಲಯ (śaucālaya) is the word on signs; many say ಟಾಯ್ಲೆಟ್ (ṭāyleṭ)."
