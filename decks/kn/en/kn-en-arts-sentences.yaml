core: "kn-arts-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Arts: music, dance, painting and the stage: sentences"
description: "Sentences about the arts: the veena and the flute, a play and a performance, a sculpture and a canvas. They use the words of the arts unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8271":
    native: "She plays the veena."
    notes:
      "n1": "ವೀಣೆಯನ್ನು (vīṇeyannu) takes the ಯನ್ನು (yannu) ending, which marks the object of the verb. ನುಡಿಸುತ್ತಾಳೆ (nuḍisuttāḷe) ends in ಆಳೆ (āḷe), the 'she' verb ending."
    bases:
      "ವೀಣೆಯನ್ನು": "veena, a stringed instrument, here as the thing played"
      "ನುಡಿಸುತ್ತಾಳೆ": "to play an instrument, here in the third-person feminine present"
  "kn-8272":
    native: "He is a musician."
    notes:
      "n1": "ಅವನು (avanu) 'he' stands before ಸಂಗೀತಗಾರ (saṅgītagāra) 'musician' with no verb for 'is'."
  "kn-8273":
    native: "The play is today."
    notes:
      "n1": "ನಾಟಕ (nāṭaka) 'the play' and ಇವತ್ತು (ivattu) 'today' stand side by side with no verb; the time word comes last."
  "kn-8274":
    native: "Where is the performance?"
    notes:
      "n1": "ಎಲ್ಲಿ (elli) 'where' comes after the noun, with no verb, as in the other location questions."
  "kn-8275":
    native: "I need a brush."
    notes:
      "n1": "ನನಗೆ (nanage) 'to me' is the dative: the thing needed is the subject, and ಬೇಕು (bēku) 'is needed' comes at the end."
    bases:
      "ನನಗೆ": "I, in the dative: to me"
  "kn-8276":
    native: "This is a beautiful sculpture."
    notes:
      "n1": "Adjectives come before the noun in Kannada: ಸುಂದರ (sundara) 'beautiful' stands before ಶಿಲ್ಪ (śilpa) 'sculpture'."
  "kn-8277":
    native: "She carves the statue."
    notes:
      "n1": "ಮೂರ್ತಿಯನ್ನು (mūrtiyannu) marks the object with the ಯನ್ನು (yannu) ending, and ಕೆತ್ತುತ್ತಾಳೆ (kettuttāḷe) ends in the 'she' verb ending ಆಳೆ (āḷe)."
    bases:
      "ಮೂರ್ತಿಯನ್ನು": "statue, here as the thing carved: the statue"
      "ಕೆತ್ತುತ್ತಾಳೆ": "to carve, here in the third-person feminine present"
  "kn-8278":
    native: "Bharatanatyam is good."
    notes:
      "n1": "ಒಳ್ಳೆಯದು (oḷḷeyadu) 'good' ends in ದು (du), a form used for things and ideas, and needs no verb."
  "kn-8279":
    native: "I look at the artwork."
    notes:
      "n1": "ನೋಡುತ್ತೇನೆ (nōḍuttēne) ends in ಏನೆ (ēne), the 'I' verb ending, and ಕಲಾಕೃತಿಯನ್ನು (kalākrutiyannu) marks the object."
    bases:
      "ಕಲಾಕೃತಿಯನ್ನು": "artwork, here as the thing looked at: the artwork"
      "ನೋಡುತ್ತೇನೆ": "to see or look, here in the first-person present"
  "kn-8280":
    native: "Where is Yakshagana?"
    notes:
      "n1": "ಎಲ್ಲಿ (elli) 'where' comes after the name with no verb, as in the other location questions."
  "kn-8281":
    native: "They bring a canvas."
    notes:
      "n1": "ಅವರು (avaru) can mean 'they' or a respected 'he' or 'she', and it takes the plural verb ending ಆರೆ (āre) as in ತರುತ್ತಾರೆ (taruttāre)."
    bases:
      "ತರುತ್ತಾರೆ": "to bring, here in the third-person polite present"
