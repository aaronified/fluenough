schema: 1
id: "kn-en-government"
kind: "layer"
core: "kn-government"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Government: offices, forms and rules"
license: "CC-BY-SA-4.0"
description: "Dealing with the government: the officer and the office, the form and the certificate, the tax and the rules. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1417":
    native: "government"
    notes:
      "n1": "The government of a state or a country."
    examples:
      "ಸರ್ಕಾರ ಹೊಸ ನಿಯಮ ಮಾಡಿದೆ.": "The government has made a new rule."
      "ಸರ್ಕಾರಿ ಕಚೇರಿ ಎಲ್ಲಿ?": "Where is the government office?"
  "kn-1418":
    native: "government, official"
    notes:
      "n1": "Of the government, public, official."
    examples:
      "ಸರ್ಕಾರಿ ಶಾಲೆ ಇದೆ.": { native: "There is a government school.", bases: { "ಇದೆ": "there is" } }
      "ಸರ್ಕಾರಿ ಕೆಲಸ ಬೇಕು.": "I need a government job."
  "kn-1419":
    native: "minister"
    notes:
      "n1": "A minister, who leads a department of government."
    examples:
      "ಮಂತ್ರಿ ಬಂದರು.": "The minister came."
      "ಮಂತ್ರಿ ಹೇಳಿದರು.": "The minister said."
  "kn-1420":
    native: "officer"
    notes:
      "n1": "An officer, a person in charge in an office."
    examples:
      "ಅಧಿಕಾರಿ ಇದ್ದಾರೆ.": { native: "The officer is there.", bases: { "ಇದ್ದಾರೆ": "is there" } }
      "ಅಧಿಕಾರಿಗೆ ಅರ್ಜಿ ಕೊಡು.": { native: "Give the application to the officer.", bases: { "ಅಧಿಕಾರಿಗೆ": "to the officer" } }
  "kn-1421":
    native: "rule"
    notes:
      "n1": "A rule, which everyone must follow."
    examples:
      "ಇದು ನಿಯಮ.": "This is a rule."
      "ನಿಯಮ ಬೇಕು.": "The rule is needed."
  "kn-1422":
    native: "certificate"
    notes:
      "n1": "A certificate, a paper that proves something."
    examples:
      "ಪ್ರಮಾಣಪತ್ರ ಬೇಕು.": "I need a certificate."
      "ಪ್ರಮಾಣಪತ್ರ ಇದೆಯೇ?": { native: "Is there a certificate?", bases: { "ಇದೆಯೇ": "is there" } }
  "kn-1423":
    native: "tax"
    notes:
      "n1": "Tax, the money paid to the government."
    examples:
      "ತೆರಿಗೆ ಕಟ್ಟು.": "Pay the tax."
      "ತೆರಿಗೆ ಎಷ್ಟು?": "How much tax?"
  "kn-1424":
    native: "citizen"
    notes:
      "n1": "A citizen, a member of a country with rights and duties."
    examples:
      "ನಾಗರಿಕ ಬಂದ.": "The citizen came."
      "ಪ್ರತಿ ನಾಗರಿಕನಿಗೆ ಹಕ್ಕು ಇದೆ.": { native: "Every citizen has a right.", bases: { "ನಾಗರಿಕನಿಗೆ": "to a citizen", "ಇದೆ": "has" } }
  "kn-1425":
    native: "permission"
    notes:
      "n1": "Permission, the right to do something, given by someone in charge."
    examples:
      "ಅನುಮತಿ ಬೇಕು.": "I need permission."
      "ಅನುಮತಿ ಸಿಕ್ಕಿತು.": { native: "Permission was given.", bases: { "ಸಿಕ್ಕಿತು": "was given" } }
  "kn-1426":
    native: "form"
    notes:
      "n1": "A form, a paper to fill in with your details."
    examples:
      "ಫಾರ್ಮ್ ತುಂಬು.": "Fill in the form."
      "ಫಾರ್ಮ್ ಎಲ್ಲಿ?": "Where is the form?"
  "kn-1427":
    native: "official"
    notes:
      "n1": "Official, approved by the government or an office."
    examples:
      "ಅಧಿಕೃತ ಪತ್ರ.": "An official letter."
      "ಈ ಪತ್ರ ಅಧಿಕೃತ ಅಲ್ಲ.": "This letter is not official."
  "kn-1428":
    native: "committee"
    notes:
      "n1": "A committee, a group of people who decide together."
    examples:
      "ಸಮಿತಿ ಸಭೆ ಮಾಡಿತು.": "The committee held a meeting."
      "ಸಮಿತಿಯಲ್ಲಿ ಐದು ಜನ ಇದ್ದಾರೆ.": { native: "There are five people in the committee.", bases: { "ಸಮಿತಿಯಲ್ಲಿ": "in the committee", "ಇದ್ದಾರೆ": "there are" } }
  "kn-1429":
    native: "fine, penalty"
    notes:
      "n1": "A fine, money paid for breaking a rule."
    examples:
      "ದಂಡ ಕಟ್ಟು.": "Pay the fine."
      "ನಿಯಮ ಮುರಿದರೆ ದಂಡ ಇದೆ.": { native: "If you break the rule, there is a fine.", bases: { "ಇದೆ": "there is" } }
  "kn-1430":
    native: "office, bureau"
    notes:
      "n1": "An office of the government or a company."
    examples:
      "ಕಾರ್ಯಾಲಯ ಎಲ್ಲಿ?": "Where is the office?"
      "ಕಾರ್ಯಾಲಯದಲ್ಲಿ ಅಧಿಕಾರಿ ಇದ್ದಾರೆ.": { native: "The officer is in the office.", bases: { "ಕಾರ್ಯಾಲಯದಲ್ಲಿ": "in the office", "ಇದ್ದಾರೆ": "is" } }
  "kn-1431":
    native: "proof, witness"
    notes:
      "n1": "Proof, or a witness who saw something happen."
    examples:
      "ಸಾಕ್ಷಿ ಬೇಕು.": "I need proof."
      "ಸಾಕ್ಷಿ ಇದೆ.": { native: "There is proof.", bases: { "ಇದೆ": "there is" } }
  "kn-1432":
    native: "order, command"
    notes:
      "n1": "An order from an officer or the government."
    examples:
      "ಆದೇಶ ಬಂತು.": "The order came."
      "ಆದೇಶ ಬೇಕು.": "The order is needed."
  "kn-1433":
    native: "right"
    notes:
      "n1": "A right, something you are allowed to have or do."
    examples:
      "ಹಕ್ಕು ಇದೆ.": { native: "There is a right.", bases: { "ಇದೆ": "there is" } }
      "ನನಗೆ ಹಕ್ಕು ಬೇಕು.": "I need a right."
