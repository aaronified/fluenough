tags: ["beginner", "unreviewed"]
cards:
  "kn-7110":
    native: "Hey mate, what's up?"
    notes:
      "n1": "ಏನ್ (ēn) is the spoken form of ಏನು (ēnu), what. ಮಗಾ (magā) is slang for a male friend, so use it only with one."
    bases:
      "ಏನ್": "what"
      "ಸಮಾಚಾರ": "news"
  "kn-7111":
    native: "This is great."
    notes:
      "n1": "ಸಕ್ಕತ್ (sakkat) is street slang for 'great', for friends."
  "kn-7112":
    native: "It's fantastic."
    notes:
      "n1": "ಬೊಂಬಾಟ್ (bombāṭ) is slang for 'fantastic'; ಆಗಿದೆ (āgide), has become, is the usual 'it is' after it."
    bases:
      "ಆಗಿದೆ": "is (it has become; it is)"
  "kn-7113":
    native: "Way too much."
    notes:
      "n1": "ಸಿಕ್ಕಾಪಟ್ಟೆ (sikkāpaṭṭe) is slang for 'extremely', here with ಜಾಸ್ತಿ (jāsti), a lot."
  "kn-7114":
    native: "Just listen."
    notes:
      "n1": "ಸುಮ್ನೆ (sumne) is the spoken form of ಸುಮ್ಮನೆ (summane), 'just' or 'quietly'."
  "kn-7115":
    native: "The film is brilliant."
  "kn-7116":
    native: "This is rubbish."
  "kn-7117":
    native: "Where is the oil?"
  "kn-7118":
    native: "It's great."
    notes:
      "n1": "ಮಸ್ತ್ (mast) is a word borrowed from Hindi, used in street talk for 'great'."
    bases:
      "ಆಗಿದೆ": "is (it has become; it is)"
  "kn-7119":
    native: "Mate, this is great."
    notes:
      "n1": "ಗುರು (guru) means 'teacher', and in slang it calls a friend 'mate'."
