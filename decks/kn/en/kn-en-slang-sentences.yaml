core: "kn-slang-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Slang: sentences"
description: "Sentences with the words of the slang unit and the units before it. They unlock once their words are known. Not yet checked by a Kannada speaker: please report any mistake."
