schema: 1
id: "kn-en-script-conjuncts"
kind: "layer"
core: "kn-script-conjuncts"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kannada conjuncts"
license: "CC-BY-SA-4.0"
description: "Two consonants with no vowel between them are joined: the second is written below the first, as a small form (ottakshara). Doubled consonants are everywhere in Kannada. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0086":
    native: "kk (double k)"
    notes:
      "n1": "ಕ (ka) with its ottakshara below: the k is held longer. ಅಕ್ಕ (akka, elder sister). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "ಅನುಮತಿ ಸಿಕ್ಕಿತು.": {"native": "Permission was given.", "bases": {"ಸಿಕ್ಕಿತು": "was given"}},
      "ಕೊಳ ಚಿಕ್ಕದು.": {"native": "The pond is small.", "bases": {"ಚಿಕ್ಕದು": "small"}}
    }
  "kn-0087":
    native: "gg (double g)"
    notes:
      "n1": "ಗ (ga) doubled: ಹಗ್ಗ (hagga, rope). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "ಅವನು ಒಗ್ಗೂಡುತ್ತಾನೆ.": {"native": "He gathers.", "bases": {"ಒಗ್ಗೂಡುತ್ತಾನೆ": "gathers"}},
      "ಅವರು ಒಗ್ಗೂಡುತ್ತಾರೆ.": {"native": "They gather.", "bases": {"ಒಗ್ಗೂಡುತ್ತಾರೆ": "gather"}}
    }
  "kn-0088":
    native: "chch (double ch)"
    notes:
      "n1": "ಚ (ca) doubled: ಬೆಚ್ಚಗೆ (beccage, warm). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "ಅವನು ಬಿಚ್ಚುತ್ತಾನೆ.": {"native": "He unties.", "bases": {"ಬಿಚ್ಚುತ್ತಾನೆ": "unties"}},
      "ಅವರು ಬಿಚ್ಚುತ್ತಾರೆ.": {"native": "They untie.", "bases": {"ಬಿಚ್ಚುತ್ತಾರೆ": "untie"}}
    }
  "kn-0089":
    native: "tt, curled back (double t)"
    notes:
      "n1": "ಟ (ṭa) doubled: ಬಟ್ಟೆ (baṭṭe, cloth; clothes). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "kn-0090":
    native: "dd, curled back (double d)"
    notes:
      "n1": "ಡ (ḍa) doubled: ದೊಡ್ಡ (doḍḍa, big). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "ಅಲೆ ದೊಡ್ಡದು.": {"native": "The wave is big.", "bases": {}},
      "ಅವನು ಗಿಡ್ಡ.": {"native": "He is short.", "bases": {}}
    }
  "kn-0091":
    native: "tt, on the teeth (double t)"
    notes:
      "n1": "ತ (ta) doubled: ಹತ್ತು (hattu, ten). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "ಅಪಾರ್ಟ್ಮೆಂಟ್ ಎತ್ತರ.": {"native": "The building is tall.", "bases": {}},
      "ಅಳಿವು ಆಗುತ್ತಿದೆ.": {"native": "It is becoming extinct.", "bases": {"ಆಗುತ್ತಿದೆ": "is becoming"}}
    }
  "kn-0092":
    native: "dd, on the teeth (double d)"
    notes:
      "n1": "ದ (da) doubled: ಸುದ್ದಿ (suddi, news). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "kn-0093":
    native: "nn, on the teeth (double n)"
    notes:
      "n1": "ನ (na) doubled: ಅನ್ನ (anna, cooked rice). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "ಅಂಕ ಚೆನ್ನಾಗಿದೆ.": {"native": "The marks are good.", "bases": {}},
      "ಅನುವಾದ ಚೆನ್ನಾಗಿದೆ.": {"native": "The translation is good.", "bases": {}}
    }
  "kn-0094":
    native: "nn, curled back (double n)"
    notes:
      "n1": "ಣ (ṇa) doubled: ಹಣ್ಣು (haṇṇu, fruit), ಅಣ್ಣ (aṇṇa, elder brother). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "ಎಣ್ಣೆ ಕಾಯಿಸು.": {"native": "Heat the oil.", "bases": {}},
      "ಎಣ್ಣೆಯಲ್ಲಿ ಹುರಿ.": {"native": "Fry it in oil.", "bases": {"ಎಣ್ಣೆಯಲ್ಲಿ": "in oil"}}
    }
  "kn-0095":
    native: "pp (double p)"
    notes:
      "n1": "ಪ (pa) doubled: ಅಪ್ಪ (appa, father). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "ಅಪ್ಪ ಬೋಳು.": {"native": "Dad is bald.", "bases": {}},
      "ಅವನು ದಪ್ಪ.": {"native": "He is fat.", "bases": {}}
    }
  "kn-0096":
    native: "bb (double b)"
    notes:
      "n1": "ಬ (ba) doubled: ಹಬ್ಬ (habba, festival). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "ಇಬ್ಬನಿ ತಂಪು.": {"native": "Dew is cool.", "bases": {}},
      "ಗೊಬ್ಬರ ಹಾಕು.": {"native": "Put in the fertilizer.", "bases": {"ಹಾಕು": "put"}}
    }
  "kn-0097":
    native: "mm (double m)"
    notes:
      "n1": "ಮ (ma) doubled: ಅಮ್ಮ (amma, mother). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "ಇನ್ನೊಮ್ಮೆ ಹೇಳಿ.": {"native": "Please say that again.", "bases": {"ಇನ್ನೊಮ್ಮೆ": "once more", "ಹೇಳಿ": "to say; to tell"}},
      "ಎಮ್ಮೆ ದೊಡ್ಡದು.": {"native": "The buffalo is big.", "bases": {"ದೊಡ್ಡದು": "big one"}}
    }
  "kn-0098":
    native: "ll (double l)"
    notes:
      "n1": "ಲ (la) doubled: ಇಲ್ಲ (illa, no; there isn't). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "kn-0099":
    native: "ll, curled back (double l)"
    notes:
      "n1": "ಳ (ḷa) doubled: ಕಳ್ಳ (kaḷḷa, thief), ಈರುಳ್ಳಿ (īruḷḷi, onion). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "ಅದು ಸುಳ್ಳು.": {"native": "That is a lie.", "bases": {}}
    }
  "kn-0100":
    native: "yy (double y)"
    notes:
      "n1": "ಯ (ya) doubled: ಅಯ್ಯೋ (ayyō, oh no!). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "ರೈತರು ಫಸಲು ಕೊಯ್ಯುತ್ತಾರೆ.": {"native": "The farmers harvest the crop.", "bases": {"ಕೊಯ್ಯುತ್ತಾರೆ": "harvest"}}
    }
  "kn-0101":
    native: "k + the r below"
    notes:
      "n1": "ರ (ra) below a letter is a small hook: ಕ್ರಿಕೆಟ್ (krikeṭ, cricket)."
    "examples": {
      "ಕ್ರಿಕೆಟ್ ಆಡು.": {"native": "Play cricket.", "bases": {}},
      "ಕ್ರೀಡಾಂಗಣ ದೊಡ್ಡದು.": {"native": "The stadium is big.", "bases": {"ದೊಡ್ಡದು": "big"}}
    }
  "kn-0102":
    native: "p + the r below"
    notes:
      "n1": "ಪ್ರಯಾಣ (prayāṇa, journey)."
    "examples": {
      "ಪತ್ರಿಕೆ ಪ್ರಕಟಿಸುತ್ತದೆ.": {"native": "The newspaper publishes.", "bases": {"ಪ್ರಕಟಿಸುತ್ತದೆ": "publishes"}},
      "ಪ್ರತಿಮೆ ಎತ್ತರ.": {"native": "The statue is tall.", "bases": {"ಎತ್ತರ": "tall"}}
    }
  "kn-0103":
    native: "t + the r below"
    notes:
      "n1": "ರಾತ್ರಿ (rātri, night)."
    "examples": {
      "ಅಧಿಕೃತ ಪತ್ರ.": {"native": "An official letter.", "bases": {}},
      "ಆಮಂತ್ರಣ ಓದು.": {"native": "Read the invitation.", "bases": {}}
    }
  "kn-0104":
    native: "sh + the r below"
    notes:
      "n1": "ಶ್ರೀ (śrī), the respectful 'Mr' before a name."
    "examples": {
      "ಅವನು ಶ್ರೀಮಂತ.": {"native": "He is rich.", "bases": {"ಅವನು": "he"}},
      "ವಿಶ್ರಾಂತಿ ತೆಗೆದುಕೊ.": {"native": "Take rest.", "bases": {}}
    }
  "kn-0105":
    native: "v + the y below"
    notes:
      "n1": "ವ್ಯಾಪಾರ (vyāpāra, trade; business)."
    "examples": {
      "ಕಾವ್ಯ ಇಷ್ಟ.": {"native": "I like poetry.", "bases": {}},
      "ಕಾವ್ಯ ಬರೆ.": {"native": "Write poetry.", "bases": {}}
    }
  "kn-0106":
    native: "d + the y below"
    notes:
      "n1": "ವಿದ್ಯಾರ್ಥಿ (vidyārthi, student)."
    "examples": {
      "ಉದ್ಯಮ ದೊಡ್ಡದು.": {"native": "The business is big.", "bases": {}},
      "ಉದ್ಯಮಿ ಬಂದ.": {"native": "The businessman came.", "bases": {}}
    }
  "kn-0107":
    native: "k + sh"
    notes:
      "n1": "Counted as a letter of its own in the alphabet chart: ಕ್ಷಮಿಸಿ (kṣamisi, sorry)."
    "examples": {
      "ಅಕ್ಷತೆ ಕೊಡು.": {"native": "Give the blessing rice.", "bases": {}},
      "ಅಕ್ಷರ ಕಲಿ.": {"native": "Learn the letters.", "bases": {}}
    }
  "kn-0108":
    native: "s + t"
    notes:
      "n1": "ರಸ್ತೆ (raste, road)."
    "examples": {
      "ಆಸಕ್ತಿ ಜಾಸ್ತಿ.": {"native": "The interest is strong.", "bases": {}},
      "ಇದು ಪುಸ್ತಕ.": {"native": "This is a book.", "bases": {"ಇದು": "this"}}
    }
  "kn-0109":
    native: "s + th"
    notes:
      "n1": "ಸ್ಥಳ (sthaḷa, place)."
    "examples": {
      "ನಾನು ಸ್ವಸ್ಥ.": {"native": "I am well.", "bases": {}},
      "ಪ್ರೇಕ್ಷಣೀಯ ಸ್ಥಳ.": {"native": "A place worth seeing.", "bases": {}}
    }
  "kn-0110":
    native: "sh + curled-back t"
    notes:
      "n1": "ಇಷ್ಟ (iṣṭa, liking): ನನಗೆ ಇಷ್ಟ (nanage iṣṭa), I like it."
    "examples": {
      "ಅಷ್ಟು ಬೇಡ.": {"native": "Not that much.", "bases": {"ಬೇಡ": "do not want"}},
      "ಇದು ಎಷ್ಟು?": {"native": "How much is it?", "bases": {"ಇದು": "this"}}
    }
  "kn-0111":
    native: "r + k (r written after)"
    notes:
      "n1": "An r before another consonant is not written below it but after it, as a small mark, the arkavottu: ಸರ್ಕಾರ (sarkāra, government), ಕರ್ನಾಟಕ (karnāṭaka)."
    "examples": {
      "ನೆಟ್ವರ್ಕ್ ಇಲ್ಲ.": {"native": "There is no network.", "bases": {}},
      "ನೆಟ್ವರ್ಕ್ ಚೆನ್ನಾಗಿದೆ.": {"native": "The network is good.", "bases": {}}
    }
