cards:
  "kn-7814":
    notes:
      "n1": "ನನ್ನನ್ನು (nannannu) is the object form of ನಾನು (nānu), I, as in 'the doctor examines me'."
    native: "The doctor examines me."
  "kn-7815":
    notes:
      "n1": "ತಿನ್ನಿ (tinni) is the polite command of ತಿನ್ನು (tinnu), eat or take."
    native: "Take the tablet."
  "kn-7816":
    notes:
      "n1": "ತೊಳೆಯಿರಿ (toḷeyiri) is the polite command of ತೊಳೆ (toḷe), wash, with the ending -ಇರಿ (-iri)."
    native: "Wash the wound."
  "kn-7817":
    notes:
      "n1": "ವಿಶ್ರಾಂತಿ ಮಾಡು (viśrānti māḍu) is 'to rest', and ಮಾಡಿ (māḍi) is its polite command."
    native: "Please rest."
  "kn-7818":
    notes:
      "n1": "ಹುಷಾರಿಲ್ಲ (huṣārilla) is the usual way to say 'not well', with ನನಗೆ (nanage), to me."
    native: "I am not well today."
  "kn-7819":
    notes:
      "n1": "ಗುಣವಾಗು (guṇavāgu) is 'get well', from ಆಗು (āgu), become; ಬೇಗ (bēga), soon, goes with it."
    native: "You will get well soon."
  "kn-7820":
    native: "The headache is worse now."
  "kn-7821":
    native: "Drink the syrup."
