schema: 1
id: "kn-en-services"
kind: "layer"
core: "kn-services"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Services: bank, post, repair and tailor"
license: "CC-BY-SA-4.0"
description: "Services in a town: the bank and the account, the post and the parcel, repairs and the tailor who sews clothes. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1402":
    native: "account"
    notes:
      "n1": "A bank account, in which your money is kept."
    examples:
      "ನನ್ನ ಖಾತೆ ಇದೆ.": { native: "I have an account.", bases: { "ಇದೆ": "have" } }
      "ಖಾತೆ ತೆರೆ.": "Open an account."
  "kn-1403":
    native: "signature"
    notes:
      "n1": "A signature, your name written by hand on a paper."
    examples:
      "ಇಲ್ಲಿ ಸಹಿ ಮಾಡು.": "Sign here."
      "ಸಹಿ ಬೇಕು.": "A signature is needed."
  "kn-1404":
    native: "application, form"
    notes:
      "n1": "An application form, which you fill in to ask for something."
    examples:
      "ಅರ್ಜಿ ತುಂಬು.": "Fill in the form."
      "ಅರ್ಜಿ ಬೇಕು.": "I need an application."
  "kn-1405":
    native: "letter"
    notes:
      "n1": "A letter, written and sent by post."
    examples:
      "ಪತ್ರ ಬರೆ.": "Write a letter."
      "ಪತ್ರ ಬಂತು.": "A letter came."
  "kn-1406":
    native: "parcel"
    notes:
      "n1": "A parcel, a package sent by post or by bus."
    examples:
      "ಪಾರ್ಸೆಲ್ ಕಳುಹಿಸು.": "Send the parcel."
      "ಪಾರ್ಸೆಲ್ ಭಾರ ಇದೆ.": { native: "The parcel is heavy.", bases: { "ಇದೆ": "is" } }
  "kn-1407":
    native: "stamp"
    notes:
      "n1": "A postage stamp, stuck on a letter."
    examples:
      "ಸ್ಟ್ಯಾಂಪ್ ಬೇಕು.": "I need a stamp."
      "ಸ್ಟ್ಯಾಂಪ್ ಹಚ್ಚು.": { native: "Stick the stamp on.", bases: { "ಹಚ್ಚು": "stick" } }
  "kn-1408":
    native: "repair"
    notes:
      "n1": "A repair, when something broken is fixed."
    examples:
      "ದುರಸ್ತಿ ಮಾಡು.": "Repair it."
      "ದುರಸ್ತಿ ಬೇಕು.": "Repair is needed."
  "kn-1409":
    native: "repair, fixing"
    notes:
      "n1": "Repair, the work of fixing a thing."
    examples:
      "ರಿಪೇರಿ ಬೇಕು.": "Repair is needed."
      "ಫೋನ್ ರಿಪೇರಿ ಮಾಡು.": "Repair the phone."
  "kn-1410":
    native: "to sew"
    notes:
      "n1": "To sew cloth with a needle and thread."
    examples:
      "ಬಟ್ಟೆ ಹೊಲಿ.": "Sew the cloth."
      "ಅವಳು ಬಟ್ಟೆ ಹೊಲಿದಳು.": { native: "She sewed the cloth.", bases: { "ಹೊಲಿದಳು": "sewed" } }
  "kn-1411":
    native: "tailor"
    notes:
      "n1": "A tailor, who sews clothes for people."
    examples:
      "ಟೈಲರ್ ಎಲ್ಲಿ?": "Where is the tailor?"
      "ಟೈಲರ್ ಬಟ್ಟೆ ಹೊಲಿದರು.": { native: "The tailor sewed the cloth.", bases: { "ಹೊಲಿದರು": "sewed" } }
  "kn-1412":
    native: "electrician"
    notes:
      "n1": "An electrician, who mends the wiring and lights."
    examples:
      "ಎಲೆಕ್ಟ್ರೀಷಿಯನ್ ಬಂದ.": "The electrician came."
      "ಎಲೆಕ್ಟ್ರೀಷಿಯನ್ ಬೇಕು.": "I need an electrician."
  "kn-1413":
    native: "service"
    notes:
      "n1": "A service, help given for a fee or for free."
    examples:
      "ಸೇವೆ ಚೆನ್ನಾಗಿದೆ.": "The service is good."
      "ಈ ಸೇವೆ ಬೇಕು.": "I need this service."
  "kn-1414":
    native: "fee, charge"
    notes:
      "n1": "A fee, the money paid for a service."
    examples:
      "ಶುಲ್ಕ ಎಷ್ಟು?": "What is the fee?"
      "ಶುಲ್ಕ ಕೊಡು.": "Pay the fee."
  "kn-1415":
    native: "queue"
    notes:
      "n1": "A queue, a line of people waiting."
    examples:
      "ಕ್ಯೂ ದೊಡ್ಡದು.": "The queue is long."
      "ಕ್ಯೂ ಇದೆ.": { native: "There is a queue.", bases: { "ಇದೆ": "there is" } }
  "kn-1416":
    native: "advice"
    notes:
      "n1": "Advice, what someone says you should do."
    examples:
      "ಸಲಹೆ ಕೊಡು.": "Give advice."
      "ಅವನ ಸಲಹೆ ಒಳ್ಳೆಯದು.": "His advice is good."
