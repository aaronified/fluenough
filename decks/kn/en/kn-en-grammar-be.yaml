  name: "ಇರು (iru) by tense"
  slot_name: "person"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "iddeene": "to be (somewhere), now"
    "idde": "to be (somewhere), in the past"
    "irutteene": "to be, as a habit or later"
    "aade": "to become; to happen (past)"
  notes: "ಇರು (iru) says where or how someone is: ನಾನು ಮನೆಯಲ್ಲಿ ಇದ್ದೇನೆ (nānu maneyalli iddēne), I'm at home. To say what someone is, Kannada needs no verb: ಅವರು ಡಾಕ್ಟರ್ (avaru ḍākṭar), he's a doctor. 'Is not somewhere' is ಇಲ್ಲ (illa), the same for everyone: ನಾನು ಮನೆಯಲ್ಲಿ ಇಲ್ಲ (nānu maneyalli illa), I'm not at home. 'Is not something' is ಅಲ್ಲ (alla), also the same for everyone: ಇದು ನೀರು ಅಲ್ಲ (idu nīru alla), this isn't water. ಆಗು (āgu), to become, says what someone became: ಅವನು ಡಾಕ್ಟರ್ ಆದ (avanu ḍākṭar āda), he became a doctor. The verb agrees with the doer's person and number. In the third person a man, a woman and a thing each have a form of their own: ಅವನು ಬಂದನು (avanu bandanu), ಅವಳು ಬಂದಳು (avaḷu bandaḷu), ಅದು ಬಂತು (adu bantu). ನೀವು (nīvu), plural or respectful, takes the plural, and so does ಅವರು (avaru), they, or he or she with respect. Where two forms are given, the first is written Kannada and the second everyday speech; both are accepted."
