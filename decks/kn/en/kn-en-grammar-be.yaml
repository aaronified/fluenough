name: "To be: ಇರು (iru), ಇಲ್ಲ (illa) and ಅಲ್ಲ (alla)"
license: "CC0-1.0"
description: "Is, was, will be: ಇರು (iru) for where and how things are, no verb at all for what someone is, ಇಲ್ಲ (illa) and ಅಲ್ಲ (alla) for not, and ಆಗು (āgu) for became. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
