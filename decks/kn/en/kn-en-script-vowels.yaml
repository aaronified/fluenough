schema: 1
id: "kn-en-script-vowels"
kind: "layer"
core: "kn-script-vowels"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kannada vowels"
license: "CC-BY-SA-4.0"
description: "The vowels as they are written on their own, at the start of a word. In Kannada a short and a long vowel are different sounds, e and o included. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0001":
    native: "a, short (the vowel every consonant carries)"
    notes:
      "n1": "Like the 'u' of 'but'. Every consonant carries it unless a sign changes it: ಕ (ka) is 'ka'. ಅಮ್ಮ (amma, mother)."
    "examples": {
      "ಅರ್ಜಿ ತುಂಬು.": {"native": "Fill in the form.", "bases": {}},
      "ಅವನು ಇಡುತ್ತಾನೆ.": {"native": "He puts.", "bases": {"ಇಡುತ್ತಾನೆ": "puts"}}
    }
  "kn-0002":
    native: "aa, long"
    notes:
      "n1": "The 'a' of 'father', held about twice as long as ಅ (a). Short and long change the word in Kannada: ಆನೆ (āne, elephant)."
    "examples": {
      "ಅವರು ಆರಂಭಿಸುತ್ತಾರೆ.": {"native": "They begin.", "bases": {"ಆರಂಭಿಸುತ್ತಾರೆ": "begin"}},
      "ಆಂಬುಲೆನ್ಸ್ ಕರೆ.": {"native": "Call the ambulance.", "bases": {}}
    }
  "kn-0003":
    native: "i, short"
    notes:
      "n1": "Like the 'i' of 'sit': ಇಲಿ (ili, mouse)."
    "examples": {
      "ಅವರು ಇಡುತ್ತಾರೆ.": {"native": "They put.", "bases": {"ಇಡುತ್ತಾರೆ": "put"}},
      "ಆತಂಕ ಇದೆ.": {"native": "There is anxiety.", "bases": {"ಇದೆ": "there is"}}
    }
  "kn-0004":
    native: "ii, long"
    notes:
      "n1": "The 'ee' of 'see', held longer than ಇ (i): ಈರುಳ್ಳಿ (īruḷḷi, onion)."
    "examples": {
      "ನದಿಯಲ್ಲಿ ಈಜುತ್ತಾರೆ.": {"native": "They swim in the river.", "bases": {"ನದಿಯಲ್ಲಿ": "in the river", "ಈಜುತ್ತಾರೆ": "to swim"}},
      "ಅವಳು ಈರುಳ್ಳಿ ಕತ್ತರಿಸುತ್ತಾಳೆ.": {"native": "She cuts the onion.", "bases": {"ಈರುಳ್ಳಿ": "onion", "ಕತ್ತರಿಸುತ್ತಾಳೆ": "to cut", "ಅವಳು": "she"}}
    }
  "kn-0005":
    native: "u, short"
    notes:
      "n1": "Like the 'u' of 'put': ಉಪ್ಪು (uppu, salt). A great many Kannada words end in this short u, and it is said."
    "examples": {
      "ಅವನು ಉಳುತ್ತಾನೆ.": {"native": "He ploughs.", "bases": {"ಉಳುತ್ತಾನೆ": "ploughs"}},
      "ಅವನು ಉಸಿರಾಡುತ್ತಾನೆ.": {"native": "He breathes.", "bases": {"ಉಸಿರಾಡುತ್ತಾನೆ": "breathes"}}
    }
  "kn-0006":
    native: "uu, long"
    notes:
      "n1": "The 'oo' of 'food', held longer than ಉ (u): ಊರು (ūru, town; home town)."
    "examples": {
      "ಅತಿಥಿಗೆ ಊಟ ಕೊಡು.": {"native": "Give the guest a meal.", "bases": {"ಅತಿಥಿಗೆ": "to the guest"}},
      "ಅವನು ಊಟ ಮಾಡಿದನು.": {"native": "He had his meal.", "bases": {"ಊಟ": "meal", "ಮಾಡಿದನು": "to do"}}
    }
  "kn-0007":
    native: "ru (a vowel letter)"
    notes:
      "n1": "Said 'ru', though it is written as one vowel, in words from Sanskrit: ಋಷಿ (ruṣi, sage). A recogniser writes 'ru' as ರು (ru), so it is drilled by reading and writing only."
    "examples": {
      "ಇದು ಯಾವ ಋತು?": {"native": "Which season is this?", "bases": {}},
      "ಈಗ ಮಳೆ ಋತು.": {"native": "It is the rainy season now.", "bases": {}}
    }
  "kn-0008":
    native: "e, short"
    notes:
      "n1": "Like the 'e' of 'pet', short. English has no short and long e; Kannada does: ಎಲೆ (ele, leaf)."
    "examples": {
      "ಅವನು ಎಳೆಯುತ್ತಾನೆ.": {"native": "He pulls.", "bases": {"ಎಳೆಯುತ್ತಾನೆ": "pulls"}},
      "ಅವನು ಎಸೆಯುತ್ತಾನೆ.": {"native": "He throws.", "bases": {"ಎಸೆಯುತ್ತಾನೆ": "throws"}}
    }
  "kn-0009":
    native: "ee, long"
    notes:
      "n1": "The 'ay' of 'say' held long, without the glide English adds: ಏಳು (ēḷu, seven)."
    "examples": {
      "ಏನೋ ಆಯಿತು.": {"native": "Something happened.", "bases": {"ಆಯಿತು": "to happen"}},
      "ಕಾರಣ ಏನು?": {"native": "What is the reason?", "bases": {}}
    }
  "kn-0010":
    native: "ai (as in 'kite')"
    notes:
      "n1": "A glide from a to i, like the 'i' of 'kite': ಐದು (aidu, five)."
    "examples": {
      "ಐವತ್ತು ಗ್ರಾಂ ಉಪ್ಪು ಹಾಕಿ.": {"native": "Add fifty grams of salt.", "bases": {"ಐವತ್ತು": "fifty", "ಉಪ್ಪು": "salt", "ಹಾಕಿ": "to add"}},
      "ಸಮಿತಿಯಲ್ಲಿ ಐದು ಜನ ಇದ್ದಾರೆ.": {"native": "There are five people in the committee.", "bases": {"ಸಮಿತಿಯಲ್ಲಿ": "in the committee", "ಇದ್ದಾರೆ": "there are"}}
    }
  "kn-0011":
    native: "o, short"
    notes:
      "n1": "Like a short 'o' of 'go', with no glide. Kannada has short and long o: ಒಂದು (ondu, one)."
    "examples": {
      "ಅವನು ಒಡೆಯುತ್ತಾನೆ.": {"native": "He breaks.", "bases": {"ಒಡೆಯುತ್ತಾನೆ": "breaks"}},
      "ಅವನು ಒದೆಯುತ್ತಾನೆ.": {"native": "He kicks.", "bases": {"ಒದೆಯುತ್ತಾನೆ": "kicks"}}
    }
  "kn-0012":
    native: "oo, long"
    notes:
      "n1": "The 'o' of 'go' held long, without the glide English adds: ಓದು (ōdu, read)."
    "examples": {
      "ಉಪಶೀರ್ಷಿಕೆ ಓದು.": {"native": "Read the subtitle.", "bases": {}},
      "ಓದುಗ ಬಂದ.": {"native": "The reader came.", "bases": {}}
    }
  "kn-0013":
    native: "au (as in 'cow')"
    notes:
      "n1": "A glide from a to u, like the 'ow' of 'cow', mostly in words from Sanskrit: ಔಷಧ (auṣadha, medicine)."
    "examples": {
      "ಔಷಧಕ್ಕೆ ಅಲರ್ಜಿ ಇಲ್ಲ.": {"native": "There is no allergy to the medicine.", "bases": {"ಔಷಧಕ್ಕೆ": "to the medicine"}},
      "ಔಷಧಾಲಯ ಬೆಳಿಗ್ಗೆ ತೆರೆಯುತ್ತದೆ.": {"native": "The pharmacy opens in the morning.", "bases": {"ಬೆಳಿಗ್ಗೆ": "in the morning", "ತೆರೆಯುತ್ತದೆ": "to open"}}
    }
