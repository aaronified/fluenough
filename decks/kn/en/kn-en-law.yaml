schema: 1
id: "kn-en-law"
kind: "layer"
core: "kn-law"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Law: police, courts, rights and the rules"
license: "CC-BY-SA-4.0"
description: "Law and the courts: the lawyer and the judge, the complaint and the case, crime and theft, and the punishment. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1622":
    native: "law"
    notes:
      "n1": "The law, the rules made by a state or a country."
    examples:
      "ಕಾನೂನು ಬೇಕು.": "The law is needed."
      "ಕಾನೂನು ಇದೆ.": { native: "There is a law.", bases: { "ಇದೆ": "there is" } }
  "kn-1623":
    native: "judge"
    notes:
      "n1": "A judge, who decides a case in a court."
    examples:
      "ನ್ಯಾಯಾಧೀಶರು ಬಂದರು.": { native: "The judge came.", bases: { "ನ್ಯಾಯಾಧೀಶರು": "the judge" } }
      "ನ್ಯಾಯಾಧೀಶರು ತೀರ್ಪು ಕೊಟ್ಟರು.": { native: "The judge gave a verdict.", bases: { "ನ್ಯಾಯಾಧೀಶರು": "the judge" } }
  "kn-1624":
    native: "crime"
    notes:
      "n1": "A crime, an act that breaks the law."
    examples:
      "ಅಪರಾಧ ಆಯಿತು.": "A crime happened."
      "ಅಪರಾಧ ಬೇಡ.": "No crime."
  "kn-1625":
    native: "criminal"
    notes:
      "n1": "A criminal, a person who has committed a crime."
    examples:
      "ಅಪರಾಧಿ ಓಡಿದ.": "The criminal ran."
      "ಅಪರಾಧಿ ಜೈಲಿನಲ್ಲಿ ಇದ್ದಾನೆ.": { native: "The criminal is in jail.", bases: { "ಜೈಲಿನಲ್ಲಿ": "in jail", "ಇದ್ದಾನೆ": "is" } }
  "kn-1626":
    native: "thief"
    notes:
      "n1": "A thief, a person who steals."
    examples:
      "ಕಳ್ಳ ಬಂದ.": "The thief came."
      "ಕಳ್ಳ ಓಡಿದ.": "The thief ran away."
  "kn-1627":
    native: "theft"
    notes:
      "n1": "Theft, the crime of stealing."
    examples:
      "ಕಳ್ಳತನ ಆಯಿತು.": "A theft happened."
      "ಕಳ್ಳತನ ಬೇಡ.": "No theft."
  "kn-1628":
    native: "complaint"
    notes:
      "n1": "A complaint, to the police or an office, about a wrong."
    examples:
      "ದೂರು ಕೊಡು.": "Give a complaint."
      "ದೂರು ಬರೆ.": "Write a complaint."
  "kn-1629":
    native: "charge, accusation"
    notes:
      "n1": "A charge, an accusation that someone did a crime."
    examples:
      "ಆರೋಪ ಇದೆ.": { native: "There is a charge.", bases: { "ಇದೆ": "there is" } }
      "ಆರೋಪ ಸುಳ್ಳು.": "The charge is false."
  "kn-1630":
    native: "jail"
    notes:
      "n1": "A jail, where criminals are kept."
    examples:
      "ಜೈಲು ದೂರ ಇದೆ.": { native: "The jail is far.", bases: { "ಇದೆ": "is" } }
      "ಜೈಲಿನಲ್ಲಿ ಇದ್ದಾನೆ.": { native: "He is in jail.", bases: { "ಜೈಲಿನಲ್ಲಿ": "in jail", "ಇದ್ದಾನೆ": "is" } }
  "kn-1631":
    native: "arrest"
    notes:
      "n1": "An arrest, when the police hold a person."
    examples:
      "ಬಂಧನ ಆಯಿತು.": "An arrest was made."
      "ಬಂಧನ ಬೇಡ.": "No arrest."
  "kn-1632":
    native: "verdict, judgement"
    notes:
      "n1": "A verdict, the decision of a judge in a case."
    examples:
      "ತೀರ್ಪು ಬಂತು.": "The verdict came."
      "ತೀರ್ಪು ಸರಿ.": "The verdict is right."
  "kn-1633":
    native: "punishment, sentence"
    notes:
      "n1": "A punishment, given to a person who did wrong."
    examples:
      "ಶಿಕ್ಷೆ ಕೊಟ್ಟರು.": "They gave a punishment."
      "ಶಿಕ್ಷೆ ಬೇಡ.": "No punishment."
  "kn-1634":
    native: "case"
    notes:
      "n1": "A case in a court, a matter for a judge."
    examples:
      "ಕೇಸ್ ಇದೆ.": { native: "There is a case.", bases: { "ಇದೆ": "there is" } }
      "ಕೇಸ್ ಯಾವಾಗ?": "When is the case?"
