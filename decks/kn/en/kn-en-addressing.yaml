schema: 1
id: "kn-en-addressing"
kind: "layer"
core: "kn-addressing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Addressing people"
license: "CC0-1.0"
description: "What to call a shopkeeper, a driver or an older woman: Kannada speakers address strangers as family. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0061":
    native: "elder brother; to a man a little older"
    notes:
      "n1": "Said to a driver or a shopkeeper about your age or a little older: ಅಣ್ಣಾ (aṇṇā), ಎಷ್ಟು (eṣṭu)? How much, brother?"
  "kn-0060":
    native: "elder sister; to a woman a little older"
    notes:
      "n1": "Said to a woman a little older, a stallholder, a nurse: ಅಕ್ಕಾ (akkā), ಇದು ಎಷ್ಟು (idu eṣṭu)?"
  "kn-0186":
    native: "younger brother; to a younger man"
    notes:
      "n1": "Said kindly to a boy or a younger man, such as a waiter: ತಮ್ಮಾ (tammā), ಒಂದು ಕಾಫಿ (ondu kāfi). One coffee, brother."
  "kn-0187":
    native: "younger sister; to a younger woman"
  "kn-0188":
    native: "Mr; Ms (after a name, respectful)"
    notes:
      "n1": "Put after a name for respect: ರಾಮು ಅವರು (rāmu avaru), Mr Ramu. On its own ಅವರು (avaru) is 'he' or 'she' with respect, and 'they'."
  "kn-0189":
    native: "a word of respect, after a word or a call"
    notes:
      "n1": "Added to a call or a reply to make it polite: ಏನ್ರೀ? (enri?), yes?; ಬನ್ನಿ ರೀ (banni rī), please come. Between a married couple it is also how a wife traditionally calls her husband."
  "kn-0190":
    native: "sir"
    notes:
      "n1": "Very common, to anyone in an office, a teacher, an official."
  "kn-0191":
    native: "madam"
  "kn-0192":
    native: "sir (traditional)"
    notes:
      "n1": "An older, respectful way to address a man, heard in the villages and from older people. It also means 'lord' and 'swami'."
  "kn-0193":
    native: "aunty; to an older woman"
    notes:
      "n1": "Common in the cities. Many people simply say ಅಮ್ಮ (amma), mother, to an older woman."
  "kn-0194":
    native: "grandmother; to an old woman"
    notes:
      "n1": "Said kindly to any old woman, such as a flower seller."
  "kn-0195":
    native: "friend (a man)"
    notes:
      "n1": "A woman friend is ಗೆಳತಿ (geḷati). The formal word is ಸ್ನೇಹಿತ (snēhita)."
