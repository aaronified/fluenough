schema: 1
id: "kn-en-describing"
kind: "layer"
core: "kn-describing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing things and feelings"
license: "CC-BY-SA-4.0"
description: "How things and people are: their size, how they taste, how they feel. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-0715":
    native: "cold"
    notes:
      "n1": "Of water, food or the weather: ತಣ್ಣನೆಯ ನೀರು (taṇṇaneya nīru), cold water."
    examples:
      "ಈ ನೀರು ತಣ್ಣಗಿದೆ.": { native: "This water is cold.", bases: { "ಈ": "this", "ನೀರು": "water", "ತಣ್ಣಗಿದೆ": "to be cold" } }
      "ತಣ್ಣನೆಯ ಹಾಲು ಕುಡಿಯಿರಿ.": { native: "Drink cold milk.", bases: { "ಹಾಲು": "milk", "ಕುಡಿಯಿರಿ": "to drink" } }
  "kn-0716":
    native: "dirty"
    notes:
      "n1": "The opposite is ಸ್ವಚ್ಛ (svaccha), clean."
    examples:
      "ಈ ಕೋಣೆ ಕೊಳಕು ಇದೆ.": { native: "This room is dirty.", bases: { "ಈ": "this", "ಕೋಣೆ": "room", "ಇದೆ": "to be" } }
      "ನನ್ನ ಬಟ್ಟೆ ಕೊಳಕಾಗಿದೆ.": { native: "My clothes are dirty.", bases: { "ನನ್ನ": "my", "ಬಟ್ಟೆ": "cloth; clothes", "ಕೊಳಕಾಗಿದೆ": "dirty" } }
  "kn-0717":
    native: "easy"
    notes:
      "n1": "The opposite is ಕಷ್ಟ (kaṣṭa), difficult."
    examples:
      "ಇದು ಸುಲಭ ಪ್ರಶ್ನೆ.": { native: "This is an easy question.", bases: { "ಇದು": "this", "ಪ್ರಶ್ನೆ": "question" } }
      "ಕನ್ನಡ ಕಲಿಯುವುದು ಸುಲಭ.": { native: "Learning Kannada is easy.", bases: { "ಕನ್ನಡ": "Kannada", "ಕಲಿಯುವುದು": "learning" } }
  "kn-0718":
    native: "difficult; hard"
    notes:
      "n1": "The opposite is ಸುಲಭ (sulabha), easy."
    examples:
      "ಈ ಕೆಲಸ ಕಷ್ಟ.": { native: "This work is difficult.", bases: { "ಈ": "this", "ಕೆಲಸ": "work" } }
      "ಗಣಿತ ಕಷ್ಟ.": { native: "Maths is difficult.", bases: { "ಗಣಿತ": "maths" } }
  "kn-0719":
    native: "tall; high"
    notes:
      "n1": "For people and things: ಎತ್ತರ ಮರ (ettara mara), a tall tree."
    examples:
      "ಆ ಮರ ಎತ್ತರ ಇದೆ.": { native: "That tree is tall.", bases: { "ಆ": "that", "ಮರ": "tree", "ಇದೆ": "to be" } }
      "ಅವನು ಎತ್ತರ ಮನುಷ್ಯ.": { native: "He is a tall man.", bases: { "ಮನುಷ್ಯ": "man", "ಅವನು": "he" } }
  "kn-0720":
    native: "heavy"
    notes:
      "n1": "The opposite is ಹಗುರ (hagura), light."
    examples:
      "ಈ ಪೆಟ್ಟಿಗೆ ಭಾರ ಇದೆ.": { native: "This box is heavy.", bases: { "ಈ": "this", "ಪೆಟ್ಟಿಗೆ": "box", "ಇದೆ": "to be" } }
      "ಈ ಚೀಲ ಭಾರ.": { native: "This bag is heavy.", bases: { "ಈ": "this", "ಚೀಲ": "bag" } }
  "kn-0721":
    native: "light (not heavy)"
    notes:
      "n1": "The opposite is ಭಾರ (bhāra), heavy."
    examples:
      "ಈ ಚೀಲ ಹಗುರ ಇದೆ.": { native: "This bag is light.", bases: { "ಈ": "this", "ಚೀಲ": "bag", "ಇದೆ": "to be" } }
      "ಹಗುರ ಊಟ ಮಾಡು.": { native: "Eat a light meal.", bases: { "ಊಟ": "meal", "ಮಾಡು": "to do" } }
  "kn-0722":
    native: "happy; joyful"
    notes:
      "n1": "Also ಸಂತೋಷ (santōṣa) is the word for joy: ಸಂತೋಷದಿಂದ (santōṣadinda), happily."
    examples:
      "ಅವಳು ಸಂತೋಷ ಆಗಿದ್ದಾಳೆ.": { native: "She is happy.", bases: { "ಆಗಿದ್ದಾಳೆ": "to be", "ಅವಳು": "she" } }
      "ಮಕ್ಕಳು ಸಂತೋಷದಿಂದ ಆಡುತ್ತಾರೆ.": { native: "The children play happily.", bases: { "ಮಕ್ಕಳು": "children", "ಸಂತೋಷದಿಂದ": "happily", "ಆಡುತ್ತಾರೆ": "to play" } }
  "kn-0723":
    native: "sad"
    notes:
      "n1": "The opposite is ಸಂತೋಷ (santōṣa), happy."
    examples:
      "ಅವನು ದುಃಖ ಆಗಿದ್ದಾನೆ.": { native: "He is sad.", bases: { "ಆಗಿದ್ದಾನೆ": "to be", "ಅವನು": "he" } }
      "ಅಮ್ಮ ದುಃಖದಲ್ಲಿ ಇದ್ದಾಳೆ.": { native: "Mother is in sorrow.", bases: { "ಅಮ್ಮ": "mother", "ದುಃಖದಲ್ಲಿ": "in sorrow", "ಇದ್ದಾಳೆ": "to be" } }
  "kn-0724":
    native: "tired"
    notes:
      "n1": "The verb is ದಣಿ (daṇi), to be tired."
    examples:
      "ನಾನು ದಣಿದಿದ್ದೇನೆ.": { native: "I am tired.", bases: { "ದಣಿದಿದ್ದೇನೆ": "to be tired", "ನಾನು": "I" } }
      "ಅವರು ದಣಿದಿದ್ದಾರೆ.": { native: "They are tired.", bases: { "ದಣಿದಿದ್ದಾರೆ": "to be tired" } }
  "kn-0725":
    native: "hungry"
    notes:
      "n1": "Hunger is ಹಸಿವು (hasivu): ನನಗೆ ಹಸಿವು ಆಗಿದೆ (nanage hasivu āgide), I am hungry."
    examples:
      "ನನಗೆ ಹಸಿವು ಆಗಿದೆ.": { native: "I am hungry.", bases: { "ನನಗೆ": "to me", "ಹಸಿವು": "hunger", "ಆಗಿದೆ": "to be" } }
      "ಮಗು ಹಸಿದಿದೆ.": { native: "The child is hungry.", bases: { "ಮಗು": "child", "ಹಸಿದಿದೆ": "to be hungry" } }
  "kn-0726":
    native: "angry"
    notes:
      "n1": "The word for anger is also ಕೋಪ (kōpa): ಕೋಪದಲ್ಲಿ ಇದ್ದಾರೆ (kōpadalli iddāre), are angry."
    examples:
      "ಅಪ್ಪ ಕೋಪದಲ್ಲಿ ಇದ್ದಾರೆ.": { native: "Father is angry.", bases: { "ಅಪ್ಪ": "father", "ಕೋಪದಲ್ಲಿ": "in anger", "ಇದ್ದಾರೆ": "to be" } }
      "ಅವನು ಕೋಪ ಮಾಡಿಕೊಂಡ.": { native: "He got angry.", bases: { "ಮಾಡಿಕೊಂಡ": "to get", "ಅವನು": "he" } }
  "kn-0727":
    native: "excited; enthusiastic"
    notes:
      "n1": "The word for enthusiasm is also ಉತ್ಸಾಹ (utsāha)."
    examples:
      "ಮಕ್ಕಳು ಉತ್ಸಾಹದಿಂದ ಇವೆ.": { native: "The children are excited.", bases: { "ಮಕ್ಕಳು": "children", "ಉತ್ಸಾಹದಿಂದ": "with enthusiasm", "ಇವೆ": "to be" } }
      "ಅವನು ಉತ್ಸಾಹ ತೋರಿಸುತ್ತಾನೆ.": { native: "He shows enthusiasm.", bases: { "ತೋರಿಸುತ್ತಾನೆ": "to show", "ಅವನು": "he" } }
  "kn-0728":
    native: "rich"
    notes:
      "n1": "The opposite is ಬಡ (baḍa), poor."
    examples:
      "ಅವನು ಶ್ರೀಮಂತ.": { native: "He is rich.", bases: { "ಅವನು": "he" } }
      "ಶ್ರೀಮಂತ ಮನೆ ದೊಡ್ಡದು.": { native: "A rich person's house is big.", bases: { "ಮನೆ": "house", "ದೊಡ್ಡದು": "big" } }
  "kn-0729":
    native: "poor"
    notes:
      "n1": "The opposite is ಶ್ರೀಮಂತ (śrīmanta), rich."
    examples:
      "ಅವರು ಬಡವರು.": { native: "They are poor.", bases: { "ಬಡವರು": "poor people" } }
      "ಬಡ ಮಕ್ಕಳು ಶಾಲೆಗೆ ಹೋಗುತ್ತಾರೆ.": { native: "Poor children go to school.", bases: { "ಮಕ್ಕಳು": "children", "ಶಾಲೆಗೆ": "to school", "ಹೋಗುತ್ತಾರೆ": "to go" } }
  "kn-0730":
    native: "bitter"
    notes:
      "n1": "Bitter tastes: ಕಹಿ ಬೇವು (kahi bēvu), bitter neem."
    examples:
      "ಈ ಹಣ್ಣು ಕಹಿ.": { native: "This fruit is bitter.", bases: { "ಈ": "this", "ಹಣ್ಣು": "fruit" } }
      "ಬೇವು ಕಹಿ.": { native: "Neem is bitter.", bases: { "ಬೇವು": "neem" } }
  "kn-0731":
    native: "sour"
    notes:
      "n1": "Sour tastes: ಹುಳಿ ಮೊಸರು (huḷi mosaru), sour curd."
    examples:
      "ಈ ಮಾವಿನಕಾಯಿ ಹುಳಿ.": { native: "This raw mango is sour.", bases: { "ಈ": "this", "ಮಾವಿನಕಾಯಿ": "raw mango" } }
      "ಮೊಸರು ಹುಳಿ ಇದೆ.": { native: "The curd is sour.", bases: { "ಮೊಸರು": "curd", "ಇದೆ": "to be" } }
