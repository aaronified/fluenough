description: "Phrases and words for a meal in a restaurant: the table, the order, the bill and the card."
cards:
  "kn-6560":
    native: "We need a table for two."
    notes: { n1: "ಇಬ್ಬರಿಗೆ (ibbarige) means for two people: ಇಬ್ಬರು (ibbaru) is the form for two persons, and it takes -ಗೆ (-ge)." }
  "kn-6561":
    native: "Please give us the menu."
  "kn-6562":
    native: "What is special here?"
  "kn-6563":
    native: "Please give me a masala dosa."
  "kn-6564":
    native: "Please give us drinking water."
  "kn-6565":
    native: "Please give us one more plate."
  "kn-6566":
    native: "It is very tasty."
  "kn-6567":
    native: "Can I pay by card?"
    notes: { n1: "ಕಾರ್ಡಿನಲ್ಲಿ (kārḍinalli) is ಕಾರ್ಡ್ (kārḍ), card, with -ಇನ್ (-in) added before -ಅಲ್ಲಿ (-alli), as a loanword ending in a consonant often takes it." }
  "kn-6568":
    native: "Sorry, we do not have that now."
