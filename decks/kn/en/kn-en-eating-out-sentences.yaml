schema: 1
id: "kn-en-eating-out-sentences"
kind: "layer"
core: "kn-eating-out-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Eating out: sentences"
description: "Sentences at a restaurant: ordering coffee, tea and a meal, asking for less spice and asking the price. They use the words of the eating-out unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8201":
    notes:
      "n1": "ಒಂದು (ondu), one, goes before the noun; ಕೊಡಿ (koḍi) is the polite 'give', while ಕೊಡು (koḍu) is for friends."
    native: "Give me one coffee."
    bases:
      "ನನಗೆ": "I, in the dative: to me"
      "ಕೊಡಿ": "to give, here as the polite command"
  "kn-8202":
    native: "The meal is very spicy."
  "kn-8203":
    notes:
      "n1": "ಕಡಿಮೆ ಮಾಡಿ (kaḍime māḍi) is the polite way to ask for less, 'make less'."
    native: "Please make it less spicy."
    bases:
      "ಮಾಡಿ": "to make or do, here as the polite command"
  "kn-8204":
    notes:
      "n1": "A yes-or-no question adds -ಆ (-ā) to the verb: ಕುಡಿಯುತ್ತೀರಾ (kuḍiyuttīrā)."
    native: "Do you drink coffee?"
    bases:
      "ಕುಡಿಯುತ್ತೀರಾ": "to drink, here in the polite second-person present question"
  "kn-8205":
    native: "I drink water."
    bases:
      "ಕುಡಿಯುತ್ತೇನೆ": "to drink, here in the first-person present"
  "kn-8206":
    notes:
      "n1": "ಸಸ್ಯಾಹಾರ (sasyāhāra) is vegetarian food; ಸಸ್ಯಾಹಾರಿ (sasyāhāri) is a vegetarian person."
    native: "Is this vegetarian?"
  "kn-8207":
    native: "Give me a tea."
    bases:
      "ಕೊಡಿ": "to give, here as the polite command"
  "kn-8208":
    native: "How much is the dosa?"
  "kn-8209":
    notes:
      "n1": "ಊಟವನ್ನು (ūṭavannu) is 'the meal' as object: ಊಟ (ūṭa) takes the object ending -ವನ್ನು (-vannu)."
    native: "I eat the meal."
    bases:
      "ಊಟವನ್ನು": "meal, here as the thing eaten: the meal"
      "ತಿನ್ನುತ್ತೇನೆ": "to eat, here in the first-person present"
  "kn-8210":
    notes:
      "n1": "ನಿನ್ನ (ninna), your, is the informal word and goes before the noun."
    native: "Your tea is sweet."
