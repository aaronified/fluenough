cards:
  "kn-7460":
    native: "This is the sea."
  "kn-7461":
    notes:
      "n1": "ಇದೆ (ide), there is, is the verb for a thing; for people Kannada uses ಇದ್ದಾರೆ (iddāre)."
    native: "There is a wave."
    bases:
      "ಇದೆ": "is there"
  "kn-7462":
    notes:
      "n1": "ಹಾರುತ್ತದೆ (hāruttade), flies, ends in -ುತ್ತದೆ (-uttade), the present form for 'it'."
    native: "The bird flies."
    bases:
      "ಹಾರುತ್ತದೆ": "to fly (it)"
  "kn-7463":
    native: "The grass is green."
  "kn-7464":
    notes:
      "n1": "ಒಣಗುತ್ತದೆ (oṇaguttade), dries, ends in -ುತ್ತದೆ (-uttade), the present form for 'it'."
    native: "The leaf dries up."
    bases:
      "ಒಣಗುತ್ತದೆ": "to dry (it)"
  "kn-7465":
    native: "The soil is black."
  "kn-7466":
    notes:
      "n1": "ತೀರದಲ್ಲಿ (tīradalli), on the shore, takes the place ending -ದಲ್ಲಿ (-dalli); ಇದೆ (ide), there is, is the verb."
    native: "There is sand on the shore."
    bases:
      "ತೀರದಲ್ಲಿ": "on the shore"
      "ಇದೆ": "is there"
  "kn-7467":
    notes:
      "n1": "ಇಲ್ಲಿ (illi), here, looks like ಇಲ್ಲ (illa), there is not, but is a different word."
    native: "There is a stone here."
    bases:
      "ಇದೆ": "is there"
  "kn-7468":
    notes:
      "n1": "ಸಾಯುತ್ತದೆ (sāyuttade), dies, ends in -ುತ್ತದೆ (-uttade), the present form for 'it'."
    native: "The insect dies."
    bases:
      "ಸಾಯುತ್ತದೆ": "to die (it)"
