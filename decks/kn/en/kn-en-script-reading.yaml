schema: 1
id: "kn-en-script-reading"
kind: "layer"
core: "kn-script-reading"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words to read"
license: "CC-BY-SA-4.0"
description: "Short everyday words written with letters alone, no vowel signs: the tick, the vowel you do not see, and doubled letters, at work. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0048":
    native: "tree"
    notes:
      "n1": "ಮ (ma) and ರ (ra), each with its a, and the last a is said: ma-ra."
    "examples": {
      "ಅವರು ಮರ ನೆಡುತ್ತಾರೆ.": {"native": "They plant trees.", "bases": {"ನೆಡುತ್ತಾರೆ": "plant"}},
      "ಗಡಿಯಲ್ಲಿ ಮರ ಇದೆ.": {"native": "There is a tree at the border.", "bases": {"ಗಡಿಯಲ್ಲಿ": "at the border", "ಇದೆ": "there is"}}
    }
  "kn-0049":
    native: "money"
    notes:
      "n1": "ಣ (ṇa) is the n with the tongue curled back. In speech, money is more often ದುಡ್ಡು (duḍḍu)."
    "examples": {
      "ಹಣ ಕೂಡಿಡು.": {"native": "Save up money.", "bases": {}},
      "ಅವನು ಹಣ ಎಣಿಸುತ್ತಾನೆ.": {"native": "He counts the money.", "bases": {"ಎಣಿಸುತ್ತಾನೆ": "counts"}}
    }
  "kn-0050":
    native: "people; a crowd"
    notes:
      "n1": "ಜ (ja) and ನ (na), each with its a."
    "examples": {
      "ಅನೇಕ ಜನರು ಬಂದರು.": {"native": "Many people came.", "bases": {"ಜನರು": "people", "ಬಂದರು": "to come"}},
      "ಚಿತ್ರಮಂದಿರದಲ್ಲಿ ಜನ ಇದ್ದಾರೆ.": {"native": "There are people in the cinema hall.", "bases": {"ಚಿತ್ರಮಂದಿರದಲ್ಲಿ": "in the cinema hall", "ಜನ": "people", "ಇದ್ದಾರೆ": "to be"}}
    }
  "kn-0051":
    native: "word"
    notes:
      "n1": "ದ (da) is the d on the teeth."
    "examples": {
      "ಈ ಪದದ ಅರ್ಥ ಏನು?": {"native": "What is the meaning of this word?", "bases": {"ಪದದ": "word"}}
    }
  "kn-0052":
    native: "chariot"
    notes:
      "n1": "ಥ (tha) is the t on the teeth with a breath after it."
  "kn-0053":
    native: "strength; the right-hand side"
    notes:
      "n1": "ಬಲ (bala) is both strength and the right: ಬಲಕ್ಕೆ (balakke), to the right."
  "kn-0054":
    native: "lotus"
    notes:
      "n1": "Three letters, each with its a, and the last is said: ka-ma-la, not kamal as in Hindi."
  "kn-0055":
    native: "city"
    notes:
      "n1": "ನ (na), ಗ (ga) and ರ (ra), each with its a: ಬೆಂಗಳೂರು ನಗರ (beṅgaḷūru nagara), Bengaluru city."
    "examples": {
      "ನಗರದ ಜನಸಂಖ್ಯೆ ದೊಡ್ಡದು.": {"native": "The population of the city is big.", "bases": {"ನಗರದ": "city"}},
      "ಕಾರ್ಖಾನೆ ನಗರದ ಹೊರಗೆ ಇದೆ.": {"native": "The factory is outside the city.", "bases": {"ನಗರದ": "of the city", "ಹೊರಗೆ": "outside", "ಇದೆ": "to be"}}
    }
  "kn-0056":
    native: "time (the moment); an occasion"
    notes:
      "n1": "ಸ (sa) is s, never sh."
    "examples": {
      "ಕೊಯ್ಲು ಸಮಯ.": {"native": "Harvest time.", "bases": {}},
      "ಬಿತ್ತನೆ ಸಮಯ.": {"native": "Sowing time.", "bases": {}}
    }
  "kn-0057":
    native: "son"
    notes:
      "n1": "ಮ (ma) and ಗ (ga). A daughter is ಮಗಳು (magaḷu)."
  "kn-0058":
    native: "mother"
    notes:
      "n1": "A doubled m, held longer: the second ಮ (ma) is written small below the first, as its ottakshara. Calling to her, you say ಅಮ್ಮಾ (ammā, with a long final a)."
    "examples": {
      "ಅಮ್ಮ ಗುಡಿಗೆ ಹೋದಳು.": {"native": "Mother went to the shrine.", "bases": {"ಅಮ್ಮ": "mother", "ಗುಡಿಗೆ": "to the shrine", "ಹೋದಳು": "went"}},
      "ಅಮ್ಮ ದುಃಖದಲ್ಲಿ ಇದ್ದಾಳೆ.": {"native": "Mother is in sorrow.", "bases": {"ಅಮ್ಮ": "mother", "ದುಃಖದಲ್ಲಿ": "in sorrow", "ಇದ್ದಾಳೆ": "to be"}}
    }
  "kn-0059":
    native: "father"
    notes:
      "n1": "A doubled p: the second ಪ (pa) sits below the first."
    "examples": {
      "ಕೋಪಿಷ್ಠ ಅಪ್ಪ.": {"native": "A short-tempered dad.", "bases": {}},
      "ಅಪ್ಪ ಕೋಪದಲ್ಲಿ ಇದ್ದಾರೆ.": {"native": "Father is angry.", "bases": {"ಅಪ್ಪ": "father", "ಕೋಪದಲ್ಲಿ": "in anger", "ಇದ್ದಾರೆ": "to be"}}
    }
  "kn-0060":
    native: "elder sister"
    notes:
      "n1": "A doubled k. Calling to her, you say ಅಕ್ಕಾ (akkā, with a long final a)."
    "examples": {
      "ನನ್ನ ಅಕ್ಕ ಬಂದಳು.": {"native": "My elder sister came.", "bases": {"ನನ್ನ": "I", "ಬಂದಳು": "to come"}}
    }
  "kn-0061":
    native: "elder brother"
    notes:
      "n1": "A doubled n, curled back. Calling to him, you say ಅಣ್ಣಾ (aṇṇā, with a long final a)."
    "examples": {
      "ಅವನ ಅಣ್ಣ ಇಲ್ಲಿ ಇದ್ದಾನೆ.": {"native": "His elder brother is here.", "bases": {"ಅಣ್ಣ": "elder brother", "ಇದ್ದಾನೆ": "to be"}},
      "ನನ್ನ ಅಣ್ಣ ವಿಶ್ವವಿದ್ಯಾಲಯದಲ್ಲಿ ಓದುತ್ತಾನೆ.": {"native": "My elder brother studies at the university.", "bases": {"ಅಣ್ಣ": "elder brother", "ವಿಶ್ವವಿದ್ಯಾಲಯದಲ್ಲಿ": "at the university", "ಓದುತ್ತಾನೆ": "to study", "ನನ್ನ": "my"}}
    }
  "kn-0062":
    native: "cooked rice"
    notes:
      "n1": "A doubled n on the teeth. Compare ಅಣ್ಣ (aṇṇa), elder brother, with the curled-back n."
    "examples": {
      "ಅನ್ನ ಬೆಂದಿದೆ.": {"native": "The rice is cooked.", "bases": {"ಬೆಂದಿದೆ": "is cooked"}},
      "ಅವನು ಅನ್ನ ತಿನ್ನುತ್ತಾನೆ.": {"native": "He eats rice.", "bases": {"ಅನ್ನ": "rice", "ತಿನ್ನುತ್ತಾನೆ": "to eat"}}
    }
