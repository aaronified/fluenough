schema: 1
id: "kn-en-script-reading"
kind: "layer"
core: "kn-script-reading"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words to read"
license: "CC0-1.0"
description: "Short everyday words written with letters alone, no vowel signs: the tick, the vowel you do not see, and doubled letters, at work. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0048":
    native: "tree"
    notes:
      "n1": "ಮ (ma) and ರ (ra), each with its a, and the last a is said: ma-ra."
  "kn-0049":
    native: "money"
    notes:
      "n1": "ಣ (ṇa) is the n with the tongue curled back. In speech, money is more often ದುಡ್ಡು (duḍḍu)."
  "kn-0050":
    native: "people; a crowd"
    notes:
      "n1": "ಜ (ja) and ನ (na), each with its a."
  "kn-0051":
    native: "word"
    notes:
      "n1": "ದ (da) is the d on the teeth."
  "kn-0052":
    native: "chariot"
    notes:
      "n1": "ಥ (tha) is the t on the teeth with a breath after it."
  "kn-0053":
    native: "strength; the right-hand side"
    notes:
      "n1": "ಬಲ (bala) is both strength and the right: ಬಲಕ್ಕೆ (balakke), to the right."
  "kn-0054":
    native: "lotus"
    notes:
      "n1": "Three letters, each with its a, and the last is said: ka-ma-la, not kamal as in Hindi."
  "kn-0055":
    native: "city"
    notes:
      "n1": "ನ (na), ಗ (ga) and ರ (ra), each with its a: ಬೆಂಗಳೂರು ನಗರ (beṅgaḷūru nagara), Bengaluru city."
  "kn-0056":
    native: "time (the moment); an occasion"
    notes:
      "n1": "ಸ (sa) is s, never sh."
  "kn-0057":
    native: "son"
    notes:
      "n1": "ಮ (ma) and ಗ (ga). A daughter is ಮಗಳು (magaḷu)."
  "kn-0058":
    native: "mother"
    notes:
      "n1": "A doubled m, held longer: the second ಮ (ma) is written small below the first, as its ottakshara. Calling to her, you say ಅಮ್ಮಾ (ammā, with a long final a)."
  "kn-0059":
    native: "father"
    notes:
      "n1": "A doubled p: the second ಪ (pa) sits below the first."
  "kn-0060":
    native: "elder sister"
    notes:
      "n1": "A doubled k. Calling to her, you say ಅಕ್ಕಾ (akkā, with a long final a)."
  "kn-0061":
    native: "elder brother"
    notes:
      "n1": "A doubled n, curled back. Calling to him, you say ಅಣ್ಣಾ (aṇṇā, with a long final a)."
  "kn-0062":
    native: "cooked rice"
    notes:
      "n1": "A doubled n on the teeth. Compare ಅಣ್ಣ (aṇṇa), elder brother, with the curled-back n."
