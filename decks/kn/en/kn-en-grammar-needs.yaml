schema: 1
id: "kn-en-grammar-needs"
kind: "layer"
core: "kn-grammar-needs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Need and want"
license: "CC-BY-SA-4.0"
description: "ಬೇಕು (bēku), ಬೇಡ (bēḍa) and ಸಾಕು (sāku): what you need, what you want, what you don't, and when it is enough. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0332":
    native: "is needed; is wanted"
    notes:
      "n1": "The one who wants takes -ಗೆ (-ge): ನನಗೆ ಬೇಕು (nanage bēku), I want it. After a verb it is 'must': ಹೋಗಬೇಕು (hōgabēku), must go."
    "examples": {
      "ಅಂತರ್ಜಾಲ ಬೇಕು.": {"native": "I need the internet.", "bases": {}},
      "ಅಡಿಕೆ ಬೇಕು.": {"native": "I need areca nut.", "bases": {}}
    }
  "kn-0333":
    notes:
      "n1": "The person takes the ending ಗೆ (ge), as in ನಿಮಗೆ (nimage), to you. What is wanted is the subject, and ಬೇಕು (bēku) means is needed."
    native: "What would you like? (what a shopkeeper asks)"
  "kn-0334":
    notes:
      "n1": "The person takes the ending ಗೆ (ge), as in ನನಗೆ (nanage), to me; the thing wanted, ನೀರು (nīru), is the subject of ಬೇಕು (bēku)."
    native: "I'd like some water."
    bases:
      "ನನಗೆ": "I"
  "kn-0335":
    native: "is not wanted; no, thank you"
    notes:
      "n1": "Waved over a plate at a second helping: ಬೇಡ (bēḍa), ಸಾಕು (beda, saku), no thanks, that's enough."
    "examples": {
      "ಅಪರಾಧ ಬೇಡ.": {"native": "No crime.", "bases": {}},
      "ಅಪಾಯ ಬೇಡ.": {"native": "No danger.", "bases": {}}
    }
  "kn-0336":
    notes:
      "n1": "ಬೇಡ (bēḍa) is the opposite of ಬೇಕು (bēku): it means is not wanted."
    native: "I don't want this."
    bases:
      "ನನಗೆ": "I"
      "ಇದು": "this"
  "kn-0337":
    native: "enough; that's enough"
    "examples": {
      "ಇಷ್ಟು ಸಾಕು.": {"native": "This much is enough.", "bases": {}}
    }
  "kn-0338":
    native: "need; necessary"
    "examples": {
      "ಅಗತ್ಯ ಇಲ್ಲ.": {"native": "There's no need.", "bases": {}}
    }
  "kn-0339":
    native: "There's no need."
    notes:
      "n1": "Also ಬೇಕಾಗಿಲ್ಲ (bēkāgilla), it isn't needed."
  "kn-0340":
    notes:
      "n1": "The same pattern: the person takes the ending ಗೆ (ge), as in ನನಗೆ (nanage), and the thing needed, ಸಹಾಯ (sahāya), is the subject of ಬೇಕು (bēku)."
    native: "I need some help."
    bases:
      "ನನಗೆ": "I"
  "kn-0341":
    native: "I want to go home."
    notes:
      "n1": "With ನನಗೆ (nanage), -ಬೇಕು (-bēku) on a verb is more a wish; with ನಾನು (nānu), more a duty: ನಾನು ಮನೆಗೆ ಹೋಗಬೇಕು (nānu manege hōgabēku), I have to go home."
    bases:
      "ನನಗೆ": "I"
      "ಹೋಗಬೇಕು": "to go"
