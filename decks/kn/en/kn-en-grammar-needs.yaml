schema: 1
id: "kn-en-grammar-needs"
kind: "layer"
core: "kn-grammar-needs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Need and want"
license: "CC0-1.0"
description: "ಬೇಕು (bēku), ಬೇಡ (bēḍa) and ಸಾಕು (sāku): what you need, what you want, what you don't, and when it is enough. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0332":
    native: "is needed; is wanted"
    notes:
      "n1": "The one who wants takes -ಗೆ (-ge): ನನಗೆ ಬೇಕು (nanage bēku), I want it. After a verb it is 'must': ಹೋಗಬೇಕು (hōgabēku), must go."
  "kn-0333":
    native: "What would you like? (what a shopkeeper asks)"
  "kn-0334":
    native: "I'd like some water."
  "kn-0335":
    native: "is not wanted; no, thank you"
    notes:
      "n1": "Waved over a plate at a second helping: ಬೇಡ (bēḍa), ಸಾಕು (beda, saku), no thanks, that's enough."
  "kn-0336":
    native: "I don't want this."
  "kn-0337":
    native: "enough; that's enough"
  "kn-0338":
    native: "need; necessary"
  "kn-0339":
    native: "There's no need."
    notes:
      "n1": "Also ಬೇಕಾಗಿಲ್ಲ (bēkāgilla), it isn't needed."
  "kn-0340":
    native: "I need some help."
  "kn-0341":
    native: "I want to go home."
    notes:
      "n1": "With ನನಗೆ (nanage), -ಬೇಕು (-bēku) on a verb is more a wish; with ನಾನು (nānu), more a duty: ನಾನು ಮನೆಗೆ ಹೋಗಬೇಕು (nānu manege hōgabēku), I have to go home."
