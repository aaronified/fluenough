schema: 1
id: "kn-en-appearance"
kind: "layer"
core: "kn-appearance"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Appearance: looks, height and age"
license: "CC-BY-SA-4.0"
description: "How people look: height, age, hair, face and build, and how to describe them to someone who will meet them. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1159":
    native: "short (of height)"
    notes:
      "n1": "Short in height, of a person. Tall is ಉದ್ದ (udda)."
    examples:
      "ಅವನು ಗಿಡ್ಡ.": "He is short."
      "ಗಿಡ್ಡ ಮಕ್ಕಳು.": "Short children."
  "kn-1160":
    native: "tall, long"
    notes:
      "n1": "Tall, or long, of a thing. Short is ಗಿಡ್ಡ (giḍḍa) or ಚಿಕ್ಕ (cikka)."
    examples:
      "ಅವಳು ಉದ್ದ.": "She is tall."
      "ಉದ್ದ ಕೂದಲು.": "Long hair."
  "kn-1161":
    native: "age"
    notes:
      "n1": "How old someone is."
    examples:
      "ನಿನ್ನ ವಯಸ್ಸು ಎಷ್ಟು?": "How old are you?"
      "ನನ್ನ ವಯಸ್ಸು ಇಪ್ಪತ್ತು.": "My age is twenty."
  "kn-1162":
    native: "old man"
    notes:
      "n1": "An old man. An old woman is ಮುದುಕಿ (muduki)."
    examples:
      "ಮುದುಕ ಕುಳಿತಿದ್ದಾನೆ.": { native: "The old man is sitting.", bases: { "ಕುಳಿತಿದ್ದಾನೆ": "is sitting" } }
      "ಮುದುಕರು ಬಂದರು.": { native: "The old men came.", bases: { "ಮುದುಕರು": "the old men" } }
  "kn-1163":
    native: "young man"
    notes:
      "n1": "A young man, not yet old."
    examples:
      "ಯುವಕ ಓಡುತ್ತಿದ್ದಾನೆ.": "The young man is running."
      "ಯುವಕರು ಬಂದರು.": { native: "The young men came.", bases: { "ಯುವಕರು": "the young men" } }
  "kn-1164":
    native: "beard"
    notes:
      "n1": "A beard, on the chin."
    examples:
      "ಅವನಿಗೆ ಗಡ್ಡ ಇದೆ.": { native: "He has a beard.", bases: { "ಇದೆ": "has" } }
      "ಗಡ್ಡ ಬಿಳಿ.": "The beard is white."
  "kn-1165":
    native: "moustache"
    notes:
      "n1": "A moustache, above the mouth."
    examples:
      "ಅಪ್ಪನಿಗೆ ಮೀಸೆ ಇದೆ.": { native: "Dad has a moustache.", bases: { "ಇದೆ": "has" } }
      "ಮೀಸೆ ಕತ್ತರಿಸು.": "Cut the moustache."
  "kn-1166":
    native: "fat, thick"
    notes:
      "n1": "Fat, of a person; thick, of a thing. Thin is ತೆಳ್ಳಗೆ (teḷḷage)."
    examples:
      "ಅವನು ದಪ್ಪ.": "He is fat."
      "ದಪ್ಪ ಪುಸ್ತಕ.": "A thick book."
  "kn-1167":
    native: "thin, slim"
    notes:
      "n1": "Thin, of a person or a thing. The opposite is ದಪ್ಪ (dappa)."
    examples:
      "ಅವಳು ತೆಳ್ಳಗೆ.": "She is thin."
      "ತೆಳ್ಳಗೆ ಬಟ್ಟೆ.": "Thin cloth."
  "kn-1168":
    native: "black, dark"
    notes:
      "n1": "Black, or dark in colour."
    examples:
      "ಕಪ್ಪು ಕೂದಲು.": "Black hair."
      "ಅವನ ಬಣ್ಣ ಕಪ್ಪು.": "His skin colour is dark."
  "kn-1169":
    native: "white, fair"
    notes:
      "n1": "White, or fair in skin colour."
    examples:
      "ಬಿಳಿ ಬಟ್ಟೆ ಬೇಕು.": "I need white cloth."
      "ಅವಳ ಬಣ್ಣ ಬಿಳಿ.": "Her skin colour is fair."
  "kn-1170":
    native: "red"
    notes:
      "n1": "Red, in colour."
    examples:
      "ಕೆಂಪು ಹೂವು.": "A red flower."
      "ಕೆಂಪು ಬಣ್ಣ ಇಷ್ಟ.": "I like red."
  "kn-1171":
    native: "blue"
    notes:
      "n1": "Blue, in colour."
    examples:
      "ನೀಲಿ ಆಕಾಶ.": "A blue sky."
      "ನೀಲಿ ಬಟ್ಟೆ ಇದೆ.": { native: "There is blue cloth.", bases: { "ಇದೆ": "there is" } }
  "kn-1172":
    native: "green"
    notes:
      "n1": "Green, in colour."
    examples:
      "ಹಸಿರು ಗಿಡ.": "A green plant."
      "ಹಸಿರು ಬಣ್ಣ ಚೆನ್ನಾಗಿದೆ.": "Green is a good colour."
  "kn-1173":
    native: "brown"
    notes:
      "n1": "Brown, in colour."
    examples:
      "ಕಂದು ಕಣ್ಣು.": "Brown eyes."
      "ಕಂದು ಬಣ್ಣ ಇದೆ.": { native: "There is a brown colour.", bases: { "ಇದೆ": "there is" } }
  "kn-1174":
    native: "bald"
    notes:
      "n1": "Bald, with no hair on the head."
    examples:
      "ಅಪ್ಪ ಬೋಳು.": "Dad is bald."
      "ಅವನ ತಲೆ ಬೋಳು.": "His head is bald."
  "kn-1175":
    native: "curly"
    notes:
      "n1": "Curly, said of hair."
    examples:
      "ಸುರುಳಿ ಕೂದಲು.": "Curly hair."
      "ಅವಳ ಕೂದಲು ಸುರುಳಿ.": "Her hair is curly."
