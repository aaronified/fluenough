native: { code: "en", iso639_3: "eng", name: "English" }
name: "Geography: the world, maps and places: sentences"
description: "Sentences with the words of the geography: the world, maps and places unit and the units before it. They unlock once their words are known. Not yet checked by a Kannada speaker: please report any mistake."
