tags: ["beginner", "unreviewed"]
cards:
  "kn-7099":
    native: "India is my country."
    notes:
      "n1": "No verb is needed for 'is' here: a noun can be the whole predicate in the present. ನನ್ನ (nanna) 'my' comes before ದೇಶ (dēśa) 'country'."
  "kn-7100":
    native: "Where is the map?"
    notes:
      "n1": "The question word ಎಲ್ಲಿ (elli) 'where' comes after the noun, with no verb: ನಕ್ಷೆ (nakṣe) ಎಲ್ಲಿ (elli)? asks where the map is."
  "kn-7101":
    native: "Which is the capital?"
    notes:
      "n1": "ಯಾವುದು (yāvudu) asks 'which' about a thing and comes after the noun. For a person the question word is ಯಾರು (yāru) 'who'."
  "kn-7102":
    native: "Where is the east?"
    notes:
      "n1": "ಎಲ್ಲಿ (elli) 'where' follows the direction word, and no verb is used, as in the other cards of this unit."
  "kn-7103":
    native: "The west and the south."
    notes:
      "n1": "ಮತ್ತು (mattu) 'and' goes between the two words, and the sentence ends after the last word with no verb."
  "kn-7104":
    native: "Where is the ocean?"
    notes:
      "n1": "ಎಲ್ಲಿ (elli) 'where' follows the noun and the verb 'is' is left out, the same as in the map card."
  "kn-7105":
    native: "What is the population?"
    notes:
      "n1": "ಎಷ್ಟು (eṣṭu) asks 'how much' or 'how many' and comes after the noun, with no verb."
  "kn-7106":
    native: "Which is the district?"
    notes:
      "n1": "ಯಾವುದು (yāvudu) 'which' comes after the noun for a thing, as in the capital card."
  "kn-7107":
    native: "This is the middle."
    notes:
      "n1": "ಇದು (idu) 'this' is used for things and is followed by the noun with no verb: ಇದು (idu) ಮಧ್ಯ (madhya) means 'this is the middle'."
  "kn-7108":
    native: "Where is the border?"
    notes:
      "n1": "ಎಲ್ಲಿ (elli) 'where' comes after the noun, with no verb, as in the other location questions here."
  "kn-7109":
    native: "Which is the direction?"
    notes:
      "n1": "ಯಾವುದು (yāvudu) 'which' comes after the noun for a thing; the verb 'is' is left out."
