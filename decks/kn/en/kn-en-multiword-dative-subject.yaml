id: "kn-en-multiword-dative-subject"
kind: "layer"
core: "kn-multiword-dative-subject"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word phrases: dative subjects"
description: "Fifteen phrases where the person is in the dative: I need money, I do not want that, I like it, I know, I do not know, I understood, I am hungry, I am not hungry, I am thirsty, I have a fever, I am angry, I am scared, I cannot see, I know Kannada and she is upset. Each was checked against an English or Kannada Wiktionary entry; the note says which, and where a phrase rests only on the course's own grammar deck. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "kn-6450":
    native: "I need money; I want money"
    notes:
      "u1": "The person who wants is in the dative, ನನಗೆ (nanage), to me, and the thing wanted, ಹಣ (haṇa), money, comes before ಬೇಕು (bēku). The Kannada Wiktionary entry for ಬೇಕು (bēku) gives ನನಗೆ (nanage) ಹಣ (haṇa), ಮನೆ (mane) ಎಲ್ಲಾ (ellā) ಬೇಕು (bēku), I need money, a house, everything. The English Wiktionary lists ಬೇಕು (bēku) as a noun, necessity."
  "kn-6451":
    native: "I do not want that snack"
    notes:
      "u1": "ಬೇಡ (bēḍa) is the negative partner of ಬೇಕು (bēku): the thing is not wanted. The Kannada Wiktionary entry for ಬೇಡ (bēḍa) gives exactly ನನಗೆ (nanage) ಆ (ā) ತಿಂಡಿ (tiṇḍi) ಬೇಡ (bēḍa), with the gloss not."
    bases:
      "ಆ": "that"
  "kn-6452":
    native: "I like it; it is dear to me"
    notes:
      "u1": "ಇಷ್ಟ (iṣṭa) is a noun, liking, so the person who likes is in the dative. The Kannada Wiktionary entry for ಇಷ್ಟ (iṣṭa) glosses it as liking and relish. Name the thing first, as the course's grammar deck does in ನನಗೆ (nanage) ಮಾವಿನಹಣ್ಣು (māvinahaṇṇu) ಇಷ್ಟ (iṣṭa), I like mangoes."
  "kn-6453":
    native: "I know; I know about it"
    notes:
      "u1": "ಗೊತ್ತು (gottu) is a noun, knowledge, so the person who knows is in the dative. The Kannada Wiktionary entry for ಗೊತ್ತು (gottu) lists it with ಗೊತ್ತಿರು (gottiru) and ಗೊತ್ತಾಗು (gottāgu) under knowledge, and glosses it as known."
    bases:
      "ಗೊತ್ತು": "knowledge; what is known"
  "kn-6454":
    native: "I do not know"
    notes:
      "u1": "ಗೊತ್ತಿಲ್ಲ (gottilla) is ಗೊತ್ತು (gottu) with ಇಲ್ಲ (illa), there is not, joined in writing; the end of ಗೊತ್ತು (gottu) changes to ಗೊತ್ತಿ (gotti). The Kannada Wiktionary entry for ಗೊತ್ತು (gottu) lists ಗೊತ್ತಿಲ್ಲದ (gottillada) ಕೆಲಸ (kelasa), and the course's grammar deck has ನನಗೆ (nanage) ಗೊತ್ತಿಲ್ಲ (gottilla)."
    bases:
      "ಗೊತ್ತಿಲ್ಲ": "knowledge; what is known"
  "kn-6455":
    native: "I understood; I found out"
    notes:
      "u1": "ಗೊತ್ತಾಯಿತು (gottāyitu) is ಗೊತ್ತು (gottu) with ಆಗು (āgu), to become, in the past: it became known to me. ಆಗು (āgu) becomes ಆಯಿತು (āyitu) in the past. The Kannada Wiktionary entry for ಗೊತ್ತು (gottu) gives ನಾನು (nānu) ಹೇಳಿದುದು (hēḷidudu) ಗೊತ್ತಾಯಿತೋ (gottāyitō), with the sense of meaning: did you understand what I said?"
    bases:
      "ಗೊತ್ತಾಯಿತು": "knowledge; what is known"
  "kn-6456":
    native: "I am hungry"
    notes:
      "u1": "ಹಸಿವಾಗಿದೆ (hasivāgide) is ಹಸಿವು (hasivu), hunger, with ಆಗು (āgu), to become: hunger has come to me. The end of ಹಸಿವು (hasivu) changes to ಹಸಿವಾ (hasivā). The Kannada Wiktionary entry for ಹಸಿವು (hasivu) gives ಹಸಿವಾದಾಗ (hasivādāga) ಆತ (āta) ಏನಾದರೂ (ēnādarū) ಬೇಯಿಸಿ (bēyisi) ತಿನ್ನುತ್ತಾನೆ (tinnuttāne), When he is hungry he cooks something and eats it."
    bases:
      "ಹಸಿವಾಗಿದೆ": "hunger"
  "kn-6457":
    native: "I am not hungry"
    notes:
      "u1": "ಹಸಿವಿಲ್ಲ (hasivilla) is ಹಸಿವು (hasivu) with ಇಲ್ಲ (illa), there is not, joined in writing. The Kannada Wiktionary entry for ಹಸಿವು (hasivu) gives ಊಟ (ūṭa) ಮಾಡಲು (māḍalu) ನನಗೆ (nanage) ಹಸಿವಿಲ್ಲ (hasivilla), I am not hungry for a meal."
    bases:
      "ಹಸಿವಿಲ್ಲ": "hunger"
  "kn-6458":
    native: "I am very thirsty"
    notes:
      "u1": "ಬಾಯಾರಿಕೆಯಾಗಿದೆ (bāyārikeyāgide) is ಬಾಯಾರಿಕೆ (bāyārike), thirst, joined to ಆಗಿದೆ (āgide), from ಆಗು (āgu): thirst has come to me. The English Wiktionary entry for ಬಾಯಾರಿಕೆ (bāyārike) gives exactly ನನಗೆ (nanage) ಬಹಳ (bahaḷa) ಬಾಯಾರಿಕೆಯಾಗಿದೆ (bāyārikeyāgide), I am very thirsty."
    bases:
      "ಬಾಯಾರಿಕೆಯಾಗಿದೆ": "thirst"
  "kn-6459":
    native: "I have a fever"
    notes:
      "u1": "Having a fever is said with the dative and ಇದೆ (ide), there is, from ಇರು (iru). The English Wiktionary entry for ಜ್ವರ (jvara) gives ಅವನಿಗೆ (avanige) ತಲೆನೋವು (talenōvu) ಮತ್ತು (mattu) ಸ್ವಲ್ಪ (svalpa) ಜ್ವರವಿದೆ (jvaravide), He has a headache and a slight fever, where ಜ್ವರ (jvara) and ಇದೆ (ide) join as ಜ್ವರವಿದೆ (jvaravide)."
    bases:
      "ಇದೆ": "to be; to exist; to have"
  "kn-6460":
    native: "I have got angry; I am angry"
    notes:
      "u1": "Anger is said to come to the person: ಕೋಪ (kōpa), anger, and ಬರು (baru), to come, with the person in the dative. ಬರು (baru) changes its stem in the past: ಬಂದ (banda). The English Wiktionary entry for ಕೋಪ (kōpa) gives anger, fury; the phrase itself is in the course's sentence decks as ನನಗೆ (nanage) ಕೋಪ (kōpa) ಬಂದಿದೆ (bandide)."
    bases:
      "ಬಂದಿದೆ": "to come"
  "kn-6461":
    native: "I am getting scared; I feel afraid"
    notes:
      "u1": "Fear is said to happen to the person: ಹೆದರಿಕೆ (hedarike), fear, with ಆಗು (āgu), to become, and the person in the dative. The English Wiktionary entry for ಭಯ (bhaya) gives ಹೆದರಿಕೆ (hedarike) as its synonym, and the course's emergency sentences have ನನಗೆ (nanage) ಹೆದರಿಕೆ (hedarike) ಆಗುತ್ತಿದೆ (āguttide)."
    bases:
      "ಆಗುತ್ತಿದೆ": "to happen; to become; to be finished"
  "kn-6462":
    native: "I cannot see anything"
    notes:
      "u1": "ಕಾಣಿಸು (kāṇisu) is ಕಾಣು (kāṇu), to see or appear, made into a verb meaning to be visible; the person who cannot see is in the dative. The Kannada Wiktionary entry for ಕಾಣು (kāṇu) gives exactly ನನಗೆ (nanage) ಏನೂ (ēnū) ಕಾಣಿಸುವುದಿಲ್ಲ (kāṇisuvudilla)."
  "kn-6463":
    native: "I know Kannada; I can speak Kannada"
    notes:
      "u1": "A language is said to come to the person: ಬರು (baru), to come, with the person in the dative. The English Wiktionary entry for ಬರು (baru) gives only to come, and the Kannada Wiktionary adds to get; the sense be known, used of a skill, is the course's, from its grammar decks, which have ನನಗೆ (nanage) ಕನ್ನಡ (kannaḍa) ಬರುತ್ತದೆ (baruttade)."
    bases:
      "ಬರುತ್ತದೆ": "to come; to be known (of a skill)"
  "kn-6464":
    native: "She is upset; she is fed up"
    notes:
      "u1": "The feeling belongs to a person in the dative, ಅವಳಿಗೆ (avaḷige), to her, and is named with no verb. The Kannada Wiktionary entry for ಬೇಸರ (bēsara) glosses it as weariness and vexation, and the course's sentence decks have ಅವಳಿಗೆ (avaḷige) ಬೇಸರ (bēsara)."
