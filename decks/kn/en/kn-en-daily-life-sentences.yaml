cards:
  "kn-7427":
    notes:
      "n1": "ಪ್ರತಿದಿನ (pratidina) is ಪ್ರತಿ (prati), every, joined to ದಿನ (dina), day."
    native: "I eat breakfast every day."
    bases:
      "ತಿನ್ನುತ್ತೇನೆ": "to eat (I)"
  "kn-7428":
    native: "He always goes to sleep."
    bases:
      "ಮಲಗುತ್ತಾನೆ": "to sleep (he)"
  "kn-7429":
    notes:
      "n1": "ಅಡುಗೆ ಮಾಡು (aḍuge māḍu) is 'to cook', literally 'make cooking'."
    native: "She usually cooks."
    bases:
      "ಅಡುಗೆ": "cooking; food"
      "ಮಾಡುತ್ತಾಳೆ": "to do (she)"
  "kn-7430":
    notes:
      "n1": "ಕೆಲಸಕ್ಕೆ (kelasakke) is 'to work', with the direction ending -ಕ್ಕೆ (-kke), 'to'."
    native: "Sometimes I go to work later."
    bases:
      "ಕೆಲಸಕ್ಕೆ": "to work"
      "ಹೋಗುತ್ತೇನೆ": "to go (I)"
  "kn-7431":
    notes:
      "n1": "ಸ್ನಾನ ಮಾಡು (snāna māḍu) is 'to bathe', literally 'make a bath'."
    native: "I have a bath."
    bases:
      "ಸ್ನಾನ": "bath"
      "ಮಾಡುತ್ತೇನೆ": "to do (I)"
  "kn-7432":
    notes:
      "n1": "ಉಜ್ಜು (ujju) is the verb for brushing teeth, rub or brush."
    native: "Do you brush your teeth?"
    bases:
      "ಹಲ್ಲು": "tooth; teeth"
      "ಉಜ್ಜುತ್ತೀರಾ": "to rub, brush (you)"
  "kn-7433":
    notes:
      "n1": "ಊಟ ಮಾಡು (ūṭa māḍu) is 'to eat a meal'; ರಾತ್ರಿ (rātri) with it means dinner."
    native: "I have dinner at night."
    bases:
      "ರಾತ್ರಿ": "night"
      "ಊಟ": "meal"
      "ಮಾಡುತ್ತೇನೆ": "to do (I)"
  "kn-7434":
    notes:
      "n1": "ಮನೆಗೆ (manege) is 'to the house', the dative of ಮನೆ (mane) with -ಗೆ (-ge)."
    native: "Are you coming home?"
    bases:
      "ಮನೆಗೆ": "home"
      "ಬರುತ್ತೀರಾ": "to come (you)"
