cards:
  "kn-7132":
    native: "This is the environment."
  "kn-7133":
    native: "Pollution is far too high."
  "kn-7134":
    notes:
      "n1": "The question word ಎಲ್ಲಿ (elli), where, follows the noun, with no word for 'is': ಪ್ಲಾಸ್ಟಿಕ್ (plāsṭik) ಎಲ್ಲಿ (elli)? asks where the plastic is."
    native: "Where is the plastic?"
  "kn-7135":
    native: "There is far too much smoke."
  "kn-7136":
    notes:
      "n1": "The question word ಎಲ್ಲಿ (elli), where, follows the noun, with no word for 'is': ತ್ಯಾಜ್ಯ (tyājya) ಎಲ್ಲಿ (elli)? asks where the waste is."
    native: "Where is the waste?"
  "kn-7137":
    notes:
      "n1": "ಎಷ್ಟು (eṣṭu), how much, follows the noun, with no word for 'is': ವಿದ್ಯುತ್ (vidyut) ಎಷ್ಟು (eṣṭu)? asks how much electricity there is."
    native: "How much electricity?"
  "kn-7138":
    notes:
      "n1": "ಯಾವಾಗ (yāvāga), when, follows the noun, with no word for 'is': ಮರುಬಳಕೆ (marubaḷake) ಯಾವಾಗ (yāvāga)? asks when the recycling is."
    native: "When is the recycling?"
  "kn-7139":
    notes:
      "n1": "The question word ಎಲ್ಲಿ (elli), where, follows the noun, with no word for 'is': ಪ್ರಾಣಿ (prāṇi) ಎಲ್ಲಿ (elli)? asks where the animal is."
    native: "Where is the animal?"
  "kn-7140":
    notes:
      "n1": "The question word ಎಲ್ಲಿ (elli), where, follows the noun, with no word for 'is': ಸಸ್ಯ (sasya) ಎಲ್ಲಿ (elli)? asks where the plant is."
    native: "Where is the plant?"
  "kn-7141":
    notes:
      "n1": "The plain command ends in -ು (-u), as in ರಕ್ಷಿಸು (rakṣisu); the polite command ends in -ಿ (-i), as in ಕೊಡಿ (koḍi)."
    native: "Protect the animals."
  "kn-7142":
    native: "This is poison."
