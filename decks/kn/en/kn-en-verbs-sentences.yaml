cards:
  "kn-7759":
    notes:
      "n1": "ಏನು (ēnu), what, comes before the verb; ಕುಡಿಯುತ್ತೀರಿ (kuḍiyuttīri), you drink, takes the polite ending -ುತ್ತೀರಿ (-uttīri)."
    native: "What do you drink?"
  "kn-7760":
    notes:
      "n1": "ಮನೆಗೆ (manege), to home, takes the dative -ಗೆ (-ge); ಹೋಗುತ್ತೇನೆ (hōguttēne), I go, ends in -ುತ್ತೇನೆ (-uttēne) for 'I'."
    native: "I am going home."
  "kn-7761":
    notes:
      "n1": "ಮನೆಯಲ್ಲಿ (maneyalli) is ಮನೆ (mane), house, with the ending -ಯಲ್ಲಿ (-yalli), meaning at or in."
    native: "He studies at home."
  "kn-7762":
    notes:
      "n1": "ಇದನ್ನು (idannu), this, takes the object ending -ನ್ನು (-nnu); ನೋಡುತ್ತೀರಾ (nōḍuttīrā), do you look, ends in -ುತ್ತೀರಾ (-uttīrā), the polite question form."
    native: "Are you looking at this?"
  "kn-7763":
    notes:
      "n1": "ನೀನು (nīnu), you, is informal, and takes the informal ending -ುತ್ತೀಯ (-uttīya) on ಓದುತ್ತೀಯ (ōduttīya); ಎಲ್ಲಿ (elli), where, comes before the verb."
    native: "Where do you study?"
  "kn-7764":
    notes:
      "n1": "ಹೋಗು (hōgu), go, changes its stem in the past: ಹೋದ- (hōda-)-, as in ಹೋದರು (hōdaru), they went."
    native: "They went home."
  "kn-7765":
    notes:
      "n1": "ಮನೆಯಲ್ಲಿ (maneyalli), at home, takes the place ending -ಯಲ್ಲಿ (-yalli); ಓದಿದೆ (ōdide), I read, is the past of ಓದು (ōdu), read, for 'I'."
    native: "I read at home."
  "kn-7766":
    notes:
      "n1": "ನನ್ನನ್ನು (nannannu), me, is the object form of ನಾನು (nānu), I; ನೋಡಿದಳು (nōḍidaḷu), she saw, is the past of ನೋಡು (nōḍu), see, for 'she'."
    native: "She saw me."
