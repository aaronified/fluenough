native: { code: "en", iso639_3: "eng", name: "English" }
name: "Numbers 1–20: sentences"
description: "Sentences with the number words one to twenty: counting, the hour and the price. They unlock once their words are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8320":
    native: "This is one."
  "kn-8321":
    notes:
      "n1": "Counted in order, the number words are said one after another: ಒಂದು (ondu), one; ಎರಡು (eraḍu), two; and so on."
    native: "One, two, three, four."
  "kn-8322":
    notes:
      "n1": "The number comes before ಗಂಟೆ (gaṇṭe), hour, and the sentence needs no verb for 'is': ಈಗ (īga), now, ಮೂರು (mūru), three, ಗಂಟೆ (gaṇṭe), o'clock."
    native: "It is three o'clock now."
  "kn-8323":
    notes:
      "n1": "ಗಂಟೆಗೆ (gaṇṭege) is ಗಂಟೆ (gaṇṭe), o'clock, with ಗೆ (ge) on the end for 'at', so ಹತ್ತು ಗಂಟೆಗೆ (hattu gaṇṭege) is at ten o'clock."
    native: "I go at ten o'clock."
  "kn-8324":
    native: "They go at nine o'clock tomorrow."
  "kn-8325":
    notes:
      "n1": "ಮನೆಗೆ (manege) is ಮನೆ (mane), house, with ಗೆ (ge) on the end for 'to', so ಮನೆಗೆ ಹೋಗುತ್ತೇನೆ (manege hōguttēne) is I go home."
    native: "I go home at seven in the evening."
  "kn-8326":
    native: "They eat at two o'clock."
  "kn-8327":
    notes:
      "n1": "ಇದರ (idara), of this, is the form of ಇದು (idu), this, that comes before the word it belongs to, as in ಇದರ ಬೆಲೆ (idara bele), the price of this."
    native: "The price of this is fifteen rupees."
  "kn-8328":
    native: "Give six rupees."
  "kn-8329":
    native: "I read at eleven at night."
