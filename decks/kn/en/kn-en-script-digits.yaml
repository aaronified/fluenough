core: "kn-script-digits"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kannada digits"
description: "The ten digits, 0 to 9, that Kannada uses on some signs and in older books. Everyday writing mostly uses the Latin 0 to 9. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "kn-0590":
    native: "0 (zero)"
    notes:
      "n1": "A plain round circle with no stroke. Its word is ಸೊನ್ನೆ (sonne); ಶೂನ್ಯ (śūnya) is the Sanskrit word. Do not confuse it with the anusvara ಂ (am), a small circle written after a letter, which is also called ಸೊನ್ನೆ (sonne), as in ಕಂಬ (kamba, pillar). A digit stands alone in a number; ಂ is part of a word."
  "kn-0591":
    native: "1 (one)"
    notes:
      "n1": "The Kannada form of 1, not the Latin 1. Its word is ಒಂದು (ondu)."
  "kn-0592":
    native: "2 (two)"
    notes:
      "n1": "The Kannada form of 2, not the Latin 2. Its word is ಎರಡು (eraḍu)."
  "kn-0593":
    native: "3 (three)"
    notes:
      "n1": "The Kannada form of 3, not the Latin 3. Its word is ಮೂರು (mūru)."
  "kn-0594":
    native: "4 (four)"
    notes:
      "n1": "The Kannada form of 4, not the Latin 4. Its word is ನಾಲ್ಕು (nālku)."
  "kn-0595":
    native: "5 (five)"
    notes:
      "n1": "The Kannada form of 5, not the Latin 5. Its word is ಐದು (aidu)."
  "kn-0596":
    native: "6 (six)"
    notes:
      "n1": "The Kannada form of 6, not the Latin 6. Its word is ಆರು (āru)."
  "kn-0597":
    native: "7 (seven)"
    notes:
      "n1": "The Kannada form of 7, not the Latin 7. Its word is ಏಳು (ēḷu)."
  "kn-0598":
    native: "8 (eight)"
    notes:
      "n1": "The Kannada form of 8, not the Latin 8. Its word is ಎಂಟು (eṇṭu)."
  "kn-0599":
    native: "9 (nine)"
    notes:
      "n1": "The Kannada form of 9, not the Latin 9. Its word is ಒಂಬತ್ತು (ombattu)."
