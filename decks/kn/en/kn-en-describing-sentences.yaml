cards:
  "kn-7392":
    native: "This is easy."
  "kn-7393":
    native: "This is difficult."
  "kn-7394":
    notes:
      "n1": "ಹಸಿದಿದ್ದೇನೆ (hasididdēne) is ಹಸಿದ (hasida), hungry, with ಇದ್ದೇನೆ (iddēne), I am, joined to it, so Kannada needs no separate word for 'am'."
    native: "I am hungry."
    bases:
      "ಹಸಿದಿದ್ದೇನೆ": "hungry"
  "kn-7395":
    native: "This is tall."
    notes:
      "n1": "ಎತ್ತರ (ettara) means 'height', and 'tall' is said as 'this is height': ಇದು (idu) 'this' is used for a thing."
  "kn-7396":
    native: "That is heavy; this is light."
    notes:
      "n1": "ಅದು (adu) 'that' and ಇದು (idu) 'this' are used for things, and the comma joins two sentences with no verb."
  "kn-7397":
    notes:
      "n1": "ಸಂತೋಷವಾಗಿದ್ದಾಳೆ (santōṣavāgiddāḷe) is ಸಂತೋಷ (santōṣa), happy, with ಆಗಿ (āgi) and ಇದ್ದಾಳೆ (iddāḷe), she is, so it needs no separate word for 'is'."
    native: "She is happy."
    bases:
      "ಸಂತೋಷವಾಗಿದ್ದಾಳೆ": "happy (she)"
  "kn-7398":
    native: "I am angry."
    notes:
      "n1": "ನನಗೆ (nanage) 'to me' is the dative, and ಬಂದಿದೆ (bandide) 'has come' is used for a feeling: literally 'anger has come to me'."
    bases:
      "ನನಗೆ": "to me"
      "ಬಂದಿದೆ": "has come"
  "kn-7399":
    native: "This is bitter."
