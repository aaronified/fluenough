schema: 1
id: "kn-en-opinions"
kind: "layer"
core: "kn-opinions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Opinions: agree, disagree, praise and criticize"
license: "CC-BY-SA-4.0"
description: "Giving your opinion: agreeing and disagreeing politely, praising and criticizing, and saying why. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1361":
    native: "opinion"
    notes:
      "n1": "An opinion, what you think about something."
    examples:
      "ನನ್ನ ಅಭಿಪ್ರಾಯ ಹೇಳು.": "Tell your opinion."
      "ಅವನ ಅಭಿಪ್ರಾಯ ಸರಿ.": "His opinion is right."
  "kn-1362":
    native: "to agree"
    notes:
      "n1": "To agree with someone. The opposite is ಒಪ್ಪದಿರು (oppadiru)."
    examples:
      "ನಾನು ಒಪ್ಪುತ್ತೇನೆ.": { native: "I agree.", bases: { "ಒಪ್ಪುತ್ತೇನೆ": "agree" } }
      "ಅವರು ಒಪ್ಪಿದರು.": { native: "They agreed.", bases: { "ಒಪ್ಪಿದರು": "agreed" } }
  "kn-1363":
    native: "agreement, consent"
    notes:
      "n1": "Agreement, or consent, to do something."
    examples:
      "ಒಪ್ಪಿಗೆ ಇದೆ.": { native: "There is agreement.", bases: { "ಇದೆ": "there is" } }
      "ನನ್ನ ಒಪ್ಪಿಗೆ ಬೇಕು.": "I need your consent."
  "kn-1364":
    native: "disagreement"
    notes:
      "n1": "A disagreement, a difference of opinion."
    examples:
      "ಭಿನ್ನಾಭಿಪ್ರಾಯ ಇದೆ.": { native: "There is a disagreement.", bases: { "ಇದೆ": "there is" } }
      "ಭಿನ್ನಾಭಿಪ್ರಾಯ ಬೇಡ.": "No disagreement."
  "kn-1365":
    native: "opposition, objection"
    notes:
      "n1": "Opposition, an objection to an idea."
    examples:
      "ವಿರೋಧ ಇದೆ.": { native: "There is opposition.", bases: { "ಇದೆ": "there is" } }
      "ಈ ಯೋಜನೆಗೆ ವಿರೋಧ ಬಂತು.": "Opposition came to this plan."
  "kn-1366":
    native: "to praise"
    notes:
      "n1": "To praise someone for what they did well."
    examples:
      "ಶಿಕ್ಷಕರು ಹೊಗಳಿದರು.": { native: "The teacher praised him.", bases: { "ಹೊಗಳಿದರು": "praised" } }
      "ಅವನನ್ನು ಹೊಗಳು.": "Praise him."
  "kn-1367":
    native: "criticism"
    notes:
      "n1": "Criticism, a comment on what is wrong."
    examples:
      "ಟೀಕೆ ಮಾಡಬೇಡ.": "Do not criticize."
      "ಅವರ ಟೀಕೆ ಕಠಿಣ.": "Their criticism is harsh."
  "kn-1368":
    native: "to criticize"
    notes:
      "n1": "To criticize, to point out faults."
    examples:
      "ಅವನು ಟೀಕಿಸುತ್ತಾನೆ.": { native: "He criticizes.", bases: { "ಟೀಕಿಸುತ್ತಾನೆ": "criticizes" } }
      "ಅವರು ಟೀಕಿಸಿದರು.": { native: "They criticized.", bases: { "ಟೀಕಿಸಿದರು": "criticized" } }
  "kn-1369":
    native: "to admire, to like"
    notes:
      "n1": "To like or admire something very much."
    examples:
      "ನಾನು ಈ ಚಿತ್ರ ಮೆಚ್ಚುತ್ತೇನೆ.": { native: "I admire this picture.", bases: { "ಮೆಚ್ಚುತ್ತೇನೆ": "admire" } }
      "ಅವಳು ಮೆಚ್ಚಿದಳು.": { native: "She liked it.", bases: { "ಮೆಚ್ಚಿದಳು": "liked" } }
  "kn-1370":
    native: "to feel, to seem"
    notes:
      "n1": "To feel, or to seem, what you think is so."
    examples:
      "ನನಗೆ ಹಾಗೆ ಅನಿಸುತ್ತದೆ.": { native: "It seems so to me.", bases: { "ಅನಿಸುತ್ತದೆ": "seems" } }
      "ಅವನಿಗೆ ಸರಿ ಅನಿಸಿತು.": { native: "He felt it was right.", bases: { "ಅನಿಸಿತು": "felt" } }
  "kn-1371":
    native: "belief, trust"
    notes:
      "n1": "Belief, or trust in someone or something."
    examples:
      "ನನಗೆ ನಂಬಿಕೆ ಇದೆ.": { native: "I have trust.", bases: { "ಇದೆ": "have" } }
      "ಅವನ ನಂಬಿಕೆ ಸರಿ.": "His belief is right."
  "kn-1372":
    native: "argument"
    notes:
      "n1": "An argument, a set of reasons for a view."
    examples:
      "ವಾದ ಬೇಡ.": "No argument."
      "ಅವನ ವಾದ ಸರಿ.": "His argument is right."
  "kn-1373":
    native: "truth"
    notes:
      "n1": "The truth, what is real and correct."
    examples:
      "ಸತ್ಯ ಹೇಳು.": "Tell the truth."
      "ಇದು ಸತ್ಯ.": "This is the truth."
  "kn-1374":
    native: "lie, false"
    notes:
      "n1": "A lie, something that is not true."
    examples:
      "ಸುಳ್ಳು ಹೇಳಬೇಡ.": "Do not tell a lie."
      "ಅದು ಸುಳ್ಳು.": "That is a lie."
  "kn-1375":
    native: "reason"
    notes:
      "n1": "The reason for something, why it happened."
    examples:
      "ಕಾರಣ ಏನು?": "What is the reason?"
      "ಮಳೆ ಕಾರಣ.": "Rain is the reason."
  "kn-1376":
    native: "excellent, good"
    notes:
      "n1": "Excellent or very good. The opposite is ಕೆಟ್ಟ (keṭṭa)."
    examples:
      "ಉತ್ತಮ ಕೆಲಸ.": "Excellent work."
      "ಅವನು ಉತ್ತಮ ಶಿಕ್ಷಕ.": "He is an excellent teacher."
  "kn-1377":
    native: "discussion"
    notes:
      "n1": "A discussion, where people talk about an idea."
    examples:
      "ಚರ್ಚೆ ಮುಗಿಯಿತು.": "The discussion is over."
      "ಚರ್ಚೆ ಬೇಕು.": "A discussion is needed."
  "kn-1378":
    native: "reasonable"
    notes:
      "n1": "Reasonable, fair, sensible."
    examples:
      "ಇದು ಸಮಂಜಸ.": "This is reasonable."
      "ಸಮಂಜಸ ಉತ್ತರ.": "A reasonable answer."
  "kn-1379":
    native: "true, real"
    notes:
      "n1": "True or real. A true thing is also ನಿಜ (nija)."
    examples:
      "ಅದು ನಿಜ.": "That is true."
      "ನಿಜ ಸಂತೋಷ.": "A true joy."
  "kn-1380":
    native: "not right"
    notes:
      "n1": "Not right, not correct, said of an opinion."
    examples:
      "ಅದು ಸರಿಯಲ್ಲ.": "That is not right."
      "ಅವನ ವಾದ ಸರಿಯಲ್ಲ.": "His argument is not right."
  "kn-1381":
    native: "harsh, hard"
    notes:
      "n1": "Harsh, strict or hard."
    examples:
      "ಶಿಕ್ಷಕರು ಕಠಿಣ.": "The teacher is strict."
      "ಕಠಿಣ ನಿರ್ಧಾರ.": "A hard decision."
  "kn-1382":
    native: "congratulations, praise"
    notes:
      "n1": "Congratulations, a praise for an achievement."
    examples:
      "ಅಭಿನಂದನೆ!": "Congratulations!"
      "ನಿನಗೆ ಅಭಿನಂದನೆ.": "Congratulations to you."
