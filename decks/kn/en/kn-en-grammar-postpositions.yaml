schema: 1
id: "kn-en-grammar-postpositions"
kind: "layer"
core: "kn-grammar-postpositions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Case endings and postpositions"
license: "CC0-1.0"
description: "In, to, from, with: endings on the noun, and words after it. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0355":
    native: "at home; in the house"
    notes:
      "n1": "-ಅಲ್ಲಿ (-alli), 'in', on ಮನೆ (mane), joined by a y. In speech, ಮನೇಲಿ (manēli)."
  "kn-0356":
    native: "from Bengaluru"
    notes:
      "n1": "-ಇಂದ (-inda) is 'from'. A noun in -u often takes -ಇನ- (-ina-) first: ಊರು (ūru), ಊರಿನಿಂದ (ūrininda)."
  "kn-0357":
    native: "Give it to Ramu, please."
    notes:
      "n1": "-ಗೆ (-ge), 'to', after a joining v. In speech often ರಾಮುಗೆ (rāmuge)."
    bases:
      "ರಾಮುವಿಗೆ": "Ramu (a man's name)"
  "kn-0358":
    native: "with me"
    notes:
      "n1": "ಜೊತೆ (jote), 'company', after the possessive: 'my company'."
    bases:
      "ನನ್ನ": "I"
      "ಜೊತೆ": "with; company"
  "kn-0359":
    native: "on the table"
    notes:
      "n1": "Words of place follow the noun in its 'of' form: ಮೇಜು (mēju), ಮೇಜಿನ (mējina), of the table."
    bases:
      "ಮೇಲೆ": "on; above"
  "kn-0360":
    native: "under the table"
    bases:
      "ಕೆಳಗೆ": "under; below"
  "kn-0361":
    native: "near the station"
    bases:
      "ಸ್ಟೇಷನ್": "station"
  "kn-0362":
    native: "for you"
    notes:
      "n1": "-ಗಾಗಿ (-gāgi), 'for the sake of': ನಿಮಗೆ (nimage) + ಆಗಿ (āgi)."
  "kn-0363":
    native: "after the meal"
    notes:
      "n1": "In speech also ಊಟ ಆದಮೇಲೆ (ūṭa ādamēle), 'when the meal is over'."
    bases:
      "ನಂತರ": "after"
  "kn-0364":
    native: "before the meal"
    notes:
      "n1": "ಮುಂಚೆ (muñce), 'before', takes the 'to' form: ಊಟ (ūṭa) + -ಕ್ಕೆ (-kke)."
    bases:
      "ಮುಂಚೆ": "before"
  "kn-0365":
    native: "with a pen"
    notes:
      "n1": "-ಇಂದ (-inda) is also 'with, by means of': ಪೆನ್ನಿನಿಂದ ಬರೆಯಿರಿ (pennininda bareyiri), please write with a pen."
