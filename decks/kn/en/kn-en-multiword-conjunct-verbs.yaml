kind: "layer"
core: "kn-multiword-conjunct-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: conjunct verbs"
description: "Eighteen verb phrases made of a noun and a light verb or a verbalising ending: cook, work, help, travel, bathe, begin, try, spend, delay, be late, get married, be glad, struggle, be fed up, hide, keep in mind, recite and render into Kannada. Eleven of them are cards the grammar and dailylife decks already teach, listed here by reference; the other seven were checked against an English or Kannada Wiktionary entry or a Wikipedia grammar page, and the note says which. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "kn-6359":
    native: "to be late; to get delayed"
    notes:
      "u1": "ತಡ (taḍa) ಆಗು (āgu) is the noun ತಡ (taḍa), delay, with ಆಗು (āgu), to become: something is late. The Kannada Wiktionary entry for ತಡ (taḍa) lists it as ತಡವಾಗು (taḍavāgu), joined in writing. Compare ತಡ (taḍa) ಮಾಡು (māḍu), where a person causes the delay."
    bases:
      "ಆಗು": "to happen; to become; to be finished"
  "kn-6361":
    native: "to be glad; to feel happy"
    notes:
      "u1": "ಸಂತೋಷ (santōṣa) ಆಗು (āgu) is the noun ಸಂತೋಷ (santōṣa), joy, with ಆಗು (āgu), to become. The English Wiktionary entry for ಸಂತೋಷ (santōṣa) gives ಅವಳನ್ನು (avaḷannu) ನೋಡಿ (nōḍi) ಬಹಳ (bahaḷa) ಸಂತೋಷವಾಯಿತು (santōṣavāyitu), I became very happy after seeing her. ಆಗು (āgu) becomes ಆಯಿತು (āyitu) in the past."
    bases:
      "ಆಗು": "to happen; to become; to be finished"
  "kn-6363":
    native: "to be fed up; to be upset"
    notes:
      "u1": "ಬೇಸರಪಡು (bēsarapaḍu) is the noun ಬೇಸರ (bēsara), weariness, with ಪಡು (paḍu), to undergo. The Kannada Wiktionary entry for ಬೇಸರ (bēsara) lists ಬೇಸರಪಡಬಾರದು (bēsarapaḍabāradu), one should not be fed up, written as one word."
    bases:
      "ಪಡು": "to undergo; to experience; to suffer"
  "kn-6364":
    native: "to hide; to conceal"
    notes:
      "u1": "ಮರೆ (mare) ಮಾಡು (māḍu) is the noun ಮರೆ (mare), concealment, with ಮಾಡು (māḍu), to do. Do not confuse it with the verb ಮರೆ (mare), to forget, which has its own card. The Kannada Wiktionary entry for ಮರೆ (mare) lists ಮರೆ (mare) ಮಾಡು (māḍu) and ಮರೆಯಾಗು (mareyāgu) under the sense of concealment."
    bases:
      "ಮರೆ": "concealment; cover; a hiding place"
  "kn-6365":
    native: "to keep in mind; to remember"
    notes:
      "u1": "ನೆನಪಿಡು (nenapiḍu) is the noun ನೆನಪು (nenapu), memory, with ಇಡು (iḍu), to put: to keep something in mind. The two join and the end of ನೆನಪು (nenapu) changes to ನೆನಪಿ (nenapi). The Kannada Wiktionary entry for ನೆನಪು (nenapu) gives ನೆನಪಿಡತಕ್ಕ (nenapiḍatakka) ಮಾತುಗಳು (mātugaḷu), words worth keeping in mind."
    bases:
      "ನೆನಪಿಡು": "memory; remembrance"
  "kn-6366":
    native: "to recite"
    notes:
      "u1": "The ending ಇಸು (isu) turns a noun into a verb: ಪಾಠ (pāṭha) plus ಇಸು (isu) gives ಪಾಠಿಸು (pāṭhisu), and the final ಅ (a) of the noun drops. English Wikipedia's Kannada grammar gives pāṭha, recitation, plus -isu as pāṭhisu, to recite. The same ending makes verbs from many borrowed Sanskrit nouns."
  "kn-6367":
    native: "to render into Kannada"
    notes:
      "u1": "ಕನ್ನಡಿಸು (kannaḍisu) is the noun ಕನ್ನಡ (kannaḍa) plus the verbalising ending ಇಸು (isu). The Kannada Wikipedia page on the verb gives it in ಅವನು (avanu) ಆ (ā) ಗ್ರಂಥವನ್ನು (granthavannu) ಕನ್ನಡಿಸಿದನು (kannaḍisidanu), He rendered that text into Kannada; the page names the pattern but gives no English for the verb."
