  "kn-6350":
    native: "to cook"
    notes:
      "u1": "ಅಡುಗೆ ಮಾಡು (aḍuge māḍu) is the noun ಅಡುಗೆ (aḍuge), cooking, with ಮಾಡು (māḍu), to do, as in ಕೆಲಸ ಮಾಡು (kelasa māḍu), to work. The source sentence is ಅವನು (avanu) ತಾನೇ (tānē) ಅಡುಗೆ (aḍuge) ಮಾಡಿಕೊಂಡನು (māḍikoṇḍanu), He cooked for himself."
