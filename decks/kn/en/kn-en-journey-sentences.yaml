cards:
  "kn-7089":
    native: "The journey is tomorrow."
  "kn-7090":
    native: "Where is the coach?"
  "kn-7091":
    native: "Where is the platform?"
  "kn-7092":
    native: "Is the flight this evening?"
    notes:
      "n1": "No question word is needed: the rising voice makes it a question. A question can also end in -ಆ (-ā) on its last word, as in ಸಂಜೆಯಾ (sañjeyā)."
  "kn-7093":
    native: "Why is it late?"
  "kn-7094":
    native: "It has become late."
    notes:
      "n1": "ಆಯಿತು (āyitu), it became, is the past of ಆಗು (āgu), and says that something has happened."
  "kn-7095":
    native: "Where is the timetable?"
  "kn-7096":
    native: "Who is the passenger?"
  "kn-7097":
    native: "Where is the conductor?"
  "kn-7098":
    native: "What time is the arrival?"
    notes:
      "n1": "ಎಷ್ಟು ಗಂಟೆ (eṣṭu gaṇṭe), what time, is literally 'how many hours'."
