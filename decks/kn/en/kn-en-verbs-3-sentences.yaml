cards:
  "kn-7832":
    notes:
      "n1": "ಹುಡುಕುತ್ತಾನೆ (huḍukuttāne), he looks for, ends in -ುತ್ತಾನೆ (-uttāne) for 'he' in the present."
    native: "He looks for the door."
  "kn-7833":
    notes:
      "n1": "ಹಿಡಿಯುತ್ತೇನೆ (hiḍiyuttēne), I hold, ends in -ುತ್ತೇನೆ (-uttēne) for 'I' in the present."
    native: "I hold a pencil."
  "kn-7834":
    notes:
      "n1": "ಬಯಸುತ್ತಾಳೆ (bayasuttāḷe), she wants, ends in -ುತ್ತಾಳೆ (-uttāḷe) for 'she' in the present."
    native: "She wants a home."
  "kn-7835":
    notes:
      "n1": "ಒಡೆಯುತ್ತಾನೆ (oḍeyuttāne), he breaks, ends in -ುತ್ತಾನೆ (-uttāne) for 'he' in the present."
    native: "He breaks the window."
  "kn-7836":
    notes:
      "n1": "ಗೆಲ್ಲುತ್ತೇವೆ (gelluttēve), we win, ends in -ುತ್ತೇವೆ (-uttēve) for 'we' in the present."
    native: "We win the game."
  "kn-7837":
    notes:
      "n1": "ಸೋಲುತ್ತೇನೆ (sōluttēne), I lose, ends in -ುತ್ತೇನೆ (-uttēne) for 'I' in the present."
    native: "I lose."
  "kn-7838":
    notes:
      "n1": "ಮನೆಗೆ (manege), to the house, takes the dative -ಗೆ (-ge) for a place; ಸೇರುತ್ತೇವೆ (sēruttēve), we reach, ends in -ುತ್ತೇವೆ (-uttēve) for 'we'."
    native: "We reach home."
  "kn-7839":
    notes:
      "n1": "ಎಳೆಯುತ್ತೇನೆ (eḷeyuttēne), I pull, ends in -ುತ್ತೇನೆ (-uttēne) for 'I' in the present."
    native: "I pull the door."
  "kn-7840":
    notes:
      "n1": "ಸ್ವೀಕರಿಸುತ್ತಾನೆ (svīkarisuttāne), he accepts, ends in -ುತ್ತಾನೆ (-uttāne) for 'he' in the present."
    native: "He accepts the answer."
  "kn-7841":
    notes:
      "n1": "ಜಗಿಯುತ್ತಾನೆ (jagiyuttāne), he chews, ends in -ುತ್ತಾನೆ (-uttāne) for 'he' in the present."
    native: "He chews bread."
