schema: 1
id: "kn-en-directions"
kind: "layer"
core: "kn-directions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Directions"
license: "CC-BY-SA-4.0"
description: "Left, right, straight on, and asking where something is. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0366":
    native: "Where is …?"
    notes:
      "n1": "ಎಲ್ಲಿ (where) + ಇದೆ (is): ಬಸ್ ನಿಲ್ದಾಣ ಎಲ್ಲಿದೆ (bas nildāṇa ellide)? Where is the bus stop?"
  "kn-0367":
    native: "to the right"
    notes:
      "n1": "ಬಲ (bala), the right side, + -ಕ್ಕೆ (-kke). On the right: ಬಲಗಡೆ (balagaḍe)."
  "kn-0368":
    native: "to the left"
    notes:
      "n1": "ಎಡ (eḍa), the left side. On the left: ಎಡಗಡೆ (eḍagaḍe)."
  "kn-0369":
    native: "straight on"
    notes:
      "n1": "In speech also ಸೀದಾ (sīdā)."
    "examples": {
      "ಬೆನ್ನು ನೇರವಾಗಿ ಇಡು.": {"native": "Keep your back straight.", "bases": {"ನೇರವಾಗಿ": "straight", "ಇಡು": "to keep"}}
    }
  "kn-0370":
    native: "please turn"
    notes:
      "n1": "ಎಡಕ್ಕೆ ತಿರುಗಿ (eḍakke tirugi), turn left, please."
  "kn-0371":
    native: "ahead; in front"
    "examples": {
      "ನನ್ನ ಮುಂದೆ ಕುಳಿತುಕೊಳ್ಳಿ.": {"native": "Sit in front of me.", "bases": {"ನನ್ನ": "my", "ಕುಳಿತುಕೊಳ್ಳಿ": "to sit"}},
      "ಮನೆಯ ಮುಂದೆ ಮರ ಇದೆ.": {"native": "There is a tree in front of the house.", "bases": {"ಮನೆಯ": "of the house", "ಮರ": "tree", "ಇದೆ": "to be"}}
    }
  "kn-0372":
    native: "behind; back"
    "examples": {
      "ಶತಮಾನ ಹಿಂದೆ.": {"native": "A century ago.", "bases": {}},
      "ಅವನು ಹಿಂದೆ ಇಲ್ಲಿ ಇದ್ದ.": {"native": "He was here before.", "bases": {"ಇದ್ದ": "to be"}}
    }
  "kn-0373":
    native: "near"
    notes:
      "n1": "After a noun: ಸ್ಟೇಷನ್ ಹತ್ತಿರ (sṭēṣan hattira), near the station."
    "examples": {
      "ಸ್ಟೇಷನ್ ಹತ್ತಿರ": {"native": "near the station", "bases": {"ಸ್ಟೇಷನ್": "station"}},
      "ಗಡಿ ಹತ್ತಿರ ಇದೆ.": {"native": "The border is near.", "bases": {"ಇದೆ": "is"}}
    }
  "kn-0374":
    native: "far; distance"
    "examples": {
      "ಎಷ್ಟು ದೂರ?": {"native": "How far?", "bases": {}},
      "ಅಷ್ಟು ದೂರ ನಡೆಯಬೇಡ.": {"native": "Do not walk that far.", "bases": {"ದೂರ": "far", "ನಡೆಯಬೇಡ": "to walk"}}
    }
  "kn-0375":
    native: "here"
    "examples": {
      "ಇಲ್ಲಿ ಇಳಿ.": {"native": "Get off here.", "bases": {}},
      "ಇಲ್ಲಿ ಕೂರು.": {"native": "Sit here.", "bases": {}}
    }
  "kn-0376":
    native: "there"
  "kn-0377":
    native: "way; route"
    notes:
      "n1": "ದಾರಿ ತಪ್ಪಿದೆ (dāri tappide), I've lost my way."
    "examples": {
      "ನಾನು ದಾರಿ ತಪ್ಪಿದ್ದೇನೆ.": {"native": "I'm lost.", "bases": {"ನಾನು": "I", "ತಪ್ಪಿದ್ದೇನೆ": "to go astray; to miss"}},
      "ಅವನು ನನಗೆ ದಾರಿ ತೋರಿಸುತ್ತಾನೆ.": {"native": "He shows me the way.", "bases": {"ನನಗೆ": "to me", "ದಾರಿ": "way", "ತೋರಿಸುತ್ತಾನೆ": "to show"}}
    }
  "kn-0378":
    native: "road"
    "examples": {
      "ರಸ್ತೆಯಲ್ಲಿ ಎಚ್ಚರ.": {"native": "Be careful on the road.", "bases": {"ರಸ್ತೆಯಲ್ಲಿ": "road"}},
      "ರಸ್ತೆಯಲ್ಲಿ ಅಪಘಾತ ಆಯಿತು.": {"native": "There was an accident on the road.", "bases": {"ರಸ್ತೆಯಲ್ಲಿ": "road"}}
    }
  "kn-0379":
    native: "How far?"
