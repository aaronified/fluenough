core: "kn-weddings-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Weddings: the invitation, the rites and the guests: sentences"
description: "Sentences with the words of the weddings: the invitation, the rites and the guests unit and the units before it. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-7501":
    native: "I got an invitation."
    notes:
      "n1": "ನನಗೆ (nanage) 'to me' is the dative, and ಬಂದಿದೆ (bandide) 'has come' is used for a thing: literally 'an invitation has come to me'."
    bases:
      "ನನಗೆ": "to me"
      "ಬಂದಿದೆ": "has come"
  "kn-7502":
    native: "He is the groom; she is the bride."
    notes:
      "n1": "ವರ (vara) 'groom' and ವಧು (vadhu) 'bride' stand alone with no verb, joined by a comma."
  "kn-7503":
    native: "This is a wedding ceremony."
    notes:
      "n1": "ಮದುವೆ (maduve) 'wedding' comes before ಸಮಾರಂಭ (samārambha) 'ceremony' with no linking word."
    bases:
      "ಮದುವೆ": "wedding"
  "kn-7504":
    native: "My relative is here."
    notes:
      "n1": "ಇದ್ದಾರೆ (iddāre) is used for people, while ಇದೆ (ide) is for things; ಇಲ್ಲಿ (illi) 'here' comes before it."
    bases:
      "ಇದ್ದಾರೆ": "are (people)"
  "kn-7505":
    native: "Where is the wedding stage?"
    notes:
      "n1": "ಎಲ್ಲಿ (elli) 'where' comes after the noun, with no verb, as in the other location questions."
  "kn-7506":
    native: "She puts on the garland."
    notes:
      "n1": "ಹಾಕು (hāku) means 'put on' for a garland or clothes, and ಹಾಕುತ್ತಾಳೆ (hākuttāḷe) ends in ಆಳೆ (āḷe) for 'she'."
    bases:
      "ಹಾಕುತ್ತಾಳೆ": "to put on (she)"
  "kn-7507":
    native: "There is the blessing of the elders."
    notes:
      "n1": "ಹಿರಿಯರ (hiriyara) 'of the elders' takes the ರ (ra) ending for 'of', and comes before the noun it describes."
    bases:
      "ಹಿರಿಯರ": "of the elders"
      "ಇದೆ": "is"
  "kn-7508":
    native: "Please come."
    notes:
      "n1": "ದಯವಿಟ್ಟು (dayaviṭṭu) 'please' comes before the verb. ಬನ್ನಿ (banni) is the polite command of ಬಾ (bā) 'come'."
    bases:
      "ಬನ್ನಿ": "come (polite)"
