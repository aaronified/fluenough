schema: 1
id: "kn-en-history"
kind: "layer"
core: "kn-history"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "History: kings, forts, wars and heritage"
license: "CC-BY-SA-4.0"
description: "The past: kings and queens, forts and palaces, wars and soldiers, and the inscriptions and monuments that tell the story. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1541":
    native: "history"
    notes:
      "n1": "History, what happened in the past, and the study of it."
    examples:
      "ಇತಿಹಾಸ ಇಷ್ಟ.": "I like history."
      "ಇತಿಹಾಸ ಪುಸ್ತಕ ಓದು.": "Read the history book."
  "kn-1542":
    native: "king"
    notes:
      "n1": "A king, who rules a land. A queen is ರಾಣಿ (rāṇi)."
    examples:
      "ರಾಜ ಬಂದ.": "The king came."
      "ರಾಜನ ಕೋಟೆ ದೊಡ್ಡದು.": { native: "The king's fort is big.", bases: { "ರಾಜನ": "of the king" } }
  "kn-1543":
    native: "queen"
    notes:
      "n1": "A queen, the wife of a king or a ruler herself."
    examples:
      "ರಾಣಿ ಬಂದರು.": "The queen came."
      "ರಾಣಿ ಅರಮನೆಯಲ್ಲಿ ಇದ್ದಾರೆ.": { native: "The queen is in the palace.", bases: { "ಅರಮನೆಯಲ್ಲಿ": "in the palace", "ಇದ್ದಾರೆ": "is" } }
  "kn-1544":
    native: "palace"
    notes:
      "n1": "A palace, the home of a king or a queen."
    examples:
      "ಅರಮನೆ ಸುಂದರ.": "The palace is beautiful."
      "ಅರಮನೆಗೆ ಹೋಗು.": { native: "Go to the palace.", bases: { "ಅರಮನೆಗೆ": "to the palace" } }
  "kn-1545":
    native: "war, battle"
    notes:
      "n1": "A war or a battle between two armies."
    examples:
      "ಯುದ್ಧ ನಡೆಯಿತು.": "A battle took place."
      "ಯುದ್ಧ ಬೇಡ.": "No war."
  "kn-1546":
    native: "soldier"
    notes:
      "n1": "A soldier, who fights in an army."
    examples:
      "ಸೈನಿಕ ಬಂದ.": "The soldier came."
      "ಸೈನಿಕರು ಕೋಟೆಯಲ್ಲಿ ಇದ್ದಾರೆ.": { native: "The soldiers are in the fort.", bases: { "ಸೈನಿಕರು": "the soldiers", "ಇದ್ದಾರೆ": "are" } }
  "kn-1547":
    native: "hero, brave one"
    notes:
      "n1": "A brave hero, who fights bravely for his land."
    examples:
      "ವೀರ ಬಂದ.": "The hero came."
      "ವೀರರು ಯುದ್ಧ ಮಾಡಿದರು.": { native: "The heroes fought the war.", bases: { "ವೀರರು": "the heroes" } }
  "kn-1548":
    native: "empire, kingdom"
    notes:
      "n1": "An empire, a large land ruled by one king."
    examples:
      "ಸಾಮ್ರಾಜ್ಯ ದೊಡ್ಡದು.": "The empire is big."
      "ಸಾಮ್ರಾಜ್ಯದಲ್ಲಿ ಹಲವು ಊರು ಇದ್ದವು.": { native: "There were many towns in the empire.", bases: { "ಸಾಮ್ರಾಜ್ಯದಲ್ಲಿ": "in the empire", "ಇದ್ದವು": "were" } }
  "kn-1549":
    native: "inscription"
    notes:
      "n1": "An inscription, writing carved in stone on an old monument."
    examples:
      "ಶಾಸನ ಓದು.": "Read the inscription."
      "ಶಾಸನ ಹಳೆ.": "The inscription is old."
  "kn-1550":
    native: "period, time"
    notes:
      "n1": "A period of time, or an age in history."
    examples:
      "ಆ ಕಾಲ ಚೆನ್ನಾಗಿತ್ತು.": "That period was good."
      "ಈ ಕಾಲದಲ್ಲಿ ಯುದ್ಧ ಇತ್ತು.": { native: "There was a war in this period.", bases: { "ಕಾಲದಲ್ಲಿ": "in the period", "ಇತ್ತು": "there was" } }
  "kn-1551":
    native: "century"
    notes:
      "n1": "A century, one hundred years."
    examples:
      "ಶತಮಾನ ಹಿಂದೆ.": "A century ago."
      "ಈ ಶತಮಾನ ದೊಡ್ಡದು.": "This century is big."
  "kn-1552":
    native: "ancient"
    notes:
      "n1": "Ancient, very old, from the distant past."
    examples:
      "ಪ್ರಾಚೀನ ಕೋಟೆ.": "An ancient fort."
      "ಈ ದೇವಸ್ಥಾನ ಪ್ರಾಚೀನ.": "This temple is ancient."
  "kn-1553":
    native: "tower"
    notes:
      "n1": "A tower, a tall part of a palace or a temple."
    examples:
      "ಗೋಪುರ ಎತ್ತರ.": "The tower is high."
      "ಗೋಪುರ ಇದೆ.": { native: "There is a tower.", bases: { "ಇದೆ": "there is" } }
  "kn-1554":
    native: "freedom, independence"
    notes:
      "n1": "Freedom, or the independence of a country."
    examples:
      "ಸ್ವಾತಂತ್ರ್ಯ ಬೇಕು.": "Freedom is needed."
      "ದೇಶಕ್ಕೆ ಸ್ವಾತಂತ್ರ್ಯ ಸಿಕ್ಕಿತು.": { native: "The country got independence.", bases: { "ಸಿಕ್ಕಿತು": "got" } }
  "kn-1555":
    native: "dynasty"
    notes:
      "n1": "A dynasty, a line of kings from one family."
    examples:
      "ರಾಜವಂಶ ದೊಡ್ಡದು.": "The dynasty is big."
      "ರಾಜವಂಶದ ರಾಜ ಬಂದ.": { native: "The king of the dynasty came.", bases: { "ರಾಜವಂಶದ": "of the dynasty" } }
