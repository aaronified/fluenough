schema: 1
id: "kn-en-festivals"
kind: "layer"
core: "kn-festivals"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Festivals and celebrations"
license: "CC-BY-SA-4.0"
description: "Festivals and what people do at them: the lamps, the sweets, the prayers, the processions and the gifts. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-0995":
    native: "festival"
    notes:
      "n1": "A festival or a holiday with a celebration. The celebrating itself is ಆಚರಣೆ (ācaraṇe)."
    examples:
      "ಇಂದು ಹಬ್ಬ ಇದೆ.": { native: "There is a festival today.", bases: { "ಇದೆ": "is, there is" } }
      "ಹಬ್ಬದಲ್ಲಿ ಮನೆಗೆ ಅತಿಥಿ ಬರುತ್ತಾರೆ.": { native: "At the festival, guests come home.", bases: { "ಹಬ್ಬದಲ್ಲಿ": "at the festival", "ಬರುತ್ತಾರೆ": "come" } }
  "kn-0996":
    native: "Diwali"
    notes:
      "n1": "The festival of lamps, in autumn."
    examples:
      "ದೀಪಾವಳಿಯಲ್ಲಿ ದೀಪ ಹಚ್ಚುತ್ತಾರೆ.": { native: "At Diwali they light lamps.", bases: { "ದೀಪಾವಳಿಯಲ್ಲಿ": "at Diwali", "ಹಚ್ಚುತ್ತಾರೆ": "light" } }
      "ದೀಪಾವಳಿಗೆ ಪಟಾಕಿ ಸಿಡಿಸುತ್ತಾರೆ.": { native: "At Diwali they set off firecrackers.", bases: { "ದೀಪಾವಳಿಗೆ": "at Diwali", "ಸಿಡಿಸುತ್ತಾರೆ": "set off" } }
  "kn-0997":
    native: "Dasara"
    notes:
      "n1": "A long autumn festival with processions and dance."
    examples:
      "ದಸರಾದಲ್ಲಿ ಮೆರವಣಿಗೆ ಇದೆ.": { native: "At Dasara there is a procession.", bases: { "ದಸರಾದಲ್ಲಿ": "at Dasara", "ಇದೆ": "is, there is" } }
      "ದಸರಾ ಹಬ್ಬದಲ್ಲಿ ನೃತ್ಯ ಮತ್ತು ಡೋಲು ಇರುತ್ತದೆ.": { native: "At the Dasara festival there is dance and drums.", bases: { "ಹಬ್ಬದಲ್ಲಿ": "at the festival", "ಇರುತ್ತದೆ": "there is" } }
  "kn-0998":
    native: "Sankranti"
    notes:
      "n1": "A harvest festival in January, when the sun moves north."
    examples:
      "ಸಂಕ್ರಾಂತಿಗೆ ಹಬ್ಬ ಆಚರಿಸುತ್ತಾರೆ.": { native: "At Sankranti they celebrate the festival.", bases: { "ಸಂಕ್ರಾಂತಿಗೆ": "at Sankranti", "ಆಚರಿಸುತ್ತಾರೆ": "celebrate" } }
      "ಸಂಕ್ರಾಂತಿಯಲ್ಲಿ ಸಿಹಿ ತಿನ್ನುತ್ತಾರೆ.": { native: "At Sankranti they eat sweets.", bases: { "ಸಂಕ್ರಾಂತಿಯಲ್ಲಿ": "at Sankranti" } }
  "kn-0999":
    native: "rangoli, floor pattern"
    notes:
      "n1": "A pattern drawn with coloured powder at the door, in the morning."
    examples:
      "ಮನೆ ಹೊರಗೆ ರಂಗೋಲಿ ಹಾಕುತ್ತಾರೆ.": { native: "They draw a rangoli outside the house.", bases: { "ಹಾಕುತ್ತಾರೆ": "draw" } }
      "ಬೆಳಿಗ್ಗೆ ರಂಗೋಲಿ ಬಿಡಿಸುತ್ತಾರೆ.": { native: "In the morning they draw a rangoli.", bases: { "ಬಿಡಿಸುತ್ತಾರೆ": "draw" } }
  "kn-1000":
    native: "firecracker"
    notes:
      "n1": "A firecracker that bursts with a bang, set off at Diwali."
    examples:
      "ರಾತ್ರಿ ಪಟಾಕಿ ಸಿಡಿಯುತ್ತದೆ.": { native: "At night, firecrackers burst.", bases: { "ಸಿಡಿಯುತ್ತದೆ": "burst" } }
      "ಪಟಾಕಿ ಸಿಡಿಸಬೇಡ, ಮಕ್ಕಳು ಇದ್ದಾರೆ.": { native: "Do not set off firecrackers, children are here.", bases: { "ಸಿಡಿಸಬೇಡ": "do not set off", "ಇದ್ದಾರೆ": "are, there are" } }
  "kn-1001":
    native: "worship, prayer rite"
    notes:
      "n1": "The worship of a god, at home or at a temple."
    examples:
      "ಬೆಳಿಗ್ಗೆ ಪೂಜೆ ಮಾಡುತ್ತಾರೆ.": "In the morning they perform worship."
      "ದೇವಸ್ಥಾನದಲ್ಲಿ ಪೂಜೆ ಇದೆ.": { native: "There is worship at the temple.", bases: { "ಇದೆ": "is, there is" } }
  "kn-1002":
    native: "god"
    notes:
      "n1": "A god, or the gods. The god at home is also ದೇವರು (dēvaru)."
    examples:
      "ದೇವರಿಗೆ ನೈವೇದ್ಯ ಮಾಡುತ್ತಾರೆ.": { native: "They offer food to the god.", bases: { "ದೇವರಿಗೆ": "to the god" } }
      "ಮನೆಯಲ್ಲಿ ದೇವರು ಇದೆ.": { native: "There is a god at home.", bases: { "ಇದೆ": "is, there is" } }
  "kn-1003":
    native: "offering of food to a god"
    notes:
      "n1": "Food offered to a god before people eat it."
    examples:
      "ದೇವರಿಗೆ ನೈವೇದ್ಯ ಇಡುತ್ತಾರೆ.": { native: "They place an offering before the god.", bases: { "ದೇವರಿಗೆ": "to the god", "ಇಡುತ್ತಾರೆ": "place" } }
      "ನೈವೇದ್ಯ ಮುಗಿದ ಮೇಲೆ ಊಟ ಮಾಡುತ್ತಾರೆ.": { native: "After the offering, they eat.", bases: { "ಮುಗಿದ": "finished" } }
  "kn-1004":
    native: "blessed food from a temple"
    notes:
      "n1": "Food from a temple, given after the offering."
    examples:
      "ದೇವಸ್ಥಾನದಲ್ಲಿ ಪ್ರಸಾದ ಕೊಡುತ್ತಾರೆ.": "At the temple they give blessed food."
      "ಪ್ರಸಾದ ತಿನ್ನು.": "Eat the blessed food."
  "kn-1005":
    native: "fast"
    notes:
      "n1": "Not eating for a day, as a prayer or a rite."
    examples:
      "ಇಂದು ಉಪವಾಸ ಮಾಡುತ್ತೇನೆ.": "Today I am fasting."
      "ಉಪವಾಸ ಇದ್ದರೆ ನೀರು ಕುಡಿ.": { native: "If you are fasting, drink water.", bases: { "ಇದ್ದರೆ": "if there is" } }
  "kn-1006":
    native: "holige, sweet flatbread"
    notes:
      "n1": "A sweet flatbread with lentils and jaggery, made for festivals."
    examples:
      "ಹಬ್ಬಕ್ಕೆ ಹೋಳಿಗೆ ಮಾಡುತ್ತಾರೆ.": { native: "For the festival they make holige.", bases: { "ಹಬ್ಬಕ್ಕೆ": "for the festival" } }
      "ಹೋಳಿಗೆ ತುಂಬಾ ಸಿಹಿ.": "Holige is very sweet."
  "kn-1007":
    native: "gift"
    notes:
      "n1": "A present given at a festival or a wedding."
    examples:
      "ಹಬ್ಬಕ್ಕೆ ಉಡುಗೊರೆ ಕೊಡು.": { native: "Give a gift for the festival.", bases: { "ಹಬ್ಬಕ್ಕೆ": "for the festival" } }
      "ಮಕ್ಕಳಿಗೆ ಉಡುಗೊರೆ ಸಿಕ್ಕಿತು.": { native: "The children got a gift.", bases: { "ಸಿಕ್ಕಿತು": "got" } }
  "kn-1008":
    native: "good wishes"
    notes:
      "n1": "Wishes for good luck: ಹಬ್ಬದ ಶುಭಾಶಯ (habbada śubhāśaya), festival wishes."
    examples:
      "ಹಬ್ಬದ ಶುಭಾಶಯ.": { native: "Festival wishes.", bases: { "ಹಬ್ಬದ": "of the festival" } }
      "ನಿಮಗೆ ಶುಭಾಶಯ.": "Good wishes to you."
  "kn-1009":
    native: "celebration"
    notes:
      "n1": "The way a festival is celebrated, in its rites and customs."
    examples:
      "ಹಬ್ಬದ ಆಚರಣೆ ಇದೆ.": { native: "There is the festival celebration.", bases: { "ಹಬ್ಬದ": "of the festival", "ಇದೆ": "is, there is" } }
      "ಆಚರಣೆಗೆ ಊಟ ತಯಾರಿ ಮಾಡು.": { native: "Prepare the food for the celebration.", bases: { "ಆಚರಣೆಗೆ": "for the celebration" } }
  "kn-1010":
    native: "joy, festivity"
    notes:
      "n1": "The joy and noise of a festival."
    examples:
      "ಮನೆಯಲ್ಲಿ ಸಂಭ್ರಮ ಇದೆ.": { native: "There is joy at home.", bases: { "ಇದೆ": "is, there is" } }
      "ಸಂಭ್ರಮದಲ್ಲಿ ಡೋಲು ಕೇಳುತ್ತಾರೆ.": { native: "In the festivity, they listen to the drum.", bases: { "ಸಂಭ್ರಮದಲ್ಲಿ": "in the festivity" } }
  "kn-1011":
    native: "procession"
    notes:
      "n1": "A procession in the street, with people walking together."
    examples:
      "ಮೆರವಣಿಗೆ ಹೋಗುತ್ತಿದೆ.": "The procession is going."
      "ಮೆರವಣಿಗೆಯಲ್ಲಿ ಮಕ್ಕಳು ಇದ್ದಾರೆ.": { native: "There are children in the procession.", bases: { "ಮೆರವಣಿಗೆಯಲ್ಲಿ": "in the procession", "ಇದ್ದಾರೆ": "are, there are" } }
  "kn-1012":
    native: "dance"
    notes:
      "n1": "Dance, as at a festival or a wedding."
    examples:
      "ಮಕ್ಕಳು ನೃತ್ಯ ಮಾಡುತ್ತಾರೆ.": "The children dance."
      "ನೃತ್ಯ ನೋಡು.": "Watch the dance."
  "kn-1013":
    native: "drum"
    notes:
      "n1": "A drum, beaten in a procession or at a festival."
    examples:
      "ಮೆರವಣಿಗೆಯಲ್ಲಿ ಡೋಲು ಇದೆ.": { native: "There is a drum in the procession.", bases: { "ಮೆರವಣಿಗೆಯಲ್ಲಿ": "in the procession", "ಇದೆ": "is, there is" } }
      "ಸಂಭ್ರಮದಲ್ಲಿ ಡೋಲು ಬಾರಿಸುತ್ತಾರೆ.": { native: "In the festivity they beat the drum.", bases: { "ಸಂಭ್ರಮದಲ್ಲಿ": "in the festivity", "ಬಾರಿಸುತ್ತಾರೆ": "beat" } }
  "kn-1014":
    native: "guest"
    notes:
      "n1": "A guest, who is welcomed at a festival."
    examples:
      "ಅತಿಥಿ ಬಂದಿದ್ದಾರೆ.": "A guest has come."
      "ಅತಿಥಿಗೆ ಊಟ ಕೊಡು.": { native: "Give the guest a meal.", bases: { "ಅತಿಥಿಗೆ": "to the guest" } }
  "kn-1015":
    native: "wedding"
    notes:
      "n1": "A wedding, with its rites and its guests."
    examples:
      "ಮದುವೆ ಇದೆ.": { native: "There is a wedding.", bases: { "ಇದೆ": "is, there is" } }
      "ಮದುವೆಗೆ ಉಡುಗೊರೆ ಕೊಡು.": { native: "Give a gift for the wedding.", bases: { "ಮದುವೆಗೆ": "for the wedding" } }
  "kn-1016":
    native: "clothes for an occasion"
    notes:
      "n1": "The clothes you wear for an occasion, such as a festival."
    examples:
      "ಹಬ್ಬಕ್ಕೆ ಉಡುಪು ಹೊಸದು.": { native: "The clothes for the festival are new.", bases: { "ಹಬ್ಬಕ್ಕೆ": "for the festival" } }
      "ಅಮ್ಮ ಹೊಸ ಉಡುಪು ಕೊಂಡರು.": { native: "Mum bought new clothes.", bases: { "ಕೊಂಡರು": "bought" } }
  "kn-1017":
    native: "auspicious, good"
    notes:
      "n1": "Good and lucky, said of a day or a time."
    examples:
      "ಇಂದು ಶುಭ ದಿನ.": "Today is a lucky day."
      "ಶುಭ ದಿನದಲ್ಲಿ ಮದುವೆ ಇದೆ.": { native: "There is a wedding on a lucky day.", bases: { "ಇದೆ": "is, there is" } }
  "kn-1018":
    native: "prayer"
    notes:
      "n1": "A prayer, said to a god."
    examples:
      "ದೇವರಿಗೆ ಪ್ರಾರ್ಥನೆ ಮಾಡು.": { native: "Pray to the god.", bases: { "ದೇವರಿಗೆ": "to the god" } }
      "ಬೆಳಿಗ್ಗೆ ಪ್ರಾರ್ಥನೆ ಮಾಡುತ್ತೇನೆ.": "In the morning I pray."
  "kn-1019":
    native: "flower"
    notes:
      "n1": "A flower, used in worship and at weddings."
    examples:
      "ದೇವರಿಗೆ ಹೂವು ಇಡುತ್ತಾರೆ.": { native: "They place flowers before the god.", bases: { "ದೇವರಿಗೆ": "to the god", "ಇಡುತ್ತಾರೆ": "place" } }
      "ಹೂವು ಬೇಕು.": "Flowers are needed."
  "kn-1020":
    native: "colour"
    notes:
      "n1": "A colour. Which colour is ಯಾವ ಬಣ್ಣ (yāva baṇṇa)?"
    examples:
      "ರಂಗೋಲಿಗೆ ಬಣ್ಣ ಬೇಕು.": { native: "The rangoli needs colour.", bases: { "ರಂಗೋಲಿಗೆ": "to the rangoli" } }
      "ಯಾವ ಬಣ್ಣ?": "Which colour?"
  "kn-1021":
    native: "to celebrate"
    notes:
      "n1": "To celebrate a festival, or to mark an occasion."
    examples:
      "ನಾವು ಹಬ್ಬ ಆಚರಿಸುತ್ತೇವೆ.": { native: "We celebrate the festival.", bases: { "ಆಚರಿಸುತ್ತೇವೆ": "celebrate" } }
      "ಮನೆಯಲ್ಲಿ ಆಚರಿಸುತ್ತಾರೆ.": { native: "They celebrate at home.", bases: { "ಆಚರಿಸುತ್ತಾರೆ": "celebrate" } }
  "kn-1022":
    native: "preparation"
    notes:
      "n1": "Getting ready for something, such as a festival meal."
    examples:
      "ಹಬ್ಬಕ್ಕೆ ತಯಾರಿ ಮಾಡು.": { native: "Prepare for the festival.", bases: { "ಹಬ್ಬಕ್ಕೆ": "for the festival" } }
      "ಊಟದ ತಯಾರಿ ಇದೆ.": { native: "There is preparation of the meal.", bases: { "ಇದೆ": "is, there is" } }
  "kn-1023":
    native: "lamp ceremony"
    notes:
      "n1": "A ceremony with a lamp waved before a god or a guest."
    examples:
      "ದೇವರಿಗೆ ಆರತಿ ಮಾಡುತ್ತಾರೆ.": { native: "They perform the lamp ceremony for the god.", bases: { "ದೇವರಿಗೆ": "to the god" } }
      "ಆರತಿಯಲ್ಲಿ ದೀಪ ಇದೆ.": { native: "There is a lamp in the ceremony.", bases: { "ಆರತಿಯಲ್ಲಿ": "in the ceremony", "ಇದೆ": "is, there is" } }
