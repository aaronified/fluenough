schema: 1
id: "kn-en-cinema"
kind: "layer"
core: "kn-cinema"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Cinema: films, actors and the screen"
license: "CC-BY-SA-4.0"
description: "Going to the cinema: the film and its story, the actors and the director, the scenes, the songs and the audience. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1507":
    native: "actor"
    notes:
      "n1": "An actor, a man who acts in films or plays. An actress is ನಟಿ (naṭi)."
    examples:
      "ನಟ ಬಂದ.": "The actor came."
      "ಆ ನಟ ಚೆನ್ನಾಗಿ ಅಭಿನಯಿಸಿದ.": { native: "That actor acted well.", bases: { "ಅಭಿನಯಿಸಿದ": "acted" } }
  "kn-1508":
    native: "actress"
    notes:
      "n1": "An actress, a woman who acts in films or plays."
    examples:
      "ನಟಿ ಬಂದರು.": "The actress came."
      "ನಟಿ ನೃತ್ಯ ಮಾಡಿದರು.": "The actress danced."
  "kn-1509":
    native: "acting, performance"
    notes:
      "n1": "Acting, the art of playing a part in a film or a play."
    examples:
      "ಅವನ ಅಭಿನಯ ಚೆನ್ನಾಗಿದೆ.": "His acting is good."
      "ಅಭಿನಯ ಮಾಡು.": "Act."
  "kn-1510":
    native: "director"
    notes:
      "n1": "A film director, who guides the making of a film."
    examples:
      "ನಿರ್ದೇಶಕ ಬಂದರು.": "The director came."
      "ನಿರ್ದೇಶಕ ಹೊಸ ಸಿನಿಮಾ ಮಾಡಿದರು.": "The director made a new film."
  "kn-1511":
    native: "story"
    notes:
      "n1": "A story, what happens in a film or a book."
    examples:
      "ಕಥೆ ಚೆನ್ನಾಗಿದೆ.": "The story is good."
      "ಈ ಸಿನಿಮಾದ ಕಥೆ ದೊಡ್ಡದು.": "The story of this film is big."
  "kn-1512":
    native: "role, character"
    notes:
      "n1": "A role or a character, which an actor plays."
    examples:
      "ಅವನ ಪಾತ್ರ ಸುಂದರ.": "His role is beautiful."
      "ಪಾತ್ರ ಚೆನ್ನಾಗಿದೆ.": "The role is good."
  "kn-1513":
    native: "song"
    notes:
      "n1": "A song, sung in a film or at a festival."
    examples:
      "ಗೀತೆ ಕೇಳು.": "Listen to the song."
      "ಗೀತೆ ಸುಂದರ.": "The song is beautiful."
  "kn-1514":
    native: "audience, viewer"
    notes:
      "n1": "A viewer or the audience of a film or a play."
    examples:
      "ಪ್ರೇಕ್ಷಕರು ನಕ್ಕರು.": { native: "The audience laughed.", bases: { "ಪ್ರೇಕ್ಷಕರು": "the audience" } }
      "ಪ್ರೇಕ್ಷಕ ಬಂದ.": "The viewer came."
  "kn-1515":
    native: "scene"
    notes:
      "n1": "A scene, one part of a film."
    examples:
      "ಈ ದೃಶ್ಯ ಸುಂದರ.": "This scene is beautiful."
      "ದೃಶ್ಯ ದೊಡ್ಡದು.": "The scene is big."
  "kn-1516":
    native: "dialogue"
    notes:
      "n1": "A dialogue, the words the actors speak to each other."
    examples:
      "ಸಂಭಾಷಣೆ ಚೆನ್ನಾಗಿದೆ.": "The dialogue is good."
      "ಸಂಭಾಷಣೆ ಕೇಳು.": "Listen to the dialogue."
  "kn-1517":
    native: "producer"
    notes:
      "n1": "A film producer, who pays for a film."
    examples:
      "ನಿರ್ಮಾಪಕ ಬಂದ.": "The producer came."
      "ನಿರ್ಮಾಪಕ ಹಣ ಕೊಟ್ಟ.": "The producer gave money."
  "kn-1518":
    native: "award, prize"
    notes:
      "n1": "An award, given for a good film or a good work."
    examples:
      "ಪ್ರಶಸ್ತಿ ಸಿಕ್ಕಿತು.": { native: "The award was received.", bases: { "ಸಿಕ್ಕಿತು": "was received" } }
      "ಅವನಿಗೆ ಪ್ರಶಸ್ತಿ ಬಂತು.": "He got an award."
  "kn-1519":
    native: "subtitle"
    notes:
      "n1": "A subtitle, the words shown at the bottom of a film."
    examples:
      "ಉಪಶೀರ್ಷಿಕೆ ಇದೆಯೇ?": { native: "Are there subtitles?", bases: { "ಇದೆಯೇ": "are there" } }
      "ಉಪಶೀರ್ಷಿಕೆ ಓದು.": "Read the subtitle."
  "kn-1520":
    native: "background"
    notes:
      "n1": "The background of a scene, or the music behind a film."
    examples:
      "ಹಿನ್ನೆಲೆ ಸಂಗೀತ ಇದೆ.": { native: "There is background music.", bases: { "ಇದೆ": "there is" } }
      "ಹಿನ್ನೆಲೆ ಚೆನ್ನಾಗಿದೆ.": "The background is good."
  "kn-1521":
    native: "art"
    notes:
      "n1": "Art, painting, music or acting, made with skill."
    examples:
      "ಕಲೆ ಇಷ್ಟ.": "I like art."
      "ಕಲೆ ಕಲಿ.": "Learn an art."
  "kn-1522":
    native: "hero"
    notes:
      "n1": "The hero of a film or a story."
    examples:
      "ಕಥಾನಾಯಕ ಬಂದ.": "The hero came."
      "ಕಥಾನಾಯಕನ ಪಾತ್ರ ಸುಂದರ.": { native: "The hero's role is beautiful.", bases: { "ಕಥಾನಾಯಕನ": "of the hero" } }
  "kn-1523":
    native: "clapping, applause"
    notes:
      "n1": "Applause, clapping the hands for someone."
    examples:
      "ಚಪ್ಪಾಳೆ ಬೇಕು.": "Applause is needed."
      "ಜನರು ಚಪ್ಪಾಳೆ ತಟ್ಟಿದರು.": { native: "The people clapped.", bases: { "ತಟ್ಟಿದರು": "clapped" } }
