id: "kn-en-script"
kind: "layer"
core: "kn-script"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How Kannada script works"
intro: "Kannada script is built from a few ideas that come back in letter after letter. It is a close cousin of Telugu script, and they look strange at first because English has none of them. Once you have seen them, the letters start to make sense."
features:
  "tick":
    name: "The tick on top"
    text: "Many letters wear a small tick on top, the talekattu, 'head knot'. Some vowel signs take its place, so a letter's top changes with its vowel: ಕ (ka), ಕಿ (ki), ಕೆ (ke)."
  "rounds":
    name: "Letters built from rounds"
    text: "Most letters are curves and circles. The usual explanation is that they were scratched into palm leaves with a stylus, and a straight line along the leaf would split it. Letters often differ by a small detail inside the round, so look closely: ಬ (ba) and ಭ (bha), ದ (da) and ಧ (dha)."
  "breath-mark":
    name: "A breathy letter is its partner with a mark"
    text: "Often the letter with a breath after it is its plain partner with a small extra stroke, usually below: ದ (da) and ಧ (dha), ತ (ta) and ಥ (tha), ಡ (ḍa) and ಢ (ḍha)."
  "inherent-vowel":
    name: "The vowel you don't see"
    text: "Every consonant carries a short a unless a sign changes it: ಕ (ka) alone is ka. Unlike Hindi, the last a of a word is said: ಕಮಲ (kamala) is kamala. Native Kannada words end in a vowel, and words from English often gain one: bus becomes ಬಸ್ಸು (bassu)."
  "vowel-signs":
    name: "Vowels as signs on a letter"
    text: "After a consonant a vowel is a sign on it: in place of the tick on top (ಕಿ), or joined on the right (ಕಾ (kā), ಕು (ku), ಕೆ (ke)). None is written before the letter. Children learn every consonant with every sign in a chart, the kagunita."
  "long-mark":
    name: "A mark for a long vowel"
    text: "A short and a long vowel make different words in Kannada. For ii, ee and oo the long one is the short sign with a mark ೕ (dīrgha) added on the right: ಕಿ (ki) and ಕೀ (kī), ಕೆ (ke) and ಕೇ (kē), ಕೊ (ko) and ಕೋ (kō)."
  "halant":
    name: "The mark that takes the vowel away"
    text: "The small mark ್ on a letter means no vowel after it. It ends words from English written in Kannada, such as ಬಸ್ (bas, bus) and ಡಾಕ್ಟರ್ (ḍākṭar, doctor)."
  "ottakshara":
    name: "The second consonant below"
    text: "Two consonants with no vowel between them: the second is written small below the first, the ottakshara. Some look little like their letter, such as the small ರ (ra) below ಪ (pa) in ಪ್ರ (pra), and the small ಯ (ya) in ವ್ಯ (vya)."
  "arkavottu":
    name: "An r written after its consonant"
    text: "An r before another consonant is not written below it but after it, as a small mark: in ಕರ್ನಾಟಕ (karnāṭaka) the r is the mark after ನ (na). Read it before the letter it follows."
  "doubled":
    name: "Doubled consonants"
    text: "A consonant written again below itself is held longer, and it changes the word. Doubled letters are everywhere in Kannada: ಅಮ್ಮ (amma), ಅಕ್ಕ (akka), ಹತ್ತು (hattu)."
  "sonne":
    name: "The circle after a letter"
    text: "A small circle ಂ (am) after a letter, also called ಸೊನ್ನೆ (sonne, zero), is an m or an n: the nasal that suits the next letter, as in ಕಂಬ (kamba, pillar) and ಗಂಗೆ (gaṅge)."
  "digits":
    name: "Kannada digits"
    text: "Kannada has its own digits, seen on some signs and in older books. Everyday Kannada mostly uses 0 to 9."
