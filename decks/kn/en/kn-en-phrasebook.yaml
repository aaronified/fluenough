schema: 1
id: "kn-en-phrasebook"
kind: "layer"
core: "kn-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "20 phrases to say whole from the first day, before their words are taught: greetings and thanks, yes and no, saying you are still learning Kannada, asking for it slowly or again, and asking for help. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC0-1.0"
cards:
  "kn-0142":
    native: "hello; goodbye"
    notes:
      "n1": "Said with palms pressed together, to anyone. In a family, younger people often greet elders by touching their feet; a visitor is not expected to."
  "kn-0144":
    native: "How are you? (respectful)"
    notes:
      "n1": "Literally 'how are you?'. To a friend: ಹೇಗಿದ್ದೀಯ? (hegiddiya?)."
  "kn-0145":
    native: "I'm fine."
    notes:
      "n1": "ಚೆನ್ನಾಗಿ (cennāgi) is 'well'. In speech, ಚೆನ್ನಾಗಿದ್ದೀನಿ (cennāgiddīni)."
  "kn-0146":
    native: "thank you"
    notes:
      "n1": "Formal. Many people simply say 'thanks' in English, and among family thanks are often left out."
  "kn-0147":
    native: "OK; all right; correct"
  "kn-0148":
    native: "goodbye (said by the one leaving)"
    notes:
      "n1": "Literally 'I'll go and come back'. A plain 'I'm going' can sound final. The one staying says ಹೋಗಿ ಬನ್ನಿ (hōgi banni), go and come back."
  "kn-0149":
    native: "I don't know Kannada."
    notes:
      "n1": "Literally 'Kannada does not come to me'. In speech, ಕನ್ನಡ ಬರಲ್ಲ (kannaḍa baralla)."
  "kn-0150":
    native: "I'm still learning Kannada."
  "kn-0151":
    native: "Please speak slowly."
    notes:
      "n1": "The ending -ಇ (-i) makes a polite request: ಕುಳಿತುಕೊಳ್ಳಿ (kuḷitukoḷḷi), please sit."
  "kn-0152":
    native: "Please say that again."
  "kn-0153":
    native: "sorry; excuse me"
    notes:
      "n1": "Literally 'forgive'. Also to get past someone or to get their attention."
  "kn-0164":
    native: "yes; that's right"
    notes:
      "n1": "Often with a nod or a sideways tilt of the head, which also means yes."
  "kn-0165":
    native: "no; there isn't"
    notes:
      "n1": "The everyday 'no': ಕಾಫಿ ಇದೆಯಾ (kāfi ideyā)? ಇಲ್ಲ (illa). Is there coffee? No."
  "kn-0197":
    native: "My name is …"
    notes:
      "n1": "No 'is': 'my name …'."
  "kn-0198":
    native: "What is your name?"
    notes:
      "n1": "To a child or a friend: ನಿನ್ನ ಹೆಸರು ಏನು? (ninna hesaru enu?)."
  "kn-0524":
    native: "Please help!"
    notes:
      "n1": "ದಯವಿಟ್ಟು (dayaviṭṭu) is a formal 'please'."
  "kn-0525":
    native: "Help! Save me!"
  "kn-0531":
    native: "I'm lost."
    notes:
      "n1": "'I have missed the way'."
  "kn-0532":
    native: "I didn't understand."
    notes:
      "n1": "'To me the meaning did not come about'."
  "kn-0533":
    native: "Where is the toilet?"
    notes:
      "n1": "ಶೌಚಾಲಯ (śaucālaya) is the word on signs; many say ಟಾಯ್ಲೆಟ್ (ṭāyleṭ)."
