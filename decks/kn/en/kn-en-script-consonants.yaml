schema: 1
id: "kn-en-script-consonants"
kind: "layer"
core: "kn-script-consonants"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kannada consonants"
license: "CC0-1.0"
description: "Every consonant a beginner meets, each carrying its vowel a: the plain and breathy ones, the ones on the teeth and curled back, and the two l's. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0014":
    native: "k (ka)"
    notes:
      "n1": "Like the 'k' of 'skin', with no puff of breath. Every consonant carries the short a (ಅ) unless a sign changes it. ಕಾಲು (kālu, leg)."
  "kn-0015":
    native: "kh, with a breath (kha)"
    notes:
      "n1": "ಕ (ka) with a puff of breath after it, mostly in words from Sanskrit and Hindi: ಖರ್ಚು (kharcu, expense)."
  "kn-0016":
    native: "g (ga)"
    notes:
      "n1": "Like the 'g' of 'go': ಗಾಳಿ (gāḷi, wind)."
  "kn-0017":
    native: "gh, with a breath (gha)"
    notes:
      "n1": "ಗ (ga) with a breath after it, mostly in words from Sanskrit: ಮೇಘ (mēgha, cloud)."
  "kn-0018":
    native: "ng (as in 'sing')"
    notes:
      "n1": "Rare today: Kannada writes the circle ಂ (am) in its place, as in ಗಂಗೆ (gaṅge, the Ganges). Hardly ever heard on its own, so it is drilled by reading and writing only."
  "kn-0019":
    native: "ch (ca)"
    notes:
      "n1": "Like the 'ch' of 'church', with no puff of breath: ಚಮಚ (camaca, spoon)."
  "kn-0020":
    native: "chh, with a breath (cha)"
    notes:
      "n1": "ಚ (ca) with a breath after it, in a few words: ಛತ್ರಿ (chatri, umbrella)."
  "kn-0021":
    native: "j (ja)"
    notes:
      "n1": "Like the 'j' of 'judge': ಜನ (jana, people)."
  "kn-0022":
    native: "jh, with a breath (jha)"
    notes:
      "n1": "ಜ (ja) with a breath after it, in a few words: ಝರಿ (jhari, a stream)."
  "kn-0023":
    native: "ny (in conjuncts)"
    notes:
      "n1": "Seen almost only in ಜ್ಞ (jña), as in ಜ್ಞಾನ (jñāna, knowledge). Hardly ever heard on its own, so it is drilled by reading and writing only."
  "kn-0024":
    native: "t, curled back (ṭa)"
    notes:
      "n1": "The tongue tip curls back to touch the roof of the mouth: retroflex. English 't' is close to this. Compare ತ (ta): ಕೋಟೆ (kōṭe, fort)."
  "kn-0025":
    native: "th, curled back, with a breath (ṭha)"
    notes:
      "n1": "ಟ (ṭa) with a breath after it, in words from Sanskrit: ಪಾಠ (pāṭha, lesson)."
  "kn-0026":
    native: "d, curled back (ḍa)"
    notes:
      "n1": "The tongue tip curls back, as for ಟ (ṭa). English 'd' is close to this. Compare ದ (da): ಡಬ್ಬ (ḍabba, tin; box)."
  "kn-0027":
    native: "dh, curled back, with a breath (ḍha)"
    notes:
      "n1": "ಡ (ḍa) with a breath after it, in a few words from Sanskrit."
  "kn-0028":
    native: "n, curled back (ṇa)"
    notes:
      "n1": "The tongue tip curls back, as for ಟ (ṭa): ಹಣ (haṇa, money). Compare ನ (na), on the teeth."
  "kn-0029":
    native: "t, on the teeth (ta)"
    notes:
      "n1": "The tongue touches the back of the upper teeth: dental. English has no such t; it sounds softer. Compare ಟ (ṭa): ತಲೆ (tale, head)."
  "kn-0030":
    native: "th, on the teeth, with a breath (tha)"
    notes:
      "n1": "ತ (ta) with a breath after it. Not the 'th' of 'thin': ಕಥೆ (kathe, story)."
  "kn-0031":
    native: "d, on the teeth (da)"
    notes:
      "n1": "The tongue touches the back of the upper teeth, as for ತ (ta). Compare ಡ (ḍa): ದಾರಿ (dāri, way)."
  "kn-0032":
    native: "dh, on the teeth, with a breath (dha)"
    notes:
      "n1": "ದ (da) with a breath after it, in words from Sanskrit: ಧನ್ಯವಾದ (dhanyavāda, thanks)."
  "kn-0033":
    native: "n, on the teeth (na)"
    notes:
      "n1": "Like the 'n' of 'no', with the tongue on the teeth: ನೀರು (nīru, water)."
  "kn-0034":
    native: "p (pa)"
    notes:
      "n1": "Like the 'p' of 'spin', with no puff of breath: ಪುಸ್ತಕ (pustaka, book)."
  "kn-0035":
    native: "ph, with a breath (pha)"
    notes:
      "n1": "ಪ (pa) with a breath after it, in words from Sanskrit: ಫಲ (phala, fruit; result). In words from English most people say f: ಫೋನ್ (fōn, phone)."
  "kn-0036":
    native: "b (ba)"
    notes:
      "n1": "Like the 'b' of 'bat': ಬಾಗಿಲು (bāgilu, door)."
  "kn-0037":
    native: "bh, with a breath (bha)"
    notes:
      "n1": "ಬ (ba) with a breath after it, in words from Sanskrit: ಭಯ (bhaya, fear)."
  "kn-0038":
    native: "m (ma)"
    notes:
      "n1": "Like the 'm' of 'man': ಮನೆ (mane, house)."
  "kn-0039":
    native: "y (ya)"
    notes:
      "n1": "Like the 'y' of 'yes': ಯಾರು (yāru, who)."
  "kn-0040":
    native: "r (ra)"
    notes:
      "n1": "A light tap of the tongue, never silent as in southern English: ರಸ್ತೆ (raste, road)."
  "kn-0041":
    native: "l (la)"
    notes:
      "n1": "Like the 'l' of 'leaf', with the tongue on the teeth: ಲೋಟ (lōṭa, a tumbler)."
  "kn-0042":
    native: "v or w (va)"
    notes:
      "n1": "Between English 'v' and 'w': ವಾರ (vāra, week)."
  "kn-0043":
    native: "sh (śa)"
    notes:
      "n1": "The 'sh' of 'shop': ಶನಿವಾರ (śanivāra, Saturday)."
  "kn-0044":
    native: "sh, curled back (ṣa)"
    notes:
      "n1": "Said with the tongue curled back in careful speech, in words from Sanskrit: ಭಾಷೆ (bhāṣe, language). It sounds just like ಶ (śa) in everyday speech, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  "kn-0045":
    native: "s (sa)"
    notes:
      "n1": "The 's' of 'sun'. Unlike ಶ (śa), never 'sh': ಸಮಯ (samaya, time)."
  "kn-0046":
    native: "h (ha)"
    notes:
      "n1": "Like the 'h' of 'hat': ಹಾಲು (hālu, milk)."
  "kn-0047":
    native: "l, curled back (ḷa)"
    notes:
      "n1": "The tongue tip curls back for this l, unlike ಲ (la): ಕಳ್ಳ (kaḷḷa, thief). Kannada tells them apart: ಹಾಲು (hālu, with the l on the teeth) is milk, but ಹಾಳು (hāḷu, with the l curled back) is ruined."
