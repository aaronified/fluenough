# Layer for kn-culture-3: each item's English rendering and a note on it.
schema: 1
id: "kn-en-culture-3"
kind: "layer"
core: "kn-culture-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: Haridasa songs, Sharifa and Sarvajna"
description: "Eighteen opening and other lines of songs by Purandara Dasa, Kanaka Dasa and Shishunala Sharifa, and tripadis in the name of Sarvajna, each with its English rendering and a note. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "kn-6100":
    native: "There is always worry for the soul, until the mind comes to delight in Shri Ranga (Vishnu)."
    notes:
      "n1": "The opening two lines of a song of Purandara Dasa. The song goes on to list worries: with a wife or without one, poor or rich. Only the opening is on the card."

  "kn-6101":
    native: "Buy rock sugar, all of you, buy rock sugar."
    notes:
      "n1": "The opening line of a song of Purandara Dasa. The rock sugar is the name of Krishna, which the song says only those who taste it know, and which needs no ox, sack or toll. Only the opening is on the card."

  "kn-6102":
    native: "Until you become the guru's servant, brother, liberation is not found; what is the use of reading every kind of scripture; Devotion is wasted."
    notes:
      "n1": "The opening of a song of Purandara Dasa on the need for a guru. The page lists more things that do not bring liberation, such as wearing a garland or counting beads."

  "kn-6103":
    native: "Tongue without manners, give up your low ways, tongue."
    notes:
      "n1": "The opening of a song of Purandara Dasa that speaks to the tongue. It goes on to ask the tongue to speak the truth, not to lie and not to run down the poor."

  "kn-6104":
    native: "Money is the company of wicked people; money is very bad, brother."
    notes:
      "n1": "The opening of a song of Purandara Dasa on money. Duggani was a small coin."

  "kn-6105":
    native: "All that happened turned out for the good; it became wealth and a means for serving our Shridhara (Vishnu)."
    notes:
      "n1": "The opening of a song of Purandara Dasa. In the verses that follow he thanks his wife for the changes that pushed him to a life of devotion."

  "kn-6106":
    native: "Do not be afraid, my mind, be patient; he will look after everyone; there is no doubt of it."
    notes:
      "n1": "The opening of a song of Kanaka Dasa. The verses that follow ask who watered the tree on the hilltop and who feeds the animals of the forest, to say that God cares for all."

  "kn-6107":
    native: "Who built a bank around the tree born on the hilltop and poured water on it?"
    notes:
      "n1": "A line from the first verse of the song of Kanaka Dasa on the card before. It is a question whose answer is that God, who made the tree, looks after it."

  "kn-6108":
    native: "A thin gruel in the house of good people is better than sweet rice pudding in the house of bad people."
    notes:
      "n1": "A line from a song of Kanaka Dasa. Payasa is sweet rice pudding. The word for the gruel is read as a kind of thin porridge; a Kannada speaker should check it."

  "kn-6109":
    native: "Do not cry, little sister, do not cry; those who came to send you off will not keep you here."
    notes:
      "n1": "The opening of a song of Shishunala Sharifa. The page says he saw a young bride being sent to her husband's house and sang it; it also reads the song as a warning that worldly life offers no release."

  "kn-6110":
    native: "The roof of the house is leaking, because of ignorance."
    notes:
      "n1": "The opening of a song of Shishunala Sharifa. The page reads the leaking house as the body and mind worn down by ignorance."

  "kn-6111":
    native: "Look, dear, how grand the mill is."
    notes:
      "n1": "The opening line of a song of Shishunala Sharifa. The page says it describes the new cotton-ginning mill in Hubballi, which amazed people of his day, and that the song credits Queen Victoria with bringing it."

  "kn-6112":
    native: "Lakshmi of good fortune, come, mother; you, Lakshmi of great good fortune, come, mother."
    notes:
      "n1": "The refrain of a song of Purandara Dasa that welcomes the goddess Lakshmi into the home. The verses that follow, which are not on the card, ask her to come with the sound of anklets, as butter rises in buttermilk and on Fridays at the time of worship."

  "kn-6113":
    native: "Let whatever comes come; let Govinda's mercy be with us."
    notes:
      "n1": "The refrain of a song of Purandara Dasa. The verses that follow, which are not on the card, recall how the Pandavas were saved from the house of lac."

  "kn-6114":
    native: "Before the god of food is there any other god; life lasts only as long as there is food; food itself is God in the world, says Sarvajna."
    notes:
      "n1": "A tripadi, the three-line verse in which Sarvajna's sayings are given. Each tripadi ends with the signature word, which the card keeps. The page prints the verse across three lines, and the card joins the word split at the end of the second line."

  "kn-6115":
    native: "What is the fruit of walking round a temple without the heart; it is like an ox that carries the oil press and goes round and round every day, says Sarvajna."
    notes:
      "n1": "A tripadi against empty ritual: the ox that turns the oil press goes round all day and gets nowhere."

  "kn-6116":
    native: "What difference is there between the giver and God, sir; God gives to the world with his own hand; the giver is God, says Sarvajna."
    notes:
      "n1": "A tripadi on giving. The word for giver and the word for God are only a letter apart in the first line, which is the play of the verse."

  "kn-6117":
    native: "For one who remembers God in the mind, what is a house or a monastery; what use is it to one who does not remember in the mind to be at the far end of a temple, says Sarvajna."
    notes:
      "n1": "A tripadi that says prayer is a matter of the mind, not of the place."
