core: "kn-shopping-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Shopping: sentences"
description: "Sentences with the words of the shopping unit and the units before it. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-7435":
    native: "This is expensive."
  "kn-7436":
    native: "This is cheap."
  "kn-7437":
    native: "I need a receipt."
    notes:
      "n1": "What is needed is the subject, and the person takes ನನಗೆ (nanage), to me: ರಸೀದಿ (rasīdi) is what is wanted, with ಬೇಕು (bēku)."
    bases:
      "ನನಗೆ": "to me"
      "ಬೇಕು": "needed"
  "kn-7438":
    native: "I will buy this."
    notes:
      "n1": "When ಇದು (idu), this, is the thing bought, it becomes ಇದನ್ನು (idannu), with -ನ್ನು (-nnu) marking the object."
    bases:
      "ಇದನ್ನು": "this (object)"
      "ಕೊಳ್ಳುತ್ತೇನೆ": "to buy (I)"
  "kn-7439":
    native: "Do you have a card?"
    notes:
      "n1": "'Do you have' is ನಿಮ್ಮ ಬಳಿ (nimma baḷi), with you, and ಇದೆಯಾ (ideyā), is it there?, the question form of ಇದೆ (ide)."
    bases:
      "ಬಳಿ": "near; with"
      "ಇದೆಯಾ": "is there (question)"
  "kn-7440":
    native: "What is the price?"
    notes:
      "n1": "ದರ (dara) means a rate or a price; ಬೆಲೆ (bele) is another word for price."
  "kn-7441":
    native: "This is too much."
    notes:
      "n1": "ಹೆಚ್ಚು (heccu), more, here means 'too much'."
  "kn-7442":
    native: "I will pay."
    notes:
      "n1": "ಪಾವತಿ (pāvati), payment, with ಮಾಡು (māḍu), do, makes 'to pay'."
    bases:
      "ಮಾಡುತ್ತೇನೆ": "to do (I)"
  "kn-7443":
    native: "This is silver."
