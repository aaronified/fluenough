schema: 1
id: "kn-en-grammar-pitfalls"
kind: "layer"
core: "kn-grammar-pitfalls"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Pitfalls"
license: "CC0-1.0"
description: "The mistakes English speakers make most in Kannada. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0534":
    native: "Let's go."
    notes:
      "n1": "Kannada has one 'we', ನಾವು (nāvu), with or without the listener, where Telugu and Tamil have two. -ಓಣ (-ōṇa), 'let's', hardly needs it: ಹೋಗೋಣ (hōgōṇa)."
    bases:
      "ನಾವು": "we"
  "kn-0535":
    native: "This isn't water."
    notes:
      "n1": "ಅಲ್ಲ (alla): it is not that. Not ಇಲ್ಲ (illa)."
    bases:
      "ಇದು": "this"
  "kn-0536":
    native: "There's no water."
    notes:
      "n1": "ಇಲ್ಲ (illa): there isn't any. Not ಅಲ್ಲ (alla)."
  "kn-0537":
    native: "I'm hungry."
    notes:
      "n1": "'To me hunger has come': ನನಗೆ (nanage), not ನಾನು (nānu)."
    bases:
      "ನನಗೆ": "I"
      "ಹಸಿವಾಗಿದೆ": "hunger"
  "kn-0538":
    native: "I have to go."
    notes:
      "n1": "-ಬೇಕು (-bēku) on the verb: must."
    bases:
      "ನಾನು": "I"
      "ಹೋಗಬೇಕು": "to go"
  "kn-0539":
    native: "Please sit down."
    notes:
      "n1": "A request to someone you respect ends in -ಇ (-i). ಕುಳಿತುಕೋ (kuḷitukō), for a child, sounds like an order to an adult."
  "kn-0540":
    native: "Mr Ramu has come."
    notes:
      "n1": "Respect goes after the name, and the verb takes the plural."
    bases:
      "ರಾಮು": "Ramu (a man's name)"
      "ಬಂದಿದ್ದಾರೆ": "to come"
  "kn-0541":
    native: "My elder sister came."
    notes:
      "n1": "A woman takes -ಅಳು (-aḷu), never the -ತು (-tu) of a thing, as she would in Telugu."
    bases:
      "ನನ್ನ": "I"
      "ಬಂದಳು": "to come"
  "kn-0542":
    native: "I don't know."
    notes:
      "n1": "'To me it is not known': ನನಗೆ (nanage), not ನಾನು (nānu)."
    bases:
      "ನನಗೆ": "I"
      "ಗೊತ್ತಿಲ್ಲ": "known"
