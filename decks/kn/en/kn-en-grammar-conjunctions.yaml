schema: 1
id: "kn-en-grammar-conjunctions"
kind: "layer"
core: "kn-grammar-conjunctions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Joining words"
license: "CC0-1.0"
description: "And, but, or, because, if: joining words and sentences. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0504":
    native: "and"
    notes:
      "n1": "Between two nouns speech often puts -ಊ (-ū) on both: ಅಪ್ಪನೂ ಅಮ್ಮನೂ (appanū ammanū), father and mother."
  "kn-0505":
    native: "but"
    notes:
      "n1": "Also 'if it is': ಹಾಗಾದರೆ (hāgādare), if so, then."
  "kn-0506":
    native: "or"
    notes:
      "n1": "In a question, speech asks twice: ಟೀ ಬೇಕಾ (ṭī bēkā), ಕಾಫಿ ಬೇಕಾ (kāfi bēkā)? tea or coffee?"
  "kn-0507":
    native: "because"
    notes:
      "n1": "'If you say why': the reason comes after it."
  "kn-0508":
    native: "that's why; so"
    notes:
      "n1": "Literally 'for that'."
  "kn-0509":
    native: "that (quoting what is said or thought)"
    notes:
      "n1": "After the words quoted: ಅವನು ಬರುತ್ತೇನೆ ಅಂತ ಹೇಳಿದ (avanu baruttēne anta hēḷida), he said he would come. Written ಎಂದು (endu)."
  "kn-0510":
    native: "if (someone) comes"
    notes:
      "n1": "'If' is the ending -ಅರೆ (-are): ಮಾಡಿದರೆ (māḍidare), if (you) do; ಹೋದರೆ (hōdare), if (you) go."
  "kn-0511":
    native: "also; too; even"
    notes:
      "n1": "Also the ending -ಊ (-ū): ನಾನೂ (nānū), me too."
  "kn-0512":
    native: "otherwise; or else"
