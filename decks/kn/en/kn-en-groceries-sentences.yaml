schema: 1
id: "kn-en-groceries-sentences"
kind: "layer"
core: "kn-groceries-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Groceries: sentences"
description: "Sentences at the grocer's: asking for vegetables, fish and staples by the kilo or the packet, and asking the price. They use the words of the groceries unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8161":
    notes:
      "n1": "ಕೊಡಿ (koḍi) is the polite command of ಕೊಡು (koḍu), to give."
    native: "Give me two kilos of onions."
    bases:
      "ನನಗೆ": "I, in the dative: to me"
      "ಕೊಡಿ": "to give, here as the polite command"
  "kn-8162":
    notes:
      "n1": "Kannada needs no word for 'of': ಅಕ್ಕಿ (akki) ಎಷ್ಟು (eṣṭu) ಕಿಲೋ (kilō)? is 'how many kilos of rice?', with the rice named first."
    native: "How many kilos of rice?"
  "kn-8163":
    notes:
      "n1": "ಒಂದು (ondu), one, comes before the thing counted, and ಮೊಟ್ಟೆ (moṭṭe), egg, stays in the singular after a number."
    native: "Give me one dozen eggs."
    bases:
      "ಕೊಡಿ": "to give, here as the polite command"
  "kn-8164":
    notes:
      "n1": "The thing cooked is ಮೀನನ್ನು (mīnannu), the fish, with the object ending -ನ್ನು (-nnu); ಬೇಯಿಸುತ್ತೇನೆ (bēyisuttēne) ends in -ುತ್ತೇನೆ (-uttēne) for 'I' in the present."
    native: "I cook the fish."
    bases:
      "ಮೀನನ್ನು": "fish, here as the thing cooked: the fish"
      "ಬೇಯಿಸುತ್ತೇನೆ": "to cook, here in the first-person present"
  "kn-8165":
    notes:
      "n1": "ಬೆಳ್ಳುಳ್ಳಿಯನ್ನು (beḷḷuḷḷiyannu) takes the object ending -ಯನ್ನು (-yannu), and ಕತ್ತರಿಸುತ್ತಾಳೆ (kattarisuttāḷe) ends in -ುತ್ತಾಳೆ (-uttāḷe) for 'she' in the present."
    native: "She cuts the garlic."
    bases:
      "ಬೆಳ್ಳುಳ್ಳಿಯನ್ನು": "garlic, here as the thing cut: the garlic"
      "ಕತ್ತರಿಸುತ್ತಾಳೆ": "to cut, here in the third-person feminine present"
  "kn-8166":
    native: "Tomatoes are very sour."
  "kn-8167":
    native: "Bananas are good."
  "kn-8168":
    notes:
      "n1": "Asked on its own at a shop, ಎಷ್ಟು (eṣṭu), how much, means 'what does it cost?'"
    native: "How much is the yogurt?"
  "kn-8169":
    notes:
      "n1": "ನನಗೆ (nanage), to me, is the dative of ನಾನು (nānu), I, meaning 'to me'."
    native: "Give me one packet of rice."
    bases:
      "ನನಗೆ": "I, in the dative: to me"
      "ಕೊಡಿ": "to give, here as the polite command"
  "kn-8170":
    notes:
      "n1": "The thing fried is ಈರುಳ್ಳಿಯನ್ನು (īruḷḷiyannu), the onion, with the object ending -ಯನ್ನು (-yannu); ಹುರಿಯುತ್ತಾಳೆ (huriyuttāḷe) ends in -ುತ್ತಾಳೆ (-uttāḷe) for 'she' in the present."
    native: "She fries the onions."
    bases:
      "ಈರುಳ್ಳಿಯನ್ನು": "onion, here as the thing fried: the onions"
      "ಹುರಿಯುತ್ತಾಳೆ": "to fry, here in the third-person feminine present"
  "kn-8171":
    notes:
      "n1": "The thing bought is ಕೋಳಿಯನ್ನು (kōḷiyannu), the chicken, with the object ending -ಯನ್ನು (-yannu); ಖರೀದಿಸುತ್ತಾನೆ (kharīdisuttāne) ends in -ುತ್ತಾನೆ (-uttāne) for 'he' in the present."
    native: "He buys the chicken."
    bases:
      "ಕೋಳಿಯನ್ನು": "chicken, here as the thing bought: the chicken"
      "ಖರೀದಿಸುತ್ತಾನೆ": "to buy, here in the third-person masculine present"
  "kn-8172":
    notes:
      "n1": "ನೀವು (nīvu), you, takes the polite verb ending -ುತ್ತೀರಿ (-uttīri) on ಖರೀದಿಸುತ್ತೀರಿ (kharīdisuttīri); ಎಲ್ಲಿ (elli), where, comes before the verb."
    native: "Where do you buy vegetables?"
    bases:
      "ತರಕಾರಿಯನ್ನು": "vegetable, here as the thing bought: the vegetables"
      "ಖರೀದಿಸುತ್ತೀರಿ": "to buy, here in the polite second-person present"
