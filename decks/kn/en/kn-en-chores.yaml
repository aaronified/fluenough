schema: 1
id: "kn-en-chores"
kind: "layer"
core: "kn-chores"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Chores"
license: "CC-BY-SA-4.0"
description: "Household chores: sweeping and mopping, washing and drying clothes, the dishes and the bins, and who does what at home. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1146":
    native: "rubbish, dust, sweepings"
    notes:
      "n1": "Rubbish or sweepings, which you throw away."
    examples:
      "ಕಸ ಇದೆ.": { native: "There is rubbish.", bases: { "ಇದೆ": "there is" } }
      "ಕಸ ತೆಗೆದುಕೊ.": "Take the rubbish."
  "kn-1147":
    native: "floor, ground"
    notes:
      "n1": "The floor of a house, or the ground outside."
    examples:
      "ನೆಲ ಸ್ವಚ್ಛ ಇದೆ.": { native: "The floor is clean.", bases: { "ಇದೆ": "is" } }
      "ನೆಲದ ಮೇಲೆ ಕೂರು.": { native: "Sit on the floor.", bases: { "ನೆಲದ": "of the floor" } }
  "kn-1148":
    native: "broom"
    notes:
      "n1": "A broom, for sweeping."
    examples:
      "ಪೊರಕೆ ತೆಗೆದುಕೊ.": "Take the broom."
      "ಪೊರಕೆ ಹಳೆ.": "The broom is old."
  "kn-1149":
    native: "to wash clothes"
    notes:
      "n1": "To wash clothes, in water with soap."
    examples:
      "ಬಟ್ಟೆ ಒಗೆ.": "Wash the clothes."
      "ಅಮ್ಮ ಬಟ್ಟೆ ಒಗೆಯುತ್ತಾರೆ.": { native: "Mum washes the clothes.", bases: { "ಒಗೆಯುತ್ತಾರೆ": "washes" } }
  "kn-1150":
    native: "to dry"
    notes:
      "n1": "To dry something in the sun or the wind."
    examples:
      "ಬಟ್ಟೆ ಒಣಗಿಸು.": "Dry the clothes."
      "ಬಿಸಿಲಿನಲ್ಲಿ ಬಟ್ಟೆ ಒಣಗಿಸಿದೆ.": { native: "I dried the clothes in the sun.", bases: { "ಒಣಗಿಸಿದೆ": "dried" } }
  "kn-1151":
    native: "to fold"
    notes:
      "n1": "To fold clothes, after they are dry."
    examples:
      "ಬಟ್ಟೆ ಮಡಿಸು.": "Fold the clothes."
      "ಬಟ್ಟೆ ಮಡಿಸಿದೆ.": { native: "I folded the clothes.", bases: { "ಮಡಿಸಿದೆ": "folded" } }
  "kn-1152":
    native: "ironing"
    notes:
      "n1": "Ironing, with a hot iron, to make cloth smooth."
    examples:
      "ಇಸ್ತ್ರಿ ಮಾಡು.": "Do the ironing."
      "ಬಟ್ಟೆ ಇಸ್ತ್ರಿ ಬೇಕು.": "The cloth needs ironing."
  "kn-1153":
    native: "basket, bin"
    notes:
      "n1": "A basket or a bin for rubbish, such as ಕಸದ ಬುಟ್ಟಿ (kasada buṭṭi)."
    examples:
      "ಬುಟ್ಟಿ ಎಲ್ಲಿ?": "Where is the bin?"
      "ಕಸ ಬುಟ್ಟಿಗೆ ಹಾಕು.": { native: "Put the rubbish in the bin.", bases: { "ಬುಟ್ಟಿಗೆ": "into the bin", "ಹಾಕು": "put" } }
  "kn-1154":
    native: "bucket"
    notes:
      "n1": "A bucket, for carrying water."
    examples:
      "ಬಕೆಟ್ ತುಂಬಾ ನೀರು ಇದೆ.": { native: "The bucket has a lot of water.", bases: { "ಇದೆ": "has" } }
      "ಬಕೆಟ್ ತೆಗೆದುಕೊ.": "Take the bucket."
  "kn-1155":
    native: "mop"
    notes:
      "n1": "A mop, to wash the floor with water."
    examples:
      "ಮಾಪ್ ತೆಗೆದುಕೊ.": "Take the mop."
      "ನೆಲ ತೊಳೆ.": "Wash the floor."
  "kn-1156":
    native: "to arrange, to set in order"
    notes:
      "n1": "To arrange things in their place, in order."
    examples:
      "ಪುಸ್ತಕ ಜೋಡಿಸು.": "Arrange the books."
      "ಪಾತ್ರೆ ಜೋಡಿಸಿದೆ.": { native: "I arranged the pots.", bases: { "ಜೋಡಿಸಿದೆ": "arranged" } }
  "kn-1157":
    native: "to clean up"
    notes:
      "n1": "To clean a place, for example a room or a toilet."
    examples:
      "ಕೋಣೆ ಸ್ವಚ್ಛಗೊಳಿಸು.": "Clean the room."
      "ಶನಿವಾರ ಮನೆ ಸ್ವಚ್ಛಗೊಳಿಸುತ್ತೇವೆ.": { native: "On Saturday we clean the house.", bases: { "ಸ್ವಚ್ಛಗೊಳಿಸುತ್ತೇವೆ": "clean" } }
  "kn-1158":
    native: "dirt, stain"
    notes:
      "n1": "Dirt or a stain on clothes or a floor."
    examples:
      "ಬಟ್ಟೆ ಮೇಲೆ ಕೊಳೆ ಇದೆ.": { native: "There is dirt on the cloth.", bases: { "ಇದೆ": "there is" } }
      "ಕೊಳೆ ತೆಗೆ.": "Remove the dirt."
