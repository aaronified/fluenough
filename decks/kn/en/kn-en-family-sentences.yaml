id: "kn-en-family-sentences"
kind: "layer"
core: "kn-family-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Family: sentences"
description: "Sentences about the family: who is who, and the words for each relative. They unlock once their words and rules are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8125":
    notes:
      "n1": "ನನಗೆ (nanage) is ನಾನು (nānu), I, in the dative, so the having is to me. ಇದ್ದಾನೆ (iddāne) is ಇರು (iru), to be or exist, here for a man."
    native: "I have an elder brother."
    bases:
      "ನನಗೆ": "I, in the dative: to me"
      "ಇದ್ದಾನೆ": "to be or exist, here for a man"
  "kn-8126":
    notes:
      "n1": "ನನ್ನ (nanna), my, is the form of ನಾನು (nānu), I, before a noun, with no word for 'is'."
    native: "She is my mother."
  "kn-8127":
    notes:
      "n1": "ನನ್ನ (nanna), my, is the form of ನಾನು (nānu), I, before a noun, with no word for 'is'."
    native: "He is my father."
  "kn-8128":
    notes:
      "n1": "ತಂಗಿ (taṅgi) is a younger sister. ಅಕ್ಕ (akka) is an elder sister."
    native: "This is my younger sister."
  "kn-8129":
    notes:
      "n1": "ಇವರು (ivaru), this person, is the polite form of ಇವನು (ivanu) and ಇವಳು (ivaḷu), this man and this woman."
    native: "This is my grandmother."
  "kn-8130":
    native: "Our family is good."
  "kn-8131":
    notes:
      "n1": "ನಿಮಗೆ (nimage), to you, with ಇದ್ದಾರಾ (iddārā), are there, asks whether you have children; people take ಇದ್ದಾರೆ (iddāre), not ಇದೆ (ide)."
    native: "Do you have children?"
    bases:
      "ನಿಮಗೆ": "you, in the dative: to you"
      "ಇದ್ದಾರಾ": "to be or exist, here in a question for people"
  "kn-8132":
    notes:
      "n1": "ಇದ್ದಾರೆ (iddāre), are, is used for people, as for relatives; ಎಲ್ಲಿ (elli), where, comes before the verb."
    native: "Where are the relatives?"
    bases:
      "ಇದ್ದಾರೆ": "to be or exist, here for people"
  "kn-8133":
    notes:
      "n1": "ಅಮ್ಮನ (ammana) is ಅಮ್ಮ (amma), mother, with the ending -ನ (-na), which makes it 'my mother's'."
    native: "Doddamma is my mother's elder sister."
    bases:
      "ಅಮ್ಮನ": "mother, here in the genitive: my mother's"
  "kn-8134":
    notes:
      "n1": "ಅಮ್ಮನ (ammana), mother's, is the genitive of ಅಮ್ಮ (amma), mother, placed before the person it belongs to."
    native: "Chikkamma is our mother's younger sister."
    bases:
      "ಅಮ್ಮನ": "mother, here in the genitive: our mother's"
  "kn-8135":
    notes:
      "n1": "ಚಿಕ್ಕಪ್ಪ (cikkappa), the father's younger brother, has his own word; ಅಪ್ಪನ (appana), father's, is the genitive of ಅಪ್ಪ (appa), father."
    native: "Chikkappa is my father's younger brother."
    bases:
      "ಅಪ್ಪನ": "father, here in the genitive: my father's"
  "kn-8136":
    notes:
      "n1": "ದೊಡ್ಡಪ್ಪ (doḍḍappa), the father's elder brother, has his own word; ಅಪ್ಪನ (appana), father's, is the genitive of ಅಪ್ಪ (appa), father."
    native: "Doddappa is my father's elder brother."
    bases:
      "ಅಪ್ಪನ": "father, here in the genitive: my father's"
