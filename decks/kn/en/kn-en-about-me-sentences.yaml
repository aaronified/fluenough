native: { code: "en", iso639_3: "eng", name: "English" }
name: "About me: sentences"
description: "Sentences with the words of the about me unit and the units before it. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-7384":
    notes:
      "n1": "ನನ್ನ (nanna), my, is the form of ನಾನು (nānu), I, before a noun, with no word for 'is'."
    native: "My name is Ravi."
    bases:
      "ರವಿ": "Ravi (a man's name)"
  "kn-7385":
    notes:
      "n1": "ಊರಿನಲ್ಲಿ (ūrinalli), in the town, comes from ಊರು (ūru), town: its stem becomes ಊರಿನ (ūrina) before the locative ending -ಲ್ಲಿ (-lli)."
    native: "I live in the town."
    bases:
      "ಊರಿನಲ್ಲಿ": "town"
      "ಇದ್ದೇನೆ": "am, live (I)"
  "kn-7386":
    notes:
      "n1": "ಕೆಲಸ ಮಾಡು (kelasa māḍu), to work, is a noun with ಮಾಡು (māḍu), do; ಮಾಡುತ್ತೇನೆ (māḍuttēne) ends in -ುತ್ತೇನೆ (-uttēne) for 'I' in the present."
    native: "I work."
    bases:
      "ಮಾಡುತ್ತೇನೆ": "to do (I)"
  "kn-7387":
    notes:
      "n1": "ಇದೆ (ide), is, is used for things and places; for people the form is ಇದ್ದಾರೆ (iddāre)."
    native: "My family is in Bengaluru."
    bases:
      "ಬೆಂಗಳೂರಿನಲ್ಲಿ": "in Bengaluru"
      "ಇದೆ": "is (a place or thing)"
  "kn-7388":
    notes:
      "n1": "ನನ್ನ (nanna), my, is the form of ನಾನು (nānu), I, before a noun, with no word for 'is'."
    native: "My language is Kannada."
    bases:
      "ಕನ್ನಡ": "Kannada (the language)"
  "kn-7389":
    notes:
      "n1": "ನನ್ನ (nanna), my, is the form of ನಾನು (nānu), I, before a noun, with no word for 'is'."
    native: "My country is England."
    bases:
      "ಇಂಗ್ಲೆಂಡ್": "England"
  "kn-7390":
    notes:
      "n1": "ಇದ್ದೀರಿ (iddīri), you live, is the polite form of ಇರು (iru), be or live, ending in -ೀರಿ (-īri); ಎಲ್ಲಿ (elli), where, comes before it."
    native: "Where do you live?"
    bases:
      "ಇದ್ದೀರಿ": "live (you, polite)"
  "kn-7391":
    notes:
      "n1": "ನಿಮ್ಮ (nimma), your, is the polite form of ನಿನ್ನ (ninna), your informal; ಏನು (ēnu), what, follows the noun."
    native: "What is your work?"
