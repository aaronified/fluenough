schema: 1
id: "kn-en-adjectives-2"
kind: "layer"
core: "kn-adjectives-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing a room"
license: "CC-BY-SA-4.0"
description: "Describing a room and a house: its walls, roof and furniture, and whether it is big, quiet, clean or comfortable. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1247":
    native: "wall"
    notes:
      "n1": "A wall of a room or a house."
    examples:
      "ಗೋಡೆ ಬಿಳಿ.": "The wall is white."
      "ಗೋಡೆ ಮೇಲೆ ಚಿತ್ರ ಇದೆ.": { native: "There is a picture on the wall.", bases: { "ಇದೆ": "there is" } }
  "kn-1248":
    native: "roof, ceiling"
    notes:
      "n1": "The roof of a house, or the ceiling inside a room."
    examples:
      "ಛಾವಣಿ ಎತ್ತರ.": "The ceiling is high."
      "ಛಾವಣಿ ಮೇಲೆ ಮಳೆ ಬೀಳುತ್ತಿದೆ.": "Rain is falling on the roof."
  "kn-1249":
    native: "cupboard, shelf"
    notes:
      "n1": "A cupboard or a shelf, for clothes and things."
    examples:
      "ಕಪಾಟು ತುಂಬಾ ಬಟ್ಟೆ ಇದೆ.": { native: "The cupboard is full of clothes.", bases: { "ಇದೆ": "is" } }
      "ಕಪಾಟಿನಲ್ಲಿ ಪುಸ್ತಕ ಇಡು.": { native: "Put the books in the cupboard.", bases: { "ಕಪಾಟಿನಲ್ಲಿ": "in the cupboard", "ಇಡು": "put" } }
  "kn-1250":
    native: "balcony"
    notes:
      "n1": "A balcony, outside a room, with air and light."
    examples:
      "ಬಾಲ್ಕನಿ ಇದೆ.": { native: "There is a balcony.", bases: { "ಇದೆ": "there is" } }
      "ಬಾಲ್ಕನಿಯಲ್ಲಿ ಗಿಡ ಇದೆ.": { native: "There is a plant on the balcony.", bases: { "ಬಾಲ್ಕನಿಯಲ್ಲಿ": "on the balcony", "ಇದೆ": "there is" } }
  "kn-1251":
    native: "spacious, wide"
    notes:
      "n1": "Spacious, wide and big, said of a room."
    examples:
      "ಕೋಣೆ ವಿಶಾಲ.": "The room is spacious."
      "ವಿಶಾಲ ಮನೆ.": "A spacious house."
  "kn-1252":
    native: "cramped, narrow"
    notes:
      "n1": "Small and cramped, with no room to move."
    examples:
      "ಕೋಣೆ ಇಕ್ಕಟ್ಟು.": "The room is cramped."
      "ಇಕ್ಕಟ್ಟು ಮನೆ.": "A cramped house."
  "kn-1253":
    native: "quiet, calm"
    notes:
      "n1": "Quiet and calm, without noise."
    examples:
      "ಮನೆ ಶಾಂತ.": "The house is quiet."
      "ರಾತ್ರಿ ಶಾಂತ ಆಯಿತು.": "The night became quiet."
  "kn-1254":
    native: "noise, uproar"
    notes:
      "n1": "Noise and uproar, as in a busy street."
    examples:
      "ಗದ್ದಲ ತುಂಬಾ ಇದೆ.": { native: "There is a lot of noise.", bases: { "ಇದೆ": "there is" } }
      "ಗದ್ದಲ ಬೇಡ.": "No noise."
  "kn-1255":
    native: "comfortable"
    notes:
      "n1": "Comfortable, relaxed, and at ease."
    examples:
      "ಮಂಚ ಆರಾಮ.": "The cot is comfortable."
      "ಕುರ್ಚಿ ಆರಾಮ ಇದೆ.": { native: "The chair is comfortable.", bases: { "ಇದೆ": "is" } }
  "kn-1256":
    native: "mat"
    notes:
      "n1": "A mat, spread on the floor."
    examples:
      "ನೆಲದ ಮೇಲೆ ಚಾಪೆ ಇದೆ.": { native: "There is a mat on the floor.", bases: { "ಇದೆ": "there is" } }
      "ಚಾಪೆ ಹಾಸು.": { native: "Spread the mat.", bases: { "ಹಾಸು": "spread" } }
  "kn-1257":
    native: "bath"
    notes:
      "n1": "A bath, washing the body with water."
    examples:
      "ಸ್ನಾನ ಮಾಡು.": "Take a bath."
      "ಸ್ನಾನದ ಕೋಣೆ ಸ್ವಚ್ಛ ಇದೆ.": { native: "The bathroom is clean.", bases: { "ಸ್ನಾನದ": "of the bath", "ಇದೆ": "is" } }
  "kn-1258":
    native: "lime, whitewash"
    notes:
      "n1": "Lime, used to whitewash the walls of a house."
    examples:
      "ಗೋಡೆಗೆ ಸುಣ್ಣ ಬಳಿ.": { native: "Whitewash the wall.", bases: { "ಗೋಡೆಗೆ": "on the wall", "ಬಳಿ": "paint on" } }
      "ಸುಣ್ಣ ಬೇಕು.": "I need lime."
  "kn-1259":
    native: "small window"
    notes:
      "n1": "A small window, in a room or a bathroom."
    examples:
      "ಕಿಡಕಿ ತೆರೆ.": "Open the small window."
      "ಕಿಡಕಿ ಚಿಕ್ಕದು.": "The small window is little."
