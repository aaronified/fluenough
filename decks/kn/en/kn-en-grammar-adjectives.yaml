schema: 1
id: "kn-en-grammar-adjectives"
kind: "layer"
core: "kn-grammar-adjectives"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing words"
license: "CC-BY-SA-4.0"
description: "Good, big, new: a describing word before a noun never changes; after it, it becomes a noun. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0400":
    native: "good"
    notes:
      "n1": "Before a noun: ಒಳ್ಳೆಯ ಹುಡುಗ (oḷḷeya huḍuga), a good boy. In speech often ಒಳ್ಳೆ (oḷḷe)."
    "examples": {
      "ಇದು ಒಳ್ಳೆಯ ಪುಸ್ತಕ.": {"native": "This is a good book.", "bases": {"ಇದು": "this", "ಪುಸ್ತಕ": "book"}},
      "ಒಳ್ಳೆಯ ಆಹಾರ ತಿನ್ನು.": {"native": "Eat good food.", "bases": {}}
    }
  "kn-0401":
    native: "bad"
  "kn-0402":
    native: "big; elder"
    notes:
      "n1": "ದೊಡ್ಡಪ್ಪ (doḍḍappa), father's elder brother, is 'big father'."
    "examples": {
      "ಅಪಘಾತ ದೊಡ್ಡದು.": {"native": "The accident was big.", "bases": {"ದೊಡ್ಡದು": "big; elder"}},
      "ಅಪಾರ್ಟ್ಮೆಂಟ್ ದೊಡ್ಡದು.": {"native": "The apartment building is big.", "bases": {"ದೊಡ್ಡದು": "big; elder"}}
    }
  "kn-0403":
    native: "small; younger"
    "examples": {
      "ಅಧ್ಯಾಯ ಚಿಕ್ಕದು.": {"native": "The chapter is short.", "bases": {"ಚಿಕ್ಕದು": "small; younger"}},
      "ಇರುವೆ ಚಿಕ್ಕದು.": {"native": "The ant is tiny.", "bases": {"ಚಿಕ್ಕದು": "small one"}}
    }
  "kn-0404":
    native: "new"
    "examples": {
      "ಕಂಪ್ಯೂಟರ್ ಹೊಸದು.": {"native": "The computer is new.", "bases": {"ಹೊಸದು": "new"}},
      "ಕ್ಯಾನ್ವಾಸ್ ಹೊಸದು.": {"native": "The canvas is new.", "bases": {"ಹೊಸದು": "new"}}
    }
  "kn-0405":
    native: "old (of things)"
    notes:
      "n1": "An old person is ವಯಸ್ಸಾದ (vayassāda), 'aged'."
    "examples": {
      "ಗುಡಿ ಹಳೆಯದು.": {"native": "The shrine is old.", "bases": {"ಹಳೆಯದು": "old"}},
      "ದೇವಸ್ಥಾನ ಹಳೆಯದು.": {"native": "The temple is old.", "bases": {"ಹಳೆಯದು": "old"}}
    }
  "kn-0406":
    native: "hot"
    notes:
      "n1": "ಬಿಸಿ ಬಿಸಿ (bisi bisi), said twice, is 'piping hot'."
    "examples": {
      "ಉಪ್ಪಿಟ್ಟು ಬಿಸಿ.": {"native": "The upma is hot.", "bases": {"ಬಿಸಿ": "hot"}},
      "ಕಡಾಯಿ ಬಿಸಿ ಮಾಡು.": {"native": "Heat the wok.", "bases": {}}
    }
  "kn-0407":
    native: "cold; cool"
    "examples": {
      "ತಣ್ಣನೆಯ ಹಾಲು ಕುಡಿಯಿರಿ.": {"native": "Drink cold milk.", "bases": {"ಹಾಲು": "milk", "ಕುಡಿಯಿರಿ": "to drink"}}
    }
  "kn-0408":
    native: "beautiful"
    notes:
      "n1": "Before a noun often ಸುಂದರವಾದ (sundaravāda): ಸುಂದರವಾದ ಊರು (sundaravāda ūru), a beautiful town."
    "examples": {
      "ಅಕ್ಷರ ಸುಂದರ.": {"native": "The letter is beautiful.", "bases": {}},
      "ಅರಮನೆ ಸುಂದರ.": {"native": "The palace is beautiful.", "bases": {}}
    }
  "kn-0409":
    native: "clean"
    "examples": {
      "ಪಂಚೆ ಸ್ವಚ್ಛ.": {"native": "The dhoti is clean.", "bases": {"ಸ್ವಚ್ಛ": "clean"}},
      "ಸ್ವಚ್ಛ ಮಾಡು": {"native": "to clean", "bases": {"ಮಾಡು": "to do; to make"}}
    }
  "kn-0410":
    native: "This is a good book."
    bases:
      "ಇದು": "this"
      "ಪುಸ್ತಕ": "book"
  "kn-0411":
    native: "This room is big."
    notes:
      "n1": "After the noun the describing word becomes a noun, ದೊಡ್ಡದು (a big one), often with ಆಗಿದೆ (āgide). Also simply ಈ ಕೋಣೆ ದೊಡ್ಡದು (ī kōṇe doḍḍadu)."
  "kn-0412":
    native: "The coffee is very hot."
    notes:
      "n1": "-ಆಗಿ (-āgi) turns a describing word into 'in that way': ಬಿಸಿಯಾಗಿ (bisiyāgi), hot."
    bases:
      "ತುಂಬಾ": "very; a lot"
