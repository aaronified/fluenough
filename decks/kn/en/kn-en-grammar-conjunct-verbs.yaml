native: { code: "en", iso639_3: "eng", name: "English" }
name: "Noun + ಮಾಡು (māḍu) and ಪಡು (paḍu)"
license: "CC0-1.0"
description: "Many Kannada verbs are a noun with ಮಾಡು (māḍu), do, or ಪಡು (paḍu), feel: ಕೆಲಸ ಮಾಡು (kelasa māḍu), to work; ಭಯಪಡು (bhayapaḍu), to be afraid. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0467":
    native: "to work"
    notes:
      "n1": "ಕೆಲಸ (kelasa), work, and ಮಾಡು (māḍu), to do. So too ಸ್ನಾನ ಮಾಡು (snāna māḍu), to bathe, and ಅಡುಗೆ ಮಾಡು (aḍuge māḍu), to cook."
    bases:
      "ಮಾಡು": "to do; to make"
  "kn-0468":
    native: "to phone"
    notes:
      "n1": "ನನಗೆ ಫೋನ್ ಮಾಡಿ (nanage phōn māḍi), please call me."
    bases:
      "ಫೋನ್": "phone"
      "ಮಾಡು": "to do; to make"
  "kn-0469":
    native: "to help"
    bases:
      "ಮಾಡು": "to do; to make"
  "kn-0470":
    native: "to get married"
    notes:
      "n1": "With ಆಗು (āgu), to become, to happen: ನನಗೆ ಮದುವೆ ಆಗಿದೆ (nanage maduve āgide), I'm married."
    bases:
      "ಮದುವೆ": "marriage"
      "ಆಗು": "to become; to happen; to be possible"
  "kn-0471":
    native: "to try"
    notes:
      "n1": "Also one word, ಪ್ರಯತ್ನಿಸು (prayatnisu)."
    bases:
      "ಪ್ರಯತ್ನ": "attempt; effort"
      "ಮಾಡು": "to do; to make"
  "kn-0472":
    native: "to spend (money)"
    bases:
      "ಖರ್ಚು": "spending"
      "ಮಾಡು": "to do; to make"
  "kn-0473":
    native: "to clean"
    bases:
      "ಮಾಡು": "to do; to make"
  "kn-0474":
    native: "to travel"
    bases:
      "ಪ್ರಯಾಣ": "travel; journey"
      "ಮಾಡು": "to do; to make"
  "kn-0475":
    native: "to begin"
    notes:
      "n1": "Formally ಪ್ರಾರಂಭಿಸು (prārambhisu)."
    bases:
      "ಶುರು": "start"
      "ಮಾಡು": "to do; to make"
  "kn-0476":
    native: "to delay"
    notes:
      "n1": "To be late is ತಡ ಆಗು (taḍa āgu): ತಡ ಆಯಿತು (taḍa āyitu), I'm late."
    bases:
      "ತಡ": "delay"
      "ಮಾಡು": "to do; to make"
  "kn-0477":
    native: "to be afraid"
    notes:
      "n1": "ಪಡು (paḍu), to feel, to undergo, makes verbs of feeling. Also ಹೆದರು (hedaru)."
  "kn-0478":
    native: "to work hard; to struggle"
  "kn-0479":
    native: "to like; to be fond of"
  "kn-0480":
    native: "to be glad"
