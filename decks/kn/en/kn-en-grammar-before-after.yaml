  notes: "For before, the verb takes its basic form before ಮೊದಲು (modalu), as in ಊಟ ಮಾಡುವ ಮೊದಲು (ūṭa māḍuva modalu), before eating. For after, the verb takes its past form before ನಂತರ (nantara), as in ಊಟ ಮಾಡಿದ ನಂತರ (ūṭa māḍida nantara), after eating."
