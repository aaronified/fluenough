schema: 1
id: "kn-en-arts"
kind: "layer"
core: "kn-arts"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Arts: music, dance, painting and the stage"
license: "CC-BY-SA-4.0"
description: "The arts: the instruments and the music, the classical dance, painting and sculpture, and the play on the stage. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1524":
    native: "instrument"
    notes:
      "n1": "A musical instrument, played with the hands or the breath."
    examples:
      "ವಾದ್ಯ ನುಡಿಸು.": "Play an instrument."
      "ವಾದ್ಯ ಇದೆ.": { native: "There is an instrument.", bases: { "ಇದೆ": "there is" } }
  "kn-1525":
    native: "veena"
    notes:
      "n1": "The veena, a stringed instrument of South India."
    examples:
      "ವೀಣೆ ಸುಂದರ.": "The veena is beautiful."
      "ವೀಣೆ ನುಡಿಸುತ್ತಾಳೆ.": "She plays the veena."
  "kn-1526":
    native: "musician"
    notes:
      "n1": "A musician, who plays or sings music."
    examples:
      "ಸಂಗೀತಗಾರ ಬಂದ.": "The musician came."
      "ಸಂಗೀತಗಾರರು ಹಾಡುತ್ತಾರೆ.": { native: "The musicians sing.", bases: { "ಸಂಗೀತಗಾರರು": "the musicians" } }
  "kn-1527":
    native: "theatre, stage art"
    notes:
      "n1": "Theatre, the art of plays on a stage."
    examples:
      "ರಂಗಭೂಮಿ ಇಷ್ಟ.": "I like theatre."
      "ರಂಗಭೂಮಿಯಲ್ಲಿ ಕೆಲಸ ಮಾಡು.": { native: "Work in theatre.", bases: { "ರಂಗಭೂಮಿಯಲ್ಲಿ": "in theatre" } }
  "kn-1528":
    native: "play, drama"
    notes:
      "n1": "A play, acted on a stage."
    examples:
      "ನಾಟಕ ನೋಡೋಣ.": "Let us see a play."
      "ನಾಟಕ ಚೆನ್ನಾಗಿತ್ತು.": "The play was good."
  "kn-1529":
    native: "stage"
    notes:
      "n1": "The stage, where the actors perform."
    examples:
      "ರಂಗ ದೊಡ್ಡದು.": "The stage is big."
      "ರಂಗದ ಮೇಲೆ ನಟ ಇದ್ದಾನೆ.": { native: "The actor is on the stage.", bases: { "ರಂಗದ": "of the stage", "ಇದ್ದಾನೆ": "is" } }
  "kn-1530":
    native: "show, exhibition"
    notes:
      "n1": "A show or an exhibition, where things are shown to people."
    examples:
      "ಪ್ರದರ್ಶನ ಇದೆ.": { native: "There is a show.", bases: { "ಇದೆ": "there is" } }
      "ಚಿತ್ರ ಪ್ರದರ್ಶನ ನೋಡೋಣ.": "Let us see the painting show."
  "kn-1531":
    native: "brush"
    notes:
      "n1": "A paintbrush, for painting."
    examples:
      "ಕುಂಚ ಬೇಕು.": "I need a brush."
      "ಕುಂಚದಿಂದ ಬಿಡಿಸು.": { native: "Paint with the brush.", bases: { "ಕುಂಚದಿಂದ": "with the brush" } }
  "kn-1532":
    native: "canvas"
    notes:
      "n1": "A canvas, the cloth or board for painting on."
    examples:
      "ಕ್ಯಾನ್ವಾಸ್ ಹೊಸದು.": "The canvas is new."
      "ಕ್ಯಾನ್ವಾಸ್ ಬೇಕು.": "I need a canvas."
  "kn-1533":
    native: "sculpture"
    notes:
      "n1": "A sculpture, a figure carved in stone or wood."
    examples:
      "ಶಿಲ್ಪ ಸುಂದರ.": "The sculpture is beautiful."
      "ಶಿಲ್ಪ ನೋಡು.": "See the sculpture."
  "kn-1534":
    native: "statue, idol"
    notes:
      "n1": "A statue, or an idol of a god."
    examples:
      "ಮೂರ್ತಿ ದೊಡ್ಡದು.": "The statue is big."
      "ದೇವಸ್ಥಾನದಲ್ಲಿ ಮೂರ್ತಿ ಇದೆ.": { native: "There is an idol in the temple.", bases: { "ಇದೆ": "there is" } }
  "kn-1535":
    native: "to carve"
    notes:
      "n1": "To carve a figure from stone or wood."
    examples:
      "ಕಲ್ಲು ಕೆತ್ತು.": "Carve the stone."
      "ಅವನು ಮೂರ್ತಿ ಕೆತ್ತಿದ.": { native: "He carved a statue.", bases: { "ಕೆತ್ತಿದ": "carved" } }
  "kn-1536":
    native: "Bharatanatyam dance"
    notes:
      "n1": "Bharatanatyam, a classical dance of South India."
    examples:
      "ಭರತನಾಟ್ಯ ಸುಂದರ.": "Bharatanatyam is beautiful."
      "ಅವಳು ಭರತನಾಟ್ಯ ಕಲಿಯುತ್ತಾಳೆ.": "She learns Bharatanatyam."
  "kn-1537":
    native: "Yakshagana"
    notes:
      "n1": "Yakshagana, a folk theatre of the Malnad and coast of Karnataka."
    examples:
      "ಯಕ್ಷಗಾನ ನೋಡೋಣ.": "Let us see Yakshagana."
      "ಯಕ್ಷಗಾನ ಇದೆ.": { native: "There is Yakshagana.", bases: { "ಇದೆ": "there is" } }
  "kn-1538":
    native: "creative"
    notes:
      "n1": "Creative, making new things with imagination."
    examples:
      "ಸೃಜನಾತ್ಮಕ ಕೆಲಸ.": "A creative work."
      "ಅವಳು ಸೃಜನಾತ್ಮಕ.": "She is creative."
  "kn-1539":
    native: "artwork"
    notes:
      "n1": "An artwork, a painting, sculpture or other piece of art."
    examples:
      "ಈ ಕಲಾಕೃತಿ ಸುಂದರ.": "This artwork is beautiful."
      "ಕಲಾಕೃತಿ ಪ್ರದರ್ಶನದಲ್ಲಿ ಇದೆ.": { native: "The artwork is in the exhibition.", bases: { "ಪ್ರದರ್ಶನದಲ್ಲಿ": "in the exhibition", "ಇದೆ": "is" } }
  "kn-1540":
    native: "player of an instrument"
    notes:
      "n1": "A player of an instrument, such as a flute or a tabla."
    examples:
      "ವಾದಕ ನುಡಿಸಿದ.": "The player played."
      "ತಬಲ ವಾದಕ ಬಂದ.": "The tabla player came."
