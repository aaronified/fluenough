schema: 1
id: "kn-en-work"
kind: "layer"
core: "kn-work"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Work"
license: "CC0-1.0"
description: "Jobs, the workplace, and how to ask and say what someone does. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0224":
    native: "office"
    notes:
      "n1": "The formal word, on signs, is ಕಚೇರಿ (kacēri)."
  "kn-0225":
    native: "teacher (a man)"
    notes:
      "n1": "A woman teacher is ಶಿಕ್ಷಕಿ (śikṣaki). Many say ಟೀಚರ್ (ṭīcar), or, for a man, ಮೇಷ್ಟ್ರು (mēṣṭru)."
  "kn-0226":
    native: "shopkeeper"
    notes:
      "n1": "'The person of the shop', with respect."
  "kn-0227":
    native: "driver"
    notes:
      "n1": "The formal word is ಚಾಲಕ (cālaka)."
  "kn-0228":
    native: "engineer"
    notes:
      "n1": "Bengaluru is full of them: ಸಾಫ್ಟ್‌ವೇರ್ ಇಂಜಿನಿಯರ್ (sāphṭvēr iñjiniyar), software engineer."
  "kn-0229":
    native: "lawyer"
  "kn-0230":
    native: "nurse"
  "kn-0231":
    native: "farmer"
  "kn-0232":
    native: "cook"
    notes:
      "n1": "From ಅಡುಗೆ (aḍuge), cooking."
  "kn-0233":
    native: "writer"
    notes:
      "n1": "Also ಲೇಖಕ (lēkhaka)."
  "kn-0234":
    native: "journalist; reporter"
  "kn-0235":
    native: "doctor"
    notes:
      "n1": "The Kannada word is ವೈದ್ಯ (vaidya)."
  "kn-0236":
    native: "student"
    notes:
      "n1": "A woman student is ವಿದ್ಯಾರ್ಥಿನಿ (vidyārthini)."
  "kn-0237":
    native: "day off; holiday; leave"
  "kn-0238":
    native: "salary; pay"
  "kn-0239":
    native: "business; trade"
  "kn-0240":
    native: "What do you do (for a living)?"
    bases:
      "ಮಾಡುತ್ತೀರಿ": "to do; to make"
  "kn-0241":
    native: "I'm a teacher."
    notes:
      "n1": "A woman says ನಾನು ಶಿಕ್ಷಕಿ (nānu śikṣaki)."
    bases:
      "ನಾನು": "I"
  "kn-0242":
    native: "Where do you work?"
    bases:
      "ಮಾಡುತ್ತೀರಿ": "to do; to make"
  "kn-0243":
    native: "I work in an office."
    bases:
      "ನಾನು": "I"
