schema: 1
id: "kn-en-grammar-compound-verbs"
kind: "layer"
core: "kn-grammar-compound-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs that add a shade"
license: "CC-BY-SA-4.0"
description: "A second verb after the first adds a shade: done for good, done for oneself, done for someone. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0481":
    native: "He's gone (for good)."
    notes:
      "n1": "ಬಿಡು (biḍu), to leave, after a verb says it is done and finished."
  "kn-0482":
    notes:
      "n1": "The helper ಬಿಡು (biḍu), here as ಬಿಟ್ಟೆ (biṭṭe), shows the action was completed, often with a sense of regret."
    native: "I forgot."
  "kn-0483":
    native: "He fell down."
    notes:
      "n1": "ಹೋಗು (hōgu), to go, after a verb: it just happened."
  "kn-0484":
    notes:
      "n1": "The helper ಬಿಡು (biḍu) after ತಿಂದು (tindu) shows that everything was eaten up."
    native: "I've eaten it all up."
  "kn-0485":
    notes:
      "n1": "ಹೇಳಿಬಿಟ್ಟೆ (hēḷibiṭṭe) shows the telling is done, often unexpectedly."
    native: "I've gone and told them."
  "kn-0486":
    native: "I bought it for myself."
    notes:
      "n1": "ಕೊಳ್ಳು (koḷḷu), to take, after a verb: done for oneself."
  "kn-0487":
    notes:
      "n1": "ಕೊಂಡೆ (koṇḍe) after ಮಾಡಿ (māḍi) shows the action is done for oneself."
    native: "I did it for myself."
  "kn-0488":
    notes:
      "n1": "ನೋಡಿಕೊಳ್ಳು (nōḍikoḷḷu) means 'take care of'; ನೋಡಿಕೊಳ್ಳಿ (nōḍikoḷḷi) is its polite command."
    native: "Please take care of it; have a look."
  "kn-0489":
    native: "Please fetch it (for me)."
    notes:
      "n1": "ಕೊಡು (koḍu), to give, after a verb: done for someone else. ತರು (taru) is to bring."
  "kn-0490":
    notes:
      "n1": "ಕೊಡಿ (koḍi) after ಬರೆದು (baredu) means writing it for someone, with ಕೊಡು (koḍu), give, as helper."
    native: "Please write it down for me."
