schema: 1
id: "kn-en-sports"
kind: "layer"
core: "kn-sports"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sports: games, teams, matches and medals"
license: "CC-BY-SA-4.0"
description: "Sports: the games and the players, the ball and the bat, the match and the coach, and the medals won. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1574":
    native: "sport"
    notes:
      "n1": "A sport or a game played with rules."
    examples:
      "ಕ್ರೀಡೆ ಇಷ್ಟ.": "I like sport."
      "ಕ್ರೀಡೆ ಬೇಕು.": "Sport is needed."
  "kn-1575":
    native: "cricket"
    notes:
      "n1": "Cricket, a bat-and-ball game played in teams."
    examples:
      "ಕ್ರಿಕೆಟ್ ಆಡು.": "Play cricket."
      "ಕ್ರಿಕೆಟ್ ಪಂದ್ಯ ಇದೆ.": { native: "There is a cricket match.", bases: { "ಇದೆ": "there is" } }
  "kn-1576":
    native: "football"
    notes:
      "n1": "Football, played with the feet and a ball."
    examples:
      "ಫುಟ್ಬಾಲ್ ಇಷ್ಟ.": "I like football."
      "ಮಕ್ಕಳು ಫುಟ್ಬಾಲ್ ಆಡುತ್ತಾರೆ.": "The children play football."
  "kn-1577":
    native: "hockey"
    notes:
      "n1": "Hockey, played with sticks on a field."
    examples:
      "ಹಾಕಿ ಆಡು.": "Play hockey."
      "ಹಾಕಿ ಮೈದಾನ ದೊಡ್ಡದು.": "The hockey ground is big."
  "kn-1578":
    native: "kabaddi"
    notes:
      "n1": "Kabaddi, a game of touch and chase, with breath held."
    examples:
      "ಕಬಡ್ಡಿ ಆಡು.": "Play kabaddi."
      "ಕಬಡ್ಡಿ ಇಷ್ಟ.": "I like kabaddi."
  "kn-1579":
    native: "chess"
    notes:
      "n1": "Chess, a game of kings and pieces on a board."
    examples:
      "ಚದುರಂಗ ಆಡು.": "Play chess."
      "ಚದುರಂಗ ಬೇಕು.": "I need chess."
  "kn-1580":
    native: "player"
    notes:
      "n1": "A player, a person who plays a game."
    examples:
      "ಆಟಗಾರ ಬಂದ.": "The player came."
      "ಆಟಗಾರರು ಮೈದಾನದಲ್ಲಿ ಇದ್ದಾರೆ.": { native: "The players are on the field.", bases: { "ಆಟಗಾರರು": "the players", "ಇದ್ದಾರೆ": "are" } }
  "kn-1581":
    native: "coach, trainer"
    notes:
      "n1": "A coach or a trainer, who teaches a player."
    examples:
      "ತರಬೇತುದಾರ ಬಂದರು.": "The coach came."
      "ತರಬೇತುದಾರ ಹೇಳಿದರು.": "The coach said."
  "kn-1582":
    native: "match"
    notes:
      "n1": "A match, a game between two teams or players."
    examples:
      "ಪಂದ್ಯ ಇದೆ.": { native: "There is a match.", bases: { "ಇದೆ": "there is" } }
      "ಪಂದ್ಯ ಗೆದ್ದೆವು.": "We won the match."
  "kn-1583":
    native: "ball"
    notes:
      "n1": "A ball, used in many games."
    examples:
      "ಚೆಂಡು ಎಲ್ಲಿ?": "Where is the ball?"
      "ಚೆಂಡು ಹೊಡೆ.": { native: "Hit the ball.", bases: { "ಹೊಡೆ": "hit" } }
  "kn-1584":
    native: "bat"
    notes:
      "n1": "A bat, used to hit the ball in cricket."
    examples:
      "ಬ್ಯಾಟ್ ತೆಗೆದುಕೊ.": "Take the bat."
      "ಬ್ಯಾಟ್ ಹೊಸದು.": "The bat is new."
  "kn-1585":
    native: "goal"
    notes:
      "n1": "A goal, a score in football or hockey."
    examples:
      "ಗೋಲು ಹೊಡೆದ.": { native: "He scored a goal.", bases: { "ಹೊಡೆದ": "scored" } }
      "ಗೋಲು ಬೇಕು.": "I need a goal."
  "kn-1586":
    native: "medal"
    notes:
      "n1": "A medal, given to the winner of a race or a match."
    examples:
      "ಪದಕ ಸಿಕ್ಕಿತು.": { native: "The medal came.", bases: { "ಸಿಕ್ಕಿತು": "came" } }
      "ಅವನಿಗೆ ಚಿನ್ನದ ಪದಕ ಇದೆ.": { native: "He has a gold medal.", bases: { "ಇದೆ": "has" } }
  "kn-1587":
    native: "to jump"
    notes:
      "n1": "To jump up into the air."
    examples:
      "ಮಕ್ಕಳು ಜಿಗಿಯುತ್ತಿದ್ದಾರೆ.": { native: "The children are jumping.", bases: { "ಜಿಗಿಯುತ್ತಿದ್ದಾರೆ": "are jumping" } }
      "ಜಿಗಿ.": "Jump."
  "kn-1588":
    native: "competitor"
    notes:
      "n1": "A competitor, someone who takes part in a contest."
    examples:
      "ಸ್ಪರ್ಧಿ ಬಂದ.": "The competitor came."
      "ಸ್ಪರ್ಧಿ ಗೆದ್ದ.": "The competitor won."
