core: "kn-calendar"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Months and years"
license: "CC0-1.0"
description: "The months as Kannada says them, and the new year it keeps in spring. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0451":
    native: "month"
    notes:
      "n1": "Also the moon, in poetry: months were counted by it."
  "kn-0452":
    native: "year"
    notes:
      "n1": "Years are read like other numbers: ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತಾರು (eraḍu sāvirada ippattāru), 2026."
  "kn-0453":
    native: "date"
    notes:
      "n1": "In speech also ತಾರೀಖು (tārīkhu)."
  "kn-0454":
    native: "January"
  "kn-0455":
    native: "February"
  "kn-0456":
    native: "March"
  "kn-0457":
    native: "April"
  "kn-0458":
    native: "May"
  "kn-0459":
    native: "June"
  "kn-0460":
    native: "July"
  "kn-0461":
    native: "August"
  "kn-0462":
    native: "September"
  "kn-0463":
    native: "October"
  "kn-0464":
    native: "November"
    notes:
      "n1": "ನವೆಂಬರ್ ಒಂದು (navembar ondu), the first of November, is ಕನ್ನಡ ರಾಜ್ಯೋತ್ಸವ (kannaḍa rājyōtsava), the day Karnataka was formed in 1956."
  "kn-0465":
    native: "December"
  "kn-0466":
    native: "Ugadi, the Kannada new year"
    notes:
      "n1": "In March or April, by the moon. Kannada also has its own lunar months, from ಚೈತ್ರ (caitra) to ಫಾಲ್ಗುಣ (phālguṇa), used for festivals."
