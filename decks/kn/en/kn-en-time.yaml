schema: 1
id: "kn-en-time"
kind: "layer"
core: "kn-time"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Time and days"
license: "CC0-1.0"
description: "Today and tomorrow, telling the time, and the days of the week. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0413":
    native: "today"
    notes:
      "n1": "Written also ಇಂದು (indu)."
  "kn-0414":
    native: "tomorrow"
  "kn-0415":
    native: "yesterday"
  "kn-0416":
    native: "now"
  "kn-0417":
    native: "morning; in the morning"
  "kn-0418":
    native: "evening"
  "kn-0419":
    native: "night"
  "kn-0420":
    native: "o'clock; hours; a bell"
    notes:
      "n1": "ಐದು ಗಂಟೆ (aidu gaṇṭe), five o'clock; ಐದು ಗಂಟೆಗೆ (aidu gaṇṭege), at five."
  "kn-0421":
    native: "half past four; 4½"
    notes:
      "n1": "Half past is the number with -ಊವರೆ (-ūvare): ನಾಲ್ಕೂವರೆ ಗಂಟೆ (nālkūvare gaṇṭe), half past four."
  "kn-0422":
    native: "What time is it?"
    notes:
      "n1": "Many simply ask ಟೈಮ್ ಎಷ್ಟು? (taim eshtu?)."
  "kn-0423":
    native: "day"
  "kn-0424":
    native: "week"
    notes:
      "n1": "Each weekday is a name and ವಾರ (vāra): ಸೋಮ (sōma) + ವಾರ (vāra), Monday."
  "kn-0425":
    native: "Monday"
    notes:
      "n1": "ಸೋಮ (sōma), the moon."
  "kn-0426":
    native: "Tuesday"
    notes:
      "n1": "ಮಂಗಳ (maṅgaḷa), Mars."
  "kn-0427":
    native: "Wednesday"
    notes:
      "n1": "ಬುಧ (budha), Mercury."
  "kn-0428":
    native: "Thursday"
    notes:
      "n1": "ಗುರು (guru), Jupiter."
  "kn-0429":
    native: "Friday"
    notes:
      "n1": "ಶುಕ್ರ (śukra), Venus."
  "kn-0430":
    native: "Saturday"
    notes:
      "n1": "ಶನಿ (śani), Saturn."
  "kn-0431":
    native: "Sunday"
    notes:
      "n1": "ಭಾನು (bhānu), the sun. Also ರವಿವಾರ (ravivāra)."
