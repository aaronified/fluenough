schema: 1
id: "kn-en-time"
kind: "layer"
core: "kn-time"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Time and days"
license: "CC-BY-SA-4.0"
description: "Today and tomorrow, telling the time, and the days of the week. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0413":
    native: "today"
    notes:
      "n1": "Written also ಇಂದು (indu)."
    "examples": {
      "ಇವತ್ತಿನ ತಾಪಮಾನ ಎಷ್ಟು?": {"native": "What is today's temperature?", "bases": {"ಇವತ್ತಿನ": "today"}},
      "ಇವತ್ತು ಮೋಡ ಕವಿದಿದೆ.": {"native": "Today it is cloudy.", "bases": {"ಕವಿದಿದೆ": "has covered over"}}
    }
  "kn-0414":
    native: "tomorrow"
    "examples": {
      "ನಾಳೆ ಅಲ್ಲಿಗೆ ಹೋಗುತ್ತೇನೆ.": {"native": "I will go there tomorrow.", "bases": {"ಹೋಗುತ್ತೇನೆ": "to go"}},
      "ನಾಳೆ ಪ್ರಯಾಣ ಇದೆ.": {"native": "There is a journey tomorrow.", "bases": {"ಇದೆ": "there is"}}
    }
  "kn-0415":
    native: "yesterday"
  "kn-0416":
    native: "now"
    "examples": {
      "ಈಗ ಎಷ್ಟು ಗಂಟೆ?": {"native": "What time is it?", "bases": {}},
      "ಈಗ ಬಿಜಿ ಇದ್ದಾಳೆ.": {"native": "She is busy now.", "bases": {"ಇದ್ದಾಳೆ": "is"}}
    }
  "kn-0417":
    native: "morning; in the morning"
    "examples": {
      "ನಾನು ಬೆಳಿಗ್ಗೆ ನಡೆಯುತ್ತೇನೆ.": {"native": "I walk in the morning.", "bases": {"ಬೆಳಿಗ್ಗೆ": "in the morning", "ನಡೆಯುತ್ತೇನೆ": "to walk"}},
      "ಬೆಳಿಗ್ಗೆ ಉಪ್ಪಿಟ್ಟು ತಿಂದೆ.": {"native": "I ate upma in the morning.", "bases": {"ಬೆಳಿಗ್ಗೆ": "in the morning", "ತಿಂದೆ": "to eat"}}
    }
  "kn-0418":
    native: "evening"
    "examples": {
      "ಅವರು ಸಂಜೆ ಬಂದರು.": {"native": "They came in the evening.", "bases": {"ಸಂಜೆ": "evening", "ಬಂದರು": "to come"}},
      "ಆರತಕ್ಷತೆ ಸಂಜೆ ಇದೆ.": {"native": "The reception is in the evening.", "bases": {"ಇದೆ": "is"}}
    }
  "kn-0419":
    native: "night"
    "examples": {
      "ನರಿ ರಾತ್ರಿ ಓಡುತ್ತದೆ.": {"native": "The fox runs at night.", "bases": {"ರಾತ್ರಿ": "at night", "ಓಡುತ್ತದೆ": "runs"}},
      "ರಾತ್ರಿ ಕತ್ತಲು ಆಯಿತು.": {"native": "It became dark at night.", "bases": {}}
    }
  "kn-0420":
    native: "o'clock; hours; a bell"
    notes:
      "n1": "ಐದು ಗಂಟೆ (aidu gaṇṭe), five o'clock; ಐದು ಗಂಟೆಗೆ (aidu gaṇṭege), at five."
    "examples": {
      "ಈಗ ಎಷ್ಟು ಗಂಟೆ?": {"native": "What time is it?", "bases": {}},
      "ನಾನು ಪ್ರತಿದಿನ ಏಳು ಗಂಟೆಗೆ ಏಳುತ್ತೇನೆ.": {"native": "I get up at seven every day.", "bases": {"ನಾನು": "I", "ಗಂಟೆಗೆ": "o'clock; hours; a bell"}}
    }
  "kn-0421":
    native: "half past four; 4½"
    notes:
      "n1": "Half past is the number with -ಊವರೆ (-ūvare): ನಾಲ್ಕೂವರೆ ಗಂಟೆ (nālkūvare gaṇṭe), half past four."
  "kn-0422":
    native: "What time is it?"
    notes:
      "n1": "Many simply ask ಟೈಮ್ ಎಷ್ಟು? (taim eshtu?)."
  "kn-0423":
    native: "day"
    "examples": {
      "ಇಂದು ಶುಭ ದಿನ.": {"native": "Today is a lucky day.", "bases": {}},
      "ದಿನ ಅಭ್ಯಾಸ ಮಾಡು.": {"native": "Practise every day.", "bases": {}}
    }
  "kn-0424":
    native: "week"
    notes:
      "n1": "Each weekday is a name and ವಾರ (vāra): ಸೋಮ (sōma) + ವಾರ (vāra), Monday."
  "kn-0425":
    native: "Monday"
    notes:
      "n1": "ಸೋಮ (sōma), the moon."
  "kn-0426":
    native: "Tuesday"
    notes:
      "n1": "ಮಂಗಳ (maṅgaḷa), Mars."
  "kn-0427":
    native: "Wednesday"
    notes:
      "n1": "ಬುಧ (budha), Mercury."
  "kn-0428":
    native: "Thursday"
    notes:
      "n1": "ಗುರು (guru), Jupiter."
  "kn-0429":
    native: "Friday"
    notes:
      "n1": "ಶುಕ್ರ (śukra), Venus."
  "kn-0430":
    native: "Saturday"
    notes:
      "n1": "ಶನಿ (śani), Saturn."
    "examples": {
      "ಶನಿವಾರ ಮನೆ ಸ್ವಚ್ಛಗೊಳಿಸುತ್ತೇವೆ.": {"native": "On Saturday we clean the house.", "bases": {"ಸ್ವಚ್ಛಗೊಳಿಸುತ್ತೇವೆ": "clean"}}
    }
  "kn-0431":
    native: "Sunday"
    notes:
      "n1": "ಭಾನು (bhānu), the sun. Also ರವಿವಾರ (ravivāra)."
    "examples": {
      "ಭಾನುವಾರ ಚರ್ಚಿಗೆ ಹೋಗುತ್ತಾರೆ.": {"native": "They go to church on Sunday.", "bases": {"ಭಾನುವಾರ": "on Sunday", "ಚರ್ಚಿಗೆ": "to church", "ಹೋಗುತ್ತಾರೆ": "to go"}},
      "ಭಾನುವಾರ ಪೂರಿ ಮಾಡು.": {"native": "Make puri on Sunday.", "bases": {"ಭಾನುವಾರ": "on Sunday", "ಮಾಡು": "to make"}}
    }
