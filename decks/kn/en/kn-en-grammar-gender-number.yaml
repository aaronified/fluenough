id: "kn-en-grammar-gender-number"
kind: "layer"
core: "kn-grammar-gender-number"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Gender and number"
license: "CC0-1.0"
description: "Men, women and things in the third person, and the plural. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0328":
    native: "They came; he or she came (respectful)."
    notes:
      "n1": "-ಅರು (-aru) for people in the plural, and for one person you respect. ಬರು (baru) changes its stem in the past: ಬಂದ- (banda-)."
    bases:
      "ಬಂದರು": "to come"
  "kn-0329":
    native: "The cows came."
    notes:
      "n1": "Things and animals in the plural have a verb of their own, -ಅವು (-avu), unlike people's -ಅರು (-aru). ಬರು (baru) changes its stem in the past: ಬಂದ- (banda-)."
    bases:
      "ಹಸುಗಳು": "cow"
      "ಬಂದವು": "to come"
  "kn-0330":
    native: "The children are playing."
    bases:
      "ಆಡುತ್ತಿದ್ದಾರೆ": "to play"
  "kn-0331":
    native: "three books"
    notes:
      "n1": "-ಗಳು (-gaḷu) makes a plural, and people often take -ರು (-ru): ಹುಡುಗ (huḍuga), ಹುಡುಗರು (boy, boys). After a number the plural ending is often left out: ಮೂರು ಪುಸ್ತಕ (mūru pustaka)."
    bases:
      "ಪುಸ್ತಕಗಳು": "book"
