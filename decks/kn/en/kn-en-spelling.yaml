schema: 1
id: "kn-en-spelling"
kind: "layer"
core: "kn-spelling"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kannada spellings, old and new"
license: "CC0-1.0"
description: "Letters and spellings you will meet in older print and in everyday writing, and how they are written in the standard today. Recognition only. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0580":
    native: "rain; today ಮಳೆ (maḷe)"
    notes:
      "n1": "Old Kannada had a third l, ೞ (ḷa), said far back in the mouth like the zh of Tamil. It merged with ಳ (ḷa), and today's spelling writes ಳ (ḷa)."
  "kn-0581":
    native: "to forget; today ಮರೆ (mare)"
    notes:
      "n1": "Old Kannada also had a second r, ಱ (shakata repha). It merged with ರ (ra), and today's spelling writes ರ (ra)."
  "kn-0582":
    native: "music; today ಸಂಗೀತ (saṅgīta)"
    notes:
      "n1": "Older and Sanskrit-style print writes the nasal as a letter, ಙ (ṅa) or ಞ (ña), where today's spelling uses the circle ಂ (am)."
  "kn-0583":
    native: "there is (older, formal); today ಇದೆ (ide)"
    notes:
      "n1": "Still met in writing and in sayings."
  "kn-0584":
    native: "Karnataka; today ಕರ್ನಾಟಕ (karnāṭaka)"
    notes:
      "n1": "The older, Sanskrit-style spelling with the curled-back ಣ (ṇa)."
  "kn-0585":
    native: "morning; also ಬೆಳಿಗ್ಗೆ (beḷigge)"
    notes:
      "n1": "Both spellings are common."
  "kn-0586":
    native: "to talk; in speech and much writing ಮಾತಾಡು (mātāḍu)"
    notes:
      "n1": "ಮಾತು (word) + ಆಡು (play): the full form is the formal one."
  "kn-0587":
    native: "and also; standard ಹಾಗೂ (hāgū)"
    notes:
      "n1": "A common spelling of ಹಾಗೂ (hāgū): the ending -ಊ (-ū), 'also', is long."
  "kn-0588":
    native: "also; also written ಕೂಡ (kūḍa)"
  "kn-0589":
    native: "OK; done; written ಆಯಿತು (āyitu)"
    notes:
      "n1": "How speech is spelled in messages: ಆಯಿತು (āyitu), 'it became', is also 'OK'."
