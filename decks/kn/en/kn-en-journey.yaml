schema: 1
id: "kn-en-journey"
kind: "layer"
core: "kn-journey"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Journey"
license: "CC-BY-SA-4.0"
description: "Going somewhere by train or plane: the ticket and the platform, leaving and arriving, and asking the way. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1217":
    native: "journey, trip"
    notes:
      "n1": "A journey, or a trip, by any means of travel."
    examples:
      "ಪ್ರಯಾಣ ಚೆನ್ನಾಗಿತ್ತು.": "The journey was good."
      "ನಾಳೆ ಪ್ರಯಾಣ ಇದೆ.": { native: "There is a journey tomorrow.", bases: { "ಇದೆ": "there is" } }
  "kn-1218":
    native: "coach, carriage"
    notes:
      "n1": "A coach or carriage of a train."
    examples:
      "ಬೋಗಿ ಎಲ್ಲಿ?": "Where is the coach?"
      "ಈ ಬೋಗಿಯಲ್ಲಿ ಸೀಟು ಇದೆ.": { native: "There is a seat in this coach.", bases: { "ಬೋಗಿಯಲ್ಲಿ": "in the coach", "ಇದೆ": "there is" } }
  "kn-1219":
    native: "platform"
    notes:
      "n1": "The platform of a station, where trains stop."
    examples:
      "ಪ್ಲಾಟ್ಫಾರ್ಮ್ ಎರಡು.": "Platform two."
      "ಪ್ಲಾಟ್ಫಾರ್ಮ್ ಮೇಲೆ ಕಾಯು.": "Wait on the platform."
  "kn-1220":
    native: "aeroplane, flight"
    notes:
      "n1": "An aeroplane, or a flight by plane."
    examples:
      "ವಿಮಾನ ಹಾರುತ್ತಿದೆ.": "The plane is flying."
      "ವಿಮಾನ ನಿಲ್ದಾಣ ದೂರ ಇದೆ.": { native: "The airport is far.", bases: { "ಇದೆ": "is" } }
  "kn-1221":
    native: "arrival"
    notes:
      "n1": "Arrival, when a train or plane arrives."
    examples:
      "ಆಗಮನ ಸಮಯ ಎಷ್ಟು?": "What is the arrival time?"
      "ರೈಲು ಆಗಮನ ಆಯಿತು.": "The train arrived."
  "kn-1222":
    native: "to leave, to start"
    notes:
      "n1": "To leave, or to set off on a journey."
    examples:
      "ರೈಲು ಹೊರಡುತ್ತದೆ.": { native: "The train leaves.", bases: { "ಹೊರಡುತ್ತದೆ": "leaves" } }
      "ನಾವು ಬೇಗ ಹೊರಡೋಣ.": { native: "Let us leave early.", bases: { "ಹೊರಡೋಣ": "let us leave" } }
  "kn-1223":
    native: "to reach, to arrive"
    notes:
      "n1": "To reach a place, at the end of a journey."
    examples:
      "ಅವರು ಊರು ತಲುಪಿದರು.": { native: "They reached the town.", bases: { "ತಲುಪಿದರು": "reached" } }
      "ರೈಲು ಇನ್ನೂ ತಲುಪಿಲ್ಲ.": { native: "The train has not yet arrived.", bases: { "ತಲುಪಿಲ್ಲ": "has not reached" } }
  "kn-1224":
    native: "to get on, to climb"
    notes:
      "n1": "To get on a bus or a train, or to climb up."
    examples:
      "ರೈಲು ಏರು.": "Get on the train."
      "ಮೆಟ್ಟಿಲು ಏರು.": "Climb the stairs."
  "kn-1225":
    native: "to get off, to go down"
    notes:
      "n1": "To get off a bus or a train, or to go down."
    examples:
      "ಇಲ್ಲಿ ಇಳಿ.": "Get off here."
      "ಅವಳು ರೈಲು ಇಳಿದಳು.": { native: "She got off the train.", bases: { "ಇಳಿದಳು": "got off" } }
  "kn-1226":
    native: "late"
    notes:
      "n1": "Late, after the time. The opposite is ಬೇಗ (bēga), early."
    examples:
      "ರೈಲು ತಡ ಆಯಿತು.": "The train was late."
      "ತಡ ಆಯಿತು.": "It has become late."
  "kn-1227":
    native: "timetable"
    notes:
      "n1": "A timetable, which lists the times of trains or buses."
    examples:
      "ವೇಳಾಪಟ್ಟಿ ಎಲ್ಲಿ?": "Where is the timetable?"
      "ವೇಳಾಪಟ್ಟಿ ನೋಡು.": "Look at the timetable."
  "kn-1228":
    native: "passenger, traveller"
    notes:
      "n1": "A passenger or traveller on a bus, train or plane."
    examples:
      "ಪ್ರಯಾಣಿಕ ಬಂದ.": "The passenger came."
      "ಪ್ರಯಾಣಿಕರು ಕಾಯುತ್ತಿದ್ದಾರೆ.": { native: "The passengers are waiting.", bases: { "ಪ್ರಯಾಣಿಕರು": "the passengers" } }
  "kn-1229":
    native: "conductor"
    notes:
      "n1": "The conductor of a bus, who takes the fare."
    examples:
      "ಕಂಡಕ್ಟರ್ ಬಂದರು.": "The conductor came."
      "ಕಂಡಕ್ಟರ್ ಟಿಕೆಟ್ ಕೊಟ್ಟರು.": "The conductor gave the ticket."
