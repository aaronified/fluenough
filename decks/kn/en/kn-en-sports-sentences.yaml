cards:
  "kn-7887":
    notes:
      "n1": "ಆಡು (āḍu) is the verb 'play' for games and sports."
    native: "I play cricket."
  "kn-7888":
    native: "He plays football."
  "kn-7889":
    notes:
      "n1": "ನೋಡು (nōḍu) means 'look' or 'watch', so it is also used for watching a match."
    native: "We watch the match."
  "kn-7890":
    notes:
      "n1": "ಗೆಲ್ಲು (gellu) means 'win' and takes its object bare: ಪದಕ (padaka), medal."
    native: "She wins a medal."
  "kn-7891":
    notes:
      "n1": "A person noun takes -ರು (-ru) for the plural: ಆಟಗಾರರು (āṭagāraru) from ಆಟಗಾರ (āṭagāra)."
    native: "The players run."
  "kn-7892":
    notes:
      "n1": "ಹೇಳುತ್ತಾರೆ (hēḷuttāre) is the plural 'they say'; for one person it is ಹೇಳುತ್ತಾನೆ (hēḷuttāne) or ಹೇಳುತ್ತಾಳೆ (hēḷuttāḷe)."
    native: "The coach says something."
  "kn-7893":
    notes:
      "n1": "ನೀವು (nīvu) with ಆಡುತ್ತೀರಾ (āḍuttīrā) is the polite question; to a friend it is ಆಡುತ್ತೀಯಾ (āḍuttīyā)."
    native: "Do you play chess?"
  "kn-7894":
    notes:
      "n1": "ಹಿಡಿ (hiḍi) means 'hold' or 'grab', used for holding a bat."
    native: "He holds the bat."
  "kn-7895":
    native: "The contestant jumps."
  "kn-7896":
    notes:
      "n1": "ಆಡು (āḍu) is the informal command; to a stranger it is ಆಡಿ (āḍi)."
    native: "Play hockey."
