schema: 1
id: "kn-en-agriculture"
kind: "layer"
core: "kn-agriculture"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Agriculture: farms, crops and the harvest"
license: "CC-BY-SA-4.0"
description: "Farming: the farmer and the field, the crops such as ragi and coffee, the animals on the farm, and the harvest. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1492":
    native: "farming, agriculture"
    notes:
      "n1": "Farming, the work of growing food on land."
    examples:
      "ಕೃಷಿ ಮಾಡು.": "Do farming."
      "ಅವರು ಕೃಷಿ ಮಾಡುತ್ತಾರೆ.": "They do farming."
  "kn-1493":
    native: "crop, yield"
    notes:
      "n1": "A crop, what the field gives at harvest."
    examples:
      "ಫಸಲು ಚೆನ್ನಾಗಿದೆ.": "The crop is good."
      "ಈ ವರ್ಷ ಫಸಲು ಇದೆ.": { native: "There is a crop this year.", bases: { "ಇದೆ": "there is" } }
  "kn-1494":
    native: "irrigation"
    notes:
      "n1": "Irrigation, bringing water to the fields."
    examples:
      "ನೀರಾವರಿ ಬೇಕು.": "Irrigation is needed."
      "ಹೊಲಕ್ಕೆ ನೀರಾವರಿ ಇದೆ.": { native: "The field has irrigation.", bases: { "ಇದೆ": "has" } }
  "kn-1495":
    native: "plough"
    notes:
      "n1": "A plough, pulled by oxen to turn the soil."
    examples:
      "ನೇಗಿಲು ಎಲ್ಲಿ?": "Where is the plough?"
      "ನೇಗಿಲು ಎತ್ತು ಎಳೆಯುತ್ತದೆ.": "The bullock pulls the plough."
  "kn-1496":
    native: "fertilizer, manure"
    notes:
      "n1": "Fertilizer or manure, put in the soil to help crops grow."
    examples:
      "ಗೊಬ್ಬರ ಹಾಕು.": { native: "Put in the fertilizer.", bases: { "ಹಾಕು": "put" } }
      "ಮಣ್ಣಿನಲ್ಲಿ ಗೊಬ್ಬರ ಇದೆ.": { native: "There is fertilizer in the soil.", bases: { "ಇದೆ": "there is" } }
  "kn-1497":
    native: "harvest"
    notes:
      "n1": "The harvest, the cutting and gathering of the crop."
    examples:
      "ಕೊಯ್ಲು ಆಯಿತು.": "The harvest is done."
      "ಕೊಯ್ಲು ಸಮಯ.": "Harvest time."
  "kn-1498":
    native: "ragi, finger millet"
    notes:
      "n1": "Ragi, a millet grain that is grown in Karnataka."
    examples:
      "ರಾಗಿ ಬೇಕು.": "I need ragi."
      "ರಾಗಿ ಬೆಳೆಯುತ್ತಾರೆ.": "They grow ragi."
  "kn-1499":
    native: "jowar, sorghum"
    notes:
      "n1": "Jowar, a grain grown on dry land."
    examples:
      "ಜೋಳ ಬೇಕು.": "I need jowar."
      "ಜೋಳ ರಾಗಿ ತಿನ್ನು.": "Eat jowar and ragi."
  "kn-1500":
    native: "areca nut"
    notes:
      "n1": "Areca nut, a crop of the Malnad hills."
    examples:
      "ಅಡಿಕೆ ತೋಟ ಇದೆ.": { native: "There is an areca nut plantation.", bases: { "ಇದೆ": "there is" } }
      "ಅಡಿಕೆ ಬೇಕು.": "I need areca nut."
  "kn-1501":
    native: "cotton"
    notes:
      "n1": "Cotton, a plant whose fibre makes cloth."
    examples:
      "ಹತ್ತಿ ಬಿಳಿ.": "Cotton is white."
      "ಹತ್ತಿ ಬಟ್ಟೆ ಬೇಕು.": "I need cotton cloth."
  "kn-1502":
    native: "tractor"
    notes:
      "n1": "A tractor, a machine that pulls the plough on a farm."
    examples:
      "ಟ್ರ್ಯಾಕ್ಟರ್ ಬಂತು.": "The tractor came."
      "ರೈತ ಟ್ರ್ಯಾಕ್ಟರ್ ಓಡಿಸುತ್ತಾನೆ.": { native: "The farmer drives the tractor.", bases: { "ಓಡಿಸುತ್ತಾನೆ": "drives" } }
  "kn-1503":
    native: "bullock, ox"
    notes:
      "n1": "A bullock, a male ox that pulls the plough."
    examples:
      "ಬಸವ ದೊಡ್ಡದು.": "The bullock is big."
      "ಬಸವ ನೇಗಿಲು ಎಳೆಯುತ್ತದೆ.": "The bullock pulls the plough."
  "kn-1504":
    native: "cultivation, farming"
    notes:
      "n1": "Cultivation, the old word for farming the land."
    examples:
      "ಬೇಸಾಯ ಮಾಡು.": "Cultivate the land."
      "ಅವನ ಬೇಸಾಯ ಚೆನ್ನಾಗಿದೆ.": "His cultivation is good."
  "kn-1505":
    native: "sowing"
    notes:
      "n1": "Sowing, putting seeds in the soil."
    examples:
      "ಬಿತ್ತನೆ ಆಯಿತು.": "The sowing is done."
      "ಬಿತ್ತನೆ ಸಮಯ.": "Sowing time."
  "kn-1506":
    native: "to harvest, to cut"
    notes:
      "n1": "To cut and gather a crop."
    examples:
      "ಫಸಲು ಕೊಯ್.": "Harvest the crop."
      "ರೈತರು ಫಸಲು ಕೊಯ್ಯುತ್ತಾರೆ.": { native: "The farmers harvest the crop.", bases: { "ಕೊಯ್ಯುತ್ತಾರೆ": "harvest" } }
