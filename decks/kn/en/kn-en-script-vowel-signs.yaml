schema: 1
id: "kn-en-script-vowel-signs"
kind: "layer"
core: "kn-script-vowel-signs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kannada vowel signs"
license: "CC0-1.0"
description: "After a consonant a vowel is written as a sign on it (the kagunita): on top in place of the tick, or on the right, never before it. Here on ಕ (ka) and on ಮ (ma). Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0063":
    native: "kaa (k + the aa sign)"
    notes:
      "n1": "The aa sign ಾ (ā) is a hook on the right of the tick on top: ಕಾಗೆ (kāge, crow). Compare ಕ (ka) on its own, which is 'ka' with a short a."
  "kn-0064":
    native: "ki (k + the i sign)"
    notes:
      "n1": "The i sign ಿ (i) takes the place of the tick on top: ಕಿಟಕಿ (kiṭaki, window)."
  "kn-0065":
    native: "kii (k + the ii sign)"
    notes:
      "n1": "ಕಿ (ki) with the long mark ೕ (dīrgha) on its right. Short and long change the word, so look for the mark: ಕೀಟ (kīṭa, insect)."
  "kn-0066":
    native: "ku (k + the u sign)"
    notes:
      "n1": "The u sign ು (u) is a hook joined on the right: ಕುರಿ (kuri, sheep)."
  "kn-0067":
    native: "kuu (k + the uu sign)"
    notes:
      "n1": "The uu sign ೂ (ū) is joined on the right, with an extra curl: ಕೂದಲು (kūdalu, hair)."
  "kn-0068":
    native: "kru (k + the ru sign)"
    notes:
      "n1": "The ru sign ೃ (ru) is joined on the right, in words from Sanskrit: ಕೃಷಿ (kruṣi, farming). A recogniser writes 'kru' as ಕ್ರು (kru), so it is drilled by reading and writing only."
  "kn-0069":
    native: "ke (k + the e sign)"
    notes:
      "n1": "The e sign ೆ (e) keeps the tick and adds a hook on the right: ಕೆಲಸ (kelasa, work)."
  "kn-0070":
    native: "kee (k + the ee sign)"
    notes:
      "n1": "ಕೆ (ke) with the long mark ೕ (dīrgha) on its right: ಕೇಳು (kēḷu, ask; listen)."
  "kn-0071":
    native: "kai (k + the ai sign)"
    notes:
      "n1": "The e sign with a small stroke below it: ಕೈ (kai, hand)."
  "kn-0072":
    native: "ko (k + the o sign)"
    notes:
      "n1": "The e sign and the u hook together: ಕೊಡು (koḍu, give)."
  "kn-0073":
    native: "koo (k + the oo sign)"
    notes:
      "n1": "ಕೊ (ko) with the long mark ೕ (dīrgha): ಕೋಳಿ (kōḷi, hen)."
  "kn-0074":
    native: "kau (k + the au sign)"
    notes:
      "n1": "A sign of its own on the right, mostly in words from Sanskrit: ಕೌಶಲ (kauśala, skill)."
  "kn-0075":
    native: "kam (k + the circle)"
    notes:
      "n1": "The circle ಂ (anusvara, often called sonne, zero) after a letter is an m or an n, the nasal that suits the next letter: ಕಂಬ (kamba, pillar), ಗಂಗೆ (gaṅge). It is not a sound of its own, so it is drilled by reading and writing only."
  "kn-0076":
    native: "k (with the halant: no vowel)"
    notes:
      "n1": "The halant ್ takes the vowel away. It ends words from English written in Kannada: ಬ್ಯಾಂಕ್ (byāṅk, bank). It is not a sound of its own, so it is drilled by reading and writing only."
  "kn-0077":
    native: "maa (m + the aa sign)"
    notes:
      "n1": "ಮಾವು (māvu, mango)."
  "kn-0078":
    native: "mi (m + the i sign)"
    notes:
      "n1": "ಮಿಂಚು (miñcu, lightning)."
  "kn-0079":
    native: "mii (m + the ii sign)"
    notes:
      "n1": "ಮೀನು (mīnu, fish)."
  "kn-0080":
    native: "mu (m + the u sign)"
    notes:
      "n1": "ಮುಖ (mukha, face)."
  "kn-0081":
    native: "muu (m + the uu sign)"
    notes:
      "n1": "ಮೂಗು (mūgu, nose)."
  "kn-0082":
    native: "me (m + the e sign)"
    notes:
      "n1": "ಮೆಟ್ಟಿಲು (meṭṭilu, stairs)."
  "kn-0083":
    native: "mee (m + the ee sign)"
    notes:
      "n1": "ಮೇಜು (mēju, table)."
  "kn-0084":
    native: "mo (m + the o sign)"
    notes:
      "n1": "ಮೊಸರು (mosaru, curd)."
  "kn-0085":
    native: "moo (m + the oo sign)"
    notes:
      "n1": "ಮೋಡ (mōḍa, cloud)."
