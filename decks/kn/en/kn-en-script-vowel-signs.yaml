schema: 1
id: "kn-en-script-vowel-signs"
kind: "layer"
core: "kn-script-vowel-signs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kannada vowel signs"
license: "CC-BY-SA-4.0"
description: "After a consonant a vowel is written as a sign on it (the kagunita): on top in place of the tick, or on the right, never before it. Here on ಕ (ka) and on ಮ (ma). Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0063":
    native: "kaa (k + the aa sign)"
    notes:
      "n1": "The aa sign ಾ (ā) is a hook on the right of the tick on top: ಕಾಗೆ (kāge, crow). Compare ಕ (ka) on its own, which is 'ka' with a short a."
    "examples": {
      "ಅವರು ಕಾಣುತ್ತಾರೆ.": {"native": "They see.", "bases": {"ಕಾಣುತ್ತಾರೆ": "see"}},
      "ಇದು ತಾತ್ಕಾಲಿಕ.": {"native": "This is temporary.", "bases": {}}
    }
  "kn-0064":
    native: "ki (k + the i sign)"
    notes:
      "n1": "The i sign ಿ (i) takes the place of the tick on top: ಕಿಟಕಿ (kiṭaki, window)."
    "examples": {
      "ಅವನು ಟೀಕಿಸುತ್ತಾನೆ.": {"native": "He criticizes.", "bases": {"ಟೀಕಿಸುತ್ತಾನೆ": "criticizes"}},
      "ಅವರು ಟೀಕಿಸಿದರು.": {"native": "They criticized.", "bases": {"ಟೀಕಿಸಿದರು": "criticized"}}
    }
  "kn-0065":
    native: "kii (k + the ii sign)"
    notes:
      "n1": "ಕಿ (ki) with the long mark ೕ (dīrgha) on its right. Short and long change the word, so look for the mark: ಕೀಟ (kīṭa, insect)."
    "examples": {
      "ಕೀಟ ಕಚ್ಚಿತು.": {"native": "An insect bit.", "bases": {"ಕಚ್ಚಿತು": "bit"}},
      "ಕೀಬೋರ್ಡ್ ಎಲ್ಲಿ?": {"native": "Where is the keyboard?", "bases": {}}
    }
  "kn-0066":
    native: "ku (k + the u sign)"
    notes:
      "n1": "The u sign ು (u) is a hook joined on the right: ಕುರಿ (kuri, sheep)."
    "examples": {
      "ಅರ್ಜಿ ಬೇಕು.": {"native": "I need an application.", "bases": {}},
      "ಅವನು ಹುಡುಕುತ್ತಾನೆ.": {"native": "He searches for.", "bases": {"ಹುಡುಕುತ್ತಾನೆ": "searches for"}}
    }
  "kn-0067":
    native: "kuu (k + the uu sign)"
    notes:
      "n1": "The uu sign ೂ (ū) is joined on the right, with an extra curl: ಕೂದಲು (kūdalu, hair)."
    "examples": {
      "ಉದ್ದ ಕೂದಲು.": {"native": "Long hair.", "bases": {}},
      "ಕಪ್ಪು ಕೂದಲು.": {"native": "Black hair.", "bases": {}}
    }
  "kn-0068":
    native: "kru (k + the ru sign)"
    notes:
      "n1": "The ru sign ೃ (ru) is joined on the right, in words from Sanskrit: ಕೃಷಿ (kruṣi, farming). A recogniser writes 'kru' as ಕ್ರು (kru), so it is drilled by reading and writing only."
    "examples": {
      "ಕೃಷಿ ಮಾಡು.": {"native": "Do farming.", "bases": {}},
      "ಸಂಸ್ಕೃತಿ ಇಷ್ಟ.": {"native": "I like culture.", "bases": {}}
    }
  "kn-0069":
    native: "ke (k + the e sign)"
    notes:
      "n1": "The e sign ೆ (e) keeps the tick and adds a hook on the right: ಕೆಲಸ (kelasa, work)."
    "examples": {
      "ಆಯ್ಕೆ ಮಾಡು.": {"native": "Make a choice.", "bases": {}},
      "ಉಪಶೀರ್ಷಿಕೆ ಇದೆಯೇ?": {"native": "Are there subtitles?", "bases": {"ಇದೆಯೇ": "are there"}}
    }
  "kn-0070":
    native: "kee (k + the ee sign)"
    notes:
      "n1": "ಕೆ (ke) with the long mark ೕ (dīrgha) on its right: ಕೇಳು (kēḷu, ask; listen)."
    "examples": {
      "ಕೇಸ್ ಇದೆ.": {"native": "There is a case.", "bases": {"ಇದೆ": "there is"}},
      "ಕ್ಷಮೆ ಕೇಳು.": {"native": "Ask for forgiveness.", "bases": {}}
    }
  "kn-0071":
    native: "kai (k + the ai sign)"
    notes:
      "n1": "The e sign with a small stroke below it: ಕೈ (kai, hand)."
    "examples": {
      "ಕೈ ತೊಳೆ.": {"native": "Wash your hands.", "bases": {"ಕೈ": "hand"}},
      "ಬಲವಾದ ಕೈ.": {"native": "A strong hand.", "bases": {}}
    }
  "kn-0072":
    native: "ko (k + the o sign)"
    notes:
      "n1": "The e sign and the u hook together: ಕೊಡು (koḍu, give)."
    "examples": {
      "ಅವನು ಕೊನೆಗೊಳಿಸುತ್ತಾನೆ.": {"native": "He ends.", "bases": {"ಕೊನೆಗೊಳಿಸುತ್ತಾನೆ": "ends"}},
      "ಅವರು ಕೊನೆಗೊಳಿಸುತ್ತಾರೆ.": {"native": "They end.", "bases": {"ಕೊನೆಗೊಳಿಸುತ್ತಾರೆ": "end"}}
    }
  "kn-0073":
    native: "koo (k + the oo sign)"
    notes:
      "n1": "ಕೊ (ko) with the long mark ೕ (dīrgha): ಕೋಳಿ (kōḷi, hen)."
    "examples": {
      "ಕೋಟು ದುಬಾರಿ.": {"native": "The coat is expensive.", "bases": {"ದುಬಾರಿ": "expensive"}},
      "ಪ್ರಾಚೀನ ಕೋಟೆ.": {"native": "An ancient fort.", "bases": {}}
    }
  "kn-0074":
    native: "kau (k + the au sign)"
    notes:
      "n1": "A sign of its own on the right, mostly in words from Sanskrit: ಕೌಶಲ (kauśala, skill)."
    "examples": {
      "ಕೌಶಲ್ಯ ಬೇಕು.": {"native": "A skill is needed.", "bases": {}},
      "ಅವಳಿಗೆ ಕೌಶಲ್ಯ ಇದೆ.": {"native": "She has a skill.", "bases": {"ಇದೆ": "has"}}
    }
  "kn-0075":
    native: "kam (k + the circle)"
    notes:
      "n1": "The circle ಂ (anusvara, often called sonne, zero) after a letter is an m or an n, the nasal that suits the next letter: ಕಂಬ (kamba, pillar), ಗಂಗೆ (gaṅge). It is not a sound of its own, so it is drilled by reading and writing only."
    "examples": {
      "ಕಂಡಕ್ಟರ್ ಬಂದರು.": {"native": "The conductor came.", "bases": {}},
      "ಕಂದು ಕಣ್ಣು.": {"native": "Brown eyes.", "bases": {}}
    }
  "kn-0076":
    native: "k (with the halant: no vowel)"
    notes:
      "n1": "The halant ್ takes the vowel away. It ends words from English written in Kannada: ಬ್ಯಾಂಕ್ (byāṅk, bank). It is not a sound of its own, so it is drilled by reading and writing only."
    "examples": {
      "ಇವರು ಶಿಕ್ಷಕರು.": {"native": "These are teachers.", "bases": {"ಶಿಕ್ಷಕರು": "teachers"}},
      "ಎಲೆಕ್ಟ್ರೀಷಿಯನ್ ಬಂದ.": {"native": "The electrician came.", "bases": {}}
    }
  "kn-0077":
    native: "maa (m + the aa sign)"
    notes:
      "n1": "ಮಾವು (māvu, mango)."
    "examples": {
      "ಇಸ್ತ್ರಿ ಮಾಡು.": {"native": "Do the ironing.", "bases": {}}
    }
  "kn-0078":
    native: "mi (m + the i sign)"
    notes:
      "n1": "ಮಿಂಚು (miñcu, lightning)."
    "examples": {
      "ನಕ್ಷತ್ರಗಳು ಮಿನುಗುತ್ತಿವೆ.": {"native": "The stars are twinkling.", "bases": {"ನಕ್ಷತ್ರಗಳು": "stars", "ಮಿನುಗುತ್ತಿವೆ": "are twinkling"}},
      "ಮಿಂಚು ಹೊಡೆಯಿತು.": {"native": "Lightning struck.", "bases": {"ಹೊಡೆಯಿತು": "struck"}}
    }
  "kn-0079":
    native: "mii (m + the ii sign)"
    notes:
      "n1": "ಮೀನು (mīnu, fish)."
    "examples": {
      "ಮೀಟರ್ ಹಾಕಿ.": {"native": "Please put the meter on.", "bases": {"ಮೀಟರ್": "meter", "ಹಾಕಿ": "to put; to put on"}},
      "ಮೀಸೆ ಕತ್ತರಿಸು.": {"native": "Cut the moustache.", "bases": {}}
    }
  "kn-0080":
    native: "mu (m + the u sign)"
    notes:
      "n1": "ಮುಖ (mukha, face)."
    "examples": {
      "ಅವನು ಮುಂದುವರಿಯುತ್ತಾನೆ.": {"native": "He continues.", "bases": {"ಮುಂದುವರಿಯುತ್ತಾನೆ": "continues"}},
      "ಅವನು ಮುಗಿಸುತ್ತಾನೆ.": {"native": "He finishes.", "bases": {"ಮುಗಿಸುತ್ತಾನೆ": "finishes"}}
    }
  "kn-0081":
    native: "muu (m + the uu sign)"
    notes:
      "n1": "ಮೂಗು (mūgu, nose)."
    "examples": {
      "ಮೂಗು ಸೋರುತ್ತಿದೆ.": {"native": "The nose is running.", "bases": {"ಸೋರುತ್ತಿದೆ": "to run"}},
      "ಮೂರ್ತಿ ದೊಡ್ಡದು.": {"native": "The statue is big.", "bases": {}}
    }
  "kn-0082":
    native: "me (m + the e sign)"
    notes:
      "n1": "ಮೆಟ್ಟಿಲು (meṭṭilu, stairs)."
    "examples": {
      "ಅವಳು ಮೆಚ್ಚಿದಳು.": {"native": "She liked it.", "bases": {"ಮೆಚ್ಚಿದಳು": "liked"}},
      "ಕ್ಯಾಮೆರಾ ಕೊಡು.": {"native": "Give the camera.", "bases": {}}
    }
  "kn-0083":
    native: "mee (m + the ee sign)"
    notes:
      "n1": "ಮೇಜು (mēju, table)."
    "examples": {
      "ಇಮೇಲ್ ಕಳುಹಿಸು.": {"native": "Send an email.", "bases": {}},
      "ಇಮೇಲ್ ಬಂದಿದೆ.": {"native": "An email has come.", "bases": {}}
    }
  "kn-0084":
    native: "mo (m + the o sign)"
    notes:
      "n1": "ಮೊಸರು (mosaru, curd)."
    "examples": {
      "ಮೊಣಕಾಲು ಬಗ್ಗಿಸು.": {"native": "Bend the knee.", "bases": {"ಬಗ್ಗಿಸು": "to bend"}},
      "ಮೊಬೈಲ್ ಎಲ್ಲಿ?": {"native": "Where is the mobile?", "bases": {}}
    }
  "kn-0085":
    native: "moo (m + the oo sign)"
    notes:
      "n1": "ಮೋಡ (mōḍa, cloud)."
    "examples": {
      "ಆಕಾಶದಲ್ಲಿ ಮೋಡ ಇದೆ.": {"native": "There is a cloud in the sky.", "bases": {"ಆಕಾಶದಲ್ಲಿ": "in the sky", "ಇದೆ": "is, there is"}},
      "ಆಕಾಶದಲ್ಲಿ ಮೋಡ ಇಲ್ಲ.": {"native": "There are no clouds in the sky.", "bases": {"ಆಕಾಶದಲ್ಲಿ": "in the sky"}}
    }
