tags: ["beginner", "unreviewed"]
cards:
  "kn-7776":
    notes:
      "n1": "ಕುಡಿಯುತ್ತೇನೆ (kuḍiyuttēne), I drink, ends in -ುತ್ತೇನೆ (-uttēne) for 'I' in the present."
    native: "I drink tea."
  "kn-7777":
    notes:
      "n1": "ತೋರಿಸಿ (tōrisi), show, ends in -ಿ (-i), the polite command; the plain command ends in -ು (-u), as in ತೋರಿಸು (tōrisu)."
    native: "Please show me the menu."
  "kn-7778":
    notes:
      "n1": "The question word ಎಷ್ಟು (eṣṭu), how much, follows the noun, with no word for 'is': ಬಿಲ್ (bil) ಎಷ್ಟು (eṣṭu)? asks how much the bill is."
    native: "How much is the bill?"
  "kn-7779":
    notes:
      "n1": "ತಿನ್ನುತ್ತೇನೆ (tinnuttēne), I eat, ends in -ುತ್ತೇನೆ (-uttēne) for 'I' in the present."
    native: "I eat mango."
  "kn-7780":
    notes:
      "n1": "ಮಾಡು (māḍu), do or make, is used with food: ಸಾರು ಮಾಡು (sāru māḍu) is to make sāru, and ಮಾಡುತ್ತಾಳೆ (māḍuttāḷe) ends in -ುತ್ತಾಳೆ (-uttāḷe) for 'she'."
    native: "She makes sāru, a thin soup."
  "kn-7781":
    notes:
      "n1": "ತಿನ್ನುತ್ತೇವೆ (tinnuttēve), we eat, ends in -ುತ್ತೇವೆ (-uttēve) for 'we' in the present."
    native: "We eat roti."
  "kn-7782":
    notes:
      "n1": "The question word ಎಲ್ಲಿ (elli), where, follows the noun, with no word for 'is': ಸಕ್ಕರೆ (sakkare) ಎಲ್ಲಿ (elli)? asks where the sugar is."
    native: "Where is the sugar?"
  "kn-7783":
    notes:
      "n1": "ತಿನ್ನು (tinnu) changes its stem in the past: ತಿಂದ- (tinda-), as in ತಿಂದರು (tindaru), they ate."
    native: "They ate biryani."
  "kn-7784":
    notes:
      "n1": "ಇವತ್ತು (ivattu), today, comes first; ತಿನ್ನುತ್ತೇನೆ (tinnuttēne), I eat, ends in -ುತ್ತೇನೆ (-uttēne) for 'I' in the present."
    native: "I eat apples today."
  "kn-7785":
    notes:
      "n1": "ಮಾಡಿದೆ (māḍide), I made, is the past tense of ಮಾಡು (māḍu), do or make, for 'I'."
    native: "I made payasa, a sweet pudding."
