schema: 1
id: "kn-en-sound-differences"
kind: "layer"
core: "kn-sound-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sounds to tell apart"
license: "CC0-1.0"
description: "Pairs of everyday words that differ in one sound: a short or long vowel, the tongue on the teeth or curled back, and the two l's. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0112":
    native: "calf"
    notes:
      "n1": "Vowel length: ಕಾರು (kāru, car) holds the a twice as long as ಕರು (karu, calf)."
  "kn-0113":
    native: "car"
    notes:
      "n1": "Vowel length: ಕಾರು (kāru, car) holds the a twice as long as ಕರು (karu, calf). Words from English often gain a final u: car becomes ಕಾರು (kāru)."
  "kn-0114":
    native: "give (to a friend); to give"
    notes:
      "n1": "Vowel length: ಕೊಡು (koḍu, give) has a short o; ಕೋಡು (kōḍu, horn) has a long one. To anyone you respect, say ಕೊಡಿ (koḍi)."
  "kn-0115":
    native: "horn (of an animal)"
    notes:
      "n1": "Vowel length: ಕೊಡು (koḍu, give) has a short o; ಕೋಡು (kōḍu, horn) has a long one."
  "kn-0116":
    native: "monkey"
    notes:
      "n1": "Dental against curled back: ಕೋತಿ (kōti, monkey) has the tongue on the teeth for t; ಕೋಟಿ (kōṭi, crore) has it curled back."
  "kn-0117":
    native: "1,00,00,000, a crore (ten million)"
    notes:
      "n1": "Dental against curled back: ಕೋತಿ (kōti, monkey) has the tongue on the teeth for t; ಕೋಟಿ (kōṭi, crore) has it curled back."
  "kn-0118":
    native: "donkey"
    notes:
      "n1": "Dental against curled back: ಕತ್ತೆ (katte, donkey) has the double t on the teeth; ಕಟ್ಟೆ (kaṭṭe, a raised platform) has it curled back."
  "kn-0119":
    native: "a raised platform; an embankment"
    notes:
      "n1": "Dental against curled back: ಕತ್ತೆ (katte, donkey) has the double t on the teeth; ಕಟ್ಟೆ (kaṭṭe) has it curled back. The ಕಟ್ಟೆ (kaṭṭe) round a village tree is where people sit and talk."
  "kn-0120":
    native: "milk"
    notes:
      "n1": "The two l's: ಹಾಲು (hālu, milk) has the l on the teeth; ಹಾಳು (hāḷu, ruined) has it curled back."
  "kn-0121":
    native: "ruined; spoiled"
    notes:
      "n1": "The two l's: ಹಾಲು (hālu, milk) has the l on the teeth; ಹಾಳು (hāḷu, ruined) has it curled back."
  "kn-0122":
    native: "rain"
    notes:
      "n1": "The two l's: ಮಳೆ (maḷe, rain) has the l curled back; ಮಲೆ (male, hills) has it on the teeth."
  "kn-0123":
    native: "hills; a range of hills"
    notes:
      "n1": "The two l's: ಮಲೆ (male, hills) has the l on the teeth, as in ಮಲೆನಾಡು (malenāḍu), the hill country of the Western Ghats; ಮಳೆ (maḷe, rain) has it curled back."
