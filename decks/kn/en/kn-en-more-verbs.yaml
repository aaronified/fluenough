schema: 1
id: "kn-en-more-verbs"
kind: "layer"
core: "kn-more-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs"
license: "CC-BY-SA-4.0"
description: "Verbs of the kitchen and the house: cutting, frying, mixing, sweeping, sending. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-0732":
    native: "to cut"
    notes:
      "n1": "To cut vegetables: ತರಕಾರಿ ಕತ್ತರಿಸು (tarakāri kattarisu)."
    examples:
      "ಅವಳು ಈರುಳ್ಳಿ ಕತ್ತರಿಸುತ್ತಾಳೆ.": { native: "She cuts the onion.", bases: { "ಈರುಳ್ಳಿ": "onion", "ಕತ್ತರಿಸುತ್ತಾಳೆ": "to cut", "ಅವಳು": "she" } }
      "ಚಾಕುವಿನಿಂದ ಕತ್ತರಿಸು.": { native: "Cut it with a knife.", bases: { "ಚಾಕುವಿನಿಂದ": "with a knife" } }
  "kn-0733":
    native: "to fry"
    notes:
      "n1": "Fry in oil: ಎಣ್ಣೆಯಲ್ಲಿ ಹುರಿ (eṇṇeyalli huri)."
    examples:
      "ಅವಳು ಮೀನು ಹುರಿಯುತ್ತಾಳೆ.": { native: "She fries fish.", bases: { "ಮೀನು": "fish", "ಹುರಿಯುತ್ತಾಳೆ": "to fry", "ಅವಳು": "she" } }
      "ಎಣ್ಣೆಯಲ್ಲಿ ಹುರಿ.": { native: "Fry it in oil.", bases: { "ಎಣ್ಣೆಯಲ್ಲಿ": "in oil" } }
  "kn-0734":
    native: "to boil"
    notes:
      "n1": "The causative of ಕುದಿ (kudi), to boil."
    examples:
      "ಹಾಲು ಕುದಿಸು.": { native: "Boil the milk.", bases: { "ಹಾಲು": "milk" } }
      "ಅವಳು ನೀರು ಕುದಿಸುತ್ತಾಳೆ.": { native: "She boils water.", bases: { "ನೀರು": "water", "ಕುದಿಸುತ್ತಾಳೆ": "to boil", "ಅವಳು": "she" } }
  "kn-0735":
    native: "to mix"
    notes:
      "n1": "To mix two things: ಹಿಟ್ಟು ಬೆರೆಸು (hiṭṭu beresu), mix the flour."
    examples:
      "ಹಿಟ್ಟು ಮತ್ತು ನೀರು ಬೆರೆಸು.": { native: "Mix flour and water.", bases: { "ಹಿಟ್ಟು": "flour", "ಮತ್ತು": "and", "ನೀರು": "water" } }
      "ಅವನು ಸಕ್ಕರೆ ಹಾಲಿನಲ್ಲಿ ಬೆರೆಸುತ್ತಾನೆ.": { native: "He mixes the sugar into the milk.", bases: { "ಸಕ್ಕರೆ": "sugar", "ಹಾಲಿನಲ್ಲಿ": "into the milk", "ಬೆರೆಸುತ್ತಾನೆ": "to mix", "ಅವನು": "he" } }
  "kn-0736":
    native: "to pour"
    notes:
      "n1": "To pour a liquid: ನೀರು ಸುರಿ (nīru suri), pour water."
    examples:
      "ಪಾತ್ರೆಗೆ ನೀರು ಸುರಿ.": { native: "Pour water into the pot.", bases: { "ಪಾತ್ರೆಗೆ": "into the pot", "ನೀರು": "water" } }
      "ಅವಳು ಲೋಟಕ್ಕೆ ಹಾಲು ಸುರಿದಳು.": { native: "She poured milk into the glass.", bases: { "ಲೋಟಕ್ಕೆ": "into the glass", "ಹಾಲು": "milk", "ಸುರಿದಳು": "to pour", "ಅವಳು": "she" } }
  "kn-0737":
    native: "to soak"
    notes:
      "n1": "To soak rice or lentils: ಅಕ್ಕಿ ನೆನೆಸು (akki nenesu)."
    examples:
      "ಬೇಳೆ ರಾತ್ರಿ ನೆನೆಸು.": { native: "Soak the lentils at night.", bases: { "ಬೇಳೆ": "lentils", "ರಾತ್ರಿ": "night" } }
      "ಅಕ್ಕಿಯನ್ನು ನೀರಿನಲ್ಲಿ ನೆನೆಸುತ್ತಾಳೆ.": { native: "She soaks the rice in water.", bases: { "ಅಕ್ಕಿಯನ್ನು": "the rice", "ನೀರಿನಲ್ಲಿ": "in water", "ನೆನೆಸುತ್ತಾಳೆ": "to soak" } }
  "kn-0738":
    native: "to mix; to knead"
    notes:
      "n1": "Kneading dough: ಹಿಟ್ಟು ಕಲಸು (hiṭṭu kalasu)."
    examples:
      "ಹಿಟ್ಟು ಕಲಸು.": { native: "Knead the dough.", bases: { "ಹಿಟ್ಟು": "dough" } }
      "ಅವಳು ಮೊಸರು ಅನ್ನ ಕಲಸುತ್ತಾಳೆ.": { native: "She mixes curd and rice.", bases: { "ಮೊಸರು": "curd", "ಅನ್ನ": "rice", "ಕಲಸುತ್ತಾಳೆ": "to mix", "ಅವಳು": "she" } }
  "kn-0739":
    native: "to add"
    notes:
      "n1": "To add something: ಉಪ್ಪು ಸೇರಿಸು (uppu sērisu), add salt."
    examples:
      "ಸ್ವಲ್ಪ ಉಪ್ಪು ಸೇರಿಸು.": { native: "Add a little salt.", bases: { "ಉಪ್ಪು": "salt" } }
      "ಅವಳು ಈರುಳ್ಳಿ ಸೇರಿಸಿದಳು.": { native: "She added onion.", bases: { "ಈರುಳ್ಳಿ": "onion", "ಸೇರಿಸಿದಳು": "to add", "ಅವಳು": "she" } }
  "kn-0740":
    native: "to wipe"
    notes:
      "n1": "To wipe a table: ಮೇಜು ಒರೆಸು (mēju oresu)."
    examples:
      "ಮೇಜು ಒರೆಸು.": { native: "Wipe the table.", bases: { "ಮೇಜು": "table" } }
      "ಅವನು ಕೈ ಒರೆಸಿದ.": { native: "He wiped his hands.", bases: { "ಕೈ": "hand", "ಒರೆಸಿದ": "to wipe", "ಅವನು": "he" } }
  "kn-0741":
    native: "to sweep"
    notes:
      "n1": "To sweep the floor: ನೆಲ ಗುಡಿಸು (nela guḍisu)."
    examples:
      "ಅವಳು ಮನೆ ಗುಡಿಸುತ್ತಾಳೆ.": { native: "She sweeps the house.", bases: { "ಮನೆ": "house", "ಗುಡಿಸುತ್ತಾಳೆ": "to sweep", "ಅವಳು": "she" } }
      "ಬೆಳಿಗ್ಗೆ ನೆಲ ಗುಡಿಸು.": { native: "Sweep the floor in the morning.", bases: { "ಬೆಳಿಗ್ಗೆ": "in the morning", "ನೆಲ": "floor" } }
  "kn-0742":
    native: "to fill"
    notes:
      "n1": "To fill with water: ನೀರಿನಿಂದ ತುಂಬು (nīrininda tumbu)."
    examples:
      "ಬಾಟಲಿ ನೀರಿನಿಂದ ತುಂಬು.": { native: "Fill the bottle with water.", bases: { "ಬಾಟಲಿ": "bottle", "ನೀರಿನಿಂದ": "with water" } }
      "ಅವನು ಚೀಲ ತುಂಬಿದ.": { native: "He filled the bag.", bases: { "ಚೀಲ": "bag", "ತುಂಬಿದ": "to fill", "ಅವನು": "he" } }
  "kn-0743":
    native: "to send"
    notes:
      "n1": "To send a letter: ಪತ್ರ ಕಳುಹಿಸು (patra kaḷuhisu)."
    examples:
      "ನಾನು ಪತ್ರ ಕಳುಹಿಸುತ್ತೇನೆ.": { native: "I send a letter.", bases: { "ಪತ್ರ": "letter", "ಕಳುಹಿಸುತ್ತೇನೆ": "to send", "ನಾನು": "I" } }
      "ಅವಳು ಹಣ ಕಳುಹಿಸಿದಳು.": { native: "She sent money.", bases: { "ಹಣ": "money", "ಕಳುಹಿಸಿದಳು": "to send", "ಅವಳು": "she" } }
  "kn-0744":
    native: "to bring"
    notes:
      "n1": "The imperative is ತಾ (tā), bring."
    examples:
      "ಅಂಗಡಿಯಿಂದ ಹಾಲು ತಾ.": { native: "Bring milk from the shop.", bases: { "ಅಂಗಡಿಯಿಂದ": "from the shop", "ಹಾಲು": "milk", "ತಾ": "to bring" } }
      "ಅವನು ಮಿಠಾಯಿ ತಂದ.": { native: "He brought sweets.", bases: { "ಮಿಠಾಯಿ": "sweets", "ತಂದ": "to bring", "ಅವನು": "he" } }
  "kn-0745":
    native: "to use"
    notes:
      "n1": "To use a tool: ಚಾಕು ಬಳಸು (cāku baḷasu)."
    examples:
      "ನಾನು ಈ ಚಾಕು ಬಳಸುತ್ತೇನೆ.": { native: "I use this knife.", bases: { "ಈ": "this", "ಚಾಕು": "knife", "ಬಳಸುತ್ತೇನೆ": "to use", "ನಾನು": "I" } }
      "ಅವಳು ಗ್ಯಾಸ್ ಬಳಸುತ್ತಾಳೆ.": { native: "She uses gas.", bases: { "ಗ್ಯಾಸ್": "gas", "ಬಳಸುತ್ತಾಳೆ": "to use", "ಅವಳು": "she" } }
  "kn-0746":
    native: "to open"
    notes:
      "n1": "The opposite is ಮುಚ್ಚು (muccu), to close."
    examples:
      "ಬಾಗಿಲು ತೆರೆ.": { native: "Open the door.", bases: { "ಬಾಗಿಲು": "door" } }
      "ಅವನು ಪುಸ್ತಕ ತೆರೆದ.": { native: "He opened the book.", bases: { "ಪುಸ್ತಕ": "book", "ತೆರೆದ": "to open", "ಅವನು": "he" } }
  "kn-0747":
    native: "to close"
    notes:
      "n1": "The opposite is ತೆರೆ (tere), to open."
    examples:
      "ಬಾಗಿಲು ಮುಚ್ಚು.": { native: "Close the door.", bases: { "ಬಾಗಿಲು": "door" } }
      "ಅವಳು ಕಣ್ಣು ಮುಚ್ಚಿದಳು.": { native: "She closed her eyes.", bases: { "ಕಣ್ಣು": "eye", "ಮುಚ್ಚಿದಳು": "to close", "ಅವಳು": "she" } }
  "kn-0748":
    native: "to swim"
    notes:
      "n1": "A river or a lake is where one swims: ನದಿಯಲ್ಲಿ ಈಜು (nadiyalli īju)."
    examples:
      "ಮಕ್ಕಳು ನದಿಯಲ್ಲಿ ಈಜುತ್ತಾರೆ.": { native: "The children swim in the river.", bases: { "ಮಕ್ಕಳು": "children", "ನದಿಯಲ್ಲಿ": "in the river", "ಈಜುತ್ತಾರೆ": "to swim" } }
      "ನಾನು ಈಜು ಕಲಿಯುತ್ತಿದ್ದೇನೆ.": { native: "I am learning to swim.", bases: { "ಕಲಿಯುತ್ತಿದ್ದೇನೆ": "to learn", "ನಾನು": "I" } }
  "kn-0749":
    native: "to lift; to pick up"
    notes:
      "n1": "To lift a heavy thing: ಭಾರ ಎತ್ತು (bhāra ettu)."
    examples:
      "ಭಾರ ಪೆಟ್ಟಿಗೆ ಎತ್ತು.": { native: "Lift the heavy box.", bases: { "ಭಾರ": "heavy", "ಪೆಟ್ಟಿಗೆ": "box" } }
      "ಅವನು ಚೀಲ ಎತ್ತಿದ.": { native: "He lifted the bag.", bases: { "ಚೀಲ": "bag", "ಎತ್ತಿದ": "to lift", "ಅವನು": "he" } }
  "kn-0750":
    native: "to stop"
    notes:
      "n1": "The causative of ನಿಲ್ಲು (nillu), to stand: it means to stop something."
    examples:
      "ಬಸ್ ಇಲ್ಲಿ ನಿಲ್ಲಿಸು.": { native: "Stop the bus here.", bases: { "ಬಸ್": "bus" } }
      "ಅವನು ನಡಿಗೆ ನಿಲ್ಲಿಸಿದ.": { native: "He stopped walking.", bases: { "ನಡಿಗೆ": "walking", "ನಿಲ್ಲಿಸಿದ": "to stop", "ಅವನು": "he" } }
  "kn-0751":
    native: "to wait"
    notes:
      "n1": "To wait for someone: ಅವಳಿಗಾಗಿ ಕಾಯು (avaḷigāgi kāyu), wait for her."
    examples:
      "ಸ್ವಲ್ಪ ಕಾಯು.": { native: "Wait a little.", bases: { "ಸ್ವಲ್ಪ": "a little" } }
      "ನಾನು ಅವಳಿಗಾಗಿ ಕಾಯುತ್ತೇನೆ.": { native: "I wait for her.", bases: { "ಅವಳಿಗಾಗಿ": "for her", "ಕಾಯುತ್ತೇನೆ": "to wait", "ನಾನು": "I" } }
  "kn-0752":
    native: "to change"
    notes:
      "n1": "To change a plan: ಯೋಜನೆ ಬದಲಾಯಿಸು (yōjane badalāyisu)."
    examples:
      "ಅವನು ತನ್ನ ಯೋಜನೆ ಬದಲಾಯಿಸಿದ.": { native: "He changed his plan.", bases: { "ತನ್ನ": "his own", "ಯೋಜನೆ": "plan", "ಬದಲಾಯಿಸಿದ": "to change", "ಅವನು": "he" } }
      "ಈ ಸಮಯ ಬದಲಾಯಿತು.": { native: "This time changed.", bases: { "ಈ": "this", "ಸಮಯ": "time", "ಬದಲಾಯಿತು": "to change" } }
  "kn-0753":
    native: "to cry"
    notes:
      "n1": "A baby cries: ಮಗು ಅಳುತ್ತದೆ (magu aḷuttade)."
    examples:
      "ಮಗು ಅಳುತ್ತಿದೆ.": { native: "The baby is crying.", bases: { "ಮಗು": "baby", "ಅಳುತ್ತಿದೆ": "to cry" } }
      "ಅವಳು ಯಾಕೆ ಅಳುತ್ತಾಳೆ?": { native: "Why does she cry?", bases: { "ಯಾಕೆ": "why", "ಅಳುತ್ತಾಳೆ": "to cry", "ಅವಳು": "she" } }
  "kn-0754":
    native: "to laugh"
    notes:
      "n1": "To laugh loudly: ಜೋರಾಗಿ ನಗು (jōrāgi nagu)."
    examples:
      "ಮಕ್ಕಳು ನಗುತ್ತಾರೆ.": { native: "The children laugh.", bases: { "ಮಕ್ಕಳು": "children", "ನಗುತ್ತಾರೆ": "to laugh" } }
      "ಅವನು ಜೋರಾಗಿ ನಗುತ್ತಾನೆ.": { native: "He laughs loudly.", bases: { "ಜೋರಾಗಿ": "loudly", "ನಗುತ್ತಾನೆ": "to laugh", "ಅವನು": "he" } }
  "kn-0755":
    native: "to fly"
    notes:
      "n1": "A bird flies in the sky: ಆಕಾಶದಲ್ಲಿ ಹಾರು (ākāśadalli hāru)."
    examples:
      "ಹಕ್ಕಿ ಆಕಾಶದಲ್ಲಿ ಹಾರುತ್ತದೆ.": { native: "The bird flies in the sky.", bases: { "ಹಕ್ಕಿ": "bird", "ಆಕಾಶದಲ್ಲಿ": "in the sky", "ಹಾರುತ್ತದೆ": "to fly" } }
      "ವಿಮಾನ ಹಾರುತ್ತದೆ.": { native: "The aeroplane flies.", bases: { "ವಿಮಾನ": "aeroplane", "ಹಾರುತ್ತದೆ": "to fly" } }
