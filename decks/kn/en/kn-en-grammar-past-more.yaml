description: "I used to go, she was coming: the past of a habit, and of what was going on. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "Past habit and past continuous"
  slot_name: "person"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "maadu": "to do"
    "hoogu": "to go"
    "baru": "to come"
    "iru": "to be; to live"
  notes: "The verb with -ಉತ್ತ- (-utta-) and the past of ಇರು (iru): ಮಾಡುತ್ತಿದ್ದೆ (māḍuttidde). The same form is 'used to' and 'was doing': ನಾನು ಬೆಂಗಳೂರಿನಲ್ಲಿ ಕೆಲಸ ಮಾಡುತ್ತಿದ್ದೆ (nānu beṅgaḷūrinalli kelasa māḍuttidde), I used to work in Bengaluru, or I was working there. The verb agrees with the doer's person and number. In the third person a man, a woman and a thing each have a form of their own: ಅವನು ಬಂದನು (avanu bandanu), ಅವಳು ಬಂದಳು (avaḷu bandaḷu), ಅದು ಬಂತು (adu bantu). ನೀವು (nīvu), plural or respectful, takes the plural, and so does ಅವರು (avaru), they, or he or she with respect. Where two forms are given, the first is written Kannada and the second everyday speech; both are accepted."
