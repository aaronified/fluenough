schema: 1
id: "kn-en-calendar-sentences"
kind: "layer"
core: "kn-calendar-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Months and years: sentences"
description: "Sentences about the days, the months and the years: today, tomorrow, the weekdays and the dates. They use the words of the calendar unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8191":
    notes:
      "n1": "A day of the week takes no ending in this sentence: ಸೋಮವಾರ (sōmavāra), Monday."
    native: "Today is Monday."
  "kn-8192":
    native: "Tomorrow is Friday."
  "kn-8193":
    native: "Yesterday was Sunday."
  "kn-8194":
    native: "Today is Tuesday, tomorrow is Wednesday."
  "kn-8195":
    notes:
      "n1": "ಅಲ್ಲ (alla) makes it negative with no verb: ಬುಧವಾರ (budhavāra) ಅಲ್ಲ (alla), not Wednesday."
    native: "Tomorrow is not Wednesday."
  "kn-8196":
    native: "January is a month."
  "kn-8197":
    notes:
      "n1": "After a number the noun stays in its base form: ಹನ್ನೆರಡು (hanneraḍu) ತಿಂಗಳು (tiṅgaḷu), twelve months."
    native: "A year has twelve months."
  "kn-8198":
    native: "What is today's date?"
  "kn-8199":
    native: "When is Ugadi?"
  "kn-8200":
    notes:
      "n1": "ಯಾವ (yāva), which, comes before the noun: ಯಾವ (yāva) ತಿಂಗಳು (tiṅgaḷu), which month."
    native: "Which month is April?"
