cards:
  "kn-7897":
    native: "I study law."
    notes:
      "n1": "ಓದು (ōdu), read, also means to study a subject, as here with ಕಾನೂನು (kānūnu), law."
  "kn-7898":
    native: "I make a complaint."
    notes:
      "n1": "A complaint is made with ಹೇಳು (hēḷu), say: ದೂರು (dūru), complaint, with it means 'make a complaint'."
  "kn-7899":
    native: "The judge gives the verdict."
    notes:
      "n1": "ನ್ಯಾಯಾಧೀಶರು (nyāyādhīśaru), judge, takes -ರು (-ru), the plural that also shows respect, so the verb is ಹೇಳುತ್ತಾರೆ (hēḷuttāre), not the 'he' form."
  "kn-7900":
    native: "He committed theft."
    notes:
      "n1": "ಮಾಡಿದನು (māḍidanu), did, is the past of ಮಾಡು (māḍu) with -ದನು (-danu) for he."
  "kn-7901":
    native: "He went to jail."
    notes:
      "n1": "ಹೋದನು (hōdanu), went, is the past of ಹೋಗು (hōgu) for he; ಜೈಲಿಗೆ (jailige), to jail, takes -ಗೆ (-ge)."
  "kn-7902":
    native: "The accusation is false."
  "kn-7903":
    native: "We win the case."
    notes:
      "n1": "ಗೆಲ್ಲು (gellu), win, is used of a court case: ಕೇಸ್ ಗೆಲ್ಲು (kēs gellu), win the case."
  "kn-7904":
    native: "The thief runs."
  "kn-7905":
    native: "He is not the criminal."
