schema: 1
id: "kn-en-emergencies"
kind: "layer"
core: "kn-emergencies"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Emergencies: accidents, fire, help and safety"
license: "CC-BY-SA-4.0"
description: "In an emergency: the danger and the ambulance, the police and the fire service, calling for help, and staying safe. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1610":
    native: "emergency"
    notes:
      "n1": "An emergency, a sudden need for quick action."
    examples:
      "ತುರ್ತು ಇದೆ.": { native: "There is an emergency.", bases: { "ಇದೆ": "there is" } }
      "ತುರ್ತು ಸಹಾಯ ಬೇಕು.": "Emergency help is needed."
  "kn-1611":
    native: "danger"
    notes:
      "n1": "Danger, a risk of harm."
    examples:
      "ಅಪಾಯ ಇದೆ.": { native: "There is danger.", bases: { "ಇದೆ": "there is" } }
      "ಅಪಾಯ ಬೇಡ.": "No danger."
  "kn-1612":
    native: "ambulance"
    notes:
      "n1": "An ambulance, a vehicle that carries the sick or injured to hospital."
    examples:
      "ಆಂಬುಲೆನ್ಸ್ ಬಂತು.": "The ambulance came."
      "ಆಂಬುಲೆನ್ಸ್ ಕರೆ.": "Call the ambulance."
  "kn-1613":
    native: "fire service, firefighter"
    notes:
      "n1": "The fire service, which puts out fires."
    examples:
      "ಅಗ್ನಿಶಾಮಕ ಬಂದರು.": "The fire service came."
      "ಅಗ್ನಿಶಾಮಕ ಕರೆ ಮಾಡು.": "Call the fire service."
  "kn-1614":
    native: "safety"
    notes:
      "n1": "Safety, being free from danger."
    examples:
      "ಸುರಕ್ಷತೆ ಬೇಕು.": "Safety is needed."
      "ಮಕ್ಕಳ ಸುರಕ್ಷತೆ ಬೇಕು.": "The safety of children is needed."
  "kn-1615":
    native: "for help"
    notes:
      "n1": "For help, calling someone to come and help."
    examples:
      "ಸಹಾಯಕ್ಕೆ ಕರೆ.": "Call for help."
      "ಸಹಾಯಕ್ಕೆ ಬಾ.": "Come to help."
  "kn-1616":
    native: "outer, outside"
    notes:
      "n1": "Outer, outside, in front of a door."
    examples:
      "ಹೊರ ಬಾಗಿಲು.": "The outer door."
      "ಹೊರಗೆ ಹೋಗು.": "Go outside."
  "kn-1617":
    native: "alert, caution"
    notes:
      "n1": "Caution, being alert to danger."
    examples:
      "ಎಚ್ಚರ ಬೇಕು.": "Caution is needed."
      "ರಸ್ತೆಯಲ್ಲಿ ಎಚ್ಚರ.": "Be careful on the road."
  "kn-1618":
    native: "hurry"
    notes:
      "n1": "Hurry, rushing, which can cause accidents."
    examples:
      "ಆತುರ ಬೇಡ.": "No hurry."
      "ಆತುರದಲ್ಲಿ ಅಪಘಾತ ಆಯಿತು.": { native: "An accident happened in a hurry.", bases: { "ಆತುರದಲ್ಲಿ": "in a hurry" } }
  "kn-1619":
    native: "to shout, to call out"
    notes:
      "n1": "To shout loudly for help."
    examples:
      "ಸಹಾಯಕ್ಕೆ ಕೂಗು.": "Shout for help."
      "ಅವನು ಜೋರಾಗಿ ಕೂಗಿದ.": { native: "He shouted loudly.", bases: { "ಕೂಗಿದ": "shouted" } }
  "kn-1620":
    native: "whistle"
    notes:
      "n1": "A whistle, blown to call for help."
    examples:
      "ಸೀಟಿ ಹೊಡೆ.": { native: "Blow the whistle.", bases: { "ಹೊಡೆ": "blow" } }
      "ಸೀಟಿ ಬೇಕು.": "I need a whistle."
  "kn-1621":
    native: "fear, panic"
    notes:
      "n1": "Fear, or panic in an emergency."
    examples:
      "ಹೆದರಿಕೆ ಬೇಡ.": "No fear."
      "ಅವಳಿಗೆ ಹೆದರಿಕೆ ಆಯಿತು.": "She became afraid."
