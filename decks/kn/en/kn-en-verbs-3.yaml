schema: 1
id: "kn-en-verbs-3"
kind: "layer"
core: "kn-verbs-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More daily actions"
license: "CC-BY-SA-4.0"
description: "More everyday verbs: getting up and sitting, holding and breaking, sending, winning and losing, with a sentence for he and for they. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1176":
    native: "tie, build"
    notes:
      "n1": "To tie a rope or a bag, and to build a house."
    examples:
      "ಅವನು ಕಟ್ಟುತ್ತಾನೆ.": { native: "He ties.", bases: { "ಕಟ್ಟುತ್ತಾನೆ": "ties" } }
      "ಅವರು ಕಟ್ಟುತ್ತಾರೆ.": { native: "They tie.", bases: { "ಕಟ್ಟುತ್ತಾರೆ": "tie" } }
  "kn-1177":
    native: "untie, open"
    notes:
      "n1": "The opposite of ಕಟ್ಟು (kaṭṭu): to untie a knot."
    examples:
      "ಅವನು ಬಿಚ್ಚುತ್ತಾನೆ.": { native: "He unties.", bases: { "ಬಿಚ್ಚುತ್ತಾನೆ": "unties" } }
      "ಅವರು ಬಿಚ್ಚುತ್ತಾರೆ.": { native: "They untie.", bases: { "ಬಿಚ್ಚುತ್ತಾರೆ": "untie" } }
  "kn-1178":
    native: "search for"
    notes:
      "n1": "To look for a lost thing."
    examples:
      "ಅವನು ಹುಡುಕುತ್ತಾನೆ.": { native: "He searches for.", bases: { "ಹುಡುಕುತ್ತಾನೆ": "searches for" } }
      "ಅವರು ಹುಡುಕುತ್ತಾರೆ.": { native: "They search for.", bases: { "ಹುಡುಕುತ್ತಾರೆ": "search for" } }
  "kn-1179":
    native: "forget"
    notes:
      "n1": "To forget something; the opposite is ನೆನಪಿಡು (nenapiḍu)."
    examples:
      "ಅವನು ಮರಯುತ್ತಾನೆ.": { native: "He forgets.", bases: { "ಮರಯುತ್ತಾನೆ": "forgets" } }
      "ಅವರು ಮರಯುತ್ತಾರೆ.": { native: "They forget.", bases: { "ಮರಯುತ್ತಾರೆ": "forget" } }
  "kn-1180":
    native: "grow"
    notes:
      "n1": "To grow, said of a plant, a child or a crop."
    examples:
      "ಅವನು ಬೆಳಯುತ್ತಾನೆ.": { native: "He grows.", bases: { "ಬೆಳಯುತ್ತಾನೆ": "grows" } }
      "ಅವರು ಬೆಳಯುತ್ತಾರೆ.": { native: "They grow.", bases: { "ಬೆಳಯುತ್ತಾರೆ": "grow" } }
  "kn-1181":
    native: "break"
    notes:
      "n1": "To break a thing into pieces, such as a pot."
    examples:
      "ಅವನು ಒಡಯುತ್ತಾನೆ.": { native: "He breaks.", bases: { "ಒಡಯುತ್ತಾನೆ": "breaks" } }
      "ಅವರು ಒಡಯುತ್ತಾರೆ.": { native: "They break.", bases: { "ಒಡಯುತ್ತಾರೆ": "break" } }
  "kn-1182":
    native: "snap, break"
    notes:
      "n1": "To break a thing into two, such as a stick."
    examples:
      "ಅವನು ಮುರಯುತ್ತಾನೆ.": { native: "He snaps.", bases: { "ಮುರಯುತ್ತಾನೆ": "snaps" } }
      "ಅವರು ಮುರಯುತ್ತಾರೆ.": { native: "They snap.", bases: { "ಮುರಯುತ್ತಾರೆ": "snap" } }
  "kn-1183":
    native: "hold, catch"
    notes:
      "n1": "To hold a thing in the hand, or to catch it."
    examples:
      "ಅವನು ಹಿಡಯುತ್ತಾನೆ.": { native: "He holds.", bases: { "ಹಿಡಯುತ್ತಾನೆ": "holds" } }
      "ಅವರು ಹಿಡಯುತ್ತಾರೆ.": { native: "They hold.", bases: { "ಹಿಡಯುತ್ತಾರೆ": "hold" } }
  "kn-1184":
    native: "pull"
    notes:
      "n1": "To pull a thing towards you. The opposite is ತಳ್ಳು (taḷḷu), to push."
    examples:
      "ಅವನು ಎಳಯುತ್ತಾನೆ.": { native: "He pulls.", bases: { "ಎಳಯುತ್ತಾನೆ": "pulls" } }
      "ಅವರು ಎಳಯುತ್ತಾರೆ.": { native: "They pull.", bases: { "ಎಳಯುತ್ತಾರೆ": "pull" } }
  "kn-1185":
    native: "join, reach"
    notes:
      "n1": "To join a group, or to reach a place."
    examples:
      "ಅವನು ಸೇರುತ್ತಾನೆ.": { native: "He joins.", bases: { "ಸೇರುತ್ತಾನೆ": "joins" } }
      "ಅವರು ಸೇರುತ್ತಾರೆ.": { native: "They join.", bases: { "ಸೇರುತ್ತಾರೆ": "join" } }
  "kn-1186":
    native: "leave, let go"
    notes:
      "n1": "To leave a place, or to let something go."
    examples:
      "ಅವನು ಬಿಡುತ್ತಾನೆ.": { native: "He leaves.", bases: { "ಬಿಡುತ್ತಾನೆ": "leaves" } }
      "ಅವರು ಬಿಡುತ್ತಾರೆ.": { native: "They leave.", bases: { "ಬಿಡುತ್ತಾರೆ": "leave" } }
  "kn-1187":
    native: "lose"
    notes:
      "n1": "To lose a thing, which you cannot find."
    examples:
      "ಅವನು ಕಳಯುತ್ತಾನೆ.": { native: "He loses.", bases: { "ಕಳಯುತ್ತಾನೆ": "loses" } }
      "ಅವರು ಕಳಯುತ್ತಾರೆ.": { native: "They lose.", bases: { "ಕಳಯುತ್ತಾರೆ": "lose" } }
  "kn-1188":
    native: "win"
    notes:
      "n1": "To win a game or a race. The opposite is ಸೋಲು (sōlu)."
    examples:
      "ಅವನು ಗೆಲ್ಲುತ್ತಾನೆ.": { native: "He wins.", bases: { "ಗೆಲ್ಲುತ್ತಾನೆ": "wins" } }
      "ಅವರು ಗೆಲ್ಲುತ್ತಾರೆ.": { native: "They win.", bases: { "ಗೆಲ್ಲುತ್ತಾರೆ": "win" } }
  "kn-1189":
    native: "lose a game"
    notes:
      "n1": "To lose a game or a fight."
    examples:
      "ಅವನು ಸೋಲುತ್ತಾನೆ.": { native: "He loses.", bases: { "ಸೋಲುತ್ತಾನೆ": "loses" } }
      "ಅವರು ಸೋಲುತ್ತಾರೆ.": { native: "They lose.", bases: { "ಸೋಲುತ್ತಾರೆ": "lose" } }
  "kn-1190":
    native: "want, wish for"
    notes:
      "n1": "To want or wish for something, more than to need it."
    examples:
      "ಅವನು ಬಯಸುತ್ತಾನೆ.": { native: "He wants.", bases: { "ಬಯಸುತ್ತಾನೆ": "wants" } }
      "ಅವರು ಬಯಸುತ್ತಾರೆ.": { native: "They want.", bases: { "ಬಯಸುತ್ತಾರೆ": "want" } }
  "kn-1191":
    native: "chew"
    notes:
      "n1": "To chew food with the teeth."
    examples:
      "ಅವನು ಜಗಯುತ್ತಾನೆ.": { native: "He chews.", bases: { "ಜಗಯುತ್ತಾನೆ": "chews" } }
      "ಅವರು ಜಗಯುತ್ತಾರೆ.": { native: "They chew.", bases: { "ಜಗಯುತ್ತಾರೆ": "chew" } }
  "kn-1192":
    native: "receive, accept"
    notes:
      "n1": "To receive a gift or accept an offer."
    examples:
      "ಅವನು ಸ್ವೀಕರಿಸುತ್ತಾನೆ.": { native: "He receives.", bases: { "ಸ್ವೀಕರಿಸುತ್ತಾನೆ": "receives" } }
      "ಅವರು ಸ್ವೀಕರಿಸುತ್ತಾರೆ.": { native: "They receive.", bases: { "ಸ್ವೀಕರಿಸುತ್ತಾರೆ": "receive" } }
