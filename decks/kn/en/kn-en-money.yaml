schema: 1
id: "kn-en-money"
kind: "layer"
core: "kn-money"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Money: rupees, savings, profit and loss"
license: "CC-BY-SA-4.0"
description: "Money: the rupee and the coin, the note and the bill, savings and interest, spending and earning, and profit and loss. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1680":
    native: "paisa"
    notes:
      "n1": "A paisa, a small coin, one hundredth of a rupee."
    examples:
      "ಪೈಸೆ ಇಲ್ಲ.": "There is no paisa."
      "ಪೈಸೆ ಕೊಡು.": "Give the paisa."
  "kn-1681":
    native: "coin"
    notes:
      "n1": "A coin, a round piece of metal money."
    examples:
      "ನಾಣ್ಯ ಎಲ್ಲಿ?": "Where is the coin?"
      "ನಾಣ್ಯ ಚಿಕ್ಕದು.": "The coin is small."
  "kn-1682":
    native: "note, banknote"
    notes:
      "n1": "A note, a paper money."
    examples:
      "ನೋಟು ಬೇಕು.": "I need a note."
      "ಹೊಸ ನೋಟು ಇದೆ.": { native: "There is a new note.", bases: { "ಇದೆ": "there is" } }
  "kn-1683":
    native: "interest"
    notes:
      "n1": "Interest, the extra money paid on a loan or a deposit."
    examples:
      "ಬಡ್ಡಿ ಎಷ್ಟು?": "What is the interest?"
      "ಬ್ಯಾಂಕ್ ಬಡ್ಡಿ ಕೊಡುತ್ತದೆ.": "The bank gives interest."
  "kn-1684":
    native: "savings"
    notes:
      "n1": "Savings, money put aside for later."
    examples:
      "ಉಳಿತಾಯ ಬೇಕು.": "Savings are needed."
      "ನನ್ನ ಉಳಿತಾಯ ಇದೆ.": { native: "I have savings.", bases: { "ಇದೆ": "have" } }
  "kn-1685":
    native: "expense, spending"
    notes:
      "n1": "An expense, money spent on something."
    examples:
      "ಖರ್ಚು ಆಯಿತು.": "There was an expense."
      "ಖರ್ಚು ಕಡಿಮೆ ಮಾಡು.": "Reduce the expense."
  "kn-1686":
    native: "income"
    notes:
      "n1": "Income, the money one earns."
    examples:
      "ಆದಾಯ ಎಷ್ಟು?": "What is the income?"
      "ಆದಾಯ ಹೆಚ್ಚು ಆಯಿತು.": "The income went up."
  "kn-1687":
    native: "profit, gain"
    notes:
      "n1": "Profit, the money gained after selling."
    examples:
      "ಲಾಭ ಆಯಿತು.": "There was a profit."
      "ಲಾಭ ಬೇಕು.": "Profit is needed."
  "kn-1688":
    native: "loss"
    notes:
      "n1": "A loss, money lost in a deal. The opposite is ಲಾಭ (lābha)."
    examples:
      "ನಷ್ಟ ಆಯಿತು.": "There was a loss."
      "ನಷ್ಟ ಬೇಡ.": "No loss."
  "kn-1689":
    native: "transaction, business dealing"
    notes:
      "n1": "A transaction, buying and selling, or a business deal."
    examples:
      "ವಹಿವಾಟು ಚೆನ್ನಾಗಿದೆ.": "The business is good."
      "ವಹಿವಾಟು ಮುಗಿಯಿತು.": "The deal is finished."
  "kn-1690":
    native: "budget"
    notes:
      "n1": "A budget, a plan of how much money to spend."
    examples:
      "ಬಜೆಟ್ ಇದೆ.": { native: "There is a budget.", bases: { "ಇದೆ": "there is" } }
      "ಬಜೆಟ್ ಬೇಕು.": "I need a budget."
  "kn-1691":
    native: "ATM"
    notes:
      "n1": "An ATM, a machine that gives cash from a bank account."
    examples:
      "ಎಟಿಎಂ ಎಲ್ಲಿ?": "Where is the ATM?"
      "ಎಟಿಎಂ ಬೇಕು.": "I need an ATM."
  "kn-1692":
    native: "account, calculation"
    notes:
      "n1": "A calculation or an account of money."
    examples:
      "ಲೆಕ್ಕ ಸರಿ.": { native: "The calculation is right.", bases: { "ಸರಿ": "all right" } }
      "ಲೆಕ್ಕ ಬರೆ.": "Write the account."
  "kn-1693":
    native: "to count"
    notes:
      "n1": "To count money, or things."
    examples:
      "ನೋಟು ಎಣಿಸು.": "Count the notes."
      "ಅವನು ಹಣ ಎಣಿಸುತ್ತಾನೆ.": { native: "He counts the money.", bases: { "ಎಣಿಸುತ್ತಾನೆ": "counts" } }
  "kn-1694":
    native: "to save up"
    notes:
      "n1": "To save money, putting it together over time."
    examples:
      "ಹಣ ಕೂಡಿಡು.": "Save up money."
      "ಅವಳು ಹಣ ಕೂಡಿಟ್ಟಳು.": { native: "She saved up money.", bases: { "ಕೂಡಿಟ್ಟಳು": "saved up" } }
  "kn-1695":
    native: "cost, expense"
    notes:
      "n1": "The cost of a thing, its price in money."
    examples:
      "ವೆಚ್ಚ ಎಷ್ಟು?": "What is the cost?"
      "ವೆಚ್ಚ ಜಾಸ್ತಿ.": "The cost is high."
  "kn-1696":
    native: "investment"
    notes:
      "n1": "An investment, money put into something to earn more."
    examples:
      "ಹೂಡಿಕೆ ಮಾಡು.": "Invest."
      "ಹೂಡಿಕೆ ಲಾಭ ಕೊಡುತ್ತದೆ.": "An investment gives profit."
