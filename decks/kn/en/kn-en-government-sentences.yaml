tags: ["beginner", "unreviewed"]
cards:
  "kn-7485":
    notes:
      "n1": "ಸರ್ಕಾರಿ (sarkāri), government, is the adjective of ಸರ್ಕಾರ (sarkāra), government, placed before the noun."
    native: "This is a government office."
  "kn-7486":
    notes:
      "n1": "ನನಗೆ (nanage), to me, goes with ಬೇಕು (bēku): the thing needed is the subject, and the person needing it takes the dative."
    native: "I need a form."
    bases:
      "ನನಗೆ": "to me"
      "ಬೇಕು": "needed"
  "kn-7487":
    notes:
      "n1": "ಇದ್ದಾರೆ (iddāre) is used for people: an official is a person, so Kannada uses it, not ಇದೆ (ide)."
    native: "The official is here."
    bases:
      "ಇದ್ದಾರೆ": "are (people)"
  "kn-7488":
    native: "This is a rule."
  "kn-7489":
    notes:
      "n1": "ಪಾವತಿಸುತ್ತೇನೆ (pāvatisuttēne), I pay, ends in -ುತ್ತೇನೆ (-uttēne) for 'I' in the present."
    native: "I pay tax."
    bases:
      "ಪಾವತಿಸುತ್ತೇನೆ": "to pay (I)"
  "kn-7490":
    notes:
      "n1": "A job or status noun needs no word for 'is': ನಾಗರಿಕ (nāgarika), citizen, follows ನಾನು (nānu), I, directly."
    native: "I am a citizen."
  "kn-7491":
    notes:
      "n1": "ಇದೆ (ide), there is, is the verb for a thing such as an order."
    native: "There is an order."
    bases:
      "ಇದೆ": "is there"
  "kn-7492":
    notes:
      "n1": "ಬೇಕು (bēku), needed, makes the thing needed the subject: ಅನುಮತಿ (anumati), permission, is needed, with no person named."
    native: "Permission is needed."
    bases:
      "ಬೇಕು": "needed"
