schema: 1
id: "kn-en-adverbs-sentences"
kind: "layer"
core: "kn-adverbs-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Adverbs: how often, how well, when: sentences"
description: "Sentences about how often, how well, when and where things are done, with the words of the adverbs unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8137":
    notes:
      "n1": "ಬೇಗ (bēga), early or quickly, is an adverb with no ending."
    native: "I go early."
    bases:
      "ಹೋಗುತ್ತೇನೆ": "to go, here in the first-person present"
  "kn-8138":
    notes:
      "n1": "The ending -ಆಗಿ (-āgi) turns an adjective into an adverb, as in ಚೆನ್ನಾಗಿ (cennāgi), well."
    native: "She sings well."
    bases:
      "ಹಾಡುತ್ತಾಳೆ": "to sing, here in the third-person feminine present"
  "kn-8139":
    notes:
      "n1": "ತುಂಬಾ (tumbā), a lot, needs no ending and comes before the verb."
    native: "You read a lot."
    bases:
      "ಓದುತ್ತೀಯ": "to read, here in the second-person present"
  "kn-8140":
    notes:
      "n1": "ನಿನ್ನನ್ನು (ninnannu) is ನೀನು (nīnu), you, with the ending -ಅನ್ನು (-annu), which marks the one being seen."
    native: "I see you often."
    bases:
      "ನಿನ್ನನ್ನು": "you, as the thing seen: you (the object)"
      "ನೋಡುತ್ತೇನೆ": "to see, here in the first-person present"
  "kn-8141":
    notes:
      "n1": "ಬರುತ್ತಾನೆ (baruttāne) comes from ಬಾ (bā), to come: its stem changes to ಬರು (baru) before the endings."
    native: "He sometimes comes late."
    bases:
      "ಬರುತ್ತಾನೆ": "to come; the stem changes to ಬರು (baru) before the ending"
  "kn-8142":
    notes:
      "n1": "ನಿಧಾನವಾಗಿ (nidhānavāgi), slowly, takes the adverb ending -ವಾಗಿ (-vāgi)."
    native: "She walks slowly."
    bases:
      "ನಡೆಯುತ್ತಾಳೆ": "to walk, here in the third-person feminine present"
  "kn-8143":
    notes:
      "n1": "ಜೋರಾಗಿ (jōrāgi), loudly, takes the adverb ending -ಆಗಿ (-āgi)."
    native: "Children sing loudly."
    bases:
      "ಹಾಡುತ್ತಾರೆ": "to sing, here in the third-person plural present"
  "kn-8144":
    native: "Walk softly."
  "kn-8145":
    notes:
      "n1": "ಬನ್ನಿ (banni) is the polite command of ಬಾ (bā), come."
    native: "Please come early."
    bases:
      "ಬನ್ನಿ": "to come; the polite command"
  "kn-8146":
    notes:
      "n1": "ಹೋದರು (hōdaru) is the past 'went' for a respected person or several people."
    native: "They have already gone."
    bases:
      "ಹೋದರು": "to go, here in the past tense"
  "kn-8147":
    notes:
      "n1": "ಸರಿಯಾಗಿ (sariyāgi), properly, is the -ಆಗಿ (-āgi) adverb of ಸರಿಯಾದ (sariyāda), proper."
    native: "I read properly."
    bases:
      "ಓದುತ್ತೇನೆ": "to read, here in the first-person present"
  "kn-8148":
    native: "When are you coming?"
    bases:
      "ಬರುತ್ತೀರಿ": "to come, here in the polite second-person present"
