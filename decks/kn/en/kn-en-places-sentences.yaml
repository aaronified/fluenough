tags: ["beginner", "unreviewed"]
cards:
  "kn-7036":
    native: "Where is the school?"
    notes:
      "n1": "ಎಲ್ಲಿ (elli), where, comes last, in the place a verb would take, and no word for 'is' is needed."
  "kn-7037":
    native: "This is a temple."
    notes:
      "n1": "No word for 'is' is said: ಇದು (idu), this, comes first, then the noun."
  "kn-7038":
    native: "That is not a mosque."
    notes:
      "n1": "ಅಲ್ಲ (alla), not, comes after the noun it negates: ಮಸೀದಿ (masīdi) ಅಲ್ಲ (alla) is 'not a mosque'."
  "kn-7039":
    native: "That is not the sea; it is a lake."
    notes:
      "n1": "The pattern is what it is not, then ಅಲ್ಲ (alla), then what it is, after a comma."
  "kn-7040":
    native: "Where is our town?"
    notes:
      "n1": "ನಮ್ಮ (namma), our, comes before its noun, and is the possessive of ನಾವು (nāvu), we."
  "kn-7041":
    native: "Where is the river?"
  "kn-7042":
    native: "This is a village."
  "kn-7043":
    native: "Where is your college?"
    notes:
      "n1": "ನಿಮ್ಮ (nimma), your, is the polite or plural form; to a friend, say ನಿನ್ನ (ninna)."
  "kn-7044":
    native: "When is the film?"
    notes:
      "n1": "ಯಾವಾಗ (yāvāga), when, also ends the question, as ಎಲ್ಲಿ (elli) does."
  "kn-7045":
    native: "Where is the library?"
  "kn-7046":
    native: "Where is the park?"
