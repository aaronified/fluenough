schema: 1
id: "kn-en-verbs-5"
kind: "layer"
core: "kn-verbs-5"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sequence actions: what happened next"
license: "CC-BY-SA-4.0"
description: "Verbs for telling what happened next: continue, finish, begin, and end, with a sentence for he and for they. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1718":
    native: "continue, go on"
    notes:
      "n1": "To go on with what was started."
    examples:
      "ಅವನು ಮುಂದುವರಯುತ್ತಾನೆ.": { native: "He continues.", bases: { "ಮುಂದುವರಯುತ್ತಾನೆ": "continues" } }
      "ಅವರು ಮುಂದುವರಯುತ್ತಾರೆ.": { native: "They continue.", bases: { "ಮುಂದುವರಯುತ್ತಾರೆ": "continue" } }
  "kn-1719":
    native: "finish"
    notes:
      "n1": "To finish a task or a meal."
    examples:
      "ಅವನು ಮುಗಿಸುತ್ತಾನೆ.": { native: "He finishes.", bases: { "ಮುಗಿಸುತ್ತಾನೆ": "finishes" } }
      "ಅವರು ಮುಗಿಸುತ್ತಾರೆ.": { native: "They finish.", bases: { "ಮುಗಿಸುತ್ತಾರೆ": "finish" } }
  "kn-1720":
    native: "prepare, make"
    notes:
      "n1": "To prepare food or to make ready for a task."
    examples:
      "ಅವನು ತಯಾರಿಸುತ್ತಾನೆ.": { native: "He prepares.", bases: { "ತಯಾರಿಸುತ್ತಾನೆ": "prepares" } }
      "ಅವರು ತಯಾರಿಸುತ್ತಾರೆ.": { native: "They prepare.", bases: { "ತಯಾರಿಸುತ್ತಾರೆ": "prepare" } }
  "kn-1721":
    native: "be found, be available"
    notes:
      "n1": "To be found, or to be available."
    examples:
      "ಅವನು ಸಿಗುತ್ತಾನೆ.": { native: "He is found.", bases: { "ಸಿಗುತ್ತಾನೆ": "is found" } }
      "ಅವರು ಸಿಗುತ್ತಾರೆ.": { native: "They are found.", bases: { "ಸಿಗುತ್ತಾರೆ": "are found" } }
  "kn-1722":
    native: "begin, start"
    notes:
      "n1": "To begin a work, a meeting or a journey."
    examples:
      "ಅವನು ಆರಂಭಿಸುತ್ತಾನೆ.": { native: "He begins.", bases: { "ಆರಂಭಿಸುತ್ತಾನೆ": "begins" } }
      "ಅವರು ಆರಂಭಿಸುತ್ತಾರೆ.": { native: "They begin.", bases: { "ಆರಂಭಿಸುತ್ತಾರೆ": "begin" } }
  "kn-1723":
    native: "end, bring to an end"
    notes:
      "n1": "To bring something to an end."
    examples:
      "ಅವನು ಕೊನೆಗೊಳಿಸುತ್ತಾನೆ.": { native: "He ends.", bases: { "ಕೊನೆಗೊಳಿಸುತ್ತಾನೆ": "ends" } }
      "ಅವರು ಕೊನೆಗೊಳಿಸುತ್ತಾರೆ.": { native: "They end.", bases: { "ಕೊನೆಗೊಳಿಸುತ್ತಾರೆ": "end" } }
  "kn-1724":
    native: "stick, paste"
    notes:
      "n1": "To stick one thing to another, with glue or tape."
    examples:
      "ಅವನು ಅಂಟಿಸುತ್ತಾನೆ.": { native: "He sticks.", bases: { "ಅಂಟಿಸುತ್ತಾನೆ": "sticks" } }
      "ಅವರು ಅಂಟಿಸುತ್ತಾರೆ.": { native: "They stick.", bases: { "ಅಂಟಿಸುತ್ತಾರೆ": "stick" } }
  "kn-1725":
    native: "gather together"
    notes:
      "n1": "To come together as a group."
    examples:
      "ಅವನು ಒಗ್ಗೂಡುತ್ತಾನೆ.": { native: "He gathers.", bases: { "ಒಗ್ಗೂಡುತ್ತಾನೆ": "gathers" } }
      "ಅವರು ಒಗ್ಗೂಡುತ್ತಾರೆ.": { native: "They gather.", bases: { "ಒಗ್ಗೂಡುತ್ತಾರೆ": "gather" } }
  "kn-1726":
    native: "send for, summon"
    notes:
      "n1": "To send for someone, or to have someone come."
    examples:
      "ಅವನು ಕರೆಸುತ್ತಾನೆ.": { native: "He sends for.", bases: { "ಕರೆಸುತ್ತಾನೆ": "sends for" } }
      "ಅವರು ಕರೆಸುತ್ತಾರೆ.": { native: "They send for.", bases: { "ಕರೆಸುತ್ತಾರೆ": "send for" } }
  "kn-1727":
    native: "return, come back"
    notes:
      "n1": "To come back to a place, or to go back."
    examples:
      "ಅವನು ಹಿಂತಿರುಗುತ್ತಾನೆ.": { native: "He returns.", bases: { "ಹಿಂತಿರುಗುತ್ತಾನೆ": "returns" } }
      "ಅವರು ಹಿಂತಿರುಗುತ್ತಾರೆ.": { native: "They return.", bases: { "ಹಿಂತಿರುಗುತ್ತಾರೆ": "return" } }
  "kn-1728":
    native: "light up, shine"
    notes:
      "n1": "To light up a room, or to shine brightly."
    examples:
      "ಅವನು ಬೆಳಗುತ್ತಾನೆ.": { native: "He lights up.", bases: { "ಬೆಳಗುತ್ತಾನೆ": "lights up" } }
      "ಅವರು ಬೆಳಗುತ್ತಾರೆ.": { native: "They light up.", bases: { "ಬೆಳಗುತ್ತಾರೆ": "light up" } }
  "kn-1729":
    native: "leave, depart"
    notes:
      "n1": "To go away from a place, formally."
    examples:
      "ಅವನು ತೆರಳುತ್ತಾನೆ.": { native: "He leaves.", bases: { "ತೆರಳುತ್ತಾನೆ": "leaves" } }
      "ಅವರು ತೆರಳುತ್ತಾರೆ.": { native: "They leave.", bases: { "ತೆರಳುತ್ತಾರೆ": "leave" } }
  "kn-1730":
    native: "mix, mingle"
    notes:
      "n1": "To mix two things together."
    examples:
      "ಅವನು ಬೆರಯುತ್ತಾನೆ.": { native: "He mixes.", bases: { "ಬೆರಯುತ್ತಾನೆ": "mixes" } }
      "ಅವರು ಬೆರಯುತ್ತಾರೆ.": { native: "They mix.", bases: { "ಬೆರಯುತ್ತಾರೆ": "mix" } }
  "kn-1731":
    native: "get dark"
    notes:
      "n1": "To become dark, said of the evening."
    examples:
      "ಅವನು ಕತ್ತಲಾಗುತ್ತಾನೆ.": { native: "He gets dark.", bases: { "ಕತ್ತಲಾಗುತ್ತಾನೆ": "gets dark" } }
      "ಅವರು ಕತ್ತಲಾಗುತ್ತಾರೆ.": { native: "They get dark.", bases: { "ಕತ್ತಲಾಗುತ್ತಾರೆ": "get dark" } }
  "kn-1732":
    native: "delay"
    notes:
      "n1": "To delay, or to be late."
    examples:
      "ಅವನು ತಡಮಾಡುತ್ತಾನೆ.": { native: "He delays.", bases: { "ತಡಮಾಡುತ್ತಾನೆ": "delays" } }
      "ಅವರು ತಡಮಾಡುತ್ತಾರೆ.": { native: "They delay.", bases: { "ತಡಮಾಡುತ್ತಾರೆ": "delay" } }
  "kn-1733":
    native: "happen, occur"
    notes:
      "n1": "To happen, said of an event."
    examples:
      "ಅವನು ಸಂಭವಿಸುತ್ತಾನೆ.": { native: "He happens.", bases: { "ಸಂಭವಿಸುತ್ತಾನೆ": "happens" } }
      "ಅವರು ಸಂಭವಿಸುತ್ತಾರೆ.": { native: "They happen.", bases: { "ಸಂಭವಿಸುತ್ತಾರೆ": "happen" } }
