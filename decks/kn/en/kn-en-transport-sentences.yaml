cards:
  "kn-7786":
    notes:
      "n1": "ಬಸ್ಸು (bassu) changes its stem before a case ending: ಬಸ್ಸಿನಲ್ಲಿ (bassinalli), in the bus, here by bus."
    native: "I go by bus."
  "kn-7787":
    notes:
      "n1": "ಬಾಡಿಗೆ (bāḍige), fare here, also means rent."
    native: "How much is the auto fare?"
  "kn-7788":
    notes:
      "n1": "ರೈಲು (railu) and ನಿಲ್ದಾಣ (nildāṇa) join with no word between to make 'railway station'; ಎಲ್ಲಿ (elli), where, follows the noun."
    native: "Where is the railway station?"
  "kn-7789":
    notes:
      "n1": "ರೈಲಿನಲ್ಲಿ (railinalli), by train, is ರೈಲು (railu) with its -ು (-u) dropped and -ಇನಲ್ಲಿ (-inalli) added, the locative ending, 'in' or 'on', here used for 'by', after a noun ending in -ು (-u); ಹೋದನು (hōdanu) is the past of ಹೋಗು (hōgu), go, for 'he'."
    native: "He went by train."
  "kn-7790":
    notes:
      "n1": "ಹೋಗೋಣ (hōgōṇa), let us go, is the 'let's' form of ಹೋಗು (hōgu), go, with the ending -ೋಣ (-ōṇa)."
    native: "Let's go by taxi."
  "kn-7791":
    notes:
      "n1": "ನಿಧಾನವಾಗಿ (nidhānavāgi), slowly, is ನಿಧಾನ (nidhāna), slow, with -ಆಗಿ (-āgi), which makes an adverb."
    native: "The bus goes slowly."
  "kn-7792":
    notes:
      "n1": "ನಿಲ್ದಾಣಕ್ಕೆ (nildāṇakke), to the station, ends in the dative -ಕ್ಕೆ (-kke), used for a place."
    native: "I go to the station."
  "kn-7793":
    notes:
      "n1": "ಬಸ್ಸಿನಲ್ಲಿ (bassinalli), by bus, takes -ಇನಲ್ಲಿ (-inalli) after ಬಸ್ಸು (bassu), bus; ಹೋದೆ (hōde), I went, is the past of ಹೋಗು (hōgu), go, for 'I'."
    native: "In the morning I went by bus."
  "kn-7794":
    notes:
      "n1": "ಎಷ್ಟು (eṣṭu), how much, asked on its own at a ticket counter, means 'what is the price?'"
    native: "How much is the ticket?"
