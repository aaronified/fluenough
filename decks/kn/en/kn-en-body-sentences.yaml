cards:
  "kn-8173":
    native: "My head is heavy."
  "kn-8174":
    native: "My ears hear well."
    bases:
      "ಕೇಳುತ್ತದೆ": "to hear, here in the third-person neuter present"
  "kn-8175":
    notes:
      "n1": "ಹಸಿದಿದೆ (hasidide) is the adjective ಹಸಿದ (hasida), hungry, with ಇದೆ (ide), is, joined into one word."
    native: "My stomach is hungry."
    bases:
      "ಹಸಿದಿದೆ": "hungry, here with the ending -ಇದೆ: is hungry"
  "kn-8176":
    native: "Open your mouth."
  "kn-8177":
    native: "Close your eyes."
  "kn-8178":
    native: "I open my eyes."
    bases:
      "ತೆರೆಯುತ್ತೇನೆ": "to open, here in the first-person present"
  "kn-8179":
    native: "My back feels heavy."
  "kn-8180":
    native: "Her face smiles."
    bases:
      "ನಗುತ್ತದೆ": "to laugh or smile, here in the third-person neuter present"
