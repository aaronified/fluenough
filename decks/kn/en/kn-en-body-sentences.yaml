schema: 1
id: "kn-en-body-sentences"
kind: "layer"
core: "kn-body-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The body: sentences"
description: "Sentences about the body: the head, the ears and the stomach, and what the body does. They use the words of the body unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8312":
    notes:
      "n1": "ಭಾರ (bhāra), heavy, needs no verb: 'my head is heavy'."
    native: "My head is heavy."
  "kn-8313":
    notes:
      "n1": "ಕೇಳುತ್ತದೆ (kēḷuttade) here means 'hears well', and ಸರಿಯಾಗಿ (sariyāgi) is the adverb 'well'."
    native: "My ears hear well."
    bases:
      "ಕೇಳುತ್ತದೆ": "to hear, here in the third-person neuter present"
  "kn-8314":
    notes:
      "n1": "ಹಸಿದಿದೆ (hasidide) is the adjective ಹಸಿದ (hasida), hungry, with ಇದೆ (ide), is, joined into one word."
    native: "My stomach is hungry."
    bases:
      "ಹಸಿದಿದೆ": "hungry, here with the ending -ಇದೆ (-ide): is hungry"
  "kn-8315":
    notes:
      "n1": "ತೆರೆ (tere) is the informal command 'open'; to a stranger use the polite ತೆರೆಯಿರಿ (tereyiri)."
    native: "Open your mouth."
  "kn-8316":
    notes:
      "n1": "ಮುಚ್ಚು (muccu) is the informal command 'close'; the polite form is ಮುಚ್ಚಿ (mucci)."
    native: "Close your eyes."
  "kn-8317":
    native: "I open my eyes."
    bases:
      "ತೆರೆಯುತ್ತೇನೆ": "to open, here in the first-person present"
  "kn-8318":
    native: "My back feels heavy."
  "kn-8319":
    notes:
      "n1": "ಮುಚ್ಚು (muccu) is the informal command 'close', as in the card before."
    native: "Close your mouth."
