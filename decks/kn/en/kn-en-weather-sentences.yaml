cards:
  "kn-7805":
    native: "There is a lot of sun today."
    notes:
      "n1": "ಜಾಸ್ತಿ (jāsti) 'a lot' follows the noun and needs no verb. ಬಿಸಿಲು (bisilu) is 'sun' or 'sunshine'."
  "kn-7806":
    native: "It is cold now."
    notes:
      "n1": "ಚಳಿ (caḷi) 'cold' is a noun, so the sentence needs no verb: ಈಗ (īga) 'now' comes first."
  "kn-7807":
    native: "The sun shines in the sky."
    notes:
      "n1": "ಆಕಾಶದಲ್ಲಿ (ākāśadalli) 'in the sky' uses the ಅಲ್ಲಿ (alli) ending for 'in'. ಉರಿಯುತ್ತಾನೆ (uriyuttāne) ends in ಆನೆ (āne) because ಸೂರ್ಯ (sūrya) 'sun' is treated as 'he'."
  "kn-7808":
    native: "In summer it is very hot."
    notes:
      "n1": "ಬೇಸಿಗೆಯಲ್ಲಿ (bēsigeyalli) 'in summer' uses the ಅಲ್ಲಿ (alli) ending for 'in'. ಜಾಸ್ತಿ (jāsti) 'a lot' follows the noun."
  "kn-7809":
    native: "In winter it is very cold."
    notes:
      "n1": "ಚಳಿಗಾಲದಲ್ಲಿ (caḷigāladalli) takes the ಅಲ್ಲಿ (alli) ending for 'in', as in the summer card."
  "kn-7810":
    native: "The wind blows strongly."
    notes:
      "n1": "ಜೋರಾಗಿ (jōrāgi) 'strongly' is ಜೋರು (jōru) 'strong' with the ಆಗಿ (āgi) ending, and it comes before the verb ಬೀಸುತ್ತದೆ (bīsuttade)."
  "kn-7811":
    native: "At night it is dark."
    notes:
      "n1": "ರಾತ್ರಿ (rātri) 'night' and ಕತ್ತಲು (kattalu) 'dark' stand side by side with no verb."
  "kn-7812":
    native: "Sit in the shade."
    notes:
      "n1": "ನೆರಳಿನಲ್ಲಿ (neraḷinalli) 'in the shade' adds ಇನ (ina) before ಅಲ್ಲಿ (alli) after a noun ending in u. ಕೂರಿ (kūri) is the polite command 'sit'."
  "kn-7813":
    native: "In the morning the wind is cool."
    notes:
      "n1": "ತಂಪು (tampu) 'cool' is used as the predicate with no verb, and ಬೆಳಿಗ್ಗೆ (beḷigge) 'in the morning' comes first."
