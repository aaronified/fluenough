# Layer for kn-proverbs-2: each proverb's literal English rendering and its meaning.
schema: 1
id: "kn-en-proverbs-2"
kind: "layer"
core: "kn-proverbs-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs 2"
description: "Twenty Kannada proverbs about friends, learning, luck, time, speech and farming, each with a literal English rendering and its meaning. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "kn-6250":
    native: "The one who helps in trouble is the true friend."
    notes:
      "literal": "Said that a friend is known in hard times."
    bases:
      "ಆಪತ್ತಿಗಾದವನೇ": { meaning: "the one who helps in trouble" }
      "ನಿಜವಾದ": { meaning: "true" }
      "ಗೆಳೆಯ": { meaning: "friend" }
  "kn-6251":
    native: "The company of the petty brings the ruin of pride."
    notes:
      "literal": "Said that keeping low company costs one's dignity."
    bases:
      "ಅಲ್ಪರ": { meaning: "of the petty" }
      "ಸಂಗ": { meaning: "company" }
      "ಅಭಿಮಾನ": { meaning: "pride" }
      "ಭಂಗ": { meaning: "ruin" }
  "kn-6252":
    native: "The company of good people is like tasting wild honey."
    notes:
      "literal": "Said that good company is sweet and rewarding."
    bases:
      "ಸಜ್ಜನರ": { meaning: "of good people" }
      "ಸಂಗ": { meaning: "company" }
      "ಹೆಜ್ಜೇನು": { meaning: "wild honey" }
      "ಸವಿದಂತೆ": { meaning: "like tasting" }
  "kn-6253":
    native: "Too much friendship leads to ruin."
    notes:
      "literal": "Said that a friendship that is too close can end badly."
    bases:
      "ಅತಿ": { meaning: "too much" }
      "ಸ್ನೇಹ": { meaning: "friendship" }
      "ಗತಿ": { meaning: "the course" }
      "ಕೇಡು": { meaning: "ruin" }
  "kn-6254":
    native: "One who knows learning is valued wherever he is."
    notes:
      "literal": "Said that learning earns respect everywhere."
    bases:
      "ವಿದ್ಯೆ": { meaning: "learning" }
      "ಬಲ್ಲವ": { meaning: "one who knows" }
      "ಎಲ್ಲಿದ್ದರು": { meaning: "wherever" }
      "ಸಲ್ಲುವ": { meaning: "is valued" }
  "kn-6255":
    native: "Travel round the country; read the store of words."
    notes:
      "literal": "Said that one learns by travelling and by reading; kosha is a dictionary or store of words."
    bases:
      "ದೇಶ": { meaning: "the country" }
      "ಸುತ್ತು": { meaning: "travel round" }
      "ಕೋಶ": { meaning: "the store of words" }
      "ಓದು": { meaning: "read" }
  "kn-6256":
    native: "One who has learnt half has the most bluster."
    notes:
      "literal": "Said that a half-learned person is the loudest."
    bases:
      "ಅರ್ಧ": { meaning: "half" }
      "ಕಲಿತವನ": { meaning: "of one who learnt" }
      "ಆಬ್ಬರ": { meaning: "bluster" }
      "ಹೆಚ್ಚು": { meaning: "more" }
  "kn-6257":
    native: "One must know the world and must learn accounts."
    notes:
      "literal": "Said that one should know the world and learn practical reckoning."
    bases:
      "ಲೋಕ": { meaning: "the world" }
      "ತಿಳಿಯಬೇಕು": { meaning: "one must know" }
      "ಲೆಕ್ಕ": { meaning: "accounts" }
      "ಕಲಿಯಬೇಕು": { meaning: "one must learn" }
  "kn-6258":
    native: "Enjoyment is only as much as one's fortune."
    notes:
      "literal": "Said that one enjoys only what fate allows."
    bases:
      "ಯೋಗ": { meaning: "fortune" }
      "ಇದ್ದಷ್ಟೇ": { meaning: "as much as there is" }
      "ಭೋಗ": { meaning: "enjoyment" }
  "kn-6259":
    native: "There is no place that fate has not seen."
    notes:
      "literal": "Said that fate reaches everywhere, so no one can escape it."
    bases:
      "ವಿಧಿ": { meaning: "fate" }
      "ಕಾಣದ": { meaning: "unseen" }
      "ಎಡೆಗಳಿಲ್ಲ": { meaning: "there is no place" }
  "kn-6260":
    native: "When the wind comes, winnow yourself."
    notes:
      "literal": "Said that one should take advantage of the moment and adapt."
    bases:
      "ಗಾಳಿ": { meaning: "wind" }
      "ಬಂದಾಗ": { meaning: "when it comes" }
      "ತೂರಿಕೋ": { meaning: "winnow yourself" }
  "kn-6261":
    native: "The one who endures will live well."
    notes:
      "literal": "Said that patience brings a good life."
    bases:
      "ತಾಳಿದವನು": { meaning: "one who endures" }
      "ಬಾಳಿಯಾನು": { meaning: "will live well" }
  "kn-6262":
    native: "Have no trouble with one who causes delay."
    notes:
      "literal": "Said that one should not depend on someone who is always late."
    bases:
      "ತಡವ": { meaning: "delay" }
      "ಮಾಡುವವನ": { meaning: "of one who makes" }
      "ಗೊಡವೆ": { meaning: "trouble" }
      "ಬೇಡ": { meaning: "do not want" }
  "kn-6263":
    native: "When the danger passed, one forgot God."
    notes:
      "literal": "Said of people who pray in danger and forget once it is over."
    bases:
      "ಅಪಾಯ": { meaning: "danger" }
      "ತೀರಿತು": { meaning: "passed" }
      "ದೇವರನ್ನು": { meaning: "God" }
      "ಮರೆತಾಯಿತು": { meaning: "forgot" }
  "kn-6264":
    native: "Speech is silver, silence is gold."
    notes:
      "literal": "Said that speech has its worth, but silence is often worth more."
    bases:
      "ಮಾತು": { meaning: "speech" }
      "ಬೆಳ್ಳಿ": { meaning: "silver" }
      "ಮೌನ": { meaning: "silence" }
      "ಬಂಗಾರ": { meaning: "gold" }
  "kn-6265":
    native: "If one speaks the truth, there is bitterness."
    notes:
      "literal": "Said that telling the truth often makes enemies."
    bases:
      "ನಿಜ": { meaning: "truth" }
      "ಆಡಿದರೆ": { meaning: "if one speaks" }
      "ನಿಷ್ಠೂರ": { meaning: "bitterness" }
  "kn-6266":
    native: "If you know, speak; if you forget, sit and watch."
    notes:
      "literal": "Said that one should speak only when one knows, and otherwise keep quiet and observe."
    bases:
      "ಅರಿತರೆ": { meaning: "if you know" }
      "ಮಾತನಾಡು": { meaning: "speak" }
      "ಮರೆತರೆ": { meaning: "if you forget" }
      "ಕೂತು": { meaning: "sit" }
      "ನೋಡು": { meaning: "watch" }
  "kn-6267":
    native: "Is the fruit a weight to the vine?"
    notes:
      "literal": "Said that one does not mind a burden that is one's own."
    bases:
      "ಬಳ್ಳಿಗೆ": { meaning: "to the vine" }
      "ಕಾಯಿ": { meaning: "fruit" }
      "ಭಾರವೇ": { meaning: "is a weight" }
  "kn-6268":
    native: "One with no cow grows crops; one with cows raises children."
    notes:
      "literal": "Said of how a person's livelihood decides the work they take up."
    bases:
      "ಆಕಳಿಲ್ಲದವ": { meaning: "one with no cow" }
      "ಬೆಳೆಸು": { meaning: "crop" }
      "ಮಾಡ್ಯಾನ": { meaning: "makes" }
      "ಆಕಳಿದ್ದವ": { meaning: "one with cows" }
      "ಮಕ್ಕಳ": { meaning: "children" }
      "ಸಾಕ್ಯಾನ": { meaning: "raises" }
  "kn-6269":
    native: "Like a crop out of season, children in old age."
    notes:
      "literal": "Said that children who come in old age are a late gift, as a crop out of season is."
    bases:
      "ಅಕಾಲದಲ್ಲಿ": { meaning: "out of season" }
      "ಬೆಳೆಯಿದ್ದಂತೆ": { meaning: "like a crop" }
      "ವೃದ್ಧಾಪ್ಯದಲ್ಲಿ": { meaning: "in old age" }
      "ಮಕ್ಕಳು": { meaning: "children" }
