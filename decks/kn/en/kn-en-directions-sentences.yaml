core: "kn-directions-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Directions: sentences"
description: "Sentences with the words of the directions unit and the units before it. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-7409":
    notes:
      "n1": "ಬಲ (bala), right, takes the ending ಕ್ಕೆ (kke) for to the right: ಬಲಕ್ಕೆ (balakke)."
    native: "Turn right."
  "kn-7410":
    notes:
      "n1": "ಎಡಕ್ಕೆ (eḍakke) is the opposite of ಬಲಕ್ಕೆ (balakke): to the left."
    native: "Turn left."
  "kn-7411":
    notes:
      "n1": "ನೇರ (nēra), straight, becomes an adverb with the ending ವಾಗಿ (vāgi): ನೇರವಾಗಿ (nēravāgi), straight on."
    native: "Go straight on."
    bases:
      "ಹೋಗಿ": "go (polite)"
  "kn-7412":
    native: "There is a road ahead."
    bases:
      "ಇದೆ": "is there"
  "kn-7413":
    notes:
      "n1": "The ending ಯಾ (yā) on ಇದೆಯಾ (ideyā) turns the statement into a yes or no question."
    native: "Is your house nearby?"
    bases:
      "ಇದೆಯಾ": "is there (question)"
  "kn-7414":
    native: "This is far."
  "kn-7415":
    notes:
      "n1": "For a person ಇರು (iru) becomes ಇದ್ದಾನೆ (iddāne) for he is or ಇದ್ದಾಳೆ (iddāḷe) for she is; for a thing it is ಇದೆ (ide)."
    native: "He is behind."
    bases:
      "ಇದ್ದಾನೆ": "is (he)"
  "kn-7416":
    notes:
      "n1": "ಅಲ್ಲ (alla) after a noun makes it negative: ದಾರಿ (dāri), way, so this is not the way."
    native: "This is not the way."
  "kn-7417":
    notes:
      "n1": "For a person, ಇದ್ದೇನೆ (iddēne) means I am."
    native: "I am here."
    bases:
      "ಇದ್ದೇನೆ": "am (I)"
