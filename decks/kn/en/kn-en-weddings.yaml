schema: 1
id: "kn-en-weddings"
kind: "layer"
core: "kn-weddings"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Weddings: the invitation, the rites and the guests"
license: "CC-BY-SA-4.0"
description: "A wedding: the invitation card and the guests, the groom and the bride, the garland and the rites, and the gifts. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1556":
    native: "groom"
    notes:
      "n1": "The groom, the man who marries. The bride is ವಧು (vadhu)."
    examples:
      "ವರ ಬಂದ.": "The groom came."
      "ವರನಿಗೆ ಹಾರ ಹಾಕು.": { native: "Put a garland on the groom.", bases: { "ವರನಿಗೆ": "to the groom", "ಹಾಕು": "put" } }
  "kn-1557":
    native: "bride"
    notes:
      "n1": "The bride, the woman who marries."
    examples:
      "ವಧು ಸುಂದರ.": "The bride is beautiful."
      "ವಧುವಿನ ಉಡುಗೊರೆ ಇದೆ.": { native: "There is a gift for the bride.", bases: { "ವಧುವಿನ": "of the bride", "ಇದೆ": "there is" } }
  "kn-1558":
    native: "invitation"
    notes:
      "n1": "An invitation, a card asking people to come."
    examples:
      "ಆಮಂತ್ರಣ ಬಂತು.": "The invitation came."
      "ಆಮಂತ್ರಣ ಓದು.": "Read the invitation."
  "kn-1559":
    native: "relative"
    notes:
      "n1": "A relative, a member of one's family."
    examples:
      "ಬಂಧುಗಳು ಬಂದರು.": { native: "The relatives came.", bases: { "ಬಂಧುಗಳು": "the relatives" } }
      "ನನ್ನ ಬಂಧು ಊರಿನಲ್ಲಿ ಇದ್ದಾರೆ.": { native: "My relative is in the town.", bases: { "ಇದ್ದಾರೆ": "is" } }
  "kn-1560":
    native: "relation, kin"
    notes:
      "n1": "A relation, by blood or by marriage."
    examples:
      "ಸಂಬಂಧಿ ಬಂದರು.": "A relation came."
      "ನಮ್ಮ ಸಂಬಂಧಿ ಇದ್ದಾರೆ.": { native: "We have a relation.", bases: { "ಇದ್ದಾರೆ": "have" } }
  "kn-1561":
    native: "garland"
    notes:
      "n1": "A garland of flowers, put on a guest or a god."
    examples:
      "ಹಾರ ಹಾಕು.": { native: "Put on the garland.", bases: { "ಹಾಕು": "put" } }
      "ಹೂವಿನ ಹಾರ ಸುಂದರ.": "The flower garland is beautiful."
  "kn-1562":
    native: "bridegroom"
    notes:
      "n1": "The bridegroom, the man getting married; the same as ವರ (vara)."
    examples:
      "ಮದುಮಗ ಬಂದ.": "The bridegroom came."
      "ಮದುಮಗನ ಹಾರ ದೊಡ್ಡದು.": { native: "The bridegroom's garland is big.", bases: { "ಮದುಮಗನ": "of the bridegroom" } }
  "kn-1563":
    native: "bride"
    notes:
      "n1": "The bride, the woman getting married; the same as ವಧು (vadhu)."
    examples:
      "ಮದುಮಗಳು ಬಂದಳು.": "The bride came."
      "ಮದುಮಗಳ ಸೀರೆ ಸುಂದರ.": { native: "The bride's sari is beautiful.", bases: { "ಮದುಮಗಳ": "of the bride" } }
  "kn-1564":
    native: "wedding stage"
    notes:
      "n1": "A wedding stage, or a canopy where the rites are held."
    examples:
      "ಮಂಟಪ ಸುಂದರ.": "The stage is beautiful."
      "ಮಂಟಪದಲ್ಲಿ ವರ ಇದ್ದಾನೆ.": { native: "The groom is on the stage.", bases: { "ಮಂಟಪದಲ್ಲಿ": "on the stage", "ಇದ್ದಾನೆ": "is" } }
  "kn-1565":
    native: "wedding pendant"
    notes:
      "n1": "The wedding pendant, tied round the bride's neck."
    examples:
      "ತಾಳಿ ಕಟ್ಟು.": "Tie the pendant."
      "ತಾಳಿ ಚಿನ್ನ.": "The pendant is gold."
  "kn-1566":
    native: "sacred thread of marriage"
    notes:
      "n1": "The sacred thread of marriage, worn by a married woman."
    examples:
      "ಮಾಂಗಲ್ಯ ಸುಂದರ.": "The thread is beautiful."
      "ಮಾಂಗಲ್ಯ ಚಿನ್ನ.": "The thread is gold."
  "kn-1567":
    native: "blessing rice"
    notes:
      "n1": "Rice grains thrown on the couple as a blessing."
    examples:
      "ಅಕ್ಷತೆ ಕೊಡು.": "Give the blessing rice."
      "ಅಕ್ಕಿ ಅಕ್ಷತೆ ಆಯಿತು.": "The rice became blessing rice."
  "kn-1568":
    native: "pouring of water in marriage"
    notes:
      "n1": "The rite of pouring water on the bride's hands."
    examples:
      "ಧಾರೆ ಆಯಿತು.": "The pouring rite was done."
      "ಧಾರೆ ಬೇಕು.": "The pouring rite is needed."
  "kn-1569":
    native: "giving away of the bride"
    notes:
      "n1": "The giving away of the bride by her father."
    examples:
      "ಕನ್ಯಾದಾನ ಆಯಿತು.": "The giving away was done."
      "ಕನ್ಯಾದಾನ ಬೇಕು.": "The giving away is needed."
  "kn-1570":
    native: "blessing"
    notes:
      "n1": "A blessing, good wishes given by elders."
    examples:
      "ಆಶೀರ್ವಾದ ಬೇಕು.": "I need blessings."
      "ಹಿರಿಯರ ಆಶೀರ್ವಾದ ಇದೆ.": { native: "There are the blessings of the elders.", bases: { "ಹಿರಿಯರ": "of the elders", "ಇದೆ": "there are" } }
  "kn-1571":
    native: "elder"
    notes:
      "n1": "An elder, an older person to be respected."
    examples:
      "ಹಿರಿಯರು ಬಂದರು.": { native: "The elders came.", bases: { "ಹಿರಿಯರು": "the elders" } }
      "ಹಿರಿಯರಿಗೆ ನಮಸ್ಕಾರ.": { native: "Greetings to the elders.", bases: { "ಹಿರಿಯರಿಗೆ": "to the elders" } }
  "kn-1572":
    native: "ceremony, function"
    notes:
      "n1": "A ceremony or a function, such as a wedding."
    examples:
      "ಸಮಾರಂಭ ಇದೆ.": { native: "There is a ceremony.", bases: { "ಇದೆ": "there is" } }
      "ಮದುವೆ ಸಮಾರಂಭ ದೊಡ್ಡದು.": "The wedding ceremony is big."
  "kn-1573":
    native: "wedding reception"
    notes:
      "n1": "A reception after the wedding, where guests meet the couple."
    examples:
      "ಆರತಕ್ಷತೆ ಸಂಜೆ ಇದೆ.": { native: "The reception is in the evening.", bases: { "ಇದೆ": "is" } }
      "ಆರತಕ್ಷತೆಗೆ ಹೋಗು.": { native: "Go to the reception.", bases: { "ಆರತಕ್ಷತೆಗೆ": "to the reception" } }
