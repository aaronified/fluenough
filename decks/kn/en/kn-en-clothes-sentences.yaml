id: "kn-en-clothes-sentences"
kind: "layer"
core: "kn-clothes-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Clothes: sentences"
description: "Sentences about clothes: a shirt and a sari, slippers and a hat, and how to ask for or show them. They use the words of the clothes unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8181":
    native: "This is my shirt."
    notes:
      "n1": "ನನ್ನ (nanna) 'my' comes before the noun and stays the same form. ಇದು (idu) 'this' is used for things."
  "kn-8182":
    native: "Her sari is good."
    notes:
      "n1": "ಅವಳ (avaḷa) 'her' comes before the noun ಸೀರೆ (sīre) 'sari', as in the possessive form of ಅವಳು (avaḷu)."
  "kn-8183":
    native: "Give me slippers."
    notes:
      "n1": "ನನಗೆ (nanage) 'to me' comes before the thing asked for, and ಕೊಡಿ (koḍi) is the polite command 'give'."
    bases:
      "ನನಗೆ": "I, in the dative: to me"
      "ಕೊಡಿ": "to give, here as the polite command"
  "kn-8184":
    native: "Take off your shoes."
    notes:
      "n1": "ತೆಗೆ (tege) is the informal 'take off' used for shoes and clothes. The word 'your' is left out."
  "kn-8185":
    native: "Take off the hat."
    notes:
      "n1": "ತೆಗೆ (tege) is the informal 'take off', used for clothes and hats as well as shoes."
  "kn-8186":
    native: "Where are my glasses?"
  "kn-8187":
    native: "Show me the ring."
    notes:
      "n1": "ತೋರಿಸು (tōrisu) is the informal 'show'; to a stranger the polite form is ತೋರಿಸಿ (tōrisi)."
  "kn-8188":
    native: "How much is it?"
  "kn-8189":
    native: "Wash the socks."
    notes:
      "n1": "ತೊಳೆ (toḷe) is the informal 'wash'. The polite form is ತೊಳೆಯಿರಿ (toḷeyiri)."
  "kn-8190":
    native: "She washes the dupatta."
    notes:
      "n1": "ದುಪ್ಪಟ್ಟವನ್ನು (duppaṭṭavannu) marks the object with the ವನ್ನು (vannu) ending, and ತೊಳೆಯುತ್ತಾಳೆ (toḷeyuttāḷe) ends in ಆಳೆ (āḷe), the 'she' verb ending."
    bases:
      "ದುಪ್ಪಟ್ಟವನ್ನು": "a long scarf worn over the shoulders: the dupatta, here as the thing washed"
      "ತೊಳೆಯುತ್ತಾಳೆ": "to wash, here in the third-person feminine present"
