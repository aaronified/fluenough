schema: 1
id: "kn-en-grammar-comparison"
kind: "layer"
core: "kn-grammar-comparison"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Comparison: bigger than, very big"
license: "CC-BY-SA-4.0"
description: "Comparing two things: this is bigger than that, and the very biggest by saying very. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "Comparison"
  slot_name: "degree"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "dodda": "big"
    "chikka": "small"
    "dubari": "expensive"
    "agga": "cheap"
    "tampu": "cool"
    "bisi": "hot"
  notes: "To compare, say the thing compared with ಗಿಂತ (ginta) (than), as in ಇದು ಅದಕ್ಕಿಂತ ದೊಡ್ಡದು (idu adakkinta doḍḍadu), this is bigger than that. For the most, say ತುಂಬಾ (tumbā) (very) before the adjective: ತುಂಬಾ ದೊಡ್ಡ (tumbā doḍḍa), very big."
