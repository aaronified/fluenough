schema: 1
id: "kn-en-grammar-comparison"
kind: "layer"
core: "kn-grammar-comparison"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Comparison: bigger than, the biggest"
license: "CC-BY-SA-4.0"
description: "Comparing two things: this is bigger than that, and the biggest of all. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "Comparison"
  slot_name: "degree"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "dodda": "big"
    "chikka": "small"
    "dubari": "expensive"
    "agga": "cheap"
    "tampu": "cool"
    "bisi": "hot"
  notes: "To compare, put ಇದಕ್ಕಿಂತ (idakkinta, than this) before the adjective, as in ಇದಕ್ಕಿಂತ ದೊಡ್ಡದು (idakkinta doḍḍadu), bigger than this; with two things say ಇದು ಅದಕ್ಕಿಂತ ದೊಡ್ಡದು (idu adakkinta doḍḍadu), this is bigger than that. For the most, put ಎಲ್ಲಕ್ಕಿಂತ (ellakkinta, than all) before the adjective: ಎಲ್ಲಕ್ಕಿಂತ ದೊಡ್ಡ (ellakkinta doḍḍa), the biggest. ತುಂಬಾ (tumbā) only means very."
