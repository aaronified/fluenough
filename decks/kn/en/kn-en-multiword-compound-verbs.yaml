native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: compound verbs"
description: "Seventeen verb phrases of a participle and an auxiliary: do for oneself, make for someone, look after, buy, lose, fetch or write for someone, fall down, forget, run out, join up, eat up, leave behind, throw away, take along, bring and let go. Each was checked against an English or Kannada Wiktionary entry or a Wikipedia grammar page; the note says which and says where the auxiliary's shade comes from the course's own grammar deck instead. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "kn-6400":
    native: "to do for oneself"
    notes:
      "u1": "ಕೊಳ್ಳು (koḷḷu), to buy or take, is also an auxiliary: after another verb's participle it makes the reflexive, so the action is done for oneself. The English Wiktionary entry for ಕೊಳ್ಳು (koḷḷu) gives ಅವನು (avanu) ತಾನೇ (tānē) ಅಡುಗೆ (aḍuge) ಮಾಡಿಕೊಂಡನು (māḍikoṇḍanu), He cooked for himself. ಕೊಳ್ಳು (koḷḷu) changes its stem in the past: ಕೊಂಡ (koṇḍa)."
  "kn-6401":
    native: "to make for someone"
    notes:
      "u1": "ಕೊಡು (koḍu), to give, after a participle says the action is done for someone else. The English Wiktionary entry for ಮಾಡು (māḍu) gives ನನಗೆ (nanage) ಗೊಂಬೆಯನ್ನು (gombeyannu) ಮಾಡಿಕೊಟ್ಟನು (māḍikoṭṭanu), He made a doll for me, though it does not label ಕೊಡು (koḍu) an auxiliary. ಕೊಡು (koḍu) changes its stem in the past: ಕೊಟ್ಟ (koṭṭa)."
  "kn-6403":
    native: "to look after; to take care of"
    notes:
      "u1": "ನೋಡು (nōḍu), to look, with the auxiliary ಕೊಳ್ಳು (koḷḷu) means to look after something or manage it. The English Wiktionary entry for ನೋಡಿಕೊಳ್ಳು (nōḍikoḷḷu) gives ಅವನು (avanu) ತನ್ನ (tanna) ತಮ್ಮನನ್ನು (tammanannu) ಚೆನ್ನಾಗಿ (cennāgi) ನೋಡಿಕೊಳ್ಳುತ್ತಾನೆ (nōḍikoḷḷuttāne), He looks after his younger brother well, and ನೀವು (nīvu) ನಿಮ್ಮ (nimma) ಕೆಲಸವನ್ನು (kelasavannu) ಸರಿಯಾಗಿ (sariyāgi) ನೋಡಿಕೊಳ್ಳಿ (nōḍikoḷḷi), Please take care of your work properly."
  "kn-6404":
    native: "to buy; to purchase for oneself"
    notes:
      "u1": "ಕೊಳ್ಳು (koḷḷu) alone means to buy, and ಕೊಂಡು (koṇḍu) is its participle, so ಕೊಂಡುಕೊಳ್ಳು (koṇḍukoḷḷu) says the buying is for oneself. The Kannada Wiktionary entry for ಕೊಳ್ಳು (koḷḷu) gives ಆತ (āta) ಒಂದು (ondu) ಮನೆಯನ್ನು (maneyannu) ಕೊಂಡುಕೊಂಡ (koṇḍukoṇḍa), He bought a house. ಕೊಳ್ಳು (koḷḷu) changes its stem in the past: ಕೊಂಡ (koṇḍa)."
  "kn-6405":
    native: "to lose"
    notes:
      "u1": "ಕಳೆ (kaḷe), to get rid of, with the auxiliary ಕೊಳ್ಳು (koḷḷu) means to lose something that was one's own. The Kannada Wiktionary entry for ಕಳೆ (kaḷe) lists it under the sense lose, with an example containing ಎಲ್ಲವನ್ನೂ (ellavannū) ಕಳೆದುಕೊಂಡ (kaḷedukoṇḍa), he lost everything."
  "kn-6406":
    native: "to fetch for someone; to bring for someone"
    notes:
      "u1": "ತರು (taru), to bring, with ಕೊಡು (koḍu) means to bring something for someone. ತರು (taru) changes its stem: its participle is ತಂದು (tandu), with a nasal, as English Wikipedia's Kannada grammar lists for ತರು (taru) and ಬರು (baru). The course's grammar deck has ತಂದುಕೊಡಿ (tandukoḍi), please fetch it for me."
  "kn-6407":
    native: "to write out for someone"
    notes:
      "u1": "ಬರೆ (bare), to write, with ಕೊಡು (koḍu) means to write something out for another person. The English Wiktionary entry for ಬರೆ (bare) gives the verb to write; the course's grammar deck has ಬರೆದುಕೊಡಿ (baredukoḍi), please write it down for me."
  "kn-6408":
    native: "to fall down; to collapse"
    notes:
      "u1": "The English Wiktionary entry for ಹೋಗು (hōgu) says that after a participle it gives a completive aspect, for a change of state that is usually bad. ಬೀಳು (bīḷu) is to fall and to collapse in the same dictionary, so ಬಿದ್ದುಹೋಗು (bidduhōgu) is to fall down and stay down. ಬೀಳು (bīḷu) changes its stem in the past: ಬಿದ್ದ (bidda). The course's grammar deck has ಬಿದ್ದುಹೋದ (bidduhōda), he fell down."
  "kn-6409":
    native: "to forget; to forget completely"
    notes:
      "u1": "The Kannada Wiktionary entry for ಮರೆ (mare) lists ಮರೆತು (maretu) ಹೋದುದು (hōdudu) under the sense forget. ಹೋಗು (hōgu) after the participle makes it complete: the thing is gone from one's mind. ಮರೆ (mare) changes its stem in the past: ಮರೆತ (mareta). It may be written as one word or two."
  "kn-6410":
    native: "to be finished; to run out"
    notes:
      "u1": "ಆಗು (āgu), to become, also means to be finished in the English Wiktionary. With ಹೋಗು (hōgu) it says that something has run out. The Kannada Wiktionary entry for ಆಗು (āgu) has ಎಲ್ಲ (ella) ತಿನಿಸುಗಳೂ (tinisugaḷū) ಆಗಿಹೋಗಿದ್ದವು (āgihōgiddavu), all the snacks had run out."
    bases:
      "ಆಗಿ": "to happen; to become; to be finished"
  "kn-6411":
    native: "to join up; to get in with"
    notes:
      "u1": "ಬಿಡು (biḍu), to leave, after a participle often marks that the action is done and over. The English Wiktionary entry for ಸೇರು (sēru) gives ಅವನು (avanu) ಆ (ā) ಗುಂಪಿಗೆ (gumpige) ಸೇರಿಬಿಟ್ಟನು (sēribiṭṭanu), He joined that group, written as one word. That entry does not call ಬಿಡು (biḍu) an auxiliary; the shade of completion is the course's, from its grammar deck. ಬಿಡು (biḍu) changes its stem in the past: ಬಿಟ್ಟ (biṭṭa)."
  "kn-6412":
    native: "to eat up; to finish eating"
    notes:
      "u1": "ತಿನ್ನು (tinnu), to eat, with ಬಿಡು (biḍu) means to eat something up. ತಿನ್ನು (tinnu) changes its stem: its participle is ತಿಂದು (tindu). The shade of completion is the course's, from its grammar deck, which has ತಿಂದುಬಿಟ್ಟೆ (tindubiṭṭe), I have eaten it all up; no dictionary page read for this card labels ಬಿಡು (biḍu) an auxiliary."
  "kn-6413":
    native: "to leave behind; to go away from; to omit"
    notes:
      "u1": "ಬಿಟ್ಟು (biṭṭu) is the participle of ಬಿಡು (biḍu), to leave; with ಹೋಗು (hōgu) it means to leave something or someone behind. The Kannada Wiktionary entry for ಬಿಡು (biḍu) gives ಮನೆ (mane) ಬಿಟ್ಟು (biṭṭu) ಹೋದವನು (hōdavanu), one who left home, and lists ಬಿಟ್ಟು (biṭṭu) ಹೋಗು (hōgu) for to omit. ಬಿಡು (biḍu) changes its stem: ಬಿಟ್ಟು (biṭṭu)."
  "kn-6414":
    native: "to remove; to take out and throw away"
    notes:
      "u1": "ತೆಗೆ (tege), to take out, with ಹಾಕು (hāku), to put or throw, means to remove something for good. The Kannada Wiktionary entry for ತೆಗೆ (tege) gives ನಿಮ್ಮ (nimma) ಹೆಸರನ್ನು (hesarannu) ತೆಗೆದುಹಾಕಿದ್ದಾರೆ (tegeduhākiddāre), they have removed your name."
    bases:
      "ಹಾಕು": "to put; to throw; to put in"
  "kn-6415":
    native: "to take someone along"
    notes:
      "u1": "ಕರೆದುಕೊಂಡು (karedukoṇḍu) is ಕರೆ (kare), to call, with the participle of ಕೊಳ್ಳು (koḷḷu): having taken someone along. Then ಹೋಗು (hōgu) gives the direction, away from the speaker. The English Wiktionary entry for ಕೆಲಸ (kelasa) gives ಕೆಲಸದಿಂದ (kelasadinda) ಮನೆಗೆ (manege) ಬಂದಾಗ (bandāga) ನಿನ್ನನ್ನು (ninnannu) ಅಂಗಡಿಗೆ (aṅgaḍige) ಕರೆದುಕೊಂಡು (karedukoṇḍu) ಹೋಗುವೆನು (hōguvenu), When I come home from work, I will take you to the store."
  "kn-6416":
    native: "to bring"
    notes:
      "u1": "ತೆಗೆದುಕೊಂಡು (tegedukoṇḍu) is ತೆಗೆ (tege), to take, with the participle of ಕೊಳ್ಳು (koḷḷu): having taken it. Then ಬರು (baru) gives the direction, towards the speaker. The Kannada Wiktionary entry for ತರು (taru) lists ತೆಗೆದುಕೊಂಡು (tegedukoṇḍu) ಬಾ (bā) as another way to say bring; ಬಾ (bā) is the command form of ಬರು (baru), which changes its stem in the past: ಬಂದ (banda)."
    bases:
      "ಬರು": "to come"
  "kn-6417":
    native: "to let someone go"
    notes:
      "u1": "ಬಿಡು (biḍu), to leave, also means to let or allow when it follows an infinitive in ಲು (lu). The Kannada Wiktionary entry for ಬಿಡು (biḍu) gives ಅವನು (avanu) ನನ್ನನ್ನು (nannannu) ಹೋಗಲು (hōgalu) ಬಿಡುವದಿಲ್ಲ (biḍuvadilla), He will not let me go; it spells the end ಬಿಡುವದಿಲ್ಲ (biḍuvadilla), and the usual modern spelling is ಬಿಡುವುದಿಲ್ಲ (biḍuvudilla)."
