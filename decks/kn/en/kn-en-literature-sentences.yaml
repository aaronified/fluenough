cards:
  "kn-7906":
    native: "I read a novel."
  "kn-7907":
    notes:
      "n1": "ಕವನ (kavana) is one poem; ಕಾವ್ಯ (kāvya) is poetry as a whole or a longer literary work."
    native: "The poet writes a poem."
  "kn-7908":
    notes:
      "n1": "ಲೇಖಕಿ (lēkhaki) is a woman writer; a man is ಲೇಖಕ (lēkhaka)."
    native: "She is a writer."
  "kn-7909":
    notes:
      "n1": "ಪ್ರಸಿದ್ಧ (prasiddha) is used as a predicate without a verb, so the sentence means 'the novel is famous'."
    native: "The novel is famous."
  "kn-7910":
    native: "Readers like humour."
  "kn-7911":
    notes:
      "n1": "ಮೆಚ್ಚು (meccu) means to admire or appreciate, used for works such as poems."
    native: "I like the poem."
  "kn-7912":
    notes:
      "n1": "ಓದು (ōdu) is the informal command; the polite form is ಓದಿ (ōdi)."
    native: "Read the book."
  "kn-7913":
    native: "Read the translation."
  "kn-7914":
    notes:
      "n1": "ಪ್ರತಿ (prati), every, goes before the noun and does not change it."
    native: "I read every chapter."
  "kn-7915":
    notes:
      "n1": "The ending -ಗ (-ga) makes ಓದುಗ (ōduga), reader, from ಓದು (ōdu), read."
    native: "The reader reads poetry."
