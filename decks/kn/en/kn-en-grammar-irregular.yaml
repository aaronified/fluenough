  entries:
    "baru": "to come"
    "hoogu": "to go"
    "tinnu": "to eat"
    "kodu": "to give"
    "tegedukollu": "to take"
    "idu": "to put; to keep"
  notes: "These change their stem in the past: ಬರು (to come) gives ಬಂದೆ (bande), but ಬರುತ್ತೇನೆ (baruttēne) and ಬನ್ನಿ (banni); ಕೊಡು (to give) gives ಕೊಟ್ಟೆ (koṭṭe). Where two forms are given, the second is everyday speech."
