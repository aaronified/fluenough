schema: 1
id: "kn-en-family"
kind: "layer"
core: "kn-family"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Family"
license: "CC0-1.0"
description: "Parents, brothers and sisters, grandparents, and the aunts and uncles on each side, each with its own word. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0207":
    native: "parents"
    notes:
      "n1": "ತಂದೆ (tande) and ತಾಯಿ (tāyi) are the formal words for father and mother. In speech, ಅಪ್ಪ ಅಮ್ಮ (appa amma)."
  "kn-0059":
    notes:
      "n1": "The formal word is ತಂದೆ (tande)."
  "kn-0058":
    notes:
      "n1": "The formal word is ತಾಯಿ (tāyi)."
  "kn-0208":
    native: "brothers"
    notes:
      "n1": "Kannada has no everyday word for a brother or a sister, only elder and younger: ಅಣ್ಣ (aṇṇa), ತಮ್ಮ (tamma). Brothers together are ಅಣ್ಣತಮ್ಮಂದಿರು (aṇṇatammandiru); sisters, ಅಕ್ಕತಂಗಿಯರು (akkataṅgiyaru). The formal words are ಸಹೋದರ (sahōdara) and ಸಹೋದರಿ (sahōdari)."
  "kn-0209":
    native: "daughter"
  "kn-0210":
    native: "husband"
    notes:
      "n1": "Politely, ಯಜಮಾನರು (yajamānaru), 'the master of the house', is still heard from older women."
  "kn-0211":
    native: "wife"
  "kn-0212":
    native: "children"
    notes:
      "n1": "One child is ಮಗು (magu)."
  "kn-0213":
    native: "grandfather"
    notes:
      "n1": "Also ತಾತ (tāta). Unlike Hindi and Bengali, one word serves for both sides of the family."
  "kn-0194":
    native: "grandmother"
    notes:
      "n1": "One word for both sides of the family."
  "kn-0214":
    native: "uncle (father's younger brother)"
    notes:
      "n1": "Literally 'small father'. His wife is ಚಿಕ್ಕಮ್ಮ (cikkamma)."
  "kn-0215":
    native: "uncle (father's elder brother)"
    notes:
      "n1": "Literally 'big father'. His wife is ದೊಡ್ಡಮ್ಮ (doḍḍamma)."
  "kn-0216":
    native: "uncle (mother's brother); father-in-law"
    notes:
      "n1": "One word for both: in the old south Indian custom of marrying a cousin, a mother's brother could become one's father-in-law."
  "kn-0217":
    native: "aunt (father's sister); mother-in-law"
    notes:
      "n1": "Like ಮಾವ (māva), one word for both."
  "kn-0218":
    native: "aunt (mother's younger sister)"
    notes:
      "n1": "Also the wife of a father's younger brother."
  "kn-0219":
    native: "aunt (mother's elder sister)"
    notes:
      "n1": "Also the wife of a father's elder brother."
  "kn-0220":
    native: "relatives"
    notes:
      "n1": "In speech also ನೆಂಟರು (neṇṭaru)."
  "kn-0221":
    native: "I have two younger brothers."
    notes:
      "n1": "'To me two younger brothers are'. People are counted with words of their own: ಒಬ್ಬರು (obbaru), ಇಬ್ಬರು (ibbaru), ಮೂವರು (obbaru, ibbaru, muvaru), one, two, three people."
    bases:
      "ನನಗೆ": "I"
      "ಇಬ್ಬರು": "two (people)"
      "ಇದ್ದಾರೆ": "to be; to have; to live"
  "kn-0222":
    native: "Do you have any brothers?"
    bases:
      "ಇದ್ದಾರಾ": "to be; to have; to live"
  "kn-0223":
    native: "I'm married."
    notes:
      "n1": "Literally 'to me a wedding has happened'. Not married: ನನಗೆ ಇನ್ನೂ ಮದುವೆ ಆಗಿಲ್ಲ (nanage innū maduve āgilla)."
    bases:
      "ನನಗೆ": "I"
      "ಮದುವೆ": "marriage"
      "ಆಗಿದೆ": "to become; to happen; to be possible"
