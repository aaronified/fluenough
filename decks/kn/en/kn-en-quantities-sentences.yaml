id: "kn-en-quantities-sentences"
kind: "layer"
core: "kn-quantities-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How much and how many: sentences"
description: "Sentences about amounts: a dozen, per kilo, a little, all, plenty, several and some. They unlock once their words are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8330":
    notes:
      "n1": "ಡಜನ್ (ḍajan), a dozen, takes no number before it, as in the unit's example ಡಜನ್ ಬಾಳೆಹಣ್ಣು (ḍajan bāḷehaṇṇu), a dozen bananas."
    native: "Give a dozen eggs."
  "kn-8331":
    notes:
      "n1": "ಪ್ರತಿ (prati), per, goes before the measure word, ಪ್ರತಿ ಕಿಲೋ (prati kilō), per kilo, and ಎಷ್ಟು (eṣṭu), how much, comes last in the question."
    native: "How much per kilo?"
  "kn-8332":
    native: "How much per litre?"
  "kn-8333":
    notes:
      "n1": "ಸ್ವಲ್ಪ (svalpa), a little, goes before the noun it measures, with no number, as in the market card ಸ್ವಲ್ಪ ಕಡಿಮೆ ಮಾಡಿ (svalpa kaḍime māḍi), reduce a little."
    native: "Give a little tea."
  "kn-8334":
    notes:
      "n1": "ಸ್ವಲ್ಪ (svalpa), a little, can also go before a verb: ಸ್ವಲ್ಪ ತಿನ್ನು (svalpa tinnu), eat a little."
    native: "Eat a little."
  "kn-8335":
    notes:
      "n1": "ತುಂಬಾ (tumbā), very, goes before ಜಾಸ್ತಿ (jāsti), more or too much, as in the market card ತುಂಬಾ ಜಾಸ್ತಿ (tumbā jāsti)."
    native: "The price is very high."
  "kn-8336":
    notes:
      "n1": "ಎಲ್ಲಾ (ellā), all, goes before the noun with no number, as in ಎಲ್ಲಾ ಹಣ್ಣು (ellā haṇṇu), all fruit."
    native: "I eat all the fruit."
  "kn-8337":
    notes:
      "n1": "ಭರಪೂರ (bharapūra), plenty of, goes before the noun, as in ಭರಪೂರ ಹಣ್ಣು (bharapūra haṇṇu), plenty of fruit."
    native: "I eat plenty of mangoes."
  "kn-8338":
    notes:
      "n1": "ಹಲವು (halavu), several, goes before the noun the way ಕೆಲವು (kelavu), some, does."
    native: "I eat several oranges."
  "kn-8339":
    notes:
      "n1": "ತಿನ್ನುತ್ತಾರೆ (tinnuttāre), they eat, is the plural form, because ಮಕ್ಕಳು (makkaḷu), children, are more than one."
    native: "Some children eat."
