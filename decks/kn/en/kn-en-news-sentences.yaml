cards:
  "kn-7477":
    native: "There is news today."
    bases:
      "ಇದೆ": "is"
  "kn-7478":
    notes:
      "n1": "The ending ಯಲ್ಲಿ (yalli) means in or at, as in ಪತ್ರಿಕೆಯಲ್ಲಿ (patrikeyalli), in the newspaper."
    native: "There is an article in the newspaper."
    bases:
      "ಪತ್ರಿಕೆಯಲ್ಲಿ": "in the newspaper"
      "ಇದೆ": "is"
  "kn-7479":
    native: "I listen to the news on the radio."
    bases:
      "ರೇಡಿಯೋದಲ್ಲಿ": "on the radio"
      "ಕೇಳುತ್ತೇನೆ": "to listen (I)"
  "kn-7480":
    notes:
      "n1": "ಆಗು (āgu), to happen, takes an event as its subject: ಅಪಘಾತ (apaghāta) ಆಗಿದೆ (āgide), there has been an accident."
    native: "There has been an accident."
    bases:
      "ಆಗಿದೆ": "to happen (it has)"
  "kn-7481":
    native: "There is an election."
    bases:
      "ಇದೆ": "is"
  "kn-7482":
    notes:
      "n1": "ಮತ (mata), vote, with ಹಾಕು (hāku), to put, means to cast a vote."
    native: "I will cast my vote."
    bases:
      "ಹಾಕುತ್ತೇನೆ": "to cast, put in (I)"
  "kn-7483":
    notes:
      "n1": "ಅವನ (avana), his, is the of-form of ಅವನು (avanu), he."
    native: "His victory is good."
  "kn-7484":
    notes:
      "n1": "ಆಯಿತು (āyitu), the past of ಆಗು (āgu), happened: ಭೂಕಂಪ (bhūkampa) ಆಯಿತು (āyitu), there was an earthquake."
    native: "There was an earthquake."
