schema: 1
id: "kn-en-verbs"
kind: "layer"
core: "kn-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Everyday verbs"
license: "CC-BY-SA-4.0"
description: "The verbs of the day: doing, going, coming, eating, reading, speaking and buying. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-0630":
    native: "to do; to make"
    notes:
      "n1": "ಊಟ ಮಾಡು (ūṭa māḍu), to have a meal: many verbs are a noun and ಮಾಡು (māḍu)."
    examples:
      "ನಾನು ಕೆಲಸ ಮಾಡುತ್ತೇನೆ.": { native: "I work.", bases: { "ಕೆಲಸ": "work", "ಮಾಡುತ್ತೇನೆ": "to do" } }
      "ಅವನು ಊಟ ಮಾಡಿದನು.": { native: "He had his meal.", bases: { "ಊಟ": "meal", "ಮಾಡಿದನು": "to do" } }
  "kn-0631":
    native: "to go"
    notes:
      "n1": "The past stem is ಹೋದ (hōda), gone: ಅವಳು ಹೋದಳು (avaḷu hōdaḷu), she went."
    examples:
      "ಅವಳು ಶಾಲೆಗೆ ಹೋಗುತ್ತಾಳೆ.": { native: "She goes to school.", bases: { "ಶಾಲೆಗೆ": "to school", "ಹೋಗುತ್ತಾಳೆ": "to go" } }
      "ನಾವು ನಾಳೆ ಊರಿಗೆ ಹೋಗುತ್ತೇವೆ.": { native: "We will go to town tomorrow.", bases: { "ಊರಿಗೆ": "to the town", "ಹೋಗುತ್ತೇವೆ": "to go" } }
  "kn-0632":
    native: "to come"
    notes:
      "n1": "The past is ಬಂದ (banda), came: ಅವನು ಬಂದ (avanu banda), he came."
    examples:
      "ಇಲ್ಲಿ ಬಾ.": "Come here."
      "ಅವರು ಸಂಜೆ ಬಂದರು.": { native: "They came in the evening.", bases: { "ಸಂಜೆ": "evening", "ಬಂದರು": "to come" } }
  "kn-0633":
    native: "to take out; to remove"
    notes:
      "n1": "To take money out: ಹಣ ತೆಗೆ (haṇa tege), take out money."
    examples:
      "ಪುಸ್ತಕ ತೆಗೆ.": { native: "Take out the book.", bases: { "ಪುಸ್ತಕ": "book" } }
      "ಅವಳು ಹಣ ತೆಗೆದಳು.": { native: "She took out money.", bases: { "ಹಣ": "money", "ತೆಗೆದಳು": "to take out" } }
  "kn-0634":
    native: "to drink"
    notes:
      "n1": "A drink is ಪಾನೀಯ (pānīya); the verb takes its object before it."
    examples:
      "ನಾನು ಕಾಫಿ ಕುಡಿಯುತ್ತೇನೆ.": { native: "I drink coffee.", bases: { "ಕಾಫಿ": "coffee", "ಕುಡಿಯುತ್ತೇನೆ": "to drink" } }
      "ಮಕ್ಕಳು ಹಾಲು ಕುಡಿಯುತ್ತಾರೆ.": { native: "Children drink milk.", bases: { "ಮಕ್ಕಳು": "children", "ಹಾಲು": "milk", "ಕುಡಿಯುತ್ತಾರೆ": "to drink" } }
  "kn-0635":
    native: "to eat"
    notes:
      "n1": "For eating food the verb is ತಿನ್ನು (tinnu); for a meal, say ಊಟ ಮಾಡು (ūṭa māḍu)."
    examples:
      "ಅವನು ಅನ್ನ ತಿನ್ನುತ್ತಾನೆ.": { native: "He eats rice.", bases: { "ಅನ್ನ": "rice", "ತಿನ್ನುತ್ತಾನೆ": "to eat" } }
      "ಮಗು ಹಣ್ಣು ತಿನ್ನುತ್ತದೆ.": { native: "The child eats fruit.", bases: { "ಮಗು": "child", "ಹಣ್ಣು": "fruit", "ತಿನ್ನುತ್ತದೆ": "to eat" } }
  "kn-0636":
    native: "to see; to look; to watch"
    notes:
      "n1": "To watch TV: ಟಿವಿ ನೋಡು (ṭivi nōḍu)."
    examples:
      "ನಾನು ಟಿವಿ ನೋಡುತ್ತೇನೆ.": { native: "I watch TV.", bases: { "ಟಿವಿ": "TV", "ನೋಡುತ್ತೇನೆ": "to see" } }
      "ನೋಡು, ಅದು ಚಂದ್ರ.": { native: "Look, that is the moon.", bases: { "ಚಂದ್ರ": "moon" } }
  "kn-0637":
    native: "to hear; to listen; to ask"
    notes:
      "n1": "To ask a question: ಪ್ರಶ್ನೆ ಕೇಳು (praśne kēḷu), ask a question."
    examples:
      "ಅವರು ಸಂಗೀತ ಕೇಳುತ್ತಾರೆ.": { native: "They listen to music.", bases: { "ಸಂಗೀತ": "music", "ಕೇಳುತ್ತಾರೆ": "to listen" } }
      "ನನ್ನ ಪ್ರಶ್ನೆ ಕೇಳು.": { native: "Ask my question.", bases: { "ನನ್ನ": "my", "ಪ್ರಶ್ನೆ": "question" } }
  "kn-0638":
    native: "to read"
    notes:
      "n1": "To read a newspaper: ಪತ್ರಿಕೆ ಓದು (patrike ōdu)."
    examples:
      "ನಾನು ಪತ್ರಿಕೆ ಓದುತ್ತೇನೆ.": { native: "I read a newspaper.", bases: { "ಪತ್ರಿಕೆ": "newspaper", "ಓದುತ್ತೇನೆ": "to read" } }
      "ಮಕ್ಕಳು ಚೆನ್ನಾಗಿ ಓದುತ್ತಾರೆ.": { native: "Children read well.", bases: { "ಮಕ್ಕಳು": "children", "ಚೆನ್ನಾಗಿ": "well", "ಓದುತ್ತಾರೆ": "to read" } }
  "kn-0639":
    native: "to write"
    notes:
      "n1": "To write a letter: ಪತ್ರ ಬರೆ (patra bare)."
    examples:
      "ಅವನು ಪತ್ರ ಬರೆಯುತ್ತಾನೆ.": { native: "He writes a letter.", bases: { "ಪತ್ರ": "letter", "ಬರೆಯುತ್ತಾನೆ": "to write" } }
      "ನಿನ್ನ ಹೆಸರು ಬರೆ.": { native: "Write your name.", bases: { "ಹೆಸರು": "name" } }
  "kn-0640":
    native: "to learn"
    notes:
      "n1": "To learn a language: ಇಂಗ್ಲಿಷ್ ಕಲಿ (iṅgliṣ kali), learn English."
    examples:
      "ನಾನು ಇಂಗ್ಲಿಷ್ ಕಲಿಯುತ್ತೇನೆ.": { native: "I learn English.", bases: { "ಇಂಗ್ಲಿಷ್": "English", "ಕಲಿಯುತ್ತೇನೆ": "to learn" } }
      "ಮಕ್ಕಳು ಶಾಲೆಯಲ್ಲಿ ಕಲಿಯುತ್ತಾರೆ.": { native: "Children learn at school.", bases: { "ಮಕ್ಕಳು": "children", "ಶಾಲೆಯಲ್ಲಿ": "at school", "ಕಲಿಯುತ್ತಾರೆ": "to learn" } }
  "kn-0641":
    native: "to teach"
    notes:
      "n1": "It is the causative of ಕಲಿ (kali), to learn: it means to teach."
    examples:
      "ಅವಳು ಶಾಲೆಯಲ್ಲಿ ಕಲಿಸುತ್ತಾಳೆ.": { native: "She teaches at school.", bases: { "ಶಾಲೆಯಲ್ಲಿ": "at school", "ಕಲಿಸುತ್ತಾಳೆ": "to teach" } }
      "ಅವರು ನನಗೆ ಕನ್ನಡ ಕಲಿಸುತ್ತಾರೆ.": { native: "They teach me Kannada.", bases: { "ನನಗೆ": "to me", "ಕನ್ನಡ": "Kannada", "ಕಲಿಸುತ್ತಾರೆ": "to teach" } }
  "kn-0642":
    native: "to say; to tell"
    notes:
      "n1": "To tell the truth: ಸತ್ಯ ಹೇಳು (satya hēḷu)."
    examples:
      "ಅವನು ಸತ್ಯ ಹೇಳುತ್ತಾನೆ.": { native: "He tells the truth.", bases: { "ಸತ್ಯ": "truth", "ಹೇಳುತ್ತಾನೆ": "to say" } }
      "ದಯವಿಟ್ಟು ನಿಧಾನವಾಗಿ ಹೇಳು.": { native: "Please say it slowly.", bases: { "ದಯವಿಟ್ಟು": "please", "ನಿಧಾನವಾಗಿ": "slowly", "ಹೇಳು": "to say" } }
  "kn-0643":
    native: "to walk"
    notes:
      "n1": "To walk in the morning: ಬೆಳಿಗ್ಗೆ ನಡೆ (beḷigge naḍe)."
    examples:
      "ನಾನು ಬೆಳಿಗ್ಗೆ ನಡೆಯುತ್ತೇನೆ.": { native: "I walk in the morning.", bases: { "ಬೆಳಿಗ್ಗೆ": "in the morning", "ನಡೆಯುತ್ತೇನೆ": "to walk" } }
      "ಅವರು ನಿಧಾನವಾಗಿ ನಡೆಯುತ್ತಾರೆ.": { native: "They walk slowly.", bases: { "ನಿಧಾನವಾಗಿ": "slowly", "ನಡೆಯುತ್ತಾರೆ": "to walk" } }
  "kn-0644":
    native: "to run"
    notes:
      "n1": "A verb of motion, as in ಬೇಗ ಓಡು (bēga ōḍu), run fast."
    examples:
      "ಮಕ್ಕಳು ಓಡುತ್ತಾರೆ.": { native: "The children run.", bases: { "ಮಕ್ಕಳು": "children", "ಓಡುತ್ತಾರೆ": "to run" } }
      "ನಾನು ಬೇಗ ಓಡುತ್ತೇನೆ.": { native: "I run fast.", bases: { "ಬೇಗ": "fast", "ಓಡುತ್ತೇನೆ": "to run" } }
  "kn-0645":
    native: "to play"
    notes:
      "n1": "To play a game: ಆಟ ಆಡು (āṭa āḍu), play a game."
    examples:
      "ಮಕ್ಕಳು ಆಟ ಆಡುತ್ತಾರೆ.": { native: "The children play a game.", bases: { "ಮಕ್ಕಳು": "children", "ಆಟ": "game", "ಆಡುತ್ತಾರೆ": "to play" } }
      "ಅವನು ಕ್ರಿಕೆಟ್ ಆಡುತ್ತಾನೆ.": { native: "He plays cricket.", bases: { "ಕ್ರಿಕೆಟ್": "cricket", "ಆಡುತ್ತಾನೆ": "to play" } }
  "kn-0646":
    native: "to sing"
    notes:
      "n1": "The same spelling is also the word for a song: keep the sense of the sentence in mind."
    examples:
      "ಅವಳು ಚೆನ್ನಾಗಿ ಹಾಡುತ್ತಾಳೆ.": { native: "She sings well.", bases: { "ಚೆನ್ನಾಗಿ": "well", "ಹಾಡುತ್ತಾಳೆ": "to sing" } }
      "ನಾವು ಸಂಜೆ ಹಾಡುತ್ತೇವೆ.": { native: "We sing in the evening.", bases: { "ಸಂಜೆ": "evening", "ಹಾಡುತ್ತೇವೆ": "to sing" } }
  "kn-0647":
    native: "to wash"
    notes:
      "n1": "To wash clothes: ಬಟ್ಟೆ ತೊಳೆ (baṭṭe toḷe), wash clothes."
    examples:
      "ಅವಳು ಬಟ್ಟೆ ತೊಳೆಯುತ್ತಾಳೆ.": { native: "She washes clothes.", bases: { "ಬಟ್ಟೆ": "cloth; clothes", "ತೊಳೆಯುತ್ತಾಳೆ": "to wash" } }
      "ಕೈ ತೊಳೆ.": { native: "Wash your hands.", bases: { "ಕೈ": "hand" } }
  "kn-0648":
    native: "to cook"
    notes:
      "n1": "To cook rice: ಅನ್ನ ಬೇಯಿಸು (anna bēyisu)."
    examples:
      "ಅವಳು ಅನ್ನ ಬೇಯಿಸುತ್ತಾಳೆ.": { native: "She cooks rice.", bases: { "ಅನ್ನ": "rice", "ಬೇಯಿಸುತ್ತಾಳೆ": "to cook" } }
      "ನಾನು ಸಾರು ಬೇಯಿಸುತ್ತೇನೆ.": { native: "I cook a curry.", bases: { "ಸಾರು": "curry", "ಬೇಯಿಸುತ್ತೇನೆ": "to cook" } }
  "kn-0649":
    native: "to understand; to know"
    notes:
      "n1": "The past is ತಿಳಿದೆ (tiḷide), I knew."
    examples:
      "ನನಗೆ ಅರ್ಥವಾಯಿತು.": { native: "I understood.", bases: { "ನನಗೆ": "to me", "ಅರ್ಥವಾಯಿತು": "to be understood" } }
      "ನೀನು ತಿಳಿದೆಯಾ?": { native: "Do you understand?", bases: { "ತಿಳಿದೆಯಾ": "to understand" } }
  "kn-0650":
    native: "to like"
    notes:
      "n1": "To like something: ಸಂಗೀತ ಇಷ್ಟಪಡು (saṅgīta iṣṭapaḍu), to like music."
    examples:
      "ಅವನು ಸಂಗೀತ ಇಷ್ಟಪಡುತ್ತಾನೆ.": { native: "He likes music.", bases: { "ಸಂಗೀತ": "music", "ಇಷ್ಟಪಡುತ್ತಾನೆ": "to like" } }
      "ನಾನು ಈ ಊರು ಇಷ್ಟಪಡುತ್ತೇನೆ.": { native: "I like this town.", bases: { "ಈ": "this", "ಊರು": "town", "ಇಷ್ಟಪಡುತ್ತೇನೆ": "to like" } }
  "kn-0651":
    native: "to sit"
    notes:
      "n1": "Sit here: ಇಲ್ಲಿ ಕೂರು (illi kūru)."
    examples:
      "ಇಲ್ಲಿ ಕೂರು.": "Sit here."
      "ಅವರು ಕುರ್ಚಿಯಲ್ಲಿ ಕೂರುತ್ತಾರೆ.": { native: "They sit on a chair.", bases: { "ಕುರ್ಚಿಯಲ್ಲಿ": "on a chair", "ಕೂರುತ್ತಾರೆ": "to sit" } }
  "kn-0652":
    native: "to stand; to stop"
    notes:
      "n1": "A bus stops: ಬಸ್ ನಿಲ್ಲು (bas nillu), the bus stops."
    examples:
      "ಬಸ್ ಇಲ್ಲಿ ನಿಲ್ಲುತ್ತದೆ.": { native: "The bus stops here.", bases: { "ಬಸ್": "bus", "ನಿಲ್ಲುತ್ತದೆ": "to stop" } }
      "ಇಲ್ಲಿ ನಿಲ್ಲು.": "Stand here."
  "kn-0653":
    native: "to show"
    notes:
      "n1": "To show the way: ದಾರಿ ತೋರಿಸು (dāri tōrisu)."
    examples:
      "ಅವನು ನನಗೆ ದಾರಿ ತೋರಿಸುತ್ತಾನೆ.": { native: "He shows me the way.", bases: { "ನನಗೆ": "to me", "ದಾರಿ": "way", "ತೋರಿಸುತ್ತಾನೆ": "to show" } }
      "ನನಗೆ ನಿಮ್ಮ ಪುಸ್ತಕ ತೋರಿಸು.": { native: "Show me your book.", bases: { "ನನಗೆ": "to me", "ನಿಮ್ಮ": "your", "ಪುಸ್ತಕ": "book", "ತೋರಿಸು": "to show" } }
  "kn-0654":
    native: "to call"
    notes:
      "n1": "To call someone: ಯಾರನ್ನಾದರೂ ಕರೆ (yārannādarū kare), call someone."
    examples:
      "ಅವಳು ನನ್ನನ್ನು ಕರೆದಳು.": { native: "She called me.", bases: { "ನನ್ನನ್ನು": "me", "ಕರೆದಳು": "to call" } }
      "ಅಮ್ಮ ಮಗುವನ್ನು ಕರೆಯುತ್ತಾಳೆ.": { native: "Mother calls the child.", bases: { "ಅಮ್ಮ": "mother", "ಮಗುವನ್ನು": "the child", "ಕರೆಯುತ್ತಾಳೆ": "to call" } }
  "kn-0655":
    native: "to buy"
    notes:
      "n1": "To buy a car: ಕಾರು ಖರೀದಿಸು (kāru kharīdisu)."
    examples:
      "ನಾನು ಹೊಸ ಕಾರು ಖರೀದಿಸಿದೆ.": { native: "I bought a new car.", bases: { "ಹೊಸ": "new", "ಕಾರು": "car", "ಖರೀದಿಸಿದೆ": "to buy" } }
      "ಅವರು ಹಣ್ಣು ಖರೀದಿಸುತ್ತಾರೆ.": { native: "They buy fruit.", bases: { "ಹಣ್ಣು": "fruit", "ಖರೀದಿಸುತ್ತಾರೆ": "to buy" } }
  "kn-0656":
    native: "to sell"
    notes:
      "n1": "The opposite is ಖರೀದಿಸು (kharīdisu), to buy."
    examples:
      "ಅವನು ತರಕಾರಿ ಮಾರುತ್ತಾನೆ.": { native: "He sells vegetables.", bases: { "ತರಕಾರಿ": "vegetables", "ಮಾರುತ್ತಾನೆ": "to sell" } }
      "ಅವಳು ಹಾಲು ಮಾರುತ್ತಾಳೆ.": { native: "She sells milk.", bases: { "ಹಾಲು": "milk", "ಮಾರುತ್ತಾಳೆ": "to sell" } }
