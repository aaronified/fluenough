schema: 1
id: "kn-en-environment"
kind: "layer"
core: "kn-environment"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Environment: air, pollution, waste and care"
license: "CC-BY-SA-4.0"
description: "Caring for the environment: the air and the smoke, pollution and waste, plastic and recycling, saving water and power. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1472":
    native: "environment"
    notes:
      "n1": "The environment, the air, water, land and living things around us."
    examples:
      "ಪರಿಸರ ಸ್ವಚ್ಛ ಬೇಕು.": "A clean environment is needed."
      "ಪರಿಸರವನ್ನು ಕಾಪಾಡು.": { native: "Protect the environment.", bases: { "ಪರಿಸರವನ್ನು": "the environment" } }
  "kn-1473":
    native: "pollution"
    notes:
      "n1": "Pollution, dirt in the air, water or land."
    examples:
      "ಮಾಲಿನ್ಯ ಹೆಚ್ಚು ಆಯಿತು.": "Pollution went up."
      "ಮಾಲಿನ್ಯ ಕಡಿಮೆ ಮಾಡು.": "Reduce pollution."
  "kn-1474":
    native: "smoke"
    notes:
      "n1": "Smoke, from a fire or a vehicle."
    examples:
      "ಹೊಗೆ ಇದೆ.": { native: "There is smoke.", bases: { "ಇದೆ": "there is" } }
      "ಹೊಗೆ ಬೇಡ.": "No smoke."
  "kn-1475":
    native: "poison"
    notes:
      "n1": "Poison, harmful to living things."
    examples:
      "ವಿಷ ಇದೆ.": { native: "There is poison.", bases: { "ಇದೆ": "there is" } }
      "ನೀರಿನಲ್ಲಿ ವಿಷ ಬೇಡ.": "No poison in the water."
  "kn-1476":
    native: "waste"
    notes:
      "n1": "Waste, things thrown away after use."
    examples:
      "ತ್ಯಾಜ್ಯ ಹೆಚ್ಚು.": "There is a lot of waste."
      "ತ್ಯಾಜ್ಯ ಬುಟ್ಟಿಗೆ ಹಾಕು.": { native: "Put the waste in the bin.", bases: { "ಹಾಕು": "put" } }
  "kn-1477":
    native: "plastic"
    notes:
      "n1": "Plastic, which does not break down easily."
    examples:
      "ಪ್ಲಾಸ್ಟಿಕ್ ಬೇಡ.": "No plastic."
      "ಪ್ಲಾಸ್ಟಿಕ್ ಚೀಲ ಕೊಡಬೇಡ.": "Do not give plastic bags."
  "kn-1478":
    native: "recycling"
    notes:
      "n1": "Recycling, using old things again."
    examples:
      "ಮರುಬಳಕೆ ಮಾಡು.": "Recycle."
      "ಪ್ಲಾಸ್ಟಿಕ್ ಮರುಬಳಕೆ ಒಳ್ಳೆಯದು.": "Recycling plastic is good."
  "kn-1479":
    native: "to save"
    notes:
      "n1": "To save something, such as water, power or money."
    examples:
      "ನೀರು ಉಳಿಸು.": "Save water."
      "ಅವನು ವಿದ್ಯುತ್ ಉಳಿಸುತ್ತಾನೆ.": { native: "He saves electricity.", bases: { "ಉಳಿಸುತ್ತಾನೆ": "saves" } }
  "kn-1480":
    native: "to protect, to preserve"
    notes:
      "n1": "To protect or preserve something from harm."
    examples:
      "ಪರಿಸರವನ್ನು ಕಾಪಾಡು.": { native: "Protect the environment.", bases: { "ಪರಿಸರವನ್ನು": "the environment" } }
      "ಅವರು ಕಾಡನ್ನು ಕಾಪಾಡುತ್ತಾರೆ.": { native: "They protect the forest.", bases: { "ಕಾಪಾಡುತ್ತಾರೆ": "protect" } }
  "kn-1481":
    native: "electricity"
    notes:
      "n1": "Electricity, the power that lights our homes."
    examples:
      "ವಿದ್ಯುತ್ ಇಲ್ಲ.": "There is no electricity."
      "ವಿದ್ಯುತ್ ಉಳಿಸು.": "Save electricity."
  "kn-1482":
    native: "fuel"
    notes:
      "n1": "Fuel, such as petrol, used to run a vehicle."
    examples:
      "ಇಂಧನ ಬೇಕು.": "Fuel is needed."
      "ಇಂಧನ ತುಂಬಾ ಇದೆ.": { native: "There is a lot of fuel.", bases: { "ಇದೆ": "there is" } }
  "kn-1483":
    native: "solar power"
    notes:
      "n1": "Solar power, energy from the sun."
    examples:
      "ಸೌರಶಕ್ತಿ ಒಳ್ಳೆಯದು.": "Solar power is good."
      "ಸೌರಶಕ್ತಿ ಬಳಸು.": "Use solar power."
  "kn-1484":
    native: "cleanliness"
    notes:
      "n1": "Cleanliness, keeping things clean."
    examples:
      "ಸ್ವಚ್ಛತೆ ಬೇಕು.": "Cleanliness is needed."
      "ಸ್ವಚ್ಛತೆ ಕಾಪಾಡು.": "Keep things clean."
  "kn-1485":
    native: "animal"
    notes:
      "n1": "An animal, a living thing that moves."
    examples:
      "ಪ್ರಾಣಿ ಸಾಯುತ್ತಿದೆ.": "The animal is dying."
      "ಪ್ರಾಣಿಗಳನ್ನು ರಕ್ಷಿಸು.": { native: "Protect the animals.", bases: { "ಪ್ರಾಣಿಗಳನ್ನು": "the animals" } }
  "kn-1486":
    native: "to protect, to save from harm"
    notes:
      "n1": "To protect someone or something from danger."
    examples:
      "ಮಕ್ಕಳನ್ನು ರಕ್ಷಿಸು.": "Protect the children."
      "ಅವನು ಪ್ರಾಣಿ ರಕ್ಷಿಸಿದ.": { native: "He saved the animal.", bases: { "ರಕ್ಷಿಸಿದ": "saved" } }
  "kn-1487":
    native: "sewage, dirty water"
    notes:
      "n1": "Dirty water from drains, or sewage."
    examples:
      "ಕೊಳಚೆ ನೀರು ಹರಿಯುತ್ತಿದೆ.": "Dirty water is flowing."
      "ಕೊಳಚೆ ತೆಗೆ.": "Remove the sewage."
  "kn-1488":
    native: "extinction"
    notes:
      "n1": "Extinction, when a kind of living thing dies out."
    examples:
      "ಅಳಿವು ಆಗುತ್ತಿದೆ.": { native: "It is becoming extinct.", bases: { "ಆಗುತ್ತಿದೆ": "is becoming" } }
      "ಅಳಿವು ಬೇಡ.": "No extinction."
  "kn-1489":
    native: "change"
    notes:
      "n1": "A change, something that becomes different."
    examples:
      "ಬದಲಾವಣೆ ಆಯಿತು.": "A change happened."
      "ಬದಲಾವಣೆ ಬೇಕು.": "A change is needed."
  "kn-1490":
    native: "plant"
    notes:
      "n1": "A plant, a living thing that grows in the soil."
    examples:
      "ಸಸ್ಯ ಬೆಳೆಯುತ್ತಿದೆ.": "The plant is growing."
      "ಸಸ್ಯಗಳನ್ನು ಉಳಿಸು.": { native: "Save the plants.", bases: { "ಸಸ್ಯಗಳನ್ನು": "the plants" } }
  "kn-1491":
    native: "to plant"
    notes:
      "n1": "To plant a seed or a sapling in the ground."
    examples:
      "ಗಿಡ ನೆಡು.": "Plant a sapling."
      "ಅವರು ಮರ ನೆಡುತ್ತಾರೆ.": { native: "They plant trees.", bases: { "ನೆಡುತ್ತಾರೆ": "plant" } }
