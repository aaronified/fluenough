schema: 1
id: "kn-en-slang"
kind: "layer"
core: "kn-slang"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Slang"
license: "CC0-1.0"
description: "Everyday slang, much of it from Bengaluru: what friends say that a textbook doesn't. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0557":
    native: "mate; dude"
    notes:
      "n1": "Literally 'son', but between young men any friend: ಏನ್ ಮಗಾ (ēn magā)? what's up, mate?"
  "kn-0558":
    native: "mate; boss"
    notes:
      "n1": "Literally 'teacher', said to a friend or a stranger: ಏನ್ ಗುರು (ēn guru)? what's up?"
  "kn-0559":
    native: "What's up? What's new?"
    notes:
      "n1": "ಸಮಾಚಾರ (samācāra) is 'news'."
  "kn-0560":
    native: "great; really"
    notes:
      "n1": "ಸಕ್ಕತ್ತಾಗಿದೆ (sakkattāgide), it's great."
  "kn-0561":
    native: "fantastic"
    notes:
      "n1": "ಬೊಂಬಾಟ್ ಊಟ (bombāṭ ūṭa), a fantastic meal."
  "kn-0562":
    native: "great; loads"
    notes:
      "n1": "Shared with Hindi: ಮಸ್ತ್ ಆಗಿದೆ (mast āgide), it's great."
  "kn-0563":
    native: "a lot; terribly"
    notes:
      "n1": "ಸಿಕ್ಕಾಪಟ್ಟೆ ಟ್ರಾಫಿಕ್ (sikkāpaṭṭe ṭrāphik), terrible traffic."
  "kn-0564":
    native: "I'm bored"
    notes:
      "n1": "'Boredom is happening': ನಂಗೆ ಬೋರ್ ಆಗ್ತಿದೆ (naṅge bōr āgtide)."
  "kn-0565":
    native: "don't stress"
    notes:
      "n1": "'Don't take tension'."
  "kn-0566":
    native: "rubbish; useless"
    notes:
      "n1": "Literally a tin box: ಡಬ್ಬಾ ಸಿನಿಮಾ (ḍabbā sinimā), a rubbish film."
  "kn-0567":
    native: "never mind; let it go"
    notes:
      "n1": "'Let it go, leave it'."
  "kn-0568":
    native: "just like that; for nothing; quietly"
    notes:
      "n1": "ಸುಮ್ನೆ ಇರು (sumne iru), be quiet; ಸುಮ್ನೆ ಕೇಳ್ದೆ (sumne kēḷde), I just asked."
  "kn-0569":
    native: "brilliant (slang); a rag"
    notes:
      "n1": "Literally a rag, torn to shreds: a show that 'tore it up' is ಚಿಂದಿ (cindi)."
  "kn-0570":
    native: "oil; booze (slang)"
    notes:
      "n1": "ಎಣ್ಣೆ ಹೊಡೆಯೋಣ? (enne hodeyona?), shall we have a drink? Cooking oil is the first meaning."
