schema: 1
id: "kn-en-technology"
kind: "layer"
core: "kn-technology"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Technology: computers, apps and the internet"
license: "CC-BY-SA-4.0"
description: "Computers and their parts, the software and the internet: the mouse and the keyboard, files and downloads, and websites. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1434":
    native: "technology"
    notes:
      "n1": "Technology, the tools and methods of modern life."
    examples:
      "ತಂತ್ರಜ್ಞಾನ ಹೊಸದು.": "The technology is new."
      "ತಂತ್ರಜ್ಞಾನ ಬೇಕು.": "Technology is needed."
  "kn-1435":
    native: "mobile phone"
    notes:
      "n1": "A mobile phone, which you carry in your hand."
    examples:
      "ಮೊಬೈಲ್ ಎಲ್ಲಿ?": "Where is the mobile?"
      "ಮೊಬೈಲ್ ಹೊಸದು.": "The mobile is new."
  "kn-1436":
    native: "laptop"
    notes:
      "n1": "A laptop, a small portable computer."
    examples:
      "ಲ್ಯಾಪ್ಟಾಪ್ ಬೇಕು.": "I need a laptop."
      "ಲ್ಯಾಪ್ಟಾಪ್ ಚಾಲು ಮಾಡು.": "Switch on the laptop."
  "kn-1437":
    native: "keyboard"
    notes:
      "n1": "A keyboard, with keys to type letters."
    examples:
      "ಕೀಬೋರ್ಡ್ ಎಲ್ಲಿ?": "Where is the keyboard?"
      "ಕೀಬೋರ್ಡ್ ಬಳಸು.": "Use the keyboard."
  "kn-1438":
    native: "mouse"
    notes:
      "n1": "A computer mouse, to point and click."
    examples:
      "ಮೌಸ್ ಬೇಕು.": "I need a mouse."
      "ಮೌಸ್ ಇದೆ.": { native: "There is a mouse.", bases: { "ಇದೆ": "there is" } }
  "kn-1439":
    native: "monitor, screen"
    notes:
      "n1": "A monitor, the screen of a computer."
    examples:
      "ಮಾನಿಟರ್ ದೊಡ್ಡದು.": "The monitor is big."
      "ಮಾನಿಟರ್ ಆನ್ ಮಾಡು.": "Switch on the monitor."
  "kn-1440":
    native: "printer"
    notes:
      "n1": "A printer, which prints papers."
    examples:
      "ಪ್ರಿಂಟರ್ ಇದೆ.": { native: "There is a printer.", bases: { "ಇದೆ": "there is" } }
      "ಪ್ರಿಂಟರ್ ಬೇಕು.": "I need a printer."
  "kn-1441":
    native: "software"
    notes:
      "n1": "Software, the programs that run on a computer."
    examples:
      "ಸಾಫ್ಟ್ವೇರ್ ಹೊಸದು.": "The software is new."
      "ಸಾಫ್ಟ್ವೇರ್ ಬೇಕು.": "I need the software."
  "kn-1442":
    native: "website"
    notes:
      "n1": "A website, a set of pages on the internet."
    examples:
      "ವೆಬ್ಸೈಟ್ ಎಲ್ಲಿ?": "Where is the website?"
      "ವೆಬ್ಸೈಟ್ ನೋಡು.": "See the website."
  "kn-1443":
    native: "page"
    notes:
      "n1": "A page of a book, or of a website."
    examples:
      "ಪುಟ ತೆರೆ.": "Open the page."
      "ಪುಟ ಎಷ್ಟು?": "Which page?"
  "kn-1444":
    native: "data"
    notes:
      "n1": "Data, information stored in a computer."
    examples:
      "ಡೇಟಾ ಇದೆ.": { native: "There is data.", bases: { "ಇದೆ": "there is" } }
      "ಡೇಟಾ ಹೊಸದು.": "The data is new."
  "kn-1445":
    native: "download"
    notes:
      "n1": "A download, a file copied from the internet."
    examples:
      "ಡೌನ್ಲೋಡ್ ಆಯಿತು.": "The download is done."
      "ಡೌನ್ಲೋಡ್ ಬೇಕು.": "I need a download."
  "kn-1446":
    native: "file"
    notes:
      "n1": "A file on a computer, with information in it."
    examples:
      "ಫೈಲ್ ಎಲ್ಲಿ?": "Where is the file?"
      "ಫೈಲ್ ಕಳುಹಿಸು.": "Send the file."
  "kn-1447":
    native: "search"
    notes:
      "n1": "A search, to look for information on the internet."
    examples:
      "ಸರ್ಚ್ ಮಾಡು.": "Search."
      "ಸರ್ಚ್ ಬೇಕು.": "I need a search."
  "kn-1448":
    native: "machine"
    notes:
      "n1": "A machine, which does work by its power."
    examples:
      "ಯಂತ್ರ ಕೆಲಸ ಮಾಡುತ್ತದೆ.": "The machine works."
      "ಯಂತ್ರ ಹೊಸದು.": "The machine is new."
  "kn-1449":
    native: "robot"
    notes:
      "n1": "A robot, a machine that can move and work on its own."
    examples:
      "ರೋಬೋಟ್ ಇದೆ.": { native: "There is a robot.", bases: { "ಇದೆ": "there is" } }
      "ರೋಬೋಟ್ ಕೆಲಸ ಮಾಡುತ್ತದೆ.": "The robot works."
  "kn-1450":
    native: "device, tool"
    notes:
      "n1": "A device or a tool, something made to do a job."
    examples:
      "ಈ ಸಾಧನ ಚೆನ್ನಾಗಿದೆ.": "This device is good."
      "ಸಾಧನ ಬೇಕು.": "I need a device."
  "kn-1451":
    native: "upload"
    notes:
      "n1": "An upload, a file sent from your computer to the internet."
    examples:
      "ಅಪ್ಲೋಡ್ ಆಯಿತು.": "The upload is done."
      "ಫೈಲ್ ಅಪ್ಲೋಡ್ ಬೇಕು.": "I need to upload the file."
  "kn-1452":
    native: "on, running"
    notes:
      "n1": "On, running, said of a machine. Off is ಆಫ್ (āph)."
    examples:
      "ಫೋನ್ ಚಾಲು ಇದೆ.": { native: "The phone is on.", bases: { "ಇದೆ": "is" } }
      "ಕಂಪ್ಯೂಟರ್ ಚಾಲು ಆಯಿತು.": "The computer came on."
  "kn-1453":
    native: "internet"
    notes:
      "n1": "The internet, a web of computers joined together."
    examples:
      "ಅಂತರ್ಜಾಲ ಇದೆಯೇ?": { native: "Is there the internet?", bases: { "ಇದೆಯೇ": "is there" } }
      "ಅಂತರ್ಜಾಲ ಬೇಕು.": "I need the internet."
