schema: 1
id: "kn-en-daily-life"
kind: "layer"
core: "kn-daily-life"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "A day"
license: "CC0-1.0"
description: "The day from waking to sleeping, and how often things happen. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0432":
    native: "get up! (to a friend); to get up"
    notes:
      "n1": "The verb is ಏಳು (ēḷu), to rise, the same word as seven: ಏಳುತ್ತೇನೆ (ēḷuttēne), I get up. ಎದ್ದೇಳು (eddēḷu) is what a parent calls in the morning."
  "kn-0433":
    native: "to bathe; to have a shower"
    notes:
      "n1": "'To do a bath'. ಮಾಡು (māḍu), to do, makes many verbs."
    bases:
      "ಸ್ನಾನ": "bath"
      "ಮಾಡು": "to do; to make"
  "kn-0434":
    native: "to brush one's teeth"
    notes:
      "n1": "'To rub the teeth'. ಹಲ್ಲು (hallu) is a tooth."
    bases:
      "ಹಲ್ಲು": "tooth"
      "ಉಜ್ಜು": "to brush; to rub"
  "kn-0435":
    native: "breakfast; a snack"
    notes:
      "n1": "Idli, dosa, upma: ತಿಂಡಿ ಆಯ್ತಾ? (tindi ayta?), have you had breakfast?, is a morning greeting."
  "kn-0436":
    native: "lunch"
    notes:
      "n1": "ಮಧ್ಯಾಹ್ನ (madhyāhna) is midday, ಊಟ (ūṭa) a meal."
    bases:
      "ಮಧ್ಯಾಹ್ನದ": "midday; afternoon"
  "kn-0437":
    native: "dinner"
  "kn-0438":
    native: "to go to work"
    bases:
      "ಹೋಗು": "to go"
  "kn-0439":
    native: "to come home"
    bases:
      "ಬರು": "to come"
  "kn-0440":
    native: "to cook"
    bases:
      "ಅಡುಗೆ": "cooking"
      "ಮಾಡು": "to do; to make"
  "kn-0441":
    native: "to go to bed; to lie down; to sleep"
  "kn-0442":
    native: "every day"
    notes:
      "n1": "In speech also ದಿನಾ (dinā)."
  "kn-0443":
    native: "sometimes"
  "kn-0444":
    native: "always"
    notes:
      "n1": "ಯಾವಾಗ (when) + -ಊ (also): 'whenever'."
  "kn-0445":
    native: "usually"
  "kn-0446":
    native: "after that; then; later"
  "kn-0447":
    native: "I get up at seven every day."
    notes:
      "n1": "ಏಳು (ēḷu) twice: seven, and the verb 'get up'."
    bases:
      "ನಾನು": "I"
  "kn-0448":
    native: "Then I go to work."
    bases:
      "ನಾನು": "I"
      "ಹೋಗುತ್ತೇನೆ": "to go"
  "kn-0449":
    native: "I go to bed at eleven at night."
    bases:
      "ನಾನು": "I"
  "kn-0450":
    native: "I'm never late."
    notes:
      "n1": "'I never come late': ಯಾವತ್ತೂ (yāvattū), ever, with a 'not' verb is 'never'."
    bases:
      "ನಾನು": "I"
      "ತಡವಾಗಿ": "delay"
      "ಬರುವುದಿಲ್ಲ": "to come"
