  entries:
    "maadu": "to do"
    "hoogu": "to go"
    "baru": "to come"
  notes: "The verb with -ಉತ್ತ- (-utta-) and then ಇರು (iru), to be: ಮಾಡುತ್ತಿದ್ದೇನೆ (māḍuttiddēne), 'I am doing'. The verb agrees with the doer's person and number. In the third person a man, a woman and a thing each have a form of their own: ಅವನು ಬಂದನು (avanu bandanu), ಅವಳು ಬಂದಳು (avaḷu bandaḷu), ಅದು ಬಂತು (adu bantu). ನೀವು (nīvu), plural or respectful, takes the plural, and so does ಅವರು (avaru), they, or he or she with respect. Where two forms are given, the first is written Kannada and the second everyday speech; both are accepted."
