schema: 1
id: "kn-en-home"
kind: "layer"
core: "kn-home"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Home and neighbourhood"
license: "CC-BY-SA-4.0"
description: "The rooms of a home, what is in them, and the people next door. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0380":
    native: "room"
    notes:
      "n1": "Also ರೂಮು (rūmu)."
    "examples": {
      "ಕೋಣೆ ಇಕ್ಕಟ್ಟು.": {"native": "The room is cramped.", "bases": {}},
      "ಕೋಣೆ ವಿಶಾಲ.": {"native": "The room is spacious.", "bases": {}}
    }
  "kn-0381":
    native: "kitchen"
    notes:
      "n1": "'The cooking house'."
    "examples": {
      "ಅಡುಗೆಮನೆಯಲ್ಲಿ ಜಿರಳೆ ಇದೆ.": {"native": "There is a cockroach in the kitchen.", "bases": {"ಅಡುಗೆಮನೆಯಲ್ಲಿ": "in the kitchen", "ಇದೆ": "is"}}
    }
  "kn-0382":
    native: "bedroom"
    notes:
      "n1": "'The sleeping room'. Many say ಬೆಡ್‌ರೂಮ್ (beḍrūm)."
  "kn-0383":
    native: "sitting room; hall"
    notes:
      "n1": "Ends in the halant: not ಹಾಲು (hālu), milk."
  "kn-0384":
    native: "bathroom"
    notes:
      "n1": "Also ಸ್ನಾನದ ಮನೆ (snānada mane), 'the bathing room'."
  "kn-0385":
    native: "door"
    notes:
      "n1": "ಬಾಗಿಲು ಹಾಕಿ (bāgilu hāki), please shut the door."
    "examples": {
      "ಬಾಗಿಲು ತೆರೆ.": {"native": "Open the door.", "bases": {"ಬಾಗಿಲು": "door"}},
      "ಬಾಗಿಲು ಮುಚ್ಚು.": {"native": "Close the door.", "bases": {"ಬಾಗಿಲು": "door"}}
    }
  "kn-0386":
    native: "window"
  "kn-0387":
    native: "stairs; a step"
    "examples": {
      "ಮೆಟ್ಟಿಲು ಏರು.": {"native": "Climb the stairs.", "bases": {}}
    }
  "kn-0388":
    native: "floor; storey"
    notes:
      "n1": "ಮೊದಲನೇ ಮಹಡಿ (modalanē mahaḍi), the first floor."
  "kn-0389":
    native: "key"
    notes:
      "n1": "'The hand of the lock': ಬೀಗ (bīga) is a lock. Many say ಕೀ (kī)."
    bases:
      "ಬೀಗದ": "lock"
  "kn-0390":
    native: "bed; cot"
    notes:
      "n1": "The mattress and bedding are ಹಾಸಿಗೆ (hāsige)."
    "examples": {
      "ಮಂಚ ಆರಾಮ.": {"native": "The cot is comfortable.", "bases": {}}
    }
  "kn-0391":
    native: "chair"
    "examples": {
      "ಅವರು ಕುರ್ಚಿಯಲ್ಲಿ ಕೂರುತ್ತಾರೆ.": {"native": "They sit on a chair.", "bases": {"ಕುರ್ಚಿಯಲ್ಲಿ": "on a chair", "ಕೂರುತ್ತಾರೆ": "to sit"}},
      "ಕುರ್ಚಿ ಆರಾಮ ಇದೆ.": {"native": "The chair is comfortable.", "bases": {"ಇದೆ": "is"}}
    }
  "kn-0392":
    native: "table"
    notes:
      "n1": "Also ಟೇಬಲ್ (ṭēbal)."
    "examples": {
      "ಮೇಜಿನ ಕೆಳಗೆ": {"native": "under the table", "bases": {"ಕೆಳಗೆ": "under; below", "ಮೇಜಿನ": "table"}},
      "ಮೇಜಿನ ಮೇಲೆ": {"native": "on the table", "bases": {"ಮೇಲೆ": "on; above", "ಮೇಜಿನ": "table"}}
    }
  "kn-0393":
    native: "fan"
  "kn-0394":
    native: "light; lamp"
    notes:
      "n1": "An electric light is often ಲೈಟು (laiṭu)."
    "examples": {
      "ಆರತಿಯಲ್ಲಿ ದೀಪ ಇದೆ.": {"native": "There is a lamp in the ceremony.", "bases": {"ಆರತಿಯಲ್ಲಿ": "in the ceremony", "ಇದೆ": "is, there is"}},
      "ದೀಪಾವಳಿಯಲ್ಲಿ ದೀಪ ಹಚ್ಚುತ್ತಾರೆ.": {"native": "At Diwali they light lamps.", "bases": {"ದೀಪಾವಳಿಯಲ್ಲಿ": "at Diwali", "ಹಚ್ಚುತ್ತಾರೆ": "light"}}
    }
  "kn-0395":
    native: "the neighbours"
    notes:
      "n1": "'The people to the side and side'."
  "kn-0345":
    notes:
      "n1": "ಬಾಡಿಗೆ ಮನೆ (bāḍige mane), a rented house."
  "kn-0396":
    native: "flat; apartment"
  "kn-0397":
    native: "street"
    "examples": {
      "ನಮ್ಮ ಬೀದಿ ತುಂಬಾ ಶಾಂತವಾಗಿದೆ.": {"native": "Our street is very quiet.", "bases": {"ನಮ್ಮ": "we", "ತುಂಬಾ": "very; a lot", "ಶಾಂತವಾಗಿದೆ": "quiet"}}
    }
  "kn-0398":
    native: "There's a park in front of the house."
    notes:
      "n1": "ಇರು (iru) changes its form: ಇದ್ದ- (idda-) for people, ಇದೆ (ide) for things."
    bases:
      "ಪಾರ್ಕ್": "park"
      "ಇದೆ": "to be; to have; to live"
  "kn-0399":
    native: "Our street is very quiet."
    bases:
      "ನಮ್ಮ": "we"
      "ತುಂಬಾ": "very; a lot"
      "ಶಾಂತವಾಗಿದೆ": "quiet"
