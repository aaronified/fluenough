schema: 1
id: "kn-en-transport"
kind: "layer"
core: "kn-transport"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bus, auto, cab"
license: "CC-BY-SA-4.0"
description: "Getting a ride, agreeing the fare and getting off where you want. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0342":
    native: "bus"
    notes:
      "n1": "Also ಬಸ್ (bas). Kannada likes a word to end in a vowel, so many words from English gain a u."
  "kn-0343":
    native: "auto-rickshaw"
  "kn-0344":
    native: "taxi"
    notes:
      "n1": "A booked one is often ಕ್ಯಾಬ್ (kyāb), cab."
  "kn-0345":
    native: "fare; hire; rent"
  "kn-0346":
    native: "Please put the meter on."
    notes:
      "n1": "ಹಾಕು (hāku) is 'to put'. Otherwise agree the fare first: ಎಷ್ಟು ಆಗುತ್ತೆ (eṣṭu āgutte)? how much will it be?"
    bases:
      "ಮೀಟರ್": "meter"
      "ಹಾಕಿ": "to put; to put on"
  "kn-0347":
    native: "I need to go to the railway station."
    notes:
      "n1": "In speech most people say ಸ್ಟೇಷನ್ (sṭēṣan). -ಬೇಕು (-bēku) on a verb is 'must, need to'."
    bases:
      "ನಾನು": "I"
      "ಹೋಗಬೇಕು": "to go"
  "kn-0348":
    native: "How long will it take?"
    notes:
      "n1": "ಹೊತ್ತು (hottu) is 'time, a while'. In speech, ಆಗುತ್ತೆ (āgutte)."
    bases:
      "ಹೊತ್ತು": "time; while"
      "ಆಗುತ್ತದೆ": "to become; to happen; to be possible"
  "kn-0349":
    native: "Stop here, please."
    bases:
      "ನಿಲ್ಲಿಸಿ": "to stop"
  "kn-0350":
    native: "station; stop"
    notes:
      "n1": "On signs: ಬಸ್ ನಿಲ್ದಾಣ (bas nildāṇa), bus stop; ರೈಲು ನಿಲ್ದಾಣ (railu nildāṇa), railway station."
    "examples": {
      "ನಾನು ರೈಲು ನಿಲ್ದಾಣಕ್ಕೆ ಹೋಗಬೇಕು.": {"native": "I need to go to the railway station.", "bases": {"ನಾನು": "I", "ಹೋಗಬೇಕು": "to go", "ನಿಲ್ದಾಣಕ್ಕೆ": "station; stop"}},
      "ವಿಮಾನ ನಿಲ್ದಾಣ ದೂರ ಇದೆ.": {"native": "The airport is far.", "bases": {"ಇದೆ": "is"}}
    }
  "kn-0351":
    native: "train"
    "examples": {
      "ರೈಲು ಏರು.": {"native": "Get on the train.", "bases": {}},
      "ರೈಲು ಹೊರಡುತ್ತದೆ.": {"native": "The train leaves.", "bases": {"ಹೊರಡುತ್ತದೆ": "leaves"}}
    }
  "kn-0352":
    native: "ticket"
    "examples": {
      "ಕಂಡಕ್ಟರ್ ಟಿಕೆಟ್ ಕೊಟ್ಟರು.": {"native": "The conductor gave the ticket.", "bases": {}}
    }
  "kn-0353":
    native: "seat"
    "examples": {
      "ಈ ಬೋಗಿಯಲ್ಲಿ ಸೀಟು ಇದೆ.": {"native": "There is a seat in this coach.", "bases": {"ಬೋಗಿಯಲ್ಲಿ": "in the coach", "ಇದೆ": "there is"}}
    }
  "kn-0354":
    native: "let's go"
    notes:
      "n1": "-ಓಣ (-ōṇa) makes 'let's': ಮಾಡೋಣ (māḍōṇa), let's do it."
    "examples": {
      "ನಾವು ಹೋಗೋಣ.": {"native": "Let's go.", "bases": {"ನಾವು": "we"}},
      "ಬೀಚಿಗೆ ಹೋಗೋಣ.": {"native": "Let us go to the beach.", "bases": {"ಬೀಚಿಗೆ": "to the beach"}}
    }
