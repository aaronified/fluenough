schema: 1
id: "kn-en-shopping"
kind: "layer"
core: "kn-shopping"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Shopping"
license: "CC-BY-SA-4.0"
description: "Buying and selling: the receipt, the price and the discount, sizes and weights, and paying at the counter. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1024":
    native: "to buy"
    notes:
      "n1": "To buy. The opposite is ಮಾರು (māru), to sell."
    examples:
      "ನಾನು ಹಾಲು ಕೊಳ್ಳುತ್ತೇನೆ.": { native: "I buy milk.", bases: { "ಕೊಳ್ಳುತ್ತೇನೆ": "buy" } }
      "ಅಂಗಡಿಯಲ್ಲಿ ಎಣ್ಣೆ ಕೊಂಡೆ.": { native: "I bought oil at the shop.", bases: { "ಕೊಂಡೆ": "bought" } }
  "kn-1025":
    native: "receipt"
    notes:
      "n1": "The paper that proves you paid. Ask for it: ರಸೀದಿ ಕೊಡಿ (rasīdi koḍi)."
    examples:
      "ರಸೀದಿ ಕೊಡಿ.": "Please give the receipt."
      "ರಸೀದಿ ಇದೆಯೇ?": { native: "Is there a receipt?", bases: { "ಇದೆಯೇ": "is there" } }
  "kn-1026":
    native: "customer"
    notes:
      "n1": "A customer, who buys at a shop."
    examples:
      "ಗ್ರಾಹಕ ಬಂದಿದ್ದಾರೆ.": "A customer has come."
      "ಗ್ರಾಹಕರಿಗೆ ಚೀಲ ಕೊಡು.": { native: "Give the customers a bag.", bases: { "ಗ್ರಾಹಕರಿಗೆ": "to the customers" } }
  "kn-1027":
    native: "seller, shopkeeper"
    notes:
      "n1": "The person who sells. A shopkeeper is also called this."
    examples:
      "ಮಾರಾಟಗಾರ ಬೆಲೆ ಹೇಳಿದ.": "The seller said the price."
      "ಮಾರಾಟಗಾರ ನಗುತ್ತಿದ್ದಾರೆ.": "The seller is smiling."
  "kn-1028":
    native: "to return, give back"
    notes:
      "n1": "To give something back, such as a bought item."
    examples:
      "ಬಟ್ಟೆ ಹಿಂತಿರುಗಿಸು.": "Return the cloth."
      "ಚಿಲ್ಲರೆ ಹಿಂತಿರುಗಿಸು.": "Give back the change."
  "kn-1029":
    native: "measure, size"
    notes:
      "n1": "How big something is, measured. Its weight is ತೂಕ (tūka)."
    examples:
      "ಅಳತೆ ಎಷ್ಟು?": "What size is it?"
      "ಅಳತೆ ಸಣ್ಣ ಆಯಿತು.": "The size became small."
  "kn-1030":
    native: "size, bulk"
    notes:
      "n1": "The size of clothes and things: ಗಾತ್ರ (gātra), not measured in metres."
    examples:
      "ಗಾತ್ರ ದೊಡ್ಡದು.": "The size is big."
      "ಸ್ವಲ್ಪ ಚಿಕ್ಕ ಗಾತ್ರ ಬೇಕು.": "I need a slightly smaller size."
  "kn-1031":
    native: "weight"
    notes:
      "n1": "How heavy something is, in kilos or grams."
    examples:
      "ತೂಕ ಎಷ್ಟು?": "What is the weight?"
      "ತೂಕ ಹೆಚ್ಚು ಆಯಿತು.": "The weight went up."
  "kn-1032":
    native: "metre"
    notes:
      "n1": "A metre, used for cloth and rope."
    examples:
      "ಒಂದು ಮೀಟರ್ ಎಷ್ಟು?": "How much is one metre?"
      "ಎರಡು ಮೀಟರ್ ಬೇಕು.": "I need two metres."
  "kn-1033":
    native: "free"
    notes:
      "n1": "Free, with no cost."
    examples:
      "ಪೊಟ್ಟಣ ಉಚಿತ.": "The packet is free."
      "ಉಚಿತ ಚೀಲ ಕೊಡುತ್ತಾರೆ.": "They give a free bag."
  "kn-1034":
    native: "rate, price"
    notes:
      "n1": "The price, as a rate. Price is also ಬೆಲೆ (bele)."
    examples:
      "ದರ ಎಷ್ಟು?": "What is the rate?"
      "ದರ ಕಡಿಮೆ ಆಯಿತು.": "The rate went down."
  "kn-1035":
    native: "tin, box"
    notes:
      "n1": "A tin or a box, for oil or sweets."
    examples:
      "ಎಣ್ಣೆ ಡಬ್ಬಿ ತೆಗೆದುಕೊ.": "Take the oil tin."
      "ಡಬ್ಬಿ ದೊಡ್ಡದು.": "The tin is big."
  "kn-1036":
    native: "goods, things to buy"
    notes:
      "n1": "Goods, or the things you buy at a shop."
    examples:
      "ಸಾಮಾನು ತೆಗೆದುಕೊ.": "Take the goods."
      "ಅಂಗಡಿಯಲ್ಲಿ ಸಾಮಾನು ಇದೆ.": { native: "There are goods in the shop.", bases: { "ಇದೆ": "is, there is" } }
  "kn-1037":
    native: "item, thing"
    notes:
      "n1": "A thing or an item, such as one object in a shop."
    examples:
      "ವಸ್ತು ದುಬಾರಿ.": "The item is expensive."
      "ವಸ್ತು ಬೇಕು.": "I need the item."
  "kn-1038":
    native: "discount"
    notes:
      "n1": "A discount, a lower price for a day or a shop."
    examples:
      "ರಿಯಾಯಿತಿ ಇದೆ.": { native: "There is a discount.", bases: { "ಇದೆ": "is, there is" } }
      "ಅಂಗಡಿಯಲ್ಲಿ ರಿಯಾಯಿತಿ ಕೊಡುತ್ತಾರೆ.": "The shop gives a discount."
  "kn-1039":
    native: "bargaining"
    notes:
      "n1": "Bargaining over a price, normal in a market."
    examples:
      "ಚೌಕಾಸಿ ಮಾಡು.": "Bargain."
      "ಚೌಕಾಸಿ ಮಾಡಿದೆ.": "I bargained."
  "kn-1040":
    native: "card"
    notes:
      "n1": "A bank card, for paying without cash."
    examples:
      "ಕಾರ್ಡ್ ತೆಗೆದುಕೊ.": "Take the card."
      "ಕಾರ್ಡ್ ಇದೆಯೇ?": { native: "Is there a card?", bases: { "ಇದೆಯೇ": "is there" } }
  "kn-1041":
    native: "cash"
    notes:
      "n1": "Cash, money in notes and coins."
    examples:
      "ನಗದು ಕೊಡು.": "Give cash."
      "ನಗದು ಇದೆಯೇ?": { native: "Is there cash?", bases: { "ಇದೆಯೇ": "is there" } }
  "kn-1042":
    native: "credit, loan"
    notes:
      "n1": "Credit: buying now and paying later."
    examples:
      "ಸಾಲ ಇಲ್ಲ.": "There is no credit."
      "ಸಾಲ ಕೊಡಿ.": "Please give credit."
  "kn-1043":
    native: "offer"
    notes:
      "n1": "A special offer at a shop, for a time."
    examples:
      "ಇಂದು ಆಫರ್ ಇದೆ.": { native: "There is an offer today.", bases: { "ಇದೆ": "is, there is" } }
      "ಆಫರ್ ತುಂಬಾ ಚೆನ್ನಾಗಿದೆ.": "The offer is very good."
  "kn-1044":
    native: "to take"
    notes:
      "n1": "To take something you have chosen."
    examples:
      "ಚೀಲ ತೆಗೆದುಕೊ.": "Take the bag."
      "ಹಾಲು ತೆಗೆದುಕೊಂಡೆ.": { native: "I took the milk.", bases: { "ತೆಗೆದುಕೊಂಡೆ": "took" } }
  "kn-1045":
    native: "expensive"
    notes:
      "n1": "Expensive, costing a lot. The opposite is ಅಗ್ಗ (agga)."
    examples:
      "ಬೆಲೆ ದುಬಾರಿ.": "The price is high."
      "ಚಿನ್ನ ತುಂಬಾ ದುಬಾರಿ.": "Gold is very expensive."
  "kn-1046":
    native: "cheap"
    notes:
      "n1": "Cheap, costing little."
    examples:
      "ತರಕಾರಿ ಅಗ್ಗ.": "The vegetables are cheap."
      "ಬೆಳ್ಳಿ ಅಗ್ಗ ಅಲ್ಲ.": "Silver is not cheap."
  "kn-1047":
    native: "small"
    notes:
      "n1": "Small. The opposite is ದೊಡ್ಡ (doḍḍa), big."
    examples:
      "ಸಣ್ಣ ಬಟ್ಟೆ ಬೇಕು.": "I need a small cloth."
      "ಸಣ್ಣ ಚೀಲ.": "A small bag."
  "kn-1048":
    native: "old"
    notes:
      "n1": "Old, used before. The opposite is ಹೊಸ (hosa)."
    examples:
      "ಹಳೆ ಬಟ್ಟೆ ಕೊಡು.": "Give the old cloth."
      "ಹಳೆ ಬೆಲೆ ಬೇಡ.": "Not the old price."
  "kn-1049":
    native: "silver"
    notes:
      "n1": "Silver, a metal. Gold is ಚಿನ್ನ (cinna)."
    examples:
      "ಬೆಳ್ಳಿ ಬೇಕು.": "I need silver."
      "ಬೆಳ್ಳಿ ಚಿನ್ನ ಅಲ್ಲ.": "Silver is not gold."
  "kn-1050":
    native: "gold"
    notes:
      "n1": "Gold, a precious metal, very expensive."
    examples:
      "ಚಿನ್ನ ಕೊಳ್ಳು.": "Buy gold."
      "ಚಿನ್ನ ಬೇಕು.": "I need gold."
  "kn-1051":
    native: "scale, balance"
    notes:
      "n1": "A scale for weighing goods in a shop."
    examples:
      "ತಕ್ಕಡಿ ಇದೆ.": { native: "There is a scale.", bases: { "ಇದೆ": "is, there is" } }
      "ತಕ್ಕಡಿಯಲ್ಲಿ ತೂಕ ನೋಡು.": { native: "Check the weight on the scale.", bases: { "ತಕ್ಕಡಿಯಲ್ಲಿ": "on the scale" } }
  "kn-1052":
    native: "carry bag"
    notes:
      "n1": "A plastic carry bag from a shop."
    examples:
      "ಕವರ್ ಕೊಡಿ.": "Please give a carry bag."
      "ಕವರ್ ಬೇಡ.": "No carry bag."
  "kn-1053":
    native: "balance, what is due"
    notes:
      "n1": "The money still owed, or the balance left."
    examples:
      "ಬಾಕಿ ಎಷ್ಟು?": "How much is the balance?"
      "ಬಾಕಿ ಕೊಡು.": "Give the balance."
  "kn-1054":
    native: "more, much"
    notes:
      "n1": "More, or much. The opposite is ಕಡಿಮೆ (kaḍime), less."
    examples:
      "ಬೆಲೆ ಹೆಚ್ಚು ಆಯಿತು.": "The price went up."
      "ಹೆಚ್ಚು ಬೇಕು.": "I need more."
  "kn-1055":
    native: "payment"
    notes:
      "n1": "A payment for goods or a bill."
    examples:
      "ಪಾವತಿ ಮಾಡು.": "Make the payment."
      "ನಗದಿನಲ್ಲಿ ಪಾವತಿ.": { native: "Payment in cash.", bases: { "ನಗದಿನಲ್ಲಿ": "in cash" } }
  "kn-1056":
    native: "to pay"
    notes:
      "n1": "To pay for something."
    examples:
      "ನಾನು ಬಿಲ್ ಪಾವತಿಸುತ್ತೇನೆ.": { native: "I pay the bill.", bases: { "ಪಾವತಿಸುತ್ತೇನೆ": "pay" } }
      "ನಗದಿನಲ್ಲಿ ಪಾವತಿಸು.": { native: "Pay in cash.", bases: { "ನಗದಿನಲ್ಲಿ": "in cash" } }
  "kn-1057":
    native: "sale"
    notes:
      "n1": "A sale: the act of selling, or a day of low prices."
    examples:
      "ಇಂದು ಮಾರಾಟ ಇದೆ.": { native: "There is a sale today.", bases: { "ಇದೆ": "is, there is" } }
      "ಮಾರಾಟ ಮುಗಿಯಿತು.": { native: "The sale is over.", bases: { "ಮುಗಿಯಿತು": "is over" } }
