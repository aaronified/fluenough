schema: 1
id: "kn-en-phone"
kind: "layer"
core: "kn-phone"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phone"
license: "CC-BY-SA-4.0"
description: "Using a phone: calls and messages, the battery and the charger, the network, numbers, and the apps on the screen. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1193":
    native: "message"
    notes:
      "n1": "A message, a text sent by phone. A text message is also called ಮೆಸೇಜ್ (mesēj)."
    examples:
      "ಸಂದೇಶ ಬಂದಿದೆ.": "A message has come."
      "ಸಂದೇಶ ಕಳುಹಿಸು.": "Send a message."
  "kn-1194":
    native: "text message"
    notes:
      "n1": "A text message, the word from English."
    examples:
      "ಮೆಸೇಜ್ ಕಳುಹಿಸು.": "Send a text message."
      "ಮೆಸೇಜ್ ಬಂದಿಲ್ಲ.": "No message has come."
  "kn-1195":
    native: "SIM card"
    notes:
      "n1": "A SIM card, which holds the phone number."
    examples:
      "ಸಿಮ್ ಕಾರ್ಡ್ ಬೇಕು.": "I need a SIM card."
      "ಸಿಮ್ ಇದೆಯೇ?": { native: "Is there a SIM?", bases: { "ಇದೆಯೇ": "is there" } }
  "kn-1196":
    native: "charger"
    notes:
      "n1": "A charger, to fill up the battery."
    examples:
      "ಚಾರ್ಜರ್ ಎಲ್ಲಿ?": "Where is the charger?"
      "ಚಾರ್ಜರ್ ತೆಗೆದುಕೊ.": "Take the charger."
  "kn-1197":
    native: "battery"
    notes:
      "n1": "A battery, which needs charging."
    examples:
      "ಬ್ಯಾಟರಿ ಕಡಿಮೆ ಇದೆ.": { native: "The battery is low.", bases: { "ಇದೆ": "is" } }
      "ಬ್ಯಾಟರಿ ಚಾರ್ಜ್ ಮಾಡು.": "Charge the battery."
  "kn-1198":
    native: "network"
    notes:
      "n1": "The phone network, which the phone needs for calls."
    examples:
      "ನೆಟ್ವರ್ಕ್ ಇಲ್ಲ.": "There is no network."
      "ನೆಟ್ವರ್ಕ್ ಚೆನ್ನಾಗಿದೆ.": "The network is good."
  "kn-1199":
    native: "internet"
    notes:
      "n1": "The internet, on the phone or on a computer."
    examples:
      "ಇಂಟರ್ನೆಟ್ ಇದೆಯೇ?": { native: "Is there internet?", bases: { "ಇದೆಯೇ": "is there" } }
      "ಇಂಟರ್ನೆಟ್ ಬೇಕು.": "I need the internet."
  "kn-1200":
    native: "app"
    notes:
      "n1": "An app, a small program on the phone. The vowel is as in English cat (æ), which the reading āp cannot show."
    examples:
      "ಆ್ಯಪ್ ತೆರೆ.": "Open the app."
      "ಹೊಸ ಆ್ಯಪ್ ಇದೆ.": { native: "There is a new app.", bases: { "ಇದೆ": "there is" } }
  "kn-1201":
    native: "password"
    notes:
      "n1": "A password, a secret word to open an account."
    examples:
      "ಪಾಸ್ವರ್ಡ್ ಹೇಳು.": "Tell the password."
      "ಪಾಸ್ವರ್ಡ್ ಮರೆತೆ.": "I forgot the password."
  "kn-1202":
    native: "number"
    notes:
      "n1": "A number, such as a phone number."
    examples:
      "ನಿನ್ನ ಸಂಖ್ಯೆ ಎಷ್ಟು?": "What is your number?"
      "ಸಂಖ್ಯೆ ಕಳುಹಿಸು.": "Send the number."
  "kn-1203":
    native: "screen"
    notes:
      "n1": "The screen of a phone or a television."
    examples:
      "ಪರದೆ ದೊಡ್ಡದು.": "The screen is big."
      "ಪರದೆ ಮೇಲೆ ಚಿತ್ರ ಇದೆ.": { native: "There is a picture on the screen.", bases: { "ಇದೆ": "there is" } }
  "kn-1204":
    native: "button"
    notes:
      "n1": "A button, which you press on the phone."
    examples:
      "ಬಟನ್ ಬೇಕು.": "I need a button."
      "ಬಟನ್ ಇದೆ.": { native: "There is a button.", bases: { "ಇದೆ": "there is" } }
  "kn-1205":
    native: "video"
    notes:
      "n1": "A video, a moving picture on a phone."
    examples:
      "ವೀಡಿಯೊ ನೋಡು.": "Watch the video."
      "ವೀಡಿಯೊ ಕಳುಹಿಸು.": "Send the video."
  "kn-1206":
    native: "ring, ringing"
    notes:
      "n1": "The ring of a phone when someone calls."
    examples:
      "ರಿಂಗ್ ಆಯಿತು.": "The phone rang."
      "ರಿಂಗ್ ಕೇಳಿಸುತ್ತಿದೆ.": { native: "The ring can be heard.", bases: { "ಕೇಳಿಸುತ್ತಿದೆ": "can be heard" } }
  "kn-1208":
    native: "on (a device)"
    notes:
      "n1": "On, switched on. The opposite is ಆಫ್ (āph)."
    examples:
      "ಫೋನ್ ಆನ್ ಮಾಡು.": "Switch the phone on."
      "ಫೋನ್ ಆನ್ ಇದೆ.": { native: "The phone is on.", bases: { "ಇದೆ": "is" } }
  "kn-1209":
    native: "off (a device)"
    notes:
      "n1": "Off, switched off."
    examples:
      "ಫೋನ್ ಆಫ್ ಆಯಿತು.": "The phone switched off."
      "ಆಫ್ ಮಾಡು.": "Switch it off."
  "kn-1210":
    native: "busy, engaged"
    notes:
      "n1": "Busy, said of a line or a person."
    examples:
      "ಈಗ ಬಿಜಿ ಇದ್ದಾಳೆ.": { native: "She is busy now.", bases: { "ಇದ್ದಾಳೆ": "is" } }
      "ಅವಳು ಬಿಜಿ.": "She is busy."
  "kn-1211":
    native: "charge"
    notes:
      "n1": "The charge of a battery, how full it is."
    examples:
      "ಚಾರ್ಜ್ ಎಷ್ಟು?": "How much charge?"
      "ಚಾರ್ಜ್ ಕಡಿಮೆ ಆಯಿತು.": "The charge went low."
  "kn-1212":
    native: "signal"
    notes:
      "n1": "A signal, the phone's bars of reception."
    examples:
      "ಸಿಗ್ನಲ್ ಇಲ್ಲ.": "There is no signal."
      "ಸಿಗ್ನಲ್ ಚೆನ್ನಾಗಿದೆ.": "The signal is good."
  "kn-1213":
    native: "click"
    notes:
      "n1": "A click, a press of a button."
    examples:
      "ಒಂದು ಕ್ಲಿಕ್ ಸಾಕು.": "One click is enough."
      "ಕ್ಲಿಕ್ ಮಾಡು.": "Click."
  "kn-1214":
    native: "choice, option"
    notes:
      "n1": "A choice, an option on the screen."
    examples:
      "ಆಯ್ಕೆ ಮಾಡು.": "Make a choice."
      "ಎರಡು ಆಯ್ಕೆ ಇದೆ.": { native: "There are two options.", bases: { "ಇದೆ": "there are" } }
  "kn-1215":
    native: "protection, security"
    notes:
      "n1": "Protection, such as a lock or a password on the phone."
    examples:
      "ಪಾಸ್ವರ್ಡ್ ರಕ್ಷಣೆ ಮಾಡುತ್ತದೆ.": "A password protects it."
      "ಫೋನ್ ರಕ್ಷಣೆ ಬೇಕು.": "The phone needs protection."
  "kn-1216":
    native: "to ask for help"
    notes:
      "n1": "To ask someone for help."
    examples:
      "ಸಹಾಯ ಕೇಳು.": "Ask for help."
      "ಅವನು ಸಹಾಯ ಕೇಳಿದ.": "He asked for help."
