schema: 1
id: "kn-en-workplace"
kind: "layer"
core: "kn-workplace"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The workplace"
license: "CC-BY-SA-4.0"
description: "At work: the colleagues and the boss, the meeting and the report, the salary, the computer and the files. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1260":
    native: "colleague"
    notes:
      "n1": "A colleague, someone who works with you."
    examples:
      "ಸಹೋದ್ಯೋಗಿ ಬಂದಿದ್ದಾರೆ.": "A colleague has come."
      "ಸಹೋದ್ಯೋಗಿಗೆ ಸಹಾಯ ಮಾಡು.": { native: "Help a colleague.", bases: { "ಸಹೋದ್ಯೋಗಿಗೆ": "a colleague" } }
  "kn-1261":
    native: "manager"
    notes:
      "n1": "A manager, who leads a team at work."
    examples:
      "ಮ್ಯಾನೇಜರ್ ಕರೆದರು.": "The manager called."
      "ಮ್ಯಾನೇಜರ್ ಹೇಳಿದರು.": "The manager said."
  "kn-1262":
    native: "boss, superior"
    notes:
      "n1": "A boss, or a superior at work."
    examples:
      "ಮೇಲಧಿಕಾರಿ ಬಂದರು.": "The boss came."
      "ಮೇಲಧಿಕಾರಿಗೆ ವರದಿ ಕೊಡು.": { native: "Give the report to the boss.", bases: { "ಮೇಲಧಿಕಾರಿಗೆ": "to the boss" } }
  "kn-1263":
    native: "worker"
    notes:
      "n1": "A worker, who does a job with his hands or in an office."
    examples:
      "ಕೆಲಸಗಾರ ಬಂದ.": "The worker came."
      "ಕೆಲಸಗಾರರು ಕೆಲಸ ಮಾಡುತ್ತಿದ್ದಾರೆ.": { native: "The workers are working.", bases: { "ಕೆಲಸಗಾರರು": "the workers" } }
  "kn-1264":
    native: "meeting"
    notes:
      "n1": "A meeting of people at work or in a village."
    examples:
      "ಇಂದು ಸಭೆ ಇದೆ.": { native: "There is a meeting today.", bases: { "ಇದೆ": "there is" } }
      "ಸಭೆಯಲ್ಲಿ ಮಾತಾಡು.": { native: "Speak in the meeting.", bases: { "ಸಭೆಯಲ್ಲಿ": "in the meeting" } }
  "kn-1265":
    native: "secretary"
    notes:
      "n1": "A secretary, who keeps the records and the diary of an office."
    examples:
      "ಕಾರ್ಯದರ್ಶಿ ಬಂದರು.": "The secretary came."
      "ಕಾರ್ಯದರ್ಶಿ ಸಭೆ ಕರೆದರು.": "The secretary called the meeting."
  "kn-1266":
    native: "wage, pay"
    notes:
      "n1": "A wage, the money paid for work, in a formal way."
    examples:
      "ವೇತನ ಹೆಚ್ಚು ಆಯಿತು.": "The wage went up."
      "ವೇತನ ಕಡಿಮೆ.": "The wage is low."
  "kn-1267":
    native: "file, record"
    notes:
      "n1": "A file of papers, kept in an office."
    examples:
      "ಕಡತ ಎಲ್ಲಿ?": "Where is the file?"
      "ಕಡತ ಮೇಜಿನ ಮೇಲೆ ಇದೆ.": { native: "The file is on the table.", bases: { "ಇದೆ": "is" } }
  "kn-1268":
    native: "computer"
    notes:
      "n1": "A computer, used at an office."
    examples:
      "ಕಂಪ್ಯೂಟರ್ ಕೆಲಸ ಮಾಡುತ್ತಿಲ್ಲ.": "The computer is not working."
      "ಕಂಪ್ಯೂಟರ್ ಹೊಸದು.": "The computer is new."
  "kn-1269":
    native: "report"
    notes:
      "n1": "A report, written about work or an event."
    examples:
      "ವರದಿ ಬರೆ.": "Write the report."
      "ವರದಿ ಮುಗಿಯಿತು.": { native: "The report is finished.", bases: { "ಮುಗಿಯಿತು": "is finished" } }
  "kn-1270":
    native: "plan, project"
    notes:
      "n1": "A plan, or a project of work."
    examples:
      "ಹೊಸ ಯೋಜನೆ ಇದೆ.": { native: "There is a new project.", bases: { "ಇದೆ": "there is" } }
      "ಯೋಜನೆ ಚೆನ್ನಾಗಿದೆ.": "The plan is good."
  "kn-1271":
    native: "goal, target"
    notes:
      "n1": "A goal or a target to reach."
    examples:
      "ಗುರಿ ದೊಡ್ಡದು.": "The goal is big."
      "ಗುರಿ ತಲುಪು.": "Reach the goal."
  "kn-1272":
    native: "team"
    notes:
      "n1": "A team of people who work together."
    examples:
      "ತಂಡ ಒಳ್ಳೆಯದು.": "The team is good."
      "ನಮ್ಮ ತಂಡ ಕೆಲಸ ಮಾಡುತ್ತದೆ.": "Our team works."
  "kn-1273":
    native: "decision"
    notes:
      "n1": "A decision, which you make after thinking."
    examples:
      "ನಿರ್ಧಾರ ಮಾಡು.": "Make a decision."
      "ನಿರ್ಧಾರ ಕಷ್ಟ.": "The decision is hard."
  "kn-1274":
    native: "email"
    notes:
      "n1": "An email, sent over the internet."
    examples:
      "ಇಮೇಲ್ ಕಳುಹಿಸು.": "Send an email."
      "ಇಮೇಲ್ ಬಂದಿದೆ.": "An email has come."
  "kn-1275":
    native: "record, document"
    notes:
      "n1": "A record or a document, kept as proof."
    examples:
      "ದಾಖಲೆ ತೋರಿಸು.": "Show the document."
      "ದಾಖಲೆ ಬೇಕು.": "I need a document."
  "kn-1276":
    native: "to think"
    notes:
      "n1": "To think about something, before you decide."
    examples:
      "ಅವನು ಯೋಚಿಸುತ್ತಾನೆ.": { native: "He thinks.", bases: { "ಯೋಚಿಸುತ್ತಾನೆ": "thinks" } }
      "ಅವರು ಯೋಚಿಸುತ್ತಾರೆ.": { native: "They think.", bases: { "ಯೋಚಿಸುತ್ತಾರೆ": "think" } }
  "kn-1277":
    native: "to finish"
    notes:
      "n1": "To finish, or to come to an end."
    examples:
      "ಕೆಲಸ ಮುಗಿಯಿತು.": { native: "The work is finished.", bases: { "ಮುಗಿಯಿತು": "is finished" } }
      "ಸಭೆ ಮುಗಿಸಿದರು.": { native: "They finished the meeting.", bases: { "ಮುಗಿಸಿದರು": "finished" } }
  "kn-1278":
    native: "start, beginning"
    notes:
      "n1": "The start of something, as in a meeting or a lesson."
    examples:
      "ಸಭೆ ಶುರು ಆಯಿತು.": "The meeting began."
      "ಶುರು ಆಯಿತು!": "It has begun!"
  "kn-1279":
    native: "cooperation"
    notes:
      "n1": "Cooperation, working together with others."
    examples:
      "ಸಹಕಾರ ಬೇಕು.": "I need cooperation."
      "ನಿನ್ನ ಸಹಕಾರ ಚೆನ್ನಾಗಿದೆ.": "Your cooperation is good."
