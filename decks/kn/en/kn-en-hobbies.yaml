schema: 1
id: "kn-en-hobbies"
kind: "layer"
core: "kn-hobbies"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hobbies"
license: "CC-BY-SA-4.0"
description: "What people do for fun: music and painting, swimming and running, gardening and photos, and the club where they meet. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1128":
    native: "hobby"
    notes:
      "n1": "A hobby, something you do for pleasure in your free time."
    examples:
      "ನನ್ನ ಹವ್ಯಾಸ ಓದು.": "My hobby is reading."
      "ನಿನ್ನ ಹವ್ಯಾಸ ಏನು?": "What is your hobby?"
  "kn-1129":
    native: "music"
    notes:
      "n1": "Music, which can be sung or played."
    examples:
      "ಸಂಗೀತ ಕೇಳು.": "Listen to music."
      "ಅವಳು ಸಂಗೀತ ಕಲಿಯುತ್ತಾಳೆ.": "She learns music."
  "kn-1130":
    native: "flute"
    notes:
      "n1": "A flute, played by blowing into it."
    examples:
      "ಕೊಳಲು ನುಡಿಸುತ್ತಾನೆ.": { native: "He plays the flute.", bases: { "ನುಡಿಸುತ್ತಾನೆ": "plays" } }
      "ಕೊಳಲು ಸುಂದರ.": "The flute is beautiful."
  "kn-1131":
    native: "tabla, drum"
    notes:
      "n1": "A pair of drums, played with the hands."
    examples:
      "ತಬಲ ನುಡಿಸು.": "Play the tabla."
      "ತಬಲ ಇದೆ.": { native: "There is a tabla.", bases: { "ಇದೆ": "there is" } }
  "kn-1132":
    native: "painting, drawing"
    notes:
      "n1": "Painting or drawing pictures."
    examples:
      "ಚಿತ್ರಕಲೆ ಇಷ್ಟ.": "I like painting."
      "ಅವನು ಚಿತ್ರಕಲೆ ಮಾಡುತ್ತಾನೆ.": "He paints."
  "kn-1133":
    native: "picture"
    notes:
      "n1": "A picture, drawn or photographed."
    examples:
      "ಚಿತ್ರ ಬಿಡಿಸು.": "Draw a picture."
      "ಚಿತ್ರ ತುಂಬಾ ಸುಂದರ.": "The picture is very beautiful."
  "kn-1134":
    native: "photo"
    notes:
      "n1": "A photo, taken with a camera."
    examples:
      "ಫೋಟೋ ತೆಗೆ.": "Take a photo."
      "ಫೋಟೋ ಇದೆಯೇ?": { native: "Is there a photo?", bases: { "ಇದೆಯೇ": "is there" } }
  "kn-1135":
    native: "camera"
    notes:
      "n1": "A camera, for taking photos."
    examples:
      "ಕ್ಯಾಮೆರಾ ಕೊಡು.": "Give the camera."
      "ಕ್ಯಾಮೆರಾ ಹೊಸದು.": "The camera is new."
  "kn-1136":
    native: "running"
    notes:
      "n1": "Running, for exercise or a race."
    examples:
      "ಬೆಳಿಗ್ಗೆ ಓಟ ಮಾಡುತ್ತೇನೆ.": "I run in the morning."
      "ಓಟ ಸ್ಪರ್ಧೆ ಇದೆ.": { native: "There is a running race.", bases: { "ಇದೆ": "there is" } }
  "kn-1137":
    native: "walk"
    notes:
      "n1": "A walk, for exercise or pleasure."
    examples:
      "ಸಂಜೆ ನಡಿಗೆ ಮಾಡುತ್ತೇನೆ.": "I go for a walk in the evening."
      "ನಡಿಗೆ ಒಳ್ಳೆಯದು.": "A walk is good."
  "kn-1138":
    native: "bicycle"
    notes:
      "n1": "A bicycle, which you ride on the road."
    examples:
      "ಸೈಕಲ್ ಇದೆ.": { native: "There is a bicycle.", bases: { "ಇದೆ": "there is" } }
      "ಸೈಕಲ್ ಹೊಸದು.": "The bicycle is new."
  "kn-1139":
    native: "plant, sapling"
    notes:
      "n1": "A small plant or a young tree."
    examples:
      "ಗಿಡ ಬೆಳೆಯುತ್ತಿದೆ.": { native: "The plant is growing.", bases: { "ಬೆಳೆಯುತ್ತಿದೆ": "is growing" } }
      "ಗಿಡಕ್ಕೆ ನೀರು ಹಾಕು.": { native: "Water the plant.", bases: { "ಗಿಡಕ್ಕೆ": "to the plant", "ಹಾಕು": "pour" } }
  "kn-1140":
    native: "club"
    notes:
      "n1": "A club, where people meet for a hobby."
    examples:
      "ಕ್ಲಬ್ ಇದೆ.": { native: "There is a club.", bases: { "ಇದೆ": "there is" } }
      "ಕ್ಲಬ್ ಎಲ್ಲಿ?": "Where is the club?"
  "kn-1141":
    native: "training"
    notes:
      "n1": "Training, lessons to learn a skill."
    examples:
      "ಈಜು ತರಬೇತಿ ಇದೆ.": { native: "There is swimming training.", bases: { "ಇದೆ": "there is" } }
      "ತರಬೇತಿ ಕೊಡು.": "Give training."
  "kn-1142":
    native: "to play an instrument"
    notes:
      "n1": "To play an instrument, such as the flute or the tabla."
    examples:
      "ತಬಲ ನುಡಿಸುತ್ತಾಳೆ.": { native: "She plays the tabla.", bases: { "ನುಡಿಸುತ್ತಾಳೆ": "plays" } }
      "ಅವನು ಕೊಳಲು ನುಡಿಸಿದ.": { native: "He played the flute.", bases: { "ನುಡಿಸಿದ": "played" } }
  "kn-1143":
    native: "to draw, to unfold"
    notes:
      "n1": "To draw a picture, or to open out a sheet."
    examples:
      "ಚಿತ್ರ ಬಿಡಿಸು.": "Draw a picture."
      "ಮಕ್ಕಳು ಚಿತ್ರ ಬಿಡಿಸುತ್ತಾರೆ.": { native: "The children draw pictures.", bases: { "ಬಿಡಿಸುತ್ತಾರೆ": "draw" } }
  "kn-1144":
    native: "interest"
    notes:
      "n1": "Interest in a thing; a hobby is something you have an interest in."
    examples:
      "ಸಂಗೀತದಲ್ಲಿ ಆಸಕ್ತಿ ಇದೆ.": { native: "I have an interest in music.", bases: { "ಸಂಗೀತದಲ್ಲಿ": "in music", "ಇದೆ": "there is" } }
      "ಆಸಕ್ತಿ ಜಾಸ್ತಿ.": "The interest is strong."
  "kn-1145":
    native: "competition, race"
    notes:
      "n1": "A competition, or a race."
    examples:
      "ಓಟ ಸ್ಪರ್ಧೆ ಇದೆ.": { native: "There is a running race.", bases: { "ಇದೆ": "there is" } }
      "ಸ್ಪರ್ಧೆ ಗೆದ್ದ.": { native: "He won the competition.", bases: { "ಗೆದ್ದ": "won" } }
