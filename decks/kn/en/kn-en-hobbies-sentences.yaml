id: "kn-en-hobbies-sentences"
kind: "layer"
core: "kn-hobbies-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hobbies: sentences"
description: "Sentences about hobbies: music and painting, swimming and cycling, and the club. They use the words of the hobbies unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8211":
    native: "My hobby is music."
    notes:
      "n1": "ನನ್ನ (nanna) 'my' comes before ಹವ್ಯಾಸ (havyāsa) 'hobby' and no verb is needed for 'is'."
  "kn-8212":
    native: "She plays the flute."
    notes:
      "n1": "ಕೊಳಲನ್ನು (koḷalannu) marks the object with the ನ್ನು (nnu) ending. ನುಡಿಸುತ್ತಾಳೆ (nuḍisuttāḷe) ends in ಆಳೆ (āḷe), the 'she' verb ending."
    bases:
      "ಕೊಳಲನ್ನು": "flute, here as the thing played: the flute"
      "ನುಡಿಸುತ್ತಾಳೆ": "to play an instrument, here in the third-person feminine present"
  "kn-8213":
    native: "I draw pictures."
    notes:
      "n1": "ಚಿತ್ರ (citra) 'picture' has no object marker here, so it means pictures in general. ಬರೆಯುತ್ತೇನೆ (bareyuttēne) ends in ಏನೆ (ēne), the 'I' verb ending."
    bases:
      "ಬರೆಯುತ್ತೇನೆ": "to write or draw, here in the first-person present"
  "kn-8214":
    native: "He swims in the morning."
    notes:
      "n1": "ಬೆಳಿಗ್ಗೆ (beḷigge) 'in the morning' comes before the verb, not at the start of the sentence."
    bases:
      "ಈಜುತ್ತಾನೆ": "to swim, here in the third-person masculine present"
  "kn-8215":
    native: "I like bicycles."
    notes:
      "n1": "ನನಗೆ (nanage) 'to me' is the dative, and ಇಷ್ಟ (iṣṭa) 'liked' is the thing: literally 'bicycle is liked by me'."
    bases:
      "ನನಗೆ": "I, in the dative: to me"
  "kn-8216":
    native: "Do you sing?"
    notes:
      "n1": "ನೀನು (nīnu) 'you' is the informal 'you', and ಹಾಡುತ್ತೀಯ (hāḍuttīya) ends in ಈಯ (īya), the informal 'you' verb ending. No question word is used, so the question is shown by the voice."
    bases:
      "ಹಾಡುತ್ತೀಯ": "to sing, here in the second-person present question"
  "kn-8217":
    native: "Where is the club?"
    notes:
      "n1": "ಎಲ್ಲಿ (elli) 'where' comes after the noun, with no verb, as in the other location questions."
  "kn-8218":
    native: "Walking is good."
    notes:
      "n1": "ನಡಿಗೆ (naḍige) 'walking' is a noun made from the verb ನಡೆ (naḍe) 'walk'. ಒಳ್ಳೆಯದು (oḷḷeyadu) 'good' needs no verb."
  "kn-8219":
    native: "She draws a picture."
    notes:
      "n1": "ಚಿತ್ರವನ್ನು (citravannu) marks 'the picture' as the object with the ವನ್ನು (vannu) ending. ಬಿಡಿಸು (biḍisu) is the verb for drawing a picture."
    bases:
      "ಚಿತ್ರವನ್ನು": "picture, here as the thing drawn: the picture"
      "ಬಿಡಿಸುತ್ತಾಳೆ": "to draw or unfold, here in the third-person feminine present"
  "kn-8220":
    native: "The competition is today."
    notes:
      "n1": "ಸ್ಪರ್ಧೆ (spardhe) 'competition' and ಇವತ್ತು (ivattu) 'today' stand side by side with no verb, as in the play card."
