cards:
  "kn-7822":
    native: "I study Kannada."
    notes:
      "n1": "ಓದು (ōdu) means both 'read' and 'study'. ಕನ್ನಡ (kannaḍa) 'Kannada' takes no object marker here."
  "kn-7823":
    native: "I listen to the lesson in class."
    notes:
      "n1": "ತರಗತಿಯಲ್ಲಿ (taragatiyalli) 'in class' uses the ಅಲ್ಲಿ (alli) ending. ಕೇಳು (kēḷu) means 'listen' here, and also 'ask'."
  "kn-7824":
    native: "He studies maths."
    notes:
      "n1": "ಕಲಿ (kali) means 'learn' or 'study', while ಓದು (ōdu) means 'read'. ಕಲಿಯುತ್ತಾನೆ (kaliyuttāne) ends in ಆನೆ (āne), the 'he' verb ending."
  "kn-7825":
    notes:
      "n1": "ಪ್ರಶ್ನೆಗೆ (praśnege) is ಪ್ರಶ್ನೆ (praśne), question, with the dative ending -ಗೆ (-ge), meaning to."
    native: "Write the answer to the question."
  "kn-7826":
    native: "I did my homework."
    notes:
      "n1": "ಮಾಡಿದೆ (māḍide) is 'I did', the past form of ಮಾಡು (māḍu) 'do', and ಗೃಹಪಾಠ (gruhapāṭha) 'homework' takes no object marker."
  "kn-7827":
    native: "She looks at the board."
  "kn-7828":
    native: "I bring the notebook."
  "kn-7829":
    native: "The answer is wrong."
    notes:
      "n1": "ಉತ್ತರ (uttara) means both 'answer' and 'north'. Here it is 'answer', as in ಪ್ರಶ್ನೆಗೆ (praśnege) ಉತ್ತರ (uttara) in the card before."
  "kn-7830":
    native: "She studies science."
    notes:
      "n1": "ಓದು (ōdu) 'study' takes ವಿಜ್ಞಾನ (vijñāna) 'science' as the object with no marker. ಓದುತ್ತಾಳೆ (ōduttāḷe) ends in ಆಳೆ (āḷe), the 'she' verb ending."
  "kn-7831":
    native: "My friend brings a pencil."
    notes:
      "n1": "ಗೆಳತಿ (geḷati) is 'female friend' and the verb ತರುತ್ತಾಳೆ (taruttāḷe) ends in ಆಳೆ (āḷe) for 'she'."
