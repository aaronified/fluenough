native: { code: "en", iso639_3: "eng", name: "English" }
name: "Purpose: in order to, for doing"
license: "CC-BY-SA-4.0"
description: "Saying why someone does something: in order to do it, or for the purpose of doing it. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "Purpose"
  slot_name: "form"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "maadu": "to do"
    "hoogu": "to go"
    "baru": "to come"
    "noodu": "to see"
    "tinnu": "to eat"
    "kudi": "to drink"
    "bare": "to write"
    "oodu": "to read"
    "kodu": "to give"
  notes: "To say why, use the basic form of the verb before the need or the verb of the sentence: ಪುಸ್ತಕ ಓದಲು ಬೇಕು (pustaka ōdalu bēku), a book is needed to read. For a stronger purpose, use the longer form: ಓದುವುದಕ್ಕಾಗಿ (ōduvudakkāgi), for the purpose of reading."
