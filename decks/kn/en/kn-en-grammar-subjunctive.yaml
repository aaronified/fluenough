  notes: "For a suggestion to the group, use the us-form of the verb: ಹೋಗೋಣ (hōgōṇa), let us go. For a wish, or an order to another person, use the other form: ಬರಲಿ (barali), may he or she come. The first form is for us only; the second is for he, she and they."
