schema: 1
id: "kn-en-cooking"
kind: "layer"
core: "kn-cooking"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Cooking"
license: "CC-BY-SA-4.0"
description: "Cooking at home: the spices, the vegetables and pulses, the pots, and the verbs for boiling, frying and mixing. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1086":
    native: "cooking, a dish"
    notes:
      "n1": "Cooking, or a dish that is cooked. The cook is ಅಡುಗೆಯವರು (aḍugeyavaru)."
    examples:
      "ಅಡುಗೆ ಮಾಡು.": "Cook."
      "ಅವಳು ಅಡುಗೆ ಮಾಡುತ್ತಾಳೆ.": "She cooks."
  "kn-1087":
    native: "turmeric"
    notes:
      "n1": "Turmeric, a yellow spice, that also colours food."
    examples:
      "ಅರಿಶಿನ ಹಾಕು.": { native: "Add turmeric.", bases: { "ಹಾಕು": "add" } }
      "ಅರಿಶಿನ ಬೇಕು.": "I need turmeric."
  "kn-1088":
    native: "ginger"
    notes:
      "n1": "Ginger, a root used in tea and curry."
    examples:
      "ಶುಂಠಿ ಚಹಾ ಕುಡಿ.": "Drink ginger tea."
      "ಶುಂಠಿ ರುಬ್ಬು.": "Grind the ginger."
  "kn-1089":
    native: "cumin"
    notes:
      "n1": "Cumin seeds, fried in oil first."
    examples:
      "ಜೀರಿಗೆ ಹಾಕು.": { native: "Add cumin.", bases: { "ಹಾಕು": "add" } }
      "ಜೀರಿಗೆ ಹುರಿ.": "Fry the cumin."
  "kn-1090":
    native: "mustard seed"
    notes:
      "n1": "Mustard seed, which pops in hot oil."
    examples:
      "ಸಾಸಿವೆ ಹಾಕು.": { native: "Add mustard seed.", bases: { "ಹಾಕು": "add" } }
      "ಸಾಸಿವೆ ಎಣ್ಣೆ ಬೇಕು.": "I need mustard oil."
  "kn-1091":
    native: "curry leaves"
    notes:
      "n1": "Curry leaves, which give a smell to a dish."
    examples:
      "ಕರಿಬೇವು ಹಾಕು.": { native: "Add curry leaves.", bases: { "ಹಾಕು": "add" } }
      "ಕರಿಬೇವು ಇದೆ.": { native: "There are curry leaves.", bases: { "ಇದೆ": "there are" } }
  "kn-1092":
    native: "to grind"
    notes:
      "n1": "To grind food to a paste, on a stone or in a mixer."
    examples:
      "ಮಸಾಲೆ ರುಬ್ಬು.": "Grind the spices."
      "ಚಟ್ನಿ ರುಬ್ಬಿದೆ.": { native: "I ground the chutney.", bases: { "ರುಬ್ಬಿದೆ": "ground" } }
  "kn-1093":
    native: "vessel, pot"
    notes:
      "n1": "A pot or a vessel for cooking. Crockery is also ಪಾತ್ರೆ (pātre)."
    examples:
      "ಪಾತ್ರೆ ಕೊಡು.": "Give the pot."
      "ಪಾತ್ರೆಯಲ್ಲಿ ನೀರು ಇದೆ.": { native: "There is water in the pot.", bases: { "ಪಾತ್ರೆಯಲ್ಲಿ": "in the pot", "ಇದೆ": "there is" } }
  "kn-1094":
    native: "griddle"
    notes:
      "n1": "A flat iron griddle, for rotis and dosas."
    examples:
      "ತವ ಬಿಸಿ ಮಾಡು.": "Heat the griddle."
      "ತವದಲ್ಲಿ ದೋಸೆ ಹುರಿ.": { native: "Fry the dosa on the griddle.", bases: { "ತವದಲ್ಲಿ": "on the griddle" } }
  "kn-1095":
    native: "taste"
    notes:
      "n1": "Taste, of food and of other things."
    examples:
      "ರುಚಿ ಚೆನ್ನಾಗಿದೆ.": "The taste is good."
      "ಅಡುಗೆ ರುಚಿ ಇದೆ.": { native: "The food has taste.", bases: { "ಇದೆ": "has" } }
  "kn-1096":
    native: "tempering"
    notes:
      "n1": "A tempering of spices fried in hot oil, poured on food."
    examples:
      "ಒಗ್ಗರಣೆ ಹಾಕು.": { native: "Add the tempering.", bases: { "ಹಾಕು": "add" } }
      "ಸಾರಿಗೆ ಒಗ್ಗರಣೆ ಇದೆ.": { native: "The stew has tempering.", bases: { "ಇದೆ": "has" } }
  "kn-1097":
    native: "recipe"
    notes:
      "n1": "A recipe, the steps to make a dish."
    examples:
      "ಪಾಕವಿಧಾನ ಬೇಕು.": "I need the recipe."
      "ಈ ಪಾಕವಿಧಾನ ಸುಲಭ.": "This recipe is easy."
  "kn-1098":
    native: "leafy greens"
    notes:
      "n1": "Leafy greens, cooked as a vegetable."
    examples:
      "ಸೊಪ್ಪು ತಂದೆ.": "I brought greens."
      "ಸೊಪ್ಪು ಸಾರು ಮಾಡು.": "Make a leafy greens stew."
  "kn-1099":
    native: "right consistency"
    notes:
      "n1": "The right stage, such as a dough or a sauce just right."
    examples:
      "ಹದ ಆಯಿತು.": "It came to the right stage."
      "ಸಾರು ಹದ ಆಯಿತು.": "The stew came to the right stage."
  "kn-1100":
    native: "raw, fresh"
    notes:
      "n1": "Raw or fresh, not cooked. Cooked is ಬೆಂದ (benda)."
    examples:
      "ಹಸಿ ತರಕಾರಿ.": "Raw vegetables."
      "ಈರುಳ್ಳಿ ಹಸಿ ಇದೆ.": { native: "The onion is raw.", bases: { "ಇದೆ": "is" } }
  "kn-1101":
    native: "cooked"
    notes:
      "n1": "Cooked, soft from heat; raw is ಹಸಿ (hasi)."
    examples:
      "ಅನ್ನ ಬೆಂದಿದೆ.": { native: "The rice is cooked.", bases: { "ಬೆಂದಿದೆ": "is cooked" } }
      "ಬೆಂದ ತರಕಾರಿ ತಿನ್ನು.": "Eat the cooked vegetables."
  "kn-1102":
    native: "jaggery"
    notes:
      "n1": "Jaggery, a brown unrefined sugar from cane or palm."
    examples:
      "ಬೆಲ್ಲ ಸಿಹಿ.": "Jaggery is sweet."
      "ಬೆಲ್ಲ ಮತ್ತು ತುಪ್ಪ ಬೇಕು.": "I need jaggery and ghee."
  "kn-1103":
    native: "wok, deep pan"
    notes:
      "n1": "A deep round pan, like a wok, for frying."
    examples:
      "ಕಡಾಯಿ ಬಿಸಿ ಮಾಡು.": "Heat the wok."
      "ಕಡಾಯಿಯಲ್ಲಿ ಎಣ್ಣೆ ಹಾಕು.": { native: "Put oil in the wok.", bases: { "ಕಡಾಯಿಯಲ್ಲಿ": "in the wok", "ಹಾಕು": "put" } }
  "kn-1104":
    native: "ladle"
    notes:
      "n1": "A ladle, for serving and stirring."
    examples:
      "ಸೌಟು ತೆಗೆದುಕೊ.": "Take the ladle."
      "ಸೌಟಿನಲ್ಲಿ ಸಾರು ಹಾಕು.": { native: "Put the stew with the ladle.", bases: { "ಸೌಟಿನಲ್ಲಿ": "with the ladle", "ಹಾಕು": "put" } }
  "kn-1105":
    native: "to grate"
    notes:
      "n1": "To grate food into fine pieces."
    examples:
      "ಈರುಳ್ಳಿ ತುರಿ.": "Grate the onion."
      "ಈರುಳ್ಳಿ ತುರಿದೆ.": { native: "I grated the onion.", bases: { "ತುರಿದೆ": "grated" } }
  "kn-1106":
    native: "to heat"
    notes:
      "n1": "To heat something on the stove."
    examples:
      "ಎಣ್ಣೆ ಕಾಯಿಸು.": "Heat the oil."
      "ತವ ಕಾಯಿಸಿದೆ.": { native: "I heated the griddle.", bases: { "ಕಾಯಿಸಿದೆ": "heated" } }
  "kn-1107":
    native: "to cool down"
    notes:
      "n1": "To let something cool, so that it is not hot."
    examples:
      "ಸಾರು ಆರಿಸು.": "Let the stew cool."
      "ಅನ್ನ ಆರಿತು.": { native: "The rice cooled.", bases: { "ಆರಿತು": "cooled" } }
