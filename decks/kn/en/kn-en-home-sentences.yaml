cards:
  "kn-7795":
    notes:
      "n1": "ಅಡುಗೆಮನೆ (aḍugemane) is the kitchen, and the ending -ಯಲ್ಲಿ (-yalli) makes it mean in the kitchen."
    native: "I make tea in the kitchen."
  "kn-7796":
    native: "I read in my room."
    notes:
      "n1": "ನನ್ನ (nanna) 'my' comes before ಕೋಣೆ (kōṇe) 'room' and ಯಲ್ಲಿ (yalli) 'in' is added to the place word."
  "kn-7797":
    native: "Please close the door."
    notes:
      "n1": "ಮುಚ್ಚಿ (mucci) is the polite command 'close'. 'Please' is not added as a word."
  "kn-7798":
    native: "I am going upstairs."
    notes:
      "n1": "ಮಹಡಿಗೆ (mahaḍige) 'to the upstairs' takes the ಗೆ (ge) ending for 'to' a place."
  "kn-7799":
    native: "I stand at the door."
    notes:
      "n1": "ಬಾಗಿಲಿನಲ್ಲಿ (bāgilinalli) 'at the door' adds ಇನ (ina) before ಅಲ್ಲಿ (alli) after ಬಾಗಿಲು (bāgilu)."
  "kn-7800":
    native: "Where is the kitchen?"
    notes:
      "n1": "ಎಲ್ಲಿ (elli) 'where' comes after the noun, with no verb, as in the other location questions."
  "kn-7801":
    native: "He went to the kitchen."
    notes:
      "n1": "ಅಡುಗೆಮನೆಗೆ (aḍugemanege) 'to the kitchen' takes the ಗೆ (ge) ending, and ಹೋದನು (hōdanu) is the past of ಹೋಗು (hōgu) 'go' for 'he'."
  "kn-7802":
    native: "Please sit on the bed."
    notes:
      "n1": "ಮಂಚದ (mañcada) is the form of ಮಂಚ (mañca) before ಮೇಲೆ (mēle) 'on'. ಕೂರಿ (kūri) is the polite command 'sit'."
  "kn-7803":
    native: "Please sit on the chair."
    notes:
      "n1": "ಕುರ್ಚಿಯಲ್ಲಿ (kurciyalli) 'on the chair' uses the ಅಲ್ಲಿ (alli) ending. ಕೂರಿ (kūri) is the polite command 'sit'."
  "kn-7804":
    native: "I walk in the street."
    notes:
      "n1": "ಬೀದಿಯಲ್ಲಿ (bīdiyalli) 'in the street' uses the ಅಲ್ಲಿ (alli) ending, and ನಡೆಯುತ್ತೇನೆ (naḍeyuttēne) ends in ಏನೆ (ēne) for 'I'."
