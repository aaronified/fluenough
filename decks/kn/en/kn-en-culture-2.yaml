# Layer for kn-culture-2: each item's English rendering and a note on it.
schema: 1
id: "kn-en-culture-2"
kind: "layer"
core: "kn-culture-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: Sharana vachanas"
description: "Eighteen vachanas of the twelfth century from Basavanna and Akka Mahadevi, each with its English rendering and a note. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "kn-6050":
    native: "To make a pot, clay comes first; to make jewellery, gold comes first; to know the path of Shiva, the path of the guru comes first; to know the god Kudalasangama, the company of the sharanas comes first."
    notes:
      "n1": "A vachana of Basavanna. Kudalasangama is the name Basavanna signs with, and the sharanas are the devotees of Shiva. The last line of the page repeats the word first; the card keeps one."

  "kn-6051":
    native: "What religion is there without compassion; compassion is needed toward all living beings; compassion is the root of dharma; Lord Kudalasangama will not accept anything else."
    notes:
      "n1": "One of the best-known vachanas of Basavanna. It is a plain statement that compassion is the root of religion."

  "kn-6052":
    native: "The ground is the same for the outcastes' quarter and for the Shiva temple; the water is the same for washing and for rinsing the mouth; for one who knows himself there is one caste; the fruit is the same for the six philosophies, and for liberation; for one who knows you, Lord Kudalasangama, there is one standing."
    notes:
      "n1": "A vachana of Basavanna against caste and ritual difference. The word for the outcastes' quarter names the settlement where people regarded as untouchable lived. The line about the six philosophies and liberation is read word for word; a Kannada speaker should check it."

  "kn-6053":
    native: "The rich build temples for Shiva; what can I, a poor man, do; my legs are the pillars, my body is the shrine, my head is the golden pinnacle; listen, Lord Kudalasangama: the standing thing can perish, the moving thing cannot."
    notes:
      "n1": "The best-known vachana of Basavanna. Sthavara, the standing thing, is a temple building, and jangama, the moving thing, is the living devotee. An English version of the same vachana appears on the English Wikiquote page for Basava, which confirms the sense."

  "kn-6054":
    native: "Do not steal, do not kill, do not speak a lie; do not be angry, do not show disgust toward others, do not praise yourself, do not run down another."
    notes:
      "n1": "The first seven lines of the famous vachana of Basavanna. The page goes on to say this is inner and outer purity and the way to please Kudalasangama; that part is left out of the card. The English Wikiquote page for Basava has the whole vachana in English."

  "kn-6055":
    native: "A devotee needs resolve: the resolve to say, I do not want another's wealth; a devotee needs resolve: the resolve to say, I do not want another's wife; a devotee needs resolve: the resolve to say, I do not want another god."
    notes:
      "n1": "The first three lines of a vachana of Basavanna. The rest of the page names more kinds of resolve and ends by saying Kudalasangama does not value those without it; that part is not on the card."

  "kn-6056":
    native: "A fire inside a house burns that house; it does not burn the neighbour's house."
    notes:
      "n1": "The closing image of a vachana of Basavanna about anger: do not be angry at those who are angry with you, for anger harms the person who keeps it. The card keeps only the image, because the middle lines of the vachana are not clear to the builder."

  "kn-6057":
    native: "Would anyone feed poison to a child who drinks nectar; would anyone build a fence of fire around a plant grown in cool shade?"
    notes:
      "n1": "The first two questions of a vachana of Akka Mahadevi, who signs with Chennamallikarjuna. The page ends by asking whether people who kill may speak to the child of the lord's mercy; that line is not on the card."

  "kn-6058":
    native: "Keeping company with those who do not know is like striking a stone to get a spark; keeping company with those who know is like churning curd to get butter."
    notes:
      "n1": "The first two images of a vachana of Akka Mahadevi. The last image on the page, about the company of the sharanas and a mountain of camphor catching fire, is not on the card."

  "kn-6059":
    native: "O swarm of bees, O mango tree, O moonlight, O cuckoo, I ask you all one thing: if you see my lord Chennamallikarjuna, call him and show him to me."
    notes:
      "n1": "A well-known song of longing by Akka Mahadevi, who calls on the bees, the tree, the moon and the cuckoo to help her find her lord. The page gives it with a raga and tala, so it is the sung form."

  "kn-6060":
    native: "If you are pleased, a dry stump will sprout; if you are pleased, a barren cow will give milk; if you are pleased, poison will become nectar; if you are pleased, every needed thing will be before me, Lord Kudalasangama."
    notes:
      "n1": "The first vachana on a page of Basavanna's vachanas. Kudalasangama is the name Basavanna signs with. The words for the barren cow's milk and for the needed things are read literally from plain Kannada; a Kannada speaker should check them."

  "kn-6061":
    native: "The water-lily is the adornment of the water; the wave is the adornment of the sea; good character is the adornment of a woman; the moon is the adornment of the sky; the sacred ash on the brow is the adornment of the sharanas of our Kudalasangama."
    notes:
      "n1": "The second vachana on the same page of Basavanna's vachanas. The sharanas are the devotees of Shiva, and the ash is the white mark they wear on the forehead."

  "kn-6062":
    native: "If a hearth catches fire one can stand it, but if the earth catches fire one cannot stand it."
    notes:
      "n1": "The first two lines of a vachana of Basavanna on the same page. The lines that follow, which are not on the card, ask what can be done when the dike drinks the water, the fence eats the crop and a mother's milk turns to poison, and end by asking Kudalasangama to whom the poet can complain."

  "kn-6063":
    native: "Why do you set right the crookedness of the world; look after your own bodies; look after your own minds."
    notes:
      "n1": "The first three lines of a vachana of Basavanna on the same page. The word for look after, which means to soothe or put right, is read from its use in the lines."

  "kn-6064":
    native: "When they see a stone snake they say pour milk, and when they see a real snake they say kill it, kill it, sir."
    notes:
      "n1": "The first two lines of a vachana of Basavanna on the same page, on worship that honours a stone snake and kills a living one. The next lines, which are not on the card, say the same of a visiting holy man and an idol."

  "kn-6065":
    native: "The chakora bird is anxious for the moon's light; the lotus is anxious for the sun's rising; the bee is anxious to drink the fragrant nectar; Yama (death) is anxious about our Lord Kudalasangama."
    notes:
      "n1": "A vachana of Basavanna set to the raga Athana on its Wikisource page. The chakora is a bird said in poetry to live on moonlight."

  "kn-6066":
    native: "Maya bore me as a mother for my birth; Maya was born as a daughter for my attachment; Maya joined me as a woman for union; in what way has this Maya tormented me; to remove this Maya is beyond me; you alone know, Lord Kudalasangama."
    notes:
      "n1": "A vachana of Basavanna on illusion (maya), on a page of its own. The page spells the word for woman as printed in the card."

  "kn-6067":
    native: "They did and did and were ruined, having no heart in it; they gave and gave and were ruined, having no truth in it; if one has the true quality of doing and giving, our Lord Kudalasangama will take him in."
    notes:
      "n1": "A vachana of Basavanna on the same page, on doing good with heart and truth."
