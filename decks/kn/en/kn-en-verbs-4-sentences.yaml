id: "kn-en-verbs-4-sentences"
kind: "layer"
core: "kn-verbs-4-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Story actions: sentences"
description: "Sentences about actions in a story: turning, pushing, slipping, blooming, serving and moving things. They use the words of the story-actions unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8292":
    native: "Turn here."
    notes:
      "n1": "ತಿರುಗು (tirugu) is the informal command, a verb stem with ಉ (u) at the end. The polite form is ತಿರುಗಿ (tirugi)."
  "kn-8293":
    native: "He pushes the car."
    notes:
      "n1": "ಕಾರನ್ನು (kārannu) is the object form of ಕಾರು (kāru) 'car', with ನ್ನು (nnu) added. ತಳ್ಳುತ್ತಾನೆ (taḷḷuttāne) ends in ಆನೆ (āne), the 'he' verb ending."
    bases:
      "ಕಾರನ್ನು": "car, here as the thing pushed: the car"
      "ತಳ್ಳುತ್ತಾನೆ": "to push, here in the third-person masculine present"
  "kn-8294":
    native: "My foot slips."
    notes:
      "n1": "ಜಾರುತ್ತದೆ (jāruttade) ends in ದೆ (de), the verb ending for a thing or an animal, so it fits ನನ್ನ (nanna) ಕಾಲು (kālu) 'my foot'."
    bases:
      "ಜಾರುತ್ತದೆ": "to slip, here in the third-person neuter present"
  "kn-8295":
    native: "The plant blooms."
    notes:
      "n1": "ಅರಳುತ್ತದೆ (araḷuttade) ends in ದೆ (de), the verb ending for a thing, and ಗಿಡ (giḍa) 'plant' is a thing."
    bases:
      "ಅರಳುತ್ತದೆ": "to bloom, here in the third-person neuter present"
  "kn-8296":
    native: "Serve the food."
    notes:
      "n1": "The verb ends the sentence, so ಬಡಿಸು (baḍisu) 'serve' comes last. ಬಡಿಸು (baḍisu) is informal; the polite form is ಬಡಿಸಿ (baḍisi)."
  "kn-8297":
    native: "Put it here."
    notes:
      "n1": "ಇಡು (iḍu) 'put' is the informal command and ಇಲ್ಲಿ (illi) 'here' comes before the verb. The polite form is ಇಡಿ (iḍi)."
  "kn-8298":
    native: "My legs shake."
    notes:
      "n1": "ನಡುಗುತ್ತದೆ (naḍuguttade) ends in ದೆ (de), the verb ending for a thing or body part, as in the foot card."
    bases:
      "ನಡುಗುತ್ತದೆ": "to shake, here in the third-person neuter present"
  "kn-8299":
    native: "Move the car."
    notes:
      "n1": "ಸರಿಸು (sarisu) 'move' is the informal command; the polite form is ಸರಿಸಿ (sarisi)."
  "kn-8300":
    native: "My head spins."
    notes:
      "n1": "ಸುತ್ತುತ್ತದೆ (suttuttade) ends in ದೆ (de), the verb ending for a thing, with ನನ್ನ (nanna) ತಲೆ (tale) 'my head' as the subject."
    bases:
      "ಸುತ್ತುತ್ತದೆ": "to turn or spin, here in the third-person neuter present"
  "kn-8301":
    native: "The children dance."
    notes:
      "n1": "ಮಕ್ಕಳು (makkaḷu) 'children' takes the plural verb ending ಆರೆ (āre). A verb stem ending in ಇ (i) adds ಯ (ya) before the ending, so ಕುಣಿ (kuṇi) becomes ಕುಣಿಯುತ್ತಾರೆ (kuṇiyuttāre)."
    bases:
      "ಕುಣಿಯುತ್ತಾರೆ": "to dance, here in the third-person plural present"
