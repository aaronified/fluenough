cards:
  "kn-7842":
    native: "Our house is quiet."
  "kn-7843":
    native: "There is a lot of noise."
    notes:
      "n1": "ಜಾಸ್ತಿ (jāsti), more or a lot, is the spoken word; ಹೆಚ್ಚು (heccu) means the same."
  "kn-7844":
    native: "He breaks the wall."
    notes:
      "n1": "The verb ends in -ಆನೆ (-āne) for he: ಒಡೆಯುತ್ತಾನೆ (oḍeyuttāne). For she it ends in -ಆಳೆ (-āḷe): ಒಡೆಯುತ್ತಾಳೆ (oḍeyuttāḷe)."
  "kn-7845":
    native: "The balcony is spacious."
  "kn-7846":
    native: "The room is cramped."
  "kn-7847":
    native: "I have a bath."
    notes:
      "n1": "In Kannada one 'does' a bath: ಸ್ನಾನ ಮಾಡು (snāna māḍu), literally 'do a bath'."
  "kn-7848":
    native: "Sit on the mat."
    notes:
      "n1": "ಕೂರಿ (kūri) is the polite command of ಕೂರು (kūru), sit; ಮೇಲೆ (mēle), on, comes after its noun: ಚಾಪೆ ಮೇಲೆ (cāpe mēle)."
  "kn-7849":
    native: "Where is your cupboard?"
  "kn-7850":
    native: "The chair is comfortable."
  "kn-7851":
    native: "What is on the roof?"
