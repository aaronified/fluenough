# Layer for kn-culture-4: each item's English rendering and a note on it.
schema: 1
id: "kn-en-culture-4"
kind: "layer"
core: "kn-culture-4"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: Colonial-era poems and children's rhymes"
description: "Eighteen short pieces from Muddana, Panje Mangesh Rao, S. G. Narasimhachar and children's rhymes and a folk song, each with its English rendering and a note. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "kn-6150":
    native: "Verse is fit to be killed, prose is pleasing to the heart; one should speak in heart-pleasing prose."
    notes:
      "n1": "A saying of Muddana that plays on the Sanskrit words for verse, to be killed, prose and pleasing to the heart. It is why his Rama Ashvamedha is mostly in prose. The kn.wikipedia page does not say which work the line comes from."

  "kn-6151":
    native: "Look over there; there is the land of the Kodagas; there is the home of the Kodavas!"
    notes:
      "n1": "A refrain from Panje Mangesh Rao's poem about Kodagu (Coorg) and its harvest festival, Huttari. The poem is in modern Kannada with a Kodagu theme."

  "kn-6152":
    native: "This is the seat of Agastya's penance, the maternal home of Mother Kaveri."
    notes:
      "n1": "A line from Panje Mangesh Rao's poem about Kodagu. The Kaveri river rises in Kodagu, so the poem calls it the river's mother's home."

  "kn-6153":
    native: "Where does the Kaveri shine and shine like lightning in the clouds?"
    notes:
      "n1": "A line from the opening verse of Panje Mangesh Rao's poem about Kodagu. The word that means like is an old form of the usual one."

  "kn-6154":
    native: "May this our Kodagu live long!"
    notes:
      "n1": "The closing line of Panje Mangesh Rao's poem about Kodagu."

  "kn-6155":
    native: "I became milk when milked, curd when it set, butter when the cream on top was churned, and ghee when heated; for whom have you been of use, O human; Hari, Hari, I am the cow."
    notes:
      "n1": "The second stanza of a poem in which a cow speaks to a man, each stanza ending with the same question and the same refrain. The word for set, said of milk turning to curd, is read from the sense of the line; a Kannada speaker should check it."

  "kn-6156":
    native: "I plough the earth and carry the load; by trampling I separate the straw; I turn poor land into a smiling grove; for whom have you been of use, O human; Hari, Hari, I am the cow."
    notes:
      "n1": "The third stanza of the same poem, on the work of the ox and cow in the field. The word for load and the word for straw are read from plain Kannada; a Kannada speaker should check them."

  "kn-6157":
    native: "I search out the waste grass in the lanes and streets, graze on it, reach home and give nectar; tell me, human who drinks it and plans harm to me, for whom have you been of use, O human; Hari, Hari, I am the cow."
    notes:
      "n1": "The last stanza of the same poem. The nectar is the cow's milk. The words for plans harm to me are read literally as thinking two ways about me; a Kannada speaker should check them."

  "kn-6160":
    native: "They are the elders of Kodagu."
    notes:
      "n1": "The last line of the second verse of Panje Mangesh Rao's Huttari Haadu, the harvest song of Kodagu. The lines before it, which are not on the card, praise the hunters and fighters of old."

  "kn-6161":
    native: "A treasury of dharma, penalty, binding rule, custom and conduct."
    notes:
      "n1": "The fourth line of the third verse of Panje Mangesh Rao's Huttari Haadu, which describes Kodagu as a land of law and custom."

  "kn-6162":
    native: "May this land that Mother blessed stay ours, with us."
    notes:
      "n1": "The fourth line of the last verse of Panje Mangesh Rao's Huttari Haadu. The mother who blessed the land is read plainly as Mother; the page does not gloss her."

  "kn-6163":
    native: "Unity, togetherness, one single mind: tell me, where is it?"
    notes:
      "n1": "The opening line of the last verse of Panje Mangesh Rao's Huttari Haadu, whose title names the Huttari harvest song of Kodagu."

  "kn-6164":
    native: "This Kodagu is the making of fate."
    notes:
      "n1": "The first of the three short lines that close the fourth verse of Panje Mangesh Rao's Huttari Haadu."

  "kn-6165":
    native: "Mother, mother, sweet potato; put it in the pot and boil it; make morsels and feed me; send me to the nursery school."
    notes:
      "n1": "A traditional children's rhyme in the speech of north Karnataka. The word for sweet potato and the word for pot are as spoken there."

  "kn-6166":
    native: "Pour, pour, rain-king; the flower garden has no water; come, come, rain-king; the banana garden has no water."
    notes:
      "n1": "A traditional children's rhyme that asks the rain to come. The rain is called a king, the word for it ending in the word for king."

  "kn-6167":
    native: "Ganesha came, ate the coconut cakes, fell into the small tank and rose out of the big tank."
    notes:
      "n1": "A traditional children's rhyme about the god Ganesha and a coconut cake, the kadubu. The words for the small and the big tank end in the spoken form of the word for in."

  "kn-6168":
    native: "We all got up in the morning and came looking for all the cows; the sun has set; it is time to milk the cows."
    notes:
      "n1": "The opening of a folk song in which the singers ask Krishna to give back their lost cow. The page names the source only as an anonymous collection of folk songs."

  "kn-6169":
    native: "Crow, crow, caw; who is coming, mother; uncle is coming, mother; what meal for uncle; a meal of raw mangoes."
    notes:
      "n1": "The opening of a traditional children's rhyme in village speech that questions the crow. The words are spoken forms."
