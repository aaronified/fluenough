# Layer for kn-proverbs-3: each proverb's literal English rendering and its meaning.
schema: 1
id: "kn-en-proverbs-3"
kind: "layer"
core: "kn-proverbs-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs 3"
description: "Twenty Kannada proverbs about love, age, honesty, effort, appearances and wit, each with a literal English rendering and its meaning. Not yet checked by a Kannada speaker: please report any mistake."
