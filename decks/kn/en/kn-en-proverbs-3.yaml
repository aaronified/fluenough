tags: ["unreviewed"]
cards:
  "kn-6300":
    native: "Heartfelt love is immortal."
    notes:
      "literal": "Said that true affection lasts forever."
    bases:
      "ಆತ್ಮೀಯವಾದ": { meaning: "heartfelt" }
      "ಪ್ರೇಮ": { meaning: "love" }
      "ಅಮರವಾದದ್ದು": { meaning: "immortal" }
  "kn-6301":
    native: "For an unwilling husband, a stone in the curd."
    notes:
      "literal": "Said that a person who does not want a match finds fault with everything."
    bases:
      "ಒಲ್ಲದ": { meaning: "unwilling" }
      "ಗಂಡನಿಗೆ": { meaning: "for the husband" }
      "ಮೊಸರಲ್ಲಿ": { meaning: "in the curd" }
      "ಕಲ್ಲು": { meaning: "stone" }
  "kn-6302":
    native: "The mother is like lac, the children like wood."
    notes:
      "literal": "Said of a mother and her children held together as lac holds to wood."
    bases:
      "ಅರಗಿನಂತೆ": { meaning: "like lac" }
      "ತಾಯಿ": { meaning: "mother" }
      "ಮರದಂತೆ": { meaning: "like wood" }
      "ಮಕ್ಕಳು": { meaning: "children" }
  "kn-6303":
    native: "If one says 'alas', that is half one's age."
    notes:
      "literal": "Said that one who gives way to every complaint seems less grown than one's years."
    bases:
      "ಅಯ್ಯೋ": { meaning: "alas" }
      "ಅಂದರೆ": { meaning: "if one says" }
      "ಅರೆ": { meaning: "half" }
      "ವಯಸ್ಸು": { meaning: "age" }
  "kn-6304":
    native: "Truth has no death; a lie has no happiness."
    notes:
      "literal": "Said that truth lasts, while lies bring no lasting peace."
    bases:
      "ಸತ್ಯಕ್ಕೆ": { meaning: "for truth" }
      "ಸಾವಿಲ್ಲ": { meaning: "there is no death" }
      "ಸುಳ್ಳಿಗೆ": { meaning: "for a lie" }
      "ಸುಖವಿಲ್ಲ": { meaning: "there is no happiness" }
  "kn-6305":
    native: "The body perishes; fame remains."
    notes:
      "literal": "Said that the body dies but a good name lasts."
    bases:
      "ಅಳಿವುದೇ": { meaning: "perishing" }
      "ಕಾಯ": { meaning: "body" }
      "ಉಳಿವುದೇ": { meaning: "remaining" }
      "ಕೀರ್ತಿ": { meaning: "fame" }
  "kn-6306":
    native: "A servant who brings good fame is better than a son who brings bad fame."
    notes:
      "literal": "Said that a good name matters more than blood relation."
    bases:
      "ಅಪಕೀರ್ತಿ": { meaning: "bad fame" }
      "ತರುವ": { meaning: "bringing" }
      "ಮಗನಿಗಿಂತ": { meaning: "than a son" }
      "ಸತ್ಕೀರ್ತಿ": { meaning: "good fame" }
      "ಆಳೇ": { meaning: "a servant" }
      "ಮೇಲು": { meaning: "better" }
  "kn-6307":
    native: "Eat what you have made, my friend."
    notes:
      "literal": "Said that everyone must bear the results of their own actions."
    bases:
      "ಮಾಡಿದ್ದುಣ್ಣೋ": { meaning: "eat what you have made" }
      "ಮಾರಾಯ": { meaning: "my friend" }
  "kn-6308":
    native: "The deed one did came following one's back."
    notes:
      "literal": "Said that one's past actions always catch up with one."
    bases:
      "ಮಾಡಿದ": { meaning: "done" }
      "ಕರ್ಮ": { meaning: "deed" }
      "ಬೆನ್ನಾಡಿ": { meaning: "following behind" }
      "ಬಂತು": { meaning: "came" }
  "kn-6309":
    native: "Desire is as big as the sky, achievement only as big as a mustard seed."
    notes:
      "literal": "Said that one's wishes far exceed what one actually achieves."
    bases:
      "ಆಸೆ": { meaning: "desire" }
      "ಆಕಾಶದಷ್ಟು": { meaning: "as big as the sky" }
      "ಸಾಧನೆ": { meaning: "achievement" }
      "ಸಾಸಿವೆಯಷ್ಟೇ": { meaning: "only as big as a mustard seed" }
  "kn-6310":
    native: "If both hands clap, there is a sound."
    notes:
      "literal": "Said that a quarrel needs two people to take part."
    bases:
      "ಎರಡೂ": { meaning: "both" }
      "ಕೈ": { meaning: "hands" }
      "ತಟ್ಟಿದರೆ": { meaning: "if they clap" }
      "ಸದ್ದು": { meaning: "sound" }
  "kn-6311":
    native: "A full pot does not splash."
    notes:
      "literal": "Said that a person of real worth is quiet and does not show off."
    bases:
      "ತುಂಬಿದ": { meaning: "full" }
      "ಕೊಡ": { meaning: "pot" }
      "ತುಳುಕುವುದಿಲ್ಲ": { meaning: "does not splash" }
  "kn-6312":
    native: "Shallow water makes a great noise."
    notes:
      "literal": "Said that shallow people make the most noise."
    bases:
      "ಆಳವಿಲ್ಲದ": { meaning: "shallow" }
      "ನೀರು": { meaning: "water" }
      "ಭಾರಿ": { meaning: "great" }
      "ಶಬ್ದ": { meaning: "noise" }
      "ಮಾಡೀತು": { meaning: "makes" }
  "kn-6313":
    native: "Under the lamp, it is always dark."
    notes:
      "literal": "Said that one often fails to notice what is nearest to oneself."
    bases:
      "ದೀಪದ": { meaning: "of the lamp" }
      "ಕೆಳಗೆ": { meaning: "under" }
      "ಯಾವತ್ತೂ": { meaning: "always" }
      "ಕತ್ತಲೇ": { meaning: "dark" }
  "kn-6314":
    native: "If the sugarcane is crooked, its sweetness is crooked too."
    notes:
      "literal": "Said that a thing's sweetness cannot be separated from its faults."
    bases:
      "ಕಬ್ಬು": { meaning: "sugarcane" }
      "ಡೊಂಕಾದ್ರೆ": { meaning: "if crooked" }
      "ಸವಿ": { meaning: "sweetness" }
      "ಡೊಂಕೇ": { meaning: "crooked too" }
  "kn-6315":
    native: "Birth nature does not go even if burnt."
    notes:
      "literal": "Said that a person's innate nature cannot be removed, even by hardship."
    bases:
      "ಹುಟ್ಟು": { meaning: "birth" }
      "ಗುಣ": { meaning: "nature" }
      "ಸುಟ್ಟರೂ": { meaning: "even if burnt" }
      "ಹೊಗೊದಿಲ್ಲ": { meaning: "does not go" }
  "kn-6316":
    native: "What the sun did not see, the poet saw."
    notes:
      "literal": "Said that a poet's imagination sees what others do not."
    bases:
      "ರವಿ": { meaning: "the sun" }
      "ಕಾಣದ್ದನ್ನು": { meaning: "what was not seen" }
      "ಕವಿ": { meaning: "poet" }
      "ಕಂಡ": { meaning: "saw" }
  "kn-6317":
    native: "A counter-spell for the teacher."
    notes:
      "literal": "Said of a clever person who outwits someone more learned than himself."
    bases:
      "ಗುರುವಿಗೇ": { meaning: "to the teacher" }
      "ತಿರುಮಂತ್ರ": { meaning: "a counter-spell" }
  "kn-6318":
    native: "If the wrestler slips, that too is a hold."
    notes:
      "literal": "Said that even a slip by a clever person can turn into an advantage."
    bases:
      "ಜಟ್ಟಿ": { meaning: "wrestler" }
      "ಜಾರಿದರೆ": { meaning: "if he slips" }
      "ಅದೂ": { meaning: "that too" }
      "ಒಂದು": { meaning: "a" }
      "ಪಟ್ಟು": { meaning: "hold" }
  "kn-6319":
    native: "Even nectar is poison in excess."
    notes:
      "literal": "Said that anything taken in excess becomes harmful."
    bases:
      "ಅತಿಯಾದರೆ": { meaning: "in excess" }
      "ಅಮೃತವೂ": { meaning: "even nectar" }
      "ವಿಷ": { meaning: "poison" }
