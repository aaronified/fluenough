schema: 1
id: "kn-en-relationships"
kind: "layer"
core: "kn-relationships"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Relationships: neighbours, friends and thank-you notes"
license: "CC-BY-SA-4.0"
description: "People we know: friends and neighbours, the family words, thanks, forgiveness and respect, and the notes we write to say so. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1589":
    native: "friendship"
    notes:
      "n1": "Friendship, a close bond with a friend."
    examples:
      "ಸ್ನೇಹ ಚೆನ್ನಾಗಿದೆ.": "The friendship is good."
      "ಅವರಿಗೆ ಸ್ನೇಹ ಇದೆ.": { native: "They have friendship.", bases: { "ಇದೆ": "have" } }
  "kn-1590":
    native: "neighbours"
    notes:
      "n1": "Neighbours, the people who live next door."
    examples:
      "ನೆರೆಹೊರೆಯವರು ಬಂದರು.": "The neighbours came."
      "ನಮ್ಮ ನೆರೆಹೊರೆಯವರು ಇದ್ದಾರೆ.": { native: "We have neighbours.", bases: { "ಇದ್ದಾರೆ": "have" } }
  "kn-1591":
    native: "thanks"
    notes:
      "n1": "Thanks, a word of gratitude."
    examples:
      "ಧನ್ಯವಾದ!": "Thank you!"
      "ನಿನಗೆ ಧನ್ಯವಾದ.": "Thanks to you."
  "kn-1592":
    native: "gratitude"
    notes:
      "n1": "Gratitude, a feeling of thanks."
    examples:
      "ಕೃತಜ್ಞತೆ ಇದೆ.": { native: "There is gratitude.", bases: { "ಇದೆ": "there is" } }
      "ಅವನಿಗೆ ಕೃತಜ್ಞತೆ ಹೇಳು.": "Say thanks to him."
  "kn-1593":
    native: "forgiveness, pardon"
    notes:
      "n1": "Forgiveness, asked for after a mistake."
    examples:
      "ಕ್ಷಮೆ ಕೇಳು.": "Ask for forgiveness."
      "ಕ್ಷಮೆ ಇದೆ.": { native: "There is forgiveness.", bases: { "ಇದೆ": "there is" } }
  "kn-1594":
    native: "respect"
    notes:
      "n1": "Respect, a high regard for someone."
    examples:
      "ಗೌರವ ಕೊಡು.": "Give respect."
      "ಹಿರಿಯರಿಗೆ ಗೌರವ ಬೇಕು.": "Elders need respect."
  "kn-1595":
    native: "quarrel"
    notes:
      "n1": "A quarrel, an angry argument between people."
    examples:
      "ಜಗಳ ಬೇಡ.": "No quarrel."
      "ಅವರಿಗೆ ಜಗಳ ಆಯಿತು.": "They quarrelled."
  "kn-1596":
    native: "companionship"
    notes:
      "n1": "Companionship, time spent together as friends."
    examples:
      "ಒಡನಾಟ ಚೆನ್ನಾಗಿದೆ.": "The companionship is good."
      "ಒಡನಾಟ ಇಷ್ಟ.": "I like companionship."
  "kn-1597":
    native: "love"
    notes:
      "n1": "Love, between two people, or for a country."
    examples:
      "ಪ್ರೇಮ ಇದೆ.": { native: "There is love.", bases: { "ಇದೆ": "there is" } }
      "ಪ್ರೇಮ ಬೇಕು.": "Love is needed."
