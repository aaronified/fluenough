schema: 1
id: "kn-en-health"
kind: "layer"
core: "kn-health"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Health and fitness"
license: "CC-BY-SA-4.0"
description: "Keeping well: exercise and yoga, food and sleep, the body's strength, and the check-ups a doctor asks for. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1298":
    native: "exercise"
    notes:
      "n1": "Exercise, such as a walk, a run or yoga, for the body."
    examples:
      "ಪ್ರತಿ ದಿನ ವ್ಯಾಯಾಮ ಮಾಡು.": "Exercise every day."
      "ವ್ಯಾಯಾಮ ಒಳ್ಳೆಯದು.": "Exercise is good."
  "kn-1299":
    native: "yoga"
    notes:
      "n1": "Yoga, a set of stretches and breathing for health."
    examples:
      "ಯೋಗ ಮಾಡುತ್ತೇನೆ.": "I do yoga."
      "ಬೆಳಿಗ್ಗೆ ಯೋಗ ಮಾಡು.": "Do yoga in the morning."
  "kn-1300":
    native: "food, diet"
    notes:
      "n1": "Food, or the diet of a person."
    examples:
      "ಆಹಾರ ಒಳ್ಳೆಯದು.": "The food is good."
      "ಒಳ್ಳೆಯ ಆಹಾರ ತಿನ್ನು.": "Eat good food."
  "kn-1301":
    native: "nutritious"
    notes:
      "n1": "Nutritious, good for health, said of food."
    examples:
      "ಪೌಷ್ಟಿಕ ಆಹಾರ.": "Nutritious food."
      "ಹಣ್ಣು ತುಂಬಾ ಪೌಷ್ಟಿಕ.": "Fruit is very nutritious."
  "kn-1302":
    native: "sleep"
    notes:
      "n1": "Sleep, the rest of the night."
    examples:
      "ನಿದ್ರೆ ಬೇಕು.": "I need sleep."
      "ರಾತ್ರಿ ಚೆನ್ನಾಗಿ ನಿದ್ರೆ ಮಾಡು.": "Sleep well at night."
  "kn-1303":
    native: "fat"
    notes:
      "n1": "Fat, in food or in the body."
    examples:
      "ಕೊಬ್ಬು ಹೆಚ್ಚು ಆಯಿತು.": "The fat went up."
      "ಕೊಬ್ಬು ಕಡಿಮೆ ಮಾಡು.": "Reduce the fat."
  "kn-1304":
    native: "blood pressure"
    notes:
      "n1": "Blood pressure, measured by a doctor."
    examples:
      "ರಕ್ತದೊತ್ತಡ ನೋಡು.": "Check the blood pressure."
      "ರಕ್ತದೊತ್ತಡ ಹೆಚ್ಚು ಇದೆ.": { native: "The blood pressure is high.", bases: { "ಇದೆ": "is" } }
  "kn-1305":
    native: "body"
    notes:
      "n1": "The body of a person or an animal."
    examples:
      "ದೇಹ ಚೆನ್ನಾಗಿದೆ.": "The body is well."
      "ದೇಹಕ್ಕೆ ವ್ಯಾಯಾಮ ಬೇಕು.": { native: "The body needs exercise.", bases: { "ದೇಹಕ್ಕೆ": "for the body" } }
  "kn-1306":
    native: "energy, power"
    notes:
      "n1": "Energy, the power to do work."
    examples:
      "ಶಕ್ತಿ ಇದೆ.": { native: "There is energy.", bases: { "ಇದೆ": "there is" } }
      "ಊಟ ಮಾಡಿದ ಮೇಲೆ ಶಕ್ತಿ ಬರುತ್ತದೆ.": "After eating, energy comes."
  "kn-1307":
    native: "breath"
    notes:
      "n1": "Breath, the air taken in and let out."
    examples:
      "ಉಸಿರು ಇದೆ.": { native: "There is breath.", bases: { "ಇದೆ": "there is" } }
      "ಉಸಿರು ಬಿಡು.": "Breathe out."
  "kn-1308":
    native: "mind, heart"
    notes:
      "n1": "The mind, or the heart, where feelings are."
    examples:
      "ಮನಸ್ಸು ಚೆನ್ನಾಗಿದೆ.": "The mind is well."
      "ಮನಸ್ಸಿಗೆ ವಿಶ್ರಾಂತಿ ಬೇಕು.": { native: "The mind needs rest.", bases: { "ಮನಸ್ಸಿಗೆ": "for the mind" } }
  "kn-1309":
    native: "meditation"
    notes:
      "n1": "Meditation, sitting still and calm, to rest the mind."
    examples:
      "ಧ್ಯಾನ ಮಾಡು.": "Meditate."
      "ಬೆಳಿಗ್ಗೆ ಧ್ಯಾನ ಒಳ್ಳೆಯದು.": "Meditation in the morning is good."
  "kn-1310":
    native: "check-up"
    notes:
      "n1": "A check-up or an examination by a doctor."
    examples:
      "ತಪಾಸಣೆ ಮಾಡು.": "Do a check-up."
      "ತಪಾಸಣೆ ಬೇಕು.": "A check-up is needed."
  "kn-1311":
    native: "disease, sickness"
    notes:
      "n1": "A sickness or a disease that lasts."
    examples:
      "ಕಾಯಿಲೆ ಇದೆ.": { native: "There is a sickness.", bases: { "ಇದೆ": "there is" } }
      "ಕಾಯಿಲೆ ಗುಣವಾಯಿತು.": "The disease healed."
  "kn-1312":
    native: "healthy"
    notes:
      "n1": "Healthy, good for health."
    examples:
      "ಆರೋಗ್ಯಕರ ಆಹಾರ.": "Healthy food."
      "ಈ ಊಟ ಆರೋಗ್ಯಕರ.": "This meal is healthy."
  "kn-1313":
    native: "weak"
    notes:
      "n1": "Weak, with little strength. The opposite is ಬಲವಾದ (balavāda)."
    examples:
      "ಅವಳು ದುರ್ಬಲ.": "She is weak."
      "ದೇಹ ದುರ್ಬಲ ಆಯಿತು.": "The body became weak."
  "kn-1314":
    native: "strong"
    notes:
      "n1": "Strong, with much strength."
    examples:
      "ಅವನು ಬಲವಾದ.": "He is strong."
      "ಬಲವಾದ ಕೈ.": "A strong hand."
  "kn-1315":
    native: "well, healthy"
    notes:
      "n1": "Well and healthy, in good health."
    examples:
      "ನಾನು ಸ್ವಸ್ಥ.": "I am well."
      "ಅಜ್ಜಿ ಸ್ವಸ್ಥ ಇದ್ದಾರೆ.": { native: "Grandmother is well.", bases: { "ಇದ್ದಾರೆ": "is" } }
  "kn-1316":
    native: "smoking"
    notes:
      "n1": "Smoking, the habit of smoking tobacco."
    examples:
      "ಧೂಮಪಾನ ಬೇಡ.": "No smoking."
      "ಧೂಮಪಾನ ಬಿಡು.": "Quit smoking."
  "kn-1317":
    native: "to breathe"
    notes:
      "n1": "To breathe in and out."
    examples:
      "ಅವನು ಉಸಿರಾಡುತ್ತಾನೆ.": { native: "He breathes.", bases: { "ಉಸಿರಾಡುತ್ತಾನೆ": "breathes" } }
      "ಅವರು ಉಸಿರಾಡುತ್ತಾರೆ.": { native: "They breathe.", bases: { "ಉಸಿರಾಡುತ್ತಾರೆ": "breathe" } }
  "kn-1318":
    native: "to sleep"
    notes:
      "n1": "To fall asleep, or to be asleep."
    examples:
      "ಮಕ್ಕಳು ನಿದ್ರಿಸುತ್ತಿದ್ದಾರೆ.": { native: "The children are sleeping.", bases: { "ನಿದ್ರಿಸುತ್ತಿದ್ದಾರೆ": "are sleeping" } }
      "ಅವಳು ಬೇಗ ನಿದ್ರಿಸುತ್ತಾಳೆ.": { native: "She falls asleep quickly.", bases: { "ನಿದ್ರಿಸುತ್ತಾಳೆ": "falls asleep" } }
