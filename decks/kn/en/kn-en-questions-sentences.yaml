cards:
  "kn-7000":
    notes:
      "n1": "ನೀವು (nīvu) with ಯಾರು (yāru) is the polite 'who are you'; to a friend, ನೀನು (nīnu) is used."
    native: "Who are you?"
  "kn-7001":
    native: "Who is she?"
  "kn-7002":
    notes:
      "n1": "ಅದು (adu), 'that', points at things; for a person the polite form is ಅವರು (avaru)."
    native: "Who is that?"
  "kn-7003":
    notes:
      "n1": "ಅಲ್ಲ (alla), not, comes after the noun or ಅದು (adu) to negate it."
    native: "That is not it."
    alt_native: ["No, not that."]
  "kn-7004":
    notes:
      "n1": "ನಿಮ್ಮ (nimma), your, is the polite form of ನಿನ್ನ (ninna), your, for one person."
    native: "Where is your car?"
  "kn-7005":
    native: "How much is this?"
  "kn-7006":
    native: "How is this?"
  "kn-7007":
    notes:
      "n1": "ಹೋಗುತ್ತೀರಿ (hōguttīri), you go, is the polite future form of ಹೋಗು (hōgu), to go."
    native: "When will you go?"
