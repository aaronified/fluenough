schema: 1
id: "kn-en-grammar-articles"
kind: "layer"
core: "kn-grammar-articles"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "No articles: a and the"
license: "CC0-1.0"
description: "Kannada has no 'a' or 'the'. How it says them anyway. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0309":
    native: "The book is on the table."
    notes:
      "n1": "A noun alone is usually 'the': the one we both know about."
  "kn-0310":
    native: "A boy came."
    notes:
      "n1": "'One' serves for 'a'. For a man it is ಒಬ್ಬ (obba), for a woman ಒಬ್ಬಳು (obbaḷu), for a thing ಒಂದು (ondu)."
  "kn-0311":
    native: "The boy came."
  "kn-0312":
    native: "One coffee, please."
  "kn-0313":
    native: "Someone has come."
    notes:
      "n1": "-ಓ (-ō) on a question word makes it 'some': ಯಾರೋ (yārō), someone; ಏನೋ (ēnō), something; ಎಲ್ಲೋ (ellō), somewhere."
