native: { code: "en", iso639_3: "eng", name: "English" }
name: "Relationships: neighbours, friends and thank-you notes: sentences"
description: "Sentences about friends, neighbours and thanks: a friend, a quarrel, respect and forgiveness, and saying thank you. They use the words of the relationships unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8282":
    native: "He is my friend."
    notes:
      "n1": "ಅವನು (avanu) 'he' stands before ಗೆಳೆಯ (geḷeya) 'friend' with no verb for 'is'. For a female friend the word is ಗೆಳತಿ (geḷati)."
  "kn-8283":
    native: "Thank you."
    notes:
      "n1": "ನಿನಗೆ (ninage) is the dative 'to you' for a close or informal 'you'. For a person you respect use ನಿಮಗೆ (nimage)."
    bases:
      "ನಿನಗೆ": "you, in the dative: to you"
  "kn-8284":
    native: "I am grateful to you."
    notes:
      "n1": "ನಿಮಗೆ (nimage) is the polite 'to you'. The sentence has no verb, so it is literally 'to you, gratitude'."
    bases:
      "ನಿಮಗೆ": "you, in the dative: to you, polite"
  "kn-8285":
    native: "Forgive me."
    notes:
      "n1": "ನನ್ನನ್ನು (nannannu) is 'me' as the object, from ನಾನು (nānu) 'I'. ಕ್ಷಮಿಸಿ (kṣamisi) is the polite command 'forgive'."
    bases:
      "ನನ್ನನ್ನು": "I, as the one forgiven: me"
  "kn-8286":
    native: "There is a quarrel."
    notes:
      "n1": "ಇದೆ (ide) 'there is' is used for things and abstract ideas, while ಇದ್ದಾರೆ (iddāre) is used for people."
    bases:
      "ಇದೆ": "to be or exist, here for a thing"
  "kn-8287":
    native: "Who are our neighbours?"
    notes:
      "n1": "ಯಾರು (yāru) asks 'who' about people, and comes after the noun. ನಮ್ಮ (namma) 'our' comes before it."
  "kn-8288":
    native: "Friendship is good."
    notes:
      "n1": "ಸ್ನೇಹ (snēha) 'friendship' and ಒಳ್ಳೆಯದು (oḷḷeyadu) 'good' stand side by side with no verb."
  "kn-8289":
    native: "Show respect."
    notes:
      "n1": "Kannada says ಗೌರವ (gaurava) ಕೊಡು (koḍu) 'give respect' where English says 'show respect'. The verb ಕೊಡು (koḍu) 'give' is informal."
  "kn-8290":
    native: "Her company is good."
    notes:
      "n1": "ಅವಳ (avaḷa) 'her' is the possessive form of ಅವಳು (avaḷu) and comes before the noun it describes."
  "kn-8291":
    native: "I ask for forgiveness."
    notes:
      "n1": "ಕ್ಷಮೆ (kṣame) ಕೇಳು (kēḷu) is a set phrase: ಕೇಳು (kēḷu) 'ask' is used with ಕ್ಷಮೆ (kṣame) 'forgiveness' to mean 'ask for forgiveness'."
    bases:
      "ಕೇಳುತ್ತೇನೆ": "to ask or hear, here in the first-person present"
