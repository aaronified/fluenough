schema: 1
id: "kn-en-school"
kind: "layer"
core: "kn-school"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "School"
license: "CC-BY-SA-4.0"
description: "School life: the class and the lesson, pens and books, homework and tests, marks and holidays, and the subjects. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1108":
    native: "class, classroom"
    notes:
      "n1": "A class, or a classroom; the class of a year is ತರಗತಿ (taragati) too."
    examples:
      "ತರಗತಿಯಲ್ಲಿ ಮಕ್ಕಳು ಇದ್ದಾರೆ.": { native: "The children are in the class.", bases: { "ತರಗತಿಯಲ್ಲಿ": "in the class", "ಇದ್ದಾರೆ": "are" } }
      "ತರಗತಿ ಈಗ ಮುಗಿಯಿತು.": { native: "Class is over now.", bases: { "ಮುಗಿಯಿತು": "is over" } }
  "kn-1109":
    native: "lesson"
    notes:
      "n1": "A lesson, taught in class; a school reading is also called this."
    examples:
      "ಇಂದು ಹೊಸ ಪಾಠ ಇದೆ.": { native: "There is a new lesson today.", bases: { "ಇದೆ": "there is" } }
      "ಪಾಠ ಓದು.": "Read the lesson."
  "kn-1110":
    native: "pencil"
    notes:
      "n1": "A pencil, for writing and drawing."
    examples:
      "ಪೆನ್ಸಿಲ್ ಬೇಕು.": "I need a pencil."
      "ಪೆನ್ಸಿಲ್ ಕತ್ತರಿಸು.": "Cut the pencil."
  "kn-1111":
    native: "eraser, rubber"
    notes:
      "n1": "An eraser, to rub out pencil marks."
    examples:
      "ರಬ್ಬರ್ ಎಲ್ಲಿ?": "Where is the eraser?"
      "ರಬ್ಬರ್ ಕೊಡು.": "Give me the eraser."
  "kn-1112":
    native: "notebook"
    notes:
      "n1": "A notebook, for writing notes and homework."
    examples:
      "ನೋಟ್ಬುಕ್ ತೆಗೆದುಕೊ.": "Take the notebook."
      "ನೋಟ್ಬುಕ್ ಹೊಸದು.": "The notebook is new."
  "kn-1113":
    native: "board"
    notes:
      "n1": "The board at the front of the class, for writing with chalk."
    examples:
      "ಬೋರ್ಡ್ ನೋಡು.": "Look at the board."
      "ಶಿಕ್ಷಕರು ಬೋರ್ಡ್ ಮೇಲೆ ಬರೆದರು.": "The teacher wrote on the board."
  "kn-1114":
    native: "mark, score"
    notes:
      "n1": "A mark or a score in a test."
    examples:
      "ಪರೀಕ್ಷೆಯಲ್ಲಿ ಎಷ್ಟು ಅಂಕ?": "How many marks in the test?"
      "ಅಂಕ ಚೆನ್ನಾಗಿದೆ.": "The marks are good."
  "kn-1115":
    native: "game, play"
    notes:
      "n1": "A game, played in the playground."
    examples:
      "ಮಕ್ಕಳು ಆಟ ಆಡುತ್ತಾರೆ.": "The children play a game."
      "ಮಕ್ಕಳ ಆಟ ಇದೆ.": { native: "There is a game of the children.", bases: { "ಇದೆ": "there is" } }
  "kn-1116":
    native: "uniform"
    notes:
      "n1": "A school uniform, worn every day in school."
    examples:
      "ಸಮವಸ್ತ್ರ ಹಾಕು.": { native: "Wear the uniform.", bases: { "ಹಾಕು": "wear" } }
      "ಶಾಲೆಗೆ ಸಮವಸ್ತ್ರ ಬೇಕು.": "School needs a uniform."
  "kn-1117":
    native: "answer"
    notes:
      "n1": "An answer to a question. The question is ಪ್ರಶ್ನೆ (praśne)."
    examples:
      "ಉತ್ತರ ಗೊತ್ತಿದೆ.": { native: "I know the answer.", bases: { "ಗೊತ್ತಿದೆ": "is known" } }
      "ಉತ್ತರ ಬರೆ.": "Write the answer."
  "kn-1118":
    native: "question"
    notes:
      "n1": "A question, asked in class."
    examples:
      "ಪ್ರಶ್ನೆ ಕೇಳು.": "Ask a question."
      "ಈ ಪ್ರಶ್ನೆ ಕಷ್ಟ.": "This question is hard."
  "kn-1119":
    native: "homework"
    notes:
      "n1": "Homework, work to do at home after school."
    examples:
      "ಗೃಹಪಾಠ ಮುಗಿಸಿದೆ.": { native: "I finished the homework.", bases: { "ಮುಗಿಸಿದೆ": "finished" } }
      "ಗೃಹಪಾಠ ಇದೆ.": { native: "There is homework.", bases: { "ಇದೆ": "there is" } }
  "kn-1120":
    native: "practice"
    notes:
      "n1": "Practice, doing something again and again to learn it. A habit is also ಅಭ್ಯಾಸ (abhyāsa)."
    examples:
      "ದಿನ ಅಭ್ಯಾಸ ಮಾಡು.": "Practise every day."
      "ಅಭ್ಯಾಸ ಬೇಕು.": "Practice is needed."
  "kn-1121":
    native: "wrong, mistake"
    notes:
      "n1": "Wrong. A mistake is also ತಪ್ಪು (tappu). The opposite is ಸರಿ (sari)."
    examples:
      "ಉತ್ತರ ತಪ್ಪು.": "The answer is wrong."
      "ನನ್ನ ತಪ್ಪು ಆಯಿತು.": "It was my mistake."
  "kn-1122":
    native: "friend, female"
    notes:
      "n1": "A friend, a woman or a girl."
    examples:
      "ಗೆಳತಿ ಶಾಲೆಗೆ ಬಂದಳು.": "The friend came to school."
      "ಗೆಳತಿ ಪುಸ್ತಕ ಓದುತ್ತಾಳೆ.": "The friend reads a book."
  "kn-1123":
    native: "subject, topic"
    notes:
      "n1": "A subject at school, such as maths or science."
    examples:
      "ಗಣಿತ ನನ್ನ ವಿಷಯ.": "Maths is my subject."
      "ವಿಷಯ ಕಷ್ಟ.": "The subject is hard."
  "kn-1124":
    native: "mathematics"
    notes:
      "n1": "Maths, the subject of numbers."
    examples:
      "ಗಣಿತ ಕಷ್ಟ.": "Maths is hard."
      "ಗಣಿತ ಪರೀಕ್ಷೆ ಇದೆ.": { native: "There is a maths test.", bases: { "ಇದೆ": "there is" } }
  "kn-1125":
    native: "science"
    notes:
      "n1": "Science, the subject of nature and experiments."
    examples:
      "ವಿಜ್ಞಾನ ಇಷ್ಟ.": "I like science."
      "ವಿಜ್ಞಾನ ಪುಸ್ತಕ ಹೊಸದು.": "The science book is new."
  "kn-1126":
    native: "English"
    notes:
      "n1": "English, the language and the subject."
    examples:
      "ಇಂಗ್ಲಿಷ್ ಕಲಿ.": "Learn English."
      "ಇಂಗ್ಲಿಷ್ ಪಾಠ ಇದೆ.": { native: "There is an English lesson.", bases: { "ಇದೆ": "there is" } }
  "kn-1127":
    native: "Kannada"
    notes:
      "n1": "Kannada, the language of this course, and a school subject."
    examples:
      "ಕನ್ನಡ ಪುಸ್ತಕ ಓದು.": "Read the Kannada book."
      "ಕನ್ನಡ ತರಗತಿ ಇದೆ.": { native: "There is a Kannada class.", bases: { "ಇದೆ": "there is" } }
