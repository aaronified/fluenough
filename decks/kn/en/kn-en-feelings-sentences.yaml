schema: 1
id: "kn-en-feelings-sentences"
kind: "layer"
core: "kn-feelings-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Feelings and moods: sentences"
description: "Sentences about feelings: happy, tired, afraid, bored and proud, and asking what is wrong. They use the words of the feelings unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Kannada speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "kn-8241":
    notes:
      "n1": "The person who feels it takes the ending ಗೆ (ge), as in ನನಗೆ (nanage), to me, and the feeling, ಖುಷಿ (khuṣi), is the subject."
    native: "I am very happy."
    bases:
      "ನನಗೆ": "I, in the dative: to me"
  "kn-8242":
    notes:
      "n1": "The person takes the ending ಗೆ (ge), as in ಅವನಿಗೆ (avanige), to him; ಭಯ (bhaya) is fear, a noun."
    native: "He is afraid."
    bases:
      "ಅವನಿಗೆ": "he, in the dative: to him"
  "kn-8243":
    notes:
      "n1": "The same pattern: the person takes the ending ಗೆ (ge), as in ಅವಳಿಗೆ (avaḷige), to her."
    native: "She is bored."
    bases:
      "ಅವಳಿಗೆ": "she, in the dative: to her"
  "kn-8244":
    native: "Why are you sad?"
  "kn-8245":
    notes:
      "n1": "ಅಮ್ಮನ (ammana) is ಅಮ್ಮ (amma), mother, with the of-ending ನ (na); the owner comes first."
    native: "A mother's love is good."
    bases:
      "ಅಮ್ಮನ": "mother, here in the genitive: a mother's"
  "kn-8246":
    native: "This is a surprise."
  "kn-8247":
    notes:
      "n1": "ನಿನ್ನ (ninna), your, is the of-form of ನೀನು (nīnu), you to a close friend."
    native: "What is your worry?"
  "kn-8248":
    native: "There is peace."
    bases:
      "ಇದೆ": "to be or exist, here for a thing"
  "kn-8249":
    notes:
      "n1": "ಹೆದರುತ್ತೇನೆ (hedaruttēne) is the verb, to be afraid; ಭಯ (bhaya) is the noun, fear."
    native: "I am afraid."
    bases:
      "ಹೆದರುತ್ತೇನೆ": "to be afraid, here in the first-person present"
  "kn-8250":
    notes:
      "n1": "The person takes the ending ಗೆ (ge), as in ನನಗೆ (nanage), to me, with ಆಯಾಸ (āyāsa), tiredness, as the subject."
    native: "I am very tired."
    bases:
      "ನನಗೆ": "I, in the dative: to me"
