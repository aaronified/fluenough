cards:
  "kn-7509":
    native: "This is urgent."
  "kn-7510":
    notes:
      "n1": "ಬನ್ನಿ (banni) is the polite command for come; ಬಾ (bā) is the plain one."
    native: "Danger, come outside!"
    bases:
      "ಹೊರಗೆ": "outside"
      "ಬನ್ನಿ": "come (polite)"
  "kn-7511":
    notes:
      "n1": "The person takes the ending ಗೆ (ge), as in ನಮಗೆ (namage), to us; the thing needed is the subject of ಬೇಕು (bēku)."
    native: "We need an ambulance."
    bases:
      "ನಮಗೆ": "to us"
      "ಬೇಕು": "needed"
  "kn-7512":
    notes:
      "n1": "ಸಹಾಯಕ್ಕೆ (sahāyakke), for help, adds the ending ಕ್ಕೆ (kke) to ಸಹಾಯ (sahāya)."
    native: "Please shout for help."
  "kn-7513":
    native: "Blow the whistle."
    bases:
      "ಊದಿ": "to blow (polite)"
  "kn-7514":
    notes:
      "n1": "A feeling comes to a person: ನನಗೆ (nanage), to me, and ಹೆದರಿಕೆ (hedarike), fear, is the subject of ಆಗುತ್ತಿದೆ (āguttide)."
    native: "I am getting scared."
    bases:
      "ನನಗೆ": "to me"
      "ಆಗುತ್ತಿದೆ": "to become (it is)"
  "kn-7515":
    notes:
      "n1": "ಬೇಡ (bēḍa) means no need: ಆತುರ (ātura) ಬೇಡ (bēḍa), no hurry."
    native: "Be careful, no hurry!"
    bases:
      "ಬೇಡ": "no need; do not"
  "kn-7516":
    native: "The fire service is here."
    bases:
      "ಇದೆ": "is"
