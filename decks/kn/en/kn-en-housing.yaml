schema: 1
id: "kn-en-housing"
kind: "layer"
core: "kn-housing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Housing and renting"
license: "CC-BY-SA-4.0"
description: "Renting a home: the flat and its floor, the tenant and the owner, the advance and the agreement, and the rooms and the lift. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1598":
    native: "flat, apartment"
    notes:
      "n1": "A flat, one home in a building of many homes."
    examples:
      "ಫ್ಲ್ಯಾಟ್ ಬೇಕು.": "I need a flat."
      "ಫ್ಲ್ಯಾಟ್ ದೊಡ್ಡದು.": "The flat is big."
  "kn-1599":
    native: "bathroom"
    notes:
      "n1": "A bathroom, with a tap and a shower."
    examples:
      "ಬಾತ್ರೂಮ್ ಎಲ್ಲಿ?": "Where is the bathroom?"
      "ಬಾತ್ರೂಮ್ ಸ್ವಚ್ಛ ಇದೆ.": { native: "The bathroom is clean.", bases: { "ಇದೆ": "is" } }
  "kn-1600":
    native: "tenant"
    notes:
      "n1": "A tenant, a person who pays rent to live in a house."
    examples:
      "ಬಾಡಿಗೆದಾರ ಬಂದ.": "The tenant came."
      "ಬಾಡಿಗೆದಾರರು ಹಣ ಕೊಟ್ಟರು.": { native: "The tenants paid money.", bases: { "ಬಾಡಿಗೆದಾರರು": "the tenants" } }
  "kn-1601":
    native: "advance, deposit"
    notes:
      "n1": "An advance, a deposit paid before you move in."
    examples:
      "ಮುಂಗಡ ಎಷ್ಟು?": "How much is the advance?"
      "ಮುಂಗಡ ಕೊಡು.": "Pay the advance."
  "kn-1602":
    native: "agreement, contract"
    notes:
      "n1": "An agreement or a contract, signed by two sides."
    examples:
      "ಒಪ್ಪಂದ ಆಯಿತು.": "The agreement was made."
      "ಒಪ್ಪಂದದಲ್ಲಿ ಸಹಿ ಮಾಡು.": { native: "Sign the agreement.", bases: { "ಒಪ್ಪಂದದಲ್ಲಿ": "in the agreement" } }
  "kn-1603":
    native: "terms, conditions"
    notes:
      "n1": "The terms or the conditions of a rental."
    examples:
      "ಕರಾರು ಓದು.": "Read the terms."
      "ಕರಾರು ಚೆನ್ನಾಗಿದೆ.": "The terms are good."
  "kn-1604":
    native: "own"
    notes:
      "n1": "Own, belonging to oneself. A house of one's own is a ಸ್ವಂತ ಮನೆ (svanta mane)."
    examples:
      "ನನ್ನ ಸ್ವಂತ ಮನೆ ಇದೆ.": { native: "I have my own house.", bases: { "ಇದೆ": "have" } }
      "ಸ್ವಂತ ಮನೆ ಬೇಕು.": "I need my own house."
  "kn-1605":
    native: "residence"
    notes:
      "n1": "A residence, the place where one lives."
    examples:
      "ನಿವಾಸ ಎಲ್ಲಿ?": "Where is the residence?"
      "ನಿವಾಸ ದೂರ ಇದೆ.": { native: "The residence is far.", bases: { "ಇದೆ": "is" } }
  "kn-1606":
    native: "apartment building"
    notes:
      "n1": "An apartment building, with many flats."
    examples:
      "ಅಪಾರ್ಟ್ಮೆಂಟ್ ದೊಡ್ಡದು.": "The apartment building is big."
      "ಅಪಾರ್ಟ್ಮೆಂಟ್ ಎತ್ತರ.": "The building is tall."
  "kn-1607":
    native: "parking"
    notes:
      "n1": "A parking place for a vehicle."
    examples:
      "ಪಾರ್ಕಿಂಗ್ ಇದೆ.": { native: "There is parking.", bases: { "ಇದೆ": "there is" } }
      "ಪಾರ್ಕಿಂಗ್ ಬೇಕು.": "I need parking."
  "kn-1608":
    native: "lift, elevator"
    notes:
      "n1": "A lift, which carries people up and down a building."
    examples:
      "ಲಿಫ್ಟ್ ಎಲ್ಲಿ?": "Where is the lift?"
      "ಲಿಫ್ಟ್ ಕೆಲಸ ಮಾಡುತ್ತಿಲ್ಲ.": "The lift is not working."
  "kn-1609":
    native: "address"
    notes:
      "n1": "An address, where a person lives."
    examples:
      "ವಿಳಾಸ ಎಲ್ಲಿ?": "Where is the address?"
      "ವಿಳಾಸ ಬರೆ.": "Write the address."
