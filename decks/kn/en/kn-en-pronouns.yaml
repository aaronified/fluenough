schema: 1
id: "kn-en-pronouns"
kind: "layer"
core: "kn-pronouns"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Pronouns and people words"
license: "CC-BY-SA-4.0"
description: "I, you, he, she, we, and the words for my, your, his and her. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-0610":
    native: "I"
    notes:
      "n1": "The possessive before a noun is ನನ್ನ (nanna), my."
    examples:
      "ನಾನು ಮನೆಗೆ ಹೋಗುತ್ತೇನೆ.": { native: "I will go home.", bases: { "ಮನೆಗೆ": "home", "ಹೋಗುತ್ತೇನೆ": "to go" } }
      "ನಾನು ಕಾಫಿ ಕುಡಿಯುತ್ತೇನೆ.": { native: "I drink coffee.", bases: { "ಕಾಫಿ": "coffee", "ಕುಡಿಯುತ್ತೇನೆ": "to drink" } }
  "kn-0611":
    native: "you (to a close friend or a child)"
    notes:
      "n1": "The polite word for you is ನೀವು (nīvu); see the word list of this unit."
    examples:
      "ನೀನು ಎಲ್ಲಿ ಇದ್ದೀಯ?": { native: "Where are you?", bases: { "ಎಲ್ಲಿ": "where", "ಇದ್ದೀಯ": "to be" } }
      "ನೀನು ಚೆನ್ನಾಗಿ ಓದುತ್ತೀಯ.": { native: "You read well.", bases: { "ಓದುತ್ತೀಯ": "to read" } }
  "kn-0612":
    native: "he"
    notes:
      "n1": "The possessive before a noun is ಅವನ (avana), his."
    examples:
      "ಅವನು ಊಟ ಮಾಡುತ್ತಾನೆ.": { native: "He has a meal.", bases: { "ಊಟ": "meal", "ಮಾಡುತ್ತಾನೆ": "to do" } }
      "ಅವನು ಬೆಳಿಗ್ಗೆ ಎದ್ದೇಳುತ್ತಾನೆ.": { native: "He gets up in the morning.", bases: { "ಬೆಳಿಗ್ಗೆ": "in the morning", "ಎದ್ದೇಳುತ್ತಾನೆ": "to get up" } }
  "kn-0613":
    native: "she"
    notes:
      "n1": "The possessive before a noun is ಅವಳ (avaḷa), her."
    examples:
      "ಅವಳು ಪುಸ್ತಕ ಓದುತ್ತಾಳೆ.": { native: "She reads a book.", bases: { "ಪುಸ್ತಕ": "book", "ಓದುತ್ತಾಳೆ": "to read" } }
      "ಅವಳು ಶಾಲೆಗೆ ಹೋಗುತ್ತಾಳೆ.": { native: "She goes to school.", bases: { "ಶಾಲೆಗೆ": "to school", "ಹೋಗುತ್ತಾಳೆ": "to go" } }
  "kn-0614":
    native: "it; that (a thing)"
    notes:
      "n1": "For things and animals; the plural for things is ಅವು (avu), those things."
    examples:
      "ಅದು ದೊಡ್ಡ ಮನೆ.": { native: "That is a big house.", bases: { "ದೊಡ್ಡ": "big", "ಮನೆ": "house" } }
      "ಅದು ಹೊಸ ಪುಸ್ತಕ.": { native: "That is a new book.", bases: { "ಹೊಸ": "new", "ಪುಸ್ತಕ": "book" } }
  "kn-0615":
    native: "this (a thing)"
    notes:
      "n1": "The plural for things is ಇವು (ivu), these things."
    examples:
      "ಇದು ನನ್ನ ಪುಸ್ತಕ.": { native: "This is my book.", bases: { "ನನ್ನ": "my", "ಪುಸ್ತಕ": "book" } }
      "ಇದು ಚಿಕ್ಕ ಮನೆ.": { native: "This is a small house.", bases: { "ಚಿಕ್ಕ": "small", "ಮನೆ": "house" } }
  "kn-0616":
    native: "we"
    notes:
      "n1": "The possessive before a noun is ನಮ್ಮ (namma), our."
    examples:
      "ನಾವು ಕನ್ನಡ ಕಲಿಯುತ್ತೇವೆ.": { native: "We learn Kannada.", bases: { "ಕನ್ನಡ": "Kannada", "ಕಲಿಯುತ್ತೇವೆ": "to learn" } }
      "ನಾವು ಇಲ್ಲಿ ಇದ್ದೇವೆ.": { native: "We are here.", bases: { "ಇದ್ದೇವೆ": "to be" } }
  "kn-0617":
    native: "these people; they (polite)"
    notes:
      "n1": "For people, politely: ಇವರು (ivaru) is used for one or more people."
    examples:
      "ಇವರು ನನ್ನ ಸ್ನೇಹಿತರು.": { native: "These are my friends.", bases: { "ನನ್ನ": "my", "ಸ್ನೇಹಿತರು": "friends" } }
      "ಇವರು ಶಿಕ್ಷಕರು.": { native: "These are teachers.", bases: { "ಶಿಕ್ಷಕರು": "teachers" } }
  "kn-0618":
    native: "oneself; himself; herself"
    notes:
      "n1": "By oneself is ತಾನೇ (tānē)."
    examples:
      "ಅವನು ತಾನೇ ಮಾಡುತ್ತಾನೆ.": { native: "He does it himself.", bases: { "ತಾನೇ": "oneself", "ಮಾಡುತ್ತಾನೆ": "to do" } }
      "ಅವಳು ತನ್ನ ಕೆಲಸ ಮಾಡುತ್ತಾಳೆ.": { native: "She does her own work.", bases: { "ತನ್ನ": "own", "ಕೆಲಸ": "work", "ಮಾಡುತ್ತಾಳೆ": "to do" } }
  "kn-0619":
    native: "my"
    notes:
      "n1": "Before a noun: ನನ್ನ ಹೆಸರು (nanna hesaru), my name."
    examples:
      "ನನ್ನ ಹೆಸರು ರವಿ.": { native: "My name is Ravi.", bases: { "ಹೆಸರು": "name", "ರವಿ": "Ravi" } }
      "ನನ್ನ ಮನೆ ದೊಡ್ಡದು.": { native: "My house is big.", bases: { "ಮನೆ": "house", "ದೊಡ್ಡದು": "big" } }
  "kn-0620":
    native: "your (to a close friend)"
    notes:
      "n1": "Before a noun, for ನೀನು (nīnu), you."
    examples:
      "ನಿನ್ನ ಹೆಸರು ಏನು?": { native: "What is your name?", bases: { "ಹೆಸರು": "name" } }
      "ನಿನ್ನ ಪುಸ್ತಕ ಎಲ್ಲಿದೆ?": { native: "Where is your book?", bases: { "ಪುಸ್ತಕ": "book", "ಎಲ್ಲಿದೆ": "to be" } }
  "kn-0621":
    native: "your (polite, or of several people)"
    notes:
      "n1": "The polite word for your, before a noun."
    examples:
      "ನಿಮ್ಮ ಮನೆ ಎಲ್ಲಿದೆ?": { native: "Where is your house?", bases: { "ಮನೆ": "house", "ಎಲ್ಲಿದೆ": "to be" } }
      "ನಿಮ್ಮ ಹೆಸರು ಏನು?": { native: "What is your name?", bases: { "ಹೆಸರು": "name" } }
  "kn-0622":
    native: "his"
    notes:
      "n1": "Before a noun: ಅವನ ಪುಸ್ತಕ (avana pustaka), his book."
    examples:
      "ಅವನ ಪುಸ್ತಕ ಹೊಸದು.": { native: "His book is new.", bases: { "ಪುಸ್ತಕ": "book", "ಹೊಸದು": "new" } }
      "ಅವನ ಅಣ್ಣ ಇಲ್ಲಿ ಇದ್ದಾನೆ.": { native: "His elder brother is here.", bases: { "ಅಣ್ಣ": "elder brother", "ಇದ್ದಾನೆ": "to be" } }
  "kn-0623":
    native: "her"
    notes:
      "n1": "Before a noun: ಅವಳ ಮನೆ (avaḷa mane), her house."
    examples:
      "ಅವಳ ಮನೆ ದೊಡ್ಡದು.": { native: "Her house is big.", bases: { "ಮನೆ": "house", "ದೊಡ್ಡದು": "big" } }
      "ಅವಳ ಸ್ನೇಹಿತೆ ಇಲ್ಲಿ ಇದ್ದಾಳೆ.": { native: "Her friend is here.", bases: { "ಸ್ನೇಹಿತೆ": "friend", "ಇದ್ದಾಳೆ": "to be" } }
  "kn-0624":
    native: "their (polite)"
    notes:
      "n1": "Before a noun: ಅವರ ಮನೆ (avara mane), their house."
    examples:
      "ಅವರ ಮಕ್ಕಳು ಶಾಲೆಗೆ ಹೋಗುತ್ತಾರೆ.": { native: "Their children go to school.", bases: { "ಮಕ್ಕಳು": "children", "ಶಾಲೆಗೆ": "to school", "ಹೋಗುತ್ತಾರೆ": "to go" } }
      "ಅವರ ಮನೆ ದೊಡ್ಡದು.": { native: "Their house is big.", bases: { "ಮನೆ": "house", "ದೊಡ್ಡದು": "big" } }
  "kn-0625":
    native: "our"
    notes:
      "n1": "Before a noun: ನಮ್ಮ ಊರು (namma ūru), our town."
    examples:
      "ನಮ್ಮ ಊರು ಚಿಕ್ಕದು.": { native: "Our town is small.", bases: { "ಊರು": "town", "ಚಿಕ್ಕದು": "small" } }
      "ನಮ್ಮ ಮನೆ ಇಲ್ಲಿದೆ.": { native: "Our house is here.", bases: { "ಮನೆ": "house", "ಇಲ್ಲಿದೆ": "to be" } }
  "kn-0626":
    native: "which"
    notes:
      "n1": "Before a noun: ಯಾವ ಪುಸ್ತಕ (yāva pustaka), which book."
    examples:
      "ಯಾವ ಪುಸ್ತಕ ನಿಮ್ಮದು?": { native: "Which book is yours?", bases: { "ಪುಸ್ತಕ": "book", "ನಿಮ್ಮದು": "yours" } }
      "ಯಾವ ಊರಿಗೆ ಹೋಗುತ್ತೀರಿ?": { native: "Which town will you go to?", bases: { "ಊರಿಗೆ": "to the town", "ಹೋಗುತ್ತೀರಿ": "to go" } }
  "kn-0627":
    native: "someone"
    notes:
      "n1": "ಯಾರೋ (yārō), someone: an unknown person."
    examples:
      "ಯಾರೋ ಬಾಗಿಲು ತಟ್ಟುತ್ತಿದ್ದಾರೆ.": { native: "Someone is knocking at the door.", bases: { "ಬಾಗಿಲು": "door", "ತಟ್ಟುತ್ತಿದ್ದಾರೆ": "to knock" } }
      "ಯಾರೋ ನನ್ನನ್ನು ಕರೆದರು.": { native: "Someone called me.", bases: { "ನನ್ನನ್ನು": "me", "ಕರೆದರು": "to call" } }
  "kn-0628":
    native: "something"
    notes:
      "n1": "ಏನೋ (ēnō), something, as in ಏನೋ ಬೇಕು (ēnō bēku), something is needed."
    examples:
      "ಏನೋ ಆಯಿತು.": { native: "Something happened.", bases: { "ಆಯಿತು": "to happen" } }
      "ನನಗೆ ಏನೋ ಬೇಕು.": { native: "I need something.", bases: { "ನನಗೆ": "to me", "ಬೇಕು": "to need" } }
  "kn-0629":
    native: "no one (with a negative verb)"
    notes:
      "n1": "With a negative verb: ಯಾರೂ ಇಲ್ಲ (yārū illa), no one is here."
    examples:
      "ಇಲ್ಲಿ ಯಾರೂ ಇಲ್ಲ.": { native: "No one is here.", bases: { "ಇಲ್ಲ": "not" } }
      "ಯಾರೂ ಬರಲಿಲ್ಲ.": { native: "No one came.", bases: { "ಬರಲಿಲ್ಲ": "to come" } }
  "kn-0695":
    native: "Personal pronouns: seven words"
    explanation: "Seven personal pronouns: ನಾನು (nānu), I; ನೀನು (nīnu), you, to a close friend; ಅವನು (avanu), he; ಅವಳು (avaḷu), she; ನಾವು (nāvu), we; ನೀವು (nīvu), you, polite or more than one person; ಅವರು (avaru), they, polite."
