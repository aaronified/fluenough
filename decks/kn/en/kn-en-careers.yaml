schema: 1
id: "kn-en-careers"
kind: "layer"
core: "kn-careers"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Careers: jobs, work and interviews"
license: "CC-BY-SA-4.0"
description: "Jobs and careers: the job, the experience and the skill, the interview, the promotion, and the names of common jobs. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1454":
    native: "job, employment"
    notes:
      "n1": "A job, paid work for an employer."
    examples:
      "ನೌಕರಿ ಬೇಕು.": "I need a job."
      "ನೌಕರಿ ಸಿಕ್ಕಿತು.": { native: "I got a job.", bases: { "ಸಿಕ್ಕಿತು": "got" } }
  "kn-1455":
    native: "employment, work"
    notes:
      "n1": "Employment, a regular job, in a formal way."
    examples:
      "ಉದ್ಯೋಗ ಇದೆ.": { native: "There is employment.", bases: { "ಇದೆ": "there is" } }
      "ಉದ್ಯೋಗಕ್ಕೆ ಅರ್ಜಿ ಕೊಡು.": { native: "Give an application for a job.", bases: { "ಉದ್ಯೋಗಕ್ಕೆ": "for a job" } }
  "kn-1456":
    native: "interview"
    notes:
      "n1": "An interview, when you are asked questions for a job."
    examples:
      "ಸಂದರ್ಶನ ಇದೆ.": { native: "There is an interview.", bases: { "ಇದೆ": "there is" } }
      "ಸಂದರ್ಶನಕ್ಕೆ ಹೋಗು.": { native: "Go to the interview.", bases: { "ಸಂದರ್ಶನಕ್ಕೆ": "to the interview" } }
  "kn-1457":
    native: "experience"
    notes:
      "n1": "Experience, what you have learnt by working."
    examples:
      "ಅವನಿಗೆ ಅನುಭವ ಇದೆ.": { native: "He has experience.", bases: { "ಇದೆ": "has" } }
      "ಅನುಭವ ಬೇಕು.": "Experience is needed."
  "kn-1458":
    native: "skill"
    notes:
      "n1": "A skill, the ability to do something well."
    examples:
      "ಕೌಶಲ್ಯ ಬೇಕು.": "A skill is needed."
      "ಅವಳಿಗೆ ಕೌಶಲ್ಯ ಇದೆ.": { native: "She has a skill.", bases: { "ಇದೆ": "has" } }
  "kn-1459":
    native: "degree, university degree"
    notes:
      "n1": "A degree, from a college or a university."
    examples:
      "ಪದವಿ ಮುಗಿಯಿತು.": "The degree is finished."
      "ಅವನ ಪದವಿ ಏನು?": "What is his degree?"
  "kn-1460":
    native: "promotion"
    notes:
      "n1": "A promotion, a move to a higher post at work."
    examples:
      "ಬಡ್ತಿ ಸಿಕ್ಕಿತು.": { native: "The promotion came.", bases: { "ಸಿಕ್ಕಿತು": "came" } }
      "ಬಡ್ತಿ ಬೇಕು.": "I want a promotion."
  "kn-1461":
    native: "resignation"
    notes:
      "n1": "A resignation, when you leave a job by choice."
    examples:
      "ರಾಜೀನಾಮೆ ಕೊಟ್ಟ.": "He gave his resignation."
      "ರಾಜೀನಾಮೆ ಬೇಡ.": "No resignation."
  "kn-1462":
    native: "retirement"
    notes:
      "n1": "Retirement, when you stop working after many years."
    examples:
      "ಅಪ್ಪನಿಗೆ ನಿವೃತ್ತಿ ಆಯಿತು.": "Dad retired."
      "ನಿವೃತ್ತಿ ಸಂತೋಷ.": "Retirement is joy."
  "kn-1463":
    native: "profession, career"
    notes:
      "n1": "A profession, the work you have trained for."
    examples:
      "ಅವನ ವೃತ್ತಿ ಏನು?": "What is his profession?"
      "ವೃತ್ತಿ ಒಳ್ಳೆಯದು.": "The profession is good."
  "kn-1464":
    native: "owner, employer"
    notes:
      "n1": "An owner, or the person who employs others."
    examples:
      "ಮಾಲೀಕ ಬಂದರು.": "The owner came."
      "ಮಾಲೀಕರು ಸಂಬಳ ಕೊಟ್ಟರು.": { native: "The owners paid the salary.", bases: { "ಮಾಲೀಕರು": "the owners" } }
  "kn-1465":
    native: "business, enterprise"
    notes:
      "n1": "A business or an enterprise, run to make money."
    examples:
      "ಉದ್ಯಮ ದೊಡ್ಡದು.": "The business is big."
      "ಉದ್ಯಮ ಶುರು ಮಾಡು.": "Start a business."
  "kn-1466":
    native: "businessman"
    notes:
      "n1": "A businessman, who runs a business."
    examples:
      "ಉದ್ಯಮಿ ಬಂದ.": "The businessman came."
      "ಉದ್ಯಮಿಗಳು ಇಲ್ಲಿ ಇದ್ದಾರೆ.": { native: "The businessmen are here.", bases: { "ಉದ್ಯಮಿಗಳು": "the businessmen", "ಇದ್ದಾರೆ": "are" } }
  "kn-1467":
    native: "artist, performer"
    notes:
      "n1": "An artist, a person who paints, sings or dances."
    examples:
      "ಕಲಾವಿದ ಬಂದ.": "The artist came."
      "ಕಲಾವಿದ ಚಿತ್ರ ಬಿಡಿಸುತ್ತಾನೆ.": "The artist draws a picture."
  "kn-1468":
    native: "cook, chef"
    notes:
      "n1": "A cook or a chef, who cooks for others."
    examples:
      "ಬಾಣಸಿಗ ಅಡುಗೆ ಮಾಡುತ್ತಾನೆ.": "The cook makes food."
      "ಬಾಣಸಿಗ ಬೇಕು.": "I need a cook."
  "kn-1469":
    native: "permanent"
    notes:
      "n1": "Permanent, for always, not temporary."
    examples:
      "ಕೆಲಸ ಕಾಯಂ ಆಯಿತು.": "The job became permanent."
      "ಕಾಯಂ ಕೆಲಸ ಬೇಕು.": "I need a permanent job."
  "kn-1470":
    native: "temporary"
    notes:
      "n1": "Temporary, for a short time only."
    examples:
      "ತಾತ್ಕಾಲಿಕ ಕೆಲಸ.": "A temporary job."
      "ಇದು ತಾತ್ಕಾಲಿಕ.": "This is temporary."
  "kn-1471":
    native: "professional"
    notes:
      "n1": "Professional, done by a trained expert."
    examples:
      "ವೃತ್ತಿಪರ ಕೆಲಸ.": "Professional work."
      "ಅವನು ವೃತ್ತಿಪರ.": "He is a professional."
