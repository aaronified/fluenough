schema: 1
id: "kn-en-numbers-big"
kind: "layer"
core: "kn-numbers-big"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Tens and big numbers"
license: "CC0-1.0"
description: "The tens, the hundreds, a thousand, lakh and crore, and the halves every market uses. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0264":
    native: "30, thirty"
    notes:
      "n1": "Kannada builds 21 to 99 from the tens and the units, joined into one word: 26 is ಇಪ್ಪತ್ತಾರು (ippattāru), ಇಪ್ಪತ್ತು (ippattu) + ಆರು (āru)."
  "kn-0265":
    native: "40, forty"
  "kn-0266":
    native: "50, fifty"
  "kn-0267":
    native: "60, sixty"
  "kn-0268":
    native: "70, seventy"
  "kn-0269":
    native: "80, eighty"
  "kn-0270":
    native: "90, ninety"
  "kn-0271":
    native: "25, twenty-five"
    notes:
      "n1": "The tens lose their last u and run into the units: ಇಪ್ಪತ್ತು (ippattu) + ಐದು (aidu). So ಮೂವತ್ತೊಂದು (mūvattondu), 31; ಐವತ್ತೆರಡು (aivatteraḍu), 52."
  "kn-0272":
    native: "100, a hundred"
    notes:
      "n1": "With more after it, ನೂರ (nūra): ನೂರ ಐವತ್ತು (nūra aivattu), 150."
  "kn-0273":
    native: "150, a hundred and fifty"
    notes:
      "n1": "With more after it, a hundred is ನೂರ (nūra)."
  "kn-0274":
    native: "200, two hundred"
    notes:
      "n1": "The hundreds are single words, built on ನೂರು (nūru): ಇನ್ನೂರು (innūru), ಮುನ್ನೂರು (munnūru), ನಾನೂರು (nānūru)."
  "kn-0275":
    native: "250, two hundred and fifty"
    notes:
      "n1": "With more after it, ಇನ್ನೂರು (innūru) becomes ಇನ್ನೂರ (innūra)."
  "kn-0276":
    native: "300, three hundred"
  "kn-0277":
    native: "350, three hundred and fifty"
  "kn-0278":
    native: "400, four hundred"
  "kn-0279":
    native: "450, four hundred and fifty"
  "kn-0280":
    native: "500, five hundred"
  "kn-0281":
    native: "550, five hundred and fifty"
  "kn-0282":
    native: "600, six hundred"
  "kn-0283":
    native: "650, six hundred and fifty"
  "kn-0284":
    native: "700, seven hundred"
  "kn-0285":
    native: "750, seven hundred and fifty"
  "kn-0286":
    native: "800, eight hundred"
  "kn-0287":
    native: "850, eight hundred and fifty"
  "kn-0288":
    native: "900, nine hundred"
    notes:
      "n1": "Also ಒಂಬತ್ತು ನೂರು (ombattu nūru)."
  "kn-0289":
    native: "950, nine hundred and fifty"
  "kn-0290":
    native: "1,000, a thousand"
    notes:
      "n1": "Two thousand is ಎರಡು ಸಾವಿರ (eraḍu sāvira); with more after it, ಸಾವಿರದ (sāvirada): ಎರಡು ಸಾವಿರದ ಐನೂರು (eraḍu sāvirada ainūru), 2,500."
  "kn-0291":
    native: "2,000, two thousand"
  "kn-0292":
    native: "2026, two thousand and twenty-six"
    notes:
      "n1": "With more after it, ಸಾವಿರ (sāvira) becomes ಸಾವಿರದ (sāvirada). Years are read this way."
  "kn-0293":
    native: "1,00,000, a lakh (a hundred thousand)"
    notes:
      "n1": "Indian numbering counts in lakhs and crores, and places its commas to match: 1,00,000."
  "kn-0117":
    notes:
      "n1": "A hundred lakh. Compare ಕೋತಿ (kōti), monkey, with the t on the teeth."
  "kn-0294":
    native: "half"
    notes:
      "n1": "ಅರ್ಧ ಕೆಜಿ (ardha keji), half a kilo."
  "kn-0295":
    native: "1½, one and a half"
    notes:
      "n1": "-ಊವರೆ (-ūvare) adds a half: ಎರಡೂವರೆ (eraḍūvare), 2½; ನಾಲ್ಕೂವರೆ (nālkūvare), 4½."
  "kn-0296":
    native: "2½, two and a half"
