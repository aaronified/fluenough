schema: 1
id: "kn-en-business-email"
kind: "layer"
core: "kn-business-email"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Business: writing an email"
license: "CC-BY-SA-4.0"
description: "Phrases and words for a formal work email: the greeting, the request, the attachment and the closing."
cards:
  "kn-6580":
    native: "Dear Sir or Madam,"
    notes: { n1: "ಮಾನ್ಯರೇ (mānyarē) is the usual formal opening of a letter or an email to people you do not know; it addresses them with respect." }
  "kn-6581":
    native: "I am writing to confirm the meeting."
    notes: { n1: "ಸಭೆಯನ್ನು (sabheyannu) is ಸಭೆ (sabhe), meeting, with -ಯನ್ನು (-yannu) added because the object follows a word ending in ಎ (e)." }
  "kn-6582":
    native: "I have attached the document."
  "kn-6583":
    native: "I am waiting for your reply."
    notes: { n1: "ನಿಮ್ಮ (nimma), your, is the form of ನೀವು (nīvu), you, before a noun." }
  "kn-6584":
    native: "Thank you for your quick reply."
  "kn-6585":
    native: "Please excuse the delay in replying."
    notes: { n1: "ಇರಲಿ (irali) is the form of ಇರು (iru), to be, that asks politely: let there be pardon." }
  "kn-6586":
    native: "Please send the bill."
  "kn-6587":
    native: "I sent it by mistake, sorry."
  "kn-6588":
    native: "With regards."
    notes: { n1: "ವಂದನೆಗಳೊಂದಿಗೆ (vandanegaḷondige) is the usual closing of a formal email; it is ವಂದನೆ (vandane), greeting, in the plural with -ಒಂದಿಗೆ (-ondige), with." }
