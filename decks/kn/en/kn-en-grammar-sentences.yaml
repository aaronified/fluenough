schema: 1
id: "kn-en-grammar-sentences"
kind: "layer"
core: "kn-grammar-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Basic sentences"
license: "CC0-1.0"
description: "Word order, no 'is', and how Kannada says 'have' and 'like'. Not yet checked by a Kannada speaker: please report any mistake."
cards:
  "kn-0154":
    native: "I am a student."
    notes:
      "n1": "No 'am': 'I student'. A woman says ನಾನು ವಿದ್ಯಾರ್ಥಿನಿ (vidyarthini)."
    bases:
      "ನಾನು": "I"
  "kn-0155":
    native: "This is my house."
    notes:
      "n1": "There is no 'is' here either."
    bases:
      "ಇದು": "this"
      "ನನ್ನ": "I"
  "kn-0156":
    native: "I drink coffee."
    notes:
      "n1": "Subject, object, verb: the verb comes last."
    bases:
      "ನಾನು": "I"
      "ಕುಡಿಯುತ್ತೇನೆ": "to drink"
  "kn-0157":
    native: "She is learning Kannada."
    bases:
      "ಅವಳು": "she"
      "ಕನ್ನಡ": "Kannada"
      "ಕಲಿಯುತ್ತಿದ್ದಾಳೆ": "to learn"
  "kn-0158":
    native: "I like Kannada."
    notes:
      "n1": "'To me, Kannada is liked': the one who likes takes -ಗೆ (-ge)."
    bases:
      "ನನಗೆ": "I"
      "ಕನ್ನಡ": "Kannada"
  "kn-0159":
    native: "I have a car."
    notes:
      "n1": "'Near me there is a car': ಇದೆ (ide), 'there is'. For family, 'to me': ನನಗೆ ಒಬ್ಬ ಅಣ್ಣ ಇದ್ದಾನೆ (nanage obba aṇṇa iddāne), I have an elder brother. ಇರು (iru) changes its form: ಇದ್ದ- (idda-) for people, ಇದೆ (ide) for things."
    bases:
      "ನನ್ನ": "I"
      "ಇದೆ": "to be; to have; to live"
  "kn-0160":
    native: "I don't have any money on me."
    notes:
      "n1": "ಇಲ್ಲ (illa), 'there isn't', is the same whatever is missing."
    bases:
      "ನನ್ನ": "I"
  "kn-0161":
    native: "This isn't good."
    notes:
      "n1": "ಚೆನ್ನಾಗಿ (well) + ಇಲ್ಲ (is not)."
    bases:
      "ಇದು": "this"
      "ಚೆನ್ನಾಗಿಲ್ಲ": "well; good"
  "kn-0162":
    native: "Please don't go."
    notes:
      "n1": "-ಬೇಡಿ (-bēḍi) makes a polite 'don't'; to a friend, -ಬೇಡ (-bēḍa): ಹೋಗಬೇಡ (hōgabēḍa)."
  "kn-0163":
    native: "It's very hot today."
    notes:
      "n1": "ಸೆಕೆ (seke) is close, sweaty heat: 'today much heat is'. ಇರು (iru) changes its form: ಇದ್ದ- (idda-) for people, ಇದೆ (ide) for things."
    bases:
      "ತುಂಬಾ": "very; a lot"
      "ಸೆಕೆ": "heat"
      "ಇದೆ": "to be; to have; to live"
