schema: 1
id: "kn-en-things"
kind: "layer"
core: "kn-things"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Things at home and in the bag"
license: "CC-BY-SA-4.0"
description: "Everyday things: what is on the table, in the bag, in the bathroom and for sewing. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-0875":
    native: "book"
    notes:
      "n1": "The plural is ಪುಸ್ತಕಗಳು (pustakagaḷu), books."
    examples:
      "ಇದು ಪುಸ್ತಕ.": { native: "This is a book.", bases: { "ಇದು": "this" } }
      "ಪುಸ್ತಕ ಮೇಜಿನ ಮೇಲೆ ಇದೆ.": { native: "The book is on the table.", bases: { "ಮೇಜಿನ": "of the table", "ಇದೆ": "is" } }
  "kn-0876":
    native: "pen"
    notes:
      "n1": "The verb ಬರೆ (bare) means to write, so you write with a pen."
    examples:
      "ನನ್ನ ಪೆನ್ನು ಇಲ್ಲಿದೆ.": { native: "My pen is here.", bases: { "ಇಲ್ಲಿದೆ": "is here", "ನನ್ನ": "my" } }
      "ಅವನು ಪೆನ್ನಿನಿಂದ ಬರೆಯುತ್ತಾನೆ.": { native: "He writes with a pen.", bases: { "ಪೆನ್ನಿನಿಂದ": "with a pen", "ಬರೆಯುತ್ತಾನೆ": "writes", "ಅವನು": "he" } }
  "kn-0877":
    native: "paper; letter"
    notes:
      "n1": "Paper is also a letter: ಕಾಗದ (kāgada) can mean a letter that is sent."
    examples:
      "ಕಾಗದದ ಮೇಲೆ ಬರೆಯಿರಿ.": { native: "Write on the paper.", bases: { "ಕಾಗದದ": "of the paper", "ಮೇಲೆ": "on", "ಬರೆಯಿರಿ": "write" } }
      "ಅವಳು ಕಾಗದ ತಂದಳು.": { native: "She brought paper.", bases: { "ತಂದಳು": "brought", "ಅವಳು": "she" } }
  "kn-0878":
    native: "clock; watch"
    notes:
      "n1": "The same word is used for a clock on the wall and a wrist watch."
    examples:
      "ಗಡಿಯಾರ ಗೋಡೆಯ ಮೇಲಿದೆ.": { native: "The clock is on the wall.", bases: { "ಗೋಡೆಯ": "of the wall", "ಮೇಲಿದೆ": "is on" } }
      "ನನ್ನ ಗಡಿಯಾರ ನಿಧಾನ.": { native: "My clock is slow.", bases: { "ನಿಧಾನ": "slow", "ನನ್ನ": "my" } }
  "kn-0879":
    native: "phone"
    notes:
      "n1": "A phone is ಫೋನ್ (fōn); to make a call, say ಫೋನ್ ಮಾಡು (fōn māḍu)."
    examples:
      "ನನ್ನ ಫೋನ್ ಕೆಲಸ ಮಾಡುತ್ತಿಲ್ಲ.": { native: "My phone is not working.", bases: { "ಮಾಡುತ್ತಿಲ್ಲ": "is not working", "ನನ್ನ": "my" } }
      "ಅವನು ಫೋನ್ ಮಾಡಿದ.": { native: "He made a call.", bases: { "ಮಾಡಿದ": "made", "ಅವನು": "he" } }
  "kn-0880":
    native: "key"
    notes:
      "n1": "A key opens a lock, and the same word is used for a keyboard key."
    examples:
      "ಕೀಲಿ ಎಲ್ಲಿದೆ?": { native: "Where is the key?", bases: { "ಎಲ್ಲಿದೆ": "where is" } }
      "ಕೀಲಿ ಚೀಲದಲ್ಲಿದೆ.": { native: "The key is in the bag.", bases: { "ಚೀಲದಲ್ಲಿದೆ": "is in the bag" } }
  "kn-0881":
    native: "bag"
    notes:
      "n1": "A school bag or a shopping bag: both are called ಬ್ಯಾಗ್ (byāg)."
    examples:
      "ನನ್ನ ಬ್ಯಾಗ್ ಭಾರ.": { native: "My bag is heavy.", bases: { "ಭಾರ": "heavy", "ನನ್ನ": "my" } }
      "ಬ್ಯಾಗಿನಲ್ಲಿ ಪುಸ್ತಕ ಇದೆ.": { native: "There is a book in the bag.", bases: { "ಬ್ಯಾಗಿನಲ್ಲಿ": "in the bag", "ಇದೆ": "is" } }
  "kn-0882":
    native: "umbrella"
    notes:
      "n1": "An umbrella keeps off rain and sun."
    examples:
      "ಮಳೆ ಬರುತ್ತಿದೆ, ಛತ್ರಿ ಇದೆಯೇ?": { native: "It is raining; do you have an umbrella?", bases: { "ಬರುತ್ತಿದೆ": "is coming", "ಇದೆಯೇ": "do you have" } }
      "ಛತ್ರಿ ನನ್ನದು.": { native: "The umbrella is mine.", bases: { "ನನ್ನದು": "mine" } }
  "kn-0883":
    native: "mirror"
    notes:
      "n1": "The verb ಕಾಣು (kāṇu) means to see, so ಕನ್ನಡಿಯಲ್ಲಿ ಕಾಣು (kannaḍiyalli kāṇu) is to be seen in a mirror."
    examples:
      "ಕನ್ನಡಿಯಲ್ಲಿ ನನ್ನ ಮುಖ ಕಾಣುತ್ತದೆ.": { native: "I see my face in the mirror.", bases: { "ಕನ್ನಡಿಯಲ್ಲಿ": "in the mirror", "ಮುಖ": "face", "ಕಾಣುತ್ತದೆ": "is seen", "ನನ್ನ": "my" } }
      "ಕನ್ನಡಿ ಗೋಡೆಯ ಮೇಲಿದೆ.": { native: "The mirror is on the wall.", bases: { "ಗೋಡೆಯ": "of the wall", "ಮೇಲಿದೆ": "is on" } }
  "kn-0884":
    native: "soap"
    notes:
      "n1": "Soap is used for washing the hands and the body."
    examples:
      "ಕೈಗೆ ಸಬೂನು ಹಾಕಿ ತೊಳೆ.": { native: "Put soap on your hands and wash.", bases: { "ಕೈಗೆ": "on the hands", "ಹಾಕಿ": "put", "ತೊಳೆ": "wash" } }
      "ಸಬೂನು ಚೆನ್ನಾಗಿದೆ.": { native: "The soap is good.", bases: { "ಚೆನ್ನಾಗಿದೆ": "is good" } }
  "kn-0885":
    native: "comb"
    notes:
      "n1": "The verb ಬಾಚು (bācu) means to comb, as in combing your hair."
    examples:
      "ಬಾಚಣಿಗೆಯಿಂದ ಕೂದಲು ಬಾಚು.": { native: "Comb your hair with a comb.", bases: { "ಬಾಚಣಿಗೆಯಿಂದ": "with a comb", "ಕೂದಲು": "hair", "ಬಾಚು": "comb" } }
      "ನನ್ನ ಬಳಿ ಬಾಚಣಿಗೆ ಇಲ್ಲ.": { native: "I do not have a comb.", bases: { "ಬಳಿ": "with", "ಇಲ್ಲ": "no; not", "ನನ್ನ": "my" } }
  "kn-0886":
    native: "pillow"
    notes:
      "n1": "You rest your head on a pillow: ದಿಂಬು (dimbu) is often soft."
    examples:
      "ದಿಂಬು ಮೃದು.": { native: "The pillow is soft.", bases: { "ಮೃದು": "soft" } }
      "ದಿಂಬಿನ ಮೇಲೆ ತಲೆ ಇಡು.": { native: "Rest your head on the pillow.", bases: { "ದಿಂಬಿನ": "of the pillow", "ಇಡು": "put; rest" } }
  "kn-0887":
    native: "bed"
    notes:
      "n1": "The verb ಮಲಗು (malagu) means to sleep, so ಹಾಸಿಗೆ ಮೇಲೆ ಮಲಗು (hāsige mēle malagu) is to sleep on the bed."
    examples:
      "ಹಾಸಿಗೆ ಮೇಲೆ ಮಲಗು.": { native: "Sleep on the bed.", bases: { "ಮಲಗು": "sleep" } }
      "ಹಾಸಿಗೆ ತುಂಬಾ ಮೃದು.": { native: "The bed is very soft.", bases: { "ತುಂಬಾ": "very", "ಮೃದು": "soft" } }
  "kn-0888":
    native: "cup"
    notes:
      "n1": "A cup for tea or water: ಕಪ್ (kap) is used in town and in homes."
    examples:
      "ಕಪ್ಪಿನಲ್ಲಿ ನೀರು ಇದೆ.": { native: "There is water in the cup.", bases: { "ಕಪ್ಪಿನಲ್ಲಿ": "in the cup", "ಇದೆ": "is" } }
      "ಕಪ್ ಖಾಲಿ ಇದೆ.": { native: "The cup is empty.", bases: { "ಖಾಲಿ": "empty", "ಇದೆ": "is" } }
  "kn-0889":
    native: "fork"
    notes:
      "n1": "A fork is for eating: ಫೋರ್ಕ್ (fōrk) sits beside the plate."
    examples:
      "ಫೋರ್ಕ್ ತಟ್ಟೆಯ ಪಕ್ಕ ಇದೆ.": { native: "The fork is beside the plate.", bases: { "ತಟ್ಟೆಯ": "of the plate", "ಪಕ್ಕ": "beside", "ಇದೆ": "is" } }
      "ಊಟಕ್ಕೆ ಫೋರ್ಕ್ ಬೇಕು.": { native: "You need a fork for the meal.", bases: { "ಊಟಕ್ಕೆ": "for the meal", "ಬೇಕು": "need" } }
  "kn-0890":
    native: "knife"
    notes:
      "n1": "A knife for cutting: the verb ಕತ್ತರಿಸು (kattarisu) means to cut."
    examples:
      "ಚಾಕುವಿನಿಂದ ತರಕಾರಿ ಕತ್ತರಿಸು.": { native: "Cut the vegetables with a knife.", bases: { "ಚಾಕುವಿನಿಂದ": "with a knife", "ಕತ್ತರಿಸು": "cut" } }
      "ಚಾಕು ತುಂಬಾ ಹರಿತ.": { native: "The knife is very sharp.", bases: { "ತುಂಬಾ": "very", "ಹರಿತ": "sharp" } }
  "kn-0891":
    native: "box"
    notes:
      "n1": "A box: ಪೆಟ್ಟಿಗೆ (peṭṭige) can hold books, food or clothes."
    examples:
      "ಪೆಟ್ಟಿಗೆಯಲ್ಲಿ ಏನು ಇದೆ?": { native: "What is in the box?", bases: { "ಪೆಟ್ಟಿಗೆಯಲ್ಲಿ": "in the box", "ಏನು": "what", "ಇದೆ": "is" } }
      "ದೊಡ್ಡ ಪೆಟ್ಟಿಗೆ ಮೇಜಿನ ಕೆಳಗಿದೆ.": { native: "The big box is under the table.", bases: { "ದೊಡ್ಡ": "big", "ಮೇಜಿನ": "of the table", "ಕೆಳಗಿದೆ": "is under" } }
  "kn-0892":
    native: "bag; sack"
    notes:
      "n1": "A bag or sack: ಚೀಲ (cīla) is a plain word for any bag."
    examples:
      "ಚೀಲದಲ್ಲಿ ಅಕ್ಕಿ ಇದೆ.": { native: "There is rice in the bag.", bases: { "ಚೀಲದಲ್ಲಿ": "in the bag", "ಇದೆ": "is" } }
      "ಈ ಚೀಲ ಭಾರ.": { native: "This bag is heavy.", bases: { "ಈ": "this", "ಭಾರ": "heavy" } }
  "kn-0893":
    native: "scissors"
    notes:
      "n1": "Scissors are used with the verb ಕತ್ತರಿಸು (kattarisu), to cut."
    examples:
      "ಕತ್ತರಿಯಿಂದ ಕಾಗದ ಕತ್ತರಿಸು.": { native: "Cut paper with scissors.", bases: { "ಕತ್ತರಿಯಿಂದ": "with scissors", "ಕಾಗದ": "paper", "ಕತ್ತರಿಸು": "cut" } }
      "ಕತ್ತರಿ ಮೇಜಿನ ಮೇಲಿದೆ.": { native: "The scissors are on the table.", bases: { "ಮೇಜಿನ": "of the table", "ಮೇಲಿದೆ": "is on" } }
  "kn-0894":
    native: "needle"
    notes:
      "n1": "A needle for sewing: the verb ಹೊಲಿ (holi) means to sew."
    examples:
      "ಸೂಜಿಯಿಂದ ಬಟ್ಟೆ ಹೊಲಿ.": { native: "Sew cloth with a needle.", bases: { "ಸೂಜಿಯಿಂದ": "with a needle", "ಬಟ್ಟೆ": "cloth", "ಹೊಲಿ": "sew" } }
      "ಸೂಜಿ ಚೂಪಾಗಿದೆ.": { native: "The needle is sharp.", bases: { "ಚೂಪಾಗಿದೆ": "is sharp" } }
  "kn-0895":
    native: "thread; string"
    notes:
      "n1": "Thread goes through a needle: ದಾರ (dāra) is used to sew."
    examples:
      "ದಾರ ಉದ್ದ ಇದೆ.": { native: "The thread is long.", bases: { "ಉದ್ದ": "long", "ಇದೆ": "is" } }
      "ದಾರ ಸೂಜಿಯಲ್ಲಿ ಹಾಕಿ.": { native: "Put the thread in the needle.", bases: { "ಸೂಜಿಯಲ್ಲಿ": "in the needle", "ಹಾಕಿ": "put" } }
  "kn-0896":
    native: "brush"
    notes:
      "n1": "A toothbrush or a hair brush is also called ಬ್ರಷ್ (braṣ)."
    examples:
      "ಹಲ್ಲು ತೊಳೆಯಲು ಬ್ರಷ್ ಬೇಕು.": { native: "You need a brush to wash your teeth.", bases: { "ತೊಳೆಯಲು": "to wash", "ಬೇಕು": "need" } }
      "ಬ್ರಷ್ ಹೊಸದು.": { native: "The brush is new.", bases: { "ಹೊಸದು": "new one" } }
  "kn-0897":
    native: "television"
    notes:
      "n1": "Television is ಟಿವಿ (ṭivi); to watch it, say ಟಿವಿ ನೋಡು (ṭivi nōḍu)."
    examples:
      "ಟಿವಿ ಆನ್ ಮಾಡು.": { native: "Turn on the television.", bases: { "ಆನ್": "on", "ಮಾಡು": "do; turn" } }
      "ಮನೆಯಲ್ಲಿ ಟಿವಿ ಇದೆ.": { native: "There is a television at home.", bases: { "ಮನೆಯಲ್ಲಿ": "at home", "ಇದೆ": "is" } }
  "kn-0898":
    native: "fan"
    notes:
      "n1": "A fan for the room: the same word is used for a sports fan."
    examples:
      "ಫ್ಯಾನ್ ತಿರುಗುತ್ತಿದೆ.": { native: "The fan is turning.", bases: { "ತಿರುಗುತ್ತಿದೆ": "is turning" } }
      "ಬೇಸಿಗೆಯಲ್ಲಿ ಫ್ಯಾನ್ ಬೇಕು.": { native: "In summer you need a fan.", bases: { "ಬೇಸಿಗೆಯಲ್ಲಿ": "in summer", "ಬೇಕು": "need" } }
  "kn-0899":
    native: "cupboard"
    notes:
      "n1": "A cupboard keeps clothes and things: ಬೀರು (bīru) is found in a bedroom."
    examples:
      "ಬೀರುವಿನಲ್ಲಿ ಬಟ್ಟೆ ಇದೆ.": { native: "There is cloth in the cupboard.", bases: { "ಬೀರುವಿನಲ್ಲಿ": "in the cupboard", "ಬಟ್ಟೆ": "clothes", "ಇದೆ": "are" } }
      "ಬೀರು ಗೋಡೆಯ ಪಕ್ಕ ಇದೆ.": { native: "The cupboard is beside the wall.", bases: { "ಗೋಡೆಯ": "of the wall", "ಪಕ್ಕ": "beside", "ಇದೆ": "is" } }
