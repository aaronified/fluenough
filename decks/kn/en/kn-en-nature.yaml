schema: 1
id: "kn-en-nature"
kind: "layer"
core: "kn-nature"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Nature: trees, land and water"
license: "CC-BY-SA-4.0"
description: "Trees and leaves, the forest and the hills, the sea and the waves, and the birds and insects that live in them. Not yet checked by a Kannada speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "kn-1230":
    native: "leaf"
    notes:
      "n1": "A leaf, of a tree or a plant. Leafy vegetables are ಸೊಪ್ಪು (soppu)."
    examples:
      "ಮರದ ಎಲೆ ಹಸಿರು.": "The leaf of the tree is green."
      "ಎಲೆ ಬಿತ್ತು.": "A leaf fell."
  "kn-1231":
    native: "root"
    notes:
      "n1": "The root of a plant, under the ground."
    examples:
      "ಬೇರು ಮಣ್ಣಿನ ಒಳಗೆ ಇದೆ.": { native: "The root is inside the soil.", bases: { "ಮಣ್ಣಿನ": "of the soil", "ಇದೆ": "is" } }
      "ಗಿಡದ ಬೇರು ದೊಡ್ಡದು.": "The root of the plant is big."
  "kn-1232":
    native: "seed"
    notes:
      "n1": "A seed, from which a plant grows."
    examples:
      "ಬೀಜ ಬೇಕು.": "I need a seed."
      "ಬೀಜದಿಂದ ಗಿಡ ಬೆಳೆಯುತ್ತದೆ.": { native: "A plant grows from a seed.", bases: { "ಬೀಜದಿಂದ": "from a seed" } }
  "kn-1233":
    native: "grass"
    notes:
      "n1": "Grass, on the ground or in a field."
    examples:
      "ಹುಲ್ಲು ಹಸಿರು.": "The grass is green."
      "ಹುಲ್ಲಿನ ಮೇಲೆ ಕೂರು.": { native: "Sit on the grass.", bases: { "ಹುಲ್ಲಿನ": "of the grass" } }
  "kn-1234":
    native: "meadow, grassland"
    notes:
      "n1": "A meadow, an open land with grass."
    examples:
      "ಹುಲ್ಲುಗಾವಲಿನಲ್ಲಿ ಮಕ್ಕಳು ಇದ್ದಾರೆ.": { native: "There are children in the meadow.", bases: { "ಹುಲ್ಲುಗಾವಲಿನಲ್ಲಿ": "in the meadow", "ಇದ್ದಾರೆ": "there are" } }
      "ಹುಲ್ಲುಗಾವಲು ಸುಂದರ.": "The meadow is beautiful."
  "kn-1235":
    native: "sea, ocean"
    notes:
      "n1": "The sea or ocean, a word used in poems and songs."
    examples:
      "ಕಡಲು ನೀಲಿ.": "The sea is blue."
      "ಕಡಲು ತೀರದಲ್ಲಿ ಇದೆ.": { native: "It is on the shore of the sea.", bases: { "ತೀರದಲ್ಲಿ": "on the shore", "ಇದೆ": "is" } }
  "kn-1236":
    native: "shore, bank"
    notes:
      "n1": "The shore of a sea, or the bank of a river."
    examples:
      "ತೀರ ಸುಂದರ.": "The shore is beautiful."
      "ನದಿ ತೀರದಲ್ಲಿ ನಡೆ.": { native: "Walk on the river bank.", bases: { "ತೀರದಲ್ಲಿ": "on the bank" } }
  "kn-1237":
    native: "wave"
    notes:
      "n1": "A wave, of the sea or a lake."
    examples:
      "ಅಲೆ ದೊಡ್ಡದು.": "The wave is big."
      "ಅಲೆ ತೀರಕ್ಕೆ ಬರುತ್ತಿದೆ.": { native: "A wave is coming to the shore.", bases: { "ತೀರಕ್ಕೆ": "to the shore", "ಬರುತ್ತಿದೆ": "is coming" } }
  "kn-1238":
    native: "sand"
    notes:
      "n1": "Sand, on the beach or in the desert."
    examples:
      "ಮರಳು ಬಿಸಿ ಇದೆ.": { native: "The sand is hot.", bases: { "ಇದೆ": "is" } }
      "ಮರಳಿನಲ್ಲಿ ನಡೆಯಬೇಡ.": { native: "Do not walk in the sand.", bases: { "ಮರಳಿನಲ್ಲಿ": "in the sand" } }
  "kn-1239":
    native: "stone, rock"
    notes:
      "n1": "A stone or a rock."
    examples:
      "ಕಲ್ಲು ದೊಡ್ಡದು.": "The stone is big."
      "ನದಿಯಲ್ಲಿ ಕಲ್ಲು ಇದೆ.": { native: "There is a stone in the river.", bases: { "ಇದೆ": "there is" } }
  "kn-1240":
    native: "soil, earth"
    notes:
      "n1": "Soil, the earth in which plants grow."
    examples:
      "ಮಣ್ಣು ಒಣ ಆಗಿದೆ.": { native: "The soil has become dry.", bases: { "ಆಗಿದೆ": "has become" } }
      "ಮಣ್ಣಿನಲ್ಲಿ ಗಿಡ ಬೆಳೆಯುತ್ತದೆ.": { native: "A plant grows in the soil.", bases: { "ಮಣ್ಣಿನಲ್ಲಿ": "in the soil" } }
  "kn-1241":
    native: "rock, boulder"
    notes:
      "n1": "A big rock, on a hill or by the sea."
    examples:
      "ಬಂಡೆ ದೊಡ್ಡದು.": "The boulder is big."
      "ಬಂಡೆ ಮೇಲೆ ಕೂರು.": "Sit on the rock."
  "kn-1242":
    native: "bird"
    notes:
      "n1": "A bird, which flies. The common word is also ಹಕ್ಕಿ (hakki)."
    examples:
      "ಪಕ್ಷಿ ಹಾರುತ್ತಿದೆ.": "A bird is flying."
      "ಮರದ ಮೇಲೆ ಪಕ್ಷಿ ಇದೆ.": { native: "There is a bird on the tree.", bases: { "ಇದೆ": "there is" } }
  "kn-1243":
    native: "insect"
    notes:
      "n1": "An insect, such as an ant or a fly."
    examples:
      "ಕೀಟ ಕಚ್ಚಿತು.": { native: "An insect bit.", bases: { "ಕಚ್ಚಿತು": "bit" } }
      "ಕೀಟ ತುಂಬಾ ಇದೆ.": { native: "There are a lot of insects.", bases: { "ಇದೆ": "there are" } }
  "kn-1244":
    native: "to die"
    notes:
      "n1": "To die, said of a person, an animal or a plant."
    examples:
      "ಗಿಡ ಸಾಯುತ್ತಿದೆ.": { native: "The plant is dying.", bases: { "ಸಾಯುತ್ತಿದೆ": "is dying" } }
      "ಹಕ್ಕಿ ಸತ್ತಿತು.": { native: "The bird died.", bases: { "ಸತ್ತಿತು": "died" } }
  "kn-1245":
    native: "to flow"
    notes:
      "n1": "To flow, said of water in a river."
    examples:
      "ನದಿ ಹರಿಯುತ್ತಿದೆ.": { native: "The river is flowing.", bases: { "ಹರಿಯುತ್ತಿದೆ": "is flowing" } }
      "ನೀರು ಹರಿಯುತ್ತದೆ.": { native: "Water flows.", bases: { "ಹರಿಯುತ್ತದೆ": "flows" } }
  "kn-1246":
    native: "to dry up"
    notes:
      "n1": "To dry up, from lack of water or sun."
    examples:
      "ಗಿಡ ಒಣಗಿದೆ.": { native: "The plant has dried up.", bases: { "ಒಣಗಿದೆ": "has dried up" } }
      "ಹುಲ್ಲು ಒಣಗುತ್ತಿದೆ.": { native: "The grass is drying up.", bases: { "ಒಣಗುತ್ತಿದೆ": "is drying up" } }
