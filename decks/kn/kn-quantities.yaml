    ipa: "dʒaːst̪i"
    pos: "other"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ಇಂದು ಜಾಸ್ತಿ ಕೆಲಸ ಇದೆ.", reading: "indu jāsti kelasa ide.", ipa: "ind̪u dʒaːst̪i kelasa id̪e", bases: [{ word: "ಇಂದು", base: "ಇಂದು", reading: "indu" }, { word: "ಕೆಲಸ", base: "ಕೆಲಸ", reading: "kelasa" }, { word: "ಇದೆ", base: "ಇರು", reading: "iru" }] }
