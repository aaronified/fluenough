      - { target: "ಅವಳು ಒಂದು ಲೋಟ ಹಾಲು ಕುಡಿದಳು.", reading: "avaḷu ondu lōṭa hālu kuḍidaḷu.", ipa: "aʋaɭu ond̪u loːʈa haːlu kuɖid̪aɭu", bases: [{ word: "ಹಾಲು", base: "ಹಾಲು", reading: "hālu" }, { word: "ಕುಡಿದಳು", base: "ಕುಡಿ", reading: "kuḍi" }, { word: "ಅವಳು", base: "ಅವಳು", reading: "avaḷu" }] }
