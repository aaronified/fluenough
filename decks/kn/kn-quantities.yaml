    examples:
      - { target: "ನೂರು ಗ್ರಾಂ ಚಿಕನ್ ಕೊಡಿ.", reading: "nūru grām cikan koḍi.", ipa: "nuːru ɡraːm tʃikan koɖi", bases: [{ word: "ನೂರು", base: "ನೂರು", reading: "nūru" }, { word: "ಚಿಕನ್", base: "ಚಿಕನ್", reading: "cikan" }, { word: "ಕೊಡಿ", base: "ಕೊಡು", reading: "koḍu" }] }
