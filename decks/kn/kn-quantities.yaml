cards:
  - id: "kn-0696"
    target: "ಕೆಲವು"
    reading: "kelavu"
    ipa: "kelaʋu"
    pos: "other"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ಕೆಲವು ಮಕ್ಕಳು ಆಟ ಆಡುತ್ತಾರೆ.", reading: "kelavu makkaḷu āṭa āḍuttāre.", ipa: "kelaʋu makkaɭu aːʈa aːɖut̪t̪aːre", bases: [{ word: "ಮಕ್ಕಳು", base: "ಮಕ್ಕಳು", reading: "makkaḷu" }, { word: "ಆಟ", base: "ಆಟ", reading: "āṭa" }, { word: "ಆಡುತ್ತಾರೆ", base: "ಆಡು", reading: "āḍu" }] }
      - { target: "ನನಗೆ ಕೆಲವು ಪುಸ್ತಕ ಬೇಕು.", reading: "nanage kelavu pustaka bēku.", ipa: "nanaɡe kelaʋu pust̪aka beːku", bases: [{ word: "ನನಗೆ", base: "ನಾನು", reading: "nānu" }, { word: "ಪುಸ್ತಕ", base: "ಪುಸ್ತಕ", reading: "pustaka" }, { word: "ಬೇಕು", base: "ಬೇಕು", reading: "bēku" }] }
  - id: "kn-0697"
    target: "ಜಾಸ್ತಿ"
