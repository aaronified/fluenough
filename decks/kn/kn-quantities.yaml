      - { target: "ಡಜನ್ ಬಾಳೆಹಣ್ಣು ತೆಗೆದುಕೊಳ್ಳಿ.", reading: "ḍajan bāḷehaṇṇu tegedukoḷḷi.", ipa: "ɖadʒan baːɭehaɳɳu t̪eɡed̪ukoɭɭi", bases: [{ word: "ಬಾಳೆಹಣ್ಣು", base: "ಬಾಳೆಹಣ್ಣು", reading: "bāḷehaṇṇu" }, { word: "ತೆಗೆದುಕೊಳ್ಳಿ", base: "ತೆಗೆದುಕೊಳ್ಳು", reading: "tegedukoḷḷu" }] }
  - id: "kn-0699"
