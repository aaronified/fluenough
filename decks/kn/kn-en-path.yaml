# The order Kannada is taught from English in: one unit per line. First a
# few words and basic sentences, the sounds English lacks and how Kannada
# grammar differs from English; then five more themes, each with the grammar
# that goes with it; then the script, before the rest. Every kn-en deck is
# listed exactly once. See ADR-0013 and docs/DECK-FORMAT.md.
schema: 1
kind: path
id: kn-en-path
language: kn
native: en
# The decks that need the alphabet: a learner who learns without it
# skips them.
alphabet:
  - kn-en-script-vowels
  - kn-en-script-consonants
  - kn-en-script-reading
  - kn-en-script-vowel-signs
  - kn-en-script-conjuncts
  - kn-en-spelling
  - kn-en-reading-ravi
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  - [kn-en-first-words, kn-en-grammar-sentences, "*"]
  - [kn-en-sound-differences]
  - [kn-en-grammar-differences]
  - [kn-en-questions, kn-en-grammar-questions, "*"]
  - [kn-en-addressing, kn-en-grammar-pronouns, "*"]
  - [kn-en-about-me, "*"]
  - [kn-en-family, kn-en-grammar-be, "*"]
  - [kn-en-work, kn-en-grammar-demonstratives, "*"]
  - [kn-en-script-vowels, kn-en-script-consonants, kn-en-script-reading]
  - [kn-en-script-vowel-signs, kn-en-script-conjuncts]
  - [kn-en-numbers-1-20, "*"]
  - [kn-en-numbers-big, "*"]
  - [kn-en-market, kn-en-grammar-nouns, kn-en-grammar-articles, "*"]
  - [kn-en-groceries, kn-en-grammar-gender-number, kn-en-grammar-needs, "*"]
  - [kn-en-transport, kn-en-grammar-postpositions, "*"]
  - [kn-en-directions, kn-en-grammar-continuous, "*"]
  - [kn-en-home, kn-en-grammar-adjectives, "*"]
  - [kn-en-time, kn-en-grammar-future, "*"]
  - [kn-en-daily-life, kn-en-grammar-negative, "*"]
  - [kn-en-calendar, kn-en-grammar-past, "*"]
  - [kn-en-grammar-past-more, kn-en-grammar-conjunct-verbs]
  - [kn-en-grammar-compound-verbs]
  - [kn-en-eating-out, kn-en-grammar-conjunctions, kn-en-grammar-likes, "*"]
  - [kn-en-help, kn-en-grammar-irregular, kn-en-grammar-pitfalls, "*"]
  - [kn-en-registers]
  - [kn-en-slang]
  - [kn-en-grammar-can-must]
  - [kn-en-spelling]
  - [kn-en-reading-ravi]
  - ["*"]
