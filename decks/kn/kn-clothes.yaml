  - id: "kn-0900"
    target: "ಬಟ್ಟೆ"
    reading: "baṭṭe"
    ipa: "baʈʈe"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ಅವಳು ಹೊಸ ಬಟ್ಟೆ ಕೊಂಡಳು.", reading: "avaḷu hosa baṭṭe koṇḍaḷu.", ipa: "aʋaɭu hosa baʈʈe koɳɖaɭu", bases: [{ word: "ಹೊಸ", base: "ಹೊಸ", reading: "hosa" }, { word: "ಕೊಂಡಳು", base: "ಕೊಳ್ಳು", reading: "koḷḷu" }, { word: "ಅವಳು", base: "ಅವಳು", reading: "avaḷu" }] }
