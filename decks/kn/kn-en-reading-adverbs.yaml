passages:
  - id: "kn-habit-survey"
    title: "Habit survey"
    sentences:
      - text: "ನಾನು ಸಾಮಾನ್ಯವಾಗಿ ಓದುತ್ತೇನೆ."
        reading: "nānu sāmānyavāgi ōduttēne."
        ipa: "naːnu saːmaːnjaʋaːɡi oːd̪ut̪t̪eːne"
      - text: "ನಾನು ಆಗಾಗ ಹಾಡುತ್ತೇನೆ."
        reading: "nānu āgāga hāḍuttēne."
        ipa: "naːnu aːɡaːɡa haːɖut̪t̪eːne"
      - text: "ನಾನು ಎಂದೂ ಓಡುವುದಿಲ್ಲ."
        reading: "nānu endū ōḍuvudilla."
        ipa: "naːnu end̪uː oːɖuʋud̪illa"
      - text: "ನನ್ನ ಗೆಳೆಯ ಚೆನ್ನಾಗಿ ಆಡುತ್ತಾನೆ."
        reading: "nanna geḷeya cennāgi āḍuttāne."
        ipa: "nanna ɡeɭeja tʃennaːɡi aːɖut̪t̪aːne"
      - text: "ಅವನು ಕೆಲವೊಮ್ಮೆ ತಡವಾಗಿ ಬರುತ್ತಾನೆ."
        reading: "avanu kelavomme taḍavāgi baruttāne."
        ipa: "aʋanu kelaʋomme t̪aɖaʋaːɡi barut̪t̪aːne"
    questions:
      - id: "kn-9667"
        prompt: { en: "How often does the writer sing?" }
        options:
          - { en: "Now and then" }
          - { en: "Never" }
          - { en: "Always" }
        answer: 1
      - id: "kn-9668"
        prompt: { en: "The writer never runs." }
