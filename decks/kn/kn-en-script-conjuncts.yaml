schema: 1
id: kn-en-script-conjuncts
name: "Kannada conjuncts"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Two consonants with no vowel between them are joined: the second is written below the first, as a small form (ottakshara). Doubled consonants are everywhere in Kannada. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: kn-0086
    target: "ಕ್ಕ"
    native: "kk (double k)"
    reading: "kka"
    modes: [recognition, production]
    notes: "ಕ with its ottakshara below: the k is held longer. ಅಕ್ಕ (akka, elder sister). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  - id: kn-0087
