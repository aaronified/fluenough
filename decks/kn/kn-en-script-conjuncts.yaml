    native: "s + th"
    reading: "stha"
    notes: "ಸ್ಥಳ (sthala, place)."
  - id: kn-0110
    target: "ಷ್ಟ"
    native: "sh + curled-back t"
    reading: "shta"
    notes: "ಇಷ್ಟ (ishta, liking): ನನಗೆ ಇಷ್ಟ, I like it."
  - id: kn-0111
    target: "ರ್ಕ"
    native: "r + k (r written after)"
    reading: "rka"
    notes: "An r before another consonant is not written below it but after it, as a small mark, the arkavottu: ಸರ್ಕಾರ (sarkara, government), ಕರ್ನಾಟಕ (karnataka)."
