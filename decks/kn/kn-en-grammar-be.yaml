        "ಅವನು": ["ಇದ್ದನು", "ಇದ್ದ"]
        "ಅವಳು": ["ಇದ್ದಳು", "ಇದ್ಲು"]
        "ಅದು": "ಇತ್ತು"
        "ಅವರು": ["ಇದ್ದರು", "ಇದ್ರು"]
      readings:
        "ನಾನು": "idde"
        "ನಾವು": ["iddevu", "idvi"]
        "ನೀನು": "idde"
        "ನೀವು": ["iddiri", "idri"]
        "ಅವನು": ["iddanu", "idda"]
        "ಅವಳು": ["iddalu", "idlu"]
        "ಅದು": "ittu"
        "ಅವರು": ["iddaru", "idru"]
