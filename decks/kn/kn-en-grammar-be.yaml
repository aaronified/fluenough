schema: 1
id: kn-en-grammar-be
name: "To be: ಇರು, ಇಲ್ಲ and ಅಲ್ಲ"
kind: grammar
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN, icon: "ಕ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Is, was, will be: ಇರು for where and how things are, no verb at all for what someone is, ಇಲ್ಲ and ಅಲ್ಲ for not, and ಆಗು for became. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "ಇರು by tense"
  slot_name: "person"
  slots: ["ನಾನು", "ನಾವು", "ನೀನು", "ನೀವು", "ಅವನು", "ಅವಳು", "ಅದು", "ಅವರು"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "ಇರು says where or how someone is: ನಾನು ಮನೆಯಲ್ಲಿ ಇದ್ದೇನೆ, I'm at home. To say what someone is, Kannada needs no verb: ಅವರು ಡಾಕ್ಟರ್, he's a doctor. 'Is not somewhere' is ಇಲ್ಲ, the same for everyone: ನಾನು ಮನೆಯಲ್ಲಿ ಇಲ್ಲ, I'm not at home. 'Is not something' is ಅಲ್ಲ, also the same for everyone: ಇದು ನೀರು ಅಲ್ಲ, this isn't water. ಆಗು, to become, says what someone became: ಅವನು ಡಾಕ್ಟರ್ ಆದ, he became a doctor. The verb agrees with the doer's person and number. In the third person a man, a woman and a thing each have a form of their own: ಅವನು ಬಂದನು, ಅವಳು ಬಂದಳು, ಅದು ಬಂತು. ನೀವು, plural or respectful, takes the plural, and so does ಅವರು, they, or he or she with respect. Where two forms are given, the first is written Kannada and the second everyday speech; both are accepted."
  entries:
    - lemma: "ಇರು, now"
      key: iddeene
      reading: "iru, now"
      gloss: "to be (somewhere), now"
      forms:
        "ನಾನು": ["ಇದ್ದೇನೆ", "ಇದ್ದೀನಿ"]
        "ನಾವು": ["ಇದ್ದೇವೆ", "ಇದ್ದೀವಿ"]
        "ನೀನು": "ಇದ್ದೀಯ"
        "ನೀವು": "ಇದ್ದೀರಿ"
        "ಅವನು": "ಇದ್ದಾನೆ"
        "ಅವಳು": "ಇದ್ದಾಳೆ"
        "ಅದು": "ಇದೆ"
        "ಅವರು": "ಇದ್ದಾರೆ"
      readings:
        "ನಾನು": ["iddene", "iddini"]
        "ನಾವು": ["iddeve", "iddivi"]
        "ನೀನು": "iddiya"
        "ನೀವು": "iddiri"
        "ಅವನು": "iddane"
        "ಅವಳು": "iddale"
        "ಅದು": "ide"
        "ಅವರು": "iddare"
