description: "One true, surprising thing about Kannada a day, in English, Bengali and Hindi. Not yet checked by a Kannada speaker: please report any mistake."
facts:
  - id: kn-fact-001
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Dravidian_languages"
    text:
      en: "Kannada is a Dravidian language, related to Tamil, Telugu and Malayalam, not to Hindi or Bengali, though it has taken many words from Sanskrit."
      bn: "কন্নড় একটি দ্রাবিড় ভাষা; তামিল, তেলুগু ও মালয়ালমের আত্মীয়, হিন্দি বা বাংলার নয়, যদিও সংস্কৃত থেকে বহু শব্দ নিয়েছে।"
      hi: "कन्नड़ एक द्रविड़ भाषा है, जो तमिल, तेलुगु और मलयालम से जुड़ी है, हिंदी या बांग्ला से नहीं, हालाँकि इसने संस्कृत से बहुत से शब्द लिए हैं।"
  - id: kn-fact-002
    tags: [history]
    text:
      en: "Kannada is the official language of Karnataka, whose capital is Bengaluru."
      bn: "কন্নড় কর্ণাটকের সরকারি ভাষা; রাজ্যটির রাজধানী বেঙ্গালুরু।"
      hi: "कन्नड़ कर्नाटक की राजभाषा है, जिसकी राजधानी बेंगलुरु है।"
  - id: kn-fact-003
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Kannada"
    text:
      en: "About 44 million people speak Kannada as their first language, by India's 2011 census, and millions more speak it as a second language."
      bn: "ভারতের ২০১১ সালের জনগণনা অনুযায়ী প্রায় ৪.৪ কোটি মানুষের মাতৃভাষা কন্নড়, আর আরও লক্ষ লক্ষ মানুষ এটি দ্বিতীয় ভাষা হিসেবে বলেন।"
      hi: "भारत की 2011 की जनगणना के अनुसार लगभग 4.4 करोड़ लोगों की मातृभाषा कन्नड़ है, और लाखों और लोग इसे दूसरी भाषा के रूप में बोलते हैं।"
  - id: kn-fact-004
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Classical_languages_of_India"
    text:
      en: "India declared Kannada a classical language in 2008, the same year as Telugu."
      bn: "ভারত ২০০৮ সালে কন্নড়কে ধ্রুপদী ভাষার মর্যাদা দেয়, তেলুগুর সঙ্গে একই বছরে।"
      hi: "भारत ने 2008 में कन्नड़ को शास्त्रीय भाषा का दर्जा दिया, उसी साल जब तेलुगु को।"
  - id: kn-fact-005
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Halmidi_inscription"
    text:
      en: "The oldest known inscription wholly in Kannada, at Halmidi in Karnataka, is usually dated to about 450 CE, though some scholars place it later."
      bn: "সম্পূর্ণ কন্নড়ে লেখা প্রাচীনতম জানা শিলালিপিটি কর্ণাটকের হালমিডিতে; সাধারণত একে প্রায় ৪৫০ খ্রিস্টাব্দের বলে ধরা হয়, যদিও কোনো কোনো পণ্ডিত একে পরের বলে মনে করেন।"
      hi: "पूरी तरह कन्नड़ में लिखा सबसे पुराना ज्ञात शिलालेख कर्नाटक के हल्मिडी में है। इसे आम तौर पर लगभग 450 ईस्वी का माना जाता है, हालाँकि कुछ विद्वान इसे बाद का मानते हैं।"
  - id: kn-fact-006
    tags: [history, literature]
    source: "https://en.wikipedia.org/wiki/Kavirajamarga"
    text:
      en: "The oldest Kannada book that survives is the Kavirajamarga, a work on poetry from about 850 CE, written at the court of the Rashtrakuta king Amoghavarsha I."
      bn: "টিকে থাকা প্রাচীনতম কন্নড় গ্রন্থ কবিরাজমার্গ, প্রায় ৮৫০ খ্রিস্টাব্দের কাব্যতত্ত্বের বই, রাষ্ট্রকূট রাজা প্রথম অমোঘবর্ষের সভায় লেখা।"
      hi: "कन्नड़ की सबसे पुरानी बची हुई किताब कविराजमार्ग है, लगभग 850 ईस्वी का काव्यशास्त्र का ग्रंथ, जो राष्ट्रकूट राजा अमोघवर्ष प्रथम के दरबार में लिखा गया।"
  - id: kn-fact-007
    tags: [script, history]
    source: "https://en.wikipedia.org/wiki/Telugu%E2%80%93Kannada_alphabet"
    text:
      en: "Kannada and Telugu scripts grew from one script, often called the Telugu-Kannada script, and became separate scripts only some seven or eight hundred years ago. A reader of one can often guess letters of the other."
      bn: "কন্নড় ও তেলুগু লিপি একই লিপি থেকে এসেছে, যাকে প্রায়ই তেলুগু-কন্নড় লিপি বলা হয়; আলাদা লিপি হয়েছে মাত্র সাত-আটশো বছর আগে। একটি পড়তে পারলে অন্যটির অনেক অক্ষর আন্দাজ করা যায়।"
      hi: "कन्नड़ और तेलुगु लिपियाँ एक ही लिपि से निकली हैं, जिसे अक्सर तेलुगु-कन्नड़ लिपि कहा जाता है, और ये अलग लिपियाँ कोई सात-आठ सौ साल पहले ही बनीं। एक को पढ़ने वाला दूसरी के कई अक्षर पहचान लेता है।"
  - id: kn-fact-008
    tags: [script]
    source: "https://en.wikipedia.org/wiki/Kannada_script"
    text:
      en: "Kannada script also writes other languages of Karnataka: Tulu, Kodava and Konkani are often written in it."
      bn: "কন্নড় লিপিতে কর্ণাটকের অন্য ভাষাও লেখা হয়: তুলু, কোডাভা ও কোঙ্কণি প্রায়ই এই লিপিতে লেখা হয়।"
      hi: "कन्नड़ लिपि में कर्नाटक की दूसरी भाषाएँ भी लिखी जाती हैं: तुलु, कोडव और कोंकणी अक्सर इसी में लिखी जाती हैं।"
  - id: kn-fact-009
    tags: [literature]
    source: "https://en.wikipedia.org/wiki/Jnanpith_Award"
    text:
      en: "Kannada writers have won eight Jnanpith Awards, India's highest literary prize, more than writers in any other language except Hindi."
      bn: "কন্নড় লেখকেরা আটটি জ্ঞানপীঠ পুরস্কার পেয়েছেন, যা ভারতের সর্বোচ্চ সাহিত্য সম্মান; হিন্দি ছাড়া আর কোনো ভাষার লেখকেরা এর বেশি পাননি।"
      hi: "कन्नड़ लेखकों ने आठ ज्ञानपीठ पुरस्कार जीते हैं, जो भारत का सबसे बड़ा साहित्य सम्मान है; हिंदी को छोड़कर किसी और भाषा के लेखकों को इससे ज़्यादा नहीं मिले।"
  - id: kn-fact-010
    tags: [literature]
    source: "https://en.wikipedia.org/wiki/Kuvempu"
    text:
      en: "Kuvempu, the first Kannada writer to win the Jnanpith Award (1967), also wrote Karnataka's state song, Jaya Bharata Jananiya Tanujate."
      bn: "কুভেম্পু, জ্ঞানপীঠ পাওয়া প্রথম কন্নড় লেখক (১৯৬৭), কর্ণাটকের রাজ্যসংগীত 'জয় ভারত জননীয় তনুজাতে'-ও লিখেছেন।"
      hi: "कुवेम्पु, ज्ञानपीठ पाने वाले पहले कन्नड़ लेखक (1967), ने कर्नाटक का राज्यगीत 'जय भारत जननीय तनुजाते' भी लिखा।"
  - id: kn-fact-011
    tags: [pronunciation]
    text:
      en: "A short and a long vowel make different words: ಕರು (karu, with a short a) is a calf, ಕಾರು (kāru, with a long a) a car."
      bn: "ছোট আর দীর্ঘ স্বরে আলাদা শব্দ হয়: ಕರು (karu, ছোট স্বর) বাছুর, ಕಾರು (karu, দীর্ঘ স্বর) গাড়ি।"
      hi: "छोटा और लंबा स्वर अलग शब्द बनाते हैं: ಕರು (karu, छोटा स्वर) बछड़ा है, ಕಾರು (karu, लंबा स्वर) कार।"
  - id: kn-fact-012
    tags: [pronunciation]
    text:
      en: "Kannada has a short e and o as well as a long e and o, and they change the word: ಕೊಡು (koḍu, with a short o) is 'give', ಕೋಡು (kōḍu, with a long o) a horn."
      bn: "কন্নড়ে ছোট এ আর ও যেমন আছে, তেমনি দীর্ঘ এ আর ও-ও আছে, আর এতে শব্দ বদলে যায়: ಕೊಡು (kodu, ছোট ও) মানে 'দাও', ಕೋಡು (kodu, দীর্ঘ ও) শিং।"
      hi: "कन्नड़ में छोटे ए और ओ भी हैं और लंबे ए और ओ भी, और इनसे शब्द बदल जाता है: ಕೊಡು (kodu, छोटा ओ) का अर्थ है 'दो', ಕೋಡು (kodu, लंबा ओ) का 'सींग'।"
  - id: kn-fact-013
    tags: [pronunciation, script]
    text:
      en: "Kannada has two l's: ಲ with the tongue on the teeth and ಳ with it curled back. ಹಾಲು (hālu, with the tongue on the teeth) is milk, ಹಾಳು (hāḷu, with it curled back) is ruined."
      bn: "কন্নড়ে দুটি ল আছে: দাঁতে জিভ ছুঁইয়ে ಲ, আর জিভ উল্টে ಳ। ಹಾಲು (halu, দাঁতে জিভ ছুঁইয়ে) দুধ, ಹಾಳು (halu, জিভ উল্টে) নষ্ট।"
      hi: "कन्नड़ में दो ल हैं: दाँतों पर जीभ लगाकर ಲ, और जीभ पीछे मोड़कर ಳ। ಹಾಲು (halu, दाँतों पर जीभ लगाकर) दूध है, ಹಾಳು (halu, जीभ पीछे मोड़कर) बर्बाद।"
  - id: kn-fact-014
    tags: [pronunciation, loanwords]
    text:
      en: "Native Kannada words end in a vowel, and words borrowed from English often gain one: bus becomes ಬಸ್ಸು (bassu), car ಕಾರು (kāru)."
      bn: "দেশি কন্নড় শব্দ স্বরে শেষ হয়, আর ইংরেজি থেকে নেওয়া শব্দ প্রায়ই একটি স্বর পায়: bus হয় ಬಸ್ಸು (bassu), car হয় ಕಾರು (karu)।"
      hi: "देशी कन्नड़ शब्द स्वर पर ख़त्म होते हैं, और अंग्रेज़ी से लिए शब्दों में अक्सर एक स्वर जुड़ जाता है: bus बन जाता है ಬಸ್ಸು (bassu), car बन जाता है ಕಾರು (karu)।"
  - id: kn-fact-015
    tags: [grammar]
    text:
      en: "In the third person the verb tells a man, a woman and a thing apart: ಅವನು ಬಂದನು, he came; ಅವಳು ಬಂದಳು, she came; ಅದು ಬಂತು, it came."
      bn: "নাম পুরুষে ক্রিয়াপদ পুরুষ, নারী আর বস্তুকে আলাদা করে: ಅವನು ಬಂದನು, সে (পুরুষ) এল; ಅವಳು ಬಂದಳು, সে (নারী) এল; ಅದು ಬಂತು, ওটা এল।"
      hi: "अन्य पुरुष में क्रिया पुरुष, स्त्री और वस्तु को अलग करती है: ಅವನು ಬಂದನು, वह (पुरुष) आया; ಅವಳು ಬಂದಳು, वह (स्त्री) आई; ಅದು ಬಂತು, वह (चीज़) आई।"
  - id: kn-fact-016
    tags: [grammar]
    text:
      en: "Kannada has one word for 'we', ನಾವು (nāvu), whether or not it includes the listener. Its neighbours Telugu and Tamil have two."
      bn: "কন্নড়ে 'আমরা'-র একটাই শব্দ, ನಾವು (navu), শ্রোতা তাতে থাকুক বা না থাকুক। প্রতিবেশী তেলুগু আর তামিলে দুটি।"
      hi: "कन्नड़ में 'हम' के लिए एक ही शब्द है, ನಾವು (navu), चाहे सुनने वाला उसमें शामिल हो या नहीं। पड़ोसी तेलुगु और तमिल में दो हैं।"
  - id: kn-fact-017
    tags: [grammar]
    text:
      en: "Kannada needs no 'is' to say what something is: ಇದು ನನ್ನ ಮನೆ (idu nanna mane), 'this my house', is 'this is my house'."
      bn: "কোনো কিছু কী, তা বলতে কন্নড়ে 'হয়' লাগে না: ಇದು ನನ್ನ ಮನೆ (idu nanna mane), 'এটা আমার বাড়ি'।"
      hi: "कोई चीज़ क्या है, यह कहने के लिए कन्नड़ को 'है' नहीं चाहिए: ಇದು ನನ್ನ ಮನೆ (idu nanna mane), 'यह मेरा घर'।"
  - id: kn-fact-018
    tags: [grammar]
    text:
      en: "Kannada has two words for 'not': ಇಲ್ಲ (illa), something isn't there, and ಅಲ್ಲ (alla), something isn't so. ನೀರು ಇಲ್ಲ is 'there's no water'; ಇದು ನೀರು ಅಲ್ಲ, 'this isn't water'."
      bn: "কন্নড়ে 'না'-এর দুটি শব্দ: ಇಲ್ಲ (illa), কিছু নেই; ಅಲ್ಲ (alla), কিছু তা নয়। ನೀರು ಇಲ್ಲ মানে 'জল নেই'; ಇದು ನೀರು ಅಲ್ಲ মানে 'এটা জল নয়'।"
      hi: "कन्नड़ में 'नहीं' के दो शब्द हैं: ಇಲ್ಲ (illa), कोई चीज़ है ही नहीं; ಅಲ್ಲ (alla), कोई चीज़ वह नहीं है। ನೀರು ಇಲ್ಲ का अर्थ है 'पानी नहीं है'; ಇದು ನೀರು ಅಲ್ಲ, 'यह पानी नहीं है'।"
  - id: kn-fact-019
    tags: [grammar]
    text:
      en: "Kannada's negative is the same for every person: ನಾನು ಬರುವುದಿಲ್ಲ, I won't come, and ಅವರು ಬರುವುದಿಲ್ಲ, they won't come."
      bn: "কন্নড়ে না-বাচক ক্রিয়া সব পুরুষে একই: ನಾನು ಬರುವುದಿಲ್ಲ, আমি আসব না; ಅವರು ಬರುವುದಿಲ್ಲ, তারা আসবে না।"
      hi: "कन्नड़ में नकारात्मक क्रिया हर पुरुष के लिए एक जैसी है: ನಾನು ಬರುವುದಿಲ್ಲ, मैं नहीं आऊँगा; ಅವರು ಬರುವುದಿಲ್ಲ, वे नहीं आएँगे।"
  - id: kn-fact-020
    tags: [grammar]
    text:
      en: "To know a language in Kannada is to have it come to you: ನನಗೆ ಕನ್ನಡ ಬರುತ್ತದೆ (nanage kannaḍa baruttade), 'Kannada comes to me', is 'I know Kannada'."
      bn: "কন্নড়ে কোনো ভাষা জানা মানে সেটা তোমার কাছে 'আসে': ನನಗೆ ಕನ್ನಡ ಬರುತ್ತದೆ (nanage kannada baruttade), 'আমার কাছে কন্নড় আসে', মানে 'আমি কন্নড় জানি'।"
      hi: "कन्नड़ में कोई भाषा जानना उसका 'आना' है: ನನಗೆ ಕನ್ನಡ ಬರುತ್ತದೆ (nanage kannada baruttade), यानी 'मुझे कन्नड़ आती है'।"
  - id: kn-fact-021
    tags: [grammar, politeness]
    text:
      en: "To speak of one person with respect, Kannada uses the plural: ಅವರು (avaru) is 'they', and also 'he' or 'she' said with respect, and the verb is plural too."
      bn: "কাউকে সম্মান করে বলতে কন্নড় বহুবচন ব্যবহার করে: ಅವರು (avaru) মানে 'তারা', আবার সম্মানসূচক 'তিনি'ও, আর ক্রিয়াও বহুবচনে থাকে।"
      hi: "किसी एक व्यक्ति के बारे में आदर से बोलने के लिए कन्नड़ बहुवचन लेती है: ಅವರು (avaru) का अर्थ है 'वे', और आदर से 'वह' भी, और क्रिया भी बहुवचन में होती है।"
  - id: kn-fact-022
    tags: [numerals]
    text:
      en: "Kannada builds 21 to 99 from the tens and the units, but runs them into one word: ಇಪ್ಪತ್ತು (20) and ಒಂದು (1) make ಇಪ್ಪತ್ತೊಂದು (ippattondu), 21."
      bn: "কন্নড়ে ২১ থেকে ৯৯ দশক আর একক মিলিয়ে তৈরি হয়, তবে দুটো জুড়ে একটি শব্দ হয়: ಇಪ್ಪತ್ತು (২০) আর ಒಂದು (১) মিলে ಇಪ್ಪತ್ತೊಂದು (ippattondu), ২১।"
      hi: "कन्नड़ 21 से 99 तक की संख्याएँ दहाई और इकाई से बनाती है, पर दोनों को जोड़कर एक शब्द कर देती है: ಇಪ್ಪತ್ತು (20) और ಒಂದು (1) से ಇಪ್ಪತ್ತೊಂದು (ippattondu), 21।"
  - id: kn-fact-023
    tags: [numerals]
    text:
      en: "Each hundred is one word built on ನೂರು (nūru), a hundred: ಇನ್ನೂರು (innūru) is 200, ಮುನ್ನೂರು (munnūru) 300, ಐನೂರು (ainūru) 500."
      bn: "প্রতিটি শতক ನೂರು (nuru, একশো) থেকে তৈরি একটি শব্দ: ಇನ್ನೂರು (innuru) ২০০, ಮುನ್ನೂರು (munnuru) ৩০০, ಐನೂರು (ainuru) ৫০০।"
      hi: "हर सैकड़ा ನೂರು (nuru, सौ) पर बना एक शब्द है: ಇನ್ನೂರು (innuru) 200 है, ಮುನ್ನೂರು (munnuru) 300, ಐನೂರು (ainuru) 500।"
  - id: kn-fact-024
    tags: [numerals, grammar]
    text:
      en: "People are counted with words of their own: ಒಬ್ಬರು (obbaru), one person; ಇಬ್ಬರು (ibbaru), two; ಮೂವರು (mūvaru), three. Things take the plain numbers, ಒಂದು, ಎರಡು, ಮೂರು."
      bn: "মানুষ গোনার আলাদা শব্দ আছে: ಒಬ್ಬರು (obbaru), একজন; ಇಬ್ಬರು (ibbaru), দুজন; ಮೂವರು (muvaru), তিনজন। জিনিস গোনা হয় সাধারণ সংখ্যায়: ಒಂದು, ಎರಡು, ಮೂರು।"
      hi: "लोगों को गिनने के अलग शब्द हैं: ಒಬ್ಬರು (obbaru), एक व्यक्ति; ಇಬ್ಬರು (ibbaru), दो; ಮೂವರು (muvaru), तीन। चीज़ें सामान्य संख्याओं से गिनी जाती हैं: ಒಂದು, ಎರಡು, ಮೂರು।"
  - id: kn-fact-025
    tags: [numerals, script]
    text:
      en: "Kannada has its own digits, ೦ ೧ ೨ ೩ ೪ ೫ ೬ ೭ ೮ ೯, but everyday life in Karnataka mostly uses 0 to 9."
      bn: "কন্নড়ের নিজস্ব অঙ্ক আছে, ೦ ೧ ೨ ೩ ೪ ೫ ೬ ೭ ೮ ೯, তবে কর্ণাটকের রোজকার জীবনে বেশিরভাগ সময় 0 থেকে 9 চলে।"
      hi: "कन्नड़ के अपने अंक हैं, ೦ ೧ ೨ ೩ ೪ ೫ ೬ ೭ ೮ ೯, पर कर्नाटक की रोज़मर्रा ज़िंदगी में ज़्यादातर 0 से 9 चलते हैं।"
  - id: kn-fact-026
    tags: [script, conjuncts]
    source: "https://en.wikipedia.org/wiki/Kannada_script"
    text:
      en: "An r before another consonant is written after that consonant, as a small mark called ಅರ್ಕಾವೊತ್ತು (arkāvottu): in ಕರ್ನಾಟಕ (karnāṭaka) the r is the mark after ನ."
      bn: "অন্য ব্যঞ্জনের আগের র লেখা হয় সেই ব্যঞ্জনের পরে, একটি ছোট চিহ্ন হিসেবে, যার নাম ಅರ್ಕಾವೊತ್ತು (arkavottu): ಕರ್ನಾಟಕ (karnataka)-য় র হলো ನ-এর পরের চিহ্নটি।"
      hi: "किसी व्यंजन से पहले आने वाला र उस व्यंजन के बाद एक छोटे निशान के रूप में लिखा जाता है, जिसे ಅರ್ಕಾವೊತ್ತು (arkavottu) कहते हैं: ಕರ್ನಾಟಕ (karnataka) में र, ನ के बाद वाला निशान है।"
  - id: kn-fact-027
    tags: [script, conjuncts]
    text:
      en: "Two consonants with no vowel between them are written one under the other: the second becomes a small form below the first, the ಒತ್ತಕ್ಷರ (ottakṣara). ಅಮ್ಮ (amma, mother) has a small ಮ under the first."
      bn: "মাঝে স্বর ছাড়া দুটি ব্যঞ্জন একটির নিচে আরেকটি লেখা হয়: দ্বিতীয়টি প্রথমটির নিচে ছোট রূপ নেয়, যার নাম ಒತ್ತಕ್ಷರ (ottakshara)। ಅಮ್ಮ (amma, মা)-তে প্রথম ಮ-এর নিচে একটি ছোট ಮ।"
      hi: "बीच में स्वर के बिना दो व्यंजन एक के नीचे एक लिखे जाते हैं: दूसरा पहले के नीचे छोटा रूप ले लेता है, जिसे ಒತ್ತಕ್ಷರ (ottakshara) कहते हैं। ಅಮ್ಮ (amma, माँ) में पहले ಮ के नीचे एक छोटा ಮ है।"
  - id: kn-fact-028
    tags: [script, history]
    source: "https://en.wikipedia.org/wiki/Kannada_script"
    text:
      en: "Old Kannada had two letters that today's spelling has dropped: ೞ, an l said far back in the mouth like the zh of Tamil, and ಱ, a second r. They merged with ಳ and ರ."
      bn: "প্রাচীন কন্নড়ে দুটি অক্ষর ছিল যা আজকের বানানে নেই: ೞ, তামিলের zh-এর মতো মুখের অনেক ভেতরে উচ্চারিত এক ল, আর ಱ, দ্বিতীয় একটি র। এগুলো ಳ আর ರ-এর সঙ্গে মিশে গেছে।"
      hi: "पुरानी कन्नड़ में दो अक्षर थे जो आज की वर्तनी में नहीं हैं: ೞ, तमिल के zh जैसा मुँह में बहुत पीछे बोला जाने वाला ल, और ಱ, एक दूसरा र। ये ಳ और ರ में मिल गए।"
  - id: kn-fact-029
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Kannada"
    text:
      en: "Kannada's history is told in three stages: Old Kannada (ಹಳಗನ್ನಡ, halegannada), Middle Kannada (ನಡುಗನ್ನಡ, nadugannada) and Modern Kannada (ಹೊಸಗನ್ನಡ, hosagannada), 'old', 'middle' and 'new' Kannada."
      bn: "কন্নড়ের ইতিহাস তিন পর্বে বলা হয়: প্রাচীন কন্নড় (ಹಳಗನ್ನಡ, halegannada), মধ্য কন্নড় (ನಡುಗನ್ನಡ, nadugannada) ও আধুনিক কন্নড় (ಹೊಸಗನ್ನಡ, hosagannada): 'পুরনো', 'মাঝের' আর 'নতুন' কন্নড়।"
      hi: "कन्नड़ का इतिहास तीन दौर में बताया जाता है: पुरानी कन्नड़ (ಹಳಗನ್ನಡ, halegannada), मध्य कन्नड़ (ನಡುಗನ್ನಡ, nadugannada) और आधुनिक कन्नड़ (ಹೊಸಗನ್ನಡ, hosagannada): 'पुरानी', 'बीच की' और 'नई' कन्नड़।"
  - id: kn-fact-030
    tags: [literature, history]
    source: "https://en.wikipedia.org/wiki/Vachana_sahitya"
    text:
      en: "In the 12th century Basavanna and other poets of the Vachana movement wrote short, plain poems in the Kannada people spoke, rather than in a learned style. They are still recited."
      bn: "দ্বাদশ শতকে বসবন্ন ও বচন আন্দোলনের অন্য কবিরা পণ্ডিতি রীতিতে নয়, মানুষের মুখের কন্নড়ে ছোট, সরল কবিতা লিখেছিলেন। সেগুলো আজও আবৃত্তি করা হয়।"
      hi: "12वीं सदी में बसवन्ना और वचन आंदोलन के दूसरे कवियों ने विद्वानों की शैली के बजाय लोगों की बोली वाली कन्नड़ में छोटी, सीधी कविताएँ लिखीं। वे आज भी सुनाई जाती हैं।"
  - id: kn-fact-031
    tags: [music, history]
    source: "https://en.wikipedia.org/wiki/Purandara_Dasa"
    text:
      en: "Purandara Dasa, a 15th–16th-century composer who sang in Kannada, is called the father of Carnatic music, the classical music of south India."
      bn: "পঞ্চদশ-ষোড়শ শতকের সুরকার পুরন্দর দাস, যিনি কন্নড়ে গান রচনা করতেন, দক্ষিণ ভারতের শাস্ত্রীয় সংগীত কর্ণাটকী সংগীতের জনক বলে পরিচিত।"
      hi: "15वीं-16वीं सदी के संगीतकार पुरंदर दास, जो कन्नड़ में गीत रचते थे, कर्नाटक संगीत, यानी दक्षिण भारत के शास्त्रीय संगीत, के पितामह कहे जाते हैं।"
  - id: kn-fact-032
    tags: [history, words]
    source: "https://en.wikipedia.org/wiki/Ferdinand_Kittel"
    text:
      en: "A German missionary, Ferdinand Kittel, published a Kannada–English dictionary of about 70,000 words in 1894. It is still used today."
      bn: "জার্মান মিশনারি ফার্দিনান্দ কিটেল ১৮৯৪ সালে প্রায় ৭০,০০০ শব্দের একটি কন্নড়-ইংরেজি অভিধান প্রকাশ করেন। সেটি আজও ব্যবহৃত হয়।"
      hi: "जर्मन मिशनरी फ़र्डिनेंड किटेल ने 1894 में लगभग 70,000 शब्दों का कन्नड़-अंग्रेज़ी शब्दकोश प्रकाशित किया। यह आज भी काम में आता है।"
  - id: kn-fact-033
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Karnataka_Rajyotsava"
    text:
      en: "Kannada Rajyotsava, on 1 November, marks the day in 1956 when the Kannada-speaking regions were joined into one state. It was named Mysore State then, and renamed Karnataka in 1973."
      bn: "১ নভেম্বর কন্নড় রাজ্যোৎসব; ১৯৫৬ সালের এই দিনে কন্নড়ভাষী অঞ্চলগুলো এক রাজ্যে যুক্ত হয়। তখন নাম ছিল মহীশূর রাজ্য, ১৯৭৩ সালে নাম হয় কর্ণাটক।"
      hi: "1 नवंबर को कन्नड़ राज्योत्सव मनाया जाता है: 1956 में इसी दिन कन्नड़ बोलने वाले इलाके एक राज्य में मिलाए गए। तब उसका नाम मैसूर राज्य था, 1973 में उसे कर्नाटक नाम मिला।"
  - id: kn-fact-034
    tags: [words, family]
    source: "https://en.wikipedia.org/wiki/Dravidian_kinship"
    text:
      en: "One word, ಮಾವ (māva), means both a mother's brother and a father-in-law, and ಅತ್ತೆ (atte) both a father's sister and a mother-in-law. In the old south Indian custom of marrying a cousin, they could be the same person."
      bn: "একটি শব্দ, ಮಾವ (mava), মানে মামা আবার শ্বশুরও, আর ಅತ್ತೆ (atte) মানে পিসি আবার শাশুড়িও। দক্ষিণ ভারতে মামাতো-পিসতুতো ভাইবোনের বিয়ের পুরনো রীতিতে তাঁরা একই মানুষ হতে পারতেন।"
      hi: "एक ही शब्द ಮಾವ (mava) का अर्थ मामा भी है और ससुर भी, और ಅತ್ತೆ (atte) का बुआ भी और सास भी। दक्षिण भारत में ममेरे-फुफेरे भाई-बहनों के विवाह की पुरानी रीति में ये एक ही व्यक्ति हो सकते थे।"
  - id: kn-fact-035
    tags: [register]
    text:
      en: "Spoken Kannada shortens many written forms: ಮಾಡುತ್ತೇನೆ (māḍuttēne), 'I do', is ಮಾಡ್ತೀನಿ (māḍtīni) in Bengaluru speech."
      bn: "মুখের কন্নড় অনেক লিখিত রূপ ছোট করে নেয়: ಮಾಡುತ್ತೇನೆ (maduttene), 'আমি করি', বেঙ্গালুরুর কথ্য ভাষায় ಮಾಡ್ತೀನಿ (madtini)।"
      hi: "बोलचाल की कन्नड़ कई लिखित रूपों को छोटा कर देती है: ಮಾಡುತ್ತೇನೆ (maduttene), 'मैं करता हूँ', बेंगलुरु की बोली में ಮಾಡ್ತೀನಿ (madtini) है।"
  - id: kn-fact-036
    tags: [dialects]
    source: "https://en.wikipedia.org/wiki/Kannada_dialects"
    text:
      en: "Kannada sounds different across the state: the Kannada of Dharwad in the north, of Mangaluru on the coast and of Mysuru in the south each have words and endings of their own."
      bn: "রাজ্যের নানা প্রান্তে কন্নড় আলাদা শোনায়: উত্তরের ধারওয়াড়, উপকূলের ম্যাঙ্গালুরু আর দক্ষিণের মহীশূরের কন্নড়ে নিজস্ব শব্দ আর বিভক্তি আছে।"
      hi: "पूरे राज्य में कन्नड़ अलग-अलग सुनाई देती है: उत्तर में धारवाड़ की, तट पर मंगलुरु की और दक्षिण में मैसूरु की कन्नड़ के अपने शब्द और प्रत्यय हैं।"
  - id: kn-fact-037
    tags: [culture]
    source: "https://en.wikipedia.org/wiki/Kannada_cinema"
    text:
      en: "The Kannada film industry is nicknamed Sandalwood, after the sandalwood Karnataka is famous for, on the pattern of Hollywood and Bollywood."
      bn: "কন্নড় চলচ্চিত্র শিল্পের ডাকনাম স্যান্ডেলউড, কর্ণাটকের বিখ্যাত চন্দনকাঠের নামে, হলিউড-বলিউডের ধাঁচে।"
      hi: "कन्नड़ फ़िल्म उद्योग का उपनाम सैंडलवुड है, कर्नाटक के मशहूर चंदन के नाम पर, हॉलीवुड और बॉलीवुड की तर्ज़ पर।"
  - id: kn-fact-101
    contrast: en
    tags: [pronunciation]
    text:
      en: "English t and d sit between Kannada's two kinds. ತ and ದ, with the tongue on the teeth, sound softer than English; ಟ and ಡ, with it curled back, sound harder. To a Kannada ear an English t is closer to ಟ, so 'ticket' is written ಟಿಕೆಟ್."
  - id: kn-fact-102
    contrast: en
    tags: [pronunciation]
    text:
      en: "English adds a glide to its long vowels, as in 'say' and 'go'. Kannada's ಏ and ಓ are held steady, with no glide: ಏಳು (ēḷu), ಓದು (ōdu)."
  - id: kn-fact-103
    contrast: en
    tags: [grammar]
    text:
      en: "English puts 'in', 'to' and 'from' before a noun; Kannada adds them to its end: ಮನೆಯಲ್ಲಿ, 'house-in', is 'in the house'."
  - id: kn-fact-104
    contrast: hi
    tags: [pronunciation]
    text:
      en: "Hindi drops the last a of a word, so कमल is kamal; Kannada says every final vowel, so ಕಮಲ is kamala."
      hi: "हिंदी शब्द के अंत का अ नहीं बोलती, इसलिए कमल 'कमल्' बोला जाता है; कन्नड़ हर अंतिम स्वर बोलती है, इसलिए ಕಮಲ है 'कमला'।"
  - id: kn-fact-105
    contrast: hi
    tags: [grammar]
    text:
      en: "Like Hindi मुझे कन्नड़ आती है, Kannada says a language 'comes to' you: ನನಗೆ ಕನ್ನಡ ಬರುತ್ತದೆ."
      hi: "हिंदी के 'मुझे कन्नड़ आती है' की तरह, कन्नड़ में भी भाषा 'आती' है: ನನಗೆ ಕನ್ನಡ ಬರುತ್ತದೆ।"
  - id: kn-fact-106
    contrast: bn
    tags: [pronunciation]
    text:
      en: "Bengali does not tell short and long vowels apart, but Kannada does: ಕರು (karu, with a short a) is a calf, ಕಾರು (kāru, with a long a) a car. Hold the long one about twice as long."
      bn: "বাংলা ছোট আর দীর্ঘ স্বর আলাদা করে না, কিন্তু কন্নড় করে: ಕರು (karu, ছোট স্বর) বাছুর, ಕಾರು (karu, দীর্ঘ স্বর) গাড়ি। দীর্ঘ স্বরটা প্রায় দ্বিগুণ সময় ধরে রাখুন।"
  - id: kn-fact-107
    contrast: bn
    tags: [grammar]
    text:
      en: "Bengali has no grammatical gender, but Kannada's verb tells he, she and it apart: ಅವನು ಬಂದನು, ಅವಳು ಬಂದಳು, ಅದು ಬಂತು."
      bn: "বাংলায় ব্যাকরণগত লিঙ্গ নেই, কিন্তু কন্নড়ের ক্রিয়া পুরুষ, নারী আর বস্তুকে আলাদা করে: ಅವನು ಬಂದನು, ಅವಳು ಬಂದಳು, ಅದು ಬಂತು।"
