passages:
  - id: "kn-match-report"
    title: "Match report"
    sentences:
      - text: "ನಿನ್ನೆ ಫುಟ್ಬಾಲ್ ಪಂದ್ಯ ಇತ್ತು."
        reading: "ninne phuṭbāl pandya ittu."
        ipa: "ninne pʰuʈbaːl pand̪ja it̪t̪u"
      - text: "ಕ್ರೀಡಾಂಗಣದಲ್ಲಿ ಪ್ರೇಕ್ಷಕರು ಬಹಳ ಇದ್ದರು."
        reading: "krīḍāṅgaṇadalli prēkṣakaru bahaḷa iddaru."
        ipa: "kriːɖaːŋɡaɳad̪alli preːkʂakaru bahaɭa id̪d̪aru"
      - text: "ರವಿ ಎರಡು ಗೋಲು ಮಾಡಿದ."
        reading: "ravi eraḍu gōlu māḍida."
        ipa: "raʋi eraɖu ɡoːlu maːɖid̪a"
      - text: "ಅವನಿಗೆ ಪದಕ ಇದೆ."
        reading: "avanige padaka ide."
        ipa: "aʋaniɡe pad̪aka id̪e"
      - text: "ಆಟಗಾರರು ಸಂತೋಷವಾಗಿದ್ದಾರೆ."
        reading: "āṭagāraru santōṣavāgiddāre."
        ipa: "aːʈaɡaːraru sant̪oːʂaʋaːɡid̪d̪aːre"
    questions:
      - id: "kn-9376"
        prompt: { en: "When was the football match?" }
        options:
          - { en: "Yesterday" }
          - { en: "Tomorrow" }
          - { en: "Next month" }
        answer: 1
      - id: "kn-9377"
        prompt: { en: "Ravi scored two goals." }
        answer: true
      - id: "kn-9378"
        prompt: { en: "Ravi has a medal." }
        answer: true
