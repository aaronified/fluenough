schema: 1
id: kn-en-about-me
name: "About me"
kind: vocab
theme: about-me
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Your name, where you are from, where you live, and the people around you. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: kn-0196
    target: "ಹೆಸರು"
    native: "name"
    reading: "hesaru"
    pos: "noun"
  - id: kn-0197
    target: "ನನ್ನ ಹೆಸರು …"
    native: "My name is …"
    reading: "nanna hesaru ..."
    pos: "phrase"
    notes: "No 'is': 'my name …'."
  - id: kn-0198
    target: "ನಿಮ್ಮ ಹೆಸರು ಏನು?"
    native: "What is your name?"
    reading: "nimma hesaru enu?"
    pos: "phrase"
    notes: "To a child or a friend: ನಿನ್ನ ಹೆಸರು ಏನು? (ninna hesaru enu?)."
  - id: kn-0199
    target: "ನಾನು ಇಂಗ್ಲೆಂಡಿನಿಂದ ಬಂದಿದ್ದೇನೆ."
    native: "I'm from England."
    reading: "nanu inglendininda bandiddene."
    pos: "phrase"
    notes: "Literally 'I have come from England'. -ಇಂದ is 'from'."
  - id: kn-0200
    target: "ನಾನು ಬೆಂಗಳೂರಿನಲ್ಲಿ ಇದ್ದೇನೆ."
    native: "I live in Bengaluru."
    reading: "nanu bengalurinalli iddene."
    alt_target: ["ನಾನು ಬೆಂಗಳೂರಲ್ಲಿ ಇದ್ದೀನಿ."]
    pos: "phrase"
    notes: "ಇರು (iru) is both 'to be' and 'to live, to stay'. In speech, ಬೆಂಗಳೂರಲ್ಲಿ ಇದ್ದೀನಿ."
  - id: kn-0201
    target: "ಮನೆ"
    native: "home; house"
    reading: "mane"
    pos: "noun"
    notes: "ಮನೆಗೆ (manege), home, to the house; ಮನೆಯಲ್ಲಿ (maneyalli), at home."
  - id: kn-0202
    target: "ಕುಟುಂಬ"
    native: "family"
    reading: "kutumba"
    pos: "noun"
    notes: "Also ಮನೆಯವರು (maneyavaru), 'the people of the house'."
  - id: kn-0203
    target: "ಕೆಲಸ"
    native: "work; a job"
    reading: "kelasa"
    pos: "noun"
  - id: kn-0204
    target: "ಊರು"
    native: "town; home town"
    reading: "uru"
    pos: "noun"
    notes: "ನಿಮ್ಮ ಊರು ಯಾವುದು? (nimma uru yavudu?), where are you from? Asked of almost everyone."
  - id: kn-0205
    target: "ದೇಶ"
    native: "country"
    reading: "desha"
    pos: "noun"
  - id: kn-0206
    target: "ಭಾಷೆ"
    native: "language"
    reading: "bhashe"
    pos: "noun"
    notes: "ಕನ್ನಡ ಭಾಷೆ, the Kannada language."
