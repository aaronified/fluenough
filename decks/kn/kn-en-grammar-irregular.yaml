schema: 1
id: kn-en-grammar-irregular
name: "Irregular verbs"
kind: grammar
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN, icon: "ಕ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The common verbs whose stem changes in the past. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Irregular verbs"
  slot_name: "form"
  slots: ["past, ನಾನು (nānu)", "future, ನಾನು (nānu)", "polite request, ನೀವು (nīvu)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "These change their stem in the past: ಬರು (to come) gives ಬಂದೆ (bande), but ಬರುತ್ತೇನೆ (baruttēne) and ಬನ್ನಿ (banni); ಕೊಡು (to give) gives ಕೊಟ್ಟೆ (koṭṭe). Where two forms are given, the second is everyday speech."
  entries:
    - lemma: "ಬರು"
      key: baru
      reading: "baru"
      ipa: "baru"
      gloss: "to come"
      forms:
        "past, ನಾನು (nānu)": "ಬಂದೆ"
        "future, ನಾನು (nānu)": ["ಬರುತ್ತೇನೆ", "ಬರ್ತೀನಿ"]
        "polite request, ನೀವು (nīvu)": "ಬನ್ನಿ"
      readings:
        "past, ನಾನು (nānu)": "bande"
        "future, ನಾನು (nānu)": ["baruttēne", "bartīni"]
        "polite request, ನೀವು (nīvu)": "banni"
      ipas:
        "past, ನಾನು (nānu)": "band̪e"
        "future, ನಾನು (nānu)": "barut̪t̪eːne"
        "polite request, ನೀವು (nīvu)": "banni"
    - lemma: "ಹೋಗು"
      key: hoogu
      reading: "hōgu"
      ipa: "hoːɡu"
      gloss: "to go"
      forms:
        "past, ನಾನು (nānu)": "ಹೋದೆ"
        "future, ನಾನು (nānu)": ["ಹೋಗುತ್ತೇನೆ", "ಹೋಗ್ತೀನಿ"]
        "polite request, ನೀವು (nīvu)": "ಹೋಗಿ"
      readings:
        "past, ನಾನು (nānu)": "hōde"
        "future, ನಾನು (nānu)": ["hōguttēne", "hōgtīni"]
        "polite request, ನೀವು (nīvu)": "hōgi"
      ipas:
        "past, ನಾನು (nānu)": "hoːd̪e"
        "future, ನಾನು (nānu)": "hoːɡut̪t̪eːne"
        "polite request, ನೀವು (nīvu)": "hoːɡi"
    - lemma: "ತಿನ್ನು"
      key: tinnu
      reading: "tinnu"
      ipa: "t̪innu"
      gloss: "to eat"
      forms:
        "past, ನಾನು (nānu)": "ತಿಂದೆ"
        "future, ನಾನು (nānu)": ["ತಿನ್ನುತ್ತೇನೆ", "ತಿಂತೀನಿ"]
        "polite request, ನೀವು (nīvu)": "ತಿನ್ನಿ"
      readings:
        "past, ನಾನು (nānu)": "tinde"
        "future, ನಾನು (nānu)": ["tinnuttēne", "tintīni"]
        "polite request, ನೀವು (nīvu)": "tinni"
      ipas:
        "past, ನಾನು (nānu)": "t̪ind̪e"
        "future, ನಾನು (nānu)": "t̪innut̪t̪eːne"
        "polite request, ನೀವು (nīvu)": "t̪inni"
    - lemma: "ಕೊಡು"
      key: kodu
      reading: "koḍu"
      ipa: "koɖu"
      gloss: "to give"
      forms:
        "past, ನಾನು (nānu)": "ಕೊಟ್ಟೆ"
        "future, ನಾನು (nānu)": ["ಕೊಡುತ್ತೇನೆ", "ಕೊಡ್ತೀನಿ"]
        "polite request, ನೀವು (nīvu)": "ಕೊಡಿ"
      readings:
        "past, ನಾನು (nānu)": "koṭṭe"
        "future, ನಾನು (nānu)": ["koḍuttēne", "koḍtīni"]
        "polite request, ನೀವು (nīvu)": "koḍi"
      ipas:
        "past, ನಾನು (nānu)": "koʈʈe"
        "future, ನಾನು (nānu)": "koɖut̪t̪eːne"
        "polite request, ನೀವು (nīvu)": "koɖi"
    - lemma: "ತೆಗೆದುಕೊಳ್ಳು"
      key: tegedukollu
      reading: "tegedukoḷḷu"
      ipa: "t̪eɡed̪ukoɭɭu"
      gloss: "to take"
      forms:
        "past, ನಾನು (nānu)": ["ತೆಗೆದುಕೊಂಡೆ", "ತಗೊಂಡೆ"]
        "future, ನಾನು (nānu)": ["ತೆಗೆದುಕೊಳ್ಳುತ್ತೇನೆ", "ತಗೊಳ್ತೀನಿ"]
        "polite request, ನೀವು (nīvu)": ["ತೆಗೆದುಕೊಳ್ಳಿ", "ತಗೊಳ್ಳಿ"]
      readings:
        "past, ನಾನು (nānu)": ["tegedukoṇḍe", "tagoṇḍe"]
        "future, ನಾನು (nānu)": ["tegedukoḷḷuttēne", "tagoḷtīni"]
        "polite request, ನೀವು (nīvu)": ["tegedukoḷḷi", "tagoḷḷi"]
      ipas:
        "past, ನಾನು (nānu)": "t̪eɡed̪ukoɳɖe"
        "future, ನಾನು (nānu)": "t̪eɡed̪ukoɭɭut̪t̪eːne"
        "polite request, ನೀವು (nīvu)": "t̪eɡed̪ukoɭɭi"
    - lemma: "ಇಡು"
      key: idu
      reading: "iḍu"
      ipa: "iɖu"
      gloss: "to put; to keep"
      forms:
        "past, ನಾನು (nānu)": "ಇಟ್ಟೆ"
        "future, ನಾನು (nānu)": ["ಇಡುತ್ತೇನೆ", "ಇಡ್ತೀನಿ"]
        "polite request, ನೀವು (nīvu)": "ಇಡಿ"
      readings:
        "past, ನಾನು (nānu)": "iṭṭe"
        "future, ನಾನು (nānu)": ["iḍuttēne", "iḍtīni"]
        "polite request, ನೀವು (nīvu)": "iḍi"
      ipas:
        "past, ನಾನು (nānu)": "iʈʈe"
        "future, ನಾನು (nānu)": "iɖut̪t̪eːne"
        "polite request, ನೀವು (nīvu)": "iɖi"
