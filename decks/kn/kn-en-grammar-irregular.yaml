schema: 1
id: kn-en-grammar-irregular
name: "Irregular verbs"
kind: grammar
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN, icon: "ಕ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The common verbs whose stem changes in the past. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Irregular verbs"
  slot_name: "form"
  slots: ["past, ನಾನು", "future, ನಾನು", "polite request, ನೀವು"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "These change their stem in the past: ಬರು (to come) gives ಬಂದೆ, but ಬರುತ್ತೇನೆ and ಬನ್ನಿ; ಕೊಡು (to give) gives ಕೊಟ್ಟೆ. Where two forms are given, the second is everyday speech."
  entries:
    - lemma: "ಬರು"
      key: baru
      reading: "baru"
      ipa: "baru"
      gloss: "to come"
      forms:
        "past, ನಾನು": "ಬಂದೆ"
        "future, ನಾನು": ["ಬರುತ್ತೇನೆ", "ಬರ್ತೀನಿ"]
        "polite request, ನೀವು": "ಬನ್ನಿ"
      readings:
        "past, ನಾನು": "bande"
        "future, ನಾನು": ["baruttēne", "bartīni"]
        "polite request, ನೀವು": "banni"
      ipas:
        "past, ನಾನು": "band̪e"
        "future, ನಾನು": "barut̪t̪eːne"
        "polite request, ನೀವು": "banni"
    - lemma: "ಹೋಗು"
      key: hoogu
      reading: "hōgu"
      ipa: "hoːɡu"
      gloss: "to go"
      forms:
        "past, ನಾನು": "ಹೋದೆ"
        "future, ನಾನು": ["ಹೋಗುತ್ತೇನೆ", "ಹೋಗ್ತೀನಿ"]
        "polite request, ನೀವು": "ಹೋಗಿ"
      readings:
        "past, ನಾನು": "hōde"
        "future, ನಾನು": ["hōguttēne", "hōgtīni"]
        "polite request, ನೀವು": "hōgi"
      ipas:
        "past, ನಾನು": "hoːd̪e"
        "future, ನಾನು": "hoːɡut̪t̪eːne"
        "polite request, ನೀವು": "hoːɡi"
    - lemma: "ತಿನ್ನು"
      key: tinnu
      reading: "tinnu"
      ipa: "t̪innu"
      gloss: "to eat"
      forms:
        "past, ನಾನು": "ತಿಂದೆ"
        "future, ನಾನು": ["ತಿನ್ನುತ್ತೇನೆ", "ತಿಂತೀನಿ"]
        "polite request, ನೀವು": "ತಿನ್ನಿ"
      readings:
        "past, ನಾನು": "tinde"
        "future, ನಾನು": ["tinnuttēne", "tintīni"]
        "polite request, ನೀವು": "tinni"
      ipas:
        "past, ನಾನು": "t̪ind̪e"
        "future, ನಾನು": "t̪innut̪t̪eːne"
        "polite request, ನೀವು": "t̪inni"
    - lemma: "ಕೊಡು"
      key: kodu
      reading: "koḍu"
      ipa: "koɖu"
      gloss: "to give"
      forms:
        "past, ನಾನು": "ಕೊಟ್ಟೆ"
        "future, ನಾನು": ["ಕೊಡುತ್ತೇನೆ", "ಕೊಡ್ತೀನಿ"]
        "polite request, ನೀವು": "ಕೊಡಿ"
      readings:
        "past, ನಾನು": "koṭṭe"
        "future, ನಾನು": ["koḍuttēne", "koḍtīni"]
        "polite request, ನೀವು": "koḍi"
      ipas:
        "past, ನಾನು": "koʈʈe"
        "future, ನಾನು": "koɖut̪t̪eːne"
        "polite request, ನೀವು": "koɖi"
    - lemma: "ತೆಗೆದುಕೊಳ್ಳು"
      key: tegedukollu
      reading: "tegedukoḷḷu"
      ipa: "t̪eɡed̪ukoɭɭu"
      gloss: "to take"
      forms:
        "past, ನಾನು": ["ತೆಗೆದುಕೊಂಡೆ", "ತಗೊಂಡೆ"]
        "future, ನಾನು": ["ತೆಗೆದುಕೊಳ್ಳುತ್ತೇನೆ", "ತಗೊಳ್ತೀನಿ"]
        "polite request, ನೀವು": ["ತೆಗೆದುಕೊಳ್ಳಿ", "ತಗೊಳ್ಳಿ"]
      readings:
        "past, ನಾನು": ["tegedukoṇḍe", "tagoṇḍe"]
        "future, ನಾನು": ["tegedukoḷḷuttēne", "tagoḷtīni"]
        "polite request, ನೀವು": ["tegedukoḷḷi", "tagoḷḷi"]
      ipas:
        "past, ನಾನು": "t̪eɡed̪ukoɳɖe"
        "future, ನಾನು": "t̪eɡed̪ukoɭɭut̪t̪eːne"
        "polite request, ನೀವು": "t̪eɡed̪ukoɭɭi"
    - lemma: "ಇಡು"
      key: idu
      reading: "iḍu"
      ipa: "iɖu"
      gloss: "to put; to keep"
      forms:
        "past, ನಾನು": "ಇಟ್ಟೆ"
        "future, ನಾನು": ["ಇಡುತ್ತೇನೆ", "ಇಡ್ತೀನಿ"]
        "polite request, ನೀವು": "ಇಡಿ"
      readings:
        "past, ನಾನು": "iṭṭe"
        "future, ನಾನು": ["iḍuttēne", "iḍtīni"]
        "polite request, ನೀವು": "iḍi"
      ipas:
        "past, ನಾನು": "iʈʈe"
        "future, ನಾನು": "iɖut̪t̪eːne"
        "polite request, ನೀವು": "iɖi"
