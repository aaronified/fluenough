passages:
  - id: "kn-travel-passage"
    title: "A two-day trip"
    sentences:
      - text: "ಇವತ್ತು ನಾವು ಸ್ಮಾರಕ ನೋಡೋಣ."
        reading: "ivattu nāvu smāraka nōḍōṇa."
        ipa: "iʋat̪t̪u naːʋu smaːraka noːɖoːɳa"
      - text: "ನಾಳೆ ಬೀಚ್ ನೋಡೋಣ."
        reading: "nāḷe bīc nōḍōṇa."
        ipa: "naːɭe biːtʃ noːɖoːɳa"
      - text: "ವಸತಿಗೃಹದಲ್ಲಿ ಕೊಠಡಿ ಕಾಯ್ದಿರಿಸಿದ್ದೇವೆ."
        reading: "vasatigruhadalli koṭhaḍi kāydirisiddēve."
        ipa: "ʋasat̪iɡruhad̪alli koʈʰaɖi kaːjd̪irisid̪d̪eːʋe"
      - text: "ಪಾಸ್ಪೋರ್ಟ್ ಮರೆಯಬೇಡಿ."
        reading: "pāspōrṭ mareyabēḍi."
        ipa: "paːspoːrʈ marejabeːɖi"
      - text: "ಸೂಟ್ಕೇಸ್ ತೆಗೆದುಕೊಳ್ಳಿ."
        reading: "sūṭkēs tegedukoḷḷi."
        ipa: "suːʈkeːs t̪eɡed̪ukoɭɭi"
    questions:
      - id: "kn-9030"
        prompt: { en: "What do they see on the first day?" }
