schema: 1
id: kn-en-sound-differences
name: "Sounds to tell apart"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN, icon: "ಕ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Pairs of everyday words that differ in one sound: a short or long vowel, the tongue on the teeth or curled back, and the two l's. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: kn-0112
    target: "ಕರು"
    native: "calf"
    reading: "karu"
    ipa: "karu"
    tags: ["vowel-length"]
    notes: "Vowel length: ಕಾರು (kāru, car) holds the a twice as long as ಕರು (karu, calf)."
  - id: kn-0113
    target: "ಕಾರು"
    native: "car"
    reading: "kāru"
    ipa: "kaːru"
    tags: ["vowel-length"]
    notes: "Vowel length: ಕಾರು (kāru, car) holds the a twice as long as ಕರು (karu, calf). Words from English often gain a final u: car becomes ಕಾರು."
  - id: kn-0114
    target: "ಕೊಡು"
    native: "give (to a friend); to give"
    reading: "koḍu"
    ipa: "koɖu"
    tags: ["vowel-length"]
    notes: "Vowel length: ಕೊಡು (koḍu, give) has a short o; ಕೋಡು (kōḍu, horn) has a long one. To anyone you respect, say ಕೊಡಿ (koḍi)."
  - id: kn-0115
    target: "ಕೋಡು"
    native: "horn (of an animal)"
    reading: "kōḍu"
    ipa: "koːɖu"
    tags: ["vowel-length"]
    notes: "Vowel length: ಕೊಡು (koḍu, give) has a short o; ಕೋಡು (kōḍu, horn) has a long one."
  - id: kn-0116
    target: "ಕೋತಿ"
    native: "monkey"
    reading: "kōti"
    ipa: "koːt̪i"
    tags: ["dental-retroflex"]
    notes: "Dental against curled back: ಕೋತಿ (kōti, monkey) has the tongue on the teeth for t; ಕೋಟಿ (kōṭi, crore) has it curled back."
  - id: kn-0117
    target: "ಕೋಟಿ"
    native: "1,00,00,000, a crore (ten million)"
    reading: "kōṭi"
    ipa: "koːʈi"
    tags: ["dental-retroflex"]
    notes: "Dental against curled back: ಕೋತಿ (kōti, monkey) has the tongue on the teeth for t; ಕೋಟಿ (kōṭi, crore) has it curled back."
  - id: kn-0118
    target: "ಕತ್ತೆ"
    native: "donkey"
    reading: "katte"
    ipa: "kat̪t̪e"
    tags: ["dental-retroflex"]
    notes: "Dental against curled back: ಕತ್ತೆ (katte, donkey) has the double t on the teeth; ಕಟ್ಟೆ (kaṭṭe, a raised platform) has it curled back."
  - id: kn-0119
    target: "ಕಟ್ಟೆ"
    native: "a raised platform; an embankment"
    reading: "kaṭṭe"
    ipa: "kaʈʈe"
    tags: ["dental-retroflex"]
    notes: "Dental against curled back: ಕತ್ತೆ (katte, donkey) has the double t on the teeth; ಕಟ್ಟೆ (kaṭṭe) has it curled back. The ಕಟ್ಟೆ round a village tree is where people sit and talk."
  - id: kn-0120
    target: "ಹಾಲು"
    native: "milk"
    reading: "hālu"
    ipa: "haːlu"
    tags: ["lateral"]
    notes: "The two l's: ಹಾಲು (hālu, milk) has the l on the teeth; ಹಾಳು (hāḷu, ruined) has it curled back."
  - id: kn-0121
    target: "ಹಾಳು"
    native: "ruined; spoiled"
    reading: "hāḷu"
    ipa: "haːɭu"
    tags: ["lateral"]
    notes: "The two l's: ಹಾಲು (hālu, milk) has the l on the teeth; ಹಾಳು (hāḷu, ruined) has it curled back."
  - id: kn-0122
    target: "ಮಳೆ"
    native: "rain"
    reading: "maḷe"
    ipa: "maɭe"
    tags: ["lateral"]
    notes: "The two l's: ಮಳೆ (maḷe, rain) has the l curled back; ಮಲೆ (male, hills) has it on the teeth."
  - id: kn-0123
    target: "ಮಲೆ"
    native: "hills; a range of hills"
    reading: "male"
    ipa: "male"
    tags: ["lateral"]
    notes: "The two l's: ಮಲೆ (male, hills) has the l on the teeth, as in ಮಲೆನಾಡು (malenāḍu), the hill country of the Western Ghats; ಮಳೆ (maḷe, rain) has it curled back."
