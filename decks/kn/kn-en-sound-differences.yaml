schema: 1
id: kn-en-sound-differences
name: "Sounds to tell apart"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Pairs of everyday words that differ in one sound: a short or long vowel, the tongue on the teeth or curled back, and the two l's. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: kn-0112
    target: "ಕರು"
    native: "calf"
    reading: "karu"
    tags: ["vowel-length"]
    notes: "Vowel length: ಕಾರು (karu, car) holds the a twice as long as ಕರು (karu, calf)."
  - id: kn-0113
    target: "ಕಾರು"
    native: "car"
    reading: "karu"
    tags: ["vowel-length"]
    notes: "Vowel length: ಕಾರು (karu, car) holds the a twice as long as ಕರು (karu, calf). Words from English often gain a final u: car becomes ಕಾರು."
  - id: kn-0114
    target: "ಕೊಡು"
    native: "give (to a friend); to give"
    reading: "kodu"
    tags: ["vowel-length"]
    notes: "Vowel length: ಕೊಡು (kodu, give) has a short o; ಕೋಡು (kodu, horn) has a long one. To anyone you respect, say ಕೊಡಿ (kodi)."
  - id: kn-0115
    target: "ಕೋಡು"
    native: "horn (of an animal)"
    reading: "kodu"
    tags: ["vowel-length"]
    notes: "Vowel length: ಕೊಡು (kodu, give) has a short o; ಕೋಡು (kodu, horn) has a long one."
  - id: kn-0116
    target: "ಕೋತಿ"
    native: "monkey"
    reading: "koti"
    tags: ["dental-retroflex"]
    notes: "Dental against curled back: ಕೋತಿ (koti, monkey) has the tongue on the teeth for t; ಕೋಟಿ (koti, crore) has it curled back."
  - id: kn-0117
    target: "ಕೋಟಿ"
    native: "1,00,00,000, a crore (ten million)"
    reading: "koti"
    tags: ["dental-retroflex"]
    notes: "Dental against curled back: ಕೋತಿ (koti, monkey) has the tongue on the teeth for t; ಕೋಟಿ (koti, crore) has it curled back."
  - id: kn-0118
    target: "ಕತ್ತೆ"
    native: "donkey"
    reading: "katte"
    tags: ["dental-retroflex"]
    notes: "Dental against curled back: ಕತ್ತೆ (katte, donkey) has the double t on the teeth; ಕಟ್ಟೆ (katte, a raised platform) has it curled back."
  - id: kn-0119
    target: "ಕಟ್ಟೆ"
    native: "a raised platform; an embankment"
    reading: "katte"
    tags: ["dental-retroflex"]
    notes: "Dental against curled back: ಕತ್ತೆ (katte, donkey) has the double t on the teeth; ಕಟ್ಟೆ (katte) has it curled back. The ಕಟ್ಟೆ round a village tree is where people sit and talk."
  - id: kn-0120
    target: "ಹಾಲು"
    native: "milk"
    reading: "halu"
    tags: ["lateral"]
    notes: "The two l's: ಹಾಲು (halu, milk) has the l on the teeth; ಹಾಳು (halu, ruined) has it curled back."
  - id: kn-0121
    target: "ಹಾಳು"
    native: "ruined; spoiled"
    reading: "halu"
    tags: ["lateral"]
    notes: "The two l's: ಹಾಲು (halu, milk) has the l on the teeth; ಹಾಳು (halu, ruined) has it curled back."
  - id: kn-0122
    target: "ಮಳೆ"
    native: "rain"
    reading: "male"
    tags: ["lateral"]
    notes: "The two l's: ಮಳೆ (male, rain) has the l curled back; ಮಲೆ (male, hills) has it on the teeth."
  - id: kn-0123
    target: "ಮಲೆ"
    native: "hills; a range of hills"
    reading: "male"
    tags: ["lateral"]
    notes: "The two l's: ಮಲೆ (male, hills) has the l on the teeth, as in ಮಲೆನಾಡು (malenadu), the hill country of the Western Ghats; ಮಳೆ (male, rain) has it curled back."
