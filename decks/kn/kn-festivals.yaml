cards:
  - id: "kn-0995"
    target: "ಹಬ್ಬ"
    reading: "habba"
    ipa: "habba"
    pos: "noun"
    gender: "n"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ಇಂದು ಹಬ್ಬ ಇದೆ.", reading: "indu habba ide.", ipa: "ind̪u habba id̪e", bases: [{ word: "ಇದೆ", base: "ಇರು", reading: "iru" }] }
      - { target: "ಹಬ್ಬದಲ್ಲಿ ಮನೆಗೆ ಅತಿಥಿ ಬರುತ್ತಾರೆ.", reading: "habbadalli manege atithi baruttāre.", ipa: "habbad̪alli maneɡe at̪it̪ʰi barut̪t̪aːre", bases: [{ word: "ಹಬ್ಬದಲ್ಲಿ", base: "ಹಬ್ಬ", reading: "habba" }, { word: "ಮನೆಗೆ", ref: "kn-0201" }, { word: "ಬರುತ್ತಾರೆ", base: "ಬರು", reading: "baru" }] }
  - id: "kn-0996"
    target: "ದೀಪಾವಳಿ"
    reading: "dīpāvaḷi"
    ipa: "d̪iːpaːʋaɭi"
    pos: "noun"
    gender: "n"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ದೀಪಾವಳಿಯಲ್ಲಿ ದೀಪ ಹಚ್ಚುತ್ತಾರೆ.", reading: "dīpāvaḷiyalli dīpa haccuttāre.", ipa: "d̪iːpaːʋaɭijalli d̪iːpa hatʃtʃut̪t̪aːre", bases: [{ word: "ದೀಪಾವಳಿಯಲ್ಲಿ", base: "ದೀಪಾವಳಿ", reading: "dīpāvaḷi" }, { word: "ಹಚ್ಚುತ್ತಾರೆ", base: "ಹಚ್ಚು", reading: "haccu" }] }
      - { target: "ದೀಪಾವಳಿಗೆ ಪಟಾಕಿ ಸಿಡಿಸುತ್ತಾರೆ.", reading: "dīpāvaḷige paṭāki siḍisuttāre.", ipa: "d̪iːpaːʋaɭiɡe paʈaːki siɖisut̪t̪aːre", bases: [{ word: "ದೀಪಾವಳಿಗೆ", base: "ದೀಪಾವಳಿ", reading: "dīpāvaḷi" }, { word: "ಸಿಡಿಸುತ್ತಾರೆ", base: "ಸಿಡಿಸು", reading: "siḍisu" }] }
  - ref: "kn-0466"
  - id: "kn-0997"
    target: "ದಸರಾ"
    reading: "dasarā"
    ipa: "d̪asaraː"
    pos: "noun"
    gender: "n"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ದಸರಾದಲ್ಲಿ ಮೆರವಣಿಗೆ ಇದೆ.", reading: "dasarādalli meravaṇige ide.", ipa: "d̪asaraːd̪alli meraʋaɳiɡe id̪e", bases: [{ word: "ದಸರಾದಲ್ಲಿ", base: "ದಸರಾ", reading: "dasarā" }, { word: "ಇದೆ", base: "ಇರು", reading: "iru" }] }
      - { target: "ದಸರಾ ಹಬ್ಬದಲ್ಲಿ ನೃತ್ಯ ಮತ್ತು ಡೋಲು ಇರುತ್ತದೆ.", reading: "dasarā habbadalli nrutya mattu ḍōlu iruttade.", ipa: "d̪asaraː habbad̪alli nrut̪ja mat̪t̪u ɖoːlu irut̪t̪ad̪e", bases: [{ word: "ಹಬ್ಬದಲ್ಲಿ", base: "ಹಬ್ಬ", reading: "habba" }, { word: "ಇರುತ್ತದೆ", base: "ಇರು", reading: "iru" }] }
  - id: "kn-0998"
    target: "ಸಂಕ್ರಾಂತಿ"
    reading: "saṅkrānti"
    ipa: "saŋkraːnt̪i"
    pos: "noun"
    gender: "n"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ಸಂಕ್ರಾಂತಿಗೆ ಹಬ್ಬ ಆಚರಿಸುತ್ತಾರೆ.", reading: "saṅkrāntige habba ācarisuttāre.", ipa: "saŋkraːnt̪iɡe habba aːtʃarisut̪t̪aːre", bases: [{ word: "ಸಂಕ್ರಾಂತಿಗೆ", base: "ಸಂಕ್ರಾಂತಿ", reading: "saṅkrānti" }, { word: "ಆಚರಿಸುತ್ತಾರೆ", base: "ಆಚರಿಸು", reading: "ācarisu" }] }
      - { target: "ಸಂಕ್ರಾಂತಿಯಲ್ಲಿ ಸಿಹಿ ತಿನ್ನುತ್ತಾರೆ.", reading: "saṅkrāntiyalli sihi tinnuttāre.", ipa: "saŋkraːnt̪ijalli sihi t̪innut̪t̪aːre", bases: [{ word: "ಸಂಕ್ರಾಂತಿಯಲ್ಲಿ", base: "ಸಂಕ್ರಾಂತಿ", reading: "saṅkrānti" }, { word: "ತಿನ್ನುತ್ತಾರೆ", ref: "kn-0635" }] }
  - id: "kn-0999"
    target: "ರಂಗೋಲಿ"
    reading: "raṅgōli"
    ipa: "raŋɡoːli"
    pos: "noun"
    gender: "n"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ಮನೆ ಹೊರಗೆ ರಂಗೋಲಿ ಹಾಕುತ್ತಾರೆ.", reading: "mane horage raṅgōli hākuttāre.", ipa: "mane horaɡe raŋɡoːli haːkut̪t̪aːre", bases: [{ word: "ಹಾಕುತ್ತಾರೆ", base: "ಹಾಕು", reading: "hāku" }] }
      - { target: "ಬೆಳಿಗ್ಗೆ ರಂಗೋಲಿ ಬಿಡಿಸುತ್ತಾರೆ.", reading: "beḷigge raṅgōli biḍisuttāre.", ipa: "beɭiɡɡe raŋɡoːli biɖisut̪t̪aːre", bases: [{ word: "ಬಿಡಿಸುತ್ತಾರೆ", base: "ಬಿಡಿಸು", reading: "biḍisu" }] }
  - id: "kn-1000"
    target: "ಪಟಾಕಿ"
    reading: "paṭāki"
    ipa: "paʈaːki"
    pos: "noun"
    gender: "n"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ರಾತ್ರಿ ಪಟಾಕಿ ಸಿಡಿಯುತ್ತದೆ.", reading: "rātri paṭāki siḍiyuttade.", ipa: "raːt̪ri paʈaːki siɖijut̪t̪ad̪e", bases: [{ word: "ಸಿಡಿಯುತ್ತದೆ", base: "ಸಿಡಿ", reading: "siḍi" }] }
      - { target: "ಪಟಾಕಿ ಸಿಡಿಸಬೇಡ, ಮಕ್ಕಳು ಇದ್ದಾರೆ.", reading: "paṭāki siḍisabēḍa, makkaḷu iddāre.", ipa: "paʈaːki siɖisabeːɖa makkaɭu id̪d̪aːre", bases: [{ word: "ಸಿಡಿಸಬೇಡ", base: "ಸಿಡಿಸು", reading: "siḍisu" }, { word: "ಇದ್ದಾರೆ", base: "ಇರು", reading: "iru" }] }
  - id: "kn-1001"
    target: "ಪೂಜೆ"
    reading: "pūje"
    ipa: "puːdʒe"
    pos: "noun"
    gender: "n"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ಬೆಳಿಗ್ಗೆ ಪೂಜೆ ಮಾಡುತ್ತಾರೆ.", reading: "beḷigge pūje māḍuttāre.", ipa: "beɭiɡɡe puːdʒe maːɖut̪t̪aːre", bases: [{ word: "ಮಾಡುತ್ತಾರೆ", ref: "kn-0630" }] }
      - { target: "ದೇವಸ್ಥಾನದಲ್ಲಿ ಪೂಜೆ ಇದೆ.", reading: "dēvasthānadalli pūje ide.", ipa: "d̪eːʋast̪ʰaːnad̪alli puːdʒe id̪e", bases: [{ word: "ದೇವಸ್ಥಾನದಲ್ಲಿ", ref: "kn-0830" }, { word: "ಇದೆ", base: "ಇರು", reading: "iru" }] }
