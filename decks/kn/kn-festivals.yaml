    examples:
      - { target: "ದೇವರಿಗೆ ನೈವೇದ್ಯ ಇಡುತ್ತಾರೆ.", reading: "dēvarige naivēdya iḍuttāre.", ipa: "d̪eːʋariɡe naiʋeːd̪ja iɖut̪t̪aːre", bases: [{ word: "ದೇವರಿಗೆ", base: "ದೇವರು", reading: "dēvaru" }, { word: "ಇಡುತ್ತಾರೆ", base: "ಇಡು", reading: "iḍu" }] }
      - { target: "ನೈವೇದ್ಯ ಮುಗಿದ ಮೇಲೆ ಊಟ ಮಾಡುತ್ತಾರೆ.", reading: "naivēdya mugida mēle ūṭa māḍuttāre.", ipa: "naiʋeːd̪ja muɡid̪a meːle uːʈa maːɖut̪t̪aːre", bases: [{ word: "ಮುಗಿದ", base: "ಮುಗಿ", reading: "mugi" }, { word: "ಮಾಡುತ್ತಾರೆ", ref: "kn-0630" }] }
  - id: "kn-1004"
