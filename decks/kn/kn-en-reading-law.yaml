passages:
  - id: "kn-rights-leaflet"
    title: "Rights leaflet"
    sentences:
      - text: "ಬಾಡಿಗೆದಾರರಿಗೂ ಕಾನೂನು ಸಹಾಯ ಇದೆ."
        reading: "bāḍigedārarigū kānūnu sahāya ide."
        ipa: "baːɖiɡed̪aːrariɡuː kaːnuːnu sahaːja id̪e"
      - text: "ದೂರು ಇದ್ದರೆ ನ್ಯಾಯಾಲಯಕ್ಕೆ ಹೋಗಿ."
        reading: "dūru iddare nyāyālayakke hōgi."
        ipa: "d̪uːru id̪d̪are njaːjaːlajakke hoːɡi"
      - text: "ವಕೀಲರು ನಿಮಗೆ ಸಹಾಯ ಮಾಡುತ್ತಾರೆ."
        reading: "vakīlaru nimage sahāya māḍuttāre."
        ipa: "ʋakiːlaru nimaɡe sahaːja maːɖut̪t̪aːre"
      - text: "ನ್ಯಾಯಾಧೀಶರು ತೀರ್ಪು ಕೊಡುತ್ತಾರೆ."
        reading: "nyāyādhīśaru tīrpu koḍuttāre."
        ipa: "njaːjaːd̪ʱiːʃaru t̪iːrpu koɖut̪t̪aːre"
      - text: "ಕಾನೂನು ಎಲ್ಲರಿಗೂ ಒಂದೇ."
        reading: "kānūnu ellarigū ondē."
        ipa: "kaːnuːnu ellariɡuː ond̪eː"
    questions:
