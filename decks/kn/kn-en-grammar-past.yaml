        "ನಾವು": ["ಬಂದೆವು", "ಬಂದ್ವಿ"]
        "ನೀನು": "ಬಂದೆ"
        "ನೀವು": ["ಬಂದಿರಿ", "ಬಂದ್ರಿ"]
        "ಅವನು": ["ಬಂದನು", "ಬಂದ"]
        "ಅವಳು": ["ಬಂದಳು", "ಬಂದ್ಲು"]
