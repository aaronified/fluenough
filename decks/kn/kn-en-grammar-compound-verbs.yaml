schema: 1
id: kn-en-grammar-compound-verbs
name: "Verbs that add a shade"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "A second verb after the first adds a shade: done for good, done for oneself, done for someone. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: kn-0481
    target: "ಹೋಗಿಬಿಟ್ಟ."
    native: "He's gone (for good)."
    reading: "hōgibiṭṭa."
    ipa: "hoːɡibiʈʈa"
    alt_target: ["ಹೋಗಿಬಿಟ್ಟನು."]
    pos: "phrase"
    notes: "ಬಿಡು (biḍu), to leave, after a verb says it is done and finished."
  - id: kn-0482
    target: "ಮರೆತುಬಿಟ್ಟೆ."
    native: "I forgot."
    reading: "maretubiṭṭe."
    ipa: "maret̪ubiʈʈe"
    pos: "phrase"
  - id: kn-0483
    target: "ಬಿದ್ದುಹೋದ."
    native: "He fell down."
    reading: "bidduhōda."
    ipa: "bid̪d̪uhoːd̪a"
    alt_target: ["ಬಿದ್ದುಬಿಟ್ಟ."]
    pos: "phrase"
    notes: "ಹೋಗು, to go, after a verb: it just happened."
  - id: kn-0484
    target: "ತಿಂದುಬಿಟ್ಟೆ."
    native: "I've eaten it all up."
    reading: "tindubiṭṭe."
    ipa: "t̪ind̪ubiʈʈe"
    pos: "phrase"
  - id: kn-0485
    target: "ಹೇಳಿಬಿಟ್ಟೆ."
    native: "I've gone and told them."
    reading: "hēḷibiṭṭe."
    ipa: "heːɭibiʈʈe"
    pos: "phrase"
  - id: kn-0486
    target: "ಕೊಂಡುಕೊಂಡೆ."
    native: "I bought it for myself."
    reading: "koṇḍukoṇḍe."
    ipa: "koɳɖukoɳɖe"
    pos: "phrase"
    notes: "ಕೊಳ್ಳು (koḷḷu), to take, after a verb: done for oneself."
  - id: kn-0487
    target: "ಮಾಡಿಕೊಂಡೆ."
    native: "I did it for myself."
    reading: "māḍikoṇḍe."
    ipa: "maːɖikoɳɖe"
    pos: "phrase"
  - id: kn-0488
    target: "ನೋಡಿಕೊಳ್ಳಿ."
    native: "Please take care of it; have a look."
    reading: "nōḍikoḷḷi."
    ipa: "noːɖikoɭɭi"
    pos: "phrase"
  - id: kn-0489
    target: "ತಂದುಕೊಡಿ."
    native: "Please fetch it (for me)."
    reading: "tandukoḍi."
    ipa: "t̪and̪ukoɖi"
    pos: "phrase"
    notes: "ಕೊಡು, to give, after a verb: done for someone else. ತರು (taru) is to bring."
  - id: kn-0490
    target: "ಬರೆದುಕೊಡಿ."
    native: "Please write it down for me."
    reading: "baredukoḍi."
    ipa: "bared̪ukoɖi"
    pos: "phrase"
