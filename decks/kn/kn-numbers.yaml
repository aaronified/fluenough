# How Kannada spells a generated number (ADR-0011). Kannada does build 21 to
# 99 from a tens word and a units word, but it fuses them into one word with
# a sandhi change: ಇಪ್ಪತ್ತು + ಒಂದು is ಇಪ್ಪತ್ತೊಂದು, 21. The format joins the
# two parts with a fixed string and cannot express that change, so
# tens_and_units is false, and only the numbers whose last two digits the
# decks teach a word for are generated: 1 to 20, the tens, 25 and 26.
