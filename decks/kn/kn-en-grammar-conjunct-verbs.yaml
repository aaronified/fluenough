id: kn-en-grammar-conjunct-verbs
name: "Noun + ಮಾಡು and ಪಡು"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Many Kannada verbs are a noun with ಮಾಡು, do, or ಪಡು, feel: ಕೆಲಸ ಮಾಡು, to work; ಭಯಪಡು, to be afraid. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: kn-0467
    target: "ಕೆಲಸ ಮಾಡು"
    native: "to work"
    reading: "kelasa māḍu"
    ipa: "kelasa maːɖu"
    pos: "phrase"
    notes: "ಕೆಲಸ, work, and ಮಾಡು, to do. So too ಸ್ನಾನ ಮಾಡು, to bathe, and ಅಡುಗೆ ಮಾಡು, to cook."
  - id: kn-0468
    target: "ಫೋನ್ ಮಾಡು"
    native: "to phone"
    reading: "fōn māḍu"
    ipa: "foːn maːɖu"
    pos: "phrase"
    notes: "ನನಗೆ ಫೋನ್ ಮಾಡಿ, please call me."
  - id: kn-0469
    target: "ಸಹಾಯ ಮಾಡು"
    native: "to help"
    reading: "sahāya māḍu"
    ipa: "sahaːja maːɖu"
    pos: "phrase"
  - id: kn-0470
    target: "ಮದುವೆ ಆಗು"
    native: "to get married"
    reading: "maduve āgu"
    ipa: "mad̪uʋe aːɡu"
    pos: "phrase"
    notes: "With ಆಗು, to become, to happen: ನನಗೆ ಮದುವೆ ಆಗಿದೆ, I'm married."
  - id: kn-0471
    target: "ಪ್ರಯತ್ನ ಮಾಡು"
    native: "to try"
    reading: "prayatna māḍu"
    ipa: "prajat̪na maːɖu"
    alt_target: ["ಪ್ರಯತ್ನಿಸು"]
    pos: "phrase"
    notes: "Also one word, ಪ್ರಯತ್ನಿಸು (prayatnisu)."
  - id: kn-0472
    target: "ಖರ್ಚು ಮಾಡು"
    native: "to spend (money)"
    reading: "kharcu māḍu"
    ipa: "kʰartʃu maːɖu"
    pos: "phrase"
  - id: kn-0473
    target: "ಸ್ವಚ್ಛ ಮಾಡು"
    native: "to clean"
    reading: "svaccha māḍu"
    ipa: "sʋatʃtʃʰa maːɖu"
    alt_target: ["ಕ್ಲೀನ್ ಮಾಡು"]
    pos: "phrase"
  - id: kn-0474
    target: "ಪ್ರಯಾಣ ಮಾಡು"
    native: "to travel"
    reading: "prayāṇa māḍu"
    ipa: "prajaːɳa maːɖu"
    pos: "phrase"
  - id: kn-0475
    target: "ಶುರು ಮಾಡು"
    native: "to begin"
    reading: "śuru māḍu"
    ipa: "ʃuru maːɖu"
    alt_target: ["ಪ್ರಾರಂಭಿಸು"]
    pos: "phrase"
    notes: "Formally ಪ್ರಾರಂಭಿಸು (prārambhisu)."
  - id: kn-0476
    target: "ತಡ ಮಾಡು"
    native: "to delay"
    reading: "taḍa māḍu"
    ipa: "t̪aɖa maːɖu"
    pos: "phrase"
    notes: "To be late is ತಡ ಆಗು: ತಡ ಆಯಿತು, I'm late."
  - id: kn-0477
    target: "ಭಯಪಡು"
