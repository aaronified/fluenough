schema: 1
id: kn-en-numbers-big
name: "Tens and big numbers"
kind: vocab
theme: numbers-big
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The tens, the hundreds, a thousand, lakh and crore, and the halves every market uses. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: kn-0264
    target: "ಮೂವತ್ತು"
    native: "30, thirty"
    reading: "muvattu"
    pos: "other"
    notes: "Kannada builds 21 to 99 from the tens and the units, joined into one word: 26 is ಇಪ್ಪತ್ತಾರು (ippattaru), ಇಪ್ಪತ್ತು + ಆರು."
  - id: kn-0265
    target: "ನಲವತ್ತು"
    native: "40, forty"
    reading: "nalavattu"
    pos: "other"
  - id: kn-0266
    target: "ಐವತ್ತು"
    native: "50, fifty"
    reading: "aivattu"
    pos: "other"
  - id: kn-0267
    target: "ಅರವತ್ತು"
    native: "60, sixty"
    reading: "aravattu"
    pos: "other"
  - id: kn-0268
    target: "ಎಪ್ಪತ್ತು"
    native: "70, seventy"
    reading: "eppattu"
    pos: "other"
  - id: kn-0269
    target: "ಎಂಬತ್ತು"
    native: "80, eighty"
    reading: "embattu"
    pos: "other"
  - id: kn-0270
    target: "ತೊಂಬತ್ತು"
    native: "90, ninety"
    reading: "tombattu"
    pos: "other"
  - id: kn-0271
    target: "ಇಪ್ಪತ್ತೈದು"
    native: "25, twenty-five"
    reading: "ippattaidu"
    pos: "other"
    notes: "The tens lose their last u and run into the units: ಇಪ್ಪತ್ತು + ಐದು. So ಮೂವತ್ತೊಂದು (muvattondu), 31; ಐವತ್ತೆರಡು (aivatteradu), 52."
  - id: kn-0272
    target: "ನೂರು"
    native: "100, a hundred"
    reading: "nuru"
    pos: "other"
    notes: "With more after it, ನೂರ: ನೂರ ಐವತ್ತು, 150."
  - id: kn-0273
    target: "ನೂರ ಐವತ್ತು"
    native: "150, a hundred and fifty"
    reading: "nura aivattu"
    pos: "other"
    notes: "With more after it, a hundred is ನೂರ."
  - id: kn-0274
    target: "ಇನ್ನೂರು"
    native: "200, two hundred"
    reading: "innuru"
    pos: "other"
    notes: "The hundreds are single words, built on ನೂರು: ಇನ್ನೂರು, ಮುನ್ನೂರು, ನಾನೂರು."
  - id: kn-0275
    target: "ಇನ್ನೂರ ಐವತ್ತು"
    native: "250, two hundred and fifty"
    reading: "innura aivattu"
    pos: "other"
    notes: "With more after it, ಇನ್ನೂರು becomes ಇನ್ನೂರ."
  - id: kn-0276
    target: "ಮುನ್ನೂರು"
    native: "300, three hundred"
    reading: "munnuru"
    pos: "other"
  - id: kn-0277
    target: "ಮುನ್ನೂರ ಐವತ್ತು"
    native: "350, three hundred and fifty"
    reading: "munnura aivattu"
    pos: "other"
  - id: kn-0278
    target: "ನಾನೂರು"
    native: "400, four hundred"
    reading: "nanuru"
    pos: "other"
  - id: kn-0279
    target: "ನಾನೂರ ಐವತ್ತು"
    native: "450, four hundred and fifty"
    reading: "nanura aivattu"
    pos: "other"
  - id: kn-0280
    target: "ಐನೂರು"
    native: "500, five hundred"
    reading: "ainuru"
    pos: "other"
  - id: kn-0281
    target: "ಐನೂರ ಐವತ್ತು"
    native: "550, five hundred and fifty"
    reading: "ainura aivattu"
    pos: "other"
  - id: kn-0282
    target: "ಆರುನೂರು"
    native: "600, six hundred"
    reading: "arunuru"
    pos: "other"
  - id: kn-0283
    target: "ಆರುನೂರ ಐವತ್ತು"
    native: "650, six hundred and fifty"
    reading: "arunura aivattu"
    pos: "other"
  - id: kn-0284
    target: "ಏಳುನೂರು"
    native: "700, seven hundred"
    reading: "elunuru"
    pos: "other"
  - id: kn-0285
    target: "ಏಳುನೂರ ಐವತ್ತು"
    native: "750, seven hundred and fifty"
    reading: "elunura aivattu"
    pos: "other"
  - id: kn-0286
    target: "ಎಂಟುನೂರು"
    native: "800, eight hundred"
    reading: "entunuru"
    pos: "other"
  - id: kn-0287
    target: "ಎಂಟುನೂರ ಐವತ್ತು"
    native: "850, eight hundred and fifty"
    reading: "entunura aivattu"
    pos: "other"
  - id: kn-0288
    target: "ಒಂಬೈನೂರು"
    native: "900, nine hundred"
    reading: "ombainuru"
    pos: "other"
    notes: "Also ಒಂಬತ್ತು ನೂರು (ombattu nuru)."
  - id: kn-0289
    target: "ಒಂಬೈನೂರ ಐವತ್ತು"
    native: "950, nine hundred and fifty"
    reading: "ombainura aivattu"
    pos: "other"
  - id: kn-0290
    target: "ಸಾವಿರ"
    native: "1,000, a thousand"
    reading: "savira"
    pos: "other"
    notes: "Two thousand is ಎರಡು ಸಾವಿರ (eradu savira); with more after it, ಸಾವಿರದ: ಎರಡು ಸಾವಿರದ ಐನೂರು, 2,500."
  - id: kn-0291
    target: "ಎರಡು ಸಾವಿರ"
    native: "2,000, two thousand"
    reading: "eradu savira"
    pos: "other"
  - id: kn-0292
    target: "ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತಾರು"
    native: "2026, two thousand and twenty-six"
    reading: "eradu savirada ippattaru"
    pos: "other"
    notes: "With more after it, ಸಾವಿರ becomes ಸಾವಿರದ. Years are read this way."
  - id: kn-0293
    target: "ಲಕ್ಷ"
    native: "1,00,000, a lakh (a hundred thousand)"
    reading: "laksha"
    pos: "other"
    notes: "Indian numbering counts in lakhs and crores, and places its commas to match: 1,00,000."
  - ref: kn-0117
    notes: "A hundred lakh. Compare ಕೋತಿ (koti), monkey, with the t on the teeth."
  - id: kn-0294
    target: "ಅರ್ಧ"
    native: "half"
    reading: "ardha"
    pos: "other"
    notes: "ಅರ್ಧ ಕೆಜಿ (ardha keji), half a kilo."
  - id: kn-0295
    target: "ಒಂದೂವರೆ"
    native: "1½, one and a half"
    reading: "onduvare"
    pos: "other"
    notes: "-ಊವರೆ adds a half: ಎರಡೂವರೆ (eraduvare), 2½; ನಾಲ್ಕೂವರೆ, 4½."
  - id: kn-0296
    target: "ಎರಡೂವರೆ"
    native: "2½, two and a half"
    reading: "eraduvare"
    pos: "other"
