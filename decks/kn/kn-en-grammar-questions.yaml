schema: 1
id: kn-en-grammar-questions
name: "Basic questions"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Yes/no questions with -ಆ, and question words. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: kn-0176
    target: "ನೀವು ಕನ್ನಡ ಮಾತಾಡುತ್ತೀರಾ?"
    native: "Do you speak Kannada?"
    reading: "nivu kannada mataduttira?"
    alt_target: ["ನೀವು ಕನ್ನಡ ಮಾತಾಡ್ತೀರಾ?", "ನೀವು ಕನ್ನಡ ಮಾತನಾಡುತ್ತೀರಾ?"]
    pos: "phrase"
    notes: "The -ಆ at the end makes the question."
  - id: kn-0177
    target: "ಕಾಫಿ ಕುಡಿಯುತ್ತೀರಾ?"
    native: "Will you have coffee?"
    reading: "kafi kudiyuttira?"
    alt_target: ["ಕಾಫಿ ಕುಡೀತೀರಾ?"]
    pos: "phrase"
    notes: "No need for ನೀವು: the ending says it."
  - id: kn-0178
    target: "ಇದು ಏನು?"
    native: "What is this?"
    reading: "idu enu?"
    pos: "phrase"
    notes: "The question word stands where the answer would: ಇದು ಪುಸ್ತಕ, this is a book."
  - id: kn-0179
    target: "ನೀವು ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತಿದ್ದೀರಿ?"
    native: "Where are you going?"
    reading: "nivu ellige hoguttiddiri?"
    alt_target: ["ಎಲ್ಲಿಗೆ ಹೋಗ್ತಿದ್ದೀರಾ?"]
    pos: "phrase"
    notes: "ಎಲ್ಲಿಗೆ, where to: ಎಲ್ಲಿ + -ಗೆ."
  - id: kn-0180
    target: "ಅವರು ಯಾರು?"
    native: "Who is he? Who is she? (respectful)"
    reading: "avaru yaru?"
    pos: "phrase"
  - id: kn-0181
    target: "ನೀವು ಯಾವಾಗ ಬರುತ್ತೀರಿ?"
    native: "When will you come?"
    reading: "nivu yavaga baruttiri?"
    alt_target: ["ನೀವು ಯಾವಾಗ ಬರ್ತೀರಾ?"]
    pos: "phrase"
  - id: kn-0182
    target: "ನೀವು ಕನ್ನಡ ಯಾಕೆ ಕಲಿಯುತ್ತಿದ್ದೀರಿ?"
    native: "Why are you learning Kannada?"
    reading: "nivu kannada yake kaliyuttiddiri?"
    pos: "phrase"
    notes: "The question word goes just before the verb."
  - id: kn-0183
    target: "ನಿಮಗೆ ಎಷ್ಟು ಮಕ್ಕಳು?"
    native: "How many children do you have?"
    reading: "nimage eshtu makkalu?"
    pos: "phrase"
    notes: "'To you how many children?'"
  - id: kn-0184
    target: "ಹೇಗಿದೆ?"
    native: "How is it?"
    reading: "hegide?"
    pos: "phrase"
    notes: "ಹೇಗೆ (how) + ಇದೆ (is)."
  - id: kn-0185
    target: "ಚೆನ್ನಾಗಿದೆ ಅಲ್ವಾ?"
    native: "It's good, isn't it?"
    reading: "chennagide alva?"
    alt_target: ["ಚೆನ್ನಾಗಿದೆ ಅಲ್ಲವಾ?"]
    pos: "phrase"
    notes: "ಅಲ್ವಾ, 'isn't it?', asks for agreement. Written ಅಲ್ಲವೇ (allave)."
