# How Kannada script works: the recurring features a learner from English
# misses, shown before the first letters and from a script deck's Tips.
# See ADR-0016 and docs/DECK-FORMAT.md.
schema: 1
kind: "script"
part: "core"
id: "kn-script"
language: "kn"
