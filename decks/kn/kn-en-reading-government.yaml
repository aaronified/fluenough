    title: "Form instructions"
    sentences:
      - text: "ಅರ್ಜಿ ಫಾರ್ಮ್ ತುಂಬಿ."
        reading: "arji phārm tumbi."
        ipa: "ardʒi pʰaːrm t̪umbi"
      - text: "ಖಾತೆ ಸಂಖ್ಯೆ ಬರೆಯಿರಿ."
        reading: "khāte saṅkhye bareyiri."
        ipa: "kʰaːt̪e saŋkʰje barejiri"
      - text: "ಕೊನೆಯಲ್ಲಿ ಸಹಿ ಮಾಡಿ."
        reading: "koneyalli sahi māḍi."
        ipa: "konejalli sahi maːɖi"
      - text: "ಶುಲ್ಕ ಈ ಕಚೇರಿಯಲ್ಲಿ ಕಟ್ಟಿ."
        reading: "śulka ī kacēriyalli kaṭṭi."
        ipa: "ʃulka iː katʃeːrijalli kaʈʈi"
    questions:
      - id: "kn-9706"
        prompt: { en: "What should you write on the form?" }
