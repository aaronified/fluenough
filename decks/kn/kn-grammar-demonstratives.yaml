schema: 1
id: "kn-grammar-demonstratives"
part: "core"
kind: "grammar"
language: { code: "kn", iso639_3: "kan", name: "Kannada", script: "kannada", tts: "kn-IN", icon: "ಕ" }
license: "CC0-1.0"
tags: ["beginner", "unreviewed", "grammar"]
pattern:
  slots: ["near: ಈ (ī), ಇ- (i-)", "far: ಆ (ā), ಅ- (a-)"]
  entries:
    - lemma: "this, that (before a noun)"
      key: "before-noun"
      forms:
        "near: ಈ (ī), ಇ- (i-)": "ಈ"
        "far: ಆ (ā), ಅ- (a-)": "ಆ"
      readings:
        "near: ಈ (ī), ಇ- (i-)": "ī"
        "far: ಆ (ā), ಅ- (a-)": "ā"
      ipas:
        "near: ಈ (ī), ಇ- (i-)": "iː"
        "far: ಆ (ā), ಅ- (a-)": "aː"
    - lemma: "this one, that one (a thing)"
      key: "thing"
      forms:
        "near: ಈ (ī), ಇ- (i-)": "ಇದು"
        "far: ಆ (ā), ಅ- (a-)": "ಅದು"
      readings:
        "near: ಈ (ī), ಇ- (i-)": "idu"
        "far: ಆ (ā), ಅ- (a-)": "adu"
      ipas:
        "near: ಈ (ī), ಇ- (i-)": "id̪u"
        "far: ಆ (ā), ಅ- (a-)": "ad̪u"
    - lemma: "these, those (things)"
      key: "things"
      forms:
        "near: ಈ (ī), ಇ- (i-)": "ಇವು"
        "far: ಆ (ā), ಅ- (a-)": "ಅವು"
      readings:
        "near: ಈ (ī), ಇ- (i-)": "ivu"
        "far: ಆ (ā), ಅ- (a-)": "avu"
      ipas:
        "near: ಈ (ī), ಇ- (i-)": "iʋu"
        "far: ಆ (ā), ಅ- (a-)": "aʋu"
    - lemma: "this man, that man"
      key: "man"
      forms:
        "near: ಈ (ī), ಇ- (i-)": "ಇವನು"
        "far: ಆ (ā), ಅ- (a-)": "ಅವನು"
      readings:
        "near: ಈ (ī), ಇ- (i-)": "ivanu"
        "far: ಆ (ā), ಅ- (a-)": "avanu"
      ipas:
        "near: ಈ (ī), ಇ- (i-)": "iʋanu"
        "far: ಆ (ā), ಅ- (a-)": "aʋanu"
    - lemma: "this woman, that woman"
      key: "woman"
      forms:
        "near: ಈ (ī), ಇ- (i-)": "ಇವಳು"
        "far: ಆ (ā), ಅ- (a-)": "ಅವಳು"
      readings:
        "near: ಈ (ī), ಇ- (i-)": "ivaḷu"
        "far: ಆ (ā), ಅ- (a-)": "avaḷu"
      ipas:
        "near: ಈ (ī), ಇ- (i-)": "iʋaɭu"
        "far: ಆ (ā), ಅ- (a-)": "aʋaɭu"
    - lemma: "these people, those people"
      key: "people"
      forms:
        "near: ಈ (ī), ಇ- (i-)": "ಇವರು"
        "far: ಆ (ā), ಅ- (a-)": "ಅವರು"
      readings:
        "near: ಈ (ī), ಇ- (i-)": "ivaru"
        "far: ಆ (ā), ಅ- (a-)": "avaru"
      ipas:
        "near: ಈ (ī), ಇ- (i-)": "iʋaru"
        "far: ಆ (ā), ಅ- (a-)": "aʋaru"
    - lemma: "here, there"
      key: "place"
      forms:
        "near: ಈ (ī), ಇ- (i-)": "ಇಲ್ಲಿ"
        "far: ಆ (ā), ಅ- (a-)": "ಅಲ್ಲಿ"
      readings:
