        "far: ಆ (ā), ಅ- (a-)": "haːɡe"
    - lemma: "this much, that much"
      key: "amount"
      forms:
        "near: ಈ (ī), ಇ- (i-)": "ಇಷ್ಟು"
        "far: ಆ (ā), ಅ- (a-)": "ಅಷ್ಟು"
      readings:
        "near: ಈ (ī), ಇ- (i-)": "iṣṭu"
        "far: ಆ (ā), ಅ- (a-)": "aṣṭu"
      ipas:
        "near: ಈ (ī), ಇ- (i-)": "iʂʈu"
        "far: ಆ (ā), ಅ- (a-)": "aʂʈu"
    - lemma: "now, then"
      key: "time"
      forms:
        "near: ಈ (ī), ಇ- (i-)": "ಈಗ"
        "far: ಆ (ā), ಅ- (a-)": "ಆಗ"
      readings:
        "near: ಈ (ī), ಇ- (i-)": "īga"
        "far: ಆ (ā), ಅ- (a-)": "āga"
      ipas:
        "near: ಈ (ī), ಇ- (i-)": "iːɡa"
        "far: ಆ (ā), ಅ- (a-)": "aːɡa"
