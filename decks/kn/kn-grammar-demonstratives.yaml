      key: "kind"
      forms:
        "near: ಈ (ī), ಇ- (i-)": ["ಇಂಥ", "ಇಂತಹ"]
        "far: ಆ (ā), ಅ- (a-)": ["ಅಂಥ", "ಅಂತಹ"]
      readings:
        "near: ಈ (ī), ಇ- (i-)": ["intha", "intaha"]
        "far: ಆ (ā), ಅ- (a-)": ["antha", "antaha"]
      ipas:
        "near: ಈ (ī), ಇ- (i-)": "int̪ʰa"
        "far: ಆ (ā), ಅ- (a-)": "ant̪ʰa"
