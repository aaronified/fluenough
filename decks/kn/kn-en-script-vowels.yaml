schema: 1
id: kn-en-script-vowels
name: "Kannada vowels"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The vowels as they are written on their own, at the start of a word. In Kannada a short and a long vowel are different sounds, e and o included. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: kn-0001
    target: "ಅ"
    native: "a, short (the vowel every consonant carries)"
    reading: "a"
    notes: "Like the 'u' of 'but'. Every consonant carries it unless a sign changes it: ಕ is 'ka'. ಅಮ್ಮ (amma, mother)."
  - id: kn-0002
    target: "ಆ"
    native: "aa, long"
    reading: "a"
    notes: "The 'a' of 'father', held about twice as long as ಅ. Short and long change the word in Kannada: ಆನೆ (ane, elephant)."
  - id: kn-0003
    target: "ಇ"
    native: "i, short"
    reading: "i"
    notes: "Like the 'i' of 'sit': ಇಲಿ (ili, mouse)."
  - id: kn-0004
    target: "ಈ"
    native: "ii, long"
    reading: "i"
    notes: "The 'ee' of 'see', held longer than ಇ: ಈರುಳ್ಳಿ (irulli, onion)."
  - id: kn-0005
    target: "ಉ"
    native: "u, short"
    reading: "u"
    notes: "Like the 'u' of 'put': ಉಪ್ಪು (uppu, salt). A great many Kannada words end in this short u, and it is said."
  - id: kn-0006
    target: "ಊ"
    native: "uu, long"
    reading: "u"
    notes: "The 'oo' of 'food', held longer than ಉ: ಊರು (uru, town; home town)."
  - id: kn-0007
    target: "ಋ"
    native: "ru (a vowel letter)"
    reading: "ru"
    modes: [recognition, production]
    notes: "Said 'ru', though it is written as one vowel, in words from Sanskrit: ಋಷಿ (rushi, sage). A recogniser writes 'ru' as ರು, so it is drilled by reading and writing only."
  - id: kn-0008
    target: "ಎ"
    native: "e, short"
    reading: "e"
    notes: "Like the 'e' of 'pet', short. English has no short and long e; Kannada does: ಎಲೆ (ele, leaf)."
  - id: kn-0009
    target: "ಏ"
    native: "ee, long"
    reading: "e"
    notes: "The 'ay' of 'say' held long, without the glide English adds: ಏಳು (elu, seven)."
  - id: kn-0010
    target: "ಐ"
    native: "ai (as in 'kite')"
    reading: "ai"
    notes: "A glide from a to i, like the 'i' of 'kite': ಐದು (aidu, five)."
  - id: kn-0011
    target: "ಒ"
    native: "o, short"
    reading: "o"
    notes: "Like a short 'o' of 'go', with no glide. Kannada has short and long o: ಒಂದು (ondu, one)."
  - id: kn-0012
    target: "ಓ"
    native: "oo, long"
    reading: "o"
    notes: "The 'o' of 'go' held long, without the glide English adds: ಓದು (odu, read)."
  - id: kn-0013
    target: "ಔ"
    native: "au (as in 'cow')"
    reading: "au"
    notes: "A glide from a to u, like the 'ow' of 'cow', mostly in words from Sanskrit: ಔಷಧ (aushadha, medicine)."
