schema: 1
id: kn-en-grammar-past-more
name: "Used to"
kind: grammar
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I used to go, she was coming: the past of a habit, and of what was going on. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Past habit and past continuous"
  slot_name: "person"
  slots: ["ನಾನು", "ನಾವು", "ನೀನು", "ನೀವು", "ಅವನು", "ಅವಳು", "ಅದು", "ಅವರು"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The verb with -ಉತ್ತ- and the past of ಇರು: ಮಾಡುತ್ತಿದ್ದೆ. The same form is 'used to' and 'was doing': ನಾನು ಬೆಂಗಳೂರಿನಲ್ಲಿ ಕೆಲಸ ಮಾಡುತ್ತಿದ್ದೆ, I used to work in Bengaluru, or I was working there. The verb agrees with the doer's person and number. In the third person a man, a woman and a thing each have a form of their own: ಅವನು ಬಂದನು, ಅವಳು ಬಂದಳು, ಅದು ಬಂತು. ನೀವು, plural or respectful, takes the plural, and so does ಅವರು, they, or he or she with respect. Where two forms are given, the first is written Kannada and the second everyday speech; both are accepted."
  entries:
    - lemma: "ಮಾಡು"
      key: maadu
      gloss: "to do"
      forms:
        "ನಾನು": ["ಮಾಡುತ್ತಿದ್ದೆ", "ಮಾಡ್ತಿದ್ದೆ"]
        "ನಾವು": ["ಮಾಡುತ್ತಿದ್ದೆವು", "ಮಾಡ್ತಿದ್ವಿ"]
        "ನೀನು": ["ಮಾಡುತ್ತಿದ್ದೆ", "ಮಾಡ್ತಿದ್ದೆ"]
        "ನೀವು": ["ಮಾಡುತ್ತಿದ್ದಿರಿ", "ಮಾಡ್ತಿದ್ರಿ"]
        "ಅವನು": ["ಮಾಡುತ್ತಿದ್ದನು", "ಮಾಡ್ತಿದ್ದ"]
        "ಅವಳು": ["ಮಾಡುತ್ತಿದ್ದಳು", "ಮಾಡ್ತಿದ್ಲು"]
        "ಅದು": ["ಮಾಡುತ್ತಿತ್ತು", "ಮಾಡ್ತಿತ್ತು"]
        "ಅವರು": ["ಮಾಡುತ್ತಿದ್ದರು", "ಮಾಡ್ತಿದ್ರು"]
    - lemma: "ಹೋಗು"
      key: hoogu
      gloss: "to go"
      forms:
        "ನಾನು": ["ಹೋಗುತ್ತಿದ್ದೆ", "ಹೋಗ್ತಿದ್ದೆ"]
        "ನಾವು": ["ಹೋಗುತ್ತಿದ್ದೆವು", "ಹೋಗ್ತಿದ್ವಿ"]
        "ನೀನು": ["ಹೋಗುತ್ತಿದ್ದೆ", "ಹೋಗ್ತಿದ್ದೆ"]
        "ನೀವು": ["ಹೋಗುತ್ತಿದ್ದಿರಿ", "ಹೋಗ್ತಿದ್ರಿ"]
        "ಅವನು": ["ಹೋಗುತ್ತಿದ್ದನು", "ಹೋಗ್ತಿದ್ದ"]
        "ಅವಳು": ["ಹೋಗುತ್ತಿದ್ದಳು", "ಹೋಗ್ತಿದ್ಲು"]
        "ಅದು": ["ಹೋಗುತ್ತಿತ್ತು", "ಹೋಗ್ತಿತ್ತು"]
        "ಅವರು": ["ಹೋಗುತ್ತಿದ್ದರು", "ಹೋಗ್ತಿದ್ರು"]
    - lemma: "ಬರು"
      key: baru
      gloss: "to come"
      forms:
        "ನಾನು": ["ಬರುತ್ತಿದ್ದೆ", "ಬರ್ತಿದ್ದೆ"]
        "ನಾವು": ["ಬರುತ್ತಿದ್ದೆವು", "ಬರ್ತಿದ್ವಿ"]
        "ನೀನು": ["ಬರುತ್ತಿದ್ದೆ", "ಬರ್ತಿದ್ದೆ"]
        "ನೀವು": ["ಬರುತ್ತಿದ್ದಿರಿ", "ಬರ್ತಿದ್ರಿ"]
        "ಅವನು": ["ಬರುತ್ತಿದ್ದನು", "ಬರ್ತಿದ್ದ"]
        "ಅವಳು": ["ಬರುತ್ತಿದ್ದಳು", "ಬರ್ತಿದ್ಲು"]
        "ಅದು": ["ಬರುತ್ತಿತ್ತು", "ಬರ್ತಿತ್ತು"]
        "ಅವರು": ["ಬರುತ್ತಿದ್ದರು", "ಬರ್ತಿದ್ರು"]
    - lemma: "ಇರು"
      key: iru
      gloss: "to be; to live"
      forms:
        "ನಾನು": ["ಇರುತ್ತಿದ್ದೆ", "ಇರ್ತಿದ್ದೆ"]
        "ನಾವು": ["ಇರುತ್ತಿದ್ದೆವು", "ಇರ್ತಿದ್ವಿ"]
        "ನೀನು": ["ಇರುತ್ತಿದ್ದೆ", "ಇರ್ತಿದ್ದೆ"]
        "ನೀವು": ["ಇರುತ್ತಿದ್ದಿರಿ", "ಇರ್ತಿದ್ರಿ"]
        "ಅವನು": ["ಇರುತ್ತಿದ್ದನು", "ಇರ್ತಿದ್ದ"]
        "ಅವಳು": ["ಇರುತ್ತಿದ್ದಳು", "ಇರ್ತಿದ್ಲು"]
        "ಅದು": ["ಇರುತ್ತಿತ್ತು", "ಇರ್ತಿತ್ತು"]
        "ಅವರು": ["ಇರುತ್ತಿದ್ದರು", "ಇರ್ತಿದ್ರು"]
