schema: 1
id: kn-en-script-vowel-signs
name: "Kannada vowel signs"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN, icon: "ಕ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "After a consonant a vowel is written as a sign on it (the kagunita): on top in place of the tick, or on the right, never before it. Here on ಕ and on ಮ. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: kn-0063
    target: "ಕಾ"
    native: "kaa (k + the aa sign)"
    reading: "ka"
    notes: "The aa sign ಾ is a hook on the right of the tick on top: ಕಾಗೆ (kage, crow). Compare ಕ on its own, which is 'ka' with a short a."
  - id: kn-0064
    target: "ಕಿ"
    native: "ki (k + the i sign)"
    reading: "ki"
    notes: "The i sign ಿ takes the place of the tick on top: ಕಿಟಕಿ (kitaki, window)."
  - id: kn-0065
    target: "ಕೀ"
    native: "kii (k + the ii sign)"
    reading: "ki"
    notes: "ಕಿ with the long mark ೕ (dirgha) on its right. Short and long change the word, so look for the mark: ಕೀಟ (kita, insect)."
  - id: kn-0066
    target: "ಕು"
    native: "ku (k + the u sign)"
    reading: "ku"
    notes: "The u sign ು is a hook joined on the right: ಕುರಿ (kuri, sheep)."
  - id: kn-0067
    target: "ಕೂ"
    native: "kuu (k + the uu sign)"
    reading: "ku"
    notes: "The uu sign ೂ is joined on the right, with an extra curl: ಕೂದಲು (kudalu, hair)."
  - id: kn-0068
    target: "ಕೃ"
    native: "kru (k + the ru sign)"
    reading: "kru"
    modes: [recognition, production]
    notes: "The ru sign ೃ is joined on the right, in words from Sanskrit: ಕೃಷಿ (krushi, farming). A recogniser writes 'kru' as ಕ್ರು, so it is drilled by reading and writing only."
  - id: kn-0069
    target: "ಕೆ"
    native: "ke (k + the e sign)"
    reading: "ke"
    notes: "The e sign ೆ keeps the tick and adds a hook on the right: ಕೆಲಸ (kelasa, work)."
  - id: kn-0070
    target: "ಕೇ"
    native: "kee (k + the ee sign)"
    reading: "ke"
    notes: "ಕೆ with the long mark ೕ on its right: ಕೇಳು (kelu, ask; listen)."
  - id: kn-0071
    target: "ಕೈ"
    native: "kai (k + the ai sign)"
    reading: "kai"
    notes: "The e sign with a small stroke below it: ಕೈ (kai, hand)."
  - id: kn-0072
    target: "ಕೊ"
    native: "ko (k + the o sign)"
    reading: "ko"
    notes: "The e sign and the u hook together: ಕೊಡು (kodu, give)."
  - id: kn-0073
    target: "ಕೋ"
    native: "koo (k + the oo sign)"
    reading: "ko"
    notes: "ಕೊ with the long mark ೕ: ಕೋಳಿ (koli, hen)."
  - id: kn-0074
    target: "ಕೌ"
    native: "kau (k + the au sign)"
    reading: "kau"
    notes: "A sign of its own on the right, mostly in words from Sanskrit: ಕೌಶಲ (kaushala, skill)."
  - id: kn-0075
    target: "ಕಂ"
    native: "kam (k + the circle)"
    reading: "kam"
    modes: [recognition, production]
    notes: "The circle ಂ (anusvara, often called sonne, zero) after a letter is an m or an n, the nasal that suits the next letter: ಕಂಬ (kamba, pillar), ಗಂಗೆ (gange). It is not a sound of its own, so it is drilled by reading and writing only."
  - id: kn-0076
    target: "ಕ್"
    native: "k (with the halant: no vowel)"
    reading: "k"
    modes: [recognition, production]
    notes: "The halant ್ takes the vowel away. It ends words from English written in Kannada: ಬ್ಯಾಂಕ್ (byank, bank). It is not a sound of its own, so it is drilled by reading and writing only."
  - id: kn-0077
    target: "ಮಾ"
    native: "maa (m + the aa sign)"
    reading: "ma"
    notes: "ಮಾವು (mavu, mango)."
  - id: kn-0078
    target: "ಮಿ"
    native: "mi (m + the i sign)"
    reading: "mi"
    notes: "ಮಿಂಚು (minchu, lightning)."
  - id: kn-0079
    target: "ಮೀ"
    native: "mii (m + the ii sign)"
    reading: "mi"
    notes: "ಮೀನು (minu, fish)."
  - id: kn-0080
    target: "ಮು"
    native: "mu (m + the u sign)"
    reading: "mu"
    notes: "ಮುಖ (mukha, face)."
  - id: kn-0081
    target: "ಮೂ"
    native: "muu (m + the uu sign)"
    reading: "mu"
    notes: "ಮೂಗು (mugu, nose)."
  - id: kn-0082
    target: "ಮೆ"
    native: "me (m + the e sign)"
    reading: "me"
    notes: "ಮೆಟ್ಟಿಲು (mettilu, stairs)."
  - id: kn-0083
    target: "ಮೇ"
    native: "mee (m + the ee sign)"
    reading: "me"
    notes: "ಮೇಜು (meju, table)."
  - id: kn-0084
    target: "ಮೊ"
    native: "mo (m + the o sign)"
    reading: "mo"
    notes: "ಮೊಸರು (mosaru, curd)."
  - id: kn-0085
    target: "ಮೋ"
    native: "moo (m + the oo sign)"
    reading: "mo"
    notes: "ಮೋಡ (moda, cloud)."
