passages:
  - id: "kn-clean-up-notice"
    title: "Clean-up notice"
    sentences:
      - text: "ಭಾನುವಾರ ಬೆಳಿಗ್ಗೆ ಎಂಟು ಗಂಟೆಗೆ ಬನ್ನಿ."
        reading: "bhānuvāra beḷigge eṇṭu gaṇṭege banni."
        ipa: "bʱaːnuʋaːra beɭiɡɡe eɳʈu ɡaɳʈeɡe banni"
      - text: "ನಾವು ಉದ್ಯಾನ ಸ್ವಚ್ಛಗೊಳಿಸುತ್ತೇವೆ."
        reading: "nāvu udyāna svacchagoḷisuttēve."
        ipa: "naːʋu ud̪jaːna sʋatʃtʃʰaɡoɭisut̪t̪eːʋe"
      - text: "ಪ್ಲಾಸ್ಟಿಕ್ ಮರುಬಳಕೆ ಮಾಡಿ."
        reading: "plāsṭik marubaḷake māḍi."
        ipa: "plaːsʈik marubaɭake maːɖi"
      - text: "ಪರಿಸರ ಉಳಿಸಿ."
        reading: "parisara uḷisi."
        ipa: "parisara uɭisi"
      - text: "ಬನ್ನಿ, ನಮ್ಮ ಪರಿಸರವನ್ನು ಕಾಪಾಡೋಣ."
        reading: "banni, namma parisaravannu kāpāḍōṇa."
        ipa: "banni namma parisaraʋannu kaːpaːɖoːɳa"
    questions:
      - id: "kn-9367"
        prompt: { en: "When is the clean-up?" }
        options:
          - { en: "Sunday morning at eight" }
          - { en: "Monday morning at eight" }
          - { en: "Sunday evening at eight" }
        answer: 1
      - id: "kn-9368"
        prompt: { en: "Plastic should be recycled." }
        answer: true
      - id: "kn-9369"
        prompt: { en: "What will the group clean?" }
        options:
          - { en: "The park" }
          - { en: "The school" }
          - { en: "The bank" }
        answer: 1
