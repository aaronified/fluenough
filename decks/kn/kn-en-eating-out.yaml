    pos: "noun"
    notes: "Also ಚಹಾ (chaha)."
  - id: kn-0494
    target: "ಕಾಫಿ"
    native: "coffee"
    reading: "kafi"
    pos: "noun"
    notes: "Karnataka grows most of India's coffee, and filter coffee is the drink of the morning."
  - ref: kn-0062
    native: "cooked rice; a meal of rice"
  - id: kn-0495
    target: "ದೋಸೆ"
    native: "dosa"
    reading: "dose"
    pos: "noun"
    notes: "ಮಸಾಲೆ ದೋಸೆ (masale dose), a dosa with spiced potato inside, is said to come from Udupi."
  - id: kn-0496
