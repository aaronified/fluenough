    native: "I'd like …; I need …"
    reading: "nanage ... beku."
    pos: "phrase"
    notes: "'To me … is wanted': ನನಗೆ ಒಂದು ಕಾಫಿ ಬೇಕು, I'd like a coffee."
  - id: kn-0497
    target: "ಇನ್ನೂ ಸ್ವಲ್ಪ"
    native: "a little more"
    reading: "innu svalpa"
    pos: "phrase"
    notes: "ಇನ್ನೂ (innu) is 'more, still'."
  - id: kn-0498
    target: "ಖಾರ"
    native: "spicy heat; a spicy snack"
    reading: "khara"
    pos: "noun"
    notes: "ಖಾರ ಕಡಿಮೆ (khara kadime), less spicy."
  - id: kn-0499
    target: "ಖಾರ ಕಡಿಮೆ ಮಾಡಿ."
    native: "Not too spicy, please."
    reading: "khara kadime madi."
    pos: "phrase"
  - id: kn-0500
    target: "ಸಿಹಿ"
    native: "sweet"
    reading: "sihi"
    pos: "adj"
    notes: "A sweet is ಸಿಹಿ ತಿಂಡಿ (sihi tindi)."
  - id: kn-0501
    target: "ಸಸ್ಯಾಹಾರ"
