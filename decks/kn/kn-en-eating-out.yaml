    reading: "sasyahara"
    pos: "noun"
    notes: "On menus also ವೆಜ್ (vej). Meat is ಮಾಂಸಾಹಾರ (mamsahara), or ನಾನ್ ವೆಜ್."
  - id: kn-0502
    target: "ಬಿಲ್ ಕೊಡಿ."
    native: "The bill, please."
    reading: "bil kodi."
    pos: "phrase"
  - id: kn-0503
    target: "ತುಂಬಾ ಚೆನ್ನಾಗಿದೆ."
