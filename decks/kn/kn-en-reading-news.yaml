      - text: "ಮತದಾನ ನಾಳೆ."
        reading: "matadāna nāḷe."
        ipa: "mat̪ad̪aːna naːɭe"
      - text: "ರಸ್ತೆಯಲ್ಲಿ ಅಪಘಾತ ಆಗಿದೆ."
        reading: "rasteyalli apaghāta āgide."
        ipa: "rast̪ejalli apaɡʱaːt̪a aːɡid̪e"
      - text: "ರೇಡಿಯೋದಲ್ಲಿ ಸುದ್ದಿ ಇದೆ."
        reading: "rēḍiyōdalli suddi ide."
        ipa: "reːɖijoːd̪alli sud̪d̪i id̪e"
