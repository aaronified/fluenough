schema: 1
id: kn-en-grammar-demonstratives
name: "This and that"
kind: grammar
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN, icon: "ಕ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "ಈ and ಆ, and the words built on them: this one, here, this way, so much. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Near and far"
  slot_name: "near or far"
  slots: ["near: ಈ, ಇ-", "far: ಆ, ಅ-"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Words for near things start with ಇ- or ಈ-, words for far ones with ಅ- or ಆ-; 'like this' and 'like that' take an h: ಹೀಗೆ, ಹಾಗೆ. ಈ and ಆ stand before a noun and never change: ಈ ಪುಸ್ತಕ, this book; ಆ ಮನೆ, that house. The far words are also the everyday 'he', 'she', 'it' and 'they'."
  entries:
    - lemma: "this, that (before a noun)"
      key: before-noun
      gloss: "before a noun"
      forms:
        "near: ಈ, ಇ-": "ಈ"
        "far: ಆ, ಅ-": "ಆ"
      readings:
        "near: ಈ, ಇ-": "ī"
        "far: ಆ, ಅ-": "ā"
      ipas:
        "near: ಈ, ಇ-": "iː"
        "far: ಆ, ಅ-": "aː"
    - lemma: "this one, that one (a thing)"
      key: thing
      gloss: "a thing"
      forms:
        "near: ಈ, ಇ-": "ಇದು"
        "far: ಆ, ಅ-": "ಅದು"
      readings:
        "near: ಈ, ಇ-": "idu"
        "far: ಆ, ಅ-": "adu"
      ipas:
        "near: ಈ, ಇ-": "id̪u"
        "far: ಆ, ಅ-": "ad̪u"
    - lemma: "these, those (things)"
      key: things
      gloss: "things"
      forms:
        "near: ಈ, ಇ-": "ಇವು"
        "far: ಆ, ಅ-": "ಅವು"
      readings:
        "near: ಈ, ಇ-": "ivu"
        "far: ಆ, ಅ-": "avu"
      ipas:
        "near: ಈ, ಇ-": "iʋu"
        "far: ಆ, ಅ-": "aʋu"
    - lemma: "this man, that man"
      key: man
      gloss: "a man"
      forms:
        "near: ಈ, ಇ-": "ಇವನು"
        "far: ಆ, ಅ-": "ಅವನು"
      readings:
        "near: ಈ, ಇ-": "ivanu"
        "far: ಆ, ಅ-": "avanu"
      ipas:
        "near: ಈ, ಇ-": "iʋanu"
        "far: ಆ, ಅ-": "aʋanu"
    - lemma: "this woman, that woman"
      key: woman
      gloss: "a woman"
      forms:
        "near: ಈ, ಇ-": "ಇವಳು"
        "far: ಆ, ಅ-": "ಅವಳು"
      readings:
        "near: ಈ, ಇ-": "ivaḷu"
        "far: ಆ, ಅ-": "avaḷu"
      ipas:
        "near: ಈ, ಇ-": "iʋaɭu"
        "far: ಆ, ಅ-": "aʋaɭu"
    - lemma: "these people, those people"
      key: people
      gloss: "people, or one person with respect"
      forms:
        "near: ಈ, ಇ-": "ಇವರು"
        "far: ಆ, ಅ-": "ಅವರು"
      readings:
        "near: ಈ, ಇ-": "ivaru"
        "far: ಆ, ಅ-": "avaru"
      ipas:
        "near: ಈ, ಇ-": "iʋaru"
        "far: ಆ, ಅ-": "aʋaru"
    - lemma: "here, there"
      key: place
      gloss: "place"
      forms:
        "near: ಈ, ಇ-": "ಇಲ್ಲಿ"
        "far: ಆ, ಅ-": "ಅಲ್ಲಿ"
      readings:
        "near: ಈ, ಇ-": "illi"
        "far: ಆ, ಅ-": "alli"
      ipas:
        "near: ಈ, ಇ-": "illi"
        "far: ಆ, ಅ-": "alli"
    - lemma: "this way, that way"
      key: direction
      gloss: "direction"
      forms:
        "near: ಈ, ಇ-": ["ಈ ಕಡೆ", "ಈಕಡೆ"]
        "far: ಆ, ಅ-": ["ಆ ಕಡೆ", "ಆಕಡೆ"]
      readings:
        "near: ಈ, ಇ-": ["ī kaḍe", "īkaḍe"]
        "far: ಆ, ಅ-": ["ā kaḍe", "ākaḍe"]
      ipas:
        "near: ಈ, ಇ-": "iː kaɖe"
        "far: ಆ, ಅ-": "aː kaɖe"
    - lemma: "like this, like that"
      key: manner
      gloss: "manner"
      forms:
        "near: ಈ, ಇ-": "ಹೀಗೆ"
        "far: ಆ, ಅ-": "ಹಾಗೆ"
      readings:
        "near: ಈ, ಇ-": "hīge"
        "far: ಆ, ಅ-": "hāge"
      ipas:
        "near: ಈ, ಇ-": "hiːɡe"
        "far: ಆ, ಅ-": "haːɡe"
    - lemma: "this much, that much"
      key: amount
      gloss: "amount"
      forms:
        "near: ಈ, ಇ-": "ಇಷ್ಟು"
        "far: ಆ, ಅ-": "ಅಷ್ಟು"
      readings:
        "near: ಈ, ಇ-": "iṣṭu"
        "far: ಆ, ಅ-": "aṣṭu"
      ipas:
        "near: ಈ, ಇ-": "iʂʈu"
        "far: ಆ, ಅ-": "aʂʈu"
    - lemma: "now, then"
      key: time
      gloss: "time"
      forms:
        "near: ಈ, ಇ-": "ಈಗ"
        "far: ಆ, ಅ-": "ಆಗ"
      readings:
        "near: ಈ, ಇ-": "īga"
        "far: ಆ, ಅ-": "āga"
      ipas:
        "near: ಈ, ಇ-": "iːɡa"
        "far: ಆ, ಅ-": "aːɡa"
    - lemma: "such as this, such as that"
      key: kind
      gloss: "kind"
      forms:
        "near: ಈ, ಇ-": ["ಇಂಥ", "ಇಂತಹ"]
        "far: ಆ, ಅ-": ["ಅಂಥ", "ಅಂತಹ"]
      readings:
        "near: ಈ, ಇ-": ["intha", "intaha"]
        "far: ಆ, ಅ-": ["antha", "antaha"]
      ipas:
        "near: ಈ, ಇ-": "int̪ʰa"
        "far: ಆ, ಅ-": "ant̪ʰa"
