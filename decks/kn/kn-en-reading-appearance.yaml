  - id: "kn-lost-and-found-notice"
    title: "Lost and found notice"
    sentences:
      - text: "ಇಲ್ಲಿ ಒಬ್ಬ ಯುವಕನ ಬ್ಯಾಗ್ ಇದೆ."
        reading: "illi obba yuvakana byāg ide."
        ipa: "illi obba juʋakana bjaːɡ id̪e"
      - text: "ಯುವಕ ಉದ್ದ ಮತ್ತು ತೆಳ್ಳಗೆ."
        reading: "yuvaka udda mattu teḷḷage."
        ipa: "juʋaka ud̪d̪a mat̪t̪u t̪eɭɭaɡe"
      - text: "ಬ್ಯಾಗ್ ಕೆಂಪು ಬಣ್ಣದ್ದು."
        reading: "byāg kempu baṇṇaddu."
        ipa: "bjaːɡ kempu baɳɳad̪d̪u"
      - text: "ಯಾರದು? ಹೇಳಿ."
        reading: "yāradu? hēḷi."
        ipa: "jaːrad̪u heːɭi"
