schema: 1
id: kn-en-registers
name: "Written Kannada and spoken Kannada"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Written Kannada keeps fuller forms than speech: ಮಾಡುತ್ತೇನೆ on paper, ಮಾಡ್ತೀನಿ in the street. These decks show the written form and accept the spoken one; here they are side by side, with the formal words seen on signs. Recognition only. Not yet checked by a Kannada speaker: please report any mistake."
tags: [reading, unreviewed]
cards:
  - ref: kn-0504
    modes: [recognition]
    notes: "Written and formal. In speech Kannada often puts -ಊ on both words instead: ನಾನೂ ನೀನೂ, you and I."
  - ref: kn-0146
    modes: [recognition]
    notes: "Formal. Between friends, often ಥ್ಯಾಂಕ್ಸ್ (thyaanks)."
  - id: kn-0543
    target: "ಮಾಡುತ್ತೇನೆ"
    native: "I do; I'll do (written); in speech ಮಾಡ್ತೀನಿ"
    reading: "maadutteene"
    pos: "other"
    modes: [recognition]
    notes: "Written Kannada keeps -ಉತ್ತ- whole; speech shortens it: ಬರುತ್ತೇನೆ, ಬರ್ತೀನಿ."
  - id: kn-0544
    target: "ಬರುತ್ತದೆ"
    native: "it comes; it will come (written); in speech ಬರುತ್ತೆ"
    reading: "baruttade"
    pos: "other"
    modes: [recognition]
  - id: kn-0545
    target: "ಮಾಡುವುದು"
    native: "doing; to do (written); in speech ಮಾಡೋದು"
    reading: "maaduvudu"
    pos: "other"
    modes: [recognition]
    notes: "Speech turns -ಉವು- into -ಓ-: ನೋಡುವುದು, ನೋಡೋದು."
  - id: kn-0546
    target: "ಹೋಗಲು"
    native: "to go, in order to go (written); in speech ಹೋಗೋಕೆ"
    reading: "hoogalu"
    pos: "other"
    modes: [recognition]
    notes: "Also ಹೋಗಕ್ಕೆ (hoogakke) in speech."
  - ref: kn-0355
    modes: [recognition]
    notes: "Written. In speech ಮನೇಲಿ (maneeli): -ಯಲ್ಲಿ becomes -ಏಲಿ."
  - id: kn-0547
    target: "ಇಂದು"
    native: "today (written); in speech ಇವತ್ತು"
    reading: "indu"
    pos: "other"
    modes: [recognition]
  - id: kn-0548
    target: "ಆದುದರಿಂದ"
    native: "therefore (written); in speech ಅದಕ್ಕೆ"
    reading: "aadudarinda"
    pos: "other"
    modes: [recognition]
  - id: kn-0549
    target: "ಹೇಳಿದನು"
    native: "he said (written); in speech ಹೇಳಿದ"
    reading: "heelidanu"
    pos: "other"
    modes: [recognition]
    notes: "Speech drops the -ನು of a man's past."
  - id: kn-0550
    target: "ದಯವಿಟ್ಟು"
    native: "please (formal, written)"
    reading: "dayavittu"
    pos: "other"
    modes: [recognition]
    notes: "In speech a polite verb ending usually does the work: ಕೊಡಿ, please give."
  - id: kn-0551
    target: "ಸ್ವಾಗತ"
    native: "welcome (on signs)"
    reading: "svaagata"
    pos: "other"
    modes: [recognition]
  - id: kn-0552
    target: "ಪ್ರವೇಶ"
    native: "entry; way in (on signs)"
    reading: "praveesha"
    pos: "other"
    modes: [recognition]
  - id: kn-0553
    target: "ನಿರ್ಗಮನ"
    native: "exit; way out (on signs)"
    reading: "nirgamana"
    pos: "other"
    modes: [recognition]
  - id: kn-0554
    target: "ಎಚ್ಚರಿಕೆ"
    native: "caution; warning (on signs)"
    reading: "echcharike"
    pos: "other"
    modes: [recognition]
  - id: kn-0555
    target: "ಧೂಮಪಾನ ನಿಷೇಧಿಸಲಾಗಿದೆ"
    native: "no smoking (on signs)"
    reading: "dhuumapaana nisheedhisalaagide"
    pos: "phrase"
    modes: [recognition]
    notes: "Literally 'smoking has been forbidden'."
  - id: kn-0556
    target: "ಶೌಚಾಲಯ"
    native: "toilet (formal, on signs)"
    reading: "shauchaalaya"
    pos: "noun"
    modes: [recognition]
