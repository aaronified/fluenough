passages:
  - id: "kn-nature-passage"
    title: "Signs in the park"
    sentences:
      - text: "ಹುಲ್ಲಿನ ಮೇಲೆ ಕುಳಿತುಕೊಳ್ಳಬೇಡಿ."
        reading: "hullina mēle kuḷitukoḷḷabēḍi."
        ipa: "hullina meːle kuɭit̪ukoɭɭabeːɖi"
      - text: "ಮರ ಮತ್ತು ಎಲೆ ಮುರಿಯಬೇಡಿ."
        reading: "mara mattu ele muriyabēḍi."
        ipa: "mara mat̪t̪u ele murijabeːɖi"
      - text: "ಕಲ್ಲು ಎತ್ತಬೇಡಿ."
        reading: "kallu ettabēḍi."
        ipa: "kallu et̪t̪abeːɖi"
      - text: "ಪಕ್ಷಿ ಮತ್ತು ಕೀಟ ಹಿಡಿಯಬೇಡಿ."
        reading: "pakṣi mattu kīṭa hiḍiyabēḍi."
        ipa: "pakʂi mat̪t̪u kiːʈa hiɖijabeːɖi"
      - text: "ಪೊಟ್ಟಣ ಡಬ್ಬಿಗೆ ಹಾಕಿ."
        reading: "poṭṭaṇa ḍabbige hāki."
        ipa: "poʈʈaɳa ɖabbiɡe haːki"
    questions:
      - id: "kn-9018"
        prompt: { en: "What must you not do on the grass?" }
        options:
          - { en: "Sit on it" }
          - { en: "Water it" }
          - { en: "Eat it" }
        answer: 1
      - id: "kn-9019"
        prompt: { en: "Birds and insects must not be caught." }
        answer: true
      - id: "kn-9020"
        prompt: { en: "Where should the packet go?" }
        options:
          - { en: "In the box" }
          - { en: "On the grass" }
          - { en: "Into the sea" }
        answer: 1
