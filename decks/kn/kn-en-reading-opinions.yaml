    title: "Two letters to the paper"
    sentences:
      - text: "ನನ್ನ ಅಭಿಪ್ರಾಯ ಬೇರೆ ಇದೆ."
        reading: "nanna abhiprāya bēre ide."
        ipa: "nanna abʱipraːja beːre id̪e"
      - text: "ನಾನು ಈ ಯೋಜನೆಗೆ ಒಪ್ಪುವುದಿಲ್ಲ."
        reading: "nānu ī yōjanege oppuvudilla."
        ipa: "naːnu iː joːdʒaneɡe oppuʋud̪illa"
      - text: "ಕಾರಣ ಸರಿಯಲ್ಲ."
        reading: "kāraṇa sariyalla."
        ipa: "kaːraɳa sarijalla"
      - text: "ಚರ್ಚೆ ಉತ್ತಮ."
        reading: "carce uttama."
        ipa: "tʃartʃe ut̪t̪ama"
      - text: "ಸತ್ಯ ಹೇಳಬೇಕು."
        reading: "satya hēḷabēku."
        ipa: "sat̪ja heːɭabeːku"
