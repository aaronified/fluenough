passages:
  - id: "kn-job-advert"
    title: "Job advert"
    sentences:
      - text: "ಹೊಸ ನೌಕರಿ ಇದೆ: ಡ್ರೈವರ್ ಬೇಕು."
        reading: "hosa naukari ide: ḍraivar bēku."
        ipa: "hosa naukari id̪e ɖraiʋar beːku"
      - text: "ಇದು ತಾತ್ಕಾಲಿಕ ಉದ್ಯೋಗ."
        reading: "idu tātkālika udyōga."
        ipa: "id̪u t̪aːt̪kaːlika ud̪joːɡa"
      - text: "ಅನುಭವ ಬೇಕು ಮತ್ತು ಸಂಬಳ ಚೆನ್ನಾಗಿದೆ."
        reading: "anubhava bēku mattu sambaḷa cennāgide."
        ipa: "anubʱaʋa beːku mat̪t̪u sambaɭa tʃennaːɡid̪e"
      - text: "ಸಂದರ್ಶನ ನಾಳೆ."
        reading: "sandarśana nāḷe."
        ipa: "sand̪arʃana naːɭe"
    questions:
      - id: "kn-9709"
        prompt: { en: "Which job is offered?" }
        options:
          - { en: "Driver" }
          - { en: "Doctor" }
          - { en: "Cook" }
        answer: 1
      - id: "kn-9710"
        prompt: { en: "The job is permanent." }
        answer: false
      - id: "kn-9711"
        prompt: { en: "The interview is tomorrow." }
        answer: true
