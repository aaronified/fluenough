  - id: "kn-exhibition-notice"
    title: "Exhibition notice"
    sentences:
      - text: "ಚಿತ್ರ ಪ್ರದರ್ಶನ ಇದೆ."
        reading: "citra pradarśana ide."
        ipa: "tʃit̪ra prad̪arʃana id̪e"
      - text: "ಶಿಲ್ಪ ಮತ್ತು ಮೂರ್ತಿ ಕೂಡ ಇದೆ."
        reading: "śilpa mattu mūrti kūḍa ide."
        ipa: "ʃilpa mat̪t̪u muːrt̪i kuːɖa id̪e"
      - text: "ಶನಿವಾರ ಮತ್ತು ಭಾನುವಾರ ಪ್ರವೇಶ ಉಚಿತ."
        reading: "śanivāra mattu bhānuvāra pravēśa ucita."
        ipa: "ʃaniʋaːra mat̪t̪u bʱaːnuʋaːra praʋeːʃa utʃit̪a"
      - text: "ವೀಣೆ ವಾದಕರು ಬರುತ್ತಾರೆ."
        reading: "vīṇe vādakaru baruttāre."
        ipa: "ʋiːɳe ʋaːd̪akaru barut̪t̪aːre"
    questions:
      - id: "kn-9715"
        prompt: { en: "What is on show?" }
        options:
          - { en: "Sculptures and paintings" }
          - { en: "Cars and phones" }
          - { en: "Shoes and clothes" }
        answer: 1
