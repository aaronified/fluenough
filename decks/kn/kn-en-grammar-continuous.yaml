      key: baru
      reading: "baru"
      gloss: "to come"
      forms:
        "ನಾನು": ["ಬರುತ್ತಿದ್ದೇನೆ", "ಬರ್ತಿದ್ದೀನಿ"]
        "ನಾವು": ["ಬರುತ್ತಿದ್ದೇವೆ", "ಬರ್ತಿದ್ದೀವಿ"]
        "ನೀನು": ["ಬರುತ್ತಿದ್ದೀಯ", "ಬರ್ತಿದ್ದೀಯ"]
        "ನೀವು": ["ಬರುತ್ತಿದ್ದೀರಿ", "ಬರ್ತಿದ್ದೀರಿ"]
        "ಅವನು": ["ಬರುತ್ತಿದ್ದಾನೆ", "ಬರ್ತಿದ್ದಾನೆ"]
        "ಅವಳು": ["ಬರುತ್ತಿದ್ದಾಳೆ", "ಬರ್ತಿದ್ದಾಳೆ"]
        "ಅದು": ["ಬರುತ್ತಿದೆ", "ಬರ್ತಿದೆ"]
        "ಅವರು": ["ಬರುತ್ತಿದ್ದಾರೆ", "ಬರ್ತಿದ್ದಾರೆ"]
      readings:
        "ನಾನು": ["baruttiddene", "bartiddini"]
        "ನಾವು": ["baruttiddeve", "bartiddivi"]
        "ನೀನು": ["baruttiddiya", "bartiddiya"]
        "ನೀವು": ["baruttiddiri", "bartiddiri"]
        "ಅವನು": ["baruttiddane", "bartiddane"]
