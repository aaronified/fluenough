        "ನಾವು": ["ಮಾಡುತ್ತಿದ್ದೇವೆ", "ಮಾಡ್ತಿದ್ದೀವಿ"]
        "ನೀನು": ["ಮಾಡುತ್ತಿದ್ದೀಯ", "ಮಾಡ್ತಿದ್ದೀಯ"]
        "ನೀವು": ["ಮಾಡುತ್ತಿದ್ದೀರಿ", "ಮಾಡ್ತಿದ್ದೀರಿ"]
        "ಅವನು": ["ಮಾಡುತ್ತಿದ್ದಾನೆ", "ಮಾಡ್ತಿದ್ದಾನೆ"]
        "ಅವಳು": ["ಮಾಡುತ್ತಿದ್ದಾಳೆ", "ಮಾಡ್ತಿದ್ದಾಳೆ"]
        "ಅದು": ["ಮಾಡುತ್ತಿದೆ", "ಮಾಡ್ತಿದೆ"]
        "ಅವರು": ["ಮಾಡುತ್ತಿದ್ದಾರೆ", "ಮಾಡ್ತಿದ್ದಾರೆ"]
      readings:
