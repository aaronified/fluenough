passages:
  - id: "kn-thank-you-note"
    title: "Thank-you note"
    sentences:
      - text: "ಅಕ್ಕ, ಧನ್ಯವಾದ."
        reading: "akka, dhanyavāda."
        ipa: "akka d̪ʱanjaʋaːd̪a"
      - text: "ನೀವು ನಮಗೆ ತುಂಬಾ ಸಹಾಯ ಮಾಡಿದ್ದೀರಿ."
        reading: "nīvu namage tumbā sahāya māḍiddīri."
        ipa: "niːʋu namaɡe t̪umbaː sahaːja maːɖid̪d̪iːri"
      - text: "ನಿಮ್ಮ ಸ್ನೇಹ ನನಗೆ ತುಂಬಾ ಇಷ್ಟ."
        reading: "nimma snēha nanage tumbā iṣṭa."
        ipa: "nimma sneːha nanaɡe t̪umbaː iʂʈa"
      - text: "ನೆರೆಹೊರೆಯವರು ಒಳ್ಳೆಯವರು."
        reading: "nerehoreyavaru oḷḷeyavaru."
        ipa: "nerehorejaʋaru oɭɭejaʋaru"
    questions:
      - id: "kn-9721"
        prompt: { en: "What is the note for?" }
        options:
          - { en: "Help from a neighbour" }
          - { en: "A bill" }
          - { en: "A school test" }
        answer: 1
      - id: "kn-9722"
        prompt: { en: "The writer likes the friendship." }
        answer: true
      - id: "kn-9723"
        prompt: { en: "The note says sorry for a quarrel." }
        answer: false
