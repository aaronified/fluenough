schema: 1
id: kn-en-grammar-can-must
name: "Can, may and must"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN, icon: "ಕ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Ability, permission, need and duty: each is an ending on the verb, or a skill that 'comes to' you. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: kn-0571
    target: "ನನಗೆ ಕನ್ನಡ ಮಾತಾಡಲು ಬರುತ್ತದೆ."
    native: "I can speak Kannada."
    reading: "nanage kannada matadalu baruttade."
    alt_target: ["ನಾನು ಕನ್ನಡ ಮಾತಾಡಬಲ್ಲೆ.", "ನಂಗೆ ಕನ್ನಡ ಮಾತಾಡಕ್ಕೆ ಬರುತ್ತೆ."]
    pos: "phrase"
    notes: "A skill 'comes to' you: -ಅಲು, to, and ಬರುತ್ತದೆ. ನಾನು ಕನ್ನಡ ಮಾತಾಡಬಲ್ಲೆ, with -ಬಲ್ಲೆ, is more formal."
  - id: kn-0572
    target: "ನಿಮಗೆ ನಾಳೆ ಬರಲು ಆಗುತ್ತದೆಯೇ?"
    native: "Can you come tomorrow?"
    reading: "nimage nale baralu aguttadeye?"
    alt_target: ["ನಾಳೆ ಬರಕ್ಕಾಗುತ್ತಾ?"]
    pos: "phrase"
    notes: "What you can manage 'becomes' for you: ಆಗು. In speech, ನಾಳೆ ಬರಕ್ಕಾಗುತ್ತಾ?"
  - id: kn-0573
    target: "ನನಗೆ ಬರಲು ಆಗುವುದಿಲ್ಲ."
    native: "I can't come."
    reading: "nanage baralu aguvudilla."
    alt_target: ["ನಂಗೆ ಬರಕ್ಕಾಗಲ್ಲ."]
    pos: "phrase"
  - id: kn-0574
    target: "ನನಗೆ ಈಜು ಬರುತ್ತದೆ."
    native: "I can swim."
    reading: "nanage iju baruttade."
    pos: "phrase"
    notes: "'Swimming comes to me'."
  - ref: kn-0149
    notes: "Can't, as a skill: 'Kannada doesn't come to me'."
  - id: kn-0575
    target: "ನೀವು ಒಳಗೆ ಬರಬಹುದು."
    native: "You may come in."
    reading: "nivu olage barabahudu."
    pos: "phrase"
    notes: "-ಬಹುದು is 'may': permission, and also 'might': ಮಳೆ ಬರಬಹುದು, it might rain."
  - id: kn-0576
    target: "ಬರಬಹುದಾ?"
    native: "May I come in?"
    reading: "barabahuda?"
    pos: "phrase"
    notes: "-ಬಹುದು with the question -ಆ asks permission."
  - id: kn-0577
    target: "ಇಲ್ಲಿ ಫೋಟೋ ತೆಗೆಯಬಾರದು."
    native: "You mustn't take photos here."
    reading: "illi foto tegeyabaradu."
    pos: "phrase"
    notes: "-ಬಾರದು is 'must not'."
  - ref: kn-0538
  - id: kn-0578
    target: "ನೀವು ನಾಳೆ ಬರಬೇಕು."
    native: "You must come tomorrow."
    reading: "nivu nale barabeku."
    pos: "phrase"
  - id: kn-0579
    target: "ನಾನು ಹೋಗಬೇಕಾಗಿಲ್ಲ."
    native: "I don't have to go."
    reading: "nanu hogabekagilla."
    alt_target: ["ನಾನು ಹೋಗಬೇಕಿಲ್ಲ."]
    pos: "phrase"
