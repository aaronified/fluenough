schema: 1
id: kn-en-spelling
name: "Kannada spellings, old and new"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Letters and spellings you will meet in older print and in everyday writing, and how they are written in the standard today. Recognition only. Not yet checked by a Kannada speaker: please report any mistake."
tags: [advanced, unreviewed]
cards:
  - id: kn-0580
    target: "ಮೞೆ"
    native: "rain; today ಮಳೆ"
    reading: "male"
    pos: "other"
    modes: [recognition]
    notes: "Old Kannada had a third l, ೞ, said far back in the mouth like the zh of Tamil. It merged with ಳ, and today's spelling writes ಳ."
  - id: kn-0581
    target: "ಮಱೆ"
    native: "to forget; today ಮರೆ"
    reading: "mare"
    pos: "other"
    modes: [recognition]
    notes: "Old Kannada also had a second r, ಱ (shakata repha). It merged with ರ, and today's spelling writes ರ."
  - id: kn-0582
    target: "ಸಙ್ಗೀತ"
    native: "music; today ಸಂಗೀತ"
    reading: "sangita"
    pos: "other"
    modes: [recognition]
    notes: "Older and Sanskrit-style print writes the nasal as a letter, ಙ or ಞ, where today's spelling uses the circle ಂ."
  - id: kn-0583
    target: "ಉಂಟು"
    native: "there is (older, formal); today ಇದೆ"
    reading: "untu"
    pos: "other"
    modes: [recognition]
    notes: "Still met in writing and in sayings."
  - id: kn-0584
    target: "ಕರ್ಣಾಟಕ"
    native: "Karnataka; today ಕರ್ನಾಟಕ"
    reading: "karnataka"
    pos: "other"
    modes: [recognition]
    notes: "The older, Sanskrit-style spelling with the curled-back ಣ."
  - id: kn-0585
    target: "ಬೆಳಗ್ಗೆ"
    native: "morning; also ಬೆಳಿಗ್ಗೆ"
    reading: "belagge"
    pos: "other"
    modes: [recognition]
    notes: "Both spellings are common."
  - id: kn-0586
    target: "ಮಾತನಾಡು"
    native: "to talk; in speech and much writing ಮಾತಾಡು"
    reading: "matanadu"
    pos: "other"
    modes: [recognition]
    notes: "ಮಾತು (word) + ಆಡು (play): the full form is the formal one."
  - id: kn-0587
    target: "ಹಾಗು"
    native: "and also; standard ಹಾಗೂ"
    reading: "hagu"
    pos: "other"
    modes: [recognition]
    notes: "A common spelling of ಹಾಗೂ: the ending -ಊ, 'also', is long."
  - id: kn-0588
    target: "ಕೂಡಾ"
    native: "also; also written ಕೂಡ"
    reading: "kuda"
    pos: "other"
    modes: [recognition]
  - id: kn-0589
    target: "ಆಯ್ತು"
    native: "OK; done; written ಆಯಿತು"
    reading: "aytu"
    pos: "other"
    modes: [recognition]
    notes: "How speech is spelled in messages: ಆಯಿತು, 'it became', is also 'OK'."
