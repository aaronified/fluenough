    sentences:
      - text: "ರಾಗಿ ಕಿಲೋಗೆ ಮೂವತ್ತು ರೂಪಾಯಿ."
        reading: "rāgi kilōge mūvattu rūpāyi."
        ipa: "raːɡi kiloːɡe muːʋat̪t̪u ruːpaːji"
      - text: "ಜೋಳ ಕಿಲೋಗೆ ಇಪ್ಪತ್ತು ರೂಪಾಯಿ."
        reading: "jōḷa kilōge ippattu rūpāyi."
        ipa: "dʒoːɭa kiloːɡe ippat̪t̪u ruːpaːji"
      - text: "ಟೊಮೆಟೊ ತುಂಬಾ ದುಬಾರಿ."
        reading: "ṭomeṭo tumbā dubāri."
        ipa: "ʈomeʈo t̪umbaː d̪ubaːri"
      - text: "ಹತ್ತಿ ಬೆಲೆ ಕಡಿಮೆ."
        reading: "hatti bele kaḍime."
        ipa: "hat̪t̪i bele kaɖime"
