source: "Written for this deck and released under CC0"
description: "A short story in four scenes, written for this deck in plain modern Kannada and released under CC0: Ravi's Sunday, a bus ride, bargaining for tomatoes, and supper at home. It quotes no book. The glossary explains the words the theme decks do not teach. Not yet checked by a Kannada speaker: please report any mistake."
tags: [reading, unreviewed]
passages:
  - id: kn-ravi-01
    title: "Ravi's Sunday"
    theme: daily-life
    sentences:
      - text: "ರವಿ ಬೆಳಿಗ್ಗೆ ಆರು ಗಂಟೆಗೆ ಏಳುತ್ತಾನೆ."
        reading: "ravi beḷigge āru gaṇṭege ēḷuttāne."
        ipa: "raʋi beɭiɡɡe aːru ɡaɳʈeɡe eːɭut̪t̪aːne"
      - text: "ಇವತ್ತು ಭಾನುವಾರ, ಅವನಿಗೆ ರಜೆ."
        reading: "ivattu bhānuvāra, avanige raje."
        ipa: "iʋat̪t̪u bʱaːnuʋaːra aʋaniɡe radʒe"
      - text: "ಅವನು ಸ್ನಾನ ಮಾಡಿ ತಿಂಡಿ ತಿನ್ನುತ್ತಾನೆ."
        reading: "avanu snāna māḍi tiṇḍi tinnuttāne."
        ipa: "aʋanu snaːna maːɖi t̪iɳɖi t̪innut̪t̪aːne"
      - text: "ಅವನ ಅಮ್ಮ ಬಿಸಿ ಬಿಸಿ ದೋಸೆ ಮಾಡುತ್ತಾರೆ."
        reading: "avana amma bisi bisi dōse māḍuttāre."
        ipa: "aʋana amma bisi bisi d̪oːse maːɖut̪t̪aːre"
    glossary:
      - word: "ಏಳುತ್ತಾನೆ"
        modern: "ಏಳುತ್ತಾನೆ"
        reading: "ēḷuttāne"
        ipa: "eːɭut̪t̪aːne"
        meaning: { en: "he gets up" }
        note: { en: "ಏಳು (ēḷu), to get up, the same word as seven" }
      - word: "ಮಾಡಿ"
        modern: "ಮಾಡಿ"
        reading: "māḍi"
        ipa: "maːɖi"
        meaning: { en: "having done; and then" }
        note: { en: "the verb in -ಇ (-i) joins two actions: ಸ್ನಾನ ಮಾಡಿ ತಿನ್ನುತ್ತಾನೆ (snāna māḍi tinnuttāne), he bathes and then eats" }
      - word: "ಮಾಡುತ್ತಾರೆ"
        modern: "ಮಾಡುತ್ತಾರೆ"
        reading: "māḍuttāre"
        ipa: "maːɖut̪t̪aːre"
        meaning: { en: "she makes" }
        note: { en: "the respectful plural, as for any mother" }
    questions:
      - id: kn-0590
        prompt: { en: "What does Ravi's mother make?" }
        options:
          - { en: "Dosa" }
          - { en: "Idli" }
          - { en: "Rice" }
        answer: 1
      - id: kn-0591
        prompt: { en: "Ravi has to go to work today." }
        answer: false
      - id: kn-0592
        prompt: { en: "Ravi gets up at six in the morning." }
        answer: true
  - id: kn-ravi-02
    title: "To the market"
    theme: transport
    sentences:
      - text: "ಅಮ್ಮ ಹೇಳುತ್ತಾರೆ, “ರವಿ, ಸಂತೆಗೆ ಹೋಗಿ ತರಕಾರಿ ತೆಗೆದುಕೊಂಡು ಬಾ.”"
        reading: "amma hēḷuttāre, 'ravi, santege hōgi tarakāri tegedukoṇḍu bā.'"
        ipa: "amma heːɭut̪t̪aːre raʋi sant̪eɡe hoːɡi t̪arakaːri t̪eɡed̪ukoɳɖu baː"
      - text: "ರವಿ ಬಸ್ಸಿನಲ್ಲಿ ಸಂತೆಗೆ ಹೋಗುತ್ತಾನೆ."
        reading: "ravi bassinalli santege hōguttāne."
        ipa: "raʋi bassinalli sant̪eɡe hoːɡut̪t̪aːne"
      - text: "ಬಸ್ಸಿನಲ್ಲಿ ತುಂಬಾ ಜನ ಇದ್ದಾರೆ."
        reading: "bassinalli tumbā jana iddāre."
        ipa: "bassinalli t̪umbaː dʒana id̪d̪aːre"
      - text: "ಅವನಿಗೆ ಸೀಟು ಸಿಗುವುದಿಲ್ಲ, ಅವನು ನಿಂತುಕೊಂಡೇ ಹೋಗುತ್ತಾನೆ."
        reading: "avanige sīṭu siguvudilla, avanu nintukoṇḍē hōguttāne."
        ipa: "aʋaniɡe siːʈu siɡuʋud̪illa aʋanu nint̪ukoɳɖeː hoːɡut̪t̪aːne"
    glossary:
      - word: "ಸಂತೆಗೆ"
        modern: "ಸಂತೆಗೆ"
        reading: "santege"
        ipa: "sant̪eɡe"
        meaning: { en: "to the weekly market" }
        note: { en: "ಸಂತೆ (sante) is an open-air market held on one day of the week" }
      - word: "ತೆಗೆದುಕೊಂಡು ಬಾ"
        modern: "ತೆಗೆದುಕೊಂಡು ಬಾ"
        reading: "tegedukoṇḍu bā"
        ipa: "t̪eɡed̪ukoɳɖu baː"
        meaning: { en: "fetch; buy and bring back" }
        note: { en: "'having taken, come'" }
      - word: "ಸಿಗುವುದಿಲ್ಲ"
        modern: "ಸಿಗುವುದಿಲ್ಲ"
        reading: "siguvudilla"
        ipa: "siɡuʋud̪illa"
        meaning: { en: "he doesn't get" }
        note: { en: "ಸಿಗು (sigu), to be got: ಅವನಿಗೆ ಸೀಟು ಸಿಗುತ್ತದೆ (avanige sīṭu siguttade), he gets a seat" }
      - word: "ನಿಂತುಕೊಂಡೇ"
        modern: "ನಿಂತುಕೊಂಡೇ"
        reading: "nintukoṇḍē"
        ipa: "nint̪ukoɳɖeː"
        meaning: { en: "standing all the way" }
        note: { en: "ನಿಂತುಕೊಳ್ಳು (nintukoḷḷu), to stand, with -ಏ (-ē), 'just so'" }
    questions:
      - id: kn-0593
        prompt: { en: "How does Ravi go to the market?" }
        options:
          - { en: "By bus" }
          - { en: "By auto" }
          - { en: "On foot" }
        answer: 1
      - id: kn-0594
        prompt: { en: "Ravi gets a seat on the bus." }
        answer: false
  - id: kn-ravi-03
    title: "Bargaining"
    theme: market
    sentences:
      - text: "ಸಂತೆಯಲ್ಲಿ ಒಬ್ಬರು ಅಜ್ಜಿ ಟೊಮೆಟೊ ಮಾರುತ್ತಿದ್ದಾರೆ."
        reading: "santeyalli obbaru ajji ṭomeṭo māruttiddāre."
        ipa: "sant̪ejalli obbaru adʒdʒi ʈomeʈo maːrut̪t̪id̪d̪aːre"
      - text: "“ಅಜ್ಜಿ, ಒಂದು ಕೆಜಿ ಟೊಮೆಟೊ ಎಷ್ಟು?”"
        reading: "'ajji, ondu keji ṭomeṭo eṣṭu?'"
        ipa: "adʒdʒi ond̪u kedʒi ʈomeʈo eʂʈu"
      - text: "“ನಲವತ್ತು ರೂಪಾಯಿ.”"
        reading: "'nalavattu rūpāyi.'"
        ipa: "nalaʋat̪t̪u ruːpaːji"
      - text: "“ತುಂಬಾ ಜಾಸ್ತಿ, ಸ್ವಲ್ಪ ಕಡಿಮೆ ಮಾಡಿ.”"
        reading: "'tumbā jāsti, svalpa kaḍime māḍi.'"
        ipa: "t̪umbaː dʒaːst̪i sʋalpa kaɖime maːɖi"
      - text: "ಅಜ್ಜಿ ನಗುತ್ತಾ ಹೇಳುತ್ತಾರೆ, “ಸರಿ ಮಗ, ಮೂವತ್ತು ಕೊಡು.”"
        reading: "ajji naguttā hēḷuttāre, 'sari maga, mūvattu koḍu.'"
        ipa: "adʒdʒi naɡut̪t̪aː heːɭut̪t̪aːre sari maɡa muːʋat̪t̪u koɖu"
      - text: "ರವಿ ಎರಡು ಕೆಜಿ ಟೊಮೆಟೊ ಮತ್ತು ಒಂದು ಕೆಜಿ ಈರುಳ್ಳಿ ತೆಗೆದುಕೊಳ್ಳುತ್ತಾನೆ."
        reading: "ravi eraḍu keji ṭomeṭo mattu ondu keji īruḷḷi tegedukoḷḷuttāne."
        ipa: "raʋi eraɖu kedʒi ʈomeʈo mat̪t̪u ond̪u kedʒi iːruɭɭi t̪eɡed̪ukoɭɭut̪t̪aːne"
    glossary:
      - word: "ಒಬ್ಬರು"
        modern: "ಒಬ್ಬರು"
        reading: "obbaru"
        ipa: "obbaru"
        meaning: { en: "one (person), said with respect" }
      - word: "ಮಾರುತ್ತಿದ್ದಾರೆ"
        modern: "ಮಾರುತ್ತಿದ್ದಾರೆ"
        reading: "māruttiddāre"
        ipa: "maːrut̪t̪id̪d̪aːre"
        meaning: { en: "is selling" }
        note: { en: "ಮಾರು (māru), to sell, in the respectful plural" }
      - word: "ನಗುತ್ತಾ"
        modern: "ನಗುತ್ತಾ"
        reading: "naguttā"
        ipa: "naɡut̪t̪aː"
        meaning: { en: "laughing; with a smile" }
        note: { en: "-ಉತ್ತಾ (-uttā), while doing" }
      - word: "ಮಗ"
        modern: "ಮಗ"
        reading: "maga"
        ipa: "maɡa"
        meaning: { en: "son; here, how an older person kindly calls a young man" }
    questions:
      - id: kn-0595
        prompt: { en: "What price does the grandmother first ask for a kilo of tomatoes?" }
        options:
          - { en: "Forty rupees" }
          - { en: "Thirty rupees" }
          - { en: "Twenty rupees" }
        answer: 1
      - id: kn-0596
        prompt: { en: "What else does Ravi buy?" }
        options:
          - { en: "Onions" }
          - { en: "Potatoes" }
          - { en: "Fish" }
        answer: 1
      - id: kn-0597
        prompt: { en: "In the end she sells the tomatoes for thirty rupees a kilo." }
        answer: true
  - id: kn-ravi-04
    title: "Home again"
    theme: family
    sentences:
      - text: "ರವಿ ಮನೆಗೆ ಬಂದಾಗ ಅಮ್ಮ ಕೇಳುತ್ತಾರೆ, “ಎಷ್ಟು ಆಯಿತು?”"
        reading: "ravi manege bandāga amma kēḷuttāre, 'eṣṭu āyitu?'"
        ipa: "raʋi maneɡe band̪aːɡa amma keːɭut̪t̪aːre eʂʈu aːjit̪u"
      - text: "“ಟೊಮೆಟೊಗೆ ಅರವತ್ತು, ಈರುಳ್ಳಿಗೆ ಮೂವತ್ತು.”"
        reading: "'ṭomeṭoge aravattu, īruḷḷige mūvattu.'"
        ipa: "ʈomeʈoɡe araʋat̪t̪u iːruɭɭiɡe muːʋat̪t̪u"
      - text: "ಅಮ್ಮನಿಗೆ ತುಂಬಾ ಖುಷಿ ಆಗುತ್ತದೆ."
        reading: "ammanige tumbā khuṣi āguttade."
        ipa: "ammaniɡe t̪umbaː kʰuʂi aːɡut̪t̪ad̪e"
      - text: "“ಚೆನ್ನಾಗಿ ಚೌಕಾಸಿ ಮಾಡಿದೆ!”"
        reading: "'cennāgi caukāsi māḍide!'"
        ipa: "tʃennaːɡi tʃaukaːsi maːɖid̪e"
      - text: "ರಾತ್ರಿ ಎಲ್ಲರೂ ಒಟ್ಟಿಗೆ ಊಟ ಮಾಡುತ್ತಾರೆ."
        reading: "rātri ellarū oṭṭige ūṭa māḍuttāre."
        ipa: "raːt̪ri ellaruː oʈʈiɡe uːʈa maːɖut̪t̪aːre"
    glossary:
      - word: "ಬಂದಾಗ"
        modern: "ಬಂದಾಗ"
        reading: "bandāga"
        ipa: "band̪aːɡa"
        meaning: { en: "when (he) came" }
        note: { en: "-ಆಗ (-āga), when" }
      - word: "ಆಯಿತು"
        modern: "ಆಯಿತು"
        reading: "āyitu"
        ipa: "aːjit̪u"
        meaning: { en: "it came to; it became" }
        note: { en: "in speech ಆಯ್ತು (āytu): ಎಷ್ಟು ಆಯ್ತು (eṣṭu āytu)?, how much did it come to?" }
      - word: "ಖುಷಿ"
        modern: "ಖುಷಿ"
        reading: "khuṣi"
        ipa: "kʰuʂi"
        meaning: { en: "happiness; pleased" }
        note: { en: "ಅಮ್ಮನಿಗೆ ಖುಷಿ ಆಗುತ್ತದೆ (ammanige khuṣi āguttade): 'to mother happiness comes'" }
      - word: "ಚೌಕಾಸಿ"
        modern: "ಚೌಕಾಸಿ"
        reading: "caukāsi"
        ipa: "tʃaukaːsi"
        meaning: { en: "bargaining" }
      - word: "ಒಟ್ಟಿಗೆ"
        modern: "ಒಟ್ಟಿಗೆ"
        reading: "oṭṭige"
        ipa: "oʈʈiɡe"
        meaning: { en: "together" }
    questions:
      - id: kn-0598
        prompt: { en: "How much did Ravi spend in all?" }
        options:
          - { en: "Ninety rupees" }
          - { en: "Sixty rupees" }
          - { en: "A hundred rupees" }
        answer: 1
      - id: kn-0599
        prompt: { en: "His mother is cross that he paid too much." }
        answer: false
