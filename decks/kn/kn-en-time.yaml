schema: 1
id: kn-en-time
name: "Time and days"
kind: vocab
theme: time
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Today and tomorrow, telling the time, and the days of the week. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: kn-0413
    target: "ಇವತ್ತು"
    native: "today"
    reading: "ivattu"
    alt_target: ["ಇಂದು"]
    pos: "other"
    notes: "Written also ಇಂದು (indu)."
  - id: kn-0414
    target: "ನಾಳೆ"
    native: "tomorrow"
    reading: "nale"
    pos: "other"
  - id: kn-0415
    target: "ನಿನ್ನೆ"
    native: "yesterday"
    reading: "ninne"
    pos: "other"
  - id: kn-0416
    target: "ಈಗ"
    native: "now"
    reading: "iga"
    pos: "other"
  - id: kn-0417
    target: "ಬೆಳಿಗ್ಗೆ"
    native: "morning; in the morning"
    reading: "beligge"
    alt_target: ["ಬೆಳಗ್ಗೆ"]
    pos: "other"
  - id: kn-0418
    target: "ಸಂಜೆ"
    native: "evening"
    reading: "sanje"
    pos: "other"
  - id: kn-0419
    target: "ರಾತ್ರಿ"
    native: "night"
    reading: "ratri"
    pos: "other"
  - id: kn-0420
    target: "ಗಂಟೆ"
    native: "o'clock; hours; a bell"
    reading: "gante"
    pos: "noun"
    notes: "ಐದು ಗಂಟೆ (aidu gante), five o'clock; ಐದು ಗಂಟೆಗೆ, at five."
  - id: kn-0421
    target: "ನಾಲ್ಕೂವರೆ"
    native: "half past four; 4½"
    reading: "nalkuvare"
    pos: "other"
    notes: "Half past is the number with -ಊವರೆ: ನಾಲ್ಕೂವರೆ ಗಂಟೆ, half past four."
  - id: kn-0422
    target: "ಈಗ ಎಷ್ಟು ಗಂಟೆ?"
    native: "What time is it?"
    reading: "iga eshtu gante?"
    alt_target: ["ಟೈಮ್ ಎಷ್ಟು?"]
    pos: "phrase"
    notes: "Many simply ask ಟೈಮ್ ಎಷ್ಟು? (taim eshtu?)."
  - id: kn-0423
    target: "ದಿನ"
    native: "day"
    reading: "dina"
    pos: "noun"
  - id: kn-0424
    target: "ವಾರ"
    native: "week"
    reading: "vara"
    pos: "noun"
    notes: "Each weekday is a name and ವಾರ: ಸೋಮ + ವಾರ, Monday."
  - id: kn-0425
    target: "ಸೋಮವಾರ"
    native: "Monday"
    reading: "somavara"
    pos: "noun"
    notes: "ಸೋಮ, the moon."
  - id: kn-0426
    target: "ಮಂಗಳವಾರ"
    native: "Tuesday"
    reading: "mangalavara"
    pos: "noun"
    notes: "ಮಂಗಳ, Mars."
  - id: kn-0427
    target: "ಬುಧವಾರ"
    native: "Wednesday"
    reading: "budhavara"
    pos: "noun"
    notes: "ಬುಧ, Mercury."
  - id: kn-0428
    target: "ಗುರುವಾರ"
    native: "Thursday"
    reading: "guruvara"
    pos: "noun"
    notes: "ಗುರು, Jupiter."
  - id: kn-0429
    target: "ಶುಕ್ರವಾರ"
    native: "Friday"
    reading: "shukravara"
    pos: "noun"
    notes: "ಶುಕ್ರ, Venus."
  - id: kn-0430
    target: "ಶನಿವಾರ"
    native: "Saturday"
    reading: "shanivara"
    pos: "noun"
    notes: "ಶನಿ, Saturn."
  - id: kn-0431
    target: "ಭಾನುವಾರ"
    native: "Sunday"
    reading: "bhanuvara"
    alt_target: ["ರವಿವಾರ"]
    pos: "noun"
    notes: "ಭಾನು, the sun. Also ರವಿವಾರ (ravivara)."
