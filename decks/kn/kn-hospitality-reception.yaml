cards:
  - id: "kn-6540"
    target: "ನನ್ನ ಹೆಸರಿನಲ್ಲಿ ಕೊಠಡಿ ಕಾಯ್ದಿರಿಸಿದ್ದೇನೆ."
    reading: "nanna hesarinalli koṭhaḍi kāydirisiddēne."
    ipa: "nanna hesarinalli koʈʰaɖi kaːjd̪irisid̪d̪eːne"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
    notes: [{ id: "n1", kind: "usage" }]
  - id: "kn-6541"
    target: "ಎರಡು ರಾತ್ರಿಗೆ ಕೊಠಡಿ ಖಾಲಿ ಇದೆಯೇ?"
    reading: "eraḍu rātrige koṭhaḍi khāli ideyē?"
    ipa: "eraɖu raːt̪riɡe koʈʰaɖi kʰaːli id̪ejeː"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
  - id: "kn-6542"
    target: "ಒಂದು ದಿನಕ್ಕೆ ಬಾಡಿಗೆ ಎಷ್ಟು?"
    reading: "ondu dinakke bāḍige eṣṭu?"
    ipa: "ond̪u d̪inakke baːɖiɡe eʂʈu"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
  - id: "kn-6543"
    target: "ಬೆಳಗಿನ ಉಪಾಹಾರ ಎಷ್ಟು ಗಂಟೆಗೆ?"
    reading: "beḷagina upāhāra eṣṭu gaṇṭege?"
    ipa: "beɭaɡina upaːhaːra eʂʈu ɡaɳʈeɡe"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
    notes: [{ id: "n1", kind: "usage" }]
  - id: "kn-6544"
    target: "ಕೊಠಡಿಯಲ್ಲಿ ವೈಫೈ ಇದೆಯೇ?"
    reading: "koṭhaḍiyalli vaiphai ideyē?"
    ipa: "koʈʰaɖijalli ʋaipʰai id̪ejeː"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
    notes: [{ id: "n1", kind: "usage" }]
  - id: "kn-6545"
    target: "ನಿಮ್ಮ ಕೊಠಡಿ ಎರಡನೇ ಮಹಡಿಯಲ್ಲಿ ಇದೆ."
    reading: "nimma koṭhaḍi eraḍanē mahaḍiyalli ide."
    ipa: "nimma koʈʰaɖi eraɖaneː mahaɖijalli id̪e"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
  - id: "kn-6546"
    target: "ಚೆಕ್ ಔಟ್ ಸಮಯ ಹನ್ನೆರಡು ಗಂಟೆ."
    reading: "cek auṭ samaya hanneraḍu gaṇṭe."
    ipa: "tʃek auʈ samaja hanneraɖu ɡaɳʈe"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
  - id: "kn-6547"
    target: "ನಮ್ಮ ಲಗೇಜ್ ಇಲ್ಲಿ ಇಡಬಹುದೇ?"
    reading: "namma lagēj illi iḍabahudē?"
    ipa: "namma laɡeːdʒ illi iɖabahud̪eː"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
  - id: "kn-6548"
    target: "ದಯವಿಟ್ಟು ಒಂದು ಟ್ಯಾಕ್ಸಿ ಕರೆಯಿರಿ."
    reading: "dayaviṭṭu ondu ṭyāksi kareyiri."
    ipa: "d̪ajaʋiʈʈu ond̪u ʈjaːksi karejiri"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
    notes: [{ id: "n1", kind: "usage" }]
