schema: 1
id: kn-en-script-consonants
name: "Kannada consonants"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Every consonant a beginner meets, each carrying its vowel a: the plain and breathy ones, the ones on the teeth and curled back, and the two l's. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: kn-0014
    target: "ಕ"
    native: "k (ka)"
    reading: "ka"
    notes: "Like the 'k' of 'skin', with no puff of breath. Every consonant carries the short a (ಅ) unless a sign changes it. ಕಾಲು (kaalu, leg)."
  - id: kn-0015
    target: "ಖ"
    native: "kh, with a breath (kha)"
    reading: "kha"
    notes: "ಕ with a puff of breath after it, mostly in words from Sanskrit and Hindi: ಖರ್ಚು (kharchu, expense)."
  - id: kn-0016
    target: "ಗ"
    native: "g (ga)"
    reading: "ga"
    notes: "Like the 'g' of 'go': ಗಾಳಿ (gaali, wind)."
  - id: kn-0017
    target: "ಘ"
    native: "gh, with a breath (gha)"
    reading: "gha"
    notes: "ಗ with a breath after it, mostly in words from Sanskrit: ಮೇಘ (meegha, cloud)."
  - id: kn-0018
    target: "ಙ"
    native: "ng (as in 'sing')"
    reading: "nga"
    modes: [recognition, production]
    notes: "Rare today: Kannada writes the circle ಂ in its place, as in ಗಂಗೆ (gange, the Ganges). Hardly ever heard on its own, so it is drilled by reading and writing only."
  - id: kn-0019
    target: "ಚ"
    native: "ch (cha)"
    reading: "cha"
    notes: "Like the 'ch' of 'church', with no puff of breath: ಚಮಚ (chamacha, spoon)."
  - id: kn-0020
    target: "ಛ"
    native: "chh, with a breath (chha)"
    reading: "chha"
    notes: "ಚ with a breath after it, in a few words: ಛತ್ರಿ (chhatri, umbrella)."
  - id: kn-0021
    target: "ಜ"
    native: "j (ja)"
    reading: "ja"
    notes: "Like the 'j' of 'judge': ಜನ (jana, people)."
  - id: kn-0022
    target: "ಝ"
    native: "jh, with a breath (jha)"
    reading: "jha"
    notes: "ಜ with a breath after it, in a few words: ಝರಿ (jhari, a stream)."
  - id: kn-0023
    target: "ಞ"
    native: "ny (in conjuncts)"
    reading: "nya"
    modes: [recognition, production]
    notes: "Seen almost only in ಜ್ಞ, as in ಜ್ಞಾನ (jnaana, knowledge). Hardly ever heard on its own, so it is drilled by reading and writing only."
  - id: kn-0024
    target: "ಟ"
    native: "t, curled back (ta)"
    reading: "ta"
    notes: "The tongue tip curls back to touch the roof of the mouth: retroflex. English 't' is close to this. Compare ತ: ಕೋಟೆ (koote, fort)."
  - id: kn-0025
    target: "ಠ"
    native: "th, curled back, with a breath (tha)"
    reading: "tha"
    notes: "ಟ with a breath after it, in words from Sanskrit: ಪಾಠ (paatha, lesson)."
  - id: kn-0026
    target: "ಡ"
    native: "d, curled back (da)"
    reading: "da"
    notes: "The tongue tip curls back, as for ಟ. English 'd' is close to this. Compare ದ: ಡಬ್ಬ (dabba, tin; box)."
  - id: kn-0027
    target: "ಢ"
    native: "dh, curled back, with a breath (dha)"
    reading: "dha"
    notes: "ಡ with a breath after it, in a few words from Sanskrit."
  - id: kn-0028
    target: "ಣ"
    native: "n, curled back (na)"
    reading: "na"
    notes: "The tongue tip curls back, as for ಟ: ಹಣ (hana, money). Compare ನ, on the teeth."
  - id: kn-0029
    target: "ತ"
    native: "t, on the teeth (ta)"
    reading: "ta"
    notes: "The tongue touches the back of the upper teeth: dental. English has no such t; it sounds softer. Compare ಟ: ತಲೆ (tale, head)."
  - id: kn-0030
    target: "ಥ"
    native: "th, on the teeth, with a breath (tha)"
    reading: "tha"
    notes: "ತ with a breath after it. Not the 'th' of 'thin': ಕಥೆ (kathe, story)."
  - id: kn-0031
    target: "ದ"
    native: "d, on the teeth (da)"
    reading: "da"
    notes: "The tongue touches the back of the upper teeth, as for ತ. Compare ಡ: ದಾರಿ (daari, way)."
  - id: kn-0032
    target: "ಧ"
    native: "dh, on the teeth, with a breath (dha)"
    reading: "dha"
    notes: "ದ with a breath after it, in words from Sanskrit: ಧನ್ಯವಾದ (dhanyavaada, thanks)."
  - id: kn-0033
    target: "ನ"
    native: "n, on the teeth (na)"
    reading: "na"
    notes: "Like the 'n' of 'no', with the tongue on the teeth: ನೀರು (niiru, water)."
  - id: kn-0034
    target: "ಪ"
    native: "p (pa)"
    reading: "pa"
    notes: "Like the 'p' of 'spin', with no puff of breath: ಪುಸ್ತಕ (pustaka, book)."
  - id: kn-0035
    target: "ಫ"
    native: "ph, with a breath (pha)"
    reading: "pha"
    notes: "ಪ with a breath after it, in words from Sanskrit: ಫಲ (phala, fruit; result). In words from English most people say f: ಫೋನ್ (foon, phone)."
  - id: kn-0036
    target: "ಬ"
    native: "b (ba)"
    reading: "ba"
    notes: "Like the 'b' of 'bat': ಬಾಗಿಲು (baagilu, door)."
  - id: kn-0037
    target: "ಭ"
    native: "bh, with a breath (bha)"
    reading: "bha"
    notes: "ಬ with a breath after it, in words from Sanskrit: ಭಯ (bhaya, fear)."
  - id: kn-0038
    target: "ಮ"
    native: "m (ma)"
    reading: "ma"
    notes: "Like the 'm' of 'man': ಮನೆ (mane, house)."
  - id: kn-0039
    target: "ಯ"
    native: "y (ya)"
    reading: "ya"
    notes: "Like the 'y' of 'yes': ಯಾರು (yaaru, who)."
  - id: kn-0040
    target: "ರ"
    native: "r (ra)"
    reading: "ra"
    notes: "A light tap of the tongue, never silent as in southern English: ರಸ್ತೆ (raste, road)."
  - id: kn-0041
    target: "ಲ"
    native: "l (la)"
    reading: "la"
    notes: "Like the 'l' of 'leaf', with the tongue on the teeth: ಲೋಟ (loota, a tumbler)."
  - id: kn-0042
    target: "ವ"
    native: "v or w (va)"
    reading: "va"
    notes: "Between English 'v' and 'w': ವಾರ (vaara, week)."
  - id: kn-0043
    target: "ಶ"
    native: "sh (sha)"
    reading: "sha"
    notes: "The 'sh' of 'shop': ಶನಿವಾರ (shanivaara, Saturday)."
  - id: kn-0044
    target: "ಷ"
    native: "sh, curled back (sha)"
    reading: "sha"
    modes: [recognition, production]
    notes: "Said with the tongue curled back in careful speech, in words from Sanskrit: ಭಾಷೆ (bhaashe, language). It sounds just like ಶ in everyday speech, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: kn-0045
    target: "ಸ"
    native: "s (sa)"
    reading: "sa"
    notes: "The 's' of 'sun'. Unlike ಶ, never 'sh': ಸಮಯ (samaya, time)."
  - id: kn-0046
    target: "ಹ"
    native: "h (ha)"
    reading: "ha"
    notes: "Like the 'h' of 'hat': ಹಾಲು (haalu, milk)."
  - id: kn-0047
    target: "ಳ"
    native: "l, curled back (la)"
    reading: "la"
    notes: "The tongue tip curls back for this l, unlike ಲ: ಕಳ್ಳ (kalla, thief). Kannada tells them apart: ಹಾಲು (haalu) is milk, but ಹಾಳು (haalu) is ruined."
