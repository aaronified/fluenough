schema: 1
id: kn-en-grammar-differences
name: "How Kannada grammar differs from English"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Before any theme: the verb last, no is, endings for in and to, a verb that tells a man from a woman and a thing, two yous, no articles, and how Kannada says have, know, not and questions. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: kn-0124
    target: "ನಾನು ಅನ್ನ ತಿನ್ನುತ್ತೇನೆ."
    native: "I eat rice."
    reading: "naanu anna tinnutteene."
    alt_target: ["ನಾನು ಅನ್ನ ತಿಂತೀನಿ."]
    tags: ["grammar", "word-order"]
    notes: "The verb comes last: subject, object, verb. Word for word, 'I rice eat'. In everyday speech, ತಿಂತೀನಿ (tintiini)."
  - id: kn-0125
    target: "ಅವರು ಡಾಕ್ಟರ್."
    native: "He is a doctor. (respectful)"
    reading: "avaru daaktar."
    tags: ["grammar", "no-is"]
    notes: "No 'is' when you say what someone is: 'he doctor'. ಅವರು is 'he' or 'she' said with respect, and 'they'."
  - id: kn-0126
    target: "ಕೋಣೆಯಲ್ಲಿ"
    native: "in the room"
    reading: "kooneyalli"
    tags: ["grammar", "case-endings"]
    notes: "Kannada puts 'in' after the noun, as an ending: ಕೋಣೆ (koone, room) + -ಅಲ್ಲಿ, joined by a y."
  - id: kn-0127
    target: "ಶಾಲೆಗೆ"
    native: "to school"
    reading: "shaalege"
    tags: ["grammar", "case-endings"]
    notes: "'To' is the ending -ಗೆ: ಶಾಲೆ (shaale, school) + -ಗೆ. A noun ending in a takes -ಕ್ಕೆ: ಊಟಕ್ಕೆ (uutakke), to the meal."
  - id: kn-0128
    target: "ಅಮ್ಮನ ಜೊತೆ"
    native: "with mother"
    reading: "ammana jote"
    tags: ["grammar", "case-endings"]
    notes: "'With' is ಜೊತೆ, a word after the noun, and the noun takes -ಅ, 'of': 'mother's company'."
  - id: kn-0129
    target: "ಅವನು ಬಂದನು."
    native: "He came."
    reading: "avanu bandanu."
    alt_target: ["ಅವನು ಬಂದ."]
    tags: ["grammar", "gender"]
    notes: "The verb shows that 'he' is a man: -ಅನು. Speech drops the -ನು: ಅವನು ಬಂದ."
  - id: kn-0130
    target: "ಅವಳು ಬಂದಳು."
    native: "She came."
    reading: "avalu bandalu."
    tags: ["grammar", "gender"]
    notes: "A woman has an ending of her own, -ಅಳು."
  - id: kn-0131
    target: "ಅದು ಬಂತು."
    native: "It came."
    reading: "adu bantu."
    alt_target: ["ಅದು ಬಂದಿತು."]
    tags: ["grammar", "gender"]
    notes: "A thing or an animal takes -ತು. Unlike Telugu, Kannada never gives a woman the ending of a thing."
  - id: kn-0132
    target: "ನೀನು ಬಾ."
    native: "Come! (to a friend)"
    reading: "niinu baa."
    tags: ["grammar", "two-yous"]
    notes: "Two words for 'you': ನೀನು to a friend, a child or a younger person."
  - id: kn-0133
    target: "ನೀವು ಬನ್ನಿ."
    native: "Please come."
    reading: "niivu banni."
    tags: ["grammar", "two-yous"]
    notes: "ನೀವು is the respectful 'you', and the plural, and its request ends in -ಇ: ಬನ್ನಿ, ಕೊಡಿ, ಹೇಳಿ."
  - id: kn-0134
    target: "ಬರುತ್ತೇನೆ."
    native: "I'll come."
    reading: "barutteene."
    alt_target: ["ಬರ್ತೀನಿ."]
    tags: ["grammar", "person-endings"]
    notes: "The ending -ಏನೆ says 'I', so ನಾನು can be left out. In speech, ಬರ್ತೀನಿ (bartiini)."
  - id: kn-0135
    target: "ಒಂದು ಪುಸ್ತಕ"
    native: "a book; one book"
    reading: "ondu pustaka"
    tags: ["grammar", "articles"]
    notes: "No word for 'the', and ಒಂದು, 'one', serves for 'a'."
  - id: kn-0136
    target: "ನನ್ನ ಹತ್ತಿರ ಪುಸ್ತಕ ಇದೆ."
    native: "I have a book."
    reading: "nanna hattira pustaka ide."
    tags: ["grammar", "have"]
    notes: "No verb 'have': 'near me a book is'."
  - id: kn-0137
    target: "ನನಗೆ ಕನ್ನಡ ಬರುತ್ತದೆ."
    native: "I know Kannada."
    reading: "nanage kannada baruttade."
    alt_target: ["ನಂಗೆ ಕನ್ನಡ ಬರುತ್ತೆ."]
    tags: ["grammar", "to-me"]
    notes: "'Kannada comes to me': the one who knows takes -ಗೆ, 'to'. So too ನನಗೆ ಗೊತ್ತು (nanage gottu), I know (it)."
  - id: kn-0138
    target: "ನಾನು ಬರುವುದಿಲ್ಲ."
    native: "I won't come."
    reading: "naanu baruvudilla."
    alt_target: ["ನಾನು ಬರಲ್ಲ."]
    tags: ["grammar", "negation"]
    notes: "'Not' is ಇಲ್ಲ after the verb, the same for every person: ಅವಳು ಬರುವುದಿಲ್ಲ, she won't come. In speech, ಬರಲ್ಲ (baralla)."
  - id: kn-0139
    target: "ಸಮಯ ಇಲ್ಲ."
    native: "There's no time."
    reading: "samaya illa."
    tags: ["grammar", "negation"]
    notes: "ಇಲ್ಲ is 'there is not', the opposite of ಇದೆ, 'there is'."
  - id: kn-0140
    target: "ನಾನು ಡಾಕ್ಟರ್ ಅಲ್ಲ."
    native: "I'm not a doctor."
    reading: "naanu daaktar alla."
    tags: ["grammar", "negation"]
    notes: "A second 'not', ಅಲ್ಲ, says what someone or something is not. ಇಲ್ಲ says something isn't there."
  - id: kn-0141
    target: "ನೀವು ಬರುತ್ತೀರಾ?"
    native: "Will you come?"
    reading: "niivu baruttiiraa?"
    alt_target: ["ನೀವು ಬರ್ತೀರಾ?"]
    tags: ["grammar", "questions"]
    notes: "A yes-or-no question ends in -ಆ: ನೀವು ಬರುತ್ತೀರಿ (you will come) becomes ನೀವು ಬರುತ್ತೀರಾ?, the last i turned into aa."
