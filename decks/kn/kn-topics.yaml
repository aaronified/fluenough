    summary: { en: "The vowel signs, the marks written around a consonant to change its vowel, such as the sign for a long a in kā, and the consonant with the halanta mark that has no vowel." }
    kind: "script"
    level: "A1"
    decks: ["kn-script-vowel-signs"]
    chars: ["ಕಾ", "ಕಿ", "ಕೀ", "ಕು", "ಕೂ", "ಕೃ", "ಕೆ", "ಕೇ", "ಕೈ", "ಕೊ", "ಕೋ", "ಕೌ", "ಕಂ", "ಕ್", "ಮಾ", "ಮಿ", "ಮೀ", "ಮು", "ಮೂ", "ಮೆ", "ಮೇ", "ಮೊ", "ಮೋ"]
