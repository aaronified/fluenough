# Topics a learner of Kannada would search for: what each one is, and the decks that teach it (wiki/Plan-Deck-Kinds-And-Topics.md, D6).
# A script topic lists its characters; a topic holds no card text of its own.
schema: 1
kind: "topics"
id: "kn-topics"
language: "kn"
license: "CC-BY-SA-4.0"
topics:
  - id: "kn-vowels-script"
    name: { en: "Kannada vowels" }
    summary: { en: "The Kannada vowel letters, written on their own, from the short a to the long vowels, including the vocalic r and the diphthongs ai and au." }
    kind: "script"
    level: "A1"
    decks: ["kn-script-vowels"]
    chars: ["ಅ", "ಆ", "ಇ", "ಈ", "ಉ", "ಊ", "ಋ", "ಎ", "ಏ", "ಐ", "ಒ", "ಓ", "ಔ"]
  - id: "kn-consonants-script"
    name: { en: "Kannada consonants" }
    summary: { en: "The Kannada consonant letters, each written with the a vowel built in, in their groups from ka to la, including the retroflex letters and the nasals." }
    kind: "script"
    level: "A1"
    decks: ["kn-script-consonants"]
    chars: ["ಕ", "ಖ", "ಗ", "ಘ", "ಙ", "ಚ", "ಛ", "ಜ", "ಝ", "ಞ", "ಟ", "ಠ", "ಡ", "ಢ", "ಣ", "ತ", "ಥ", "ದ", "ಧ", "ನ", "ಪ", "ಫ", "ಬ", "ಭ", "ಮ", "ಯ", "ರ", "ಲ", "ವ", "ಶ", "ಷ", "ಸ", "ಹ", "ಳ"]
