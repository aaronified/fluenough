schema: 1
id: kn-en-grammar-pronouns
name: "Pronouns and possessives"
kind: grammar
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN, icon: "ಕ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I, you, he and she, with my and your, to me, and me as an object. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Personal pronouns"
  slot_name: "form"
  slots: ["possessive: my, your …", "to: to me …", "object: me …"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Kannada has one 'we', ನಾವು (nāvu), and two 'you': ನೀನು (nīnu) to a friend or a child, ನೀವು (nīvu) to anyone you respect and to more than one. ಅವರು (avaru) is 'they', and 'he' or 'she' with respect. In speech ನನಗೆ (nanage) is often ನಂಗೆ (naṅge), and the object ending -ಅನ್ನು (-annu) is often dropped: ನನ್ನ (nanna), me."
  entries:
    - lemma: "ನಾನು"
      key: naanu
      reading: "nānu"
      ipa: "naːnu"
      gloss: "I"
      forms:
        "possessive: my, your …": ["ನನ್ನ"]
        "to: to me …": ["ನನಗೆ", "ನಂಗೆ"]
        "object: me …": ["ನನ್ನನ್ನು", "ನನ್ನ"]
      readings:
        "possessive: my, your …": ["nanna"]
        "to: to me …": ["nanage", "naṅge"]
        "object: me …": ["nannannu", "nanna"]
      ipas:
        "possessive: my, your …": "nanna"
        "to: to me …": "nanaɡe"
        "object: me …": "nannannu"
    - lemma: "ನೀನು"
      key: niinu
      reading: "nīnu"
      ipa: "niːnu"
      gloss: "you, familiar"
      forms:
        "possessive: my, your …": ["ನಿನ್ನ"]
        "to: to me …": ["ನಿನಗೆ", "ನಿಂಗೆ"]
        "object: me …": ["ನಿನ್ನನ್ನು", "ನಿನ್ನ"]
      readings:
        "possessive: my, your …": ["ninna"]
        "to: to me …": ["ninage", "niṅge"]
        "object: me …": ["ninnannu", "ninna"]
      ipas:
        "possessive: my, your …": "ninna"
        "to: to me …": "ninaɡe"
        "object: me …": "ninnannu"
    - lemma: "ನೀವು"
      key: niivu
      reading: "nīvu"
      ipa: "niːʋu"
      gloss: "you, respectful or plural"
      forms:
        "possessive: my, your …": ["ನಿಮ್ಮ"]
        "to: to me …": ["ನಿಮಗೆ", "ನಿಮ್ಗೆ"]
        "object: me …": ["ನಿಮ್ಮನ್ನು", "ನಿಮ್ಮ"]
      readings:
        "possessive: my, your …": ["nimma"]
        "to: to me …": ["nimage", "nimge"]
        "object: me …": ["nimmannu", "nimma"]
      ipas:
        "possessive: my, your …": "nimma"
        "to: to me …": "nimaɡe"
        "object: me …": "nimmannu"
    - lemma: "ಅವನು"
      key: avanu
      reading: "avanu"
      ipa: "aʋanu"
      gloss: "he"
      forms:
        "possessive: my, your …": ["ಅವನ"]
        "to: to me …": ["ಅವನಿಗೆ"]
        "object: me …": ["ಅವನನ್ನು"]
      readings:
        "possessive: my, your …": ["avana"]
        "to: to me …": ["avanige"]
        "object: me …": ["avanannu"]
      ipas:
        "possessive: my, your …": "aʋana"
        "to: to me …": "aʋaniɡe"
        "object: me …": "aʋanannu"
    - lemma: "ಅವಳು"
      key: avalu
      reading: "avaḷu"
      ipa: "aʋaɭu"
      gloss: "she"
      forms:
        "possessive: my, your …": ["ಅವಳ"]
        "to: to me …": ["ಅವಳಿಗೆ"]
        "object: me …": ["ಅವಳನ್ನು"]
      readings:
        "possessive: my, your …": ["avaḷa"]
        "to: to me …": ["avaḷige"]
        "object: me …": ["avaḷannu"]
      ipas:
        "possessive: my, your …": "aʋaɭa"
        "to: to me …": "aʋaɭiɡe"
        "object: me …": "aʋaɭannu"
    - lemma: "ಅದು"
      key: adu
      reading: "adu"
      ipa: "ad̪u"
      gloss: "it"
      forms:
        "possessive: my, your …": ["ಅದರ"]
        "to: to me …": ["ಅದಕ್ಕೆ"]
        "object: me …": ["ಅದನ್ನು"]
      readings:
        "possessive: my, your …": ["adara"]
        "to: to me …": ["adakke"]
        "object: me …": ["adannu"]
      ipas:
        "possessive: my, your …": "ad̪ara"
        "to: to me …": "ad̪akke"
        "object: me …": "ad̪annu"
    - lemma: "ನಾವು"
      key: naavu
      reading: "nāvu"
      ipa: "naːʋu"
      gloss: "we"
      forms:
        "possessive: my, your …": ["ನಮ್ಮ"]
        "to: to me …": ["ನಮಗೆ", "ನಮ್ಗೆ"]
        "object: me …": ["ನಮ್ಮನ್ನು"]
      readings:
        "possessive: my, your …": ["namma"]
        "to: to me …": ["namage", "namge"]
        "object: me …": ["nammannu"]
      ipas:
        "possessive: my, your …": "namma"
        "to: to me …": "namaɡe"
        "object: me …": "nammannu"
    - lemma: "ಅವರು"
      key: avaru
      reading: "avaru"
      ipa: "aʋaru"
      gloss: "they; he or she, respectful"
      forms:
        "possessive: my, your …": ["ಅವರ"]
        "to: to me …": ["ಅವರಿಗೆ"]
        "object: me …": ["ಅವರನ್ನು"]
      readings:
        "possessive: my, your …": ["avara"]
        "to: to me …": ["avarige"]
        "object: me …": ["avarannu"]
      ipas:
        "possessive: my, your …": "aʋara"
        "to: to me …": "aʋariɡe"
        "object: me …": "aʋarannu"
