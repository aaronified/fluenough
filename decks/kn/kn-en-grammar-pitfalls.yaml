description: "The mistakes English speakers make most in Kannada. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: kn-0534
    target: "ನಾವು ಹೋಗೋಣ."
    native: "Let's go."
    reading: "nāvu hōgōṇa."
    ipa: "naːʋu hoːɡoːɳa"
    pos: "phrase"
    notes: "Kannada has one 'we', ನಾವು (nāvu), with or without the listener, where Telugu and Tamil have two. -ಓಣ (-ōṇa), 'let's', hardly needs it: ಹೋಗೋಣ (hōgōṇa)."
  - id: kn-0535
    target: "ಇದು ನೀರು ಅಲ್ಲ."
    native: "This isn't water."
    reading: "idu nīru alla."
    ipa: "id̪u niːru alla"
    pos: "phrase"
    notes: "ಅಲ್ಲ (alla): it is not that. Not ಇಲ್ಲ (illa)."
  - id: kn-0536
    target: "ನೀರು ಇಲ್ಲ."
    native: "There's no water."
    reading: "nīru illa."
    ipa: "niːru illa"
    pos: "phrase"
    notes: "ಇಲ್ಲ (illa): there isn't any. Not ಅಲ್ಲ (alla)."
  - id: kn-0537
    target: "ನನಗೆ ಹಸಿವಾಗಿದೆ."
    native: "I'm hungry."
    reading: "nanage hasivāgide."
    ipa: "nanaɡe hasiʋaːɡid̪e"
    alt_target: ["ನಂಗೆ ಹಸಿವಾಗಿದೆ."]
    pos: "phrase"
    notes: "'To me hunger has come': ನನಗೆ (nanage), not ನಾನು (nānu)."
  - id: kn-0538
    target: "ನಾನು ಹೋಗಬೇಕು."
    native: "I have to go."
    reading: "nānu hōgabēku."
    ipa: "naːnu hoːɡabeːku"
    pos: "phrase"
    notes: "-ಬೇಕು (-bēku) on the verb: must."
  - id: kn-0539
    target: "ನೀವು ಕುಳಿತುಕೊಳ್ಳಿ."
    native: "Please sit down."
    reading: "nīvu kuḷitukoḷḷi."
    ipa: "niːʋu kuɭit̪ukoɭɭi"
    alt_target: ["ಕುಳಿತುಕೊಳ್ಳಿ.", "ಕೂತ್ಕೊಳ್ಳಿ."]
    pos: "phrase"
    notes: "A request to someone you respect ends in -ಇ (-i). ಕುಳಿತುಕೋ (kuḷitukō), for a child, sounds like an order to an adult."
  - id: kn-0540
    target: "ರಾಮು ಅವರು ಬಂದಿದ್ದಾರೆ."
    native: "Mr Ramu has come."
    reading: "rāmu avaru bandiddāre."
    ipa: "raːmu aʋaru band̪id̪d̪aːre"
    pos: "phrase"
    notes: "Respect goes after the name, and the verb takes the plural."
  - id: kn-0541
    target: "ನನ್ನ ಅಕ್ಕ ಬಂದಳು."
    native: "My elder sister came."
    reading: "nanna akka bandaḷu."
    ipa: "nanna akka band̪aɭu"
    pos: "phrase"
    notes: "A woman takes -ಅಳು (-aḷu), never the -ತು (-tu) of a thing, as she would in Telugu."
  - id: kn-0542
    target: "ನನಗೆ ಗೊತ್ತಿಲ್ಲ."
    native: "I don't know."
    reading: "nanage gottilla."
    ipa: "nanaɡe ɡot̪t̪illa"
    alt_target: ["ನಂಗೆ ಗೊತ್ತಿಲ್ಲ."]
    pos: "phrase"
    notes: "'To me it is not known': ನನಗೆ (nanage), not ನಾನು (nānu)."
