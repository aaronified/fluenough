schema: 1
id: kn-en-grammar-pitfalls
name: "Pitfalls"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN, icon: "ಕ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The mistakes English speakers make most in Kannada. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: kn-0534
    target: "ನಾವು ಹೋಗೋಣ."
    native: "Let's go."
    reading: "navu hogona."
    pos: "phrase"
    notes: "Kannada has one 'we', ನಾವು, with or without the listener, where Telugu and Tamil have two. -ಓಣ, 'let's', hardly needs it: ಹೋಗೋಣ."
  - id: kn-0535
    target: "ಇದು ನೀರು ಅಲ್ಲ."
    native: "This isn't water."
    reading: "idu niru alla."
    pos: "phrase"
    notes: "ಅಲ್ಲ: it is not that. Not ಇಲ್ಲ."
  - id: kn-0536
    target: "ನೀರು ಇಲ್ಲ."
    native: "There's no water."
    reading: "niru illa."
    pos: "phrase"
    notes: "ಇಲ್ಲ: there isn't any. Not ಅಲ್ಲ."
  - id: kn-0537
    target: "ನನಗೆ ಹಸಿವಾಗಿದೆ."
    native: "I'm hungry."
    reading: "nanage hasivagide."
    alt_target: ["ನಂಗೆ ಹಸಿವಾಗಿದೆ."]
    pos: "phrase"
    notes: "'To me hunger has come': ನನಗೆ, not ನಾನು."
  - id: kn-0538
    target: "ನಾನು ಹೋಗಬೇಕು."
    native: "I have to go."
    reading: "nanu hogabeku."
    pos: "phrase"
    notes: "-ಬೇಕು on the verb: must."
  - id: kn-0539
    target: "ನೀವು ಕುಳಿತುಕೊಳ್ಳಿ."
    native: "Please sit down."
    reading: "nivu kulitukolli."
    alt_target: ["ಕುಳಿತುಕೊಳ್ಳಿ.", "ಕೂತ್ಕೊಳ್ಳಿ."]
    pos: "phrase"
    notes: "A request to someone you respect ends in -ಇ. ಕುಳಿತುಕೋ (kulituko), for a child, sounds like an order to an adult."
  - id: kn-0540
    target: "ರಾಮು ಅವರು ಬಂದಿದ್ದಾರೆ."
    native: "Mr Ramu has come."
    reading: "ramu avaru bandiddare."
    pos: "phrase"
    notes: "Respect goes after the name, and the verb takes the plural."
  - id: kn-0541
    target: "ನನ್ನ ಅಕ್ಕ ಬಂದಳು."
    native: "My elder sister came."
    reading: "nanna akka bandalu."
    pos: "phrase"
    notes: "A woman takes -ಅಳು, never the -ತು of a thing, as she would in Telugu."
  - id: kn-0542
    target: "ನನಗೆ ಗೊತ್ತಿಲ್ಲ."
    native: "I don't know."
    reading: "nanage gottilla."
    alt_target: ["ನಂಗೆ ಗೊತ್ತಿಲ್ಲ."]
    pos: "phrase"
    notes: "'To me it is not known': ನನಗೆ, not ನಾನು."
