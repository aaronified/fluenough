description: "Men, women and things in the third person, and the plural. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - ref: kn-0129
  - ref: kn-0130
  - ref: kn-0131
  - id: kn-0328
    target: "ಅವರು ಬಂದರು."
    native: "They came; he or she came (respectful)."
    reading: "avaru bandaru."
    ipa: "aʋaru band̪aru"
    alt_target: ["ಅವರು ಬಂದ್ರು."]
    pos: "phrase"
    notes: "-ಅರು (-aru) for people in the plural, and for one person you respect."
  - id: kn-0329
    target: "ಹಸುಗಳು ಬಂದವು."
    native: "The cows came."
    reading: "hasugaḷu bandavu."
    ipa: "hasuɡaɭu band̪aʋu"
    pos: "phrase"
    notes: "Things and animals in the plural have a verb of their own, -ಅವು (-avu), unlike people's -ಅರು (-aru)."
  - id: kn-0330
    target: "ಮಕ್ಕಳು ಆಡುತ್ತಿದ್ದಾರೆ."
    native: "The children are playing."
    reading: "makkaḷu āḍuttiddāre."
    ipa: "makkaɭu aːɖut̪t̪id̪d̪aːre"
    alt_target: ["ಮಕ್ಕಳು ಆಡ್ತಿದ್ದಾರೆ."]
    pos: "phrase"
  - id: kn-0331
    target: "ಮೂರು ಪುಸ್ತಕಗಳು"
    native: "three books"
    reading: "mūru pustakagaḷu"
    ipa: "muːru pust̪akaɡaɭu"
    alt_target: ["ಮೂರು ಪುಸ್ತಕ"]
    pos: "phrase"
    notes: "-ಗಳು (-gaḷu) makes a plural, and people often take -ರು (-ru): ಹುಡುಗ (huḍuga), ಹುಡುಗರು (boy, boys). After a number the plural ending is often left out: ಮೂರು ಪುಸ್ತಕ (mūru pustaka)."
