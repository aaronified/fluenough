id: kn-en-grammar-gender-number
name: "Gender and number"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Men, women and things in the third person, and the plural. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - ref: kn-0129
  - ref: kn-0130
  - ref: kn-0131
  - id: kn-0328
    target: "ಅವರು ಬಂದರು."
    native: "They came; he or she came (respectful)."
    reading: "avaru bandaru."
    alt_target: ["ಅವರು ಬಂದ್ರು."]
    pos: "phrase"
    notes: "-ಅರು for people in the plural, and for one person you respect."
  - id: kn-0329
    target: "ಹಸುಗಳು ಬಂದವು."
    native: "The cows came."
    reading: "hasugalu bandavu."
    pos: "phrase"
    notes: "Things and animals in the plural have a verb of their own, -ಅವು, unlike people's -ಅರು."
  - id: kn-0330
    target: "ಮಕ್ಕಳು ಆಡುತ್ತಿದ್ದಾರೆ."
    native: "The children are playing."
    reading: "makkalu aaduttiddaare."
    alt_target: ["ಮಕ್ಕಳು ಆಡ್ತಿದ್ದಾರೆ."]
    pos: "phrase"
  - id: kn-0331
    target: "ಮೂರು ಪುಸ್ತಕಗಳು"
    native: "three books"
    reading: "muuru pustakagalu"
    alt_target: ["ಮೂರು ಪುಸ್ತಕ"]
    pos: "phrase"
    notes: "-ಗಳು makes a plural, and people often take -ರು: ಹುಡುಗ, ಹುಡುಗರು (boy, boys). After a number the plural ending is often left out: ಮೂರು ಪುಸ್ತಕ."
