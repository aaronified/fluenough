cards:
  - ref: kn-0203
  - id: kn-0224
    target: "ಆಫೀಸು"
    native: "office"
    reading: "aafiisu"
    alt_target: ["ಆಫೀಸ್", "ಕಚೇರಿ"]
    pos: "noun"
    notes: "The formal word, on signs, is ಕಚೇರಿ (kacheeri)."
  - id: kn-0225
    target: "ಶಿಕ್ಷಕ"
    native: "teacher (a man)"
    reading: "shikshaka"
    alt_target: ["ಟೀಚರ್"]
    pos: "noun"
    notes: "A woman teacher is ಶಿಕ್ಷಕಿ (shikshaki). Many say ಟೀಚರ್, or, for a man, ಮೇಷ್ಟ್ರು (meeshtru)."
  - id: kn-0226
    target: "ಅಂಗಡಿಯವರು"
    native: "shopkeeper"
    reading: "angadiyavaru"
    pos: "noun"
    notes: "'The person of the shop', with respect."
  - id: kn-0227
    target: "ಡ್ರೈವರ್"
    native: "driver"
    reading: "draivar"
    pos: "noun"
    notes: "The formal word is ಚಾಲಕ (chaalaka)."
  - id: kn-0228
    target: "ಇಂಜಿನಿಯರ್"
    native: "engineer"
    reading: "injiniyar"
    alt_target: ["ಎಂಜಿನಿಯರ್"]
    pos: "noun"
    notes: "Bengaluru is full of them: ಸಾಫ್ಟ್‌ವೇರ್ ಇಂಜಿನಿಯರ್, software engineer."
  - id: kn-0229
    target: "ವಕೀಲ"
