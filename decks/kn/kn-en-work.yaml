    reading: "vakiila"
    pos: "noun"
  - id: kn-0230
    target: "ನರ್ಸ್"
    native: "nurse"
    reading: "nars"
    pos: "noun"
  - id: kn-0231
    target: "ರೈತ"
    native: "farmer"
    reading: "raita"
    pos: "noun"
  - id: kn-0232
    target: "ಅಡುಗೆಯವರು"
    native: "cook"
    reading: "adugeyavaru"
    pos: "noun"
    notes: "From ಅಡುಗೆ (aduge), cooking."
  - id: kn-0233
    target: "ಬರಹಗಾರ"
    native: "writer"
    reading: "barahagaara"
    pos: "noun"
    notes: "Also ಲೇಖಕ (leekhaka)."
  - id: kn-0234
    target: "ಪತ್ರಕರ್ತ"
    native: "journalist; reporter"
    reading: "patrakarta"
    pos: "noun"
  - id: kn-0235
    target: "ಡಾಕ್ಟರ್"
    native: "doctor"
    reading: "daaktar"
    pos: "noun"
    notes: "The Kannada word is ವೈದ್ಯ (vaidya)."
  - id: kn-0236
    target: "ವಿದ್ಯಾರ್ಥಿ"
    native: "student"
    reading: "vidyaarthi"
    pos: "noun"
    notes: "A woman student is ವಿದ್ಯಾರ್ಥಿನಿ (vidyaarthini)."
  - id: kn-0237
    target: "ರಜೆ"
    native: "day off; holiday; leave"
    reading: "raje"
    pos: "noun"
  - id: kn-0238
    target: "ಸಂಬಳ"
    native: "salary; pay"
    reading: "sambala"
    pos: "noun"
