cards:
  - ref: kn-0203
  - id: kn-0224
    target: "ಆಫೀಸು"
    native: "office"
    reading: "āfīsu"
    ipa: "aːfiːsu"
    alt_target: ["ಆಫೀಸ್", "ಕಚೇರಿ"]
    pos: "noun"
    notes: "The formal word, on signs, is ಕಚೇರಿ (kacēri)."
  - id: kn-0225
    target: "ಶಿಕ್ಷಕ"
    native: "teacher (a man)"
    reading: "śikṣaka"
    ipa: "ʃikʂaka"
    alt_target: ["ಟೀಚರ್"]
    pos: "noun"
    notes: "A woman teacher is ಶಿಕ್ಷಕಿ (śikṣaki). Many say ಟೀಚರ್, or, for a man, ಮೇಷ್ಟ್ರು (mēṣṭru)."
  - id: kn-0226
    target: "ಅಂಗಡಿಯವರು"
    native: "shopkeeper"
    reading: "aṅgaḍiyavaru"
    ipa: "aŋɡaɖijaʋaru"
    pos: "noun"
    notes: "'The person of the shop', with respect."
  - id: kn-0227
    target: "ಡ್ರೈವರ್"
    native: "driver"
    reading: "ḍraivar"
    ipa: "ɖraiʋar"
    pos: "noun"
    notes: "The formal word is ಚಾಲಕ (cālaka)."
  - id: kn-0228
    target: "ಇಂಜಿನಿಯರ್"
    native: "engineer"
    reading: "iñjiniyar"
    ipa: "iɲdʒinijar"
    alt_target: ["ಎಂಜಿನಿಯರ್"]
    pos: "noun"
    notes: "Bengaluru is full of them: ಸಾಫ್ಟ್‌ವೇರ್ ಇಂಜಿನಿಯರ್, software engineer."
  - id: kn-0229
    target: "ವಕೀಲ"
    native: "lawyer"
    reading: "vakīla"
    ipa: "ʋakiːla"
    pos: "noun"
  - id: kn-0230
    target: "ನರ್ಸ್"
    native: "nurse"
    reading: "nars"
    ipa: "nars"
    pos: "noun"
  - id: kn-0231
    target: "ರೈತ"
    native: "farmer"
    reading: "raita"
    ipa: "rait̪a"
    pos: "noun"
  - id: kn-0232
    target: "ಅಡುಗೆಯವರು"
    native: "cook"
    reading: "aḍugeyavaru"
    ipa: "aɖuɡejaʋaru"
    pos: "noun"
    notes: "From ಅಡುಗೆ (aḍuge), cooking."
  - id: kn-0233
    target: "ಬರಹಗಾರ"
    native: "writer"
    reading: "barahagāra"
    ipa: "barahaɡaːra"
    pos: "noun"
    notes: "Also ಲೇಖಕ (lēkhaka)."
  - id: kn-0234
    target: "ಪತ್ರಕರ್ತ"
    native: "journalist; reporter"
    reading: "patrakarta"
    ipa: "pat̪rakart̪a"
    pos: "noun"
  - id: kn-0235
    target: "ಡಾಕ್ಟರ್"
    native: "doctor"
    reading: "ḍākṭar"
    ipa: "ɖaːkʈar"
    pos: "noun"
    notes: "The Kannada word is ವೈದ್ಯ (vaidya)."
  - id: kn-0236
    target: "ವಿದ್ಯಾರ್ಥಿ"
    native: "student"
    reading: "vidyārthi"
    ipa: "ʋid̪jaːrt̪ʰi"
    pos: "noun"
    notes: "A woman student is ವಿದ್ಯಾರ್ಥಿನಿ (vidyārthini)."
  - id: kn-0237
    target: "ರಜೆ"
    native: "day off; holiday; leave"
    reading: "raje"
    ipa: "radʒe"
    pos: "noun"
  - id: kn-0238
    target: "ಸಂಬಳ"
    native: "salary; pay"
    reading: "sambaḷa"
    ipa: "sambaɭa"
    pos: "noun"
  - id: kn-0239
    target: "ವ್ಯಾಪಾರ"
    native: "business; trade"
    reading: "vyāpāra"
    ipa: "ʋjaːpaːra"
    pos: "noun"
  - id: kn-0240
    target: "ನೀವು ಏನು ಕೆಲಸ ಮಾಡುತ್ತೀರಿ?"
    native: "What do you do (for a living)?"
    reading: "nīvu ēnu kelasa māḍuttīri?"
    ipa: "niːʋu eːnu kelasa maːɖut̪t̪iːri"
    alt_target: ["ನೀವು ಏನ್ ಕೆಲಸ ಮಾಡ್ತೀರಾ?"]
    pos: "phrase"
  - id: kn-0241
    target: "ನಾನು ಶಿಕ್ಷಕ."
    native: "I'm a teacher."
    reading: "nānu śikṣaka."
    ipa: "naːnu ʃikʂaka"
    alt_target: ["ನಾನು ಶಿಕ್ಷಕಿ.", "ನಾನು ಟೀಚರ್."]
    pos: "phrase"
    notes: "A woman says ನಾನು ಶಿಕ್ಷಕಿ."
  - id: kn-0242
    target: "ನೀವು ಎಲ್ಲಿ ಕೆಲಸ ಮಾಡುತ್ತೀರಿ?"
    native: "Where do you work?"
    reading: "nīvu elli kelasa māḍuttīri?"
    ipa: "niːʋu elli kelasa maːɖut̪t̪iːri"
    pos: "phrase"
  - id: kn-0243
    target: "ನಾನು ಆಫೀಸಿನಲ್ಲಿ ಕೆಲಸ ಮಾಡುತ್ತೇನೆ."
    native: "I work in an office."
    reading: "nānu āfīsinalli kelasa māḍuttēne."
    ipa: "naːnu aːfiːsinalli kelasa maːɖut̪t̪eːne"
    alt_target: ["ನಾನು ಆಫೀಸಲ್ಲಿ ಕೆಲಸ ಮಾಡ್ತೀನಿ."]
    pos: "phrase"
