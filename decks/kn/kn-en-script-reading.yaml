schema: 1
id: kn-en-script-reading
name: "First words to read"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN, icon: "ಕ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Short everyday words written with letters alone, no vowel signs: the tick, the vowel you do not see, and doubled letters, at work. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: kn-0048
    target: "ಮರ"
    native: "tree"
    reading: "mara"
    ipa: "mara"
    notes: "ಮ and ರ, each with its a, and the last a is said: ma-ra."
  - id: kn-0049
    target: "ಹಣ"
    native: "money"
    reading: "haṇa"
    ipa: "haɳa"
    notes: "ಣ is the n with the tongue curled back. In speech, money is more often ದುಡ್ಡು (duḍḍu)."
  - id: kn-0050
    target: "ಜನ"
    native: "people; a crowd"
    reading: "jana"
    ipa: "dʒana"
    notes: "ಜ and ನ, each with its a."
  - id: kn-0051
    target: "ಪದ"
    native: "word"
    reading: "pada"
    ipa: "pad̪a"
    notes: "ದ is the d on the teeth."
  - id: kn-0052
    target: "ರಥ"
    native: "chariot"
    reading: "ratha"
    ipa: "rat̪ʰa"
    notes: "ಥ is the t on the teeth with a breath after it."
  - id: kn-0053
    target: "ಬಲ"
    native: "strength; the right-hand side"
    reading: "bala"
    ipa: "bala"
    notes: "ಬಲ is both strength and the right: ಬಲಕ್ಕೆ (balakke), to the right."
  - id: kn-0054
    target: "ಕಮಲ"
    native: "lotus"
    reading: "kamala"
    ipa: "kamala"
    notes: "Three letters, each with its a, and the last is said: ka-ma-la, not kamal as in Hindi."
  - id: kn-0055
    target: "ನಗರ"
    native: "city"
    reading: "nagara"
    ipa: "naɡara"
    notes: "ನ, ಗ and ರ, each with its a: ಬೆಂಗಳೂರು ನಗರ, Bengaluru city."
  - id: kn-0056
    target: "ಸಮಯ"
    native: "time (the moment); an occasion"
    reading: "samaya"
    ipa: "samaja"
    notes: "ಸ is s, never sh."
  - id: kn-0057
    target: "ಮಗ"
    native: "son"
    reading: "maga"
    ipa: "maɡa"
    notes: "ಮ and ಗ. A daughter is ಮಗಳು (magaḷu)."
  - id: kn-0058
    target: "ಅಮ್ಮ"
    native: "mother"
    reading: "amma"
    ipa: "amma"
    notes: "A doubled m, held longer: the second ಮ is written small below the first, as its ottakshara. Calling to her, you say ಅಮ್ಮಾ (ammā, with a long final a)."
  - id: kn-0059
    target: "ಅಪ್ಪ"
    native: "father"
    reading: "appa"
    ipa: "appa"
    notes: "A doubled p: the second ಪ sits below the first."
  - id: kn-0060
    target: "ಅಕ್ಕ"
    native: "elder sister"
    reading: "akka"
    ipa: "akka"
    notes: "A doubled k. Calling to her, you say ಅಕ್ಕಾ (akkā, with a long final a)."
  - id: kn-0061
    target: "ಅಣ್ಣ"
    native: "elder brother"
    reading: "aṇṇa"
    ipa: "aɳɳa"
    notes: "A doubled n, curled back. Calling to him, you say ಅಣ್ಣಾ (aṇṇā, with a long final a)."
  - id: kn-0062
    target: "ಅನ್ನ"
    native: "cooked rice"
    reading: "anna"
    ipa: "anna"
    notes: "A doubled n on the teeth. Compare ಅಣ್ಣ, elder brother, with the curled-back n."
