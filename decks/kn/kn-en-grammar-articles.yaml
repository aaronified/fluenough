schema: 1
id: kn-en-grammar-articles
name: "No articles: a and the"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Kannada has no 'a' or 'the'. How it says them anyway. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: kn-0309
    target: "ಪುಸ್ತಕ ಮೇಜಿನ ಮೇಲೆ ಇದೆ."
    native: "The book is on the table."
    reading: "pustaka mējina mēle ide."
    ipa: "pust̪aka meːdʒina meːle id̪e"
    pos: "phrase"
    notes: "A noun alone is usually 'the': the one we both know about."
  - id: kn-0310
    target: "ಒಬ್ಬ ಹುಡುಗ ಬಂದ."
    native: "A boy came."
    reading: "obba huḍuga banda."
    ipa: "obba huɖuɡa band̪a"
    alt_target: ["ಒಬ್ಬ ಹುಡುಗ ಬಂದನು."]
    pos: "phrase"
    notes: "'One' serves for 'a'. For a man it is ಒಬ್ಬ (obba), for a woman ಒಬ್ಬಳು (obbaḷu), for a thing ಒಂದು (ondu)."
  - id: kn-0311
    target: "ಹುಡುಗ ಬಂದ."
    native: "The boy came."
    reading: "huḍuga banda."
    ipa: "huɖuɡa band̪a"
    alt_target: ["ಹುಡುಗ ಬಂದನು."]
    pos: "phrase"
  - id: kn-0312
    target: "ಒಂದು ಕಾಫಿ ಕೊಡಿ."
    native: "One coffee, please."
    reading: "ondu kāfi koḍi."
    ipa: "ond̪u kaːfi koɖi"
    pos: "phrase"
  - id: kn-0313
    target: "ಯಾರೋ ಬಂದಿದ್ದಾರೆ."
    native: "Someone has come."
    reading: "yārō bandiddāre."
    ipa: "jaːroː band̪id̪d̪aːre"
    pos: "phrase"
    notes: "-ಓ on a question word makes it 'some': ಯಾರೋ, someone; ಏನೋ, something; ಎಲ್ಲೋ, somewhere."
