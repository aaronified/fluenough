description: "Yes and no, the question words, and how a sentence becomes a question. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: kn-0164
    target: "ಹೌದು"
    native: "yes; that's right"
    reading: "haudu"
    ipa: "haud̪u"
    pos: "other"
    notes: "Often with a nod or a sideways tilt of the head, which also means yes."
  - id: kn-0165
    target: "ಇಲ್ಲ"
    native: "no; there isn't"
    reading: "illa"
    ipa: "illa"
    pos: "other"
    notes: "The everyday 'no': ಕಾಫಿ ಇದೆಯಾ? ಇಲ್ಲ. Is there coffee? No."
  - id: kn-0166
    target: "ಅಲ್ಲ"
    native: "no; it is not"
    reading: "alla"
    ipa: "alla"
    pos: "other"
    notes: "'No, it isn't that': ಇದು ನಿಮ್ಮ ಪುಸ್ತಕವಾ? ಅಲ್ಲ. Is this your book? No."
  - id: kn-0167
    target: "ಏನು"
    native: "what"
    reading: "ēnu"
    ipa: "eːnu"
    pos: "other"
    notes: "ಇದು ಏನು? What is this? In speech often ಏನ್ (ēn)."
  - id: kn-0168
    target: "ಯಾರು"
    native: "who"
    reading: "yāru"
    ipa: "jaːru"
    pos: "other"
  - id: kn-0169
    target: "ಎಲ್ಲಿ"
    native: "where"
    reading: "elli"
    ipa: "elli"
    pos: "other"
    notes: "With -ಗೆ, to: ಎಲ್ಲಿಗೆ? (ellige?), where to?"
  - id: kn-0170
    target: "ಯಾವಾಗ"
    native: "when"
    reading: "yāvāga"
    ipa: "jaːʋaːɡa"
    pos: "other"
  - id: kn-0171
    target: "ಯಾಕೆ"
    native: "why"
    reading: "yāke"
    ipa: "jaːke"
    alt_target: ["ಏಕೆ"]
    pos: "other"
    notes: "Written also ಏಕೆ (ēke)."
  - id: kn-0172
    target: "ಹೇಗೆ"
    native: "how"
    reading: "hēge"
    ipa: "heːɡe"
    pos: "other"
  - id: kn-0173
    target: "ಎಷ್ಟು"
    native: "how much; how many"
    reading: "eṣṭu"
    ipa: "eʂʈu"
    pos: "other"
  - id: kn-0174
    target: "ಯಾವುದು"
    native: "which one"
    reading: "yāvudu"
    ipa: "jaːʋud̪u"
    pos: "other"
    notes: "Before a noun, ಯಾವ (yāva): ಯಾವ ಬಸ್ಸು? Which bus?"
  - id: kn-0175
    target: "ಹೌದಾ?"
    native: "Really?"
    reading: "haudā?"
    ipa: "haud̪aː"
    pos: "phrase"
    notes: "ಹೌದು with the question ending -ಆ."
