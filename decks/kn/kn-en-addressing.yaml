schema: 1
id: kn-en-addressing
name: "Addressing people"
kind: vocab
theme: addressing
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "What to call a shopkeeper, a driver or an older woman: Kannada speakers address strangers as family. Not yet checked by a Kannada speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - ref: kn-0061
    native: "elder brother; to a man a little older"
    notes: "Said to a driver or a shopkeeper about your age or a little older: ಅಣ್ಣಾ, ಎಷ್ಟು? How much, brother?"
  - ref: kn-0060
    native: "elder sister; to a woman a little older"
    notes: "Said to a woman a little older, a stallholder, a nurse: ಅಕ್ಕಾ, ಇದು ಎಷ್ಟು?"
  - id: kn-0186
    target: "ತಮ್ಮ"
    native: "younger brother; to a younger man"
    reading: "tamma"
    ipa: "t̪amma"
    pos: "noun"
    notes: "Said kindly to a boy or a younger man, such as a waiter: ತಮ್ಮಾ, ಒಂದು ಕಾಫಿ. One coffee, brother."
  - id: kn-0187
    target: "ತಂಗಿ"
    native: "younger sister; to a younger woman"
    reading: "taṅgi"
    ipa: "t̪aŋɡi"
    pos: "noun"
  - id: kn-0188
    target: "ಅವರು"
    native: "Mr; Ms (after a name, respectful)"
    reading: "avaru"
    ipa: "aʋaru"
    pos: "other"
    notes: "Put after a name for respect: ರಾಮು ಅವರು (rāmu avaru), Mr Ramu. On its own ಅವರು is 'he' or 'she' with respect, and 'they'."
  - id: kn-0189
    target: "ರೀ"
    native: "a word of respect, after a word or a call"
    reading: "rī"
    ipa: "riː"
    pos: "other"
    notes: "Added to a call or a reply to make it polite: ಏನ್ರೀ? (enri?), yes?; ಬನ್ನಿ ರೀ, please come. Between a married couple it is also how a wife traditionally calls her husband."
  - id: kn-0190
    target: "ಸರ್"
    native: "sir"
    reading: "sar"
    ipa: "sar"
    pos: "other"
    notes: "Very common, to anyone in an office, a teacher, an official."
  - id: kn-0191
    target: "ಮೇಡಂ"
    native: "madam"
    reading: "mēḍam"
    ipa: "meːɖam"
    pos: "other"
  - id: kn-0192
    target: "ಸ್ವಾಮಿ"
    native: "sir (traditional)"
    reading: "svāmi"
    ipa: "sʋaːmi"
    pos: "other"
    notes: "An older, respectful way to address a man, heard in the villages and from older people. It also means 'lord' and 'swami'."
  - id: kn-0193
    target: "ಆಂಟಿ"
    native: "aunty; to an older woman"
    reading: "āṇṭi"
    ipa: "aːɳʈi"
    pos: "other"
    notes: "Common in the cities. Many people simply say ಅಮ್ಮ (amma), mother, to an older woman."
  - id: kn-0194
    target: "ಅಜ್ಜಿ"
    native: "grandmother; to an old woman"
    reading: "ajji"
    ipa: "adʒdʒi"
    pos: "noun"
    notes: "Said kindly to any old woman, such as a flower seller."
  - id: kn-0195
    target: "ಗೆಳೆಯ"
    native: "friend (a man)"
    reading: "geḷeya"
    ipa: "ɡeɭeja"
    pos: "noun"
    notes: "A woman friend is ಗೆಳತಿ (geḷati). The formal word is ಸ್ನೇಹಿತ (snēhita)."
