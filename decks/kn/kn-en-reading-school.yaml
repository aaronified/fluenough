          - { en: "Maths" }
          - { en: "Science" }
          - { en: "Games" }
        answer: 1
      - id: "kn-9350"
        prompt: { en: "Science is at two o'clock on Tuesday." }
        answer: true
      - id: "kn-9351"
        prompt: { en: "What is on Friday?" }
