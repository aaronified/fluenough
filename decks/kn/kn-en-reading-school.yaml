passages:
  - id: "kn-class-timetable"
    title: "Class timetable"
    sentences:
      - text: "ಸೋಮವಾರ ಬೆಳಿಗ್ಗೆ ಗಣಿತ ಪಾಠ ಇದೆ."
        reading: "sōmavāra beḷigge gaṇita pāṭha ide."
        ipa: "soːmaʋaːra beɭiɡɡe ɡaɳit̪a paːʈʰa id̪e"
      - text: "ಮಂಗಳವಾರ ಎರಡು ಗಂಟೆಗೆ ವಿಜ್ಞಾನ."
        reading: "maṅgaḷavāra eraḍu gaṇṭege vijñāna."
        ipa: "maŋɡaɭaʋaːra eraɖu ɡaɳʈeɡe ʋidʒɲaːna"
      - text: "ಬುಧವಾರ ಇಂಗ್ಲಿಷ್ ಮತ್ತು ಕನ್ನಡ."
        reading: "budhavāra iṅgliṣ mattu kannaḍa."
        ipa: "bud̪ʱaʋaːra iŋɡliʂ mat̪t̪u kannaɖa"
      - text: "ಶುಕ್ರವಾರ ಆಟ ಇದೆ."
        reading: "śukravāra āṭa ide."
        ipa: "ʃukraʋaːra aːʈa id̪e"
      - text: "ಪ್ರತಿ ದಿನ ಗೃಹಪಾಠ ಇದೆ."
        reading: "prati dina gruhapāṭha ide."
        ipa: "prat̪i d̪ina ɡruhapaːʈʰa id̪e"
    questions:
      - id: "kn-9349"
        prompt: { en: "Which subject is on Monday morning?" }
