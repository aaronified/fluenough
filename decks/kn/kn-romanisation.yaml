# How every reading in decks/kn is written (#47): Kannada as people type it
# in a chat. The first spelling of each group is the one the decks use; the
# others are what a learner may type for the same sound. Kannada typists
# write ee and oo for the long i and u (neenu, ooru), so long e and o are
# typed e and o like the short ones, and have no group of their own. See
# "Romanisation" in docs/DECK-FORMAT.md.
schema: 1
kind: romanisation
id: kn-romanisation
language: kn
scheme: "Based on ISO 15919's letters, spelled as said, and departing from the standard where a learner is better served (ADR-0025; the README lists the departures): ā ī ū for the long vowels, and e and ē, o and ō for the short and the long e and o (nīvu, bēku); ai and au; ṭ ṭh ḍ ḍh ṇ for the retroflex row and t th d dh n for the row on the teeth; ḷ for ಳ and ೞ; c for ಚ and ch for ಛ; ś for ಶ and ṣ for ಷ; ñ for ಞ; r for ಱ; ru for ಋ; f for ಫ in words from English; ಂ as the nasal said (kamba, gaṅge, māmsa). Every vowel said is written. A typed answer needs none of the marks."
standard: "ISO 15919"
# How a reading's letters are typed, read from the left, longest first:
# each reading is spelled so before an answer is compared with it.
typed:
  - ["ṅkh", "nkh"]
  - ["ṅgh", "ngh"]
  - ["ṅk", "nk"]
  - ["ṅg", "ng"]
  - ["ṅ", "ng"]
  - ["ñch", "nchh"]
  - ["ñc", "nch"]
  - ["ñjh", "njh"]
  - ["ñj", "nj"]
  - ["ñ", "ny"]
  - ["cch", "chh"]
  - ["cc", "chch"]
  - ["ch", "chh"]
  - ["c", "ch"]
  - ["ś", "sh"]
  - ["ṣ", "sh"]
  - ["m̐", "n"]
  - ["ṁ", "n"]
  - ["k͟h", "kh"]
equivalents:
  - ["a", "aa"]
  - ["i", "ee", "ii"]
  - ["u", "oo", "uu"]
  - ["v", "w"]
  - ["ph", "f"]
