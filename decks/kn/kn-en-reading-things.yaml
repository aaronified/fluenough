  - id: "kn-lost-property-list"
    title: "Lost property list"
    sentences:
      - text: "ಒಂದು ಬ್ಯಾಗ್ ಇಲ್ಲಿ ಇದೆ."
        reading: "ondu byāg illi ide."
        ipa: "ond̪u bjaːɡ illi id̪e"
      - text: "ಬ್ಯಾಗ್ ಒಳಗೆ ಒಂದು ಪುಸ್ತಕ ಮತ್ತು ಒಂದು ಪೆನ್ನು ಇದೆ."
        reading: "byāg oḷage ondu pustaka mattu ondu pennu ide."
        ipa: "bjaːɡ oɭaɡe ond̪u pust̪aka mat̪t̪u ond̪u pennu id̪e"
      - text: "ಒಂದು ಛತ್ರಿ ಕೂಡ ಇದೆ."
        reading: "ondu chatri kūḍa ide."
        ipa: "ond̪u tʃʰat̪ri kuːɖa id̪e"
      - text: "ಗಡಿಯಾರ ಇಲ್ಲ."
        reading: "gaḍiyāra illa."
        ipa: "ɡaɖijaːra illa"
      - text: "ಯಾರದು? ಹೇಳಿ."
        reading: "yāradu? hēḷi."
        ipa: "jaːrad̪u heːɭi"
    questions:
      - id: "kn-9676"
        prompt: { en: "What is listed with the book?" }
