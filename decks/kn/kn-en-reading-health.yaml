  - id: "kn-clinic-notice"
    title: "Clinic notice"
    sentences:
      - text: "ಪ್ರತಿದಿನ ವ್ಯಾಯಾಮ ಮಾಡಿ."
        reading: "pratidina vyāyāma māḍi."
        ipa: "prat̪id̪ina ʋjaːjaːma maːɖi"
      - text: "ಹಾಲು ಕುಡಿಯಿರಿ ಮತ್ತು ನಿದ್ರೆ ಮಾಡಿ."
        reading: "hālu kuḍiyiri mattu nidre māḍi."
        ipa: "haːlu kuɖijiri mat̪t̪u nid̪re maːɖi"
      - text: "ಜ್ವರ ಇದ್ದರೆ ವಿಶ್ರಾಂತಿ ತೆಗೆದುಕೊಳ್ಳಿ."
        reading: "jvara iddare viśrānti tegedukoḷḷi."
        ipa: "dʒʋara id̪d̪are ʋiʃraːnt̪i t̪eɡed̪ukoɭɭi"
      - text: "ವೈದ್ಯರು ಇಲ್ಲಿ ಇದ್ದಾರೆ."
        reading: "vaidyaru illi iddāre."
        ipa: "ʋaid̪jaru illi id̪d̪aːre"
