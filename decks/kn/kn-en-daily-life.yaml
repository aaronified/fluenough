tags: [beginner, unreviewed]
cards:
  - id: kn-0432
    target: "ಎದ್ದೇಳು"
    native: "get up! (to a friend); to get up"
    reading: "eddēḷu"
    ipa: "ed̪d̪eːɭu"
    pos: "verb"
    notes: "The verb is ಏಳು (ēḷu), to rise, the same word as seven: ಏಳುತ್ತೇನೆ, I get up. ಎದ್ದೇಳು is what a parent calls in the morning."
  - id: kn-0433
    target: "ಸ್ನಾನ ಮಾಡು"
    native: "to bathe; to have a shower"
    reading: "snāna māḍu"
    ipa: "snaːna maːɖu"
    pos: "verb"
    notes: "'To do a bath'. ಮಾಡು (māḍu), to do, makes many verbs."
  - id: kn-0434
    target: "ಹಲ್ಲು ಉಜ್ಜು"
    native: "to brush one's teeth"
    reading: "hallu ujju"
    ipa: "hallu udʒdʒu"
    pos: "verb"
    notes: "'To rub the teeth'. ಹಲ್ಲು (hallu) is a tooth."
  - id: kn-0435
    target: "ತಿಂಡಿ"
    native: "breakfast; a snack"
    reading: "tiṇḍi"
    ipa: "t̪iɳɖi"
    pos: "noun"
    notes: "Idli, dosa, upma: ತಿಂಡಿ ಆಯ್ತಾ? (tindi ayta?), have you had breakfast?, is a morning greeting."
  - id: kn-0436
    target: "ಮಧ್ಯಾಹ್ನದ ಊಟ"
    native: "lunch"
    reading: "madhyāhnada ūṭa"
    ipa: "mad̪ʱjaːhnad̪a uːʈa"
    pos: "noun"
    notes: "ಮಧ್ಯಾಹ್ನ (madhyāhna) is midday, ಊಟ (ūṭa) a meal."
  - id: kn-0437
    target: "ರಾತ್ರಿ ಊಟ"
    native: "dinner"
    reading: "rātri ūṭa"
    ipa: "raːt̪ri uːʈa"
    pos: "noun"
  - id: kn-0438
    target: "ಕೆಲಸಕ್ಕೆ ಹೋಗು"
    native: "to go to work"
    reading: "kelasakke hōgu"
    ipa: "kelasakke hoːɡu"
    pos: "verb"
  - id: kn-0439
    target: "ಮನೆಗೆ ಬರು"
    native: "to come home"
    reading: "manege baru"
    ipa: "maneɡe baru"
    pos: "verb"
  - id: kn-0440
    target: "ಅಡುಗೆ ಮಾಡು"
    native: "to cook"
    reading: "aḍuge māḍu"
    ipa: "aɖuɡe maːɖu"
    pos: "verb"
  - id: kn-0441
    target: "ಮಲಗು"
    native: "to go to bed; to lie down; to sleep"
    reading: "malagu"
    ipa: "malaɡu"
    pos: "verb"
  - id: kn-0442
    target: "ಪ್ರತಿದಿನ"
    native: "every day"
    reading: "pratidina"
    ipa: "prat̪id̪ina"
    alt_target: ["ದಿನಾ"]
    pos: "other"
    notes: "In speech also ದಿನಾ (dinā)."
  - id: kn-0443
    target: "ಕೆಲವೊಮ್ಮೆ"
    native: "sometimes"
    reading: "kelavomme"
    ipa: "kelaʋomme"
    pos: "other"
  - id: kn-0444
    target: "ಯಾವಾಗಲೂ"
    native: "always"
    reading: "yāvāgalū"
    ipa: "jaːʋaːɡaluː"
    pos: "other"
    notes: "ಯಾವಾಗ (when) + -ಊ (also): 'whenever'."
  - id: kn-0445
    target: "ಸಾಮಾನ್ಯವಾಗಿ"
    native: "usually"
    reading: "sāmānyavāgi"
    ipa: "saːmaːnjaʋaːɡi"
    pos: "other"
  - id: kn-0446
    target: "ಆಮೇಲೆ"
    native: "after that; then; later"
    reading: "āmēle"
    ipa: "aːmeːle"
    pos: "other"
  - id: kn-0447
    target: "ನಾನು ಪ್ರತಿದಿನ ಏಳು ಗಂಟೆಗೆ ಏಳುತ್ತೇನೆ."
    native: "I get up at seven every day."
    reading: "nānu pratidina ēḷu gaṇṭege ēḷuttēne."
    ipa: "naːnu prat̪id̪ina eːɭu ɡaɳʈeɡe eːɭut̪t̪eːne"
    alt_target: ["ನಾನು ದಿನಾ ಏಳು ಗಂಟೆಗೆ ಏಳ್ತೀನಿ."]
    pos: "phrase"
    notes: "ಏಳು twice: seven, and the verb 'get up'."
  - id: kn-0448
    target: "ಆಮೇಲೆ ನಾನು ಕೆಲಸಕ್ಕೆ ಹೋಗುತ್ತೇನೆ."
    native: "Then I go to work."
    reading: "āmēle nānu kelasakke hōguttēne."
    ipa: "aːmeːle naːnu kelasakke hoːɡut̪t̪eːne"
    alt_target: ["ಆಮೇಲೆ ನಾನು ಕೆಲಸಕ್ಕೆ ಹೋಗ್ತೀನಿ."]
    pos: "phrase"
  - id: kn-0449
    target: "ನಾನು ರಾತ್ರಿ ಹನ್ನೊಂದು ಗಂಟೆಗೆ ಮಲಗುತ್ತೇನೆ."
    native: "I go to bed at eleven at night."
    reading: "nānu rātri hannondu gaṇṭege malaguttēne."
    ipa: "naːnu raːt̪ri hannond̪u ɡaɳʈeɡe malaɡut̪t̪eːne"
    alt_target: ["ನಾನು ರಾತ್ರಿ ಹನ್ನೊಂದು ಗಂಟೆಗೆ ಮಲಗ್ತೀನಿ."]
    pos: "phrase"
  - id: kn-0450
    target: "ನಾನು ಯಾವತ್ತೂ ತಡವಾಗಿ ಬರುವುದಿಲ್ಲ."
    native: "I'm never late."
    reading: "nānu yāvattū taḍavāgi baruvudilla."
    ipa: "naːnu jaːʋat̪t̪uː t̪aɖaʋaːɡi baruʋud̪illa"
    pos: "phrase"
    notes: "'I never come late': ಯಾವತ್ತೂ (yāvattū), ever, with a 'not' verb is 'never'."
