    native: "2, two"
    reading: "eraḍu"
    ipa: "eraɖu"
    pos: "other"
    notes: "Two people: ಇಬ್ಬರು (ibbaru)."
  - id: kn-0246
    target: "ಮೂರು"
    native: "3, three"
    reading: "mūru"
    ipa: "muːru"
