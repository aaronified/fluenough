cards:
  - id: kn-0244
    target: "ಒಂದು"
    native: "1, one"
    reading: "ondu"
    pos: "other"
    notes: "Before a noun too: ಒಂದು ಕಾಫಿ, one coffee. People are counted apart: ಒಬ್ಬ (obba), one man; ಒಬ್ಬಳು (obbalu), one woman. Kannada has its own digits, ೧ ೨ ೩, but prices and bus numbers use 1 2 3."
  - id: kn-0245
    target: "ಎರಡು"
    native: "2, two"
    reading: "eradu"
    pos: "other"
    notes: "Two people: ಇಬ್ಬರು (ibbaru)."
  - id: kn-0246
    target: "ಮೂರು"
    native: "3, three"
    reading: "muru"
    pos: "other"
    notes: "Three people: ಮೂವರು (muvaru)."
