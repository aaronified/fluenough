cards:
  - id: kn-0244
    target: "ಒಂದು"
    native: "1, one"
    reading: "ondu"
    ipa: "ond̪u"
    pos: "other"
    notes: "Before a noun too: ಒಂದು ಕಾಫಿ (ondu kāfi), one coffee. People are counted apart: ಒಬ್ಬ (obba), one man; ಒಬ್ಬಳು (obbaḷu), one woman. Kannada has its own digits, ೧ ೨ ೩ (1 2 3), but prices and bus numbers use 1 2 3."
  - id: kn-0245
