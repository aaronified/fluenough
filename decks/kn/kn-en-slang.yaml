schema: 1
id: kn-en-slang
name: "Slang"
kind: vocab
language: { code: kn, iso639_3: kan, name: Kannada, script: kannada, tts: kn-IN, icon: "ಕ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Everyday slang, much of it from Bengaluru: what friends say that a textbook doesn't. Not yet checked by a Kannada speaker: please report any mistake."
tags: [slang, unreviewed]
cards:
  - id: kn-0557
    target: "ಮಗಾ"
    native: "mate; dude"
    reading: "magā"
    ipa: "maɡaː"
    pos: "noun"
    notes: "Literally 'son', but between young men any friend: ಏನ್ ಮಗಾ? what's up, mate?"
  - id: kn-0558
    target: "ಗುರು"
    native: "mate; boss"
    reading: "guru"
    ipa: "ɡuru"
    pos: "noun"
    notes: "Literally 'teacher', said to a friend or a stranger: ಏನ್ ಗುರು? what's up?"
  - id: kn-0559
    target: "ಏನ್ ಸಮಾಚಾರ?"
    native: "What's up? What's new?"
    reading: "ēn samācāra?"
    ipa: "eːn samaːtʃaːra"
    pos: "phrase"
    notes: "ಸಮಾಚಾರ (samācāra) is 'news'."
  - id: kn-0560
    target: "ಸಕ್ಕತ್"
    native: "great; really"
    reading: "sakkat"
    ipa: "sakkat̪"
    pos: "adj"
    notes: "ಸಕ್ಕತ್ತಾಗಿದೆ (sakkattāgide), it's great."
  - id: kn-0561
    target: "ಬೊಂಬಾಟ್"
    native: "fantastic"
    reading: "bombāṭ"
    ipa: "bombaːʈ"
    pos: "adj"
    notes: "ಬೊಂಬಾಟ್ ಊಟ, a fantastic meal."
  - id: kn-0562
    target: "ಮಸ್ತ್"
    native: "great; loads"
    reading: "mast"
    ipa: "mast̪"
    pos: "adj"
    notes: "Shared with Hindi: ಮಸ್ತ್ ಆಗಿದೆ, it's great."
  - id: kn-0563
    target: "ಸಿಕ್ಕಾಪಟ್ಟೆ"
    native: "a lot; terribly"
    reading: "sikkāpaṭṭe"
    ipa: "sikkaːpaʈʈe"
    pos: "other"
    notes: "ಸಿಕ್ಕಾಪಟ್ಟೆ ಟ್ರಾಫಿಕ್, terrible traffic."
  - id: kn-0564
    target: "ಬೋರ್ ಆಗ್ತಿದೆ"
    native: "I'm bored"
    reading: "bōr āgtide"
    ipa: "boːr aːɡt̪id̪e"
    pos: "phrase"
    notes: "'Boredom is happening': ನಂಗೆ ಬೋರ್ ಆಗ್ತಿದೆ."
  - id: kn-0565
    target: "ಟೆನ್ಶನ್ ತಗೋಬೇಡ"
    native: "don't stress"
    reading: "ṭenśan tagōbēḍa"
    ipa: "ʈenʃan t̪aɡoːbeːɖa"
    pos: "phrase"
    notes: "'Don't take tension'."
  - id: kn-0566
    target: "ಡಬ್ಬಾ"
    native: "rubbish; useless"
    reading: "ḍabbā"
    ipa: "ɖabbaː"
    pos: "adj"
    notes: "Literally a tin box: ಡಬ್ಬಾ ಸಿನಿಮಾ, a rubbish film."
  - id: kn-0567
    target: "ಹೋಗ್ಲಿ ಬಿಡು"
    native: "never mind; let it go"
    reading: "hōgli biḍu"
    ipa: "hoːɡli biɖu"
    pos: "phrase"
    notes: "'Let it go, leave it'."
  - id: kn-0568
    target: "ಸುಮ್ನೆ"
    native: "just like that; for nothing; quietly"
    reading: "sumne"
    ipa: "sumne"
    pos: "other"
    notes: "ಸುಮ್ನೆ ಇರು (sumne iru), be quiet; ಸುಮ್ನೆ ಕೇಳ್ದೆ, I just asked."
  - id: kn-0569
    target: "ಚಿಂದಿ"
    native: "brilliant (slang); a rag"
    reading: "cindi"
    ipa: "tʃind̪i"
    pos: "adj"
    notes: "Literally a rag, torn to shreds: a show that 'tore it up' is ಚಿಂದಿ."
  - id: kn-0570
    target: "ಎಣ್ಣೆ"
    native: "oil; booze (slang)"
    reading: "eṇṇe"
    ipa: "eɳɳe"
    pos: "noun"
    notes: "ಎಣ್ಣೆ ಹೊಡೆಯೋಣ? (enne hodeyona?), shall we have a drink? Cooking oil is the first meaning."
