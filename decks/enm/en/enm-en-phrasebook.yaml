"name": "Phrasebook: first phrases"
"description": "Nineteen things to say from the first day, in Chaucerian London English: greetings, thanks and sorry, asking for help, and saying you do not understand. Several phrases are conventional, not checked in a text (marked in their notes). Not yet checked by a medievalist: please report any mistake."
