"cards":
  "enm-0011":
    "native": "Good luck; farewell."
    "notes":
      "n1": "God speed: a parting wish. Attested in Middle English."
  "enm-0012":
    "native": "God save you."
    "notes":
      "n1": "God save you: a greeting or parting. Attested in Middle English."
  "enm-0013":
    "native": "Well be you (greeting)."
    "notes":
      "n1": "Well be you: a greeting. The words are attested; the phrase is conventional, not checked in a text."
  "enm-0014":
    "native": "Good morning."
    "notes":
      "n1": "Good morning. Attested in Middle English."
  "enm-0015":
    "native": "Good night."
    "notes":
      "n1": "Good night. The words are attested; the phrase is conventional."
  "enm-0016":
    "native": "Thank you; many thanks."
    "notes":
      "n1": "Great thanks: the usual Middle English thank you, attested in Chaucer."
  "enm-0017":
    "native": "Please; I pray you."
    "notes":
      "n1": "I pray you: the usual way to ask a favour. Attested."
  "enm-0018":
    "native": "Forgive me."
    "notes":
      "n1": "Forgive me: the imperative of forgiven, to forgive. Attested."
  "enm-0019":
    "native": "I do not understand."
    "notes":
      "n1": "I do not understand: ne and nat make the negative. The words are attested; the sentence is conventional."
  "enm-0020":
    "native": "Do you speak English?"
    "notes":
      "n1": "Do you speak English? Conventional, built from attested words; not checked in a text."
  "enm-0021":
    "native": "Help me!"
    "notes":
      "n1": "Help me: the imperative of helpen, to help. Attested."
  "enm-0022":
    "native": "How much?"
    "notes":
      "n1": "How much? Hou is how and moche is much. Conventional phrase; the words are attested."
  "enm-0023":
    "native": "Where is the way?"
    "notes":
      "n1": "Where is the way? Conventional, built from attested words."
  "enm-0024":
    "native": "What is your name?"
    "notes":
      "n1": "What is your name? Conventional, built from attested words."
  "enm-0025":
    "native": "My name is Anne."
    "notes":
      "n1": "My name is Anne. Anne is an example name; the sentence is conventional."
  "enm-0026":
    "native": "You are welcome."
    "notes":
      "n1": "You are welcome: ben is the plural of be. The words are attested; the phrase is conventional."
  "enm-0027":
    "native": "Let me pass."
    "notes":
      "n1": "Let me pass: the imperative of laten, to let. The words are attested; the phrase is conventional."
  "enm-0028":
    "native": "Say it again, please."
    "notes":
      "n1": "Say it again, please. The words are attested; the sentence is conventional."
  "enm-0029":
    "native": "Thanks."
    "notes":
      "n1": "Thanks, from grant merci. Attested in Middle English."
