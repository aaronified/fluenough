"schema": 1
"id": "enm-en-first-words"
"kind": "layer"
"core": "enm-first-words"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "First words"
"description": "Ten words to start with: yes and no, I and you, water, good, one, two, here and and. Chaucerian London English, in Latin letters. The pronunciation is reconstructed and the spelling is not standard. Not yet checked by a medievalist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "enm-0001":
    "native": "Yes, you are good."
    "notes":
      "n1": "Yis is yes in Chaucer's London English. The no is nay, on the next card."
    "examples":
      "Yis, I understonde.":
        "native": "Yes, I understand."
        "bases":
          "Yis": "yes"
          "I": "I"
          "understonde": "understand (I understand)"
      "Yis, thou art goode.":
        "native": "Yes, you are good."
        "bases":
          "Yis": "yes"
          "thou": "you"
          "art": "are"
          "goode": "good"
  "enm-0002":
    "native": "No, you are not here."
    "notes":
      "n1": "Nay is no. Nat is not, and it goes after a verb: thou art nat heere, you are not here."
    "examples":
      "Nay, I have no water.":
        "native": "No, I have no water."
        "bases":
          "Nay": "no"
          "I": "I"
          "have": "have (I have)"
          "no": "no; none"
          "water": "water"
      "Nay, thou art nat heere.":
        "native": "No, you are not here."
        "bases":
          "Nay": "no"
          "thou": "you"
          "art": "are"
          "nat": "not"
          "heere": "here"
  "enm-0003":
    "native": "I drink water."
    "notes":
      "n1": "I is I, as in Modern English."
    "examples":
      "I am heere.":
        "native": "I am here."
        "bases":
          "I": "I"
          "am": "am"
          "heere": "here"
      "I drynke water.":
        "native": "I drink water."
        "bases":
          "I": "I"
          "drynke": "drink (I drink)"
          "water": "water"
  "enm-0004":
    "native": "What do you say?"
    "notes":
      "n1": "Thou is you to one person, the form for a friend or a child. To more than one, or to a stranger, the form is ye."
    "examples":
      "Thou art good.":
        "native": "You are good."
        "bases":
          "Thou": "you"
          "art": "are"
          "good": "good"
      "What seyst thou?":
        "native": "What do you say?"
        "bases":
          "What": "what"
          "seyst": "say (you say)"
          "thou": "you"
  "enm-0005":
    "native": "Water is good."
    "notes":
      "n1": "Water is water. Chaucer's spelling varies; this deck uses water."
    "examples":
      "Yif me water.":
        "native": "Give me water."
        "bases":
          "Yif": "give (give!)"
          "me": "me"
          "water": "water"
      "Water is good.":
        "native": "Water is good."
        "bases":
          "Water": "water"
          "is": "is"
          "good": "good"
  "enm-0006":
    "native": "A good wife."
    "notes":
      "n1": "Good is good. In a noun phrase it takes the article a before it: a good man."
    "examples":
      "A good man.":
        "native": "A good man."
        "bases":
          "A": "a; one"
          "good": "good"
          "man": "man"
      "A good wyf.":
        "native": "A good wife."
        "bases":
          "A": "a; one"
          "good": "good"
          "wyf": "wife"
  "enm-0007":
    "native": "One year."
    "notes":
      "n1": "Oon is one. Two is on the next card."
    "examples":
      "Oon man.":
        "native": "One man."
        "bases":
          "Oon": "one"
          "man": "man"
      "Oon yeer.":
        "native": "One year."
        "bases":
          "Oon": "one"
          "yeer": "year"
  "enm-0008":
    "native": "Two days."
    "notes":
      "n1": "Two is two in the spelling of Chaucer's time."
    "examples":
      "Two men.":
        "native": "Two men."
        "bases":
          "Two": "two"
          "men": "men"
      "Two dayes.":
        "native": "Two days."
        "bases":
          "Two": "two"
          "dayes": "days"
  "enm-0009":
    "native": "Here is water."
    "notes":
      "n1": "Heere is here. Ther is there."
    "examples":
      "Heere is a hous.":
        "native": "Here is a house."
        "bases":
          "Heere": "here"
          "is": "is"
          "a": "a; one"
          "hous": "house"
      "Heere is water.":
        "native": "Here is water."
        "bases":
          "Heere": "here"
          "is": "is"
          "water": "water"
  "enm-0010":
    "native": "You and I."
    "notes":
      "n1": "And is and, joining words and clauses."
    "examples":
      "Water and breed.":
        "native": "Water and bread."
        "bases":
          "Water": "water"
          "and": "and"
          "breed": "bread"
      "Thou and I.":
        "native": "You and I."
        "bases":
          "Thou": "you"
          "and": "and"
          "I": "I"
