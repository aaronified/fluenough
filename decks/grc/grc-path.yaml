# The order Ancient Greek (Classical Attic) is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner from
# English is taught grc-en-<name> for grc-<name> (ADR-0013, ADR-0036).
#
# This is also Ancient Greek (Classical Attic)'s B1 plan (docs/DECK-FORMAT.md, "The B1 plan"): every
# unit from the first words to B1, with its size in words, its grammar
# topics, the three milestones, and for each planned unit its listening
# and reading passages. The file is written by tools/gen_planned_paths.py
# from the unit template of the language-paths scheme
# (wiki/Plan-Language-Paths-Scheme.md) and the grammar of the language's
# family; edit the generator's data, or take a unit over by hand once its
# deck is written (#959).
#
# Unit 1 is written: the phrasebook and the first words (10 words). Every
# other unit is planned, so the course teaches each as "Coming" until its
# deck is written. The passages are placeholders: each describes its unit's
# theme or grammar and is reworded when the passage is written.
#
# From the scheme, for this language: A reading course in the Attic of Plato, Xenophon and Aristophanes.
#
# A reading course (owner, 2026-10-31): Ancient Greek (Classical Attic) has no living speakers, so
# the milestones A1, A2 and B1 mean three reading levels, and the sizes
# are `levels` (400, 600 and 900 words, a judgement,
# low confidence) in place of the plan's 700, 900 and 1,200. Themes of
# modern life are left out.
#
# `alphabet` is empty: the validator takes only written decks there. When
# the script decks are written, they are listed in it.
# The script is taught in the units named `script`, after the first six
# themes, as the scheme has it.
schema: 1
kind: "path"
id: "grc-path"
language: "grc"
description: "Ancient Greek (Classical Attic): the planned path to B1. Only the phrasebook and the first words are written."
genders: ["m", "f", "n"]
levels: { A1: 400, A2: 600, B1: 900 }
alphabet: []
