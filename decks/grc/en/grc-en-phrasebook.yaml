"name": "Phrasebook: first phrases"
"description": "Fifteen things to say from the first day, from Plato, Xenophon and Aristophanes: greetings, how are you, thanks, oaths of agreement, calls to act, and I do not understand. Polytonic spelling. The reading and the IPA are as in the first-words deck (a transliteration in ISO 843 style; broad reconstructed IPA for about the fifth century BC). Each card's note says whether it is attested or conventional. Not yet checked by a Hellenist: please report any mistake."
