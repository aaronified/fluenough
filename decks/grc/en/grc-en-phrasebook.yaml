"tags":
- "unreviewed"
"cards":
  "grc-0011":
    "native": "Hello; goodbye."
    "notes":
      "n1": "Chaîre, rejoice, is the greeting to one person, and also used on parting. Attested in Plato and in comedy."
  "grc-0012":
    "native": "Hello, all of you."
    "notes":
      "n1": "Chaírete is chaîre to more than one person. Attested."
  "grc-0013":
    "native": "Goodbye; be well."
    "notes":
      "n1": "Hygíaine is be healthy, used as a farewell. Attested in Greek, but conventional here as the everyday goodbye; a scholar should confirm its range in the fifth and fourth centuries."
  "grc-0014":
    "native": "How are you?"
    "notes":
      "n1": "Literally how do you hold yourself. Attested in Plato and Xenophon."
  "grc-0015":
    "native": "I am well."
    "notes":
      "n1": "Literally I hold well. Attested; the usual answer to how are you."
  "grc-0016":
    "native": "What is your name?"
    "notes":
      "n1": "Literally what name to you. In this form it is a conventional textbook phrase built on the attested ti ónoma; a scholar should check the word order."
  "grc-0017":
    "native": "Thank you."
    "notes":
      "n1": "Literally I know thanks, I am grateful. Attested in Plato and Xenophon; usually with polle (much) or a name."
  "grc-0018":
    "native": "Yes, by Zeus."
    "notes":
      "n1": "The common oath of agreement. Attested in Plato and in comedy."
  "grc-0019":
    "native": "No, by Zeus."
    "notes":
      "n1": "The common oath of denial. Attested in comedy and prose."
  "grc-0020":
    "native": "Come here."
    "notes":
      "n1": "Deûro is the call come here. Attested in Plato and in drama."
  "grc-0021":
    "native": "Come on then."
    "notes":
      "n1": "Áge dḗ is come on, now. Attested in Plato and in comedy."
  "grc-0022":
    "native": "Listen."
    "notes":
      "n1": "Ákoue is listen. Attested in Plato and Xenophon."
  "grc-0023":
    "native": "I do not understand."
    "notes":
      "n1": "Literally I do not learn, I do not take it in. Attested in Plato and in comedy."
  "grc-0024":
    "native": "What are you saying?"
    "notes":
      "n1": "Literally what do you say. Attested very often in Plato's dialogues."
  "grc-0025":
    "native": "Forgive me; I am sorry."
    "notes":
      "n1": "Literally have pardon. The idiom syngnṓmēn échein, to forgive, is attested; this imperative as a short apology is conventional."
