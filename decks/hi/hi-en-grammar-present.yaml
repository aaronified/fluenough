        "मैं (f)": "जाती हूँ"
        "तुम (m)": "जाते हो"
        "तुम (f)": "जाती हो"
        "वह (m)": "जाता है"
        "वह (f)": "जाती है"
        "हम (m)": "जाते हैं"
        "हम (f)": "जाती हैं"
        "आप (m)": "जाते हैं"
        "आप (f)": "जाती हैं"
        "वे (m)": "जाते हैं"
        "वे (f)": "जाती हैं"
      readings:
        "मैं (m)": "jātā hūm̐"
        "मैं (f)": "jātī hūm̐"
        "तुम (m)": "jātē hō"
        "तुम (f)": "jātī hō"
        "वह (m)": "jātā hai"
        "वह (f)": "jātī hai"
        "हम (m)": "jātē haim̐"
        "हम (f)": "jātī haim̐"
