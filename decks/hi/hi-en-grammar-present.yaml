schema: 1
id: hi-en-grammar-present
name: "Present tense"
kind: grammar
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I go, she speaks: the everyday present, by person and gender."
tags: [beginner, grammar]
pattern:
  name: "Present habitual"
  slot_name: "person and gender"
  slots: ["मैं (m)", "मैं (f)", "तुम (m)", "तुम (f)", "वह (m)", "वह (f)", "हम (m)", "हम (f)", "आप (m)", "आप (f)", "वे (m)", "वे (f)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The verb's stem, then -ता (-tā), -ती (-tī) or -ते (-tē) for the doer's gender and number, then हूँ (hūm̐), हो (hō), है (hai) or हैं (haim̐). वह (vah), हम (ham), आप (āp) and वे (vē) do not show gender; the verb does."
