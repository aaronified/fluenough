schema: 1
id: hi-en-script-conjuncts
name: "Hindi conjuncts"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Two consonants with no vowel between them join: the first is usually written as a half letter, without its upright stroke. Four join in their own shapes."
tags: [beginner, unreviewed, script]
cards:
  - id: hi-en-script-conjuncts-0001
    target: "क्ष"
    native: "k + curled-back sh (ksh)"
    reading: "ksha"
    notes: "Its own shape, nothing like its parts: क्षमा (kshamaa, forgiveness)."
  - id: hi-en-script-conjuncts-0002
    target: "त्र"
    native: "t + r (tr)"
    reading: "tra"
    notes: "Its own shape, त joined with र: मित्र (mitr, friend)."
  - id: hi-en-script-conjuncts-0003
    target: "ज्ञ"
    native: "j + ny, said gy"
    reading: "gya"
    notes: "Its own shape, said 'g' with a 'y' glide in Hindi: ज्ञान (gyaan, knowledge)."
  - id: hi-en-script-conjuncts-0004
    target: "श्र"
    native: "sh + r (shr)"
    reading: "shra"
    notes: "Its own shape: श्रम (shram, labour)."
  - id: hi-en-script-conjuncts-0005
    target: "प्र"
    native: "p + r (the r stroke)"
    reading: "pra"
    notes: "A र after a consonant is a small slanting stroke at its foot: प्रेम (prem, love)."
  - id: hi-en-script-conjuncts-0006
    target: "ट्र"
    native: "curled-back t + r"
    reading: "tra"
    notes: "After ट or ड, र is written as a small caret below: ट्रेन (tren, train)."
  - id: hi-en-script-conjuncts-0007
    target: "र्म"
    native: "r + m (the reph)"
    reading: "rma"
    notes: "A र before another consonant is a small hook above that consonant, the reph: धर्म (dharm, religion)."
  - id: hi-en-script-conjuncts-0008
    target: "क्क"
    native: "k + k (half क)"
    reading: "kka"
    notes: "The first क loses its stroke and joins the second: पक्का (pakkaa, firm; certain)."
  - id: hi-en-script-conjuncts-0009
    target: "च्च"
    native: "ch + ch (half च)"
    reading: "chcha"
    notes: "Half च joined to च: बच्चा (bachchaa, child)."
  - id: hi-en-script-conjuncts-0010
    target: "त्त"
    native: "t + t (half त)"
    reading: "tta"
    notes: "Half त joined to त: पत्ता (pattaa, leaf)."
  - id: hi-en-script-conjuncts-0011
    target: "स्त"
    native: "s + t (half स)"
    reading: "sta"
    notes: "Half स joined to त: नमस्ते (namaste, hello)."
  - id: hi-en-script-conjuncts-0012
    target: "स्क"
    native: "s + k (half स)"
    reading: "ska"
    notes: "Half स joined to क: स्कूल (skuul, school)."
  - id: hi-en-script-conjuncts-0013
    target: "न्द"
    native: "n + d (half न)"
    reading: "nda"
    notes: "Half न joined to द: हिन्दी (hindii, Hindi). Often written with the anusvaar instead: हिंदी."
  - id: hi-en-script-conjuncts-0014
    target: "द्ध"
    native: "d + dh"
    reading: "ddha"
    notes: "द and ध joined, one above the other: शुद्ध (shuddh, pure)."
  - id: hi-en-script-conjuncts-0015
    target: "ल्ल"
    native: "l + l (half ल)"
    reading: "lla"
    notes: "Half ल joined to ल: उल्लू (ulluu, owl)."
  - id: hi-en-script-conjuncts-0016
    target: "प्य"
    native: "p + y (half प)"
    reading: "pya"
    notes: "Half प joined to य: प्यार (pyaar, love)."
  - id: hi-en-script-conjuncts-0017
    target: "क्य"
    native: "k + y (half क)"
    reading: "kya"
    notes: "Half क joined to य: क्या (kyaa, what)."
