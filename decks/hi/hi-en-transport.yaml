schema: 1
id: hi-en-transport
name: "Bus, auto, cab"
kind: vocab
theme: transport
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Getting a ride, agreeing the fare and getting off where you want."
tags: [beginner]
cards:
  - id: hi-0262
    target: "बस"
    native: "bus"
    reading: "bas"
    ipa: "bəs"
    pos: "noun"
    gender: "f"
    notes: "Feminine: बस आ गई (bas ā gaī), the bus has come. It also means 'enough'."
  - id: hi-0263
    target: "ऑटो"
    native: "auto-rickshaw"
    reading: "ôṭō"
    ipa: "ɔʈoː"
    alt_target: ["आटो"]
    pos: "noun"
    gender: "m"
  - id: hi-0264
    target: "टैक्सी"
    native: "taxi"
    reading: "ṭaiksī"
    ipa: "ʈɛːksiː"
    pos: "noun"
    gender: "f"
  - id: hi-0265
    target: "किराया"
    native: "fare; rent"
    reading: "kirāyā"
    ipa: "kɪraːjaː"
    pos: "noun"
    gender: "m"
    notes: "किराया कितना है (kirāyā kitnā hai)? What's the fare?"
  - id: hi-0266
    target: "मीटर से चलिए।"
    native: "Please go by the meter."
    reading: "mīṭar sē caliē."
    ipa: "miːʈər seː tʃəlɪeː"
    pos: "phrase"
    tags: ["polite"]
    notes: "Ask before you get in. If the driver refuses, agree the fare first."
  - id: hi-0267
    target: "स्टेशन जाना है।"
    native: "I need to go to the station."
    reading: "sṭēśan jānā hai."
    ipa: "sʈeːʃən dʒaːnaː ɦɛː"
    pos: "phrase"
    notes: "Put any place before जाना है (jānā hai): एयरपोर्ट जाना है (ēyrpōrṭ jānā hai), I need to go to the airport."
  - id: hi-0268
    target: "कितनी देर लगेगी?"
    native: "How long will it take?"
    reading: "kitnī dēr lagēgī?"
    ipa: "kɪt̪niː d̪eːr ləɡeːɡiː"
    pos: "phrase"
  - id: hi-0269
    target: "यहाँ रोकिए।"
    native: "Stop here, please."
    reading: "yahām̐ rōkiē."
    ipa: "jəɦãː roːkɪeː"
    pos: "phrase"
    tags: ["polite"]
  - id: hi-0270
    target: "स्टेशन"
    native: "station"
    reading: "sṭēśan"
    ipa: "sʈeːʃən"
    pos: "noun"
    gender: "m"
  - id: hi-0271
    target: "टिकट"
    native: "ticket"
    reading: "ṭikaṭ"
    ipa: "ʈɪkəʈ"
    pos: "noun"
    gender: "m"
    notes: "Some speakers make it feminine."
  - id: hi-0272
    target: "सीट"
    native: "seat"
    reading: "sīṭ"
    ipa: "siːʈ"
    pos: "noun"
    gender: "f"
  - id: hi-0273
    target: "चलिए"
    native: "let's go; please go"
    reading: "caliē"
    ipa: "tʃəlɪeː"
    pos: "verb"
    tags: ["polite"]
