cards:
  - id: "hi-0853"
    target: "मैं रोज़ सुबह धीरे चलता हूँ।"
    target_scripts: { perso_arabic: "میں روز صبح آہستہ چلتا ہوں۔" }
    reading: "maim̐ rōz subah dhīrē caltā hūm̐."
    ipa: "mɛ̃ː roːz sʊbəɦ d̪ʱiːreː tʃəlt̪aː ɦũː"
    pos: "phrase"
    bases:
      - { word: "चलता", base: "चलना", reading: "calnā" }
      - { word: "हूँ", ref: "hi-0780" }
    confusables:
      - { id: "w1", word: "दौड़ता", reading: "dauṛtā", ipa: "d̪ɔːɽt̪aː", kind: "word" }
      - { id: "f1", word: "चलती", reading: "caltī", ipa: "tʃəlt̪iː", kind: "form" }
  - id: "hi-0854"
    target: "वह हमेशा सही बोलता है।"
    target_scripts: { perso_arabic: "وہ ہمیشہ صحیح بولتا ہے۔" }
    reading: "vah hamēśā sahī bōltā hai."
    ipa: "ʋəɦ ɦəmeːʃaː səɦiː boːlt̪aː ɦɛː"
    pos: "phrase"
    bases:
      - { word: "बोलता", base: "बोलना", reading: "bōlnā" }
      - { word: "है", ref: "hi-0780" }
    confusables:
      - { id: "w1", word: "गलत", reading: "galat", ipa: "ɡələt̪", kind: "word" }
      - { id: "f1", word: "बोलती", reading: "bōltī", ipa: "boːlt̪iː", kind: "form" }
  - id: "hi-0855"
    target: "क्या तुम कभी-कभी फ़िल्म देखते हो?"
    target_scripts: { perso_arabic: "کیا تم کبھی کبھی فلم دیکھتے ہو؟" }
    reading: "kyā tum kabhī-kabhī film dēkhtē hō?"
    ipa: "kjaː t̪ʊm kəbʱiːkəbʱiː fɪlm d̪eːkʰt̪eː ɦoː"
    pos: "phrase"
    bases:
      - { word: "फ़िल्म", base: "फ़िल्म", reading: "film" }
      - { word: "देखते", base: "देखना", reading: "dēkhnā" }
      - { word: "हो", ref: "hi-0780" }
      - { word: "कभी", base: "कभी", reading: "kabhī" }
    confusables:
      - { id: "w1", word: "सुनते", reading: "suntē", ipa: "sʊnt̪eː", kind: "word" }
      - { id: "f1", word: "देखती", reading: "dēkhtī", ipa: "d̪eːkʰt̪iː", kind: "form" }
  - id: "hi-0856"
    target: "मेरा दोस्त पहले यहाँ रहता था।"
    target_scripts: { perso_arabic: "میرا دوست پہلے یہاں رہتا تھا۔" }
    reading: "mērā dōst pahlē yahām̐ rahtā thā."
    ipa: "meːraː d̪oːst̪ pəɦleː jəɦãː rəɦt̪aː t̪ʰaː"
    pos: "phrase"
    bases:
      - { word: "रहता", base: "रहना", reading: "rahnā" }
      - { word: "था", base: "होना", reading: "hōnā" }
    confusables:
      - { id: "w1", word: "आगे", reading: "āgē", ipa: "aːɡeː", kind: "word" }
      - { id: "f1", word: "रहती", reading: "rahtī", ipa: "rəɦt̪iː", kind: "form" }
  - id: "hi-0857"
    target: "अभी-अभी बारिश रुकी है।"
    target_scripts: { perso_arabic: "ابھی ابھی بارش رکی ہے۔" }
    reading: "abhī-abhī bāriś rukī hai."
    ipa: "əbʱiːəbʱiː baːrɪʃ rʊkiː ɦɛː"
    pos: "phrase"
    bases:
      - { word: "बारिश", base: "बारिश", reading: "bāriś" }
      - { word: "रुकी", base: "रुकना", reading: "ruknā" }
      - { word: "है", ref: "hi-0780" }
    confusables:
