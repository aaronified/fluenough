      - { word: "रोज़", ref: "hi-0451" }
      - { word: "साथ", ref: "hi-0838" }
      - { word: "मिलते", base: "मिलना", reading: "milnā" }
      - { word: "हैं", ref: "hi-0780" }
    confusables:
      - { id: "w1", word: "अलग", reading: "alag", ipa: "ələɡ", kind: "word" }
      - { id: "f1", word: "मिलतीं", reading: "miltīm̐", ipa: "mɪlt̪ĩː", kind: "form" }
  - id: "hi-0859"
    target: "उसने सचमुच बहुत अच्छा काम किया।"
    target_scripts: { perso_arabic: "اس نے سچ مچ بہت اچھا کام کیا۔" }
    reading: "usnē sacmuc bahut acchā kām kiyā."
    ipa: "ʊsneː sətʃmʊtʃ bəɦʊt̪ ətʃtʃʰaː kaːm kɪjaː"
    pos: "phrase"
    bases:
