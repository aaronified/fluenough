      - { id: "f1", word: "रुका", reading: "rukā", ipa: "rʊkaː", kind: "form" }
  - id: "hi-0858"
    target: "वे दोनों रोज़ साथ मिलते हैं।"
    target_scripts: { perso_arabic: "وہ دونوں روز ساتھ ملتے ہیں۔" }
    reading: "vē dōnōm̐ rōz sāth miltē haim̐."
    ipa: "ʋeː d̪oːnõː roːz saːt̪ʰ mɪlt̪eː ɦɛ̃ː"
    pos: "phrase"
    bases:
