      - { word: "बहुत", base: "बहुत", reading: "bahut" }
      - { word: "अच्छा", base: "अच्छा", reading: "acchā" }
      - { word: "किया", base: "करना", reading: "karnā" }
    confusables:
      - { id: "w1", word: "बुरा", reading: "burā", ipa: "bʊraː", kind: "word" }
      - { id: "f1", word: "अच्छी", reading: "acchī", ipa: "ətʃtʃʰiː", kind: "form" }
  - id: "hi-0860"
    target: "पहले मैं ऐसे करता था।"
    target_scripts: { perso_arabic: "پہلے میں ایسے کرتا تھا۔" }
    reading: "pahlē maim̐ aisē kartā thā."
    ipa: "pəɦleː mɛ̃ː ɛːseː kərt̪aː t̪ʰaː"
    pos: "phrase"
    bases:
      - { word: "करता", base: "करना", reading: "karnā" }
      - { word: "था", base: "होना", reading: "hōnā" }
    confusables:
