name: "Need and want"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "चाहिए, ज़रूरत and चाहना: saying what you need and what you want. Not yet checked by a Hindi speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - ref: hi-0336
  - id: hi-0460
    target: "चाहिए"
    native: "is needed; is wanted"
    reading: "cāhiē"
    ipa: "tʃaːɦɪeː"
    pos: "verb"
    notes: "It stays the same whoever needs it: मुझे, तुम्हें, उसे, आपको … चाहिए."
  - id: hi-0461
    target: "आपको क्या चाहिए?"
    native: "What do you need? (what a shopkeeper asks)"
    reading: "āpkō kyā cāhiē?"
    ipa: "aːpkoː kjaː tʃaːɦɪeː"
    pos: "phrase"
  - id: hi-0462
    target: "मुझे और कुछ नहीं चाहिए।"
    native: "I don't need anything else."
    reading: "mujhē aur kuch nahīm̐ cāhiē."
    ipa: "mʊdʒʱeː ɔːr kʊtʃʰ nəɦĩː tʃaːɦɪeː"
    pos: "phrase"
  - id: hi-0463
    target: "नहीं चाहिए, धन्यवाद।"
    native: "I don't need it, thanks."
    reading: "nahīm̐ cāhiē, dhanyavād."
    ipa: "nəɦĩː tʃaːɦɪeː d̪ʱənjəʋaːd̪"
    pos: "phrase"
  - id: hi-0464
    target: "ज़रूरत"
    native: "need"
    reading: "zarūrat"
    ipa: "zəruːrət̪"
    alt_target: ["जरूरत"]
    pos: "noun"
    gender: "f"
  - id: hi-0465
    target: "मुझे मदद की ज़रूरत है।"
    native: "I need some help."
    reading: "mujhē madad kī zarūrat hai."
    ipa: "mʊdʒʱeː məd̪əd̪ kiː zəruːrət̪ ɦɛː"
    pos: "phrase"
    notes: "'To me there is a need of help': the thing needed takes की."
  - id: hi-0466
    target: "ज़रूरत नहीं है।"
    native: "There's no need."
    reading: "zarūrat nahīm̐ hai."
    ipa: "zəruːrət̪ nəɦĩː ɦɛː"
    pos: "phrase"
  - id: hi-0467
    target: "मैं एक कप चाय चाहता हूँ।"
    native: "I want a cup of tea. (said by a man)"
    reading: "maim̐ ēk kap cāy cāhtā hūm̐."
    ipa: "mɛ̃ː eːk kəp tʃaːj tʃaːɦt̪aː ɦũː"
    pos: "phrase"
    notes: "A woman says चाहती हूँ (cāhtī hūm̐). चाहिए is softer and more usual for asking."
  - id: hi-0468
    target: "वह और समय चाहती है।"
    native: "She wants more time."
    reading: "vah aur samay cāhtī hai."
    ipa: "ʋəɦ ɔːr səməj tʃaːɦt̪iː ɦɛː"
    pos: "phrase"
