# How Devanagari, Hindi's script, works: the recurring features a learner
# from English misses, shown before the first letters and from a script
# deck's Tips. See ADR-0016 and docs/DECK-FORMAT.md.
schema: 1
kind: script
id: hi-script
language: hi
name: "How Devanagari works"
intro: "Hindi is written in Devanagari, a script built from a few ideas that come back in letter after letter. They look strange at first because English has none of them. Once you have seen them, the letters start to make sense."
features:
  - id: headline
    name: "The headline"
    term: "शिरोरेखा"
    reading: "śirōrēkhā"
    ipa: "ʃɪroːreːkʰaː"
    example: "क"
    text: "Most letters hang from a line along the top, and in a word the lines join into one. Read along the top, not along a baseline as in English."
    letters: ["क", "ग", "त", "न", "म", "ल", "स"]
  - id: headline-gap
    name: "A gap in the headline"
    example: "ध"
    text: "In a few letters the line breaks, and the gap is what tells them from a look-alike: ध (dha) from घ (gha), and भ (bha) from म (ma)."
    letters: ["थ", "ध", "भ", "श"]
  - id: stem
    name: "The standing line"
    term: "खड़ी पाई"
    reading: "khaṛī pāī"
    ipa: "kʰəɽiː paːiː"
    example: "ग"
    text: "Most letters have an upright line on the right. A letter drops it to become a half letter when it joins the next one: प्यार (pyār), बच्चा (baccā)."
    letters: ["ग", "प", "म", "स", "ल", "ब"]
  - id: rows
    name: "Rows of five"
    term: "वर्ग"
    reading: "varg"
    ipa: "ʋərɡ"
    example: "क"
    text: "Most consonants come in five rows of five, each named after its first letter: क-वर्ग (ka-varg), च-वर्ग (ca-varg), ट-वर्ग (ṭa-varg), त-वर्ग (ta-varg) and प-वर्ग (pa-varg). Each row is made in about one place in the mouth: क (ka) at the back, च (ca) against the palate, ट (ṭa) with the tongue curled back, त (ta) on the teeth, प (pa) at the lips. The columns work the same way in every row: plain (क), with a breath (ख), voiced (ग), voiced with a breath (घ), and through the nose (ङ). ङ (ṅa) and ञ (ña) are rare: ङ (ṅa) is usually written as the anusvar ं (am̐), as in गंगा (gaṅgā), and ञ (ña) is seen almost only in conjuncts, such as ज्ञ (gya)."
    letters: ["क", "ख", "ग", "घ", "ङ", "च", "छ", "ज", "झ", "ञ", "ट", "ठ", "ड", "ढ", "ण", "त", "थ", "द", "ध", "न", "प", "फ", "ब", "भ", "म"]
  - id: inherent-vowel
    name: "The vowel you don't see"
    example: "क"
    text: "Every consonant carries a short a, said like the u of 'but', unless a sign changes it: क (ka) alone is ka."
    letters: ["क", "कल", "कमल"]
  - id: final-a
    name: "The last a usually isn't said"
    example: "घर"
    text: "At the end of most words the carried a goes quiet: घर (ghar) is ghar, कमल (kamal) is kamal. Inside long words it can go quiet too, so learn each word as it's said."
    letters: ["घर", "कमल", "नमक"]
  - id: vowel-signs
    name: "Vowels as signs on a letter"
    term: "मात्रा"
    reading: "mātrā"
    ipa: "maːt̪raː"
    example: "कि"
    text: "After a consonant a vowel is a sign on it, not a letter of its own. ि (i) is written before the consonant but said after it: you see ि (i) then क (ka), and say ki. े (ē) and ै (ai) sit above, ु (u), ू (ū) and ृ (ri) below, the rest after."
    letters: ["का", "कि", "की", "कु", "के", "को"]
  - id: half-letters
    name: "Half letters"
    term: "आधा अक्षर"
    reading: "ādhā akśar"
    ipa: "aːd̪ʱaː əkʃər"
    example: "प्य"
    text: "Two consonants with no vowel between them join. Usually the first is written as a half letter, without its standing line: प्यार (pyār, love). क (ka) drops the hook on its right instead (क्य). Letters with no standing line stack, one above the other: द्ध (ddha), ट्ट (ṭṭ)."
    letters: ["क्य", "प्य", "स्त", "च्च", "द्ध"]
  - id: halant
    name: "The mark that takes the vowel away"
    term: "हलंत"
    reading: "halant"
    ipa: "ɦələnt̪"
    example: "क्"
    text: "The small slanting stroke below a letter, ्, means no vowel after it. You'll rarely see it, because two consonants usually join instead."
    letters: ["क्", "द्", "ट्"]
  - id: own-shapes
    name: "Four joins with shapes of their own"
    example: "क्ष"
    text: "Four joins look nothing like their parts: क्ष (kśa) is क (ka) and ष (śa), त्र (tra) is त (ta) and र (ra), ज्ञ (gya) is ज (ja) and ञ (ña), श्र (śra) is श (śa) and र (ra)."
    letters: ["क्ष", "त्र", "ज्ञ", "श्र"]
  - id: r-forms
    name: "र (ra) written as a stroke"
    example: "प्र"
    text: "Next to another consonant र (ra) isn't written in full. After it, it's a slanting stroke at its foot (प्र), or a small caret under a letter with no standing line, such as ट (ṭa) and ड (ḍa) (ट्र (ṭra)); before it, a small hook on top, the reph (धर्म)."
    letters: ["प्र", "क्र", "ट्र", "र्म"]
  - id: dot-below
    name: "A dot below makes another sound"
    term: "नुक़्ता"
    reading: "nuqtā"
    ipa: "nʊqt̪aː"
    example: "ज़"
    text: "A dot below a letter, the nukta, marks a sound from Persian, Arabic or English: ज (ja) is j and ज़ (za) is z, फ (pha) is ph and फ़ (fa) is f. ड़ (ṛa) and ढ़ (ṛha) have the same dot but are Hindi's own sounds: the tongue is placed as for ड (ḍa) and ढ (ḍha), but doesn't touch the roof of the mouth."
    letters: ["ज", "ज़", "फ", "फ़", "ड", "ड़", "ढ", "ढ़"]
  - id: nasal-marks
    name: "The moon and the dot"
    term: "चंद्रबिंदु"
    reading: "candrabindu"
    ipa: "tʃənd̪rəbɪnd̪ʊ"
    example: "हँ"
    text: "The moon and dot ँ (am̐) above a letter makes its vowel nasal, said through the nose as well. The dot alone, ं (am̐), the anusvar, is an n or m before the next consonant, and stands for the moon where a sign above leaves no room."
    letters: ["हँ", "में", "रंग"]
  - id: look-alikes
    name: "Letters that look alike"
    example: "ख"
    text: "A few letters are easy to mix up: ब (ba) has a line across it that व (va) doesn't; ष (śa) is प (pa) with a stroke through it; and ख (kha) looks like र (ra) and व (va) side by side."
    letters: ["ब", "व", "प", "ष", "ख"]
  - id: digits
    name: "Devanagari digits"
    example: "४"
    text: "Devanagari has its own digits, seen on some signs, in older books and on official papers. Everyday Hindi mostly writes 0 to 9. ४ (4) is 4, though it looks like an 8, and १ (1) and ९ (9) look alike."
    letters: ["०", "१", "२", "३", "४", "५", "६", "७", "८", "९"]
