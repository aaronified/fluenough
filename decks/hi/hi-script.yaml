    term: "नुक़्ता"
    reading: "nuqtā"
    ipa: "nʊqt̪aː"
    example: "ज़"
    letters: ["ज", "ज़", "फ", "फ़", "ड", "ड़", "ढ", "ढ़"]
  - id: "nasal-marks"
    term: "चंद्रबिंदु"
    reading: "candrabindu"
    ipa: "tʃənd̪rəbɪnd̪ʊ"
    example: "हँ"
    letters: ["हँ", "में", "रंग"]
  - id: "look-alikes"
    example: "ख"
    letters: ["ब", "व", "प", "ष", "ख"]
  - id: "digits"
    example: "४"
    letters: ["०", "१", "२", "३", "४", "५", "६", "७", "८", "९"]
