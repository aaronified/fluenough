# How Devanagari, Hindi's script, works: the recurring features a learner
# from English misses, shown before the first letters and from a script
# deck's Tips. See ADR-0016 and docs/DECK-FORMAT.md.
schema: 1
kind: "script"
part: "core"
id: "hi-script"
language: "hi"
features:
  - id: "headline"
    term: "शिरोरेखा"
    reading: "śirōrēkhā"
    ipa: "ʃɪroːreːkʰaː"
    example: "क"
    letters: ["क", "ग", "त", "न", "म", "ल", "स"]
  - id: "headline-gap"
    example: "ध"
    letters: ["थ", "ध", "भ", "श"]
  - id: "stem"
    term: "खड़ी पाई"
    reading: "khaṛī pāī"
    ipa: "kʰəɽiː paːiː"
    example: "ग"
    letters: ["ग", "प", "म", "स", "ल", "ब"]
  - id: "rows"
    term: "वर्ग"
    reading: "varg"
    ipa: "ʋərɡ"
    example: "क"
    letters: ["क", "ख", "ग", "घ", "ङ", "च", "छ", "ज", "झ", "ञ", "ट", "ठ", "ड", "ढ", "ण", "त", "थ", "द", "ध", "न", "प", "फ", "ब", "भ", "म"]
  - id: "inherent-vowel"
    example: "क"
    letters: ["क", "कल", "कमल"]
  - id: "final-a"
    example: "घर"
    letters: ["घर", "कमल", "नमक"]
  - id: "vowel-signs"
    term: "मात्रा"
    reading: "mātrā"
    ipa: "maːt̪raː"
    example: "कि"
    letters: ["का", "कि", "की", "कु", "के", "को"]
  - id: "half-letters"
    term: "आधा अक्षर"
    reading: "ādhā akśar"
    ipa: "aːd̪ʱaː əkʃər"
    example: "प्य"
    letters: ["क्य", "प्य", "स्त", "च्च", "द्ध"]
  - id: "halant"
    term: "हलंत"
    reading: "halant"
    ipa: "ɦələnt̪"
    example: "क्"
    letters: ["क्", "द्", "ट्"]
  - id: "own-shapes"
    example: "क्ष"
    letters: ["क्ष", "त्र", "ज्ञ", "श्र"]
  - id: "r-forms"
    example: "प्र"
    letters: ["प्र", "क्र", "ट्र", "र्म"]
