# How Devanagari, Hindi's script, works: the recurring features a learner
# from English misses, shown before the first letters and from a script
# deck's Tips. See ADR-0016 and docs/DECK-FORMAT.md.
schema: 1
kind: script
id: hi-script
language: hi
name: "How Devanagari works"
intro: "Hindi is written in Devanagari, a script built from a few ideas that come back in letter after letter. They look strange at first because English has none of them. Once you have seen them, the letters start to make sense."
features:
  - id: headline
    name: "The headline"
    term: "शिरोरेखा"
    reading: "shirorekhaa"
    example: "क"
    text: "Most letters hang from a line along the top, and in a word the lines join into one. Read along the top, not along a baseline as in English."
    letters: ["क", "ग", "त", "न", "म", "ल", "स"]
  - id: headline-gap
    name: "A gap in the headline"
    example: "ध"
    text: "In a few letters the line breaks, and the gap is what tells them from a look-alike: ध from घ, and भ from म."
    letters: ["ख", "थ", "ध", "भ"]
  - id: stem
    name: "The standing line"
    term: "खड़ी पाई"
    reading: "khadii paaii"
    example: "ग"
    text: "Most letters have an upright line on the right. A letter drops it to become a half letter when it joins the next one: प्यार, बच्चा."
    letters: ["ग", "प", "म", "स", "ल", "ब"]
  - id: inherent-vowel
    name: "The vowel you don't see"
    example: "क"
    text: "Every consonant carries a short a, said like the u of 'but', unless a sign changes it: क alone is ka."
    letters: ["क", "कल", "कमल"]
  - id: final-a
    name: "The last a usually isn't said"
    example: "घर"
    text: "At the end of most words the carried a goes quiet: घर is ghar, कमल is kamal. Inside long words it can go quiet too, so learn each word as it's said."
    letters: ["घर", "कमल", "नमक"]
  - id: vowel-signs
    name: "Vowels as signs on a letter"
    term: "मात्रा"
    reading: "maatraa"
    example: "कि"
    text: "After a consonant a vowel is a sign on it, not a letter of its own. ि is written before the consonant but said after it: you see ि then क, and say ki. े and ै sit above, ु and ू below, the rest after."
    letters: ["का", "कि", "की", "कु", "के", "को"]
  - id: half-letters
    name: "Half letters"
    term: "आधा अक्षर"
    reading: "aadhaa akshar"
    example: "प्य"
    text: "Two consonants with no vowel between them join. Usually the first is written as a half letter, without its standing line: प्यार (pyaar, love). Letters with no standing line stack instead, or keep the halant: द्ध, ट्ट."
    letters: ["क्य", "प्य", "स्त", "च्च", "द्ध"]
  - id: own-shapes
    name: "Four joins with shapes of their own"
    example: "क्ष"
    text: "Four joins look nothing like their parts: क्ष is क and ष, त्र is त and र, ज्ञ is ज and ञ, श्र is श and र."
    letters: ["क्ष", "त्र", "ज्ञ", "श्र"]
  - id: r-forms
    name: "र written as a stroke"
    example: "प्र"
    text: "Next to another consonant र isn't written in full. After it, it's a slanting stroke at its foot (प्र), or a small caret under ट and ड (ट्र); before it, a small hook on top, the reph (धर्म)."
    letters: ["प्र", "क्र", "ट्र", "र्म"]
  - id: dot-below
    name: "A dot below makes another sound"
    term: "नुक़्ता"
    reading: "nuqtaa"
    example: "ज़"
    text: "A dot below a letter changes its sound: ज is j and ज़ is z, फ is ph and फ़ is f. ड़ and ढ़ are ड and ढ with the tongue placed the same way but not touching the roof of the mouth."
    letters: ["ज", "ज़", "फ", "फ़", "ड", "ड़", "ढ", "ढ़"]
  - id: nasal-marks
    name: "The moon and the dot"
    term: "चंद्रबिंदु"
    reading: "chandrabindu"
    example: "हँ"
    text: "The moon and dot ँ above a letter makes its vowel nasal, said through the nose as well. The dot alone, ं, is an n or m before the next consonant, and stands for the moon where a sign above leaves no room."
    letters: ["हँ", "में", "रंग"]
  - id: look-alikes
    name: "Letters that look alike"
    example: "ख"
    text: "A few letters are easy to mix up: ब has a line across it that व doesn't; ष is प with a stroke through it; and ख looks like र and व side by side."
    letters: ["ब", "व", "प", "ष", "ख"]
  - id: digits
    name: "Devanagari digits"
    example: "१"
    text: "Devanagari has its own digits, seen on some signs, in older books and on official papers. Everyday Hindi mostly writes 0 to 9. १ is 1, though it looks like a 9."
    letters: ["०", "१", "२", "३", "४", "५", "६", "७", "८", "९"]
