schema: 1
id: hi-en-grammar-ne
name: "The ने (nē) construction"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "In the past, a verb with an object takes ने (nē) after the doer and agrees with the object. Not yet checked by a Hindi speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - ref: hi-0364
  - id: hi-0480
    target: "मैंने चाय पी।"
    native: "I drank tea."
    reading: "mainnē cāy pī."
    ipa: "mɛːnneː tʃaːj piː"
    pos: "phrase"
    notes: "पी (pī) is feminine because चाय (cāy) is, whoever drank it."
  - id: hi-0481
    target: "उसने किताब पढ़ी।"
    native: "He read a book. / She read a book."
    reading: "usnē kitāb paṛhī."
    ipa: "ʊsneː kɪt̪aːb pəɽʱiː"
    pos: "phrase"
    notes: "पढ़ी (paṛhī) agrees with किताब (kitāb), feminine. Nothing says whether the reader was a man or a woman."
  - id: hi-0482
    target: "हमने फ़िल्म देखी।"
    native: "We saw a film."
    reading: "hamnē film dēkhī."
    ipa: "ɦəmneː fɪlm d̪eːkʰiː"
    pos: "phrase"
  - id: hi-0483
    target: "राम ने पत्र लिखा।"
    native: "Ram wrote a letter."
    reading: "rām nē patra likhā."
    ipa: "raːm neː pət̪rə lɪkʰaː"
    pos: "phrase"
    notes: "After a name, ने (nē) is written apart."
  - id: hi-0484
    target: "आपने क्या कहा?"
    native: "What did you say?"
    reading: "āpnē kyā kahā?"
    ipa: "aːpneː kjaː kəɦaː"
    pos: "phrase"
  - id: hi-0485
    target: "उन्होंने खाना खाया।"
    native: "They ate. / He ate. (respectful)"
    reading: "unhōnnē khānā khāyā."
    ipa: "ʊnɦoːnneː kʰaːnaː kʰaːjaː"
    pos: "phrase"
  - id: hi-0486
    target: "मैंने उसे देखा।"
    native: "I saw him. / I saw her."
    reading: "mainnē usē dēkhā."
    ipa: "mɛːnneː ʊseː d̪eːkʰaː"
    pos: "phrase"
    notes: "When the object takes को (kō) (उसे (usē) = उसको (uskō)), the verb stays masculine singular."
  - id: hi-0487
    target: "मैं आया।"
    native: "I came. (said by a man)"
    reading: "maim̐ āyā."
    ipa: "mɛ̃ː aːjaː"
    pos: "phrase"
    notes: "No ने (nē): आना (ānā) takes no object, so the verb agrees with the doer."
