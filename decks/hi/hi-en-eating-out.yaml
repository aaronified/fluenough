schema: 1
id: hi-en-eating-out
name: "Eating out"
kind: vocab
theme: eating-out
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Ordering, asking for less spice, and paying the bill."
tags: [beginner]
cards:
  - id: hi-en-eating-out-0001
    target: "खाना"
    native: "food; a meal; to eat"
    reading: "khaanaa"
    pos: "noun"
    gender: "m"
    notes: "As a verb, खाना is 'to eat': खाना खाना, to eat a meal."
  - id: hi-en-eating-out-0002
    target: "पानी"
    native: "water"
    reading: "paanii"
    pos: "noun"
    gender: "m"
  - id: hi-en-eating-out-0003
    target: "चाय"
    native: "tea"
    reading: "chaay"
    pos: "noun"
    gender: "f"
    notes: "Usually boiled with milk and sugar. Without sugar: बिना चीनी (binaa chiinii)."
  - id: hi-en-eating-out-0004
    target: "रोटी"
    native: "flatbread; roti"
    reading: "rotii"
    pos: "noun"
    gender: "f"
  - id: hi-en-eating-out-0005
    target: "मुझे … चाहिए।"
    native: "I'd like …; I need …"
    reading: "mujhe … chaahiye."
    pos: "phrase"
    notes: "The thing wanted goes in the gap: मुझे पानी चाहिए, I'd like some water. Literally 'to me … is needed'."
  - id: hi-en-eating-out-0006
    target: "और"
    native: "more; and"
    reading: "aur"
    pos: "other"
    notes: "थोड़ा और (thodaa aur), a little more. Between two words it means 'and': चाय और पानी."
  - id: hi-en-eating-out-0007
    target: "तीखा"
    native: "spicy (hot)"
    reading: "tiikhaa"
    pos: "adj"
    notes: "कम तीखा (kam tiikhaa), less spicy. Asking is normal; the default can be very hot."
  - id: hi-en-eating-out-0008
    target: "मीठा"
    native: "sweet; a sweet"
    reading: "miithaa"
    pos: "adj"
  - id: hi-en-eating-out-0009
    target: "शाकाहारी"
    native: "vegetarian"
    reading: "shaakaahaarii"
    pos: "adj"
    notes: "Menus and signs say 'veg' and 'non-veg'. Packaged food carries a green mark if it is vegetarian and a brown one if not."
  - id: hi-en-eating-out-0010
    target: "बिल लाइए।"
    native: "The bill, please."
    reading: "bil laaiye."
    pos: "phrase"
    tags: ["polite"]
    notes: "Literally 'please bring the bill'."
  - id: hi-en-eating-out-0011
    target: "बहुत अच्छा था।"
    native: "It was very good."
    reading: "bahut achchhaa thaa."
    pos: "phrase"
