description: "Ordering, asking for less spice, and paying the bill."
tags: [beginner]
cards:
  - id: hi-0332
    target: "खाना"
    native: "food; a meal; to eat"
    reading: "khānā"
    ipa: "kʰaːnaː"
    pos: "noun"
    gender: "m"
    notes: "As a verb, खाना is 'to eat': खाना खाना, to eat a meal."
  - id: hi-0333
    target: "पानी"
    native: "water"
    reading: "pānī"
    ipa: "paːniː"
    pos: "noun"
    gender: "m"
  - id: hi-0334
    target: "चाय"
    native: "tea"
    reading: "cāy"
    ipa: "tʃaːj"
    pos: "noun"
    gender: "f"
    notes: "Usually boiled with milk and sugar. Without sugar: बिना चीनी (binā cīnī)."
  - id: hi-0335
    target: "रोटी"
    native: "flatbread; roti"
    reading: "rōṭī"
    ipa: "roːʈiː"
    pos: "noun"
    gender: "f"
  - id: hi-0336
    target: "मुझे … चाहिए।"
    native: "I'd like …; I need …"
    reading: "mujhē... cāhiē."
    ipa: "mʊdʒʱeː tʃaːɦɪeː"
    pos: "phrase"
    notes: "The thing wanted goes in the gap: मुझे पानी चाहिए, I'd like some water. Literally 'to me … is needed'."
  - id: hi-0337
    target: "और"
    native: "more; and"
    reading: "aur"
    ipa: "ɔːr"
    pos: "other"
    notes: "थोड़ा और (thōṛā aur), a little more. Between two words it means 'and': चाय और पानी."
  - id: hi-0338
    target: "तीखा"
    native: "spicy (hot)"
    reading: "tīkhā"
    ipa: "t̪iːkʰaː"
    pos: "adj"
    notes: "कम तीखा (kam tīkhā), less spicy. Asking is normal; the default can be very hot."
  - id: hi-0339
    target: "मीठा"
    native: "sweet; a sweet"
    reading: "mīṭhā"
    ipa: "miːʈʰaː"
    pos: "adj"
  - id: hi-0340
    target: "शाकाहारी"
    native: "vegetarian"
    reading: "śākāhārī"
    ipa: "ʃaːkaːɦaːriː"
    pos: "adj"
    notes: "Menus and signs say 'veg' and 'non-veg'. Packaged food carries a green mark if it is vegetarian and a brown one if not."
  - id: hi-0341
    target: "बिल लाइए।"
    native: "The bill, please."
    reading: "bil lāiē."
    ipa: "bɪl laːɪeː"
    pos: "phrase"
    tags: ["polite"]
    notes: "Literally 'please bring the bill'."
  - id: hi-0342
    target: "बहुत अच्छा था।"
    native: "It was very good."
    reading: "bahut acchā thā."
    ipa: "bəɦʊt̪ ətʃtʃʰaː t̪ʰaː"
    pos: "phrase"
