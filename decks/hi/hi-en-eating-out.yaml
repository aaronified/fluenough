schema: 1
id: hi-en-eating-out
name: "Eating out"
kind: vocab
theme: eating-out
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Ordering, asking for less spice, and paying the bill."
tags: [beginner]
cards:
  - id: hi-0332
    target: "खाना"
    native: "food; a meal; to eat"
    reading: "khana"
    pos: "noun"
    gender: "m"
    notes: "As a verb, खाना is 'to eat': खाना खाना, to eat a meal."
  - id: hi-0333
    target: "पानी"
    native: "water"
    reading: "pani"
    pos: "noun"
    gender: "m"
  - id: hi-0334
    target: "चाय"
    native: "tea"
    reading: "chai"
    pos: "noun"
    gender: "f"
    notes: "Usually boiled with milk and sugar. Without sugar: बिना चीनी (bina chini)."
  - id: hi-0335
    target: "रोटी"
    native: "flatbread; roti"
    reading: "roti"
    pos: "noun"
    gender: "f"
  - id: hi-0336
    target: "मुझे … चाहिए।"
    native: "I'd like …; I need …"
    reading: "mujhe ... chahiye."
    pos: "phrase"
    notes: "The thing wanted goes in the gap: मुझे पानी चाहिए, I'd like some water. Literally 'to me … is needed'."
  - id: hi-0337
    target: "और"
    native: "more; and"
    reading: "aur"
    pos: "other"
    notes: "थोड़ा और (thora aur), a little more. Between two words it means 'and': चाय और पानी."
  - id: hi-0338
    target: "तीखा"
    native: "spicy (hot)"
    reading: "tikha"
    pos: "adj"
    notes: "कम तीखा (kam tikha), less spicy. Asking is normal; the default can be very hot."
  - id: hi-0339
    target: "मीठा"
    native: "sweet; a sweet"
    reading: "mitha"
    pos: "adj"
  - id: hi-0340
    target: "शाकाहारी"
    native: "vegetarian"
    reading: "shakahari"
    pos: "adj"
    notes: "Menus and signs say 'veg' and 'non-veg'. Packaged food carries a green mark if it is vegetarian and a brown one if not."
  - id: hi-0341
    target: "बिल लाइए।"
    native: "The bill, please."
    reading: "bil laiye."
    pos: "phrase"
    tags: ["polite"]
    notes: "Literally 'please bring the bill'."
  - id: hi-0342
    target: "बहुत अच्छा था।"
    native: "It was very good."
    reading: "bahut achha tha."
    pos: "phrase"
