    target: "आप कहाँ काम करते हैं?"
    native: "Where do you work?"
    reading: "ap kahan kam karte hain?"
    alt_target: ["आप कहाँ काम करती हैं?"]
    pos: "phrase"
  - id: hi-0418
    target: "मैं एक दफ़्तर में काम करता हूँ।"
    native: "I work in an office. (said by a man)"
    reading: "main ek daftar men kam karta hun."
    pos: "phrase"
    notes: "A woman says काम करती हूँ (kam karti hun)."
