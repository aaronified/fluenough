description: "A verb's stem with लेना, देना or जाना: the same action, done and finished. Not yet checked by a Hindi speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: hi-0504
    target: "खा लेना"
    native: "to eat up; to have (something) to eat"
    reading: "khā lēnā"
    ipa: "kʰaː leːnaː"
    pos: "phrase"
    notes: "लेना adds 'for oneself': खाना खा लीजिए, please have your meal."
  - id: hi-0505
    target: "दे देना"
    native: "to give away; to hand over"
    reading: "dē dēnā"
    ipa: "d̪eː d̪eːnaː"
    pos: "phrase"
    notes: "देना adds 'for someone else': किताब दे दीजिए, please hand over the book."
  - id: hi-0506
    target: "रख देना"
    native: "to put down"
    reading: "rakh dēnā"
    ipa: "rəkʰ d̪eːnaː"
    pos: "phrase"
  - id: hi-0507
    target: "आ जाना"
    native: "to arrive; to come (at last)"
    reading: "ā jānā"
    ipa: "aː dʒaːnaː"
    pos: "phrase"
    notes: "बस आ गई, the bus has come."
  - id: hi-0508
    target: "हो जाना"
    native: "to become; to happen"
    reading: "hō jānā"
    ipa: "ɦoː dʒaːnaː"
    pos: "phrase"
    notes: "देर हो गई, it's got late."
  - id: hi-0509
    target: "सो जाना"
    native: "to fall asleep"
    reading: "sō jānā"
    ipa: "soː dʒaːnaː"
    pos: "phrase"
  - id: hi-0510
    target: "बैठ जाना"
    native: "to sit down"
    reading: "baiṭh jānā"
    ipa: "bɛːʈʰ dʒaːnaː"
    pos: "phrase"
  - id: hi-0511
    target: "समझ जाना"
    native: "to understand (at last)"
    reading: "samajh jānā"
    ipa: "səmədʒʱ dʒaːnaː"
    pos: "phrase"
    notes: "मैं समझ गया, I've got it."
  - id: hi-0512
    target: "भूल जाना"
    native: "to forget"
    reading: "bhūl jānā"
    ipa: "bʱuːl dʒaːnaː"
    pos: "phrase"
    notes: "मैं भूल गया, I forgot."
