# The order Hindi is taught from English in: one unit per line. First the
# script, the sounds English lacks, and how Hindi grammar differs from
# English; then a theme deck and the grammar that goes with it. Every hi-en
# deck is listed exactly once. See ADR-0013 and docs/DECK-FORMAT.md.
schema: 1
kind: path
id: hi-en-path
language: hi
native: en
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  - [hi-en-script-vowels, hi-en-script-consonants, hi-en-script-reading]
  - [hi-en-script-vowel-signs, hi-en-script-conjuncts]
  - [hi-en-sound-differences]
  - [hi-en-grammar-differences]
  - [hi-en-first-words, hi-en-grammar-sentences, "*"]
  - [hi-en-questions, hi-en-grammar-questions, "*"]
  - [hi-en-addressing, hi-en-grammar-pronouns, "*"]
  - [hi-en-about-me, hi-en-grammar-present, hi-en-grammar-possessives, "*"]
  - [hi-en-family, hi-en-grammar-be, "*"]
  - [hi-en-work, hi-en-grammar-demonstratives, "*"]
  - [hi-en-numbers-1-20, "*"]
  - [hi-en-numbers-big, "*"]
  - [hi-en-market, hi-en-grammar-nouns, hi-en-grammar-articles, "*"]
  - [hi-en-groceries, hi-en-grammar-adjectives, hi-en-grammar-needs, "*"]
  - [hi-en-transport, hi-en-grammar-postpositions, "*"]
  - [hi-en-directions, hi-en-grammar-continuous, "*"]
  - [hi-en-home, "*"]
  - [hi-en-time, hi-en-grammar-future, "*"]
  - [hi-en-daily-life, hi-en-grammar-conjunct-verbs, "*"]
  - [hi-en-calendar, hi-en-grammar-past, "*"]
  - [hi-en-grammar-ne, hi-en-grammar-perfect]
  - [hi-en-grammar-past-more, hi-en-grammar-compound-verbs]
  - [hi-en-eating-out, hi-en-grammar-conjunctions, hi-en-grammar-likes, "*"]
  - [hi-en-help, hi-en-grammar-irregular, hi-en-grammar-pitfalls, "*"]
  - [hi-en-registers]
  - [hi-en-slang]
  - [hi-en-grammar-can-must]
  - [hi-en-spelling]
  - [hi-en-reading-panch-parmeshwar]
  - ["*"]
