schema: 1
id: hi-en-grammar-possessives
name: "Possessives: my, your"
kind: grammar
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "My, your, his and her. They agree with the thing owned, not the owner."
tags: [beginner, grammar]
pattern:
  name: "Possessive pronouns"
  slot_name: "agreement"
  slots: ["before a masculine noun", "before a feminine noun", "before a masculine plural, or a postposition"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "A possessive agrees with what is owned, not with the owner: मेरा घर (my house) because घर (ghar) is masculine, मेरी किताब (my book) because किताब (kitāb) is feminine, whoever is speaking. So nothing in उसका (uskā) says whether it is his or hers."
  entries:
    - lemma: "मैं"
      key: main
      reading: "maim̐"
      ipa: "mɛ̃ː"
      gloss: "my"
      forms:
        "before a masculine noun": "मेरा"
        "before a feminine noun": "मेरी"
        "before a masculine plural, or a postposition": "मेरे"
      readings:
        "before a masculine noun": "mērā"
        "before a feminine noun": "mērī"
        "before a masculine plural, or a postposition": "mērē"
      ipas:
        "before a masculine noun": "meːraː"
        "before a feminine noun": "meːriː"
        "before a masculine plural, or a postposition": "meːreː"
    - lemma: "तू"
      key: tuu
      reading: "tū"
      ipa: "t̪uː"
      gloss: "your, intimate"
      forms:
        "before a masculine noun": "तेरा"
        "before a feminine noun": "तेरी"
        "before a masculine plural, or a postposition": "तेरे"
      readings:
        "before a masculine noun": "tērā"
        "before a feminine noun": "tērī"
        "before a masculine plural, or a postposition": "tērē"
      ipas:
        "before a masculine noun": "t̪eːraː"
        "before a feminine noun": "t̪eːriː"
        "before a masculine plural, or a postposition": "t̪eːreː"
    - lemma: "तुम"
      key: tum
      reading: "tum"
      ipa: "t̪ʊm"
      gloss: "your, familiar"
      forms:
        "before a masculine noun": "तुम्हारा"
        "before a feminine noun": "तुम्हारी"
        "before a masculine plural, or a postposition": "तुम्हारे"
      readings:
        "before a masculine noun": "tumhārā"
        "before a feminine noun": "tumhārī"
        "before a masculine plural, or a postposition": "tumhārē"
      ipas:
        "before a masculine noun": "t̪ʊmɦaːraː"
        "before a feminine noun": "t̪ʊmɦaːriː"
        "before a masculine plural, or a postposition": "t̪ʊmɦaːreː"
    - lemma: "आप"
      key: aap
      reading: "āp"
      ipa: "aːp"
      gloss: "your, respectful"
      forms:
        "before a masculine noun": "आपका"
        "before a feminine noun": "आपकी"
        "before a masculine plural, or a postposition": "आपके"
      readings:
        "before a masculine noun": "āpkā"
        "before a feminine noun": "āpkī"
        "before a masculine plural, or a postposition": "āpkē"
      ipas:
        "before a masculine noun": "aːpkaː"
        "before a feminine noun": "aːpkiː"
        "before a masculine plural, or a postposition": "aːpkeː"
    - lemma: "यह"
      key: yah
      reading: "yah"
      ipa: "jəɦ"
      gloss: "his, her, its: near"
      forms:
        "before a masculine noun": "इसका"
