schema: 1
id: hi-en-grammar-possessives
name: "Possessives: my, your"
kind: grammar
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "My, your, his and her. They agree with the thing owned, not the owner."
tags: [beginner, grammar]
pattern:
  name: "Possessive pronouns"
  slot_name: "agreement"
  slots: ["before a masculine noun", "before a feminine noun", "before a masculine plural, or a postposition"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "A possessive agrees with what is owned, not with the owner: मेरा घर (my house) because घर is masculine, मेरी किताब (my book) because किताब is feminine, whoever is speaking. So nothing in उसका says whether it is his or hers."
  entries:
    - lemma: "मैं"
      key: main
      reading: "main"
      gloss: "my"
      forms:
        "before a masculine noun": "मेरा"
        "before a feminine noun": "मेरी"
        "before a masculine plural, or a postposition": "मेरे"
      readings:
        "before a masculine noun": "mera"
        "before a feminine noun": "meri"
        "before a masculine plural, or a postposition": "mere"
    - lemma: "तू"
      key: tuu
      reading: "tu"
      gloss: "your, intimate"
      forms:
        "before a masculine noun": "तेरा"
        "before a feminine noun": "तेरी"
        "before a masculine plural, or a postposition": "तेरे"
      readings:
        "before a masculine noun": "tera"
        "before a feminine noun": "teri"
        "before a masculine plural, or a postposition": "tere"
    - lemma: "तुम"
      key: tum
      reading: "tum"
      gloss: "your, familiar"
      forms:
        "before a masculine noun": "तुम्हारा"
        "before a feminine noun": "तुम्हारी"
        "before a masculine plural, or a postposition": "तुम्हारे"
      readings:
        "before a masculine noun": "tumhara"
        "before a feminine noun": "tumhari"
        "before a masculine plural, or a postposition": "tumhare"
    - lemma: "आप"
      key: aap
      reading: "ap"
      gloss: "your, respectful"
      forms:
        "before a masculine noun": "आपका"
        "before a feminine noun": "आपकी"
        "before a masculine plural, or a postposition": "आपके"
      readings:
        "before a masculine noun": "apka"
        "before a feminine noun": "apki"
        "before a masculine plural, or a postposition": "apke"
    - lemma: "यह"
      key: yah
      reading: "yah"
      gloss: "his, her, its: near"
      forms:
        "before a masculine noun": "इसका"
        "before a feminine noun": "इसकी"
        "before a masculine plural, or a postposition": "इसके"
      readings:
        "before a masculine noun": "iska"
        "before a feminine noun": "iski"
        "before a masculine plural, or a postposition": "iske"
    - lemma: "वह"
      key: vah
      reading: "vah"
      gloss: "his, her, its: far"
      forms:
        "before a masculine noun": "उसका"
        "before a feminine noun": "उसकी"
        "before a masculine plural, or a postposition": "उसके"
      readings:
        "before a masculine noun": "uska"
        "before a feminine noun": "uski"
        "before a masculine plural, or a postposition": "uske"
    - lemma: "हम"
      key: ham
      reading: "ham"
      gloss: "our"
      forms:
        "before a masculine noun": "हमारा"
        "before a feminine noun": "हमारी"
        "before a masculine plural, or a postposition": "हमारे"
      readings:
        "before a masculine noun": "hamara"
        "before a feminine noun": "hamari"
        "before a masculine plural, or a postposition": "hamare"
    - lemma: "ये"
      key: ye
      reading: "ye"
      gloss: "their: near"
      forms:
        "before a masculine noun": "इनका"
        "before a feminine noun": "इनकी"
        "before a masculine plural, or a postposition": "इनके"
      readings:
        "before a masculine noun": "inka"
        "before a feminine noun": "inki"
        "before a masculine plural, or a postposition": "inke"
    - lemma: "वे"
      key: ve
      reading: "ve"
      gloss: "their: far"
      forms:
        "before a masculine noun": "उनका"
        "before a feminine noun": "उनकी"
        "before a masculine plural, or a postposition": "उनके"
      readings:
        "before a masculine noun": "unka"
        "before a feminine noun": "unki"
        "before a masculine plural, or a postposition": "unke"
