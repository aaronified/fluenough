description: "The mistakes English speakers make most in Hindi."
tags: [beginner, grammar]
cards:
  - id: hi-0364
    target: "मैंने खाना खाया।"
    native: "I ate."
    reading: "mainne khana khaya."
    pos: "phrase"
    notes: "In the past of a verb with an object, the doer takes ने (मैं → मैंने) and the verb agrees with the object, not with the doer."
  - id: hi-0365
    target: "मैंने रोटी खाई।"
    native: "I ate a roti."
    reading: "mainne roti khayi."
    pos: "phrase"
    notes: "खाई is feminine because रोटी is, whoever ate it."
  - id: hi-0366
    target: "यह मेरी गाड़ी है।"
    native: "This is my car."
    reading: "yah meri gari hai."
    pos: "phrase"
    notes: "मेरी agrees with गाड़ी, which is feminine, not with the speaker. A man says मेरी गाड़ी too."
  - id: hi-0367
    target: "वह आ रही है।"
    native: "She is coming."
    reading: "vah a rahi hai."
    pos: "phrase"
    notes: "वह does not say he or she; only the verb does."
  - id: hi-0368
    target: "पानी ठंडा है।"
    native: "The water is cold."
    reading: "pani thanda hai."
    pos: "phrase"
    notes: "पानी is masculine, so ठंडा."
  - id: hi-0369
    target: "चाय ठंडी है।"
    native: "The tea is cold."
    reading: "chai thandi hai."
    pos: "phrase"
    notes: "चाय is feminine, so ठंडी. Every noun has a gender, and it has to be learned with the word."
  - id: hi-0370
    target: "मुझे भूख लगी है।"
    native: "I'm hungry."
    reading: "mujhe bhukh lagi hai."
    pos: "phrase"
    notes: "'Hunger has struck me'. So too मुझे प्यास लगी है, I'm thirsty."
  - id: hi-0371
    target: "मुझे जाना है।"
    native: "I have to go."
    reading: "mujhe jana hai."
    pos: "phrase"
    notes: "Having to do something is 'to me, going is': मुझे, the verb's -ना form, then है."
  - id: hi-0372
    target: "मुझे आपसे बात करनी है।"
    native: "I need to talk to you."
    reading: "mujhe apse bat karni hai."
    pos: "phrase"
    notes: "You talk से someone, not को. And करनी is feminine because बात is."
  - id: hi-0373
    target: "आप बैठिए।"
    native: "Please sit down."
    reading: "ap baithiye."
    pos: "phrase"
    notes: "With आप, use the -इए form. The तुम form, बैठो, is for friends and children, and can sound rude to a stranger."
