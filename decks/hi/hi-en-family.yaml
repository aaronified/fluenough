schema: 1
id: hi-en-family
name: "Family"
kind: vocab
theme: family
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Parents, brothers and sisters, grandparents, and the aunts and uncles on each side, each with its own word. Not yet checked by a Hindi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - ref: hi-0193
  - id: hi-0375
    target: "माता-पिता"
    native: "parents"
    reading: "maataa-pitaa"
    alt_target: ["माँ-बाप"]
    pos: "noun"
    notes: "In speech also माँ-बाप (maan-baap)."
  - id: hi-0376
    target: "पिता"
    native: "father"
    reading: "pitaa"
    alt_target: ["पिताजी", "पापा"]
    pos: "noun"
    gender: "m"
    notes: "पिताजी (pitaajii) adds respect; many children say पापा (paapaa)."
  - id: hi-0377
    target: "माँ"
    native: "mother"
    reading: "maan"
    alt_target: ["माता", "मम्मी"]
    pos: "noun"
    gender: "f"
    notes: "Formally माता (maataa); many children say मम्मी (mammii)."
  - id: hi-0378
    target: "भाई"
    native: "brother"
    reading: "bhaaii"
    pos: "noun"
    gender: "m"
    notes: "An elder brother is बड़ा भाई (badaa bhaaii), and is often called भैया (bhaiyaa)."
  - id: hi-0379
    target: "बहन"
    native: "sister"
    reading: "bahan"
    pos: "noun"
    gender: "f"
    notes: "An elder sister is बड़ी बहन (badii bahan), and is often called दीदी (diidii)."
  - ref: hi-0184
    native: "son"
    notes: "Also how an elder addresses any younger person, a girl too: see Addressing people."
  - id: hi-0380
    target: "बेटी"
    native: "daughter"
    reading: "betii"
    pos: "noun"
    gender: "f"
