schema: 1
id: hi-en-family
name: "Family"
kind: vocab
theme: family
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Parents, brothers and sisters, grandparents, and the aunts and uncles on each side, each with its own word. Not yet checked by a Hindi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - ref: hi-0193
  - id: hi-0375
    target: "माता-पिता"
    native: "parents"
    reading: "mata-pita"
    alt_target: ["माँ-बाप"]
    pos: "noun"
    notes: "In speech also माँ-बाप (man-bap)."
  - id: hi-0376
    target: "पिता"
    native: "father"
    reading: "pita"
    alt_target: ["पिताजी", "पापा"]
    pos: "noun"
    gender: "m"
    notes: "पिताजी (pitaji) adds respect; many children say पापा (papa)."
  - id: hi-0377
    target: "माँ"
    native: "mother"
    reading: "man"
    alt_target: ["माता", "मम्मी"]
    pos: "noun"
    gender: "f"
    notes: "Formally माता (mata); many children say मम्मी (mammi)."
  - id: hi-0378
    target: "भाई"
    native: "brother"
    reading: "bhai"
    pos: "noun"
    gender: "m"
    notes: "An elder brother is बड़ा भाई (bara bhai), and is often called भैया (bhaiya)."
  - id: hi-0379
    target: "बहन"
    native: "sister"
    reading: "bahan"
    pos: "noun"
    gender: "f"
    notes: "An elder sister is बड़ी बहन (bari bahan), and is often called दीदी (didi)."
  - ref: hi-0184
    native: "son"
    notes: "Also how an elder addresses any younger person, a girl too: see Addressing people."
  - id: hi-0380
    target: "बेटी"
    native: "daughter"
    reading: "beti"
    pos: "noun"
    gender: "f"
  - id: hi-0381
    target: "पति"
    native: "husband"
    reading: "pati"
    pos: "noun"
    gender: "m"
  - id: hi-0382
    target: "पत्नी"
    native: "wife"
    reading: "patni"
    pos: "noun"
    gender: "f"
  - id: hi-0383
    target: "बच्चे"
    native: "children"
    reading: "bachche"
    pos: "noun"
    notes: "The plural of बच्चा (bachcha), child."
  - id: hi-0384
    target: "दादा"
    native: "grandfather (father's father)"
    reading: "dada"
    alt_target: ["दादाजी"]
    pos: "noun"
    gender: "m"
  - id: hi-0385
    target: "दादी"
    native: "grandmother (father's mother)"
    reading: "dadi"
    alt_target: ["दादीजी"]
    pos: "noun"
    gender: "f"
  - id: hi-0386
    target: "नाना"
    native: "grandfather (mother's father)"
    reading: "nana"
    alt_target: ["नानाजी"]
    pos: "noun"
    gender: "m"
  - id: hi-0387
    target: "नानी"
    native: "grandmother (mother's mother)"
    reading: "nani"
    alt_target: ["नानीजी"]
    pos: "noun"
    gender: "f"
  - id: hi-0388
    target: "चाचा"
    native: "uncle (father's younger brother)"
    reading: "chacha"
    pos: "noun"
    gender: "m"
    notes: "His wife is चाची (chachi)."
  - id: hi-0389
    target: "ताऊ"
    native: "uncle (father's elder brother)"
    reading: "tau"
    alt_target: ["ताया"]
    pos: "noun"
    gender: "m"
    notes: "Also ताया (taya). His wife is ताई (tai)."
  - id: hi-0390
    target: "बुआ"
    native: "aunt (father's sister)"
    reading: "bua"
    pos: "noun"
    gender: "f"
    notes: "Her husband is फूफा (phupha)."
  - id: hi-0391
    target: "मामा"
    native: "uncle (mother's brother)"
    reading: "mama"
    pos: "noun"
    gender: "m"
    notes: "His wife is मामी (mami)."
  - id: hi-0392
    target: "मौसी"
    native: "aunt (mother's sister)"
    reading: "mausi"
    pos: "noun"
    gender: "f"
    notes: "Her husband is मौसा (mausa)."
  - id: hi-0393
    target: "ससुर"
    native: "father-in-law"
    reading: "sasur"
    pos: "noun"
    gender: "m"
  - id: hi-0394
    target: "सास"
    native: "mother-in-law"
    reading: "sas"
    pos: "noun"
    gender: "f"
  - id: hi-0395
    target: "रिश्तेदार"
    native: "relative"
    reading: "rishtedar"
    pos: "noun"
    gender: "m"
  - id: hi-0396
    target: "मेरे दो भाई और एक बहन हैं।"
    native: "I have two brothers and a sister."
    reading: "mere do bhai aur ek bahan hain."
    pos: "phrase"
    notes: "Family takes the possessive, not के पास: 'my two brothers are'."
  - id: hi-0397
    target: "आपके कितने भाई-बहन हैं?"
    native: "How many brothers and sisters do you have?"
    reading: "apke kitne bhai-bahan hain?"
    pos: "phrase"
  - id: hi-0398
    target: "मेरी शादी हो गई है।"
    native: "I'm married."
    reading: "meri shadi ho gayi hai."
    alt_target: ["मैं शादीशुदा हूँ।"]
    pos: "phrase"
    notes: "Literally 'my wedding has happened'. Also मैं शादीशुदा हूँ (main shadishuda hun)."
