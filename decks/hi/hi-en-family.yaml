    target: "पति"
    native: "husband"
    reading: "pati"
    pos: "noun"
    gender: "m"
  - id: hi-0382
    target: "पत्नी"
    native: "wife"
    reading: "patnii"
    pos: "noun"
    gender: "f"
  - id: hi-0383
    target: "बच्चे"
    native: "children"
    reading: "bachche"
    pos: "noun"
    notes: "The plural of बच्चा (bachchaa), child."
  - id: hi-0384
    target: "दादा"
    native: "grandfather (father's father)"
    reading: "daadaa"
    alt_target: ["दादाजी"]
    pos: "noun"
    gender: "m"
  - id: hi-0385
    target: "दादी"
    native: "grandmother (father's mother)"
    reading: "daadii"
    alt_target: ["दादीजी"]
    pos: "noun"
    gender: "f"
  - id: hi-0386
    target: "नाना"
    native: "grandfather (mother's father)"
    reading: "naanaa"
    alt_target: ["नानाजी"]
    pos: "noun"
    gender: "m"
  - id: hi-0387
    target: "नानी"
    native: "grandmother (mother's mother)"
    reading: "naanii"
    alt_target: ["नानीजी"]
    pos: "noun"
    gender: "f"
  - id: hi-0388
    target: "चाचा"
    native: "uncle (father's younger brother)"
    reading: "chaachaa"
    pos: "noun"
    gender: "m"
    notes: "His wife is चाची (chaachii)."
  - id: hi-0389
    target: "ताऊ"
    native: "uncle (father's elder brother)"
    reading: "taauu"
    alt_target: ["ताया"]
    pos: "noun"
    gender: "m"
    notes: "Also ताया (taayaa). His wife is ताई (taaii)."
  - id: hi-0390
    target: "बुआ"
    native: "aunt (father's sister)"
    reading: "buaa"
    pos: "noun"
    gender: "f"
    notes: "Her husband is फूफा (phuuphaa)."
  - id: hi-0391
    target: "मामा"
    native: "uncle (mother's brother)"
    reading: "maamaa"
    pos: "noun"
    gender: "m"
    notes: "His wife is मामी (maamii)."
  - id: hi-0392
    target: "मौसी"
    native: "aunt (mother's sister)"
    reading: "mausii"
    pos: "noun"
    gender: "f"
    notes: "Her husband is मौसा (mausaa)."
  - id: hi-0393
    target: "ससुर"
    native: "father-in-law"
    reading: "sasur"
    pos: "noun"
    gender: "m"
  - id: hi-0394
    target: "सास"
    native: "mother-in-law"
    reading: "saas"
    pos: "noun"
    gender: "f"
  - id: hi-0395
    target: "रिश्तेदार"
    native: "relative"
    reading: "rishtedaar"
    pos: "noun"
    gender: "m"
  - id: hi-0396
    target: "मेरे दो भाई और एक बहन हैं।"
    native: "I have two brothers and a sister."
    reading: "mere do bhaaii aur ek bahan hain."
    pos: "phrase"
    notes: "Family takes the possessive, not के पास: 'my two brothers are'."
  - id: hi-0397
    target: "आपके कितने भाई-बहन हैं?"
    native: "How many brothers and sisters do you have?"
    reading: "aapke kitne bhaaii-bahan hain?"
    pos: "phrase"
  - id: hi-0398
    target: "मेरी शादी हो गई है।"
    native: "I'm married."
    reading: "merii shaadii ho gaii hai."
    alt_target: ["मैं शादीशुदा हूँ।"]
    pos: "phrase"
    notes: "Literally 'my wedding has happened'. Also मैं शादीशुदा हूँ (main shaadiishudaa huun)."
