schema: 1
id: hi-en-grammar-pronouns
name: "Pronouns"
kind: grammar
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I, you, he and she, and the forms they take with को, से and ने."
tags: [beginner, grammar]
pattern:
  name: "Personal pronouns"
  slot_name: "form"
  slots: ["to or for (को)", "with से (from, with)", "with ने (past of a transitive verb)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Hindi has three words for 'you': आप (respectful), तुम (familiar) and तू (intimate). यह and वह are he, she or it: यह for someone near, वह for someone further off. मुझे and मुझको mean the same; मुझे is more common."
  entries:
    - lemma: "मैं"
      key: main
      reading: "main"
      gloss: "I"
      forms:
        "to or for (को)": "मुझे"
        "with से (from, with)": "मुझसे"
        "with ने (past of a transitive verb)": "मैंने"
      readings:
        "to or for (को)": "mujhe"
        "with से (from, with)": "mujhse"
        "with ने (past of a transitive verb)": "mainne"
    - lemma: "तू"
      key: tuu
      reading: "tu"
      gloss: "you, intimate"
      forms:
        "to or for (को)": "तुझे"
        "with से (from, with)": "तुझसे"
        "with ने (past of a transitive verb)": "तूने"
      readings:
        "to or for (को)": "tujhe"
        "with से (from, with)": "tujhse"
        "with ने (past of a transitive verb)": "tune"
    - lemma: "तुम"
      key: tum
      reading: "tum"
      gloss: "you, familiar"
      forms:
        "to or for (को)": "तुम्हें"
        "with से (from, with)": "तुमसे"
        "with ने (past of a transitive verb)": "तुमने"
      readings:
        "to or for (को)": "tumhen"
        "with से (from, with)": "tumse"
        "with ने (past of a transitive verb)": "tumne"
    - lemma: "आप"
      key: aap
      reading: "ap"
      gloss: "you, respectful"
      forms:
        "to or for (को)": "आपको"
        "with से (from, with)": "आपसे"
        "with ने (past of a transitive verb)": "आपने"
      readings:
        "to or for (को)": "apko"
        "with से (from, with)": "apse"
        "with ने (past of a transitive verb)": "apne"
    - lemma: "यह"
      key: yah
      reading: "yah"
      gloss: "he, she, it: near"
      forms:
        "to or for (को)": "इसे"
        "with से (from, with)": "इससे"
        "with ने (past of a transitive verb)": "इसने"
      readings:
        "to or for (को)": "ise"
        "with से (from, with)": "isse"
        "with ने (past of a transitive verb)": "isne"
    - lemma: "वह"
      key: vah
      reading: "vah"
      gloss: "he, she, it: far"
      forms:
        "to or for (को)": "उसे"
        "with से (from, with)": "उससे"
        "with ने (past of a transitive verb)": "उसने"
      readings:
        "to or for (को)": "use"
        "with से (from, with)": "usse"
        "with ने (past of a transitive verb)": "usne"
    - lemma: "हम"
      key: ham
      reading: "ham"
      gloss: "we"
      forms:
        "to or for (को)": "हमें"
        "with से (from, with)": "हमसे"
        "with ने (past of a transitive verb)": "हमने"
      readings:
        "to or for (को)": "hamen"
        "with से (from, with)": "hamse"
        "with ने (past of a transitive verb)": "hamne"
    - lemma: "ये"
      key: ye
      reading: "ye"
      gloss: "they: near"
      forms:
        "to or for (को)": "इन्हें"
        "with से (from, with)": "इनसे"
        "with ने (past of a transitive verb)": "इन्होंने"
      readings:
        "to or for (को)": "inhen"
        "with से (from, with)": "inse"
        "with ने (past of a transitive verb)": "inhonne"
    - lemma: "वे"
      key: ve
      reading: "ve"
      gloss: "they: far"
      forms:
        "to or for (को)": "उन्हें"
        "with से (from, with)": "उनसे"
        "with ने (past of a transitive verb)": "उन्होंने"
      readings:
        "to or for (को)": "unhen"
        "with से (from, with)": "unse"
        "with ने (past of a transitive verb)": "unhonne"
