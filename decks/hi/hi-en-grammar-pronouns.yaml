schema: 1
id: hi-en-grammar-pronouns
name: "Pronouns"
kind: grammar
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I, you, he and she, and the forms they take with को, से and ने."
tags: [beginner, grammar]
pattern:
  name: "Personal pronouns"
  slot_name: "form"
  slots: ["to or for (को)", "with से (from, with)", "with ने (past of a transitive verb)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Hindi has three words for 'you': आप (respectful), तुम (familiar) and तू (intimate). यह and वह are he, she or it: यह for someone near, वह for someone further off. मुझे and मुझको mean the same; मुझे is more common."
  entries:
    - lemma: "मैं"
      key: main
      reading: "maim̐"
      ipa: "mɛ̃ː"
      gloss: "I"
      forms:
        "to or for (को)": "मुझे"
        "with से (from, with)": "मुझसे"
        "with ने (past of a transitive verb)": "मैंने"
      readings:
        "to or for (को)": "mujhē"
        "with से (from, with)": "mujhsē"
        "with ने (past of a transitive verb)": "mainnē"
      ipas:
        "to or for (को)": "mʊdʒʱeː"
        "with से (from, with)": "mʊdʒʱseː"
        "with ने (past of a transitive verb)": "mɛːnneː"
    - lemma: "तू"
      key: tuu
      reading: "tū"
      ipa: "t̪uː"
      gloss: "you, intimate"
      forms:
        "to or for (को)": "तुझे"
        "with से (from, with)": "तुझसे"
        "with ने (past of a transitive verb)": "तूने"
      readings:
        "to or for (को)": "tujhē"
        "with से (from, with)": "tujhsē"
        "with ने (past of a transitive verb)": "tūnē"
      ipas:
        "to or for (को)": "t̪ʊdʒʱeː"
        "with से (from, with)": "t̪ʊdʒʱseː"
        "with ने (past of a transitive verb)": "t̪uːneː"
    - lemma: "तुम"
      key: tum
      reading: "tum"
      ipa: "t̪ʊm"
      gloss: "you, familiar"
      forms:
        "to or for (को)": "तुम्हें"
        "with से (from, with)": "तुमसे"
        "with ने (past of a transitive verb)": "तुमने"
      readings:
        "to or for (को)": "tumhēm̐"
        "with से (from, with)": "tumsē"
        "with ने (past of a transitive verb)": "tumnē"
      ipas:
        "to or for (को)": "t̪ʊmɦẽː"
        "with से (from, with)": "t̪ʊmseː"
        "with ने (past of a transitive verb)": "t̪ʊmneː"
    - lemma: "आप"
      key: aap
      reading: "āp"
      ipa: "aːp"
      gloss: "you, respectful"
      forms:
        "to or for (को)": "आपको"
        "with से (from, with)": "आपसे"
        "with ने (past of a transitive verb)": "आपने"
      readings:
        "to or for (को)": "āpkō"
        "with से (from, with)": "āpsē"
        "with ने (past of a transitive verb)": "āpnē"
      ipas:
        "to or for (को)": "aːpkoː"
        "with से (from, with)": "aːpseː"
        "with ने (past of a transitive verb)": "aːpneː"
    - lemma: "यह"
      key: yah
      reading: "yah"
      ipa: "jəɦ"
      gloss: "he, she, it: near"
      forms:
        "to or for (को)": "इसे"
        "with से (from, with)": "इससे"
        "with ने (past of a transitive verb)": "इसने"
      readings:
        "to or for (को)": "isē"
        "with से (from, with)": "issē"
        "with ने (past of a transitive verb)": "isnē"
      ipas:
        "to or for (को)": "ɪseː"
        "with से (from, with)": "ɪsseː"
        "with ने (past of a transitive verb)": "ɪsneː"
    - lemma: "वह"
      key: vah
      reading: "vah"
      ipa: "ʋəɦ"
      gloss: "he, she, it: far"
      forms:
        "to or for (को)": "उसे"
        "with से (from, with)": "उससे"
        "with ने (past of a transitive verb)": "उसने"
      readings:
        "to or for (को)": "usē"
        "with से (from, with)": "ussē"
        "with ने (past of a transitive verb)": "usnē"
      ipas:
        "to or for (को)": "ʊseː"
        "with से (from, with)": "ʊsseː"
        "with ने (past of a transitive verb)": "ʊsneː"
    - lemma: "हम"
      key: ham
      reading: "ham"
      ipa: "ɦəm"
      gloss: "we"
      forms:
        "to or for (को)": "हमें"
        "with से (from, with)": "हमसे"
        "with ने (past of a transitive verb)": "हमने"
      readings:
        "to or for (को)": "hamēm̐"
        "with से (from, with)": "hamsē"
        "with ने (past of a transitive verb)": "hamnē"
      ipas:
        "to or for (को)": "ɦəmẽː"
        "with से (from, with)": "ɦəmseː"
        "with ने (past of a transitive verb)": "ɦəmneː"
    - lemma: "ये"
      key: ye
      reading: "yē"
      ipa: "jeː"
      gloss: "they: near"
      forms:
        "to or for (को)": "इन्हें"
        "with से (from, with)": "इनसे"
        "with ने (past of a transitive verb)": "इन्होंने"
      readings:
        "to or for (को)": "inhēm̐"
        "with से (from, with)": "insē"
        "with ने (past of a transitive verb)": "inhōnnē"
      ipas:
        "to or for (को)": "ɪnɦẽː"
        "with से (from, with)": "ɪnseː"
        "with ने (past of a transitive verb)": "ɪnɦoːnneː"
    - lemma: "वे"
      key: ve
      reading: "vē"
      ipa: "ʋeː"
      gloss: "they: far"
      forms:
        "to or for (को)": "उन्हें"
        "with से (from, with)": "उनसे"
        "with ने (past of a transitive verb)": "उन्होंने"
      readings:
        "to or for (को)": "unhēm̐"
        "with से (from, with)": "unsē"
        "with ने (past of a transitive verb)": "unhōnnē"
      ipas:
        "to or for (को)": "ʊnɦẽː"
        "with से (from, with)": "ʊnseː"
        "with ने (past of a transitive verb)": "ʊnɦoːnneː"
