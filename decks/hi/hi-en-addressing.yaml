schema: 1
id: hi-en-addressing
name: "Addressing people"
kind: vocab
theme: addressing
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "What to call a shopkeeper, a driver, an older woman or a child: Hindi speakers address strangers as family."
tags: [beginner]
cards:
  - id: hi-0177
    target: "भैया"
    native: "brother; to a man of about your age"
    reading: "bhaiyā"
    ipa: "bʱɛːjaː"
    pos: "noun"
    gender: "m"
    tags: ["honorific"]
    notes: "What you call a shopkeeper, a rickshaw driver or a waiter: भैया, कितने का है? Friendly and polite at once."
  - id: hi-0178
    target: "दीदी"
    native: "elder sister; to a woman a little older"
    reading: "dīdī"
    ipa: "d̪iːd̪iː"
    pos: "noun"
    gender: "f"
    tags: ["honorific"]
  - id: hi-0179
    target: "भाई साहब"
    native: "sir (to a man, respectfully)"
    reading: "bhāī sāhab"
    ipa: "bʱaːiː saːɦəb"
    pos: "phrase"
    gender: "m"
    tags: ["honorific"]
    notes: "Literally 'brother sir'. More respectful than भैया."
  - id: hi-0180
    target: "अंकल"
    native: "uncle; to any older man"
    reading: "aṅkal"
    ipa: "əŋkəl"
    pos: "noun"
    gender: "m"
    tags: ["honorific"]
    notes: "From English, and used everywhere in cities for a man old enough to be your parent."
  - id: hi-0181
    target: "आंटी"
    native: "aunty; to any older woman"
    reading: "āṇṭī"
    ipa: "aːɳʈiː"
    pos: "noun"
    gender: "f"
    tags: ["honorific"]
  - id: hi-0182
    target: "साहब"
    native: "sir"
    reading: "sāhab"
    ipa: "saːɦəb"
    pos: "noun"
    gender: "m"
    tags: ["honorific"]
    notes: "To a man in an office or in charge. Also after a name or title: डॉक्टर साहब (ḍôkṭar sāhab)."
  - id: hi-0183
    target: "मैडम"
    native: "madam"
    reading: "maiḍam"
    ipa: "mɛːɖəm"
    pos: "noun"
    gender: "f"
    tags: ["honorific"]
  - id: hi-0184
    target: "बेटा"
    native: "child; how elders address a younger person"
    reading: "bēṭā"
    ipa: "beːʈaː"
    pos: "noun"
    gender: "m"
    notes: "Literally 'son', but an elder says it to a girl too. If an older person calls you बेटा, it is warmth, not condescension."
  - id: hi-0185
    target: "दोस्त"
    native: "friend"
    reading: "dōst"
    ipa: "d̪oːst̪"
    pos: "noun"
    gender: "m"
    notes: "Grammatically masculine, whoever the friend is."
  - id: hi-0186
    target: "सुनिए"
    native: "excuse me (to get attention)"
    reading: "suniē"
    ipa: "sʊnɪeː"
    pos: "other"
    tags: ["polite"]
    notes: "Literally 'please listen'. The polite way to call a waiter or stop a passer-by."
