schema: 1
id: hi-en-time
name: "Time and days"
kind: vocab
theme: time
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Today and tomorrow, telling the time, and the days of the week."
tags: [beginner]
cards:
  - id: hi-0299
    target: "आज"
    native: "today"
    reading: "āj"
    ipa: "aːdʒ"
    pos: "adv"
  - id: hi-0300
    target: "कल"
    native: "tomorrow; yesterday"
    reading: "kal"
    ipa: "kəl"
    pos: "adv"
    notes: "One word for both. The verb's tense says which: कल आऊँगा, I'll come tomorrow; कल आया, I came yesterday."
  - id: hi-0301
    target: "अभी"
    native: "now; right now"
    reading: "abhī"
    ipa: "əbʱiː"
    pos: "adv"
  - id: hi-0302
    target: "सुबह"
    native: "morning"
    reading: "subah"
    ipa: "sʊbəɦ"
    pos: "noun"
    gender: "f"
  - id: hi-0303
    target: "शाम"
    native: "evening"
    reading: "śām"
    ipa: "ʃaːm"
    pos: "noun"
    gender: "f"
  - id: hi-0304
    target: "रात"
    native: "night"
    reading: "rāt"
    ipa: "raːt̪"
    pos: "noun"
    gender: "f"
  - id: hi-0305
    target: "बजे"
    native: "o'clock; at … o'clock"
    reading: "bajē"
    ipa: "bədʒeː"
    pos: "other"
    notes: "चार बजे (cār bajē), at four o'clock. सुबह सात बजे, at seven in the morning."
  - id: hi-0306
    target: "साढ़े"
    native: "half past; and a half"
    reading: "sāṛhē"
    ipa: "saːɽʱeː"
    pos: "other"
    notes: "साढ़े चार बजे (sāṛhē cār bajē), at half past four. For half past one and half past two Hindi uses डेढ़ (ḍēṛh) and ढाई (ḍhāī) instead."
  - id: hi-0307
    target: "कितने बजे हैं?"
    native: "What time is it?"
    reading: "kitnē bajē haim̐?"
    ipa: "kɪt̪neː bədʒeː ɦɛ̃ː"
    pos: "phrase"
    notes: "In speech, often टाइम क्या हुआ है? (taim kya hua hai?)"
  - id: hi-0308
    target: "दिन"
    native: "day"
    reading: "din"
    ipa: "d̪ɪn"
    pos: "noun"
    gender: "m"
  - id: hi-0309
    target: "हफ़्ता"
    native: "week"
    reading: "haftā"
    ipa: "ɦəft̪aː"
    alt_target: ["हफ्ता"]
    pos: "noun"
    gender: "m"
    notes: "Formally सप्ताह (saptāh)."
  - id: hi-0310
    target: "सोमवार"
    native: "Monday"
    reading: "sōmvār"
    ipa: "soːmʋaːr"
    pos: "noun"
    gender: "m"
    notes: "Each day ends in वार (vār, day) and is masculine. सोम is the moon."
  - id: hi-0311
    target: "मंगलवार"
    native: "Tuesday"
    reading: "maṅgalvār"
    ipa: "məŋɡəlʋaːr"
    pos: "noun"
    gender: "m"
  - id: hi-0312
    target: "बुधवार"
    native: "Wednesday"
    reading: "budhvār"
    ipa: "bʊd̪ʱʋaːr"
    pos: "noun"
    gender: "m"
  - id: hi-0313
    target: "गुरुवार"
    native: "Thursday"
    reading: "guruvār"
    ipa: "ɡʊrʊʋaːr"
    pos: "noun"
    gender: "m"
    notes: "Also बृहस्पतिवार (brihaspativār)."
  - id: hi-0314
    target: "शुक्रवार"
    native: "Friday"
    reading: "śukravār"
    ipa: "ʃʊkrəʋaːr"
    pos: "noun"
    gender: "m"
  - id: hi-0315
    target: "शनिवार"
    native: "Saturday"
    reading: "śanivār"
    ipa: "ʃənɪʋaːr"
    pos: "noun"
    gender: "m"
  - id: hi-0316
    target: "रविवार"
    native: "Sunday"
    reading: "ravivār"
    ipa: "rəʋɪʋaːr"
    alt_target: ["इतवार"]
    pos: "noun"
    gender: "m"
    notes: "In everyday speech, often इतवार (itvār)."
