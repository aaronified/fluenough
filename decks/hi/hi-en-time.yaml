schema: 1
id: hi-en-time
name: "Time and days"
kind: vocab
theme: time
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Today and tomorrow, telling the time, and the days of the week."
tags: [beginner]
cards:
  - id: hi-0299
    target: "आज"
    native: "today"
    reading: "aj"
    pos: "adv"
  - id: hi-0300
    target: "कल"
    native: "tomorrow; yesterday"
    reading: "kal"
    pos: "adv"
    notes: "One word for both. The verb's tense says which: कल आऊँगा, I'll come tomorrow; कल आया, I came yesterday."
  - id: hi-0301
    target: "अभी"
    native: "now; right now"
    reading: "abhi"
    pos: "adv"
  - id: hi-0302
    target: "सुबह"
    native: "morning"
    reading: "subah"
    pos: "noun"
    gender: "f"
  - id: hi-0303
    target: "शाम"
    native: "evening"
    reading: "sham"
    pos: "noun"
    gender: "f"
  - id: hi-0304
    target: "रात"
    native: "night"
    reading: "rat"
    pos: "noun"
    gender: "f"
  - id: hi-0305
    target: "बजे"
    native: "o'clock; at … o'clock"
    reading: "baje"
    pos: "other"
    notes: "चार बजे (char baje), at four o'clock. सुबह सात बजे, at seven in the morning."
  - id: hi-0306
    target: "साढ़े"
    native: "half past; and a half"
    reading: "sarhe"
    pos: "other"
    notes: "साढ़े चार बजे (sarhe char baje), at half past four. For half past one and half past two Hindi uses डेढ़ (derh) and ढाई (dhai) instead."
  - id: hi-0307
    target: "कितने बजे हैं?"
    native: "What time is it?"
    reading: "kitne baje hain?"
    pos: "phrase"
    notes: "In speech, often टाइम क्या हुआ है? (taim kya hua hai?)"
  - id: hi-0308
    target: "दिन"
    native: "day"
    reading: "din"
    pos: "noun"
    gender: "m"
  - id: hi-0309
    target: "हफ़्ता"
    native: "week"
    reading: "hafta"
    alt_target: ["हफ्ता"]
    pos: "noun"
    gender: "m"
    notes: "Formally सप्ताह (saptah)."
  - id: hi-0310
    target: "सोमवार"
    native: "Monday"
    reading: "somvar"
    pos: "noun"
    gender: "m"
    notes: "Each day ends in वार (var, day) and is masculine. सोम is the moon."
  - id: hi-0311
    target: "मंगलवार"
    native: "Tuesday"
    reading: "mangalvar"
    pos: "noun"
    gender: "m"
  - id: hi-0312
    target: "बुधवार"
    native: "Wednesday"
    reading: "budhvar"
    pos: "noun"
    gender: "m"
  - id: hi-0313
    target: "गुरुवार"
    native: "Thursday"
    reading: "guruvar"
    pos: "noun"
    gender: "m"
    notes: "Also बृहस्पतिवार (brihaspativar)."
  - id: hi-0314
    target: "शुक्रवार"
    native: "Friday"
    reading: "shukravar"
    pos: "noun"
    gender: "m"
  - id: hi-0315
    target: "शनिवार"
    native: "Saturday"
    reading: "shanivar"
    pos: "noun"
    gender: "m"
  - id: hi-0316
    target: "रविवार"
    native: "Sunday"
    reading: "ravivar"
    alt_target: ["इतवार"]
    pos: "noun"
    gender: "m"
    notes: "In everyday speech, often इतवार (itvar)."
