  - id: hi-devanagari-036
    target: ब
    native: "ba"
    reading: "ba"
    tags: [consonant]
  - id: hi-devanagari-037
    target: भ
    native: "bha"
    reading: "bha"
    tags: [consonant]
    notes: "Aspirated b."
  - id: hi-devanagari-038
    target: म
    native: "ma"
    reading: "ma"
    tags: [consonant]

  # --- semivowels (antahstha vyanjan) ---------------------------------------
  - id: hi-devanagari-039
    target: य
    native: "ya"
    reading: "ya"
    tags: [consonant]
  - id: hi-devanagari-040
    target: र
    native: "ra"
    reading: "ra"
    tags: [consonant]
  - id: hi-devanagari-041
    target: ल
