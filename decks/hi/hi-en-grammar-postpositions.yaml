schema: 1
id: hi-en-grammar-postpositions
name: "Postpositions: in, on, from"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Hindi's prepositions come after the noun."
tags: [beginner, grammar]
cards:
  - id: hi-en-grammar-postpositions-0001
    target: "में"
    native: "in; inside"
    reading: "men"
    pos: "particle"
    notes: "After the noun: घर में, in the house. A noun before any postposition takes its oblique form: कमरा → कमरे में, in the room."
  - id: hi-en-grammar-postpositions-0002
    target: "पर"
    native: "on; at"
    reading: "par"
    pos: "particle"
    notes: "मेज़ पर, on the table. दुकान पर, at the shop."
  - id: hi-en-grammar-postpositions-0003
    target: "से"
    native: "from; with; by; since"
    reading: "se"
    pos: "particle"
    notes: "दिल्ली से, from Delhi. बस से, by bus. कल से, since yesterday."
  - id: hi-en-grammar-postpositions-0004
    target: "को"
    native: "to; for"
    reading: "ko"
    pos: "particle"
    notes: "The person something is given or said to: राम को दीजिए, give it to Ram. It also marks a particular object: बच्चे को बुलाइए, call the child."
  - id: hi-en-grammar-postpositions-0005
    target: "तक"
    native: "up to; until"
    reading: "tak"
    pos: "particle"
    notes: "स्टेशन तक, as far as the station. पाँच बजे तक, until five."
  - id: hi-en-grammar-postpositions-0006
    target: "का"
    native: "of; 's"
    reading: "kaa"
    pos: "particle"
    notes: "राम का घर, Ram's house. It agrees with the thing owned: राम की किताब, Ram's book; राम के बच्चे, Ram's children."
  - id: hi-en-grammar-postpositions-0007
    target: "के साथ"
    native: "with (together with)"
    reading: "ke saath"
    pos: "phrase"
    notes: "राम के साथ, with Ram. With a pronoun, the possessive comes first: मेरे साथ, with me."
  - id: hi-en-grammar-postpositions-0008
    target: "के लिए"
    native: "for"
    reading: "ke liye"
    pos: "phrase"
    notes: "आपके लिए, for you."
  - id: hi-en-grammar-postpositions-0009
    target: "के पास"
    native: "near; (to have)"
    reading: "ke paas"
    pos: "phrase"
    notes: "स्टेशन के पास, near the station. मेरे पास पैसे हैं, I have money: 'near me there is money'."
  - id: hi-en-grammar-postpositions-0010
    target: "के बाद"
    native: "after"
    reading: "ke baad"
    pos: "phrase"
    notes: "खाने के बाद, after the meal."
  - id: hi-en-grammar-postpositions-0011
    target: "से पहले"
    native: "before"
    reading: "se pahle"
    pos: "phrase"
    notes: "खाने से पहले, before the meal."
  - id: hi-en-grammar-postpositions-0012
    target: "के नीचे"
    native: "under; below"
    reading: "ke niiche"
    pos: "phrase"
    notes: "मेज़ के नीचे, under the table."
