schema: 1
id: hi-en-grammar-postpositions
name: "Postpositions: in, on, from"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Hindi's prepositions come after the noun."
tags: [beginner, grammar]
cards:
  - id: hi-0274
    target: "में"
    native: "in; inside"
    reading: "mēm̐"
    ipa: "mẽː"
    pos: "particle"
    notes: "After the noun: घर में (ghar mēm̐), in the house. A noun before any postposition takes its oblique form: कमरा (kamrā) → कमरे में (kamrē mēm̐), in the room."
  - id: hi-0275
    target: "पर"
    native: "on; at"
    reading: "par"
    ipa: "pər"
    pos: "particle"
    notes: "मेज़ पर (mēz par), on the table. दुकान पर (dukān par), at the shop."
  - id: hi-0276
    target: "से"
    native: "from; with; by; since"
    reading: "sē"
    ipa: "seː"
    pos: "particle"
    notes: "दिल्ली से (dillī sē), from Delhi. बस से (bas sē), by bus. कल से (kal sē), since yesterday."
  - id: hi-0277
    target: "को"
    native: "to; for"
    reading: "kō"
    ipa: "koː"
    pos: "particle"
    notes: "The person something is given or said to: राम को दीजिए (rām kō dījiē), give it to Ram. It also marks a particular object: बच्चे को बुलाइए (baccē kō bulāiē), call the child."
  - id: hi-0278
    target: "तक"
    native: "up to; until"
    reading: "tak"
    ipa: "t̪ək"
    pos: "particle"
    notes: "स्टेशन तक (sṭēśan tak), as far as the station. पाँच बजे तक (pām̐c bajē tak), until five."
  - id: hi-0279
    target: "का"
    native: "of; 's"
    reading: "kā"
    ipa: "kaː"
    pos: "particle"
    notes: "राम का घर (rām kā ghar), Ram's house. It agrees with the thing owned: राम की किताब (rām kī kitāb), Ram's book; राम के बच्चे (rām kē baccē), Ram's children."
  - id: hi-0280
    target: "के साथ"
    native: "with (together with)"
    reading: "kē sāth"
    ipa: "keː saːt̪ʰ"
    pos: "phrase"
    notes: "राम के साथ (rām kē sāth), with Ram. With a pronoun, the possessive comes first: मेरे साथ (mērē sāth), with me."
  - id: hi-0281
    target: "के लिए"
    native: "for"
    reading: "kē liē"
    ipa: "keː lɪeː"
    pos: "phrase"
    notes: "आपके लिए (āpkē liē), for you."
  - id: hi-0282
    target: "के पास"
    native: "near; (to have)"
    reading: "kē pās"
    ipa: "keː paːs"
    pos: "phrase"
    notes: "स्टेशन के पास (sṭēśan kē pās), near the station. मेरे पास पैसे हैं (mērē pās paisē haim̐), I have money: 'near me there is money'."
  - id: hi-0283
    target: "के बाद"
    native: "after"
    reading: "kē bād"
    ipa: "keː baːd̪"
    pos: "phrase"
    notes: "खाने के बाद (khānē kē bād), after the meal."
  - id: hi-0284
    target: "से पहले"
    native: "before"
    reading: "sē pahlē"
    ipa: "seː pəɦleː"
    pos: "phrase"
    notes: "खाने से पहले (khānē sē pahlē), before the meal."
  - id: hi-0285
    target: "के नीचे"
    native: "under; below"
    reading: "kē nīcē"
    ipa: "keː niːtʃeː"
    pos: "phrase"
    notes: "मेज़ के नीचे (mēz kē nīcē), under the table."
