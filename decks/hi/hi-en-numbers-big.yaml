  - id: hi-0225
    target: "सौ"
    native: "100, a hundred"
    reading: "sau"
    ipa: "sɔː"
    pos: "other"
    notes: "दो सौ (dō sau) is 200, पाँच सौ (pām̐c sau) 500. A hundred on its own is सौ or एक सौ."
  - id: hi-0226
    target: "हज़ार"
    native: "1,000, a thousand"
    reading: "hazār"
    ipa: "ɦəzaːr"
    alt_target: ["हजार"]
    pos: "other"
    notes: "दो हज़ार बीस (dō hazār bīs) is 2020."
  - id: hi-0227
    target: "लाख"
    native: "1,00,000, a lakh (a hundred thousand)"
    reading: "lākh"
    ipa: "laːkʰ"
    pos: "other"
    notes: "Indian numbering counts in lakhs and crores, and places its commas to match: 1,00,000 is one lakh, 10,00,000 ten lakh. Prices, salaries and populations are all given this way."
  - id: hi-0228
    target: "करोड़"
    native: "1,00,00,000, a crore (ten million)"
    reading: "karōṛ"
    ipa: "kəroːɽ"
    pos: "other"
    notes: "A hundred lakh. 1,00,00,000."
  - id: hi-0229
    target: "डेढ़"
    native: "1½, one and a half"
    reading: "ḍēṛh"
    ipa: "ɖeːɽʱ"
    pos: "other"
    notes: "With सौ and हज़ार too: डेढ़ सौ (ḍēṛh sau) is 150, डेढ़ हज़ार 1,500. Heard constantly in markets."
  - id: hi-0230
    target: "ढाई"
    native: "2½, two and a half"
    reading: "ḍhāī"
    ipa: "ɖʱaːiː"
    pos: "other"
    notes: "ढाई सौ (ḍhāī sau) is 250. From 3½ on, Hindi says साढ़े (sāṛhē, 'and a half'): साढ़े तीन सौ, 350."
  - id: hi-0523
    target: "इक्कीस"
    native: "21, twenty-one"
    reading: "ikkīs"
    ipa: "ɪkkiːs"
    pos: "other"
    notes: "Each number from 21 to 99 is one word, the unit blended into the ten, often irregularly: learn them as words. Before the next ten comes उन-, 'one less': उनतीस, 29."
