schema: 1
id: hi-en-numbers-big
name: "Tens and big numbers"
kind: vocab
theme: numbers-big
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The tens, a hundred, a thousand, lakh and crore, and the halves every market uses."
tags: [beginner]
cards:
  - id: hi-en-numbers-big-0001
    target: "तीस"
    native: "30, thirty"
    reading: "tiis"
    pos: "other"
    notes: "Every number from 21 to 99 has its own word in Hindi: 26 is छब्बीस (chhabbiis), not 'twenty six'. They are learned one at a time; this deck teaches the tens."
  - id: hi-en-numbers-big-0002
    target: "चालीस"
    native: "40, forty"
    reading: "chaaliis"
    pos: "other"
  - id: hi-en-numbers-big-0003
    target: "पचास"
    native: "50, fifty"
    reading: "pachaas"
    pos: "other"
  - id: hi-en-numbers-big-0004
    target: "साठ"
    native: "60, sixty"
    reading: "saath"
    pos: "other"
  - id: hi-en-numbers-big-0005
    target: "सत्तर"
    native: "70, seventy"
    reading: "sattar"
    pos: "other"
  - id: hi-en-numbers-big-0006
    target: "अस्सी"
    native: "80, eighty"
    reading: "assii"
    pos: "other"
  - id: hi-en-numbers-big-0007
    target: "नब्बे"
    native: "90, ninety"
    reading: "nabbe"
    pos: "other"
  - id: hi-en-numbers-big-0008
    target: "सौ"
    native: "100, a hundred"
    reading: "sau"
    pos: "other"
    notes: "दो सौ (do sau) is 200, पाँच सौ (paanch sau) 500. A hundred on its own is सौ or एक सौ."
  - id: hi-en-numbers-big-0009
    target: "हज़ार"
    native: "1,000, a thousand"
    reading: "hazaar"
    alt_target: ["हजार"]
    pos: "other"
    notes: "दो हज़ार बीस (do hazaar biis) is 2020."
  - id: hi-en-numbers-big-0010
    target: "लाख"
    native: "1,00,000, a lakh (a hundred thousand)"
    reading: "laakh"
    pos: "other"
    notes: "Indian numbering counts in lakhs and crores, and places its commas to match: 1,00,000 is one lakh, 10,00,000 ten lakh. Prices, salaries and populations are all given this way."
  - id: hi-en-numbers-big-0011
    target: "करोड़"
    native: "1,00,00,000, a crore (ten million)"
    reading: "karod"
    pos: "other"
    notes: "A hundred lakh. 1,00,00,000."
  - id: hi-en-numbers-big-0012
    target: "डेढ़"
    native: "1½, one and a half"
    reading: "dedh"
    pos: "other"
    notes: "With सौ and हज़ार too: डेढ़ सौ (dedh sau) is 150, डेढ़ हज़ार 1,500. Heard constantly in markets."
  - id: hi-en-numbers-big-0013
    target: "ढाई"
    native: "2½, two and a half"
    reading: "dhaaii"
    pos: "other"
    notes: "ढाई सौ (dhaaii sau) is 250. From 3½ on, Hindi says साढ़े (saadhe, 'and a half'): साढ़े तीन सौ, 350."
