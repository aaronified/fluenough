schema: 1
id: hi-en-numbers-big
name: "Tens and big numbers"
kind: vocab
theme: numbers-big
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Every number from 21 to 99, a hundred, a thousand, lakh and crore, and the halves every market uses. The numbers from 21 to 99 are not yet checked by a Hindi speaker: please report any mistake."
tags: [beginner]
cards:
  - id: hi-0218
    target: "तीस"
    native: "30, thirty"
    reading: "tīs"
    ipa: "t̪iːs"
    pos: "other"
    notes: "Every number from 21 to 99 has its own word in Hindi: 26 is छब्बीस (chabbīs), not 'twenty six'. They are learned one at a time, and this deck teaches every one."
  - id: hi-0219
    target: "चालीस"
