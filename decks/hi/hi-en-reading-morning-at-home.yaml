      - { text: "माँ सुबह सबसे पहले उठती है।", reading: "mām̐ subah sabsē pahlē uṭhtī hai." }
      - { text: "पिताजी अख़बार पढ़ते हैं।", reading: "pitājī akhbār paṛhte haim̐." }
