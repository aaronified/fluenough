    title: "A note on the fridge"
    theme: "everyday-verbs"
    sentences:
      - { text: "फ़्रिज में दूध है।", reading: "frij mēm̐ dūdh hai." }
      - { text: "मैं दोपहर को घर आऊँगा।", reading: "maim̐ dōpahar kō ghar āūm̐gā." }
    questions:
      - id: "hi-0810"
        prompt: { en: "Where is the milk?" }
