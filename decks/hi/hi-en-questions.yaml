schema: 1
id: hi-en-questions
name: "Yes, no and questions"
kind: vocab
theme: questions
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Yes and no, the question words, and how a sentence becomes a question."
tags: [beginner]
cards:
  - id: hi-0155
    target: "हाँ"
    native: "yes"
    reading: "hām̐"
    ipa: "ɦãː"
    alt_target: ["हां"]
    pos: "other"
    notes: "Said politely: जी हाँ (jī hām̐)."
  - id: hi-0156
    target: "नहीं"
    native: "no; not"
    reading: "nahīm̐"
    ipa: "nəɦĩː"
    pos: "other"
    notes: "Also the 'not' of a sentence, just before the verb: मैं नहीं जानता (maim̐ nahīm̐ jāntā), I don't know."
  - id: hi-0157
    target: "क्या"
    native: "what; also marks a yes/no question"
    reading: "kyā"
    ipa: "kjaː"
    pos: "other"
    notes: "At the start of a sentence, क्या (kyā) turns it into a yes/no question: क्या आप हिंदी बोलते हैं (kyā āp hindī bōltē haim̐)? Do you speak Hindi? In speech the क्या (kyā) is often dropped and the voice rises instead."
  - id: hi-0158
    target: "कौन"
    native: "who"
    reading: "kaun"
    ipa: "kɔːn"
    pos: "other"
  - id: hi-0159
    target: "कहाँ"
    native: "where"
    reading: "kahām̐"
    ipa: "kəɦãː"
    alt_target: ["कहां"]
    pos: "other"
  - id: hi-0160
    target: "कब"
    native: "when"
    reading: "kab"
    ipa: "kəb"
    pos: "other"
  - id: hi-0161
    target: "क्यों"
    native: "why"
    reading: "kyōm̐"
    ipa: "kjõː"
    pos: "other"
  - id: hi-0162
    target: "कैसे"
    native: "how"
    reading: "kaisē"
    ipa: "kɛːseː"
    pos: "other"
  - id: hi-0163
    target: "कितना"
    native: "how much; how many"
    reading: "kitnā"
    ipa: "kɪt̪naː"
    pos: "other"
    notes: "Agrees with what is counted: कितनी (kitnī) with a feminine word, कितने (kitnē) with a plural. कितने लोग (kitnē lōg)? How many people?"
  - id: hi-0164
    target: "कौन-सा"
    native: "which"
    reading: "kaun-sā"
    ipa: "kɔːnsaː"
    alt_target: ["कौन सा"]
    pos: "other"
    notes: "Agrees like an adjective: कौन-सी (kaun-sī) with a feminine word, कौन-से (kaun-sē) with a plural."
  - id: hi-0165
    target: "ठीक है?"
    native: "Is that OK? / OK?"
    reading: "ṭhīk hai?"
    ipa: "ʈʰiːk ɦɛː"
    pos: "phrase"
    notes: "As a reply without the question mark, ठीक है (ṭhīk hai) means 'OK, fine'."
  - id: hi-0166
    target: "सच में?"
    native: "Really?"
    reading: "sac mēm̐?"
    ipa: "sətʃ mẽː"
    pos: "phrase"
