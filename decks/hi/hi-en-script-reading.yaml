schema: 1
id: hi-en-script-reading
name: "First words to read"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Short everyday words written with letters alone, no vowel signs: the headline and its gaps, the standing line, the dot below and the vowel you do not see, at work."
tags: [beginner, unreviewed, script]
cards:
  - ref: hi-0192
    native: "house; home"
    notes: "Two letters under one headline. घ (gha) is gha and र (ra) is ra, but the last a isn't said: ghar."
  - ref: hi-0300
    native: "yesterday; tomorrow"
    notes: "क (ka) and ल (la); the last a is quiet."
  - id: hi-0049
    target: "जल"
    native: "water"
    reading: "jal"
    ipa: "dʒəl"
    notes: "ज (ja) has a standing line; the last a is quiet."
  - id: hi-0050
    target: "कमल"
    native: "lotus"
    reading: "kamal"
    ipa: "kəməl"
    notes: "Three letters and no vowel written: ka-ma-l."
  - id: hi-0051
    target: "नमक"
    native: "salt"
    reading: "namak"
    ipa: "nəmək"
    notes: "न (na), म (ma) and क (ka), each with its a, and the last one quiet."
  - id: hi-0052
    target: "फल"
    native: "fruit"
    reading: "phal"
    ipa: "pʰəl"
    notes: "फ (pha) is प (pa) with a curl, and a breath after it: ph."
  - id: hi-0374
    target: "बस"
    native: "bus; enough"
    reading: "bas"
    ipa: "bəs"
    notes: "ब (ba) has a line across it; without it, it would be व (va)."
  - id: hi-0053
    target: "हम"
    native: "we"
    reading: "ham"
    ipa: "ɦəm"
    notes: "ह (ha) has no standing line; म (ma) does."
  - id: hi-0054
    target: "सब"
    native: "all; everyone"
    reading: "sab"
    ipa: "səb"
    notes: "स (sa) is s, never sh."
  - id: hi-0055
    target: "मगर"
    native: "but; crocodile"
    reading: "magar"
    ipa: "məɡər"
    notes: "Three letters, the last a quiet."
  - ref: hi-0195
    native: "city"
    notes: "श (śa) is sh; then ह (ha) and र (ra)."
  - id: hi-0056
    target: "धन"
    native: "wealth"
    reading: "dhan"
    ipa: "d̪ʱən"
    notes: "ध (dha) has a gap in the headline; without it, it would look like घ (gha)."
  - id: hi-0057
    target: "कलम"
    native: "pen"
    reading: "kalam"
    ipa: "kələm"
    notes: "The letters of कमल (kamal) in another order: क (ka), ल (la), म (ma). The last a is quiet. Also written क़लम (qalam), with a dot below the क (ka)."
  - id: hi-0058
    target: "भजन"
    native: "hymn"
    reading: "bhajan"
    ipa: "bʱədʒən"
    notes: "भ (bha) has a gap in the headline, which tells it from म (ma)."
  - ref: hi-0298
    native: "road"
    notes: "ड़ (ṛa) is ड (ḍa) with a dot below: the tongue placed as for ड (ḍa), not touching."
