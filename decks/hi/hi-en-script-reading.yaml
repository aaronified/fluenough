schema: 1
id: hi-en-script-reading
name: "First words to read"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Short everyday words written with letters alone, no vowel signs: the headline and its gaps, the standing line, the dot below and the vowel you do not see, at work."
tags: [beginner, unreviewed, script]
cards:
  - id: hi-en-script-reading-0001
    target: "घर"
    native: "house; home"
    reading: "ghar"
    notes: "Two letters under one headline. घ is gha and र is ra, but the last a isn't said: ghar."
  - id: hi-en-script-reading-0002
    target: "कल"
    native: "yesterday; tomorrow"
    reading: "kal"
    notes: "क and ल; the last a is quiet."
  - id: hi-en-script-reading-0003
    target: "जल"
    native: "water"
    reading: "jal"
    notes: "ज has a standing line; the last a is quiet."
  - id: hi-en-script-reading-0004
    target: "कमल"
    native: "lotus"
    reading: "kamal"
    notes: "Three letters and no vowel written: ka-ma-l."
  - id: hi-en-script-reading-0005
    target: "नमक"
    native: "salt"
    reading: "namak"
    notes: "न, म and क, each with its a, and the last one quiet."
  - id: hi-en-script-reading-0006
    target: "फल"
    native: "fruit"
    reading: "phal"
    notes: "फ is प with a curl, and a breath after it: ph."
  - id: hi-en-script-reading-0007
    target: "बस"
    native: "bus; enough"
    reading: "bas"
    notes: "ब has a line across it; without it, it would be व."
  - id: hi-en-script-reading-0008
    target: "हम"
    native: "we"
    reading: "ham"
    notes: "ह has no standing line; म does."
  - id: hi-en-script-reading-0009
    target: "सब"
    native: "all; everyone"
    reading: "sab"
    notes: "स is s, never sh."
  - id: hi-en-script-reading-0010
    target: "मगर"
    native: "but; crocodile"
    reading: "magar"
    notes: "Three letters, the last a quiet."
  - id: hi-en-script-reading-0011
    target: "शहर"
    native: "city"
    reading: "shahar"
    notes: "श is sh; then ह and र."
  - id: hi-en-script-reading-0012
    target: "धन"
    native: "wealth"
    reading: "dhan"
    notes: "ध has a gap in the headline; without it, it would look like घ."
  - id: hi-en-script-reading-0013
    target: "कलम"
    native: "pen"
    reading: "kalam"
    notes: "The letters of कमल in another order: क, ल, म. The last a is quiet. Also written क़लम, with a dot below the क."
  - id: hi-en-script-reading-0014
    target: "भजन"
    native: "hymn"
    reading: "bhajan"
    notes: "भ has a gap in the headline, which tells it from म."
  - id: hi-en-script-reading-0015
    target: "सड़क"
    native: "road"
    reading: "sadak"
    notes: "ड़ is ड with a dot below: the tongue placed as for ड, not touching."
