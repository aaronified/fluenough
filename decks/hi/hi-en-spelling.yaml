schema: 1
id: hi-en-spelling
name: "Hindi spellings, old and new"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Spellings you will meet in print, and the standard of the Central Hindi Directorate that settles them. Recognition only. Not yet checked by a Hindi speaker: please report any mistake."
tags: [advanced, unreviewed]
cards:
  - id: hi-0620
    target: "हिन्दी"
    native: "Hindi; standard हिंदी"
    reading: "hindi"
    pos: "other"
    modes: [recognition]
    notes: "The standard of the Central Hindi Directorate writes the dot (anusvar) for a nasal before a consonant of its own row: हिंदी, not हिन्दी. Both are everywhere."
  - id: hi-0621
    target: "सम्बन्ध"
    native: "relation; standard संबंध"
    reading: "sambandh"
    pos: "other"
    modes: [recognition]
    notes: "The same rule: the dot in place of the half nasal letter."
  - id: hi-0622
    target: "पण्डित"
    native: "scholar; pandit; standard पंडित"
    reading: "pandit"
    pos: "other"
    modes: [recognition]
    notes: "The same rule, for ण before ड."
  - id: hi-0623
    target: "हंसना"
    native: "to laugh; standard हँसना"
    reading: "hansna"
    pos: "other"
    modes: [recognition]
    notes: "The moon and dot (chandrabindu) marks a nasal vowel: हँसना. The plain dot is for a nasal consonant. Above the line, where there is no room, the dot stands for both: मैं, नहीं."
  - id: hi-0624
    target: "गये"
    native: "went; standard गए"
    reading: "gaye"
    pos: "other"
    modes: [recognition]
    notes: "Where the ending is a vowel, the standard writes the vowel letter: गए, not गये."
  - id: hi-0625
    target: "नयी"
    native: "new; standard नई"
    reading: "nayi"
    pos: "other"
    modes: [recognition]
    notes: "The same rule: नई, not नयी."
  - id: hi-0626
    target: "लिये"
    native: "for; standard लिए"
    reading: "liye"
    pos: "other"
    modes: [recognition]
    notes: "The same rule: के लिए."
  - id: hi-0627
    target: "चाहिये"
    native: "is needed; standard चाहिए"
    reading: "chahiye"
    pos: "other"
    modes: [recognition]
    notes: "The same rule: चाहिए."
  - id: hi-0628
    target: "जरूर"
    native: "of course; also ज़रूर"
    reading: "zarur"
    pos: "other"
    modes: [recognition]
    notes: "The dot below (nukta) marks the z of words from Persian and Arabic. Many writers leave it out, and the standard allows that where no other word could be confused; dictionaries and careful print keep it: ज़रूर."
  - id: hi-0629
    target: "फोन"
    native: "phone; also फ़ोन"
    reading: "fon"
    pos: "other"
    modes: [recognition]
    notes: "The nukta under फ़ marks an f, in words from English and Persian. Often left out in print."
  - id: hi-0630
    target: "दूकान"
    native: "shop; standard दुकान"
    reading: "dukan"
    pos: "other"
    modes: [recognition]
    notes: "An older spelling with a long ऊ; today दुकान."
