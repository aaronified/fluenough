schema: 1
id: hi-en-spelling
name: "Hindi spellings, old and new"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Spellings you will meet in print, and the standard of the Central Hindi Directorate that settles them. Recognition only. Not yet checked by a Hindi speaker: please report any mistake."
tags: [advanced, unreviewed]
cards:
  - id: hi-0620
    target: "हिन्दी"
    native: "Hindi; standard हिंदी (hindī)"
    reading: "hindī"
    ipa: "ɦɪnd̪iː"
    pos: "other"
    modes: [recognition]
    notes: "The standard of the Central Hindi Directorate writes the dot (anusvar) for a nasal before a consonant of its own row: हिंदी (hindī), not हिन्दी (hindī). Both are everywhere."
  - id: hi-0621
    target: "सम्बन्ध"
    native: "relation; standard संबंध (sambandh)"
    reading: "sambandh"
    ipa: "səmbənd̪ʱ"
    pos: "other"
    modes: [recognition]
    notes: "The same rule: the dot in place of the half nasal letter."
  - id: hi-0622
    target: "पण्डित"
    native: "scholar; pandit; standard पंडित (paṇḍit)"
    reading: "paṇḍit"
    ipa: "pəɳɖɪt̪"
    pos: "other"
    modes: [recognition]
    notes: "The same rule, for ण (ṇa) before ड (ḍa)."
  - id: hi-0623
    target: "हंसना"
    native: "to laugh; standard हँसना (ham̐sanā)"
    reading: "haṁsnā"
    ipa: "ɦə̃snaː"
    pos: "other"
    modes: [recognition]
    notes: "The moon and dot (chandrabindu) marks a nasal vowel: हँसना (ham̐sanā). The plain dot is for a nasal consonant. Above the line, where there is no room, the dot stands for both: मैं (maim̐), नहीं (nahīm̐)."
  - id: hi-0624
    target: "गये"
    native: "went; standard गए (gaē)"
    reading: "gayē"
    ipa: "ɡəjeː"
    pos: "other"
    modes: [recognition]
    notes: "Where the ending is a vowel, the standard writes the vowel letter: गए (gaē), not गये (gayē)."
  - id: hi-0625
    target: "नयी"
    native: "new; standard नई (naī)"
    reading: "nayī"
    ipa: "nəjiː"
    pos: "other"
    modes: [recognition]
    notes: "The same rule: नई (naī), not नयी (nayī)."
  - id: hi-0626
    target: "लिये"
    native: "for; standard लिए (liē)"
    reading: "liyē"
    ipa: "lɪjeː"
    pos: "other"
    modes: [recognition]
    notes: "The same rule: के लिए (kē liē)."
  - id: hi-0627
    target: "चाहिये"
    native: "is needed; standard चाहिए (cāhiē)"
    reading: "cāhiyē"
    ipa: "tʃaːɦɪjeː"
    pos: "other"
    modes: [recognition]
    notes: "The same rule: चाहिए (cāhiē)."
  - id: hi-0628
    target: "जरूर"
    native: "of course; also ज़रूर (zarūr)"
    reading: "jarūr"
    ipa: "dʒəruːr"
    pos: "other"
    modes: [recognition]
    notes: "The dot below (nukta) marks the z of words from Persian and Arabic. Many writers leave it out, and the standard allows that where no other word could be confused; dictionaries and careful print keep it: ज़रूर (zarūr)."
  - id: hi-0629
    target: "फोन"
    native: "phone; also फ़ोन (fōn)"
    reading: "fōn"
    ipa: "foːn"
    pos: "other"
    modes: [recognition]
    notes: "The nukta under फ़ (fa) marks an f, in words from English and Persian. Often left out in print."
  - id: hi-0630
    target: "दूकान"
    native: "shop; standard दुकान (dukān)"
    reading: "dūkān"
    ipa: "d̪uːkaːn"
    pos: "other"
    modes: [recognition]
    notes: "An older spelling with a long ऊ (ū); today दुकान (dukān)."
