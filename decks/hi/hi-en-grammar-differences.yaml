schema: 1
id: hi-en-grammar-differences
name: "How Hindi grammar differs from English"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Before any theme: the verb last, words for in, from and on after the noun, of that agrees, a gender for every noun, three yous, no articles, and how Hindi says have, not and questions."
tags: [beginner, unreviewed, grammar]
cards:
  - id: hi-0116
    target: "वह किताब पढ़ता है।"
    native: "He reads a book."
    reading: "vah kitab parhta hai."
    tags: ["grammar", "word-order"]
    notes: "The verb comes last: subject, object, verb. Word for word, 'he book reading is'."
  - id: hi-0117
    target: "दुकान में"
    native: "in the shop"
    reading: "dukan men"
    tags: ["grammar", "postpositions"]
    notes: "Hindi puts 'in' after the noun: में."
  - id: hi-0118
    target: "दिल्ली से"
    native: "from Delhi"
    reading: "dilli se"
    tags: ["grammar", "postpositions"]
    notes: "से is 'from', and also 'with' or 'by', after the noun."
  - id: hi-0119
    target: "मेज़ पर"
    native: "on the table"
    reading: "mez par"
    tags: ["grammar", "postpositions"]
    notes: "पर is 'on', after the noun."
  - id: hi-0120
    target: "पिता का घर"
    native: "father's house"
    reading: "pita ka ghar"
    tags: ["grammar", "of"]
    notes: "'Of' comes after the owner and agrees with the thing owned: का because घर is masculine."
  - id: hi-0121
    target: "माता की किताब"
    native: "mother's book"
    reading: "mata ki kitab"
    tags: ["grammar", "of"]
    notes: "की because किताब is feminine; the owner's gender doesn't matter."
  - id: hi-0122
    target: "लड़का जाता है।"
    native: "The boy goes."
    reading: "larka jata hai."
    tags: ["grammar", "gender"]
    notes: "Every noun is masculine or feminine, and the verb agrees: जाता for a boy."
  - id: hi-0123
    target: "लड़की जाती है।"
    native: "The girl goes."
    reading: "larki jati hai."
    tags: ["grammar", "gender"]
    notes: "जाती for a girl: the verb changes with the subject's gender."
  - id: hi-0124
    target: "बड़ी खिड़की"
    native: "big window"
    reading: "bari khirki"
    tags: ["grammar", "gender"]
    notes: "Adjectives agree too: बड़ी because खिड़की is feminine; a big room is बड़ा कमरा."
  - id: hi-0125
    target: "आप सुनते हैं।"
    alt_target: ["आप सुनती हैं।"]
    native: "You listen. (respectful)"
    reading: "ap sunte hain."
    tags: ["grammar", "three-yous"]
    notes: "Three words for 'you', each with its own verb form: आप for strangers and elders. The verb also shows who is spoken to: सुनते to a man, सुनती to a woman, and both are accepted here."
  - id: hi-0126
    target: "तुम सुनते हो।"
    alt_target: ["तुम सुनती हो।"]
    native: "You listen. (familiar)"
    reading: "tum sunte ho."
    tags: ["grammar", "three-yous"]
    notes: "तुम for friends and family."
  - id: hi-0127
    target: "तू सुनता है।"
    alt_target: ["तू सुनती है।"]
    native: "You listen. (intimate)"
    reading: "tu sunta hai."
    tags: ["grammar", "three-yous"]
    notes: "तू only for the very close or a child. To anyone else it is rude."
  - id: hi-0128
    target: "घर बड़ा है।"
    native: "The house is big."
    reading: "ghar bara hai."
    tags: ["grammar", "articles"]
    notes: "No word for 'the': घर is 'the house' or 'a house' as the sentence needs."
  - id: hi-0129
    target: "मेरे पास किताब है।"
    native: "I have a book."
    reading: "mere pas kitab hai."
    tags: ["grammar", "have"]
    notes: "No verb 'have': 'near me a book is'."
  - id: hi-0130
    target: "वह नहीं आता।"
    native: "He doesn't come."
    reading: "vah nahin ata."
    tags: ["grammar", "negation"]
    notes: "नहीं comes before the verb, and है is usually dropped."
  - id: hi-0131
    target: "क्या तुम आओगे?"
    alt_target: ["क्या तुम आओगी?"]
    native: "Will you come?"
    reading: "kya tum aoge?"
    tags: ["grammar", "questions"]
    notes: "A yes-or-no question starts with क्या and keeps the statement's word order."
