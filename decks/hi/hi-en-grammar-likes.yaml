schema: 1
id: hi-en-grammar-likes
name: "Likes and dislikes"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "पसंद, अच्छा लगना and प्यार करना: what you like, enjoy and love. Not yet checked by a Hindi speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: hi-0469
    target: "पसंद"
    native: "liking; choice"
    reading: "pasand"
    pos: "noun"
    gender: "f"
    notes: "The liker takes को: मुझे, उसे, आपको … पसंद है."
  - id: hi-0470
    target: "मुझे मिठाई पसंद है।"
    native: "I like sweets."
    reading: "mujhe mithai pasand hai."
    pos: "phrase"
  - id: hi-0471
    target: "मुझे यह गाना पसंद नहीं है।"
    native: "I don't like this song."
    reading: "mujhe yah gana pasand nahin hai."
    pos: "phrase"
  - id: hi-0472
    target: "क्या आपको दिल्ली पसंद है?"
    native: "Do you like Delhi?"
    reading: "kya apko dilli pasand hai?"
    pos: "phrase"
  - id: hi-0473
    target: "मुझे अच्छा लगता है।"
    native: "I like it; I enjoy it."
    reading: "mujhe achha lagta hai."
    pos: "phrase"
    notes: "'To me it feels good'. For a single moment: मुझे अच्छा लगा, I enjoyed it."
  - id: hi-0474
    target: "बहुत अच्छा लगा।"
    native: "I really enjoyed it."
    reading: "bahut achha laga."
    pos: "phrase"
  - id: hi-0475
    target: "प्यार"
    native: "love"
    reading: "pyar"
    pos: "noun"
    gender: "m"
  - id: hi-0476
    target: "मैं तुमसे प्यार करता हूँ।"
    native: "I love you. (said by a man)"
    reading: "main tumse pyar karta hun."
    pos: "phrase"
    notes: "A woman says प्यार करती हूँ. You love से someone, not को."
  - id: hi-0477
    target: "उसे क्रिकेट खेलना पसंद है।"
    native: "He likes playing cricket. / She likes playing cricket."
    reading: "use kriket khelna pasand hai."
    pos: "phrase"
  - id: hi-0478
    target: "मुझे तीखा खाना पसंद नहीं।"
    native: "I don't like spicy food."
    reading: "mujhe tikha khana pasand nahin."
    pos: "phrase"
  - id: hi-0479
    target: "पसंदीदा"
    native: "favourite"
    reading: "pasandida"
    pos: "adj"
    notes: "मेरा पसंदीदा गाना, my favourite song."
