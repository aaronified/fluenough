passages:
  - id: "hi-bargaining"
    title: "Bargaining at a stall"
    theme: "shopping"
    sentences:
      - { text: "यह कितने का है?", reading: "yah kitnē kā hai?", ipa: "jəɦ kɪt̪neː kaː ɦɛː" }
      - { text: "पचास रुपये का है।", reading: "pacās rupyē kā hai.", ipa: "pətʃaːs rʊpjeː kaː ɦɛː" }
      - { text: "थोड़ा कम कीजिए।", reading: "thōṛā kam kījiē.", ipa: "t̪ʰoːɽaː kəm kiːdʒɪeː" }
      - { text: "ठीक है, चालीस रुपये दे दूँगा।", reading: "ṭhīk hai, cālīs rupyē dē dūm̐gā.", ipa: "ʈʰiːk ɦɛː tʃaːliːs rʊpjeː d̪eː d̪ũːɡaː" }
    questions:
      - id: "hi-1424"
        prompt: { en: "The first price is fifty rupees." }
        answer: true
      - id: "hi-1425"
        prompt: { en: "What is the buyer’s final offer?" }
        options:
          - { en: "Forty rupees" }
          - { en: "Fifty rupees" }
        answer: 1
      - id: "hi-1426"
        prompt: { en: "The buyer wants the price to go up." }
        answer: false
  - id: "hi-price-list"
    title: "A shop’s price list"
    theme: "shopping"
    sentences:
      - { text: "चावल: चालीस रुपये किलो।", reading: "cāval: cālīs rupyē kilō.", ipa: "tʃaːʋəl tʃaːliːs rʊpjeː kɪloː" }
      - { text: "दूध: पचास रुपये लीटर।", reading: "dūdh: pacās rupyē līṭar.", ipa: "d̪uːd̪ʱ pətʃaːs rʊpjeː liːʈər" }
      - { text: "आज सब सामान पर बीस प्रतिशत छूट है।", reading: "āj sab sāmān par bīs pratiśat chūṭ hai.", ipa: "aːdʒ səb saːmaːn pər biːs prət̪ɪʃət̪ tʃʰuːʈ ɦɛː" }
      - { text: "पुराने नोट नहीं लिए जाएँगे।", reading: "purānē nōṭ nahīm̐ liē jāēm̐gē.", ipa: "pʊraːneː noːʈ nəɦĩː lɪeː dʒaːẽːɡeː" }
    questions:
      - id: "hi-1427"
        prompt: { en: "Rice costs forty rupees a kilo." }
        answer: true
      - id: "hi-1428"
        prompt: { en: "What is the discount?" }
        options:
          - { en: "Ten per cent" }
          - { en: "Twenty per cent" }
        answer: 2
      - id: "hi-1429"
        prompt: { en: "Old notes are accepted." }
        answer: false
