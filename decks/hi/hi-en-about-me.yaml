id: hi-en-about-me
name: "About me"
kind: vocab
theme: about-me
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Your name, where you are from, where you live, and the people around you."
tags: [beginner]
cards:
  - id: hi-en-about-me-0001
    target: "नाम"
    native: "name"
    reading: "naam"
    pos: "noun"
    gender: "m"
  - id: hi-en-about-me-0002
    target: "मेरा नाम … है।"
    native: "My name is …"
    reading: "meraa naam … hai."
    pos: "phrase"
    notes: "मेरा (meraa, my) is masculine because नाम is. Before a feminine word it is मेरी (merii): मेरी भाषा, my language."
  - id: hi-en-about-me-0003
    target: "आपका नाम क्या है?"
    native: "What is your name?"
    reading: "aapkaa naam kyaa hai?"
    pos: "phrase"
    tags: ["polite"]
  - id: hi-en-about-me-0004
    target: "मैं … से हूँ।"
    native: "I'm from …"
    reading: "main … se huun."
    pos: "phrase"
    notes: "से (se) is 'from', and comes after the place: मैं लंदन से हूँ, I'm from London."
  - id: hi-en-about-me-0005
    target: "मैं … में रहता हूँ।"
    native: "I live in … (said by a man)"
    reading: "main … men rahtaa huun."
    pos: "phrase"
    notes: "A woman says रहती हूँ (rahtii huun). में (men) is 'in', and comes after the place."
  - id: hi-en-about-me-0006
    target: "घर"
    native: "home; house"
