description: "Your name, where you are from, where you live, and the people around you."
tags: [beginner]
cards:
  - id: hi-0187
    target: "नाम"
    native: "name"
    reading: "nām"
    ipa: "naːm"
    pos: "noun"
    gender: "m"
  - id: hi-0188
    target: "मेरा नाम … है।"
    native: "My name is …"
    reading: "mērā nām... hai."
    ipa: "meːraː naːm ɦɛː"
    pos: "phrase"
    notes: "मेरा (mērā, my) is masculine because नाम is. Before a feminine word it is मेरी (mērī): मेरी भाषा, my language."
  - id: hi-0189
    target: "आपका नाम क्या है?"
    native: "What is your name?"
    reading: "āpkā nām kyā hai?"
    ipa: "aːpkaː naːm kjaː ɦɛː"
    pos: "phrase"
    tags: ["polite"]
  - id: hi-0190
    target: "मैं … से हूँ।"
    native: "I'm from …"
    reading: "maim̐... sē hūm̐."
    ipa: "mɛ̃ː seː ɦũː"
    pos: "phrase"
    notes: "से (sē) is 'from', and comes after the place: मैं लंदन से हूँ, I'm from London."
  - id: hi-0191
    target: "मैं … में रहता हूँ।"
    native: "I live in … (said by a man)"
    reading: "maim̐... mēm̐ rahtā hūm̐."
    ipa: "mɛ̃ː mẽː rəɦt̪aː ɦũː"
    pos: "phrase"
    notes: "A woman says रहती हूँ (rahtī hūm̐). में (mēm̐) is 'in', and comes after the place."
