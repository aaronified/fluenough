# How Hindi is romanised: the scheme every `reading` in decks/hi is written
# in, and the spellings a learner may type for the same sound, which grading
# treats as one (#47). The first spelling of each group is the decks' own.
# See docs/DECK-FORMAT.md, "Romanisation files".
schema: 1
kind: romanisation
id: hi-romanisation
language: hi
scheme: "Based on ISO 15919's letters, spelled as said, and departing from the standard where a learner is better served (ADR-0025; the README lists the departures): ā ī ū ē ō for the long vowels, ai and au for ऐ and औ; ṭ ṭh ḍ ḍh ṇ for the retroflex row and t th d dh n for the row on the teeth; c for च and ch for छ; ś for श and ष, said alike; ṛ and ṛh for ड़ and ढ़; q k͟h ġ z f for the letters with a nukta; ê and ô for ऍ and ऑ. The inherent a is left out where it is not said (kitnā, samajh). The anusvara is written as the nasal said (hindī, aṇḍā), or ṁ before y, r, l, v, a sibilant or h (saṁsār), and a nasal vowel ends in m̐ (hām̐, haim̐). ज्ञ is gy and क्ष kś, as said. A typed answer needs none of the marks."
standard: "ISO 15919"
# How a reading's letters are typed, read from the left, longest first:
# each reading is spelled so before an answer is compared with it.
typed:
  - ["ṅkh", "nkh"]
  - ["ṅgh", "ngh"]
  - ["ṅk", "nk"]
  - ["ṅg", "ng"]
  - ["ṅ", "ng"]
  - ["ñch", "nchh"]
  - ["ñc", "nch"]
  - ["ñjh", "njh"]
  - ["ñj", "nj"]
  - ["ñ", "ny"]
  - ["cch", "chh"]
  - ["cc", "chch"]
  - ["ch", "chh"]
  - ["c", "ch"]
  - ["ś", "sh"]
  - ["ṣ", "sh"]
  - ["m̐", "n"]
  - ["ṁ", "n"]
  - ["k͟h", "kh"]
equivalents:
  - ["a", "aa"]
  - ["i", "ee", "ii", "yi", "y"]
  - ["u", "oo", "uu"]
  - ["v", "w"]
  - ["z", "j"]
  - ["f", "ph"]
  - ["chh", "ch"]
  - ["k", "q"]
  - ["e", "ye"]
  - ["mp", "np"]
  - ["mb", "nb"]
