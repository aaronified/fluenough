        ipa: "puːdʒjə"
        meaning: { en: "revered" }
      - word: "शिक्षा-प्रदान"
        modern: "शिक्षा-प्रदान"
        reading: "śikśā-pradān"
        ipa: "ʃɪkʃaːprəd̪aːn"
        meaning: { en: "teaching; literally the giving of learning" }
      - word: "रकाबियाँ"
        modern: "रकाबियाँ"
        reading: "rakābiyām̐"
        ipa: "rəkaːbɪjãː"
