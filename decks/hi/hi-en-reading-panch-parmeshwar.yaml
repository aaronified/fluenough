  - id: hi-panch-parmeshwar-05
    title: "Who would dare?"
    source: "Prem-Dwadashi (1926), page 162"
    sentences:
      - text: "पंचायत में किसकी जीत होगी, इस विषय में जुम्मन को कुछ भी सन्देह न था।"
        reading: "pañcāyat mēm̐ kiskī jīt hōgī, is viśay mēm̐ jumman kō kuch bhī sandēh na thā."
        ipa: "pəɲtʃaːjət̪ mẽː kɪskiː dʒiːt̪ ɦoːɡiː ɪs ʋɪʃəj mẽː dʒʊmmən koː kʊtʃʰ bʱiː sənd̪eːɦ nə t̪ʰaː"
      - text: "आस-पास के गाँवों में ऐसा कौन था, जो उनके अनुग्रहों का ऋणी न हो?"
        reading: "ās-pās kē gām̐vōm̐ mēm̐ aisā kaun thā, jō unkē anugrahōm̐ kā riṇī na hō?"
        ipa: "aːspaːs keː ɡãːʋõː mẽː ɛːsaː kɔːn t̪ʰaː dʒoː ʊnkeː ənʊɡrəɦõː kaː rɪɳiː nə ɦoː"
      - text: "ऐसा कौन था, जो उनको शत्रु बनाने का साहस कर सके?"
        reading: "aisā kaun thā, jō unkō śatru banānē kā sāhas kar sakē?"
        ipa: "ɛːsaː kɔːn t̪ʰaː dʒoː ʊnkoː ʃət̪rʊ bənaːneː kaː saːɦəs kər səkeː"
      - text: "किसमें इतना बल था, जो उनका सामना कर सके?"
        reading: "kismēm̐ itnā bal thā, jō unkā sāmnā kar sakē?"
        ipa: "kɪsmẽː ɪt̪naː bəl t̪ʰaː dʒoː ʊnkaː saːmnaː kər səkeː"
      - text: "आसमान के फ़रिश्ते तो पंचायत करने आवेंगे ही नहीं!"
        reading: "āsmān kē fariśtē tō pañcāyat karnē āvēṅgē hī nahīm̐!"
        ipa: "aːsmaːn keː fərɪʃt̪eː t̪oː pəɲtʃaːjət̪ kərneː aːʋeːŋɡeː ɦiː nəɦĩː"
