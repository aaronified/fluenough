passages:
  - id: hi-panch-parmeshwar-01
    title: "Two friends"
    source: "Prem-Dwadashi (1926), page 160"
    sentences:
      - text: "जुम्मन शेख़ और अलगू चौधरी में गाढ़ी मित्रता थी।"
        reading: "jumman shekh aur algu chaudhari men garhi mitrata thi."
      - text: "साझे में खेती होती थी।"
        reading: "sajhe men kheti hoti thi."
      - text: "कुछ लेन-देन में भी साझा था।"
        reading: "kuchh len-den men bhi sajha tha."
      - text: "एक को दूसरे पर अटल विश्वास था।"
        reading: "ek ko dusre par atal vishvas tha."
      - text: "जुम्मन जब हज करने गये थे, तब अपना घर अलगू को सौंप गये थे और अलगू जब कभी बाहर जाते, तो जुम्मन पर अपना घर छोड़ देते थे।"
        reading: "jumman jab haj karne gaye the, tab apna ghar algu ko saunp gaye the aur algu jab kabhi bahar jate, to jumman par apna ghar chhor dete the."
      - text: "उनमें न खान-पान का व्यवहार था, न धर्म का नाता; केवल विचार मिलते थे।"
        reading: "unmen na khan-pan ka vyavhar tha, na dharm ka nata; keval vichar milte the."
      - text: "मित्र का मूल-मंत्र भी यही है।"
        reading: "mitra ka mul-mantra bhi yahi hai."
    glossary:
      - word: "गाढ़ी"
        modern: "गाढ़ी"
        reading: "garhi"
        meaning: { en: "close, deep (of a friendship); literally thick" }
      - word: "साझे में"
        modern: "साझे में"
        reading: "sajhe men"
        meaning: { en: "in partnership; साझा is a share held together" }
      - word: "लेन-देन"
        modern: "लेन-देन"
        reading: "len-den"
        meaning: { en: "dealings: lending, borrowing, buying and selling" }
      - word: "अटल"
        modern: "अटल"
        reading: "atal"
        meaning: { en: "unshakeable" }
      - word: "हज"
        modern: "हज"
        reading: "haj"
        meaning: { en: "the Hajj, the pilgrimage to Mecca" }
      - word: "गये"
        modern: "गए"
        reading: "gaye"
        meaning: { en: "went" }
        note: { en: "an older spelling of गए; both are still seen" }
      - word: "सौंप"
        modern: "सौंप"
        reading: "saunp"
        meaning: { en: "handed over into someone's care (सौंपना)" }
      - word: "खान-पान"
        modern: "खान-पान"
        reading: "khan-pan"
        meaning: { en: "eating and drinking together" }
      - word: "नाता"
        modern: "नाता"
        reading: "nata"
        meaning: { en: "a tie, a bond" }
      - word: "मूल-मंत्र"
        modern: "मूल-मंत्र"
        reading: "mul-mantra"
        meaning: { en: "the guiding rule; literally the root mantra" }
    questions:
      - id: hi-0631
        prompt: { en: "What did Jumman and Algu share?" }
        options:
          - { en: "A house" }
          - { en: "Their farming" }
          - { en: "A shop" }
        answer: 2
      - id: hi-0632
        prompt: { en: "When Jumman went on the Hajj, he left his house in Algu's care." }
        answer: true
      - id: hi-0633
        prompt: { en: "The two friends ate together and shared one religion." }
        answer: false
  - id: hi-panch-parmeshwar-02
    title: "Schooldays"
    source: "Prem-Dwadashi (1926), page 160"
    sentences:
      - text: "इस मित्रता का जन्म उसी समय हुआ, जब दोनो मित्र बालक ही थे, और जुम्मन के पूज्य पिता, जुमराती, उन्हें शिक्षा-प्रदान करते थे।"
        reading: "is mitrata ka janm usi samay hua, jab dono mitra balak hi the, aur jumman ke pujya pita, jumrati, unhen shiksha-pradan karte the."
      - text: "अलगू ने गुरुजी की बहुत सेवा की, खूब रकाबियाँ माँजीं, खूब प्याले धोये।"
        reading: "algu ne guruji ki bahut seva ki, khub rakabiyan manjin, khub pyale dhoye."
      - text: "उनका हुक्क़ा एक क्षण के लिए भी विश्राम न लेने पाता था; क्योंकि प्रत्येक चिलम अलगू को आध घंटे तक किताबों से अलग कर देती थी।"
        reading: "unka hukka ek kshan ke liye bhi vishram na lene pata tha; kyonki pratyek chilam algu ko adh ghante tak kitabon se alag kar deti thi."
      - text: "अलगू के पिता पुराने विचारों के मनुष्य थे।"
        reading: "algu ke pita purane vicharon ke manushya the."
      - text: "उन्हें शिक्षा की अपेक्षा गुरु की सेवा-शुश्रूषा पर अधिक विश्वास था।"
        reading: "unhen shiksha ki apeksha guru ki seva-shushrusha par adhik vishvas tha."
    glossary:
      - word: "दोनो"
        modern: "दोनों"
        reading: "donon"
        meaning: { en: "both" }
        note: { en: "an older spelling, without the nasal mark" }
      - word: "बालक"
        modern: "बालक"
        reading: "balak"
        meaning: { en: "a boy, a child" }
      - word: "पूज्य"
        modern: "पूज्य"
        reading: "pujya"
        meaning: { en: "revered" }
      - word: "शिक्षा-प्रदान"
        modern: "शिक्षा-प्रदान"
        reading: "shiksha-pradan"
        meaning: { en: "teaching; literally the giving of learning" }
      - word: "रकाबियाँ"
        modern: "रकाबियाँ"
        reading: "rakabiyan"
        meaning: { en: "plates; one is a रकाबी" }
      - word: "माँजीं"
        modern: "माँजीं"
        reading: "manjin"
        meaning: { en: "scrubbed clean (dishes)" }
      - word: "धोये"
        modern: "धोए"
        reading: "dhoye"
        meaning: { en: "washed" }
        note: { en: "an older spelling of धोए" }
      - word: "हुक्क़ा"
        modern: "हुक्का"
        reading: "hukka"
        meaning: { en: "a hookah, a water pipe for tobacco" }
        note: { en: "printed with a nukta, as in Urdu; written हुक्का today" }
      - word: "विश्राम"
        modern: "विश्राम"
        reading: "vishram"
        meaning: { en: "rest" }
      - word: "चिलम"
        modern: "चिलम"
        reading: "chilam"
        meaning: { en: "the clay bowl of a hookah, where the tobacco burns" }
      - word: "आध घंटे"
        modern: "आधे घंटे"
        reading: "adhe ghante"
        meaning: { en: "half an hour" }
        note: { en: "an older form" }
      - word: "सेवा-शुश्रूषा"
        modern: "सेवा-शुश्रूषा"
        reading: "seva-shushrusha"
        meaning: { en: "service and care" }
      - word: "अपेक्षा"
        modern: "अपेक्षा"
        reading: "apeksha"
        meaning: { en: "here: compared with; today it usually means expectation" }
    questions:
      - id: hi-0634
        prompt: { en: "Who taught the two boys?" }
        options:
          - { en: "Algu's father" }
          - { en: "A teacher from the town" }
          - { en: "Jumman's father, Jumrati" }
        answer: 3
      - id: hi-0635
        prompt: { en: "How did Algu serve his teacher?" }
        options:
          - { en: "He scrubbed his plates and washed his cups" }
          - { en: "He cooked his meals" }
          - { en: "He wrote his letters" }
        answer: 1
      - id: hi-0636
        prompt: { en: "Algu's father put more faith in serving the teacher than in studying." }
        answer: true
  - id: hi-panch-parmeshwar-03
    title: "Khala asks for money"
    source: "Prem-Dwadashi (1926), page 161"
    sentences:
      - text: "अन्त को एक दिन ख़ाला ने जुम्मन से कहा—बेटा! तुम्हारे साथ मेरा निबाह न होगा।"
        reading: "ant ko ek din khala ne jumman se kaha - beta! tumhare sath mera nibah na hoga."
      - text: "तुम मुझे रुपए दे दिया करो, मैं अपना पका-खा लूँगी।"
        reading: "tum mujhe rupaye de diya karo, main apna paka-kha lungi."
      - text: "जुम्मन ने धृष्टता के साथ उत्तर दिया—रुपए क्या यहाँ फलते हैं?"
        reading: "jumman ne dhrishtata ke sath uttar diya - rupaye kya yahan phalte hain?"
      - text: "ख़ाला ने नम्रता से कहा—मुझे कुछ रूखा-सूखा चाहिये भी कि नहीं?"
        reading: "khala ne namrata se kaha - mujhe kuchh rukha-sukha chahiye bhi ki nahin?"
      - text: "जुम्मन ने गंभीर स्वर से जवाब दिया—तो कोई यह थोड़े ही समझा था, कि तुम मौत से लड़कर आई हो?"
        reading: "jumman ne gambhir svar se javab diya - to koi yah thore hi samjha tha, ki tum maut se larkar ayi ho?"
    glossary:
      - word: "ख़ाला"
        modern: "ख़ाला"
        reading: "khala"
        meaning: { en: "aunt, a mother's sister; Premchand glosses it मौसी" }
      - word: "अन्त को"
        modern: "अंत को"
        reading: "ant ko"
        meaning: { en: "in the end" }
        note: { en: "an older spelling with a half न; अंत today" }
      - word: "निबाह"
        modern: "निबाह"
        reading: "nibah"
        meaning: { en: "getting along, living together" }
      - word: "पका-खा लूँगी"
        modern: "पका-खा लूँगी"
        reading: "paka-kha lungi"
        meaning: { en: "I'll cook and eat for myself" }
      - word: "धृष्टता"
        modern: "धृष्टता"
        reading: "dhrishtata"
        meaning: { en: "rudeness, insolence" }
      - word: "फलते"
        modern: "फलते"
        reading: "phalte"
        meaning: { en: "grow, bear fruit (फलना)" }
      - word: "नम्रता"
        modern: "नम्रता"
        reading: "namrata"
        meaning: { en: "humbleness, politeness" }
      - word: "रूखा-सूखा"
        modern: "रूखा-सूखा"
        reading: "rukha-sukha"
        meaning: { en: "plain, dry food: the bare minimum" }
      - word: "चाहिये"
        modern: "चाहिए"
        reading: "chahiye"
        meaning: { en: "is needed" }
        note: { en: "an older spelling of चाहिए" }
      - word: "थोड़े ही"
        modern: "थोड़े ही"
        reading: "thore hi"
        meaning: { en: "hardly, not at all (said with scorn)" }
      - word: "मौत से लड़कर"
        modern: "मौत से लड़कर"
        reading: "maut se larkar"
        meaning: { en: "having fought off death: Jumman sneers that no one expected her to live so long" }
    questions:
      - id: hi-0637
        prompt: { en: "What does Khala ask Jumman for?" }
        options:
          - { en: "Her land back" }
          - { en: "Money, so she can cook for herself" }
          - { en: "A new house" }
        answer: 2
      - id: hi-0638
        prompt: { en: "Jumman answers her politely." }
        answer: false
      - id: hi-0639
        prompt: { en: "Khala answers Jumman humbly." }
        answer: true
  - id: hi-panch-parmeshwar-04
    title: "A panchayat, then"
    source: "Prem-Dwadashi (1926), page 161"
    sentences:
      - text: "जुम्मन हँसे, जिस तरह कोई शिकारी हिरन को जाल की तरफ जाते देखकर मन-ही-मन हँसता है।"
        reading: "jumman hanse, jis tarah koi shikari hiran ko jal ki taraf jate dekhkar man-hi-man hansta hai."
      - text: "वह बोले—हाँ, ज़रूर पंचायत करो।"
        reading: "vah bole - han, zarur panchayat karo."
      - text: "फ़ैसला हो जाय।"
        reading: "faisla ho jay."
      - text: "मुझे भी यह रात-दिन की खटपट पसन्द नहीं।"
        reading: "mujhe bhi yah rat-din ki khatpat pasand nahin."
    glossary:
      - word: "शिकारी"
        modern: "शिकारी"
        reading: "shikari"
        meaning: { en: "a hunter" }
      - word: "हिरन"
        modern: "हिरन"
        reading: "hiran"
        meaning: { en: "a deer" }
      - word: "जाल"
        modern: "जाल"
        reading: "jal"
        meaning: { en: "a net, a trap" }
      - word: "मन-ही-मन"
        modern: "मन-ही-मन"
        reading: "man-hi-man"
        meaning: { en: "inwardly, to oneself" }
      - word: "पंचायत"
        modern: "पंचायत"
        reading: "panchayat"
        meaning: { en: "a village council that settles disputes" }
      - word: "फ़ैसला"
        modern: "फ़ैसला"
        reading: "faisla"
        meaning: { en: "a decision, a verdict" }
      - word: "जाय"
        modern: "जाए"
        reading: "jaye"
        meaning: { en: "may it go; हो जाय, let it be done" }
        note: { en: "an older spelling of जाए" }
      - word: "खटपट"
        modern: "खटपट"
        reading: "khatpat"
        meaning: { en: "squabbling" }
      - word: "पसन्द"
        modern: "पसंद"
        reading: "pasand"
        meaning: { en: "liked" }
        note: { en: "an older spelling with a half न; पसंद today" }
    questions:
      - id: hi-0640
        prompt: { en: "What is Jumman compared to?" }
        options:
          - { en: "A deer caught in a net" }
          - { en: "A farmer watching the rain" }
          - { en: "A hunter watching a deer walk towards a net" }
        answer: 3
      - id: hi-0641
        prompt: { en: "How does Jumman take the idea of a panchayat?" }
        options:
          - { en: "He is afraid of it" }
          - { en: "He welcomes it" }
          - { en: "He refuses to go" }
        answer: 2
      - id: hi-0642
        prompt: { en: "Jumman says he too is tired of the quarrelling." }
        answer: true
  - id: hi-panch-parmeshwar-05
    title: "Who would dare?"
    source: "Prem-Dwadashi (1926), page 162"
    sentences:
      - text: "पंचायत में किसकी जीत होगी, इस विषय में जुम्मन को कुछ भी सन्देह न था।"
        reading: "panchayat men kiski jit hogi, is vishay men jumman ko kuchh bhi sandeh na tha."
      - text: "आस-पास के गाँवों में ऐसा कौन था, जो उनके अनुग्रहों का ऋणी न हो?"
        reading: "as-pas ke ganvon men aisa kaun tha, jo unke anugrahon ka rini na ho?"
      - text: "ऐसा कौन था, जो उनको शत्रु बनाने का साहस कर सके?"
        reading: "aisa kaun tha, jo unko shatru banane ka sahas kar sake?"
      - text: "किसमें इतना बल था, जो उनका सामना कर सके?"
        reading: "kismen itna bal tha, jo unka samna kar sake?"
      - text: "आसमान के फ़रिश्ते तो पंचायत करने आवेंगे ही नहीं!"
        reading: "asman ke farishte to panchayat karne avenge hi nahin!"
    glossary:
      - word: "विषय"
        modern: "विषय"
        reading: "vishay"
        meaning: { en: "a matter, a subject" }
      - word: "सन्देह"
        modern: "संदेह"
        reading: "sandeh"
        meaning: { en: "doubt" }
        note: { en: "an older spelling with a half न; संदेह today" }
      - word: "अनुग्रहों"
        modern: "अनुग्रहों"
        reading: "anugrahon"
        meaning: { en: "favours, kindnesses" }
      - word: "ऋणी"
        modern: "ऋणी"
        reading: "rini"
        meaning: { en: "indebted" }
      - word: "शत्रु"
        modern: "शत्रु"
        reading: "shatru"
        meaning: { en: "an enemy" }
      - word: "साहस"
        modern: "साहस"
        reading: "sahas"
        meaning: { en: "courage" }
      - word: "बल"
        modern: "बल"
        reading: "bal"
        meaning: { en: "strength" }
      - word: "फ़रिश्ते"
        modern: "फ़रिश्ते"
        reading: "farishte"
        meaning: { en: "angels" }
      - word: "आवेंगे"
        modern: "आएँगे"
        reading: "ayenge"
        meaning: { en: "will come" }
        note: { en: "an older form of आएँगे" }
    questions:
      - id: hi-0643
        prompt: { en: "Jumman had no doubt that he would win." }
        answer: true
      - id: hi-0644
        prompt: { en: "Why would no one stand against Jumman?" }
        options:
          - { en: "Everyone nearby owed him favours" }
          - { en: "He was the village headman" }
          - { en: "He had many sons" }
        answer: 1
      - id: hi-0645
        prompt: { en: "Who, Jumman thinks, will not come to the panchayat?" }
        options:
          - { en: "The village elders" }
          - { en: "His friend Algu" }
          - { en: "The angels of heaven" }
        answer: 3
