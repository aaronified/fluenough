passages:
  - id: hi-panch-parmeshwar-01
    title: "Two friends"
    source: "Prem-Dwadashi (1926), page 160"
    sentences:
      - text: "जुम्मन शेख़ और अलगू चौधरी में गाढ़ी मित्रता थी।"
        reading: "jumman śēḵ aur algū caudharī mēm̐ gāṛhī mitratā thī."
        ipa: "dʒʊmmən ʃeːx ɔːr əlɡuː tʃɔːd̪ʱəriː mẽː ɡaːɽʱiː mɪt̪rət̪aː t̪ʰiː"
      - text: "साझे में खेती होती थी।"
        reading: "sājhē mēm̐ khētī hōtī thī."
        ipa: "saːdʒʱeː mẽː kʰeːt̪iː ɦoːt̪iː t̪ʰiː"
      - text: "कुछ लेन-देन में भी साझा था।"
        reading: "kuch lēn-dēn mēm̐ bhī sājhā thā."
        ipa: "kʊtʃʰ leːnd̪eːn mẽː bʱiː saːdʒʱaː t̪ʰaː"
      - text: "एक को दूसरे पर अटल विश्वास था।"
        reading: "ēk kō dūsrē par aṭal viśvās thā."
        ipa: "eːk koː d̪uːsreː pər əʈəl ʋɪʃʋaːs t̪ʰaː"
      - text: "जुम्मन जब हज करने गये थे, तब अपना घर अलगू को सौंप गये थे और अलगू जब कभी बाहर जाते, तो जुम्मन पर अपना घर छोड़ देते थे।"
        reading: "jumman jab haj karnē gayē thē, tab apnā ghar algū kō saump gayē thē aur algū jab kabhī bāhar jātē, tō jumman par apnā ghar chōṛ dētē thē."
        ipa: "dʒʊmmən dʒəb ɦədʒ kərneː ɡəjeː t̪ʰeː t̪əb əpnaː ɡʱər əlɡuː koː sɔːmp ɡəjeː t̪ʰeː ɔːr əlɡuː dʒəb kəbʱiː baːɦər dʒaːt̪eː t̪oː dʒʊmmən pər əpnaː ɡʱər tʃʰoːɽ d̪eːt̪eː t̪ʰeː"
      - text: "उनमें न खान-पान का व्यवहार था, न धर्म का नाता; केवल विचार मिलते थे।"
        reading: "unmēm̐ na khān-pān kā vyavhār thā, na dharm kā nātā; kēval vicār miltē thē."
        ipa: "ʊnmẽː nə kʰaːnpaːn kaː ʋjəʋɦaːr t̪ʰaː nə d̪ʱərm kaː naːt̪aː keːʋəl ʋɪtʃaːr mɪlt̪eː t̪ʰeː"
      - text: "मित्र का मूल-मंत्र भी यही है।"
        reading: "mitra kā mūl-mantra bhī yahī hai."
        ipa: "mɪt̪rə kaː muːlmənt̪rə bʱiː jəɦiː ɦɛː"
    glossary:
      - word: "गाढ़ी"
        modern: "गाढ़ी"
        reading: "gāṛhī"
        ipa: "ɡaːɽʱiː"
        meaning: { en: "close, deep (of a friendship); literally thick" }
      - word: "साझे में"
        modern: "साझे में"
        reading: "sājhē mēm̐"
        ipa: "saːdʒʱeː mẽː"
        meaning: { en: "in partnership; साझा is a share held together" }
      - word: "लेन-देन"
        modern: "लेन-देन"
        reading: "lēn-dēn"
        ipa: "leːnd̪eːn"
        meaning: { en: "dealings: lending, borrowing, buying and selling" }
      - word: "अटल"
        modern: "अटल"
        reading: "aṭal"
        ipa: "əʈəl"
        meaning: { en: "unshakeable" }
      - word: "हज"
        modern: "हज"
        reading: "haj"
        ipa: "ɦədʒ"
        meaning: { en: "the Hajj, the pilgrimage to Mecca" }
      - word: "गये"
        modern: "गए"
        reading: "gaē"
        ipa: "ɡəeː"
        meaning: { en: "went" }
        note: { en: "an older spelling of गए; both are still seen" }
      - word: "सौंप"
        modern: "सौंप"
        reading: "saump"
        ipa: "sɔːmp"
        meaning: { en: "handed over into someone's care (सौंपना)" }
      - word: "खान-पान"
        modern: "खान-पान"
        reading: "khān-pān"
        ipa: "kʰaːnpaːn"
        meaning: { en: "eating and drinking together" }
      - word: "नाता"
        modern: "नाता"
        reading: "nātā"
        ipa: "naːt̪aː"
        meaning: { en: "a tie, a bond" }
      - word: "मूल-मंत्र"
        modern: "मूल-मंत्र"
        reading: "mūl-mantra"
        ipa: "muːlmənt̪rə"
        meaning: { en: "the guiding rule; literally the root mantra" }
    questions:
      - id: hi-0631
        prompt: { en: "What did Jumman and Algu share?" }
        options:
          - { en: "A house" }
          - { en: "Their farming" }
          - { en: "A shop" }
        answer: 2
      - id: hi-0632
        prompt: { en: "When Jumman went on the Hajj, he left his house in Algu's care." }
        answer: true
      - id: hi-0633
        prompt: { en: "The two friends ate together and shared one religion." }
        answer: false
  - id: hi-panch-parmeshwar-02
    title: "Schooldays"
    source: "Prem-Dwadashi (1926), page 160"
    sentences:
      - text: "इस मित्रता का जन्म उसी समय हुआ, जब दोनो मित्र बालक ही थे, और जुम्मन के पूज्य पिता, जुमराती, उन्हें शिक्षा-प्रदान करते थे।"
        reading: "is mitratā kā janm usī samay huā, jab dōnō mitra bālak hī thē, aur jumman kē pūjya pitā, jumrātī, unhēm̐ śikśā-pradān kartē thē."
        ipa: "ɪs mɪt̪rət̪aː kaː dʒənm ʊsiː səməj ɦʊaː dʒəb d̪oːnoː mɪt̪rə baːlək ɦiː t̪ʰeː ɔːr dʒʊmmən keː puːdʒjə pɪt̪aː dʒʊmraːt̪iː ʊnɦẽː ʃɪkʃaːprəd̪aːn kərt̪eː t̪ʰeː"
      - text: "अलगू ने गुरुजी की बहुत सेवा की, खूब रकाबियाँ माँजीं, खूब प्याले धोये।"
        reading: "algū nē gurujī kī bahut sēvā kī, khūb rakābiyām̐ mām̐jīm̐, khūb pyālē dhōyē."
        ipa: "əlɡuː neː ɡʊrʊdʒiː kiː bəɦʊt̪ seːʋaː kiː kʰuːb rəkaːbɪjãː mãːdʒĩː kʰuːb pjaːleː d̪ʱoːjeː"
      - text: "उनका हुक्क़ा एक क्षण के लिए भी विश्राम न लेने पाता था; क्योंकि प्रत्येक चिलम अलगू को आध घंटे तक किताबों से अलग कर देती थी।"
        reading: "unkā hukqā ēk kśaṇ kē liē bhī viśrām na lēnē pātā thā; kyōṅki pratyēk cilam algū kō ādh ghaṇṭē tak kitābōm̐ sē alag kar dētī thī."
        ipa: "ʊnkaː ɦʊkqaː eːk kʃəɳ keː lɪeː bʱiː ʋɪʃraːm nə leːneː paːt̪aː t̪ʰaː kjoːŋkɪ prət̪jeːk tʃɪləm əlɡuː koː aːd̪ʱ ɡʱəɳʈeː t̪ək kɪt̪aːbõː seː ələɡ kər d̪eːt̪iː t̪ʰiː"
      - text: "अलगू के पिता पुराने विचारों के मनुष्य थे।"
        reading: "algū kē pitā purānē vicārōm̐ kē manuśya thē."
        ipa: "əlɡuː keː pɪt̪aː pʊraːneː ʋɪtʃaːrõː keː mənʊʃjə t̪ʰeː"
      - text: "उन्हें शिक्षा की अपेक्षा गुरु की सेवा-शुश्रूषा पर अधिक विश्वास था।"
        reading: "unhēm̐ śikśā kī apēkśā guru kī sēvā-śuśrūśā par adhik viśvās thā."
        ipa: "ʊnɦẽː ʃɪkʃaː kiː əpeːkʃaː ɡʊrʊ kiː seːʋaːʃʊʃruːʃaː pər əd̪ʱɪk ʋɪʃʋaːs t̪ʰaː"
    glossary:
      - word: "दोनो"
        modern: "दोनों"
        reading: "dōnōm̐"
        ipa: "d̪oːnõː"
        meaning: { en: "both" }
        note: { en: "an older spelling, without the nasal mark" }
      - word: "बालक"
        modern: "बालक"
        reading: "bālak"
