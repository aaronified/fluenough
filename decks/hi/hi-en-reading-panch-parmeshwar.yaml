      - word: "मौत से लड़कर"
        modern: "मौत से लड़कर"
        reading: "maut sē laṛkar"
        ipa: "mɔːt̪ seː ləɽkər"
        meaning: { en: "having fought off death: Jumman sneers that no one expected her to live so long" }
    questions:
      - id: hi-0637
        prompt: { en: "What does Khala ask Jumman for?" }
        options:
          - { en: "Her land back" }
          - { en: "Money, so she can cook for herself" }
          - { en: "A new house" }
        answer: 2
      - id: hi-0638
        prompt: { en: "Jumman answers her politely." }
        answer: false
      - id: hi-0639
        prompt: { en: "Khala answers Jumman humbly." }
        answer: true
  - id: hi-panch-parmeshwar-04
    title: "A panchayat, then"
    source: "Prem-Dwadashi (1926), page 161"
    sentences:
      - text: "जुम्मन हँसे, जिस तरह कोई शिकारी हिरन को जाल की तरफ जाते देखकर मन-ही-मन हँसता है।"
        reading: "jumman ham̐sē, jis tarah kōī śikārī hiran kō jāl kī taraf jātē dēkhkar man-hī-man ham̐stā hai."
        ipa: "dʒʊmmən ɦə̃seː dʒɪs t̪ərəɦ koːiː ʃɪkaːriː ɦɪrən koː dʒaːl kiː t̪ərəf dʒaːt̪eː d̪eːkʰkər mənɦiːmən ɦə̃st̪aː ɦɛː"
