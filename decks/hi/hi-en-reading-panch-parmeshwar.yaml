      - word: "धोये"
        modern: "धोए"
        reading: "dhōē"
        ipa: "d̪ʱoːeː"
        meaning: { en: "washed" }
        note: { en: "an older spelling of धोए" }
      - word: "हुक्क़ा"
        modern: "हुक्का"
        reading: "hukkā"
        ipa: "ɦʊkkaː"
        meaning: { en: "a hookah, a water pipe for tobacco" }
        note: { en: "printed with a nukta, as in Urdu; written हुक्का today" }
      - word: "विश्राम"
        modern: "विश्राम"
        reading: "viśrām"
        ipa: "ʋɪʃraːm"
        meaning: { en: "rest" }
      - word: "चिलम"
        modern: "चिलम"
        reading: "cilam"
        ipa: "tʃɪləm"
        meaning: { en: "the clay bowl of a hookah, where the tobacco burns" }
      - word: "आध घंटे"
        modern: "आधे घंटे"
        reading: "ādhē ghaṇṭē"
        ipa: "aːd̪ʱeː ɡʱəɳʈeː"
        meaning: { en: "half an hour" }
        note: { en: "an older form" }
      - word: "सेवा-शुश्रूषा"
        modern: "सेवा-शुश्रूषा"
        reading: "sēvā-śuśrūśā"
        ipa: "seːʋaːʃʊʃruːʃaː"
        meaning: { en: "service and care" }
      - word: "अपेक्षा"
        modern: "अपेक्षा"
        reading: "apēkśā"
        ipa: "əpeːkʃaː"
        meaning: { en: "here: compared with; today it usually means expectation" }
    questions:
      - id: hi-0634
        prompt: { en: "Who taught the two boys?" }
        options:
          - { en: "Algu's father" }
          - { en: "A teacher from the town" }
          - { en: "Jumman's father, Jumrati" }
        answer: 3
      - id: hi-0635
        prompt: { en: "How did Algu serve his teacher?" }
        options:
          - { en: "He scrubbed his plates and washed his cups" }
          - { en: "He cooked his meals" }
          - { en: "He wrote his letters" }
        answer: 1
      - id: hi-0636
        prompt: { en: "Algu's father put more faith in serving the teacher than in studying." }
        answer: true
  - id: hi-panch-parmeshwar-03
    title: "Khala asks for money"
    source: "Prem-Dwadashi (1926), page 161"
    sentences:
      - text: "अन्त को एक दिन ख़ाला ने जुम्मन से कहा—बेटा! तुम्हारे साथ मेरा निबाह न होगा।"
        reading: "ant kō ēk din ḵālā nē jumman sē kahā - bēṭā! tumhārē sāth mērā nibāh na hōgā."
        ipa: "ənt̪ koː eːk d̪ɪn xaːlaː neː dʒʊmmən seː kəɦaːbeːʈaː t̪ʊmɦaːreː saːt̪ʰ meːraː nɪbaːɦ nə ɦoːɡaː"
      - text: "तुम मुझे रुपए दे दिया करो, मैं अपना पका-खा लूँगी।"
        reading: "tum mujhē rupaē dē diyā karō, maim̐ apnā pakā-khā lūm̐gī."
        ipa: "t̪ʊm mʊdʒʱeː rʊpəeː d̪eː d̪ɪjaː kəroː mɛ̃ː əpnaː pəkaːkʰaː lũːɡiː"
      - text: "जुम्मन ने धृष्टता के साथ उत्तर दिया—रुपए क्या यहाँ फलते हैं?"
        reading: "jumman nē dhriśṭatā kē sāth uttar diyā - rupaē kyā yahām̐ phaltē haim̐?"
        ipa: "dʒʊmmən neː d̪ʱrɪʃʈət̪aː keː saːt̪ʰ ʊt̪t̪ər d̪ɪjaːrʊpəeː kjaː jəɦãː pʰəlt̪eː ɦɛ̃ː"
      - text: "ख़ाला ने नम्रता से कहा—मुझे कुछ रूखा-सूखा चाहिये भी कि नहीं?"
        reading: "ḵālā nē namratā sē kahā - mujhē kuch rūkhā-sūkhā cāhiyē bhī ki nahīm̐?"
        ipa: "xaːlaː neː nəmrət̪aː seː kəɦaːmʊdʒʱeː kʊtʃʰ ruːkʰaːsuːkʰaː tʃaːɦɪjeː bʱiː kɪ nəɦĩː"
      - text: "जुम्मन ने गंभीर स्वर से जवाब दिया—तो कोई यह थोड़े ही समझा था, कि तुम मौत से लड़कर आई हो?"
        reading: "jumman nē gambhīr svar sē javāb diyā - tō kōī yah thōṛē hī samjhā thā, ki tum maut sē laṛkar āī hō?"
        ipa: "dʒʊmmən neː ɡəmbʱiːr sʋər seː dʒəʋaːb d̪ɪjaːt̪oː koːiː jəɦ t̪ʰoːɽeː ɦiː səmdʒʱaː t̪ʰaː kɪ t̪ʊm mɔːt̪ seː ləɽkər aːiː ɦoː"
    glossary:
      - word: "ख़ाला"
        modern: "ख़ाला"
        reading: "ḵālā"
        ipa: "xaːlaː"
        meaning: { en: "aunt, a mother's sister; Premchand glosses it मौसी" }
      - word: "अन्त को"
        modern: "अंत को"
        reading: "ant kō"
        ipa: "ənt̪ koː"
        meaning: { en: "in the end" }
