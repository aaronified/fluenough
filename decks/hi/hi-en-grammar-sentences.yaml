description: "Word order and the verb 'to be': the verb comes last."
tags: [beginner, grammar]
cards:
  - id: hi-0145
    target: "मैं छात्र हूँ।"
    native: "I am a student. (said by a man)"
    reading: "maim̐ chātra hūm̐."
    ipa: "mɛ̃ː tʃʰaːt̪rə ɦũː"
    pos: "phrase"
    notes: "The verb comes last. 'To be' is हूँ (hūm̐) with मैं (maim̐), हो (hō) with तुम (tum), है (hai) with यह (yah) and वह (vah), हैं (haim̐) with हम (ham), आप (āp) and वे (vē). A woman says मैं छात्रा हूँ (chhatra)."
  - id: hi-0146
    target: "यह मेरा घर है।"
    native: "This is my house."
    reading: "yah mērā ghar hai."
    ipa: "jəɦ meːraː ɡʱər ɦɛː"
    pos: "phrase"
  - id: hi-0147
    target: "वह डॉक्टर है।"
    native: "He is a doctor. / She is a doctor."
    reading: "vah ḍôkṭar hai."
    ipa: "ʋəɦ ɖɔkʈər ɦɛː"
    pos: "phrase"
    notes: "वह (vah) is he, she and it: nothing in this sentence says which."
  - id: hi-0148
    target: "मैं चाय पीता हूँ।"
    native: "I drink tea. (said by a man)"
    reading: "maim̐ cāy pītā hūm̐."
    ipa: "mɛ̃ː tʃaːj piːt̪aː ɦũː"
    pos: "phrase"
    notes: "Subject, object, verb. A woman says पीती हूँ (pītī hūm̐)."
  - id: hi-0149
    target: "वह हिंदी सीख रही है।"
    native: "She is learning Hindi."
    reading: "vah hindī sīkh rahī hai."
    ipa: "ʋəɦ ɦɪnd̪iː siːkʰ rəɦiː ɦɛː"
    pos: "phrase"
    notes: "Here the verb, रही (rahī), is what says it is a woman."
  - id: hi-0150
    target: "मुझे हिंदी पसंद है।"
    native: "I like Hindi."
    reading: "mujhē hindī pasand hai."
    ipa: "mʊdʒʱeː ɦɪnd̪iː pəsənd̪ ɦɛː"
    pos: "phrase"
    notes: "Literally 'to me, Hindi is pleasing'. The person who likes takes को (kō), or its short form: मुझे (mujhē)."
  - id: hi-0151
    target: "मेरे पास एक गाड़ी है।"
    native: "I have a car."
    reading: "mērē pās ēk gāṛī hai."
    ipa: "meːreː paːs eːk ɡaːɽiː ɦɛː"
    pos: "phrase"
    notes: "There is no verb 'to have' for things: 'near me there is a car'. For family: मेरे दो भाई हैं (mērē dō bhāī haim̐), I have two brothers."
  - id: hi-0152
    target: "यह अच्छा नहीं है।"
    native: "This isn't good."
    reading: "yah acchā nahīm̐ hai."
    ipa: "jəɦ ətʃtʃʰaː nəɦĩː ɦɛː"
    pos: "phrase"
    notes: "नहीं (nahīm̐) comes just before the verb."
  - id: hi-0153
    target: "मत जाइए।"
    native: "Please don't go."
    reading: "mat jāiē."
    ipa: "mət̪ dʒaːɪeː"
    pos: "phrase"
    notes: "मत (mat) is 'don't' with a request; a statement takes नहीं (nahīm̐)."
  - id: hi-0154
    target: "यहाँ बहुत गर्मी है।"
    native: "It's very hot here."
    reading: "yahām̐ bahut garmī hai."
    ipa: "jəɦãː bəɦʊt̪ ɡərmiː ɦɛː"
    pos: "phrase"
    notes: "The weather has no 'it': 'here there is much heat'."
