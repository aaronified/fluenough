name: "Basic sentences"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Word order and the verb 'to be': the verb comes last."
tags: [beginner, grammar]
cards:
  - id: hi-0145
    target: "मैं छात्र हूँ।"
    native: "I am a student. (said by a man)"
    reading: "main chhatra hun."
    pos: "phrase"
    notes: "The verb comes last. 'To be' is हूँ with मैं, हो with तुम, है with यह and वह, हैं with हम, आप and वे. A woman says मैं छात्रा हूँ (chhatra)."
  - id: hi-0146
    target: "यह मेरा घर है।"
    native: "This is my house."
    reading: "yah mera ghar hai."
    pos: "phrase"
  - id: hi-0147
    target: "वह डॉक्टर है।"
    native: "He is a doctor. / She is a doctor."
    reading: "vah doktar hai."
    pos: "phrase"
    notes: "वह is he, she and it: nothing in this sentence says which."
  - id: hi-0148
    target: "मैं चाय पीता हूँ।"
    native: "I drink tea. (said by a man)"
    reading: "main chai pita hun."
    pos: "phrase"
    notes: "Subject, object, verb. A woman says पीती हूँ (piti hun)."
  - id: hi-0149
    target: "वह हिंदी सीख रही है।"
    native: "She is learning Hindi."
    reading: "vah hindi sikh rahi hai."
    pos: "phrase"
    notes: "Here the verb, रही, is what says it is a woman."
  - id: hi-0150
    target: "मुझे हिंदी पसंद है।"
    native: "I like Hindi."
    reading: "mujhe hindi pasand hai."
    pos: "phrase"
    notes: "Literally 'to me, Hindi is pleasing'. The person who likes takes को, or its short form: मुझे."
  - id: hi-0151
    target: "मेरे पास एक गाड़ी है।"
    native: "I have a car."
    reading: "mere pas ek gari hai."
    pos: "phrase"
    notes: "There is no verb 'to have' for things: 'near me there is a car'. For family: मेरे दो भाई हैं, I have two brothers."
  - id: hi-0152
    target: "यह अच्छा नहीं है।"
    native: "This isn't good."
    reading: "yah achha nahin hai."
    pos: "phrase"
    notes: "नहीं comes just before the verb."
  - id: hi-0153
    target: "मत जाइए।"
    native: "Please don't go."
    reading: "mat jaiye."
    pos: "phrase"
    notes: "मत is 'don't' with a request; a statement takes नहीं."
  - id: hi-0154
    target: "यहाँ बहुत गर्मी है।"
    native: "It's very hot here."
    reading: "yahan bahut garmi hai."
    pos: "phrase"
    notes: "The weather has no 'it': 'here there is much heat'."
