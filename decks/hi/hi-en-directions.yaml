    native: "Where is …?"
    reading: "... kahām̐ hai?"
    ipa: "kəɦãː ɦɛː"
    pos: "phrase"
    notes: "Put the place first: स्टेशन कहाँ है (sṭēśan kahām̐ hai)? Where is the station?"
