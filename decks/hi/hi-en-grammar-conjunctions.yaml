schema: 1
id: hi-en-grammar-conjunctions
name: "Joining words"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "And, but, or, because: joining words and sentences."
tags: [beginner, grammar]
cards:
  - id: hi-en-grammar-conjunctions-0001
    target: "और"
    native: "and"
    reading: "aur"
    pos: "other"
    notes: "चाय और पानी, tea and water. It also means 'more'."
  - id: hi-en-grammar-conjunctions-0002
    target: "लेकिन"
    native: "but"
    reading: "lekin"
    pos: "other"
    notes: "पर and मगर (magar) mean the same, and are common in speech."
  - id: hi-en-grammar-conjunctions-0003
    target: "या"
    native: "or"
    reading: "yaa"
    pos: "other"
    notes: "चाय या कॉफ़ी? Tea or coffee?"
  - id: hi-en-grammar-conjunctions-0004
    target: "क्योंकि"
    native: "because"
    reading: "kyonki"
    pos: "other"
    notes: "मैं नहीं आया क्योंकि मैं बीमार था। I didn't come because I was ill."
  - id: hi-en-grammar-conjunctions-0005
    target: "इसलिए"
    native: "so; that's why"
    reading: "isliye"
    pos: "other"
    notes: "मैं बीमार था, इसलिए नहीं आया। I was ill, so I didn't come."
  - id: hi-en-grammar-conjunctions-0006
    target: "कि"
    native: "that (after say, think, know)"
    reading: "ki"
    pos: "other"
    notes: "उसने कहा कि वह आएगा। He said that he would come. Unlike English 'that', कि is rarely left out."
  - id: hi-en-grammar-conjunctions-0007
    target: "अगर … तो"
    native: "if … then"
    reading: "agar … to"
    pos: "phrase"
    notes: "अगर बारिश हुई तो मैं नहीं आऊँगा। If it rains, I won't come. The तो is usual, where English leaves 'then' out."
  - id: hi-en-grammar-conjunctions-0008
    target: "जब … तब"
    native: "when … then"
    reading: "jab … tab"
    pos: "phrase"
    notes: "जब मैं आया तब वह सो रहा था। When I came, he was sleeping."
  - id: hi-en-grammar-conjunctions-0009
    target: "भी"
    native: "also; too; even"
    reading: "bhii"
    pos: "particle"
    notes: "It follows the word it is about: मैं भी, me too; आज भी, even today."
  - id: hi-en-grammar-conjunctions-0010
    target: "फिर"
    native: "then; again"
    reading: "phir"
    pos: "other"
    notes: "फिर क्या हुआ? Then what happened?"
