      - { target: "पहाड़ों की आब ओ हवा साफ़ है।", reading: "pahāṛōm̐ kī āb ō havā sāf hai.", ipa: "pəɦaːɽõː kiː aːb oː ɦəʋaː saːf ɦɛː", bases: [{"word": "पहाड़ों", "ref": "hi-1065"}, {"word": "की", "base": "की", "reading": "kī"}, {"word": "आब", "base": "आब", "reading": "āb"}, {"word": "ओ", "ref": "hi-0337"}, {"word": "हवा", "ref": "hi-1257"}, {"word": "साफ़", "ref": "hi-0901"}, {"word": "है", "ref": "hi-0112"}] }
