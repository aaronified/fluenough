schema: 1
id: hi-en-grammar-adjectives
name: "Adjectives: gender and number"
kind: grammar
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Adjectives in -आ agree with their noun; the others never change."
tags: [beginner, grammar]
pattern:
  name: "Adjective agreement"
  slot_name: "agreement"
  slots: ["with a feminine noun", "with a masculine plural, or before a postposition"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "An adjective ending in -आ agrees: अच्छा लड़का, अच्छी लड़की, अच्छे लड़के. Any other adjective stays the same: सुंदर लड़का, सुंदर लड़की. A feminine plural takes the feminine form: अच्छी लड़कियाँ."
  entries:
    - lemma: "अच्छा"
      key: achchhaa
      reading: "acchā"
      ipa: "ətʃtʃʰaː"
      gloss: "good"
      forms:
        "with a feminine noun": "अच्छी"
        "with a masculine plural, or before a postposition": "अच्छे"
      readings:
        "with a feminine noun": "acchī"
        "with a masculine plural, or before a postposition": "acchē"
      ipas:
        "with a feminine noun": "ətʃtʃʰiː"
        "with a masculine plural, or before a postposition": "ətʃtʃʰeː"
    - lemma: "बड़ा"
      key: badaa
      reading: "baṛā"
      ipa: "bəɽaː"
      gloss: "big"
      forms:
        "with a feminine noun": "बड़ी"
        "with a masculine plural, or before a postposition": "बड़े"
      readings:
        "with a feminine noun": "baṛī"
        "with a masculine plural, or before a postposition": "baṛē"
      ipas:
        "with a feminine noun": "bəɽiː"
        "with a masculine plural, or before a postposition": "bəɽeː"
    - lemma: "छोटा"
      key: chhotaa
      reading: "chōṭā"
      ipa: "tʃʰoːʈaː"
      gloss: "small"
      forms:
        "with a feminine noun": "छोटी"
        "with a masculine plural, or before a postposition": "छोटे"
      readings:
        "with a feminine noun": "chōṭī"
        "with a masculine plural, or before a postposition": "chōṭē"
      ipas:
        "with a feminine noun": "tʃʰoːʈiː"
        "with a masculine plural, or before a postposition": "tʃʰoːʈeː"
    - lemma: "नया"
      key: nayaa
      reading: "nayā"
      ipa: "nəjaː"
      gloss: "new"
      forms:
        "with a feminine noun": "नई"
        "with a masculine plural, or before a postposition": "नए"
      readings:
        "with a feminine noun": "naī"
        "with a masculine plural, or before a postposition": "naē"
      ipas:
        "with a feminine noun": "nəiː"
        "with a masculine plural, or before a postposition": "nəeː"
    - lemma: "सुंदर"
      key: sundar
      reading: "sundar"
      ipa: "sʊnd̪ər"
      gloss: "beautiful"
      forms:
        "with a feminine noun": "सुंदर"
        "with a masculine plural, or before a postposition": "सुंदर"
      readings:
        "with a feminine noun": "sundar"
        "with a masculine plural, or before a postposition": "sundar"
      ipas:
        "with a feminine noun": "sʊnd̪ər"
        "with a masculine plural, or before a postposition": "sʊnd̪ər"
    - lemma: "लाल"
      key: laal
      reading: "lāl"
      ipa: "laːl"
      gloss: "red"
      forms:
        "with a feminine noun": "लाल"
        "with a masculine plural, or before a postposition": "लाल"
      readings:
        "with a feminine noun": "lāl"
        "with a masculine plural, or before a postposition": "lāl"
      ipas:
        "with a feminine noun": "laːl"
        "with a masculine plural, or before a postposition": "laːl"
