schema: 1
id: hi-en-grammar-adjectives
name: "Adjectives: gender and number"
kind: grammar
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Adjectives in -आ agree with their noun; the others never change."
tags: [beginner, grammar]
pattern:
  name: "Adjective agreement"
  slot_name: "agreement"
  slots: ["with a feminine noun", "with a masculine plural, or before a postposition"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "An adjective ending in -आ agrees: अच्छा लड़का, अच्छी लड़की, अच्छे लड़के. Any other adjective stays the same: सुंदर लड़का, सुंदर लड़की. A feminine plural takes the feminine form: अच्छी लड़कियाँ."
  entries:
    - lemma: "अच्छा"
      key: achchhaa
      reading: "achha"
      gloss: "good"
      forms:
        "with a feminine noun": "अच्छी"
        "with a masculine plural, or before a postposition": "अच्छे"
      readings:
        "with a feminine noun": "achhi"
        "with a masculine plural, or before a postposition": "achhe"
    - lemma: "बड़ा"
      key: badaa
      reading: "bara"
      gloss: "big"
      forms:
        "with a feminine noun": "बड़ी"
        "with a masculine plural, or before a postposition": "बड़े"
      readings:
        "with a feminine noun": "bari"
        "with a masculine plural, or before a postposition": "bare"
    - lemma: "छोटा"
      key: chhotaa
      reading: "chhota"
      gloss: "small"
      forms:
        "with a feminine noun": "छोटी"
        "with a masculine plural, or before a postposition": "छोटे"
      readings:
        "with a feminine noun": "chhoti"
        "with a masculine plural, or before a postposition": "chhote"
    - lemma: "नया"
      key: nayaa
      reading: "naya"
      gloss: "new"
      forms:
        "with a feminine noun": "नई"
        "with a masculine plural, or before a postposition": "नए"
      readings:
        "with a feminine noun": "nayi"
        "with a masculine plural, or before a postposition": "naye"
    - lemma: "सुंदर"
      key: sundar
      reading: "sundar"
      gloss: "beautiful"
      forms:
        "with a feminine noun": "सुंदर"
        "with a masculine plural, or before a postposition": "सुंदर"
      readings:
        "with a feminine noun": "sundar"
        "with a masculine plural, or before a postposition": "sundar"
    - lemma: "लाल"
      key: laal
      reading: "lal"
      gloss: "red"
      forms:
        "with a feminine noun": "लाल"
        "with a masculine plural, or before a postposition": "लाल"
      readings:
        "with a feminine noun": "lal"
        "with a masculine plural, or before a postposition": "lal"
