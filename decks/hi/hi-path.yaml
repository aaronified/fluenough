# The order Hindi is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner
# from English is taught hi-en-home for hi-home (ADR-0013, ADR-0036).
#
# This is also Hindi's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"): every
# unit from the first words to B1, written or planned, with its size in
# words, its grammar topics, the three milestones, and for each planned unit
# its listening and reading passages, described in English. It follows the
# Telugu and Bengali plans unit for unit where Hindi has the same unit, so
# that the courses line up; Hindi's own grammar (the present with
# possessives, the ne construction, the perfect, compound and conjunct
# verbs, can and must) stays in the units of the decks that teach it. A unit
# with no deck yet is planned: the course teaches it as "Coming" until a
# deck is written. Sizes follow the plan's levels (about 700, 900 and 1,200
# words; low confidence) and are one number for every native language. A
# written unit's size is what its decks hold today, and is raised as they
# grow. A theme named here that decks/themes.yaml does not list yet is
# added to it with its first deck.
#
# First a few words and basic sentences, the sounds the learner's language
# lacks and how Hindi grammar differs from it; then themes, each with the
# grammar that goes with it; the script comes after the first themes, before
# the rest. The grammar follows the Indo-Aryan order of
# docs/plans/language-paths-scheme.md: be, postpositions, the present,
# gender agreement, the oblique, the past with its ergative ne, compound and
# conjunct verbs, then the subjunctive, the relative-correlative clauses
# and the rest of B1. Every deck of Hindi is listed exactly once.
schema: 1
kind: "path"
id: "hi-path"
language: "hi"
# The decks that need the alphabet: a learner who learns without it
# skips them.
alphabet:
  - "hi-script-vowels"
  - "hi-script-consonants"
  - "hi-script-reading"
  - "hi-script-vowel-signs"
  - "hi-script-conjuncts"
  - "hi-spelling"
  - "hi-reading-panch-parmeshwar"
