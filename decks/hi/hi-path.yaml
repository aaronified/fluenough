# The order Hindustani is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner
# from English is taught hi-en-home for hi-home (ADR-0013, ADR-0036).
#
# This is also Hindi's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"): every
# unit from the first words to B1, written or planned, with its size in
# words, its grammar topics, the three milestones, and for each planned unit
# its listening and reading passages. A unit with no deck yet is planned:
# the course teaches it as "Coming" until a deck is written. Sizes follow
# the plan's levels (about 700, 900 and 1,200 words; low confidence) and are
# one number for every native language; a written unit's size is what its
# decks hold today. A theme named here that decks/themes.yaml does not list
# yet is added to it with its first deck.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"):
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units;
# 3. the script, after the first six units ("After units 4-6"); a
#    learner who already reads it skips it (#554);
# 4. a core of about 200 common words in themed units, before the large
#    tables ("Yes, smaller (~200)");
# 5. rules as forms: noun endings, postpositions and conjunctions first,
#    then pronoun and verb forms, practised on the words already known;
# 6. sentences, each after its words and rules; then the other themes,
#    each its words, then its rules, then its sentences.
# Hindi's grammar keeps the Indo-Aryan order of
# docs/plans/language-paths-scheme.md within each level: be,
# postpositions, the present, gender agreement, the oblique, the past
# with its ergative ne, compound and conjunct verbs, then the
# subjunctive, the relative-correlative clauses and the rest of B1.
#
# The core's order is by judgement, most common first:
# about me, everyday verbs, the common adverbs and function
# words (planned), how much and how many (planned), describing words
# (planned), time, more verbs, work.
# It was meant to come from Wikipedia's counts
# (tools/wikipedia_frequency.py, #516), but
# no Hindi Wikipedia dump could be fetched here (2026-10-17):
# order the core again from the counts once they are written.
#
# Hindustani: Hindi and Urdu as one course (owner, 2026-10-18: "Hindi and
# Urdu should be combined as we should not care about socipolitics over
# linguistics"; #623). The `hi` course and its card ids stay. It teaches the
# shared colloquial vocabulary, with the Sanskrit-leaning and the
# Persian-leaning synonyms on the card, and offers two scripts: Devanagari
# and the Perso-Arabic script, written right to left in the Nastaliq style
# (`perso_arabic` in the app, `perso-arabic` in a deck; Urdu names it nothing else).
# The plan of the closed Urdu path (#602) is folded in below as units:
# - the Perso-Arabic script units, after the Devanagari ones (3);
# - Persian word-building (A2) and Arabic roots and plurals (B1), the two
#   places where the loan patterns need a unit of their own;
# - what is Urdu's own, against Hindi's model, as the comments over the
#   units it bears on.
# The two Perso-Arabic script decks are written (#623): the letters, and the
# vowels and marks. A card does not yet hold a second spelling (#623), so
# the Perso-Arabic script units are their own decks, as Devanagari's are, and
# `alphabet` lists them with the Devanagari ones. The Perso-Arabic reading
# and word units (Persian, Arabic) remain planned.
#
# Every deck of Hindustani is listed exactly once.
schema: 1
kind: "path"
id: "hi-path"
language: "hi"
# The gender classes a noun's gender is one of (#512; DECK-FORMAT.md, Card data).
genders: ["m", "f"]
# The decks that need the alphabet: a learner who learns without it
# skips them.
alphabet:
  - "hi-script-vowels"
  - "hi-script-consonants"
  - "hi-script-reading"
  - "hi-script-vowel-signs"
  - "hi-script-conjuncts"
  - "hi-script-digits"
  - "hi-script-perso-arabic-letters"
  - "hi-script-perso-arabic-shapes"
  - "hi-script-perso-arabic-vowels"
  - "hi-script-perso-arabic-reading"
  - "hi-script-perso-arabic-digits"
  - "hi-spelling"
  - "hi-reading-panch-parmeshwar"
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  # 1. The phrasebook, taught whole from the first lesson.
  - decks: ["hi-phrasebook", "hi-first-words", "*"]
    words: 2
  # 2. The first word units. The sounds unit drills, beside the aspirates
  # and the retroflex row, the five sounds that come from Persian and
  # Arabic: q against k, kh (k͟h) against kh, ġ against g, z against j and
  # f against ph. Devanagari writes them with a nukta (क़ ख़ ग़ ज़ फ़); the
  # Perso-Arabic script has a letter for each (ق خ غ ز ف), as in خدا حافظ
  # (k͟hudā hāfiz).
  - decks: ["hi-sound-differences"]
    words: 20
  - decks: ["hi-questions", "*"]
    words: 9
  - decks: ["hi-addressing", "*"]
    words: 9
  - decks: ["hi-pronouns", "hi-pronouns-sentences", "hi-reading-who-is-who", "*"]
    words: 24
  - decks: ["hi-family", "*"]
    words: 23
  # 3. The script, after the first six units (#554: skipped by a learner
  # who already reads it).
  - ["hi-script-vowels", "hi-script-consonants", "hi-script-reading", "hi-script-digits"]
  - ["hi-script-vowel-signs", "hi-script-conjuncts"]
  # The Perso-Arabic script (#623, from #602), for a learner who chooses it;
  # one who already reads it skips it (#554). Written right to left, in the
  # Nastaliq style. The first unit teaches the letters and their joining
  # forms: most letters take an initial, a medial, a final and an alone
  # form, as ب (b) does in بات (bāt) and کتاب (kitāb), and nine join only to
  # the letter before them (ا د ڈ ذ ر ڑ ز ژ و).
  - decks: ["hi-script-perso-arabic-letters", "hi-script-perso-arabic-shapes"]
  # The second unit teaches the vowels: the short vowels are left unwritten,
  # so کتاب (kitāb) is written k-t-ā-b, and their marks, زبر (zabar, a),
  # زیر (zer, i) and پیش (peś, u), appear only in teaching texts; the long
  # vowels are written with ا (ā), و (ū, ō, au), ی (ī) and ے (ē, ai). It
  # also teaches ں (nūn ġunna) for a nasal vowel, ھ (do-cashmī he) for the
  # aspirates against ہ (h), ء (hamza), ع (ʿain), the doubling mark ّ
  # (taśdīd), and the izafat: the -e- that joins two Persian words, written
  # with a zer, وزیرِ اعظم (vazīr-e aʿzam, "prime minister").
  - decks: ["hi-script-perso-arabic-vowels", "hi-script-perso-arabic-reading", "hi-script-perso-arabic-digits"]
  # Numbers 1–20 follow the script, so it comes after the first six units.
  - decks: ["hi-numbers-1-20", "*"]
    words: 20
  # 4. The core: about 200 common words, most common first (by judgement
  # until the Wikipedia counts are written, #516).
  - decks: ["hi-about-me", "*"]
    words: 7
  - decks: ["hi-verbs", "hi-verbs-sentences", "hi-reading-morning-at-home", "*"]
    words: 30
  - decks: ["hi-adverbs", "hi-adverbs-sentences", "hi-reading-adverbs", "*"]
    words: 45
  - decks: ["hi-quantities", "hi-quantities-sentences", "hi-reading-quantities", "*"]
    words: 23
  - decks: ["hi-describing", "hi-describing-sentences", "hi-reading-describing", "*"]
    words: 28
  - decks: ["hi-time", "*"]
    words: 17
  - decks: ["hi-more-verbs", "hi-more-verbs-sentences", "hi-reading-kitchen-help", "hi-reading-how-to-make-tea", "*"]
    words: 25
  - decks: ["hi-work", "*"]
    words: 19
  # 5. Rules as forms, practised on the words known: noun forms,
  # postpositions and conjunctions first, then pronoun and verb forms.
  - decks: ["hi-grammar-nouns"]
    words: 0
    grammar: ["nouns"]
  - decks: ["hi-grammar-postpositions"]
    words: 6
    grammar: ["postpositions"]
  - decks: ["hi-grammar-conjunctions"]
    words: 8
    grammar: ["conjunctions"]
  - decks: ["hi-grammar-pronouns", "hi-grammar-possessives"]
    words: 0
    grammar: ["pronouns", "possessives"]
  - decks: ["hi-grammar-be"]
    words: 0
    grammar: ["be"]
  - decks: ["hi-grammar-present"]
    words: 0
    grammar: ["present"]
  - decks: ["hi-grammar-demonstratives"]
    words: 0
    grammar: ["demonstratives"]
  - decks: ["hi-grammar-adjectives"]
    words: 0
    grammar: ["adjectives"]
  # 6. Sentences, each after its words and rules; then the other A1
  # themes, each its words, its rules, then its sentences.
  - decks: ["hi-numbers-big", "*"]
    words: 85
  - decks: ["hi-food", "*"]
    words: 49
    listening_passages:
      - { id: "at-the-sweet-shop", text: { "en": "Choosing sweets and snacks at a sweet shop" } }
    reading_passages:
      - { id: "menu-card", text: { "en": "A restaurant menu card with dishes and prices" } }
  - decks: ["hi-groceries", "hi-grammar-needs", "*"]
    words: 15
    grammar: ["needs"]
  - decks: ["hi-market", "*"]
    words: 9
  - decks: ["hi-grammar-questions"]
    words: 0
    grammar: ["questions"]
  - decks: ["hi-grammar-likes"]
    words: 3
    grammar: ["likes"]
  - decks: ["hi-grammar-sentences"]
    words: 0
    grammar: ["sentences"]
  - decks: ["hi-grammar-differences"]
    words: 0
    grammar: ["differences"]
  - decks: ["hi-directions", "hi-grammar-continuous", "*"]
    words: 12
    grammar: ["continuous"]
  - decks: ["hi-transport", "*"]
    words: 8
  - decks: ["hi-body", "*"]
    words: 33
    listening_passages:
      - { id: "at-the-doctors", text: { "en": "Telling a doctor where it hurts" } }
    reading_passages:
      - { id: "stretching-chart", text: { "en": "A chart of simple morning stretches" } }
  - decks: ["hi-places", "*"]
    words: 37
    listening_passages:
      - { id: "walk-to-the-market", text: { "en": "A neighbour names the places you pass on the way to the market" } }
    reading_passages:
      - { id: "street-signs", text: { "en": "Signs along a street: pharmacy, school, bank, temple" } }
  - decks: ["hi-things", "*"]
    words: 30
    listening_passages:
      - { id: "packing-for-a-trip", text: { "en": "Two people pack a bag for a trip to the hills" } }
    reading_passages:
