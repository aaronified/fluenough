description: "The months as Hindi says them, and how to read a year."
tags: [beginner]
cards:
  - id: hi-0317
    target: "महीना"
    native: "month"
    reading: "mahīnā"
    ipa: "məɦiːnaː"
    pos: "noun"
    gender: "m"
    notes: "The Gregorian months are used for almost everything; the Hindu calendar's months matter mainly for festivals."
  - id: hi-0318
    target: "साल"
    native: "year"
    reading: "sāl"
    ipa: "saːl"
    pos: "noun"
    gender: "m"
    notes: "Years before 2000 are read in hundreds: 1950 is उन्नीस सौ पचास (unnīs sau pacās), 'nineteen hundred fifty'. From 2000, in thousands: 2020 is दो हज़ार बीस (dō hazār bīs)."
  - id: hi-0319
