id: hi-en-calendar
name: "Months and years"
kind: vocab
theme: calendar
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The months as Hindi says them, and how to read a year."
tags: [beginner]
cards:
  - id: hi-0317
    target: "महीना"
    native: "month"
    reading: "mahiinaa"
    pos: "noun"
    gender: "m"
    notes: "The Gregorian months are used for almost everything; the Hindu calendar's months matter mainly for festivals."
  - id: hi-0318
    target: "साल"
    native: "year"
    reading: "saal"
    pos: "noun"
    gender: "m"
    notes: "Years before 2000 are read in hundreds: 1950 is उन्नीस सौ पचास (unniis sau pachaas), 'nineteen hundred fifty'. From 2000, in thousands: 2020 is दो हज़ार बीस (do hazaar biis)."
  - id: hi-0319
    target: "तारीख़"
    native: "date"
    reading: "taariikh"
    alt_target: ["तारीख"]
    pos: "noun"
    gender: "f"
    notes: "आज कौन-सी तारीख़ है? What's the date today?"
  - id: hi-0320
    target: "जनवरी"
    native: "January"
    reading: "janvarii"
    pos: "noun"
    notes: "The months come from English. Speakers differ on their gender, so the verb may agree either way."
