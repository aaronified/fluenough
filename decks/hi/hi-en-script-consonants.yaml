schema: 1
id: hi-en-script-consonants
name: "Hindi consonants"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Every consonant, each carrying its vowel a: the plain and breathy ones, on the teeth and curled back, then the flapped r's and the dotted letters of loanwords."
tags: [beginner, unreviewed, script]
cards:
  - id: hi-0012
    target: "क"
    native: "k (ka)"
    reading: "ka"
    ipa: "kə"
    notes: "Like the 'k' of 'skin', with no puff of breath. Every consonant carries the short a (अ) unless a sign changes it. कमल (kamal, lotus)."
  - id: hi-0013
    target: "ख"
    native: "kh, with a breath (kha)"
    reading: "kha"
    ipa: "kʰə"
    notes: "क (ka) with a puff of breath after it. It changes the word: खाना (khānā, food)."
  - id: hi-0014
    target: "ग"
    native: "g (ga)"
    reading: "ga"
    ipa: "ɡə"
    notes: "Like the 'g' of 'go': गाय (gāy, cow)."
  - id: hi-0015
    target: "घ"
    native: "gh, with a breath (gha)"
    reading: "gha"
    ipa: "ɡʱə"
    notes: "ग (ga) with a breath after it: घर (ghar, house)."
  - id: hi-0016
    target: "ङ"
    native: "ng (as in 'sing')"
    reading: "ṅa"
    ipa: "ŋə"
    modes: [recognition, production]
    notes: "Seen in a few words from Sanskrit; Hindi usually writes the anusvar ं (am̐) instead. Hardly ever heard on its own, so it is drilled by reading and writing only."
  - id: hi-0017
    target: "च"
    native: "ch (ca)"
    reading: "ca"
    ipa: "tʃə"
    notes: "Like the 'ch' of 'church', with no puff of breath: चाय (cāy, tea)."
  - id: hi-0018
    target: "छ"
    native: "chh, with a breath (cha)"
    reading: "cha"
    ipa: "tʃʰə"
    notes: "च (ca) with a breath after it: छत (chat, roof)."
  - id: hi-0019
    target: "ज"
    native: "j (ja)"
    reading: "ja"
    ipa: "dʒə"
    notes: "Like the 'j' of 'judge': जूता (jūtā, shoe)."
  - id: hi-0020
    target: "झ"
    native: "jh, with a breath (jha)"
    reading: "jha"
    ipa: "dʒʱə"
    notes: "ज (ja) with a breath after it: झील (jhīl, lake)."
  - id: hi-0021
    target: "ञ"
    native: "ny (in conjuncts)"
    reading: "ña"
    ipa: "ɲə"
    modes: [recognition, production]
    notes: "Seen almost only in conjuncts from Sanskrit, and inside ज्ञ (gya). Hardly ever heard on its own, so it is drilled by reading and writing only."
  - id: hi-0022
    target: "ट"
    native: "t, curled back (ṭa)"
    reading: "ṭa"
    ipa: "ʈə"
    notes: "The tongue tip curls back to touch the roof of the mouth: retroflex. English 't' is close to this. Compare त (ta): टमाटर (ṭamāṭar, tomato)."
  - id: hi-0023
    target: "ठ"
    native: "th, curled back, with a breath (ṭha)"
    reading: "ṭha"
    ipa: "ʈʰə"
    notes: "ट (ṭa) with a breath after it. Not the 'th' of 'think': ठंडा (ṭhaṇḍā, cold)."
  - id: hi-0024
    target: "ड"
    native: "d, curled back (ḍa)"
    reading: "ḍa"
    ipa: "ɖə"
    notes: "The tongue tip curls back, as for ट (ṭa), and touches the roof of the mouth just behind the ridge behind the teeth. English 'd' is close to this. Compare द (da): डाल (ḍāl, branch)."
  - id: hi-0025
    target: "ढ"
    native: "dh, curled back, with a breath (ḍha)"
    reading: "ḍha"
    ipa: "ɖʱə"
    notes: "Like ड (ḍa), but the tongue touches the roof of the mouth a little further back, with a breath after it: ढोल (ḍhōl, drum)."
  - id: hi-0026
    target: "ण"
    native: "n, curled back (muurdhanya na)"
    reading: "ṇa"
    ipa: "ɳə"
    modes: [recognition, production]
    notes: "The tongue tip curls back, in words from Sanskrit: कारण (kāraṇ, reason). It sounds like न (na) in everyday speech, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: hi-0027
    target: "त"
    native: "t, on the teeth (ta)"
    reading: "ta"
    ipa: "t̪ə"
    notes: "The tongue touches the back of the upper teeth: dental. English has no such t; it sounds softer. Compare ट (ṭa): तुम (tum, you)."
  - id: hi-0028
    target: "थ"
    native: "th, on the teeth, with a breath (tha)"
    reading: "tha"
    ipa: "t̪ʰə"
    notes: "त (ta) with a breath after it. Not the 'th' of 'think': थाली (thālī, plate)."
  - id: hi-0029
    target: "द"
    native: "d, on the teeth (da)"
    reading: "da"
    ipa: "d̪ə"
    notes: "The tongue touches the back of the upper teeth, as for त (ta). Compare ड (ḍa): दाल (dāl, lentils)."
  - id: hi-0030
    target: "ध"
    native: "dh, on the teeth, with a breath (dha)"
    reading: "dha"
    ipa: "d̪ʱə"
    notes: "द (da) with a breath after it. Not the 'th' of 'this': धन्यवाद (dhanyavād, thank you)."
  - id: hi-0031
    target: "न"
    native: "n (na)"
    reading: "na"
    ipa: "nə"
    notes: "The 'n' of 'no': नाम (nām, name)."
  - id: hi-0032
    target: "प"
    native: "p (pa)"
    reading: "pa"
    ipa: "pə"
    notes: "Like the 'p' of 'spin', with no puff of breath: पानी (pānī, water)."
  - id: hi-0033
    target: "फ"
    native: "ph, with a breath (pha)"
    reading: "pha"
    ipa: "pʰə"
    notes: "प (pa) with a breath after it. Many speakers say it like English 'f': फल (phal, fruit)."
  - id: hi-0034
    target: "ब"
    native: "b (ba)"
    reading: "ba"
    ipa: "bə"
    notes: "Like the 'b' of 'boy': बिल्ली (billī, cat)."
  - id: hi-0035
    target: "भ"
    native: "bh, with a breath (bha)"
    reading: "bha"
    ipa: "bʱə"
    notes: "ब (ba) with a breath after it. Not 'v': भाषा (bhāśā, language)."
  - id: hi-0036
    target: "म"
    native: "m (ma)"
    reading: "ma"
    ipa: "mə"
    notes: "Like the 'm' of 'mother': माता (mātā, mother)."
  - id: hi-0037
    target: "य"
    native: "y (ya)"
    reading: "ya"
    ipa: "jə"
    notes: "Like the 'y' of 'yes': यात्रा (yātrā, journey)."
  - id: hi-0038
    target: "र"
    native: "r (ra)"
    reading: "ra"
    ipa: "rə"
    notes: "A single tap of the tongue, like the 'tt' of American 'butter'. Never silent: रंग (raṅg, colour)."
  - id: hi-0039
    target: "ल"
    native: "l (la)"
    reading: "la"
    ipa: "lə"
    notes: "A clear 'l', as at the start of 'leaf': लाल (lāl, red)."
  - id: hi-0040
    target: "व"
    native: "v or w (va)"
    reading: "va"
    ipa: "ʋə"
    notes: "Between English 'v' and 'w': वर्ष (varś, year)."
  - id: hi-0041
    target: "श"
    native: "sh (śa)"
    reading: "śa"
    ipa: "ʃə"
    notes: "The 'sh' of 'shop': शहर (śahar, city)."
  - id: hi-0042
    target: "ष"
    native: "sh, curled back (śa)"
    reading: "śa"
    ipa: "ʃə"
    modes: [recognition, production]
    notes: "Curled back in careful speech, in words from Sanskrit: भाषा (bhāśā, language). It sounds like श (śa) in everyday speech, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: hi-0043
    target: "स"
    native: "s (sa)"
    reading: "sa"
    ipa: "sə"
    notes: "The 's' of 'sun', never 'sh': सड़क (saṛak, road)."
  - id: hi-0044
    target: "ह"
    native: "h (ha)"
    reading: "ha"
    ipa: "ɦə"
    notes: "Like the 'h' of 'hat': हाथ (hāth, hand)."
  - id: hi-0045
    target: "ड़"
    native: "r, tongue placed as for ड (ḍa)"
    reading: "ṛa"
    ipa: "ɽə"
    notes: "ड (ḍa) with a dot below: the tongue is placed as for ड (ḍa), but doesn't touch the roof of the mouth. It never starts a word: सड़क (saṛak, road), लड़का (laṛkā, boy)."
  - id: hi-0046
    target: "ढ़"
    native: "rh, tongue placed as for ढ (ḍha)"
    reading: "ṛha"
    ipa: "ɽʱə"
    notes: "ढ (ḍha) with a dot below: the tongue is placed as for ढ (ḍha), a little further back than for ड़ (ṛa), and doesn't touch the roof of the mouth: पढ़ना (paṛhnā, to read)."
  - id: hi-0047
    target: "ज़"
    native: "z (za)"
    reading: "za"
    ipa: "zə"
    notes: "ज (ja) with a dot below, the 'z' of 'zoo', in words from Persian, Arabic and English: ज़मीन (zamīn, land)."
  - id: hi-0048
    target: "फ़"
    native: "f (fa)"
    reading: "fa"
    ipa: "fə"
    notes: "फ (pha) with a dot below, the 'f' of 'fan', in words from Persian, Arabic and English: फ़िल्म (film, film)."
