schema: 1
id: hi-en-script-consonants
name: "Hindi consonants"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Every consonant, each carrying its vowel a: the plain and breathy ones, on the teeth and curled back, then the flapped r's and the dotted letters of loanwords."
tags: [beginner, unreviewed, script]
cards:
  - id: hi-en-script-consonants-0001
    target: "क"
    native: "k (ka)"
    reading: "ka"
    notes: "Like the 'k' of 'skin', with no puff of breath. Every consonant carries the short a (अ) unless a sign changes it. कमल (kamal, lotus)."
  - id: hi-en-script-consonants-0002
    target: "ख"
    native: "kh, with a breath (kha)"
    reading: "kha"
    notes: "क with a puff of breath after it. It changes the word: खाना (khaanaa, food)."
  - id: hi-en-script-consonants-0003
    target: "ग"
    native: "g (ga)"
    reading: "ga"
    notes: "Like the 'g' of 'go': गाय (gaay, cow)."
  - id: hi-en-script-consonants-0004
    target: "घ"
    native: "gh, with a breath (gha)"
    reading: "gha"
    notes: "ग with a breath after it: घर (ghar, house)."
  - id: hi-en-script-consonants-0005
    target: "ङ"
    native: "ng (as in 'sing')"
    reading: "nga"
    modes: [recognition, production]
    notes: "Seen in a few words from Sanskrit; Hindi usually writes the anusvaar ं instead. Hardly ever heard on its own, so it is drilled by reading and writing only."
  - id: hi-en-script-consonants-0006
    target: "च"
    native: "ch (cha)"
    reading: "cha"
    notes: "Like the 'ch' of 'church', with no puff of breath: चाय (chaay, tea)."
  - id: hi-en-script-consonants-0007
    target: "छ"
    native: "chh, with a breath (chha)"
    reading: "chha"
    notes: "च with a breath after it: छत (chhat, roof)."
  - id: hi-en-script-consonants-0008
    target: "ज"
    native: "j (ja)"
    reading: "ja"
    notes: "Like the 'j' of 'judge': जूता (juutaa, shoe)."
  - id: hi-en-script-consonants-0009
    target: "झ"
    native: "jh, with a breath (jha)"
    reading: "jha"
    notes: "ज with a breath after it: झील (jhiil, lake)."
  - id: hi-en-script-consonants-0010
    target: "ञ"
    native: "ny (in conjuncts)"
    reading: "nya"
    modes: [recognition, production]
    notes: "Seen almost only in conjuncts from Sanskrit, and inside ज्ञ. Hardly ever heard on its own, so it is drilled by reading and writing only."
  - id: hi-en-script-consonants-0011
    target: "ट"
    native: "t, curled back (ta)"
    reading: "ta"
    notes: "The tongue tip curls back to touch the roof of the mouth: retroflex. English 't' is close to this. Compare त: टमाटर (tamaatar, tomato)."
  - id: hi-en-script-consonants-0012
    target: "ठ"
    native: "th, curled back, with a breath (tha)"
    reading: "tha"
    notes: "ट with a breath after it. Not the 'th' of 'think': ठंडा (thandaa, cold)."
  - id: hi-en-script-consonants-0013
    target: "ड"
    native: "d, curled back (da)"
    reading: "da"
    notes: "The tongue tip curls back, as for ट, and touches the roof of the mouth just behind the ridge behind the teeth. English 'd' is close to this. Compare द: डाल (daal, branch)."
  - id: hi-en-script-consonants-0014
    target: "ढ"
    native: "dh, curled back, with a breath (dha)"
    reading: "dha"
    notes: "Like ड, but the tongue touches the roof of the mouth a little further back, with a breath after it: ढोल (dhol, drum)."
  - id: hi-en-script-consonants-0015
    target: "ण"
    native: "n, curled back (muurdhanya na)"
    reading: "na"
    modes: [recognition, production]
    notes: "The tongue tip curls back, in words from Sanskrit: कारण (kaaran, reason). It sounds like न in everyday speech, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: hi-en-script-consonants-0016
    target: "त"
    native: "t, on the teeth (ta)"
    reading: "ta"
    notes: "The tongue touches the back of the upper teeth: dental. English has no such t; it sounds softer. Compare ट: तुम (tum, you)."
  - id: hi-en-script-consonants-0017
    target: "थ"
    native: "th, on the teeth, with a breath (tha)"
    reading: "tha"
    notes: "त with a breath after it. Not the 'th' of 'think': थाली (thaalii, plate)."
  - id: hi-en-script-consonants-0018
    target: "द"
    native: "d, on the teeth (da)"
    reading: "da"
    notes: "The tongue touches the back of the upper teeth, as for त. Compare ड: दाल (daal, lentils)."
  - id: hi-en-script-consonants-0019
    target: "ध"
    native: "dh, on the teeth, with a breath (dha)"
    reading: "dha"
    notes: "द with a breath after it. Not the 'th' of 'this': धन्यवाद (dhanyavaad, thank you)."
  - id: hi-en-script-consonants-0020
    target: "न"
    native: "n (na)"
    reading: "na"
    notes: "The 'n' of 'no': नाम (naam, name)."
  - id: hi-en-script-consonants-0021
    target: "प"
    native: "p (pa)"
    reading: "pa"
    notes: "Like the 'p' of 'spin', with no puff of breath: पानी (paanii, water)."
  - id: hi-en-script-consonants-0022
    target: "फ"
    native: "ph, with a breath (pha)"
    reading: "pha"
    notes: "प with a breath after it. Many speakers say it like English 'f': फल (phal, fruit)."
  - id: hi-en-script-consonants-0023
    target: "ब"
    native: "b (ba)"
    reading: "ba"
    notes: "Like the 'b' of 'boy': बिल्ली (billii, cat)."
  - id: hi-en-script-consonants-0024
    target: "भ"
    native: "bh, with a breath (bha)"
    reading: "bha"
    notes: "ब with a breath after it. Not 'v': भाषा (bhaashaa, language)."
  - id: hi-en-script-consonants-0025
    target: "म"
    native: "m (ma)"
    reading: "ma"
    notes: "Like the 'm' of 'mother': माता (maataa, mother)."
  - id: hi-en-script-consonants-0026
    target: "य"
    native: "y (ya)"
    reading: "ya"
    notes: "Like the 'y' of 'yes': यात्रा (yaatraa, journey)."
  - id: hi-en-script-consonants-0027
    target: "र"
    native: "r (ra)"
    reading: "ra"
    notes: "A single tap of the tongue, like the 'tt' of American 'butter'. Never silent: रंग (rang, colour)."
  - id: hi-en-script-consonants-0028
    target: "ल"
    native: "l (la)"
    reading: "la"
    notes: "A clear 'l', as at the start of 'leaf': लाल (laal, red)."
  - id: hi-en-script-consonants-0029
    target: "व"
    native: "v or w (va)"
    reading: "va"
    notes: "Between English 'v' and 'w': वर्ष (varsh, year)."
  - id: hi-en-script-consonants-0030
    target: "श"
    native: "sh (sha)"
    reading: "sha"
    notes: "The 'sh' of 'shop': शहर (shahar, city)."
  - id: hi-en-script-consonants-0031
    target: "ष"
    native: "sh, curled back (sha)"
    reading: "sha"
    modes: [recognition, production]
    notes: "Curled back in careful speech, in words from Sanskrit: भाषा (bhaashaa, language). It sounds like श in everyday speech, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: hi-en-script-consonants-0032
    target: "स"
    native: "s (sa)"
    reading: "sa"
    notes: "The 's' of 'sun', never 'sh': सड़क (sadak, road)."
  - id: hi-en-script-consonants-0033
    target: "ह"
    native: "h (ha)"
    reading: "ha"
    notes: "Like the 'h' of 'hat': हाथ (haath, hand)."
  - id: hi-en-script-consonants-0034
    target: "ड़"
    native: "r, tongue placed as for ड (da)"
    reading: "da"
    notes: "ड with a dot below: the tongue is placed as for ड, but doesn't touch the roof of the mouth. It never starts a word: सड़क (sadak, road), लड़का (ladkaa, boy)."
  - id: hi-en-script-consonants-0035
    target: "ढ़"
    native: "rh, tongue placed as for ढ (dha)"
    reading: "dha"
    notes: "ढ with a dot below: the tongue is placed as for ढ, a little further back than for ड़, and doesn't touch the roof of the mouth: पढ़ना (padhnaa, to read)."
  - id: hi-en-script-consonants-0036
    target: "ज़"
    native: "z (za)"
    reading: "za"
    notes: "ज with a dot below, the 'z' of 'zoo', in words from Persian, Arabic and English: ज़मीन (zamiin, land)."
  - id: hi-en-script-consonants-0037
    target: "फ़"
    native: "f (fa)"
    reading: "fa"
    notes: "फ with a dot below, the 'f' of 'fan', in words from Persian, Arabic and English: फ़िल्म (film, film)."
