schema: 1
id: hi-en-script-consonants
name: "Hindi consonants"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Every consonant, each carrying its vowel a: the plain and breathy ones, on the teeth and curled back, then the flapped r's and the dotted letters of loanwords."
tags: [beginner, unreviewed, script]
cards:
  - id: hi-0012
    target: "क"
    native: "k (ka)"
    reading: "ka"
    notes: "Like the 'k' of 'skin', with no puff of breath. Every consonant carries the short a (अ) unless a sign changes it. कमल (kamal, lotus)."
  - id: hi-0013
    target: "ख"
    native: "kh, with a breath (kha)"
    reading: "kha"
    notes: "क with a puff of breath after it. It changes the word: खाना (khana, food)."
  - id: hi-0014
    target: "ग"
    native: "g (ga)"
    reading: "ga"
    notes: "Like the 'g' of 'go': गाय (gai, cow)."
  - id: hi-0015
    target: "घ"
    native: "gh, with a breath (gha)"
    reading: "gha"
    notes: "ग with a breath after it: घर (ghar, house)."
  - id: hi-0016
    target: "ङ"
    native: "ng (as in 'sing')"
    reading: "nga"
    modes: [recognition, production]
    notes: "Seen in a few words from Sanskrit; Hindi usually writes the anusvar ं instead. Hardly ever heard on its own, so it is drilled by reading and writing only."
  - id: hi-0017
    target: "च"
    native: "ch (cha)"
    reading: "cha"
    notes: "Like the 'ch' of 'church', with no puff of breath: चाय (chai, tea)."
  - id: hi-0018
    target: "छ"
    native: "chh, with a breath (chha)"
    reading: "chha"
    notes: "च with a breath after it: छत (chhat, roof)."
  - id: hi-0019
    target: "ज"
    native: "j (ja)"
    reading: "ja"
    notes: "Like the 'j' of 'judge': जूता (juta, shoe)."
  - id: hi-0020
    target: "झ"
    native: "jh, with a breath (jha)"
    reading: "jha"
    notes: "ज with a breath after it: झील (jhil, lake)."
  - id: hi-0021
    target: "ञ"
    native: "ny (in conjuncts)"
    reading: "nya"
    modes: [recognition, production]
    notes: "Seen almost only in conjuncts from Sanskrit, and inside ज्ञ. Hardly ever heard on its own, so it is drilled by reading and writing only."
  - id: hi-0022
    target: "ट"
    native: "t, curled back (ta)"
    reading: "ta"
    notes: "The tongue tip curls back to touch the roof of the mouth: retroflex. English 't' is close to this. Compare त: टमाटर (tamatar, tomato)."
  - id: hi-0023
    target: "ठ"
    native: "th, curled back, with a breath (tha)"
    reading: "tha"
    notes: "ट with a breath after it. Not the 'th' of 'think': ठंडा (thanda, cold)."
  - id: hi-0024
    target: "ड"
    native: "d, curled back (da)"
    reading: "da"
    notes: "The tongue tip curls back, as for ट, and touches the roof of the mouth just behind the ridge behind the teeth. English 'd' is close to this. Compare द: डाल (dal, branch)."
  - id: hi-0025
    target: "ढ"
    native: "dh, curled back, with a breath (dha)"
    reading: "dha"
    notes: "Like ड, but the tongue touches the roof of the mouth a little further back, with a breath after it: ढोल (dhol, drum)."
  - id: hi-0026
    target: "ण"
    native: "n, curled back (muurdhanya na)"
    reading: "na"
    modes: [recognition, production]
    notes: "The tongue tip curls back, in words from Sanskrit: कारण (karan, reason). It sounds like न in everyday speech, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: hi-0027
    target: "त"
    native: "t, on the teeth (ta)"
    reading: "ta"
    notes: "The tongue touches the back of the upper teeth: dental. English has no such t; it sounds softer. Compare ट: तुम (tum, you)."
  - id: hi-0028
    target: "थ"
    native: "th, on the teeth, with a breath (tha)"
    reading: "tha"
    notes: "त with a breath after it. Not the 'th' of 'think': थाली (thali, plate)."
  - id: hi-0029
    target: "द"
    native: "d, on the teeth (da)"
    reading: "da"
    notes: "The tongue touches the back of the upper teeth, as for त. Compare ड: दाल (dal, lentils)."
  - id: hi-0030
    target: "ध"
    native: "dh, on the teeth, with a breath (dha)"
    reading: "dha"
    notes: "द with a breath after it. Not the 'th' of 'this': धन्यवाद (dhanyavad, thank you)."
  - id: hi-0031
    target: "न"
    native: "n (na)"
    reading: "na"
    notes: "The 'n' of 'no': नाम (nam, name)."
  - id: hi-0032
    target: "प"
    native: "p (pa)"
    reading: "pa"
    notes: "Like the 'p' of 'spin', with no puff of breath: पानी (pani, water)."
  - id: hi-0033
    target: "फ"
    native: "ph, with a breath (pha)"
    reading: "pha"
    notes: "प with a breath after it. Many speakers say it like English 'f': फल (phal, fruit)."
  - id: hi-0034
    target: "ब"
    native: "b (ba)"
    reading: "ba"
    notes: "Like the 'b' of 'boy': बिल्ली (billi, cat)."
  - id: hi-0035
    target: "भ"
    native: "bh, with a breath (bha)"
    reading: "bha"
    notes: "ब with a breath after it. Not 'v': भाषा (bhasha, language)."
  - id: hi-0036
    target: "म"
    native: "m (ma)"
    reading: "ma"
    notes: "Like the 'm' of 'mother': माता (mata, mother)."
  - id: hi-0037
    target: "य"
    native: "y (ya)"
    reading: "ya"
    notes: "Like the 'y' of 'yes': यात्रा (yatra, journey)."
  - id: hi-0038
    target: "र"
    native: "r (ra)"
    reading: "ra"
    notes: "A single tap of the tongue, like the 'tt' of American 'butter'. Never silent: रंग (rang, colour)."
  - id: hi-0039
    target: "ल"
    native: "l (la)"
    reading: "la"
    notes: "A clear 'l', as at the start of 'leaf': लाल (lal, red)."
  - id: hi-0040
    target: "व"
    native: "v or w (va)"
    reading: "va"
    notes: "Between English 'v' and 'w': वर्ष (varsh, year)."
  - id: hi-0041
    target: "श"
    native: "sh (sha)"
    reading: "sha"
    notes: "The 'sh' of 'shop': शहर (shahar, city)."
  - id: hi-0042
    target: "ष"
    native: "sh, curled back (sha)"
    reading: "sha"
    modes: [recognition, production]
    notes: "Curled back in careful speech, in words from Sanskrit: भाषा (bhasha, language). It sounds like श in everyday speech, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: hi-0043
    target: "स"
    native: "s (sa)"
    reading: "sa"
    notes: "The 's' of 'sun', never 'sh': सड़क (sarak, road)."
  - id: hi-0044
    target: "ह"
    native: "h (ha)"
    reading: "ha"
    notes: "Like the 'h' of 'hat': हाथ (hath, hand)."
  - id: hi-0045
    target: "ड़"
    native: "r, tongue placed as for ड (da)"
    reading: "ra"
    notes: "ड with a dot below: the tongue is placed as for ड, but doesn't touch the roof of the mouth. It never starts a word: सड़क (sarak, road), लड़का (larka, boy)."
  - id: hi-0046
    target: "ढ़"
    native: "rh, tongue placed as for ढ (dha)"
    reading: "rha"
    notes: "ढ with a dot below: the tongue is placed as for ढ, a little further back than for ड़, and doesn't touch the roof of the mouth: पढ़ना (parhna, to read)."
  - id: hi-0047
    target: "ज़"
    native: "z (za)"
    reading: "za"
    notes: "ज with a dot below, the 'z' of 'zoo', in words from Persian, Arabic and English: ज़मीन (zamin, land)."
  - id: hi-0048
    target: "फ़"
    native: "f (fa)"
    reading: "fa"
    notes: "फ with a dot below, the 'f' of 'fan', in words from Persian, Arabic and English: फ़िल्म (film, film)."
