schema: 1
id: hi-en-grammar-articles
name: "No articles: a and the"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Hindi has no 'a' or 'the'. How it says them anyway."
tags: [beginner, grammar]
cards:
  - id: hi-0243
    target: "किताब मेज़ पर है।"
    native: "The book is on the table."
    reading: "kitāb mēz par hai."
    ipa: "kɪt̪aːb meːz pər ɦɛː"
    pos: "phrase"
    notes: "Hindi has no word for 'the' or 'a'. किताब (kitāb) is 'book', 'a book' or 'the book'; the context says which."
  - id: hi-0244
    target: "एक लड़का आया।"
    native: "A boy came."
    reading: "ēk laṛkā āyā."
    ipa: "eːk ləɽkaː aːjaː"
    pos: "phrase"
    notes: "एक (ēk), 'one', can mark 'a' when the thing is new to the listener."
  - id: hi-0245
    target: "लड़का आया।"
    native: "The boy came."
    reading: "laṛkā āyā."
    ipa: "ləɽkaː aːjaː"
    pos: "phrase"
    notes: "Without एक (ēk), the listener takes it to be a boy they already know about."
  - id: hi-0246
    target: "एक चाय दीजिए।"
    native: "One tea, please."
    reading: "ēk cāy dījiē."
    ipa: "eːk tʃaːj d̪iːdʒɪeː"
    pos: "phrase"
    notes: "In a shop, एक (ēk) is simply 'one'."
  - id: hi-0247
    target: "कोई आया है।"
    native: "Someone has come."
    reading: "kōī āyā hai."
    ipa: "koːiː aːjaː ɦɛː"
    pos: "phrase"
    notes: "कोई (kōī) is 'some, any, someone'."
  - id: hi-0248
    target: "थोड़ा पानी दीजिए।"
    native: "Some water, please."
    reading: "thōṛā pānī dījiē."
    ipa: "t̪ʰoːɽaː paːniː d̪iːdʒɪeː"
    pos: "phrase"
    notes: "थोड़ा (thōṛā), 'a little', is the everyday 'some' before an amount. कुछ (kuch) is 'some' or 'something': कुछ चाहिए (kuch cāhiē)? Do you need anything?"
