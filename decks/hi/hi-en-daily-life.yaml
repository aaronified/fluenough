  - id: hi-0456
    target: "मैं रोज़ सात बजे उठता हूँ।"
    native: "I get up at seven every day. (said by a man)"
    reading: "maim̐ rōz sāt bajē uṭhtā hūm̐."
    ipa: "mɛ̃ː roːz saːt̪ bədʒeː ʊʈʰt̪aː ɦũː"
    pos: "phrase"
    notes: "A woman says उठती हूँ (uṭhtī hūm̐)."
  - id: hi-0457
    target: "उसके बाद मैं काम पर जाता हूँ।"
    native: "Then I go to work. (said by a man)"
    reading: "uskē bād maim̐ kām par jātā hūm̐."
    ipa: "ʊskeː baːd̪ mɛ̃ː kaːm pər dʒaːt̪aː ɦũː"
    pos: "phrase"
    notes: "A woman says जाती हूँ (jātī hūm̐)."
  - id: hi-0458
    target: "मैं रात ग्यारह बजे सोता हूँ।"
    native: "I go to bed at eleven at night. (said by a man)"
    reading: "maim̐ rāt gyārah bajē sōtā hūm̐."
    ipa: "mɛ̃ː raːt̪ ɡjaːrəɦ bədʒeː soːt̪aː ɦũː"
    pos: "phrase"
    notes: "A woman says सोती हूँ (sōtī hūm̐)."
  - id: hi-0459
    target: "मुझे कभी देर नहीं होती।"
    native: "I'm never late."
    reading: "mujhē kabhī dēr nahīm̐ hōtī."
    ipa: "mʊdʒʱeː kəbʱiː d̪eːr nəɦĩː ɦoːt̪iː"
    pos: "phrase"
    notes: "'Never' is कभी (kabhī) with नहीं (nahīm̐): 'to me lateness never happens'."
