native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Am, was, will be: होना in the present, the past and the future. Not yet checked by a Hindi speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
