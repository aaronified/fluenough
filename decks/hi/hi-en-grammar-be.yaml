  slot_name: "person and gender"
  slots: ["मैं (m)", "मैं (f)", "तुम (m)", "तुम (f)", "वह (m)", "वह (f)", "हम (m)", "हम (f)", "आप (m)", "आप (f)", "वे (m)", "वे (f)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The present (हूँ, हो, है, हैं) does not show gender; the past and the future do. नहीं comes before the verb: मैं घर पर नहीं हूँ, I'm not at home. With नहीं the present है is often left out: वह यहाँ नहीं."
