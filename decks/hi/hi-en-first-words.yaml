schema: 1
id: hi-en-first-words
name: "First words"
kind: vocab
theme: first-words
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Greetings, the respect Hindi builds into them, and how to say you are still learning."
tags: [beginner]
cards:
  - id: hi-0132
    target: "नमस्ते"
    native: "hello; goodbye"
    reading: "namaste"
    pos: "other"
    tags: ["greeting"]
    notes: "Said with palms pressed together, to anyone, at meeting and at parting. In a family, younger people often greet elders by bending to touch their feet (पैर छूना, pair chhuunaa) instead; a visitor is not expected to."
  - id: hi-0133
    target: "नमस्कार"
    native: "hello (formal)"
    reading: "namaskaar"
    pos: "other"
    tags: ["greeting"]
    notes: "A more formal नमस्ते, heard in speeches, on the radio and from officials."
  - id: hi-0134
    target: "आप"
    native: "you (respectful)"
    reading: "aap"
    pos: "other"
    tags: ["honorific"]
    notes: "Hindi has three words for 'you'. आप is for strangers, elders, customers and anyone you should respect; तुम (tum) for friends and equals; तू (tuu) only for the very close, and rude to anyone else. A learner is always safe with आप."
  - id: hi-0135
    target: "जी"
    native: "a word of respect, after a name or a reply"
    reading: "jii"
    pos: "particle"
    tags: ["honorific"]
    notes: "Put जी after a name or title to show respect: शर्मा जी (sharmaa jii), माँ जी (maan jii). जी हाँ (jii haan) is a polite yes, जी नहीं (jii nahiin) a polite no. On its own, जी answers someone calling you."
  - id: hi-0136
    target: "आप कैसे हैं?"
    native: "How are you? (to a man)"
    reading: "aap kaise hain?"
    pos: "phrase"
    tags: ["greeting"]
    notes: "To a woman: आप कैसी हैं? (aap kaisii hain?). The word for 'how' agrees with the person asked about."
  - id: hi-0137
    target: "मैं ठीक हूँ।"
    native: "I'm fine."
    reading: "main thiik huun."
    pos: "phrase"
    tags: ["greeting"]
    notes: "ठीक (thiik) is 'fine, all right', one of the most useful words in Hindi. ठीक है (thiik hai) is 'OK'."
  - id: hi-0138
    target: "धन्यवाद"
    native: "thank you (formal)"
    reading: "dhanyavaad"
    pos: "other"
    tags: ["polite"]
    notes: "Formal. Among family and close friends, thanking can sound distant, and is often left out."
  - id: hi-0139
    target: "शुक्रिया"
    native: "thanks"
    reading: "shukriyaa"
    pos: "other"
    tags: ["polite"]
    notes: "The everyday word. Many speakers simply say 'thank you' in English."
  - id: hi-0140
    target: "मुझे हिंदी नहीं आती।"
    native: "I don't know Hindi."
    reading: "mujhe hindii nahiin aatii."
    pos: "phrase"
    notes: "Literally 'Hindi does not come to me'. आती is feminine because हिंदी is. Add थोड़ी-थोड़ी (thodii-thodii) for 'a little': मुझे थोड़ी-थोड़ी हिंदी आती है।"
  - id: hi-0141
    target: "मैं अभी हिंदी सीख रहा हूँ।"
    native: "I'm still learning Hindi. (said by a man)"
    reading: "main abhii hindii siikh rahaa huun."
    pos: "phrase"
    notes: "A woman says सीख रही हूँ (siikh rahii huun). अभी (abhii) is 'now, still'."
  - id: hi-0142
    target: "धीरे बोलिए।"
    native: "Please speak slowly."
    reading: "dhiire boliye."
    pos: "phrase"
    tags: ["polite"]
    notes: "बोलिए is the polite request form of बोलना (bolnaa, to speak). The ending -इए turns a verb into a polite request: बैठिए (baithiye), please sit."
  - id: hi-0143
    target: "फिर से बोलिए।"
    native: "Please say that again."
    reading: "phir se boliye."
    pos: "phrase"
    tags: ["polite"]
  - id: hi-0144
    target: "फिर मिलेंगे।"
    native: "See you again."
    reading: "phir milenge."
    pos: "phrase"
    tags: ["greeting"]
    notes: "The usual goodbye besides नमस्ते. Hindi has a word for 'farewell', अलविदा (alvidaa), but it sounds final, as in a film."
