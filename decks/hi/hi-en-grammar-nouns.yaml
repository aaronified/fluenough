schema: 1
id: hi-en-grammar-nouns
name: "Nouns: plural and oblique"
kind: grammar
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "How a noun changes for the plural, and before a postposition."
tags: [beginner, grammar]
pattern:
  name: "Noun forms"
  slot_name: "form"
  slots: ["plural", "singular, before a postposition", "plural, before a postposition"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Before a postposition such as में (mēm̐), से (sē) or को (kō), a noun takes its oblique form: कमरा (kamrā) → कमरे में (kamrē mēm̐), in the room. Masculine nouns in -आ (-ā) change; other masculine nouns only change in the oblique plural, which always ends in -ओं (-ōm̐). Feminine nouns change only in the plural."
  entries:
    - lemma: "लड़का"
      key: ladkaa
      reading: "laṛkā"
      ipa: "ləɽkaː"
      gloss: "boy, m"
      forms:
        "plural": "लड़के"
        "singular, before a postposition": "लड़के"
        "plural, before a postposition": "लड़कों"
      readings:
        "plural": "laṛkē"
        "singular, before a postposition": "laṛkē"
        "plural, before a postposition": "laṛkōm̐"
      ipas:
        "plural": "ləɽkeː"
        "singular, before a postposition": "ləɽkeː"
        "plural, before a postposition": "ləɽkõː"
    - lemma: "कमरा"
      key: kamraa
      reading: "kamrā"
      ipa: "kəmraː"
      gloss: "room, m"
      forms:
        "plural": "कमरे"
        "singular, before a postposition": "कमरे"
        "plural, before a postposition": "कमरों"
      readings:
        "plural": "kamrē"
        "singular, before a postposition": "kamrē"
        "plural, before a postposition": "kamrōm̐"
      ipas:
        "plural": "kəmreː"
        "singular, before a postposition": "kəmreː"
        "plural, before a postposition": "kəmrõː"
    - lemma: "घर"
      key: ghar
      reading: "ghar"
      ipa: "ɡʱər"
      gloss: "house, m"
      forms:
        "plural": "घर"
        "singular, before a postposition": "घर"
        "plural, before a postposition": "घरों"
      readings:
        "plural": "ghar"
        "singular, before a postposition": "ghar"
        "plural, before a postposition": "gharōm̐"
      ipas:
        "plural": "ɡʱər"
        "singular, before a postposition": "ɡʱər"
        "plural, before a postposition": "ɡʱərõː"
    - lemma: "आदमी"
      key: aadmii
      reading: "ādmī"
      ipa: "aːd̪miː"
      gloss: "man, m"
      forms:
        "plural": "आदमी"
        "singular, before a postposition": "आदमी"
        "plural, before a postposition": "आदमियों"
      readings:
        "plural": "ādmī"
        "singular, before a postposition": "ādmī"
        "plural, before a postposition": "ādmiyōm̐"
      ipas:
        "plural": "aːd̪miː"
        "singular, before a postposition": "aːd̪miː"
        "plural, before a postposition": "aːd̪mɪjõː"
    - lemma: "लड़की"
      key: ladkii
      reading: "laṛkī"
      ipa: "ləɽkiː"
      gloss: "girl, f"
      forms:
        "plural": "लड़कियाँ"
        "singular, before a postposition": "लड़की"
        "plural, before a postposition": "लड़कियों"
      readings:
        "plural": "laṛkiyām̐"
        "singular, before a postposition": "laṛkī"
        "plural, before a postposition": "laṛkiyōm̐"
      ipas:
        "plural": "ləɽkɪjãː"
        "singular, before a postposition": "ləɽkiː"
        "plural, before a postposition": "ləɽkɪjõː"
    - lemma: "किताब"
      key: kitaab
      reading: "kitāb"
      ipa: "kɪt̪aːb"
      gloss: "book, f"
      forms:
        "plural": "किताबें"
        "singular, before a postposition": "किताब"
        "plural, before a postposition": "किताबों"
      readings:
        "plural": "kitābēm̐"
        "singular, before a postposition": "kitāb"
        "plural, before a postposition": "kitābōm̐"
      ipas:
        "plural": "kɪt̪aːbẽː"
        "singular, before a postposition": "kɪt̪aːb"
        "plural, before a postposition": "kɪt̪aːbõː"
    - lemma: "बहन"
      key: bahan
      reading: "bahan"
      ipa: "bəɦən"
      gloss: "sister, f"
      forms:
        "plural": "बहनें"
        "singular, before a postposition": "बहन"
        "plural, before a postposition": "बहनों"
      readings:
        "plural": "bahnēm̐"
        "singular, before a postposition": "bahan"
        "plural, before a postposition": "bahnōm̐"
      ipas:
        "plural": "bəɦnẽː"
        "singular, before a postposition": "bəɦən"
        "plural, before a postposition": "bəɦnõː"
    - lemma: "भाषा"
      key: bhaashaa
      reading: "bhāśā"
      ipa: "bʱaːʃaː"
      gloss: "language, f"
      forms:
        "plural": "भाषाएँ"
        "singular, before a postposition": "भाषा"
        "plural, before a postposition": "भाषाओं"
      readings:
        "plural": "bhāśāēm̐"
        "singular, before a postposition": "bhāśā"
        "plural, before a postposition": "bhāśāōm̐"
      ipas:
        "plural": "bʱaːʃaːẽː"
        "singular, before a postposition": "bʱaːʃaː"
        "plural, before a postposition": "bʱaːʃaːõː"
