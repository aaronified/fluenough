    ipa: "səɦiː"
    pos: "adv"
    bases: "self"
    register: "neutral"
    notes:
      - { id: "use", kind: "usage" }
    examples:
      - { target: "उसने सवाल सही किया।", reading: "usnē savāl sahī kiyā.", ipa: "ʊsneː səʋaːl səɦiː kɪjaː", bases: [{ word: "उसने", ref: "hi-0749" }, { word: "सवाल", base: "सवाल", reading: "savāl" }, { word: "किया", base: "करना", reading: "karnā" }] }
      - { target: "आप सही पढ़ रहे हैं।", reading: "āp sahī paṛh rahē haim̐.", ipa: "aːp səɦiː pəɽʱ rəɦeː ɦɛ̃ː", bases: [{ word: "पढ़", base: "पढ़ना", reading: "paṛhnā" }, { word: "रहे", ref: "hi-0791" }, { word: "हैं", ref: "hi-0780" }] }
