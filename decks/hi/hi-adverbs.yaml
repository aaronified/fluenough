cards:
  - id: "hi-0812"
    target: "अक्सर"
    target_scripts: { perso_arabic: "اکثر" }
    reading: "aksar"
    ipa: "əksər"
    pos: "adv"
    bases: "self"
    register: "neutral"
    notes:
      - { id: "use", kind: "usage" }
    examples:
      - { target: "वह अक्सर स्कूल जाता है।", reading: "vah aksar skūl jātā hai.", ipa: "ʋəɦ əksər skuːl dʒaːt̪aː ɦɛː", bases: [{ word: "स्कूल", base: "स्कूल", reading: "skūl" }, { word: "जाता", base: "जाना", reading: "jānā" }, { word: "है", ref: "hi-0780" }] }
      - { target: "मैं अक्सर चाय पीता हूँ।", reading: "maim̐ aksar cāy pītā hūm̐.", ipa: "mɛ̃ː əksər tʃaːj piːt̪aː ɦũː", bases: [{ word: "पीता", base: "पीना", reading: "pīnā" }, { word: "हूँ", ref: "hi-0780" }] }
    synonyms:
      - { id: "often-sanskrit", word: "बहुधा", reading: "bahudhā", ipa: "bəɦʊd̪ʱaː" }
    antonyms:
      - { id: "never", ref: "hi-0814" }
  - id: "hi-0813"
    target: "शायद"
    target_scripts: { perso_arabic: "شاید" }
    reading: "śāyad"
    ipa: "ʃaːjəd̪"
    pos: "adv"
    bases: "self"
    register: "neutral"
    notes:
      - { id: "use", kind: "usage" }
    examples:
      - { target: "शायद कल बारिश होगी।", reading: "śāyad kal bāriś hōgī.", ipa: "ʃaːjəd̪ kəl baːrɪʃ ɦoːɡiː", bases: [{ word: "बारिश", base: "बारिश", reading: "bāriś" }, { word: "होगी", base: "होना", reading: "hōnā" }] }
      - { target: "शायद वह घर पर है।", reading: "śāyad vah ghar par hai.", ipa: "ʃaːjəd̪ ʋəɦ ɡʱər pər ɦɛː", bases: [{ word: "है", ref: "hi-0780" }] }
    synonyms:
      - { id: "perhaps-sanskrit", word: "संभवतः", reading: "sambhavataḥ", ipa: "səmbʱəʋət̪əh" }
  - id: "hi-0814"
    target: "कभी नहीं"
    target_scripts: { perso_arabic: "کبھی نہیں" }
    reading: "kabhī nahīm̐"
    ipa: "kəbʱiː nəɦĩː"
    pos: "adv"
    bases: [{ word: "कभी", base: "कभी", reading: "kabhī" }]
    register: "neutral"
    notes:
      - { id: "use", kind: "usage" }
    examples:
      - { target: "वह कभी झूठ नहीं बोलता है।", reading: "vah kabhī jhūṭh nahīm̐ bōltā hai.", ipa: "ʋəɦ kəbʱiː dʒʱuːʈʰ nəɦĩː boːlt̪aː ɦɛː", bases: [{ word: "कभी", base: "कभी", reading: "kabhī" }, { word: "झूठ", base: "झूठ", reading: "jhūṭh" }, { word: "बोलता", base: "बोलना", reading: "bōlnā" }, { word: "है", ref: "hi-0780" }] }
      - { target: "वह कभी नहीं आएगा।", reading: "vah kabhī nahīm̐ āēgā.", ipa: "ʋəɦ kəbʱiː nəɦĩː aːeːɡaː", bases: [{ word: "कभी", base: "कभी", reading: "kabhī" }, { word: "आएगा", base: "आना", reading: "ānā" }] }
    antonyms:
      - { id: "always", ref: "hi-0453" }
  - id: "hi-0815"
    target: "बिल्कुल"
    target_scripts: { perso_arabic: "بالکل" }
    reading: "bilkul"
    ipa: "bɪlkʊl"
    pos: "adv"
    bases: "self"
    register: "neutral"
    notes:
      - { id: "use", kind: "usage" }
    examples:
      - { target: "यह बात बिल्कुल सच है।", reading: "yah bāt bilkul sac hai.", ipa: "jəɦ baːt̪ bɪlkʊl sətʃ ɦɛː", bases: [{ word: "बात", base: "बात", reading: "bāt" }, { word: "सच", base: "सच", reading: "sac" }, { word: "है", ref: "hi-0780" }] }
      - { target: "मुझे यह बिल्कुल पसंद नहीं है।", reading: "mujhē yah bilkul pasand nahīm̐ hai.", ipa: "mʊdʒʱeː jəɦ bɪlkʊl pəsənd̪ nəɦĩː ɦɛː", bases: [{ word: "मुझे", ref: "hi-0745" }, { word: "यह", ref: "hi-0748" }, { word: "पसंद", ref: "hi-0469" }, { word: "नहीं", ref: "hi-0156" }, { word: "है", ref: "hi-0780" }] }
    synonyms:
      - { id: "entirely", ref: "hi-0845" }
  - id: "hi-0816"
    target: "ज़्यादा"
    target_scripts: { perso_arabic: "زیادہ" }
    reading: "zyādā"
    ipa: "zjaːd̪aː"
    pos: "adv"
    bases: "self"
    register: "neutral"
    notes:
      - { id: "use", kind: "usage" }
    examples:
      - { target: "आज ज़्यादा ठंड है।", reading: "āj zyādā ṭhaṇḍ hai.", ipa: "aːdʒ zjaːd̪aː ʈʰəɳɖ ɦɛː", bases: [{ word: "ठंड", base: "ठंड", reading: "ṭhaṇḍ" }, { word: "है", ref: "hi-0780" }] }
      - { target: "उसके पास ज़्यादा पैसे हैं।", reading: "uskē pās zyādā paisē haim̐.", ipa: "ʊskeː paːs zjaːd̪aː pɛːseː ɦɛ̃ː", bases: [{ word: "उसके", ref: "hi-0749" }, { word: "हैं", ref: "hi-0780" }] }
    synonyms:
      - { id: "more-sanskrit", word: "अधिक", reading: "adhik", ipa: "əd̪ʱɪk" }
    antonyms:
      - { id: "less", ref: "hi-0105" }
    collocations:
      - { id: "money", ref: "hi-0234" }
  - id: "hi-0817"
    target: "ज़्यादातर"
    target_scripts: { perso_arabic: "زیادہ تر" }
    reading: "zyādātar"
    ipa: "zjaːd̪aːt̪ər"
    pos: "adv"
    bases: "self"
    register: "neutral"
    notes:
      - { id: "use", kind: "usage" }
    examples:
      - { target: "हम ज़्यादातर घर पर रहते हैं।", reading: "ham zyādātar ghar par rahtē haim̐.", ipa: "ɦəm zjaːd̪aːt̪ər ɡʱər pər rəɦt̪eː ɦɛ̃ː", bases: [{ word: "रहते", base: "रहना", reading: "rahnā" }, { word: "हैं", ref: "hi-0780" }] }
      - { target: "लोग ज़्यादातर सुबह काम करते हैं।", reading: "lōg zyādātar subah kām kartē haim̐.", ipa: "loːɡ zjaːd̪aːt̪ər sʊbəɦ kaːm kərt̪eː ɦɛ̃ː", bases: [{ word: "करते", base: "करना", reading: "karnā" }, { word: "हैं", ref: "hi-0780" }] }
    synonyms:
      - { id: "mostly-sanskrit", word: "अधिकतर", reading: "adhikatar", ipa: "əd̪ʱɪkət̪ər" }
    collocations:
      - { id: "morning", ref: "hi-0302" }
  - id: "hi-0818"
    target: "अच्छी तरह"
    target_scripts: { perso_arabic: "اچھی طرح" }
    reading: "acchī tarah"
    ipa: "ətʃtʃʰiː t̪ərəɦ"
    pos: "adv"
    bases: [{ word: "अच्छी", base: "अच्छा", reading: "acchā" }, { word: "तरह", base: "तरह", reading: "tarah" }]
    register: "neutral"
    notes:
      - { id: "use", kind: "usage" }
    examples:
      - { target: "वह हिंदी अच्छी तरह बोलता है।", reading: "vah hindī acchī tarah bōltā hai.", ipa: "ʋəɦ ɦɪnd̪iː ətʃtʃʰiː t̪ərəɦ boːlt̪aː ɦɛː", bases: [{ word: "हिंदी", base: "हिंदी", reading: "hindī" }, { word: "अच्छी", base: "अच्छा", reading: "acchā" }, { word: "तरह", base: "तरह", reading: "tarah" }, { word: "बोलता", base: "बोलना", reading: "bōlnā" }, { word: "है", ref: "hi-0780" }] }
      - { target: "इसे अच्छी तरह पढ़िए।", reading: "isē acchī tarah paṛhiē.", ipa: "ɪseː ətʃtʃʰiː t̪ərəɦ pəɽʱɪeː", bases: [{ word: "इसे", ref: "hi-0748" }, { word: "अच्छी", base: "अच्छा", reading: "acchā" }, { word: "तरह", base: "तरह", reading: "tarah" }, { word: "पढ़िए", base: "पढ़ना", reading: "paṛhnā" }] }
  - id: "hi-0819"
    target: "जल्दी"
    target_scripts: { perso_arabic: "جلدی" }
    reading: "jaldī"
    ipa: "dʒəld̪iː"
    pos: "adv"
    bases: "self"
    register: "neutral"
    notes:
      - { id: "use", kind: "usage" }
    examples:
      - { target: "वह जल्दी सो जाता है।", reading: "vah jaldī sō jātā hai.", ipa: "ʋəɦ dʒəld̪iː soː dʒaːt̪aː ɦɛː", bases: [{ word: "सो", base: "सोना", reading: "sōnā" }, { word: "जाता", base: "जाना", reading: "jānā" }, { word: "है", ref: "hi-0780" }] }
      - { target: "जल्दी कीजिए!", reading: "jaldī kījiē!", ipa: "dʒəld̪iː kiːdʒɪeː", bases: [{ word: "कीजिए", base: "करना", reading: "karnā" }] }
    synonyms:
      - { id: "quick-sanskrit", word: "शीघ्र", reading: "śīghra", ipa: "ʃiːɡʱrə" }
    antonyms:
      - { id: "slowly", ref: "hi-0820" }
  - id: "hi-0820"
