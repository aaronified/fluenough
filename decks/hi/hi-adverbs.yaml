      - { target: "बच्चे धीरे सीखते हैं।", reading: "baccē dhīrē sīkhtē haim̐.", ipa: "bətʃtʃeː d̪ʱiːreː siːkʰt̪eː ɦɛ̃ː", bases: [{ word: "सीखते", base: "सीखना", reading: "sīkhnā" }, { word: "हैं", ref: "hi-0780" }] }
    antonyms:
