      - { target: "मैं पहले घर जाऊँगा।", reading: "maim̐ pahlē ghar jāūm̐gā.", ipa: "mɛ̃ː pəɦleː ɡʱər dʒaːũːɡaː", bases: [{ word: "जाऊँगा", base: "जाना", reading: "jānā" }] }
