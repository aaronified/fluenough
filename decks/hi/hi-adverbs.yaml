    target_scripts: { perso_arabic: "دھیرے" }
    reading: "dhīrē"
    ipa: "d̪ʱiːreː"
    pos: "adv"
    bases: "self"
    register: "neutral"
    notes:
      - { id: "use", kind: "usage" }
