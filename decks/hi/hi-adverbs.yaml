    examples:
      - { target: "मैं बाद में फ़ोन करूँगा।", reading: "maim̐ bād mēm̐ fōn karūm̐gā.", ipa: "mɛ̃ː baːd̪ mẽː foːn kərũːɡaː", bases: [{ word: "बाद", base: "बाद", reading: "bād" }, { word: "फ़ोन", base: "फ़ोन", reading: "fōn" }, { word: "करूँगा", base: "करना", reading: "karnā" }] }
      - { target: "हम बाद में मिलेंगे।", reading: "ham bād mēm̐ milēṅgē.", ipa: "ɦəm baːd̪ mẽː mɪleːŋɡeː", bases: [{ word: "बाद", base: "बाद", reading: "bād" }, { word: "मिलेंगे", base: "मिलना", reading: "milnā" }] }
