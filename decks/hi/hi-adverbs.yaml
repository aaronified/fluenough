  - id: "hi-0821"
    target: "धीरे-धीरे"
    target_scripts: { perso_arabic: "دھیرے دھیرے" }
    reading: "dhīrē-dhīrē"
    ipa: "d̪ʱiːreːd̪ʱiːreː"
    pos: "adv"
    bases: "self"
    register: "neutral"
    notes:
      - { id: "use", kind: "usage" }
    examples:
      - { target: "मौसम धीरे-धीरे बदल रहा है।", reading: "mausam dhīrē-dhīrē badal rahā hai.", ipa: "mɔːsəm d̪ʱiːreːd̪ʱiːreː bəd̪əl rəɦaː ɦɛː", bases: [{ word: "मौसम", base: "मौसम", reading: "mausam" }, { word: "बदल", base: "बदलना", reading: "badalnā" }, { word: "रहा", ref: "hi-0791" }, { word: "है", ref: "hi-0780" }] }
      - { target: "बच्चा धीरे-धीरे बोलना सीखता है।", reading: "baccā dhīrē-dhīrē bōlnā sīkhtā hai.", ipa: "bətʃtʃaː d̪ʱiːreːd̪ʱiːreː boːlnaː siːkʰt̪aː ɦɛː", bases: [{ word: "सीखता", base: "सीखना", reading: "sīkhnā" }, { word: "है", ref: "hi-0780" }] }
  - id: "hi-0822"
    target: "सही"
    target_scripts: { perso_arabic: "صحیح" }
