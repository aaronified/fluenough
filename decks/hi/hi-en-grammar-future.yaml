schema: 1
id: hi-en-grammar-future
name: "Future tense"
kind: grammar
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I will go, they will speak."
tags: [beginner, grammar]
pattern:
  name: "Future"
  slot_name: "person and gender"
  slots: ["मैं (m)", "मैं (f)", "तुम (m)", "तुम (f)", "वह (m)", "वह (f)", "हम (m)", "हम (f)", "आप (m)", "आप (f)", "वे (m)", "वे (f)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The stem, a vowel for the person (-ऊँ, -ओ, -ए, -एँ), then -गा, -गी or -गे for gender and number. Some writers spell जाएगा as जायेगा."
  entries:
    - lemma: "जाना"
      key: jaanaa
      reading: "jana"
      gloss: "to go"
      forms:
        "मैं (m)": "जाऊँगा"
        "मैं (f)": "जाऊँगी"
        "तुम (m)": "जाओगे"
        "तुम (f)": "जाओगी"
        "वह (m)": "जाएगा"
        "वह (f)": "जाएगी"
        "हम (m)": "जाएँगे"
        "हम (f)": "जाएँगी"
        "आप (m)": "जाएँगे"
        "आप (f)": "जाएँगी"
        "वे (m)": "जाएँगे"
        "वे (f)": "जाएँगी"
      readings:
        "मैं (m)": "jaunga"
        "मैं (f)": "jaungi"
        "तुम (m)": "jaoge"
        "तुम (f)": "jaogi"
        "वह (m)": "jayega"
        "वह (f)": "jayegi"
        "हम (m)": "jayenge"
        "हम (f)": "jayengi"
        "आप (m)": "jayenge"
        "आप (f)": "jayengi"
        "वे (m)": "jayenge"
        "वे (f)": "jayengi"
    - lemma: "बोलना"
      key: bolnaa
      reading: "bolna"
      gloss: "to speak"
      forms:
        "मैं (m)": "बोलूँगा"
        "मैं (f)": "बोलूँगी"
        "तुम (m)": "बोलोगे"
        "तुम (f)": "बोलोगी"
        "वह (m)": "बोलेगा"
        "वह (f)": "बोलेगी"
        "हम (m)": "बोलेंगे"
        "हम (f)": "बोलेंगी"
        "आप (m)": "बोलेंगे"
        "आप (f)": "बोलेंगी"
        "वे (m)": "बोलेंगे"
        "वे (f)": "बोलेंगी"
      readings:
        "मैं (m)": "bolunga"
        "मैं (f)": "bolungi"
        "तुम (m)": "bologe"
        "तुम (f)": "bologi"
        "वह (m)": "bolega"
        "वह (f)": "bolegi"
        "हम (m)": "bolenge"
        "हम (f)": "bolengi"
        "आप (m)": "bolenge"
        "आप (f)": "bolengi"
        "वे (m)": "bolenge"
        "वे (f)": "bolengi"
