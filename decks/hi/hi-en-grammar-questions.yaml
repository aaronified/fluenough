schema: 1
id: hi-en-grammar-questions
name: "Basic questions"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Yes/no questions and question words, with the word order unchanged."
tags: [beginner, grammar]
cards:
  - id: hi-en-grammar-questions-0001
    target: "क्या आप हिंदी बोलते हैं?"
    native: "Do you speak Hindi?"
    reading: "kyaa aap hindii bolte hain?"
    pos: "phrase"
    notes: "क्या at the start makes a yes/no question. The word order stays as it was."
  - id: hi-en-grammar-questions-0002
    target: "आप चाय पिएँगे?"
    native: "Will you have tea?"
    reading: "aap chaay piyenge?"
    pos: "phrase"
    notes: "A statement becomes a question with nothing but the voice rising at the end."
  - id: hi-en-grammar-questions-0003
    target: "यह क्या है?"
    native: "What is this?"
    reading: "yah kyaa hai?"
    pos: "phrase"
    notes: "The question word goes where the answer would: यह किताब है → यह क्या है?"
  - id: hi-en-grammar-questions-0004
    target: "आप कहाँ जा रहे हैं?"
    native: "Where are you going?"
    reading: "aap kahaan jaa rahe hain?"
    pos: "phrase"
    notes: "Question words usually sit just before the verb."
  - id: hi-en-grammar-questions-0005
    target: "वह कौन है?"
    native: "Who is that?"
    reading: "vah kaun hai?"
    pos: "phrase"
  - id: hi-en-grammar-questions-0006
    target: "आप कब आएँगे?"
    native: "When will you come?"
    reading: "aap kab aayenge?"
    pos: "phrase"
  - id: hi-en-grammar-questions-0007
    target: "आप हिंदी क्यों सीख रहे हैं?"
    native: "Why are you learning Hindi?"
    reading: "aap hindii kyon siikh rahe hain?"
    pos: "phrase"
  - id: hi-en-grammar-questions-0008
    target: "आपके कितने बच्चे हैं?"
    native: "How many children do you have?"
    reading: "aapke kitne bachche hain?"
    pos: "phrase"
    notes: "'Of you how many children are': family takes the possessive, not के पास."
  - id: hi-en-grammar-questions-0009
    target: "आप कैसे आए?"
    native: "How did you come?"
    reading: "aap kaise aaye?"
    pos: "phrase"
    notes: "An answer: बस से, by bus."
  - id: hi-en-grammar-questions-0010
    target: "अच्छा है न?"
    native: "It's good, isn't it?"
    reading: "achchhaa hai na?"
    pos: "phrase"
    notes: "न at the end asks for agreement, like 'isn't it?' or 'right?'."
