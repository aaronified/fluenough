schema: 1
id: hi-en-help
name: "Help"
kind: vocab
theme: help
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Asking for help, doctors and medicine, and saying you are lost."
tags: [beginner]
cards:
  - id: hi-0352
    target: "मदद"
    native: "help"
    reading: "madad"
    pos: "noun"
    gender: "f"
  - id: hi-0353
    target: "मदद कीजिए!"
    native: "Please help!"
    reading: "madad kiijiye!"
    pos: "phrase"
    tags: ["polite"]
  - id: hi-0354
    target: "बचाओ!"
    native: "Help! (in danger)"
    reading: "bachaao!"
    pos: "phrase"
    notes: "What you shout in danger: literally 'save me!'"
  - id: hi-0355
    target: "रुकिए!"
    native: "Stop! Wait, please!"
    reading: "rukiye!"
    pos: "phrase"
    tags: ["polite"]
  - id: hi-0356
    target: "पुलिस"
    native: "police"
    reading: "pulis"
    pos: "noun"
    gender: "f"
    notes: "Feminine: पुलिस आ गई, the police have come. The emergency number in India is 112."
  - id: hi-0357
    target: "डॉक्टर"
    native: "doctor"
    reading: "daaktar"
    alt_target: ["डाक्टर"]
    pos: "noun"
    gender: "m"
  - id: hi-0358
    target: "अस्पताल"
    native: "hospital"
    reading: "aspataal"
    pos: "noun"
    gender: "m"
  - id: hi-0359
    target: "दवाई"
    native: "medicine"
    reading: "davaaii"
    alt_target: ["दवा"]
    pos: "noun"
    gender: "f"
    notes: "Also दवा (davaa). A chemist's is दवाई की दुकान."
  - id: hi-0360
    target: "दर्द"
    native: "pain"
    reading: "dard"
    pos: "noun"
    gender: "m"
    notes: "सिर में दर्द है (sir men dard hai), I have a headache: 'there is pain in the head'."
  - id: hi-0361
    target: "मैं खो गया हूँ।"
    native: "I'm lost. (said by a man)"
    reading: "main kho gayaa huun."
    pos: "phrase"
    notes: "A woman says खो गई हूँ (kho gaii huun)."
  - id: hi-0362
    target: "मुझे समझ नहीं आया।"
    native: "I didn't understand."
    reading: "mujhe samajh nahiin aayaa."
    pos: "phrase"
  - id: hi-0363
    target: "टॉयलेट कहाँ है?"
    native: "Where is the toilet?"
    reading: "taaylet kahaan hai?"
    pos: "phrase"
    notes: "Signs say शौचालय (shauchaalay). Speakers say टॉयलेट or बाथरूम (baathruum)."
