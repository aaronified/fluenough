schema: 1
id: hi-en-script-vowel-signs
name: "Hindi vowel signs"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "After a consonant a vowel is written as a sign (maatraa) on it: after it, before it, above or below it. Here on क and on म."
tags: [beginner, unreviewed, script]
cards:
  - id: hi-en-script-vowel-signs-0001
    target: "का"
    native: "kaa (k + the aa sign)"
    reading: "kaa"
    notes: "The aa sign ा is written after the consonant: क + ा = का. Compare क on its own, which is 'ka'."
  - id: hi-en-script-vowel-signs-0002
    target: "कि"
    native: "ki (k + the short i sign)"
    reading: "ki"
    notes: "The short i sign ि is written BEFORE the consonant but said after it: you see ि then क, and say 'ki'. कि (ki) is 'that', as in 'he said that'."
  - id: hi-en-script-vowel-signs-0003
    target: "की"
    native: "kii (k + the long i sign)"
    reading: "kii"
    notes: "The long i sign ी is written after the consonant. A longer i than कि: की (kii) is 'of' before a feminine noun."
  - id: hi-en-script-vowel-signs-0004
    target: "कु"
    native: "ku (k + the short u sign)"
    reading: "ku"
    notes: "The short u sign ु hangs below the consonant: कुत्ता (kuttaa, dog)."
  - id: hi-en-script-vowel-signs-0005
    target: "कू"
    native: "kuu (k + the long u sign)"
    reading: "kuu"
    notes: "The long u sign ू also hangs below, and is said longer: कूदना (kuudnaa, to jump)."
  - id: hi-en-script-vowel-signs-0006
    target: "कृ"
    native: "kri (k + the ri sign)"
    reading: "kri"
    modes: [recognition, production]
    notes: "The ri sign ृ hangs below the consonant, in words from Sanskrit: कृपया (kripayaa, please). A recogniser writes this sound as क्रि, so it is drilled by reading and writing only."
  - id: hi-en-script-vowel-signs-0007
    target: "के"
    native: "ke (k + the e sign)"
    reading: "ke"
    notes: "The e sign े sits above the consonant: के (ke) is 'of' before a plural or in many phrases."
  - id: hi-en-script-vowel-signs-0008
    target: "कै"
    native: "kai (k + the ai sign)"
    reading: "kai"
    notes: "The ai sign ै sits above the consonant, with two strokes: कैसे (kaise, how)."
  - id: hi-en-script-vowel-signs-0009
    target: "को"
    native: "ko (k + the o sign)"
    reading: "ko"
    notes: "The o sign ो is written after the consonant, with a stroke above: को (ko, to)."
  - id: hi-en-script-vowel-signs-0010
    target: "कौ"
    native: "kau (k + the au sign)"
    reading: "kau"
    notes: "The au sign ौ is written after the consonant, with two strokes above: कौन (kaun, who)."
  - id: hi-en-script-vowel-signs-0011
    target: "कं"
    native: "kan (k + the anusvaar)"
    reading: "kan"
    modes: [recognition, production]
    notes: "The dot above, the anusvaar ं, is an n or m sound before the next consonant: रंग (rang, colour). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: hi-en-script-vowel-signs-0012
    target: "कँ"
    native: "kan (k + the chandrabindu)"
    reading: "kan"
    modes: [recognition, production]
    notes: "The moon and dot ँ above makes the vowel nasal, said through the nose as well: हँसना (hansnaa, to laugh). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: hi-en-script-vowel-signs-0013
    target: "क्"
    native: "k (with the halant: no vowel)"
    reading: "k"
    modes: [recognition, production]
    notes: "The halant ् below takes the vowel away: क् is 'k' alone. Two consonants usually join instead, as क् joins त in शक्ति (shakti, strength). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: hi-en-script-vowel-signs-0014
    target: "मा"
    native: "maa (m + the aa sign)"
    reading: "maa"
    notes: "The same aa sign on another consonant: each sign keeps its place whatever the consonant. मामा (maamaa, mother's brother)."
  - id: hi-en-script-vowel-signs-0015
    target: "मि"
    native: "mi (m + the short i sign)"
    reading: "mi"
    notes: "The short i sign is written before म, as before क, and said after it: मिलना (milnaa, to meet)."
  - id: hi-en-script-vowel-signs-0016
    target: "मी"
    native: "mii (m + the long i sign)"
    reading: "mii"
    notes: "The long i sign is written after म: मीठा (miithaa, sweet)."
  - id: hi-en-script-vowel-signs-0017
    target: "मु"
    native: "mu (m + the short u sign)"
    reading: "mu"
    notes: "The short u sign hangs below म: मुझे (mujhe, to me)."
  - id: hi-en-script-vowel-signs-0018
    target: "मू"
    native: "muu (m + the long u sign)"
    reading: "muu"
    notes: "The long u sign hangs below म: मूली (muulii, radish)."
  - id: hi-en-script-vowel-signs-0019
    target: "मे"
    native: "me (m + the e sign)"
    reading: "me"
    notes: "The e sign sits above म: मेज़ (mez, table)."
  - id: hi-en-script-vowel-signs-0020
    target: "मो"
    native: "mo (m + the o sign)"
    reading: "mo"
    notes: "The o sign is written after म, with a stroke above: मोर (mor, peacock)."
