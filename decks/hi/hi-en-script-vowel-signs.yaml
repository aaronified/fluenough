schema: 1
id: hi-en-script-vowel-signs
name: "Hindi vowel signs"
kind: vocab
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "After a consonant a vowel is written as a sign (matra) on it: after it, before it, above or below it. Here on क and on म, with the u signs on र and two signs of loanwords."
tags: [beginner, unreviewed, script]
cards:
  - id: hi-0059
    target: "का"
    native: "kaa (k + the aa sign)"
    reading: "ka"
    notes: "The aa sign ा is written after the consonant: क + ा = का. Compare क on its own, which is 'ka' with the short a."
  - id: hi-0060
    target: "कि"
    native: "ki (k + the short i sign)"
    reading: "ki"
    notes: "The short i sign ि is written BEFORE the consonant but said after it: you see ि then क, and say 'ki'. कि (ki) is 'that', as in 'he said that'."
  - id: hi-0061
    target: "की"
    native: "kii (k + the long i sign)"
    reading: "ki"
    notes: "The long i sign ी is written after the consonant. A longer i than कि: की (ki) is 'of' before a feminine noun."
  - id: hi-0062
    target: "कु"
    native: "ku (k + the short u sign)"
    reading: "ku"
    notes: "The short u sign ु hangs below the consonant: कुत्ता (kutta, dog)."
  - id: hi-0063
    target: "कू"
    native: "kuu (k + the long u sign)"
    reading: "ku"
    notes: "The long u sign ू also hangs below, and is said longer: कूदना (kudna, to jump)."
  - id: hi-0064
    target: "कृ"
    native: "kri (k + the ri sign)"
    reading: "kri"
    modes: [recognition, production]
    notes: "The ri sign ृ hangs below the consonant, in words from Sanskrit: कृपया (kripaya, please). A recogniser writes this sound as क्रि, so it is drilled by reading and writing only."
  - id: hi-0065
    target: "के"
    native: "ke (k + the e sign)"
    reading: "ke"
    notes: "The e sign े sits above the consonant: के (ke) is 'of' before a masculine plural, as in राम के बच्चे (ram ke bachche, Ram's children)."
  - id: hi-0066
    target: "कै"
    native: "kai (k + the ai sign)"
    reading: "kai"
    notes: "The ai sign ै sits above the consonant, with two strokes: कैसे (kaise, how)."
  - id: hi-0067
    target: "को"
    native: "ko (k + the o sign)"
    reading: "ko"
    notes: "The o sign ो is written after the consonant, with a stroke above: को (ko, to)."
  - id: hi-0068
    target: "कौ"
    native: "kau (k + the au sign)"
    reading: "kau"
    notes: "The au sign ौ is written after the consonant, with two strokes above: कौन (kaun, who)."
  - id: hi-0069
    target: "कं"
    native: "kan (k + the anusvaar)"
    reading: "kan"
    modes: [recognition, production]
    notes: "The dot above, the anusvar ं, is an n or m sound before the next consonant: रंग (rang, colour). With a sign above the line, where the moon and dot won't fit, it stands for them: a nasal vowel, as in में (men) and हैं (hain). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: hi-0070
    target: "कँ"
    native: "kan (k + the chandrabindu)"
    reading: "kan"
    modes: [recognition, production]
    notes: "The moon and dot ँ above makes the vowel nasal, said through the nose as well: हँसना (hansna, to laugh). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: hi-0071
    target: "क्"
    native: "k (with the halant: no vowel)"
    reading: "k"
    modes: [recognition, production]
    notes: "The halant ् below takes the vowel away: क् is 'k' alone. Two consonants usually join instead, as क् joins त in शक्ति (shakti, strength). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: hi-0072
    target: "मा"
    native: "maa (m + the aa sign)"
    reading: "ma"
    notes: "The same aa sign on another consonant: each sign keeps its place on almost every consonant. मामा (mama, mother's brother)."
  - id: hi-0073
    target: "मि"
    native: "mi (m + the short i sign)"
    reading: "mi"
    notes: "The short i sign is written before म, as before क, and said after it: मिलना (milna, to meet)."
  - id: hi-0074
    target: "मी"
    native: "mii (m + the long i sign)"
    reading: "mi"
    notes: "The long i sign is written after म: मीठा (mitha, sweet)."
  - id: hi-0075
    target: "मु"
    native: "mu (m + the short u sign)"
    reading: "mu"
    notes: "The short u sign hangs below म: मुझे (mujhe, to me)."
  - id: hi-0076
    target: "मू"
    native: "muu (m + the long u sign)"
    reading: "mu"
    notes: "The long u sign hangs below म: मूली (muli, radish)."
  - id: hi-0077
    target: "मे"
    native: "me (m + the e sign)"
    reading: "me"
    notes: "The e sign sits above म: मेज़ (mez, table)."
  - id: hi-0078
    target: "मो"
    native: "mo (m + the o sign)"
    reading: "mo"
    notes: "The o sign is written after म, with a stroke above: मोर (mor, peacock)."
  - id: hi-0079
    target: "रु"
    native: "ru (r + the short u sign, beside र)"
    reading: "ru"
    notes: "After र the u signs don't hang below: they sit beside it, at its middle. रुपया (rupaya, rupee)."
  - id: hi-0080
    target: "रू"
    native: "ruu (r + the long u sign, beside र)"
    reading: "ru"
    notes: "The long u sign also sits beside र: रूप (rup, form; looks)."
  - id: hi-0081
    target: "कॉ"
    native: "kaa as in 'coffee' (k + the English o sign)"
    reading: "ko"
    notes: "The moon above the aa sign, ॉ, is the open o of English words, said like the 'o' of 'coffee': कॉफ़ी (kofi, coffee), डॉक्टर (doktar, doctor)."
  - id: hi-0082
    target: "कः"
    native: "kah (k + the visarga)"
    reading: "kah"
    modes: [recognition, production]
    notes: "The two dots after a letter, the visarga ः, are a breath of h after the vowel. It is rare, in words from Sanskrit and in छः (chhah, six). A mark rather than a sound of its own, so it is drilled by reading and writing only."
