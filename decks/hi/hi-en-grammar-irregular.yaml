schema: 1
id: hi-en-grammar-irregular
name: "Irregular verbs"
kind: grammar
language: { code: hi, iso639_3: hin, name: Hindi, script: devanagari, tts: hi-IN, icon: "हि" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The common verbs whose past and polite request break the pattern."
tags: [beginner, grammar]
pattern:
  name: "Irregular verbs"
  slot_name: "form"
  slots: ["past, masculine", "past, feminine", "past, masculine plural", "polite request"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "These are among the most used verbs in Hindi, so they are worth learning by heart. A regular verb forms its past from its stem (बोलना → बोला) and its polite request with -इए (बोलिए)."
  entries:
    - lemma: "करना"
      key: karnaa
      reading: "karnā"
      ipa: "kərnaː"
      gloss: "to do"
      forms:
        "past, masculine": "किया"
        "past, feminine": "की"
        "past, masculine plural": "किए"
        "polite request": "कीजिए"
      readings:
        "past, masculine": "kiyā"
        "past, feminine": "kī"
        "past, masculine plural": "kiē"
        "polite request": "kījiē"
      ipas:
        "past, masculine": "kɪjaː"
        "past, feminine": "kiː"
        "past, masculine plural": "kɪeː"
        "polite request": "kiːdʒɪeː"
    - lemma: "देना"
      key: denaa
      reading: "dēnā"
      ipa: "d̪eːnaː"
      gloss: "to give"
      forms:
        "past, masculine": "दिया"
        "past, feminine": "दी"
        "past, masculine plural": "दिए"
        "polite request": "दीजिए"
      readings:
        "past, masculine": "diyā"
        "past, feminine": "dī"
        "past, masculine plural": "diē"
        "polite request": "dījiē"
      ipas:
        "past, masculine": "d̪ɪjaː"
        "past, feminine": "d̪iː"
        "past, masculine plural": "d̪ɪeː"
        "polite request": "d̪iːdʒɪeː"
    - lemma: "लेना"
      key: lenaa
      reading: "lēnā"
      ipa: "leːnaː"
      gloss: "to take"
      forms:
        "past, masculine": "लिया"
        "past, feminine": "ली"
        "past, masculine plural": "लिए"
        "polite request": "लीजिए"
      readings:
        "past, masculine": "liyā"
        "past, feminine": "lī"
        "past, masculine plural": "liē"
        "polite request": "lījiē"
      ipas:
        "past, masculine": "lɪjaː"
        "past, feminine": "liː"
        "past, masculine plural": "lɪeː"
        "polite request": "liːdʒɪeː"
    - lemma: "पीना"
      key: piinaa
      reading: "pīnā"
      ipa: "piːnaː"
      gloss: "to drink"
      forms:
        "past, masculine": "पिया"
        "past, feminine": "पी"
        "past, masculine plural": "पिए"
        "polite request": "पीजिए"
      readings:
        "past, masculine": "piyā"
        "past, feminine": "pī"
        "past, masculine plural": "piē"
        "polite request": "pījiē"
      ipas:
        "past, masculine": "pɪjaː"
        "past, feminine": "piː"
        "past, masculine plural": "pɪeː"
        "polite request": "piːdʒɪeː"
    - lemma: "जाना"
      key: jaanaa
      reading: "jānā"
      ipa: "dʒaːnaː"
      gloss: "to go"
      forms:
        "past, masculine": "गया"
        "past, feminine": "गई"
        "past, masculine plural": "गए"
        "polite request": "जाइए"
      readings:
        "past, masculine": "gayā"
        "past, feminine": "gaī"
        "past, masculine plural": "gaē"
        "polite request": "jāiē"
      ipas:
        "past, masculine": "ɡəjaː"
        "past, feminine": "ɡəiː"
        "past, masculine plural": "ɡəeː"
        "polite request": "dʒaːɪeː"
    - lemma: "होना"
      key: honaa
      reading: "hōnā"
      ipa: "ɦoːnaː"
      gloss: "to be, to happen"
      forms:
        "past, masculine": "हुआ"
        "past, feminine": "हुई"
        "past, masculine plural": "हुए"
        "polite request": null
      readings:
        "past, masculine": "huā"
        "past, feminine": "huī"
        "past, masculine plural": "huē"
      ipas:
        "past, masculine": "ɦʊaː"
        "past, feminine": "ɦʊiː"
        "past, masculine plural": "ɦʊeː"
