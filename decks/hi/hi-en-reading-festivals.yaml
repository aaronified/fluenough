passages:
  - id: "hi-festival-days"
    title: "The days of the festival"
    theme: "festivals"
    sentences:
      - { text: "इस हफ़्ते दिवाली है।", reading: "is haftē divālī hai.", ipa: "ɪs ɦəft̪eː d̪ɪʋaːliː ɦɛː" }
      - { text: "सोमवार को हम घर पर हैं।", reading: "sōmvār kō ham ghar par haim̐.", ipa: "soːmʋaːr koː ɦəm ɡʱər pər ɦɛ̃ː" }
      - { text: "मंगलवार को सब मिठाई है।", reading: "maṅgalvār kō sab miṭhāī hai.", ipa: "məŋɡəlʋaːr koː səb mɪʈʰaːiː ɦɛː" }
      - { text: "शाम को आरती होती है।", reading: "śām kō ārtī hōtī hai.", ipa: "ʃaːm koː aːrt̪iː ɦoːt̪iː ɦɛː" }
    questions:
      - id: "hi-1412"
        prompt: { en: "Diwali is this week." }
        answer: true
      - id: "hi-1413"
        prompt: { en: "Where are they on Monday?" }
        options:
          - { en: "At home" }
          - { en: "At the market" }
        answer: 1
      - id: "hi-1414"
        prompt: { en: "The sweets are shared on Monday." }
        answer: false
  - id: "hi-festival-invitation"
    title: "An invitation to a feast"
    theme: "festivals"
    sentences:
      - { text: "पड़ोसी, हमारे घर होली की दावत है।", reading: "paṛōsī, hamārē ghar hōlī kī dāvat hai.", ipa: "pəɽoːsiː ɦəmaːreː ɡʱər ɦoːliː kiː d̪aːʋət̪ ɦɛː" }
      - { text: "आप सब मेहमान हैं।", reading: "āp sab mēhmān haim̐.", ipa: "aːp səb meːɦmaːn ɦɛ̃ː" }
      - { text: "दोपहर बारह बजे आना।", reading: "dōphar bārah bajē ānā.", ipa: "d̪oːpɦər baːrəɦ bədʒeː aːnaː" }
      - { text: "लड्डू और सेवई है।", reading: "laḍḍū aur sēvaī hai.", ipa: "ləɖɖuː ɔːr seːʋəiː ɦɛː" }
    questions:
      - id: "hi-1415"
        prompt: { en: "The feast is at a neighbour’s house." }
        answer: false
      - id: "hi-1416"
        prompt: { en: "What will be served?" }
        options:
          - { en: "Laddoo and sevai" }
          - { en: "Rice and dal" }
        answer: 1
      - id: "hi-1417"
        prompt: { en: "The invitation is for everyone." }
        answer: true
