schema: 1
id: "hi-en-hobbies"
kind: "layer"
core: "hi-hobbies"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hobbies"
license: "CC-BY-SA-4.0"
description: "What people do for pleasure: music, dance, games, sports, painting and walks. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-1637":
    native: "hobby; pastime"
    notes:
      "n1": "The things you do for pleasure in your free time."
    examples:
      "मेरा शौक पेंटिंग है।": { native: "My hobby is painting.", bases: { "मेरा": "my", "शौक": "hobby", "पेंटिंग": "painting" } }
      "आपका शौक क्या है?": { native: "What is your hobby?", bases: { "शौक": "hobby", "क्या": "what" } }
  "hi-1638":
    native: "game; sport"
    notes:
      "n1": "A game or a sport. The verb is खेलना (khelnā), to play."
    examples:
      "खेल का मैदान बड़ा है।": { native: "The playground is big.", bases: { "खेल": "game", "मैदान": "field", "बड़ा": "big" } }
      "खेल में जीतना अच्छा है।": { native: "Winning a game is good.", bases: { "खेल": "game", "जीतना": "to win", "अच्छा": "good" } }
  "hi-1639":
    native: "to sing"
    notes:
      "n1": "The noun गाना (gānā) is a song."
    examples:
      "वह अच्छा गाती है।": { native: "She sings well.", bases: { "अच्छा": "good", "गाती": "to sing" } }
      "मुझे गाना पसंद है।": { native: "I like to sing.", bases: { "मुझे": "to me", "गाना": "to sing", "पसंद": "liking" } }
  "hi-1640":
    native: "song"
    notes:
      "n1": "A song, Sanskrit-leaning. The everyday word is गाना (gānā)."
    examples:
      "यह गीत सुंदर है।": { native: "This song is beautiful.", bases: { "गीत": "song", "सुंदर": "beautiful" } }
      "हम गीत गाते हैं।": { native: "We sing songs.", bases: { "गीत": "song", "गाते": "to sing" } }
  "hi-1641":
    native: "singer"
    notes:
      "n1": "A person who sings. Female singer is गायिका (gāyikā)."
    examples:
      "वह एक अच्छा गायक है।": { native: "He is a good singer.", bases: { "एक": "one", "अच्छा": "good", "गायक": "singer" } }
      "गायक मंच पर आए।": { native: "The singer came on stage.", bases: { "गायक": "singer", "मंच": "stage", "आए": "to come" } }
  "hi-1642":
    native: "to dance"
    notes:
      "n1": "The noun नाच (nāc) is a dance."
    examples:
      "बच्चे नाचते हैं।": { native: "The children dance.", bases: { "नाचते": "to dance" } }
      "वह शादी में नाचती है।": { native: "She dances at the wedding.", bases: { "नाचती": "to dance" } }
  "hi-1643":
    native: "dance (informal)"
    notes:
      "n1": "The everyday word for a dance. The verb is नाचना (nācnā)."
    examples:
      "यह नाच बहुत सुंदर है।": { native: "This dance is very beautiful.", bases: { "नाच": "dance", "सुंदर": "beautiful" } }
      "नाच देखो।": { native: "Watch the dance.", bases: { "नाच": "dance (informal)", "देखो": "to see" } }
  "hi-1644":
    native: "to swim"
    notes:
      "n1": "The noun is तैराकी (tairākī), swimming."
    examples:
      "मैं तैरना सीखता हूँ।": { native: "I am learning to swim.", bases: { "तैरना": "to swim", "सीखता": "to learn", "हूँ": "to be" } }
      "वह नदी में तैरता है।": { native: "He swims in the river.", bases: { "तैरता": "to swim" } }
  "hi-1645":
    native: "swimming"
    notes:
      "n1": "The sport of swimming."
    examples:
      "तैराकी अच्छी कसरत है।": { native: "Swimming is good exercise.", bases: { "तैराकी": "swimming", "अच्छी": "good", "कसरत": "exercise" } }
      "मेरी बहन तैराकी करती है।": { native: "My sister goes swimming.", bases: { "मेरी": "my", "तैराकी": "swimming", "करती": "to do" } }
  "hi-1646":
    native: "kite"
    notes:
      "n1": "Flown in the sky, on the roof, in festivals."
    examples:
      "पतंग आसमान में उड़ती है।": { native: "The kite flies in the sky.", bases: { "पतंग": "kite", "आसमान": "sky", "उड़ती": "to fly" } }
      "बच्चे पतंग उड़ाते हैं।": { native: "The children fly kites.", bases: { "पतंग": "kite", "उड़ाते": "to fly" } }
  "hi-1647":
    native: "picture; photo"
    notes:
      "n1": "A picture, a drawing or a photograph."
    examples:
      "यह तस्वीर बहुत सुंदर है।": { native: "This picture is very beautiful.", bases: { "तस्वीर": "picture", "सुंदर": "beautiful" } }
      "मैं तस्वीर बनाती हूँ।": { native: "I make pictures.", bases: { "तस्वीर": "picture", "बनाती": "to make", "हूँ": "to be" } }
  "hi-1648":
    native: "photo"
    notes:
      "n1": "An English word for a photograph."
    examples:
      "फ़ोटो खींचो।": { native: "Take a photo.", bases: { "फ़ोटो": "photo", "खींचो": "to take" } }
      "यह फ़ोटो मेरे पास है।": { native: "I have this photo.", bases: { "फ़ोटो": "photo", "मेरे": "my" } }
  "hi-1649":
    native: "painting"
    notes:
      "n1": "An English word. The art of painting is चित्रकारी (citrakārī)."
    examples:
      "पेंटिंग दीवार पर है।": { native: "The painting is on the wall.", bases: { "पेंटिंग": "painting", "दीवार": "wall" } }
      "पेंटिंग करना मेरा शौक है।": { native: "Painting is my hobby.", bases: { "पेंटिंग": "painting", "करना": "to do" } }
  "hi-1650":
    native: "the art of painting"
    notes:
      "n1": "Sanskrit-leaning. The art of drawing and painting pictures."
    examples:
      "चित्रकारी में रंग बहुत ज़रूरी हैं।": { native: "In painting colours are very important.", bases: { "चित्रकारी": "painting", "रंग": "colour", "ज़रूरी": "necessary" } }
      "वह चित्रकारी सीखती है।": { native: "She learns painting.", bases: { "चित्रकारी": "the art of painting", "सीखती": "to learn" } }
  "hi-1651":
    native: "guitar"
    notes:
      "n1": "An English word for the string instrument."
    examples:
      "मैं गिटार बजाता हूँ।": { native: "I play the guitar.", bases: { "गिटार": "guitar", "बजाता": "to play", "हूँ": "to be" } }
      "गिटार का तार टूटा है।": { native: "A string of the guitar has broken.", bases: { "गिटार": "guitar", "तार": "string", "टूटा": "to break" } }
  "hi-1652":
    native: "harmonium"
    notes:
      "n1": "A keyboard instrument, pumped by hand."
    examples:
      "हारमोनियम पर गाना गाओ।": { native: "Sing on the harmonium.", bases: { "हारमोनियम": "harmonium", "गाओ": "to sing" } }
      "हारमोनियम पुराना है।": { native: "The harmonium is old.", bases: { "हारमोनियम": "harmonium", "पुराना": "old" } }
  "hi-1653":
    native: "tabla; a pair of drums"
    notes:
      "n1": "The drums played in north Indian music."
    examples:
      "तबला बजाओ।": { native: "Play the tabla.", bases: { "तबला": "tabla", "बजाओ": "to play" } }
      "तबला सीखना कठिन है।": { native: "Learning the tabla is difficult.", bases: { "तबला": "tabla", "कठिन": "difficult" } }
  "hi-1654":
    native: "sitar"
    notes:
      "n1": "A long-necked string instrument."
    examples:
      "सितार सुनो।": { native: "Listen to the sitar.", bases: { "सितार": "sitar", "सुनो": "to listen" } }
      "सितार की धुन सुंदर है।": { native: "The tune of the sitar is beautiful.", bases: { "सितार": "sitar", "धुन": "tune", "सुंदर": "beautiful" } }
  "hi-1655":
    native: "dholak; a drum"
    notes:
      "n1": "A barrel drum, played at weddings and songs."
    examples:
      "ढोलक पर गीत गाओ।": { native: "Sing a song to the dholak.", bases: { "ढोलक": "dholak", "गाओ": "to sing" } }
      "शादी में ढोलक बजती है।": { native: "At a wedding the dholak is played.", bases: { "ढोलक": "dholak", "बजती": "to sound" } }
  "hi-1656":
    native: "flute"
    notes:
      "n1": "Made of bamboo, played by blowing."
    examples:
      "बाँसुरी बजाओ।": { native: "Play the flute.", bases: { "बाँसुरी": "flute", "बजाओ": "to play" } }
      "बाँसुरी मीठी है।": { native: "The flute is sweet.", bases: { "बाँसुरी": "flute", "मीठी": "sweet" } }
  "hi-1657":
    native: "veena; a string instrument"
    notes:
      "n1": "An old Indian string instrument, linked with learning."
    examples:
      "वीणा बजती है।": { native: "The veena plays.", bases: { "वीणा": "veena", "बजती": "to sound" } }
      "वीणा के तार ढीले हैं।": { native: "The strings of the veena are loose.", bases: { "वीणा": "veena", "तार": "string", "ढीले": "loose" } }
  "hi-1658":
    native: "gardening"
    notes:
      "n1": "The work of looking after plants and a garden."
    examples:
      "मेरे पिता बाग़वानी करते हैं।": { native: "My father gardens.", bases: { "मेरे": "my", "बाग़वानी": "gardening", "करते": "to do" } }
      "बाग़वानी से मन खुश रहता है।": { native: "Gardening keeps the mind happy.", bases: { "बाग़वानी": "gardening", "मन": "mind", "खुश": "happy", "रहता": "to be" } }
  "hi-1659":
    native: "diary"
    notes:
      "n1": "A book in which one writes each day."
    examples:
      "मैं रोज़ डायरी लिखती हूँ।": { native: "I write in my diary every day.", bases: { "डायरी": "diary", "लिखती": "to write", "हूँ": "to be" } }
      "डायरी मेज़ पर है।": { native: "The diary is on the table.", bases: { "डायरी": "diary", "मेज़": "table" } }
  "hi-1660":
    native: "walk; outing"
    notes:
      "n1": "A walk or a short trip for pleasure."
    examples:
      "सुबह सैर करो।": { native: "Go for a walk in the morning.", bases: { "सैर": "walk", "करो": "to do" } }
      "हम पार्क की सैर करते हैं।": { native: "We walk around the park.", bases: { "पार्क": "park", "सैर": "walk", "करते": "to do" } }
  "hi-1661":
    native: "to wander; to go around"
    notes:
      "n1": "To walk or travel around for pleasure."
    examples:
      "हम शाम को घूमने जाते हैं।": { native: "We go out for a walk in the evening.", bases: { "घूमने": "to wander", "जाते": "to go" } }
      "वह शहर में घूमती है।": { native: "She goes around the city.", bases: { "घूमती": "to wander" } }
  "hi-1662":
    native: "to stroll"
    notes:
      "n1": "A slow walk, for health or pleasure."
    examples:
      "दादा जी रोज़ टहलते हैं।": { native: "Grandfather strolls every day.", bases: { "टहलते": "to stroll" } }
      "सुबह टहलना अच्छा है।": { native: "A morning stroll is good.", bases: { "टहलना": "to stroll", "अच्छा": "good" } }
  "hi-1663":
    native: "chess"
    notes:
      "n1": "The board game with kings and queens."
    examples:
      "शतरंज में दिमाग़ लगता है।": { native: "Chess uses the mind.", bases: { "शतरंज": "chess", "दिमाग़": "mind", "लगता": "to be used" } }
      "वह शतरंज अच्छा खेलती है।": { native: "She plays chess well.", bases: { "शतरंज": "chess", "अच्छा": "good", "खेलती": "to play" } }
  "hi-1664":
    native: "carrom"
    notes:
      "n1": "A board game played with a striker and small discs."
    examples:
      "कैरम का बोर्ड बड़ा है।": { native: "The carrom board is big.", bases: { "कैरम": "carrom", "बोर्ड": "board", "बड़ा": "big" } }
      "कैरम खेलो।": { native: "Play carrom.", bases: { "कैरम": "carrom", "खेलो": "to play" } }
  "hi-1665":
    native: "playing cards"
    notes:
      "n1": "A pack of playing cards."
    examples:
      "ताश की गड्डी मेज़ पर है।": { native: "The pack of cards is on the table.", bases: { "ताश": "playing cards", "गड्डी": "pack", "मेज़": "table" } }
      "ताश खेलो।": { native: "Play cards.", bases: { "ताश": "playing cards", "खेलो": "to play" } }
  "hi-1666":
    native: "puzzle; riddle"
    notes:
      "n1": "A riddle or a puzzle to solve."
    examples:
      "यह पहेली कठिन है।": { native: "This puzzle is difficult.", bases: { "पहेली": "puzzle", "कठिन": "difficult" } }
      "पहेली का जवाब दो।": { native: "Give the answer to the riddle.", bases: { "पहेली": "puzzle", "दो": "to give" } }
  "hi-1667":
    native: "bicycle"
    notes:
      "n1": "An English word for the bicycle."
    examples:
      "साइकिल चलाना मेरा शौक है।": { native: "Riding a bicycle is my hobby.", bases: { "साइकिल": "bicycle", "चलाना": "to ride" } }
      "साइकिल तेज़ चलती है।": { native: "The bicycle goes fast.", bases: { "साइकिल": "bicycle", "तेज़": "fast", "चलती": "to ride" } }
  "hi-1668":
    native: "cricket"
    notes:
      "n1": "An English word for the bat-and-ball game."
    examples:
      "हम क्रिकेट खेलते हैं।": { native: "We play cricket.", bases: { "क्रिकेट": "cricket", "खेलते": "to play" } }
      "क्रिकेट का मैच आज है।": { native: "The cricket match is today.", bases: { "क्रिकेट": "cricket", "मैच": "match" } }
  "hi-1669":
    native: "football"
    notes:
      "n1": "An English word for the game with a round ball and goals."
    examples:
      "फ़ुटबॉल खेलना मज़ेदार है।": { native: "Playing football is fun.", bases: { "फ़ुटबॉल": "football", "मज़ेदार": "fun" } }
      "बच्चे फ़ुटबॉल खेलते हैं।": { native: "The children play football.", bases: { "फ़ुटबॉल": "football", "खेलते": "to play" } }
  "hi-1670":
    native: "yoga"
    notes:
      "n1": "Sanskrit-leaning. Breathing and bodily exercises for health."
    examples:
      "सुबह योग करो।": { native: "Do yoga in the morning.", bases: { "योग": "yoga", "करो": "to do" } }
      "योग से शरीर मज़बूत होता है।": { native: "Yoga makes the body strong.", bases: { "योग": "yoga", "शरीर": "body", "मज़बूत": "strong", "होता": "to be" } }
  "hi-1671":
    native: "wrestling"
    notes:
      "n1": "A sport in which two people wrestle."
    examples:
      "कुश्ती एक पुरानी खेल है।": { native: "Wrestling is an old sport.", bases: { "कुश्ती": "wrestling", "एक": "one", "पुरानी": "old", "खेल": "sport" } }
      "वह कुश्ती सीखता है।": { native: "He is learning wrestling.", bases: { "कुश्ती": "wrestling", "सीखता": "to learn" } }
  "hi-1672":
    native: "picnic"
    notes:
      "n1": "An English word for a day out with food in the open."
    examples:
      "रविवार को पिकनिक पर जाएँगे।": { native: "We will go on a picnic on Sunday.", bases: { "पिकनिक": "picnic", "जाएँगे": "to go" } }
      "पिकनिक में खाना अच्छा लगता है।": { native: "The food is good on a picnic.", bases: { "पिकनिक": "picnic", "अच्छा": "good", "लगता": "to feel" } }
  "hi-1673":
    native: "sports; games and play"
    notes:
      "n1": "All games and sports together."
    examples:
      "स्कूल में खेलकूद होता है।": { native: "There are games and sports at school.", bases: { "खेलकूद": "sports", "होता": "to be" } }
      "खेलकूद से तंदुरुस्ती आती है।": { native: "Sport brings good health.", bases: { "खेलकूद": "sports", "तंदुरुस्ती": "health", "आती": "to come" } }
  "hi-1674":
    native: "badminton"
    notes:
      "n1": "An English word for the game with a shuttlecock."
    examples:
      "बैडमिंटन में शटल उड़ता है।": { native: "In badminton the shuttle flies.", bases: { "बैडमिंटन": "badminton", "शटल": "shuttlecock", "उड़ता": "to fly" } }
      "मैं बैडमिंटन खेलता हूँ।": { native: "I play badminton.", bases: { "बैडमिंटन": "badminton", "खेलता": "to play", "हूँ": "to be" } }
  "hi-1675":
    native: "match"
    notes:
      "n1": "An English word for a game between two teams."
    examples:
      "आज का मैच रोमांचक है।": { native: "Today's match is exciting.", bases: { "मैच": "match", "रोमांचक": "exciting" } }
      "मैच देखने चलो।": { native: "Come and watch the match.", bases: { "मैच": "match", "देखने": "to see", "चलो": "to go" } }
  "hi-1676":
    native: "ball"
    notes:
      "n1": "The ball for cricket, football or tennis."
    examples:
      "गेंद मेरे पास है।": { native: "The ball is with me.", bases: { "गेंद": "ball", "मेरे": "my" } }
      "गेंद फेंको।": { native: "Throw the ball.", bases: { "गेंद": "ball", "फेंको": "to throw" } }
  "hi-1677":
    native: "bat"
    notes:
      "n1": "The bat for cricket or baseball."
    examples:
      "बल्ला भारी है।": { native: "The bat is heavy.", bases: { "बल्ला": "bat", "भारी": "heavy" } }
      "बल्ले से गेंद मारो।": { native: "Hit the ball with the bat.", bases: { "बल्ले": "bat", "मारो": "to hit" } }
  "hi-1678":
    native: "team"
    notes:
      "n1": "An English word for a group that plays together."
    examples:
      "हमारी टीम जीती है।": { native: "Our team has won.", bases: { "हमारी": "our", "टीम": "team", "जीती": "to win" } }
      "टीम में बारह खिलाड़ी हैं।": { native: "There are twelve players in the team.", bases: { "टीम": "team", "बारह": "twelve" } }
  "hi-1679":
    native: "player; sportsperson"
    notes:
      "n1": "A person who plays a game."
    examples:
      "वह अच्छा खिलाड़ी है।": { native: "He is a good player.", bases: { "अच्छा": "good", "खिलाड़ी": "player" } }
      "खिलाड़ी मैदान में आए।": { native: "The players came onto the field.", bases: { "खिलाड़ी": "player", "मैदान": "field", "आए": "to come" } }
  "hi-1680":
    native: "film; movie"
    notes:
      "n1": "An English word for a film."
    examples:
