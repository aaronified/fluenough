description: "A verb's stem with लेना (lēnā), देना (dēnā) or जाना (jānā): the same action, done and finished. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0504":
    native: "to eat up; to have (something) to eat"
    notes:
      "n1": "लेना (lēnā) adds 'for oneself': खाना खा लीजिए (khānā khā lījiē), please have your meal."
    bases:
      "लेना": "to take"
  "hi-0505":
    native: "to give away; to hand over"
    notes:
      "n1": "देना (dēnā) adds 'for someone else': किताब दे दीजिए (kitāb dē dījiē), please hand over the book."
    bases:
      "दे": "to give"
      "देना": "to give"
  "hi-0506":
    native: "to put down"
    bases:
      "रख": "to put; to keep"
      "देना": "to give"
  "hi-0507":
    native: "to arrive; to come (at last)"
    notes:
      "n1": "बस आ गई (bas ā gaī), the bus has come."
    bases:
      "जाना": "to go"
  "hi-0508":
    native: "to become; to happen"
    notes:
      "n1": "देर हो गई (dēr hō gaī), it's got late."
    bases:
      "हो": "to be"
      "जाना": "to go"
  "hi-0509":
    native: "to fall asleep"
    bases:
      "जाना": "to go"
  "hi-0510":
    native: "to sit down"
    bases:
      "बैठ": "to sit"
      "जाना": "to go"
  "hi-0511":
    native: "to understand (at last)"
    notes:
      "n1": "मैं समझ गया (maim̐ samajh gayā), I've got it."
    bases:
      "समझ": "to understand"
      "जाना": "to go"
  "hi-0512":
    native: "to forget"
    notes:
      "n1": "मैं भूल गया (maim̐ bhūl gayā), I forgot."
    bases:
      "भूल": "to forget"
      "जाना": "to go"
