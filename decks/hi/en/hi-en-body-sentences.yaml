cards:
  "hi-4830":
    native: "There is pain in my head."
    bases:
      "मेरे": "my (oblique)"
    confusables:
      "w1": { why: "Stomach, not head: पेट (pēṭ) is the stomach." }
      "w2": { why: "Foot, not head: पैर (pair) is a foot or leg." }
  "hi-4831":
    native: "My eye is big."
    bases:
      "मेरी": "my (feminine)"
      "बड़ी": "big (feminine)"
    confusables:
      "w1": { why: "Ear, not eye: कान (kān) is an ear." }
      "w2": { why: "Nose, not eye: नाक (nāk) is a nose." }
  "hi-4832":
    native: "His hair is long."
    bases:
      "उसके": "his (oblique)"
      "लंबे": "long (plural)"
    confusables:
      "w1": { why: "Nail, not hair: नाखून (nākhūn) is a nail." }
      "w2": { why: "Tooth, not hair: दाँत (dām̐t) is a tooth." }
  "hi-4833":
    native: "My hands are clean."
    bases:
      "मेरे": "my (oblique)"
    confusables:
      "w1": { why: "Foot, not hand: पैर (pair) is a foot or leg." }
      "w2": { why: "Nail, not hand: नाखून (nākhūn) is a nail." }
  "hi-4834":
    native: "That child is running."
    bases:
      "दौड़": "run (stem)"
      "रहा": "-ing (continuous marker)"
    confusables:
      "w1": { why: "To sit, not run: बैठना (baiṭhnā) means to sit." }
      "w2": { why: "To walk, not run: चलना (calnā) means to walk." }
  "hi-4835":
    native: "I wash my face in the morning."
    bases:
      "धोता": "wash (masculine)"
      "हूँ": "am (I)"
    confusables:
      "w1": { why: "Head, not face: सिर (sir) is the head." }
      "w2": { why: "Lip, not face: होंठ (hōṇṭh) is a lip." }
  "hi-4836":
    native: "My nose is red."
    bases:
      "मेरी": "my (feminine)"
    confusables:
      "w1": { why: "Ear, not nose: कान (kān) is an ear." }
      "w2": { why: "Lip, not nose: होंठ (hōṇṭh) is a lip." }
  "hi-4837":
    native: "His ears are small."
    bases:
      "उसके": "his (oblique)"
      "छोटे": "small (plural)"
    confusables:
      "w1": { why: "Eye, not ear: आँख (ām̐kh) is an eye." }
      "w2": { why: "Hair, not ear: बाल (bāl) is hair." }
  "hi-4838":
    native: "Children close their eyes."
    bases:
      "आँखें": "eyes"
      "करते": "do (plural habitual)"
    confusables:
      "w1": { why: "Open, not close: खोलना (khōlnā) means to open." }
      "w2": { why: "To see, not close: देखना (dēkhnā) means to see." }
  "hi-4839":
    native: "He laughs from the heart."
    bases:
      "हँसता": "laugh (masculine)"
    confusables:
      "w1": { why: "To cry, not laugh: रोना (rōnā) means to cry." }
      "w2": { why: "Mind or brain, not heart: दिमाग (dimāg) is the brain or mind." }
  "hi-4840":
    native: "My feet are big."
    bases:
      "मेरे": "my (oblique)"
      "बड़े": "big (plural)"
    confusables:
      "w1": { why: "Hand, not foot: हाथ (hāth) is a hand or arm." }
      "w2": { why: "Knee, not foot: घुटना (ghuṭnā) is a knee." }
  "hi-4841":
    native: "Mother washes my hair."
    bases:
      "मेरे": "my (oblique)"
      "धोती": "washes (feminine)"
    confusables:
      "w1": { why: "Father, not mother: पिता (pitā) is a father." }
      "w2": { why: "Sister, not mother: बहन (bahan) is a sister." }
