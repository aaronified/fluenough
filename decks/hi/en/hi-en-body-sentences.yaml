native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences with the body"
license: "CC-BY-SA-4.0"
description: "Short sentences with the body words of this unit. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-1075":
    native: "My head aches."
    confusables:
      "f1": { why: "Feminine: दुखती (dukhtī) goes with a feminine subject, and सिर (sir), 'head', is masculine." }
      "w1": { why: "Sleeps, not aches: सोता (sōtā) means sleeps." }
  "hi-1076":
    native: "My back and waist hurt."
    confusables:
      "f1": { why: "Masculine or plural: मेरे (mērē) goes with a masculine or plural noun, and पीठ (pīṭh), 'back', is feminine." }
      "w1": { why: "Head, not back: सिर (sir) means head." }
  "hi-1077":
    native: "His teeth are white."
    confusables:
      "f1": { why: "Singular: उसका (uskā) is said of one thing, and the teeth are several." }
      "w1": { why: "Black, not white: काले (kālē) means black." }
  "hi-1078":
    native: "His eyes are red."
    confusables:
      "f1": { why: "Singular: आँख (āṅkh) is one eye, and the sentence has two." }
      "w1": { why: "Nose, not eyes: नाक (nāk) means nose." }
  "hi-1079":
    native: "I have an injury on my hand."
    confusables:
      "f1": { why: "Plural: हाथों (hāthōm̐) means hands, and the sentence has one hand." }
      "w1": { why: "Foot, not hand: पैर (pair) means foot." }
  "hi-1080":
    native: "Show it to the doctor."
    confusables:
      "f1": { why: "Polite: दिखाएँ (dikhāēm̐) is said to someone you respect." }
      "w1": { why: "Call, not show: बुलाओ (bulāō) means call." }
  "hi-1081":
    native: "I have a fever, but my head does not ache."
    confusables:
      "f1": { why: "Plural: हैं (haim̐) goes with a plural subject, and one fever is one thing." }
      "w1": { why: "Ill, not a fever: बीमार (bīmār) means ill." }
  "hi-1082":
    native: "His knee is swollen."
    confusables:
      "f1": { why: "Plural: सूजे (sūjē) goes with plural nouns, and the knee is one." }
      "w1": { why: "Dry, not swollen: सूखा (sūkhā) means dry." }
  "hi-1083":
    native: "Take a deep breath and lie down comfortably."
    confusables:
      "f1": { why: "Masculine: गहरा (gahrā) goes with a masculine noun, and साँस (sām̐s), 'breath', is feminine." }
      "w1": { why: "Let out, not take in: छोड़ो (chōṛō) means let go or let out." }
  "hi-1084":
    native: "Every morning I wash my face."
    confusables:
      "f1": { why: "Plural: धोते (dhōtē) goes with a plural subject, and here the speaker is one person." }
      "w1": { why: "Drink, not wash: पीता (pītā) means drinks." }
  "hi-1085":
    native: "Take this medicine every day."
    confusables:
      "f1": { why: "Polite: लीजिए (lījiē) is said to someone you respect." }
      "w1": { why: "Sell, not take: बेचो (bēcō) means sell." }
  "hi-1086":
    native: "The doctor examines the head and neck."
    confusables:
      "f1": { why: "Plural: देखते (dēkhtē) goes with a plural subject, and the doctor is one person." }
      "w1": { why: "Listen, not look: सुनता (suntā) means listens." }
