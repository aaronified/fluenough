id: "hi-en-grammar-verb-conditional"
kind: "layer"
core: "hi-grammar-verb-conditional"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs: the conditional"
description: "Every verb the course teaches, in the conditional (would, if only), for a man or a woman and for one or many. The forms are written in Devanagari for now. Not yet checked by a Hindustani speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "m-sg": "in the conditional, masculine singular (he, or I or you as a man)"
    "f-sg": "in the conditional, feminine singular (she, or I or you as a woman)"
    "m-pl": "in the conditional, masculine plural (they, we, you respectful, men or a mixed group)"
    "f-pl": "in the conditional, feminine plural (women)"
rules:
  "hi-rule-conditional-masc":
    name: "-ता (-tā), -ते (-tē): would, masculine"
    explanation: "The conditional is the habit form alone, with no verb to be after it: for a man the stem takes {1} for one and {2} for many. {3}, to do, gives {4} and {5}; {6}, to go, gives {7}."
  "hi-rule-conditional-fem":
    name: "-ती (-tī), -तीं (-tīm̐): would, feminine"
    explanation: "For a woman the stem takes {1} for one and {2} for many. {3}, to do, gives {4} and {5}; {6}, to go, gives {7}. The plural is also written with {1}."
