schema: 1
id: "hi-en-spelling"
kind: "layer"
core: "hi-spelling"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hindi spellings, old and new"
license: "CC0-1.0"
description: "Spellings you will meet in print, and the standard of the Central Hindi Directorate that settles them. Recognition only. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0620":
    native: "Hindi; standard हिंदी (hindī)"
    notes:
      "n1": "The standard of the Central Hindi Directorate writes the dot (anusvar) for a nasal before a consonant of its own row: हिंदी (hindī), not हिन्दी (hindī). Both are everywhere."
  "hi-0621":
    native: "relation; standard संबंध (sambandh)"
    notes:
      "n1": "The same rule: the dot in place of the half nasal letter."
  "hi-0622":
    native: "scholar; pandit; standard पंडित (paṇḍit)"
    notes:
      "n1": "The same rule, for ण (ṇa) before ड (ḍa)."
  "hi-0623":
    native: "to laugh; standard हँसना (ham̐sanā)"
    notes:
      "n1": "The moon and dot (chandrabindu) marks a nasal vowel: हँसना (ham̐sanā). The plain dot is for a nasal consonant. Above the line, where there is no room, the dot stands for both: मैं (maim̐), नहीं (nahīm̐)."
  "hi-0624":
    native: "went; standard गए (gaē)"
    notes:
      "n1": "Where the ending is a vowel, the standard writes the vowel letter: गए (gaē), not गये (gayē)."
  "hi-0625":
    native: "new; standard नई (naī)"
    notes:
      "n1": "The same rule: नई (naī), not नयी (nayī)."
  "hi-0626":
    native: "for; standard लिए (liē)"
    notes:
      "n1": "The same rule: के लिए (kē liē)."
  "hi-0627":
    native: "is needed; standard चाहिए (cāhiē)"
    notes:
      "n1": "The same rule: चाहिए (cāhiē)."
  "hi-0628":
    native: "of course; also ज़रूर (zarūr)"
    notes:
      "n1": "The dot below (nukta) marks the z of words from Persian and Arabic. Many writers leave it out, and the standard allows that where no other word could be confused; dictionaries and careful print keep it: ज़रूर (zarūr)."
  "hi-0629":
    native: "phone; also फ़ोन (fōn)"
    notes:
      "n1": "The nukta under फ़ (fa) marks an f, in words from English and Persian. Often left out in print."
  "hi-0630":
    native: "shop; standard दुकान (dukān)"
    notes:
      "n1": "An older spelling with a long ऊ (ū); today दुकान (dukān)."
