  notes: "The ordinal agrees with its noun like an adjective: पहला दिन (pahlā din, the first day, masculine), पहली मंज़िल (pahlī manzil, the first floor, feminine), and before a postposition or a plural पहले से (pahle se, from the first). पहला (pahlā) and दूसरा (dūsrā) do not come from their number: एक (ek) and दो (do) give them only in the sense of one and two. From तीसरा (tīsrā, third) on, the ordinal is the number changed by an ending, so तीन (tīn) gives तीसरा (tīsrā) and दस (das) gives दसवाँ (dasvāṃ)."
