cards:
  "hi-5123":
    native: "This room is empty."
    confusables:
      "w1": { why: "Full, not empty: भरा (bharā) means full." }
      "w2": { why: "Incomplete, not empty: अधूरा (adhūrā) means incomplete; unfinished." }
  "hi-5124":
    native: "The way is straight; it is not crooked."
    confusables:
      "w1": { why: "Slanted, not straight: तिरछा (tirchā) means slanted." }
      "w2": { why: "Square, not straight: चौकोर (caukōr) means square." }
  "hi-5125":
    native: "The table is full of fruit."
    confusables:
      "w1": { why: "Empty, not full: खाली (khālī) means empty." }
      "w2": { why: "Bland, not full: फीका (phīkā) means bland; pale." }
  "hi-5126":
    native: "His work is incomplete."
    confusables:
      "w1": { why: "Interesting, not incomplete: दिलचस्प (dilcasp) means interesting." }
      "w2": { why: "Empty, not incomplete: खाली (khālī) means empty." }
  "hi-5127":
    native: "This book is very interesting."
    confusables:
      "w1": { why: "Boring, not interesting: उबाऊ (ubāū) means boring." }
      "w2": { why: "Unique, not interesting: अनोखा (anōkhā) means unique; unusual." }
  "hi-5128":
    native: "The colour is shiny and golden."
    confusables:
      "w1": { why: "Ugly, not shiny: बदसूरत (badsūrat) means ugly." }
      "w2": { why: "Bland, not golden: फीका (phīkā) means bland; pale." }
  "hi-5129":
    native: "The sweet is not bland; it is sweet."
    confusables:
      "w1": { why: "Spicy, not sweet: तीखा (tīkhā) means spicy." }
      "w2": { why: "Cold, not sweet: ठंडा (ṭhaṇḍā) means cold." }
  "hi-5130":
    native: "He is a kind man."
    confusables:
      "w1": { why: "True, not kind: सच्चा (saccā) means true; honest." }
      "w2": { why: "False, not kind: झूठा (jhūṭhā) means false." }
  "hi-5131":
    native: "What he said was false."
    confusables:
      "w1": { why: "Good, not false: भला (bhalā) means good; kind." }
      "w2": { why: "Calm, not false: शांत (śānt) means calm; peaceful." }
  "hi-5132":
    native: "This table is not round; it is square."
    confusables:
      "w1": { why: "Smooth, not round: चिकना (ciknā) means smooth; oily; slippery." }
      "w2": { why: "Straight, not round: सीधा (sīdhā) means straight; upright." }
  "hi-5133":
    native: "His voice is strong."
    confusables:
      "w1": { why: "Hard, not strong: कठोर (kaṭhōr) means hard; harsh; strict." }
      "w2": { why: "Calm, not strong: शांत (śānt) means calm; peaceful." }
  "hi-5134":
    native: "The colours are different."
    confusables:
      "w1": { why: "Equal, not different: समान (samān) means equal; same; alike." }
      "w2": { why: "Unique, not different: अनोखा (anōkhā) means unique; unusual." }
  "hi-5135":
    native: "The child's eyes are lovely."
    bases:
      "आँखें": "eyes"
    confusables:
      "w1": { why: "Dear, not lovely: प्रिय (priy) means dear; beloved." }
      "w2": { why: "Frightening, not lovely: डरावना (ḍarāvnā) means frightening; scary." }
  "hi-5136":
    native: "This matter is strange."
    confusables:
      "w1": { why: "Unique, not strange: अनोखा (anōkhā) means unique." }
      "w2": { why: "Calm, not strange: शांत (śānt) means calm." }
