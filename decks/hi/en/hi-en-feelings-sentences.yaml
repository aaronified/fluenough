cards:
  "hi-5302":
    native: "I am worried about her."
    bases:
      "मुझे": "to me"
      "उसकी": "her; his"
    confusables:
      "w1": { why: "Anger, not worry: गुस्सा (gussā) means anger." }
      "w2": { why: "Hope, not worry: आशा (āśā) means hope." }
  "hi-5303":
    native: "He is very happy today."
    confusables:
      "w1": { why: "Sad, not happy: उदास (udās) means sad; gloomy." }
      "w2": { why: "Angry, not happy: नाराज़ (nārāz) means angry; upset." }
  "hi-5304":
    native: "On hearing what he said, I was surprised."
    bases:
      "उसकी": "his; her"
      "सुनकर": "on hearing"
      "मुझे": "to me"
      "हुई": "was (happened)"
    confusables:
      "w1": { why: "Kindness or pity, not surprise: दया (dayā) means kindness; pity." }
      "w2": { why: "Shame, not surprise: शर्म (śarm) means shame; embarrassment." }
  "hi-5305":
    native: "His displeasure is understandable."
    bases:
      "उसकी": "his; her"
      "समझ": "understanding"
      "आती": "comes"
    confusables:
      "w1": { why: "Angry, not displeasure: नाराज़ (nārāz) means angry; upset." }
      "w2": { why: "Disappointment, not displeasure: निराशा (nirāśā) means disappointment; despair." }
  "hi-5306":
    native: "I trust your help."
    bases:
      "मुझे": "to me"
      "आपकी": "your (polite)"
      "मदद": "help"
    confusables:
      "w1": { why: "Belief, not trust: यकीन (yakīn) means belief; certainty." }
      "w2": { why: "Doubt, not trust: शक (śak) means doubt; suspicion." }
  "hi-5307":
    native: "He always speaks with a smile."
    bases:
      "हमेशा": "always"
      "बोलता": "speaks"
    confusables:
      "w1": { why: "Laughter, not smile: हँसी (ham̐sī) means laughter." }
      "w2": { why: "Shame, not smile: शर्म (śarm) means shame; embarrassment." }
  "hi-5308":
    native: "The children get scared when they are alone at home."
    bases:
      "अकेले": "alone (plural)"
      "डरते": "get scared"
    confusables:
      "w1": { why: "To panic, not be scared: घबराना (ghabrānā) means to panic; to be flustered." }
      "w2": { why: "To be annoyed, not scared: चिढ़ना (ciṛhnā) means to be annoyed." }
  "hi-5309":
    native: "Do not keep anger in your heart."
    bases:
      "मत": "do not"
      "रखो": "keep"
    confusables:
      "w1": { why: "Pride, not anger: गर्व (garv) means pride." }
      "w2": { why: "Peace of mind, not anger: सुकून (sukūn) means peace of mind; rest." }
  "hi-5310":
    native: "We are proud of your success."
    bases:
      "तुम्हारी": "your (informal)"
      "सफलता": "success"
      "करते": "do (habitually)"
    confusables:
      "w1": { why: "Kindness, not pride: दया (dayā) means kindness; pity." }
      "w2": { why: "Enthusiasm, not pride: उत्साह (utsāh) means enthusiasm; eagerness." }
  "hi-5311":
    native: "I feel regret in my heart."
    bases:
      "मेरे": "my (oblique)"
      "दिल": "heart"
    confusables:
      "w1": { why: "Disappointment, not regret: निराशा (nirāśā) means disappointment; despair." }
      "w2": { why: "Ashamed, not regretful: शर्मिंदा (śarmindā) means ashamed; embarrassed." }
  "hi-5312":
    native: "Because of the rain, everyone is sad."
    bases:
      "बारिश": "rain"
      "कारण": "reason; cause"
    confusables:
      "w1": { why: "Worried or troubled, not sad: परेशान (parēśān) means worried; troubled." }
      "w2": { why: "Alone, not sad: अकेला (akēlā) means alone; lonely." }
  "hi-5313":
    native: "After answering, he took a sigh of relief."
    bases:
      "उसने": "he (agent)"
      "जवाब": "answer"
      "देकर": "after giving"
      "साँस": "breath; sigh"
      "ली": "took"
    confusables:
      "w1": { why: "Peace of mind, not relief: सुकून (sukūn) means peace of mind; rest." }
      "w2": { why: "Feeling, not relief: भावना (bhāvnā) means feeling; emotion." }
