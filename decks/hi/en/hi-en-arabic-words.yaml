kind: "layer"
core: "hi-arabic-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Arabic words: roots and plurals"
license: "CC-BY-SA-4.0"
description: "Words that come from Arabic and are used in formal Hindustani and Urdu: one root's family, and the plurals of nouns. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "hi-2815":
    native: "knowledge; learning"
    notes:
      "n1": "Knowledge, from the Arabic root इल्म (ilm) with the sense of knowing. The family of the root is on the card आलिम (ālim)."
    examples:
      "इल्म बड़ी दौलत है।": { "native": "Knowledge is a great wealth.", "bases": {} }
      "इल्म हासिल करो।": { "native": "Acquire learning.", "bases": {"हासिल": "acquired"} }
  "hi-2816":
    native: "scholar; learned person"
    notes:
      "n1": "A person of learning, who knows much."
    examples:
      "वह बहुत बड़ा आलिम है।": { "native": "He is a very great scholar.", "bases": {} }
      "आलिम लोगों की राय सुनो।": { "native": "Hear the opinion of learned people.", "bases": {} }
  "hi-2817":
    native: "known; to be known"
    notes:
      "n1": "Known, or known to someone. The phrase मालूम है (mālūm hai) means one knows."
    examples:
      "मुझे यह मालूम नहीं।": { "native": "I do not know this.", "bases": {} }
      "क्या तुम्हें मालूम है?": { "native": "Do you know?", "bases": {} }
  "hi-2818":
    native: "education; teaching"
    notes:
      "n1": "Schooling and teaching, given in a formal way."
    examples:
      "बच्चों की तालीम ज़रूरी है।": { "native": "The education of children is necessary.", "bases": {"ज़रूरी": "necessary"} }
      "तालीम के लिए स्कूल जाओ।": { "native": "Go to school for education.", "bases": {"लिए": "for"} }
  "hi-2819":
    native: "teacher (formal)"
    notes:
      "n1": "A teacher, a formal word, used of a person who teaches."
    examples:
      "मुअल्लिम ने सबक़ समझाया।": { "native": "The teacher explained the lesson.", "bases": {"ने": "by", "सबक़": "lesson"} }
      "हमारे मुअल्लिम बहुत नेक हैं।": { "native": "Our teacher is very good.", "bases": {"नेक": "good"} }
  "hi-2820":
    native: "information; facts"
    notes:
      "n1": "Facts and details that are known about a thing."
    examples:
      "इस बारे में मालूमात दो।": { "native": "Give information about this.", "bases": {"बारे": "about"} }
      "ज़रूरी मालूमात लिख लो।": { "native": "Write down the necessary facts.", "bases": {"ज़रूरी": "necessary"} }
  "hi-2821":
    native: "papers; documents"
    notes:
      "n1": "Papers and documents, the plural of कागज़ (kāgaz) in the Arabic way."
    examples:
      "सारे कागज़ात साथ रखो।": { "native": "Keep all the papers with you.", "bases": {} }
      "कागज़ात कहाँ हैं?": { "native": "Where are the papers?", "bases": {} }
  "hi-2822":
    native: "problem; matter"
    notes:
      "n1": "A question or a problem that needs to be settled."
    examples:
      "यह बड़ा मसला है।": { "native": "This is a big problem.", "bases": {} }
      "मसला हल करो।": { "native": "Solve the problem.", "bases": {"हल": "solution; with the verb to do, to solve"} }
  "hi-2823":
    native: "school (Islamic or formal)"
    notes:
      "n1": "A school, especially one in which the Arabic and religious teaching is given."
    examples:
      "वह मदरसा में पढ़ता है।": { "native": "He studies at the madrasa.", "bases": {} }
      "मदरसा कहाँ है?": { "native": "Where is the madrasa?", "bases": {} }
  "hi-2824":
    native: "person; individual"
    notes:
      "n1": "A person, a formal word for an individual."
    examples:
      "यह शख़्स बहुत अच्छा है।": { "native": "This person is very good.", "bases": {} }
      "हर शख़्स को इज़्ज़त मिलनी चाहिए।": { "native": "Every person should get respect.", "bases": {"हर": "every; each"} }
  "hi-2825":
    native: "time"
    notes:
      "n1": "The time of day, or a time in one's life, or the time that is available."
    examples:
      "अभी वक़्त है।": { "native": "There is time now.", "bases": {} }
      "वक़्त बदल गया।": { "native": "The times have changed.", "bases": {} }
  "hi-2826":
    native: "special; particular"
    notes:
      "n1": "Special, or of a particular kind. The word is often used as ख़ास तौर पर (k͟hās taur par), especially."
    examples:
      "यह मेरे लिए ख़ास दिन है।": { "native": "This is a special day for me.", "bases": {"लिए": "for"} }
      "उसने ख़ास बात कही।": { "native": "He said something special.", "bases": {} }
  "hi-2827":
    native: "government; rule"
    notes:
      "n1": "A government or the rule of a country, a more formal word than सरकार (sarkār)."
    examples:
      "हुकूमत ने नया कानून बनाया।": { "native": "The government made a new law.", "bases": {"ने": "by"} }
      "हुकूमत की ज़िम्मेदारी है।": { "native": "It is the government's responsibility.", "bases": {} }
  "hi-2828":
    native: "country; nation"
    notes:
      "n1": "A country, a nation, a formal word for a land."
    examples:
      "हमारा मुल्क बड़ा है।": { "native": "Our country is big.", "bases": {} }
      "मुल्क की तरक्की चाहिए।": { "native": "We want the progress of the country.", "bases": {} }
  "hi-2829":
    native: "tongue; language"
    notes:
      "n1": "A language, or the tongue in the mouth. It is a formal word for language."
    examples:
      "यह ज़बान मुझे आती है।": { "native": "I know this language.", "bases": {} }
      "ज़बान बोलने में मीठी हो।": { "native": "Let your speech be sweet.", "bases": {} }
