tags: ["unreviewed"]
cards:
  "hi-0853":
    native: "I walk slowly every morning."
    confusables: { "w1": { why: "Runs, not walks: दौड़ता (dauṛtā) means runs." }, "f1": { why: "Feminine: चलती (caltī) is said by a woman; the subject here is a man, so चलता (caltā)." } }
    bases: { "चलता": "to walk" }
  "hi-0854":
    native: "He always speaks correctly."
    confusables: { "w1": { why: "Wrong, not right: गलत (galat) means wrong." }, "f1": { why: "Feminine: बोलती (bōltī) is said of a woman; the subject here is a man, so बोलता (bōltā)." } }
    bases: { "बोलता": "to speak" }
  "hi-0855":
    native: "Do you sometimes watch films?"
    confusables: { "w1": { why: "Listen, not watch: सुनते (suntē) means listen." }, "f1": { why: "Feminine: देखती (dēkhtī) needs a woman as subject; the subject here is तुम (tum), you, so देखते (dēkhtē)." } }
    bases: { "फ़िल्म": "film", "देखते": "to see" }
  "hi-0856":
    native: "My friend used to live here before."
    confusables: { "w1": { why: "Ahead, not before: आगे (āgē) means ahead." }, "f1": { why: "Feminine: रहती (rahtī) is for a woman; the subject here is a man, my friend, so रहता (rahtā)." } }
    bases: { "रहता": "to stay, to live", "था": "to be, to become" }
  "hi-0857":
    native: "The rain has just stopped."
    confusables: { "w1": { why: "Started, not stopped: शुरू (śurū) means start." }, "f1": { why: "Masculine: रुका (rukā) is for a masculine subject; rain is feminine, so the form is रुकी (rukī)." } }
    bases: { "बारिश": "rain", "रुकी": "to stop" }
  "hi-0858":
    native: "They both meet up together every day."
    confusables: { "w1": { why: "Apart, not together: अलग (alag) means apart." }, "f1": { why: "Feminine plural: मिलतीं (miltīm̐) is for two women; the subject here is वे दोनों (vē dōnōm̐), so मिलते (miltē)." } }
    bases: { "दोनों": "both", "मिलते": "to meet, to get" }
  "hi-0859":
    native: "He really did a very good job."
    confusables: { "w1": { why: "Bad, not good: बुरा (burā) means bad." }, "f1": { why: "Feminine: अच्छी (acchī) would agree with a feminine noun; काम (kām) is masculine here." } }
    bases: { "बहुत": "very, much", "अच्छा": "good", "किया": "to do" }
  "hi-0860":
    native: "Before, I used to do it like this."
    confusables: { "w1": { why: "Anyway, not like this: वैसे (vaisē) means anyway." }, "f1": { why: "Feminine: करती (kartī) is for a woman; the subject here is a man, so करता (kartā)." } }
    bases: { "करता": "to do", "था": "to be, to become" }
