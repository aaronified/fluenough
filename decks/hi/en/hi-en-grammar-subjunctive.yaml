  notes: "The subjunctive is used after अगर (agar) (if), ताकि (tāki) (so that), शायद (śāyad) (perhaps), and for wishes and suggestions. The मैं (maim̐) form is a long vowel with a nasal, as जाऊँ (jāūm̐) and पढ़ूँ (paṛhūm̐). The तू (tū) and वह (vah) form ends in a vowel sign, as जाए (jāē) and पढ़े (paṛhē). The तुम (tum) form is the imperative: जाओ (jāō). The हम (ham), आप (āp) and वे (vē) form ends in a nasal, as जाएँ (jāēm̐) and पढ़ें (paṛhēm̐). The verbs करना (karnā), देना (dēnā), लेना (lēnā), होना (hōnā), जाना (jānā) and आना (ānā) are irregular in the first forms."
