# Layer for hi-proverbs-1: each kahavat's plain English meaning, and a word-for-word literal note.
schema: 1
id: "hi-en-proverbs-1"
kind: "layer"
core: "hi-proverbs-1"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs: kahavat 1"
description: "Seventeen Hindustani proverbs from en.wiktionary, each with its plain English meaning and a literal note. Not yet checked by a Hindi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "hi-4200":
    native: "As you sow, so shall you reap."
    notes:
      "literal": "Word for word, 'as the deed, so the filling'; said that what one does comes back to one."
    bases:
      "जैसी": { meaning: "as, like" }
      "करनी": { meaning: "deed, action" }
      "वैसी": { meaning: "so, like that" }
      "भरनी": { meaning: "filling, repaying" }
  "hi-4201":
    native: "Unable to dance, the dancer blames the uneven courtyard; a bad workman blames his tools."
    notes:
      "literal": "Word for word, 'does not know the dance, the courtyard is crooked'; said of someone who blames the tools for their own poor work."
    bases:
      "नाच": { meaning: "dance" }
      "न": { meaning: "not" }
      "जाने": { meaning: "knows" }
      "आँगन": { meaning: "courtyard" }
      "टेढ़ा": { meaning: "crooked" }
  "hi-4202":
    native: "The pot calls the kettle black."
    notes:
      "literal": "Literally 'the thief scolds the chief policeman'."
    bases:
      "उल्टा": { meaning: "upside down, reversed" }
      "चोर": { meaning: "thief" }
      "कोतवाल": { meaning: "chief policeman" }
      "को": { meaning: "(to, object marker)" }
      "डांटे": { meaning: "scolds" }
  "hi-4203":
    native: "A half-empty pot sloshes loudly; people who know little boast or show off."
    notes:
      "literal": "Word for word, 'a half-filled pitcher goes sloshing'; said of someone who knows little and talks loudly."
    bases:
      "अधजल": { meaning: "half-full" }
      "गगरी": { meaning: "pitcher" }
      "छलकत": { meaning: "sloshing" }
      "जाय": { meaning: "goes" }
  "hi-4204":
    native: "A grand shop, bland food; you can't judge a book by its cover."
    notes:
      "literal": "Word for word, 'a grand shop, bland food'; said that looks can mislead."
    bases:
      "ऊँची": { meaning: "grand, high" }
      "दुकान": { meaning: "shop" }
      "फीका": { meaning: "bland" }
      "पकवान": { meaning: "dish, food" }
  "hi-4205":
    native: "Facts speak for themselves."
    notes:
      "literal": "Word for word, 'for a bangle on the hand, what need of a mirror'; said when a fact is plain to see."
    bases:
      "हाथ": { meaning: "hand" }
      "कंगन": { meaning: "bangle" }
      "को": { meaning: "(for)" }
      "आरसी": { meaning: "mirror" }
      "क्या": { meaning: "what" }
  "hi-4206":
    native: "If there is life, there is the world."
    notes:
      "literal": "Word for word, 'life is, then the world is'; said that while one is alive, there is hope."
    bases:
      "जान": { meaning: "life" }
      "है": { meaning: "is" }
      "तो": { meaning: "then" }
      "जहान": { meaning: "world" }
  "hi-4207":
    native: "Where there is a will, there is a way."
    notes:
      "literal": "Word for word, 'where wish, there way'; said that a determined person finds a path."
    bases:
      "जहाँ": { meaning: "where" }
      "चाह": { meaning: "wish, desire" }
      "वहाँ": { meaning: "there" }
      "राह": { meaning: "way" }
  "hi-4208":
    native: "The cobbler's children go barefoot."
    notes:
      "literal": "Word for word, 'darkness under the lamp'; said that people miss what is closest to them."
    bases:
      "चिराग़": { meaning: "lamp" }
      "तले": { meaning: "under" }
      "अँधेरा": { meaning: "darkness" }
  "hi-4209":
    native: "Someone who knows the household's secrets can bring down Lanka."
    notes:
      "literal": "Word for word, 'the house's insider can bring down Lanka'; said that someone who knows the family's secrets can do great harm."
    bases:
      "घर": { meaning: "home, family" }
      "का": { meaning: "of" }
      "भेदी": { meaning: "insider" }
      "लंका": { meaning: "Lanka" }
      "ढाये": { meaning: "brings down" }
  "hi-4210":
    native: "The grass is always greener on the other side."
    notes:
      "literal": "From far away, the drums sound better."
    bases:
      "दूर": { meaning: "far" }
      "के": { meaning: "of" }
      "ढोल": { meaning: "drum" }
      "सुहावने": { meaning: "pleasant" }
      "लगते": { meaning: "seem" }
      "हैं": { meaning: "are" }
  "hi-4211":
    native: "Cast pearls before swine."
    notes:
      "literal": "Literally, 'what does a monkey know about the taste of ginger?'"
    bases:
      "बंदर": { meaning: "monkey" }
      "क्या": { meaning: "what" }
      "जाने": { meaning: "knows" }
      "अदरक": { meaning: "ginger" }
      "का": { meaning: "of" }
      "स्वाद": { meaning: "taste" }
  "hi-4212":
    native: "Homemade chicken is no better than dal; what is always at hand is not valued."
    notes:
      "literal": "Word for word, 'the home's hen is equal to dal'; said that what is always at hand is not valued."
    bases:
      "घर": { meaning: "home" }
      "की": { meaning: "of" }
      "मुर्ग़ी": { meaning: "hen" }
      "दाल": { meaning: "dal" }
      "बराबर": { meaning: "equal" }
  "hi-4213":
    native: "All is well that ends well."
    notes:
      "literal": "Word for word, 'end good, then all good'; said that the outcome decides how a matter is judged."
    bases:
      "अंत": { meaning: "end" }
      "भला": { meaning: "good" }
      "तो": { meaning: "then" }
      "सब": { meaning: "all" }
  "hi-4214":
    native: "The fruit of patience is sweet."
    notes:
      "literal": "Word for word, 'patience's fruit is sweet'; said that waiting patiently brings a good result."
    bases:
      "सब्र": { meaning: "patience" }
      "का": { meaning: "of" }
      "फल": { meaning: "fruit" }
      "मीठा": { meaning: "sweet" }
      "होता": { meaning: "is" }
      "है": { meaning: "is" }
  "hi-4215":
    native: "A single lentil cannot break the pot; big work is hard to do alone."
    notes:
      "literal": "Word for word, 'alone the chickpea does not break the pot'; said that big tasks need many hands."
    bases:
      "अकेला": { meaning: "alone" }
      "चना": { meaning: "chickpea" }
      "भाँड़": { meaning: "clay pot" }
      "नहीं": { meaning: "not" }
      "फोड़ता": { meaning: "breaks" }
  "hi-4216":
    native: "It takes two to make a quarrel."
    notes:
      "literal": "Literally, 'one cannot clap with one hand'."
    bases:
      "एक": { meaning: "one" }
      "हाथ": { meaning: "hand" }
      "से": { meaning: "with" }
      "ताली": { meaning: "clap" }
      "नहीं": { meaning: "not" }
      "बजती": { meaning: "rings" }
