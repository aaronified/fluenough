schema: 1
id: "hi-en-weddings"
kind: "layer"
core: "hi-weddings"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Weddings"
license: "CC-BY-SA-4.0"
description: "Weddings and the rites around them: the groom and the bride, the procession and the wedding pavilion, the blessings and the gifts. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "hi-2505":
    native: "groom"
    notes:
      "n1": "The man who is getting married. The bride is दुल्हन (dulhan)."
    examples:
      "दूल्हा घोड़ी पर आया।": { "native": "The groom came on a horse.", "bases": {"घोड़ी": "mare"} }
      "दूल्हा बहुत सुंदर लग रहा है।": { "native": "The groom looks very handsome.", "bases": {} }
  "hi-2506":
    native: "bride"
    notes:
      "n1": "The woman who is getting married."
    examples:
      "दुल्हन ने लाल जोड़ा पहना।": { "native": "The bride wore a red outfit.", "bases": {"ने": "by", "जोड़ा": "outfit"} }
      "दुल्हन की विदा कल होगी।": { "native": "The bride's farewell will be tomorrow.", "bases": {} }
  "hi-2507":
    native: "wedding procession"
    notes:
      "n1": "The group of the groom's family and friends who go to the bride's home for the wedding."
    examples:
      "बारात दुल्हन के घर पहुँची।": { "native": "The procession reached the bride's house.", "bases": {} }
      "बारात में नाच हो रहा है।": { "native": "There is dancing in the procession.", "bases": {} }
  "hi-2508":
    native: "wedding pavilion"
    notes:
      "n1": "The canopy under which the wedding rites are performed."
    examples:
      "मंडप फूलों से सजा है।": { "native": "The pavilion is decorated with flowers.", "bases": {} }
      "मंडप के नीचे फेरे होंगे।": { "native": "The circling of the fire will be under the pavilion.", "bases": {} }
  "hi-2509":
    native: "circling; round"
    notes:
      "n1": "One round around the sacred fire in a wedding. In the plural, फेरे (phērē), the rounds of the wedding."
    examples:
      "दूल्हा और दुल्हन ने फेरे लिए।": { "native": "The groom and the bride took the rounds.", "bases": {"ने": "by", "फेरे": "round"} }
      "फेरा पूरा हो गया।": { "native": "The round is complete.", "bases": {} }
  "hi-2510":
    native: "marriage (formal)"
    notes:
      "n1": "The formal word for a marriage. The everyday word is शादी (śādī)."
    examples:
      "विवाह का दिन पक्का हुआ।": { "native": "The day of the marriage was fixed.", "bases": {} }
      "विवाह के लिए सब आए हैं।": { "native": "Everyone has come for the marriage.", "bases": {"लिए": "for"} }
  "hi-2511":
    native: "invitation"
    notes:
      "n1": "A card or message asking people to come to an event."
    examples:
      "शादी का निमंत्रण मिला।": { "native": "I got the wedding invitation.", "bases": {"निमंत्रण": "invitation"} }
      "निमंत्रण पत्र छपवाओ।": { "native": "Print the invitation card.", "bases": {"पत्र": "letter", "छपवाओ": "to get printed"} }
  "hi-2512":
    native: "girl; daughter (formal)"
    notes:
      "n1": "A girl or a young unmarried woman, a formal word."
    examples:
      "कन्या की विदाई हो रही है।": { "native": "The bride is being sent off.", "bases": {"विदाई": "sending off"} }
      "वह एक सुंदर कन्या है।": { "native": "She is a beautiful girl.", "bases": {} }
  "hi-2513":
    native: "groom (formal)"
    notes:
      "n1": "The man who is to be married, a formal word for दूल्हा (dūlhā)."
    examples:
      "वर पक्ष के लोग आए हैं।": { "native": "The groom's side has come.", "bases": {} }
      "वर और वधू को आशीर्वाद दो।": { "native": "Bless the groom and the bride.", "bases": {} }
  "hi-2514":
    native: "bride (formal)"
    notes:
      "n1": "The woman who is to be married, a formal word for दुल्हन (dulhan)."
    examples:
      "वधू सुंदर लग रही है।": { "native": "The bride looks beautiful.", "bases": {} }
      "वधू का स्वागत करो।": { "native": "Welcome the bride.", "bases": {"स्वागत": "welcome"} }
  "hi-2515":
    native: "priest; learned man"
    notes:
      "n1": "A Brahmin priest who performs the rites of a wedding or a puja."
    examples:
      "पंडित जी मंत्र पढ़ रहे हैं।": { "native": "The priest is reciting the mantras.", "bases": {"मंत्र": "mantra"} }
      "पंडित को बुलाओ।": { "native": "Call the priest.", "bases": {} }
  "hi-2516":
    native: "henna"
    notes:
      "n1": "A paste of henna leaves, put on the hands and feet of the bride before a wedding."
    examples:
      "दुल्हन के हाथों पर मेहंदी लगी है।": { "native": "Henna is on the bride's hands.", "bases": {"मेहंदी": "henna"} }
      "मेहंदी का रंग गहरा है।": { "native": "The colour of the henna is deep.", "bases": {} }
  "hi-2517":
    native: "palanquin (for the bride)"
    notes:
      "n1": "A covered seat carried on poles, used in older times to take the bride to her husband's home."
    examples:
      "डोली सजी है।": { "native": "The palanquin is decorated.", "bases": {} }
      "डोली में दुल्हन बैठी।": { "native": "The bride sat in the palanquin.", "bases": {} }
  "hi-2518":
    native: "farewell (of the bride)"
    notes:
      "n1": "The farewell of a bride from her parents' home to her husband's home."
    examples:
      "विदा के समय सब रो रहे थे।": { "native": "At the time of the farewell everyone was crying.", "bases": {} }
      "विदा करते समय आँसू आ गए।": { "native": "Tears came when we said farewell.", "bases": {"आँसू": "tear"} }
  "hi-2519":
    native: "gift"
    notes:
      "n1": "A present given on a happy occasion, such as a wedding or a birthday."
    examples:
      "दुल्हन को उपहार दिए गए।": { "native": "Gifts were given to the bride.", "bases": {"उपहार": "gift"} }
      "यह उपहार बहुत सुंदर है।": { "native": "This gift is very beautiful.", "bases": {} }
  "hi-2520":
    native: "present; gift (everyday word)"
    notes:
      "n1": "The everyday word for a gift, used beside उपहार (uphār)."
    examples:
      "यह तोहफ़ा तुम्हारे लिए है।": { "native": "This gift is for you.", "bases": {"लिए": "for"} }
      "तोहफ़ा खोलो।": { "native": "Open the present.", "bases": {} }
  "hi-2521":
    native: "ritual; custom"
    notes:
      "n1": "A custom or a rite that is done on a special occasion."
    examples:
      "शादी की हर रस्म धूमधाम से हुई।": { "native": "Every ritual of the wedding was done with great pomp.", "bases": {"हर": "every; each", "रस्म": "ritual", "धूमधाम": "pomp"} }
      "यह पुरानी रस्म है।": { "native": "This is an old custom.", "bases": {} }
  "hi-2522":
    native: "shehnai (wind instrument)"
    notes:
      "n1": "A wind instrument, played at weddings and festivals."
    examples:
      "शहनाई की धुन सुनाई दी।": { "native": "The tune of the shehnai was heard.", "bases": {"धुन": "tune", "सुनाई": "heard"} }
      "शहनाई बजाने वाले आए हैं।": { "native": "The shehnai players have come.", "bases": {"बजाने": "to play", "वाले": "one who"} }
  "hi-2523":
    native: "relationship; match; tie"
    notes:
      "n1": "A bond between people, as of blood or of marriage."
    examples:
      "दोनों परिवारों में रिश्ता तय हुआ।": { "native": "A match was fixed between the two families.", "bases": {"दोनों": "both", "तय": "fixed"} }
      "यह रिश्ता पक्का है।": { "native": "This bond is firm.", "bases": {} }
  "hi-2524":
    native: "engagement"
    notes:
      "n1": "The formal promise of marriage between two families, before the wedding."
    examples:
      "कल हमारी सगाई है।": { "native": "Our engagement is tomorrow.", "bases": {} }
      "सगाई में सब नाचे।": { "native": "Everyone danced at the engagement.", "bases": {} }
  "hi-2525":
    native: "blessing"
    notes:
      "n1": "Good wishes and prayers said for another person's well-being."
    examples:
      "बड़ों का आशीर्वाद लो।": { "native": "Take the blessings of your elders.", "bases": {"आशीर्वाद": "blessing"} }
      "सबको आशीर्वाद दो।": { "native": "Give blessings to everyone.", "bases": {"आशीर्वाद": "blessing"} }
  "hi-2526":
    native: "custom; tradition"
    notes:
      "n1": "A practice that people have kept for a long time in a society."
    examples:
      "यह प्रथा सदियों पुरानी है।": { "native": "This custom is centuries old.", "bases": {} }
      "नई प्रथा शुरू करो।": { "native": "Start a new custom.", "bases": {"शुरू": "start"} }
  "hi-2527":
    native: "ceremony; function"
    notes:
      "n1": "A formal event held for a special occasion."
    examples:
      "शादी का समारोह बड़ा था।": { "native": "The wedding ceremony was big.", "bases": {} }
      "समारोह शाम को होगा।": { "native": "The ceremony will be in the evening.", "bases": {} }
