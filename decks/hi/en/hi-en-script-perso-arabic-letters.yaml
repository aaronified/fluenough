id: "hi-en-script-perso-arabic-letters"
kind: "layer"
core: "hi-script-perso-arabic-letters"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Perso-Arabic letters"
license: "CC-BY-SA-4.0"
description: "The letters of the Perso-Arabic script in Urdu's alphabet order, alif to baṛī ye: each letter's name and sound, its Devanagari partner, how it joins, and one common word. Letters that share a sound are read alike, and the ones that never join forward are marked."
tags: ["unreviewed"]
cards:
  "hi-0646":
    native: "alif: ā (ā)"
    notes:
      "n1": "Devanagari आ (ā) for the long a; at the start of a word it carries a vowel, as in اب (ab, now). It joins only to the letter before it, never to the next."
  "hi-0647":
    native: "be: b (ba)"
    notes:
      "n1": "Devanagari ब (ba): a plain 'b' as in 'bat', with one dot below the letter. It takes all four forms, as in بات (bāt, talk)."
  "hi-0648":
    native: "pe: p (pa)"
    notes:
      "n1": "Devanagari प (pa): a plain 'p' with no puff of breath, as in 'spin'. It is ب (ba) with three dots below: پانی (pānī, water)."
  "hi-0649":
    native: "te: t (ta)"
    notes:
      "n1": "Devanagari त (ta): a 't' with the tongue at the back of the teeth, not curled back. It shares its sound with ط (ta), so read them alike; the two dots above tell it from ث (sa): تم (tum, you)."
  "hi-0650":
    native: "ṭe: t, curled back (ṭa)"
    notes:
      "n1": "Devanagari ट (ṭa): the tongue curls back, as in the consonants deck, unlike the dental ت (ta). It is read apart from ت: ٹھیک (ṭhīk, right, OK)."
  "hi-0651":
    native: "se: s (sa)"
    notes:
      "n1": "Devanagari स (sa): the 's' of 'sun'. Like س (sa) and ص (sa) it is read 'sa' in Hindustani, and its three dots above set it apart: ثانیہ (sāniyā, second)."
  "hi-0652":
    native: "jīm: j (ja)"
    notes:
      "n1": "Devanagari ज (ja): the 'j' of 'judge'. It takes all four forms: جانا (jānā, to go)."
  "hi-0653":
    native: "che: ch (ca)"
    notes:
      "n1": "Devanagari च (ca): the 'ch' of 'church', with no puff of breath. It has the same bowl as ج (ja), so read the word to tell them apart: چائے (cāy, tea)."
  "hi-0654":
    native: "ḥe: h (ha)"
    notes:
      "n1": "Devanagari ह (ha): a breathy 'h' from the throat. It shares its sound with ہ (ha), so read them alike: حساب (hisāb, account)."
  "hi-0655":
    native: "khe: kh, from the throat (k͟ha)"
    notes:
      "n1": "Devanagari ख़ (k͟ha): the 'ch' of Scottish 'loch', said at the back of the throat, not the breathy ख (kha). It has the bowl of ح (ha) with a dot above: خط (khat, letter)."
  "hi-0656":
    native: "dāl: d (da)"
    notes:
      "n1": "Devanagari द (da): a dental 'd', the tongue at the teeth. It joins only to the letter before it, never to the next: دن (din, day)."
  "hi-0657":
    native: "ḍāl: d, curled back (ḍa)"
    notes:
      "n1": "Devanagari ड (ḍa): the 'd' of 'dog' with the tongue curled back, as in the consonants deck. It joins only to the letter before it: ڈاکٹر (ḍākṭar, doctor)."
  "hi-0658":
    native: "zāl: z (za)"
    notes:
      "n1": "Devanagari ज़ (za): the 'z' of 'zoo', the same sound as ز (za), ض (za) and ظ (za), all 'za' in Hindustani. It joins only to the letter before it: ذرا (zarā, a little)."
  "hi-0659":
    native: "re: r (ra)"
    notes:
      "n1": "Devanagari र (ra): the 'r' of Hindi, tapped or rolled with the tongue. It joins only to the letter before it, never to the next: رات (rāt, night)."
  "hi-0660":
    native: "ṛe: r, flapped (ṛa)"
    notes:
      "n1": "Devanagari ड़ (ṛa): the flapped 'r' of the consonants deck, which never starts a word. It joins only to the letter before it: لڑکا (laṛkā, boy)."
  "hi-0661":
    native: "ze: z (za)"
    notes:
      "n1": "Devanagari ज़ (za): the 'z' of 'zoo', the same sound as ذ (za), ض (za) and ظ (za). It joins only to the letter before it: زبان (zabān, language)."
  "hi-0662":
    native: "zhe: zh, the 's' of 'measure' (ža)"
    notes:
      "n1": "Devanagari has no letter for this sound, so it is drilled by reading and writing; it is the 's' of 'measure', found only in a few Persian words. It joins only to the letter before it: مژدہ (maždā, good news)."
  "hi-0663":
    native: "sīn: s (sa)"
    notes:
      "n1": "Devanagari स (sa): the 's' of 'sun', the same sound as ث (sa) and ص (sa). It takes all four forms: سات (sāt, seven)."
  "hi-0664":
    native: "śīn: sh (śa)"
    notes:
      "n1": "Devanagari श (śa): the 'sh' of 'ship', and its three dots above set it apart from س (sa). It takes all four forms: شہر (śahar, city)."
  "hi-0665":
    native: "ṣād: s (sa)"
    notes:
      "n1": "Devanagari स (sa): the same sound as س (sa) and ث (sa), all 'sa' in Hindustani. It takes all four forms: صبح (subah, morning)."
  "hi-0666":
    native: "ḍād: z (za)"
    notes:
      "n1": "Devanagari ज़ (za): the same sound as ز (za), ذ (za) and ظ (za), all 'za' in Hindustani. It takes all four forms: ضرور (zarūr, certainly)."
  "hi-0667":
    native: "ṭoe: t (ta)"
    notes:
      "n1": "Devanagari त (ta): the same sound as ت (ta), so read them alike in Hindustani. It takes all four forms: طریقہ (tarīqā, way, method)."
  "hi-0668":
    native: "ẓoe: z (za)"
    notes:
      "n1": "Devanagari ज़ (za): the same sound as ز (za), ذ (za) and ض (za), all 'za'. It takes all four forms: ظاہر (zāhir, obvious)."
  "hi-0669":
    native: "ghain: gh, from the throat (ġa)"
    notes:
      "n1": "Devanagari ग़ (ġa): a 'g' gargled deep in the throat, not the plain ग (ga). It takes all four forms: غریب (ġarīb, poor)."
  "hi-0670":
    native: "fe: f (fa)"
    notes:
      "n1": "Devanagari फ़ (fa): the 'f' of 'fan', written with a dot below in Devanagari. It takes all four forms: فون (fon, phone)."
  "hi-0671":
    native: "qāf: q (qa)"
    notes:
      "n1": "Devanagari क़ (qa): a 'k' said further back in the throat than क (ka). It has two dots above and takes all four forms: قلم (qalam, pen)."
  "hi-0672":
    native: "kāf: k (ka)"
    notes:
      "n1": "Devanagari क (ka): a plain 'k', as in 'skin', with no puff of breath. It takes all four forms: کتاب (kitāb, book)."
  "hi-0673":
    native: "gāf: g (ga)"
    notes:
      "n1": "Devanagari ग (ga): the 'g' of 'go'. Its extra stroke above sets it apart from ک (ka): گاڑی (gāṛī, car)."
  "hi-0674":
    native: "lām: l (la)"
    notes:
      "n1": "Devanagari ल (la): the 'l' of 'light', with the tongue at the teeth. It takes all four forms: لڑکا (laṛkā, boy)."
  "hi-0675":
    native: "mīm: m (ma)"
    notes:
      "n1": "Devanagari म (ma): the 'm' of 'mother'. It takes all four forms: مہینہ (mahīnā, month)."
  "hi-0676":
    native: "nūn: n (na)"
    notes:
      "n1": "Devanagari न (na): the 'n' of 'no', with the tongue at the teeth. It takes all four forms: نام (nām, name)."
  "hi-0677":
    native: "vāo: v (va)"
    notes:
      "n1": "Devanagari व (va): the 'v' or 'w' sound. As a vowel it is ū, ō or au, so read it by the word; it joins only to the letter before it: وقت (vaqt, time)."
  "hi-0678":
    native: "choṭī he: h (ha)"
    notes:
      "n1": "Devanagari ह (ha): a breathy 'h', the same sound as ح (ha), so read them alike. It takes all four forms: ہم (ham, we)."
  "hi-0679":
    native: "choṭī ye: y (ya)"
    notes:
      "n1": "Devanagari य (ya): the 'y' of 'yes', and inside a word the long ī. It takes all four forms: یہ (yah, this)."
  "hi-0680":
    native: "baṛī ye: ē (ē)"
    notes:
      "n1": "Devanagari ए (ē): the long e, and at the end of a word it is said 'ai', as in ہے (hai, is)."
