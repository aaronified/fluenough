cards:
  "hi-5774":
    native: "Respect the law."
    bases:
      "सम्मान": "respect"
      "कीजिए": "do (polite)"
    confusables:
      "w1": { why: "Judge, not law: जज (jaj) means judge." }
      "w2": { why: "Duty, not respect: कर्तव्य (kartavya) means duty." }
  "hi-5775":
    native: "The judge is hearing the case."
    bases:
      "सुन": "hear, listen"
      "रहा": "(continuing action, masculine)"
      "है": "is"
    confusables:
      "w1": { why: "Witness, not judge: गवाह (gavāh) means witness." }
      "w2": { why: "Criminal, not judge: अपराधी (aprādhī) means criminal." }
  "hi-5776":
    native: "The witness will tell all."
    bases:
      "बताएगा": "will tell"
    confusables:
      "w1": { why: "Criminal, not witness: अपराधी (aprādhī) means criminal." }
      "w2": { why: "Judge, not witness: जज (jaj) means judge." }
  "hi-5777":
    native: "He was sentenced."
    bases:
      "उसे": "to him"
      "हुई": "was given (feminine)"
    confusables:
      "w1": { why: "Fine, not sentence: जुर्माना (jurmānā) means fine." }
      "w2": { why: "Prison, not sentence: जेल (jēl) means prison." }
  "hi-5778":
    native: "The accused is in jail."
    bases:
      "है": "is"
    confusables:
      "w1": { why: "Criminal, not accused: अपराधी (aprādhī) means criminal." }
      "w2": { why: "Charge, not accused: आरोप (ārōp) means charge or accusation." }
  "hi-5779":
    native: "He is innocent."
    bases:
      "है": "is"
    confusables:
      "w1": { why: "Guilt, not innocent: दोष (dōś) means fault or guilt." }
      "w2": { why: "Accused, not innocent: आरोपी (ārōpī) means accused person." }
  "hi-5780":
    native: "How much is the fine?"
    bases:
      "है": "is"
    confusables:
      "w1": { why: "Punishment, not fine: सज़ा (sazā) means punishment or sentence." }
      "w2": { why: "Bail, not fine: ज़मानत (zamānat) means bail or guarantee." }
  "hi-5781":
    native: "This is legal work."
    bases:
      "है": "is"
    confusables:
      "w1": { why: "Illegal, not legal: गैरकानूनी (gairkānūnī) means illegal." }
      "w2": { why: "Law, not legal: कानून (kānūn) means law." }
  "hi-5782":
    native: "Bail was granted."
    bases:
      "मिल": "get"
      "गई": "(completed action, feminine)"
    confusables:
      "w1": { why: "Warrant, not bail: वारंट (vāraṇṭ) means warrant." }
      "w2": { why: "Punishment, not bail: सज़ा (sazā) means punishment." }
  "hi-5783":
    native: "He makes an accusation."
    bases:
      "लगाता": "make (masculine)"
      "है": "is"
    confusables:
      "w1": { why: "Accused, not charge: आरोपी (ārōpī) means accused person." }
      "w2": { why: "Fault, not charge: दोष (dōś) means fault or guilt." }
  "hi-5784":
    native: "Duty comes first."
    bases:
      "सबसे": "most (of all)"
      "है": "is"
    confusables:
      "w1": { why: "Constitution, not duty: संविधान (saṁvidhān) means constitution." }
      "w2": { why: "Justice, not duty: न्याय (nyāy) means justice." }
  "hi-5785":
    native: "He was acquitted."
    bases:
      "हो": "became"
      "गया": "(completed action)"
    confusables:
      "w1": { why: "Innocent, not acquitted: निर्दोष (nirdōś) means innocent." }
      "w2": { why: "Bail, not acquitted: ज़मानत (zamānat) means bail or guarantee." }
