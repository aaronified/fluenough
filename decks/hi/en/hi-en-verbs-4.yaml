schema: 1
id: "hi-en-verbs-4"
kind: "layer"
core: "hi-verbs-4"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs: change, eat and care"
license: "CC-BY-SA-4.0"
description: "More everyday verbs: things that melt, boil, burn and go out, the ways of holding, breaking and bending, and the acts of eating, tasting and caring for plants. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "hi-2614":
    native: "to freeze; to set; to collect"
    notes:
      "n1": "To become solid with cold, as water does, or to gather up in one place."
    examples:
      "रात में पानी जम गया।": { "native": "At night the water froze.", "bases": {"जम": "to freeze; to set"} }
      "दही जम गया।": { "native": "The curd has set.", "bases": {"जम": "to freeze; to set"} }
  "hi-2615":
    native: "to melt"
    notes:
      "n1": "To become liquid by heat, as ice, wax or butter does."
    examples:
      "बर्फ़ धूप में पिघल रही है।": { "native": "The ice is melting in the sun.", "bases": {"पिघल": "to melt"} }
      "घी गरम होते ही पिघल गया।": { "native": "The ghee melted as soon as it got hot.", "bases": {"ही": "as soon as", "पिघल": "to melt"} }
  "hi-2616":
    native: "to boil"
    notes:
      "n1": "To be heated until bubbles rise, as water does. The causal is उबालना (ubālnā), to boil something."
    examples:
      "पानी उबल रहा है।": { "native": "The water is boiling.", "bases": {"उबल": "to boil"} }
      "दूध उबलने दो।": { "native": "Let the milk boil.", "bases": {"उबलने": "to boil"} }
  "hi-2617":
    native: "to burn; to be lit"
    notes:
      "n1": "To catch fire, or to be burnt. It is also used of a hand that is hot or stung."
    examples:
      "लकड़ियाँ अच्छी तरह जल रही हैं।": { "native": "The wood is burning well.", "bases": {"लकड़ियाँ": "wood", "तरह": "way", "जल": "to burn"} }
      "हाथ जल गया।": { "native": "The hand got burnt.", "bases": {"जल": "to burn"} }
  "hi-2618":
    native: "to go out (of a light or fire)"
    notes:
      "n1": "To stop burning, as a fire or a lamp does."
    examples:
      "दीया बुझ गया।": { "native": "The lamp went out.", "bases": {"बुझ": "to go out"} }
      "आग अभी तक नहीं बुझी।": { "native": "The fire has not gone out yet.", "bases": {"बुझी": "to go out"} }
  "hi-2619":
    native: "to wander; to lose one's way"
    notes:
      "n1": "To walk about without knowing where to go, or to go off the right path."
    examples:
      "बच्चा जंगल में भटक गया।": { "native": "The child lost his way in the forest.", "bases": {"भटक": "to wander"} }
      "मन भटक रहा है।": { "native": "The mind is wandering.", "bases": {"भटक": "to wander"} }
  "hi-2620":
    native: "to hide (oneself)"
    notes:
      "n1": "To be out of sight, or to take cover. The causal is छिपाना (chipānā)."
    examples:
      "बिल्ली पलंग के नीचे छिप गई।": { "native": "The cat hid under the bed.", "bases": {"छिप": "to hide"} }
      "बच्चे छिपकर खेलते हैं।": { "native": "The children play hiding.", "bases": {"छिपकर": "to hide"} }
  "hi-2621":
    native: "to jump; to leap"
    notes:
      "n1": "To spring up off the ground, with both feet."
    examples:
      "बच्चा नदी में कूद गया।": { "native": "The child jumped into the river.", "bases": {"कूद": "to jump"} }
      "कूदो मत!": { "native": "Do not jump!", "bases": {"कूदो": "to jump", "मत": "do not"} }
  "hi-2622":
    native: "to slip"
    notes:
      "n1": "To slide by accident on a smooth or wet surface."
    examples:
      "फ़र्श गीला है, मत फिसलो।": { "native": "The floor is wet, do not slip.", "bases": {"मत": "do not", "फिसलो": "to slip"} }
      "वह सीढ़ी से फिसल गया।": { "native": "He slipped from the stairs.", "bases": {"फिसल": "to slip"} }
  "hi-2623":
    native: "to hold; to grip; to support"
    notes:
      "n1": "To take a firm hold of something, so that it does not fall."
    examples:
      "मेरा हाथ थामो।": { "native": "Hold my hand.", "bases": {"थामो": "to hold"} }
      "उसने बच्चे को गिरने से थामा।": { "native": "He held the child from falling.", "bases": {"थामा": "to hold"} }
  "hi-2624":
    native: "to rub; to scrub"
    notes:
      "n1": "To press and move a thing back and forth on a surface, to clean or to warm it."
    examples:
      "बर्तन साबुन से रगड़ो।": { "native": "Scrub the pots with soap.", "bases": {"रगड़ो": "to rub"} }
      "हाथ रगड़कर गर्म करो।": { "native": "Warm the hands by rubbing them.", "bases": {"रगड़कर": "to rub", "गर्म": "warm"} }
  "hi-2625":
    native: "to break; to pluck"
    notes:
      "n1": "To break something into pieces, or to pluck a fruit or a flower from a plant. The intransitive is टूटना (ṭūṭnā)."
    examples:
      "शीशा मत तोड़ो।": { "native": "Do not break the glass.", "bases": {"शीशा": "glass", "मत": "do not", "तोड़ो": "to break"} }
      "उसने फूल तोड़ा।": { "native": "He plucked a flower.", "bases": {"तोड़ा": "to break"} }
  "hi-2626":
    native: "to bend; to fold; to turn"
    notes:
      "n1": "To bend something out of its straight shape, or to fold it."
    examples:
      "कागज़ मोड़ो।": { "native": "Fold the paper.", "bases": {"मोड़ो": "to fold"} }
      "सड़क यहाँ से मुड़ती है।": { "native": "The road turns here.", "bases": {"मुड़ती": "to turn"} }
  "hi-2627":
    native: "to fight; to quarrel"
    notes:
      "n1": "To fight with fists or weapons, or to argue angrily."
    examples:
      "दोनों भाई लड़ रहे हैं।": { "native": "The two brothers are fighting.", "bases": {"दोनों": "both", "लड़": "to fight"} }
      "सिपाही दुश्मन से लड़ा।": { "native": "The soldier fought the enemy.", "bases": {"सिपाही": "soldier", "दुश्मन": "enemy", "लड़ा": "to fight"} }
  "hi-2628":
    native: "to improve; to correct; to repair"
    notes:
      "n1": "To make something better, or to put right a mistake."
    examples:
      "अपनी गलती सुधारो।": { "native": "Correct your mistake.", "bases": {"सुधारो": "to correct"} }
      "उसने घर की हालत सुधारी।": { "native": "He improved the state of the house.", "bases": {"हालत": "state", "सुधारी": "to improve"} }
  "hi-2629":
    native: "to apply; to plant; to attach"
    notes:
      "n1": "To put something on or in a place, as a plaster, a seed or a tap. The causal is लगवाना (lagvānā)."
    examples:
      "दवा लगाओ।": { "native": "Apply the medicine.", "bases": {"लगाओ": "to apply"} }
      "उसने पेड़ लगाया।": { "native": "He planted a tree.", "bases": {"लगाया": "to plant"} }
  "hi-2630":
    native: "to get something put on or fixed"
    notes:
      "n1": "To have something done by someone else, as a tap fixed or a ticket bought."
    examples:
      "नल ठीक करवाओ।": { "native": "Get the tap fixed.", "bases": {"करवाओ": "to get done"} }
      "मैंने नया ताला लगवाया।": { "native": "I got a new lock fitted.", "bases": {"ताला": "lock", "लगवाया": "to get fixed"} }
  "hi-2631":
    native: "to recognise"
    notes:
      "n1": "To know a person or a thing again, from its look or its sound."
    examples:
      "क्या तुम मुझे पहचानते हो?": { "native": "Do you recognise me?", "bases": {"पहचानते": "to recognise"} }
      "उसने मेरी आवाज़ पहचानी।": { "native": "He recognised my voice.", "bases": {"पहचानी": "to recognise"} }
  "hi-2632":
    native: "to water (plants); to irrigate"
    notes:
      "n1": "To pour water on plants or on a field, so that they grow."
    examples:
      "पौधों को रोज़ सींचो।": { "native": "Water the plants every day.", "bases": {"सींचो": "to water"} }
      "किसान खेत सींच रहा है।": { "native": "The farmer is watering the field.", "bases": {"सींच": "to water"} }
  "hi-2633":
    native: "to sow; to plant (seeds)"
    notes:
      "n1": "To put seeds into the earth so that they grow."
    examples:
      "खेत में गेहूँ बोओ।": { "native": "Sow wheat in the field.", "bases": {"बोओ": "to sow"} }
      "उसने बीज बोए।": { "native": "He sowed the seeds.", "bases": {"बोए": "to sow"} }
  "hi-2634":
    native: "to ask for; to beg"
    notes:
      "n1": "To ask someone to give a thing, or for a favour."
    examples:
      "मुझसे पैसे मत माँगो।": { "native": "Do not ask me for money.", "bases": {"मत": "do not", "माँगो": "to ask for"} }
      "उसने माफ़ी माँगी।": { "native": "He asked for forgiveness.", "bases": {"माँगी": "to ask for"} }
  "hi-2635":
    native: "to come out; to go out; to leave"
    notes:
      "n1": "To come or go out of a place, or to be found. The causal is निकालना (nikālnā)."
    examples:
      "सुबह हम घर से निकले।": { "native": "In the morning we left the house.", "bases": {"निकले": "to leave"} }
      "सूरज निकल आया।": { "native": "The sun has come out.", "bases": {"निकल": "to come out"} }
  "hi-2636":
    native: "to plant; to bury; to drive in"
    notes:
      "n1": "To push something firmly into the ground, such as a pole or a stake."
    examples:
      "खेत में खंभा गाड़ो।": { "native": "Plant a pole in the field.", "bases": {"खंभा": "pole", "गाड़ो": "to plant"} }
      "उसने खज़ाना ज़मीन में गाड़ा।": { "native": "He buried the treasure in the ground.", "bases": {"खज़ाना": "treasure", "ज़मीन": "ground", "गाड़ा": "to bury"} }
  "hi-2637":
    native: "to fly (a kite); to blow away"
    notes:
      "n1": "To make something fly, such as a kite or a bird, or to blow it away."
    examples:
      "बच्चे पतंग उड़ा रहे हैं।": { "native": "The children are flying a kite.", "bases": {"उड़ा": "to fly"} }
      "हवा ने कागज़ उड़ा दिया।": { "native": "The wind blew the paper away.", "bases": {"ने": "by", "उड़ा": "to blow away"} }
  "hi-2638":
    native: "to remove; to move aside"
    notes:
      "n1": "To take something away from a place, or to move it to one side."
    examples:
      "यह सामान यहाँ से हटाओ।": { "native": "Remove these things from here.", "bases": {"हटाओ": "to remove"} }
      "उसने रास्ते से पत्थर हटाया।": { "native": "He removed the stone from the road.", "bases": {"हटाया": "to remove"} }
  "hi-2639":
    native: "to swallow"
    notes:
      "n1": "To take food or a pill down the throat, whole."
    examples:
      "गोली पानी से निगलो।": { "native": "Swallow the pill with water.", "bases": {"निगलो": "to swallow"} }
      "बच्चे ने सिक्का निगल लिया।": { "native": "The child swallowed a coin.", "bases": {"ने": "by", "निगल": "to swallow"} }
  "hi-2640":
    native: "to chew"
    notes:
      "n1": "To bite food with the teeth, before swallowing it."
    examples:
      "धीरे चबाओ।": { "native": "Chew slowly.", "bases": {"चबाओ": "to chew"} }
      "वह पान चबा रहा है।": { "native": "He is chewing betel leaf.", "bases": {"पान": "betel leaf", "चबा": "to chew"} }
  "hi-2641":
    native: "to squeeze; to wring out"
    notes:
      "n1": "To press a thing hard to get liquid out of it, as juice from a lemon or water from a cloth."
    examples:
      "नींबू निचोड़ो।": { "native": "Squeeze the lemon.", "bases": {"निचोड़ो": "to squeeze"} }
      "कपड़ा अच्छी तरह निचोड़ो।": { "native": "Wring the cloth out well.", "bases": {"तरह": "way", "निचोड़ो": "to squeeze"} }
  "hi-2642":
    native: "to smell; to sniff"
    notes:
      "n1": "To take in a smell through the nose."
    examples:
      "फूल को सूँघो।": { "native": "Smell the flower.", "bases": {"सूँघो": "to smell"} }
      "उसने खाना सूँघकर कहा कि अच्छा है।": { "native": "He smelled the food and said it was good.", "bases": {"सूँघकर": "to smell"} }
  "hi-2643":
    native: "to taste"
    notes:
      "n1": "To take a little food into the mouth to know its taste."
    examples:
      "दाल चखकर बताओ।": { "native": "Taste the dal and tell me.", "bases": {"चखकर": "to taste"} }
      "मैंने मिठाई चखी।": { "native": "I tasted the sweet.", "bases": {"चखी": "to taste"} }
