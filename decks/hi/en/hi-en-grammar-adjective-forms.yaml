tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "fem": "with a feminine noun"
    "masc-obl": "with a masculine plural noun, or before a postposition"
rules:
  "hi-rule-adjective-fem":
    name: "-ी (-ī): with a feminine noun"
    explanation: "An adjective that ends in -ā agrees with the noun. With a feminine noun the -ā changes to {1}: {2}, good, becomes {3}, as with {6}, a book. An adjective that does not end in -ā, such as {4}, red, or {5}, beautiful, does not change."
  "hi-rule-adjective-masc-obl":
    name: "-े (-ē): masculine plural, or before a postposition"
    explanation: "With a masculine plural noun, and before a postposition, the -ā changes to {1}: {2}, good, becomes {3}, as with {6}, a room. An adjective that does not end in -ā, such as {4}, red, or {5}, beautiful, does not change."
