name: "Adjectives: with a feminine noun, and before a postposition"
description: "Every adjective the course teaches, with a feminine noun and with a masculine plural noun or before a postposition. An adjective that does not end in -ā does not change, so both cells show the word itself. The forms are written in Devanagari for now. Not yet checked by a Hindustani speaker: please report any mistake."
