schema: 1
id: "hi-en-registers"
kind: "layer"
core: "hi-registers"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Formal words and everyday words"
license: "CC0-1.0"
description: "Hindi often has two words for one thing: a formal one from Sanskrit, seen on signs and in the news, and the one people say, often from Persian or English. Recognition only. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0604":
    native: "question; everyday सवाल (savāl)"
    notes:
      "n1": "सवाल (savāl) in speech."
  "hi-0605":
    native: "answer; everyday जवाब (javāb)"
    notes:
      "n1": "जवाब (javāb) in speech. उत्तर (uttar) also means north."
  "hi-0606":
    native: "use; everyday इस्तेमाल (istēmāl)"
    notes:
      "n1": "इस्तेमाल (istēmāl) in speech."
  "hi-0607":
    native: "time; also वक़्त (vaqt)"
    notes:
      "n1": "Both are everyday; वक़्त (vaqt) is more common in speech."
  "hi-0608":
    native: "help; everyday मदद (madad)"
    notes:
      "n1": "मदद (madad) in speech; सहायता (sahāyatā) on signs and in news."
  "hi-0609":
    native: "waiting; everyday इंतज़ार (intazār)"
    notes:
      "n1": "इंतज़ार (intazār) in speech: कृपया प्रतीक्षा करें (kripayā pratīkśā karēm̐) on a sign, इंतज़ार कीजिए (intazār kījiē) from a person."
  "hi-0610":
    native: "necessary; everyday ज़रूरी (zarūrī)"
    notes:
      "n1": "ज़रूरी (zarūrī) in speech."
  "hi-0611":
    native: "difficult; everyday मुश्किल (muśkil)"
    notes:
      "n1": "मुश्किल (muśkil) in speech."
  "hi-0612":
    native: "easy; everyday आसान (āsān)"
    notes:
      "n1": "आसान (āsān) in speech."
  "hi-0613":
    native: "book; everyday किताब (kitāb)"
    notes:
      "n1": "किताब (kitāb) in speech; पुस्तकालय (pustakālay) is a library."
  "hi-0614":
    native: "school; everyday स्कूल (skūl)"
    notes:
      "n1": "स्कूल (skūl) in speech."
  "hi-0615":
    native: "meal; everyday खाना (khānā)"
    notes:
      "n1": "खाना (khānā) in speech; भोजन (bhōjan) on menus and in formal invitations."
  "hi-0049":
    native: "water; everyday पानी (pānī)"
    notes:
      "n1": "पानी (pānī) in speech; जल (jal) on signs and in words like जलपान (jalpān), a snack."
  "hi-0616":
    native: "please (written)"
    notes:
      "n1": "On signs and in letters: कृपया जूते बाहर उतारें (kripayā jūtē bāhar utārēm̐). Speech uses the polite verb instead: बैठिए (baiṭhiē)."
  "hi-0617":
    native: "forbidden (on signs)"
    notes:
      "n1": "धूम्रपान निषेध (dhūmrapān niśēdh), no smoking."
  "hi-0618":
    native: "entry; entrance"
    notes:
      "n1": "On doors and gates: प्रवेश (pravēś), entry; निकास (nikās), exit."
  "hi-0619":
    native: "toilet (on signs)"
    notes:
      "n1": "Speakers say टॉयलेट (ṭôylēṭ) or बाथरूम (bāthrūm)."
  "hi-0138":
    native: "thank you (formal)"
    notes:
      "n1": "शुक्रिया (śukriyā) is the everyday word."
