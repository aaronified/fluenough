schema: 1
id: "hi-en-daily-life"
kind: "layer"
core: "hi-daily-life"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "A day"
license: "CC-BY-SA-4.0"
description: "The day from waking to sleeping, and how often things happen. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0441":
    native: "to get up"
    notes:
      "n1": "सुबह उठना (subah uṭhnā), to get up in the morning."
    "examples": {
      "मैं रोज़ सुबह उठता हूँ।": {"native": "I get up every morning.", "bases": {"उठता": "to get up"}},
      "मैं रोज़ सात बजे उठता हूँ।": {"native": "I get up at seven every day. (said by a man)", "bases": {"मैं": "I", "हूँ": "to be", "उठता": "to get up"}}
    }
  "hi-0442":
    native: "to bathe; to have a shower"
  "hi-0443":
    native: "to brush one's teeth"
    notes:
      "n1": "The object दाँत (dām̐t), tooth, and the word साफ़ (sāf), clean, come before करना (karnā), to do."
    bases:
      "दाँत": "tooth"
      "साफ़": "clean"
      "करना": "to do; to make"
  "hi-0444":
    native: "breakfast"
  "hi-0445":
    native: "lunch"
    notes:
      "n1": "Literally 'the food of midday': दोपहर (dōpahar), midday, with का (kā) and खाना (khānā), food."
    bases:
      "दोपहर": "midday; afternoon"
  "hi-0446":
    native: "dinner"
    notes:
      "n1": "Literally 'the food of the night': रात (rāt), night, with का (kā) and खाना (khānā), food."
  "hi-0447":
    native: "to go to work"
    notes:
      "n1": "The place is काम पर (kām par), at work: पर (par), on or at, follows काम (kām), work."
    bases:
      "जाना": "to go"
  "hi-0448":
    native: "to come home"
    notes:
      "n1": "Also said घर आना (ghar ānā), with आना (ānā), to come."
    bases:
      "लौटना": "to return"
  "hi-0449":
    native: "to cook"
    notes:
      "n1": "Literally 'make food': खाना (khānā), food, comes before बनाना (banānā), to make."
    bases:
      "बनाना": "to make; to cook"
  "hi-0450":
    native: "to sleep"
    notes:
      "n1": "सोना (sōnā) also means gold; the sentence says which."
    "examples": {
      "सो जाना": {"native": "to fall asleep", "bases": {"जाना": "to go", "सो": "to sleep"}}
    }
  "hi-0451":
    native: "every day"
    notes:
      "n1": "A longer way to say it is हर दिन (har din), every day."
    "examples": {
      "कचरा रोज़ निकालो।": {"native": "Take the rubbish out every day.", "bases": {"निकालो": "to take out", "रोज़": "every day"}}
    }
  "hi-0452":
    native: "sometimes"
    notes:
      "n1": "The word कभी (kabhī) is said twice; on its own, कभी (kabhī) can also mean 'ever', as in कभी नहीं (kabhī nahīm̐), never."
    bases:
      "कभी": "ever; sometimes"
  "hi-0453":
    native: "always"
    "examples": {
      "वह हमेशा सही बोलता है।": {"native": "He always speaks correctly.", "bases": {"बोलता": "to speak"}}
    }
  "hi-0454":
    native: "usually"
    bases:
      "आम": "common; usual"
      "तौर": "manner; way"
  "hi-0455":
    native: "after that; then"
    notes:
      "n1": "उसके (uskē), the oblique form of वह (vah), comes before बाद (bād), after."
    bases:
      "उसके": "he; she"
      "बाद": "after"
  "hi-0456":
    native: "I get up at seven every day. (said by a man)"
    notes:
      "n1": "A woman says उठती हूँ (uṭhtī hūm̐)."
    bases:
      "मैं": "I"
      "हूँ": "to be"
  "hi-0457":
    native: "Then I go to work. (said by a man)"
    notes:
      "n1": "A woman says जाती हूँ (jātī hūm̐)."
    bases:
      "उसके": "he; she"
      "बाद": "after"
      "मैं": "I"
      "जाता": "to go"
      "हूँ": "to be"
  "hi-0458":
    native: "I go to bed at eleven at night. (said by a man)"
    notes:
      "n1": "A woman says सोती हूँ (sōtī hūm̐)."
    bases:
      "मैं": "I"
      "हूँ": "to be"
  "hi-0459":
    native: "I'm never late."
    notes:
      "n1": "'Never' is कभी (kabhī) with नहीं (nahīm̐): 'to me lateness never happens'."
    bases:
      "मुझे": "I"
      "कभी": "ever; sometimes"
      "देर": "delay; lateness"
      "होती": "to be; to happen"
