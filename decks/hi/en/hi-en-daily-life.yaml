description: "The day from waking to sleeping, and how often things happen. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0441":
    native: "to get up"
    notes:
      "n1": "सुबह उठना (subah uṭhnā), to get up in the morning."
  "hi-0442":
    native: "to bathe; to have a shower"
  "hi-0443":
    native: "to brush one's teeth"
  "hi-0444":
    native: "breakfast"
  "hi-0445":
    native: "lunch"
  "hi-0446":
    native: "dinner"
  "hi-0447":
    native: "to go to work"
  "hi-0448":
    native: "to come home"
  "hi-0449":
    native: "to cook"
  "hi-0450":
    native: "to sleep"
    notes:
      "n1": "सोना (sōnā) also means gold; the sentence says which."
  "hi-0451":
    native: "every day"
  "hi-0452":
    native: "sometimes"
  "hi-0453":
    native: "always"
  "hi-0454":
    native: "usually"
  "hi-0455":
    native: "after that; then"
  "hi-0456":
    native: "I get up at seven every day. (said by a man)"
    notes:
      "n1": "A woman says उठती हूँ (uṭhtī hūm̐)."
  "hi-0457":
    native: "Then I go to work. (said by a man)"
    notes:
      "n1": "A woman says जाती हूँ (jātī hūm̐)."
  "hi-0458":
    native: "I go to bed at eleven at night. (said by a man)"
    notes:
      "n1": "A woman says सोती हूँ (sōtī hūm̐)."
  "hi-0459":
    native: "I'm never late."
    notes:
      "n1": "'Never' is कभी (kabhī) with नहीं (nahīm̐): 'to me lateness never happens'."
