schema: 1
id: "hi-en-family"
kind: "layer"
core: "hi-family"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Family"
license: "CC0-1.0"
description: "Parents, brothers and sisters, grandparents, and the aunts and uncles on each side, each with its own word. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0375":
    native: "parents"
    notes:
      "n1": "In speech also माँ-बाप (mām̐-bāp)."
  "hi-0376":
    native: "father"
    notes:
      "n1": "पिताजी (pitājī) adds respect; many children say पापा (pāpā)."
  "hi-0377":
    native: "mother"
    notes:
      "n1": "Formally माता (mātā); many children say मम्मी (mammī)."
  "hi-0378":
    native: "brother"
    notes:
      "n1": "An elder brother is बड़ा भाई (baṛā bhāī), and is often called भैया (bhaiyā)."
  "hi-0379":
    native: "sister"
    notes:
      "n1": "An elder sister is बड़ी बहन (baṛī bahan), and is often called दीदी (dīdī)."
  "hi-0184":
    native: "son"
    notes:
      "n1": "Also how an elder addresses any younger person, a girl too: see Addressing people."
  "hi-0380":
    native: "daughter"
  "hi-0381":
    native: "husband"
  "hi-0382":
    native: "wife"
  "hi-0383":
    native: "children"
    notes:
      "n1": "The plural of बच्चा (baccā), child."
  "hi-0384":
    native: "grandfather (father's father)"
  "hi-0385":
    native: "grandmother (father's mother)"
  "hi-0386":
    native: "grandfather (mother's father)"
  "hi-0387":
    native: "grandmother (mother's mother)"
  "hi-0388":
    native: "uncle (father's younger brother)"
    notes:
      "n1": "His wife is चाची (cācī)."
  "hi-0389":
    native: "uncle (father's elder brother)"
    notes:
      "n1": "Also ताया (tāyā). His wife is ताई (tāī)."
  "hi-0390":
    native: "aunt (father's sister)"
    notes:
      "n1": "Her husband is फूफा (phūphā)."
  "hi-0391":
    native: "uncle (mother's brother)"
    notes:
      "n1": "His wife is मामी (māmī)."
  "hi-0392":
    native: "aunt (mother's sister)"
    notes:
      "n1": "Her husband is मौसा (mausā)."
  "hi-0393":
    native: "father-in-law"
  "hi-0394":
    native: "mother-in-law"
  "hi-0395":
    native: "relative"
  "hi-0396":
    native: "I have two brothers and a sister."
    notes:
      "n1": "Family takes the possessive, not के पास (kē pās): 'my two brothers are'."
  "hi-0397":
    native: "How many brothers and sisters do you have?"
  "hi-0398":
    native: "I'm married."
    notes:
      "n1": "Literally 'my wedding has happened'. Also मैं शादीशुदा हूँ (maim̐ śādīśudā hūm̐)."
