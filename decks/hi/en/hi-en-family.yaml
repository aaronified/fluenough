schema: 1
id: "hi-en-family"
kind: "layer"
core: "hi-family"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Family"
license: "CC-BY-SA-4.0"
description: "Parents, brothers and sisters, grandparents, and the aunts and uncles on each side, each with its own word. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0375":
    native: "parents"
    notes:
      "n1": "In speech also माँ-बाप (mām̐-bāp)."
  "hi-0376":
    native: "father"
    notes:
      "n1": "पिताजी (pitājī) adds respect; many children say पापा (pāpā)."
    "examples": {
      "मेरे पिता बाग़वानी करते हैं।": {"native": "My father gardens.", "bases": {"मेरे": "my", "बाग़वानी": "gardening", "करते": "to do", "पिता": "father"}}
    }
  "hi-0377":
    native: "mother"
    notes:
      "n1": "Formally माता (mātā); many children say मम्मी (mammī)."
    "examples": {
      "माँ आज खाना परोसेगी।": {"native": "Mother will serve food today.", "bases": {"माँ": "mother"}}
    }
  "hi-0378":
    native: "brother"
    notes:
      "n1": "An elder brother is बड़ा भाई (baṛā bhāī), and is often called भैया (bhaiyā)."
    "examples": {
      "आपके कितने भाई-बहन हैं?": {"native": "How many brothers and sisters do you have?", "bases": {}},
      "दोनों भाइयों में झगड़ा हुआ।": {"native": "The two brothers had a quarrel.", "bases": {"दोनों": "both", "भाइयों": "brother"}}
    }
  "hi-0379":
    native: "sister"
    notes:
      "n1": "An elder sister is बड़ी बहन (baṛī bahan), and is often called दीदी (dīdī)."
    "examples": {
      "मेरी बहन वैज्ञानिक है।": {"native": "My sister is a scientist.", "bases": {"बहन": "sister"}},
      "मेरी बहन तैराकी करती है।": {"native": "My sister goes swimming.", "bases": {"मेरी": "my", "तैराकी": "swimming", "करती": "to do", "बहन": "sister"}}
    }
  "hi-0184":
    native: "son"
    notes:
      "n1": "Also how an elder addresses any younger person, a girl too: see Addressing people."
  "hi-0380":
    native: "daughter"
  "hi-0381":
    native: "husband"
  "hi-0382":
    native: "wife"
  "hi-0383":
    native: "children"
    notes:
      "n1": "The plural of बच्चा (baccā), child."
    "examples": {
      "बच्चे दुखी हैं।": {"native": "The children are sad.", "bases": {"दुखी": "sad"}},
      "बच्चे नाचते हैं।": {"native": "The children dance.", "bases": {"नाचते": "to dance", "बच्चे": "children"}}
    }
  "hi-0384":
    native: "grandfather (father's father)"
    "examples": {
      "मेरे दादा बूढ़े हैं।": {"native": "My grandfather is old.", "bases": {"बूढ़े": "old", "दादा": "grandfather (father's father)"}},
      "दादा जी रोज़ टहलते हैं।": {"native": "Grandfather strolls every day.", "bases": {"टहलते": "to stroll", "दादा": "grandfather (father's father)"}}
    }
  "hi-0385":
    native: "grandmother (father's mother)"
    "examples": {
      "दादी दुबली हैं।": {"native": "Grandmother is thin.", "bases": {"दुबली": "thin", "दादी": "grandmother (father's mother)"}},
      "दादी कहानी सुनाती हैं।": {"native": "Grandmother tells stories.", "bases": {"कहानी": "story", "सुनाती": "to tell", "दादी": "grandmother (father's mother)"}}
    }
  "hi-0386":
    native: "grandfather (mother's father)"
  "hi-0387":
    native: "grandmother (mother's mother)"
  "hi-0388":
    native: "uncle (father's younger brother)"
    notes:
      "n1": "His wife is चाची (cācī)."
    "examples": {
      "मेरे चाचा गंजे हैं।": {"native": "My uncle is bald.", "bases": {"गंजे": "bald", "चाचा": "uncle (father's younger brother)"}}
    }
  "hi-0389":
    native: "uncle (father's elder brother)"
    notes:
      "n1": "Also ताया (tāyā). His wife is ताई (tāī)."
  "hi-0390":
    native: "aunt (father's sister)"
    notes:
      "n1": "Her husband is फूफा (phūphā)."
  "hi-0391":
    native: "uncle (mother's brother)"
    notes:
      "n1": "His wife is मामी (māmī)."
  "hi-0392":
    native: "aunt (mother's sister)"
    notes:
      "n1": "Her husband is मौसा (mausā)."
  "hi-0393":
    native: "father-in-law"
  "hi-0394":
    native: "mother-in-law"
  "hi-0395":
    native: "relative"
  "hi-0396":
    native: "I have two brothers and a sister."
    notes:
      "n1": "Family takes the possessive, not के पास (kē pās): 'my two brothers are'."
    bases:
      "मेरे": "my"
  "hi-0397":
    native: "How many brothers and sisters do you have?"
  "hi-0398":
    native: "I'm married."
    notes:
      "n1": "Literally 'my wedding has happened'. Also मैं शादीशुदा हूँ (maim̐ śādīśudā hūm̐). जाना (jānā) changes its stem in the past: ग- (g-)."
    bases:
      "मेरी": "my"
      "शादी": "marriage"
      "हो": "to be"
      "गई": "to go"
