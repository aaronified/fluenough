native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences about registers"
license: "CC-BY-SA-4.0"
description: "Short sentences that use the formal and everyday words of this unit. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-5164":
    native: "Please do not enter here."
    confusables:
      "w1": { why: "Forbidden, not entry: निषेध (niśēdh) means forbidden (on signs)." }
      "w2": { why: "Toilet, not entry: शौचालय (śaucālay) means toilet (on signs)." }
  "hi-5165":
    native: "Please wait."
    confusables:
      "w1": { why: "Help, not waiting: सहायता (sahāyatā) means help." }
      "w2": { why: "Book, not waiting: पुस्तक (pustak) means book." }
  "hi-5166":
    native: "This work is necessary."
    confusables:
      "w1": { why: "Difficult, not necessary: कठिन (kaṭhin) means difficult." }
      "w2": { why: "Simple, not necessary: सरल (saral) means simple." }
  "hi-5167":
    native: "The book is in the school."
    confusables:
      "w1": { why: "Room, not book: कमरा (kamrā) means room." }
      "w2": { why: "Shop, not book: दुकान (dukān) means shop." }
  "hi-5168":
    native: "It is time for the meal."
    confusables:
      "w1": { why: "Food, not meal: खाना (khānā) means food; to eat." }
      "w2": { why: "Tea, not meal: चाय (cāy) means tea." }
  "hi-5169":
    native: "Thank you for your help."
    confusables:
      "w1": { why: "Everyday, not formal: मदद (madad) is the everyday word for help." }
      "w2": { why: "Thanks, not help: शुक्रिया (śukriyā) means thanks." }
  "hi-5170":
    native: "Please answer this question."
    confusables:
      "w1": { why: "Use, not question: प्रयोग (prayōg) means use." }
      "w2": { why: "Time, not answer: समय (samay) means time." }
  "hi-5171":
    native: "The difficult work became easy."
    confusables:
      "w1": { why: "Necessary, not difficult: आवश्यक (āvaśyak) means necessary." }
      "w2": { why: "Bad, not easy: बुरा (burā) means bad." }
  "hi-5172":
    native: "Where is the toilet?"
    confusables:
      "w1": { why: "Who, not where: कौन (kaun) means who." }
      "w2": { why: "When, not where: कब (kab) means when." }
  "hi-5173":
    native: "A ticket is needed for entry."
    confusables:
      "w1": { why: "Forbidden, not entry: निषेध (niśēdh) means forbidden (on signs)." }
      "w2": { why: "Meal, not ticket: भोजन (bhōjan) means meal." }
  "hi-5174":
    native: "Answer the question."
    confusables:
      "w1": { why: "Book, not answer: पुस्तक (pustak) means book." }
      "w2": { why: "School, not answer: विद्यालय (vidyālay) means school." }
  "hi-5175":
    native: "The school will be closed tomorrow."
    confusables:
      "w1": { why: "Office, not school: दफ़्तर (daftar) means office." }
      "w2": { why: "Shop, not school: दुकान (dukān) means shop." }
  "hi-5176":
    native: "How was the meal?"
    confusables:
      "w1": { why: "Where, not how: कहाँ (kahām̐) means where." }
      "w2": { why: "When, not how: कब (kab) means when." }
  "hi-5177":
    native: "Please use it carefully."
    confusables:
      "w1": { why: "Forbidden, not use: निषेध (niśēdh) means forbidden (on signs)." }
      "w2": { why: "Book, not use: पुस्तक (pustak) means book." }
