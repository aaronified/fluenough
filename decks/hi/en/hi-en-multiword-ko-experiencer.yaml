schema: 1
id: "hi-en-multiword-ko-experiencer"
kind: "layer"
core: "hi-multiword-ko-experiencer"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The dative experiencer: to me, something is liked, needed or felt"
description: "A person in the dative, मुझे (mujhe), to me, with a verb that agrees with the thing liked, needed or felt, not with the person. Not yet checked by a Hindi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "hi-4500":
    native: "I like tea"
    notes:
      "u1": "Literally 'tea pleases me': मुझे (mujhe), to me, is the dative experiencer, and the liked thing is the subject of पसंद (pasand)."
    bases:
      "मुझे": "I"
      "चाय": "tea"
      "पसंद": "liking; choice"
      "है": "to be, to become"
  "hi-4501":
    native: "I miss him or her"
    notes:
      "u1": "Literally 'his or her memory comes to me'; the person missed takes की (kī), and the continuous रही (rahī) with है (hai) gives the present."
    bases:
      "मुझे": "I"
      "उसकी": "his; her"
      "याद": "memory"
      "आ": "to come"
      "रही": "to live, to stay"
      "है": "to be, to become"
  "hi-4502":
    native: "I feel embarrassed or ashamed"
    notes:
      "u1": "Literally 'shame comes to me'; the verb आना (ānā) agrees with the feeling शर्म (sharm), and it is used for feeling shy or embarrassed."
    bases:
      "मुझे": "I"
      "शर्म": "shame; embarrassment"
      "आती": "to come"
      "है": "to be, to become"
  "hi-4503":
    native: "I know"
    notes:
      "u1": "Literally 'it is known to me'; मालूम (mālūm) is an adjective, so the verb is होना (honā), and the person who knows is in the dative."
    bases:
      "मुझे": "I"
      "मालूम": "known; to be known"
      "है": "to be, to become"
  "hi-4504":
    native: "I need some medicine"
    notes:
      "u1": "Literally 'to me there is a need of medicine'; the thing needed comes before की (kī) and ज़रूरत (zarūrat), and the person in need is in the dative."
    bases:
      "मुझे": "I"
      "दवा": "medicine; tablet"
      "की": "of; 's"
      "ज़रूरत": "need"
      "है": "to be, to become"
  "hi-4505":
    native: "I am hungry"
    notes:
      "u1": "Literally 'hunger is felt by me'; लगना (lagnā) is used for sensations, and लगी (lagī) agrees with the feminine noun भूख (bhūkh)."
    bases:
      "मुझे": "I"
      "भूख": "hunger; appetite"
      "लगी": "to seem; to feel"
      "है": "to be, to become"
  "hi-4506":
    native: "I am thirsty"
    notes:
      "u1": "Literally 'thirst is felt by me'; the verb लगी (lagī) agrees with the feminine noun प्यास (pyās), as with भूख (bhūkh)."
    bases:
      "मुझे": "I"
      "प्यास": "thirst"
      "लगी": "to seem; to feel"
      "है": "to be, to become"
  "hi-4507":
    native: "I feel cold"
    notes:
      "u1": "Literally 'cold is being felt by me'; रही (rahī) with है (hai) makes the present continuous, and ठंड (ṭhaṇḍ) is the subject."
    bases:
      "मुझे": "I"
      "ठंड": "cold (weather)"
      "लग": "to seem; to feel"
      "रही": "to live, to stay"
      "है": "to be, to become"
  "hi-4508":
    native: "I have a pain"
    notes:
      "u1": "Literally 'pain is happening to me'; the continuous of होना (honā), to be, with दर्द (dard) as the subject describes an ache."
    bases:
      "मुझे": "I"
      "दर्द": "pain"
      "हो": "to be, to become"
      "रहा": "to live, to stay"
      "है": "to be, to become"
