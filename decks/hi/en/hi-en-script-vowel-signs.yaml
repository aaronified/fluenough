schema: 1
id: "hi-en-script-vowel-signs"
kind: "layer"
core: "hi-script-vowel-signs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hindi vowel signs"
license: "CC-BY-SA-4.0"
description: "After a consonant a vowel is written as a sign (matra) on it: after it, before it, above or below it. Here on क (ka) and on म (ma), with the u signs on र (ra) and two signs of loanwords."
tags: ["unreviewed"]
cards:
  "hi-0059":
    native: "kaa (k + the aa sign)"
    notes:
      "n1": "The aa sign ा (ā) is written after the consonant: क (ka) + ा (ā) = का (kā). Compare क (ka) on its own, which is 'ka' with the short a."
    "examples": {
      "जूते चमकाओ।": {"native": "Polish the shoes.", "bases": {"चमकाओ": "to polish"}},
      "लड़का आया।": {"native": "The boy came.", "bases": {"लड़का": "boy", "आया": "to come"}}
    }
  "hi-0060":
    native: "ki (k + the short i sign)"
    notes:
      "n1": "The short i sign ि (i) is written BEFORE the consonant but said after it: you see ि (i) then क (ka), and say 'ki'. कि (ki) is 'that', as in 'he said that'."
    "examples": {
      "उसने वादा किया।": {"native": "He made a promise.", "bases": {}}
    }
  "hi-0061":
    native: "kii (k + the long i sign)"
    notes:
      "n1": "The long i sign ी (ī) is written after the consonant. A longer i than कि (ki): की (kī) is 'of' before a feminine noun."
    "examples": {
      "जल्दी कीजिए!": {"native": "Hurry up!", "bases": {"कीजिए": "to do"}},
      "बिजली कड़की।": {"native": "The lightning cracked.", "bases": {"कड़की": "to thunder; to crackle"}}
    }
  "hi-0062":
    native: "ku (k + the short u sign)"
    notes:
      "n1": "The short u sign ु (u) hangs below the consonant: कुत्ता (kuttā, dog)."
    "examples": {
      "कुर्ता सुंदर है।": {"native": "The kurta is beautiful.", "bases": {}},
      "कुली को बुलाओ।": {"native": "Call the porter.", "bases": {}}
    }
  "hi-0063":
    native: "kuu (k + the long u sign)"
    notes:
      "n1": "The long u sign ू (ū) also hangs below, and is said longer: कूदना (kūdnā, to jump)."
    "examples": {
      "कूदो मत!": {"native": "Do not jump!", "bases": {"कूदो": "to jump", "मत": "do not"}},
      "कूड़ा अलग रखो।": {"native": "Keep the rubbish separate.", "bases": {}}
    }
  "hi-0064":
    native: "kri (k + the ri sign)"
    notes:
      "n1": "The ri sign ृ (ri) hangs below the consonant, in words from Sanskrit: कृपया (kripayā, please). A recogniser writes this sound as क्रि (kri), so it is drilled by reading and writing only."
    "examples": {
      "प्रकृति की रक्षा करो।": {"native": "Protect nature.", "bases": {"रक्षा": "protection"}},
      "संस्कृत पढ़ना कठिन है।": {"native": "Studying Sanskrit is difficult.", "bases": {"संस्कृत": "Sanskrit", "कठिन": "difficult"}}
    }
  "hi-0065":
    native: "ke (k + the e sign)"
    notes:
      "n1": "The e sign े (ē) sits above the consonant: के (kē) is 'of' before a masculine plural, as in राम के बच्चे (rām kē baccē, Ram's children)."
  "hi-0066":
    native: "kai (k + the ai sign)"
    notes:
      "n1": "The ai sign ै (ai) sits above the consonant, with two strokes: कैसे (kaisē, how)."
    "examples": {
      "कैरम खेलो।": {"native": "Play carrom.", "bases": {"कैरम": "carrom", "खेलो": "to play"}},
      "कैंची तेज़ है।": {"native": "The scissors are sharp.", "bases": {"कैंची": "scissors", "तेज़": "sharp"}}
    }
  "hi-0067":
    native: "ko (k + the o sign)"
    notes:
      "n1": "The o sign ो (ō) is written after the consonant, with a stroke above: को (kō, to)."
    "examples": {
      "गेंद फेंको।": {"native": "Throw the ball.", "bases": {"गेंद": "ball", "फेंको": "to throw"}},
      "कचरा बाहर फेंको।": {"native": "Throw the rubbish outside.", "bases": {"फेंको": "to throw"}}
    }
  "hi-0068":
    native: "kau (k + the au sign)"
    notes:
      "n1": "The au sign ौ (au) is written after the consonant, with two strokes above: कौन (kaun, who)."
    "examples": {
      "कौआ उड़ता है।": {"native": "The crow flies.", "bases": {"उड़ता": "fly"}},
      "कौआ काला है।": {"native": "The crow is black.", "bases": {}}
    }
  "hi-0069":
    native: "kan (k + the anusvaar)"
    notes:
      "n1": "The dot above, the anusvar ं (am̐), is an n or m sound before the next consonant: रंग (raṅg, colour). With a sign above the line, where the moon and dot won't fit, it stands for them: a nasal vowel, as in में (mēm̐) and हैं (haim̐). A mark rather than a sound of its own, so it is drilled by reading and writing only."
    "examples": {
      "कंघी छोटी है।": {"native": "The comb is small.", "bases": {}},
      "कंघी नई है।": {"native": "The comb is new.", "bases": {"नई": "new"}}
    }
  "hi-0070":
    native: "kan (k + the chandrabindu)"
    notes:
      "n1": "The moon and dot ँ (am̐) above makes the vowel nasal, said through the nose as well: हँसना (ham̐snā, to laugh). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  "hi-0071":
    native: "k (with the halant: no vowel)"
    notes:
      "n1": "The halant ् below takes the vowel away: क् (k) is 'k' alone. Two consonants usually join instead, as क् (k) joins त (ta) in शक्ति (śakti, strength). A mark rather than a sound of its own, so it is drilled by reading and writing only."
    "examples": {
      "क्लिनिक छोटा है।": {"native": "The clinic is small.", "bases": {}},
      "ट्रैक्टर नया है।": {"native": "The tractor is new.", "bases": {}}
    }
  "hi-0072":
    native: "maa (m + the aa sign)"
    notes:
      "n1": "The same aa sign on another consonant: each sign keeps its place on almost every consonant. मामा (māmā, mother's brother)."
    "examples": {
      "समाचार सुनो।": {"native": "Listen to the news.", "bases": {}},
      "आज सिनेमा चलें?": {"native": "Shall we go to the cinema today?", "bases": {}}
    }
  "hi-0073":
    native: "mi (m + the short i sign)"
    notes:
      "n1": "The short i sign is written before म (ma), as before क (ka), and said after it: मिलना (milnā, to meet)."
    "examples": {
      "ब्लैकबोर्ड मिटाओ।": {"native": "Erase the blackboard.", "bases": {"मिटाओ": "to erase"}},
      "मिठाई बाँटो।": {"native": "Share out the sweets.", "bases": {"बाँटो": "to share out"}}
    }
  "hi-0074":
    native: "mii (m + the long i sign)"
    notes:
      "n1": "The long i sign is written after म (ma): मीठा (mīṭhā, sweet)."
    "examples": {
      "अनानास मीठा है।": {"native": "Pineapple is sweet.", "bases": {}},
      "आम मीठा है।": {"native": "The mango is sweet.", "bases": {}}
    }
  "hi-0075":
    native: "mu (m + the short u sign)"
    notes:
      "n1": "The short u sign hangs below म (ma): मुझे (mujhē, to me)."
    "examples": {
      "ईद मुबारक!": {"native": "Happy Eid!", "bases": {}},
      "उसने मुझे धकेला।": {"native": "He pushed me.", "bases": {"धकेला": "to push"}}
    }
  "hi-0076":
    native: "muu (m + the long u sign)"
    notes:
      "n1": "The long u sign hangs below म (ma): मूली (mūlī, radish)."
    "examples": {
      "नमूना दिखाओ।": {"native": "Show the sample.", "bases": {"दिखाओ": "to show"}},
      "मूँगफली भुन गई।": {"native": "The peanuts were roasted.", "bases": {"मूँगफली": "peanut", "भुन": "to roast"}}
    }
  "hi-0077":
    native: "me (m + the e sign)"
    notes:
      "n1": "The e sign sits above म (ma): मेज़ (mēz, table)."
    "examples": {
      "ईमेल भेजो।": {"native": "Send an email.", "bases": {}},
      "खिलौने समेटो।": {"native": "Gather up the toys.", "bases": {"खिलौने": "toy", "समेटो": "to gather up; to tidy"}}
    }
  "hi-0078":
    native: "mo (m + the o sign)"
    notes:
      "n1": "The o sign is written after म (ma), with a stroke above: मोर (mōr, peacock)."
    "examples": {
      "मूँछ मोटी है।": {"native": "The moustache is thick.", "bases": {}},
      "मेरा हाथ थामो।": {"native": "Hold my hand.", "bases": {"थामो": "to hold"}}
    }
  "hi-0079":
    native: "ru (r + the short u sign, beside र (ra))"
    notes:
      "n1": "After र (ra) the u signs don't hang below: they sit beside it, at its middle. रुपया (rupayā, rupee)."
    "examples": {
      "गुरुद्वारा शांत है।": {"native": "The gurdwara is calm.", "bases": {"शांत": "calm"}},
      "रुमाल छोटा है।": {"native": "The handkerchief is small.", "bases": {}}
    }
  "hi-0080":
    native: "ruu (r + the long u sign, beside र (ra))"
    notes:
      "n1": "The long u sign also sits beside र (ra): रूप (rūp, form; looks)."
    "examples": {
      "शुरू करना": {"native": "to start", "bases": {"शुरू": "beginning", "करना": "to do; to make"}},
      "बचत ज़रूरी है।": {"native": "Saving is necessary.", "bases": {"ज़रूरी": "necessary"}}
    }
  "hi-0081":
    native: "kaa as in 'coffee' (k + the English o sign)"
    notes:
      "n1": "The moon above the aa sign, ॉ (ô), is the open o of English words, said like the 'o' of 'coffee': कॉफ़ी (kôfī, coffee), डॉक्टर (ḍôkṭar, doctor)."
    "examples": {
      "कॉपी में लिखो।": {"native": "Write in the exercise book.", "bases": {"कॉपी": "exercise book", "लिखो": "to write"}},
      "कॉफ़ी गरम है।": {"native": "The coffee is hot.", "bases": {}}
    }
  "hi-0082":
    native: "kah (k + the visarga)"
    notes:
      "n1": "The two dots after a letter, the visarga ः (aḥ), are a breath of h after the vowel. It is rare, in words from Sanskrit and in छः (chaḥ, six). A mark rather than a sound of its own, so it is drilled by reading and writing only."
