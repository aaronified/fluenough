schema: 1
id: "hi-en-law"
kind: "layer"
core: "hi-law"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Law"
license: "CC-BY-SA-4.0"
description: "The law and the courts: the rules and the constitution, the judge and the witness, crime, charge and punishment, and bail. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "hi-2672":
    native: "law"
    notes:
      "n1": "The rules that a country or a state makes and that everyone must follow. The word क़ानून (qānūn) is the same."
    examples:
      "यह कानून सबके लिए है।": { "native": "This law is for everyone.", "bases": {"लिए": "for"} }
      "कानून तोड़ना अपराध है।": { "native": "Breaking the law is a crime.", "bases": {"तोड़ना": "to break"} }
  "hi-2673":
    native: "justice"
    notes:
      "n1": "Fair treatment under the law, and the decision of a court that is fair."
    examples:
      "सबको न्याय मिलना चाहिए।": { "native": "Everyone should get justice.", "bases": {} }
      "न्याय में देर अन्याय है।": { "native": "Delay in justice is injustice.", "bases": {"अन्याय": "injustice"} }
  "hi-2674":
    native: "judge"
    notes:
      "n1": "The person who hears cases in a court and gives the decision."
    examples:
      "जज ने फ़ैसला सुनाया।": { "native": "The judge gave the decision.", "bases": {"ने": "by"} }
      "जज साहब अभी आएँगे।": { "native": "The judge will come now.", "bases": {} }
  "hi-2675":
    native: "case; lawsuit"
    notes:
      "n1": "A matter brought to a court for it to decide."
    examples:
      "उसका मुकदमा चल रहा है।": { "native": "His case is going on.", "bases": {} }
      "मुकदमा जीत गए।": { "native": "We won the case.", "bases": {} }
  "hi-2676":
    native: "criminal; offender"
    notes:
      "n1": "A person who has committed a crime."
    examples:
      "पुलिस ने अपराधी पकड़ा।": { "native": "The police caught the criminal.", "bases": {"ने": "by", "अपराधी": "criminal"} }
      "अपराधी जेल में है।": { "native": "The criminal is in prison.", "bases": {} }
  "hi-2677":
    native: "witness"
    notes:
      "n1": "A person who tells a court what they saw or know about a case."
    examples:
      "गवाह ने सच बताया।": { "native": "The witness told the truth.", "bases": {"ने": "by", "सच": "truth"} }
      "गवाह अदालत में आया।": { "native": "The witness came to the court.", "bases": {} }
  "hi-2678":
    native: "punishment; sentence"
    notes:
      "n1": "What a court or a person decides as a penalty for a wrong."
    examples:
      "उसे पाँच साल की सज़ा हुई।": { "native": "He was given a five-year sentence.", "bases": {} }
      "गलती की सज़ा मिलती है।": { "native": "A mistake is punished.", "bases": {} }
  "hi-2679":
    native: "fine (money)"
    notes:
      "n1": "A sum of money that must be paid as a penalty."
    examples:
      "यातायात नियम तोड़ने पर जुर्माना है।": { "native": "There is a fine for breaking the traffic rules.", "bases": {"यातायात": "traffic", "तोड़ने": "to break"} }
      "जुर्माना भरो।": { "native": "Pay the fine.", "bases": {} }
  "hi-2680":
    native: "prison; jail"
    notes:
      "n1": "A building where people are kept as a punishment for crime."
    examples:
      "वह जेल में है।": { "native": "He is in prison.", "bases": {} }
      "जेल से बाहर आओ।": { "native": "Come out of the prison.", "bases": {} }
  "hi-2681":
    native: "prisoner"
    notes:
      "n1": "A person kept in prison by law."
    examples:
      "क़ैदी को खाना दिया गया।": { "native": "The prisoner was given food.", "bases": {} }
      "क़ैदी आज़ाद हो गया।": { "native": "The prisoner became free.", "bases": {"आज़ाद": "free"} }
  "hi-2682":
    native: "warrant"
    notes:
      "n1": "A written order from a court, to arrest a person or to search a place."
    examples:
      "पुलिस के पास वारंट है।": { "native": "The police have a warrant.", "bases": {} }
      "वारंट पर दस्तखत करो।": { "native": "Sign the warrant.", "bases": {"दस्तखत": "signature"} }
  "hi-2683":
    native: "bail; guarantee"
    notes:
      "n1": "Money or a promise given so that an accused person can be let out until the trial."
    examples:
      "उसकी ज़मानत हो गई।": { "native": "He got bail.", "bases": {} }
      "ज़मानत के लिए पैसे दो।": { "native": "Give money for bail.", "bases": {"लिए": "for"} }
  "hi-2684":
    native: "duty"
    notes:
      "n1": "What a person must do, because of their role or their conscience."
    examples:
      "मतदान हर नागरिक का कर्तव्य है।": { "native": "Voting is every citizen's duty.", "bases": {"हर": "every; each"} }
      "अपने कर्तव्य का पालन करो।": { "native": "Carry out your duty.", "bases": {"पालन": "carrying out"} }
  "hi-2685":
    native: "constitution"
    notes:
      "n1": "The basic written laws by which a country is governed."
    examples:
      "भारत का संविधान बहुत बड़ा है।": { "native": "India's constitution is very big.", "bases": {"भारत": "India"} }
      "संविधान सबको बराबर मानता है।": { "native": "The constitution treats everyone as equal.", "bases": {} }
  "hi-2686":
    native: "legislation; law-making"
    notes:
      "n1": "The making of laws, or a law that is made."
    examples:
      "विधान सभा में नया विधान पास हुआ।": { "native": "A new law was passed in the legislative assembly.", "bases": {"सभा": "assembly", "पास": "to pass (a law)"} }
      "विधान बनाना सरकार का काम है।": { "native": "Making laws is the work of the government.", "bases": {} }
  "hi-2687":
    native: "illegal"
    notes:
      "n1": "Against the law, not allowed by it."
    examples:
      "यह काम गैरकानूनी है।": { "native": "This work is illegal.", "bases": {} }
      "गैरकानूनी शराब मत बेचो।": { "native": "Do not sell illegal liquor.", "bases": {"मत": "do not"} }
  "hi-2688":
    native: "legal; lawful"
    notes:
      "n1": "Allowed by law, or relating to the law."
    examples:
      "यह कानूनी सलाह है।": { "native": "This is legal advice.", "bases": {} }
      "सब कुछ कानूनी है।": { "native": "Everything is legal.", "bases": {"कानूनी": "legal"} }
  "hi-2689":
    native: "charge; accusation"
    notes:
      "n1": "A statement that someone has done something wrong."
    examples:
      "उस पर चोरी का आरोप है।": { "native": "He is charged with theft.", "bases": {"चोरी": "theft"} }
      "आरोप झूठा है।": { "native": "The charge is false.", "bases": {} }
  "hi-2690":
    native: "accused person"
    notes:
      "n1": "A person who is charged with a crime and is waiting for the court's decision."
    examples:
      "आरोपी अदालत में खड़ा है।": { "native": "The accused is standing in the court.", "bases": {"खड़ा": "standing"} }
      "आरोपी का नाम क्या है?": { "native": "What is the name of the accused?", "bases": {} }
  "hi-2691":
    native: "fault; guilt"
    notes:
      "n1": "Being responsible for a wrong, or a fault in a thing."
    examples:
      "इसमें किसका दोष है?": { "native": "Whose fault is this?", "bases": {"इसमें": "in this"} }
      "उसे दोष मत दो।": { "native": "Do not blame him.", "bases": {"मत": "do not"} }
  "hi-2692":
    native: "innocent"
    notes:
      "n1": "Not guilty of a wrong or a crime."
    examples:
      "वह निर्दोष है।": { "native": "He is innocent.", "bases": {} }
      "निर्दोष लोगों को सज़ा मत दो।": { "native": "Do not punish innocent people.", "bases": {"मत": "do not"} }
  "hi-2693":
    native: "justice (everyday word)"
    notes:
      "n1": "The everyday word for justice, the fair treatment of people."
    examples:
      "हमें इंसाफ़ चाहिए।": { "native": "We want justice.", "bases": {} }
      "इंसाफ़ के लिए लड़ो।": { "native": "Fight for justice.", "bases": {"लिए": "for", "लड़ो": "to fight"} }
  "hi-2694":
    native: "acquitted; set free after trial"
    notes:
      "n1": "Found not guilty by a court and let go."
    examples:
      "वह अदालत से बरी हो गया।": { "native": "He was acquitted by the court.", "bases": {} }
      "सब आरोपी बरी हुए।": { "native": "All the accused were acquitted.", "bases": {"बरी": "acquitted"} }
