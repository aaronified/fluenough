schema: 1
id: "hi-en-script-perso-arabic-digits"
kind: "layer"
core: "hi-script-perso-arabic-digits"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Perso-Arabic digits"
license: "CC-BY-SA-4.0"
description: "The ten digits of the Urdu script, ۰ (0) to ۹ (9), each with its Hindustani number word. Numbers still run from left to right, though the script runs from right to left, so ۲۱ (21) is read ۲ then ۱."
tags: ["beginner", "unreviewed", "script"]
cards:
  "hi-0735":
    native: "0 (zero)"
    notes:
      "n1": "A small dot or oval, written ۰ (0). Urdu says صفر (sifr), the Persian word for zero; Hindi says शून्य (śūnya)."
  "hi-0736":
    native: "1 (one)"
    notes:
      "n1": "A plain upright stroke, written ۱ (1). Easily mixed up with Devanagari १ (1), which has a flag at its top; the Urdu ۱ (1) has none."
  "hi-0737":
    native: "2 (two)"
    notes:
      "n1": "The digit of دو (dō, two). Read in a number from left to right: ۲۱ (21) is ۲ then ۱."
  "hi-0738":
    native: "3 (three)"
    notes:
      "n1": "The digit of تین (tīn, three)."
  "hi-0739":
    native: "4 (four)"
    notes:
      "n1": "The digit of چار (cār, four). Compare it with the Devanagari ४ (4), which looks like an 8."
  "hi-0740":
    native: "5 (five)"
    notes:
      "n1": "The digit of پانچ (pām̐c, five)."
  "hi-0741":
    native: "6 (six)"
    notes:
      "n1": "The digit of چھ (chah, six). The word is written with the do-cashmī he ھ (h), as in the aspirates."
  "hi-0742":
    native: "7 (seven)"
    notes:
      "n1": "The digit of سات (sāt, seven)."
  "hi-0743":
    native: "8 (eight)"
    notes:
      "n1": "The digit of آٹھ (āṭh, eight). The word has the do-cashmī he ھ (h), which the digit does not."
  "hi-0744":
    native: "9 (nine)"
    notes:
      "n1": "The digit of نو (nau, nine)."
