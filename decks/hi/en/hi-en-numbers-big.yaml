schema: 1
id: "hi-en-numbers-big"
kind: "layer"
core: "hi-numbers-big"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Tens and big numbers"
license: "CC0-1.0"
description: "Every number from 21 to 99, a hundred, a thousand, lakh and crore, and the halves every market uses. The numbers from 21 to 99 are not yet checked by a Hindi speaker: please report any mistake."
cards:
  "hi-0218":
    native: "30, thirty"
    notes:
      "n1": "Every number from 21 to 99 has its own word in Hindi: 26 is छब्बीस (chabbīs), not 'twenty six'. They are learned one at a time, and this deck teaches every one."
  "hi-0219":
    native: "40, forty"
  "hi-0220":
    native: "50, fifty"
  "hi-0221":
    native: "60, sixty"
  "hi-0222":
    native: "70, seventy"
  "hi-0223":
    native: "80, eighty"
  "hi-0224":
    native: "90, ninety"
  "hi-0225":
    native: "100, a hundred"
    notes:
      "n1": "दो सौ (dō sau) is 200, पाँच सौ (pām̐c sau) 500. A hundred on its own is सौ (sau) or एक सौ (ēk sau)."
  "hi-0226":
    native: "1,000, a thousand"
    notes:
      "n1": "दो हज़ार बीस (dō hazār bīs) is 2020."
  "hi-0227":
    native: "1,00,000, a lakh (a hundred thousand)"
    notes:
      "n1": "Indian numbering counts in lakhs and crores, and places its commas to match: 1,00,000 is one lakh, 10,00,000 ten lakh. Prices, salaries and populations are all given this way."
  "hi-0228":
    native: "1,00,00,000, a crore (ten million)"
    notes:
      "n1": "A hundred lakh. 1,00,00,000."
  "hi-0229":
    native: "1½, one and a half"
    notes:
      "n1": "With सौ (sau) and हज़ार (hazār) too: डेढ़ सौ (ḍēṛh sau) is 150, डेढ़ हज़ार (ḍēṛh hazār) 1,500. Heard constantly in markets."
  "hi-0230":
    native: "2½, two and a half"
    notes:
      "n1": "ढाई सौ (ḍhāī sau) is 250. From 3½ on, Hindi says साढ़े (sāṛhē, 'and a half'): साढ़े तीन सौ (sāṛhē tīn sau), 350."
  "hi-0523":
    native: "21, twenty-one"
    notes:
      "n1": "Each number from 21 to 99 is one word, the unit blended into the ten, often irregularly: learn them as words. Before the next ten comes उन- (un-), 'one less': उनतीस (untīs), 29."
