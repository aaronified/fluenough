schema: 1
id: "hi-en-about-me"
kind: "layer"
core: "hi-about-me"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "About me"
license: "CC-BY-SA-4.0"
description: "Your name, where you are from, where you live, and the people around you."
cards:
  "hi-0187":
    native: "name"
    notes:
      "n1": "नाम (nām, name) is masculine, so मेरा (mērā, my) takes the masculine form in मेरा नाम (mērā nām)."
  "hi-0191":
    native: "I live in … (said by a man)"
    notes:
      "n1": "A woman says रहती हूँ (rahtī hūm̐). में (mēm̐) is 'in', and comes after the place."
    bases:
      "मैं": "I"
      "रहता": "to live; to stay"
      "हूँ": "to be"
  "hi-0192":
    native: "home; house"
    notes:
      "n1": "घर (ghar) means both house and home; घर लौटना (ghar lauṭnā) means to come home, with no postposition."
    "examples": {
      "घर लौटना": {"native": "to come home", "bases": {"लौटना": "to return"}}
    }
  "hi-0193":
    native: "family"
    notes:
      "n1": "परिवार (parivār, family) takes the plural form परिवारों (parivārōm̐) before में (mēm̐, in), as in दोनों परिवारों में (dōnōm̐ parivārōm̐ mēm̐, in both families)."
    "examples": {
      "हमारा परिवार बड़ा है।": {"native": "Our family is big.", "bases": {"बड़ा": "big"}},
      "दोनों परिवारों में रिश्ता तय हुआ।": {"native": "A match was fixed between the two families.", "bases": {"दोनों": "both", "तय": "fixed", "परिवारों": "family"}}
    }
  "hi-0194":
    native: "work"
    notes:
      "n1": "काम (kām, work) is masculine and forms the verb काम करना (kām karnā, to work) with करना (karnā, to do)."
    "examples": {
      "काम करना": {"native": "to work", "bases": {"करना": "to do; to make"}}
    }
  "hi-0195":
    native: "city; town"
    "examples": {
      "हमें शहर घुमाओ।": {"native": "Show us round the city.", "bases": {"घुमाओ": "to show round", "शहर": "city"}}
    }
  "hi-0196":
    native: "country"
    notes:
      "n1": "में (mēm̐, in) follows देश (dēś, country) directly: देश में (dēś mēm̐, in the country)."
    "examples": {
      "देश में आपातकाल लगा।": {"native": "An emergency was declared in the country.", "bases": {"देश": "country"}}
    }
  "hi-0197":
    native: "language"
    notes:
      "n1": "भाषा (bhāśā, language) is feminine, so the adjective पुरानी (purānī, old) takes the feminine form."
    "examples": {
      "संस्कृत एक पुरानी भाषा है।": {"native": "Sanskrit is an old language.", "bases": {"संस्कृत": "Sanskrit", "एक": "one", "पुरानी": "old", "भाषा": "language"}}
    }
