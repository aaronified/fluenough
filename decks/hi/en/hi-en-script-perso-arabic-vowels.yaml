id: "hi-en-script-perso-arabic-vowels"
kind: "layer"
core: "hi-script-perso-arabic-vowels"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Perso-Arabic vowels and marks"
license: "CC-BY-SA-4.0"
description: "The short vowels, which are usually left unwritten, and the marks: the long vowels written with alif, vāo, ye and baṛī ye at the start of a word, the nasal nūn ġunna, the aspirate do-cashmī he, the hamza, the ʿain, the doubling mark and the izafat."
tags: ["unreviewed"]
cards:
  "hi-0681":
    native: "a, short, above the letter (zabar)"
    notes:
      "n1": "Written above the letter as the short a, and usually left unwritten: so کتاب (kitāb, book) is written k-t-ā-b, and the zabar appears only in teaching texts."
  "hi-0682":
    native: "i, short, below the letter (zer)"
    notes:
      "n1": "Written below the letter as the short i, and usually left unwritten, as the zabar is: بِ (bi) here, and in teaching texts."
  "hi-0683":
    native: "u, short, above the letter (pesh)"
    notes:
      "n1": "Written above the letter as the short u, and usually left unwritten, as the other two short vowels are: بُ (bu) here, and in teaching texts."
  "hi-0684":
    native: "ā, long, at the start of a word (alif madd)"
    notes:
      "n1": "Alif with a bar on top is the long a at the start of a word, where a plain ا (ā) would be read with a short vowel, as in اب (ab, now): آم (ām, mango)."
  "hi-0685":
    native: "ī, long, at the start of a word (alif with choṭī ye)"
    notes:
      "n1": "Alif followed by ی (ya) gives a long ī at the start of a word: ایمان (īmān, faith)."
  "hi-0686":
    native: "ū or ō, long, at the start of a word (alif with vāo)"
    notes:
      "n1": "Alif followed by و (va) gives a long ū or ō at the start of a word: اوپر (ūpar, above)."
  "hi-0687":
    native: "ē, long, at the start of a word (alif with baṛī ye)"
    notes:
      "n1": "Alif followed by ے (ē) gives a long ē at the start of a word: اے (ē, hey)."
  "hi-0688":
    native: "nasal vowel, at the end of a word (nūn ġunna)"
    notes:
      "n1": "The nūn ġunna is written as a dotless nūn at the end of a word, and the vowel before it is nasal, not followed by an n: ہاں (hām̐, yes)."
  "hi-0689":
    native: "aspirate, bh (do-cashmī he)"
    notes:
      "n1": "The do-cashmī he ھ (h) written after a letter makes it aspirate: بھ (bha), and کھ (kha) is the same with ک (ka). It is not said alone, as ہ (ha) is the plain h."
  "hi-0690":
    native: "a catch in the throat (hamza)"
    notes:
      "n1": "In Hindustani the hamza marks where one vowel follows another, usually sitting on a ye seat, as in جائے (jāe, may go); the catch it stands for in Arabic is hardly heard. It is drilled by reading and writing only."
  "hi-0691":
    native: "a vowel, in Hindustani (ʿain)"
    notes:
      "n1": "Arabic says the ʿain deep in the throat, but in Hindustani it is said as a plain vowel, so it is read a: عام (ām, common, general)."
  "hi-0692":
    native: "doubled consonant (tashdīd)"
    notes:
      "n1": "The tashdīd, a small mark over a consonant, says it twice, here bb: کُتّا (kuttā, dog). It is written only once in the letter shape, so the mark tells you to say the letter twice."
  "hi-0693":
    native: "prime minister (the izafat -e-)"
    notes:
      "n1": "The izafat is the -e- that joins two Persian words, written as a zer under the first: وزیرِ اعظم (vazīr-e azam, prime minister), with the zer under ر (ra)."
