id: "hi-en-grammar-needs"
kind: "layer"
core: "hi-grammar-needs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Need and want"
license: "CC0-1.0"
description: "चाहिए (cāhiē), ज़रूरत (zarūrat) and चाहना (cāhnā): saying what you need and what you want. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0460":
    native: "is needed; is wanted"
    notes:
      "n1": "It stays the same whoever needs it: मुझे (mujhē), तुम्हें (tumhēm̐), उसे (usē), आपको (āpkō) … चाहिए (cāhiē)."
  "hi-0461":
    native: "What do you need? (what a shopkeeper asks)"
  "hi-0462":
    native: "I don't need anything else."
    bases:
      "मुझे": "I"
      "कुछ": "something; anything"
  "hi-0463":
    native: "I don't need it, thanks."
  "hi-0464":
    native: "need"
  "hi-0465":
    native: "I need some help."
    notes:
      "n1": "'To me there is a need of help': the thing needed takes की (kī)."
    bases:
      "मुझे": "I"
  "hi-0466":
    native: "There's no need."
  "hi-0467":
    native: "I want a cup of tea. (said by a man)"
    notes:
      "n1": "A woman says चाहती हूँ (cāhtī hūm̐). चाहिए (cāhiē) is softer and more usual for asking."
    bases:
      "मैं": "I"
      "कप": "cup"
      "चाहता": "to want"
      "हूँ": "to be"
  "hi-0468":
    native: "She wants more time."
    bases:
      "वह": "he; she"
      "चाहती": "to want"
