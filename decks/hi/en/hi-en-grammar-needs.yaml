schema: 1
id: "hi-en-grammar-needs"
kind: "layer"
core: "hi-grammar-needs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Need and want"
license: "CC-BY-SA-4.0"
description: "चाहिए (cāhiē), ज़रूरत (zarūrat) and चाहना (cāhnā): saying what you need and what you want. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0460":
    native: "is needed; is wanted"
    notes:
      "n1": "It stays the same whoever needs it: मुझे (mujhē), तुम्हें (tumhēm̐), उसे (usē), आपको (āpkō) … चाहिए (cāhiē)."
    "examples": {
      "आपको क्या चाहिए?": {"native": "What do you need? (what a shopkeeper asks)", "bases": {}}
    }
  "hi-0461":
    native: "What do you need? (what a shopkeeper asks)"
    notes:
      "n1": "आपको (āpkō) is the polite you with को (kō): आपको (āpkō) क्या (kyā) चाहिए (cāhiē), what do you need?"
  "hi-0462":
    native: "I don't need anything else."
    notes:
      "n1": "कुछ (kuch) नहीं (nahīm̐) means nothing, and नहीं (nahīm̐) comes before चाहिए (cāhiē): मुझे (mujhē) और (aur) कुछ (kuch) नहीं (nahīm̐) चाहिए (cāhiē)."
    bases:
      "मुझे": "I"
      "कुछ": "something; anything"
  "hi-0463":
    native: "I don't need it, thanks."
    notes:
      "n1": "In a short answer the subject मुझे (mujhē) can be left out: नहीं (nahīm̐) चाहिए (cāhiē), I don't need it."
  "hi-0464":
    native: "need"
    notes:
      "n1": "ज़रूरत (zarūrat) is feminine, so the link is की (kī): मुझे (mujhē) मदद (madad) की (kī) ज़रूरत (zarūrat) है (hai), I need some help."
    "examples": {
      "ज़रूरत नहीं है।": {"native": "There's no need.", "bases": {}},
      "मुझे मदद की ज़रूरत है।": {"native": "I need some help.", "bases": {"मुझे": "I"}}
    }
  "hi-0465":
    native: "I need some help."
    notes:
      "n1": "'To me there is a need of help': the thing needed takes की (kī)."
    bases:
      "मुझे": "I"
  "hi-0466":
    native: "There's no need."
  "hi-0467":
    native: "I want a cup of tea. (said by a man)"
    notes:
      "n1": "A woman says चाहती हूँ (cāhtī hūm̐). चाहिए (cāhiē) is softer and more usual for asking."
    bases:
      "मैं": "I"
      "कप": "cup"
      "चाहता": "to want"
      "हूँ": "to be"
  "hi-0468":
    native: "She wants more time."
    notes:
      "n1": "वह (vah) means she here, and चाहती (cāhtī) takes the feminine ending: वह (vah) और (aur) समय (samay) चाहती (cāhtī) है (hai)."
    bases:
      "वह": "he; she"
      "चाहती": "to want"
