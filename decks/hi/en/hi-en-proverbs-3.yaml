cards:
  "hi-4300":
    native: "An idle mind is the devil's workshop."
    notes:
      "literal": "Word for word, 'an empty mind is the devil's house'; said that people with nothing to do get into trouble."
    bases:
      "ख़ाली": { meaning: "empty" }
      "दिमाग़": { meaning: "mind" }
      "शैतान": { meaning: "devil" }
      "का": { meaning: "of" }
      "घर": { meaning: "house" }
  "hi-4301":
    native: "Much ado about nothing; a big effort brings a tiny result."
    notes:
      "literal": "Word for word, 'dug a mountain, and out came a mouse'; said of a big effort that yields a tiny result."
    bases:
      "खोदा": { meaning: "dug" }
      "पहाड़": { meaning: "mountain" }
      "निकली": { meaning: "came out" }
      "चुहिया": { meaning: "mouse" }
  "hi-4302":
    native: "Innocent bystanders get hurt in a conflict."
    notes:
      "literal": "Word for word, 'along with the wheat, the weevil also gets ground'; said that the innocent suffer alongside the guilty."
    bases:
      "गेहूँ": { meaning: "wheat" }
