cards:
  "hi-5520":
    native: "My dream is to become a pilot."
    bases:
      "बनना": "to become"
    confusables:
      "w1": { why: "Soldier, not pilot: सैनिक (sainik) means soldier." }
      "w2": { why: "Artist, not pilot: कलाकार (kalākār) means artist; performer." }
  "hi-5521":
    native: "He gave an interview for the job."
    bases:
      "उसने": "he (ergative)"
      "नौकरी": "job"
      "के": "for"
      "लिए": "for"
      "दिया": "gave"
    confusables:
      "w1": { why: "Training, not interview: प्रशिक्षण (praśikśaṇ) means training." }
      "w2": { why: "Recruitment, not interview: भर्ती (bhartī) means recruitment; hiring." }
  "hi-5522":
    native: "My father is a businessman."
    bases:
      "मेरे": "my"
      "पिता": "father"
    confusables:
      "w1": { why: "Business, not a person: कारोबार (kārōbār) means business; trade." }
      "w2": { why: "Gardener, not businessman: माली (mālī) means gardener." }
  "hi-5523":
    native: "He works as a gardener in the garden."
    bases:
      "बाग़": "garden"
      "काम": "work"
      "करता": "works (does)"
    confusables:
      "w1": { why: "Sailor, not gardener: नाविक (nāvik) means sailor; boatman." }
      "w2": { why: "Labourer, not gardener: मजदूर (majdūr) means labourer." }
  "hi-5524":
    native: "Training is necessary for a new job."
    bases:
      "नई": "new"
      "नौकरी": "job"
      "के": "for"
      "लिए": "for"
      "ज़रूरी": "necessary"
    confusables:
      "w1": { why: "Progress, not training: उन्नति (unnati) means progress; advancement." }
      "w2": { why: "Skill, not training: कौशल (kauśal) means skill; expertise." }
  "hi-5525":
    native: "Success is difficult without skill."
    bases:
      "के": "without"
      "बिना": "without"
      "मुश्किल": "difficult"
    confusables:
      "w1": { why: "Failure, not success: असफलता (asphltā) means failure." }
      "w2": { why: "Dream, not success: सपना (sapnā) means dream." }
  "hi-5526":
    native: "Last year he was unemployed."
    bases:
      "पिछले": "last"
      "था": "was"
    confusables:
      "w1": { why: "Retired, not unemployed: सेवानिवृत्त (sēvānivritt) means retired." }
      "w2": { why: "Adviser, not unemployed: सलाहकार (salāhkār) means consultant; adviser." }
  "hi-5527":
    native: "The office attendant opened the office's door."
    bases:
      "ने": "(ergative)"
      "दफ़्तर": "office"
      "दरवाज़ा": "door"
      "खोला": "opened"
    confusables:
      "w1": { why: "Policeman, not peon: पुलिसवाला (pulisvālā) means policeman." }
      "w2": { why: "Businessman, not peon: व्यवसायी (vyavsāyī) means businessman; trader." }
  "hi-5528":
    native: "Both the pilot and the sailor work hard."
    bases:
      "दोनों": "both"
      "मेहनत": "hard work"
      "करते": "work (do)"
    confusables:
      "w1": { why: "Soldier, not sailor: सैनिक (sainik) means soldier." }
      "w2": { why: "Labourer, not sailor: मजदूर (majdūr) means labourer." }
  "hi-5529":
    native: "Business grows through the hard work of labourers."
    bases:
      "मजदूरों": "of labourers"
      "की": "of"
      "मेहनत": "hard work"
      "बढ़ता": "grows"
    confusables:
      "w1": { why: "Enterprise, close to business: उद्यम (udyam) means enterprise; venture." }
      "w2": { why: "Progress, not business: उन्नति (unnati) means progress; advancement." }
  "hi-5530":
    native: "After retiring, he became an adviser."
    bases:
      "होकर": "having become"
      "बना": "became"
    confusables:
      "w1": { why: "Unemployed, not retired: बेरोज़गार (bērōzgār) means unemployed." }
      "w2": { why: "Businessman, not adviser: व्यवसायी (vyavsāyī) means businessman; trader." }
  "hi-5531":
    native: "Success comes through skill."
    bases:
      "मिलती": "comes"
    confusables:
      "w1": { why: "Failure, not success: असफलता (asphltā) means failure." }
      "w2": { why: "Craft; skill, also a skill: हुनर (hunar) means skill; craft." }
