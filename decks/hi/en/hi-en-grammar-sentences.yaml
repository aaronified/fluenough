schema: 1
id: "hi-en-grammar-sentences"
kind: "layer"
core: "hi-grammar-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Basic sentences"
license: "CC0-1.0"
description: "Word order and the verb 'to be': the verb comes last."
cards:
  "hi-0145":
    native: "I am a student. (said by a man)"
    notes:
      "n1": "The verb comes last. 'To be' is हूँ (hūm̐) with मैं (maim̐), हो (hō) with तुम (tum), है (hai) with यह (yah) and वह (vah), हैं (haim̐) with हम (ham), आप (āp) and वे (vē). A woman says मैं छात्रा हूँ (chhatra)."
    bases:
      "मैं": "I"
      "हूँ": "to be"
  "hi-0146":
    native: "This is my house."
    bases:
      "यह": "this"
      "मेरा": "my"
  "hi-0147":
    native: "He is a doctor. / She is a doctor."
    notes:
      "n1": "वह (vah) is he, she and it: nothing in this sentence says which."
    bases:
      "वह": "he; she"
  "hi-0148":
    native: "I drink tea. (said by a man)"
    notes:
      "n1": "Subject, object, verb. A woman says पीती हूँ (pītī hūm̐)."
    bases:
      "मैं": "I"
      "हूँ": "to be"
  "hi-0149":
    native: "She is learning Hindi."
    notes:
      "n1": "Here the verb, रही (rahī), is what says it is a woman."
    bases:
      "वह": "he; she"
      "हिंदी": "Hindi"
      "सीख": "to learn"
      "रही": "to stay; to be (doing)"
  "hi-0150":
    native: "I like Hindi."
    notes:
      "n1": "Literally 'to me, Hindi is pleasing'. The person who likes takes को (kō), or its short form: मुझे (mujhē)."
    bases:
      "मुझे": "I"
      "हिंदी": "Hindi"
  "hi-0151":
    native: "I have a car."
    notes:
      "n1": "There is no verb 'to have' for things: 'near me there is a car'. For family: मेरे दो भाई हैं (mērē dō bhāī haim̐), I have two brothers."
    bases:
      "मेरे": "my"
      "गाड़ी": "car"
  "hi-0152":
    native: "This isn't good."
    notes:
      "n1": "नहीं (nahīm̐) comes just before the verb."
    bases:
      "यह": "this"
      "अच्छा": "good; nice"
  "hi-0153":
    native: "Please don't go."
    notes:
      "n1": "मत (mat) is 'don't' with a request; a statement takes नहीं (nahīm̐)."
    bases:
      "मत": "do not"
      "जाइए": "to go"
  "hi-0154":
    native: "It's very hot here."
    notes:
      "n1": "The weather has no 'it': 'here there is much heat'."
    bases:
      "बहुत": "very; a lot"
      "गर्मी": "heat; hot weather"
