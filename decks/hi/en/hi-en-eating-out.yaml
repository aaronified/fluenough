schema: 1
id: "hi-en-eating-out"
kind: "layer"
core: "hi-eating-out"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Eating out"
license: "CC-BY-SA-4.0"
description: "Ordering, asking for less spice, and paying the bill."
cards:
  "hi-0332":
    native: "food; a meal; to eat"
    notes:
      "n1": "As a verb, खाना (khānā) is 'to eat': खाना खाना (khānā khānā), to eat a meal."
    "examples": {
      "खाना बनाओ।": {"native": "Cook the food.", "bases": {"बनाओ": "to make", "खाना": "food; a meal; to eat"}}
    }
  "hi-0333":
    native: "water"
    "examples": {
      "थोड़ा पानी दीजिए।": {"native": "Some water, please.", "bases": {"थोड़ा": "a little; some"}},
      "पहले पानी उबालो।": {"native": "First boil the water.", "bases": {"उबालो": "to boil", "पानी": "water"}}
    }
  "hi-0334":
    native: "tea"
    notes:
      "n1": "Usually boiled with milk and sugar. Without sugar: बिना चीनी (binā cīnī)."
    "examples": {
      "आप चाय पिएँगे?": {"native": "Will you have tea?", "bases": {}}
    }
  "hi-0335":
    native: "flatbread; roti"
    "examples": {
      "रोटी पलटो।": {"native": "Turn the bread over.", "bases": {"पलटो": "to turn over", "रोटी": "flatbread; roti"}},
      "रोटी बेलो।": {"native": "Roll out the bread.", "bases": {"बेलो": "to roll out", "रोटी": "flatbread; roti"}}
    }
  "hi-0336":
    native: "I'd like …; I need …"
    notes:
      "n1": "The thing wanted goes in the gap: मुझे पानी चाहिए (mujhē pānī cāhiē), I'd like some water. Literally 'to me … is needed'."
    bases:
      "मुझे": "I"
  "hi-0337":
    native: "more; and"
    notes:
      "n1": "थोड़ा और (thōṛā aur), a little more. Between two words it means 'and': चाय और पानी (cāy aur pānī)."
    "examples": {
      "रोटी और दाल।": {"native": "Bread and lentils.", "bases": {}},
    }
  "hi-0338":
    native: "spicy (hot)"
    notes:
      "n1": "कम तीखा (kam tīkhā), less spicy. Asking is normal; the default can be very hot."
    "examples": {
      "अदरक तीखा है।": {"native": "Ginger is spicy.", "bases": {}},
      "अचार तीखा है।": {"native": "The pickle is spicy.", "bases": {"अचार": "pickle", "तीखा": "spicy"}},
    }
  "hi-0339":
    native: "sweet; a sweet"
    "examples": {
      "अंगूर मीठे हैं।": {"native": "Grapes are sweet.", "bases": {"मीठे": "sweet; a sweet"}}
    }
  "hi-0340":
    native: "vegetarian"
    notes:
      "n1": "Menus and signs say 'veg' and 'non-veg'. Packaged food carries a green mark if it is vegetarian and a brown one if not."
  "hi-0341":
    native: "The bill, please."
    notes:
      "n1": "Literally 'please bring the bill'."
    bases:
      "बिल": "bill"
      "लाइए": "to bring"
  "hi-0342":
    native: "It was very good."
    notes:
      "n1": "होना (hōnā) changes its stem in the past: थ- (th-)."
    bases:
      "बहुत": "very; a lot"
      "अच्छा": "good; nice"
      "था": "to be"
