      "w1": { why: "Coach; trainer, not gym: कोच (kōc) means coach; trainer." }
      "w2": { why: "Fitness, not gym: फ़िटनेस (fiṭnēs) means fitness." }
  "hi-5605":
    native: "India won the match."
    bases:
      "भारत": "India"
      "ने": "(ergative)"
      "मैच": "match"
      "जीता": "won"
    confusables:
      "w1": { why: "Defeat, not win: हार (hār) means defeat; loss." }
      "w2": { why: "Winner, a person: विजेता (vijētā) means winner; champion." }
  "hi-5606":
    native: "The coach is sad about the team's defeat."
    bases:
      "टीम": "team"
      "की": "of"
      "दुखी": "sad"
    confusables:
      "w1": { why: "Victory, not defeat: जीत (jīt) means victory; win." }
      "w2": { why: "Winner, not defeat: विजेता (vijētā) means winner; champion." }
  "hi-5607":
    native: "The players are running in the stadium."
