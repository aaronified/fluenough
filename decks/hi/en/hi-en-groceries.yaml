id: "hi-en-groceries"
kind: "layer"
core: "hi-groceries"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Groceries"
license: "CC-BY-SA-4.0"
description: "Vegetables, fish, meat, eggs and the staples."
cards:
  "hi-0249":
    native: "vegetable; a vegetable dish"
    notes:
      "n1": "Plural सब्ज़ियाँ (sabziyām̐). A सब्ज़ीवाला (sabzīvālā) sells them."
    "examples": {
      "सब्ज़ी का ठेला": {"native": "A vegetable cart.", "bases": {"सब्ज़ी": "vegetable; a vegetable dish"}},
      "सब्ज़ी गाढ़ी है।": {"native": "The vegetable is thick.", "bases": {"गाढ़ी": "thick", "सब्ज़ी": "vegetable; a vegetable dish"}}
    }
  "hi-0250":
    native: "potato"
    "examples": {
      "आलू छीलकर पकाओ।": {"native": "Peel the potatoes, then cook them.", "bases": {"छीलकर": "having peeled", "पकाओ": "to cook", "आलू": "potato"}}
    }
  "hi-0251":
    native: "onion"
    "examples": {
      "प्याज़ भूनो।": {"native": "Sauté the onions until brown.", "bases": {"भूनो": "to roast", "प्याज़": "onion"}},
      "प्याज़ और टमाटर काटो।": {"native": "Cut the onion and the tomato.", "bases": {"काटो": "to cut", "प्याज़": "onion"}}
    }
  "hi-0252":
    native: "tomato"
    "examples": {
      "प्याज़ और टमाटर काटो।": {"native": "Cut the onion and the tomato.", "bases": {"काटो": "to cut", "टमाटर": "tomato"}}
    }
  "hi-0253":
    native: "chilli"
    notes:
      "n1": "हरी मिर्च (harī mirc), green chillies, are often added free with vegetables if you ask."
  "hi-0254":
    native: "garlic"
  "hi-0255":
    native: "fish"
    "examples": {
      "तालाब में मछली है।": {"native": "There are fish in the pond.", "bases": {}}
    }
  "hi-0256":
    native: "mutton (goat meat)"
    notes:
      "n1": "In India 'mutton' almost always means goat, not sheep."
  "hi-0257":
    native: "chicken (as meat)"
    notes:
      "n1": "The bird is मुर्गा (murgā), a hen मुर्गी (murgī)."
  "hi-0258":
    native: "egg"
    notes:
      "n1": "Plural अंडे (aṇḍē). Eggs are often sold by the piece or by the dozen, दर्जन (darjan)."
    "examples": {
      "ताज़े अंडे लीजिए।": {"native": "Take fresh eggs.", "bases": {"ताज़े": "fresh", "अंडे": "egg"}}
    }
  "hi-0259":
    native: "milk"
    "examples": {
      "उबला दूध पियो।": {"native": "Drink the boiled milk.", "bases": {"उबला": "boiled", "पियो": "to drink", "दूध": "milk"}}
    }
  "hi-0260":
    native: "rice"
  "hi-0261":
    native: "lentils; dal"
    "examples": {
      "उसने दाल पकाई।": {"native": "She cooked the dal.", "bases": {"पकाई": "to cook", "दाल": "lentils"}},
      "दाल चखकर बताओ।": {"native": "Taste the dal and tell me.", "bases": {"चखकर": "to taste", "दाल": "lentils"}}
    }
