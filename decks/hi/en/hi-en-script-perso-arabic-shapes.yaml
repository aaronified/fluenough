schema: 1
id: "hi-en-script-perso-arabic-shapes"
kind: "layer"
core: "hi-script-perso-arabic-shapes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Perso-Arabic letter shapes"
license: "CC-BY-SA-4.0"
description: "How the letters join: each letter's shape at the start, in the middle and at the end of a word, with the tatweel line that shows the join. Letters that share a shape are told apart by their dots, and the letters that never join forward are marked."
tags: ["unreviewed"]
cards:
  "hi-0694":
    native: "be: start, middle and end forms (ba)"
    notes:
      "n1": "ب (ba) takes all three joined forms. پ (pa), ت (ta), ٹ (ṭa) and ث (sa) share its shape, and only the dots tell them apart. In بات (bāt, talk) it opens the word, and in کتاب (kitāb, book) it closes it."
  "hi-0695":
    native: "jīm: start, middle and end forms (ja)"
    notes:
      "n1": "ج (ja) takes all three joined forms, with one dot below. چ (ca), ح (ha) and خ (k͟ha) share its bowl, with three dots below, no dot, and one dot above. In جانا (jānā, to go) it opens the word."
  "hi-0696":
    native: "sīn: start, middle and end forms (sa)"
    notes:
      "n1": "س (sa) takes all three joined forms and is read sa, like ص (sa). ش (śa) has the same teeth with three dots above: شام (śām, evening)."
  "hi-0697":
    native: "ṣād: start, middle and end forms (sa)"
    notes:
      "n1": "ص (sa) has a loop and is read sa, like س (sa). ض (za), with a dot above the same loop, is read za: ضرور (zarūr, surely)."
  "hi-0698":
    native: "ṭoe: start, middle and end forms (ta)"
    notes:
      "n1": "ط (ta) takes all three joined forms and is read ta, like ت (ta). ظ (za), with a dot above, is the same shape read za: طالب (tālib, student)."
  "hi-0699":
    native: "ain: four forms (a)"
    notes:
      "n1": "ع (a) has four forms: alone, at the start, in the middle and at the end, and they look nothing alike. In عام (ām, common) it opens the word. غ (ġa) has the same forms with a dot above: غم (ġam, sorrow)."
  "hi-0700":
    native: "fe: start, middle and end forms (fa)"
    notes:
      "n1": "ف (fa) takes all three joined forms, with one dot above. ق (qa) has the same shape with two dots above: قلم (qalam, pen)."
  "hi-0701":
    native: "kāf: start, middle and end forms (ka)"
    notes:
      "n1": "ک (ka) takes all three joined forms. گ (ga) has the same shape with a stroke above it: گھر (ghar, house). In کتاب (kitāb, book) it opens the word."
  "hi-0702":
    native: "lām: start, middle and end forms (la)"
    notes:
      "n1": "ل (la) takes all three joined forms. In لڑکا (laṛkā, boy) it opens the word, and the word breaks after ڑ (ṛa), which does not join forward."
  "hi-0703":
    native: "mīm: start, middle and end forms (ma)"
    notes:
      "n1": "م (ma) takes all three joined forms. In موسم (mausam, weather) it has its first form at the start and its last form at the end."
  "hi-0704":
    native: "nūn: start, middle and end forms (na)"
    notes:
      "n1": "ن (na) takes all three joined forms, with one dot above, which tells it from ب (ba). In نیا (nayā, new) it opens the word."
  "hi-0705":
    native: "choṭī he: four forms (ha)"
    notes:
      "n1": "ہ (ha) is the letter with four shapes: alone, at the start, in the middle and at the end. In بہت (bahut, very) it sits in the middle, between ب (ba) and ت (ta)."
  "hi-0706":
    native: "choṭī ye: start, middle and end forms (ya)"
    notes:
      "n1": "ی (ya) takes all three joined forms, with two dots below. In نیا (nayā, new) it sits in the middle, between ن (na) and ا (ā)."
  "hi-0707":
    native: "baṛī ye: final form only (ē)"
    notes:
      "n1": "ے (ē) joins only to the letter before it, so it is written only at the end of a word: کے (ke, of)."
  "hi-0708":
    native: "lām-alif: one ligature (lā)"
    notes:
      "n1": "ل (la) and ا (ā) join into one shape, لا (lā), so the alif is not written as a separate letter. It is seen at the start of لال (lāl, red)."
  "hi-0709":
    native: "nine letters that never join forward (ā, da, ḍa, za, ra, ṛa, za, z͟ha, va)"
    notes:
      "n1": "alif, dāl, ḍāl, zāl, re, ṛe, ze, zhe and vāo join only to the letter before them, so the letter after one of them starts a new shape: لڑکا (laṛkā, boy), where ڑ (ṛa) is followed by ک (ka)."
