cards:
  "hi-5109":
    native: "Sit in the shade of the tree."
    confusables:
      "w1": { why: "Sunshine, not shade: धूप (dhūp) means sunshine." }
      "w2": { why: "Wind, not shade: हवा (havā) means wind; air." }
  "hi-5110":
    native: "There is little water in the desert."
    confusables:
      "w1": { why: "Sand, not desert: रेत (rēt) means sand." }
      "w2": { why: "Mountain, not desert: पहाड़ (pahāṛ) means mountain." }
  "hi-5111":
    native: "The flowers bloomed."
    confusables:
      "w1": { why: "To fall off, not bloom: झड़ना (jhaṛnā) means to fall off." }
      "w2": { why: "To sink, not bloom: डूबना (ḍūbnā) means to sink." }
  "hi-5112":
    native: "A plant grows from a seed."
    confusables:
      "w1": { why: "Bud, not seed: कली (kalī) means bud." }
      "w2": { why: "Root, not seed: जड़ (jaṛ) means root." }
  "hi-5113":
    native: "The river water is flowing."
    confusables:
      "w1": { why: "Stream, not river: धारा (dhārā) means stream." }
      "w2": { why: "Well, not river: कुआँ (kuām̐) means well." }
  "hi-5114":
    native: "Grass does not grow on the rock."
    confusables:
      "w1": { why: "Leaf, not grass: पत्ता (pattā) means leaf." }
      "w2": { why: "Flower, not grass: फूल (phūl) means flower." }
  "hi-5115":
    native: "The sun has set."
    confusables:
      "w1": { why: "To fly, not set: उड़ना (uṛnā) means to fly." }
      "w2": { why: "To bloom, not set: खिलना (khilnā) means to bloom." }
  "hi-5116":
    native: "Leaves fly in the wind."
    confusables:
      "w1": { why: "To spread, not fly: फैलना (phailnā) means to spread." }
      "w2": { why: "To fall off, not fly: झड़ना (jhaṛnā) means to fall off." }
  "hi-5117":
    native: "The waterfall's water is cold."
    confusables:
      "w1": { why: "Hot, not cold: गरम (garam) means hot." }
      "w2": { why: "Sweet, not cold: मीठा (mīṭhā) means sweet." }
  "hi-5118":
    native: "The pit is very deep."
    confusables:
      "w1": { why: "Mound, not pit: टीला (ṭīlā) means mound; small hill." }
      "w2": { why: "Stone, not pit: पत्थर (patthar) means stone." }
  "hi-5119":
    native: "A lion lives in the forest."
    confusables:
      "w1": { why: "Desert, not forest: रेगिस्तान (rēgistān) means desert." }
      "w2": { why: "Mountain, not forest: पहाड़ (pahāṛ) means mountain." }
  "hi-5120":
    native: "The smoke spread across the sky."
    confusables:
      "w1": { why: "Fire, not smoke: आग (āg) means fire." }
      "w2": { why: "Shade, not smoke: छाया (chāyā) means shade; shadow." }
  "hi-5121":
    native: "Smoke comes out of the fire."
    confusables:
      "w1": { why: "Shade, not smoke: छाया (chāyā) means shade." }
      "w2": { why: "Stone, not smoke: पत्थर (patthar) means stone." }
  "hi-5122":
    native: "Don't climb on the rock."
    bases:
      "मत": "do not"
    confusables:
      "w1": { why: "Sand, not rock: रेत (rēt) means sand." }
      "w2": { why: "Stone, not rock: पत्थर (patthar) means stone." }
