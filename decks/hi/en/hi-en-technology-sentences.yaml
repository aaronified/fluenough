cards:
  "hi-5384":
    native: "This new technology is very useful."
    bases:
      "नई": "new (feminine)"
      "उपयोगी": "useful"
    confusables:
      "w1": { why: "Machine, not technology: मशीन (maśīn) means machine." }
      "w2": { why: "Device or tool: उपकरण (upkraṇ) means device; tool; equipment." }
  "hi-5385":
    native: "My phone is like a robot."
    bases:
      "मेरा": "my (masculine)"
      "फ़ोन": "phone"
      "जैसा": "like (masculine)"
    confusables:
      "w1": { why: "Machine: मशीन (maśīn) means machine." }
      "w2": { why: "Sensor, not robot: सेंसर (sēṁsar) means sensor." }
  "hi-5386":
    native: "Please press the button."
    bases:
      "कृपया": "please"
      "दबाइए": "press (polite)"
    confusables:
      "w1": { why: "Switch, not button: स्विच (svic) means switch." }
      "w2": { why: "Bulb, not button: बल्ब (balb) means bulb." }
  "hi-5387":
    native: "The data on the website is safe."
    bases:
      "सुरक्षित": "safe; secure"
    confusables:
      "w1": { why: "Server, not website: सर्वर (sarvar) means server." }
      "w2": { why: "Software, not data: सॉफ़्टवेयर (sôfṭavēyar) means software." }
  "hi-5388":
    native: "The server is down."
    bases:
      "बंद": "closed; off"
    confusables:
      "w1": { why: "Code, not server: कोड (kōḍ) means code." }
      "w2": { why: "Data, not server: डेटा (ḍēṭā) means data." }
  "hi-5389":
    native: "My battery runs on solar energy."
    bases:
      "मेरी": "my (feminine)"
      "बैटरी": "battery"
      "चलती": "runs"
    confusables:
      "w1": { why: "Bulb, not battery: बल्ब (balb) means bulb." }
      "w2": { why: "Sensor: सेंसर (sēṁsar) means sensor." }
  "hi-5390":
    native: "A new post appeared on the blog."
    bases:
      "नई": "new (feminine)"
      "आई": "appeared"
    confusables:
      "w1": { why: "Chat, not blog: चैट (caiṭ) means chat." }
      "w2": { why: "Media, not blog: मीडिया (mīḍiyā) means media." }
  "hi-5391":
    native: "The scientist made a new discovery."
    bases:
      "ने": "(marks the doer)"
      "नई": "new (feminine)"
    confusables:
      "w1": { why: "Invention, not discovery: आविष्कार (āviśkār) means invention." }
      "w2": { why: "Robot, not scientist: रोबोट (rōbōṭ) means robot." }
  "hi-5392":
    native: "This programme is smart."
    confusables:
      "w1": { why: "Software, not programme: सॉफ़्टवेयर (sôfṭavēyar) means software." }
      "w2": { why: "Code: कोड (kōḍ) means code." }
  "hi-5393":
    native: "There is a mistake in the code."
    bases:
      "गलती": "mistake"
    confusables:
      "w1": { why: "Programme, not code: प्रोग्राम (prōgrām) means programme." }
      "w2": { why: "Server, not code: सर्वर (sarvar) means server." }
  "hi-5394":
    native: "News from the media came through chat."
    bases:
      "आई": "came"
    confusables:
      "w1": { why: "Blog, not chat: ब्लॉग (blôg) means blog." }
      "w2": { why: "Post or entry, not chat: पोस्ट (pōsṭ) means post; entry." }
  "hi-5395":
    native: "The invention is not very old."
    confusables:
      "w1": { why: "Discovery, not invention: खोज (khōj) means discovery; search." }
      "w2": { why: "New, the opposite: नया (nayā) means new." }
