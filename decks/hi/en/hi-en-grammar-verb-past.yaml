native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs: the past"
description: "Every verb the course teaches, in the simple past, for a man or a woman and for one or many. The forms are written in Devanagari for now. Not yet checked by a Hindustani speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "m-sg": "past, masculine singular (he, or I or you as a man)"
    "f-sg": "past, feminine singular (she, or I or you as a woman)"
    "m-pl": "past, masculine plural (they, we, you respectful, men or a mixed group)"
    "f-pl": "past, feminine plural (women)"
rules:
  "hi-rule-past-masc":
    name: "-ा (-ā), -े (-ē): did, masculine"
    explanation: "The past form agrees with the subject (an intransitive verb) or with the object (a transitive verb, whose doer takes ने (nē)). For a man the stem takes {1} for one and {2} for many, but common verbs are irregular: {3}, to do, gives {4} and {5}; {6}, to go, gives {7}."
  "hi-rule-past-fem":
    name: "-ी (-ī), -ीं (-īm̐): did, feminine"
    explanation: "For a woman the stem takes {1} for one and {2} for many: {3}, to do, gives {4} and {5}; {6}, to go, gives {7}. The ending does not change with the person: I, you and she all use the same form."
