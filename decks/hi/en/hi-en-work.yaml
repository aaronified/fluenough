description: "Jobs, the workplace, and how to ask and say what someone does. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0399":
    native: "job (employment)"
    notes:
      "n1": "मैं नौकरी करता हूँ (maim̐ naukrī kartā hūm̐), I have a job. काम (kām) is work of any kind."
  "hi-0400":
    native: "office"
    notes:
      "n1": "Also ऑफ़िस (ôfis), from English."
  "hi-0401":
    native: "teacher"
    notes:
      "n1": "A woman teacher is अध्यापिका (adhyāpikā). In speech, often टीचर (ṭīcar)."
  "hi-0402":
    native: "shopkeeper"
  "hi-0403":
    native: "driver"
  "hi-0404":
    native: "engineer"
  "hi-0405":
    native: "lawyer"
  "hi-0406":
    native: "nurse"
  "hi-0407":
    native: "farmer"
  "hi-0408":
    native: "cook"
  "hi-0409":
    native: "writer"
    notes:
      "n1": "A woman writer is लेखिका (lēkhikā)."
  "hi-0410":
    native: "journalist"
  "hi-0411":
    native: "student"
    notes:
      "n1": "A woman student is छात्रा (chātrā, ending in a long a)."
  "hi-0412":
    native: "day off; holiday; leave"
    notes:
      "n1": "आज मेरी छुट्टी है (āj mērī chuṭṭī hai), I have the day off today."
  "hi-0413":
    native: "salary; pay"
    notes:
      "n1": "Formally वेतन (vētan)."
  "hi-0414":
    native: "business; trade"
  "hi-0415":
    native: "What do you do (for a living)?"
    notes:
      "n1": "To a woman: आप क्या करती हैं (āp kyā kartī haim̐)?"
    bases:
      "करते": "to do; to make"
  "hi-0416":
    native: "I'm a teacher."
    bases:
      "मैं": "I"
      "हूँ": "to be"
  "hi-0417":
    native: "Where do you work?"
    bases:
      "करते": "to do; to make"
  "hi-0418":
    native: "I work in an office. (said by a man)"
    notes:
      "n1": "A woman says काम करती हूँ (kām kartī hūm̐)."
    bases:
      "मैं": "I"
      "करता": "to do; to make"
      "हूँ": "to be"
