cards:
  "hi-5810":
    native: "My income is low."
    bases:
      "मेरी": "my (feminine)"
      "है": "is"
    confusables:
      "w1": { why: "Earnings, not income: कमाई (kamāī) means earnings." }
      "w2": { why: "Profit, not income: लाभ (lābh) means profit." }
  "hi-5811":
    native: "First, make a budget."
    bases:
      "बनाइए": "make (polite)"
    confusables:
      "w1": { why: "Credit or loan, not budget: उधार (udhār) means credit or loan." }
      "w2": { why: "Donation, not budget: चंदा (candā) means donation." }
  "hi-5812":
    native: "Reduce your spending."
    bases:
      "कीजिए": "do (polite)"
    confusables:
      "w1": { why: "Income, not spending: आमदनी (āmdnī) means income." }
      "w2": { why: "Profit, not spending: लाभ (lābh) means profit." }
  "hi-5813":
    native: "I borrowed money from a friend."
    bases:
      "मैंने": "I (agent)"
      "लिया": "took, borrowed"
    confusables:
      "w1": { why: "Donation, not loan: चंदा (candā) means donation." }
      "w2": { why: "Loss, not loan: नुकसान (nuksān) means loss." }
  "hi-5814":
    native: "We made a profit this year."
    bases:
      "इस": "this (oblique)"
      "हमें": "we (dative)"
      "हुआ": "happened (masculine)"
    confusables:
      "w1": { why: "Loss in money, not profit: घाटा (ghāṭā) means loss in money." }
      "w2": { why: "Loss, not profit: नुकसान (nuksān) means loss or harm." }
  "hi-5815":
    native: "He suffered a loss."
    bases:
      "हुआ": "happened (masculine)"
    confusables:
      "w1": { why: "Loss in money, a close word: घाटा (ghāṭā) means loss in money." }
      "w2": { why: "Profit, not loss: लाभ (lābh) means profit." }
  "hi-5816":
    native: "Wastefulness is not good."
    bases:
      "अच्छी": "good (feminine)"
      "है": "is"
    confusables:
      "w1": { why: "Thrift, not wastefulness: किफ़ायत (kifāyat) means thrift or economy." }
      "w2": { why: "Stingy, not wasteful: कंजूस (kañjūs) means miserly or stingy." }
  "hi-5817":
    native: "When will the wages be paid?"
    bases:
      "मिलेगी": "will be received (feminine)"
    confusables:
      "w1": { why: "Donation, not wages: चंदा (candā) means donation." }
      "w2": { why: "Wealth, not wages: दौलत (daulat) means wealth or riches." }
  "hi-5818":
    native: "He is very stingy."
    bases:
      "है": "is"
    confusables:
      "w1": { why: "Thrift, not stingy: किफ़ायत (kifāyat) means thrift or economy." }
      "w2": { why: "Wastefulness, not stingy: फ़िज़ूलख़र्ची (fizūlk͟harcī) means wastefulness." }
  "hi-5819":
    native: "Spend thriftily."
    bases:
      "कीजिए": "do (polite)"
    confusables:
      "w1": { why: "Wastefulness, not thrift: फ़िज़ूलख़र्ची (fizūlk͟harcī) means wastefulness." }
      "w2": { why: "Income, not spending: आमदनी (āmdnī) means income." }
  "hi-5820":
    native: "He has a lot of wealth."
    bases:
      "उसके": "his (oblique)"
      "है": "is"
    confusables:
      "w1": { why: "Bankrupt, not wealthy: दिवालिया (divāliyā) means bankrupt." }
      "w2": { why: "Capital, not wealth: पूँजी (pūm̐jī) means capital or savings." }
  "hi-5821":
    native: "Give a donation today."
    bases:
      "दीजिए": "give (polite)"
    confusables:
      "w1": { why: "Wages, not donation: मज़दूरी (mazdūrī) means wages." }
      "w2": { why: "Profit, not donation: लाभ (lābh) means profit." }
