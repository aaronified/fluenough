description: "Left, right, straight on, and asking where something is."
cards:
  "hi-0286":
    native: "Where is …?"
    notes:
      "n1": "Put the place first: स्टेशन कहाँ है (sṭēśan kahām̐ hai)? Where is the station?"
  "hi-0287":
    native: "right; to the right"
    notes:
      "n1": "Also दाहिने (dāhinē). दाएँ मुड़िए (dāēm̐ muṛiē), turn right."
  "hi-0288":
    native: "left; to the left"
  "hi-0289":
    native: "straight on"
  "hi-0290":
    native: "please turn"
  "hi-0291":
    native: "ahead; further on"
  "hi-0292":
    native: "behind; back"
  "hi-0293":
    native: "near"
    notes:
      "n1": "स्टेशन के पास (sṭēśan kē pās), near the station."
  "hi-0294":
    native: "far"
    notes:
      "n1": "कितनी दूर है (kitnī dūr hai)? How far is it?"
  "hi-0295":
    native: "here"
  "hi-0296":
    native: "there"
  "hi-0297":
    native: "way; route"
    notes:
      "n1": "रास्ता बताइए (rāstā batāiē), please tell me the way."
  "hi-0298":
    native: "road; street"
