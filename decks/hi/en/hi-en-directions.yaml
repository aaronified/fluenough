schema: 1
id: "hi-en-directions"
kind: "layer"
core: "hi-directions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Directions"
license: "CC-BY-SA-4.0"
description: "Left, right, straight on, and asking where something is."
cards:
  "hi-0286":
    native: "Where is …?"
    notes:
      "n1": "Put the place first: स्टेशन कहाँ है (sṭēśan kahām̐ hai)? Where is the station?"
  "hi-0287":
    native: "right; to the right"
    notes:
      "n1": "Also दाहिने (dāhinē). दाएँ मुड़िए (dāēm̐ muṛiē), turn right."
  "hi-0288":
    native: "left; to the left"
  "hi-0289":
    native: "straight on"
    "examples": {
      "सीधे घर जाओ।": {"native": "Go straight home.", "bases": {"जाओ": "to go"}},
      "वह सीधे बाज़ार गया।": {"native": "He went straight to the market.", "bases": {"बाज़ार": "market", "गया": "to go"}}
    }
  "hi-0290":
    native: "please turn"
  "hi-0291":
    native: "ahead; further on"
    "examples": {
      "आगे बढ़ाओ।": {"native": "Move ahead.", "bases": {"बढ़ाओ": "to increase", "आगे": "ahead; further on"}}
    }
  "hi-0292":
    native: "behind; back"
    "examples": {
      "हर कहावत के पीछे एक अनुभव होता है।": {"native": "Behind every proverb there is an experience.", "bases": {"हर": "every; each", "कहावत": "proverb", "पीछे": "behind; back"}}
    }
  "hi-0293":
    native: "near"
    notes:
      "n1": "स्टेशन के पास (sṭēśan kē pās), near the station."
  "hi-0294":
    native: "far"
    notes:
      "n1": "कितनी दूर है (kitnī dūr hai)? How far is it?"
    "examples": {
      "एयरपोर्ट दूर है।": {"native": "The airport is far.", "bases": {"दूर": "far"}},
      "बुराई से दूर रहो।": {"native": "Stay away from evil.", "bases": {"दूर": "far"}}
    }
  "hi-0295":
    native: "here"
    "examples": {
      "यहाँ बैठिए।": {"native": "Please sit here.", "bases": {"बैठिए": "to sit"}},
      "यहाँ रोकिए।": {"native": "Stop here, please.", "bases": {"रोकिए": "to stop"}}
    }
  "hi-0296":
    native: "there"
    "examples": {
      "हमारा संवाददाता वहाँ है।": {"native": "Our correspondent is there.", "bases": {"वहाँ": "there"}},
      "मैं कई बार वहाँ गया हूँ।": {"native": "I have been there several times.", "bases": {"कई": "several", "बार": "time, occasion", "गया": "to go"}}
    }
  "hi-0297":
    native: "way; route"
    notes:
      "n1": "रास्ता बताइए (rāstā batāiē), please tell me the way."
    "examples": {
      "उसने मुझसे रास्ता पूछा।": {"native": "He asked me the way.", "bases": {}}
    }
  "hi-0298":
    native: "road; street"
