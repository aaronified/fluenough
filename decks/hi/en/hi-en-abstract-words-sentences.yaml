cards:
  "hi-5798":
    native: "Honesty is the greatest virtue."
    bases:
      "सबसे": "most (of all)"
      "है": "is"
    confusables:
      "w1": { why: "Truth, not honesty: सत्य (saty) means truth." }
      "w2": { why: "Hope, not honesty: उम्मीद (ummīd) means hope." }
  "hi-5799":
    native: "Truth will win."
    bases:
      "की": "of (feminine)"
      "होगी": "will be (feminine)"
    confusables:
      "w1": { why: "Imagination, not truth: कल्पना (kalpanā) means imagination." }
      "w2": { why: "Honesty, not truth: ईमानदारी (īmāndārī) means honesty." }
  "hi-5800":
    native: "Do not give up hope."
    bases:
      "मत": "do not"
      "छोड़िए": "give up (polite)"
    confusables:
      "w1": { why: "Sorrow, not hope: दुख (dukh) means sorrow." }
      "w2": { why: "Contentment, not hope: संतोष (santōś) means contentment." }
  "hi-5801":
    native: "What is its meaning?"
    bases:
      "इसका": "its"
      "है": "is"
    confusables:
      "w1": { why: "Reason, not meaning: कारण (kāraṇ) means reason or cause." }
      "w2": { why: "Convenience, not meaning: सुविधा (suvidhā) means convenience." }
  "hi-5802":
    native: "I should have patience."
    bases:
      "मुझे": "me (dative)"
      "रखना": "keep, have"
    confusables:
      "w1": { why: "Courage, not patience: साहस (sāhas) means courage." }
      "w2": { why: "Relation, not patience: संबंध (sambandh) means relation." }
  "hi-5803":
    native: "His temperament is very good."
    bases:
      "है": "is"
    confusables:
      "w1": { why: "Nature, not temperament: प्रकृति (prakriti) means nature." }
      "w2": { why: "Morality, not temperament: नैतिकता (naitiktā) means morality or ethics." }
  "hi-5804":
    native: "I will help you."
    bases:
      "आपकी": "your (respectful)"
      "करूँगा": "will do (masculine)"
    confusables:
      "w1": { why: "Friend, not help: दोस्त (dōst) means friend." }
      "w2": { why: "People, not help: लोग (lōg) means people." }
  "hi-5805":
    native: "Do not waste the opportunity."
    bases:
      "मत": "do not"
      "गँवाइए": "waste, lose (polite)"
    confusables:
      "w1": { why: "Importance, not opportunity: महत्व (mahatv) means importance." }
      "w2": { why: "Possibility, not opportunity: संभावना (sambhāvnā) means possibility or chance." }
  "hi-5806":
    native: "Its importance is great."
    bases:
      "इसका": "its"
      "है": "is"
    confusables:
      "w1": { why: "Meaning, not importance: अर्थ (arth) means meaning." }
      "w2": { why: "Purpose, not importance: उद्देश्य (uddēśy) means purpose or aim." }
  "hi-5807":
    native: "What is the cause of the problem?"
    bases:
      "है": "is"
    confusables:
      "w1": { why: "Principle, not cause: सिद्धांत (siddhānt) means principle or theory." }
      "w2": { why: "Influence, not cause: प्रभाव (prabhāv) means influence or effect." }
  "hi-5808":
    native: "He takes pride in his work."
    bases:
      "उसे": "to him"
      "अपने": "own (oblique)"
      "है": "is"
    confusables:
      "w1": { why: "Anger, not pride: क्रोध (krōdh) means anger." }
      "w2": { why: "Ego, not pride: अहंकार (ahaṅkār) means ego or arrogance." }
  "hi-5809":
    native: "Do not change your principles."
    bases:
      "मत": "do not"
      "बदलिए": "change (polite)"
    confusables:
      "w1": { why: "Quality, not principle: गुण (guṇ) means quality or virtue." }
      "w2": { why: "Religion, not principle: धर्म (dharm) means religion or duty." }
