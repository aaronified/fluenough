name: "Months and years"
license: "CC0-1.0"
description: "The months as Hindi says them, and how to read a year."
cards:
  "hi-0317":
    native: "month"
    notes:
      "n1": "The Gregorian months are used for almost everything; the Hindu calendar's months matter mainly for festivals."
  "hi-0318":
    native: "year"
    notes:
      "n1": "Years before 2000 are read in hundreds: 1950 is उन्नीस सौ पचास (unnīs sau pacās), 'nineteen hundred fifty'. From 2000, in thousands: 2020 is दो हज़ार बीस (dō hazār bīs)."
  "hi-0319":
    native: "date"
    notes:
      "n1": "आज कौन-सी तारीख़ है (āj kaun-sī tārīk͟h hai)? What's the date today?"
  "hi-0320":
    native: "January"
    notes:
      "n1": "The months come from English. Speakers differ on their gender, so the verb may agree either way."
