name: "Present tense"
license: "CC-BY-SA-4.0"
description: "I go, she speaks: the everyday present, by person and gender."
table:
  slot_name: "person and gender"
  slots:
    "i-m": "I, masculine"
    "i-f": "I, feminine"
    "you-m": "you, informal, masculine"
    "you-f": "you, informal, feminine"
    "he-m": "he or she, masculine"
    "he-f": "he or she, feminine"
    "we-m": "we, masculine"
    "we-f": "we, feminine"
    "formal-m": "you, formal, masculine"
    "formal-f": "you, formal, feminine"
