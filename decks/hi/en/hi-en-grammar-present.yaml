    "they-f": "they, feminine"
rules:
  "hi-rule-present":
    name: "-ता (-tā), -ती (-tī), -ते (-tē): the present"
    explanation: "The verb's stem, then -ता (-tā), -ती (-tī) or -ते (-tē) for the doer's gender and number, then हूँ (hūm̐), हो (hō), है (hai) or हैं (haim̐). वह (vah), हम (ham), आप (āp) and वे (vē) do not show gender; the verb does. जाता हूँ (jātā hūm̐), I go; जाती हो (jātī hō), you go (she); जाते हैं (jātē haim̐), we go. One form serves for a habit and for what is happening in general."
