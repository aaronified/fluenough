  hi-4055:
    native: 'How unlucky Zafar is: in his beloved''s street he could not get even two yards of ground to be buried in.'
    notes:
      n1: A couplet of Bahadur Shah Zafar, quoted on the Hindi Wikipedia page about him, a lament about his burial.
