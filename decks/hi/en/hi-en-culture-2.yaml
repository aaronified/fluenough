      धुआँ: smoke
      सा: like
      कहाँ: where
  hi-4051:
    native: There are many fine poets in the world, but people say Ghalib has a style of his own.
    notes:
      n1: A couplet of Ghalib, quoted on the Hindi Wikipedia page about him, on the poet's own style.
