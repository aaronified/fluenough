cards:
  hi-4050:
    native: 'Look: does this smoke rise from the heart or from the soul; where does it rise from?'
    notes:
      n1: A couplet of Mir Taqi Mir, quoted on the Hindi Wikipedia page about him and read on Urdu Wikisource.
