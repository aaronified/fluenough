  hi-4056:
    native: Dear one, what does your pride know of another's heart-pain; what does the falcon understand of what passes in the prey's heart?
    notes:
      n1: A couplet of Sauda, quoted on the Hindi Wikipedia page about him, on the falcon and its prey.
