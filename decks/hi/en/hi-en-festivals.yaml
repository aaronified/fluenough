schema: 1
id: "hi-en-festivals"
kind: "layer"
core: "hi-festivals"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Festivals"
license: "CC-BY-SA-4.0"
description: "Festivals and celebrations: the names of the festivals, their lamps and sweets, and the words of a celebration. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-1298":
    native: "festival"
    notes:
      "n1": "Sanskrit-leaning: उत्सव (utsav) is the same idea and is also used in formal Hindi."
    examples:
      "हर त्योहार पर घर सजता है।": { native: "On every festival the house is decorated.", bases: { "हर": "every", "सजता": "to be decorated; to dress up" } }
      "त्योहार में सब खुश होते हैं।": { native: "At festivals everyone is happy.", bases: {} }
  "hi-1299":
    native: "celebration; festival"
    notes:
      "n1": "A formal or Sanskrit-leaning word; in speech त्योहार (tyōhār) is more common."
    examples:
      "यह एक बड़ा उत्सव है।": { native: "This is a big celebration.", bases: {} }
      "शहर में रोज़ उत्सव है।": { native: "There is a celebration in the city every day.", bases: {} }
  "hi-1300":
    native: "Diwali"
    notes:
      "n1": "The festival of lights, in autumn. The lamps are the दीये (dīye)."
    examples:
      "दिवाली पर दीये जलते हैं।": { native: "On Diwali, lamps are lit.", bases: { "जलते": "to burn; to light up" } }
      "दिवाली में मिठाई बाँटते हैं।": { native: "At Diwali people give out sweets.", bases: {} }
  "hi-1301":
    native: "Holi"
    notes:
      "n1": "The spring festival of colours, when people throw coloured powder."
    examples:
      "होली में लोग रंग खेलते हैं।": { native: "At Holi people play with colours.", bases: {} }
      "होली का दिन मज़ेदार है।": { native: "The day of Holi is fun.", bases: { "मज़ेदार": "fun; enjoyable" } }
  "hi-1302":
    native: "Eid"
    notes:
      "n1": "The festival at the end of the fast of रोज़ा (rōzā)."
    examples:
      "ईद मुबारक!": { native: "Happy Eid!", bases: {} }
      "ईद पर सेवई बनती है।": { native: "On Eid, sevai is made.", bases: { "बनती": "to be made" } }
  "hi-1303":
    native: "Dussehra"
    notes:
      "n1": "Marks the victory of good over evil, and burning of Ravana's effigy. Before a postposition the stem changes: दशहरे पर (dashahre par), on Dussehra."
    examples:
      "दशहरे पर रावण जलता है।": { native: "On Dussehra the effigy of Ravana burns.", bases: { "दशहरे": "Dussehra", "रावण": "Ravana", "जलता": "to burn" } }
      "दशहरा बुराई पर अच्छाई की जीत है।": { native: "Dussehra is the victory of good over evil.", bases: { "बुराई": "evil", "अच्छाई": "goodness", "की": "of (f)", "जीत": "victory" } }
  "hi-1304":
    native: "Eid al-Adha"
    notes:
      "n1": "The festival that follows the Hajj."
    examples:
      "बकरीद पर लोग दावत देते हैं।": { native: "On Bakrid people give feasts.", bases: {} }
      "बकरीद का त्योहार बड़ा है।": { native: "The festival of Bakrid is big.", bases: {} }
  "hi-1305":
    native: "Christmas"
    notes:
      "n1": "An English word, used in Hindi."
    examples:
      "क्रिसमस पर सब केक बनाते हैं।": { native: "At Christmas everyone makes cake.", bases: { "बनाते": "to make" } }
      "क्रिसमस की रात सुंदर होती है।": { native: "The night of Christmas is beautiful.", bases: { "की": "of (f)" } }
  "hi-1306":
    native: "Gurpurab (Sikh festival)"
    notes:
      "n1": "The celebration of a Sikh guru's birth or death anniversary."
    examples:
      "गुरपुरब पर गुरुद्वारे में भजन होता है।": { native: "At Gurpurab there are hymns at the gurdwara.", bases: {} }
      "गुरपुरब पर जुलूस निकलता है।": { native: "At Gurpurab a procession goes out.", bases: { "निकलता": "to come out" } }
  "hi-1307":
    native: "worship; puja"
    notes:
      "n1": "The prayers and offerings made to a god at home or in a temple."
    examples:
      "सुबह पूजा होती है।": { native: "There is worship in the morning.", bases: {} }
      "घर में पूजा की तैयारी है।": { native: "There is preparation for worship at home.", bases: { "की": "of (f)" } }
  "hi-1308":
    native: "oil lamp"
    notes:
      "n1": "The plural is दीये (dīye)."
    examples:
      "छत पर दीया जलाओ।": { native: "Light a lamp on the roof.", bases: {} }
      "हर घर में दीये हैं।": { native: "There are lamps in every house.", bases: { "हर": "every", "दीये": "oil lamp" } }
  "hi-1309":
    native: "colour"
    notes:
      "n1": "In Holi, the coloured powder itself."
    examples:
      "होली के रंग चमकीले हैं।": { native: "The colours of Holi are bright.", bases: { "के": "of (oblique plural)", "चमकीले": "bright" } }
      "यह लाल रंग है।": { native: "This is red colour.", bases: {} }
  "hi-1310":
    native: "sweet vermicelli"
    notes:
      "n1": "A dish made with milk and sugar, eaten on Eid."
    examples:
      "सेवई मीठी है।": { native: "The vermicelli is sweet.", bases: {} }
      "सेवई में दूध है।": { native: "There is milk in the vermicelli.", bases: {} }
  "hi-1311":
    native: "firecracker"
    notes:
      "n1": "Set off at Diwali and at weddings. The plural is पटाखे (paṭāke), and the stem changes."
    examples:
      "बच्चे पटाखे चलाते हैं।": { native: "Children set off firecrackers.", bases: { "पटाखे": "firecracker", "चलाते": "to run; to set off" } }
      "पटाखे की आवाज़ तेज़ है।": { native: "The sound of the firecrackers is loud.", bases: { "पटाखे": "firecracker", "की": "of (f)", "आवाज़": "sound", "तेज़": "strong; loud" } }
  "hi-1312":
    native: "light; illumination"
    notes:
      "n1": "The lights of a festival or of a house."
    examples:
      "दिवाली की रोशनी सुंदर है।": { native: "The lights of Diwali are beautiful.", bases: { "की": "of (f)" } }
      "घर में रोशनी है।": { native: "There are lights in the house.", bases: {} }
  "hi-1313":
    native: "blessed food"
    notes:
      "n1": "Food offered to a god and then shared out."
    examples:
      "मंदिर में प्रसाद बँटता है।": { native: "Blessed food is shared out in the temple.", bases: { "बँटता": "to be shared out" } }
      "प्रसाद सबको मिलता है।": { native: "Everyone gets the blessed food.", bases: {} }
  "hi-1314":
    native: "birthday"
    notes:
      "n1": "Literally the day of birth."
    examples:
      "आज मेरा जन्मदिन है।": { native: "Today is my birthday.", bases: {} }
      "जन्मदिन पर केक काटते हैं।": { native: "On a birthday people cut a cake.", bases: {} }
  "hi-1315":
    native: "wedding"
    notes:
      "n1": "A marriage, and the festivities around it."
    examples:
      "शादी में बहुत मेहमान थे।": { native: "There were many guests at the wedding.", bases: {} }
      "शादी अच्छी थी।": { native: "The wedding was good.", bases: {} }
  "hi-1316":
    native: "congratulations"
    notes:
      "n1": "Said at a festival, a birth or a wedding."
    examples:
      "आपको बधाई!": { native: "Congratulations to you!", bases: {} }
      "सब बधाई दे रहे हैं।": { native: "Everyone is giving congratulations.", bases: {} }
  "hi-1317":
    native: "good wishes"
    notes:
      "n1": "Written in the singular; the plural is शुभकामनाएँ (shubhkāmnāeṃ)."
    examples:
      "आपको शुभकामनाएँ।": { native: "Best wishes to you.", bases: { "शुभकामनाएँ": "good wishes" } }
      "नए साल की शुभकामना।": { native: "A wish for the new year.", bases: { "की": "of (f)" } }
  "hi-1318":
    native: "procession"
    notes:
      "n1": "People walking together through the street."
    examples:
      "जुलूस सड़क पर निकला।": { native: "The procession went out on the road.", bases: { "निकला": "to come out" } }
      "जुलूस में बहुत लोग थे।": { native: "There were many people in the procession.", bases: {} }
  "hi-1319":
    native: "religious story; telling"
    notes:
      "n1": "A story told at a festival, or the telling of it."
    examples:
      "दादी रोज़ कथा सुनाती हैं।": { native: "Grandmother tells a story every day.", bases: { "सुनाती": "to tell" } }
      "यह कथा सच्ची है।": { native: "This story is true.", bases: { "सच्ची": "true" } }
  "hi-1320":
    native: "drum"
    notes:
      "n1": "A large drum played at festivals and weddings."
    examples:
      "ढोल बजता है।": { native: "The drum is played.", bases: { "बजता": "to sound; to be played" } }
      "ढोल की आवाज़ तेज़ है।": { native: "The sound of the drum is loud.", bases: { "की": "of (f)", "आवाज़": "sound", "तेज़": "strong; loud" } }
  "hi-1321":
    native: "guest"
    notes:
      "n1": "A guest at a festival or a meal. The oblique plural is मेहमानों (mehmānōṃ): the stem changes."
    examples:
      "घर में मेहमान हैं।": { native: "There are guests in the house.", bases: {} }
      "मेहमानों को दावत दी।": { native: "I gave the guests a feast.", bases: { "मेहमानों": "guest" } }
  "hi-1322":
    native: "feast; invitation to a meal"
    notes:
      "n1": "A large meal given for guests, or the invitation to it."
    examples:
      "आज दावत है।": { native: "There is a feast today.", bases: {} }
      "दावत में खाना अच्छा है।": { native: "The food at the feast is good.", bases: {} }
  "hi-1323":
    native: "prayer (Muslim)"
    notes:
      "n1": "The daily prayer of Muslims, said five times a day."
    examples:
      "मस्जिद में नमाज़ होती है।": { native: "There is prayer in the mosque.", bases: {} }
      "नमाज़ का समय है।": { native: "It is time for prayer.", bases: {} }
  "hi-1324":
    native: "religious fast"
    notes:
      "n1": "A fast kept for a god, in Hindu practice."
    examples:
      "मैं व्रत रखती हूँ।": { native: "I am keeping a fast.", bases: {} }
      "व्रत में लोग सिर्फ़ फल लेते हैं।": { native: "During a fast people take only fruit.", bases: {} }
  "hi-1325":
    native: "festive bustle"
    notes:
      "n1": "The busy, happy life of a crowded place."
    examples:
      "बाज़ार में रौनक है।": { native: "There is bustle in the market.", bases: {} }
      "त्योहार पर रौनक बढ़ती है।": { native: "At a festival the bustle increases.", bases: { "बढ़ती": "to increase" } }
  "hi-1326":
    native: "preparation"
    notes:
      "n1": "Getting ready for something."
    examples:
      "सब तैयारी कर रहे हैं।": { native: "Everyone is preparing.", bases: {} }
      "तैयारी पूरी है।": { native: "The preparation is complete.", bases: {} }
  "hi-1327":
    native: "decoration"
    notes:
      "n1": "Things put up to make a place look festive."
    examples:
      "दीवारों पर सजावट है।": { native: "There is decoration on the walls.", bases: { "दीवारों": "wall" } }
      "सजावट सुंदर है।": { native: "The decoration is beautiful.", bases: {} }
  "hi-1328":
    native: "happiness; joy"
    notes:
      "n1": "The feeling of a festival or a happy day."
    examples:
      "सब खुश हैं।": { native: "Everyone is happy.", bases: {} }
      "मेले में खुशी है।": { native: "There is joy at the fair.", bases: {} }
  "hi-1329":
    native: "evening worship with lamps"
    notes:
      "n1": "Worship with lamps waved before a god, usually in the evening."
    examples:
      "शाम को आरती होती है।": { native: "There is worship with lamps in the evening.", bases: {} }
      "आरती में दीये जलते हैं।": { native: "Lamps are lit at the worship.", bases: { "जलते": "to burn; to light up" } }
  "hi-1330":
    native: "gurdwara (Sikh temple)"
    notes:
      "n1": "The Sikh place of worship. Before a postposition the stem changes: गुरुद्वारे में (gurudvāre meṃ), in the gurdwara."
    examples:
      "गुरुद्वारे में लंगर है।": { native: "There is a free meal at the gurdwara.", bases: { "गुरुद्वारे": "gurdwara", "लंगर": "free communal meal" } }
      "गुरुद्वारा शांत है।": { native: "The gurdwara is calm.", bases: { "शांत": "calm" } }
  "hi-1331":
    native: "food offered to a god"
    notes:
      "n1": "The food placed before a god, before it is shared out."
    examples:
      "भगवान को भोग लगता है।": { native: "Food is offered to God.", bases: { "भगवान": "God", "लगता": "to be offered" } }
      "भोग के बाद प्रसाद बँटता है।": { native: "After the offering, the blessed food is shared out.", bases: { "के": "of (oblique plural)", "बाद": "after", "बँटता": "to be shared out" } }
  "hi-1332":
    native: "fast (Ramadan)"
    notes:
      "n1": "The fast kept from dawn to sunset in Ramadan."
    examples:
      "रमज़ान में रोज़ा रखते हैं।": { native: "In Ramadan people keep the fast.", bases: { "रमज़ान": "Ramadan" } }
      "रोज़ा सुबह से शाम तक होता है।": { native: "The fast lasts from morning to evening.", bases: {} }
  "hi-1333":
    native: "blessed; happy (in wishes)"
    notes:
      "n1": "Used in a greeting, as ईद मुबारक (īd mubārak), happy Eid."
    examples:
      "ईद मुबारक!": { native: "Happy Eid!", bases: {} }
      "नया साल मुबारक!": { native: "Happy New Year!", bases: {} }
  "hi-1334":
    native: "to celebrate"
    notes:
      "n1": "Of a festival or a birthday."
    examples:
      "लोग दिवाली मनाते हैं।": { native: "People celebrate Diwali.", bases: { "मनाते": "to celebrate" } }
      "हम होली धूम से मनाते हैं।": { native: "We celebrate Holi with great fun.", bases: { "धूम": "fanfare; great fun", "मनाते": "to celebrate" } }
  "hi-1335":
    native: "to light; to burn"
    notes:
      "n1": "Of lamps and candles."
    examples:
      "दीये जलाओ।": { native: "Light the lamps.", bases: { "जलाओ": "to light" } }
      "लोग मोमबत्ती जलाते हैं।": { native: "People light candles.", bases: { "मोमबत्ती": "candle", "जलाते": "to light" } }
  "hi-1336":
    native: "to distribute; to share out"
    notes:
      "n1": "Of sweets, food and gifts."
    examples:
      "मिठाई बाँटो।": { native: "Share out the sweets.", bases: { "बाँटो": "to share out" } }
      "लोग प्रसाद बाँटते हैं।": { native: "People share out the blessed food.", bases: { "बाँटते": "to distribute" } }
  "hi-1337":
    native: "to decorate"
    notes:
      "n1": "Of a house, a room or a street."
    examples:
      "घर सजाओ।": { native: "Decorate the house.", bases: { "सजाओ": "to decorate" } }
      "बच्चे कमरा सजाते हैं।": { native: "The children decorate the room.", bases: { "सजाते": "to decorate" } }
