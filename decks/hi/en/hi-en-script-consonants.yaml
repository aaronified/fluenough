schema: 1
id: "hi-en-script-consonants"
kind: "layer"
core: "hi-script-consonants"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hindi consonants"
license: "CC0-1.0"
description: "Every consonant, each carrying its vowel a: the plain and breathy ones, on the teeth and curled back, then the flapped r's and the dotted letters of loanwords."
tags: ["unreviewed"]
cards:
  "hi-0012":
    native: "k (ka)"
    notes:
      "n1": "Like the 'k' of 'skin', with no puff of breath. Every consonant carries the short a (अ) unless a sign changes it. कमल (kamal, lotus)."
  "hi-0013":
    native: "kh, with a breath (kha)"
    notes:
      "n1": "क (ka) with a puff of breath after it. It changes the word: खाना (khānā, food)."
  "hi-0014":
    native: "g (ga)"
    notes:
      "n1": "Like the 'g' of 'go': गाय (gāy, cow)."
  "hi-0015":
    native: "gh, with a breath (gha)"
    notes:
      "n1": "ग (ga) with a breath after it: घर (ghar, house)."
  "hi-0016":
    native: "ng (as in 'sing')"
    notes:
      "n1": "Seen in a few words from Sanskrit; Hindi usually writes the anusvar ं (am̐) instead. Hardly ever heard on its own, so it is drilled by reading and writing only."
  "hi-0017":
    native: "ch (ca)"
    notes:
      "n1": "Like the 'ch' of 'church', with no puff of breath: चाय (cāy, tea)."
  "hi-0018":
    native: "chh, with a breath (cha)"
    notes:
      "n1": "च (ca) with a breath after it: छत (chat, roof)."
  "hi-0019":
    native: "j (ja)"
    notes:
      "n1": "Like the 'j' of 'judge': जूता (jūtā, shoe)."
  "hi-0020":
    native: "jh, with a breath (jha)"
    notes:
      "n1": "ज (ja) with a breath after it: झील (jhīl, lake)."
  "hi-0021":
    native: "ny (in conjuncts)"
    notes:
      "n1": "Seen almost only in conjuncts from Sanskrit, and inside ज्ञ (gya). Hardly ever heard on its own, so it is drilled by reading and writing only."
  "hi-0022":
    native: "t, curled back (ṭa)"
    notes:
      "n1": "The tongue tip curls back to touch the roof of the mouth: retroflex. English 't' is close to this. Compare त (ta): टमाटर (ṭamāṭar, tomato)."
  "hi-0023":
    native: "th, curled back, with a breath (ṭha)"
    notes:
      "n1": "ट (ṭa) with a breath after it. Not the 'th' of 'think': ठंडा (ṭhaṇḍā, cold)."
  "hi-0024":
    native: "d, curled back (ḍa)"
    notes:
      "n1": "The tongue tip curls back, as for ट (ṭa), and touches the roof of the mouth just behind the ridge behind the teeth. English 'd' is close to this. Compare द (da): डाल (ḍāl, branch)."
  "hi-0025":
    native: "dh, curled back, with a breath (ḍha)"
    notes:
      "n1": "Like ड (ḍa), but the tongue touches the roof of the mouth a little further back, with a breath after it: ढोल (ḍhōl, drum)."
  "hi-0026":
    native: "n, curled back (muurdhanya na)"
    notes:
      "n1": "The tongue tip curls back, in words from Sanskrit: कारण (kāraṇ, reason). It sounds like न (na) in everyday speech, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  "hi-0027":
    native: "t, on the teeth (ta)"
    notes:
      "n1": "The tongue touches the back of the upper teeth: dental. English has no such t; it sounds softer. Compare ट (ṭa): तुम (tum, you)."
  "hi-0028":
    native: "th, on the teeth, with a breath (tha)"
    notes:
      "n1": "त (ta) with a breath after it. Not the 'th' of 'think': थाली (thālī, plate)."
  "hi-0029":
    native: "d, on the teeth (da)"
    notes:
      "n1": "The tongue touches the back of the upper teeth, as for त (ta). Compare ड (ḍa): दाल (dāl, lentils)."
  "hi-0030":
    native: "dh, on the teeth, with a breath (dha)"
    notes:
      "n1": "द (da) with a breath after it. Not the 'th' of 'this': धन्यवाद (dhanyavād, thank you)."
  "hi-0031":
    native: "n (na)"
    notes:
      "n1": "The 'n' of 'no': नाम (nām, name)."
  "hi-0032":
    native: "p (pa)"
    notes:
      "n1": "Like the 'p' of 'spin', with no puff of breath: पानी (pānī, water)."
  "hi-0033":
    native: "ph, with a breath (pha)"
    notes:
      "n1": "प (pa) with a breath after it. Many speakers say it like English 'f': फल (phal, fruit)."
  "hi-0034":
    native: "b (ba)"
    notes:
      "n1": "Like the 'b' of 'boy': बिल्ली (billī, cat)."
  "hi-0035":
    native: "bh, with a breath (bha)"
    notes:
      "n1": "ब (ba) with a breath after it. Not 'v': भाषा (bhāśā, language)."
  "hi-0036":
    native: "m (ma)"
    notes:
      "n1": "Like the 'm' of 'mother': माता (mātā, mother)."
  "hi-0037":
    native: "y (ya)"
    notes:
      "n1": "Like the 'y' of 'yes': यात्रा (yātrā, journey)."
  "hi-0038":
    native: "r (ra)"
    notes:
      "n1": "A single tap of the tongue, like the 'tt' of American 'butter'. Never silent: रंग (raṅg, colour)."
  "hi-0039":
    native: "l (la)"
    notes:
      "n1": "A clear 'l', as at the start of 'leaf': लाल (lāl, red)."
  "hi-0040":
    native: "v or w (va)"
    notes:
      "n1": "Between English 'v' and 'w': वर्ष (varś, year)."
  "hi-0041":
    native: "sh (śa)"
    notes:
      "n1": "The 'sh' of 'shop': शहर (śahar, city)."
  "hi-0042":
    native: "sh, curled back (śa)"
    notes:
      "n1": "Curled back in careful speech, in words from Sanskrit: भाषा (bhāśā, language). It sounds like श (śa) in everyday speech, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  "hi-0043":
    native: "s (sa)"
    notes:
      "n1": "The 's' of 'sun', never 'sh': सड़क (saṛak, road)."
  "hi-0044":
    native: "h (ha)"
    notes:
      "n1": "Like the 'h' of 'hat': हाथ (hāth, hand)."
  "hi-0045":
    native: "r, tongue placed as for ड (ḍa)"
    notes:
      "n1": "ड (ḍa) with a dot below: the tongue is placed as for ड (ḍa), but doesn't touch the roof of the mouth. It never starts a word: सड़क (saṛak, road), लड़का (laṛkā, boy)."
  "hi-0046":
    native: "rh, tongue placed as for ढ (ḍha)"
    notes:
      "n1": "ढ (ḍha) with a dot below: the tongue is placed as for ढ (ḍha), a little further back than for ड़ (ṛa), and doesn't touch the roof of the mouth: पढ़ना (paṛhnā, to read)."
  "hi-0047":
    native: "z (za)"
    notes:
      "n1": "ज (ja) with a dot below, the 'z' of 'zoo', in words from Persian, Arabic and English: ज़मीन (zamīn, land)."
  "hi-0048":
    native: "f (fa)"
    notes:
      "n1": "फ (pha) with a dot below, the 'f' of 'fan', in words from Persian, Arabic and English: फ़िल्म (film, film)."
