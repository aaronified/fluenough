cards:
  "hi-5834":
    native: "Prices went up."
    bases:
      "बढ़": "rose"
      "गए": "(completed action, plural)"
    confusables:
      "w1": { why: "To raise, not rise: बढ़ाना (baṛhānā) means to raise." }
      "w2": { why: "To polish, not rise: चमकाना (camkānā) means to polish." }
  "hi-5835":
    native: "The child is swinging on the swing."
    bases:
      "झूले": "swing (oblique)"
      "झूल": "swing"
      "रहा": "(continuing action, masculine)"
      "है": "is"
    confusables:
      "w1": { why: "To shake, not swing: हिलना (hilnā) means to shake or move." }
      "w2": { why: "To shake something, not swing: हिलाना (hilānā) means to shake something." }
  "hi-5836":
    native: "Soak the cloth in water."
    bases:
      "भिगोइए": "soak (polite)"
    confusables:
      "w1": { why: "Bag, not cloth: बैग (baig) means bag." }
      "w2": { why: "Paper, not cloth: कागज़ (kāgaz) means paper." }
  "hi-5837":
    native: "He took hold of my hand."
    bases:
      "उसने": "he, she (agent)"
      "पकड़": "held"
      "लिया": "(completed action)"
    confusables:
      "w1": { why: "To snatch, not hold: झपटना (jhapṭnā) means to snatch or pounce." }
      "w2": { why: "To hand over, not hold: पकड़ाना (pakṛānā) means to hand over." }
  "hi-5838":
    native: "He snatched the bag."
    bases:
      "उसने": "he, she (agent)"
      "झपट": "snatch"
      "लिया": "took"
    confusables:
      "w1": { why: "To seize, not snatch: दबोचना (dabōcnā) means to seize or clutch." }
      "w2": { why: "To hold, not snatch: पकड़ना (pakṛnā) means to hold or catch." }
  "hi-5839":
    native: "He turned the paper over."
    bases:
      "उसने": "he, she (agent)"
      "पलटा": "turned over"
    confusables:
      "w1": { why: "Bag, not paper: बैग (baig) means bag." }
      "w2": { why: "To polish, not turn: चमकाना (camkānā) means to polish." }
  "hi-5840":
    native: "The sponge soaks up water."
    bases:
      "स्पंज": "sponge"
      "सोखता": "soaks up (masculine)"
      "है": "is"
    confusables:
      "w1": { why: "Wind or air, not sponge: हवा (havā) means wind or air." }
      "w2": { why: "Ointment, not sponge: मरहम (marham) means ointment." }
  "hi-5841":
    native: "Rub the ointment on your hand."
    bases:
      "मलिए": "rub (polite)"
    confusables:
      "w1": { why: "Paper, not ointment: कागज़ (kāgaz) means paper." }
      "w2": { why: "To soak, not rub: भिगोना (bhigōnā) means to soak." }
  "hi-5842":
    native: "He is polishing the apple."
    bases:
      "चमका": "polish (masculine)"
      "रहा": "(continuing action, masculine)"
      "है": "is"
    confusables:
      "w1": { why: "Banana, not apple: केला (kēlā) means banana." }
      "w2": { why: "Flatbread, not apple: रोटी (rōṭī) means flatbread." }
  "hi-5843":
    native: "The trees are swaying in the wind."
    bases:
      "हिल": "sway"
      "रहे": "(continuing action, plural)"
      "हैं": "are"
    confusables:
      "w1": { why: "To shake something, not sway: हिलाना (hilānā) means to shake something." }
      "w2": { why: "Seed, not tree: बीज (bīj) means seed." }
  "hi-5844":
    native: "The roti is being cooked on the griddle."
    bases:
      "तवे": "griddle (oblique)"
      "भुन": "be roasted"
      "रही": "(continuing action, feminine)"
      "है": "is"
    confusables:
      "w1": { why: "Food, not flatbread: खाना (khānā) means food." }
      "w2": { why: "To soak, not roast: भिगोना (bhigōnā) means to soak." }
  "hi-5845":
    native: "He shook the tree."
    bases:
      "उसने": "he, she (agent)"
      "हिलाया": "shook"
    confusables:
      "w1": { why: "Wind or air, not tree: हवा (havā) means wind or air." }
      "w2": { why: "Apple, not tree: सेब (sēb) means apple." }
