description: "Short sentences that use the directions words of this unit. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-2980":
    native: "My office is far from here."
    confusables:
      "w1": { why: "Near, not far: पास (pās) means near." }
      "w2": { why: "Home, not an office: घर (ghar) means home; house." }
  "hi-2981":
    native: "Where does the road go?"
    bases:
      "जाती": "to go"
    confusables:
      "w1": { why: "Way or route, not the road itself: रास्ता (rāstā) means way; route." }
      "w2": { why: "When, not where: कब (kab) means when." }
  "hi-2982":
    native: "My brother often forgets the way."
    bases:
      "भूलता": "to forget"
    confusables:
      "w1": { why: "Name, not way: नाम (nām) means name." }
      "w2": { why: "Thinks, not forgets: सोचता (sōctā) means thinks." }
  "hi-2983":
    native: "Turn left on the road."
    confusables:
      "w1": { why: "Right, not left: दाएँ (dāēm̐) means right." }
      "w2": { why: "Straight on, not a turn: सीधे (sīdhē) means straight on." }
  "hi-2984":
    native: "She walks straight up to the shop."
    bases:
      "चलती": "to walk"
    confusables:
      "w1": { why: "Far, not straight on: दूर (dūr) means far." }
      "w2": { why: "Behind, not up to: पीछे (pīchē) means behind." }
  "hi-2985":
    native: "Our people speak there."
    bases:
      "हमारे": "our"
      "बोलते": "to speak"
    confusables:
      "w1": { why: "Here, not there: यहाँ (yahām̐) means here." }
      "w2": { why: "Language, not speaking: भाषा (bhāṣā) means language." }
  "hi-2986":
    native: "Is this road near?"
    confusables:
      "w1": { why: "Far, not near: दूर (dūr) means far." }
      "f1": { why: "Plural: हैं (haim̐) is for more than one; one road takes है (hai)." }
  "hi-2987":
    native: "Two glasses of juice are needed here."
    confusables:
      "w1": { why: "Wants, not needed: चाहता (cāhtā) means wants." }
      "w2": { why: "Bottle, not glass: बोतल (bōtal) means bottle." }
  "hi-2988":
    native: "Why do you sit here?"
    bases:
      "बैठते": "to sit"
    confusables:
      "w1": { why: "Where, not why: कहाँ (kahām̐) means where." }
      "f1": { why: "Singular feminine: बैठती (baiṭhtī) is for one woman; आप (āp) takes बैठते (baiṭhtē)." }
  "hi-2989":
    native: "He looks ahead right now."
    bases:
      "देखता": "to look"
    confusables:
      "w1": { why: "Behind, not ahead: पीछे (pīchē) means behind." }
      "w2": { why: "Walks, not looks: चलता (chaltā) means walks." }
  "hi-2990":
    native: "The driver does not come from behind."
    bases:
      "आता": "to come"
    confusables:
      "w1": { why: "Ahead, not behind: आगे (āgē) means ahead." }
      "f1": { why: "Goes, not comes: जाता (jātā) means goes." }
  "hi-2991":
    native: "The students sit near the teacher."
    bases:
      "के": "of; 's"
      "बैठते": "to sit"
    confusables:
      "w1": { why: "Far, not near: दूर (dūr) means far." }
      "w2": { why: "Learn, not sit: सीखते (sīkhtē) means learn." }
  "hi-2992":
    native: "Hot milk is available here."
    bases:
      "मिलता": "to meet; to get"
    confusables:
      "w1": { why: "There, not here: वहाँ (vahām̐) means there." }
      "w2": { why: "Cold, not hot: ठंडा (ṭhaṇḍā) means cold." }
  "hi-2993":
    native: "The shopkeeper tells the price there."
    bases:
      "बताता": "to tell, to show"
    confusables:
      "w1": { why: "Money, not price: पैसे (paisē) means money." }
      "w2": { why: "Cheap, not a price: सस्ता (sastā) means cheap." }
  "hi-2994":
    native: "Do you go directly to the office every morning?"
    bases:
      "हर": "every"
      "जाते": "to go"
    confusables:
      "w1": { why: "Evening, not morning: शाम (shām) means evening." }
      "w2": { why: "Slowly, not directly: धीरे (dhīrē) means slowly." }
  "hi-2995":
    native: "Excuse me, look to the right."
    bases:
      "देखिए": "to see, to look"
    confusables:
      "w1": { why: "Left, not right: बाएँ (bāēm̐) means left." }
      "w2": { why: "Speak, not look: बोलिए (bōliē) means speak." }
  "hi-2996":
    native: "My sister brings vegetables from here every evening."
    bases:
      "मेरी": "my"
      "हर": "every"
      "लाती": "to bring"
    confusables:
      "w1": { why: "Morning, not evening: सुबह (subah) means morning." }
      "w2": { why: "Milk, not vegetables: दूध (dūdh) means milk." }
  "hi-2997":
    native: "My uncle reads behind the house in the morning."
    bases:
      "मेरे": "my"
      "के": "of; 's"
      "पढ़ते": "to read"
    confusables:
      "w1": { why: "Shop, not house: दुकान (dukān) means shop." }
      "w2": { why: "Ahead, not behind: आगे (āgē) means ahead." }
  "hi-2998":
    native: "They turn right every time."
    bases:
      "हर": "every"
      "बार": "time, occasion"
      "मुड़ते": "to turn"
    confusables:
      "w1": { why: "Left, not right: बाएँ (bāēm̐) means left." }
      "w2": { why: "Straight on, not a turn: सीधे (sīdhē) means straight on." }
  "hi-2999":
    native: "My friends return from a faraway city."
    bases:
      "मेरे": "my"
      "के": "of; 's"
      "लौटते": "to return"
    confusables:
      "w1": { why: "Near, not far: पास (pās) means near." }
      "w2": { why: "Country, not city: देश (dēś) means country." }
  "hi-3000":
    native: "My daughter plays up front."
    bases:
      "मेरी": "my"
      "खेलती": "to play"
    confusables:
      "w1": { why: "Behind, not up front: पीछे (pīchē) means behind." }
      "w2": { why: "Listens, not plays: सुनती (suntī) means listens." }
  "hi-3001":
    native: "The small children are playing at the back now."
    bases:
      "छोटे": "small"
      "खेल": "to play"
      "रहे": "to stay"
    confusables:
      "w1": { why: "Big or older, not small: बड़े (baṛē) means big or older." }
      "w2": { why: "Ahead, not behind: आगे (āgē) means ahead." }
  "hi-3002":
    native: "The nurse returns from far away."
    bases:
      "लौटती": "to return"
    confusables:
      "w1": { why: "Here, not far away: यहाँ (yahām̐) means here." }
      "f1": { why: "Goes, not returns: जाती (jātī) means goes." }
  "hi-3003":
    native: "The son runs ahead, so he wakes up early."
    bases:
      "दौड़ता": "to run"
      "जागता": "to wake up"
    confusables:
      "w1": { why: "Slowly, not early: धीरे (dhīrē) means slowly; जल्दी (jaldī) means early or quickly." }
      "w2": { why: "Forgets, not wakes up: भूलता (bhūltā) means forgets." }
  "hi-3004":
    native: "Who lives behind the shop?"
    bases:
      "के": "of; 's"
      "रहता": "to live, to stay"
    confusables:
      "w1": { why: "When, not who: कब (kab) means when." }
      "w2": { why: "Above, not behind: ऊपर (ūpar) means above." }
