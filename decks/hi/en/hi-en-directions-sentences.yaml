schema: 1
id: "hi-en-directions-sentences"
kind: "layer"
core: "hi-directions-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences about directions"
license: "CC-BY-SA-4.0"
description: "Short sentences that use the directions words of this unit. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-2980":
    native: "My office is far from here."
    notes:
      "n1": "दूर (dūr) with से (sē) means far from: यहाँ (yahām̐) से (sē) दूर (dūr) is far from here."
    confusables:
      "w1": { why: "Near, not far: पास (pās) means near." }
      "w2": { why: "Home, not an office: घर (ghar) means home; house." }
  "hi-2981":
    native: "Where does the road go?"
    notes:
      "n1": "जाती (jātī) agrees with सड़क (saṛak), road, a feminine noun, so the verb takes the feminine ending -ī."
    bases:
      "जाती": "to go"
    confusables:
      "w1": { why: "Way or route, not the road itself: रास्ता (rāstā) means way; route." }
      "w2": { why: "When, not where: कब (kab) means when." }
  "hi-2982":
    native: "My brother often forgets the way."
    notes:
      "n1": "भूलता (bhūltā) agrees with भाई (bhāī), brother, a masculine noun, so it ends in -ā."
    bases:
      "भूलता": "to forget"
    confusables:
      "w1": { why: "Name, not way: नाम (nām) means name." }
      "w2": { why: "Thinks, not forgets: सोचता (sōctā) means thinks." }
  "hi-2983":
    native: "Turn left on the road."
    notes:
      "n1": "मुड़िए (muṛiē) is the polite imperative for आप (āp), you; to a close friend it would be मुड़ो (muṛō)."
    confusables:
      "w1": { why: "Right, not left: दाएँ (dāēm̐) means right." }
      "w2": { why: "Straight on, not a turn: सीधे (sīdhē) means straight on." }
  "hi-2984":
    native: "She walks straight up to the shop."
    notes:
      "n1": "तक (tak), up to, comes after the noun: दुकान (dukān) तक (tak) means up to the shop."
    bases:
      "चलती": "to walk"
    confusables:
      "w1": { why: "Far, not straight on: दूर (dūr) means far." }
      "w2": { why: "Behind, not up to: पीछे (pīchē) means behind." }
  "hi-2985":
    native: "Our people speak there."
    notes:
      "n1": "बोलते (bōltē) agrees with लोग (lōg), people, a masculine plural noun, so it ends in -ē."
    bases:
      "हमारे": "our"
      "बोलते": "to speak"
    confusables:
      "w1": { why: "Here, not there: यहाँ (yahām̐) means here." }
      "w2": { why: "Language, not speaking: भाषा (bhāṣā) means language." }
  "hi-2986":
    native: "Is this road near?"
    notes:
      "n1": "पास (pās) here means near; after a noun it takes के (kē), as in अध्यापक (adhyāpak) के (kē) पास (pās), near the teacher."
    confusables:
      "w1": { why: "Far, not near: दूर (dūr) means far." }
      "f1": { why: "Plural: हैं (haim̐) is for more than one; one road takes है (hai)." }
  "hi-2987":
    native: "Two glasses of juice are needed here."
    notes:
      "n1": "चाहिए (cāhiē), is needed, never changes its form, and the thing needed, here दो (dō) गिलास (gilās) जूस (jūs), is its subject."
    confusables:
      "w1": { why: "Wants, not needed: चाहता (cāhtā) means wants." }
      "w2": { why: "Bottle, not glass: बोतल (bōtal) means bottle." }
  "hi-2988":
    native: "Why do you sit here?"
    notes:
      "n1": "आप (āp), you, the polite form, takes plural verb endings, so बैठते (baiṭhtē) हैं (haim̐) is plural even for one person."
    bases:
      "बैठते": "to sit"
    confusables:
      "w1": { why: "Where, not why: कहाँ (kahām̐) means where." }
      "f1": { why: "Singular feminine: बैठती (baiṭhtī) is for one woman; आप (āp) takes बैठते (baiṭhtē)." }
  "hi-2989":
    native: "He looks ahead right now."
    notes:
      "n1": "आगे (āgē) means ahead or in front, and it is also used for later in time."
    bases:
      "देखता": "to look"
    confusables:
      "w1": { why: "Behind, not ahead: पीछे (pīchē) means behind." }
      "w2": { why: "Walks, not looks: चलता (chaltā) means walks." }
  "hi-2990":
    native: "The driver does not come from behind."
    notes:
      "n1": "से (sē) after a place word means from: पीछे (pīchē) से (sē) is from behind."
    bases:
      "आता": "to come"
    confusables:
      "w1": { why: "Ahead, not behind: आगे (āgē) means ahead." }
      "f1": { why: "Goes, not comes: जाता (jātā) means goes." }
  "hi-2991":
    native: "The students sit near the teacher."
    notes:
      "n1": "बैठते (baiṭhtē) agrees with छात्र (chātr), student, a masculine noun in the plural, so it ends in -ē."
    bases:
      "के": "of; 's"
      "बैठते": "to sit"
    confusables:
      "w1": { why: "Far, not near: दूर (dūr) means far." }
      "w2": { why: "Learn, not sit: सीखते (sīkhtē) means learn." }
  "hi-2992":
    native: "Hot milk is available here."
    notes:
      "n1": "मिलता (miltā) here means is available, not to meet; the same verb मिलना (milnā) also means to meet."
    bases:
      "मिलता": "to meet; to get"
    confusables:
      "w1": { why: "There, not here: वहाँ (vahām̐) means there." }
      "w2": { why: "Cold, not hot: ठंडा (ṭhaṇḍā) means cold." }
  "hi-2993":
    native: "The shopkeeper tells the price there."
    notes:
      "n1": "बताता (batātā) agrees with दुकानदार (dukāndār), shopkeeper, a masculine noun, so it ends in -ā."
    bases:
      "बताता": "to tell, to show"
    confusables:
      "w1": { why: "Money, not price: पैसे (paisē) means money." }
      "w2": { why: "Cheap, not a price: सस्ता (sastā) means cheap." }
  "hi-2994":
    native: "Do you go directly to the office every morning?"
    notes:
      "n1": "हर (har), every, comes before a noun: हर (har) सुबह (subah), every morning."
    bases:
      "हर": "every"
      "जाते": "to go"
    confusables:
      "w1": { why: "Evening, not morning: शाम (shām) means evening." }
      "w2": { why: "Slowly, not directly: धीरे (dhīrē) means slowly." }
  "hi-2995":
    native: "Excuse me, look to the right."
    notes:
      "n1": "सुनिए (suniē) is the polite imperative of सुनना (sunnā), to listen, and is used to get someone's attention."
    bases:
      "देखिए": "to see, to look"
    confusables:
      "w1": { why: "Left, not right: बाएँ (bāēm̐) means left." }
      "w2": { why: "Speak, not look: बोलिए (bōliē) means speak." }
  "hi-2996":
    native: "My sister brings vegetables from here every evening."
    notes:
      "n1": "लाती (lātī) agrees with बहन (bahan), sister, a feminine noun, so it ends in -ī."
    bases:
      "मेरी": "my"
      "हर": "every"
      "लाती": "to bring"
    confusables:
      "w1": { why: "Morning, not evening: सुबह (subah) means morning." }
      "w2": { why: "Milk, not vegetables: दूध (dūdh) means milk." }
  "hi-2997":
    native: "My uncle reads behind the house in the morning."
    notes:
      "n1": "के (kē) पीछे (pīchē) after a noun means behind it: घर (ghar) के (kē) पीछे (pīchē), behind the house."
    bases:
      "मेरे": "my"
      "के": "of; 's"
      "पढ़ते": "to read"
    confusables:
      "w1": { why: "Shop, not house: दुकान (dukān) means shop." }
      "w2": { why: "Ahead, not behind: आगे (āgē) means ahead." }
  "hi-2998":
    native: "They turn right every time."
    notes:
      "n1": "हर (har), every, comes before a noun: हर (har) बार (bār), every time."
    bases:
      "हर": "every"
      "बार": "time, occasion"
      "मुड़ते": "to turn"
    confusables:
      "w1": { why: "Left, not right: बाएँ (bāēm̐) means left." }
      "w2": { why: "Straight on, not a turn: सीधे (sīdhē) means straight on." }
  "hi-2999":
    native: "My friends return from a faraway city."
    notes:
      "n1": "दूर (dūr) before के (kē) and a noun means faraway: दूर (dūr) के (kē) शहर (śahar), a faraway city."
    bases:
      "मेरे": "my"
      "के": "of; 's"
      "लौटते": "to return"
    confusables:
      "w1": { why: "Near, not far: पास (pās) means near." }
      "w2": { why: "Country, not city: देश (dēś) means country." }
  "hi-3000":
    native: "My daughter plays up front."
    notes:
      "n1": "खेलती (khēltī) agrees with बेटी (bēṭī), daughter, a feminine noun, so it ends in -ī."
    bases:
      "मेरी": "my"
      "खेलती": "to play"
    confusables:
      "w1": { why: "Behind, not up front: पीछे (pīchē) means behind." }
      "w2": { why: "Listens, not plays: सुनती (suntī) means listens." }
  "hi-3001":
    native: "The small children are playing at the back now."
    notes:
      "n1": "रहे (rahē) हैं (haim̐) makes the ongoing form: खेल (khēl) रहे (rahē) हैं (haim̐), are playing; रहे (rahē) agrees with बच्चे (baccē), children, a masculine plural."
    bases:
      "छोटे": "small"
      "खेल": "to play"
      "रहे": "to stay"
    confusables:
      "w1": { why: "Big or older, not small: बड़े (baṛē) means big or older." }
      "w2": { why: "Ahead, not behind: आगे (āgē) means ahead." }
  "hi-3002":
    native: "The nurse returns from far away."
    notes:
      "n1": "लौटती (lauṭtī) agrees with नर्स (nars), nurse, a feminine noun, so it ends in -ī."
    bases:
      "लौटती": "to return"
    confusables:
      "w1": { why: "Here, not far away: यहाँ (yahām̐) means here." }
      "f1": { why: "Goes, not returns: जाती (jātī) means goes." }
  "hi-3003":
    native: "The son runs ahead, so he wakes up early."
    notes:
      "n1": "दौड़ता (dauṛtā) and जागता (jāgtā) agree with बेटा (bēṭā), son, a masculine noun, so both end in -ā."
    bases:
      "दौड़ता": "to run"
      "जागता": "to wake up"
    confusables:
      "w1": { why: "Slowly, not early: धीरे (dhīrē) means slowly; जल्दी (jaldī) means early or quickly." }
      "w2": { why: "Forgets, not wakes up: भूलता (bhūltā) means forgets." }
  "hi-3004":
    native: "Who lives behind the shop?"
    notes:
      "n1": "कौन (kaun), who, takes a masculine singular verb, so रहता (rahtā) ends in -ā."
    bases:
      "के": "of; 's"
      "रहता": "to live, to stay"
    confusables:
      "w1": { why: "When, not who: कब (kab) means when." }
      "w2": { why: "Above, not behind: ऊपर (ūpar) means above." }
