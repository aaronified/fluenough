  notes: "The -कर (-kar) form is the stem with कर (kar) added, as खाकर (khākar) in खाकर जाओ (khākar jāō), eat and then go. It joins an action that comes before the main verb, and both actions have the same doer. The -के (-kē) form is the same in speech, and is more colloquial. The verb करना (karnā) takes करके (karkē) in both slots. होना (hōnā) takes होकर (hōkar), as in घर होकर (ghar hōkar), by way of home."
