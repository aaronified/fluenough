rules:
  "hi-rule-perfect":
    name: "The past form, then हूँ (hūm̐), हो (hō), है (hai) or हैं (haim̐): the present perfect"
    explanation: "The past form of the verb, then हूँ (hūm̐), हो (hō), है (hai) or हैं (haim̐): आया हूँ (āyā hūm̐), I have come. A feminine doer takes the feminine singular form even in the plural: आई हैं (āī haim̐), they have come. Verbs that take no ने, such as आना (ānā) and जाना (jānā), are in this table. With an object, the doer takes ने (nē) as in the simple past, so लिखना (likhnā) is not here: मैंने चिट्ठी लिखी है (mainnē ciṭṭhī likhī hai), I have written the letter."
