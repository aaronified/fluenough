native: { code: "en", iso639_3: "eng", name: "English" }
name: "Present perfect"
license: "CC0-1.0"
description: "I have come, she has gone: the present perfect of verbs without an object. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "Present perfect, intransitive verbs"
  slot_name: "person and gender"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "aanaa": "to come"
    "jaanaa": "to go"
    "pahunchnaa": "to arrive"
    "baithnaa": "to sit"
  notes: "The past form of the verb, then हूँ (hūm̐), हो (hō), है (hai) or हैं (haim̐): आया हूँ (āyā hūm̐), I have come. With an object, the doer takes ने (nē) as in the simple past: मैंने खाना खाया है (mainnē khānā khāyā hai)."
