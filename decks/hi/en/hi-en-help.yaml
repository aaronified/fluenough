schema: 1
id: "hi-en-help"
kind: "layer"
core: "hi-help"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Help"
license: "CC-BY-SA-4.0"
description: "Asking for help, doctors and medicine, and saying you are lost."
cards:
  "hi-0352":
    native: "help"
    "examples": {
      "मदद करना": {"native": "to help", "bases": {"करना": "to do; to make"}},
      "मदद कीजिए!": {"native": "Please help!", "bases": {"कीजिए": "to do; to make"}}
    }
  "hi-0356":
    native: "police"
    notes:
      "n1": "Feminine: पुलिस आ गई (pulis ā gaī), the police have come. The emergency number in India is 112."
    "examples": {
      "आप पुलिस से पूछिए।": {"native": "Ask the police.", "bases": {"पूछिए": "to ask"}},
      "पुलिस ने अपराधी पकड़ा।": {"native": "The police caught the criminal.", "bases": {"ने": "by", "अपराधी": "criminal", "पुलिस": "police"}}
    }
  "hi-0357":
    native: "doctor"
  "hi-0358":
    native: "hospital"
    "examples": {
      "घायल को अस्पताल ले जाओ।": {"native": "Take the injured person to hospital.", "bases": {"अस्पताल": "hospital"}},
      "टीका लगवाने के लिए अस्पताल जाओ।": {"native": "Go to the hospital to get the shot.", "bases": {"टीका": "vaccine", "लगवाने": "to get done", "लिए": "for", "जाओ": "to go", "अस्पताल": "hospital"}}
    }
  "hi-0359":
    native: "medicine"
    notes:
      "n1": "Also दवा (davā). A chemist's is दवाई की दुकान (davāī kī dukān)."
    "examples": {
      "डॉक्टर ने दवाई और पर्चा दिया।": {"native": "The doctor gave medicine and a prescription.", "bases": {"ने": "marks the doer of a past verb", "दिया": "to give", "दवाई": "medicine"}},
      "पर्चा दवाई की दुकान पर दिखाओ।": {"native": "Show the prescription at the medicine shop.", "bases": {"पर्चा": "prescription slip", "दिखाओ": "to show", "दवाई": "medicine"}}
    }
  "hi-0360":
    native: "pain"
    notes:
      "n1": "सिर में दर्द है (sir mēm̐ dard hai), I have a headache: 'there is pain in the head'."
    "examples": {
      "कंधे में दर्द है।": {"native": "There is pain in the shoulder.", "bases": {"कंधे": "shoulder"}},
      "कमर में दर्द है।": {"native": "There is pain in the waist.", "bases": {}}
    }
