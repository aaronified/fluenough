schema: 1
id: "hi-en-help"
kind: "layer"
core: "hi-help"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Help"
license: "CC0-1.0"
description: "Asking for help, doctors and medicine, and saying you are lost."
cards:
  "hi-0352":
    native: "help"
  "hi-0353":
    native: "Please help!"
  "hi-0354":
    native: "Help! (in danger)"
    notes:
      "n1": "What you shout in danger: literally 'save me!'"
  "hi-0355":
    native: "Stop! Wait, please!"
  "hi-0356":
    native: "police"
    notes:
      "n1": "Feminine: पुलिस आ गई (pulis ā gaī), the police have come. The emergency number in India is 112."
  "hi-0357":
    native: "doctor"
  "hi-0358":
    native: "hospital"
  "hi-0359":
    native: "medicine"
    notes:
      "n1": "Also दवा (davā). A chemist's is दवाई की दुकान (davāī kī dukān)."
  "hi-0360":
    native: "pain"
    notes:
      "n1": "सिर में दर्द है (sir mēm̐ dard hai), I have a headache: 'there is pain in the head'."
  "hi-0361":
    native: "I'm lost. (said by a man)"
    notes:
      "n1": "A woman says खो गई हूँ (khō gaī hūm̐)."
  "hi-0362":
    native: "I didn't understand."
  "hi-0363":
    native: "Where is the toilet?"
    notes:
      "n1": "Signs say शौचालय (śaucālay). Speakers say टॉयलेट (ṭôylēṭ) or बाथरूम (bāthrūm)."
