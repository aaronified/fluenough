description: "Short sentences that use the work words of this unit. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-2900":
    native: "That one is a good engineer."
    bases:
      "है": "to be"
    confusables:
      "w1": { why: "Lawyer, not engineer: वकील (vakīl) means lawyer." }
      "w2": { why: "Nurse, not engineer: नर्स (nars) means nurse." }
  "hi-2901":
    native: "Are you a lawyer?"
    bases:
      "हैं": "to be"
    confusables:
      "w1": { why: "Farmer, not lawyer: किसान (kisān) means farmer." }
      "f1": { why: "Singular: है (hai) is for one person; the respectful आप (āp) takes हैं (haim̐)." }
  "hi-2902":
    native: "My sister is a nurse now."
    bases:
      "मेरी": "my"
      "है": "to be"
    confusables:
      "w1": { why: "Brother, not sister: भाई (bhāī) means brother." }
      "f1": { why: "Plural: हैं (haim̐) is for more than one; one sister takes है (hai)." }
  "hi-2903":
    native: "She will work at the office later."
    bases:
      "बाद": "after; later"
      "में": "in; at"
      "करती": "to do"
      "है": "to be"
    confusables:
      "w1": { why: "Tomorrow or yesterday, not later: कल (kal) means tomorrow or yesterday." }
      "w2": { why: "Now, not later: अभी (abhī) means now." }
  "hi-2904":
    native: "When is your day off?"
    bases:
      "आपकी": "your"
      "है": "to be"
    confusables:
      "w1": { why: "Where, not when: कहाँ (kahām̐) means where." }
      "f1": { why: "Plural: one day off takes है (hai); हैं (haim̐) is for more than one." }
  "hi-2905":
    native: "Engineers do not think well at night several times."
    bases:
      "कई": "several"
      "बार": "time"
      "में": "in; at"
      "अच्छी": "good"
      "तरह": "way; manner"
      "सोचते": "to think"
    confusables:
      "w1": { why: "Today, not at night: आज (āj) means today." }
      "w2": { why: "Never, not several times: कभी नहीं (kabhī nahīm̐) means never." }
  "hi-2906":
    native: "The shopkeeper opens early."
    bases:
      "खोलता": "to open"
      "है": "to be"
    confusables:
      "w1": { why: "Slowly, not early: धीरे (dhīrē) means slowly." }
      "w2": { why: "Immediately, not early in general: तुरंत (turant) means immediately." }
  "hi-2907":
    native: "My father is a farmer."
    bases:
      "मेरे": "my"
      "हैं": "to be"
    confusables:
      "w1": { why: "Mother, not father: माँ (mām̐) means mother." }
      "w2": { why: "Brother, not father: भाई (bhāī) means brother." }
  "hi-2908":
    native: "Journalists often write at night."
    bases:
      "में": "in; at"
      "लिखते": "to write"
      "हैं": "to be"
    confusables:
      "w1": { why: "Morning, not night: सुबह (subah) means morning." }
      "w2": { why: "Perhaps, not often: शायद (śāyad) means perhaps." }
  "hi-2909":
    native: "When were you a student?"
    bases:
      "थे": "to be"
    confusables:
      "w1": { why: "Where, not when: कहाँ (kahām̐) means where." }
      "f1": { why: "Present, not past: है (hai) is present; थे (thē) is the past form for you." }
  "hi-2910":
    native: "The nurse does not come outside."
    bases:
      "आती": "to come"
    confusables:
      "w1": { why: "Inside, not outside: अंदर (andar) means inside." }
      "w2": { why: "Up or above, not outside: ऊपर (ūpar) means up or above." }
  "hi-2911":
    native: "The students play outside."
    bases:
      "खेलते": "to play"
      "हैं": "to be"
    confusables:
      "w1": { why: "Inside, not outside: अंदर (andar) means inside." }
      "w2": { why: "Teacher, not student: अध्यापक (adhyāpak) means teacher." }
  "hi-2912":
    native: "My driver is very tired."
    bases:
      "है": "to be"
    confusables:
      "w1": { why: "Happy, not tired: खुश (khuś) means happy." }
      "w2": { why: "A little, not very: थोड़ा (thōṛā) means a little." }
  "hi-2913":
    native: "I did not do my job yesterday."
    bases:
      "मैंने": "I"
      "की": "to do"
    confusables:
      "w1": { why: "Today, not yesterday: आज (āj) means today." }
      "w2": { why: "Something, not a job: कुछ (kuch) means something." }
  "hi-2914":
    native: "The lawyer is not going now."
    bases:
      "जा": "to go"
      "रहा": "to stay; to live"
      "है": "to be"
    confusables:
      "w1": { why: "Today, not now: आज (āj) means today." }
      "w2": { why: "Somewhere, not now: कहीं (kahīm̐) means somewhere." }
  "hi-2915":
    native: "The shopkeeper often opens early in the morning."
    bases:
      "खोलता": "to open"
      "है": "to be"
    confusables:
      "w1": { why: "Never, not often: कभी नहीं (kabhī nahīm̐) means never." }
      "w2": { why: "Evening, not morning: शाम (śām) means evening." }
  "hi-2916":
    native: "The writer writes something at home several times."
    bases:
      "कई": "several"
      "बार": "time"
      "में": "in; at"
      "लिखता": "to write"
      "है": "to be"
    confusables:
      "w1": { why: "Office, not home: दफ़्तर (daftar) means office." }
      "w2": { why: "Often, not several times: अक्सर (aksar) means often." }
  "hi-2917":
    native: "Today is my day off."
    bases:
      "मेरी": "my"
      "है": "to be"
    confusables:
      "w1": { why: "Tomorrow or yesterday, not today: कल (kal) means tomorrow or yesterday." }
      "f1": { why: "Plural: one day off takes है (hai); हैं (haim̐) is for more than one." }
  "hi-2918":
    native: "Why is the farmer crying?"
    bases:
      "रोता": "to cry"
      "है": "to be"
    confusables:
      "w1": { why: "When, not why: कब (kab) means when." }
      "w2": { why: "How, not why: कैसे (kaisē) means how." }
  "hi-2919":
    native: "My father goes to the office every week in the morning."
    bases:
      "मेरे": "my"
      "हर": "every"
      "हफ़्ते": "week"
      "जाते": "to go"
      "हैं": "to be"
    confusables:
      "w1": { why: "Mother, not father: माँ (mām̐) means mother." }
      "w2": { why: "Evening, not morning: शाम (śām) means evening." }
  "hi-2920":
    native: "He wants a new job."
    bases:
      "नई": "new"
      "चाहता": "to want"
      "है": "to be"
    confusables:
      "w1": { why: "Old, not new: पुराना (purānā) means old." }
      "w2": { why: "To meet, not want: मिलना (milnā) means to meet." }
  "hi-2921":
    native: "My business is very good today."
    bases:
      "है": "to be"
    confusables:
      "w1": { why: "Bad, not good: बुरा (burā) means bad." }
      "w2": { why: "To sell, not do business: बेचना (bēcnā) means to sell." }
  "hi-2922":
    native: "The cook is cooking something now."
    bases:
      "पकाता": "to cook"
      "है": "to be"
    confusables:
      "w1": { why: "To sell, not cook: बेचना (bēcnā) means to sell." }
      "w2": { why: "To wash, not cook: धोना (dhōnā) means to wash." }
  "hi-2923":
    native: "Where does the driver return?"
    bases:
      "लौटता": "to return"
      "है": "to be"
    confusables:
      "w1": { why: "To go, not return: जाना (jānā) means to go." }
      "w2": { why: "When, not where: कब (kab) means when." }
