  notes: "The causative makes the subject cause another to act: पढ़वाना (paṛhvānā) is to get someone to read, and पढ़ाना (paṛhānā) is to teach. Most causatives end in वाना (vānā), as लिखवाना (likhvānā) and करवाना (karvānā), and some change the stem, as खिलाना (khilānā) for खाना (khānā) and सुलाना (sulānā) for सोना (sōnā). The table lists the causative of each verb that is common and clear in the course; other verbs are not given here, and their causatives are not yet checked."
