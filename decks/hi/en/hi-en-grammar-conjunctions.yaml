schema: 1
id: "hi-en-grammar-conjunctions"
kind: "layer"
core: "hi-grammar-conjunctions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Joining words"
license: "CC0-1.0"
description: "And, but, or, because: joining words and sentences."
cards:
  "hi-0337":
    native: "and"
    notes:
      "n1": "चाय और पानी (cāy aur pānī), tea and water. It also means 'more'."
  "hi-0343":
    native: "but"
    notes:
      "n1": "पर (par) and मगर (magar) mean the same, and are common in speech."
  "hi-0344":
    native: "or"
    notes:
      "n1": "चाय या कॉफ़ी (cāy yā kôfī)? Tea or coffee?"
  "hi-0345":
    native: "because"
    notes:
      "n1": "मैं नहीं आया क्योंकि मैं बीमार था (maim̐ nahīm̐ āyā kyōṅki maim̐ bīmār thā)। I didn't come because I was ill."
  "hi-0346":
    native: "so; that's why"
    notes:
      "n1": "मैं बीमार था (maim̐ bīmār thā), इसलिए नहीं आया (isliē nahīm̐ āyā)। I was ill, so I didn't come."
  "hi-0347":
    native: "that (after say, think, know)"
    notes:
      "n1": "उसने कहा कि वह आएगा (usnē kahā ki vah āēgā)। He said that he would come. Unlike English 'that', कि (ki) is rarely left out."
  "hi-0348":
    native: "if … then"
    notes:
      "n1": "अगर बारिश हुई तो मैं नहीं आऊँगा (agar bāriś huī tō maim̐ nahīm̐ āūm̐gā)। If it rains, I won't come. The तो (tō) is usual, where English leaves 'then' out."
  "hi-0349":
    native: "when … then"
    notes:
      "n1": "जब मैं आया तब वह सो रहा था (jab maim̐ āyā tab vah sō rahā thā)। When I came, he was sleeping."
  "hi-0350":
    native: "also; too; even"
    notes:
      "n1": "It follows the word it is about: मैं भी (maim̐ bhī), me too; आज भी (āj bhī), even today."
  "hi-0351":
    native: "then; again"
    notes:
      "n1": "फिर क्या हुआ (phir kyā huā)? Then what happened?"
