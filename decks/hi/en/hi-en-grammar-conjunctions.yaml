schema: 1
id: "hi-en-grammar-conjunctions"
kind: "layer"
core: "hi-grammar-conjunctions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Joining words"
license: "CC-BY-SA-4.0"
description: "And, but, or, because: joining words and sentences."
cards:
  "hi-0337":
    native: "and"
    notes:
      "n1": "चाय और पानी (cāy aur pānī), tea and water. It also means 'more'."
  "hi-0343":
    native: "but"
    notes:
      "n1": "पर (par) and मगर (magar) mean the same, and are common in speech."
    "examples": {
      "वह बहुत थकी, लेकिन खुश है।": {"native": "She is very tired, but happy.", "bases": {"थकी": "tired", "लेकिन": "but"}},
      "वह बहुत थकी, लेकिन नहीं रोई।": {"native": "She was very tired, but she did not cry.", "bases": {"रोई": "to cry", "लेकिन": "but"}}
    }
  "hi-0344":
    native: "or"
    notes:
      "n1": "चाय या कॉफ़ी (cāy yā kôfī)? Tea or coffee?"
    "examples": {
      "यह रिकॉर्ड टूटेगा या नहीं?": {"native": "Will this record be broken or not?", "bases": {"या": "or"}}
    }
  "hi-0345":
    native: "because"
    notes:
      "n1": "मैं नहीं आया क्योंकि मैं बीमार था (maim̐ nahīm̐ āyā kyōṅki maim̐ bīmār thā)। I didn't come because I was ill."
  "hi-0346":
    native: "so; that's why"
    notes:
      "n1": "मैं बीमार था (maim̐ bīmār thā), इसलिए नहीं आया (isliē nahīm̐ āyā)। I was ill, so I didn't come."
    "examples": {
      "बैटरी कम थी, इसलिए फोन बंद हो गया।": {"native": "The battery was low, so the phone switched off.", "bases": {"फोन": "phone", "इसलिए": "so; that's why"}}
    }
  "hi-0347":
    native: "that (after say, think, know)"
    notes:
      "n1": "उसने कहा कि वह आएगा (usnē kahā ki vah āēgā)। He said that he would come. Unlike English 'that', कि (ki) is rarely left out."
    "examples": {
      "मेरा सिद्धांत है कि सच बोलो।": {"native": "My principle is to speak the truth.", "bases": {"सच": "truth", "कि": "that (after say, think, know)"}},
      "उसने खाना सूँघकर कहा कि अच्छा है।": {"native": "He smelled the food and said it was good.", "bases": {"सूँघकर": "to smell", "कि": "that (after say, think, know)"}}
    }
  "hi-0348":
    native: "if … then"
    notes:
      "n1": "अगर बारिश हुई तो मैं नहीं आऊँगा (agar bāriś huī tō maim̐ nahīm̐ āūm̐gā)। If it rains, I won't come. The तो (tō) is usual, where English leaves 'then' out."
    bases:
      "अगर": "if"
      "तो": "then"
  "hi-0349":
    native: "when … then"
    notes:
      "n1": "जब मैं आया तब वह सो रहा था (jab maim̐ āyā tab vah sō rahā thā)। When I came, he was sleeping."
    bases:
      "जब": "when"
      "तब": "then"
  "hi-0350":
    native: "also; too; even"
    notes:
      "n1": "It follows the word it is about: मैं भी (maim̐ bhī), me too; आज भी (āj bhī), even today."
    "examples": {
      "कुछ भी असंभव नहीं।": {"native": "Nothing is impossible.", "bases": {"भी": "also; too; even"}}
    }
  "hi-0351":
    native: "then; again"
    notes:
      "n1": "फिर क्या हुआ (phir kyā huā)? Then what happened?"
    "examples": {
      "फिर मिलेंगे।": {"native": "See you again.", "bases": {"मिलेंगे": "to meet"}}
    }
