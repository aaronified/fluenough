schema: 1
id: "hi-en-adjectives-2"
kind: "layer"
core: "hi-adjectives-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More describing words"
license: "CC-BY-SA-4.0"
description: "More words for describing things and people: how they look, feel, taste and work, and how they compare. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "hi-1964":
    native: "fun; enjoyable; tasty"
    notes:
      "n1": "Enjoyable, or tasty, said of a game, a trip or a meal. The opposite is उबाऊ (ubāū), boring."
    examples:
      "यह खेल बहुत मज़ेदार है।": { "native": "This game is very fun.", "bases": {} }
      "तुम्हारी कहानी मज़ेदार थी।": { "native": "Your story was fun.", "bases": {"कहानी": "story"} }
  "hi-1965":
    native: "boring; tiresome"
    notes:
      "n1": "Dull and tiring, said of a lesson or a film. The opposite is मज़ेदार (mazēdār)."
    examples:
      "यह फ़िल्म उबाऊ है।": { "native": "This film is boring.", "bases": {} }
      "भाषण बहुत उबाऊ था।": { "native": "The speech was very boring.", "bases": {"भाषण": "speech"} }
  "hi-1966":
    native: "interesting"
    notes:
      "n1": "Holding one's interest. It is said of a book, a person or a question."
    examples:
      "यह किताब दिलचस्प है।": { "native": "This book is interesting.", "bases": {} }
      "उसकी बातें दिलचस्प हैं।": { "native": "His talk is interesting.", "bases": {} }
  "hi-1967":
    native: "golden"
    notes:
      "n1": "Of gold, or the colour of gold. The feminine is सुनहरी (sunhrī)."
    examples:
      "उसके बाल सुनहरे हैं।": { "native": "Her hair is golden.", "bases": {"सुनहरे": "golden"} }
      "सुनहरी धूप निकल आई।": { "native": "The golden sunshine came out.", "bases": {"सुनहरी": "golden", "निकल": "to come out"} }
  "hi-1968":
    native: "shiny; bright"
    notes:
      "n1": "Shining and bright, as a surface or a colour is. चमकीला (camkīlā) is a close word."
    examples:
      "यह कपड़ा चमकदार है।": { "native": "This cloth is shiny.", "bases": {} }
      "फ़र्श बहुत चमकदार है।": { "native": "The floor is very shiny.", "bases": {} }
  "hi-1969":
    native: "straight; upright"
    notes:
      "n1": "Straight, not bent, and also honest. The opposite is टेढ़ा (ṭēṛhā)."
    examples:
      "यह रास्ता सीधा है।": { "native": "This road is straight.", "bases": {} }
      "वह सीधा आदमी है।": { "native": "He is an honest man.", "bases": {} }
  "hi-1970":
    native: "crooked; bent"
    notes:
      "n1": "Bent or not straight. The opposite is सीधा (sīdhā), straight."
    examples:
      "यह लकड़ी टेढ़ी है।": { "native": "This stick is bent.", "bases": {"लकड़ी": "stick; wood", "टेढ़ी": "crooked"} }
      "तस्वीर टेढ़ी लगी है।": { "native": "The picture is hung crooked.", "bases": {"टेढ़ी": "crooked"} }
  "hi-1971":
    native: "square"
    notes:
      "n1": "Having four equal sides and four right angles."
    examples:
      "यह मेज़ चौकोर है।": { "native": "This table is square.", "bases": {} }
      "चौकोर डिब्बा लाओ।": { "native": "Bring a square box.", "bases": {} }
  "hi-1972":
    native: "slanted; oblique"
    notes:
      "n1": "Leaning to one side, not straight up and down."
    examples:
      "दीवार तिरछी है।": { "native": "The wall is leaning.", "bases": {"दीवार": "wall", "तिरछी": "slanted"} }
      "तिरछी नज़र से मत देखो।": { "native": "Do not look sideways.", "bases": {"तिरछी": "slanted", "नज़र": "glance", "मत": "do not"} }
  "hi-1973":
    native: "ugly"
    notes:
      "n1": "Not beautiful, said of a person or a thing. The opposite is खूबसूरत (khūbsūrat)."
    examples:
      "यह पुराना घर बदसूरत है।": { "native": "This old house is ugly.", "bases": {} }
      "उसका स्वभाव बदसूरत नहीं है।": { "native": "His nature is not ugly.", "bases": {"स्वभाव": "nature; temperament"} }
  "hi-1974":
    native: "bland; pale"
    notes:
      "n1": "Lacking taste or colour. Said of food without salt or spice, or of a faded colour."
    examples:
      "यह दाल फीकी है।": { "native": "This dal is bland.", "bases": {"फीकी": "bland"} }
      "उसका रंग फीका पड़ गया।": { "native": "His colour has faded.", "bases": {"फीका": "pale"} }
  "hi-1975":
    native: "incomplete; unfinished"
    notes:
      "n1": "Not complete, not finished. The opposite is पूरा (pūrā), complete."
    examples:
      "काम अभी अधूरा है।": { "native": "The work is still unfinished.", "bases": {} }
      "उसकी कहानी अधूरी रह गई।": { "native": "Her story remained unfinished.", "bases": {"कहानी": "story", "अधूरी": "unfinished"} }
  "hi-1976":
    native: "empty; free"
    notes:
      "n1": "Empty, with nothing in it. The opposite is भरा (bharā), full."
    examples:
      "बाल्टी खाली है।": { "native": "The bucket is empty.", "bases": {} }
      "मेरी जेब खाली है।": { "native": "My pocket is empty.", "bases": {} }
  "hi-1977":
    native: "full; filled"
    notes:
      "n1": "Full, with something in it. The opposite is खाली (khālī), empty."
    examples:
      "गिलास पानी से भरा है।": { "native": "The glass is full of water.", "bases": {} }
      "कमरा लोगों से भरा है।": { "native": "The room is full of people.", "bases": {} }
  "hi-1978":
    native: "strong; sturdy; firm"
    notes:
      "n1": "Strong, firm, or hard to break. The opposite is कमज़ोर (kamzōr), weak."
    examples:
      "यह पुल मज़बूत है।": { "native": "This bridge is strong.", "bases": {} }
      "उसकी पकड़ मज़बूत है।": { "native": "His grip is firm.", "bases": {"पकड़": "grip"} }
  "hi-1979":
    native: "hard; harsh; strict"
    notes:
      "n1": "Hard to the touch, or harsh and strict in manner. The opposite is नरम (naram), soft."
    examples:
      "यह पत्थर कठोर है।": { "native": "This stone is hard.", "bases": {} }
      "वह अध्यापक बहुत कठोर है।": { "native": "That teacher is very strict.", "bases": {} }
  "hi-1980":
    native: "smooth; oily; slippery"
    notes:
      "n1": "Smooth to the touch, or slippery with oil. The opposite is खुरदरा (khurdrā)."
    examples:
      "फ़र्श चिकना है, संभलकर चलो।": { "native": "The floor is slippery, walk carefully.", "bases": {"संभलकर": "carefully"} }
      "चिकना पत्थर हाथ में अच्छा लगता है।": { "native": "A smooth stone feels nice in the hand.", "bases": {} }
  "hi-1981":
    native: "rough"
    notes:
      "n1": "Not smooth to the touch, as a wall or a cloth can be. The opposite is चिकना (ciknā)."
    examples:
      "दीवार खुरदरी है।": { "native": "The wall is rough.", "bases": {"दीवार": "wall", "खुरदरी": "rough"} }
      "यह कागज़ खुरदरा है।": { "native": "This paper is rough.", "bases": {"खुरदरा": "rough"} }
  "hi-1982":
    native: "shallow"
    notes:
      "n1": "Not deep, said of water or of a plate. The opposite is गहरा (gahrā), deep."
    examples:
      "नदी यहाँ उथली है।": { "native": "The river is shallow here.", "bases": {"उथली": "shallow"} }
      "थाली उथली है।": { "native": "The plate is shallow.", "bases": {"उथली": "shallow"} }
  "hi-1983":
    native: "famous"
    notes:
      "n1": "Known to many people, as a place or a person is."
    examples:
      "यह शहर अपने मंदिरों के लिए मशहूर है।": { "native": "This city is famous for its temples.", "bases": {"लिए": "for"} }
      "वह गायक बहुत मशहूर है।": { "native": "That singer is very famous.", "bases": {} }
  "hi-1985":
    native: "separate; different"
    notes:
      "n1": "Apart from others, or different. एक जैसा (ēk jaisā) means the same."
    examples:
      "यह डिब्बा अलग रखो।": { "native": "Keep this box separate.", "bases": {} }
      "मेरी राय उससे अलग है।": { "native": "My opinion is different from his.", "bases": {"राय": "opinion"} }
  "hi-1986":
    native: "equal; same; alike"
    notes:
      "n1": "Equal or alike, in size, value or kind."
    examples:
      "दोनों बच्चे समान हैं।": { "native": "Both children are equal.", "bases": {"दोनों": "both"} }
      "दोनों के अधिकार समान हैं।": { "native": "The rights of both are equal.", "bases": {"दोनों": "both", "अधिकार": "right"} }
  "hi-1987":
    native: "equal; level"
    notes:
      "n1": "The same in size, number or height. It is also used for 'exactly'."
    examples:
      "दोनों डिब्बे बराबर हैं।": { "native": "The two boxes are equal.", "bases": {"दोनों": "both"} }
      "दस बराबर दस बीस होते हैं।": { "native": "Ten and ten make twenty.", "bases": {} }
  "hi-1988":
    native: "strange; odd"
    notes:
      "n1": "Unusual and hard to understand. The word can describe a person or an event."
    examples:
      "यह अजीब बात है।": { "native": "This is a strange matter.", "bases": {} }
      "उसका व्यवहार अजीब था।": { "native": "His behaviour was odd.", "bases": {"व्यवहार": "behaviour"} }
  "hi-1989":
    native: "unique; unusual"
    notes:
      "n1": "One of its kind, special and unlike any other."
    examples:
      "यह मंदिर अनोखा है।": { "native": "This temple is unique.", "bases": {} }
      "उसका तरीका अनोखा है।": { "native": "His way is unique.", "bases": {"तरीका": "way; method"} }
  "hi-1990":
    native: "lovely; dear; sweet"
    notes:
      "n1": "Lovely and sweet, said of a child, a thing or a pet. The feminine is प्यारी (pyārī)."
    examples:
      "छोटा बच्चा बहुत प्यारा है।": { "native": "The small child is very lovely.", "bases": {"प्यारा": "lovely"} }
      "यह गुड़िया प्यारी है।": { "native": "This doll is lovely.", "bases": {"गुड़िया": "doll", "प्यारी": "lovely"} }
  "hi-1991":
    native: "dear; beloved"
    notes:
      "n1": "Loved and cherished. It is used in a letter, as प्रिय दोस्त (priy dōst), dear friend."
    examples:
      "प्रिय दोस्त, कैसे हो?": { "native": "Dear friend, how are you?", "bases": {} }
      "वह मेरा सबसे प्रिय भाई है।": { "native": "He is my dearest brother.", "bases": {"सबसे": "most"} }
  "hi-1992":
    native: "frightening; scary"
    notes:
      "n1": "Causing fear, as a dark place, a story or a dream can be."
    examples:
      "यह जंगल डरावना है।": { "native": "This forest is frightening.", "bases": {} }
      "उसने डरावनी कहानी सुनाई।": { "native": "He told a scary story.", "bases": {"डरावनी": "scary", "कहानी": "story", "सुनाई": "to tell"} }
  "hi-1993":
    native: "calm; quiet; peaceful"
    notes:
      "n1": "Calm and still, with little noise or movement."
    examples:
      "झील आज शांत है।": { "native": "The lake is calm today.", "bases": {} }
      "वह शांत स्वभाव का है।": { "native": "He has a calm nature.", "bases": {"स्वभाव": "nature"} }
  "hi-1994":
    native: "good; kind"
    notes:
      "n1": "Good, kind or decent in character. It is used of a person more than of a thing."
    examples:
      "वह बहुत भला आदमी है।": { "native": "He is a very kind man.", "bases": {} }
      "भला हो तुम्हारा!": { "native": "Bless you!", "bases": {} }
  "hi-1995":
    native: "true; honest"
    notes:
      "n1": "Telling the truth, or being really what it seems. The opposite is झूठा (jhūṭhā)."
    examples:
      "यह बात सच्ची है।": { "native": "This matter is true.", "bases": {"सच्ची": "true"} }
      "वह सच्चा दोस्त है।": { "native": "He is a true friend.", "bases": {} }
  "hi-1996":
    native: "false; lying"
    notes:
      "n1": "Not true, or said of a person who tells lies. The opposite is सच्चा (saccā)."
    examples:
      "यह खबर झूठी है।": { "native": "This news is false.", "bases": {"खबर": "news", "झूठी": "false"} }
      "झूठा आदमी भरोसे का नहीं होता।": { "native": "A lying man cannot be trusted.", "bases": {"भरोसे": "trust"} }
  "hi-1997":
    native: "round"
    notes:
      "n1": "Round, like a ball or a circle."
    examples:
      "गेंद गोल है।": { "native": "The ball is round.", "bases": {} }
      "गोल मेज़ पर खाना लगाओ।": { "native": "Set the food on the round table.", "bases": {"लगाओ": "to set"} }
