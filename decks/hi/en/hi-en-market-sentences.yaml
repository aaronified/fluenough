cards:
  "hi-4695":
    native: "How much is this vegetable?"
    bases:
      "कितने": "how much"
      "की": "of (feminine)"
      "है": "is"
    confusables:
      "w1": { why: "What, not how much: क्या (kyā) means what." }
      "w2": { why: "How, not how much: कैसे (kaisē) means how." }
  "hi-4696":
    native: "The price is a hundred rupees."
    bases:
      "रुपये": "rupees (oblique)"
      "है": "is"
    confusables:
      "w1": { why: "Rupee, not price: रुपया (rupayā) means rupee." }
      "w2": { why: "Money, not price: पैसे (paisē) means money." }
  "hi-4697":
    native: "Please lower the price a little."
    bases:
      "कीजिए": "do (polite)"
    confusables:
      "w1": { why: "Expensive, not lower: महँगा (maham̐gā) means expensive." }
      "w2": { why: "Cheap, not lower: सस्ता (sastā) means cheap." }
  "hi-4698":
    native: "This is very expensive."
    bases:
      "है": "is"
    confusables:
      "w1": { why: "Cheap, not expensive: सस्ता (sastā) means cheap." }
      "w2": { why: "Shop, not expensive: दुकान (dukān) means shop." }
  "hi-4699":
    native: "I do not have any change."
    bases:
      "मेरे": "my (oblique)"
      "खुले": "loose (plural)"
      "हैं": "are"
    confusables:
      "w1": { why: "Rupee, not change: रुपया (rupayā) means rupee." }
      "w2": { why: "Price, not change: दाम (dām) means price." }
  "hi-4700":
    native: "Give me a fifty-rupee note."
    bases:
      "रुपये": "rupees (oblique)"
      "का": "of (masculine)"
      "दीजिए": "give (polite)"
    confusables:
      "w1": { why: "Money, not note: पैसे (paisē) means money." }
      "w2": { why: "Rupee, not note: रुपया (rupayā) means rupee." }
  "hi-4701":
    native: "Give me one kilo of tomatoes."
    bases:
      "दीजिए": "give (polite)"
    confusables:
      "w1": { why: "Two, not one: दो (dō) means two." }
      "w2": { why: "Potato, not tomato: आलू (ālū) means potato." }
  "hi-4702":
    native: "Where is this shop?"
    bases:
      "है": "is"
    confusables:
      "w1": { why: "When, not where: कब (kab) means when." }
      "w2": { why: "Who, not where: कौन (kaun) means who." }
  "hi-4703":
    native: "Everything in my shop is cheap."
    bases:
      "मेरी": "my (feminine)"
      "है": "is"
    confusables:
      "w1": { why: "Expensive, not cheap: महँगा (maham̐gā) means expensive." }
      "w2": { why: "Price, not shop: दाम (dām) means price." }
  "hi-4704":
    native: "Who will pay?"
    bases:
      "देगा": "will give"
    confusables:
      "w1": { why: "When, not who: कब (kab) means when." }
      "w2": { why: "What, not who: क्या (kyā) means what." }
  "hi-4705":
    native: "Give two kilos of potatoes for a hundred rupees."
    bases:
      "रुपये": "rupees (oblique)"
      "दीजिए": "give (polite)"
    confusables:
      "w1": { why: "Onion, not potato: प्याज़ (pyāz) means onion." }
      "w2": { why: "Tomato, not potato: टमाटर (ṭamāṭar) means tomato." }
