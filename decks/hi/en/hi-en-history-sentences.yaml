cards:
  "hi-5580":
    native: "Inscriptions of an ancient civilisation have been found."
    bases:
      "के": "of"
      "मिले": "found"
    confusables:
      "w1": { why: "Medieval, not ancient: मध्यकालीन (madhyakālīn) means medieval." }
      "w2": { why: "Modern, not ancient: आधुनिक (ādhunik) means modern." }
  "hi-5581":
    native: "The king won the war."
    bases:
      "ने": "(ergative)"
      "जीता": "won"
    confusables:
      "w1": { why: "Fight; battle, not war: लड़ाई (laṛāī) means fight; battle." }
      "w2": { why: "Commander, not king: सेनापति (sēnāpti) means commander; general." }
  "hi-5582":
    native: "The emperor's empire was very large."
    bases:
      "था": "was"
    confusables:
      "w1": { why: "King; ruler, not emperor: राजा (rājā) means king; ruler." }
      "w2": { why: "Royal court, not empire: दरबार (darbār) means royal court." }
  "hi-5583":
    native: "The queen made a new law at the royal court."
    bases:
      "ने": "(ergative)"
      "कानून": "law"
      "बनाया": "made"
    confusables:
      "w1": { why: "Rule; government, not law: शासन (śāsan) means rule; government." }
      "w2": { why: "King; ruler, not queen: राजा (rājā) means king; ruler." }
  "hi-5584":
    native: "Many people became martyrs in the freedom struggle."
    bases:
      "की": "of"
      "कई": "many"
      "शहीद": "martyr"
      "हुए": "became"
    confusables:
      "w1": { why: "Liberty; independence, formal: स्वतंत्रता (svatantratā) means liberty; independence." }
      "w2": { why: "Treaty; pact, not struggle: संधि (sandhi) means treaty; pact." }
  "hi-5585":
    native: "Our culture is very old."
    bases:
      "हमारी": "our"
      "पुरानी": "old"
    confusables:
      "w1": { why: "Civilisation, not culture: सभ्यता (sabhyatā) means civilisation." }
      "w2": { why: "Time; period, not culture: काल (kāl) means time; period; era." }
  "hi-5586":
    native: "That fort was built in that century."
    bases:
      "किला": "fort"
      "उस": "that"
      "बना": "was built"
      "था": "was"
    confusables:
      "w1": { why: "Age; era, not century: युग (yug) means age; era." }
      "w2": { why: "Time; period: काल (kāl) means time; period; era." }
  "hi-5587":
    native: "People call this era modern."
    bases:
      "इस": "this"
      "कहते": "call"
    confusables:
      "w1": { why: "Ancient, not modern: प्राचीन (prācīn) means ancient." }
      "w2": { why: "Medieval, not modern: मध्यकालीन (madhyakālīn) means medieval." }
  "hi-5588":
    native: "The dynasty's power declined."
    bases:
      "की": "of"
      "शक्ति": "power"
      "हुई": "became"
    confusables:
      "w1": { why: "Empire, not dynasty: साम्राज्य (sāmrājy) means empire." }
      "w2": { why: "Rule; government, not power: शासन (śāsan) means rule; government." }
  "hi-5589":
    native: "Archaeology reveals the story of a civilisation."
    bases:
      "पता": "information"
      "चलता": "comes to light"
    confusables:
      "w1": { why: "Inscription, not archaeology: शिलालेख (śilālēkh) means inscription; stone writing." }
      "w2": { why: "Book; text, not archaeology: ग्रंथ (granth) means book; scripture; text." }
  "hi-5590":
    native: "The commander lost the war."
    bases:
      "हार": "lost"
      "गया": "(completed)"
    confusables:
      "w1": { why: "King; ruler, not commander: राजा (rājā) means king; ruler." }
      "w2": { why: "Rule; government, not commander: शासन (śāsan) means rule; government." }
  "hi-5591":
    native: "A centuries-old text was found in the royal court."
    bases:
      "सदियों": "centuries"
      "पुराना": "old"
      "मिला": "was found"
    confusables:
      "w1": { why: "Inscription: शिलालेख (śilālēkh) means inscription; stone writing." }
      "w2": { why: "Emperor: सम्राट (samrāṭ) means emperor." }
