core: "hi-workplace-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences about work"
license: "CC-BY-SA-4.0"
description: "Short sentences that use the workplace words of this unit. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-5137":
    native: "My boss called a meeting."
    bases:
      "ने": "marks who did the action"
    confusables:
      "w1": { why: "Company, not boss: कंपनी (kampanī) means company; firm." }
      "w2": { why: "Report, not meeting: रिपोर्ट (ripōrṭ) means report." }
  "hi-5138":
    native: "There is a meeting tomorrow morning."
    confusables:
      "w1": { why: "Limit, not meeting: सीमा (sīmā) means limit; deadline." }
      "w2": { why: "Training, not meeting: ट्रेनिंग (ṭrēniṅg) means training." }
  "hi-5139":
    native: "My report is ready."
    bases:
      "तैयार": "ready"
    confusables:
      "w1": { why: "Proposal, not report: प्रस्ताव (prastāv) means proposal; offer." }
      "w2": { why: "Project, not report: प्रोजेक्ट (prōjēkṭ) means project." }
  "hi-5140":
    native: "The employees will work overtime."
    confusables:
      "w1": { why: "Colleague, not employee: सहकर्मी (sahkarmī) means colleague." }
      "w2": { why: "Salary, not overtime: वेतन (vētan) means salary; pay." }
  "hi-5141":
    native: "I want a promotion."
    confusables:
      "w1": { why: "Salary, not promotion: वेतन (vētan) means salary; pay." }
      "w2": { why: "Post, not promotion: पद (pad) means post; rank; position." }
  "hi-5142":
    native: "He handed over the work."
    confusables:
      "w1": { why: "To settle, not hand over: निपटाना (nipṭānā) means to settle; to finish off." }
      "w2": { why: "Target, not work: लक्ष्य (lakśy) means target; goal." }
  "hi-5143":
    native: "I will handle this responsibility."
    confusables:
      "w1": { why: "To hand over, not handle: सौंपना (saumpanā) means to hand over." }
      "w2": { why: "To settle, not handle: निपटाना (nipṭānā) means to settle; to finish off." }
  "hi-5144":
    native: "The deadline is tomorrow."
    confusables:
      "w1": { why: "Target, not deadline: लक्ष्य (lakśy) means target; goal." }
      "w2": { why: "Plan, not deadline: योजना (yōjnā) means plan; scheme." }
  "hi-5145":
    native: "He is very busy."
    confusables:
      "w1": { why: "Approved, not busy: मंज़ूर (maṁzūr) means approved; accepted." }
      "w2": { why: "Calm, not busy: शांत (śānt) means calm; peaceful." }
  "hi-5146":
    native: "The proposal was approved."
    confusables:
      "w1": { why: "Busy, not approved: व्यस्त (vyast) means busy." }
      "w2": { why: "Correctly, not approved: सही (sahī) means correctly." }
  "hi-5147":
    native: "There is training for new employees."
    bases:
      "लिए": "for"
    confusables:
      "w1": { why: "Interview, not training: इंटरव्यू (iṇṭaravyū) means interview." }
      "w2": { why: "Experience, not training: अनुभव (anubhav) means experience." }
  "hi-5148":
    native: "My experience is enough."
    confusables:
      "w1": { why: "Training, not experience: ट्रेनिंग (ṭrēniṅg) means training." }
      "w2": { why: "Responsibility, not experience: ज़िम्मेदारी (zimmēdārī) means responsibility; duty." }
  "hi-5149":
    native: "When is the interview?"
    confusables:
      "w1": { why: "Who, not when: कौन (kaun) means who." }
      "w2": { why: "Where, not when: कहाँ (kahām̐) means where." }
  "hi-5150":
    native: "The company gave me a new post."
    bases:
      "ने": "marks who did the action"
    confusables:
      "w1": { why: "Salary, not post: वेतन (vētan) means salary; pay." }
      "w2": { why: "Promotion, not post: तरक्की (tarakkī) means promotion; progress." }
