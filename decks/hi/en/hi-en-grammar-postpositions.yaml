schema: 1
id: "hi-en-grammar-postpositions"
kind: "layer"
core: "hi-grammar-postpositions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Postpositions: in, on, from"
license: "CC0-1.0"
description: "Hindi's prepositions come after the noun."
cards:
  "hi-0274":
    native: "in; inside"
    notes:
      "n1": "After the noun: घर में (ghar mēm̐), in the house. A noun before any postposition takes its oblique form: कमरा (kamrā) → कमरे में (kamrē mēm̐), in the room."
  "hi-0275":
    native: "on; at"
    notes:
      "n1": "मेज़ पर (mēz par), on the table. दुकान पर (dukān par), at the shop."
  "hi-0276":
    native: "from; with; by; since"
    notes:
      "n1": "दिल्ली से (dillī sē), from Delhi. बस से (bas sē), by bus. कल से (kal sē), since yesterday."
  "hi-0277":
    native: "to; for"
    notes:
      "n1": "The person something is given or said to: राम को दीजिए (rām kō dījiē), give it to Ram. It also marks a particular object: बच्चे को बुलाइए (baccē kō bulāiē), call the child."
  "hi-0278":
    native: "up to; until"
    notes:
      "n1": "स्टेशन तक (sṭēśan tak), as far as the station. पाँच बजे तक (pām̐c bajē tak), until five."
  "hi-0279":
    native: "of; 's"
    notes:
      "n1": "राम का घर (rām kā ghar), Ram's house. It agrees with the thing owned: राम की किताब (rām kī kitāb), Ram's book; राम के बच्चे (rām kē baccē), Ram's children."
  "hi-0280":
    native: "with (together with)"
    notes:
      "n1": "राम के साथ (rām kē sāth), with Ram. With a pronoun, the possessive comes first: मेरे साथ (mērē sāth), with me."
  "hi-0281":
    native: "for"
    notes:
      "n1": "आपके लिए (āpkē liē), for you."
  "hi-0282":
    native: "near; (to have)"
    notes:
      "n1": "स्टेशन के पास (sṭēśan kē pās), near the station. मेरे पास पैसे हैं (mērē pās paisē haim̐), I have money: 'near me there is money'."
  "hi-0283":
    native: "after"
    notes:
      "n1": "खाने के बाद (khānē kē bād), after the meal."
  "hi-0284":
    native: "before"
    notes:
      "n1": "खाने से पहले (khānē sē pahlē), before the meal."
  "hi-0285":
    native: "under; below"
    notes:
      "n1": "मेज़ के नीचे (mēz kē nīcē), under the table."
