schema: 1
id: "hi-en-verbs-5"
kind: "layer"
core: "hi-verbs-5"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs: growth, motion and the senses"
license: "CC-BY-SA-4.0"
description: "More everyday verbs: things that grow and pass, the motions of the hand and the body, soaking and wringing, and the words for swinging and shaking. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "hi-2790":
    native: "to grow; to increase; to advance"
    notes:
      "n1": "To become bigger, or to go forward. The causal is बढ़ाना (baṛhānā)."
    examples:
      "बच्चा रोज़ बढ़ रहा है।": { "native": "The child is growing every day.", "bases": {"बढ़": "to grow"} }
      "कीमतें बढ़ गईं।": { "native": "Prices have gone up.", "bases": {"बढ़": "to grow"} }
  "hi-2791":
    native: "to increase; to raise; to extend"
    notes:
      "n1": "To make something bigger or higher, or to move something forward."
    examples:
      "आगे बढ़ाओ।": { "native": "Move ahead.", "bases": {"बढ़ाओ": "to increase"} }
      "उसने चाय की कीमत बढ़ाई।": { "native": "He raised the price of tea.", "bases": {"बढ़ाई": "to raise"} }
  "hi-2792":
    native: "to pass; to go by"
    notes:
      "n1": "To go past, or for time to pass."
    examples:
      "दिन जल्दी गुज़र गए।": { "native": "The days passed quickly.", "bases": {"गुज़र": "to pass"} }
      "ट्रेन यहाँ से गुज़री।": { "native": "The train passed from here.", "bases": {"गुज़री": "to pass"} }
  "hi-2793":
    native: "to pounce; to snatch"
    notes:
      "n1": "To make a sudden grab at something, or to swoop down on prey."
    examples:
      "बाज़ झपटा और चूहा पकड़ा।": { "native": "The hawk swooped and caught the mouse.", "bases": {"बाज़": "hawk", "झपटा": "to pounce", "चूहा": "mouse"} }
      "उसने मेरा बैग झपट लिया।": { "native": "He snatched my bag.", "bases": {"झपट": "to snatch"} }
  "hi-2794":
    native: "to turn over; to return"
    notes:
      "n1": "To turn a thing over, or to come back the other way."
    examples:
      "रोटी पलटो।": { "native": "Turn the bread over.", "bases": {"पलटो": "to turn over"} }
      "वह वापस पलटा।": { "native": "He turned back.", "bases": {"वापस": "back", "पलटा": "to turn"} }
  "hi-2795":
    native: "to soak up; to absorb"
    notes:
      "n1": "To take in liquid, as a cloth or a sponge does."
    examples:
      "कपड़े से पानी सोखो।": { "native": "Soak up the water with a cloth.", "bases": {"सोखो": "to soak up"} }
      "स्पंज ने सारा पानी सोख लिया।": { "native": "The sponge soaked up all the water.", "bases": {"स्पंज": "sponge", "ने": "by", "सोख": "to soak up"} }
  "hi-2796":
    native: "to pour out; to shed; to flow"
    notes:
      "n1": "To let liquid flow out, as tears, blood or sweat are shed."
    examples:
      "उसने आँसू बहाए।": { "native": "He shed tears.", "bases": {"आँसू": "tear", "बहाए": "to shed"} }
      "खून बहना बंद नहीं हुआ।": { "native": "The bleeding has not stopped.", "bases": {} }
  "hi-2797":
    native: "to rub; to massage"
    notes:
      "n1": "To rub something with the hands, as a cream or oil is rubbed on the skin."
    examples:
      "तेल से पैर मलो।": { "native": "Rub the feet with oil.", "bases": {"मलो": "to rub"} }
      "उसने हाथ मला।": { "native": "He rubbed his hands.", "bases": {"मला": "to rub"} }
  "hi-2798":
    native: "to soak; to wet"
    notes:
      "n1": "To put something into water, or to wet it thoroughly."
    examples:
      "दाल रात भर भिगो दो।": { "native": "Soak the lentils overnight.", "bases": {"भर": "all", "भिगो": "to soak"} }
      "बारिश ने उसे भिगो दिया।": { "native": "The rain soaked him.", "bases": {"ने": "by", "भिगो": "to soak"} }
  "hi-2799":
    native: "to hand over; to make hold"
    notes:
      "n1": "To give a thing into someone's hand, so that they hold it."
    examples:
      "यह थैला मुझे पकड़ाओ।": { "native": "Hand me this bag.", "bases": {"पकड़ाओ": "to hand over"} }
      "उसने बच्चे को गेंद पकड़ाई।": { "native": "He handed the ball to the child.", "bases": {"पकड़ाई": "to hand over"} }
  "hi-2800":
    native: "to scratch; to itch"
    notes:
      "n1": "To rub the skin with the nails, to ease an itch."
    examples:
      "सिर मत खुजलाओ।": { "native": "Do not scratch your head.", "bases": {"मत": "do not", "खुजलाओ": "to scratch"} }
      "मेरा हाथ खुजला रहा है।": { "native": "My hand is itching.", "bases": {"खुजला": "to itch"} }
  "hi-2801":
    native: "to seize; to clutch"
    notes:
      "n1": "To grab hold of someone or something tightly, and not let go."
    examples:
      "शेर ने हिरन को दबोच लिया।": { "native": "The lion seized the deer.", "bases": {"ने": "by", "दबोच": "to seize"} }
      "चोर को दबोचो।": { "native": "Seize the thief.", "bases": {"चोर": "thief", "दबोचो": "to seize"} }
  "hi-2803":
    native: "to be roasted; to be fried"
    notes:
      "n1": "To be roasted or fried, as bread, meat or grain is. The causal is भूनना (bhūnnā)."
    examples:
      "मक्का आग पर भुन रहा है।": { "native": "The maize is roasting on the fire.", "bases": {"भुन": "to roast"} }
      "मूँगफली भुन गई।": { "native": "The peanuts were roasted.", "bases": {"मूँगफली": "peanut", "भुन": "to roast"} }
  "hi-2804":
    native: "to polish; to make shine"
    notes:
      "n1": "To make a surface shine, by rubbing or cleaning it."
    examples:
      "जूते चमकाओ।": { "native": "Polish the shoes.", "bases": {"चमकाओ": "to polish"} }
      "उसने बर्तन चमकाए।": { "native": "He polished the utensils.", "bases": {"चमकाए": "to polish"} }
  "hi-2805":
    native: "to shake; to move"
    notes:
      "n1": "To move a thing from side to side, or up and down."
    examples:
      "पेड़ को हिलाओ।": { "native": "Shake the tree.", "bases": {"हिलाओ": "to shake"} }
      "सिर हिलाकर उसने मना किया।": { "native": "He refused by shaking his head.", "bases": {"हिलाकर": "to shake", "मना": "refusal"} }
  "hi-2806":
    native: "to shake; to move"
    notes:
      "n1": "To be moved from side to side, or to be loose."
    examples:
      "दाँत हिल रहा है।": { "native": "The tooth is loose.", "bases": {"हिल": "to shake"} }
      "पत्ते हवा में हिल रहे हैं।": { "native": "The leaves are moving in the wind.", "bases": {"हिल": "to shake"} }
  "hi-2807":
    native: "to swing"
    notes:
      "n1": "To move to and fro, as on a swing or a branch in the wind."
    examples:
      "बच्चे झूले पर झूल रहे हैं।": { "native": "The children are swinging on the swing.", "bases": {"झूले": "swing", "झूल": "to swing"} }
      "डाल हवा में झूलती है।": { "native": "The branch swings in the wind.", "bases": {"झूलती": "to swing"} }
  "hi-2808":
    native: "to swing (someone)"
    notes:
      "n1": "To make a swing move for someone, or to rock a child."
    examples:
      "बच्चे को झूला झुलाओ।": { "native": "Swing the child on the swing.", "bases": {"झूला": "swing", "झुलाओ": "to swing"} }
      "माँ बच्चे को झुलाती है।": { "native": "Mother rocks the child.", "bases": {"झुलाती": "to rock"} }
