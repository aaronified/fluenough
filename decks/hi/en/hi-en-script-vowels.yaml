schema: 1
id: "hi-en-script-vowels"
kind: "layer"
core: "hi-script-vowels"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hindi vowels"
license: "CC-BY-SA-4.0"
description: "The eleven vowels as they are written on their own, at the start of a word. In Hindi a short and a long vowel are different sounds."
tags: ["unreviewed"]
cards:
  "hi-0001":
    native: "a, short (the vowel every consonant carries)"
    notes:
      "n1": "Like the 'u' of 'but'. Every consonant carries it, and Hindi drops it at the end of most words: कमल (kamal) is kamal, not kamala. On its own: अनार (anār, pomegranate)."
    "examples": {
      "अच्छा है न?": {"native": "It's good, isn't it?", "bases": {"अच्छा": "good; nice"}}
    }
  "hi-0002":
    native: "aa, long"
    notes:
      "n1": "The 'a' of 'father', held longer than अ (a). Short and long change the word in Hindi: आम (ām, mango)."
    "examples": {
      "आग जलाओ।": {"native": "Light the fire.", "bases": {}}
    }
  "hi-0003":
    native: "i, short"
    notes:
      "n1": "Like the 'i' of 'sit': इमली (imlī, tamarind)."
    "examples": {
      "दोबारा बताइए।": {"native": "Please tell me again.", "bases": {"बताइए": "to tell"}},
      "बिल लाइए।": {"native": "The bill, please.", "bases": {"बिल": "bill", "लाइए": "to bring"}}
    }
  "hi-0004":
    native: "ii, long"
    notes:
      "n1": "The 'ee' of 'see', held longer than इ (i): ईख (īkh, sugarcane)."
    "examples": {
      "अनुमति मिल गई।": {"native": "Permission has been given.", "bases": {}},
      "उसने खबर सुनाई।": {"native": "He told the news.", "bases": {"सुनाई": "to tell"}}
    }
  "hi-0005":
    native: "u, short"
    notes:
      "n1": "Like the 'u' of 'put': उल्लू (ullū, owl)."
    "examples": {
      "जूते उतारो।": {"native": "Take off your shoes.", "bases": {"जूते": "shoe", "उतारो": "to take down; to take off"}},
      "आज उमस है।": {"native": "It is muggy today.", "bases": {}}
    }
  "hi-0006":
    native: "uu, long"
    notes:
      "n1": "The 'oo' of 'food', held longer than उ (u): ऊन (ūn, wool)."
    "examples": {
      "ऊर्जा बचाओ।": {"native": "Save energy.", "bases": {}},
      "पहाड़ ऊँचा है।": {"native": "The hill is high.", "bases": {}}
    }
  "hi-0007":
    native: "ri (a vowel letter)"
    notes:
      "n1": "Said 'ri', though it is written as one vowel, in words from Sanskrit: ऋषि (riśi, sage). A recogniser writes this sound as रि (ri), so it is drilled by reading and writing only."
  "hi-0008":
    native: "e (as in 'café')"
    notes:
      "n1": "Like the 'e' of 'café', without the glide of English 'say': एक (ēk, one)."
    "examples": {
      "धीरे चलिए।": {"native": "Walk slowly.", "bases": {}}
    }
  "hi-0009":
    native: "ai (between 'e' and the 'a' of 'cat')"
    notes:
      "n1": "In standard Hindi a long open e, close to the 'a' of 'cat', though it is written ai: ऐनक (ainak, spectacles)."
    "examples": {
      "ऐसे करो।": {"native": "Do it like this.", "bases": {"करो": "to do"}},
      "नई ऐप डाउनलोड करो।": {"native": "Download a new app.", "bases": {"डाउनलोड": "download"}}
    }
  "hi-0010":
    native: "o (as in 'go')"
    notes:
      "n1": "Like the 'o' of 'go', without the glide English adds: ओखली (ōkhlī, mortar)."
    "examples": {
      "घबराओ मत।": {"native": "Do not panic.", "bases": {"घबराओ": "to panic", "मत": "do not"}},
      "घर सजाओ।": {"native": "Decorate the house.", "bases": {"सजाओ": "to decorate"}}
    }
  "hi-0011":
    native: "au (between 'o' and the 'aw' of 'law')"
    notes:
      "n1": "In standard Hindi a long open o, close to the 'aw' of 'law', though it is written au: औरत (aurat, woman)."
    "examples": {
      "जीरा और धनिया पीसो।": {"native": "Grind the cumin and the coriander.", "bases": {"पीसो": "to grind"}},
      "दही और चीनी मिलाओ।": {"native": "Mix the yogurt and the sugar.", "bases": {"मिलाओ": "to mix"}}
    }
