schema: 1
id: "hi-en-home"
kind: "layer"
core: "hi-home"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Home and neighbourhood"
license: "CC-BY-SA-4.0"
description: "The rooms of a home, what is in them, and the people next door. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0419":
    native: "house (the building)"
    notes:
      "n1": "घर (ghar) is home; मकान (makān) is the building, as in मकान मालिक (makān mālik), landlord."
    "examples": {
      "मकान का मालिक कौन है?": {"native": "Who is the owner of the house?", "bases": {"मकान": "house (the building)"}},
      "यह मकान उस मकान से बड़ा है।": {"native": "This house is bigger than that house.", "bases": {"यह": "this", "मकान": "house", "उस": "that"}}
    }
  "hi-0420":
    native: "flat; apartment"
  "hi-0421":
    native: "room"
    "examples": {
      "कमरा साफ़ है।": {"native": "The room is clean.", "bases": {"साफ़": "clean", "कमरा": "room"}},
      "कमरा सुथरा है।": {"native": "The room is neat.", "bases": {"कमरा": "room"}}
    }
  "hi-0422":
    native: "kitchen"
    "examples": {
      "कूड़ेदान रसोई में है।": {"native": "The dustbin is in the kitchen.", "bases": {"रसोई": "kitchen"}},
      "माँ चाय रसोई में रखती है।": {"native": "Mother keeps the tea in the kitchen.", "bases": {"रखती": "to keep", "रसोई": "kitchen"}}
    }
  "hi-0423":
    native: "bedroom"
    notes:
      "n1": "In speech, often बेडरूम (bēḍrūm)."
  "hi-0424":
    native: "sitting room"
    "examples": {
      "बैठक में सोफ़ा है।": {"native": "There is a sofa in the sitting room.", "bases": {}},
      "हमारी बैठक बड़ी है।": {"native": "Our sitting room is big.", "bases": {}},
    }
  "hi-0425":
    native: "bathroom"
  "hi-0426":
    native: "door"
    "examples": {
      "दरवाज़ा धीरे धकेलो।": {"native": "Push the door slowly.", "bases": {"धकेलो": "to push", "दरवाज़ा": "door"}},
      "दरवाज़े पर ताला लटकाओ।": {"native": "Hang a lock on the door.", "bases": {"ताला": "lock", "लटकाओ": "to hang up", "दरवाज़े": "door"}}
    }
  "hi-0427":
    native: "window"
    "examples": {
      "मैंने खिड़की खोली।": {"native": "I opened the window.", "bases": {"खोली": "to open", "खिड़की": "window"}},
      "खिड़की की चौड़ाई नापो।": {"native": "Measure the width of the window.", "bases": {"चौड़ाई": "width", "नापो": "to measure", "खिड़की": "window"}}
    }
  "hi-0428":
    native: "roof; roof terrace"
    "examples": {
      "छत नीची है।": {"native": "The ceiling is low.", "bases": {"नीची": "low", "छत": "roof; roof terrace"}},
      "छत पर दीया जलाओ।": {"native": "Light a lamp on the roof.", "bases": {"छत": "roof; roof terrace"}}
    }
  "hi-0429":
    native: "stairs"
    "examples": {
      "सीढ़ियाँ धीरे चढ़ो।": {"native": "Climb the stairs slowly.", "bases": {"सीढ़ियाँ": "stairs", "चढ़ो": "to climb"}},
      "सीढ़ियाँ धीरे चढ़ो, बेंच पर बैठो।": {"native": "Climb the stairs slowly and sit on the bench.", "bases": {"सीढ़ियाँ": "stairs", "चढ़ो": "to climb", "बैठो": "to sit"}}
    }
  "hi-0430":
    native: "floor; storey"
  "hi-0431":
    native: "key"
    "examples": {
      "चाबी कहाँ छुपाई?": {"native": "Where did you hide the key?", "bases": {"छुपाई": "to hide", "चाबी": "key"}},
      "चाबी मत खोओ।": {"native": "Do not lose the key.", "bases": {"मत": "do not", "खोओ": "to lose", "चाबी": "key"}}
    }
  "hi-0432":
    native: "bed"
    "examples": {
      "उसने बिस्तर बिछाया।": {"native": "He spread the bed.", "bases": {"बिछाया": "to spread out", "बिस्तर": "bed"}},
      "बिस्तर पर साफ़ चादर है।": {"native": "There is a clean sheet on the bed.", "bases": {"बिस्तर": "bed"}}
    }
  "hi-0433":
    native: "chair"
    "examples": {
      "कुर्सी पर गद्दी चढ़ाई।": {"native": "I put a cushion on the chair.", "bases": {"गद्दी": "cushion; mattress", "चढ़ाई": "to put on; to put up", "कुर्सी": "chair"}},
      "यह पुरानी कुर्सी है।": {"native": "This is an old chair.", "bases": {"पुरानी": "old", "कुर्सी": "chair"}}
    }
  "hi-0434":
    native: "table"
    "examples": {
      "मेज़ पोंछो।": {"native": "Wipe the table.", "bases": {"पोंछो": "to wipe", "मेज़": "table"}}
    }
  "hi-0435":
    native: "fan"
    "examples": {
      "पंखा चलाओ।": {"native": "Switch on the fan.", "bases": {"चलाओ": "to drive", "पंखा": "fan"}}
    }
  "hi-0436":
    native: "light"
    notes:
      "n1": "बत्ती जलाइए (battī jalāiē), please switch on the light."
  "hi-0437":
    native: "neighbour"
    "examples": {
      "वे हमारे पड़ोसी हैं।": {"native": "They are our neighbours.", "bases": {"हमारे": "our"}}
    }
  "hi-0438":
    native: "neighbourhood"
    "examples": {
      "हमारा मोहल्ला बहुत शांत है।": {"native": "Our neighbourhood is very quiet.", "bases": {"बहुत": "very; a lot", "शांत": "quiet"}}
    }
  "hi-0265":
    native: "rent"
    notes:
      "n1": "Also the fare for a bus or a taxi."
  "hi-0439":
    native: "There's a park in front of the house."
    bases:
      "सामने": "in front of"
      "पार्क": "park"
  "hi-0440":
    native: "Our neighbourhood is very quiet."
    bases:
      "बहुत": "very; a lot"
      "शांत": "quiet"
