kind: "layer"
core: "hi-journey-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences about journeys"
license: "CC-BY-SA-4.0"
description: "Short sentences that use the journey words of this unit. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-5096":
    native: "Where is my passport?"
    confusables:
      "w1": { why: "Visa, not passport: वीज़ा (vīzā) means visa." }
      "w2": { why: "Ticket, not passport: टिकट (ṭikaṭ) means ticket." }
  "hi-5097":
    native: "The train will leave soon."
    confusables:
      "w1": { why: "Ship, not train: जहाज़ (jahāz) means ship." }
      "w2": { why: "Boat, not train: नाव (nāv) means boat." }
  "hi-5098":
    native: "My booking was confirmed."
    confusables:
      "w1": { why: "Passport, not booking: पासपोर्ट (pāspōrṭ) means passport." }
      "w2": { why: "Visa, not booking: वीज़ा (vīzā) means visa." }
  "hi-5099":
    native: "I want a window seat."
    bases:
      "वाली": "with; having (feminine)"
    confusables:
      "w1": { why: "Berth, not seat: बर्थ (barth) means a sleeping berth." }
      "w2": { why: "Room, not seat: कमरा (kamrā) means room." }
  "hi-5100":
    native: "The train will arrive late."
    confusables:
      "w1": { why: "To stop, not arrive: रुकना (ruknā) means to stop." }
      "w2": { why: "To get off, not arrive: उतरना (utrnā) means to get off." }
  "hi-5101":
    native: "We stayed on the platform for a long time."
    confusables:
      "w1": { why: "To board, not stay: चढ़ना (caṛhnā) means to board." }
      "w2": { why: "To be left behind, not stay: छूटना (chūṭnā) means to be left behind." }
  "hi-5102":
    native: "The passengers boarded the train."
    confusables:
      "w1": { why: "To get off, not board: उतरना (utrnā) means to get off." }
      "w2": { why: "To lose, not board: खोना (khōnā) means to lose." }
  "hi-5103":
    native: "Your luggage was left behind on the train."
    confusables:
      "w1": { why: "To lose, not be left behind: खोना (khōnā) means to lose." }
      "w2": { why: "To get off, not be left behind: उतरना (utrnā) means to get off." }
  "hi-5104":
    native: "Give the porter some money."
    confusables:
      "w1": { why: "Guide, not porter: गाइड (gāiḍ) means guide." }
      "w2": { why: "Passenger, not porter: यात्री (yātrī) means passenger; traveller." }
  "hi-5105":
    native: "Tourists went to the valley by boat."
    confusables:
      "w1": { why: "Ship, not boat: जहाज़ (jahāz) means ship." }
      "w2": { why: "Shore, not valley: किनारा (kinārā) means shore." }
  "hi-5106":
    native: "This journey is safe and comfortable."
    confusables:
      "w1": { why: "Easy, not safe: आसान (āsān) means easy." }
      "w2": { why: "Difficult, not safe: मुश्किल (muśkil) means difficult." }
  "hi-5107":
    native: "We need a visa."
    confusables:
      "w1": { why: "Passport, not visa: पासपोर्ट (pāspōrṭ) means passport." }
      "w2": { why: "Ticket, not visa: टिकट (ṭikaṭ) means ticket." }
  "hi-5108":
    native: "The guide will show us the city."
    confusables:
      "w1": { why: "Village, not city: गाँव (gām̐v) means village." }
      "w2": { why: "Country, not city: देश (dēś) means country." }
