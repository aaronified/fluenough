cards:
  "hi-5532":
    native: "We should protect the environment."
    bases:
      "हमें": "we (to us)"
      "की": "of"
      "रक्षा": "protection"
      "करनी": "to do"
      "चाहिए": "should"
    confusables:
      "w1": { why: "Pollution, not environment: प्रदूषण (pradūśaṇ) means pollution." }
      "w2": { why: "Animal, not environment: जानवर (jānvar) means animal." }
  "hi-5533":
    native: "Factories pollute the rivers."
    bases:
      "कारखाने": "factories"
      "नदियों": "rivers"
      "करते": "pollute (do)"
    confusables:
      "w1": { why: "Clean, not polluted: स्वच्छ (svacch) means clean; pure." }
      "w2": { why: "Barren, not polluted: बंजर (bañjar) means barren; infertile." }
  "hi-5534":
    native: "Do not throw rubbish on the road."
    bases:
      "सड़क": "road"
      "मत": "do not"
      "फेंकिए": "throw (polite)"
    confusables:
      "w1": { why: "Pollution, not rubbish: प्रदूषण (pradūśaṇ) means pollution." }
      "w2": { why: "Recycling, not throwing away: पुनर्चक्रण (punarcakraṇ) means recycling." }
  "hi-5535":
    native: "Birds and animals live in the forest."
    bases:
      "जंगल": "forest"
      "रहते": "live"
    confusables:
      "w1": { why: "Wild, an adjective, not forest: वन्य (vany) means wild; of the forest." }
      "w2": { why: "Extinct, not living: लुप्त (lupt) means extinct; disappeared." }
  "hi-5536":
    native: "The government protects wildlife."
    bases:
      "सरकार": "government"
      "करती": "does"
    confusables:
      "w1": { why: "Green; eco-friendly, not protection: हरित (harit) means green; eco-friendly." }
      "w2": { why: "Safety, close to protection: सुरक्षा (surakśā) means safety; protection." }
  "hi-5537":
    native: "Forests are decreasing because of cutting."
    bases:
      "जंगल": "forest"
      "हो": "become"
      "रहा": "(continuous)"
    confusables:
      "w1": { why: "Barren, not forest: बंजर (bañjar) means barren; infertile." }
      "w2": { why: "Recycling, not cutting: पुनर्चक्रण (punarcakraṇ) means recycling." }
  "hi-5538":
    native: "Through recycling, waste decreases."
    bases:
      "होता": "becomes"
    confusables:
      "w1": { why: "Pollution, not recycling: प्रदूषण (pradūśaṇ) means pollution." }
      "w2": { why: "Change, not reduction: परिवर्तन (parivartan) means change." }
  "hi-5539":
    native: "Clean breeze is good for health."
    bases:
      "सेहत": "health"
      "के": "for"
      "लिए": "for"
    confusables:
      "w1": { why: "Polluted, not clean: दूषित (dūśit) means polluted; contaminated." }
      "w2": { why: "Global, not clean: ग्लोबल (glōbal) means global; world-wide." }
  "hi-5540":
    native: "Protecting nature is everyone's responsibility."
    bases:
      "प्रकृति": "nature"
      "की": "of"
      "सबकी": "everyone's"
      "ज़िम्मेदारी": "responsibility"
    confusables:
      "w1": { why: "Change, not protection: परिवर्तन (parivartan) means change." }
      "w2": { why: "Diversity, not protection: विविधता (vividhtā) means diversity; variety." }
  "hi-5541":
    native: "Because of global warming, ice is melting."
    bases:
      "वार्मिंग": "warming"
      "बर्फ़": "ice"
      "पिघल": "melt"
      "रही": "(continuous)"
    confusables:
      "w1": { why: "Ozone, not warming: ओज़ोन (ōzōn) means ozone." }
      "w2": { why: "Living being, not ice: जीव (jīv) means living being; creature." }
  "hi-5542":
    native: "Keep the river's water clean."
    bases:
      "नदी": "river"
      "पानी": "water"
      "रखिए": "keep (polite)"
    confusables:
      "w1": { why: "Polluted, not clean: दूषित (dūśit) means polluted; contaminated." }
      "w2": { why: "Pollution, not clean water: प्रदूषण (pradūśaṇ) means pollution." }
  "hi-5543":
    native: "Protect endangered animals."
    bases:
      "होते": "being"
      "जानवरों": "animals"
      "की": "of"
      "रक्षा": "protection"
      "कीजिए": "do (polite)"
    confusables:
      "w1": { why: "Bird, not animal in general: पक्षी (pakśī) means bird." }
      "w2": { why: "Living being, not endangered animal: जीव (jīv) means living being; creature." }
