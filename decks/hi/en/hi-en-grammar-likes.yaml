id: "hi-en-grammar-likes"
kind: "layer"
core: "hi-grammar-likes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Likes and dislikes"
license: "CC0-1.0"
description: "पसंद (pasand), अच्छा लगना (acchā lagnā) and प्यार करना (pyār karnā): what you like, enjoy and love. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0469":
    native: "liking; choice"
    notes:
      "n1": "The liker takes को (kō): मुझे (mujhē), उसे (usē), आपको (āpkō) … पसंद है (pasand hai)."
  "hi-0470":
    native: "I like sweets."
  "hi-0471":
    native: "I don't like this song."
  "hi-0472":
    native: "Do you like Delhi?"
  "hi-0473":
    native: "I like it; I enjoy it."
    notes:
      "n1": "'To me it feels good'. For a single moment: मुझे अच्छा लगा (mujhē acchā lagā), I enjoyed it."
  "hi-0474":
    native: "I really enjoyed it."
  "hi-0475":
    native: "love"
  "hi-0476":
    native: "I love you. (said by a man)"
    notes:
      "n1": "A woman says प्यार करती हूँ (pyār kartī hūm̐). You love से (sē) someone, not को (kō)."
  "hi-0477":
    native: "He likes playing cricket. / She likes playing cricket."
  "hi-0478":
    native: "I don't like spicy food."
  "hi-0479":
    native: "favourite"
    notes:
      "n1": "मेरा पसंदीदा गाना (mērā pasandīdā gānā), my favourite song."
