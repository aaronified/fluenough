schema: 1
id: "hi-en-grammar-likes"
kind: "layer"
core: "hi-grammar-likes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Likes and dislikes"
license: "CC-BY-SA-4.0"
description: "पसंद (pasand), अच्छा लगना (acchā lagnā) and प्यार करना (pyār karnā): what you like, enjoy and love. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0469":
    native: "liking; choice"
    notes:
      "n1": "The liker takes को (kō): मुझे (mujhē), उसे (usē), आपको (āpkō) … पसंद है (pasand hai)."
    "examples": {
      "ठंडी जलवायु पसंद है।": {"native": "I like a cold climate.", "bases": {"पसंद": "liking; choice"}},
      "मुझे अंग्रेज़ी पसंद है।": {"native": "I like English.", "bases": {"मुझे": "to me", "अंग्रेज़ी": "English (the language)", "पसंद": "liking"}}
    }
  "hi-0470":
    native: "I like sweets."
    notes:
      "n1": "Only the liker takes को (kō): मुझे (mujhē), to me; the liked thing, मिठाई (miṭhāī), takes no postposition."
    bases:
      "मुझे": "I"
      "मिठाई": "sweets"
  "hi-0471":
    native: "I don't like this song."
    notes:
      "n1": "Negation: नहीं (nahīm̐) goes between पसंद (pasand) and है (hai): पसंद (pasand) नहीं (nahīm̐) है (hai), is not liked."
    bases:
      "मुझे": "I"
      "यह": "this"
      "गाना": "song"
  "hi-0472":
    native: "Do you like Delhi?"
    notes:
      "n1": "To an elder or a stranger the liker is आपको (āpkō), formal you; to a friend it is तुम्हें (tumhēn)."
    bases:
      "दिल्ली": "Delhi"
  "hi-0473":
    native: "I like it; I enjoy it."
    notes:
      "n1": "'To me it feels good'. For a single moment: मुझे अच्छा लगा (mujhē acchā lagā), I enjoyed it."
    bases:
      "मुझे": "I"
      "अच्छा": "good; nice"
      "लगता": "to seem; to feel"
  "hi-0474":
    native: "I really enjoyed it."
    bases:
      "बहुत": "very; a lot"
      "अच्छा": "good; nice"
      "लगा": "to seem; to feel"
  "hi-0475":
    native: "love"
    notes:
      "n1": "To say 'to love', use प्यार (pyār) करना (karnā), literally 'do love'."
    "examples": {
      "जानवरों से प्यार करो।": {"native": "Love animals.", "bases": {"जानवरों": "animal", "प्यार": "love"}},
      "मैं तुमसे प्यार करता हूँ।": {"native": "I love you. (said by a man)", "bases": {"मैं": "I", "तुमसे": "you (familiar)", "करता": "to do; to make", "हूँ": "to be"}}
    }
  "hi-0476":
    native: "I love you. (said by a man)"
    notes:
      "n1": "A woman says प्यार करती हूँ (pyār kartī hūm̐). You love से (sē) someone, not को (kō)."
    bases:
      "मैं": "I"
      "तुमसे": "you (familiar)"
      "करता": "to do; to make"
      "हूँ": "to be"
  "hi-0477":
    native: "He likes playing cricket.; She likes playing cricket."
    notes:
      "n1": "A liked activity is an infinitive: खेलना (khēlnā), playing, with the liker उसे (usē)."
    bases:
      "उसे": "he; she"
      "क्रिकेट": "cricket"
      "खेलना": "to play"
  "hi-0478":
    native: "I don't like spicy food."
    notes:
      "n1": "तीखा (tīkhā) agrees with the masculine खाना (khānā), food, so it is तीखा (tīkhā), not तीखी (tīkhī)."
    bases:
      "मुझे": "I"
  "hi-0479":
    native: "favourite"
    notes:
      "n1": "मेरा पसंदीदा गाना (mērā pasandīdā gānā), my favourite song."
    "examples": {
      "गणित और विज्ञान मेरे पसंदीदा विषय हैं।": {"native": "Maths and science are my favourite subjects.", "bases": {"मेरे": "my", "पसंदीदा": "favourite", "विषय": "subject"}}
    }
