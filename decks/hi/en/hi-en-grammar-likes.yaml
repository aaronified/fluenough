    bases:
      "दिल्ली": "Delhi"
  "hi-0473":
    native: "I like it; I enjoy it."
    notes:
      "n1": "'To me it feels good'. For a single moment: मुझे अच्छा लगा (mujhē acchā lagā), I enjoyed it."
    bases:
      "मुझे": "I"
      "अच्छा": "good; nice"
      "लगता": "to seem; to feel"
  "hi-0474":
