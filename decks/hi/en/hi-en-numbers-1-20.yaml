schema: 1
id: "hi-en-numbers-1-20"
kind: "layer"
core: "hi-numbers-1-20"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Numbers 1–20"
license: "CC-BY-SA-4.0"
description: "One to twenty. In Hindi every number up to a hundred has its own word, so these are the ones to learn first."
cards:
  "hi-0198":
    native: "1, one"
    notes:
      "n1": "Hindi has its own digits, १ २ ३ (1 2 3), but prices, buses and phone numbers use 1 2 3."
    "examples": {
      "एक लड़का आया।": {"native": "A boy came.", "bases": {"लड़का": "boy", "आया": "to come"}}
    }
  "hi-0199":
    native: "2, two"
    "examples": {
      "हाज़िरी दो।": {"native": "Answer the roll call.", "bases": {"हाज़िरी": "attendance", "दो": "to give"}}
    }
  "hi-0200":
    native: "3, three"
    "examples": {
      "तीन नंबर प्लेटफ़ॉर्म पर जाओ।": {"native": "Go to platform number three.", "bases": {"तीन": "3, three"}}
    }
  "hi-0201":
    native: "4, four"
    "examples": {
      "रोशनी चारों ओर फैलती है।": {"native": "Light spreads all around.", "bases": {"ओर": "direction", "फैलती": "to spread", "चारों": "4, four"}}
    }
  "hi-0202":
    native: "5, five"
    "examples": {
      "कुल रकम पाँच सौ है।": {"native": "The total sum is five hundred.", "bases": {"कुल": "total", "पाँच": "5, five"}},
      "पाँच सौ ग्राम पनीर दीजिए।": {"native": "Give me five hundred grams of paneer.", "bases": {"पनीर": "paneer", "पाँच": "5, five"}}
    }
  "hi-0203":
    native: "6, six"
    notes:
      "n1": "Also written छः (chaḥ), and said 'chhe' in much of the north."
    "examples": {
      "सुबह मुझे छह बजे जगाना।": {"native": "Wake me up at six in the morning.", "bases": {"जगाना": "to wake someone up", "छह": "6, six"}}
    }
  "hi-0204":
    native: "7, seven"
    "examples": {
      "अलार्म सात बजे है।": {"native": "The alarm is set for seven o'clock.", "bases": {"सात": "7, seven"}}
    }
  "hi-0205":
    native: "8, eight"
  "hi-0206":
    native: "9, nine"
    "examples": {
      "कार्यालय सुबह नौ बजे खुलता है।": {"native": "The office opens at nine in the morning.", "bases": {"खुलता": "to open", "नौ": "9, nine"}}
    }
  "hi-0207":
    native: "10, ten"
    "examples": {
      "ट्रेन दस बजे है।": {"native": "The train is at ten o'clock.", "bases": {"दस": "10, ten"}}
    }
  "hi-0208":
    native: "11, eleven"
    "examples": {
      "मैं रात ग्यारह बजे सोता हूँ।": {"native": "I go to bed at eleven at night. (said by a man)", "bases": {"मैं": "I", "हूँ": "to be"}}
    }
  "hi-0209":
    native: "12, twelve"
    "examples": {
      "टीम में बारह खिलाड़ी हैं।": {"native": "There are twelve players in the team.", "bases": {"टीम": "team", "बारह": "twelve"}},
      "दिल्ली में बारह डिग्री है।": {"native": "It is twelve degrees in Delhi.", "bases": {"दिल्ली": "Delhi", "बारह": "12, twelve"}}
    }
  "hi-0210":
    native: "13, thirteen"
  "hi-0211":
    native: "14, fourteen"
  "hi-0212":
    native: "15, fifteen"
  "hi-0213":
    native: "16, sixteen"
  "hi-0214":
    native: "17, seventeen"
  "hi-0215":
    native: "18, eighteen"
  "hi-0216":
    native: "19, nineteen"
  "hi-0217":
    native: "20, twenty"
    "examples": {
      "आज तापमान बीस डिग्री है।": {"native": "Today the temperature is twenty degrees.", "bases": {"बीस": "20, twenty"}}
    }
