cards:
  "hi-4944":
    native: "We celebrate Diwali."
    bases:
      "मनाते": "celebrate (plural habitual)"
    confusables:
      "w1": { why: "Holi, not Diwali: होली (hōlī) is Holi." }
      "w2": { why: "Eid, not Diwali: ईद (īd) is Eid." }
  "hi-4945":
    native: "We light oil lamps at home."
    bases:
      "जलाते": "light (plural habitual)"
    confusables:
      "w1": { why: "Firecracker, not oil lamp: पटाखा (paṭākhā) is a firecracker." }
      "w2": { why: "Light, not oil lamp: रोशनी (rōśnī) means light or illumination." }
  "hi-4946":
    native: "The guests are at home."
    confusables:
      "w1": { why: "Feast, not guests: दावत (dāvat) means feast." }
      "w2": { why: "Friend, not guests: दोस्त (dōst) means friend." }
  "hi-4947":
    native: "There is a feast today."
    confusables:
      "w1": { why: "Blessed food, not feast: प्रसाद (prasād) is blessed food." }
      "w2": { why: "Offering, not feast: भोग (bhōg) is food offered to a god." }
  "hi-4948":
    native: "We wear new clothes."
    bases:
      "नए": "new (plural)"
      "कपड़े": "clothes (plural)"
      "पहनते": "wear (plural habitual)"
    confusables:
      "w1": { why: "Saree, not clothes: साड़ी (sāṛī) is a saree." }
      "w2": { why: "Cap, not clothes: टोपी (ṭōpī) is a cap or hat." }
  "hi-4949":
    native: "The market is very festive."
    confusables:
      "w1": { why: "Fair, not market: मेला (mēlā) means fair." }
      "w2": { why: "Procession, not market: जुलूस (julūs) is a procession." }
  "hi-4950":
    native: "We go to the gurdwara."
    bases:
      "जाते": "go (plural habitual)"
    confusables:
      "w1": { why: "Temple, not gurdwara: मंदिर (mandir) is a temple." }
      "w2": { why: "Mosque, not gurdwara: मस्जिद (masjid) is a mosque." }
  "hi-4951":
    native: "Prayer is held in the mosque."
    bases:
      "होती": "happen (feminine habitual)"
    confusables:
      "w1": { why: "Temple, not mosque: मंदिर (mandir) is a temple." }
      "w2": { why: "Church, not mosque: चर्च (carc) is a church." }
  "hi-4952":
    native: "The children sing the aarti."
    bases:
      "गाते": "sing (plural habitual)"
    confusables:
      "w1": { why: "Religious story, not aarti: कथा (kathā) means a religious story." }
      "w2": { why: "Blessed food, not aarti: प्रसाद (prasād) is blessed food." }
  "hi-4953":
    native: "We share out sweets."
    bases:
      "बाँटते": "share out (plural habitual)"
    confusables:
      "w1": { why: "Vermicelli, not sweets: सेवई (sēvaī) is sweet vermicelli." }
      "w2": { why: "Worship, not sweets: पूजा (pūjā) means worship." }
  "hi-4954":
    native: "Happy birthday!"
    bases:
      "हो": "be (wish form)"
    confusables:
      "w1": { why: "Congratulations, not birthday: बधाई (badhāī) means congratulations." }
      "w2": { why: "Wedding, not birthday: शादी (śādī) means wedding." }
  "hi-4955":
    native: "Good wishes for Diwali!"
    bases:
      "की": "of (feminine)"
      "शुभकामनाएँ": "good wishes (plural)"
    confusables:
      "w1": { why: "Congratulations, not good wishes: बधाई (badhāī) means congratulations." }
      "w2": { why: "Wedding, not Diwali: शादी (śādī) means wedding." }
  "hi-4956":
    native: "Red colour is good."
    confusables:
      "w1": { why: "Decoration, not colour: सजावट (sajāvaṭ) means decoration." }
      "w2": { why: "Oil lamp, not colour: दीया (dīyā) is an oil lamp." }
