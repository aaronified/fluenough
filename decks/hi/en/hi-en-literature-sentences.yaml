      "बताइए": "tell, explain (polite)"
    confusables:
      "w1": { why: "Idiom, not proverb: मुहावरा (muhāvrā) means idiom or expression." }
      "w2": { why: "Grammar, not proverb: व्याकरण (vyākraṇ) means grammar." }
  "hi-5829":
    native: "Where is the grammar book?"
    bases:
      "की": "of (feminine)"
      "है": "is"
    confusables:
      "w1": { why: "Word, not grammar: शब्द (śabd) means word." }
      "w2": { why: "Publisher, not grammar: प्रकाशक (prakāśak) means publisher." }
  "hi-5830":
    native: "Look up this word in the dictionary."
    bases:
