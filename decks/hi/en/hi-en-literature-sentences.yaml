      "w2": { why: "Book, not poem: किताब (kitāb) means book." }
  "hi-5832":
    native: "The character in the story is very interesting."
    bases:
      "कहानी": "story"
      "है": "is"
    confusables:
      "w1": { why: "Novel, not story: उपन्यास (upanyās) means novel." }
      "w2": { why: "Page, not character: पन्ना (pannā) means page." }
  "hi-5833":
    native: "Please open the page."
    bases:
      "खोलिए": "open (polite)"
    confusables:
      "w1": { why: "Chapter, not page: अध्याय (adhyāy) means chapter." }
