cards:
  "hi-5822":
    native: "I like this novel very much."
    bases:
      "मुझे": "me (dative)"
      "है": "is"
    confusables:
      "w1": { why: "Reader, not novel: पाठक (pāṭhak) means reader." }
      "w2": { why: "Ghazal, not novel: ग़ज़ल (ġazal) means ghazal." }
  "hi-5823":
    native: "Readers like it."
    bases:
      "इसे": "it (object)"
      "करते": "do (habitually, plural)"
      "हैं": "are"
    confusables:
      "w1": { why: "Novel, not reader: उपन्यास (upanyās) means novel." }
      "w2": { why: "Page, not reader: पन्ना (pannā) means page." }
  "hi-5824":
    native: "Read the first chapter."
    bases:
      "पहला": "first"
      "पढ़िए": "read (polite)"
    confusables:
      "w1": { why: "Page, not chapter: पन्ना (pannā) means page." }
      "w2": { why: "Preface, not chapter: भूमिका (bhūmikā) means preface or introduction." }
  "hi-5825":
    native: "The preface of this book is good."
    bases:
      "इस": "this (oblique)"
      "की": "of (feminine)"
      "अच्छी": "good (feminine)"
      "है": "is"
    confusables:
      "w1": { why: "Title, not preface: शीर्षक (śīrśak) means title or heading." }
      "w2": { why: "Chapter, not preface: अध्याय (adhyāy) means chapter." }
  "hi-5826":
    native: "Listen to a ghazal."
    bases:
      "सुनिए": "listen (polite)"
    confusables:
      "w1": { why: "Free-verse poem, not ghazal: नज़्म (nazm) means free-verse poem." }
      "w2": { why: "Couplet, not ghazal: दोहा (dōhā) means couplet." }
  "hi-5827":
    native: "Learn this couplet by heart."
    bases:
      "कीजिए": "do (polite)"
    confusables:
      "w1": { why: "Metre, not couplet: छंद (chand) means metre or verse form." }
      "w2": { why: "Idiom, not couplet: मुहावरा (muhāvrā) means idiom." }
  "hi-5828":
    native: "Explain the meaning of this proverb."
    bases:
