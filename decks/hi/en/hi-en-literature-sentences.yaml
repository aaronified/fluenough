      "w1": { why: "Grammar, not dictionary: व्याकरण (vyākraṇ) means grammar." }
      "w2": { why: "Collection, not dictionary: संग्रह (saṅgrah) means collection." }
  "hi-5831":
    native: "She wrote a new poem."
