schema: 1
id: "hi-en-verbs-3"
kind: "layer"
core: "hi-verbs-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More daily actions"
license: "CC-BY-SA-4.0"
description: "More everyday verbs: holding, pulling, covering, tying, counting and looking after things. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "hi-1795":
    native: "to cover oneself; to put on a blanket"
    notes:
      "n1": "To pull a blanket or a shawl over the body. The bed is spread with बिछाना (bichānā)."
    examples:
      "ठंड में चादर ओढ़ो।": { "native": "In the cold, cover yourself with a sheet.", "bases": {"ओढ़ो": "to cover oneself"} }
      "वह कंबल ओढ़कर सोता है।": { "native": "He sleeps covered with a blanket.", "bases": {"कंबल": "blanket", "ओढ़कर": "to cover oneself"} }
  "hi-1796":
    native: "to spread out (a bed or a mat)"
    notes:
      "n1": "To lay out a sheet, mat or bedding on the floor or a bed."
    examples:
      "फर्श पर दरी बिछाओ।": { "native": "Spread the rug on the floor.", "bases": {"दरी": "rug; carpet", "बिछाओ": "to spread out"} }
      "उसने बिस्तर बिछाया।": { "native": "He spread the bed.", "bases": {"बिछाया": "to spread out"} }
  "hi-1797":
    native: "to touch"
    notes:
      "n1": "To touch something with the hand or a part of the body. The noun is छूत (chūt), contact."
    examples:
      "गरम तवे को मत छुओ।": { "native": "Do not touch the hot griddle.", "bases": {"मत": "do not", "छुओ": "to touch"} }
      "उसने मेरे पैर छुए।": { "native": "He touched my feet.", "bases": {"छुए": "to touch"} }
  "hi-1798":
    native: "to hold; to catch"
    notes:
      "n1": "To take hold of something firmly, or to catch a person or an animal."
    examples:
      "रेलिंग कसकर पकड़ो।": { "native": "Hold the railing tightly.", "bases": {"रेलिंग": "railing", "कसकर": "tightly", "पकड़ो": "to hold"} }
      "बिल्ली ने चूहा पकड़ा।": { "native": "The cat caught the mouse.", "bases": {"ने": "by; the doer of a past action", "चूहा": "mouse", "पकड़ा": "to hold"} }
  "hi-1799":
    native: "to pull; to draw; to take (a photograph)"
    notes:
      "n1": "To draw something towards oneself by force. The opposite is धकेलना (dhakēlnā), to push. With तस्वीर (tasvīr), a picture, it means to take a photograph."
    examples:
      "रस्सी ज़ोर से खींचो।": { "native": "Pull the rope hard.", "bases": {"ज़ोर": "force", "खींचो": "to pull"} }
      "उसने मेरी चुन्नी खींची।": { "native": "He pulled my scarf.", "bases": {"चुन्नी": "scarf", "खींची": "to pull"} }
  "hi-1800":
    native: "to push"
    notes:
      "n1": "To push something away or forward with force."
    examples:
      "दरवाज़ा धीरे धकेलो।": { "native": "Push the door slowly.", "bases": {"धकेलो": "to push"} }
      "उसने मुझे धकेला।": { "native": "He pushed me.", "bases": {"धकेला": "to push"} }
  "hi-1801":
    native: "to get stuck; to be caught"
    notes:
      "n1": "To be held or caught in a place, so that one cannot move. The causal is फँसाना (pham̐sānā), to trap."
    examples:
      "चाबी ताले में फँस गई।": { "native": "The key got stuck in the lock.", "bases": {"ताले": "lock", "फँस": "to get stuck"} }
      "गाड़ी कीचड़ में फँसी है।": { "native": "The car is stuck in the mud.", "bases": {"गाड़ी": "car", "फँसी": "to get stuck"} }
  "hi-1802":
    native: "to hit; to kill"
    notes:
      "n1": "To hit someone or something. It is also used of killing an animal, and of a mosquito's bite."
    examples:
      "मच्छर मत मारो।": { "native": "Do not kill the mosquito.", "bases": {"मच्छर": "mosquito", "मत": "do not", "मारो": "to hit"} }
      "उसने गेंद को ज़ोर से मारा।": { "native": "He hit the ball hard.", "bases": {"ज़ोर": "force", "मारा": "to hit"} }
  "hi-1803":
    native: "to bend; to bow"
    notes:
      "n1": "To bend the body forward or down. The causal is झुकाना (jhukānā)."
    examples:
      "ज़रा झुककर उठाओ।": { "native": "Bend a little and pick it up.", "bases": {"ज़रा": "a little", "झुककर": "to bend"} }
      "वह सिर झुकाकर बैठा है।": { "native": "He is sitting with his head bowed.", "bases": {"झुकाकर": "to bend"} }
  "hi-1804":
    native: "to drive; to run; to operate"
    notes:
      "n1": "To make a vehicle or a machine go. The verb चलना (calnā) is to walk or to go on."
    examples:
      "वह गाड़ी अच्छी चलाता है।": { "native": "He drives the car well.", "bases": {"गाड़ी": "car", "चलाता": "to drive"} }
      "पंखा चलाओ।": { "native": "Switch on the fan.", "bases": {"चलाओ": "to drive"} }
  "hi-1805":
    native: "to erase; to wipe out"
    notes:
      "n1": "To remove writing or a mark, or to destroy something completely."
    examples:
      "ब्लैकबोर्ड मिटाओ।": { "native": "Erase the blackboard.", "bases": {"मिटाओ": "to erase"} }
      "दाग़ मिट गया।": { "native": "The stain has gone.", "bases": {"मिट": "to be erased"} }
  "hi-1806":
    native: "to search; to look for"
    notes:
      "n1": "To look for something that is lost, or to search in a place. ढूँढना (ḍhūm̐ḍhanā) is more common in everyday speech."
    examples:
      "मैं चाबी खोज रहा हूँ।": { "native": "I am looking for the key.", "bases": {"खोज": "to search"} }
      "उसने नई नौकरी खोजी।": { "native": "He looked for a new job.", "bases": {"खोजी": "to search"} }
  "hi-1807":
    native: "to count"
    notes:
      "n1": "To count numbers or things, one by one."
    examples:
      "बच्चे सौ तक गिन रहे हैं।": { "native": "The children are counting up to a hundred.", "bases": {"गिन": "to count"} }
      "पैसे गिन लो।": { "native": "Count the money.", "bases": {"पैसे": "money", "गिन": "to count"} }
  "hi-1808":
    native: "to measure"
    notes:
      "n1": "To find out the size or length of something with a tool. The noun is नाप (nāp), a measure."
    examples:
      "खिड़की की चौड़ाई नापो।": { "native": "Measure the width of the window.", "bases": {"चौड़ाई": "width", "नापो": "to measure"} }
      "दर्ज़ी ने कमीज़ नापी।": { "native": "The tailor measured the shirt.", "bases": {"दर्ज़ी": "tailor", "ने": "by", "नापी": "to measure"} }
  "hi-1809":
    native: "to add; to join"
    notes:
      "n1": "To add numbers together, or to join things. The opposite is घटाना (ghaṭānā), to subtract."
    examples:
      "दोनों संख्याएँ जोड़ो।": { "native": "Add the two numbers.", "bases": {"दोनों": "both", "संख्याएँ": "number", "जोड़ो": "to add"} }
      "उसने दोनों पत्ते जोड़े।": { "native": "He joined the two leaves.", "bases": {"दोनों": "both", "पत्ते": "leaf", "जोड़े": "to add"} }
  "hi-1810":
    native: "to subtract; to reduce"
    notes:
      "n1": "To take away a number, or to lower an amount. The opposite is जोड़ना (jōṛnā), to add."
    examples:
      "दस में से तीन घटाओ।": { "native": "Subtract three from ten.", "bases": {"घटाओ": "to subtract"} }
      "दुकानदार ने कीमत घटाई।": { "native": "The shopkeeper reduced the price.", "bases": {"ने": "by", "घटाई": "to subtract"} }
  "hi-1811":
    native: "to tie; to bind"
    notes:
      "n1": "To tie things together, or to tie a bag or a bundle."
    examples:
      "गठरी अच्छी तरह बाँधो।": { "native": "Tie the bundle properly.", "bases": {"गठरी": "bundle", "तरह": "way", "बाँधो": "to tie"} }
      "उसने जूते के फीते बाँधे।": { "native": "He tied his shoelaces.", "bases": {"फीते": "lace", "बाँधे": "to tie"} }
  "hi-1812":
    native: "to drop; to bring down"
    notes:
      "n1": "To let something fall, or to pull a thing down. The intransitive is गिरना (girnā)."
    examples:
      "गिलास मत गिराओ।": { "native": "Do not drop the glass.", "bases": {"मत": "do not", "गिराओ": "to drop"} }
      "बच्चे ने दूध गिरा दिया।": { "native": "The child spilt the milk.", "bases": {"ने": "by", "गिरा": "to drop"} }
  "hi-1813":
    native: "to stop; to hold back"
    notes:
      "n1": "To stop someone or something from moving, or to hold something back."
    examples:
      "बस रोको।": { "native": "Stop the bus.", "bases": {"रोको": "to stop"} }
      "उसने आँसू रोके।": { "native": "He held back his tears.", "bases": {"आँसू": "tear", "रोके": "to stop"} }
  "hi-1814":
    native: "to hide"
    notes:
      "n1": "To put something out of sight. The intransitive, to be hidden, is छुपना (chupnā)."
    examples:
      "चाबी कहाँ छुपाई?": { "native": "Where did you hide the key?", "bases": {"छुपाई": "to hide"} }
      "उसने सच छुपाया।": { "native": "He hid the truth.", "bases": {"सच": "truth", "छुपाया": "to hide"} }
  "hi-1815":
    native: "to show"
    notes:
      "n1": "To let someone see something. The verb दिखना (dikhnā) is to be seen or to look."
    examples:
      "मुझे अपना घर दिखाओ।": { "native": "Show me your house.", "bases": {"दिखाओ": "to show"} }
      "दुकानदार ने नई साड़ियाँ दिखाईं।": { "native": "The shopkeeper showed new saris.", "bases": {"ने": "by", "दिखाईं": "to show"} }
  "hi-1816":
    native: "to choose; to pick"
    notes:
      "n1": "To select one or more things from a set. The noun is चुनाव (cunāv), election or choice."
    examples:
      "अपनी पसंद का रंग चुनो।": { "native": "Choose the colour you like.", "bases": {"चुनो": "to choose"} }
      "उसने सबसे अच्छा आम चुना।": { "native": "He picked the best mango.", "bases": {"सबसे": "most", "चुना": "to choose"} }
  "hi-1817":
    native: "to break open; to crack; to burst"
    notes:
      "n1": "To break open a shell or a pot, or to burst a boil or a balloon."
    examples:
      "नारियल फोड़ो।": { "native": "Break the coconut.", "bases": {"फोड़ो": "to break open"} }
      "बच्चे ने गुब्बारा फोड़ा।": { "native": "The child burst the balloon.", "bases": {"ने": "by", "गुब्बारा": "balloon", "फोड़ा": "to break open"} }
  "hi-1818":
    native: "to drip; to leak"
    notes:
      "n1": "To fall in drops, as water from a roof or a tap that is not closed."
    examples:
      "नल से पानी टपक रहा है।": { "native": "Water is dripping from the tap.", "bases": {"टपक": "to drip"} }
      "छत से पानी टपकता है।": { "native": "Water drips from the roof.", "bases": {"टपकता": "to drip"} }
  "hi-1819":
    native: "to run away; to run"
    notes:
      "n1": "To run, or to run away from a place. The noun is भागदौड़ (bhāgdauṛ), rush."
    examples:
      "बच्चे बाग़ में भाग रहे हैं।": { "native": "The children are running in the garden.", "bases": {"भाग": "to run"} }
      "चोर पुलिस को देखकर भाग गया।": { "native": "The thief ran away on seeing the police.", "bases": {"चोर": "thief", "भाग": "to run"} }
  "hi-1820":
    native: "to shout; to scream"
    notes:
      "n1": "To shout loudly, in anger or in fear."
    examples:
      "मत चिल्लाओ, मैं सुन रहा हूँ।": { "native": "Do not shout, I can hear you.", "bases": {"मत": "do not", "चिल्लाओ": "to shout"} }
      "वह डर के मारे चिल्लाई।": { "native": "She screamed out of fear.", "bases": {"डर": "fear", "मारे": "because of", "चिल्लाई": "to shout"} }
  "hi-1821":
    native: "to bear; to endure"
    notes:
      "n1": "To put up with pain, hardship or a difficult person."
    examples:
      "वह दर्द चुपचाप सहता है।": { "native": "He bears pain silently.", "bases": {"चुपचाप": "silently", "सहता": "to bear"} }
      "मैं गरमी नहीं सह सकता।": { "native": "I cannot bear the heat.", "bases": {"गरमी": "heat", "सह": "to bear"} }
  "hi-1822":
    native: "to explain; to convince"
    notes:
      "n1": "To make something clear, or to persuade someone with reasons."
    examples:
      "टीचर ने सवाल समझाया।": { "native": "The teacher explained the question.", "bases": {"टीचर": "teacher", "ने": "by", "समझाया": "to explain"} }
      "मुझे अपनी बात समझाओ।": { "native": "Explain your point to me.", "bases": {"बात": "matter; point", "समझाओ": "to explain"} }
  "hi-1823":
    native: "to be afraid"
    notes:
      "n1": "To be afraid of someone or something. The noun is डर (ḍar), fear."
    examples:
      "कुत्ते से मत डरो।": { "native": "Do not be afraid of the dog.", "bases": {"मत": "do not", "डरो": "to be afraid"} }
      "वह अँधेरे से डरती है।": { "native": "She is afraid of the dark.", "bases": {"अँधेरे": "darkness", "डरती": "to be afraid"} }
  "hi-1824":
    native: "to solve; to untangle"
    notes:
      "n1": "To solve a problem, or to untangle things that are knotted."
    examples:
      "यह पहेली सुलझाओ।": { "native": "Solve this puzzle.", "bases": {"सुलझाओ": "to solve"} }
      "उसने धागे सुलझाए।": { "native": "He untangled the threads.", "bases": {"धागे": "thread", "सुलझाए": "to solve"} }
  "hi-1825":
    native: "to save; to protect"
    notes:
      "n1": "To keep someone or something safe from harm, or to put money aside. The intransitive is बचना (bacnā)."
    examples:
      "उसने बच्चे की जान बचाई।": { "native": "He saved the child's life.", "bases": {"जान": "life", "बचाई": "to save"} }
      "पैसे बचाओ।": { "native": "Save money.", "bases": {"पैसे": "money", "बचाओ": "to save"} }
  "hi-1826":
    native: "to escape; to be saved"
    notes:
      "n1": "To get away from harm, or to be spared. The causal is बचाना (bacānā), to save."
    examples:
      "वह हादसे में बच गया।": { "native": "He escaped in the accident.", "bases": {"हादसे": "accident", "बच": "to escape"} }
      "मैं गरमी से बच नहीं सका।": { "native": "I could not escape the heat.", "bases": {"गरमी": "heat", "बच": "to escape"} }
  "hi-1827":
    native: "to get; to find; to obtain"
    notes:
      "n1": "To get something, or to find it. The past tense of the verb is often मिला (milā), got."
    examples:
      "उसने नौकरी पाई।": { "native": "He got a job.", "bases": {"पाई": "to get"} }
      "मुझे अपनी चाबी मिल गई।": { "native": "I found my key.", "bases": {} }
  "hi-1828":
    native: "to press; to suppress"
    notes:
      "n1": "To press something down, or to keep a feeling in."
    examples:
      "बटन दबाओ।": { "native": "Press the button.", "bases": {"बटन": "button", "दबाओ": "to press"} }
      "उसने अपना गुस्सा दबाया।": { "native": "He suppressed his anger.", "bases": {"गुस्सा": "anger", "दबाया": "to press"} }
  "hi-1829":
    native: "to wrap; to wind round"
    notes:
      "n1": "To wrap something round a thing, as a cloth or a thread."
    examples:
      "तोहफ़ा कागज़ में लपेटो।": { "native": "Wrap the gift in paper.", "bases": {"तोहफ़ा": "gift", "लपेटो": "to wrap"} }
      "उसने गले में मफ़लर लपेटा।": { "native": "He wrapped a muffler round his neck.", "bases": {"मफ़लर": "muffler", "लपेटा": "to wrap"} }
  "hi-1830":
    native: "to hang"
    notes:
      "n1": "To hang something up, as clothes on a hook or a line."
    examples:
      "कपड़े अलगनी पर टाँगो।": { "native": "Hang the clothes on the hanger.", "bases": {"अलगनी": "clothes-line", "टाँगो": "to hang"} }
      "दीवार पर घड़ी टँगी है।": { "native": "A clock hangs on the wall.", "bases": {"दीवार": "wall", "टँगी": "to hang"} }
  "hi-1831":
    native: "to hang up; to dangle"
    notes:
      "n1": "To hang something from a height, so that it swings. Intransitive is लटकना (laṭknā)."
    examples:
      "दरवाज़े पर ताला लटकाओ।": { "native": "Hang a lock on the door.", "bases": {"ताला": "lock", "लटकाओ": "to hang up"} }
      "उसने पेड़ से झूला लटकाया।": { "native": "He hung a swing from the tree.", "bases": {"पेड़": "tree", "झूला": "swing", "लटकाया": "to hang up"} }
  "hi-1832":
    native: "to stick; to paste"
    notes:
      "n1": "To fix one thing to another with glue or paste."
    examples:
      "पोस्टर दीवार पर चिपकाओ।": { "native": "Stick the poster on the wall.", "bases": {"पोस्टर": "poster", "दीवार": "wall", "चिपकाओ": "to stick"} }
      "उसने लिफ़ाफ़ा चिपकाया।": { "native": "He stuck down the envelope.", "bases": {"लिफ़ाफ़ा": "envelope", "चिपकाया": "to stick"} }
  "hi-1833":
    native: "to be made; to become"
    notes:
      "n1": "To be made or formed, or to become something. The causal is बनाना (banānā), to make."
    examples:
      "यह कुर्सी लकड़ी से बनी है।": { "native": "This chair is made of wood.", "bases": {"लकड़ी": "wood", "बनी": "to be made"} }
      "वह डॉक्टर बन गया।": { "native": "He became a doctor.", "bases": {"बन": "to become"} }
  "hi-1834":
    native: "to cover"
    notes:
      "n1": "To put a lid or a cover on something."
    examples:
      "बर्तन का ढक्कन ढको।": { "native": "Cover the pot with its lid.", "bases": {"ढको": "to cover"} }
      "उसने चेहरा हाथों से ढका।": { "native": "He covered his face with his hands.", "bases": {"ढका": "to cover"} }
  "hi-1835":
    native: "to feed; to make someone eat"
    notes:
      "n1": "To give food to someone. The causal of खाना (khānā), to eat."
    examples:
      "बच्चे को दूध और रोटी खिलाओ।": { "native": "Feed the child milk and bread.", "bases": {"खिलाओ": "to feed"} }
      "दादी ने सबको लड्डू खिलाए।": { "native": "Grandmother fed everyone sweets.", "bases": {"ने": "by", "खिलाए": "to feed"} }
  "hi-1836":
    native: "to give to drink"
    notes:
      "n1": "To give a drink to someone. The causal of पीना (pīnā), to drink."
    examples:
      "मेहमान को पानी पिलाओ।": { "native": "Give the guest water to drink.", "bases": {"पिलाओ": "to give to drink"} }
