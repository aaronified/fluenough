schema: 1
id: "hi-en-script-reading"
kind: "layer"
core: "hi-script-reading"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words to read"
license: "CC-BY-SA-4.0"
description: "Short everyday words written with letters alone, no vowel signs: the headline and its gaps, the standing line, the dot below and the vowel you do not see, at work."
tags: ["unreviewed"]
cards:
  "hi-0192":
    native: "house; home"
    notes:
      "n1": "Two letters under one headline. घ (gha) is gha and र (ra) is ra, but the last a isn't said: ghar."
  "hi-0300":
    native: "yesterday; tomorrow"
    notes:
      "n1": "क (ka) and ल (la); the last a is quiet."
  "hi-0049":
    native: "water"
    notes:
      "n1": "ज (ja) has a standing line; the last a is quiet."
    "examples": {
      "हाथ जल गया।": {"native": "The hand got burnt.", "bases": {"जल": "to burn"}},
      "लकड़ियाँ अच्छी तरह जल रही हैं।": {"native": "The wood is burning well.", "bases": {"लकड़ियाँ": "wood", "तरह": "way", "जल": "to burn"}}
    }
  "hi-0050":
    native: "lotus"
    notes:
      "n1": "Three letters and no vowel written: ka-ma-l."
    "examples": {
      "सुबह कमल खिलता है।": {"native": "In the morning the lotus opens.", "bases": {"खिलता": "to bloom", "कमल": "lotus"}}
    }
  "hi-0051":
    native: "salt"
    notes:
      "n1": "न (na), म (ma) and क (ka), each with its a, and the last one quiet."
    "examples": {
      "पानी में नमक डालो।": {"native": "Put salt in the water.", "bases": {"डालो": "to put in", "नमक": "salt"}},
      "स्वाद में नमक कम है।": {"native": "The taste has too little salt.", "bases": {"स्वाद": "taste", "नमक": "salt"}}
    }
  "hi-0052":
    native: "fruit"
    notes:
      "n1": "फ (pha) is प (pa) with a curl, and a breath after it: ph."
    "examples": {
      "व्रत में लोग सिर्फ़ फल लेते हैं।": {"native": "During a fast people take only fruit.", "bases": {"फल": "fruit"}}
    }
  "hi-0374":
    native: "bus; enough"
    notes:
      "n1": "ब (ba) has a line across it; without it, it would be व (va)."
    "examples": {
      "बस आरामदेह है।": {"native": "The bus is comfortable.", "bases": {"बस": "bus; enough"}},
      "बस यहाँ रुकती है।": {"native": "The bus stops here.", "bases": {"रुकती": "to stop", "बस": "bus; enough"}}
    }
  "hi-0053":
    native: "we"
    notes:
      "n1": "ह (ha) has no standing line; म (ma) does."
    "examples": {
      "हम खूब हँसे।": {"native": "We laughed a lot.", "bases": {"हँसे": "to laugh"}},
      "हम संग्रहालय गए।": {"native": "We went to the museum.", "bases": {"हम": "we"}}
    }
  "hi-0054":
    native: "all; everyone"
    notes:
      "n1": "स (sa) is s, never sh."
    "examples": {
      "सब खुश हैं।": {"native": "Everyone is happy.", "bases": {"सब": "all; everyone"}},
      "सब ज़िम्मेदार हैं।": {"native": "Everyone is responsible.", "bases": {"सब": "all; everyone"}}
    }
  "hi-0055":
    native: "but; crocodile"
    notes:
      "n1": "Three letters, the last a quiet."
  "hi-0195":
    native: "city"
    notes:
      "n1": "श (śa) is sh; then ह (ha) and र (ra)."
  "hi-0056":
    native: "wealth"
    notes:
      "n1": "ध (dha) has a gap in the headline; without it, it would look like घ (gha)."
    "examples": {
      "संतोष सबसे बड़ा धन है।": {"native": "Contentment is the greatest wealth.", "bases": {"सबसे": "most", "धन": "wealth"}}
    }
  "hi-0057":
    native: "pen"
    notes:
      "n1": "The letters of कमल (kamal) in another order: क (ka), ल (la), म (ma). The last a is quiet. Also written क़लम (qalam), with a dot below the क (ka)."
  "hi-0058":
    native: "hymn"
    notes:
      "n1": "भ (bha) has a gap in the headline, which tells it from म (ma)."
    "examples": {
      "गुरपुरब पर गुरुद्वारे में भजन होता है।": {"native": "At Gurpurab there are hymns at the gurdwara.", "bases": {"भजन": "hymn"}}
    }
  "hi-0298":
    native: "road"
    notes:
      "n1": "ड़ (ṛa) is ड (ḍa) with a dot below: the tongue placed as for ड (ḍa), not touching."
