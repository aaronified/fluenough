description: "Greetings, the respect Hindi builds into them, and how to say you are still learning."
cards:
  "hi-0134":
    native: "you (respectful)"
    notes:
      "n1": "Hindi has three words for 'you'. आप (āp) is for strangers, elders, customers and anyone you should respect; तुम (tum) for friends and equals; तू (tū) only for the very close, and rude to anyone else. A learner is always safe with आप (āp)."
  "hi-0135":
    native: "a word of respect, after a name or a reply"
    notes:
      "n1": "Put जी (jī) after a name or title to show respect: शर्मा जी (śarmā jī), माँ जी (mām̐ jī). जी हाँ (jī hām̐) is a polite yes, जी नहीं (jī nahīm̐) a polite no. On its own, जी (jī) answers someone calling you."
