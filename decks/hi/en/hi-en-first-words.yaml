description: "The respect Hindi builds into 'you', and the word जी (jī). Greetings and saying you are still learning are in the phrasebook."
cards:
  "hi-0134":
    native: "you (respectful)"
    notes:
      "n1": "Hindi has three words for 'you'. आप (āp) is for strangers, elders, customers and anyone you should respect; तुम (tum) for friends and equals; तू (tū) only for the very close, and rude to anyone else. A learner is always safe with आप (āp)."
  "hi-0135":
    native: "a word of respect, after a name or a reply"
    notes:
      "n1": "Put जी (jī) after a name or title to show respect: शर्मा जी (śarmā jī), माँ जी (mām̐ jī). जी हाँ (jī hām̐) is a polite yes, जी नहीं (jī nahīm̐) a polite no. On its own, जी (jī) answers someone calling you."
  "hi-1703":
    native: "fine; all right"
    notes:
      "n1": "ठीक (ṭhīk) is 'fine', 'right' or 'all right'. It is a short answer, and with है (hai), 'is', it says that something is all right. In Urdu it is written ٹھیک (ṭhīk)."
    examples:
      "सब ठीक है।":
        native: "Everything is fine."
        bases:
          "सब": "everything"
          "ठीक": "fine"
          "है": "is"
      "मैं ठीक हूँ।":
        native: "I am fine."
        bases:
          "मैं": "I"
          "ठीक": "fine"
          "हूँ": "am"
  "hi-1704":
    native: "now"
    notes:
      "n1": "अब (ab) is 'now', and it also means 'already' or 'from now on' in a sentence. Before a question it asks 'what next?': अब क्या? (ab kyā?), 'Now what?'."
    examples:
      "अब सही है।":
        native: "Now it is right."
        bases:
          "अब": "now"
          "है": "is"
      "अब क्या?":
        native: "Now what?"
        bases:
          "अब": "now"
