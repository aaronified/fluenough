kind: "layer"
core: "hi-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC0-1.0"
description: "Greetings, the respect Hindi builds into them, and how to say you are still learning."
cards:
  "hi-0132":
    native: "hello; goodbye"
    notes:
      "n1": "Said with palms pressed together, to anyone, at meeting and at parting. In a family, younger people often greet elders by bending to touch their feet (पैर छूना (pair chūnā)) instead; a visitor is not expected to."
  "hi-0133":
    native: "hello (formal)"
    notes:
      "n1": "A more formal नमस्ते (namastē), heard in speeches, on the radio and from officials."
  "hi-0134":
    native: "you (respectful)"
    notes:
      "n1": "Hindi has three words for 'you'. आप (āp) is for strangers, elders, customers and anyone you should respect; तुम (tum) for friends and equals; तू (tū) only for the very close, and rude to anyone else. A learner is always safe with आप (āp)."
  "hi-0135":
    native: "a word of respect, after a name or a reply"
    notes:
      "n1": "Put जी (jī) after a name or title to show respect: शर्मा जी (śarmā jī), माँ जी (mām̐ jī). जी हाँ (jī hām̐) is a polite yes, जी नहीं (jī nahīm̐) a polite no. On its own, जी (jī) answers someone calling you."
  "hi-0136":
    native: "How are you? (to a man)"
    notes:
      "n1": "To a woman: आप कैसी हैं? (ap kaisi hain?). The word for 'how' agrees with the person asked about."
  "hi-0137":
    native: "I'm fine."
    notes:
      "n1": "ठीक (ṭhīk) is 'fine, all right', one of the most useful words in Hindi. ठीक है (ṭhīk hai) is 'OK'."
  "hi-0138":
    native: "thank you (formal)"
    notes:
      "n1": "Formal. Among family and close friends, thanking can sound distant, and is often left out."
  "hi-0139":
    native: "thanks"
    notes:
      "n1": "The everyday word. Many speakers simply say 'thank you' in English."
  "hi-0140":
    native: "I don't know Hindi."
    notes:
      "n1": "Literally 'Hindi does not come to me'. आती (ātī) is feminine because हिंदी (hindī) is. Add थोड़ी-थोड़ी (thōṛī-thōṛī) for 'a little': मुझे थोड़ी-थोड़ी हिंदी आती है (mujhē thōṛī-thōṛī hindī ātī hai)।"
  "hi-0141":
    native: "I'm still learning Hindi. (said by a man)"
    notes:
      "n1": "A woman says सीख रही हूँ (sīkh rahī hūm̐). अभी (abhī) is 'now, still'."
  "hi-0142":
    native: "Please speak slowly."
    notes:
      "n1": "बोलिए (bōliē) is the polite request form of बोलना (bōlnā, to speak). The ending -इए (-iē) turns a verb into a polite request: बैठिए (baiṭhiē), please sit."
  "hi-0143":
    native: "Please say that again."
  "hi-0144":
    native: "See you again."
    notes:
      "n1": "The usual goodbye besides नमस्ते (namastē). Hindi has a word for 'farewell', अलविदा (alvidā), but it sounds final, as in a film."
