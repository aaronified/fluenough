schema: 1
id: "hi-en-verbs"
kind: "layer"
core: "hi-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Everyday verbs"
license: "CC-BY-SA-4.0"
description: "Go, come, do, be, write, speak and the other verbs of the daily round. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0777":
    native: "to go"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman: the past takes the gender of its subject."
      "pair": "Sounds almost like जानना (jānnā), to know: here the n is single."
    examples:
      "वह रोज़ स्कूल जाता है।": { native: "He goes to school every day.", bases: { "जाता": "to go", "स्कूल": "school" } }
      "हम कल बाज़ार जाएँगे।": { native: "We will go to the market tomorrow.", bases: { "जाएँगे": "to go", "बाज़ार": "market" } }
    collocations: { "school": "school" }
  "hi-0778":
    native: "to come"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "use": "With को (ko) before a person it means to feel or to occur: मुझे नींद आती है (mujhē nīnd ātī hai), I feel sleepy."
    examples:
      "वह कल घर आएगा।": { native: "He will come home tomorrow.", bases: { "आएगा": "to come" } }
      "मेहमान कब आए?": { native: "When did the guests come?", bases: { "आए": "to come", "मेहमान": "guest" } }
    collocations: { "home": "home" }
  "hi-0779":
    native: "to do, to make"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman. Its stem before the endings is {3}."
      "use": "With a noun before it, it makes a verb: {1}, to work."
    examples:
      "तुम क्या कर रहे हो?": { native: "What are you doing?", bases: { "कर": "to do" } }
      "उसने अपना काम किया।": { native: "He did his work.", bases: { "किया": "to do" } }
    collocations: { "work": "work, a job" }
  "hi-0780":
    native: "to be, to become"
    notes:
      "forms": "Its present forms are {1} and {2}; for a man, its past is {3}."
      "happen": "It also means to happen: {1}, what happened?"
    examples:
      "वह कल घर पर होगा।": { native: "He will be at home tomorrow.", bases: { "होगा": "to be" } }
      "आज मौसम अच्छा है।": { native: "The weather is good today.", bases: { "है": "to be", "मौसम": "weather", "अच्छा": "good" } }
    collocations: { "late": "delay, lateness" }
  "hi-0781":
    native: "to write"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "use": "Used for a letter, a note or a form: {1}, to write a letter."
    examples:
      "वह अपनी माँ को चिट्ठी लिखता है।": { native: "He writes a letter to his mother.", bases: { "लिखता": "to write", "चिट्ठी": "letter" } }
      "मैंने अपना नाम लिखा।": { native: "I wrote my name.", bases: { "लिखा": "to write" } }
    collocations: { "letter": "a letter" }
  "hi-0782":
    native: "to speak"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "use": "Used for a language: {1}, to speak Hindi."
    examples:
      "वह अच्छी हिंदी बोलता है।": { native: "He speaks good Hindi.", bases: { "अच्छी": "good", "बोलता": "to speak", "हिंदी": "Hindi" } }
      "धीरे बोलिए।": { native: "Please speak slowly.", bases: { "बोलिए": "to speak", "धीरे": "slowly" } }
    collocations: { "hindi": "Hindi" }
  "hi-0783":
    native: "to listen, to hear"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "use": "For music or a story: {1}, to listen to a song."
    examples:
      "हम रेडियो पर गाना सुनते हैं।": { native: "We listen to songs on the radio.", bases: { "सुनते": "to listen", "रेडियो": "radio", "गाना": "song" } }
      "उसने मेरी बात सुनी।": { native: "He heard what I said.", bases: { "सुनी": "to listen", "बात": "matter, word" } }
    collocations: { "song": "a song" }
  "hi-0784":
    native: "to see, to look"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "use": "For a film or a match: {1}, to watch a film."
    examples:
      "हम रात को टीवी देखते हैं।": { native: "We watch TV at night.", bases: { "देखते": "to see", "टीवी": "TV" } }
      "वह ऊपर देखता है।": { native: "He looks up.", bases: { "देखता": "to see", "ऊपर": "up, above" } }
    collocations: { "film": "a film" }
  "hi-0785":
    native: "to give"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "polite": "Its polite form for 'give me' is {1}."
    examples:
      "मुझे एक गिलास पानी दीजिए।": { native: "Please give me a glass of water.", bases: { "दीजिए": "to give", "गिलास": "glass" } }
      "उसने मुझे किताब दी।": { native: "He gave me a book.", bases: { "दी": "to give", "किताब": "book" } }
  "hi-0786":
    native: "to take"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "buy": "In a shop it means to buy: {1}, I will take this."
    examples:
      "मैं एक चाय लूँगा।": { native: "I will have a tea.", bases: { "लूँगा": "to take" } }
      "उसने साँस ली।": { native: "He took a breath.", bases: { "ली": "to take", "साँस": "breath" } }
    collocations: { "breath": "breath" }
  "hi-0787":
    native: "to play"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "use": "For a game or a sport: {1}, to play cricket."
    examples:
      "बच्चे पार्क में खेलते हैं।": { native: "The children play in the park.", bases: { "बच्चे": "children", "खेलते": "to play", "पार्क": "park" } }
      "वह रोज़ क्रिकेट खेलता है।": { native: "He plays cricket every day.", bases: { "खेलता": "to play", "क्रिकेट": "cricket" } }
    collocations: { "cricket": "cricket" }
  "hi-0788":
    native: "to sit"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "opposite": "Its opposite is {1}, to get up."
    examples:
      "यहाँ बैठिए।": { native: "Please sit here.", bases: { "बैठिए": "to sit" } }
      "वे कुर्सी पर बैठे हैं।": { native: "They are sitting on the chair.", bases: { "बैठे": "to sit" } }
    collocations: { "chair": "a chair" }
  "hi-0789":
    native: "to understand"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "use": "For a matter or a point: {1}, to understand the matter."
    examples:
      "क्या तुम मेरी बात समझे?": { native: "Did you understand what I said?", bases: { "समझे": "to understand", "बात": "matter, word" } }
      "वह अंग्रेज़ी नहीं समझता।": { native: "He does not understand English.", bases: { "समझता": "to understand", "अंग्रेज़ी": "English" } }
    collocations: { "matter": "a matter, a word, a talk" }
  "hi-0790":
    native: "to know"
    notes:
      "pair": "Sounds almost like जाना (jānā), to go: here the n is doubled."
      "use": "For a person or a fact: {1}, I know him."
    examples:
      "क्या तुम उसे जानते हो?": { native: "Do you know him?", bases: { "जानते": "to know" } }
      "मैं यह बात जानता हूँ।": { native: "I know this.", bases: { "जानता": "to know", "बात": "matter, word" } }
  "hi-0791":
    native: "to live, to stay"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "use": "With a place, it means to live there: {1}, to live in a city."
    examples:
      "हम दिल्ली में रहते हैं।": { native: "We live in Delhi.", bases: { "रहते": "to live", "दिल्ली": "Delhi" } }
      "वह यहाँ कब तक रहेगा?": { native: "How long will he stay here?", bases: { "रहेगा": "to live" } }
  "hi-0792":
    native: "to want, to wish"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "need": "For 'I need water', say {1}: wanting is not needing."
    examples:
      "मैं एक कप चाय चाहता हूँ।": { native: "I want a cup of tea.", bases: { "चाहता": "to want", "कप": "cup" } }
      "वे कुछ और चाहते हैं।": { native: "They want something else.", bases: { "चाहते": "to want" } }
  "hi-0793":
    native: "to meet"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "use": "With से (sē) before a person it means to meet: {1}, to meet a friend."
    examples:
      "कल मैं अपने दोस्त से मिला।": { native: "Yesterday I met my friend.", bases: { "मिला": "to meet" } }
      "आज शाम हम मिलेंगे।": { native: "We will meet this evening.", bases: { "मिलेंगे": "to meet" } }
    synonyms: { "meet-sanskrit": "to meet a person, formally (Sanskrit-leaning)", "meet-persian": "to meet a person, formally (Persian-leaning)" }
    collocations: { "friend": "a friend" }
  "hi-0794":
    native: "to buy"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "use": "Used for buying in a shop or a market: {1}, to buy vegetables."
    examples:
      "माँ बाज़ार से सब्ज़ी ख़रीदती हैं।": { native: "Mother buys vegetables at the market.", bases: { "ख़रीदती": "to buy", "बाज़ार": "market" } }
      "उसने नई कार ख़रीदी।": { native: "He bought a new car.", bases: { "नई": "new", "ख़रीदी": "to buy", "कार": "car" } }
    collocations: { "vegetables": "vegetables" }
  "hi-0795":
    native: "to sell"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
    examples:
      "वह पुरानी साइकिल बेचता है।": { native: "He sells an old bicycle.", bases: { "पुरानी": "old", "बेचता": "to sell", "साइकिल": "bicycle" } }
      "हम दूध बेचते हैं।": { native: "We sell milk.", bases: { "बेचते": "to sell" } }
    synonyms: { "sell-persian": "to sell, formally (Persian-leaning)" }
    collocations: { "milk": "milk" }
  "hi-0796":
    native: "to tell, to show"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "way": "It can also mean to show the way: {1}, to tell the way."
    examples:
      "उसने मुझे अपना नाम बताया।": { native: "He told me his name.", bases: { "बताया": "to tell" } }
      "क्या आप मुझे रास्ता बताएँगे?": { native: "Will you tell me the way?", bases: { "बताएँगे": "to tell" } }
    synonyms: { "inform": "to inform, formally (Sanskrit-leaning)" }
    collocations: { "name": "a name" }
  "hi-0797":
    native: "to send"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "money": "For money or a message: {1}, to send money."
    examples:
      "मैंने उसे एक ईमेल भेजा।": { native: "I sent him an email.", bases: { "भेजा": "to send", "ईमेल": "email" } }
      "पैसे भेजिए।": { native: "Please send the money.", bases: { "पैसे": "money", "भेजिए": "to send" } }
    collocations: { "money": "money" }
  "hi-0798":
    native: "to wash"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "use": "For clothes or hands: {1}, to wash clothes; {2}, to wash hands."
    examples:
      "माँ सुबह कपड़े धोती है।": { native: "Mother washes the clothes in the morning.", bases: { "धोती": "to wash", "कपड़े": "clothes" } }
      "खाने से पहले हाथ धोओ।": { native: "Wash your hands before eating.", bases: { "धोओ": "to wash", "पहले": "before", "हाथ": "hand" } }
    collocations: { "clothes": "clothes" }
  "hi-0799":
    native: "to ask"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "way": "For a way or a direction: {1}, to ask the way."
    examples:
      "उसने मुझसे नाम पूछा।": { native: "He asked me my name.", bases: { "पूछा": "to ask" } }
      "आप पुलिस से पूछिए।": { native: "Ask the police.", bases: { "पूछिए": "to ask" } }
    synonyms: { "ask-sanskrit": "to put a question, formally (Sanskrit-leaning)", "ask-persian": "to ask a question (Persian-leaning)" }
    collocations: { "way": "the way, a road" }
  "hi-0800":
    native: "to say"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "name": "For asking what a thing is called: {1}, what do you call this?"
    examples:
      "वे क्या कह रहे हैं?": { native: "What are they saying?", bases: { "कह": "to say" } }
      "उसने सच कहा।": { native: "He told the truth.", bases: { "कहा": "to say", "सच": "truth" } }
    synonyms: { "state-sanskrit": "to state, formally (Sanskrit-leaning)" }
    collocations: { "truth": "the truth" }
  "hi-0801":
    native: "to walk, to work (of a machine)"
    notes:
      "past": "Its past is {1} for a man and {2} for a woman."
      "clock": "For a machine or a clock that works: {1}, the clock is running."
    examples:
      "वह रोज़ सुबह पार्क तक चलता है।": { native: "He walks to the park every morning.", bases: { "चलता": "to walk", "पार्क": "park" } }
      "घड़ी ठीक चल रही है।": { native: "The clock is keeping good time.", bases: { "चल": "to walk", "घड़ी": "clock, watch", "ठीक": "fine, right" } }
    collocations: { "clock": "a clock or a watch" }
