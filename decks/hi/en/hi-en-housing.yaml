schema: 1
id: "hi-en-housing"
kind: "layer"
core: "hi-housing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Housing"
license: "CC-BY-SA-4.0"
description: "Where people live: owners and tenants, the building and its parts, the things in a room, and the everyday words for a flat and a colony. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "hi-2590":
    native: "owner; master; boss"
    notes:
      "n1": "The person who owns a house, a shop or a thing. The woman is मालकिन (mālkin)."
    examples:
      "मकान का मालिक कौन है?": { "native": "Who is the owner of the house?", "bases": {} }
      "मालिक किराया माँग रहा है।": { "native": "The owner is asking for rent.", "bases": {"माँग": "to ask for"} }
  "hi-2591":
    native: "tenant"
    notes:
      "n1": "A person who pays rent to live in a house or a flat that belongs to someone else."
    examples:
      "किरायेदार ने चाबी लौटाई।": { "native": "The tenant returned the key.", "bases": {"ने": "by", "लौटाई": "to return"} }
      "किरायेदार हर महीने किराया देता है।": { "native": "The tenant pays rent every month.", "bases": {"हर": "every; each"} }
  "hi-2592":
    native: "balcony"
    notes:
      "n1": "A small open platform outside a window or on an upper floor of a flat."
    examples:
      "बालकनी में पौधे रखे हैं।": { "native": "Plants are kept on the balcony.", "bases": {} }
      "बालकनी से नज़ारा सुंदर है।": { "native": "The view from the balcony is beautiful.", "bases": {} }
  "hi-2593":
    native: "gate"
    notes:
      "n1": "The door-like opening in the wall of a house, a garden or a compound."
    examples:
      "गेट खोलो।": { "native": "Open the gate.", "bases": {} }
      "गेट पर चौकीदार खड़ा है।": { "native": "A watchman is standing at the gate.", "bases": {"चौकीदार": "watchman", "खड़ा": "standing"} }
  "hi-2594":
    native: "lift; elevator"
    notes:
      "n1": "A box that carries people up and down the floors of a building."
    examples:
      "लिफ़्ट खराब है।": { "native": "The lift is broken.", "bases": {} }
      "सीढ़ियों की जगह लिफ़्ट लो।": { "native": "Take the lift instead of the stairs.", "bases": {"जगह": "place", "लिफ़्ट": "lift"} }
  "hi-2595":
    native: "housing society"
    notes:
      "n1": "A group of flats in one building or complex, with its own rules and members."
    examples:
      "सोसाइटी की बैठक कल है।": { "native": "The society's meeting is tomorrow.", "bases": {} }
      "सोसाइटी में पार्क है।": { "native": "There is a park in the society.", "bases": {} }
  "hi-2596":
    native: "colony; housing estate"
    notes:
      "n1": "A part of a town where many houses are built together, as one area."
    examples:
      "हमारी कॉलोनी शांत है।": { "native": "Our colony is quiet.", "bases": {} }
      "कॉलोनी के बाहर बाज़ार है।": { "native": "There is a market outside the colony.", "bases": {} }
  "hi-2597":
    native: "bed; cot"
    notes:
      "n1": "A piece of furniture that one sleeps on."
    examples:
      "पलंग पर चादर बिछाओ।": { "native": "Spread a sheet on the bed.", "bases": {} }
      "नया पलंग कहाँ से लिया?": { "native": "Where did you buy the new bed from?", "bases": {} }
  "hi-2598":
    native: "sofa"
    notes:
      "n1": "A long soft seat for two or more people in a room."
    examples:
      "सोफ़ा बहुत आरामदेह है।": { "native": "The sofa is very comfortable.", "bases": {} }
      "सोफ़े पर बैठो।": { "native": "Sit on the sofa.", "bases": {"सोफ़े": "sofa"} }
  "hi-2599":
    native: "curtain"
    notes:
      "n1": "A cloth hung at a window or a door, to keep out light or to give privacy."
    examples:
      "पर्दे खींच दो।": { "native": "Draw the curtains.", "bases": {"पर्दे": "curtain"} }
      "खिड़की पर नया पर्दा लगा है।": { "native": "A new curtain has been hung at the window.", "bases": {"पर्दा": "curtain"} }
  "hi-2600":
    native: "mattress; cushion"
    notes:
      "n1": "A thick soft pad that is placed on a bed or on the floor to sit or sleep on."
    examples:
      "गद्दा नरम है।": { "native": "The mattress is soft.", "bases": {} }
      "गद्दे पर सो जाओ।": { "native": "Lie down on the mattress.", "bases": {"गद्दे": "mattress"} }
  "hi-2601":
    native: "cylinder (gas)"
    notes:
      "n1": "A metal tank in which cooking gas is kept under pressure."
    examples:
      "गैस का सिलेंडर खत्म हो गया।": { "native": "The gas cylinder has run out.", "bases": {"खत्म": "finished"} }
      "नया सिलेंडर मँगवाओ।": { "native": "Get a new cylinder delivered.", "bases": {"मँगवाओ": "to get delivered"} }
  "hi-2602":
    native: "air conditioner"
    notes:
      "n1": "A machine that cools a room, to make the air cool."
    examples:
      "कमरे का एसी चालू करो।": { "native": "Switch on the air conditioner in the room.", "bases": {} }
      "एसी बहुत ठंडा करता है।": { "native": "The air conditioner cools very much.", "bases": {} }
  "hi-2603":
    native: "cupboard; wardrobe"
    notes:
      "n1": "A cabinet with shelves and doors, for keeping clothes and things."
    examples:
      "कपड़े अलमारी में रखो।": { "native": "Keep the clothes in the cupboard.", "bases": {"अलमारी": "cupboard"} }
      "अलमारी की चाबी कहाँ है?": { "native": "Where is the key of the cupboard?", "bases": {} }
  "hi-2604":
    native: "address; knowledge"
    notes:
      "n1": "The place where a person lives, or the knowledge of a thing."
    examples:
      "मेरा पता लिखो।": { "native": "Write down my address.", "bases": {} }
      "क्या तुम्हें उसका पता है?": { "native": "Do you know his address?", "bases": {"पता": "address"} }
  "hi-2605":
    native: "building"
    notes:
      "n1": "A large structure with walls and a roof, such as a house, school or office block."
    examples:
      "यह इमारत बहुत ऊँची है।": { "native": "This building is very tall.", "bases": {} }
      "इमारत में आग लगी।": { "native": "Fire broke out in the building.", "bases": {} }
  "hi-2606":
    native: "courtyard"
    notes:
      "n1": "An open space inside a house, surrounded by its walls."
    examples:
      "आँगन में बच्चे खेल रहे हैं।": { "native": "The children are playing in the courtyard.", "bases": {} }
      "आँगन में तुलसी है।": { "native": "There is a holy basil in the courtyard.", "bases": {"तुलसी": "holy basil"} }
  "hi-2607":
    native: "to settle; to live in a place"
    notes:
      "n1": "To make a place one's home, or for a town to grow up."
    examples:
      "वह दिल्ली में बस गया।": { "native": "He settled in Delhi.", "bases": {"दिल्ली": "Delhi", "बस": "to settle"} }
      "नई कॉलोनी में बहुत लोग बस रहे हैं।": { "native": "Many people are settling in the new colony.", "bases": {"बस": "to settle"} }
