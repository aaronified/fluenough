core: "hi-multiword-muhavare"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Idioms: fixed phrases with a figurative meaning"
description: "A fixed phrase whose meaning is not the sum of its words: the usage note gives the literal sense and the figurative one. Not yet checked by a Hindi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "hi-4450":
    native: "to give someone a reality check"
    notes:
      "u1": "Literally 'to show the mirror'; figuratively, to make someone face the truth about a situation."
    bases:
      "आईना": "mirror"
      "दिखाना": "to show"
  "hi-4451":
    native: "to be selfish, to look after one's own interest"
    notes:
      "u1": "Literally 'to make one's own owl straight'; figuratively, to put one's own advantage first."
    bases:
      "अपना": "one's own"
      "उल्लू": "owl"
      "सीधा": "straight; upright"
      "करना": "to do, to make"
  "hi-4452":
    native: "to face the hard realities of life"
    notes:
      "u1": "Literally 'to come to know the price of flour and lentils'; used when someone is forced to face the hard facts of life."
    bases:
      "आटे": "flour"
      "दाल": "lentils"
      "का": "of; 's"
      "भाव": "rate; price"
      "मालूम": "known; to be known"
      "होना": "to be, to become"
  "hi-4453":
    native: "to be shocked, dismayed or horrified"
    notes:
      "u1": "Literally 'the heart bursts', from the noun for heart and the verb for to burst; used for a sudden, painful shock."
    bases:
      "कलेजा": "heart; liver"
      "फटना": "to be torn; to split; to explode"
  "hi-4454":
    native: "to render ineffective, to stun or make powerless"
    notes:
      "u1": "Literally 'to break the back'; figuratively, to weaken someone or something so that it can no longer act."
    bases:
      "कमर": "waist"
      "तोड़ना": "to break; to pluck"
  "hi-4455":
    native: "sour grapes"
    notes:
      "u1": "Literally 'sour grapes', a calque of the English idiom; the phrase is used as a noun."
    bases:
      "खट्टे": "sour"
      "अंगूर": "grape"
  "hi-4456":
    native: "a castle in the air; a daydream"
    notes:
      "u1": "Literally 'imaginary pilaf'; figuratively, a plan or hope that is too ambitious for reality."
    bases:
      "ख़याली": "imaginary"
      "पुलाव": "pilaf; a rice dish"
  "hi-4457":
    native: "crocodile tears"
    notes:
      "u1": "Literally 'crocodile tears', a calque of the English idiom; the plural is the usual form."
    bases:
      "घड़ियाली": "of a crocodile (from the noun for crocodile)"
      "आँसू": "tear"
  "hi-4458":
    native: "to sleep peacefully, deeply or carelessly"
    notes:
      "u1": "Literally 'to sleep having sold horses'; used for sleeping soundly, without a care."
    bases:
      "घोड़े": "horse"
      "बेचकर": "to sell"
      "सोना": "to sleep"
  "hi-4459":
    native: "to be greatly ashamed or embarrassed"
    notes:
      "u1": "Literally 'to die drowning in a palmful of water'; also used for hiding one's face out of shame."
    bases:
      "चुल्लू": "palm of the hand hollowed to hold water"
      "भर": "all; whole"
      "पानी": "water"
      "में": "in; inside"
      "डूब": "to drown; to sink"
      "मरना": "to die"
  "hi-4460":
    native: "conflict; opposition"
    notes:
      "u1": "Literally 'figure of thirty-six', from the two digits, which face opposite each other in Devanagari numerals; used for people in constant conflict."
    bases:
      "छत्तीस": "36, thirty-six"
      "का": "of; 's"
      "आँकड़ा": "statistic; figure"
  "hi-4461":
    native: "for something fishy or suspicious to be going on"
    notes:
      "u1": "Literally 'for something black to be in the lentils'; used when something seems wrong and suspicious."
    bases:
      "दाल": "lentils"
      "में": "in; inside"
      "कुछ": "something; some; a little"
      "काला": "black"
      "होना": "to be, to become"
  "hi-4462":
    native: "to be dazed after an unfortunate event; to see stars after a blow to the head"
    notes:
      "u1": "Literally 'to see stars in the day'; used for being stunned by bad news or by a blow."
    bases:
      "दिन": "day"
      "में": "in; inside"
      "तारे": "star"
      "देखना": "to see, to look"
  "hi-4463":
    native: "to slip quietly away; to vanish or flee suddenly"
    notes:
      "u1": "Literally 'to become nine, two, eleven' (9 + 2 = 11), a folk expression for quick disappearance; the numbers are chosen for their rhythm."
    bases:
      "नौ": "9, nine"
      "दो": "2, two"
      "ग्यारह": "11, eleven"
      "होना": "to be, to become"
  "hi-4464":
    native: "to be disgraced or dishonoured"
    notes:
      "u1": "Literally 'to have one's nose cut off'; probably alludes to the Ramayana story of Shurpanakha."
    bases:
      "नाक": "nose"
      "कटना": "to be cut"
  "hi-4465":
    native: "to celebrate by distributing sweets"
    notes:
      "u1": "Literally 'to sweeten one's mouth', said of a celebration in which sweets are handed out."
    bases:
      "मुँह": "mouth; face"
      "मीठा": "sweet; a sweet"
      "करना": "to do, to make"
  "hi-4466":
    native: "to be very distressed or harassed"
    notes:
      "u1": "Literally 'breath comes into the nose'; used for being very distressed or harassed."
    bases:
      "दम": "breath"
      "नाक": "nose"
      "में": "in; inside"
      "आना": "to come"
