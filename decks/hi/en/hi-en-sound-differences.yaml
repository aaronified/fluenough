schema: 1
id: "hi-en-sound-differences"
kind: "layer"
core: "hi-sound-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sounds to tell apart"
license: "CC-BY-SA-4.0"
description: "Pairs of words that differ in one sound: a breath after a consonant, the tongue on the teeth or curled back, a short or long vowel, a single or double consonant, and a nasal vowel."
tags: ["unreviewed"]
cards:
  "hi-0100":
    native: "moment"
    notes:
      "n1": "Aspiration: फल (phal, fruit) is पल (pal, moment) with a puff of breath after the p."
  "hi-0052":
    notes:
      "n1": "Aspiration: फल (phal, fruit) is पल (pal, moment) with a puff of breath after the p."
  "hi-0101":
    native: "gift; donation"
    notes:
      "n1": "Aspiration: धान (dhān, paddy) is दान (dān, gift) with a breath after the d."
  "hi-0102":
    native: "paddy"
    notes:
      "n1": "Aspiration: धान (dhān, paddy) is दान (dān, gift) with a breath after the d."
  "hi-0261":
    native: "lentils"
    notes:
      "n1": "Dental against curled back: दाल (dāl, lentils) has the tongue on the teeth for d; डाल (ḍāl, branch) has it curled back."
  "hi-0103":
    native: "branch"
    notes:
      "n1": "Dental against curled back: दाल (dāl, lentils) has the tongue on the teeth for d; डाल (ḍāl, branch) has it curled back."
    "examples": {
      "डाल हवा में झूलती है।": {"native": "The branch swings in the wind.", "bases": {"झूलती": "to swing", "डाल": "branch"}}
    }
  "hi-0308":
    notes:
      "n1": "Vowel length: दीन (dīn, poor) holds the i longer than दिन (din, day)."
  "hi-0104":
    native: "poor; humble"
    notes:
      "n1": "Vowel length: दीन (dīn, poor) holds the i longer than दिन (din, day)."
  "hi-0105":
    native: "less; few"
    notes:
      "n1": "Vowel length: काम (kām, work) has the long a where कम (kam, less) has the short a."
    "examples": {
      "कीमत कम है।": {"native": "The price is low.", "bases": {"कम": "less; few"}},
      "थोड़ा कम कीजिए।": {"native": "Please lower it a little.", "bases": {"थोड़ा": "a little; some", "कीजिए": "to do; to make"}}
    }
  "hi-0194":
    notes:
      "n1": "Vowel length: काम (kām, work) has the long a where कम (kam, less) has the short a."
  "hi-0106":
    native: "heard"
    notes:
      "n1": "Vowel length: सूना (sūnā, empty) holds the u longer than सुना (sunā, heard)."
  "hi-0107":
    native: "empty; deserted"
    notes:
      "n1": "Vowel length: सूना (sūnā, empty) holds the u longer than सुना (sunā, heard)."
  "hi-0108":
    native: "cooked; ripe"
    notes:
      "n1": "Single against double: पक्का (pakkā, firm) holds the k longer than पका (pakā, cooked)."
  "hi-0109":
    native: "firm; certain"
    notes:
      "n1": "Single against double: पक्का (pakkā, firm) holds the k longer than पका (pakā, cooked)."
    "examples": {
      "यह रिश्ता पक्का है।": {"native": "This bond is firm.", "bases": {"पक्का": "firm; certain"}},
      "सौदा पक्का हो गया।": {"native": "The deal was settled.", "bases": {"पक्का": "firm; certain"}}
    }
  "hi-0110":
    native: "left over; survived"
    notes:
      "n1": "Single against double: बच्चा (baccā, child) holds the ch longer than बचा (bacā, left over)."
  "hi-0111":
    native: "child"
    notes:
      "n1": "Single against double: बच्चा (baccā, child) holds the ch longer than बचा (bacā, left over)."
    "examples": {
      "बच्चा भूखा है।": {"native": "The child is hungry.", "bases": {"भूखा": "hungry", "बच्चा": "child"}},
      "बच्चा रोता है।": {"native": "The child cries.", "bases": {"बच्चा": "child", "रोता": "to cry"}}
    }
  "hi-0112":
    native: "is"
    notes:
      "n1": "Nasal vowel: हैं (haim̐, are) is है (hai, is) with the vowel said through the nose as well, marked by the dot above."
    "examples": {
      "गारंटी है।": {"native": "There is a guarantee.", "bases": {"है": "is"}}
    }
  "hi-0113":
    native: "are"
    notes:
      "n1": "Nasal vowel: हैं (haim̐, are) is है (hai, is) with the vowel said through the nose as well, marked by the dot above."
    "examples": {
      "कागज़ात कहाँ हैं?": {"native": "Where are the papers?", "bases": {}}
    }
  "hi-0114":
    native: "to read"
    notes:
      "n1": "The r forms of ड (ḍa) and ढ (ḍha): पढ़ना (paṛhnā, to read) has ढ़ (ṛha), the tongue a little further back, with a breath; पड़ना (paṛnā, to fall) has ड़ (ṛa)."
    "examples": {
      "सबक़ पढ़ो।": {"native": "Read the lesson.", "bases": {"सबक़": "lesson (what is to be learnt)", "पढ़ो": "to read"}},
      "उसने खूब पढ़ा।": {"native": "He studied a lot.", "bases": {"पढ़ा": "to read"}}
    }
  "hi-0115":
    native: "to fall; to have to"
    notes:
      "n1": "The r forms of ड (ḍa) and ढ (ḍha): पढ़ना (paṛhnā, to read) has ढ़ (ṛha), the tongue a little further back, with a breath; पड़ना (paṛnā, to fall) has ड़ (ṛa)."
    "examples": {
      "मुझे जाना पड़ेगा।": {"native": "I'll have to go.", "bases": {"मुझे": "I", "जाना": "to go", "पड़ेगा": "to fall; to have to"}},
      "आज ओवरटाइम करना पड़ेगा।": {"native": "I will have to do overtime today.", "bases": {"पड़ेगा": "to fall; to have to"}}
    }
