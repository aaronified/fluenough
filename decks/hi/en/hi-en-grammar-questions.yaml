schema: 1
id: "hi-en-grammar-questions"
kind: "layer"
core: "hi-grammar-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Basic questions"
license: "CC0-1.0"
description: "Yes/no questions and question words, with the word order unchanged."
cards:
  "hi-0167":
    native: "Do you speak Hindi?"
    notes:
      "n1": "क्या (kyā) at the start makes a yes/no question. The word order stays as it was."
    bases:
      "हिंदी": "Hindi"
      "बोलते": "to speak"
  "hi-0168":
    native: "Will you have tea?"
    notes:
      "n1": "A statement becomes a question with nothing but the voice rising at the end."
  "hi-0169":
    native: "What is this?"
    notes:
      "n1": "The question word goes where the answer would: यह किताब है (yah kitāb hai) → यह क्या है (yah kyā hai)?"
    bases:
      "यह": "this"
  "hi-0170":
    native: "Where are you going?"
    notes:
      "n1": "Question words usually sit just before the verb."
    bases:
      "जा": "to go"
      "रहे": "to stay; to be (doing)"
  "hi-0171":
    native: "Who is that?"
    bases:
      "वह": "he; she"
  "hi-0172":
    native: "When will you come?"
    bases:
      "आएँगे": "to come"
  "hi-0173":
    native: "Why are you learning Hindi?"
    bases:
      "हिंदी": "Hindi"
      "सीख": "to learn"
      "रहे": "to stay; to be (doing)"
  "hi-0174":
    native: "How many children do you have?"
    notes:
      "n1": "'Of you how many children are': family takes the possessive, not के पास (kē pās)."
  "hi-0175":
    native: "How did you come?"
    notes:
      "n1": "An answer: बस से (bas sē), by bus."
    bases:
      "आए": "to come"
  "hi-0176":
    native: "It's good, isn't it?"
    notes:
      "n1": "न (na) at the end asks for agreement, like 'isn't it?' or 'right?'."
    bases:
      "अच्छा": "good; nice"
