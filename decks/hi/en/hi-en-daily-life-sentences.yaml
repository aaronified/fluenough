cards:
  "hi-4909":
    native: "I get up early in the morning."
    bases:
      "उठता": "get up (masculine)"
      "हूँ": "am (I)"
    confusables:
      "w1": { why: "To sleep, not get up: सोना (sōnā) means to sleep." }
      "w2": { why: "To bathe, not get up: नहाना (nahānā) means to bathe." }
  "hi-4910":
    native: "I bathe every day."
    bases:
      "नहाता": "bathe (masculine)"
      "हूँ": "am (I)"
    confusables:
      "w1": { why: "Brush teeth, not bathe: दाँत साफ़ करना (dām̐t sāf karnā) means to brush one's teeth." }
      "w2": { why: "To get up, not bathe: उठना (uṭhnā) means to get up." }
  "hi-4911":
    native: "He has breakfast."
    bases:
      "करता": "do; have (masculine)"
    confusables:
      "w1": { why: "Lunch, not breakfast: दोपहर का खाना (dōpahar kā khānā) means lunch." }
      "w2": { why: "Dinner, not breakfast: रात का खाना (rāt kā khānā) means dinner." }
  "hi-4912":
    native: "I go to work at nine in the morning."
    bases:
      "जाता": "go (masculine)"
      "हूँ": "am (I)"
    confusables:
      "w1": { why: "To come home, not go to work: घर लौटना (ghar lauṭnā) means to come home." }
      "w2": { why: "To sleep, not go to work: सोना (sōnā) means to sleep." }
  "hi-4913":
    native: "At night I come home."
    bases:
      "लौटता": "come back (masculine)"
      "हूँ": "am (I)"
    confusables:
      "w1": { why: "Morning, not night: सुबह (subah) means morning." }
      "w2": { why: "Evening, not night: शाम (śām) means evening." }
  "hi-4914":
    native: "She always goes to sleep at seven o'clock."
    bases:
      "सोती": "sleep (feminine habitual)"
    confusables:
      "w1": { why: "To get up, not sleep: उठना (uṭhnā) means to get up." }
      "w2": { why: "To bathe, not sleep: नहाना (nahānā) means to bathe." }
  "hi-4915":
    native: "We sometimes eat out."
    bases:
      "कभी": "sometimes"
      "खाते": "eat (plural habitual)"
    confusables:
      "w1": { why: "To come home, not eat out: घर लौटना (ghar lauṭnā) means to come home." }
      "w2": { why: "Always, not sometimes: हमेशा (hamēśā) means always." }
  "hi-4916":
    native: "Then she bathes."
    bases:
      "नहाती": "bathe (feminine)"
    confusables:
      "w1": { why: "To get up, not bathe: उठना (uṭhnā) means to get up." }
      "w2": { why: "To sleep, not bathe: सोना (sōnā) means to sleep." }
  "hi-4917":
    native: "When is dinner?"
    bases:
      "होता": "happen (masculine habitual)"
    confusables:
      "w1": { why: "Breakfast, not dinner: नाश्ता (nāśtā) means breakfast." }
      "w2": { why: "Lunch, not dinner: दोपहर का खाना (dōpahar kā khānā) means lunch." }
  "hi-4918":
    native: "I cook food."
    bases:
      "बनाता": "make; cook (masculine)"
      "हूँ": "am (I)"
    confusables:
      "w1": { why: "To cook, not make: पकाना (pakānā) means to cook." }
      "w2": { why: "To serve, not cook: परोसना (parōsnā) means to serve." }
  "hi-4919":
    native: "I go to sleep at ten o'clock."
    bases:
      "सोता": "sleep (masculine habitual)"
      "हूँ": "am (I)"
    confusables:
      "w1": { why: "To get up, not sleep: उठना (uṭhnā) means to get up." }
      "w2": { why: "To bathe, not sleep: नहाना (nahānā) means to bathe." }
