native: { code: "en", iso639_3: "eng", name: "English" }
name: "To be: है (hai), था (thā), होगा (hōgā)"
license: "CC0-1.0"
description: "Am, was, will be: होना (hōnā) in the present, the past and the future. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "होना (hōnā) by tense"
  slot_name: "person and gender"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "hai": "to be, present"
    "thaa": "to be, past"
    "hogaa": "to be, future"
  notes: "The present (हूँ (hūm̐), हो (hō), है (hai), हैं (haim̐)) does not show gender; the past and the future do. नहीं (nahīm̐) comes before the verb: मैं घर पर नहीं हूँ (maim̐ ghar par nahīm̐ hūm̐), I'm not at home. With नहीं (nahīm̐) the present है (hai) is often left out: वह यहाँ नहीं (vah yahām̐ nahīm̐)."
