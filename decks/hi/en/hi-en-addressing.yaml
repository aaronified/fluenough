schema: 1
id: "hi-en-addressing"
kind: "layer"
core: "hi-addressing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Addressing people"
license: "CC0-1.0"
description: "What to call a shopkeeper, a driver, an older woman or a child: Hindi speakers address strangers as family."
cards:
  "hi-0177":
    native: "brother; to a man of about your age"
    notes:
      "n1": "What you call a shopkeeper, a rickshaw driver or a waiter: भैया (bhaiyā), कितने का है (kitnē kā hai)? Friendly and polite at once."
  "hi-0178":
    native: "elder sister; to a woman a little older"
  "hi-0179":
    native: "sir (to a man, respectfully)"
    notes:
      "n1": "Literally 'brother sir'. More respectful than भैया (bhaiyā)."
  "hi-0180":
    native: "uncle; to any older man"
    notes:
      "n1": "From English, and used everywhere in cities for a man old enough to be your parent."
  "hi-0181":
    native: "aunty; to any older woman"
  "hi-0182":
    native: "sir"
    notes:
      "n1": "To a man in an office or in charge. Also after a name or title: डॉक्टर साहब (ḍôkṭar sāhab)."
  "hi-0183":
    native: "madam"
  "hi-0184":
    native: "child; how elders address a younger person"
    notes:
      "n1": "Literally 'son', but an elder says it to a girl too. If an older person calls you बेटा (bēṭā), it is warmth, not condescension."
  "hi-0185":
    native: "friend"
    notes:
      "n1": "Grammatically masculine, whoever the friend is."
  "hi-0186":
    native: "excuse me (to get attention)"
    notes:
      "n1": "Literally 'please listen'. The polite way to call a waiter or stop a passer-by."
