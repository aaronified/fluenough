cards:
  "hi-4932":
    native: "What is today's date?"
    bases:
      "सी": "feminine form of 'which'"
    confusables:
      "w1": { why: "Month, not date: महीना (mahīnā) means month." }
      "w2": { why: "Year, not date: साल (sāl) means year." }
  "hi-4933":
    native: "It is very hot in June."
    bases:
      "होती": "happen (feminine habitual)"
    confusables:
      "w1": { why: "July, not June: जुलाई (julāī) is July." }
      "w2": { why: "May, not June: मई (maī) is May." }
  "hi-4934":
    native: "Where did you go in August?"
    bases:
      "गए": "went (masculine plural)"
      "थे": "were (past)"
    confusables:
      "w1": { why: "September, not August: सितंबर (sitambar) is September." }
      "w2": { why: "July, not August: जुलाई (julāī) is July." }
  "hi-4935":
    native: "Yesterday I went to the market."
    bases:
      "गया": "went (masculine)"
      "था": "was (masculine)"
    confusables:
      "w1": { why: "Today, not yesterday: आज (āj) means today." }
      "w2": { why: "Morning, not yesterday: सुबह (subah) means morning." }
  "hi-4936":
    native: "It gets cold in December."
    bases:
      "होती": "happen (feminine habitual)"
    confusables:
      "w1": { why: "November, not December: नवंबर (navambar) is November." }
      "w2": { why: "January, not December: जनवरी (janvarī) is January." }
  "hi-4937":
    native: "The monsoon comes in September."
    bases:
      "आता": "come (masculine habitual)"
    confusables:
      "w1": { why: "Rainy season, not monsoon: बरसात (barsāt) means the rainy season." }
      "w2": { why: "October, not September: अक्तूबर (aktūbar) is October." }
  "hi-4938":
    native: "My elder sister came in February."
    bases:
      "मेरी": "my (feminine)"
      "आई": "came (feminine)"
      "थी": "was (feminine)"
    confusables:
      "w1": { why: "March, not February: मार्च (mārc) is March." }
      "w2": { why: "April, not February: अप्रैल (aprail) is April." }
  "hi-4939":
    native: "Spring comes in April."
    bases:
      "आता": "come (masculine habitual)"
    confusables:
      "w1": { why: "Autumn, not spring: पतझड़ (patjhaṛ) means autumn." }
      "w2": { why: "Sawan, not spring: सावन (sāvan) means the month of Sawan." }
  "hi-4940":
    native: "The rainy season comes in July."
    bases:
      "होती": "happen (feminine habitual)"
    confusables:
      "w1": { why: "August, not July: अगस्त (agast) is August." }
      "w2": { why: "June, not July: जून (jūn) is June." }
  "hi-4941":
    native: "It is cold in January."
    confusables:
      "w1": { why: "December, not January: दिसंबर (disambar) is December." }
      "w2": { why: "February, not January: फ़रवरी (farvarī) is February." }
  "hi-4942":
    native: "Today is the third of the month."
    confusables:
      "w1": { why: "Month, not date: महीना (mahīnā) means month." }
      "w2": { why: "Year, not date: साल (sāl) means year." }
  "hi-4943":
    native: "There are twelve months in a year."
    bases:
      "महीने": "months"
      "होते": "happen (plural habitual)"
    confusables:
      "w1": { why: "Date, not month: तारीख़ (tārīk͟h) is a date." }
      "w2": { why: "Day, not month: दिन (din) means day." }
