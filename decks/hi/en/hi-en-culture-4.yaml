  hi-4150:
    native: "The days of life are over and evening has come; I will stretch out my feet and sleep in the corner of the tomb."
    notes:
      n1: "A couplet of Bahadur Shah Zafar, the last Mughal emperor, read in full on Urdu Wikipedia, about his last days."
