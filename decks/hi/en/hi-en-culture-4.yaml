  "hi-4150":
    native: "Every leaf and every bush knows our state; if the flower does not know it, the whole garden still does."
    notes:
      n1: "A couplet that opens a ghazal by Mir Taqi Mir, read in full on Urdu Wikisource; two word readings were chosen by meaning and are in the review queue."
