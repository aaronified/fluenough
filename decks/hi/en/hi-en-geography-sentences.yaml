cards:
  "hi-5151":
    native: "India is not a continent; it is a country."
    confusables:
      "w1": { why: "State, not country: राज्य (rājy) means state." }
      "w2": { why: "Region, not country: प्रदेश (pradēś) means region; province." }
  "hi-5152":
    native: "The sun rises in the east."
    confusables:
      "w1": { why: "West, not east: पश्चिम (paścim) means west." }
      "w2": { why: "South, not east: दक्षिण (dakśiṇ) means south." }
  "hi-5153":
    native: "The sea is to the south of India."
    confusables:
      "w1": { why: "East, not south: पूर्व (pūrv) means east." }
      "w2": { why: "Island, not sea: द्वीप (dvīp) means island." }
  "hi-5154":
    native: "The Himalayas are a mountain range."
    confusables:
      "w1": { why: "Plateau, not mountain: पठार (paṭhār) means plateau." }
      "w2": { why: "Planet, not mountain: ग्रह (grah) means planet." }
  "hi-5155":
    native: "The population of this region is high."
    confusables:
      "w1": { why: "Distance, not population: दूरी (dūrī) means distance." }
      "w2": { why: "Height, not population: ऊँचाई (ūm̐cāī) means height; altitude." }
  "hi-5156":
    native: "This mountain is very high."
    confusables:
      "w1": { why: "Depth, not height: गहराई (gahrāī) means depth." }
      "w2": { why: "Width, not height: चौड़ाई (cauṛāī) means width; breadth." }
  "hi-5157":
    native: "The highway goes to the city."
    confusables:
      "w1": { why: "Port, not highway: बंदरगाह (bandargāh) means port; harbour." }
      "w2": { why: "Coast, not highway: तट (taṭ) means coast; shore." }
  "hi-5158":
    native: "There was an earthquake last night."
    confusables:
      "w1": { why: "Volcano, not earthquake: ज्वालामुखी (jvālāmukhī) means volcano." }
      "w2": { why: "Planet, not earthquake: ग्रह (grah) means planet." }
  "hi-5159":
    native: "The climate here is hot."
    confusables:
      "w1": { why: "Weather, not climate: मौसम (mausam) means weather; season." }
      "w2": { why: "Mineral, not climate: खनिज (khanij) means mineral." }
  "hi-5160":
    native: "The ship stopped at the port."
    confusables:
      "w1": { why: "District, not port: ज़िला (zilā) means district." }
      "w2": { why: "Border, not port: सरहद (sarhad) means border." }
  "hi-5161":
    native: "Crossing the border is difficult."
    confusables:
      "w1": { why: "Easy, not difficult: आसान (āsān) means easy." }
      "w2": { why: "Simple, not difficult: सरल (saral) means simple." }
  "hi-5162":
    native: "There is an ocean in the west."
    confusables:
      "w1": { why: "Sea, not ocean: समुद्र (samudr) means sea." }
      "w2": { why: "Island, not ocean: द्वीप (dvīp) means island." }
  "hi-5163":
    native: "The two states meet at the border."
    confusables:
      "w1": { why: "District, not state: ज़िला (zilā) means district." }
      "w2": { why: "Region, not state: प्रदेश (pradēś) means region; province." }
