cards:
  "hi-4613":
    native: "Excuse me, where is the station?"
    bases:
      "है": "is"
    confusables:
      "w1": { why: "When, not where: कब (kab) means when." }
      "w2": { why: "Who, not where: कौन (kaun) means who." }
  "hi-4614":
    native: "Brother, this is my house."
    bases:
      "है": "is"
    confusables:
      "w1": { why: "Elder sister, not brother: दीदी (dīdī) means elder sister, said to a woman a little older." }
      "w2": { why: "Child, not brother: बेटा (bēṭā) means child; how elders address a younger person." }
  "hi-4615":
    native: "Elder sister, how are you?"
    bases:
      "हैं": "are"
    confusables:
      "w1": { why: "Brother, not elder sister: भैया (bhaiyā) means brother, said to a man of about your age." }
      "w2": { why: "Madam, not elder sister: मैडम (maiḍam) means madam." }
  "hi-4616":
    native: "Uncle, is this your house?"
    bases:
      "है": "is"
    confusables:
      "w1": { why: "Aunty, not uncle: आंटी (āṇṭī) means aunty; to any older woman." }
      "w2": { why: "Sir, not uncle: साहब (sāhab) means sir." }
