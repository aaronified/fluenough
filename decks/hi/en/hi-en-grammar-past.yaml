rules:
  "hi-rule-past":
    name: "-आ (-ā), -ई (-ī), -ए (-ē), -ईं (-īm̐): the simple past"
    explanation: "With a verb that takes no ने (nē), the past agrees with the doer: -आ (-ā), -ई (-ī), -ए (-ē), -ईं (-īm̐). जाना (jānā) is irregular: गया (gayā). Some writers spell आए (āē) and गई (gaī) as आये (āyē) and गयी (gayī). Verbs that take no ने, such as आना (ānā), जाना (jānā), लाना (lānā) and भूलना (bhūlnā), are in this table. Verbs that take ने, such as लिखना (likhnā), to write, are not: with an object, the doer takes ने and the verb agrees with the object, not the doer. मैंने चिट्ठी लिखी (mainnē ciṭṭhī likhī), I wrote the letter, with a feminine object; मैंने गीत लिखा (mainnē gīt likhā), I wrote the song, with a masculine one. The same rule holds for the present perfect."
