id: "hi-en-grammar-past"
kind: "layer"
core: "hi-grammar-past"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Past tense"
license: "CC0-1.0"
description: "I came, she went: the simple past of verbs without an object."
pattern:
  name: "Simple past, intransitive verbs"
  slot_name: "person and gender"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "aanaa": "to come"
    "jaanaa": "to go"
    "baithnaa": "to sit"
  notes: "With a verb that takes no object, the past agrees with the doer: -आ (-ā), -ई (-ī), -ए (-ē), -ईं (-īm̐). जाना (jānā) is irregular: गया (gayā). Some writers spell आए (āē) and गई (gaī) as आये (āyē) and गयी (gayī). With an object, the rule is different: see Pitfalls."
