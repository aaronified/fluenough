schema: 1
id: "hi-en-multiword-conjunct-verbs"
kind: "layer"
core: "hi-multiword-conjunct-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Conjunct verbs: noun or adjective with a light verb"
description: "A noun or adjective with करना (karnā), होना (hōnā) or देना (denā) makes one verb: the meaning is in the pair. Not yet checked by a Hindi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "hi-4350":
    native: "to like; to prefer"
    notes:
      "u1": "Used for choosing or preferring one thing: the noun पसंद (pasand) comes first, then the verb करना (karnā)."
    bases:
      "पसंद": "liking; choice"
      "करना": "to do; to make"
  "hi-4351":
    native: "to love"
    notes:
      "u1": "The noun प्यार (pyār) with the verb करना (karnā); for a person, को (ko) can follow the verb's object."
    bases:
      "प्यार": "love"
      "करना": "to do; to make"
  "hi-4352":
    native: "to accept; to approve"
    notes:
      "u1": "Used for approving a request or accepting an offer: the noun मंज़ूर (maṁzūr) with करना (karnā)."
    bases:
      "मंज़ूर": "approved; accepted"
      "करना": "to do; to make"
  "hi-4353":
    native: "to refuse"
    notes:
      "u1": "The noun इनकार (inkār) with the verb करना (karnā); the thing refused comes before the verb."
    bases:
      "इनकार": "refusal"
      "करना": "to do; to make"
  "hi-4354":
    native: "to close; to turn off"
    notes:
      "u1": "The adjective बंद (band), closed, with करना (karnā) makes 'to close'; its opposite is खोलना (kholnā), to open."
    bases:
      "बंद": "closed; shut"
      "करना": "to do; to make"
  "hi-4355":
    native: "to find out; to learn"
    notes:
      "u1": "The noun पता (patā) with चलना (calnā): here it means to come to know, not to walk."
    bases:
      "पता": "address; trace"
      "चलना": "to move; to walk"
  "hi-4356":
    native: "to promise"
    notes:
      "u1": "The noun वादा (vādā), promise, with करना (karnā); the promise made comes before the verb."
    bases:
      "वादा": "promise"
      "करना": "to do; to make"
  "hi-4357":
    native: "to answer; to reply"
    notes:
      "u1": "The noun जवाब (javāb), answer, with देना (denā), to give; the verb is देना, not करना."
    bases:
      "जवाब": "answer; reply"
      "देना": "to give"
  "hi-4358":
    native: "to treat (an illness)"
    notes:
      "u1": "The noun इलाज (ilāj), treatment, with करना (karnā), used for treating an illness."
    bases:
      "इलाज": "treatment"
      "करना": "to do; to make"
  "hi-4359":
    native: "to trust"
    notes:
      "u1": "The noun भरोसा (bharosā), trust, with करना (karnā); the person or thing trusted is marked with पर (par)."
    bases:
      "भरोसा": "trust"
      "करना": "to do; to make"
  "hi-4360":
    native: "to take care"
    notes:
      "u1": "The noun ख़याल (k͟hayāl), care or thought, with रखना (rakhnā), to keep; it is also said as a goodbye, take care."
    bases:
      "ख़याल": "thought; care"
      "रखना": "to keep"
  "hi-4361":
    native: "to trouble; to bother"
    notes:
      "u1": "The adjective परेशान (parēśān), troubled, with करना (karnā) makes 'to trouble someone'."
    bases:
      "परेशान": "troubled; worried"
      "करना": "to do; to make"
  "hi-4362":
    native: "to pay"
    notes:
      "u1": "The plural noun पैसे (paisē), money, with देना (denā), to give: to pay."
    bases:
      "पैसे": "money"
      "देना": "to give"
  "hi-4363":
    native: "to travel; to make a journey"
    notes:
      "u1": "The noun यात्रा (yātrā), journey, with करना (karnā), to make a journey."
    bases:
      "यात्रा": "journey"
      "करना": "to do; to make"
  "hi-4364":
    native: "to spend"
    notes:
      "u1": "The noun ख़र्च (k͟harc), expense, with करना (karnā): the money spent comes before the verb."
    bases:
      "ख़र्च": "expense"
      "करना": "to do; to make"
  "hi-4365":
    native: "to use; to try out"
    notes:
      "u1": "The noun प्रयोग (prayōg), use or experiment, with करना (karnā), to use a thing or to try a method."
    bases:
      "प्रयोग": "use; experiment"
      "करना": "to do; to make"
  "hi-4366":
    native: "to help"
    notes:
      "u1": "The noun सहायता (sahāyatā), help, with करना (karnā); for the everyday word, see मदद करना (madad karnā)."
    bases:
      "सहायता": "help"
      "करना": "to do; to make"
  "hi-4367":
    native: "to love"
    notes:
      "u1": "The noun प्रेम (prēm), love, with करना (karnā)."
    bases:
      "प्रेम": "love"
      "करना": "to do; to make"
