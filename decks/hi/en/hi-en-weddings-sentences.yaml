cards:
  "hi-5592":
    native: "The couple took the wedding rounds at the pavilion."
    bases:
      "फेरे": "wedding rounds"
      "हुए": "took place"
    confusables:
      "w1": { why: "Wedding procession, not rounds: बारात (bārāt) means wedding procession." }
      "w2": { why: "Palanquin, not pavilion: डोली (ḍōlī) means palanquin for the bride." }
  "hi-5593":
    native: "In the wedding procession we hear the shehnai."
    bases:
      "सुनते": "hear"
    confusables:
      "w1": { why: "Gift, not instrument: उपहार (uphār) means gift." }
      "w2": { why: "Priest, not instrument: पंडित (paṇḍit) means priest; learned man." }
  "hi-5594":
    native: "The priest explains the wedding ritual."
    bases:
      "की": "of"
      "बताते": "explain"
    confusables:
      "w1": { why: "Invitation, not ritual: निमंत्रण (nimantraṇ) means invitation." }
      "w2": { why: "Custom; tradition, not ritual: प्रथा (prathā) means custom; tradition." }
  "hi-5595":
    native: "At the bride's farewell, everyone cries."
    bases:
      "की": "of"
      "रोते": "cry"
    confusables:
      "w1": { why: "Groom, not bride: दूल्हा (dūlhā) means groom." }
      "w2": { why: "Girl; daughter, not bride: कन्या (kanyā) means girl; daughter." }
  "hi-5596":
    native: "At the henna ritual everyone sings."
    bases:
      "की": "of"
      "गाते": "sing"
    confusables:
      "w1": { why: "Present; gift, not ritual: तोहफ़ा (tōhfā) means present; gift." }
      "w2": { why: "Custom; tradition, not ritual: प्रथा (prathā) means custom; tradition." }
  "hi-5597":
    native: "The wedding invitation arrived today."
    bases:
      "शादी": "wedding"
      "मिला": "arrived"
    confusables:
      "w1": { why: "Marriage, formal, not invitation: विवाह (vivāh) means marriage (formal)." }
      "w2": { why: "Engagement, not invitation: सगाई (sagāī) means engagement." }
  "hi-5598":
    native: "We will give the bride a present."
    bases:
      "देंगे": "will give"
    confusables:
      "w1": { why: "Groom, not bride: दूल्हा (dūlhā) means groom." }
      "w2": { why: "Gift, a more formal word: उपहार (uphār) means gift." }
  "hi-5599":
    native: "Return home with blessings."
    bases:
      "के": "with"
      "लौटिए": "return (polite)"
    confusables:
      "w1": { why: "Relationship; match, not blessing: रिश्ता (riśtā) means relationship; match; tie." }
      "w2": { why: "Custom; tradition, not blessing: प्रथा (prathā) means custom; tradition." }
  "hi-5600":
    native: "The wedding ceremony will be tomorrow."
    bases:
      "शादी": "wedding"
      "होगा": "will be"
    confusables:
      "w1": { why: "Engagement, not ceremony: सगाई (sagāī) means engagement." }
      "w2": { why: "Marriage, formal, not ceremony: विवाह (vivāh) means marriage (formal)." }
  "hi-5601":
    native: "The bride's palanquin has come."
    bases:
      "की": "of"
      "आ": "come"
      "गई": "(completed)"
    confusables:
      "w1": { why: "Wedding procession: बारात (bārāt) means wedding procession." }
      "w2": { why: "Wedding pavilion: मंडप (maṇḍap) means wedding pavilion." }
  "hi-5602":
    native: "My brother's engagement is tomorrow."
    bases:
      "मेरे": "my"
      "भाई": "brother"
      "की": "of"
    confusables:
      "w1": { why: "Marriage, formal: विवाह (vivāh) means marriage (formal)." }
      "w2": { why: "Relationship; match: रिश्ता (riśtā) means relationship; match; tie." }
  "hi-5603":
    native: "Every bond is built on love and blessings."
    bases:
      "हर": "every"
      "प्रेम": "love"
      "बनता": "is built"
    confusables:
      "w1": { why: "Belonging; warmth, not bond: अपनापन (apnāpan) means belonging; warmth." }
      "w2": { why: "Custom; tradition, not bond: प्रथा (prathā) means custom; tradition." }
