rules:
  "hi-rule-future":
    name: "-गा (-gā), -गी (-gī), -गे (-gē): the future"
    explanation: "The stem, a vowel for the person (-ऊँ (-ūm̐), -ओ (-ō), -ए (-ē), -एँ (-ēm̐)), then -गा (-gā), -गी (-gī) or -गे (-gē) for gender and number. Some writers spell जाएगा (jāēgā) as जायेगा (jāyēgā). Some verbs are irregular: देना (dēnā) gives दूँगा (dūm̐gā), I will give, and होना (hōnā) gives होगा (hōgā), he will be."
