description: "Getting a ride, agreeing the fare and getting off where you want."
cards:
  "hi-0262":
    native: "bus"
    notes:
      "n1": "Feminine: बस आ गई (bas ā gaī), the bus has come. It also means 'enough'."
  "hi-0263":
    native: "auto-rickshaw"
  "hi-0264":
    native: "taxi"
  "hi-0265":
    native: "fare; rent"
    notes:
      "n1": "किराया कितना है (kirāyā kitnā hai)? What's the fare?"
  "hi-0266":
    native: "Please go by the meter."
    notes:
      "n1": "Ask before you get in. If the driver refuses, agree the fare first."
    bases:
      "मीटर": "meter"
  "hi-0267":
    native: "I need to go to the station."
    notes:
      "n1": "Put any place before जाना है (jānā hai): एयरपोर्ट जाना है (ēyrpōrṭ jānā hai), I need to go to the airport."
    bases:
      "जाना": "to go"
  "hi-0268":
    native: "How long will it take?"
    bases:
      "देर": "delay; lateness"
      "लगेगी": "to take (time)"
  "hi-0269":
    native: "Stop here, please."
    bases:
      "रोकिए": "to stop"
  "hi-0270":
    native: "station"
  "hi-0271":
    native: "ticket"
    notes:
      "n1": "Some speakers make it feminine."
  "hi-0272":
    native: "seat"
  "hi-0273":
    native: "let's go; please go"
