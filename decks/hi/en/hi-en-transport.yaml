schema: 1
id: "hi-en-transport"
kind: "layer"
core: "hi-transport"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bus, auto, cab"
license: "CC-BY-SA-4.0"
description: "Getting a ride, agreeing the fare and getting off where you want."
cards:
  "hi-0262":
    native: "bus"
    notes:
      "n1": "Feminine: बस आ गई (bas ā gaī), the bus has come. It also means 'enough'."
    "examples": {
    }
  "hi-0263":
    native: "auto-rickshaw"
  "hi-0264":
    native: "taxi"
    "examples": {
      "एयरपोर्ट पर टैक्सी लो।": {"native": "Take a taxi to the airport.", "bases": {"टैक्सी": "taxi"}}
    }
  "hi-0265":
    native: "fare; rent"
    notes:
      "n1": "किराया कितना है (kirāyā kitnā hai)? What's the fare?"
    "examples": {
      "मालिक किराया माँग रहा है।": {"native": "The owner is asking for rent.", "bases": {"माँग": "to ask for", "किराया": "fare; rent"}},
      "हमने नाव किराए पर ली।": {"native": "We hired a boat.", "bases": {"किराए": "fare; rent"}}
    }
  "hi-0266":
    native: "Please go by the meter."
    notes:
      "n1": "Ask before you get in. If the driver refuses, agree the fare first."
    bases:
      "मीटर": "meter"
  "hi-0267":
    native: "I need to go to the station."
    notes:
      "n1": "Put any place before जाना है (jānā hai): एयरपोर्ट जाना है (ēyrpōrṭ jānā hai), I need to go to the airport."
    bases:
      "जाना": "to go"
  "hi-0268":
    native: "How long will it take?"
    bases:
      "देर": "delay; lateness"
      "लगेगी": "to take (time)"
  "hi-0269":
    native: "Stop here, please."
    bases:
      "रोकिए": "to stop"
  "hi-0270":
    native: "station"
    "examples": {
      "स्टेशन जाना है।": {"native": "I need to go to the station.", "bases": {"जाना": "to go"}},
      "अगले स्टेशन पर उतरना है।": {"native": "We have to get off at the next station.", "bases": {"अगले": "next", "उतरना": "to get off", "स्टेशन": "station"}}
    }
  "hi-0271":
    native: "ticket"
    notes:
      "n1": "Some speakers make it feminine."
    "examples": {
      "मुझे टिकट चाहिए।": {"native": "I need a ticket.", "bases": {}},
    }
  "hi-0272":
    native: "seat"
    "examples": {
      "सीट का आरक्षण कराओ।": {"native": "Get a reservation for a seat.", "bases": {"कराओ": "to get done", "सीट": "seat"}}
    }
  "hi-0273":
    native: "let's go; please go"
    "examples": {
      "मीटर से चलिए।": {"native": "Please go by the meter.", "bases": {"मीटर": "meter"}},
      "धीरे चलिए।": {"native": "Walk slowly.", "bases": {}}
    }
