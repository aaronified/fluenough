id: "hi-en-verbs-sentences"
kind: "layer"
core: "hi-verbs-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences with everyday verbs"
license: "CC-BY-SA-4.0"
description: "Short sentences that use the everyday verbs of this unit. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0802":
    native: "I get up every morning."
    confusables:
      "f1": { why: "Feminine: उठती (uṭhtī) is said by a woman, not a man." }
      "w1": { why: "Sit, not get up: बैठता (baiṭhtā) means sits." }
  "hi-0803":
    native: "Where will he go tomorrow?"
    confusables:
      "w1": { why: "Do, not go: करेगा (karēgā) means will do." }
      "w2": { why: "Sleep, not go: सोएगा (sōēgā) means will sleep." }
  "hi-0804":
    native: "He asked me the way."
    confusables:
      "w1": { why: "Tell, not ask: बताया (batāyā) means told." }
      "w2": { why: "Write, not ask: लिखा (likhā) means wrote." }
  "hi-0805":
    native: "My sister lives in Delhi."
    confusables:
      "f1": { why: "Masculine: रहता (rahtā) is for a man; a sister is a woman, so रहती (rahtī)." }
      "f2": { why: "Before a masculine or plural noun it is मेरे (mērē); before बहन (bahan), मेरी (mērī)." }
  "hi-0806":
    native: "Please sit here."
    confusables:
      "w1": { why: "Get up, not sit: उठिए (uṭhiē) means get up." }
      "w2": { why: "A question word: कहाँ (kahām̐) means where, and this sentence needs यहाँ (yahām̐), here." }
  "hi-0807":
    native: "Our sister bought a book."
    confusables:
      "w1": { why: "Sold, not bought: बेची (bēcī) means sold." }
      "f1": { why: "Masculine: a book is feminine, so ख़रीदी (k͟harīdī)." }
