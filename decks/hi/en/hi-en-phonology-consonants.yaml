schema: 1
id: "hi-en-phonology-consonants"
kind: "layer"
core: "hi-phonology-consonants"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hindustani consonant sounds (IPA)"
description: "The consonants of Hindustani, one card each: the IPA symbol, the Devanagari and Urdu letters, example words and, where this course's words give one, a minimal pair. The sounds that belong to Persian and Arabic loans, mainly Urdu, come last. For learners who know the IPA or want to learn it. Variety taught: the standard Delhi variety of Hindustani, Hindi and Urdu together. This is a proposal, not yet confirmed by the owner, a Hindi or Urdu speaker or a phonetician. Where a sound belongs to Urdu or to Persian and Arabic loans only, the card says so, and the Urdu script is given beside the Devanagari wherever they differ."
license: "CC-BY-SA-4.0"
authors:
  - { name: "Fluenough contributors" }
  - { name: "Wikipedia contributors (Hindustani phonology; Help:IPA/Hindi and Urdu)", url: "https://en.wikipedia.org/wiki/Hindustani_phonology" }
source: "Ohala (1999), 'Hindi', in the Handbook of the International Phonetic Association, Cambridge University Press, pp. 100-103 (the IPA's own Handbook; Wikipedia names no 'Illustration of the IPA' in the Journal of the International Phonetic Association for Hindi or Urdu, and none could be checked); also as cited by Wikipedia: Shapiro (2003), 'Hindi', and Schmidt (2003), 'Urdu', in Cardona and Jain (eds), The Indo-Aryan Languages, Routledge; Masica (1991), The Indo-Aryan Languages, Cambridge University Press; Kachru (2006), Hindi; Hussein (1997), Phonetic Correlates of Lexical Stress in Urdu. Text adapted from Wikipedia, 'Hindustani phonology' and 'Help:IPA/Hindi and Urdu', CC BY-SA 4.0, https://en.wikipedia.org/wiki/Hindustani_phonology"
tags: ["ipa", "phonology", "unreviewed"]
cards:
  "hi-1149":
    native: "voiceless bilabial stop (p), with no puff of breath; Hindi प (pa), Urdu پ (pa)"
    notes:
      "n1": "Like the p of 'spot' in Wikipedia's comparison: no puff of breath. Hindustani stops have a four-way contrast of phonation: plain, voiced, aspirated and breathy-voiced (murmured)."
      "n2": "Minimal pair among this course's words: {1}, when, and {2}, cup, differ only in voice, b against p."
    examples:
      "पास": "near"
      "कप": "cup"
  "hi-1150":
    native: "voiceless aspirated bilabial stop (pʰ): p with a puff of breath; Hindi फ (pha), Urdu پھ (pha)"
    notes:
      "n1": "Like the p of 'pot' in Wikipedia's comparison. Urdu writes the aspirates with the letter ھ (do-chashmi he) after the plain letter. The source adds that f is encroaching on and replacing pʰ even in native Hindi words, as in Punjabi, Bengali, Gujarati, Marathi and Malayalam."
      "n2": "Minimal pair among this course's words: {1}, moment, and {2}, fruit, differ only in the breath after the p: p against pʰ."
    examples:
      "फल": "fruit"
      "फिर": "then; again"
  "hi-1151":
    native: "voiced bilabial stop (b); Hindi ब (ba), Urdu ب (ba)"
    notes:
      "n1": "The b of 'cabbie' in Wikipedia's comparison. Hindustani stops have a four-way contrast of phonation: plain, voiced, aspirated and breathy-voiced (murmured)."
      "n2": "Minimal pair among this course's words: {1}, when, and {2}, cup, differ only in voice, b against p."
    examples:
      "बाल": "hair"
      "बस": "that's all; enough"
  "hi-1152":
    native: "voiced breathy bilabial stop (bʱ); Hindi भ (bha), Urdu بھ (bha)"
    notes:
      "n1": "Often called a voiced aspirate, but the source quotes Shapiro (2003): experiments show it is a different kind of voicing, murmur, where air passes between the arytenoid cartilages. The source adds that murmured consonants are believed to go back to Proto-Indo-European, and are absent in every branch of the family but Indo-Aryan and Armenian."
      "n2": "Minimal pair among this course's words: {1}, also; too; even, and {2}, ghee, differ only in the first sound, bʱ against ɡʱ."
    examples:
      "भी": "also; too; even"
      "अभी": "now; right now"
  "hi-1153":
    native: "voiceless dental stop (t̪), with no puff of breath; Hindi त (ta), Urdu ت (ta) and ط (ta)"
    notes:
      "n1": "The source says the dental stops are laminal denti-alveolar, as in Spanish, with the tongue well in contact with the back of the upper front teeth. Both the dental and the retroflex stops sound like English t and d to most English speakers; Wikipedia's help page compares t̪ to the 'th' of 'outthink' or the Spanish t in señorita. The Urdu letter ط (ta) is the same sound, as the course's Urdu letter deck says."
      "n2": "Minimal pair among this course's words: {1}, poor; humble, and {2}, 3, three, differ only in voice, d̪ against t̪."
    examples:
      "तीन": "3, three"
      "सात": "7, seven"
  "hi-1154":
    native: "voiceless aspirated dental stop (t̪ʰ): t̪ with a puff of breath; Hindi थ (tha), Urdu تھ (tha)"
    notes:
      "n1": "The aspirated dental stop. The help page compares it to the 'th' of Indian English 'path' and 'birth'."
      "n2": "Minimal pair among this course's words: {1}, 7, seven, and {2}, together, differ only in the breath after the t: t̪ against t̪ʰ."
    examples:
      "साथ": "together"
      "हाथ": "hand; arm"
  "hi-1155":
    native: "voiced dental stop (d̪); Hindi द (da), Urdu د (da)"
    notes:
      "n1": "The voiced partner of t̪. The help page compares it to the 'd' of 'width', or of Spanish 'despacito'."
      "n2": "Minimal pair among this course's words: {1}, poor; humble, and {2}, 3, three, differ only in voice, d̪ against t̪."
      "n3": "Minimal pair among this course's words: {1}, lentils, and {2}, branch, differ only in the place of the d: on the teeth, or curled back (d̪ against ɖ)."
    examples:
      "दो": "2, two"
      "दस": "10, ten"
  "hi-1156":
    native: "voiced breathy dental stop (d̪ʱ); Hindi ध (dha), Urdu دھ (dha)"
    notes:
      "n1": "The breathy partner of d̪. The help page compares it to the 'dh' of 'adhere', but dental."
      "n2": "Minimal pair among this course's words: {1}, gift; donation, and {2}, paddy, differ only in the breath after the d: d̪ against d̪ʱ."
    examples:
      "दूध": "milk"
      "धोना": "to wash"
  "hi-1157":
    native: "voiceless retroflex stop (ʈ), with no puff of breath; Hindi ट (ṭa), Urdu ٹ (ṭa)"
    notes:
      "n1": "The source says the retroflex series is not purely retroflex: it is apico-postalveolar, also described as apico-pre-palatal, and in some words, such as ṭūṭā 'broken', it even becomes alveolar, especially in Urdu. The help page compares it to the 't' of 'stub', but retroflex."
    examples:
      "पेट": "stomach; belly"
      "सीट": "seat"
  "hi-1158":
    native: "voiceless aspirated retroflex stop (ʈʰ): ʈ with a puff of breath; Hindi ठ (ṭha), Urdu ٹھ (ṭha)"
    notes:
      "n1": "The aspirated retroflex stop. The help page compares it to the 't' of 'tub', but retroflex."
      "n2": "Minimal pair among this course's words: {1}, together, and {2}, 60, sixty, differ only in the place of the last sound: on the teeth, or curled back (t̪ʰ against ʈʰ)."
    examples:
      "आठ": "8, eight"
      "मीठा": "sweet; a sweet"
  "hi-1159":
    native: "voiced retroflex stop (ɖ); Hindi ड (ḍa), Urdu ڈ (ḍa)"
    notes:
      "n1": "The voiced partner of ʈ. It is ɖ at the start of a word, in a geminate and after a nasal; between vowels and at the end of a word the letter ड (ḍa) is said as the flap ɽ (see the ɽ card and the allophones deck). The help page compares it to the 'd' of American 'bird'."
      "n2": "Minimal pair among this course's words: {1}, lentils, and {2}, branch, differ only in the place of the d: on the teeth, or curled back (d̪ against ɖ)."
    examples:
      "डाल": "branch"
      "अंडा": "egg"
  "hi-1160":
    native: "voiced breathy retroflex stop (ɖʱ); Hindi ढ (ḍha), Urdu ڈھ (ḍha)"
    notes:
      "n1": "The breathy partner of ɖ, under the same distribution as ɖ: between vowels and at the end of a word ढ़ (ṛha) is ɽʱ. The help page compares it to the 'dh' of American 'birdhouse'."
      "n2": "Minimal pair among this course's words: {1}, brother, and {2}, 2½, two and a half, differ only in the first sound, bʱ against ɖʱ."
    examples:
      "ढाई": "2½, two and a half"
      "ढेर": "a heap, a pile, a great deal"
  "hi-1161":
    native: "voiceless postalveolar affricate (tʃ); Hindi च (ca), Urdu چ (ca)"
    notes:
      "n1": "The 'tch' of 'catch' in Wikipedia's comparison, with no puff of breath. Hindustani stops have a four-way contrast of phonation: plain, voiced, aspirated and breathy-voiced (murmured)."
      "n2": "Minimal pair among this course's words: {1}, tea, and {2}, cow, differ only in the first sound, tʃ against ɡ."
    examples:
      "चार": "4, four"
      "चाय": "tea"
  "hi-1162":
    native: "voiceless aspirated postalveolar affricate (tʃʰ): tʃ with a puff of breath; Hindi छ (cha), Urdu چھ (cha)"
    notes:
      "n1": "The 'chh' of 'beachhead' in Wikipedia's comparison."
      "n2": "Minimal pair among this course's words: {1}, to strain, and {2}, to know, differ only in the first sound, tʃʰ against dʒ."
    examples:
      "छह": "6, six"
      "कुछ": "something; some; a little"
  "hi-1163":
    native: "voiced postalveolar affricate (dʒ); Hindi ज (ja), Urdu ج (ja)"
    notes:
      "n1": "The 'dg' of 'budging' in Wikipedia's comparison."
      "n2": "Minimal pair among this course's words: {1}, to know, and {2}, to strain, differ only in the first sound, dʒ against tʃʰ."
    examples:
      "आज": "today"
      "जून": "June"
  "hi-1164":
    native: "voiced breathy postalveolar affricate (dʒʱ); Hindi झ (jha), Urdu جھ (jha)"
    notes:
      "n1": "The breathy partner of dʒ. The help page compares it to the 'dgeh' of 'hedgehog'."
    examples:
      "झील": "lake"
      "समझना": "to understand"
  "hi-1165":
    native: "voiceless velar stop (k), with no puff of breath; Hindi क (ka), Urdu ک (ka)"
    notes:
      "n1": "The 'c' of 'scab' in Wikipedia's comparison: no puff of breath."
      "n2": "Minimal pair among this course's words: {1}, jewellery, and {2}, to say, differ only in voice, ɡ against k."
    examples:
      "कब": "when"
      "एक": "1, one"
  "hi-1166":
    native: "voiceless aspirated velar stop (kʰ): k with a puff of breath; Hindi ख (kha), Urdu کھ (kha)"
    notes:
      "n1": "The 'c' of 'cab' in Wikipedia's comparison. Do not confuse it with Urdu خ (k͟ha), the sound x, which Hindi speakers often replace by kʰ."
      "n2": "Minimal pair among this course's words: {1}, to live, to stay, and {2}, to put, to keep, differ only in the middle sound, ɦ against kʰ."
    examples:
      "खूब": "a lot"
      "आँख": "eye"
  "hi-1167":
    native: "voiced velar stop (ɡ); Hindi ग (ga), Urdu گ (ga)"
    notes:
      "n1": "The 'g' of 'ago' in Wikipedia's comparison."
      "n2": "Minimal pair among this course's words: {1}, jewellery, and {2}, to say, differ only in voice, ɡ against k."
    examples:
      "आगे": "ahead; further on"
      "लोग": "people"
  "hi-1168":
    native: "voiced breathy velar stop (ɡʱ); Hindi घ (gha), Urdu گھ (gha)"
    notes:
      "n1": "The breathy partner of ɡ. The help page compares it to the 'gh' of 'loghouse'."
      "n2": "Minimal pair among this course's words: {1}, tiger, and {2}, garden, differ only in the last sound, ɡʱ against ɣ."
    examples:
      "घर": "house; home"
      "घी": "ghee"
  "hi-1169":
    native: "voiced bilabial nasal (m); Hindi म (ma), Urdu م (ma)"
    notes:
      "n1": "The m of 'much' in Wikipedia's comparison."
      "n2": "Minimal pair among this course's words: {1}, work, and {2}, ear, differ only in m against n."
    examples:
      "मई": "May"
      "नाम": "name"
  "hi-1170":
    native: "voiced dental or alveolar nasal (n); Hindi न (na), Urdu ن (na)"
    notes:
      "n1": "The table puts n in the dental or alveolar column; the help page compares the dental n to the 'n' of 'panther'."
      "n2": "Minimal pair among this course's words: {1}, day, and {2}, heart, differ only in the last sound, n against l."
    examples:
      "नौ": "9, nine"
      "दान": "gift; donation"
  "hi-1171":
    native: "voiced velar nasal (ŋ); Hindi ङ (ṅa), Urdu ن (na) with a mark (ṅa)"
    notes:
      "n1": "The source says ŋ mostly occurs only before velar consonants, as in aṅkit, but words such as mumkin and tinkā make it a phoneme. A Sanskrit loan with ṅ elsewhere is made ṅg, as vāṅmaya is said vāṅ(g)maya. The help page compares it to the 'ng' of 'bang' and writes it in Urdu with ن (na) and a small mark above, as in رن٘گ (raṅg)."
    examples:
      "जंगल": "forest"
      "पंखा": "fan"
  "hi-1172":
    native: "voiced retroflex nasal (ɳ), marginal: Sanskrit loans; Hindi ण (ṇa)"
    notes:
      "n1": "The table lists ɳ in brackets: it is found only in Sanskrit loans, predominantly in Hindi, and marginally in Urdu. Urdu speakers usually replace ɳ by n, and Urdu writes किरण (kiraṇ) as کرن (kiraṇ) with a plain ن (na). The help page compares it to the 'n' of American 'burn'."
    examples:
      "अंडा": "egg"
      "ठंडा": "cold"
  "hi-1173":
    native: "voiced palatal nasal (ɲ), marginal; Hindi ञ (ña)"
    notes:
      "n1": "The table lists ɲ in brackets: a non-standard phoneme found in a few words or a few dialects, and otherwise an allophone of n before palatal consonants, as in इंजीनियर (iñjīniyar), engineer."
    examples:
      "इंजीनियर": "engineer"
  "hi-1174":
    native: "alveolar tap or trill (r); Hindi र (ra), Urdu ر (ra)"
    notes:
      "n1": "The table writes ɾ, the tap. The source says r is usually flapped or trilled: between vowels it may be a single tap, but it can be a clear trill, especially at the start of a word and at the end of a syllable, and a doubled rr is always a trill in Arabic and Persian loans, as in zarrā against zarā. This course's IPA writes r."
      "n2": "Minimal pair among this course's words: {1}, moment, and {2}, on; at, differ only in the last sound, l against r."
    examples:
      "घर": "house; home"
      "चार": "4, four"
  "hi-1175":
    native: "voiced retroflex flap (ɽ); Hindi ड़ (ṛa), Urdu ڑ (ṛa)"
    notes:
      "n1": "A flap, with the tongue tip curled back and flicked. The source says that in many Indo-Aryan languages ɖ and ɽ are allophones in complementary distribution, ɖ at the start of a word, in a geminate and after a nasal, and ɽ between vowels and at the end of a word; but ड़ (ṛa) is also written as a letter of its own. For some speakers ɽ is lateral. The help page compares it to the 'rt' of American 'garter'."
      "n2": "Minimal pair among this course's words: {1}, left over; survived, and {2}, big, differ only in the middle sound, tʃ against ɽ."
    examples:
      "सड़क": "road"
      "बड़ा": "big"
  "hi-1176":
    native: "voiced breathy flap (ɽʱ); Hindi ढ़ (ṛha), Urdu ڑھ (ṛha)"
    notes:
      "n1": "The breathy flap. The source says it tends to lose its breath and become ɽ in colloquial western Hindi, but is kept as a distinct sound in eastern Hindi. The help page says it has no English equivalent, a cross between a flap and a breathy retroflex stop."
      "n2": "Minimal pair among this course's words: {1}, to fall; to have to, and {2}, to read, differ only in the breath after the flap: ɽ against ɽʱ."
    examples:
      "पढ़ना": "to read"
      "साढ़े": "half past; and a half"
  "hi-1177":
    native: "voiced lateral approximant (l); Hindi ल (la), Urdu ل (la)"
    notes:
      "n1": "The l of 'leaf' in Wikipedia's comparison."
      "n2": "Minimal pair among this course's words: {1}, day, and {2}, heart, differ only in the last sound, n against l."
    examples:
      "कल": "tomorrow; yesterday"
      "आलू": "potato"
  "hi-1178":
    native: "voiced labiodental approximant (ʋ); Hindi व (va), Urdu و (va)"
    notes:
      "n1": "The source says ʋ varies freely with v and can also be w; it is w in an onglide, between a consonant and a vowel, and v elsewhere (see the allophones deck). Wikipedia's help page compares v to the 'v' of 'vat' and w to the 'w' of 'well'."
      "n2": "Minimal pair among this course's words: {1}, that; he, she (far), and {2}, this; he, she (near), differ only in the first sound, ʋ against j."
    examples:
      "वह": "that; he, she (far)"
      "चावल": "rice"
  "hi-1179":
    native: "palatal approximant (j); Hindi य (ya), Urdu ی (ya)"
    notes:
      "n1": "The y of 'yuck' in Wikipedia's comparison."
      "n2": "Minimal pair among this course's words: {1}, that; he, she (far), and {2}, this; he, she (near), differ only in the first sound, ʋ against j."
    examples:
      "चाय": "tea"
      "यार": "mate; buddy"
  "hi-1180":
    native: "voiceless alveolar sibilant (s); Hindi स (sa), Urdu س (sa), ث (sa) and ص (sa)"
    notes:
      "n1": "The 's' of 'sun' in Wikipedia's comparison. The Urdu letters ث (sa), س (sa) and ص (sa) all stand for it, as the course's Urdu letter deck says. The source adds that z occurs as an allophone of s beside voiced consonants, as in rasgullā and nasbandī."
      "n2": "Minimal pair among this course's words: {1}, mother-in-law, and {2}, 7, seven, differ only in the last sound, s against t̪."
    examples:
      "दस": "10, ten"
      "सौ": "100, a hundred"
  "hi-1181":
    native: "voiced glottal fricative (ɦ); Hindi ह (ha), Urdu ہ (ha), ھ (ha) and ح (ha)"
    notes:
      "n1": "The source says ɦ is typically voiced, especially between vowels, but there is no phonemic difference between it and voiceless h. The help page compares it to the 'h' of 'ahead'. Urdu also writes it with ح (ha), as in हुक्म (hukm), حکم (hukm)."
      "n2": "Minimal pair among this course's words: {1}, hand; arm, and {2}, together, differ only in the first sound, ɦ against s."
    examples:
      "है": "is"
      "शहर": "city"
  "hi-1182":
    native: "voiceless postalveolar fricative (ʃ); Hindi श (śa), Urdu ش (śa)"
    notes:
      "n1": "The sh of 'shoe' in Wikipedia's comparison. The source says ʃ is found in loanwords from every source (Arabic, English, Portuguese, Persian, Sanskrit) and is well established; the table lists it in brackets. Urdu speakers use ʃ for ʂ."
    examples:
      "शहर": "city"
      "देश": "country"
  "hi-1183":
    native: "voiceless retroflex fricative (ʂ), marginal: Sanskrit loans; Hindi ष (ṣa)"
    notes:
      "n1": "The table lists ʂ in brackets, in Sanskrit loans: Hindi ष (ṣa). The source says ʃ is sometimes regarded as a substitution for ʂ in colloquial Hindi, and Urdu speakers usually replace ʂ by ʃ; this course's own cards write ʃ for ष (śa), as in भाषा (bhāśā), language. The help page's example is नष्ट (naṣṭ)."
    examples:
      "भाषा": "language"
      "निषेध": "forbidden (on signs)"
  "hi-1184":
    native: "voiceless labiodental fricative (f), from loans; Hindi फ़ (fa), Urdu ف (fa)"
    notes:
      "n1": "From Persian and Arabic loans, and also found in English, French and Portuguese loans; the source says f and z are now well established in Hindi, though not in rural India or among older speakers. The help page compares it to the 'f' of 'fuss'. Some Hindi speakers say pʰ for it."
      "n2": "Minimal pair among this course's words: {1}, clean, and {2}, together, differ only in the last sound, f against t̪ʰ."
    examples:
      "साफ़": "clean"
      "काफ़ी": "enough, quite a lot"
  "hi-1185":
    native: "voiced alveolar sibilant (z), from loans; Hindi ज़ (za), Urdu ز (za), ذ (za), ض (za) and ظ (za)"
    notes:
      "n1": "From Persian and Arabic loans, also found in English loans; four Urdu letters, ز (za), ذ (za), ض (za) and ظ (za), stand for it. The source says Hindi mostly replaces it by dʒ except in careful speech of educated speakers."
      "n2": "Minimal pair among this course's words: {1}, love, and {2}, onion, differ only in the last sound, r against z."
    examples:
      "मेज़": "table"
      "रोज़": "every day"
  "hi-1186":
    native: "voiced postalveolar fricative (ʒ), from loans: mainly Urdu; Urdu ژ (z͟ha)"
    notes:
      "n1": "Found in Urdu, and rarer in Hindi, where it is often replaced by z, or by dʒ, or in rarer cases dʒʱ. The source's example is अझ़दहा (az͟hdahā), dragon, Urdu اژدہا (az͟hdahā). Hindi writes it with the letter झ (jha) with a dot, झ़ (z͟ha). No word of this course's cards has it."
    examples:
      "अझ़दहा":
        native: "dragon"
        bases:
          "अझ़दहा": "dragon"
  "hi-1187":
    native: "voiceless uvular stop (q), from loans: mainly Urdu; Hindi क़ (qa), Urdu ق (qa)"
    notes:
      "n1": "From Arabic and Persian loans, seen as Urdu's: the source says Hindi speakers may say k for q. It is usually, though not always, heard further back than k. The help page says it is somewhat like the 'c' of 'caught'. The source's example is क़िस्मत (qismat), fate, Urdu قسمت (qismat). No word of this course's cards has it."
    examples:
      "क़िस्मत":
        native: "fate"
        bases:
          "क़िस्मत": "fate"
  "hi-1188":
    native: "voiceless velar fricative (x), from loans: mainly Urdu; Hindi ख़ (k͟ha), Urdu خ (k͟ha)"
    notes:
      "n1": "From Persian and Arabic loans, seen as Urdu's; the source says Hindi mostly replaces it by kʰ except in the careful speech of educated speakers. The help page compares it to the 'ch' of Scottish 'loch'. Do not confuse it with kʰ, written کھ (kha) in Urdu."
    examples:
      "तारीख़": "date"
      "ख़रीदना": "to buy"
  "hi-1189":
    native: "voiced velar fricative (ɣ), from loans: mainly Urdu; Hindi ग़ (ġa), Urdu غ (ġa)"
    notes:
      "n1": "From Persian and Arabic loans, seen as Urdu's; Hindi speakers may say ɡ for it. The help page says it is similar to the French r."
      "n2": "Minimal pair among this course's words: {1}, tiger, and {2}, garden, differ only in the last sound, ɡʱ against ɣ."
    examples:
      "बाग़": "garden"
  "hi-1190":
    native: "glottal stop (ʔ), in some Urdu words: Urdu ع (a) and ء (hamza)"
    notes:
      "n1": "In a number of words the Urdu letters ع (a) and ء (hamza) are sometimes said as a glottal stop, which Hindi usually does not say or write, except when the Urdu spelling is carried into Hindi. The help page's example is the Urdu spelling of 'trust', اِعْتِبار (i'tibār), which Hindi writes ऐतबार (aitbār) or एतबार (ētbār). The sound is like the pause in 'uh-oh'. No word of this course's cards has it."
