schema: 1
id: "hi-en-script-perso-arabic-reading"
kind: "layer"
core: "hi-script-perso-arabic-reading"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words to read in Perso-Arabic"
license: "CC-BY-SA-4.0"
description: "Short everyday words written the way an Urdu reader sees them, with no short-vowel marks: the letters that spell each one, and the short vowel that is left out. The long vowels are written with alif, vāo and ye."
tags: ["unreviewed"]
cards:
  "hi-0710":
    native: "house; home"
    notes:
      "n1": "گ (ga) and ھ (do-cashmī he) make gh, and ر (ra) ends the word: the short a after the gh is not written."
  "hi-0711":
    native: "water"
    notes:
      "n1": "پ (pa), ا (ā), ن (na) and ی (ī) spell it: the ی at the end is the long ī, written with the letter ye, so no short vowel is left out."
  "hi-0712":
    native: "book"
    notes:
      "n1": "ک (ka), ت (ta), ا (ā) and ب (ba) spell it: the short i after the k is not written, so it is written k-t-ā-b."
  "hi-0713":
    native: "heart"
    notes:
      "n1": "دل (dil) is dāl and lām: the short i between them is not written."
  "hi-0714":
    native: "today"
    notes:
      "n1": "آ (ā) at the start is the long ā, and ج (ja) ends it: no short vowel is left out."
  "hi-0715":
    native: "yesterday; tomorrow"
    notes:
      "n1": "ک (ka) and ل (la) spell it: the short a between them is not written, and the word has no ending vowel."
  "hi-0716":
    native: "talk; word"
    notes:
      "n1": "ب (ba), ا (ā) and ت (ta): the long ā is written with ا (ā), and no short vowel is left out."
  "hi-0717":
    native: "day"
    notes:
      "n1": "د (da) and ن (na) spell it: the short i between them is not written."
  "hi-0718":
    native: "night"
    notes:
      "n1": "ر (ra), ا (ā) and ت (ta) spell it: the long ā is written with ا (ā), and ت (ta) ends the word."
  "hi-0719":
    native: "name"
    notes:
      "n1": "ن (na), ا (ā) and م (ma) spell it: the long ā is written with ا (ā), and م (ma) ends the word."
  "hi-0720":
    native: "milk"
    notes:
      "n1": "د (da), و (ū) and د (da) with ھ (do-cashmī he) after it make dūdh: the long ū is written with و (ū), and the ھ (do-cashmī he) makes dh."
  "hi-0721":
    native: "and"
    notes:
      "n1": "ا (alif) at the start carries the a, and و (vāo) gives the u: no short vowel is written separately."
  "hi-0722":
    native: "yes"
    notes:
      "n1": "ہ (ha), ا (ā) and ں (nūn ġunna) spell it: the vowel is nasal, not followed by an n, so the nūn ġunna is the only nasal mark."
  "hi-0723":
    native: "no; not"
    notes:
      "n1": "ن (na), ہ (ha), ی (ī) and ں (nūn ġunna) spell it: the short a after the n is not written, and the nūn ġunna makes the long ī nasal."
  "hi-0724":
    native: "boy"
    notes:
      "n1": "ل (la), ڑ (ṛa), ک (ka) and ا (ā) spell it: the short a after the lām is not written, and the ا (ā) at the end is the long ā."
