native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences about food"
license: "CC-BY-SA-4.0"
description: "Short sentences that use the food words of this unit. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-2940":
    native: "Please take this sour lemon."
    notes:
      "n1": "लीजिए (lījiē) is the polite imperative of लेना (lēnā, to take): the form for asking someone respectfully to take something."
    bases:
      "लीजिए": "take (polite)"
    confusables:
      "w1": { why: "Orange, not lemon: संतरा (santarā) means orange." }
      "w2": { why: "Banana, not lemon: केला (kēlā) means banana." }
  "hi-2941":
    native: "Who should bring the fresh salad?"
    bases:
      "लाए": "bring (should)"
    confusables:
      "w1": { why: "Where, not who: कहाँ (kahām̐) means where." }
      "w2": { why: "When, not who: कब (kab) means when." }
  "hi-2942":
    native: "The children are happy, so give pakoras."
    notes:
      "n1": "दीजिए (dījiē) is the polite imperative of देना (dēnā, to give), used to ask someone to give something."
    bases:
      "हैं": "are"
      "पकौड़े": "pakoras"
      "दीजिए": "give (polite)"
    confusables:
      "w1": { why: "Samosa, not pakora: समोसा (samōsā) is a samosa." }
      "w2": { why: "Sad, not happy: दुखी (dukhī) means sad." }
  "hi-2943":
    native: "Boil the corn again this morning."
    notes:
      "n1": "उबालिए (ubāliē) is the polite imperative of उबालना (ubālnā, to boil), so it asks someone respectfully to boil."
    bases:
      "उबालिए": "boil (polite)"
    confusables:
      "w1": { why: "Evening, not morning: शाम (śām) means evening." }
      "w2": { why: "Tomorrow, not today: कल (kal) means tomorrow." }
  "hi-2944":
    native: "Which banana should I take?"
    notes:
      "n1": "कौन-सा (kaun-sā, which) takes the masculine ending -सा (-sā) because केला (kēlā, banana) is masculine."
    bases:
      "लूँ": "take (should I)"
      "सा": "which (as in कौन-सा (kaun-sā))"
    confusables:
      "w1": { why: "Apple, not banana: सेब (sēb) means apple." }
      "w2": { why: "Who, not which: कौन (kaun) means who." }
  "hi-2945":
    native: "Tell elder sister the name of the sweet."
    notes:
      "n1": "बताइए (batāiē) is the polite imperative of बताना (batānā, to tell), and दीदी को (dīdī kō) marks the one who is told."
    bases:
      "बताइए": "tell (polite)"
    confusables:
      "w1": { why: "Brother, not elder sister: भैया (bhaiyā) means brother, said to a man of about your age." }
      "w2": { why: "Grandmother, not elder sister: दादी (dādī) means grandmother." }
  "hi-2946":
    native: "Cut the carrot properly, but keep the ginger."
    notes:
      "n1": "काटिए (kāṭiē) and रखिए (rakhiē) are polite imperatives, meaning cut and keep, with the -इए (-iē) ending used for a respectful listener."
    bases:
      "काटिए": "cut (polite)"
      "रखिए": "keep (polite)"
    confusables:
      "w1": { why: "Grape, not carrot: अंगूर (aṅgūr) means grape." }
      "w2": { why: "Mango, not ginger: आम (ām) means mango." }
  "hi-2947":
    native: "When you go to town, then buy fresh apples."
    notes:
      "n1": "जब (jab, when) and तब (tab, then) pair up as the two halves of one sentence, the first with जब (jab)."
    bases:
      "जब": "when"
      "जाएँ": "go (should)"
      "तब": "then"
      "ताज़े": "fresh"
      "ख़रीदिए": "buy (polite)"
    confusables:
      "w1": { why: "To sell, not buy: बेचना (bēcnā) means to sell." }
      "w2": { why: "Home, not town: घर (ghar) means home." }
  "hi-2948":
    native: "Bring coconut for the chutney."
    notes:
      "n1": "के लिए (kē liē, for) follows its noun: चटनी के लिए (caṭnī kē liē, for the chutney)."
    bases:
      "लाइए": "bring (polite)"
      "लिए": "for"
    confusables:
      "w1": { why: "Lemon, not coconut: नींबू (nīmbū) means lemon." }
      "w2": { why: "To take, not bring: लेना (lēnā) means to take." }
  "hi-2949":
    native: "How should I cook the biryani?"
    notes:
      "n1": "The -ऊँ (-ūm̐) form with मैं (maim̐, I), as in पकाऊँ (pakāūm̐), asks what I should do, such as shall I cook."
    bases:
      "पकाऊँ": "cook (should I)"
    confusables:
      "w1": { why: "Paratha, not biryani: पराठा (parāṭhā) means paratha." }
      "w2": { why: "How much, not how: कितना (kitnā) means how much." }
  "hi-2950":
    native: "On Monday evening, play with the children, then serve sweets."
    notes:
      "n1": "खेलिए (khēliē) and परोसिए (parōsiē) are polite imperatives, the -इए (-iē) form for telling someone respectfully to do something."
    bases:
      "बच्चों": "children"
      "खेलिए": "play (polite)"
      "परोसिए": "serve (polite)"
    confusables:
      "w1": { why: "Saturday, not Monday: शनिवार (śanivār) means Saturday." }
      "w2": { why: "Friend, not children: दोस्त (dōst) means friend." }
  "hi-2951":
    native: "Please wash this banana well."
    notes:
      "n1": "धोइए (dhōiē) is the polite imperative of धोना (dhōnā, to wash), and अच्छी तरह (acchī tarah, well) comes before it."
    bases:
      "अच्छी": "well (with तरह (tarah))"
      "तरह": "way; manner"
      "धोइए": "wash (polite)"
    confusables:
      "w1": { why: "Apple, not banana: सेब (sēb) means apple." }
      "w2": { why: "To cook, not wash: पकाना (pakānā) means to cook." }
  "hi-2952":
    native: "Please strain the coffee quickly."
    notes:
      "n1": "आप (āp, you, polite) with the imperative छानिए (chāniē, strain) makes the instruction polite; छानना (chānnā) is the base verb."
    bases:
      "छानिए": "strain (polite)"
    confusables:
      "w1": { why: "Juice, not coffee: जूस (jūs) means juice." }
      "w2": { why: "Slowly, not quickly: धीरे (dhīrē) means slowly." }
  "hi-2953":
    native: "On Saturday, send jaggery, almonds and ginger to grandmother."
    notes:
      "n1": "भेजिए (bhējiē) is the polite imperative of भेजना (bhējnā, to send), and दादी को (dādī kō) marks the person it is sent to."
    bases:
      "भेजिए": "send (polite)"
    confusables:
      "w1": { why: "Tuesday, not Saturday: मंगलवार (maṅgalvār) means Tuesday." }
      "w2": { why: "Elder sister, not grandmother: दीदी (dīdī) means elder sister." }
  "hi-2954":
    native: "At what time should you sell the cake tomorrow?"
    notes:
      "n1": "कितने बजे (kitnē bajē, at what time) is the usual way to ask the time: कितने (kitnē, how many) with बजे (bajē, o'clock)."
    bases:
      "कितने": "how many (here: at what)"
      "बेचें": "sell (should you)"
    confusables:
      "w1": { why: "Puri, not cake: पूरी (pūrī) means puri." }
      "w2": { why: "Today, not tomorrow: आज (āj) means today." }
  "hi-2955":
    native: "Add sugar to the yogurt."
    notes:
      "n1": "डालिए (ḍāliē) is the polite imperative of डालना (ḍālnā, to put in), and में (mēm̐, in) follows दही (dahī, yogurt)."
    bases:
      "डालिए": "add (polite)"
    confusables:
      "w1": { why: "Salt, not sugar: नमक (namak) means salt." }
      "w2": { why: "Honey, not sugar: शहद (śahad) means honey." }
  "hi-2956":
    native: "This paratha is not cold."
    notes:
      "n1": "नहीं (nahīm̐, not) comes just before है (hai, is), the verb, in a negative sentence."
    bases:
      "है": "is"
    confusables:
      "w1": { why: "Hot, not cold: गरम (garam) means hot." }
      "w2": { why: "Fresh, not cold: ताज़ा (tāzā) means fresh." }
  "hi-2957":
    native: "Leave the cake with brother quickly."
    notes:
      "n1": "के पास (kē pās, at or near) follows its noun: भैया के पास (bhaiyā kē pās, at brother's place)."
    bases:
      "छोड़िए": "leave (polite)"
    confusables:
      "w1": { why: "Elder sister, not brother: दीदी (dīdī) means elder sister." }
      "w2": { why: "Slowly, not quickly: धीरे (dhīrē) means slowly." }
  "hi-2958":
    native: "Cook the biryani slowly."
    notes:
      "n1": "धीरे-धीरे (dhīrē-dhīrē) repeats धीरे (dhīrē) to mean slowly, step by step."
    bases:
      "पकाइए": "cook (polite)"
    confusables:
      "w1": { why: "Quickly, not slowly: जल्दी (jaldī) means quickly." }
      "w2": { why: "To boil, not cook: उबालना (ubālnā) means to boil." }
  "hi-2959":
    native: "Where should I keep all the samosas?"
    notes:
      "n1": "सारे (sārē, all) comes before the plural noun समोसे (samōsē, samosas)."
    bases:
      "सारे": "all"
      "समोसे": "samosas"
      "रखूँ": "keep (should I)"
    confusables:
      "w1": { why: "Laddoo, not samosa: लड्डू (laḍḍū) means laddoo." }
      "w2": { why: "When, not where: कब (kab) means when." }
  "hi-2960":
    native: "First wash the apple well, then cut."
    notes:
      "n1": "पहले (pahlē, first) and फिर (phir, then) show the order of two polite instructions, each with a -इए (-iē) imperative."
    bases:
      "अच्छी": "well (with तरह (tarah))"
      "तरह": "way; manner"
      "धोइए": "wash (polite)"
      "काटिए": "cut (polite)"
    confusables:
      "w1": { why: "Later, not first: बाद में (bād mēm̐) means later." }
      "w2": { why: "Immediately, not then: तुरंत (turant) means immediately." }
  "hi-2961":
    native: "On Tuesday morning, give samosas for elder sister."
    notes:
      "n1": "को (kō) follows a day of the week: मंगलवार को (maṅgalvār kō, on Tuesday)."
    bases:
      "समोसे": "samosas"
      "दीजिए": "give (polite)"
      "लिए": "for"
    confusables:
      "w1": { why: "Friday, not Tuesday: शुक्रवार (śukravār) means Friday." }
      "w2": { why: "Brother, not elder sister: भैया (bhaiyā) means brother." }
  "hi-2962":
    native: "Buy grapes from the farmer."
    notes:
      "n1": "से (sē, from) marks the seller: किसान से (kisān sē, from the farmer)."
    bases:
      "ख़रीदिए": "buy (polite)"
    confusables:
      "w1": { why: "Shopkeeper, not farmer: दुकानदार (dukāndār) means shopkeeper." }
      "w2": { why: "To sell, not buy: बेचना (bēcnā) means to sell." }
  "hi-2963":
    native: "Open the small coconut properly."
    notes:
      "n1": "ठीक से (ṭhīk sē, properly) is a manner phrase, and खोलिए (khōliē) is the polite imperative of खोलना (khōlnā, to open)."
    bases:
      "खोलिए": "open (polite)"
    confusables:
      "w1": { why: "Big, not small: बड़ा (baṛā) means big." }
      "w2": { why: "Bottle, not coconut: बोतल (bōtal) means bottle." }
  "hi-2964":
    native: "Serve the honey slowly today."
    notes:
      "n1": "परोसिए (parōsiē) is the polite imperative of परोसना (parōsnā, to serve)."
    bases:
      "परोसिए": "serve (polite)"
    confusables:
      "w1": { why: "Quickly, not slowly: जल्दी (jaldī) means quickly." }
      "w2": { why: "To cook, not serve: पकाना (pakānā) means to cook." }
