cards:
  "hi-2940":
    native: "Please take this sour lemon."
    bases:
      "लीजिए": "take (polite)"
    confusables:
      "w1": { why: "Orange, not lemon: संतरा (santarā) means orange." }
      "w2": { why: "Banana, not lemon: केला (kēlā) means banana." }
  "hi-2941":
    native: "Who should bring the fresh salad?"
    bases:
      "लाए": "bring (should)"
    confusables:
      "w1": { why: "Where, not who: कहाँ (kahām̐) means where." }
      "w2": { why: "When, not who: कब (kab) means when." }
  "hi-2942":
    native: "The children are happy, so give pakoras."
    bases:
      "हैं": "are"
      "पकौड़े": "pakoras"
      "दीजिए": "give (polite)"
    confusables:
      "w1": { why: "Samosa, not pakora: समोसा (samōsā) is a samosa." }
      "w2": { why: "Sad, not happy: दुखी (dukhī) means sad." }
  "hi-2943":
    native: "Boil the corn again this morning."
    bases:
      "उबालिए": "boil (polite)"
    confusables:
      "w1": { why: "Evening, not morning: शाम (śām) means evening." }
      "w2": { why: "Tomorrow, not today: कल (kal) means tomorrow." }
  "hi-2944":
    native: "Which banana should I take?"
    bases:
      "लूँ": "take (should I)"
      "सा": "which (as in कौन-सा (kaun-sā))"
    confusables:
      "w1": { why: "Apple, not banana: सेब (sēb) means apple." }
      "w2": { why: "Who, not which: कौन (kaun) means who." }
  "hi-2945":
    native: "Tell elder sister the name of the sweet."
    bases:
      "बताइए": "tell (polite)"
    confusables:
      "w1": { why: "Brother, not elder sister: भैया (bhaiyā) means brother, said to a man of about your age." }
      "w2": { why: "Grandmother, not elder sister: दादी (dādī) means grandmother." }
  "hi-2946":
    native: "Cut the carrot properly, but keep the ginger."
    bases:
      "काटिए": "cut (polite)"
      "रखिए": "keep (polite)"
    confusables:
      "w1": { why: "Grape, not carrot: अंगूर (aṅgūr) means grape." }
      "w2": { why: "Mango, not ginger: आम (ām) means mango." }
  "hi-2947":
    native: "When you go to town, then buy fresh apples."
    bases:
      "जब": "when"
      "जाएँ": "go (should)"
      "तब": "then"
      "ताज़े": "fresh"
      "ख़रीदिए": "buy (polite)"
    confusables:
      "w1": { why: "To sell, not buy: बेचना (bēcnā) means to sell." }
      "w2": { why: "Home, not town: घर (ghar) means home." }
  "hi-2948":
    native: "Bring coconut for the chutney."
    bases:
      "लाइए": "bring (polite)"
      "लिए": "for"
    confusables:
      "w1": { why: "Lemon, not coconut: नींबू (nīmbū) means lemon." }
      "w2": { why: "To take, not bring: लेना (lēnā) means to take." }
  "hi-2949":
    native: "How should I cook the biryani?"
    bases:
      "पकाऊँ": "cook (should I)"
    confusables:
      "w1": { why: "Paratha, not biryani: पराठा (parāṭhā) means paratha." }
      "w2": { why: "How much, not how: कितना (kitnā) means how much." }
  "hi-2950":
    native: "On Monday evening, play with the children, then serve sweets."
    bases:
      "बच्चों": "children"
      "खेलिए": "play (polite)"
      "परोसिए": "serve (polite)"
    confusables:
      "w1": { why: "Saturday, not Monday: शनिवार (śanivār) means Saturday." }
      "w2": { why: "Friend, not children: दोस्त (dōst) means friend." }
  "hi-2951":
    native: "Please wash this banana well."
    bases:
      "अच्छी": "well (with तरह (tarah))"
      "तरह": "way; manner"
      "धोइए": "wash (polite)"
    confusables:
      "w1": { why: "Apple, not banana: सेब (sēb) means apple." }
      "w2": { why: "To cook, not wash: पकाना (pakānā) means to cook." }
  "hi-2952":
    native: "Please strain the coffee quickly."
    bases:
      "छानिए": "strain (polite)"
    confusables:
      "w1": { why: "Juice, not coffee: जूस (jūs) means juice." }
      "w2": { why: "Slowly, not quickly: धीरे (dhīrē) means slowly." }
  "hi-2953":
    native: "On Saturday, send jaggery, almonds and ginger to grandmother."
    bases:
      "भेजिए": "send (polite)"
    confusables:
      "w1": { why: "Tuesday, not Saturday: मंगलवार (maṅgalvār) means Tuesday." }
      "w2": { why: "Elder sister, not grandmother: दीदी (dīdī) means elder sister." }
  "hi-2954":
    native: "At what time should you sell the cake tomorrow?"
    bases:
      "कितने": "how many (here: at what)"
      "बेचें": "sell (should you)"
    confusables:
      "w1": { why: "Puri, not cake: पूरी (pūrī) means puri." }
      "w2": { why: "Today, not tomorrow: आज (āj) means today." }
  "hi-2955":
    native: "Add sugar to the yogurt."
    bases:
      "डालिए": "add (polite)"
    confusables:
      "w1": { why: "Salt, not sugar: नमक (namak) means salt." }
      "w2": { why: "Honey, not sugar: शहद (śahad) means honey." }
  "hi-2956":
    native: "This paratha is not cold."
    bases:
      "है": "is"
    confusables:
      "w1": { why: "Hot, not cold: गरम (garam) means hot." }
      "w2": { why: "Fresh, not cold: ताज़ा (tāzā) means fresh." }
  "hi-2957":
    native: "Leave the cake with brother quickly."
    bases:
      "छोड़िए": "leave (polite)"
    confusables:
      "w1": { why: "Elder sister, not brother: दीदी (dīdī) means elder sister." }
      "w2": { why: "Slowly, not quickly: धीरे (dhīrē) means slowly." }
  "hi-2958":
    native: "Cook the biryani slowly."
    bases:
      "पकाइए": "cook (polite)"
    confusables:
      "w1": { why: "Quickly, not slowly: जल्दी (jaldī) means quickly." }
      "w2": { why: "To boil, not cook: उबालना (ubālnā) means to boil." }
  "hi-2959":
    native: "Where should I keep all the samosas?"
    bases:
      "सारे": "all"
      "समोसे": "samosas"
      "रखूँ": "keep (should I)"
    confusables:
      "w1": { why: "Laddoo, not samosa: लड्डू (laḍḍū) means laddoo." }
      "w2": { why: "When, not where: कब (kab) means when." }
  "hi-2960":
    native: "First wash the apple well, then cut."
    bases:
      "अच्छी": "well (with तरह (tarah))"
      "तरह": "way; manner"
      "धोइए": "wash (polite)"
      "काटिए": "cut (polite)"
    confusables:
      "w1": { why: "Later, not first: बाद में (bād mēm̐) means later." }
      "w2": { why: "Immediately, not then: तुरंत (turant) means immediately." }
  "hi-2961":
    native: "On Tuesday morning, give samosas for elder sister."
    bases:
      "समोसे": "samosas"
      "दीजिए": "give (polite)"
      "लिए": "for"
    confusables:
      "w1": { why: "Friday, not Tuesday: शुक्रवार (śukravār) means Friday." }
      "w2": { why: "Brother, not elder sister: भैया (bhaiyā) means brother." }
  "hi-2962":
    native: "Buy grapes from the farmer."
    bases:
      "ख़रीदिए": "buy (polite)"
    confusables:
      "w1": { why: "Shopkeeper, not farmer: दुकानदार (dukāndār) means shopkeeper." }
      "w2": { why: "To sell, not buy: बेचना (bēcnā) means to sell." }
  "hi-2963":
    native: "Open the small coconut properly."
    bases:
      "खोलिए": "open (polite)"
    confusables:
      "w1": { why: "Big, not small: बड़ा (baṛā) means big." }
      "w2": { why: "Bottle, not coconut: बोतल (bōtal) means bottle." }
  "hi-2964":
    native: "Serve the honey slowly today."
    bases:
      "परोसिए": "serve (polite)"
    confusables:
      "w1": { why: "Quickly, not slowly: जल्दी (jaldī) means quickly." }
      "w2": { why: "To cook, not serve: पकाना (pakānā) means to cook." }
