schema: 1
id: "hi-en-food-sentences"
kind: "layer"
core: "hi-food-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences with food and drink"
license: "CC-BY-SA-4.0"
description: "Short sentences with the food words of this unit. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-1024":
    native: "Mother will make puri today."
    confusables:
      "f1": { why: "Masculine: बनाएगा (banāēgā) is said of a man, and a mother is a woman." }
      "w1": { why: "Eat, not make: खाएगी (khāēgī) means will eat." }
  "hi-1025":
    native: "We eat rice and dal in the evening."
    confusables:
      "f1": { why: "Singular: खाता (khātā) is said of one man, and we are more than one." }
      "w1": { why: "Drink, not eat: पीते (pītē) means drink." }
  "hi-1026":
    native: "The child drinks milk every day."
    confusables:
      "f1": { why: "Feminine: पीती (pītī) is said of a girl or a woman." }
      "w1": { why: "Eat, not drink: खाता (khātā) means eats." }
  "hi-1027":
    native: "Put salt and chilli in the vegetable."
    confusables:
      "w1": { why: "Boil, not put in: उबालो (ubālō) means boil." }
      "w2": { why: "Serve, not put in: परोसो (parōsō) means serve." }
  "hi-1028":
    native: "First put in the sugar, then strain the tea."
    confusables:
      "f1": { why: "Polite: छानिए (chāniē) is said to an elder or a guest, not to a child." }
      "w1": { why: "Drink, not strain: पीओ (pīō) means drink." }
  "hi-1029":
    native: "I am hungry, please give me food."
    confusables:
      "f1": { why: "Masculine: लगा (lagā) is said of a man who feels hungry." }
      "w1": { why: "Thirst, not hunger: प्यास (pyās) means thirst." }
  "hi-1030":
    native: "This mango is very sweet."
    confusables:
      "f1": { why: "Feminine: मीठी (mīṭhī) goes with a feminine noun, such as चाय (cāy)." }
      "w1": { why: "Sour, not sweet: खट्टा (khaṭṭā) means sour." }
  "hi-1031":
    native: "I want cold juice."
    confusables:
      "f1": { why: "Feminine: ठंडी (ṭhaṇḍī) would go with a feminine noun, such as चाय (cāy)." }
      "w1": { why: "Hot, not cold: गरम (garam) means hot." }
  "hi-1032":
    native: "Mother makes peas with paneer."
    confusables:
      "f1": { why: "Masculine: बनाता (banātā) is said of a man." }
      "w1": { why: "Eat, not make: खाती (khātī) means eats." }
  "hi-1033":
    native: "I want a cup of coffee."
    confusables:
      "f1": { why: "Plural: चाहिएँ (cāhiēm̐) would go with several cups." }
      "w1": { why: "Tea, not coffee: चाय (cāy) means tea." }
