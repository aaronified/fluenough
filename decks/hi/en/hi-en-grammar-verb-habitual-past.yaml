id: "hi-en-grammar-verb-habitual-past"
kind: "layer"
core: "hi-grammar-verb-habitual-past"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs: the habitual past"
description: "Every verb the course teaches, in the habitual past (used to), for a man or a woman and for one or many. The forms are written in Devanagari for now. Not yet checked by a Hindustani speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "m-sg": "in the habitual past, masculine singular (he, or I or you as a man)"
    "f-sg": "in the habitual past, feminine singular (she, or I or you as a woman)"
    "m-pl": "in the habitual past, masculine plural (they, we, you respectful, men or a mixed group)"
    "f-pl": "in the habitual past, feminine plural (women)"
rules:
  "hi-rule-habitual-past-masc":
    name: "-ता था, -ते थे (-tā thā, -tē thē): used to, masculine"
    explanation: "For a man the stem takes the habit ending and the past of to be: {1} for one, {2} for many. {3}, to do, gives {4} and {5}; {6}, to go, gives {7}."
  "hi-rule-habitual-past-fem":
    name: "-ती थी, -ती थीं (-tī thī, -tī thīm̐): used to, feminine"
    explanation: "For a woman the stem takes {1} for one and {2} for many; only the word for was changes. {3}, to do, gives {4} and {5}; {6}, to go, gives {7}."
