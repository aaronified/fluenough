schema: 1
id: "hi-en-feelings"
kind: "layer"
core: "hi-feelings"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Feelings"
license: "CC-BY-SA-4.0"
description: "What people feel: anger, worry, hope and pride, the moods of a day, and the words for showing them. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "hi-2105":
    native: "anger"
    notes:
      "n1": "A strong feeling of being angry. The verb is गुस्सा करना (gussā karnā), to get angry."
    examples:
      "उसे बहुत गुस्सा आया।": { "native": "He got very angry.", "bases": {} }
      "गुस्से में मत बोलो।": { "native": "Do not speak in anger.", "bases": {"गुस्से": "anger", "मत": "do not"} }
  "hi-2106":
    native: "worry; concern"
    notes:
      "n1": "A feeling of being worried about something that may happen."
    examples:
      "तुम्हारी चिंता मत करो।": { "native": "Do not worry about yourself.", "bases": {"मत": "do not"} }
      "माँ की चिंता बढ़ गई।": { "native": "Mother's worry grew.", "bases": {"बढ़": "to grow"} }
  "hi-2107":
    native: "stress; tension"
    notes:
      "n1": "A state of being under pressure, or of strain between people."
    examples:
      "काम का तनाव बहुत है।": { "native": "There is a lot of work stress.", "bases": {} }
      "तनाव से सिरदर्द होता है।": { "native": "Stress causes a headache.", "bases": {} }
  "hi-2108":
    native: "jealousy; envy"
    notes:
      "n1": "The unhappy wish to have what another person has."
    examples:
      "उसके मन में ईर्ष्या है।": { "native": "There is jealousy in his mind.", "bases": {} }
      "ईर्ष्या बुरी चीज़ है।": { "native": "Jealousy is a bad thing.", "bases": {} }
  "hi-2109":
    native: "enthusiasm; eagerness"
    notes:
      "n1": "A lively interest and energy for doing something."
    examples:
      "बच्चों में बड़ा उत्साह है।": { "native": "The children are full of enthusiasm.", "bases": {} }
      "उत्साह के साथ काम करो।": { "native": "Work with enthusiasm.", "bases": {} }
  "hi-2110":
    native: "hope"
    notes:
      "n1": "The feeling that something good may happen."
    examples:
      "मुझे आशा है।": { "native": "I have hope.", "bases": {} }
      "आशा मत छोड़ो।": { "native": "Do not give up hope.", "bases": {"मत": "do not"} }
  "hi-2111":
    native: "peace; rest of mind"
    notes:
      "n1": "A calm and comfortable state of mind, with no worry."
    examples:
      "यहाँ आकर सुकून मिलता है।": { "native": "Coming here brings peace.", "bases": {} }
      "दिल को सुकून चाहिए।": { "native": "The heart needs peace.", "bases": {} }
  "hi-2112":
    native: "relief"
    notes:
      "n1": "The feeling when a worry or a pain goes away."
    examples:
      "दवा से राहत मिली।": { "native": "The medicine brought relief.", "bases": {} }
      "यह खबर सुनकर राहत हुई।": { "native": "I felt relief on hearing this news.", "bases": {"खबर": "news"} }
  "hi-2113":
    native: "feeling; emotion"
    notes:
      "n1": "A feeling that is strong and deep, such as love or grief."
    examples:
      "उसकी भावनाएँ सच्ची हैं।": { "native": "His feelings are true.", "bases": {"भावनाएँ": "feeling"} }
      "भावना में बहकर मत बोलो।": { "native": "Do not speak carried away by emotion.", "bases": {"मत": "do not"} }
  "hi-2114":
    native: "emotions; sentiments"
    notes:
      "n1": "The strong feelings that a person has, especially shown in words."
    examples:
      "उसके जज़्बात समझो।": { "native": "Understand his feelings.", "bases": {} }
      "दोस्त के जज़्बात की कद्र करो।": { "native": "Respect a friend's feelings.", "bases": {"कद्र": "respect"} }
  "hi-2115":
    native: "peace; calm"
    notes:
      "n1": "The state of being calm and without fighting or noise."
    examples:
      "मंदिर में शांति है।": { "native": "There is peace in the temple.", "bases": {} }
      "मन की शांति सबसे ज़रूरी है।": { "native": "Peace of mind is the most necessary.", "bases": {"सबसे": "most", "ज़रूरी": "necessary"} }
  "hi-2116":
    native: "trust; confidence"
    notes:
      "n1": "Belief that a person is honest, or that something will work."
    examples:
      "मुझे उस पर भरोसा है।": { "native": "I trust him.", "bases": {} }
      "भरोसा रखो, सब ठीक होगा।": { "native": "Have faith, all will be well.", "bases": {} }
  "hi-2117":
    native: "pride"
    notes:
      "n1": "A feeling of pleasure in what oneself or others have done."
    examples:
      "बेटे पर माँ को गर्व है।": { "native": "The mother is proud of her son.", "bases": {} }
      "अपने काम पर गर्व करो।": { "native": "Be proud of your work.", "bases": {"गर्व": "pride"} }
  "hi-2118":
    native: "kindness; pity"
    notes:
      "n1": "A kind feeling towards someone who is in trouble."
    examples:
      "उसने मुझ पर दया की।": { "native": "He showed me kindness.", "bases": {"दया": "kindness"} }
      "गरीबों पर दया करो।": { "native": "Be kind to the poor.", "bases": {"गरीबों": "poor", "दया": "kindness"} }
  "hi-2119":
    native: "laughter"
    notes:
      "n1": "The sound of laughing, or a laugh."
    examples:
      "उसकी हँसी सुनो।": { "native": "Listen to her laughter.", "bases": {} }
      "सबकी हँसी छूट गई।": { "native": "Everyone burst out laughing.", "bases": {} }
  "hi-2120":
    native: "smile"
    notes:
      "n1": "A smile on the face, shown in pleasure or kindness."
    examples:
      "उसके चेहरे पर मुस्कान है।": { "native": "There is a smile on her face.", "bases": {} }
      "उसने मुस्कान से स्वागत किया।": { "native": "He welcomed us with a smile.", "bases": {"स्वागत": "welcome"} }
  "hi-2121":
    native: "surprise; amazement"
    notes:
      "n1": "A feeling of surprise at something unexpected."
    examples:
      "उसकी हैरानी देखने लायक थी।": { "native": "His surprise was worth seeing.", "bases": {"लायक": "worth"} }
      "सबको हैरानी हुई।": { "native": "Everyone was surprised.", "bases": {} }
  "hi-2122":
    native: "regret; sorrow"
    notes:
      "n1": "The feeling of being sorry about something that has happened."
    examples:
      "मुझे अफ़सोस है।": { "native": "I am sorry.", "bases": {} }
      "इस बात का अफ़सोस है।": { "native": "I regret this matter.", "bases": {} }
  "hi-2123":
    native: "fear"
    notes:
      "n1": "The feeling that something bad may happen. The verb is डरना (ḍarnā)."
    examples:
      "उसके मन में डर है।": { "native": "There is fear in his mind.", "bases": {} }
      "डर मत।": { "native": "Do not be afraid.", "bases": {"मत": "do not"} }
  "hi-2124":
    native: "mind; heart; wish"
    notes:
      "n1": "The mind and the feelings, as the place where wishes and thoughts are."
    examples:
      "मेरा मन उदास है।": { "native": "My mind is sad.", "bases": {} }
      "तुम्हारा जो मन करे, करो।": { "native": "Do whatever you wish.", "bases": {"जो": "which"} }
  "hi-2125":
    native: "displeasure; resentment"
    notes:
      "n1": "A feeling of being annoyed or upset with someone."
    examples:
      "उसकी बात पर नाराज़गी है।": { "native": "There is displeasure at what he said.", "bases": {} }
      "नाराज़गी छोड़ो।": { "native": "Give up the resentment.", "bases": {} }
  "hi-2126":
    native: "disappointment; despair"
    notes:
      "n1": "The sad feeling that comes when hope fails."
    examples:
      "परीक्षा के नतीजे से निराशा हुई।": { "native": "The result of the exam was a disappointment.", "bases": {"नतीजे": "result"} }
      "निराशा मत करो।": { "native": "Do not despair.", "bases": {"मत": "do not"} }
  "hi-2127":
    native: "shame; embarrassment"
    notes:
      "n1": "The painful feeling of having done something wrong or foolish."
    examples:
      "उसे अपनी गलती पर शर्म आई।": { "native": "He felt ashamed of his mistake.", "bases": {"शर्म": "shame"} }
      "शर्म की बात है।": { "native": "It is a matter of shame.", "bases": {} }
  "hi-2128":
    native: "sad; gloomy"
    notes:
      "n1": "Unhappy and low in spirits. The opposite is खुश (khuś), happy."
    examples:
      "वह आज उदास लग रहा है।": { "native": "He looks sad today.", "bases": {"उदास": "sad"} }
      "उदास मत हो।": { "native": "Do not be sad.", "bases": {"मत": "do not"} }
  "hi-2129":
    native: "worried; troubled"
    notes:
      "n1": "Anxious and troubled about something."
    examples:
      "माँ मेरी वजह से परेशान हैं।": { "native": "Mother is worried because of me.", "bases": {"वजह": "reason"} }
      "इतना परेशान क्यों हो?": { "native": "Why are you so worried?", "bases": {"इतना": "so much"} }
  "hi-2130":
    native: "surprised; amazed"
    notes:
      "n1": "Filled with surprise, at something unexpected."
    examples:
      "मैं यह देखकर हैरान हूँ।": { "native": "I am amazed to see this.", "bases": {} }
      "सब हैरान रह गए।": { "native": "Everyone was amazed.", "bases": {} }
  "hi-2131":
    native: "ashamed; embarrassed"
    notes:
      "n1": "Feeling shame for having done something wrong."
    examples:
      "वह अपनी गलती से शर्मिंदा है।": { "native": "He is ashamed of his mistake.", "bases": {} }
      "मैं आपसे शर्मिंदा हूँ।": { "native": "I am ashamed before you.", "bases": {} }
  "hi-2132":
    native: "alone; lonely"
    notes:
      "n1": "By oneself, with no one else. Used of a person who feels lonely too."
    examples:
      "वह घर में अकेला है।": { "native": "He is alone at home.", "bases": {} }
      "अकेला महसूस मत करो।": { "native": "Do not feel lonely.", "bases": {"महसूस": "to feel", "मत": "do not"} }
  "hi-2133":
    native: "disappointed; hopeless"
    notes:
      "n1": "Having lost hope, or feeling let down."
    examples:
      "मैं परिणाम से निराश हूँ।": { "native": "I am disappointed with the result.", "bases": {"परिणाम": "result"} }
      "निराश मत हो, फिर कोशिश करो।": { "native": "Do not lose hope, try again.", "bases": {"मत": "do not", "कोशिश": "try"} }
  "hi-2134":
    native: "angry; upset"
    notes:
      "n1": "Annoyed or cross with someone."
    examples:
      "दादी मुझसे नाराज़ हैं।": { "native": "Grandmother is cross with me.", "bases": {} }
      "तुम क्यों नाराज़ हो?": { "native": "Why are you angry?", "bases": {} }
  "hi-2135":
    native: "happy; pleased"
    notes:
      "n1": "Pleased and glad, with a cheerful mind. It is a more formal word than खुश (khuś)."
    examples:
      "वह सबको देखकर प्रसन्न हुआ।": { "native": "He was pleased to see everyone.", "bases": {"प्रसन्न": "pleased"} }
      "आपसे मिलकर प्रसन्नता हुई।": { "native": "It was a pleasure to meet you.", "bases": {"प्रसन्नता": "pleasure; joy"} }
  "hi-2136":
    native: "worried; anxious"
    notes:
      "n1": "Anxious, with a mind full of worry."
    examples:
      "पिताजी चिंतित लग रहे हैं।": { "native": "Father seems worried.", "bases": {"पिताजी": "father", "चिंतित": "worried"} }
      "चिंतित न हो, सब ठीक है।": { "native": "Do not worry, all is well.", "bases": {"न": "not (in a command)"} }
  "hi-2137":
    native: "to panic; to be flustered"
    notes:
      "n1": "To lose calm and be afraid or in a hurry."
    examples:
      "बच्चा अँधेरे में घबराया।": { "native": "The child panicked in the dark.", "bases": {"अँधेरे": "darkness", "घबराया": "to panic"} }
      "घबराओ मत।": { "native": "Do not panic.", "bases": {"घबराओ": "to panic", "मत": "do not"} }
  "hi-2138":
    native: "to be irritated"
    notes:
      "n1": "To be cross and impatient at something small."
    examples:
      "वह हर बात पर झुंझलाता है।": { "native": "He gets irritated at every little thing.", "bases": {"हर": "every; each", "झुंझलाता": "to be irritated"} }
      "इतना मत झुंझलाओ।": { "native": "Do not be so irritated.", "bases": {"इतना": "so much", "मत": "do not", "झुंझलाओ": "to be irritated"} }
  "hi-2139":
    native: "to be annoyed; to get irritated"
    notes:
      "n1": "To be annoyed by someone or something that goes on."
    examples:
      "बच्चे रोज़ चिढ़ते हैं।": { "native": "The children get annoyed every day.", "bases": {"चिढ़ते": "to get annoyed"} }
      "उसे मत चिढ़ाओ।": { "native": "Do not annoy him.", "bases": {"मत": "do not", "चिढ़ाओ": "to tease"} }
  "hi-2140":
    native: "to feel shy; to blush"
    notes:
      "n1": "To be shy, and go red in the face when looked at."
    examples:
      "वह लोगों के सामने शर्माती है।": { "native": "She feels shy in front of people.", "bases": {"सामने": "before", "शर्माती": "to feel shy"} }
      "मत शर्माओ, बोलो।": { "native": "Do not be shy, speak.", "bases": {"मत": "do not", "शर्माओ": "to feel shy"} }
