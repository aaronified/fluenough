schema: 1
id: "hi-en-questions"
kind: "layer"
core: "hi-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Yes, no and questions"
license: "CC-BY-SA-4.0"
description: "Yes and no, the question words, and how a sentence becomes a question."
cards:
  "hi-0155":
    native: "yes"
    notes:
      "n1": "Said politely: जी हाँ (jī hām̐)."
  "hi-0156":
    native: "no; not"
    notes:
      "n1": "Also the 'not' of a sentence, just before the verb: मैं नहीं जानता (maim̐ nahīm̐ jāntā), I don't know."
    "examples": {
      "कोई नहीं जानता।": {"native": "Nobody knows.", "bases": {"जानता": "to know"}}
    }
  "hi-0157":
    native: "what; also marks a yes/no question"
    notes:
      "n1": "At the start of a sentence, क्या (kyā) turns it into a yes/no question: क्या आप हिंदी बोलते हैं (kyā āp hindī bōltē haim̐)? Do you speak Hindi? In speech the क्या (kyā) is often dropped and the voice rises instead."
    "examples": {
      "अब क्या?": {"native": "Now what?", "bases": {"अब": "now", "क्या": "what; also marks a yes/no question"}},
      "आपने क्या कहा?": {"native": "What did you say?", "bases": {"कहा": "to say"}}
    }
  "hi-0158":
    native: "who"
    "examples": {
      "वह कौन है?": {"native": "Who is that?", "bases": {"वह": "he; she"}}
    }
  "hi-0159":
    native: "where"
    "examples": {
      "एटीएम कहाँ है?": {"native": "Where is the ATM?", "bases": {"कहाँ": "where"}}
    }
  "hi-0160":
    native: "when"
    "examples": {
      "आप कब आएँगे?": {"native": "When will you come?", "bases": {"आएँगे": "to come"}}
    }
  "hi-0161":
    native: "why"
    "examples": {
      "इतना परेशान क्यों हो?": {"native": "Why are you so worried?", "bases": {"इतना": "so much", "क्यों": "why"}}
    }
  "hi-0162":
    native: "how"
    "examples": {
      "आप कैसे आए?": {"native": "How did you come?", "bases": {"आए": "to come"}},
      "आप कैसे हैं?": {"native": "How are you? (to a man)", "bases": {}}
    }
  "hi-0163":
    native: "how much; how many"
    notes:
      "n1": "Agrees with what is counted: कितनी (kitnī) with a feminine word, कितने (kitnē) with a plural. कितने लोग (kitnē lōg)? How many people?"
    "examples": {
      "कद कितना है?": {"native": "What is the height?", "bases": {"कितना": "how much; how many"}},
      "कितनी देर लगेगी?": {"native": "How long will it take?", "bases": {"देर": "delay; lateness", "लगेगी": "to take (time)", "कितनी": "how much; how many"}}
    }
  "hi-0164":
    native: "which"
    notes:
      "n1": "Agrees like an adjective: कौन-सी (kaun-sī) with a feminine word, कौन-से (kaun-sē) with a plural."
    bases:
      "सा": "which (as in कौन-सा (kaun-sā))"
  "hi-0165":
    native: "Is that OK?; OK?"
    notes:
      "n1": "As a reply without the question mark, ठीक है (ṭhīk hai) means 'OK, fine'."
    bases:
      "ठीक": "fine; all right"
  "hi-0166":
    native: "Really?"
    bases:
      "सच": "truth"
