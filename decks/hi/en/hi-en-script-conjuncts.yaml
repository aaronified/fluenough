schema: 1
id: "hi-en-script-conjuncts"
kind: "layer"
core: "hi-script-conjuncts"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hindi conjuncts"
license: "CC0-1.0"
description: "Two consonants with no vowel between them join: the first is usually written as a half letter, most without their upright stroke. Four join in their own shapes."
tags: ["unreviewed"]
cards:
  "hi-0083":
    native: "k + curled-back sh (ksh)"
    notes:
      "n1": "Its own shape, nothing like its parts: क्षमा (kśamā, forgiveness)."
  "hi-0084":
    native: "t + r (tr)"
    notes:
      "n1": "Its own shape, त (ta) joined with र (ra): मित्र (mitra, friend)."
  "hi-0085":
    native: "j + ny, said gy"
    notes:
      "n1": "Its own shape, said 'g' with a 'y' glide in Hindi: ज्ञान (gyān, knowledge)."
  "hi-0086":
    native: "sh + r (shr)"
    notes:
      "n1": "Its own shape: श्रम (śram, labour)."
  "hi-0087":
    native: "p + r (the r stroke)"
    notes:
      "n1": "A र (ra) after a consonant is a small slanting stroke at its foot: प्रेम (prēm, love)."
  "hi-0088":
    native: "curled-back t + r"
    notes:
      "n1": "After ट (ṭa) or ड (ḍa), र (ra) is written as a small caret below: ट्रेन (ṭrēn, train)."
  "hi-0089":
    native: "r + m (the reph)"
    notes:
      "n1": "A र (ra) before another consonant is a small hook above that consonant, the reph: धर्म (dharm, religion)."
  "hi-0090":
    native: "k + k (half क (ka))"
    notes:
      "n1": "The first क (ka) is written as a half letter, without its hook on the right, and joins the second: पक्का (pakkā, firm; certain). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "hi-0091":
    native: "ch + ch (half च (ca))"
    notes:
      "n1": "Half च (ca) joined to च (ca): बच्चा (baccā, child). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "hi-0092":
    native: "t + t (half त (ta))"
    notes:
      "n1": "Half त (ta) joined to त (ta): पत्ता (pattā, leaf). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "hi-0093":
    native: "s + t (half स (sa))"
    notes:
      "n1": "Half स (sa) joined to त (ta): नमस्ते (namastē, hello)."
  "hi-0094":
    native: "s + k (half स (sa))"
    notes:
      "n1": "Half स (sa) joined to क (ka): स्कूल (skūl, school)."
  "hi-0095":
    native: "n + d (half न (na))"
    notes:
      "n1": "Half न (na) joined to द (da): हिन्दी (hindī, Hindi). Often written with the anusvar instead: हिंदी (hindī)."
  "hi-0096":
    native: "d + dh"
    notes:
      "n1": "द (da) and ध (dha) joined, one above the other: शुद्ध (śuddh, pure). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "hi-0097":
    native: "l + l (half ल (la))"
    notes:
      "n1": "Half ल (la) joined to ल (la): उल्लू (ullū, owl). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "hi-0098":
    native: "p + y (half प (pa))"
    notes:
      "n1": "Half प (pa) joined to य (ya): प्यार (pyār, love)."
  "hi-0099":
    native: "k + y (half क (ka))"
    notes:
      "n1": "Half क (ka) joined to य (ya): क्या (kyā, what)."
