schema: 1
id: "hi-en-script-conjuncts"
kind: "layer"
core: "hi-script-conjuncts"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hindi conjuncts"
license: "CC-BY-SA-4.0"
description: "Two consonants with no vowel between them join: the first is usually written as a half letter, most without their upright stroke. Four join in their own shapes."
tags: ["unreviewed"]
cards:
  "hi-0083":
    native: "k + curled-back sh (ksh)"
    notes:
      "n1": "Its own shape, nothing like its parts: क्षमा (kśamā, forgiveness)."
    "examples": {
      "अक्षर सुंदर लिखो।": {"native": "Write neat letters.", "bases": {"अक्षर": "letter (of the alphabet)", "सुंदर": "beautiful", "लिखो": "to write"}},
      "कल परीक्षा है।": {"native": "The exam is tomorrow.", "bases": {"परीक्षा": "exam"}}
    }
  "hi-0084":
    native: "t + r (tr)"
    notes:
      "n1": "Its own shape, त (ta) joined with र (ra): मित्र (mitra, friend)."
    "examples": {
      "इस्त्री गरम है।": {"native": "The iron is hot.", "bases": {}},
      "छात्रावास साफ़ है।": {"native": "The hostel is clean.", "bases": {"छात्रावास": "hostel", "साफ़": "clean"}}
    }
  "hi-0085":
    native: "j + ny, said gy"
    notes:
      "n1": "Its own shape, said 'g' with a 'y' glide in Hindi: ज्ञान (gyān, knowledge)."
    "examples": {
      "अख़बार में विज्ञापन छपा।": {"native": "The advertisement was printed in the paper.", "bases": {}},
      "विज्ञान की किताब कहाँ है?": {"native": "Where is the science book?", "bases": {"विज्ञान": "science", "कहाँ": "where"}}
    }
  "hi-0086":
    native: "sh + r (shr)"
    notes:
      "n1": "Its own shape: श्रम (śram, labour)."
  "hi-0087":
    native: "p + r (the r stroke)"
    notes:
      "n1": "A र (ra) after a consonant is a small slanting stroke at its foot: प्रेम (prēm, love)."
    "examples": {
      "प्रकाशक से मिलो।": {"native": "Meet the publisher.", "bases": {}},
      "प्रकृति सुंदर है।": {"native": "Nature is beautiful.", "bases": {}}
    }
  "hi-0088":
    native: "curled-back t + r"
    notes:
      "n1": "After ट (ṭa) or ड (ḍa), र (ra) is written as a small caret below: ट्रेन (ṭrēn, train)."
    "examples": {
      "ट्रेलर देखो।": {"native": "Watch the trailer.", "bases": {}},
      "ट्रेन छूट गई।": {"native": "The train has been missed.", "bases": {}}
    }
  "hi-0089":
    native: "r + m (the reph)"
    notes:
      "n1": "A र (ra) before another consonant is a small hook above that consonant, the reph: धर्म (dharm, religion)."
    "examples": {
      "जुर्माना भरो।": {"native": "Pay the fine.", "bases": {}},
      "यूनिफ़ॉर्म पहनो।": {"native": "Wear the uniform.", "bases": {"यूनिफ़ॉर्म": "uniform", "पहनो": "to wear"}}
    }
  "hi-0090":
    native: "k + k (half क (ka))"
    notes:
      "n1": "The first क (ka) is written as a half letter, without its hook on the right, and joins the second: पक्का (pakkā, firm; certain). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "उसे तरक्की मिली।": {"native": "He got a promotion.", "bases": {}}
    }
  "hi-0091":
    native: "ch + ch (half च (ca))"
    notes:
      "n1": "Half च (ca) joined to च (ca): बच्चा (baccā, child). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "नासमझ बच्चा": {"native": "A foolish child.", "bases": {}}
    }
  "hi-0092":
    native: "t + t (half त (ta))"
    notes:
      "n1": "Half त (ta) joined to त (ta): पत्ता (pattā, leaf). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "कुत्ता बड़ा है।": {"native": "The dog is big.", "bases": {}},
      "कुत्ता भौंकता है।": {"native": "The dog barks.", "bases": {"भौंकता": "bark"}}
    }
  "hi-0093":
    native: "s + t (half स (sa))"
    notes:
      "n1": "Half स (sa) joined to त (ta): नमस्ते (namastē, hello)."
    "examples": {
      "बस्ता भारी है।": {"native": "The school bag is heavy.", "bases": {"बस्ता": "school bag", "भारी": "heavy"}},
      "रेस्तराँ अच्छा है।": {"native": "The restaurant is good.", "bases": {}}
    }
  "hi-0094":
    native: "s + k (half स (sa))"
    notes:
      "n1": "Half स (sa) joined to क (ka): स्कूल (skūl, school)."
    "examples": {
      "बच्चा हँसकर मुस्कुराया।": {"native": "The child laughed and smiled.", "bases": {"मुस्कुराया": "to smile"}},
      "बिस्किट मीठा है।": {"native": "The biscuit is sweet.", "bases": {}}
    }
  "hi-0095":
    native: "n + d (half न (na))"
    notes:
      "n1": "Half न (na) joined to द (da): हिन्दी (hindī, Hindi). Often written with the anusvar instead: हिंदी (hindī)."
  "hi-0096":
    native: "d + dh"
    notes:
      "n1": "द (da) and ध (dha) joined, one above the other: शुद्ध (śuddh, pure). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "यह सिद्धांत सही है।": {"native": "This principle is right.", "bases": {}},
      "वह प्रसिद्ध नृत्यांगना है।": {"native": "She is a famous dancer.", "bases": {"प्रसिद्ध": "famous"}}
    }
  "hi-0097":
    native: "l + l (half ल (la))"
    notes:
      "n1": "Half ल (la) joined to ल (la): उल्लू (ullū, owl). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "बल्ला भारी है।": {"native": "The bat is heavy.", "bases": {"बल्ला": "bat", "भारी": "heavy"}},
      "बिल्ली छोटी है।": {"native": "The cat is small.", "bases": {}}
    }
  "hi-0098":
    native: "p + y (half प (pa))"
    notes:
      "n1": "Half प (pa) joined to य (ya): प्यार (pyār, love)."
    "examples": {
      "कंप्यूटर चालू है।": {"native": "The computer is on.", "bases": {}},
      "प्याला गरम है।": {"native": "The cup is hot.", "bases": {"प्याला": "cup (for tea)"}}
    }
  "hi-0099":
    native: "k + y (half क (ka))"
    notes:
      "n1": "Half क (ka) joined to य (ya): क्या (kyā, what)."
    "examples": {
      "यह क्या है?": {"native": "What is this?", "bases": {"यह": "this"}},
      "वाक्य पूरा करो।": {"native": "Complete the sentence.", "bases": {"वाक्य": "sentence (in grammar)", "करो": "to do"}}
    }
