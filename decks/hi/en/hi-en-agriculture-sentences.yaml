cards:
  "hi-5544":
    native: "Farmers sow wheat."
    bases:
      "किसान": "farmers"
      "की": "of"
      "करते": "do"
    confusables:
      "w1": { why: "Millet, not wheat: बाजरा (bājrā) means millet; pearl millet." }
      "w2": { why: "Sugarcane, not wheat: गन्ना (gannā) means sugarcane." }
  "hi-5545":
    native: "The ox pulls the plough."
    bases:
      "खींचता": "pulls"
    confusables:
      "w1": { why: "Tractor, not ox: ट्रैक्टर (ṭraikṭar) means tractor." }
      "w2": { why: "Sickle, not plough: दराँती (darām̐tī) means sickle." }
  "hi-5546":
    native: "Farmers farm with a tractor."
    bases:
      "किसान": "farmers"
      "करते": "do"
    confusables:
      "w1": { why: "Plough, not tractor: हल (hal) means plough." }
      "w2": { why: "Spade, not tractor: फावड़ा (phāvṛā) means spade." }
  "hi-5547":
    native: "Pour water for irrigation."
    bases:
      "के": "for"
      "लिए": "for"
      "पानी": "water"
      "डालिए": "pour (polite)"
    confusables:
      "w1": { why: "Manure; fertiliser, not irrigation: खाद (khād) means manure; fertiliser." }
      "w2": { why: "Harvest, not irrigation: कटाई (kaṭāī) means cutting; harvest." }
  "hi-5548":
    native: "Adding manure increases the yield."
    bases:
      "डालने": "putting"
      "बढ़ती": "increases"
    confusables:
      "w1": { why: "Grain, not yield: अनाज (anāj) means grain; cereal." }
      "w2": { why: "Sorghum, a crop, not yield: ज्वार (jvār) means sorghum; jowar." }
  "hi-5549":
    native: "Sugarcane and cotton are our main crops."
    bases:
      "हमारी": "our"
      "मुख्य": "main"
      "फ़सलें": "crops"
    confusables:
      "w1": { why: "Wheat, not sugarcane: गेहूँ (gēhūm̐) means wheat." }
      "w2": { why: "Mustard, not cotton: सरसों (sarsōm̐) means mustard." }
  "hi-5550":
    native: "In winter farmers grow mustard."
    bases:
      "किसान": "farmers"
      "सर्दी": "winter"
      "उगाते": "grow"
    confusables:
      "w1": { why: "Sorghum, not mustard: ज्वार (jvār) means sorghum; jowar." }
      "w2": { why: "Millet, not mustard: बाजरा (bājrā) means millet; pearl millet." }
  "hi-5551":
    native: "Before sowing, put manure in the field."
    bases:
      "खेत": "field"
      "डालिए": "put (polite)"
    confusables:
      "w1": { why: "Harvest, not sowing: कटाई (kaṭāī) means cutting; harvest." }
      "w2": { why: "Irrigation, not sowing: सिंचाई (siñcāī) means irrigation." }
  "hi-5552":
    native: "Animals work in the fields."
    bases:
      "खेत": "field"
      "काम": "work"
      "करते": "do"
    confusables:
      "w1": { why: "Ox; bull, not animal in general: बैल (bail) means ox; bull." }
      "w2": { why: "Plough, not animal: हल (hal) means plough." }
  "hi-5553":
    native: "Farmers cut sugarcane with a sickle."
    bases:
      "किसान": "farmers"
      "काटते": "cut"
    confusables:
      "w1": { why: "Spade, not sickle: फावड़ा (phāvṛā) means spade." }
      "w2": { why: "Plough, not sickle: हल (hal) means plough." }
  "hi-5554":
    native: "Grain sacks are not cheap."
    bases:
      "के": "of"
      "बोरे": "sacks"
      "सस्ते": "cheap"
    confusables:
      "w1": { why: "Cotton, not grain: कपास (kapās) means cotton." }
      "w2": { why: "Crop, not grain: फ़सल (fasal) means crop." }
  "hi-5555":
    native: "Since tractors came, farming has become easier."
    bases:
      "आने": "coming"
      "आसान": "easy"
      "हुई": "became"
    confusables:
      "w1": { why: "Sowing, not farming: बुवाई (buvāī) means sowing." }
      "w2": { why: "Harvest, not farming: कटाई (kaṭāī) means cutting; harvest." }
