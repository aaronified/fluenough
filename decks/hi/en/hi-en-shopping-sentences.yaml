description: "Short sentences that use the shopping words of this unit. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-3020":
    native: "I exchanged this shirt."
    bases:
      "मैंने": "I (past subject)"
      "बदली": "exchanged (feminine)"
    confusables:
      "w1": { why: "Jacket, not shirt: जैकेट (jaiket) means jacket." }
      "w2": { why: "Saree, not shirt: साड़ी (sāṛī) means saree." }
  "hi-3021":
    native: "Fresh vegetables were available wholesale at this shop."
    bases:
      "इस": "this (with a noun)"
      "ताज़ी": "fresh (feminine)"
      "मिली": "was available (feminine)"
    confusables:
      "w1": { why: "Retail, not wholesale: खुदरा (khudrā) means retail." }
      "w2": { why: "Fruit, not vegetable: फल (phal) means fruit." }
  "hi-3022":
    native: "Did you understand my calculation?"
    bases:
      "आपने": "you (past subject, respectful)"
      "समझा": "understood"
    confusables:
      "w1": { why: "Sum of money, not calculation: रकम (rakam) means a sum of money." }
      "w2": { why: "Counting, not calculation: गिनती (ginatī) means counting." }
  "hi-3023":
    native: "This card does not work."
    bases:
      "चलता": "works"
    confusables:
      "w1": { why: "Cash, not card: नक़द (naqad) means cash." }
      "w2": { why: "Mobile phone, not card: मोबाइल (mōbāil) means mobile phone." }
  "hi-3024":
    native: "Yesterday my mother told us the price of milk."
    bases:
      "ने": "marks the doer of a past verb"
      "हमें": "to us"
      "की": "of (with a feminine noun)"
      "बताई": "told"
    confusables:
      "w1": { why: "Discount, not price: छूट (chūṭ) means discount." }
      "w2": { why: "Receipt, not price: रसीद (rasīd) means receipt." }
  "hi-3025":
    native: "The customer returned home alone."
    bases:
      "लौटा": "returned"
    confusables:
      "w1": { why: "Shopkeeper, not customer: दुकानदार (dukāndār) means shopkeeper." }
      "w2": { why: "Farmer, not customer: किसान (kisān) means farmer." }
  "hi-3026":
    native: "How much did you buy this item for?"
    bases:
      "आपने": "you (past subject, respectful)"
      "कितने": "how much (with a feminine noun)"
      "ख़रीदी": "bought (feminine)"
    confusables:
      "w1": { why: "When, not how much: कब (kab) means when." }
      "w2": { why: "Where, not how much: कहाँ (kahām̐) means where." }
  "hi-3027":
    native: "The shopkeeper weighed the potatoes correctly."
    bases:
      "ने": "marks the doer of a past verb"
      "तौला": "weighed"
    confusables:
      "w1": { why: "Onion, not potato: प्याज़ (pyāz) means onion." }
      "w2": { why: "Tomato, not potato: टमाटर (ṭamāṭar) means tomato." }
  "hi-3028":
    native: "I asked the neighbour about the discount."
    bases:
      "मैंने": "I (past subject)"
      "पूछी": "asked"
    confusables:
      "w1": { why: "Receipt, not discount: रसीद (rasīd) means receipt." }
      "w2": { why: "Price, not discount: कीमत (kīmat) means price." }
  "hi-3029":
    native: "Yesterday morning we bought vegetables from the wholesale market."
    bases:
      "हमने": "we (past subject)"
      "ली": "took (feminine)"
    confusables:
      "w1": { why: "Market in general, not the wholesale one: बाज़ार (bāzār) is a market; मंडी (maṇḍī) is the wholesale one." }
      "w2": { why: "Handcart, not market: ठेला (ṭhēlā) means handcart." }
  "hi-3030":
    native: "He sold all the goods from morning till evening."
    bases:
      "उसने": "he or she (past subject)"
      "बेचा": "sold"
    confusables:
      "w1": { why: "To buy, not to sell: ख़रीदना (k͟harīdnā) means to buy." }
      "w2": { why: "Night, not evening: रात (rāt) means night; शाम (śām) is evening." }
  "hi-3031":
    native: "Did you pay cash or by card?"
    bases:
      "आपने": "you (past subject, respectful)"
      "दिया": "gave"
    confusables:
      "w1": { why: "Banknote, one kind of cash: नोट (nōṭ) means banknote." }
      "w2": { why: "Mobile phone, not card: मोबाइल (mōbāil) means mobile phone." }
  "hi-3032":
    native: "The neighbour sold two kilos of onions at the market today."
    bases:
      "ने": "marks the doer of a past verb"
      "बेचे": "sold (plural)"
    confusables:
      "w1": { why: "Apple, not onion: सेब (sēb) means apple." }
      "w2": { why: "Potato, not onion: आलू (ālū) means potato." }
  "hi-3033":
    native: "My younger sister asked the price at the wholesale market in the evening."
    bases:
      "मेरी": "my (feminine)"
      "छोटी": "small; younger (feminine)"
      "ने": "marks the doer of a past verb"
      "पूछा": "asked (masculine)"
    confusables:
      "w1": { why: "Market, not wholesale market: बाज़ार (bāzār) is a market; मंडी (maṇḍī) is the wholesale one." }
      "w2": { why: "Morning, not evening: सुबह (subah) means morning; शाम (śām) is evening." }
  "hi-3034":
    native: "The coin fell down from my hand."
    bases:
      "मेरे": "my (with a noun)"
      "गिरा": "fell"
    confusables:
      "w1": { why: "Banknote, not coin: नोट (nōṭ) means banknote." }
      "w2": { why: "Foot, not hand: पैर (pair) means foot." }
  "hi-3035":
    native: "I forgot my wallet. (said by a man)"
    bases:
      "भूला": "forgot (said by a man)"
    confusables:
      "w1": { why: "Coin, not wallet: सिक्का (sikkā) means coin." }
      "w2": { why: "Key, not wallet: चाबी (cābī) means key." }
  "hi-3036":
    native: "Do you need a receipt?"
    bases:
      "आपको": "to you (respectful)"
    confusables:
      "w1": { why: "Banknote, not receipt: नोट (nōṭ) means banknote." }
      "w2": { why: "Card, not receipt: कार्ड (kārḍ) means card." }
  "hi-3037":
    native: "The shopkeeper wrote the price of every item on the receipt."
    bases:
      "ने": "marks the doer of a past verb"
      "हर": "every"
      "की": "of (with a feminine noun)"
      "लिखी": "wrote (feminine)"
    confusables:
      "w1": { why: "Bill, not receipt: बिल (bil) means bill." }
      "w2": { why: "Measure, not price: नाप (nāp) means measure or size." }
  "hi-3038":
    native: "I put the goods in the bag."
    bases:
      "मैंने": "I (past subject)"
      "थैले": "bag"
      "रखा": "put"
    confusables:
      "w1": { why: "Wallet, not bag: बटुआ (baṭuā) means wallet." }
      "w2": { why: "Pocket, not bag: जेब (jēb) means pocket." }
  "hi-3039":
    native: "I bought milk in cash."
    bases:
      "मैंने": "I (past subject)"
      "ख़रीदा": "bought"
    confusables:
      "w1": { why: "Yoghurt, not milk: दही (dahī) means yoghurt." }
      "w2": { why: "Rice, not milk: चावल (cāval) means rice." }
