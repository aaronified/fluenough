cards:
  "hi-3020":
    native: "I bought milk in cash."
    bases:
      "मैंने": "I (past subject)"
      "ख़रीदा": "bought"
    confusables:
      "w1": { why: "Yoghurt, not milk: दही (dahī) means yoghurt." }
      "w2": { why: "Rice, not milk: चावल (cāval) means rice." }
  "hi-3021":
    native: "Do you pay cash or by card?"
    bases:
      "देते": "give"
      "हैं": "are"
    confusables:
      "w1": { why: "Banknote, one kind of cash: नोट (nōṭ) means banknote." }
      "w2": { why: "Mobile phone, not card: मोबाइल (mōbāil) means mobile phone." }
  "hi-3022":
    native: "I want to exchange this shirt. (said by a man)"
    bases:
      "चाहता": "want (said by a man)"
      "हूँ": "am"
    confusables:
      "w1": { why: "Jacket, not shirt: जैकेट (jaiket) means jacket." }
      "w2": { why: "Saree, not shirt: साड़ी (sāṛī) means saree." }
  "hi-3023":
    native: "The customer went home alone."
    bases:
      "लौटा": "returned"
    confusables:
      "w1": { why: "Shopkeeper, not customer: दुकानदार (dukāndār) means shopkeeper." }
      "w2": { why: "Farmer, not customer: किसान (kisān) means farmer." }
  "hi-3024":
    native: "We sell clothes wholesale."
    bases:
      "कपड़े": "clothes"
      "बेचते": "sell"
      "हैं": "are"
    confusables:
      "w1": { why: "Shoe, not clothes: जूता (jūtā) means shoe." }
      "w2": { why: "Jewellery, not clothes: गहना (gahnā) means jewellery." }
  "hi-3025":
    native: "I forgot my wallet. (said by a man)"
    bases:
      "भूल": "forget (stem of the compound)"
      "गया": "went (completes the verb)"
    confusables:
      "w1": { why: "Coin, not wallet: सिक्का (sikkā) means coin." }
      "w2": { why: "Key, not wallet: चाबी (cābī) means key." }
  "hi-3026":
    native: "The coin fell from my hand."
    bases:
      "मेरे": "my (with a noun)"
      "गिर": "fell (stem of the compound)"
      "गया": "went (completes the verb)"
    confusables:
      "w1": { why: "Banknote, not coin: नोट (nōṭ) means banknote." }
      "w2": { why: "Foot, not hand: पैर (pair) means foot." }
  "hi-3027":
    native: "She checks the rates at the shop."
    bases:
      "देखती": "checks, looks at"
      "है": "is"
    confusables:
      "w1": { why: "Goods, not rate: सामान (sāmān) means goods." }
      "w2": { why: "Coin, not rate: सिक्का (sikkā) means coin." }
  "hi-3028":
    native: "How much is this item?"
    bases:
      "कितने": "how much (with a feminine noun)"
      "की": "of (with a feminine noun)"
      "है": "is"
    confusables:
      "w1": { why: "When, not how much: कब (kab) means when." }
      "w2": { why: "Where, not how much: कहाँ (kahām̐) means where." }
  "hi-3029":
    native: "My mother told the price."
    bases:
      "ने": "marks the doer of a past verb"
      "बताई": "told"
    confusables:
      "w1": { why: "Discount, not price: छूट (chūṭ) means discount." }
      "w2": { why: "Receipt, not price: रसीद (rasīd) means receipt." }
  "hi-3030":
    native: "He sells goods from morning till evening."
    bases:
      "बेचता": "sells"
      "है": "is"
    confusables:
      "w1": { why: "To buy, not to sell: ख़रीदना (k͟harīdnā) means to buy." }
      "w2": { why: "Night, not evening: रात (rāt) means night; शाम is evening." }
  "hi-3031":
    native: "I asked the neighbour for a discount."
    bases:
      "मैंने": "I (past subject)"
      "पूछी": "asked"
    confusables:
      "w1": { why: "Receipt, not discount: रसीद (rasīd) means receipt." }
      "w2": { why: "Price, not discount: कीमत (kīmat) means price." }
  "hi-3032":
    native: "The customer took two kilos of potatoes today."
    bases:
      "ने": "marks the doer of a past verb"
      "लिए": "took"
    confusables:
      "w1": { why: "Apple, not potato: सेब (sēb) means apple." }
      "w2": { why: "Onion, not potato: प्याज़ (pyāz) means onion." }
  "hi-3033":
    native: "Do you follow my calculation?"
    bases:
      "समझते": "understand"
      "हैं": "are"
    confusables:
      "w1": { why: "Sum of money, not calculation: रकम (rakam) means a sum of money." }
      "w2": { why: "Counting, not calculation: गिनती (ginatī) means counting." }
  "hi-3034":
    native: "This card does not work."
    bases:
      "चलता": "works"
    confusables:
      "w1": { why: "Cash, not card: नक़द (naqad) means cash." }
      "w2": { why: "Mobile phone, not card: मोबाइल (mōbāil) means mobile phone." }
  "hi-3035":
    native: "The shopkeeper weighs potatoes correctly."
    bases:
      "तौलता": "weighs"
      "है": "is"
    confusables:
      "w1": { why: "Onion, not potato: प्याज़ (pyāz) means onion." }
      "w2": { why: "Tomato, not potato: टमाटर (ṭamāṭar) means tomato." }
  "hi-3036":
    native: "Fresh vegetables are available wholesale in this shop."
    bases:
      "इस": "this (with a noun)"
      "ताज़ी": "fresh (feminine)"
      "मिलती": "is available"
      "है": "is"
    confusables:
      "w1": { why: "Retail, not wholesale: खुदरा (khudrā) means retail." }
      "w2": { why: "Fruit, not vegetable: फल (phal) means fruit." }
  "hi-3037":
    native: "The shopkeeper writes the price of every item on the receipt."
    bases:
      "हर": "every"
      "की": "of (with a feminine noun)"
      "लिखता": "writes"
      "है": "is"
    confusables:
      "w1": { why: "Bill, not receipt: बिल (bil) means bill." }
      "w2": { why: "Measure, not price: नाप (nāp) means measure or size." }
  "hi-3038":
    native: "Yesterday morning we went to the wholesale vegetable market."
    bases:
      "की": "of (with a feminine noun)"
      "गए": "went"
    confusables:
      "w1": { why: "Market in general, not the wholesale one: बाज़ार (bāzār) is a market; मंडी is the wholesale one." }
      "w2": { why: "Handcart, not market: ठेला (ṭhēlā) means handcart." }
  "hi-3039":
    native: "I put the goods in the bag."
    bases:
      "मैंने": "I (past subject)"
      "थैले": "bag"
      "रखा": "put"
    confusables:
      "w1": { why: "Wallet, not bag: बटुआ (baṭuā) means wallet." }
      "w2": { why: "Pocket, not bag: जेब (jēb) means pocket." }
  "hi-3040":
    native: "The neighbour gives a discount every day."
    bases:
      "देता": "gives"
      "है": "is"
    confusables:
      "w1": { why: "Price, not discount: कीमत (kīmat) means price." }
      "w2": { why: "Saving, not discount: बचत (bacat) means saving." }
  "hi-3041":
    native: "My younger sister goes to the wholesale market in the evening."
    bases:
      "मेरी": "my (feminine)"
      "छोटी": "small; younger (feminine)"
      "जाती": "goes (feminine)"
      "है": "is"
    confusables:
      "w1": { why: "Market, not wholesale market: बाज़ार (bāzār) is a market; मंडी is the wholesale one." }
      "w2": { why: "Morning, not evening: सुबह (subah) means morning." }
  "hi-3042":
    native: "Do you need a receipt?"
    bases:
      "आपको": "to you (respectful)"
    confusables:
      "w1": { why: "Banknote, not receipt: नोट (nōṭ) means banknote." }
      "w2": { why: "Card, not receipt: कार्ड (kārḍ) means card." }
  "hi-3043":
    native: "I shop at the market every week. (said by a man)"
    bases:
      "हर": "every"
      "हफ़्ते": "week (every week)"
      "करता": "does"
      "हूँ": "am"
    confusables:
      "w1": { why: "Buyer, not shopping: ख़रीदार (k͟harīdār) means buyer; ख़रीदारी is shopping." }
      "w2": { why: "Shopkeeping, not shopping: दुकानदारी (dukāndārī) means shopkeeping." }
  "hi-3044":
    native: "Is this note genuine?"
    bases:
      "है": "is"
    confusables:
      "w1": { why: "Fake, not genuine: नकली (naklī) means fake." }
      "w2": { why: "Coin, not note: सिक्का (sikkā) means a coin." }
