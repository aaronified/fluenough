schema: 1
id: "hi-en-grammar-differences"
kind: "layer"
core: "hi-grammar-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How Hindi grammar differs from English"
license: "CC0-1.0"
description: "Before any theme: the verb last, words for in, from and on after the noun, of that agrees, a gender for every noun, three yous, no articles, and how Hindi says have, not and questions."
tags: ["unreviewed"]
cards:
  "hi-0116":
    native: "He reads a book."
    notes:
      "n1": "The verb comes last: subject, object, verb. Word for word, 'he book reading is'."
    bases:
      "वह": "he; she"
      "किताब": "book"
  "hi-0117":
    native: "in the shop"
    notes:
      "n1": "Hindi puts 'in' after the noun: में (mēm̐)."
  "hi-0118":
    native: "from Delhi"
    notes:
      "n1": "से (sē) is 'from', and also 'with' or 'by', after the noun."
    bases:
      "दिल्ली": "Delhi"
  "hi-0119":
    native: "on the table"
    notes:
      "n1": "पर (par) is 'on', after the noun."
  "hi-0120":
    native: "father's house"
    notes:
      "n1": "'Of' comes after the owner and agrees with the thing owned: का (kā) because घर (ghar) is masculine."
  "hi-0121":
    native: "mother's book"
    notes:
      "n1": "की (kī) because किताब (kitāb) is feminine; the owner's gender doesn't matter."
    bases:
      "किताब": "book"
  "hi-0122":
    native: "The boy goes."
    notes:
      "n1": "Every noun is masculine or feminine, and the verb agrees: जाता (jātā) for a boy."
    bases:
      "लड़का": "boy"
      "जाता": "to go"
  "hi-0123":
    native: "The girl goes."
    notes:
      "n1": "जाती (jātī) for a girl: the verb changes with the subject's gender."
    bases:
      "लड़की": "girl"
      "जाती": "to go"
  "hi-0124":
    native: "big window"
    notes:
      "n1": "Adjectives agree too: बड़ी (baṛī) because खिड़की (khiṛkī) is feminine; a big room is बड़ा कमरा (baṛā kamrā)."
    bases:
      "बड़ी": "big"
  "hi-0125":
    native: "You listen. (respectful)"
    notes:
      "n1": "Three words for 'you', each with its own verb form: आप (āp) for strangers and elders. The verb also shows who is spoken to: सुनते (suntē) to a man, सुनती (suntī) to a woman, and both are accepted here."
    bases:
      "सुनते": "to listen"
  "hi-0126":
    native: "You listen. (familiar)"
    notes:
      "n1": "तुम (tum) for friends and family."
    bases:
      "तुम": "you (familiar)"
      "सुनते": "to listen"
      "हो": "to be"
  "hi-0127":
    native: "You listen. (intimate)"
    notes:
      "n1": "तू (tū) only for the very close or a child. To anyone else it is rude."
    bases:
      "तू": "you (intimate)"
      "सुनता": "to listen"
  "hi-0128":
    native: "The house is big."
    notes:
      "n1": "No word for 'the': घर (ghar) is 'the house' or 'a house' as the sentence needs."
    bases:
      "बड़ा": "big"
  "hi-0129":
    native: "I have a book."
    notes:
      "n1": "No verb 'have': 'near me a book is'."
    bases:
      "मेरे": "my"
      "किताब": "book"
  "hi-0130":
    native: "He doesn't come."
    notes:
      "n1": "नहीं (nahīm̐) comes before the verb, and है (hai) is usually dropped."
    bases:
      "वह": "he; she"
      "आता": "to come; (of a language or skill) to be known"
  "hi-0131":
    native: "Will you come?"
    notes:
      "n1": "A yes-or-no question starts with क्या (kyā) and keeps the statement's word order."
    bases:
      "तुम": "you (familiar)"
      "आओगे": "to come"
