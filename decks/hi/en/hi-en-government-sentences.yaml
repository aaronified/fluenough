cards:
  "hi-5372":
    native: "The government made a new policy."
    bases:
      "ने": "(marks the doer)"
      "नई": "new (feminine)"
      "बनाई": "made"
    confusables:
      "w1": { why: "Official, not government: सरकारी (sarkārī) means official; government-run." }
      "w2": { why: "Rule, not policy: नियम (niyam) means rule; regulation." }
  "hi-5373":
    native: "Where is this government office?"
    bases:
      "दफ़्तर": "office"
    confusables:
      "w1": { why: "Department, not office: विभाग (vibhāg) means department." }
      "w2": { why: "Ministry, not office: मंत्रालय (mantrālay) means ministry." }
  "hi-5374":
    native: "Voters cast their votes."
    bases:
      "अपना": "own; their own"
      "वोट": "vote"
      "डालते": "cast"
    confusables:
      "w1": { why: "Voting, the process: मतदान (matdān) means voting; polling." }
      "w2": { why: "Citizen, not voter: नागरिक (nāgrik) means citizen." }
  "hi-5375":
    native: "Who is the head of the village council?"
    bases:
      "मुखिया": "head; village chief"
    confusables:
      "w1": { why: "Secretary, not head: सचिव (saciv) means secretary." }
      "w2": { why: "Officer, not head: अधिकारी (adhikārī) means officer; official." }
  "hi-5376":
    native: "You need permission."
    bases:
      "आपको": "you (polite, to you)"
    confusables:
      "w1": { why: "Right, not permission: अधिकार (adhikār) means right; power." }
      "w2": { why: "Certificate, not permission: प्रमाणपत्र (pramāṇpatr) means certificate." }
  "hi-5377":
    native: "Fill in the form for a driving licence."
    bases:
      "ड्राइविंग": "driving"
      "लिए": "for"
      "भरिए": "fill in (polite)"
    confusables:
      "w1": { why: "Application: आवेदन (āvēdan) means application." }
      "w2": { why: "Certificate, not licence: प्रमाणपत्र (pramāṇpatr) means certificate." }
  "hi-5378":
    native: "Every citizen has the right to vote."
    bases:
      "हर": "every"
      "वोट": "vote"
    confusables:
      "w1": { why: "Voter, not citizen: मतदाता (matdātā) means voter." }
      "w2": { why: "Permission, not right: अनुमति (anumti) means permission." }
  "hi-5379":
    native: "The session of parliament starts tomorrow."
    bases:
      "शुरू": "start"
      "होगा": "will"
    confusables:
      "w1": { why: "State assembly, not parliament: विधानसभा (vidhānsbhā) means state assembly." }
      "w2": { why: "Council, not parliament: परिषद (pariśad) means council." }
  "hi-5380":
    native: "The government raised the tax."
    bases:
      "ने": "(marks the doer)"
      "बढ़ाया": "raised"
    confusables:
      "w1": { why: "Commission, not tax: आयोग (āyōg) means commission." }
      "w2": { why: "Rule: नियम (niyam) means rule; regulation." }
  "hi-5381":
    native: "The army gave help in the village."
    bases:
      "ने": "(marks the doer)"
      "गाँव": "village"
      "की": "gave"
    confusables:
      "w1": { why: "Service, not help: सेवा (sēvā) means service." }
      "w2": { why: "Secretary, not army: सचिव (saciv) means secretary." }
  "hi-5382":
    native: "The rule applies equally to everyone."
    bases:
      "सबके": "for everyone (oblique)"
      "लिए": "for"
      "बराबर": "equal"
    confusables:
      "w1": { why: "Right: अधिकार (adhikār) means right; power." }
      "w2": { why: "Policy, not rule: नीति (nīti) means policy." }
  "hi-5383":
    native: "My secretary sent the file."
    bases:
      "मेरे": "my (oblique)"
      "ने": "(marks the doer)"
      "फ़ाइल": "file"
      "भेजी": "sent"
    confusables:
      "w1": { why: "Officer, not secretary: अधिकारी (adhikārī) means officer; official." }
      "w2": { why: "Department: विभाग (vibhāg) means department." }
