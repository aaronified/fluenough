schema: 1
id: "hi-en-abstract-words"
kind: "layer"
core: "hi-abstract-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Abstract words"
license: "CC-BY-SA-4.0"
description: "Words for ideas and qualities that cannot be touched: honesty and hope, meaning and purpose, chance and condition, and the traits of character. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "hi-2701":
    native: "honesty"
    notes:
      "n1": "The quality of being honest and true in word and deed."
    examples:
      "उसकी ईमानदारी सब जानते हैं।": { "native": "Everyone knows his honesty.", "bases": {} }
      "ईमानदारी सबसे बड़ा गुण है।": { "native": "Honesty is the greatest quality.", "bases": {"सबसे": "most"} }
  "hi-2702":
    native: "truth"
    notes:
      "n1": "What is true and real, as opposed to what is false."
    examples:
      "सत्य की जीत होती है।": { "native": "The truth wins.", "bases": {} }
      "सत्य कड़वा होता है।": { "native": "The truth is bitter.", "bases": {} }
  "hi-2703":
    native: "imagination"
    notes:
      "n1": "The power to form pictures in the mind, of things not seen."
    examples:
      "बच्चों की कल्पना बड़ी होती है।": { "native": "Children's imagination is big.", "bases": {} }
      "यह केवल कल्पना है।": { "native": "This is only imagination.", "bases": {"केवल": "only"} }
  "hi-2704":
    native: "hope; expectation"
    notes:
      "n1": "A wish that something good will happen, or an expectation of it."
    examples:
      "मुझे उससे उम्मीद है।": { "native": "I have hope from him.", "bases": {} }
      "उम्मीद मत छोड़ो।": { "native": "Do not give up hope.", "bases": {"मत": "do not"} }
  "hi-2705":
    native: "sorrow; pain; grief"
    notes:
      "n1": "A feeling of deep sadness, or a suffering of the body or the mind."
    examples:
      "उसके मन में बड़ा दुख है।": { "native": "There is great sorrow in his heart.", "bases": {} }
      "दुख के बाद सुख आता है।": { "native": "After sorrow comes joy.", "bases": {"बाद": "after", "सुख": "joy"} }
  "hi-2706":
    native: "contentment; satisfaction"
    notes:
      "n1": "The feeling of being pleased with what one has."
    examples:
      "मन को संतोष मिला।": { "native": "The mind found contentment.", "bases": {} }
      "संतोष सबसे बड़ा धन है।": { "native": "Contentment is the greatest wealth.", "bases": {"सबसे": "most"} }
  "hi-2707":
    native: "meaning; sense; wealth"
    notes:
      "n1": "What a word or a sentence means, or the money one earns."
    examples:
      "इस शब्द का अर्थ क्या है?": { "native": "What is the meaning of this word?", "bases": {} }
      "इस बात का कोई अर्थ नहीं है।": { "native": "This matter has no meaning.", "bases": {} }
  "hi-2708":
    native: "importance"
    notes:
      "n1": "The quality of being important, or how much a thing matters."
    examples:
      "शिक्षा का महत्व बहुत है।": { "native": "Education has great importance.", "bases": {"शिक्षा": "education", "महत्व": "importance"} }
      "इसका महत्व समझो।": { "native": "Understand its importance.", "bases": {"महत्व": "importance"} }
  "hi-2709":
    native: "purpose; aim; objective"
    notes:
      "n1": "The reason for which something is done, or the goal one has."
    examples:
      "हमारा उद्देश्य गाँव की भलाई है।": { "native": "Our aim is the good of the village.", "bases": {"भलाई": "welfare"} }
      "उद्देश्य के बिना काम मत करो।": { "native": "Do not work without a purpose.", "bases": {"बिना": "without", "मत": "do not"} }
  "hi-2710":
    native: "capacity; ability"
    notes:
      "n1": "The power or the skill to do something."
    examples:
      "उसकी सीखने की क्षमता अच्छी है।": { "native": "His ability to learn is good.", "bases": {"क्षमता": "capacity"} }
      "इस कमरे की क्षमता सौ लोग है।": { "native": "This room's capacity is a hundred people.", "bases": {"क्षमता": "capacity"} }
  "hi-2711":
    native: "influence; effect"
    notes:
      "n1": "The power that one thing has over another, or the effect that it has."
    examples:
      "उसका प्रभाव बहुत है।": { "native": "His influence is great.", "bases": {} }
      "दवा का प्रभाव जल्दी होता है।": { "native": "The medicine works quickly.", "bases": {} }
  "hi-2712":
    native: "reason; cause"
    notes:
      "n1": "Why something happened, or what made it happen."
    examples:
      "इसका कारण क्या है?": { "native": "What is the reason for this?", "bases": {} }
      "कारण बताओ।": { "native": "Give the reason.", "bases": {} }
  "hi-2713":
    native: "possibility; chance"
    notes:
      "n1": "The chance that something may happen."
    examples:
      "बारिश की संभावना है।": { "native": "There is a chance of rain.", "bases": {} }
      "सफलता की पूरी संभावना है।": { "native": "There is a full chance of success.", "bases": {"संभावना": "chance"} }
  "hi-2714":
    native: "opportunity; occasion"
    notes:
      "n1": "A good time or a chance to do something."
    examples:
      "यह अवसर मत गँवाओ।": { "native": "Do not lose this opportunity.", "bases": {"मत": "do not", "गँवाओ": "to lose"} }
      "शादी के अवसर पर सब आए।": { "native": "Everyone came on the occasion of the wedding.", "bases": {"अवसर": "occasion"} }
  "hi-2715":
    native: "convenience; facility"
    notes:
      "n1": "Something that makes a task easy or comfortable."
    examples:
      "यहाँ पानी की सुविधा है।": { "native": "Water is available here.", "bases": {} }
      "बस में सब सुविधाएँ हैं।": { "native": "The bus has all the facilities.", "bases": {"सुविधाएँ": "facility"} }
  "hi-2716":
    native: "problem"
    notes:
      "n1": "A matter that is difficult and needs to be solved."
    examples:
      "यह बड़ी समस्या है।": { "native": "This is a big problem.", "bases": {} }
      "समस्या का हल निकालो।": { "native": "Find a solution to the problem.", "bases": {"हल": "solution"} }
  "hi-2717":
    native: "principle; theory"
    notes:
      "n1": "A basic rule or belief that guides action, or a theory that explains something."
    examples:
      "मेरा सिद्धांत है कि सच बोलो।": { "native": "My principle is to speak the truth.", "bases": {"सच": "truth"} }
      "यह सिद्धांत सही है।": { "native": "This principle is right.", "bases": {} }
  "hi-2718":
    native: "quality; virtue"
    notes:
      "n1": "A good or a special quality that a person or a thing has."
    examples:
      "उसमें अच्छे गुण हैं।": { "native": "He has good qualities.", "bases": {"गुण": "quality"} }
      "हर चीज़ में गुण और दोष होते हैं।": { "native": "Everything has merits and faults.", "bases": {"हर": "every; each", "गुण": "quality"} }
  "hi-2719":
    native: "morality; ethics"
    notes:
      "n1": "The sense of what is right and wrong in conduct."
    examples:
      "नैतिकता सबके लिए ज़रूरी है।": { "native": "Morality is necessary for everyone.", "bases": {"लिए": "for", "ज़रूरी": "necessary"} }
      "व्यापार में नैतिकता रखो।": { "native": "Keep morality in business.", "bases": {} }
  "hi-2720":
    native: "religion; duty; righteousness"
    notes:
      "n1": "A faith and its practices, or the right duty that a person must do."
    examples:
      "हर धर्म का सम्मान करो।": { "native": "Respect every religion.", "bases": {"हर": "every; each"} }
      "अपना धर्म निभाओ।": { "native": "Do your duty.", "bases": {"निभाओ": "to carry out"} }
  "hi-2721":
    native: "identity; recognition"
    notes:
      "n1": "The fact of knowing who someone is, or the marks by which a thing is known."
    examples:
      "उसकी पहचान पत्र पर है।": { "native": "His identity is on the card.", "bases": {"पहचान": "identity", "पत्र": "card"} }
      "पहचान में नहीं आया।": { "native": "He could not be recognised.", "bases": {} }
  "hi-2722":
    native: "relation; connection"
    notes:
      "n1": "The way two people or things are connected, or the bond between them."
    examples:
      "दोनों देशों के बीच अच्छे संबंध हैं।": { "native": "There are good relations between the two countries.", "bases": {"दोनों": "both", "बीच": "between"} }
      "इस बात का उससे कोई संबंध नहीं।": { "native": "This matter has no connection with him.", "bases": {} }
  "hi-2723":
    native: "sight; vision; outlook"
    notes:
      "n1": "The power of seeing, or the way one looks at things."
    examples:
      "उसकी दृष्टि कमज़ोर है।": { "native": "His sight is weak.", "bases": {} }
      "दृष्टि साफ़ रखो।": { "native": "Keep your outlook clear.", "bases": {} }
  "hi-2724":
    native: "self-respect; pride"
    notes:
      "n1": "A feeling of one's own worth, which makes a person refuse to be humbled."
    examples:
      "उसमें स्वाभिमान है।": { "native": "He has self-respect.", "bases": {} }
      "स्वाभिमान मत छोड़ो।": { "native": "Do not give up your self-respect.", "bases": {"मत": "do not"} }
  "hi-2725":
    native: "ego; pride; arrogance"
    notes:
      "n1": "A too high opinion of oneself, which makes one unkind to others."
    examples:
      "अहंकार से बचो।": { "native": "Avoid arrogance.", "bases": {} }
      "उसका अहंकार बढ़ गया है।": { "native": "His arrogance has grown.", "bases": {"बढ़": "to grow"} }
  "hi-2726":
    native: "patience; endurance"
    notes:
      "n1": "Calm waiting, and the ability to bear trouble without anger."
    examples:
      "धैर्य रखो।": { "native": "Be patient.", "bases": {} }
      "धैर्य से काम लो।": { "native": "Work with patience.", "bases": {} }
  "hi-2727":
    native: "courage"
    notes:
      "n1": "The strength of mind to face danger or difficulty."
    examples:
      "उसने बड़ा साहस दिखाया।": { "native": "He showed great courage.", "bases": {} }
      "साहस से सामना करो।": { "native": "Face it with courage.", "bases": {"सामना": "facing"} }
  "hi-2728":
    native: "anger; rage"
    notes:
      "n1": "A strong feeling of anger, often hard to control."
    examples:
      "क्रोध में मत बोलो।": { "native": "Do not speak in anger.", "bases": {"मत": "do not"} }
      "क्रोध बुरी चीज़ है।": { "native": "Anger is a bad thing.", "bases": {} }
  "hi-2729":
    native: "greed"
    notes:
      "n1": "A strong wish to have more than one needs, or more than is right."
    examples:
      "लोभ मत करो।": { "native": "Do not be greedy.", "bases": {"मत": "do not"} }
      "लोभ से सब खो जाता है।": { "native": "By greed everything is lost.", "bases": {} }
  "hi-2730":
    native: "laziness"
    notes:
      "n1": "A dislike of work or effort, which keeps one from doing what one should."
    examples:
      "आलस्य छोड़ो।": { "native": "Give up laziness.", "bases": {} }
      "आलस्य से काम नहीं होता।": { "native": "Work does not get done by laziness.", "bases": {} }
  "hi-2731":
    native: "nature; temperament"
    notes:
      "n1": "The way a person usually behaves, their character."
    examples:
      "उसका स्वभाव अच्छा है।": { "native": "His nature is good.", "bases": {} }
      "स्वभाव बदलना मुश्किल है।": { "native": "It is hard to change one's nature.", "bases": {} }
  "hi-2732":
    native: "nature; the natural world"
    notes:
      "n1": "The natural world, or the basic character of a thing."
    examples:
      "प्रकृति सुंदर है।": { "native": "Nature is beautiful.", "bases": {} }
      "प्रकृति की रक्षा करो।": { "native": "Protect nature.", "bases": {"रक्षा": "protection"} }
  "hi-2733":
    native: "form; shape; beauty"
    notes:
      "n1": "The look or the shape of a thing, or its beauty."
    examples:
      "इस रूप में मत आओ।": { "native": "Do not come in this form.", "bases": {"रूप": "form", "मत": "do not"} }
      "उसका रूप सुंदर है।": { "native": "Her beauty is lovely.", "bases": {"रूप": "beauty"} }
  "hi-2734":
    native: "essence; summary"
    notes:
      "n1": "The main point of a thing, its essence or its summary."
    examples:
      "कहानी का सार बताओ।": { "native": "Tell the summary of the story.", "bases": {"कहानी": "story"} }
      "बात का सार यह है।": { "native": "The essence of the matter is this.", "bases": {"सार": "essence"} }
  "hi-2735":
    native: "situation; condition"
    notes:
      "n1": "The state in which a person or a thing is at a time."
    examples:
      "अभी स्थिति ठीक है।": { "native": "The situation is fine now.", "bases": {} }
      "मरीज़ की स्थिति गंभीर है।": { "native": "The patient's condition is serious.", "bases": {"गंभीर": "serious"} }
  "hi-2736":
    native: "circumstance; situation"
    notes:
      "n1": "The conditions around a person that affect what they can do."
    examples:
      "ऐसी परिस्थिति में क्या करें?": { "native": "In such a situation, what should we do?", "bases": {"ऐसी": "such", "परिस्थिति": "situation"} }
      "परिस्थिति बदल गई।": { "native": "The circumstances changed.", "bases": {} }
