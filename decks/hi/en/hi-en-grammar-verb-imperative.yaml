name: "Verbs: commands, for three ways of saying you"
description: "Every verb the course teaches, as a command to the very close you, the familiar you and the respectful you, and as a command not to. The forms are written in Devanagari for now. Not yet checked by a Hindustani speaker: please report any mistake."
