cards:
  "hi-5060":
    native: "I'd like a tea."
    confusables:
      "w1": { why: "Water, not tea: पानी (pānī) means water." }
      "w2": { why: "Flatbread, not tea: रोटी (rōṭī) means flatbread." }
  "hi-5061":
    native: "This food is very spicy."
    confusables:
      "w1": { why: "Sweet, not spicy: मीठा (mīṭhā) means sweet." }
      "w2": { why: "Cold, not spicy: ठंडा (ṭhaṇḍā) means cold." }
  "hi-5062":
    native: "Would you like something sweet?"
    confusables:
      "w1": { why: "Spicy, not sweet: तीखा (tīkhā) means spicy." }
      "w2": { why: "Vegetarian, not sweet: शाकाहारी (śākāhārī) means vegetarian." }
  "hi-5063":
    native: "We need two rotis and water."
    confusables:
      "w1": { why: "One, not two: एक (ēk) means one." }
      "w2": { why: "Tea, not water: चाय (cāy) means tea." }
  "hi-5064":
    native: "Bring the bill; the food was very good."
    confusables:
      "w1": { why: "Bad, not good: बुरा (burā) means bad." }
      "w2": { why: "New, not good: नया (nayā) means new." }
  "hi-5065":
    native: "I don't like sweets."
    confusables:
      "w1": { why: "Cold, not sweet: ठंडा (ṭhaṇḍā) means cold." }
      "w2": { why: "Hot, not sweet: गरम (garam) means hot." }
  "hi-5066":
    native: "Is vegetarian food available here?"
    confusables:
      "w1": { why: "Sweet, not vegetarian: मीठा (mīṭhā) means sweet." }
      "w2": { why: "Spicy, not vegetarian: तीखा (tīkhā) means spicy." }
  "hi-5067":
    native: "I don't want sugar in the tea."
    confusables:
      "w1": { why: "Sweet, not sugar: मीठा (mīṭhā) means sweet." }
      "w2": { why: "Spicy, not sugar: तीखा (tīkhā) means spicy." }
  "hi-5068":
    native: "Take some hot roti."
    confusables:
      "w1": { why: "Cold, not hot: ठंडा (ṭhaṇḍā) means cold." }
      "w2": { why: "Sweet, not hot: मीठा (mīṭhā) means sweet." }
  "hi-5069":
    native: "Please don't eat anything too spicy."
    confusables:
      "w1": { why: "Hot, not spicy: गरम (garam) means hot." }
      "w2": { why: "Vegetarian, not spicy: शाकाहारी (śākāhārī) means vegetarian." }
  "hi-5070":
    native: "Have tea after the sweets."
    confusables:
      "w1": { why: "Water, not tea: पानी (pānī) means water." }
      "w2": { why: "Flatbread, not tea: रोटी (rōṭī) means flatbread." }
  "hi-5071":
    native: "Give some more water."
    confusables:
      "w1": { why: "Very, not more: बहुत (bahut) means very; a lot of." }
      "w2": { why: "Something, not more: कुछ (kuch) means something; some." }
