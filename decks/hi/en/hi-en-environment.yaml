schema: 1
id: "hi-en-environment"
kind: "layer"
core: "hi-environment"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Environment"
license: "CC-BY-SA-4.0"
description: "The environment and the living world: pollution and waste, animals and birds, forests and water, and what people do to protect them. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "hi-2368":
    native: "environment"
    notes:
      "n1": "The air, water, land and living things around us. The adjective is पर्यावरणीय (paryāvrṇīy)."
    examples:
      "पर्यावरण की रक्षा करो।": { "native": "Protect the environment.", "bases": {"रक्षा": "protection"} }
      "हमारा पर्यावरण साफ़ होना चाहिए।": { "native": "Our environment should be clean.", "bases": {} }
  "hi-2369":
    native: "pollution"
    notes:
      "n1": "Dirt and harmful matter put into the air, water or land."
    examples:
      "शहर में वायु प्रदूषण बढ़ रहा है।": { "native": "Air pollution is rising in the city.", "bases": {"वायु": "air", "बढ़": "to rise"} }
      "प्रदूषण कम करो।": { "native": "Reduce pollution.", "bases": {} }
  "hi-2370":
    native: "rubbish; waste"
    notes:
      "n1": "Dirt and trash that is thrown away. It is the everyday word beside कचरा (kacrā)."
    examples:
      "सड़क पर कूड़ा पड़ा है।": { "native": "There is rubbish lying on the road.", "bases": {} }
      "कूड़ा अलग रखो।": { "native": "Keep the rubbish separate.", "bases": {} }
  "hi-2371":
    native: "cutting; harvest"
    notes:
      "n1": "The cutting of trees, crops or grass, or the time of harvest."
    examples:
      "पेड़ों की कटाई मत करो।": { "native": "Do not cut down the trees.", "bases": {"मत": "do not"} }
      "फ़सल की कटाई अप्रैल में होती है।": { "native": "The harvest of the crop is in April.", "bases": {"फ़सल": "crop"} }
  "hi-2372":
    native: "animal"
    notes:
      "n1": "A living creature that is not a human being, as a dog or a deer."
    examples:
      "जंगल में कई जानवर रहते हैं।": { "native": "Many animals live in the forest.", "bases": {"कई": "several"} }
      "जानवरों से प्यार करो।": { "native": "Love animals.", "bases": {"जानवरों": "animal"} }
  "hi-2373":
    native: "bird"
    notes:
      "n1": "A creature with feathers and wings. चिड़िया (ciṛiyā) is a small bird."
    examples:
      "आसमान में कई पक्षी उड़ रहे हैं।": { "native": "Many birds are flying in the sky.", "bases": {"कई": "several"} }
      "पक्षियों को दाना डालो।": { "native": "Put grain out for the birds.", "bases": {"पक्षियों": "bird", "दाना": "grain"} }
  "hi-2374":
    native: "diversity; variety"
    notes:
      "n1": "The presence of many different kinds of things in one place."
    examples:
      "भारत में भाषाओं की विविधता है।": { "native": "India has a diversity of languages.", "bases": {"भारत": "India", "विविधता": "diversity"} }
      "जैव विविधता बचाओ।": { "native": "Save biodiversity.", "bases": {"जैव": "bio", "विविधता": "diversity"} }
  "hi-2375":
    native: "wild; of the forest"
    notes:
      "n1": "Living in the wild, or of forest and wild animals. The noun is वन्य जीव (vany jīv)."
    examples:
      "वन्य जीव सुरक्षित रखो।": { "native": "Keep the wildlife safe.", "bases": {} }
      "यह वन्य क्षेत्र है।": { "native": "This is a wildlife area.", "bases": {} }
  "hi-2376":
    native: "living being; creature"
    notes:
      "n1": "A living thing, plant or animal."
    examples:
      "हर जीव का जीवन कीमती है।": { "native": "Every living being's life is precious.", "bases": {"हर": "every; each", "जीव": "living being", "जीवन": "life"} }
      "जीवों को मत सताओ।": { "native": "Do not trouble living creatures.", "bases": {"जीवों": "living beings", "मत": "do not", "सताओ": "to trouble"} }
  "hi-2377":
    native: "conservation; protection"
    notes:
      "n1": "Keeping something safe from harm or from being lost."
    examples:
      "जंगलों का संरक्षण ज़रूरी है।": { "native": "The conservation of forests is necessary.", "bases": {"संरक्षण": "conservation", "ज़रूरी": "necessary"} }
      "पानी का संरक्षण करो।": { "native": "Conserve water.", "bases": {} }
  "hi-2378":
    native: "wind; breeze"
    notes:
      "n1": "A gentle wind, as the wind that blows over a field."
    examples:
      "ठंडी पवन चल रही है।": { "native": "A cool breeze is blowing.", "bases": {} }
      "पवन ऊर्जा से बिजली बनती है।": { "native": "Electricity is made from wind energy.", "bases": {} }
  "hi-2379":
    native: "barren; infertile"
    notes:
      "n1": "Land where nothing grows, or where crops cannot be raised."
    examples:
      "यह ज़मीन बंजर है।": { "native": "This land is barren.", "bases": {"ज़मीन": "land"} }
      "बंजर धरती पर पेड़ उगाओ।": { "native": "Grow trees on barren land.", "bases": {} }
  "hi-2380":
    native: "global; world-wide"
    notes:
      "n1": "Of the whole world. It is used in ग्लोबल वार्मिंग (glōbal vārmiṅg), global warming."
    examples:
      "यह ग्लोबल समस्या है।": { "native": "This is a global problem.", "bases": {"समस्या": "problem"} }
      "ग्लोबल तापमान बढ़ रहा है।": { "native": "Global temperature is rising.", "bases": {"बढ़": "to rise"} }
  "hi-2381":
    native: "ozone"
    notes:
      "n1": "A gas high in the air that shields the earth from the sun's harmful rays."
    examples:
      "ओज़ोन परत को नुकसान हुआ है।": { "native": "The ozone layer has been harmed.", "bases": {"परत": "layer", "नुकसान": "harm"} }
      "ओज़ोन की रक्षा करो।": { "native": "Protect the ozone.", "bases": {"रक्षा": "protection"} }
  "hi-2382":
    native: "recycling"
    notes:
      "n1": "Using old materials again, to make new things."
    examples:
      "प्लास्टिक का पुनर्चक्रण करो।": { "native": "Recycle the plastic.", "bases": {} }
      "पुनर्चक्रण से कचरा कम होता है।": { "native": "Recycling reduces rubbish.", "bases": {} }
  "hi-2383":
    native: "change"
    notes:
      "n1": "A change from one state to another, of nature or of life."
    examples:
      "मौसम में परिवर्तन हो रहा है।": { "native": "The weather is changing.", "bases": {} }
      "जीवन में परिवर्तन आया।": { "native": "A change came into life.", "bases": {"जीवन": "life"} }
  "hi-2384":
    native: "clean; pure"
    notes:
      "n1": "Clean and pure, especially of air or water."
    examples:
      "स्वच्छ हवा सबका हक है।": { "native": "Clean air is everyone's right.", "bases": {"हक": "right"} }
      "नदी का पानी स्वच्छ रखो।": { "native": "Keep the river's water clean.", "bases": {} }
  "hi-2385":
    native: "polluted; contaminated"
    notes:
      "n1": "Made dirty or harmful, as water or air can be."
    examples:
      "यह पानी दूषित है।": { "native": "This water is polluted.", "bases": {} }
      "दूषित हवा से सेहत खराब होती है।": { "native": "Health suffers from polluted air.", "bases": {} }
  "hi-2386":
    native: "safety; protection"
    notes:
      "n1": "Keeping people or things safe from danger or harm. The adjective is सुरक्षित (surakśit)."
    examples:
      "बच्चों की सुरक्षा ज़रूरी है।": { "native": "The safety of children is necessary.", "bases": {"सुरक्षा": "safety", "ज़रूरी": "necessary"} }
      "जंगल की सुरक्षा करो।": { "native": "Protect the forest.", "bases": {} }
  "hi-2387":
    native: "extinct; disappeared"
    notes:
      "n1": "No longer found, as a species of animal is that has died out."
    examples:
      "यह जानवर अब लुप्त है।": { "native": "This animal is now extinct.", "bases": {} }
      "कई पक्षी लुप्त हो गए हैं।": { "native": "Many birds have become extinct.", "bases": {"कई": "several", "लुप्त": "extinct"} }
  "hi-2388":
    native: "green; eco-friendly"
    notes:
      "n1": "Green, or friendly to the environment."
    examples:
      "हरित ऊर्जा का प्रयोग करो।": { "native": "Use green energy.", "bases": {} }
      "यह हरित शहर है।": { "native": "This is a green city.", "bases": {} }
