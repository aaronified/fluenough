schema: 1
id: "hi-en-government"
kind: "layer"
core: "hi-government"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Government"
license: "CC-BY-SA-4.0"
description: "How the state works: the government and its offices, the rules and the rights of citizens, elections and the licences and certificates that people apply for. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "hi-2276":
    native: "government"
    notes:
      "n1": "The body that runs the country or a state. The adjective is सरकारी (sarkārī), official or public."
    examples:
      "सरकार ने नई योजना शुरू की।": { "native": "The government started a new scheme.", "bases": {"ने": "by", "शुरू": "start"} }
      "सरकार हर गाँव तक पहुँचना चाहती है।": { "native": "The government wants to reach every village.", "bases": {"हर": "every; each"} }
  "hi-2277":
    native: "government; official; public"
    notes:
      "n1": "Of the government, or run by it, as a school or an office can be."
    examples:
      "यह सरकारी दफ़्तर है।": { "native": "This is a government office.", "bases": {} }
      "सरकारी स्कूल में पढ़ाई मुफ़्त है।": { "native": "Study in a government school is free.", "bases": {} }
  "hi-2278":
    native: "village council"
    notes:
      "n1": "The council of elected people who look after a village."
    examples:
      "गाँव की पंचायत बैठक करती है।": { "native": "The village council holds a meeting.", "bases": {} }
      "पंचायत ने सड़क बनवाई।": { "native": "The council got the road built.", "bases": {"ने": "by", "बनवाई": "to get built"} }
  "hi-2279":
    native: "department"
    notes:
      "n1": "A part of the government or an office that looks after one kind of work."
    examples:
      "शिक्षा विभाग ने नोटिस भेजा।": { "native": "The education department sent a notice.", "bases": {"शिक्षा": "education", "ने": "by", "नोटिस": "notice"} }
      "यह किस विभाग का दफ़्तर है?": { "native": "Which department's office is this?", "bases": {"किस": "which", "विभाग": "department"} }
  "hi-2280":
    native: "officer; official"
    notes:
      "n1": "A person who holds a post of authority in an office or the government."
    examples:
      "अधिकारी कल मिलेंगे।": { "native": "The officer will meet tomorrow.", "bases": {} }
      "अधिकारी की मेज़ पर फ़ाइल है।": { "native": "The file is on the officer's table.", "bases": {} }
  "hi-2281":
    native: "rule; regulation"
    notes:
      "n1": "A rule that people must follow. The plural is नियम (niyam) as well."
    examples:
      "यह नियम सबके लिए है।": { "native": "This rule is for everyone.", "bases": {"लिए": "for"} }
      "नियम मत तोड़ो।": { "native": "Do not break the rules.", "bases": {"मत": "do not", "तोड़ो": "to break"} }
  "hi-2282":
    native: "ministry"
    notes:
      "n1": "A large department of the government, headed by a minister."
    examples:
      "मंत्रालय की नई इमारत बनी है।": { "native": "A new building of the ministry has been built.", "bases": {"इमारत": "building"} }
      "मंत्रालय से जवाब आया।": { "native": "A reply came from the ministry.", "bases": {} }
  "hi-2283":
    native: "parliament"
    notes:
      "n1": "The body of elected people that makes the laws of a country."
    examples:
      "संसद में बहस हो रही है।": { "native": "There is a debate in parliament.", "bases": {} }
      "संसद का सत्र कल शुरू होगा।": { "native": "The session of parliament will begin tomorrow.", "bases": {"शुरू": "start"} }
  "hi-2284":
    native: "state assembly"
    notes:
      "n1": "The body of elected members of a state's government."
    examples:
      "विधानसभा का चुनाव है।": { "native": "There is the state assembly election.", "bases": {} }
      "विधानसभा में नया बिल आया।": { "native": "A new bill came to the state assembly.", "bases": {} }
  "hi-2285":
    native: "voting; polling"
    notes:
      "n1": "The act of casting votes in an election."
    examples:
      "मतदान सुबह सात बजे शुरू होगा।": { "native": "Voting will begin at seven in the morning.", "bases": {"शुरू": "start"} }
      "मतदान केंद्र यहाँ है।": { "native": "The polling station is here.", "bases": {"केंद्र": "centre"} }
  "hi-2286":
    native: "voter"
    notes:
      "n1": "A person who has the right to vote in an election."
    examples:
      "सभी मतदाता वोट डालें।": { "native": "All voters should cast their votes.", "bases": {"सभी": "all", "वोट": "vote"} }
      "मतदाता सूची में नाम देखो।": { "native": "Look for your name in the voters' list.", "bases": {"सूची": "list"} }
  "hi-2287":
    native: "council"
    notes:
      "n1": "A group of people chosen to advise or to run a body."
    examples:
      "नगर परिषद की बैठक है।": { "native": "There is a meeting of the town council.", "bases": {} }
      "परिषद ने नियम पास किया।": { "native": "The council passed the rule.", "bases": {"ने": "by"} }
  "hi-2288":
    native: "secretary"
    notes:
      "n1": "The chief officer of a government department, or a person who keeps records for a body."
    examples:
      "सचिव ने फ़ाइल पर दस्तखत किए।": { "native": "The secretary signed the file.", "bases": {"ने": "by", "दस्तखत": "signature"} }
      "सचिव से मिलो।": { "native": "Meet the secretary.", "bases": {} }
  "hi-2289":
    native: "policy"
    notes:
      "n1": "A plan of action that a government or a company follows."
    examples:
      "सरकार की नई नीति आई है।": { "native": "The government's new policy has come.", "bases": {} }
      "यह नीति सबके हित में है।": { "native": "This policy is in everyone's interest.", "bases": {"हित": "interest"} }
  "hi-2290":
    native: "permission"
    notes:
      "n1": "Leave or consent to do something, given by someone in charge."
    examples:
      "बिना अनुमति के अंदर मत जाओ।": { "native": "Do not go in without permission.", "bases": {"बिना": "without", "अनुमति": "permission", "मत": "do not"} }
      "अनुमति मिल गई।": { "native": "Permission has been given.", "bases": {} }
  "hi-2291":
    native: "certificate"
    notes:
      "n1": "A paper signed by an authority, which proves a fact such as one's birth or one's pass."
    examples:
      "जन्म का प्रमाणपत्र कहाँ है?": { "native": "Where is the birth certificate?", "bases": {"जन्म": "birth"} }
      "प्रमाणपत्र पर मोहर लगाओ।": { "native": "Put a stamp on the certificate.", "bases": {"मोहर": "stamp", "लगाओ": "to put"} }
  "hi-2292":
    native: "licence"
    notes:
      "n1": "A paper that gives someone the right to do something, such as drive a car."
    examples:
      "मेरा ड्राइविंग लाइसेंस बना।": { "native": "My driving licence has been made.", "bases": {"ड्राइविंग": "driving"} }
      "लाइसेंस के बिना गाड़ी मत चलाओ।": { "native": "Do not drive without a licence.", "bases": {"बिना": "without", "मत": "do not"} }
  "hi-2293":
    native: "tax"
    notes:
      "n1": "The money that people pay to the government on earnings and goods."
    examples:
      "सबको कर देना है।": { "native": "Everyone has to pay tax.", "bases": {} }
      "दुकान पर कर बढ़ा।": { "native": "The tax on the shop has risen.", "bases": {"बढ़ा": "to rise"} }
  "hi-2294":
    native: "commission"
    notes:
      "n1": "A group of people set up by the government to study or decide a matter."
    examples:
      "चुनाव आयोग ने तारीख़ बताई।": { "native": "The election commission gave the date.", "bases": {"ने": "by", "तारीख़": "date"} }
      "आयोग की रिपोर्ट आने वाली है।": { "native": "The commission's report is about to come.", "bases": {"वाली": "which is about to"} }
  "hi-2295":
    native: "citizen"
    notes:
      "n1": "A person who belongs to a country and has its rights and duties."
    examples:
      "हर नागरिक को वोट का हक है।": { "native": "Every citizen has the right to vote.", "bases": {"हर": "every; each", "वोट": "vote", "हक": "right"} }
      "नागरिक अपने अधिकार जानें।": { "native": "Citizens should know their rights.", "bases": {} }
  "hi-2296":
    native: "right; power"
    notes:
      "n1": "A thing that a person is allowed to do or have by law or by custom."
    examples:
      "सबको बोलने का अधिकार है।": { "native": "Everyone has the right to speak.", "bases": {"अधिकार": "right"} }
      "अधिकार के साथ कर्तव्य भी है।": { "native": "With rights comes duty too.", "bases": {"कर्तव्य": "duty"} }
  "hi-2297":
    native: "army"
    notes:
      "n1": "The armed force of a country that defends it."
    examples:
      "सेना सरहद पर खड़ी है।": { "native": "The army stands at the border.", "bases": {"खड़ी": "standing"} }
      "सेना के जवान बहादुर हैं।": { "native": "The soldiers of the army are brave.", "bases": {"बहादुर": "brave"} }
  "hi-2298":
    native: "session (of parliament, school)"
    notes:
      "n1": "A period of sitting or working, such as a session of parliament."
    examples:
      "अगला सत्र अगले महीने है।": { "native": "The next session is next month.", "bases": {"अगला": "next", "अगले": "next"} }
      "सत्र शुरू हो गया।": { "native": "The session has begun.", "bases": {"शुरू": "start"} }
