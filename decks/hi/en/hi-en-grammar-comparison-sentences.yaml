native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences comparing things"
license: "CC-BY-SA-4.0"
description: "Short sentences that compare two things or name the most. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-1562":
    native: "This house is bigger than that house."
    bases: { "यह": "this", "मकान": "house", "उस": "that" }
    confusables: { "w1": { why: "Smaller, not bigger: छोटा (chhoṭā) is small." }, "f2": { why: "सबसे (sabse) is for the most; से (se) alone compares two things." } }
  "hi-1563":
    native: "Ram is taller than Shyam."
    bases: { "राम": "Ram", "श्याम": "Shyam", "लंबा": "tall" }
    confusables: { "w1": { why: "Sweet, not tall: मीठा (mīṭhā) is sweet." }, "f2": { why: "लंबी (lambī) is feminine; राम (rām) is masculine, so लंबा (lambā) is right." } }
  "hi-1564":
    native: "Where is the best food found?"
    bases: { "सबसे": "the most", "अच्छा": "good", "खाना": "food", "कहाँ": "where", "मिलता": "to be found" }
    confusables: { "w1": { why: "All, not the most: सब (sab) means all; सबसे (sabse) is the most." }, "f2": { why: "अच्छी (acchī) is feminine; खाना (khānā) is masculine, so अच्छा (acchā) is right." } }
  "hi-1565":
    native: "This is the coldest water."
    bases: { "यह": "this", "सबसे": "the most", "ठंडा": "cold", "पानी": "water" }
    confusables: { "w1": { why: "Hot, not cold: गरम (garam) is hot." }, "f2": { why: "ठंडी (ṭhaṇḍī) is feminine; पानी (pānī) is masculine, so ठंडा (ṭhaṇḍā) is right." } }
  "hi-1566":
    native: "Who runs faster than me?"
    bases: { "मुझसे": "than me", "तेज़": "fast", "कौन": "who", "दौड़ता": "to run" }
    confusables: { "w1": { why: "Big, not fast: बड़ा (baṛā) is big." }, "f2": { why: "तेज़ी (tezī) is the noun speed; तेज़ (tez) is the adjective fast." } }
  "hi-1567":
    native: "Today it is hotter than yesterday."
    bases: { "आज": "today", "गर्मी": "heat", "कल": "yesterday", "ज़्यादा": "more" }
    confusables: { "w1": { why: "Cold, not hot: ठंडा (ṭhaṇḍā) is cold." }, "f2": { why: "कम (kam) means less; ज़्यादा (zyādā) means more." } }
  "hi-1568":
    native: "This book is smaller than that one."
    bases: { "यह": "this", "किताब": "book", "उससे": "than that", "छोटी": "small" }
    confusables: { "w1": { why: "Bigger, not smaller: बड़ा (baṛā) is big." }, "f2": { why: "छोटा (chhoṭā) is masculine; किताब (kitāb) is feminine, so छोटी (chhoṭī) is right." } }
  "hi-1569":
    native: "The biggest room is mine."
    bases: { "सबसे": "the most", "बड़ा": "big", "कमरा": "room", "मेरा": "my" }
    confusables: { "w1": { why: "Smaller, not the biggest: छोटा (chhoṭā) is small." }, "f2": { why: "बड़ी (baṛī) is feminine; कमरा (kamrā) is masculine, so बड़ा (baṛā) is right." } }
  "hi-1570":
    native: "The tea is hotter than the coffee."
    bases: { "चाय": "tea", "कॉफ़ी": "coffee", "गरम": "hot" }
    confusables: { "w1": { why: "Cold, not hot: ठंडा (ṭhaṇḍā) is cold." }, "f2": { why: "गरमी (garmī) is heat, the noun; गरम (garam) is the adjective hot." } }
