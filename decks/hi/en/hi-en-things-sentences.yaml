schema: 1
id: "hi-en-things-sentences"
kind: "layer"
core: "hi-things-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences with things"
license: "CC-BY-SA-4.0"
description: "Short sentences with the things of this unit. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-1188":
    native: "My book is in the bag."
    confusables: { "f1": { why: "Masculine: मेरे (mērē) goes with a masculine noun, and किताब (kitāb) is feminine." }, "w1": { why: "Table, not bag: मेज़ (mēz) means table." } }

  "hi-1189":
    native: "The key is not on the table."
    confusables: { "f1": { why: "Plural: हैं (haim̐) is for several things, and चाबी (cābī) is one key." }, "w1": { why: "Here, not on the table: यहाँ (yahām̐) means here." } }

  "hi-1190":
    native: "The money is in the wallet, not in the handbag."
    confusables: { "f1": { why: "The word alone: बटुआ (baṭuā) is the base, and बटुए (baṭuē) comes before में (mēm̐)." }, "w1": { why: "Chair, not handbag: कुर्सी (kursī) means chair." } }

  "hi-1191":
    native: "Where is the key of the room?"
    confusables: { "f1": { why: "Masculine: का (kā) goes with a masculine noun, and चाबी (cābī) is feminine." }, "w1": { why: "What, not where: क्या (kyā) means what." } }

  "hi-1192":
    native: "On the table there are a map, paper and a pen."
    confusables: { "f1": { why: "The oblique form, used before a postposition such as पर (par), not in a list." }, "w1": { why: "Wall, not table: दीवार (dīvār) means wall." } }

  "hi-1193":
    native: "The soap and the brush are in the bathroom."
    confusables: { "f1": { why: "Singular: है (hai) is for one thing, and the sentence has two." }, "w1": { why: "Here, not in the bathroom: यहाँ (yahām̐) means here." } }

  "hi-1194":
    native: "The suitcase and the bag are both heavy."
    bases: { "दोनों": "both" }
    confusables: { "f1": { why: "Light, not heavy: हल्का (halkā) means light, the opposite of भारी (bhārī)." }, "w1": { why: "Small, not heavy: छोटा (chōṭā) means small." } }

  "hi-1195":
    native: "There is a mirror on the wall."
    bases: { "दीवार": "wall" }
    confusables: { "f1": { why: "Near, not on: पास (pās) means near." }, "w1": { why: "Below, not on: नीचे (nīcē) means below." } }

  "hi-1196":
    native: "Take the towel after the bath."
    bases: { "बाद": "after" }
    confusables: { "f1": { why: "The verb itself: नहाना (nahānā) is to bathe, and नहाने (nahānē) comes before के (kē) बाद (bād)." }, "w1": { why: "Wash, not bathe: धोना (dhōnā) means to wash." } }

  "hi-1197":
    native: "There are apples in the vegetable bag."
    confusables: { "f1": { why: "The word alone: थैला (thailā) is the bag itself, and थैले (thailē) comes before में (mēm̐)." }, "w1": { why: "A bag from English, not a cloth bag: बैग (baig) means bag." } }
