cards:
  "hi-4855":
    native: "This is my book."
    bases:
      "मेरी": "my (feminine)"
    confusables:
      "w1": { why: "Paper, not book: कागज़ (kāgaz) is paper." }
      "w2": { why: "Pencil, not book: पेंसिल (pēṁsil) is a pencil." }
  "hi-4856":
    native: "Where is my watch?"
    bases:
      "मेरी": "my (feminine)"
    confusables:
      "w1": { why: "Glasses, not watch: चश्मा (caśmā) means glasses." }
      "w2": { why: "Umbrella, not watch: छाता (chātā) means umbrella." }
  "hi-4857":
    native: "Is this your bag?"
    confusables:
      "w1": { why: "Cloth bag, not bag: थैला (thailā) is a bag, a cloth one or a sack." }
      "w2": { why: "Camera, not bag: कैमरा (kaimrā) is a camera." }
  "hi-4858":
    native: "I need an umbrella."
    bases:
      "मुझे": "I (to me)"
    confusables:
      "w1": { why: "Glasses, not umbrella: चश्मा (caśmā) means glasses." }
      "w2": { why: "Bag, not umbrella: बैग (baig) is a bag." }
  "hi-4859":
    native: "The camera is new."
    confusables:
      "w1": { why: "Mobile phone, not camera: मोबाइल (mōbāil) is a mobile phone." }
      "w2": { why: "Fridge, not camera: फ्रिज (phrij) is a fridge." }
  "hi-4860":
    native: "The towel is clean."
