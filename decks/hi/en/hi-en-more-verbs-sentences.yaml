description: "Short sentences that use the verbs of this unit. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0962":
    native: "I wake up early every morning."
    confusables:
      "f1": { why: "Feminine: a woman says जागती (jāgtī); this sentence is said by a man." }
      "w1": { why: "Sleep, not wake: सोता (sōtā) means sleeps." }
  "hi-0963":
    native: "Mother will serve food today."
    confusables:
      "f1": { why: "Masculine: परोसेगा (parōsēgā) is said of a man, not a mother." }
      "w1": { why: "Cook, not serve: पकाएगी (pakāēgī) means will cook." }
  "hi-0964":
    native: "Please cut the vegetables with a knife."
    confusables:
      "w1": { why: "Strain, not cut: छानिए (chāniē) means please strain." }
      "w2": { why: "Boil, not cut: उबालिए (ubāliē) means please boil." }
  "hi-0965":
    native: "First boil the water, then add the tea."
    confusables:
      "w1": { why: "Drink, not boil: पीजिए (pījiē) means please drink." }
      "w2": { why: "Serve, not add: परोसिए (parōsiē) means please serve." }
  "hi-0966":
    native: "My brother laughs a lot in the evening."
    confusables:
      "f1": { why: "Feminine: हँसती (ham̐stī) is said of a woman, not a brother." }
      "w1": { why: "Cry, not laugh: रोता (rōtā) means cries." }
  "hi-0967":
    native: "Will you teach me Hindi?"
    confusables:
      "f1": { why: "Third person: सिखाएगा (sikhāēgā) means he will teach, not you." }
      "w1": { why: "Recite or tell, not teach: सुनाओगे (sunāōgē) means will you tell." }
  "hi-0968":
    native: "Will you laugh when you hear what I say?"
    confusables:
      "f1": { why: "Feminine: हँसोगी (ham̐sōgī) is said to a woman." }
      "w1": { why: "Cry, not laugh: रोओगे (rōōgē) means will you cry." }
  "hi-0969":
    native: "I often forget the key."
    confusables:
      "f1": { why: "Feminine: भूलती (bhūltī) is said by a woman." }
      "w1": { why: "Swing, not forget: झूलता (jhūltā) means swings." }
