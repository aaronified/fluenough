schema: 1
id: "hi-en-agriculture"
kind: "layer"
core: "hi-agriculture"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Agriculture"
license: "CC-BY-SA-4.0"
description: "Farming: the fields and crops, the tools and animals of the farm, sowing and the harvest, and the words for water and manure. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "hi-2395":
    native: "farming; cultivation"
    notes:
      "n1": "The work of growing crops and tending animals on land. The worker is किसान (kisān)."
    examples:
      "हमारे गाँव में खेती होती है।": { "native": "Farming is done in our village.", "bases": {} }
      "खेती के लिए अच्छी ज़मीन चाहिए।": { "native": "Good land is needed for farming.", "bases": {"लिए": "for", "ज़मीन": "land"} }
  "hi-2396":
    native: "crop"
    notes:
      "n1": "Plants grown on a farm for food or for sale, at one time of the year."
    examples:
      "इस साल फ़सल अच्छी है।": { "native": "The crop is good this year.", "bases": {} }
      "फ़सल काटने का समय आ गया।": { "native": "The time to cut the crop has come.", "bases": {} }
  "hi-2397":
    native: "manure; fertiliser"
    notes:
      "n1": "Material put on the soil to help plants grow."
    examples:
      "खेत में खाद डालो।": { "native": "Put manure in the field.", "bases": {} }
      "जैविक खाद अच्छी होती है।": { "native": "Organic manure is good.", "bases": {"जैविक": "organic"} }
  "hi-2398":
    native: "irrigation"
    notes:
      "n1": "Supplying water to fields by channels, pumps or wells."
    examples:
      "सिंचाई के लिए नहर है।": { "native": "There is a canal for irrigation.", "bases": {"लिए": "for", "नहर": "canal"} }
      "सिंचाई कम होने से फ़सल सूख गई।": { "native": "Because irrigation was low, the crop dried up.", "bases": {} }
  "hi-2399":
    native: "plough"
    notes:
      "n1": "A tool pulled by oxen that turns over the soil for sowing."
    examples:
      "किसान हल चला रहा है।": { "native": "The farmer is ploughing.", "bases": {} }
      "हल बैल से चलता है।": { "native": "The plough is pulled by oxen.", "bases": {} }
  "hi-2400":
    native: "ox; bull"
    notes:
      "n1": "A male animal of cattle, used to pull the plough or a cart."
    examples:
      "बैल खेत जोतते हैं।": { "native": "The oxen plough the field.", "bases": {"जोतते": "to plough"} }
      "बैल गाड़ी धीरे चलती है।": { "native": "The bullock cart goes slowly.", "bases": {} }
  "hi-2401":
    native: "tractor"
    notes:
      "n1": "A powerful farm vehicle that pulls ploughs and carts."
    examples:
      "ट्रैक्टर नया है।": { "native": "The tractor is new.", "bases": {} }
      "ट्रैक्टर से खेत जोतो।": { "native": "Plough the field with the tractor.", "bases": {"जोतो": "to plough"} }
  "hi-2402":
    native: "spade"
    notes:
      "n1": "A tool with a flat blade on a long handle, for digging."
    examples:
      "फावड़े से गड्ढा खोदो।": { "native": "Dig a hole with the spade.", "bases": {"फावड़े": "spade", "खोदो": "to dig"} }
      "फावड़ा कहाँ रखा है?": { "native": "Where is the spade kept?", "bases": {} }
  "hi-2403":
    native: "sickle"
    notes:
      "n1": "A curved tool with a sharp blade, for cutting crops."
    examples:
      "दराँती से फ़सल काटो।": { "native": "Cut the crop with the sickle.", "bases": {} }
      "दराँती तेज़ है।": { "native": "The sickle is sharp.", "bases": {} }
  "hi-2404":
    native: "grain; cereal"
    notes:
      "n1": "The seeds of plants like wheat and rice, eaten as food."
    examples:
      "गोदाम में अनाज भरा है।": { "native": "The grain is stored in the warehouse.", "bases": {"गोदाम": "warehouse"} }
      "अनाज की कीमत बढ़ी है।": { "native": "The price of grain has risen.", "bases": {"बढ़ी": "to rise"} }
  "hi-2405":
    native: "sugarcane"
    notes:
      "n1": "A tall grass with sweet stalks, grown for sugar."
    examples:
      "खेत में गन्ना लगा है।": { "native": "Sugarcane is planted in the field.", "bases": {} }
      "गन्ने का रस मीठा है।": { "native": "The juice of sugarcane is sweet.", "bases": {"गन्ने": "sugarcane", "रस": "juice"} }
  "hi-2406":
    native: "cotton"
    notes:
      "n1": "A plant whose white fibre is spun into thread and cloth."
    examples:
      "कपास से कपड़ा बनता है।": { "native": "Cloth is made from cotton.", "bases": {} }
      "कपास की फ़सल अच्छी है।": { "native": "The cotton crop is good.", "bases": {} }
  "hi-2407":
    native: "sowing"
    notes:
      "n1": "The act of putting seeds in the ground, to grow crops."
    examples:
      "बुवाई का समय जुलाई है।": { "native": "The time for sowing is July.", "bases": {} }
      "बुवाई से पहले खेत जोतो।": { "native": "Plough the field before sowing.", "bases": {"जोतो": "to plough"} }
  "hi-2408":
    native: "yield; produce"
    notes:
      "n1": "The amount of crop or goods that is grown or made."
    examples:
      "इस बार उपज अच्छी हुई।": { "native": "This time the yield was good.", "bases": {"बार": "time"} }
      "उपज बाज़ार में बिकी।": { "native": "The produce was sold in the market.", "bases": {"बिकी": "to be sold"} }
  "hi-2409":
    native: "wheat"
    notes:
      "n1": "A cereal grain, ground into flour for bread."
    examples:
      "गेहूँ की फ़सल कटी।": { "native": "The wheat crop was cut.", "bases": {"कटी": "to be cut"} }
      "गेहूँ पीसकर आटा बनाओ।": { "native": "Grind the wheat and make flour.", "bases": {} }
  "hi-2410":
    native: "mustard"
    notes:
      "n1": "A plant whose seeds are pressed for oil."
    examples:
      "सरसों का तेल अच्छा है।": { "native": "Mustard oil is good.", "bases": {} }
      "खेत में सरसों पीली है।": { "native": "The mustard in the field is yellow.", "bases": {} }
  "hi-2411":
    native: "millet; pearl millet"
    notes:
      "n1": "A small grain, grown in dry land and eaten as bread."
    examples:
      "बाजरे की रोटी खाओ।": { "native": "Eat millet bread.", "bases": {"बाजरे": "millet"} }
      "बाजरा सूखे खेत में होता है।": { "native": "Millet grows in dry fields.", "bases": {} }
  "hi-2412":
    native: "sorghum; jowar"
    notes:
      "n1": "A grain plant grown in dry areas, used for food and fodder."
    examples:
      "ज्वार की फ़सल सूखे में भी होती है।": { "native": "Sorghum is grown even in drought.", "bases": {} }
      "ज्वार का आटा अच्छा है।": { "native": "Sorghum flour is good.", "bases": {} }
  "hi-2413":
    native: "animal (of the farm)"
    notes:
      "n1": "An animal kept on a farm, such as a cow, a buffalo or a goat."
    examples:
      "खेत पर पशु बँधे हैं।": { "native": "The animals are tied up at the farm.", "bases": {"बँधे": "to be tied"} }
      "पशुओं को चारा दो।": { "native": "Give fodder to the animals.", "bases": {"पशुओं": "animal", "चारा": "fodder"} }
