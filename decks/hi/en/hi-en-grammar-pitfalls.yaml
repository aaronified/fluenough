schema: 1
id: "hi-en-grammar-pitfalls"
kind: "layer"
core: "hi-grammar-pitfalls"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Pitfalls"
license: "CC0-1.0"
description: "The mistakes English speakers make most in Hindi."
cards:
  "hi-0364":
    native: "I ate."
    notes:
      "n1": "In the past of a verb with an object, the doer takes ने (nē) (मैं (maim̐) → मैंने (mainnē)) and the verb agrees with the object, not with the doer."
    bases:
      "मैंने": "I"
  "hi-0365":
    native: "I ate a roti."
    notes:
      "n1": "खाई (khāī) is feminine because रोटी (rōṭī) is, whoever ate it."
    bases:
      "मैंने": "I"
  "hi-0366":
    native: "This is my car."
    notes:
      "n1": "मेरी (mērī) agrees with गाड़ी (gāṛī), which is feminine, not with the speaker. A man says मेरी गाड़ी (mērī gāṛī) too."
    bases:
      "यह": "this"
      "मेरी": "my"
      "गाड़ी": "car"
  "hi-0367":
    native: "She is coming."
    notes:
      "n1": "वह (vah) does not say he or she; only the verb does."
    bases:
      "वह": "he; she"
      "रही": "to stay; to be (doing)"
  "hi-0368":
    native: "The water is cold."
    notes:
      "n1": "पानी (pānī) is masculine, so ठंडा (ṭhaṇḍā)."
    bases:
      "ठंडा": "cold"
  "hi-0369":
    native: "The tea is cold."
    notes:
      "n1": "चाय (cāy) is feminine, so ठंडी (ṭhaṇḍī). Every noun has a gender, and it has to be learned with the word."
    bases:
      "ठंडी": "cold"
  "hi-0370":
    native: "I'm hungry."
    notes:
      "n1": "'Hunger has struck me'. So too मुझे प्यास लगी है (mujhē pyās lagī hai), I'm thirsty."
    bases:
      "मुझे": "I"
      "भूख": "hunger"
      "लगी": "to seem; to feel"
  "hi-0371":
    native: "I have to go."
    notes:
      "n1": "Having to do something is 'to me, going is': मुझे (mujhē), the verb's -ना (-nā) form, then है (hai)."
    bases:
      "मुझे": "I"
      "जाना": "to go"
  "hi-0372":
    native: "I need to talk to you."
    notes:
      "n1": "You talk से (sē) someone, not को (kō). And करनी (karnī) is feminine because बात (bāt) is."
    bases:
      "मुझे": "I"
      "बात": "talk; matter"
      "करनी": "to do; to make"
  "hi-0373":
    native: "Please sit down."
    notes:
      "n1": "With आप (āp), use the -इए (-iē) form. The तुम (tum) form, बैठो (baiṭhō), is for friends and children, and can sound rude to a stranger."
    bases:
      "बैठिए": "to sit"
