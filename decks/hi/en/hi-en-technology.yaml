schema: 1
id: "hi-en-technology"
kind: "layer"
core: "hi-technology"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Technology"
license: "CC-BY-SA-4.0"
description: "Machines, computers and the internet: the words for devices, programs and data, and how people use them. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "hi-2305":
    native: "technology; technique"
    notes:
      "n1": "The use of science and tools to do practical work, or a way of doing a task."
    examples:
      "नई तकनीक से काम आसान हुआ।": { "native": "The work became easy with new technology.", "bases": {"तकनीक": "technology"} }
      "यह तकनीक सीखो।": { "native": "Learn this technique.", "bases": {} }
  "hi-2306":
    native: "technology (formal)"
    notes:
      "n1": "The formal word for technology, the use of science in industry and life."
    examples:
      "प्रौद्योगिकी ने जीवन बदला है।": { "native": "Technology has changed life.", "bases": {"ने": "by", "जीवन": "life"} }
      "देश में प्रौद्योगिकी का विकास हो रहा है।": { "native": "Technology is developing in the country.", "bases": {"विकास": "development"} }
  "hi-2307":
    native: "website"
    notes:
      "n1": "A set of pages on the internet that belong to one person or one organisation."
    examples:
      "हमारी वेबसाइट देखो।": { "native": "See our website.", "bases": {} }
      "वेबसाइट बंद है।": { "native": "The website is down.", "bases": {} }
  "hi-2308":
    native: "software"
    notes:
      "n1": "The programs that tell a computer or a phone what to do."
    examples:
      "यह सॉफ़्टवेयर मुफ़्त है।": { "native": "This software is free.", "bases": {} }
      "सॉफ़्टवेयर नया करो।": { "native": "Update the software.", "bases": {} }
  "hi-2309":
    native: "programme; program"
    notes:
      "n1": "A set of instructions for a computer, or a show on the radio or television."
    examples:
      "यह प्रोग्राम कल चलेगा।": { "native": "This programme will be shown tomorrow.", "bases": {} }
      "कंप्यूटर का प्रोग्राम बंद करो।": { "native": "Close the computer's program.", "bases": {} }
  "hi-2310":
    native: "code"
    notes:
      "n1": "Instructions written in a language that a computer can read, or a secret number."
    examples:
      "यह कोड कौन लिखता है?": { "native": "Who writes this code?", "bases": {} }
      "कोड मत बताओ।": { "native": "Do not tell the code.", "bases": {"मत": "do not"} }
  "hi-2311":
    native: "robot"
    notes:
      "n1": "A machine that can do work by itself, guided by a program."
    examples:
      "रोबोट घर का काम करता है।": { "native": "The robot does household work.", "bases": {} }
      "रोबोट से काम आसान होता है।": { "native": "Work becomes easy with a robot.", "bases": {} }
  "hi-2312":
    native: "machine"
    notes:
      "n1": "A device with moving parts that does work."
    examples:
      "यह मशीन बहुत तेज़ है।": { "native": "This machine is very fast.", "bases": {} }
      "मशीन खराब हो गई।": { "native": "The machine has broken down.", "bases": {} }
  "hi-2313":
    native: "device; tool; equipment"
    notes:
      "n1": "A tool or a piece of equipment used for a task."
    examples:
      "ये उपकरण भारी हैं।": { "native": "These devices are heavy.", "bases": {} }
      "उपकरण सावधानी से चलाओ।": { "native": "Use the equipment with care.", "bases": {"सावधानी": "care"} }
  "hi-2314":
    native: "sensor"
    notes:
      "n1": "A part that detects heat, light or movement and sends a signal."
    examples:
      "सेंसर से दरवाज़ा खुलता है।": { "native": "The door opens with a sensor.", "bases": {"खुलता": "to open"} }
      "सेंसर ने गरमी पकड़ी।": { "native": "The sensor detected the heat.", "bases": {"ने": "by", "गरमी": "heat"} }
  "hi-2315":
    native: "button"
    notes:
      "n1": "A small thing that is pressed to turn a machine on or off."
    examples:
      "लाल बटन दबाओ।": { "native": "Press the red button.", "bases": {} }
      "बटन ढूँढो।": { "native": "Find the button.", "bases": {} }
  "hi-2316":
    native: "switch"
    notes:
      "n1": "A device that turns electricity on or off."
    examples:
      "बिजली का स्विच कहाँ है?": { "native": "Where is the electric switch?", "bases": {} }
      "स्विच बंद करो।": { "native": "Switch it off.", "bases": {} }
  "hi-2317":
    native: "bulb"
    notes:
      "n1": "A glass object that gives light when electricity passes through it."
    examples:
      "बल्ब जला दो।": { "native": "Switch on the bulb.", "bases": {} }
      "बल्ब फ्यूज़ हो गया।": { "native": "The bulb has blown.", "bases": {"फ्यूज़": "fused"} }
  "hi-2318":
    native: "solar"
    notes:
      "n1": "Of the sun, or worked by the sun's energy."
    examples:
      "सौर ऊर्जा से बिजली बनती है।": { "native": "Electricity is made from solar energy.", "bases": {} }
      "छत पर सौर पैनल लगे हैं।": { "native": "Solar panels are fixed on the roof.", "bases": {"पैनल": "panel"} }
  "hi-2319":
    native: "energy"
    notes:
      "n1": "The power that makes things work, such as heat, light or movement."
    examples:
      "सूरज से ऊर्जा मिलती है।": { "native": "Energy comes from the sun.", "bases": {} }
      "ऊर्जा बचाओ।": { "native": "Save energy.", "bases": {} }
  "hi-2320":
    native: "data"
    notes:
      "n1": "Facts and figures stored or sent by a computer."
    examples:
      "फोन का डेटा खत्म हो गया।": { "native": "The phone's data has run out.", "bases": {"फोन": "phone", "खत्म": "finished"} }
      "डेटा सुरक्षित रखो।": { "native": "Keep the data safe.", "bases": {} }
  "hi-2321":
    native: "server"
    notes:
      "n1": "A powerful computer that stores data and serves it to others."
    examples:
      "सर्वर बंद है।": { "native": "The server is down.", "bases": {} }
      "सर्वर पर डेटा रखो।": { "native": "Keep the data on the server.", "bases": {} }
  "hi-2322":
    native: "blog"
    notes:
      "n1": "A website where a person writes entries about their views or life, regularly."
    examples:
      "उसका ब्लॉग बहुत लोकप्रिय है।": { "native": "His blog is very popular.", "bases": {"लोकप्रिय": "popular"} }
      "मैं रोज़ ब्लॉग लिखता हूँ।": { "native": "I write a blog every day.", "bases": {} }
  "hi-2323":
    native: "post; entry"
    notes:
      "n1": "A message or picture put on a website or a social network, or a letter sent by mail."
    examples:
      "उसकी नई पोस्ट आई।": { "native": "His new post has come up.", "bases": {} }
      "पोस्ट पर लाइक मत करो।": { "native": "Do not like the post.", "bases": {"लाइक": "like", "मत": "do not"} }
  "hi-2324":
    native: "chat"
    notes:
      "n1": "A talk by typed messages on a phone or a computer."
    examples:
      "हम चैट पर बात करते हैं।": { "native": "We talk by chat.", "bases": {} }
      "चैट बंद करो।": { "native": "Close the chat.", "bases": {} }
  "hi-2325":
    native: "media"
    notes:
      "n1": "The newspapers, radio, television and the internet that bring news and information."
    examples:
      "मीडिया की खबर सही है?": { "native": "Is the media's news right?", "bases": {} }
      "सोशल मीडिया पर बहुत समय जाता है।": { "native": "A lot of time goes on social media.", "bases": {"सोशल": "social", "मीडिया": "media"} }
  "hi-2326":
    native: "invention"
    notes:
      "n1": "A new thing made for the first time, or the act of making it."
    examples:
      "बिजली का आविष्कार बड़ा था।": { "native": "The invention of electricity was great.", "bases": {} }
      "उसने नया आविष्कार किया।": { "native": "He made a new invention.", "bases": {} }
  "hi-2327":
    native: "discovery; search"
    notes:
      "n1": "The act of finding something new, or of looking for a thing."
    examples:
      "यह बड़ी खोज है।": { "native": "This is a great discovery.", "bases": {} }
      "खोज में समय लगा।": { "native": "The search took time.", "bases": {} }
  "hi-2328":
    native: "scientist"
    notes:
      "n1": "A person who studies science, or who does research in it."
    examples:
      "वैज्ञानिक ने नई दवा बनाई।": { "native": "The scientist made a new medicine.", "bases": {"ने": "by"} }
      "मेरी बहन वैज्ञानिक है।": { "native": "My sister is a scientist.", "bases": {} }
  "hi-2329":
    native: "smart; clever"
    notes:
      "n1": "Clever with machines or with ideas. Used of a phone, a watch or a person."
    examples:
      "मेरा फोन स्मार्ट है।": { "native": "My phone is smart.", "bases": {"फोन": "phone"} }
      "वह बहुत स्मार्ट लड़की है।": { "native": "She is a very clever girl.", "bases": {"लड़की": "girl"} }
