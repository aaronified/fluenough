  notes: "The तू (tū) form is the bare stem: जा (jā) for जाना (jānā). The तुम (tum) form adds the vowel ओ (ō), as जाओ (jāō); after a consonant it adds the sign ो (o), as लिखो (likhō). The आप (āp) form adds इए (iye), as जाइए (jāiē), or िए (iye) after a consonant. मत (mat) before a command makes it a negative: मत जाओ (mat jāō), do not go. The forms दो (dō), लो (lō) and कर (kar) are the irregular stems of देना (dēnā), लेना (lēnā) and करना (karnā); their polite forms are दीजिए (dījiē), लीजिए (lījiē) and कीजिए (kījiē). Verbs that name weather or a sound are not in the table."
