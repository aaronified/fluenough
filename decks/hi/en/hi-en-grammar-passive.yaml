native: { code: "en", iso639_3: "eng", name: "English" }
name: "Passive"
license: "CC-BY-SA-4.0"
description: "What is done: the passive, as parha jaata hai (it is read). Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "Passive"
  slot_name: "form"
  prompt: "{lemma} ({gloss}), {slot}"
  slots: {"present passive (it is done)": "is done: the participle with jaata hai", "past passive (it was done)": "was done: the participle with gaya"}
  entries:
    "parhna": "to read"
    "likhna": "to write"
    "sunna": "to listen"
    "karna": "to do"
    "banana": "to make"
    "khana": "food"
    "pina": "to drink alcohol (said on its own)"
    "kholna": "to open"
    "becna": "to sell"
    "kharidna": "to buy"
    "dena": "to give"
    "lena": "to take"
    "sikhna": "to learn"
    "sikhana": "to teach"
    "pakana": "to cook"
    "katna": "to cut"
    "dhona": "to wash"
    "uthana": "to lift"
    "bhejna": "to send"
    "bulana": "to call"
    "dekhna": "to see"
    "samjhna": "to understand"
    "bhulna": "to forget"
    "chorna": "to leave"
    "dhummdhana": "to look for"
    "batana": "to tell"
    "kahna": "to say"
    "jitna": "to win"
    "harna": "to lose"
  notes: "The passive is the participle of the verb with जाना (jānā): पढ़ा जाता है (paṛhā jātā hai), it is read, and पढ़ा गया (paṛhā gayā), it was read. The participle agrees with the thing that is done, as पढ़ी जाती है (paṛhī jātī hai) for a feminine noun. The table gives the masculine singular form for each common transitive verb. Intransitive verbs have no passive and are not in it. किया (kiyā), दिया (diyā) and लिया (liyā) are the participles of करना (karnā), देना (dēnā) and लेना (lēnā)."
