cards:
  "hi-1881":
    native: "The phone rang, but no number showed on the screen."
    confusables: {"w1": {"why": "A text, not a call: मैसेज (maisēj) does not ring."}, "w2": {"why": "A charger, not a ring: चार्जर (cārjar) is the device for power."}}
  "hi-1882":
    native: "The battery was low, so the phone switched off."
    confusables: {"w1": {"why": "A signal, not the power: सिग्नल (signal) is the strength of the connection."}, "w2": {"why": "Force, not power: ज़ोर (zōr) is the strength of a push."}}
  "hi-1883":
    native: "If you forget the password, send a new message."
    confusables: {"w1": {"why": "An email, not a text: ईमेल (īmēl) is sent over the internet."}, "w2": {"why": "A file, not a message: फ़ाइल (fāil) is data kept under one name."}}
