      "w1": { why: "To hit, not catch: मारना (mārnā) means to hit." }
      "w2": { why: "To touch, not catch: छूना (chūnā) means to touch." }
  "hi-5088":
    native: "He pushed the door."
    confusables:
      "w1": { why: "To pull, not push: खींचना (khīñcanā) means to pull." }
      "w2": { why: "To press, not push: दबाना (dabānā) means to press." }
  "hi-5089":
    native: "The policeman caught the thief."
    bases:
      "सिपाही": "policeman"
      "ने": "marks who did the action"
      "चोर": "thief"
    confusables:
      "w1": { why: "To stop, not catch: रोकना (rōknā) means to stop." }
      "w2": { why: "To escape, not catch: बचना (bacnā) means to escape." }
