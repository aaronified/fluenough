cards:
  "hi-5082":
    native: "He tied the rope."
    confusables:
      "w1": { why: "To pull, not tie: खींचना (khīñcanā) means to pull." }
      "w2": { why: "To drop, not tie: गिराना (girānā) means to drop." }
  "hi-5083":
    native: "I gave the child some water to drink."
    confusables:
      "w1": { why: "To wake, not give a drink: जगाना (jagānā) means to wake someone up." }
      "w2": { why: "To feed, not give a drink: खिलाना (khilānā) means to feed." }
  "hi-5084":
    native: "He hung the picture on the wall."
    bases:
      "दीवार": "wall"
    confusables:
      "w1": { why: "To stick, not hang: चिपकाना (cipkānā) means to stick." }
      "w2": { why: "To cover, not hang: ढकना (ḍhaknā) means to cover." }
  "hi-5085":
    native: "He hid the key."
    confusables:
      "w1": { why: "To show, not hide: दिखाना (dikhānā) means to show." }
      "w2": { why: "To choose, not hide: चुनना (cunnā) means to choose." }
  "hi-5086":
    native: "The thief ran away from the police."
