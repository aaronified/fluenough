      "चोर": "thief"
    confusables:
      "w1": { why: "To shout, not run: चिल्लाना (cillānā) means to shout." }
      "w2": { why: "To be afraid, not run: डरना (ḍarnā) means to be afraid." }
  "hi-5087":
    native: "The child caught the ball."
