      "w2": { why: "To stop, not explain: रोकना (rōknā) means to stop." }
  "hi-5095":
    native: "We escaped from danger."
    confusables:
      "w1": { why: "To save, not escape: बचाना (bacānā) means to save." }
      "w2": { why: "To run away, not escape: भागना (bhāgnā) means to run away." }
