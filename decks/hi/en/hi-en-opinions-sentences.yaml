cards:
  "hi-5336":
    native: "What is your opinion?"
    bases:
      "आपकी": "your (polite)"
    confusables:
      "w1": { why: "Thought, not opinion: विचार (vicār) means thought; idea." }
      "w2": { why: "Suggestion, not opinion: सुझाव (sujhāv) means suggestion." }
  "hi-5337":
    native: "I agree with you."
    bases:
      "आपसे": "with you (polite)"
      "हूँ": "am"
    confusables:
      "w1": { why: "Disagreeing, the opposite: असहमत (ashmat) means disagreeing." }
      "w2": { why: "Disliked, not agreeing: नापसंद (nāpsand) means disliked; not liked." }
  "hi-5338":
    native: "My argument has real strength."
    bases:
      "मेरे": "my (oblique)"
      "दम": "strength; substance"
    confusables:
      "w1": { why: "Argument or plea, a reason given: दलील (dalīl) means argument; plea; reason given." }
      "w2": { why: "Proof, not argument: सबूत (sabūt) means proof; evidence." }
  "hi-5339":
    native: "There is no proof of this."
    bases:
      "इस": "this (oblique)"
    confusables:
      "w1": { why: "Truth, not proof: सच्चाई (saccāī) means truth; honesty." }
      "w2": { why: "Doubt, not proof: शक (śak) means doubt; suspicion." }
  "hi-5340":
    native: "I cannot believe it."
    bases:
      "मुझे": "to me"
      "होता": "happens (to me)"
    confusables:
      "w1": { why: "Trust, not belief: भरोसा (bharōsā) means trust; confidence." }
      "w2": { why: "Doubt, not belief: शक (śak) means doubt; suspicion." }
  "hi-5341":
    native: "This proposal is possible."
    bases:
      "प्रस्ताव": "proposal"
    confusables:
      "w1": { why: "Impossible, the opposite: असंभव (asambhav) means impossible." }
      "w2": { why: "Certain, not possible: निश्चित (niścit) means certain; fixed; decided." }
  "hi-5342":
    native: "I believe what you say."
    bases:
      "जो": "what"
      "कहते": "say"
      "उसे": "that (object)"
      "मानता": "believe"
      "हूँ": "am"
    confusables:
      "w1": { why: "Acceptance: स्वीकार (svīkār) means acceptance." }
      "w2": { why: "Refusal, the opposite: इनकार (inkār) means refusal; denial." }
  "hi-5343":
    native: "We reached a compromise."
    bases:
      "समझौते": "compromise (oblique)"
      "पहुँचे": "reached"
    confusables:
      "w1": { why: "Debate, not agreement: बहस (bahas) means debate; argument." }
      "w2": { why: "Refusal: इनकार (inkār) means refusal; denial." }
  "hi-5344":
    native: "Accept his advice."
    bases:
      "उसकी": "his; her"
      "मान": "accept"
      "लो": "do (for yourself)"
    confusables:
      "w1": { why: "Suggestion: सुझाव (sujhāv) means suggestion." }
      "w2": { why: "Opinion, not advice: राय (rāy) means opinion; view." }
  "hi-5345":
    native: "Please give a suggestion in the debate."
    bases:
      "दीजिए": "give (polite)"
    confusables:
      "w1": { why: "Argument: दलील (dalīl) means argument; plea." }
      "w2": { why: "Thought: विचार (vicār) means thought; idea." }
  "hi-5346":
    native: "My point of view is a little different."
    bases:
      "मेरा": "my (masculine)"
      "अलग": "different"
    confusables:
      "w1": { why: "Idea or thought: ख़याल (k͟hayāl) means idea; thought; care." }
      "w2": { why: "Side or favour, not view: पक्ष (pakś) means side; favour." }
  "hi-5347":
    native: "I do not disagree with this point."
    bases:
      "इस": "this (oblique)"
      "हूँ": "am"
    confusables:
      "w1": { why: "Agreeing, the opposite: सहमत (sahmat) means agreeing." }
      "w2": { why: "Refusal, not disagreement: इनकार (inkār) means refusal; denial." }
