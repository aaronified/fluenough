      "भी": { meaning: "also, even" }
      "शेर": { meaning: "lion" }
      "होता": { meaning: "is" }
      "है": { meaning: "is" }
  "hi-4256":
    native: "Black letters and a buffalo are alike; writing means nothing to someone who cannot read."
    notes:
      "literal": "Literally, 'black letters and a buffalo are alike'."
    bases:
      "काला": { meaning: "black" }
      "अक्षर": { meaning: "letter" }
      "भैंस": { meaning: "buffalo" }
      "बराबर": { meaning: "equal" }
  "hi-4257":
    native: "A frog in a well."
