cards:
  "hi-4250":
    native: "As is the king, so are the subjects."
    notes:
      "literal": "Word for word, 'as the king, so the subjects'; said that people follow the example of their leaders."
    bases:
      "यथा": { meaning: "as" }
      "राजा": { meaning: "king" }
      "तथा": { meaning: "so" }
      "प्रजा": { meaning: "subjects" }
  "hi-4251":
    native: "In the land of the blind, the one-eyed man is king."
    notes:
      "literal": "Word for word, 'among the blind, the one-eyed is king'; said when the least poor member of a poor group is made its leader."
    bases:
      "अंधों": { meaning: "of the blind" }
      "में": { meaning: "in" }
      "काना": { meaning: "one-eyed" }
      "राजा": { meaning: "king" }
  "hi-4252":
    native: "A hundred blows of a goldsmith are worth one blow of a blacksmith."
    notes:
      "literal": "Word for word, 'a hundred of the goldsmith, one of the blacksmith'; said that one firm blow outweighs many light ones."
    bases:
      "सौ": { meaning: "hundred" }
      "सुनार": { meaning: "goldsmith" }
      "की": { meaning: "(of, the blow of)" }
      "एक": { meaning: "one" }
      "लोहार": { meaning: "blacksmith" }
  "hi-4253":
    native: "Do not demand more than you are worth."
    notes:
      "literal": "Literally, 'this face, and masoor dal'."
    bases:
      "यह": { meaning: "this" }
      "मुँह": { meaning: "face" }
      "और": { meaning: "and" }
      "मसूर": { meaning: "lentil" }
      "की": { meaning: "of" }
      "दाल": { meaning: "lentil stew" }
  "hi-4254":
    native: "The rope is burnt, yet its twists remain."
    notes:
      "literal": "Word for word, 'the rope burned, but the twist did not go'; said of someone defeated who keeps their airs."
    bases:
      "रस्सी": { meaning: "rope" }
      "जल": { meaning: "burnt" }
      "गई": { meaning: "went" }
      "पर": { meaning: "but" }
      "बल": { meaning: "twist, strength" }
      "नहीं": { meaning: "not" }
      "गया": { meaning: "went" }
  "hi-4255":
    native: "Even a dog is a lion in his own alley."
    notes:
      "literal": "Word for word, 'in one's own lane even the dog is a lion'; said that people are bolder on home ground."
    bases:
      "अपनी": { meaning: "one's own" }
      "गली": { meaning: "lane" }
      "में": { meaning: "in" }
