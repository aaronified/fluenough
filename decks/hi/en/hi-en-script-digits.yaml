schema: 1
id: "hi-en-script-digits"
kind: "layer"
core: "hi-script-digits"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Devanagari digits"
license: "CC-BY-SA-4.0"
description: "The ten digits of the Devanagari script, ० (0) to ९ (9), each with its Hindustani number word. Everyday Hindi writes 0 to 9, so these are for signs, older books and official papers."
tags: ["beginner", "unreviewed", "script"]
cards:
  "hi-0725":
    native: "0 (zero)"
    notes:
      "n1": "A small oval, written ० (0). Hindi says sifar (sifar) for zero, and also śūnya (śūnya), the Sanskrit word."
  "hi-0726":
    native: "1 (one)"
    notes:
      "n1": "Easily mixed up with ९ (9). The १ (1) is an upright stroke with a small flag at its top; the ९ (9) curls at its foot."
  "hi-0727":
    native: "2 (two)"
    notes:
      "n1": "The digit of दो (dō, two). Prices, buses and phone numbers use the everyday 2 instead."
  "hi-0728":
    native: "3 (three)"
    notes:
      "n1": "The digit of तीन (tīn, three), written ३ (3)."
  "hi-0729":
    native: "4 (four)"
    notes:
      "n1": "Looks like an 8, though it is 4: check ४ (4) against ८ (8). The word is चार (cār, four)."
  "hi-0730":
    native: "5 (five)"
    notes:
      "n1": "The digit of पाँच (pām̐c, five), also written पांच (pāñc)."
  "hi-0731":
    native: "6 (six)"
    notes:
      "n1": "The digit of छह (chah, six), also written छः (chaḥ)."
  "hi-0732":
    native: "7 (seven)"
    notes:
      "n1": "The digit of सात (sāt, seven)."
  "hi-0733":
    native: "8 (eight)"
    notes:
      "n1": "The digit of आठ (āṭh, eight). Check it against ४ (4), which looks like an 8."
  "hi-0734":
    native: "9 (nine)"
    notes:
      "n1": "The digit of नौ (nau, nine). Look for the curl at its foot, which the १ (1) does not have."
