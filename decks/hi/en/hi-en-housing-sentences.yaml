cards:
  "hi-5750":
    native: "My owner will come tomorrow."
    bases:
      "आएगा": "will come"
    confusables:
      "w1": { why: "Tenant, not owner: किरायेदार (kirāyēdār) means tenant." }
      "w2": { why: "Today, not tomorrow: आज (āj) means today." }
  "hi-5751":
    native: "The tenant is sitting on the balcony."
    bases:
      "बैठा": "sitting (masculine)"
      "है": "is"
    confusables:
      "w1": { why: "Gate, not balcony: गेट (gēṭ) means gate." }
      "w2": { why: "Room, not balcony: कमरा (kamrā) means room." }
  "hi-5752":
    native: "The lift is closed today."
    bases:
      "है": "is"
    confusables:
      "w1": { why: "Gate, not lift: गेट (gēṭ) means gate." }
      "w2": { why: "Yesterday or tomorrow, not today: कल (kal) means yesterday or tomorrow." }
  "hi-5753":
    native: "Please close the gate."
    bases:
      "कीजिए": "do (polite)"
    confusables:
      "w1": { why: "Lift, not gate: लिफ़्ट (lifṭ) means lift." }
      "w2": { why: "Working, not closed: चालू (cālū) means working or on." }
  "hi-5754":
    native: "Write the housing society's address here."
    bases:
      "लिखिए": "write (polite)"
    confusables:
      "w1": { why: "House or home, not address: घर (ghar) means house or home." }
      "w2": { why: "Building, not address: मकान (makān) means house." }
  "hi-5755":
    native: "I live in a new colony."
    bases:
      "नई": "new (feminine)"
      "रहता": "live (masculine)"
      "हूँ": "am"
    confusables:
      "w1": { why: "Housing society, not colony: सोसाइटी (sōsāiṭī) means housing society." }
      "w2": { why: "Home, not colony: घर (ghar) means home." }
  "hi-5756":
    native: "Put the bed in the room."
    bases:
      "कमरे": "room (oblique)"
      "रखिए": "put (polite)"
    confusables:
      "w1": { why: "Sofa, not bed: सोफ़ा (sōfā) means sofa." }
      "w2": { why: "Cupboard, not bed: अलमारी (almārī) means cupboard." }
  "hi-5757":
    native: "The sofa is very old."
    bases:
      "है": "is"
    confusables:
      "w1": { why: "Bed, not sofa: पलंग (palaṅg) means bed." }
      "w2": { why: "New, not old: नया (nayā) means new." }
  "hi-5758":
    native: "Switch on the AC, it is very hot."
    bases:
      "चलाइए": "run, switch on (polite)"
      "है": "is"
    confusables:
      "w1": { why: "Wind or air, not heat: हवा (havā) means wind or air." }
      "w2": { why: "Light, not air conditioner: बत्ती (battī) means light." }
  "hi-5759":
    native: "There are curtains in the cupboard."
    bases:
      "पर्दे": "curtains (plural)"
      "हैं": "are"
    confusables:
      "w1": { why: "Sofa, not curtain: सोफ़ा (sōfā) means sofa." }
      "w2": { why: "Room, not cupboard: कमरा (kamrā) means room." }
  "hi-5760":
    native: "The building has a courtyard."
    bases:
      "है": "is"
    confusables:
      "w1": { why: "House, not building: मकान (makān) means house." }
      "w2": { why: "Home, not courtyard: घर (ghar) means home." }
  "hi-5761":
    native: "Where is the cylinder?"
    bases:
      "है": "is"
    confusables:
      "w1": { why: "Who, not where: कौन (kaun) means who." }
      "w2": { why: "When, not where: कब (kab) means when." }
