schema: 1
id: "hi-en-phrasebook"
kind: "layer"
core: "hi-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty phrases to say whole from the first day, before their words are taught: greetings and thanks, your name, asking for help and asking for Hindi to be slower."
license: "CC0-1.0"
tags: ["beginner"]
cards:
  "hi-0132":
    native: "hello; goodbye"
    notes:
      "n1": "Said with palms pressed together, to anyone, at meeting and at parting. In a family, younger people often greet elders by bending to touch their feet (पैर छूना (pair chūnā)) instead; a visitor is not expected to."
    bases:
      "नमस्ते": "hello; goodbye"
  "hi-0133":
    native: "hello (formal)"
    notes:
      "n1": "A more formal नमस्ते (namastē), heard in speeches, on the radio and from officials."
    bases:
      "नमस्कार": "hello (formal)"
  "hi-0136":
    native: "How are you? (to a man)"
    notes:
      "n1": "To a woman: आप कैसी हैं? (ap kaisi hain?). The word for 'how' agrees with the person asked about."
  "hi-0137":
    native: "I'm fine."
    notes:
      "n1": "ठीक (ṭhīk) is 'fine, all right', one of the most useful words in Hindi. ठीक है (ṭhīk hai) is 'OK'."
    bases:
      "मैं": "I"
      "ठीक": "fine; all right"
      "हूँ": "to be"
  "hi-0144":
    native: "See you again."
    notes:
      "n1": "The usual goodbye besides नमस्ते (namastē). Hindi has a word for 'farewell', अलविदा (alvidā), but it sounds final, as in a film."
    bases:
      "मिलेंगे": "to meet"
  "hi-0138":
    native: "thank you (formal)"
    notes:
      "n1": "Formal. Among family and close friends, thanking can sound distant, and is often left out."
    bases:
      "धन्यवाद": "thank you"
  "hi-0139":
    native: "thanks"
    notes:
      "n1": "The everyday word. Many speakers simply say 'thank you' in English."
    bases:
      "शुक्रिया": "thanks"
  "hi-0188":
    native: "My name is …"
    notes:
      "n1": "मेरा (mērā, my) is masculine because नाम (nām) is. Before a feminine word it is मेरी (mērī): मेरी भाषा (mērī bhāśā), my language."
    bases:
      "मेरा": "my"
  "hi-0189":
    native: "What is your name?"
  "hi-0190":
    native: "I'm from …"
    notes:
      "n1": "से (sē) is 'from', and comes after the place: मैं लंदन से हूँ (maim̐ landan sē hūm̐), I'm from London."
    bases:
      "मैं": "I"
      "हूँ": "to be"
  "hi-0140":
    native: "I don't know Hindi."
    notes:
      "n1": "Literally 'Hindi does not come to me'. आती (ātī) is feminine because हिंदी (hindī) is. Add थोड़ी-थोड़ी (thōṛī-thōṛī) for 'a little': मुझे थोड़ी-थोड़ी हिंदी आती है (mujhē thōṛī-thōṛī hindī ātī hai)।"
    bases:
      "मुझे": "I"
      "हिंदी": "Hindi"
      "आती": "to come; (of a language or skill) to be known"
  "hi-0141":
    native: "I'm still learning Hindi. (said by a man)"
    notes:
      "n1": "A woman says सीख रही हूँ (sīkh rahī hūm̐). अभी (abhī) is 'now, still'."
    bases:
      "मैं": "I"
      "हिंदी": "Hindi"
      "सीख": "to learn"
      "रहा": "to stay; to be (doing)"
      "हूँ": "to be"
  "hi-0142":
    native: "Please speak slowly."
    notes:
      "n1": "बोलिए (bōliē) is the polite request form of बोलना (bōlnā, to speak). The ending -इए (-iē) turns a verb into a polite request: बैठिए (baiṭhiē), please sit."
    bases:
      "धीरे": "slowly"
      "बोलिए": "to speak"
  "hi-0143":
    native: "Please say that again."
    bases:
      "बोलिए": "to speak"
  "hi-0362":
    native: "I didn't understand."
    bases:
      "मुझे": "I"
      "समझ": "to understand"
      "आया": "to come"
  "hi-0363":
    native: "Where is the toilet?"
    notes:
      "n1": "Signs say शौचालय (śaucālay). Speakers say टॉयलेट (ṭôylēṭ) or बाथरूम (bāthrūm)."
    bases:
      "टॉयलेट": "toilet"
  "hi-0361":
    native: "I'm lost. (said by a man)"
    notes:
      "n1": "A woman says खो गई हूँ (khō gaī hūm̐). जाना (jānā) changes its stem in the past: ग- (g-)."
    bases:
      "मैं": "I"
      "खो": "to be lost; to lose"
      "गया": "to go"
      "हूँ": "to be"
  "hi-0353":
    native: "Please help!"
    notes:
      "n1": "करना (karnā) changes its stem in the polite request: की- (kī-)."
    bases:
      "कीजिए": "to do; to make"
  "hi-0354":
    native: "Help! (in danger)"
    notes:
      "n1": "What you shout in danger: literally 'save me!'"
    bases:
      "बचाओ": "to save; to help (in danger)"
  "hi-0355":
    native: "Stop! Wait, please!"
    bases:
      "रुकिए": "to stop; to wait"
