cards:
  "hi-5568":
    native: "He is a good painter."
    confusables:
      "w1": { why: "Sculptor, not painter: मूर्तिकार (mūrtikār) means sculptor." }
      "w2": { why: "Poet, not painter: कवि (kavi) means poet." }
  "hi-5569":
    native: "My sister is a sitar player."
    bases:
      "मेरी": "my"
      "बहन": "sister"
      "सितार": "sitar"
    confusables:
      "w1": { why: "Musical instrument, not player: साज़ (sāz) means musical instrument." }
      "w2": { why: "Dancer, not player: नृत्यांगना (nrityāṅganā) means dancer (woman)." }
  "hi-5570":
    native: "Poets write about love in verse."
    bases:
      "प्रेम": "love"
      "लिखते": "write"
    confusables:
      "w1": { why: "Writing, not verse: लेखन (lēkhan) means writing." }
      "w2": { why: "Literature, not verse: साहित्य (sāhity) means literature." }
  "hi-5571":
    native: "We learn the sitar from a master."
    bases:
      "सितार": "sitar"
      "सीखते": "learn"
    confusables:
      "w1": { why: "Player, not master: वादक (vādak) means player (of an instrument)." }
      "w2": { why: "Sculptor, not master: मूर्तिकार (mūrtikār) means sculptor." }
  "hi-5572":
    native: "There are beautiful artworks in this exhibition."
    bases:
      "इस": "this"
      "सुंदर": "beautiful"
      "कलाकृतियाँ": "artworks"
    confusables:
      "w1": { why: "Paintbrush, not artwork: तूलिका (tūlikā) means paintbrush." }
      "w2": { why: "Composition, not exhibition: रचना (racnā) means composition; work of art." }
  "hi-5573":
    native: "The master teaches notes."
    bases:
      "सिखाते": "teach"
    confusables:
      "w1": { why: "Raga; melody, not note: राग (rāg) means raga; melody." }
      "w2": { why: "Rhythm, not note: ताल (tāl) means rhythm; beat." }
  "hi-5574":
    native: "The blend of raga and rhythm is beautiful."
    bases:
      "मेल": "blend"
      "सुंदर": "beautiful"
    confusables:
      "w1": { why: "Note; tune; pitch, not rhythm: सुर (sur) means note; tune; pitch." }
      "w2": { why: "Musical instrument, not raga: साज़ (sāz) means musical instrument." }
  "hi-5575":
    native: "The old composition is still popular today."
    bases:
      "पुरानी": "old"
      "लोकप्रिय": "popular"
    confusables:
      "w1": { why: "Artwork, close to composition: कलाकृति (kalākriti) means work of art; artwork." }
      "w2": { why: "Exhibition, not composition: प्रदर्शनी (pradarśanī) means exhibition." }
  "hi-5576":
    native: "Practise playing an instrument every day."
    bases:
      "बजाने": "playing"
      "कीजिए": "do (polite)"
    confusables:
      "w1": { why: "Player, not practice: वादक (vādak) means player (of an instrument)." }
      "w2": { why: "Master, not practice: उस्ताद (ustād) means master; expert." }
  "hi-5577":
    native: "A picture is made with a paintbrush."
    bases:
      "चित्र": "picture"
      "बनता": "is made"
    confusables:
      "w1": { why: "Sculptor, not painting: मूर्तिकार (mūrtikār) means sculptor." }
      "w2": { why: "Artwork: कलाकृति (kalākriti) means work of art; artwork." }
  "hi-5578":
    native: "The sculptor made a beautiful statue of stone."
    bases:
      "ने": "(ergative)"
      "पत्थर": "stone"
      "की": "of"
      "सुंदर": "beautiful"
      "मूर्ति": "statue"
      "बनाई": "made"
    confusables:
      "w1": { why: "Painter, not sculptor: चित्रकार (citrakār) means painter." }
      "w2": { why: "Paintbrush, not sculptor: तूलिका (tūlikā) means paintbrush." }
  "hi-5579":
    native: "He learnt songwriting."
    bases:
      "उसने": "he (ergative)"
      "गीत": "song"
      "सीखा": "learnt"
    confusables:
      "w1": { why: "Literature, not songwriting: साहित्य (sāhity) means literature." }
      "w2": { why: "Poet, not songwriting: कवि (kavi) means poet." }
