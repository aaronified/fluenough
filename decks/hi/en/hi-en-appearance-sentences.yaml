cards:
  "hi-1786":
    native: "Her shining eyes smile."
    confusables: {"w1": {"why": "A look, not a smile: सूरत (sūrat) is the face or the look of a face."}, "w2": {"why": "An age, not an eye: उम्र (umr) is how old someone is."}}
  "hi-1787":
    native: "He looks tall and fair."
    confusables: {"w1": {"why": "Short, not tall: नाटा (nāṭā) is the opposite of लंबा (lambā)."}, "w2": {"why": "Dark, not fair: सांवला (sāṁvalā) is dark-complexioned."}}
  "hi-1788":
    native: "In old age everyone becomes bald and thin."
    confusables: {"w1": {"why": "Youth, not old age: जवानी (javānī) is the time of being young."}, "w2": {"why": "Childhood, not old age: बचपन (bacpan) is the years of being a child."}}
