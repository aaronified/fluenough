schema: 1
id: "hi-en-careers"
kind: "layer"
core: "hi-careers"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Careers"
license: "CC-BY-SA-4.0"
description: "Work and careers: the jobs people do, how they are hired and what they hope for, and the words for skill, success and setbacks. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "hi-2336":
    native: "career"
    notes:
      "n1": "The work a person does through life, and the path of their jobs."
    examples:
      "उसका करियर अच्छा चल रहा है।": { "native": "His career is going well.", "bases": {} }
      "करियर के लिए पढ़ाई ज़रूरी है।": { "native": "Study is necessary for a career.", "bases": {"लिए": "for", "ज़रूरी": "necessary"} }
  "hi-2337":
    native: "profession; trade"
    notes:
      "n1": "The work one has trained for and does as one's living."
    examples:
      "उसका पेशा शिक्षक का है।": { "native": "His profession is teaching.", "bases": {} }
      "कोई भी पेशा छोटा नहीं होता।": { "native": "No profession is small.", "bases": {} }
  "hi-2338":
    native: "recruitment; hiring"
    notes:
      "n1": "The process of choosing people to fill a post or a job."
    examples:
      "सेना में भर्ती शुरू हुई।": { "native": "Recruitment to the army began.", "bases": {"शुरू": "start"} }
      "भर्ती के लिए आवेदन करो।": { "native": "Apply for recruitment.", "bases": {"लिए": "for"} }
  "hi-2339":
    native: "interview (formal)"
    notes:
      "n1": "A formal interview for a job, or a meeting with a person. The everyday word is इंटरव्यू (iṇṭaravyū)."
    examples:
      "साक्षात्कार कल होगा।": { "native": "The interview will be tomorrow.", "bases": {} }
      "साक्षात्कार में सच बोलो।": { "native": "Speak the truth at the interview.", "bases": {"सच": "truth"} }
  "hi-2340":
    native: "pilot"
    notes:
      "n1": "A person who flies an aircraft."
    examples:
      "पायलट ने विमान उड़ाया।": { "native": "The pilot flew the aircraft.", "bases": {"ने": "by", "विमान": "aircraft", "उड़ाया": "to fly"} }
      "मेरा भाई पायलट बनना चाहता है।": { "native": "My brother wants to become a pilot.", "bases": {} }
  "hi-2341":
    native: "artist; performer"
    notes:
      "n1": "A person who makes art, music, dance or acting for others to enjoy."
    examples:
      "वह एक अच्छा कलाकार है।": { "native": "He is a good artist.", "bases": {} }
      "कलाकार मंच पर गाना गा रहे हैं।": { "native": "The artists are singing on the stage.", "bases": {} }
  "hi-2342":
    native: "policeman"
    notes:
      "n1": "A man who serves in the police force."
    examples:
      "पुलिसवाला सड़क पर खड़ा है।": { "native": "The policeman is standing on the road.", "bases": {"खड़ा": "standing"} }
      "पुलिसवाले ने रास्ता बताया।": { "native": "The policeman showed the way.", "bases": {"पुलिसवाले": "policeman", "ने": "by"} }
  "hi-2343":
    native: "soldier"
    notes:
      "n1": "A member of an army, who fights for the country."
    examples:
      "सैनिक सरहद पर तैनात हैं।": { "native": "The soldiers are posted at the border.", "bases": {"तैनात": "posted"} }
      "सैनिक बहादुर होते हैं।": { "native": "Soldiers are brave.", "bases": {"बहादुर": "brave"} }
  "hi-2344":
    native: "businessman; trader"
    notes:
      "n1": "A person who runs a business, a trade or a company."
    examples:
      "वह एक सफल व्यवसायी है।": { "native": "He is a successful businessman.", "bases": {"सफल": "successful"} }
      "शहर के व्यवसायी मिले।": { "native": "The businessmen of the city met.", "bases": {} }
  "hi-2345":
    native: "business; trade"
    notes:
      "n1": "The buying and selling of goods, or the running of a firm."
    examples:
      "उसका कारोबार बड़ा है।": { "native": "His business is big.", "bases": {} }
      "कारोबार में मंदी है।": { "native": "There is a slump in business.", "bases": {"मंदी": "slump"} }
  "hi-2346":
    native: "enterprise; venture"
    notes:
      "n1": "A new business or project that is undertaken with effort."
    examples:
      "उसने नया उद्यम शुरू किया।": { "native": "He started a new enterprise.", "bases": {"शुरू": "start"} }
      "यह उद्यम सफल होगा।": { "native": "This venture will succeed.", "bases": {"सफल": "successful"} }
  "hi-2347":
    native: "progress; advancement"
    notes:
      "n1": "Going forward and up, in a career or in a country."
    examples:
      "देश की उन्नति हो रही है।": { "native": "The country is advancing.", "bases": {} }
      "उन्नति के लिए मेहनत करो।": { "native": "Work hard for progress.", "bases": {"लिए": "for", "मेहनत": "hard work"} }
  "hi-2348":
    native: "success"
    notes:
      "n1": "Achieving what one has set out to do. The opposite is असफलता (asphltā)."
    examples:
      "उसे बड़ी सफलता मिली।": { "native": "He achieved great success.", "bases": {} }
      "सफलता का रास्ता मेहनत से होकर जाता है।": { "native": "The road to success goes through hard work.", "bases": {"मेहनत": "hard work"} }
  "hi-2349":
    native: "failure"
    notes:
      "n1": "Not succeeding. The opposite is सफलता (saphltā), success."
    examples:
      "असफलता से मत डरो।": { "native": "Do not fear failure.", "bases": {"मत": "do not"} }
      "हर असफलता कुछ सिखाती है।": { "native": "Every failure teaches something.", "bases": {"हर": "every; each"} }
  "hi-2350":
    native: "dream"
    notes:
      "n1": "A picture of something one hopes to have or to do, seen in sleep or in the mind."
    examples:
      "मेरा सपना डॉक्टर बनना है।": { "native": "My dream is to become a doctor.", "bases": {} }
      "रात को अजीब सपना आया।": { "native": "I had a strange dream at night.", "bases": {} }
  "hi-2351":
    native: "skill; craft"
    notes:
      "n1": "A skill that a person has, especially with the hands."
    examples:
      "उसके हाथ में हुनर है।": { "native": "He has skill in his hands.", "bases": {} }
      "हुनर सीखना आसान नहीं।": { "native": "Learning a skill is not easy.", "bases": {} }
  "hi-2352":
    native: "skill; expertise"
    notes:
      "n1": "A trained ability to do something well. It is a more formal word than हुनर (hunar)."
    examples:
      "इस काम के लिए कौशल चाहिए।": { "native": "This work needs skill.", "bases": {"लिए": "for"} }
      "कौशल विकास ज़रूरी है।": { "native": "Developing skill is necessary.", "bases": {"विकास": "development", "ज़रूरी": "necessary"} }
  "hi-2353":
    native: "training"
    notes:
      "n1": "Teaching someone a job or skill, in a planned way."
    examples:
      "नए कर्मचारियों का प्रशिक्षण हुआ।": { "native": "The new staff were trained.", "bases": {} }
      "प्रशिक्षण के बाद नौकरी मिलेगी।": { "native": "After training you will get a job.", "bases": {"बाद": "after"} }
  "hi-2354":
    native: "labourer"
    notes:
      "n1": "A person who does hard physical work for wages."
    examples:
      "मजदूर सुबह काम पर जाते हैं।": { "native": "Labourers go to work in the morning.", "bases": {} }
      "मजदूरों की मज़दूरी बढ़ी।": { "native": "The labourers' wages have risen.", "bases": {"मजदूरों": "labourer", "मज़दूरी": "wages", "बढ़ी": "to rise"} }
  "hi-2355":
    native: "gardener"
    notes:
      "n1": "A person who looks after plants and gardens for a living."
    examples:
      "माली पौधों को पानी दे रहा है।": { "native": "The gardener is watering the plants.", "bases": {} }
      "माली बगीचा सजाता है।": { "native": "The gardener decorates the garden.", "bases": {} }
  "hi-2356":
    native: "sailor; boatman"
    notes:
      "n1": "A person who steers or works a boat or a ship."
    examples:
      "नाविक नाव चला रहा है।": { "native": "The boatman is rowing the boat.", "bases": {} }
      "नाविक ने हमें नदी पार कराई।": { "native": "The boatman took us across the river.", "bases": {"ने": "by", "पार": "across", "कराई": "to get done"} }
  "hi-2357":
    native: "cook"
    notes:
      "n1": "A person who cooks food for a house, a hotel or a shop."
    examples:
      "रसोइया खाना बनाता है।": { "native": "The cook makes the food.", "bases": {} }
      "रसोइये को सब्ज़ी लाने भेजो।": { "native": "Send the cook to bring vegetables.", "bases": {"रसोइये": "cook"} }
  "hi-2358":
    native: "office peon; attendant"
    notes:
      "n1": "A person who runs errands and serves in an office."
    examples:
      "चपरासी ने चाय दी।": { "native": "The peon gave tea.", "bases": {"ने": "by"} }
      "चपरासी को फ़ाइल दो।": { "native": "Give the file to the peon.", "bases": {} }
  "hi-2359":
    native: "consultant; adviser"
    notes:
      "n1": "A person who gives expert advice for payment or as a helper."
    examples:
      "हमारे सलाहकार बहुत अनुभवी हैं।": { "native": "Our consultants are very experienced.", "bases": {"अनुभवी": "experienced"} }
      "सलाहकार से राय लो।": { "native": "Take advice from the consultant.", "bases": {} }
  "hi-2360":
    native: "unemployed"
    notes:
      "n1": "Without a job, though looking for one."
    examples:
      "वह अभी बेरोज़गार है।": { "native": "He is unemployed for now.", "bases": {} }
      "बेरोज़गार लोगों की मदद करो।": { "native": "Help the unemployed people.", "bases": {} }
  "hi-2361":
    native: "retired"
    notes:
      "n1": "No longer working, after reaching the age to stop work."
    examples:
      "पिताजी अब सेवानिवृत्त हैं।": { "native": "Father is now retired.", "bases": {"पिताजी": "father"} }
      "सेवानिवृत्त लोग घूमते हैं।": { "native": "Retired people go out and about.", "bases": {} }
