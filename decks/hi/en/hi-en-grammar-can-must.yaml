schema: 1
id: "hi-en-grammar-can-must"
kind: "layer"
core: "hi-grammar-can-must"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Can, want to, have to"
license: "CC0-1.0"
description: "सकना (saknā), चाहना (cāhnā), चाहिए (cāhiē), पड़ना (paṛnā) and पाना (pānā) with another verb. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0513":
    native: "to be able; can"
    notes:
      "n1": "After a verb's stem: बोल सकता हूँ (bōl saktā hūm̐), I can speak."
  "hi-0514":
    native: "I can speak Hindi. (said by a man)"
    bases:
      "मैं": "I"
      "हिंदी": "Hindi"
      "बोल": "to speak"
      "हूँ": "to be"
  "hi-0515":
    native: "I can't swim. (said by a woman)"
    bases:
      "मैं": "I"
      "तैर": "to swim"
  "hi-0516":
    native: "Could you help me?"
    bases:
      "मेरी": "my"
      "कर": "to do; to make"
  "hi-0517":
    native: "I want to go home. (said by a man)"
    bases:
      "मैं": "I"
      "जाना": "to go"
      "चाहता": "to want"
      "हूँ": "to be"
  "hi-0518":
    native: "You should rest."
    notes:
      "n1": "The -ना (-nā) form with चाहिए (cāhiē) is 'should'."
    bases:
      "आराम": "rest"
      "करना": "to do; to make"
  "hi-0519":
    native: "I have to go to work tomorrow."
    bases:
      "मुझे": "I"
      "जाना": "to go"
  "hi-0520":
    native: "I'll have to go."
    notes:
      "n1": "पड़ना (paṛnā) says you have no choice; होना है (hōnā hai) is milder."
    bases:
      "मुझे": "I"
      "जाना": "to go"
  "hi-0521":
    native: "I couldn't make it. (said by a man)"
    notes:
      "n1": "पाना (pānā) is 'to manage to'. A woman says नहीं आ पाई (nahīm̐ ā pāī)."
    bases:
      "मैं": "I"
      "पाया": "to be able to"
  "hi-0522":
    native: "Can one take photos here?"
    bases:
      "फ़ोटो": "photo"
      "ले": "to take"
