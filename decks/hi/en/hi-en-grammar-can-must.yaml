schema: 1
id: "hi-en-grammar-can-must"
kind: "layer"
core: "hi-grammar-can-must"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Can, want to, have to"
license: "CC-BY-SA-4.0"
description: "सकना (saknā), चाहना (cāhnā), चाहिए (cāhiē), पड़ना (paṛnā) and पाना (pānā) with another verb. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0513":
    native: "to be able; can"
    notes:
      "n1": "After a verb's stem: बोल सकता हूँ (bōl saktā hūm̐), I can speak."
    "examples": {
      "मैं तैर नहीं सकती।": {"native": "I can't swim. (said by a woman)", "bases": {"मैं": "I", "तैर": "to swim", "सकती": "to be able; can"}},
      "मैं गरमी नहीं सह सकता।": {"native": "I cannot bear the heat.", "bases": {"गरमी": "heat", "सह": "to bear", "सकता": "to be able; can"}}
    }
  "hi-0514":
    native: "I can speak Hindi. (said by a man)"
    notes:
      "n1": "सकता (saktā) हूँ (hūm̐) is said by a man; a woman says सकती (saktī) हूँ (hūm̐)."
    bases:
      "मैं": "I"
      "हिंदी": "Hindi"
      "बोल": "to speak"
      "हूँ": "to be"
  "hi-0515":
    native: "I can't swim. (said by a woman)"
    notes:
      "n1": "नहीं (nahīm̐) comes before the modal, so the negative is नहीं (nahīm̐) सकती (saktī), said by a woman."
    bases:
      "मैं": "I"
      "तैर": "to swim"
  "hi-0516":
    native: "Could you help me?"
    notes:
      "n1": "सकते (saktē) हैं (haim̐) is plural because आप (āp), you, the polite form, takes plural verb endings."
    bases:
      "मेरी": "my"
      "कर": "to do; to make"
  "hi-0517":
    native: "I want to go home. (said by a man)"
    notes:
      "n1": "चाहता (cāhtā) हूँ (hūm̐) is said by a man; a woman says चाहती (cāhtī) हूँ (hūm̐)."
    bases:
      "मैं": "I"
      "जाना": "to go"
      "चाहता": "to want"
      "हूँ": "to be"
  "hi-0518":
    native: "You should rest."
    notes:
      "n1": "The -ना (-nā) form with चाहिए (cāhiē) is 'should'."
    bases:
      "आराम": "rest"
      "करना": "to do; to make"
  "hi-0519":
    native: "I have to go to work tomorrow."
    notes:
      "n1": "मुझे (mujhē), to me, with जाना (jānā) है (hai), has to go: है (hai) is singular because the infinitive जाना (jānā) is the subject."
    bases:
      "मुझे": "I"
      "जाना": "to go"
  "hi-0520":
    native: "I'll have to go."
    notes:
      "n1": "पड़ना (paṛnā) says you have no choice; होना है (hōnā hai) is milder."
    bases:
      "मुझे": "I"
      "जाना": "to go"
  "hi-0521":
    native: "I couldn't make it. (said by a man)"
    notes:
      "n1": "पाना (pānā) is 'to manage to'. A woman says नहीं आ पाई (nahīm̐ ā pāī)."
    bases:
      "मैं": "I"
      "पाया": "to be able to"
  "hi-0522":
    native: "Can one take photos here?"
    notes:
      "n1": "सकते (saktē) हैं (haim̐) here asks whether one is allowed to do something, like 'Can one ...?'"
    bases:
      "फ़ोटो": "photo"
      "ले": "to take"
