cards:
  "hi-5072":
    native: "I need help."
    confusables:
      "w1": { why: "Medicine, not help: दवाई (davāī) means medicine." }
      "w2": { why: "Money, not help: पैसे (paisē) means money." }
  "hi-5073":
    native: "The police will help."
    confusables:
      "w1": { why: "Doctor, not police: डॉक्टर (ḍôkṭar) means doctor." }
      "w2": { why: "Hospital, not police: अस्पताल (aspatāl) means hospital." }
  "hi-5074":
    native: "I have to go to the doctor."
    confusables:
      "w1": { why: "Hospital, not doctor: अस्पताल (aspatāl) means hospital." }
      "w2": { why: "Police, not doctor: पुलिस (pulis) means police." }
  "hi-5075":
    native: "I need medicine."
    confusables:
      "w1": { why: "Pain, not medicine: दर्द (dard) means pain." }
      "w2": { why: "Hospital, not medicine: अस्पताल (aspatāl) means hospital." }
  "hi-5076":
    native: "I have a headache."
    confusables:
      "w1": { why: "Medicine, not pain: दवाई (davāī) means medicine." }
      "w2": { why: "Doctor, not pain: डॉक्टर (ḍôkṭar) means doctor." }
  "hi-5077":
    native: "Please call the police."
    bases:
      "फ़ोन": "phone"
    confusables:
      "w1": { why: "Doctor, not police: डॉक्टर (ḍôkṭar) means doctor." }
      "w2": { why: "Hospital, not police: अस्पताल (aspatāl) means hospital." }
  "hi-5078":
    native: "Where is the hospital?"
    confusables:
      "w1": { why: "When, not where: कब (kab) means when." }
      "w2": { why: "Who, not where: कौन (kaun) means who." }
  "hi-5079":
    native: "He is in pain."
    confusables:
      "w1": { why: "Medicine, not pain: दवाई (davāī) means medicine." }
      "w2": { why: "Help, not pain: मदद (madad) means help." }
  "hi-5080":
    native: "The doctor will come now."
    confusables:
      "w1": { why: "Hospital, not doctor: अस्पताल (aspatāl) means hospital." }
      "w2": { why: "Police, not doctor: पुलिस (pulis) means police." }
  "hi-5081":
    native: "Thanks for the help."
    bases:
      "लिए": "for"
      "शुक्रिया": "thanks"
    confusables:
      "w1": { why: "Please (written), not thanks: कृपया (kripayā) means please." }
      "w2": { why: "Forbidden, not thanks: निषेध (niśēdh) means forbidden (on signs)." }
