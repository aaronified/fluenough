  notes: "The past continuous is the verb stem, then रहा (rahā), रही (rahī) or रहे (rahē) for what is going on, then the past of होना (hōnā): था (thā), थी (thī), थे (thē) or थीं (thīm̐). The ending follows the doer, as in the present: मैं जा रहा था (maim̐ jā rahā thā) for a man and मैं जा रही थी (maim̐ jā rahī thī) for a woman. Plural subjects, हम (ham), आप (āp) and वे (vē), take रहे थे (rahē thē) for men and रही थीं (rahī thīm̐) for women."
