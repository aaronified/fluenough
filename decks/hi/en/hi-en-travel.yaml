schema: 1
id: "hi-en-travel"
kind: "layer"
core: "hi-travel"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Travel and sights"
license: "CC-BY-SA-4.0"
description: "Seeing a place as a visitor: the sights, the old buildings and museums, the tour, the money and the foreign lands. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "hi-2214":
    native: "worth seeing; scenic"
    notes:
      "n1": "Worth going to see, as a place or a building is. The noun phrase is दर्शनीय स्थल (darśanīy sthal), a sight."
    examples:
      "यह शहर बहुत दर्शनीय है।": { "native": "This city is very worth seeing.", "bases": {} }
      "पहाड़ी रास्ते दर्शनीय हैं।": { "native": "The hill roads are scenic.", "bases": {"पहाड़ी": "hilly"} }
  "hi-2215":
    native: "site; place"
    notes:
      "n1": "A place, especially one of interest, as a historic site is."
    examples:
      "यह ऐतिहासिक स्थल है।": { "native": "This is a historic site.", "bases": {"ऐतिहासिक": "historic"} }
      "स्थल तक पैदल जाओ।": { "native": "Walk to the site.", "bases": {"पैदल": "on foot"} }
  "hi-2216":
    native: "church"
    notes:
      "n1": "A building for Christian worship."
    examples:
      "गिरजा बहुत पुराना है।": { "native": "The church is very old.", "bases": {} }
      "रविवार को गिरजा खुलता है।": { "native": "On Sunday the church opens.", "bases": {"खुलता": "to open"} }
  "hi-2217":
    native: "fort"
    notes:
      "n1": "A strong building with high walls, built to guard a place."
    examples:
      "यह किला पहाड़ पर है।": { "native": "This fort is on the hill.", "bases": {} }
      "किला बहुत ऊँचा है।": { "native": "The fort is very high.", "bases": {} }
  "hi-2218":
    native: "palace"
    notes:
      "n1": "A large house of a king or a noble, often very grand."
    examples:
      "राजा का महल बड़ा है।": { "native": "The king's palace is big.", "bases": {"राजा": "king"} }
      "महल के बगीचे देखो।": { "native": "See the gardens of the palace.", "bases": {} }
  "hi-2219":
    native: "museum"
    notes:
      "n1": "A building where old and important objects are kept for people to see."
    examples:
      "संग्रहालय सोमवार को बंद रहता है।": { "native": "The museum is closed on Monday.", "bases": {} }
      "हम संग्रहालय गए।": { "native": "We went to the museum.", "bases": {} }
  "hi-2220":
    native: "memorable"
    notes:
      "n1": "Worth remembering. The noun for a memento is also यादगार (yādgār)."
    examples:
      "यह सफ़र यादगार था।": { "native": "This trip was memorable.", "bases": {} }
      "यादगार तस्वीर खींचो।": { "native": "Take a memorable picture.", "bases": {} }
  "hi-2221":
    native: "tour"
    notes:
      "n1": "A trip made to see several places, with a guide."
    examples:
      "कल हमारा टूर शुरू होगा।": { "native": "Our tour will start tomorrow.", "bases": {"शुरू": "start"} }
      "टूर में कितने लोग हैं?": { "native": "How many people are in the tour?", "bases": {} }
  "hi-2222":
    native: "host"
    notes:
      "n1": "The person who welcomes and looks after guests."
    examples:
      "मेज़बान ने चाय दी।": { "native": "The host gave tea.", "bases": {"ने": "by"} }
      "हम मेज़बान के घर ठहरे।": { "native": "We stayed at the host's house.", "bases": {} }
  "hi-2223":
    native: "unknown; unfamiliar; stranger"
    notes:
      "n1": "Not known, or not familiar, as a place or a person is."
    examples:
      "यह शहर मेरे लिए अनजान है।": { "native": "This city is unknown to me.", "bases": {"लिए": "for"} }
      "अनजान लोगों से मत बोलो।": { "native": "Do not talk to strangers.", "bases": {"मत": "do not"} }
  "hi-2224":
    native: "foreign land; abroad"
    notes:
      "n1": "A country other than one's own, or going abroad."
    examples:
      "वह विदेश गया है।": { "native": "He has gone abroad.", "bases": {} }
      "विदेश में पढ़ाई करना सपना है।": { "native": "Studying abroad is a dream.", "bases": {"सपना": "dream"} }
  "hi-2225":
    native: "foreign"
    notes:
      "n1": "Belonging to a foreign country. Used of a person or a thing."
    examples:
      "यह विदेशी कार है।": { "native": "This is a foreign car.", "bases": {"कार": "car"} }
      "बहुत से विदेशी लोग आते हैं।": { "native": "Many foreign people come.", "bases": {} }
  "hi-2226":
    native: "currency"
    notes:
      "n1": "The money used in a country, such as the rupee or the dollar."
    examples:
      "इस देश की मुद्रा रुपया है।": { "native": "The currency of this country is the rupee.", "bases": {} }
      "विदेशी मुद्रा बदलवाओ।": { "native": "Change the foreign currency.", "bases": {"बदलवाओ": "to get changed"} }
  "hi-2227":
    native: "money; coin"
    notes:
      "n1": "Money in general, or a small coin."
    examples:
      "मेरे पास पैसा नहीं है।": { "native": "I have no money.", "bases": {} }
      "पैसा बचाओ।": { "native": "Save money.", "bases": {} }
  "hi-2228":
    native: "tourism"
    notes:
      "n1": "The business and the act of travelling for pleasure and sightseeing."
    examples:
      "पर्यटन से आय होती है।": { "native": "Tourism brings income.", "bases": {"आय": "income"} }
      "यह राज्य पर्यटन के लिए मशहूर है।": { "native": "This state is famous for tourism.", "bases": {"पर्यटन": "tourism", "लिए": "for"} }
  "hi-2229":
    native: "to show around; to turn round"
    notes:
      "n1": "To take someone round a place, or to turn a thing round."
    examples:
      "हमें शहर घुमाओ।": { "native": "Show us round the city.", "bases": {"घुमाओ": "to show round"} }
      "गाइड ने हमें किला घुमाया।": { "native": "The guide showed us the fort.", "bases": {"ने": "by", "घुमाया": "to show round"} }
  "hi-2230":
    native: "picture; photograph"
    notes:
      "n1": "A picture or a photograph of a person or a scene."
    examples:
      "हम साथ में तस्वीर खींचेंगे।": { "native": "We will take a photo together.", "bases": {} }
      "यह तस्वीर बहुत सुंदर है।": { "native": "This picture is very beautiful.", "bases": {} }
  "hi-2231":
    native: "monument; memorial"
    notes:
      "n1": "A building or statue built to remember a person or an event."
    examples:
      "यह स्मारक बहुत पुराना है।": { "native": "This monument is very old.", "bases": {} }
      "स्मारक के सामने तस्वीर लो।": { "native": "Take a picture in front of the monument.", "bases": {"सामने": "in front"} }
  "hi-2232":
    native: "view; scene"
    notes:
      "n1": "A beautiful view or a sight that is seen from a place."
    examples:
      "पहाड़ से नज़ारा सुंदर है।": { "native": "The view from the hill is beautiful.", "bases": {} }
      "कितना अच्छा नज़ारा है!": { "native": "What a lovely view!", "bases": {} }
  "hi-2233":
    native: "zoo"
    notes:
      "n1": "A place where wild animals and birds are kept for people to see."
    examples:
      "बच्चे चिड़ियाघर जाना चाहते हैं।": { "native": "The children want to go to the zoo.", "bases": {} }
      "चिड़ियाघर में शेर देखा।": { "native": "I saw a lion in the zoo.", "bases": {} }
  "hi-2234":
    native: "statue; idol"
    notes:
      "n1": "A figure made of stone, metal or clay, of a person or a god."
    examples:
      "चौक पर मूर्ति है।": { "native": "There is a statue in the square.", "bases": {"चौक": "square"} }
      "मूर्ति बहुत सुंदर है।": { "native": "The statue is very beautiful.", "bases": {} }
  "hi-2235":
    native: "dome"
    notes:
      "n1": "The round roof of a building such as a mosque or a tomb."
    examples:
      "मकबरे का गुंबद सफ़ेद है।": { "native": "The dome of the tomb is white.", "bases": {"मकबरे": "tomb"} }
      "गुंबद पर धूप चमकती है।": { "native": "The sun shines on the dome.", "bases": {} }
  "hi-2236":
    native: "colourful; coloured"
    notes:
      "n1": "Full of colours, bright and many-coloured."
    examples:
      "बाज़ार रंगीन है।": { "native": "The market is colourful.", "bases": {} }
      "उसने रंगीन कपड़े पहने हैं।": { "native": "He is wearing coloured clothes.", "bases": {} }
  "hi-2237":
    native: "stage; platform"
    notes:
      "n1": "The raised floor on which a performer or a speaker stands."
    examples:
      "मंच पर नाच हो रहा है।": { "native": "There is a dance on the stage.", "bases": {} }
      "मंच के सामने बैठो।": { "native": "Sit in front of the stage.", "bases": {"सामने": "in front"} }
