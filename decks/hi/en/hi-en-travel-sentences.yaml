      "देखने": "to see"
      "जाएँगे": "will go"
    confusables:
      "w1": { why: "Zoo, not museum: चिड़ियाघर (ciṛiyāghar) means zoo." }
      "w2": { why: "Stage, not museum: मंच (mañc) means stage; platform." }
  "hi-5350":
