cards:
  "hi-5786":
    native: "The ice melted in the sunshine."
    bases:
      "पिघल": "melt"
      "गई": "(completed action, feminine)"
    confusables:
      "w1": { why: "Wind or air, not ice: हवा (havā) means wind or air." }
      "w2": { why: "Milk, not ice: दूध (dūdh) means milk." }
  "hi-5787":
    native: "The milk boiled over."
    bases:
      "उबल": "boil over"
      "गया": "(completed action)"
    confusables:
      "w1": { why: "Water, not milk: पानी (pānī) means water." }
      "w2": { why: "Food, not milk: खाना (khānā) means food." }
  "hi-5788":
    native: "The light went out."
    bases:
      "बुझ": "go out"
      "गई": "(completed action, feminine)"
    confusables:
      "w1": { why: "Wind or air, not light: हवा (havā) means wind or air." }
      "w2": { why: "Snow or ice, not light: बर्फ़ (barf) means snow or ice." }
  "hi-5789":
    native: "The child jumped just now."
    bases:
      "कूदा": "jumped"
    confusables:
      "w1": { why: "To read, not jump: पढ़ना (paṛhnā) means to read." }
      "w2": { why: "To fall, not jump: पड़ना (paṛnā) means to fall or to have to." }
  "hi-5790":
    native: "I lost my way on the road."
    bases:
      "रास्ते": "road, way (oblique)"
      "भटक": "lost (wandered)"
      "गया": "(completed action)"
    confusables:
      "w1": { why: "Door, not way: दरवाज़ा (darvāzā) means door." }
      "w2": { why: "Tree, not way: पेड़ (pēṛ) means tree." }
  "hi-5791":
    native: "He held the rope."
    bases:
      "उसने": "he, she (agent)"
      "थामी": "held (feminine)"
    confusables:
      "w1": { why: "Light, not rope: बत्ती (battī) means light." }
      "w2": { why: "Bag, not rope: बैग (baig) means bag." }
  "hi-5792":
    native: "He chewed the biscuit."
    bases:
      "उसने": "he, she (agent)"
      "बिस्कुट": "biscuit"
      "चबाया": "chewed"
    confusables:
      "w1": { why: "Flatbread, not biscuit: रोटी (rōṭī) means flatbread." }
      "w2": { why: "Apple, not biscuit: सेब (sēb) means apple." }
  "hi-5793":
    native: "Mother is squeezing the lemon."
    bases:
      "निचोड़": "squeeze"
      "रही": "(continuing action, feminine)"
      "है": "is"
    confusables:
      "w1": { why: "Apple, not lemon: सेब (sēb) means apple." }
      "w2": { why: "Banana, not lemon: केला (kēlā) means banana." }
  "hi-5794":
    native: "I smelled the flower."
    bases:
      "मैंने": "I (agent)"
      "सूँघा": "smelled"
    confusables:
      "w1": { why: "Tree, not flower: पेड़ (pēṛ) means tree." }
      "w2": { why: "Seed, not flower: बीज (bīj) means seed." }
  "hi-5795":
    native: "Taste the food first."
    bases:
      "चखिए": "taste (polite)"
    confusables:
      "w1": { why: "Water, not food: पानी (pānī) means water." }
      "w2": { why: "Flatbread, not food: रोटी (rōṭī) means flatbread." }
  "hi-5796":
    native: "The farmer is sowing seeds in the field."
    bases:
      "बो": "sow"
      "रहा": "(continuing action, masculine)"
      "है": "is"
    confusables:
      "w1": { why: "Flower, not seed: फूल (phūl) means flower." }
      "w2": { why: "Tree, not seed: पेड़ (pēṛ) means tree." }
  "hi-5797":
    native: "I broke the door."
    bases:
      "मैंने": "I (agent)"
      "तोड़ा": "broke"
    confusables:
      "w1": { why: "Home, not door: घर (ghar) means home." }
      "w2": { why: "Room, not door: कमरा (kamrā) means room." }
