schema: 1
id: "hi-en-market"
kind: "layer"
core: "hi-market"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Market"
license: "CC0-1.0"
description: "Asking the price, bargaining, paying: what a market stall needs."
cards:
  "hi-0231":
    native: "How much is it?"
    notes:
      "n1": "For several things: कितने के हैं? (kitne ke hain?). Often just कितने का (kitnē kā)? with a point at the thing."
  "hi-0232":
    native: "price"
    notes:
      "n1": "Also कीमत (kīmat), feminine."
  "hi-0233":
    native: "rupee"
    notes:
      "n1": "More than one: रुपये (rupayē). सौ रुपये (sau rupyē), a hundred rupees."
  "hi-0234":
    native: "money"
    notes:
      "n1": "A पैसा (paisā) is a hundredth of a rupee, but the plural पैसे (paisē) is the everyday word for money: पैसे नहीं हैं (paisē nahīm̐ haim̐), I have no money."
  "hi-0235":
    native: "change; small notes and coins"
    notes:
      "n1": "खुले पैसे हैं (khulē paisē haim̐)? Do you have change?"
    bases:
      "खुले": "open; loose (of money, change)"
  "hi-0236":
    native: "expensive"
    notes:
      "n1": "Agrees with the thing: महँगी (maham̐gī) with a feminine word. बहुत महँगा है (bahut maham̐gā hai)! It's very expensive!"
  "hi-0237":
    native: "cheap"
    notes:
      "n1": "Feminine सस्ती (sastī)."
  "hi-0238":
    native: "Please lower it a little."
    notes:
      "n1": "The polite way to bargain. Bargaining is expected at street stalls and markets, not in shops with fixed prices. करना (karnā) changes its stem in the polite request: की- (kī-)."
    bases:
      "थोड़ा": "a little; some"
      "कीजिए": "to do; to make"
  "hi-0239":
    native: "shop"
  "hi-0240":
    native: "please give (me)"
    notes:
      "n1": "The polite request form of देना (dēnā, to give). एक किलो दीजिए (ēk kilō dījiē), a kilo, please."
  "hi-0241":
    native: "kilo"
    notes:
      "n1": "आधा किलो (ādhā kilō) is half a kilo."
  "hi-0242":
    native: "that's all; enough"
    notes:
      "n1": "In a shop, बस (bas) means 'that's all'. It also means 'bus'."
