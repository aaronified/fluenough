schema: 1
id: "hi-en-phonology-vowels"
kind: "layer"
core: "hi-phonology-vowels"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hindustani vowel sounds (IPA)"
description: "The vowels of Hindustani, one card each, with the nasal vowels last: the IPA symbol, the Devanagari and Urdu spellings, example words and, where this course's words give one, a minimal pair. For learners who know the IPA or want to learn it. Variety taught: the standard Delhi variety of Hindustani, Hindi and Urdu together. This is a proposal, not yet confirmed by the owner, a Hindi or Urdu speaker or a phonetician. Where a sound belongs to Urdu or to Persian and Arabic loans only, the card says so, and the Urdu script is given beside the Devanagari wherever they differ."
license: "CC-BY-SA-4.0"
authors:
  - { name: "Fluenough contributors" }
  - { name: "Wikipedia contributors (Hindustani phonology; Help:IPA/Hindi and Urdu)", url: "https://en.wikipedia.org/wiki/Hindustani_phonology" }
source: "Ohala (1999), 'Hindi', in the Handbook of the International Phonetic Association, Cambridge University Press, pp. 100-103 (the IPA's own Handbook; Wikipedia names no 'Illustration of the IPA' in the Journal of the International Phonetic Association for Hindi or Urdu, and none could be checked); also as cited by Wikipedia: Shapiro (2003), 'Hindi', and Schmidt (2003), 'Urdu', in Cardona and Jain (eds), The Indo-Aryan Languages, Routledge; Masica (1991), The Indo-Aryan Languages, Cambridge University Press; Kachru (2006), Hindi; Hussein (1997), Phonetic Correlates of Lexical Stress in Urdu. Text adapted from Wikipedia, 'Hindustani phonology' and 'Help:IPA/Hindi and Urdu', CC BY-SA 4.0, https://en.wikipedia.org/wiki/Hindustani_phonology"
tags: ["ipa", "phonology", "unreviewed"]
cards:
  "hi-1191":
    native: "short mid central vowel (ə); Hindi अ (a), Urdu اَ (a)"
    notes:
      "n1": "The source says ə is often said more open than mid, as near-open ɐ, and that it is subject to schwa deletion within a word in some contexts, and tends to vanish if its syllable is unaccented. Urdu leaves short vowels unwritten in most texts. Between h and a rounded vowel it can be said ɔ (see the allophones deck)."
      "n2": "Minimal pair among this course's words: {1}, less; few, and {2}, work, differ only in the vowel, ə against aː."
      "n3": "Minimal pair among this course's words: {1}, moment, and {2}, bridge, differ only in the vowel, ə against ʊ."
    examples:
      "कल": "tomorrow; yesterday"
      "घर": "house; home"
  "hi-1192":
    native: "long open central vowel (aː); Hindi आ (ā), Urdu ا (ā) and آ (ā)"
    notes:
      "n1": "The IPA writes it aː or ɑː. In Urdu there is also a short a at the end of a word, spelled ہ (ha), as in کمرہ (kamra), room, which differs from aː spelled ا (ā), as in لڑکا (laṛkā), boy. The contrast is often not made by Urdu speakers and is always neutral in Hindi, where both are aː."
      "n2": "Minimal pair among this course's words: {1}, less; few, and {2}, work, differ only in the vowel, ə against aː."
    examples:
      "काम": "work"
      "नाम": "name"
  "hi-1193":
    native: "short close front vowel (ɪ); Hindi इ (i), Urdu اِ (i)"
    notes:
      "n1": "The sources write ɪ, not i. Among the close vowels, what Sanskrit spelled as length differences, i and ī, became differences of quality, or of length with quality, in Hindustani: ɪ and iː, ʊ and uː. The help page compares ɪ to the 'i' of 'still'. Urdu leaves short vowels unwritten in most texts."
      "n2": "Minimal pair among this course's words: {1}, day, and {2}, poor; humble, differ only in the vowel, ɪ against iː."
    examples:
      "दिन": "day"
      "फिर": "then; again"
  "hi-1194":
    native: "long close front vowel (iː); Hindi ई (ī), Urdu ای (ī) and ی (ī)"
    notes:
      "n1": "The help page compares it to the 'ee' of 'fee'. The source says the length opposition of the close vowels is neutral at the end of a word, where only the long ones occur: a Sanskrit loan that had a short close vowel there is said with a long one, so शक्ति (śakti), energy, is said śaktī, and वस्तु (vastu), item, vastū."
      "n2": "Minimal pair among this course's words: {1}, day, and {2}, poor; humble, differ only in the vowel, ɪ against iː."
    examples:
      "बीस": "20, twenty"
      "तीन": "3, three"
  "hi-1195":
    native: "short close back vowel (ʊ); Hindi उ (u), Urdu اُ (u)"
    notes:
      "n1": "The sources write ʊ, not u. The help page compares it to the 'oo' of 'book'. Urdu leaves short vowels unwritten in most texts."
      "n2": "Minimal pair among this course's words: {1}, heard, and {2}, empty; deserted, differ only in the vowel, ʊ against uː."
      "n3": "Minimal pair among this course's words: {1}, moment, and {2}, bridge, differ only in the vowel, ə against ʊ."
    examples:
      "पुल": "bridge"
      "कुछ": "something; some; a little"
  "hi-1196":
    native: "long close back vowel (uː); Hindi ऊ (ū), Urdu او (ū) and و (ū)"
    notes:
      "n1": "The help page compares it to the 'oo' of 'moon'."
      "n2": "Minimal pair among this course's words: {1}, heard, and {2}, empty; deserted, differ only in the vowel, ʊ against uː."
    examples:
      "दूध": "milk"
      "आलू": "potato"
  "hi-1197":
    native: "long close-mid front vowel (eː); Hindi ए (ē), Urdu ے (ē) and ی (ē)"
    notes:
      "n1": "The help page compares it to the 'a' of 'mate'."
      "n2": "Minimal pair among this course's words: {1}, to bring, and {2}, to take, differ only in the vowel, aː against eː."
      "n3": "Minimal pair among this course's words: {1}, to play, and {2}, to open, differ only in the vowel, eː against oː."
    examples:
      "देश": "country"
      "एक": "1, one"
  "hi-1198":
    native: "long open-mid front vowel (ɛː); Hindi ऐ (ai), Urdu اَے (ai)"
    notes:
      "n1": "The letter ऐ (ai) is said as one long vowel. The sources differ on its symbol: Ohala (1999) writes ɛː, and Shapiro (2003) and Masica (1991) write æː. This card follows Wikipedia, which writes ɛː so as to keep æː for the English-loan vowel. The help page compares it to the 'ai' of 'fairy'."
      "n2": "Minimal pair among this course's words: {1}, foot; leg, and {2}, on; at, differ only in the vowel, ɛː against ə."
    examples:
      "है": "is"
      "भैया": "brother; to a man of about your age"
  "hi-1199":
    native: "long close-mid back vowel (oː); Hindi ओ (ō), Urdu و (ō)"
    notes:
      "n1": "The help page compares it to the 'o' of 'force'."
      "n2": "Minimal pair among this course's words: {1}, to sleep, and {2}, empty; deserted, differ only in the vowel, oː against uː."
      "n3": "Minimal pair among this course's words: {1}, to play, and {2}, to open, differ only in the vowel, eː against oː."
    examples:
      "दो": "2, two"
      "लोग": "people"
  "hi-1200":
    native: "long open-mid back vowel (ɔː); Hindi औ (au), Urdu اَو (au)"
    notes:
      "n1": "The letter औ (au) is said as one long vowel. The help page compares it to the 'o' of 'lot' in Received Pronunciation, long."
      "n2": "Minimal pair among this course's words: {1}, 100, a hundred, and {2}, from; with; by; since, differ only in the vowel, ɔː against eː."
      "n3": "Minimal pair among this course's words: {1}, who, and {2}, ear, differ only in the vowel, ɔː against aː."
    examples:
      "और": "and"
      "कौन": "who"
  "hi-1201":
    native: "short open-mid back vowel (ɔ); Hindi ऑ (ô), and a variant of ə near ɦ"
    notes:
      "n1": "The source says ɔ occurs near ɦ when ɦ is between a schwa on one side and a round vowel on the other, in the sequences əɦʊ and ʊɦə, in the prestigious Delhi dialect and Western Hindi, though not for every speaker or in Eastern Hindi. It is short, unlike ɔː. This course writes the same short vowel for the letter ऑ (ô) in English loans, as in डॉक्टर (ḍôkṭar), doctor."
      "n2": "Wikipedia's help page gives बहुत (bôhôt) as its example of ɔ, comparing it to the 'o' of 'cot'."
    examples:
      "बहुत": "very, a lot of, many"
      "डॉक्टर": "doctor"
  "hi-1202":
    native: "short open-mid front vowel (ɛ), a variant of ə near ɦ"
    notes:
      "n1": "The source says ɛ occurs as a conditioned variant of ə within the sequence əɦə, or əɦ before the next syllable or at the end of a word once a schwa has gone. The help page spells it ê, as in रहना (rêhnā), to live. It is short, unlike ɛː."
    examples:
      "रहना": "to live, to stay"
      "कहना": "to say"
  "hi-1203":
    native: "long open front vowel (æː), in English loans; Hindi ऍ (ê)"
    notes:
      "n1": "The source counts an eleventh vowel, æː, in English loans, such as bæːʈ, bat; it is seldom nasalised and has the letter ऍ (ê). No word of this course's cards writes it, so this card has no example."
  "hi-1204":
    native: "a nasal aː (ãː); Hindi आँ (ām̐), Urdu ں (m̐)"
    notes:
      "n1": "Hindi writes nasalisation with ँ (candrabindu) or ं (anusvara), Urdu with ں (nūn ġunna). The help page compares it to the heavy nasalisation of 'can't' in rapid General American. The source gives four views of Hindustani nasalisation (Masica 1991): that there are no ẽː and õː; that all vowels have phonemic nasalisation; that all nasalisation is predictable; and, the one Masica supports, that long vowels are nasalised phonemically at the end of a word and before voiceless stops, with nasal short vowels, and nasal long vowels before voiced stops, only allophonic."
    examples:
      "हाँ": "yes"
      "माँ": "mother"
  "hi-1205":
    native: "a nasal iː (ĩː)"
    notes:
      "n1": "A nasal long i, as at the end of नहीं (nahīm̐), no, in Urdu نہیں (nahīm̐). The sources disagree on how nasal vowels work; the four views are on the ãː card."
    examples:
      "नहीं": "no; not"
      "कहीं": "somewhere"
  "hi-1206":
    native: "a nasal uː (ũː)"
    notes:
      "n1": "A nasal long u, as in ऊँचा (ūm̐cā), high. The sources disagree on how nasal vowels work; the four views are on the ãː card."
    examples:
      "ऊँचा": "high, tall"
      "ढूँढना": "to look for, to search"
  "hi-1207":
    native: "a nasal eː (ẽː)"
    notes:
      "n1": "A nasal long e, as in में (mēm̐), in. The first of Masica's views says ẽː and õː do not occur at all. The sources disagree on how nasal vowels work; the four views are on the ãː card."
    examples:
      "में": "in; inside"
      "बाएँ": "left; to the left"
  "hi-1208":
    native: "a nasal ɛː (ɛ̃ː)"
    notes:
      "n1": "A nasal ɛː, as in मैं (maim̐), I, and हैं (haim̐), are. The sources disagree on how nasal vowels work; the four views are on the ãː card."
      "n2": "Minimal pair among this course's words: {1}, are, and {2}, is, differ only in the nasal, ɛ̃ː against ɛː."
    examples:
      "मैं": "I"
      "हैं": "are"
  "hi-1209":
    native: "a nasal oː (õː)"
    notes:
      "n1": "A nasal long o, as in क्यों (kyōm̐), why. The sources disagree on how nasal vowels work; the four views are on the ãː card."
    examples:
      "क्यों": "why"
  "hi-1210":
    native: "a nasal ɔː (ɔ̃ː)"
    notes:
      "n1": "A nasal ɔː, as in चौंसठ (cauṁsaṭh), sixty-four. The sources disagree on how nasal vowels work; the four views are on the ãː card."
    examples:
      "चौंसठ": "64, sixty-four"
  "hi-1211":
    native: "no diphthongs: ऐ (ai) and औ (au) are single vowels"
    notes:
      "n1": "The sources describe ten native vowels, all single vowels: ऐ (ai) and औ (au) are the long ɛː and ɔː, not a glide from one vowel to another. The source describes a symmetrical ten-vowel system, with three short vowels, ə, ɪ and ʊ, and seven long ones."
