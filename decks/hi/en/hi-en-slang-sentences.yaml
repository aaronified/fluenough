cards:
  "hi-5314":
    native: "Hey mate, this is great!"
    bases:
      "अरे": "hey"
      "तो": "then (emphasis)"
    confusables:
      "w1": { why: "Friend, the common word: दोस्त (dōst) means friend." }
      "w2": { why: "Carefree or bold, not great: बिंदास (bindās) means carefree; bold." }
  "hi-5315":
    native: "This job got done with a makeshift fix."
    bases:
      "काम": "work; job"
      "चल": "work out"
      "गया": "went (here: got done)"
    confusables:
      "w1": { why: "Passing the time, not a fix: टाइमपास (ṭāimpās) means passing the time." }
      "w2": { why: "Repair, a proper fix: मरम्मत (marammat) means repair." }
  "hi-5316":
    native: "Killing time like that is nonsense."
    bases:
      "उसका": "his; her"
    confusables:
      "w1": { why: "Great or fun, not nonsense: मस्त (mast) means great; fun." }
      "w2": { why: "It'll do, not nonsense: चलता है (caltā hai) means it'll do; whatever." }
  "hi-5317":
    native: "You speak boldly and freely."
    bases:
      "तुम": "you (informal)"
      "बोलते": "speak"
      "हो": "are"
    confusables:
      "w1": { why: "Great, not bold: मस्त (mast) means great; fun." }
      "w2": { why: "Nonsense, not bold: बकवास (bakvās) means nonsense." }
  "hi-5318":
    native: "It'll do, no big deal."
    bases:
      "चलता": "goes; works"
    confusables:
      "w1": { why: "A makeshift fix, not an okay: जुगाड़ (jugāṛ) means a makeshift fix." }
      "w2": { why: "Passing the time, not no big deal: टाइमपास (ṭāimpās) means passing the time." }
  "hi-5319":
    native: "Mate, make some great tea."
    bases:
      "भाई": "brother; mate"
      "बनाओ": "make"
    confusables:
      "w1": { why: "Friend: दोस्त (dōst) means friend." }
      "w2": { why: "Carefree, not tea: बिंदास (bindās) means carefree; bold." }
  "hi-5320":
    native: "This film is bold and carefree."
    bases:
      "फ़िल्म": "film"
    confusables:
      "w1": { why: "Great, not carefree: मस्त (mast) means great; fun." }
      "w2": { why: "Nonsense, not a film review: बकवास (bakvās) means nonsense." }
  "hi-5321":
    native: "My mate will come tomorrow."
    bases:
      "मेरा": "my (masculine)"
      "आएगा": "will come"
    confusables:
      "w1": { why: "Friend, the common word: दोस्त (dōst) means friend." }
      "w2": { why: "Brother or mate: भाई (bhāī) means brother; mate." }
  "hi-5322":
    native: "Listen, mate, do not talk nonsense."
    bases:
      "सुनो": "listen"
      "मत": "do not"
      "करो": "do"
    confusables:
      "w1": { why: "Passing the time, not nonsense: टाइमपास (ṭāimpās) means passing the time." }
      "w2": { why: "Great, not nonsense: मस्त (mast) means great; fun." }
  "hi-5323":
    native: "Do not rely on this makeshift fix."
    bases:
      "इस": "this (oblique)"
      "मत": "do not"
      "करो": "do"
    confusables:
      "w1": { why: "Repair, a proper fix: मरम्मत (marammat) means repair." }
      "w2": { why: "Belief, not reliance: यकीन (yakīn) means belief; certainty." }
