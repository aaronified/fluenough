  "hi-4015":
    native: "Just as Indra prevails over Jambha, undersea fire over the ocean, and the Raghu king over Ravan in battle, so these kings are supreme."
    notes:
      "n1": "The first two lines of a kavitt by Bhushan, quoted in the history of Hindi literature on Hindi Wikisource. Each line sets a strong power against its enemy, as images of victory."
