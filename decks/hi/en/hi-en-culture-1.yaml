  "hi-4009":
    native: "Joy arose in the new season, and for a moment neither sunshine nor shade pleased anyone."
    notes:
      "n1": "The two lines come from the spring section (Vasant Khand) of Padmavat, Jayasi's epic. The poem says that the joy of the new season is so strong that sunshine and shade no longer please."
