  "hi-4019":
    native: "Lord, with no turban on his head and no robe on his body, the poor man has a torn dhoti, a worn shawl and no sandals, and asks in what village you live."
    notes:
      "n1": "The first two lines of a savaiya from Sudama-charit by Narottam, quoted in the Bhaktikal chapter of the history of Hindi literature on Hindi Wikisource. Sudama is a poor Brahmin who visits Krishna."
