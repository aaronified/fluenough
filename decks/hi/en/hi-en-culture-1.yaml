  "hi-4001":
    native: "Wealth follows a person who turns his back on it and runs away from one who faces it; like a shadow, it slips away while a man sits idle through the day."
    notes:
      "n1": "A couplet of Tulsidas, quoted on the Hindi Wikipedia page about him. It compares wealth to a shadow."
