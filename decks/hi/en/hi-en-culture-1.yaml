  "hi-4016":
    native: "The path of love is very straight, with no room for cleverness; there the true walk, leaving self behind, while the deceitful hesitate, being not fearless."
    notes:
      "n1": "The first two lines of a savaiya by Ghananand, quoted in the Ritikal chapter of the history of Hindi literature on Hindi Wikisource. The poet calls love a straight path with no crookedness."
