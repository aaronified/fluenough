description: "Eighteen short couplets and verses from the bhakti, sant, Sufi and riti traditions, in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by a Hindi speaker: please report any mistake."

cards:
  "hi-4000":
    native: "Do not ask a holy man his caste, but ask for his knowledge; weigh the sword and leave its scabbard lying there."
    notes:
      "n1": "A couplet of Kabir, quoted on the Hindi Wikipedia page about him. The sword and its sheath are an image for judging a person by inner worth rather than outward sign."
    bases:
      "जाति": "caste"
