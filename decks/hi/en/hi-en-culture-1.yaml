  "hi-4003":
    native: "Keshav's white hair has done what even enemies would not do: the moon-faced, deer-eyed women keep calling him old man as they go past."
    notes:
      "n1": "A witty couplet of Keshavdas about his white hair. The women call him baba, which means grandfather or old man."
