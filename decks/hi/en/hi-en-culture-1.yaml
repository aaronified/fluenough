cards:
  "hi-4000":
    native: "Do not ask a holy man his caste, but ask for his knowledge; weigh the sword and leave its scabbard lying there."
    notes:
      "n1": "A couplet of Kabir, the poet of Varanasi who rejected caste. The sword and its sheath show that a person should be judged by what he is, not by his outside."
