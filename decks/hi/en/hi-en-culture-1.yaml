  "hi-4007":
    native: "Having broken a proud woman's heart and shattered the pride of an enchanting one, Raskhan fell in love on seeing the beauty of the god of love."
    notes:
      "n1": "A doha of Prem-vatika by Raskhan, quoted in the history of Hindi literature on Hindi Wikisource. The verse uses the title miyan before the poet's name. The poet is named in the Krishna devotion chapter of the history of Hindi literature."
