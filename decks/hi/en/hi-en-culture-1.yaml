  "hi-4017":
    native: "In the river banks, in play, in the thickets, bowers and flowerbeds, among the buds, the spring bursts out with joy."
    notes:
      "n1": "The first two lines of a Braj kavitt on spring by Padmakar, quoted in Kavi-Rahasya on Hindi Wikisource as an example of the repetition of sounds."
