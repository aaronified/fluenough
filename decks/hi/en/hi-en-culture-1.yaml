  "hi-4013":
    native: "Having seen the turmoil, the craving for lordship, and Delhi turned into a cremation ground, Raskhan at once gave up the pride of the emperor's dynasty."
    notes:
      "n1": "A doha quoted in the chapter on the Sagun devotional poets in the history of Hindi literature on Hindi Wikisource, among the dohas that show Raskhan turning away from the court. The poet's name ends the couplet."
