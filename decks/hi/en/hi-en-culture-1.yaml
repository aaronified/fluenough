  "hi-4002":
    native: "Forgiveness suits the great and mischief suits the small; Hari lost nothing when Bhrigu kicked him."
    notes:
      "n1": "A couplet of Rahim, quoted on the Hindi Wikipedia page about him. Hari is the name of Vishnu, and the couplet refers to the sage Bhrigu's kick."
