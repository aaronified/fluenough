  "hi-4002":
    native: "Forgiveness suits the great and mischief suits the small; Hari lost nothing when Bhrigu kicked him."
    notes:
      "n1": "A couplet of Rahim, the poet and courtier. Hari is Vishnu, and the story is of the sage Bhrigu, who kicked Vishnu's chest, and Vishnu forgave him."
