  "hi-4008":
    native: "We are the lovesick women of dark-hued Krishna, and you preach the formless god to us; our eyes, like bees, have left every other flower and take delight only in the lotus face."
    notes:
      "n1": "A pad from Bhramar-Geet Sar, in which the gopis answer Uddhav, the messenger who teaches them the formless god. The pad is pad 219 in the edition printed on Hindi Wikisource."
