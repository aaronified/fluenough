  "hi-4018":
    native: "Anklets, bangles, waist-bells, hands and the sweet flute, with the beat of the drum, the small lute and the tambourine, all joined in one tune."
    notes:
      "n1": "The first two lines of a passage from Nanddas's Rasapanchadhyayi, quoted in Kavi-Rahasya on Hindi Wikisource. The passage describes the dance of Krishna with the women of Braj."
