  "hi-4004":
    native: "The fair woman sleeps on the bed with her hair spread over her face; come, Khusro, to your own house, for night has fallen over the whole land."
    notes:
      "n1": "A Hindavi couplet attributed to Amir Khusro, the poet of the Delhi Sultanate. Hindavi is an early form of the language that became Hindustani."
