  "hi-4012":
    native: "May Krishna, with a crown on his head, a loincloth at his waist, a flute in his hand and a garland on his chest, always dwell in my mind in this very dress."
    notes:
      "n1": "A doha of the Bihari Satsai, quoted on Hindi Wikisource in Kavi-Rahasya, where it is given as an example of Krishna's dress. Bihari-lal is one of Krishna's names, and the poet's name is the same word."
    bases:
