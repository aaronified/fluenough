  "hi-4011":
    native: "Dadu, see the compassionate God, who is everywhere: he pervades every pore, so do not think he is far away."
    notes:
      "n1": "A couplet of Dadu Dayal, quoted in the Gyanashrayi chapter of the history of Hindi literature on Hindi Wikisource. It teaches that God is not far off but present in every part of a person."
