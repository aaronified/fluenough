  "hi-4014":
    native: "Whoever leaves the diamond of Hari and seeks hope in others will go to the city of Yama, says Raidas in truth."
    notes:
      "n1": "A doha of Raidas, quoted in the Kavita-Kaumudi on Hindi Wikisource, in the chapter on Raidas. Hari is the name of God, and the diamond is an image for him."
