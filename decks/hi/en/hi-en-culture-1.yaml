  "hi-4005":
    native: "Eat dry bread and drink cold water, and do not long for another's buttered bread."
    notes:
      "n1": "A shloka attributed to Baba Farid, the Sufi teacher. The verse is in Punjabi, and it teaches contentment with simple food."
