  "hi-4010":
    native: "Giridhar Gopal is mine alone, and no one else; O holy one, the whole world sees it."
    notes:
      "n1": "The opening pad in the Mirabai section of the history of Hindi literature on Hindi Wikisource. Giridhar (the hill-lifter) and Gopal (the cowherd) are both names of Krishna."
