  "hi-4006":
    native: "Kabir says: I have spoken of Brahma and of Mahesh, but the name of Ram is the essence, the teaching for all."
    notes:
      "n1": "A sakhi in the Kabir Granthavali, the collection edited by Shyamsundar Das and printed on Hindi Wikisource. The poet names the gods Brahma and Shiva, then gives the name of Ram as the essence of his teaching."
