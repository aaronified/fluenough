core: "hi-slang"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Slang"
license: "CC0-1.0"
description: "Everyday slang: what friends say that a textbook doesn't. Not yet checked by a Hindi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "hi-0595":
    native: "mate; buddy"
    notes:
      "n1": "Between friends, to anyone, man or woman: यार (yār), चलो (calō)! Too casual for strangers."
  "hi-0596":
    native: "a makeshift fix"
    notes:
      "n1": "A clever fix with whatever is at hand: कोई जुगाड़ करो (kōī jugāṛ karō), find some way."
  "hi-0597":
    native: "passing the time"
    notes:
      "n1": "बस टाइमपास (bas ṭāimpās), just killing time."
  "hi-0598":
    native: "great; fun"
    notes:
      "n1": "मस्त फ़िल्म थी (mast film thī), it was a great film."
  "hi-0599":
    native: "carefree; bold"
  "hi-0600":
    native: "nonsense"
    notes:
      "n1": "बकवास मत करो (bakvās mat karō), don't talk nonsense."
  "hi-0601":
    native: "it'll do; whatever"
    notes:
      "n1": "Said of something not quite right that you let pass."
  "hi-0602":
    native: "to drink alcohol (said on its own)"
    notes:
      "n1": "With a drink named, पीना (pīnā) is any drink: चाय पीना (cāy pīnā). On its own it means alcohol: वह पीता है (vah pītā hai), he drinks."
  "hi-0603":
    native: "booze"
