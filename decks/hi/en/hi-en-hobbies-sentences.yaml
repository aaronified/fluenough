cards:
  "hi-1687":
    native: "My hobby is painting."
    bases: { "मेरा": "my", "शौक": "hobby", "पेंटिंग": "painting" }
    confusables: { "w1": { why: "A film, not a painting: फ़िल्म (film) is a movie." }, "f2": { why: "हैं (haiṃ) is for plural things; the hobby here is one thing." } }
  "hi-1688":
    native: "In the evening we play cricket."
    bases: { "क्रिकेट": "cricket", "खेलते": "to play" }
    confusables: { "w1": { why: "Badminton, not cricket: बैडमिंटन (baiḍmiṇṭan) uses a shuttlecock." }, "f2": { why: "खेलता (khelṭā) is for one man; हम (we) takes खेलते (khelte)." } }
  "hi-1689":
    native: "Mother gardens in the morning."
    bases: { "बाग़वानी": "gardening", "करती": "to do" }
    confusables: { "w1": { why: "A walk, not gardening: सैर (sair) is a walk." }, "f2": { why: "करता (karatā) is masculine; माँ (mām̐) is feminine, so करती (karatī) is right." } }
  "hi-1690":
    native: "He goes swimming every Sunday."
    bases: { "हर": "each", "रविवार": "Sunday", "तैरने": "to swim", "जाता": "to go" }
    confusables: { "w1": { why: "A bicycle, not swimming: साइकिल (saikil) is a bicycle." }, "f2": { why: "तैरना (tairnā) is the verb; before जाता (jātā) it takes the form तैरने (tairne)." } }
  "hi-1691":
    native: "I play the guitar."
    bases: { "गिटार": "guitar", "बजाता": "to play", "हूँ": "to be" }
    confusables: { "w1": { why: "Tabla, a drum, not a string instrument: तबला (tablā) is a drum." }, "f2": { why: "बजाती (bajātī) is for a woman; मैं (maim̐) here takes बजाता (bajātā) for a man." } }
  "hi-1692":
    native: "The children fly kites."
    bases: { "बच्चे": "child", "पतंग": "kite", "उड़ाते": "to fly" }
    confusables: { "w1": { why: "A ball, not a kite: गेंद (gend) is a ball." }, "f2": { why: "उड़ाता (uṛātā) is for one masculine subject; बच्चे (baccē) is plural, so उड़ाते (uṛāte)." } }
  "hi-1693":
    native: "The football team plays well."
    bases: { "फ़ुटबॉल": "football", "टीम": "team", "अच्छी": "good", "खेलती": "to play" }
    confusables: { "w1": { why: "A player, not the team: खिलाड़ी (khilāṛī) is one player." }, "f2": { why: "खेलते (khēltē) is for plural subjects; टीम (ṭīm) is one team, so खेलती (khelti)." } }
  "hi-1694":
    native: "Chess uses the mind."
    bases: { "शतरंज": "chess", "दिमाग़": "mind", "लगता": "to be used" }
    confusables: { "w1": { why: "Yoga, not chess: योग (yog) is yoga, exercise and breath." }, "f2": { why: "Feminine: दिमाग़ (dimāġ) is masculine, so लगता (lagtā) is right and लगती (lagtī) would be wrong." } }
  "hi-1695":
    native: "On Sunday, listening to dance and singing feels good."
    bases: { "रविवार": "Sunday", "नृत्य": "dance", "गाना": "to sing", "सुनना": "to listen", "अच्छा": "good", "लगता": "to feel" }
    confusables: { "w1": { why: "A poem, not music: कविता (kavitā) is a poem." }, "f2": { why: "सुनने (sunne) is before लगता (lagtā) here; सुनना (sunnā) is the verb itself." } }
  "hi-1696":
    native: "Go to the park to walk."
    bases: { "सैर": "walk", "करने": "to do", "लिए": "for", "पार्क": "park", "जाओ": "to go" }
    confusables: { "w1": { why: "A field or ground, not a park: मैदान (maidān) is an open ground." }, "f2": { why: "After करने के लिए (karnē kē liē) the verb is in the infinitive; करो (karō) is the command form." } }
