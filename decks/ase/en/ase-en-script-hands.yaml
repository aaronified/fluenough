schema: 1
id: "ase-en-script-hands"
kind: "layer"
core: "ase-script-hands"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "SignWriting: the hands"
description: "The handshapes a sign is built from, drawn the way the signer sees their own hand: a square for the fist, lines for the fingers that stand out. See the symbol, say what the hand is doing. Not yet checked by a Deaf signer: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "ase-0001":
    native: "index finger"
    notes:
      "n1": "A fist with the index finger out: the square is the fist, the line is the finger. Every extended finger is drawn as a line from the square."
  "ase-0002":
    native: "fist, thumb out"
    notes:
      "n1": "A fist with the thumb stuck out to the side: a short line from the square."
  "ase-0003":
    native: "fist, thumb along the side"
    notes:
      "n1": "A fist with the thumb lying along the side of it, a short tick at the corner of the square. Compare the fist with the thumb out. In American Sign Language fingerspelling, the letter A is this symbol with a black fill."
  "ase-0004":
    native: "flat hand"
    notes:
      "n1": "All four fingers and the thumb together and straight: the pointed top is the fingertips. It is drawn white here because the palm faces you; see the next deck."
  "ase-0005":
    native: "flat hand, thumb at the side"
    notes:
      "n1": "The flat hand with the thumb held out beside it, a short line from the hand."
  "ase-0006":
    native: "flat hand, five fingers spread"
    notes:
      "n1": "The flat hand with the fingers spread apart: each finger is a line fanning out from the top."
  "ase-0007":
    native: "circle: fingers and thumb curved to meet"
    notes:
      "n1": "The fingers and thumb curve round to make a circle. The symbol is a plain circle."
  "ase-0008":
    native: "cupped hand"
    notes:
      "n1": "The fingers curved, as if holding a ball or a cup. The shape is drawn from the side, so you see the curve rather than the fingers."
  "ase-0009":
    native: "index and middle fingers out"
    notes:
      "n1": "A fist with the index and middle fingers out: two lines from the square."
  "ase-0010":
    native: "index and little fingers out"
    notes:
      "n1": "A fist with the index finger and the little finger out: two lines from the square, one at each end."
  "ase-0011":
    native: "claw hand"
    notes:
      "n1": "The fingers bent like a claw, drawn from the side."
