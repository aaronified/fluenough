schema: 1
id: "ase-en-script-orientation"
kind: "layer"
core: "ase-script-orientation"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "SignWriting: facing and turning"
description: "How a handshape is turned. The fill says which part of the hand faces you (white, half or black), and turning the symbol turns the hand. Not yet checked by a Deaf signer: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "ase-0012":
    native: "flat hand, side toward you"
    notes:
      "n1": "Half the symbol is filled black: the hand is turned so that its edge, not its palm or back, faces you. The white flat hand is in the first deck: palm toward you."
  "ase-0013":
    native: "flat hand, back of the hand toward you"
    notes:
      "n1": "Fully black: the back of the hand faces you. The white version of the same shape is the palm; the half-filled one is the edge."
  "ase-0014":
    native: "index finger, back of the hand toward you"
    notes:
      "n1": "The index finger with the fill black: you are looking at the back of the hand. The fill changes how the hand faces, never which fingers are out."
  "ase-0015":
    native: "index finger pointing sideways"
    notes:
      "n1": "The same hand turned a quarter of a turn: the symbol turns the way the hand turns, so the finger now lies on its side."
  "ase-0016":
    native: "index finger pointing sideways, the other hand"
    notes:
      "n1": "The turned hand, mirrored. Each turn has a mirror image for the other hand, so a left hand and a right hand can be told apart."
  "ase-0017":
    native: "index finger pointing diagonally"
    notes:
      "n1": "A turn of an eighth of a turn: a hand can be turned in eight steps all the way round, and each step has its mirror image."
