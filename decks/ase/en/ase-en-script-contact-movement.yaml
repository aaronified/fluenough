schema: 1
id: "ase-en-script-contact-movement"
kind: "layer"
core: "ase-script-contact-movement"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "SignWriting: touch and movement"
description: "The marks for hands that touch and for hands that move: small contact marks, and arrows for where the hand travels. Not yet checked by a Deaf signer: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "ase-0018":
    native: "touch"
    notes:
      "n1": "An asterisk: the hands or fingers touch, and are then in contact. It is drawn beside the handshape that touches."
  "ase-0019":
    native: "grasp"
    notes:
      "n1": "A plus sign: one hand takes hold of the other, or of something."
  "ase-0020":
    native: "strike"
    notes:
      "n1": "A hash sign: one hand hits the other, a quick hit and away."
  "ase-0021":
    native: "brush"
    notes:
      "n1": "A circle with a dot: the hand brushes across the other, a light contact on the way past."
  "ase-0022":
    native: "rub"
    notes:
      "n1": "A spiral: the hand rubs against the other, in contact the whole time."
  "ase-0023":
    native: "movement in the upright plane"
    notes:
      "n1": "An arrow drawn upright: the hand moves in the vertical plane in front of you, up, down, left or right. The shaft is the path, the head the way it goes."
  "ase-0024":
    native: "movement along the floor plane"
    notes:
      "n1": "An arrow drawn flat, as if seen from above: the hand moves forward, back or across, parallel to the floor. SignWriting has a symbol for the upright plane and one for the floor plane for each movement."
  "ase-0025":
    native: "curved movement"
    notes:
      "n1": "An arrow that curves: the hand travels along an arc, a quarter of a circle, in the upright plane."
  "ase-0026":
    native: "shaking"
    notes:
      "n1": "Short lines beside an arrow: the hand shakes to and fro instead of travelling."
