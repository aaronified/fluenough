schema: 1
id: "ase-en-script-face-body"
kind: "layer"
core: "ase-script-face-body"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "SignWriting: the face and the body"
description: "Signing is done with the face and the body as well as the hands. The head is a circle, and what the face does is drawn inside it; the shoulders are the line that every hand is placed against. Not yet checked by a Deaf signer: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "ase-0027":
    native: "head"
    notes:
      "n1": "A plain circle: the head. Marks for the face are drawn inside it, and the head tells the reader where the face is in the sign."
  "ase-0028":
    native: "eyebrows raised"
    notes:
      "n1": "The eyebrows straight up, drawn in a head. Raised or lowered eyebrows can change what a sign means, for example turning a statement into a question."
  "ase-0029":
    native: "eyes open"
    notes:
      "n1": "Both eyes open, drawn in a head. The eyes can also be half closed, blink, wink or look in a direction, each with its own mark."
  "ase-0030":
    native: "mouth closed"
    notes:
      "n1": "A mouth closed and relaxed, drawn in a head. The mouth has many marks: mouth shapes, the tongue, the teeth and the cheeks are each written."
  "ase-0031":
    native: "cheeks puffed"
    notes:
      "n1": "The cheeks puffed out, drawn in a head. A puffed cheek is part of some signs."
  "ase-0032":
    native: "shoulders"
    notes:
      "n1": "A thick line: the line of the shoulders. A hand symbol written under it is low, one written above it is high, so the body gives every hand its place."
