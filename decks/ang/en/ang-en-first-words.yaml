"id": "ang-en-first-words"
"kind": "layer"
"core": "ang-first-words"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "First words"
"description": "Ten words to start with: yes and no, I and you, water, good, one, two, here and and. West Saxon Old English, in Latin letters with the thorn, macrons and ash as printed. The pronunciation is reconstructed. Not yet checked by an Anglo-Saxonist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "ang-0001":
    "native": "Yes, you are good."
    "notes":
      "n1": "Gēa is yes in Old English prose and verse. The no is nā, on the next card."
    "examples":
      "Gēa, ic eom hēr.":
        "native": "Yes, I am here."
        "bases":
          "Gēa": "yes"
          "ic": "I"
          "eom": "am"
          "hēr": "here"
      "Gēa, þū eart gōd.":
        "native": "Yes, you are good."
        "bases":
          "Gēa": "yes"
          "þū": "you"
          "eart": "are"
          "gōd": "good"
  "ang-0002":
    "native": "No, I do not have water."
    "notes":
      "n1": "Nā is no. Ne goes before a verb to make it negative: ic ne eom, I am not."
    "examples":
      "Nā, ic ne eom hēr.":
        "native": "No, I am not here."
        "bases":
          "Nā": "no"
          "ic": "I"
          "ne": "not"
          "eom": "am"
          "hēr": "here"
      "Nā, ic ne hæbbe wæter.":
        "native": "No, I do not have water."
        "bases":
          "Nā": "no"
          "ic": "I"
          "ne": "not"
          "hæbbe": "have (I have)"
          "wæter": "water"
  "ang-0003":
    "native": "I am here."
    "notes":
      "n1": "Ic is I. The verb ending says I too, so ic is often left out, but it is written in the sentences here."
    "examples":
      "Ic drince wæter.":
        "native": "I drink water."
        "bases":
          "Ic": "I"
          "drince": "drink (I drink)"
          "wæter": "water"
      "Ic eom hēr.":
        "native": "I am here."
        "bases":
          "Ic": "I"
          "eom": "am"
          "hēr": "here"
  "ang-0004":
    "native": "You have water."
    "notes":
      "n1": "Þū is you to one person, written with the letter thorn. To more than one, the form is ġē."
    "examples":
      "Þū eart hēr.":
        "native": "You are here."
        "bases":
          "Þū": "you"
          "eart": "are"
          "hēr": "here"
      "Þū hæfst wæter.":
        "native": "You have water."
        "bases":
          "Þū": "you"
          "hæfst": "have (you have)"
          "wæter": "water"
  "ang-0005":
    "native": "Give me water."
    "notes":
      "n1": "Wæter is water, a neuter noun."
    "examples":
      "Wæter is gōd.":
        "native": "Water is good."
        "bases":
          "Wæter": "water"
          "is": "is"
          "gōd": "good"
      "Ġif mē wæter.":
        "native": "Give me water."
        "bases":
          "Ġif": "give (give!)"
          "mē": "me"
          "wæter": "water"
  "ang-0006":
    "native": "A good man."
    "notes":
      "n1": "Gōd is good. It takes endings to agree with its noun, as the two examples show."
    "examples":
      "Gōd dæg.":
        "native": "Good day."
        "bases":
          "Gōd": "good"
          "dæg": "day"
      "Gōd mann.":
        "native": "A good man."
        "bases":
          "Gōd": "good"
          "mann": "man"
  "ang-0007":
    "native": "One year."
    "notes":
      "n1": "Ān is one. Twā, two, is on the next card."
    "examples":
      "Ān mann.":
        "native": "One man."
        "bases":
          "Ān": "one"
          "mann": "man"
      "Ān ġēar.":
        "native": "One year."
        "bases":
          "Ān": "one"
          "ġēar": "year"
  "ang-0008":
    "native": "Two years."
    "notes":
      "n1": "Twā is two for feminine and neuter nouns; the masculine form is twēgen."
    "examples":
      "Twā menn.":
        "native": "Two men."
        "bases":
          "Twā": "two"
          "menn": "men"
      "Twā ġēar.":
        "native": "Two years."
        "bases":
          "Twā": "two"
          "ġēar": "year"
  "ang-0009":
    "native": "Here is water."
    "notes":
      "n1": "Hēr is here, in this place. For there, þǣr."
    "examples":
      "Hēr is hūs.":
        "native": "Here is a house."
        "bases":
          "Hēr": "here"
          "is": "is"
          "hūs": "house"
      "Hēr is wæter.":
        "native": "Here is water."
        "bases":
          "Hēr": "here"
          "is": "is"
          "wæter": "water"
  "ang-0010":
    "native": "You and I."
    "notes":
      "n1": "And is and between words and clauses, as in Modern English."
    "examples":
      "Wæter and hlāf.":
        "native": "Water and bread."
        "bases":
          "Wæter": "water"
          "and": "and"
          "hlāf": "bread"
      "Þū and ic.":
        "native": "You and I."
        "bases":
          "Þū": "you"
          "and": "and"
          "ic": "I"
