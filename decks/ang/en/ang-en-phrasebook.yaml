"tags":
- "unreviewed"
"cards":
  "ang-0011":
    "native": "Be well; hello."
    "notes":
      "n1": "Wes hāl, be well: a greeting. Attested in Old English texts."
  "ang-0012":
    "native": "Be you well (the answer)."
    "notes":
      "n1": "The answer to wes hāl, said to one person. Attested in this form in Old English texts."
  "ang-0013":
    "native": "Good day."
    "notes":
      "n1": "Good day. The words are Old English; the greeting is conventional, not checked in a text."
  "ang-0014":
    "native": "Good morning."
    "notes":
      "n1": "Good morning. The words are Old English; the greeting is conventional, not checked in a text."
  "ang-0015":
    "native": "Good night."
    "notes":
      "n1": "Good night. The words are Old English; the greeting is conventional, not checked in a text."
  "ang-0016":
    "native": "What is your name?"
    "notes":
      "n1": "A plain Old English question built from attested words; the sentence itself is conventional."
  "ang-0017":
    "native": "I am called Anna."
    "notes":
      "n1": "Hātan is to be called: ic hātte, I am called. Anna is an example name."
  "ang-0018":
    "native": "Who is that?"
    "notes":
      "n1": "Who is that? Hwā is who. The sentence is conventional, built from attested words."
  "ang-0019":
    "native": "What is that?"
    "notes":
      "n1": "What is that? Attested in this form in Old English prose."
  "ang-0020":
    "native": "How much?"
    "notes":
      "n1": "How much? Hū is how and micel is much. Attested in this sense."
  "ang-0021":
    "native": "Where is water?"
    "notes":
      "n1": "Where is water? Built from attested words; conventional as a phrase."
  "ang-0022":
    "native": "I do not understand."
    "notes":
      "n1": "I do not understand. The verb is attested; this sentence is conventional."
  "ang-0023":
    "native": "Listen!"
    "notes":
      "n1": "Listen! The imperative of hīeran, to hear. Used as a call; conventional here."
  "ang-0024":
    "native": "Bring me water."
    "notes":
      "n1": "Bring me water. The imperative of bringan, to bring; the sentence is conventional."
  "ang-0025":
    "native": "Thanks."
    "notes":
      "n1": "Thanks, from þanc. Attested in Old English texts."
  "ang-0026":
    "native": "I thank you."
    "notes":
      "n1": "I thank you: the verb þancian with the object þē. Attested."
  "ang-0027":
    "native": "Please (I ask you)."
    "notes":
      "n1": "Literally I ask you. Old English had no single word for please; this is the usual way to ask. The sentence is conventional."
  "ang-0028":
    "native": "Forgive me."
    "notes":
      "n1": "Forgive me: the imperative of forġiefan, to forgive. The verb is attested; the phrase is conventional."
  "ang-0029":
    "native": "Goodbye."
    "notes":
      "n1": "Fare well: the usual parting. Attested in Old English texts."
