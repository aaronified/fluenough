"name": "Phrasebook: first phrases"
"description": "Twenty things to say from the first day: greetings, thanks and sorry, asking for help, and saying you do not understand. West Saxon Old English. Several phrases are conventional, not checked in a text (marked in their notes). Not yet checked by an Anglo-Saxonist: please report any mistake."
