    "reading": "gujrāti bhāśā gujrātmām̐ bolāy che."
    "ipa": "ɡudʒrat̪i bʱaʃa ɡudʒrat̪mã bolaj tʃʰe"
  - "text": "ગુજરાત પશ્ચિમ ભારતમાં છે અને તેની રાજધાની ગાંધીનગર છે."
    "reading": "gujrāt paścim bhārtmām̐ che ane teni rājdhāni gāndhingar che."
    "ipa": "ɡudʒrat̪ pəʃtʃim bʱart̪mã tʃʰe əne t̪eni radʒd̪ʱani ɡand̪ʱinɡər tʃʰe"
  - "text": "ગુજરાતનો દરિયાકિનારો લાંબો છે."
