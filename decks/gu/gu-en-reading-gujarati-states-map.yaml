  "sentences":
  - "text": "આ નકશામાં ગુજરાત, મહારાષ્ટ્ર અને રાજસ્થાન બતાવ્યાં છે."
    "reading": "ā nakśāmām̐ gujrāt, mahārāśṭra ane rājasthān batāvyām̐ che."
    "ipa": "a nəkʃamã ɡudʒrat̪ məɦaraʃʈrə əne radʒəst̪ʰan bət̪aʋjã tʃʰe"
