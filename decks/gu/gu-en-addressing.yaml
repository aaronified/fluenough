schema: 1
id: gu-en-addressing
name: "Addressing people"
kind: vocab
theme: addressing
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Gujarati calls almost everyone brother, sister, uncle or aunt, and adds -bhai and -ben to names. How to address people with the right respect. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: gu-0307
    target: "ભાઈ"
    native: "brother; any man"
    reading: "bhāi"
    ipa: "bʱai"
    pos: "noun"
    gender: "m"
    notes: "Added to a man's name with respect, written joined: રમેશભાઈ (rameśbhāi). On its own it is how you call a shopkeeper, a driver or any man: ભાઈ (bhāi), આ કેટલાનું છે (ā keṭlānum̐ che)?"
  - id: gu-0308
    target: "બહેન"
    native: "sister; any woman"
    reading: "bahen"
    ipa: "bəɦen"
    pos: "noun"
    gender: "f"
    notes: "Added to a woman's name: ગીતાબહેન (gitābahen), often said and written ગીતાબેન (gitāben). On its own it is how you address a woman you don't know."
  - id: gu-0309
    target: "કાકા"
    native: "uncle (father's brother); an older man"
    reading: "kākā"
    ipa: "kaka"
    pos: "noun"
    gender: "m"
    notes: "Children and young people call any man of their father's age કાકા (kākā)."
  - id: gu-0310
    target: "માસી"
    native: "aunt (mother's sister); an older woman"
    reading: "māsi"
    ipa: "masi"
    pos: "noun"
    gender: "f"
    notes: "Children call women of their mother's age માસી (māsi). It is also how many address a woman who helps in the house."
  - id: gu-0311
    target: "દાદા"
    native: "grandfather (father's father); an old man"
    reading: "dādā"
    ipa: "d̪ad̪a"
    pos: "noun"
    gender: "m"
  - id: gu-0312
    target: "બા"
    native: "mother; grandmother; an old woman"
    reading: "bā"
    ipa: "ba"
    pos: "noun"
    gender: "f"
    notes: "Some families call the mother બા (bā), others the grandmother. Gandhi's wife Kasturba was known to all as બા (bā). Spoken of with respect, she takes a plural verb: બા આવ્યાં (bā āvyām̐), Ba has come."
  - id: gu-0313
    target: "સાહેબ"
    native: "sir"
    reading: "sāheb"
    ipa: "saɦeb"
    pos: "noun"
    gender: "m"
    notes: "For an officer, a teacher or a boss, and after a surname: પટેલ સાહેબ (paṭel sāheb)."
  - id: gu-0314
    target: "બેટા"
    native: "child (said to a son, a daughter or any child)"
    reading: "beṭā"
    ipa: "beʈa"
    pos: "noun"
    notes: "Said by an elder to a younger person, boy or girl, with affection."
  - id: gu-0315
    target: "શ્રી"
    native: "Mr"
    reading: "śri"
    ipa: "ʃri"
    pos: "other"
    notes: "Written before a man's name: શ્રી રમેશ પટેલ (śri rameś paṭel). શ્રીમતી (śrimati) is Mrs. In speech, the name with -ભાઈ (-bhāi) or -બહેન (-bahen) is more usual."
  - id: gu-0316
    target: "આપ"
    native: "you (very formal)"
    reading: "āp"
    ipa: "ap"
    pos: "other"
    notes: "In speeches, letters and signs: આપનું સ્વાગત છે (āpnum̐ svāgat che), you are welcome. It takes the same verb as તમે (tame): આપ ક્યારે પધારશો? (ap kyare padharsho?), when will you come?"
  - id: gu-0317
    target: "દોસ્ત"
    native: "friend; mate"
    reading: "dost"
    ipa: "d̪ost̪"
    pos: "noun"
    gender: "m"
    notes: "Also મિત્ર (mitra), more formal. A woman's friend is often બહેનપણી (bahenpaṇi)."
  - id: gu-0318
    target: "સાંભળો"
    native: "excuse me (to get someone's attention); listen"
    reading: "sāmbhaḷo"
    ipa: "sambʱəɭo"
    pos: "other"
    notes: "Literally 'listen'. Also એ ભાઈ! (e bhai!), hey, brother!"
