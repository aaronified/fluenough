schema: 1
id: gu-en-addressing
name: "Addressing people"
kind: vocab
theme: addressing
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Gujarati calls almost everyone brother, sister, uncle or aunt, and adds -bhai and -ben to names. How to address people with the right respect. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: gu-0307
    target: "ભાઈ"
    native: "brother; any man"
    reading: "bhai"
    pos: "noun"
    gender: "m"
    notes: "Added to a man's name with respect, written joined: રમેશભાઈ (rameshbhai). On its own it is how you call a shopkeeper, a driver or any man: ભાઈ, આ કેટલાનું છે?"
  - id: gu-0308
    target: "બહેન"
    native: "sister; any woman"
    reading: "bahen"
    pos: "noun"
    gender: "f"
    notes: "Added to a woman's name: ગીતાબહેન (gitabahen), often said and written ગીતાબેન. On its own it is how you address a woman you don't know."
  - id: gu-0309
    target: "કાકા"
    native: "uncle (father's brother); an older man"
    reading: "kaka"
    pos: "noun"
    gender: "m"
    notes: "Children and young people call any man of their father's age કાકા."
  - id: gu-0310
    target: "માસી"
    native: "aunt (mother's sister); an older woman"
    reading: "masi"
    pos: "noun"
    gender: "f"
    notes: "Children call women of their mother's age માસી. It is also how many address a woman who helps in the house."
  - id: gu-0311
    target: "દાદા"
    native: "grandfather (father's father); an old man"
    reading: "dada"
    pos: "noun"
    gender: "m"
  - id: gu-0312
    target: "બા"
    native: "mother; grandmother; an old woman"
    reading: "ba"
    pos: "noun"
    gender: "f"
    notes: "Some families call the mother બા, others the grandmother. Gandhi's wife Kasturba was known to all as બા. Spoken of with respect, she takes a plural verb: બા આવ્યાં (ba avyan), Ba has come."
  - id: gu-0313
    target: "સાહેબ"
    native: "sir"
    reading: "saheb"
    pos: "noun"
    gender: "m"
    notes: "For an officer, a teacher or a boss, and after a surname: પટેલ સાહેબ (patel saheb)."
  - id: gu-0314
    target: "બેટા"
    native: "child (said to a son, a daughter or any child)"
    reading: "beta"
    pos: "noun"
    notes: "Said by an elder to a younger person, boy or girl, with affection."
  - id: gu-0315
    target: "શ્રી"
    native: "Mr"
    reading: "shri"
    pos: "other"
    notes: "Written before a man's name: શ્રી રમેશ પટેલ. શ્રીમતી (shrimati) is Mrs. In speech, the name with -ભાઈ or -બહેન is more usual."
  - id: gu-0316
    target: "આપ"
    native: "you (very formal)"
    reading: "ap"
    pos: "other"
    notes: "In speeches, letters and signs: આપનું સ્વાગત છે (apnun svagat chhe), you are welcome. It takes the same verb as તમે: આપ ક્યારે પધારશો? (ap kyare padharsho?), when will you come?"
  - id: gu-0317
    target: "દોસ્ત"
    native: "friend; mate"
    reading: "dost"
    pos: "noun"
    gender: "m"
    notes: "Also મિત્ર (mitra), more formal. A woman's friend is often બહેનપણી (bahenpani)."
  - id: gu-0318
    target: "સાંભળો"
    native: "excuse me (to get someone's attention); listen"
    reading: "sambhalo"
    pos: "other"
    notes: "Literally 'listen'. Also એ ભાઈ! (e bhai!), hey, brother!"
