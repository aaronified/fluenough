  "sentences":
  - "text": "આ દુકાનમાં કપડાં સસ્તાં છે."
    "reading": "ā dukānmām̐ kapḍām̐ sastām̐ che."
    "ipa": "a d̪ukanmã kəpɖã səst̪ã tʃʰe"
  - "text": "સફેદ શર્ટ અને કાળો પટ્ટો ખાસ ભાવે મળે છે."
    "reading": "saphed śarṭ ane kāḷo paṭṭo khās bhāve maḷe che."
    "ipa": "səpʰed̪ ʃərʈ əne kaɭo pəʈʈo kʰas bʱaʋe məɭe tʃʰe"
  - "text": "બધાં જૂતાં પર દસ ટકા છૂટ છે."
    "reading": "badhām̐ jutām̐ par das ṭakā chuṭ che."
    "ipa": "bəd̪ʱã dʒut̪ã pər d̪əs ʈəka tʃʰuʈ tʃʰe"
  - "text": "બાળકો માટે ટોપી અને મોજાં પણ છે."
    "reading": "bāḷko māṭe ṭopi ane mojām̐ paṇ che."
    "ipa": "baɭko maʈe ʈopi əne modʒã pəɳ tʃʰe"
