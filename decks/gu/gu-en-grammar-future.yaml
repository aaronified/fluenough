schema: 1
id: gu-en-grammar-future
name: "Future tense"
kind: grammar
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I will go, they will come: one ending for each person, and no gender. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Future"
  slot_name: "person"
  slots: ["હું", "તું", "તે", "અમે", "તમે", "તેઓ"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The stem and an ending with શ: -ઈશ (હું, તું), -શે (તે, તેઓ), -ઈશું (અમે), -શો (તમે). Unlike Hindi, the future shows no gender. In everyday speech તું often takes -શે too: તું ક્યારે આવશે? A request put in the future is polite: બેસશો? won't you sit?"
  entries:
    - lemma: "કરવું"
      key: karvun
      reading: "karvum̐"
      ipa: "kərʋũ"
      gloss: "to do"
      forms:
        "હું": "કરીશ"
        "તું": ["કરીશ", "કરશે"]
        "તે": "કરશે"
        "અમે": "કરીશું"
        "તમે": "કરશો"
        "તેઓ": "કરશે"
      readings:
        "હું": "kariś"
        "તું": ["kariś", "karśe"]
        "તે": "karśe"
        "અમે": "kariśum̐"
        "તમે": "karśo"
        "તેઓ": "karśe"
      ipas:
        "હું": "kəriʃ"
        "તું": "kəriʃ"
        "તે": "kərʃe"
        "અમે": "kəriʃũ"
        "તમે": "kərʃo"
        "તેઓ": "kərʃe"
    - lemma: "જવું"
      key: javun
      reading: "javum̐"
      ipa: "dʒəʋũ"
      gloss: "to go"
      forms:
        "હું": "જઈશ"
        "તું": ["જઈશ", "જશે"]
        "તે": "જશે"
        "અમે": "જઈશું"
        "તમે": "જશો"
        "તેઓ": "જશે"
      readings:
        "હું": "jaiś"
        "તું": ["jaiś", "jaśe"]
        "તે": "jaśe"
        "અમે": "jaiśum̐"
        "તમે": "jaśo"
        "તેઓ": "jaśe"
      ipas:
        "હું": "dʒəiʃ"
        "તું": "dʒəiʃ"
        "તે": "dʒəʃe"
        "અમે": "dʒəiʃũ"
        "તમે": "dʒəʃo"
        "તેઓ": "dʒəʃe"
    - lemma: "આવવું"
      key: aavvun
      reading: "āvvum̐"
      ipa: "aʋʋũ"
      gloss: "to come"
      forms:
        "હું": "આવીશ"
        "તું": ["આવીશ", "આવશે"]
        "તે": "આવશે"
        "અમે": "આવીશું"
        "તમે": "આવશો"
        "તેઓ": "આવશે"
      readings:
        "હું": "āviś"
        "તું": ["āviś", "āvśe"]
        "તે": "āvśe"
        "અમે": "āviśum̐"
        "તમે": "āvśo"
        "તેઓ": "āvśe"
      ipas:
        "હું": "aʋiʃ"
        "તું": "aʋiʃ"
        "તે": "aʋʃe"
        "અમે": "aʋiʃũ"
        "તમે": "aʋʃo"
        "તેઓ": "aʋʃe"
    - lemma: "ખાવું"
      key: khaavun
      reading: "khāvum̐"
      ipa: "kʰaʋũ"
      gloss: "to eat"
      forms:
        "હું": "ખાઈશ"
        "તું": ["ખાઈશ", "ખાશે"]
        "તે": "ખાશે"
        "અમે": "ખાઈશું"
        "તમે": "ખાશો"
        "તેઓ": "ખાશે"
      readings:
        "હું": "khāiś"
        "તું": ["khāiś", "khāśe"]
        "તે": "khāśe"
        "અમે": "khāiśum̐"
        "તમે": "khāśo"
        "તેઓ": "khāśe"
