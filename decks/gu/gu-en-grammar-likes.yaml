schema: 1
id: gu-en-grammar-likes
name: "Likes, knowing and feelings"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "To me tea is pleasing: likes, feelings and knowing put the person in -ને and make the thing the subject. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - ref: gu-0258
    notes: "ગમવું (gamvun), 'to please'. The thing liked is the subject; the one who likes takes -ને."
  - id: gu-0589
    target: "મને ગુજરાતી ખાવાનું બહુ ગમે છે."
    native: "I love Gujarati food."
    reading: "mane gujarati khavanun bahu game chhe."
    pos: "phrase"
    notes: "બહુ ગમે છે, 'pleases a lot', is the everyday 'love'. ખાવાનું (khavanun) is 'food', literally 'the eating'."
  - id: gu-0590
    target: "તમને શું ગમે છે?"
    native: "What do you like?"
    reading: "tamne shun game chhe?"
    pos: "phrase"
  - id: gu-0591
    target: "મને એ નથી ગમતું."
    native: "I don't like that."
    reading: "mane e nathi gamtun."
    pos: "phrase"
    notes: "With નથી, ગમે becomes ગમતું, and agrees: મને ચા નથી ગમતી."
  - id: gu-0592
    target: "મને ગમ્યું."
    native: "I liked it."
    reading: "mane gamyun."
    pos: "phrase"
  - id: gu-0593
    target: "મને ક્રિકેટ જોવાનું ગમે છે."
    native: "I like watching cricket."
    reading: "mane kriket jovanun game chhe."
    pos: "phrase"
    notes: "A verb as the thing liked takes -વાનું: જોવાનું, watching."
  - id: gu-0594
    target: "તમને ગમશે."
    native: "You'll like it."
    reading: "tamne gamshe."
    pos: "phrase"
  - id: gu-0595
    target: "મને મજા આવી."
    native: "I enjoyed it; I had fun."
    reading: "mane maja avi."
    pos: "phrase"
    notes: "Literally 'fun came to me'."
  - id: gu-0596
    target: "મને ખબર છે."
    native: "I know."
    reading: "mane khabar chhe."
    pos: "phrase"
    notes: "Knowing a fact. Knowing how to do something is આવડવું: મને તરતાં આવડે છે, I can swim."
  - id: gu-0597
    target: "મને લાગે છે કે વરસાદ પડશે."
    native: "I think it will rain."
    reading: "mane lage chhe ke varsad padshe."
    pos: "phrase"
    notes: "Literally 'it strikes me that rain will fall'."
  - id: gu-0598
    target: "મને ડર લાગે છે."
    native: "I'm scared."
    reading: "mane dar lage chhe."
    pos: "phrase"
  - id: gu-0599
    target: "મને ગુસ્સો આવે છે."
    native: "I'm getting angry."
    reading: "mane gusso ave chhe."
    pos: "phrase"
    notes: "Literally 'anger comes to me'."
