schema: 1
id: gu-en-spelling
name: "Gujarati spellings, old and new"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Spellings you will meet in older print and in everyday writing, beside the dictionary spelling. Gujarati says a long and a short i or u alike, so the spelling is often in doubt. Recognition only. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [advanced, unreviewed]
cards:
  - id: gu-0659
    target: "બેન"
    native: "sister; the dictionary spelling is બહેન (bahen)"
    reading: "ben"
    ipa: "ben"
    pos: "other"
    modes: [recognition]
    notes: "Written as it is said: the h of બહેન (bahen) is heard only as a breathy e. Common in names and messages: ગીતાબેન (gitāben)."
  - id: gu-0660
    target: "કે'જો"
    native: "please tell; the dictionary spelling is કહેજો (kahejo)"
    reading: "ke'jo"
    ipa: "kedʒo"
    pos: "other"
    modes: [recognition]
    notes: "In stories and dialogue an apostrophe marks the h that speech drops: કે (ke)'વું (vum̐) for કહેવું (kahevum̐), રે (re)'વું (vum̐) for રહેવું (rahevum̐)."
  - id: gu-0661
    target: "ઉઠવું"
    native: "to get up; the dictionary spelling is ઊઠવું (uṭhvum̐)"
    reading: "uṭhvum̐"
    ipa: "uʈʰʋũ"
    pos: "other"
    modes: [recognition]
    notes: "The short and long u sound alike, so the short one is often written. The dictionary wants ઊ (u) here."
  - id: gu-0662
    target: "દિકરી"
    native: "daughter; the dictionary spelling is દીકરી (dikri)"
    reading: "dikri"
    ipa: "d̪ikri"
    pos: "other"
    modes: [recognition]
    notes: "A common misspelling, since ઇ (i) and ઈ (i) sound alike."
  - id: gu-0663
    target: "પરિક્ષા"
    native: "exam; the dictionary spelling is પરીક્ષા (parikśā)"
    reading: "parikśā"
    ipa: "pərikʃa"
    pos: "other"
    modes: [recognition]
    notes: "A common misspelling: the dictionary has the long ી (i)."
  - id: gu-0664
    target: "હિન્દી"
    native: "Hindi; also written હિંદી (hindi)"
    reading: "hindi"
    ipa: "ɦind̪i"
    pos: "other"
    modes: [recognition]
    notes: "A nasal before a consonant is written either as a half letter (ન્દ) or as the dot (ં). Both are seen: હિન્દુ (hindu) and હિંદુ (hindu)."
  - id: gu-0665
    target: "બેંક"
    native: "bank; also written બૅન્ક (bênk)"
    reading: "beṅk"
    ipa: "beŋk"
    pos: "other"
    modes: [recognition]
    notes: "English words are spelled many ways: with or without the moon, with the dot or a half letter."
  - id: gu-0666
    target: "મ્હારું"
    native: "my; today મારું (mārum̐)"
    reading: "mārum̐"
    ipa: "marũ"
    pos: "other"
    modes: [recognition]
    notes: "Nineteenth-century print often wrote an h after m or n, as in Narmad's autobiography મ્હારી હકીકત (My Story) and the poet's name ન્હાનાલાલ (Nanalal). Today: મારું (mārum̐), નાનું (nānum̐)."
  - id: gu-0667
    target: "ઈશ્વર"
    native: "God; often misspelled ઇશ્વર (iśvar)"
    reading: "iśvar"
    ipa: "iʃʋər"
    pos: "other"
    modes: [recognition]
    notes: "The dictionary has the long ઈ (i); the short one is a common slip."
