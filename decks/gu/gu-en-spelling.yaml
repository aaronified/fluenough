schema: 1
id: gu-en-spelling
name: "Gujarati spellings, old and new"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Spellings you will meet in older print and in everyday writing, beside the dictionary spelling. Gujarati says a long and a short i or u alike, so the spelling is often in doubt. Recognition only. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [advanced, unreviewed]
cards:
  - id: gu-0659
    target: "બેન"
    native: "sister; the dictionary spelling is બહેન"
    reading: "ben"
    pos: "other"
    modes: [recognition]
    notes: "Written as it is said: the h of બહેન is heard only as a breathy e. Common in names and messages: ગીતાબેન."
  - id: gu-0660
    target: "કે'જો"
    native: "please tell; the dictionary spelling is કહેજો"
    reading: "kejo"
    pos: "other"
    modes: [recognition]
    notes: "In stories and dialogue an apostrophe marks the h that speech drops: કે'વું for કહેવું, રે'વું for રહેવું."
  - id: gu-0661
    target: "ઉઠવું"
    native: "to get up; the dictionary spelling is ઊઠવું"
    reading: "uthvun"
    pos: "other"
    modes: [recognition]
    notes: "The short and long u sound alike, so the short one is often written. The dictionary wants ઊ here."
  - id: gu-0662
    target: "દિકરી"
    native: "daughter; the dictionary spelling is દીકરી"
    reading: "dikri"
    pos: "other"
    modes: [recognition]
    notes: "A common misspelling, since ઇ and ઈ sound alike."
  - id: gu-0663
    target: "પરિક્ષા"
    native: "exam; the dictionary spelling is પરીક્ષા"
    reading: "pariksha"
    pos: "other"
    modes: [recognition]
    notes: "A common misspelling: the dictionary has the long ી."
  - id: gu-0664
    target: "હિન્દી"
    native: "Hindi; also written હિંદી"
    reading: "hindi"
    pos: "other"
    modes: [recognition]
    notes: "A nasal before a consonant is written either as a half letter (ન્દ) or as the dot (ં). Both are seen: હિન્દુ and હિંદુ."
  - id: gu-0665
    target: "બેંક"
    native: "bank; also written બૅન્ક"
    reading: "benk"
    pos: "other"
    modes: [recognition]
    notes: "English words are spelled many ways: with or without the moon, with the dot or a half letter."
  - id: gu-0666
    target: "મ્હારું"
    native: "my; today મારું"
    reading: "marun"
    pos: "other"
    modes: [recognition]
    notes: "Nineteenth-century print often wrote an h after m or n, as in Narmad's autobiography મ્હારી હકીકત (My Story) and the poet's name ન્હાનાલાલ (Nanalal). Today: મારું, નાનું."
  - id: gu-0667
    target: "ઈશ્વર"
    native: "God; often misspelled ઇશ્વર"
    reading: "ishvar"
    pos: "other"
    modes: [recognition]
    notes: "The dictionary has the long ઈ; the short one is a common slip."
