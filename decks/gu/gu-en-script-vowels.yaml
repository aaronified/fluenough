schema: 1
id: gu-en-script-vowels
name: "Gujarati vowels"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The vowels as they are written on their own, at the start of a word. Gujarati spells a short and a long i and u, but says them alike. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: gu-0001
    target: "અ"
    native: "a, short (the vowel every consonant carries)"
    reading: "a"
    ipa: "ə"
    notes: "Like the 'u' of 'but'. Every consonant carries it unless a sign changes it: ક (ka) is 'ka'. અમદાવાદ (amdāvād, Ahmedabad)."
  - id: gu-0002
    target: "આ"
    native: "aa, long"
    reading: "ā"
    ipa: "a"
    notes: "The 'a' of 'father'. અ (a) and આ (ā) are different sounds and make different words: આજ (āj, today). આ (ā) on its own is also 'this'."
  - id: gu-0003
    target: "ઇ"
    native: "i, short form"
    reading: "i"
    ipa: "i"
    notes: "Like the 'ee' of 'see', but short: ઇનામ (inām, prize)."
  - id: gu-0004
    target: "ઈ"
    native: "ii, long form"
    reading: "i"
    ipa: "i"
    modes: [recognition, production]
    notes: "Gujarati writes i two ways, short and long, but says them alike: which one a word takes is spelling. ઈંડું (iṇḍum̐, egg). Because it sounds like ઇ (i), it is drilled by reading and writing only."
  - id: gu-0005
    target: "ઉ"
    native: "u, short form"
    reading: "u"
    ipa: "u"
    notes: "Like the 'oo' of 'food', but short: ઉનાળો (unāḷo, summer)."
  - id: gu-0006
    target: "ઊ"
    native: "uu, long form"
    reading: "u"
    ipa: "u"
    modes: [recognition, production]
    notes: "As with i, the long and short u sound alike in Gujarati: ઊંટ (uṇṭ, camel). Because it sounds like ઉ (u), it is drilled by reading and writing only."
  - id: gu-0007
    target: "ઋ"
    native: "ru (a vowel letter)"
    reading: "ru"
    ipa: "ru"
    modes: [recognition, production]
    notes: "Said 'ru' in Gujarati, though it is written as one vowel, in words from Sanskrit: ઋતુ (rutu, season). A recogniser writes 'ru' as રુ (ru), so it is drilled by reading and writing only."
  - id: gu-0008
    target: "એ"
    native: "e (as in 'café')"
    reading: "e"
    ipa: "e"
    notes: "Usually the 'e' of 'café', without the glide of English 'say'. In some words it is opener, like the 'e' of 'bed', and the spelling doesn't show which. એક (ek, one). એ (e) on its own is also 'that; he, she'."
  - id: gu-0009
    target: "ઐ"
    native: "ai (as in 'kite')"
    reading: "ai"
    ipa: "əi"
    notes: "A glide from a to i, in words from Sanskrit: ઐતિહાસિક (aitihāsik, historical)."
  - id: gu-0010
    target: "ઓ"
    native: "o (as in 'go')"
    reading: "o"
    ipa: "o"
    notes: "Like the 'o' of 'go', without the 'w' English adds at the end. Some words have an opener o, like the 'o' of 'law'. ઓરડો (orḍo, room)."
  - id: gu-0011
    target: "ઔ"
    native: "au (as in 'cow')"
    reading: "au"
    ipa: "əu"
    notes: "A glide from a to u, in words from Sanskrit: ઔષધ (auśadh, medicine)."
  - id: gu-0012
    target: "અં"
    native: "an (a with the dot: a nasal)"
    reading: "am̐"
    ipa: "ə̃"
    modes: [recognition, production]
    notes: "The dot ં (am̐) above makes the vowel nasal, or before a consonant it is an n or m: અંદર (andar, inside). Gujarati lists અં (am̐) among its vowels. It is a mark on a letter rather than a sound of its own, so it is drilled by reading and writing only."
  - id: gu-0013
    target: "ઑ"
    native: "o, open (as in 'office')"
    reading: "ô"
    ipa: "ɔ"
    modes: [recognition, production]
    notes: "ઓ (o) with a moon on top, for the open o of English words: ઑફિસ (ôfis, office). Many writers leave the moon out, and a recogniser usually does, so it is drilled by reading and writing only."
