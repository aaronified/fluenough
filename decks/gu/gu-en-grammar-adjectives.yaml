schema: 1
id: gu-en-grammar-adjectives
name: "Adjectives: gender and number"
kind: grammar
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Adjectives in -ઓ agree with their noun in all three genders; the others never change. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Adjective agreement"
  slot_name: "agreement"
  slots: ["with a feminine noun", "with a neuter noun", "with a masculine plural", "with a neuter plural"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "An adjective in -ઓ agrees: સારો છોકરો, સારી છોકરી, સારું ઘર, સારા છોકરા, સારાં કેળાં. Before an ending a masculine or neuter adjective takes -આ: સારા છોકરાને. Any other adjective stays the same: ગરમ ચા, ગરમ દૂધ; સુંદર, ખરાબ, લાલ. A feminine plural keeps -ઈ: સારી છોકરીઓ."
  entries:
    - lemma: "સારો"
      key: saaro
      reading: "saro"
      gloss: "good"
      forms:
        "with a feminine noun": "સારી"
        "with a neuter noun": "સારું"
        "with a masculine plural": "સારા"
        "with a neuter plural": "સારાં"
      readings:
        "with a feminine noun": "sari"
        "with a neuter noun": "sarun"
        "with a masculine plural": "sara"
        "with a neuter plural": "saran"
    - lemma: "મોટો"
      key: moto
      reading: "moto"
      gloss: "big; older"
      forms:
        "with a feminine noun": "મોટી"
        "with a neuter noun": "મોટું"
        "with a masculine plural": "મોટા"
        "with a neuter plural": "મોટાં"
      readings:
        "with a feminine noun": "moti"
        "with a neuter noun": "motun"
        "with a masculine plural": "mota"
        "with a neuter plural": "motan"
    - lemma: "નાનો"
      key: naano
      reading: "nano"
      gloss: "small; younger"
      forms:
        "with a feminine noun": "નાની"
        "with a neuter noun": "નાનું"
        "with a masculine plural": "નાના"
        "with a neuter plural": "નાનાં"
      readings:
        "with a feminine noun": "nani"
        "with a neuter noun": "nanun"
        "with a masculine plural": "nana"
        "with a neuter plural": "nanan"
    - lemma: "નવો"
      key: navo
      reading: "navo"
      gloss: "new"
      forms:
        "with a feminine noun": "નવી"
        "with a neuter noun": "નવું"
        "with a masculine plural": "નવા"
        "with a neuter plural": "નવાં"
      readings:
        "with a feminine noun": "navi"
        "with a neuter noun": "navun"
        "with a masculine plural": "nava"
        "with a neuter plural": "navan"
    - lemma: "જૂનો"
      key: juuno
      reading: "juno"
      gloss: "old (a thing)"
      forms:
        "with a feminine noun": "જૂની"
        "with a neuter noun": "જૂનું"
        "with a masculine plural": "જૂના"
        "with a neuter plural": "જૂનાં"
      readings:
        "with a feminine noun": "juni"
        "with a neuter noun": "junun"
        "with a masculine plural": "juna"
        "with a neuter plural": "junan"
    - lemma: "ઠંડો"
      key: thando
      reading: "thando"
      gloss: "cold"
      forms:
        "with a feminine noun": "ઠંડી"
        "with a neuter noun": "ઠંડું"
        "with a masculine plural": "ઠંડા"
        "with a neuter plural": "ઠંડાં"
      readings:
        "with a feminine noun": "thandi"
        "with a neuter noun": "thandun"
        "with a masculine plural": "thanda"
        "with a neuter plural": "thandan"
    - lemma: "કાળો"
      key: kaalo
      reading: "kalo"
      gloss: "black"
      forms:
        "with a feminine noun": "કાળી"
        "with a neuter noun": "કાળું"
        "with a masculine plural": "કાળા"
        "with a neuter plural": "કાળાં"
      readings:
        "with a feminine noun": "kali"
        "with a neuter noun": "kalun"
        "with a masculine plural": "kala"
        "with a neuter plural": "kalan"
    - lemma: "લીલો"
      key: liilo
      reading: "lilo"
      gloss: "green"
      forms:
        "with a feminine noun": "લીલી"
        "with a neuter noun": "લીલું"
        "with a masculine plural": "લીલા"
        "with a neuter plural": "લીલાં"
      readings:
        "with a feminine noun": "lili"
        "with a neuter noun": "lilun"
        "with a masculine plural": "lila"
        "with a neuter plural": "lilan"
