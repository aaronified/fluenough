      gloss: "small; younger"
      forms:
        "with a feminine noun": "નાની"
        "with a neuter noun": "નાનું"
        "with a masculine plural": "નાના"
        "with a neuter plural": "નાનાં"
      readings:
        "with a feminine noun": "nāni"
        "with a neuter noun": "nānum̐"
        "with a masculine plural": "nānā"
        "with a neuter plural": "nānām̐"
      ipas:
