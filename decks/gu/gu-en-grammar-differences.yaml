schema: 1
id: gu-en-grammar-differences
name: "How Gujarati grammar differs from English"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Before any theme: the verb last, endings for in, from and to, three genders, two yous, two wes, no articles, and how Gujarati says have, not, like and questions. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: gu-0239
    target: "હું ચા પીઉં છું."
    native: "I drink tea."
    reading: "hum̐ cā pium̐ chum̐."
    ipa: "ɦũ tʃa piũ tʃʰũ"
    tags: ["grammar", "word-order"]
    notes: "The verb comes last: subject, object, verb. Word for word, 'I tea drink am'. છું (chum̐) is 'am', and the present is built with it."
  - id: gu-0240
    target: "તે ડૉક્ટર છે."
    native: "He is a doctor; she is a doctor."
    reading: "te ḍôkṭar che."
    ipa: "t̪e ɖɔkʈər tʃʰe"
    tags: ["grammar", "be"]
    notes: "છે (che), 'is', comes last. તે (te) is both he and she: the context, or the verb in the past, tells you which."
  - id: gu-0241
    target: "ઘરમાં"
    native: "in the house"
    reading: "gharmām̐"
    ipa: "ɡʱərmã"
    tags: ["grammar", "case-endings"]
    notes: "Gujarati puts 'in' after the noun, and writes it joined to it: ઘર (ghar, house) + -માં (-mām̐)."
  - id: gu-0242
    target: "સ્ટેશનથી"
    native: "from the station"
    reading: "sṭeśanthi"
    ipa: "sʈeʃənt̪ʰi"
    tags: ["grammar", "case-endings"]
    notes: "'From' is the ending -થી (-thi): સ્ટેશન (sṭeśan) + -થી (-thi). It also means 'by' or 'with' a tool: બસથી (basthi), by bus."
  - id: gu-0243
    target: "મીનાને"
    native: "to Meena"
    reading: "mināne"
    ipa: "minane"
    tags: ["grammar", "case-endings"]
    notes: "'To' a person is the ending -ને (-ne): મીનાને આપો (mināne āpo), give it to Meena."
  - id: gu-0244
    target: "છોકરો આવ્યો."
    native: "The boy came."
    reading: "chokro āvyo."
    ipa: "tʃʰokro aʋjo"
    tags: ["grammar", "gender"]
    notes: "Gujarati has three genders, and the past verb shows them. Masculine: -ઓ (-o)."
  - id: gu-0245
    target: "છોકરી આવી."
    native: "The girl came."
    reading: "chokri āvi."
    ipa: "tʃʰokri aʋi"
    tags: ["grammar", "gender"]
    notes: "Feminine: -ઈ (-i)."
  - id: gu-0246
    target: "બાળક આવ્યું."
    native: "The child came."
    reading: "bāḷak āvyum̐."
    ipa: "baɭək aʋjũ"
    tags: ["grammar", "gender"]
    notes: "Neuter: -ઉં (-um̐). Hindi lost its neuter; Gujarati kept it, for children, many things and some animals."
  - id: gu-0247
    target: "મારો ભાઈ"
    native: "my brother"
    reading: "māro bhāi"
    ipa: "maro bʱai"
    tags: ["grammar", "possession"]
    notes: "'My' agrees with what is owned, not with the owner: મારો ભાઈ (māro bhāi), my brother; મારી બહેન (māri bahen), my sister; મારું ઘર (mārum̐ ghar), my house."
  - id: gu-0248
    target: "મારી બહેન"
    native: "my sister"
    reading: "māri bahen"
    ipa: "mari bəɦen"
    tags: ["grammar", "possession"]
    notes: "મારી (māri) before a feminine noun. A woman says it too: the owner's gender doesn't count."
  - id: gu-0249
    target: "મારું ઘર"
    native: "my house"
    reading: "mārum̐ ghar"
    ipa: "marũ ɡʱər"
    tags: ["grammar", "possession"]
    notes: "મારું (mārum̐) before a neuter noun. ઘર (ghar) is neuter."
  - id: gu-0250
    target: "તું"
    native: "you (to a friend or a child)"
    reading: "tum̐"
    ipa: "t̪ũ"
    tags: ["grammar", "you"]
    notes: "Gujarati has two everyday words for 'you'. તું (tum̐) is for close friends, children and family your age or younger. The verb changes with each."
  - id: gu-0251
    target: "તમે"
    native: "you (respectful); you (plural)"
    reading: "tame"
    ipa: "t̪əme"
    tags: ["grammar", "you"]
    notes: "તમે (tame) is for strangers, elders and anyone you respect, and for more than one person. A learner is always safe with તમે (tame). Very formal Gujarati has આપ (āp)."
  - id: gu-0252
    target: "અમે"
    native: "we (not you)"
    reading: "ame"
    ipa: "əme"
    tags: ["grammar", "we"]
    notes: "Gujarati has two words for 'we'. અમે (ame) leaves out the person you are talking to: 'we, my family and I, but not you'."
  - id: gu-0253
    target: "આપણે"
    native: "we (you and I)"
    reading: "āpṇe"
    ipa: "apɳe"
    tags: ["grammar", "we"]
    notes: "આપણે (āpṇe) takes in the person you are talking to: આપણે જઈએ (āpṇe jaie), let's go."
  - id: gu-0254
    target: "મારી પાસે ગાડી છે."
    native: "I have a car."
    reading: "māri pāse gāḍi che."
    ipa: "mari pase ɡaɖi tʃʰe"
    tags: ["grammar", "have"]
    notes: "There is no verb 'have'. Word for word, 'near me a car is'."
  - id: gu-0255
    target: "હું ડૉક્ટર નથી."
    native: "I am not a doctor."
    reading: "hum̐ ḍôkṭar nathi."
    ipa: "ɦũ ɖɔkʈər nət̪ʰi"
    tags: ["grammar", "negative"]
    notes: "નથી (nathi) is 'am not, is not, are not', for every person. It takes the place of છું (chum̐) or છે (che)."
  - id: gu-0256
    target: "શું તમે ગુજરાતી બોલો છો?"
    native: "Do you speak Gujarati?"
    reading: "śum̐ tame gujarāti bolo cho?"
    ipa: "ʃũ t̪əme ɡudʒərat̪i bolo tʃʰo"
    tags: ["grammar", "questions"]
    notes: "શું (śum̐) at the start makes a yes-or-no question. It can be left out: then the voice rises at the end. Elsewhere in a sentence શું (śum̐) is 'what'."
  - id: gu-0257
    target: "મેં કેળું ખાધું."
    native: "I ate a banana."
    reading: "mem̐ keḷum̐ khādhum̐."
    ipa: "mẽ keɭũ kʰad̪ʱũ"
    tags: ["grammar", "past"]
    notes: "In the past, a verb with an object works differently: the doer takes the ending -એ (-e) (હું (hum̐) becomes મેં (mem̐), men) and the verb agrees with the thing eaten. કેળું (keḷum̐) is neuter, so ખાધું (khādhum̐)."
  - id: gu-0258
    target: "મને ચા ગમે છે."
    native: "I like tea."
    reading: "mane cā game che."
    ipa: "məne tʃa ɡəme tʃʰe"
    tags: ["grammar", "likes"]
    notes: "Word for word, 'to me tea is pleasing'. The one who likes takes -ને (-ne): મને (mane), to me."
  - id: gu-0259
    target: "એક છોકરો"
    native: "a boy"
    picture: "👦"
    reading: "ek chokro"
    ipa: "ek tʃʰokro"
    tags: ["grammar", "articles"]
    notes: "Gujarati has no 'a' or 'the'. એક (ek), 'one', can do the work of 'a'; often nothing is needed: છોકરો આવ્યો (chokro āvyo), the boy came, or a boy came."
