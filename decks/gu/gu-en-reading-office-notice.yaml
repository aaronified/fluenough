  "sentences":
  - "text": "બેઠક આવતી કાલે સવારે દસ વાગ્યે છે."
    "reading": "beṭhak āvti kāle savāre das vāgye che."
    "ipa": "beʈʰək aʋt̪i kale səʋare d̪əs ʋaɡje tʃʰe"
  - "text": "બધા સાથીઓ સમયસર આવે."
    "reading": "badhā sāthio samysar āve."
    "ipa": "bəd̪ʱa sat̪ʰio səmjsər aʋe"
  - "text": "વિષય: નવો પ્રોજેક્ટ અને સમયમર્યાદા."
    "reading": "viśay: navo projekṭ ane samymaryādā."
    "ipa": "ʋiʃəj nəʋo prodʒekʈ əne səmjmərjad̪a"
  - "text": "કૃપા કરીને તમારો અહેવાલ લાવજો."
    "reading": "krupā karine tamāro ahevāl lāvjo."
    "ipa": "krupa kərine t̪əmaro əɦeʋal laʋdʒo"
