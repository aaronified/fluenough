# The order Gujarati is taught from English in: one unit per line. First a
# few words and basic sentences, the sounds English lacks and how Gujarati
# grammar differs from English; then five more themes, each with the grammar
# that goes with it; then the script, before the rest. Every gu-en deck is
# listed exactly once. See ADR-0013 and docs/DECK-FORMAT.md.
schema: 1
kind: path
id: gu-en-path
language: gu
native: en
# The decks that need the alphabet: a learner who learns without it
# skips them.
alphabet:
  - gu-en-script-vowels
  - gu-en-script-consonants
  - gu-en-script-reading
  - gu-en-script-vowel-signs
  - gu-en-script-conjuncts
  - gu-en-spelling
  - gu-en-reading-keri
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  - [gu-en-first-words, gu-en-grammar-sentences, "*"]
  - [gu-en-sound-differences]
  - [gu-en-grammar-differences]
  - [gu-en-questions, gu-en-grammar-questions, "*"]
  - [gu-en-addressing, gu-en-grammar-pronouns, "*"]
  - [gu-en-about-me, gu-en-grammar-continuous, "*"]
  - [gu-en-family, gu-en-grammar-be, "*"]
  - [gu-en-work, gu-en-grammar-demonstratives, "*"]
  - [gu-en-script-vowels, gu-en-script-consonants, gu-en-script-reading]
  - [gu-en-script-vowel-signs, gu-en-script-conjuncts]
  - [gu-en-numbers-1-20, "*"]
  - [gu-en-numbers-big, "*"]
  - [gu-en-market, gu-en-grammar-nouns, gu-en-grammar-articles, "*"]
  - [gu-en-groceries, gu-en-grammar-gender-number, gu-en-grammar-needs, "*"]
  - [gu-en-transport, gu-en-grammar-postpositions, "*"]
  - [gu-en-directions, "*"]
  - [gu-en-home, gu-en-grammar-adjectives, "*"]
  - [gu-en-time, gu-en-grammar-future, "*"]
  - [gu-en-daily-life, gu-en-grammar-negative, "*"]
  - [gu-en-calendar, gu-en-grammar-past, "*"]
  - [gu-en-grammar-past-more, gu-en-grammar-conjunct-verbs]
  - [gu-en-grammar-compound-verbs]
  - [gu-en-eating-out, gu-en-grammar-conjunctions, gu-en-grammar-likes, "*"]
  - [gu-en-help, gu-en-grammar-irregular, gu-en-grammar-pitfalls, "*"]
  - [gu-en-registers]
  - [gu-en-slang]
  - [gu-en-grammar-can-must]
  - [gu-en-spelling]
  - [gu-en-reading-keri]
  - ["*"]
