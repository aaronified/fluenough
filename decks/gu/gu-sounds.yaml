# Gujarati's sound contrasts: pairs of letters or signs that change a word,
# for the speaking drill's feedback (#89) and the minimal-pair drill (#31).
# Each id is the tag the language's sound-differences deck uses. See
# ADR-0015 and docs/DECK-FORMAT.md. Gujarati does not tell long and short
# i or u apart in speech, so they are not a contrast here. Not yet checked
# by a Gujarati speaker: please report any mistake.
schema: 1
kind: "sounds"
part: "core"
id: "gu-sounds"
language: "gu"
contrasts:
  - id: "aspiration"
    pairs: [["ક", "ખ"], ["ગ", "ઘ"], ["ચ", "છ"], ["જ", "ઝ"], ["ટ", "ઠ"], ["ડ", "ઢ"], ["ત", "થ"], ["દ", "ધ"], ["પ", "ફ"], ["બ", "ભ"]]
  - id: "dental-retroflex"
    pairs: [["ત", "ટ"], ["થ", "ઠ"], ["દ", "ડ"], ["ધ", "ઢ"], ["ન", "ણ"]]
  - id: "lateral"
    pairs: [["લ", "ળ"]]
  - id: "a-aa"
    within_word: true
    pairs: [["", "ા"], ["અ", "આ"]]
  - id: "nasal"
    pairs: [["", "ં"]]
  - id: "gemination"
    pairs: [["ક", "ક્ક"], ["ચ", "ચ્ચ"], ["છ", "ચ્છ"], ["ટ", "ટ્ટ"], ["ઠ", "ઠ્ઠ"], ["ત", "ત્ત"], ["દ", "દ્દ"], ["ન", "ન્ન"], ["પ", "પ્પ"], ["મ", "મ્મ"], ["લ", "લ્લ"], ["વ", "વ્વ"]]
