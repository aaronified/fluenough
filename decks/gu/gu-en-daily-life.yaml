description: "The verbs of an ordinary day, from getting up to going to sleep. A verb is named by its form in -વું. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: gu-0501
    target: "ઊઠવું"
    native: "to get up; to wake up"
    reading: "uthvun"
    pos: "verb"
    notes: "A verb's dictionary form ends in -વું (-vun): its stem is what comes before, here ઊઠ-."
  - id: gu-0502
    target: "નહાવું"
    native: "to bathe; to have a shower"
    reading: "nahavun"
    pos: "verb"
  - id: gu-0503
    target: "નાસ્તો"
    native: "breakfast; a snack"
    reading: "nasto"
    pos: "noun"
    gender: "m"
    notes: "નાસ્તો કરવો (nasto karvo), to have breakfast. Gujarati snacks, from ખાખરા to ગાંઠિયા, are all નાસ્તો."
  - id: gu-0504
