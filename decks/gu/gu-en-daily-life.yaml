    reading: "khavun"
    pos: "verb"
  - id: gu-0505
    target: "જમવું"
    native: "to have a meal (lunch or dinner)"
    reading: "jamvun"
    pos: "verb"
    notes: "Politer than ખાવું for a proper meal: જમી લીધું? (jami lidhun?), have you eaten? is a common greeting. The meal itself is જમવાનું (jamvanun)."
