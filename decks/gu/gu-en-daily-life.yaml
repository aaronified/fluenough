description: "The verbs of an ordinary day, from getting up to going to sleep. A verb is named by its form in -વું (-vum̐). Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: gu-0501
    target: "ઊઠવું"
    native: "to get up; to wake up"
    reading: "uṭhvum̐"
    ipa: "uʈʰʋũ"
    pos: "verb"
    notes: "A verb's dictionary form ends in -વું (-vun): its stem is what comes before, here ઊઠ- (uṭh-)."
  - id: gu-0502
    target: "નહાવું"
    native: "to bathe; to have a shower"
    reading: "nahāvum̐"
    ipa: "nəɦaʋũ"
    pos: "verb"
  - id: gu-0503
    target: "નાસ્તો"
    native: "breakfast; a snack"
    reading: "nāsto"
    ipa: "nast̪o"
    pos: "noun"
    gender: "m"
    notes: "નાસ્તો કરવો (nāsto karvo), to have breakfast. Gujarati snacks, from ખાખરા (khākhrā) to ગાંઠિયા (gāṇṭhiyā), are all નાસ્તો (nāsto)."
  - id: gu-0504
    target: "ખાવું"
    native: "to eat"
    reading: "khāvum̐"
    ipa: "kʰaʋũ"
    pos: "verb"
  - id: gu-0505
    target: "જમવું"
    native: "to have a meal (lunch or dinner)"
    reading: "jamvum̐"
    ipa: "dʒəmʋũ"
    pos: "verb"
    notes: "Politer than ખાવું (khāvum̐) for a proper meal: જમી લીધું? (jami lidhun?), have you eaten? is a common greeting. The meal itself is જમવાનું (jamvānum̐)."
  - id: gu-0506
    target: "પીવું"
    native: "to drink"
    reading: "pivum̐"
    ipa: "piʋũ"
    pos: "verb"
  - id: gu-0507
    target: "રાંધવું"
