schema: 1
id: gu-en-family
name: "Family"
kind: vocab
theme: family
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Parents, children, grandparents, and the many aunts and uncles: Gujarati has a word for each side of the family. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: gu-0331
    target: "કુટુંબ"
    native: "family"
    reading: "kutumb"
    pos: "noun"
    gender: "n"
    notes: "Also પરિવાર (parivaar). Many Gujarati families live together across three generations."
  - id: gu-0332
    target: "મમ્મી"
    native: "mum"
    reading: "mammii"
    alt_target: ["મા"]
    pos: "noun"
    gender: "f"
    notes: "Also મા (maa), and in many families બા (baa). Spoken of with respect, she takes a plural verb: મમ્મી આવ્યાં."
  - id: gu-0333
    target: "પપ્પા"
    native: "dad"
    reading: "pappaa"
    pos: "noun"
    gender: "m"
    notes: "Also બાપુજી (baapujii), older and respectful, and પિતા (pitaa), formal. A father takes a plural verb: પપ્પા આવ્યા."
  - ref: gu-0307
  - ref: gu-0308
  - id: gu-0334
    target: "મોટાભાઈ"
    native: "elder brother"
    reading: "motaabhaaii"
    pos: "noun"
    gender: "m"
    notes: "Literally 'big brother'. An elder sister is મોટીબહેન (motiibahen). A younger one is નાનો ભાઈ, નાની બહેન."
  - id: gu-0335
    target: "દીકરો"
    native: "son"
    reading: "diikro"
    pos: "noun"
    gender: "m"
  - id: gu-0336
    target: "દીકરી"
    native: "daughter"
    reading: "diikrii"
    pos: "noun"
    gender: "f"
  - id: gu-0337
    target: "બાળક"
    native: "child; baby"
    reading: "baalak"
    pos: "noun"
    gender: "n"
    notes: "Neuter, whether a boy or a girl. The plural is બાળકો (baalko)."
  - id: gu-0338
    target: "પતિ"
    native: "husband"
    reading: "pati"
    pos: "noun"
    gender: "m"
    notes: "In speech many women say 'my husband' without his name: એ (e), 'he', or ઘરવાળા (gharvaalaa)."
  - id: gu-0339
    target: "પત્ની"
    native: "wife"
    reading: "patnii"
    pos: "noun"
    gender: "f"
  - ref: gu-0311
  - id: gu-0340
    target: "દાદી"
    native: "grandmother (father's mother)"
    reading: "daadii"
    pos: "noun"
    gender: "f"
    notes: "Many families say બા (baa) instead."
  - id: gu-0341
    target: "નાના"
    native: "grandfather (mother's father)"
    reading: "naanaa"
    pos: "noun"
    gender: "m"
    notes: "The same word as નાના, 'small' (plural): only the context tells."
  - id: gu-0342
    target: "નાની"
    native: "grandmother (mother's mother)"
    reading: "naanii"
    pos: "noun"
    gender: "f"
  - ref: gu-0309
  - id: gu-0343
    target: "કાકી"
    native: "aunt (father's brother's wife)"
    reading: "kaakii"
    pos: "noun"
    gender: "f"
  - id: gu-0344
    target: "ફોઈ"
    native: "aunt (father's sister)"
    reading: "phoii"
    pos: "noun"
    gender: "f"
    notes: "A Gujarati word: Hindi says बुआ. Her husband is ફુવા (phuvaa). The ફોઈ traditionally names a new baby."
  - id: gu-0345
    target: "મામા"
    native: "uncle (mother's brother)"
    reading: "maamaa"
    pos: "noun"
    gender: "m"
    notes: "His wife is મામી (maamii)."
  - ref: gu-0310
  - id: gu-0346
    target: "ભાભી"
    native: "brother's wife"
    reading: "bhaabhii"
    pos: "noun"
    gender: "f"
  - id: gu-0347
    target: "બનેવી"
    native: "sister's husband"
    reading: "banevii"
    pos: "noun"
    gender: "m"
  - id: gu-0348
    target: "સાસુ"
    native: "mother-in-law"
    reading: "saasu"
    pos: "noun"
    gender: "f"
    notes: "The father-in-law is સસરા (sasraa)."
  - id: gu-0349
    target: "છોકરો"
    native: "boy"
    reading: "chhokro"
    pos: "noun"
    gender: "m"
    notes: "Also 'son', in speech: મારો છોકરો, my boy."
  - id: gu-0350
    target: "છોકરી"
    native: "girl"
    reading: "chhokrii"
    pos: "noun"
    gender: "f"
  - id: gu-0351
    target: "મારે બે ભાઈ છે."
    native: "I have two brothers."
    reading: "maare be bhaaii chhe."
    pos: "phrase"
    notes: "For relatives, Gujarati says મારે (maare), 'to me', rather than મારી પાસે, 'near me'. After a number the noun can stay singular."
