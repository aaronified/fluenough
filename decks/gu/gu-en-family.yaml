schema: 1
id: gu-en-family
name: "Family"
kind: vocab
theme: family
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Parents, children, grandparents, and the many aunts and uncles: Gujarati has a word for each side of the family. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: gu-0331
    target: "કુટુંબ"
    native: "family"
    reading: "kuṭumb"
    ipa: "kuʈumb"
    pos: "noun"
    gender: "n"
    notes: "Also પરિવાર (parivār). Many Gujarati families live together across three generations."
  - id: gu-0332
    target: "મમ્મી"
    native: "mum"
    reading: "mammi"
    ipa: "məmmi"
    alt_target: ["મા"]
    pos: "noun"
    gender: "f"
    notes: "Also મા (mā), and in many families બા (bā). Spoken of with respect, she takes a plural verb: મમ્મી આવ્યાં (mammi āvyām̐)."
  - id: gu-0333
    target: "પપ્પા"
    native: "dad"
    reading: "pappā"
    ipa: "pəppa"
    pos: "noun"
    gender: "m"
    notes: "Also બાપુજી (bāpuji), older and respectful, and પિતા (pitā), formal. A father takes a plural verb: પપ્પા આવ્યા (pappā āvyā)."
  - ref: gu-0307
  - ref: gu-0308
  - id: gu-0334
    target: "મોટાભાઈ"
    native: "elder brother"
    reading: "moṭābhāi"
    ipa: "moʈabʱai"
    pos: "noun"
    gender: "m"
    notes: "Literally 'big brother'. An elder sister is મોટીબહેન (moṭibahen). A younger one is નાનો ભાઈ (nāno bhāi), નાની બહેન (nāni bahen)."
  - id: gu-0335
    target: "દીકરો"
    native: "son"
    reading: "dikro"
    ipa: "d̪ikro"
    pos: "noun"
    gender: "m"
  - id: gu-0336
    target: "દીકરી"
    native: "daughter"
    reading: "dikri"
    ipa: "d̪ikri"
    pos: "noun"
    gender: "f"
  - id: gu-0337
    target: "બાળક"
    native: "child; baby"
    reading: "bāḷak"
    ipa: "baɭək"
    pos: "noun"
    gender: "n"
    notes: "Neuter, whether a boy or a girl. The plural is બાળકો (bāḷko)."
  - id: gu-0338
    target: "પતિ"
    native: "husband"
    reading: "pati"
    ipa: "pət̪i"
    pos: "noun"
    gender: "m"
    notes: "In speech many women say 'my husband' without his name: એ (e), 'he', or ઘરવાળા (gharvāḷā)."
  - id: gu-0339
    target: "પત્ની"
    native: "wife"
    reading: "patni"
    ipa: "pət̪ni"
    pos: "noun"
    gender: "f"
  - ref: gu-0311
  - id: gu-0340
    target: "દાદી"
    native: "grandmother (father's mother)"
    reading: "dādi"
    ipa: "d̪ad̪i"
    pos: "noun"
    gender: "f"
    notes: "Many families say બા (bā) instead."
  - id: gu-0341
    target: "નાના"
    native: "grandfather (mother's father)"
    reading: "nānā"
    ipa: "nana"
    pos: "noun"
    gender: "m"
    notes: "The same word as નાના (nānā), 'small' (plural): only the context tells."
  - id: gu-0342
    target: "નાની"
    native: "grandmother (mother's mother)"
    reading: "nāni"
    ipa: "nani"
    pos: "noun"
    gender: "f"
  - ref: gu-0309
  - id: gu-0343
    target: "કાકી"
    native: "aunt (father's brother's wife)"
    reading: "kāki"
    ipa: "kaki"
    pos: "noun"
    gender: "f"
  - id: gu-0344
    target: "ફોઈ"
    native: "aunt (father's sister)"
    reading: "phoi"
    ipa: "pʰoi"
    pos: "noun"
    gender: "f"
    notes: "A Gujarati word: Hindi says बुआ (buā). Her husband is ફુવા (phuvā). The ફોઈ (phoi) traditionally names a new baby."
  - id: gu-0345
    target: "મામા"
    native: "uncle (mother's brother)"
    reading: "māmā"
    ipa: "mama"
    pos: "noun"
    gender: "m"
    notes: "His wife is મામી (māmi)."
  - ref: gu-0310
  - id: gu-0346
    target: "ભાભી"
    native: "brother's wife"
    reading: "bhābhi"
    ipa: "bʱabʱi"
    pos: "noun"
    gender: "f"
  - id: gu-0347
    target: "બનેવી"
    native: "sister's husband"
    reading: "banevi"
    ipa: "bəneʋi"
    pos: "noun"
    gender: "m"
  - id: gu-0348
    target: "સાસુ"
    native: "mother-in-law"
    reading: "sāsu"
    ipa: "sasu"
    pos: "noun"
    gender: "f"
    notes: "The father-in-law is સસરા (sasrā)."
  - id: gu-0349
    target: "છોકરો"
    native: "boy"
    reading: "chokro"
    ipa: "tʃʰokro"
    pos: "noun"
    gender: "m"
    notes: "Also 'son', in speech: મારો છોકરો (māro chokro), my boy."
  - id: gu-0350
    target: "છોકરી"
    native: "girl"
    reading: "chokri"
    ipa: "tʃʰokri"
    pos: "noun"
    gender: "f"
  - id: gu-0351
    target: "મારે બે ભાઈ છે."
    native: "I have two brothers."
    reading: "māre be bhāi che."
    ipa: "mare be bʱai tʃʰe"
    pos: "phrase"
    notes: "For relatives, Gujarati says મારે (māre), 'to me', rather than મારી પાસે (māri pāse), 'near me'. After a number the noun can stay singular."
