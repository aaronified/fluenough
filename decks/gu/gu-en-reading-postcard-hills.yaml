  "sentences":
  - "text": "પ્રિય મિત્ર, અમે પહાડો પર છીએ."
    "reading": "priy mitra, ame pahāḍo par chie."
    "ipa": "prij mit̪rə əme pəɦaɖo pər tʃʰie"
  - "text": "અહીંનું હવામાન સરસ છે, અને રાત્રે ઠંડું છે."
    "reading": "ahinnum̐ havāmān saras che, ane rātre ṭhaṇḍum̐ che."
    "ipa": "əɦinnũ ɦəʋaman sərəs tʃʰe əne rat̪re ʈʰəɳɖũ tʃʰe"
  - "text": "સવારે બહુ ઠંડી હવા છે, પણ બપોરે સૂરજ ગરમ છે."
    "reading": "savāre bahu ṭhaṇḍi havā che, paṇ bapore suraj garam che."
    "ipa": "səʋare bəɦu ʈʰəɳɖi ɦəʋa tʃʰe pəɳ bəpore surədʒ ɡərəm tʃʰe"
  - "text": "અહીંનું ખાવાનું સરસ છે, ખાસ કરીને દાળ-ભાત."
    "reading": "ahinnum̐ khāvānum̐ saras che, khās karine dāḷ-bhāt."
    "ipa": "əɦinnũ kʰaʋanũ sərəs tʃʰe kʰas kərine d̪aɭbʱat̪"
  - "text": "અમે બધા ખુશ છીએ."
    "reading": "ame badhā khuś chie."
    "ipa": "əme bəd̪ʱa kʰuʃ tʃʰie"
