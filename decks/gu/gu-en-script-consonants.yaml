schema: 1
id: gu-en-script-consonants
name: "Gujarati consonants"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Every consonant a beginner meets, each carrying its vowel a: the plain and breathy ones, the ones on the teeth and curled back, and the two n's and two l's. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: gu-0014
    target: "ક"
    native: "k (ka)"
    reading: "ka"
    ipa: "kə"
    notes: "Like the 'k' of 'skin', with no puff of breath. Every consonant carries the short a (અ) unless a sign changes it. કમળ (kamaḷ, lotus)."
  - id: gu-0015
    target: "ખ"
    native: "kh, with a breath (kha)"
    reading: "kha"
    ipa: "kʰə"
    notes: "ક with a puff of breath after it: ખેતર (khetar, field). Its shape is unlike Devanagari ख."
  - id: gu-0016
    target: "ગ"
    native: "g (ga)"
    reading: "ga"
    ipa: "ɡə"
    notes: "Like the 'g' of 'go': ગાય (gāy, cow)."
  - id: gu-0017
    target: "ઘ"
    native: "gh, with a breath (gha)"
    reading: "gha"
    ipa: "ɡʱə"
    notes: "ગ with a breath after it: ઘર (ghar, house)."
  - id: gu-0018
    target: "ઙ"
    native: "ng (as in 'sing')"
    reading: "ṅa"
    ipa: "ŋə"
    modes: [recognition, production]
    notes: "Rare: Gujarati writes the dot ં in its place. Hardly ever heard on its own, so it is drilled by reading and writing only."
  - id: gu-0019
    target: "ચ"
    native: "ch (ca)"
    reading: "ca"
    ipa: "tʃə"
    notes: "Like the 'ch' of 'church', with no puff of breath: ચા (cā, tea)."
  - id: gu-0020
    target: "છ"
    native: "chh, with a breath (cha)"
    reading: "cha"
    ipa: "tʃʰə"
    notes: "ચ with a breath after it: છત્રી (chatri, umbrella). On its own, છ is also the number six, and છે (che) is 'is'."
  - id: gu-0021
    target: "જ"
    native: "j (ja)"
    reading: "ja"
    ipa: "dʒə"
    notes: "Like the 'j' of 'judge': જમવું (jamvum̐, to have a meal). Its shape is Gujarati's own."
  - id: gu-0022
    target: "ઝ"
    native: "jh, with a breath (jha)"
    reading: "jha"
    ipa: "dʒʱə"
    notes: "જ with a breath after it: ઝાડ (jhāḍ, tree). Many speakers say it close to an English z."
  - id: gu-0023
    target: "ઞ"
    native: "ny (in conjuncts)"
    reading: "ña"
    ipa: "ɲə"
    modes: [recognition, production]
    notes: "Seen almost only inside the join જ્ઞ. Hardly ever heard on its own, so it is drilled by reading and writing only."
  - id: gu-0024
    target: "ટ"
    native: "t, curled back (ṭa)"
    reading: "ṭa"
    ipa: "ʈə"
    notes: "The tongue curled back to touch the roof of the mouth: ટામેટું (ṭāmeṭum̐, tomato). The English t is close to it."
  - id: gu-0025
    target: "ઠ"
    native: "th, curled back, with a breath (ṭha)"
    reading: "ṭha"
    ipa: "ʈʰə"
    notes: "ટ with a breath after it: ઠંડી (ṭhaṇḍi, cold weather)."
  - id: gu-0026
    target: "ડ"
    native: "d, curled back (ḍa)"
    reading: "ḍa"
    ipa: "ɖə"
    notes: "The tongue curled back: ડુંગળી (ḍuṅgḷi, onion). The English d is close to it."
  - id: gu-0027
    target: "ઢ"
    native: "dh, curled back, with a breath (ḍha)"
    reading: "ḍha"
    ipa: "ɖʱə"
    notes: "ડ with a breath after it: ઢોલ (ḍhol, drum)."
  - id: gu-0028
    target: "ણ"
    native: "n, curled back (ṇa)"
    reading: "ṇa"
    ipa: "ɳə"
    notes: "An n with the tongue curled back. No word starts with it, but it is everywhere inside words: પાણી (pāṇi, water)."
  - id: gu-0029
    target: "ત"
    native: "t, on the teeth (ta)"
    reading: "ta"
    ipa: "t̪ə"
    notes: "The tongue touches the back of the top teeth, softer than English t: તરબૂચ (tarbuc, watermelon)."
  - id: gu-0030
    target: "થ"
    native: "th, on the teeth, with a breath (tha)"
    reading: "tha"
    ipa: "t̪ʰə"
    notes: "ત with a puff of breath: not the 'th' of 'thin'. થાળી (thāḷi, plate)."
  - id: gu-0031
    target: "દ"
    native: "d, on the teeth (da)"
    reading: "da"
    ipa: "d̪ə"
    notes: "The tongue on the teeth: દૂધ (dudh, milk)."
  - id: gu-0032
    target: "ધ"
    native: "dh, on the teeth, with a breath (dha)"
    reading: "dha"
    ipa: "d̪ʱə"
    notes: "દ with a breath after it: ધીમે (dhime, slowly)."
  - id: gu-0033
    target: "ન"
    native: "n (na)"
    reading: "na"
    ipa: "nə"
    notes: "Like the English n, with the tongue on the teeth: નાક (nāk, nose)."
  - id: gu-0034
    target: "પ"
    native: "p (pa)"
    reading: "pa"
    ipa: "pə"
    notes: "Like the 'p' of 'spin', with no puff of breath: પગ (pag, foot)."
  - id: gu-0035
    target: "ફ"
    native: "ph, with a breath (pha)"
    reading: "pha"
    ipa: "pʰə"
    notes: "પ with a breath after it, though many speakers say it as an f: ફળ (phaḷ, fruit). Gujarati writes the f of English words with it too: ફોન (fon, phone)."
  - id: gu-0036
    target: "બ"
    native: "b (ba)"
    reading: "ba"
    ipa: "bə"
    notes: "Like the 'b' of 'bat': બા (bā, mother; grandmother)."
  - id: gu-0037
    target: "ભ"
    native: "bh, with a breath (bha)"
    reading: "bha"
    ipa: "bʱə"
    notes: "બ with a breath after it: ભાઈ (bhāi, brother)."
  - id: gu-0038
    target: "મ"
    native: "m (ma)"
    reading: "ma"
    ipa: "mə"
    notes: "Like the English m: મા (mā, mother)."
  - id: gu-0039
    target: "ય"
    native: "y (ya)"
    reading: "ya"
    ipa: "jə"
    notes: "Like the 'y' of 'yes': યાદ (yād, memory)."
  - id: gu-0040
    target: "ર"
    native: "r (ra)"
    reading: "ra"
    ipa: "rə"
    notes: "A light tap of the tongue, as in Spanish 'pero': રસ્તો (rasto, road)."
  - id: gu-0041
    target: "લ"
    native: "l, on the teeth (la)"
    reading: "la"
    ipa: "lə"
    notes: "The tongue on the teeth: લીંબુ (limbu, lemon). Compare ળ, curled back."
  - id: gu-0042
    target: "વ"
    native: "v (va)"
    reading: "va"
    ipa: "ʋə"
    notes: "Between English v and w: વાત (vāt, talk; a matter)."
  - id: gu-0043
    target: "શ"
    native: "sh (śa)"
    reading: "śa"
    ipa: "ʃə"
    notes: "Like the 'sh' of 'ship': શાક (śāk, a vegetable dish). Its shape is Gujarati's own."
  - id: gu-0044
    target: "ષ"
    native: "sh (śa), in words from Sanskrit"
    reading: "śa"
    ipa: "ʃə"
    modes: [recognition, production]
    notes: "Said like શ: ભાષા (bhāśā, language). Because it sounds the same, it is drilled by reading and writing only."
  - id: gu-0045
    target: "સ"
    native: "s (sa)"
    reading: "sa"
    ipa: "sə"
    notes: "Like the 's' of 'sun': સાત (sāt, seven). In some regional speech સ and શ are said alike."
  - id: gu-0046
    target: "હ"
    native: "h (ha)"
    reading: "ha"
    ipa: "ɦə"
    notes: "Like the English h: હાથ (hāth, hand). Between vowels it is often not said as an h but makes the vowel breathy: બહેન (bahen, sister) sounds close to 'ben'."
  - id: gu-0047
    target: "ળ"
    native: "l, curled back (ḷa)"
    reading: "ḷa"
    ipa: "ɭə"
    notes: "An l with the tongue curled back. No word starts with it, but it is common inside words: સોળ (soḷ, sixteen), કેળું (keḷum̐, banana)."
