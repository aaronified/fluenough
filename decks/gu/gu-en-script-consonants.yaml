schema: 1
id: gu-en-script-consonants
name: "Gujarati consonants"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Every consonant a beginner meets, each carrying its vowel a: the plain and breathy ones, the ones on the teeth and curled back, and the two n's and two l's. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: gu-0014
    target: "ક"
    native: "k (ka)"
    reading: "ka"
    notes: "Like the 'k' of 'skin', with no puff of breath. Every consonant carries the short a (અ) unless a sign changes it. કમળ (kamal, lotus)."
  - id: gu-0015
    target: "ખ"
    native: "kh, with a breath (kha)"
    reading: "kha"
    notes: "ક with a puff of breath after it: ખેતર (khetar, field). Its shape is unlike Devanagari ख."
  - id: gu-0016
    target: "ગ"
    native: "g (ga)"
    reading: "ga"
    notes: "Like the 'g' of 'go': ગાય (gay, cow)."
  - id: gu-0017
    target: "ઘ"
    native: "gh, with a breath (gha)"
    reading: "gha"
    notes: "ગ with a breath after it: ઘર (ghar, house)."
  - id: gu-0018
    target: "ઙ"
    native: "ng (as in 'sing')"
    reading: "nga"
    modes: [recognition, production]
    notes: "Rare: Gujarati writes the dot ં in its place. Hardly ever heard on its own, so it is drilled by reading and writing only."
  - id: gu-0019
    target: "ચ"
    native: "ch (cha)"
    reading: "cha"
    notes: "Like the 'ch' of 'church', with no puff of breath: ચા (cha, tea)."
  - id: gu-0020
    target: "છ"
    native: "chh, with a breath (chha)"
    reading: "chha"
    notes: "ચ with a breath after it: છત્રી (chhatri, umbrella). On its own, છ is also the number six, and છે (chhe) is 'is'."
  - id: gu-0021
    target: "જ"
    native: "j (ja)"
    reading: "ja"
    notes: "Like the 'j' of 'judge': જમવું (jamvun, to have a meal). Its shape is Gujarati's own."
  - id: gu-0022
    target: "ઝ"
    native: "jh, with a breath (jha)"
    reading: "jha"
    notes: "જ with a breath after it: ઝાડ (jhad, tree). Many speakers say it close to an English z."
  - id: gu-0023
    target: "ઞ"
    native: "ny (in conjuncts)"
    reading: "nya"
    modes: [recognition, production]
    notes: "Seen almost only inside the join જ્ઞ. Hardly ever heard on its own, so it is drilled by reading and writing only."
  - id: gu-0024
    target: "ટ"
    native: "t, curled back (ta)"
    reading: "ta"
    notes: "The tongue curled back to touch the roof of the mouth: ટામેટું (tametun, tomato). The English t is close to it."
  - id: gu-0025
    target: "ઠ"
    native: "th, curled back, with a breath (tha)"
    reading: "tha"
    notes: "ટ with a breath after it: ઠંડી (thandi, cold weather)."
  - id: gu-0026
    target: "ડ"
    native: "d, curled back (da)"
    reading: "da"
    notes: "The tongue curled back: ડુંગળી (dungli, onion). The English d is close to it."
  - id: gu-0027
    target: "ઢ"
    native: "dh, curled back, with a breath (dha)"
    reading: "dha"
    notes: "ડ with a breath after it: ઢોલ (dhol, drum)."
  - id: gu-0028
    target: "ણ"
    native: "n, curled back (na)"
    reading: "na"
    notes: "An n with the tongue curled back. No word starts with it, but it is everywhere inside words: પાણી (pani, water)."
  - id: gu-0029
    target: "ત"
    native: "t, on the teeth (ta)"
    reading: "ta"
    notes: "The tongue touches the back of the top teeth, softer than English t: તરબૂચ (tarbuch, watermelon)."
  - id: gu-0030
    target: "થ"
    native: "th, on the teeth, with a breath (tha)"
    reading: "tha"
    notes: "ત with a puff of breath: not the 'th' of 'thin'. થાળી (thali, plate)."
  - id: gu-0031
    target: "દ"
    native: "d, on the teeth (da)"
    reading: "da"
    notes: "The tongue on the teeth: દૂધ (dudh, milk)."
  - id: gu-0032
    target: "ધ"
    native: "dh, on the teeth, with a breath (dha)"
    reading: "dha"
    notes: "દ with a breath after it: ધીમે (dhime, slowly)."
  - id: gu-0033
    target: "ન"
    native: "n (na)"
    reading: "na"
    notes: "Like the English n, with the tongue on the teeth: નાક (nak, nose)."
  - id: gu-0034
    target: "પ"
    native: "p (pa)"
    reading: "pa"
    notes: "Like the 'p' of 'spin', with no puff of breath: પગ (pag, foot)."
  - id: gu-0035
    target: "ફ"
    native: "ph, with a breath (pha)"
    reading: "pha"
    notes: "પ with a breath after it, though many speakers say it as an f: ફળ (phal, fruit). Gujarati writes the f of English words with it too: ફોન (fon, phone)."
  - id: gu-0036
    target: "બ"
    native: "b (ba)"
    reading: "ba"
    notes: "Like the 'b' of 'bat': બા (ba, mother; grandmother)."
  - id: gu-0037
    target: "ભ"
    native: "bh, with a breath (bha)"
    reading: "bha"
    notes: "બ with a breath after it: ભાઈ (bhai, brother)."
  - id: gu-0038
    target: "મ"
    native: "m (ma)"
    reading: "ma"
    notes: "Like the English m: મા (ma, mother)."
  - id: gu-0039
    target: "ય"
    native: "y (ya)"
    reading: "ya"
    notes: "Like the 'y' of 'yes': યાદ (yad, memory)."
  - id: gu-0040
    target: "ર"
    native: "r (ra)"
    reading: "ra"
    notes: "A light tap of the tongue, as in Spanish 'pero': રસ્તો (rasto, road)."
  - id: gu-0041
    target: "લ"
    native: "l, on the teeth (la)"
    reading: "la"
    notes: "The tongue on the teeth: લીંબુ (limbu, lemon). Compare ળ, curled back."
  - id: gu-0042
    target: "વ"
    native: "v (va)"
    reading: "va"
    notes: "Between English v and w: વાત (vat, talk; a matter)."
  - id: gu-0043
    target: "શ"
    native: "sh (sha)"
    reading: "sha"
    notes: "Like the 'sh' of 'ship': શાક (shak, a vegetable dish). Its shape is Gujarati's own."
  - id: gu-0044
    target: "ષ"
    native: "sh (sha), in words from Sanskrit"
    reading: "sha"
    modes: [recognition, production]
    notes: "Said like શ: ભાષા (bhasha, language). Because it sounds the same, it is drilled by reading and writing only."
  - id: gu-0045
    target: "સ"
    native: "s (sa)"
    reading: "sa"
    notes: "Like the 's' of 'sun': સાત (sat, seven). In some regional speech સ and શ are said alike."
  - id: gu-0046
    target: "હ"
    native: "h (ha)"
    reading: "ha"
    notes: "Like the English h: હાથ (hath, hand). Between vowels it is often not said as an h but makes the vowel breathy: બહેન (bahen, sister) sounds close to 'ben'."
  - id: gu-0047
    target: "ળ"
    native: "l, curled back (la)"
    reading: "la"
    notes: "An l with the tongue curled back. No word starts with it, but it is common inside words: સોળ (sol, sixteen), કેળું (kelun, banana)."
