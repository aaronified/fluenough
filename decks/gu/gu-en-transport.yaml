id: gu-en-transport
name: "Bus, auto, cab"
kind: vocab
theme: transport
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Buses, autos, taxis and trains: getting a ride, asking the fare, and telling the driver where to stop. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - ref: gu-0054
    notes: "In the sense of the vehicle: બસ is feminine, as most vehicles are. The state's buses are the ST, એસટી (esatii)."
  - id: gu-0421
    target: "રિક્ષા"
    native: "auto-rickshaw"
    reading: "rikshaa"
    pos: "noun"
    gender: "f"
    notes: "The three-wheeled auto, in every town. Ask the fare first, or for the meter."
  - id: gu-0422
    target: "ટૅક્સી"
    native: "taxi"
    reading: "teksii"
    alt_target: ["ટેક્સી"]
    pos: "noun"
    gender: "f"
  - id: gu-0423
    target: "ગાડી"
    native: "car; train; a vehicle"
    reading: "gaadii"
    pos: "noun"
    gender: "f"
    notes: "Any vehicle, most often a car. મોટર (motar) is an older word for a car."
  - id: gu-0424
    target: "ટ્રેન"
    native: "train"
    reading: "tren"
    pos: "noun"
    gender: "f"
  - id: gu-0425
    target: "સ્ટેશન"
    native: "station"
    reading: "steshan"
    pos: "noun"
    gender: "n"
  - id: gu-0426
    target: "ટિકિટ"
    native: "ticket"
    reading: "tikit"
    pos: "noun"
    gender: "f"
  - id: gu-0427
    target: "ભાડું"
    native: "fare; rent"
    reading: "bhaadun"
    pos: "noun"
    gender: "n"
  - id: gu-0428
    target: "સ્ટેશન જવું છે."
    native: "I want to go to the station."
    reading: "steshan javun chhe."
    pos: "phrase"
    notes: "What to say to a driver: the place, then જવું છે. મારે, 'I', is understood."
  - id: gu-0429
    target: "કેટલું ભાડું થશે?"
    native: "What will the fare be?"
    reading: "ketlun bhaadun thashe?"
    pos: "phrase"
    notes: "Literally 'how much fare will it become?'."
  - id: gu-0430
    target: "મીટર ચાલુ કરો."
    native: "Please put the meter on."
    reading: "miitar chaalu karo."
    pos: "phrase"
  - id: gu-0431
    target: "અહીં ઊભી રાખો."
    native: "Stop here."
    reading: "ahiin uubhii raakho."
    pos: "phrase"
    notes: "Literally 'keep it standing here'. ઊભી agrees with the feminine રિક્ષા or ગાડી."
  - id: gu-0432
    target: "આ બસ ક્યાં જાય છે?"
    native: "Where does this bus go?"
    reading: "aa bas kyaan jaay chhe?"
    pos: "phrase"
