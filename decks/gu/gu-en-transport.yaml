description: "Buses, autos, taxis and trains: getting a ride, asking the fare, and telling the driver where to stop. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - ref: gu-0054
    notes: "In the sense of the vehicle: બસ (bas) is feminine, as most vehicles are. The state's buses are the ST, એસટી (esaṭi)."
  - id: gu-0421
    target: "રિક્ષા"
    native: "auto-rickshaw"
    picture: "🛺"
    reading: "rikśā"
    ipa: "rikʃa"
    pos: "noun"
    gender: "f"
    notes: "The three-wheeled auto, in every town. Ask the fare first, or for the meter."
  - id: gu-0422
    target: "ટૅક્સી"
    native: "taxi"
    picture: "🚕"
    reading: "ṭêksi"
    ipa: "ʈɛksi"
    alt_target: ["ટેક્સી"]
    pos: "noun"
    gender: "f"
  - id: gu-0423
    target: "ગાડી"
    native: "car; train; a vehicle"
    reading: "gāḍi"
    ipa: "ɡaɖi"
    pos: "noun"
    gender: "f"
    notes: "Any vehicle, most often a car. મોટર (moṭar) is an older word for a car."
  - id: gu-0424
    target: "ટ્રેન"
    native: "train"
    picture: "🚆"
    reading: "ṭren"
    ipa: "ʈren"
    pos: "noun"
    gender: "f"
  - id: gu-0425
    target: "સ્ટેશન"
    native: "station"
    picture: "🚉"
    reading: "sṭeśan"
    ipa: "sʈeʃən"
    pos: "noun"
    gender: "n"
  - id: gu-0426
    target: "ટિકિટ"
    native: "ticket"
    picture: "🎫"
    reading: "ṭikiṭ"
    ipa: "ʈikiʈ"
    pos: "noun"
    gender: "f"
  - id: gu-0427
    target: "ભાડું"
    native: "fare; rent"
    reading: "bhāḍum̐"
    ipa: "bʱaɖũ"
    pos: "noun"
    gender: "n"
  - id: gu-0428
    target: "સ્ટેશન જવું છે."
    native: "I want to go to the station."
    reading: "sṭeśan javum̐ che."
    ipa: "sʈeʃən dʒəʋũ tʃʰe"
    pos: "phrase"
    notes: "What to say to a driver: the place, then જવું છે (javum̐ che). મારે (māre), 'I', is understood."
  - id: gu-0429
    target: "કેટલું ભાડું થશે?"
    native: "What will the fare be?"
    reading: "keṭlum̐ bhāḍum̐ thaśe?"
    ipa: "keʈlũ bʱaɖũ t̪ʰəʃe"
    pos: "phrase"
    notes: "Literally 'how much fare will it become?'."
  - id: gu-0430
    target: "મીટર ચાલુ કરો."
    native: "Please put the meter on."
    reading: "miṭar cālu karo."
    ipa: "miʈər tʃalu kəro"
    pos: "phrase"
  - id: gu-0431
    target: "અહીં ઊભી રાખો."
    native: "Stop here."
    reading: "ahim̐ ubhi rākho."
    ipa: "əɦĩ ubʱi rakʰo"
    pos: "phrase"
    notes: "Literally 'keep it standing here'. ઊભી (ubhi) agrees with the feminine રિક્ષા (rikśā) or ગાડી (gāḍi)."
  - id: gu-0432
    target: "આ બસ ક્યાં જાય છે?"
    native: "Where does this bus go?"
    reading: "ā bas kyām̐ jāy che?"
    ipa: "a bəs kjã dʒaj tʃʰe"
    pos: "phrase"
