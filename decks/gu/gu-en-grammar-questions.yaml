schema: 1
id: gu-en-grammar-questions
name: "Asking questions"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "A question keeps the order of a statement: the question word goes where the answer would, and a yes-or-no question just rises at the end. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: gu-0296
    target: "તમારું નામ શું છે?"
    native: "What is your name?"
    reading: "tamārum̐ nām śum̐ che?"
    ipa: "t̪əmarũ nam ʃũ tʃʰe"
    pos: "phrase"
    notes: "The answer goes where શું (śum̐) is: મારું નામ મીના છે (mārum̐ nām minā che)."
  - id: gu-0297
    target: "તમે ક્યાં રહો છો?"
    native: "Where do you live?"
    reading: "tame kyām̐ raho cho?"
    ipa: "t̪əme kjã rəɦo tʃʰo"
    pos: "phrase"
  - id: gu-0298
    target: "આ શું છે?"
    native: "What is this?"
    reading: "ā śum̐ che?"
    ipa: "a ʃũ tʃʰe"
    pos: "phrase"
  - id: gu-0299
    target: "એ કોણ છે?"
    native: "Who is that?"
    reading: "e koṇ che?"
    ipa: "e koɳ tʃʰe"
    pos: "phrase"
  - id: gu-0300
    target: "તમે ક્યારે આવશો?"
    native: "When will you come?"
    reading: "tame kyāre āvśo?"
    ipa: "t̪əme kjare aʋʃo"
    pos: "phrase"
  - id: gu-0301
    target: "કેટલા લોકો છે?"
    native: "How many people are there?"
    reading: "keṭlā loko che?"
    ipa: "keʈla loko tʃʰe"
    pos: "phrase"
    notes: "લોકો (loko), people, is masculine plural, so કેટલા (keṭlā)."
  - id: gu-0302
    target: "તમે કેમ ન આવ્યા?"
    native: "Why didn't you come?"
    reading: "tame kem na āvyā?"
    ipa: "t̪əme kem nə aʋja"
    pos: "phrase"
    notes: "ન (na) before the verb is 'not'."
  - id: gu-0303
    target: "ચા પીશો?"
    native: "Will you have some tea?"
    reading: "cā piśo?"
    ipa: "tʃa piʃo"
    pos: "phrase"
    notes: "No question word: the voice rises at the end. A host offers tea like this, and it is polite to accept."
  - id: gu-0304
    target: "તમને ગુજરાતી આવડે છે?"
    native: "Do you know Gujarati?"
    reading: "tamne gujarāti āvḍe che?"
    ipa: "t̪əmne ɡudʒərat̪i aʋɖe tʃʰe"
    pos: "phrase"
    notes: "Literally 'does Gujarati come to you?'."
  - id: gu-0305
    target: "તમે થાકી ગયા છો, ને?"
    native: "You're tired, aren't you?"
    reading: "tame thāki gayā cho, ne?"
    ipa: "t̪əme t̪ʰaki ɡəja tʃʰo ne"
    pos: "phrase"
    notes: "ને (ne) at the end asks for agreement, like 'isn't it?' or 'right?'."
  - id: gu-0306
    target: "કઈ બસ સ્ટેશન જાય છે?"
    native: "Which bus goes to the station?"
    reading: "kai bas sṭeśan jāy che?"
    ipa: "kəi bəs sʈeʃən dʒaj tʃʰe"
    pos: "phrase"
    notes: "બસ (bas) is feminine, so 'which' is કઈ (kai)."
