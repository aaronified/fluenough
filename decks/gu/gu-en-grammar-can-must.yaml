schema: 1
id: gu-en-grammar-can-must
name: "Can, must and should"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Can with શકવું, must with પડવું, should with જોઈએ, and what is planned with -વાનું. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: gu-0648
    target: "હું ગુજરાતી બોલી શકું છું."
    native: "I can speak Gujarati."
    reading: "hun gujaraatii bolii shakun chhun."
    pos: "phrase"
    notes: "The stem with -ઈ, then શકવું (shakvun), 'to be able', which takes the person's ending."
  - id: gu-0649
    target: "તમે અહીં બેસી શકો છો."
    native: "You can sit here."
    reading: "tame ahiin besii shako chho."
    pos: "phrase"
  - id: gu-0650
    target: "હું અંદર આવી શકું?"
    native: "May I come in?"
    reading: "hun andar aavii shakun?"
    pos: "phrase"
    notes: "Without છું, a question with શકું asks permission."
  - id: gu-0651
    target: "હું નથી આવી શકતો."
    native: "I can't come. (a man)"
    reading: "hun nathii aavii shakto."
    pos: "phrase"
    notes: "A woman says શકતી. Also હું આવી શકતો નથી."
  - id: gu-0652
    target: "અહીં ફોટો પાડી શકાય?"
    native: "Can one take photos here?"
    reading: "ahiin photo paadii shakaay?"
    pos: "phrase"
    notes: "-ઈ શકાય asks what is allowed, with no 'I' or 'you': the polite way to ask. ફોટો પાડવો is to take a photo."
  - id: gu-0653
    target: "મારે જવું પડશે."
    native: "I'll have to go."
    reading: "maare javun padshe."
    pos: "phrase"
    notes: "મારે, the verb in -વું, then પડવું (padvun), 'to fall': something you must do whether you like it or not."
  - id: gu-0654
    target: "મારે રોજ કામ કરવું પડે છે."
    native: "I have to work every day."
    reading: "maare roj kaam karvun pade chhe."
    pos: "phrase"
  - id: gu-0655
    target: "તમારે આરામ કરવો જોઈએ."
    native: "You should rest."
    reading: "tamaare aaraam karvo joiie."
    pos: "phrase"
    notes: "The verb in -વું, then જોઈએ: 'should'. આરામ is masculine, so કરવો."
  - id: gu-0656
    target: "આપણે વહેલા નીકળવું જોઈએ."
    native: "We should leave early."
    reading: "aapne vahelaa niikalvun joiie."
    pos: "phrase"
    notes: "નીકળવું (niikalvun), to set out."
  - id: gu-0657
    target: "મારે આજે ઑફિસ જવાનું છે."
    native: "I have to go to the office today."
    reading: "maare aaje ofis javaanun chhe."
    pos: "phrase"
    notes: "-વાનું છે is something planned or expected: 'I am to go'."
  - id: gu-0658
    target: "તમારે આવવાની જરૂર નથી."
    native: "You needn't come."
    reading: "tamaare aavvaanii jaruur nathii."
    pos: "phrase"
    notes: "Literally 'to you there is no need of coming'. જરૂર (jaruur), need, is feminine, so આવવાની."
