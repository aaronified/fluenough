schema: 1
id: gu-en-grammar-can-must
name: "Can, must and should"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Can with શકવું (śakvum̐), must with પડવું (paḍvum̐), should with જોઈએ (joie), and what is planned with -વાનું (-vānum̐). Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: gu-0648
    target: "હું ગુજરાતી બોલી શકું છું."
    native: "I can speak Gujarati."
    reading: "hum̐ gujarāti boli śakum̐ chum̐."
    ipa: "ɦũ ɡudʒərat̪i boli ʃəkũ tʃʰũ"
    pos: "phrase"
    notes: "The stem with -ઈ (-i), then શકવું (śakvum̐), 'to be able', which takes the person's ending."
  - id: gu-0649
    target: "તમે અહીં બેસી શકો છો."
    native: "You can sit here."
    reading: "tame ahim̐ besi śako cho."
    ipa: "t̪əme əɦĩ besi ʃəko tʃʰo"
    pos: "phrase"
  - id: gu-0650
    target: "હું અંદર આવી શકું?"
    native: "May I come in?"
    reading: "hum̐ andar āvi śakum̐?"
    ipa: "ɦũ ənd̪ər aʋi ʃəkũ"
    pos: "phrase"
    notes: "Without છું (chum̐), a question with શકું (śakum̐) asks permission."
  - id: gu-0651
    target: "હું નથી આવી શકતો."
    native: "I can't come. (a man)"
    reading: "hum̐ nathi āvi śakto."
    ipa: "ɦũ nət̪ʰi aʋi ʃəkt̪o"
    pos: "phrase"
    notes: "A woman says શકતી (śakti). Also હું આવી શકતો નથી (hum̐ āvi śakto nathi)."
  - id: gu-0652
    target: "અહીં ફોટો પાડી શકાય?"
    native: "Can one take photos here?"
    reading: "ahim̐ foṭo pāḍi śakāy?"
    ipa: "əɦĩ foʈo paɖi ʃəkaj"
    pos: "phrase"
    notes: "-ઈ શકાય (-i śakāy) asks what is allowed, with no 'I' or 'you': the polite way to ask. ફોટો પાડવો (phoṭo pāḍvo) is to take a photo."
  - id: gu-0653
    target: "મારે જવું પડશે."
    native: "I'll have to go."
    reading: "māre javum̐ paḍśe."
    ipa: "mare dʒəʋũ pəɖʃe"
    pos: "phrase"
    notes: "મારે (māre), the verb in -વું (-vum̐), then પડવું (paḍvum̐), 'to fall': something you must do whether you like it or not."
  - id: gu-0654
    target: "મારે રોજ કામ કરવું પડે છે."
    native: "I have to work every day."
    reading: "māre roj kām karvum̐ paḍe che."
    ipa: "mare rodʒ kam kərʋũ pəɖe tʃʰe"
    pos: "phrase"
  - id: gu-0655
    target: "તમારે આરામ કરવો જોઈએ."
    native: "You should rest."
    reading: "tamāre ārām karvo joie."
    ipa: "t̪əmare aram kərʋo dʒoie"
    pos: "phrase"
    notes: "The verb in -વું (-vum̐), then જોઈએ (joie): 'should'. આરામ (ārām) is masculine, so કરવો (karvo)."
  - id: gu-0656
    target: "આપણે વહેલા નીકળવું જોઈએ."
    native: "We should leave early."
    reading: "āpṇe vahelā nikaḷvum̐ joie."
    ipa: "apɳe ʋəɦela nikəɭʋũ dʒoie"
    pos: "phrase"
    notes: "નીકળવું (nikaḷvum̐), to set out."
  - id: gu-0657
    target: "મારે આજે ઑફિસ જવાનું છે."
    native: "I have to go to the office today."
    reading: "māre āje ôfis javānum̐ che."
    ipa: "mare adʒe ɔfis dʒəʋanũ tʃʰe"
    pos: "phrase"
    notes: "-વાનું છે (-vānum̐ che) is something planned or expected: 'I am to go'."
  - id: gu-0658
    target: "તમારે આવવાની જરૂર નથી."
    native: "You needn't come."
    reading: "tamāre āvvāni jarur nathi."
    ipa: "t̪əmare aʋʋani dʒərur nət̪ʰi"
    pos: "phrase"
    notes: "Literally 'to you there is no need of coming'. જરૂર (jarur), need, is feminine, so આવવાની (āvvāni)."
