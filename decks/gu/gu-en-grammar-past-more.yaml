schema: 1
id: gu-en-grammar-past-more
name: "Past tense with an object"
kind: grammar
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I ate, she saw: in the past a verb with an object agrees with the object, and the doer takes -એ. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Simple past, verbs with an object"
  slot_name: "the object"
  slots: ["a masculine object", "a feminine object", "a neuter object, or none", "a neuter plural object"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "With an object, the doer takes -એ: હું → મેં, તું → તેં, તે → તેણે, તેઓ → તેમણે, મીના → મીનાએ; અમે and તમે stay the same. The verb then agrees with the object, not with the doer: મેં ચા પીધી (ચા is feminine), મેં પાણી પીધું (neuter), મેં રોટલો ખાધો (masculine). With no object named, the verb is neuter: મેં ખાધું, I ate. A woman and a man say it alike."
  entries:
    - lemma: "ખાવું"
      key: khaavun
      reading: "khavun"
      gloss: "to eat"
      forms:
        "a masculine object": "ખાધો"
        "a feminine object": "ખાધી"
        "a neuter object, or none": "ખાધું"
        "a neuter plural object": "ખાધાં"
      readings:
        "a masculine object": "khadho"
        "a feminine object": "khadhi"
        "a neuter object, or none": "khadhun"
        "a neuter plural object": "khadhan"
    - lemma: "પીવું"
      key: piivun
      reading: "pivun"
      gloss: "to drink"
      forms:
        "a masculine object": "પીધો"
        "a feminine object": "પીધી"
        "a neuter object, or none": "પીધું"
        "a neuter plural object": "પીધાં"
      readings:
        "a masculine object": "pidho"
        "a feminine object": "pidhi"
        "a neuter object, or none": "pidhun"
        "a neuter plural object": "pidhan"
    - lemma: "લેવું"
      key: levun
      reading: "levun"
      gloss: "to take; to buy"
      forms:
        "a masculine object": "લીધો"
        "a feminine object": "લીધી"
        "a neuter object, or none": "લીધું"
        "a neuter plural object": "લીધાં"
      readings:
        "a masculine object": "lidho"
        "a feminine object": "lidhi"
        "a neuter object, or none": "lidhun"
        "a neuter plural object": "lidhan"
    - lemma: "કરવું"
      key: karvun
      reading: "karvun"
      gloss: "to do"
      forms:
        "a masculine object": "કર્યો"
        "a feminine object": "કરી"
        "a neuter object, or none": "કર્યું"
        "a neuter plural object": "કર્યાં"
      readings:
        "a masculine object": "karyo"
        "a feminine object": "kari"
        "a neuter object, or none": "karyun"
        "a neuter plural object": "karyan"
    - lemma: "જોવું"
      key: jovun
      reading: "jovun"
      gloss: "to see"
      forms:
        "a masculine object": "જોયો"
        "a feminine object": "જોઈ"
        "a neuter object, or none": "જોયું"
        "a neuter plural object": "જોયાં"
      readings:
        "a masculine object": "joyo"
        "a feminine object": "joi"
        "a neuter object, or none": "joyun"
        "a neuter plural object": "joyan"
    - lemma: "આપવું"
      key: aapvun
      reading: "apvun"
      gloss: "to give"
      forms:
        "a masculine object": "આપ્યો"
        "a feminine object": "આપી"
        "a neuter object, or none": "આપ્યું"
        "a neuter plural object": "આપ્યાં"
      readings:
        "a masculine object": "apyo"
        "a feminine object": "api"
        "a neuter object, or none": "apyun"
        "a neuter plural object": "apyan"
    - lemma: "વાંચવું"
      key: vaanchvun
      reading: "vanchvun"
      gloss: "to read"
      forms:
        "a masculine object": "વાંચ્યો"
        "a feminine object": "વાંચી"
        "a neuter object, or none": "વાંચ્યું"
        "a neuter plural object": "વાંચ્યાં"
      readings:
        "a masculine object": "vanchyo"
        "a feminine object": "vanchi"
        "a neuter object, or none": "vanchyun"
        "a neuter plural object": "vanchyan"
