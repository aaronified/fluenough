schema: 1
id: gu-en-grammar-past-more
name: "Past tense with an object"
kind: grammar
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I ate, she saw: in the past a verb with an object agrees with the object, and the doer takes -એ. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Simple past, verbs with an object"
  slot_name: "the object"
  slots: ["a masculine object", "a feminine object", "a neuter object, or none", "a neuter plural object"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "With an object, the doer takes -એ: હું → મેં, તું → તેં, તે → તેણે, તેઓ → તેમણે, મીના → મીનાએ; અમે and તમે stay the same. The verb then agrees with the object, not with the doer: મેં ચા પીધી (ચા is feminine), મેં પાણી પીધું (neuter), મેં રોટલો ખાધો (masculine). With no object named, the verb is neuter: મેં ખાધું, I ate. A woman and a man say it alike."
  entries:
    - lemma: "ખાવું"
      key: khaavun
      reading: "khāvum̐"
      ipa: "kʰaʋũ"
      gloss: "to eat"
      forms:
        "a masculine object": "ખાધો"
        "a feminine object": "ખાધી"
        "a neuter object, or none": "ખાધું"
        "a neuter plural object": "ખાધાં"
      readings:
        "a masculine object": "khādho"
        "a feminine object": "khādhi"
        "a neuter object, or none": "khādhum̐"
        "a neuter plural object": "khādhām̐"
      ipas:
        "a masculine object": "kʰad̪ʱo"
        "a feminine object": "kʰad̪ʱi"
        "a neuter object, or none": "kʰad̪ʱũ"
        "a neuter plural object": "kʰad̪ʱã"
    - lemma: "પીવું"
      key: piivun
      reading: "pivum̐"
      ipa: "piʋũ"
      gloss: "to drink"
      forms:
        "a masculine object": "પીધો"
        "a feminine object": "પીધી"
        "a neuter object, or none": "પીધું"
        "a neuter plural object": "પીધાં"
      readings:
        "a masculine object": "pidho"
        "a feminine object": "pidhi"
        "a neuter object, or none": "pidhum̐"
        "a neuter plural object": "pidhām̐"
      ipas:
        "a masculine object": "pid̪ʱo"
        "a feminine object": "pid̪ʱi"
        "a neuter object, or none": "pid̪ʱũ"
        "a neuter plural object": "pid̪ʱã"
    - lemma: "લેવું"
      key: levun
      reading: "levum̐"
      ipa: "leʋũ"
      gloss: "to take; to buy"
      forms:
        "a masculine object": "લીધો"
        "a feminine object": "લીધી"
        "a neuter object, or none": "લીધું"
        "a neuter plural object": "લીધાં"
      readings:
        "a masculine object": "lidho"
        "a feminine object": "lidhi"
