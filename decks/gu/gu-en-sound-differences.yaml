schema: 1
id: gu-en-sound-differences
name: "Sounds to tell apart"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Pairs of everyday words that differ in one sound: the tongue on the teeth or curled back, the two l's, a breath after the consonant, a and aa, and a nasal vowel. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: gu-0226
    target: "દાળ"
    native: "dal; lentils"
    reading: "dal"
    tags: ["dental-retroflex"]
    notes: "Dental against curled back: દાળ (dal, lentils) has the tongue on the teeth for d; ડાળ (dal, branch) has it curled back."
  - id: gu-0227
    target: "ડાળ"
    native: "branch (of a tree)"
    reading: "dal"
    tags: ["dental-retroflex"]
    notes: "Dental against curled back: દાળ (dal, lentils) has the tongue on the teeth for d; ડાળ (dal, branch) has it curled back."
  - id: gu-0228
    target: "વાળ"
    native: "hair"
    reading: "val"
    tags: ["lateral"]
    notes: "The two l's: વાળ (val, hair) has the l curled back; વાલ (val, field beans) has it on the teeth."
  - id: gu-0229
    target: "વાલ"
    native: "field beans (a dried bean)"
    reading: "val"
    tags: ["lateral"]
    notes: "The two l's: વાલ (val, beans) has the l on the teeth; વાળ (val, hair) has it curled back."
  - ref: gu-0120
    tags: ["aspiration"]
    notes: "A breath after the consonant: બાર (bar, twelve) has none; ભાર (bhar, a load) has a puff of breath after the b."
