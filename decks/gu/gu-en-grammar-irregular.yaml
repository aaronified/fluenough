schema: 1
id: gu-en-grammar-irregular
name: "Irregular verbs"
kind: grammar
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The common verbs whose past breaks the pattern, with their future and polite request. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Irregular verbs"
  slot_name: "form"
  slots: ["past (it, or a neuter object)", "future, તે", "request, તમે"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "A regular verb makes its past with -યું on the stem: બોલવું, બોલ્યું; આવવું, આવ્યું. These, among the most used verbs, don't: જવું gives ગયું, લેવું લીધું, ખાવું ખાધું. Their future and request are regular. The past here is neuter; it agrees as usual: ગયો, ગઈ, ગયું."
  entries:
    - lemma: "જવું"
      key: javun
      reading: "javum̐"
      ipa: "dʒəʋũ"
      gloss: "to go"
      forms:
        "past (it, or a neuter object)": "ગયું"
        "future, તે": "જશે"
        "request, તમે": "જાઓ"
      readings:
        "past (it, or a neuter object)": "gayum̐"
        "future, તે": "jaśe"
        "request, તમે": "jāo"
      ipas:
        "past (it, or a neuter object)": "ɡəjũ"
        "future, તે": "dʒəʃe"
        "request, તમે": "dʒao"
    - lemma: "કરવું"
      key: karvun
      reading: "karvum̐"
      ipa: "kərʋũ"
      gloss: "to do"
      forms:
        "past (it, or a neuter object)": "કર્યું"
        "future, તે": "કરશે"
        "request, તમે": "કરો"
      readings:
        "past (it, or a neuter object)": "karyum̐"
        "future, તે": "karśe"
        "request, તમે": "karo"
      ipas:
        "past (it, or a neuter object)": "kərjũ"
        "future, તે": "kərʃe"
        "request, તમે": "kəro"
    - lemma: "લેવું"
      key: levun
      reading: "levum̐"
      ipa: "leʋũ"
      gloss: "to take"
      forms:
        "past (it, or a neuter object)": "લીધું"
        "future, તે": "લેશે"
        "request, તમે": "લો"
      readings:
        "past (it, or a neuter object)": "lidhum̐"
        "future, તે": "leśe"
        "request, તમે": "lo"
      ipas:
        "past (it, or a neuter object)": "lid̪ʱũ"
        "future, તે": "leʃe"
        "request, તમે": "lo"
    - lemma: "દેવું"
      key: devun
      reading: "devum̐"
      ipa: "d̪eʋũ"
      gloss: "to give"
      forms:
        "past (it, or a neuter object)": "દીધું"
        "future, તે": "દેશે"
        "request, તમે": "દો"
      readings:
        "past (it, or a neuter object)": "didhum̐"
        "future, તે": "deśe"
        "request, તમે": "do"
      ipas:
        "past (it, or a neuter object)": "d̪id̪ʱũ"
        "future, તે": "d̪eʃe"
        "request, તમે": "d̪o"
    - lemma: "ખાવું"
      key: khaavun
      reading: "khāvum̐"
      ipa: "kʰaʋũ"
      gloss: "to eat"
      forms:
        "past (it, or a neuter object)": "ખાધું"
        "future, તે": "ખાશે"
        "request, તમે": "ખાઓ"
      readings:
        "past (it, or a neuter object)": "khādhum̐"
        "future, તે": "khāśe"
        "request, તમે": "khāo"
      ipas:
        "past (it, or a neuter object)": "kʰad̪ʱũ"
        "future, તે": "kʰaʃe"
        "request, તમે": "kʰao"
    - lemma: "પીવું"
      key: piivun
      reading: "pivum̐"
      ipa: "piʋũ"
      gloss: "to drink"
      forms:
        "past (it, or a neuter object)": "પીધું"
        "future, તે": "પીશે"
        "request, તમે": ["પીઓ", "પીવો"]
      readings:
        "past (it, or a neuter object)": "pidhum̐"
        "future, તે": "piśe"
        "request, તમે": ["pio", "pivo"]
      ipas:
        "past (it, or a neuter object)": "pid̪ʱũ"
        "future, તે": "piʃe"
        "request, તમે": "pio"
    - lemma: "બેસવું"
      key: besvun
      reading: "besvum̐"
      ipa: "besʋũ"
      gloss: "to sit"
      forms:
        "past (it, or a neuter object)": "બેઠું"
        "future, તે": "બેસશે"
        "request, તમે": "બેસો"
      readings:
        "past (it, or a neuter object)": "beṭhum̐"
        "future, તે": "besśe"
        "request, તમે": "beso"
      ipas:
        "past (it, or a neuter object)": "beʈʰũ"
        "future, તે": "besʃe"
        "request, તમે": "beso"
    - lemma: "કહેવું"
      key: kahevun
      reading: "kahevum̐"
      ipa: "kəɦeʋũ"
      gloss: "to say; to tell"
      forms:
        "past (it, or a neuter object)": "કહ્યું"
        "future, તે": "કહેશે"
        "request, તમે": "કહો"
      readings:
        "past (it, or a neuter object)": "kahyum̐"
        "future, તે": "kaheśe"
        "request, તમે": "kaho"
      ipas:
        "past (it, or a neuter object)": "kəɦjũ"
        "future, તે": "kəɦeʃe"
        "request, તમે": "kəɦo"
    - lemma: "થવું"
      key: thavun
      reading: "thavum̐"
      ipa: "t̪ʰəʋũ"
      gloss: "to become; to happen"
      forms:
        "past (it, or a neuter object)": "થયું"
        "future, તે": "થશે"
        "request, તમે": "થાઓ"
      readings:
        "past (it, or a neuter object)": "thayum̐"
        "future, તે": "thaśe"
        "request, તમે": "thāo"
      ipas:
        "past (it, or a neuter object)": "t̪ʰəjũ"
        "future, તે": "t̪ʰəʃe"
        "request, તમે": "t̪ʰao"
    - lemma: "સૂવું"
      key: suuvun
      reading: "suvum̐"
      ipa: "suʋũ"
      gloss: "to sleep; to lie down"
      forms:
        "past (it, or a neuter object)": "સૂતું"
        "future, તે": "સૂશે"
        "request, તમે": "સૂઓ"
      readings:
        "past (it, or a neuter object)": "sutum̐"
        "future, તે": "suśe"
        "request, તમે": "suo"
      ipas:
        "past (it, or a neuter object)": "sut̪ũ"
        "future, તે": "suʃe"
        "request, તમે": "suo"
