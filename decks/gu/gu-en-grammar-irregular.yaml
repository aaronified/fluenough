schema: 1
id: gu-en-grammar-irregular
name: "Irregular verbs"
kind: grammar
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The common verbs whose past breaks the pattern, with their future and polite request. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Irregular verbs"
  slot_name: "form"
  slots: ["past (it, or a neuter object)", "future, તે (te)", "request, તમે (tame)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "A regular verb makes its past with -યું (-yum̐) on the stem: બોલવું (bolvum̐), બોલ્યું (bolyum̐); આવવું (āvvum̐), આવ્યું (āvyum̐). These, among the most used verbs, don't: જવું (javum̐) gives ગયું (gayum̐), લેવું લીધું (levum̐ lidhum̐), ખાવું ખાધું (khāvum̐ khādhum̐). Their future and request are regular. The past here is neuter; it agrees as usual: ગયો (gayo), ગઈ (gai), ગયું (gayum̐)."
  entries:
    - lemma: "જવું"
      key: javun
      reading: "javum̐"
      ipa: "dʒəʋũ"
      gloss: "to go"
      forms:
        "past (it, or a neuter object)": "ગયું"
        "future, તે (te)": "જશે"
        "request, તમે (tame)": "જાઓ"
      readings:
        "past (it, or a neuter object)": "gayum̐"
        "future, તે (te)": "jaśe"
        "request, તમે (tame)": "jāo"
      ipas:
        "past (it, or a neuter object)": "ɡəjũ"
        "future, તે (te)": "dʒəʃe"
        "request, તમે (tame)": "dʒao"
    - lemma: "કરવું"
      key: karvun
      reading: "karvum̐"
      ipa: "kərʋũ"
      gloss: "to do"
      forms:
        "past (it, or a neuter object)": "કર્યું"
        "future, તે (te)": "કરશે"
        "request, તમે (tame)": "કરો"
      readings:
        "past (it, or a neuter object)": "karyum̐"
        "future, તે (te)": "karśe"
        "request, તમે (tame)": "karo"
      ipas:
        "past (it, or a neuter object)": "kərjũ"
        "future, તે (te)": "kərʃe"
        "request, તમે (tame)": "kəro"
    - lemma: "લેવું"
      key: levun
      reading: "levum̐"
      ipa: "leʋũ"
      gloss: "to take"
      forms:
        "past (it, or a neuter object)": "લીધું"
        "future, તે (te)": "લેશે"
        "request, તમે (tame)": "લો"
      readings:
        "past (it, or a neuter object)": "lidhum̐"
        "future, તે (te)": "leśe"
        "request, તમે (tame)": "lo"
      ipas:
        "past (it, or a neuter object)": "lid̪ʱũ"
        "future, તે (te)": "leʃe"
        "request, તમે (tame)": "lo"
    - lemma: "દેવું"
      key: devun
      reading: "devum̐"
      ipa: "d̪eʋũ"
      gloss: "to give"
      forms:
        "past (it, or a neuter object)": "દીધું"
        "future, તે (te)": "દેશે"
        "request, તમે (tame)": "દો"
      readings:
        "past (it, or a neuter object)": "didhum̐"
        "future, તે (te)": "deśe"
        "request, તમે (tame)": "do"
      ipas:
        "past (it, or a neuter object)": "d̪id̪ʱũ"
        "future, તે (te)": "d̪eʃe"
        "request, તમે (tame)": "d̪o"
    - lemma: "ખાવું"
      key: khaavun
      reading: "khāvum̐"
      ipa: "kʰaʋũ"
      gloss: "to eat"
      forms:
        "past (it, or a neuter object)": "ખાધું"
        "future, તે (te)": "ખાશે"
        "request, તમે (tame)": "ખાઓ"
      readings:
        "past (it, or a neuter object)": "khādhum̐"
        "future, તે (te)": "khāśe"
        "request, તમે (tame)": "khāo"
      ipas:
        "past (it, or a neuter object)": "kʰad̪ʱũ"
        "future, તે (te)": "kʰaʃe"
        "request, તમે (tame)": "kʰao"
    - lemma: "પીવું"
      key: piivun
      reading: "pivum̐"
      ipa: "piʋũ"
      gloss: "to drink"
      forms:
        "past (it, or a neuter object)": "પીધું"
        "future, તે (te)": "પીશે"
        "request, તમે (tame)": ["પીઓ", "પીવો"]
      readings:
        "past (it, or a neuter object)": "pidhum̐"
        "future, તે (te)": "piśe"
        "request, તમે (tame)": ["pio", "pivo"]
      ipas:
        "past (it, or a neuter object)": "pid̪ʱũ"
        "future, તે (te)": "piʃe"
        "request, તમે (tame)": "pio"
    - lemma: "બેસવું"
      key: besvun
      reading: "besvum̐"
      ipa: "besʋũ"
      gloss: "to sit"
      forms:
        "past (it, or a neuter object)": "બેઠું"
        "future, તે (te)": "બેસશે"
        "request, તમે (tame)": "બેસો"
      readings:
        "past (it, or a neuter object)": "beṭhum̐"
        "future, તે (te)": "besśe"
        "request, તમે (tame)": "beso"
      ipas:
        "past (it, or a neuter object)": "beʈʰũ"
        "future, તે (te)": "besʃe"
        "request, તમે (tame)": "beso"
    - lemma: "કહેવું"
      key: kahevun
      reading: "kahevum̐"
      ipa: "kəɦeʋũ"
      gloss: "to say; to tell"
      forms:
        "past (it, or a neuter object)": "કહ્યું"
        "future, તે (te)": "કહેશે"
        "request, તમે (tame)": "કહો"
      readings:
        "past (it, or a neuter object)": "kahyum̐"
        "future, તે (te)": "kaheśe"
        "request, તમે (tame)": "kaho"
      ipas:
        "past (it, or a neuter object)": "kəɦjũ"
        "future, તે (te)": "kəɦeʃe"
        "request, તમે (tame)": "kəɦo"
    - lemma: "થવું"
      key: thavun
      reading: "thavum̐"
      ipa: "t̪ʰəʋũ"
      gloss: "to become; to happen"
      forms:
        "past (it, or a neuter object)": "થયું"
        "future, તે (te)": "થશે"
        "request, તમે (tame)": "થાઓ"
      readings:
        "past (it, or a neuter object)": "thayum̐"
        "future, તે (te)": "thaśe"
        "request, તમે (tame)": "thāo"
      ipas:
        "past (it, or a neuter object)": "t̪ʰəjũ"
        "future, તે (te)": "t̪ʰəʃe"
        "request, તમે (tame)": "t̪ʰao"
    - lemma: "સૂવું"
      key: suuvun
      reading: "suvum̐"
      ipa: "suʋũ"
      gloss: "to sleep; to lie down"
      forms:
        "past (it, or a neuter object)": "સૂતું"
        "future, તે (te)": "સૂશે"
        "request, તમે (tame)": "સૂઓ"
      readings:
        "past (it, or a neuter object)": "sutum̐"
        "future, તે (te)": "suśe"
        "request, તમે (tame)": "suo"
      ipas:
        "past (it, or a neuter object)": "sut̪ũ"
        "future, તે (te)": "suʃe"
        "request, તમે (tame)": "suo"
