schema: 1
id: gu-en-grammar-irregular
name: "Irregular verbs"
kind: grammar
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The common verbs whose past breaks the pattern, with their future and polite request. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Irregular verbs"
  slot_name: "form"
  slots: ["past (it, or a neuter object)", "future, તે", "request, તમે"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "A regular verb makes its past with -યું on the stem: બોલવું, બોલ્યું; આવવું, આવ્યું. These, among the most used verbs, don't: જવું gives ગયું, લેવું લીધું, ખાવું ખાધું. Their future and request are regular. The past here is neuter; it agrees as usual: ગયો, ગઈ, ગયું."
  entries:
    - lemma: "જવું"
      key: javun
      reading: "javun"
      gloss: "to go"
      forms:
        "past (it, or a neuter object)": "ગયું"
        "future, તે": "જશે"
        "request, તમે": "જાઓ"
      readings:
        "past (it, or a neuter object)": "gayun"
        "future, તે": "jashe"
        "request, તમે": "jao"
    - lemma: "કરવું"
      key: karvun
      reading: "karvun"
      gloss: "to do"
      forms:
        "past (it, or a neuter object)": "કર્યું"
        "future, તે": "કરશે"
        "request, તમે": "કરો"
      readings:
        "past (it, or a neuter object)": "karyun"
        "future, તે": "karshe"
        "request, તમે": "karo"
    - lemma: "લેવું"
      key: levun
      reading: "levun"
      gloss: "to take"
      forms:
        "past (it, or a neuter object)": "લીધું"
        "future, તે": "લેશે"
        "request, તમે": "લો"
      readings:
        "past (it, or a neuter object)": "lidhun"
        "future, તે": "leshe"
        "request, તમે": "lo"
    - lemma: "દેવું"
      key: devun
      reading: "devun"
      gloss: "to give"
      forms:
        "past (it, or a neuter object)": "દીધું"
        "future, તે": "દેશે"
        "request, તમે": "દો"
      readings:
        "past (it, or a neuter object)": "didhun"
        "future, તે": "deshe"
        "request, તમે": "do"
    - lemma: "ખાવું"
      key: khaavun
      reading: "khavun"
      gloss: "to eat"
      forms:
        "past (it, or a neuter object)": "ખાધું"
        "future, તે": "ખાશે"
        "request, તમે": "ખાઓ"
      readings:
        "past (it, or a neuter object)": "khadhun"
        "future, તે": "khashe"
        "request, તમે": "khao"
    - lemma: "પીવું"
      key: piivun
      reading: "pivun"
      gloss: "to drink"
      forms:
        "past (it, or a neuter object)": "પીધું"
        "future, તે": "પીશે"
        "request, તમે": ["પીઓ", "પીવો"]
      readings:
        "past (it, or a neuter object)": "pidhun"
        "future, તે": "pishe"
        "request, તમે": ["pio", "pivo"]
    - lemma: "બેસવું"
      key: besvun
      reading: "besvun"
      gloss: "to sit"
      forms:
        "past (it, or a neuter object)": "બેઠું"
        "future, તે": "બેસશે"
        "request, તમે": "બેસો"
      readings:
        "past (it, or a neuter object)": "bethun"
        "future, તે": "besshe"
        "request, તમે": "beso"
    - lemma: "કહેવું"
      key: kahevun
      reading: "kahevun"
      gloss: "to say; to tell"
      forms:
        "past (it, or a neuter object)": "કહ્યું"
        "future, તે": "કહેશે"
        "request, તમે": "કહો"
      readings:
        "past (it, or a neuter object)": "kahyun"
        "future, તે": "kaheshe"
        "request, તમે": "kaho"
    - lemma: "થવું"
      key: thavun
      reading: "thavun"
      gloss: "to become; to happen"
      forms:
        "past (it, or a neuter object)": "થયું"
        "future, તે": "થશે"
        "request, તમે": "થાઓ"
      readings:
        "past (it, or a neuter object)": "thayun"
        "future, તે": "thashe"
        "request, તમે": "thao"
    - lemma: "સૂવું"
      key: suuvun
      reading: "suvun"
      gloss: "to sleep; to lie down"
      forms:
        "past (it, or a neuter object)": "સૂતું"
        "future, તે": "સૂશે"
        "request, તમે": "સૂઓ"
      readings:
        "past (it, or a neuter object)": "sutun"
        "future, તે": "sushe"
        "request, તમે": "suo"
