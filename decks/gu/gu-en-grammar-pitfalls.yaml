id: gu-en-grammar-pitfalls
name: "Pitfalls"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The mistakes English speakers make most in Gujarati: one word for yesterday and tomorrow, why and how, the doer in the past, the two wes, and the gender of tea. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - ref: gu-0483
    notes: "One word, two days. The tense tells which: કાલે આવ્યો, came yesterday; કાલે આવીશ, will come tomorrow."
  - id: gu-0612
    target: "કેમ મોડું થયું?"
    native: "Why are you late?"
    reading: "kem moḍum̐ thayum̐?"
    ipa: "kem moɖũ t̪ʰəjũ"
    pos: "phrase"
    notes: "કેમ is 'why' here and 'how' in કેમ છો?. And મોડું (moḍum̐), late, is not મોટું (moṭum̐), big: ડ against ટ."
  - id: gu-0613
    target: "મેં ખાધું."
    native: "I ate."
    reading: "mem̐ khādhum̐."
    ipa: "mẽ kʰad̪ʱũ"
    pos: "phrase"
    notes: "Not હું ખાધું: in the past, a verb that can take an object wants the doer in -એ, so હું becomes મેં. With a verb like જવું it is હું: હું ગયો."
  - id: gu-0614
    target: "આપણે જઈએ."
    native: "Let's go."
    reading: "āpṇe jaie."
    ipa: "apɳe dʒəie"
    pos: "phrase"
    notes: "With આપણે the listener comes too. અમે જઈએ, 'we (not you) go', would leave them behind."
  - id: gu-0615
    target: "તે આવી."
    native: "She came."
    reading: "te āvi."
    ipa: "t̪e aʋi"
    pos: "phrase"
    notes: "તે is he or she. In the past only the verb tells: આવી, she; આવ્યો, he."
  - id: gu-0616
    target: "તેઓ ઘરે છે."
    native: "They are at home."
    reading: "teo ghare che."
    ipa: "t̪eo ɡʱəre tʃʰe"
    pos: "phrase"
    notes: "છે is both 'is' and 'are'. Only હું (છું), અમે (છીએ) and તમે (છો) have forms of their own."
  - id: gu-0617
    target: "કોણ આવ્યું?"
    native: "Who came?"
    reading: "koṇ āvyum̐?"
    ipa: "koɳ aʋjũ"
    pos: "phrase"
    notes: "Someone unknown takes the neuter: આવ્યું, not આવ્યો."
  - id: gu-0618
    target: "ચા ઠંડી થઈ ગઈ."
    native: "The tea has gone cold."
    reading: "cā ṭhaṇḍi thai gai."
    ipa: "tʃa ʈʰəɳɖi t̪ʰəi ɡəi"
    pos: "phrase"
    notes: "ચા is feminine, so ઠંડી and ગઈ. Learn every noun with its gender."
  - id: gu-0619
    target: "હું તમારી રાહ જોઈશ."
    native: "I'll wait for you."
    reading: "hum̐ tamāri rāh joiś."
    ipa: "ɦũ t̪əmari raɦ dʒoiʃ"
    pos: "phrase"
    notes: "Not 'I will see your road': રાહ જોવી is one idea, to wait. Such pairs can't be translated word by word."
