name: "Pitfalls"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The mistakes English speakers make most in Gujarati: one word for yesterday and tomorrow, why and how, the doer in the past, the two wes, and the gender of tea. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - ref: gu-0483
    notes: "One word, two days. The tense tells which: કાલે આવ્યો (kāle āvyo), came yesterday; કાલે આવીશ (kāle āviś), will come tomorrow."
  - id: gu-0612
    target: "કેમ મોડું થયું?"
    native: "Why are you late?"
    reading: "kem moḍum̐ thayum̐?"
    ipa: "kem moɖũ t̪ʰəjũ"
    pos: "phrase"
    notes: "કેમ (kem) is 'why' here and 'how' in કેમ છો (kem cho)?. And મોડું (moḍum̐), late, is not મોટું (moṭum̐), big: ડ (ḍa) against ટ (ṭa)."
  - id: gu-0613
    target: "મેં ખાધું."
    native: "I ate."
    reading: "mem̐ khādhum̐."
    ipa: "mẽ kʰad̪ʱũ"
    pos: "phrase"
    notes: "Not હું ખાધું (hum̐ khādhum̐): in the past, a verb that can take an object wants the doer in -એ (-e), so હું (hum̐) becomes મેં (mem̐). With a verb like જવું (javum̐) it is હું (hum̐): હું ગયો (hum̐ gayo)."
  - id: gu-0614
    target: "આપણે જઈએ."
    native: "Let's go."
    reading: "āpṇe jaie."
    ipa: "apɳe dʒəie"
    pos: "phrase"
    notes: "With આપણે (āpṇe) the listener comes too. અમે જઈએ (ame jaie), 'we (not you) go', would leave them behind."
  - id: gu-0615
    target: "તે આવી."
    native: "She came."
    reading: "te āvi."
    ipa: "t̪e aʋi"
    pos: "phrase"
    notes: "તે (te) is he or she. In the past only the verb tells: આવી (āvi), she; આવ્યો (āvyo), he."
  - id: gu-0616
    target: "તેઓ ઘરે છે."
    native: "They are at home."
    reading: "teo ghare che."
    ipa: "t̪eo ɡʱəre tʃʰe"
    pos: "phrase"
    notes: "છે (che) is both 'is' and 'are'. Only હું (hum̐) (છું (chum̐)), અમે (ame) (છીએ (chie)) and તમે (tame) (છો (cho)) have forms of their own."
  - id: gu-0617
    target: "કોણ આવ્યું?"
    native: "Who came?"
    reading: "koṇ āvyum̐?"
    ipa: "koɳ aʋjũ"
    pos: "phrase"
    notes: "Someone unknown takes the neuter: આવ્યું (āvyum̐), not આવ્યો (āvyo)."
  - id: gu-0618
    target: "ચા ઠંડી થઈ ગઈ."
    native: "The tea has gone cold."
    reading: "cā ṭhaṇḍi thai gai."
    ipa: "tʃa ʈʰəɳɖi t̪ʰəi ɡəi"
    pos: "phrase"
    notes: "ચા (cā) is feminine, so ઠંડી (ṭhaṇḍi) and ગઈ (gai). Learn every noun with its gender."
  - id: gu-0619
    target: "હું તમારી રાહ જોઈશ."
    native: "I'll wait for you."
    reading: "hum̐ tamāri rāh joiś."
    ipa: "ɦũ t̪əmari raɦ dʒoiʃ"
    pos: "phrase"
    notes: "Not 'I will see your road': રાહ જોવી (rāh jovi) is one idea, to wait. Such pairs can't be translated word by word."
