schema: 1
id: gu-en-grammar-negative
name: "Not: નથી, નહીં, ન"
kind: grammar
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I don't, I won't, don't!: the three words for 'not' and where each goes. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Negative"
  slot_name: "form"
  slots: ["I don't (a man)", "I don't (a woman)", "I won't", "don't! (to તમે)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "In the present, the stem takes -તો, -તી or -તું (like an adjective, for the doer's gender) and નથી follows: હું જતો નથી, I don't go. નથી can also come first: હું નથી જતો. In the future, નહીં comes before a short form of the verb: હું નહીં જાઉં. A request takes ન: ન જાઓ, don't go. In the past: મેં નથી ખાધું, I haven't eaten; હું ગયો નહીં, I didn't go."
  entries:
    - lemma: "કરવું"
      key: karvun
      gloss: "to do"
      forms:
        "I don't (a man)": "કરતો નથી"
        "I don't (a woman)": "કરતી નથી"
        "I won't": "નહીં કરું"
        "don't! (to તમે)": "ન કરો"
    - lemma: "જવું"
      key: javun
      gloss: "to go"
      forms:
        "I don't (a man)": "જતો નથી"
        "I don't (a woman)": "જતી નથી"
        "I won't": "નહીં જાઉં"
        "don't! (to તમે)": "ન જાઓ"
    - lemma: "આવવું"
      key: aavvun
      gloss: "to come"
      forms:
        "I don't (a man)": "આવતો નથી"
        "I don't (a woman)": "આવતી નથી"
        "I won't": "નહીં આવું"
        "don't! (to તમે)": "ન આવો"
    - lemma: "ખાવું"
      key: khaavun
      gloss: "to eat"
      forms:
        "I don't (a man)": "ખાતો નથી"
        "I don't (a woman)": "ખાતી નથી"
        "I won't": "નહીં ખાઉં"
        "don't! (to તમે)": "ન ખાઓ"
    - lemma: "બોલવું"
      key: bolvun
      gloss: "to speak"
      forms:
        "I don't (a man)": "બોલતો નથી"
        "I don't (a woman)": "બોલતી નથી"
        "I won't": "નહીં બોલું"
        "don't! (to તમે)": "ન બોલો"
