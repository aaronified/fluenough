schema: 1
id: gu-en-grammar-negative
name: "Not: નથી, નહીં, ન"
kind: grammar
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I don't, I won't, don't!: the three words for 'not' and where each goes. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Negative"
  slot_name: "form"
  slots: ["I don't (a man)", "I don't (a woman)", "I won't", "don't! (to તમે)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "In the present, the stem takes -તો, -તી or -તું (like an adjective, for the doer's gender) and નથી follows: હું જતો નથી, I don't go. નથી can also come first: હું નથી જતો. In the future, નહીં comes before a short form of the verb: હું નહીં જાઉં. A request takes ન: ન જાઓ, don't go. In the past: મેં નથી ખાધું, I haven't eaten; હું ગયો નહીં, I didn't go."
  entries:
    - lemma: "કરવું"
      key: karvun
      reading: "karvum̐"
      ipa: "kərʋũ"
      gloss: "to do"
      forms:
        "I don't (a man)": "કરતો નથી"
        "I don't (a woman)": "કરતી નથી"
        "I won't": "નહીં કરું"
        "don't! (to તમે)": "ન કરો"
      readings:
        "I don't (a man)": "karto nathi"
        "I don't (a woman)": "karti nathi"
        "I won't": "nahim̐ karum̐"
        "don't! (to તમે)": "na karo"
      ipas:
        "I don't (a man)": "kərt̪o nət̪ʰi"
        "I don't (a woman)": "kərt̪i nət̪ʰi"
        "I won't": "nəɦĩ kərũ"
        "don't! (to તમે)": "nə kəro"
    - lemma: "જવું"
      key: javun
      reading: "javum̐"
      ipa: "dʒəʋũ"
      gloss: "to go"
      forms:
        "I don't (a man)": "જતો નથી"
        "I don't (a woman)": "જતી નથી"
        "I won't": "નહીં જાઉં"
        "don't! (to તમે)": "ન જાઓ"
      readings:
        "I don't (a man)": "jato nathi"
        "I don't (a woman)": "jati nathi"
        "I won't": "nahim̐ jāum̐"
        "don't! (to તમે)": "na jāo"
      ipas:
        "I don't (a man)": "dʒət̪o nət̪ʰi"
        "I don't (a woman)": "dʒət̪i nət̪ʰi"
        "I won't": "nəɦĩ dʒaũ"
        "don't! (to તમે)": "nə dʒao"
    - lemma: "આવવું"
      key: aavvun
      reading: "āvvum̐"
      ipa: "aʋʋũ"
      gloss: "to come"
      forms:
        "I don't (a man)": "આવતો નથી"
        "I don't (a woman)": "આવતી નથી"
        "I won't": "નહીં આવું"
        "don't! (to તમે)": "ન આવો"
      readings:
        "I don't (a man)": "āvto nathi"
        "I don't (a woman)": "āvti nathi"
        "I won't": "nahim̐ āvum̐"
        "don't! (to તમે)": "na āvo"
      ipas:
        "I don't (a man)": "aʋt̪o nət̪ʰi"
        "I don't (a woman)": "aʋt̪i nət̪ʰi"
        "I won't": "nəɦĩ aʋũ"
        "don't! (to તમે)": "nə aʋo"
    - lemma: "ખાવું"
      key: khaavun
      reading: "khāvum̐"
      ipa: "kʰaʋũ"
      gloss: "to eat"
      forms:
        "I don't (a man)": "ખાતો નથી"
        "I don't (a woman)": "ખાતી નથી"
        "I won't": "નહીં ખાઉં"
        "don't! (to તમે)": "ન ખાઓ"
      readings:
        "I don't (a man)": "khāto nathi"
        "I don't (a woman)": "khāti nathi"
        "I won't": "nahim̐ khāum̐"
        "don't! (to તમે)": "na khāo"
      ipas:
        "I don't (a man)": "kʰat̪o nət̪ʰi"
        "I don't (a woman)": "kʰat̪i nət̪ʰi"
        "I won't": "nəɦĩ kʰaũ"
        "don't! (to તમે)": "nə kʰao"
    - lemma: "બોલવું"
      key: bolvun
      reading: "bolvum̐"
      ipa: "bolʋũ"
      gloss: "to speak"
      forms:
        "I don't (a man)": "બોલતો નથી"
        "I don't (a woman)": "બોલતી નથી"
        "I won't": "નહીં બોલું"
        "don't! (to તમે)": "ન બોલો"
      readings:
        "I don't (a man)": "bolto nathi"
        "I don't (a woman)": "bolti nathi"
        "I won't": "nahim̐ bolum̐"
        "don't! (to તમે)": "na bolo"
      ipas:
        "I don't (a man)": "bolt̪o nət̪ʰi"
        "I don't (a woman)": "bolt̪i nət̪ʰi"
        "I won't": "nəɦĩ bolũ"
        "don't! (to તમે)": "nə bolo"
