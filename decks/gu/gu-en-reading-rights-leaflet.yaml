          "text": "માલિક કારણ વગર ભાડું વધારી શકે નહીં.",
          "reading": "mālik kāraṇ vagar bhāḍum̐ vadhāri śake nahim̐.",
          "ipa": "malik karəɳ ʋəɡər bʱaɖũ ʋəd̪ʱari ʃəke nəɦĩ"
        },
        {
          "text": "ઘરમાં ચોરી થાય તો પોલીસને ફરિયાદ કરો.",
          "reading": "gharmām̐ cori thāy to polisne phariyād karo.",
          "ipa": "ɡʱərmã tʃori t̪ʰaj t̪o polisne pʰərijad̪ kəro"
        },
        {
          "text": "કોઈ પણ ફરિયાદ લેખિતમાં કરો.",
          "reading": "koi paṇ phariyād lekhitmām̐ karo.",
          "ipa": "koi pəɳ pʰərijad̪ lekʰit̪mã kəro"
        }
