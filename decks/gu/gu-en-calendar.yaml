schema: 1
id: gu-en-calendar
name: "Months and years"
kind: vocab
theme: calendar
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Months, seasons and years, the English calendar beside the Hindu one, and the festivals that mark the Gujarati year. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: gu-0521
    target: "મહિનો"
    native: "month"
    reading: "mahiino"
    pos: "noun"
    gender: "m"
  - id: gu-0522
    target: "વર્ષ"
    native: "year"
    reading: "varsh"
    pos: "noun"
    gender: "n"
    notes: "In speech also વરસ (varas)."
  - id: gu-0523
    target: "તારીખ"
    native: "date"
    reading: "taariikh"
    pos: "noun"
    gender: "f"
    notes: "આજે કઈ તારીખ છે? (aaje kaii taariikh chhe?), what's the date today?"
  - id: gu-0524
    target: "જાન્યુઆરી"
    native: "January"
    reading: "jaanyuaarii"
    pos: "noun"
    notes: "The English months are used for dates, offices and schools, said much as in English. Festivals follow the Hindu calendar."
  - id: gu-0525
    target: "કારતક"
    native: "Kartak, the first month of the Gujarati year (October to November)"
    reading: "kaartak"
    pos: "noun"
    notes: "The Gujarati year, in the Vikram Samvat calendar, starts in કારતક, the day after Diwali. The Hindu months move against the English ones from year to year."
  - id: gu-0526
    target: "અષાઢ"
    native: "Ashadh (about June to July), when the rains come"
    reading: "ashaadh"
    pos: "noun"
  - id: gu-0527
    target: "શ્રાવણ"
    native: "Shravan (about July to August)"
    reading: "shraavan"
    pos: "noun"
    notes: "A month of fasting and festivals, Raksha Bandhan and Janmashtami among them."
  - id: gu-0528
    target: "આસો"
    native: "Aso (about September to October), the last month of the year"
    reading: "aaso"
    pos: "noun"
    notes: "Navratri falls in its first nine nights, and Diwali on its last day."
  - id: gu-0529
    target: "ઉનાળો"
    native: "summer"
    reading: "unaalo"
    pos: "noun"
    gender: "m"
    notes: "Hot, from March to June: the season of mangoes."
  - id: gu-0530
    target: "ચોમાસું"
    native: "the rainy season; monsoon"
    reading: "chomaasun"
    pos: "noun"
    gender: "n"
    notes: "Literally 'four months', from about June to September."
  - id: gu-0531
    target: "શિયાળો"
    native: "winter"
    reading: "shiyaalo"
    pos: "noun"
    gender: "m"
  - id: gu-0532
    target: "દિવાળી"
    native: "Diwali"
    reading: "divaalii"
    pos: "noun"
    gender: "f"
    notes: "The festival of lamps, at the end of the Gujarati year."
  - id: gu-0533
    target: "બેસતું વર્ષ"
    native: "Gujarati New Year's Day"
    reading: "bestun varsh"
    pos: "phrase"
    notes: "The day after Diwali. People greet each other with સાલ મુબારક (saal mubaarak) and નૂતન વર્ષાભિનંદન (nuutan varshaabhinandan)."
  - id: gu-0534
    target: "નવરાત્રિ"
    native: "Navratri, the nine nights of dance"
    reading: "navraatri"
    alt_target: ["નવરાત્રી"]
    pos: "noun"
    gender: "f"
    notes: "Nine nights of ગરબા (garbaa) and રાસ (raas), danced in circles, in Aso."
  - id: gu-0535
    target: "ઉત્તરાયણ"
    native: "Uttarayan, the kite festival (14 January)"
    reading: "uttaraayan"
    pos: "noun"
    gender: "f"
    notes: "The day the sun turns north. All Gujarat flies kites from its roofs."
  - id: gu-0536
    target: "જન્મદિવસ"
    native: "birthday"
    reading: "janmadivas"
    pos: "noun"
    gender: "m"
    notes: "Also બર્થડે (barthde)."
  - id: gu-0537
    target: "ગયા વર્ષે"
    native: "last year"
    reading: "gayaa varshe"
    pos: "phrase"
    notes: "Literally 'in the gone year'."
  - id: gu-0538
    target: "આવતા મહિને"
    native: "next month"
    reading: "aavtaa mahine"
    pos: "phrase"
    notes: "Literally 'in the coming month'. Next year: આવતા વર્ષે."
