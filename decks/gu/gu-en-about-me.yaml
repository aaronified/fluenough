schema: 1
id: gu-en-about-me
name: "About me"
kind: vocab
theme: about-me
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Your name, where you are from, where you live, what you do, and the questions people will ask you first. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: gu-0319
    target: "નામ"
    native: "name"
    reading: "nam"
    pos: "noun"
    gender: "n"
  - id: gu-0320
    target: "હું લંડનથી આવ્યો છું."
    native: "I'm from London. (a man)"
    reading: "hun landanthi avyo chhun."
    pos: "phrase"
    notes: "Literally 'I have come from London'. A woman says આવી છું (avi chhun)."
  - id: gu-0321
    target: "હું અમદાવાદમાં રહું છું."
    native: "I live in Ahmedabad."
    reading: "hun amdavadman rahun chhun."
    pos: "phrase"
    notes: "રહેવું (rahevun) is to live, to stay."
  - id: gu-0322
    target: "હું શિક્ષક છું."
    native: "I am a teacher."
    reading: "hun shikshak chhun."
    pos: "phrase"
    notes: "A woman teacher is શિક્ષિકા (shikshika)."
  - id: gu-0323
    target: "મારી ઉંમર ત્રીસ વર્ષ છે."
    native: "I am thirty years old."
    reading: "mari ummar tris varsh chhe."
    pos: "phrase"
    notes: "Literally 'my age is thirty years'. Also હું ત્રીસ વર્ષનો છું (a man), વર્ષની છું (a woman)."
  - id: gu-0324
    target: "ઉંમર"
    native: "age"
    reading: "ummar"
    pos: "noun"
    gender: "f"
  - id: gu-0325
    target: "હું પરણેલો છું."
    native: "I'm married. (a man)"
    reading: "hun parnelo chhun."
    pos: "phrase"
    notes: "A woman says પરણેલી છું (parneli chhun)."
  - id: gu-0326
    target: "હું શાકાહારી છું."
    native: "I'm vegetarian."
    reading: "hun shakahari chhun."
    pos: "phrase"
    notes: "Much of Gujarat is vegetarian, and many people eat no eggs either. Some eat no onion or garlic."
  - id: gu-0327
    target: "હું અંગ્રેજી બોલું છું."
    native: "I speak English."
    reading: "hun angreji bolun chhun."
    pos: "phrase"
  - id: gu-0328
    target: "મને થોડું ગુજરાતી આવડે છે."
    native: "I know a little Gujarati."
    reading: "mane thodun gujarati avde chhe."
    pos: "phrase"
    notes: "Literally 'a little Gujarati comes to me'."
  - id: gu-0329
    target: "દેશ"
    native: "country"
    reading: "desh"
    pos: "noun"
    gender: "m"
  - id: gu-0330
    target: "હું અહીં ફરવા આવ્યો છું."
    native: "I'm here on holiday. (a man)"
    reading: "hun ahin pharva avyo chhun."
    pos: "phrase"
    notes: "ફરવું (pharvun) is to go around, to travel for pleasure. A woman says આવી છું."
