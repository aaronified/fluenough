  "sentences":
  - "text": "પ્રિય મિત્ર, તું કેમ છે?"
    "reading": "priya mitra, tum̐ kem che?"
    "ipa": "prijə mit̪rə t̪ũ kem tʃʰe"
  - "text": "આ અઠવાડિયે મને ઘણી ચિંતા રહી."
    "reading": "ā aṭhavāḍiye mane ghaṇi cintā rahi."
    "ipa": "a əʈʰəʋaɖije məne ɡʱəɳi tʃint̪a rəɦi"
  - "text": "પણ હવે મને થોડી હળવાશ લાગે છે."
    "reading": "paṇ have mane thoḍi haḷvāś lāge che."
    "ipa": "pəɳ ɦəʋe məne t̪ʰoɖi ɦəɭʋaʃ laɡe tʃʰe"
  - "text": "તારી ખુશી જોઈને મને ખૂબ આનંદ થાય છે."
    "reading": "tāri khuśi joine mane khub ānand thāy che."
    "ipa": "t̪ari kʰuʃi dʒoine məne kʰub anənd̪ t̪ʰaj tʃʰe"
