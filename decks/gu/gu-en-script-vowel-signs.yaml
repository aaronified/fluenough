schema: 1
id: gu-en-script-vowel-signs
name: "Gujarati vowel signs"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "After a consonant a vowel is written as a sign on it: after it, before it, above or below it. Here on ક and on મ, with the u signs on ર and the two moon signs of English words. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: gu-0063
    target: "કા"
    native: "kaa (k + the aa sign)"
    reading: "ka"
    notes: "The aa sign ા is a stroke written after the consonant: કાન (kan, ear). Compare ક on its own, which is 'ka' with the short a."
  - id: gu-0064
    target: "કિ"
    native: "ki (k + the short i sign)"
    reading: "ki"
    notes: "The short i sign િ is written BEFORE the consonant but said after it: you see િ then ક, and say 'ki'. કિલો (kilo, kilo)."
  - id: gu-0065
    target: "કી"
    native: "kii (k + the long i sign)"
    reading: "ki"
    modes: [recognition, production]
    notes: "The long i sign ી is written after the consonant: કીડી (kidi, ant). It sounds like કિ, so it is drilled by reading and writing only. At the end of a word Gujarati almost always writes the long sign."
  - id: gu-0066
    target: "કુ"
    native: "ku (k + the short u sign)"
    reading: "ku"
    notes: "The short u sign ુ hangs below the consonant: કુટુંબ (kutumb, family)."
  - id: gu-0067
    target: "કૂ"
    native: "kuu (k + the long u sign)"
    reading: "ku"
    modes: [recognition, production]
    notes: "The long u sign ૂ also hangs below, turned the other way: કૂતરો (kutro, dog). It sounds like કુ, so it is drilled by reading and writing only."
  - id: gu-0068
    target: "કૃ"
    native: "kru (k + the ru sign)"
    reading: "kru"
    modes: [recognition, production]
    notes: "The ru sign ૃ hangs below, in words from Sanskrit: કૃપા (krupa, kindness). A recogniser writes 'kru' as ક્રુ, so it is drilled by reading and writing only."
  - id: gu-0069
    target: "કે"
    native: "ke (k + the e sign)"
    reading: "ke"
    notes: "The e sign ે sits on top: કેળું (kelun, banana). કે on its own is 'or' and 'that'."
  - id: gu-0070
    target: "કૈ"
    native: "kai (k + the ai sign)"
    reading: "kai"
    notes: "The ai sign ૈ is two strokes on top: કૈલાસ (kailas, Mount Kailash)."
  - id: gu-0071
    target: "કો"
    native: "ko (k + the o sign)"
    reading: "ko"
    notes: "The o sign ો is the aa stroke with a mark on top: કોણ (kon, who)."
  - id: gu-0072
    target: "કૌ"
    native: "kau (k + the au sign)"
    reading: "kau"
    notes: "The au sign ૌ is the aa stroke with two marks on top. It is not common: ચૌદ (chaud, fourteen) has it on ચ."
  - id: gu-0073
    target: "કં"
    native: "kan (k + the dot: a nasal)"
    reading: "kan"
    modes: [recognition, production]
    notes: "The dot ં makes the vowel nasal, or before a consonant it is an n or m: કંપની (kampani, company). It is a mark rather than a vowel of its own, so it is drilled by reading and writing only."
  - id: gu-0074
    target: "કૉ"
    native: "ko, open (as in 'college')"
    reading: "ko"
    modes: [recognition, production]
    notes: "The o sign with a moon on top, for the open o of English words: કૉલેજ (kolej, college). Many writers leave the moon out, so it is drilled by reading and writing only."
  - id: gu-0075
    target: "કૅ"
    native: "ke, open (as in 'camera')"
    reading: "ke"
    modes: [recognition, production]
    notes: "The e sign with a moon, for the open a of English 'cat': કૅમેરા (kemera, camera). Many writers leave the moon out, so it is drilled by reading and writing only."
  - id: gu-0076
    target: "રુ"
    native: "ru (r + the short u sign)"
    reading: "ru"
    notes: "On ર the u sign is joined at the side, not hung below: ગુરુવાર (guruvar, Thursday)."
  - id: gu-0077
    target: "રૂ"
    native: "ruu (r + the long u sign)"
    reading: "ru"
    modes: [recognition, production]
    notes: "On ર the long u sign is joined at the side too: રૂપિયો (rupiyo, rupee). It sounds like રુ, so it is drilled by reading and writing only."
  - id: gu-0078
    target: "મા"
    native: "maa (m + the aa sign)"
    reading: "ma"
    notes: "મા is also a word: mother. માથું (mathun, head)."
  - id: gu-0079
    target: "મિ"
    native: "mi (m + the short i sign)"
    reading: "mi"
    notes: "The sign before the letter again: મિત્ર (mitra, friend)."
  - id: gu-0080
    target: "મી"
    native: "mii (m + the long i sign)"
    reading: "mi"
    modes: [recognition, production]
    notes: "મીઠું (mithun, salt; sweet). It sounds like મિ, so it is drilled by reading and writing only."
  - id: gu-0081
    target: "મુ"
    native: "mu (m + the short u sign)"
    reading: "mu"
    notes: "મુંબઈ (mumbai, Mumbai)."
  - id: gu-0082
    target: "મે"
    native: "me (m + the e sign)"
    reading: "me"
    notes: "મેળો (melo, a fair)."
  - id: gu-0083
    target: "મો"
    native: "mo (m + the o sign)"
    reading: "mo"
    notes: "મોટું (motun, big)."
