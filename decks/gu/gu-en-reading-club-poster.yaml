  "sentences":
  - "text": "આપણી ક્લબમાં રમતગમત અને સંગીત છે."
    "reading": "āpaṇi klabmām̐ ramatagamat ane saṅgit che."
    "ipa": "apəɳi kləbmã rəmət̪əɡəmət̪ əne səŋɡit̪ tʃʰe"
  - "text": "દર શનિવારે સાંજે અમે મળીએ છીએ."
    "reading": "dar śanivāre sāñje ame maḷie chie."
    "ipa": "d̪ər ʃəniʋare saɲdʒe əme məɭie tʃʰie"
  - "text": "ક્રિકેટ, ફૂટબોલ અને તરવું શીખવા આવો!"
    "reading": "krikeṭ, phuṭbol ane tarvum śikhavā āvo!"
    "ipa": "krikeʈ pʰuʈbol əne t̪ərʋum ʃikʰəʋa aʋo"
  - "text": "નવા સભ્યો માટે પ્રવેશ મફત છે."
    "reading": "navā sabhyo māṭe praveś mafat che."
    "ipa": "nəʋa səbʱjo maʈe prəʋeʃ məfət̪ tʃʰe"
