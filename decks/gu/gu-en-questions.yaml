schema: 1
id: gu-en-questions
name: "Yes, no and questions"
kind: vocab
theme: questions
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Yes and no, and the question words: what, who, where, when, why, how and how much. Most start with k-. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: gu-0283
    target: "હા"
    native: "yes"
    reading: "ha"
    pos: "other"
    notes: "Often just a nod, or a sideways tilt of the head, which also means yes."
  - id: gu-0284
    target: "ના"
    native: "no"
    reading: "na"
    pos: "other"
    notes: "ના પાડવી (na padvi) is 'to say no; to refuse'. નહીં (nahin), 'not', is a firmer no."
  - id: gu-0285
    target: "શું"
    native: "what"
    reading: "shun"
    pos: "other"
    notes: "At the start of a sentence it also turns it into a yes-or-no question: શું તમે આવશો? Will you come?"
  - id: gu-0286
    target: "કોણ"
    native: "who"
    reading: "kon"
    pos: "other"
    notes: "With the curled-back ણ. કોણ છે? Who is it?"
  - id: gu-0287
    target: "ક્યાં"
    native: "where"
    reading: "kyan"
    pos: "other"
    notes: "The long a is nasal. ક્યાંથી (kyanthi), from where."
  - id: gu-0288
    target: "ક્યારે"
    native: "when"
    reading: "kyare"
    pos: "other"
  - id: gu-0289
    target: "કેમ"
    native: "why; how"
    reading: "kem"
    pos: "other"
    notes: "Both 'why' and 'how': કેમ છો? (kem chho?), how are you?; કેમ મોડું થયું? (kem modun thayun?), why are you late?"
  - id: gu-0290
    target: "કેવી રીતે"
    native: "how; in what way"
    reading: "kevi rite"
    pos: "phrase"
    notes: "Literally 'in what way'. આ કેવી રીતે બને? How is this made?"
  - id: gu-0291
    target: "કેટલું"
    native: "how much"
    reading: "ketlun"
    pos: "other"
    notes: "It agrees with what is counted: કેટલા રૂપિયા? (ketla rupiya?), how many rupees?; કેટલી વાર? (ketli var?), how many times?"
  - id: gu-0292
    target: "કયું"
    native: "which"
    reading: "kayun"
    pos: "other"
    notes: "It agrees with its noun: કયો રસ્તો? which road? (m); કઈ બસ? (kai bas?) which bus? (f); કયું ઘર? which house? (n)."
  - id: gu-0293
    target: "કોનું"
    native: "whose"
    reading: "konun"
    pos: "other"
    notes: "Agrees like 'my': કોનો ભાઈ? whose brother?; કોની ગાડી? whose car?"
  - id: gu-0294
    target: "ખરેખર?"
    native: "really?"
    reading: "kharekhar?"
    pos: "other"
    notes: "Also ખરું? (kharun?), true? right?"
  - id: gu-0295
    target: "મને ખબર નથી."
    native: "I don't know."
    reading: "mane khabar nathi."
    pos: "phrase"
    notes: "Literally 'to me there is no news'."
