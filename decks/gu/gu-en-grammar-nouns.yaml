schema: 1
id: gu-en-grammar-nouns
name: "Nouns: plural and before an ending"
kind: grammar
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "How a noun changes for the plural, and before an ending such as -માં, -ને or -નું. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Noun forms"
  slot_name: "form"
  slots: ["plural", "before an ending (-માં, -ને, -નું)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "A masculine noun in -ઓ ends in -આ in the plural and before an ending: છોકરો, છોકરા, છોકરાને. A neuter noun in -ઉં ends in -આં in the plural and -આ before an ending: કેળું, કેળાં, કેળાનું. Other nouns add -ઓ for the plural and don't change before an ending. Many speakers add -ઓ to a plural that already shows it: છોકરાઓ."
  entries:
    - lemma: "છોકરો"
      key: chhokro
      reading: "chhokro"
      gloss: "boy, m"
      forms:
        "plural": ["છોકરા", "છોકરાઓ"]
        "before an ending (-માં, -ને, -નું)": "છોકરા"
      readings:
        "plural": ["chhokra", "chhokrao"]
        "before an ending (-માં, -ને, -નું)": "chhokra"
    - lemma: "રસ્તો"
      key: rasto
      reading: "rasto"
      gloss: "road, m"
      forms:
        "plural": ["રસ્તા", "રસ્તાઓ"]
        "before an ending (-માં, -ને, -નું)": "રસ્તા"
      readings:
        "plural": ["rasta", "rastao"]
        "before an ending (-માં, -ને, -નું)": "rasta"
    - lemma: "કેળું"
      key: kelun
      reading: "kelun"
      gloss: "banana, n"
      forms:
        "plural": "કેળાં"
        "before an ending (-માં, -ને, -નું)": "કેળા"
      readings:
        "plural": "kelan"
        "before an ending (-માં, -ને, -નું)": "kela"
    - lemma: "રસોડું"
      key: rasodun
      reading: "rasodun"
      gloss: "kitchen, n"
      forms:
        "plural": "રસોડાં"
        "before an ending (-માં, -ને, -નું)": "રસોડા"
      readings:
        "plural": "rasodan"
        "before an ending (-માં, -ને, -નું)": "rasoda"
    - lemma: "ઘર"
      key: ghar
      reading: "ghar"
      gloss: "house, n"
      forms:
        "plural": ["ઘરો", "ઘર"]
        "before an ending (-માં, -ને, -નું)": "ઘર"
      readings:
        "plural": ["gharo", "ghar"]
        "before an ending (-માં, -ને, -નું)": "ghar"
    - lemma: "માણસ"
      key: maanas
      reading: "manas"
      gloss: "person, m"
      forms:
        "plural": "માણસો"
        "before an ending (-માં, -ને, -નું)": "માણસ"
      readings:
        "plural": "manso"
        "before an ending (-માં, -ને, -નું)": "manas"
    - lemma: "ભાઈ"
      key: bhaaii
      reading: "bhai"
      gloss: "brother, m"
      forms:
        "plural": ["ભાઈઓ", "ભાઈ"]
        "before an ending (-માં, -ને, -નું)": "ભાઈ"
      readings:
        "plural": ["bhaio", "bhai"]
        "before an ending (-માં, -ને, -નું)": "bhai"
    - lemma: "છોકરી"
      key: chhokrii
      reading: "chhokri"
      gloss: "girl, f"
      forms:
        "plural": "છોકરીઓ"
        "before an ending (-માં, -ને, -નું)": "છોકરી"
      readings:
        "plural": "chhokrio"
        "before an ending (-માં, -ને, -નું)": "chhokri"
    - lemma: "વાત"
      key: vaat
      reading: "vat"
      gloss: "talk; a matter, f"
      forms:
        "plural": "વાતો"
        "before an ending (-માં, -ને, -નું)": "વાત"
      readings:
        "plural": "vato"
        "before an ending (-માં, -ને, -નું)": "vat"
    - lemma: "બારી"
      key: baarii
      reading: "bari"
      gloss: "window, f"
      forms:
        "plural": "બારીઓ"
        "before an ending (-માં, -ને, -નું)": "બારી"
      readings:
        "plural": "bario"
        "before an ending (-માં, -ને, -નું)": "bari"
