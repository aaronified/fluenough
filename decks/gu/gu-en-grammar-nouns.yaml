schema: 1
id: gu-en-grammar-nouns
name: "Nouns: plural and before an ending"
kind: grammar
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "How a noun changes for the plural, and before an ending such as -માં, -ને or -નું. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Noun forms"
  slot_name: "form"
  slots: ["plural", "before an ending (-માં, -ને, -નું)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "A masculine noun in -ઓ ends in -આ in the plural and before an ending: છોકરો, છોકરા, છોકરાને. A neuter noun in -ઉં ends in -આં in the plural and -આ before an ending: કેળું, કેળાં, કેળાનું. Other nouns add -ઓ for the plural and don't change before an ending. Many speakers add -ઓ to a plural that already shows it: છોકરાઓ."
  entries:
    - lemma: "છોકરો"
      key: chhokro
      reading: "chokro"
      ipa: "tʃʰokro"
      gloss: "boy, m"
      forms:
        "plural": ["છોકરા", "છોકરાઓ"]
        "before an ending (-માં, -ને, -નું)": "છોકરા"
      readings:
        "plural": ["chokrā", "chokrāo"]
        "before an ending (-માં, -ને, -નું)": "chokrā"
      ipas:
        "plural": "tʃʰokra"
        "before an ending (-માં, -ને, -નું)": "tʃʰokra"
    - lemma: "રસ્તો"
      key: rasto
      reading: "rasto"
      ipa: "rəst̪o"
      gloss: "road, m"
      forms:
        "plural": ["રસ્તા", "રસ્તાઓ"]
        "before an ending (-માં, -ને, -નું)": "રસ્તા"
      readings:
        "plural": ["rastā", "rastāo"]
        "before an ending (-માં, -ને, -નું)": "rastā"
      ipas:
        "plural": "rəst̪a"
        "before an ending (-માં, -ને, -નું)": "rəst̪a"
    - lemma: "કેળું"
      key: kelun
      reading: "keḷum̐"
      ipa: "keɭũ"
      gloss: "banana, n"
      forms:
        "plural": "કેળાં"
        "before an ending (-માં, -ને, -નું)": "કેળા"
      readings:
        "plural": "keḷām̐"
        "before an ending (-માં, -ને, -નું)": "keḷā"
      ipas:
        "plural": "keɭã"
        "before an ending (-માં, -ને, -નું)": "keɭa"
    - lemma: "રસોડું"
      key: rasodun
      reading: "rasoḍum̐"
      ipa: "rəsoɖũ"
      gloss: "kitchen, n"
      forms:
        "plural": "રસોડાં"
        "before an ending (-માં, -ને, -નું)": "રસોડા"
      readings:
