schema: 1
id: gu-en-grammar-nouns
name: "Nouns: plural and before an ending"
kind: grammar
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "How a noun changes for the plural, and before an ending such as -માં (-mām̐), -ને (-ne) or -નું (-num̐). Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Noun forms"
  slot_name: "form"
  slots: ["plural", "before an ending (-માં (-mām̐), -ને (-ne), -નું (-num̐))"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "A masculine noun in -ઓ (-o) ends in -આ (-ā) in the plural and before an ending: છોકરો (chokro), છોકરા (chokrā), છોકરાને (chokrāne). A neuter noun in -ઉં (-um̐) ends in -આં (-ām̐) in the plural and -આ (-ā) before an ending: કેળું (keḷum̐), કેળાં (keḷām̐), કેળાનું (keḷānum̐). Other nouns add -ઓ (-o) for the plural and don't change before an ending. Many speakers add -ઓ (-o) to a plural that already shows it: છોકરાઓ (chokrāo)."
  entries:
    - lemma: "છોકરો"
      key: chhokro
      reading: "chokro"
      ipa: "tʃʰokro"
      gloss: "boy, m"
      forms:
        "plural": ["છોકરા", "છોકરાઓ"]
        "before an ending (-માં (-mām̐), -ને (-ne), -નું (-num̐))": "છોકરા"
      readings:
        "plural": ["chokrā", "chokrāo"]
        "before an ending (-માં (-mām̐), -ને (-ne), -નું (-num̐))": "chokrā"
      ipas:
        "plural": "tʃʰokra"
        "before an ending (-માં (-mām̐), -ને (-ne), -નું (-num̐))": "tʃʰokra"
    - lemma: "રસ્તો"
      key: rasto
      reading: "rasto"
      ipa: "rəst̪o"
      gloss: "road, m"
      forms:
        "plural": ["રસ્તા", "રસ્તાઓ"]
        "before an ending (-માં (-mām̐), -ને (-ne), -નું (-num̐))": "રસ્તા"
      readings:
        "plural": ["rastā", "rastāo"]
        "before an ending (-માં (-mām̐), -ને (-ne), -નું (-num̐))": "rastā"
      ipas:
        "plural": "rəst̪a"
        "before an ending (-માં (-mām̐), -ને (-ne), -નું (-num̐))": "rəst̪a"
    - lemma: "કેળું"
      key: kelun
      reading: "keḷum̐"
      ipa: "keɭũ"
      gloss: "banana, n"
      forms:
        "plural": "કેળાં"
        "before an ending (-માં (-mām̐), -ને (-ne), -નું (-num̐))": "કેળા"
      readings:
        "plural": "keḷām̐"
        "before an ending (-માં (-mām̐), -ને (-ne), -નું (-num̐))": "keḷā"
      ipas:
        "plural": "keɭã"
        "before an ending (-માં (-mām̐), -ને (-ne), -નું (-num̐))": "keɭa"
    - lemma: "રસોડું"
      key: rasodun
