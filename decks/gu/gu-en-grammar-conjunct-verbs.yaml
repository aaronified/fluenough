schema: 1
id: gu-en-grammar-conjunct-verbs
name: "Verbs made with do, come and strike"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Many Gujarati verbs are a noun and કરવું (do), આવવું (come) or લાગવું (strike): help-do, memory-come, hunger-strike. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: gu-0539
    target: "મદદ કરવી"
    native: "to help"
    reading: "madad karvi"
    ipa: "məd̪əd̪ kərʋi"
    pos: "phrase"
    notes: "Literally 'to do help'. The -વું of the verb agrees with the noun: મદદ is feminine, so કરવી. મને મદદ કરો (mane madad karo), help me."
  - id: gu-0540
    target: "વાત કરવી"
    native: "to talk; to chat"
    reading: "vāt karvi"
    ipa: "ʋat̪ kərʋi"
    pos: "phrase"
    notes: "વાત (talk) is feminine, so કરવી. મારે તમારી સાથે વાત કરવી છે, I want to talk to you."
  - id: gu-0541
    target: "કામ કરવું"
    native: "to work"
    reading: "kām karvum̐"
    ipa: "kam kərʋũ"
    pos: "phrase"
    notes: "કામ is neuter, so the plain કરવું."
  - id: gu-0542
    target: "ફોન કરવો"
    native: "to phone"
    reading: "fon karvo"
    ipa: "fon kərʋo"
    pos: "phrase"
    notes: "ફોન is masculine, so કરવો. મને ફોન કરજો (mane fon karjo), give me a call."
  - id: gu-0543
    target: "આરામ કરવો"
    native: "to rest"
    reading: "ārām karvo"
    ipa: "aram kərʋo"
    pos: "phrase"
    notes: "આરામ is masculine. આરામ કરો, take a rest."
  - id: gu-0544
    target: "ખરીદી કરવી"
    native: "to go shopping"
    reading: "kharidi karvi"
    ipa: "kʰərid̪i kərʋi"
    pos: "phrase"
  - id: gu-0545
    target: "શરૂ કરવું"
    native: "to start"
    reading: "śaru karvum̐"
    ipa: "ʃəru kərʋũ"
    pos: "phrase"
    notes: "With થવું (thavum̐), 'to become', it is 'to begin' on its own: ફિલ્મ શરૂ થઈ, the film began."
  - id: gu-0546
    target: "બંધ કરવું"
    native: "to close; to switch off"
    reading: "bandh karvum̐"
    ipa: "bənd̪ʱ kərʋũ"
    pos: "phrase"
    notes: "પંખો બંધ કરો, switch off the fan. દુકાન બંધ છે, the shop is closed."
  - id: gu-0547
    target: "ચાલુ કરવું"
    native: "to switch on; to start up"
    reading: "cālu karvum̐"
    ipa: "tʃalu kərʋũ"
    pos: "phrase"
  - id: gu-0548
    target: "રાહ જોવી"
    native: "to wait"
    reading: "rāh jovi"
    ipa: "raɦ dʒoʋi"
    pos: "phrase"
    notes: "Literally 'to watch the road'. હું તમારી રાહ જોઉં છું, I'm waiting for you."
  - id: gu-0549
    target: "યાદ આવવું"
    native: "to remember; to come to mind"
    reading: "yād āvvum̐"
    ipa: "jad̪ aʋʋũ"
    pos: "phrase"
    notes: "The one who remembers takes -ને: મને યાદ આવ્યું (mane yād āvyum̐), I remembered; literally 'to me memory came'."
  - id: gu-0550
    target: "મને ભૂખ લાગી છે."
    native: "I'm hungry."
    reading: "mane bhukh lāgi che."
    ipa: "məne bʱukʰ laɡi tʃʰe"
    pos: "phrase"
    notes: "Literally 'hunger has struck me'. ભૂખ is feminine, so લાગી."
  - id: gu-0551
    target: "મને તરસ લાગી છે."
    native: "I'm thirsty."
    reading: "mane taras lāgi che."
    ipa: "məne t̪ərəs laɡi tʃʰe"
    pos: "phrase"
  - id: gu-0552
    target: "મને ઠંડી લાગે છે."
    native: "I feel cold."
    reading: "mane ṭhaṇḍi lāge che."
    ipa: "məne ʈʰəɳɖi laɡe tʃʰe"
    pos: "phrase"
    notes: "Also ગરમી લાગે છે (garmi lāge che), I feel hot."
