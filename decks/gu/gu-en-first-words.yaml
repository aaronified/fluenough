id: gu-en-first-words
name: "First words"
kind: vocab
theme: first-words
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Greetings, the respect Gujarati builds into them, and how to say you are still learning. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: gu-0260
    target: "નમસ્તે"
    native: "hello; goodbye"
    reading: "namaste"
    ipa: "nəməst̪e"
    alt_target: ["નમસ્કાર"]
    pos: "other"
    tags: ["greeting"]
    notes: "Said with palms pressed together, to anyone. નમસ્કાર (namaskār) is the same, a little more formal. In a family, younger people often greet elders by touching their feet; a visitor is not expected to."
  - id: gu-0261
    target: "કેમ છો?"
    native: "How are you?"
    reading: "kem cho?"
    ipa: "kem tʃʰo"
    pos: "phrase"
    tags: ["greeting"]
    notes: "The everyday greeting, often instead of hello. કેમ (kem) is 'how', and છો (cho) goes with તમે (tame). To a friend: કેમ છે? (kem chhe?)."
  - id: gu-0262
    target: "મજામાં"
    native: "fine; well"
    reading: "majāmām̐"
    ipa: "mədʒamã"
    pos: "other"
    tags: ["greeting"]
    notes: "The usual answer to કેમ છો (kem cho)?: literally 'in fun'. In full, મજામાં છું (majāmām̐ chum̐), I'm fine."
  - ref: gu-0251
    tags: ["honorific"]
    notes: "Gujarati has two everyday words for 'you': તમે (tame) for strangers, elders and anyone you respect, and તું (tum̐) for friends, children and the very close. The verb changes with each. A learner is always safe with તમે (tame)."
  - id: gu-0263
    target: "આભાર"
    native: "thank you"
    reading: "ābhār"
    ipa: "abʱar"
    pos: "other"
    tags: ["polite"]
    notes: "Many people simply say 'thank you' in English, and among family thanks are often left out. ધન્યવાદ (dhanyavād) is more formal."
  - id: gu-0264
    target: "આવજો"
    native: "goodbye"
    reading: "āvjo"
    ipa: "aʋdʒo"
    pos: "other"
    tags: ["greeting"]
    notes: "Literally 'do come (again)', a polite request. Said by both the one leaving and the one staying."
  - id: gu-0265
    target: "જય શ્રી કૃષ્ણ"
    native: "hello; goodbye (literally, 'glory to Lord Krishna')"
    reading: "jay śri kruśṇa"
    ipa: "dʒəj ʃri kruʃɳə"
    pos: "phrase"
    tags: ["greeting"]
    notes: "A common greeting among many Gujarati Hindus, especially followers of Krishna. Answer it with the same words. Others greet with જય જિનેન્દ્ર (jay jinendra, among Jains) or સલામ (salām)."
  - id: gu-0266
    target: "આવો"
    native: "come in; welcome"
    reading: "āvo"
    ipa: "aʋo"
    pos: "other"
    tags: ["polite"]
    notes: "Said at the door to a guest, often twice: આવો (āvo), આવો (āvo)! It is the polite form of 'come'. Even more polite: પધારો (padhāro)."
  - id: gu-0267
    target: "માફ કરજો"
    native: "sorry; excuse me"
    reading: "māf karjo"
    ipa: "maf kərdʒo"
    pos: "phrase"
    tags: ["polite"]
    notes: "Literally 'please forgive'. The ending -જો (-jo) makes a polite request: બેસજો (besjo), please sit."
  - id: gu-0268
    target: "ઠીક છે"
    native: "OK; all right"
    reading: "ṭhik che"
    ipa: "ʈʰik tʃʰe"
    pos: "phrase"
    notes: "Literally 'it is fine'. Also ભલે (bhale) and સારું (sārum̐), 'good'."
  - id: gu-0269
    target: "મને ગુજરાતી નથી આવડતું."
    native: "I don't know Gujarati."
    reading: "mane gujarāti nathi āvaḍtum̐."
    ipa: "məne ɡudʒərat̪i nət̪ʰi aʋəɖt̪ũ"
    pos: "phrase"
    notes: "Literally 'Gujarati doesn't come to me'. આવડવું (āvaḍvum̐) is knowing how to do something."
  - id: gu-0270
    target: "હું હજી ગુજરાતી શીખું છું."
    native: "I'm still learning Gujarati."
    reading: "hum̐ haji gujarāti śikhum̐ chum̐."
    ipa: "ɦũ ɦədʒi ɡudʒərat̪i ʃikʰũ tʃʰũ"
    pos: "phrase"
    notes: "હજી (haji) is 'still; yet'. The present 'I learn' also does for 'I am learning'."
  - id: gu-0271
    target: "જરા ધીમે બોલશો?"
    native: "Could you speak a little slower?"
    reading: "jarā dhime bolśo?"
    ipa: "dʒəra d̪ʱime bolʃo"
    pos: "phrase"
    tags: ["polite"]
    notes: "A request put as a question in the future is polite: 'will you speak a little slowly?'. જરા (jarā) is 'a little'."
  - id: gu-0272
    target: "ફરીથી કહેશો?"
    native: "Could you say that again?"
    reading: "pharithi kaheśo?"
    ipa: "pʰərit̪ʰi kəɦeʃo"
    pos: "phrase"
    tags: ["polite"]
    notes: "ફરીથી (pharithi) is 'again'."
