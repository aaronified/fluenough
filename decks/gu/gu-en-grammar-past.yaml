schema: 1
id: gu-en-grammar-past
name: "Past tense"
kind: grammar
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I came, she went: the simple past of verbs without an object, which agrees with the doer's gender and number. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Simple past, verbs without an object"
  slot_name: "person and gender"
  slots: ["હું (m)", "હું (f)", "તે (m)", "તે (f)", "તે (it)", "અમે (m)", "અમે (mixed)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "With a verb that takes no object, the past agrees with the doer like an adjective: -યો (m), -ઈ (f), -યું (n), -યા (men), -યાં (a mixed group, or a woman spoken of with respect). It shows no person: હું ગયો, તે ગયો. જવું and બેસવું are irregular: ગયો, બેઠો. Add છું or છે for 'have': હું આવ્યો છું, I have come. With an object the rule is different: see the next deck."
  entries:
    - lemma: "જવું"
      key: javun
      reading: "javum̐"
      ipa: "dʒəʋũ"
      gloss: "to go"
      forms:
        "હું (m)": "ગયો"
        "હું (f)": "ગઈ"
        "તે (m)": "ગયો"
        "તે (f)": "ગઈ"
        "તે (it)": "ગયું"
        "અમે (m)": "ગયા"
        "અમે (mixed)": "ગયાં"
      readings:
        "હું (m)": "gayo"
        "હું (f)": "gai"
        "તે (m)": "gayo"
        "તે (f)": "gai"
        "તે (it)": "gayum̐"
        "અમે (m)": "gayā"
        "અમે (mixed)": "gayām̐"
      ipas:
        "હું (m)": "ɡəjo"
        "હું (f)": "ɡəi"
        "તે (m)": "ɡəjo"
        "તે (f)": "ɡəi"
        "તે (it)": "ɡəjũ"
        "અમે (m)": "ɡəja"
        "અમે (mixed)": "ɡəjã"
    - lemma: "આવવું"
      key: aavvun
      reading: "āvvum̐"
      ipa: "aʋʋũ"
      gloss: "to come"
      forms:
        "હું (m)": "આવ્યો"
        "હું (f)": "આવી"
        "તે (m)": "આવ્યો"
        "તે (f)": "આવી"
        "તે (it)": "આવ્યું"
        "અમે (m)": "આવ્યા"
        "અમે (mixed)": "આવ્યાં"
      readings:
        "હું (m)": "āvyo"
        "હું (f)": "āvi"
        "તે (m)": "āvyo"
        "તે (f)": "āvi"
        "તે (it)": "āvyum̐"
        "અમે (m)": "āvyā"
        "અમે (mixed)": "āvyām̐"
      ipas:
