        "હું (f)": "ઊઠી"
        "તે (m)": "ઊઠ્યો"
        "તે (f)": "ઊઠી"
        "તે (it)": "ઊઠ્યું"
        "અમે (m)": "ઊઠ્યા"
        "અમે (mixed)": "ઊઠ્યાં"
