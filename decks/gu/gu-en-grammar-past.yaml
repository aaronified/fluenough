schema: 1
id: gu-en-grammar-past
name: "Past tense"
kind: grammar
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I came, she went: the simple past of verbs without an object, which agrees with the doer's gender and number. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Simple past, verbs without an object"
  slot_name: "person and gender"
  slots: ["હું (m)", "હું (f)", "તે (m)", "તે (f)", "તે (it)", "અમે (m)", "અમે (mixed)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "With a verb that takes no object, the past agrees with the doer like an adjective: -યો (m), -ઈ (f), -યું (n), -યા (men), -યાં (a mixed group, or a woman spoken of with respect). It shows no person: હું ગયો, તે ગયો. જવું and બેસવું are irregular: ગયો, બેઠો. Add છું or છે for 'have': હું આવ્યો છું, I have come. With an object the rule is different: see the next deck."
  entries:
    - lemma: "જવું"
      key: javun
      reading: "javun"
      gloss: "to go"
      forms:
        "હું (m)": "ગયો"
        "હું (f)": "ગઈ"
        "તે (m)": "ગયો"
        "તે (f)": "ગઈ"
        "તે (it)": "ગયું"
        "અમે (m)": "ગયા"
        "અમે (mixed)": "ગયાં"
      readings:
        "હું (m)": "gayo"
        "હું (f)": "gai"
        "તે (m)": "gayo"
        "તે (f)": "gai"
        "તે (it)": "gayun"
        "અમે (m)": "gaya"
        "અમે (mixed)": "gayan"
    - lemma: "આવવું"
      key: aavvun
      reading: "avvun"
      gloss: "to come"
      forms:
        "હું (m)": "આવ્યો"
        "હું (f)": "આવી"
        "તે (m)": "આવ્યો"
        "તે (f)": "આવી"
        "તે (it)": "આવ્યું"
        "અમે (m)": "આવ્યા"
        "અમે (mixed)": "આવ્યાં"
      readings:
        "હું (m)": "avyo"
        "હું (f)": "avi"
        "તે (m)": "avyo"
        "તે (f)": "avi"
        "તે (it)": "avyun"
        "અમે (m)": "avya"
        "અમે (mixed)": "avyan"
    - lemma: "ઊઠવું"
      key: uuthvun
      reading: "uthvun"
      gloss: "to get up"
      forms:
        "હું (m)": "ઊઠ્યો"
        "હું (f)": "ઊઠી"
        "તે (m)": "ઊઠ્યો"
        "તે (f)": "ઊઠી"
        "તે (it)": "ઊઠ્યું"
        "અમે (m)": "ઊઠ્યા"
        "અમે (mixed)": "ઊઠ્યાં"
      readings:
        "હું (m)": "uthyo"
        "હું (f)": "uthi"
        "તે (m)": "uthyo"
        "તે (f)": "uthi"
        "તે (it)": "uthyun"
        "અમે (m)": "uthya"
        "અમે (mixed)": "uthyan"
    - lemma: "બેસવું"
      key: besvun
      reading: "besvun"
      gloss: "to sit"
      forms:
        "હું (m)": "બેઠો"
        "હું (f)": "બેઠી"
        "તે (m)": "બેઠો"
        "તે (f)": "બેઠી"
        "તે (it)": "બેઠું"
        "અમે (m)": "બેઠા"
        "અમે (mixed)": "બેઠાં"
      readings:
        "હું (m)": "betho"
        "હું (f)": "bethi"
        "તે (m)": "betho"
        "તે (f)": "bethi"
        "તે (it)": "bethun"
        "અમે (m)": "betha"
        "અમે (mixed)": "bethan"
