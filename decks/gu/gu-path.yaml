# The order Gujarati is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner
# from English is taught gu-en-home for gu-home (ADR-0013, ADR-0036).
#
# This is also Gujarati's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"): every
# unit from the first words to B1, written or planned, with its size in
# words, its grammar topics, the three milestones, and for each planned unit
# its listening and reading passages. A unit with no deck yet is planned:
# the course teaches it as "Coming" until a deck is written. Sizes follow
# the plan's levels (about 700, 900 and 1,200 words; low confidence) and are
# one number for every native language; a written unit's size is what its
# decks hold today. A theme named here that decks/themes.yaml does not list
# yet is added to it with its first deck.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"):
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units;
# 3. the script, after the first six units ("After units 4-6"); a
#    learner who already reads it skips it (#554);
# 4. a core of about 200 common words in themed units, before the large
#    tables ("Yes, smaller (~200)");
# 5. rules as forms: noun endings, postpositions and conjunctions first,
#    then pronoun and verb forms, practised on the words already known;
# 6. sentences, each after its words and rules; then the other themes,
#    each its words, then its rules, then its sentences.
# Gujarati's grammar keeps the Indo-Aryan order of
# docs/plans/language-paths-scheme.md within each level: be, the present,
# the imperatives, continuous, postpositions, gender agreement, the
# oblique, the past, then the written past-more unit with its conjunct and
# compound verbs (right after the simple past; its decks already teach the
# ergative past, so no ergative unit is planned), the habitual past (right
# after it, the tense, number and gender audit of 2026-10-23), the perfect,
# then the subjunctive, the relative-correlative clauses and the rest of B1.
#
# The core's order is by judgement, most common first:
# about me, everyday verbs (planned), the common adverbs and function
# words (planned), how much and how many (planned), describing words
# (planned), time, more verbs (planned), work.
# It was meant to come from Wikipedia's counts
# (tools/wikipedia_frequency.py, #516), but
# no Gujarati Wikipedia dump could be fetched here (2026-10-17):
# order the core again from the counts once they are written.
#
# Every deck of Gujarati is listed exactly once.
schema: 1
kind: "path"
id: "gu-path"
language: "gu"
# The gender classes a noun's gender is one of (#512; DECK-FORMAT.md, Card data).
genders: ["m", "f", "n"]
# The decks that need the alphabet: a learner who learns without it
# skips them.
alphabet:
  - "gu-script-vowels"
  - "gu-script-consonants"
  - "gu-script-reading"
  - "gu-script-vowel-signs"
  - "gu-script-conjuncts"
  - "gu-script-digits"
  - "gu-spelling"
  - "gu-reading-keri"
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  # 1. The phrasebook, taught whole from the first lesson.
  - decks: ["gu-phrasebook", "gu-first-words", "*"]
    words: 1
  # 2. The first word units.
  - decks: ["gu-sound-differences"]
    words: 16
  - decks: ["gu-questions", "*"]
    words: 9
  - decks: ["gu-addressing", "*"]
    words: 12
  - decks: ["gu-pronouns", "gu-pronouns-sentences", "gu-reading-seating-chart"]
    words: 24
  - decks: ["gu-family", "*"]
    words: 25
  # 3. The script, after the first six units (#554: skipped by a learner
  # who already reads it).
  - ["gu-script-vowels", "gu-script-consonants", "gu-script-reading"]
  - ["gu-script-vowel-signs", "gu-script-conjuncts", "gu-script-digits"]
  # Numbers 1–20 follow the script, so it comes after the first six units.
  - decks: ["gu-numbers-1-20", "*"]
    words: 21
  # 4. The core: about 200 common words, most common first (by judgement
  # until the Wikipedia counts are written, #516).
  - decks: ["gu-about-me", "*"]
    words: 3
  - decks: ["gu-verbs", "gu-verbs-sentences", "gu-reading-fridge-note"]
    words: 30
  - decks: ["gu-adverbs", "gu-adverbs-sentences", "gu-reading-habit-survey"]
    words: 45
  - decks: ["gu-quantities", "gu-quantities-sentences", "gu-reading-recipe-amounts"]
    words: 23
  - decks: ["gu-describing", "gu-describing-sentences", "gu-reading-postcard-hills"]
    words: 28
  - decks: ["gu-time", "*"]
    words: 22
  - decks: ["gu-more-verbs", "gu-more-verbs-sentences", "gu-reading-how-to-make-tea"]
    words: 25
  - decks: ["gu-work", "*"]
    words: 15
  # 5. Rules as forms, practised on the words known: noun forms and
  # conjunctions first, then pronoun and verb forms. The postpositions deck
  # is fixed phrases still, so it waits below for its words.
  - decks: ["gu-grammar-nouns"]
    words: 0
    grammar: ["nouns"]
  - decks: ["gu-grammar-conjunctions"]
    words: 8
    grammar: ["conjunctions"]
  - decks: ["gu-grammar-pronouns"]
    words: 0
    grammar: ["pronouns"]
  - decks: ["gu-grammar-be"]
    words: 0
    grammar: ["be"]
  - decks: ["gu-grammar-present"]
