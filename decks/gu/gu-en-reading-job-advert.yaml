  "sentences":
  - "text": "અમારી કંપનીમાં એક નવી નોકરી છે."
    "reading": "amāri kampanimām̐ ek navi nokri che."
    "ipa": "əmari kəmpənimã ek nəʋi nokri tʃʰe"
  - "text": "આ નોકરી માટે અનુભવ જોઈએ."
    "reading": "ā nokri māṭe anubhav joie."
    "ipa": "a nokri maʈe ənubʱəʋ dʒoie"
  - "text": "પગાર સારો છે, અને રજા પણ મળશે."
    "reading": "pagār sāro che, ane rajā paṇ maḷśe."
    "ipa": "pəɡar saro tʃʰe əne rədʒa pəɳ məɭʃe"
  - "text": "જો તમને કામ ગમે, તો આ ઑફિસમાં અરજી કરો."
    "reading": "jo tamne kām game, to ā ôphismām̐ arji karo."
    "ipa": "dʒo t̪əmne kam ɡəme t̪o a ɔpʰismã ərdʒi kəro"
  - "text": "અરજી માટે કાગળ લાવો."
    "reading": "arji māṭe kāgaḷ lāvo."
    "ipa": "ərdʒi maʈe kaɡəɭ laʋo"
  - "text": "ઑફિસમાં તાલીમ મળશે."
    "reading": "ôphismām̐ tālim maḷśe."
    "ipa": "ɔpʰismã t̪alim məɭʃe"
