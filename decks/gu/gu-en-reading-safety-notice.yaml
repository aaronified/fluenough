          "text": "આ ઘરમાં આગ લાગે તો લિફ્ટ ન વાપરો.",
          "reading": "ā gharmām̐ āg lāge to liphṭ na vāpro.",
          "ipa": "a ɡʱərmã aɡ laɡe t̪o lipʰʈ nə ʋapro"
        },
        {
          "text": "બહાર જવા માટે સીડી વાપરો.",
          "reading": "bahār javā māṭe siḍi vāpro.",
          "ipa": "bəɦar dʒəʋa maʈe siɖi ʋapro"
        },
        {
          "text": "મદદ માટે ડૉક્ટર કે પોલીસને બોલાવો.",
          "reading": "madad māṭe ḍôkṭar ke polisne bolāvo.",
          "ipa": "məd̪əd̪ maʈe ɖɔkʈər ke polisne bolaʋo"
        },
        {
          "text": "બચાવ ટીમ આવે ત્યાં સુધી શાંત રહો.",
          "reading": "bacāv ṭim āve tyām̐ sudhi śānt raho.",
          "ipa": "bətʃaʋ ʈim aʋe t̪jã sud̪ʱi ʃant̪ rəɦo"
        }
