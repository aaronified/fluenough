schema: 1
id: gu-en-script-conjuncts
name: "Gujarati conjuncts"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Two consonants with no vowel between them join: the first is usually written as a half letter, without its upright stroke. Some stack, and a few join in shapes of their own. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: gu-0084
    target: "ક્ષ"
    native: "k + sh (ksh)"
    reading: "kśa"
    ipa: "kʃə"
    notes: "Its own shape, nothing like its parts. Gujarati lists it at the end of the consonants: પરીક્ષા (parikśā, exam)."
  - id: gu-0085
    target: "જ્ઞ"
    native: "j + ny, said gn"
    reading: "gna"
    ipa: "ɡnə"
    notes: "Its own shape. Gujarati says it 'gn', where Hindi says 'gy': જ્ઞાન (gnān, knowledge)."
  - id: gu-0086
    target: "ત્ર"
    native: "t + r (tr)"
    reading: "tra"
    ipa: "t̪rə"
    notes: "Its own shape, ત joined with ર: મિત્ર (mitra, friend), ત્રણ (traṇ, three)."
  - id: gu-0087
    target: "શ્ર"
    native: "sh + r (shr)"
    reading: "śra"
    ipa: "ʃrə"
    notes: "Its own shape: શ્રી (śri, Mr), before a man's name."
  - id: gu-0088
    target: "દ્ર"
    native: "d + r (dr)"
    reading: "dra"
    ipa: "d̪rə"
    notes: "The r is a small stroke at the foot of દ: દ્રાક્ષ (drākś, grapes)."
  - id: gu-0089
    target: "પ્ર"
    native: "p + r (the r stroke)"
    reading: "pra"
    ipa: "prə"
    notes: "A ર after a consonant is a small slanting stroke at its foot: પ્રેમ (prem, love)."
  - id: gu-0090
    target: "ક્ર"
    native: "k + r (kr)"
    reading: "kra"
    ipa: "krə"
    notes: "The r stroke at the foot of ક: ક્રિકેટ (krikeṭ, cricket)."
  - id: gu-0091
    target: "ટ્ર"
    native: "curled-back t + r"
    reading: "ṭra"
    ipa: "ʈrə"
    notes: "After ટ, ર is a small caret below: ટ્રેન (ṭren, train)."
  - id: gu-0092
    target: "ર્મ"
    native: "r + m (the r hook above)"
    reading: "rma"
    ipa: "rmə"
    notes: "A ર before another consonant is a small hook on top of that consonant: ધર્મ (dharm, religion)."
  - id: gu-0093
    target: "ર્ય"
    native: "r + y (the r hook above)"
    reading: "rya"
    ipa: "rjə"
    notes: "The hook again, here on ય: સૂર્ય (surya, the sun)."
  - id: gu-0094
    target: "સ્ત"
    native: "s + t (half સ)"
    reading: "sta"
    ipa: "st̪ə"
    notes: "સ loses its upright stroke and joins ત: રસ્તો (rasto, road), નાસ્તો (nāsto, breakfast)."
  - id: gu-0095
    target: "સ્ટ"
    native: "s + curled-back t"
    reading: "sṭa"
    ipa: "sʈə"
    notes: "In English words: સ્ટેશન (sṭeśan, station)."
  - id: gu-0096
    target: "સ્વ"
    native: "s + v (sv)"
    reading: "sva"
    ipa: "sʋə"
    notes: "Half સ joined to વ: સ્વાદ (svād, taste)."
  - id: gu-0097
    target: "ત્ય"
    native: "t + y (ty)"
    reading: "tya"
    ipa: "t̪jə"
    notes: "Half ત joined to ય: ત્યાં (tyām̐, there)."
  - id: gu-0098
    target: "પ્ય"
    native: "p + y (py)"
    reading: "pya"
    ipa: "pjə"
    notes: "Half પ joined to ય: પ્યાલો (pyālo, cup)."
  - id: gu-0099
    target: "ન્ય"
    native: "n + y (ny)"
    reading: "na"
    ipa: "nə"
    notes: "Half ન joined to ય: ધન્યવાદ (dhanyavād, thank you)."
  - id: gu-0100
    target: "દ્ય"
    native: "d + y (dy)"
    reading: "dya"
    ipa: "d̪jə"
    notes: "The y is joined below or beside દ, depending on the font: વિદ્યાર્થી (vidyārthi, student)."
  - id: gu-0101
    target: "ક્ત"
    native: "k + t (kt)"
    reading: "kta"
    ipa: "kt̪ə"
    notes: "ક drops the hook on its right and joins ત: ફક્ત (phakt, only)."
  - id: gu-0102
    target: "દ્ધ"
    native: "d + dh (stacked)"
    reading: "ddha"
    ipa: "d̪d̪ʱə"
    notes: "દ has no upright stroke to drop, so ધ is written below it: બુદ્ધિ (buddhi, intelligence)."
  - id: gu-0103
    target: "ત્ત"
    native: "t + t (half ત)"
    reading: "tta"
    ipa: "t̪t̪ə"
    modes: [recognition, production]
    notes: "Half ત joined to ત: સત્તર (sattar, seventeen). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  - id: gu-0104
    target: "ક્ક"
    native: "k + k (half ક)"
    reading: "kka"
    ipa: "kkə"
    modes: [recognition, production]
    notes: "The first ક drops its hook: ચોક્કસ (cokkas, certainly). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  - id: gu-0105
    target: "ચ્છ"
    native: "ch + chh (half ચ)"
    reading: "ccha"
    ipa: "tʃtʃʰə"
    modes: [recognition, production]
    notes: "Half ચ joined to છ: ઇચ્છા (icchā, wish). Said on its own, it sounds like છ, so it is drilled by reading and writing only."
  - id: gu-0106
    target: "ઠ્ઠ"
    native: "th + th, curled back (stacked)"
    reading: "ṭṭha"
    ipa: "ʈʈʰə"
    modes: [recognition, production]
    notes: "ઠ written below ઠ: ચિઠ્ઠી (ciṭṭhi, a note; a letter), અઠ્ઠાવીસ (aṭṭhāvis, 28). Said on its own, it sounds like ઠ, so it is drilled by reading and writing only."
  - id: gu-0107
    target: "ન્ન"
    native: "n + n (half ન)"
    reading: "nna"
    ipa: "nnə"
    modes: [recognition, production]
    notes: "Half ન joined to ન: છન્નું (channum̐, 96). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
