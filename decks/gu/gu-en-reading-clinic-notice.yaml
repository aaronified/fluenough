- "id": "gu-clinic-notice"
  "title": "A notice at the clinic"
  "theme": "health"
  "sentences":
  - "text": "દવાખાનું સવારે નવથી બપોર સુધી ખુલ્લું છે."
    "reading": "davākhānum̐ savāre navthi bapor sudhi khullum̐ che."
    "ipa": "d̪əʋakʰanũ səʋare nəʋt̪ʰi bəpor sud̪ʱi kʰullũ tʃʰe"
  - "text": "અપોઇન્ટમેન્ટ વગર તપાસ થતી નથી."
    "reading": "apoinṭmenṭ vagar tapās thati nathi."
    "ipa": "əpoinʈmenʈ ʋəɡər t̪əpas t̪ʰət̪i nət̪ʰi"
  - "text": "તાવ કે ઊલટી હોય તો તરત ફોન કરો."
    "reading": "tāv ke ulaṭi hoy to tarat phon karo."
    "ipa": "t̪aʋ ke uləʈi ɦoj t̪o t̪ərət̪ pʰon kəro"
  - "text": "દવા લેતાં પહેલાં ડૉક્ટરને પૂછો."
    "reading": "davā letām̐ pahelām̐ ḍôkṭarne pucho."
    "ipa": "d̪əʋa let̪ã pəɦelã ɖɔkʈərne putʃʰo"
