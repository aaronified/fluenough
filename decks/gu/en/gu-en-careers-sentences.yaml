        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "રજા (rajā) is a day off, not a job."
        },
        "c2": {
          "why": "કામ (kām) is the work itself, not the job."
        }
      }
    },
    "gu-4085": {
      "native": "His sister is a doctor.",
      "bases": {
        "તેની": "his; her",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "શિક્ષક (śikśak) is a teacher, not a doctor."
        },
        "c2": {
          "why": "નર્સ (nars) is a nurse, who works with a doctor."
        }
      }
    },
    "gu-4086": {
      "native": "I work in a company.",
      "bases": {
        "કંપનીમાં": "in the company",
        "કરું": "do (I)",
        "છું": "am"
      },
      "confusables": {
        "c1": {
          "why": "ધંધો (dhandho) is one's own business, not a firm one works for."
        },
        "c2": {
          "why": "વેચાણ (vecāṇ) is sales, a kind of work, not the place."
        }
      }
    },
    "gu-4087": {
      "native": "The manager gave leave today.",
