        "મેનેજરે": "the manager (as the one who does)",
        "આપી": "gave"
      },
      "confusables": {
        "c1": {
          "why": "બઢતી (baḍhti) is a promotion, not leave."
        },
        "c2": {
          "why": "રાજીનામું (rājināmum̐) is resigning, which the manager did not do."
        }
      }
    },
    "gu-4088": {
      "native": "After retirement he lives in the village.",
      "bases": {
        "ગામમાં": "in the village",
        "રહે": "lives; stays",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "કંપની (kampani) is a company, the place one works."
        },
        "c2": {
          "why": "પાળી (pāḷi) is a shift, a set period of work."
        }
      }
    },
    "gu-4089": {
      "native": "Success comes through hard work.",
      "bases": {
        "મહેનતથી": "through hard work",
        "મળે": "comes; is found",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "નિષ્ફળતા (niśphaḷtā) is failure, the opposite of success."
        },
        "c2": {
          "why": "અનુભવ (anubhav) is experience, built over years."
        }
      }
    },
    "gu-4090": {
      "native": "They applied for a promotion.",
      "bases": {
        "તેમણે": "they (polite)",
        "માટે": "for",
        "કરી": "did; made"
      },
      "confusables": {
        "c1": {
          "why": "રજા (rajā) is leave, not a promotion."
        },
        "c2": {
          "why": "રાજીનામું (rājināmum̐) is a resignation, the opposite of applying for a rise."
        }
      }
    },
    "gu-4091": {
