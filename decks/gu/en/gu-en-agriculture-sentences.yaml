  "cards": {
    "gu-4160": {
      "native": "The farmer works in the field.",
      "bases": {
        "ખેતરમાં": "in the field",
        "કરે": "does",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "ગાય (gāy) is a cow, which is an animal, not the worker."
        },
        "c2": {
          "why": "વાડી (vāḍi) is a small orchard farm, not the field the farmer works in."
        }
      }
    },
    "gu-4161": {
      "native": "Without rain the crop dries up.",
      "bases": {
        "વગર": "without",
        "સુકાય": "dries up",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "સિંચાઈ (siñcāi) is watering by a pump or a well, a way to replace rain."
        },
        "c2": {
          "why": "તડકો (taḍko) is sunshine, which dries the crop but does not water it."
        }
      }
    },
    "gu-4162": {
      "native": "Cows and buffaloes give milk.",
      "bases": {
        "આપે": "gives",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "બળદ (baḷad) is an ox, which does not give milk."
        },
        "c2": {
          "why": "ઘેટું (gheṭum̐) is a sheep, another farm animal."
        }
      }
    },
    "gu-4163": {
      "native": "Rice production rose.",
      "bases": {
        "ચોખાનું": "of rice",
        "વધ્યું": "increased (neuter)"
      },
      "confusables": {
        "c1": {
          "why": "ઘઉં (ghaum̐) is wheat, another grain."
        },
        "c2": {
          "why": "શેરડી (śeraḍi) is sugarcane, a different crop."
        }
      }
    },
    "gu-4164": {
      "native": "Plough the field and sow the seed.",
      "bases": {
        "ખેડીને": "having ploughed",
        "વાવો": "sow (polite)"
      },
      "confusables": {
        "c1": {
          "why": "લણવું (laṇvum̐) is to harvest, which comes after sowing."
        },
        "c2": {
          "why": "ઉગાડવું (ugāḍvum) is to grow a plant, which comes after the seed."
        }
      }
    },
    "gu-4165": {
      "native": "Draw water from the well and give it to the field.",
      "bases": {
        "કૂવામાંથી": "from the well",
        "ખેંચીને": "having pulled",
        "ખેતરમાં": "in the field",
        "આપો": "give (polite)"
      },
      "confusables": {
        "c1": {
          "why": "ઝાડ (jhāḍ) is a tree, not water."
        },
        "c2": {
          "why": "ફળ (phaḷ) is a fruit, not water."
        }
      }
    },
    "gu-4166": {
      "native": "The hens run in the yard.",
      "bases": {
        "મરઘીઓ": "hens",
        "વાડામાં": "in the yard",
        "દોડે": "runs",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "પશુ (paśu) is a farm animal, a wider word."
        },
        "c2": {
          "why": "ઢોર (ḍhor) is cattle together."
        }
      }
    },
    "gu-4167": {
      "native": "The tractor is ready for the harvest.",
      "bases": {
        "માટે": "for",
        "તૈયાર": "ready",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "હળ (haḷ) is a plough, pulled behind the tractor."
        },
        "c2": {
          "why": "દાતરડું (dātraḍum̐) is a sickle, a hand tool."
        }
      }
    },
    "gu-4168": {
      "native": "The mangoes ripened in the orchard.",
      "bases": {
        "વાડીમાં": "in the orchard",
        "પાકી": "ripened (feminine)",
        "ગઈ": "went (feminine)"
      },
      "confusables": {
        "c1": {
          "why": "મકાઈ (makāi) is maize, a different crop."
        },
        "c2": {
          "why": "ગોબર (gobar) is cow dung, not fruit."
        }
      }
    },
    "gu-4169": {
      "native": "Improve the soil by adding manure.",
      "bases": {
        "નાખીને": "having put",
        "સુધારો": "improve (polite)"
      },
      "confusables": {
        "c1": {
          "why": "માટી (māṭi) is soil or clay, the thing to improve."
        },
        "c2": {
          "why": "ભૂમિ (bhumi) is land, the formal word for the soil."
        }
      }
    }
  }
}
