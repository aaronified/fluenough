"name": "Past continuous: I was doing"
"license": "CC-BY-SA-4.0"
"description": "Gujarati's past continuous says what was going on: the verb stem, then -to for a man, -ti for a woman or -ta for a group, then the past of 'be'. Not yet checked by a Gujarati speaker: please report any mistake."
"tags":
- "unreviewed"
"pattern":
  "name": "Past continuous"
