  "notes": "The explicit progressive is the conjunctive of the verb, then rahyo, rahi or rahya (the form of 'stay', agreeing with the doer), then hato, hati or hata: 'I was eating' is khai rahyo hato. The habitual past form (the verb stem with -to, -ti or -ta, then hato, hati or hata) is also used for 'was doing', so both say 'was doing'; this table shows the explicit progressive, which makes the action in progress plain."
