  "notes": "Take the stem and add -to for a man, -ti for a woman, or -ta for a group, then the past of 'be' (hato, hati or hata). The same ending is used for every verb in this table, and the irregular 'to go' and 'to come' follow it too. 'To be' itself is left out: its past continuous is not used."
