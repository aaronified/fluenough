"name": "Past continuous: I was doing"
"license": "CC-BY-SA-4.0"
"description": "Gujarati's past continuous says what was going on. The explicit progressive joins the conjunctive form of the verb, then રહ્યો (rahyo, a man), રહી (rahi, a woman) or રહ્યા (rahya, a group), then the past of 'be' (hato, hati, hata). Not yet checked by a Gujarati speaker: please report any mistake."
