schema: 1
id: "gu-en-transport"
kind: "layer"
core: "gu-transport"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bus, auto, cab"
license: "CC0-1.0"
description: "Buses, autos, taxis and trains: getting a ride, asking the fare, and telling the driver where to stop. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0054":
    notes:
      "n1": "In the sense of the vehicle: બસ (bas) is feminine, as most vehicles are. The state's buses are the ST, એસટી (esaṭi)."
  "gu-0421":
    native: "auto-rickshaw"
    notes:
      "n1": "The three-wheeled auto, in every town. Ask the fare first, or for the meter."
  "gu-0422":
    native: "taxi"
  "gu-0423":
    native: "car; train; a vehicle"
    notes:
      "n1": "Any vehicle, most often a car. મોટર (moṭar) is an older word for a car."
  "gu-0424":
    native: "train"
  "gu-0425":
    native: "station"
  "gu-0426":
    native: "ticket"
  "gu-0427":
    native: "fare; rent"
  "gu-0428":
    native: "I want to go to the station."
    notes:
      "n1": "What to say to a driver: the place, then જવું છે (javum̐ che). મારે (māre), 'I', is understood."
    bases:
      "છે": "to be"
  "gu-0429":
    native: "What will the fare be?"
    notes:
      "n1": "Literally 'how much fare will it become?'."
    bases:
      "થશે": "to be; to become; to happen"
  "gu-0430":
    native: "Please put the meter on."
    bases:
      "મીટર": "meter"
      "ચાલુ": "on; running"
      "કરો": "to do; to make"
  "gu-0431":
    native: "Stop here."
    notes:
      "n1": "Literally 'keep it standing here'. ઊભી (ubhi) agrees with the feminine રિક્ષા (rikśā) or ગાડી (gāḍi)."
    bases:
      "અહીં": "here"
      "ઊભી": "standing"
      "રાખો": "to keep; to put"
  "gu-0432":
    native: "Where does this bus go?"
    bases:
      "છે": "to be"
