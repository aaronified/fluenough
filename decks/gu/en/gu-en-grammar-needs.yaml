schema: 1
id: "gu-en-grammar-needs"
kind: "layer"
core: "gu-grammar-needs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Need, want and have"
license: "CC0-1.0"
description: "To me water is needed; to me is to go; near me is money: how Gujarati says need, want and have. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0410":
    native: "I need water."
    notes:
      "n1": "Literally 'to me water is needed'. જોઈએ (joie) never changes; the one who needs takes -ને (-ne)."
    bases:
      "મને": "I"
      "જોઈએ": "should; need"
      "છે": "to be"
  "gu-0411":
    native: "What would you like?"
    notes:
      "n1": "A shopkeeper's question. તમારે (tamāre) and તમને (tamne) are both heard here."
    bases:
      "તમારે": "your"
      "જોઈએ": "should; need"
  "gu-0412":
    native: "I need help."
    bases:
      "મને": "I"
      "જોઈએ": "should; need"
      "છે": "to be"
  "gu-0413":
    native: "I don't need anything."
    notes:
      "n1": "With નથી (nathi), જોઈએ (joie) becomes જોઈતું (joitum̐), and it agrees: મને ચા નથી જોઈતી (mane cā nathi joiti), I don't want tea."
    bases:
      "મને": "I"
      "કંઈ": "anything; something"
      "નથી": "is not; are not"
      "જોઈતું": "should; need"
  "gu-0414":
    native: "I want to go home."
    notes:
      "n1": "મારે (māre) with a verb in -વું (-vum̐) and છે (che): 'to me is to go'. It means 'want to' or 'have to'."
    bases:
      "મારે": "my"
      "છે": "to be"
  "gu-0415":
    native: "I want to buy a ticket."
    notes:
      "n1": "The verb agrees with the thing: ટિકિટ (ṭikiṭ) is feminine, so લેવી (levi), not લેવું (levum̐)."
    bases:
      "મારે": "my"
      "લેવી": "to take"
      "છે": "to be"
  "gu-0416":
    native: "I'd like to drink tea."
    notes:
      "n1": "ચા (cā) is feminine, so પીવી (pivi)."
    bases:
      "મારે": "my"
      "છે": "to be"
  "gu-0417":
    native: "I don't have time."
    notes:
      "n1": "Literally 'near me time is not'."
    bases:
      "મારી": "my"
      "નથી": "is not; are not"
  "gu-0418":
    native: "I have no money."
    bases:
      "મારી": "my"
      "નથી": "is not; are not"
  "gu-0419":
    native: "Do you have change?"
    bases:
      "તમારી": "your"
      "છૂટા": "loose (of money, change)"
      "છે": "to be"
  "gu-0420":
    native: "That's all, nothing else."
    bases:
      "બીજું": "other; else"
      "કંઈ": "anything; something"
      "નહીં": "no; not"
