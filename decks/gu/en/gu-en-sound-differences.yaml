schema: 1
id: "gu-en-sound-differences"
kind: "layer"
core: "gu-sound-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sounds to tell apart"
license: "CC0-1.0"
description: "Pairs of everyday words that differ in one sound: the tongue on the teeth or curled back, the two l's, a breath after the consonant, a and aa, and a nasal vowel. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0226":
    native: "dal; lentils"
    notes:
      "n1": "Dental against curled back: દાળ (dāḷ, lentils) has the tongue on the teeth for d; ડાળ (ḍāḷ, branch) has it curled back."
  "gu-0227":
    native: "branch (of a tree)"
    notes:
      "n1": "Dental against curled back: દાળ (dāḷ, lentils) has the tongue on the teeth for d; ડાળ (ḍāḷ, branch) has it curled back."
  "gu-0228":
    native: "hair"
    notes:
      "n1": "The two l's: વાળ (vāḷ, hair) has the l curled back; વાલ (vāl, field beans) has it on the teeth."
  "gu-0229":
    native: "field beans (a dried bean)"
    notes:
      "n1": "The two l's: વાલ (vāl, beans) has the l on the teeth; વાળ (vāḷ, hair) has it curled back."
  "gu-0120":
    notes:
      "n1": "A breath after the consonant: બાર (bār, twelve) has none; ભાર (bhār, a load) has a puff of breath after the b."
  "gu-0230":
    native: "weight; a load"
    notes:
      "n1": "A breath after the consonant: ભાર (bhār, a load) against બાર (bār, twelve)."
  "gu-0231":
    native: "a gift to charity; donation"
    notes:
      "n1": "A breath after the consonant: દાન (dān, donation) has none; ધાન (dhān, grain) has one."
  "gu-0232":
    native: "grain"
    notes:
      "n1": "A breath after the consonant: ધાન (dhān, grain) against દાન (dān, donation)."
  "gu-0233":
    native: "a way of walking; a move (in a game)"
    notes:
      "n1": "A breath after the consonant: ચાલ (cāl, gait) has none; છાલ (chāl, peel) has one."
  "gu-0234":
    native: "peel; bark"
    notes:
      "n1": "A breath after the consonant: છાલ (chāl, peel) against ચાલ (cāl, gait)."
  "gu-0053":
    notes:
      "n1": "a against aa: રસ (ras, juice) has the short a; રાસ (rās, a circle dance) has the long a."
  "gu-0235":
    native: "raas (a circle dance with sticks)"
    notes:
      "n1": "a against aa: રાસ (rās, the dance of Navratri, with the long a) against રસ (ras, juice, with the short a)."
  "gu-0117":
    notes:
      "n1": "a against aa: નવ (nav, nine) has the short a; નાવ (nāv, boat) has the long a."
  "gu-0236":
    native: "boat"
    notes:
      "n1": "a against aa: નાવ (nāv, boat, with the long a) against નવ (nav, nine, with the short a)."
  "gu-0237":
    native: "smell"
    notes:
      "n1": "A nasal vowel: વાસ (vās, smell) is said through the mouth; વાંસ (vāṁs, bamboo) through the nose as well."
  "gu-0238":
    native: "bamboo"
    notes:
      "n1": "A nasal vowel: the dot on વાંસ (vāṁs, bamboo) sends the long a through the nose; વાસ (vās) is a smell."
