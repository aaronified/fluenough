  "description": "Sentences about phones, the internet, passwords, updates and computers. Not yet checked by a Gujarati speaker: please report any mistake.",
  "cards": {
    "gu-3919": {
      "native": "The internet is off; switch on the wifi.",
      "bases": {
        "છે": "to be",
        "કરો": "to do"
      },
      "confusables": {
        "c1": {
          "why": "નેટવર્ક (neṭavark) (network) is the connection the phone uses, not a switch you turn on."
        },
        "c2": {
          "why": "સિગ્નલ (signal) (signal) is how strong the connection is, not whether it is on."
        }
      }
    },
    "gu-3920": {
      "native": "I forgot my email password.",
      "bases": {
        "મારો": "my",
        "ભૂલી": "to forget",
        "ગયો": "to go"
      },
      "confusables": {
        "c1": {
          "why": "સંદેશો (sandeśo) (message) is text you send, not a password."
        },
        "c2": {
          "why": "સંપર્ક (sampark) (contact) is a person in the phone book, not a password."
        }
      }
    },
    "gu-3921": {
      "native": "Open the link and watch the video.",
      "bases": {
        "ખોલો": "to open",
        "જુઓ": "to see; to watch; to look"
      },
      "confusables": {
        "c1": {
          "why": "ફાઇલ (fāil) (file) is a saved document, not a link."
        },
        "c2": {
          "why": "વેબસાઇટ (vebasāiṭ) (website) is where the link leads, not the link itself."
        }
      }
    },
    "gu-3922": {
      "native": "Keep the computer and the laptop together.",
      "bases": {
        "સાથે": "with",
        "રાખો": "to keep; to put aside"
      },
      "confusables": {
        "c1": {
          "why": "ચાર્જર (cārjar) (charger) powers a device; it is not a device itself."
        },
        "c2": {
          "why": "માઉસ (māus) (mouse) is an input device, not a computer."
        }
      }
    },
    "gu-3923": {
      "native": "There is a problem on the screen.",
      "bases": {
        "પર": "on; at",
        "છે": "to be"
      },
      "confusables": {
        "c1": {
          "why": "ભૂલ (bhul) (mistake; fault) is a wrong action or a fault, not the screen."
        },
        "c2": {
          "why": "બટન (baṭan) (button) is a part you press, not the screen."
        }
      }
    },
    "gu-3924": {
      "native": "Take the backup again.",
      "bases": {
        "લો": "to take"
      },
      "confusables": {
        "c1": {
          "why": "રીસ્ટાર્ટ (risṭārṭ) (restart) starts the device again; it does not copy any files."
        },
        "c2": {
          "why": "અપડેટ (apḍeṭ) (update) changes the software; it does not copy files."
        }
      }
    },
    "gu-3925": {
      "native": "The update is done; restart the phone.",
      "bases": {
        "થયું": "to become; to happen",
        "કરો": "to do"
      },
      "confusables": {
        "c1": {
          "why": "ચાલુ (cālu) (on; running) describes the phone once it has started again."
        },
        "c2": {
          "why": "બંધ (bandh) (off) is the state before the restart."
        }
      }
    },
    "gu-3926": {
      "native": "Is this app online?",
      "bases": {
        "છે": "to be"
      },
      "confusables": {
        "c1": {
          "why": "વેબસાઇટ (vebasāiṭ) (website) is a place on the internet, not an app."
        },
        "c2": {
          "why": "ઇન્ટરનેટ (inṭarneṭ) (internet) is the network itself, not one app."
        }
      }
    },
    "gu-3927": {
      "native": "The network is not good.",
      "bases": {
        "સારું": "good; fine",
        "નથી": "to be"
      },
      "confusables": {
        "c1": {
          "why": "સિગ્નલ (signal) (signal) is the strength of a link; the network is the whole system."
        },
        "c2": {
          "why": "ઇન્ટરનેટ (inṭarneṭ) (internet) is the service used over the network."
        }
      }
    },
    "gu-3928": {
      "native": "Where are the camera and the mouse?",
      "bases": {
        "છે": "to be"
      },
      "confusables": {
        "c1": {
          "why": "કીબોર્ડ (kiborḍ) (keyboard) is also an input device; the question is about a camera and a mouse."
        },
        "c2": {
          "why": "પ્રિન્ટર (prinṭar) (printer) prints paper; it does not take input from you."
        }
      }
    }
