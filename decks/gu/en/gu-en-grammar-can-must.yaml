id: "gu-en-grammar-can-must"
kind: "layer"
core: "gu-grammar-can-must"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Can, must and should"
license: "CC0-1.0"
description: "Can with શકવું (śakvum̐), must with પડવું (paḍvum̐), should with જોઈએ (joie), and what is planned with -વાનું (-vānum̐). Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0648":
    native: "I can speak Gujarati."
    notes:
      "n1": "The stem with -ઈ (-i), then શકવું (śakvum̐), 'to be able', which takes the person's ending."
  "gu-0649":
    native: "You can sit here."
  "gu-0650":
    native: "May I come in?"
    notes:
      "n1": "Without છું (chum̐), a question with શકું (śakum̐) asks permission."
  "gu-0651":
    native: "I can't come. (a man)"
    notes:
      "n1": "A woman says શકતી (śakti). Also હું આવી શકતો નથી (hum̐ āvi śakto nathi)."
  "gu-0652":
    native: "Can one take photos here?"
    notes:
      "n1": "-ઈ શકાય (-i śakāy) asks what is allowed, with no 'I' or 'you': the polite way to ask. ફોટો પાડવો (phoṭo pāḍvo) is to take a photo."
  "gu-0653":
    native: "I'll have to go."
    notes:
      "n1": "મારે (māre), the verb in -વું (-vum̐), then પડવું (paḍvum̐), 'to fall': something you must do whether you like it or not."
  "gu-0654":
    native: "I have to work every day."
  "gu-0655":
    native: "You should rest."
    notes:
      "n1": "The verb in -વું (-vum̐), then જોઈએ (joie): 'should'. આરામ (ārām) is masculine, so કરવો (karvo)."
  "gu-0656":
    native: "We should leave early."
    notes:
      "n1": "નીકળવું (nikaḷvum̐), to set out."
  "gu-0657":
    native: "I have to go to the office today."
    notes:
      "n1": "-વાનું છે (-vānum̐ che) is something planned or expected: 'I am to go'."
  "gu-0658":
    native: "You needn't come."
    notes:
      "n1": "Literally 'to you there is no need of coming'. જરૂર (jarur), need, is feminine, so આવવાની (āvvāni)."
