schema: 1
id: "gu-en-script-reading"
kind: "layer"
core: "gu-script-reading"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words to read"
license: "CC0-1.0"
description: "Short everyday words written with letters alone, no vowel signs: the vowel you do not see, and the last a that goes quiet, at work. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0048":
    native: "house; home"
    notes:
      "n1": "ઘ (gha) is gha and ર (ra) is ra, but the last a isn't said: ghar."
  "gu-0049":
    native: "tap"
    notes:
      "n1": "ન (na) and the curled-back ળ (ḷa); the last a is quiet."
  "gu-0050":
    native: "fruit"
    notes:
      "n1": "ફ (pha) is પ (pa) with a breath; many say it 'fal'."
  "gu-0051":
    native: "mung beans"
    notes:
      "n1": "Two letters, and only the first a is said: mag."
  "gu-0052":
    native: "forest"
    notes:
      "n1": "વ (va) is between v and w."
  "gu-0053":
    native: "juice"
    notes:
      "n1": "In Gujarat રસ (ras) on its own often means mango pulp, eaten with puris in summer."
  "gu-0054":
    native: "bus; enough"
    notes:
      "n1": "Two words in one: the English 'bus', and બસ (bas)! 'that's enough'."
  "gu-0055":
    native: "but; also"
    notes:
      "n1": "With the curled-back ણ (ṇa). Between two clauses it is 'but'; after a word it is 'also': હું પણ (hum̐ paṇ), me too."
  "gu-0056":
    native: "lotus"
    notes:
      "n1": "Three letters and no vowel written: ka-ma-l."
  "gu-0057":
    native: "hot; warm"
    notes:
      "n1": "ગ (ga), ર (ra) and મ (ma), each with its a, and the last one quiet."
  "gu-0058":
    native: "soft"
  "gu-0059":
    native: "news; knowing"
    notes:
      "n1": "મને ખબર નથી (mane khabar nathi): I don't know."
  "gu-0060":
    native: "time"
    notes:
      "n1": "The last letter ય (ya) is a y, and its a is quiet: sa-may."
  "gu-0061":
    native: "turmeric"
    notes:
      "n1": "The a after ળ (ḷa) goes quiet inside the word too: hal-dar, not ha-la-dar."
  "gu-0062":
    native: "a sweet cold drink; sherbet"
    notes:
      "n1": "The a after ર (ra) is quiet: shar-bat."
