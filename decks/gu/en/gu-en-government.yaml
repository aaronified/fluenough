  "name": "Government",
  "license": "CC-BY-SA-4.0",
  "description": "Offices, officers, documents, forms, taxes, elections and the rights and duties of a citizen. Not yet checked by a Gujarati speaker: please report any mistake.",
  "cards": {
    "gu-3855": {
      "native": "officer",
      "notes": {
        "n1": "A person in charge in an office. Compare કચેરી (kaceri) (government office) and ઑફિસ (ôfis)."
      },
      "examples": {
        "અધિકારી ઑફિસમાં છે?": {
          "native": "Is the officer in the office?",
          "bases": {
            "અધિકારી": "officer",
            "ઑફિસમાં": "office",
            "છે": "to be"
          }
        },
        "અધિકારી ફોર્મ જોશે.": {
          "native": "The officer will look at the form.",
          "bases": {
            "અધિકારી": "officer",
            "જોશે": "to see; to watch; to look"
          }
        }
      }
    },
    "gu-3856": {
      "native": "document",
      "notes": {
        "n1": "Any official paper that proves or records something. A certificate is one kind of document."
      },
      "examples": {
        "દસ્તાવેજ ક્યાં છે?": {
          "native": "Where are the documents?",
          "bases": {
            "દસ્તાવેજ": "document",
            "છે": "to be"
          }
        },
        "દસ્તાવેજ બતાવો.": {
          "native": "Show the document.",
          "bases": {
            "દસ્તાવેજ": "document",
            "બતાવો": "to show"
          }
        }
      }
    },
    "gu-3857": {
      "native": "certificate",
      "notes": {
        "n1": "An official paper that proves a fact, such as the date and place of birth."
      },
      "examples": {
        "જન્મનું પ્રમાણપત્ર આપો.": {
          "native": "Give me the birth certificate.",
          "bases": {
            "જન્મનું": "birth",
            "પ્રમાણપત્ર": "certificate",
            "આપો": "to give"
          }
        },
        "પ્રમાણપત્ર ક્યારે મળશે?": {
          "native": "When will I get the certificate?",
          "bases": {
            "પ્રમાણપત્ર": "certificate",
            "મળશે": "to meet; to be found"
          }
        }
      }
    },
    "gu-3858": {
      "native": "rule",
      "notes": {
        "n1": "A rule that people must follow, in an office, a school or a game. A law is a larger rule made by government."
      },
      "examples": {
        "નિયમ શું છે?": {
          "native": "What is the rule?",
          "bases": {
            "નિયમ": "rule",
            "છે": "to be"
          }
        },
        "આ નિયમ બધા માટે છે.": {
          "native": "This rule is for everyone.",
          "bases": {
            "આ": "this",
            "નિયમ": "rule",
            "બધા": "all; everyone",
            "માટે": "for",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3860": {
      "native": "voter",
      "notes": {
        "n1": "A person who is allowed to vote. Compare મત (mat) (vote), which is the choice itself."
      },
      "examples": {
        "મતદાર ઓળખપત્ર બતાવો.": {
          "native": "Show your voter ID card.",
          "bases": {
            "મતદાર": "voter",
            "ઓળખપત્ર": "identity card; badge",
            "બતાવો": "to show"
          }
        },
        "મતદાર યાદી ક્યાં છે?": {
          "native": "Where is the voter list?",
          "bases": {
            "મતદાર": "voter",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3861": {
      "native": "citizen",
      "notes": {
        "n1": "A member of a country who has its rights and duties. Compare દેશ (deś) (country)."
      },
      "examples": {
        "હું ભારતનો નાગરિક છું.": {
          "native": "I am a citizen of India.",
          "bases": {
            "ભારતનો": "India",
            "નાગરિક": "citizen",
            "છું": "to be"
          }
        },
        "દરેક નાગરિકનો અધિકાર છે.": {
          "native": "It is every citizen's right.",
          "bases": {
            "નાગરિકનો": "citizen",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3862": {
      "native": "approval",
      "notes": {
        "n1": "Official agreement that something may go ahead. To get it, say લેવી (levi) (to take) or મળવી (maḷavi) (to be found)."
      },
      "examples": {
        "મંજૂરી મળી?": {
          "native": "Did you get approval?",
          "bases": {
            "મંજૂરી": "approval",
            "મળી": "to meet; to be found"
          }
        },
        "અધિકારીની મંજૂરી લો.": {
          "native": "Get the officer's approval.",
          "bases": {
            "અધિકારીની": "officer",
            "મંજૂરી": "approval",
            "લો": "to take"
          }
        }
      }
    },
    "gu-3863": {
      "native": "permission",
      "notes": {
        "n1": "A personal permission to do something, given by someone who is in charge."
      },
      "examples": {
        "પરવાનગી ક્યાંથી મળશે?": {
          "native": "Where can I get permission?",
          "bases": {
            "પરવાનગી": "permission",
            "ક્યાંથી": "from where",
            "મળશે": "to meet; to be found"
          }
        },
        "પરવાનગી છે?": {
          "native": "Do you have permission?",
          "bases": {
            "પરવાનગી": "permission",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3864": {
      "native": "licence",
      "notes": {
        "n1": "An official document that allows you to do something, such as drive a vehicle or run a shop."
      },
      "examples": {
        "લાઇસન્સ ક્યાં મળશે?": {
          "native": "Where will I get the licence?",
          "bases": {
            "લાઇસન્સ": "licence",
            "મળશે": "to meet; to be found"
          }
        },
        "લાઇસન્સ બનાવો.": {
          "native": "Get the licence made.",
          "bases": {
            "લાઇસન્સ": "licence",
            "બનાવો": "to make; to prepare"
          }
        }
      }
    },
    "gu-3865": {
      "native": "tax",
      "notes": {
        "n1": "Money that people pay to government on income or property. Compare ભાડું (bhāḍum̐) (rent)."
      },
      "examples": {
        "વેરો કેટલો છે?": {
          "native": "How much is the tax?",
          "bases": {
            "વેરો": "tax",
            "કેટલો": "how many; how much",
            "છે": "to be"
          }
        },
        "વેરો ભરવો પડશે.": {
          "native": "You will have to pay the tax.",
          "bases": {
            "વેરો": "tax",
            "ભરવો": "to fill",
            "પડશે": "to fall; must (with a verb)"
          }
        }
      }
    },
    "gu-3866": {
      "native": "fine; penalty",
      "notes": {
        "n1": "Money paid as a punishment for breaking a rule."
      },
      "examples": {
        "દંડ કેટલો છે?": {
          "native": "How much is the fine?",
          "bases": {
            "દંડ": "fine; penalty",
            "કેટલો": "how many; how much",
            "છે": "to be"
          }
        },
        "દંડ ભરો.": {
          "native": "Pay the fine.",
          "bases": {
            "દંડ": "fine; penalty",
            "ભરો": "to fill"
          }
        }
      }
    },
    "gu-3867": {
      "native": "municipality",
      "notes": {
        "n1": "The local government of a town or city, which runs its roads, water and waste."
      },
      "examples": {
        "નગરપાલિકા ઑફિસ ક્યાં છે?": {
          "native": "Where is the municipal office?",
          "bases": {
            "નગરપાલિકા": "municipality",
            "છે": "to be"
          }
        },
        "નગરપાલિકાની ચૂંટણી ક્યારે છે?": {
          "native": "When is the municipal election?",
          "bases": {
            "નગરપાલિકાની": "municipality",
            "ચૂંટણી": "election",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3868": {
      "native": "ministry",
      "notes": {
        "n1": "A department of the national government that is in charge of one area, such as health or finance."
      },
      "examples": {
        "મંત્રાલય ક્યાં છે?": {
          "native": "Where is the ministry?",
          "bases": {
            "મંત્રાલય": "ministry",
            "છે": "to be"
          }
        },
        "મંત્રાલય નિયમ બનાવે છે.": {
          "native": "The ministry makes the rules.",
          "bases": {
            "મંત્રાલય": "ministry",
            "બનાવે": "to make; to prepare",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3869": {
      "native": "photo",
      "notes": {
        "n1": "A photograph, such as a passport-size photo that an office asks for."
      },
      "examples": {
        "બે ફોટો આપો.": {
          "native": "Give two photos.",
          "bases": {
            "ફોટો": "photo",
            "આપો": "to give"
          }
        },
        "આ ફોટો જૂનો છે.": {
          "native": "This photo is old.",
          "bases": {
            "આ": "this",
            "ફોટો": "photo",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3870": {
      "native": "service",
      "notes": {
        "n1": "Work done for the public by an office, such as issuing a document or a licence."
      },
      "examples": {
        "સેવા ક્યાં મળે છે?": {
          "native": "Where is the service available?",
          "bases": {
            "સેવા": "service",
            "મળે": "to meet; to be found",
            "છે": "to be"
          }
        },
        "સેવા સારી છે.": {
          "native": "The service is good.",
          "bases": {
            "સેવા": "service",
            "સારી": "good; fine",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3871": {
      "native": "scheme; plan",
      "notes": {
        "n1": "A plan by government to help people, such as a grant or a housing scheme."
      },
      "examples": {
        "યોજના શું છે?": {
          "native": "What is the scheme?",
          "bases": {
            "યોજના": "scheme; plan",
            "છે": "to be"
          }
        },
        "આ યોજના બધા માટે છે.": {
          "native": "This scheme is for everyone.",
          "bases": {
            "આ": "this",
            "યોજના": "scheme; plan",
            "બધા": "all; everyone",
            "માટે": "for",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3872": {
      "native": "benefit",
      "notes": {
        "n1": "What you gain from a scheme or a service. Compare ફાયદો (fāyado) (advantage)."
      },
      "examples": {
        "આનો લાભ કોને મળશે?": {
          "native": "Who will get the benefit?",
          "bases": {
            "આનો": "this",
            "લાભ": "benefit",
            "કોને": "who",
            "મળશે": "to meet; to be found"
          }
        },
        "લાભ મોટો છે.": {
          "native": "The benefit is big.",
          "bases": {
            "લાભ": "benefit",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3873": {
      "native": "right",
      "notes": {
        "n1": "What a person is allowed to have or do under the law."
      },
      "examples": {
        "દરેકને અધિકાર છે.": {
          "native": "Everyone has the right.",
          "bases": {
            "દરેકને": "each; every",
            "અધિકાર": "right",
            "છે": "to be"
          }
        },
        "મારો અધિકાર છે.": {
          "native": "It is my right.",
          "bases": {
            "મારો": "my",
            "અધિકાર": "right",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3874": {
      "native": "duty",
      "notes": {
        "n1": "What a person must do, such as voting or paying tax."
      },
      "examples": {
        "આ આપણી ફરજ છે.": {
          "native": "This is our duty.",
          "bases": {
            "આ": "this",
            "આપણી": "our (including you)",
            "ફરજ": "duty",
            "છે": "to be"
          }
        },
        "ફરજ શું છે?": {
          "native": "What is the duty?",
          "bases": {
            "ફરજ": "duty",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3875": {
      "native": "ration card",
      "notes": {
        "n1": "A card that lists a family and lets it buy food at a fixed price from a government shop."
      },
      "examples": {
        "રેશનકાર્ડ ક્યાં બને?": {
          "native": "Where is a ration card made?",
          "bases": {
            "રેશનકાર્ડ": "ration card",
            "બને": "to be made; to become"
          }
        },
        "રેશનકાર્ડ પર નામ લખો.": {
          "native": "Write the name on the ration card.",
          "bases": {
            "રેશનકાર્ડ": "ration card",
            "પર": "on; at",
            "લખો": "to write"
          }
        }
      }
    },
    "gu-3876": {
      "native": "income",
      "notes": {
        "n1": "The money a person earns in a year. Compare ઓછું (ochum) (less)."
      },
      "examples": {
        "આવક કેટલી છે?": {
          "native": "What is the income?",
          "bases": {
            "આવક": "income",
            "કેટલી": "how many; how much",
            "છે": "to be"
          }
        },
        "આવક ઓછી છે.": {
          "native": "The income is low.",
          "bases": {
            "આવક": "income",
            "ઓછી": "less; a little",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3877": {
      "native": "birth",
      "notes": {
        "n1": "The day or the act of being born. A date of birth is said with તારીખ (tārikh) (date)."
      },
      "examples": {
        "જન્મ ક્યાં થયો?": {
          "native": "Where were you born?",
          "bases": {
            "જન્મ": "birth",
            "થયો": "to become; to happen"
          }
        },
        "જન્મ તારીખ કેટલી છે?": {
          "native": "What is the date of birth?",
          "bases": {
            "જન્મ": "birth",
            "કેટલી": "how many; how much",
            "છે": "to be"
          }
        }
      }
    }
  }
}
