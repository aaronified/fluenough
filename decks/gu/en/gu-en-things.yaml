"description": "Things you carry, use and find in a room or a shop, and what each one is for. Not yet checked by a Gujarati speaker: please report any mistake."
"cards":
  "gu-1760":
    "native": "thing; item"
    "notes":
      "n1": "Feminine; the general word for any object."
    "examples":
      "આ વસ્તુ મોટી છે.":
        "native": "This thing is big."
        "bases":
          "વસ્તુ": "thing; item"
          "છે": "to be"
      "વસ્તુ સારી છે.":
        "native": "The item is good."
        "bases":
          "વસ્તુ": "thing; item"
          "છે": "to be"
  "gu-1761":
    "native": "book"
    "notes":
      "n1": "Neuter; a book with many pages, bound together."
    "examples":
      "પુસ્તક મોટું છે.":
        "native": "The book is big."
        "bases":
          "પુસ્તક": "book"
          "છે": "to be"
      "મારું પુસ્તક ટેબલ પર છે.":
        "native": "My book is on the table."
        "bases":
          "પુસ્તક": "book"
          "પર": "on; over"
          "છે": "to be"
