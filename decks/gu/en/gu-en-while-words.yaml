  "name": "While: words for things at the same time",
  "license": "CC-BY-SA-4.0",
  "description": "The words for two actions that go on together. Not yet checked by a Gujarati speaker: please report any mistake.",
  "tags": [
    "unreviewed"
  ],
  "cards": {
    "gu-4097": {
      "native": "during; in the course of; while",
      "notes": {
        "n1": "It is used with a noun for a span of time, such as પરીક્ષા (parikśā) દરમિયાન (daramiyān), during the exam. It does not take a verb: for a verb, see the rule for the -તાં (tām̐) form."
      },
      "examples": {
        "પરીક્ષા દરમિયાન કોઈ વાત ન કરો.": {
          "native": "Do not talk during the exam.",
          "bases": {
            "પરીક્ષા": "exam",
            "દરમિયાન": "during; in the course of; while",
            "કરો": "do (polite or plural)"
          }
        },
        "વરસાદ દરમિયાન અમે ઘરમાં રહ્યા.": {
          "native": "We stayed at home during the rain.",
          "bases": {
            "દરમિયાન": "during; in the course of; while",
            "રહ્યા": "stayed (masculine plural)"
          }
        }
      }
    },
    "gu-4098": {
      "native": "at the time of; during (a particular time or event)",
      "notes": {
        "n1": "It comes after a noun for an event or a time of day, as in ભોજન (bhojan) સમયે (samaye), at mealtime. It names the moment rather than a span, so it is less exact than દરમિયાન (daramiyān)."
      },
      "examples": {
        "ભોજન સમયે વાત ન કરો.": {
          "native": "Do not talk at mealtime.",
          "bases": {
            "સમયે": "at the time of; during (a particular time or event)",
            "કરો": "do (polite or plural)"
          }
        },
        "સવારના સમયે તે ચા પીએ છે.": {
          "native": "In the morning he drinks tea.",
          "bases": {
            "સવારના": "of the morning",
            "સમયે": "at the time of; during (a particular time or event)",
            "પીએ": "drinks",
            "છે": "is"
          }
        }
      }
    }
  }
}
