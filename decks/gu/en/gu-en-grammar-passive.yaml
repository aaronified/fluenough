    "notes": "The passive says what is done, without saying by whom. Only a verb with an object has one. After a consonant the stem takes -āy: લખવું (lakhvum̐) becomes લખાય (lakhāy), is written. After a vowel the stem takes -vāy: જોવું (jovum̐) becomes જોવાય (jovāy), is seen. The past of a thing is લખાયું (lakhāyum̐), was written; the masculine is લખાયો (lakhāyo). Two verbs are irregular: વાંચવું (vāñcvum̐) shortens its vowel to વંચાય (vañcāy), and આપવું (āpvum̐) becomes અપાય (apāy), is given."
