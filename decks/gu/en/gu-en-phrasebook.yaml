schema: 1
id: "gu-en-phrasebook"
kind: "layer"
core: "gu-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "20 phrases to say whole from the first day, before their words are taught: greetings and thanks, yes and no, saying you are still learning Gujarati, asking for it slowly or again, and asking for help. Not yet checked by a Gujarati speaker: please report any mistake."
license: "CC0-1.0"
cards:
  "gu-0260":
    native: "hello; goodbye"
    notes:
      "n1": "Said with palms pressed together, to anyone. નમસ્કાર (namaskār) is the same, a little more formal. In a family, younger people often greet elders by touching their feet; a visitor is not expected to."
    bases:
      "નમસ્તે": "hello; goodbye"
  "gu-0261":
    native: "How are you?"
    notes:
      "n1": "The everyday greeting, often instead of hello. કેમ (kem) is 'how', and છો (cho) goes with તમે (tame). To a friend: કેમ છે? (kem chhe?)."
    bases:
      "છો": "to be"
  "gu-0262":
    native: "fine; well"
    notes:
      "n1": "The usual answer to કેમ છો (kem cho)?: literally 'in fun'. In full, મજામાં છું (majāmām̐ chum̐), I'm fine."
    bases:
      "મજામાં": "fine; well"
  "gu-0263":
    native: "thank you"
    notes:
      "n1": "Many people simply say 'thank you' in English, and among family thanks are often left out. ધન્યવાદ (dhanyavād) is more formal."
    bases:
      "આભાર": "thank you"
  "gu-0264":
    native: "goodbye"
    notes:
      "n1": "Literally 'do come (again)', a polite request. Said by both the one leaving and the one staying."
    bases:
      "આવજો": "goodbye"
  "gu-0265":
    native: "hello; goodbye (literally, 'glory to Lord Krishna')"
    notes:
      "n1": "A common greeting among many Gujarati Hindus, especially followers of Krishna. Answer it with the same words. Others greet with જય જિનેન્દ્ર (jay jinendra, among Jains) or સલામ (salām)."
    bases:
      "જય": "victory; glory"
      "કૃષ્ણ": "Krishna"
  "gu-0267":
    native: "sorry; excuse me"
    notes:
      "n1": "Literally 'please forgive'. The ending -જો (-jo) makes a polite request: બેસજો (besjo), please sit."
    bases:
      "માફ": "sorry; pardon"
      "કરજો": "to do; to make"
  "gu-0268":
    native: "OK; all right"
    notes:
      "n1": "Literally 'it is fine'. Also ભલે (bhale) and સારું (sārum̐), 'good'."
    bases:
      "ઠીક": "OK; all right"
      "છે": "to be"
  "gu-0283":
    native: "yes"
    notes:
      "n1": "Often just a nod, or a sideways tilt of the head, which also means yes."
    bases:
      "હા": "yes"
  "gu-0284":
    native: "no"
    notes:
      "n1": "ના પાડવી (nā pāḍvi) is 'to say no; to refuse'. નહીં (nahim̐), 'not', is a firmer no."
    bases:
      "ના": "no"
  "gu-0295":
    native: "I don't know."
    notes:
      "n1": "Literally 'to me there is no news'."
    bases:
      "મને": "I"
      "નથી": "is not; are not"
  "gu-0269":
    native: "I don't know Gujarati."
    notes:
      "n1": "Literally 'Gujarati doesn't come to me'. આવડવું (āvaḍvum̐) is knowing how to do something."
    bases:
      "મને": "I"
      "ગુજરાતી": "Gujarati"
      "નથી": "is not; are not"
      "આવડતું": "to know (a language or skill)"
  "gu-0270":
    native: "I'm still learning Gujarati."
    notes:
      "n1": "હજી (haji) is 'still; yet'. The present 'I learn' also does for 'I am learning'."
    bases:
      "હું": "I"
      "હજી": "still; yet"
      "ગુજરાતી": "Gujarati"
      "શીખું": "to learn"
      "છું": "to be"
  "gu-0271":
    native: "Could you speak a little slower?"
    notes:
      "n1": "A request put as a question in the future is polite: 'will you speak a little slowly?'. જરા (jarā) is 'a little'."
    bases:
      "જરા": "a little"
      "ધીમે": "slow"
  "gu-0272":
    native: "Could you say that again?"
    notes:
      "n1": "ફરીથી (pharithi) is 'again'."
    bases:
      "ફરીથી": "again"
      "કહેશો": "to say; to tell"
  "gu-0328":
    native: "I know a little Gujarati."
    notes:
      "n1": "Literally 'a little Gujarati comes to me'."
    bases:
      "મને": "I"
      "થોડું": "a little"
      "ગુજરાતી": "Gujarati"
      "આવડે": "to know (a language or skill)"
      "છે": "to be"
  "gu-0605":
    native: "I don't feel well."
    notes:
      "n1": "Literally 'to me it doesn't feel good'."
    bases:
      "મને": "I"
      "સારું": "good"
      "નથી": "is not; are not"
      "લાગતું": "to feel; to seem"
  "gu-0608":
    native: "I'm lost. (a man)"
    notes:
      "n1": "Literally 'I have forgotten the way'. A woman says ભૂલી ગઈ છું (bhuli gai chum̐)."
    bases:
      "હું": "I"
      "ભૂલી": "to forget"
      "છું": "to be"
  "gu-0600":
    native: "Help! Save me!"
    notes:
      "n1": "The cry for help. To ask for a hand: મદદ કરો! (madad karo!)."
    bases:
      "બચાવો": "to save"
  "gu-0266":
    native: "come in; welcome"
    notes:
      "n1": "Said at the door to a guest, often twice: આવો (āvo), આવો (āvo)! It is the polite form of 'come'. Even more polite: પધારો (padhāro)."
    bases:
      "આવો": "come in; welcome"
