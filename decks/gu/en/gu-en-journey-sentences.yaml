"cards":
  "gu-3305":
    "native": "I am not in a hurry; the train has not come yet."
    "bases":
      "ઉતાવળ": "hurry"
      "નથી": "to be"
    "confusables":
      "c1":
        "why": "ઝડપથી (jhaḍapathi) (zadapathi) is about speed, not about waiting."
      "c2":
        "why": "ધીમું (dhimum) (dhimum) is slow, the opposite of a fast train."
  "gu-3306":
    "native": "Buy a ticket and go to the platform."
    "bases":
      "પ્લેટફોર્મ": "platform"
      "પર": "on; at"
    "confusables":
      "c1":
        "why": "ચઢવું (caḍhvum) (chadhvum) is to get on, which comes after the platform."
      "c2":
        "why": "ઊતરવું (utarvum) (utarvum) is to get off, the opposite move."
  "gu-3307":
    "native": "Put my luggage in the bus."
    "bases":
      "સામાન": "luggage"
    "confusables":
      "c1":
        "why": "પાકીટ (pākiṭ) (paakit) is a wallet, which goes in a pocket, not in a bus."
      "c2":
        "why": "ડબ્બો (ḍabbo) (dabbo) is a railway carriage, not a bus."
  "gu-3308":
    "native": "When will the plane leave?"
    "bases":
      "વિમાન": "aeroplane"
      "ઉપડશે": "to depart; to leave"
    "confusables":
      "c1":
        "why": "હોડી (hoḍi) (hodi) is a boat, not a plane."
      "c2":
        "why": "ફ્લાઇટ (phlāiṭ) (phlait) is a flight, a trip by plane, not the plane itself."
  "gu-3309":
    "native": "What is the seat number?"
    "bases":
      "સીટ": "seat"
      "નંબર": "number"
      "કેટલો": "how many; how much"
      "છે": "to be"
    "confusables":
      "c1":
        "why": "પાસપોર્ટ (pāsporṭ) (paasport) is a document, not a number."
      "c2":
        "why": "ટિકિટબારી (ṭikiṭbāri) (tikitbari) is where you buy a ticket."
  "gu-3310":
    "native": "The passengers got off the carriage quickly."
    "bases":
      "મુસાફરો": "traveller; passenger"
      "ડબ્બામાંથી": "railway carriage"
      "ઊતરી": "to get off"
    "confusables":
      "c1":
        "why": "ચઢવું (caḍhvum) (chadhvum) is to get on, the opposite of getting off."
      "c2":
        "why": "બેસવું (besvum) (besvum) is to sit, which a passenger may do instead."
  "gu-3311":
    "native": "The hotel is not far from the station."
    "bases":
      "હોટેલ": "hotel"
      "નથી": "to be"
    "confusables":
      "c1":
        "why": "ગામ (gām) (gaam) is a village, not a place near a station."
      "c2":
        "why": "શહેર (śaher) (shaher) is a city, a larger place."
  "gu-3312":
    "native": "We will look at the map and find the way."
    "bases":
      "નકશો": "map"
      "માર્ગ": "route"
      "શોધીશું": "to find"
    "confusables":
      "c1":
        "why": "વળાંક (vaḷāṅk) (valank) is a bend in the road, a thing on the way."
      "c2":
        "why": "ચોક (cok) (chok) is a crossroads, a place on the way."
  "gu-3313":
    "native": "I took a taxi to arrive on time."
    "bases":
      "સમયસર": "on time"
      "માટે": "for"
      "ટેક્સી": "taxi"
    "confusables":
      "c1":
        "why": "સાયકલ (sāykal) (saaikal) is a bicycle, a slower way to travel."
      "c2":
        "why": "હોડી (hoḍi) (hodi) is a boat, not a road vehicle."
  "gu-3314":
    "native": "Our journey was long but pleasant."
    "bases":
      "અમારી": "our"
      "યાત્રા": "pilgrimage; journey"
      "લાંબી": "long"
      "સુખદ": "pleasant"
      "હતી": "to be"
    "confusables":
      "c1":
        "why": "ગામ (gām) (gaam) is a village, not a journey."
      "c2":
        "why": "વિશ્રામ (viśrām) (vishraam) is a rest, which is part of a journey but not the word here."
