  "name": "Government: sentences",
  "license": "CC-BY-SA-4.0",
  "description": "Sentences about offices, documents, votes, taxes and fines. Not yet checked by a Gujarati speaker: please report any mistake.",
  "cards": {
    "gu-3878": {
      "native": "Give the form at the office.",
      "bases": {
        "કચેરીમાં": "office",
        "આપો": "to give"
      },
      "confusables": {
        "c1": {
          "why": "અદાલત (adālat) (court) is a court of law, not an office for forms."
        },
        "c2": {
          "why": "ચૂંટણી (cuṇṭaṇi) (election) is a vote, not a place for forms."
        }
      }
    },
    "gu-3879": {
      "native": "What does the law say?",
      "bases": {
        "કહે": "to say; to tell",
        "છે": "to be"
      },
      "confusables": {
        "c1": {
          "why": "નિયમ (niyam) (rule) is set by an office or a school; the law is set by government."
        },
        "c2": {
          "why": "અધિકાર (adhikār) (right) is what you are allowed, not what the law says."
        }
      }
    },
    "gu-3880": {
      "native": "Come with your voter ID card.",
      "bases": {
        "ઓળખપત્ર": "identity card; badge",
        "લઈને": "to take",
        "આવો": "to come"
      },
      "confusables": {
        "c1": {
          "why": "પાસપોર્ટ (pāsporṭ) (passport) is a travel document, not a voter ID."
        },
        "c2": {
          "why": "નાગરિક (nāgarik) (citizen) is a person, not a card."
        }
      }
    },
    "gu-3881": {
      "native": "When is the date to pay the fine?",
      "bases": {
        "ભરવાની": "to fill",
        "છે": "to be"
      },
      "confusables": {
        "c1": {
          "why": "વેરો (vero) (tax) is paid to government on income or property."
        },
        "c2": {
          "why": "લાભ (lābh) (benefit) is what you gain, not a payment."
        }
      }
    },
    "gu-3882": {
      "native": "Apply for the service.",
      "bases": {
        "માટે": "for",
        "કરો": "to do"
      },
      "confusables": {
        "c1": {
          "why": "યોજના (yojanā) (scheme) is a plan from government, not a service you apply to."
        },
        "c2": {
          "why": "ફરજ (faraj) (duty) is what you must do, not a request."
        }
      }
    },
    "gu-3883": {
      "native": "Is my name on the ration card?",
      "bases": {
        "પર": "on; at",
        "મારું": "my",
        "છે": "to be"
      },
      "confusables": {
        "c1": {
          "why": "દસ્તાવેજ (dastāvej) (document) is any official paper; the ration card is one kind."
        },
        "c2": {
          "why": "ઓળખપત્ર (oḷkhpatra) (ID card) shows who you are, not what you receive."
        }
      }
    },
    "gu-3884": {
      "native": "Write the date of birth in the office.",
      "bases": {
        "ઑફિસમાં": "office",
        "લખો": "to write"
      },
      "confusables": {
        "c1": {
          "why": "નોંધ (nondh) (note) is a short written record; here you write a date."
        },
        "c2": {
          "why": "કાગળ (kāgaḷ) (paper) is the sheet you write on, not the words."
        }
      }
    },
    "gu-3885": {
      "native": "Will the ministry approve it?",
      "bases": {
        "મંત્રાલયની": "ministry",
        "મળશે": "to meet; to be found"
      },
      "confusables": {
        "c1": {
          "why": "પરવાનગી (paravāngi) (permission) is close in meaning, but it is given to a person."
        },
        "c2": {
          "why": "લાઇસન્સ (lāisans) (licence) is a document that allows you to do a thing."
        }
      }
    },
    "gu-3886": {
      "native": "Vote in the election.",
      "bases": {
        "ચૂંટણીમાં": "election",
        "મત": "vote",
        "આપો": "to give"
      },
      "confusables": {
        "c1": {
          "why": "મતદાર (matdār) (voter) is the person who votes, not the vote itself."
        },
        "c2": {
          "why": "નાગરિક (nāgarik) (citizen) is the wider word for a member of the country."
        }
      }
    },
    "gu-3887": {
      "native": "Give two photos and your signature.",
      "bases": {
        "આપો": "to give"
      },
      "confusables": {
        "c1": {
          "why": "દસ્તાવેજ (dastāvej) (document) is any paper; this sentence asks for a photo and a signature."
        },
        "c2": {
          "why": "પ્રમાણપત્ર (pramāṇpatra) (certificate) is an official paper that proves a fact."
        }
      }
    }
  }
}
