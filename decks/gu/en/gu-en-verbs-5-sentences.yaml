  "cards": {
    "gu-5201": {
      "native": "First everyone gathered, then the journey started.",
      "bases": {
        "પહેલાં": "before; first",
        "બધા": "all; everyone",
        "ભેગા": "together",
        "થવું": "to happen; to become",
        "પછી": "after; then",
        "મુસાફરી": "journey; trip",
        "શરૂ": "start; beginning"
      },
      "confusables": {
        "c1": {
          "why": "તરત (tarat) is 'at once', a timing of speed; it does not say which step comes first here."
        },
        "c2": {
          "why": "ધીમે (dhime) is 'slowly', a way of doing a step, not the order of steps."
        }
      }
    },
    "gu-5202": {
      "native": "First prepare it, then eat.",
      "bases": {
        "પહેલાં": "before; first",
        "તૈયાર": "ready",
        "કરવું": "to do; to make",
        "પછી": "after; then",
        "ખાવું": "to eat"
      },
      "confusables": {
        "c1": {
          "why": "પીવું (pivum̐) (to drink) is another thing one does with food, not the step before eating."
        },
        "c2": {
          "why": "રાંધવું (rāndhavum̐) (to cook) is a step before eating; it is not the word for eating."
        }
      }
    },
    "gu-5203": {
      "native": "The bus left, and after a while we got off.",
