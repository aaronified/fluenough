        "વાર": "time; while",
        "પછી": "after; then",
        "અમે": "we",
        "ઊતરવું": "to get off; to come down"
      },
      "confusables": {
        "c1": {
          "why": "ચડવું (caḍvum̐) (to get on) is the opposite of getting off here."
        },
        "c2": {
          "why": "બેસવું (besvum̐) (to sit) is what one does on the bus, not getting off it."
        }
      }
    },
    "gu-5204": {
