schema: 1
id: "gu-en-grammar-gender-number"
kind: "layer"
core: "gu-grammar-gender-number"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Gender and number"
license: "CC0-1.0"
description: "Masculine, feminine and neuter, in the singular and the plural, and the plural of respect. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0244":
    notes:
      "n1": "Masculine: the noun in -ઓ (-o), the past verb in -ઓ (-o)."
  "gu-0245":
    notes:
      "n1": "Feminine: the noun in -ઈ (-i), the past verb in -ઈ (-i)."
  "gu-0246":
    notes:
      "n1": "Neuter: the verb in -ઉં (-um̐). A child, many things and some animals are neuter, whatever their sex."
  "gu-0405":
    native: "The boys are playing."
    notes:
      "n1": "છોકરો (chokro) becomes છોકરા (chokrā) in the plural, and many add -ઓ (-o) as well: છોકરાઓ (chokrāo)."
    bases:
      "છે": "to be"
  "gu-0406":
    native: "The children are playing."
    notes:
      "n1": "છોકરું (chokrum̐), a child, is neuter; its plural છોકરાં (chokrām̐) takes in boys and girls together."
    bases:
      "છોકરાં": "child"
      "છે": "to be"
  "gu-0407":
    native: "my clothes"
    notes:
      "n1": "કપડાં (kapḍām̐) is neuter plural, so 'my' is મારાં (mārām̐), with the nasal -આં (-ām̐)."
    bases:
      "મારાં": "my"
      "કપડાં": "clothes"
  "gu-0408":
    native: "three bananas"
    notes:
      "n1": "After a number a noun can be plural or stay singular: ત્રણ કેળાં (traṇ keḷām̐), બે ભાઈ (be bhāi)."
  "gu-0409":
    native: "Ba has come. (with respect)"
    notes:
      "n1": "One person spoken of with respect takes the plural: a man -આ (-ā) (પપ્પા આવ્યા (pappā āvyā)), a woman -આં (-ām̐). A mixed group takes -આં (-ām̐) too."
