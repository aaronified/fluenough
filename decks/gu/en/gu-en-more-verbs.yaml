        "bases":
          "તે": "he; she; it"
          "શાકભાજી": "vegetables"
          "કાપે": "to cut"
          "છે": "to be"
  "gu-1296":
    "native": "to fry"
    "notes":
      "n1": "Used for frying in oil: બટાકા તળો (baṭākā taḷo), fry the potatoes."
    "examples":
      "બટાકા તળો.":
        "native": "Fry the potatoes."
        "bases":
          "બટાકા": "potatoes"
          "તળો": "to fry"
      "મા ભજિયાં તળે છે.":
        "native": "Mum is frying fritters."
        "bases":
          "મા": "mother"
          "ભજિયાં": "fritters"
          "તળે": "to fry"
          "છે": "to be"
