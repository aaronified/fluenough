"description": "Common everyday verbs for the kitchen, the street and the classroom: give, take, open, cut, sit, learn and more. Not yet checked by a Gujarati speaker: please report any mistake."
"cards":
  "gu-1292":
    "native": "to put; to place"
    "notes":
      "n1": "Used for putting something down somewhere, as in મૂકો (muko), put it."
