        "bases":
          "બારી": "window"
          "ખોલો": "to open"
      "દુકાન સવારે ખોલે છે.":
        "native": "The shop opens in the morning."
        "bases":
          "દુકાન": "shop"
          "સવારે": "in the morning"
          "ખોલે": "to open"
          "છે": "to be"
  "gu-1294":
    "native": "to cover"
    "notes":
      "n1": "Used for covering a pot or bowl: વાટકી ઢાંકો (vāṭki ḍhāṅko), cover the bowl."
    "examples":
      "વાટકી ઢાંકો.":
        "native": "Cover the bowl."
        "bases":
          "વાટકી": "bowl"
          "ઢાંકો": "to cover"
      "દાળ ઢાંકીને રાખો.":
        "native": "Keep the dal covered."
        "bases":
          "દાળ": "dal; lentils"
          "ઢાંકીને": "to cover"
          "રાખો": "to keep"
  "gu-1295":
