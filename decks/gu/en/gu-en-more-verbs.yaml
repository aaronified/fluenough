  "gu-1299":
    "native": "to fill"
    "notes":
      "n1": "Used for filling a container: ગ્લાસ ભરો (glās bharo), fill the glass."
    "examples":
      "ગ્લાસ પાણીથી ભરો.":
        "native": "Fill the glass with water."
        "bases":
