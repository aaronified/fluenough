"description": "Common everyday verbs for the kitchen, the street and the classroom: give, take, open, cut, sit, learn and more. Not yet checked by a Gujarati speaker: please report any mistake."
"cards":
  "gu-1290":
    "native": "to give"
    "notes":
      "n1": "The stem is આપ (āp), so the present is આપે છે (āpe che) and the command is આપો (āpo)."
    "examples":
      "મને એક કપ ચા આપો.":
        "native": "Give me a cup of tea."
        "bases":
          "મને": "I"
          "એક": "one; a"
          "કપ": "cup"
          "ચા": "tea"
          "આપો": "to give"
      "તમે મને પૈસા આપશો?":
        "native": "Will you give me money?"
        "bases":
          "તમે": "you"
          "મને": "I"
          "પૈસા": "money"
          "આપશો": "to give"
  "gu-1291":
    "native": "to take"
    "notes":
      "n1": "Also used for buying and for taking a turn: લો (lo) means take, as a command."
    "examples":
      "હું છત્રી લઉં છું.":
        "native": "I am taking an umbrella."
        "bases":
          "હું": "I"
          "છત્રી": "umbrella"
          "લઉં": "to take"
          "છું": "to be"
      "તમે ચા લેશો?":
        "native": "Will you take tea?"
        "bases":
          "તમે": "you"
          "ચા": "tea"
          "લેશો": "to take"
  "gu-1292":
    "native": "to put; to place"
    "notes":
      "n1": "Used for putting something down somewhere, as in મૂકો (muko), put it."
    "examples":
      "ચાવી ટેબલ પર મૂકો.":
        "native": "Put the key on the table."
        "bases":
          "ચાવી": "key"
          "ટેબલ": "table"
          "પર": "on"
          "મૂકો": "to put; to place"
      "થાળી ટેબલ પર મૂકે છે.":
        "native": "She puts the plate on the table."
        "bases":
          "થાળી": "plate"
          "ટેબલ": "table"
          "પર": "on"
          "મૂકે": "to put; to place"
          "છે": "to be"
  "gu-1293":
    "native": "to open"
    "notes":
      "n1": "The opposite is બંધ કરવું (bandh karvum̐), to close."
    "examples":
      "બારી ખોલો.":
