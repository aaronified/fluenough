          "ભરો": "to fill"
  "gu-1300":
    "native": "to sit"
    "notes":
      "n1": "The command બેસો (beso) is the polite way to ask someone to sit."
    "examples":
      "અહીં બેસો.":
        "native": "Sit here."
        "bases":
          "અહીં": "here"
          "બેસો": "to sit"
      "બા ખુરશી પર બેસે છે.":
        "native": "Grandmother is sitting on the chair."
        "bases":
          "બા": "grandmother"
          "ખુરશી": "chair"
          "પર": "on"
          "બેસે": "to sit"
          "છે": "to be"
  "gu-1301":
    "native": "to walk"
    "notes":
      "n1": "Also used for something that works or runs, as in ગાડી ચાલે છે (gāḍi cāle che)."
    "examples":
      "અમે ચાલીએ છીએ.":
        "native": "We are walking."
        "bases":
          "અમે": "we"
          "ચાલીએ": "to walk"
          "છીએ": "to be"
      "ચાલો, જઈએ.":
        "native": "Let's go."
        "bases":
          "ચાલો": "to walk"
          "જઈએ": "to go"
  "gu-1302":
    "native": "to run"
    "notes":
      "n1": "The command દોડો (doḍo) is used for hurrying someone."
    "examples":
      "બાળકો બગીચામાં દોડે છે.":
        "native": "The children run in the garden."
        "bases":
          "બાળકો": "child"
          "બગીચામાં": "garden"
          "દોડે": "to run"
          "છે": "to be"
      "જલ્દી દોડો!":
        "native": "Run quickly!"
        "bases":
          "જલ્દી": "quickly"
          "દોડો": "to run"
  "gu-1303":
    "native": "to learn"
    "notes":
      "n1": "The opposite-direction verb is શીખવવું (śikhvvum̐), to teach."
    "examples":
      "હું ગુજરાતી શીખું છું.":
        "native": "I am learning Gujarati."
        "bases":
          "હું": "I"
          "ગુજરાતી": "Gujarati"
          "શીખું": "to learn"
          "છું": "to be"
      "બાળકો રોજ શીખે છે.":
        "native": "Children learn every day."
        "bases":
          "બાળકો": "child"
          "રોજ": "every day"
          "શીખે": "to learn"
          "છે": "to be"
  "gu-1304":
    "native": "to teach"
    "notes":
      "n1": "The causative of શીખવું (śikhvum̐): શીખવવું (śikhvvum̐) is 'to make someone learn'."
    "examples":
      "એ મને ગુજરાતી શીખવે છે.":
        "native": "She teaches me Gujarati."
        "bases":
          "એ": "that; he; she"
          "મને": "I"
          "ગુજરાતી": "Gujarati"
          "શીખવે": "to teach"
          "છે": "to be"
      "શિક્ષક બાળકોને ગણિત શીખવે છે.":
        "native": "The teacher teaches maths to children."
        "bases":
          "શિક્ષક": "teacher"
          "બાળકોને": "child"
          "ગણિત": "maths"
          "શીખવે": "to teach"
          "છે": "to be"
