id: "gu-en-multiword-conjunct-verbs"
kind: "layer"
core: "gu-multiword-conjunct-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: conjunct verbs"
license: "CC-BY-SA-4.0"
description: "Two verb phrases of a noun and a light verb: to admit into hospital and to shave. Not yet checked by a Gujarati speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "gu-6400":
    native: "to admit (into a hospital)"
    notes:
      "u1": "Literal parts: દાખલ (dākhal), an entry, and કરવું (karvum), to do. The person admitted takes -ને (ne), as in the first example."
    bases:
      "દાખલ": "entry; admission"
    examples:
      "ડૉક્ટરે તેને દાખલ કર્યો.":
        native: "The doctor admitted him."
        bases:
          "દાખલ": "entry; admission"
      "તેને દાખલ કરવો પડશે.":
        native: "He will have to be admitted."
        bases:
          "દાખલ": "entry; admission"
          "પડશે": "to fall; here, to have to"
  "gu-6401":
    native: "to shave"
    notes:
      "u1": "Literal parts: દાઢી (dāḍhi), beard, and કરવી (karvi), to do. The light verb is feminine, as in the second example, because દાઢી (dāḍhi) is feminine."
    bases:
      "દાઢી": "beard"
    examples:
      "તે રોજ દાઢી કરે છે.":
        native: "He shaves every day."
        bases:
          "દાઢી": "beard"
          "છે": "to be"
      "મારે દાઢી કરવી છે.":
        native: "I want to shave."
        bases:
          "દાઢી": "beard"
          "છે": "to be"
