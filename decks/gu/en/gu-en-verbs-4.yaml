          "native": "He suddenly blurted out.",
          "bases": {
            "તે": "he; she; it",
            "અચાનક": "suddenly"
          }
        },
        "બાળક બોલી ઊઠ્યું.": {
          "native": "The child blurted out.",
          "bases": {
            "બાળક": "child"
          }
        }
      }
    },
    "gu-4931": {
      "native": "to sneak in; to push in",
      "notes": {
        "n1": "Entering a place secretly or by force."
