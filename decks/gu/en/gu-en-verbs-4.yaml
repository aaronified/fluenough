          "native": "The rain kept going.",
          "bases": {
            "વરસાદ": "rain",
            "ચાલુ": "going on; ongoing"
          }
        },
        "વાર્તા ચાલુ રહી.": {
          "native": "The story continued.",
          "bases": {
            "વાર્તા": "story",
            "ચાલુ": "going on; ongoing"
          }
        }
      }
    },
