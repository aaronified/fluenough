        "કામ પૂરું થયું.": {
          "native": "The work was finished.",
          "bases": {
            "કામ": "work",
            "પૂરું": "finished; complete"
          }
        }
      },
      "bases": {
        "પૂરું": "finished; complete"
      }
    },
    "gu-4929": {
      "native": "to continue; to keep going",
      "notes": {
        "n1": "Going on without stopping. ચાલુ (cālu) means \"going on\"."
      },
      "examples": {
