  "name": "Story actions",
  "license": "CC-BY-SA-4.0",
  "description": "Verbs for telling what happens in a story: arriving, hiding, falling, breaking and reacting. Not yet checked by a Gujarati speaker: please report any mistake.",
  "cards": {
    "gu-4900": {
      "native": "to happen; to become",
      "notes": {
        "n1": "The past tense stem is થ (tha)-: થયું (thayum̐) means \"it happened\" or \"it became\". Use it for events and for becoming something."
      },
      "examples": {
        "એ શું થયું?": {
          "native": "What happened?",
          "bases": {
            "એ": "that; it",
            "શું": "what"
          }
        },
        "તે ડૉક્ટર થયો.": {
          "native": "He became a doctor.",
          "bases": {
            "તે": "he; she; it",
            "ડૉક્ટર": "doctor"
          }
        }
      }
    },
    "gu-4902": {
      "native": "to live; to be alive",
      "notes": {
        "n1": "Means to be alive. Compare રહેવું (rahevum̐), to live in a place."
      },
      "examples": {
        "દાદા ઘણાં વર્ષ જીવ્યા.": {
          "native": "Grandfather lived for many years.",
          "bases": {
            "દાદા": "grandfather",
            "વર્ષ": "year"
          }
        },
        "બધા જીવે છે.": {
          "native": "Everyone is alive.",
          "bases": {
            "બધા": "all; everyone"
          }
        }
      }
    },
    "gu-4903": {
      "native": "to die",
      "notes": {
        "n1": "Plain \"to die\". The past is often said with ગયું (gayum̐), \"went\", as in મરી ગયું (mari gayum̐): that dog died."
      },
      "examples": {
        "એ કૂતરું મરી ગયું.": {
          "native": "That dog died.",
          "bases": {
            "એ": "that; it",
            "કૂતરું": "dog"
          }
        },
        "બધા લોકો મરે છે.": {
          "native": "All people die.",
          "bases": {
            "બધા": "all; everyone"
          }
        }
      }
    },
    "gu-4904": {
      "native": "to be born",
      "notes": {
        "n1": "Said of the person born: તે અહીં જન્મ્યો (te ahim̐ janmyo) (he was born here). Dates are said with the place or year, not with a verb of being."
      },
      "examples": {
        "તે અહીં જન્મ્યો.": {
          "native": "He was born here.",
          "bases": {
            "તે": "he; she; it",
            "અહીં": "here"
          }
        },
        "બાળક ક્યારે જન્મે છે?": {
          "native": "When is a child born?",
          "bases": {
            "બાળક": "child",
            "ક્યારે": "when"
          }
        }
      }
    },
    "gu-4905": {
      "native": "to grow up",
      "notes": {
        "n1": "Used for a child being raised. The present is ઉછરે છે (uchre che) (grows up)."
      },
      "examples": {
        "તે ગામમાં ઉછર્યો.": {
          "native": "He grew up in the village.",
          "bases": {
            "તે": "he; she; it"
          }
        },
        "બાળકો ઝડપથી ઉછરે છે.": {
          "native": "Children grow up quickly.",
          "bases": {
            "ઝડપથી": "quickly"
          }
        }
      }
    },
    "gu-4906": {
      "native": "to know; to learn",
      "notes": {
        "n1": "Knowing a fact or a person. The past જાણ્યું (jāṇyum̐) means \"came to know\": a learner uses it for finding something out."
      },
      "examples": {
        "તે જવાબ જાણે છે.": {
          "native": "He knows the answer.",
          "bases": {
            "તે": "he; she; it",
            "જવાબ": "answer"
          }
        },
        "મેં તેનું નામ જાણ્યું.": {
          "native": "I came to know his name.",
          "bases": {
            "નામ": "name"
          }
        }
      }
    },
    "gu-4907": {
      "native": "to close; to be shut",
      "notes": {
        "n1": "The intransitive form: દરવાજો બંધ થયો (darvājo bandh thayo) (the door closed). For closing something with your hand, use બંધ કરવું (bandh karvum̐)."
      },
      "examples": {
        "બારણું બંધ થયું.": {
          "native": "The door closed.",
          "bases": {
            "બારણું": "door",
            "બંધ": "closed; shut"
          }
        },
        "દુકાન સાંજે બંધ થાય છે.": {
          "native": "The shop closes in the evening.",
          "bases": {
            "દુકાન": "shop",
            "સાંજે": "in the evening",
            "બંધ": "closed; shut"
          }
        }
      }
    },
    "gu-4908": {
      "native": "to open; to be opened",
      "notes": {
        "n1": "The intransitive form: દરવાજો ખૂલ્યો (darvājo khulyo) (the door opened). The transitive is ખોલવું (kholvum̐) (to open something)."
      },
      "examples": {
        "દરવાજો ખૂલ્યો.": {
          "native": "The door opened.",
          "bases": {
            "દરવાજો": "gate; door"
          }
        },
        "દુકાન સવારે ખૂલે છે.": {
          "native": "The shop opens in the morning.",
          "bases": {
            "દુકાન": "shop",
            "સવારે": "in the morning"
          }
        }
      }
    },
    "gu-4909": {
      "native": "to stand up; to get up",
      "notes": {
        "n1": "The stem is ઊભા (ubhā) (standing) with થવું (thavum̐). The one who stands is ઊભો (ubho) (masculine)."
      },
      "examples": {
        "તે ઊભો થયો.": {
          "native": "He stood up.",
          "bases": {
            "તે": "he; she; it",
            "ઊભો": "standing; upright"
          }
        },
        "બધા ઊભા થયા.": {
          "native": "Everyone stood up.",
          "bases": {
            "બધા": "all; everyone"
          }
        }
      },
      "bases": {
        "ઊભા": "standing; upright"
      }
    },
    "gu-4910": {
      "native": "to stand; to stop",
      "notes": {
        "n1": "Standing still, or stopping. The one who stands is ઊભો (ubho) (masculine) and રહ્યો (rahyo) for stayed."
      },
      "examples": {
        "તે ઊભો રહ્યો.": {
          "native": "He stood still.",
          "bases": {
            "તે": "he; she; it",
            "ઊભો": "standing; upright"
          }
        },
        "બસ અહીં ઊભી રહી.": {
          "native": "The bus stopped here.",
          "bases": {
            "બસ": "bus; enough",
            "અહીં": "here"
          }
        }
      },
      "bases": {
        "ઊભા": "standing; upright"
      }
    },
    "gu-4911": {
      "native": "to hide oneself",
      "notes": {
        "n1": "Hiding oneself, as a child hides in a game. Hiding something else is છુપાવવું (chupāvvum̐)."
      },
      "examples": {
        "તે ઝાડ પાછળ સંતાઈ ગયો.": {
          "native": "He hid behind the tree.",
          "bases": {
            "તે": "he; she; it",
            "ઝાડ": "tree",
            "પાછળ": "behind"
          }
        },
        "છોકરો પલંગ નીચે સંતાઈ ગયો.": {
          "native": "The boy hid under the bed.",
          "bases": {
            "છોકરો": "boy",
            "પલંગ": "bed",
            "નીચે": "down; below"
          }
        }
      }
    },
    "gu-4912": {
      "native": "to lose",
      "notes": {
        "n1": "Losing something you had, or a chance. For a lost object you cannot find, ખોવું (khovum) also works."
      },
      "examples": {
        "તેણે ચાવી ગુમાવી.": {
          "native": "He lost the key.",
          "bases": {
            "ચાવી": "key"
          }
        },
        "તેણે તક ગુમાવી.": {
          "native": "He lost the chance.",
          "bases": {
            "તક": "chance; opportunity"
          }
        }
      }
    },
    "gu-4913": {
      "native": "to get; to obtain",
      "notes": {
        "n1": "Getting something by effort or request: માહિતી મેળવવી (māhiti meḷvvi) (to get information)."
      },
      "examples": {
        "તેણે માહિતી મેળવી.": {
          "native": "He got the information.",
          "bases": {
            "માહિતી": "information"
          }
        },
        "તેણે ચાવી મેળવી.": {
          "native": "He got the key.",
          "bases": {
            "ચાવી": "key"
          }
        }
      }
    },
    "gu-4914": {
      "native": "to fight",
      "notes": {
        "n1": "A fight between people. For a verbal argument use ઝઘડવું (jhaghḍvum̐)."
      },
      "examples": {
        "બે ભાઈઓ લડ્યા.": {
          "native": "The two brothers fought.",
          "bases": {
            "બે": "two"
          }
        },
        "સૈનિકો દુશ્મન સાથે લડ્યા.": {
          "native": "The soldiers fought the enemy.",
          "bases": {
            "દુશ્મન": "enemy",
            "સાથે": "with; together"
          }
        }
      }
    },
    "gu-4915": {
      "native": "to be freed; to get free",
      "notes": {
        "n1": "Getting free from captivity, a trap or a duty. The past is છૂટ્યો (chuṭyo) (he got free)."
      },
      "examples": {
        "તે કેદમાંથી છૂટ્યો.": {
          "native": "He was freed from captivity.",
          "bases": {
            "તે": "he; she; it"
          }
        },
        "પંખી પિંજરામાંથી છૂટ્યું.": {
          "native": "The bird got out of the cage.",
          "bases": {
            "પંખી": "bird"
          }
        }
      }
    },
    "gu-4916": {
      "native": "to knock; to rattle",
      "notes": {
        "n1": "Knocking on a door: બારણું ખખડાવવું (bārṇum̐ khakhḍāvvum̐). The object comes before the verb."
      },
      "examples": {
        "તેણે બારણું ખખડાવ્યું.": {
          "native": "He knocked on the door.",
          "bases": {
            "બારણું": "door"
          }
        },
        "કોઈએ બારણું ખખડાવ્યું.": {
          "native": "Someone knocked on the door.",
          "bases": {
            "બારણું": "door"
          }
        }
      }
    },
    "gu-4917": {
      "native": "to steal",
      "notes": {
        "n1": "Stealing. The object is the thing taken: પૈસા ચોર્યા (paisā coryā) (they stole the money)."
      },
      "examples": {
        "કોઈએ પૈસા ચોર્યા.": {
          "native": "Someone stole the money.",
          "bases": {
            "પૈસા": "money"
          }
        },
        "ચોરે ઘરેણાં ચોર્યાં.": {
          "native": "The thief stole the jewellery.",
          "bases": {
            "ઘરેણાં": "jewellery"
          }
        }
      }
    },
    "gu-4918": {
      "native": "to set out; to come out",
      "notes": {
        "n1": "Leaving a place to go somewhere, or coming out of a place."
      },
      "examples": {
        "તે સવારે નીકળ્યો.": {
          "native": "He set out in the morning.",
          "bases": {
            "તે": "he; she; it",
            "સવારે": "in the morning"
          }
        },
        "પાણી નળમાંથી નીકળે છે.": {
          "native": "Water comes out of the tap.",
          "bases": {
            "પાણી": "water"
          }
        }
      }
    },
    "gu-4919": {
      "native": "to turn",
      "notes": {
        "n1": "A road, a person or the body turning. The past is વળ્યો (vaḷyo) (he turned)."
      },
      "examples": {
        "રસ્તો ડાબી તરફ વળ્યો.": {
          "native": "The road turned left.",
          "bases": {
            "રસ્તો": "road; the way",
            "ડાબી": "left",
            "તરફ": "towards"
          }
        },
        "તે પાછળ વળ્યો.": {
          "native": "He turned round.",
          "bases": {
            "તે": "he; she; it",
            "પાછળ": "behind"
          }
        }
      }
    },
    "gu-4920": {
      "native": "to push",
      "notes": {
        "n1": "A push given to a thing or a person. The thing pushed comes before the verb."
      },
      "examples": {
        "તેણે દરવાજો ધકેલ્યો.": {
          "native": "He pushed the door.",
          "bases": {
            "દરવાજો": "gate; door"
          }
        },
        "તેણે ગાડી ધકેલી.": {
          "native": "He pushed the car.",
          "bases": {
            "ગાડી": "car; a vehicle"
          }
        }
      }
    },
    "gu-4922": {
      "native": "to slip",
      "notes": {
        "n1": "Slipping on a smooth surface. The past is લપસ્યો (lapasyo) (he slipped)."
      },
      "examples": {
        "તે બરફ પર લપસ્યો.": {
          "native": "He slipped on the ice.",
          "bases": {
            "તે": "he; she; it",
            "બરફ": "ice; snow",
            "પર": "on; upon"
          }
        },
        "બાળક પાણીમાં લપસ્યું.": {
          "native": "The child slipped in the water.",
          "bases": {
            "બાળક": "child"
          }
        }
      }
    },
    "gu-4923": {
      "native": "to dig",
      "notes": {
        "n1": "Digging a hole or the ground. The thing dug, such as ખાડો (khāḍo) (a pit), comes before the verb."
      },
      "examples": {
        "તેમણે ખાડો ખોદ્યો.": {
          "native": "They dug a pit.",
          "bases": {
            "ખાડો": "pit; hole"
          }
        },
        "ખેડૂત ખેતરમાં ખોદે છે.": {
          "native": "The farmer digs in the field.",
          "bases": {
            "ખેડૂત": "farmer"
          }
        }
      }
    },
    "gu-4924": {
      "native": "to break; to snap",
      "notes": {
        "n1": "Something breaking, not someone breaking it on purpose. Breaking on purpose is તોડવું (toḍvum̐)."
      },
      "examples": {
        "પેન્સિલ તૂટી ગઈ.": {
          "native": "The pencil broke.",
          "bases": {
            "પેન્સિલ": "pencil"
          }
        },
        "દોરડું તૂટ્યું.": {
          "native": "The rope snapped.",
          "bases": {
            "દોરડું": "rope"
          }
        }
      }
    },
    "gu-4925": {
      "native": "to roll down",
      "notes": {
        "n1": "A round thing rolling down a slope."
      },
      "examples": {
        "પથ્થર ટેકરી પરથી ગબડ્યો.": {
          "native": "A stone rolled down the hill.",
          "bases": {
            "પથ્થર": "stone",
            "ટેકરી": "small hill"
          }
        },
        "દડો ઢાળ પરથી ગબડ્યો.": {
          "native": "The ball rolled down the slope.",
          "bases": {
            "દડો": "ball",
            "ઢાળ": "slope"
          }
        }
      }
    },
    "gu-4926": {
      "native": "to pierce",
      "notes": {
        "n1": "Piercing a thing right through, as an arrow pierces a shield."
      },
      "examples": {
        "તીરે ઢાલ વીંધી.": {
          "native": "The arrow pierced the shield.",
          "bases": {
            "ઢાલ": "shield"
          }
        },
        "સોય કપડું વીંધે છે.": {
          "native": "The needle pierces the cloth.",
          "bases": {
            "સોય": "needle",
            "કપડું": "cloth; a garment"
          }
        }
      }
    },
    "gu-4927": {
      "native": "to tear",
      "notes": {
