"cards":
  "gu-1634":
    "native": "My head is not well."
    "bases":
      "નથી": "to be"
    "confusables":
      "w1":
        "why": "આંખ (āṅkh) means eye, a different body part."
      "w2":
        "why": "કાન (kān) means ear; the sentence is about the head."
  "gu-1635":
    "native": "My eye is big."
    "bases":
      "છે": "to be"
    "confusables":
      "w1":
        "why": "માથું (māthum̐) means head, not the eye."
      "w2":
        "why": "કાન (kān) means ear, not the eye."
  "gu-1636":
    "native": "My teeth are white."
    "bases":
      "છે": "to be"
    "confusables":
      "w1":
        "why": "જીભ (jibh) means tongue, which is not a tooth."
      "w2":
        "why": "હોઠ (hoṭh) means lips, which are outside the teeth."
  "gu-1637":
    "native": "My arm is long."
    "bases":
      "મારો": "my"
      "છે": "to be"
    "confusables":
      "w1":
        "why": "પગ (pag) means leg or foot, not the arm."
      "w2":
        "why": "આંગળી (āṅgaḷi) means finger, a part of the hand."
  "gu-1638":
    "native": "My stomach is not well."
    "bases":
      "નથી": "to be"
    "confusables":
      "w1":
        "why": "છાતી (chāti) means chest, above the stomach."
      "w2":
        "why": "પીઠ (piṭh) means back."
  "gu-1639":
    "native": "My neck is short."
    "bases":
      "છે": "to be"
    "confusables":
      "w1":
        "why": "કોણી (koṇi) means elbow, a joint of the arm."
      "w2":
        "why": "ખભો (khabho) means shoulder, above the neck."
  "gu-1640":
    "native": "I am in a lot of pain."
    "bases":
      "થાય": "to happen; to become"
      "છે": "to be"
    "confusables":
      "w1":
        "why": "શરીર (śarir) means body, a general word."
      "w2":
        "why": "મગજ (magaj) means brain, a single organ."
  "gu-1641":
    "native": "My body is strong."
    "bases":
      "મજબૂત": "strong"
      "છે": "to be"
    "confusables":
      "w1":
        "why": "હૃદય (hruday) means heart, one organ of the body."
      "w2":
        "why": "હાડકું (hāḍkum̐) means bone, a part of the body."
