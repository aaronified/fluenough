    "gu-3816": {
      "native": "post office",
      "notes": {
        "n1": "The office where letters and parcels are sent. A box on the street for letters is a ટપાલપેટી (ṭapālpeṭi)."
      },
      "examples": {
        "ટપાલઘર ક્યાં છે?": {
          "native": "Where is the post office?",
          "bases": {
            "ટપાલઘર": "post office",
            "છે": "to be"
          }
        },
        "ટપાલઘર બંધ છે.": {
          "native": "The post office is closed.",
          "bases": {
            "ટપાલઘર": "post office",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3817": {
