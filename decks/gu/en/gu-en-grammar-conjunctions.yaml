schema: 1
id: "gu-en-grammar-conjunctions"
kind: "layer"
core: "gu-grammar-conjunctions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "And, but, because, if"
license: "CC0-1.0"
description: "The small words that join one idea to the next, and the pairs જો (jo) … તો (if … then) and જ્યારે (jyāre) … ત્યારે (when … then). Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0579":
    native: "and"
    notes:
      "n1": "મીના અને રમેશ (minā ane rameś), Meena and Ramesh."
  "gu-0055":
    notes:
      "n1": "Between two clauses, 'but': હું આવીશ (hum̐ āviś), પણ મોડો (paṇ moḍo), I'll come, but late. After a word, 'also; even'."
  "gu-0580":
    native: "or; that"
    notes:
      "n1": "ચા કે કૉફી (cā ke kôphi)? tea or coffee? It also joins 'that': મને લાગે છે કે (mane lāge che ke)..., I think that..."
  "gu-0581":
    native: "or (formal)"
    notes:
      "n1": "On forms and in writing; in speech, કે (ke)."
  "gu-0582":
    native: "because"
    notes:
      "n1": "Literally 'the reason that'."
    bases:
      "કારણ": "reason"
  "gu-0583":
    native: "so; that's why"
    notes:
      "n1": "It comes where English puts 'so': વરસાદ પડે છે (varsād paḍe che), એટલે હું ઘરે છું (eṭle hum̐ ghare chum̐), it's raining, so I'm at home."
  "gu-0584":
    native: "if"
    notes:
      "n1": "Usually paired with તો (to), 'then', in the second half. જો (jo) is also 'look!', from જોવું (jovum̐)."
  "gu-0585":
    native: "If it rains, I won't come."
    notes:
      "n1": "Gujarati puts the 'if' half in the future too: 'if rain will fall'."
    bases:
      "વરસાદ": "rain"
      "પડશે": "to fall; to have to"
      "તો": "then"
      "હું": "I"
      "નહીં": "no; not"
  "gu-0586":
    native: "When I come, we'll talk."
    notes:
      "n1": "જ્યારે (jyāre), 'when', is answered by ત્યારે (tyāre), 'then'. The question 'when?' is ક્યારે (kyāre)."
    bases:
      "જ્યારે": "when"
      "હું": "I"
      "ત્યારે": "then"
      "વાત": "talk; matter"
      "કરીશું": "to do; to make"
  "gu-0587":
    native: "otherwise; or else"
    notes:
      "n1": "જલદી ચાલો (jaldi cālo), નહીંતર બસ જતી રહેશે (nahintar bas jati raheśe), hurry, or the bus will go."
  "gu-0588":
    native: "even so; still"
