schema: 1
id: "gu-en-script-conjuncts"
kind: "layer"
core: "gu-script-conjuncts"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Gujarati conjuncts"
license: "CC0-1.0"
description: "Two consonants with no vowel between them join: the first is usually written as a half letter, without its upright stroke. Some stack, and a few join in shapes of their own. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0084":
    native: "k + sh (ksh)"
    notes:
      "n1": "Its own shape, nothing like its parts. Gujarati lists it at the end of the consonants: પરીક્ષા (parikśā, exam)."
  "gu-0085":
    native: "j + ny, said gn"
    notes:
      "n1": "Its own shape. Gujarati says it 'gn', where Hindi says 'gy': જ્ઞાન (gnān, knowledge)."
  "gu-0086":
    native: "t + r (tr)"
    notes:
      "n1": "Its own shape, ત (ta) joined with ર (ra): મિત્ર (mitra, friend), ત્રણ (traṇ, three)."
  "gu-0087":
    native: "sh + r (shr)"
    notes:
      "n1": "Its own shape: શ્રી (śri, Mr), before a man's name."
  "gu-0088":
    native: "d + r (dr)"
    notes:
      "n1": "The r is a small stroke at the foot of દ (da): દ્રાક્ષ (drākś, grapes)."
  "gu-0089":
    native: "p + r (the r stroke)"
    notes:
      "n1": "A ર (ra) after a consonant is a small slanting stroke at its foot: પ્રેમ (prem, love)."
  "gu-0090":
    native: "k + r (kr)"
    notes:
      "n1": "The r stroke at the foot of ક (ka): ક્રિકેટ (krikeṭ, cricket)."
  "gu-0091":
    native: "curled-back t + r"
    notes:
      "n1": "After ટ (ṭa), ર (ra) is a small caret below: ટ્રેન (ṭren, train)."
  "gu-0092":
    native: "r + m (the r hook above)"
    notes:
      "n1": "A ર (ra) before another consonant is a small hook on top of that consonant: ધર્મ (dharm, religion)."
  "gu-0093":
    native: "r + y (the r hook above)"
    notes:
      "n1": "The hook again, here on ય (ya): સૂર્ય (surya, the sun)."
  "gu-0094":
    native: "s + t (half સ (sa))"
    notes:
      "n1": "સ (sa) loses its upright stroke and joins ત (ta): રસ્તો (rasto, road), નાસ્તો (nāsto, breakfast)."
  "gu-0095":
    native: "s + curled-back t"
    notes:
      "n1": "In English words: સ્ટેશન (sṭeśan, station)."
  "gu-0096":
    native: "s + v (sv)"
    notes:
      "n1": "Half સ (sa) joined to વ (va): સ્વાદ (svād, taste)."
  "gu-0097":
    native: "t + y (ty)"
    notes:
      "n1": "Half ત (ta) joined to ય (ya): ત્યાં (tyām̐, there)."
  "gu-0098":
    native: "p + y (py)"
    notes:
      "n1": "Half પ (pa) joined to ય (ya): પ્યાલો (pyālo, cup)."
  "gu-0099":
    native: "n + y (ny)"
    notes:
      "n1": "Half ન (na) joined to ય (ya): ધન્યવાદ (dhanyavād, thank you)."
  "gu-0100":
    native: "d + y (dy)"
    notes:
      "n1": "The y is joined below or beside દ (da), depending on the font: વિદ્યાર્થી (vidyārthi, student)."
  "gu-0101":
    native: "k + t (kt)"
    notes:
      "n1": "ક (ka) drops the hook on its right and joins ત (ta): ફક્ત (phakt, only)."
  "gu-0102":
    native: "d + dh (stacked)"
    notes:
      "n1": "દ (da) has no upright stroke to drop, so ધ (dha) is written below it: બુદ્ધિ (buddhi, intelligence)."
  "gu-0103":
    native: "t + t (half ત (ta))"
    notes:
      "n1": "Half ત (ta) joined to ત (ta): સત્તર (sattar, seventeen). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "gu-0104":
    native: "k + k (half ક (ka))"
    notes:
      "n1": "The first ક (ka) drops its hook: ચોક્કસ (cokkas, certainly). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "gu-0105":
    native: "ch + chh (half ચ (ca))"
    notes:
      "n1": "Half ચ (ca) joined to છ (cha): ઇચ્છા (icchā, wish). Said on its own, it sounds like છ (cha), so it is drilled by reading and writing only."
  "gu-0106":
    native: "th + th, curled back (stacked)"
    notes:
      "n1": "ઠ (ṭha) written below ઠ (ṭha): ચિઠ્ઠી (ciṭṭhi, a note; a letter), અઠ્ઠાવીસ (aṭṭhāvis, 28). Said on its own, it sounds like ઠ (ṭha), so it is drilled by reading and writing only."
  "gu-0107":
    native: "n + n (half ન (na))"
    notes:
      "n1": "Half ન (na) joined to ન (na): છન્નું (channum̐, 96). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
