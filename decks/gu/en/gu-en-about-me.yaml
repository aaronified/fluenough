schema: 1
id: "gu-en-about-me"
kind: "layer"
core: "gu-about-me"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "About me"
license: "CC0-1.0"
description: "Your name, where you are from, where you live, what you do, and the questions people will ask you first. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0319":
    native: "name"
  "gu-0320":
    native: "I'm from London. (a man)"
    notes:
      "n1": "Literally 'I have come from London'. A woman says આવી છું (āvi chum̐)."
  "gu-0321":
    native: "I live in Ahmedabad."
    notes:
      "n1": "રહેવું (rahevum̐) is to live, to stay."
  "gu-0322":
    native: "I am a teacher."
    notes:
      "n1": "A woman teacher is શિક્ષિકા (śikśikā)."
  "gu-0323":
    native: "I am thirty years old."
    notes:
      "n1": "Literally 'my age is thirty years'. Also હું ત્રીસ વર્ષનો છું (a man), વર્ષની છું (a woman)."
  "gu-0324":
    native: "age"
  "gu-0325":
    native: "I'm married. (a man)"
    notes:
      "n1": "A woman says પરણેલી છું (parṇeli chum̐)."
  "gu-0326":
    native: "I'm vegetarian."
    notes:
      "n1": "Much of Gujarat is vegetarian, and many people eat no eggs either. Some eat no onion or garlic."
  "gu-0327":
    native: "I speak English."
  "gu-0328":
    native: "I know a little Gujarati."
    notes:
      "n1": "Literally 'a little Gujarati comes to me'."
  "gu-0329":
    native: "country"
  "gu-0330":
    native: "I'm here on holiday. (a man)"
    notes:
      "n1": "ફરવું (pharvum̐) is to go around, to travel for pleasure. A woman says આવી છું (āvi chum̐)."
