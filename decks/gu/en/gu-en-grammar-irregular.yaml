  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "javun": "to go"
    "karvun": "to do"
    "levun": "to take"
    "devun": "to give"
    "khaavun": "to eat"
    "piivun": "to drink"
    "besvun": "to sit"
    "kahevun": "to say; to tell"
    "thavun": "to become; to happen"
    "suuvun": "to sleep; to lie down"
  notes: "A regular verb makes its past with -યું (-yum̐) on the stem: બોલવું (bolvum̐), બોલ્યું (bolyum̐); આવવું (āvvum̐), આવ્યું (āvyum̐). These, among the most used verbs, don't: જવું (javum̐) gives ગયું (gayum̐), લેવું લીધું (levum̐ lidhum̐), ખાવું ખાધું (khāvum̐ khādhum̐). Their future and request are regular. The past here is neuter; it agrees as usual: ગયો (gayo), ગઈ (gai), ગયું (gayum̐)."
