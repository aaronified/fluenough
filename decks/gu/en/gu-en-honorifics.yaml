{
  "schema": 1,
  "id": "gu-en-honorifics",
  "kind": "layer",
  "core": "gu-honorifics",
  "native": {
    "code": "en",
    "iso639_3": "eng",
    "name": "English"
  },
  "name": "Honorific and polite words",
  "license": "CC-BY-SA-4.0",
  "description": "Words of respect for an elder, a guest or a person of rank: polite verbs, a polite title and polite words. Not yet checked by a Gujarati speaker: please report any mistake.",
  "cards": {
    "gu-5212": {
      "native": "to come (honorific); to visit",
      "notes": {
        "n1": "A polite word for coming or visiting, used for a guest or an elder. The everyday word is આવવું (āvvum̐) (to come)."
      },
      "examples": {
        "આપ અમારે ઘરે પધારો.": {
          "native": "Please come to our home.",
          "bases": {
            "આપ": "you (polite)"
          }
        },
        "મહેમાન પધાર્યા.": {
          "native": "The guest has arrived.",
          "bases": {
            "મહેમાન": "guest"
          }
        }
      }
    },
    "gu-5213": {
      "native": "to sit (honorific)",
      "notes": {
        "n1": "A polite word for sitting, used for an elder or a respected person. The everyday word is બેસવું (besvum̐) (to sit)."
      },
      "examples": {
        "દાદાજી ખુરશી પર બિરાજ્યા.": {
          "native": "Grandfather sat down on the chair.",
          "bases": {
            "દાદાજી": "grandfather (respectful)",
            "ખુરશી": "chair",
            "પર": "on"
          }
        },
        "આવો, ગાદી પર બિરાજો.": {
          "native": "Come, please sit on the cushion.",
          "bases": {
            "ગાદી": "cushion",
            "પર": "on"
          }
        }
      }
    },
    "gu-5214": {
      "native": "to say (honorific)",
      "notes": {
        "n1": "A polite word for saying, used for what an elder, a guest or a person of rank says. The everyday word is કહેવું (kahevum̐) (to say)."
      },
      "examples": {
        "આપ શું ફરમાવો છો?": {
          "native": "What would you like to say?",
          "bases": {
            "આપ": "you (polite)",
            "શું": "what"
          }
        },
        "સાહેબે કંઈક ફરમાવ્યું.": {
          "native": "The gentleman said something.",
          "bases": {
            "કંઈક": "something"
          }
        }
      }
    },
    "gu-5215": {
      "native": "to eat (honorific)",
      "notes": {
        "n1": "A polite word for eating, used for a guest or an elder. The everyday word is ખાવું (khāvum̐) (to eat)."
      },
      "examples": {
        "આપ ભોજન આરોગો.": {
          "native": "Please have your meal.",
          "bases": {
            "આપ": "you (polite)",
            "ભોજન": "meal"
          }
        },
        "બધાએ પ્રેમથી આરોગ્યું.": {
          "native": "Everyone ate with love.",
          "bases": {
            "પ્રેમથી": "with love"
          }
        }
      }
    },
    "gu-5216": {
      "native": "Mr; sir (a title before a man's name)",
      "notes": {
        "n1": "The polite title for a man, written before his name, like Mr. For a woman, use શ્રીમતી (śrimti) (Mrs.)."
      },
      "examples": {
        "શ્રીમાન શાહ આવ્યા છે.": {
          "native": "Mr Shah has come.",
          "bases": {
            "શ્રીમાન": "Mr",
            "શાહ": "Shah (a surname)"
          }
        },
        "શ્રીમાન પટેલ બેઠકમાં હતા.": {
          "native": "Mr Patel was at the meeting.",
          "bases": {
            "શ્રીમાન": "Mr",
            "પટેલ": "Patel (a surname)"
          }
        }
      }
    },
    "gu-5217": {
      "native": "your (polite)",
      "notes": {
        "n1": "The polite word for 'your', used when speaking to an elder or a guest. It is also written આપની (āpni) before a feminine noun."
      },
      "examples": {
        "આપનું નામ શું છે?": {
          "native": "What is your name?",
          "bases": {
            "આપનું": "your (polite)",
            "નામ": "name",
            "શું": "what"
          }
        },
        "આપનું ઘર સુંદર છે.": {
          "native": "Your house is beautiful.",
          "bases": {
            "આપનું": "your (polite)",
            "ઘર": "house; home",
            "સુંદર": "beautiful"
          }
        }
      }
    },
    "gu-5218": {
      "native": "kindness; favour",
      "notes": {
        "n1": "મહેરબાની (maherbāni) is kindness or a favour. With કરીને (karine) (doing) it becomes a polite 'please'."
      },
      "examples": {
        "મહેરબાની કરીને અંદર આવો.": {
          "native": "Please come in.",
          "bases": {
            "મહેરબાની": "kindness; favour",
            "અંદર": "inside"
          }
        },
        "આપની મહેરબાની.": {
          "native": "Thank you for your kindness.",
          "bases": {
            "મહેરબાની": "kindness; favour"
          }
        }
      }
    }
  }
}
