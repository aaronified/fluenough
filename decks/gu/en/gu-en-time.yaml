schema: 1
id: "gu-en-time"
kind: "layer"
core: "gu-time"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Time and days"
license: "CC0-1.0"
description: "Telling the time, the parts of the day, today and the one word for yesterday and tomorrow, and the days of the week. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0477":
    native: "What time is it?"
    notes:
      "n1": "Literally 'how many have struck?'."
  "gu-0478":
    native: "It's five o'clock."
    notes:
      "n1": "Half past five is સાડા પાંચ (sāḍā pāñc); a quarter past, સવા પાંચ (savā pāñc); a quarter to, પોણા પાંચ (poṇā pāñc). One o'clock is એક વાગ્યો (ek vāgyo)."
  "gu-0479":
    native: "at seven o'clock"
    notes:
      "n1": "-વાગ્યે (vāgye) is 'at' a time."
  "gu-0480":
    native: "hour"
    notes:
      "n1": "અડધો કલાક (aḍadho kalāk), half an hour."
  "gu-0481":
    native: "minute"
    notes:
      "n1": "એક મિનિટ! (ek minit!), just a minute!"
  "gu-0482":
    native: "today"
  "gu-0483":
    native: "yesterday; tomorrow"
    notes:
      "n1": "One word for both: the verb's tense tells which. To be clear, say ગઈ કાલે (gai kāle), yesterday, or આવતી કાલે (āvti kāle), tomorrow."
  "gu-0484":
    native: "now"
  "gu-0485":
    native: "just now; in a moment"
    notes:
      "n1": "Both a moment ago and a moment from now: હમણાં આવું છું (hamṇām̐ āvum̐ chum̐), I'll be right there."
  "gu-0486":
    native: "morning"
    notes:
      "n1": "સવારે (savāre), in the morning."
  "gu-0487":
    native: "midday; early afternoon"
    notes:
      "n1": "બપોરે (bapore), at midday. In some towns, Rajkot most famously, shops close for a while after the midday meal."
  "gu-0488":
    native: "evening"
    notes:
      "n1": "સાંજે (sāñje), in the evening."
  "gu-0489":
    native: "night"
    notes:
      "n1": "રાત્રે (rātre), at night."
  "gu-0490":
    native: "day"
  "gu-0491":
    native: "week"
  "gu-0492":
    native: "late"
    notes:
      "n1": "મોડું થયું (moḍum̐ thayum̐), it's late; I'm late. Don't mix it with મોટું (moṭum̐), big."
  "gu-0493":
    native: "early"
    notes:
      "n1": "વહેલા આવજો (vahelā āvjo), come early."
  "gu-0494":
    native: "Monday"
    notes:
      "n1": "Every day ends in -વાર (-vār), 'day'. સોમ (som) is the moon."
  "gu-0495":
    native: "Tuesday"
    notes:
      "n1": "મંગળ (maṅgaḷ) is Mars."
  "gu-0496":
    native: "Wednesday"
    notes:
      "n1": "બુધ (budh) is Mercury."
  "gu-0497":
    native: "Thursday"
    notes:
      "n1": "ગુરુ (guru) is Jupiter."
  "gu-0498":
    native: "Friday"
    notes:
      "n1": "શુક્ર (śukr) is Venus."
  "gu-0499":
    native: "Saturday"
    notes:
      "n1": "શનિ (śani) is Saturn."
  "gu-0500":
    native: "Sunday"
    notes:
      "n1": "રવિ (ravi) is the sun."
