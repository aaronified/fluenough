"id": "gu-en-food-sentences"
"kind": "layer"
"core": "gu-food-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Food sentences"
"license": "CC-BY-SA-4.0"
"description": "Short sentences with the food words: this is, I like, eat, and the list of a meal. Not yet checked by a Gujarati speaker: please report any mistake."
"tags":
- "unreviewed"
"cards":
  "gu-1428":
    "native": "This is a sweet."
    "notes":
      "n1": "આ (ā) is \"this\" and comes first; છે (che) is \"is\" and comes at the end."
    "bases":
      "આ": "this"
      "છે": "is"
    "confusables":
      "c1":
        "why": "જલેબી (jalebi) is a sweet too, but this sentence names sweets in general."
      "c2":
        "why": "ખીર (khir) is a sweet too, but this sentence does not name one."
  "gu-1429":
    "native": "I like lemon water."
    "notes":
      "n1": "The thing liked comes before ગમે (game); મને (mane) is \"to me\", so the sentence says the lemon water pleases me."
    "bases":
      "મને": "to me"
      "ગમે": "like"
      "છે": "is"
    "confusables":
      "c1":
        "why": "લસ્સી (lassi) is a drink too, but this sentence names lemon water."
      "c2":
        "why": "ચા (cā) is a drink too, but this sentence names lemon water."
  "gu-1430":
    "native": "Eat dal and rice."
    "notes":
      "n1": "A polite command: the verb ખાઓ (khāo) comes last."
    "bases":
      "અને": "and"
      "ખાઓ": "eat (polite)"
    "confusables":
      "c1":
        "why": "રોટલી (roṭli) is bread, not rice."
      "c2":
        "why": "પૂરી (puri) is fried bread, not rice."
  "gu-1431":
    "native": "Carrot and cabbage together make a vegetable dish."
    "notes":
      "n1": "The verb છે (che) comes last, after the subject and the list joined by અને (ane)."
    "bases":
      "અને": "and"
      "છે": "are"
    "confusables":
      "c1":
        "why": "મરચું (marcum̐) is a chilli, not a vegetable dish."
      "c2":
        "why": "સફરજન (safarjan) is a fruit, not a vegetable dish."
  "gu-1432":
    "native": "The lemon lassi is good."
    "notes":
      "n1": "સારી (sāri) takes the feminine form because લસ્સી (lassi) is feminine."
    "bases":
      "સારી": "good"
      "છે": "is"
    "confusables":
      "c1":
        "why": "ચા (cā) is tea, not a lassi."
      "c2":
        "why": "છાશ (chāś) is buttermilk, a different drink."
  "gu-1433":
    "native": "I eat kheer."
    "notes":
      "n1": "The verb ખાઉં (khāum̐) comes before છું (chum), the ending for I."
    "bases":
      "હું": "I"
      "ખાઉં": "eat"
      "છું": "am"
    "confusables":
      "c1":
        "why": "જલેબી (jalebi) is a sweet too, but this sentence names kheer."
      "c2":
        "why": "ઈડલી (iḍli) is a savoury cake, not a sweet."
