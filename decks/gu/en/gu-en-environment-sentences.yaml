  "cards": {
    "gu-4125": {
      "native": "The air in the city is not clean.",
      "bases": {
        "શહેરમાં": "in the city",
        "નથી": "is not"
      },
      "confusables": {
        "c1": {
          "why": "ગંદકી (gandki) is dirt on the ground, not the air."
        },
        "c2": {
          "why": "ધુમાડો (dhumāḍo) is smoke, which makes the air dirty."
        }
      }
    },
    "gu-4126": {
      "native": "Recycle the paper.",
      "bases": {
        "રિસાઇકલ": "recycle (stem)",
        "કરો": "do (polite or plural)"
      },
      "confusables": {
        "c1": {
          "why": "કાચ (kāc) is glass, another thing to recycle."
        },
        "c2": {
          "why": "બોટલ (boṭal) is a bottle, which is also recycled."
        }
      }
    },
    "gu-4127": {
      "native": "It is necessary to save the forest.",
      "bases": {
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "વૃક્ષ (vrukś) is a single tree, part of a forest."
        },
        "c2": {
          "why": "પ્રાણી (prāṇi) is an animal, which also lives in a forest."
        }
      }
    },
    "gu-4128": {
      "native": "After the rain the river filled up.",
      "bases": {
        "ભરાઈ": "filled up (feminine)",
        "ગઈ": "went (feminine)"
      },
      "confusables": {
        "c1": {
          "why": "તળાવ (taḷāv) is a lake, not a river."
        },
        "c2": {
          "why": "સમુદ્ર (samudra) is the sea, which is salt water."
        }
      }
    },
    "gu-4129": {
      "native": "Drink more water in the heat.",
      "bases": {
        "ગરમીમાં": "in the heat"
      },
      "confusables": {
        "c1": {
          "why": "ઠંડી (ṭhaṇḍi) is cold, the opposite of heat."
        },
        "c2": {
          "why": "પવન (pavan) is wind, which is not heat."
        }
      }
    },
    "gu-4130": {
      "native": "Trees die from poisonous smoke.",
      "bases": {
        "ઝેરી": "poisonous",
        "ધુમાડાથી": "by the smoke",
        "મરે": "dies",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "ઝેર (jher) is poison, the thing in the smoke."
        },
        "c2": {
          "why": "ભૂકંપ (bhukamp) is an earthquake, a different disaster."
        }
      }
    },
    "gu-4131": {
      "native": "Do not throw rubbish outside.",
      "bases": {
        "ફેંકો": "throw"
      },
      "confusables": {
        "c1": {
          "why": "થેલી (theli) is a bag, which can hold rubbish."
        },
        "c2": {
          "why": "બોટલ (boṭal) is a bottle, which can also be thrown out."
        }
      }
    },
    "gu-4132": {
      "native": "The season changed and a flood came.",
      "bases": {
        "બદલાઈ": "changed (feminine)",
        "આવ્યું": "came (neuter)"
      },
      "confusables": {
        "c1": {
          "why": "દુષ્કાળ (duśkāḷ) is drought, the opposite of a flood."
        },
        "c2": {
          "why": "ગરમી (garmi) is heat, a different weather."
        }
      }
    },
    "gu-4133": {
      "native": "Clean the soil in the garden.",
      "bases": {
        "બગીચામાં": "in the garden",
        "કરો": "do (polite or plural)"
      },
      "confusables": {
        "c1": {
          "why": "બગીચો (bagico) is the garden itself."
        },
        "c2": {
          "why": "કાગળ (kāgaḷ) is paper, not soil."
        }
      }
    },
    "gu-4134": {
      "native": "Do not drink dirty water.",
      "bases": {
        "નહીં": "not"
      },
      "confusables": {
        "c1": {
          "why": "સાફ (sāph) is clean, the opposite of dirty."
        },
        "c2": {
          "why": "વીજળી (vijaḷi) is electricity, which is not water."
        }
      }
    }
  }
