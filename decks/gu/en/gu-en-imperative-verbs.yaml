"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Verbs for commands"
"license": "CC-BY-SA-4.0"
"description": "Sit, open and do: three verbs that the imperatives unit needs and no earlier deck teaches. Not yet checked by a Gujarati speaker: please report any mistake."
"tags":
- "unreviewed"
"cards":
  "gu-1400":
    "native": "to sit"
    "notes":
      "n1": "The polite command is બેસો (beso); the informal one is બેસ (bes)."
    "examples":
      "અહીં બેસો.":
        "native": "Sit here."
        "bases":
          "અહીં": "here"
          "બેસો": "sit (polite)"
      "હું ખુરશી પર બેસું છું.":
        "native": "I am sitting on a chair."
        "bases":
          "હું": "I"
          "ખુરશી": "chair"
          "પર": "on"
          "બેસું": "sit"
          "છું": "am"
  "gu-1401":
    "native": "to open"
    "notes":
      "n1": "The polite command is ખોલો (kholo); the informal one is ખોલ (khol)."
    "examples":
      "દરવાજો ખોલો.":
        "native": "Open the door."
        "bases":
          "દરવાજો": "door"
          "ખોલો": "open (polite)"
      "બારી ખોલ.":
        "native": "Open the window."
        "bases":
          "બારી": "window"
          "ખોલ": "open"
  "gu-1402":
    "native": "to do"
    "notes":
      "n1": "The polite command is કરો (karo); the informal one is કર (kar). શું (śum̐) is what."
    "examples":
      "શું કરો છો?":
        "native": "What are you doing?"
        "bases":
          "શું": "what"
          "કરો": "do (polite)"
          "છો": "are"
      "કામ કરો.":
        "native": "Do the work."
        "bases":
          "કામ": "work"
          "કરો": "do (polite)"
