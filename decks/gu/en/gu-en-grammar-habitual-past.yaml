  notes: "The doer stays in the nominative, and the verb and the helper હતો (hato) agree with the doer, not with the object: હું ચા પીતો હતો (hum̐ cā pito hato), I used to drink tea (m), and હું ચા પીતી હતી (hum̐ cā piti hati), I used to drink tea (f). The helper is the past of હોવું (hovum̐): હતો (hato) for m, હતી (hati) for f, હતું (hatum̐) for n, હતા (hatā) for m plural, and હતાં (hatām̐) for mixed plural or a woman spoken of with respect."
