name: "Habitual past: used to"
license: "CC-BY-SA-4.0"
description: "I used to go, she used to sit: what someone did often, or over a time, in the past. The verb takes તો (to) for m, તી (ti) for f, તું (tum̐) for n, તા (tā) for m plural and તાં (tām̐) for mixed plural, and the helper is the past of હોવું (hovum̐). Not yet checked by a Gujarati speaker: please report any mistake."
tags: ["unreviewed"]
