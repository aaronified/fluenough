  "description": "Sentences about art, music, dance, painting and the stage. Not yet checked by a Gujarati speaker: please report any mistake.",
  "cards": {
    "gu-4369": {
      "native": "This artist draws a beautiful picture.",
      "bases": {
        "આ": "this",
        "દોરે": "draws",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "ચિત્રકાર (citrakār) (painter) is a person, not the act of drawing."
        },
        "c2": {
          "why": "ગાયક (gāyak) (singer) is someone who sings, not someone who draws."
        }
      }
    },
    "gu-4370": {
      "native": "The singer sings a nice song.",
      "bases": {
        "ગાય": "sings",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "કવિતા (kavitā) (poem) is written and read, not sung."
        },
        "c2": {
          "why": "નૃત્ય (nrutya) (dance) is danced, not sung."
        }
      }
    },
    "gu-4371": {
      "native": "The dancer dances on the stage.",
      "bases": {
        "પર": "on; at",
        "નાચે": "dances",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "કલાકાર (kalākār) (artist) is the general word; this sentence is about dancing."
        },
        "c2": {
          "why": "સંગીતકાર (saṅgitakār) (musician) makes music, but does not dance."
        }
      }
    },
    "gu-4372": {
      "native": "The flute sounds very beautiful.",
      "bases": {
        "વાગે": "sounds",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "વાદ્ય (vādya) (instrument) is the class of things a flute belongs to."
        },
        "c2": {
          "why": "સંગીત (saṅgit) (music) is what the flute makes, not the flute."
        }
      }
    },
    "gu-4373": {
      "native": "There are many artworks in the exhibition.",
      "bases": {
        "પ્રદર્શનમાં": "in the exhibition",
        "ઘણી": "many",
        "કલાકૃતિઓ": "artworks",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "સંગ્રહાલય (saṅgrahālay) (museum) is a permanent place, not a temporary show."
        },
        "c2": {
          "why": "ચિત્ર (citra) (picture) is one kind of artwork, not the whole group."
        }
      }
    },
    "gu-4374": {
      "native": "The gallery is closed today.",
      "bases": {
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "સંગ્રહાલય (saṅgrahālay) (museum) is another place that shows art."
        },
        "c2": {
          "why": "દોરવું (dorvum) (to draw) is an action, not a place."
        }
      }
    },
    "gu-4375": {
      "native": "She is learning embroidery.",
      "bases": {
        "તે": "she",
        "શીખે": "learns",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "શીખવવું (śikhvvum̐) (to teach) is the other side of learning."
        },
        "c2": {
          "why": "દોરવું (dorvum) (to draw) is another craft, not embroidery."
        }
      }
    },
    "gu-4376": {
      "native": "The sculpture is made of stone.",
      "bases": {
        "પથ્થરનું": "of stone",
        "બનેલું": "made",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "બનાવવું (banāvvum̐) (to make) is the verb for making, not what a thing is made of."
        },
        "c2": {
          "why": "ચિત્ર (citra) (picture) is flat, not carved."
        }
      }
    },
    "gu-4377": {
      "native": "This picture has many colours.",
      "bases": {
        "આ": "this",
        "ચિત્રમાં": "in the picture",
        "ઘણા": "many",
        "રંગો": "colours",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "ચિત્રકામ (citrakām) (drawing; painting as an art) is the art, not one picture."
        },
        "c2": {
          "why": "દોરવું (dorvum) (to draw) is the action; this sentence is about colours."
        }
      }
    },
    "gu-4378": {
      "native": "The statue is in the temple.",
      "bases": {
        "મંદિરમાં": "in the temple",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "પૂજા (pujā) (worship) is what people do in a temple, not a thing."
        },
        "c2": {
          "why": "ગુફા (guphā) (cave) is another place, not a temple."
        }
      }
    },
    "gu-4379": {
      "native": "The poet writes a new poem.",
      "bases": {
        "નવી": "new",
        "લખે": "writes",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "ગીત (git) (song) is sung; a poem is written."
        },
        "c2": {
          "why": "વાર્તા (vārtā) (story) is also written, but it is a tale, not a poem."
        }
      }
    },
    "gu-4380": {
      "native": "The singer sings on the big stage.",
      "bases": {
        "મોટા": "big",
        "પર": "on; at",
        "ગાય": "sings",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "કલાકાર (kalākār) (artist) is wider than a singer."
        },
        "c2": {
          "why": "સંગીતકાર (saṅgitakār) (musician) makes music; a singer sings it."
        }
      }
    },
    "gu-4381": {
      "native": "I like listening to music.",
      "bases": {
        "ગમે": "is liked",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "વાદ્ય (vādya) (instrument) is what makes music, not the sound."
        },
        "c2": {
          "why": "શીખવું (śikhvum̐) (to learn) is not the same as listening."
        }
      }
    },
    "gu-4382": {
      "native": "The play was very long.",
      "bases": {
        "લાંબું": "long",
        "હતું": "was"
      },
      "confusables": {
        "c1": {
          "why": "કવિતા (kavitā) (poem) is short and read; a play is performed."
        },
        "c2": {
          "why": "વાર્તા (vārtā) (story) is told, not acted."
        }
      }
    },
    "gu-4383": {
      "native": "The song is nice, but the tune is wrong.",
      "bases": {
        "છે": "is",
        "પણ": "but",
        "ખોટો": "wrong"
      },
      "confusables": {
        "c1": {
          "why": "સંગીત (saṅgit) (music) is the whole art; this is about one tune."
        },
        "c2": {
          "why": "ગાયક (gāyak) (singer) is a person who would sing the tune."
        }
      }
    },
    "gu-4384": {
      "native": "The actress acts in many plays.",
      "bases": {
        "ઘણાં": "in many",
        "નાટકોમાં": "in plays",
        "કરે": "works",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "કલાકાર (kalākār) (artist) is the general word for anyone who makes art."
        },
        "c2": {
          "why": "સંગીતકાર (saṅgitakār) (musician) makes music, not plays."
        }
      }
    }
  }
}
