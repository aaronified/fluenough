schema: 1
id: "gu-en-script-consonants"
kind: "layer"
core: "gu-script-consonants"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Gujarati consonants"
license: "CC0-1.0"
description: "Every consonant a beginner meets, each carrying its vowel a: the plain and breathy ones, the ones on the teeth and curled back, and the two n's and two l's. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0014":
    native: "k (ka)"
    notes:
      "n1": "Like the 'k' of 'skin', with no puff of breath. Every consonant carries the short a (અ) unless a sign changes it. કમળ (kamaḷ, lotus)."
  "gu-0015":
    native: "kh, with a breath (kha)"
    notes:
      "n1": "ક (ka) with a puff of breath after it: ખેતર (khetar, field). Its shape is unlike Devanagari ख (kha)."
  "gu-0016":
    native: "g (ga)"
    notes:
      "n1": "Like the 'g' of 'go': ગાય (gāy, cow)."
  "gu-0017":
    native: "gh, with a breath (gha)"
    notes:
      "n1": "ગ (ga) with a breath after it: ઘર (ghar, house)."
  "gu-0018":
    native: "ng (as in 'sing')"
    notes:
      "n1": "Rare: Gujarati writes the dot ં (am̐) in its place. Hardly ever heard on its own, so it is drilled by reading and writing only."
  "gu-0019":
    native: "ch (ca)"
    notes:
      "n1": "Like the 'ch' of 'church', with no puff of breath: ચા (cā, tea)."
  "gu-0020":
    native: "chh, with a breath (cha)"
    notes:
      "n1": "ચ (ca) with a breath after it: છત્રી (chatri, umbrella). On its own, છ (cha) is also the number six, and છે (che) is 'is'."
  "gu-0021":
    native: "j (ja)"
    notes:
      "n1": "Like the 'j' of 'judge': જમવું (jamvum̐, to have a meal). Its shape is Gujarati's own."
  "gu-0022":
    native: "jh, with a breath (jha)"
    notes:
      "n1": "જ (ja) with a breath after it: ઝાડ (jhāḍ, tree). Many speakers say it close to an English z."
  "gu-0023":
    native: "ny (in conjuncts)"
    notes:
      "n1": "Seen almost only inside the join જ્ઞ (gna). Hardly ever heard on its own, so it is drilled by reading and writing only."
  "gu-0024":
    native: "t, curled back (ṭa)"
    notes:
      "n1": "The tongue curled back to touch the roof of the mouth: ટામેટું (ṭāmeṭum̐, tomato). The English t is close to it."
  "gu-0025":
    native: "th, curled back, with a breath (ṭha)"
    notes:
      "n1": "ટ (ṭa) with a breath after it: ઠંડી (ṭhaṇḍi, cold weather)."
  "gu-0026":
    native: "d, curled back (ḍa)"
    notes:
      "n1": "The tongue curled back: ડુંગળી (ḍuṅgḷi, onion). The English d is close to it."
  "gu-0027":
    native: "dh, curled back, with a breath (ḍha)"
    notes:
      "n1": "ડ (ḍa) with a breath after it: ઢોલ (ḍhol, drum)."
  "gu-0028":
    native: "n, curled back (ṇa)"
    notes:
      "n1": "An n with the tongue curled back. No word starts with it, but it is everywhere inside words: પાણી (pāṇi, water)."
  "gu-0029":
    native: "t, on the teeth (ta)"
    notes:
      "n1": "The tongue touches the back of the top teeth, softer than English t: તરબૂચ (tarbuc, watermelon)."
  "gu-0030":
    native: "th, on the teeth, with a breath (tha)"
    notes:
      "n1": "ત (ta) with a puff of breath: not the 'th' of 'thin'. થાળી (thāḷi, plate)."
  "gu-0031":
    native: "d, on the teeth (da)"
    notes:
      "n1": "The tongue on the teeth: દૂધ (dudh, milk)."
  "gu-0032":
    native: "dh, on the teeth, with a breath (dha)"
    notes:
      "n1": "દ (da) with a breath after it: ધીમે (dhime, slowly)."
  "gu-0033":
    native: "n (na)"
    notes:
      "n1": "Like the English n, with the tongue on the teeth: નાક (nāk, nose)."
  "gu-0034":
    native: "p (pa)"
    notes:
      "n1": "Like the 'p' of 'spin', with no puff of breath: પગ (pag, foot)."
  "gu-0035":
    native: "ph, with a breath (pha)"
    notes:
      "n1": "પ (pa) with a breath after it, though many speakers say it as an f: ફળ (phaḷ, fruit). Gujarati writes the f of English words with it too: ફોન (fon, phone)."
  "gu-0036":
    native: "b (ba)"
    notes:
      "n1": "Like the 'b' of 'bat': બા (bā, mother; grandmother)."
  "gu-0037":
    native: "bh, with a breath (bha)"
    notes:
      "n1": "બ (ba) with a breath after it: ભાઈ (bhāi, brother)."
  "gu-0038":
    native: "m (ma)"
    notes:
      "n1": "Like the English m: મા (mā, mother)."
  "gu-0039":
    native: "y (ya)"
    notes:
      "n1": "Like the 'y' of 'yes': યાદ (yād, memory)."
  "gu-0040":
    native: "r (ra)"
    notes:
      "n1": "A light tap of the tongue, as in Spanish 'pero': રસ્તો (rasto, road)."
  "gu-0041":
    native: "l, on the teeth (la)"
    notes:
      "n1": "The tongue on the teeth: લીંબુ (limbu, lemon). Compare ળ (ḷa), curled back."
  "gu-0042":
    native: "v (va)"
    notes:
      "n1": "Between English v and w: વાત (vāt, talk; a matter)."
  "gu-0043":
    native: "sh (śa)"
    notes:
      "n1": "Like the 'sh' of 'ship': શાક (śāk, a vegetable dish). Its shape is Gujarati's own."
  "gu-0044":
    native: "sh (śa), in words from Sanskrit"
    notes:
      "n1": "Said like શ (śa): ભાષા (bhāśā, language). Because it sounds the same, it is drilled by reading and writing only."
  "gu-0045":
    native: "s (sa)"
    notes:
      "n1": "Like the 's' of 'sun': સાત (sāt, seven). In some regional speech સ (sa) and શ (śa) are said alike."
  "gu-0046":
    native: "h (ha)"
    notes:
      "n1": "Like the English h: હાથ (hāth, hand). Between vowels it is often not said as an h but makes the vowel breathy: બહેન (bahen, sister) sounds close to 'ben'."
  "gu-0047":
    native: "l, curled back (ḷa)"
    notes:
      "n1": "An l with the tongue curled back. No word starts with it, but it is common inside words: સોળ (soḷ, sixteen), કેળું (keḷum̐, banana)."
