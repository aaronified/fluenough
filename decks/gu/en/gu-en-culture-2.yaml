# Layer for gu-culture-2: English renderings and notes.
schema: 1
id: "gu-en-culture-2"
kind: "layer"
core: "gu-culture-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: songs of named poets"
description: "Excerpts of songs by Narsinh Mehta, Mirabai (attributed) and Dayaram, with English renderings and notes. Not yet checked by a Gujarati speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "gu-6050":
    native: "A gopi complains to Jashoda that her Kanudo calls out so long and makes such an uproar in Vraja that nobody questions him."
    notes:
      "n1": "The first stanza of a song by Narsinh Mehta in which a gopi speaks to Jashoda about the child Krishna; the refrain and speaker label are left out."
  "gu-6051":
    native: "Drinking the rasa of love, O peacock-feather-crowned one, the knowledge of truth seems trivial, and, as a lean cow's mind wavers for husks, devotees do not ask for the four kinds of liberation."
    notes:
      "n1": "The first stanza of a song by Narsinh Mehta on love for Krishna; the refrain is left out. The four kinds of liberation are the four forms of mukti named in Hindu tradition."
  "gu-6052":
    native: "Jashoda's darling stands on the bank of the Yamuna, and Mohan plays his flute softly and sweetly."
    notes:
      "n1": "A stanza of a song by Narsinh Mehta, as printed on gu.wikisource; the refrain is left out."
  "gu-6053":
    native: "Wake up, Yadava Krishna; without you, who will take the cows, and who will be the chief cowherd when the three hundred and sixty cowherds have gathered?"
    notes:
      "n1": "A stanza of a song by Narsinh Mehta, as printed on gu.wikisource; the refrain is left out."
  "gu-6054":
    native: "The sound of your flute rings out, Kano, and it asks for the toll."
    notes:
      "n1": "A line of a song by Narsinh Mehta about Krishna collecting a toll from the cowherd women, as printed on gu.wikisource."
  "gu-6055":
    native: "Today my eyes have succeeded in seeing the Lord; looking at his lovely face, my heart is glad."
    notes:
      "n1": "A stanza of a song by Narsinh Mehta, as printed on gu.wikisource."
  "gu-6056":
    native: "This hour is lovely, and the good news has come that my beloved is here."
    notes:
      "n1": "A stanza of a song by Narsinh Mehta, as printed on gu.wikisource; the refrain is left out."
  "gu-6057":
    native: "Parrot, read the name of Ram; Sati Sita teaches it."
    notes:
      "n1": "A line of a song by Narsinh Mehta, as printed on gu.wikisource."
  "gu-6058":
    native: "Wake up, charming Kana, great crown-wearer."
    notes:
      "n1": "A line of a song attributed to Mirabai, as printed on gu.wikisource; attribution is to be checked by a reviewer."
  "gu-6059":
    native: "I have prepared the plate for the Lord; now come, garland-wearing Krishna."
    notes:
      "n1": "A line of a song attributed to Mirabai, as printed on gu.wikisource; attribution is to be checked by a reviewer."
  "gu-6060":
    native: "Let us go and settle in Dakor; the lover of delight has made me long for him, so let us go."
    notes:
      "n1": "A line of a song attributed to Mirabai, as printed on gu.wikisource; attribution is to be checked by a reviewer."
  "gu-6061":
    native: "Someone buy Madhav, buy Madhav; the women of Vraja are selling him."
    notes:
      "n1": "A line of a song attributed to Mirabai, as printed on gu.wikisource; attribution is to be checked by a reviewer."
  "gu-6062":
    native: "Of love, of love, of love: the dagger of love has struck me."
    notes:
      "n1": "A line of a song attributed to Mirabai, as printed on gu.wikisource; attribution is to be checked by a reviewer."
  "gu-6063":
    native: "To whom shall I tell the wound cut into my heart, Odhav, to the charming one?"
    notes:
      "n1": "A line of a song by Dayaram, addressed to Odhav, as printed on gu.wikisource."
  "gu-6064":
    native: "It is a quarrel between the eyes and the mind."
    notes:
      "n1": "A line of a song by Dayaram, as printed on gu.wikisource."
  "gu-6065":
    native: "From today I shall not go near the dark-coloured one."
    notes:
      "n1": "A line of a song by Dayaram, as printed on gu.wikisource."
  "gu-6066":
    native: "Now, friend, I will not speak, I will not speak any more."
    notes:
      "n1": "A line of a song by Dayaram, as printed on gu.wikisource; the repeated refrain is printed as it is."
  "gu-6067":
    native: "How could I know what my beloved saw in me?"
    notes:
      "n1": "A line of a song by Dayaram, as printed on gu.wikisource."
