"description": "The verbs of daily life: eating, going, sleeping, washing and more, each given in its dictionary form. Not yet checked by a Gujarati speaker: please report any mistake."
"tags":
- "unreviewed"
"cards":
  "gu-1050":
    "native": "to do; to make"
    "notes":
      "n1": "The dictionary form. In the present, કરું (karum) means I do and કરે (kare) means he or she does."
    "examples":
      "હું કામ કરું છું.":
        "native": "I work."
        "bases":
          "કરું": "to do; to make"
          "છું": "to be"
      "તમે શું કરો છો?":
        "native": "What are you doing?"
        "bases":
          "કરો": "to do; to make"
          "છો": "to be"
  "gu-1051":
    "native": "to sit"
    "notes":
      "n1": "The dictionary form. બેસે (bese) is he or she sits; બેસો (beso) is you sit."
    "examples":
      "તેઓ અહીં બેસે છે.":
        "native": "They sit here."
        "bases":
          "બેસે": "to sit"
          "છે": "to be"
      "મારી બહેન ખુરશી પર બેસે છે.":
        "native": "My sister sits on the chair."
        "bases":
          "પર": "on; upon"
          "બેસે": "to sit"
          "છે": "to be"
  "gu-1052":
    "native": "to walk"
    "notes":
      "n1": "The dictionary form. It also means to work or function, as a machine does."
    "examples":
      "અમે બગીચામાં ચાલીએ છીએ.":
        "native": "We walk in the garden."
        "bases":
          "ચાલીએ": "to walk"
          "છીએ": "to be"
      "દાદી ઘરમાં ચાલે છે.":
        "native": "Grandma walks in the house."
        "bases":
          "ચાલે": "to walk"
          "છે": "to be"
  "gu-1053":
    "native": "to run"
    "notes":
      "n1": "The dictionary form. દોડે (doḍe) means he or she runs."
    "examples":
      "બાળક બગીચામાં દોડે છે.":
        "native": "The child runs in the garden."
        "bases":
          "દોડે": "to run"
          "છે": "to be"
      "મને દોડવું ગમે છે.":
        "native": "I like running."
        "bases":
          "ગમે": "to like"
          "છે": "to be"
  "gu-1054":
    "native": "to sing"
    "notes":
      "n1": "The dictionary form. ગાય (gāy) is he or she sings."
    "examples":
      "તે ગીત ગાય છે.":
        "native": "She sings a song."
        "bases":
          "ગીત": "song"
          "ગાય": "to sing"
          "છે": "to be"
      "અમે સાથે ગાઈએ છીએ.":
        "native": "We sing together."
        "bases":
          "સાથે": "together; with"
          "ગાઈએ": "to sing"
          "છીએ": "to be"
  "gu-1055":
    "native": "to take"
    "notes":
      "n1": "The dictionary form. લે (le) is he or she takes; લઉં (laum) is I take."
    "examples":
      "હું છત્રી લઉં છું.":
        "native": "I take an umbrella."
        "bases":
          "છત્રી": "umbrella"
          "લઉં": "to take"
          "છું": "to be"
      "તે પાણી લે છે.":
        "native": "He or she takes water."
        "bases":
          "લે": "to take"
          "છે": "to be"
  "gu-1056":
    "native": "to give"
    "notes":
      "n1": "The dictionary form. આપું (āpum) is I give; આપે (āpe) is he or she gives."
    "examples":
      "હું તને પુસ્તક આપું છું.":
        "native": "I give you a book."
        "bases":
          "પુસ્તક": "book"
          "આપું": "to give"
          "છું": "to be"
      "તેઓ બધાને મીઠાઈ આપે છે.":
        "native": "They give sweets to everyone."
        "bases":
          "મીઠાઈ": "sweets"
          "આપે": "to give"
          "છે": "to be"
  "gu-1057":
    "native": "to learn"
    "notes":
      "n1": "The dictionary form. શીખે (śikhe) is he or she learns."
    "examples":
      "હું ગુજરાતી શીખું છું.":
        "native": "I am learning Gujarati."
        "bases":
          "ગુજરાતી": "Gujarati"
          "શીખું": "to learn"
          "છું": "to be"
      "તે અંગ્રેજી શીખે છે.":
        "native": "He or she learns English."
        "bases":
          "અંગ્રેજી": "English"
          "શીખે": "to learn"
          "છે": "to be"
  "gu-1058":
    "native": "to study"
    "notes":
      "n1": "The dictionary form. ભણે (bhaṇe) is he or she studies."
    "examples":
      "તે શાળામાં ભણે છે.":
        "native": "She studies at school."
        "bases":
          "ભણે": "to study"
          "છે": "to be"
      "મારા ભાઈ કૉલેજમાં ભણે છે.":
        "native": "My brother studies at college."
        "bases":
          "કૉલેજમાં": "college"
          "ભણે": "to study"
          "છે": "to be"
  "gu-1059":
    "native": "to think"
    "notes":
      "n1": "The dictionary form. વિચારે (vicāre) is he or she thinks. The phrase વિશે (viśe) વિચારવું (vicārvum̐) means to think about."
    "examples":
      "હું તેના વિશે વિચારું છું.":
        "native": "I think about it."
        "bases":
          "વિશે": "about"
          "વિચારું": "to think"
          "છું": "to be"
      "તે બહુ વિચારે છે.":
        "native": "He or she thinks a lot."
        "bases":
          "વિચારે": "to think"
          "છે": "to be"
  "gu-1060":
    "native": "to understand"
    "notes":
      "n1": "The dictionary form. સમજો (samjo) is you understand."
    "examples":
      "હું તને સમજું છું.":
        "native": "I understand you."
        "bases":
          "સમજું": "to understand"
          "છું": "to be"
      "તમે ગુજરાતી સમજો છો?":
        "native": "Do you understand Gujarati?"
        "bases":
          "ગુજરાતી": "Gujarati"
          "સમજો": "to understand"
          "છો": "to be"
  "gu-1061":
    "native": "to wear"
    "notes":
      "n1": "The dictionary form. પહેરે (pahere) is he or she wears."
    "examples":
      "તે લાલ સાડી પહેરે છે.":
        "native": "She wears a red sari."
        "bases":
          "લાલ": "red"
          "સાડી": "sari"
          "પહેરે": "to wear"
          "છે": "to be"
      "હું ચશ્મા પહેરું છું.":
        "native": "I wear glasses."
        "bases":
          "ચશ્મા": "glasses"
          "પહેરું": "to wear"
          "છું": "to be"
  "gu-1062":
    "native": "to say; to tell"
    "notes":
      "n1": "The dictionary form. કહે (kahe) is he or she says; કહો (kaho) is you say or tell."
    "examples":
      "હું તને કહું છું.":
        "native": "I am telling you."
        "bases":
          "કહું": "to say; to tell"
          "છું": "to be"
      "દાદી વાર્તા કહે છે.":
        "native": "Grandma tells a story."
        "bases":
          "વાર્તા": "story"
          "કહે": "to say; to tell"
          "છે": "to be"
