schema: 1
id: "gu-en-grammar-articles"
kind: "layer"
core: "gu-grammar-articles"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "No articles: a and the"
license: "CC0-1.0"
description: "Gujarati has no 'a' or 'the'. How it says them anyway. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0385":
    native: "The book is on the table."
    notes:
      "n1": "No word for 'the' or 'a': the context says which. ચોપડી (copḍi) is the everyday word for a book."
  "gu-0386":
    native: "A boy came."
    notes:
      "n1": "એક (ek), 'one', can do the work of 'a'."
  "gu-0244":
    notes:
      "n1": "Without એક (ek), the boy is one both of you know: 'the boy'. It can also be 'a boy'; the context tells."
  "gu-0387":
    native: "One tea, please."
  "gu-0388":
    native: "Someone has come."
    notes:
      "n1": "કોઈ (koi) is 'someone; some, any'. An unknown someone takes the neuter verb. કંઈક (kaink) is 'something'."
  "gu-0389":
    native: "Show me a good shop."
    notes:
      "n1": "કોઈ (koi) before a noun is 'some' or 'any': any good shop at all."
