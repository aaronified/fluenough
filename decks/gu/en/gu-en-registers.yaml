schema: 1
id: "gu-en-registers"
kind: "layer"
core: "gu-registers"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Formal Gujarati and everyday Gujarati"
license: "CC0-1.0"
description: "Gujarati on signs, in letters, speeches and the news is more formal than the Gujarati of the street, and full of words from Sanskrit. Here they are beside their everyday words. Recognition only. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0316":
    notes:
      "n1": "The most formal 'you', in speeches, letters and signs. In speech, તમે (tame)."
  "gu-0620":
    native: "thank you (formal); in speech આભાર (ābhār)"
    notes:
      "n1": "In speeches and writing. Between friends, 'thank you' in English, or nothing at all."
  "gu-0621":
    native: "welcome; please come (with great respect)"
    notes:
      "n1": "To an honoured guest, and on invitations. In everyday speech, આવો (āvo)."
  "gu-0622":
    native: "you are welcome (on signs)"
    notes:
      "n1": "Over the door of a shop, a town or a hall."
    bases:
      "સ્વાગત": "welcome"
      "છે": "to be"
  "gu-0623":
    native: "please (formal, on notices)"
    notes:
      "n1": "In speech the polite verb ending does the work: બેસજો (besjo), please sit. Also મહેરબાની કરીને (maherbāni karine), from Persian."
    bases:
      "કૃપા": "kindness; favour"
      "કરીને": "to do; to make"
  "gu-0624":
    native: "a request (formal)"
    notes:
      "n1": "In letters and notices: આપને વિનંતી છે કે (āpne vinanti che ke)..., you are requested to..."
  "gu-0625":
    native: "a meal (formal); in speech જમવાનું (jamvānum̐)"
    notes:
      "n1": "On menus and invitations: ભોજનાલય (bhojanālay) is a restaurant serving meals."
  "gu-0626":
    native: "water (literary); in speech પાણી (pāṇi)"
    notes:
      "n1": "In poetry, prayers and official names."
  "gu-0627":
    native: "mother (formal); in speech મમ્મી (mammi), બા (bā)"
    notes:
      "n1": "Also a goddess: અંબા માતા (ambā mātā), the goddess Amba."
  "gu-0628":
    native: "father (formal); in speech પપ્પા (pappā)"
    notes:
      "n1": "On forms: પિતાનું નામ (pitānum̐ nām), father's name."
  "gu-0629":
    native: "news (formal); in speech ખબર (khabar), ન્યૂઝ (nyujh)"
  "gu-0630":
    native: "school (formal, in names); in speech શાળા (śāḷā), સ્કૂલ (skul)"
  "gu-0631":
    native: "entrance; entry (on signs)"
    notes:
      "n1": "પ્રવેશ નિષેધ (praveś niśedh), no entry."
  "gu-0632":
    native: "no smoking (on signs)"
    notes:
      "n1": "નિષેધ (niśedh) is 'forbidden', a word of signs, not of speech."
    bases:
      "ધૂમ્રપાન": "smoking"
      "નિષેધ": "prohibition"
  "gu-0633":
    native: "Mrs (formal)"
    notes:
      "n1": "Before a married woman's name on letters and invitations. In speech, her name and -બહેન (-bahen)."
