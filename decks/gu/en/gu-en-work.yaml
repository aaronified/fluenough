schema: 1
id: "gu-en-work"
kind: "layer"
core: "gu-work"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Work"
license: "CC0-1.0"
description: "Jobs, the office, the shop and the family business, and how to say what you do. Many work words are English. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0352":
    native: "work"
    notes:
      "n1": "Also 'a task' and 'use': શું કામ છે? (shun kam chhe?), what do you need?"
  "gu-0353":
    native: "a job; employment"
    notes:
      "n1": "Working for someone else, as against a business of your own."
  "gu-0354":
    native: "business; trade"
    notes:
      "n1": "Gujaratis are famous traders, and a family ધંધો (dhandho) is a point of pride: ધંધો કેમ ચાલે છે (dhandho kem cāle che)? how's business?"
  "gu-0355":
    native: "office"
    notes:
      "n1": "Often written without the moon: ઓફિસ (ophis)."
  "gu-0356":
    native: "shop"
  "gu-0357":
    native: "trader; merchant; shopkeeper"
  "gu-0358":
    native: "teacher"
    notes:
      "n1": "Children say સાહેબ (sāheb) to a man teacher and બહેન (bahen) to a woman."
  "gu-0359":
    native: "doctor"
  "gu-0360":
    native: "farmer"
  "gu-0361":
    native: "driver"
  "gu-0362":
    native: "student"
    notes:
      "n1": "A woman student is વિદ્યાર્થિની (vidyārthini)."
  "gu-0363":
    native: "factory"
  "gu-0364":
    native: "salary; pay"
  "gu-0365":
    native: "leave; a day off; a holiday"
    notes:
      "n1": "Also 'permission': રજા આપો (rajā āpo), please allow me, said when leaving."
  "gu-0366":
    native: "meeting"
  "gu-0367":
    native: "What do you do (for work)?"
    bases:
      "કરો": "to do; to make"
      "છો": "to be"
  "gu-0368":
    native: "I work in a bank."
    notes:
      "n1": "બૅન્ક (bênk) is often written બેંક (beṅk)."
    bases:
      "હું": "I"
      "બૅન્કમાં": "bank"
      "કરું": "to do; to make"
      "છું": "to be"
  "gu-0369":
    native: "I have my own business."
    notes:
      "n1": "પોતાનો (potāno) is 'own'; it agrees like 'my'."
    bases:
      "મારો": "my"
      "પોતાનો": "own"
      "છે": "to be"
  "gu-0370":
    native: "I have the day off today."
    bases:
      "મારે": "my"
      "છે": "to be"
  "gu-0371":
    native: "The boss is in a meeting."
    bases:
      "છે": "to be"
