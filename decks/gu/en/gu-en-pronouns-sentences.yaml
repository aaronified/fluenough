"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Pronouns and people words: sentences"
"license": "CC-BY-SA-4.0"
"description": "Short sentences that use the pronouns, for putting the words in order. Not yet checked by a Gujarati speaker: please report any mistake."
"tags":
- "unreviewed"
"cards":
  "gu-1019":
    "native": "She is my sister."
    "confusables":
      "c1":
        "why": "તેઓ (teo) means they, or he or she with respect, not one sister."
      "c2":
        "why": "મારું (mārum̐) is my before a neuter noun, and બહેન (bahen) is feminine."
    "bases":
      "છે": "to be"
  "gu-1020":
    "native": "My brother is here."
    "confusables":
      "c1":
        "why": "મારી (māri) is my before a feminine noun, and ભાઈ (bhāi) is masculine."
      "c2":
        "why": "મારું (mārum̐) is my before a neuter noun."
    "bases":
      "છે": "to be"
  "gu-1021":
    "native": "What is your name?"
    "confusables":
      "c1":
        "why": "તારું (tārum̐) is the informal your, for a friend or a child."
      "c2":
        "why": "મારું (mārum̐) means my, not your."
    "bases":
      "છે": "to be"
  "gu-1022":
    "native": "I like everything."
    "confusables":
      "c1":
        "why": "તને (tane) is to you, not to me."
      "c2":
        "why": "અમને (amane) is to us."
    "bases":
      "ગમે": "to like"
      "છે": "to be"
  "gu-1023":
    "native": "We are all here."
    "confusables":
      "c1":
        "why": "તમે (tame) is you, not we."
      "c2":
        "why": "આપણે (āpaṇe) is we, including the person you speak to."
    "bases":
      "છીએ": "to be"
  "gu-1024":
    "native": "No one is here."
    "confusables":
      "c1":
        "why": "કંઈ (kaim̐) is something, not someone."
      "c2":
        "why": "બધા (badhā) is everyone, the opposite of no one."
    "bases":
      "નથી": "to be"
  "gu-1025":
    "native": "There is other work."
    "confusables":
      "c1":
        "why": "બધું (badhum̐) is everything, not another thing."
      "c2":
        "why": "કંઈ (kaim̐) is something, used in questions and with a negative."
    "bases":
      "છે": "to be"
  "gu-1026":
    "native": "Who are you?"
    "confusables":
      "c1":
        "why": "શું (śum̐) is what, not who."
      "c2":
        "why": "કોઈ (koi) means someone, not who."
    "bases":
      "છે": "to be"
