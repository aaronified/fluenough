schema: 1
id: "gu-en-spelling"
kind: "layer"
core: "gu-spelling"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Gujarati spellings, old and new"
license: "CC0-1.0"
description: "Spellings you will meet in older print and in everyday writing, beside the dictionary spelling. Gujarati says a long and a short i or u alike, so the spelling is often in doubt. Recognition only. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0659":
    native: "sister; the dictionary spelling is બહેન (bahen)"
    notes:
      "n1": "Written as it is said: the h of બહેન (bahen) is heard only as a breathy e. Common in names and messages: ગીતાબેન (gitāben)."
  "gu-0660":
    native: "please tell; the dictionary spelling is કહેજો (kahejo)"
    notes:
      "n1": "In stories and dialogue an apostrophe marks the h that speech drops: કે (ke)'વું (vum̐) for કહેવું (kahevum̐), રે (re)'વું (vum̐) for રહેવું (rahevum̐)."
  "gu-0661":
    native: "to get up; the dictionary spelling is ઊઠવું (uṭhvum̐)"
    notes:
      "n1": "The short and long u sound alike, so the short one is often written. The dictionary wants ઊ (u) here."
  "gu-0662":
    native: "daughter; the dictionary spelling is દીકરી (dikri)"
    notes:
      "n1": "A common misspelling, since ઇ (i) and ઈ (i) sound alike."
  "gu-0663":
    native: "exam; the dictionary spelling is પરીક્ષા (parikśā)"
    notes:
      "n1": "A common misspelling: the dictionary has the long ી (i)."
  "gu-0664":
    native: "Hindi; also written હિંદી (hindi)"
    notes:
      "n1": "A nasal before a consonant is written either as a half letter (ન્દ) or as the dot (ં). Both are seen: હિન્દુ (hindu) and હિંદુ (hindu)."
  "gu-0665":
    native: "bank; also written બૅન્ક (bênk)"
    notes:
      "n1": "English words are spelled many ways: with or without the moon, with the dot or a half letter."
  "gu-0666":
    native: "my; today મારું (mārum̐)"
    notes:
      "n1": "Nineteenth-century print often wrote an h after m or n, as in Narmad's autobiography મ્હારી હકીકત (My Story) and the poet's name ન્હાનાલાલ (Nanalal). Today: મારું (mārum̐), નાનું (nānum̐)."
  "gu-0667":
    native: "God; often misspelled ઇશ્વર (iśvar)"
    notes:
      "n1": "The dictionary has the long ઈ (i); the short one is a common slip."
