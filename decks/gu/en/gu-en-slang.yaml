schema: 1
id: "gu-en-slang"
kind: "layer"
core: "gu-slang"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Slang"
license: "CC0-1.0"
description: "Everyday slang: what friends say that a textbook doesn't. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0262":
    notes:
      "n1": "Between friends, a greeting all on its own: મજામાં (majāmām̐)? all good? The answer: એકદમ મજામાં! (ekdam majaman), totally!"
  "gu-0634":
    native: "What's up?"
    notes:
      "n1": "Literally 'what is going on?'."
  "gu-0635":
    native: "great fun; a good time"
    notes:
      "n1": "જલસા કર! (jalsa kar!), enjoy yourself!"
  "gu-0636":
    native: "Wow! Brilliant!"
    notes:
      "n1": "Literally 'brother, brother!': praise for something done well, said to anyone."
  "gu-0637":
    native: "great; cool"
    notes:
      "n1": "It never changes: મસ્ત ફિલ્મ (mast philm), a great film; મસ્ત ચા (mast cā), great tea."
  "gu-0638":
    native: "it'll do; no problem"
    notes:
      "n1": "Literally 'it will walk'. The easy-going answer to almost anything."
  "gu-0639":
    native: "a mess; a mix-up"
    notes:
      "n1": "લોચો પડી ગયો (loco paḍi gayo), something's gone wrong. In Surat it is also a soft, buttery snack."
  "gu-0640":
    native: "buddy; dear"
    notes:
      "n1": "Between friends, in Ahmedabad especially: હા બકા (hā bakā), yes, buddy."
  "gu-0641":
    native: "come on; let's go"
    notes:
      "n1": "Village and Ahmedabad speech for ચાલો (cālo)."
  "gu-0642":
    native: "a great atmosphere; a hit"
    notes:
      "n1": "જમાવટ થઈ ગઈ! (jamavat thai gai!), it was a blast!"
  "gu-0643":
    native: "swagger; pride"
    notes:
      "n1": "વટ પાડવો (vaṭ pāḍvo), to show off; to cut a fine figure."
  "gu-0644":
    native: "to chat idly; to tell tall tales"
    notes:
      "n1": "ગપ્પાં (gappām̐) is neuter plural, so the verb is મારવાં (mārvām̐)."
  "gu-0645":
    native: "gossip; poking into other people's business"
    notes:
      "n1": "પંચાત ના કર (pañcāt nā kar), mind your own business."
  "gu-0646":
    native: "crazy; mad"
    notes:
      "n1": "It agrees: ગાંડી (gāṇḍi), ગાંડું (gāṇḍum̐). ગાંડા જેવી વાત (gāṇḍā jevi vāt), crazy talk."
  "gu-0647":
    native: "don't stress"
    notes:
      "n1": "Literally 'not to take tension'. -વાનું (-vānum̐) with નહીં (nahim̐) makes a casual rule."
