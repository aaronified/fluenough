"name": "Describing things and feelings"
"license": "CC-BY-SA-4.0"
"description": "Words for size, age, temperature, weight, cleanliness and feelings, and how to say what a thing is like. Not yet checked by a Gujarati speaker: please report any mistake."
"cards":
  "gu-1240":
    "native": "big; large"
    "notes":
      "n1": "The neuter form; it agrees with the noun: મોટો ભાઈ (moṭo bhāi), an elder brother."
    "examples":
      "આ ઘર ઘણું મોટું છે.":
        "native": "This house is very big."
        "bases":
          "આ": "this"
          "ઘર": "house; home"
          "ઘણું": "a lot"
          "મોટું": "big"
          "છે": "to be"
      "મારો ભાઈ મોટો છે.":
        "native": "My brother is the older one."
        "bases":
          "મારો": "my"
          "ભાઈ": "brother"
          "મોટો": "big"
          "છે": "to be"
  "gu-1241":
    "native": "small; little"
    "notes":
      "n1": "The neuter form; નાની બહેન (nāni bahen) means a younger sister."
    "examples":
      "આ ડબ્બો નાનો છે.":
        "native": "This box is small."
        "bases":
          "આ": "this"
          "ડબ્બો": "box; tin"
          "નાનો": "small"
          "છે": "to be"
      "મારી બહેન નાની છે.":
        "native": "My sister is younger."
        "bases":
          "મારી": "my"
          "બહેન": "sister"
          "નાની": "small"
          "છે": "to be"
  "gu-1242":
    "native": "new"
    "notes":
      "n1": "Agrees with the noun: નવું પુસ્તક (navum̐ pustak), a new book; નવો ફોન (navo phon), a new phone."
    "examples":
      "આ નવું પુસ્તક છે.":
        "native": "This is a new book."
        "bases":
          "આ": "this"
          "નવું": "new"
          "પુસ્તક": "book"
          "છે": "to be"
