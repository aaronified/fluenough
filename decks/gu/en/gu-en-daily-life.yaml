schema: 1
id: "gu-en-daily-life"
kind: "layer"
core: "gu-daily-life"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "A day"
license: "CC0-1.0"
description: "The verbs of an ordinary day, from getting up to going to sleep. A verb is named by its form in -વું (-vum̐). Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0501":
    native: "to get up; to wake up"
    notes:
      "n1": "A verb's dictionary form ends in -વું (-vun): its stem is what comes before, here ઊઠ- (uṭh-)."
  "gu-0502":
    native: "to bathe; to have a shower"
  "gu-0503":
    native: "breakfast; a snack"
    notes:
      "n1": "નાસ્તો કરવો (nāsto karvo), to have breakfast. Gujarati snacks, from ખાખરા (khākhrā) to ગાંઠિયા (gāṇṭhiyā), are all નાસ્તો (nāsto)."
  "gu-0504":
    native: "to eat"
  "gu-0505":
    native: "to have a meal (lunch or dinner)"
    notes:
      "n1": "Politer than ખાવું (khāvum̐) for a proper meal: જમી લીધું? (jami lidhun?), have you eaten? is a common greeting. The meal itself is જમવાનું (jamvānum̐)."
  "gu-0506":
    native: "to drink"
  "gu-0507":
    native: "to cook"
    notes:
      "n1": "Also રસોઈ કરવી (rasoi karvi), to do the cooking."
  "gu-0508":
    native: "to go"
  "gu-0509":
    native: "to come"
  "gu-0510":
    native: "to read"
  "gu-0511":
    native: "to write"
  "gu-0512":
    native: "to speak"
  "gu-0513":
    native: "to listen; to hear"
  "gu-0514":
    native: "to see; to watch; to look"
    notes:
      "n1": "ટીવી જોવું (ṭivi jovum̐), to watch TV."
  "gu-0515":
    native: "to play"
  "gu-0516":
    native: "to wash"
    notes:
      "n1": "કપડાં ધોવાં (kapḍām̐ dhovām̐), to wash clothes: the verb agrees with the neuter plural."
  "gu-0517":
    native: "to buy"
    notes:
      "n1": "In speech often લેવું (levum̐), to take."
  "gu-0518":
    native: "to sleep; to lie down"
  "gu-0519":
    native: "I get up at seven."
    bases:
      "હું": "I"
      "વાગ્યે": "to strike (the hour)"
      "છું": "to be"
  "gu-0520":
    native: "At night I watch TV."
    bases:
      "હું": "I"
      "ટીવી": "TV"
      "છું": "to be"
