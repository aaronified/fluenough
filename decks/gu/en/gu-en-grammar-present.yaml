    "sambhalvun": "to listen; to hear"
    "bolvun": "to speak"
  "notes": "The stem takes an ending for the person, then the present of છું (chum) for I, છે (che) for he, she, it and one you, છીએ (chie) for we, and છો (cho) for you plural or polite. Examples: વાંચું છું (vāñcum̐ chum) I read; વાંચે છે (vāñce che) he reads; વાંચીએ છીએ (vāñcie chie) we read; વાંચો છો (vāñco cho) you read (polite). The form does not change with gender: a man and a woman say the same words. The same ending with રહ્યો (rahyo) for 'right now' is in gu-grammar-continuous, which is not repeated here."
