  "notes": "The stem takes an ending for the person, then the present of 'be': વાંચું છું (vāñcum̐ chum) for I, વાંચે છે (vāñce che) for he, she, it and you (informal), વાંચીએ છીએ (vāñcie chie) for we, and વાંચો છો (vāñco cho) for you (polite or plural). In the present, the form does not change with gender: a man and a woman say the same words. The right-now form with રહ્યો (rahyo) is in gu-grammar-continuous, which is not repeated here. Irregular here: જાય છે (jāy che) for go, ખાય છે (khāy che) for eat, પીએ છે (pie che) for drink and લે છે (le che) for take, each with its own forms in the table."
