  "gu-1830":
    "native": "clothes"
    "notes":
      "n1": "Neuter and plural: the word for clothes in general, as કપડું (kapḍum̐) is a single piece of cloth."
    "examples":
      "મારાં કપડાં નવાં છે.":
        "native": "My clothes are new."
        "bases":
          "મારાં": "my"
          "કપડાં": "clothes"
          "છે": "to be"
      "કપડાં સ્વચ્છ છે.":
        "native": "The clothes are clean."
        "bases":
          "કપડાં": "clothes"
          "છે": "to be"
