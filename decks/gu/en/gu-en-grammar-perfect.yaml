  notes: "With an intransitive verb, the perfect is the past form with the present of હોવું (hovum̐): હું આવ્યો છું (hum̐ āvyo chum̐), I have come (m), and તે આવી છે (te āvi che), she has come. With a verb that takes an object, the doer takes એ (e) (the -e of the object table, મેં (mem̐) for I, તેણે (teṇe) for he or she), and the form agrees with the object, with છે (che) after it: મેં ચા પીધી છે (mem̐ cā pidhi che), I have drunk tea. Each row has one set of cells: the person cells for an intransitive verb and the object cells for a transitive one; the other cells are empty."
