schema: 1
id: "gu-en-numbers-1-20"
kind: "layer"
core: "gu-numbers-1-20"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Numbers 1–20"
license: "CC0-1.0"
description: "Zero to twenty. In Gujarati every number up to a hundred has its own word, so these are the ones to learn first. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0108":
    native: "0, zero"
    notes:
      "n1": "The Gujarati digit is ૦ (0). Many people simply say 'zero'."
  "gu-0109":
    native: "1, one"
    notes:
      "n1": "Also does the work of 'a': એક છોકરો (ek chokro), a boy. The digit is ૧ (1)."
  "gu-0110":
    native: "2, two"
    notes:
      "n1": "The digit is ૨ (2)."
  "gu-0111":
    native: "3, three"
    notes:
      "n1": "With the join ત્ર (tra) and the curled-back ણ (ṇa). The digit is ૩ (3)."
  "gu-0112":
    native: "4, four"
    notes:
      "n1": "The digit is ૪ (4)."
  "gu-0113":
    native: "5, five"
    notes:
      "n1": "The long a is nasal: the dot ં (am̐). The digit is ૫ (5)."
  "gu-0114":
    native: "6, six"
    notes:
      "n1": "One letter, said with its a: chha. The digit is ૬ (6)."
  "gu-0115":
    native: "7, seven"
    notes:
      "n1": "The digit is ૭ (7)."
  "gu-0116":
    native: "8, eight"
    notes:
      "n1": "With the curled-back, breathy ઠ (ṭha). The digit is ૮ (8)."
  "gu-0117":
    native: "9, nine"
    notes:
      "n1": "નવરાત્રિ (navrātri), the festival of dance, is 'nine nights'. The digit is ૯ (9)."
  "gu-0118":
    native: "10, ten"
    notes:
      "n1": "Also spelled દશ (daś). The digits are ૧૦ (10)."
  "gu-0119":
    native: "11, eleven"
  "gu-0120":
    native: "12, twelve"
    notes:
      "n1": "Without a breath on the b. With one, ભાર (bhār) is a load."
  "gu-0121":
    native: "13, thirteen"
  "gu-0122":
    native: "14, fourteen"
  "gu-0123":
    native: "15, fifteen"
  "gu-0124":
    native: "16, sixteen"
    notes:
      "n1": "With the curled-back ળ (ḷa)."
  "gu-0125":
    native: "17, seventeen"
  "gu-0126":
    native: "18, eighteen"
  "gu-0127":
    native: "19, nineteen"
    notes:
      "n1": "ઓગણ- (ogaṇ-) means 'one less than': ઓગણીસ (ogaṇis) is one less than વીસ (vis), twenty. The same start is in 29, 39, 49 and 59."
  "gu-0128":
    native: "20, twenty"
