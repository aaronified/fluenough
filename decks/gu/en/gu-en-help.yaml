schema: 1
id: "gu-en-help"
kind: "layer"
core: "gu-help"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Help"
license: "CC0-1.0"
description: "Calling for help, feeling ill, losing your way or your wallet, and finding a doctor. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0600":
    native: "Help! Save me!"
    notes:
      "n1": "The cry for help. To ask for a hand: મદદ કરો! (madad karo!)."
  "gu-0601":
    native: "help"
  "gu-0602":
    native: "police"
    notes:
      "n1": "The emergency number in India is 112."
  "gu-0359":
    notes:
      "n1": "Doctors are addressed as ડૉક્ટર સાહેબ (ḍôkṭar sāheb)."
  "gu-0603":
    native: "hospital"
  "gu-0604":
    native: "medicine"
    notes:
      "n1": "A chemist's shop is a મેડિકલ સ્ટોર (meḍikal sṭor)."
  "gu-0605":
    native: "I don't feel well."
    notes:
      "n1": "Literally 'to me it doesn't feel good'."
  "gu-0606":
    native: "I have a headache."
    notes:
      "n1": "Literally 'my head hurts'. Any part of the body: મારું પેટ દુખે છે (pet), my stomach hurts."
  "gu-0607":
    native: "I've lost my wallet."
    notes:
      "n1": "Literally 'my wallet got lost'. A phone: મારો ફોન ખોવાઈ ગયો (māro phon khovāi gayo)."
  "gu-0608":
    native: "I'm lost. (a man)"
    notes:
      "n1": "Literally 'I have forgotten the way'. A woman says ભૂલી ગઈ છું (bhuli gai chum̐)."
  "gu-0609":
    native: "Be careful! Look out!"
    notes:
      "n1": "Also 'take care' on parting: તબિયતનું ધ્યાન રાખજો (tabiytnum̐ dhyān rākhjo), look after your health."
  "gu-0610":
    native: "Call an ambulance."
    notes:
      "n1": "બોલાવવું (bolāvvum̐), to call someone over."
  "gu-0611":
    native: "Thief!"
