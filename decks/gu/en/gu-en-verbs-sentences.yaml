"cards":
  "gu-1063":
    "native": "When do you get up?"
    "confusables":
      "c1":
        "why": "સૂવું (suvum̐) is to sleep, the opposite of getting up."
      "c2":
        "why": "ખાવું (khāvum̐) is to eat."
    "bases":
      "છે": "to be"
  "gu-1064":
    "native": "We have a meal together."
    "confusables":
      "c1":
        "why": "ખાવું (khāvum̐) is to eat; જમવું (jamvum̐) is the word for a full meal."
      "c2":
        "why": "પીવું (pivum̐) is to drink."
    "bases":
      "સાથે": "together; with"
      "છીએ": "to be"
  "gu-1065":
    "native": "Grandma cooks in the kitchen."
    "confusables":
