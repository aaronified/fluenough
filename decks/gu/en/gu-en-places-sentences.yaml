"cards":
  "gu-1720":
    "native": "The market is big."
    "bases":
      "મોટો": "big"
      "છે": "to be"
    "confusables":
      "w1":
        "why": "દુકાન (dukān) means shop, one place inside the market."
      "w2":
        "why": "શેરી (śeri) means street, outside the market."
  "gu-1721":
    "native": "The school is big."
    "bases":
      "મોટી": "big"
      "છે": "to be"
    "confusables":
      "w1":
        "why": "મંદિર (mandir) means temple, not school."
      "w2":
        "why": "દવાખાનું (davākhānum̐) means clinic, not school."
  "gu-1722":
    "native": "The temple is beautiful."
    "bases":
      "સુંદર": "beautiful"
      "છે": "to be"
    "confusables":
      "w1":
        "why": "મસ્જિદ (masjid) means mosque, a different place of prayer."
      "w2":
        "why": "મહેલ (mahel) means palace, a royal home."
  "gu-1723":
    "native": "The river is near the city."
    "bases":
      "છે": "to be"
    "confusables":
      "w1":
        "why": "તળાવ (taḷāv) means a still lake, not a river."
      "w2":
        "why": "સમુદ્ર (samudra) means sea, which is salt water."
  "gu-1724":
    "native": "The village is far from the city."
    "bases":
      "છે": "to be"
    "confusables":
      "w1":
        "why": "નગર (nagar) means town, which is smaller than a city."
      "w2":
        "why": "રાજધાની (rājdhāni) means capital, a special kind of city."
  "gu-1725":
    "native": "There is snow on the mountain."
    "bases":
      "પર": "on; over"
      "બરફ": "snow; ice"
      "છે": "to be"
    "confusables":
      "w1":
        "why": "ડુંગર (ḍuṅgar) means hill, which is lower."
      "w2":
        "why": "ધોધ (dhodh) means waterfall, which is water."
  "gu-1726":
    "native": "There is a garden outside the house."
    "bases":
      "છે": "to be"
    "confusables":
      "w1":
        "why": "અંદર (andar) means inside, the opposite of outside."
      "w2":
        "why": "આગળ (āgaḷ) means in front, a different direction."
  "gu-1727":
    "native": "There is a field behind the school."
    "bases":
      "છે": "to be"
    "confusables":
      "w1":
        "why": "આગળ (āgaḷ) means in front, the opposite of behind."
      "w2":
        "why": "સામે (sāme) means opposite, facing."
