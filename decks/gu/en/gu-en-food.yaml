"cards":
  "gu-1403":
    "native": "vegetable; a cooked vegetable dish"
    "notes":
      "n1": "A cooked vegetable dish with spices, eaten with રોટલી (roṭli) or ભાત (bhāt). શાકભાજી (śākbhāji) is the general word for vegetables."
    "examples":
      "તમે શાક ખાઓ.":
        "native": "You eat the vegetable dish."
        "bases":
          "તમે": "you (polite)"
          "શાક": "vegetable dish"
          "ખાઓ": "eat (polite)"
      "આ શાક સારું છે.":
        "native": "This vegetable dish is good."
        "bases":
          "આ": "this"
          "શાક": "vegetable dish"
          "સારું": "good"
          "છે": "is"
  "gu-1404":
    "native": "sweet; a sweet dish"
