schema: 1
id: "gu-en-family"
kind: "layer"
core: "gu-family"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Family"
license: "CC0-1.0"
description: "Parents, children, grandparents, and the many aunts and uncles: Gujarati has a word for each side of the family. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0331":
    native: "family"
    notes:
      "n1": "Also પરિવાર (parivār). Many Gujarati families live together across three generations."
  "gu-0332":
    native: "mum"
    notes:
      "n1": "Also મા (mā), and in many families બા (bā). Spoken of with respect, she takes a plural verb: મમ્મી આવ્યાં (mammi āvyām̐)."
  "gu-0333":
    native: "dad"
    notes:
      "n1": "Also બાપુજી (bāpuji), older and respectful, and પિતા (pitā), formal. A father takes a plural verb: પપ્પા આવ્યા (pappā āvyā)."
  "gu-0334":
    native: "elder brother"
    notes:
      "n1": "Literally 'big brother'. An elder sister is મોટીબહેન (moṭibahen). A younger one is નાનો ભાઈ (nāno bhāi), નાની બહેન (nāni bahen)."
  "gu-0335":
    native: "son"
  "gu-0336":
    native: "daughter"
  "gu-0337":
    native: "child; baby"
    notes:
      "n1": "Neuter, whether a boy or a girl. The plural is બાળકો (bāḷko)."
  "gu-0338":
    native: "husband"
    notes:
      "n1": "In speech many women say 'my husband' without his name: એ (e), 'he', or ઘરવાળા (gharvāḷā)."
  "gu-0339":
    native: "wife"
  "gu-0340":
    native: "grandmother (father's mother)"
    notes:
      "n1": "Many families say બા (bā) instead."
  "gu-0341":
    native: "grandfather (mother's father)"
    notes:
      "n1": "The same word as નાના (nānā), 'small' (plural): only the context tells."
  "gu-0342":
    native: "grandmother (mother's mother)"
  "gu-0343":
    native: "aunt (father's brother's wife)"
  "gu-0344":
    native: "aunt (father's sister)"
    notes:
      "n1": "A Gujarati word: Hindi says बुआ (buā). Her husband is ફુવા (phuvā). The ફોઈ (phoi) traditionally names a new baby."
  "gu-0345":
    native: "uncle (mother's brother)"
    notes:
      "n1": "His wife is મામી (māmi)."
  "gu-0346":
    native: "brother's wife"
  "gu-0347":
    native: "sister's husband"
  "gu-0348":
    native: "mother-in-law"
    notes:
      "n1": "The father-in-law is સસરા (sasrā)."
  "gu-0349":
    native: "boy"
    notes:
      "n1": "Also 'son', in speech: મારો છોકરો (māro chokro), my boy."
  "gu-0350":
    native: "girl"
  "gu-0351":
    native: "I have two brothers."
    notes:
      "n1": "For relatives, Gujarati says મારે (māre), 'to me', rather than મારી પાસે (māri pāse), 'near me'. After a number the noun can stay singular."
