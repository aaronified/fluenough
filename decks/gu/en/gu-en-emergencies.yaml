  "name": "Emergencies: accidents, fire, help and safety",
  "license": "CC-BY-SA-4.0",
  "description": "Accidents, fire, illness and injury, calling for help, and the words for keeping safe. Not yet checked by a Gujarati speaker: please report any mistake.",
  "tags": [
    "unreviewed"
  ],
  "cards": {
    "gu-4686": {
      "native": "safety",
      "notes": {
        "n1": "Safety of people or a place; the opposite of danger."
      },
      "examples": {
        "આ ઘરમાં સલામતી સારી છે.": {
          "native": "This house has good safety.",
          "bases": {
            "આ": "this",
            "ઘરમાં": "in the house",
            "સલામતી": "safety",
            "સારી": "good (feminine)",
            "છે": "is"
          }
        },
        "બાળકોની સલામતી પહેલી છે.": {
          "native": "The children's safety comes first.",
          "bases": {
            "બાળકોની": "of the children",
            "સલામતી": "safety",
            "પહેલી": "first (feminine)",
            "છે": "is"
          }
        }
      }
    },
    "gu-4687": {
      "native": "rescue; saving",
      "notes": {
        "n1": "Getting someone out of danger. Bachav team is a rescue team."
      },
      "examples": {
        "બહાદુર માણસે બાળકનો બચાવ કર્યો.": {
          "native": "A brave man rescued the child.",
          "bases": {
            "બહાદુર": "brave",
            "માણસે": "the man",
            "બાળકનો": "of the child",
            "બચાવ": "rescue; saving",
            "કર્યો": "did (masculine)"
          }
        },
        "બચાવ ટીમ ઝડપથી આવી.": {
          "native": "The rescue team came quickly.",
          "bases": {
            "બચાવ": "rescue; saving",
            "ટીમ": "team",
            "ઝડપથી": "quickly",
            "આવી": "came (feminine)"
          }
        }
      }
    },
    "gu-4688": {
      "native": "Help; save!",
      "notes": {
        "n1": "The call for help in danger. Say it loudly and clearly."
      },
      "examples": {
        "આગ છે, બચાવો!": {
          "native": "There is a fire, help!",
          "bases": {
            "છે": "is",
            "બચાવો": "Help! Save!"
          }
        },
        "બચાવો! મને મદદ કરો!": {
          "native": "Help! Help me!",
          "bases": {
            "બચાવો": "Help! Save!",
            "મને": "to me",
            "કરો": "do (polite)"
          }
        }
      }
    },
    "gu-4689": {
      "native": "thief",
      "notes": {
        "n1": "A person who steals. Chor! is the cry for a thief."
      },
      "examples": {
        "ચોર બારીમાંથી અંદર આવ્યો.": {
          "native": "A thief came in through the window.",
          "bases": {
            "ચોર": "thief",
            "બારીમાંથી": "through the window",
            "આવ્યો": "came (masculine)"
          }
        },
        "પોલીસે ચોરને પકડ્યો.": {
          "native": "The police caught the thief.",
          "bases": {
            "પોલીસે": "the police",
            "ચોરને": "thief",
            "પકડ્યો": "caught (masculine)"
          }
        }
      }
    },
    "gu-4690": {
      "native": "theft; robbery",
      "notes": {
        "n1": "The act of stealing. Chori thai means something was stolen."
      },
      "examples": {
        "ઘરમાં ચોરી થઈ.": {
          "native": "There was a theft in the house.",
          "bases": {
            "ઘરમાં": "in the house",
            "ચોરી": "theft; robbery",
            "થઈ": "happened"
          }
        },
        "મારા પાકીટની ચોરી થઈ.": {
          "native": "My wallet was stolen.",
          "bases": {
            "મારા": "my (plural)",
            "પાકીટની": "of the wallet",
            "ચોરી": "theft; robbery",
            "થઈ": "happened"
          }
        }
      }
    },
    "gu-4691": {
      "native": "unconscious",
      "notes": {
        "n1": "Not awake and not aware of what is around. It does not change for gender."
      },
      "examples": {
        "અકસ્માત પછી તે બેભાન થઈ ગયો.": {
          "native": "After the accident he became unconscious.",
          "bases": {
            "પછી": "after",
            "બેભાન": "unconscious",
            "થઈ": "became",
            "ગયો": "gone (masculine)"
          }
        },
        "ડૉક્ટર બેભાન માણસને તપાસે છે.": {
          "native": "The doctor examines the unconscious man.",
          "bases": {
            "બેભાન": "unconscious",
            "માણસને": "the man",
            "તપાસે": "examines",
            "છે": "is"
          }
        }
      }
    },
    "gu-4692": {
      "native": "to get burnt; to scald",
      "notes": {
        "n1": "Used for a burn from fire, hot water or hot milk."
      },
      "examples": {
        "મારો હાથ દાઝ્યો.": {
          "native": "I burnt my hand.",
          "bases": {
            "મારો": "my (masculine)",
            "હાથ": "hand",
            "દાઝ્યો": "to get burnt; to scald"
          }
        },
        "બાળક ગરમ દૂધથી દાઝ્યું.": {
          "native": "The child got burnt by hot milk.",
          "bases": {
            "ગરમ": "hot",
            "દૂધથી": "from milk",
            "દાઝ્યું": "to get burnt; to scald"
          }
        }
      }
    },
    "gu-4693": {
      "native": "danger; risk",
      "notes": {
        "n1": "A risk of harm. Khatro chhe means there is danger."
      },
      "examples": {
        "અહીં ખતરો છે.": {
          "native": "There is danger here.",
          "bases": {
            "અહીં": "here",
            "ખતરો": "danger; risk",
            "છે": "is"
          }
        },
        "ધ્યાન રાખો, ખતરો છે.": {
          "native": "Be careful, there is danger.",
          "bases": {
            "ધ્યાન": "attention",
            "રાખો": "keep (polite)",
            "ખતરો": "danger; risk",
            "છે": "is"
          }
        }
      }
    },
    "gu-4694": {
      "native": "death",
      "notes": {
        "n1": "A formal word for death. Use it in news and notices."
      },
      "examples": {
        "અકસ્માતમાં મૃત્યુ થયું.": {
          "native": "There was a death in the accident.",
          "bases": {
            "અકસ્માતમાં": "in the accident",
            "મૃત્યુ": "death",
            "થયું": "happened (neuter)"
          }
        },
        "ઝેરથી મૃત્યુ થઈ શકે છે.": {
          "native": "Death can be caused by poison.",
          "bases": {
            "ઝેરથી": "from poison",
            "મૃત્યુ": "death",
            "થઈ": "happened",
            "શકે": "can",
            "છે": "is"
          }
        }
      }
    },
    "gu-4695": {
      "native": "to be trapped; to get stuck",
      "notes": {
        "n1": "Used when someone cannot get out of a place, such as a lift or a fire."
      },
      "examples": {
        "લિફ્ટમાં લોકો ફસાયા.": {
          "native": "People got trapped in the lift.",
          "bases": {
            "લિફ્ટમાં": "in the lift",
            "લોકો": "people",
            "ફસાયા": "to be trapped; to get stuck"
          }
        },
        "આગમાં એક માણસ ફસાયો.": {
          "native": "A man got trapped in the fire.",
          "bases": {
            "આગમાં": "in the fire",
            "એક": "one",
            "માણસ": "man",
            "ફસાયો": "to be trapped; to get stuck"
          }
        }
      }
    },
    "gu-4696": {
      "native": "to get hurt; to be hit",
      "notes": {
        "n1": "Used for hurting a part of the body by hitting it."
      },
      "examples": {
        "મને પગમાં વાગ્યું.": {
          "native": "I got hurt in the leg.",
          "bases": {
            "મને": "to me",
            "પગમાં": "in the leg",
            "વાગ્યું": "to get hurt; to be hit"
          }
        },
        "બાળકને માથામાં વાગ્યું.": {
          "native": "The child hit his head.",
          "bases": {
            "બાળકને": "the child",
            "માથામાં": "in the head",
            "વાગ્યું": "to get hurt; to be hit"
          }
        }
      }
    },
    "gu-4697": {
      "native": "scream; shriek",
      "notes": {
        "n1": "A loud cry of fear or pain."
      },
      "examples": {
        "અચાનક ચીસ સંભળાઈ.": {
          "native": "Suddenly a scream was heard.",
          "bases": {
            "અચાનક": "suddenly",
            "ચીસ": "scream; shriek",
            "સંભળાઈ": "was heard (feminine)"
          }
        },
        "તેણે ડરથી ચીસ પાડી.": {
          "native": "She screamed in fear.",
          "bases": {
            "તેણે": "she (after a verb)",
            "ડરથી": "from fear",
            "ચીસ": "scream; shriek",
            "પાડી": "let out (feminine)"
          }
        }
      }
    }
  }
