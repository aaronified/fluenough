native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs 3"
description: "Twenty Gujarati proverbs about love, age, honesty, effort, appearances and wit, from the Gujarati Wikiquote proverb lists, each with its literal sense and plain English meaning. Not yet checked by a Gujarati speaker: please report any mistake."
