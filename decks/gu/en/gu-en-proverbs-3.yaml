      "નમે": { meaning: "bows" }
      "તે": { meaning: "that one" }
      "સૌને": { meaning: "to everyone" }
      "ગમે": { meaning: "is liked" }
  "gu-6350":
    native: "Said that a quiet person often has great depth."
    notes:
      "literal": "Word for word: calm water deep are."
