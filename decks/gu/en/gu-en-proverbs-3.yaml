cards:
  "gu-6340":
    native: "Said that affection cannot be produced by compulsion."
    notes:
      "literal": "Word for word: love by force not happens."
    bases:
      "પ્રીત": { meaning: "love" }
      "પરાણે": { meaning: "by force" }
      "ન": { meaning: "not" }
      "થાય": { meaning: "happens" }
  "gu-6341":
    native: "Said that a cheerful person's home prospers and stays full of company."
    notes:
      "literal": "Word for word: laughs his or her house settles."
    bases:
      "હસે": { meaning: "laughs" }
      "તેનું": { meaning: "his or her" }
      "ઘર": { meaning: "house" }
      "વસે": { meaning: "settles" }
  "gu-6342":
    native: "Said that kindness is the basis of right living."
    notes:
      "literal": "Word for word: compassion of dharma root is."
    bases:
      "દયા": { meaning: "compassion" }
      "ધર્મનું": { meaning: "of dharma" }
      "મૂળ": { meaning: "root" }
      "છે": { meaning: "is" }
  "gu-6343":
    native: "Said that a person content with what they have stays happy."
    notes:
      "literal": "Word for word: content man always happy."
    bases:
      "સંતોષી": { meaning: "content" }
      "નર": { meaning: "man" }
      "સદા": { meaning: "always" }
      "સુખી": { meaning: "happy" }
  "gu-6344":
    native: "Said that waiting patiently brings sweet rewards."
    notes:
      "literal": "Word for word: of patience fruit sweet are."
    bases:
      "ધીરજના": { meaning: "of patience" }
      "ફળ": { meaning: "fruit" }
      "મીઠા": { meaning: "sweet" }
      "હોય": { meaning: "are" }
  "gu-6345":
    native: "Said that good results need time and cannot be hurried."
    notes:
      "literal": "Word for word: in haste mango trees not ripen."
    bases:
      "ઉતાવળે": { meaning: "in haste" }
      "આંબા": { meaning: "mango trees" }
      "ન": { meaning: "not" }
      "પાકે": { meaning: "ripen" }
  "gu-6346":
    native: "Said that those who work faithfully are rewarded."
    notes:
      "literal": "Word for word: does service to that one gets dried fruits."
    bases:
      "કરે": { meaning: "does" }
      "સેવા": { meaning: "service" }
      "તેને": { meaning: "to that one" }
      "મળે": { meaning: "gets" }
      "મેવા": { meaning: "dried fruits" }
  "gu-6347":
    native: "Said that people receive what their actions deserve."
    notes:
      "literal": "Word for word: do such get sow such reap."
    bases:
      "કરો": { meaning: "do" }
      "તેવું": { meaning: "such" }
      "પામો": { meaning: "get" }
      "વાવો": { meaning: "sow" }
      "લણો": { meaning: "reap" }
  "gu-6348":
    native: "Said that determination can achieve even a distant goal."
    notes:
      "literal": "Word for word: mind is then to Malwa one can go."
