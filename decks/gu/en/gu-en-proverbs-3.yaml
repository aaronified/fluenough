      "હોય": { meaning: "is" }
      "તો": { meaning: "then" }
      "માળવે": { meaning: "to Malwa" }
      "જવાય": { meaning: "one can go" }
  "gu-6349":
    native: "Said that humility makes a person liked by everyone."
