      "શાંત": { meaning: "calm" }
      "પાણી": { meaning: "water" }
      "ઊંડા": { meaning: "deep" }
      "હોય": { meaning: "are" }
  "gu-6351":
    native: "Said that appearances can mislead."
    notes:
      "literal": "Word for word: shining all that milk not."
