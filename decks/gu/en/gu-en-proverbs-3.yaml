      "ગતિ": { meaning: "course" }
      "નહીં": { meaning: "not" }
  "gu-6359":
    native: "Patience and persistence bring success in the end; this sense is not confirmed here, so a Gujarati speaker should check it."
    notes:
      "literal": "Word for word: will tire then will ripen."
    bases:
      "થાકશે": { meaning: "will tire" }
