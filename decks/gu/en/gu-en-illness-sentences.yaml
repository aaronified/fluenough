"cards":
  "gu-2433":
    "native": "I have a fever and a cold."
    "bases":
      "મને": "to me"
      "છે": "I have"
    "confusables":
      "c1":
        "why": "A cough is a sign of a cold too; this sentence names a fever and a cold."
      "c2":
        "why": "A pain is not a fever; this sentence names a fever and a cold."
      "c3":
        "why": "Illness is the general word; this sentence names two named illnesses."
  "gu-2434":
    "native": "The doctor does a check-up."
    "bases":
      "કરે": "does"
      "છે": "is"
    "confusables":
      "c1":
        "why": "The verb is the action; this sentence names the check-up as a noun."
      "c2":
        "why": "Medicine is given after a check-up; this sentence names the check-up."
  "gu-2435":
    "native": "Take the medicine and rest."
    "bases":
      "લો": "take"
      "કરો": "rest"
    "confusables":
      "c1":
        "why": "A tablet is one form of medicine; this sentence names medicine in general."
      "c2":
        "why": "Sleep is one kind of rest; this sentence names rest and medicine."
  "gu-2436":
    "native": "The child got well."
    "bases":
      "સાજું": "well"
      "થયું": "got"
    "confusables":
      "c1":
        "why": "Okay means fine; this sentence names getting well from an illness."
      "c2":
        "why": "Good is a general word; this sentence names recovering from an illness."
  "gu-2437":
    "native": "I am sleepy."
    "bases":
      "મને": "to me"
      "આવે": "comes"
      "છે": "is"
    "confusables":
      "c1":
        "why": "To lie down is an action; this sentence names sleepiness."
      "c2":
        "why": "Tiredness can make you sleepy; this sentence names sleep itself."
  "gu-2438":
    "native": "There is a nurse in the hospital."
    "bases":
      "હોસ્પિટલમાં": "in the hospital"
      "છે": "there is"
    "confusables":
      "c1":
        "why": "A doctor is also in a hospital; this sentence names the nurse."
      "c2":
        "why": "A clinic is a small hospital; this sentence names a hospital."
  "gu-2439":
    "native": "Tie a bandage on the wound."
    "bases":
      "પર": "on"
      "બાંધો": "tie"
    "confusables":
      "c1":
        "why": "An injury is what is bandaged; this sentence names the bandage."
      "c2":
        "why": "A tablet is taken, not tied on; this sentence names a bandage."
