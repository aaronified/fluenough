schema: 1
id: "gu-en-grammar-differences"
kind: "layer"
core: "gu-grammar-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How Gujarati grammar differs from English"
license: "CC0-1.0"
description: "Before any theme: the verb last, endings for in, from and to, three genders, two yous, two wes, no articles, and how Gujarati says have, not, like and questions. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0239":
    native: "I drink tea."
    notes:
      "n1": "The verb comes last: subject, object, verb. Word for word, 'I tea drink am'. છું (chum̐) is 'am', and the present is built with it."
  "gu-0240":
    native: "He is a doctor; she is a doctor."
    notes:
      "n1": "છે (che), 'is', comes last. તે (te) is both he and she: the context, or the verb in the past, tells you which."
  "gu-0241":
    native: "in the house"
    notes:
      "n1": "Gujarati puts 'in' after the noun, and writes it joined to it: ઘર (ghar, house) + -માં (-mām̐)."
  "gu-0242":
    native: "from the station"
    notes:
      "n1": "'From' is the ending -થી (-thi): સ્ટેશન (sṭeśan) + -થી (-thi). It also means 'by' or 'with' a tool: બસથી (basthi), by bus."
  "gu-0243":
    native: "to Meena"
    notes:
      "n1": "'To' a person is the ending -ને (-ne): મીનાને આપો (mināne āpo), give it to Meena."
  "gu-0244":
    native: "The boy came."
    notes:
      "n1": "Gujarati has three genders, and the past verb shows them. Masculine: -ઓ (-o)."
  "gu-0245":
    native: "The girl came."
    notes:
      "n1": "Feminine: -ઈ (-i)."
  "gu-0246":
    native: "The child came."
    notes:
      "n1": "Neuter: -ઉં (-um̐). Hindi lost its neuter; Gujarati kept it, for children, many things and some animals."
  "gu-0247":
    native: "my brother"
    notes:
      "n1": "'My' agrees with what is owned, not with the owner: મારો ભાઈ (māro bhāi), my brother; મારી બહેન (māri bahen), my sister; મારું ઘર (mārum̐ ghar), my house."
  "gu-0248":
    native: "my sister"
    notes:
      "n1": "મારી (māri) before a feminine noun. A woman says it too: the owner's gender doesn't count."
  "gu-0249":
    native: "my house"
    notes:
      "n1": "મારું (mārum̐) before a neuter noun. ઘર (ghar) is neuter."
  "gu-0250":
    native: "you (to a friend or a child)"
    notes:
      "n1": "Gujarati has two everyday words for 'you'. તું (tum̐) is for close friends, children and family your age or younger. The verb changes with each."
  "gu-0251":
    native: "you (respectful); you (plural)"
    notes:
      "n1": "તમે (tame) is for strangers, elders and anyone you respect, and for more than one person. A learner is always safe with તમે (tame). Very formal Gujarati has આપ (āp)."
  "gu-0252":
    native: "we (not you)"
    notes:
      "n1": "Gujarati has two words for 'we'. અમે (ame) leaves out the person you are talking to: 'we, my family and I, but not you'."
  "gu-0253":
    native: "we (you and I)"
    notes:
      "n1": "આપણે (āpṇe) takes in the person you are talking to: આપણે જઈએ (āpṇe jaie), let's go."
  "gu-0254":
    native: "I have a car."
    notes:
      "n1": "There is no verb 'have'. Word for word, 'near me a car is'."
  "gu-0255":
    native: "I am not a doctor."
    notes:
      "n1": "નથી (nathi) is 'am not, is not, are not', for every person. It takes the place of છું (chum̐) or છે (che)."
  "gu-0256":
    native: "Do you speak Gujarati?"
    notes:
      "n1": "શું (śum̐) at the start makes a yes-or-no question. It can be left out: then the voice rises at the end. Elsewhere in a sentence શું (śum̐) is 'what'."
  "gu-0257":
    native: "I ate a banana."
    notes:
      "n1": "In the past, a verb with an object works differently: the doer takes the ending -એ (-e) (હું (hum̐) becomes મેં (mem̐), men) and the verb agrees with the thing eaten. કેળું (keḷum̐) is neuter, so ખાધું (khādhum̐)."
  "gu-0258":
    native: "I like tea."
    notes:
      "n1": "Word for word, 'to me tea is pleasing'. The one who likes takes -ને (-ne): મને (mane), to me."
  "gu-0259":
    native: "a boy"
    notes:
      "n1": "Gujarati has no 'a' or 'the'. એક (ek), 'one', can do the work of 'a'; often nothing is needed: છોકરો આવ્યો (chokro āvyo), the boy came, or a boy came."
