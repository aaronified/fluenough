    "unreviewed"
  ],
  "pattern": {
    "name": "Indefinite word",
    "slot_name": "form",
    "prompt": "{lemma} ({gloss}), {slot}",
    "slots": {
      "statement": "in a statement (some)",
      "question or negative": "in a question, or with na (any, no)"
    },
    "entries": {
      "koi": "someone; anyone",
      "kani": "something; anything",
      "kya": "somewhere; anywhere",
      "kyare": "sometimes; ever"
    },
    "notes": "Use the statement form for some. In a question, or with the word na (not), use the other form: nobody came is the question form with na, and nowhere is the same form with na."
