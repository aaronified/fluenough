  "name": "Indefinite words: some, any and no",
  "license": "CC-BY-SA-4.0",
  "description": "Someone, something, somewhere and sometimes: the statement form and the form used in questions and with na (not). Not yet checked by a Gujarati speaker: please report any mistake.",
