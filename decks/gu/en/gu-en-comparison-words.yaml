"id": "gu-en-comparison-words"
"kind": "layer"
"core": "gu-comparison-words"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Comparison: than and most"
"license": "CC-BY-SA-4.0"
"description": "Two words for comparing: કરતાં (karatām̐), 'than', and સૌથી (sauthi), 'most'. Not yet checked by a Gujarati speaker: please report any mistake."
"cards":
  "gu-2735":
    "native": "than; compared with"
    "notes":
      "n1": "Comes straight after the thing you compare with, as in 'than this'."
    "examples":
      "મને આ કરતાં તે વધારે ગમે છે.":
        "native": "I like that more than this."
        "bases":
          "કરતાં": "than; compared with"
          "તે": "he; she; it"
          "વધારે": "more"
          "ગમે": "to like"
          "છે": "to be"
      "મારું ઘર તમારા કરતાં મોટું છે.":
        "native": "My house is bigger than yours."
        "bases":
          "મારું": "my"
          "તમારા": "your"
          "કરતાં": "than; compared with"
          "મોટું": "big"
          "છે": "to be"
  "gu-2736":
    "native": "most; the most"
    "notes":
      "n1": "Comes before the adjective to make the superlative; the adjective keeps its basic form."
    "examples":
      "આ બધામાં સૌથી મોંઘું છે.":
        "native": "This is the most expensive of all."
        "bases":
          "બધામાં": "all; everyone"
          "સૌથી": "most"
          "છે": "to be"
      "આ બધામાં સૌથી સારું છે.":
        "native": "This is the best of all."
        "bases":
          "બધામાં": "all; everyone"
          "સૌથી": "most"
          "છે": "to be"
