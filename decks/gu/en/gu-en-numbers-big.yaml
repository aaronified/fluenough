  "gu-0210":
    native: "1,000, a thousand"
    notes:
      "n1": "બે હજાર (be hajār) is 2,000. બે હજાર પચ્ચીસ (be hajār paccis) is 2025."
  "gu-0211":
    native: "100,000, a lakh"
    notes:
      "n1": "Indian numbers group by lakhs and crores, not millions: 1,00,000 is એક લાખ (ek lākh)."
  "gu-0212":
    native: "10,000,000, a crore"
    notes:
      "n1": "A hundred lakh: 1,00,00,000."
  "gu-0213":
    native: "half"
    notes:
      "n1": "It agrees like an adjective: અડધો કલાક (aḍadho kalāk), half an hour; અડધી રોટલી (aḍadhi roṭli), half a chapati."
  "gu-0214":
    native: "one and a half"
    notes:
      "n1": "દોઢ કિલો (doḍh kilo), a kilo and a half. દોઢસો (doḍhso) is 150."
  "gu-0215":
    native: "two and a half"
    notes:
      "n1": "અઢી વાગ્યા (aḍhi vāgyā), half past two. અઢીસો (aḍhiso) is 250: અઢીસો ગ્રામ (aḍhiso grām), 250 grams."
  "gu-0216":
    native: "and a half (from three on)"
    notes:
      "n1": "Before a number from three up: સાડા ત્રણ (sāḍā traṇ), three and a half; સાડા પાંચ વાગ્યા (sāḍā pāñc vāgyā), half past five."
  "gu-0217":
    native: "and a quarter"
    notes:
      "n1": "સવા બે (savā be), two and a quarter; સવા છ વાગ્યા (savā cha vāgyā), a quarter past six."
  "gu-0218":
    native: "a quarter less"
    notes:
      "n1": "પોણા ચાર (poṇā cār) is three and three quarters, a quarter less than four: પોણા ચાર વાગ્યા (poṇā cār vāgyā), a quarter to four."
