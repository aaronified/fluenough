native: { code: "en", iso639_3: "eng", name: "English" }
name: "Tens and big numbers"
license: "CC0-1.0"
description: "Every number from 21 to 99, the hundreds, a thousand, lakh and crore, and the halves and quarters every market uses. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0129":
    native: "21, twenty-one"
    notes:
      "n1": "Every number from 21 to 99 has its own word in Gujarati: 26 is છવ્વીસ (chavvis), not 'twenty six'. Most show their parts (એક (ek), one, and વીસ (vis), twenty, here), but they are learned one at a time, and this deck teaches every one."
