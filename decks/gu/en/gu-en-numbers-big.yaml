  "gu-0208":
    native: "100, a hundred"
    notes:
      "n1": "A hundred on its own is સો (so); with more after it, એકસો (ekso): એકસો પાંચ (ekso pāñc), 105. The hundreds are written as one word: ત્રણસો (traṇso), 300."
  "gu-0209":
    native: "200, two hundred"
    notes:
      "n1": "Not બે સો (be so): two hundred has its own short form."
