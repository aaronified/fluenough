schema: 1
id: "gu-en-script"
kind: "layer"
core: "gu-script"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How Gujarati script works"
intro: "Gujarati script is a close cousin of Devanagari, the script of Hindi and Marathi, and is built from the same few ideas, which come back in letter after letter. They look strange at first because English has none of them. Once you have seen them, the letters start to make sense."
features:
  "no-headline":
    name: "No line along the top"
    text: "Hindi letters hang from a line along the top. Gujarati letters don't: each stands on its own, and words are told apart by spaces alone. Many letters look like a Devanagari letter with the line taken away."
  "own-shapes":
    name: "Letters with shapes of their own"
    text: "Some letters look nothing like their Devanagari cousins, so learn them as new: અ (a), ઇ (i), ખ (kha), જ (ja), ઝ (jha), ણ (ṇa), શ (śa) and ળ (ḷa)."
  "rows":
    name: "Rows of five"
    text: "Most consonants come in five rows of five. Each row is made in about one place in the mouth: ક (ka) at the back, ચ (ca) against the palate, ટ (ṭa) with the tongue curled back, ત (ta) on the teeth, પ (pa) at the lips. The columns work the same way in every row: plain (ક), with a breath (ખ), voiced (ગ), voiced with a breath (ઘ), and through the nose (ઙ). ઙ (ṅa) and ઞ (ña) are rare: the dot ં (am̐) is written in their place."
  "inherent-vowel":
    name: "The vowel you don't see"
    text: "Every consonant carries a short a, said like the u of 'but', unless a sign changes it: ક (ka) alone is ka."
  "final-a":
    name: "The last a usually isn't said"
    text: "At the end of most words the carried a goes quiet: ઘર (ghar) is ghar, કમળ (kamaḷ) is kamal. Inside longer words it often goes quiet too: છોકરો (chokro) is chhokro, not chhokaro. Learn each word as it's said."
  "vowel-signs":
    name: "Vowels as signs on a letter"
    text: "After a consonant a vowel is a sign on it, not a letter of its own. િ (i) is written before the consonant but said after it: you see િ (i) then ક (ka), and say ki. ે (e) and ૈ (ai) sit above, ુ (u), ૂ (u) and ૃ (ru) below, the rest after. The table of every consonant with every sign is the બારાખડી (bārākhḍi), which children chant at school."
  "half-letters":
    name: "Half letters"
    text: "Two consonants with no vowel between them join. Usually the first is written as a half letter, without its upright stroke: પ્યાલો (pyālo, cup). Some stack one above the other: ટ્ટ (ṭṭ), દ્ધ (ddha)."
  "special-joins":
    name: "Joins with shapes of their own"
    text: "A few joins look nothing like their parts: ક્ષ (kśa) is ક (ka) and ષ (śa), જ્ઞ (gna) is જ (ja) and ઞ (ña), ત્ર (tra) is ત (ta) and ર (ra), શ્ર (śra) is શ (śa) and ર (ra), દ્ર (dra) is દ (da) and ર (ra). Gujarati says જ્ઞ (gna) as gn: જ્ઞાન (gnān) is gnan, knowledge."
  "r-forms":
    name: "ર (ra) written as a stroke"
    text: "Next to another consonant ર (ra) isn't written in full. After it, it's a small slanting stroke at its foot (પ્ર), or a caret under a letter such as ટ (ṭa) (ટ્ર (ṭra)); before it, a small hook on top of the next letter (ર્મ (rma) in ધર્મ (dharm))."
  "halant":
    name: "The mark that takes the vowel away"
    text: "The small slanting stroke below a letter, ્, means no vowel after it. You'll rarely see it, because two consonants usually join instead."
  "dot":
    name: "The dot above"
    text: "A dot above a letter makes its vowel nasal, said through the nose as well: હું (hum̐, I), છું (chum̐, am). Before a consonant it is the n or m that suits it: પંદર (pandar, fifteen). Gujarati writes the dot almost everywhere Hindi would write the moon ँ (am̐)."
  "moon":
    name: "The moon for English vowels"
    text: "A small moon above a vowel marks the open sounds of English words: ઑ (ô) in ઑફિસ (ôfis, office), ૅ (ê) in બૅન્ક (bênk, bank). Many writers leave the moon out."
  "curled-back":
    name: "Two curled-back letters Gujarati loves"
    text: "ણ (n with the tongue curled back) and ળ (l with the tongue curled back) are everywhere in Gujarati, though never at the start of a word: પાણી (pāṇi, water), સોળ (soḷ, sixteen), કેળું (keḷum̐, banana)."
  "digits":
    name: "Gujarati digits"
    text: "Gujarati has its own digits, seen in schoolbooks, calendars and some newspapers. Much everyday writing uses 0 to 9."
