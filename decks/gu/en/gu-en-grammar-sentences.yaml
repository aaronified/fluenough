schema: 1
id: "gu-en-grammar-sentences"
kind: "layer"
core: "gu-grammar-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Simple sentences"
license: "CC0-1.0"
description: "How a Gujarati sentence is built: the doer first, the verb last, and everything else between. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0273":
    native: "This is my house."
    notes:
      "n1": "આ (ā) is 'this', and છે (che), 'is', comes at the end."
    bases:
      "મારું": "my"
      "છે": "to be"
  "gu-0274":
    native: "My name is Meena."
    notes:
      "n1": "નામ (nām) is neuter, so 'my' is મારું (mārum̐)."
    bases:
      "મારું": "my"
      "મીના": "Meena (a woman's name)"
      "છે": "to be"
  "gu-0275":
    native: "We live in Ahmedabad."
    notes:
      "n1": "The place comes before the verb: 'we Ahmedabad-in live are'."
    bases:
      "અમદાવાદમાં": "Ahmedabad"
      "રહીએ": "to live; to stay"
      "છીએ": "to be"
  "gu-0276":
    native: "She goes to school."
    notes:
      "n1": "-એ (-e) on a place can mean 'to' or 'at': શાળાએ (śāḷāe), to school; ઘરે (ghare), at home or home. તે (te) is he or she."
    bases:
      "તે": "he; she; it; that"
      "છે": "to be"
  "gu-0277":
    native: "Ma is in the kitchen."
    notes:
      "n1": "Before an ending, રસોડું (rasoḍum̐, kitchen) becomes રસોડા- (rasoḍā-)."
    bases:
      "છે": "to be"
  "gu-0278":
    native: "I drink milk every day."
    notes:
      "n1": "A time word such as રોજ (roj, every day) comes early, after the doer."
    bases:
      "હું": "I"
      "રોજ": "every day"
      "છું": "to be"
  "gu-0279":
    native: "Dad is reading the newspaper."
    notes:
      "n1": "The present does for both 'reads' and 'is reading'."
    bases:
      "છાપું": "newspaper"
      "છે": "to be"
  "gu-0280":
    native: "The tea is hot."
    notes:
      "n1": "An adjective after the noun, before છે (che), says what it is like."
    bases:
      "છે": "to be"
  "gu-0281":
    native: "Where are you going?"
    notes:
      "n1": "A question word sits where the answer would: 'you where go are?'. Asked in passing, it is a friendly greeting more than a question."
    bases:
      "છો": "to be"
  "gu-0282":
    native: "I'll go to Mumbai tomorrow."
    notes:
      "n1": "With a verb of going, the place often takes no ending at all."
    bases:
      "હું": "I"
      "મુંબઈ": "Mumbai"
