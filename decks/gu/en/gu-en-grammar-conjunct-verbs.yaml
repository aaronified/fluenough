schema: 1
id: "gu-en-grammar-conjunct-verbs"
kind: "layer"
core: "gu-grammar-conjunct-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs made with do, come and strike"
license: "CC0-1.0"
description: "Many Gujarati verbs are a noun and કરવું (do), આવવું (come) or લાગવું (strike): help-do, memory-come, hunger-strike. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0539":
    native: "to help"
    notes:
      "n1": "Literally 'to do help'. The -વું (-vum̐) of the verb agrees with the noun: મદદ (madad) is feminine, so કરવી (karvi). મને મદદ કરો (mane madad karo), help me."
    bases:
      "કરવી": "to do; to make"
  "gu-0540":
    native: "to talk; to chat"
    notes:
      "n1": "વાત (talk) is feminine, so કરવી (karvi). મારે તમારી સાથે વાત કરવી છે (māre tamāri sāthe vāt karvi che), I want to talk to you."
    bases:
      "વાત": "talk; matter"
      "કરવી": "to do; to make"
  "gu-0541":
    native: "to work"
    notes:
      "n1": "કામ (kām) is neuter, so the plain કરવું (karvum̐)."
    bases:
      "કરવું": "to do; to make"
  "gu-0542":
    native: "to phone"
    notes:
      "n1": "ફોન (phon) is masculine, so કરવો (karvo). મને ફોન કરજો (mane fon karjo), give me a call."
    bases:
      "ફોન": "phone"
      "કરવો": "to do; to make"
  "gu-0543":
    native: "to rest"
    notes:
      "n1": "આરામ (ārām) is masculine. આરામ કરો (ārām karo), take a rest."
    bases:
      "આરામ": "rest"
      "કરવો": "to do; to make"
  "gu-0544":
    native: "to go shopping"
    bases:
      "ખરીદી": "shopping"
      "કરવી": "to do; to make"
  "gu-0545":
    native: "to start"
    notes:
      "n1": "With થવું (thavum̐), 'to become', it is 'to begin' on its own: ફિલ્મ શરૂ થઈ (philm śaru thai), the film began."
    bases:
      "શરૂ": "start"
      "કરવું": "to do; to make"
  "gu-0546":
    native: "to close; to switch off"
    notes:
      "n1": "પંખો બંધ કરો (paṅkho bandh karo), switch off the fan. દુકાન બંધ છે (dukān bandh che), the shop is closed."
    bases:
      "બંધ": "closed; off"
      "કરવું": "to do; to make"
  "gu-0547":
    native: "to switch on; to start up"
    bases:
      "ચાલુ": "on; running"
      "કરવું": "to do; to make"
  "gu-0548":
    native: "to wait"
    notes:
      "n1": "Literally 'to watch the road'. હું તમારી રાહ જોઉં છું (hum̐ tamāri rāh joum̐ chum̐), I'm waiting for you."
    bases:
      "રાહ": "waiting"
  "gu-0549":
    native: "to remember; to come to mind"
    notes:
      "n1": "The one who remembers takes -ને (-ne): મને યાદ આવ્યું (mane yād āvyum̐), I remembered; literally 'to me memory came'."
    bases:
      "યાદ": "memory"
  "gu-0550":
    native: "I'm hungry."
    notes:
      "n1": "Literally 'hunger has struck me'. ભૂખ (bhukh) is feminine, so લાગી (lāgi)."
    bases:
      "મને": "I"
      "ભૂખ": "hunger"
      "લાગી": "to feel; to seem"
      "છે": "to be"
  "gu-0551":
    native: "I'm thirsty."
    bases:
      "મને": "I"
      "તરસ": "thirst"
      "લાગી": "to feel; to seem"
      "છે": "to be"
  "gu-0552":
    native: "I feel cold."
    notes:
      "n1": "Also ગરમી લાગે છે (garmi lāge che), I feel hot."
    bases:
      "મને": "I"
      "ઠંડી": "cold"
      "લાગે": "to feel; to seem"
      "છે": "to be"
