native: { code: "en", iso639_3: "eng", name: "English" }
name: "Gujarati digits"
description: "The ten digits, 0 to 9, that Gujarati uses in schoolbooks, calendars and some newspapers. Much everyday writing uses the Latin 0 to 9. Not yet checked by a Gujarati speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "gu-0668":
    native: "0 (zero)"
    notes:
      "n1": "A small round circle. Do not confuse it with the anusvara ં (ṁ), the dot written above a letter, as in સંસ્કૃત (saṁskṛt, Sanskrit). A digit stands alone in a number; ં is part of a word."
  "gu-0669":
    native: "1 (one)"
    notes:
      "n1": "The Gujarati form of 1, not the Latin 1. Its word is એક (ek)."
  "gu-0670":
    native: "2 (two)"
    notes:
      "n1": "The Gujarati form of 2, not the Latin 2. Its word is બે (be)."
  "gu-0671":
    native: "3 (three)"
    notes:
      "n1": "The Gujarati form of 3, not the Latin 3. Its word is ત્રણ (traṇ)."
  "gu-0672":
    native: "4 (four)"
    notes:
      "n1": "The Gujarati form of 4, not the Latin 4. Its word is ચાર (cār)."
  "gu-0673":
    native: "5 (five)"
    notes:
      "n1": "The Gujarati form of 5, not the Latin 5. Its word is પાંચ (pāñc)."
  "gu-0674":
    native: "6 (six)"
    notes:
      "n1": "The Gujarati form of 6, not the Latin 6. Its word is છ (cha)."
  "gu-0675":
    native: "7 (seven)"
    notes:
      "n1": "The Gujarati form of 7, not the Latin 7. Its word is સાત (sāt)."
  "gu-0676":
    native: "8 (eight)"
    notes:
      "n1": "The Gujarati form of 8, not the Latin 8. Its word is આઠ (āṭh)."
  "gu-0677":
    native: "9 (nine)"
    notes:
      "n1": "The Gujarati form of 9, not the Latin 9. Its word is નવ (nav)."
