schema: 1
id: "gu-en-grammar-likes"
kind: "layer"
core: "gu-grammar-likes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Likes, knowing and feelings"
license: "CC0-1.0"
description: "To me tea is pleasing: likes, feelings and knowing put the person in -ને (-ne) and make the thing the subject. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0258":
    notes:
      "n1": "ગમવું (gamvum̐), 'to please'. The thing liked is the subject; the one who likes takes -ને (-ne)."
  "gu-0589":
    native: "I love Gujarati food."
    notes:
      "n1": "બહુ ગમે છે (bahu game che), 'pleases a lot', is the everyday 'love'. ખાવાનું (khāvānum̐) is 'food', literally 'the eating'."
  "gu-0590":
    native: "What do you like?"
  "gu-0591":
    native: "I don't like that."
    notes:
      "n1": "With નથી (nathi), ગમે (game) becomes ગમતું (gamtum̐), and agrees: મને ચા નથી ગમતી (mane cā nathi gamti)."
  "gu-0592":
    native: "I liked it."
  "gu-0593":
    native: "I like watching cricket."
    notes:
      "n1": "A verb as the thing liked takes -વાનું (-vānum̐): જોવાનું (jovānum̐), watching."
  "gu-0594":
    native: "You'll like it."
  "gu-0595":
    native: "I enjoyed it; I had fun."
    notes:
      "n1": "Literally 'fun came to me'."
  "gu-0596":
    native: "I know."
    notes:
      "n1": "Knowing a fact. Knowing how to do something is આવડવું (āvḍvum̐): મને તરતાં આવડે છે (mane tartām̐ āvḍe che), I can swim."
  "gu-0597":
    native: "I think it will rain."
    notes:
      "n1": "Literally 'it strikes me that rain will fall'."
  "gu-0598":
    native: "I'm scared."
  "gu-0599":
    native: "I'm getting angry."
    notes:
      "n1": "Literally 'anger comes to me'."
