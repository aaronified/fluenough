# Layer for gu-proverbs-1: each proverb's literal sense and plain English meaning, and English glosses of its words.
schema: 1
id: "gu-en-proverbs-1"
kind: "layer"
core: "gu-proverbs-1"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs 1"
description: "Twenty Gujarati proverbs from the Gujarati Wikiquote proverb lists, each with its literal sense and plain English meaning. Not yet checked by a Gujarati speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "gu-6300":
    native: "Said that what comes out shows what went in: a result or manner matches what it was fed."
    notes:
      "literal": "Word for word: food such belch."
    bases:
      "અન્ન": { meaning: "food" }
      "એવો": { meaning: "such" }
      "ઓડકાર": { meaning: "belch" }
  "gu-6301":
    native: "Said that people often overlook what is closest to them, as the base of a lamp stays dark."
    notes:
      "literal": "Word for word: lamp under darkness."
    bases:
      "દીવા": { meaning: "lamp" }
      "તળે": { meaning: "under" }
      "અંધારું": { meaning: "darkness" }
  "gu-6302":
    native: "Said that some people or things are awkward by nature and cannot be made straight."
    notes:
      "literal": "Word for word: of the camel in eighteen limb crooked only is."
    bases:
      "ઊંટના": { meaning: "of the camel" }
      "અઢારે": { meaning: "in eighteen" }
      "અંગ": { meaning: "limb" }
      "વાંકા": { meaning: "crooked" }
      "જ": { meaning: "only" }
      "હોય": { meaning: "is" }
  "gu-6303":
    native: "Said of a one-sided contest where the stronger party toys with the weaker, and the outcome is never in doubt."
    notes:
      "literal": "Word for word: mouse of the cat game."
    bases:
      "ઊંદર": { meaning: "mouse" }
      "બિલાડીની": { meaning: "of the cat" }
      "રમત": { meaning: "game" }
  "gu-6304":
    native: "Said that when too many people direct one task, the task is spoiled."
    notes:
      "literal": "Word for word: many cooks cooking spoil."
    bases:
      "ઝાઝા": { meaning: "many" }
      "રસોઇયા": { meaning: "cooks" }
      "રસોઇ": { meaning: "cooking" }
      "બગાડે": { meaning: "spoil" }
  "gu-6305":
    native: "Said that when many people share the work, it is done well and pleasantly."
    notes:
      "literal": "Word for word: many hands lovely."
    bases:
      "ઝાઝા": { meaning: "many" }
      "હાથ": { meaning: "hands" }
      "રળીયામણા": { meaning: "lovely" }
  "gu-6306":
    native: "Said that a person who plots harm for someone ends up harmed by their own plan."
    notes:
      "literal": "Word for word: pit digs he or she falls."
    bases:
      "ખાડો": { meaning: "pit" }
      "ખોદે": { meaning: "digs" }
      "તે": { meaning: "he or she" }
      "પડે": { meaning: "falls" }
  "gu-6307":
    native: "Said that a fine thing looks wrong on someone who does not deserve it."
    notes:
      "literal": "Word for word: donkey on howdah not suits."
    bases:
      "ગધેડા": { meaning: "donkey" }
      "ઉપર": { meaning: "on" }
      "અંબાડી": { meaning: "howdah" }
      "ન": { meaning: "not" }
      "શોભે": { meaning: "suits" }
  "gu-6308":
    native: "Said that one should spend only as much as one has, and live within one's means."
    notes:
      "literal": "Word for word: sheet seeing feet wide one may stretch."
    bases:
      "ચાદર": { meaning: "sheet" }
      "જોઈને": { meaning: "seeing" }
      "પગ": { meaning: "feet" }
      "પહોળા": { meaning: "wide" }
      "કરાય": { meaning: "one may stretch" }
  "gu-6309":
    native: "Said that a sum should be paid now in cash, rather than promised for later on credit."
    notes:
      "literal": "Word for word: today cash tomorrow on credit."
    bases:
      "આજ": { meaning: "today" }
      "રોકડા": { meaning: "cash" }
      "કાલ": { meaning: "tomorrow" }
      "ઉધાર": { meaning: "on credit" }
  "gu-6310":
    native: "Said that a daughter is entrusted to her husband's family, like a deposit kept for someone else."
    notes:
      "literal": "Word for word: daughter then of another deposit is called."
    bases:
      "દીકરી": { meaning: "daughter" }
      "તો": { meaning: "then" }
      "પારકી": { meaning: "of another" }
      "થાપણ": { meaning: "deposit" }
      "કહેવાય": { meaning: "is called" }
  "gu-6311":
    native: "Said of a miser who would rather be hurt than spend a single coin."
    notes:
      "literal": "Word for word: skin breaks but coin not comes loose."
    bases:
      "ચમડી": { meaning: "skin" }
      "તૂટે": { meaning: "breaks" }
      "પણ": { meaning: "but" }
      "દમડી": { meaning: "coin" }
      "ન": { meaning: "not" }
      "છૂટે": { meaning: "comes loose" }
  "gu-6312":
    native: "Said that quarrels within a family ruin the family."
    notes:
      "literal": "Word for word: house breaks house goes."
    bases:
      "ઘર": { meaning: "house" }
      "ફૂટે": { meaning: "breaks" }
      "જાય": { meaning: "goes" }
  "gu-6313":
    native: "Said that when other remedies fail, a simple one such as buttermilk is tried last."
    notes:
      "literal": "Word for word: last remedy buttermilk."
    bases:
      "છેલ્લું": { meaning: "last" }
      "ઓસડ": { meaning: "remedy" }
      "છાશ": { meaning: "buttermilk" }
  "gu-6314":
    native: "Said of someone who belongs nowhere, and is at home neither here nor there."
    notes:
      "literal": "Word for word: of the washerman dog not of the house not of the ghat."
    bases:
      "ધોબીનો": { meaning: "of the washerman" }
      "કૂતરો": { meaning: "dog" }
      "નહિ": { meaning: "not" }
      "ઘરનો": { meaning: "of the house" }
      "ઘાટનો": { meaning: "of the ghat" }
  "gu-6315":
    native: "Said that misfortune gathers on someone who is already weak or in need."
    notes:
      "literal": "Word for word: weak to the cow ticks many."
    bases:
      "નબળી": { meaning: "weak" }
      "ગાયને": { meaning: "to the cow" }
      "બગાઈ": { meaning: "ticks" }
      "ઝાઝી": { meaning: "many" }
  "gu-6316":
    native: "Said that each generation outdoes the last, so the son surpasses the father."
    notes:
      "literal": "Word for word: father a measure then son one and a quarter a measure."
    bases:
      "બાપ": { meaning: "father" }
      "શેર": { meaning: "a measure" }
      "તો": { meaning: "then" }
      "દીકરો": { meaning: "son" }
      "સવા": { meaning: "one and a quarter" }
  "gu-6317":
    native: "Plain meaning not confirmed from a source here: said of people at home who are both the healers and the noise; a Gujarati speaker should check it."
    notes:
      "literal": "Word for word: of the house spirit healer and of the house drums."
    bases:
      "ઘરના": { meaning: "of the house" }
      "ભુવા": { meaning: "spirit healer" }
      "ને": { meaning: "and" }
      "ડાકલાં": { meaning: "drums" }
  "gu-6318":
    native: "Said that each season suits a different kind of person: winter suits the comfortable and summer suits the one who endures."
    notes:
      "literal": "Word for word: winter of the one who enjoys summer of the ascetic."
    bases:
      "શિયાળો": { meaning: "winter" }
      "ભોગીનો": { meaning: "of the one who enjoys" }
      "ઉનાળો": { meaning: "summer" }
      "જોગીનો": { meaning: "of the ascetic" }
  "gu-6319":
    native: "Said of someone who lives showily while having little or no money."
    notes:
      "literal": "Word for word: pockets empty and show great."
    bases:
      "ખિસ્સા": { meaning: "pockets" }
      "ખાલી": { meaning: "empty" }
      "ને": { meaning: "and" }
      "ભભકો": { meaning: "show" }
      "ભારી": { meaning: "great" }
