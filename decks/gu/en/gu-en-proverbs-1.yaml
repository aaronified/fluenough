cards:
  "gu-6300":
    native: "Such is the food, such is the belch."
    notes:
      "literal": "Said that what comes out shows what went in: a result or manner matches what it was fed."
    bases:
      "અન્ન": { meaning: "food" }
      "એવો": { meaning: "such" }
      "ઓડકાર": { meaning: "belch" }
  "gu-6301":
    native: "Darkness under the lamp."
    notes:
      "literal": "Said that people often overlook what is closest to them, as the base of a lamp stays dark."
    bases:
      "દીવા": { meaning: "lamp" }
      "તળે": { meaning: "under" }
      "અંધારું": { meaning: "darkness" }
  "gu-6302":
    native: "A camel's eighteen limbs are always crooked."
    notes:
      "literal": "Said that some people or things are awkward by nature and cannot be made straight."
    bases:
      "ઊંટના": { meaning: "of the camel" }
      "અઢારે": { meaning: "in eighteen" }
      "અંગ": { meaning: "limb" }
      "વાંકા": { meaning: "crooked" }
      "જ": { meaning: "only" }
      "હોય": { meaning: "is" }
  "gu-6303":
    native: "The mouse and cat's game."
    notes:
      "literal": "Said of a one-sided contest where the stronger party toys with the weaker, and the outcome is never in doubt."
    bases:
      "ઊંદર": { meaning: "mouse" }
      "બિલાડીની": { meaning: "of the cat" }
      "રમત": { meaning: "game" }
  "gu-6304":
    native: "Too many cooks spoil the meal."
    notes:
      "literal": "Said that when too many people direct one task, the task is spoiled."
    bases:
      "ઝાઝા": { meaning: "many" }
      "રસોઇયા": { meaning: "cooks" }
      "રસોઇ": { meaning: "cooking" }
      "બગાડે": { meaning: "spoil" }
  "gu-6305":
    native: "Many hands make the work look lovely."
    notes:
      "literal": "Said that when many people share the work, it is done well and pleasantly."
    bases:
      "ઝાઝા": { meaning: "many" }
      "હાથ": { meaning: "hands" }
      "રળીયામણા": { meaning: "lovely" }
  "gu-6306":
    native: "Whoever digs a pit falls into it."
    notes:
      "literal": "Said that a person who plots harm for someone ends up harmed by their own plan."
    bases:
      "ખાડો": { meaning: "pit" }
      "ખોદે": { meaning: "digs" }
      "તે": { meaning: "he or she" }
      "પડે": { meaning: "falls" }
  "gu-6307":
    native: "A howdah does not suit a donkey."
    notes:
      "literal": "Said that a fine thing looks wrong on someone who does not deserve it."
    bases:
      "ગધેડા": { meaning: "donkey" }
      "ઉપર": { meaning: "on" }
      "અંબાડી": { meaning: "howdah" }
      "ન": { meaning: "not" }
      "શોભે": { meaning: "suits" }
  "gu-6308":
    native: "Stretch your legs only as far as the sheet reaches."
    notes:
      "literal": "Said that one should spend only as much as one has, and live within one's means."
    bases:
      "ચાદર": { meaning: "sheet" }
      "જોઈને": { meaning: "seeing" }
      "પગ": { meaning: "feet" }
      "પહોળા": { meaning: "wide" }
      "કરાય": { meaning: "one may stretch" }
  "gu-6309":
    native: "Cash today, credit tomorrow."
    notes:
      "literal": "Said that a sum should be paid now in cash, rather than promised for later on credit."
    bases:
      "આજ": { meaning: "today" }
      "રોકડા": { meaning: "cash" }
      "કાલ": { meaning: "tomorrow" }
      "ઉધાર": { meaning: "on credit" }
  "gu-6310":
    native: "A daughter is called another's deposit."
    notes:
      "literal": "Said that a daughter is entrusted to her husband's family, like a deposit kept for someone else."
    bases:
      "દીકરી": { meaning: "daughter" }
      "તો": { meaning: "then" }
      "પારકી": { meaning: "of another" }
      "થાપણ": { meaning: "deposit" }
      "કહેવાય": { meaning: "is called" }
  "gu-6311":
    native: "The skin may tear, but the coin will not come loose."
    notes:
      "literal": "Said of a miser who would rather be hurt than spend a single coin."
    bases:
      "ચમડી": { meaning: "skin" }
      "તૂટે": { meaning: "breaks" }
      "પણ": { meaning: "but" }
      "દમડી": { meaning: "coin" }
      "ન": { meaning: "not" }
      "છૂટે": { meaning: "comes loose" }
  "gu-6312":
    native: "When a house breaks, the house is lost."
    notes:
      "literal": "Said that quarrels within a family ruin the family."
    bases:
      "ઘર": { meaning: "house" }
      "ફૂટે": { meaning: "breaks" }
      "જાય": { meaning: "goes" }
  "gu-6313":
    native: "Buttermilk is the last remedy."
    notes:
      "literal": "Said that when other remedies fail, a simple one such as buttermilk is tried last."
    bases:
      "છેલ્લું": { meaning: "last" }
      "ઓસડ": { meaning: "remedy" }
      "છાશ": { meaning: "buttermilk" }
  "gu-6314":
    native: "The washerman's dog belongs neither to the house nor to the ghat."
    notes:
      "literal": "Said of someone who belongs nowhere, and is at home neither here nor there."
    bases:
      "ધોબીનો": { meaning: "of the washerman" }
      "કૂતરો": { meaning: "dog" }
      "નહિ": { meaning: "not" }
      "ઘરનો": { meaning: "of the house" }
      "ઘાટનો": { meaning: "of the ghat" }
  "gu-6315":
    native: "A weak cow has many ticks."
    notes:
      "literal": "Said that misfortune gathers on someone who is already weak or in need."
    bases:
      "નબળી": { meaning: "weak" }
      "ગાયને": { meaning: "to the cow" }
      "બગાઈ": { meaning: "ticks" }
      "ઝાઝી": { meaning: "many" }
  "gu-6316":
    native: "If the father is a sher, the son is a sher and a quarter."
    notes:
      "literal": "Said that each generation outdoes the last, so the son surpasses the father."
    bases:
      "બાપ": { meaning: "father" }
      "શેર": { meaning: "a measure" }
      "તો": { meaning: "then" }
      "દીકરો": { meaning: "son" }
      "સવા": { meaning: "one and a quarter" }
  "gu-6317":
    native: "The house's own spirit healer and the house's own drums."
    notes:
      "literal": "Plain meaning not confirmed from a source here: said of people at home who are both the healers and the noise; a Gujarati speaker should check it."
    bases:
      "ઘરના": { meaning: "of the house" }
      "ભુવા": { meaning: "spirit healer" }
      "ને": { meaning: "and" }
      "ડાકલાં": { meaning: "drums" }
  "gu-6318":
    native: "Winter belongs to the one who enjoys, summer to the ascetic."
    notes:
      "literal": "Said that each season suits a different kind of person: winter suits the comfortable and summer suits the one who endures."
    bases:
      "શિયાળો": { meaning: "winter" }
      "ભોગીનો": { meaning: "of the one who enjoys" }
      "ઉનાળો": { meaning: "summer" }
      "જોગીનો": { meaning: "of the ascetic" }
  "gu-6319":
    native: "Empty pockets, but a great show."
    notes:
      "literal": "Said of someone who lives showily while having little or no money."
    bases:
      "ખિસ્સા": { meaning: "pockets" }
      "ખાલી": { meaning: "empty" }
      "ને": { meaning: "and" }
      "ભભકો": { meaning: "show" }
      "ભારી": { meaning: "great" }
