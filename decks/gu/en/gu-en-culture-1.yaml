# Layer for gu-culture-1: English renderings and notes.
schema: 1
id: "gu-en-culture-1"
kind: "layer"
core: "gu-culture-1"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: bhakti poets"
description: "Excerpts of bhakti verse by Narsinh Mehta, Mirabai (attributed), Akho, and Premanand, with English renderings and notes. Not yet checked by a Gujarati speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "gu-6000":
    native: "On waking I see no world, and in sleep tangled pleasures appear; the mind is the play of consciousness, and Brahman plays with Brahman."
    notes:
      "n1": "Opening lines of a prabhatiya, a morning devotional song, by Narsinh Mehta, as printed on gu.wikisource."
  "gu-6001":
    native: "You alone, O Hari, are the whole universe, appearing in endless forms; you are the god in the body and the essence in light, and in emptiness you become the word and dwell as the Vedas."
    notes:
      "n1": "The first stanza of a bhajan by Narsinh Mehta, as printed on gu.wikisource; the refrain is left out."
  "gu-6002":
    native: "Vaishnavas are dearer to me than life, so I always long to serve them, and I give up pilgrimage and heaven to go wherever they are."
    notes:
      "n1": "The first stanza of a Vaishnava bhajan by Narsinh Mehta, as printed on gu.wikisource; the refrain is left out."
  "gu-6003":
    native: "Shukji says, listen, king: Sudama's mind is pure; though he is called a householder he is truly an ascetic, and he desires no worldly pleasure at all."
    notes:
      "n1": "The first stanza of the second section of Sudama Charit by Premanand, in which the narrator Shukji (Shukadeva) speaks to King Parikshit."
  "gu-6004":
    native: "When you take up the name of Narayan, you should never give it up."
    notes:
      "n1": "A line of a bhajan by Narsinh Mehta, as printed on gu.wikisource."
  "gu-6005":
    native: "My beloved made the small village of Gokul into Vaikuntha, the heaven of Vishnu."
    notes:
      "n1": "A line of a bhajan by Narsinh Mehta, as printed on gu.wikisource; the village of Gokul is where Krishna grew up."
  "gu-6006":
    native: "Do not take joy and sorrow to heart, for they are shaped together with the body."
    notes:
      "n1": "A line of a bhajan by Narsinh Mehta, as printed on gu.wikisource."
  "gu-6007":
    native: "Softly, softly, softly Hari came to my temple, and I welcomed him with pearls, grandly, grandly, grandly."
    notes:
      "n1": "A refrain-style stanza by Narsinh Mehta, as printed on gu.wikisource."
  "gu-6008":
    native: "Meditate, meditate: the Lord is in the eyes."
    notes:
      "n1": "Opening line of a bhajan by Narsinh Mehta, as printed on gu.wikisource (the other version of the page)."
  "gu-6009":
    native: "It is morning, O lord of my life; the moon has set."
    notes:
      "n1": "Opening line of a song by Narsinh Mehta, as printed on gu.wikisource (the other version of the page)."
  "gu-6010":
    native: "I have recognised Ram in my heart, Rana; I will not come to your house."
    notes:
      "n1": "A line of a song attributed to Mirabai, as printed on gu.wikisource; attribution is to be checked by a reviewer."
  "gu-6011":
    native: "For me, a helpless woman, the great inheritance is the dark one; he is my true jewel."
    notes:
      "n1": "A line of a song attributed to Mirabai, as printed on gu.wikisource; attribution is to be checked by a reviewer."
  "gu-6012":
    native: "Govinda is our life, and the world has become bitter to me."
    notes:
      "n1": "A line of a song attributed to Mirabai, as printed on gu.wikisource; attribution is to be checked by a reviewer."
  "gu-6013":
    native: "Yes, I have become mad, sister; in my madness I have found a virtue."
    notes:
      "n1": "A line of a song attributed to Mirabai, as printed on gu.wikisource; attribution is to be checked by a reviewer."
  "gu-6014":
    native: "I have found Ram, my toy, Rana."
    notes:
      "n1": "A line of a song attributed to Mirabai, as printed on gu.wikisource; attribution is to be checked by a reviewer."
  "gu-6015":
    native: "Oh, no one is a companion in one's karma, Rana; I have no one of my own."
    notes:
      "n1": "A line of a song attributed to Mirabai, as printed on gu.wikisource; attribution is to be checked by a reviewer."
  "gu-6016":
    native: "Those who understood have settled there."
    notes:
      "n1": "A line of a chhappa-style poem by Akho, as printed on gu.wikisource from the Akhani Vani edition named on the page."
  "gu-6017":
    native: "Take up the reins of the guru's knowledge; the saint is in your hand to guide you."
    notes:
      "n1": "A line of Sanandiyu jodine (a poem by Akho), as printed on gu.wikisource."
