cards:
  "gu-6000":
    native: "On waking I see no world, and in sleep tangled pleasures appear; the mind is the play of consciousness, and Brahman plays with Brahman."
    notes:
      "n1": "Opening lines of a prabhatiya, a morning devotional song, by Narsinh Mehta, as printed on gu.wikisource from Bruhad Kavyadohan Granth 1."
  "gu-6001":
    native: "You alone, O Hari, are the whole universe, appearing in endless forms; you are the god in the body and the essence in light, and in emptiness you become the word and dwell as the Vedas."
    notes:
      "n1": "The first stanza of a bhajan by Narsinh Mehta, as printed on gu.wikisource from Bruhad Kavyadohan Granth 1; the refrain is left out."
  "gu-6002":
    native: "Vaishnavas are dearer to me than life, so I always long to serve them, and I give up pilgrimage and heaven to go wherever they are."
    notes:
      "n1": "The first stanza of a Vaishnava bhajan by Narsinh Mehta, as printed on gu.wikisource; the refrain is left out."
  "gu-6003":
    native: "Shukji says, listen, king: Sudama's mind is pure; though he is called a householder he is truly an ascetic, and he desires no worldly pleasure at all."
    notes:
      "n1": "The first stanza of the second section of Sudama Charit by Premanand, in which the narrator Shukji (Shukadeva) speaks to King Parikshit."
