schema: 1
id: "gu-en-grammar-postpositions"
kind: "layer"
core: "gu-grammar-postpositions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "In, on, from, with: after the noun"
license: "CC0-1.0"
description: "Gujarati says 'house-in', 'table on', 'me-of with': short endings joined to the noun, and longer words after -ની (-ni) or -ના (-nā). Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0241":
    notes:
      "n1": "-માં (-man), 'in', is written joined to the noun."
  "gu-0433":
    native: "on the table"
    notes:
      "n1": "પર (par), 'on', is written apart. Also ઉપર (upar), 'on top of'."
    bases:
      "પર": "on"
  "gu-0242":
    notes:
      "n1": "-થી (-thi) is 'from', and also 'by' or 'with' a tool."
  "gu-0434":
    native: "on the bus"
    notes:
      "n1": "Gujarati says 'in the bus', as it says 'in the train', ટ્રેનમાં (ṭrenmām̐)."
  "gu-0435":
    native: "with me"
    notes:
      "n1": "સાથે (sāthe), 'with', comes after the -ની (-ni) form: મીનાની સાથે (mināni sāthe), with Meena. Often the -ની (-ni) is dropped: મીના સાથે (minā sāthe)."
    bases:
      "મારી": "my"
      "સાથે": "with"
  "gu-0436":
    native: "for you"
    notes:
      "n1": "માટે (māṭe), 'for', comes after the -ના (-nā) form."
    bases:
      "તમારા": "your"
      "માટે": "for"
  "gu-0437":
    native: "near the shop"
    notes:
      "n1": "પાસે (pāse), 'near', after -ની (-ni)."
  "gu-0438":
    native: "behind the house"
  "gu-0439":
    native: "under the table"
  "gu-0440":
    native: "opposite the temple"
    bases:
      "સામે": "in front of; opposite"
  "gu-0441":
    native: "until noon"
    notes:
      "n1": "સુધી (sudhi), 'until; as far as': સ્ટેશન સુધી (sṭeśan sudhi), as far as the station."
    bases:
      "સુધી": "until"
  "gu-0442":
    native: "Meena's house"
    notes:
      "n1": "-નું (-nun), 'of', agrees with the thing owned: મીનાનો ભાઈ (mināno bhāi), મીનાની ગાડી (mināni gāḍi), મીનાનું ઘર (minānum̐ ghar)."
    bases:
      "મીનાનું": "Meena (a woman's name)"
