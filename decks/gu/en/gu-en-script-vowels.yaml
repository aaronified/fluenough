schema: 1
id: "gu-en-script-vowels"
kind: "layer"
core: "gu-script-vowels"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Gujarati vowels"
license: "CC0-1.0"
description: "The vowels as they are written on their own, at the start of a word. Gujarati spells a short and a long i and u, but says them alike. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0001":
    native: "a, short (the vowel every consonant carries)"
    notes:
      "n1": "Like the 'u' of 'but'. Every consonant carries it unless a sign changes it: ક (ka) is 'ka'. અમદાવાદ (amdāvād, Ahmedabad)."
  "gu-0002":
    native: "aa, long"
    notes:
      "n1": "The 'a' of 'father'. અ (a) and આ (ā) are different sounds and make different words: આજ (āj, today). આ (ā) on its own is also 'this'."
  "gu-0003":
    native: "i, short form"
    notes:
      "n1": "Like the 'ee' of 'see', but short: ઇનામ (inām, prize)."
  "gu-0004":
    native: "ii, long form"
    notes:
      "n1": "Gujarati writes i two ways, short and long, but says them alike: which one a word takes is spelling. ઈંડું (iṇḍum̐, egg). Because it sounds like ઇ (i), it is drilled by reading and writing only."
  "gu-0005":
    native: "u, short form"
    notes:
      "n1": "Like the 'oo' of 'food', but short: ઉનાળો (unāḷo, summer)."
  "gu-0006":
    native: "uu, long form"
    notes:
      "n1": "As with i, the long and short u sound alike in Gujarati: ઊંટ (uṇṭ, camel). Because it sounds like ઉ (u), it is drilled by reading and writing only."
  "gu-0007":
    native: "ru (a vowel letter)"
    notes:
      "n1": "Said 'ru' in Gujarati, though it is written as one vowel, in words from Sanskrit: ઋતુ (rutu, season). A recogniser writes 'ru' as રુ (ru), so it is drilled by reading and writing only."
  "gu-0008":
    native: "e (as in 'café')"
    notes:
      "n1": "Usually the 'e' of 'café', without the glide of English 'say'. In some words it is opener, like the 'e' of 'bed', and the spelling doesn't show which. એક (ek, one). એ (e) on its own is also 'that; he, she'."
  "gu-0009":
    native: "ai (as in 'kite')"
    notes:
      "n1": "A glide from a to i, in words from Sanskrit: ઐતિહાસિક (aitihāsik, historical)."
  "gu-0010":
    native: "o (as in 'go')"
    notes:
      "n1": "Like the 'o' of 'go', without the 'w' English adds at the end. Some words have an opener o, like the 'o' of 'law'. ઓરડો (orḍo, room)."
  "gu-0011":
    native: "au (as in 'cow')"
    notes:
      "n1": "A glide from a to u, in words from Sanskrit: ઔષધ (auśadh, medicine)."
  "gu-0012":
    native: "an (a with the dot: a nasal)"
    notes:
      "n1": "The dot ં (am̐) above makes the vowel nasal, or before a consonant it is an n or m: અંદર (andar, inside). Gujarati lists અં (am̐) among its vowels. It is a mark on a letter rather than a sound of its own, so it is drilled by reading and writing only."
  "gu-0013":
    native: "o, open (as in 'office')"
    notes:
      "n1": "ઓ (o) with a moon on top, for the open o of English words: ઑફિસ (ôfis, office). Many writers leave the moon out, and a recogniser usually does, so it is drilled by reading and writing only."
