    "gu-4100": {
      "native": "pollution",
      "notes": {
        "n1": "It is the harm done to air, water or soil by waste or smoke. The adjective is પ્રદૂષિત (praduśit), polluted."
      },
      "examples": {
        "શહેરમાં પ્રદૂષણ વધ્યું છે.": {
          "native": "Pollution has increased in the city.",
          "bases": {
            "શહેરમાં": "in the city",
            "પ્રદૂષણ": "pollution",
            "વધ્યું": "increased (neuter)",
            "છે": "is"
          }
        },
        "ફેક્ટરીઓથી પ્રદૂષણ થાય છે.": {
          "native": "Factories cause pollution.",
          "bases": {
            "ફેક્ટરીઓથી": "from factories",
            "પ્રદૂષણ": "pollution",
            "થાય": "happens; starts",
            "છે": "is"
          }
        }
      }
    },
    "gu-4101": {
      "native": "environment; the natural surroundings",
      "notes": {
        "n1": "It is the whole of the air, water, land and living things around us. For nature as a whole, see પ્રકૃતિ (prakruti)."
      },
      "examples": {
        "પર્યાવરણ બચાવવું આપણી ફરજ છે.": {
          "native": "Protecting the environment is our duty.",
          "bases": {
            "પર્યાવરણ": "environment; the natural surroundings",
            "આપણી": "our (feminine)",
            "છે": "is"
          }
        },
        "આ કામથી પર્યાવરણને નુકસાન થાય છે.": {
          "native": "This work harms the environment.",
          "bases": {
            "કામથી": "from work",
            "પર્યાવરણને": "to the environment",
            "થાય": "happens; starts",
            "છે": "is"
          }
        }
      }
    },
    "gu-4102": {
      "native": "nature; the natural world",
      "notes": {
        "n1": "It is the natural world as a whole: the trees, animals and land. The word for the forces of nature in the sky is કુદરત (kudarat)."
      },
      "examples": {
        "પ્રકૃતિ સુંદર છે.": {
          "native": "Nature is beautiful.",
          "bases": {
            "પ્રકૃતિ": "nature; the natural world",
            "છે": "is"
          }
        },
        "આપણે પ્રકૃતિની સંભાળ રાખવી જોઈએ.": {
          "native": "We should take care of nature.",
          "bases": {
            "પ્રકૃતિની": "of nature",
            "રાખવી": "keep (feminine)",
            "જોઈએ": "should"
          }
        }
      }
    },
    "gu-4103": {
      "native": "nature; the forces of nature",
      "notes": {
        "n1": "Used for the nature that acts on its own, such as the weather and the seasons. For the natural world as a place, see પ્રકૃતિ (prakruti)."
      },
      "examples": {
        "કુદરત સામે કોઈ જીતી શકે નહીં.": {
          "native": "No one can win against nature.",
          "bases": {
            "કુદરત": "nature; the forces of nature",
            "જીતી": "able to win",
            "શકે": "can",
            "નહીં": "not"
          }
        },
        "કુદરતે આ પૂર મોકલ્યું.": {
          "native": "Nature sent this flood.",
          "bases": {
            "કુદરતે": "nature (as doer)",
            "મોકલ્યું": "sent (neuter)"
          }
        }
      }
    },
    "gu-4104": {
      "native": "energy",
      "notes": {
        "n1": "It is the power that runs machines and lights. Electricity is વીજળી (vijaḷi), one kind of energy."
      },
      "examples": {
        "સૂર્યથી ઊર્જા મળે છે.": {
          "native": "Energy comes from the sun.",
          "bases": {
            "સૂર્યથી": "from the sun",
            "ઊર્જા": "energy",
            "મળે": "comes; is found",
            "છે": "is"
          }
        },
        "સૌર ઊર્જા સસ્તી છે.": {
          "native": "Solar energy is cheap.",
          "bases": {
            "સૌર": "solar",
            "ઊર્જા": "energy",
            "સસ્તી": "cheap (feminine)",
            "છે": "is"
          }
        }
      }
    },
    "gu-4105": {
      "native": "sunlight",
      "notes": {
        "n1": "The light that comes from the sun. Its word is made of સૂર્ય (surya), sun, and પ્રકાશ (prakāś), light."
      },
      "examples": {
        "રૂમમાં સારો સૂર્યપ્રકાશ આવે છે.": {
          "native": "Good sunlight comes into the room.",
          "bases": {
            "રૂમમાં": "in the room",
            "સારો": "good (masculine)",
            "સૂર્યપ્રકાશ": "sunlight",
            "આવે": "comes",
            "છે": "is"
          }
        },
        "છોડને સૂર્યપ્રકાશની જરૂર છે.": {
          "native": "Plants need sunlight.",
          "bases": {
            "છોડને": "to the plant",
            "સૂર્યપ્રકાશની": "of sunlight",
            "જરૂર": "need",
            "છે": "is"
          }
        }
      }
    },
    "gu-4106": {
      "native": "to save; to protect",
      "notes": {
        "n1": "It is used for saving a person, an animal, money or the environment.",
        "n2": "The noun for saving is બચત (bacat), savings, for money."
      },
      "examples": {
        "આપણે પાણી બચાવવું જોઈએ.": {
          "native": "We should save water.",
          "bases": {
            "બચાવવું": "to save; to protect",
            "જોઈએ": "should"
          }
        },
        "તેણે બાળકને તળાવમાંથી બચાવ્યું.": {
          "native": "He saved the child from the pond.",
          "bases": {
            "તેણે": "he (as doer)",
            "બાળકને": "to the child",
            "તળાવમાંથી": "from the pond",
