id: "gu-en-first-words"
kind: "layer"
core: "gu-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "The respect Gujarati builds into 'you': તમે (tame) and તું (tum̐). Greetings and saying you are still learning are in the phrasebook. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0251":
    notes:
      "n1": "Gujarati has two everyday words for 'you': તમે (tame) for strangers, elders and anyone you respect, and તું (tum̐) for friends, children and the very close. The verb changes with each. A learner is always safe with તમે (tame)."
  "gu-0690":
    native: "I"
    notes:
      "n1": "હું (hum̐) is 'I' for everyone, and it never changes. The verb after it does: છું (chum̐), 'I am'."
    examples:
      "હું ઠીક છું.":
        native: "I am fine."
        bases:
          "હું": "I"
          "ઠીક": "fine"
          "છું": "am"
      "હું ગુજરાતી છું.":
        native: "I am Gujarati."
        bases:
          "હું": "I"
          "ગુજરાતી": "Gujarati"
          "છું": "am"
  "gu-0691":
    native: "good; fine"
    notes:
      "n1": "સારું (sāru) is 'good' or 'fine' on its own. Before a noun it changes: સારો (sāro) for a masculine noun, સારી (sārī) for a feminine one."
    examples:
      "બધું સારું છે.":
        native: "Everything is good."
        bases:
          "બધું": "everything"
          "સારું": "good"
          "છે": "is"
      "સારું, આભાર.":
        native: "Fine, thanks."
        bases:
          "સારું": "fine"
          "આભાર": "thanks"
  "gu-0692":
    native: "very"
    notes:
      "n1": "બહુ (bahu) is 'very' before an adjective: બહુ સરસ (bahu saras), very nice. It is also a short answer to thanks in speech, as in બહુ આભાર (bahu ābhār), thank you very much."
    examples:
      "બહુ સરસ છે.":
        native: "It is very nice."
        bases:
          "બહુ": "very"
          "સરસ": "nice"
          "છે": "is"
      "બહુ આભાર.":
        native: "Thank you very much."
        bases:
          "બહુ": "very"
          "આભાર": "thanks"
  "gu-0693":
    native: "here"
    notes:
      "n1": "અહીં (ahīm̐) is 'here'. Its pair is ત્યાં (tyām̐), 'there'. Say અહીં આવો (ahīm̐ āvo), come here, to call someone close."
    examples:
      "અહીં આવો.":
        native: "Come here."
        bases:
          "અહીં": "here"
      "તમે અહીં છો.":
        native: "You are here."
        bases:
          "તમે": "you"
          "અહીં": "here"
          "છો": "are"
  "gu-0694":
    native: "there"
    notes:
      "n1": "ત્યાં (tyām̐) is 'there', over where the speaker is not. Its pair is અહીં (ahīm̐), 'here'."
    examples:
      "ત્યાં ચા છે.":
        native: "There is tea."
        bases:
          "ત્યાં": "there"
          "ચા": "tea"
          "છે": "is"
      "ત્યાં કોણ છે?":
        native: "Who is there?"
        bases:
          "ત્યાં": "there"
          "કોણ": "who"
          "છે": "is"
  "gu-0695":
    native: "okay; all right"
    notes:
      "n1": "ઠીક (ṭhīk) is 'okay', 'all right' or 'correct'. It is a short answer on its own, and it ends a conversation with આવજો (āvjo), bye."
    examples:
      "ઠીક છે, આવજો.":
        native: "Okay, bye."
        bases:
          "ઠીક": "okay"
          "છે": "is"
          "આવજો": "bye"
      "બધું ઠીક છે.":
        native: "Everything is okay."
        bases:
          "બધું": "everything"
          "ઠીક": "okay"
          "છે": "is"
