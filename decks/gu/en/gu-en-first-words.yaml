core: "gu-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC0-1.0"
description: "Greetings, the respect Gujarati builds into them, and how to say you are still learning. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0260":
    native: "hello; goodbye"
    notes:
      "n1": "Said with palms pressed together, to anyone. નમસ્કાર (namaskār) is the same, a little more formal. In a family, younger people often greet elders by touching their feet; a visitor is not expected to."
  "gu-0261":
    native: "How are you?"
    notes:
      "n1": "The everyday greeting, often instead of hello. કેમ (kem) is 'how', and છો (cho) goes with તમે (tame). To a friend: કેમ છે? (kem chhe?)."
  "gu-0262":
    native: "fine; well"
    notes:
      "n1": "The usual answer to કેમ છો (kem cho)?: literally 'in fun'. In full, મજામાં છું (majāmām̐ chum̐), I'm fine."
  "gu-0251":
    notes:
      "n1": "Gujarati has two everyday words for 'you': તમે (tame) for strangers, elders and anyone you respect, and તું (tum̐) for friends, children and the very close. The verb changes with each. A learner is always safe with તમે (tame)."
  "gu-0263":
    native: "thank you"
    notes:
      "n1": "Many people simply say 'thank you' in English, and among family thanks are often left out. ધન્યવાદ (dhanyavād) is more formal."
  "gu-0264":
    native: "goodbye"
    notes:
      "n1": "Literally 'do come (again)', a polite request. Said by both the one leaving and the one staying."
  "gu-0265":
    native: "hello; goodbye (literally, 'glory to Lord Krishna')"
    notes:
      "n1": "A common greeting among many Gujarati Hindus, especially followers of Krishna. Answer it with the same words. Others greet with જય જિનેન્દ્ર (jay jinendra, among Jains) or સલામ (salām)."
  "gu-0266":
    native: "come in; welcome"
    notes:
      "n1": "Said at the door to a guest, often twice: આવો (āvo), આવો (āvo)! It is the polite form of 'come'. Even more polite: પધારો (padhāro)."
  "gu-0267":
    native: "sorry; excuse me"
    notes:
      "n1": "Literally 'please forgive'. The ending -જો (-jo) makes a polite request: બેસજો (besjo), please sit."
  "gu-0268":
    native: "OK; all right"
    notes:
      "n1": "Literally 'it is fine'. Also ભલે (bhale) and સારું (sārum̐), 'good'."
  "gu-0269":
    native: "I don't know Gujarati."
    notes:
      "n1": "Literally 'Gujarati doesn't come to me'. આવડવું (āvaḍvum̐) is knowing how to do something."
  "gu-0270":
    native: "I'm still learning Gujarati."
    notes:
      "n1": "હજી (haji) is 'still; yet'. The present 'I learn' also does for 'I am learning'."
  "gu-0271":
    native: "Could you speak a little slower?"
    notes:
      "n1": "A request put as a question in the future is polite: 'will you speak a little slowly?'. જરા (jarā) is 'a little'."
  "gu-0272":
    native: "Could you say that again?"
    notes:
      "n1": "ફરીથી (pharithi) is 'again'."
