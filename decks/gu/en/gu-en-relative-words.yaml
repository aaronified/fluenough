"id": "gu-en-relative-words"
"kind": "layer"
"core": "gu-relative-words"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Relative and correlative words: who, where, when, as"
"license": "CC-BY-SA-4.0"
"description": "The relative words that start a describing clause (જે (je), જ્યાં (jyām̐), જ્યારે (jyāre), જેમ (jem), જેટલું (jeṭalum̐)) and the words that answer them in the main clause. Not yet checked by a Gujarati speaker: please report any mistake."
"cards":
  "gu-3712":
    "native": "who; which; that"
    "notes":
      "n1": "જે (je) starts the clause that describes a person or thing; the main clause answers with તે (te) (te), as in જે માણસ આવ્યો તે (je māṇas āvyo te) (the man who came)."
    "examples":
      "જે માણસ આવ્યો તે મારો ભાઈ છે.":
        "native": "The man who came is my brother."
        "bases":
          "જે": "who; which; that"
          "માણસ": "person"
          "આવ્યો": "to come"
          "તે": "he; she; it"
          "મારો": "my"
          "ભાઈ": "brother"
          "છે": "to be"
      "જે ફિલ્મ મેં જોઈ તે સારી હતી.":
        "native": "The film that I watched was good."
        "bases":
          "જે": "who; which; that"
          "ફિલ્મ": "film"
          "મેં": "I"
          "જોઈ": "to see; to look"
          "તે": "he; she; it"
          "સારી": "good"
          "હતી": "to be"
  "gu-3713":
    "native": "whose"
    "examples":
      "જેનું ઘર મોટું છે, તેનું નામ મેં સાંભળ્યું હતું.":
        "native": "I had heard the name of the man whose house is big."
        "bases":
          "જેનું": "whose"
          "ઘર": "house; home"
          "મોટું": "big"
          "છે": "to be"
          "તેનું": "his; her; its"
          "નામ": "name"
          "મેં": "I"
          "સાંભળ્યું": "to listen; to hear"
          "હતું": "to be"
      "જેનું નામ લખ્યું હતું, તે આવ્યો.":
        "native": "The one whose name was written came."
        "bases":
          "જેનું": "whose"
          "નામ": "name"
          "લખ્યું": "to write"
          "હતું": "to be"
          "તે": "he; she; it"
          "આવ્યો": "to come"
    "notes":
      "n1": "It agrees with the thing owned: before ઘર (ghar), house, which is neuter, it is જેનું (jenum̐); before a feminine noun it is જેની (jenī)."
  "gu-3714":
    "native": "to whom; to which"
    "examples":
      "જેને મદદ જોઈએ છે, તેને હું કરીશ.":
        "native": "I will help the one who needs help."
        "bases":
          "જેને": "who; which; that"
          "મદદ": "help"
          "જોઈએ": "to need"
          "છે": "to be"
          "તેને": "he; she; it"
          "હું": "I"
          "કરીશ": "to do; to make"
      "જેને ખબર છે, તેને પૂછો.":
        "native": "Ask the one who knows."
        "bases":
          "જેને": "who; which; that"
          "ખબર": "knowledge; news"
          "છે": "to be"
          "તેને": "he; she; it"
          "પૂછો": "to ask"
    "notes":
      "n1": "Its partner in the main clause is તેને (tene), 'to him or her'."
  "gu-3715":
    "native": "where"
    "examples":
      "જ્યાં તમે રહો છો, ત્યાં શાંતિ છે.":
        "native": "Where you live, there is peace."
        "bases":
          "જ્યાં": "where"
          "તમે": "you"
          "રહો": "to stay; to live; to keep a state"
          "છો": "to be"
          "ત્યાં": "there"
          "શાંતિ": "peace"
          "છે": "to be"
      "જ્યાં ભીડ હોય ત્યાં ન જાઓ.":
        "native": "Do not go where there is a crowd."
        "bases":
          "જ્યાં": "where"
          "ભીડ": "crowd"
          "હોય": "to be"
          "ત્યાં": "there"
          "ન": "not"
          "જાઓ": "to go"
    "notes":
      "n1": "It pairs with ત્યાં (tyām̐), 'there', in the main clause."
  "gu-3716":
    "native": "when"
    "examples":
      "જ્યારે વરસાદ પડે, ત્યારે ઘરમાં રહો.":
        "native": "When it rains, stay at home."
        "bases":
          "જ્યારે": "when"
          "વરસાદ": "rain"
          "પડે": "to fall; to be necessary"
          "ત્યારે": "then; at that time"
          "ઘરમાં": "house; home"
          "રહો": "to stay; to live; to keep a state"
      "જ્યારે હું નાનો હતો, ત્યારે અમે ગામમાં રહેતા હતા.":
        "native": "When I was small, we lived in the village."
        "bases":
          "જ્યારે": "when"
          "હું": "I"
          "નાનો": "small"
          "હતો": "to be"
          "ત્યારે": "then; at that time"
          "અમે": "we"
          "ગામમાં": "village"
          "રહેતા": "to stay; to live; to keep a state"
          "હતા": "to be"
    "notes":
      "n1": "It pairs with ત્યારે (tyāre), 'then', in the main clause."
  "gu-3717":
    "native": "as; the way that"
    "examples":
      "જેમ તમે કહો છો, તેમ કરીશું.":
        "native": "We will do as you say."
        "bases":
          "જેમ": "as; the way that"
          "તમે": "you"
          "કહો": "to say; to tell"
          "છો": "to be"
          "તેમ": "so; likewise"
          "કરીશું": "to do; to make"
      "જેમ દાદી કરતી હતી, તેમ બધાએ કર્યું.":
        "native": "Everyone did it as grandmother used to do."
        "bases":
          "જેમ": "as; the way that"
          "દાદી": "grandmother"
          "કરતી": "to do; to make"
          "હતી": "to be"
          "તેમ": "so; likewise"
          "બધાએ": "all"
          "કર્યું": "to do; to make"
    "notes":
      "n1": "It pairs with તેમ (tem), 'so', in the main clause."
  "gu-3718":
    "native": "as much as"
    "notes":
      "n1": "જેટલું (jeṭalum̐) … તેટલું (teṭalum̐) is 'as much as … so much'."
    "examples":
      "જેટલું તમે ખાઈ શકો તેટલું ખાઓ.":
        "native": "Eat as much as you can."
        "bases":
          "જેટલું": "as much as"
          "તમે": "you"
          "ખાઈ": "to eat"
          "શકો": "to be able"
          "તેટલું": "that much"
          "ખાઓ": "to eat"
      "જેટલા લોકો આવ્યા એટલું ખાવાનું હતું.":
        "native": "There was as much food as the people who came."
        "bases":
          "જેટલા": "as much as"
          "લોકો": "people"
          "આવ્યા": "to come"
          "એટલું": "so much"
          "ખાવાનું": "to eat"
          "હતું": "to be"
  "gu-3719":
    "native": "his; her; its"
    "examples":
      "તેનું ઘર મોટું છે.":
        "native": "His house is big."
        "bases":
          "તેનું": "his; her; its"
          "ઘર": "house; home"
          "મોટું": "big"
          "છે": "to be"
      "તેનું નામ શું છે?":
        "native": "What is his name?"
        "bases":
          "તેનું": "his; her; its"
          "નામ": "name"
          "શું": "what"
          "છે": "to be"
    "notes":
      "n1": "It agrees with the thing owned, as જેનું (jenum̐) does: before a feminine noun it is તેની (tenī)."
  "gu-3720":
    "native": "then; at that time"
    "examples":
      "ત્યારે હું ઘરે હતો.":
        "native": "Then I was at home."
        "bases":
          "ત્યારે": "then; at that time"
          "હું": "I"
          "ઘરે": "house; home"
          "હતો": "to be"
      "ત્યારે શું થયું હતું?":
        "native": "What had happened then?"
        "bases":
          "ત્યારે": "then; at that time"
          "શું": "what"
          "થયું": "to become; to happen"
          "હતું": "to be"
    "notes":
      "n1": "It pairs with જ્યારે (jyāre), 'when', which comes first in the sentence."
  "gu-3721":
    "native": "so; likewise; in that way"
    "examples":
      "તમે કહ્યું તેમ મેં કર્યું.":
        "native": "I did it as you said."
        "bases":
          "તમે": "you"
          "કહ્યું": "to say; to tell"
          "તેમ": "so; likewise"
          "મેં": "I"
          "કર્યું": "to do; to make"
      "એ બધું કરે છે, તેમ તમે પણ કરો.":
        "native": "He does all that, and you do likewise."
        "bases":
          "એ": "that; he; she"
          "બધું": "everything"
          "કરે": "to do; to make"
          "છે": "to be"
          "તેમ": "so; likewise"
          "તમે": "you"
          "પણ": "also; but"
          "કરો": "to do; to make"
    "notes":
      "n1": "It pairs with જેમ (jem), 'as', which comes first in the sentence."
