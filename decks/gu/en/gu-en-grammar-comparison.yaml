"name": "Comparison: more and most"
"license": "CC-BY-SA-4.0"
"description": "Gujarati says 'more' and 'most' with a word before the adjective, and 'than' after the thing compared with. Quantity words take no comparison and are left out of the table: ઘણા (ghaṇā), થોડા (thoḍā), કેટલા (keṭlā), દરેક (darek), બંને (banne), આખું (ākhum̐), પૂરતું (pūrtum̐), અનેક (anek), અમુક (amuk) and કેટલાક (keṭlāk) say how many or how much, so they have no 'more' or 'most'. Adjectives that name a fixed state, a shape, a kind or a participle cannot be graded either and are left out: બંધ (bandh), ચાલુ (cālu), હાજર (hājar), બેભાન (bebhān), બેરોજગાર (berojgār), નિવૃત્ત (nivrutt), નિર્દોષ (nirdoś), ગેરકાયદે (gerkāyde), કાયદેસર (kāydesar), મફત (maphat), ઓનલાઇન (onlāin), સરકારી (sarkāri), વૈવાહિક (vaivāhik), રાષ્ટ્રીય (rāśṭriy), આંતરરાષ્ટ્રીય (āntarrāśṭriy), સ્થાનિક (sthānik), કાલ્પનિક (kālpanik), સંમત (sammat), અસંમત (asammat), ગોળ (goḷ), ચોરસ (coras), ભરેલું (bharelum̐), તૂટેલું (tuṭelum̐), ડરેલો (ḍarelo), હસતો (hasto) and ચમકતું (camktum̐). Not yet checked by a Gujarati speaker: please report any mistake."
"tags":
