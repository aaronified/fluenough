tags: ["unreviewed"]
cards:
  "gu-6100":
    native: "Victory to proud Gujarat! Victory to proud Gujarat! The dawn of the sun shines; victory to proud Gujarat!"
    notes:
      "n1": "Refrain and first stanza of the song Jai Jai Garavi Gujarat by Narmad, written in 1873, as printed on gu.wikipedia."
  "gu-6101":
    native: "The flag shines in saffron-red, marked with love and valour."
    notes:
      "n1": "A line of the song Jai Jai Garavi Gujarat by Narmad, as printed on gu.wikipedia."
  "gu-6102":
    native: "To the north is the mother Amba, and to the east the mother Kali."
    notes:
      "n1": "A line of the song Jai Jai Garavi Gujarat by Narmad, which names the goddesses who guard the land, as printed on gu.wikipedia."
  "gu-6103":
    native: "Look at the rivers Tapi and Narmada, and Mahi and the others too."
    notes:
      "n1": "A line of the song Jai Jai Garavi Gujarat by Narmad, which names the rivers of Gujarat, as printed on gu.wikipedia."
  "gu-6104":
    native: "Those are the glories of Anhilvada, and that is Siddharaj Jaysinh."
    notes:
      "n1": "A line of the song Jai Jai Garavi Gujarat by Narmad, which names the medieval capital Anhilvada and its king Siddharaj Jaysinh, as printed on gu.wikipedia."
  "gu-6105":
    native: "The people move about with Narmada: victory to proud Gujarat."
    notes:
      "n1": "The last line of the song Jai Jai Garavi Gujarat by Narmad, as printed on gu.wikipedia."
