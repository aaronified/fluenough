# Layer for gu-culture-3: English renderings and notes.
schema: 1
id: "gu-en-culture-3"
kind: "layer"
core: "gu-culture-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: modern Gujarati literature and public life"
description: "Lines of Gujarati literature from Narmad, Dalpatram, Zaverchand Meghani and Kalapi, with English renderings and notes. Not yet checked by a Gujarati speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "gu-6100":
    native: "Victory to proud Gujarat, victory to proud Gujarat; the dawn of the sun shines, victory to proud Gujarat!"
    notes:
      "n1": "Refrain and first stanza of the song Jai Jai Garavi Gujarat by Narmad (1873), as printed on gu.wikipedia."
  "gu-6101":
    native: "The flag shines in saffron-red, marked with love and valour."
    notes:
      "n1": "A line of the song Jai Jai Garavi Gujarat by Narmad, as printed on gu.wikipedia."
  "gu-6102":
    native: "To the north is the mother Amba, and to the east the mother Kali."
    notes:
      "n1": "A line of the song Jai Jai Garavi Gujarat by Narmad, naming the goddesses who guard the land, as printed on gu.wikipedia."
  "gu-6103":
    native: "Look at the rivers Tapi and Narmada, and Mahi and the others too."
    notes:
      "n1": "A line of the song Jai Jai Garavi Gujarat by Narmad, naming the rivers of Gujarat, as printed on gu.wikipedia."
  "gu-6104":
    native: "Those are the glories of Anhilvada, and that is Siddharaj Jaysinh."
    notes:
      "n1": "A line of the song Jai Jai Garavi Gujarat by Narmad, naming the medieval capital Anhilvada and its king Siddharaj Jaysinh, as printed on gu.wikipedia."
  "gu-6105":
    native: "The people move about with Narmada: victory to proud Gujarat."
    notes:
      "n1": "The last line of the song Jai Jai Garavi Gujarat by Narmad, as printed on gu.wikipedia."
  "gu-6111":
    native: "Where Brahmins and Rajputs fought in great numbers for the sake of the god;"
    notes:
      "n1": "A stanza of Narmad's poem on Gujarat's history, the Brahmins and Rajputs of the old kingdoms, as printed in Narmad Lekhan."
  "gu-6112":
    native: "In the city of Andheri there was a king named Gandu, the fool."
    notes:
      "n1": "The opening of Dalpatram's tale of the city of Andheri (Darkness), a satirical story in verse about a foolish king."
  "gu-6113":
    native: "For one tanka, a seer of vegetables, and for one tanka, a seer of sweets."
    notes:
      "n1": "From the tale of Andheri Nagari: the market prices of the foolish city, as printed in Dalpatram Rachit Kavyo."
  "gu-6114":
    native: "Everything is sold there at one price,"
    notes:
      "n1": "From the tale of Andheri Nagari: the city sells all goods at the same price."
  "gu-6115":
    native: "Good or bad, it is never sold with discernment."
    notes:
      "n1": "From the tale of Andheri Nagari: in the city the judgement of goods is lost, as printed in Dalpatram Rachit Kavyo."
  "gu-6116":
    native: "I was a little boy, very small,"
    notes:
      "n1": "The opening of a verse in which a son speaks of his childhood to his father, as printed in Dalpatram Rachit Kavyo."
  "gu-6117":
    native: "My father raised me, fed me and brought me up."
    notes:
      "n1": "From the same verse: the son thanks his father for raising him, as printed in Dalpatram Rachit Kavyo."
  "gu-6118":
    native: "The guru said: do not stay here,"
    notes:
      "n1": "The guru advises his disciple to leave the foolish city, in the tale of Andheri Nagari."
  "gu-6119":
    native: "Everything here is sold at one price."
    notes:
      "n1": "The guru's warning in the tale of Andheri Nagari: all goods are priced the same, as printed in Dalpatram Rachit Kavyo."
  "gu-6121":
    native: "Why, Rameshwar knows every verse of Charaka and Sushruta by heart; he has made the corpses sit up!"
    notes:
      "n1": "A comic line from the Navalikao stories by Zaverchand Meghani: a character boasts of his learning in the old medical texts."
  "gu-6122":
    native: "Poor father, so easily swayed: he cannot break a straw in two; where is the barrister, Harichand?"
    notes:
      "n1": "A line of dialogue from the Navalikao stories by Zaverchand Meghani, a sharp remark about a man who cannot act."
  "gu-6123":
    native: "The air is full of dust that glitters like diamonds."
    notes:
      "n1": "A verse of Kalapi (Sursinhji Gohil) quoted in a book about him, as printed on gu.wikisource."
