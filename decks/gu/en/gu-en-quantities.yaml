"schema": 1
"id": "gu-en-quantities"
"kind": "layer"
"core": "gu-quantities"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "How much and how many"
"license": "CC-BY-SA-4.0"
"description": "Asking and saying how much and how many, with the words for half, each, both and the units a grocer uses. Not yet checked by a Gujarati speaker: please report any mistake."
"cards":
  "gu-1200":
    "native": "a lot; very much"
    "notes":
      "n1": "Before an adjective it means 'very', as in English 'very big'."
    "examples":
      "આજે ઘણું કામ છે.":
        "native": "There is a lot of work today."
        "bases":
          "આજે": "today"
          "ઘણું": "a lot"
          "કામ": "work"
          "છે": "to be"
      "મને ઘણું ગમે છે.":
        "native": "I like it a lot."
        "bases":
          "મને": "I"
          "ઘણું": "a lot"
          "ગમે": "to like"
          "છે": "to be"
  "gu-1201":
    "native": "a little; a bit"
    "notes":
      "n1": "Used for a small amount of something that cannot be counted."
    "examples":
      "મને થોડું પાણી જોઈએ છે.":
        "native": "I need a little water."
        "bases":
          "મને": "I"
          "થોડું": "a little"
          "પાણી": "water"
          "જોઈએ": "to need"
          "છે": "to be"
      "થોડું ઓછું કરો.":
        "native": "Reduce it a little."
        "bases":
          "થોડું": "a little"
          "ઓછું": "less"
          "કરો": "to do; to make"
  "gu-1202":
    "native": "many"
    "notes":
      "n1": "The plural of a countable thing: ઘણા લોકો (ghaṇā loko), many people."
    "examples":
      "ઘણા લોકો આવ્યા.":
        "native": "Many people came."
        "bases":
          "ઘણા": "many"
          "લોકો": "people"
          "આવ્યા": "to come"
      "મારી પાસે ઘણા પૈસા નથી.":
        "native": "I do not have much money."
        "bases":
          "મારી": "my"
          "પાસે": "near; with (someone)"
          "ઘણા": "many"
          "પૈસા": "money"
          "નથી": "to be"
  "gu-1203":
    "native": "a few"
    "notes":
      "n1": "The plural form for countable things: થોડા લોકો (thoḍā loko), a few people."
    "examples":
      "થોડા લોકો આવ્યા.":
        "native": "A few people came."
        "bases":
          "થોડા": "a few"
          "લોકો": "people"
          "આવ્યા": "to come"
      "મેં થોડા ફોટા પાડ્યા.":
        "native": "I took a few photos."
        "bases":
          "મેં": "I"
          "થોડા": "a few"
          "ફોટા": "photo"
          "પાડ્યા": "to take (a photo)"
  "gu-1204":
    "native": "everything; all of it"
    "notes":
      "n1": "A thing that is neuter: બધું (badhum̐) is used for things, બધા (badhā) for people."
    "examples":
      "બધું બરાબર છે.":
        "native": "Everything is fine."
        "bases":
          "બધું": "everything"
          "બરાબર": "right; fine"
          "છે": "to be"
      "મેં બધું ખાધું.":
        "native": "I ate everything."
        "bases":
          "મેં": "I"
          "બધું": "everything"
          "ખાધું": "to eat"
  "gu-1205":
    "native": "everyone; all of them"
    "notes":
      "n1": "Used for people and countable things: બધા આવ્યા (badhā āvyā), everyone came."
    "examples":
      "બધા આવ્યા.":
        "native": "Everyone came."
        "bases":
          "બધા": "all"
          "આવ્યા": "to come"
      "બધા બાળકો રમે છે.":
        "native": "All the children are playing."
        "bases":
          "બધા": "all"
          "બાળકો": "child"
          "રમે": "to play"
          "છે": "to be"
  "gu-1206":
    "native": "how many"
    "notes":
      "n1": "Plural of કેટલું (keṭlum̐), used before a countable noun: કેટલા લોકો (keṭlā loko), how many people."
    "examples":
      "કેટલા લોકો આવશે?":
        "native": "How many people will come?"
        "bases":
          "કેટલા": "how many"
          "લોકો": "people"
          "આવશે": "to come"
      "કેટલા વાગ્યા?":
        "native": "What time is it?"
        "bases":
          "કેટલા": "how many"
          "વાગ્યા": "to strike (of a clock)"
  "gu-1207":
    "native": "each; every"
    "notes":
      "n1": "Used before a singular noun: દરેક બાળક (darek bāḷak), every child."
    "examples":
      "દરેક બાળક શાળાએ જાય છે.":
        "native": "Every child goes to school."
        "bases":
          "દરેક": "each; every"
          "બાળક": "child"
          "શાળાએ": "school"
          "જાય": "to go"
          "છે": "to be"
      "દરેક શનિવારે હું ઘરે રહું છું.":
        "native": "Every Saturday I stay at home."
        "bases":
          "દરેક": "each; every"
          "શનિવારે": "Saturday"
          "હું": "I"
          "ઘરે": "at home"
          "રહું": "to live; to stay"
          "છું": "to be"
  "gu-1208":
    "native": "both"
    "notes":
      "n1": "Used for two things or two people together."
    "examples":
      "બંને ભાઈઓ અહીં છે.":
        "native": "Both brothers are here."
        "bases":
          "બંને": "both"
          "ભાઈઓ": "brother"
          "અહીં": "here"
          "છે": "to be"
      "બંને સારા છે.":
        "native": "Both are good."
        "bases":
          "બંને": "both"
          "સારા": "good; fine"
          "છે": "to be"
  "gu-1209":
    "native": "something; some"
    "notes":
      "n1": "Used for an unnamed thing; the opposite is કંઈ નહીં (kaim̐ nahim̐), nothing."
    "examples":
      "મને કંઈક ખાવું છે.":
        "native": "I want to eat something."
        "bases":
          "મને": "I"
          "કંઈક": "something"
          "ખાવું": "to eat"
          "છે": "to be"
      "કંઈક થયું છે?":
        "native": "Has something happened?"
        "bases":
          "કંઈક": "something"
          "થયું": "to happen; to become"
          "છે": "to be"
  "gu-1210":
    "native": "kilo; kilogram"
    "notes":
      "n1": "A unit of weight, used after a number: એક કિલો (ek kilo), one kilo."
    "examples":
      "એક કિલો ટામેટાં આપો.":
        "native": "Give me one kilo of tomatoes."
        "bases":
          "એક": "one; a"
          "કિલો": "kilo"
          "ટામેટાં": "tomatoes"
          "આપો": "to give"
      "બે કિલો કેરી જોઈએ છે.":
        "native": "I need two kilos of mangoes."
        "bases":
          "બે": "two"
          "કિલો": "kilo"
          "કેરી": "mango"
          "જોઈએ": "to need"
          "છે": "to be"
  "gu-1211":
    "native": "gram"
    "notes":
      "n1": "A smaller unit of weight; a thousand grams make a kilo."
    "examples":
      "પાંચસો ગ્રામ લોટ આપો.":
        "native": "Give me five hundred grams of flour."
        "bases":
          "પાંચસો": "five hundred"
          "ગ્રામ": "gram"
          "લોટ": "flour"
          "આપો": "to give"
      "આ બસો ગ્રામ છે.":
        "native": "This is two hundred grams."
        "bases":
          "આ": "this"
          "બસો": "two hundred"
          "ગ્રામ": "gram"
          "છે": "to be"
  "gu-1212":
    "native": "litre"
    "notes":
      "n1": "A unit of liquid, used after a number: બે લિટર દૂધ (be liṭar dudh), two litres of milk."
    "examples":
      "બે લિટર દૂધ લાવજો.":
        "native": "Please bring two litres of milk."
        "bases":
          "બે": "two"
          "લિટર": "litre"
          "દૂધ": "milk"
          "લાવજો": "to bring"
      "એક લિટર દૂધ ખરીદવું છે.":
        "native": "I want to buy one litre of milk."
        "bases":
          "એક": "one; a"
          "લિટર": "litre"
          "દૂધ": "milk"
          "ખરીદવું": "to buy"
          "છે": "to be"
  "gu-1213":
    "native": "spoonful; teaspoon"
    "notes":
      "n1": "A measure of a spoonful, used after a number: એક ચમચી (ek camci), one spoonful."
    "examples":
      "એક ચમચી ખાંડ નાખો.":
        "native": "Add one spoonful of sugar."
        "bases":
          "એક": "one; a"
          "ચમચી": "spoon"
          "ખાંડ": "sugar"
          "નાખો": "to put in; to add"
      "એક ચમચી મીઠું આપો.":
        "native": "Give me one spoonful of salt."
        "bases":
          "એક": "one; a"
          "ચમચી": "spoon"
          "મીઠું": "salt"
          "આપો": "to give"
  "gu-1214":
    "native": "bowl; a bowlful"
    "notes":
      "n1": "A small bowl, also used as a measure: એક વાટકી દહીં (ek vāṭki dahim̐), a bowl of yogurt."
    "examples":
      "મને એક વાટકી દહીં આપો.":
        "native": "Give me a bowl of yogurt."
        "bases":
          "મને": "I"
          "એક": "one; a"
          "વાટકી": "bowl"
          "દહીં": "yogurt"
          "આપો": "to give"
      "દાદીએ બધાને એક વાટકી ખીર આપી.":
        "native": "Grandmother gave everyone a bowl of rice pudding."
        "bases":
          "દાદીએ": "grandmother"
          "બધાને": "all"
          "એક": "one; a"
          "વાટકી": "bowl"
          "ખીર": "rice pudding"
          "આપી": "to give"
  "gu-1215":
