"schema": 1
"id": "gu-en-quantities"
"kind": "layer"
"core": "gu-quantities"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "How much and how many"
"license": "CC-BY-SA-4.0"
"description": "Asking and saying how much and how many, with the words for half, each, both and the units a grocer uses. Not yet checked by a Gujarati speaker: please report any mistake."
"cards":
  "gu-1202":
    "native": "many"
    "notes":
      "n1": "The plural of a countable thing: ઘણા લોકો (ghaṇā loko), many people."
    "examples":
      "ઘણા લોકો આવ્યા.":
        "native": "Many people came."
        "bases":
          "ઘણા": "many"
          "લોકો": "people"
          "આવ્યા": "to come"
      "મારી પાસે ઘણા પૈસા નથી.":
        "native": "I do not have much money."
        "bases":
          "મારી": "my"
          "પાસે": "near; with (someone)"
          "ઘણા": "many"
          "પૈસા": "money"
          "નથી": "to be"
  "gu-1203":
    "native": "a few"
    "notes":
      "n1": "The plural form for countable things: થોડા લોકો (thoḍā loko), a few people."
    "examples":
      "થોડા લોકો આવ્યા.":
        "native": "A few people came."
        "bases":
          "થોડા": "a few"
          "લોકો": "people"
          "આવ્યા": "to come"
      "મેં થોડા ફોટા પાડ્યા.":
        "native": "I took a few photos."
        "bases":
          "મેં": "I"
          "થોડા": "a few"
          "ફોટા": "photo"
          "પાડ્યા": "to take (a photo)"
  "gu-1206":
    "native": "how many"
    "notes":
      "n1": "Plural of કેટલું (keṭlum̐), used before a countable noun: કેટલા લોકો (keṭlā loko), how many people."
    "examples":
      "કેટલા લોકો આવશે?":
        "native": "How many people will come?"
        "bases":
          "કેટલા": "how many"
          "લોકો": "people"
          "આવશે": "to come"
      "કેટલા વાગ્યા?":
        "native": "What time is it?"
        "bases":
          "કેટલા": "how many"
          "વાગ્યા": "to strike (of a clock)"
  "gu-1207":
    "native": "each; every"
    "notes":
      "n1": "Used before a singular noun: દરેક બાળક (darek bāḷak), every child."
    "examples":
      "દરેક બાળક શાળાએ જાય છે.":
        "native": "Every child goes to school."
        "bases":
          "દરેક": "each; every"
          "બાળક": "child"
          "શાળાએ": "school"
          "જાય": "to go"
          "છે": "to be"
      "દરેક શનિવારે હું ઘરે રહું છું.":
        "native": "Every Saturday I stay at home."
        "bases":
          "દરેક": "each; every"
          "શનિવારે": "Saturday"
          "હું": "I"
          "ઘરે": "at home"
          "રહું": "to live; to stay"
          "છું": "to be"
  "gu-1208":
    "native": "both"
    "notes":
      "n1": "Used for two things or two people together."
    "examples":
      "બંને ભાઈઓ અહીં છે.":
        "native": "Both brothers are here."
        "bases":
          "બંને": "both"
          "ભાઈઓ": "brother"
          "અહીં": "here"
          "છે": "to be"
      "બંને સારા છે.":
        "native": "Both are good."
        "bases":
          "બંને": "both"
          "સારા": "good; fine"
          "છે": "to be"
  "gu-1209":
    "native": "something; some"
    "notes":
      "n1": "Used for an unnamed thing; the opposite is કંઈ નહીં (kaim̐ nahim̐), nothing."
    "examples":
      "મને કંઈક ખાવું છે.":
        "native": "I want to eat something."
        "bases":
          "મને": "I"
          "કંઈક": "something"
          "ખાવું": "to eat"
          "છે": "to be"
      "કંઈક થયું છે?":
        "native": "Has something happened?"
        "bases":
          "કંઈક": "something"
          "થયું": "to happen; to become"
          "છે": "to be"
  "gu-1210":
    "native": "kilo; kilogram"
    "notes":
      "n1": "A unit of weight, used after a number: એક કિલો (ek kilo), one kilo."
    "examples":
      "એક કિલો ટામેટાં આપો.":
        "native": "Give me one kilo of tomatoes."
        "bases":
          "એક": "one; a"
          "કિલો": "kilo"
          "ટામેટાં": "tomatoes"
          "આપો": "to give"
      "બે કિલો કેરી જોઈએ છે.":
        "native": "I need two kilos of mangoes."
        "bases":
          "બે": "two"
          "કિલો": "kilo"
          "કેરી": "mango"
          "જોઈએ": "to need"
          "છે": "to be"
  "gu-1211":
    "native": "gram"
    "notes":
      "n1": "A smaller unit of weight; a thousand grams make a kilo."
    "examples":
      "પાંચસો ગ્રામ લોટ આપો.":
        "native": "Give me five hundred grams of flour."
        "bases":
          "પાંચસો": "five hundred"
          "ગ્રામ": "gram"
          "લોટ": "flour"
          "આપો": "to give"
      "આ બસો ગ્રામ છે.":
        "native": "This is two hundred grams."
        "bases":
          "આ": "this"
          "બસો": "two hundred"
          "ગ્રામ": "gram"
          "છે": "to be"
  "gu-1212":
    "native": "litre"
    "notes":
      "n1": "A unit of liquid, used after a number: બે લિટર દૂધ (be liṭar dudh), two litres of milk."
    "examples":
      "બે લિટર દૂધ લાવજો.":
        "native": "Please bring two litres of milk."
        "bases":
          "બે": "two"
          "લિટર": "litre"
          "દૂધ": "milk"
          "લાવજો": "to bring"
      "એક લિટર દૂધ ખરીદવું છે.":
        "native": "I want to buy one litre of milk."
        "bases":
          "એક": "one; a"
          "લિટર": "litre"
          "દૂધ": "milk"
          "ખરીદવું": "to buy"
          "છે": "to be"
  "gu-1213":
    "native": "spoonful; teaspoon"
    "notes":
      "n1": "A measure of a spoonful, used after a number: એક ચમચી (ek camci), one spoonful."
    "examples":
      "એક ચમચી ખાંડ નાખો.":
        "native": "Add one spoonful of sugar."
        "bases":
          "એક": "one; a"
          "ચમચી": "spoon"
          "ખાંડ": "sugar"
          "નાખો": "to put in; to add"
      "એક ચમચી મીઠું આપો.":
        "native": "Give me one spoonful of salt."
        "bases":
          "એક": "one; a"
          "ચમચી": "spoon"
          "મીઠું": "salt"
          "આપો": "to give"
  "gu-1214":
    "native": "bowl; a bowlful"
    "notes":
      "n1": "A small bowl, also used as a measure: એક વાટકી દહીં (ek vāṭki dahim̐), a bowl of yogurt."
    "examples":
      "મને એક વાટકી દહીં આપો.":
        "native": "Give me a bowl of yogurt."
        "bases":
          "મને": "I"
          "એક": "one; a"
          "વાટકી": "bowl"
          "દહીં": "yogurt"
          "આપો": "to give"
      "દાદીએ બધાને એક વાટકી ખીર આપી.":
        "native": "Grandmother gave everyone a bowl of rice pudding."
        "bases":
          "દાદીએ": "grandmother"
          "બધાને": "all"
          "એક": "one; a"
          "વાટકી": "bowl"
          "ખીર": "rice pudding"
          "આપી": "to give"
  "gu-1215":
    "native": "empty"
    "notes":
      "n1": "Invariant: it does not change for gender or number."
    "examples":
      "ડબ્બો ખાલી છે.":
        "native": "The box is empty."
        "bases":
          "ડબ્બો": "box; tin"
          "ખાલી": "empty"
          "છે": "to be"
      "ગ્લાસ ખાલી કરો.":
        "native": "Empty the glass."
        "bases":
          "ગ્લાસ": "glass"
          "ખાલી": "empty"
          "કરો": "to do; to make"
  "gu-1220":
    "native": "whole; entire"
    "notes":
      "n1": "Used before a noun for the whole of it: આખું ઘર (ākhum̐ ghar), the whole house."
    "examples":
      "આખું ઘર સાફ કર્યું.":
        "native": "I cleaned the whole house."
        "bases":
          "આખું": "whole; entire"
          "ઘર": "house; home"
          "સાફ": "clean; cleaned"
          "કર્યું": "to do; to make"
      "આખો દિવસ વરસાદ હતો.":
        "native": "It rained all day."
        "bases":
          "આખો": "whole; entire"
          "દિવસ": "day"
          "વરસાદ": "rain"
          "હતો": "to be"
  "gu-1330":
    "native": "so much; this much"
    "notes":
      "n1": "Used for an amount that is a lot: એટલું ના ખાઓ (eṭlum̐ nā khāo), do not eat so much."
    "examples":
      "એટલું ના ખાઓ.":
        "native": "Do not eat so much."
        "bases":
          "એટલું": "so much"
          "ના": "no; not"
          "ખાઓ": "to eat"
      "આજે એટલું કામ છે!":
        "native": "There is so much work today!"
        "bases":
          "આજે": "today"
          "એટલું": "so much"
          "કામ": "work"
          "છે": "to be"
  "gu-1331":
    "native": "this much"
    "notes":
      "n1": "Points at an amount close by: આટલું કેમ (āṭlum̐ kem), why this much."
    "examples":
      "આટલું પૂરતું છે.":
        "native": "This is enough."
        "bases":
          "આટલું": "this much"
          "પૂરતું": "enough"
          "છે": "to be"
      "આટલું કેમ?":
        "native": "Why this much?"
        "bases":
          "આટલું": "this much"
          "કેમ": "why"
  "gu-1332":
    "native": "that much"
    "notes":
      "n1": "The distant form of આટલું (āṭlum̐), for the amount that is meant."
    "examples":
      "મને તેટલું જોઈએ છે.":
        "native": "I need that much."
        "bases":
          "મને": "I"
          "તેટલું": "that much"
          "જોઈએ": "to need"
          "છે": "to be"
      "તેટલું પૂરતું છે.":
        "native": "That is enough."
        "bases":
          "તેટલું": "that much"
          "પૂરતું": "enough"
          "છે": "to be"
  "gu-1333":
    "native": "enough; sufficient"
    "notes":
      "n1": "Agrees with the noun: પૂરતા પૈસા (purtā paisā), enough money; પૂરતી વાટકી (purti vāṭki), enough bowls."
    "examples":
      "મારી પાસે પૂરતા પૈસા છે.":
        "native": "I have enough money."
        "bases":
          "મારી": "my"
          "પાસે": "near; with (someone)"
          "પૂરતા": "enough"
          "પૈસા": "money"
          "છે": "to be"
      "એક વાટકી પૂરતી છે.":
        "native": "One bowl is enough."
        "bases":
          "એક": "one; a"
          "વાટકી": "bowl"
          "પૂરતી": "enough"
          "છે": "to be"
  "gu-1334":
    "native": "many; numerous"
    "notes":
      "n1": "A more formal word for ઘણા (ghaṇā), used in writing."
    "examples":
      "અનેક લોકો આવ્યા.":
        "native": "Many people came."
        "bases":
          "અનેક": "many; numerous"
          "લોકો": "people"
          "આવ્યા": "to come"
      "અનેક બાળકો રમે છે.":
        "native": "Many children are playing."
        "bases":
          "અનેક": "many; numerous"
          "બાળકો": "child"
          "રમે": "to play"
          "છે": "to be"
  "gu-1335":
    "native": "some; certain"
    "notes":
      "n1": "Means some of a group, not all of it."
    "examples":
      "અમુક દુકાનો બંધ છે.":
        "native": "Some shops are closed."
        "bases":
          "અમુક": "some; certain"
          "દુકાનો": "shop"
          "બંધ": "closed; shut"
          "છે": "to be"
      "અમુક લોકો ન આવ્યા.":
        "native": "Some people did not come."
        "bases":
          "અમુક": "some; certain"
          "લોકો": "people"
          "ન": "not"
          "આવ્યા": "to come"
  "gu-1336":
    "native": "much; many"
    "notes":
      "n1": "Mostly used in negatives and questions: ઝાઝું નથી (jhājhum̐ nathi), not much."
    "examples":
      "આજે ઝાઝું કામ નથી.":
        "native": "There is not much work today."
        "bases":
          "આજે": "today"
          "ઝાઝું": "much; many"
          "કામ": "work"
          "નથી": "to be"
      "એ ઝાઝું બોલતો નથી.":
        "native": "He does not talk much."
        "bases":
          "એ": "that; he; she"
          "ઝાઝું": "much; many"
          "બોલતો": "to speak"
          "નથી": "to be"
  "gu-1337":
    "native": "some; several"
    "notes":
      "n1": "Used for some people or things of a group, before a plural noun."
    "examples":
      "કેટલાક બાળકો રમે છે.":
        "native": "Some children are playing."
        "bases":
          "કેટલાક": "some; several"
          "બાળકો": "child"
          "રમે": "to play"
          "છે": "to be"
      "કેટલાક લોકો ચાલે છે.":
        "native": "Some people are walking."
        "bases":
          "કેટલાક": "some; several"
          "લોકો": "people"
          "ચાલે": "to walk"
          "છે": "to be"
