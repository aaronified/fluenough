"cards":
  "gu-3315":
    "native": "There are clouds in the sky; it will rain."
    "bases":
      "આકાશમાં": "sky"
      "વાદળ": "cloud"
      "છે": "to be"
      "વરસાદ": "rain"
    "confusables":
      "c1":
        "why": "સૂરજ (suraj) (sooraj) is the sun, which is in the sky but is not a cloud."
      "c2":
        "why": "પવન (pavan) (pavan) is wind, not a cloud."
  "gu-3316":
    "native": "The sun rose and the birds began to sing."
    "bases":
      "સૂરજ": "sun"
      "ઊગ્યો": "to rise; to sprout"
      "લાગ્યાં": "to start; to feel"
    "confusables":
      "c1":
        "why": "ચંદ્ર (candra) (chandra) is the moon, which is seen at night."
      "c2":
        "why": "ડૂબવું (ḍubvum) (doobvum) means to set; the sun sets, it does not rise."
  "gu-3317":
    "native": "The stream's water flows down from the hill."
    "bases":
      "પરથી": "on; at"
      "વહે": "to flow"
      "છે": "to be"
    "confusables":
      "c1":
        "why": "કિનારો (kināro) (kinaaro) is a bank, where water meets land."
      "c2":
        "why": "ખડક (khaḍak) (khadak) is a rock on the hill, not a flow of water."
  "gu-3318":
    "native": "In the cold wind the tree sways."
    "bases":
      "ઠંડા": "cold"
      "પવનમાં": "wind"
      "ઝાડ": "tree"
      "હલે": "to sway"
      "છે": "to be"
    "confusables":
      "c1":
        "why": "તડકો (taḍako) (tadako) is strong sun, not wind."
      "c2":
        "why": "ધુમ્મસ (dhummas) (dhummas) is fog, which is cold but not a wind."
  "gu-3319":
    "native": "Flowers have bloomed in the pond."
    "bases":
      "ફૂલો": "flower"
      "ખીલ્યાં": "to bloom"
      "છે": "to be"
    "confusables":
      "c1":
        "why": "કળી (kaḷi) (kali) is a bud, not an open flower."
      "c2":
        "why": "ઘાસ (ghās) (ghaas) is grass, which grows near a pond."
  "gu-3320":
    "native": "In summer there is a lot of sun."
    "bases":
      "તડકો": "sunshine"
      "હોય": "to be"
      "છે": "to be"
    "confusables":
      "c1":
        "why": "હવા (havā) (hava) is air, a different thing from sunshine."
      "c2":
        "why": "ધુમ્મસ (dhummas) (dhummas) is fog, which is rare in summer."
  "gu-3321":
    "native": "The sea air is cool and fresh."
    "bases":
      "દરિયાની": "sea"
      "હવા": "air"
      "ઠંડી": "cold"
      "તાજી": "fresh"
      "છે": "to be"
    "confusables":
      "c1":
        "why": "કિનારો (kināro) (kinaaro) is the shore, not the air."
      "c2":
        "why": "સમુદ્ર (samudra) (samudra) is the ocean, a place not the air."
  "gu-3322":
    "native": "Many trees and animals live in the forest."
    "bases":
      "વૃક્ષો": "tree"
      "રહે": "to stay; to be doing"
      "છે": "to be"
    "confusables":
      "c1":
        "why": "મેદાન (medān) (medaan) is an open field, without many trees."
      "c2":
        "why": "ડુંગર (ḍuṅgar) (dungar) is a hill, not a forest."
