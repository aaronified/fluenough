# Layer for gu-culture-4: English renderings and notes.
schema: 1
id: "gu-en-culture-4"
kind: "layer"
core: "gu-culture-4"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: narrative and didactic verse"
description: "Excerpts of narrative and didactic verse by Narsinh Mehta and Akho, with English renderings and notes. Not yet checked by a Gujarati speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "gu-6150":
    native: "The serpent-woman says to the boy: have you lost your way, or did your enemy send you?"
    notes:
      "n1": "A stanza of Nagadaman by Narsinh Mehta, the story of Krishna and the serpent Kaliya, as printed on gu.wikisource."
  "gu-6151":
    native: "I am no serpent-woman, I did not lose my way, and my enemy did not send me."
    notes:
      "n1": "A stanza of Nagadaman by Narsinh Mehta, as printed on gu.wikisource."
  "gu-6152":
    native: "I will give you my necklace worth a lakh and a quarter, and I will give you a cord."
    notes:
      "n1": "A stanza of Nagadaman by Narsinh Mehta, as printed on gu.wikisource."
  "gu-6153":
    native: "The two women plead with folded hands: Lord, release our husband."
    notes:
      "n1": "A stanza of Nagadaman by Narsinh Mehta, as printed on gu.wikisource."
  "gu-6154":
    native: "We were offenders; we understood nothing and did not know the Lord."
    notes:
      "n1": "A stanza of Nagadaman by Narsinh Mehta, as printed on gu.wikisource."
  "gu-6155":
    native: "Accept my hundi, my great lord, dark Girdhari; a hundi is a bill of exchange."
    notes:
      "n1": "The refrain of Hundi (the bill of exchange) by Narsinh Mehta, as printed on gu.wikisource."
  "gu-6156":
    native: "The Lord came forth from the pillar and took the form of Narasimha, the man-lion."
    notes:
      "n1": "A stanza of Hundi by Narsinh Mehta, as printed on gu.wikisource; Narasimha is the man-lion avatar of Vishnu."
  "gu-6157":
    native: "He saved Prahlad, and the beloved killed the demon king Hiranyakashipu."
    notes:
      "n1": "A stanza of Hundi by Narsinh Mehta, as printed on gu.wikisource."
  "gu-6158":
    native: "My beloved of the true hour, you have given the devotees much happiness."
    notes:
      "n1": "A stanza of Hundi by Narsinh Mehta, as printed on gu.wikisource."
  "gu-6159":
    native: "Who sent old age; I thought youth would last all the time."
    notes:
      "n1": "The opening lines of Ghadapan (old age) by Narsinh Mehta, as printed on gu.wikisource; the refrain is left out."
  "gu-6160":
    native: "The doorsteps have become hills, and the village square has become a foreign land."
    notes:
      "n1": "A stanza of Ghadapan by Narsinh Mehta, as printed on gu.wikisource."
  "gu-6161":
    native: "The nine channels of the body grow separate, and death has arrived."
    notes:
      "n1": "A stanza of Ghadapan by Narsinh Mehta, as printed on gu.wikisource."
  "gu-6162":
    native: "By the true word of dharma, Mehta Narsaiyo crossed over the sea of existence."
    notes:
      "n1": "The last stanza of Ghadapan by Narsinh Mehta, as printed on gu.wikisource; the author names himself in it."
  "gu-6163":
    native: "First, the group ગણ પધોરની (gaṇ padhornī), O creature, pull out the clumps of time."
    notes:
      "n1": "A stanza of Sāntiḍu (a poem by Akho), as printed on gu.wikisource."
  "gu-6164":
    native: "Third, O creature, remove the fetter of craving."
    notes:
      "n1": "A stanza of Sāntiḍu (a poem by Akho), as printed on gu.wikisource."
  "gu-6165":
    native: "The sowing time of steady gaze has come; brother, fasten the seed-drill of truth."
    notes:
      "n1": "A stanza of Sāntiḍu (a poem by Akho), as printed on gu.wikisource."
  "gu-6166":
    native: "Eat, drink, spend your wealth; its share goes to God."
    notes:
      "n1": "A stanza of Sāntiḍu (a poem by Akho), as printed on gu.wikisource."
  "gu-6167":
    native: "The devotee Akho says: without worshipping the Lord you will not cross the sea of existence."
    notes:
      "n1": "The last stanza of Sāntiḍu (a poem by Akho), as printed on gu.wikisource; the author names himself in it."
