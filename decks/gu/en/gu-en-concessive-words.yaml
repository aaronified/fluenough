  "name": "Although: the word for even though",
  "license": "CC-BY-SA-4.0",
  "description": "Although: the word that joins a clause to a surprising one. Not yet checked by a Gujarati speaker: please report any mistake.",
  "cards": {
    "gu-4491": {
      "native": "although; in spite of; yet",
      "notes": {
        "n1": "Joins a clause to one that is surprising: વરસાદ (varsād) (rain) fell, although we went out. After a verb it takes the -vā form, as in વરસાદ પડવા છતાં (varsād paḍvā chatām̐). For the stronger 'even so', see તોપણ (topaṇ)."
      },
      "examples": {
        "વરસાદ પડ્યો છતાં અમે બહાર ગયા.": {
          "native": "It rained, but we still went out.",
          "bases": {
            "પડ્યો": "fell",
            "છતાં": "although; in spite of; yet",
            "ગયા": "went"
          }
        },
        "ઠંડી હતી છતાં તે તરવા ગયો.": {
          "native": "It was cold, yet he went swimming.",
          "bases": {
            "હતી": "was",
            "છતાં": "although; in spite of; yet",
            "તરવા": "to swim",
            "ગયો": "went"
          }
        }
      }
    }
  }
}
