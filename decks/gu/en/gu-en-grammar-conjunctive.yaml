  "notes": "The conjunctive chains two actions by the same person: દોડીને ટ્રેનમાં ચઢ્યો (doḍine ṭrenmām̐ caḍhyo) (ran and got on the train). Most verbs take the ending that goes with their stem: વાંચીને (vāñcine) (vaanchine) and લખીને (lakhine) (lakhine) for a consonant stem, ખાઈને (khāine) (khaine) and સૂઈને (suine) (suine) for a long vowel. Irregular forms to learn by heart: કરીને (karine) (karine) from કરવું (karavum) (karavum), જઈને (jaine) (jaine) from જવું (javum) (javum), પીને (pine) (pine) from પીવું (pivum) (pivum), કહીને (kahine) (kahine) from કહેવું (kahevum) (kahevum), ખોઈને (khoine) (khoine) from ખોવું (khovum) (khovum) and ગાઈને (gāine) (gaaine) from ગાવું (gāvum) (gaavum)."
