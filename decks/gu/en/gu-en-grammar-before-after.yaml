  "name": "Before and after a verb: before doing, after doing",
  "license": "CC-BY-SA-4.0",
  "description": "The verb in the -તાં (tām̐) form with પહેલાં (pahelām) is before doing it; the conjunctive form, -ઈને (ine), is after doing it. Not yet checked by a Gujarati speaker: please report any mistake.",
  "tags": [
    "unreviewed"
  ],
  "table": {
    "slot_name": "time",
    "slots": {
      "before": "before doing it",
      "after": "after doing it"
    }
  },
  "rules": {
    "gu-rule-before-doing": {
      "name": "Before doing it",
      "explanation": "Take the -તાં (tām̐) form of the verb, the same form that means while doing, and add પહેલાં (pahelām): ખાતાં (khātām̐) પહેલાં (pahelām), before eating; જતાં (jatām̐) પહેલાં (pahelām), before going. The form does not change with the person."
    },
    "gu-rule-after-doing": {
      "name": "After doing it",
      "explanation": "Use the conjunctive form, -ઈને (ine) or -ીને (ine), which means having done it: ખાઈને (khāine), after eating. A verb with no form here is not drilled."
    }
  }
}
