    "gu-4180": {
      "native": "director (of a film or play)",
      "notes": {
        "n1": "He decides how a film is made and guides the actors. The screenplay is a પટકથા (paṭkathā)."
      },
      "examples": {
        "દિગ્દર્શક નવી ફિલ્મ બનાવે છે.": {
          "native": "The director makes a new film.",
          "bases": {
            "દિગ્દર્શક": "director (of a film or play)",
            "નવી": "new (feminine)",
            "બનાવે": "makes",
            "છે": "is"
          }
        },
        "આ ફિલ્મનો દિગ્દર્શક જાણીતો છે.": {
          "native": "The director of this film is well known.",
          "bases": {
            "ફિલ્મનો": "of the film",
            "દિગ્દર્શક": "director (of a film or play)",
            "જાણીતો": "well known (masculine)",
            "છે": "is"
          }
        }
      }
    },
