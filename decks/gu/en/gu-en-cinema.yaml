          "bases": {
            "પટકથા": "screenplay; the script of a film",
            "રસપ્રદ": "interesting",
            "છે": "is"
          }
        },
        "લેખકે પટકથા લખી.": {
          "native": "The writer wrote the screenplay.",
          "bases": {
            "લેખકે": "the writer (as doer)",
            "પટકથા": "screenplay; the script of a film",
            "લખી": "wrote (feminine)"
          }
        }
      }
    },
    "gu-4182": {
      "native": "screen; curtain",
      "notes": {
        "n1": "The white sheet where a film is shown, or the cloth that hides a stage."
      },
      "examples": {
