    "gu-4183": {
      "native": "viewer; spectator",
      "notes": {
        "n1": "A person who watches a film, a play or a match. For a group of them see પ્રેક્ષક (prekśak)."
      },
      "examples": {
        "દર્શકો ફિલ્મ જોઈને હસ્યા.": {
          "native": "The viewers laughed on seeing the film.",
