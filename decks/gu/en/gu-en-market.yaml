schema: 1
id: "gu-en-market"
kind: "layer"
core: "gu-market"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Market"
license: "CC0-1.0"
description: "Prices, rupees, too dear, a little less: what you need to buy and to bargain at a market stall. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0372":
    native: "market"
    notes:
      "n1": "શાકમાર્કેટ (śākmārkeṭ) is the vegetable market."
  "gu-0373":
    native: "How much is this?"
    notes:
      "n1": "Literally 'this is of how much?'. Of something feminine, such as કેરી (mango): કેટલાની છે (keṭlāni che)?"
    bases:
      "છે": "to be"
  "gu-0374":
    native: "How many rupees?"
  "gu-0375":
    native: "rupee"
    notes:
      "n1": "The plural is રૂપિયા (rupiyā): સો રૂપિયા (so rupiyā), a hundred rupees."
  "gu-0376":
    native: "money; paise"
    notes:
      "n1": "Plural, like English 'funds': પૈસા નથી (paisā nathi), there's no money."
  "gu-0377":
    native: "expensive"
    notes:
      "n1": "It agrees: મોંઘો (m), મોંઘી (f), મોંઘું (n)."
  "gu-0378":
    native: "cheap"
    notes:
      "n1": "It agrees: સસ્તો (sasto), સસ્તી (sasti), સસ્તું (sastum̐)."
  "gu-0379":
    native: "It's too expensive."
    notes:
      "n1": "બહુ (bahu) is 'very; too much'. Bargaining is expected at a stall, not in a shop with fixed prices."
    bases:
      "બહુ": "very; a lot"
      "છે": "to be"
  "gu-0380":
    native: "Bring the price down a little."
    notes:
      "n1": "Literally 'make it a little less'."
    bases:
      "થોડું": "a little"
      "ઓછું": "less"
      "કરો": "to do; to make"
  "gu-0381":
    native: "change; small money"
    notes:
      "n1": "છૂટા છે? (chhuta chhe?), do you have change?"
    bases:
      "છૂટા": "loose (of money, change)"
  "gu-0382":
    native: "bag"
  "gu-0383":
    native: "Give me two kilos."
    notes:
      "n1": "આપો (āpo) is the polite 'give'. આપજો (āpjo) is softer still."
    bases:
      "કિલો": "kilo"
      "આપો": "to give"
  "gu-0384":
    native: "Anything else?"
    notes:
      "n1": "The seller's question. બસ (bas), 'that's all'."
    bases:
      "બીજું": "other; else"
      "કંઈ": "anything; something"
