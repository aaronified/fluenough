    "notes": "To say what a third person said, put the words of the report after કે (ke) (ke), that, and then the verb of saying: તે કહે છે કે હું આવીશ (te kahe che ke hum̐ āviś), he says that I will come. The verb of saying takes its own form: present કહે છે (kahe che), past કહ્યું (kahyum̐), with the subject તેણે (teṇe) in the past. The verb after કે (ke) keeps its own tense, as in the example. Questions are reported the same way with પૂછ્યું (puchyum̐), as in તેણે પૂછ્યું કે (teṇe puchyum̐ ke) ... (he asked whether ...)."
  }
