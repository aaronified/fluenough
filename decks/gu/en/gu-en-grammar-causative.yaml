    "notes": "To get someone else to do the action, change the verb: add -ાવ- (-āv-) to its stem, as કરવું (karvum̐) becomes કરાવવું (karāvvum) (to get it done). After a vowel stem the form is -વડાવ- (-vaḍāv-), as પીવું (pivum̐) becomes પીવડાવવું (pivḍāvvum). Some verbs shorten a long vowel first: ચાલવું (cālvum̐) becomes ચલાવવું (calāvvum̐). The irregular ones are learnt one by one: ખાવું (khāvum̐) becomes ખવડાવવું (khavḍāvvum), to feed."
