    "notes": "To get someone else to do the action, change the verb: add -āv- to its stem, as કરવું (karvum̐) becomes કરાવવું (karāvvum̐) (to get it done). A stem ending in a vowel takes -vaḍāv-, as પીવું (pivum̐) becomes પીવડાવવું (pivḍāvvum̐). Some verbs shorten a long vowel first: ચાલવું (cālvum̐) becomes ચલાવવું (calāvvum̐). The irregular ones are learnt one by one: ખાવું (khāvum̐) becomes ખવડાવવું (khavḍāvvum̐), to feed; દેખાવું (dekhāvum̐) becomes દેખાડવું (dekhāḍvum̐), to show; ચિડાવું (ciḍāvum̐) becomes ચિડવવું (ciḍvvum̐), to annoy; મળવું (maḷvum̐) becomes મેળવવું (meḷvvum̐), to bring together. Left out on purpose: જવું (javum̐), whose 'send' is મોકલવું (moklvum̐) or જવા દેવું (javā devum̐); આવવું (āvvum̐), whose likeness આવડાવવું (āvḍāvvum̐) would be confused with આવડવું (āvḍvum̐), to know how; ગમવું (gamvum̐), which is not a causing verb; and verbs whose causative form could not be confirmed."
