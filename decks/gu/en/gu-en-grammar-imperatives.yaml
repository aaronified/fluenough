  "notes": "The તું (tum̐) form, for a friend, a child or family, is the bare stem: વાંચ (vāñc), read. The તમે (tame) form adds -ઓ (-o): વાંચો (vāñco), read, said politely or to more than one person. For 'don't', put ન (na) before the verb: ન વાંચ (na vāñc), don't read; ન વાંચો (na vāñco), don't read (polite). Spoken Gujarati often uses ના (nā) or નહીં (nahim) instead of ન (na), as in ના જાઓ (nā jāo) or નહીં જાઓ (nahim jāo). In the imperative, the form does not change with gender either."
