  "notes": "The તું form, for a friend, a child or family, is the bare stem: વાંચ (vāñc), read. The તમે form adds -ઓ (-o): વાંચો (vāñco), read, to you polite or to more than one. For 'don't', put ન (na) before the verb: ન વાંચ (na vāñc), don't read; ન વાંચો (na vāñco), don't read (polite). The verb does not change with gender. ન જાઓ (na jāo) (na jāo) means don't go, as in the negative unit."
