{
  "schema": 1,
  "id": "gu-en-travel-sentences",
  "kind": "layer",
  "core": "gu-travel-sentences",
  "native": {
    "code": "en",
    "iso639_3": "eng",
    "name": "English"
  },
  "name": "Travel: sentences",
  "license": "CC-BY-SA-4.0",
  "description": "Sentences for travel: asking the way, tickets, luggage and a delay. Not yet checked by a Gujarati speaker: please report any mistake.",
  "cards": {
    "gu-3802": {
      "native": "When will the train leave?",
      "bases": {
        "ઉપડશે": "to depart; to leave"
      },
      "confusables": {
        "c1": {
          "why": "બસ (bas) is the bus, which leaves from a bus stop, not a train."
        },
        "c2": {
          "why": "સ્ટેશન (sṭeśan) is where the train leaves from, not when it leaves."
        }
      }
    },
    "gu-3803": {
      "native": "I will go to the station by taxi.",
      "bases": {
        "ટેક્સીથી": "taxi; cab",
        "સ્ટેશને": "station",
        "જઈશ": "to go"
      },
      "confusables": {
        "c1": {
          "why": "ટ્રેન (ṭren) is a rail journey, not a road one, so it does not fit a taxi ride."
        },
        "c2": {
          "why": "બસ (bas) is another road vehicle; the sentence names the taxi."
        }
      }
    },
    "gu-3804": {
      "native": "Where is my passport?",
      "bases": {
        "મારો": "my",
        "છે": "to be"
      },
      "confusables": {
        "c1": {
          "why": "ટિકિટ (ṭikiṭ) is a different paper, bought for a journey."
        },
        "c2": {
          "why": "સીટ (siṭ) is the place you sit on a train or a bus."
        }
      }
    },
    "gu-3805": {
      "native": "The hotel is near.",
      "bases": {
        "છે": "to be"
      },
      "confusables": {
        "c1": {
          "why": "દૂર (dur) (far) is the opposite of near."
        },
        "c2": {
          "why": "આગળ (āgaḷ) (ahead) is about direction, not distance."
        }
      }
    },
    "gu-3806": {
      "native": "Go for a walk in the park in the morning.",
      "bases": {
        "ઉદ્યાનમાં": "public park",
        "ફરવા": "to go out; to wander",
        "જાઓ": "to go"
      },
      "confusables": {
        "c1": {
          "why": "સાંજ (sāñj) (evening) comes after the afternoon, not in the morning."
        },
        "c2": {
          "why": "રાત (rāt) (night) is later still."
        }
      }
    },
    "gu-3807": {
      "native": "Which bus should I take to go to the temple?",
      "bases": {
        "મંદિરે": "temple",
        "જવા": "to go",
        "માટે": "for",
        "કઈ": "which",
        "લેવી": "to take"
      },
      "confusables": {
        "c1": {
          "why": "ટ્રેન (ṭren) (train) runs on rails and needs a station."
        },
        "c2": {
          "why": "ટેક્સી (ṭeksi) (taxi) is a car you hire, not a bus."
        }
      }
    },
    "gu-3808": {
      "native": "How much is the museum ticket?",
      "bases": {
        "સંગ્રહાલયની": "museum",
        "કેટલાની": "how much",
        "છે": "to be"
      },
      "confusables": {
        "c1": {
          "why": "ભાડું (bhāḍum̐) (fare) is what you pay for a journey or a rent."
        },
        "c2": {
          "why": "સસ્તું (sastum̐) (cheap) describes a price; the question asks the price."
        }
      }
    },
    "gu-3809": {
      "native": "The room rent is cheap.",
      "bases": {
        "ઓરડાનું": "room",
        "છે": "to be"
      },
      "confusables": {
        "c1": {
          "why": "મોંઘું (moṅghum̐) (expensive) is the opposite of cheap."
        },
        "c2": {
          "why": "કિંમત (kimmat) (price) is the amount; it does not say whether it is cheap."
        }
      }
    },
    "gu-3810": {
      "native": "There was a delay on the way.",
      "bases": {
        "રસ્તામાં": "road; the way",
        "થયો": "to become; to happen"
      },
      "confusables": {
        "c1": {
          "why": "મોડું (moḍum̐) (late) describes a train or a person who is not on time."
        },
        "c2": {
          "why": "ઉતાવળ (utāvaḷ) (hurry) is the feeling of rushing, not a delay."
        }
      }
    },
    "gu-3811": {
      "native": "We will leave in the morning.",
      "bases": {
        "ઉપડીશું": "to depart; to leave"
      },
      "confusables": {
        "c1": {
          "why": "આગમન (āgaman) (arrival) is the opposite of leaving."
        },
        "c2": {
          "why": "પરત (parat) (back; return) means coming back, not setting off."
        }
      }
    },
    "gu-3812": {
      "native": "This fort is on a high hill.",
      "bases": {
        "આ": "this",
        "ઊંચા": "tall",
        "પર": "on; at",
        "છે": "to be"
      },
      "confusables": {
        "c1": {
          "why": "પર્વત (parvat) (mountain) is bigger than a hill."
        },
        "c2": {
          "why": "ગામ (gām) (village) is where people live, not a high place."
        }
      }
    }
  }
}
