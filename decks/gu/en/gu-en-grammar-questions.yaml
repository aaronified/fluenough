schema: 1
id: "gu-en-grammar-questions"
kind: "layer"
core: "gu-grammar-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Asking questions"
license: "CC0-1.0"
description: "A question keeps the order of a statement: the question word goes where the answer would, and a yes-or-no question just rises at the end. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0296":
    native: "What is your name?"
    notes:
      "n1": "The answer goes where શું (śum̐) is: મારું નામ મીના છે (mārum̐ nām minā che)."
    bases:
      "તમારું": "your"
      "છે": "to be"
  "gu-0297":
    native: "Where do you live?"
    bases:
      "રહો": "to live; to stay"
      "છો": "to be"
  "gu-0298":
    native: "What is this?"
    bases:
      "છે": "to be"
  "gu-0299":
    native: "Who is that?"
    bases:
      "છે": "to be"
  "gu-0300":
    native: "When will you come?"
  "gu-0301":
    native: "How many people are there?"
    notes:
      "n1": "લોકો (loko), people, is masculine plural, so કેટલા (keṭlā)."
    bases:
      "લોકો": "people"
      "છે": "to be"
  "gu-0302":
    native: "Why didn't you come?"
    notes:
      "n1": "ન (na) before the verb is 'not'."
  "gu-0303":
    native: "Will you have some tea?"
    notes:
      "n1": "No question word: the voice rises at the end. A host offers tea like this, and it is polite to accept."
  "gu-0304":
    native: "Do you know Gujarati?"
    notes:
      "n1": "Literally 'does Gujarati come to you?'."
    bases:
      "ગુજરાતી": "Gujarati"
      "આવડે": "to know (a language or skill)"
      "છે": "to be"
  "gu-0305":
    native: "You're tired, aren't you?"
    notes:
      "n1": "ને (ne) at the end asks for agreement, like 'isn't it?' or 'right?'."
    bases:
      "થાકી": "to be tired"
      "છો": "to be"
      "ને": "isn't it? (a tag at the end of a question)"
  "gu-0306":
    native: "Which bus goes to the station?"
    notes:
      "n1": "બસ (bas) is feminine, so 'which' is કઈ (kai)."
    bases:
      "છે": "to be"
