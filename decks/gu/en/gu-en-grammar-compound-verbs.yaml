schema: 1
id: "gu-en-grammar-compound-verbs"
kind: "layer"
core: "gu-grammar-compound-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Compound verbs"
license: "CC0-1.0"
description: "A verb's stem with -ઈ (-i), then જવું (javum̐), લેવું (levum̐), દેવું (devum̐) or નાખવું (nākhvum̐): the second verb adds 'completely', 'for myself' or 'for you', as English adds up or away. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0553":
    native: "Go ahead and eat."
    notes:
      "n1": "The stem with -ઈ (-i), then લેવું (to take): done for yourself, and done fully. A host's friendly push."
    bases:
      "લો": "to take"
  "gu-0554":
    native: "Do sit down."
    notes:
      "n1": "-ઈ (-i) with જવું (to go) marks a change, done: you are now seated."
    bases:
      "બેસી": "to sit; to begin (of a year)"
  "gu-0555":
    native: "I forgot. (a man)"
    notes:
      "n1": "A woman says ભૂલી ગઈ (bhuli gai). With જવું (javum̐) the past agrees with the doer. જવું (javum̐) changes its stem in the past: ગ- (g-), as in ગયો (gayo), ગઈ (gai), ગયું (gayum̐)."
    bases:
      "હું": "I"
      "ભૂલી": "to forget"
  "gu-0556":
    native: "He fell down."
    notes:
      "n1": "જવું (javum̐) changes its stem in the past: ગ- (g-), as in ગયો (gayo), ગઈ (gai), ગયું (gayum̐)."
    bases:
      "તે": "he; she; it; that"
      "પડી": "to fall; to have to"
  "gu-0557":
    native: "The work is done."
    notes:
      "n1": "થઈ ગયું (thai gayum̐), 'it has become', is everywhere: done, finished, it happened. જવું (javum̐) changes its stem in the past: ગ- (g-), as in ગયો (gayo), ગઈ (gai), ગયું (gayum̐)."
    bases:
      "થઈ": "to be; to become; to happen"
  "gu-0558":
    native: "Go to sleep."
  "gu-0559":
    native: "Just tell (them)."
    notes:
      "n1": "-ઈ (-i) with દેવું (to give): done for someone else, or at once."
    bases:
      "કહી": "to say; to tell"
      "દો": "to give"
  "gu-0560":
    native: "Put it down; leave it."
    bases:
      "મૂકી": "to put; to leave"
      "દો": "to give"
  "gu-0561":
    native: "Throw it away."
    bases:
      "ફેંકી": "to throw"
      "દો": "to give"
  "gu-0562":
    native: "Write it down."
    notes:
      "n1": "-ઈ (-i) with નાખવું (to throw in): done quickly or thoroughly. Gujarati uses it far more than Hindi does."
    bases:
      "નાખો": "to throw; to put"
  "gu-0563":
    native: "He went away."
    notes:
      "n1": "જતું રહેવું (jatum̐ rahevum̐), 'to stay going', is to leave for good. A woman: જતી રહી (jati rahi)."
    bases:
      "તે": "he; she; it; that"
      "રહ્યો": "to live; to stay"
