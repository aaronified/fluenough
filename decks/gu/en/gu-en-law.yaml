    "gu-4707": {
      "native": "legal; lawful",
      "notes": {
        "n1": "Allowed by law. It does not change for gender."
      },
      "examples": {
        "આ ભાડાપટ્ટો કાયદેસર છે.": {
          "native": "This lease is legal.",
          "bases": {
            "આ": "this",
