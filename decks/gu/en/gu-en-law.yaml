        "કાયદેસર રીતે આ જમીન મારી છે.": {
          "native": "Legally, this land is mine.",
          "bases": {
            "કાયદેસર": "legal; lawful",
            "રીતે": "way; manner",
            "આ": "this",
            "જમીન": "land",
            "મારી": "mine (feminine)",
            "છે": "is"
