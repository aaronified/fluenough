    "gu-4708": {
      "native": "against; opposed to",
      "notes": {
        "n1": "Used with a noun before it, such as kayda virudh, against the law."
      },
      "examples": {
        "તે કાયદા વિરુદ્ધ છે.": {
          "native": "It is against the law.",
          "bases": {
