  "name": "Law: police, courts, rights and the rules",
  "license": "CC-BY-SA-4.0",
  "description": "The law and the police: rights, rules, complaints, evidence, fines and punishment, and the words for going to the police station. Not yet checked by a Gujarati speaker: please report any mistake.",
  "tags": [
    "unreviewed"
  ],
  "cards": {
    "gu-4701": {
      "native": "justice",
      "notes": {
        "n1": "Fair treatment under the law. Nyay maagvo means to ask for justice."
      },
      "examples": {
        "અમને ન્યાય મળ્યો.": {
          "native": "We got justice.",
          "bases": {
            "અમને": "to us",
            "ન્યાય": "justice",
            "મળ્યો": "got (masculine)"
          }
        },
        "ન્યાય માટે લડવું જરૂરી છે.": {
          "native": "Fighting for justice is necessary.",
          "bases": {
            "ન્યાય": "justice",
            "માટે": "for",
            "લડવું": "to fight",
            "જરૂરી": "necessary",
            "છે": "is"
          }
        }
      }
    },
    "gu-4702": {
      "native": "jail; prison",
      "notes": {
        "n1": "The place where a person is kept after a court sentence."
      },
      "examples": {
        "ચોર જેલમાં ગયો.": {
          "native": "The thief went to jail.",
          "bases": {
            "ચોર": "thief",
            "જેલમાં": "jail; prison",
            "ગયો": "went (masculine)"
          }
        },
        "તેને દસ વર્ષની જેલ થઈ.": {
          "native": "He got ten years in jail.",
          "bases": {
            "તેને": "he (to him)",
            "દસ": "ten",
            "વર્ષની": "of years",
            "જેલ": "jail; prison",
            "થઈ": "was given"
          }
        }
      }
    },
    "gu-4703": {
      "native": "right; claim",
      "notes": {
        "n1": "A right that a person has by law or fairness."
      },
      "examples": {
        "દરેક માણસનો હક છે.": {
          "native": "It is every person's right.",
          "bases": {
            "દરેક": "every",
            "માણસનો": "of the person",
            "હક": "right; claim",
            "છે": "is"
          }
        },
        "મારો હક મને આપો.": {
          "native": "Give me my right.",
          "bases": {
            "મારો": "my (masculine)",
            "હક": "right; claim",
            "મને": "to me",
            "આપો": "give (polite)"
          }
        }
      }
    },
    "gu-4704": {
      "native": "accusation; charge",
      "notes": {
        "n1": "A claim that someone did something wrong or illegal."
      },
      "examples": {
        "તેના પર ચોરીનો આરોપ છે.": {
          "native": "He is charged with theft.",
          "bases": {
            "તેના": "his",
            "પર": "on",
            "ચોરીનો": "of theft",
            "આરોપ": "accusation; charge",
            "છે": "is"
          }
        },
        "તેણે આરોપ નકાર્યો.": {
          "native": "He denied the charge.",
