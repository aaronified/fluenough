            "તેણે": "he (after a verb)",
            "આરોપ": "accusation; charge",
            "નકાર્યો": "denied (masculine)"
          }
        }
      }
    },
    "gu-4705": {
      "native": "innocent",
      "notes": {
        "n1": "Not guilty of a crime. It does not change for gender."
      },
      "examples": {
        "તે નિર્દોષ છે.": {
          "native": "He is innocent.",
          "bases": {
            "નિર્દોષ": "innocent",
            "છે": "is"
          }
        },
        "નિર્દોષ લોકોને સજા ન કરો.": {
          "native": "Do not punish innocent people.",
          "bases": {
            "નિર્દોષ": "innocent",
            "લોકોને": "people",
            "ન": "not",
            "કરો": "do (polite)"
          }
        }
      }
    },
    "gu-4706": {
      "native": "illegal; against the law",
      "notes": {
        "n1": "Not allowed by law. It does not change for gender."
      },
      "examples": {
        "આ કામ ગેરકાયદે છે.": {
          "native": "This work is illegal.",
          "bases": {
            "આ": "this",
            "કામ": "work",
            "ગેરકાયદે": "illegal; against the law",
            "છે": "is"
          }
        },
        "ગેરકાયદે ધંધો બંધ કરો.": {
          "native": "Stop the illegal business.",
          "bases": {
            "ગેરકાયદે": "illegal; against the law",
            "ધંધો": "business",
            "બંધ": "closed; stopped",
            "કરો": "do (polite)"
          }
        }
