        "તેણે મારી વિરુદ્ધ ફરિયાદ કરી.": {
          "native": "He made a complaint against me.",
          "bases": {
            "તેણે": "he (after a verb)",
            "મારી": "my (feminine)",
            "વિરુદ્ધ": "against; opposed to",
            "કરી": "made (feminine)"
          }
        }
      }
