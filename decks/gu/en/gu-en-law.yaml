    "gu-4709": {
      "native": "punishment; sentence",
      "notes": {
        "n1": "The penalty a court or a person gives for a wrong. Saja karvi means to punish."
      },
      "examples": {
        "ચોરીની સજા જેલ છે.": {
          "native": "The punishment for theft is jail.",
          "bases": {
            "ચોરીની": "of theft",
            "સજા": "punishment; sentence",
            "છે": "is"
          }
        },
        "તેને દંડ અને સજા થઈ.": {
          "native": "He got a fine and a punishment.",
          "bases": {
            "તેને": "he (to him)",
            "અને": "and",
            "સજા": "punishment; sentence",
            "થઈ": "was given"
          }
        }
      }
    },
    "gu-4710": {
      "native": "protection; safety",
      "notes": {
        "n1": "Keeping someone safe from harm, often by law or by the police."
      },
      "examples": {
        "પોલીસ આપણું રક્ષણ કરે છે.": {
