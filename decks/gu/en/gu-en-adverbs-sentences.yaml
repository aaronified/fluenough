"name": "Adverbs: how often, how well, when: sentences"
"license": "CC-BY-SA-4.0"
"description": "Short sentences that use adverbs, for putting the words in order. Not yet checked by a Gujarati speaker: please report any mistake."
"tags":
- "unreviewed"
"cards":
  "gu-1135":
    "native": "I often call you."
    "confusables":
      "c1":
        "why": "ક્યારેક (kyārek) is sometimes, which is less often."
      "c2":
        "why": "ક્યારેય (kyārey) is never."
    "bases":
      "ફોન": "phone; a phone call"
      "છું": "to be"
  "gu-1136":
    "native": "Children go to school every day."
    "confusables":
      "c1":
        "why": "દરરોજ (darroj) is also every day, in a more formal style."
      "c2":
        "why": "હંમેશાં (hammeśām̐) is always, every time."
    "bases":
      "છે": "to be"
  "gu-1137":
    "native": "They come once a year."
    "confusables":
      "c1":
        "why": "મહિને (mahine) is per month."
      "c2":
        "why": "અઠવાડિયે (aṭhvāḍiye) is per week."
    "bases":
      "વાર": "time; occasion"
      "છે": "to be"
  "gu-1138":
    "native": "I speak slowly."
    "confusables":
      "c1":
        "why": "ઝડપથી (jhaḍapthi) is quickly, the opposite."
      "c2":
        "why": "બરાબર (barābar) is properly, a different idea."
    "bases":
      "છું": "to be"
  "gu-1139":
    "native": "First tea, then talk."
    "confusables":
      "c1":
        "why": "હવે (have) is now."
      "c2":
        "why": "હજી (haji) is still or yet."
    "bases":
      "વાત": "talk; matter"
  "gu-1140":
    "native": "You sing very well."
    "confusables":
      "c1":
        "why": "બહુ (bahu) is very, also used with a lot."
      "c2":
        "why": "બરાબર (barābar) is properly."
    "bases":
      "સરસ": "nice; fine; lovely"
      "છો": "to be"
  "gu-1141":
    "native": "We stay at home at night."
    "confusables":
      "c1":
        "why": "સવારે (savāre) is in the morning."
      "c2":
        "why": "સાંજે (sāñje) is in the evening."
    "bases":
      "ઘરે": "at home"
      "રહીએ": "to live; to stay"
      "છીએ": "to be"
  "gu-1142":
    "native": "I know for certain."
    "confusables":
      "c1":
        "why": "બિલકુલ (bilkul) is not at all, used with a negative."
      "c2":
        "why": "સાચે (sāce) is truly or really."
    "bases":
      "છે": "to be"
