schema: 1
id: "gu-en-eating-out"
kind: "layer"
core: "gu-eating-out"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Eating out"
license: "CC0-1.0"
description: "Tea, the thali and its snacks, how spicy and how sweet, more please, enough, and the bill. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0564":
    native: "tea"
    notes:
      "n1": "Strong, milky and sweet, often with ginger or mint. A small glass of it is a કટિંગ (kaṭiṅg)."
  "gu-0565":
    native: "water"
  "gu-0566":
    native: "thali; a set meal on a plate"
    notes:
      "n1": "A Gujarati thali brings dal, kadhi, vegetables, chapatis, rice, snacks and a sweet, refilled until you say stop."
  "gu-0567":
    native: "chapati"
    notes:
      "n1": "Thin wheat flatbread. રોટલો (roṭlo) is a thick one, often of millet."
  "gu-0568":
    native: "cooked rice"
    notes:
      "n1": "Dal and rice together is દાળભાત (dāḷbhāt)."
  "gu-0569":
    native: "kadhi (a yogurt soup)"
    notes:
      "n1": "Gujarati kadhi is thin, white and a little sweet."
  "gu-0570":
    native: "savoury snacks"
    notes:
      "n1": "ઢોકળાં (ḍhokḷām̐), ખમણ (khamaṇ), ફાફડા (phāphḍā): the steamed and fried snacks of a meal or a tea-time."
  "gu-0571":
    native: "spicy; hot"
    notes:
      "n1": "ઓછું તીખું (ochum̐ tikhum̐), less spicy. It agrees: તીખો (tikho), તીખી (tikhi), તીખું (tikhum̐)."
  "gu-0572":
    native: "sweet (to taste)"
    notes:
      "n1": "Much Gujarati cooking has a touch of sweetness. A sweet dish is મીઠાઈ (miṭhāi)."
  "gu-0573":
    native: "Two thalis, please."
    bases:
      "આપો": "to give"
  "gu-0574":
    native: "A little more, please."
    bases:
      "થોડું": "a little"
      "વધારે": "more"
      "આપો": "to give"
  "gu-0575":
    native: "That's enough, I'm full."
    notes:
      "n1": "Literally 'enough, the stomach has filled'. A host will still offer more: say it twice."
    bases:
      "પેટ": "stomach"
      "ભરાઈ": "to be filled"
  "gu-0576":
    native: "It's very good."
    notes:
      "n1": "સરસ (saras) is 'lovely; excellent'."
    bases:
      "બહુ": "very; a lot"
      "સરસ": "nice; very good"
      "છે": "to be"
  "gu-0577":
    native: "Bring the bill, please."
    bases:
      "બિલ": "bill"
      "લાવો": "to bring"
  "gu-0578":
    native: "street-food cart; handcart"
    notes:
      "n1": "Evening food comes from a લારી (lāri): pav bhaji, dabeli, sandwiches."
