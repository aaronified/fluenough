  "name": "Cinema: sentences",
  "license": "CC-BY-SA-4.0",
  "description": "Short sentences about films, actors, music and the audience, with the words they need.",
  "tags": [
    "unreviewed"
  ],
  "cards": {
    "gu-4215": {
      "native": "The ticket for this film is expensive.",
      "bases": {
        "ફિલ્મની": "of the film (feminine)",
        "મોંઘી": "expensive (feminine)",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "પડદો (paḍdo) is the screen itself, not the ticket."
        },
        "c2": {
          "why": "ઇનામ (inām) is a prize, not a ticket."
        }
      }
    },
    "gu-4216": {
      "native": "The music of the film is lovely.",
      "bases": {
        "ફિલ્મનું": "of the film",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "અવાજ (avāj) is a voice or sound, not the music."
        },
        "c2": {
          "why": "રંગ (raṅg) is colour, which the film might have."
        }
      }
    },
    "gu-4217": {
      "native": "The viewers clap.",
      "bases": {
        "દર્શકો": "viewers",
        "તાળી": "clap",
        "પાડે": "makes; gives (a clap)",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "પ્રેક્ષક (prekśak) is an audience member at a show, the same kind of person."
        },
        "c2": {
          "why": "ગાયક (gāyak) is a singer, who does not clap."
        }
      }
    },
    "gu-4218": {
      "native": "The hero was singing.",
      "bases": {
        "ગાતો": "singing (masculine)",
        "હતો": "was (masculine)"
      },
      "confusables": {
        "c1": {
          "why": "ખલનાયક (khalnāyak) is the villain, the opposite of the hero."
        },
        "c2": {
          "why": "ગીતકાર (gitkār) is a lyricist, who writes the song."
        }
      }
    },
    "gu-4219": {
      "native": "The ending of the film makes you cry.",
      "bases": {
        "ફિલ્મનો": "of the film",
        "રડાવે": "makes cry",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "શરૂઆત (śaruāt) is the beginning, the opposite of the end."
        },
        "c2": {
          "why": "હાસ્ય (hāsya) is humour, which makes you laugh."
        }
      }
    },
    "gu-4220": {
      "native": "The director wrote the screenplay.",
      "bases": {
        "દિગ્દર્શકે": "the director (as doer)",
        "લખી": "wrote (feminine)"
      },
      "confusables": {
        "c1": {
          "why": "ગીતકાર (gitkār) writes songs, not screenplays."
        },
        "c2": {
          "why": "કથા (kathā) is a story, close to a screenplay but not the same."
        }
      }
    },
    "gu-4221": {
      "native": "The play was performed well.",
      "bases": {
        "ભજવાયું": "was performed (neuter)"
      },
      "confusables": {
        "c1": {
          "why": "ચલચિત્ર (calacitra) is a film, which is not a stage play."
        },
        "c2": {
          "why": "પ્રદર્શન (pradarśan) is a show or display."
        }
      }
    },
    "gu-4222": {
      "native": "The actress gave an excellent performance.",
      "bases": {
        "અભિનેત્રીએ": "the actress (as doer)",
        "ઉત્તમ": "excellent",
        "કર્યો": "did (masculine)"
      },
      "confusables": {
        "c1": {
          "why": "અભિનેતા (abhinetā) is the male actor, not the actress."
        },
        "c2": {
          "why": "નાયિકા (nāyikā) is the heroine of a story."
        }
      }
    },
    "gu-4223": {
      "native": "Many scenes in the film are thrilling.",
      "bases": {
        "ફિલ્મમાં": "in the film",
        "ઘણાં": "many (neuter plural)",
        "દૃશ્યો": "scenes",
        "છે": "is"
      },
      "confusables": {
        "c1": {
          "why": "પ્રસંગ (prasaṅg) is an episode, a single part."
        },
        "c2": {
          "why": "કલાત્મક (kalātmak) is artistic, not thrilling."
        }
      }
    },
    "gu-4224": {
      "native": "He got an award for this film.",
      "bases": {
        "માટે": "for",
        "મળ્યો": "got (masculine)"
      },
      "confusables": {
        "c1": {
          "why": "ઇનામ (inām) is a prize, another word for a reward."
        },
        "c2": {
          "why": "ટિકિટ (ṭikiṭ) is a ticket, not an award."
        }
      }
    }
  }
}
