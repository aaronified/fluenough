schema: 1
id: "gu-en-script-vowel-signs"
kind: "layer"
core: "gu-script-vowel-signs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Gujarati vowel signs"
license: "CC0-1.0"
description: "After a consonant a vowel is written as a sign on it: after it, before it, above or below it. Here on ક (ka) and on મ (ma), with the u signs on ર (ra) and the two moon signs of English words. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0063":
    native: "kaa (k + the aa sign)"
    notes:
      "n1": "The aa sign ા (ā) is a stroke written after the consonant: કાન (kān, ear). Compare ક (ka) on its own, which is 'ka' with the short a."
  "gu-0064":
    native: "ki (k + the short i sign)"
    notes:
      "n1": "The short i sign િ (i) is written BEFORE the consonant but said after it: you see િ (i) then ક (ka), and say 'ki'. કિલો (kilo, kilo)."
  "gu-0065":
    native: "kii (k + the long i sign)"
    notes:
      "n1": "The long i sign ી (i) is written after the consonant: કીડી (kiḍi, ant). It sounds like કિ (ki), so it is drilled by reading and writing only. At the end of a word Gujarati almost always writes the long sign."
  "gu-0066":
    native: "ku (k + the short u sign)"
    notes:
      "n1": "The short u sign ુ (u) hangs below the consonant: કુટુંબ (kuṭumb, family)."
  "gu-0067":
    native: "kuu (k + the long u sign)"
    notes:
      "n1": "The long u sign ૂ (u) also hangs below, turned the other way: કૂતરો (kutro, dog). It sounds like કુ (ku), so it is drilled by reading and writing only."
  "gu-0068":
    native: "kru (k + the ru sign)"
    notes:
      "n1": "The ru sign ૃ (ru) hangs below, in words from Sanskrit: કૃપા (krupā, kindness). A recogniser writes 'kru' as ક્રુ (kru), so it is drilled by reading and writing only."
  "gu-0069":
    native: "ke (k + the e sign)"
    notes:
      "n1": "The e sign ે (e) sits on top: કેળું (keḷum̐, banana). કે (ke) on its own is 'or' and 'that'."
  "gu-0070":
    native: "kai (k + the ai sign)"
    notes:
      "n1": "The ai sign ૈ (ai) is two strokes on top: કૈલાસ (kailās, Mount Kailash)."
  "gu-0071":
    native: "ko (k + the o sign)"
    notes:
      "n1": "The o sign ો (o) is the aa stroke with a mark on top: કોણ (koṇ, who)."
  "gu-0072":
    native: "kau (k + the au sign)"
    notes:
      "n1": "The au sign ૌ (au) is the aa stroke with two marks on top. It is not common: ચૌદ (caud, fourteen) has it on ચ (ca)."
  "gu-0073":
    native: "kan (k + the dot: a nasal)"
    notes:
      "n1": "The dot ં (am̐) makes the vowel nasal, or before a consonant it is an n or m: કંપની (kampani, company). It is a mark rather than a vowel of its own, so it is drilled by reading and writing only."
  "gu-0074":
    native: "ko, open (as in 'college')"
    notes:
      "n1": "The o sign with a moon on top, for the open o of English words: કૉલેજ (kôlej, college). Many writers leave the moon out, so it is drilled by reading and writing only."
  "gu-0075":
    native: "ke, open (as in 'camera')"
    notes:
      "n1": "The e sign with a moon, for the open a of English 'cat': કૅમેરા (kêmerā, camera). Many writers leave the moon out, so it is drilled by reading and writing only."
  "gu-0076":
    native: "ru (r + the short u sign)"
    notes:
      "n1": "On ર (ra) the u sign is joined at the side, not hung below: ગુરુવાર (guruvār, Thursday)."
  "gu-0077":
    native: "ruu (r + the long u sign)"
    notes:
      "n1": "On ર (ra) the long u sign is joined at the side too: રૂપિયો (rupiyo, rupee). It sounds like રુ (ru), so it is drilled by reading and writing only."
  "gu-0078":
    native: "maa (m + the aa sign)"
    notes:
      "n1": "મા (mā) is also a word: mother. માથું (māthum̐, head)."
  "gu-0079":
    native: "mi (m + the short i sign)"
    notes:
      "n1": "The sign before the letter again: મિત્ર (mitra, friend)."
  "gu-0080":
    native: "mii (m + the long i sign)"
    notes:
      "n1": "મીઠું (miṭhum̐, salt; sweet). It sounds like મિ (mi), so it is drilled by reading and writing only."
  "gu-0081":
    native: "mu (m + the short u sign)"
    notes:
      "n1": "મુંબઈ (mumbai, Mumbai)."
  "gu-0082":
    native: "me (m + the e sign)"
    notes:
      "n1": "મેળો (meḷo, a fair)."
  "gu-0083":
    native: "mo (m + the o sign)"
    notes:
      "n1": "મોટું (moṭum̐, big)."
