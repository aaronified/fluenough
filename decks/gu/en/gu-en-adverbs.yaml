{
  "schema": 1,
  "id": "gu-en-adverbs",
  "kind": "layer",
  "core": "gu-adverbs",
  "native": {
    "code": "en",
    "iso639_3": "eng",
    "name": "English"
  },
  "name": "Adverbs: how often, how well, when",
  "license": "CC-BY-SA-4.0",
  "description": "Adverbs of how often, how well and when, such as always, often, slowly and yesterday. Not yet checked by a Gujarati speaker: please report any mistake.",
  "tags": [
    "unreviewed"
  ],
  "cards": {
    "gu-1100": {
      "native": "always",
      "notes": {
        "n1": "A word for every time. The opposite is ક્યારેય (kyārey), never."
      },
      "examples": {
        "તે હંમેશાં ઘરે છે.": {
          "native": "He or she is always at home.",
          "bases": {
            "ઘરે": "at home",
            "છે": "to be"
          }
        },
        "મારી માતા હંમેશાં ચા પીએ છે.": {
          "native": "My mother always drinks tea.",
          "bases": {
            "છે": "to be"
          }
        }
      }
    },
    "gu-1101": {
      "native": "sometimes",
      "notes": {
        "n1": "Between always and never: ક્યારેક (kyārek) is sometimes."
      },
      "examples": {
        "હું ક્યારેક બજાર જાઉં છું.": {
          "native": "I sometimes go to the market.",
          "bases": {
            "છું": "to be"
          }
        },
        "તમે ક્યારેક ગુજરાતી બોલો છો?": {
          "native": "Do you sometimes speak Gujarati?",
          "bases": {
            "ગુજરાતી": "Gujarati",
            "છો": "to be"
          }
        }
      }
    },
    "gu-1102": {
      "native": "never; ever",
      "notes": {
        "n1": "With a negative it means never. In a question it means ever."
      },
      "examples": {
        "તે ક્યારેય જૂઠ બોલતો નથી.": {
          "native": "He or she never lies.",
          "bases": {
            "જૂઠ": "lie",
            "નથી": "to be"
          }
        },
        "તમે ક્યારેય ત્યાં ગયા છો?": {
          "native": "Have you ever been there?",
          "bases": {
            "છો": "to be"
          }
        }
      }
    },
    "gu-1103": {
      "native": "often",
      "notes": {
        "n1": "Written as one word. Written apart, as two words, it means many times."
      },
      "examples": {
        "તે ઘણીવાર બહાર જાય છે.": {
          "native": "He or she often goes out.",
          "bases": {
            "બહાર": "outside",
            "છે": "to be"
          }
        },
        "અમે ઘણીવાર ફરવા જઈએ છીએ.": {
          "native": "We often go out for a walk.",
          "bases": {
            "ફરવા": "to go around; to travel for pleasure",
            "છીએ": "to be"
          }
        }
      }
    },
    "gu-1104": {
      "native": "again and again; repeatedly",
      "notes": {
        "n1": "Repeated, again and again."
      },
      "examples": {
        "બાળક વારંવાર પૂછે છે.": {
          "native": "The child asks again and again.",
          "bases": {
            "પૂછે": "to ask",
            "છે": "to be"
          }
        },
        "તે વારંવાર ફોન કરે છે.": {
          "native": "He or she calls again and again.",
          "bases": {
            "ફોન": "phone; a phone call",
            "છે": "to be"
          }
        }
      }
    },
    "gu-1105": {
      "native": "every day",
      "notes": {
        "n1": "A common, everyday word. દરરોજ (darroj) is the more formal form of the same idea."
      },
      "examples": {
        "હું રોજ વ્યાયામ કરું છું.": {
          "native": "I exercise every day.",
          "bases": {
            "વ્યાયામ": "exercise",
            "છું": "to be"
          }
        },
        "તમે રોજ ક્યાં જાઓ છો?": {
          "native": "Where do you go every day?",
          "bases": {
            "છો": "to be"
          }
        }
      }
    },
    "gu-1106": {
      "native": "daily",
      "notes": {
        "n1": "The same idea as રોજ (roj), in a slightly more formal style."
      },
      "examples": {
        "હું દરરોજ નવું શીખું છું.": {
          "native": "I learn something new every day.",
          "bases": {
            "નવું": "new",
            "છું": "to be"
          }
        },
        "બાળકો દરરોજ ભણે છે.": {
          "native": "Children study every day.",
          "bases": {
            "છે": "to be"
          }
        }
      }
    },
    "gu-1107": {
      "native": "a week; per week",
      "notes": {
        "n1": "Used with a number and વાર (vār) for how often in a week."
      },
      "examples": {
        "હું અઠવાડિયે એક વાર બજાર જાઉં છું.": {
          "native": "I go to the market once a week.",
          "bases": {
            "વાર": "time; occasion",
            "છું": "to be"
          }
        },
        "તે અઠવાડિયે ત્રણ વાર ચાલે છે.": {
          "native": "He or she walks three times a week.",
          "bases": {
            "વાર": "time; occasion",
            "છે": "to be"
          }
        }
      }
    },
    "gu-1108": {
      "native": "a month; per month",
      "notes": {
        "n1": "Used for how often in a month."
      },
      "examples": {
        "તેઓ મહિને એક વાર આવે છે.": {
          "native": "They come once a month.",
          "bases": {
            "વાર": "time; occasion",
            "છે": "to be"
          }
        },
        "પગાર મહિને મળે છે.": {
          "native": "The salary comes every month.",
          "bases": {
            "મળે": "to meet; to get",
            "છે": "to be"
          }
        }
      }
    },
    "gu-1109": {
      "native": "a year; per year",
      "notes": {
        "n1": "Used for how often in a year."
      },
      "examples": {
        "અમે વર્ષે એક વાર ફરવા જઈએ છીએ.": {
          "native": "We go on a trip once a year.",
          "bases": {
            "વાર": "time; occasion",
            "ફરવા": "to go around; to travel for pleasure",
            "છીએ": "to be"
          }
        },
        "મારો ભાઈ વર્ષે બે વાર ભારત જાય છે.": {
          "native": "My brother goes to India twice a year.",
          "bases": {
            "વાર": "time; occasion",
            "ભારત": "India",
            "છે": "to be"
          }
        }
      }
    },
    "gu-1110": {
      "native": "properly; correctly; right",
      "notes": {
        "n1": "Good, correct and well done: બરાબર (barābar) is also used to mean that is right."
      },
      "examples": {
        "તમે ગુજરાતી બરાબર બોલો છો.": {
          "native": "You speak Gujarati well.",
          "bases": {
            "ગુજરાતી": "Gujarati",
            "છો": "to be"
          }
        },
        "તે બરાબર સમજે છે.": {
          "native": "He or she understands properly.",
          "bases": {
            "છે": "to be"
          }
        }
      }
    },
    "gu-1111": {
      "native": "slowly",
      "notes": {
        "n1": "The opposite of ઝડપથી (jhaḍapthi) (quickly)."
      },
      "examples": {
        "મહેરબાની કરીને ધીમે બોલો.": {
          "native": "Please speak slowly.",
          "bases": {
            "મહેરબાની": "kindness; favour"
          }
        },
        "બાળક ધીમે ચાલે છે.": {
          "native": "The child walks slowly.",
          "bases": {
            "છે": "to be"
          }
        }
      }
    },
    "gu-1112": {
      "native": "quickly; fast",
      "notes": {
        "n1": "The opposite of ધીમે (dhime) (slowly)."
      },
      "examples": {
        "તે ઝડપથી દોડે છે.": {
          "native": "He or she runs fast.",
          "bases": {
            "છે": "to be"
          }
        },
        "ઝડપથી ખાઓ, ટ્રેન આવે છે.": {
          "native": "Eat quickly, the train is coming.",
          "bases": {
            "છે": "to be"
          }
        }
      }
    },
    "gu-1113": {
      "native": "soon; quickly",
      "notes": {
        "n1": "Used for something that happens soon, or when asking someone to hurry."
      },
      "examples": {
        "હું જલદી આવીશ.": "I will come soon.",
        "તમે જલદી ઊઠો.": "Get up quickly."
      }
    },
    "gu-1114": {
      "native": "very; a lot",
      "notes": {
        "n1": "Used before an adjective or a verb: ખૂબ (khub) સરસ (saras) means very nice."
      },
      "examples": {
        "તારું ઘર ખૂબ સરસ છે.": {
          "native": "Your house is very nice.",
          "bases": {
            "સરસ": "nice; fine; lovely",
            "છે": "to be"
          }
        },
        "મને ખૂબ ગમે છે.": {
          "native": "I like it very much.",
          "bases": {
            "ગમે": "to like",
            "છે": "to be"
          }
        }
      }
    },
    "gu-1115": {
      "native": "a little; a bit",
      "notes": {
        "n1": "Used for a small amount of something."
      },
      "examples": {
        "મને થોડું પાણી આપો.": "Give me a little water.",
        "તે થોડું ખાય છે.": {
          "native": "He or she eats a little.",
          "bases": {
            "છે": "to be"
          }
        }
      }
    },
    "gu-1116": {
      "native": "more; too much",
      "notes": {
        "n1": "More of something. Also used for too much."
      },
      "examples": {
        "મને વધારે ચા આપો.": "Give me more tea.",
        "તમે વધારે ખાઓ છો.": {
          "native": "You eat too much.",
          "bases": {
            "છો": "to be"
          }
        }
      }
    },
    "gu-1117": {
      "native": "less; a little",
      "notes": {
        "n1": "The opposite of વધારે (vadhāre) (more)."
      },
      "examples": {
        "તેઓ ઓછું બોલે છે.": {
          "native": "They speak less.",
          "bases": {
            "છે": "to be"
          }
        },
        "તે ઓછું ખાય છે.": {
          "native": "He or she eats less.",
          "bases": {
            "છે": "to be"
          }
        }
      }
    },
    "gu-1118": {
      "native": "only; just",
      "notes": {
        "n1": "Used for only one thing or person."
      },
      "examples": {
        "ફક્ત એક ચા લો.": "Just one tea, please.",
        "અહીં ફક્ત બે લોકો છે.": {
          "native": "Only two people are here.",
          "bases": {
            "લોકો": "people",
            "છે": "to be"
          }
        }
      }
    },
    "gu-1119": {
      "native": "again",
      "notes": {
        "n1": "Once more, a second time."
      },
      "examples": {
        "ફરી આવજો.": "Come again.",
        "તે ફરી ફોન કરે છે.": {
          "native": "He or she calls again.",
          "bases": {
            "ફોન": "phone; a phone call",
            "છે": "to be"
          }
        }
      }
    },
    "gu-1120": {
      "native": "before; first",
      "notes": {
        "n1": "Before something else: પહેલાં (pahelām) ... પછી (pachi) means first ... then."
      },
      "examples": {
        "તમે પહેલાં ક્યાં રહેતા હતા?": {
          "native": "Where did you live before?",
          "bases": {
            "રહેતા": "to live; to stay",
            "હતા": "to be"
          }
        },
        "જતાં પહેલાં મને કહો.": "Tell me before you go."
      }
    },
    "gu-1121": {
      "native": "then; after",
      "notes": {
        "n1": "Next, after something else."
      },
      "examples": {
        "પહેલાં ચા, પછી નાસ્તો.": "First tea, then breakfast.",
        "પછી અમે ચાલીશું.": "Then we will walk."
      }
    },
    "gu-1122": {
      "native": "now; from now on",
      "notes": {
        "n1": "Now, at this moment, or from this point on."
      },
      "examples": {
        "હવે હું જાઉં છું.": {
          "native": "Now I am going.",
          "bases": {
            "છું": "to be"
          }
        },
        "હવે ઘરે જઈએ.": {
          "native": "Let us go home now.",
          "bases": {
            "ઘરે": "at home"
          }
        }
      }
    },
    "gu-1123": {
      "native": "in the morning",
      "notes": {
        "n1": "For the morning part of the day."
      },
      "examples": {
        "હું સવારે ચા પીઉં છું.": {
          "native": "I drink tea in the morning.",
          "bases": {
            "છું": "to be"
          }
        },
        "તેઓ સવારે ચાલે છે.": {
          "native": "They walk in the morning.",
          "bases": {
            "છે": "to be"
          }
        }
      }
    },
    "gu-1124": {
      "native": "in the afternoon; at lunchtime",
      "notes": {
        "n1": "For the afternoon part of the day."
      },
      "examples": {
        "અમે બપોરે જમીએ છીએ.": {
          "native": "We have lunch in the afternoon.",
          "bases": {
            "છીએ": "to be"
          }
        },
        "બપોરે બાળકો રમે છે.": {
          "native": "In the afternoon the children play.",
          "bases": {
            "છે": "to be"
          }
        }
      }
    },
    "gu-1125": {
      "native": "in the evening",
      "notes": {
        "n1": "For the evening part of the day."
      },
      "examples": {
        "સાંજે દાદી ફરવા જાય છે.": {
          "native": "In the evening grandma goes out for a walk.",
          "bases": {
            "ફરવા": "to go around; to travel for pleasure",
            "છે": "to be"
          }
        },
        "સાંજે મીના ફોન કરશે.": {
          "native": "In the evening Meena will call.",
          "bases": {
            "મીના": "Meena (a name)",
            "ફોન": "phone; a phone call"
          }
        }
      }
    },
    "gu-1126": {
      "native": "at night",
      "notes": {
        "n1": "For the night."
      },
      "examples": {
        "બાળકો રાત્રે સૂઈ જાય છે.": {
          "native": "Children go to sleep at night.",
          "bases": {
            "છે": "to be"
          }
        },
        "હું રાત્રે વાંચું છું.": {
          "native": "I read at night.",
          "bases": {
            "છું": "to be"
          }
        }
      }
    },
    "gu-1127": {
      "native": "yesterday",
      "notes": {
        "n1": "Yesterday. The word for tomorrow is કાલે (kāle)."
      },
      "examples": {
        "હું ગઈકાલે બજારમાં ગયો.": "I went to the market yesterday.",
        "તમે ગઈકાલે શું કર્યું?": "What did you do yesterday?"
      }
    },
    "gu-1128": {
      "native": "at once; immediately",
      "notes": {
        "n1": "Straight away, without waiting."
      },
      "examples": {
        "તે તરત આવશે.": "He or she will come at once.",
        "મને તરત કહો.": "Tell me at once."
      }
    },
    "gu-1129": {
      "native": "still; yet",
      "notes": {
        "n1": "Still, up to now: with a negative it means not yet."
      },
      "examples": {
        "બાળક હજી સૂતું છે.": {
          "native": "The child is still asleep.",
          "bases": {
            "છે": "to be"
          }
        },
        "હું હજી શીખું છું.": {
          "native": "I am still learning.",
          "bases": {
            "છું": "to be"
          }
        }
      }
    },
    "gu-1130": {
      "native": "truly; really",
      "notes": {
        "n1": "Used to stress that something is true, as in really?"
      },
      "examples": {
        "તમે સાચે ગુજરાતી બોલો છો?": {
          "native": "Do you really speak Gujarati?",
          "bases": {
            "ગુજરાતી": "Gujarati",
            "છો": "to be"
          }
        },
        "હું સાચે ખુશ છું.": {
          "native": "I am really happy.",
          "bases": {
            "ખુશ": "happy",
            "છું": "to be"
          }
        }
      }
    },
    "gu-1131": {
      "native": "not at all; completely",
      "notes": {
        "n1": "With a negative, it means not at all."
      },
      "examples": {
        "મને બિલકુલ ખબર નથી.": {
          "native": "I have no idea at all.",
          "bases": {
            "નથી": "to be"
          }
        },
        "તે બિલકુલ ખાતો નથી.": {
          "native": "He or she does not eat at all.",
          "bases": {
            "નથી": "to be"
          }
        }
      }
    },
    "gu-1132": {
      "native": "a little bit; just",
      "notes": {
        "n1": "A small amount, often used to be polite."
      },
      "examples": {
        "જરા રાહ જુઓ.": {
          "native": "Wait a moment.",
          "bases": {
            "રાહ": "wait"
          }
        },
        "મને જરા મદદ કરો.": "Please help me a little."
      }
    },
    "gu-1133": {
      "native": "a lot; much",
      "notes": {
        "n1": "A large amount, used with a noun or as an adverb."
      },
      "examples": {
        "તે ઘણું કામ કરે છે.": {
          "native": "He or she does a lot of work.",
          "bases": {
            "છે": "to be"
          }
        },
        "તમારું ઘર ઘણું સુંદર છે.": {
          "native": "Your house is very beautiful.",
          "bases": {
            "સુંદર": "beautiful",
            "છે": "to be"
          }
        }
      }
    },
    "gu-1134": {
      "native": "certainly; surely",
      "notes": {
        "n1": "Certain, without any doubt."
      },
      "examples": {
        "તે ચોક્કસ આવશે.": "He or she will surely come.",
        "હું ચોક્કસ જઈશ.": "I will certainly go."
      }
    }
  }
}
