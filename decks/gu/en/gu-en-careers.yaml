  "cards": {
    "gu-4060": {
      "native": "career; the course of a working life",
      "notes": {
        "n1": "A career is the whole working life over the years. One job is નોકરી (nokri)."
      },
      "examples": {
        "મારી કારકિર્દી સારી ચાલે છે.": {
          "native": "My career is going well.",
          "bases": {
            "કારકિર્દી": "career; the course of a working life",
            "સારી": "good (before a feminine noun)",
            "ચાલે": "goes on; works (of a thing)",
            "છે": "is"
          }
        },
        "કારકિર્દી માટે અનુભવ જરૂરી છે.": {
          "native": "Experience is needed for a career.",
          "bases": {
            "કારકિર્દી": "career; the course of a working life",
            "માટે": "for",
            "છે": "is"
          }
        }
      }
    },
    "gu-4061": {
      "native": "company; firm",
      "notes": {
        "n1": "A company that employs people is an employer; for the people who work there see કર્મચારી (karmacāri) and નોકરીદાતા (nokridātā)."
      },
      "examples": {
        "તે એક મોટી કંપનીમાં કામ કરે છે.": {
          "native": "He works in a big company.",
          "bases": {
            "મોટી": "big (feminine)",
            "કંપનીમાં": "in the company",
            "કરે": "does",
            "છે": "is"
          }
        },
        "કંપનીની નવી ઑફિસ ખૂલી.": {
          "native": "The company's new office opened.",
          "bases": {
            "કંપનીની": "the company's (feminine)",
            "નવી": "new (feminine)",
            "ખૂલી": "opened (feminine)"
          }
        }
      }
    },
    "gu-4062": {
      "native": "manager",
      "notes": {
        "n1": "A manager decides the work of other people; the boss over him may be called માલિક (mālik) or સાહેબ (sāheb)."
      },
      "examples": {
        "મેનેજરે આજે રજા આપી.": {
          "native": "The manager gave leave today.",
          "bases": {
            "મેનેજરે": "the manager (as the one who does)",
            "આપી": "gave"
          }
        },
        "મેનેજર બપોરે મળશે.": {
          "native": "The manager will be met in the afternoon.",
          "bases": {
            "મેનેજર": "manager",
            "મળશે": "will be met; will get"
          }
        }
      }
    },
    "gu-4063": {
      "native": "retired (no longer working)",
      "notes": {
        "n1": "It describes a person who has stopped work after a set age. The noun is નિવૃત્તિ (nivrutti)."
      },
      "examples": {
        "મારા પિતા હવે નિવૃત્ત છે.": {
          "native": "My father is retired now.",
          "bases": {
            "નિવૃત્ત": "retired (no longer working)",
            "છે": "is"
          }
        },
        "તે નિવૃત્ત શિક્ષક છે.": {
          "native": "He is a retired teacher.",
          "bases": {
            "નિવૃત્ત": "retired (no longer working)",
            "છે": "is"
          }
        }
      }
    },
    "gu-4064": {
      "native": "retirement",
      "notes": {
        "n1": "The word for the time after stopping work. The adjective for the person is નિવૃત્ત (nivrutt)."
      },
      "examples": {
        "નિવૃત્તિ પછી તે ગામમાં રહે છે.": {
          "native": "After retirement he lives in the village.",
          "bases": {
            "નિવૃત્તિ": "retirement",
            "ગામમાં": "in the village",
            "રહે": "lives; stays",
            "છે": "is"
          }
        },
        "નિવૃત્તિની તૈયારી ક્યારે કરશો?": {
          "native": "When will you prepare for retirement?",
          "bases": {
            "નિવૃત્તિની": "of retirement",
            "તૈયારી": "preparation",
            "કરશો": "will you do"
          }
        }
      }
    },
    "gu-4065": {
      "native": "profession; occupation; trade",
      "notes": {
        "n1": "The word for the kind of work a person does for a living, such as medicine or teaching."
      },
      "examples": {
        "તેનો વ્યવસાય શિક્ષણનો છે.": {
