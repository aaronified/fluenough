        },
        "આ વ્યવસાય માટે ધીરજ જરૂરી છે.": {
          "native": "Patience is needed for this profession.",
          "bases": {
            "વ્યવસાય": "profession; occupation; trade",
            "માટે": "for",
            "છે": "is"
          }
        }
      }
    },
    "gu-4066": {
      "native": "engineer",
      "notes": {
        "n1": "It is used for any engineer, of any field. Its pay is often higher than other jobs; see પગાર (pagār)."
      },
      "examples": {
        "મારો ભાઈ એન્જિનિયર છે.": {
          "native": "My brother is an engineer.",
          "bases": {
            "મારો": "my (masculine)",
            "એન્જિનિયર": "engineer",
            "છે": "is"
