        "મારે એક સારા વકીલની જરૂર છે.": {
          "native": "I need a good lawyer.",
          "bases": {
            "મારે": "I need; I have to",
            "સારા": "good (plural)",
            "વકીલની": "of the lawyer",
            "જરૂર": "need",
            "છે": "is"
          }
        }
      }
    },
    "gu-4068": {
      "native": "cook; chef",
