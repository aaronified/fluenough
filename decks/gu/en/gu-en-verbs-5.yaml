{
  "schema": 1,
  "id": "gu-en-verbs-5",
  "kind": "layer",
  "core": "gu-verbs-5",
  "native": {
    "code": "en",
    "iso639_3": "eng",
    "name": "English"
  },
  "name": "Sequence actions: what happened next",
  "license": "CC-BY-SA-4.0",
  "description": "Verbs for telling what happened next, in order: starting, finishing, arriving, leaving and changing. Not yet checked by a Gujarati speaker: please report any mistake.",
  "cards": {
    "gu-5180": {
      "native": "to begin; to start",
      "notes": {
        "n1": "Used when a thing starts by itself, such as a film or the rain. To say that someone starts a thing, use શરૂ કરવું (śaru karvum̐)."
      },
      "examples": {
        "ફિલ્મ સાંજે સાતે શરૂ થઈ.": {
          "native": "The film started at seven in the evening.",
          "bases": {
            "ફિલ્મ": "film",
            "શરૂ": "start; beginning"
          }
        },
        "વરસાદ શરૂ થયો.": {
          "native": "The rain started.",
          "bases": {
            "વરસાદ": "rain",
            "શરૂ": "start; beginning"
          }
        }
      },
      "bases": {
        "શરૂ": "start; beginning"
      }
    },
    "gu-5181": {
      "native": "to prepare; to get ready",
      "notes": {
        "n1": "The adjective તૈયાર (taiyār) (ready) comes before the verb, so ભોજન તૈયાર કર્યું (bhojan taiyār karyum̐) is 'prepared the meal': the thing made ready comes first, then તૈયાર (taiyār), then the verb."
      },
      "examples": {
        "મમ્મીએ ભોજન તૈયાર કર્યું.": {
          "native": "Mum prepared the meal.",
          "bases": {
            "ભોજન": "meal",
            "તૈયાર": "ready"
          }
        },
        "તેણે નાસ્તો તૈયાર કર્યો.": {
          "native": "He prepared the breakfast.",
          "bases": {
            "નાસ્તો": "breakfast; snack",
            "તૈયાર": "ready"
          }
        }
      },
      "bases": {
        "તૈયાર": "ready"
      }
    },
    "gu-5182": {
      "native": "to gather; to come together",
      "notes": {
        "n1": "Used for people or things coming together in one place. The word ભેગા (bhegā) (together) goes before થવું (thavum̐)."
      },
      "examples": {
        "બધા સગાં સાંજે ઘરે ભેગા થયા.": {
          "native": "All the relatives gathered at home in the evening.",
          "bases": {
            "બધા": "all; everyone",
            "ભેગા": "together"
          }
        },
        "વિદ્યાર્થીઓ શાળાના મેદાનમાં ભેગા થયા.": {
          "native": "The students gathered in the school ground.",
          "bases": {
            "ભેગા": "together"
          }
        }
      },
      "bases": {
        "ભેગા": "together"
      }
    },
    "gu-5183": {
      "native": "to move on; to move forward",
      "notes": {
        "n1": "આગળ (āgaḷ) means forward. વધવું (vadhvum̐) alone means to grow or increase, so this pair is about moving on, not about growing."
      },
      "examples": {
        "ટ્રાફિક ધીમેથી આગળ વધ્યો.": {
          "native": "The traffic moved forward slowly.",
          "bases": {
            "ટ્રાફિક": "traffic",
            "ધીમેથી": "slowly",
            "આગળ": "forward"
          }
        },
        "હવે આપણે આગળ વધીએ.": {
          "native": "Now let's move on.",
          "bases": {
            "હવે": "now",
            "આપણે": "we (including you)",
            "આગળ": "forward"
          }
        }
      },
      "bases": {
        "વધવું": "to increase; to grow"
      }
    },
    "gu-5184": {
      "native": "to come back; to return",
      "notes": {
        "n1": "પાછા (pāchā) means back. With a verb of movement it gives a return: પાછા આવવું (pāchā āvvum̐) is to come back and પાછા જવું (pāchā javum̐) is to go back."
      },
      "examples": {
        "ભાઈ કાલે પાછા આવશે.": {
          "native": "Brother will come back tomorrow.",
          "bases": {
            "ભાઈ": "brother",
            "પાછા": "back"
          }
        },
        "મા બજારથી પાછી આવી.": {
          "native": "Mother came back from the market.",
          "bases": {
            "મા": "mother"
          }
        }
      },
      "bases": {
        "પાછા": "back; again"
      }
    },
    "gu-5185": {
      "native": "to go back; to return",
      "notes": {
        "n1": "The same pattern as પાછા આવવું (pāchā āvvum̐). The form of પાછો (pācho) (back, for a masculine subject) or પાછી (pāchi) (for a feminine one) follows the subject."
      },
      "examples": {
        "દીકરો શાળાએથી પાછો ગયો.": {
          "native": "The son went back from school.",
          "bases": {
            "દીકરો": "son"
          }
        },
        "અમે ઘરે પાછા જઈશું.": {
          "native": "We will go back home.",
          "bases": {
            "અમે": "we",
            "પાછા": "back"
          }
        }
      },
      "bases": {
        "પાછા": "back; again"
      }
    },
    "gu-5186": {
      "native": "to find out; to track down",
      "notes": {
        "n1": "Two verbs together: શોધવું (śodhvum̐) (to search) and કાઢવું (kāḍhvum̐) (to take out). Together they mean to find something after a search."
      },
      "examples": {
        "પોલીસે ચોર શોધી કાઢ્યો.": {
          "native": "The police tracked down the thief.",
          "bases": {
            "ચોર": "thief"
          }
        },
        "ડૉક્ટરે ભૂલ શોધી કાઢી.": {
          "native": "The doctor found out the mistake.",
          "bases": {
            "ભૂલ": "mistake"
          }
        }
      }
    },
    "gu-5187": {
      "native": "to hand over; to give away",
      "notes": {
        "n1": "દેવું (devum̐) after આપી (āpi) shows the giving is finished and complete: the thing has gone to the other person for good."
      },
      "examples": {
        "મેં ચાવી પાડોશીને આપી દીધી.": {
          "native": "I handed the key over to the neighbour.",
          "bases": {
            "ચાવી": "key"
          }
        },
        "તેણે પુસ્તક મિત્રને આપી દીધું.": {
          "native": "He handed the book over to his friend.",
          "bases": {
            "પુસ્તક": "book"
          }
        }
      }
    },
    "gu-5188": {
      "native": "to leave; to go away",
      "notes": {
        "n1": "Literally 'walk and go'. It is the everyday word for leaving, and it can describe someone who leaves in anger."
      },
      "examples": {
        "મહેમાનો રાત્રે ચાલ્યા ગયા.": {
          "native": "The guests left at night."
        },
        "તે ગુસ્સામાં ચાલ્યો ગયો.": {
          "native": "He walked out in anger.",
          "bases": {
            "તે": "he; she; it"
          }
        }
      }
    },
    "gu-5189": {
      "native": "to arrive at last; to get there",
      "notes": {
        "n1": "આવી (āvi) (come) and પહોંચવું (pahoñcavum̐) (reach) together stress arriving at last, after a journey."
      },
      "examples": {
        "અમે સાંજે ઘરે આવી પહોંચ્યા.": {
          "native": "We got home in the evening.",
          "bases": {
            "અમે": "we"
          }
        },
        "ટ્રેન આજે સવારે આવી પહોંચી.": {
          "native": "The train arrived this morning.",
          "bases": {
            "ટ્રેન": "train"
          }
        }
      }
    },
    "gu-5190": {
      "native": "to agree",
      "notes": {
        "n1": "સહમત (sahmat) means in agreement and goes before થવું (thavum̐). To say who one agrees with, use સાથે (sāthe) (with)."
      },
      "examples": {
        "બધા સભ્યો સહમત થયા.": {
          "native": "All the members agreed.",
          "bases": {
            "બધા": "all; everyone",
            "સહમત": "in agreement"
          }
        },
        "હું તમારી સાથે સહમત છું.": {
          "native": "I agree with you.",
          "bases": {
            "હું": "I",
            "સાથે": "with",
            "સહમત": "in agreement"
          }
        }
      },
      "bases": {
        "સહમત": "agreed; in agreement"
      }
    },
    "gu-5191": {
      "native": "to hurry",
      "notes": {
        "n1": "ઉતાવળ (utāvaḷ) is the noun for hurry, and કરવી (karvi) makes it a verb. The noun comes first, as with other noun-plus-કરવું (karvum̐) verbs."
      },
      "examples": {
        "ઉતાવળ ન કરો, હજી સમય છે.": {
          "native": "Don't hurry, there is still time.",
          "bases": {
            "ઉતાવળ": "hurry",
            "ન": "not",
            "હજી": "still; yet",
            "સમય": "time"
          }
        },
        "તેણે ઉતાવળ કરી.": {
          "native": "He hurried.",
          "bases": {
            "ઉતાવળ": "hurry"
          }
        }
      }
    },
    "gu-5192": {
      "native": "to change; to be changed",
      "notes": {
        "n1": "The thing changes by itself (intransitive). To change a thing on purpose, use બદલવું (badlvum̐) (to exchange; to change)."
      },
      "examples": {
        "હવામાન ઝડપથી બદલાયું.": {
          "native": "The weather changed quickly.",
          "bases": {
            "હવામાન": "weather",
            "ઝડપથી": "quickly"
          }
        },
        "મારો વિચાર બદલાયો.": {
          "native": "My idea changed.",
          "bases": {
            "વિચાર": "thought; idea"
          }
        }
      }
    },
    "gu-5193": {
      "native": "to be done; to be over",
      "notes": {
        "n1": "જવું (javum̐) after થઈ (thai) shows the action is finished: થઈ ગયું (thai gayum̐) means it is done, complete."
      },
      "examples": {
        "કામ થઈ ગયું.": {
          "native": "The work is done.",
          "bases": {
            "કામ": "work; job"
          }
        },
        "ભોજન તૈયાર થઈ ગયું.": {
          "native": "The meal is ready.",
          "bases": {
            "ભોજન": "meal",
            "તૈયાર": "ready"
          }
        }
      }
    },
    "gu-5194": {
      "native": "to get back; to recover",
      "notes": {
        "n1": "પાછું (pāchum̐) (back) comes before મેળવવું (meḷvvum̐) (to get). It is used for getting back something one lost or gave away."
      },
      "examples": {
        "મેં મારા પૈસા પાછા મેળવ્યા.": {
          "native": "I got my money back.",
          "bases": {
            "પાછા": "back"
          }
        },
        "ગ્રાહકે રસીદ પાછી મેળવી.": {
          "native": "The customer got the receipt back.",
          "bases": {
            "રસીદ": "receipt"
          }
        }
      },
      "bases": {
        "પાછું": "back; again"
      }
    },
    "gu-5195": {
      "native": "to bring along; to fetch",
      "notes": {
        "n1": "લઈ (lai) is take and આવવું (āvvum̐) is come. Together they mean to take something and bring it here."
      },
      "examples": {
        "મમ્મી મારા માટે દૂધ લઈ આવી.": {
          "native": "Mum brought some milk for me.",
          "bases": {
            "મમ્મી": "mum",
            "માટે": "for",
            "દૂધ": "milk"
          }
        },
        "ભાઈ ચોપડી લઈ આવ્યો.": {
          "native": "Brother brought the book.",
          "bases": {
            "ભાઈ": "brother",
            "ચોપડી": "book"
          }
        }
      }
    },
    "gu-5196": {
      "native": "to decide; to make a decision",
      "notes": {
        "n1": "The noun નિર્ણય (nirṇay) (decision) takes the verb લેવું (levum̐) (to take), as in English 'make a decision'."
      },
      "examples": {
        "અમે આજે નિર્ણય લીધો.": {
          "native": "We made a decision today.",
          "bases": {
            "અમે": "we",
            "નિર્ણય": "decision"
          }
        },
        "માતાએ કઠિન નિર્ણય લેવો પડ્યો.": {
          "native": "Mother had to make a hard decision.",
          "bases": {
            "કઠિન": "hard; difficult",
            "નિર્ણય": "decision"
          }
        }
      }
    },
    "gu-5197": {
      "native": "to fix; to settle",
      "notes": {
        "n1": "નક્કી (nakki) means fixed or settled and comes before કરવું (karvum̐). It is used for a time, a plan or a price."
      },
      "examples": {
        "અમે મળવાનો સમય નક્કી કર્યો.": {
          "native": "We fixed the time to meet.",
          "bases": {
            "અમે": "we",
            "સમય": "time",
            "નક્કી": "fixed; settled"
          }
        },
        "યોજના નક્કી છે.": {
          "native": "The plan is fixed.",
          "bases": {
            "યોજના": "plan",
            "નક્કી": "fixed; settled"
          }
        }
      },
      "bases": {
        "નક્કી": "decided; fixed"
      }
    },
    "gu-5198": {
      "native": "to restart; to start again",
      "notes": {
        "n1": "ફરી (phari) means again. It comes before શરૂ કરવું (śaru karvum̐), so the phrase means to start again."
      },
      "examples": {
        "ચાલો, આપણે ફરી શરૂ કરીએ.": {
          "native": "Come on, let's start again.",
          "bases": {
            "આપણે": "we (including you)",
            "ફરી": "again",
            "શરૂ": "start; beginning"
          }
        },
        "તેણે ગાડી ફરી શરૂ કરી.": {
          "native": "He started the car again.",
          "bases": {
            "ગાડી": "car; vehicle",
            "ફરી": "again",
            "શરૂ": "start; beginning"
          }
        }
      },
      "bases": {
        "શરૂ": "start; beginning"
      }
    },
    "gu-5199": {
      "native": "to come in",
      "notes": {
        "n1": "અંદર (andar) means inside. Use this verb for coming into a room or a building."
      },
      "examples": {
        "મહેમાન અંદર આવ્યા.": {
          "native": "The guest came in.",
          "bases": {
            "મહેમાન": "guest",
            "અંદર": "inside"
          }
        },
        "બારીમાંથી ઠંડો પવન અંદર આવ્યો.": {
          "native": "A cold wind came in through the window.",
          "bases": {
            "ઠંડો": "cold",
            "પવન": "wind",
            "અંદર": "inside"
          }
        }
      }
    },
    "gu-5200": {
      "native": "to go out",
      "notes": {
        "n1": "બહાર (bahār) means outside. બહાર જવું (bahār javum̐) is to go out of a house or a place, for a short trip or for a purpose."
      },
      "examples": {
        "બાળક રમવા બહાર ગયું.": {
          "native": "The child went out to play.",
          "bases": {
            "બાળક": "child",
            "બહાર": "outside; out"
          }
        },
        "મમ્મી ખરીદી માટે બહાર ગઈ.": {
          "native": "Mum went out shopping.",
          "bases": {
            "મમ્મી": "mum",
            "ખરીદી": "shopping",
            "માટે": "for",
            "બહાર": "outside; out"
          }
        }
      }
    }
  }
}
