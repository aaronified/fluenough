schema: 1
id: "gu-en-questions"
kind: "layer"
core: "gu-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Yes, no and questions"
license: "CC0-1.0"
description: "Yes and no, and the question words: what, who, where, when, why, how and how much. Most start with k-. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0283":
    native: "yes"
    notes:
      "n1": "Often just a nod, or a sideways tilt of the head, which also means yes."
  "gu-0284":
    native: "no"
    notes:
      "n1": "ના પાડવી (nā pāḍvi) is 'to say no; to refuse'. નહીં (nahim̐), 'not', is a firmer no."
  "gu-0285":
    native: "what"
    notes:
      "n1": "At the start of a sentence it also turns it into a yes-or-no question: શું તમે આવશો (śum̐ tame āvśo)? Will you come?"
  "gu-0286":
    native: "who"
    notes:
      "n1": "With the curled-back ણ (ṇa). કોણ છે (koṇ che)? Who is it?"
  "gu-0287":
    native: "where"
    notes:
      "n1": "The long a is nasal. ક્યાંથી (kyānthi), from where."
  "gu-0288":
    native: "when"
  "gu-0289":
    native: "why; how"
    notes:
      "n1": "Both 'why' and 'how': કેમ છો? (kem chho?), how are you?; કેમ મોડું થયું? (kem modun thayun?), why are you late?"
  "gu-0290":
    native: "how; in what way"
    notes:
      "n1": "Literally 'in what way'. આ કેવી રીતે બને (ā kevi rite bane)? How is this made?"
  "gu-0291":
    native: "how much"
    notes:
      "n1": "It agrees with what is counted: કેટલા રૂપિયા? (ketla rupiya?), how many rupees?; કેટલી વાર? (ketli var?), how many times?"
  "gu-0292":
    native: "which"
    notes:
      "n1": "It agrees with its noun: કયો રસ્તો (kayo rasto)? which road? (m); કઈ બસ? (kai bas?) which bus? (f); કયું ઘર (kayum̐ ghar)? which house? (n)."
  "gu-0293":
    native: "whose"
    notes:
      "n1": "Agrees like 'my': કોનો ભાઈ (kono bhāi)? whose brother?; કોની ગાડી (koni gāḍi)? whose car?"
  "gu-0294":
    native: "really?"
    notes:
      "n1": "Also ખરું? (kharun?), true? right?"
  "gu-0295":
    native: "I don't know."
    notes:
      "n1": "Literally 'to me there is no news'."
