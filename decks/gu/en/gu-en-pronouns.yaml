"id": "gu-en-pronouns"
"kind": "layer"
"core": "gu-pronouns"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Pronouns and people words"
"license": "CC-BY-SA-4.0"
"description": "Gujarati personal, possessive and indefinite pronouns, with examples of each. Not yet checked by a Gujarati speaker: please report any mistake."
"tags":
- "unreviewed"
"cards":
  "gu-1000":
    "native": "he; she; it"
    "notes":
      "n1": "The same word for he, she and it. Gujarati does not change the verb for gender: the verb form is the same."
    "examples":
      "તે ડૉક્ટર છે.":
        "native": "He is a doctor; she is a doctor."
        "bases":
          "છે": "to be"
      "તે શિક્ષિકા છે.":
        "native": "She is a teacher."
        "bases":
          "શિક્ષિકા": "female teacher"
          "છે": "to be"
  "gu-1001":
    "native": "they; he or she, with respect"
    "notes":
      "n1": "The respectful and plural form. Use it for an elder, or for more than one person."
    "examples":
      "તેઓ ઘરે છે.":
        "native": "They are at home."
        "bases":
          "ઘરે": "at home"
          "છે": "to be"
      "તેઓ ક્યાં છે?":
        "native": "Where are they?"
        "bases":
          "છે": "to be"
  "gu-1002":
    "native": "my (before a neuter noun)"
    "notes":
      "n1": "Used before a neuter noun such as પુસ્તક (pustak) (book) or ઘર (ghar) (house). Before a feminine noun use મારી (māri); before a masculine or plural noun use મારા (mārā)."
    "examples":
      "મારું પુસ્તક ટેબલ પર છે.":
        "native": "My book is on the table."
        "bases":
          "પુસ્તક": "book"
          "પર": "on; upon"
          "છે": "to be"
      "મારું નામ મીના છે.":
        "native": "My name is Meena."
        "bases":
          "મીના": "Meena (a name)"
          "છે": "to be"
  "gu-1003":
    "native": "my (before a feminine noun)"
    "notes":
      "n1": "Used before a feminine noun such as બહેન (bahen) (sister) or માતા (mātā) (mother)."
    "examples":
      "મારી બહેન ડૉક્ટર છે.":
        "native": "My sister is a doctor."
        "bases":
          "છે": "to be"
      "મારી માતા શિક્ષિકા છે.":
        "native": "My mother is a teacher."
        "bases":
          "શિક્ષિકા": "female teacher"
          "છે": "to be"
  "gu-1004":
    "native": "my (before a masculine or plural noun)"
    "notes":
      "n1": "Used before a masculine noun such as ભાઈ (bhāi) (brother), and before a plural noun such as મિત્રો (mitro) (friends)."
    "examples":
      "મારા ભાઈ શિક્ષક છે.":
        "native": "My brother is a teacher."
        "bases":
          "છે": "to be"
      "મારા મિત્રો અહીં છે.":
        "native": "My friends are here."
        "bases":
          "મિત્રો": "friend"
          "છે": "to be"
  "gu-1005":
    "native": "your (to a friend; before a neuter noun)"
    "notes":
      "n1": "The informal your, for a friend or a child. The polite and plural form is તમારું (tamārum̐)."
    "examples":
      "તારું નામ શું છે?":
        "native": "What is your name?"
        "bases":
          "છે": "to be"
      "તારું ઘર ક્યાં છે?":
        "native": "Where is your house?"
        "bases":
          "છે": "to be"
  "gu-1006":
    "native": "your (polite or plural; before a neuter noun)"
    "notes":
      "n1": "The polite your, for an adult you do not know well, or for more than one person."
    "examples":
      "તમારું ઘર સરસ છે.":
        "native": "Your house is nice."
        "bases":
          "સરસ": "nice; fine; lovely"
          "છે": "to be"
      "તમારું પુસ્તક ક્યાં છે?":
        "native": "Where is your book?"
        "bases":
          "પુસ્તક": "book"
          "છે": "to be"
  "gu-1007":
    "native": "our (you and I; before a neuter noun)"
    "notes":
      "n1": "Our, when the person you speak to is included. For our without that person, use અમારું (amārum)."
    "examples":
      "આપણું ઘર નાનું છે.":
        "native": "Our house is small."
        "bases":
          "નાનું": "small"
          "છે": "to be"
      "આપણું ગામ સુંદર છે.":
        "native": "Our village is beautiful."
        "bases":
          "ગામ": "village"
          "સુંદર": "beautiful"
          "છે": "to be"
  "gu-1008":
    "native": "me; to me"
    "notes":
      "n1": "The form of હું (hum̐) (I) used for \"to me\". With ગમે (game) (likes), it means \"I like\"."
    "examples":
      "મને કેરી ગમે છે.":
        "native": "I like mangoes."
        "bases":
          "ગમે": "to like"
          "છે": "to be"
      "મને બધું ગમે છે.":
        "native": "I like everything."
        "bases":
          "ગમે": "to like"
          "છે": "to be"
  "gu-1009":
    "native": "you (to a friend); to you"
    "notes":
      "n1": "The form of તું (tum̐) (you, informal) used for \"to you\", as in \"you like\"."
    "examples":
      "તને ચા ગમે છે?":
        "native": "Do you like tea?"
        "bases":
          "ગમે": "to like"
          "છે": "to be"
      "તને શું ગમે છે?":
        "native": "What do you like?"
        "bases":
          "ગમે": "to like"
          "છે": "to be"
  "gu-1010":
    "native": "him; her; to him or her"
    "notes":
      "n1": "The form of તે (te) used for \"to him\" or \"to her\", as in \"he or she likes\"."
    "examples":
      "તેને ગુજરાતી આવડે છે.":
        "native": "He or she knows Gujarati."
        "bases":
          "ગુજરાતી": "Gujarati"
          "આવડે": "knows how to"
          "છે": "to be"
      "તેને બહેન છે.":
        "native": "He or she has a sister."
        "bases":
          "છે": "to be"
  "gu-1011":
    "native": "us; to us"
    "notes":
      "n1": "The form of અમે (ame) (we) used for \"to us\", as in \"we like\"."
    "examples":
      "અમને અહીં ગમે છે.":
        "native": "We like it here."
        "bases":
          "ગમે": "to like"
          "છે": "to be"
      "અમને ગુજરાતી આવડે છે.":
        "native": "We know Gujarati."
        "bases":
          "ગુજરાતી": "Gujarati"
          "આવડે": "knows how to"
          "છે": "to be"
  "gu-1012":
    "native": "someone; anyone; some"
    "notes":
      "n1": "In a question or with a negative, કોઈ (koi) means anyone, as in \"there is no one there\"."
    "examples":
      "કોઈ અહીં છે?":
        "native": "Is anyone here?"
        "bases":
          "છે": "to be"
      "ઘરમાં કોઈ નથી.":
        "native": "There is no one at home."
        "bases":
          "નથી": "to be"
  "gu-1013":
    "native": "something; anything"
    "notes":
      "n1": "The thing version of કોઈ (koi). With a negative it means nothing, as in \"there is nothing here\"."
    "examples":
      "અહીં કંઈ નથી.":
        "native": "There is nothing here."
        "bases":
          "નથી": "to be"
      "તું કંઈ ખાય છે?":
        "native": "Are you eating something?"
        "bases":
          "છે": "to be"
  "gu-1014":
    "native": "everything; all"
    "notes":
      "n1": "For things. For people, use બધા (badhā)."
    "examples":
      "બધું તૈયાર છે.":
        "native": "Everything is ready."
        "bases":
          "તૈયાર": "ready"
          "છે": "to be"
      "મને બધું ગમે છે.":
        "native": "I like everything."
        "bases":
          "ગમે": "to like"
          "છે": "to be"
  "gu-1015":
    "native": "all; everyone"
    "notes":
      "n1": "For people. For things, use બધું (badhum̐). The form બધાને (badhāne) is used for \"to everyone\"."
    "examples":
      "બધા અહીં આવ્યા.": "Everyone came here."
      "બધા ક્યાં છે?":
        "native": "Where is everyone?"
        "bases":
          "છે": "to be"
  "gu-1016":
    "native": "another; the other; more"
    "notes":
      "n1": "For a thing; for a person, use બીજું (bijum̐) કોઈ (koi) (someone else)."
    "examples":
      "બીજું પુસ્તક ક્યાં છે?":
        "native": "Where is the other book?"
        "bases":
          "પુસ્તક": "book"
          "છે": "to be"
      "બીજું કામ છે.":
        "native": "There is other work."
        "bases":
          "છે": "to be"
  "gu-1017":
    "native": "Subject pronouns: I, you, he or she, we, they"
    "explanation": "Gujarati has three words for you: તું (tum̐) for a friend or a child, તમે (tame) for a polite or plural you, and આપ (āp) for the most respectful. In the present tense the verb after them is the same for a man or a woman."
  "gu-1018":
    "native": "Possessives: my, your and our"
    "explanation": "Each word agrees with the noun after it, not with the speaker: મારું (mārum̐) and તમારું (tamārum̐) go before a neuter noun, મારી (māri) before a feminine noun, and મારા (mārā) before a masculine or plural noun."
