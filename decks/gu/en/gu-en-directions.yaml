schema: 1
id: "gu-en-directions"
kind: "layer"
core: "gu-directions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Directions"
license: "CC0-1.0"
description: "Left, right, straight on, near and far: asking the way and understanding the answer. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0443":
    native: "Where is the station?"
    notes:
      "n1": "Any place, then ક્યાં છે (kyām̐ che)?. Start with ભાઈ (bhāi) or બહેન (bahen) to a stranger: ભાઈ (bhāi), સ્ટેશન ક્યાં છે (sṭeśan kyām̐ che)?"
  "gu-0444":
    native: "road; the way"
    notes:
      "n1": "Both a road and a route: રસ્તો બતાવો (rasto batāvo), show me the way."
  "gu-0445":
    native: "on the left; to the left"
    notes:
      "n1": "ડાબું (ḍābum̐) is 'left'; ડાબે (ḍābe), 'on the left'."
  "gu-0446":
    native: "on the right; to the right"
    notes:
      "n1": "જમણું (jamṇum̐) is 'right'. Easy to mix with જમવું (jamvum̐), to eat: listen for the ણ (ṇa)."
  "gu-0447":
    native: "Go straight on."
  "gu-0448":
    native: "Turn left."
    notes:
      "n1": "વળવું (vaḷvum̐) is to turn. Turn right: જમણે વળો (jamṇe vaḷo)."
  "gu-0449":
    native: "crossroads; junction"
    notes:
      "n1": "Literally 'four roads'. Directions are given by them: બીજા ચાર રસ્તે ડાબે (bijā cār raste ḍābe), left at the second crossroads."
  "gu-0450":
    native: "corner"
  "gu-0451":
    native: "near; nearby"
    notes:
      "n1": "અહીં પાસે (ahim̐ pāse), near here."
  "gu-0452":
    native: "far"
    notes:
      "n1": "કેટલું દૂર છે? (ketlun dur chhe?), how far is it?"
  "gu-0453":
    native: "ahead; in front"
  "gu-0454":
    native: "behind; back"
  "gu-0455":
    native: "up; upstairs; above"
  "gu-0456":
    native: "down; downstairs; below"
