  "name": "Services: sentences",
  "license": "CC-BY-SA-4.0",
  "description": "Sentences about the post, banks, forms and repairs. Not yet checked by a Gujarati speaker: please report any mistake.",
  "cards": {
    "gu-3842": {
      "native": "Send the parcel from the post office.",
      "bases": {
        "ટપાલઘરથી": "post office",
        "મોકલો": "to send"
      },
      "confusables": {
        "c1": {
          "why": "ટપાલી (ṭapāli) (postman) delivers letters; he does not send a parcel."
        },
        "c2": {
          "why": "પેકેટ (pekeṭ) (packet) is a small wrapped item, not the postal service."
        }
      }
    },
    "gu-3843": {
      "native": "The queue is long, take a token.",
      "bases": {
        "લાંબી": "long (in length)",
        "છે": "to be",
        "લો": "to take"
      },
      "confusables": {
        "c1": {
          "why": "ફી (phi) (fee) is money you pay, not the numbered slip you take."
        },
        "c2": {
          "why": "કાઉન્ટર (kāunṭar) (counter) is where you are served, not the line."
        }
      }
    },
    "gu-3844": {
      "native": "Do you have an account at the bank?",
      "bases": {
        "બેંકમાં": "bank; also written બૅન્ક (bênk)",
        "છે": "to be"
      },
      "confusables": {
        "c1": {
          "why": "કાર્ડ (kārḍ) (card) is plastic; the account is in the bank."
        },
        "c2": {
          "why": "રોકડ (rokaḍ) (cash) is money in hand, not an account."
        }
      }
    },
    "gu-3845": {
      "native": "Apply for a loan.",
      "bases": {
        "લોન": "loan",
        "માટે": "for",
        "કરો": "to do"
      },
      "confusables": {
        "c1": {
          "why": "ફોર્મ (phorma) (form) is the paper you fill in; the application is the request."
        },
        "c2": {
          "why": "ફરિયાદ (fariyād) (complaint) is about a problem, not a request for a loan."
        }
      }
    },
    "gu-3846": {
      "native": "Give the ironing to the washerman.",
      "bases": {
        "ધોબીને": "washerman; laundry man",
        "આપો": "to give"
      },
      "confusables": {
        "c1": {
          "why": "દરજી (darji) (tailor) sews clothes; he does not wash them."
        },
        "c2": {
          "why": "મોચી (moci) (shoe repairer) works on shoes, not clothes."
        }
      }
    },
    "gu-3847": {
      "native": "Pay in cash.",
      "bases": {
        "રોકડમાં": "cash",
        "કરો": "to do"
      },
      "confusables": {
        "c1": {
          "why": "બિલ (bil) (bill) is the list of what you owe; it is not the payment itself."
        },
        "c2": {
          "why": "ચેક (cek) (cheque) is an order to a bank, not cash."
        }
      }
    },
    "gu-3848": {
      "native": "Put the letter in the envelope.",
      "bases": {
        "લિફાફામાં": "envelope",
        "નાખો": "to put in; to throw"
      },
      "confusables": {
        "c1": {
          "why": "સ્ટેમ્પ (sṭemp) (stamp) pays the postage; it does not hold the letter."
        },
        "c2": {
          "why": "ટપાલપેટી (ṭapālpeṭi) (postbox) is where the letter goes once it is sealed."
        }
      }
    },
    "gu-3849": {
      "native": "Where is the bank to fill in this form?",
      "bases": {
        "આ": "this",
        "ભરવા": "to fill",
        "માટે": "for",
        "છે": "to be"
      },
      "confusables": {
        "c1": {
          "why": "એટીએમ (eṭiem) (ATM) gives cash; it does not take a form."
        },
        "c2": {
          "why": "કાઉન્ટર (kāunṭar) (counter) is one service desk inside a bank."
        }
      }
    },
    "gu-3850": {
      "native": "The repair is quick.",
      "bases": {
        "છે": "to be"
      },
      "confusables": {
        "c1": {
          "why": "સરળ (saraḷ) (easy) is about how simple a thing is, not how fast it is done."
        },
        "c2": {
          "why": "ઝડપથી (jhaḍapthi) (quickly) is an adverb; here the word is an adjective."
        }
      }
    },
    "gu-3851": {
      "native": "The insurance is not cheap.",
      "bases": {
        "સસ્તો": "cheap",
        "નથી": "to be"
      },
      "confusables": {
        "c1": {
          "why": "ફી (phi) (fee) is paid for a service."
        },
        "c2": {
          "why": "ભાડું (bhāḍum̐) (fare; rent) is paid for a journey or a room."
        }
      }
    }
  }
}
