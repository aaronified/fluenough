    "examples":
      "ટિકિટબારી પર લાંબી લાઇન છે.":
        "native": "There is a long queue at the ticket window."
        "bases":
          "ટિકિટબારી": "ticket window"
          "પર": "on; at"
          "લાંબી": "long"
          "લાઇન": "queue; line"
          "છે": "to be"
      "ટિકિટબારીએ ટિકિટ લો.":
