"cards":
  "gu-3202":
    "native": "traveller; passenger"
    "notes":
      "n1": "A person who is on the way, on a train, a bus or a plane. The plural is મુસાફરો (musāfaro)."
    "examples":
      "ટ્રેનમાં ઘણા મુસાફરો હતા.":
        "native": "There were many passengers in the train."
        "bases":
          "મુસાફરો": "traveller; passenger"
          "હતા": "to be"
      "બસમાં એક મુસાફર બેઠો હતો.":
        "native": "A passenger was sitting in the bus."
        "bases":
          "મુસાફર": "traveller; passenger"
          "હતો": "to be"
  "gu-3203":
    "native": "tourist"
    "notes":
      "n1": "A visitor who travels for pleasure or to see a place."
    "examples":
      "આ શહેરમાં ઘણા પ્રવાસીઓ આવે છે.":
        "native": "Many tourists come to this city."
        "bases":
          "પ્રવાસીઓ": "tourist"
          "છે": "to be"
      "પ્રવાસી નકશો જોઈ રહ્યો છે.":
