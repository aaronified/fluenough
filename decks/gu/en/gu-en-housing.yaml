    "gu-4667": {
      "native": "tenant",
      "notes": {
        "n1": "The person who rents a home from an owner."
      },
      "examples": {
        "ભાડૂઆત મહિનાનું ભાડું આપે છે.": {
          "native": "The tenant pays the monthly rent.",
          "bases": {
            "ભાડૂઆત": "tenant",
            "મહિનાનું": "monthly",
            "આપે": "pays; gives",
            "છે": "is"
          }
        },
        "ઘરના માલિકે ભાડૂઆતને ચાવી આપી.": {
          "native": "The owner gave the tenant the key.",
          "bases": {
            "ઘરના": "of the house",
            "માલિકે": "the owner",
            "ભાડૂઆતને": "tenant",
            "આપી": "gave (feminine)"
          }
        }
      }
    },
