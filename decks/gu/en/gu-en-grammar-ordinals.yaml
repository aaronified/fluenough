name: "Ordinals: first, second, third"
license: "CC-BY-SA-4.0"
description: "The first, the second, the third: the ordinal numbers, which change with the gender of the noun they count, as an adjective does. The ordinal is made from the number, as પાંચમો (pāñcamo) comes from પાંચ (pāñc), five. Not yet checked by a Gujarati speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "Ordinals: first, second"
  slot_name: "gender of the noun"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "ek": "one; the first"
    "be": "two; the second"
    "tran": "three; the third"
    "char": "four; the fourth"
    "panch": "five; the fifth"
    "chh": "six; the sixth"
    "sat": "seven; the seventh"
    "ath": "eight; the eighth"
    "nav": "nine; the ninth"
    "das": "ten; the tenth"
  notes: "The ordinal agrees with the noun, like an adjective: પહેલો માળ (pahelo māḷ), the first floor (m); પહેલી તારીખ (paheli tārikh), the first date (f); પહેલું ઘર (pahelum̐ ghar), the first house (n). From five on the ordinal is the number with -મો (-mo), for example પાંચમો (pāñcamo) , fifth. The first four are irregular: પહેલો (pahelo), બીજો (bijo), ત્રીજો (trijo) and ચોથો (cotho)."
