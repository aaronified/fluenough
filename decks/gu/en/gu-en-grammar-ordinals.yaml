native: { code: "en", iso639_3: "eng", name: "English" }
name: "Ordinals: first to twentieth"
license: "CC-BY-SA-4.0"
description: "The first, the second, the third, up to the twentieth: the ordinal numbers, which change with the gender of the noun they count, as an adjective does. Not yet checked by a Gujarati speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "Ordinals"
  slot_name: "gender of the noun"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "ek": "one; the first"
    "be": "two; the second"
    "tran": "three; the third"
    "char": "four; the fourth"
    "panch": "five; the fifth"
    "chh": "six; the sixth"
    "sat": "seven; the seventh"
    "ath": "eight; the eighth"
    "nav": "nine; the ninth"
    "das": "ten; the tenth"
    "agiyar": "eleven; the eleventh"
    "bar": "twelve; the twelfth"
    "ter": "thirteen; the thirteenth"
    "chaud": "fourteen; the fourteenth"
    "pandar": "fifteen; the fifteenth"
    "sol": "sixteen; the sixteenth"
    "sattar": "seventeen; the seventeenth"
    "adhar": "eighteen; the eighteenth"
    "ogonis": "nineteen; the nineteenth"
    "vis": "twenty; the twentieth"
  notes: "The ordinal agrees with the noun, like an adjective: પહેલો માળ (pahelo māḷ), the first floor (m); પહેલી તારીખ (paheli tārikh), the first date (f); પહેલું ઘર (pahelum̐ ghar), the first house (n). From five on, the ordinal is the cardinal with -મો (-mo) for m, -મી (-mi) for f and -મું (-mum̐) for n, as in પાંચમો (pāñcamo) for fifth, and it goes on to twenty. The first four are irregular: બીજો (bijo), ત્રીજો (trijo) and ચોથો (cotho) (second, third, fourth), and પહેલો (pahelo) (first)."
