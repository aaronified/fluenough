schema: 1
id: "gu-en-multiword-idiomatic-verbs"
kind: "layer"
core: "gu-multiword-idiomatic-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: idiomatic verbs"
license: "CC-BY-SA-4.0"
description: "Four verb phrases whose meaning is not the sum of their parts: to lie down and rest, to be in trouble, to tell a lie, and to skip school or work. Not yet checked by a Gujarati speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "gu-6402":
    native: "to lie"
    notes:
      "u1": "The verb is બોલવું (bolvum̐), to speak; the noun જુઠ્ઠું (juṭṭhum̐), a lie, is what is spoken, so the phrase is said of telling a lie."
    bases:
      "જુઠ્ઠું": "a lie"
    examples:
      "તે જુઠ્ઠું બોલ્યો.":
        native: "He lied."
        bases:
          "જુઠ્ઠું": "a lie"
      "જુઠ્ઠું બોલવું ખોટું છે.":
        native: "Lying is wrong."
        bases:
          "જુઠ્ઠું": "a lie"
          "છે": "to be"
  "gu-6403":
    native: "to skip school or work; to play truant"
    notes:
      "u1": "An informal, slang phrase for skipping school or work without leave. The verb મારવી (mārvi), to hit, is feminine because ગુલ્લી (gulli) is feminine."
    bases:
      "ગુલ્લી": "a skipped class (slang)"
      "મારવી": "to hit; here, to skip (the phrase)"
    examples:
      "તે રોજ ગુલ્લી મારે છે.":
        native: "He skips school every day."
        bases:
          "ગુલ્લી": "a skipped class (slang)"
          "મારે": "to hit; here, to skip (the phrase)"
          "છે": "to be"
      "તેણે આજે ગુલ્લી મારી?":
        native: "Did he skip school today?"
        bases:
          "ગુલ્લી": "a skipped class (slang)"
          "મારી": "to hit; here, to skip (the phrase)"
  "gu-6500":
    native: "to lie down; to rest; to go to sleep"
    notes:
      "u1": "Literal parts: આડું (āḍum̐), crosswise, and પડવું (paḍvum), to fall. The first word agrees with the person lying down, as in આડો (āḍo) for a man. It is used for a short rest."
    bases:
      "આડું": "crosswise; lying across"
      "પડવું": "to fall; here, to lie down"
    examples:
      "હું આડો પડું છું.":
        native: "I am lying down."
        bases:
          "આડો": "crosswise; lying across"
          "પડું": "to fall; here, to lie down"
          "છું": "to be"
      "તે બપોરે આડો પડ્યો.":
        native: "He lay down in the afternoon."
        bases:
          "આડો": "crosswise; lying across"
          "પડ્યો": "to fall; here, to lie down"
  "gu-6501":
    native: "to be in trouble"
    notes:
      "u1": "An informal, spoken phrase for being in trouble with someone such as a parent or the police. The possessive, મારું (mārum̐) or તારું (tārum̐), names the person in trouble, and બનવું (banvum), to become, says what happens to them."
    bases:
      "આવી": "part of the phrase: in trouble"
      "બનવું": "to become"
    examples:
      "મારું આવી બનશે.":
        native: "I will be in trouble."
        bases:
          "આવી": "part of the phrase: in trouble"
          "બનશે": "to become"
      "પોલીસ આવશે, તો તારું આવી બનશે.":
        native: "If the police come, you will be in trouble."
        bases:
          "તો": "then; so"
          "આવી": "part of the phrase: in trouble"
          "બનશે": "to become"
