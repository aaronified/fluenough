  "cards": {
    "gu-4470": {
      "native": "The groom and bride are ready for the wedding.",
      "bases": {
        "લગ્ન": "wedding",
        "માટે": "for",
        "તૈયાર": "ready",
        "છે": "are"
      },
      "confusables": {
        "c1": {
          "why": "ભેટ (bheṭ) (gift) is given at a wedding, not the wedding itself."
        },
        "c2": {
          "why": "મહેમાન (mahemān) (guest) comes to the wedding, not the couple."
        }
      }
    },
    "gu-4471": {
      "native": "The invitation card has been given to the guests.",
      "bases": {
        "મહેમાનોને": "to the guests",
        "આપી": "gave",
        "છે": "is"
      },
      "confusables": {
