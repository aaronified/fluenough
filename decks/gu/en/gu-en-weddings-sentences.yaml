          "why": "આમંત્રણ (āmantraṇ) (invitation) is the general word, not the printed card."
        },
        "c2": {
          "why": "મહેમાન (mahemān) (guest) is a person, not an invitation."
        }
      }
    },
    "gu-4472": {
      "native": "The wedding party has reached the village.",
      "bases": {
