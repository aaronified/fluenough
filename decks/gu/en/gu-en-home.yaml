schema: 1
id: "gu-en-home"
kind: "layer"
core: "gu-home"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Home and neighbourhood"
license: "CC0-1.0"
description: "The rooms and things of a house, the roof where kites fly, and the lanes, temple, school and clinic around it. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0048":
    notes:
      "n1": "ઘરે (ghare) is 'at home' or 'home': ઘરે જાઉં છું (ghare jāum̐ chum̐), I'm going home."
  "gu-0457":
    native: "room"
    notes:
      "n1": "Also રૂમ (rum), from English."
  "gu-0458":
    native: "kitchen"
  "gu-0459":
    native: "bathroom"
    notes:
      "n1": "A toilet is often called સંડાસ (saṇḍās) or ટૉઇલેટ (ṭôileṭ)."
  "gu-0460":
    native: "door"
    notes:
      "n1": "Also દરવાજો (darvājo), a bigger door or gate."
  "gu-0461":
    native: "window"
  "gu-0462":
    native: "bed"
    notes:
      "n1": "A simple woven cot is a ખાટલો (khāṭlo)."
  "gu-0463":
    native: "chair"
  "gu-0464":
    native: "table"
  "gu-0465":
    native: "ceiling fan; fan"
  "gu-0466":
    native: "light; electricity"
    notes:
      "n1": "લાઇટ ગઈ (lāiṭ gai): the power's gone."
  "gu-0467":
    native: "key"
    notes:
      "n1": "From Portuguese chave."
  "gu-0468":
    native: "flat roof; terrace"
    notes:
      "n1": "On ઉત્તરાયણ (uttarāyaṇ), 14 January, all Gujarat is on its roofs flying kites."
  "gu-0469":
    native: "neighbour"
  "gu-0470":
    native: "street; lane"
  "gu-0471":
    native: "pol (a gated old-city neighbourhood)"
    notes:
      "n1": "Old Ahmedabad is built of પોળ (poḷ): lanes of houses behind one gate, often one community's."
  "gu-0472":
    native: "temple"
    notes:
      "n1": "Also દેરાસર (derāsar), a Jain temple."
  "gu-0473":
    native: "school"
    notes:
      "n1": "Also નિશાળ (niśāḷ), and સ્કૂલ (skul)."
  "gu-0474":
    native: "clinic; doctor's surgery"
    notes:
      "n1": "Literally 'medicine house'. A hospital is હૉસ્પિટલ (hôspiṭal)."
  "gu-0475":
    native: "garden; park"
  "gu-0476":
    native: "My house is near the station."
