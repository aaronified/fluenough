"name": "Words for the news: papers, reporters, elections and warnings"
"license": "CC-BY-SA-4.0"
"description": "Words for newspapers, radio and television, what is reported (accidents, fires, floods, elections) and the people and institutions in the news. Words already taught in earlier units are reused by reference. Not yet checked by a Gujarati speaker: please report any mistake."
"cards":
  "gu-3597":
    "native": "newspaper"
    "notes":
      "n1": "છાપું (chāpum) is the everyday word for a newspaper; સમાચારપત્ર (samācārpatra) (samācārpatra) is the formal word."
    "examples":
      "દરરોજ સવારે છાપું વાંચું છું.":
        "native": "I read the newspaper every morning."
        "bases":
          "દરરોજ": "daily"
          "સવારે": "morning"
          "છાપું": "newspaper"
          "વાંચું": "to read"
          "છું": "to be"
      "છાપું ક્યાં છે?":
        "native": "Where is the newspaper?"
        "bases":
          "છાપું": "newspaper"
          "ક્યાં": "where"
          "છે": "to be"
