            "આ": "this",
            "શહેર": "city",
            "નાનું": "small",
            "હતું": "was"
          }
        },
        "ભૂતકાળ વિશે વાંચવું ગમે છે.": {
          "native": "I like to read about the past.",
          "bases": {
