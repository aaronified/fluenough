schema: 1
id: "gu-en-calendar"
kind: "layer"
core: "gu-calendar"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Months and years"
license: "CC0-1.0"
description: "Months, seasons and years, the English calendar beside the Hindu one, and the festivals that mark the Gujarati year. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0521":
    native: "month"
  "gu-0522":
    native: "year"
    notes:
      "n1": "In speech also વરસ (varas)."
  "gu-0523":
    native: "date"
    notes:
      "n1": "આજે કઈ તારીખ છે? (aje kai tarikh chhe?), what's the date today?"
  "gu-0524":
    native: "January"
    notes:
      "n1": "The English months are used for dates, offices and schools, said much as in English. Festivals follow the Hindu calendar."
  "gu-0525":
    native: "Kartak, the first month of the Gujarati year (October to November)"
    notes:
      "n1": "The Gujarati year, in the Vikram Samvat calendar, starts in કારતક (kārtak), the day after Diwali. The Hindu months move against the English ones from year to year."
  "gu-0526":
    native: "Ashadh (about June to July), when the rains come"
  "gu-0527":
    native: "Shravan (about July to August)"
    notes:
      "n1": "A month of fasting and festivals, Raksha Bandhan and Janmashtami among them."
  "gu-0528":
    native: "Aso (about September to October), the last month of the year"
    notes:
      "n1": "Navratri falls in its first nine nights, and Diwali on its last day."
  "gu-0529":
    native: "summer"
    notes:
      "n1": "Hot, from March to June: the season of mangoes."
  "gu-0530":
    native: "the rainy season; monsoon"
    notes:
      "n1": "Literally 'four months', from about June to September."
  "gu-0531":
    native: "winter"
  "gu-0532":
    native: "Diwali"
    notes:
      "n1": "The festival of lamps, at the end of the Gujarati year."
  "gu-0533":
    native: "Gujarati New Year's Day"
    notes:
      "n1": "The day after Diwali. People greet each other with સાલ મુબારક (sāl mubārak) and નૂતન વર્ષાભિનંદન (nutan varśābhinandan)."
    bases:
      "બેસતું": "to sit; to begin (of a year)"
  "gu-0534":
    native: "Navratri, the nine nights of dance"
    notes:
      "n1": "Nine nights of ગરબા (garbā) and રાસ (rās), danced in circles, in Aso."
  "gu-0535":
    native: "Uttarayan, the kite festival (14 January)"
    notes:
      "n1": "The day the sun turns north. All Gujarat flies kites from its roofs."
  "gu-0536":
    native: "birthday"
    notes:
      "n1": "Also બર્થડે (barthḍe)."
  "gu-0537":
    native: "last year"
    notes:
      "n1": "Literally 'in the gone year'. જવું (javum̐) changes its stem in the past: ગ- (g-), as in ગયો (gayo), ગઈ (gai), ગયું (gayum̐)."
  "gu-0538":
    native: "next month"
    notes:
      "n1": "Literally 'in the coming month'. Next year: આવતા વર્ષે (āvtā varśe)."
