schema: 1
id: "gu-en-addressing"
kind: "layer"
core: "gu-addressing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Addressing people"
license: "CC0-1.0"
description: "Gujarati calls almost everyone brother, sister, uncle or aunt, and adds -bhai and -ben to names. How to address people with the right respect. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0307":
    native: "brother; any man"
    notes:
      "n1": "Added to a man's name with respect, written joined: રમેશભાઈ (rameśbhāi). On its own it is how you call a shopkeeper, a driver or any man: ભાઈ (bhāi), આ કેટલાનું છે (ā keṭlānum̐ che)?"
  "gu-0308":
    native: "sister; any woman"
    notes:
      "n1": "Added to a woman's name: ગીતાબહેન (gitābahen), often said and written ગીતાબેન (gitāben). On its own it is how you address a woman you don't know."
  "gu-0309":
    native: "uncle (father's brother); an older man"
    notes:
      "n1": "Children and young people call any man of their father's age કાકા (kākā)."
  "gu-0310":
    native: "aunt (mother's sister); an older woman"
    notes:
      "n1": "Children call women of their mother's age માસી (māsi). It is also how many address a woman who helps in the house."
  "gu-0311":
    native: "grandfather (father's father); an old man"
  "gu-0312":
    native: "mother; grandmother; an old woman"
    notes:
      "n1": "Some families call the mother બા (bā), others the grandmother. Gandhi's wife Kasturba was known to all as બા (bā). Spoken of with respect, she takes a plural verb: બા આવ્યાં (bā āvyām̐), Ba has come."
  "gu-0313":
    native: "sir"
    notes:
      "n1": "For an officer, a teacher or a boss, and after a surname: પટેલ સાહેબ (paṭel sāheb)."
  "gu-0314":
    native: "child (said to a son, a daughter or any child)"
    notes:
      "n1": "Said by an elder to a younger person, boy or girl, with affection."
  "gu-0315":
    native: "Mr"
    notes:
      "n1": "Written before a man's name: શ્રી રમેશ પટેલ (śri rameś paṭel). શ્રીમતી (śrimati) is Mrs. In speech, the name with -ભાઈ (-bhāi) or -બહેન (-bahen) is more usual."
  "gu-0316":
    native: "you (very formal)"
    notes:
      "n1": "In speeches, letters and signs: આપનું સ્વાગત છે (āpnum̐ svāgat che), you are welcome. It takes the same verb as તમે (tame): આપ ક્યારે પધારશો? (ap kyare padharsho?), when will you come?"
  "gu-0317":
    native: "friend; mate"
    notes:
      "n1": "Also મિત્ર (mitra), more formal. A woman's friend is often બહેનપણી (bahenpaṇi)."
  "gu-0318":
    native: "excuse me (to get someone's attention); listen"
    notes:
      "n1": "Literally 'listen'. Also એ ભાઈ! (e bhai!), hey, brother!"
