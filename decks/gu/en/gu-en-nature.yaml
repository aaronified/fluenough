          "ઝાડ": "tree"
          "છે": "to be"
      "ઝાડ નીચે છાંયો છે.":
        "native": "There is shade under the tree."
        "bases":
          "ઝાડ": "tree"
          "છાંયો": "shade"
          "છે": "to be"
