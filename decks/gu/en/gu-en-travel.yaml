{
  "schema": 1,
  "id": "gu-en-travel",
  "kind": "layer",
  "core": "gu-travel",
  "native": {
    "code": "en",
    "iso639_3": "eng",
    "name": "English"
  },
  "name": "Travel",
  "license": "CC-BY-SA-4.0",
  "description": "Hotels, bookings, tickets, places to visit and the words for planning a trip. Not yet checked by a Gujarati speaker: please report any mistake.",
  "cards": {
    "gu-3780": {
      "native": "taxi; cab",
      "notes": {
        "n1": "ટેક્સી (ṭeksi) is the usual word for a cab in a town. Agree the fare before you get in."
      },
      "examples": {
        "ટેક્સી ક્યાં છે?": {
          "native": "Where is the taxi?",
          "bases": {
            "ટેક્સી": "taxi; cab",
            "છે": "to be"
          }
        },
        "મને ટેક્સી આપો.": {
          "native": "Get me a taxi.",
          "bases": {
            "ટેક્સી": "taxi; cab",
            "આપો": "to give"
          }
        }
      }
    },
    "gu-3781": {
      "native": "platform",
      "notes": {
        "n1": "A loan word from English. Station boards show the platform number, as in નંબર બે (nambar be)."
      },
      "examples": {
        "ટ્રેન પ્લેટફોર્મ પર આવશે.": {
          "native": "The train will come to the platform.",
          "bases": {
            "પ્લેટફોર્મ": "platform",
            "પર": "on; at",
            "આવશે": "to come"
          }
        },
        "પ્લેટફોર્મ ક્યાં છે?": {
          "native": "Where is the platform?",
          "bases": {
            "પ્લેટફોર્મ": "platform",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3782": {
      "native": "luggage",
      "notes": {
        "n1": "Used for all the luggage together. A single bag is થેલો (thelo)."
      },
      "examples": {
        "સામાન ભારે છે.": {
          "native": "The luggage is heavy.",
          "bases": {
            "સામાન": "luggage",
            "છે": "to be"
          }
        },
        "સામાન ક્યાં મૂકીશું?": {
          "native": "Where shall we put the luggage?",
          "bases": {
            "સામાન": "luggage",
            "મૂકીશું": "to put; to place"
          }
        }
      }
    },
    "gu-3783": {
      "native": "reservation; booking",
      "notes": {
        "n1": "A place booked in advance, for a seat, a berth or a room. Ask at the counter whether one is needed."
      },
      "examples": {
        "મારું આરક્ષણ છે.": {
          "native": "I have a reservation.",
          "bases": {
            "આરક્ષણ": "reservation; booking",
            "છે": "to be"
          }
        },
        "આરક્ષણ નંબર આપો.": {
          "native": "Give me the reservation number.",
          "bases": {
            "આરક્ષણ": "reservation; booking",
            "આપો": "to give"
          }
        }
      }
    },
    "gu-3784": {
      "native": "museum",
      "notes": {
        "n1": "The formal word. In everyday speech many people say the loan word મ્યુઝિયમ (myujhiyam)."
      },
      "examples": {
        "સંગ્રહાલય ક્યાં છે?": {
          "native": "Where is the museum?",
          "bases": {
            "સંગ્રહાલય": "museum",
            "છે": "to be"
          }
        },
        "સંગ્રહાલય સવારે ખુલ્લું હોય છે.": {
          "native": "The museum is open in the morning.",
          "bases": {
            "સંગ્રહાલય": "museum",
            "હોય": "to be",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3785": {
      "native": "public park",
      "notes": {
        "n1": "A large public park. For a small garden, see બગીચો (bagico)."
      },
      "examples": {
        "ઉદ્યાનમાં ફરવા જઈશું.": {
          "native": "We will go to the park to walk around.",
          "bases": {
            "ઉદ્યાનમાં": "public park",
            "ફરવા": "to go out; to wander",
            "જઈશું": "to go"
          }
        },
        "ઉદ્યાન સુંદર છે.": {
          "native": "The park is beautiful.",
          "bases": {
            "ઉદ્યાન": "public park",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3786": {
      "native": "fair; festival with stalls",
      "notes": {
        "n1": "A fair with stalls and crowds, often near a temple or in a village."
      },
      "examples": {
        "ગામમાં મોટો મેળો છે.": {
          "native": "There is a big fair in the village.",
          "bases": {
            "ગામમાં": "village",
            "મેળો": "fair; festival with stalls",
            "છે": "to be"
          }
        },
        "મેળો સાંજે છે.": {
          "native": "The fair is in the evening.",
          "bases": {
            "મેળો": "fair; festival with stalls",
            "સાંજે": "evening",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3787": {
      "native": "guide (a person)",
      "notes": {
        "n1": "A person who shows visitors around a place. For a map, see નકશો (nakaśo)."
      },
      "examples": {
        "માર્ગદર્શક સાથે જાઓ.": {
          "native": "Go with a guide.",
          "bases": {
            "માર્ગદર્શક": "guide (a person)",
            "સાથે": "with",
            "જાઓ": "to go"
          }
        },
        "માર્ગદર્શક મંદિર બતાવશે.": {
          "native": "The guide will show the temple.",
          "bases": {
            "માર્ગદર્શક": "guide (a person)",
            "બતાવશે": "to show"
          }
        }
      }
    },
    "gu-3788": {
      "native": "registration; check-in",
      "notes": {
        "n1": "Giving your name and details at a hotel desk or an office so that you are recorded."
      },
      "examples": {
        "નોંધણી ક્યાં છે?": {
          "native": "Where is the registration?",
          "bases": {
            "નોંધણી": "registration; check-in",
            "છે": "to be"
          }
        },
        "નોંધણી માટે પાસપોર્ટ બતાવો.": {
          "native": "Show your passport for registration.",
          "bases": {
            "નોંધણી": "registration; check-in",
            "માટે": "for",
            "બતાવો": "to show"
          }
        }
      }
    },
    "gu-3789": {
      "native": "overnight stay",
      "notes": {
        "n1": "A stay for one night. To say you are staying, use રોકાવું (rokāvum̐), to stay."
      },
      "examples": {
        "અમારો રાતવાસો હોટેલમાં છે.": {
          "native": "Our overnight stay is at the hotel.",
          "bases": {
            "અમારો": "our",
            "રાતવાસો": "overnight stay",
            "હોટેલમાં": "hotel",
            "છે": "to be"
          }
        },
        "રાતવાસો સસ્તો નથી.": {
          "native": "The overnight stay is not cheap.",
          "bases": {
            "રાતવાસો": "overnight stay",
            "સસ્તો": "cheap",
            "નથી": "to be"
          }
        }
      }
    },
    "gu-3790": {
      "native": "worth seeing",
      "notes": {
        "n1": "Worth a visit, said of a temple, a fort or a view. It does not change for gender."
      },
      "examples": {
        "આ કિલ્લો જોવાલાયક છે.": {
          "native": "This fort is worth seeing.",
          "bases": {
            "આ": "this",
            "જોવાલાયક": "worth seeing",
            "છે": "to be"
          }
        },
        "ગામમાં ઘણું જોવાલાયક છે.": {
          "native": "There is a lot worth seeing in the village.",
          "bases": {
            "ગામમાં": "village",
            "જોવાલાયક": "worth seeing",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3791": {
      "native": "eating place; canteen",
      "notes": {
        "n1": "A plain place to eat, such as a canteen or a small restaurant."
      },
      "examples": {
        "ભોજનાલય રાત્રે ખુલ્લું છે.": {
          "native": "The eating place is open at night.",
          "bases": {
            "ભોજનાલય": "eating place; canteen",
            "છે": "to be"
          }
        },
        "ભોજનાલય સ્ટેશન પાસે છે.": {
          "native": "The eating place is near the station.",
          "bases": {
            "ભોજનાલય": "eating place; canteen",
            "પાસે": "near; at",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3792": {
      "native": "to book",
      "notes": {
        "n1": "A loan verb: the English word બુક (buk) with કરવું (karvum̐) (to do). Only the helper verb changes its form."
      },
      "examples": {
        "હું ટિકિટ બુક કરીશ.": {
          "native": "I will book the ticket.",
          "bases": {
            "બુક": "to book",
            "કરીશ": "to do"
          }
        },
        "હોટેલ આજે બુક કરો.": {
          "native": "Book the hotel today.",
          "bases": {
            "બુક": "to book",
            "કરો": "to do"
          }
        }
      }
    },
    "gu-3793": {
      "native": "delay",
      "notes": {
        "n1": "A delay in a journey or a service. To apologise for it, say માફ (māf) with કરો (karo)."
      },
      "examples": {
        "ટ્રેનમાં વિલંબ છે.": {
          "native": "There is a delay on the train.",
          "bases": {
            "ટ્રેનમાં": "train",
            "વિલંબ": "delay",
            "છે": "to be"
          }
        },
        "વિલંબ માટે માફ કરો.": {
          "native": "Sorry for the delay.",
          "bases": {
            "વિલંબ": "delay",
            "માટે": "for",
            "માફ": "to forgive; sorry",
            "કરો": "to do"
          }
        }
      }
    },
    "gu-3794": {
      "native": "language",
      "notes": {
        "n1": "To ask which language, use the feminine question word કઈ (kai) before ભાષા (bhāśā)."
      },
      "examples": {
        "તમે કઈ ભાષા બોલો છો?": {
          "native": "Which language do you speak?",
          "bases": {
            "કઈ": "which",
            "ભાષા": "language",
            "બોલો": "to speak",
            "છો": "to be"
          }
        },
        "ભાષા સરળ છે.": {
          "native": "The language is easy.",
          "bases": {
            "ભાષા": "language",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3795": {
      "native": "counter; service desk",
      "notes": {
        "n1": "A loan word for a service desk at a station, a bank or a shop. Add પર (par) (on, at) after it."
      },
      "examples": {
        "કાઉન્ટર ક્યાં છે?": {
          "native": "Where is the counter?",
          "bases": {
            "કાઉન્ટર": "counter; service desk",
            "છે": "to be"
          }
        },
        "કાઉન્ટર પર પૂછો.": {
          "native": "Ask at the counter.",
          "bases": {
            "કાઉન્ટર": "counter; service desk",
            "પર": "on; at",
            "પૂછો": "to ask"
          }
        }
      }
    },
    "gu-3796": {
      "native": "visa",
      "notes": {
        "n1": "A loan word. Add ની (ni) to the noun to say whose it is: વીઝાની (vijhāni) is the visa's."
      },
      "examples": {
        "વીઝા ક્યાં મળશે?": {
          "native": "Where will I get a visa?",
          "bases": {
            "વીઝા": "visa",
            "મળશે": "to meet; to be found"
          }
        },
        "વીઝાની તારીખ ક્યારે છે?": {
          "native": "When is the visa date?",
          "bases": {
            "વીઝાની": "visa",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3797": {
      "native": "journey; voyage",
      "notes": {
        "n1": "A journey, often a long one by road, rail or sea. Compare મુસાફરી (musāphari) (travel) and યાત્રા (yātrā) (a pilgrimage)."
      },
      "examples": {
        "સફર લાંબી હતી.": {
          "native": "The journey was long.",
          "bases": {
            "સફર": "journey; voyage",
            "લાંબી": "long (in length)",
            "હતી": "to be"
          }
        },
        "સફર સલામત રહી.": {
          "native": "The journey was safe.",
          "bases": {
            "સફર": "journey; voyage",
            "રહી": "to stay; to live"
          }
        }
      }
    },
    "gu-3798": {
      "native": "stop; halting place",
      "notes": {
        "n1": "A stop on a journey, or the place you are heading for. Compare મંજિલ (mañjil) (the final destination)."
      },
      "examples": {
        "આપણો મુકામ ક્યાં છે?": {
          "native": "Where is our stop?",
          "bases": {
            "આપણો": "our (including you)",
            "મુકામ": "stop; halting place",
            "છે": "to be"
          }
        },
        "અમારો મુકામ નજીક છે.": {
          "native": "Our stop is near.",
          "bases": {
            "અમારો": "our",
            "મુકામ": "stop; halting place",
            "છે": "to be"
          }
        }
      }
    },
    "gu-3799": {
      "native": "north",
      "notes": {
        "n1": "A compass direction. To say towards the north, add તરફ (taraf) (towards): ઉત્તર તરફ (uttar taraf)."
      },
      "examples": {
        "શહેર ઉત્તરમાં છે.": {
          "native": "The city is in the north.",
          "bases": {
            "ઉત્તરમાં": "north",
            "છે": "to be"
          }
        },
        "ઉત્તર તરફ જાઓ.": {
          "native": "Go north.",
          "bases": {
            "ઉત્તર": "north",
            "તરફ": "towards",
            "જાઓ": "to go"
          }
        }
      }
    },
    "gu-3800": {
      "native": "available",
      "notes": {
        "n1": "Said of a room, a ticket or a seat that you can have. The opposite is said with નથી (nathi) (is not)."
      },
      "examples": {
        "ઓરડો ઉપલબ્ધ છે?": {
          "native": "Is a room available?",
          "bases": {
            "ઉપલબ્ધ": "available",
            "છે": "to be"
          }
        },
        "ટિકિટ ઉપલબ્ધ નથી.": {
          "native": "The ticket is not available.",
          "bases": {
            "ઉપલબ્ધ": "available",
            "નથી": "to be"
          }
        }
      }
    }
  }
}
