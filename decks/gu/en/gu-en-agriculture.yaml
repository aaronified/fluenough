  "cards": {
    "gu-4135": {
      "native": "crop; the harvest of a field",
      "notes": {
        "n1": "It is the plants grown in a field, such as wheat or cotton. The word also means the harvest that comes in: a good પાક (pāk), a good crop."
      },
      "examples": {
        "આ વર્ષે પાક સારો છે.": {
          "native": "The crop is good this year.",
          "bases": {
            "પાક": "crop; the harvest of a field",
            "સારો": "good (masculine)",
            "છે": "is"
          }
        },
        "ખેડૂતે નવો પાક વાવ્યો.": {
          "native": "The farmer sowed a new crop.",
          "bases": {
            "ખેડૂતે": "the farmer (as doer)",
            "પાક": "crop; the harvest of a field",
            "વાવ્યો": "sowed (masculine)"
          }
        }
      }
    },
    "gu-4136": {
      "native": "grain; cereal food",
      "notes": {
        "n1": "It is the seeds of cereal plants, such as wheat, rice and maize, eaten as food."
      },
      "examples": {
        "ગામમાં અનાજ ભરવાનું ગોડાઉન છે.": {
          "native": "The village has a store for keeping grain.",
          "bases": {
            "ગામમાં": "in the village",
            "અનાજ": "grain; cereal food",
            "ભરવાનું": "of filling; for storing",
            "ગોડાઉન": "store; warehouse",
            "છે": "is"
          }
        },
        "આ વર્ષે અનાજના ભાવ વધ્યા.": {
          "native": "Grain prices rose this year.",
          "bases": {
            "અનાજના": "of grain",
            "વધ્યા": "rose (masculine plural)"
          }
        }
      }
    },
    "gu-4137": {
      "native": "wheat",
      "notes": {
        "n1": "It is a grain used to make flour for bread and roti. It is a common crop in north Gujarat."
      },
      "examples": {
        "ઘઉંનો લોટ ઘરમાં છે.": {
          "native": "There is wheat flour at home.",
          "bases": {
            "ઘઉંનો": "of wheat (masculine)",
            "છે": "is"
          }
        },
        "ખેડૂત ઘઉં વાવે છે.": {
          "native": "The farmer sows wheat.",
          "bases": {
            "ઘઉં": "wheat",
            "વાવે": "sows",
            "છે": "is"
          }
        }
      }
    },
    "gu-4138": {
      "native": "maize; corn",
      "notes": {
        "n1": "It is a tall crop with yellow cobs, eaten boiled, roasted or ground into flour."
      },
      "examples": {
        "સવારે મકાઈના રોટલા ખાધા.": {
          "native": "In the morning we ate maize flatbread.",
          "bases": {
            "મકાઈના": "of maize",
            "રોટલા": "flatbreads",
            "ખાધા": "ate (masculine plural)"
          }
        },
        "ખેતરમાં મકાઈ ઊંચી થઈ.": {
          "native": "The maize in the field grew tall.",
          "bases": {
            "ખેતરમાં": "in the field",
            "મકાઈ": "maize; corn",
            "ઊંચી": "tall (feminine)",
            "થઈ": "became; happened (feminine)"
          }
        }
      }
    },
    "gu-4139": {
      "native": "sugarcane",
      "notes": {
        "n1": "It is a tall grass with sweet stalks, crushed to make sugar and juice."
      },
      "examples": {
        "શેરડીનો રસ ઠંડો છે.": {
          "native": "The sugarcane juice is cold.",
          "bases": {
            "શેરડીનો": "of sugarcane",
            "છે": "is"
          }
        },
        "શેરડી કાપવાનો સમય આવ્યો.": {
          "native": "The time to cut the sugarcane has come.",
          "bases": {
            "શેરડી": "sugarcane",
            "કાપવાનો": "of cutting",
            "આવ્યો": "came (masculine)"
          }
        }
      }
    },
    "gu-4140": {
      "native": "cotton",
      "notes": {
        "n1": "It is a plant whose white fibre is spun into thread and cloth. A field of it is called a cotton field."
      },
      "examples": {
        "આ ખેતરમાં કપાસ ઉગે છે.": {
          "native": "Cotton grows in this field.",
          "bases": {
            "ખેતરમાં": "in the field",
            "કપાસ": "cotton",
            "ઉગે": "grows",
            "છે": "is"
          }
        },
        "કપાસનું બજાર સારું છે.": {
          "native": "The cotton market is good.",
          "bases": {
            "કપાસનું": "of cotton",
            "છે": "is"
          }
        }
      }
    },
    "gu-4141": {
      "native": "irrigation; watering of fields",
      "notes": {
        "n1": "It is bringing water to fields by a well, a canal or a pump. The verb is સિંચવું (siñcavum̐)."
      },
      "examples": {
        "ખેતરમાં સિંચાઈ માટે નવો પંપ લગાવ્યો.": {
          "native": "A new pump was fitted for irrigating the field.",
          "bases": {
            "ખેતરમાં": "in the field",
            "સિંચાઈ": "irrigation; watering of fields",
            "માટે": "for",
            "પંપ": "pump",
            "લગાવ્યો": "fitted (masculine)"
          }
        },
        "સિંચાઈ વગર પાક સુકાઈ જાય છે.": {
          "native": "Without irrigation the crop dries up.",
          "bases": {
            "સિંચાઈ": "irrigation; watering of fields",
            "વગર": "without",
            "સુકાઈ": "dries up (feminine)",
            "જાય": "goes",
            "છે": "is"
          }
        }
      }
    },
    "gu-4142": {
      "native": "plough",
      "notes": {
        "n1": "It is the tool pulled by oxen to turn over the soil before sowing."
      },
      "examples": {
        "બળદ હળ ખેંચે છે.": {
          "native": "The oxen pull the plough.",
          "bases": {
            "હળ": "plough",
            "ખેંચે": "pulls",
            "છે": "is"
          }
        },
        "હળથી માટી ખોદાઈ.": {
          "native": "The soil was turned over with the plough.",
          "bases": {
            "હળથી": "with the plough",
            "ખોદાઈ": "was dug"
          }
        }
      }
    },
    "gu-4143": {
      "native": "tractor",
      "notes": {
        "n1": "A machine with big wheels that pulls the plough and carries loads on a farm."
      },
      "examples": {
        "ખેડૂત ટ્રેક્ટર ચલાવે છે.": {
          "native": "The farmer drives a tractor.",
          "bases": {
            "ટ્રેક્ટર": "tractor",
            "ચલાવે": "drives",
            "છે": "is"
          }
        },
        "ટ્રેક્ટરમાં ડીઝલ ભર્યું.": {
          "native": "We put diesel in the tractor.",
          "bases": {
            "ટ્રેક્ટરમાં": "in the tractor",
            "ડીઝલ": "diesel",
            "ભર્યું": "filled (neuter)"
          }
        }
      }
    },
    "gu-4144": {
      "native": "sickle",
      "notes": {
        "n1": "A curved blade with a handle, used to cut crops by hand at harvest."
      },
      "examples": {
        "દાતરડાથી ઘાસ કાપ્યું.": {
          "native": "The grass was cut with a sickle.",
          "bases": {
            "દાતરડાથી": "with the sickle",
            "કાપ્યું": "cut (neuter)"
