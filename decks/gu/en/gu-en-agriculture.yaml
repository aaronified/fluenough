            "દાતરડું": "sickle",
            "તેજ": "sharp",
            "પડશે": "will have to"
          }
        }
      }
    },
    "gu-4145": {
      "native": "fertiliser; manure",
      "notes": {
        "n1": "It is what is spread on the soil to help crops grow: natural from dung or made in a factory."
      },
      "examples": {
        "ખેતરમાં ખાતર નાખ્યું.": {
          "native": "Manure was put into the field.",
          "bases": {
            "ખેતરમાં": "in the field",
            "ખાતર": "fertiliser; manure",
            "નાખ્યું": "put (neuter)"
          }
        },
        "રાસાયણિક ખાતર મોંઘું છે.": {
          "native": "Chemical fertiliser is expensive.",
          "bases": {
            "રાસાયણિક": "chemical",
            "ખાતર": "fertiliser; manure",
            "છે": "is"
          }
        }
      }
    },
    "gu-4146": {
      "native": "seeds for sowing",
      "notes": {
        "n1": "The seeds kept and bought to sow a crop. The single seed is બીજ (bij)."
      },
      "examples": {
        "સારું બિયારણ લાવ્યા.": {
          "native": "We brought good seeds for sowing.",
          "bases": {
            "બિયારણ": "seeds for sowing",
            "લાવ્યા": "brought (masculine plural)"
          }
        },
        "બિયારણ મોંઘું થયું.": {
          "native": "The seed became expensive.",
          "bases": {
            "બિયારણ": "seeds for sowing",
            "થયું": "happened (neuter)"
          }
        }
      }
    },
    "gu-4147": {
      "native": "produce; yield; output",
      "notes": {
        "n1": "It is the amount of crop or goods made. A high yield is ઉત્પાદન (utpādan) વધવું (vadhavum̐)."
