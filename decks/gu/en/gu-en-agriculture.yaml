        },
        "ખેતરનું ઉત્પાદન ઓછું છે.": {
          "native": "The field gives little yield.",
          "bases": {
            "ખેતરનું": "of the field (neuter)",
            "ઉત્પાદન": "produce; yield; output",
            "છે": "is"
          }
        }
      }
    },
    "gu-4148": {
      "native": "harvest; the gathering of a crop",
      "notes": {
        "n1": "It is the time and the act of cutting and gathering the ripe crop. The verb is લણવું (laṇvum̐)."
