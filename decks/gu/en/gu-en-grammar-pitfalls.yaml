schema: 1
id: "gu-en-grammar-pitfalls"
kind: "layer"
core: "gu-grammar-pitfalls"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Pitfalls"
license: "CC0-1.0"
description: "The mistakes English speakers make most in Gujarati: one word for yesterday and tomorrow, why and how, the doer in the past, the two wes, and the gender of tea. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0483":
    notes:
      "n1": "One word, two days. The tense tells which: કાલે આવ્યો (kāle āvyo), came yesterday; કાલે આવીશ (kāle āviś), will come tomorrow."
  "gu-0612":
    native: "Why are you late?"
    notes:
      "n1": "કેમ (kem) is 'why' here and 'how' in કેમ છો (kem cho)?. And મોડું (moḍum̐), late, is not મોટું (moṭum̐), big: ડ (ḍa) against ટ (ṭa)."
    bases:
      "થયું": "to be; to become; to happen"
  "gu-0613":
    native: "I ate."
    notes:
      "n1": "Not હું ખાધું (hum̐ khādhum̐): in the past, a verb that can take an object wants the doer in -એ (-e), so હું (hum̐) becomes મેં (mem̐). With a verb like જવું (javum̐) it is હું (hum̐): હું ગયો (hum̐ gayo)."
    bases:
      "મેં": "I"
  "gu-0614":
    native: "Let's go."
    notes:
      "n1": "With આપણે (āpṇe) the listener comes too. અમે જઈએ (ame jaie), 'we (not you) go', would leave them behind."
  "gu-0615":
    native: "She came."
    notes:
      "n1": "તે (te) is he or she. In the past only the verb tells: આવી (āvi), she; આવ્યો (āvyo), he."
    bases:
      "તે": "he; she; it; that"
  "gu-0616":
    native: "They are at home."
    notes:
      "n1": "છે (che) is both 'is' and 'are'. Only હું (hum̐) (છું (chum̐)), અમે (ame) (છીએ (chie)) and તમે (tame) (છો (cho)) have forms of their own."
    bases:
      "તેઓ": "they"
      "છે": "to be"
  "gu-0617":
    native: "Who came?"
    notes:
      "n1": "Someone unknown takes the neuter: આવ્યું (āvyum̐), not આવ્યો (āvyo)."
  "gu-0618":
    native: "The tea has gone cold."
    notes:
      "n1": "ચા (cā) is feminine, so ઠંડી (ṭhaṇḍi) and ગઈ (gai). Learn every noun with its gender."
    bases:
      "ઠંડી": "cold"
      "થઈ": "to be; to become; to happen"
  "gu-0619":
    native: "I'll wait for you."
    notes:
      "n1": "Not 'I will see your road': રાહ જોવી (rāh jovi) is one idea, to wait. Such pairs can't be translated word by word."
    bases:
      "હું": "I"
      "તમારી": "your"
      "રાહ": "waiting"
