schema: 1
id: "gu-en-multiword-dative-subject"
kind: "layer"
core: "gu-multiword-dative-subject"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: dative-subject verbs"
license: "CC-BY-SA-4.0"
description: "Three verbs whose experiencer is marked with -ને (ne) and whose thing is the subject: to need or want, to know how to, and to know a fact. Not yet checked by a Gujarati speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "gu-6502":
    native: "to know"
    notes:
      "u1": "Literal parts: ખબર (khabar), news or knowing, and હોવી (hovi), to be. The verb જાણવું (jāṇvum), to know, is a close synonym. The person who knows takes -ને (ne), as in મને (mane) ખબર (khabar) છે (che), I know."
    bases:
      "હોવી": "to be"
    examples:
      "મને ખબર છે.":
        native: "I know."
        bases:
          "છે": "to be"
      "તને ખબર છે?":
        native: "Do you know?"
        bases:
          "છે": "to be"
  "gu-6551":
    native: "to want; to need; should"
    notes:
      "u1": "A defective verb that takes the person with -ને (ne) or મારે (māre): મને (mane) જોઈએ છે (joie che), I want it; મારે (māre) કરવું જોઈએ (karvum̐ joie), I should do it."
    examples:
      "મને જોઈએ છે.":
        native: "I want it."
        bases:
          "જોઈએ": "to want"
          "છે": "to be"
      "મારે કરવું જોઈએ.":
        native: "I should do it."
        bases:
          "જોઈએ": "should"
  "gu-6552":
    native: "to know how to; to be able to do (a skill)"
    notes:
      "u1": "The skill is the subject and the person takes -ને (ne): મને (mane) તરવું (tarvum̐) આવડે છે (āvaḍe che), I know how to swim. The skill can be a verb in its dictionary form, as તરવું (tarvum̐) is in the second example, or a verb in the -તાં (tām) form, as ચલાવતાં (calāvatām̐) is in the first."
    examples:
      "મને ગાડી ચલાવતાં આવડે છે.":
        native: "I know how to drive a car."
        bases:
          "ચલાવતાં": "to drive, in the -તાં (tām) form"
          "આવડે": "to know how to"
          "છે": "to be"
      "મને તરવું આવડે છે.":
        native: "I know how to swim."
        bases:
          "આવડે": "to know how to"
          "છે": "to be"
