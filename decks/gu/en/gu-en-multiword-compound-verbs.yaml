description: "One verb phrase with a light verb added to a main verb: to eat up. Not yet checked by a Gujarati speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "gu-6450":
    native: "to eat up; to eat all of it"
    notes:
      "u1": "Literal parts: ખાઈ (khāi), having eaten, and જવું (javum̐), to go. The second verb adds completeness: the food is finished, and the verb is not about going."
    examples:
      "તે બધું ખાઈ ગયો.":
        native: "He ate everything up."
      "જલદી ખાઈ જા.":
        native: "Eat it up quickly."
