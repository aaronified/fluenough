schema: 1
id: "gu-en-groceries"
kind: "layer"
core: "gu-groceries"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Groceries"
license: "CC0-1.0"
description: "The staples of a Gujarati kitchen: grains, dal, vegetables, fruit, milk and the rest. Not yet checked by a Gujarati speaker: please report any mistake."
cards:
  "gu-0390":
    native: "vegetables"
    notes:
      "n1": "A cooked vegetable dish is શાક (śāk)."
  "gu-0226":
    notes:
      "n1": "Gujarati dal is often a little sweet and sour, with jaggery and kokum or lemon."
  "gu-0391":
    native: "rice (uncooked)"
    notes:
      "n1": "Plural. Cooked rice is ભાત (bhāt)."
  "gu-0392":
    native: "flour"
    notes:
      "n1": "ઘઉંનો લોટ (ghaunno loṭ), wheat flour; ચણાનો લોટ (caṇāno loṭ), gram flour."
  "gu-0393":
    native: "milk"
  "gu-0394":
    native: "yogurt; curd"
    notes:
      "n1": "Buttermilk, drunk with almost every meal, is છાશ (chāś)."
  "gu-0395":
    native: "ghee; clarified butter"
  "gu-0396":
    native: "oil"
  "gu-0397":
    native: "sugar"
    notes:
      "n1": "Jaggery is ગોળ (goḷ), a word that also means 'round'."
  "gu-0398":
    native: "salt"
    notes:
      "n1": "The same word is the adjective 'sweet; lovely': મીઠું ગીત (miṭhum̐ git), a lovely song. For sweet food Gujarati usually says ગળ્યું (gaḷyum̐)."
  "gu-0399":
    native: "onion"
  "gu-0400":
    native: "potatoes"
    notes:
      "n1": "Also બટેટા (baṭeṭā). Both come from Portuguese batata. One potato is બટાકું (baṭākum̐) or બટેટું (baṭeṭum̐)."
  "gu-0401":
    native: "tomatoes"
    notes:
      "n1": "One tomato is ટામેટું (ṭāmeṭum̐)."
  "gu-0402":
    native: "banana"
    notes:
      "n1": "Plural કેળાં (keḷām̐). Bananas are sold by the dozen, ડઝન (ḍajhan)."
  "gu-0403":
    native: "mango"
    notes:
      "n1": "Summer in Gujarat means mangoes, above all the Kesar from around Junagadh. Mango pulp, eaten with puris, is કેરીનો રસ (kerino ras)."
  "gu-0404":
    native: "eggs"
    notes:
      "n1": "One egg is ઈંડું (iṇḍum̐). Many Gujarati homes never cook them."
