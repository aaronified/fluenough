schema: 1
id: "gu-grammar-demonstratives"
part: "core"
kind: "grammar"
language: { code: "gu", iso639_3: "guj", name: "Gujarati", script: "gujarati", tts: "gu-IN", icon: "ગુ" }
license: "CC0-1.0"
tags: ["beginner", "grammar", "unreviewed"]
pattern:
  slots: ["near: આ (ā), અ- (a-)", "far: એ (e), ત- (ta-)"]
  entries:
    - lemma: "this, that (before a noun)"
      key: "adj"
      forms:
        "near: આ (ā), અ- (a-)": "આ"
        "far: એ (e), ત- (ta-)": ["એ", "તે"]
      readings:
        "near: આ (ā), અ- (a-)": "ā"
        "far: એ (e), ત- (ta-)": ["e", "te"]
      ipas:
        "near: આ (ā), અ- (a-)": "a"
        "far: એ (e), ત- (ta-)": "e"
    - lemma: "here, there"
      key: "place"
      forms:
        "near: આ (ā), અ- (a-)": "અહીં"
        "far: એ (e), ત- (ta-)": "ત્યાં"
      readings:
        "near: આ (ā), અ- (a-)": "ahim̐"
        "far: એ (e), ત- (ta-)": "tyām̐"
      ipas:
        "near: આ (ā), અ- (a-)": "əɦĩ"
        "far: એ (e), ત- (ta-)": "t̪jã"
    - lemma: "from here, from there"
      key: "from-place"
      forms:
        "near: આ (ā), અ- (a-)": "અહીંથી"
        "far: એ (e), ત- (ta-)": "ત્યાંથી"
      readings:
        "near: આ (ā), અ- (a-)": "ahinthi"
        "far: એ (e), ત- (ta-)": "tyānthi"
      ipas:
        "near: આ (ā), અ- (a-)": "əɦint̪ʰi"
        "far: એ (e), ત- (ta-)": "t̪jant̪ʰi"
    - lemma: "now, then"
      key: "time"
      forms:
        "near: આ (ā), અ- (a-)": "અત્યારે"
        "far: એ (e), ત- (ta-)": "ત્યારે"
      readings:
        "near: આ (ā), અ- (a-)": "atyāre"
        "far: એ (e), ત- (ta-)": "tyāre"
      ipas:
        "near: આ (ā), અ- (a-)": "ət̪jare"
        "far: એ (e), ત- (ta-)": "t̪jare"
    - lemma: "this much, that much"
      key: "amount"
      forms:
        "near: આ (ā), અ- (a-)": "આટલું"
        "far: એ (e), ત- (ta-)": ["એટલું", "તેટલું"]
      readings:
        "near: આ (ā), અ- (a-)": "āṭlum̐"
        "far: એ (e), ત- (ta-)": ["eṭlum̐", "teṭlum̐"]
      ipas:
        "near: આ (ā), અ- (a-)": "aʈlũ"
        "far: એ (e), ત- (ta-)": "eʈlũ"
    - lemma: "like this, like that"
      key: "kind"
      forms:
        "near: આ (ā), અ- (a-)": "આવું"
        "far: એ (e), ત- (ta-)": ["એવું", "તેવું"]
      readings:
        "near: આ (ā), અ- (a-)": "āvum̐"
        "far: એ (e), ત- (ta-)": ["evum̐", "tevum̐"]
      ipas:
        "near: આ (ā), અ- (a-)": "aʋũ"
        "far: એ (e), ત- (ta-)": "eʋũ"
    - lemma: "this way, that way"
      key: "manner"
      forms:
        "near: આ (ā), અ- (a-)": "આમ"
        "far: એ (e), ત- (ta-)": ["એમ", "તેમ"]
      readings:
        "near: આ (ā), અ- (a-)": "ām"
        "far: એ (e), ત- (ta-)": ["em", "tem"]
      ipas:
        "near: આ (ā), અ- (a-)": "am"
        "far: એ (e), ત- (ta-)": "em"
    - lemma: "to this one, to that one"
      key: "to-one"
      forms:
        "near: આ (ā), અ- (a-)": "આને"
        "far: એ (e), ત- (ta-)": ["એને", "તેને"]
      readings:
        "near: આ (ā), અ- (a-)": "āne"
        "far: એ (e), ત- (ta-)": ["ene", "tene"]
      ipas:
        "near: આ (ā), અ- (a-)": "ane"
        "far: એ (e), ત- (ta-)": "ene"
    - lemma: "of this one, of that one"
      key: "of-one"
      forms:
        "near: આ (ā), અ- (a-)": "આનું"
        "far: એ (e), ત- (ta-)": ["એનું", "તેનું"]
      readings:
        "near: આ (ā), અ- (a-)": "ānum̐"
        "far: એ (e), ત- (ta-)": ["enum̐", "tenum̐"]
      ipas:
        "near: આ (ā), અ- (a-)": "anũ"
        "far: એ (e), ત- (ta-)": "enũ"
    - lemma: "in this, in that"
      key: "in-one"
      forms:
        "near: આ (ā), અ- (a-)": "આમાં"
        "far: એ (e), ત- (ta-)": ["એમાં", "તેમાં"]
      readings:
        "near: આ (ā), અ- (a-)": "āmām̐"
        "far: એ (e), ત- (ta-)": ["emām̐", "temām̐"]
      ipas:
        "near: આ (ā), અ- (a-)": "amã"
        "far: એ (e), ત- (ta-)": "emã"
