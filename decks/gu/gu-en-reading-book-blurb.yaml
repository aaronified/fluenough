          "text": "આ નવલકથા એક ગામની વાર્તા છે.",
          "reading": "ā navlkthā ek gāmni vārtā che.",
          "ipa": "a nəʋlkt̪ʰa ek ɡamni ʋart̪a tʃʰe"
