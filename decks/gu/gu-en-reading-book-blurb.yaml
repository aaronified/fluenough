          "text": "મુખ્ય પાત્ર એક યુવાન છોકરી છે.",
          "reading": "mukhya pātra ek yuvān chokri che.",
          "ipa": "mukʰjə pat̪rə ek juʋan tʃʰokri tʃʰe"
        },
        {
          "text": "એક રહસ્ય તેની જિંદગી બદલી નાખે છે.",
          "reading": "ek rahasya teni jindagi badli nākhe che.",
          "ipa": "ek rəɦəsjə t̪eni dʒind̪əɡi bəd̪li nakʰe tʃʰe"
        },
        {
          "text": "આ કરુણ પણ સુંદર વાર્તા તમને રડાવશે.",
          "reading": "ā karuṇ paṇ sundar vārtā tamne raḍāvśe.",
          "ipa": "a kəruɳ pəɳ sund̪ər ʋart̪a t̪əmne rəɖaʋʃe"
