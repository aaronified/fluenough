schema: 1
id: gu-en-grammar-compound-verbs
name: "Compound verbs"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "A verb's stem with -ઈ, then જવું, લેવું, દેવું or નાખવું: the second verb adds 'completely', 'for myself' or 'for you', as English adds up or away. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: gu-0553
    target: "ખાઈ લો."
    native: "Go ahead and eat."
    reading: "khāi lo."
    ipa: "kʰai lo"
    pos: "phrase"
    notes: "The stem with -ઈ, then લેવું (to take): done for yourself, and done fully. A host's friendly push."
  - id: gu-0554
    target: "બેસી જાઓ."
    native: "Do sit down."
    reading: "besi jāo."
    ipa: "besi dʒao"
    pos: "phrase"
    notes: "-ઈ with જવું (to go) marks a change, done: you are now seated."
  - id: gu-0555
    target: "હું ભૂલી ગયો."
    native: "I forgot. (a man)"
    reading: "hum̐ bhuli gayo."
    ipa: "ɦũ bʱuli ɡəjo"
    pos: "phrase"
    notes: "A woman says ભૂલી ગઈ. With જવું the past agrees with the doer."
  - id: gu-0556
    target: "તે પડી ગયો."
    native: "He fell down."
    reading: "te paḍi gayo."
    ipa: "t̪e pəɖi ɡəjo"
    pos: "phrase"
  - id: gu-0557
    target: "કામ થઈ ગયું."
    native: "The work is done."
    reading: "kām thai gayum̐."
    ipa: "kam t̪ʰəi ɡəjũ"
    pos: "phrase"
    notes: "થઈ ગયું (thai gayum̐), 'it has become', is everywhere: done, finished, it happened."
  - id: gu-0558
    target: "સૂઈ જાઓ."
    native: "Go to sleep."
    reading: "sui jāo."
    ipa: "sui dʒao"
    pos: "phrase"
  - id: gu-0559
    target: "કહી દો."
    native: "Just tell (them)."
    reading: "kahi do."
    ipa: "kəɦi d̪o"
    pos: "phrase"
    notes: "-ઈ with દેવું (to give): done for someone else, or at once."
  - id: gu-0560
    target: "મૂકી દો."
    native: "Put it down; leave it."
    reading: "muki do."
    ipa: "muki d̪o"
    pos: "phrase"
  - id: gu-0561
    target: "ફેંકી દો."
    native: "Throw it away."
    reading: "pheṅki do."
    ipa: "pʰeŋki d̪o"
    pos: "phrase"
  - id: gu-0562
    target: "લખી નાખો."
    native: "Write it down."
    reading: "lakhi nākho."
    ipa: "ləkʰi nakʰo"
    pos: "phrase"
    notes: "-ઈ with નાખવું (to throw in): done quickly or thoroughly. Gujarati uses it far more than Hindi does."
  - id: gu-0563
    target: "તે જતો રહ્યો."
    native: "He went away."
    reading: "te jato rahyo."
    ipa: "t̪e dʒət̪o rəɦjo"
    pos: "phrase"
    notes: "જતું રહેવું (jatum̐ rahevum̐), 'to stay going', is to leave for good. A woman: જતી રહી."
