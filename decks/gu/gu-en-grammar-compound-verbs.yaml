schema: 1
id: gu-en-grammar-compound-verbs
name: "Compound verbs"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "A verb's stem with -ઈ, then જવું, લેવું, દેવું or નાખવું: the second verb adds 'completely', 'for myself' or 'for you', as English adds up or away. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: gu-0553
    target: "ખાઈ લો."
    native: "Go ahead and eat."
    reading: "khai lo."
    pos: "phrase"
    notes: "The stem with -ઈ, then લેવું (to take): done for yourself, and done fully. A host's friendly push."
  - id: gu-0554
    target: "બેસી જાઓ."
    native: "Do sit down."
    reading: "besi jao."
    pos: "phrase"
    notes: "-ઈ with જવું (to go) marks a change, done: you are now seated."
  - id: gu-0555
    target: "હું ભૂલી ગયો."
    native: "I forgot. (a man)"
    reading: "hun bhuli gayo."
    pos: "phrase"
    notes: "A woman says ભૂલી ગઈ. With જવું the past agrees with the doer."
  - id: gu-0556
    target: "તે પડી ગયો."
    native: "He fell down."
    reading: "te padi gayo."
    pos: "phrase"
  - id: gu-0557
    target: "કામ થઈ ગયું."
    native: "The work is done."
    reading: "kam thai gayun."
    pos: "phrase"
    notes: "થઈ ગયું (thai gayun), 'it has become', is everywhere: done, finished, it happened."
  - id: gu-0558
    target: "સૂઈ જાઓ."
    native: "Go to sleep."
    reading: "sui jao."
    pos: "phrase"
  - id: gu-0559
    target: "કહી દો."
    native: "Just tell (them)."
    reading: "kahi do."
    pos: "phrase"
    notes: "-ઈ with દેવું (to give): done for someone else, or at once."
  - id: gu-0560
    target: "મૂકી દો."
    native: "Put it down; leave it."
    reading: "muki do."
    pos: "phrase"
  - id: gu-0561
    target: "ફેંકી દો."
    native: "Throw it away."
    reading: "phenki do."
    pos: "phrase"
  - id: gu-0562
    target: "લખી નાખો."
    native: "Write it down."
    reading: "lakhi nakho."
    pos: "phrase"
    notes: "-ઈ with નાખવું (to throw in): done quickly or thoroughly. Gujarati uses it far more than Hindi does."
  - id: gu-0563
    target: "તે જતો રહ્યો."
    native: "He went away."
    reading: "te jato rahyo."
    pos: "phrase"
    notes: "જતું રહેવું (jatun rahevun), 'to stay going', is to leave for good. A woman: જતી રહી."
