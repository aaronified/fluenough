  "title": "A note on the fridge"
  "theme": "everyday-verbs"
  "sentences":
  - "text": "ફ્રિજ પર એક ચિઠ્ઠી છે."
    "reading": "phrij par ek ciṭṭhi che."
    "ipa": "pʰridʒ pər ek tʃiʈʈʰi tʃʰe"
  - "text": "ચિઠ્ઠીમાં લખ્યું છે, “પાણી ફ્રિજમાં છે.”"
    "reading": "ciṭṭhimām lakhyum che, pāṇi phrijmām che."
    "ipa": "tʃiʈʈʰimam ləkʰjum tʃʰe paɳi pʰridʒmam tʃʰe"
  - "text": "ચા રસોડામાં છે."
    "reading": "cā rasoḍāmām che."
    "ipa": "tʃa rəsoɖamam tʃʰe"
  - "text": "દાદી ચિઠ્ઠી વાંચે છે."
    "reading": "dādi ciṭṭhi vāñce che."
    "ipa": "d̪ad̪i tʃiʈʈʰi ʋaɲtʃe tʃʰe"
