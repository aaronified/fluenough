schema: 1
id: gu-en-slang
name: "Slang"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Everyday slang: what friends say that a textbook doesn't. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [slang, unreviewed]
cards:
  - ref: gu-0262
    notes: "Between friends, a greeting all on its own: મજામાં (majāmām̐)? all good? The answer: એકદમ મજામાં! (ekdam majaman), totally!"
  - id: gu-0634
    target: "શું ચાલે છે?"
    native: "What's up?"
    reading: "śum̐ cāle che?"
    ipa: "ʃũ tʃale tʃʰe"
    pos: "phrase"
    notes: "Literally 'what is going on?'."
  - id: gu-0635
    target: "જલસો"
    native: "great fun; a good time"
    reading: "jalso"
    ipa: "dʒəlso"
    pos: "noun"
    gender: "m"
    notes: "જલસા કર! (jalsa kar!), enjoy yourself!"
  - id: gu-0636
    target: "ભાઈ ભાઈ!"
    native: "Wow! Brilliant!"
    reading: "bhāi bhāi!"
    ipa: "bʱai bʱai"
    pos: "phrase"
    notes: "Literally 'brother, brother!': praise for something done well, said to anyone."
  - id: gu-0637
    target: "મસ્ત"
    native: "great; cool"
    reading: "mast"
    ipa: "məst̪"
    pos: "adj"
    notes: "It never changes: મસ્ત ફિલ્મ (mast philm), a great film; મસ્ત ચા (mast cā), great tea."
  - id: gu-0638
    target: "ચાલશે"
    native: "it'll do; no problem"
    reading: "cālśe"
    ipa: "tʃalʃe"
    pos: "other"
    notes: "Literally 'it will walk'. The easy-going answer to almost anything."
  - id: gu-0639
    target: "લોચો"
    native: "a mess; a mix-up"
    reading: "loco"
    ipa: "lotʃo"
    pos: "noun"
    gender: "m"
    notes: "લોચો પડી ગયો (loco paḍi gayo), something's gone wrong. In Surat it is also a soft, buttery snack."
  - id: gu-0640
    target: "બકા"
    native: "buddy; dear"
    reading: "bakā"
    ipa: "bəka"
    pos: "noun"
    notes: "Between friends, in Ahmedabad especially: હા બકા (hā bakā), yes, buddy."
  - id: gu-0641
    target: "હેંડો"
    native: "come on; let's go"
    reading: "heṇḍo"
    ipa: "ɦeɳɖo"
    pos: "other"
    notes: "Village and Ahmedabad speech for ચાલો (cālo)."
  - id: gu-0642
    target: "જમાવટ"
    native: "a great atmosphere; a hit"
    reading: "jamāvaṭ"
    ipa: "dʒəmaʋəʈ"
    pos: "noun"
    gender: "f"
    notes: "જમાવટ થઈ ગઈ! (jamavat thai gai!), it was a blast!"
  - id: gu-0643
    target: "વટ"
    native: "swagger; pride"
    reading: "vaṭ"
    ipa: "ʋəʈ"
    pos: "noun"
    gender: "m"
    notes: "વટ પાડવો (vaṭ pāḍvo), to show off; to cut a fine figure."
  - id: gu-0644
    target: "ગપ્પાં મારવાં"
    native: "to chat idly; to tell tall tales"
    reading: "gappām̐ mārvām̐"
    ipa: "ɡəppã marʋã"
    pos: "phrase"
    notes: "ગપ્પાં (gappām̐) is neuter plural, so the verb is મારવાં (mārvām̐)."
  - id: gu-0645
    target: "પંચાત"
    native: "gossip; poking into other people's business"
    reading: "pañcāt"
    ipa: "pəɲtʃat̪"
    pos: "noun"
    gender: "f"
    notes: "પંચાત ના કર (pañcāt nā kar), mind your own business."
  - id: gu-0646
    target: "ગાંડો"
    native: "crazy; mad"
    reading: "gāṇḍo"
    ipa: "ɡaɳɖo"
    pos: "adj"
    notes: "It agrees: ગાંડી (gāṇḍi), ગાંડું (gāṇḍum̐). ગાંડા જેવી વાત (gāṇḍā jevi vāt), crazy talk."
  - id: gu-0647
    target: "ટેન્શન નહીં લેવાનું"
    native: "don't stress"
    reading: "ṭenśan nahim̐ levānum̐"
    ipa: "ʈenʃən nəɦĩ leʋanũ"
    pos: "phrase"
    notes: "Literally 'not to take tension'. -વાનું (-vānum̐) with નહીં (nahim̐) makes a casual rule."
