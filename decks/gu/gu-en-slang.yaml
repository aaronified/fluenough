schema: 1
id: gu-en-slang
name: "Slang"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Everyday slang: what friends say that a textbook doesn't. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [slang, unreviewed]
cards:
  - ref: gu-0262
    notes: "Between friends, a greeting all on its own: મજામાં? all good? The answer: એકદમ મજામાં! (ekdam majaamaan), totally!"
  - id: gu-0634
    target: "શું ચાલે છે?"
    native: "What's up?"
    reading: "shun chaale chhe?"
    pos: "phrase"
    notes: "Literally 'what is going on?'."
  - id: gu-0635
    target: "જલસો"
    native: "great fun; a good time"
    reading: "jalso"
    pos: "noun"
    gender: "m"
    notes: "જલસા કર! (jalsaa kar!), enjoy yourself!"
  - id: gu-0636
    target: "ભાઈ ભાઈ!"
    native: "Wow! Brilliant!"
    reading: "bhaaii bhaaii!"
    pos: "phrase"
    notes: "Literally 'brother, brother!': praise for something done well, said to anyone."
  - id: gu-0637
    target: "મસ્ત"
    native: "great; cool"
    reading: "mast"
    pos: "adj"
    notes: "It never changes: મસ્ત ફિલ્મ, a great film; મસ્ત ચા, great tea."
  - id: gu-0638
    target: "ચાલશે"
    native: "it'll do; no problem"
    reading: "chaalshe"
    pos: "other"
    notes: "Literally 'it will walk'. The easy-going answer to almost anything."
  - id: gu-0639
    target: "લોચો"
    native: "a mess; a mix-up"
    reading: "locho"
    pos: "noun"
    gender: "m"
    notes: "લોચો પડી ગયો (locho padii gayo), something's gone wrong. In Surat it is also a soft, buttery snack."
  - id: gu-0640
    target: "બકા"
    native: "buddy; dear"
    reading: "bakaa"
    pos: "noun"
    notes: "Between friends, in Ahmedabad especially: હા બકા, yes, buddy."
  - id: gu-0641
    target: "હેંડો"
    native: "come on; let's go"
    reading: "hendo"
    pos: "other"
    notes: "Village and Ahmedabad speech for ચાલો (chaalo)."
  - id: gu-0642
    target: "જમાવટ"
    native: "a great atmosphere; a hit"
    reading: "jamaavat"
    pos: "noun"
    gender: "f"
    notes: "જમાવટ થઈ ગઈ! (jamaavat thaii gaii!), it was a blast!"
  - id: gu-0643
    target: "વટ"
    native: "swagger; pride"
    reading: "vat"
    pos: "noun"
    gender: "m"
    notes: "વટ પાડવો (vat paadvo), to show off; to cut a fine figure."
  - id: gu-0644
    target: "ગપ્પાં મારવાં"
    native: "to chat idly; to tell tall tales"
    reading: "gappaan maarvaan"
    pos: "phrase"
    notes: "ગપ્પાં is neuter plural, so the verb is મારવાં."
  - id: gu-0645
    target: "પંચાત"
    native: "gossip; poking into other people's business"
    reading: "panchaat"
    pos: "noun"
    gender: "f"
    notes: "પંચાત ના કર (panchaat naa kar), mind your own business."
  - id: gu-0646
    target: "ગાંડો"
    native: "crazy; mad"
    reading: "gaando"
    pos: "adj"
    notes: "It agrees: ગાંડી, ગાંડું. ગાંડા જેવી વાત (gaandaa jevii vaat), crazy talk."
  - id: gu-0647
    target: "ટેન્શન નહીં લેવાનું"
    native: "don't stress"
    reading: "tenshan nahiin levaanun"
    pos: "phrase"
    notes: "Literally 'not to take tension'. -વાનું with નહીં makes a casual rule."
