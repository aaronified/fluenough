  "title": "At the zoo"
  "theme": "animals"
  "sentences":
  - "text": "આ પ્રાણીસંગ્રહાલયમાં સિંહ, વાઘ અને હાથી છે."
    "reading": "ā prāṇisaṅgrahālymām̐ siṁh, vāgh ane hāthi che."
    "ipa": "a praɳisəŋɡrəɦaljmã sĩɦ ʋaɡʱ əne ɦat̪ʰi tʃʰe"
  - "text": "હાથી ઘાસ અને ફળ ખાય છે."
    "reading": "hāthi ghās ane phaḷ khāy che."
    "ipa": "ɦat̪ʰi ɡʱas əne pʰəɭ kʰaj tʃʰe"
  - "text": "વાઘ માંસ ખાય છે, અને સિંહ પણ માંસ ખાય છે."
    "reading": "vāgh māṁs khāy che, ane siṁh paṇ māṁs khāy che."
    "ipa": "ʋaɡʱ mãs kʰaj tʃʰe əne sĩɦ pəɳ mãs kʰaj tʃʰe"
  - "text": "સસલાં અને હરણ ઘાસ ખાય છે."
    "reading": "saslām̐ ane haraṇ ghās khāy che."
    "ipa": "səslã əne ɦərəɳ ɡʱas kʰaj tʃʰe"
