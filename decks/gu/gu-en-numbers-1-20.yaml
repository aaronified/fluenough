schema: 1
id: gu-en-numbers-1-20
name: "Numbers 1–20"
kind: vocab
theme: numbers-1-20
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Zero to twenty. In Gujarati every number up to a hundred has its own word, so these are the ones to learn first. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: gu-0108
    target: "શૂન્ય"
    native: "0, zero"
    reading: "shunya"
    pos: "other"
    notes: "The Gujarati digit is ૦. Many people simply say 'zero'."
  - id: gu-0109
    target: "એક"
    native: "1, one"
    reading: "ek"
    pos: "other"
    notes: "Also does the work of 'a': એક છોકરો (ek chhokro), a boy. The digit is ૧."
  - id: gu-0110
    target: "બે"
    native: "2, two"
    reading: "be"
    pos: "other"
    notes: "The digit is ૨."
  - id: gu-0111
    target: "ત્રણ"
    native: "3, three"
    reading: "tran"
    pos: "other"
    notes: "With the join ત્ર and the curled-back ણ. The digit is ૩."
  - id: gu-0112
    target: "ચાર"
    native: "4, four"
    reading: "char"
    pos: "other"
    notes: "The digit is ૪."
  - id: gu-0113
    target: "પાંચ"
    native: "5, five"
    reading: "panch"
    pos: "other"
    notes: "The long a is nasal: the dot ં. The digit is ૫."
  - id: gu-0114
    target: "છ"
    native: "6, six"
    reading: "chha"
    pos: "other"
    notes: "One letter, said with its a: chha. The digit is ૬."
  - id: gu-0115
    target: "સાત"
    native: "7, seven"
    reading: "sat"
    pos: "other"
    notes: "The digit is ૭."
  - id: gu-0116
    target: "આઠ"
    native: "8, eight"
    reading: "ath"
    pos: "other"
    notes: "With the curled-back, breathy ઠ. The digit is ૮."
  - id: gu-0117
    target: "નવ"
    native: "9, nine"
    reading: "nav"
    pos: "other"
    notes: "નવરાત્રિ (navratri), the festival of dance, is 'nine nights'. The digit is ૯."
  - id: gu-0118
    target: "દસ"
    native: "10, ten"
    reading: "das"
    alt_target: ["દશ"]
    pos: "other"
    notes: "Also spelled દશ. The digits are ૧૦."
  - id: gu-0119
    target: "અગિયાર"
    native: "11, eleven"
    reading: "agiyar"
    pos: "other"
  - id: gu-0120
    target: "બાર"
    native: "12, twelve"
    reading: "bar"
    pos: "other"
    notes: "Without a breath on the b. With one, ભાર (bhar) is a load."
  - id: gu-0121
    target: "તેર"
    native: "13, thirteen"
    reading: "ter"
    pos: "other"
  - id: gu-0122
    target: "ચૌદ"
    native: "14, fourteen"
    reading: "chaud"
    pos: "other"
  - id: gu-0123
    target: "પંદર"
    native: "15, fifteen"
    reading: "pandar"
    pos: "other"
  - id: gu-0124
    target: "સોળ"
    native: "16, sixteen"
    reading: "sol"
    pos: "other"
    notes: "With the curled-back ળ."
  - id: gu-0125
    target: "સત્તર"
    native: "17, seventeen"
    reading: "sattar"
    pos: "other"
  - id: gu-0126
    target: "અઢાર"
    native: "18, eighteen"
    reading: "adhar"
    pos: "other"
  - id: gu-0127
    target: "ઓગણીસ"
    native: "19, nineteen"
    reading: "oganis"
    pos: "other"
    notes: "ઓગણ- means 'one less than': ઓગણીસ is one less than વીસ, twenty. The same start is in 29, 39, 49 and 59."
  - id: gu-0128
    target: "વીસ"
    native: "20, twenty"
    reading: "vis"
    pos: "other"
