        "હું (f)": "છું"
        "તું (m)": "છે"
        "તું (f)": "છે"
        "તે (m)": "છે"
        "તે (f)": "છે"
        "તે (it)": "છે"
        "અમે": "છીએ"
        "તમે": "છો"
        "તેઓ": "છે"
