schema: 1
id: gu-en-market
name: "Market"
kind: vocab
theme: market
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Prices, rupees, too dear, a little less: what you need to buy and to bargain at a market stall. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: gu-0372
    target: "બજાર"
    native: "market"
    reading: "bajar"
    pos: "noun"
    notes: "શાકમાર્કેટ (shakmarket) is the vegetable market."
  - id: gu-0373
    target: "આ કેટલાનું છે?"
    native: "How much is this?"
    reading: "a ketlanun chhe?"
    pos: "phrase"
    notes: "Literally 'this is of how much?'. Of something feminine, such as કેરી (mango): કેટલાની છે?"
  - id: gu-0374
    target: "કેટલા રૂપિયા?"
    native: "How many rupees?"
    reading: "ketla rupiya?"
    pos: "phrase"
  - id: gu-0375
    target: "રૂપિયો"
    native: "rupee"
    reading: "rupiyo"
    pos: "noun"
    gender: "m"
    notes: "The plural is રૂપિયા (rupiya): સો રૂપિયા, a hundred rupees."
  - id: gu-0376
    target: "પૈસા"
    native: "money; paise"
    reading: "paisa"
    pos: "noun"
    gender: "m"
    notes: "Plural, like English 'funds': પૈસા નથી, there's no money."
  - id: gu-0377
    target: "મોંઘું"
    native: "expensive"
    reading: "monghun"
    pos: "adj"
    notes: "It agrees: મોંઘો (m), મોંઘી (f), મોંઘું (n)."
  - id: gu-0378
    target: "સસ્તું"
    native: "cheap"
    reading: "sastun"
    pos: "adj"
    notes: "It agrees: સસ્તો, સસ્તી, સસ્તું."
  - id: gu-0379
    target: "બહુ મોંઘું છે."
    native: "It's too expensive."
    reading: "bahu monghun chhe."
    pos: "phrase"
    notes: "બહુ (bahu) is 'very; too much'. Bargaining is expected at a stall, not in a shop with fixed prices."
  - id: gu-0380
    target: "થોડું ઓછું કરો."
    native: "Bring the price down a little."
    reading: "thodun ochhun karo."
    pos: "phrase"
    notes: "Literally 'make it a little less'."
  - id: gu-0381
    target: "છૂટા પૈસા"
    native: "change; small money"
    reading: "chhuta paisa"
    pos: "phrase"
    notes: "છૂટા છે? (chhuta chhe?), do you have change?"
  - id: gu-0382
    target: "થેલી"
    native: "bag"
    reading: "theli"
    pos: "noun"
    gender: "f"
  - id: gu-0383
    target: "બે કિલો આપો."
    native: "Give me two kilos."
    reading: "be kilo apo."
    pos: "phrase"
    notes: "આપો (apo) is the polite 'give'. આપજો (apjo) is softer still."
  - id: gu-0384
    target: "બીજું કંઈ?"
    native: "Anything else?"
    reading: "bijun kain?"
    pos: "phrase"
    notes: "The seller's question. બસ (bas), 'that's all'."
