      "sentences": [
        {
          "text": "ભાડું દર મહિનાના પહેલા દિવસે આપવું.",
          "reading": "bhāḍum̐ dar mahinānā pahelā divse āpvum̐.",
          "ipa": "bʱaɖũ d̪ər məɦinana pəɦela d̪iʋse apʋũ"
        },
        {
          "text": "ત્રણ મહિનાનું ભાડું આગળથી આપવું પડશે.",
          "reading": "traṇ mahinānum̐ bhāḍum̐ āgḷthi āpvum̐ paḍśe.",
          "ipa": "t̪rəɳ məɦinanũ bʱaɖũ aɡɭt̪ʰi apʋũ pəɖʃe"
        },
        {
          "text": "ઘરમાં ધૂમ્રપાન કરવાની મનાઈ છે.",
          "reading": "gharmām̐ dhumrapān karvāni manāi che.",
          "ipa": "ɡʱərmã d̪ʱumrəpan kərʋani mənai tʃʰe"
        },
        {
          "text": "મરામત માલિક કરાવશે.",
          "reading": "marāmat mālik karāvśe.",
          "ipa": "məramət̪ malik kəraʋʃe"
        }
