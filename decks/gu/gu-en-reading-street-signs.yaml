  "sentences":
  - "text": "આ રસ્તા પર દવાખાનું છે."
    "reading": "ā rastā par davākhānum̐ che."
    "ipa": "a rəst̪a pər d̪əʋakʰanũ tʃʰe"
  - "text": "દવાખાનાની સામે શાળા છે."
    "reading": "davākhānāni sāme śāḷā che."
    "ipa": "d̪əʋakʰanani same ʃaɭa tʃʰe"
  - "text": "શાળાની પાછળ મેદાન અને બગીચો છે."
    "reading": "śāḷāni pāchaḷ medān ane bagico che."
    "ipa": "ʃaɭani patʃʰəɭ med̪an əne bəɡitʃo tʃʰe"
  - "text": "બજારની બાજુમાં બૅંક છે, પણ મંદિર દૂર છે."
    "reading": "bajārni bājumām̐ bêṅk che, paṇ mandir dur che."
    "ipa": "bədʒarni badʒumã bɛŋk tʃʰe pəɳ mənd̪ir d̪ur tʃʰe"
