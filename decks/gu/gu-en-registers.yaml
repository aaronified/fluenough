schema: 1
id: gu-en-registers
name: "Formal Gujarati and everyday Gujarati"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Gujarati on signs, in letters, speeches and the news is more formal than the Gujarati of the street, and full of words from Sanskrit. Here they are beside their everyday words. Recognition only. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [reading, unreviewed]
cards:
  - ref: gu-0316
    notes: "The most formal 'you', in speeches, letters and signs. In speech, તમે (tame)."
    modes: [recognition]
  - id: gu-0620
    target: "ધન્યવાદ"
    native: "thank you (formal); in speech આભાર (ābhār)"
    reading: "dhanyavād"
    ipa: "d̪ʱənjəʋad̪"
    pos: "other"
    modes: [recognition]
    notes: "In speeches and writing. Between friends, 'thank you' in English, or nothing at all."
  - id: gu-0621
    target: "પધારો"
    native: "welcome; please come (with great respect)"
    reading: "padhāro"
    ipa: "pəd̪ʱaro"
    pos: "other"
    modes: [recognition]
    notes: "To an honoured guest, and on invitations. In everyday speech, આવો (āvo)."
  - id: gu-0622
    target: "આપનું સ્વાગત છે"
    native: "you are welcome (on signs)"
    reading: "āpnum̐ svāgat che"
    ipa: "apnũ sʋaɡət̪ tʃʰe"
    pos: "phrase"
    modes: [recognition]
    notes: "Over the door of a shop, a town or a hall."
  - id: gu-0623
    target: "કૃપા કરીને"
    native: "please (formal, on notices)"
    reading: "krupā karine"
    ipa: "krupa kərine"
    pos: "phrase"
    modes: [recognition]
    notes: "In speech the polite verb ending does the work: બેસજો (besjo), please sit. Also મહેરબાની કરીને (maherbāni karine), from Persian."
  - id: gu-0624
    target: "વિનંતી"
    native: "a request (formal)"
    reading: "vinanti"
    ipa: "ʋinənt̪i"
    pos: "noun"
    gender: "f"
    modes: [recognition]
    notes: "In letters and notices: આપને વિનંતી છે કે (āpne vinanti che ke)..., you are requested to..."
  - id: gu-0625
    target: "ભોજન"
    native: "a meal (formal); in speech જમવાનું (jamvānum̐)"
    reading: "bhojan"
    ipa: "bʱodʒən"
    pos: "noun"
    gender: "n"
    modes: [recognition]
    notes: "On menus and invitations: ભોજનાલય (bhojanālay) is a restaurant serving meals."
  - id: gu-0626
    target: "જળ"
    native: "water (literary); in speech પાણી (pāṇi)"
    reading: "jaḷ"
    ipa: "dʒəɭ"
    pos: "noun"
    gender: "n"
    modes: [recognition]
    notes: "In poetry, prayers and official names."
  - id: gu-0627
    target: "માતા"
    native: "mother (formal); in speech મમ્મી (mammi), બા (bā)"
    reading: "mātā"
    ipa: "mat̪a"
    pos: "noun"
    gender: "f"
    modes: [recognition]
    notes: "Also a goddess: અંબા માતા (ambā mātā), the goddess Amba."
  - id: gu-0628
    target: "પિતા"
    native: "father (formal); in speech પપ્પા (pappā)"
    reading: "pitā"
    ipa: "pit̪a"
    pos: "noun"
    gender: "m"
    modes: [recognition]
    notes: "On forms: પિતાનું નામ (pitānum̐ nām), father's name."
  - id: gu-0629
    target: "સમાચાર"
    native: "news (formal); in speech ખબર (khabar), ન્યૂઝ (nyujh)"
    reading: "samācār"
    ipa: "səmatʃar"
    pos: "noun"
    modes: [recognition]
  - id: gu-0630
    target: "વિદ્યાલય"
    native: "school (formal, in names); in speech શાળા (śāḷā), સ્કૂલ (skul)"
    reading: "vidyālay"
    ipa: "ʋid̪jaləj"
    pos: "noun"
    gender: "n"
    modes: [recognition]
  - id: gu-0631
    target: "પ્રવેશ"
    native: "entrance; entry (on signs)"
    reading: "praveś"
    ipa: "prəʋeʃ"
    pos: "noun"
    gender: "m"
    modes: [recognition]
    notes: "પ્રવેશ નિષેધ (praveś niśedh), no entry."
  - id: gu-0632
    target: "ધૂમ્રપાન નિષેધ"
    native: "no smoking (on signs)"
    reading: "dhumrapān niśedh"
    ipa: "d̪ʱumrəpan niʃed̪ʱ"
    pos: "phrase"
    modes: [recognition]
    notes: "નિષેધ (niśedh) is 'forbidden', a word of signs, not of speech."
  - id: gu-0633
    target: "શ્રીમતી"
    native: "Mrs (formal)"
    reading: "śrimati"
    ipa: "ʃrimət̪i"
    pos: "other"
    modes: [recognition]
    notes: "Before a married woman's name on letters and invitations. In speech, her name and -બહેન (-bahen)."
