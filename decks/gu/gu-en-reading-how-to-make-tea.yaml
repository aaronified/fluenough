  "sentences":
  - "text": "પહેલાં પાણી ઉકાળો."
    "reading": "pahelām̐ pāṇi ukāḷo."
    "ipa": "pəɦelã paɳi ukaɭo"
  - "text": "પછી તેમાં ચા અને ખાંડ નાખો."
    "reading": "pachi temām̐ cā ane khāṇḍ nākho."
    "ipa": "pətʃʰi t̪emã tʃa əne kʰaɳɖ nakʰo"
  - "text": "થોડી વાર હલાવો."
    "reading": "thoḍi vār halāvo."
    "ipa": "t̪ʰoɖi ʋar ɦəlaʋo"
  - "text": "પછી ગરમ ચા કપમાં ભરો."
    "reading": "pachi garam cā kapmām̐ bharo."
    "ipa": "pətʃʰi ɡərəm tʃa kəpmã bʱəro"
  - "text": "મહેમાનને ગરમ ચા પીરસો."
    "reading": "mahemānne garam cā pirso."
    "ipa": "məɦemanne ɡərəm tʃa pirso"
