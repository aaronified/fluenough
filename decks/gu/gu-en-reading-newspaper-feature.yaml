      "title": "Reading: A newspaper feature with a short interview",
      "theme": "verbs-5",
      "sentences": [
        {
          "text": "ગયા રવિવારે શહેરના બગીચામાં એક નવો મેળો શરૂ થયો.",
          "reading": "gayā ravivāre śahernā bagicāmām̐ ek navo meḷo śaru thayo.",
          "ipa": "ɡəja rəʋiʋare ʃəɦerna bəɡitʃamã ek nəʋo meɭo ʃəru t̪ʰəjo"
        },
        {
          "text": "સવારે દસ વાગ્યે લોકો ભેગા થયા, અને પછી મેળો ખૂલ્યો.",
          "reading": "savāre das vāgye loko bhegā thayā, ane pachi meḷo khulyo.",
          "ipa": "səʋare d̪əs ʋaɡje loko bʱeɡa t̪ʰəja əne pətʃʰi meɭo kʰuljo"
        },
        {
          "text": "મેળાના આયોજક, શ્રીમતી શાહે, અમારી સાથે વાત કરી.",
          "reading": "meḷānā āyojak, śrimti śāhe, amāri sāthe vāt kari.",
          "ipa": "meɭana ajodʒək ʃrimt̪i ʃaɦe əmari sat̪ʰe ʋat̪ kəri"
        },
        {
          "text": "તેમણે કહ્યું કે તૈયારી ઘણી સરળ નહોતી.",
          "reading": "temṇe kahyum̐ ke taiyāri ghaṇi saraḷ nahoti.",
          "ipa": "t̪emɳe kəɦjũ ke t̪əijari ɡʱəɳi sərəɭ nəɦot̪i"
        },
        {
          "text": "છેલ્લે, તેમણે કહ્યું કે આવતા વર્ષે મેળો ફરી શરૂ થશે.",
          "reading": "chelle, temṇe kahyum̐ ke āvtā varśe meḷo phari śaru thaśe.",
          "ipa": "tʃʰelle t̪emɳe kəɦjũ ke aʋt̪a ʋərʃe meɭo pʰəri ʃəru t̪ʰəʃe"
        }
      ],
