    pos: "noun"
    gender: "f"
    notes: "Strong, milky and sweet, often with ginger or mint. A small glass of it is a કટિંગ (kaṭiṅg)."
  - id: gu-0565
    target: "પાણી"
    native: "water"
    picture: "💧"
    reading: "pāṇi"
    ipa: "paɳi"
    pos: "noun"
    gender: "n"
  - id: gu-0566
    target: "થાળી"
    native: "thali; a set meal on a plate"
    reading: "thāḷi"
    ipa: "t̪ʰaɭi"
    pos: "noun"
    gender: "f"
    notes: "A Gujarati thali brings dal, kadhi, vegetables, chapatis, rice, snacks and a sweet, refilled until you say stop."
  - id: gu-0567
    target: "રોટલી"
    native: "chapati"
    picture: "🫓"
    reading: "roṭli"
    ipa: "roʈli"
    pos: "noun"
    gender: "f"
    notes: "Thin wheat flatbread. રોટલો (roṭlo) is a thick one, often of millet."
  - id: gu-0568
    target: "ભાત"
    native: "cooked rice"
    picture: "🍚"
    reading: "bhāt"
    ipa: "bʱat̪"
    pos: "noun"
    gender: "m"
    notes: "Dal and rice together is દાળભાત (dāḷbhāt)."
  - id: gu-0569
    target: "કઢી"
    native: "kadhi (a yogurt soup)"
    reading: "kaḍhi"
    ipa: "kəɖʱi"
    pos: "noun"
    gender: "f"
    notes: "Gujarati kadhi is thin, white and a little sweet."
  - id: gu-0570
    target: "ફરસાણ"
    native: "savoury snacks"
    reading: "pharsāṇ"
    ipa: "pʰərsaɳ"
    pos: "noun"
    gender: "n"
    notes: "ઢોકળાં (ḍhokḷām̐), ખમણ (khamaṇ), ફાફડા (phāphḍā): the steamed and fried snacks of a meal or a tea-time."
  - id: gu-0571
    target: "તીખું"
    native: "spicy; hot"
    reading: "tikhum̐"
    ipa: "t̪ikʰũ"
    pos: "adj"
    notes: "ઓછું તીખું (ochum̐ tikhum̐), less spicy. It agrees: તીખો (tikho), તીખી (tikhi), તીખું (tikhum̐)."
  - id: gu-0572
    target: "ગળ્યું"
    native: "sweet (to taste)"
    reading: "gaḷyum̐"
    ipa: "ɡəɭjũ"
    pos: "adj"
    notes: "Much Gujarati cooking has a touch of sweetness. A sweet dish is મીઠાઈ (miṭhāi)."
  - id: gu-0573
    target: "બે થાળી આપો."
    native: "Two thalis, please."
    reading: "be thāḷi āpo."
    ipa: "be t̪ʰaɭi apo"
    pos: "phrase"
  - id: gu-0574
    target: "થોડું વધારે આપો."
    native: "A little more, please."
    reading: "thoḍum̐ vadhāre āpo."
    ipa: "t̪ʰoɖũ ʋəd̪ʱare apo"
    pos: "phrase"
  - id: gu-0575
    target: "બસ, પેટ ભરાઈ ગયું."
    native: "That's enough, I'm full."
    reading: "bas, peṭ bharāi gayum̐."
    ipa: "bəs peʈ bʱərai ɡəjũ"
    pos: "phrase"
    notes: "Literally 'enough, the stomach has filled'. A host will still offer more: say it twice."
  - id: gu-0576
    target: "બહુ સરસ છે."
    native: "It's very good."
    reading: "bahu saras che."
    ipa: "bəɦu sərəs tʃʰe"
    pos: "phrase"
    notes: "સરસ (saras) is 'lovely; excellent'."
  - id: gu-0577
    target: "બિલ લાવો."
    native: "Bring the bill, please."
    reading: "bil lāvo."
    ipa: "bil laʋo"
    pos: "phrase"
  - id: gu-0578
    target: "લારી"
    native: "street-food cart; handcart"
    reading: "lāri"
    ipa: "lari"
    pos: "noun"
    gender: "f"
    notes: "Evening food comes from a લારી (lāri): pav bhaji, dabeli, sandwiches."
