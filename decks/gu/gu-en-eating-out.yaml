schema: 1
id: gu-en-eating-out
name: "Eating out"
kind: vocab
theme: eating-out
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Tea, the thali and its snacks, how spicy and how sweet, more please, enough, and the bill. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: gu-0564
    target: "ચા"
    native: "tea"
    reading: "chaa"
    pos: "noun"
    gender: "f"
    notes: "Strong, milky and sweet, often with ginger or mint. A small glass of it is a કટિંગ (kating)."
  - id: gu-0565
    target: "પાણી"
    native: "water"
    reading: "paanii"
    pos: "noun"
    gender: "n"
  - id: gu-0566
    target: "થાળી"
    native: "thali; a set meal on a plate"
    reading: "thaalii"
    pos: "noun"
    gender: "f"
    notes: "A Gujarati thali brings dal, kadhi, vegetables, chapatis, rice, snacks and a sweet, refilled until you say stop."
  - id: gu-0567
    target: "રોટલી"
    native: "chapati"
    reading: "rotlii"
    pos: "noun"
    gender: "f"
    notes: "Thin wheat flatbread. રોટલો (rotlo) is a thick one, often of millet."
  - id: gu-0568
    target: "ભાત"
    native: "cooked rice"
    reading: "bhaat"
    pos: "noun"
    gender: "m"
    notes: "Dal and rice together is દાળભાત (daalbhaat)."
  - id: gu-0569
    target: "કઢી"
    native: "kadhi (a yogurt soup)"
    reading: "kadhii"
    pos: "noun"
    gender: "f"
    notes: "Gujarati kadhi is thin, white and a little sweet."
  - id: gu-0570
    target: "ફરસાણ"
    native: "savoury snacks"
    reading: "pharsaan"
    pos: "noun"
    gender: "n"
    notes: "ઢોકળાં (dhoklaan), ખમણ (khaman), ફાફડા (phaaphdaa): the steamed and fried snacks of a meal or a tea-time."
  - id: gu-0571
    target: "તીખું"
    native: "spicy; hot"
    reading: "tiikhun"
    pos: "adj"
    notes: "ઓછું તીખું (ochhun tiikhun), less spicy. It agrees: તીખો, તીખી, તીખું."
  - id: gu-0572
    target: "ગળ્યું"
    native: "sweet (to taste)"
    reading: "galyun"
    pos: "adj"
    notes: "Much Gujarati cooking has a touch of sweetness. A sweet dish is મીઠાઈ (miithaaii)."
  - id: gu-0573
    target: "બે થાળી આપો."
    native: "Two thalis, please."
    reading: "be thaalii aapo."
    pos: "phrase"
  - id: gu-0574
    target: "થોડું વધારે આપો."
    native: "A little more, please."
    reading: "thodun vadhaare aapo."
    pos: "phrase"
  - id: gu-0575
    target: "બસ, પેટ ભરાઈ ગયું."
    native: "That's enough, I'm full."
    reading: "bas, pet bharaaii gayun."
    pos: "phrase"
    notes: "Literally 'enough, the stomach has filled'. A host will still offer more: say it twice."
  - id: gu-0576
    target: "બહુ સરસ છે."
    native: "It's very good."
    reading: "bahu saras chhe."
    pos: "phrase"
    notes: "સરસ (saras) is 'lovely; excellent'."
  - id: gu-0577
    target: "બિલ લાવો."
    native: "Bring the bill, please."
    reading: "bil laavo."
    pos: "phrase"
  - id: gu-0578
    target: "લારી"
    native: "street-food cart; handcart"
    reading: "laarii"
    pos: "noun"
    gender: "f"
    notes: "Evening food comes from a લારી: pav bhaji, dabeli, sandwiches."
