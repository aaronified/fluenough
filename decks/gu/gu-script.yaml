# How Gujarati script works: the recurring features a learner from English
# misses, shown before the first letters and from a script deck's Tips.
# See ADR-0016 and docs/DECK-FORMAT.md. Not yet checked by a Gujarati
# speaker: please report any mistake.
schema: 1
kind: "script"
part: "core"
id: "gu-script"
language: "gu"
features:
  - id: "no-headline"
    example: "ક"
    letters: ["ક", "ગ", "ત", "ન", "મ", "સ"]
  - id: "own-shapes"
    example: "જ"
    letters: ["અ", "ઇ", "ખ", "જ", "ઝ", "ણ", "શ", "ળ"]
  - id: "rows"
    term: "વર્ગ"
    reading: "varg"
    ipa: "ʋərɡ"
    example: "ક"
    letters: ["ક", "ખ", "ગ", "ઘ", "ઙ", "ચ", "છ", "જ", "ઝ", "ઞ", "ટ", "ઠ", "ડ", "ઢ", "ણ", "ત", "થ", "દ", "ધ", "ન", "પ", "ફ", "બ", "ભ", "મ"]
  - id: "inherent-vowel"
    example: "ક"
    letters: ["ક", "કર", "કમળ"]
  - id: "final-a"
    example: "ઘર"
    letters: ["ઘર", "કમળ", "છોકરો"]
  - id: "vowel-signs"
    term: "બારાખડી"
    reading: "bārākhaḍi"
    ipa: "barakʰəɖi"
    example: "કિ"
    letters: ["કા", "કિ", "કી", "કુ", "કે", "કો"]
  - id: "half-letters"
    term: "જોડાક્ષર"
    reading: "joḍākśar"
    ipa: "dʒoɖakʃər"
    example: "પ્ય"
    letters: ["પ્ય", "સ્ત", "ત્ય", "ચ્છ", "દ્ધ"]
  - id: "special-joins"
    example: "ક્ષ"
    letters: ["ક્ષ", "જ્ઞ", "ત્ર", "શ્ર", "દ્ર"]
  - id: "r-forms"
    example: "પ્ર"
    letters: ["પ્ર", "ક્ર", "ટ્ર", "ર્મ"]
  - id: "halant"
    term: "હલંત"
    reading: "halant"
    ipa: "ɦələnt̪"
    example: "ક્"
    letters: ["ક્", "દ્", "ટ્"]
  - id: "dot"
    term: "અનુસ્વાર"
    reading: "anusvār"
    ipa: "ənusʋar"
    example: "હું"
    letters: ["હું", "છું", "પંદર", "મોટું"]
  - id: "moon"
    example: "ઑ"
    letters: ["ઑ", "કૉ", "કૅ"]
  - id: "curled-back"
    example: "ળ"
    letters: ["ણ", "ળ"]
  - id: "digits"
    example: "૪"
    letters: ["૦", "૧", "૨", "૩", "૪", "૫", "૬", "૭", "૮", "૯"]
