schema: 1
id: gu-en-grammar-gender-number
name: "Gender and number"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Masculine, feminine and neuter, in the singular and the plural, and the plural of respect. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - ref: gu-0244
    notes: "Masculine: the noun in -ઓ (-o), the past verb in -ઓ (-o)."
  - ref: gu-0245
    notes: "Feminine: the noun in -ઈ (-i), the past verb in -ઈ (-i)."
  - ref: gu-0246
    notes: "Neuter: the verb in -ઉં (-um̐). A child, many things and some animals are neuter, whatever their sex."
  - id: gu-0405
    target: "છોકરાઓ રમે છે."
    native: "The boys are playing."
    reading: "chokrāo rame che."
    ipa: "tʃʰokrao rəme tʃʰe"
    pos: "phrase"
    notes: "છોકરો (chokro) becomes છોકરા (chokrā) in the plural, and many add -ઓ (-o) as well: છોકરાઓ (chokrāo)."
  - id: gu-0406
    target: "છોકરાં રમે છે."
    native: "The children are playing."
    reading: "chokrām̐ rame che."
    ipa: "tʃʰokrã rəme tʃʰe"
    pos: "phrase"
    notes: "છોકરું (chokrum̐), a child, is neuter; its plural છોકરાં (chokrām̐) takes in boys and girls together."
  - id: gu-0407
    target: "મારાં કપડાં"
    native: "my clothes"
    reading: "mārām̐ kapḍām̐"
    ipa: "marã kəpɖã"
    pos: "phrase"
    notes: "કપડાં (kapḍām̐) is neuter plural, so 'my' is મારાં (mārām̐), with the nasal -આં (-ām̐)."
  - id: gu-0408
    target: "ત્રણ કેળાં"
    native: "three bananas"
    reading: "traṇ keḷām̐"
    ipa: "t̪rəɳ keɭã"
    pos: "phrase"
    notes: "After a number a noun can be plural or stay singular: ત્રણ કેળાં (traṇ keḷām̐), બે ભાઈ (be bhāi)."
  - id: gu-0409
    target: "બા આવ્યાં."
    native: "Ba has come. (with respect)"
    reading: "bā āvyām̐."
    ipa: "ba aʋjã"
    pos: "phrase"
    notes: "One person spoken of with respect takes the plural: a man -આ (-ā) (પપ્પા આવ્યા (pappā āvyā)), a woman -આં (-ām̐). A mixed group takes -આં (-ām̐) too."
