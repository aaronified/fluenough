schema: 1
id: gu-en-reading-keri
name: "Reading: Mangoes for lunch"
kind: reading
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
source: "Written for this deck, and released under CC0"
description: "A short, simple story written for this deck and released under CC0, not quoted from any book: Meena and her grandmother buy mangoes at the market, bargain, and make mango pulp for the family's lunch. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [reading, unreviewed]
passages:
  - id: gu-keri-01
    title: "To the market"
    theme: market
    sentences:
      - text: "આજે રવિવાર છે."
        reading: "aje ravivar chhe."
      - text: "મીના અને તેનાં દાદી બજારમાં જાય છે."
        reading: "mina ane tenan dadi bajarman jay chhe."
      - text: "બજારમાં બહુ ભીડ છે."
        reading: "bajarman bahu bhid chhe."
      - text: "દાદીને કેરી જોઈએ છે."
        reading: "dadine keri joie chhe."
      - text: "દાદી પૂછે છે, “કેરી કેટલાની છે?”"
        reading: "dadi puchhe chhe, 'keri ketlani chhe?'"
      - text: "વેપારી કહે છે, “એકસો વીસ રૂપિયે કિલો.”"
        reading: "vepari kahe chhe, 'ekso vis rupiye kilo.'"
    glossary:
      - word: "તેનાં"
        modern: "તેનાં"
        reading: "tenan"
        meaning: { en: "her (with respect)" }
        note: { en: "'her' takes the plural -આં because the grandmother is spoken of with respect" }
      - word: "ભીડ"
        modern: "ભીડ"
        reading: "bhid"
        meaning: { en: "a crowd" }
      - word: "રૂપિયે"
        modern: "રૂપિયે"
        reading: "rupiye"
        meaning: { en: "at ... rupees (a price per unit)" }
        note: { en: "-એ on a price gives the rate: સો રૂપિયે કિલો, a hundred rupees a kilo" }
    questions:
      - id: gu-0668
        prompt: { en: "What day is it?" }
        options:
          - { en: "Sunday" }
          - { en: "Monday" }
          - { en: "Saturday" }
        answer: 1
      - id: gu-0669
        prompt: { en: "Grandma wants mangoes." }
        answer: true
      - id: gu-0670
        prompt: { en: "What price does the seller ask?" }
        options:
          - { en: "A hundred rupees a kilo" }
          - { en: "A hundred and twenty rupees a kilo" }
          - { en: "Two hundred rupees a kilo" }
        answer: 2
  - id: gu-keri-02
    title: "A good price"
    theme: market
    sentences:
      - text: "“બહુ મોંઘી છે, ભાઈ.”"
        reading: "'bahu monghi chhe, bhai.'"
      - text: "“સો રૂપિયે આપો.”"
        reading: "'so rupiye apo.'"
      - text: "વેપારી હસે છે."
        reading: "vepari hase chhe."
      - text: "“ભલે બા, સો રૂપિયે.”"
        reading: "'bhale ba, so rupiye.'"
      - text: "મીના બે કિલો કેરી થેલીમાં મૂકે છે."
        reading: "mina be kilo keri theliman muke chhe."
    glossary:
      - word: "હસે"
        modern: "હસે"
        reading: "hase"
        meaning: { en: "laughs; smiles" }
        note: { en: "from હસવું, to laugh" }
      - word: "ભલે"
        modern: "ભલે"
        reading: "bhale"
        meaning: { en: "all right; fine" }
      - word: "મૂકે"
        modern: "મૂકે"
        reading: "muke"
        meaning: { en: "puts" }
        note: { en: "from મૂકવું, to put" }
    questions:
      - id: gu-0671
        prompt: { en: "Grandma thinks the mangoes are cheap." }
        answer: false
      - id: gu-0672
        prompt: { en: "What price do they settle on?" }
        options:
          - { en: "A hundred rupees a kilo" }
          - { en: "A hundred and twenty rupees a kilo" }
          - { en: "Two hundred rupees a kilo" }
        answer: 1
      - id: gu-0673
        prompt: { en: "How many kilos does Meena put in the bag?" }
        options:
          - { en: "One" }
          - { en: "Two" }
          - { en: "Three" }
        answer: 2
  - id: gu-keri-03
    title: "On the way home"
    theme: transport
    sentences:
      - text: "ઘરે જવા માટે તેઓ રિક્ષા લે છે."
        reading: "ghare java mate teo riksha le chhe."
      - text: "રસ્તામાં મીના પૂછે છે, “દાદી, આપણે રસ બનાવીશું?”"
        reading: "rastaman mina puchhe chhe, 'dadi, apne ras banavishun?'"
      - text: "“હા, અને સાથે પૂરી પણ.”"
        reading: "'ha, ane sathe puri pan.'"
      - text: "મીના ખુશ થઈ જાય છે."
        reading: "mina khush thai jay chhe."
    glossary:
      - word: "બનાવીશું"
        modern: "બનાવીશું"
        reading: "banavishun"
        meaning: { en: "shall we make; we will make" }
        note: { en: "the future of બનાવવું, to make, with આપણે" }
      - word: "પૂરી"
        modern: "પૂરી"
        reading: "puri"
        meaning: { en: "puri, a small puffed fried bread" }
      - word: "ખુશ"
        modern: "ખુશ"
        reading: "khush"
        meaning: { en: "happy" }
    questions:
      - id: gu-0674
        prompt: { en: "How do they go home?" }
        options:
          - { en: "By bus" }
          - { en: "By auto-rickshaw" }
          - { en: "On foot" }
        answer: 2
      - id: gu-0675
        prompt: { en: "Meena wants to make mango pulp." }
        answer: true
      - id: gu-0676
        prompt: { en: "What will they eat with it?" }
        options:
          - { en: "Rice" }
          - { en: "Puris" }
          - { en: "Chapatis" }
        answer: 2
  - id: gu-keri-04
    title: "Lunch"
    theme: eating-out
    sentences:
      - text: "બપોરે આખું કુટુંબ સાથે જમે છે."
        reading: "bapore akhun kutumb sathe jame chhe."
      - text: "પપ્પા કહે છે, “રસ બહુ મીઠો છે!”"
        reading: "pappa kahe chhe, 'ras bahu mitho chhe!'"
      - text: "દાદી હસીને કહે છે, “કેરી મીનાએ પસંદ કરી હતી.”"
        reading: "dadi hasine kahe chhe, 'keri minae pasand kari hati.'"
      - text: "સાંજે મીના બે કેરી પાડોશીને આપે છે."
        reading: "sanje mina be keri padoshine ape chhe."
    glossary:
      - word: "આખું"
        modern: "આખું"
        reading: "akhun"
        meaning: { en: "whole; the whole" }
      - word: "હસીને"
        modern: "હસીને"
        reading: "hasine"
        meaning: { en: "with a smile; laughing" }
        note: { en: "-ઈને on a stem is 'having done': હસીને કહે છે, says with a smile" }
      - word: "પસંદ"
        modern: "પસંદ"
        reading: "pasand"
        meaning: { en: "choice; liking" }
        note: { en: "પસંદ કરવું, to choose; કરી હતી is feminine because કેરી is" }
    questions:
      - id: gu-0677
        prompt: { en: "Who says the mango pulp is very sweet?" }
        options:
          - { en: "Grandma" }
          - { en: "Dad" }
          - { en: "Meena" }
        answer: 2
      - id: gu-0678
        prompt: { en: "Who chose the mangoes?" }
        options:
          - { en: "Meena" }
          - { en: "Grandma" }
          - { en: "The seller" }
        answer: 1
      - id: gu-0679
        prompt: { en: "In the evening Meena gives mangoes to a neighbour." }
        answer: true
