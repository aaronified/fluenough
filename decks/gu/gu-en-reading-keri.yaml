schema: 1
id: gu-en-reading-keri
name: "Reading: Mangoes for lunch"
kind: reading
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
source: "Written for this deck, and released under CC0"
description: "A short, simple story written for this deck and released under CC0, not quoted from any book: Meena and her grandmother buy mangoes at the market, bargain, and make mango pulp for the family's lunch. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [reading, unreviewed]
passages:
  - id: gu-keri-01
    title: "To the market"
    theme: market
    sentences:
      - text: "આજે રવિવાર છે."
        reading: "āje ravivār che."
        ipa: "adʒe rəʋiʋar tʃʰe"
      - text: "મીના અને તેનાં દાદી બજારમાં જાય છે."
        reading: "minā ane tenām̐ dādi bajārmām̐ jāy che."
        ipa: "mina əne t̪enã d̪ad̪i bədʒarmã dʒaj tʃʰe"
      - text: "બજારમાં બહુ ભીડ છે."
        reading: "bajārmām̐ bahu bhiḍ che."
        ipa: "bədʒarmã bəɦu bʱiɖ tʃʰe"
      - text: "દાદીને કેરી જોઈએ છે."
        reading: "dādine keri joie che."
        ipa: "d̪ad̪ine keri dʒoie tʃʰe"
      - text: "દાદી પૂછે છે, “કેરી કેટલાની છે?”"
        reading: "dādi puche che, 'keri keṭlāni che?'"
        ipa: "d̪ad̪i putʃʰe tʃʰe keri keʈlani tʃʰe"
      - text: "વેપારી કહે છે, “એકસો વીસ રૂપિયે કિલો.”"
        reading: "vepāri kahe che, 'ekso vis rupiye kilo.'"
        ipa: "ʋepari kəɦe tʃʰe ekso ʋis rupije kilo"
    glossary:
      - word: "તેનાં"
        modern: "તેનાં"
        reading: "tenām̐"
        ipa: "t̪enã"
        meaning: { en: "her (with respect)" }
        note: { en: "'her' takes the plural -આં (-ām̐) because the grandmother is spoken of with respect" }
      - word: "ભીડ"
        modern: "ભીડ"
        reading: "bhiḍ"
        ipa: "bʱiɖ"
        meaning: { en: "a crowd" }
      - word: "રૂપિયે"
        modern: "રૂપિયે"
        reading: "rupiye"
        ipa: "rupije"
        meaning: { en: "at ... rupees (a price per unit)" }
        note: { en: "-એ (-e) on a price gives the rate: સો રૂપિયે કિલો (so rupiye kilo), a hundred rupees a kilo" }
    questions:
      - id: gu-0668
        prompt: { en: "What day is it?" }
        options:
          - { en: "Sunday" }
          - { en: "Monday" }
          - { en: "Saturday" }
        answer: 1
      - id: gu-0669
        prompt: { en: "Grandma wants mangoes." }
        answer: true
      - id: gu-0670
        prompt: { en: "What price does the seller ask?" }
        options:
          - { en: "A hundred rupees a kilo" }
          - { en: "A hundred and twenty rupees a kilo" }
          - { en: "Two hundred rupees a kilo" }
        answer: 2
  - id: gu-keri-02
    title: "A good price"
    theme: market
    sentences:
      - text: "“બહુ મોંઘી છે, ભાઈ.”"
        reading: "'bahu moṅghi che, bhāi.'"
        ipa: "bəɦu moŋɡʱi tʃʰe bʱai"
      - text: "“સો રૂપિયે આપો.”"
        reading: "'so rupiye āpo.'"
        ipa: "so rupije apo"
      - text: "વેપારી હસે છે."
        reading: "vepāri hase che."
        ipa: "ʋepari ɦəse tʃʰe"
      - text: "“ભલે બા, સો રૂપિયે.”"
        reading: "'bhale bā, so rupiye.'"
        ipa: "bʱəle ba so rupije"
      - text: "મીના બે કિલો કેરી થેલીમાં મૂકે છે."
        reading: "minā be kilo keri thelimām̐ muke che."
        ipa: "mina be kilo keri t̪ʰelimã muke tʃʰe"
    glossary:
      - word: "હસે"
        modern: "હસે"
        reading: "hase"
        ipa: "ɦəse"
        meaning: { en: "laughs; smiles" }
        note: { en: "from હસવું (hasvum̐), to laugh" }
      - word: "ભલે"
        modern: "ભલે"
        reading: "bhale"
        ipa: "bʱəle"
        meaning: { en: "all right; fine" }
      - word: "મૂકે"
        modern: "મૂકે"
        reading: "muke"
        ipa: "muke"
        meaning: { en: "puts" }
        note: { en: "from મૂકવું (mukvum̐), to put" }
    questions:
      - id: gu-0671
        prompt: { en: "Grandma thinks the mangoes are cheap." }
        answer: false
      - id: gu-0672
        prompt: { en: "What price do they settle on?" }
        options:
          - { en: "A hundred rupees a kilo" }
          - { en: "A hundred and twenty rupees a kilo" }
          - { en: "Two hundred rupees a kilo" }
        answer: 1
      - id: gu-0673
        prompt: { en: "How many kilos does Meena put in the bag?" }
        options:
          - { en: "One" }
          - { en: "Two" }
          - { en: "Three" }
        answer: 2
  - id: gu-keri-03
    title: "On the way home"
    theme: transport
    sentences:
      - text: "ઘરે જવા માટે તેઓ રિક્ષા લે છે."
        reading: "ghare javā māṭe teo rikśā le che."
        ipa: "ɡʱəre dʒəʋa maʈe t̪eo rikʃa le tʃʰe"
      - text: "રસ્તામાં મીના પૂછે છે, “દાદી, આપણે રસ બનાવીશું?”"
        reading: "rastāmām̐ minā puche che, 'dādi, āpṇe ras banāviśum̐?'"
        ipa: "rəst̪amã mina putʃʰe tʃʰe d̪ad̪i apɳe rəs bənaʋiʃũ"
      - text: "“હા, અને સાથે પૂરી પણ.”"
        reading: "'hā, ane sāthe puri paṇ.'"
        ipa: "ɦa əne sat̪ʰe puri pəɳ"
      - text: "મીના ખુશ થઈ જાય છે."
        reading: "minā khuś thai jāy che."
        ipa: "mina kʰuʃ t̪ʰəi dʒaj tʃʰe"
    glossary:
      - word: "બનાવીશું"
        modern: "બનાવીશું"
        reading: "banāviśum̐"
        ipa: "bənaʋiʃũ"
        meaning: { en: "shall we make; we will make" }
        note: { en: "the future of બનાવવું (banāvvum̐), to make, with આપણે (āpṇe)" }
      - word: "પૂરી"
        modern: "પૂરી"
        reading: "puri"
        ipa: "puri"
        meaning: { en: "puri, a small puffed fried bread" }
      - word: "ખુશ"
        modern: "ખુશ"
        reading: "khuś"
        ipa: "kʰuʃ"
        meaning: { en: "happy" }
    questions:
      - id: gu-0674
        prompt: { en: "How do they go home?" }
        options:
          - { en: "By bus" }
          - { en: "By auto-rickshaw" }
          - { en: "On foot" }
        answer: 2
      - id: gu-0675
        prompt: { en: "Meena wants to make mango pulp." }
        answer: true
      - id: gu-0676
        prompt: { en: "What will they eat with it?" }
        options:
          - { en: "Rice" }
          - { en: "Puris" }
          - { en: "Chapatis" }
        answer: 2
  - id: gu-keri-04
    title: "Lunch"
    theme: eating-out
    sentences:
      - text: "બપોરે આખું કુટુંબ સાથે જમે છે."
        reading: "bapore ākhum̐ kuṭumb sāthe jame che."
        ipa: "bəpore akʰũ kuʈumb sat̪ʰe dʒəme tʃʰe"
      - text: "પપ્પા કહે છે, “રસ બહુ મીઠો છે!”"
        reading: "pappā kahe che, 'ras bahu miṭho che!'"
        ipa: "pəppa kəɦe tʃʰe rəs bəɦu miʈʰo tʃʰe"
      - text: "દાદી હસીને કહે છે, “કેરી મીનાએ પસંદ કરી હતી.”"
        reading: "dādi hasine kahe che, 'keri mināe pasand kari hati.'"
        ipa: "d̪ad̪i ɦəsine kəɦe tʃʰe keri minae pəsənd̪ kəri ɦət̪i"
      - text: "સાંજે મીના બે કેરી પાડોશીને આપે છે."
        reading: "sāñje minā be keri pāḍośine āpe che."
        ipa: "saɲdʒe mina be keri paɖoʃine ape tʃʰe"
    glossary:
      - word: "આખું"
        modern: "આખું"
        reading: "ākhum̐"
        ipa: "akʰũ"
        meaning: { en: "whole; the whole" }
      - word: "હસીને"
        modern: "હસીને"
        reading: "hasine"
        ipa: "ɦəsine"
        meaning: { en: "with a smile; laughing" }
        note: { en: "-ઈને (-ine) on a stem is 'having done': હસીને કહે છે (hasine kahe che), says with a smile" }
      - word: "પસંદ"
        modern: "પસંદ"
        reading: "pasand"
        ipa: "pəsənd̪"
        meaning: { en: "choice; liking" }
        note: { en: "પસંદ કરવું (pasand karvum̐), to choose; કરી હતી (kari hati) is feminine because કેરી (keri) is" }
    questions:
      - id: gu-0677
        prompt: { en: "Who says the mango pulp is very sweet?" }
        options:
          - { en: "Grandma" }
          - { en: "Dad" }
          - { en: "Meena" }
        answer: 2
      - id: gu-0678
        prompt: { en: "Who chose the mangoes?" }
        options:
          - { en: "Meena" }
          - { en: "Grandma" }
          - { en: "The seller" }
        answer: 1
      - id: gu-0679
        prompt: { en: "In the evening Meena gives mangoes to a neighbour." }
        answer: true
