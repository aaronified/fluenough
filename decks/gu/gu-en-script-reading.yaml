schema: 1
id: gu-en-script-reading
name: "First words to read"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Short everyday words written with letters alone, no vowel signs: the vowel you do not see, and the last a that goes quiet, at work. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: gu-0048
    target: "ઘર"
    native: "house; home"
    reading: "ghar"
    ipa: "ɡʱər"
    notes: "ઘ is gha and ર is ra, but the last a isn't said: ghar."
  - id: gu-0049
    target: "નળ"
    native: "tap"
    reading: "naḷ"
    ipa: "nəɭ"
    notes: "ન and the curled-back ળ; the last a is quiet."
  - id: gu-0050
    target: "ફળ"
    native: "fruit"
    reading: "phaḷ"
    ipa: "pʰəɭ"
    notes: "ફ is પ with a breath; many say it 'fal'."
  - id: gu-0051
    target: "મગ"
    native: "mung beans"
    reading: "mag"
    ipa: "məɡ"
    notes: "Two letters, and only the first a is said: mag."
  - id: gu-0052
    target: "વન"
    native: "forest"
    reading: "van"
    ipa: "ʋən"
    notes: "વ is between v and w."
  - id: gu-0053
    target: "રસ"
    native: "juice"
    reading: "ras"
    ipa: "rəs"
    notes: "In Gujarat રસ on its own often means mango pulp, eaten with puris in summer."
  - id: gu-0054
    target: "બસ"
    native: "bus; enough"
    reading: "bas"
    ipa: "bəs"
    notes: "Two words in one: the English 'bus', and બસ! 'that's enough'."
  - id: gu-0055
    target: "પણ"
    native: "but; also"
    reading: "paṇ"
    ipa: "pəɳ"
    notes: "With the curled-back ણ. Between two clauses it is 'but'; after a word it is 'also': હું પણ (hum̐ paṇ), me too."
  - id: gu-0056
    target: "કમળ"
    native: "lotus"
    reading: "kamaḷ"
    ipa: "kəməɭ"
    notes: "Three letters and no vowel written: ka-ma-l."
  - id: gu-0057
    target: "ગરમ"
    native: "hot; warm"
    reading: "garam"
    ipa: "ɡərəm"
    notes: "ગ, ર and મ, each with its a, and the last one quiet."
  - id: gu-0058
    target: "નરમ"
    native: "soft"
    reading: "naram"
    ipa: "nərəm"
  - id: gu-0059
    target: "ખબર"
    native: "news; knowing"
    reading: "khabar"
    ipa: "kʰəbər"
    notes: "મને ખબર નથી (mane khabar nathi): I don't know."
  - id: gu-0060
    target: "સમય"
    native: "time"
    reading: "samay"
    ipa: "səməj"
    notes: "The last letter ય is a y, and its a is quiet: sa-may."
  - id: gu-0061
    target: "હળદર"
    native: "turmeric"
    reading: "haḷdar"
    ipa: "ɦəɭd̪ər"
    notes: "The a after ળ goes quiet inside the word too: hal-dar, not ha-la-dar."
  - id: gu-0062
    target: "શરબત"
    native: "a sweet cold drink; sherbet"
    reading: "śarbat"
    ipa: "ʃərbət̪"
    notes: "The a after ર is quiet: shar-bat."
