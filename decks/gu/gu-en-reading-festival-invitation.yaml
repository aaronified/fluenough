  "sentences":
  - "text": "અમારા ઘરે દિવાળીની ઉજવણી છે."
    "reading": "amārā ghare divāḷini ujvṇi che."
    "ipa": "əmara ɡʱəre d̪iʋaɭini udʒʋɳi tʃʰe"
  - "text": "રાત્રે મીઠાઈ અને ભોજન હશે."
    "reading": "rātre miṭhāi ane bhojan haśe."
    "ipa": "rat̪re miʈʰai əne bʱodʒən ɦəʃe"
  - "text": "બધા મિત્રો આવજો."
    "reading": "badhā mitro āvjo."
    "ipa": "bəd̪ʱa mit̪ro aʋdʒo"
  - "text": "અમે તમારી રાહ જોઈશું."
    "reading": "ame tamāri rāh joiśum̐."
    "ipa": "əme t̪əmari raɦ dʒoiʃũ"
