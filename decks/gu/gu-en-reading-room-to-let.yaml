  - "text": "ઓરડો વિશાળ, હવાદાર અને સાફ છે."
    "reading": "orḍo viśāḷ, havādār ane sāph che."
    "ipa": "orɖo ʋiʃaɭ ɦəʋad̪ar əne sapʰ tʃʰe"
  - "text": "બારી મોટી છે અને બગીચો સુંદર છે."
    "reading": "bāri moṭi che ane bagico sundar che."
    "ipa": "bari moʈi tʃʰe əne bəɡitʃo sund̪ər tʃʰe"
  - "text": "ભાડું મહિને પાંચ હજાર રૂપિયા છે."
    "reading": "bhāḍum̐ mahine pāñc hajār rupiyā che."
    "ipa": "bʱaɖũ məɦine paɲtʃ ɦədʒar rupija tʃʰe"
