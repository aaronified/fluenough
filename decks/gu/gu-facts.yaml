facts:
  - id: gu-fact-001
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Gujarati_language"
    text:
      en: "Gujarati is an Indo-Aryan language, a cousin of Hindi, Marathi and Bengali. Like them it comes from Sanskrit, through the Prakrits and Apabhramsha."
      bn: "গুজরাটি একটি ইন্দো-আর্য ভাষা, হিন্দি, মারাঠি ও বাংলার আত্মীয়। এদের মতোই এটি সংস্কৃত থেকে প্রাকৃত ও অপভ্রংশের পথ ধরে এসেছে।"
      hi: "गुजराती एक भारतीय-आर्य भाषा है, हिंदी, मराठी और बांग्ला की रिश्तेदार। इन्हीं की तरह यह संस्कृत से प्राकृत और अपभ्रंश होते हुए आई है।"
  - id: gu-fact-002
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Gujarati_language"
    text:
      en: "About 55 million people in India gave Gujarati as their mother tongue in the 2011 census."
      bn: "২০১১ সালের জনগণনায় ভারতে প্রায় সাড়ে পাঁচ কোটি মানুষ গুজরাটিকে মাতৃভাষা বলে জানিয়েছিলেন।"
      hi: "2011 की जनगणना में भारत में लगभग साढ़े पाँच करोड़ लोगों ने गुजराती को अपनी मातृभाषा बताया।"
  - id: gu-fact-003
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Eighth_Schedule_to_the_Constitution_of_India"
    text:
      en: "Gujarati is the official language of the state of Gujarat, and one of the 22 languages listed in the Eighth Schedule of India's Constitution."
      bn: "গুজরাটি গুজরাট রাজ্যের সরকারি ভাষা, এবং ভারতের সংবিধানের অষ্টম তফসিলে তালিকাভুক্ত ২২টি ভাষার একটি।"
      hi: "गुजराती गुजरात राज्य की राजभाषा है, और भारत के संविधान की आठवीं अनुसूची में दर्ज 22 भाषाओं में से एक है।"
  - id: gu-fact-004
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Mahagujarat_movement"
    text:
      en: "Gujarat became a state on 1 May 1960, when the old Bombay State was divided into Gujarati-speaking Gujarat and Marathi-speaking Maharashtra. 1 May is still celebrated as Gujarat Day."
      bn: "১৯৬০ সালের ১ মে গুজরাট রাজ্য গঠিত হয়, যখন পুরোনো বোম্বে রাজ্য ভাগ হয়ে গুজরাটিভাষী গুজরাট ও মারাঠিভাষী মহারাষ্ট্র হয়। ১ মে আজও গুজরাট দিবস হিসেবে পালিত হয়।"
      hi: "1 मई 1960 को गुजरात राज्य बना, जब पुराना बंबई राज्य गुजराती-भाषी गुजरात और मराठी-भाषी महाराष्ट्र में बँटा। 1 मई आज भी गुजरात दिवस के रूप में मनाया जाता है।"
  - id: gu-fact-005
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Gujarat"
    text:
      en: "The names Gujarat and Gujarati come from the Gurjaras, a people who ruled parts of the region more than a thousand years ago."
      bn: "গুজরাট ও গুজরাটি নাম দুটি এসেছে গুর্জরদের থেকে, যাঁরা হাজার বছরেরও আগে এই অঞ্চলের কিছু অংশ শাসন করতেন।"
      hi: "गुजरात और गुजराती नाम गुर्जरों से आए हैं, जिन्होंने हज़ार साल से भी पहले इस क्षेत्र के कुछ हिस्सों पर राज किया।"
  - id: gu-fact-006
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Old_Gujarati"
    text:
      en: "Old Gujarati, spoken from about 1100 to 1500, was one language with what became Rajasthani. Scholars call it Old Western Rajasthani, or Maru-Gurjar."
      bn: "প্রাচীন গুজরাটি, যা মোটামুটি ১১০০ থেকে ১৫০০ সাল পর্যন্ত বলা হত, পরে রাজস্থানি হয়ে ওঠা ভাষার সঙ্গে একই ভাষা ছিল। পণ্ডিতরা একে প্রাচীন পশ্চিমী রাজস্থানি বা মরু-গুর্জর বলেন।"
      hi: "पुरानी गुजराती, जो लगभग 1100 से 1500 तक बोली जाती थी, आगे चलकर राजस्थानी बनी भाषा के साथ एक ही भाषा थी। विद्वान इसे पुरानी पश्चिमी राजस्थानी या मरु-गुर्जर कहते हैं।"
  - id: gu-fact-007
    tags: [script]
    source: "https://en.wikipedia.org/wiki/Gujarati_script"
    text:
      en: "Gujarati script is a close cousin of Devanagari, but its letters have no line along the top. Many look like a Devanagari letter with the line taken away."
      bn: "গুজরাটি লিপি দেবনাগরীর ঘনিষ্ঠ আত্মীয়, কিন্তু এর অক্ষরের মাথায় কোনো টানা রেখা নেই। অনেক অক্ষর দেখতে মাথার রেখা সরিয়ে নেওয়া দেবনাগরী অক্ষরের মতো।"
      hi: "गुजराती लिपि देवनागरी की क़रीबी रिश्तेदार है, लेकिन इसके अक्षरों के ऊपर शिरोरेखा नहीं होती। कई अक्षर शिरोरेखा हटाए हुए देवनागरी अक्षर जैसे दिखते हैं।"
  - id: gu-fact-008
    tags: [script, history]
    source: "https://en.wikipedia.org/wiki/Gujarati_script"
    text:
      en: "For centuries the Gujarati script was used mostly for letters and accounts, while books were copied in Devanagari. Merchants and bankers used it so much that it was sometimes called the bankers' script."
      bn: "বহু শতাব্দী ধরে গুজরাটি লিপি মূলত চিঠি ও হিসাবের খাতায় ব্যবহৃত হত, আর বই নকল করা হত দেবনাগরীতে। বণিক ও মহাজনরা এত বেশি এটি ব্যবহার করতেন যে একে কখনো কখনো মহাজনদের লিপি বলা হত।"
      hi: "सदियों तक गुजराती लिपि ज़्यादातर चिट्ठियों और हिसाब-किताब में इस्तेमाल होती थी, जबकि किताबें देवनागरी में लिखी जाती थीं। व्यापारी और साहूकार इसका इतना इस्तेमाल करते थे कि इसे कभी-कभी साहूकारों की लिपि कहा जाता था।"
  - id: gu-fact-009
    tags: [script, history]
    source: "https://en.wikipedia.org/wiki/Gujarati_script"
    text:
      en: "The first known printing in Gujarati script was an advertisement in the Bombay Courier, a Bombay newspaper, in 1797."
      bn: "গুজরাটি লিপিতে প্রথম জানা ছাপা লেখা ছিল ১৭৯৭ সালে বোম্বের সংবাদপত্র 'বোম্বে কুরিয়ার'-এ একটি বিজ্ঞাপন।"
      hi: "गुजराती लिपि में सबसे पहली ज्ञात छपाई 1797 में बंबई के अख़बार 'बॉम्बे कूरियर' में छपा एक विज्ञापन था।"
  - id: gu-fact-010
    tags: [script, pronunciation]
    text:
      en: "No Gujarati word begins with ણ or ળ. These curled-back n and l only come inside or at the end of a word, as in પાણી (pāṇi, water) and સોળ (soḷ, sixteen)."
      bn: "কোনো গুজরাটি শব্দ ણ বা ળ দিয়ে শুরু হয় না। এই মূর্ধন্য ন আর ল কেবল শব্দের ভেতরে বা শেষে আসে, যেমন પાણી (পাণী, জল) আর સોળ (সোল, ষোলো)।"
      hi: "कोई भी गुजराती शब्द ણ या ળ से शुरू नहीं होता। ये मूर्धन्य ण और ळ केवल शब्द के बीच में या अंत में आते हैं, जैसे પાણી (पाणी, पानी) और સોળ (सोळ, सोलह)।"
  - id: gu-fact-011
    tags: [pronunciation, script]
    text:
      en: "Gujarati says the join જ્ઞ as 'gn': જ્ઞાન (knowledge) is gnan, where Hindi says gyaan."
      bn: "গুজরাটিতে যুক্তাক্ষর જ્ઞ (জ্ঞ) উচ্চারিত হয় 'গ্ন': જ્ઞાન (জ্ঞান) হলো 'গ্নান', যেখানে হিন্দিতে বলা হয় 'গ্যান'।"
      hi: "गुजराती में संयुक्ताक्षर જ્ઞ (ज्ञ) 'ग्न' बोला जाता है: જ્ઞાન (ज्ञान) 'ग्नान' है, जहाँ हिंदी में 'ग्यान' बोलते हैं।"
  - id: gu-fact-012
    tags: [pronunciation, script]
    source: "https://en.wikipedia.org/wiki/Gujarati_phonology"
    text:
      en: "Gujarati spells a long and a short i, and a long and a short u, but says them alike. Which one a word takes is a matter of spelling alone, and a common source of mistakes."
      bn: "গুজরাটিতে হ্রস্ব ও দীর্ঘ ই, আর হ্রস্ব ও দীর্ঘ উ আলাদা করে লেখা হয়, কিন্তু উচ্চারণ একই। কোন শব্দে কোনটি বসবে তা শুধু বানানের ব্যাপার, আর ভুলের এক বড় কারণ।"
      hi: "गुजराती में ह्रस्व और दीर्घ इ, और ह्रस्व और दीर्घ उ अलग-अलग लिखे जाते हैं, पर बोले एक जैसे जाते हैं। किस शब्द में कौन-सा आएगा, यह सिर्फ़ वर्तनी की बात है, और ग़लतियों की एक बड़ी वजह।"
  - id: gu-fact-013
    tags: [pronunciation]
    source: "https://en.wikipedia.org/wiki/Gujarati_phonology"
    text:
      en: "Gujarati has two e sounds and two o sounds, a closed one and an open one: e as in 'café' and as in 'bed', o as in 'go' and as in 'law'. The script usually doesn't show which."
      bn: "গুজরাটিতে দুই রকম এ আর দুই রকম ও আছে, একটি সংবৃত, একটি বিবৃত। লিপিতে সাধারণত বোঝা যায় না কোনটি।"
      hi: "गुजराती में दो तरह के ए और दो तरह के ओ हैं: एक बंद, एक खुला। लिपि में आमतौर पर यह नहीं दिखता कि कौन-सा है।"
  - id: gu-fact-014
    tags: [pronunciation]
    source: "https://en.wikipedia.org/wiki/Gujarati_phonology"
    text:
      en: "Gujarati has breathy vowels. An h between vowels is often not said as an h but makes the vowel breathy: બહેન (sister) sounds close to 'ben', and is often written બેન."
      bn: "গুজরাটিতে শ্বাসমিশ্র স্বরধ্বনি আছে। দুই স্বরের মাঝের হ প্রায়ই আলাদা করে উচ্চারিত হয় না, বরং স্বরটিকে শ্বাসমিশ্র করে দেয়: બહેન (বোন) শোনায় প্রায় 'বেন', আর প্রায়ই লেখা হয় બેન।"
      hi: "गुजराती में साँस-मिले स्वर होते हैं। दो स्वरों के बीच का ह अक्सर अलग से नहीं बोला जाता, बल्कि स्वर को साँसदार बना देता है: બહેન (बहन) लगभग 'बेन' सुनाई देता है, और अक्सर બેન लिखा जाता है।"
  - id: gu-fact-015
    tags: [grammar]
    text:
      en: "Gujarati has three genders: masculine, feminine and neuter. Adjectives in -o show all three: સારો છોકરો (a good boy), સારી છોકરી (a good girl), સારું બાળક (a good child)."
      bn: "গুজরাটিতে তিনটি লিঙ্গ: পুংলিঙ্গ, স্ত্রীলিঙ্গ ও ক্লীবলিঙ্গ। -ও-তে শেষ হওয়া বিশেষণ তিনটিই দেখায়: સારો છોકરો (ভালো ছেলে), સારી છોકરી (ভালো মেয়ে), સારું બાળક (ভালো শিশু)।"
      hi: "गुजराती में तीन लिंग हैं: पुल्लिंग, स्त्रीलिंग और नपुंसकलिंग। -ओ वाले विशेषण तीनों दिखाते हैं: સારો છોકરો (अच्छा लड़का), સારી છોકરી (अच्छी लड़की), સારું બાળક (अच्छा बच्चा)।"
  - id: gu-fact-016
    tags: [grammar, history]
    text:
      en: "Hindi lost the neuter gender of Sanskrit; Gujarati, like Marathi, kept it. A child, બાળક, is neuter whether a boy or a girl."
      bn: "হিন্দি সংস্কৃতের ক্লীবলিঙ্গ হারিয়েছে; গুজরাটি, মারাঠির মতো, তা রেখে দিয়েছে। শিশু, બાળક, ছেলে হোক বা মেয়ে, ক্লীবলিঙ্গ।"
      hi: "हिंदी ने संस्कृत का नपुंसकलिंग खो दिया; गुजराती ने, मराठी की तरह, उसे बचाए रखा। बच्चा, બાળક, लड़का हो या लड़की, नपुंसकलिंग है।"
  - id: gu-fact-017
    tags: [grammar]
    text:
      en: "Gujarati has two words for 'we': આપણે (āpṇe) takes in the person you are talking to, and અમે (ame) leaves them out."
      bn: "গুজরাটিতে 'আমরা'-র দুটি শব্দ: આપણે (আপণে) যার সঙ্গে কথা বলছেন তাকেও ধরে, আর અમે (অমে) তাকে বাদ দেয়।"
      hi: "गुजराती में 'हम' के दो शब्द हैं: આપણે (आपणे) में सुनने वाला भी शामिल है, और અમે (अमे) में वह शामिल नहीं।"
  - id: gu-fact-018
    tags: [grammar]
    text:
      en: "The verb comes last in a Gujarati sentence, as in Hindi and Bengali: હું ચા પીઉં છું, word for word 'I tea drink am', is 'I drink tea'."
      bn: "গুজরাটি বাক্যে ক্রিয়া আসে শেষে, হিন্দি ও বাংলার মতোই: હું ચા પીઉં છું মানে 'আমি চা খাই'।"
      hi: "गुजराती वाक्य में क्रिया अंत में आती है, हिंदी और बांग्ला की तरह: હું ચા પીઉં છું का अर्थ है 'मैं चाय पीता हूँ'।"
  - id: gu-fact-019
    tags: [grammar]
    text:
      en: "In the past, a Gujarati verb with an object agrees with the object, not the doer, and the doer takes -એ: in મેં રોટલી ખાધી, 'I ate a chapati', the verb is ખાધી because રોટલી is feminine."
      bn: "অতীত কালে কর্মযুক্ত গুজরাটি ক্রিয়া কর্তার সঙ্গে নয়, কর্মের সঙ্গে মেলে, আর কর্তা পায় -એ: મેં રોટલી ખાધી, 'আমি রুটি খেলাম', বাক্যে ক্রিয়া ખાધી, কারণ રોટલી স্ত্রীলিঙ্গ।"
      hi: "भूतकाल में कर्म वाली गुजराती क्रिया कर्ता से नहीं, कर्म से मेल खाती है, और कर्ता के साथ -એ लगता है, जैसे हिंदी में 'ने': મેં રોટલી ખાધી, 'मैंने रोटी खाई', में क्रिया ખાધી है, क्योंकि રોટલી स्त्रीलिंग है।"
  - id: gu-fact-020
    tags: [grammar, script]
    text:
      en: "Gujarati writes its case endings joined to the noun: ઘરમાં (gharmām̐, in the house), ઘરનું (gharnum̐, of the house), where Hindi writes घर में and घर का apart."
      bn: "গুজরাটিতে বিভক্তি বিশেষ্যের সঙ্গে জুড়ে লেখা হয়: ઘરમાં (ঘরমাঁ, ঘরে), ઘરનું (ঘরনুঁ, ঘরের), যেখানে হিন্দিতে घर में আর घर का আলাদা লেখা হয়।"
      hi: "गुजराती में परसर्ग संज्ञा से जोड़कर लिखे जाते हैं: ઘરમાં (घरमाँ, घर में), ઘરનું (घरनुँ, घर का), जबकि हिंदी में घर में और घर का अलग लिखे जाते हैं।"
  - id: gu-fact-021
    tags: [grammar]
    text:
      en: "The Gujarati 'of' changes with the thing owned, in three genders: મારો ભાઈ (my brother), મારી બહેન (my sister), મારું ઘર (my house)."
      bn: "গুজরাটিতে সম্বন্ধপদ বদলায় অধিকৃত বস্তুর লিঙ্গ অনুযায়ী, তিন লিঙ্গে: મારો ભાઈ (আমার ভাই), મારી બહેન (আমার বোন), મારું ઘર (আমার বাড়ি)।"
      hi: "गुजराती में 'का' जिस चीज़ का है उसके हिसाब से बदलता है, तीन लिंगों में: મારો ભાઈ (मेरा भाई), મારી બહેન (मेरी बहन), મારું ઘર (मेरा घर)।"
  - id: gu-fact-022
    tags: [grammar]
    text:
      en: "Respect is built into the verb: an elder is spoken of in the plural. A father takes -આ, બાપુજી આવ્યા, and a mother -આં, બા આવ્યાં, both meaning '(he, she) has come'."
      bn: "সম্মান ক্রিয়াতেই গাঁথা: গুরুজনের কথা বহুবচনে বলা হয়। বাবার জন্য -આ, બાપુજી આવ્યા, আর মায়ের জন্য -આં, બા આવ્યાં, দুটোরই মানে '(তিনি) এসেছেন'।"
      hi: "सम्मान क्रिया में ही बसा है: बड़ों के बारे में बहुवचन में बात होती है। पिता के लिए -આ, બાપુજી આવ્યા, और माँ के लिए -આં, બા આવ્યાં, दोनों का अर्थ '(वे) आए हैं'।"
  - id: gu-fact-023
    tags: [words, numbers]
    text:
      en: "Every number up to 100 has its own word in Gujarati, and many show their parts. 19, 29, 39, 49 and 59 begin with ઓગણ-, 'one less': ઓગણીસ (ogaṇis, 19) is one less than વીસ (vis, 20)."
      bn: "গুজরাটিতে ১০০ পর্যন্ত প্রতিটি সংখ্যার নিজস্ব শব্দ আছে, আর অনেকগুলোতে তাদের অংশ দেখা যায়। ১৯, ২৯, ৩৯, ৪৯ আর ৫৯ শুরু হয় ઓગણ- দিয়ে, মানে 'এক কম': ઓગણીસ (ওগণীস, ১৯) হলো વીસ (বীস, ২০)-এর চেয়ে এক কম, বাংলার 'ঊনিশ'-এর মতো।"
      hi: "गुजराती में 100 तक हर संख्या का अपना शब्द है, और कई में उनके हिस्से दिखते हैं। 19, 29, 39, 49 और 59 ઓગણ- से शुरू होते हैं, यानी 'एक कम': ઓગણીસ (ओगणीस, 19) વીસ (वीस, 20) से एक कम है, जैसे हिंदी 'उन्नीस'।"
  - id: gu-fact-024
    tags: [words, numbers]
    text:
      en: "Gujarati has everyday words for fractions: દોઢ (doḍh) is one and a half, અઢી (aḍhi) two and a half, and દોઢસો (doḍhso) 150. સાડા, સવા and પોણા add a half, add a quarter, and take a quarter away."
      bn: "গুজরাটিতে ভগ্নাংশের রোজকার শব্দ আছে: દોઢ (দোঢ়) দেড়, અઢી (অঢ়ী) আড়াই, আর દોઢસો (দোঢ়সো) দেড়শো। સાડા, સવા আর પોણા মানে সাড়ে, সওয়া আর পৌনে।"
      hi: "गुजराती में भिन्नों के रोज़मर्रा के शब्द हैं: દોઢ (दोढ) डेढ़, અઢી (अढी) ढाई, और દોઢસો (दोढसो) डेढ़ सौ। સાડા, સવા और પોણા का अर्थ साढ़े, सवा और पौने है।"
  - id: gu-fact-025
    tags: [words]
    text:
      en: "'Yesterday' and 'tomorrow' are the same word in Gujarati, કાલે (kāle), as they are in Hindi. The tense of the verb tells you which."
      bn: "গুজরাটিতে 'গতকাল' আর 'আগামীকাল' একই শব্দ, કાલે (কালে), হিন্দির 'কল'-এর মতো। ক্রিয়ার কালই বলে দেয় কোনটি।"
      hi: "गुजराती में बीता कल और आने वाला कल एक ही शब्द है, કાલે (काले), जैसे हिंदी में 'कल'। क्रिया का काल बताता है कि कौन-सा।"
  - id: gu-fact-026
    tags: [words]
    text:
      en: "Gujarati says goodbye with આવજો (āvjo), literally 'do come': the one staying hopes to see the one leaving again."
      bn: "গুজরাটিতে বিদায় জানানো হয় આવજો (আবজো) বলে, যার আক্ষরিক মানে 'আসবেন': যে থাকছে, সে চলে যাওয়া মানুষটিকে আবার দেখার আশা রাখে।"
      hi: "गुजराती में विदा लेते समय આવજો (आवजो) कहा जाता है, जिसका शाब्दिक अर्थ है 'आइएगा': रुकने वाला जाने वाले से फिर मिलने की आशा करता है।"
  - id: gu-fact-027
    tags: [words, history]
    source: "https://en.wikipedia.org/wiki/Portuguese_India"
    text:
      en: "Gujarati's word for potato, બટાકા or બટેટા (bataka, bateta), comes from Portuguese batata, and ચાવી (cāvi, key) from Portuguese chave. Portugal held Diu and Daman on Gujarat's coast for over four centuries."
      bn: "গুজরাটিতে আলুর শব্দ બટાકા বা બટેટા (বটাকা, বটেটা) এসেছে পর্তুগিজ batata থেকে, আর ચાવી (চাবী, চাবি) পর্তুগিজ chave থেকে। গুজরাটের উপকূলে দিউ ও দমন চার শতাব্দীরও বেশি পর্তুগালের অধীনে ছিল।"
      hi: "गुजराती में आलू के लिए शब्द બટાકા या બટેટા (बटाका, बटेटा) पुर्तगाली batata से आया है, और ચાવી (चावी, चाबी) पुर्तगाली chave से। गुजरात के तट पर दीव और दमन चार सदियों से ज़्यादा पुर्तगाल के अधीन रहे।"
  - id: gu-fact-028
    tags: [words, history]
    text:
      en: "Many everyday Gujarati words came from Persian and Arabic through centuries of trade and rule: દુકાન (dukān, shop), હિસાબ (hisāb, account), ખબર (khabar, news) and કાગળ (kāgaḷ, paper)."
      bn: "বহু শতাব্দীর বাণিজ্য ও শাসনের পথে অনেক রোজকার গুজরাটি শব্দ এসেছে ফারসি ও আরবি থেকে: દુકાન (দুকান, দোকান), હિસાબ (হিসাব), ખબર (খবর) আর કાગળ (কাগল, কাগজ)।"
      hi: "सदियों के व्यापार और शासन से कई रोज़मर्रा के गुजराती शब्द फ़ारसी और अरबी से आए: દુકાન (दुकान), હિસાબ (हिसाब), ખબર (ख़बर) और કાગળ (कागळ, काग़ज़)।"
  - id: gu-fact-029
    tags: [history, literature]
    source: "https://en.wikipedia.org/wiki/Narsinh_Mehta"
    text:
      en: "Narsinh Mehta, a 15th-century poet-saint, is called the first poet (આદિ કવિ, adi kavi) of Gujarati. His hymn વૈષ્ણવ જન તો (Vaishnav jan to) was one of Gandhi's favourites."
      bn: "পঞ্চদশ শতকের কবি-সাধক নরসিংহ মেহতাকে গুজরাটির আদি কবি (આદિ કવિ) বলা হয়। তাঁর ভজন વૈષ્ણવ જન તો (বৈষ্ণব জন তো) গান্ধীজির খুব প্রিয় ছিল।"
      hi: "पंद्रहवीं सदी के संत-कवि नरसिंह मेहता को गुजराती का आदि कवि (આદિ કવિ) कहा जाता है। उनका भजन વૈષ્ણવ જન તો (वैष्णव जन तो) गांधीजी को बहुत प्रिय था।"
  - id: gu-fact-030
    tags: [history, literature]
    source: "https://en.wikipedia.org/wiki/The_Story_of_My_Experiments_with_Truth"
    text:
      en: "Mahatma Gandhi's mother tongue was Gujarati. He wrote his autobiography, The Story of My Experiments with Truth, in Gujarati, in weekly parts in his journal Navajivan from 1925."
      bn: "মহাত্মা গান্ধীর মাতৃভাষা ছিল গুজরাটি। তাঁর আত্মজীবনী 'সত্যের সঙ্গে আমার প্রয়োগ' তিনি গুজরাটিতে লিখেছিলেন, ১৯২৫ থেকে নিজের পত্রিকা 'নবজীবন'-এ সাপ্তাহিক কিস্তিতে।"
      hi: "महात्मा गांधी की मातृभाषा गुजराती थी। उन्होंने अपनी आत्मकथा 'सत्य के प्रयोग' गुजराती में लिखी, 1925 से अपनी पत्रिका 'नवजीवन' में साप्ताहिक किस्तों में।"
  - id: gu-fact-031
    tags: [history, literature]
    source: "https://en.wikipedia.org/wiki/Karan_Ghelo"
    text:
      en: "The first Gujarati novel, કરણ ઘેલો (Karan Ghelo) by Nandshankar Mehta, came out in 1866. It tells the story of the last Rajput king of Gujarat."
      bn: "প্রথম গুজরাটি উপন্যাস, নন্দশংকর মেহতার કરણ ઘેલો (করণ ঘেলো), প্রকাশিত হয় ১৮৬৬ সালে। এটি গুজরাটের শেষ রাজপুত রাজার কাহিনি।"
      hi: "पहला गुजराती उपन्यास, नंदशंकर मेहता का કરણ ઘેલો (करण घेलो), 1866 में छपा। यह गुजरात के अंतिम राजपूत राजा की कहानी है।"
  - id: gu-fact-032
    tags: [history, script]
    source: "https://en.wikipedia.org/wiki/Gujarat_Vidyapith"
    text:
      en: "Gujarati spelling follows the Sarth Gujarati Jodnikosh, a dictionary published by Gujarat Vidyapith, the university Gandhi founded in Ahmedabad in 1920."
      bn: "গুজরাটি বানান মেনে চলে 'সার্থ গুজরাটি জোডণীকোশ', যে অভিধান প্রকাশ করে গুজরাট বিদ্যাপীঠ, ১৯২০ সালে আহমেদাবাদে গান্ধীজির প্রতিষ্ঠিত বিশ্ববিদ্যালয়।"
      hi: "गुजराती वर्तनी 'सार्थ गुजराती जोडणीकोश' के अनुसार चलती है, जिसे गुजरात विद्यापीठ प्रकाशित करता है, वह विश्वविद्यालय जिसे गांधीजी ने 1920 में अहमदाबाद में स्थापित किया।"
  - id: gu-fact-033
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Parsis"
    text:
      en: "The Parsis, Zoroastrians who settled in Gujarat more than a thousand years ago, took up Gujarati as their own language, and Parsi Gujarati has a flavour of its own."
      bn: "পারসিরা, অর্থাৎ হাজার বছরেরও আগে গুজরাটে বসতি গড়া জরথুস্ত্রীয়রা, গুজরাটিকে নিজেদের ভাষা করে নিয়েছিলেন, আর পারসি গুজরাটির নিজস্ব স্বাদ আছে।"
      hi: "पारसियों ने, यानी हज़ार साल से भी पहले गुजरात में बसे ज़रथुश्त्रियों ने, गुजराती को अपनी भाषा बना लिया, और पारसी गुजराती का अपना अलग रंग है।"
  - id: gu-fact-034
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Gujarati_diaspora"
    text:
      en: "Gujarati travelled with its traders: large communities speak it in East Africa, Britain and North America."
      bn: "গুজরাটি ভাষা তার বণিকদের সঙ্গে দেশে দেশে গেছে: পূর্ব আফ্রিকা, ব্রিটেন ও উত্তর আমেরিকায় বড় বড় গুজরাটিভাষী সম্প্রদায় আছে।"
      hi: "गुजराती अपने व्यापारियों के साथ दूर-दूर तक गई: पूर्वी अफ़्रीका, ब्रिटेन और उत्तरी अमेरिका में बड़े गुजराती-भाषी समुदाय हैं।"
  - id: gu-fact-035
    tags: [history, script]
    source: "https://en.wikipedia.org/wiki/Kutchi_language"
    text:
      en: "Kutchi, spoken in the Kutch district of Gujarat, is closer to Sindhi than to Gujarati, but it is usually written in Gujarati script."
      bn: "গুজরাটের কচ্ছ জেলায় বলা কচ্ছি ভাষা গুজরাটির চেয়ে সিন্ধির বেশি কাছাকাছি, কিন্তু সাধারণত গুজরাটি লিপিতেই লেখা হয়।"
      hi: "गुजरात के कच्छ ज़िले में बोली जाने वाली कच्छी गुजराती से ज़्यादा सिंधी के क़रीब है, लेकिन आमतौर पर गुजराती लिपि में ही लिखी जाती है।"
  - id: gu-fact-036
    tags: [words, history]
    text:
      en: "The Gujarati new year, બેસતું વર્ષ (bestum̐ varś), begins the day after Diwali, on the first day of the month કારતક (kārtak) in the Vikram Samvat calendar."
      bn: "গুজরাটি নববর্ষ, બેસતું વર્ષ (বেসতুঁ বর্ষ), শুরু হয় দীপাবলির পরের দিন, বিক্রম সংবৎ পঞ্জিকার કારતક (কারতক) মাসের প্রথম দিনে।"
      hi: "गुजराती नववर्ष, બેસતું વર્ષ (बेसतुं वर्ष), दिवाली के अगले दिन, विक्रम संवत् पंचांग के કારતક (कारतक) महीने के पहले दिन शुरू होता है।"
  - id: gu-fact-037
    tags: [script, numbers]
    text:
      en: "Gujarati has its own digits, ૦ to ૯, still seen in schoolbooks, calendars and some newspapers."
      bn: "গুজরাটির নিজস্ব অঙ্ক আছে, ૦ থেকে ૯, যা আজও পাঠ্যবই, পঞ্জিকা আর কিছু সংবাদপত্রে দেখা যায়।"
      hi: "गुजराती के अपने अंक हैं, ૦ से ૯, जो आज भी पाठ्यपुस्तकों, पंचांगों और कुछ अख़बारों में दिखते हैं।"
  - id: gu-fact-038
    tags: [literature]
    source: "https://en.wikipedia.org/wiki/Jnanpith_Award"
    text:
      en: "Four Gujarati writers have won the Jnanpith, India's highest literary award: Umashankar Joshi (1967), Pannalal Patel (1985), Rajendra Shah (2001) and Raghuveer Chaudhari (2015)."
      bn: "চারজন গুজরাটি লেখক ভারতের সর্বোচ্চ সাহিত্য সম্মান জ্ঞানপীঠ পেয়েছেন: উমাশংকর জোশী (১৯৬৭), পান্নালাল প্যাটেল (১৯৮৫), রাজেন্দ্র শাহ (২০০১) ও রঘুবীর চৌধুরী (২০১৫)।"
      hi: "चार गुजराती लेखकों को भारत का सर्वोच्च साहित्य सम्मान ज्ञानपीठ मिला है: उमाशंकर जोशी (1967), पन्नालाल पटेल (1985), राजेंद्र शाह (2001) और रघुवीर चौधरी (2015)।"
