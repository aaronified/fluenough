schema: 1
id: gu-en-grammar-needs
name: "Need, want and have"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "To me water is needed; to me is to go; near me is money: how Gujarati says need, want and have. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: gu-0410
    target: "મને પાણી જોઈએ છે."
    native: "I need water."
    reading: "mane pāṇi joie che."
    ipa: "məne paɳi dʒoie tʃʰe"
    pos: "phrase"
    notes: "Literally 'to me water is needed'. જોઈએ (joie) never changes; the one who needs takes -ને (-ne)."
  - id: gu-0411
    target: "તમારે શું જોઈએ?"
    native: "What would you like?"
    reading: "tamāre śum̐ joie?"
    ipa: "t̪əmare ʃũ dʒoie"
    pos: "phrase"
    notes: "A shopkeeper's question. તમારે (tamāre) and તમને (tamne) are both heard here."
  - id: gu-0412
    target: "મને મદદ જોઈએ છે."
    native: "I need help."
    reading: "mane madad joie che."
    ipa: "məne məd̪əd̪ dʒoie tʃʰe"
    pos: "phrase"
  - id: gu-0413
    target: "મને કંઈ નથી જોઈતું."
    native: "I don't need anything."
    reading: "mane kaim̐ nathi joitum̐."
    ipa: "məne kə̃i nət̪ʰi dʒoit̪ũ"
    pos: "phrase"
    notes: "With નથી (nathi), જોઈએ (joie) becomes જોઈતું (joitum̐), and it agrees: મને ચા નથી જોઈતી (mane cā nathi joiti), I don't want tea."
  - id: gu-0414
    target: "મારે ઘરે જવું છે."
    native: "I want to go home."
    reading: "māre ghare javum̐ che."
    ipa: "mare ɡʱəre dʒəʋũ tʃʰe"
    pos: "phrase"
    notes: "મારે (māre) with a verb in -વું (-vum̐) and છે (che): 'to me is to go'. It means 'want to' or 'have to'."
  - id: gu-0415
    target: "મારે ટિકિટ લેવી છે."
    native: "I want to buy a ticket."
    reading: "māre ṭikiṭ levi che."
    ipa: "mare ʈikiʈ leʋi tʃʰe"
    pos: "phrase"
    notes: "The verb agrees with the thing: ટિકિટ (ṭikiṭ) is feminine, so લેવી (levi), not લેવું (levum̐)."
  - id: gu-0416
    target: "મારે ચા પીવી છે."
    native: "I'd like to drink tea."
    reading: "māre cā pivi che."
    ipa: "mare tʃa piʋi tʃʰe"
    pos: "phrase"
    notes: "ચા (cā) is feminine, so પીવી (pivi)."
  - id: gu-0417
    target: "મારી પાસે સમય નથી."
    native: "I don't have time."
    reading: "māri pāse samay nathi."
    ipa: "mari pase səməj nət̪ʰi"
    pos: "phrase"
    notes: "Literally 'near me time is not'."
  - id: gu-0418
    target: "મારી પાસે પૈસા નથી."
    native: "I have no money."
    reading: "māri pāse paisā nathi."
    ipa: "mari pase pəisa nət̪ʰi"
    pos: "phrase"
  - id: gu-0419
    target: "તમારી પાસે છૂટા છે?"
    native: "Do you have change?"
    reading: "tamāri pāse chuṭā che?"
    ipa: "t̪əmari pase tʃʰuʈa tʃʰe"
    pos: "phrase"
  - id: gu-0420
    target: "બસ, બીજું કંઈ નહીં."
    native: "That's all, nothing else."
    reading: "bas, bijum̐ kaim̐ nahim̐."
    ipa: "bəs bidʒũ kə̃i nəɦĩ"
    pos: "phrase"
