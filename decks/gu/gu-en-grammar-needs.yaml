schema: 1
id: gu-en-grammar-needs
name: "Need, want and have"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "To me water is needed; to me is to go; near me is money: how Gujarati says need, want and have. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: gu-0410
    target: "મને પાણી જોઈએ છે."
    native: "I need water."
    reading: "mane paanii joiie chhe."
    pos: "phrase"
    notes: "Literally 'to me water is needed'. જોઈએ (joiie) never changes; the one who needs takes -ને."
  - id: gu-0411
    target: "તમારે શું જોઈએ?"
    native: "What would you like?"
    reading: "tamaare shun joiie?"
    pos: "phrase"
    notes: "A shopkeeper's question. તમારે and તમને are both heard here."
  - id: gu-0412
    target: "મને મદદ જોઈએ છે."
    native: "I need help."
    reading: "mane madad joiie chhe."
    pos: "phrase"
  - id: gu-0413
    target: "મને કંઈ નથી જોઈતું."
    native: "I don't need anything."
    reading: "mane kain nathii joiitun."
    pos: "phrase"
    notes: "With નથી, જોઈએ becomes જોઈતું, and it agrees: મને ચા નથી જોઈતી, I don't want tea."
  - id: gu-0414
    target: "મારે ઘરે જવું છે."
    native: "I want to go home."
    reading: "maare ghare javun chhe."
    pos: "phrase"
    notes: "મારે (maare) with a verb in -વું and છે: 'to me is to go'. It means 'want to' or 'have to'."
  - id: gu-0415
    target: "મારે ટિકિટ લેવી છે."
    native: "I want to buy a ticket."
    reading: "maare tikit levii chhe."
    pos: "phrase"
    notes: "The verb agrees with the thing: ટિકિટ is feminine, so લેવી, not લેવું."
  - id: gu-0416
    target: "મારે ચા પીવી છે."
    native: "I'd like to drink tea."
    reading: "maare chaa piivii chhe."
    pos: "phrase"
    notes: "ચા is feminine, so પીવી."
  - id: gu-0417
    target: "મારી પાસે સમય નથી."
    native: "I don't have time."
    reading: "maarii paase samay nathii."
    pos: "phrase"
    notes: "Literally 'near me time is not'."
  - id: gu-0418
    target: "મારી પાસે પૈસા નથી."
    native: "I have no money."
    reading: "maarii paase paisaa nathii."
    pos: "phrase"
  - id: gu-0419
    target: "તમારી પાસે છૂટા છે?"
    native: "Do you have change?"
    reading: "tamaarii paase chhuutaa chhe?"
    pos: "phrase"
  - id: gu-0420
    target: "બસ, બીજું કંઈ નહીં."
    native: "That's all, nothing else."
    reading: "bas, biijun kain nahiin."
    pos: "phrase"
