schema: 1
id: gu-en-grammar-conjunctions
name: "And, but, because, if"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The small words that join one idea to the next, and the pairs જો … તો (if … then) and જ્યારે … ત્યારે (when … then). Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: gu-0579
    target: "અને"
    native: "and"
    reading: "ane"
    ipa: "əne"
    pos: "other"
    notes: "મીના અને રમેશ, Meena and Ramesh."
  - ref: gu-0055
    notes: "Between two clauses, 'but': હું આવીશ, પણ મોડો, I'll come, but late. After a word, 'also; even'."
  - id: gu-0580
    target: "કે"
    native: "or; that"
    reading: "ke"
    ipa: "ke"
    pos: "other"
    notes: "ચા કે કૉફી? tea or coffee? It also joins 'that': મને લાગે છે કે..., I think that..."
  - id: gu-0581
    target: "અથવા"
    native: "or (formal)"
    reading: "athvā"
    ipa: "ət̪ʰʋa"
    pos: "other"
    notes: "On forms and in writing; in speech, કે."
  - id: gu-0582
    target: "કારણ કે"
    native: "because"
    reading: "kāraṇ ke"
    ipa: "karəɳ ke"
    pos: "phrase"
    notes: "Literally 'the reason that'."
  - id: gu-0583
    target: "એટલે"
    native: "so; that's why"
    reading: "eṭle"
    ipa: "eʈle"
    pos: "other"
    notes: "It comes where English puts 'so': વરસાદ પડે છે, એટલે હું ઘરે છું, it's raining, so I'm at home."
  - id: gu-0584
    target: "જો"
    native: "if"
    reading: "jo"
    ipa: "dʒo"
    pos: "other"
    notes: "Usually paired with તો (to), 'then', in the second half. જો is also 'look!', from જોવું."
  - id: gu-0585
    target: "જો વરસાદ પડશે, તો હું નહીં આવું."
    native: "If it rains, I won't come."
    reading: "jo varsād paḍśe, to hum̐ nahim̐ āvum̐."
    ipa: "dʒo ʋərsad̪ pəɖʃe t̪o ɦũ nəɦĩ aʋũ"
    pos: "phrase"
    notes: "Gujarati puts the 'if' half in the future too: 'if rain will fall'."
  - id: gu-0586
    target: "જ્યારે હું આવીશ, ત્યારે વાત કરીશું."
    native: "When I come, we'll talk."
    reading: "jyāre hum̐ āviś, tyāre vāt kariśum̐."
    ipa: "dʒjare ɦũ aʋiʃ t̪jare ʋat̪ kəriʃũ"
    pos: "phrase"
    notes: "જ્યારે (jyāre), 'when', is answered by ત્યારે (tyāre), 'then'. The question 'when?' is ક્યારે."
  - id: gu-0587
    target: "નહીંતર"
    native: "otherwise; or else"
    reading: "nahintar"
    ipa: "nəɦint̪ər"
    pos: "other"
    notes: "જલદી ચાલો, નહીંતર બસ જતી રહેશે, hurry, or the bus will go."
  - id: gu-0588
    target: "તોપણ"
    native: "even so; still"
    reading: "topaṇ"
    ipa: "t̪opəɳ"
    pos: "other"
