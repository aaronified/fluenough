schema: 1
id: gu-en-grammar-postpositions
name: "In, on, from, with: after the noun"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Gujarati says 'house-in', 'table on', 'me-of with': short endings joined to the noun, and longer words after -ની (-ni) or -ના (-nā). Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - ref: gu-0241
    notes: "-માં (-man), 'in', is written joined to the noun."
  - id: gu-0433
    target: "ટેબલ પર"
    native: "on the table"
    reading: "ṭebal par"
    ipa: "ʈebəl pər"
    pos: "phrase"
    notes: "પર (par), 'on', is written apart. Also ઉપર (upar), 'on top of'."
  - ref: gu-0242
    notes: "-થી (-thi) is 'from', and also 'by' or 'with' a tool."
  - id: gu-0434
    target: "બસમાં"
    native: "on the bus"
    reading: "basmām̐"
    ipa: "bəsmã"
    pos: "other"
    notes: "Gujarati says 'in the bus', as it says 'in the train', ટ્રેનમાં (ṭrenmām̐)."
  - id: gu-0435
    target: "મારી સાથે"
    native: "with me"
    reading: "māri sāthe"
    ipa: "mari sat̪ʰe"
    pos: "phrase"
    notes: "સાથે (sāthe), 'with', comes after the -ની (-ni) form: મીનાની સાથે (mināni sāthe), with Meena. Often the -ની (-ni) is dropped: મીના સાથે (minā sāthe)."
  - id: gu-0436
    target: "તમારા માટે"
    native: "for you"
    reading: "tamārā māṭe"
    ipa: "t̪əmara maʈe"
    pos: "phrase"
    notes: "માટે (māṭe), 'for', comes after the -ના (-nā) form."
  - id: gu-0437
    target: "દુકાનની પાસે"
    native: "near the shop"
    reading: "dukānni pāse"
    ipa: "d̪ukanni pase"
    pos: "phrase"
    notes: "પાસે (pāse), 'near', after -ની (-ni)."
  - id: gu-0438
    target: "ઘરની પાછળ"
    native: "behind the house"
    reading: "gharni pāchaḷ"
    ipa: "ɡʱərni patʃʰəɭ"
    pos: "phrase"
  - id: gu-0439
    target: "ટેબલની નીચે"
    native: "under the table"
    reading: "ṭebalni nice"
    ipa: "ʈebəlni nitʃe"
    pos: "phrase"
  - id: gu-0440
    target: "મંદિરની સામે"
    native: "opposite the temple"
    reading: "mandirni sāme"
    ipa: "mənd̪irni same"
    pos: "phrase"
  - id: gu-0441
    target: "બપોર સુધી"
    native: "until noon"
    reading: "bapor sudhi"
    ipa: "bəpor sud̪ʱi"
    pos: "phrase"
    notes: "સુધી (sudhi), 'until; as far as': સ્ટેશન સુધી (sṭeśan sudhi), as far as the station."
  - id: gu-0442
    target: "મીનાનું ઘર"
    native: "Meena's house"
    reading: "minānum̐ ghar"
    ipa: "minanũ ɡʱər"
    pos: "phrase"
    notes: "-નું (-nun), 'of', agrees with the thing owned: મીનાનો ભાઈ (mināno bhāi), મીનાની ગાડી (mināni gāḍi), મીનાનું ઘર (minānum̐ ghar)."
