schema: 1
id: gu-en-grammar-postpositions
name: "In, on, from, with: after the noun"
kind: vocab
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Gujarati says 'house-in', 'table on', 'me-of with': short endings joined to the noun, and longer words after -ની or -ના. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - ref: gu-0241
    notes: "-માં (-maan), 'in', is written joined to the noun."
  - id: gu-0433
    target: "ટેબલ પર"
    native: "on the table"
    reading: "tebal par"
    pos: "phrase"
    notes: "પર (par), 'on', is written apart. Also ઉપર (upar), 'on top of'."
  - ref: gu-0242
    notes: "-થી (-thii) is 'from', and also 'by' or 'with' a tool."
  - id: gu-0434
    target: "બસમાં"
    native: "on the bus"
    reading: "basmaan"
    pos: "other"
    notes: "Gujarati says 'in the bus', as it says 'in the train', ટ્રેનમાં."
  - id: gu-0435
    target: "મારી સાથે"
    native: "with me"
    reading: "maarii saathe"
    pos: "phrase"
    notes: "સાથે (saathe), 'with', comes after the -ની form: મીનાની સાથે, with Meena. Often the -ની is dropped: મીના સાથે."
  - id: gu-0436
    target: "તમારા માટે"
    native: "for you"
    reading: "tamaaraa maate"
    pos: "phrase"
    notes: "માટે (maate), 'for', comes after the -ના form."
  - id: gu-0437
    target: "દુકાનની પાસે"
    native: "near the shop"
    reading: "dukaannii paase"
    pos: "phrase"
    notes: "પાસે (paase), 'near', after -ની."
  - id: gu-0438
    target: "ઘરની પાછળ"
    native: "behind the house"
    reading: "gharnii paachhal"
    pos: "phrase"
  - id: gu-0439
    target: "ટેબલની નીચે"
    native: "under the table"
    reading: "tebalnii niiche"
    pos: "phrase"
  - id: gu-0440
    target: "મંદિરની સામે"
    native: "opposite the temple"
    reading: "mandirnii saame"
    pos: "phrase"
  - id: gu-0441
    target: "બપોર સુધી"
    native: "until noon"
    reading: "bapor sudhii"
    pos: "phrase"
    notes: "સુધી (sudhii), 'until; as far as': સ્ટેશન સુધી, as far as the station."
  - id: gu-0442
    target: "મીનાનું ઘર"
    native: "Meena's house"
    reading: "miinaanun ghar"
    pos: "phrase"
    notes: "-નું (-nun), 'of', agrees with the thing owned: મીનાનો ભાઈ, મીનાની ગાડી, મીનાનું ઘર."
