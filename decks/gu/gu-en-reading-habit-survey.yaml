  "sentences":
  - "text": "મીના એક સર્વે ભરે છે."
    "reading": "minā ek sarve bhare che."
    "ipa": "mina ek sərʋe bʱəre tʃʰe"
  - "text": "પ્રશ્ન: તું કેટલી વાર બજાર જાય છે?"
    "reading": "praśn: tum̐ keṭli vār bajār jāy che?"
    "ipa": "prəʃn t̪ũ keʈli ʋar bədʒar dʒaj tʃʰe"
  - "text": "મીના કહે છે, “હું ઘણીવાર બજાર જાઉં છું.”"
    "reading": "minā kahe che, “hum̐ ghaṇivār bajār jāum chum.”"
    "ipa": "mina kəɦe tʃʰe ɦũ ɡʱəɳiʋar bədʒar dʒaum tʃʰum"
  - "text": "તે ક્યારેક ટેલિવિઝન જુએ છે."
    "reading": "te kyārek ṭelivijhan jue che."
    "ipa": "t̪e kjarek ʈeliʋidʒʱən dʒue tʃʰe"
