      "sentences": [
        {
          "text": "એપ ખોલો અને પાસવર્ડ લખો.",
          "reading": "ep kholo ane pāsvarḍ lakho.",
          "ipa": "ep kʰolo əne pasʋərɖ ləkʰo"
        },
        {
          "text": "સેટિંગ્સમાં જાઓ અને અપડેટ શોધો.",
          "reading": "seṭiṅgsmām̐ jāo ane apḍeṭ śodho.",
          "ipa": "seʈiŋɡsmã dʒao əne əpɖeʈ ʃod̪ʱo"
        },
        {
          "text": "અપડેટ થયું, હવે ફોન ફરીથી ચાલુ કરો.",
          "reading": "apḍeṭ thayum, have fon pharithi cālu karo.",
          "ipa": "əpɖeʈ t̪ʰəjum ɦəʋe fon pʰərit̪ʰi tʃalu kəro"
        },
        {
          "text": "જો સમસ્યા રહે, તો મદદ લો.",
          "reading": "jo samasyā rahe, to madad lo.",
          "ipa": "dʒo səməsja rəɦe t̪o məd̪əd̪ lo"
        }
      ],
      "questions": [
        {
