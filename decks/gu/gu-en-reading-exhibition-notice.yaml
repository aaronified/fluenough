          "text": "ચિત્રો, શિલ્પ અને ગેલેરીમાં ઘણી કલાકૃતિઓ છે.",
          "reading": "citro, śilp ane gelerimām ghaṇi kalākrutio che.",
          "ipa": "tʃit̪ro ʃilp əne ɡelerimam ɡʱəɳi kəlakrut̪io tʃʰe"
        },
        {
          "text": "કલાકારો સાથે વાત કરવાની તક મળશે.",
          "reading": "kalākāro sāthe vāt karvāni tak maḷaśe.",
          "ipa": "kəlakaro sat̪ʰe ʋat̪ kərʋani t̪ək məɭəʃe"
        },
        {
          "text": "પ્રવેશ મફત છે.",
          "reading": "praveś maphat che.",
