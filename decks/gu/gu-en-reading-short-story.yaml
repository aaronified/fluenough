          "text": "એક દિવસ છોકરો જંગલમાં ભટક્યો.",
          "reading": "ek divas chokro jaṅgalmām̐ bhaṭakyo.",
          "ipa": "ek d̪iʋəs tʃʰokro dʒəŋɡəlmã bʱəʈəkjo"
        },
        {
          "text": "અચાનક ઝાડ પાછળથી એક સાપ સરક્યો.",
          "reading": "acānak jhāḍ pāchḷthi ek sāp sarakyo.",
          "ipa": "ətʃanək dʒʱaɖ patʃʰɭt̪ʰi ek sap sərəkjo"
        },
        {
          "text": "છોકરો ડરથી ચોંક્યો અને ભાગ્યો.",
          "reading": "chokro ḍarthi coṅkyo ane bhāgyo.",
          "ipa": "tʃʰokro ɖərt̪ʰi tʃoŋkjo əne bʱaɡjo"
        },
        {
          "text": "પછી તે ગામમાં પાછો ગયો અને બધાને વાત કહી.",
          "reading": "pachi te gāmmām̐ pācho gayo ane badhāne vāt kahi.",
          "ipa": "pətʃʰi t̪e ɡammã patʃʰo ɡəjo əne bəd̪ʱane ʋat̪ kəɦi"
        }
