passages:
  - id: "gu-weather-message"
    title: "A message about the monsoon"
    theme: "weather"
    sentences:
      - text: "પ્રિય મિત્ર, અહીં ચોમાસું શરૂ થયું છે."
        reading: "priy mitra, ahim̐ comāsum̐ śaru thayum̐ che."
        ipa: "prij mit̪rə əɦĩ tʃomasũ ʃəru t̪ʰəjũ tʃʰe"
      - text: "રોજ બપોરે ભારે વરસાદ પડે છે."
        reading: "roj bapore bhāre varsād paḍe che."
        ipa: "rodʒ bəpore bʱare ʋərsad̪ pəɖe tʃʰe"
      - text: "સવારે તડકો હોય છે, પણ પછી વાદળ આવે છે."
        reading: "savāre taḍko hoy che, paṇ pachi vādaḷ āve che."
        ipa: "səʋare t̪əɖko ɦoj tʃʰe pəɳ pətʃʰi ʋad̪əɭ aʋe tʃʰe"
      - text: "રાત્રે ઠંડી પડે છે અને હવા સારી લાગે છે."
        reading: "rātre ṭhaṇḍi paḍe che ane havā sāri lāge che."
        ipa: "rat̪re ʈʰəɳɖi pəɖe tʃʰe əne ɦəʋa sari laɡe tʃʰe"
      - text: "કાલે ફરી વરસાદ આવશે."
        reading: "kāle phari varsād āvśe."
        ipa: "kale pʰəri ʋərsad̪ aʋʃe"
