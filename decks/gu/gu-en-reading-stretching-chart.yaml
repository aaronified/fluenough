  "title": "Morning stretches"
  "theme": "body"
  "sentences":
  - "text": "સવારે ઊઠીને હું થોડું ખેંચાણ કરું છું."
    "reading": "savāre uṭhine hum̐ thoḍum̐ kheñcāṇ karum̐ chum̐."
    "ipa": "səʋare uʈʰine ɦũ t̪ʰoɖũ kʰeɲtʃaɳ kərũ tʃʰũ"
  - "text": "પહેલાં હાથ ઊંચા કરો, પછી ધીમેથી નીચે લાવો."
    "reading": "pahelām̐ hāth uñcā karo, pachi dhimethi nice lāvo."
    "ipa": "pəɦelã ɦat̪ʰ uɲtʃa kəro pətʃʰi d̪ʱimet̪ʰi nitʃe laʋo"
  - "text": "ગરદન ધીમે ધીમે એક બાજુ ફેરવો, પછી બીજી બાજુ."
    "reading": "gardan dhime dhime ek bāju phervo, pachi biji bāju."
    "ipa": "ɡərd̪ən d̪ʱime d̪ʱime ek badʒu pʰerʋo pətʃʰi bidʒi badʒu"
  - "text": "પગના ઘૂંટણ સીધા રાખો અને શ્વાસ લો."
    "reading": "pagnā ghuṇṭaṇ sidhā rākho ane śvās lo."
    "ipa": "pəɡna ɡʱuɳʈəɳ sid̪ʱa rakʰo əne ʃʋas lo"
