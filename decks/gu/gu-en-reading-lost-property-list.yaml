  "sentences":
  - "text": "રેલવેના ખોવાયેલા સામાનની યાદી."
    "reading": "relvenā khovāyelā sāmānni yādi."
    "ipa": "relʋena kʰoʋajela samanni jad̪i"
  - "text": "એક થેલો, લાલ રંગનો, ચામડાનો."
    "reading": "ek thelo, lāl raṅgano, cāmḍāno."
    "ipa": "ek t̪ʰelo lal rəŋɡəno tʃamɖano"
  - "text": "એક છત્રી, કાળી, નવી."
    "reading": "ek chatri, kāḷi, navi."
    "ipa": "ek tʃʰət̪ri kaɭi nəʋi"
  - "text": "એક ચાવી અને એક ઘડિયાળ, બારણાની પાસે મળ્યાં."
    "reading": "ek cāvi ane ek ghaḍiyāḷ, bārṇāni pāse maḷyām̐."
    "ipa": "ek tʃaʋi əne ek ɡʱəɖijaɭ barɳani pase məɭjã"
