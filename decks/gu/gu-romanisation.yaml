# How Gujarati readings are written, and the spellings a learner may type
# for the same sound (#47). See "Romanisation" in docs/DECK-FORMAT.md. Not
# yet checked by a Gujarati speaker: please report any mistake.
schema: 1
kind: romanisation
id: gu-romanisation
language: gu
scheme: "Popular and unmarked, as Gujarati is texted: lowercase ASCII, no length marks, spelled as said with the dropped a left out; ch for ચ, chh for છ, j for જ, jh for ઝ, sh for શ and ષ, n for ણ, l for ળ, gn for જ્ઞ, ru for ઋ, v for વ, t and d for both rows, aspirates with h, and the dot as the n or m it is said as."
equivalents:
  - ["a", "aa"]
  - ["i", "ee", "ii"]
  - ["u", "oo", "uu"]
  - ["v", "w"]
  - ["gn", "gy", "gny"]
  - ["ph", "f"]
  - ["jh", "z"]
  - ["ksh", "x"]
