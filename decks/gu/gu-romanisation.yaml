# How Gujarati readings are written, and the spellings a learner may type
# for the same sound (#47). See "Romanisation" in docs/DECK-FORMAT.md. Not
# yet checked by a Gujarati speaker: please report any mistake.
schema: 1
kind: romanisation
id: gu-romanisation
language: gu
scheme: "ISO 15919 letters, spelled as said (ADR-0025): ā for આ; i and u for both the short and the long vowel, which Gujarati says alike; e, o, ai and au; ṭ ṭh ḍ ḍh ṇ for the retroflex row and t th d dh n for the row on the teeth; c for ચ and ch for છ; ś for શ and ષ, said alike; ḷ for ળ; ru for ઋ; ê and ô for ઍ and ઑ. The inherent a is left out where it is not said. The anusvara is written as the nasal said (pandar), or ṁ before y, r, l, v, a sibilant or h, and a nasal vowel ends in m̐ (hum̐, chum̐). જ્ઞ is gn and ક્ષ kś, as said. A typed answer needs none of the marks."
standard: "ISO 15919"
# How a reading's letters are typed, read from the left, longest first:
# each reading is spelled so before an answer is compared with it.
typed:
  - ["ṅkh", "nkh"]
  - ["ṅgh", "ngh"]
  - ["ṅk", "nk"]
  - ["ṅg", "ng"]
  - ["ṅ", "ng"]
  - ["ñch", "nchh"]
  - ["ñc", "nch"]
  - ["ñjh", "njh"]
  - ["ñj", "nj"]
  - ["ñ", "ny"]
  - ["cch", "chchh"]
  - ["cc", "chch"]
  - ["ch", "chh"]
  - ["c", "ch"]
  - ["ś", "sh"]
  - ["ṣ", "sh"]
  - ["m̐", "n"]
  - ["ṁ", "n"]
  - ["ḵ", "kh"]
equivalents:
  - ["a", "aa"]
  - ["i", "ee", "ii"]
  - ["u", "oo", "uu"]
  - ["v", "w"]
  - ["gn", "gy", "gny"]
  - ["ph", "f"]
  - ["jh", "z"]
  - ["ksh", "x"]
