  "title": "A notice for a neighbourhood clean-up"
  "theme": "environment"
  "sentences":
  - "text": "આવતા રવિવારે સવારે આપણે બગીચો સાફ કરીશું."
    "reading": "āvtā ravivāre savāre āpṇe bagico sāph kariśum̐."
    "ipa": "aʋt̪a rəʋiʋare səʋare apɳe bəɡitʃo sapʰ kəriʃũ"
  - "text": "બધા લોકો કચરો ઉપાડો."
    "reading": "badhā loko kacro upāḍo."
    "ipa": "bəd̪ʱa loko kətʃro upaɖo"
  - "text": "થેલી અને પાણી લાવજો."
    "reading": "theli ane pāṇi lāvjo."
    "ipa": "t̪ʰeli əne paɳi laʋdʒo"
  - "text": "બોટલ અને કાગળ અલગ રાખો."
    "reading": "boṭal ane kāgaḷ alag rākho."
    "ipa": "boʈəl əne kaɡəɭ ələɡ rakʰo"
  - "text": "પર્યાવરણ માટે બધાએ મદદ કરો."
    "reading": "paryāvraṇ māṭe badhāe madad karo."
    "ipa": "pərjaʋrəɳ maʈe bəd̪ʱae məd̪əd̪ kəro"
