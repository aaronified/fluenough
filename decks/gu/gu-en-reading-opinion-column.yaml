      "theme": "abstract-words",
      "sentences": [
        {
          "text": "મારા મતે સાચી ખુશી પૈસામાં નથી, પણ સંતોષમાં છે.",
          "reading": "mārā mate sāci khuśi paisāmām̐ nathi, paṇ santośmām̐ che.",
          "ipa": "mara mət̪e satʃi kʰuʃi pəisamã nət̪ʰi pəɳ sənt̪oʃmã tʃʰe"
        },
        {
          "text": "ન્યાય વિના શાંતિ શક્ય નથી.",
          "reading": "nyāy vinā śānti śakya nathi.",
          "ipa": "njaj ʋina ʃant̪i ʃəkjə nət̪ʰi"
        },
        {
          "text": "આપણે સત્ય બોલવાની હિંમત રાખવી જોઈએ.",
          "reading": "āpṇe satya bolvāni himmat rākhvi joie.",
          "ipa": "apɳe sət̪jə bolʋani ɦimmət̪ rakʰʋi dʒoie"
        },
        {
          "text": "ભૂલ થાય તો માફી માગો અને ભવિષ્યમાં સુધારો.",
          "reading": "bhul thāy to māphi māgo ane bhaviśyamām̐ sudhāro.",
          "ipa": "bʱul t̪ʰaj t̪o mapʰi maɡo əne bʱəʋiʃjəmã sud̪ʱaro"
        }
      ],
