- "id": "gu-readers-letters"
  "title": "Two short letters to a newspaper"
  "theme": "opinions"
  "sentences":
  - "text": "મારો મત છે કે શાળામાં નવી લાઈબ્રેરી જોઈએ."
    "reading": "māro mat che ke śāḷāmām̐ navi lāibreri joie."
    "ipa": "maro mət̪ tʃʰe ke ʃaɭamã nəʋi laibreri dʒoie"
  - "text": "હું આ વિચાર સાથે સંમત નથી."
    "reading": "hum̐ ā vicār sāthe sammat nathi."
    "ipa": "ɦũ a ʋitʃar sat̪ʰe səmmət̪ nət̪ʰi"
  - "text": "આ બાબતે તમારી દલીલ ખોટી છે."
    "reading": "ā bābate tamāri dalil khoṭi che."
    "ipa": "a babət̪e t̪əmari d̪əlil kʰoʈi tʃʰe"
  - "text": "ચર્ચા કરીએ, પણ ટીકા ન કરો."
    "reading": "carcā karie, paṇ ṭikā na karo."
    "ipa": "tʃərtʃa kərie pəɳ ʈika nə kəro"
