        "to or for (-ને)": "આને"
        "of (-નું (-num̐), before a neuter noun)": "આનું"
        "the doer in the past (-એ)": "આણે"
      readings:
        "to or for (-ને)": "āne"
        "of (-નું (-num̐), before a neuter noun)": "ānum̐"
        "the doer in the past (-એ)": "āṇe"
      ipas:
        "to or for (-ને)": "ane"
        "of (-નું (-num̐), before a neuter noun)": "anũ"
        "the doer in the past (-એ)": "aɳe"
    - lemma: "અમે"
      key: ame
