      ipa: "e"
      gloss: "he, she, it: that one"
      forms:
        "to or for (-ને)": "એને"
        "of (-નું (-num̐), before a neuter noun)": "એનું"
        "the doer in the past (-એ)": "એણે"
      readings:
        "to or for (-ને)": "ene"
        "of (-નું (-num̐), before a neuter noun)": "enum̐"
        "the doer in the past (-એ)": "eṇe"
      ipas:
        "to or for (-ને)": "ene"
        "of (-નું (-num̐), before a neuter noun)": "enũ"
