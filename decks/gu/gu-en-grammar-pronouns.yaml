        "of (-નું (-num̐), before a neuter noun)": "તેમનું"
        "the doer in the past (-એ)": "તેમણે"
      readings:
        "to or for (-ને)": "temne"
        "of (-નું (-num̐), before a neuter noun)": "temnum̐"
        "the doer in the past (-એ)": "temṇe"
      ipas:
        "to or for (-ને)": "t̪emne"
        "of (-નું (-num̐), before a neuter noun)": "t̪emnũ"
