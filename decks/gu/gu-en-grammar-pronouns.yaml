schema: 1
id: gu-en-grammar-pronouns
name: "Pronouns"
kind: grammar
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN, icon: "ગુ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I, you, he and she, and the forms they take with -ને (to), -નું (of) and -એ (the doer in the past). Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Personal pronouns"
  slot_name: "form"
  slots: ["to or for (-ને)", "of (-નું (-num̐), before a neuter noun)", "the doer in the past (-એ)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "'Of' agrees with what is owned: મારો ભાઈ (māro bhāi), મારી બહેન (māri bahen), મારું ઘર (mārum̐ ghar). The -એ (-e) form is the doer of a past verb with an object: મેં ખાધું (mem̐ khādhum̐), I ate. તે (te) and એ (e) are both he, she or it; આ (ā) is someone near. અમે (ame) leaves out the person you talk to, આપણે (āpṇe) takes them in."
  entries:
    - lemma: "હું"
      key: hun
      reading: "hum̐"
      ipa: "ɦũ"
      gloss: "I"
      forms:
        "to or for (-ને)": "મને"
        "of (-નું (-num̐), before a neuter noun)": "મારું"
        "the doer in the past (-એ)": "મેં"
      readings:
        "to or for (-ને)": "mane"
        "of (-નું (-num̐), before a neuter noun)": "mārum̐"
        "the doer in the past (-એ)": "mem̐"
      ipas:
        "to or for (-ને)": "məne"
        "of (-નું (-num̐), before a neuter noun)": "marũ"
        "the doer in the past (-એ)": "mẽ"
    - lemma: "તું"
      key: tun
      reading: "tum̐"
      ipa: "t̪ũ"
      gloss: "you, familiar"
      forms:
        "to or for (-ને)": "તને"
        "of (-નું (-num̐), before a neuter noun)": "તારું"
        "the doer in the past (-એ)": "તેં"
      readings:
        "to or for (-ને)": "tane"
        "of (-નું (-num̐), before a neuter noun)": "tārum̐"
        "the doer in the past (-એ)": "tem̐"
      ipas:
        "to or for (-ને)": "t̪əne"
        "of (-નું (-num̐), before a neuter noun)": "t̪arũ"
        "the doer in the past (-એ)": "t̪ẽ"
    - lemma: "તમે"
      key: tame
      reading: "tame"
      ipa: "t̪əme"
      gloss: "you, respectful or plural"
      forms:
        "to or for (-ને)": "તમને"
        "of (-નું (-num̐), before a neuter noun)": "તમારું"
        "the doer in the past (-એ)": "તમે"
      readings:
        "to or for (-ને)": "tamne"
        "of (-નું (-num̐), before a neuter noun)": "tamārum̐"
        "the doer in the past (-એ)": "tame"
      ipas:
        "to or for (-ને)": "t̪əmne"
        "of (-નું (-num̐), before a neuter noun)": "t̪əmarũ"
        "the doer in the past (-એ)": "t̪əme"
    - lemma: "આપ"
      key: aap
      reading: "āp"
      ipa: "ap"
      gloss: "you, very formal"
      forms:
        "to or for (-ને)": "આપને"
        "of (-નું (-num̐), before a neuter noun)": "આપનું"
        "the doer in the past (-એ)": "આપે"
      readings:
        "to or for (-ને)": "āpne"
        "of (-નું (-num̐), before a neuter noun)": "āpnum̐"
        "the doer in the past (-એ)": "āpe"
      ipas:
        "to or for (-ને)": "apne"
        "of (-નું (-num̐), before a neuter noun)": "apnũ"
        "the doer in the past (-એ)": "ape"
    - lemma: "તે"
      key: te
      reading: "te"
      ipa: "t̪e"
      gloss: "he, she, it"
      forms:
        "to or for (-ને)": "તેને"
        "of (-નું (-num̐), before a neuter noun)": "તેનું"
        "the doer in the past (-એ)": "તેણે"
      readings:
