schema: 1
id: gu-en-directions
name: "Directions"
kind: vocab
theme: directions
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Left, right, straight on, near and far: asking the way and understanding the answer. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: gu-0443
    target: "સ્ટેશન ક્યાં છે?"
    native: "Where is the station?"
    reading: "sṭeśan kyām̐ che?"
    ipa: "sʈeʃən kjã tʃʰe"
    pos: "phrase"
    notes: "Any place, then ક્યાં છે?. Start with ભાઈ or બહેન to a stranger: ભાઈ, સ્ટેશન ક્યાં છે?"
  - id: gu-0444
    target: "રસ્તો"
    native: "road; the way"
    reading: "rasto"
    ipa: "rəst̪o"
    pos: "noun"
    gender: "m"
    notes: "Both a road and a route: રસ્તો બતાવો (rasto batāvo), show me the way."
  - id: gu-0445
    target: "ડાબે"
    native: "on the left; to the left"
    reading: "ḍābe"
    ipa: "ɖabe"
    pos: "adv"
    notes: "ડાબું (ḍābum̐) is 'left'; ડાબે, 'on the left'."
  - id: gu-0446
    target: "જમણે"
    native: "on the right; to the right"
    reading: "jamṇe"
    ipa: "dʒəmɳe"
    pos: "adv"
    notes: "જમણું (jamṇum̐) is 'right'. Easy to mix with જમવું, to eat: listen for the ણ."
  - id: gu-0447
    target: "સીધા જાઓ."
    native: "Go straight on."
    reading: "sidhā jāo."
    ipa: "sid̪ʱa dʒao"
    pos: "phrase"
  - id: gu-0448
    target: "ડાબે વળો."
    native: "Turn left."
    reading: "ḍābe vaḷo."
    ipa: "ɖabe ʋəɭo"
    pos: "phrase"
    notes: "વળવું (vaḷvum̐) is to turn. Turn right: જમણે વળો."
  - id: gu-0449
    target: "ચાર રસ્તા"
    native: "crossroads; junction"
    reading: "cār rastā"
    ipa: "tʃar rəst̪a"
    pos: "phrase"
    notes: "Literally 'four roads'. Directions are given by them: બીજા ચાર રસ્તે ડાબે, left at the second crossroads."
  - id: gu-0450
    target: "ખૂણો"
    native: "corner"
    reading: "khuṇo"
    ipa: "kʰuɳo"
    pos: "noun"
    gender: "m"
  - id: gu-0451
    target: "પાસે"
    native: "near; nearby"
    reading: "pāse"
    ipa: "pase"
    pos: "adv"
    notes: "અહીં પાસે (ahim̐ pāse), near here."
  - id: gu-0452
    target: "દૂર"
    native: "far"
    reading: "dur"
    ipa: "d̪ur"
    pos: "adv"
    notes: "કેટલું દૂર છે? (ketlun dur chhe?), how far is it?"
  - id: gu-0453
    target: "આગળ"
    native: "ahead; in front"
    reading: "āgaḷ"
    ipa: "aɡəɭ"
    pos: "adv"
  - id: gu-0454
    target: "પાછળ"
    native: "behind; back"
    reading: "pāchaḷ"
    ipa: "patʃʰəɭ"
    pos: "adv"
  - id: gu-0455
    target: "ઉપર"
    native: "up; upstairs; above"
    reading: "upar"
    ipa: "upər"
    pos: "adv"
  - id: gu-0456
    target: "નીચે"
    native: "down; downstairs; below"
    reading: "nice"
    ipa: "nitʃe"
    pos: "adv"
