schema: 1
id: gu-en-directions
name: "Directions"
kind: vocab
theme: directions
language: { code: gu, iso639_3: guj, name: Gujarati, script: gujarati, tts: gu-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Left, right, straight on, near and far: asking the way and understanding the answer. Not yet checked by a Gujarati speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: gu-0443
    target: "સ્ટેશન ક્યાં છે?"
    native: "Where is the station?"
    reading: "steshan kyan chhe?"
    pos: "phrase"
    notes: "Any place, then ક્યાં છે?. Start with ભાઈ or બહેન to a stranger: ભાઈ, સ્ટેશન ક્યાં છે?"
  - id: gu-0444
    target: "રસ્તો"
    native: "road; the way"
    reading: "rasto"
    pos: "noun"
    gender: "m"
    notes: "Both a road and a route: રસ્તો બતાવો (rasto batavo), show me the way."
  - id: gu-0445
    target: "ડાબે"
    native: "on the left; to the left"
    reading: "dabe"
    pos: "adv"
    notes: "ડાબું (dabun) is 'left'; ડાબે, 'on the left'."
  - id: gu-0446
    target: "જમણે"
    native: "on the right; to the right"
    reading: "jamne"
    pos: "adv"
    notes: "જમણું (jamnun) is 'right'. Easy to mix with જમવું, to eat: listen for the ણ."
  - id: gu-0447
    target: "સીધા જાઓ."
    native: "Go straight on."
    reading: "sidha jao."
    pos: "phrase"
  - id: gu-0448
    target: "ડાબે વળો."
    native: "Turn left."
    reading: "dabe valo."
    pos: "phrase"
    notes: "વળવું (valvun) is to turn. Turn right: જમણે વળો."
  - id: gu-0449
    target: "ચાર રસ્તા"
    native: "crossroads; junction"
    reading: "char rasta"
    pos: "phrase"
    notes: "Literally 'four roads'. Directions are given by them: બીજા ચાર રસ્તે ડાબે, left at the second crossroads."
  - id: gu-0450
    target: "ખૂણો"
    native: "corner"
    reading: "khuno"
    pos: "noun"
    gender: "m"
  - id: gu-0451
    target: "પાસે"
    native: "near; nearby"
    reading: "pase"
    pos: "adv"
    notes: "અહીં પાસે (ahin pase), near here."
  - id: gu-0452
    target: "દૂર"
    native: "far"
    reading: "dur"
    pos: "adv"
    notes: "કેટલું દૂર છે? (ketlun dur chhe?), how far is it?"
  - id: gu-0453
    target: "આગળ"
    native: "ahead; in front"
    reading: "agal"
    pos: "adv"
  - id: gu-0454
    target: "પાછળ"
    native: "behind; back"
    reading: "pachhal"
    pos: "adv"
  - id: gu-0455
    target: "ઉપર"
    native: "up; upstairs; above"
    reading: "upar"
    pos: "adv"
  - id: gu-0456
    target: "નીચે"
    native: "down; downstairs; below"
    reading: "niche"
    pos: "adv"
