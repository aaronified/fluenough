schema: 1
id: "mni-en-first-words"
kind: "layer"
core: "mni-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "The first thirty-five words of Manipuri (Meitei): pronouns, people, water, rice, this and that, here and there, and the numbers one to ten. Every Bengali-script spelling is derived from the Meitei Mayek form of the word and marked doubtful, to be checked by a speaker. Not yet checked by a Manipuri speaker: please report any mistake."
cards:
  "mni-0001":
    native: "you (singular)"
    notes:
      "n1": "The word for one person you speak to, as with a friend. The plural 'you' is nakhoi."
  "mni-0002":
    native: "he; she; it"
    notes:
      "n1": "One word for 'he', 'she' and 'it'."
  "mni-0003":
    native: "mother"
    notes:
      "n1": "Words for relatives take a prefix for the possessive: ima is 'my mother', napa is 'your father' and mapa 'his father' (ipa is 'my father')."
  "mni-0004":
    native: "father"
    notes:
      "n1": "With the prefixes i- (my), na- (your) and ma- (his): ipa 'my father', napa 'your father', mapa 'his father'."
  "mni-0005":
    native: "woman; wife"
    notes:
      "n1": "The same word is given for 'wife' in the basic word list."
  "mni-0006":
    native: "man (adult male)"
    notes:
      "n1": "For an adult male. The basic word list gives the same word for 'man' as a human being."
  "mni-0007":
    native: "name"
    notes:
      "n1": "The word for a person's name."
  "mni-0008":
    native: "water"
    notes:
      "n1": "The word for water in the basic word list."
  "mni-0009":
    native: "rice"
    notes:
      "n1": "Used in the sentence 'I eat rice' (ei chak chai). Primrose's 1888 grammar gives cheng for rice as well. Wiktionary lists the same Meitei Mayek spelling only as a verb 'to burn', a separate word that is written alike."
  "mni-0010":
    native: "this"
    notes:
      "n1": "Primrose's 1888 grammar gives asi or masi for 'this'."
  "mni-0011":
    native: "that"
    notes:
      "n1": "Primrose's 1888 grammar gives adu or madu for 'that'."
  "mni-0012":
    native: "here"
    notes:
      "n1": "The word for 'here' in the basic word list."
  "mni-0013":
    native: "there"
    notes:
      "n1": "The word for 'there' in the basic word list."
  "mni-0014":
    native: "what"
    notes:
      "n1": "Primrose's 1888 grammar gives kadai for 'what'."
  "mni-0015":
    native: "who"
    notes:
      "n1": "Primrose's 1888 grammar gives kanano for 'who'."
  "mni-0016":
    native: "good"
    notes:
      "n1": "aphaba (ꯑꯐꯕ) is 'good'. The a- prefix is part of the word; Sharma's learners' dictionary lists it so. The bare stem ꯐꯕ is not a headword."
  "mni-0017":
    native: "small"
    notes:
      "n1": "apikpa (ꯑꯄꯤꯛꯄ) is 'small', listed by Sharma with the a- prefix."
  "mni-0018":
    native: "big"
    notes:
      "n1": "acouba (ꯑꯆꯧꯕ) is 'big', listed by Sharma with the a- prefix."
  "mni-0019":
    native: "they"
    notes:
      "n1": "Primrose's 1888 grammar gives the same word for 'they'."
  "mni-0020":
    native: "child"
    notes:
      "n1": "The word for 'child' in the basic word list."
  "mni-0021":
    native: "one"
    notes:
      "n1": "The first of the numbers one to ten, from the Wikipedia article on Meitei numerals."
  "mni-0022":
    native: "two"
    notes:
      "n1": "The second of the numbers one to ten."
  "mni-0023":
    native: "three"
    notes:
      "n1": "The third of the numbers one to ten."
  "mni-0024":
    native: "four"
    notes:
      "n1": "The fourth of the numbers one to ten."
  "mni-0025":
    native: "five"
    notes:
      "n1": "The fifth of the numbers one to ten."
  "mni-0026":
    native: "six"
    notes:
      "n1": "The word for six in the Wikipedia article on Meitei numerals."
  "mni-0027":
    native: "seven"
    notes:
      "n1": "The word for seven in the Wikipedia article on Meitei numerals."
  "mni-0028":
    native: "eight"
    notes:
      "n1": "Literally 'two less' (ten minus two)."
  "mni-0029":
    native: "nine"
    notes:
      "n1": "Literally 'one less' (ten minus one)."
  "mni-0030":
    native: "ten"
    notes:
      "n1": "Ten is the base of the numbers from eleven on: eleven is ten plus one more, taraa-maa-thoi."
  "mni-0031":
    native: "I"
    notes:
      "n1": "ei (ꯑꯩ) is I, the first person singular."
  "mni-0032":
    native: "we"
    notes:
      "n1": "eikhoi (ꯑꯩꯈꯣꯏ) is we, the first person plural."
  "mni-0033":
    native: "where"
    notes:
      "n1": "kadāi (ꯀꯗꯥꯏ) means where."
  "mni-0034":
    native: "yes"
    notes:
      "n1": "hoi (ꯍꯣꯏ) is the affirmative reply, yes."
  "mni-0035":
    native: "no"
    notes:
      "n1": "natte (ꯅꯠꯇꯦ) is literally 'is not'; it is the usual way to say no."
