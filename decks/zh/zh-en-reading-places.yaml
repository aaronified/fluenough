- "id": "zh-walk-to-the-station"
  "title": "Walking to the station"
  "theme": "places"
  "sentences":
  - "text": "你 从 这儿 往 前 走。"
    "reading": "nǐ cóng zhèr wǎng qián zǒu."
  - "text": "过 了 银行， 就 是 医院。"
    "reading": "guò le yínháng, jiù shì yīyuàn."
  - "text": "火车站 在 公园 的 对面。"
    "reading": "huǒchēzhàn zài gōngyuán de duìmiàn."
  - "text": "很 近， 十 分钟。"
    "reading": "hěn jìn, shí fēnzhōng."
  "questions":
  - "id": "zh-1156"
    "prompt":
      "en": "你 从 这儿 往 前 走 (nǐ cóng zhèr wǎng qián zǒu) means:"
    "options":
    - "en": "walk forward from here"
    - "en": "walk back from here"
    "answer": 1
  - "id": "zh-1157"
    "prompt":
      "en": "Past 银行 (yínháng), then 医院 (yīyuàn) is next: the hospital is after the bank. True or false?"
    "answer": true
  - "id": "zh-1158"
    "prompt":
      "en": "火车站 在 公园 的 对面 (huǒchēzhàn zài gōngyuán de duìmiàn) means the station is:"
    "options":
    - "en": "across from the park"
    - "en": "inside the park"
    "answer": 1
- "id": "zh-street-signs"
  "title": "Street signs"
  "theme": "places"
  "sentences":
  - "text": "邮局 在 这儿。"
    "reading": "yóujú zài zhèr."
  - "text": "图书馆 今天 关门。"
    "reading": "túshūguǎn jīntiān guānmén."
  - "text": "书店 在 二 楼。"
    "reading": "shūdiàn zài èr lóu."
  - "text": "停车场 在 地下。"
    "reading": "tíngchēchǎng zài dìxià."
  "questions":
