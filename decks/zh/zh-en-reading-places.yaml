    "prompt":
      "en": "邮局 在 这儿 (yóujú zài zhèr) means the post office is:"
    "options":
    - "en": "here"
    - "en": "far away"
    "answer": 1
  - "id": "zh-1160"
    "prompt":
      "en": "书店 在 二 楼 (shūdiàn zài èr lóu) says the bookshop is on the second floor."
    "answer": true
