- "id": "zh-doctor-call"
  "title": "A call to the doctor"
  "theme": "health"
  "sentences":
  - "text": "喂， 医生 吗？ 我 的 孩子 发烧 了。"
    "reading": "wéi, yīshēng ma? wǒ de háizi fāshāo le."
  - "text": "他 咳嗽 得 很 厉害， 还 呕吐。"
    "reading": "tā késou de hěn lìhai, hái ǒutù."
  - "text": "我 可以 明天 来 看 病 吗？"
    "reading": "wǒ kěyǐ míngtiān lái kàn bìng ma?"
  - "text": "请 给 我 挂 号。"
    "reading": "qǐng gěi wǒ guàhào."
