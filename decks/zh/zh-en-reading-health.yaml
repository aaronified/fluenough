- "id": "zh-clinic-notice"
  "title": "Clinic notice"
  "theme": "health"
  "sentences":
  - "text": "请 带 好 病历 和 处方。"
    "reading": "qǐng dài hǎo bìnglì hé chǔfāng."
  - "text": "药房 在 一 楼， 请 排队。"
    "reading": "yàofáng zài yī lóu, qǐng páiduì."
  - "text": "不要 在 病房 里 大声 说话。"
    "reading": "búyào zài bìngfáng lǐ dàshēng shuōhuà."
  - "text": "戴 好 口罩， 注意 卫生。"
    "reading": "dài hǎo kǒuzhào, zhùyì wèishēng."
