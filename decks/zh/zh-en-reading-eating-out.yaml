    "prompt":
      "en": "扫码 点菜 (sǎomǎ diǎncài) means:"
    "options":
    - "en": "order by scanning a code"
    - "en": "pay by scanning a code"
    "answer": 1
  - "id": "zh-1843"
    "prompt":
      "en": "招牌菜 是 烤鸭 (zhāopáicài shì kǎoyā) says the signature dish is roast duck."
    "answer": true
