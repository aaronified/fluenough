- "id": "zh-museum-card"
  "title": "Museum card"
  "theme": "history"
  "sentences":
  - "text": "这 位 皇帝 统一 了 国家。"
    "reading": "zhè wèi huángdì tǒngyī le guójiā."
  - "text": "他 在 位 时 修建 了 宫殿。"
    "reading": "tā zài wèi shí xiūjiàn le gōngdiàn."
  - "text": "这些 文物 是 他 的 时代 的 证据。"
    "reading": "zhèxiē wénwù shì tā de shídài de zhèngjù."
  - "text": "请 不要 触摸 展品。"
    "reading": "qǐng búyào chùmō zhǎnpǐn."
