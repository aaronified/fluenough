- "id": "zh-the-great-wall"
  "title": "The Great Wall"
  "theme": "history"
  "sentences":
  - "text": "长城 是 古代 的 防御 工程。"
    "reading": "Chángchéng shì gǔdài de fángyù gōngchéng."
  - "text": "它 有 很 多 城楼 和 城墙。"
    "reading": "tā yǒu hěn duō chénglóu hé chéngqiáng."
  - "text": "很多 朝代 都 修 了 长城。"
    "reading": "hěn duō cháodài dōu xiū le Chángchéng."
  - "text": "今天 大家 都 去 参观 它。"
    "reading": "jīntiān dàjiā dōu qù cānguān tā."
  "questions":
