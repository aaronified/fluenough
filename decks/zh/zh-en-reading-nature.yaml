- "id": "zh-a-walk-in-the-hills"
  "title": "A walk in the hills"
  "theme": "nature"
  "sentences":
  - "text": "我们 走 了 一 天 的 山路。"
    "reading": "wǒmen zǒu le yì tiān de shānlù."
  - "text": "山上 有 很 多 松树， 还 有 一 个 小 池塘。"
    "reading": "shānshang yǒu hěn duō sōngshù, hái yǒu yí ge xiǎo chítáng."
  - "text": "池塘 边 很 安静， 水 很 清。"
    "reading": "chítáng biān hěn ānjìng, shuǐ hěn qīng."
  - "text": "我 觉得 这里 的 风景 很 美。"
    "reading": "wǒ juéde zhèli de fēngjǐng hěn měi."
