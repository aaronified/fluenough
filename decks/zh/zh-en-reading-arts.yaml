- "id": "zh-exhibition-notice"
  "title": "Exhibition notice"
  "theme": "arts"
  "sentences":
  - "text": "欢迎 参观 书画 展览。"
    "reading": "huānyíng cānguān shūhuà zhǎnlǎn."
  - "text": "展览 时间： 十 月 一 日 到 十 月 三十 日。"
    "reading": "zhǎnlǎn shíjiān: shí yuè yī rì dào shí yuè sānshí rì."
  - "text": "展品 有 油画 和 国画。"
    "reading": "zhǎnpǐn yǒu yóuhuà hé guóhuà."
  - "text": "门票 免费， 请 在 门口 领取。"
    "reading": "ménpiào miǎnfèi, qǐng zài ménkǒu lǐngqǔ."
