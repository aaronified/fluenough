  "title": "A calligraphy class"
  "theme": "arts"
  "sentences":
  - "text": "今天 我们 学 书法。"
    "reading": "jīntiān wǒmen xué shūfǎ."
  - "text": "先 拿 毛笔， 然后 蘸 墨。"
    "reading": "xiān ná máobǐ, ránhòu zhàn mò."
  - "text": "注意 线条 的 粗细。"
    "reading": "zhùyì xiàntiáo de cūxì."
