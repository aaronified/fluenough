    "prompt":
      "en": "这首歌很好听 (zhè shǒu gē hěn hǎotīng) says:"
    "options":
    - "en": "this song sounds nice"
    - "en": "this song is too long"
    "answer": 1
  - "id": "zh-2097"
    "prompt":
      "en": "声音太大了 (shēngyīn tài dà le) says the sound is too loud."
    "answer": true
  - "id": "zh-2098"
    "prompt":
      "en": "请小一点 (qǐng xiǎo yìdiǎn) means:"
    "options":
