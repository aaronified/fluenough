- "id": "zh-at-karaoke"
  "title": "At karaoke"
  "theme": "music"
  "sentences":
  - "text": "我们 去 唱歌， 选 一 首 歌。"
    "reading": "wǒmen qù chànggē, xuǎn yì shǒu gē."
  - "text": "这首歌很好听 (zhè shǒu gē hěn hǎotīng)。"
    "reading": "zhè shǒu gē hěn hǎotīng."
  - "text": "声音太大了， 请 小 一点。"
    "reading": "shēngyīn tài dà le, qǐng xiǎo yìdiǎn."
  - "text": "伴奏 很 好。"
    "reading": "bànzòu hěn hǎo."
  "questions":
