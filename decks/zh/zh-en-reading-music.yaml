    - "en": "please turn it up"
    "answer": 1
- "id": "zh-concert-flyer"
  "title": "A concert flyer"
  "theme": "music"
  "sentences":
  - "text": "音乐会 时间： 星期六 晚上 七 点。"
    "reading": "yīnyuèhuì shíjiān: xīngqīliù wǎnshang qī diǎn."
  - "text": "地点： 大 礼堂。"
    "reading": "dìdiǎn: dà lǐtáng."
  - "text": "乐队 和 合唱 团 都 来。"
    "reading": "yuèduì hé héchàng tuán dōu lái."
  - "text": "门票在门口买 (ménpiào zài ménkǒu mǎi)。"
    "reading": "ménpiào zài ménkǒu mǎi."
