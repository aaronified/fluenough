  "title": "A normal day"
  "theme": "daily-life"
  "sentences":
  - "text": "妈妈 早上 叫醒 孩子。"
    "reading": "māma zǎoshang jiàoxǐng háizi."
  - "text": "孩子 洗脸 刷牙。"
    "reading": "háizi xǐliǎn shuāyá."
  - "text": "然后 吃 早饭。"
    "reading": "ránhòu chī zǎofàn."
  - "text": "爸爸 已经 上班 了。"
    "reading": "bàba yǐjīng shàngbān le."
