- "id": "zh-high-speed-rail-ticket"
  "title": "A high-speed rail ticket"
  "theme": "journey"
  "sentences":
  - "text": "我 要 一 张 去 上海 的 票。"
    "reading": "wǒ yào yì zhāng qù shànghǎi de piào."
  - "text": "票价 是 多少？"
    "reading": "piàojià shì duōshao?"
  - "text": "我 要 二 等 座， 谢谢。"
    "reading": "wǒ yào èr děng zuò, xièxie."
  - "text": "请 从 三 号 口 检票。"
    "reading": "qǐng cóng sān hào kǒu jiǎnpiào."
  "questions":
  - "id": "zh-2552"
    "prompt":
      "en": "票价 (piàojià) means:"
    "options":
    - "en": "the fare"
    - "en": "the timetable"
    "answer": 1
  - "id": "zh-2553"
    "prompt":
      "en": "二等座 (èr děng zuò) is second class, and the speaker wants one."
    "answer": true
  - "id": "zh-2554"
    "prompt":
      "en": "检票 (jiǎnpiào) means:"
    "options":
    - "en": "to check tickets"
    - "en": "to buy tickets"
    "answer": 1
- "id": "zh-platform-notice"
  "title": "A platform notice"
  "theme": "journey"
  "sentences":
  - "text": "开往 北京 的 火车 将 在 八 点 出发。"
    "reading": "kāiwǎng běijīng de huǒchē jiāng zài bā diǎn chūfā."
  - "text": "请 乘客 到 站台 上 等 车。"
    "reading": "qǐng chéngkè dào zhàntái shang děng chē."
  - "text": "车厢 号 在 车票 上。"
    "reading": "chēxiāng hào zài chēpiào shang."
  - "text": "请 注意 安全。"
    "reading": "qǐng zhùyì ānquán."
