  "sentences":
  - "text": "请问，去 车站 怎么 走？"
    "reading": "qǐngwèn, qù chēzhàn zěnme zǒu?"
  - "text": "一直 走， 到 十字路口。"
    "reading": "yìzhí zǒu, dào shízìlùkǒu."
