- "id": "zh-story-with-a-turn"
  "title": "A story with a turn"
  "theme": "verbs-4"
  "sentences":
  - "text": "小猫在树上玩，忽然害怕了。"
    "reading": "xiǎo māo zài shù shàng wán, hūrán hàipà le."
  - "text": "一个男孩看见了，跑过来，把它抱下来。"
    "reading": "yí ge nánhái kànjiàn le, pǎo guòlái, bǎ tā bào xiàlái."
  - "text": "男孩的妈妈从屋里走出来，大声喊：小心！"
    "reading": "nánhái de māma cóng wū lǐ zǒuchūlái, dàshēng hǎn: xiǎoxīn!"
  - "text": "猫跳了下来，男孩却摔倒了。"
    "reading": "māo tiào le xiàlái, nánhái què shuāidǎo le."
  "questions":
  - "id": "zh-4316"
    "prompt":
      "en": "Which word in the story means 'to hold in the arms'?"
    "options":
    - "en": "跳 (tiào)"
    - "en": "抱 (bào)"
    "answer": 2
  - "id": "zh-4317"
