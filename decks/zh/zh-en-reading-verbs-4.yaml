- "id": "zh-morning-chase"
  "title": "A morning chase"
  "theme": "verbs-4"
  "sentences":
  - "text": "他醒来以后，发现门没有关上。"
    "reading": "tā xǐnglái yǐhòu, fāxiàn mén méiyǒu guānshàng."
  - "text": "他走进厨房，看见一只猫在桌子上。"
    "reading": "tā zǒujìn chúfáng, kànjiàn yì zhī māo zài zhuōzi shàng."
  - "text": "猫跑了，他追了很久，最后放弃了。"
    "reading": "māo pǎo le, tā zhuī le hěn jiǔ, zuìhòu fàngqì le."
  - "text": "他回头一看，猫又回来了，坐在门口。"
    "reading": "tā huítóu yí kàn, māo yòu huílái le, zuò zài ménkǒu."
