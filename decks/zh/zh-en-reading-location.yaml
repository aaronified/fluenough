- "id": "zh-where-is-my-key"
  "title": "Where is my key?"
  "theme": "location"
  "sentences":
  - "text": "钥匙在哪里？"
    "reading": "yàoshi zài nǎlǐ?"
  - "text": "钥匙在椅子下。"
    "reading": "yàoshi zài yǐzi xia."
  - "text": "你看，书在床上。"
    "reading": "nǐ kàn, shū zài chuáng shang."
  - "text": "钥匙不在左边，在右边。"
    "reading": "yàoshi bú zài zuǒbian, zài yòubian."
  "questions":
  - "id": "zh-0546"
    "prompt":
      "en": "钥匙在椅子下 (yàoshi zài yǐzi xia) means:"
    "options":
    - "en": "The key is under the chair."
    - "en": "The key is on the chair."
    "answer": 1
  - "id": "zh-0547"
    "prompt":
      "en": "书在床上 (shū zài chuáng shang) says that the book is on the bed."
    "answer": true
  - "id": "zh-0548"
    "prompt":
      "en": "钥匙在哪里 (yàoshi zài nǎlǐ?) asks:"
    "options":
    - "en": "where the key is"
    - "en": "how many keys there are"
    "answer": 1
- "id": "zh-room-layout"
  "title": "Room layout"
  "theme": "location"
