- "id": "values-in-talk"
  "title": "A talk about the good life"
  "theme": "abstract-words"
  "sentences":
  - "text": "老师 问 我们 什么 是 幸福。"
    "reading": "lǎoshī wèn wǒmen shénme shì xìngfú."
  - "text": "有 的 同学 说 是 金钱， 有 的 说 是 亲情 和 友情。"
    "reading": "yǒu de tóngxué shuō shì jīnqián, yǒu de shuō shì qīnqíng hé yǒuqíng."
  - "text": "老师 说， 幸福 的 人 不 只是 满足 于 现状， 他 也 有 理想。"
    "reading": "lǎoshī shuō, xìngfú de rén bù zhǐshì mǎnzú yú xiànzhuàng, tā yě yǒu lǐxiǎng."
  - "text": "我 想， 这 就 是 一 种 价值观。"
    "reading": "wǒ xiǎng, zhè jiù shì yì zhǒng jiàzhíguān."
  "questions":
