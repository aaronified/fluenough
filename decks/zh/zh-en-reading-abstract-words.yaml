- "id": "opinion-column"
  "title": "Is it fair to be honest?"
  "theme": "abstract-words"
  "sentences":
  - "text": "我 认为 诚实 是 最 重要 的 美德。"
    "reading": "wǒ rènwéi chéngshí shì zuì zhòngyào de měidé."
  - "text": "有 人 说， 善良 比 诚实 更 重要， 但 我 觉得 两 者 有 关系。"
    "reading": "yǒu rén shuō, shànliáng bǐ chéngshí gèng zhòngyào, dàn wǒ juéde liǎng zhě yǒu guānxi."
  - "text": "如果 你 不 诚实， 别人 就 很 难 信任 你。"
    "reading": "rúguǒ nǐ bù chéngshí, biérén jiù hěn nán xìnrèn nǐ."
  - "text": "所以， 我们 要 坚持 说 真话， 这 也 是 一 种 责任感。"
    "reading": "suǒyǐ, wǒmen yào jiānchí shuō zhēnhuà, zhè yě shì yì zhǒng zérèngǎn."
