"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Work in sentences"
"description": "Sentences about work: a meeting that starts on time, the manager in the office, the boss and the driver, a business trip and overtime, a report and a guest. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0679":
    "native": "The meeting starts on time."
    "confusables":
      "w1":
        "why": "老板 (lǎobǎn) would make the boss the subject, not the meeting."
      "w2":
        "why": "开会 (kāihuì) is 'to have a meeting', so it would say that people hold one, not when it starts."
  "zh-0680":
    "native": "Is the manager in the office?"
    "confusables":
      "w1":
        "why": "老板 (lǎobǎn) would ask about the boss, not the manager."
      "w2":
        "why": "秘书 (mìshū) would ask about the secretary, not the manager."
  "zh-0681":
    "native": "The boss is busy; the driver is tired."
    "confusables":
      "w1":
        "why": "厨师 (chúshī) would say the cook is tired, not the driver."
      "w2":
        "why": "警察 (jǐngchá) would say the police officer is tired, not the driver."
  "zh-0682":
    "native": "He goes on a business trip tomorrow, and I work overtime today."
    "confusables":
      "w1":
        "why": "打电话 (dǎdiànhuà) would say he makes a phone call, not that he travels."
      "w2":
        "why": "面试 (miànshì) would say he has an interview, not a business trip."
  "zh-0683":
    "native": "Is the secretary making a phone call today?"
    "confusables":
      "w1":
        "why": "老板 (lǎobǎn) would ask about the boss, not the secretary."
      "w2":
        "why": "客人 (kèrén) would ask about a guest, not the secretary."
  "zh-0684":
    "native": "This report is good."
    "confusables":
      "w1":
        "why": "合同 (hétong) is 'contract', a different kind of paper."
      "w2":
        "why": "文件 (wénjiàn) is 'document', which is wider than one report."
  "zh-0685":
    "native": "Is the guest in the office?"
    "confusables":
      "w1":
        "why": "客户 (kèhù) is 'client', a business customer, not a guest."
      "w2":
        "why": "老板 (lǎobǎn) would ask about the boss, not the guest."
  "zh-0686":
    "native": "He attends the meeting; she manages the company."
    "confusables":
      "w1":
        "why": "公务员 (gōngwùyuán) is 'civil servant', so it would say he is a government worker."
      "w2":
        "why": "完成 (wánchéng) is 'to complete', so it would say she finishes the company."
