"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Story actions in sentences"
"description": "Short story sentences: running into a door, a thief at the window, waking and crying, a rescue, a car that stops. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-4306":
    "confusables":
      "w1":
        "why": "碰到 (pèngdào) is a light touch or a chance meeting, not a hard crash."
      "w2":
        "why": "摔 (shuāi) is to fall or drop, not to hit something head on."
    "bases":
      "得":
        "meaning": "complement marker"
      "到":
        "meaning": "to reach; to obtain"
      "了":
        "meaning": "completed action"
    "native": "He ran too fast and bumped into the door."
  "zh-4307":
    "confusables":
      "w1":
        "why": "躲 (duǒ) is to dodge or hide oneself, not to climb in through a window."
      "w2":
        "why": "逃 (táo) is to run away, which the thief does only after the theft."
    "bases":
      "从":
        "meaning": "from"
      "进来":
        "meaning": "in"
      "偷走":
        "meaning": "to steal away"
      "了":
        "meaning": "completed action"
      "的":
        "meaning": "of; 's"
    "native": "A thief climbed in through the window and stole my wallet."
  "zh-4308":
    "confusables":
      "w1":
        "why": "睡着 (shuìzháo) is to fall asleep, the state before waking up."
      "w2":
        "why": "喊 (hǎn) is to shout; crying is not always shouting."
    "bases":
      "了":
        "meaning": "completed action"
      "起来":
        "meaning": "up; (begin to)"
    "native": "After the child woke up, it began to cry."
  "zh-4309":
    "confusables":
      "w1":
        "why": "等待 (děngdài) is to wait, and here he is not waiting; he is asked to quit."
      "w2":
        "why": "拒绝 (jùjué) is to refuse outright; here he simply did not say yes."
    "bases":
      "没有":
        "meaning": "there is not; did not"
    "native": "The teacher urged him to give up the match, but he did not agree."
  "zh-4310":
    "confusables":
      "w1":
        "why": "扶 (fú) is to steady someone with the hand, not to carry them."
      "w2":
        "why": "搬 (bān) is to move heavy things, not people."
    "bases":
      "把":
        "meaning": "marker of an object moved"
    "native": "They lifted the patient into the car, then went into the hospital together."
  "zh-4311":
    "confusables":
      "w1":
        "why": "放弃 (fàngqì) is to give up, the opposite of waiting for help."
      "w2":
        "why": "继续 (jìxù) is to carry on moving, not to stay in one place."
    "bases":
      "山下":
        "meaning": "foot of the mountain"
      "了":
        "meaning": "completed action"
    "native": "We are waiting for rescue at the foot of the mountain, and night is falling."
  "zh-4312":
    "confusables":
      "w1":
        "why": "停止 (tíngzhǐ) is to stop an activity, not a car coming to rest."
      "w2":
        "why": "转 (zhuǎn) is to turn a thing round, not to look back over the shoulder."
    "bases":
      "突然":
        "meaning": "suddenly"
      "了":
        "meaning": "completed action"
      "一眼":
        "meaning": "a glance"
    "native": "The car stopped suddenly, and the driver looked back once."
  "zh-4313":
    "confusables":
      "w1":
        "why": "拉 (lā) is to pull, the opposite of pushing a door open."
      "w2":
        "why": "敲 (qiāo) is to knock, which he did not do; he felt his way in."
    "bases":
      "找到":
        "meaning": "to find"
      "把":
        "meaning": "marker of an object moved"
      "推开":
        "meaning": "to push open"
      "了":
        "meaning": "completed action"
    "native": "He felt his way in the dark to the door, and pushed it open."
  "zh-4314":
    "confusables":
      "w1":
        "why": "倒下 (dǎoxià) is a person or a tree falling down on its own; here the wind knocks it over."
      "w2":
        "why": "摔 (shuāi) is a fall or a drop with a crash, not a push from the wind."
    "bases":
      "把":
        "meaning": "marker of an object moved"
      "吹":
        "meaning": "to blow"
      "了":
        "meaning": "completed action"
      "树枝":
        "meaning": "branch"
      "压":
        "meaning": "to press down"
    "native": "The strong wind blew the tree down, and its branches lay on the roof."
  "zh-4315":
    "confusables":
      "w1":
        "why": "躲 (duǒ) is to hide oneself from someone, not to hide an object."
      "w2":
        "why": "挡 (dǎng) is to block; she shut the door, she did not block it."
    "bases":
      "把":
        "meaning": "marker of an object moved"
      "起来":
        "meaning": "up; (begin to)"
      "偷偷":
        "meaning": "secretly"
      "了":
        "meaning": "completed action"
    "native": "She hid the money, and then quietly shut the door."
