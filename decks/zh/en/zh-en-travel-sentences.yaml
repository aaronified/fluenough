"cards":
  "zh-3203":
    "confusables":
      "w1":
        "why": "地铁 (dìtiě) is the metro, a different kind of transport."
      "w2":
        "why": "出租车 (chūzūchē) is a taxi, a different kind."
    "native": "We are waiting for the bus at the station."
  "zh-3204":
    "confusables":
      "w1":
        "why": "风光 (fēngguāng) is scenery, a close word."
      "w2":
        "why": "雪景 (xuějǐng) is a snow scene, a different kind."
    "bases":
      "美":
        "meaning": "beautiful"
    "native": "The view is very beautiful, and the weather is good too."
  "zh-3205":
    "confusables":
      "w1":
        "why": "民宿 (mínsù) is a guesthouse, a different place."
      "w2":
        "why": "旅馆 (lǚguǎn) is an inn, a close word."
    "bases":
      "这里":
        "meaning": "here"
      "的":
        "meaning": "of"
    "native": "The hotel here is very expensive, so we stay at an inn."
  "zh-3206":
    "confusables":
      "w1":
        "why": "晕机 (yūnjī) is airsickness, a different case."
      "w2":
        "why": "头疼 (tóuténg) is a headache, a specific pain."
    "bases":
      "了":
        "meaning": "a particle"
    "native": "I am seasick, and I feel very unwell."
  "zh-3207":
    "confusables":
      "w1":
        "why": "日落 (rìluò) is sunset, the opposite."
      "w2":
        "why": "徒步 (túbù) is to walk far, a different activity."
    "native": "We go climbing and watch the sunrise."
  "zh-3208":
    "confusables":
      "w1":
        "why": "路况 (lùkuàng) is road conditions, a wider word."
      "w2":
        "why": "站名 (zhànmíng) is a station name, a different sign."
    "native": "This road sign is very clear."
  "zh-3209":
    "confusables":
      "w1":
        "why": "拥挤 (yōngjǐ) is crowded, a description rather than a crowd."
      "w2":
        "why": "美术馆 (měishùguǎn) is an art gallery, a different building."
    "native": "There is a big crowd in the museum."
  "zh-3210":
    "confusables":
      "w1":
        "why": "护照 (hùzhào) is a passport, a different document."
      "w2":
        "why": "票 (piào) is a ticket, a different paper."
    "bases":
      "给":
        "meaning": "to give; for"
      "的":
        "meaning": "of"
    "native": "Please give me your business card."
