"schema": 1
"id": "zh-en-cooking"
"kind": "layer"
"core": "zh-cooking"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Cooking"
"description": "Forty-five words for cooking at home: the recipe and the ingredients, the ways of cutting and cooking, the seasonings and the heat, and the kitchen tools. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1845":
    "native": "recipe"
    "notes":
      "n1": "A recipe, the instructions for making a dish. 食 (shí) is food, and 谱 (pǔ) is a book of instructions."
    "examples":
      "这是妈妈的食谱。":
        "native": "This is Mum's recipe."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "食谱上有步骤。":
        "native": "The recipe has the steps."
        "bases":
          "有":
            "meaning": "to have; there is"
          "步骤":
            "meaning": "steps"
  "zh-1846":
    "native": "ingredients"
    "notes":
      "n1": "The ingredients of a dish, the things that go into it. 配 (pèi) is to match, and 料 (liào) is material."
    "examples":
      "配料有番茄和鸡蛋。":
        "native": "The ingredients are tomato and egg."
        "bases":
          "有":
            "meaning": "to have; there is"
          "和":
            "meaning": "and"
      "这个配料很多。": "This dish has many ingredients."
  "zh-1847":
    "native": "seasoning"
    "notes":
      "n1": "Seasoning, such as salt, sugar and sauce, added to a dish. 调 (tiáo) is to mix or season."
    "examples":
      "调料放在桌子上。": "The seasonings are on the table."
      "这个调料很辣。": "This seasoning is spicy."
  "zh-1848":
    "native": "to cut"
    "notes":
      "n1": "To cut food into pieces with a knife. 切菜 (qiēcài) is to cut vegetables."
    "examples":
      "先切番茄。": "First cut the tomato."
      "切得很薄。":
        "native": "Cut it very thin."
        "bases":
          "得":
            "meaning": "a particle after a verb: how it is done"
          "薄":
            "meaning": "thin"
  "zh-1849":
    "native": "to chop"
    "notes":
      "n1": "To chop food into small pieces with a heavy knife."
    "examples":
      "剁肉很累。": "Chopping the meat is tiring."
      "把葱剁碎。":
        "native": "Chop the spring onion finely."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
          "碎":
            "meaning": "broken into small bits"
  "zh-1850":
    "native": "to wash vegetables"
    "notes":
      "n1": "To wash vegetables before cooking. 菜 (cài) is a dish or vegetable."
    "examples":
      "先洗菜。": "Wash the vegetables first."
      "洗菜很快。": "Washing the vegetables is quick."
  "zh-1851":
    "native": "to peel"
    "notes":
      "n1": "To peel off the skin of fruit or an egg."
    "examples":
      "剥鸡蛋皮。":
        "native": "Peel the egg."
        "bases":
          "皮":
            "meaning": "skin; peel"
      "剥橘子很容易。":
        "native": "Peeling an orange is easy."
        "bases":
          "橘子":
            "meaning": "orange"
  "zh-1852":
    "native": "to pare; to peel with a knife"
    "notes":
      "n1": "To peel or shave off the skin with a knife. 削皮 (xiāopí) is to peel."
    "examples":
      "削萝卜皮。":
        "native": "Peel the radish."
        "bases":
          "皮":
            "meaning": "skin; peel"
      "削苹果皮。":
        "native": "Peel the apple."
        "bases":
          "皮":
            "meaning": "skin; peel"
  "zh-1853":
    "native": "to stir"
    "notes":
      "n1": "To stir a liquid round and round."
    "examples":
      "搅一搅。": "Stir it once."
      "搅汤很好。": "Stirring the soup is good."
  "zh-1854":
    "native": "to pan-fry"
    "notes":
      "n1": "To fry food in a little oil, turning it over. 煎蛋 (jiāndàn) is a fried egg."
    "examples":
      "煎鸡蛋。": "Fry the egg."
      "煎得很香。":
        "native": "It is fried very nicely."
        "bases":
          "得":
            "meaning": "a particle after a verb: how it is done"
  "zh-1855":
    "native": "to stew"
    "notes":
      "n1": "To cook food slowly in liquid for a long time."
    "examples":
      "炖肉要很久。":
        "native": "Stewing meat takes a long time."
        "bases":
          "要":
            "meaning": "must; to want"
          "久":
            "meaning": "long, of time"
      "炖汤很香。": "The stewed soup smells good."
  "zh-1856":
    "native": "to braise"
    "notes":
      "n1": "To cook food covered, with a little liquid, over low heat."
    "examples":
      "焖饭要小火。":
        "native": "Braising rice needs low heat."
        "bases":
          "要":
            "meaning": "must; to want"
      "焖鸡很好吃。": "Braised chicken is delicious."
  "zh-1857":
    "native": "to put in; to add"
    "notes":
      "n1": "To put something in or to add an ingredient. 放 盐 (fàng yán) is to add salt."
    "examples":
      "放一点盐。":
        "native": "Add a little salt."
        "bases":
          "一点":
            "meaning": "a little"
      "请把盘子放在桌子上。":
        "native": "Please put the plate on the table."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
  "zh-1858":
    "native": "monosodium glutamate; MSG"
    "notes":
      "n1": "A seasoning powder that adds savour to food. 味 (wèi) is taste, and 精 (jīng) is refined."
    "examples":
      "汤里放味精。": "Put a little MSG in the soup."
      "味精不要太多。":
        "native": "Do not use too much MSG."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-1859":
    "native": "sesame oil"
    "notes":
      "n1": "Sesame oil, a strong-smelling oil used at the end of a dish. 香 (xiāng) is fragrant."
    "examples":
      "加一点香油。":
        "native": "Add a little sesame oil."
        "bases":
          "一点":
            "meaning": "a little"
      "香油很香。": "Sesame oil smells very good."
  "zh-1860":
    "native": "garlic (the bulb or clove)"
    "notes":
      "n1": "Garlic, the bulb or the cloves. 大蒜 (dàsuàn) is the garlic plant."
    "examples":
      "切一点蒜。":
        "native": "Cut a little garlic."
        "bases":
          "一点":
            "meaning": "a little"
      "蒜很香。": "The garlic smells good."
  "zh-1861":
    "native": "star anise"
    "notes":
      "n1": "Star anise, a spice shaped like a star. 八 (bā) is eight, and 角 (jiǎo) is a corner."
    "examples":
      "汤里有八角。":
        "native": "There is star anise in the soup."
        "bases":
          "有":
            "meaning": "to have; there is"
      "八角很香。": "Star anise smells good."
  "zh-1862":
    "native": "cinnamon bark"
    "notes":
      "n1": "Cinnamon bark, a spice used in stews. 桂 (guì) is cinnamon, and 皮 (pí) is bark or skin."
    "examples":
      "炖肉要放桂皮。":
        "native": "Put cinnamon bark in when stewing meat."
        "bases":
          "要":
            "meaning": "must; to want"
      "桂皮很香。": "Cinnamon bark smells good."
  "zh-1863":
    "native": "tomato"
    "notes":
      "n1": "A tomato, a red fruit used as a vegetable."
    "examples":
      "番茄很红。":
        "native": "The tomato is very red."
        "bases":
          "红":
            "meaning": "red"
      "炒番茄很好吃。": "Stir-fried tomato is delicious."
  "zh-1864":
    "native": "flour"
    "notes":
      "n1": "Flour, ground from wheat, for making bread and noodles. 粉 (fěn) is powder."
    "examples":
      "面粉在柜子里。": "The flour is in the cupboard."
      "做面包要面粉。":
        "native": "Making bread needs flour."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-1865":
    "native": "cold water"
    "notes":
      "n1": "Cold water, not heated. 冷 (lěng) is cold."
    "examples":
      "先用冷水洗。":
        "native": "First wash it in cold water."
        "bases":
          "用":
            "meaning": "to use"
      "冷水很清。":
        "native": "The cold water is clear."
        "bases":
          "清":
            "meaning": "clear"
  "zh-1866":
    "native": "wok; stir-fry pan"
    "notes":
      "n1": "A wok, a round pan for stir-frying. 炒 (chǎo) is to stir-fry, and 锅 (guō) is a pot."
    "examples":
      "炒锅很热。": "The wok is very hot."
      "把菜放进炒锅。":
        "native": "Put the dish into the wok."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
  "zh-1867":
    "native": "steamer"
    "notes":
      "n1": "A bamboo or metal steamer, for steaming buns. 蒸 (zhēng) is to steam, and 笼 (lóng) is a cage."
    "examples":
      "包子在蒸笼里。": "The buns are in the steamer."
      "蒸笼很大。": "The steamer is very big."
  "zh-1868":
    "native": "kitchen knife"
    "notes":
      "n1": "A kitchen knife, a broad knife for cutting food. 菜 (cài) is food, and 刀 (dāo) is a knife."
    "examples":
      "菜刀很快。": "The kitchen knife is sharp."
      "用菜刀切肉。":
        "native": "Cut the meat with a kitchen knife."
        "bases":
          "用":
            "meaning": "to use"
  "zh-1869":
    "native": "chopping board"
    "notes":
      "n1": "A chopping board, a wooden board for cutting food on. 砧 (zhēn) is an anvil or block."
    "examples":
      "砧板上有葱。":
        "native": "There is spring onion on the chopping board."
        "bases":
          "有":
            "meaning": "to have; there is"
      "把菜放在砧板上。":
        "native": "Put the dish on the chopping board."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
  "zh-1870":
    "native": "cooking gas"
    "notes":
      "n1": "Gas, for cooking on a stove. 燃 (rán) is to burn, and 气 (qì) is gas."
    "examples":
      "燃气用完了。":
        "native": "The cooking gas has run out."
        "bases":
          "用":
            "meaning": "to use"
          "完":
            "meaning": "finished"
          "了":
            "meaning": "a particle: a change has happened"
      "关燃气以后再走。": "Turn off the gas before you leave."
  "zh-1871":
    "native": "heat control"
    "notes":
      "n1": "The right heat for cooking, how hot the fire is. 火 (huǒ) is fire."
    "examples":
      "火候很重要。": "Getting the heat right is very important."
      "火候不够了。":
        "native": "The heat is not high enough."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1872":
    "native": "to cut into pieces"
    "notes":
      "n1": "To cut food into chunks. 块 (kuài) is a piece."
    "examples":
      "先切块。": "Cut it into pieces first."
      "切块以后炒。": "Stir-fry after cutting into pieces."
  "zh-1873":
    "native": "to cut into strips"
    "notes":
      "n1": "To cut food into thin strips. 丝 (sī) is a thread."
    "examples":
      "切丝很细。":
        "native": "The strips are very fine."
        "bases":
          "细":
            "meaning": "fine; thin"
      "把萝卜切丝。":
        "native": "Cut the radish into strips."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
  "zh-1874":
    "native": "to slice"
    "notes":
      "n1": "To cut food into thin slices. 片 (piàn) is a slice."
    "examples":
      "切片很薄。":
        "native": "The slices are very thin."
        "bases":
          "薄":
            "meaning": "thin"
      "切片的肉很好。":
        "native": "The sliced meat is very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1875":
    "native": "high heat"
    "notes":
      "n1": "A high flame, a strong heat on the stove. 大 (dà) is big, and 火 (huǒ) is fire."
    "examples":
      "用大火炒。":
        "native": "Stir-fry on high heat."
        "bases":
          "用":
            "meaning": "to use"
      "大火煮开了。":
        "native": "It has come to the boil on high heat."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1876":
    "native": "low heat"
    "notes":
      "n1": "A low flame, a gentle heat on the stove. 小 (xiǎo) is small, and 火 (huǒ) is fire."
    "examples":
      "用小火炖。":
        "native": "Stew on low heat."
        "bases":
          "用":
            "meaning": "to use"
      "小火慢慢煮。":
        "native": "Cook it slowly on low heat."
        "bases":
          "慢慢":
            "meaning": "slowly"
  "zh-1877":
    "native": "medium heat"
    "notes":
      "n1": "A medium flame, between high and low. 中 (zhōng) is middle."
    "examples":
      "用中火煎。":
        "native": "Fry on medium heat."
        "bases":
          "用":
            "meaning": "to use"
      "中火就可以。":
        "native": "Medium heat is enough."
        "bases":
          "可以":
            "meaning": "can; may"
  "zh-1878":
    "native": "to come to the boil"
    "notes":
      "n1": "For a pot to start boiling. 开 (kāi) is to open or to boil, here."
    "examples":
      "水开锅了。":
        "native": "The water has come to the boil."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "开锅以后放面条。": "Put the noodles in after it boils."
  "zh-1879":
    "native": "to take out of the pot"
    "notes":
      "n1": "To take food out of the pot or pan, when it is ready. 出 (chū) is to come out."
    "examples":
      "菜出锅了。":
        "native": "The dish is ready to serve."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "出锅以后趁热吃。":
        "native": "Eat it hot as soon as it is out of the pot."
        "bases":
          "趁":
            "meaning": "to take the chance of"
  "zh-1880":
    "native": "to cut vegetables"
    "notes":
      "n1": "To cut vegetables into pieces for cooking."
    "examples":
      "妈妈在切菜。": "Mum is cutting vegetables."
      "切菜要小心。":
        "native": "Be careful when cutting vegetables."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-1881":
    "native": "to stir-fry a dish"
    "notes":
      "n1": "To cook a dish by stir-frying it."
    "examples":
      "我会炒菜。":
        "native": "I can stir-fry dishes."
        "bases":
          "会":
            "meaning": "can; to know how to"
      "炒菜很快。": "Stir-frying is quick."
  "zh-1882":
    "native": "to cook a dish"
    "notes":
      "n1": "To cook a dish, to prepare food for a meal."
    "examples":
      "他做菜很好。": "He cooks very well."
      "做菜要有耐心。":
        "native": "Cooking needs patience."
        "bases":
          "要":
            "meaning": "must; to want"
          "有":
            "meaning": "to have; there is"
          "耐心":
            "meaning": "patience"
  "zh-1883":
    "native": "to put into the pan"
    "notes":
      "n1": "To put food into a pot or pan to cook. 下 (xià) is to put in."
    "examples":
      "菜下锅了。":
        "native": "The vegetables are in the pan."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "先下锅煮面条。": "First put the noodles in the pot to cook."
  "zh-1884":
    "native": "to knead"
    "notes":
      "n1": "To press and fold dough with the hands, until it is smooth."
    "examples":
      "揉面很累。":
        "native": "Kneading dough is tiring."
        "bases":
          "面":
            "meaning": "noodles; flour"
      "把面团揉好。":
        "native": "Knead the dough well."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
          "面团":
            "meaning": "dough"
  "zh-1885":
    "native": "to roll out (dough)"
    "notes":
      "n1": "To roll out dough flat with a rolling pin."
    "examples":
      "擀面条。": "Roll out the noodles."
      "擀饺子皮要快。":
        "native": "Roll out the dumpling wrappers quickly."
        "bases":
          "皮":
            "meaning": "skin; peel"
          "要":
            "meaning": "must; to want"
  "zh-1886":
    "native": "to heat up"
    "notes":
      "n1": "To heat food or drink until it is hot. 加 (jiā) is to add, and 热 (rè) is hot."
    "examples":
      "把汤加热。":
        "native": "Heat up the soup."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
      "加热以后更好吃。": "It is even better once it is heated."
  "zh-1887":
    "native": "to stir-fry, turning often"
    "notes":
      "n1": "To stir-fry food, turning it over and over in the pan. 翻 (fān) is to turn over."
    "examples":
      "翻炒一下。":
        "native": "Stir-fry it for a moment."
        "bases":
          "一下":
            "meaning": "a little; have a try"
      "翻炒的菜很香。":
        "native": "The stir-fried dish smells good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1888":
    "native": "to pickle; to marinate"
    "notes":
      "n1": "To preserve or flavour food by soaking it in salt or sauce."
    "examples":
      "肉要腌一下。":
        "native": "The meat must be marinated for a while."
        "bases":
          "要":
            "meaning": "must; to want"
          "一下":
            "meaning": "a little; have a try"
      "腌菜很咸。": "The pickled vegetables are very salty."
  "zh-1889":
    "native": "to defrost"
    "notes":
      "n1": "To thaw frozen food before cooking. 冻 (dòng) is to freeze."
    "examples":
      "肉要先解冻。":
        "native": "The meat must be thawed first."
        "bases":
          "要":
            "meaning": "must; to want"
      "解冻以后再煮。": "Cook it after it has thawed."
