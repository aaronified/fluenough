  "notes": "A number comes before its measure word, and the measure word before the noun: 一 (yì) 本 (běn) 书 (shū), one book; 两 (liǎng) 杯 (bēi) 茶 (chá), two cups of tea. Each noun has its own measure word, so learn them together: 本 (běn) for books, 杯 (bēi) for cups, 瓶 (píng) for bottles, 双 (shuāng) for pairs such as shoes, 件 (jiàn) for items of clothing, and 个 (ge) for people. 一 (yī) is said yì before 本 (běn), 杯 (bēi), 瓶 (píng) and 双 (shuāng), and yí before 件 (jiàn) and 个 (ge). Before a measure word, two is 两 (liǎng), not 二 (èr)."
