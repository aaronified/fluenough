"cards":
  "zh-3538":
    "confusables":
      "w1":
        "why": "打开 (dǎkāi) is to open, the opposite."
      "w2":
        "why": "关门 (guānmén) is to close a shop or door, a related act."
    "bases":
      "把":
        "meaning": "to take (object before the verb)"
      "了":
        "meaning": "a particle"
    "native": "I closed the door."
  "zh-3539":
    "confusables":
      "w1":
        "why": "写 (xiě) is to write, a different act."
      "w2":
        "why": "完成 (wánchéng) is to complete, a close word."
    "bases":
      "把":
        "meaning": "to take (object before the verb)"
      "完":
        "meaning": "finished"
      "了":
        "meaning": "a particle"
    "native": "He finished the homework."
  "zh-3540":
    "confusables":
