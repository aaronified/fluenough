        "why": "拿 (ná) is to hold, a different act."
      "w2":
        "why": "带 (dài) is to bring, not to put down."
    "bases":
      "把":
        "meaning": "to take (object before the verb)"
    "native": "She put the book on the table."
  "zh-3541":
