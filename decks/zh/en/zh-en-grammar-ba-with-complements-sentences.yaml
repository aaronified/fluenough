"name": "把 (bǎ) with a result: putting the object first, and 被 (bèi) against 把 (bǎ)"
"description": "Sentences that move the object before the verb with 把 (bǎ) and add a result, such as 我把门关上了 (I closed the door), and that contrast 把 (bǎ) with the passive 被 (bèi). Not yet checked by a Mandarin speaker: please report any mistake."
