      "w1":
        "why": "喝 (hē) is to drink, a different act."
      "w2":
        "why": "买 (mǎi) is to buy, not to eat."
    "bases":
      "没":
        "meaning": "not"
      "把":
        "meaning": "to take (object before the verb)"
      "完":
        "meaning": "finished"
    "native": "I did not finish eating the meal."
  "zh-3542":
    "confusables":
      "w1":
        "why": "读 (dú) is to read, a different act."
      "w2":
        "why": "收到 (shōudào) is to receive, which is the opposite direction."
    "bases":
      "把":
        "meaning": "to take (object before the verb)"
      "信":
        "meaning": "letter"
    "native": "Please write the letter properly."
  "zh-3543":
    "confusables":
      "w1":
        "why": "偷 (tōu) is to steal, a stronger act."
      "w2":
        "why": "借 (jiè) is to borrow, not to take away."
    "bases":
