"name": "把 (bǎ) and 被 (bèi): the same event from two sides"
"license": "CC-BY-SA-4.0"
"description": "把 (bǎ) and 被 (bèi) can describe the same event from two sides: 他把书拿走了 (he took the book away) and 书被他拿走了 (the book was taken away by him). Not yet checked by a Mandarin speaker: please report any mistake."
