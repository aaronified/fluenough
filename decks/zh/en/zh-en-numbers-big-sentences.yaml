"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Big numbers in sentences"
"description": "Sentences with the big numbers: a thousand, two thousand people at a factory, the ages of two people, the first and second in a line, a meeting on the fifth, decimals and whole numbers, half, and about ten. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0728":
    "native": "Is this number a thousand?"
    "confusables":
      "w1":
        "why": "十万 (shíwàn) is a hundred thousand, not a thousand."
      "w2":
        "why": "一百 (yìbǎi) is one hundred, a tenth of a thousand."
  "zh-0729":
    "native": "Two thousand people are at the factory."
    "confusables":
      "w1":
        "why": "一万 (yíwàn) is ten thousand, so it would give too many people."
      "w2":
        "why": "三百 (sānbǎi) is three hundred, so it would give too few people."
  "zh-0730":
    "native": "He is thirty years old; she is twenty."
    "confusables":
      "w1":
        "why": "四十 (sìshí) is forty, so it would give him the wrong age."
      "w2":
        "why": "五十 (wǔshí) is fifty, so it would give him the wrong age."
  "zh-0731":
    "native": "The first person is me; the second person is the boss."
    "confusables":
      "w1":
        "why": "第三 (dìsān) is third, not second."
      "w2":
        "why": "第四 (dìsì) is fourth, not second."
  "zh-0732":
    "native": "Is there a meeting on the fifth?"
    "confusables":
      "w1":
        "why": "第一 (dìyī) is first, not the fifth."
      "w2":
        "why": "几百 (jǐbǎi) is several hundred, a number of people or things, not a day."
  "zh-0733":
    "native": "Decimals are hard; whole numbers are easy."
    "confusables":
      "w1":
        "why": "零 (líng) is zero, not a decimal."
      "w2":
        "why": "亿 (yì) is a hundred million, not a whole number."
  "zh-0734":
    "native": "Are you buying half?"
    "confusables":
      "w1":
        "why": "倍 (bèi) is 'times', not half."
      "w2":
        "why": "大约 (dàyuē) is 'about', not half."
  "zh-0735":
    "native": "We are about ten people."
    "confusables":
      "w1":
        "why": "加 (jiā) is 'to add', so it would say we add ten people."
      "w2":
        "why": "减 (jiǎn) is 'to subtract', so it would say we take away ten people."
