"cards":
  "zh-2882":
    "confusables":
      "w1":
        "why": "带 (dài) is to bring, not to steal."
      "w2":
        "why": "借 (jiè) is to borrow, not to steal."
    "bases":
      "的":
        "meaning": "of"
      "被":
        "meaning": "by (passive marker)"
      "了":
        "meaning": "a particle: a finished action"
    "native": "My wallet was stolen."
  "zh-2883":
    "confusables":
      "w1":
        "why": "关 (guān) is to close, the opposite of opening."
      "w2":
        "why": "拿 (ná) is to hold, a different act."
    "bases":
      "被":
        "meaning": "by (passive marker)"
      "打开":
        "meaning": "to open"
      "了":
        "meaning": "a particle: a finished action"
    "native": "The window was opened."
  "zh-2884":
    "confusables":
      "w1":
        "why": "脏 (zāng) is dirty, the opposite of clean."
      "w2":
        "why": "打扫 (dǎsǎo) is to clean a room, not clothes."
    "bases":
      "被":
        "meaning": "by (passive marker)"
      "了":
        "meaning": "a particle: a finished action"
    "native": "This piece of clothing has been washed clean."
  "zh-2885":
    "confusables":
      "w1":
        "why": "表扬 (biǎoyáng) is to praise, the opposite."
      "w2":
        "why": "鼓励 (gǔlì) is to encourage, a different act."
    "bases":
      "被":
        "meaning": "by (passive marker)"
      "了":
        "meaning": "a particle: a finished action"
    "native": "The student was criticised by the teacher."
  "zh-2886":
    "confusables":
      "w1":
        "why": "干净 (gānjìng) is clean, the result of cleaning."
      "w2":
        "why": "脏 (zāng) is dirty, the state before cleaning."
    "bases":
      "没":
        "meaning": "not"
      "被":
        "meaning": "by (passive marker)"
    "native": "The room was not cleaned."
  "zh-2887":
    "confusables":
      "w1":
        "why": "带 (dài) is to bring, not to drive away."
      "w2":
        "why": "偷 (tōu) is to steal, a different act."
    "bases":
      "的":
        "meaning": "of"
      "被":
        "meaning": "by (passive marker)"
      "了":
        "meaning": "a particle: a finished action"
    "native": "My car was driven away by the driver."
  "zh-2888":
    "confusables":
      "w1":
        "why": "读 (dú) is to read, not to write."
      "w2":
        "why": "看 (kàn) is to look at or read, a different act."
    "bases":
