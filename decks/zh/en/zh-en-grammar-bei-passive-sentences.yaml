"name": "被 (bèi): the passive, with the doer or without"
"description": "Sentences that say what happened to someone or something, with 被 (bèi) before the doer, such as 我的书被他拿走了 (my book was taken by him), or with no doer, such as 门被打开了 (the door was opened). Not yet checked by a Mandarin speaker: please report any mistake."
