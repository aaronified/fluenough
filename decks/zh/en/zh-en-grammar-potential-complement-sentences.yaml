"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "得 (de) and 不 (bù) between the verb and its result: can or cannot do it"
"description": "Sentences that say whether something can be done: 吃得完 (can finish eating), 看不懂 (cannot understand by reading), 找得到 (can find). Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-2432":
    "confusables":
      "w1":
        "why": "喝 (hē) is to drink, not to finish a meal."
      "w2":
        "why": "买 (mǎi) is to buy, not to eat."
    "bases":
      "完":
        "meaning": "finished"
    "native": "I cannot finish this meal."
  "zh-2433":
    "confusables":
      "w1":
        "why": "说 (shuō) is to speak, not to hear."
      "w2":
        "why": "写 (xiě) is to write, not to hear."
    "bases":
      "得":
        "meaning": "a particle: can (after the verb)"
      "清楚":
        "meaning": "clear"
      "的":
        "meaning": "a particle: of; belonging to"
      "话":
        "meaning": "words; speech"
    "native": "I can hear your words clearly."
  "zh-2434":
    "confusables":
      "w1":
        "why": "读 (dú) is to read aloud, not to understand."
      "w2":
        "why": "写 (xiě) is to write, a different action."
    "bases":
      "得":
        "meaning": "a particle: can (after the verb)"
      "懂":
        "meaning": "to understand"
    "native": "Can I understand this book?"
  "zh-2435":
    "confusables":
      "w1":
        "why": "丢 (diū) is to lose, the opposite of finding."
      "w2":
        "why": "带 (dài) is to bring, not to find."
    "bases":
      "得":
        "meaning": "a particle: can (after the verb)"
      "到":
        "meaning": "to arrive; to reach"
    "native": "Can you find the keys?"
  "zh-2436":
    "confusables":
      "w1":
        "why": "做 (zuò) is to do, a general word."
      "w2":
        "why": "练习 (liànxí) is to practise, not to finish."
    "bases":
      "这么":
        "meaning": "so; this much"
      "完":
        "meaning": "finished"
    "native": "There is so much homework that I cannot finish it."
  "zh-2437":
    "confusables":
      "w1":
        "why": "卖 (mài) is to sell, the opposite of buying."
      "w2":
        "why": "借 (jiè) is to borrow, not to buy."
    "bases":
      "起":
        "meaning": "to rise; part of 买得起 (afford)"
    "native": "This thing is too expensive, and I cannot afford it."
  "zh-2438":
    "confusables":
      "w1":
        "why": "丢 (diū) is to lose, not to find."
      "w2":
        "why": "问 (wèn) is to ask, which you may do when lost."
    "bases":
      "到":
        "meaning": "to arrive; to reach"
    "native": "I cannot find the way."
  "zh-2439":
    "confusables":
      "w1":
        "why": "看 (kàn) is to look, not to hear."
      "w2":
        "why": "读 (dú) is to read aloud, not to hear."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
      "话":
        "meaning": "words; speech"
      "清楚":
        "meaning": "clear"
    "native": "I cannot hear clearly what you say."
