    "confusables":
      "w1":
        "why": "知道 (zhīdao) is to know a fact, a different sense."
      "w2":
        "why": "看 (kàn) is to look, a different act."
    "bases":
      "连":
        "meaning": "even"
    "native": "I do not know even one character."
  "zh-3141":
