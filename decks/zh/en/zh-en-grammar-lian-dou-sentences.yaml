"name": "连 (lián) ... 都 (dōu) and 不但 (bú dàn) ... 而且 (érqiě): even, and not only ... but also"
"description": "Sentences that stress even the smallest thing with 连 (lián) ... 都 (dōu), such as 我连一个字都不认识 (I do not know even one character), and that add a point with 不但 (bú dàn) ... 而且 (érqiě), such as 他不但聪明 (tā búdàn cōngming)，而且努力 (he is not only clever but also hard-working). Not yet checked by a Mandarin speaker: please report any mistake."
