"cards":
  "zh-3474":
    "native": "business affairs; commerce"
    "notes":
      "n1": "The work of buying, selling and trading. 商 (shāng) is trade, and 务 (wù) is affairs."
    "examples":
      "这是商务会议。": "This is a business meeting."
      "他去北京出差谈商务。":
        "native": "He went to Beijing on business."
        "bases":
          "北京":
            "meaning": "Beijing"
          "谈":
            "meaning": "to talk"
  "zh-3475":
    "native": "goods; commodity"
    "notes":
      "n1": "A thing made to be sold. 商 (shāng) is trade, and 品 (pǐn) is a thing."
    "examples":
      "这些商品很便宜。":
        "native": "These goods are very cheap."
        "bases":
          "这些":
            "meaning": "these"
      "商品有很多种。":
        "native": "There are many kinds of goods."
        "bases":
          "有":
            "meaning": "to have; there is"
          "种":
            "meaning": "kind; type"
  "zh-3476":
    "native": "trade"
    "notes":
      "n1": "The buying and selling of goods between countries. 贸 (mào) is to trade, and 易 (yì) is to exchange."
    "examples":
      "两国的贸易很多。":
        "native": "There is a lot of trade between the two countries."
        "bases":
          "的":
            "meaning": "of"
      "国际贸易在增加。":
        "native": "International trade is increasing."
        "bases":
          "国际":
            "meaning": "international"
  "zh-3477":
    "native": "to import"
    "notes":
      "n1": "To bring goods in from another country. 进 (jìn) is to enter, and 口 (kǒu) is a port."
    "examples":
      "我们进口这些机器。":
        "native": "We import these machines."
        "bases":
          "这些":
            "meaning": "these"
          "机器":
            "meaning": "machine"
      "进口的产品很贵。":
        "native": "Imported products are expensive."
        "bases":
          "的":
            "meaning": "of"
  "zh-3478":
    "native": "to sell wholesale"
    "notes":
      "n1": "To sell goods in large amounts to shops. 批 (pī) is a batch, and 发 (fā) is to send out."
    "examples":
      "这家公司做批发。": "This company does wholesale."
      "批发价格更低。":
        "native": "The wholesale price is lower."
        "bases":
          "低":
            "meaning": "low"
  "zh-3479":
    "native": "to sell retail"
    "notes":
      "n1": "To sell goods one by one to customers. 零 (líng) is small, and 售 (shòu) is to sell."
    "examples":
      "这家店做零售。": "This shop sells retail."
      "零售价格高一些。": "The retail price is a bit higher."
  "zh-3480":
    "native": "to supply"
    "notes":
      "n1": "To provide goods or services. 供 (gōng) is to supply, and 应 (yìng) is to respond."
    "examples":
      "我们供应电脑。": "We supply computers."
      "供应很稳定。":
        "native": "The supply is very stable."
        "bases":
          "稳定":
            "meaning": "stable"
  "zh-3481":
    "native": "supplier"
    "notes":
      "n1": "A company that provides goods to another. 供 (gōng) is to supply, 应 (yìng) is to respond, and 商 (shāng) is a trader."
    "examples":
      "这是我们的供应商。":
        "native": "This is our supplier."
        "bases":
          "的":
            "meaning": "of"
      "供应商换了。":
        "native": "The supplier has changed."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3482":
    "native": "to purchase"
    "notes":
      "n1": "To buy goods for a company. 采 (cǎi) is to collect, and 购 (gòu) is to buy."
    "examples":
      "他负责采购。": "He is in charge of purchasing."
      "采购了一批货。":
        "native": "We purchased a batch of goods."
        "bases":
          "了":
            "meaning": "a particle"
          "批":
            "meaning": "batch; to approve"
          "货":
            "meaning": "goods"
  "zh-3483":
    "native": "order (for goods)"
    "notes":
      "n1": "A written request to buy goods. 订 (dìng) is to order, and 单 (dān) is a list."
    "examples":
      "订单很多。": "There are many orders."
      "这个订单什么时候发货？":
        "native": "When will this order be shipped?"
        "bases":
          "发货":
            "meaning": "to ship goods"
  "zh-3484":
    "native": "stock; inventory"
    "notes":
      "n1": "The goods kept in a store. 库 (kù) is a store, and 存 (cún) is to keep."
    "examples":
      "库存不多了。":
        "native": "The stock is not very big now."
        "bases":
          "了":
            "meaning": "a particle"
      "我们要检查库存。":
        "native": "We must check the stock."
        "bases":
          "要":
            "meaning": "to want"
  "zh-3485":
    "native": "to invest"
    "notes":
      "n1": "To put money into something to earn more. 投 (tóu) is to throw in, and 资 (zī) is money."
    "examples":
      "他投资了一家公司。":
        "native": "He invested in a company."
        "bases":
          "了":
            "meaning": "a particle"
      "投资要小心。":
        "native": "Be careful when investing."
        "bases":
          "要":
            "meaning": "to want"
  "zh-3486":
    "native": "to raise money"
    "notes":
      "n1": "To get money for a business. 融 (róng) is to melt or blend, and 资 (zī) is money."
    "examples":
      "公司在融资。": "The company is raising money."
      "融资成功了。":
        "native": "The fundraising was successful."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3487":
    "native": "shares; stake"
    "notes":
      "n1": "A part of a company that one owns. 股 (gǔ) is a share, and 份 (fèn) is a part."
    "examples":
      "他有公司的股份。":
        "native": "He has a stake in the company."
        "bases":
          "有":
            "meaning": "to have; there is"
          "的":
            "meaning": "of"
      "股份增加了。":
        "native": "The shares have increased."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3488":
    "native": "funds"
    "notes":
      "n1": "Money used for a business or purpose. 资 (zī) is money, and 金 (jīn) is money."
    "examples":
      "资金不够。":
        "native": "There are not enough funds."
        "bases":
          "不够":
            "meaning": "not enough"
      "我们需要更多资金。": "We need more funds."
  "zh-3489":
    "native": "accounts; financial records"
    "notes":
      "n1": "The records of money coming in and going out. 账 (zhàng) is an account, and 目 (mù) is a list."
    "examples":
      "请检查账目。": "Please check the accounts."
      "账目很清楚。": "The accounts are very clear."
  "zh-3490":
    "native": "to make a profit"
    "notes":
      "n1": "To earn more money than one spends. 盈 (yíng) is surplus, and 利 (lì) is profit."
    "examples":
      "公司今年盈利了。":
        "native": "The company made a profit this year."
        "bases":
          "了":
            "meaning": "a particle"
      "盈利增加了。":
        "native": "The profit has increased."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3491":
    "native": "to make a loss"
    "notes":
      "n1": "To lose money. 亏 (kuī) is a deficit, and 损 (sǔn) is loss."
    "examples":
      "公司亏损了。":
        "native": "The company made a loss."
        "bases":
          "了":
            "meaning": "a particle"
      "亏损很严重。":
        "native": "The loss is very serious."
        "bases":
          "严重":
            "meaning": "serious"
  "zh-3492":
    "native": "to earn money"
    "notes":
      "n1": "To make money by working or trading. 赚 (zhuàn) is to earn, and 钱 (qián) is money."
    "examples":
      "他很会赚钱。":
        "native": "He is very good at making money."
        "bases":
          "会":
            "meaning": "can; to know how to"
      "这个生意很赚钱。": "This business makes a lot of money."
  "zh-3493":
    "native": "to go bankrupt"
    "notes":
      "n1": "To be unable to pay one's debts. 破 (pò) is to break, and 产 (chǎn) is property."
    "examples":
      "公司破产了。":
        "native": "The company went bankrupt."
        "bases":
          "了":
            "meaning": "a particle"
      "很多店破产了。":
        "native": "Many shops went bankrupt."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3494":
    "native": "to close down"
    "notes":
      "n1": "For a business to stop operating. 倒 (dǎo) is to fall, and 闭 (bì) is to close."
    "examples":
      "这家店倒闭了。":
        "native": "This shop has closed down."
        "bases":
          "了":
            "meaning": "a particle"
      "工厂倒闭了。":
        "native": "The factory has closed down."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3495":
    "native": "to expand"
    "notes":
      "n1": "To make bigger. 扩 (kuò) is to expand, and 大 (dà) is big."
    "examples":
      "我们要扩大市场。":
        "native": "We want to expand the market."
        "bases":
          "要":
            "meaning": "to want"
      "公司扩大了规模。":
        "native": "The company expanded its scale."
        "bases":
          "了":
            "meaning": "a particle"
          "规模":
            "meaning": "scale"
  "zh-3496":
    "native": "to shrink; to reduce"
    "notes":
      "n1": "To make smaller. 缩 (suō) is to shrink, and 小 (xiǎo) is small."
    "examples":
      "我们要缩小范围。":
        "native": "We want to narrow the range."
        "bases":
          "要":
            "meaning": "to want"
          "范围":
            "meaning": "range"
      "成本缩小了。":
        "native": "The cost has come down."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3497":
    "native": "to compete"
    "notes":
      "n1": "To try to be better than others. 竞 (jìng) is to compete, and 争 (zhēng) is to contend."
    "examples":
      "两家公司在竞争。": "The two companies are competing."
      "竞争很激烈。":
        "native": "The competition is fierce."
        "bases":
          "激烈":
            "meaning": "fierce"
  "zh-3498":
    "native": "trademark"
    "notes":
      "n1": "A name or sign that identifies a company's product. 商 (shāng) is trade, and 标 (biāo) is a mark."
    "examples":
      "这个商标很有名。": "This trademark is very famous."
      "商标注册了吗？":
        "native": "Has the trademark been registered?"
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3499":
    "native": "patent"
    "notes":
      "n1": "The legal right to be the only maker of an invention. 专 (zhuān) is exclusive, and 利 (lì) is right."
    "examples":
      "这项技术有专利。":
        "native": "This technology is patented."
        "bases":
          "项":
            "meaning": "measure word for items"
          "技术":
            "meaning": "technology"
          "有":
            "meaning": "to have; there is"
      "申请专利要多久？":
        "native": "How long does a patent application take?"
        "bases":
          "要":
            "meaning": "to want"
          "久":
            "meaning": "long (of time)"
  "zh-3500":
    "native": "copyright"
    "notes":
      "n1": "The legal right to own a creative work. 版 (bǎn) is an edition, and 权 (quán) is right."
    "examples":
      "这本书有版权。":
        "native": "This book is under copyright."
        "bases":
          "有":
            "meaning": "to have; there is"
      "不要侵犯版权。":
        "native": "Do not infringe copyright."
        "bases":
          "不要":
            "meaning": "do not"
          "侵犯":
            "meaning": "to infringe"
  "zh-3501":
    "native": "agreement"
    "notes":
      "n1": "A written deal between two sides. 协 (xié) is to cooperate, and 议 (yì) is to discuss."
    "examples":
      "我们签了协议。":
        "native": "We signed an agreement."
        "bases":
          "签":
            "meaning": "to sign"
          "了":
            "meaning": "a particle"
      "协议还没有结束。":
        "native": "The agreement is not yet finished."
        "bases":
          "没有":
            "meaning": "there is not"
  "zh-3502":
    "native": "to sign a contract"
    "notes":
      "n1": "To sign an agreement. 签 (qiān) is to sign, and 约 (yuē) is an agreement."
    "examples":
      "我们今天签约。": "We sign the contract today."
      "签约仪式很隆重。":
        "native": "The signing ceremony was very formal."
        "bases":
          "仪式":
            "meaning": "ceremony"
          "隆重":
            "meaning": "formal; grand"
  "zh-3503":
    "native": "to break a contract"
    "notes":
      "n1": "To not do what a contract says. 违 (wéi) is to break, and 约 (yuē) is a contract."
    "examples":
      "他违约了。":
        "native": "He broke the contract."
        "bases":
          "了":
            "meaning": "a particle"
      "违约要赔偿。":
        "native": "Breaking the contract means paying compensation."
        "bases":
          "要":
            "meaning": "to want"
  "zh-3504":
    "native": "to compensate"
    "notes":
      "n1": "To pay for loss or damage. 赔 (péi) is to pay back, and 偿 (cháng) is to repay."
    "examples":
      "公司要赔偿损失。":
        "native": "The company must compensate for the loss."
        "bases":
          "要":
            "meaning": "to want"
          "损失":
            "meaning": "loss"
      "赔偿的金额是多少？":
        "native": "How much is the compensation?"
        "bases":
          "的":
            "meaning": "of"
          "金额":
            "meaning": "amount of money"
  "zh-3505":
    "native": "to guarantee"
    "notes":
      "n1": "To promise that something will happen. 保 (bǎo) is to protect, and 证 (zhèng) is to prove."
    "examples":
      "我们保证质量。": "We guarantee the quality."
      "这个保证很有用。":
        "native": "This guarantee is very useful."
        "bases":
          "有用":
            "meaning": "useful"
  "zh-3506":
    "native": "credit; trust"
    "notes":
      "n1": "How much other people trust you to pay. 信 (xìn) is trust, and 用 (yòng) is use."
    "examples":
      "他的信用很好。":
        "native": "His credit is very good."
        "bases":
          "的":
            "meaning": "of"
      "信用卡很方便。": "Credit cards are very convenient."
  "zh-3507":
    "native": "honesty and trust"
    "notes":
      "n1": "Being honest and trustworthy. 诚 (chéng) is honest, and 信 (xìn) is trust."
    "examples":
      "诚信很重要。": "Honesty is very important."
      "这家公司很有诚信。":
        "native": "This company is very trustworthy."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-3508":
    "native": "strategy"
    "notes":
      "n1": "A long-term plan for a business. 战 (zhàn) is war, and 略 (lüè) is a plan."
    "examples":
      "公司的战略很清楚。":
        "native": "The company's strategy is very clear."
        "bases":
          "的":
            "meaning": "of"
      "我们要改变战略。":
        "native": "We must change our strategy."
        "bases":
          "要":
            "meaning": "to want"
  "zh-3509":
    "native": "tactic; approach"
    "notes":
      "n1": "A plan for achieving a goal in a short time. 策 (cè) is a plan, and 略 (lüè) is a scheme."
    "examples":
      "这个策略很好。": "This tactic is very good."
      "销售策略要改。":
        "native": "The sales approach must change."
        "bases":
          "要":
            "meaning": "to want"
          "改":
            "meaning": "to change"
  "zh-3510":
    "native": "marketing"
    "notes":
      "n1": "The work of selling and promoting goods. 营 (yíng) is to run, and 销 (xiāo) is to sell."
    "examples":
      "我们做营销。": "We do marketing."
      "营销很重要。": "Marketing is very important."
  "zh-3511":
    "native": "to promote"
    "notes":
      "n1": "To make something widely known. 推 (tuī) is to push, and 广 (guǎng) is wide."
    "examples":
      "我们推广新产品。": "We promote the new product."
      "推广很成功。": "The promotion was very successful."
  "zh-3512":
    "native": "to advertise; to publicise"
    "notes":
      "n1": "To tell many people about something. 宣 (xuān) is to announce, and 传 (chuán) is to pass on."
    "examples":
      "我们宣传这个活动。":
        "native": "We publicise this event."
        "bases":
          "活动":
            "meaning": "activity"
      "宣传材料在哪里？":
        "native": "Where are the promotional materials?"
        "bases":
          "材料":
            "meaning": "material"
  "zh-3513":
    "native": "to consume; to spend"
    "notes":
      "n1": "To spend money on goods or services. 消 (xiāo) is to use up, and 费 (fèi) is a fee."
    "examples":
      "大家消费得很多。":
        "native": "Everyone is spending a lot."
        "bases":
          "得":
            "meaning": "a particle: how it is done"
      "消费水平提高了。":
        "native": "The level of spending has risen."
        "bases":
          "水平":
            "meaning": "level"
          "了":
            "meaning": "a particle"
  "zh-3514":
    "native": "consumer"
    "notes":
      "n1": "A person who buys goods or services. 消 (xiāo) is to use up, 费 (fèi) is a fee, and 者 (zhě) is a person."
    "examples":
      "消费者很关心价格。":
        "native": "Consumers care a lot about price."
        "bases":
          "关心":
            "meaning": "to care about"
      "我们保护消费者的权利。":
        "native": "We protect consumers' rights."
        "bases":
          "的":
            "meaning": "of"
  "zh-3515":
    "native": "income"
    "notes":
      "n1": "The money that comes in. 收 (shōu) is to receive, and 入 (rù) is to enter."
    "examples":
      "他的收入很高。":
        "native": "His income is very high."
        "bases":
          "的":
            "meaning": "of"
      "收入增加了。":
        "native": "Income has increased."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3516":
    "native": "interest (on money)"
    "notes":
      "n1": "The money paid for borrowing or lending. 利 (lì) is profit, and 息 (xī) is interest."
    "examples":
      "利息很低。":
        "native": "The interest is very low."
        "bases":
          "低":
            "meaning": "low"
      "银行的利息增加了。":
        "native": "The bank's interest has gone up."
        "bases":
          "的":
            "meaning": "of"
          "了":
            "meaning": "a particle"
  "zh-3517":
    "native": "loan"
    "notes":
      "n1": "Money borrowed from a bank. 贷 (dài) is to lend, and 款 (kuǎn) is money."
    "examples":
      "我想申请贷款。": "I want to apply for a loan."
      "贷款要还利息。":
        "native": "A loan must be repaid with interest."
        "bases":
          "要":
            "meaning": "to want"
  "zh-3518":
    "native": "to go public; to go on sale"
    "notes":
      "n1": "For a company to sell its shares, or for a product to go on sale. 上 (shàng) is on, and 市 (shì) is a market."
    "examples":
      "公司明年上市。": "The company goes public next year."
      "新产品上市了。":
        "native": "The new product is on sale."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3519":
    "native": "to act as agent"
    "notes":
      "n1": "To act for someone else in business. 代 (dài) is to replace, and 理 (lǐ) is to manage."
    "examples":
      "我们代理这个品牌。": "We act as agent for this brand."
      "代理商很多。":
        "native": "There are many agents."
        "bases":
          "代理商":
            "meaning": "agent"
  "zh-3520":
    "native": "to join a chain"
    "notes":
      "n1": "To become part of a franchise. 加 (jiā) is to add, and 盟 (méng) is an alliance."
    "examples":
      "他想加盟这个品牌。": "He wants to join this brand as a franchise."
      "加盟费多少？":
        "native": "How much is the franchise fee?"
        "bases":
          "加盟费":
            "meaning": "franchise fee"
  "zh-3521":
    "native": "shop; store"
    "notes":
      "n1": "A shop or outlet of a company. 门 (mén) is a door, and 店 (diàn) is a shop."
    "examples":
      "这个门店很大。": "This store is very big."
      "门店每天营业。":
        "native": "The stores open every day."
        "bases":
          "每天":
            "meaning": "every day"
  "zh-3522":
    "native": "branch store"
    "notes":
      "n1": "A shop that is part of a larger chain. 分 (fēn) is to divide, and 店 (diàn) is a shop."
    "examples":
