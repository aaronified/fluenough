        "native": "Reading helps us improve our Chinese."
        "bases":
          "阅读":
            "meaning": "to read"
          "能":
            "meaning": "can"
          "中文":
            "meaning": "Chinese language"
  "zh-4734":
    "native": "to read aloud"
    "notes":
      "n1": "朗读 (lǎngdú) is to read a text aloud, clearly and with rhythm, as a poem is read in class. 读 (dú) alone can be silent, and 念 (niàn) means to read out words, as from a list."
    "examples":
      "老师请我朗读这首诗。":
        "native": "The teacher asked me to read this poem aloud."
        "bases":
          "老师":
            "meaning": "teacher"
          "请":
            "meaning": "please"
          "我":
            "meaning": "I"
          "朗读":
            "meaning": "to read aloud"
          "首":
            "meaning": "measure for poems"
      "朗读诗的时候要注意节奏。":
        "native": "When reading a poem aloud, pay attention to the rhythm."
        "bases":
          "朗读":
            "meaning": "to read aloud"
          "的":
            "meaning": "particle"
          "时候":
            "meaning": "time; moment"
          "要":
