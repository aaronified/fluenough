"cards":
  "zh-4713":
    "native": "book review"
    "notes":
      "n1": "书评 (shūpíng) is a short review of one book: what it is about and whether it is good. 影评 (yǐngpíng) reviews a film, and 乐评 (yuèpíng) reviews music."
    "examples":
      "我在报纸上看到一篇书评。":
        "native": "I saw a book review in the newspaper."
        "bases":
          "我":
            "meaning": "I"
          "看到":
            "meaning": "see; come across"
          "篇":
            "meaning": "measure for articles"
          "书评":
            "meaning": "book review"
      "这个书评很短。":
        "native": "This book review is very short."
        "bases":
          "书评":
            "meaning": "book review"
          "很":
            "meaning": "very"
  "zh-4714":
    "native": "publishing house"
    "notes":
      "n1": "出版社 (chūbǎnshè) is a company that prints and sells books. 出版 (chūbǎn) is the verb to publish, so 出版了 (chūbǎn le) means it has been published."
    "examples":
      "这家出版社出版很多小说。":
        "native": "This publishing house publishes many novels."
        "bases":
          "出版社":
            "meaning": "publishing house"
          "很多":
            "meaning": "many"
      "我喜欢这家出版社的书。":
        "native": "I like this publisher's books."
        "bases":
          "我":
            "meaning": "I"
          "出版社":
            "meaning": "publishing house"
          "的":
            "meaning": "particle"
  "zh-4715":
    "native": "chapter; section of a book"
    "notes":
      "n1": "章节 (zhāngjié) is a section of a book, with its number or title. 一章 (yì zhāng) is one chapter, and 第一章 (dì yī zhāng) is Chapter One."
    "examples":
      "这一章很长。":
        "native": "This chapter is very long."
        "bases":
          "章":
            "meaning": "chapter"
          "很":
            "meaning": "very"
      "我读完了这个章节。":
        "native": "I finished reading this chapter."
        "bases":
          "我":
            "meaning": "I"
          "完":
            "meaning": "finish"
          "了":
            "meaning": "completed-action particle"
          "章节":
            "meaning": "chapter; section of a book"
  "zh-4716":
    "native": "paragraph"
    "notes":
      "n1": "段落 (duànluò) is a paragraph, the group of sentences about one point. 一段 (yí duàn) is one paragraph or passage, counted with the measure 段 (duàn)."
    "examples":
      "第二段落写得很清楚。":
        "native": "The second paragraph is written very clearly."
        "bases":
          "第":
            "meaning": "ordinal prefix"
          "段落":
            "meaning": "paragraph"
          "写":
            "meaning": "write"
          "得":
            "meaning": "particle"
          "很":
            "meaning": "very"
      "每个段落都很短。":
        "native": "Every paragraph is very short."
        "bases":
          "段落":
            "meaning": "paragraph"
          "都":
            "meaning": "all; both"
          "很":
            "meaning": "very"
  "zh-4717":
    "native": "protagonist; main character"
    "notes":
      "n1": "主人公 (zhǔréngōng) is the main character of a story, the one whose choices drive the plot. 主角 (zhǔjué) is the lead of a play or film, and 配角 (pèijué) is a supporting role."
    "examples":
      "这部小说的主人公是一个老师。":
        "native": "The protagonist of this novel is a teacher."
        "bases":
          "部":
            "meaning": "measure for works"
          "的":
            "meaning": "particle"
          "主人公":
            "meaning": "protagonist; main character"
          "是":
            "meaning": "is"
          "老师":
            "meaning": "teacher"
      "主人公很勇敢。":
        "native": "The protagonist is very brave."
        "bases":
          "主人公":
            "meaning": "protagonist; main character"
          "很":
            "meaning": "very"
  "zh-4718":
    "native": "theme (of a work)"
    "notes":
      "n1": "主题 (zhǔtí) is the central idea a work is about, such as friendship or war. 题目 (tímù) is a title or the subject set for a task, which is narrower than a theme."
    "examples":
      "这本书的主题是友谊。":
        "native": "The theme of this book is friendship."
        "bases":
          "的":
            "meaning": "particle"
          "主题":
            "meaning": "theme (of a work)"
          "是":
            "meaning": "is"
      "这首诗的主题很清楚。":
        "native": "The theme of this poem is very clear."
        "bases":
          "首":
            "meaning": "measure for poems"
          "的":
            "meaning": "particle"
          "主题":
            "meaning": "theme (of a work)"
          "很":
            "meaning": "very"
  "zh-4719":
    "native": "beginning; opening"
    "notes":
      "n1": "开头 (kāitóu) is the start of a text, a story or an event. 结尾 (jiéwěi) is the ending, and 开始 (kāishǐ) is the verb to begin, used for actions as well as texts."
    "examples":
      "这本小说的开头很有趣。":
        "native": "The opening of this novel is very interesting."
        "bases":
          "的":
            "meaning": "particle"
          "开头":
            "meaning": "beginning; opening"
          "很":
            "meaning": "very"
      "我们读完开头就想继续读。":
        "native": "After we read the opening, we wanted to keep reading."
        "bases":
          "完":
            "meaning": "finish"
          "开头":
            "meaning": "beginning; opening"
  "zh-4720":
    "native": "metaphor; comparison"
    "notes":
      "n1": "比喻 (bǐyù) is a figure of speech that describes one thing as another, such as 时间是金钱 (shíjiān shì jīnqián), time is money. 比 (bǐ) alone means to compare."
    "examples":
      "作者用了一个比喻。":
        "native": "The author used a metaphor."
        "bases":
          "用":
            "meaning": "use"
          "了":
            "meaning": "completed-action particle"
          "比喻":
            "meaning": "metaphor; comparison"
      "这句话是比喻不是真的。":
        "native": "This sentence is a metaphor, not the literal meaning."
        "bases":
          "句":
            "meaning": "measure for sentences"
          "话":
            "meaning": "words; speech"
          "是":
            "meaning": "is"
          "比喻":
            "meaning": "metaphor; comparison"
          "不":
            "meaning": "not"
          "真的":
            "meaning": "truly"
  "zh-4721":
    "native": "line of a poem"
    "notes":
      "n1": "诗句 (shījù) is one line of a poem. 句子 (jùzi) is any sentence, in prose or poetry. 名句 (míngjù) is a famous line that people quote."
    "examples":
      "老师读了一句诗句。":
        "native": "The teacher read out one line of the poem."
        "bases":
          "老师":
            "meaning": "teacher"
          "了":
            "meaning": "completed-action particle"
          "句":
            "meaning": "measure for sentences"
          "诗句":
            "meaning": "line of a poem"
      "这首诗的诗句很美。":
        "native": "The lines of this poem are very beautiful."
        "bases":
          "首":
            "meaning": "measure for poems"
          "的":
            "meaning": "particle"
          "诗句":
            "meaning": "line of a poem"
          "很":
            "meaning": "very"
          "美":
            "meaning": "beautiful"
  "zh-4722":
    "native": "to rhyme"
    "notes":
      "n1": "押韵 (yāyùn) means that the ends of lines share the same final sound, as in many Chinese poems. 韵 (yùn) is the rhyme itself, the final sound that is repeated."
    "examples":
      "这首诗押韵。":
        "native": "This poem rhymes."
        "bases":
          "首":
            "meaning": "measure for poems"
          "押韵":
            "meaning": "to rhyme"
      "我们在课上学了怎么押韵。":
        "native": "In class we learned how to make lines rhyme."
        "bases":
          "课上":
            "meaning": "in class"
          "了":
            "meaning": "completed-action particle"
          "怎么":
            "meaning": "how"
          "押韵":
            "meaning": "to rhyme"
  "zh-4723":
    "native": "famous classic work"
    "notes":
      "n1": "名著 (míngzhù) is a famous book that is studied and admired for many years, such as 红楼梦 (Hónglóu Mèng), Dream of the Red Chamber. It is used only for written works, and 经典 (jīngdiǎn) is wider."
    "examples":
      "这是一部名著。":
        "native": "This is a famous classic."
        "bases":
          "是":
            "meaning": "is"
          "部":
            "meaning": "measure for works"
          "名著":
            "meaning": "famous classic work"
      "我每年都读一本名著。":
        "native": "Every year I read a famous classic."
        "bases":
          "我":
            "meaning": "I"
          "都":
            "meaning": "all; both"
          "名著":
            "meaning": "famous classic work"
  "zh-4724":
    "native": "classic; classic example"
    "notes":
      "n1": "经典 (jīngdiǎn) names a work of lasting value, or the best example of its kind, as in 经典台词 (jīngdiǎn táicí), a famous line from a film. Unlike 名著 (míngzhù), it can also be used for films and songs."
    "examples":
      "这首歌是经典。":
        "native": "This song is a classic."
        "bases":
          "首":
            "meaning": "measure for poems"
          "是":
            "meaning": "is"
          "经典":
            "meaning": "classic; classic example"
      "很多人都读过这本经典。":
        "native": "Many people have read this classic."
        "bases":
          "很多":
            "meaning": "many"
          "人":
            "meaning": "person"
          "都":
            "meaning": "all; both"
          "读过":
            "meaning": "have read"
          "经典":
            "meaning": "classic; classic example"
  "zh-4725":
    "native": "emotion; feeling"
    "notes":
      "n1": "情感 (qínggǎn) is an emotion, or the feeling a text carries, such as love or grief. 感情 (gǎnqíng) is more personal: the feelings between two people, or fondness for someone."
    "examples":
      "这首诗充满了情感。":
        "native": "This poem is full of emotion."
        "bases":
          "首":
            "meaning": "measure for poems"
          "充满":
            "meaning": "be full of"
          "了":
            "meaning": "completed-action particle"
          "情感":
            "meaning": "emotion; feeling"
      "作者用简单的句子表达情感。":
        "native": "The author expresses feeling with simple sentences."
        "bases":
          "用":
            "meaning": "use"
          "的":
            "meaning": "particle"
          "句子":
            "meaning": "sentence"
          "表达":
            "meaning": "express"
          "情感":
            "meaning": "emotion; feeling"
  "zh-4726":
    "native": "humorous; funny"
    "notes":
      "n1": "幽默 (yōumò) describes writing or a person who makes you smile with wit. 有趣 (yǒuqù) is the plainer word for interesting or fun, and 好笑 (hǎoxiào) means funny in the sense of making you laugh."
    "examples":
      "这本书很幽默。":
        "native": "This book is very funny."
        "bases":
          "很":
            "meaning": "very"
          "幽默":
            "meaning": "humorous; funny"
      "他的文章很幽默。":
        "native": "His writing is very humorous."
        "bases":
          "他":
            "meaning": "he"
          "的":
            "meaning": "particle"
          "很":
            "meaning": "very"
          "幽默":
            "meaning": "humorous; funny"
  "zh-4727":
    "native": "legend"
    "notes":
      "n1": "传说 (chuánshuō) is a story handed down from earlier times, which may or may not be true, usually about a place or a person. 故事 (gùshi) is any story, and 神话 (shénhuà) is a myth about gods."
    "examples":
      "这个地方有一个传说。":
        "native": "This place has a legend."
        "bases":
          "有":
            "meaning": "have"
          "传说":
            "meaning": "legend"
      "老人给我们讲了一个传说。":
        "native": "The old man told us a legend."
        "bases":
          "给":
            "meaning": "to; for"
          "了":
            "meaning": "completed-action particle"
          "传说":
            "meaning": "legend"
  "zh-4728":
    "native": "myth"
    "notes":
      "n1": "神话 (shénhuà) is a myth: a story about gods, spirits or how the world began, such as 嫦娥奔月 (Cháng'é bēn yuè), Chang'e flying to the moon. 传说 (chuánshuō) is a legend about people, closer to history."
    "examples":
      "很多文化都有自己的神话。":
        "native": "Many cultures have their own myths."
        "bases":
          "很多":
            "meaning": "many"
          "都":
            "meaning": "all; both"
          "有":
            "meaning": "have"
          "的":
            "meaning": "particle"
          "神话":
            "meaning": "myth"
      "这个神话讲的是太阳和月亮。":
        "native": "This myth is about the sun and the moon."
        "bases":
          "神话":
            "meaning": "myth"
          "的":
            "meaning": "particle"
          "是":
            "meaning": "is"
          "和":
            "meaning": "and"
  "zh-4729":
    "native": "fable"
    "notes":
      "n1": "寓言 (yùyán) is a short story, often with animals, that teaches a lesson, such as 守株待兔 (shǒu zhū dài tù), waiting by a stump for a rabbit. 童话 (tónghuà) is a fairy tale for children."
    "examples":
      "这则寓言很短。":
        "native": "This fable is very short."
        "bases":
          "则":
            "meaning": "measure for short items"
          "寓言":
            "meaning": "fable"
          "很":
            "meaning": "very"
      "寓言里的动物会说话。":
        "native": "The animals in a fable can talk."
        "bases":
          "寓言":
            "meaning": "fable"
          "的":
            "meaning": "particle"
          "会":
            "meaning": "can; will"
          "说话":
            "meaning": "speak"
  "zh-4730":
    "native": "fairy tale"
    "notes":
      "n1": "童话 (tónghuà) is a fairy tale written for children, with magic and a happy ending. 儿童文学 (értóng wénxué) is the wider field of books for children."
    "examples":
      "我小时候最喜欢读童话。":
        "native": "When I was little I liked fairy tales most."
        "bases":
