  "zh-4733":
    "native": "to read"
    "notes":
      "n1": "阅读 (yuèdú) is reading, a formal word for reading texts. 读 (dú) is the everyday verb to read, and 看书 (kànshū) means to read a book or to look at books."
    "examples":
      "我每天晚上都阅读。":
        "native": "I read every evening."
        "bases":
          "我":
            "meaning": "I"
          "每天":
