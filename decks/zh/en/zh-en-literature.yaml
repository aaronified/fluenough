          "很":
            "meaning": "very"
          "美好":
            "meaning": "happy; good"
  "zh-4731":
    "native": "poet"
    "notes":
      "n1": "诗人 (shīrén) is a poet, a person who writes poems. 作家 (zuòjiā) is a writer of any kind of text, and 诗 (shī) is the poem itself."
