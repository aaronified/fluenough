  "zh-4732":
    "native": "article; essay; piece of writing"
    "notes":
      "n1": "文章 (wénzhāng) is a piece of writing, such as an essay or an article in a magazine. 作文 (zuòwén) is a composition written as a school task, and 文字 (wénzì) is writing as a system of characters."
    "examples":
      "这篇文章写得很好。":
        "native": "This article is very well written."
        "bases":
