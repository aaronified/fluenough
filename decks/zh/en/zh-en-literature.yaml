  "zh-4736":
    "native": "implied meaning; connotation"
    "notes":
      "n1": "含义 (hányì) is the meaning a word or text carries beneath its plain sense. 意思 (yìsi) is the plain meaning of words in everyday talk, and 意义 (yìyì) is the value or importance of something."
    "examples":
      "这句话的含义很深。":
        "native": "The meaning of this sentence is very deep."
        "bases":
