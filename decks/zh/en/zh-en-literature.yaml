          "含义":
            "meaning": "implied meaning; connotation"
  "zh-4737":
    "native": "to symbolise; symbol"
    "notes":
      "n1": "象征 (xiàngzhēng) means to stand for something else, as a dove stands for peace. As a noun it is the symbol itself. 标志 (biāozhì) is a sign that identifies something, such as a road sign."
    "examples":
      "鸽子象征和平。":
        "native": "The dove symbolises peace."
        "bases":
          "鸽子":
            "meaning": "dove"
          "象征":
            "meaning": "to symbolise; symbol"
      "红色在这首诗里象征爱情。":
        "native": "In this poem, red stands for love."
        "bases":
          "首":
            "meaning": "measure for poems"
          "象征":
            "meaning": "to symbolise; symbol"
  "zh-4738":
    "native": "allusion; classical story"
    "notes":
