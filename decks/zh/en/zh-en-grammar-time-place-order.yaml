  "notes": "Chinese says the time first, then the place, then the verb: who, when, where, what is done. 我七点在家吃饭 (wǒ qī diǎn zài jiā chīfàn) is I eat at seven at home, with both before the verb; English puts them after it. The time may also open the sentence: 七点我在家吃饭 (qī diǎn wǒ zài jiā chīfàn). The place is 在 (zài) and the place word: 在家 (zài jiā), at home. A clock time is the number and 点 (diǎn): 七点 (qī diǎn), seven o'clock. A word that says when something happens never follows the verb."
