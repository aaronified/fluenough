"cards":
  "zh-2147":
    "confusables":
      "w1":
        "why": "运动员 (yùndòngyuán) is an athlete, a player not a coach."
      "w2":
        "why": "裁判 (cáipàn) is a referee, who judges the game."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "He is our coach."
  "zh-2148":
    "confusables":
      "w1":
        "why": "决赛 (juésài) is the final, one match in the series."
      "w2":
        "why": "预赛 (yùsài) is the heat, an earlier round."
    "bases":
      "激烈":
        "meaning": "fierce; intense"
    "native": "This match is very fierce."
  "zh-2149":
    "confusables":
      "w1":
        "why": "输 (shū) is to lose, the opposite of win."
      "w2":
        "why": "平局 (píngjú) is a draw, neither wins."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "She won the final."
  "zh-2150":
    "confusables":
      "w1":
        "why": "银牌 (yínpái) is a silver medal, second place."
      "w2":
        "why": "铜牌 (tóngpái) is a bronze medal, third place."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "He took the gold medal."
  "zh-2151":
    "confusables":
      "w1":
        "why": "犯规 (fànguī) is a foul, the reason for the whistle."
      "w2":
        "why": "球场 (qiúchǎng) is the pitch, the place."
    "bases":
      "吹":
        "meaning": "to blow (a whistle)"
      "了":
        "meaning": "a particle: a change has happened"
      "哨子":
        "meaning": "whistle"
    "native": "The referee blew the whistle."
  "zh-2152":
    "confusables":
      "w1":
        "why": "锻炼 (duànliàn) is to exercise, a wider idea."
      "w2":
        "why": "跑步 (pǎobù) is to run, an activity not a warm-up."
    "bases":
      "每天":
        "meaning": "every day"
      "一下":
        "meaning": "a little; have a try"
    "native": "I warm up for a moment every day."
  "zh-2153":
    "confusables":
      "w1":
        "why": "后卫 (hòuwèi) is a defender, another position."
      "w2":
        "why": "前锋 (qiánfēng) is a forward, another position."
    "bases":
      "球队":
        "meaning": "team (of a ball game)"
      "的":
        "meaning": "a particle: of; belonging to"
      "厉害":
        "meaning": "awesome; formidable"
    "native": "The goalkeeper of this team is very good."
  "zh-2154":
    "confusables":
      "w1":
        "why": "进球 (jìnqiú) is to score, the result of a shot."
      "w2":
        "why": "罚球 (fáqiú) is a free kick, a different shot."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "He has shot at goal."
