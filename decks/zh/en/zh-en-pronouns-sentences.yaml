"cards":
  "zh-0167":
    "native": "Are you all students?"
    "confusables":
      "w1":
        "why": "我们 (wǒmen) would ask whether we are all students, not you."
      "w2":
        "why": "他们 (tāmen) would ask whether they are all students, not you."
  "zh-0168":
    "native": "They are well."
    "confusables":
      "w1":
        "why": "你们 (nǐmen) would say you are well, not they."
      "w2":
        "why": "她们 (tāmen) would say the women are well, not that the group is."
  "zh-0169":
    "native": "She is a teacher too."
    "confusables":
      "w1":
        "why": "我 (wǒ) would say I am also a teacher, not she."
      "w2":
        "why": "他 (tā) would say he is also a teacher, not she."
  "zh-0170":
    "native": "We are all very happy."
    "confusables":
      "w1":
        "why": "你们 (nǐmen) would say you are all happy, not we."
      "w2":
        "why": "大家 (dàjiā) would say everyone is happy, not that we are."
  "zh-0171":
    "native": "Who is this?"
    "confusables":
      "w1":
        "why": "那 (nà) would ask who that is, not who this is."
      "w2":
        "why": "他 (tā) would ask who he is, not who this is."
  "zh-0172":
    "native": "Is that a friend?"
    "confusables":
      "w1":
        "why": "这 (zhè) would ask whether this is a friend, not that."
      "w2":
        "why": "他 (tā) would ask whether he is a friend, not that."
  "zh-0173":
    "native": "Other people are all fine."
    "confusables":
      "w1":
        "why": "大家 (dàjiā) would say everyone is fine, including you."
      "w2":
        "why": "自己 (zìjǐ) would say oneself is fine, not other people."
  "zh-0174":
    "native": "Are you all coming yourselves?"
    "confusables":
      "w1":
        "why": "我们 (wǒmen) would ask whether we ourselves come, not you."
      "w2":
        "why": "他们 (tāmen) would ask whether they come, not you."
