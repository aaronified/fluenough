"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0800":
    "native": "I buy apples at the food market."
    "confusables":
      "w1":
        "why": "市场 (shìchǎng) is any market, not the food market."
      "w2":
        "why": "卖 (mài) is 'to sell', so it would say the opposite of buy."
  "zh-0801":
    "native": "How much is this watermelon per jin?"
    "confusables":
      "w1":
        "why": "块 (kuài) counts yuan, the money, not the weight of the watermelon."
      "w2":
        "why": "公斤 (gōngjīn) is a kilogram, a different unit from the jin."
  "zh-0802":
    "native": "Boss, are the apples sweet?"
    "confusables":
      "w1":
        "why": "酸 (suān) is 'sour', the opposite taste."
      "w2":
        "why": "辣 (là) is 'spicy', a different taste."
  "zh-0803":
    "native": "Please weigh two jin of apples for me."
    "confusables":
      "w1":
        "why": "秤 (chèng) is the scale, a noun, not the verb to weigh."
      "w2":
        "why": "买 (mǎi) is 'to buy', not 'to weigh'."
  "zh-0804":
    "native": "We queue in the market to pay."
    "confusables":
      "w1":
        "why": "收 (shōu) is 'to take money', the seller's side, not to pay."
      "w2":
        "why": "讲价 (jiǎngjià) is 'to bargain', not 'to pay'."
  "zh-0805":
    "native": "Everyone says the morning market is lively."
    "confusables":
      "w1":
        "why": "热 (rè) is hot in temperature, not lively."
      "w2":
        "why": "吵 (chǎo) is noisy, which is not the same as lively."
  "zh-0806":
    "native": "Is there a bag in the basket?"
    "confusables":
      "w1":
        "why": "桌子 (zhuōzi) is a table, a different place for a bag."
      "w2":
        "why": "椅子 (yǐzi) is a chair, a different place for a bag."
    "bases":
      "有": { "meaning": "to have; there is" }
  "zh-0807":
    "native": "Where is the receipt?"
    "confusables":
      "w1":
        "why": "零钱 (língqián) is small change, not a receipt."
      "w2":
        "why": "现金 (xiànjīn) is cash, not a receipt."
