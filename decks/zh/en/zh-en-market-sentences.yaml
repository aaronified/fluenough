"name": "Market in sentences"
"description": "Sentences at the market: buying apples at the food market, the price of a watermelon per jin, asking whether the apples are sweet, weighing apples, queuing to pay, the morning market, a bag in a basket, and a receipt. Not yet checked by a Mandarin speaker: please report any mistake."
