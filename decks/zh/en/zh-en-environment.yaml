"cards":
  "zh-3610":
    "native": "environmental protection"
    "notes":
      "n1": "Care for the environment. 环 (huán) is the environment, and 保 (bǎo) is to protect."
    "examples":
      "环保很重要。": "Environmental protection is very important."
      "我们做环保工作。": "We do environmental work."
  "zh-3611":
    "native": "air pollution"
    "notes":
      "n1": "Dirty air caused by harmful substances. 空 (kōng) is air, 气 (qì) is air, 污 (wū) is dirt, and 染 (rǎn) is to stain."
    "examples":
      "空气污染很严重。":
        "native": "Air pollution is very serious."
        "bases":
          "严重":
            "meaning": "serious"
      "要减少空气污染。":
        "native": "We must reduce air pollution."
        "bases":
          "要":
            "meaning": "to need"
