"cards":
  "zh-4774":
    "native": "to find; manage to find"
    "notes":
      "n1": "找到 (zhǎodào) means to find something after looking for it, so the result 到 (dào), reached, is part of the verb. 找 (zhǎo) alone is only to look for. 找不到 (zhǎobudào) means cannot find."
    "examples":
      "我找了很久才找到钥匙。":
        "native": "I looked for a long time before I found the keys."
        "bases":
          "我":
            "meaning": "I"
          "了":
            "meaning": "completed-action particle"
          "很久":
            "meaning": "a long time"
          "才":
            "meaning": "only then"
          "找到":
            "meaning": "to find; manage to find"
      "你找到工作了吗？":
        "native": "Have you found a job?"
        "bases":
          "你":
            "meaning": "you"
          "找到":
            "meaning": "to find; manage to find"
          "了":
            "meaning": "completed-action particle"
          "吗":
            "meaning": "question particle"
  "zh-4775":
    "native": "to understand by listening"
    "notes":
      "n1": "听懂 (tīngdǒng) means to understand what you hear: the result 懂 (dǒng), understood, is added to 听 (tīng), listen. 听不懂 (tīngbudǒng) means cannot follow what is said. 听见 (tīngjiàn) only means to hear a sound."
    "examples":
      "他说得太快了我没听懂。":
        "native": "He spoke too fast and I did not understand."
        "bases":
          "他":
            "meaning": "he"
          "得":
            "meaning": "particle"
          "太快":
            "meaning": "too fast"
          "了":
            "meaning": "completed-action particle"
          "我":
            "meaning": "I"
          "没":
            "meaning": "not"
          "听懂":
            "meaning": "to understand by listening"
      "你听懂了老师的话吗？":
        "native": "Did you understand what the teacher said?"
        "bases":
          "你":
            "meaning": "you"
          "听懂":
            "meaning": "to understand by listening"
          "了":
            "meaning": "completed-action particle"
          "老师":
            "meaning": "teacher"
          "的":
            "meaning": "particle"
          "话":
            "meaning": "words; speech"
          "吗":
            "meaning": "question particle"
  "zh-4776":
    "native": "to understand by reading"
    "notes":
      "n1": "看懂 (kàndǒng) means to understand what you read or see, with the same result 懂 (dǒng) as in 听懂 (tīngdǒng) for listening. 看不懂 (kànbudǒng) means cannot make it out."
    "examples":
      "这篇文章太难了我看不懂。":
        "native": "This article is too hard; I cannot understand it."
        "bases":
          "篇":
            "meaning": "measure for articles"
          "了":
            "meaning": "completed-action particle"
          "我":
            "meaning": "I"
          "看不懂":
            "meaning": "cannot understand"
      "小孩子已经能看懂简单的故事了。":
        "native": "The child can already understand simple stories."
        "bases":
          "能":
            "meaning": "can"
          "看懂":
            "meaning": "to understand by reading"
          "的":
            "meaning": "particle"
          "了":
            "meaning": "completed-action particle"
  "zh-4777":
    "native": "to finish eating"
    "notes":
      "n1": "吃完 (chīwán) means to eat until nothing is left on the plate. 完 (wán) marks the end of the action. 吃光 (chīguāng) stresses that all of it is gone, and 吃饱 (chībǎo) means full."
    "examples":
      "我吃完饭就去上班。":
        "native": "After I finish eating, I go to work."
        "bases":
          "我":
            "meaning": "I"
          "吃完":
            "meaning": "to finish eating"
          "去":
            "meaning": "go"
      "你吃完了吗？":
        "native": "Have you finished eating?"
        "bases":
          "你":
            "meaning": "you"
          "吃完":
            "meaning": "to finish eating"
          "了":
            "meaning": "completed-action particle"
          "吗":
            "meaning": "question particle"
  "zh-4778":
    "native": "to finish writing"
    "notes":
      "n1": "写完 (xiěwán) means to finish writing something, the whole text. 写好 (xiěhǎo) means the writing is done properly, and 完 (wán) only says the writing is finished."
    "examples":
      "他昨天写完了报告。":
        "native": "He finished the report yesterday."
        "bases":
          "他":
            "meaning": "he"
          "写完":
            "meaning": "to finish writing"
          "了":
            "meaning": "completed-action particle"
          "报告":
            "meaning": "report"
      "作业还没写完。":
        "native": "The homework is not finished yet."
        "bases":
          "没":
            "meaning": "not"
          "写完":
            "meaning": "to finish writing"
  "zh-4779":
    "native": "to finish doing"
    "notes":
      "n1": "做完 (zuòwán) means to complete a task or a job. 做 (zuò) alone is to do or make, and 完 (wán) shows that the task has been completed."
    "examples":
      "工作做完以后我们一起吃饭。":
        "native": "After we finish the work, we will eat together."
        "bases":
          "做完":
            "meaning": "to finish doing"
      "你做完了这些事情吗？":
        "native": "Have you finished all these things?"
        "bases":
          "你":
            "meaning": "you"
          "做完":
            "meaning": "to finish doing"
          "了":
            "meaning": "completed-action particle"
          "这些":
            "meaning": "these"
          "事情":
            "meaning": "matter; affair"
          "吗":
            "meaning": "question particle"
  "zh-4780":
    "native": "to manage to buy"
    "notes":
      "n1": "买到 (mǎidào) means to buy something and get it, often after searching. 到 (dào) shows the goal is reached. 买不到 (mǎibudào) means it cannot be bought, often because it is sold out."
    "examples":
      "这本书很难买到。":
        "native": "This book is hard to buy."
        "bases":
          "很":
            "meaning": "very"
          "买到":
            "meaning": "to manage to buy"
      "我终于买到了那件衣服。":
        "native": "I finally bought that piece of clothing."
        "bases":
          "我":
            "meaning": "I"
          "终于":
            "meaning": "finally"
          "买到":
            "meaning": "to manage to buy"
          "了":
            "meaning": "completed-action particle"
  "zh-4781":
    "native": "to forget completely"
    "notes":
      "n1": "忘掉 (wàngdiào) means to put something completely out of your mind, as with a bad memory. 忘记 (wàngjì) is the plain word for forgetting; 掉 (diào) adds the sense of something gone away."
    "examples":
      "请忘掉那件事吧。":
        "native": "Please forget that matter."
        "bases":
          "请":
            "meaning": "please"
          "忘掉":
            "meaning": "to forget completely"
          "事":
            "meaning": "matter; thing"
          "吧":
            "meaning": "particle"
      "他想忘掉那次失败的经历。":
        "native": "He wants to forget that failed experience."
        "bases":
          "他":
            "meaning": "he"
          "忘掉":
            "meaning": "to forget completely"
          "那次":
            "meaning": "that time"
          "的":
            "meaning": "particle"
          "经历":
            "meaning": "experience"
  "zh-4782":
    "native": "to put in place"
    "notes":
      "n1": "放好 (fànghǎo) means to put something in its right place, neatly. 好 (hǎo) here shows the action is done properly. 放 (fàng) alone is to put or place."
    "examples":
      "书放好以后我们就走吧。":
        "native": "After the books are put away, we can go."
        "bases":
          "放好":
            "meaning": "to put in place"
          "吧":
            "meaning": "particle"
      "我的东西都放好了。":
        "native": "All my things are put away."
        "bases":
          "我":
            "meaning": "I"
          "的":
            "meaning": "particle"
          "都":
            "meaning": "all; both"
          "放好":
            "meaning": "to put in place"
          "了":
            "meaning": "completed-action particle"
  "zh-4783":
    "native": "to stand up"
    "notes":
      "n1": "站起来 (zhànqǐlái) means to rise to one's feet. 起来 (qǐlái) shows the upward movement, and 站 (zhàn) alone is to stand. Its opposite is 坐下 (zuòxià), to sit down."
    "examples":
      "老师进来以后大家都站起来了。":
        "native": "When the teacher came in, everyone stood up."
        "bases":
          "老师":
            "meaning": "teacher"
          "进来":
            "meaning": "come in"
          "大家":
            "meaning": "everyone"
          "都":
            "meaning": "all; both"
          "站起来":
            "meaning": "to stand up"
          "了":
            "meaning": "completed-action particle"
      "他听到名字以后慢慢站起来。":
        "native": "After hearing his name, he slowly stood up."
        "bases":
          "他":
            "meaning": "he"
          "听到":
            "meaning": "hear"
          "名字":
            "meaning": "name"
          "慢慢":
            "meaning": "slowly"
          "站起来":
            "meaning": "to stand up"
  "zh-4784":
    "native": "to run out"
    "notes":
      "n1": "跑出 (pǎochū) means to run out of a place, from inside to outside. 出 (chū) shows the movement out. 跑进 (pǎojìn) is the opposite, to run in."
    "examples":
      "孩子从教室里跑出来了。":
        "native": "The child ran out of the classroom."
        "bases":
          "从":
            "meaning": "from"
          "跑出":
            "meaning": "to run out"
          "来":
            "meaning": "come"
          "了":
            "meaning": "completed-action particle"
      "小狗突然跑出门。":
        "native": "The puppy suddenly ran out of the door."
        "bases":
          "小狗":
            "meaning": "puppy"
          "突然":
            "meaning": "suddenly"
          "跑出":
            "meaning": "to run out"
  "zh-4785":
    "native": "to go in"
    "notes":
      "n1": "进去 (jìnqu) means to go into a place, away from the speaker. 进来 (jìnlai) is the opposite: to come in, towards the speaker. Both come after a verb of movement."
    "examples":
      "你可以进去了。":
        "native": "You can go in now."
        "bases":
          "你":
            "meaning": "you"
          "可以":
            "meaning": "may; can"
          "进去":
            "meaning": "to go in"
          "了":
            "meaning": "completed-action particle"
      "他走进去以后就关上了门。":
        "native": "After he went in, he shut the door."
        "bases":
          "他":
            "meaning": "he"
          "进去":
            "meaning": "to go in"
          "了":
            "meaning": "completed-action particle"
  "zh-4786":
    "native": "to come out"
    "notes":
      "n1": "出来 (chūlái) means to come out towards the speaker. 出去 (chūqu) is the opposite: to go out, away from the speaker. 出来 (chūlái) is also used for finding or producing something."
    "examples":
      "他从房间里走出来了。":
        "native": "He walked out of the room."
        "bases":
          "他":
            "meaning": "he"
          "从":
            "meaning": "from"
          "出来":
            "meaning": "to come out"
          "了":
            "meaning": "completed-action particle"
      "饭好了大家快出来吃饭。":
        "native": "Dinner is ready, so everyone come out and eat."
        "bases":
          "好":
            "meaning": "good"
          "了":
            "meaning": "completed-action particle"
          "大家":
            "meaning": "everyone"
          "出来":
            "meaning": "to come out"
  "zh-4787":
    "native": "to go back"
    "notes":
      "n1": "回去 (huíqu) means to go back to a place, away from where the speaker is. 回来 (huílai) means to come back towards the speaker. 回家 (huíjiā) is to go home, a different phrase."
    "examples":
      "我们明天回去。":
        "native": "We are going back tomorrow."
        "bases":
          "回去":
            "meaning": "to go back"
      "你什么时候回去老家吗？":
        "native": "When are you going back to your hometown?"
        "bases":
          "你":
            "meaning": "you"
          "什么":
            "meaning": "what"
          "时候":
            "meaning": "time; moment"
          "回去":
            "meaning": "to go back"
          "老家":
            "meaning": "hometown"
          "吗":
            "meaning": "question particle"
  "zh-4788":
    "native": "to give as a gift"
    "notes":
      "n1": "送给 (sònggěi) means to give something to someone as a gift. 给 (gěi) shows the person who receives it. 送 (sòng) alone can mean to send or to see someone off."
    "examples":
      "我送给他一本书。":
        "native": "I gave him a book as a gift."
        "bases":
          "我":
            "meaning": "I"
          "送给":
            "meaning": "to give as a gift"
          "他":
            "meaning": "he"
      "妈妈送给我一件毛衣。":
        "native": "Mum gave me a sweater."
        "bases":
          "送给":
            "meaning": "to give as a gift"
          "我":
            "meaning": "I"
  "zh-4789":
    "native": "to lend to"
    "notes":
      "n1": "借给 (jiègěi) means to lend something to someone so that they can have it for a while. 借 (jiè) alone can mean to borrow or to lend, and 给 (gěi) gives the person who receives it."
    "examples":
      "朋友借给我一支笔。":
        "native": "My friend lent me a pen."
        "bases":
          "朋友":
            "meaning": "friend"
          "借给":
            "meaning": "to lend to"
          "我":
            "meaning": "I"
          "支":
            "meaning": "measure for pens"
      "你能借给我伞吗？":
        "native": "Can you lend me your umbrella?"
        "bases":
          "你":
            "meaning": "you"
          "能":
            "meaning": "can"
          "借给":
            "meaning": "to lend to"
          "我":
            "meaning": "I"
          "伞":
            "meaning": "umbrella"
          "吗":
            "meaning": "question particle"
  "zh-4790":
    "native": "to give back to"
    "notes":
      "n1": "还给 (huángěi) means to give something back to the person it belonged to. 还 (huán) alone can mean to return or to repay, as in 还钱 (huánqián), to pay money back."
    "examples":
      "书我已经还给老师了。":
        "native": "I have already given the book back to the teacher."
        "bases":
          "我":
            "meaning": "I"
          "还给":
            "meaning": "to give back to"
          "老师":
            "meaning": "teacher"
          "了":
            "meaning": "completed-action particle"
      "你什么时候还给我钱吗？":
        "native": "When will you pay the money back to me?"
        "bases":
          "你":
            "meaning": "you"
          "什么":
            "meaning": "what"
          "时候":
            "meaning": "time; moment"
          "还给":
            "meaning": "to give back to"
          "我":
            "meaning": "I"
          "吗":
            "meaning": "question particle"
  "zh-4791":
    "native": "to hand over to"
    "notes":
      "n1": "交给 (jiāogěi) means to hand something over to someone, often a duty or a document. 交 (jiāo) alone means to hand in, and 交朋友 (jiāo péngyou) means to make friends."
    "examples":
      "作业要交给老师。":
        "native": "The homework must be handed to the teacher."
        "bases":
          "要":
            "meaning": "should; must"
          "交给":
            "meaning": "to hand over to"
          "老师":
            "meaning": "teacher"
      "他交给我一份文件。":
        "native": "He handed me a document."
        "bases":
          "他":
            "meaning": "he"
          "交给":
            "meaning": "to hand over to"
          "我":
            "meaning": "I"
          "文件":
            "meaning": "document"
  "zh-4792":
    "native": "to break; damage by accident"
    "notes":
      "n1": "弄坏 (nònghuài) means to damage something, often by accident. 弄 (nòng) is a general verb meaning to do or make, and 坏 (huài) is the result, broken. 打破 (dǎpò) is to smash a hard thing."
    "examples":
      "我不小心弄坏了手机。":
        "native": "I carelessly broke my phone."
        "bases":
          "我":
            "meaning": "I"
          "不":
            "meaning": "not"
          "弄坏":
            "meaning": "to break; damage by accident"
          "了":
            "meaning": "completed-action particle"
      "电视被弄坏了。":
        "native": "The TV was broken."
        "bases":
          "被":
            "meaning": "passive marker"
          "弄坏":
            "meaning": "to break; damage by accident"
          "了":
            "meaning": "completed-action particle"
  "zh-4793":
    "native": "to break; to smash; to break a record"
    "notes":
      "n1": "打破 (dǎpò) means to smash or break something hard, such as a glass, or to break a record. 弄坏 (nònghuài) is wider and covers damage of any kind."
    "examples":
      "他打破了一个杯子。":
        "native": "He broke a cup."
        "bases":
          "他":
            "meaning": "he"
          "打破":
            "meaning": "to break; to smash; to break a record"
          "了":
            "meaning": "completed-action particle"
      "她打破了一项纪录。":
        "native": "She broke a record."
        "bases":
          "打破":
            "meaning": "to break; to smash; to break a record"
          "了":
            "meaning": "completed-action particle"
          "项":
            "meaning": "measure for items"
          "纪录":
            "meaning": "record"
  "zh-4794":
    "native": "to bump into"
    "notes":
      "n1": "撞到 (zhuàngdào) means to bump into something by accident. 到 (dào) shows that the action reached its target. 撞 (zhuàng) alone is to bump or collide."
    "examples":
      "他走路的时候撞到了门。":
        "native": "He bumped into the door while walking."
        "bases":
          "他":
            "meaning": "he"
          "的":
            "meaning": "particle"
          "时候":
            "meaning": "time; moment"
          "撞到":
            "meaning": "to bump into"
          "了":
            "meaning": "completed-action particle"
      "小心别撞到头。":
        "native": "Be careful not to bump your head."
        "bases":
          "撞到":
            "meaning": "to bump into"
  "zh-4795":
    "native": "to finish listening"
    "notes":
      "n1": "听完 (tīngwán) means to listen until the end. 完 (wán) marks the end of the action. 听懂 (tīngdǒng) is different: to understand what you heard."
    "examples":
      "我听完了这个故事。":
        "native": "I listened to the whole story."
        "bases":
          "我":
            "meaning": "I"
          "听完":
            "meaning": "to finish listening"
          "了":
            "meaning": "completed-action particle"
      "你听完录音了吗？":
        "native": "Have you listened to the whole recording?"
        "bases":
          "你":
            "meaning": "you"
          "听完":
            "meaning": "to finish listening"
          "了":
            "meaning": "completed-action particle"
          "吗":
            "meaning": "question particle"
  "zh-4796":
    "native": "to finish reading or watching"
    "notes":
      "n1": "看完 (kànwán) means to read or watch something to the end. 看 (kàn) can mean look, read or watch, and 完 (wán) shows the whole thing is done. 看不完 (kànbuwán) means cannot be finished."
    "examples":
      "这本书我三天看完了。":
        "native": "I finished this book in three days."
        "bases":
          "我":
            "meaning": "I"
          "看完":
            "meaning": "to finish reading or watching"
          "了":
            "meaning": "completed-action particle"
      "电影太长了我没看完。":
        "native": "The film was too long and I did not finish it."
        "bases":
          "电影":
            "meaning": "film"
          "了":
            "meaning": "completed-action particle"
          "我":
            "meaning": "I"
          "没":
            "meaning": "not"
          "看完":
            "meaning": "to finish reading or watching"
  "zh-4797":
    "native": "to finish speaking"
    "notes":
      "n1": "说完 (shuōwán) means to finish speaking, to say everything. 说 (shuō) is to speak, and 说完了 (shuōwán le) is common when someone has finished their point."
    "examples":
      "他说完话就走了。":
        "native": "As soon as he finished speaking, he left."
        "bases":
          "他":
            "meaning": "he"
          "说完":
            "meaning": "to finish speaking"
          "话":
            "meaning": "words; speech"
          "了":
            "meaning": "completed-action particle"
      "你说完了吗？":
        "native": "Have you finished speaking?"
        "bases":
          "你":
            "meaning": "you"
          "说完":
            "meaning": "to finish speaking"
          "了":
            "meaning": "completed-action particle"
          "吗":
            "meaning": "question particle"
  "zh-4798":
    "native": "to finish drinking"
    "notes":
      "n1": "喝完 (hēwán) means to drink until the cup or bottle is empty. 喝光 (hēguāng) is the same idea, with more stress on all being gone."
    "examples":
      "他一口气喝完了那杯茶。":
        "native": "He drank the whole cup of tea in one go."
        "bases":
          "他":
            "meaning": "he"
          "一口气":
            "meaning": "in one go"
          "喝完":
            "meaning": "to finish drinking"
          "了":
            "meaning": "completed-action particle"
      "瓶子里的水还没有喝完。":
        "native": "The water in the bottle is not all drunk yet."
        "bases":
          "的":
            "meaning": "particle"
          "没有":
            "meaning": "not have"
          "喝完":
            "meaning": "to finish drinking"
  "zh-4799":
    "native": "to use up"
