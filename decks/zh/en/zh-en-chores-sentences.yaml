"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-2266":
    "confusables":
      "w1":
        "why": "洗碗 (xǐwǎn) is to wash the dishes, one job."
      "w2":
        "why": "打扫 (dǎsǎo) is to clean up, a general word."
    "bases":
      "每天":
        "meaning": "every day"
    "native": "I do housework every day."
  "zh-2267":
    "confusables":
      "w1":
        "why": "扔 (rēng) is to throw away, without sorting."
      "w2":
        "why": "倒垃圾 (dàolājī) is to take the rubbish out, not to sort it."
    "bases":
      "把":
        "meaning": "a particle that puts the object before the verb"
    "native": "Please sort the rubbish."
  "zh-2268":
    "confusables":
      "w1":
        "why": "洗衣服 (xǐyīfu) is to wash clothes, another job."
      "w2":
        "why": "拖地 (tuōdì) is to mop, another job."
    "native": "Mum buys vegetables and cooks."
  "zh-2269":
    "confusables":
      "w1":
        "why": "干净 (gānjìng) is clean, the opposite of dirty."
      "w2":
        "why": "整洁 (zhěngjié) is tidy, a state of order."
    "native": "This carpet is very dirty."
  "zh-2270":
    "confusables":
      "w1":
        "why": "浇花 (jiāohuā) is to water plants, another job."
      "w2":
        "why": "吸尘器 (xīchénqì) is a vacuum cleaner, a tool."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "Dad has repaired the tap."
  "zh-2271":
    "confusables":
      "w1":
        "why": "分工 (fēngōng) is the division of work, a noun."
      "w2":
        "why": "负责 (fùzé) is to be responsible, a single person's role."
    "native": "We take turns to wash the dishes."
  "zh-2272":
    "confusables":
      "w1":
        "why": "枕头 (zhěntou) is a pillow, another bedding item."
      "w2":
        "why": "床单 (chuángdān) is a bedsheet, another bedding item."
    "bases":
      "要":
        "meaning": "must; to want"
    "native": "The quilt needs airing in the sun."
  "zh-2273":
    "confusables":
      "w1":
        "why": "清洁 (qīngjié) is clean, a state."
      "w2":
        "why": "抹布 (mābù) is a cleaning cloth, a tool."
    "bases":
      "用":
        "meaning": "to use"
      "消毒水":
        "meaning": "disinfectant"
    "native": "Please wipe the table with disinfectant."
