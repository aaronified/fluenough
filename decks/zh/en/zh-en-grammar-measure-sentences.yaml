"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Measure words in sentences"
"description": "Sentences with measure words: this person, that good book, two cups of tea, a bottle of water, these expensive shoes, which clothes, who that teacher is, and three of us. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0742":
    "native": "This person is my friend."
    "confusables":
      "w1":
        "why": "那 (nà) would say that person, not this one."
      "w2":
        "why": "哪 (nǎ) would ask which person, not say this is a friend."
  "zh-0743":
    "native": "That book is good."
    "confusables":
      "w1":
        "why": "这 (zhè) would say this book, not that one."
      "w2":
        "why": "几 (jǐ) asks how many, not what the book is like."
  "zh-0744":
    "native": "I buy two cups of tea."
    "confusables":
      "w1":
        "why": "个 (ge) is the general measure word, so it would not name the cup."
      "w2":
        "why": "瓶 (píng) is a bottle, so it would say two bottles of tea."
  "zh-0745":
    "native": "Do you drink a bottle of water?"
    "confusables":
      "w1":
        "why": "杯 (bēi) is a cup, so it would say a cup of water."
      "w2":
        "why": "双 (shuāng) counts pairs, so it would not fit water."
  "zh-0746":
    "native": "These shoes are expensive."
    "confusables":
      "w1":
        "why": "件 (jiàn) counts items of clothing, not a pair of shoes."
      "w2":
        "why": "位 (wèi) is the polite measure word for a person."
  "zh-0747":
    "native": "Which piece of clothing is good?"
    "confusables":
      "w1":
        "why": "怎样 (zěnyàng) asks how, not which one."
      "w2":
        "why": "谁 (shéi) asks who, not which piece of clothing."
  "zh-0748":
    "native": "Who is that teacher?"
    "confusables":
      "w1":
        "why": "先生 (xiānsheng) is 'Mr' or 'sir', a title, not a question word."
      "w2":
        "why": "怎么 (zěnme) asks how, not who."
  "zh-0749":
    "native": "Who is that person?"
    "confusables":
      "w1":
        "why": "这 (zhè) would say this person, not that one."
      "w2":
        "why": "哪 (nǎ) asks which, not who."
  "zh-0750":
    "native": "This is a cup of tea."
    "confusables":
      "w1":
        "why": "瓶 (píng) would say a bottle, not a cup."
      "w2":
        "why": "个 (ge) is the general measure word, and it would not name the cup."
  "zh-0751":
    "native": "We are three people in all."
    "confusables":
      "w1":
        "why": "许多 (xǔduō) is 'many', not a counted three."
      "w2":
        "why": "左右 (zuǒyòu) is 'about', so it would say about three."
