"cards":
  "zh-3217":
    "native": "to serve; service"
    "notes":
      "n1": "To help customers or the public. 服 (fú) is to serve, and 务 (wù) is work."
    "examples":
      "服务很好。": "The service is very good."
      "他们为客人服务。":
        "native": "They serve the guests."
        "bases":
          "为":
            "meaning": "for"
  "zh-3218":
    "native": "shop assistant"
    "notes":
      "n1": "A person who works in a shop. 营 (yíng) is to run, 业 (yè) is business, and 员 (yuán) is a staff member."
    "examples":
      "营业员在哪里？": "Where is the shop assistant?"
      "营业员很热情。": "The shop assistant is very friendly."
  "zh-3219":
