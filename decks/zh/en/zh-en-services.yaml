    "notes":
      "n1": "The time when a shop or office is open. 营 (yíng) is to run, 业 (yè) is business, and 时间 (shíjiān) is time."
    "examples":
      "营业时间是几点？": "What are the opening hours?"
      "营业时间到晚上十点。":
        "native": "Opening hours run until ten in the evening."
