          "每天":
            "meaning": "every day"
  "zh-3221":
    "native": "to close (a shop)"
    "notes":
      "n1": "To close a shop or office. 关 (guān) is to close, and 门 (mén) is a door."
    "examples":
      "商店晚上关门。": "The shop closes in the evening."
