          "到":
            "meaning": "to arrive; to reach"
  "zh-3220":
    "native": "to open (to the public)"
    "notes":
      "n1": "To be open for people to use. 开 (kāi) is to open, and 放 (fàng) is to let go."
    "examples":
      "公园开放了。":
        "native": "The park is open."
