"name": "是 (shì) ... 的 (de): when, where and how a past action happened"
"description": "Sentences that stress when, where or how a past action happened, with 是 (shì) before the detail and 的 (de) at the end: 我是昨天来的 (I came yesterday). Not yet checked by a Mandarin speaker: please report any mistake."
