"cards":
  "zh-2558":
    "confusables":
      "w1":
        "why": "去 (qù) is to go, the other direction."
      "w2":
        "why": "走 (zǒu) is to walk or leave, a different action."
    "bases":
      "的":
        "meaning": "a particle: of; the one that"
    "native": "When did you come?"
  "zh-2559":
    "confusables":
      "w1":
        "why": "开 (kāi) is to drive, not to ride."
      "w2":
        "why": "回 (huí) is to return, not to go."
    "bases":
      "的":
        "meaning": "a particle: of; the one that"
    "native": "He went by train."
  "zh-2560":
    "confusables":
      "w1":
        "why": "教 (jiāo) is to teach, which is the teacher's action."
      "w2":
        "why": "练习 (liànxí) is to practise, a different action."
    "bases":
      "的":
        "meaning": "a particle: of; the one that"
      "中文":
        "meaning": "Chinese (the language)"
    "native": "I learnt Chinese at school."
  "zh-2561":
    "confusables":
      "w1":
        "why": "卖 (mài) is to sell, the other side of buying."
      "w2":
        "why": "借 (jiè) is to borrow, not to buy."
    "bases":
      "网上":
        "meaning": "online"
      "的":
        "meaning": "a particle: of; the one that"
    "native": "This book was not bought online."
  "zh-2562":
    "confusables":
      "w1":
        "why": "见 (jiàn) is to meet, close in meaning but not the same."
      "w2":
        "why": "介绍 (jièshào) is to introduce, a different act."
    "bases":
      "的":
        "meaning": "a particle: of; the one that"
    "native": "Where did you meet?"
  "zh-2563":
    "confusables":
      "w1":
        "why": "明白 (míngbai) is to understand, a different state."
      "w2":
        "why": "想 (xiǎng) is to think or want."
    "bases":
      "才":
        "meaning": "only then; not until"
      "的":
        "meaning": "a particle: of; the one that"
    "native": "I only found out yesterday."
  "zh-2564":
    "confusables":
      "w1":
        "why": "住 (zhù) is to live, not to be born."
      "w2":
        "why": "来 (lái) is to come, not to be born."
    "bases":
      "北京":
        "meaning": "Beijing"
      "出生":
        "meaning": "to be born"
      "的":
        "meaning": "a particle: of; the one that"
    "native": "He was born in Beijing."
  "zh-2565":
    "confusables":
      "w1":
        "why": "火车 (huǒchē) is a train, not a plane."
      "w2":
        "why": "船 (chuán) is a boat, another way to travel."
    "bases":
      "的":
        "meaning": "a particle: of; the one that"
    "native": "We came by plane."
