"name": "Everyday verbs"
"description": "Thirty-five verbs of an ordinary day: getting up and going to sleep, washing, eating, going to work and school, walking, sitting and standing, waiting, bringing, asking, answering and forgetting. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0295":
    "native": "to get up"
    "notes":
      "n1": "To get out of bed in the morning. Its opposite is 睡觉 (shuìjiào), to go to sleep."
    "examples":
      "我起床。": "I get up."
      "你起床吗？": "Do you get up?"
  "zh-0296":
    "native": "to sleep; to go to bed"
    "notes":
      "n1": "To go to sleep. Its opposite is 起床 (qǐchuáng), to get up."
    "examples":
      "我们睡觉。": "We go to sleep."
      "你们睡觉吗？": "Are you going to sleep?"
  "zh-0297":
    "native": "to wash"
    "notes":
      "n1": "To wash something. 洗手 (xǐ shǒu), to wash one's hands, uses 手 (shǒu), hand."
    "examples":
      "我洗手。": "I wash my hands."
      "你洗什么？": "What are you washing?"
  "zh-0298":
    "native": "to brush one's teeth"
    "notes":
      "n1": "To brush one's teeth, in the morning and at night. 牙 (yá) is tooth."
    "examples":
      "妹妹刷牙。": "My younger sister brushes her teeth."
      "你刷牙吗？": "Do you brush your teeth?"
  "zh-0299":
    "native": "to take a bath or a shower"
    "notes":
      "n1": "To wash the whole body, in a bath or under a shower."
    "examples":
      "爸爸洗澡。": "Dad takes a shower."
      "你洗澡吗？": "Are you going to have a bath?"
  "zh-0300":
    "native": "to eat a meal"
    "notes":
      "n1": "To have a meal. 吃 (chī) alone is to eat any food; 吃饭 (chīfàn) is the meal itself."
    "examples":
      "我们吃饭。": "We are going to eat."
      "你吃饭吗？": "Are you eating?"
  "zh-0301":
    "native": "to look at; to watch; to read"
    "notes":
      "n1": "To look at something, watch a show or read. 看 (kàn) is used for all three."
    "examples":
      "我看你。": "I am looking at you."
      "他们看什么？": "What are they looking at?"
  "zh-0302":
    "native": "to listen"
    "notes":
      "n1": "To listen to a sound or a voice. In traditional script it is 聽 (tīng)."
    "examples":
      "请你听。": "Please listen."
      "我们听老师。": "We listen to the teacher."
  "zh-0303":
    "native": "to say; to speak"
    "notes":
      "n1": "To say words, or to speak. It is for words that are said, not for a language."
    "examples":
      "妈妈说什么？": "What is mum saying?"
      "老师说，大家听。": "The teacher says, everyone listen."
  "zh-0304":
    "native": "to read"
    "notes":
      "n1": "To read a text, such as a book or a sign. It is also used for studying a subject."
    "examples":
      "妹妹读什么？": "What is my younger sister reading?"
      "你们读吗？": "Are you reading?"
  "zh-0305":
    "native": "to do; to make"
    "notes":
      "n1": "To do or make a thing. 做 (zuò) is for most tasks, and it does not name one action."
    "examples":
      "我们做什么？": "What shall we do?"
      "你做吗？": "Are you doing it?"
  "zh-0306":
    "native": "to go home"
    "notes":
      "n1": "To return home. 回 (huí) is to return and 家 (jiā) is home."
    "examples":
      "我们回家。": "We are going home."
      "你回家吗？": "Are you going home?"
  "zh-0307":
    "native": "to go to work"
    "notes":
      "n1": "To go to work. Its opposite is 下班 (xiàbān), to finish work."
    "examples":
      "妈妈上班。": "Mum goes to work."
      "爸爸上班吗？": "Does dad go to work?"
  "zh-0308":
    "native": "to finish work; to leave work"
    "notes":
      "n1": "To finish work for the day. Its opposite is 上班 (shàngbān), to go to work."
    "examples":
      "妈妈下班吗？": "Does mum finish work?"
      "爸爸下班。": "Dad finishes work."
  "zh-0309":
    "native": "to go to school"
    "notes":
      "n1": "To go to school, as a pupil or a student. Its opposite is 放学 (fàngxué), to finish school."
    "examples":
      "我们上学。": "We go to school."
      "孩子上学吗？": "Does the child go to school?"
  "zh-0310":
    "native": "to finish school"
    "notes":
      "n1": "To finish school for the day, as a child does. Its opposite is 上学 (shàngxué), to go to school."
    "examples":
      "孩子放学。": "The child finishes school."
      "学生放学吗？": "Do the students finish school?"
  "zh-0311":
    "native": "to walk; to leave"
    "notes":
      "n1": "To walk on foot, or to leave a place. 走 (zǒu) is used for both."
    "examples":
      "你走吗？": "Are you leaving?"
      "他们走。": "They are leaving."
  "zh-0312":
    "native": "to sit"
    "notes":
      "n1": "To sit down, on a chair or a seat. It sounds like 做 (zuò), to do, but it is a different word."
    "examples":
      "请坐。": "Please sit down."
      "你坐吗？": "Are you sitting down?"
  "zh-0313":
    "native": "to stand"
    "notes":
      "n1": "To stand up or stand still. Its opposite is 坐 (zuò), to sit."
    "examples":
      "大家站吗？": "Is everyone standing?"
      "老师站。": "The teacher stands."
  "zh-0314":
    "native": "to wait; to wait for"
    "notes":
      "n1": "To wait, or to wait for a person or a thing."
    "examples":
      "请等我。": "Please wait for me."
      "你等吗？": "Are you waiting?"
  "zh-0315":
    "native": "to bring; to take along"
    "notes":
      "n1": "To carry a thing or a person with you. In traditional script it is 帶 (dài)."
    "examples":
      "你带水吗？": "Are you bringing water?"
      "我带你。": "I will take you."
  "zh-0316":
    "native": "to take; to hold in the hand"
    "notes":
      "n1": "To pick up a thing and hold it in the hand."
    "examples":
      "你拿什么？": "What are you holding?"
      "请你拿。": "Please take it."
  "zh-0317":
    "native": "to look for"
    "notes":
      "n1": "To look for a person or a thing that is lost or not yet found."
    "examples":
      "你找谁？": "Who are you looking for?"
      "我找老师。": "I am looking for the teacher."
  "zh-0318":
    "native": "to send; to see off; to give"
    "notes":
      "n1": "To take or send a thing or a person to a place, or to see someone off."
    "examples":
      "我送你。": "I will see you off."
      "你送谁？": "Who are you seeing off?"
  "zh-0319":
    "native": "to wear; to put on"
    "notes":
      "n1": "To put on clothes or shoes, or to wear them. Its opposite is 脱 (tuō), to take off."
    "examples":
      "你穿什么？": "What are you wearing?"
      "他穿吗？": "Is he wearing it?"
  "zh-0320":
    "native": "to play; to have fun"
    "notes":
      "n1": "To play a game, or to have fun in one's free time."
    "examples":
      "我们玩。": "We are playing."
      "孩子玩吗？": "Does the child play?"
  "zh-0321":
    "native": "to help"
    "notes":
      "n1": "To help someone do a thing. In traditional script it is 幫 (bāng)."
    "examples":
      "请帮我。": "Please help me."
      "你帮谁？": "Who are you helping?"
  "zh-0322":
    "native": "to ask"
    "notes":
      "n1": "To ask a question. In traditional script it is 問 (wèn)."
    "examples":
      "我问你。": "I am asking you."
      "老师问什么？": "What is the teacher asking?"
  "zh-0323":
    "native": "to answer"
    "notes":
      "n1": "To answer a question or a call. Its opposite is 问 (wèn), to ask."
    "examples":
      "请回答。": "Please answer."
      "你回答吗？": "Are you going to answer?"
  "zh-0324":
    "native": "to tell"
    "notes":
      "n1": "To tell a person something. In traditional script it is 告訴 (gàosu)."
    "examples":
      "请告诉我。": "Please tell me."
      "你告诉谁？": "Who are you telling?"
  "zh-0325":
    "native": "to think; to want to"
    "notes":
      "n1": "To think about a thing, or to want to do it: 想去 (xiǎng qù), want to go."
    "examples":
      "我想去。": "I want to go."
      "你想吗？": "Do you want to?"
  "zh-0326":
    "native": "to rest"
    "notes":
      "n1": "To rest after work or a walk. The second syllable is said lightly."
    "examples":
      "大家休息。": "Everyone rests."
      "你休息吗？": "Are you resting?"
  "zh-0327":
    "native": "to prepare; to get ready"
    "notes":
      "n1": "To get ready for a thing that is going to happen. In traditional script it is 準備 (zhǔnbèi)."
    "examples":
      "你准备什么？": "What are you preparing?"
      "我们准备。": "We are getting ready."
  "zh-0328":
    "native": "to begin; to start"
    "notes":
      "n1": "To begin a thing. Its opposite is 结束 (jiéshù), to end."
    "examples":
      "老师开始。": "The teacher begins."
      "开始吗？": "Shall we begin?"
    "antonyms":
      "end": "to end; to finish"
  "zh-0329":
    "native": "to forget"
    "notes":
      "n1": "To forget a thing or a name. Its opposite is 记得 (jìde), to remember."
    "examples":
      "你忘什么？": "What did you forget?"
      "你忘吗？": "Do you forget?"
