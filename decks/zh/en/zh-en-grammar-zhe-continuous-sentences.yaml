  "zh-4843":
    "confusables":
      "w1":
        "why": "窗户 (chuānghu) is a window, not a door."
      "w2":
        "why": "灯 (dēng) is a light, not a door."
    "bases":
      "着":
        "meaning": "a particle after a verb: the action or state goes on"
    "native": "The door is open."
