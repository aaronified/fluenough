"name": "Third characters: the station"
"description": "Ten characters for the station: in and out, go in, the line, the platform, to ride, to check, the hall, to wait and late. The compass characters (east, west, north, south) are already taught in the directions. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
- "script"
"cards":
  "zh-1693":
    "native": "to enter"
    "notes":
      "n1": "To enter a place or come in. Its opposite is 出 (chū), to go out. 入口 (rùkǒu) is an entrance."
    "examples":
      "请从入口进。":
        "native": "Please come in through the entrance."
        "bases":
          "从":
            "meaning": "from"
          "入口":
            "meaning": "entrance"
      "入站的人很多。":
        "native": "Many people enter the station."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1694":
    "native": "to go out"
    "notes":
      "n1": "To go out, or to come out of a place. 出口 (chūkǒu) is an exit."
    "examples":
      "出口在左边。":
        "native": "The exit is on the left."
        "bases":
          "出口":
            "meaning": "exit"
      "我从出口出来。":
        "native": "I come out through the exit."
        "bases":
          "从":
            "meaning": "from"
          "出口":
            "meaning": "exit"
  "zh-1695":
    "native": "track; rail"
    "notes":
      "n1": "A railway track, the rails a train runs on. 轨道 (guǐdào) is a track or rail."
    "examples":
      "火车在轨道上。":
        "native": "The train is on the tracks."
        "bases":
          "轨道":
            "meaning": "track; rail"
      "不要走在轨道上。":
        "native": "Do not walk on the tracks."
        "bases":
          "要":
            "meaning": "must; to want"
          "轨道":
            "meaning": "track; rail"
  "zh-1696":
    "native": "line"
    "notes":
      "n1": "A line, a route on a map or a railway. 一号线 (yīhàoxiàn) is line one."
    "examples":
      "这是几号线？": "Which line is this?"
      "地铁一号线很快。": "Metro line one is fast."
  "zh-1697":
    "native": "platform; stand"
    "notes":
      "n1": "A platform, a raised place. 站台 (zhàntái) is the platform at a station."
    "examples":
      "站台在地下。": "The platform is underground."
      "台上有人。":
        "native": "There are people on the platform."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1698":
    "native": "road; way"
    "notes":
      "n1": "A road or a way, a path for people or traffic. 道路 (dàolù) is a road."
    "examples":
      "这条道很长。":
        "native": "This road is very long."
        "bases":
          "条":
            "meaning": "the measure word for long things, such as roads"
      "一条道很宽。":
        "native": "One road is very wide."
        "bases":
          "条":
            "meaning": "the measure word for long things, such as roads"
          "宽":
            "meaning": "wide"
  "zh-1699":
    "native": "to check; to inspect"
    "notes":
      "n1": "To check or inspect something. 检查 (jiǎnchá) is to check."
    "examples":
      "请检票。": "Please have your ticket checked."
      "检查行李。":
        "native": "Check the luggage."
        "bases":
          "检查":
            "meaning": "to check"
  "zh-1700":
    "native": "hall"
    "notes":
      "n1": "A large room or hall in a building. 大厅 (dàtīng) is a main hall."
    "examples":
      "大厅里有人。":
        "native": "There are people in the main hall."
        "bases":
          "大厅":
            "meaning": "hall"
          "有":
            "meaning": "to have; there is"
      "候车厅很大。":
        "native": "The waiting hall is very big."
        "bases":
          "候车":
            "meaning": "to wait for a bus or train"
  "zh-1701":
    "native": "to wait"
    "notes":
      "n1": "To wait for a bus or a train. 等候 (děnghòu) is to wait."
    "examples":
      "请在这里等候。":
        "native": "Please wait here."
        "bases":
          "这里":
            "meaning": "here"
          "等候":
            "meaning": "to wait"
      "候车室在二楼。":
        "native": "The waiting room is on the second floor."
        "bases":
          "候车室":
            "meaning": "waiting room"
  "zh-1702":
    "native": "late"
    "notes":
      "n1": "Late, after the proper time. 迟到 (chídào) is to be late."
    "examples":
      "火车迟了。":
        "native": "The train is late."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "对不起，我迟到了。":
        "native": "Sorry, I am late."
        "bases":
          "迟到":
            "meaning": "to be late"
          "了":
            "meaning": "a particle: a change has happened"
