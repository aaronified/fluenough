"cards":
  "zh-2670":
    "confusables":
      "w1":
        "why": "窄 (zhǎi) is narrow, the opposite of wide."
      "w2":
        "why": "暗 (àn) is dark, the opposite of bright."
    "bases":
      "亮":
        "meaning": "bright"
    "native": "This room is very wide, and very bright too."
  "zh-2671":
    "confusables":
      "w1":
        "why": "薄 (báo) is thin, the opposite of thick."
      "w2":
        "why": "大 (dà) is big, not small."
    "native": "This book is very thick, and the characters are very small."
  "zh-2672":
    "confusables":
      "w1":
        "why": "软 (ruǎn) is soft, a different feel."
      "w2":
        "why": "平 (píng) is flat, which is not slippery by itself."
    "native": "The floor is slippery, be careful."
  "zh-2673":
    "confusables":
      "w1":
        "why": "简单 (jiǎndān) is simple, the opposite."
      "w2":
        "why": "轻松 (qīngsōng) is relaxed, the opposite of nervous."
    "native": "This problem is very complicated, and I am very nervous."
  "zh-2674":
    "confusables":
      "w1":
        "why": "热情 (rèqíng) is warm and friendly, a different quality."
      "w2":
        "why": "大方 (dàfang) is generous, a different quality."
    "native": "She is very gentle, and also very honest."
  "zh-2675":
    "confusables":
      "w1":
        "why": "整齐 (zhěngqí) is tidy, the opposite of messy."
      "w2":
        "why": "勤快 (qínkuai) is hard-working, the opposite of lazy."
    "native": "The room is very messy, and I am very lazy."
  "zh-2676":
    "confusables":
      "w1":
        "why": "清楚 (qīngchu) is clear, the opposite."
      "w2":
        "why": "干净 (gānjìng) is clean, a different quality."
    "native": "This photo is very blurry."
  "zh-2677":
    "confusables":
      "w1":
        "why": "热 (rè) is hot, the opposite of cool."
      "w2":
        "why": "干净 (gānjìng) is clean, a different quality."
    "native": "The water is cool, so I will not drink it."
