  "notes": "不 (bù) goes right before the verb or the adjective, whoever the subject is: 我不去 (wǒ bú qù), I am not going; 他不是老师 (tā bú shì lǎoshī), he is not a teacher. Its tone changes: before a fourth tone 不 (bù) is said bú, as in 不是 (bú shì), 不去 (bú qù), 不看 (bú kàn) and 不贵 (bú guì); before a first, second or third tone it stays bù, as in 不喝 (bù hē), 不来 (bù lái) and 不冷 (bù lěng). The readings here show the tone as it is said. With an adjective, 不 (bù) takes the place of the linking 很 (hěn), which is not 'very' there: 今天很冷 (jīntiān hěn lěng) becomes 今天不冷 (jīntiān bù lěng), the plain way to say it is not cold. 不很冷 (bù hěn lěng) is a different sentence, not very cold. A time word stays before 不 (bù): 他明天不来 (tā míngtiān bù lái). Did not is another word, 没 (méi), which the course teaches later."
