"schema": 1
"id": "zh-en-appearance"
"kind": "layer"
"core": "zh-appearance"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Appearance"
"description": "Forty words for how people look: height and build, hair and face, the clothes and the style, and the words for a smile, a scar and a mark. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-2288":
    "native": "short (of height)"
    "notes":
      "n1": "Short in height, not tall. Its opposite is 高 (gāo), tall."
    "examples":
      "他很矮。": "He is very short."
      "这个椅子很矮。": "This chair is very low."
  "zh-2289":
    "native": "handsome"
    "notes":
      "n1": "Handsome, good-looking, of a man."
    "examples":
      "他很帅。": "He is very handsome."
      "这个男孩很帅。":
        "native": "This boy is very handsome."
        "bases":
          "男孩":
            "meaning": "boy"
  "zh-2290":
    "native": "lovely; cute"
    "notes":
      "n1": "Lovely and charming, cute to look at. 可 (kě) can, and 爱 (ài) is love."
    "examples":
      "她很可爱。": "She is very lovely."
      "孩子的笑很可爱。":
        "native": "The child's smile is very cute."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2291":
    "native": "thick; coarse"
    "notes":
      "n1": "Thick in width, not thin. Its opposite is 细 (xì), thin."
    "examples":
      "这根绳子很粗。":
        "native": "This rope is very thick."
        "bases":
          "根":
            "meaning": "the measure word for long thin things"
      "他的手很粗。":
        "native": "His hands are very big and thick."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2292":
    "native": "white hair"
    "notes":
      "n1": "White or grey hair, of an old person. 白 (bái) is white, and 发 (fà) is hair."
    "examples":
      "爷爷有白发。":
        "native": "Grandad has white hair."
        "bases":
          "有":
            "meaning": "to have; there is"
      "他的白发很多。":
        "native": "He has a lot of white hair."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2293":
    "native": "curly hair"
    "notes":
      "n1": "Hair that curls, not straight. 卷 (juǎn) is to curl."
    "examples":
      "她有卷发。":
        "native": "She has curly hair."
        "bases":
          "有":
            "meaning": "to have; there is"
      "卷发很好看。": "Curly hair is very nice."
  "zh-2294":
    "native": "straight hair"
    "notes":
      "n1": "Hair that is straight, not curly. 直 (zhí) is straight."
    "examples":
      "她的直发很长。":
        "native": "Her straight hair is very long."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "直发很容易打理。":
        "native": "Straight hair is easy to look after."
        "bases":
          "打理":
            "meaning": "to look after; to manage"
  "zh-2295":
    "native": "double eyelid"
    "notes":
      "n1": "An eyelid with a crease, a fold above the eye. 双 (shuāng) is two, and 眼皮 (yǎnpí) is an eyelid."
    "examples":
      "她有双眼皮。":
        "native": "She has a double eyelid."
        "bases":
          "有":
            "meaning": "to have; there is"
      "双眼皮很好看。": "A double eyelid looks very nice."
  "zh-2296":
    "native": "good-looking; nice to see"
    "notes":
      "n1": "Nice to look at, pleasing to the eye. 好 (hǎo) is good, and 看 (kàn) is to look."
    "examples":
      "这件衣服很好看。": "This garment is very nice to look at."
      "她很好看。": "She is very good-looking."
  "zh-2297":
    "native": "temperament; air of a person"
    "notes":
      "n1": "The character and style of a person as seen by others. 气 (qì) is air, and 质 (zhì) is quality."
    "examples":
      "她的气质很好。":
        "native": "She has a very good air about her."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "这个人有气质。":
        "native": "This person has presence."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-2298":
    "native": "figure; build"
    "notes":
      "n1": "The shape and size of a person's body. 身 (shēn) is the body, and 材 (cái) is build."
    "examples":
      "他的身材很好。":
        "native": "He has a very good figure."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "身材很重要。": "Figure is important."
  "zh-2299":
    "native": "height"
    "notes":
      "n1": "How tall or short a person is. 高 (gāo) is tall, and 矮 (ǎi) is short."
    "examples":
      "他的高矮很中等。":
        "native": "His height is about average."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "中等":
            "meaning": "average; medium"
      "看高矮就知道。": "You can tell from the height."
  "zh-2300":
    "native": "weight (of a body)"
    "notes":
      "n1": "How heavy a person is. 体 (tǐ) is the body, and 重 (zhòng) is heavy."
    "examples":
      "她的体重很轻。":
        "native": "Her weight is very light."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "轻":
            "meaning": "light (not heavy)"
      "你的体重是多少？":
        "native": "What is your weight?"
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2301":
    "native": "complexion; look of the face"
    "notes":
      "n1": "The colour and look of the face, showing health or mood. 脸 (liǎn) is the face, and 色 (sè) is colour."
    "examples":
      "他的脸色不好。":
        "native": "His complexion is not good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "她的脸色很红。":
        "native": "Her face is very red."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2302":
    "native": "to smile"
    "notes":
      "n1": "To smile gently, without a sound. 微 (wēi) is slight, and 笑 (xiào) is to laugh."
    "examples":
      "她微笑了。":
        "native": "She smiled."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "老师常常微笑。": "The teacher often smiles."
  "zh-2303":
    "native": "smile (on the face)"
    "notes":
      "n1": "The look of a smile on the face. 笑 (xiào) is a smile, and 容 (róng) is a look."
    "examples":
      "他的笑容很好。":
        "native": "His smile is very nice."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "她带着笑容。":
        "native": "She has a smile on her face."
        "bases":
          "着":
            "meaning": "a particle: an action goes on"
  "zh-2304":
    "native": "expression"
    "notes":
      "n1": "The look on a face, showing a feeling. 表 (biǎo) is to show, and 情 (qíng) is a feeling."
    "examples":
      "他的表情很好看。":
        "native": "His expression is very nice."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "她的表情很难受。":
        "native": "Her expression is very unhappy."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "难受":
            "meaning": "uncomfortable"
  "zh-2305":
    "native": "clothes; dress"
    "notes":
      "n1": "The way a person is dressed, what they wear. 穿 (chuān) is to wear."
    "examples":
      "他的穿着很好。":
        "native": "His clothes are very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "穿着要整齐。":
        "native": "Your dress must be neat."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-2306":
    "native": "fashionable; trendy"
    "notes":
      "n1": "Fashionable, in the latest style. 时 (shí) is time, and 髦 (máo) is a fashion."
    "examples":
      "她很时髦。": "She is very fashionable."
      "这个样子很时髦。": "This style is very fashionable."
  "zh-2307":
    "native": "plain; simple"
    "notes":
      "n1": "Simple and plain, with no decoration. 朴 (pǔ) is plain, and 素 (sù) is simple."
    "examples":
      "他穿得很朴素。":
        "native": "He dresses very simply."
        "bases":
          "得":
            "meaning": "a particle after a verb: how it is done"
      "这个房间很朴素。": "This room is very plain."
  "zh-2308":
    "native": "neat; tidy"
    "notes":
      "n1": "Neat and in good order. 整 (zhěng) is whole, and 齐 (qí) is even."
    "examples":
      "她的衣服很整齐。":
        "native": "Her clothes are very neat."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "房间很整齐。": "The room is very tidy."
  "zh-2309":
    "native": "black; dark"
    "notes":
      "n1": "Black, the darkest colour."
    "examples":
      "她的头发是黑的。":
        "native": "Her hair is black."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "夜很黑。": "The night is very dark."
  "zh-2310":
    "native": "golden; blond"
    "notes":
      "n1": "Gold or golden in colour, and of blond hair."
    "examples":
      "他的头发是金的。":
        "native": "His hair is blond."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "金色的花很好看。":
        "native": "The golden flowers are very nice."
        "bases":
          "色":
            "meaning": "colour"
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2311":
    "native": "red"
    "notes":
      "n1": "Red, the colour of blood or a ripe apple."
    "examples":
      "她穿红的。":
        "native": "She is wearing red."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "红的苹果很甜。":
        "native": "The red apples are very sweet."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2312":
    "native": "blue"
    "notes":
      "n1": "Blue, the colour of the sky on a clear day."
    "examples":
      "天是蓝的。":
        "native": "The sky is blue."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "蓝的衣服很漂亮。":
        "native": "The blue clothes are very pretty."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2313":
    "native": "beard; moustache"
    "notes":
      "n1": "A beard or a moustache on a man's face. 子 (zi) makes it a noun."
    "examples":
      "爷爷有胡子。":
        "native": "Grandad has a beard."
        "bases":
          "有":
            "meaning": "to have; there is"
      "他不留胡子。":
        "native": "He does not grow a beard."
        "bases":
          "留":
            "meaning": "to grow (hair); to keep"
  "zh-2314":
    "native": "wrinkle"
    "notes":
      "n1": "A line on the skin, from age or from smiling. 皱 (zhòu) is to wrinkle, and 纹 (wén) is a line."
    "examples":
      "她的脸上有皱纹。":
        "native": "There are wrinkles on her face."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "有":
            "meaning": "to have; there is"
      "皱纹多了。":
        "native": "There are more wrinkles now."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2315":
    "native": "dimple"
    "notes":
      "n1": "A small dent in the cheek, shown when one smiles. 酒 (jiǔ) is wine, and 窝 (wō) is a hollow."
    "examples":
      "她笑的时候有酒窝。":
        "native": "She has dimples when she smiles."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "有":
            "meaning": "to have; there is"
      "他有两个酒窝。":
        "native": "He has two dimples."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-2316":
    "native": "spot; pimple"
    "notes":
      "n1": "A small red spot on the skin. 痘 (dòu) is a pox or spot."
    "examples":
      "脸上有痘痘。":
        "native": "There are spots on the face."
        "bases":
          "有":
            "meaning": "to have; there is"
      "痘痘很多。": "There are a lot of spots."
  "zh-2317":
    "native": "scar"
    "notes":
      "n1": "A mark left on the skin after a wound has healed."
    "examples":
      "手上有疤。":
        "native": "There is a scar on the hand."
        "bases":
          "有":
            "meaning": "to have; there is"
      "这个疤很大。": "This scar is very big."
  "zh-2318":
    "native": "short-sighted; myopic"
    "notes":
      "n1": "Short-sighted, unable to see far away clearly. 近 (jìn) is near, and 视 (shì) is sight."
    "examples":
      "他近视。": "He is short-sighted."
      "她近视了，要戴眼镜。":
        "native": "She is short-sighted and must wear glasses."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "要":
            "meaning": "must; to want"
          "戴":
            "meaning": "to wear (glasses, a hat)"
  "zh-2319":
    "native": "height (of a person); build"
    "notes":
      "n1": "The height of a person, how tall they are. 个 (gè) is a measure word, and 子 (zi) makes it a noun."
    "examples":
      "他的个子很高。":
        "native": "He is very tall."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "她的个子不高。":
        "native": "She is not tall."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2320":
    "native": "build; body shape"
    "notes":
      "n1": "The shape of a person's body. 体 (tǐ) is the body, and 形 (xíng) is shape."
    "examples":
      "他的体形很好。":
        "native": "His build is very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "体形不一样。":
        "native": "Their builds are not the same."
        "bases":
          "一样":
            "meaning": "the same"
  "zh-2321":
    "native": "hairstyle"
    "notes":
      "n1": "The style in which the hair is cut and worn. 发 (fà) is hair, and 型 (xíng) is style."
    "examples":
      "她的发型很时髦。":
        "native": "Her hairstyle is very fashionable."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "我想换个发型。": "I want to change my hairstyle."
  "zh-2322":
    "native": "grey"
    "notes":
      "n1": "Grey, between black and white."
    "examples":
      "她穿灰的衣服。":
        "native": "She is wearing grey clothes."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "天是灰的。":
        "native": "The sky is grey."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2323":
    "native": "purple"
    "notes":
      "n1": "Purple, a colour between red and blue."
    "examples":
      "紫的花很漂亮。":
        "native": "The purple flowers are very pretty."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "她喜欢紫色。":
        "native": "She likes purple."
        "bases":
          "色":
            "meaning": "colour"
  "zh-2324":
    "native": "brown"
    "notes":
      "n1": "Brown, the colour of wood or of a coffee bean."
    "examples":
      "他穿棕色的外套。":
        "native": "He is wearing a brown coat."
        "bases":
          "色":
            "meaning": "colour"
          "的":
            "meaning": "a particle: of; belonging to"
      "棕色的狗很可爱。":
        "native": "The brown dog is very cute."
        "bases":
          "色":
            "meaning": "colour"
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2325":
    "native": "to smile; to laugh"
    "notes":
      "n1": "To smile, or to laugh out loud."
    "examples":
      "她常常笑。": "She often smiles."
      "孩子笑了。":
        "native": "The child laughed."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2326":
    "native": "long hair"
    "notes":
      "n1": "Hair that is long. 长 (cháng) is long, and 发 (fà) is hair."
    "examples":
      "她有长发。":
        "native": "She has long hair."
        "bases":
          "有":
            "meaning": "to have; there is"
      "长发很漂亮。": "Long hair is very pretty."
  "zh-2327":
    "native": "short hair"
    "notes":
      "n1": "Hair that is short. 短 (duǎn) is short, and 发 (fà) is hair."
    "examples":
      "他留短发。":
        "native": "He has short hair."
        "bases":
          "留":
            "meaning": "to grow (hair); to keep"
      "短发很清爽。":
        "native": "Short hair is neat and fresh."
        "bases":
          "清爽":
            "meaning": "fresh and neat"
