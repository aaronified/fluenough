"kind": "layer"
"core": "zh-journey"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Journey"
"description": "Fifty-five words for a trip: the visa and the border, the airport and the flight, the ticket and the fare, the sights, the places to stay, and the roads and the landscape. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-2489":
    "native": "visa"
    "notes":
      "n1": "The permit that lets you enter a country. 签 (qiān) is to sign, and 证 (zhèng) is a certificate."
    "examples":
      "我要办签证。":
        "native": "I need to apply for a visa."
        "bases":
          "要":
            "meaning": "must; to want"
          "办":
            "meaning": "to handle; to apply for"
      "签证还有效吗？":
        "native": "Is the visa still valid?"
        "bases":
          "有":
            "meaning": "to have; there is"
          "效":
            "meaning": "effect; valid"
  "zh-2490":
    "native": "boarding pass"
    "notes":
      "n1": "The card that lets you board the plane. 登 (dēng) is to climb, 机 (jī) is a plane, and 牌 (pái) is a card."
    "examples":
      "请出示登机牌。":
        "native": "Please show your boarding pass."
        "bases":
          "出示":
            "meaning": "to show (a document)"
      "我的登机牌在这里。":
        "native": "My boarding pass is here."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "这里":
            "meaning": "here"
  "zh-2491":
    "native": "security check"
    "notes":
      "n1": "The check at an airport or station. 安 (ān) is safe, and 检 (jiǎn) is to check."
    "examples":
      "安检要多久？":
        "native": "How long does the security check take?"
        "bases":
          "要":
            "meaning": "must; to want"
          "久":
            "meaning": "long (of time)"
      "请排队过安检。": "Please queue for the security check."
  "zh-2492":
    "native": "to take off"
    "notes":
      "n1": "For a plane to leave the ground. 起 (qǐ) is to rise, and 飞 (fēi) is to fly."
    "examples":
      "飞机九点起飞。": "The plane takes off at nine."
      "飞机还没起飞。":
        "native": "The plane has not taken off yet."
        "bases":
          "没":
            "meaning": "not; did not"
  "zh-2493":
    "native": "to land"
    "notes":
      "n1": "For a plane to come down to the ground. 降 (jiàng) is to descend, and 落 (luò) is to fall."
    "examples":
      "飞机准时降落了。":
        "native": "The plane landed on time."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "飞机正在降落。":
        "native": "The plane is landing."
        "bases":
          "正在":
            "meaning": "in the middle of"
  "zh-2494":
    "native": "to check tickets"
    "notes":
      "n1": "To check the tickets at the gate. 检 (jiǎn) is to check, and 票 (piào) is a ticket."
    "examples":
      "现在开始检票。": "Ticket checks start now."
      "请到三号口检票。":
        "native": "Please check in at gate three."
        "bases":
          "到":
            "meaning": "to arrive"
  "zh-2495":
    "native": "ticket office"
    "notes":
      "n1": "The place where tickets are sold. 售 (shòu) is to sell, 票 (piào) is a ticket, and 处 (chù) is a place."
    "examples":
      "售票处在哪儿？":
        "native": "Where is the ticket office?"
        "bases":
          "哪儿":
            "meaning": "where"
      "售票处九点开门。": "The ticket office opens at nine."
  "zh-2496":
    "native": "tour guide"
    "notes":
      "n1": "A person who leads a tour. 导 (dǎo) is to guide, and 游 (yóu) is to tour."
    "examples":
      "导游带我们参观。":
        "native": "The guide takes us around."
        "bases":
          "参观":
            "meaning": "to visit (a place)"
      "我的导游很友好。":
        "native": "My guide is very friendly."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "友好":
            "meaning": "friendly"
  "zh-2497":
    "native": "sight; attraction"
    "notes":
      "n1": "A place that tourists visit. 景 (jǐng) is a view, and 点 (diǎn) is a spot."
    "examples":
      "这个景点很有名。":
        "native": "This sight is very famous."
        "bases":
          "有":
            "meaning": "to have; there is"
          "名":
            "meaning": "name; famous"
      "我们去了三个景点。":
        "native": "We visited three sights."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2498":
    "native": "itinerary; schedule of a trip"
    "notes":
      "n1": "The plan of places and times for a trip. 行 (xíng) is to go, and 程 (chéng) is a route."
    "examples":
      "行程是怎么安排的？":
        "native": "How is the itinerary arranged?"
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "行程很满。":
        "native": "The schedule is full."
        "bases":
          "满":
            "meaning": "full"
  "zh-2499":
    "native": "time difference"
    "notes":
      "n1": "The difference in time between two places. 时 (shí) is time, and 差 (chā) is a difference."
    "examples":
      "北京和伦敦有时差。":
        "native": "Beijing and London have a time difference."
        "bases":
          "北京":
            "meaning": "Beijing"
          "和":
            "meaning": "and"
          "伦敦":
            "meaning": "London"
          "有":
            "meaning": "to have; there is"
      "我有点时差。":
        "native": "I have jet lag."
        "bases":
          "有点":
            "meaning": "a bit"
  "zh-2500":
    "native": "customs"
    "notes":
      "n1": "The place where bags are checked when you enter or leave a country. 海 (hǎi) is the sea, and 关 (guān) is a gate."
    "examples":
      "海关在哪里？": "Where is customs?"
      "我在海关等了很久。":
        "native": "I waited a long time at customs."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "久":
            "meaning": "long (of time)"
  "zh-2501":
    "native": "to enter a country"
    "notes":
      "n1": "To come into a country. 入 (rù) is to enter, and 境 (jìng) is a border."
    "examples":
      "入境要填表。":
        "native": "You must fill in a form to enter."
        "bases":
          "要":
            "meaning": "must; to want"
          "表":
            "meaning": "form (to fill in)"
      "我昨天入境。": "I entered the country yesterday."
  "zh-2502":
    "native": "to leave a country"
    "notes":
      "n1": "To go out of a country. 出 (chū) is to go out, and 境 (jìng) is a border."
    "examples":
      "出境时要带护照。":
        "native": "Bring your passport when you leave."
        "bases":
          "时":
            "meaning": "time; when"
          "要":
            "meaning": "must; to want"
      "他下周出境。": "He leaves the country next week."
  "zh-2503":
    "native": "guesthouse; homestay"
    "notes":
      "n1": "A small family-run place to stay. 民 (mín) is people, and 宿 (sù) is a place to stay."
    "examples":
      "我住在一家民宿。": "I am staying at a guesthouse."
      "这个民宿很安静。": "This guesthouse is very quiet."
  "zh-2504":
    "native": "inn; small hotel"
    "notes":
      "n1": "A simple place to stay the night. 旅 (lǚ) is travel, and 馆 (guǎn) is a building."
    "examples":
      "这个旅馆很便宜。": "This inn is very cheap."
      "我们住在旅馆里。": "We stay in an inn."
  "zh-2505":
    "native": "scenery; landscape"
    "notes":
      "n1": "The view of a place. 风 (fēng) is wind, and 景 (jǐng) is a view."
    "examples":
      "这里的风景很美。":
        "native": "The scenery here is beautiful."
        "bases":
          "这里":
            "meaning": "here"
          "的":
            "meaning": "a particle: of; belonging to"
          "美":
            "meaning": "beautiful"
      "我喜欢海边的风景。":
        "native": "I like the seaside scenery."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2506":
    "native": "embassy"
    "notes":
      "n1": "The office of a country in another country. 大 (dà) is big, 使 (shǐ) is an envoy, and 馆 (guǎn) is a building."
    "examples":
      "我要去大使馆。":
        "native": "I need to go to the embassy."
        "bases":
          "要":
            "meaning": "must; to want"
      "大使馆在哪里？": "Where is the embassy?"
  "zh-2507":
    "native": "navigation; satnav"
    "notes":
      "n1": "The system that shows you the way. 导 (dǎo) is to guide, and 航 (háng) is to navigate."
    "examples":
      "导航说往右拐。":
        "native": "The satnav says turn right."
        "bases":
          "往":
            "meaning": "towards"
      "我用导航找路。":
        "native": "I use satnav to find the way."
        "bases":
          "用":
            "meaning": "to use"
  "zh-2508":
    "native": "tourist"
    "notes":
      "n1": "A person who travels for pleasure. 游 (yóu) is to tour, and 客 (kè) is a guest."
    "examples":
      "这里的游客很多。":
        "native": "There are many tourists here."
        "bases":
          "这里":
            "meaning": "here"
          "的":
            "meaning": "a particle: of; belonging to"
      "游客要注意安全。":
        "native": "Tourists must take care."
        "bases":
          "要":
            "meaning": "must; to want"
          "注意":
            "meaning": "to pay attention"
  "zh-2509":
    "native": "to cancel"
    "notes":
      "n1": "To stop a plan or a booking. 取 (qǔ) is to take, and 消 (xiāo) is to remove."
    "examples":
      "航班取消了。":
        "native": "The flight has been cancelled."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "我要取消预订。":
        "native": "I want to cancel the booking."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-2510":
    "native": "to book; to make an appointment"
    "notes":
      "n1": "To arrange a time or a room ahead. 预 (yù) is in advance, and 约 (yuē) is to arrange."
    "examples":
      "我预约了明天的房间。":
        "native": "I booked a room for tomorrow."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "的":
            "meaning": "a particle: of; belonging to"
      "请提前预约。":
        "native": "Please book in advance."
        "bases":
          "提前":
            "meaning": "in advance"
  "zh-2511":
    "native": "fare; ticket price"
    "notes":
      "n1": "The price of a ticket. 票 (piào) is a ticket, and 价 (jià) is a price."
    "examples":
      "票价是多少？": "What is the fare?"
      "这个票价很贵。": "This fare is very expensive."
  "zh-2512":
    "native": "to refund a ticket"
    "notes":
      "n1": "To give a ticket back and get the money. 退 (tuì) is to return, and 票 (piào) is a ticket."
    "examples":
      "我可以退票吗？":
        "native": "Can I get a refund on my ticket?"
        "bases":
          "可以":
            "meaning": "can; may"
      "退票要收手续费。":
        "native": "A refund has a handling fee."
        "bases":
          "要":
            "meaning": "must; to want"
          "手续费":
            "meaning": "handling fee"
  "zh-2513":
    "native": "to change a ticket"
    "notes":
      "n1": "To move a ticket to another time or date. 改 (gǎi) is to change, and 签 (qiān) is to sign."
    "examples":
      "我要改签到明天。":
        "native": "I want to change my ticket to tomorrow."
        "bases":
          "要":
            "meaning": "must; to want"
          "到":
            "meaning": "to arrive"
      "改签以后不能退。":
        "native": "After a change, it cannot be refunded."
        "bases":
          "能":
            "meaning": "can; may"
          "退":
            "meaning": "to return; to refund"
  "zh-2514":
    "native": "to board a plane"
    "notes":
      "n1": "To go onto the plane. 登 (dēng) is to climb, and 机 (jī) is a plane."
    "examples":
      "请准备登机。": "Please get ready to board."
      "我们已经登机了。":
        "native": "We have already boarded."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2515":
    "native": "to check in luggage"
    "notes":
      "n1": "To hand a bag over to be carried on the plane. 托 (tuō) is to hand over, and 运 (yùn) is to carry."
    "examples":
      "我要托运行李。":
        "native": "I want to check in my luggage."
        "bases":
          "要":
            "meaning": "must; to want"
      "这个箱子可以托运吗？":
        "native": "Can this suitcase be checked in?"
        "bases":
          "可以":
            "meaning": "can; may"
  "zh-2516":
    "native": "beach"
    "notes":
      "n1": "The sand by the sea. 海 (hǎi) is the sea, and 滩 (tān) is a beach."
    "examples":
      "我们去海滩玩。": "We go to the beach to play."
      "海滩上人很多。": "There are many people on the beach."
  "zh-2517":
    "native": "desert"
    "notes":
      "n1": "A dry place with a lot of sand. 沙 (shā) is sand, and 漠 (mò) is a desert."
    "examples":
      "沙漠很热。": "The desert is very hot."
      "我想去沙漠看星星。":
        "native": "I want to go to the desert to see the stars."
        "bases":
          "星星":
            "meaning": "star"
  "zh-2518":
    "native": "grassland; prairie"
    "notes":
      "n1": "A wide area covered with grass. 草 (cǎo) is grass, and 原 (yuán) is a plain."
    "examples":
      "草原上有很多马。":
        "native": "There are many horses on the grassland."
        "bases":
          "有":
            "meaning": "to have; there is"
      "草原很大。": "The grassland is very big."
  "zh-2519":
    "native": "waterfall"
    "notes":
      "n1": "Water falling from a high place. 瀑 (pù) is a waterfall, and 布 (bù) is a cloth or spread."
    "examples":
      "这个瀑布很高。": "This waterfall is very high."
      "我们在瀑布下拍照。": "We took photos under the waterfall."
  "zh-2520":
    "native": "valley"
    "notes":
      "n1": "The low land between two hills. 山 (shān) is a mountain, and 谷 (gǔ) is a valley."
    "examples":
      "山谷里有一条河。":
        "native": "There is a river in the valley."
        "bases":
          "有":
            "meaning": "to have; there is"
          "条":
            "meaning": "measure word for long things"
      "早上山谷很安静。": "The valley is very quiet in the morning."
  "zh-2521":
    "native": "gorge; canyon"
    "notes":
      "n1": "A deep, narrow valley. 峡 (xiá) is a gorge, and 谷 (gǔ) is a valley."
    "examples":
      "峡谷很深。":
        "native": "The gorge is very deep."
        "bases":
          "深":
            "meaning": "deep"
      "我们走了一天才到峡谷。":
        "native": "We walked a day before we reached the gorge."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "才":
            "meaning": "only then"
          "到":
            "meaning": "to arrive"
  "zh-2522":
    "native": "coast"
    "notes":
      "n1": "The land along the sea. 海 (hǎi) is the sea, and 岸 (àn) is a bank."
    "examples":
      "海岸线很长。": "The coastline is very long."
      "我住在海岸边。": "I live by the coast."
  "zh-2523":
    "native": "volcano"
    "notes":
      "n1": "A mountain that can throw out hot rock. 火 (huǒ) is fire, and 山 (shān) is a mountain."
    "examples":
      "这座火山很有名。":
        "native": "This volcano is very famous."
        "bases":
          "座":
            "meaning": "seat"
          "有":
            "meaning": "to have; there is"
          "名":
            "meaning": "name; famous"
      "火山最近没有喷发。":
        "native": "The volcano has not erupted recently."
        "bases":
          "最近":
            "meaning": "recently"
          "没有":
            "meaning": "there is not"
          "喷发":
            "meaning": "to erupt"
  "zh-2524":
    "native": "snow mountain"
    "notes":
      "n1": "A mountain covered with snow. 雪 (xuě) is snow, and 山 (shān) is a mountain."
    "examples":
      "雪山很美。":
        "native": "The snow mountain is beautiful."
        "bases":
          "美":
            "meaning": "beautiful"
      "我们想去看雪山。": "We want to see the snow mountain."
  "zh-2525":
    "native": "old town"
    "notes":
      "n1": "A small town with old buildings. 古 (gǔ) is ancient, and 镇 (zhèn) is a town."
    "examples":
      "这个古镇很漂亮。": "This old town is very pretty."
      "古镇里有很多小店。":
        "native": "There are many small shops in the old town."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-2526":
    "native": "night market"
    "notes":
      "n1": "A market that opens in the evening. 夜 (yè) is night, and 市 (shì) is a market."
    "examples":
      "我们去夜市吃东西。": "We go to the night market to eat."
      "夜市很热闹。": "The night market is lively."
  "zh-2527":
    "native": "cable car"
    "notes":
      "n1": "A car that goes up a hill on a cable. 缆 (lǎn) is a cable, and 车 (chē) is a vehicle."
    "examples":
      "我们坐缆车上山。": "We take the cable car up the mountain."
      "缆车很快。": "The cable car is fast."
  "zh-2528":
    "native": "to walk for a long distance"
    "notes":
      "n1": "To travel on foot, often through the hills. 徒 (tú) is on foot, and 步 (bù) is a step."
    "examples":
      "我们徒步上山。": "We walk up the mountain."
      "徒步要带水。":
        "native": "Take water when you hike."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-2529":
    "native": "lawn; grassy ground"
    "notes":
      "n1": "Ground covered with grass. 草 (cǎo) is grass, and 地 (dì) is ground."
    "examples":
      "草地上有人在玩。":
        "native": "People are playing on the grass."
        "bases":
          "有":
            "meaning": "to have; there is"
      "不要踩草地。":
        "native": "Do not walk on the grass."
        "bases":
          "不要":
            "meaning": "do not"
          "踩":
            "meaning": "to step on"
  "zh-2530":
    "native": "tunnel"
    "notes":
      "n1": "A road or railway that goes through a mountain. 隧 (suì) is a tunnel, and 道 (dào) is a way."
    "examples":
      "火车穿过隧道。":
        "native": "The train goes through the tunnel."
        "bases":
          "穿过":
            "meaning": "to pass through"
      "隧道很长。": "The tunnel is very long."
  "zh-2531":
    "native": "motorway; expressway"
    "notes":
      "n1": "A fast road for long trips. 高 (gāo) is high, 速 (sù) is speed, 公 (gōng) is public, and 路 (lù) is a road."
    "examples":
      "我们走高速公路。": "We take the motorway."
      "高速公路上车很多。": "There are many cars on the motorway."
  "zh-2532":
    "native": "exit"
    "notes":
      "n1": "The way out. 出 (chū) is to go out, and 口 (kǒu) is an opening."
    "examples":
      "出口在哪里？": "Where is the exit?"
      "请从这个出口出去。":
        "native": "Please leave through this exit."
        "bases":
          "从":
            "meaning": "from"
          "出去":
            "meaning": "out"
  "zh-2533":
    "native": "entrance"
    "notes":
      "n1": "The way in. 入 (rù) is to enter, and 口 (kǒu) is an opening."
    "examples":
      "入口在左边。": "The entrance is on the left."
      "请从入口进去。":
        "native": "Please go in through the entrance."
        "bases":
          "从":
            "meaning": "from"
          "进去":
            "meaning": "to go in"
  "zh-2534":
    "native": "souvenir"
    "notes":
      "n1": "A small thing to remember a trip by. 纪 (jì) is to record, 念 (niàn) is to think of, and 品 (pǐn) is a thing."
    "examples":
      "我买了一个纪念品。":
        "native": "I bought a souvenir."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "这家店的纪念品很好看。":
        "native": "The souvenirs in this shop are very nice to look at."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2535":
    "native": "postcard"
    "notes":
      "n1": "A card you send with a picture on the front. 明 (míng) is clear, 信 (xìn) is a letter, and 片 (piàn) is a piece."
    "examples":
      "我给朋友寄了明信片。":
        "native": "I sent a postcard to a friend."
        "bases":
          "给":
            "meaning": "to give; for"
          "寄":
