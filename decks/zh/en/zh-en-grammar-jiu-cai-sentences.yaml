"core": "zh-grammar-jiu-cai-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "就 (jiù) and 才 (cái): early or late, and 快要 (kuàiyào) and 要 (yào): about to"
"description": "Sentences that say an action was early or quick (就 (jiù)), or late or only then (才 (cái)), and that something is about to happen (快要 (kuàiyào), or 要 (yào)). Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-2751":
    "confusables":
      "w1":
        "why": "早 (zǎo) is early, but it does not show a surprise."
      "w2":
        "why": "回 (huí) is to return, a different action."
    "bases":
      "了":
        "meaning": "a particle: a change or a finished action"
    "native": "I got up as early as six."
  "zh-2752":
    "confusables":
      "w1":
        "why": "晚 (wǎn) is late, but on its own."
      "w2":
        "why": "来 (lái) is to come, a different verb."
    "bases":
      "才":
        "meaning": "only then; not until"
      "到":
        "meaning": "to arrive"
    "native": "He only arrived at eleven."
  "zh-2753":
    "confusables":
      "w1":
        "why": "教 (jiāo) is to teach, the teacher's action."
      "w2":
        "why": "练习 (liànxí) is to practise, a different action."
    "bases":
      "才":
        "meaning": "only then; not until"
      "中文":
        "meaning": "Chinese (the language)"
    "native": "I only started learning Chinese at university."
  "zh-2754":
    "confusables":
      "w1":
        "why": "喝 (hē) is to drink, a different action."
      "w2":
        "why": "做 (zuò) is to make, not to eat."
    "bases":
      "才":
        "meaning": "only then; not until"
    "native": "We only ate at eight."
  "zh-2755":
    "confusables":
      "w1":
        "why": "天气 (tiānqì) is the weather, a noun."
      "w2":
        "why": "阴 (yīn) is cloudy, the sky before rain."
    "bases":
      "要":
        "meaning": "to be going to"
      "了":
        "meaning": "a particle: a change or a finished action"
    "native": "It is going to rain."
  "zh-2756":
    "confusables":
      "w1":
        "why": "考试 (kǎoshì) is an exam, not a holiday."
      "w2":
        "why": "结束 (jiéshù) is to end, which comes later."
    "bases":
      "快要":
        "meaning": "about to"
      "了":
        "meaning": "a particle: a change or a finished action"
    "native": "The holiday is about to start."
  "zh-2757":
    "confusables":
      "w1":
        "why": "开始 (kāishǐ) is to begin, the opposite."
      "w2":
        "why": "放假 (fàngjià) is to have a holiday, after the exam."
    "bases":
      "快要":
        "meaning": "about to"
      "了":
        "meaning": "a particle: a change or a finished action"
    "native": "The exam is about to end."
  "zh-2758":
    "confusables":
      "w1":
        "why": "今天 (jīntiān) is today, not tomorrow."
      "w2":
        "why": "天气 (tiānqì) is the weather, a noun."
    "bases":
      "要":
        "meaning": "to be going to"
      "了":
        "meaning": "a particle: a change or a finished action"
    "native": "Is it really going to rain tomorrow?"
