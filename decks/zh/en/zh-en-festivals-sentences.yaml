"cards":
  "zh-3927":
    "confusables":
      "w1":
        "why": "除夕 (chúxī) is New Year's Eve, a single night."
      "w2":
        "why": "团圆 (tuányuán) is to be reunited, a feeling rather than a meal."
    "bases":
      "的":
        "meaning": "of"
    "native": "At the Spring Festival we eat the New Year's Eve dinner together."
  "zh-3928":
    "confusables":
      "w1":
        "why": "粽子 (zòngzi) is a rice dumpling, a different food."
      "w2":
        "why": "汤圆 (tāngyuán) is a sweet dumpling, a different food."
    "bases":
      "的":
        "meaning": "of"
    "native": "The mooncakes at Mid-Autumn are very sweet."
  "zh-3929":
    "confusables":
      "w1":
        "why": "红包 (hóngbāo) is a red envelope, a close word."
      "w2":
        "why": "礼物 (lǐwù) is a gift, a wider word."
    "bases":
      "了":
        "meaning": "a particle"
    "native": "The child received New Year money."
  "zh-3930":
    "confusables":
      "w1":
        "why": "花灯 (huādēng) is a decorative lantern, a different kind."
      "w2":
        "why": "对联 (duìlián) is a couplet, a different decoration."
    "bases":
      "着":
        "meaning": "a particle: a state continues"
    "native": "A red lantern hangs at the door."
  "zh-3931":
    "confusables":
      "w1":
        "why": "爆竹 (bàozhú) is a firecracker, a close word."
      "w2":
        "why": "灯会 (dēnghuì) is a lantern show, a different event."
    "bases":
      "和":
        "meaning": "and"
    "native": "In the evening, we set off fireworks and firecrackers."
  "zh-3932":
    "confusables":
      "w1":
        "why": "赏花 (shǎnghuā) is to see flowers, a different sight."
      "w2":
        "why": "庙会 (miàohuì) is a temple fair, a different event."
    "native": "We go to enjoy the moon, and also go on a spring walk."
  "zh-3933":
    "confusables":
      "w1":
        "why": "亲戚 (qīnqi) is a relative, a wider family word."
      "w2":
        "why": "家人 (jiārén) is family, a close word."
    "bases":
      "和":
        "meaning": "and"
    "native": "Elders and younger generations get together."
  "zh-3934":
    "confusables":
      "w1":
        "why": "许愿 (xǔyuàn) is to make a wish, a personal act."
      "w2":
        "why": "拜年 (bàinián) is to visit at New Year, a different act."
    "bases":
      "给":
        "meaning": "to give; for"
      "新年":
        "meaning": "new year"
    "native": "I send you my good wishes, happy New Year."
