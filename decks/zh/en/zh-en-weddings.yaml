"core": "zh-weddings"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Weddings"
"description": "Forty-five words for weddings and marriage: the ceremony and the banquet, the bride and the groom, the rings and the gifts, the proposal and the love, and the words for the new family. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-3941":
    "native": "wedding ceremony"
    "notes":
      "n1": "The ceremony of getting married. 婚 (hūn) is marriage, and 礼 (lǐ) is a ceremony."
    "examples":
      "婚礼很热闹。": "The wedding was very lively."
      "我们办婚礼。":
        "native": "We are holding a wedding."
        "bases":
          "办":
            "meaning": "to hold"
  "zh-3942":
    "native": "marriage"
    "notes":
      "n1": "The state of being married. 婚 (hūn) is marriage, and 姻 (yīn) is a union."
    "examples":
      "婚姻很重要。": "Marriage is very important."
      "他们的婚姻很幸福。":
        "native": "Their marriage is very happy."
        "bases":
          "的":
            "meaning": "of"
  "zh-3943":
    "native": "to get married"
    "notes":
      "n1": "To become husband and wife. 结 (jié) is to tie, and 婚 (hūn) is marriage."
    "examples":
      "他们明年结婚。": "They are getting married next year."
      "我想结婚。": "I want to get married."
  "zh-3944":
    "native": "bride"
    "notes":
      "n1": "A woman on her wedding day. 新 (xīn) is new, and 娘 (niáng) is a young woman."
    "examples":
      "新娘很漂亮。": "The bride is very pretty."
      "新娘穿着红色的衣服。":
        "native": "The bride is wearing red."
        "bases":
          "着":
            "meaning": "a particle: a state continues"
          "的":
            "meaning": "of"
  "zh-3945":
    "native": "bridegroom"
    "notes":
      "n1": "A man on his wedding day. 新 (xīn) is new, and 郎 (láng) is a man."
    "examples":
      "新郎很高兴。": "The groom is very happy."
      "新郎和新娘来了。":
        "native": "The groom and the bride have arrived."
        "bases":
          "和":
            "meaning": "and"
          "了":
            "meaning": "a particle"
  "zh-3946":
    "native": "bridesmaid"
    "notes":
      "n1": "A woman who helps the bride on her wedding day. 伴 (bàn) is a companion, and 娘 (niáng) is a young woman."
    "examples":
      "她是伴娘。": "She is a bridesmaid."
      "伴娘很漂亮。": "The bridesmaids are very pretty."
  "zh-3947":
    "native": "best man"
    "notes":
      "n1": "A man who helps the groom on his wedding day. 伴 (bàn) is a companion, and 郎 (láng) is a man."
    "examples":
      "他是伴郎。": "He is the best man."
      "伴郎讲了话。":
        "native": "The best man gave a speech."
        "bases":
          "了":
            "meaning": "a particle"
          "话":
            "meaning": "words; speech"
  "zh-3948":
    "native": "wedding invitation"
    "notes":
      "n1": "An invitation card for an event. 请 (qǐng) is to invite, and 帖 (tiē) is a card."
    "examples":
      "我收到了请帖。":
        "native": "I received a wedding invitation."
        "bases":
          "了":
            "meaning": "a particle"
      "请帖很漂亮。": "The invitation is very pretty."
  "zh-3949":
    "native": "wedding banquet"
    "notes":
      "n1": "A feast at a wedding. 喜 (xǐ) is joy, and 酒 (jiǔ) is a drink."
    "examples":
      "我们去喝喜酒。": "We are going to the wedding feast."
      "喜酒很热闹。": "The wedding feast is very lively."
  "zh-3950":
    "native": "wedding dress"
    "notes":
      "n1": "The white dress a bride wears. 婚 (hūn) is marriage, and 纱 (shā) is gauze."
    "examples":
      "新娘的婚纱很美。":
        "native": "The bride's wedding dress is beautiful."
        "bases":
          "的":
            "meaning": "of"
          "美":
            "meaning": "beautiful"
      "她买了一件婚纱。":
        "native": "She bought a wedding dress."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3951":
    "native": "ring"
    "notes":
      "n1": "A ring worn on the finger. 戒 (jiè) is a ring, and 指 (zhǐ) is a finger."
    "examples":
      "他买了戒指。":
        "native": "He bought a ring."
        "bases":
          "了":
            "meaning": "a particle"
      "戒指很亮。":
        "native": "The ring is very shiny."
        "bases":
          "亮":
            "meaning": "bright"
  "zh-3952":
    "native": "honeymoon"
    "notes":
      "n1": "The trip a couple takes after marriage. 蜜 (mì) is honey, and 月 (yuè) is a month."
    "examples":
      "他们去海边度蜜月。":
        "native": "They went to the seaside on honeymoon."
        "bases":
          "度":
            "meaning": "to spend (a holiday)"
      "蜜月很开心。": "The honeymoon was very happy."
  "zh-3953":
    "native": "to get engaged"
    "notes":
      "n1": "To promise to marry. 订 (dìng) is to arrange, and 婚 (hūn) is marriage."
    "examples":
      "他们订婚了。":
        "native": "They got engaged."
        "bases":
          "了":
            "meaning": "a particle"
      "订婚以后要准备婚礼。":
        "native": "After the engagement, the wedding must be prepared."
        "bases":
          "要":
            "meaning": "to want"
  "zh-3954":
    "native": "betrothal gifts"
    "notes":
      "n1": "Gifts from the groom's family to the bride's family. 彩 (cǎi) is colourful, and 礼 (lǐ) is a gift."
    "examples":
      "彩礼很重要。": "The betrothal gifts are very important."
      "彩礼要商量。":
        "native": "The betrothal gifts must be discussed."
        "bases":
          "要":
            "meaning": "to want"
          "商量":
            "meaning": "to discuss"
  "zh-3955":
    "native": "dowry"
    "notes":
      "n1": "Things a bride brings to her new home. 嫁 (jià) is to marry, and 妆 (zhuāng) is dress."
    "examples":
      "嫁妆很多。": "There is a large dowry."
      "她带了嫁妆。":
        "native": "She brought her dowry."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3956":
    "native": "wedding feast"
    "notes":
      "n1": "A meal held at a wedding. 婚 (hūn) is marriage, and 宴 (yàn) is a feast."
    "examples":
      "婚宴在酒店。": "The wedding feast is at the hotel."
      "婚宴很丰盛。":
        "native": "The wedding feast is very rich."
        "bases":
          "丰盛":
            "meaning": "rich; lavish"
  "zh-3957":
    "native": "hall (for ceremonies)"
    "notes":
      "n1": "A large hall for events. 礼 (lǐ) is a ceremony, and 堂 (táng) is a hall."
    "examples":
      "婚礼在礼堂举行。": "The wedding is held in the hall."
      "礼堂很大。": "The hall is very big."
  "zh-3958":
    "native": "witness at a wedding"
    "notes":
      "n1": "A person who witnesses a wedding. 证 (zhèng) is proof, 婚 (hūn) is marriage, and 人 (rén) is a person."
    "examples":
      "老师是证婚人。": "The teacher was the wedding witness."
      "证婚人讲了话。":
        "native": "The witness gave a speech."
        "bases":
          "了":
            "meaning": "a particle"
          "话":
            "meaning": "words; speech"
  "zh-3959":
    "native": "to register"
    "notes":
      "n1": "To record one's name officially. 登 (dēng) is to record, and 记 (jì) is to write down."
    "examples":
      "我们去登记结婚。": "We are going to register our marriage."
      "登记需要身份证。": "Registration needs an identity card."
  "zh-3960":
    "native": "to collect the marriage certificate"
    "notes":
      "n1": "To receive an official certificate. 领 (lǐng) is to receive, and 证 (zhèng) is a certificate."
    "examples":
      "我们今天领证。": "We collect our certificate today."
      "领证以后就是夫妻了。":
        "native": "After collecting the certificate they are husband and wife."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3961":
    "native": "husband and wife"
    "notes":
      "n1": "A married couple. 夫 (fū) is husband, and 妻 (qī) is wife."
    "examples":
      "他们是夫妻。": "They are husband and wife."
      "夫妻要互相尊重。":
        "native": "A husband and wife should respect each other."
        "bases":
          "要":
            "meaning": "to want"
          "互相":
            "meaning": "each other"
  "zh-3962":
    "native": "husband"
    "notes":
      "n1": "A married man. 丈 (zhàng) is an elder, and 夫 (fū) is a man."
    "examples":
      "她的丈夫很好。":
        "native": "Her husband is very good."
        "bases":
          "的":
            "meaning": "of"
      "丈夫在工作。": "Her husband is at work."
  "zh-3963":
    "native": "wife"
    "notes":
      "n1": "A married woman. 妻 (qī) is wife, and 子 (zi) is a word ending."
    "examples":
      "他的妻子很漂亮。":
        "native": "His wife is very pretty."
        "bases":
          "的":
            "meaning": "of"
      "妻子在家。": "His wife is at home."
  "zh-3964":
    "native": "husband (informal)"
    "notes":
      "n1": "A casual word for husband. 老 (lǎo) is old or familiar, and 公 (gōng) is a man."
    "examples":
      "我的老公很忙。":
        "native": "My husband is very busy."
        "bases":
          "的":
            "meaning": "of"
      "老公回家了。":
        "native": "My husband has come home."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3965":
    "native": "wife (informal)"
    "notes":
      "n1": "A casual word for wife. 老 (lǎo) is old or familiar, and 婆 (pó) is a woman."
    "examples":
      "我的老婆很好。":
        "native": "My wife is very good."
        "bases":
          "的":
            "meaning": "of"
      "老婆在做饭。": "My wife is cooking."
  "zh-3966":
    "native": "to be in love"
    "notes":
      "n1": "To have a romantic relationship. 恋 (liàn) is to be attached, and 爱 (ài) is love."
    "examples":
      "他们在恋爱。": "They are in love."
      "恋爱很甜蜜。":
        "native": "Being in love is very sweet."
        "bases":
          "甜蜜":
            "meaning": "sweet"
  "zh-3967":
    "native": "to propose"
    "notes":
      "n1": "To ask someone to marry you. 求 (qiú) is to ask, and 婚 (hūn) is marriage."
    "examples":
      "他向她求婚了。":
        "native": "He proposed to her."
        "bases":
          "向":
            "meaning": "towards"
          "了":
            "meaning": "a particle"
      "求婚很浪漫。":
        "native": "The proposal was very romantic."
        "bases":
          "浪漫":
            "meaning": "romantic"
  "zh-3968":
    "native": "to declare one's love"
    "notes":
      "n1": "To say clearly that one loves someone. 表 (biǎo) is to show, and 白 (bái) is clear."
    "examples":
      "他向她表白了。":
        "native": "He declared his love to her."
        "bases":
          "向":
            "meaning": "towards"
          "了":
            "meaning": "a particle"
      "表白需要勇气。":
        "native": "Declaring love takes courage."
        "bases":
          "勇气":
            "meaning": "courage"
  "zh-3969":
    "native": "date"
    "notes":
      "n1": "A meeting with someone you like. 约 (yuē) is to arrange, and 会 (huì) is a meeting."
    "examples":
      "我们有约会。":
        "native": "We have a date."
        "bases":
          "有":
            "meaning": "to have; there is"
      "约会很开心。": "The date was very happy."
  "zh-3970":
    "native": "boyfriend"
    "notes":
      "n1": "A man you are dating. 男 (nán) is male, 朋 (péng) is friend, and 友 (yǒu) is friend."
    "examples":
      "她有一个男朋友。":
        "native": "She has a boyfriend."
        "bases":
          "有":
            "meaning": "to have; there is"
          "男":
            "meaning": "male"
      "我的男朋友很好。":
        "native": "My boyfriend is very good."
        "bases":
          "的":
            "meaning": "of"
          "男":
            "meaning": "male"
  "zh-3971":
    "native": "girlfriend"
    "notes":
      "n1": "A woman you are dating. 女 (nǚ) is female, 朋 (péng) is friend, and 友 (yǒu) is friend."
    "examples":
      "他有一个女朋友。":
        "native": "He has a girlfriend."
        "bases":
          "有":
            "meaning": "to have; there is"
      "我的女朋友很漂亮。":
        "native": "My girlfriend is very pretty."
        "bases":
          "的":
            "meaning": "of"
  "zh-3972":
    "native": "feeling; love"
    "notes":
      "n1": "The feelings between people. 感 (gǎn) is to feel, and 情 (qíng) is feeling."
    "examples":
      "他们的感情很好。":
        "native": "Their relationship is very good."
        "bases":
          "的":
            "meaning": "of"
      "感情要好好珍惜。":
        "native": "Feelings should be treasured."
        "bases":
          "要":
            "meaning": "to want"
          "好好":
            "meaning": "properly"
          "珍惜":
            "meaning": "to treasure"
  "zh-3973":
    "native": "romantic love"
    "notes":
      "n1": "Love between two people. 爱 (ài) is love, and 情 (qíng) is feeling."
    "examples":
      "这是一段美好的爱情。":
        "native": "This is a beautiful romance."
        "bases":
          "段":
            "meaning": "measure word for a period"
          "美好":
            "meaning": "beautiful and good"
          "的":
            "meaning": "of"
      "爱情很美。":
        "native": "Love is very beautiful."
        "bases":
          "美":
            "meaning": "beautiful"
  "zh-3974":
    "native": "vow"
    "notes":
      "n1": "A serious promise. 誓 (shì) is to swear, and 言 (yán) is words."
    "examples":
      "他们说了誓言。":
        "native": "They spoke their vows."
        "bases":
          "了":
            "meaning": "a particle"
      "誓言很感人。": "The vows were very moving."
  "zh-3975":
    "native": "greeting card"
    "notes":
      "n1": "A card for a celebration. 贺 (hè) is to congratulate, and 卡 (kǎ) is a card."
    "examples":
      "我送了一张贺卡。":
        "native": "I sent a greeting card."
        "bases":
          "了":
            "meaning": "a particle"
      "贺卡很漂亮。": "The card is very pretty."
  "zh-3976":
    "native": "newly married"
    "notes":
      "n1": "Recently married. 新 (xīn) is new, and 婚 (hūn) is marriage."
    "examples":
      "他们是新婚夫妇。":
        "native": "They are a newly married couple."
        "bases":
          "夫妇":
            "meaning": "couple"
      "新婚快乐！": "Congratulations on your marriage!"
  "zh-3977":
    "native": "marriage home"
    "notes":
      "n1": "The home a couple gets for marriage. 婚 (hūn) is marriage, and 房 (fáng) is a house."
    "examples":
      "他们有了婚房。":
        "native": "They have their marriage home."
        "bases":
          "有":
            "meaning": "to have; there is"
          "了":
            "meaning": "a particle"
      "婚房很大。": "The marriage home is very big."
  "zh-3978":
    "native": "in-laws (parents of the couple)"
    "notes":
      "n1": "The families of a married couple. 亲 (qīn) is close, and 家 (jiā) is a family."
    "examples":
      "我们和亲家吃饭。":
        "native": "We eat with the in-laws."
        "bases":
          "和":
            "meaning": "and"
      "亲家很好。": "The in-laws are very good."
  "zh-3979":
    "native": "matchmaker"
    "notes":
      "n1": "A person who introduces people to marry. 媒 (méi) is a go-between, and 人 (rén) is a person."
    "examples":
      "媒人介绍了他们。":
        "native": "The matchmaker introduced them."
        "bases":
          "了":
            "meaning": "a particle"
      "媒人很热心。": "The matchmaker is very kind."
  "zh-3980":
    "native": "to serve tea to elders"
    "notes":
      "n1": "A custom where the couple offers tea to their elders. 敬 (jìng) is to respect, and 茶 (chá) is tea."
    "examples":
      "新娘向长辈敬茶。":
        "native": "The bride serves tea to the elders."
        "bases":
          "向":
            "meaning": "towards"
      "敬茶是一个传统。": "Serving tea is a tradition."
  "zh-3981":
    "native": "wedding sweets"
    "notes":
      "n1": "Sweets given at a wedding. 喜 (xǐ) is joy, and 糖 (táng) is sugar."
    "examples":
      "宾客拿到了喜糖。":
        "native": "The guests received wedding sweets."
        "bases":
          "拿到":
            "meaning": "to get"
          "了":
            "meaning": "a particle"
      "喜糖很甜。": "The wedding sweets are very sweet."
  "zh-3982":
    "native": "bouquet"
    "notes":
      "n1": "A bunch of flowers tied together. 花 (huā) is a flower, and 束 (shù) is a bunch."
    "examples":
      "新娘拿着花束。":
        "native": "The bride holds a bouquet."
        "bases":
          "着":
            "meaning": "a particle: a state continues"
      "花束很香。": "The bouquet smells very nice."
  "zh-3983":
    "native": "bridal bouquet"
    "notes":
      "n1": "A bouquet held in the hands. 捧 (pěng) is to hold in both hands, and 花 (huā) is a flower."
    "examples":
      "新娘扔了捧花。":
        "native": "The bride threw her bouquet."
        "bases":
          "了":
            "meaning": "a particle"
      "捧花很漂亮。": "The bridal bouquet is very pretty."
  "zh-3984":
    "native": "family"
    "notes":
      "n1": "The people who live together as one unit. 家 (jiā) is home, and 庭 (tíng) is a courtyard."
    "examples":
      "我们的家庭很大。":
        "native": "Our family is very big."
        "bases":
          "的":
            "meaning": "of"
      "家庭很重要。": "Family is very important."
  "zh-3985":
    "native": "guests"
    "notes":
      "n1": "Guests invited to an event. 宾 (bīn) is a guest, and 客 (kè) is a guest."
    "examples":
      "宾客很多。": "There are many guests."
      "宾客都来了。":
        "native": "All the guests have come."
        "bases":
          "了":
            "meaning": "a particle"
