"name": "想 (xiǎng), 会 (huì) and 可以 (kěyǐ) in sentences"
"description": "Sentences with 想 (xiǎng) for wanting, 会 (huì) for knowing how, and 可以 (kěyǐ) for being allowed. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1051":
    "confusables":
      "w1":
        "why": "回家 (huíjiā) is to go home, a different place."
      "w2":
        "why": "上班 (shàngbān) is to go to work, not to school."
    "native": "I want to go to school."
  "zh-1052":
    "confusables":
      "w1":
        "why": "听 (tīng) is to listen, which does not say he can speak."
      "w2":
        "why": "写 (xiě) is to write, a different skill."
    "bases":
      "会":
        "meaning": "can; to know how to"
      "中文":
        "meaning": "Chinese (the language)"
    "native": "He can speak Chinese."
  "zh-1053":
    "confusables":
      "w1":
        "why": "站 (zhàn) is to stand, not to sit."
      "w2":
        "why": "走 (zǒu) is to walk away, not to sit down."
    "bases":
      "可以":
        "meaning": "can; may"
    "native": "You may sit here."
  "zh-1054":
    "confusables":
      "w1":
        "why": "喝 (hē) is to drink, not to eat."
      "w2":
        "why": "买 (mǎi) is to buy, a different action."
    "native": "I do not want to eat."
  "zh-1055":
    "confusables":
      "w1":
        "why": "吃 (chī) is to eat, a different action."
      "w2":
        "why": "买 (mǎi) is to buy, not to cook."
    "bases":
      "会":
        "meaning": "can; to know how to"
    "native": "Mum can cook."
  "zh-1056":
    "confusables":
      "w1":
        "why": "骑 (qí) is to ride a bike, not to drive."
      "w2":
        "why": "开 (kāi) is to open, not drive."
    "bases":
      "会":
        "meaning": "can; to know how to"
    "native": "I cannot drive."
  "zh-1057":
    "confusables":
      "w1":
        "why": "来 (lái) is to come, the other way round."
      "w2":
        "why": "学校 (xuéxiào) is a school, a different place."
    "bases":
      "可以":
        "meaning": "can; may"
    "native": "We may go to the park."
  "zh-1058":
    "confusables":
      "w1":
        "why": "吃 (chī) is to eat, not to drink."
      "w2":
        "why": "水 (shuǐ) is water, a different drink."
    "native": "Do you want to drink tea?"
