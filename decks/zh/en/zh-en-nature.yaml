"schema": 1
"id": "zh-en-nature"
"kind": "layer"
"core": "zh-nature"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Nature"
"description": "Forty words for nature: the land and the stones, the trees and the plants, the water and the sea, the weather and the sky, and the small creatures. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-2566":
    "native": "wood; small forest"
    "notes":
      "n1": "A group of trees. 树 (shù) is a tree, and 林 (lín) is a wood."
    "examples":
      "我们在树林里散步。": "We walk in the wood."
      "树林很安静。": "The wood is very quiet."
  "zh-2567":
    "native": "stone; rock"
    "notes":
      "n1": "A small hard piece of rock. 石 (shí) is stone, and 头 (tou) is a word ending."
    "examples":
      "河边有很多石头。":
        "native": "There are many stones by the river."
        "bases":
          "河边":
            "meaning": "by the river"
          "有":
            "meaning": "to have; there is"
      "这块石头很大。":
        "native": "This stone is very big."
        "bases":
          "块":
            "meaning": "measure word for lumps and pieces"
  "zh-2568":
    "native": "rock (large mass)"
    "notes":
      "n1": "A big mass of rock in the ground or on a cliff. 岩 (yán) is a cliff, and 石 (shí) is stone."
    "examples":
      "山上有大岩石。":
        "native": "There are big rocks on the mountain."
        "bases":
          "山上":
            "meaning": "on the mountain"
          "有":
            "meaning": "to have; there is"
      "岩石很硬。":
        "native": "The rock is very hard."
        "bases":
          "硬":
            "meaning": "hard"
  "zh-2569":
    "native": "mud"
    "notes":
      "n1": "Wet soft earth. 泥 (ní) is mud."
    "examples":
      "鞋上有泥。":
        "native": "There is mud on the shoes."
        "bases":
          "有":
            "meaning": "to have; there is"
      "路上都是泥。": "The road is full of mud."
  "zh-2570":
    "native": "soil; earth"
    "notes":
      "n1": "Dirt that plants grow in. 泥 (ní) is mud, and 土 (tǔ) is earth."
    "examples":
      "泥土很湿。": "The soil is very wet."
      "花长在泥土里。": "The flower grows in the soil."
  "zh-2571":
    "native": "earth; soil"
    "notes":
      "n1": "The ground. 土 (tǔ) is earth."
    "examples":
      "土很干。":
        "native": "The earth is very dry."
        "bases":
          "干":
            "meaning": "dry"
      "这块土很好。":
        "native": "This land is very good."
        "bases":
          "块":
            "meaning": "measure word for lumps and pieces"
  "zh-2572":
    "native": "land"
    "notes":
      "n1": "An area of ground, often for farming. 土 (tǔ) is earth, and 地 (dì) is ground."
    "examples":
      "这块土地很大。":
        "native": "This piece of land is very big."
        "bases":
          "块":
            "meaning": "measure word for lumps and pieces"
      "农民在土地上工作。": "The farmers work on the land."
  "zh-2573":
    "native": "sand"
    "notes":
      "n1": "Tiny grains of rock on a beach or in a desert. 沙 (shā) is sand."
    "examples":
      "沙很热。": "The sand is very hot."
      "孩子在沙上玩。": "The children play on the sand."
  "zh-2574":
    "native": "sand (as grains)"
    "notes":
      "n1": "Sand, as a small grain. 沙 (shā) is sand, and 子 (zi) is a word ending."
    "examples":
      "沙子进了鞋里。":
        "native": "Sand got into my shoe."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "这里的沙子很细。":
        "native": "The sand here is very fine."
        "bases":
          "这里":
            "meaning": "here"
          "的":
            "meaning": "a particle: of; belonging to"
          "细":
            "meaning": "fine; thin"
  "zh-2575":
    "native": "dew"
    "notes":
      "n1": "Small drops of water on grass in the morning. 露 (lù) is dew."
    "examples":
      "草上有露。":
        "native": "There is dew on the grass."
        "bases":
          "有":
            "meaning": "to have; there is"
      "早上的露很亮。":
        "native": "The morning dew is bright."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "亮":
            "meaning": "bright"
  "zh-2576":
    "native": "the earth (the planet)"
    "notes":
      "n1": "The planet we live on. 地 (dì) is the ground, and 球 (qiú) is a ball."
    "examples":
      "地球很大。": "The earth is very big."
      "地球绕着太阳转。":
        "native": "The earth goes round the sun."
        "bases":
          "绕":
            "meaning": "to go round"
          "着":
            "meaning": "a particle: an action goes on"
  "zh-2577":
    "native": "ocean"
    "notes":
      "n1": "A very large area of sea. 海 (hǎi) is the sea, and 洋 (yáng) is an ocean."
    "examples":
      "海洋很深。":
        "native": "The ocean is very deep."
        "bases":
          "深":
            "meaning": "deep"
      "海洋里有很多鱼。":
        "native": "There are many fish in the ocean."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-2578":
    "native": "pond"
    "notes":
      "n1": "A small pool of water. 池 (chí) is a pool, and 塘 (táng) is a pond."
    "examples":
      "池塘里有鱼。":
        "native": "There are fish in the pond."
        "bases":
          "有":
            "meaning": "to have; there is"
      "池塘边很安静。": "It is very quiet by the pond."
  "zh-2579":
    "native": "spring (of water)"
    "notes":
      "n1": "Water that comes up out of the ground. 泉 (quán) is a spring."
    "examples":
      "山里有一个泉。":
        "native": "There is a spring in the hills."
        "bases":
          "山里":
            "meaning": "in the mountains"
          "有":
            "meaning": "to have; there is"
      "泉水很清。":
        "native": "The spring water is very clear."
        "bases":
          "泉水":
            "meaning": "spring water"
          "清":
            "meaning": "clear"
  "zh-2580":
    "native": "stream"
    "notes":
      "n1": "A small river. 小 (xiǎo) is small, and 溪 (xī) is a stream."
    "examples":
      "小溪里的水很清。":
        "native": "The water in the stream is very clear."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "清":
            "meaning": "clear"
      "我们在小溪边坐了一会儿。":
        "native": "We sat by the stream for a while."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "会儿":
            "meaning": "a while"
  "zh-2581":
    "native": "bamboo"
    "notes":
      "n1": "A tall plant with hollow stems. 竹 (zhú) is bamboo, and 子 (zi) is a word ending."
    "examples":
      "这里有很多竹子。":
        "native": "There is a lot of bamboo here."
        "bases":
          "这里":
            "meaning": "here"
          "有":
            "meaning": "to have; there is"
      "竹子很高。": "The bamboo is very tall."
  "zh-2582":
    "native": "pine tree"
    "notes":
      "n1": "A tree with needle-like leaves. 松 (sōng) is pine, and 树 (shù) is a tree."
    "examples":
      "山上有松树。":
        "native": "There are pine trees on the mountain."
        "bases":
          "山上":
            "meaning": "on the mountain"
          "有":
            "meaning": "to have; there is"
      "松树一年都是绿的。":
        "native": "Pine trees are green all year."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2583":
    "native": "willow tree"
    "notes":
      "n1": "A tree with long hanging branches. 柳 (liǔ) is willow, and 树 (shù) is a tree."
    "examples":
      "河边有柳树。":
        "native": "There are willow trees by the river."
        "bases":
          "河边":
            "meaning": "by the river"
          "有":
            "meaning": "to have; there is"
      "柳树的枝很长。":
        "native": "The willow's branches are very long."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "枝":
            "meaning": "branch"
  "zh-2584":
    "native": "fruit tree"
    "notes":
      "n1": "A tree that grows fruit. 果 (guǒ) is fruit, and 树 (shù) is a tree."
    "examples":
      "院子里有果树。":
        "native": "There is a fruit tree in the yard."
        "bases":
          "有":
            "meaning": "to have; there is"
      "果树开了花。":
        "native": "The fruit tree has come into flower."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2585":
    "native": "flower (a bloom)"
    "notes":
      "n1": "A single flower head. 花 (huā) is a flower, and 朵 (duǒ) is a measure for flowers."
    "examples":
      "这朵花很漂亮。":
        "native": "This flower is very pretty."
        "bases":
          "朵":
            "meaning": "measure word for flowers"
      "花朵开了。":
        "native": "The flowers have bloomed."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2586":
    "native": "plant"
    "notes":
      "n1": "A living thing that grows from the ground. 植 (zhí) is to plant, and 物 (wù) is a thing."
    "examples":
      "这是一种植物。":
        "native": "This is a kind of plant."
        "bases":
          "种":
            "meaning": "kind; type"
      "植物需要水。": "Plants need water."
  "zh-2587":
    "native": "living thing; creature"
    "notes":
      "n1": "Something that is alive. 生 (shēng) is life, and 物 (wù) is a thing."
    "examples":
      "海里有很多生物。":
        "native": "There are many creatures in the sea."
        "bases":
          "海里":
            "meaning": "in the sea"
          "有":
            "meaning": "to have; there is"
      "生物需要空气。": "Living things need air."
  "zh-2588":
    "native": "insect; bug"
    "notes":
      "n1": "A small creature with many legs. 虫 (chóng) is an insect, and 子 (zi) is a word ending."
    "examples":
      "草里有虫子。":
        "native": "There are bugs in the grass."
        "bases":
          "有":
            "meaning": "to have; there is"
      "虫子飞进了屋子。":
        "native": "A bug flew into the room."
        "bases":
          "飞":
            "meaning": "to fly"
          "了":
            "meaning": "a particle: a change has happened"
          "屋子":
            "meaning": "room"
  "zh-2589":
    "native": "star"
    "notes":
      "n1": "A light you see in the night sky. 星 (xīng) is a star."
    "examples":
      "天上有很多星星。":
        "native": "There are many stars in the sky."
        "bases":
          "天上":
            "meaning": "in the sky"
          "有":
            "meaning": "to have; there is"
      "星星很亮。":
        "native": "The stars are very bright."
        "bases":
          "亮":
            "meaning": "bright"
  "zh-2590":
    "native": "wave (of the sea)"
    "notes":
      "n1": "A wave on the sea. 海 (hǎi) is the sea, and 浪 (làng) is a wave."
    "examples":
      "海浪很大。": "The waves are very big."
      "我喜欢看海浪。": "I like watching the waves."
  "zh-2591":
    "native": "hole; cave"
    "notes":
      "n1": "An opening in the ground or in a rock. 洞 (dòng) is a hole or a cave."
    "examples":
      "山上有一个洞。":
        "native": "There is a cave on the mountain."
        "bases":
          "山上":
            "meaning": "on the mountain"
          "有":
            "meaning": "to have; there is"
      "小动物住在洞里。": "Small animals live in holes."
  "zh-2592":
    "native": "cliff"
    "notes":
      "n1": "A very steep rock face. 悬 (xuán) is to hang, and 崖 (yá) is a cliff."
    "examples":
      "悬崖很高。": "The cliff is very high."
      "不要靠近悬崖。":
        "native": "Do not go near the cliff."
        "bases":
          "不要":
            "meaning": "do not"
          "靠近":
            "meaning": "to approach"
  "zh-2593":
    "native": "sunshine"
    "notes":
      "n1": "The light and warmth of the sun. 阳 (yáng) is the sun, and 光 (guāng) is light."
    "examples":
      "阳光很好。": "The sunshine is lovely."
      "阳光照在树上。":
        "native": "The sunshine shines on the tree."
        "bases":
          "照":
            "meaning": "to shine on"
  "zh-2594":
    "native": "to be windy"
    "notes":
      "n1": "For the wind to blow. 刮 (guā) is to blow, and 风 (fēng) is wind."
    "examples":
      "今天刮风。": "It is windy today."
      "外面刮风了。":
        "native": "It has become windy outside."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2595":
    "native": "to thunder"
    "notes":
      "n1": "For thunder to sound. 打 (dǎ) is to make, and 雷 (léi) is thunder."
    "examples":
      "晚上打雷了。":
        "native": "It thundered in the evening."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "打雷的时候不要出去。":
        "native": "Do not go out when it thunders."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "不要":
            "meaning": "do not"
          "出去":
            "meaning": "out"
  "zh-2596":
    "native": "cloudy; overcast"
    "notes":
      "n1": "Without sun. 阴 (yīn) is cloudy."
    "examples":
      "今天很阴。": "It is cloudy today."
      "天阴了。":
        "native": "The sky has clouded over."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2597":
    "native": "the land; the earth"
    "notes":
      "n1": "The ground and the land as a whole. 大 (dà) is big, and 地 (dì) is ground."
    "examples":
      "大地上有很多花。":
        "native": "There are many flowers on the land."
        "bases":
          "有":
            "meaning": "to have; there is"
      "冬天的大地很冷。":
        "native": "The land is cold in winter."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2598":
    "native": "universe"
    "notes":
      "n1": "All of space and everything in it. 宇 (yǔ) is space, and 宙 (zhòu) is time."
    "examples":
      "宇宙很大。": "The universe is very big."
      "我想了解宇宙。":
        "native": "I want to learn about the universe."
        "bases":
          "了解":
            "meaning": "to understand"
  "zh-2599":
    "native": "rainforest"
    "notes":
      "n1": "A thick forest with a lot of rain. 雨 (yǔ) is rain, and 林 (lín) is a wood."
    "examples":
      "雨林里很热。": "It is very hot in the rainforest."
      "雨林里有很多鸟。":
        "native": "There are many birds in the rainforest."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-2600":
    "native": "plateau"
    "notes":
      "n1": "A high, flat area of land. 高 (gāo) is high, and 原 (yuán) is a plain."
    "examples":
      "高原上很冷。": "It is cold on the plateau."
      "这里是一个高原。":
        "native": "This is a plateau."
        "bases":
          "这里":
            "meaning": "here"
  "zh-2601":
    "native": "field; countryside"
    "notes":
      "n1": "The open land where crops grow. 田 (tián) is a field, and 野 (yě) is the open country."
    "examples":
      "田野里有很多人。":
        "native": "There are many people in the fields."
        "bases":
          "有":
            "meaning": "to have; there is"
      "我喜欢田野的风景。":
        "native": "I like the scenery of the countryside."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2602":
    "native": "peak"
    "notes":
      "n1": "The high top of a mountain. 山 (shān) is a mountain, and 峰 (fēng) is a peak."
    "examples":
      "山峰很高。": "The peak is very high."
      "我们爬到了山峰。":
        "native": "We climbed to the peak."
        "bases":
          "爬":
            "meaning": "to climb"
          "到":
            "meaning": "to arrive; to reach"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2603":
    "native": "river (as a whole)"
    "notes":
      "n1": "A large body of flowing water. 河 (hé) is a river, and 流 (liú) is to flow."
    "examples":
      "这条河流很长。":
        "native": "This river is very long."
        "bases":
          "条":
            "meaning": "measure word for long things"
      "河流里有鱼。":
        "native": "There are fish in the river."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-2604":
    "native": "sea floor"
    "notes":
      "n1": "The bottom of the sea. 海 (hǎi) is the sea, and 底 (dǐ) is the bottom."
    "examples":
      "海底很黑。": "The sea floor is very dark."
      "海底有很多石头。":
        "native": "There are many stones on the sea floor."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-2605":
    "native": "foot of a mountain"
    "notes":
      "n1": "The bottom part of a mountain. 山 (shān) is a mountain, and 脚 (jiǎo) is a foot."
    "examples":
      "房子在山脚下。": "The house is at the foot of the mountain."
      "我们在山脚休息。": "We rested at the foot of the mountain."
