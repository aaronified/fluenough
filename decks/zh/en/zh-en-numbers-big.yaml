schema: 1
"id": "zh-en-numbers-big"
"kind": "layer"
"core": "zh-numbers-big"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Tens and big numbers"
"description": "Thirty-five words for big numbers: zero, the tens from thirty to ninety, hundreds, thousands, ten thousand, a hundred thousand, a million and ten million, the ordinals first to fourth, half, times, about, the day of the month, decimals and whole numbers, and the sums: multiply, add and subtract. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0693":
    "native": "zero"
    "notes":
      "n1": "零 (líng) is 'zero'. It is said as 'líng' in a number, as in 二零二六 (èr líng èr liù)."
    "examples":
      "零是整数。": "Zero is a whole number."
      "这个数字是零。": "This number is zero."
  "zh-0694":
    "native": "a hundred million"
    "notes":
      "n1": "亿 (yì) is 'a hundred million'. Chinese counts large numbers in groups of ten thousand, 万 (wàn), so a hundred million comes after 万 (wàn)."
    "examples":
      "这个数字是一亿吗？": "Is this number a hundred million?"
      "亿很大。": "A hundred million is big."
  "zh-0695":
    "native": "million"
    "notes":
      "n1": "百万 (bǎiwàn) is 'million', a hundred ten-thousands: 百 (bǎi) hundred and 万 (wàn) ten thousand."
    "examples":
      "百万是整数吗？": "Is a million a whole number?"
      "这个数字是百万。": "This number is a million."
  "zh-0696":
    "native": "ten million"
    "notes":
      "n1": "千万 (qiānwàn) is 'ten million', a thousand ten-thousands: 千 (qiān) thousand and 万 (wàn) ten thousand."
    "examples":
      "这个数字是千万。": "This number is ten million."
      "千万是一千个一万。": "Ten million is a thousand ten-thousands."
  "zh-0697":
    "native": "a hundred thousand"
    "notes":
      "n1": "十万 (shíwàn) is 'a hundred thousand', ten ten-thousands: 十 (shí) ten and 万 (wàn) ten thousand."
    "examples":
      "十万是十个一万。": "A hundred thousand is ten ten-thousands."
      "这个数字是十万吗？": "Is this number a hundred thousand?"
  "zh-0698":
    "native": "one hundred"
    "notes":
      "n1": "一百 (yìbǎi) is 'one hundred'. 一 (yī) is said as yì before a syllable in the third tone, as before 百 (bǎi)."
    "examples":
      "一百个人很多。": "A hundred people is a lot."
      "你买一百吗？": "Are you buying a hundred?"
  "zh-0699":
    "native": "two hundred"
    "notes":
      "n1": "两百 (liǎngbǎi) is 'two hundred'. Before 百 (bǎi), 千 (qiān) and 万 (wàn), two is said as 两 (liǎng), not 二 (èr)."
    "examples":
      "两百个人。": "Two hundred people."
      "两百加三百是五百。": "Two hundred plus three hundred is five hundred."
  "zh-0700":
    "native": "three hundred"
    "notes":
      "n1": "三百 (sānbǎi) is 'three hundred'. Its first word, 三 (sān), is three."
    "examples":
      "三百个人很多。": "Three hundred people is a lot."
      "三百减一百是两百。": "Three hundred minus one hundred is two hundred."
  "zh-0701":
    "native": "five hundred"
    "notes":
      "n1": "五百 (wǔbǎi) is 'five hundred'."
    "examples":
      "五百个人。": "Five hundred people."
      "五百加五百是一千。": "Five hundred plus five hundred is one thousand."
  "zh-0702":
    "native": "one thousand"
    "notes":
      "n1": "一千 (yìqiān) is 'one thousand'. 一 (yī) is said as yì before 千 (qiān), a first-tone syllable."
    "examples":
      "一千减五百是五百。": "One thousand minus five hundred is five hundred."
      "你买一千吗？": "Are you buying a thousand?"
  "zh-0703":
    "native": "two thousand"
    "notes":
      "n1": "两千 (liǎngqiān) is 'two thousand'. Before 千 (qiān), two is said as 两 (liǎng)."
    "examples":
      "两千个人。": "Two thousand people."
      "一千加一千是两千。": "One thousand plus one thousand is two thousand."
  "zh-0704":
    "native": "ten thousand"
    "notes":
      "n1": "一万 (yíwàn) is 'ten thousand', one 万 (wàn). 一 (yī) is said as yí before 万 (wàn), a fourth-tone syllable."
    "examples":
      "一万个人很多。": "Ten thousand people is a lot."
      "十个一千是一万。": "Ten lots of one thousand make ten thousand."
  "zh-0705":
    "native": "several hundred"
    "notes":
      "n1": "几百 (jǐbǎi) is 'several hundred'. 几 (jǐ) is 'a few' or 'how many'."
    "examples":
      "几百个人。": "Several hundred people."
      "几百个人在工厂。": "Several hundred people are at the factory."
  "zh-0706":
    "native": "several thousand"
    "notes":
      "n1": "几千 (jǐqiān) is 'several thousand', with 几 (jǐ) meaning 'a few'."
    "examples":
      "几千个人。": "Several thousand people."
      "几千个人在工厂吗？": "Are several thousand people at the factory?"
  "zh-0707":
    "native": "thirty"
    "notes":
      "n1": "三十 (sānshí) is 'thirty': 三 (sān) three, then 十 (shí) ten. The tens from thirty to ninety are built the same way."
    "examples":
      "三十个人。": "Thirty people."
      "我三十岁。": "I am thirty years old."
  "zh-0708":
    "native": "forty"
    "notes":
      "n1": "四十 (sìshí) is 'forty', 四 (sì) four and 十 (shí) ten."
    "examples":
      "四十个人。": "Forty people."
      "他四十岁。": "He is forty years old."
  "zh-0709":
    "native": "fifty"
    "notes":
      "n1": "五十 (wǔshí) is 'fifty', 五 (wǔ) five and 十 (shí) ten."
    "examples":
      "五十个人。": "Fifty people."
      "他五十岁吗？": "Is he fifty years old?"
  "zh-0710":
    "native": "sixty"
    "notes":
      "n1": "六十 (liùshí) is 'sixty', 六 (liù) six and 十 (shí) ten."
    "examples":
      "六十个人。": "Sixty people."
      "她六十岁。": "She is sixty years old."
  "zh-0711":
    "native": "seventy"
    "notes":
      "n1": "七十 (qīshí) is 'seventy', 七 (qī) seven and 十 (shí) ten."
    "examples":
      "七十个人。": "Seventy people."
      "爷爷七十岁。": "Grandpa is seventy years old."
  "zh-0712":
    "native": "eighty"
    "notes":
      "n1": "八十 (bāshí) is 'eighty', 八 (bā) eight and 十 (shí) ten."
    "examples":
      "八十个人。": "Eighty people."
      "奶奶八十岁。": "Grandma is eighty years old."
  "zh-0713":
    "native": "ninety"
    "notes":
      "n1": "九十 (jiǔshí) is 'ninety', 九 (jiǔ) nine and 十 (shí) ten."
    "examples":
      "九十个人。": "Ninety people."
      "你奶奶九十岁吗？": "Is your grandmother ninety years old?"
  "zh-0714":
    "native": "first"
    "notes":
      "n1": "第一 (dìyī) is 'first'. 第 (dì) before a number makes it an order: 第一 (dìyī), first, and 第二 (dì'èr), second."
    "examples":
      "第一个人是我。": "The first person is me."
      "你是第一吗？": "Are you first?"
  "zh-0715":
    "native": "second"
    "notes":
      "n1": "第二 (dì'èr) is 'second'. In an order, 二 (èr) is said as èr, not liǎng."
    "examples":
      "第二个人是老师。": "The second person is the teacher."
      "我是第二。": "I am second."
  "zh-0716":
    "native": "third"
    "notes":
      "n1": "第三 (dìsān) is 'third', 第 (dì) and 三 (sān) three."
    "examples":
      "第三个人是学生。": "The third person is a student."
      "他是第三吗？": "Is he third?"
  "zh-0717":
    "native": "fourth"
    "notes":
      "n1": "第四 (dìsì) is 'fourth', 第 (dì) and 四 (sì) four."
    "examples":
      "第四个人是弟弟。": "The fourth person is the younger brother."
      "妹妹是第四吗？": "Is the younger sister fourth?"
  "zh-0718":
    "native": "half"
    "notes":
      "n1": "一半 (yíbàn) is 'a half', as a noun. 半 (bàn) is 'half' before a measure word, as in 半杯 (bàn bēi), half a cup."
    "examples":
      "我吃一半。": "I eat half."
      "你吃一半吗？": "Do you eat half?"
  "zh-0719":
    "native": "times"
    "notes":
      "n1": "倍 (bèi) is 'times', as in 两倍 (liǎng bèi), twice, and 三倍 (sān bèi), three times."
    "examples":
      "我买两倍。": "I buy twice as much."
      "你买三倍吗？": "Are you buying three times as much?"
  "zh-0720":
    "native": "about; roughly"
    "notes":
      "n1": "大约 (dàyuē) is 'about' or 'roughly', said before a number. 左右 (zuǒyòu) also means 'about', but it comes after the number."
    "examples":
      "大约十个人。": "About ten people."
      "大约一百。": "About a hundred."
  "zh-0721":
    "native": "day of the month; number"
    "notes":
      "n1": "号 (hào) is the day of the month, as 十号 (shí hào) is the tenth. 号码 (hàomǎ) is a number, such as a phone number."
    "examples":
      "今天是几号？": "What date is it today?"
      "十号开会。": "The meeting is on the tenth."
  "zh-0722":
    "native": "decimal"
    "notes":
      "n1": "小数 (xiǎoshù) is 'decimal', a number with a part after the point, such as 0.5."
    "examples":
      "小数很难吗？": "Are decimals hard?"
      "这个小数很小。": "This decimal is small."
  "zh-0723":
    "native": "whole number"
    "notes":
      "n1": "整数 (zhěngshù) is 'whole number', one with no part after the point."
    "examples":
      "三十是整数。": "Thirty is a whole number."
      "一百是整数吗？": "Is one hundred a whole number?"
  "zh-0724":
    "native": "to multiply"
    "notes":
      "n1": "乘 (chéng) is 'to multiply'. In 二乘三 (èr chéng sān), it sits between the two numbers."
    "examples":
      "二乘三是六。": "Two times three is six."
      "三乘三是九。": "Three times three is nine."
  "zh-0725":
    "native": "to add; plus"
    "notes":
      "n1": "加 (jiā) is 'to add' or 'plus'. 二加三 (èr jiā sān) is two plus three."
    "examples":
      "二加三是五。": "Two plus three is five."
      "十加十是二十。": "Ten plus ten is twenty."
  "zh-0726":
    "native": "to subtract; minus"
    "notes":
      "n1": "减 (jiǎn) is 'to subtract' or 'minus'. 五减二 (wǔ jiǎn èr) is five minus two."
    "examples":
      "五减二是三。": "Five minus two is three."
      "十减一是九。": "Ten minus one is nine."
  "zh-0727":
    "native": "to calculate; to count"
    "notes":
      "n1": "算 (suàn) is 'to calculate' or 'to count'. It is used both for working out a sum and for counting things."
    "examples":
      "老板算钱。": "The boss counts the money."
      "我算十个人。": "I count ten people."
