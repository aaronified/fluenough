"cards":
  "zh-4058":
    "confusables":
      "w1":
        "why": "亲密 (qīnmì) is very close, a stronger feeling."
      "w2":
        "why": "熟悉 (shúxī) is familiar, a looser word."
    "bases":
      "和":
        "meaning": "and"
      "的":
        "meaning": "of"
    "native": "My friend and I have a very good relationship."
  "zh-4059":
    "confusables":
      "w1":
        "why": "争吵 (zhēngchǎo) is to argue, which happens before making up."
      "w2":
        "why": "分手 (fēnshǒu) is to break up, the opposite of making up."
    "bases":
      "了":
        "meaning": "a particle"
    "native": "After they quarrelled they made up again."
  "zh-4060":
    "confusables":
      "w1":
        "why": "伙伴 (huǒbàn) is a partner, a looser tie."
      "w2":
        "why": "朋友 (péngyou) is a friend, a wider word."
    "bases":
      "的":
        "meaning": "of"
    "native": "I trust you; you are my close friend."
  "zh-4061":
    "confusables":
      "w1":
        "why": "照顾 (zhàogù) is to look after, a practical act."
      "w2":
        "why": "阿姨 (āyí) is an aunt or older woman, a different word."
    "native": "My aunt cares about me very much."
  "zh-4062":
    "confusables":
      "w1":
        "why": "虚伪 (xūwěi) is hypocritical, the opposite."
      "w2":
        "why": "忠诚 (zhōngchéng) is loyal, a related quality."
    "bases":
      "的":
        "meaning": "of"
    "native": "Our friendship is very sincere."
  "zh-4063":
    "confusables":
      "w1":
        "why": "矛盾 (máodùn) is a conflict, a bigger problem."
      "w2":
        "why": "道歉 (dàoqiàn) is to apologise, the act that follows."
    "bases":
      "有":
        "meaning": "to have; there is"
    "native": "There is a misunderstanding between us; please forgive me."
  "zh-4064":
    "confusables":
      "w1":
        "why": "想念 (xiǎngniàn) is to miss someone, a present feeling."
      "w2":
        "why": "陪伴 (péibàn) is to keep company, an action."
    "bases":
      "小时候":
        "meaning": "when young"
      "的":
        "meaning": "of"
    "native": "I miss the friends I had when I was young."
  "zh-4065":
    "confusables":
      "w1":
        "why": "合作 (hézuò) is to cooperate, a work relationship."
      "w2":
        "why": "帮助 (bāngzhù) is to help, a single act."
    "bases":
      "要":
        "meaning": "to want"
      "和":
        "meaning": "and"
    "native": "We must help each other and stay united."
