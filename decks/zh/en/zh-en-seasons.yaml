"schema": 1
"id": "zh-en-seasons"
"kind": "layer"
"core": "zh-seasons"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Seasons and weather words"
"description": "Forty words for the seasons: spring, summer, autumn and winter, the sun, wind, rain and snow, the plants that grow and the harvest, and the words for dry and damp. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1410":
    "native": "spring"
    "notes":
      "n1": "Spring, the season after winter when the plants grow. 春 (chūn) is spring, and 天 (tiān) is a day or the sky."
    "examples":
      "春天我们去公园看花。": "In spring we go to the park to see the flowers."
      "春天很暖和。": "Spring is very mild."
  "zh-1411":
    "native": "summer"
    "notes":
      "n1": "Summer, the hot season. 夏 (xià) is summer."
    "examples":
      "夏天很热。": "Summer is very hot."
      "夏天我喝很多水。": "In summer I drink a lot of water."
  "zh-1412":
    "native": "autumn"
    "notes":
      "n1": "Autumn, the season when the leaves fall. 秋 (qiū) is autumn."
    "examples":
      "秋天的风很凉快。":
        "native": "The autumn wind is cool."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "秋天我喜欢散步。": "In autumn I like to go for walks."
  "zh-1413":
    "native": "winter"
    "notes":
      "n1": "Winter, the cold season. 冬 (dōng) is winter."
    "examples":
      "冬天很冷。": "Winter is very cold."
      "冬天我穿厚衣服。":
        "native": "In winter I wear thick clothes."
        "bases":
          "厚":
            "meaning": "thick"
  "zh-1414":
    "native": "season"
    "notes":
      "n1": "A season of the year. 季 (jì) is a season, and 节 (jié) is a part of the year."
    "examples":
      "这个季节很好。": "This season is very good."
      "每个季节都不一样。":
        "native": "Each season is different."
        "bases":
          "一样":
            "meaning": "the same"
  "zh-1415":
    "native": "temperature"
    "notes":
      "n1": "The temperature, how hot or cold it is. 度 (dù) is a degree."
    "examples":
      "今天的温度是三十度。":
        "native": "The temperature today is thirty degrees."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "度":
            "meaning": "degree"
      "温度很低。":
        "native": "The temperature is very low."
        "bases":
          "低":
            "meaning": "low"
  "zh-1416":
    "native": "cool and pleasant"
    "notes":
      "n1": "Cool and pleasant, not too hot. 凉 (liáng) is cool."
    "examples":
      "早上很凉快。": "The morning is cool and pleasant."
      "这个房间很凉快。": "This room is cool."
  "zh-1417":
    "native": "to bloom; to flower"
    "notes":
      "n1": "To bloom, when a plant opens its flowers. 开 (kāi) is to open, and 花 (huā) is a flower."
    "examples":
      "春天花开花了。":
        "native": "In spring the flowers have bloomed."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "树开花了。":
        "native": "The tree has flowered."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1418":
    "native": "tree leaves"
    "notes":
      "n1": "The leaves on a tree. 树 (shù) is a tree, and 叶 (yè) is a leaf."
    "examples":
      "树叶是绿的。":
        "native": "The leaves are green."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "秋天树叶很多。": "In autumn there are a lot of leaves."
  "zh-1419":
    "native": "fallen leaves"
    "notes":
      "n1": "Leaves that have fallen from a tree. 落 (luò) is to fall."
    "examples":
      "地上有很多落叶。":
        "native": "There are many fallen leaves on the ground."
        "bases":
          "地上":
            "meaning": "on the ground"
          "有":
            "meaning": "to have; there is"
      "我扫落叶。":
        "native": "I sweep up the fallen leaves."
        "bases":
          "扫":
            "meaning": "to sweep"
  "zh-1420":
    "native": "to snow"
    "notes":
      "n1": "To snow, when snow falls from the sky. 下 (xià) is to fall, and 雪 (xuě) is snow."
    "examples":
      "冬天常常下雪。": "In winter it often snows."
      "今天下雪了。":
        "native": "It snowed today."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1421":
    "native": "to rain"
    "notes":
      "n1": "To rain, when rain falls from the sky. 下 (xià) is to fall, and 雨 (yǔ) is rain."
    "examples":
      "今天下雨，很潮湿。": "It is raining today and very damp."
      "明天会下雨吗？":
        "native": "Will it rain tomorrow?"
        "bases":
          "会":
            "meaning": "can; to know how to"
  "zh-1422":
    "native": "snow"
    "notes":
      "n1": "Snow, the white flakes that fall in winter."
    "examples":
      "雪很白。": "The snow is very white."
      "地上有雪。":
        "native": "There is snow on the ground."
        "bases":
          "地上":
            "meaning": "on the ground"
          "有":
            "meaning": "to have; there is"
  "zh-1423":
    "native": "wind"
    "notes":
      "n1": "Wind, air that moves."
    "examples":
      "风很大。": "The wind is very strong."
      "外面有风。":
        "native": "There is wind outside."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1424":
    "native": "sun"
    "notes":
      "n1": "The sun, which gives light and heat in the day."
    "examples":
      "太阳很大。": "The sun is very strong."
      "太阳出来了。":
        "native": "The sun has come out."
        "bases":
          "出来":
            "meaning": "to come out"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1425":
    "native": "moon"
    "notes":
      "n1": "The moon, which shines at night. 月 (yuè) is the moon or a month."
    "examples":
      "月亮很亮。":
        "native": "The moon is very bright."
        "bases":
          "亮":
            "meaning": "bright"
      "晚上有月亮。":
        "native": "There is a moon in the evening."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1426":
    "native": "spring breeze"
    "notes":
      "n1": "A soft wind of spring. 春 (chūn) is spring, and 风 (fēng) is wind."
    "examples":
      "春风很暖。": "The spring breeze is warm."
      "春风吹来了。":
        "native": "The spring breeze has blown in."
        "bases":
          "吹":
            "meaning": "to blow"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1427":
    "native": "cloudy day"
    "notes":
      "n1": "A day with no sun, covered in cloud. 阴 (yīn) is shade or cloud."
    "examples":
      "今天是阴天。": "Today is a cloudy day."
      "阴天不热。": "On a cloudy day it is not hot."
  "zh-1428":
    "native": "clear; sunny"
    "notes":
      "n1": "Clear and sunny, with no cloud."
    "examples":
      "天很晴。": "The sky is very clear."
      "明天是晴天。": "Tomorrow will be a sunny day."
  "zh-1429":
    "native": "heavy rain; downpour"
    "notes":
      "n1": "A heavy rain, a storm of rain. 暴 (bào) is violent."
    "examples":
      "外面下暴雨了。":
        "native": "There is a heavy downpour outside."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "暴雨很危险。": "A heavy rain is dangerous."
  "zh-1430":
    "native": "thunder"
    "notes":
      "n1": "Thunder, the sound after lightning in a storm."
    "examples":
      "雷响了。":
        "native": "The thunder has rumbled."
        "bases":
          "响":
            "meaning": "to ring; to sound"
          "了":
            "meaning": "a particle: a change has happened"
      "打雷的时候不要出去。":
        "native": "Do not go out when there is thunder."
        "bases":
          "打":
            "meaning": "to hit; to make (a sound)"
          "的":
            "meaning": "a particle: of; belonging to"
          "要":
            "meaning": "must; to want"
          "出去":
            "meaning": "out"
  "zh-1431":
    "native": "dry"
    "notes":
      "n1": "Dry, with little water in the air or the ground. 干 (gān) is dry."
    "examples":
      "冬天空气很干燥。": "In winter the air is very dry."
      "皮肤干燥。": "The skin is dry."
  "zh-1432":
    "native": "wet; damp"
    "notes":
      "n1": "Wet, with water on the surface."
    "examples":
      "地很湿。":
        "native": "The ground is wet."
        "bases":
          "地":
            "meaning": "ground"
      "衣服还湿着。":
        "native": "The clothes are still wet."
        "bases":
          "着":
            "meaning": "a particle: an action goes on"
  "zh-1433":
    "native": "humid; damp"
    "notes":
      "n1": "Damp and humid, with much water in the air. 潮 (cháo) is a tide, and 湿 (shī) is wet."
    "examples":
      "夏天很潮湿。": "Summer is very humid."
      "房间很潮湿。": "The room is damp."
  "zh-1434":
    "native": "night"
    "notes":
      "n1": "The night, the dark time after the sun sets. 夜里 (yèlǐ) is at night."
    "examples":
      "夜很长。": "The night is very long."
      "夜里很冷。": "It is very cold at night."
  "zh-1435":
    "native": "to grow"
    "notes":
      "n1": "To grow, as a plant or animal does. 生 (shēng) is to live, and 长 (zhǎng) is to grow."
    "examples":
      "树在生长。": "The tree is growing."
      "花生长得很快。":
        "native": "The flowers grow very fast."
        "bases":
          "得":
            "meaning": "a particle after a verb: how it is done"
  "zh-1436":
    "native": "to sprout"
    "notes":
      "n1": "To sprout, when a seed starts to grow a shoot. 芽 (yá) is a bud or shoot."
    "examples":
      "种子发芽了。":
        "native": "The seed has sprouted."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "春天草发芽。": "In spring the grass sprouts."
  "zh-1437":
    "native": "seed"
    "notes":
      "n1": "A seed from which a plant grows. 种 (zhǒng) is a kind, and 子 (zi) makes it a noun."
    "examples":
      "种子在土里。":
        "native": "The seed is in the soil."
        "bases":
          "土":
            "meaning": "soil"
      "我买了一包种子。":
        "native": "I bought a packet of seeds."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "包":
            "meaning": "packet; bag"
  "zh-1438":
    "native": "grass"
    "notes":
      "n1": "Grass, the low green plant on the ground."
    "examples":
      "草很绿。": "The grass is very green."
      "孩子在草上玩。": "The child plays on the grass."
  "zh-1439":
    "native": "leaf"
    "notes":
      "n1": "A leaf of a plant or tree. 叶 (yè) is a leaf."
    "examples":
      "叶子很大。": "The leaf is very big."
      "叶子是绿的。":
        "native": "The leaf is green."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1440":
    "native": "fruit (of a plant)"
    "notes":
      "n1": "The fruit a plant produces, with its seeds. 果 (guǒ) is fruit, and 实 (shí) is a real or solid thing."
    "examples":
      "树结了果实。":
        "native": "The tree has borne fruit."
        "bases":
          "结":
            "meaning": "to bear (fruit)"
          "了":
            "meaning": "a particle: a change has happened"
      "果实很甜。": "The fruit is very sweet."
  "zh-1441":
    "native": "harvest; gain"
    "notes":
      "n1": "The harvest, the crops gathered in. 收 (shōu) is to gather."
    "examples":
      "秋天是收获的季节。":
        "native": "Autumn is the harvest season."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "今年的收获很好。":
        "native": "This year's harvest is very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1442":
    "native": "cool and fresh"
    "notes":
      "n1": "Cool and fresh, pleasant after heat."
    "examples":
      "早上很凉爽。": "The morning is cool and fresh."
      "风很凉爽。": "The wind is cool and fresh."
  "zh-1443":
    "native": "comfortable"
    "notes":
      "n1": "Comfortable, pleasant to be in."
    "examples":
      "这个季节很舒适。": "This season is very comfortable."
      "沙发很舒适。": "The sofa is very comfortable."
  "zh-1444":
    "native": "to dry in the sun"
    "notes":
      "n1": "To dry something in the sun, or to get tanned in the sun."
    "examples":
      "我在阳台晒衣服。": "I dry the clothes on the balcony in the sun."
      "太阳很大，不要晒。":
        "native": "The sun is strong; do not sit in it."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-1445":
    "native": "rain"
    "notes":
      "n1": "Rain, the water that falls from the clouds."
    "examples":
      "雨很大。": "The rain is very heavy."
      "雨停了。":
        "native": "The rain has stopped."
        "bases":
          "停":
            "meaning": "to stop"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1446":
    "native": "warm"
    "notes":
      "n1": "Warm, comfortably warm, not hot. 暖和 (nuǎnhuo) is warm."
    "examples":
      "房间很暖。": "The room is warm."
      "春风很暖。": "The spring breeze is warm."
  "zh-1447":
    "native": "fog; mist"
    "notes":
      "n1": "Fog, a thick mist that makes it hard to see."
    "examples":
      "早上有雾。":
        "native": "There is fog in the morning."
        "bases":
          "有":
            "meaning": "to have; there is"
      "雾很大，看不清。":
        "native": "The fog is thick and it is hard to see."
        "bases":
          "清":
            "meaning": "clear"
  "zh-1448":
    "native": "dew"
    "notes":
      "n1": "Dew, the drops of water on the grass in the morning. 露 (lù) is dew."
    "examples":
      "草上有露水。":
        "native": "There is dew on the grass."
        "bases":
          "有":
            "meaning": "to have; there is"
      "早上的露水很多。":
        "native": "There is a lot of dew in the morning."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1449":
    "native": "rainbow"
    "notes":
      "n1": "A rainbow, a band of colours in the sky after rain. 彩 (cǎi) is colour."
    "examples":
      "雨后有彩虹。":
        "native": "After the rain there is a rainbow."
        "bases":
          "有":
            "meaning": "to have; there is"
      "彩虹很漂亮。": "The rainbow is very pretty."
