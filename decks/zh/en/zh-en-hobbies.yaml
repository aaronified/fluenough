"schema": 1
"id": "zh-en-hobbies"
"kind": "layer"
"core": "zh-hobbies"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Hobbies"
"description": "Fifty words for what people do for fun: the games and the sports, the crafts and the arts, the clubs and the reading, and the words for interest and free time. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1976":
    "native": "to play chess (or go, or xiangqi)"
    "notes":
      "n1": "To play a board game of strategy. 下 (xià) is to play a game, and 棋 (qí) is a game piece or board game."
    "examples":
      "他喜欢下棋。": "He likes playing chess."
      "我们下棋吧。": "Let us play a game of chess."
  "zh-1977":
    "native": "to fish (with a rod)"
    "notes":
      "n1": "To catch fish with a rod and line. 钓 (diào) is to fish with a line."
    "examples":
      "爸爸喜欢钓鱼。": "Dad likes fishing."
      "周末我去钓鱼。": "At the weekend I go fishing."
  "zh-1978":
    "native": "to draw; to paint"
    "notes":
      "n1": "To draw or paint a picture, as a pastime. 画 (huà) is to draw."
    "examples":
      "她每天画画。":
        "native": "She draws every day."
        "bases":
          "每天":
            "meaning": "every day"
      "我喜欢画画和看书。":
        "native": "I like drawing and reading."
        "bases":
          "和":
            "meaning": "and"
  "zh-1979":
    "native": "photography"
    "notes":
      "n1": "Photography, the art of taking photographs. 摄 (shè) is to take, and 影 (yǐng) is an image."
    "examples":
      "他喜欢摄影。": "He likes photography."
      "摄影社每周活动。":
        "native": "The photography club meets every week."
        "bases":
          "社":
            "meaning": "club; society"
          "活动":
            "meaning": "activity; event"
  "zh-1980":
    "native": "to take photos"
    "notes":
      "n1": "To take a photograph with a camera or a phone. 拍 (pāi) is to take, and 照 (zhào) is a picture."
    "examples":
      "我们在公园拍照。": "We take photos in the park."
      "请别拍照。": "Please do not take photos."
  "zh-1981":
    "native": "to collect (things)"
    "notes":
      "n1": "To keep and collect things because you like them. 收 (shōu) is to gather, and 藏 (cáng) is to store."
    "examples":
      "他收藏邮票。": "He collects stamps."
      "我收藏了很多书。":
        "native": "I have collected many books."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1982":
    "native": "gardening"
    "notes":
      "n1": "The care of gardens and plants as a hobby. 园 (yuán) is a garden, and 艺 (yì) is an art."
    "examples":
      "她喜欢园艺。": "She likes gardening."
      "园艺很有趣。": "Gardening is interesting."
  "zh-1983":
    "native": "to grow flowers"
    "notes":
      "n1": "To plant and grow flowers. 种 (zhòng) is to plant, and 花 (huā) is a flower."
    "examples":
      "我在阳台种花。": "I grow flowers on the balcony."
      "种花需要耐心。":
        "native": "Growing flowers needs patience."
        "bases":
          "耐心":
            "meaning": "patience"
  "zh-1984":
    "native": "to cook (as an art)"
    "notes":
      "n1": "To cook food, especially with skill or as a hobby. 烹 (pēng) is to cook, and 饪 (rèn) is to prepare food."
    "examples":
      "她喜欢烹饪。": "She likes cooking."
      "烹饪很有意思。":
        "native": "Cooking is interesting."
        "bases":
          "有":
            "meaning": "to have; there is"
          "意思":
            "meaning": "meaning; interest"
  "zh-1985":
    "native": "jigsaw puzzle"
    "notes":
      "n1": "A jigsaw puzzle, a picture cut into pieces to fit together. 拼 (pīn) is to join together, and 图 (tú) is a picture."
    "examples":
      "她喜欢拼图。": "She likes jigsaw puzzles."
      "这个拼图很难。": "This jigsaw puzzle is very hard."
  "zh-1986":
    "native": "to read a book"
    "notes":
      "n1": "To read a book, for pleasure or for study. 看 (kàn) is to look at, and 书 (shū) is a book."
    "examples":
      "晚上我看书。": "In the evening I read a book."
      "他喜欢看书。": "He likes reading books."
  "zh-1987":
    "native": "dance"
    "notes":
      "n1": "Dance, movement to music, as an art. 舞 (wǔ) is to dance, and 蹈 (dǎo) is to step."
    "examples":
      "她学舞蹈。": "She learns dance."
      "舞蹈很好看。": "The dance is very nice to watch."
  "zh-1988":
    "native": "calligraphy"
    "notes":
      "n1": "Chinese calligraphy, the art of writing characters beautifully with a brush. 书 (shū) is writing, and 法 (fǎ) is a method."
    "examples":
      "他练书法。":
        "native": "He practises calligraphy."
        "bases":
          "练":
            "meaning": "to practise"
      "书法很难。": "Calligraphy is very difficult."
  "zh-1989":
    "native": "painting; drawing"
    "notes":
      "n1": "Painting or drawing, as an art. 绘 (huì) is to paint, and 画 (huà) is a picture."
    "examples":
      "她喜欢绘画。": "She likes painting."
      "绘画课很有趣。": "The painting lesson is interesting."
  "zh-1990":
    "native": "handicraft; handwork"
    "notes":
      "n1": "Handicraft, things made by hand. 手 (shǒu) is hand, and 工 (gōng) is work."
    "examples":
      "我喜欢做手工。": "I like making handicrafts."
      "手工很精致。":
        "native": "The handicraft is very fine."
        "bases":
          "精致":
            "meaning": "fine; exquisite"
  "zh-1991":
    "native": "to knit; to weave"
    "notes":
      "n1": "To knit or weave. 编 (biān) is to plait or knit, and 织 (zhī) is to weave."
    "examples":
      "她编织毛衣。": "She knits a sweater."
      "编织需要时间。": "Knitting needs time."
  "zh-1992":
    "native": "to bake"
    "notes":
      "n1": "To bake bread or cakes at home. 烘 (hōng) is to dry or warm by heat, and 焙 (bèi) is to roast."
    "examples":
      "他喜欢烘焙。": "He likes baking."
      "烘焙的面包很香。":
        "native": "The bread he bakes smells good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1993":
    "native": "yoga"
    "notes":
      "n1": "Yoga, stretching and breathing exercises. The word is a loan from Sanskrit."
    "examples":
      "她每周做瑜伽。": "She does yoga every week."
      "瑜伽对身体好。": "Yoga is good for the body."
  "zh-1994":
    "native": "to keep fit; to exercise"
    "notes":
      "n1": "To exercise to keep the body fit. 健 (jiàn) is healthy, and 身 (shēn) is the body."
    "examples":
      "我每天去健身。":
        "native": "I go to keep fit every day."
        "bases":
          "每天":
            "meaning": "every day"
      "健身房很大。":
        "native": "The gym is very big."
        "bases":
          "健身房":
            "meaning": "gym"
  "zh-1995":
    "native": "to cycle; to ride a bike"
    "notes":
      "n1": "To ride a bicycle. 骑 (qí) is to ride, and 车 (chē) is a vehicle."
    "examples":
      "他每天骑车上班。":
        "native": "He cycles to work every day."
        "bases":
          "每天":
            "meaning": "every day"
      "周末我们骑车。": "At the weekend we go cycling."
  "zh-1996":
    "native": "to climb a mountain; to hike"
    "notes":
      "n1": "To climb a mountain, or to go hiking. 爬 (pá) is to climb, and 山 (shān) is a mountain."
    "examples":
      "周末我去爬山。": "At the weekend I go hiking."
      "爬山很累。": "Climbing mountains is tiring."
  "zh-1997":
    "native": "to fish with a line"
    "notes":
      "n1": "To catch fish with a line and hook. 钓鱼 (diàoyú) is to go fishing."
    "examples":
      "他在河边钓。":
        "native": "He fishes by the river."
        "bases":
          "河边":
            "meaning": "riverside"
      "钓了一条鱼。":
        "native": "He caught a fish."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "条":
            "meaning": "the measure word for long things, such as fish"
  "zh-1998":
    "native": "chess; board game"
    "notes":
      "n1": "A board game, or a piece in one. 下棋 (xiàqí) is to play a board game."
    "examples":
      "这副棋很漂亮。":
        "native": "This board game is very pretty."
        "bases":
          "副":
            "meaning": "the measure word for a set"
      "他会下棋。":
        "native": "He can play board games."
        "bases":
          "会":
            "meaning": "can; to know how to"
  "zh-1999":
    "native": "go (the board game)"
    "notes":
      "n1": "The board game of go, with black and white stones. 围 (wéi) is to surround."
    "examples":
      "他下围棋。": "He plays go."
      "围棋很难。": "Go is very difficult."
  "zh-2000":
    "native": "xiangqi (Chinese chess)"
    "notes":
      "n1": "Chinese chess, a board game with pieces named for generals and elephants. 象 (xiàng) is an elephant."
    "examples":
      "爷爷下象棋。": "Grandad plays Chinese chess."
      "象棋很有趣。": "Chinese chess is interesting."
  "zh-2001":
    "native": "to play ball games"
    "notes":
      "n1": "To play a ball game, such as basketball or football. 打 (dǎ) is to play, and 球 (qiú) is a ball."
    "examples":
      "周末我们打球。": "At the weekend we play ball games."
      "他喜欢打球。": "He likes playing ball games."
  "zh-2002":
    "native": "football; soccer"
    "notes":
      "n1": "Football, the game played with the feet. 足 (zú) is foot."
    "examples":
      "他喜欢足球。": "He likes football."
      "足球比赛很精彩。":
        "native": "The football match is exciting."
        "bases":
          "精彩":
            "meaning": "exciting"
  "zh-2003":
    "native": "to play games"
    "notes":
      "n1": "To play a game on a phone or a computer. 玩 (wán) is to play."
    "examples":
      "孩子玩游戏。": "The child plays games."
      "他每天玩游戏。":
        "native": "He plays games every day."
        "bases":
          "每天":
            "meaning": "every day"
  "zh-2004":
    "native": "game"
    "notes":
      "n1": "A game, to play for fun, on a phone, a board or outdoors."
    "examples":
      "这个游戏很好玩。":
        "native": "This game is great fun."
        "bases":
          "好玩":
            "meaning": "fun"
      "我们玩游戏。": "We play a game."
  "zh-2005":
    "native": "novel"
    "notes":
      "n1": "A novel, a long story in prose. 小 (xiǎo) is small, and 说 (shuō) is a tale."
    "examples":
      "我在看一本小说。": "I am reading a novel."
      "这本小说很好看。": "This novel is very nice to read."
  "zh-2006":
    "native": "comic; cartoon"
    "notes":
      "n1": "A comic, a picture story in drawings. 漫 (màn) is free or casual, and 画 (huà) is a picture."
    "examples":
      "孩子喜欢漫画。": "The child likes comics."
      "这本漫画很有趣。": "This comic is interesting."
  "zh-2007":
    "native": "to take a photograph (with a camera)"
    "notes":
      "n1": "To take a picture with a camera. 相 (xiàng) is a photo."
    "examples":
      "我们去照相。": "We go to take photographs."
      "照相的时候笑一笑。":
        "native": "Smile when the photo is taken."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2008":
    "native": "club; society"
    "notes":
      "n1": "A club or society, a group of people who share an interest. 社 (shè) is a society, and 团 (tuán) is a group."
    "examples":
      "我参加了一个社团。":
        "native": "I have joined a club."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "社团的活动很多。":
        "native": "The club has many activities."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "活动":
            "meaning": "activity; event"
  "zh-2009":
    "native": "interest; hobby"
    "notes":
      "n1": "An interest in something, a hobby. 兴 (xìng) is interest, and 趣 (qù) is fun."
    "examples":
      "她的兴趣是画画。":
        "native": "Her hobby is drawing."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "我对历史有兴趣。":
        "native": "I am interested in history."
        "bases":
          "历史":
            "meaning": "history"
          "有":
            "meaning": "to have; there is"
  "zh-2010":
    "native": "spare-time; amateur"
    "notes":
      "n1": "Done in one's spare time, not as a job. 业 (yè) is work, and 余 (yú) is spare."
    "examples":
      "他是业余画家。":
        "native": "He is an amateur painter."
        "bases":
          "画家":
            "meaning": "painter"
      "业余时间我看书。": "In my spare time I read."
  "zh-2011":
    "native": "club"
    "notes":
      "n1": "A club, a place or group for people with a shared interest. The word is a loan from English."
    "examples":
      "我去俱乐部游泳。": "I go to the club to swim."
      "俱乐部很热闹。": "The club is very lively."
  "zh-2012":
    "native": "free; to have time"
    "notes":
      "n1": "Free, having time to spare. 空 (kòng) is free or empty, here."
    "examples":
      "你周末有空吗？": "Are you free at the weekend?"
      "我现在有空。": "I am free now."
  "zh-2013":
    "native": "to camp outdoors"
    "notes":
      "n1": "To camp outdoors in a tent. 露 (lù) is outside in the open, and 营 (yíng) is a camp."
    "examples":
      "周末我们去露营。": "At the weekend we go camping."
      "露营很有趣。": "Camping is fun."
  "zh-2014":
    "native": "to surf"
    "notes":
      "n1": "To ride waves on a board in the sea. 冲 (chōng) is to rush, and 浪 (làng) is a wave."
    "examples":
      "他喜欢冲浪。": "He likes surfing."
      "冲浪很危险。": "Surfing is dangerous."
  "zh-2015":
    "native": "to ski"
    "notes":
      "n1": "To ski on snow. 滑 (huá) is to slide, and 雪 (xuě) is snow."
    "examples":
      "冬天我去滑雪。": "In winter I go skiing."
      "滑雪很好玩。":
        "native": "Skiing is great fun."
        "bases":
          "好玩":
            "meaning": "fun"
  "zh-2016":
    "native": "to skate"
    "notes":
      "n1": "To skate on ice. 溜 (liū) is to slide, and 冰 (bīng) is ice."
    "examples":
      "孩子在溜冰。": "The children are skating."
      "溜冰很难。": "Skating is hard."
  "zh-2017":
    "native": "piano"
    "notes":
      "n1": "A piano, a large keyboard instrument. 钢 (gāng) is steel, and 琴 (qín) is a stringed instrument."
    "examples":
      "她弹钢琴。":
        "native": "She plays the piano."
        "bases":
          "弹":
            "meaning": "to play (a stringed instrument)"
      "钢琴很贵。": "A piano is expensive."
  "zh-2018":
    "native": "guitar"
    "notes":
      "n1": "A guitar, a stringed instrument played with the fingers."
    "examples":
      "他弹吉他。":
        "native": "He plays the guitar."
        "bases":
          "弹":
            "meaning": "to play (a stringed instrument)"
      "吉他很好听。": "The guitar sounds nice."
  "zh-2019":
    "native": "poem"
    "notes":
      "n1": "A poem, a piece of verse. 写诗 (xiěshī) is to write poems."
    "examples":
      "她写诗。": "She writes poems."
      "这首诗很美。":
        "native": "This poem is beautiful."
        "bases":
          "首":
            "meaning": "the measure word for a poem or song"
          "美":
            "meaning": "beautiful"
  "zh-2020":
    "native": "to write poems"
    "notes":
      "n1": "To write poetry. 写 (xiě) is to write, and 诗 (shī) is a poem."
    "examples":
      "他喜欢写诗。": "He likes writing poems."
      "写诗需要灵感。":
        "native": "Writing poems needs inspiration."
        "bases":
          "灵感":
            "meaning": "inspiration"
  "zh-2021":
    "native": "to read the newspaper"
    "notes":
      "n1": "To read a newspaper. 读 (dú) is to read, and 报 (bào) is a newspaper."
    "examples":
      "爸爸每天读报。":
        "native": "Dad reads the newspaper every day."
        "bases":
          "每天":
            "meaning": "every day"
      "早上我读报。": "In the morning I read the paper."
  "zh-2022":
    "native": "to angle; to fish with a rod"
    "notes":
      "n1": "To fish with a rod and line, sitting quietly. 垂 (chuí) is to hang down."
    "examples":
      "他喜欢垂钓。": "He likes angling."
      "河边有人垂钓。":
        "native": "There are people angling by the river."
        "bases":
          "河边":
            "meaning": "riverside"
          "有":
            "meaning": "to have; there is"
  "zh-2023":
    "native": "to watch birds"
    "notes":
      "n1": "To watch birds in their habitat, as a hobby. 观 (guān) is to watch, and 鸟 (niǎo) is a bird."
    "examples":
      "她喜欢观鸟。": "She likes birdwatching."
      "观鸟要很安静。":
        "native": "Birdwatching needs quiet."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-2024":
    "native": "to travel as a tourist"
    "notes":
      "n1": "To travel for pleasure, as a tourist. 旅 (lǚ) is a journey."
    "examples":
      "我喜欢旅游。": "I like travelling."
      "暑假我去旅游。": "In the summer holiday I go travelling."
  "zh-2025":
    "native": "to collect (things together)"
    "notes":
      "n1": "To gather things together, such as stamps or coins. 收 (shōu) is to gather."
    "examples":
      "他收集硬币。":
        "native": "He collects coins."
        "bases":
          "硬币":
            "meaning": "coin"
      "收集邮票很有趣。": "Collecting stamps is interesting."
