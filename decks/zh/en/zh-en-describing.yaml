"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0428":
    "native": "room"
    "notes":
      "n1": "A room in a house or flat. 房间 (fángjiān) is the room itself; 家 (jiā) is the whole home."
    "examples":
      "房间很干净。": "The room is very clean."
      "房间不贵吗？": "Is the room not expensive?"
  "zh-0429":
    "native": "pretty; beautiful"
    "notes":
      "n1": "Pretty or beautiful, of people and things. In a plain statement it takes 很 (hěn): 很漂亮 (hěn piàoliang), very pretty."
    "examples":
      "她很漂亮。": "She is very pretty."
      "这个房间很漂亮。": "This room is very pretty."
  "zh-0430":
    "native": "clean"
    "notes":
      "n1": "Clean, not dirty. Its opposite is 脏 (zāng), dirty."
    "examples":
      "房间很干净。": "The room is very clean."
      "衣服干净吗？": "Are the clothes clean?"
  "zh-0431":
    "native": "dirty"
    "notes":
      "n1": "Dirty, not clean. Its opposite is 干净 (gānjìng), clean."
    "examples":
      "衣服很脏。": "The clothes are very dirty."
      "鞋很脏吗？": "Are the shoes very dirty?"
  "zh-0432":
    "native": "quiet"
    "notes":
      "n1": "Quiet, with little noise. Its opposite is 吵 (chǎo), noisy."
    "examples":
      "学校很安静。": "The school is very quiet."
      "房间很安静吗？": "Is the room very quiet?"
  "zh-0433":
    "native": "noisy"
    "notes":
      "n1": "Noisy, loud. 别吵 (bié chǎo), do not make a noise, is a common request. Its opposite is 安静 (ānjìng), quiet."
    "examples":
      "你们很吵。": "You are very noisy."
      "别吵。": "Don't make a noise."
  "zh-0434":
    "native": "convenient"
    "notes":
      "n1": "Convenient, easy to use or to get to. 你方便吗 (nǐ fāngbiàn ma), is it convenient for you?, is a polite way to ask."
    "examples":
      "学校很方便。": "The school is very convenient."
      "你方便吗？": "Is it convenient for you?"
  "zh-0435":
    "native": "far"
    "notes":
      "n1": "Far, a long way off. Its opposite is 近 (jìn), near."
    "examples":
      "学校很远。": "The school is very far."
      "你家远吗？": "Is your home far?"
  "zh-0436":
    "native": "near; close"
    "notes":
      "n1": "Near, close by. Its opposite is 远 (yuǎn), far."
    "examples":
      "学校很近。": "The school is very near."
      "妈妈家近吗？": "Is Mum's home near?"
  "zh-0437":
    "native": "new"
    "notes":
      "n1": "New, not used before. Its opposite is 旧 (jiù), old."
    "examples":
      "这本书很新。": "This book is very new."
      "鞋新吗？": "Are the shoes new?"
  "zh-0438":
    "native": "old; used"
    "notes":
      "n1": "Old, for things that are used or worn. Its opposite is 新 (xīn), new. For a person's age, use 老 (lǎo)."
    "examples":
      "这件衣服很旧。": "This piece of clothing is very old."
      "书很旧吗？": "Are the books very old?"
  "zh-0439":
    "native": "expensive"
    "notes":
      "n1": "Expensive, high in price. Its opposite is 便宜 (piányi), cheap."
    "examples":
      "这个很贵。": "This one is very expensive."
      "太贵吗？": "Is it too expensive?"
  "zh-0440":
    "native": "cheap"
    "notes":
      "n1": "Cheap, low in price. Its opposite is 贵 (guì), expensive."
    "examples":
      "这件衣服很便宜。": "This piece of clothing is very cheap."
      "鱼便宜吗？": "Is the fish cheap?"
  "zh-0441":
    "native": "fast; quick; hurry"
    "notes":
      "n1": "Fast, quick. It is also used to say hurry: 你快来 (nǐ kuài lái), come quickly. Its opposite is 慢 (màn), slow."
    "examples":
      "他很快。": "He is very quick."
      "你快来。": "Come quickly."
  "zh-0442":
    "native": "slow"
    "notes":
      "n1": "Slow, the opposite of 快 (kuài), fast. 慢走 (màn zǒu), take care on your way, is said to someone who is leaving."
    "examples":
      "他很慢。": "He is very slow."
      "你们慢走。": "Take care on your way."
  "zh-0443":
    "native": "hot"
    "notes":
      "n1": "Hot, of weather, water or food. Its opposite is 冷 (lěng), cold."
    "examples":
      "茶很热。": "The tea is very hot."
      "水很热吗？": "Is the water very hot?"
  "zh-0444":
    "native": "cold"
    "notes":
      "n1": "Cold, of weather, water or food. Its opposite is 热 (rè), hot."
    "examples":
      "水很冷。": "The water is very cold."
      "茶冷吗？": "Is the tea cold?"
  "zh-0445":
    "native": "tired"
    "notes":
      "n1": "Tired, worn out from work or from walking. It is said of people."
    "examples":
      "我很累。": "I am very tired."
      "妈妈累吗？": "Is Mum tired?"
  "zh-0446":
    "native": "difficult; hard"
    "notes":
      "n1": "Difficult, hard to do. Its opposite is 容易 (róngyì), easy."
    "examples":
      "这个字很难。": "This character is very hard."
      "字难吗？": "Are the characters hard?"
  "zh-0447":
    "native": "easy"
    "notes":
      "n1": "Easy, simple to do. Its opposite is 难 (nán), difficult."
    "examples":
      "这个字很容易。": "This character is very easy."
      "写字容易吗？": "Is writing characters easy?"
  "zh-0448":
    "native": "important"
    "notes":
      "n1": "Important, that matters a great deal. 很重要 (hěn zhòngyào), very important."
    "examples":
      "这很重要。": "This is very important."
      "你很重要。": "You are very important."
  "zh-0449":
    "native": "famous"
    "notes":
      "n1": "Famous, known to many people, of a place or a person. 有名 (yǒumíng) is the word for a famous name."
    "examples":
      "这个学校很有名。": "This school is very famous."
      "王先生很有名吗？": "Is Mr. Wang very famous?"
  "zh-0450":
    "native": "tall; high"
    "notes":
      "n1": "Tall, for a person or a thing, or high, for a height. 很高 (hěn gāo) is tall."
    "examples":
      "他很高。": "He is very tall."
      "妈妈高吗？": "Is Mum tall?"
  "zh-0451":
    "native": "long"
    "notes":
      "n1": "Long, of length. Its opposite is 短 (duǎn), short."
    "examples":
      "书很长。": "The book is very long."
      "这鱼很长。": "This fish is very long."
  "zh-0452":
    "native": "short"
    "notes":
      "n1": "Short, of length. Its opposite is 长 (cháng), long."
    "examples":
      "书很短。": "The book is very short."
      "这件衣服很短吗？": "Is this piece of clothing very short?"
  "zh-0453":
    "native": "fat; plump"
    "notes":
      "n1": "Fat, or plump, of a person or an animal. Its opposite is 瘦 (shòu), thin."
    "examples":
      "他很胖。": "He is very plump."
      "妹妹胖吗？": "Is the younger sister plump?"
  "zh-0454":
    "native": "thin; slim"
    "notes":
      "n1": "Thin or slim, of a person or an animal. Its opposite is 胖 (pàng), fat."
    "examples":
      "姐姐很瘦。": "The older sister is very slim."
      "爷爷瘦吗？": "Is Grandpa thin?"
  "zh-0455":
    "native": "young"
    "notes":
      "n1": "Young, of a person. Its opposite is 老 (lǎo), old, for a person."
    "examples":
      "哥哥很年轻。": "The older brother is very young."
      "老师年轻吗？": "Is the teacher young?"
  "zh-0456":
    "native": "clever; smart"
    "notes":
      "n1": "Clever or smart, of a person. 很聪明 (hěn cōngming), very clever."
    "examples":
      "他很聪明。": "He is very clever."
      "弟弟聪明吗？": "Is the younger brother clever?"
  "zh-0457":
    "native": "busy"
    "notes":
      "n1": "Busy, with a lot to do. It is said of people."
    "examples":
      "妈妈很忙。": "Mum is very busy."
      "你忙吗？": "Are you busy?"
  "zh-0458":
    "native": "comfortable; well"
    "notes":
      "n1": "Comfortable, of a seat, a bed or a clothes, and of how the body feels."
    "examples":
      "这件衣服很舒服。": "This piece of clothing is very comfortable."
      "你舒服吗？": "Do you feel well?"
  "zh-0459":
    "native": "ugly; unpleasant to look at"
    "notes":
      "n1": "Ugly, or not nice to look at. Its opposite is 好看 (hǎokàn), nice to look at."
    "examples":
      "这件衣服很难看。": "This piece of clothing is very ugly."
      "鞋很难看。": "The shoes are very ugly."
  "zh-0460":
    "native": "tasty; good to eat"
    "notes":
      "n1": "Tasty, good to eat, of food. For a drink, use 好喝 (hǎohē)."
    "examples":
      "鱼很好吃。": "The fish is very tasty."
      "米好吃吗？": "Is the rice tasty?"
  "zh-0461":
    "native": "interesting; fun"
    "notes":
      "n1": "Interesting, fun to do or to see or to read."
    "examples":
      "这本书很有趣。": "This book is very interesting."
      "学校有趣吗？": "Is school interesting?"
  "zh-0462":
    "native": "warm"
    "notes":
      "n1": "Warm, of a room, the weather or a drink. It is milder than 热 (rè), hot."
    "examples":
      "房间很暖和。": "The room is very warm."
      "衣服暖和吗？": "Are the clothes warm?"
  "zh-0463":
    "native": "hungry"
    "notes":
      "n1": "Hungry, when one needs food. Its opposite is 饱 (bǎo), full."
    "examples":
      "我很饿。": "I am very hungry."
      "你饿吗？": "Are you hungry?"
