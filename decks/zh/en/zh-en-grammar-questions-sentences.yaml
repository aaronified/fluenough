schema: 1
id: "zh-en-grammar-questions-sentences"
kind: "layer"
core: "zh-grammar-questions-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Questions in sentences"
license: "CC-BY-SA-4.0"
description: "Eight questions asked with 吗 (ma), with the verb said twice, and with a question word. Not yet checked by a Mandarin speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "zh-0607":
    "native": "Are you a student?"
    "confusables":
      "w1":
        "why": "呢 (ne) asks back, and you?, not yes or no."
      "w2":
        "why": "吧 (ba) guesses: you are a student, right?"
  "zh-0608":
    "native": "Are you going to school or not?"
    "confusables":
      "w1":
        "why": "吗 (ma) is not added when the verb is said twice."
      "w2":
        "why": "来 (lái) would ask about coming, not going."
  "zh-0609":
    "native": "Who is he?"
    "confusables":
      "w1":
        "why": "什么 (shénme) asks what, not who."
      "w2":
        "why": "哪 (nǎ) asks which, not who."
  "zh-0610":
    "native": "What are you drinking?"
    "confusables":
      "w1":
        "why": "谁 (shéi) asks who, not what."
      "w2":
        "why": "吃 (chī) would say eat, not drink."
  "zh-0611":
    "native": "Where is the teacher?"
    "confusables":
      "w1":
        "why": "谁 (shéi) asks who, not where."
      "w2":
        "why": "为什么 (wèishénme) asks why, not where."
  "zh-0612":
    "native": "When are you coming?"
    "confusables":
      "w1":
        "why": "去 (qù) would say go, not come."
      "w2":
        "why": "几 (jǐ) asks how many, not when."
  "zh-0613":
    "native": "Do you like tea or not?"
    "confusables":
      "w1":
        "why": "吗 (ma) is not added when the verb is said twice."
      "w2":
        "why": "水 (shuǐ) would say water, not tea."
  "zh-0614":
    "native": "Why is he not coming?"
    "confusables":
      "w1":
        "why": "谁 (shéi) asks who, not why."
      "w2":
        "why": "哪里 (nǎlǐ) asks where, not why."
