  "notes": "会 (huì) says that you know how to do something you learnt: 我会游泳 (wǒ huì yóuyǒng), I can swim. 可以 (kěyǐ) says you are allowed, or that it is fine: 我可以游泳 (wǒ kěyǐ yóuyǒng), I may swim. The negative of 会 (huì) is 不会 (bú huì): 我不会开车 (wǒ bú huì kāichē), I cannot drive. 可以 (kěyǐ) is not the same as 能 (néng), which is for ability."
