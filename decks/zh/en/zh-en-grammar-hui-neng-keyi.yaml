"name": "会 (huì) and 可以 (kěyǐ): can"
"license": "CC-BY-SA-4.0"
"description": "Can, in two senses: 会 (huì) for knowing how to do something, and 可以 (kěyǐ) for being allowed to. Not yet checked by a Mandarin speaker: please report any mistake."
