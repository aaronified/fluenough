"cards":
  "zh-3388":
    "confusables":
      "w1":
        "why": "升级 (shēngjí) is to upgrade, which is a larger change."
      "w2":
        "why": "关闭 (guānbì) is to shut down, which comes before restarting."
    "native": "Please restart the computer after updating the software."
  "zh-3389":
    "confusables":
      "w1":
        "why": "卡顿 (kǎdùn) is to lag, a slower problem."
      "w2":
        "why": "电池 (diànchí) is a battery, which is what needs charging."
    "bases":
      "的":
        "meaning": "of"
      "了":
        "meaning": "a particle"
      "要":
        "meaning": "to need"
    "native": "My phone has frozen, so I need to charge it."
  "zh-3390":
    "confusables":
      "w1":
        "why": "备份 (bèifèn) is to back up, a copy for safety."
      "w2":
        "why": "删除 (shānchú) is to delete, the opposite."
    "bases":
      "把":
        "meaning": "a particle that puts the object before the verb"
    "native": "Please save the file on the computer."
  "zh-3391":
    "confusables":
      "w1":
        "why": "蓝牙 (lányá) is Bluetooth, a different connection."
      "w2":
        "why": "无线 (wúxiàn) is wireless, a different kind."
    "native": "This app needs a network connection."
  "zh-3392":
    "confusables":
      "w1":
        "why": "登录 (dēnglù) is to log in, which comes after typing."
      "w2":
        "why": "注册 (zhùcè) is to sign up, a different step."
    "bases":
      "和":
        "meaning": "and"
    "native": "Please enter your account number and password."
  "zh-3393":
    "confusables":
      "w1":
        "why": "扫描 (sǎomiáo) is to scan a paper, a different action."
      "w2":
        "why": "显示 (xiǎnshì) is to show on a screen, not on paper."
    "bases":
      "可以":
        "meaning": "can"
    "native": "This picture is very clear, so it can be printed."
  "zh-3394":
    "confusables":
      "w1":
        "why": "暂停 (zàntíng) is to pause, a short stop."
      "w2":
        "why": "打开 (dǎkāi) is to open, the opposite."
    "native": "Please close the video first, then restart the phone."
  "zh-3395":
    "confusables":
      "w1":
        "why": "智能 (zhìnéng) is smart, a related quality."
      "w2":
        "why": "设置 (shèzhì) is to set up, a manual action."
    "bases":
      "的":
        "meaning": "of"
    "native": "This feature is automatic."
