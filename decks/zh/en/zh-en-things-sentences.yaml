"cards":
  "zh-1679":
    "confusables":
      "w1":
        "why": "背包 (bēibāo) is a backpack, a different bag."
      "w2":
        "why": "书包 (shūbāo) is a school bag."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
      "有":
        "meaning": "to have; there is"
    "native": "There are keys in my bag."
  "zh-1680":
    "confusables":
      "w1":
        "why": "铅笔 (qiānbǐ) is a pencil, a different writing tool."
      "w2":
        "why": "橡皮 (xiàngpí) is an eraser, not a pen."
    "bases":
      "支":
        "meaning": "the measure word for a pen or a stick"
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "Whose pen is this?"
  "zh-1681":
    "confusables":
      "w1":
        "why": "尺子 (chǐzi) is a ruler, not scissors."
      "w2":
        "why": "胶水 (jiāoshuǐ) is glue, not scissors."
    "native": "The scissors are in the box."
  "zh-1682":
    "confusables":
      "w1":
        "why": "电池 (diànchí) is a battery, which powers a camera."
      "w2":
        "why": "充电器 (chōngdiànqì) is a charger, not a camera."
    "bases":
      "用":
        "meaning": "to use"
      "拍":
        "meaning": "to take a photo; to pat"
    "native": "He takes photos with a camera."
  "zh-1683":
    "confusables":
      "w1":
        "why": "雨衣 (yǔyī) is a raincoat, not an umbrella."
      "w2":
        "why": "拖鞋 (tuōxié) is slippers, worn on the feet."
    "bases":
      "把":
        "meaning": "the measure word for things with a handle"
      "放":
        "meaning": "to put"
    "native": "Please put the umbrella at the door."
  "zh-1684":
    "confusables":
      "w1":
        "why": "箱子 (xiāngzi) is a box, not a suitcase."
      "w2":
        "why": "背包 (bēibāo) is a backpack, not a case."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "This is my suitcase."
  "zh-1685":
    "confusables":
      "w1":
        "why": "本子 (běnzi) is a notebook, for writing in."
      "w2":
        "why": "杂志 (zázhì) is a magazine, a kind of book."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "I bought three books."
  "zh-1686":
    "confusables":
      "w1":
        "why": "玩具 (wánjù) is a toy, not a gift."
      "w2":
        "why": "球 (qiú) is a ball, not a gift."
    "bases":
      "放":
        "meaning": "to put"
    "native": "The gift is on the table."
