"schema": 1
"id": "zh-en-places"
"kind": "layer"
"core": "zh-places"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Places"
"description": "Forty places in a town: the bank, the hospital and the park, the post office and the library, the shops, the schools, the car park and the seaside. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1108":
    "native": "bank"
    "notes":
      "n1": "A bank, where you keep money and change it. 行 (háng) is a row or trade here."
    "examples":
      "银行在医院旁边。": "The bank is next to the hospital."
      "我去银行取钱。":
        "native": "I go to the bank to take out money."
        "bases":
          "取":
            "meaning": "to take out; to fetch"
  "zh-1109":
    "native": "hospital"
    "notes":
      "n1": "A hospital, where doctors and nurses treat the sick. 院 (yuàn) is a building or yard."
    "examples":
      "他在医院工作。": "He works in a hospital."
      "医院很大。": "The hospital is very big."
  "zh-1110":
    "native": "park"
    "notes":
      "n1": "A public park, with trees and grass. 园 (yuán) is a garden."
    "examples":
      "我每天去公园散步。":
        "native": "I go for a walk in the park every day."
        "bases":
          "每天":
            "meaning": "every day"
      "公园很安静。": "The park is very quiet."
  "zh-1111":
    "native": "post office"
    "notes":
      "n1": "A post office, where letters and parcels are sent. 局 (jú) is an office."
    "examples":
      "邮局在这儿。": "The post office is here."
      "我去邮局寄信。":
        "native": "I go to the post office to post a letter."
        "bases":
          "寄":
            "meaning": "to post; to send"
          "信":
            "meaning": "letter"
  "zh-1112":
    "native": "library"
    "notes":
      "n1": "A library, where books are lent and read. 图书 (túshū) means books."
    "examples":
      "我去图书馆看书。": "I go to the library to read."
      "图书馆很安静。": "The library is very quiet."
  "zh-1113":
    "native": "shop; store"
    "notes":
      "n1": "A shop, where goods are sold. 店 (diàn) is a shop."
    "examples":
      "商店开门了。":
        "native": "The shop has opened."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "我去商店买水。": "I go to the shop to buy water."
  "zh-1114":
    "native": "hotel"
    "notes":
      "n1": "A hotel, where travellers stay. 酒 (jiǔ) is wine, here the word for an inn."
    "examples":
      "我住在酒店。": "I stay in a hotel."
      "酒店很贵。": "The hotel is expensive."
  "zh-1115":
    "native": "railway station"
    "notes":
      "n1": "A railway station, where trains stop. 火车 (huǒchē) is a train."
    "examples":
      "火车站很大。": "The railway station is very big."
      "我去火车站接人。":
        "native": "I go to the station to meet someone."
        "bases":
          "接":
            "meaning": "to meet; to pick up"
  "zh-1116":
    "native": "museum"
    "notes":
      "n1": "A museum, where old and important things are shown. 博物 (bówù) is natural history and things."
    "examples":
      "博物馆很大。": "The museum is very big."
      "我去博物馆看画。":
        "native": "I go to the museum to see the paintings."
        "bases":
          "画":
            "meaning": "picture; painting"
  "zh-1117":
    "native": "cinema"
    "notes":
      "n1": "A cinema, where films are shown. 电影 (diànyǐng) is a film."
    "examples":
      "电影院在银行对面。": "The cinema is opposite the bank."
      "我们去电影院吧。": "Let us go to the cinema."
  "zh-1118":
    "native": "sports hall; gym"
    "notes":
      "n1": "A sports hall, indoors, for games and exercise. 体育 (tǐyù) is sport."
    "examples":
      "体育馆里有很多人。":
        "native": "There are a lot of people in the sports hall."
        "bases":
          "有":
            "meaning": "to have; there is"
      "我每天去体育馆锻炼。":
        "native": "I go to the gym to exercise every day."
        "bases":
          "每天":
            "meaning": "every day"
  "zh-1119":
    "native": "hairdresser's"
    "notes":
      "n1": "A hairdresser's, where you have your hair cut. 理发 (lǐfà) is to cut hair."
    "examples":
      "理发店在那边。": "The hairdresser's is over there."
      "我去理发店理头发。":
        "native": "I go to the hairdresser's to get my hair cut."
        "bases":
          "理":
            "meaning": "to cut (the hair)"
  "zh-1120":
    "native": "pharmacy; chemist's"
    "notes":
      "n1": "A pharmacy, where medicine is sold. 药 (yào) is medicine."
    "examples":
      "药店在银行对面。": "The pharmacy is opposite the bank."
      "我去药店买药。":
        "native": "I go to the pharmacy to buy medicine."
        "bases":
          "药":
            "meaning": "medicine"
  "zh-1121":
    "native": "bookshop"
    "notes":
      "n1": "A bookshop, where books are sold."
    "examples":
      "书店在二楼。": "The bookshop is on the second floor."
      "我在书店买书。": "I buy books in the bookshop."
  "zh-1122":
    "native": "bakery"
    "notes":
      "n1": "A bakery, where bread and cakes are sold."
    "examples":
      "面包店很香。": "The bakery smells good."
      "我去面包店买蛋糕。": "I go to the bakery to buy a cake."
  "zh-1123":
    "native": "laundry"
    "notes":
      "n1": "A laundry, where clothes are washed. 洗衣 (xǐyī) is to wash clothes."
    "examples":
      "洗衣店在银行旁边。": "The laundry is next to the bank."
      "我去洗衣店洗衣服。": "I go to the laundry to wash clothes."
  "zh-1124":
    "native": "police station"
    "notes":
      "n1": "A police station. 警察 (jǐngchá) is a police officer."
    "examples":
      "警察局在那儿。": "The police station is over there."
      "我去警察局找人。": "I go to the police station to find someone."
  "zh-1125":
    "native": "university"
    "notes":
      "n1": "A university, after school. 大 (dà) is big and 学 (xué) is study."
    "examples":
      "她在大学学习。": "She studies at university."
      "大学很大。": "The university is very big."
  "zh-1126":
    "native": "secondary school"
    "notes":
      "n1": "A secondary school, for teenagers. 中 (zhōng) is middle."
    "examples":
      "我在中学学中文。":
        "native": "I learnt Chinese at secondary school."
        "bases":
          "中文":
            "meaning": "Chinese (the language)"
      "中学很大。": "The secondary school is very big."
  "zh-1127":
    "native": "primary school"
    "notes":
      "n1": "A primary school, for children. 小 (xiǎo) is small."
    "examples":
      "孩子在小学上学。": "The child goes to primary school."
      "小学很近。": "The primary school is near."
  "zh-1128":
    "native": "kindergarten; nursery"
    "notes":
      "n1": "A kindergarten, for children before school. 幼儿 (yòu'ér) is a small child."
    "examples":
      "孩子在幼儿园学字。": "The child learns characters at kindergarten."
      "幼儿园很热闹。": "The kindergarten is very busy."
  "zh-1129":
    "native": "kitchen"
    "notes":
      "n1": "A kitchen, where food is cooked. 房 (fáng) is a room or building."
    "examples":
      "妈妈在厨房做饭。": "Mum is cooking in the kitchen."
      "厨房很干净。": "The kitchen is very clean."
  "zh-1130":
    "native": "classroom"
    "notes":
      "n1": "A classroom, where lessons are taught. 教 (jiāo) is to teach."
    "examples":
      "教室里有很多人。":
        "native": "There are a lot of people in the classroom."
        "bases":
          "有":
            "meaning": "to have; there is"
      "我在教室学习。": "I study in the classroom."
  "zh-1131":
    "native": "playground; sports ground"
    "notes":
      "n1": "A playground or sports ground, outside a school. 场 (chǎng) is an open place."
    "examples":
      "孩子在操场玩。": "The children play on the playground."
      "操场很大。": "The sports ground is very big."
  "zh-1132":
    "native": "square; plaza"
    "notes":
      "n1": "A public square, in a town or city. 广 (guǎng) is wide."
    "examples":
      "广场上有很多人。":
        "native": "There are many people in the square."
        "bases":
          "有":
            "meaning": "to have; there is"
      "我们在广场见吧。": "Let us meet in the square."
  "zh-1133":
    "native": "car park"
    "notes":
      "n1": "A car park, where cars are parked. 停车 (tíngchē) is to park."
    "examples":
      "停车场在地下。": "The car park is underground."
      "我把车停在停车场。":
        "native": "I park the car in the car park."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
          "停":
            "meaning": "to stop"
  "zh-1134":
    "native": "place"
    "notes":
      "n1": "A place, any spot or area. 方 (fāng) is the direction or the side."
    "examples":
      "这个地方很好。": "This place is very good."
      "我喜欢这个地方。": "I like this place."
  "zh-1135":
    "native": "city"
    "notes":
      "n1": "A city, a large town. 市 (shì) is a market or a city."
    "examples":
      "这个城市很大。": "This city is very big."
      "城市里人很多。": "There are many people in the city."
  "zh-1136":
    "native": "village"
    "notes":
      "n1": "A village, a small place in the countryside. 村 (cūn) is a village."
    "examples":
      "村子很小。": "The village is very small."
      "我住在村子里。": "I live in a village."
  "zh-1137":
    "native": "countryside; rural area"
    "notes":
      "n1": "The countryside, away from the city. 农 (nóng) is farming."
    "examples":
      "农村很安静。": "The countryside is very quiet."
      "他住在农村。": "He lives in the countryside."
  "zh-1138":
    "native": "seaside"
    "notes":
      "n1": "The seaside, the edge of the sea. 边 (biān) is an edge or side."
    "examples":
      "海边有很多人。":
        "native": "There are many people at the seaside."
        "bases":
          "有":
            "meaning": "to have; there is"
      "我喜欢海边。": "I like the seaside."
  "zh-1139":
    "native": "river"
    "notes":
      "n1": "A river, a large stream of water."
    "examples":
      "河很长。": "The river is very long."
      "河边有公园。":
        "native": "There is a park by the river."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1140":
    "native": "lake"
    "notes":
      "n1": "A lake, a large area of still water."
    "examples":
      "湖很大。": "The lake is very big."
      "我们去湖边散步。": "We go for a walk by the lake."
  "zh-1141":
    "native": "temple"
    "notes":
      "n1": "A temple, a place of worship. 寺 (sì) is a temple."
    "examples":
      "寺庙很老了。":
        "native": "The temple is very old."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "我去寺庙看看。": "I go to see the temple."
  "zh-1142":
    "native": "church"
    "notes":
      "n1": "A church, for Christian worship. 堂 (táng) is a hall."
    "examples":
      "教堂很漂亮。": "The church is very pretty."
      "周末我去教堂。": "At the weekend I go to church."
  "zh-1143":
    "native": "restaurant (in a hotel or company)"
    "notes":
      "n1": "A dining room or restaurant, usually a larger one. 餐 (cān) is a meal."
    "examples":
      "餐厅在二楼。": "The restaurant is on the second floor."
      "我们在餐厅吃饭。": "We eat in the restaurant."
  "zh-1144":
    "native": "house"
    "notes":
      "n1": "A house, a building to live in. 房 (fáng) is a room or house."
    "examples":
      "这个房子很大。": "This house is very big."
      "房子在海边。": "The house is by the sea."
  "zh-1145":
    "native": "sea"
    "notes":
      "n1": "The sea, a large body of salt water."
    "examples":
      "海很大。": "The sea is very big."
      "我喜欢海。": "I like the sea."
  "zh-1146":
    "native": "forest"
    "notes":
      "n1": "A forest, a large area of trees. 林 (lín) is a grove of trees."
    "examples":
      "森林很大。": "The forest is very big."
      "我们去森林散步。": "We go for a walk in the forest."
  "zh-1147":
    "native": "island"
    "notes":
      "n1": "An island, land surrounded by water."
    "examples":
      "岛很小。": "The island is very small."
      "我去岛上玩。": "I go to play on the island."
