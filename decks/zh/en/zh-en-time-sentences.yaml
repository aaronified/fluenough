"cards":
  "zh-0504":
    "native": "What time is it now?"
    "confusables":
      "w1":
        "why": "时间 (shíjiān) is time in general, not the hour."
      "w2":
        "why": "时候 (shíhou) is a moment, when something happens."
  "zh-0505":
    "native": "We come tomorrow morning."
    "confusables":
      "w1":
        "why": "昨天 (zuótiān) would say yesterday, the other way round."
      "w2":
        "why": "下午 (xiàwǔ) would say afternoon, not morning."
  "zh-0506":
    "native": "Mum comes home at seven in the evening."
    "confusables":
      "w1":
        "why": "中午 (zhōngwǔ) would say noon, not the evening."
      "w2":
        "why": "早 (zǎo) would say early, the opposite of late."
  "zh-0507":
    "native": "Are you eating now?"
    "confusables":
      "w1":
        "why": "以前 (yǐqián) would say before, in the past."
      "w2":
        "why": "以后 (yǐhòu) would say later, in the future."
  "zh-0508":
    "native": "It is open at noon on Sunday."
    "confusables":
      "w1":
        "why": "关 (guān) would say close, the opposite of open."
      "w2":
        "why": "开门 (kāimén) would say open a door, not open for business at noon."
  "zh-0509":
    "native": "I will wait an hour for you."
    "confusables":
      "w1":
        "why": "分 (fēn) is a minute, a much shorter time."
      "w2":
        "why": "年 (nián) is a year, a much longer time."
  "zh-0510":
    "native": "You came early yesterday and you come late today."
    "confusables":
      "w1":
        "why": "明天 (míngtiān) would say tomorrow, not today."
      "w2":
        "why": "以前 (yǐqián) would say before, not yesterday."
  "zh-0511":
    "native": "What do you do at the weekend?"
    "confusables":
      "w1":
        "why": "星期天 (xīngqītiān) is Sunday, one day only."
      "w2":
        "why": "上午 (shàngwǔ) is the forenoon, not the weekend."
  "zh-0512":
    "native": "An hour is quick, and a day is long."
    "confusables":
      "w1":
        "why": "年 (nián) is a year, not a day."
      "w2":
        "why": "分 (fēn) is a minute, not an hour."
