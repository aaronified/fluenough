"cards":
  "zh-4763":
    "native": "The plot of this novel is interesting; I read it in one go."
    "confusables":
      "w1":
        "why": "a story is the whole tale, not the sequence of events inside it"
      "w2":
        "why": "the ending is only the last part of a story"
    "bases":
