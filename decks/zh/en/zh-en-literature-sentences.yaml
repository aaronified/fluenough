      "很":
        "meaning": "very"
  "zh-4765":
    "native": "The teacher read this Tang poem aloud once."
    "confusables":
      "w1":
        "why": "to read out words or a list, not a poem with feeling"
      "w2":
        "why": "to read in general, which can also be silent"
    "bases":
      "老师":
        "meaning": "teacher"
      "了":
        "meaning": "completed-action particle"
      "遍":
        "meaning": "time (round)"
      "首":
        "meaning": "measure for poems"
  "zh-4766":
    "native": "The cover and the table of contents of this book are both very beautiful."
    "confusables":
      "w1":
        "why": "the title of the book, which is only its name"
      "w2":
        "why": "the preface is text at the front, not the design"
    "bases":
      "的":
        "meaning": "particle"
      "和":
        "meaning": "and"
      "都":
