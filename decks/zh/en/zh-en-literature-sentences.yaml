        "meaning": "measure for works"
      "的":
        "meaning": "particle"
      "很":
        "meaning": "very"
      "有意思":
        "meaning": "interesting"
      "我":
        "meaning": "I"
      "一口气":
        "meaning": "in one go"
      "读完":
        "meaning": "finish reading"
      "了":
        "meaning": "completed-action particle"
  "zh-4764":
    "native": "The mood of this poem makes people feel very calm."
    "confusables":
      "w1":
        "why": "a poet is the person who writes the poem, not its mood"
      "w2":
        "why": "the meaning of the words, not the feeling they create"
    "bases":
      "首":
        "meaning": "measure for poems"
      "的":
        "meaning": "particle"
      "让":
        "meaning": "make; let"
      "人":
        "meaning": "person"
      "感到":
