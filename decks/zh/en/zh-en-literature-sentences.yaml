  "zh-4768":
    "native": "This writer's style is fresh, and I am happy every time I read it."
    "confusables":
      "w1":
        "why": "the style of a whole body of work, not of the sentences alone"
      "w2":
        "why": "the works a writer has made, not the way they write"
