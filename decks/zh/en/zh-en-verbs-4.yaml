"core": "zh-verbs-4"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Story actions"
"description": "Sixty verbs for telling a story: moving, falling, finding, hiding, stopping and going on, with the results shown by their endings. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-4246":
    "native": "to walk past; to walk along"
    "notes":
      "n1": "走过 (zǒuguò) is to walk past or along a place, and it takes the place as its object: 走过那条街 (zǒuguò nà tiáo jiē), walk along that street. For walking out of a place, use 走出 (zǒuchū)."
    "examples":
      "他走过那座桥。":
        "native": "He walked across that bridge."
        "bases":
          "那座":
            "meaning": "that (a bridge, a mountain)"
      "我每天都走过这个公园。":
        "native": "I walk past this park every day."
        "bases":
          "每天":
            "meaning": "every day"
          "这个":
            "meaning": "this"
  "zh-4247":
    "native": "to stop (and stay stopped)"
    "notes":
      "n1": "停下 (tíngxià) is to stop moving and stay still, said of a person or a vehicle. The plain verb 停 (tíng) is to stop a thing, and 停止 (tíngzhǐ) is to stop an activity or a process."
    "examples":
      "他听到声音，停下了脚步。":
        "native": "He heard a sound and stopped in his tracks."
        "bases":
          "听到":
            "meaning": "to hear"
          "了":
            "meaning": "completed action"
          "脚步":
            "meaning": "footstep"
      "车突然停下来了。":
        "native": "The car stopped suddenly."
        "bases":
          "突然":
            "meaning": "suddenly"
          "了":
            "meaning": "completed action"
  "zh-4248":
    "native": "to turn round; to look back"
    "notes":
      "n1": "回头 (huítóu) is to turn the head back and look at what was left behind. It is a physical action. To go back to a place is 回去 (huíqù), which is a different word."
    "examples":
      "他走了几步，又回头看了一眼。":
        "native": "He walked a few steps, then looked back once."
        "bases":
          "了":
            "meaning": "completed action"
          "几步":
            "meaning": "a few steps"
          "一眼":
            "meaning": "a glance"
      "听到叫声，她马上回头。":
        "native": "On hearing the cry, she turned round at once."
        "bases":
          "听到":
            "meaning": "to hear"
          "叫声":
            "meaning": "cry; call"
  "zh-4249":
    "native": "to give up"
    "notes":
      "n1": "放弃 (fàngqì) is to give up a plan, a chance or a right, and the aim is dropped for good. It is usually followed by what is given up: 放弃比赛 (fàngqì bǐsài), give up the match. It is stronger than 停止 (tíngzhǐ), to stop."
    "examples":
      "他没有放弃，一直走到了终点。":
        "native": "He did not give up, and kept walking to the finish."
        "bases":
          "没有":
            "meaning": "there is not; did not"
          "走到":
            "meaning": "to walk to"
          "了":
            "meaning": "completed action"
          "终点":
            "meaning": "finishing point"
      "我们不能放弃希望。":
        "native": "We must not give up hope."
        "bases":
          "不能":
            "meaning": "cannot"
  "zh-4250":
    "native": "to wait (formal)"
    "notes":
      "n1": "等待 (děngdài) is to wait, a more formal word than 等 (děng). It suits a long or uncertain wait, such as waiting for news or for help. In daily speech people say 等 (děng)."
    "examples":
      "我们在门口等待救援。":
        "native": "We waited at the door for rescue."
      "他在车站等待了两个小时。":
        "native": "He waited at the station for two hours."
        "bases":
          "了":
            "meaning": "completed action"
          "两个":
            "meaning": "two"
  "zh-4251":
    "native": "to chase"
    "notes":
      "n1": "追 (zhuī) is to chase, to run after someone or something that is ahead. 追上 (zhuīshàng) is the result, to catch up with it. The noun 追求 (zhuīqiú) is pursuit, as of a goal or a dream."
    "examples":
      "小狗在后面追我。":
        "native": "The puppy chased me from behind."
        "bases":
          "小狗":
            "meaning": "puppy"
      "他追上了那辆车。":
        "native": "He caught up with that car."
        "bases":
          "了":
            "meaning": "completed action"
          "那辆":
            "meaning": "that (a vehicle)"
  "zh-4252":
    "native": "to dodge; to hide from"
    "notes":
      "n1": "躲 (duǒ) is to get out of someone's way quickly, or to hide oneself from them. 躲避 (duǒbì) is the more formal word. Hiding an object is 藏 (cáng), a different action."
    "examples":
      "他躲在门后面。":
        "native": "He hid behind the door."
      "孩子躲开了那只狗。":
        "native": "The child dodged the dog."
        "bases":
          "了":
            "meaning": "completed action"
          "那只":
            "meaning": "that (an animal)"
  "zh-4253":
    "native": "to hide (something)"
    "notes":
      "n1": "藏 (cáng) is to hide a thing, or to be hidden out of sight. The usual form is 藏起来 (cángqǐlái). For a person keeping out of the way, use 躲 (duǒ), which is a different action."
    "examples":
      "他把钱藏在床底下。":
        "native": "He hid the money under the bed."
        "bases":
          "把":
            "meaning": "marker of an object moved"
          "床底下":
            "meaning": "under the bed"
      "孩子们藏起来了。":
        "native": "The children hid themselves."
        "bases":
          "孩子们":
            "meaning": "children"
          "起来":
            "meaning": "up; (begin to)"
          "了":
            "meaning": "completed action"
  "zh-4254":
    "native": "to close; to shut"
    "notes":
      "n1": "关上 (guānshàng) is to close something that swings or slides, such as a door or a window. 关 (guān) is the plain verb, and 上 (shàng) adds the result of the shutting. The opposite is 打开 (dǎkāi), to open."
    "examples":
      "他走出去，把门关上了。":
        "native": "He went out and shut the door."
        "bases":
          "出去":
            "meaning": "out"
          "把":
            "meaning": "marker of an object moved"
          "了":
            "meaning": "completed action"
      "请关上窗户。":
        "native": "Please close the window."
  "zh-4255":
    "native": "to pick up; to take up"
    "notes":
      "n1": "拿起 (náqǐ) is to take something up from where it lies and lift it. It takes an object: 拿起电话 (náqǐ diànhuà), pick up the phone. The opposite is 放下 (fàngxià), to put down."
    "examples":
      "他拿起电话，打给妈妈。":
        "native": "He picked up the phone and called Mum."
        "bases":
          "打给":
            "meaning": "to call (someone)"
      "她拿起书，又放下了。":
        "native": "She picked up a book, then put it down again."
        "bases":
          "了":
            "meaning": "completed action"
  "zh-4256":
    "native": "to put down; to set down"
    "notes":
      "n1": "放下 (fàngxià) is to put something down, or to set down a burden. 放下心来 (fàngxià xīn lái) is to feel relieved, to stop worrying. It is the opposite of 拿起 (náqǐ), to pick up."
    "examples":
      "他把包放下，坐了下来。":
        "native": "He put his bag down and sat down."
        "bases":
          "把":
            "meaning": "marker of an object moved"
          "了":
            "meaning": "completed action"
          "下来":
            "meaning": "down; (settled)"
      "听到这个消息，她终于放下了心。":
        "native": "On hearing the news, she finally felt relieved."
        "bases":
          "听到":
            "meaning": "to hear"
          "这个":
            "meaning": "this"
          "终于":
            "meaning": "finally"
          "了":
            "meaning": "completed action"
  "zh-4257":
    "native": "to pick up (from the ground); to find by chance"
    "notes":
      "n1": "捡 (jiǎn) is to pick up something from the ground, or to come across it by luck: 捡到钱 (jiǎndào qián), find money. For lifting a thing on purpose, use 拿起 (náqǐ)."
    "examples":
      "他在路上捡到一个钱包。":
        "native": "He found a wallet on the road."
        "bases":
          "路上":
            "meaning": "on the road"
          "到":
            "meaning": "to reach; to obtain"
          "一个":
            "meaning": "a; one"
      "她弯腰捡起了一支笔。":
        "native": "She bent down and picked up a pen."
        "bases":
          "弯腰":
            "meaning": "to bend down"
          "起":
            "meaning": "up"
          "了":
            "meaning": "completed action"
          "一支":
            "meaning": "a (a pen, a stick)"
  "zh-4258":
    "native": "to fall down; to collapse"
    "notes":
      "n1": "倒下 (dǎoxià) is to fall and lie down, said of a person who collapses or a tree that falls. It is more final than 摔倒 (shuāidǎo), which is only the fall itself."
    "examples":
      "他突然倒下了。":
        "native": "He suddenly collapsed."
        "bases":
          "突然":
            "meaning": "suddenly"
          "了":
            "meaning": "completed action"
      "大树在风里倒下了。":
        "native": "The big tree fell down in the wind."
        "bases":
          "大树":
            "meaning": "big tree"
          "了":
            "meaning": "completed action"
  "zh-4259":
    "native": "to wake up"
    "notes":
      "n1": "醒来 (xǐnglái) is to wake up, the moment of waking, and it is the common phrase in a story. The opposite beginning is 睡着 (shuìzháo), to fall asleep."
    "examples":
      "他第二天早上醒来，发现下雨了。":
        "native": "He woke up the next morning and found that it was raining."
        "bases":
          "第二天":
            "meaning": "the next day"
          "了":
            "meaning": "completed action"
      "我一醒来，就看见了她。":
        "native": "As soon as I woke up, I saw her."
        "bases":
          "了":
            "meaning": "completed action"
  "zh-4260":
    "native": "to fall asleep"
    "notes":
      "n1": "睡着 (shuìzháo) is to fall asleep, the moment one drops off. The 着 (zhe) shows the result. It is the opposite of 醒来 (xǐnglái), to wake up."
    "examples":
      "孩子在车上睡着了。":
        "native": "The child fell asleep in the car."
        "bases":
          "了":
            "meaning": "completed action"
      "我等他，结果睡着了。":
        "native": "I waited for him, and then I fell asleep."
        "bases":
          "结果":
            "meaning": "as it turned out"
          "了":
            "meaning": "completed action"
  "zh-4261":
    "native": "to cry"
    "notes":
      "n1": "哭 (kū) is to cry, with tears and sound. 哭了 (kū le) means the crying has begun. A quieter way to say it is 流眼泪 (liú yǎnlèi), to shed tears, which has no sound."
    "examples":
      "孩子哭了很久。":
        "native": "The child cried for a long time."
        "bases":
          "了":
            "meaning": "completed action"
          "很久":
            "meaning": "a long time"
      "她看到信，哭了起来。":
        "native": "She saw the letter and began to cry."
        "bases":
          "看到":
            "meaning": "to see"
          "信":
            "meaning": "letter"
          "了":
            "meaning": "completed action"
          "起来":
            "meaning": "up; (begin to)"
  "zh-4262":
    "native": "to shout; to call out"
    "notes":
      "n1": "喊 (hǎn) is to shout or call out loudly, to someone or for help: 喊救命 (hǎn jiùmìng), shout 'help!'. It is louder than talking. 大声 (dàshēng) means loudly and often comes before it."
    "examples":
      "他大声喊：快跑！":
        "native": "He shouted: run!"
        "bases":
          "大声":
            "meaning": "loudly"
      "有人在远处喊她的名字。":
        "native": "Someone far off was calling her name."
        "bases":
          "有人":
            "meaning": "someone"
          "远处":
            "meaning": "the distance"
          "的":
            "meaning": "of; 's"
  "zh-4263":
    "native": "to push"
    "notes":
      "n1": "推 (tuī) is to push something away from oneself, or to push a door open. The opposite is 拉 (lā), to pull. 推开 (tuīkāi) is to push open, as a door."
    "examples":
      "他用力推门，门开了。":
        "native": "He pushed the door hard, and it opened."
        "bases":
          "用力":
            "meaning": "with force"
          "了":
            "meaning": "completed action"
      "有人推了我一下。":
        "native": "Someone gave me a push."
        "bases":
          "有人":
            "meaning": "someone"
          "了":
            "meaning": "completed action"
          "一下":
            "meaning": "once"
  "zh-4264":
    "native": "to pull"
    "notes":
      "n1": "拉 (lā) is to pull something toward oneself. It is the opposite of 推 (tuī), to push. 拉开 (lākāi) is to pull open, and 拉住 (lāzhù) is to hold on to by pulling."
    "examples":
      "她拉住我的手。":
        "native": "She held my hand tight."
        "bases":
          "的":
            "meaning": "of; 's"
      "他拉开了抽屉，拿出一张纸。":
        "native": "He pulled open the drawer and took out a sheet of paper."
        "bases":
          "了":
            "meaning": "completed action"
          "抽屉":
            "meaning": "drawer"
          "拿出":
            "meaning": "to take out"
          "一张":
            "meaning": "a (a sheet or a form)"
  "zh-4265":
    "native": "to grab; to catch"
    "notes":
      "n1": "抓 (zhuā) is to grab or seize with the hand, and 抓住 (zhuāzhù) is to hold firmly. It is also used for catching a thief: 抓小偷 (zhuā xiǎotōu). The police word for arrest is 逮捕 (dàibǔ)."
    "examples":
      "他抓住了树枝。":
        "native": "He grabbed the branch."
        "bases":
          "了":
            "meaning": "completed action"
          "树枝":
            "meaning": "branch"
      "她抓起包就跑了。":
        "native": "She grabbed her bag and ran."
        "bases":
          "起":
            "meaning": "up"
          "了":
            "meaning": "completed action"
  "zh-4266":
    "native": "to fall; to drop and break"
    "notes":
      "n1": "摔 (shuāi) is to fall, or to drop something so that it hits the ground hard. 摔倒 (shuāidǎo) is to fall down and 摔碎 (shuāisuì) is to drop and break. 掉 (diào) is a gentler fall, and 掉下来 (diàoxiàlái) is to drop down."
    "examples":
      "他骑车的时候摔了一跤。":
        "native": "He fell off his bicycle."
        "bases":
          "的":
            "meaning": "of; 's"
          "了":
            "meaning": "completed action"
          "一跤":
            "meaning": "a fall"
      "盘子从桌子上摔下来，碎了。":
        "native": "The plate fell off the table and broke."
        "bases":
          "从":
            "meaning": "from"
          "下来":
            "meaning": "down; (settled)"
          "碎":
            "meaning": "broken to pieces"
          "了":
            "meaning": "completed action"
  "zh-4267":
    "native": "to bump into; to crash into"
    "notes":
      "n1": "撞 (zhuàng) is to hit something with force, to crash into it, or to bump into a person by accident. 撞到 (zhuàngdào) is the result form. 碰到 (pèngdào) is gentler, a light touch or a chance meeting."
    "examples":
      "他没看路，撞到了电线杆。":
        "native": "He did not look where he was going and walked into a telegraph pole."
        "bases":
          "没":
            "meaning": "not; did not"
          "到":
            "meaning": "to reach; to obtain"
          "了":
            "meaning": "completed action"
          "电线杆":
            "meaning": "telegraph pole"
      "汽车撞在墙上。":
        "native": "The car crashed into the wall."
  "zh-4268":
    "native": "to climb; to crawl"
    "notes":
      "n1": "爬 (pá) is to climb, usually with the hands and feet, or to crawl along the ground. 爬上 (páshàng) is to climb up onto something. For going up stairs people say 上楼 (shànglóu)."
    "examples":
      "他爬上了那棵树。":
        "native": "He climbed up that tree."
        "bases":
          "了":
            "meaning": "completed action"
          "那棵":
            "meaning": "that (a tree)"
      "小孩在地上爬。":
        "native": "The little child is crawling on the floor."
        "bases":
          "小孩":
            "meaning": "child"
          "地上":
            "meaning": "on the ground"
  "zh-4269":
    "native": "to jump"
    "notes":
      "n1": "跳 (tiào) is to jump, to leave the ground with both feet, or to jump into water. 跳起来 (tiàoqǐlái) is to jump up. A heart that beats fast is also said to 跳 (tiào)."
    "examples":
      "他从窗口跳了下去。":
        "native": "He jumped down from the window."
        "bases":
          "从":
            "meaning": "from"
          "了":
            "meaning": "completed action"
          "下去":
            "meaning": "down"
      "她吓得跳了起来。":
        "native": "She was so startled that she jumped up."
        "bases":
          "吓得":
            "meaning": "so frightened that"
          "了":
            "meaning": "completed action"
          "起来":
            "meaning": "up; (begin to)"
  "zh-4270":
    "native": "to swim"
    "notes":
      "n1": "游 (yóu) is to swim, as in 游泳 (yóuyǒng), swimming, which is also the noun. To swim across a river is 游过河 (yóuguò hé). A swimmer is 游泳的人 (yóuyǒng de rén)."
    "examples":
      "他会游泳，游得很快。":
        "native": "He can swim, and he swims very fast."
        "bases":
          "会":
            "meaning": "can; will"
          "得":
            "meaning": "complement marker"
      "他游过了那条河。":
        "native": "He swam across that river."
        "bases":
          "了":
            "meaning": "completed action"
          "那条":
            "meaning": "that (a river)"
  "zh-4271":
    "native": "to fly"
    "notes":
      "n1": "飞 (fēi) is to fly, said of birds, insects, planes and anything thrown through the air. 飞机 (fēijī) is an aeroplane. To go by plane is 坐飞机 (zuò fēijī)."
    "examples":
      "鸟从树上飞走了。":
        "native": "The bird flew away from the tree."
        "bases":
          "从":
            "meaning": "from"
          "了":
            "meaning": "completed action"
      "飞机在天上飞。":
        "native": "The plane is flying in the sky."
  "zh-4272":
    "native": "to flee; to run away"
    "notes":
      "n1": "逃 (táo) is to run away, to flee from a danger or a place. 逃走 (táozǒu) is the usual phrase. For escaping a danger in an emergency, the course already has 逃生 (táoshēng), escape to safety."
    "examples":
      "小偷逃走了。":
        "native": "The thief ran away."
        "bases":
          "了":
            "meaning": "completed action"
      "他从火里逃出来了。":
        "native": "He escaped from the fire."
        "bases":
          "从":
            "meaning": "from"
          "出来":
            "meaning": "to come out"
          "了":
            "meaning": "completed action"
  "zh-4273":
    "native": "to meet; to come across"
    "notes":
      "n1": "遇到 (yùdào) is to meet or come across someone or something, often by chance, or a problem. 遇到困难 (yùdào kùnnan), to meet a difficulty. 碰到 (pèngdào) is more casual."
    "examples":
      "我在路上遇到了老朋友。":
        "native": "I met an old friend on the road."
        "bases":
          "路上":
            "meaning": "on the road"
          "了":
            "meaning": "completed action"
      "他们遇到了很大的困难。":
        "native": "They ran into a great difficulty."
        "bases":
          "了":
            "meaning": "completed action"
          "很大":
            "meaning": "very big"
          "的":
            "meaning": "of; 's"
          "困难":
            "meaning": "difficulty"
  "zh-4274":
    "native": "to run into; to touch by chance"
    "notes":
      "n1": "碰到 (pèngdào) is to meet someone by chance, or to touch something by accident. It is casual. For a planned meeting use 见面 (jiànmiàn), and for an unexpected difficulty use 遇到 (yùdào)."
    "examples":
      "我昨天在市场碰到了王老师。":
        "native": "I ran into Teacher Wang at the market yesterday."
        "bases":
          "了":
            "meaning": "completed action"
          "王老师":
            "meaning": "Teacher Wang"
      "小心，别碰到那个开关。":
        "native": "Careful, do not touch that switch."
        "bases":
          "那个":
            "meaning": "that"
  "zh-4275":
    "native": "to touch; to feel with the hand"
    "notes":
      "n1": "摸 (mō) is to touch or feel something with the hand, often to find it in the dark: 摸黑 (mōhēi), to feel one's way in the dark. For a light touch, 碰 (pèng) is also used."
    "examples":
      "他在黑暗里摸了摸墙。":
        "native": "In the dark he felt along the wall."
        "bases":
          "黑暗":
            "meaning": "darkness"
          "了":
            "meaning": "completed action"
      "她摸了摸孩子的头。":
        "native": "She stroked the child's head."
        "bases":
          "了":
            "meaning": "completed action"
          "的":
            "meaning": "of; 's"
  "zh-4276":
    "native": "to knock; to tap"
    "notes":
      "n1": "敲 (qiāo) is to knock on a door or tap a surface with a hard object. 敲门 (qiāomén) is to knock on the door. Pressing a button is 按 (àn), a different action."
    "examples":
      "有人敲门。":
        "native": "Someone is knocking at the door."
        "bases":
          "有人":
            "meaning": "someone"
      "他敲了三下门，没有人回答。":
        "native": "He knocked three times, and nobody answered."
        "bases":
          "了":
            "meaning": "completed action"
          "三下":
            "meaning": "three times"
          "没有":
            "meaning": "there is not; did not"
  "zh-4277":
    "native": "to sit down"
    "notes":
      "n1": "坐下 (zuòxià) is to sit down, the moment of changing from standing to sitting. 坐 (zuò) alone is simply to sit. The opposite is 站起来 (zhànqǐlái), to stand up."
    "examples":
      "老师请大家坐下。":
        "native": "The teacher asked everyone to sit down."
      "他累了，坐下休息。":
        "native": "He was tired, so he sat down to rest."
        "bases":
          "了":
            "meaning": "completed action"
  "zh-4278":
    "native": "to walk in; to walk into"
    "notes":
      "n1": "走进 (zǒujìn) is to walk into a place, from outside to inside: 走进房间 (zǒujìn fángjiān), walk into the room. The opposite is 走出 (zǒuchū), to walk out of a place."
    "examples":
      "他走进了一家商店。":
        "native": "He walked into a shop."
        "bases":
          "了":
            "meaning": "completed action"
          "一家":
            "meaning": "a (a company)"
      "门开了，一个人走进来了。":
        "native": "The door opened and someone walked in."
        "bases":
          "了":
            "meaning": "completed action"
          "一个":
            "meaning": "a; one"
  "zh-4279":
    "native": "to walk out"
    "notes":
      "n1": "走出 (zǒuchū) is to walk out of a place, from inside to outside: 走出教室 (zǒuchū jiàoshì), walk out of the classroom. It is the opposite of 走进 (zǒujìn), to walk in."
    "examples":
      "他走出大楼，看到了救护车。":
        "native": "He walked out of the building and saw the ambulance."
        "bases":
          "大楼":
            "meaning": "building"
          "看到":
            "meaning": "to see"
          "了":
            "meaning": "completed action"
      "她走出房间，关上了门。":
        "native": "She walked out of the room and shut the door."
        "bases":
          "了":
            "meaning": "completed action"
  "zh-4280":
    "native": "to come back"
    "notes":
      "n1": "回来 (huílái) is to come back to where the speaker is, or to the speaker's home. 回去 (huíqù) is to go back to another place. Which one to use depends on where the speaker stands: 我回来了 (wǒ huílái le) is said at home."
    "examples":
      "爸爸下班以后，很晚才回来。":
        "native": "Dad came back very late, after work."
        "bases":
          "很晚":
            "meaning": "very late"
          "才":
            "meaning": "only then"
      "我回来了！":
        "native": "I'm back!"
        "bases":
          "了":
            "meaning": "completed action"
  "zh-4281":
    "native": "to enter (formal)"
    "notes":
      "n1": "进入 (jìnrù) is to enter, a more formal word than 走进 (zǒujìn). It is used for places and for states: 进入教室 (jìnrù jiàoshì), enter the classroom; 进入睡眠 (jìnrù shuìmián), go to sleep."
    "examples":
      "警察进入了房间。":
        "native": "The police entered the room."
        "bases":
          "了":
            "meaning": "completed action"
      "船慢慢进入了港口。":
        "native": "The boat slowly entered the harbour."
        "bases":
          "慢慢":
            "meaning": "slowly"
          "了":
            "meaning": "completed action"
  "zh-4282":
    "native": "to appear"
    "notes":
      "n1": "出现 (chūxiàn) is to appear, come into view, or happen for the first time: 出现问题 (chūxiàn wèntí), a problem arises. It is used for people, things and events."
    "examples":
      "一只猫突然出现在窗口。":
        "native": "A cat suddenly appeared at the window."
        "bases":
          "一只":
            "meaning": "a (an animal)"
          "突然":
            "meaning": "suddenly"
      "一个奇怪的人出现了。":
        "native": "A strange person appeared."
        "bases":
          "一个":
            "meaning": "a; one"
          "的":
            "meaning": "of; 's"
          "了":
            "meaning": "completed action"
  "zh-4283":
    "native": "to disappear"
    "notes":
      "n1": "消失 (xiāoshī) is to disappear, to go out of sight or be gone for good. It suits a memory or a feeling as well as a thing. 不见 (bújiàn) is also 'gone', said of something one is looking for."
    "examples":
      "太阳慢慢消失在山后。":
        "native": "The sun slowly disappeared behind the mountain."
        "bases":
          "慢慢":
            "meaning": "slowly"
      "那个人一下子就消失了。":
        "native": "That person vanished all at once."
        "bases":
          "那个":
            "meaning": "that"
          "一下子":
            "meaning": "all at once"
          "了":
            "meaning": "completed action"
  "zh-4284":
    "native": "to turn into; to become"
    "notes":
      "n1": "变成 (biànchéng) is to turn into something else, a change that is complete: 变成朋友 (biànchéng péngyou), become friends. 成为 (chéngwéi) is more formal and used for roles and titles."
    "examples":
      "白天变成了黑夜。":
        "native": "Day turned into night."
        "bases":
          "白天":
            "meaning": "daytime"
          "了":
            "meaning": "completed action"
          "黑夜":
            "meaning": "night"
      "这件小事变成了大问题。":
        "native": "This small matter turned into a big problem."
        "bases":
          "这件":
            "meaning": "this (a matter)"
          "小事":
            "meaning": "small matter"
          "了":
            "meaning": "completed action"
  "zh-4285":
    "native": "to continue"
    "notes":
      "n1": "继续 (jìxù) is to carry on with what was already happening, after a pause or an interruption: 继续走 (jìxù zǒu), keep walking. It is followed by a verb, and it is not used to start something new, which is 开始 (kāishǐ)."
    "examples":
      "他没有停，继续往前走。":
        "native": "He did not stop; he kept walking forward."
        "bases":
          "没有":
            "meaning": "there is not; did not"
          "停":
            "meaning": "to stop"
          "往":
            "meaning": "towards"
      "雨停了，我们继续走吧。":
        "native": "The rain has stopped, so let's keep going."
        "bases":
          "停":
            "meaning": "to stop"
          "了":
            "meaning": "completed action"
  "zh-4286":
    "native": "to threaten"
    "notes":
      "n1": "威胁 (wēixié) is to threaten someone with harm, or to be a threat to something. It can be a noun too: 受到威胁 (shòudào wēixié), to be under threat. Use it for a serious danger, not an annoyance."
    "examples":
      "他威胁要报警。":
        "native": "He threatened to call the police."
        "bases":
          "要":
            "meaning": "must; to want"
      "洪水威胁着村子。":
        "native": "The flood threatened the village."
        "bases":
          "着":
            "meaning": "continuing state"
  "zh-4287":
    "native": "to persuade; to advise"
    "notes":
      "n1": "劝 (quàn) is to advise or persuade someone to do, or not to do, something, gently: 劝他休息 (quàn tā xiūxi), advise him to rest. 劝说 (quànshuō) is to persuade by talking at length."
    "examples":
      "朋友劝我别去。":
        "native": "My friend advised me not to go."
      "老师劝他重新考虑。":
        "native": "The teacher urged him to think again."
        "bases":
          "重新":
            "meaning": "again"
  "zh-4288":
    "native": "to agree on; to arrange"
    "notes":
      "n1": "约定 (yuēdìng) is to agree on something beforehand, such as a time or a promise: 约定时间 (yuēdìng shíjiān), agree on a time. It is also a noun, an agreement. 答应 (dāying) is to say yes to a request."
    "examples":
      "我们约定明天见面。":
        "native": "We agreed to meet tomorrow."
      "他们约定了一个时间。":
        "native": "They agreed on a time."
        "bases":
          "了":
            "meaning": "completed action"
          "一个":
            "meaning": "a; one"
  "zh-4289":
    "native": "to deceive"
    "notes":
      "n1": "欺骗 (qīpiàn) is to deceive someone on purpose, to make them believe something false. It is a serious word. 骗 (piàn) is the everyday word to cheat, and 诈骗 (zhàpiàn) is fraud for money."
    "examples":
      "他欺骗了所有的朋友。":
        "native": "He deceived all his friends."
        "bases":
          "了":
            "meaning": "completed action"
          "的":
            "meaning": "of; 's"
      "不要欺骗自己。":
        "native": "Do not deceive yourself."
        "bases":
          "不要":
            "meaning": "do not"
  "zh-4290":
    "native": "to peek at; to look at secretly"
    "notes":
      "n1": "偷看 (tōukàn) is to look at something secretly, when one should not, such as a letter or a neighbour's window. 偷 (tōu) means secretly, and 看 (kàn) is to look. For a theft, use 偷 (tōu) alone."
    "examples":
      "他偷看了别人的信。":
        "native": "He secretly read someone else's letter."
        "bases":
          "了":
            "meaning": "completed action"
          "的":
            "meaning": "of; 's"
          "信":
            "meaning": "letter"
      "她从门缝里偷看。":
        "native": "She peeked through the crack in the door."
        "bases":
          "从":
            "meaning": "from"
          "门缝":
            "meaning": "crack in a door"
  "zh-4291":
    "native": "to block; to get in the way"
    "notes":
      "n1": "挡 (dǎng) is to block, to stand in the way, or to keep something off: 挡住 (dǎngzhù), to block. Blocking progress in a formal way is 阻挡 (zǔdǎng)."
    "examples":
      "他用手挡住了光。":
        "native": "He blocked the light with his hand."
        "bases":
          "用":
            "meaning": "to use"
          "了":
            "meaning": "completed action"
          "光":
            "meaning": "light"
      "一棵树挡住了路。":
        "native": "A tree blocked the road."
        "bases":
          "一棵":
            "meaning": "a (a tree)"
          "了":
            "meaning": "completed action"
  "zh-4292":
    "native": "to pass through"
    "notes":
      "n1": "穿过 (chuānguò) is to pass through a gap or a space, or to cross from one side to the other: 穿过森林 (chuānguò sēnlín), go through a forest. For walking past a place, use 走过 (zǒuguò)."
    "examples":
      "他们穿过了一片森林。":
        "native": "They went through a forest."
        "bases":
          "了":
            "meaning": "completed action"
          "一片":
            "meaning": "a (a patch of)"
      "一道光穿过了云。":
        "native": "A ray of light broke through the cloud."
        "bases":
          "一道":
            "meaning": "a (a ray of)"
          "光":
            "meaning": "light"
          "了":
            "meaning": "completed action"
  "zh-4293":
    "native": "to go round; to bypass"
    "notes":
      "n1": "绕 (rào) is to go round an obstacle, or to wind round something: 绕路 (ràolù), take a detour. For going through a space, use 穿过 (chuānguò), which is a different path."
    "examples":
      "车子绕过了那个湖。":
        "native": "The car went round that lake."
        "bases":
          "车子":
            "meaning": "car"
          "了":
            "meaning": "completed action"
          "那个":
            "meaning": "that"
      "我们绕路回家。":
        "native": "We took a detour to go home."
  "zh-4294":
    "native": "to surround"
    "notes":
      "n1": "包围 (bāowéi) is to surround someone or something on all sides, such as a crowd or the police: 包围了房子 (bāowéi le fángzi), surrounded the house. It is stronger than 围 (wéi), to encircle."
    "examples":
      "警察包围了那栋房子。":
        "native": "The police surrounded that building."
        "bases":
          "了":
            "meaning": "completed action"
          "那栋":
            "meaning": "that (a building)"
      "人群包围了他。":
        "native": "The crowd surrounded him."
        "bases":
          "了":
            "meaning": "completed action"
  "zh-4295":
    "native": "to support with the hand; to steady"
    "notes":
      "n1": "扶 (fú) is to hold or steady someone or something with the hand, so that they do not fall: 扶老人 (fú lǎorén), help an old person. 帮 (bāng) is help in general, which is a wider word."
    "examples":
      "他扶着老人走过马路。":
        "native": "He helped the old man across the road."
        "bases":
          "着":
            "meaning": "continuing state"
          "老人":
            "meaning": "old person"
      "她扶起了摔倒的孩子。":
        "native": "She helped the fallen child up."
        "bases":
          "起":
            "meaning": "up"
          "了":
            "meaning": "completed action"
          "的":
            "meaning": "of; 's"
  "zh-4296":
    "native": "to lift together; to carry"
    "notes":
      "n1": "抬 (tái) is to lift and carry something heavy, with two or more people: 抬担架 (tái dānjià), carry a stretcher. For raising the head or a hand, the phrases are 抬头 (táitóu) and 抬手 (táishǒu)."
    "examples":
      "两个人抬着担架。":
        "native": "Two people were carrying a stretcher."
        "bases":
          "两个":
            "meaning": "two"
          "着":
            "meaning": "continuing state"
      "他们把病人抬上了车。":
        "native": "They lifted the patient into the car."
        "bases":
          "把":
            "meaning": "marker of an object moved"
          "了":
            "meaning": "completed action"
  "zh-4297":
    "native": "to dig"
    "notes":
      "n1": "挖 (wā) is to dig a hole, or to dig something out of the ground. 挖洞 (wā dòng) is to dig a hole. The same verb covers digging up a stone or a root."
    "examples":
      "工人在路边挖坑。":
        "native": "The workers are digging a hole by the road."
        "bases":
          "路边":
            "meaning": "roadside"
          "坑":
            "meaning": "hole"
      "他用手挖出了一块石头。":
        "native": "He dug a stone out with his hand."
        "bases":
          "用":
            "meaning": "to use"
          "了":
            "meaning": "completed action"
          "一块":
            "meaning": "a (a piece of)"
  "zh-4298":
    "native": "to plant; to grow"
    "notes":
      "n1": "种 (zhòng) is to plant seeds or trees, and to grow crops. As a noun, 种 (zhǒng) is a kind, with another reading: 一种 (yì zhǒng), one kind. The verb and the noun are written the same way."
    "examples":
      "农民在田里种了玉米。":
        "native": "The farmer planted corn in the field."
        "bases":
          "田":
            "meaning": "field"
          "了":
            "meaning": "completed action"
          "玉米":
            "meaning": "corn"
      "我们在院子里种花。":
        "native": "We grow flowers in the yard."
  "zh-4299":
    "native": "to move (heavy things); to carry"
    "notes":
      "n1": "搬 (bān) is to move something heavy or bulky from one place to another. 搬家 (bānjiā) is to move house. For carrying something light, use 拿 (ná) or 带 (dài)."
    "examples":
      "我们搬了很多箱子。":
        "native": "We carried many boxes."
        "bases":
          "了":
            "meaning": "completed action"
          "很多":
            "meaning": "many"
      "他们搬进了新房子。":
        "native": "They moved into a new house."
        "bases":
          "了":
            "meaning": "completed action"
  "zh-4300":
    "native": "to repair; to fix"
    "notes":
      "n1": "修 (xiū) is to repair or fix something that is broken: 修车 (xiū chē), repair a car. 修理 (xiūlǐ) is the fuller word. 修 (xiū) also means to study a course, as in 修课 (xiū kè), but that is a different use."
    "examples":
      "工人正在修路。":
        "native": "The workers are repairing the road."
        "bases":
          "正在":
            "meaning": "in the middle of"
      "电工修好了灯。":
        "native": "The electrician fixed the light."
        "bases":
          "电工":
            "meaning": "electrician"
          "了":
            "meaning": "completed action"
  "zh-4301":
    "native": "to take apart; to pull down; to open"
    "notes":
      "n1": "拆 (chāi) is to take something apart, to pull down a building, or to open a letter or a parcel: 拆信 (chāi xìn), open a letter. It is the opposite of 装 (zhuāng), to assemble or to pack."
    "examples":
      "他拆开了那封信。":
        "native": "He opened that letter."
        "bases":
          "了":
            "meaning": "completed action"
          "那封":
            "meaning": "that (a letter)"
          "信":
            "meaning": "letter"
      "工人把旧房子拆了。":
        "native": "The workers pulled down the old house."
        "bases":
          "把":
            "meaning": "marker of an object moved"
          "了":
            "meaning": "completed action"
  "zh-4302":
    "native": "to pack; to install; to pretend"
    "notes":
      "n1": "装 (zhuāng) is to pack things into a container, or to install a fitting. 装满 (zhuāngmǎn) is to fill up. It can also mean to pretend, as in 装病 (zhuāngbìng), to fake an illness."
    "examples":
      "他把东西装进箱子里。":
        "native": "He packed the things into the box."
        "bases":
          "把":
            "meaning": "marker of an object moved"
      "箱子装满了书。":
        "native": "The box was full of books."
        "bases":
          "满":
            "meaning": "full"
          "了":
            "meaning": "completed action"
  "zh-4303":
    "native": "to shake; to sway; to wave"
    "notes":
      "n1": "摇 (yáo) is to shake, to sway or to wave something from side to side: 摇头 (yáotóu), to shake the head; 摇晃 (yáohuàng), to sway. It is not the same as 抖 (dǒu), to tremble quickly."
    "examples":
      "风把树摇得很厉害。":
        "native": "The wind was shaking the tree hard."
        "bases":
          "把":
            "meaning": "marker of an object moved"
          "得":
            "meaning": "complement marker"
          "厉害":
            "meaning": "terrible; strong"
      "船在水里摇。":
        "native": "The boat rocked on the water."
  "zh-4304":
    "native": "to nod"
    "notes":
      "n1": "点头 (diǎntóu) is to nod, to agree or to greet someone with the head. The opposite is 摇头 (yáotóu), to shake the head, which says no without words."
    "examples":
      "老师点头同意了。":
        "native": "The teacher nodded in agreement."
        "bases":
          "了":
            "meaning": "completed action"
      "他没说话，只是点头。":
        "native": "He said nothing, he just nodded."
        "bases":
          "没":
            "meaning": "not; did not"
          "说话":
            "meaning": "to speak"
          "只是":
            "meaning": "only; just"
  "zh-4305":
    "native": "to shake the head"
    "notes":
      "n1": "摇头 (yáotóu) is to shake the head, to say no without words, or to show doubt. The opposite is 点头 (diǎntóu), the nod for yes. Both are common in a story where a person refuses silently."
    "examples":
      "他摇头，说不行。":
        "native": "He shook his head and said no."
        "bases":
          "不行":
            "meaning": "not OK"
      "她听了，只是摇头。":
        "native": "She heard it and only shook her head."
        "bases":
          "了":
            "meaning": "completed action"
          "只是":
            "meaning": "only; just"
