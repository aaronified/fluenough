"cards":
  "zh-4635":
    "native": "University life includes classes, clubs and exams."
    "confusables":
      "w1":
        "why": "学校 (xuéxiào) is any school, from primary school up. 大学 (dàxué) is the university itself, so it is the right word here."
      "w2":
        "why": "学院 (xuéyuàn) is one faculty inside a university, not the whole of university life."
    "bases":
      "生活":
        "meaning": "life"
      "包括":
        "meaning": "include"
      "和":
        "meaning": "and"
  "zh-4636":
    "native": "His supervisor gives him feedback every week."
    "confusables":
      "w1":
        "why": "教授 (jiàoshòu) is a professor, a rank. The sentence needs the person who guides one student's thesis."
      "w2":
        "why": "助教 (zhùjiào) is a teaching assistant who helps with classes and marking, not a thesis supervisor."
    "bases":
      "他":
        "meaning": "he"
      "的":
        "meaning": "particle"
      "每个":
        "meaning": "every"
      "都":
        "meaning": "all"
      "给":
        "meaning": "give"
      "提":
        "meaning": "offer"
  "zh-4637":
    "native": "This course is worth five credits, and the paper must be handed in before the final exams."
    "confusables":
      "w1":
        "why": "作业 (zuòyè) is homework set in class, not a thesis."
      "w2":
        "why": "考试 (kǎoshì) is an exam, the test itself, not a written paper handed in."
    "bases":
      "这门课":
        "meaning": "this course"
      "有":
        "meaning": "has"
      "要":
        "meaning": "must"
      "交":
        "meaning": "hand in"
  "zh-4638":
    "native": "After the sign-up deadline you can no longer choose courses."
    "confusables":
      "w1":
        "why": "入学 (rùxué) is starting at a school, not signing up for a course."
      "w2":
        "why": "申请 (shēnqǐng) is to apply in general. 报名 (bàomíng) is signing up for a course or an exam."
    "bases":
      "截止":
        "meaning": "deadline"
      "不":
        "meaning": "not"
      "能":
        "meaning": "can"
      "了":
        "meaning": "particle"
  "zh-4639":
    "native": "A scholarship is a reward for students with good grades."
    "confusables":
      "w1":
        "why": "学费 (xuéfèi) is the fee a student pays, the opposite of money given to a student."
      "w2":
        "why": "学分 (xuéfēn) is the credit value of a course, not money."
    "bases":
      "是":
        "meaning": "is"
      "给":
        "meaning": "give"
      "好":
        "meaning": "good"
      "的":
        "meaning": "particle"
      "学生":
        "meaning": "students"
      "奖励":
        "meaning": "reward"
  "zh-4640":
    "native": "He does research in the lab and often gets home very late."
    "confusables":
      "w1":
        "why": "实践 (shíjiàn) is putting ideas into action, a wider word than the research itself."
      "w2":
        "why": "研究 (yánjiū) is research or study in general, and 科研 (kēyán) is scientific research."
    "bases":
      "他":
        "meaning": "he"
      "很":
        "meaning": "very"
      "才":
        "meaning": "only then"
  "zh-4641":
    "native": "Before the midterm exam the classmates all review in the library."
    "confusables":
      "w1":
        "why": "预习 (yùxí) is reading ahead before a class. 复习 (fùxí) is reviewing after it."
      "w2":
        "why": "笔记 (bǐjì) are the notes you write, a thing rather than a way of studying."
    "bases":
      "同学们":
        "meaning": "classmates"
      "都":
        "meaning": "all"
  "zh-4642":
    "native": "My older sister went abroad to study after she graduated from university."
    "confusables":
      "w1":
        "why": "入学 (rùxué) is starting at a school, not leaving with a degree."
      "w2":
        "why": "考研 (kǎoyán) is sitting the entrance exam for postgraduate study, not studying abroad."
    "bases":
      "我":
        "meaning": "I"
      "去":
        "meaning": "go"
      "国外":
        "meaning": "abroad"
      "了":
        "meaning": "particle"
