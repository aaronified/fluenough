"name": "不管 (bùguǎn) ... 都 (dōu): no matter what, always"
"license": "CC-BY-SA-4.0"
"description": "不管 (bùguǎn) names every case, and 都 (dōu) says the result is the same in all of them: 不管你说什么 (bùguǎn nǐ shuō shénme)，我都去 (wǒ dōu qù), whatever you say, I will go. Not yet checked by a Mandarin speaker: please report any mistake."
