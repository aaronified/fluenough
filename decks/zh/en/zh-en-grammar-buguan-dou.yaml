    "zuo": "to do"
    "chi": "to eat"
  "notes": "不管 (bùguǎn) names the cases one by one, and 都 (dōu) says the result is the same in each one: 不管你说什么 (bùguǎn nǐ shuō shénme)，我都去 (wǒ dōu qù), whatever you say, I will go. The question word, such as 什么 (shénme) or 谁 (shéi), gives the open choice. 不管 (bùguǎn) can also use two forms of the same verb: 不管贵不贵 (bùguǎn guì bu guì), whether it is expensive or not."
