"cards":
  "zh-3316":
    "confusables":
      "w1":
        "why": "省长 (shěngzhǎng) is a provincial governor, a different level."
      "w2":
        "why": "官员 (guānyuán) is an official, a wider word."
    "bases":
      "和":
        "meaning": "and"
      "了":
        "meaning": "a particle"
    "native": "The mayor and the minister have both come."
  "zh-3317":
    "confusables":
      "w1":
        "why": "竞选 (jìngxuǎn) is to run for election, before the vote."
      "w2":
        "why": "民众 (mínzhòng) is the public, a wider group."
    "bases":
      "结果":
        "meaning": "result"
      "了":
        "meaning": "a particle"
    "native": "After the voters cast their votes, the result was made public."
  "zh-3318":
    "confusables":
      "w1":
        "why": "法律 (fǎlǜ) is a law, a specific rule."
      "w2":
        "why": "条例 (tiáolì) is a regulation, a smaller rule."
    "bases":
      "要":
        "meaning": "must; to want"
      "遵守":
        "meaning": "to obey"
    "native": "The constitution is important, and everyone must obey it."
  "zh-3319":
    "confusables":
      "w1":
        "why": "居民 (jūmín) is a resident, a person who lives somewhere."
      "w2":
        "why": "人 (rén) is a person, a general word."
    "bases":
      "要":
        "meaning": "must; to want"
    "native": "Every citizen must pay tax."
  "zh-3320":
    "confusables":
      "w1":
        "why": "批准 (pīzhǔn) is to approve, which may come later."
      "w2":
        "why": "议员 (yìyuán) is a council member, one person."
    "bases":
      "了":
        "meaning": "a particle"
      "的":
        "meaning": "of"
    "native": "Congress passed the new regulation."
  "zh-3321":
    "confusables":
      "w1":
        "why": "律师 (lǜshī) is a lawyer, a different role."
      "w2":
        "why": "警察 (jǐngchá) is a police officer, a different job."
    "bases":
      "的":
        "meaning": "of"
    "native": "The judge at the court is very fair."
  "zh-3322":
    "confusables":
      "w1":
        "why": "治理 (zhìlǐ) is to govern or manage, a related word."
      "w2":
        "why": "管理 (guǎnlǐ) is to manage, a close word."
    "bases":
      "要":
        "meaning": "must; to want"
      "环境":
        "meaning": "environment"
    "native": "The government must supervise environmental problems."
  "zh-3323":
    "confusables":
      "w1":
        "why": "执照 (zhízhào) is a licence, a close word."
      "w2":
        "why": "证明 (zhèngmíng) is a certificate, a different paper."
    "native": "This permit is very important."
