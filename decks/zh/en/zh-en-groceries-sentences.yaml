"cards":
  "zh-0862":
    "confusables":
      "w1":
        "why": "A 菜市场 (càishìchǎng) is a market with stalls, not a supermarket."
      "w2":
        "why": "卖 (mài) is to sell, the other way round from buying."
    "bases":
      "和":
        "meaning": "and"
    "native": "I go to the supermarket to buy milk and bread."
  "zh-0863":
    "confusables":
      "w1":
        "why": "盐 (yán) is salt, a different thing from sugar."
      "w2":
        "why": "饼干 (bǐnggān) is a biscuit, not the sugar."
    "bases":
      "请问":
        "meaning": "excuse me; may I ask"
    "native": "Excuse me, where is the sugar?"
  "zh-0864":
    "confusables":
      "w1":
        "why": "免费 (miǎnfèi) is free, with no price at all, not a discount."
      "w2":
        "why": "过期 (guòqī) is past its date, the opposite of a good buy."
    "native": "Is there a discount today?"
  "zh-0865":
    "confusables":
      "w1":
        "why": "保质期 (bǎozhìqī) is the date printed on food, a noun."
      "w2":
        "why": "新鲜 (xīnxiān) is fresh, the opposite of past its date."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "This bottle of milk is past its date."
  "zh-0866":
    "confusables":
      "w1":
        "why": "货架 (huòjià) is a shelf in a shop, not a fridge."
      "w2":
        "why": "冷冻 (lěngdòng) is to freeze, a different job for the fridge."
    "bases":
      "有":
        "meaning": "to have; there is"
      "和":
        "meaning": "and"
    "native": "There is milk and eggs in the fridge."
  "zh-0867":
    "confusables":
      "w1":
        "why": "购物 (gòuwù) is to shop, a verb, not the trolley."
      "w2":
        "why": "包装 (bāozhuāng) is packaging, a noun about the goods."
    "bases":
      "用":
        "meaning": "to use"
    "native": "I use a trolley to buy a lot of things."
  "zh-0868":
    "confusables":
      "w1":
        "why": "糖 (táng) is sugar, a sweet taste, not a sour one."
      "w2":
        "why": "酱油 (jiàngyóu) is soy sauce, a dark liquid."
    "bases":
      "汤":
        "meaning": "soup"
      "和":
        "meaning": "and"
    "native": "Mum adds salt and vinegar to the soup."
  "zh-0869":
    "confusables":
      "w1":
        "why": "牛奶 (niúnǎi) is milk, a different drink."
      "w2":
        "why": "果汁 (guǒzhī) is fruit juice, not coffee."
    "bases":
      "每天":
        "meaning": "every day"
    "native": "Every morning I drink a cup of coffee."
