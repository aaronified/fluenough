"core": "zh-grammar-le-completed-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "了 (le) and 没 (méi) in sentences"
"description": "Sentences that say what was done, and what was not: 了 (le) after the verb and 没 (méi) before it. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0950":
    "confusables":
      "w1":
        "why": "明天 (míngtiān) is tomorrow, which has not happened yet, so no 了 (le)."
      "w2":
        "why": "在 (zài) is at or in a place, not a finished action."
    "bases":
      "了":
        "meaning": "a particle: an action is finished"
    "native": "I bought a book yesterday."
  "zh-0951":
    "confusables":
      "w1":
        "why": "饱 (bǎo) is full, the state after eating, not the eating itself."
      "w2":
        "why": "饿 (è) is hungry, the state before eating."
    "bases":
      "了":
        "meaning": "a particle: an action is finished"
    "native": "He ate two steamed buns."
  "zh-0952":
    "confusables":
      "w1":
        "why": "水 (shuǐ) is water, a different drink."
      "w2":
        "why": "咖啡 (kāfēi) is coffee, not the tea in the question."
    "bases":
      "了":
        "meaning": "a particle: an action is finished"
    "native": "Have you drunk the tea?"
  "zh-0953":
    "confusables":
      "w1":
        "why": "不 (bù) would say that you would not go, a choice, not a fact."
      "w2":
        "why": "学生 (xuésheng) is a student, not a place."
    "bases":
      "没":
        "meaning": "not; did not"
    "native": "I did not go to school."
  "zh-0954":
    "confusables":
      "w1":
        "why": "吃 (chī) is to eat, not to make."
      "w2":
        "why": "买 (mǎi) is to buy, not to make."
    "bases":
      "了":
        "meaning": "a particle: an action is finished"
    "native": "Mum made the meal."
  "zh-0955":
    "confusables":
      "w1":
        "why": "卖 (mài) is to sell, the opposite of buying."
      "w2":
        "why": "看 (kàn) is to read, a different action."
    "bases":
      "没":
        "meaning": "not; did not"
    "native": "He did not buy a book."
  "zh-0956":
    "confusables":
      "w1":
        "why": "去 (qù) is to go, the other way round from coming."
      "w2":
        "why": "走 (zǒu) is to walk away, not to arrive."
    "bases":
      "了":
        "meaning": "a particle: an action is finished"
    "native": "We have come."
  "zh-0957":
    "confusables":
      "w1":
        "why": "看 (kàn) is to read, not to write."
      "w2":
        "why": "做 (zuò) is to do or make, not to write."
    "bases":
      "了":
        "meaning": "a particle: an action is finished"
    "native": "Did you write the characters?"
