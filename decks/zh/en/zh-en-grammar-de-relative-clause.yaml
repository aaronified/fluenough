    "qu": "to go"
    "chi": "to eat"
  "notes": "A clause before 的 (de) describes the noun after it: 我买的书 (wǒ mǎi de shū), the book I bought; 他写的信 (tā xiě de xìn), the letter he wrote. The verb keeps its normal form, and 了 (le) is dropped when the clause describes a noun. In a statement, the noun can be left at the end: 这是我买的书 (zhè shì wǒ mǎi de shū), this is the book I bought. Use 过 (guo) for have done before: 我去过的地方 (wǒ qù guo de dìfang), the places I have been to."
