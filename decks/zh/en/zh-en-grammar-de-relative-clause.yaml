"name": "的 (de) after a clause: the thing that was done"
"license": "CC-BY-SA-4.0"
"description": "A clause before 的 (de) describes the noun that follows it: 我买的书 (wǒ mǎi de shū), the book that I bought. The clause is like a sentence with the noun left out at the end. Not yet checked by a Mandarin speaker: please report any mistake."
