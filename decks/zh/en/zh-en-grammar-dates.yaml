  "notes": "A month is the number and 月 (yuè): 十月 (shí yuè), October. A day of the month is the number and 号 (hào), as spoken: 十号 (shí hào), the tenth; in writing 日 (rì) is used. A day of the week is 星期 (xīngqī) and the number, from one to six: 星期三 (xīngqīsān), Wednesday. Sunday is 星期天 (xīngqītiān), not 星期七 (xīngqīqī). 二 (èr) is the number for a month, so February is 二月 (èr yuè)."
