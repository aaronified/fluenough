"cards":
  "zh-1607":
    "confusables":
      "w1":
        "why": "阴天 (yīntiān) is a cloudy day, not a good one."
      "w2":
        "why": "雷雨 (léiyǔ) is a thunderstorm, the opposite."
    "native": "The weather today is very good."
  "zh-1608":
    "confusables":
      "w1":
        "why": "高温 (gāowēn) is high temperature, the opposite."
      "w2":
        "why": "炎热 (yánrè) is scorching hot, a summer word."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
      "低":
        "meaning": "low"
    "native": "The temperature in winter is very low."
  "zh-1609":
    "confusables":
      "w1":
        "why": "洪水 (hóngshuǐ) is a flood, a different disaster."
      "w2":
        "why": "大风 (dàfēng) is a strong wind, not a typhoon."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "A typhoon has come, so we do not go out."
  "zh-1610":
    "confusables":
      "w1":
        "why": "干燥 (gānzào) is dry, the opposite of damp."
      "w2":
        "why": "凉爽 (liángshuǎng) is cool and fresh, not damp."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "The air in summer is very humid."
  "zh-1611":
    "confusables":
      "w1":
        "why": "冰 (bīng) is ice, which is slippery too."
      "w2":
        "why": "寒冷 (hánlěng) is bitterly cold, a feeling of cold."
    "bases":
      "地上":
        "meaning": "on the ground"
      "滑":
        "meaning": "slippery"
    "native": "After snow the ground is very slippery."
  "zh-1612":
    "confusables":
      "w1":
        "why": "气象 (qìxiàng) is weather conditions, not the forecast."
      "w2":
        "why": "气候 (qìhòu) is climate, the usual weather of a place."
    "bases":
      "每天":
        "meaning": "every day"
    "native": "I look at the weather forecast every day."
  "zh-1613":
    "confusables":
      "w1":
        "why": "暴雨 (bàoyǔ) is a heavy rain, not a long one."
      "w2":
        "why": "小雨 (xiǎoyǔ) is a light rain, which is not this."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "This rain has fallen for three days."
  "zh-1614":
    "confusables":
      "w1":
        "why": "降温 (jiàngwēn) is to get colder, the opposite."
      "w2":
        "why": "低温 (dīwēn) is low temperature, not higher."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
      "比":
        "meaning": "than"
    "native": "This year's temperature is higher than last year's."
