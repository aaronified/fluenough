"name": "Second characters: days, places"
"description": "Ten characters for the week and the places around a town: the star of the week, the week itself, shop, city, park, yard, house, hall and field. Each is a word on its own or the part of a word. Not yet checked by a Mandarin speaker: please report any mistake."
