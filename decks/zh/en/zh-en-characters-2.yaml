"tags":
- "beginner"
- "unreviewed"
- "script"
"cards":
  "zh-1273":
    "native": "star"
    "notes":
      "n1": "A star in the sky. 星 (xīng) is the first part of 星期 (xīngqī), the week, and of 星期天 (xīngqītiān), Sunday."
    "examples":
      "天上有很多星星。":
        "native": "There are many stars in the sky."
        "bases":
          "天上":
            "meaning": "in the sky"
          "有":
            "meaning": "to have; there is"
          "星星":
            "meaning": "stars"
      "星期天我不上班。": "On Sunday I do not go to work."
  "zh-1274":
    "native": "week; round, cycle"
    "notes":
      "n1": "A week, or a round of time. 周末 (zhōumò) is the weekend, and 周 (zhōu) is the week's name in writing."
    "examples":
      "周末我们去公园。": "At the weekend we go to the park."
      "这个周我很忙。": "I am very busy this week."
  "zh-1275":
    "native": "shop"
    "notes":
      "n1": "A shop, a place where things are sold. 商店 (shāngdiàn) is a shop, and 店 (diàn) is the word for the shop itself."
    "examples":
      "书店在二楼。": "The bookshop is on the second floor."
      "面包店很香。": "The bakery smells good."
  "zh-1276":
    "native": "city; town wall"
    "notes":
      "n1": "A city, a walled town. 城市 (chéngshì) is a city, and 城 (chéng) is the older word for a walled town."
    "examples":
      "城里很热闹。":
        "native": "The city is very busy."
        "bases":
          "城里":
            "meaning": "in the city"
      "这个城市很大。": "This city is very big."
  "zh-1277":
    "native": "market; city"
    "notes":
      "n1": "A market, a place where people buy and sell. 市场 (shìchǎng) is a market, and 市 (shì) is also a city."
    "examples":
      "菜市场很热闹。": "The market is very busy."
      "市场上有很多人。":
        "native": "There are many people in the market."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1278":
    "native": "garden; park"
    "notes":
      "n1": "A garden, with plants or trees. 公园 (gōngyuán) is a public park, and 花园 (huāyuán) is a garden."
    "examples":
      "公园很漂亮。": "The park is very pretty."
      "花园里有花。":
        "native": "There are flowers in the garden."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1279":
    "native": "yard; courtyard; institute"
    "notes":
      "n1": "A yard or a building for a purpose, such as a hospital. 医院 (yīyuàn) is a hospital, and 院子 (yuànzi) is a yard."
    "examples":
      "医院很大。": "The hospital is very big."
      "院子里有树。":
        "native": "There is a tree in the yard."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1280":
    "native": "house; room"
    "notes":
      "n1": "A house or a room in a house. 房子 (fángzi) is a house, and 厨房 (chúfáng) is a kitchen."
    "examples":
      "房子很大。": "The house is very big."
      "厨房很干净。": "The kitchen is very clean."
  "zh-1281":
    "native": "hall; building for a service"
    "notes":
      "n1": "A building for a service or a kind of collection. 博物馆 (bówùguǎn) is a museum, and 图书馆 (túshūguǎn) is a library."
    "examples":
      "博物馆很大。": "The museum is very big."
      "图书馆很安静。": "The library is very quiet."
  "zh-1282":
    "native": "place; open ground"
    "notes":
      "n1": "An open place or a field, for an event or a use. 机场 (jīchǎng) is an airport, and 停车场 (tíngchēchǎng) is a car park."
    "examples":
      "机场很远。": "The airport is far."
      "停车场在地下。": "The car park is underground."
