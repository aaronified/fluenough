"cards":
  "zh-1773":
    "confusables":
      "w1":
        "why": "慢 (màn) is slow, the opposite of fast."
      "w2":
        "why": "走 (zǒu) is to walk, not to run."
    "bases":
      "得":
        "meaning": "a particle: links a verb to how well it is done"
    "native": "He runs very fast."
  "zh-1774":
