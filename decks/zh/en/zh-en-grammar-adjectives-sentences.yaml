schema: 1
id: "zh-en-grammar-adjectives-sentences"
kind: "layer"
core: "zh-grammar-adjectives-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing words in sentences"
license: "CC-BY-SA-4.0"
description: "Seven sentences with 很 (hěn), 不 (bù) and 吗 (ma): I am busy, he is not busy, is the room hot? Not yet checked by a Mandarin speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "zh-0637":
    "native": "I am busy."
    "confusables":
      "w1":
        "why": "是 (shì) would say I am, but not before a describing word."
      "w2":
        "why": "也 (yě) would say I am busy too."
  "zh-0638":
    "native": "The room is quiet."
    "confusables":
      "w1":
        "why": "吵 (chǎo) would say noisy, the opposite of quiet."
      "w2":
        "why": "大 (dà) would say big, not quiet."
  "zh-0639":
    "native": "He is not busy."
    "confusables":
      "w1":
        "why": "很 (hěn) would make it a plain statement, with no not: he is busy."
      "w2":
        "why": "我 (wǒ) would say I: I am not busy."
  "zh-0640":
    "native": "Today is hot."
    "confusables":
      "w1":
        "why": "冷 (lěng) would say cold, the opposite of hot."
      "w2":
        "why": "明天 (míngtiān) would say tomorrow: tomorrow is hot."
  "zh-0641":
    "native": "He is well."
    "confusables":
      "w1":
        "why": "你 (nǐ) would say you: you are well."
      "w2":
        "why": "不 (bù) would say not: he is not well."
  "zh-0642":
    "native": "Is the room hot?"
    "confusables":
      "w1":
        "why": "冷 (lěng) would say cold: is the room cold?"
      "w2":
        "why": "安静 (ānjìng) would say quiet: is the room quiet?"
  "zh-0643":
    "native": "Is he busy?"
    "confusables":
      "w1":
        "why": "我 (wǒ) would say I: am I busy?"
      "w2":
        "why": "好 (hǎo) would ask whether he is well."
