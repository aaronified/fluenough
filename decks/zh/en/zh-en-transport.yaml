"schema": 1
"id": "zh-en-transport"
"kind": "layer"
"core": "zh-transport"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Bus, auto, cab"
"description": "Thirty-five words for getting around: the bus, the metro, the train and the plane, the taxi and the bicycle, stations and tickets, the road and the traffic. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0958":
    "native": "bus"
    "notes":
      "n1": "The city bus, which stops at set places. 汽车 (qìchē) is a car, and 公共 (gōnggòng) is public."
    "examples":
      "我每天坐公共汽车去学校。":
        "native": "I take the bus to school every day."
        "bases":
          "每天":
            "meaning": "every day"
      "公共汽车很慢。": "The bus is very slow."
  "zh-0959":
    "native": "metro; underground railway"
    "notes":
      "n1": "The metro, which runs under the city. 铁 (tiě) is iron, the metal of the rails."
    "examples":
      "地铁很快。": "The metro is fast."
      "我坐地铁去上班。": "I take the metro to work."
  "zh-0960":
    "native": "train"
    "notes":
      "n1": "A train on the railway. 火 (huǒ) is fire, and 车 (chē) is a vehicle."
    "examples":
      "火车七点出发。": "The train leaves at seven."
      "他坐火车去学校。": "He takes the train to school."
  "zh-0961":
    "native": "plane; aeroplane"
    "notes":
      "n1": "An aeroplane. 飞 (fēi) is to fly."
    "examples":
      "我坐飞机去美国。": "I fly to America."
      "飞机很快。": "The plane is fast."
  "zh-0962":
    "native": "taxi"
    "notes":
      "n1": "A taxi, which you hail on the street. 租 (zū) is to rent."
    "examples":
      "出租车很贵。": "Taxis are expensive."
      "请去机场。": "Please take me to the airport."
  "zh-0963":
    "native": "bicycle"
    "notes":
      "n1": "A bicycle. 自 (zì) is self, and 行 (xíng) is to move, so it moves by itself."
    "examples":
      "我骑自行车去学校。": "I cycle to school."
      "自行车很旧。": "The bicycle is old."
  "zh-0964":
    "native": "car"
    "notes":
      "n1": "A car, with an engine and four wheels. 车 (chē) is the general word for a vehicle."
    "examples":
      "汽车很贵。": "Cars are expensive."
      "我开汽车去上班。": "I drive a car to work."
  "zh-0965":
    "native": "motorbike"
    "notes":
      "n1": "A motorbike, with an engine and two wheels."
    "examples":
      "他骑摩托车。": "He rides a motorbike."
      "摩托车很快。": "Motorbikes are fast."
  "zh-0966":
    "native": "boat; ship"
    "notes":
      "n1": "A boat or a ship, on water."
    "examples":
      "我们坐船去日本。": "We take a boat to Japan."
      "船很大。": "The boat is very big."
  "zh-0967":
    "native": "vehicle; car; bus"
    "notes":
      "n1": "The general word for a vehicle. 车 (chē) is in every word for a vehicle, such as 汽车 (qìchē), a car."
    "examples":
      "车很多。": "There are many vehicles."
      "车来了。":
        "native": "The bus has come."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-0968":
    "native": "station; bus stop"
    "notes":
      "n1": "A station, where buses and trains stop. 站 (zhàn) is the stop."
    "examples":
      "车站在学校旁边。": "The station is next to the school."
      "我在车站等车。": "I wait for the bus at the station."
  "zh-0969":
    "native": "metro station"
    "notes":
      "n1": "A station on the metro line."
    "examples":
      "地铁站很近。": "The metro station is near."
      "地铁站在哪里？": "Where is the metro station?"
  "zh-0970":
    "native": "airport"
    "notes":
      "n1": "An airport, where planes take off and land. 场 (chǎng) is a place or open ground."
    "examples":
      "机场很远。": "The airport is far."
      "我去机场接朋友。":
        "native": "I go to the airport to meet a friend."
        "bases":
          "接":
            "meaning": "to meet; to pick up"
  "zh-0971":
    "native": "ticket"
    "notes":
      "n1": "A ticket, for a bus, a train, a film or a show."
    "examples":
      "我买票。": "I buy a ticket."
      "票多少钱？": "How much is the ticket?"
  "zh-0972":
    "native": "transport ticket"
    "notes":
      "n1": "A ticket for a bus or a train. 票 (piào) is any ticket."
    "examples":
      "车票很便宜。": "The ticket is cheap."
      "请给我车票。":
        "native": "Please give me the ticket."
        "bases":
          "给":
            "meaning": "to give; for"
  "zh-0973":
    "native": "fare"
    "notes":
      "n1": "The price of a ride. 费 (fèi) is a fee."
    "examples":
      "车费是五块。":
        "native": "The fare is five yuan."
        "bases":
          "块":
            "meaning": "the measure word for money; a yuan"
      "车费很贵。": "The fare is expensive."
  "zh-0974":
    "native": "road; route"
    "notes":
      "n1": "A road, or a route, a number of a bus. 路 (lù) is also used for a bus line: 三 路 (sān lù), line three."
    "examples":
      "路很长。": "The road is very long."
      "我在路上走。": "I walk along the road."
  "zh-0975":
    "native": "crossroads; junction"
    "notes":
      "n1": "A place where two roads meet, with traffic lights or a sign."
    "examples":
      "路口在学校旁边。": "The crossroads is next to the school."
      "路口很热闹。": "The junction is very busy."
  "zh-0976":
    "native": "traffic lights"
    "notes":
      "n1": "Traffic lights, red for stop and green for go. 红 (hóng) is red, and 绿 (lǜ) is green."
    "examples":
      "红绿灯是红的。":
        "native": "The traffic light is red."
        "bases":
          "红":
            "meaning": "red"
          "的":
            "meaning": "a particle: of; belonging to"
      "路口有红绿灯。":
        "native": "There are traffic lights at the crossroads."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-0977":
    "native": "petrol station"
    "notes":
      "n1": "A petrol station, where cars fill up with fuel."
    "examples":
      "加油站在前面。": "The petrol station is in front."
      "汽车去加油站加油。": "The car goes to the petrol station to fill up."
  "zh-0978":
    "native": "to park"
    "notes":
      "n1": "To park a vehicle, or to stop it. 停 (tíng) is to stop."
    "examples":
      "这儿不能停车。":
        "native": "You cannot park here."
        "bases":
          "能":
            "meaning": "can; may"
      "我在学校停车。": "I park at the school."
  "zh-0979":
    "native": "to be stuck in traffic"
    "notes":
      "n1": "A traffic jam, or to be stuck in one. 堵 (dǔ) is to block."
    "examples":
      "今天堵车了。":
        "native": "There is a traffic jam today."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "我每天都堵车。":
        "native": "I am stuck in traffic every day."
        "bases":
          "每天":
            "meaning": "every day"
  "zh-0980":
    "native": "to drive"
    "notes":
      "n1": "To drive a car. 开 (kāi) is to drive or to open."
    "examples":
      "他开车去上班。": "He drives to work."
      "我不会开车。":
        "native": "I cannot drive."
        "bases":
          "会":
            "meaning": "can; to know how to"
  "zh-0981":
    "native": "to ride (a bike or a horse)"
    "notes":
      "n1": "To ride a bicycle, motorbike or horse."
    "examples":
      "妈妈骑车去学校。": "Mum rides a bike to school."
      "他每天骑摩托车。":
        "native": "He rides a motorbike every day."
        "bases":
          "每天":
            "meaning": "every day"
  "zh-0982":
    "native": "to get off (a bus or a train)"
    "notes":
      "n1": "To get off a bus or train. Its opposite is 上车 (shàngchē), to get on."
    "examples":
      "我在车站下车。": "I get off at the station."
      "请下车。": "Please get off."
  "zh-0983":
    "native": "to get on (a bus or a train)"
    "notes":
      "n1": "To get on a bus or train. Its opposite is 下车 (xiàchē), to get off."
    "examples":
      "请上车。": "Please get on."
      "他上车了。":
        "native": "He has got on."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-0984":
    "native": "map"
    "notes":
      "n1": "A map, of a city or a country. 图 (tú) is a picture."
    "examples":
      "我看地图。": "I look at the map."
      "地图很大。": "The map is very big."
  "zh-0985":
    "native": "luggage"
    "notes":
      "n1": "Luggage, the bags a traveller carries."
    "examples":
      "行李很重。":
        "native": "The luggage is heavy."
        "bases":
          "重":
            "meaning": "heavy"
      "我的行李在车上。":
        "native": "My luggage is on the bus."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-0986":
    "native": "passport"
    "notes":
      "n1": "A passport, for travel between countries. 照 (zhào) is a photo."
    "examples":
      "请看护照。": "Please show the passport."
      "我的护照很重要。":
        "native": "My passport is very important."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-0987":
    "native": "timetable"
    "notes":
      "n1": "A timetable, the list of times for buses or trains. 表 (biǎo) is a table or a list."
    "examples":
      "请看时刻表。": "Please look at the timetable."
      "时刻表上有火车。":
        "native": "The timetable lists the trains."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-0988":
    "native": "platform"
    "notes":
      "n1": "The platform at a station, where you wait for a train."
    "examples":
      "火车在几号站台？": "Which platform is the train at?"
      "站台很长。": "The platform is very long."
  "zh-0989":
    "native": "to take (a bus, a train or a plane)"
    "notes":
      "n1": "To ride or travel by a vehicle, a more formal word than 坐 (zuò)."
    "examples":
      "我乘坐地铁。": "I take the metro."
      "乘坐飞机很快。": "Taking a plane is fast."
  "zh-0990":
    "native": "pier; dock"
    "notes":
      "n1": "A pier, where boats tie up. 头 (tóu) is the end or head."
    "examples":
      "船在码头上。": "The boat is at the pier."
      "码头很热闹。": "The pier is busy."
  "zh-0991":
    "native": "high-speed rail"
    "notes":
      "n1": "High-speed rail, the fast trains between cities. 高 (gāo) is high."
    "examples":
      "高铁很快。": "High-speed rail is fast."
      "高铁很贵。": "High-speed rail is expensive."
  "zh-0992":
    "native": "flight"
    "notes":
      "n1": "A flight, a plane on a set route at a set time."
    "examples":
      "航班晚了。":
        "native": "The flight is late."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "这个航班很便宜。": "This flight is cheap."
