schema: 1
id: "zh-en-phrasebook"
kind: "layer"
core: "zh-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Eighteen phrases to say whole from the first day, before their words are taught: greetings and thanks, sorry and excuse me, asking for slower speech, prices, the toilet, and help."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "zh-0001":
    native: "hello"
    alt_native: ["hi"]
    notes:
      "n1": "Said to anyone when you meet. 你 (nǐ) is 'you', 好 (hǎo) is 'good'."
  "zh-0002":
    native: "hello (polite)"
    alt_native: ["hello (respectful)"]
    notes:
      "n1": "您 (nín) is the respectful 'you'. Use it with elders, teachers and people you do not know."
  "zh-0003":
    native: "goodbye"
    alt_native: ["bye"]
    notes:
      "n1": "Literally 'see again'. 见 (jiàn) is 'to see'."
  "zh-0004":
    native: "thank you"
    alt_native: ["thanks"]
    notes:
      "n1": "Said often in daily life. Between close friends and family it is often left out."
  "zh-0005":
    native: "thank you very much"
    notes:
      "n1": "非常 (fēicháng) is 'very, extremely'. 感谢 (gǎnxiè) is a more formal 'thank'."
  "zh-0006":
    native: "you're welcome"
    notes:
      "n1": "Literally 'no need to be polite'. 客气 (kèqi) is 'polite, courteous'."
  "zh-0007":
    native: "sorry"
    alt_native: ["I'm sorry"]
    notes:
      "n1": "Used for a small mistake or an inconvenience. 对不起 (duìbuqǐ) is the everyday apology."
  "zh-0008":
    native: "it's all right; never mind"
    notes:
      "n1": "Answers 对不起 (duìbuqǐ). 关系 (guānxi) is 'relation, matter'."
  "zh-0009":
    native: "excuse me (to ask a question)"
    alt_native: ["may I ask"]
    notes:
      "n1": "Said before asking a stranger something. 问 (wèn) is 'to ask'."
  "zh-0010":
    native: "excuse me, let me through"
    notes:
      "n1": "Said in a crowd or on a bus. 过 (guo) here means 'pass'."
  "zh-0011":
    native: "I don't understand."
    alt_native: ["I can't understand"]
    notes:
      "n1": "听 (tīng) is 'to listen' and 懂 (dǒng) is 'to understand'. 不 (bù) comes before the verb. The 不 is neutral in tone in 听不懂 (tīng bu dǒng)."
  "zh-0012":
    native: "Please say that again."
    notes:
      "n1": "再 (zài) is 'again'. 遍 (biàn) is the measure word for each time something is done."
  "zh-0013":
    native: "Please speak a little more slowly."
    notes:
      "n1": "慢 (màn) is 'slow'. 一点 (yìdiǎn) is 'a little'."
  "zh-0014":
    native: "How much is it?"
    notes:
      "n1": "多少 (duōshao) asks 'how much' for a price. 钱 (qián) is money."
  "zh-0015":
    native: "Where is the toilet?"
    notes:
      "n1": "Signs say 厕所 (cèsuǒ). Speakers also say 卫生间 (wèishēngjiān)."
  "zh-0016":
    native: "I'm lost."
    notes:
      "n1": "迷路 (mílù) is 'to lose one's way'. 了 (le) marks the change: I am now lost."
  "zh-0017":
    native: "Help!"
    notes:
      "n1": "What you shout in danger. 救 (jiù) is 'to save', 命 (mìng) is 'life'."
  "zh-0018":
    native: "My name is ……"
    notes:
      "n1": "Put your name in place of the dots. 叫 (jiào) is 'to be called'."
