"cards":
  "zh-1504":
    "confusables":
      "w1":
        "why": "裤子 (kùzi) is trousers, not a shirt."
      "w2":
        "why": "裙子 (qúnzi) is a skirt, a different garment."
    "bases":
      "要":
        "meaning": "must; to want"
    "native": "I want to buy a shirt."
  "zh-1505":
    "confusables":
      "w1":
        "why": "大衣 (dàyī) is an overcoat, a long heavy coat."
      "w2":
        "why": "毛衣 (máoyī) is a sweater, worn under a coat."
    "native": "This coat is expensive."
  "zh-1506":
    "confusables":
      "w1":
        "why": "蓝色 (lánsè) is blue, not red."
      "w2":
        "why": "绿色 (lǜsè) is green, not red."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "The red skirt is very pretty."
  "zh-1507":
    "confusables":
      "w1":
        "why": "袜子 (wàzi) is socks, worn with shoes, not the shoes."
      "w2":
        "why": "手套 (shǒutào) is gloves, for the hands."
    "native": "Do these shoes fit?"
  "zh-1508":
    "confusables":
      "w1":
        "why": "手套 (shǒutào) is gloves, a different item."
      "w2":
        "why": "领带 (lǐngdài) is a tie, worn with a shirt."
    "bases":
      "和":
        "meaning": "and"
      "好看":
        "meaning": "good-looking; nice to see"
    "native": "The hat and the scarf are both very nice."
  "zh-1509":
    "confusables":
      "w1":
        "why": "尺码 (chǐmǎ) is the size of clothes, a noun."
      "w2":
        "why": "颜色 (yánsè) is the colour, not the size."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "What size clothes do you wear?"
  "zh-1510":
    "confusables":
      "w1":
        "why": "合适 (héshì) is fitting, the result of the fitting."
      "w2":
        "why": "质量 (zhìliàng) is quality, which you judge after."
    "native": "Buy it after you have tried it on."
  "zh-1511":
    "confusables":
      "w1":
        "why": "灰色 (huīsè) is grey, a different colour."
      "w2":
        "why": "白色 (báisè) is white, a different colour."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "He wears a black suit."
