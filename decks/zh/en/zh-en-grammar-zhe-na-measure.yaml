  "notes": "这 (zhè), 那 (nà) and 哪 (nǎ) come first, then the measure word of the noun, then the noun: 这本书 (zhè běn shū), this book; 那件衣服 (nà jiàn yīfu), that shirt; 哪双鞋 (nǎ shuāng xié), which shoes. For a respected person, 位 (wèi) is the polite measure word: 这位老师 (zhè wèi lǎoshī), this teacher. Where no other measure word fits, 个 (ge) is used, as in 这个人 (zhè ge rén), this person."
