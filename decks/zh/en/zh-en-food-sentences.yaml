"cards":
  "zh-0936":
    "confusables":
      "w1":
        "why": "饭馆 (fànguǎn) is a restaurant, where you do not cook."
      "w2":
        "why": "菜单 (càidān) is a menu, not a kitchen."
    "native": "Mum is cooking dinner in the kitchen."
  "zh-0937":
    "confusables":
      "w1":
        "why": "账单 (zhàngdān) is the bill, which comes at the end."
      "w2":
        "why": "座位 (zuòwèi) is a seat, not an order."
    "native": "The waiter asks us to order."
  "zh-0938":
    "confusables":
      "w1":
        "why": "甜 (tián) is sweet, the other taste."
      "w2":
        "why": "辣 (là) is spicy, not salty."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "This dish is too salty."
  "zh-0939":
    "confusables":
      "w1":
        "why": "啤酒 (píjiǔ) is beer, an alcoholic drink, which the sentence refuses."
      "w2":
        "why": "果汁 (guǒzhī) is fruit juice, a drink that would fit."
    "native": "I do not drink alcohol; I only drink soft drinks."
  "zh-0940":
    "confusables":
      "w1":
        "why": "馒头 (mántou) is steamed bread, which has no filling."
      "w2":
        "why": "油条 (yóutiáo) is a fried dough stick, not steamed."
    "bases":
      "和":
        "meaning": "and"
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "The dumplings and the steamed buns are both hot."
  "zh-0941":
    "confusables":
      "w1":
        "why": "午饭 (wǔfàn) is lunch, not breakfast."
      "w2":
        "why": "晚饭 (wǎnfàn) is dinner, not breakfast."
    "bases":
      "和":
        "meaning": "and"
    "native": "For breakfast I drink soy milk and eat a fried dough stick."
  "zh-0942":
    "confusables":
      "w1":
        "why": "盘子 (pánzi) is a plate, flat, and not for congee."
      "w2":
        "why": "勺子 (sháozi) is a spoon, a tool and not a dish."
    "bases":
      "要":
        "meaning": "to want; to need"
    "native": "I would like a bowl of congee."
  "zh-0943":
    "confusables":
      "w1":
        "why": "刀 (dāo) is a knife, not for eating rice."
      "w2":
        "why": "叉子 (chāzi) is a fork, the other way to eat."
    "bases":
      "用":
        "meaning": "to use"
    "native": "Please eat with chopsticks."
