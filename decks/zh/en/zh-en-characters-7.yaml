"tags":
- "beginner"
- "unreviewed"
- "script"
"cards":
  "zh-4852":
    "native": "passing through; to manage (as a character)"
    "notes":
      "n1": "Passing through, and so managing. 经济 (jīngjì) is the economy, and 经理 (jīnglǐ) is a manager."
    "examples":
      "经济很重要。": "The economy is very important."
      "他是经理。": "He is a manager."
  "zh-4853":
    "native": "society; a club (as a character)"
    "notes":
      "n1": "A group of people together. 社会 (shèhuì) is society, and 社区 (shèqū) is a neighbourhood."
    "examples":
      "社会在发展。": "Society is developing."
      "社区很大。": "The neighbourhood is very big."
  "zh-4854":
    "native": "meeting; society (as a character)"
    "notes":
      "n1": "A gathering of people. 会议 (huìyì) is a meeting, and 开会 (kāihuì) is to hold a meeting."
    "examples":
      "会议很重要。": "The meeting is very important."
      "我们现在开会。": "We are having a meeting now."
  "zh-4855":
    "native": "to change into; -ization (as a character)"
    "notes":
      "n1": "To turn into something else. 文化 (wénhuà) is culture, and 化 (huà) is the second character."
    "examples":
      "文化在发展。": "Culture is developing."
      "中国文化很重要。": "Chinese culture is very important."
  "zh-4856":
    "native": "ring; surroundings (as a character)"
    "notes":
      "n1": "A ring, and so what surrounds us. 环境 (huánjìng) is the environment, and 环保 (huánbǎo) is environmental protection."
    "examples":
      "环保很重要。": "Protecting the environment is very important."
      "城市的环境很好。":
        "native": "The city's environment is very good."
        "bases":
          "的":
            "meaning": "a particle: of; the thing belonging to"
  "zh-4857":
    "native": "border; condition (as a character)"
    "notes":
      "n1": "A border, and so the surroundings. 环境 (huánjìng) is the environment, and 境 (jìng) is its second character."
    "examples":
      "环境很好。": "The environment is very good."
      "保护环境。": "Protect the environment."
  "zh-4858":
    "native": "to protect (as a character)"
    "notes":
      "n1": "To keep safe. 保护 (bǎohù) is to protect, and 环保 (huánbǎo) is environmental protection."
    "examples":
      "我们都保护环境。": "We all protect the environment."
      "大家都需要环保。": "Everyone needs environmental protection."
  "zh-4859":
    "native": "to guard (as a character)"
    "notes":
      "n1": "To guard. 保护 (bǎohù) is to protect, and 护照 (hùzhào) is a passport."
    "examples":
      "我们保护空气。": "We protect the air."
      "他有护照。":
        "native": "He has a passport."
        "bases":
          "有":
            "meaning": "to have"
  "zh-4860":
    "native": "to spread out; to open out (as a character)"
    "notes":
      "n1": "To spread out. 发展 (fāzhǎn) is to develop, and 展 (zhǎn) is its second character."
    "examples":
      "城市在发展。": "The city is developing."
      "经济发展很好。": "The economy is developing very well."
  "zh-4861":
    "native": "to decide; to settle (as a character)"
    "notes":
      "n1": "To settle. 解决 (jiějué) is to solve, and 决 (jué) is its second character."
    "examples":
      "我们都想解决问题。": "We all want to solve the problem."
      "问题解决了。":
        "native": "The problem has been solved."
        "bases":
          "了":
            "meaning": "a particle: the action is finished"
