native:
  code: en
  iso639_3: eng
  name: English
name: "Culture: festivals, folk songs and prose"
description: "Eighteen festival poems, folk songs and short prose pieces in the public domain. Each shows who wrote it and where it comes from. The text is shown in simplified characters, with the traditional form beside it. Not yet checked by a Chinese speaker: please report any mistake."
license: CC-BY-SA-4.0
tags:
- unreviewed
cards:
  zh-6150:
    native: "Amid the sound of firecrackers one year ends, and the spring breeze brings warmth and the tusu wine."
    notes:
      n1: "A poem for the Spring Festival, by Wang Anshi. 屠苏 (tú sū) is a wine drunk at New Year, and 送暖 (sòng nuǎn) means to bring warmth."
    bases:
      "声中":
        meaning: "amid the sound of"
      "一岁":
        meaning: "one year"
      "除":
        meaning: "to end, to clear away"
      "送暖":
        meaning: "to bring warmth"
      "屠苏":
        meaning: "tusu, a wine drunk at New Year"
  zh-6151:
    native: "In the Qingming season the rain falls in fine sheets, and the travellers on the road feel heartbroken."
    notes:
      n1: "A poem for the Qingming festival, when families visit the graves of their ancestors. 断魂 (duàn hún) means heartbroken. 纷纷 (fēn fēn) means falling thickly. 欲 (yù) means about to, want to."
    bases:
      "清明":
        meaning: "Qingming, the festival of clear skies"
      "时节":
        meaning: "season, time of year"
      "纷纷":
        meaning: "falling thickly"
      "路上":
        meaning: "on the road"
      "行人":
        meaning: "a traveller"
      "欲":
        meaning: "about to, want to"
      "断魂":
        meaning: "heartbroken"
  zh-6152:
    native: "The autumn light on the silver candle makes the painted screen look cold, and with a light silk fan she brushes at the fireflies."
    notes:
      n1: "A poem about the Qixi festival, the night of the Cowherd and the Weaver Girl. The Wikisource title is disputed, and the page also appears as the autumn night poem. 扑 (pū) means to brush at, and 流萤 (liú yíng) means fireflies. 轻罗 (qīng luó) means light silk."
    bases:
      "银烛":
        meaning: "a silver candle"
      "秋光":
        meaning: "autumn light"
      "画屏":
        meaning: "a painted screen"
      "轻罗":
        meaning: "light silk"
      "小扇":
        meaning: "a small fan"
      "扑":
        meaning: "to brush at, to beat"
      "流萤":
        meaning: "fireflies"
  zh-6153:
    native: "When the golden autumn wind and the jade dew meet, their meeting outdoes all the countless meetings of the human world."
    notes:
      n1: "A ci poem for the Qixi festival, by Qin Guan. 金风 (jīn fēng) is the golden autumn wind, and 玉露 (yù lù) is jade dew. 相逢 (xiāng féng) means to meet."
    bases:
      "金风":
        meaning: "the golden autumn wind"
      "玉露":
        meaning: "jade dew"
      "相逢":
        meaning: "to meet"
      "便":
        meaning: "then, so"
      "胜却":
        meaning: "to surpass"
      "人间":
        meaning: "the human world"
      "无数":
        meaning: "countless"
  zh-6154:
    native: "In the courtyard the ground is white and the crows roost in the trees, and the cold dew, silent, wets the osmanthus flowers."
    notes:
      n1: "A poem for the Mid-Autumn Festival, written to a friend. 中庭 (zhōng tíng) means the courtyard, and 栖鸦 (qī yā) means roosting crows."
    bases:
      "中庭":
        meaning: "the courtyard"
      "地白":
        meaning: "the ground is white"
      "栖鸦":
        meaning: "crows roosting"
      "冷露":
        meaning: "cold dew"
      "无声":
        meaning: "silent"
      "桂花":
        meaning: "osmanthus flowers"
  zh-6155:
    native: "I wish that people may live long and share the beautiful moon, even when they are a thousand miles apart."
    notes:
      n1: "A ci poem for the Mid-Autumn Festival, by Su Shi. 婵娟 (chán juān) means the beautiful moon."
    bases:
      "但愿":
        meaning: "to hope, to wish"
      "人长久":
        meaning: "people live long"
      "千里":
        meaning: "a thousand miles"
      "共":
        meaning: "together, to share"
      "婵娟":
        meaning: "the beautiful moon"
  zh-6156:
    native: "Alone in a strange land I am a stranger, and at each festival I miss my family all the more."
    notes:
      n1: "A poem for the Double Ninth festival, by Wang Wei, written when he was young. 佳节 (jiā jié) means a festive day, and 思亲 (sī qīn) means to miss one's family. 每逢 (měi féng) means whenever one meets."
    bases:
      "独":
        meaning: "alone"
      "异乡":
        meaning: "a strange land"
      "为":
        meaning: "to be, to make"
      "异客":
        meaning: "a stranger"
      "每逢":
        meaning: "whenever one meets"
      "佳节":
        meaning: "a festive day"
      "思亲":
        meaning: "to miss one's family"
  zh-6157:
    native: "I searched for her among the crowd a thousand times, and then suddenly, turning my head, there she was, where the lights grow dim."
    notes:
      n1: "A ci poem for the Lantern Festival, by Xin Qiji. 灯火 (dēng huǒ) means lamps and lights, and 阑珊处 (lán shān chù) means where the lights are dim. 蓦然 (mò rán) means suddenly."
    bases:
      "众里":
        meaning: "in the crowd"
      "寻":
        meaning: "to search for"
      "千百度":
        meaning: "a thousand times"
      "蓦然":
        meaning: "suddenly"
      "回首":
        meaning: "to turn one's head"
      "那人":
        meaning: "that person"
      "却在":
        meaning: "still there"
      "灯火":
        meaning: "lamps and lights"
      "阑珊处":
        meaning: "the place where the lights are dim"
  zh-6158:
    native: "Waiting and waiting, the east wind has come, and the footsteps of spring are near."
    notes:
      n1: "A modern prose poem by Zhu Ziqing, first printed in 1933. 盼望着 (pàn wàng zhe) means waiting and hoping."
    bases:
      "盼望着":
        meaning: "waiting and hoping"
      "东风":
        meaning: "the east wind"
      "来了":
        meaning: "has come"
      "的":
        meaning: "a possessive word"
      "脚步":
        meaning: "footsteps"
      "近了":
        meaning: "is near"
  zh-6159:
    native: "Cold comes and heat goes; autumn brings the harvest and winter the storing."
    notes:
      n1: "A line from the Thousand Character Classic, a primer in four-character lines used to teach children characters since the sixth century. 寒来 (hán lái) means cold comes."
    bases:
      "寒来":
        meaning: "cold comes"
      "暑往":
        meaning: "heat goes"
      "秋收":
        meaning: "autumn harvest"
      "冬藏":
        meaning: "winter storage"
  zh-6160:
    native: "I alone love the lotus, which comes out of the mud without being stained, and which is clear in its ripples without being showy."
    notes:
      n1: "An essay on the lotus by Zhou Dunyi. 爱莲 (ài lián) means to love the lotus, and 淤泥 (yū ní) is mud. 予 (yǔ) means I. 濯 (zhuó) means to wash. 清涟 (qīng lián) means clear ripples. 不妖 (bù yāo) means not showy."
    bases:
      "予":
        meaning: "I"
      "独":
        meaning: "alone"
      "爱莲":
        meaning: "to love the lotus"
      "之":
        meaning: "of, belonging to"
      "淤泥":
        meaning: "mud"
      "而":
        meaning: "and, then (a connecting word)"
      "不染":
        meaning: "not stained"
      "濯":
        meaning: "to wash"
      "清涟":
        meaning: "clear ripples"
      "不妖":
        meaning: "not showy"
  zh-6161:
    native: "A mountain need not be high to be famous if an immortal lives there, and water need not be deep to be sacred if a dragon lives there."
    notes:
      n1: "An inscription by Liu Yuxi on his humble room. 仙 (xiān) is an immortal, and 龙 (lóng) is a dragon."
    bases:
      "不在":
        meaning: "does not depend on"
      "有":
        meaning: "there is, to have"
      "仙":
        meaning: "an immortal"
      "则":
        meaning: "then, so"
      "名":
        meaning: "famous"
      "深":
        meaning: "deep"
      "龙":
        meaning: "a dragon"
      "灵":
        meaning: "sacred, spirit"
  zh-6162:
    native: "Be the first to worry about the world's troubles, and the last to enjoy its pleasures."
    notes:
      n1: "From the Record of Yueyang Tower by Fan Zhongyan, dated 1046. 忧 (yōu) means to worry, and 乐 (lè) means to enjoy."
    bases:
      "天下":
        meaning: "the world"
      "之":
        meaning: "of, belonging to"
      "忧":
        meaning: "to worry"
      "而":
        meaning: "and, then (a connecting word)"
      "乐":
        meaning: "to enjoy"
  zh-6163:
    native: "The sky is blue and endless, the plain is wide and endless, and when the wind bends the grass the cattle and sheep appear."
    notes:
      n1: "An anonymous folk song of the northern dynasties. 天苍苍 (tiān cāng cāng) means the sky is blue and endless. 野茫茫 (yě máng máng) means the plain is wide and endless."
    bases:
      "天苍苍":
        meaning: "the sky is blue and endless"
      "野茫茫":
        meaning: "the plain is wide and endless"
      "吹":
        meaning: "to blow"
      "草低":
        meaning: "the grass bends low"
      "牛羊":
        meaning: "cattle and sheep"
  zh-6164:
    native: "In the south one can pick lotus, and the lotus leaves are full and green."
    notes:
      n1: "An anonymous Han yuefu folk song. 江南 (Jiāng nán) means the south of the Yangtze, and 采莲 (cǎi lián) means to pick lotus. 何 (hé) means how."
    bases:
      "江南":
        meaning: "the south of the Yangtze"
      "可":
        meaning: "can, may"
      "采莲":
        meaning: "to pick lotus"
      "莲叶":
        meaning: "lotus leaves"
      "何":
        meaning: "how"
      "田田":
        meaning: "full and green"
  zh-6165:
    native: "Clack, clack goes the loom, and Mulan weaves at the door."
    notes:
      n1: "An anonymous ballad of the northern dynasties about a girl who went to war in her father's place. 木兰 (Mù lán) is Mulan, and 当户 (dāng hù) means at the door. 唧唧 (jī jī) means the sound of a loom."
    bases:
      "唧唧":
        meaning: "the sound of a loom"
      "复":
        meaning: "again"
      "木兰":
        meaning: "Mulan"
      "当户":
        meaning: "at the door"
      "织":
        meaning: "to weave"
  zh-6166:
    native: "The pleasure of hills and streams lies in the heart, and it is put into the wine."
    notes:
      n1: "An essay by Ouyang Xiu, a Song writer. 山水 (shān shuǐ) means hills and streams, and 寓 (yù) means to put or express."
    bases:
      "山水":
        meaning: "hills and streams"
      "之":
        meaning: "of, belonging to"
      "乐":
        meaning: "to enjoy"
      "得之":
        meaning: "gain from it"
      "而":
        meaning: "and, then (a connecting word)"
      "寓":
        meaning: "to put, to express"
  zh-6167:
    native: "In the Taiyuan years of the Jin dynasty, a man of Wuling made his living by fishing."
    notes:
      n1: "A prose tale by Tao Yuanming about a fisherman who finds a hidden valley. 晋 (Jìn) is the Jin dynasty, and 武陵人 (Wǔ líng rén) is a man of Wuling."
    bases:
      "晋":
        meaning: "the Jin dynasty"
      "太元":
        meaning: "the Taiyuan era"
      "武陵人":
        meaning: "a man of Wuling"
      "捕鱼":
        meaning: "to fish"
      "为业":
        meaning: "to make one's living"
