"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Shopping in sentences"
"description": "Sentences about buying: the discount, paying by card, asking for a receipt, trying on and returning. Not yet checked by a Mandarin speaker: please report any mistake."
