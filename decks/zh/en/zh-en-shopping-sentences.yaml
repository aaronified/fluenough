"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1759":
    "confusables":
      "w1":
        "why": "优惠 (yōuhuì) is a special offer, a general word."
      "w2":
        "why": "打折 (dǎzhé) is to give a discount, a verb."
    "bases":
      "打":
        "meaning": "to give (a discount)"
    "native": "This shirt is twenty percent off."
  "zh-1760":
    "confusables":
      "w1":
        "why": "现金 (xiànjīn) is cash, not a card."
      "w2":
        "why": "找零 (zhǎolíng) is giving change, after paying."
    "bases":
      "要":
        "meaning": "must; to want"
      "用":
        "meaning": "to use"
    "native": "I want to pay by credit card."
  "zh-1761":
    "confusables":
      "w1":
        "why": "发票 (fāpiào) is an invoice, a formal document."
      "w2":
        "why": "账单 (zhàngdān) is a bill for a meal, not a receipt."
    "bases":
      "给":
        "meaning": "to give; for"
    "native": "Please give me a receipt."
  "zh-1762":
    "confusables":
      "w1":
        "why": "名牌 (míngpái) is a famous brand, a close word."
      "w2":
        "why": "商场 (shāngchǎng) is a shopping mall, a place."
    "native": "This brand is famous."
  "zh-1763":
    "confusables":
      "w1":
        "why": "柜台 (guìtái) is a counter, where you pay."
      "w2":
        "why": "收银员 (shōuyínyuán) is a cashier, a person."
    "native": "The fitting room is over there."
  "zh-1764":
    "confusables":
      "w1":
        "why": "换货 (huànhuò) is to exchange, a different choice."
      "w2":
        "why": "保修 (bǎoxiū) is a warranty, not a return."
    "bases":
      "要":
        "meaning": "must; to want"
    "native": "These shoes do not fit, so I want to return them."
  "zh-1765":
    "confusables":
      "w1":
        "why": "合计 (héjì) is the sum, a close word."
      "w2":
        "why": "总价 (zǒngjià) is the total price, a close word."
    "bases":
      "块":
        "meaning": "the measure word for money; a yuan"
    "native": "That is one hundred yuan in total."
  "zh-1766":
    "confusables":
      "w1":
        "why": "促销 (cùxiāo) is to promote, a verb."
      "w2":
        "why": "特价 (tèjià) is a special price, one item."
    "bases":
      "有":
        "meaning": "to have; there is"
    "native": "There is a big sale today."
