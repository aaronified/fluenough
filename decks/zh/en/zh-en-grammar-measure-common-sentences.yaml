"name": "The common measure words in sentences"
"description": "Sentences with the common measure words: these two books, a cup of tea, a pair of shoes, this polite teacher, two people in the office, a bottle of water, two jin of rice, and two children. Not yet checked by a Mandarin speaker: please report any mistake."
