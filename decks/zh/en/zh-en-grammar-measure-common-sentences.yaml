"cards":
  "zh-0814":
    "native": "These two books are good."
    "confusables":
      "w1":
        "why": "个 (gè) is the general measure word, so it would not count books."
      "w2":
        "why": "杯 (bēi) counts cups, so it would not count books."
  "zh-0815":
    "native": "I want to drink a cup of tea."
    "confusables":
      "w1":
        "why": "瓶 (píng) is a bottle, so it would say a bottle of tea."
      "w2":
        "why": "双 (shuāng) counts pairs, so it would not fit tea."
  "zh-0816":
    "native": "I buy a pair of shoes."
    "confusables":
      "w1":
        "why": "件 (jiàn) counts pieces, such as clothes, not a pair of shoes."
      "w2":
        "why": "本 (běn) counts books, so it would not fit shoes."
  "zh-0817":
    "native": "This teacher is good."
    "confusables":
      "w1":
        "why": "个 (gè) is the general measure word, so it would not show respect."
      "w2":
        "why": "人 (rén) is 'person', the plain word, without the polite measure 位 (wèi)."
  "zh-0818":
    "native": "Two people are in the office."
    "confusables":
      "w1":
        "why": "位 (wèi) is the polite measure for a person, so it would not be plain."
      "w2":
        "why": "本 (běn) counts books, not people."
  "zh-0819":
    "native": "How much is a bottle of water?"
    "confusables":
      "w1":
        "why": "杯 (bēi) counts cups, so it would say a cup of water."
      "w2":
        "why": "件 (jiàn) counts pieces, so it would not fit a bottle of water."
  "zh-0820":
    "native": "I buy two jin of rice."
    "confusables":
      "w1":
        "why": "公斤 (gōngjīn) is a kilogram, a different weight from the jin."
      "w2":
        "why": "个 (gè) counts single items, not a weight."
  "zh-0821":
    "native": "He has two children."
    "confusables":
      "w1":
        "why": "位 (wèi) is polite and for adults, so it would not fit children."
      "w2":
        "why": "双 (shuāng) counts pairs, so it would say a pair of children."
    "bases":
      "有": { "meaning": "to have" }
