  "name": "English"
"name": "除非 (chúfēi) ... 否则 (fǒuzé): unless, otherwise"
"license": "CC-BY-SA-4.0"
"description": "除非 (chúfēi) names the only condition that would change the result: 除非你同意 (chúfēi nǐ tóngyì)，否则我不去 (fǒuzé wǒ bú qù), unless you agree, I will not go. Not yet checked by a Mandarin speaker: please report any mistake."
"tags":
- "unreviewed"
"pattern":
  "name": "除非 (chúfēi) ... 否则 (fǒuzé): unless, otherwise"
  "slot_name": "form"
  "prompt": "{lemma} ({gloss}), {slot}"
  "slots":
    "plain": "a plain statement of the plan"
    "unless": "除非 (chúfēi) before the only condition, then 否则 (fǒuzé) or 才 (cái) before the result"
    "unless-not": "除非 (chúfēi) with a negated condition, then 才 (cái) before the result"
  "entries":
    "tongyi": "to agree"
    "bangmang": "to help"
    "chifan": "to eat a meal"
  "notes": "除非 (chúfēi) names the one thing needed, and 否则 (fǒuzé) says what happens if it is not met: 除非你同意 (chúfēi nǐ tóngyì)，否则我不去 (fǒuzé wǒ bú qù), unless you agree I will not go. 才 (cái) can replace 否则 (fǒuzé) when the result depends on the condition: 除非你不同意 (chúfēi nǐ bù tóngyì)，我才去 (wǒ cái qù), I will go only if you do not agree. Use 除非 (chúfēi) only for a single necessary condition."
