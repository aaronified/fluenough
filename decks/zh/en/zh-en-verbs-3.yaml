  "zh-2406":
    "native": "to encourage"
    "notes":
      "n1": "To give someone hope and courage to go on. 鼓 (gǔ) is a drum, and 励 (lì) is to encourage."
    "examples":
      "爸爸鼓励我。": "Dad encourages me."
      "老师鼓励我们学习。": "The teacher encourages us to study."
  "zh-2407":
    "native": "to approve; to support"
    "notes":
      "n1": "To agree with and support a plan. 赞 (zàn) is to praise, and 成 (chéng) is to achieve."
    "examples":
      "我赞成这个计划。": "I support this plan."
      "大家都赞成。": "Everyone agrees."
  "zh-2408":
    "native": "to support"
    "notes":
      "n1": "To help someone and stand by them. 支 (zhī) is to support, and 持 (chí) is to hold."
    "examples":
      "我支持你。": "I support you."
      "家人支持我的工作。":
        "native": "My family supports my work."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2409":
    "native": "to believe; to trust"
    "notes":
      "n1": "To believe that something is true, or to trust someone. 相 (xiāng) is mutual, and 信 (xìn) is trust."
    "examples":
      "我相信你。": "I believe you."
      "我不相信这件事。":
        "native": "I do not believe this."
        "bases":
          "事":
