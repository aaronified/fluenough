  "zh-2410":
    "native": "to doubt; to suspect"
    "notes":
      "n1": "To doubt that something is true, or to suspect someone. 怀 (huái) is to hold in mind, and 疑 (yí) is doubt."
    "examples":
      "我怀疑他说的话。":
        "native": "I doubt what he says."
        "bases":
