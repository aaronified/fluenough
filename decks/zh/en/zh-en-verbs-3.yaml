"cards":
  "zh-2358":
    "native": "to see; to catch sight of"
    "notes":
      "n1": "To catch sight of something with the eyes. 看 (kàn) is to look, and 见 (jiàn) is to meet or see."
    "examples":
      "我看见他了。":
        "native": "I saw him."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "你看见我的包了吗？":
        "native": "Did you see my bag?"
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2359":
    "native": "to hear"
    "notes":
      "n1": "To hear a sound without trying. 听 (tīng) is to listen, and 见 (jiàn) is to perceive."
    "examples":
      "我听见了声音。":
        "native": "I heard the sound."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "你听见了吗？":
        "native": "Did you hear it?"
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2360":
    "native": "to remember; to recall"
    "notes":
      "n1": "To bring something back to mind. 想 (xiǎng) is to think, and 起 (qǐ) is up."
    "examples":
      "我想起了他的名字。":
        "native": "I remembered his name."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "的":
            "meaning": "a particle: of; belonging to"
      "我想起一件事。":
        "native": "I remembered something."
        "bases":
          "事":
            "meaning": "matter; affair"
  "zh-2361":
    "native": "to forget"
    "notes":
      "n1": "To lose a thing from memory. 忘 (wàng) is to forget, and 记 (jì) is to remember."
    "examples":
      "我忘记了带钥匙。":
        "native": "I forgot to bring the keys."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "别忘记我的生日。":
        "native": "Do not forget my birthday."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2362":
    "native": "to remember firmly; to memorise"
    "notes":
      "n1": "To remember firmly, and keep in mind. 住 (zhù) is firm or fixed."
    "examples":
      "请记住这个字。": "Please remember this character."
      "我记住了他的电话。":
        "native": "I have memorised his phone number."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2363":
    "native": "to understand (the meaning)"
    "notes":
      "n1": "To understand the reason or the meaning of something. 理 (lǐ) is reason, and 解 (jiě) is to explain."
    "examples":
      "我理解你的意思。":
        "native": "I understand what you mean."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "意思":
            "meaning": "meaning"
      "他很难理解这个问题。": "He finds this problem hard to understand."
  "zh-2364":
    "native": "to explain"
    "notes":
      "n1": "To make a thing clear by saying what it means. 解 (jiě) is to undo, and 释 (shì) is to explain."
    "examples":
      "老师解释了这个词。":
        "native": "The teacher explained this word."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "词":
            "meaning": "word"
      "请解释一下。":
        "native": "Please explain."
        "bases":
          "一下":
            "meaning": "a little; have a try"
  "zh-2365":
    "native": "to introduce"
    "notes":
      "n1": "To tell someone about a person or a thing. 介 (jiè) is to be between, and 绍 (shào) is to carry on."
    "examples":
      "让我介绍一下。":
        "native": "Let me introduce him."
        "bases":
          "让":
            "meaning": "to let; to make"
          "一下":
            "meaning": "a little; have a try"
      "他介绍这个饭馆。": "He tells us about this restaurant."
  "zh-2366":
    "native": "to invite"
    "notes":
      "n1": "To ask someone to come to an event or a meal. 邀 (yāo) is to invite."
    "examples":
      "我邀请他来吃饭。": "I invited him to eat."
      "他邀请我参加派对。":
        "native": "He invited me to a party."
        "bases":
          "派对":
            "meaning": "party"
  "zh-2367":
    "native": "to refuse"
    "notes":
      "n1": "To say no to a request or an offer. 拒 (jù) is to refuse, and 绝 (jué) is to cut off."
    "examples":
      "他拒绝了我的邀请。":
        "native": "He refused my invitation."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "的":
            "meaning": "a particle: of; belonging to"
      "她拒绝回答。": "She refused to answer."
  "zh-2368":
    "native": "to agree"
    "notes":
      "n1": "To say yes to a plan or an opinion. 同 (tóng) is the same, and 意 (yì) is opinion."
    "examples":
      "我同意你的意见。":
        "native": "I agree with your opinion."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "意见":
            "meaning": "opinion"
      "老板同意了。":
        "native": "The boss has agreed."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2369":
    "native": "to oppose"
    "notes":
      "n1": "To be against a plan or a view. 反 (fǎn) is against, and 对 (duì) is to face."
    "examples":
      "我反对这个计划。": "I oppose this plan."
      "大家都反对。": "Everyone is against it."
  "zh-2370":
    "native": "to choose"
    "notes":
      "n1": "To pick one thing from several. 选 (xuǎn) is to choose, and 择 (zé) is to pick."
    "examples":
      "你选择哪个？": "Which one do you choose?"
      "这是我的选择。":
        "native": "This is my choice."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2371":
    "native": "to decide"
    "notes":
      "n1": "To make up one's mind about a thing. 决 (jué) is to decide, and 定 (dìng) is to fix."
    "examples":
      "我决定去中国。": "I have decided to go to China."
      "他还没决定。":
        "native": "He has not decided yet."
        "bases":
          "没":
            "meaning": "not; did not"
  "zh-2372":
    "native": "plan; to plan"
    "notes":
      "n1": "A plan, what one intends to do. 计 (jì) is to plan, and 划 (huà) is to plan out."
    "examples":
      "我有一个计划。":
        "native": "I have a plan."
        "bases":
          "有":
            "meaning": "to have; there is"
      "我们计划下个月去旅行。": "We plan to travel next month."
  "zh-2373":
    "native": "to worry"
    "notes":
      "n1": "To feel anxious about something that might happen. 担 (dān) is to bear, and 心 (xīn) is the heart."
    "examples":
      "妈妈很担心。": "Mum is very worried."
      "别担心。": "Do not worry."
  "zh-2374":
    "native": "to be afraid"
    "notes":
      "n1": "To feel fear of something. 害 (hài) is to harm, and 怕 (pà) is to fear."
    "examples":
      "孩子害怕狗。": "The child is afraid of dogs."
      "我不害怕。": "I am not afraid."
  "zh-2375":
    "native": "to be angry"
    "notes":
      "n1": "To be angry with someone. 生 (shēng) is to become, and 气 (qì) is temper."
    "examples":
      "他生气了。":
        "native": "He is angry."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "别生气。": "Do not be angry."
  "zh-2376":
    "native": "to be moved; to touch the heart"
    "notes":
      "n1": "To feel moved by a kindness or a story. 感 (gǎn) is to feel, and 动 (dòng) is to move."
    "examples":
      "这个故事很感动人。":
        "native": "This story is very moving."
        "bases":
          "故事":
            "meaning": "story"
      "我很感动。": "I am very moved."
  "zh-2377":
    "native": "to forgive"
    "notes":
      "n1": "To forgive someone for a mistake. 原 (yuán) is to excuse, and 谅 (liàng) is to forgive."
    "examples":
      "请原谅我。": "Please forgive me."
      "他原谅了我。":
        "native": "He has forgiven me."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2378":
    "native": "to protect"
    "notes":
      "n1": "To keep something safe from harm. 保 (bǎo) is to keep, and 护 (hù) is to protect."
    "examples":
      "我们要保护环境。":
        "native": "We must protect the environment."
        "bases":
          "要":
            "meaning": "must; to want"
          "环境":
            "meaning": "environment"
      "警察保护我们。": "The police protect us."
  "zh-2379":
    "native": "to discover; to find out"
    "notes":
      "n1": "To find something that was not known before. 发 (fā) is to show, and 现 (xiàn) is to appear."
    "examples":
      "我发现了一个问题。":
        "native": "I found a problem."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "他发现了钥匙。":
        "native": "He found the keys."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2380":
    "native": "to observe"
    "notes":
      "n1": "To watch closely and carefully. 观 (guān) is to watch, and 察 (chá) is to examine."
    "examples":
      "科学家观察鸟。":
        "native": "The scientist observes birds."
        "bases":
          "科学家":
            "meaning": "scientist"
      "请仔细观察。":
        "native": "Please observe carefully."
        "bases":
          "仔细":
            "meaning": "careful; detailed"
  "zh-2381":
    "native": "to research; to study closely"
    "notes":
      "n1": "To study a subject in depth to find out more. 研 (yán) is to examine, and 究 (jiū) is to look into."
    "examples":
      "他研究历史。":
        "native": "He researches history."
        "bases":
          "历史":
            "meaning": "history"
      "这个问题需要研究。": "This problem needs research."
  "zh-2382":
    "native": "to investigate; to survey"
    "notes":
      "n1": "To look into a matter to find out the facts. 调 (diào) is to examine, and 查 (chá) is to check."
    "examples":
      "警察在调查。": "The police are investigating."
      "我们做了一个调查。":
        "native": "We carried out a survey."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2383":
    "native": "to revise; to amend"
    "notes":
      "n1": "To change a text or plan to make it better. 修 (xiū) is to mend, and 改 (gǎi) is to change."
    "examples":
      "请修改这个句子。":
        "native": "Please revise this sentence."
        "bases":
          "句子":
            "meaning": "sentence"
      "计划修改了。":
        "native": "The plan has been revised."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2384":
    "native": "to raise; to improve"
    "notes":
      "n1": "To raise a level or a standard. 提 (tí) is to lift, and 高 (gāo) is high."
    "examples":
      "我要提高水平。":
        "native": "I want to raise my level."
        "bases":
          "要":
            "meaning": "must; to want"
          "水平":
            "meaning": "level"
      "成绩提高了。":
        "native": "The results have improved."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2385":
    "native": "to reduce"
    "notes":
      "n1": "To make smaller in number or amount. 减 (jiǎn) is to reduce, and 少 (shǎo) is few."
    "examples":
      "我要减少花钱。":
        "native": "I want to spend less money."
        "bases":
          "要":
            "meaning": "must; to want"
      "垃圾减少了。":
        "native": "The rubbish has been reduced."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2386":
    "native": "to increase"
    "notes":
      "n1": "To make larger in number or amount. 增 (zēng) is to grow, and 加 (jiā) is to add."
    "examples":
      "人越来越多，增加了。":
        "native": "The number of people has increased."
        "bases":
          "越来越":
            "meaning": "more and more"
          "了":
            "meaning": "a particle: a change has happened"
      "我们要增加练习。":
        "native": "We must increase our practice."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-2387":
    "native": "to change"
    "notes":
      "n1": "To make something different from before. 改 (gǎi) is to change, and 变 (biàn) is to alter."
    "examples":
      "天气改变了。":
        "native": "The weather has changed."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "我改变了主意。":
        "native": "I changed my mind."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "主意":
            "meaning": "idea; decision"
  "zh-2388":
    "native": "to develop; to grow"
    "notes":
      "n1": "To grow or to become more advanced. 发 (fā) is to send out, and 展 (zhǎn) is to spread out."
    "examples":
      "城市发展很快。": "The city is developing fast."
      "经济在发展。":
        "native": "The economy is growing."
        "bases":
          "经济":
            "meaning": "economy"
  "zh-2389":
    "native": "to stop"
    "notes":
      "n1": "To come to an end, or to make something end. 停 (tíng) is to stop, and 止 (zhǐ) is to halt."
    "examples":
      "雨停止了。":
        "native": "The rain has stopped."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "请停止说话。":
        "native": "Please stop talking."
        "bases":
          "说话":
            "meaning": "to speak; to talk"
  "zh-2390":
    "native": "to arrive; to reach"
    "notes":
      "n1": "To arrive at a place, a formal word. 到 (dào) is to arrive, and 达 (dá) is to reach."
    "examples":
      "火车到达了北京。":
        "native": "The train has reached Beijing."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "北京":
            "meaning": "Beijing"
      "我明天到达。": "I arrive tomorrow."
  "zh-2391":
    "native": "to leave"
    "notes":
      "n1": "To go away from a place. 离 (lí) is to leave, and 开 (kāi) is to go away."
    "examples":
      "他离开了学校。":
        "native": "He has left the school."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "请不要离开。":
        "native": "Please do not leave."
        "bases":
          "不要":
            "meaning": "do not"
  "zh-2392":
    "native": "to pass through; to pass (a test)"
    "notes":
      "n1": "To pass through a place, or to pass a test or a vote. 通 (tōng) is through, and 过 (guò) is to pass."
    "examples":
      "我通过了考试。":
        "native": "I passed the exam."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "我们通过公园回家。": "We go home through the park."
  "zh-2393":
    "native": "to pass by; to go through"
    "notes":
      "n1": "To pass a place on the way, or to go through an experience. 经 (jīng) is to pass through."
    "examples":
      "我经过学校。": "I passed the school."
      "这件事经过了很久。":
        "native": "This matter went on for a long time."
        "bases":
          "事":
            "meaning": "matter; affair"
          "了":
            "meaning": "a particle: a change has happened"
          "久":
            "meaning": "long time"
  "zh-2394":
    "native": "to hold (an event)"
    "notes":
      "n1": "To hold a meeting, a ceremony or a game. 举 (jǔ) is to hold up, and 行 (xíng) is to carry out."
    "examples":
      "学校举行了运动会。":
        "native": "The school held a sports day."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "运动会":
            "meaning": "sports meeting"
      "婚礼在下午举行。":
        "native": "The wedding is held in the afternoon."
        "bases":
          "婚礼":
            "meaning": "wedding"
  "zh-2395":
    "native": "to fail"
    "notes":
      "n1": "To not succeed in what you try to do. 失 (shī) is to lose, and 败 (bài) is to defeat."
    "examples":
      "我失败了。":
        "native": "I have failed."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "失败没关系。": "Failure does not matter."
  "zh-2396":
    "native": "to try; to attempt"
    "notes":
      "n1": "To try something new, to see if it works. 尝 (cháng) is to taste or try, and 试 (shì) is to test."
    "examples":
      "我尝试了一次。":
        "native": "I tried it once."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "他尝试做饭。": "He tries to cook."
  "zh-2397":
    "native": "to challenge"
    "notes":
      "n1": "To invite someone to a contest, or to test oneself against a difficulty. 挑 (tiāo) is to pick out, and 战 (zhàn) is to fight."
    "examples":
      "他挑战了冠军。":
        "native": "He challenged the champion."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "这是一个很大的挑战。":
        "native": "This is a big challenge."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2398":
    "native": "to solve; to settle"
    "notes":
      "n1": "To find an answer to a problem, and settle it. 解 (jiě) is to untie, and 决 (jué) is to decide."
    "examples":
      "我们解决了问题。":
        "native": "We solved the problem."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "这件事很难解决。":
        "native": "This matter is hard to settle."
        "bases":
          "事":
            "meaning": "matter; affair"
  "zh-2399":
    "native": "to deal with; to handle"
    "notes":
      "n1": "To take action about a matter. 处 (chǔ) is to deal with, and 理 (lǐ) is to manage."
    "examples":
      "请处理这个文件。": "Please deal with this document."
      "他处理事情很快。":
        "native": "He handled the matter quickly."
        "bases":
          "事情":
            "meaning": "matter; thing"
  "zh-2400":
    "native": "to arrange; to plan"
    "notes":
      "n1": "To set things in order for a time or event. 安 (ān) is to settle, and 排 (pái) is to arrange."
    "examples":
      "我安排了时间。":
        "native": "I have arranged the time."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "请安排会议。": "Please arrange the meeting."
  "zh-2401":
    "native": "to contact; to get in touch"
    "notes":
      "n1": "To get in touch with someone. 联 (lián) is to join, and 系 (xì) is to connect."
    "examples":
      "请联系我。": "Please contact me."
      "我和他有联系。":
        "native": "He and I are in touch."
        "bases":
          "和":
            "meaning": "and"
          "有":
            "meaning": "to have; there is"
  "zh-2402":
    "native": "to exchange; to communicate"
    "notes":
      "n1": "To exchange ideas or information with others. 交 (jiāo) is to hand over, and 流 (liú) is to flow."
    "examples":
      "我们交流了想法。":
        "native": "We exchanged ideas."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "想法":
            "meaning": "idea"
      "两国文化交流很多。":
        "native": "The two countries exchange a lot of culture."
        "bases":
          "文化":
            "meaning": "culture"
  "zh-2403":
    "native": "to discuss"
    "notes":
      "n1": "To talk over a matter with others. 讨 (tǎo) is to discuss, and 论 (lùn) is to debate."
    "examples":
      "我们讨论这个计划。": "We discuss this plan."
      "大家讨论了很久。":
        "native": "Everyone discussed it for a long time."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "久":
            "meaning": "long time"
  "zh-2404":
    "native": "to criticise"
    "notes":
      "n1": "To say what is wrong with someone's work or behaviour. 批 (pī) is to criticise, and 评 (píng) is to judge."
    "examples":
      "老师批评了他。":
        "native": "The teacher criticised him."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "不要随便批评别人。":
        "native": "Do not criticise others lightly."
        "bases":
          "不要":
            "meaning": "do not"
          "随便":
            "meaning": "casually; carelessly"
  "zh-2405":
    "native": "to praise"
    "notes":
      "n1": "To say that someone has done well. 表 (biǎo) is to show, and 扬 (yáng) is to praise."
    "examples":
      "老师表扬了我。":
        "native": "The teacher praised me."
        "bases":
          "了":
