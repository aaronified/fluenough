      "她担任经理。": "She is the manager."
  "zh-2413":
    "native": "to remind"
    "notes":
      "n1": "To tell someone something so that they do not forget. 提 (tí) is to raise or bring up, and 醒 (xǐng) is to wake."
    "examples":
