"schema": 1
"id": "zh-en-directions"
"kind": "layer"
"core": "zh-directions"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Directions"
"description": "Thirty words for finding the way: left and right, north, south, east and west, the road, the crossing, the bridge, the floor, and how far. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1007":
    "native": "left"
    "notes":
      "n1": "The left side. Its opposite is 右 (yòu), right. 左边 (zuǒbiān) is on the left."
    "examples":
      "左边是学校。": "The school is on the left."
      "往左拐。":
        "native": "Turn left."
        "bases":
          "往":
            "meaning": "towards"
  "zh-1008":
    "native": "right"
    "notes":
      "n1": "The right side. Its opposite is 左 (zuǒ), left. 右边 (yòubiān) is on the right."
    "examples":
      "右边是我的家。":
        "native": "On the right is my home."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "往右走。":
        "native": "Go right."
        "bases":
          "往":
            "meaning": "towards"
  "zh-1009":
    "native": "front; before"
    "notes":
      "n1": "The front of something, the part you face. 前面 (qiánmiàn) is in front. Its opposite is 后 (hòu), back."
    "examples":
      "前边有饭馆。":
        "native": "There is a restaurant in front."
        "bases":
          "前边":
            "meaning": "in front"
          "有":
            "meaning": "to have; there is"
      "车在前面停了。":
        "native": "The car stopped in front."
        "bases":
          "停":
            "meaning": "to stop"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1010":
    "native": "back; behind"
    "notes":
      "n1": "The back of something, the part away from you. 后边 (hòubian) is behind. Its opposite is 前 (qián), front."
    "examples":
      "后边是厕所。":
        "native": "The toilet is at the back."
        "bases":
          "后边":
            "meaning": "behind"
          "厕所":
            "meaning": "toilet"
      "我在后面走。": "I walk at the back."
  "zh-1011":
    "native": "north"
    "notes":
      "n1": "The north. 北京 (Běijīng) is the capital of China in the north."
    "examples":
      "北边很冷。":
        "native": "The north is very cold."
        "bases":
          "北边":
            "meaning": "north side"
      "火车往北走。":
        "native": "The train goes north."
        "bases":
          "往":
            "meaning": "towards"
  "zh-1012":
    "native": "south"
    "notes":
      "n1": "The south. Its opposite is 北 (běi), north."
    "examples":
      "南边很热。":
        "native": "The south is very hot."
        "bases":
          "南边":
            "meaning": "south side"
      "往南走。":
        "native": "Go south."
        "bases":
          "往":
            "meaning": "towards"
  "zh-1013":
    "native": "east"
    "notes":
      "n1": "The east, where the sun rises. 东西 (dōngxi) is a thing, a word that came to mean things, not east."
    "examples":
      "东边是大海。":
        "native": "The east is the sea."
        "bases":
          "东边":
            "meaning": "east side"
          "大海":
            "meaning": "sea"
      "往东走。":
        "native": "Go east."
        "bases":
          "往":
            "meaning": "towards"
  "zh-1014":
    "native": "opposite; across the way"
    "notes":
      "n1": "The place on the other side of a road or a table."
    "examples":
      "银行在对面。":
        "native": "The bank is across the road."
        "bases":
          "银行":
            "meaning": "bank"
      "对面是公园。":
        "native": "The park is across the way."
        "bases":
          "公园":
            "meaning": "park"
  "zh-1015":
    "native": "nearby; in the neighbourhood"
    "notes":
      "n1": "The area near a place. 近 (jìn) is near."
    "examples":
      "附近有超市吗？":
        "native": "Is there a supermarket nearby?"
        "bases":
          "有":
            "meaning": "to have; there is"
      "学校附近很安静。": "It is quiet near the school."
  "zh-1016":
    "native": "to turn; to go round a corner"
    "notes":
      "n1": "To turn a corner on the way. 拐弯 (guǎiwān) is to turn at a bend."
    "examples":
      "在路口拐。": "Turn at the crossroads."
      "拐了弯就到。":
        "native": "Turn the corner and you will arrive."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "弯":
            "meaning": "a bend; a curve"
          "到":
            "meaning": "to arrive; to reach"
  "zh-1017":
    "native": "to turn; to change direction"
    "notes":
      "n1": "To turn left or right, or change the way you face. 转弯 (zhuǎnwān) is to turn a bend."
    "examples":
      "向左转。":
        "native": "Turn left."
        "bases":
          "向":
            "meaning": "towards"
      "车转了弯。":
        "native": "The car turned the corner."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "弯":
            "meaning": "a bend; a curve"
  "zh-1018":
    "native": "straight"
    "notes":
      "n1": "Straight, not bent. 一直 (yìzhí) is straight on, without turning."
    "examples":
      "路很直。": "The road is very straight."
      "一直走。": "Keep going straight."
  "zh-1019":
    "native": "to cross; to go past"
    "notes":
      "n1": "To cross a road or go past a place. 过马路 (guò mǎlù) is to cross the road."
    "examples":
      "过马路要小心。":
        "native": "Be careful when you cross the road."
        "bases":
          "要":
            "meaning": "to want; to need"
          "小心":
            "meaning": "careful"
      "过了桥就到了。":
        "native": "Once you cross the bridge, you are there."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "到":
            "meaning": "to arrive; to reach"
  "zh-1020":
    "native": "road; street"
    "notes":
      "n1": "A road or a street for cars and people."
    "examples":
      "马路很宽。":
        "native": "The road is very wide."
        "bases":
          "宽":
            "meaning": "wide"
      "马路上有车。":
        "native": "There are cars on the road."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1021":
    "native": "crossroads"
    "notes":
      "n1": "A junction where two roads cross, like a cross. 十字 (shízì) is a cross."
    "examples":
      "十字路口有红绿灯。":
        "native": "There are traffic lights at the crossroads."
        "bases":
          "有":
            "meaning": "to have; there is"
      "在十字路口左转。": "Turn left at the crossroads."
  "zh-1022":
    "native": "bridge"
    "notes":
      "n1": "A bridge over water or a road."
    "examples":
      "过桥以后右转。": "After the bridge, turn right."
      "桥很长。": "The bridge is very long."
  "zh-1023":
    "native": "building; floor"
    "notes":
      "n1": "A building of several floors. 楼上 (lóushàng) is upstairs."
    "examples":
      "这栋楼很高。":
        "native": "This building is very tall."
        "bases":
          "栋":
            "meaning": "the measure word for buildings"
      "我住在三楼。": "I live on the third floor."
  "zh-1024":
    "native": "storey; layer"
    "notes":
      "n1": "A storey, a level of a building. 楼 (lóu) is a building."
    "examples":
      "饭馆在二层。": "The restaurant is on the second floor."
      "这层很安静。": "This floor is quiet."
  "zh-1025":
    "native": "underground"
    "notes":
      "n1": "Under the ground. 地下室 (dìxiàshì) is a basement."
    "examples":
      "地下有地铁。":
        "native": "There is a metro underground."
        "bases":
          "有":
            "meaning": "to have; there is"
      "超市在地下。": "The supermarket is underground."
  "zh-1026":
    "native": "doorway; entrance"
    "notes":
      "n1": "The opening of a door, or the entrance of a building."
    "examples":
      "门口有车。":
        "native": "There is a car at the entrance."
        "bases":
          "有":
            "meaning": "to have; there is"
      "在门口等我。": "Wait for me at the door."
  "zh-1027":
    "native": "from; away from"
    "notes":
      "n1": "How far one place is from another: 离 (lí) is used with the place it is far from."
    "examples":
      "学校离这儿很远。": "The school is far from here."
      "银行离车站很近。":
        "native": "The bank is near the station."
        "bases":
          "银行":
            "meaning": "bank"
  "zh-1028":
    "native": "kilometre"
    "notes":
      "n1": "A kilometre, a distance of a thousand metres. 里 (lǐ) is a unit of distance."
    "examples":
      "两公里远。": "It is two kilometres away."
      "这条路很长，有十公里。":
        "native": "This road is very long, ten kilometres."
        "bases":
          "条":
            "meaning": "the measure word for long things, such as roads"
          "有":
            "meaning": "to have; there is"
  "zh-1029":
    "native": "straight on; all the time"
    "notes":
      "n1": "Straight on, without turning; or all the time, without stopping."
    "examples":
      "一直走就到。":
        "native": "Go straight on and you will arrive."
        "bases":
          "到":
            "meaning": "to arrive; to reach"
      "他一直在学校。": "He has been at school all the time."
  "zh-1030":
    "native": "this side; here"
    "notes":
      "n1": "This side, the side you are on. Its opposite is 那边 (nàbiān), that side."
    "examples":
      "这边是南。": "This side is south."
      "请到这边来。":
        "native": "Please come this way."
        "bases":
          "到":
            "meaning": "to arrive; to reach"
  "zh-1031":
    "native": "that side; over there"
    "notes":
      "n1": "That side, away from you. Its opposite is 这边 (zhèbiān), this side."
    "examples":
      "那边是银行。":
        "native": "The bank is over there."
        "bases":
          "银行":
            "meaning": "bank"
      "学校在那边。": "The school is over there."
  "zh-1032":
    "native": "which side; where"
    "notes":
      "n1": "Which side or which way, a question word."
    "examples":
      "哪边是车站？": "Which side is the station?"
      "您去哪边？": "Which way are you going?"
  "zh-1033":
    "native": "side; edge"
    "notes":
      "n1": "A side or edge, the part near the boundary. 旁边 (pángbiān) is beside."
    "examples":
      "桌子边有椅子。":
        "native": "There is a chair by the table."
        "bases":
          "有":
            "meaning": "to have; there is"
      "河边很凉快。":
        "native": "The riverside is cool."
        "bases":
          "河":
            "meaning": "river"
          "凉快":
            "meaning": "cool and pleasant"
  "zh-1034":
    "native": "route"
    "notes":
      "n1": "The way from one place to another, the route you take."
    "examples":
      "我们的路线很长。":
        "native": "Our route is very long."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "请看路线图。":
        "native": "Please look at the route map."
        "bases":
          "图":
            "meaning": "a picture; a map"
  "zh-1035":
    "native": "direction"
    "notes":
      "n1": "The direction you go in, or the way you face."
    "examples":
      "方向不对。": "The direction is wrong."
      "你走错方向了。":
        "native": "You are going the wrong way."
        "bases":
          "错":
            "meaning": "wrong"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1036":
    "native": "centre"
    "notes":
      "n1": "The middle or centre of a place, such as a city. 中 (zhōng) is middle."
    "examples":
      "市中心很热闹。":
        "native": "The city centre is busy."
        "bases":
          "市中心":
            "meaning": "city centre"
      "学校在城市的中心。":
        "native": "The school is in the centre of the city."
        "bases":
          "城市":
            "meaning": "city"
          "的":
            "meaning": "a particle: of; belonging to"
