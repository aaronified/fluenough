"cards":
  "zh-2328":
    "confusables":
      "w1":
        "why": "好看 (hǎokàn) is nice to look at, a close word."
      "w2":
        "why": "可爱 (kě'ài) is lovely, more a feeling than looks."
    "bases":
      "得":
        "meaning": "a particle after a verb: how it is done"
    "native": "She is very pretty."
  "zh-2329":
    "confusables":
      "w1":
        "why": "身材 (shēncái) is figure, a physical build."
      "w2":
        "why": "体形 (tǐxíng) is body shape, a physical word."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "He has a very good air about him."
  "zh-2330":
    "confusables":
      "w1":
        "why": "黑 (hēi) is black, the opposite of white hair."
      "w2":
        "why": "金 (jīn) is golden, a different colour."
    "bases":
      "老人":
        "meaning": "old person"
      "有":
        "meaning": "to have; there is"
    "native": "The old person has white hair."
  "zh-2331":
    "confusables":
      "w1":
        "why": "朴素 (pǔsù) is plain, the opposite of fashionable."
      "w2":
        "why": "整齐 (zhěngqí) is neat, a different quality."
    "native": "He is very fashionable and dresses very well."
  "zh-2332":
    "confusables":
      "w1":
        "why": "笑容 (xiàoróng) is a smile on the face, a noun."
      "w2":
        "why": "表情 (biǎoqíng) is an expression, a wider word."
    "native": "She often smiles."
  "zh-2333":
    "confusables":
      "w1":
        "why": "体重 (tǐzhòng) is weight, a different measure."
      "w2":
        "why": "身材 (shēncái) is figure, a different word."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "This person's complexion is not good."
  "zh-2334":
    "confusables":
      "w1":
        "why": "眼睛 (yǎnjing) is the eye, a body part."
      "w2":
        "why": "耳朵 (ěrduo) is the ear, a different part."
    "bases":
      "有":
        "meaning": "to have; there is"
      "戴":
        "meaning": "to wear (glasses, a hat)"
    "native": "He is short-sighted and wears glasses."
  "zh-2335":
    "confusables":
      "w1":
        "why": "矮 (ǎi) is short, the opposite."
      "w2":
        "why": "胖 (pàng) is fat, a different build."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
      "比":
        "meaning": "than"
    "native": "He is taller than me."
