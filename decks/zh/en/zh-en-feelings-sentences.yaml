"cards":
  "zh-2945":
    "confusables":
      "w1":
        "why": "高兴 (gāoxìng) is happy, a calmer feeling."
      "w2":
        "why": "紧张 (jǐnzhāng) is nervous, a different feeling."
    "native": "I am very excited, and also thrilled."
  "zh-2946":
    "confusables":
      "w1":
        "why": "伤心 (shāngxīn) is sad, which is stronger."
      "w2":
        "why": "生气 (shēngqì) is angry, a different feeling."
    "native": "I am disappointed, and he is satisfied."
  "zh-2947":
    "confusables":
      "w1":
        "why": "痛苦 (tòngkǔ) is great pain, a stronger word."
      "w2":
        "why": "害怕 (hàipà) is afraid, a different feeling."
    "native": "She feels hard done by and very sad."
  "zh-2948":
    "confusables":
      "w1":
        "why": "嫉妒 (jídù) is jealousy, which is a bad feeling."
      "w2":
        "why": "佩服 (pèifú) is to admire, which is respect."
    "bases":
      "的":
        "meaning": "of"
    "native": "I envy your job."
  "zh-2949":
    "confusables":
      "w1":
        "why": "感谢 (gǎnxiè) is to thank, a spoken act."
      "w2":
        "why": "同情 (tóngqíng) is to sympathise, a different feeling."
    "bases":
      "的":
        "meaning": "of"
    "native": "We are very grateful for the teacher's help."
  "zh-2950":
    "confusables":
      "w1":
        "why": "遗憾 (yíhàn) is a pity, a milder word."
      "w2":
        "why": "放松 (fàngsōng) is to relax, the opposite."
    "native": "I regret it, and I also feel guilty."
  "zh-2951":
    "confusables":
      "w1":
        "why": "孤独 (gūdú) is also lonely, but it is a state of being alone."
      "w2":
        "why": "开心 (kāixīn) is happy, the opposite."
    "native": "He is very lonely on his own."
  "zh-2952":
    "confusables":
      "w1":
        "why": "悲观 (bēiguān) is pessimistic, the opposite."
      "w2":
        "why": "自信 (zìxìn) is confident, a related quality."
    "bases":
      "未来":
        "meaning": "future"
    "native": "He is very optimistic about the future."
