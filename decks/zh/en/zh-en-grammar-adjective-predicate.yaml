  "entries":
    "mang": "busy"
    "anjing": "quiet"
    "re": "hot"
    "hao": "good, well"
  "notes": "A describing word is the verb of its sentence, so 是 (shì) is not put before it: 我是忙 (wǒ shì máng) is wrong; say 我很忙 (wǒ hěn máng), I am busy. To ask a yes-or-no question, add 吗 (ma) at the end: 他忙吗 (tā máng ma), is he busy? and 房间安静吗 (fángjiān ānjìng ma), is the room quiet? 你好吗 (nǐ hǎo ma), how are you?, is the same pattern with 好 (hǎo) in a set phrase."
