name: "A describing word as the verb, with no 是 (shì)"
license: "CC-BY-SA-4.0"
description: "He is busy, is he busy? A describing word is the verb of its sentence, so 是 (shì) does not come before it. Not yet checked by a Mandarin speaker: please report any mistake."
