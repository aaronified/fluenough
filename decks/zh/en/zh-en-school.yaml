"schema": 1
"id": "zh-en-school"
"kind": "layer"
"core": "zh-school"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "School"
"description": "Fifty words for school: the lessons and the subjects, the exams and the grades, the classroom and the blackboard, the dormitory and the canteen, and the words for study, homework and the holidays. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1912":
    "native": "lesson; class"
    "notes":
      "n1": "A lesson, a class at school. 上课 (shàngkè) is to have a lesson, and 下课 (xiàkè) is the end of a lesson."
    "examples":
      "我每天上课。":
        "native": "I have lessons every day."
        "bases":
          "每天":
            "meaning": "every day"
      "这节课很有趣。": "This lesson is very interesting."
  "zh-1913":
    "native": "textbook"
    "notes":
      "n1": "A textbook used in a lesson. 本 (běn) is a book."
    "examples":
      "课本在桌子上。": "The textbook is on the table."
      "我忘了带课本。":
        "native": "I forgot to bring my textbook."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1914":
    "native": "homework"
    "notes":
      "n1": "Homework, work that pupils do at home. 作 (zuò) is to do, and 业 (yè) is work."
    "examples":
      "作业要交给老师。":
        "native": "The homework must be handed in to the teacher."
        "bases":
          "要":
            "meaning": "must; to want"
          "交":
            "meaning": "to hand in"
          "给":
            "meaning": "to give; to"
      "我每天写作业。":
        "native": "I do my homework every day."
        "bases":
          "每天":
            "meaning": "every day"
  "zh-1915":
    "native": "exam; test"
    "notes":
      "n1": "An exam or test, to check what you have learnt. 考 (kǎo) is to examine."
    "examples":
      "明天有考试。":
        "native": "There is an exam tomorrow."
        "bases":
          "有":
            "meaning": "to have; there is"
      "考试很难。": "The exam is very difficult."
  "zh-1916":
    "native": "result; grade; mark"
    "notes":
      "n1": "A school result or mark, how well a pupil has done. 成 (chéng) is to achieve, and 绩 (jì) is a result."
    "examples":
      "他的成绩很好。":
        "native": "His results are very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "成绩单在这里。":
        "native": "The report card is here."
        "bases":
          "单":
            "meaning": "list; single"
          "这里":
            "meaning": "here"
  "zh-1917":
    "native": "to pass (an exam)"
    "notes":
      "n1": "To pass an exam, to reach the pass mark. 及 (jí) is to reach, and 格 (gé) is a standard."
    "examples":
      "我考试及格了。":
        "native": "I passed the exam."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "他没及格。":
        "native": "He did not pass."
        "bases":
          "没":
            "meaning": "not; did not"
  "zh-1918":
    "native": "composition; essay"
    "notes":
      "n1": "A composition, a piece of writing by a pupil. 文 (wén) is writing."
    "examples":
      "作文写得很好。":
        "native": "The composition is very well written."
        "bases":
          "得":
            "meaning": "a particle after a verb: how it is done"
      "老师批作文。":
        "native": "The teacher marks the compositions."
        "bases":
          "批":
            "meaning": "to mark; to comment on"
  "zh-1919":
    "native": "blackboard"
    "notes":
      "n1": "A blackboard, where the teacher writes in a classroom. 板 (bǎn) is a board."
    "examples":
      "黑板上有字。":
        "native": "There are characters on the blackboard."
        "bases":
          "有":
            "meaning": "to have; there is"
      "请看黑板。": "Please look at the blackboard."
  "zh-1920":
    "native": "chalk"
    "notes":
      "n1": "Chalk, for writing on a blackboard. 粉 (fěn) is powder, and 笔 (bǐ) is a pen."
    "examples":
      "粉笔用完了。":
        "native": "The chalk has run out."
        "bases":
          "用":
            "meaning": "to use"
          "完":
            "meaning": "finished"
          "了":
            "meaning": "a particle: a change has happened"
      "老师拿着粉笔。":
        "native": "The teacher is holding the chalk."
        "bases":
          "着":
            "meaning": "a particle: an action goes on"
  "zh-1921":
    "native": "lectern; platform in a classroom"
    "notes":
      "n1": "The raised platform at the front of a classroom, where the teacher stands. 讲 (jiǎng) is to teach."
    "examples":
      "老师站在讲台上。": "The teacher stands on the platform."
      "讲台很高。": "The platform is very high."
  "zh-1922":
    "native": "dormitory"
    "notes":
      "n1": "A dormitory, where students sleep at school or university."
    "examples":
      "他住在宿舍。": "He lives in the dormitory."
      "宿舍很安静。": "The dormitory is very quiet."
  "zh-1923":
    "native": "canteen; dining hall"
    "notes":
      "n1": "A canteen, where pupils or workers eat. 食 (shí) is food, and 堂 (táng) is a hall."
    "examples":
      "我在食堂吃饭。": "I eat in the canteen."
      "食堂的饭很便宜。":
        "native": "The food in the canteen is cheap."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1924":
    "native": "principal; head teacher"
    "notes":
      "n1": "The head of a school. 校 (xiào) is a school, and 长 (zhǎng) is head."
    "examples":
      "校长说话了。":
        "native": "The principal has spoken."
        "bases":
          "话":
            "meaning": "words; speech"
          "了":
            "meaning": "a particle: a change has happened"
      "校长很忙。": "The principal is very busy."
  "zh-1925":
    "native": "class (group of pupils)"
    "notes":
      "n1": "A class, a group of pupils who learn together. 班级 (bānjí) is a class group."
    "examples":
      "我在一班。": "I am in class one."
      "班里有三十个人。":
        "native": "There are thirty people in the class."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1926":
    "native": "class (group)"
    "notes":
      "n1": "A class, a group of pupils in one year. 级 (jí) is a grade."
    "examples":
      "这个班级很好。": "This class is very good."
      "班级里的同学很友好。":
        "native": "The classmates in the class are very friendly."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "友好":
            "meaning": "friendly"
  "zh-1927":
    "native": "school year; grade"
    "notes":
      "n1": "A school year, the pupils who started in the same year. 年 (nián) is a year."
    "examples":
      "我在二年级。": "I am in year two."
      "年级不同。":
        "native": "The years are different."
        "bases":
          "同":
            "meaning": "the same"
  "zh-1928":
    "native": "course; programme of lessons"
    "notes":
      "n1": "A course of study, the lessons taught in a school. 程 (chéng) is a process."
    "examples":
      "这个课程很难。": "This course is very difficult."
      "课程表在墙上。":
        "native": "The timetable is on the wall."
        "bases":
          "表":
            "meaning": "table; list"
  "zh-1929":
    "native": "mathematics; maths"
    "notes":
      "n1": "Mathematics, the study of numbers and shapes. 数 (shù) is number."
    "examples":
      "数学很难。": "Maths is very difficult."
      "他数学很好。": "He is very good at maths."
  "zh-1930":
    "native": "language (subject); Chinese class"
    "notes":
      "n1": "The language lesson, the study of one's own language. 语 (yǔ) is speech, and 文 (wén) is writing."
    "examples":
      "语文课很有趣。": "The language lesson is very interesting."
      "我喜欢语文。": "I like the language lesson."
  "zh-1931":
    "native": "English (language)"
    "notes":
      "n1": "The English language, or the lesson of it. 英 (yīng) is English, and 语 (yǔ) is language."
    "examples":
      "英语很难。": "English is very difficult."
      "他学英语。": "He is learning English."
  "zh-1932":
    "native": "PE; sport"
    "notes":
      "n1": "Physical education, the lesson of sport and exercise. 体 (tǐ) is the body, and 育 (yù) is training."
    "examples":
      "体育课很好。": "The PE lesson is good."
      "我每周有体育课。":
        "native": "I have PE once a week."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1933":
    "native": "art (subject)"
    "notes":
      "n1": "The art lesson, drawing and painting at school. 美 (měi) is beauty, and 术 (shù) is art or skill."
    "examples":
      "美术课很有趣。": "The art lesson is very fun."
      "我喜欢美术。": "I like art."
  "zh-1934":
    "native": "science"
    "notes":
      "n1": "Science, the study of nature by observation and testing. 科 (kē) is a branch of learning."
    "examples":
      "科学课很难。": "The science lesson is very difficult."
      "他喜欢科学。": "He likes science."
  "zh-1935":
    "native": "to have a lesson"
    "notes":
      "n1": "To attend a lesson or go to class. 上 (shàng) is to go to, and 课 (kè) is a lesson."
    "examples":
      "我们八点上课。": "We have lessons at eight."
      "上课的时候不要说话。":
        "native": "Do not talk during the lesson."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "要":
            "meaning": "must; to want"
          "话":
            "meaning": "words; speech"
  "zh-1936":
    "native": "to finish a lesson"
    "notes":
      "n1": "For a lesson to end. 下 (xià) is down or after, and 课 (kè) is a lesson."
    "examples":
      "十点下课。": "The lesson finishes at ten."
      "下课了！":
        "native": "Class is over!"
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1937":
    "native": "to be on holiday; to break up"
    "notes":
      "n1": "To have a holiday from school or work. 放 (fàng) is to release, and 假 (jià) is a holiday."
    "examples":
      "下个星期放假。": "Next week is the holiday."
      "放假了，我回家。":
        "native": "The holiday has started, so I go home."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1938":
    "native": "to ask for leave"
    "notes":
      "n1": "To ask for permission to be away from school or work. 请 (qǐng) is to ask, and 假 (jià) is leave."
    "examples":
      "我要请假。":
        "native": "I want to ask for leave."
        "bases":
          "要":
            "meaning": "must; to want"
      "他请假了。":
        "native": "He has asked for leave."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1939":
    "native": "to review; to revise"
    "notes":
      "n1": "To go over what has been learnt, to revise. 复 (fù) is to repeat, and 习 (xí) is to practise."
    "examples":
      "考试前复习。": "Revise before the exam."
      "我每天复习。":
        "native": "I revise every day."
        "bases":
          "每天":
            "meaning": "every day"
  "zh-1940":
    "native": "to prepare a lesson in advance"
    "notes":
      "n1": "To look at the next lesson before it is taught. 预 (yù) is in advance."
    "examples":
      "上课前预习。": "Prepare the lesson before class."
      "我预习了新课。":
        "native": "I have prepared the new lesson."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1941":
    "native": "to explain; to teach"
    "notes":
      "n1": "To explain something in words, or to teach a lesson. 讲课 (jiǎngkè) is to teach a lesson."
    "examples":
      "老师讲课。": "The teacher teaches the lesson."
      "老师讲得很清楚。":
        "native": "The teacher explains very clearly."
        "bases":
          "得":
            "meaning": "a particle after a verb: how it is done"
          "清楚":
            "meaning": "clear"
  "zh-1942":
    "native": "class teacher; form tutor"
    "notes":
      "n1": "The teacher in charge of one class, who looks after the pupils. 主任 (zhǔrèn) is a head or director."
    "examples":
      "我的班主任很好。":
        "native": "My class teacher is very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "班主任说明天考试。": "The class teacher says there is an exam tomorrow."
  "zh-1943":
    "native": "to write characters"
    "notes":
      "n1": "To write Chinese characters. 写 (xiě) is to write, and 字 (zì) is a character."
    "examples":
      "孩子在写字。": "The child is writing characters."
      "写字要认真。":
        "native": "Write characters carefully."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-1944":
    "native": "to study; to read a book"
    "notes":
      "n1": "To study, to attend school or read books. 读 (dú) is to read, and 书 (shū) is a book."
    "examples":
      "他在大学读书。": "He studies at university."
      "读书很重要。": "Studying is very important."
  "zh-1945":
    "native": "serious; careful"
    "notes":
      "n1": "Careful and serious about what you do. 认 (rèn) is to recognise, and 真 (zhēn) is true."
    "examples":
      "他学习很认真。": "He studies very carefully."
      "请认真做作业。": "Please do your homework carefully."
  "zh-1946":
    "native": "answer"
    "notes":
      "n1": "An answer to a question or a problem. 答 (dá) is to answer."
    "examples":
      "答案对吗？": "Is the answer right?"
      "请写答案。": "Please write the answer."
  "zh-1947":
    "native": "question; problem"
    "notes":
      "n1": "A question in a test, or a problem. 问 (wèn) is to ask, and 题 (tí) is a topic."
    "examples":
      "这个问题很难。": "This question is very difficult."
      "有问题吗？":
        "native": "Are there any questions?"
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1948":
    "native": "desk"
    "notes":
      "n1": "A desk, for reading and writing at home or school. 书 (shū) is a book."
    "examples":
      "书桌上有书。":
        "native": "There are books on the desk."
        "bases":
          "有":
            "meaning": "to have; there is"
      "我在书桌前写作业。": "I do my homework at the desk."
  "zh-1949":
    "native": "to take an exam; to test"
    "notes":
      "n1": "To take an exam or to test someone. 考试 (kǎoshì) is an exam."
    "examples":
      "我明天考数学。": "I take a maths exam tomorrow."
      "他考得很好。":
        "native": "He did very well in the exam."
        "bases":
          "得":
            "meaning": "a particle after a verb: how it is done"
  "zh-1950":
    "native": "exercise book"
    "notes":
      "n1": "An exercise book, for homework. 本 (běn) is a book."
    "examples":
      "作业本在书包里。": "The exercise book is in the school bag."
      "请买一本作业本。": "Please buy an exercise book."
  "zh-1951":
    "native": "exam paper"
    "notes":
      "n1": "An exam paper, with the questions printed. 卷 (juàn) is a paper or roll."
    "examples":
      "试卷很难。": "The exam paper is very difficult."
      "老师发试卷。":
        "native": "The teacher hands out the exam papers."
        "bases":
          "发":
            "meaning": "to hand out"
  "zh-1952":
    "native": "score; mark"
    "notes":
      "n1": "A score or mark in a test. 分 (fēn) is a point, and 数 (shù) is number."
    "examples":
      "他的分数很高。":
        "native": "His score is very high."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "分数是多少？": "What is the score?"
  "zh-1953":
    "native": "full marks"
    "notes":
      "n1": "Full marks in a test. 满 (mǎn) is full, and 分 (fēn) is a mark."
    "examples":
      "他考了满分。":
        "native": "He got full marks in the test."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "满分很难拿。": "Full marks are hard to get."
  "zh-1954":
    "native": "wrong; mistaken"
    "notes":
      "n1": "Wrong, not correct. Its opposite is 对 (duì), right."
    "examples":
      "这个答案错了。":
        "native": "This answer is wrong."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "他写错了一个字。":
        "native": "He wrote one character wrong."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1955":
    "native": "question; topic"
    "notes":
      "n1": "A question in an exam, or a topic of a talk. 题目 (tímù) is the question."
    "examples":
      "这道题很难。": "This question is very difficult."
      "练习题在书上。": "The practice questions are in the book."
  "zh-1956":
    "native": "term; semester"
    "notes":
      "n1": "A school term, a part of the school year. 期 (qī) is a period."
    "examples":
      "这个学期很忙。": "This term is very busy."
      "下学期我去中国。": "Next term I go to China."
  "zh-1957":
    "native": "winter holiday"
    "notes":
      "n1": "The holiday in winter, between terms. 寒 (hán) is cold."
    "examples":
      "寒假是一月。": "The winter holiday is in January."
      "寒假我回家。": "In the winter holiday I go home."
  "zh-1958":
    "native": "summer holiday"
    "notes":
      "n1": "The holiday in summer, between terms. 暑 (shǔ) is hot weather."
    "examples":
      "暑假很长。": "The summer holiday is very long."
      "暑假我去旅行。": "In the summer holiday I go travelling."
  "zh-1959":
    "native": "to start school"
    "notes":
      "n1": "For school to start again after a holiday. 开 (kāi) is to open, and 学 (xué) is study."
    "examples":
      "下个星期开学。": "School starts next week."
      "开学以后很忙。": "It is very busy after school starts."
  "zh-1960":
    "native": "to graduate"
    "notes":
      "n1": "To finish school or university and get the certificate. 毕 (bì) is to finish, and 业 (yè) is study."
    "examples":
      "他大学毕业了。":
        "native": "He has graduated from university."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "毕业以后我工作。": "After graduating I work."
  "zh-1961":
    "native": "school uniform"
    "notes":
      "n1": "A school uniform, the clothes a pupil wears at school. 服 (fú) is clothing."
    "examples":
      "校服是蓝色的。":
        "native": "The school uniform is blue."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "孩子穿校服去学校。": "The child wears a school uniform to school."
