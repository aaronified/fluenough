"name": "如果 (rúguǒ) ... 就 (jiù): if ... then"
"license": "CC-BY-SA-4.0"
"description": "如果 (rúguǒ) sets a condition, and 就 (jiù) gives the result: 如果下雨 (rúguǒ xiàyǔ)，我就不去 (wǒ jiù bú qù), if it rains, I will not go. Not yet checked by a Mandarin speaker: please report any mistake."
"tags":
- "unreviewed"
"pattern":
  "name": "如果 (rúguǒ) ... 就 (jiù): if ... then"
  "slot_name": "form"
  "prompt": "{lemma} ({gloss}), {slot}"
  "slots":
    "plain": "a plain statement of the plan"
    "if": "如果 (rúguǒ) before the condition, then 就 (jiù) before the result"
    "if-not": "如果 (rúguǒ) with a negated condition, then 就 (jiù) before the result"
  "entries":
    "xiayu": "to rain"
    "youshijian": "to have time"
    "lai": "to come"
    "jige": "to pass (an exam)"
  "notes": "如果 (rúguǒ) starts the condition and 就 (jiù) starts the result: 如果下雨 (rúguǒ xiàyǔ)，我就不去 (wǒ jiù bú qù), if it rains I will not go. The result can be said with 就 (jiù) alone, as in 他来我就走 (tā lái wǒ jiù zǒu), when he comes I leave. To say no, put 不 (bù) in the condition: 如果不下雨 (rúguǒ bú xiàyǔ), if it does not rain. 没有 (méiyǒu) is used for not having something: 如果没有时间 (rúguǒ méiyǒu shíjiān), if there is no time."
