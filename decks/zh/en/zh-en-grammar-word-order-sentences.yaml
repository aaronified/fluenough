schema: 1
id: "zh-en-grammar-word-order-sentences"
kind: "layer"
core: "zh-grammar-word-order-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Word order in sentences"
license: "CC-BY-SA-4.0"
description: "Nine sentences to put in order: when, where and how often come before the verb. Not yet checked by a Mandarin speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "zh-0615":
    "native": "I eat at home at seven."
    "confusables":
      "w1":
        "why": "喝 (hē) would say drink, not eat."
      "w2":
        "why": "做饭 (zuòfàn) would say cook, not eat."
  "zh-0616":
    "native": "He studies at school tomorrow."
    "confusables":
      "w1":
        "why": "昨天 (zuótiān) would say yesterday, not tomorrow."
      "w2":
        "why": "练习 (liànxí) would say practise, not study."
  "zh-0617":
    "native": "We rest at home on Sunday."
    "confusables":
      "w1":
        "why": "周末 (zhōumò) would say the weekend, not Sunday."
      "w2":
        "why": "学校 (xuéxiào) would say school, not home."
  "zh-0618":
    "native": "Mum cooks at home in the afternoon."
    "confusables":
      "w1":
        "why": "上午 (shàngwǔ) would say the morning, not the afternoon."
      "w2":
        "why": "爸爸 (bàba) would say dad, not mum."
  "zh-0619":
    "native": "I get up at eight in the morning."
    "confusables":
      "w1":
        "why": "晚上 (wǎnshang) would say the evening, not the morning."
      "w2":
        "why": "睡觉 (shuìjiào) would say sleep, not get up."
  "zh-0620":
    "native": "Where are you eating tonight?"
    "confusables":
      "w1":
        "why": "明天 (míngtiān) would say tomorrow, not today."
      "w2":
        "why": "谁 (shéi) asks who, not where."
  "zh-0621":
    "native": "They play here at the weekend."
    "confusables":
      "w1":
        "why": "那儿 (nàr) would say there, not here."
      "w2":
        "why": "星期天 (xīngqītiān) would say Sunday, not the weekend."
  "zh-0622":
    "native": "I drink tea too."
    "confusables":
      "w1":
        "why": "都 (dōu) would say all: we all drink tea."
      "w2":
        "why": "不 (bù) would say I do not drink tea."
  "zh-0623":
    "native": "He often reads."
    "confusables":
      "w1":
        "why": "总是 (zǒngshì) would say always, not often."
      "w2":
        "why": "偶尔 (ǒu'ěr) would say sometimes, not often."
