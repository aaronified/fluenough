"cards":
  "zh-2209":
    "confusables":
      "w1":
        "why": "感冒 (gǎnmào) is a cold, a specific illness."
      "w2":
        "why": "发烧 (fāshāo) is a fever, a symptom."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
      "要":
        "meaning": "must; to want"
    "native": "I am ill, so I must go to hospital."
  "zh-2210":
    "confusables":
      "w1":
        "why": "流鼻涕 (liúbítì) is a runny nose, another symptom."
      "w2":
        "why": "打喷嚏 (dǎpēntì) is to sneeze, another symptom."
    "bases":
      "得":
        "meaning": "a particle after a verb: how it is done"
      "厉害":
        "meaning": "awful; severe"
    "native": "He coughs very badly."
  "zh-2211":
    "confusables":
      "w1":
        "why": "饭前 (fànqián) is before meals, the opposite."
      "w2":
        "why": "按时 (ànshí) is on time, a different instruction."
    "native": "Please take the medicine after meals."
  "zh-2212":
    "confusables":
      "w1":
        "why": "血压 (xuèyā) is blood pressure, another measure."
      "w2":
        "why": "温度计 (wēndùjì) is a thermometer, a tool."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "My temperature is high; I have a fever."
  "zh-2213":
    "confusables":
      "w1":
        "why": "骨折 (gǔzhé) is a broken bone, a different injury."
      "w2":
        "why": "受伤 (shòushāng) is to be injured, a general word."
    "bases":
      "把":
        "meaning": "a particle that puts the object before the verb"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "He has scalded his hand."
  "zh-2214":
    "confusables":
      "w1":
        "why": "出院 (chūyuàn) is to leave hospital, the opposite."
      "w2":
        "why": "挂号 (guàhào) is to register at a clinic, earlier."
    "bases":
      "让":
        "meaning": "to let; to make"
    "native": "The doctor has me stay in hospital."
  "zh-2215":
    "confusables":
      "w1":
        "why": "打针 (dǎzhēn) is an injection, another treatment."
      "w2":
        "why": "检查 (jiǎnchá) is to examine, a different act."
    "bases":
      "每天":
        "meaning": "every day"
      "能":
        "meaning": "can; may"
      "停":
        "meaning": "to stop"
    "native": "I take my medicine every day and must not stop."
  "zh-2216":
    "confusables":
      "w1":
        "why": "注意事项 (zhùyìshìxiàng) is the list of precautions, a document."
      "w2":
        "why": "剂量 (jìliàng) is the dose, a different fact."
    "bases":
      "有":
        "meaning": "to have; there is"
    "native": "Does this medicine have side effects?"
