"description": "Rhetorical questions with 不是 (bú shì) ... 吗 (ma), 难道 (nándào), 怎么 (zěnme), 谁 (shéi), 哪里 (nǎlǐ) and 什么 (shénme). Not yet checked by a Mandarin speaker: please report any mistake."
