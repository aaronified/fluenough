"schema": 1
"id": "zh-en-home"
"kind": "layer"
"core": "zh-home"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Home and neighbourhood"
"description": "Forty words for the home: the rooms, the furniture and the appliances, the parts of a building, the garden, the rent and the neighbours, and the jobs of keeping house. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1162":
    "native": "bedroom"
    "notes":
      "n1": "A bedroom, where you sleep. 睡觉 (shuìjiào) is to sleep."
    "examples":
      "卧室在左边。": "The bedroom is on the left."
      "我的卧室很小。":
        "native": "My bedroom is very small."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1163":
    "native": "living room"
    "notes":
      "n1": "A living room, where guests are received. 客 (kè) is a guest."
    "examples":
      "客厅很大。": "The living room is very big."
      "我们在客厅看电视。": "We watch TV in the living room."
  "zh-1164":
    "native": "bathroom"
    "notes":
      "n1": "A bathroom, with a bath or shower. 浴 (yù) is to bathe."
    "examples":
      "浴室很干净。": "The bathroom is very clean."
      "我去浴室洗澡。": "I go to the bathroom to have a bath."
  "zh-1165":
    "native": "toilet"
    "notes":
      "n1": "A toilet, the room with a lavatory. 所 (suǒ) is a place or office."
    "examples":
      "厕所在门旁边。": "The toilet is next to the door."
      "厕所很干净。": "The toilet is very clean."
  "zh-1166":
    "native": "balcony"
    "notes":
      "n1": "A balcony, outside a room on an upper floor. 阳 (yáng) is sun."
    "examples":
      "阳台有很多花。":
        "native": "The balcony has a lot of flowers."
        "bases":
          "有":
            "meaning": "to have; there is"
      "我在阳台上晒衣服。": "I dry the clothes on the balcony."
  "zh-1167":
    "native": "window"
    "notes":
      "n1": "A window, in a wall. 窗 (chuāng) is a window."
    "examples":
      "窗户开着，很凉快。":
        "native": "The window is open, and it is cool."
        "bases":
          "着":
            "meaning": "a particle: an action goes on"
      "请关窗户。": "Please close the window."
  "zh-1168":
    "native": "door"
    "notes":
      "n1": "A door, for going in and out of a room or a building."
    "examples":
      "门开了。":
        "native": "The door has opened."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "请关门。": "Please close the door."
  "zh-1169":
    "native": "wall"
    "notes":
      "n1": "A wall, a side of a room or a building."
    "examples":
      "墙上有画。":
        "native": "There is a picture on the wall."
        "bases":
          "有":
            "meaning": "to have; there is"
          "画":
            "meaning": "picture; painting"
      "墙很白。": "The wall is very white."
  "zh-1170":
    "native": "floor (surface)"
    "notes":
      "n1": "The floor surface, the boards or tiles you walk on. 地 (dì) is the ground."
    "examples":
      "地板很干净。": "The floor is very clean."
      "我把地板擦了。":
        "native": "I wiped the floor."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1171":
    "native": "ceiling"
    "notes":
      "n1": "The ceiling, the top surface of a room. 天花 (tiānhuā) is the ceiling's name in old use."
    "examples":
      "天花板很高。": "The ceiling is very high."
      "天花板上有灯。":
        "native": "There is a light on the ceiling."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1172":
    "native": "roof"
    "notes":
      "n1": "The roof of a building. 屋 (wū) is a house."
    "examples":
      "屋顶是红的。":
        "native": "The roof is red."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "屋顶上有猫。":
        "native": "There is a cat on the roof."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1173":
    "native": "yard; courtyard"
    "notes":
      "n1": "A yard, an open space next to or inside a house. 院 (yuàn) is a yard or building."
    "examples":
      "院子很大。": "The yard is very big."
      "孩子在院子里玩。": "The children play in the yard."
  "zh-1174":
    "native": "garden"
    "notes":
      "n1": "A garden, planted with flowers and trees. 园 (yuán) is a garden."
    "examples":
      "花园很漂亮。": "The garden is very pretty."
      "我在花园里种花。":
        "native": "I plant flowers in the garden."
        "bases":
          "种":
            "meaning": "to plant"
  "zh-1175":
    "native": "flower"
    "notes":
      "n1": "A flower, the bloom of a plant."
    "examples":
      "花很香。": "The flower smells sweet."
      "我买了一束花。":
        "native": "I bought a bunch of flowers."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "束":
            "meaning": "the measure word for a bunch"
  "zh-1176":
    "native": "tree"
    "notes":
      "n1": "A tree, a plant with a trunk and branches."
    "examples":
      "树很高。": "The tree is very tall."
      "树下有人。":
        "native": "There are people under the tree."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1177":
    "native": "sofa"
    "notes":
      "n1": "A sofa, a soft seat for two or more people."
    "examples":
      "沙发很软。":
        "native": "The sofa is very soft."
        "bases":
          "软":
            "meaning": "soft"
      "他坐在沙发上。": "He sits on the sofa."
  "zh-1178":
    "native": "cupboard; cabinet"
    "notes":
      "n1": "A cupboard or cabinet with doors, for storing things. 子 (zi) makes it a noun."
    "examples":
      "柜子里有杯子。":
        "native": "There are cups in the cupboard."
        "bases":
          "有":
            "meaning": "to have; there is"
      "柜子很大。": "The cupboard is very big."
  "zh-1179":
    "native": "bookshelf"
    "notes":
      "n1": "A bookshelf, for holding books. 架 (jià) is a frame or rack."
    "examples":
      "书架上有很多书。":
        "native": "There are many books on the bookshelf."
        "bases":
          "有":
            "meaning": "to have; there is"
      "书架在窗户旁边。": "The bookshelf is next to the window."
  "zh-1180":
    "native": "washing machine"
    "notes":
      "n1": "A washing machine. 机 (jī) is a machine."
    "examples":
      "洗衣机在阳台上。": "The washing machine is on the balcony."
      "洗衣机很新。": "The washing machine is new."
  "zh-1181":
    "native": "air conditioner"
    "notes":
      "n1": "An air conditioner, for cooling a room. 空 (kōng) is air or empty."
    "examples":
      "空调很凉快。": "The air conditioning is very cool."
      "我开空调了。":
        "native": "I turned on the air conditioner."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1182":
    "native": "television"
    "notes":
      "n1": "A television, a set for watching programmes. 电 (diàn) is electricity."
    "examples":
      "电视很大。": "The television is very big."
      "我们晚上看电视。": "We watch television in the evening."
  "zh-1183":
    "native": "lamp; light"
    "notes":
      "n1": "A lamp or a light, which gives light. 灯 (dēng) is the light itself."
    "examples":
      "灯很亮。":
        "native": "The light is very bright."
        "bases":
          "亮":
            "meaning": "bright"
      "请开灯。": "Please turn on the light."
  "zh-1184":
    "native": "curtain"
    "notes":
      "n1": "A curtain, for a window. 帘 (lián) is a curtain or screen."
    "examples":
      "窗帘是蓝的。":
        "native": "The curtains are blue."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "请拉上窗帘。":
        "native": "Please draw the curtains."
        "bases":
          "拉":
            "meaning": "to pull"
  "zh-1185":
    "native": "mirror"
    "notes":
      "n1": "A mirror, for seeing yourself. 镜 (jìng) is a mirror."
    "examples":
      "镜子在门旁边。": "The mirror is next to the door."
      "她在镜子前看自己。": "She looks at herself in the mirror."
  "zh-1186":
    "native": "rubbish; waste"
    "notes":
      "n1": "Rubbish, things you throw away."
    "examples":
      "垃圾很多。": "There is a lot of rubbish."
      "请把垃圾拿出去。":
        "native": "Please take the rubbish out."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
          "出去":
            "meaning": "out"
  "zh-1187":
    "native": "stairs"
    "notes":
      "n1": "A staircase, the stairs in a building. 梯 (tī) is a ladder or steps."
    "examples":
      "楼梯很窄。":
        "native": "The stairs are very narrow."
        "bases":
          "窄":
            "meaning": "narrow"
      "我走楼梯上楼。": "I go up the stairs."
  "zh-1188":
    "native": "lift; elevator"
    "notes":
      "n1": "A lift, which takes people up and down a building."
    "examples":
      "电梯很快。": "The lift is quick."
      "这个楼有电梯。":
        "native": "This building has a lift."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1189":
    "native": "rent"
    "notes":
      "n1": "The money paid each month to rent a flat. 租 (zū) is to rent."
    "examples":
      "房租很便宜。": "The rent is cheap."
      "我每个月交房租。":
        "native": "I pay the rent every month."
        "bases":
          "交":
            "meaning": "to hand over; to pay"
  "zh-1190":
    "native": "neighbour"
    "notes":
      "n1": "A neighbour, someone who lives near you. 居 (jū) is to live."
    "examples":
      "邻居很好。": "The neighbour is very nice."
      "我的邻居是老师。":
        "native": "My neighbour is a teacher."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1191":
    "native": "housing estate"
    "notes":
      "n1": "A housing estate, a group of flats in one area. 区 (qū) is an area."
    "examples":
      "我住在这个小区。": "I live in this housing estate."
      "小区里有公园。":
        "native": "There is a park in the estate."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1192":
    "native": "to move house"
    "notes":
      "n1": "To move house, to take your things to a new home. 搬 (bān) is to move something."
    "examples":
      "我们下个月搬家。": "We move house next month."
      "搬家很累。": "Moving house is very tiring."
  "zh-1193":
    "native": "to sweep the floor"
    "notes":
      "n1": "To sweep the floor with a broom. 扫 (sǎo) is to sweep."
    "examples":
      "我每天扫地。":
        "native": "I sweep the floor every day."
        "bases":
          "每天":
            "meaning": "every day"
      "他在扫地。": "He is sweeping the floor."
  "zh-1194":
    "native": "to wipe"
    "notes":
      "n1": "To wipe a surface with a cloth."
    "examples":
      "请擦桌子。": "Please wipe the table."
      "我擦窗户。": "I wipe the window."
  "zh-1195":
    "native": "to wash the dishes"
    "notes":
      "n1": "To wash the dishes after a meal. 碗 (wǎn) is a bowl."
    "examples":
      "爸爸在洗碗。": "Dad is washing the dishes."
      "洗碗以后我休息。": "After washing the dishes I rest."
  "zh-1196":
    "native": "to turn off the light"
    "notes":
      "n1": "To turn off a light. Its opposite is 开灯 (kāidēng), to turn it on."
    "examples":
      "睡觉前关灯。": "Turn off the light before going to sleep."
      "出门前要关灯。":
        "native": "You must turn off the light before going out."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-1197":
    "native": "safe; secure"
    "notes":
      "n1": "Safe, without danger. Its opposite is 危险 (wēixiǎn), dangerous."
    "examples":
      "这个房子很安全。": "This house is very safe."
      "门要关好，很安全。":
        "native": "Keep the door closed; it is safer."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-1198":
    "native": "tap; faucet"
    "notes":
      "n1": "A tap, to turn on the water. 龙 (lóng) is a dragon, and 头 (tóu) is a head."
    "examples":
      "水龙头坏了。":
        "native": "The tap is broken."
        "bases":
          "坏":
            "meaning": "broken; bad"
          "了":
            "meaning": "a particle: a change has happened"
      "请关水龙头。": "Please turn off the tap."
  "zh-1199":
    "native": "rubbish bin"
    "notes":
      "n1": "A bin for rubbish. 桶 (tǒng) is a bucket or a bin."
    "examples":
      "垃圾桶在门口。": "The rubbish bin is at the door."
      "垃圾桶满了。":
        "native": "The rubbish bin is full."
        "bases":
          "满":
            "meaning": "full"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1200":
    "native": "lock"
    "notes":
      "n1": "A lock, for a door. To lock is 锁门 (suǒ mén)."
    "examples":
      "门上有锁。":
        "native": "There is a lock on the door."
        "bases":
          "有":
            "meaning": "to have; there is"
      "我忘了锁门。":
        "native": "I forgot to lock the door."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1201":
    "native": "landlord"
    "notes":
      "n1": "A landlord, the owner who rents out a flat. 东 (dōng) is east, here the host."
    "examples":
      "房东很好。": "The landlord is very kind."
      "房东说房租很便宜。": "The landlord says the rent is cheap."
