"cards":
  "zh-4372":
    "native": "He does his work meticulously, and takes every step seriously."
    "confusables":
      "w1":
        "why": "三心二意 (sān xīn èr yì) is wavering, the opposite of careful steady work."
      "w2":
        "why": "脚踏实地 (jiǎo tà shí dì) is steady and realistic in action, but it does not mean attention to every detail."
    "bases":
      "做事":
        "meaning": "to do things"
      "一步":
        "meaning": "one step"
  "zh-4373":
    "native": "He thinks before he speaks and never talks nonsense."
    "confusables":
      "w1":
        "why": "优柔寡断 (yōu róu guǎ duàn) is being unable to decide, while 三思而后行 (sān sī ér hòu xíng) is thinking first and then deciding."
      "w2":
        "why": "当机立断 (dāng jī lì duàn) is deciding at once, the opposite of thinking carefully first."
    "bases":
      "说话":
        "meaning": "to speak"
      "三思而后行":
        "meaning": "think carefully before acting"
      "从不":
        "meaning": "never"
      "乱讲":
        "meaning": "to talk nonsense"
  "zh-4374":
    "native": "He is so indecisive that he needs several days just to buy a pair of shoes."
    "confusables":
      "w1":
        "why": "当机立断 (dāng jī lì duàn) is the opposite: deciding at once in a crisis."
      "w2":
        "why": "三心二意 (sān xīn èr yì) is being unsure, but it is said of commitment to a task, not of buying things."
    "bases":
      "连":
        "meaning": "even"
      "一双":
        "meaning": "a pair"
      "要":
        "meaning": "to need"
      "好几天":
        "meaning": "several days"
  "zh-4375":
    "native": "This match is our last chance, so we can only win."
    "confusables":
      "w1":
        "why": "破釜沉舟 (pò fǔ chén zhōu) is committing fully with no way back, a close idea of the same kind."
      "w2":
        "why": "半途而废 (bàn tú ér fèi) is giving up halfway, the opposite of committing fully."
    "bases":
      "这次":
        "meaning": "this time"
      "来说":
        "meaning": "as far as ... is concerned"
      "最后":
        "meaning": "last"
      "的":
        "meaning": "particle"
      "机会":
        "meaning": "chance"
      "只能":
        "meaning": "can only"
  "zh-4376":
    "native": "Everyone knows this principle, so there is no need to say much."
    "confusables":
      "w1":
        "why": "众所周知 (zhòng suǒ zhōu zhī) is a set phrase that says the fact is known to all; it is close in meaning."
      "w2":
        "why": "大同小异 (dà tóng xiǎo yì) is about two things that are alike, not about a principle everyone knows."
    "bases":
      "这个":
        "meaning": "this"
      "不用":
        "meaning": "no need"
  "zh-4377":
    "native": "The houses in this small town each have their own character, which is very interesting."
    "confusables":
      "w1":
        "why": "与众不同 (yǔ zhòng bù tóng) is different from others, close in meaning but about one thing standing out."
      "w2":
        "why": "千篇一律 (qiān piān yí lǜ) is all the same, the opposite of each house having its own character."
    "bases":
      "这座":
        "meaning": "this (town)"
      "小镇":
        "meaning": "small town"
      "的":
        "meaning": "of"
      "各有":
        "meaning": "each has"
      "特色":
        "meaning": "character"
      "有意思":
        "meaning": "interesting"
  "zh-4378":
    "native": "Research must be based on facts; you cannot draw conclusions from feelings."
    "confusables":
      "w1":
        "why": "纸上谈兵 (zhǐ shàng tán bīng) is theory without practice, a different failing from drawing conclusions by feeling."
      "w2":
        "why": "按图索骥 (àn tú suǒ jì) is rigid following of a guide, not judging by feeling."
    "bases":
      "要":
        "meaning": "must"
      "不能":
        "meaning": "cannot"
      "凭":
        "meaning": "by"
  "zh-4379":
    "native": "The teacher teaches each student in their own way, so the students make progress quickly."
    "confusables":
      "w1":
        "why": "循序渐进 (xún xù jiàn jìn) is step-by-step learning; it is close but about the order of learning, not about each person."
      "w2":
        "why": "按图索骥 (àn tú suǒ jì) is following one fixed guide, the opposite of teaching each student differently."
    "bases":
      "会":
        "meaning": "will"
      "所以":
        "meaning": "so"
      "的":
        "meaning": "of"
      "进步":
        "meaning": "progress"
  "zh-4380":
    "native": "Everyone has thought about this question, and the answer is obvious."
    "confusables":
      "w1":
        "why": "众所周知 (zhòng suǒ zhōu zhī) says a fact is known to all; the sentence is about one answer that is obvious."
      "w2":
        "why": "理所当然 (lǐ suǒ dāng rán) means natural and as expected; it is close, but about what should happen."
    "bases":
      "这个":
        "meaning": "this"
