"cards":
  "zh-3674":
    "confusables":
      "w1":
        "why": "忙 (máng) is busy, a different state."
      "w2":
        "why": "阴 (yīn) is cloudy, a weather word."
    "bases":
      "即使":
        "meaning": "even if"
    "native": "Even if it rains, I will still go."
  "zh-3675":
    "confusables":
      "w1":
        "why": "忙 (máng) is busy, a different state."
      "w2":
        "why": "休息 (xiūxi) is to rest, the opposite of working."
    "bases":
