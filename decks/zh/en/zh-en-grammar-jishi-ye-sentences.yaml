"name": "即使 (jíshǐ) ... 也 (yě) and 不管 (bùguǎn) ... 都 (dōu): even if, and whatever"
"description": "Sentences that grant a point and still say the result stays the same: 即使下雨 (jíshǐ xiàyǔ)，我也去 (even if it rains, I will still go), and 不管你说什么 (bùguǎn nǐ shuō shénme)，我都去 (whatever you say, I will go). Not yet checked by a Mandarin speaker: please report any mistake."
