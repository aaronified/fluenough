"cards":
  "zh-3868":
    "confusables":
      "w1":
        "why": "近代 (jìndài) is the recent past, a middle period."
      "w2":
        "why": "古老 (gǔlǎo) is ancient, a description rather than a period."
    "bases":
      "和":
        "meaning": "and"
      "的":
        "meaning": "of"
      "生活":
        "meaning": "life"
      "一样":
        "meaning": "the same"
    "native": "Life in ancient times and in modern times is very different."
  "zh-3869":
    "confusables":
      "w1":
        "why": "衰落 (shuāiluò) is to decline, the opposite."
      "w2":
        "why": "王朝 (wángcháo) is a dynasty, a close word."
    "native": "This dynasty was very prosperous."
  "zh-3870":
    "confusables":
      "w1":
        "why": "皇宫 (huánggōng) is a palace, a close word."
      "w2":
        "why": "孔子 (Kǒngzǐ) is Confucius, a thinker."
    "native": "The emperor lived in the Forbidden City."
  "zh-3871":
    "confusables":
      "w1":
        "why": "胜利 (shènglì) is victory, a result of battle."
      "w2":
        "why": "革命 (gémìng) is revolution, a different kind of change."
    "bases":
      "了":
        "meaning": "a particle"
    "native": "This battle changed history."
  "zh-3872":
    "confusables":
      "w1":
        "why": "独立 (dúlì) is independence, a different outcome."
      "w2":
        "why": "占领 (zhànlǐng) is to occupy, a different act."
    "bases":
      "签":
        "meaning": "to sign"
      "了":
        "meaning": "a particle"
      "和":
        "meaning": "and"
    "native": "The two countries signed a peace treaty and a treaty."
  "zh-3873":
    "confusables":
      "w1":
        "why": "古迹 (gǔjì) is a historic site, which is a place, not an object."
      "w2":
        "why": "遗址 (yízhǐ) is a ruin, a site rather than a relic."
    "bases":
      "有":
        "meaning": "to have"
    "native": "The museum has many cultural relics."
  "zh-3874":
    "confusables":
      "w1":
        "why": "城堡 (chéngbǎo) is a castle, a different building."
      "w2":
        "why": "丝绸之路 (Sīchóu zhī Lù) is the Silk Road, a different route."
    "native": "The Great Wall is very long, and also very famous."
  "zh-3875":
    "confusables":
      "w1":
        "why": "统一 (tǒngyī) is to unify, the opposite of split."
      "w2":
        "why": "革命 (gémìng) is a revolution, a large change."
    "bases":
      "了":
        "meaning": "a particle"
    "native": "After the peasants revolted, the country split."
