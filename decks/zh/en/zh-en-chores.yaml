"id": "zh-en-chores"
"kind": "layer"
"core": "zh-chores"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Chores"
"description": "Thirty-five words for the housework: mopping and washing, the rubbish and its sorting, the tools for cleaning, and the bedding, and the words for sharing the work. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-2231":
    "native": "housework"
    "notes":
      "n1": "The work of running a home: cleaning, cooking and washing. 家 (jiā) is home, and 务 (wù) is work."
    "examples":
      "我每天做家务。":
        "native": "I do housework every day."
        "bases":
          "每天":
            "meaning": "every day"
      "家务很多。": "There is a lot of housework."
  "zh-2232":
    "native": "to mop the floor"
    "notes":
      "n1": "To wipe the floor with a mop. 拖 (tuō) is to drag or mop, and 地 (dì) is the floor."
    "examples":
      "爸爸拖地。": "Dad mops the floor."
      "拖地以后地很干净。":
        "native": "After mopping the floor is very clean."
        "bases":
          "地":
            "meaning": "ground; floor"
  "zh-2233":
    "native": "to wash clothes"
    "notes":
      "n1": "To wash the clothes by hand or in a machine. 洗 (xǐ) is to wash, and 衣服 (yīfu) is clothes."
    "examples":
      "妈妈洗衣服。": "Mum washes the clothes."
      "周末我洗衣服。": "At the weekend I wash the clothes."
  "zh-2234":
    "native": "to take out the rubbish"
    "notes":
      "n1": "To take the rubbish out to the bin. 倒 (dào) is to pour out, and 垃圾 (lājī) is rubbish."
    "examples":
      "我倒垃圾。": "I take out the rubbish."
      "请倒垃圾。": "Please take out the rubbish."
  "zh-2235":
    "native": "to sort into kinds"
    "notes":
      "n1": "To sort things into groups or kinds. 分 (fēn) is to divide, and 类 (lèi) is a kind."
    "examples":
      "请分类垃圾。": "Please sort the rubbish."
      "分类很重要。": "Sorting is very important."
  "zh-2236":
    "native": "rubbish sorting"
    "notes":
      "n1": "The sorting of rubbish into different bins for recycling. 垃圾 (lājī) is rubbish."
    "examples":
      "垃圾分类很好。": "Rubbish sorting is good."
      "我们做垃圾分类。": "We sort the rubbish."
  "zh-2237":
    "native": "recyclable"
    "notes":
      "n1": "Able to be collected and reused. 回收 (huíshōu) is to recycle."
    "examples":
      "这是可回收的垃圾。":
        "native": "This is recyclable rubbish."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "瓶子是可回收的。":
        "native": "Bottles are recyclable."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2238":
    "native": "kitchen waste"
    "notes":
      "n1": "Food waste from the kitchen, such as peelings. 厨 (chú) is a kitchen, and 余 (yú) is what is left."
    "examples":
      "厨余放在这个桶里。":
        "native": "Put the kitchen waste in this bin."
        "bases":
          "桶":
            "meaning": "bin; bucket"
      "厨余有很多水。":
        "native": "Kitchen waste has a lot of water."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-2239":
    "native": "hazardous waste"
    "notes":
      "n1": "Rubbish that is harmful to people or the environment, such as batteries. 有害 (yǒuhài) is harmful."
    "examples":
      "电池是有害垃圾。": "Batteries are hazardous waste."
      "有害垃圾要单独放。":
        "native": "Hazardous waste must be put in separately."
        "bases":
          "要":
            "meaning": "must; to want"
          "单独":
            "meaning": "separately; alone"
  "zh-2240":
    "native": "other waste"
    "notes":
      "n1": "Rubbish that is none of the other kinds. 其他 (qítā) is other."
    "examples":
      "这个是其他垃圾。":
        "native": "This is other waste."
        "bases":
          "其他":
            "meaning": "other"
      "其他垃圾放在桶里。":
        "native": "Put other waste in the bin."
        "bases":
          "其他":
            "meaning": "other"
          "桶":
            "meaning": "bin; bucket"
  "zh-2241":
    "native": "to do housework"
    "notes":
      "n1": "To do the housework at home. 做 (zuò) is to do."
    "examples":
      "他做家务。": "He does the housework."
      "我们一起做家务。": "We do the housework together."
  "zh-2242":
    "native": "to buy vegetables"
    "notes":
      "n1": "To buy food and vegetables for cooking. 买 (mǎi) is to buy, and 菜 (cài) is vegetables."
    "examples":
      "妈妈去买菜。": "Mum goes to buy vegetables."
      "我每天买菜。":
        "native": "I buy vegetables every day."
        "bases":
          "每天":
            "meaning": "every day"
  "zh-2243":
    "native": "to repair; to fix"
    "notes":
      "n1": "To repair something that is broken. 修 (xiū) is to mend, and 理 (lǐ) is to put in order."
    "examples":
      "爸爸修理了水龙头。":
        "native": "Dad has repaired the tap."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "这个椅子要修理。":
        "native": "This chair needs repairing."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-2244":
    "native": "to water the plants"
    "notes":
      "n1": "To pour water on the flowers and plants. 浇 (jiāo) is to pour water, and 花 (huā) is a flower."
    "examples":
      "我每天浇花。":
        "native": "I water the plants every day."
        "bases":
          "每天":
            "meaning": "every day"
      "请帮我浇花。": "Please help me water the plants."
  "zh-2245":
    "native": "to feed (an animal or a person)"
    "notes":
      "n1": "To give food to an animal or a baby. 喂 (wèi) is to feed."
    "examples":
      "我喂猫。": "I feed the cat."
      "请喂狗。": "Please feed the dog."
  "zh-2246":
    "native": "to walk the dog"
    "notes":
      "n1": "To take a dog for a walk. 遛 (liù) is to walk slowly, and 狗 (gǒu) is a dog."
    "examples":
      "我每天遛狗。":
        "native": "I walk the dog every day."
        "bases":
          "每天":
            "meaning": "every day"
      "他去遛狗了。":
        "native": "He has gone to walk the dog."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2247":
    "native": "to throw away; to throw"
    "notes":
      "n1": "To throw something away, or to throw it."
    "examples":
      "请把纸扔了。":
        "native": "Please throw the paper away."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
          "了":
            "meaning": "a particle: a change has happened"
      "不要乱扔垃圾。":
        "native": "Do not throw rubbish about."
        "bases":
          "要":
            "meaning": "must; to want"
          "乱":
            "meaning": "carelessly; in a mess"
  "zh-2248":
    "native": "vacuum cleaner"
    "notes":
      "n1": "A vacuum cleaner, which sucks up the dust. 吸 (xī) is to suck, and 尘 (chén) is dust."
    "examples":
      "吸尘器在柜子里。": "The vacuum cleaner is in the cupboard."
      "用吸尘器吸地。":
        "native": "Vacuum the floor."
        "bases":
          "用":
            "meaning": "to use"
          "吸":
            "meaning": "to suck up"
          "地":
            "meaning": "ground; floor"
  "zh-2249":
    "native": "bucket"
    "notes":
      "n1": "A bucket, for carrying water. 桶 (tǒng) is a bucket or tub."
    "examples":
      "水桶是满的。":
        "native": "The bucket is full."
        "bases":
          "满":
            "meaning": "full"
          "的":
            "meaning": "a particle: of; belonging to"
      "拿一个水桶。": "Bring a bucket."
  "zh-2250":
    "native": "mop"
    "notes":
      "n1": "A mop, for cleaning the floor. 拖 (tuō) is to drag, and 把 (bǎ) is a handle."
    "examples":
      "拖把在门后面。": "The mop is behind the door."
      "用拖把拖地。":
        "native": "Mop the floor with the mop."
        "bases":
          "用":
            "meaning": "to use"
          "拖":
            "meaning": "to drag; to mop"
          "地":
            "meaning": "ground; floor"
  "zh-2251":
    "native": "dustpan"
    "notes":
      "n1": "A dustpan, for holding the sweepings. 簸 (bǒ) is to winnow."
    "examples":
      "簸箕在桌子下面。":
        "native": "The dustpan is under the table."
        "bases":
          "下面":
            "meaning": "under; below"
      "用簸箕收垃圾。":
        "native": "Collect the rubbish with the dustpan."
        "bases":
          "用":
            "meaning": "to use"
  "zh-2252":
    "native": "washing powder"
    "notes":
      "n1": "Washing powder, for washing clothes. 粉 (fěn) is powder."
    "examples":
      "洗衣粉用完了。":
        "native": "The washing powder has run out."
        "bases":
          "用":
            "meaning": "to use"
          "完":
            "meaning": "finished"
          "了":
            "meaning": "a particle: a change has happened"
      "买洗衣粉。": "Buy washing powder."
  "zh-2253":
    "native": "washing-up liquid"
    "notes":
      "n1": "Washing-up liquid, for washing dishes. 洁 (jié) is clean, and 精 (jīng) is a liquid essence."
    "examples":
      "洗洁精在厨房。": "The washing-up liquid is in the kitchen."
      "用洗洁精洗碗。":
        "native": "Wash the bowls with washing-up liquid."
        "bases":
          "用":
            "meaning": "to use"
  "zh-2254":
    "native": "to take turns"
    "notes":
      "n1": "To do something in turn, one after another. 轮 (lún) is a turn, and 流 (liú) is to flow."
    "examples":
      "我们轮流洗碗。": "We take turns to wash the dishes."
      "大家轮流拖地。": "Everyone takes turns mopping the floor."
  "zh-2255":
    "native": "division of work"
    "notes":
      "n1": "The division of work between people. 分 (fēn) is to divide, and 工 (gōng) is work."
    "examples":
      "我们有分工。":
        "native": "We have a division of work."
        "bases":
          "有":
            "meaning": "to have; there is"
      "分工很清楚。":
        "native": "The division of work is very clear."
        "bases":
          "清楚":
            "meaning": "clear"
  "zh-2256":
    "native": "to be responsible for"
    "notes":
      "n1": "To be in charge of a task and answer for it. 负 (fù) is to bear, and 责 (zé) is duty."
    "examples":
      "他负责买菜。": "He is responsible for buying the vegetables."
      "我负责倒垃圾。": "I am responsible for taking out the rubbish."
  "zh-2257":
    "native": "big clean; spring clean"
    "notes":
      "n1": "A big clean of the whole house. 大 (dà) is big, and 扫除 (sǎochú) is cleaning."
    "examples":
      "今天是大扫除。": "Today is the big clean."
      "大扫除以后很干净。": "After the big clean it is very clean."
  "zh-2258":
    "native": "rubbish bin"
    "notes":
      "n1": "A bin for rubbish, a large box. 箱 (xiāng) is a box."
    "examples":
      "垃圾箱在门口。": "The rubbish bin is at the door."
      "垃圾箱满了。":
        "native": "The rubbish bin is full."
        "bases":
          "满":
            "meaning": "full"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2259":
    "native": "clean; cleanliness"
    "notes":
      "n1": "Clean, free from dirt. 清 (qīng) is clear, and 洁 (jié) is clean."
    "examples":
      "房间很清洁。": "The room is very clean."
      "要保持清洁。":
        "native": "You must keep it clean."
        "bases":
          "要":
            "meaning": "must; to want"
          "保持":
            "meaning": "to keep"
  "zh-2260":
    "native": "to disinfect"
    "notes":
      "n1": "To kill germs on a surface or a tool. 消 (xiāo) is to remove, and 毒 (dú) is poison."
    "examples":
      "请消毒桌子。": "Please disinfect the table."
      "消毒以后再用。":
        "native": "Use it again after disinfecting it."
        "bases":
          "用":
            "meaning": "to use"
  "zh-2261":
    "native": "tidy; neat"
    "notes":
      "n1": "Tidy and neat, in good order. 整 (zhěng) is whole or in order, and 洁 (jié) is clean."
    "examples":
      "房间很整洁。": "The room is very tidy."
      "她的衣服很整洁。":
        "native": "Her clothes are very neat."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2262":
    "native": "quilt; duvet"
    "notes":
      "n1": "A quilt for the bed, to keep warm. 被 (bèi) is a cover."
    "examples":
      "被子很暖和。": "The quilt is very warm."
      "我晒被子。": "I air the quilt in the sun."
  "zh-2263":
    "native": "bedsheet"
    "notes":
      "n1": "A sheet on a bed. 床 (chuáng) is a bed, and 单 (dān) is a sheet."
    "examples":
      "床单要洗了。":
        "native": "The bedsheets need washing."
        "bases":
          "要":
            "meaning": "must; to want"
          "了":
            "meaning": "a particle: a change has happened"
      "换床单吧。": "Let us change the sheets."
  "zh-2264":
    "native": "pillow"
    "notes":
      "n1": "A pillow, for resting the head at night."
    "examples":
      "枕头很软。":
        "native": "The pillow is very soft."
        "bases":
          "软":
            "meaning": "soft"
      "我的枕头在床上。":
        "native": "My pillow is on the bed."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2265":
    "native": "carpet; rug"
    "notes":
      "n1": "A carpet or rug for the floor. 毯 (tǎn) is a blanket or rug."
    "examples":
      "地毯很脏。": "The carpet is very dirty."
      "地毯要用吸尘器。":
        "native": "The carpet needs vacuuming."
        "bases":
          "要":
            "meaning": "must; to want"
          "用":
            "meaning": "to use"
