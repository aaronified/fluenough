"cards":
  "zh-2102":
    "native": "match; competition"
    "notes":
      "n1": "A match or a competition in sport. 比 (bǐ) is to compare, and 赛 (sài) is a contest."
    "examples":
      "这场比赛很精彩。":
        "native": "This match is very exciting."
        "bases":
          "精彩":
            "meaning": "exciting"
      "我们去看比赛。": "We go to watch the match."
  "zh-2103":
    "native": "race; running race"
    "notes":
      "n1": "A race, a contest to see who runs fastest. 跑 (pǎo) is to run."
    "examples":
      "他参加了赛跑。":
        "native": "He took part in the race."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "赛跑很累。": "Racing is tiring."
  "zh-2104":
    "native": "table tennis; ping-pong"
    "notes":
      "n1": "Table tennis, played on a table with bats and a small ball. 球 (qiú) is a ball."
    "examples":
      "他打乒乓球。":
        "native": "He plays table tennis."
        "bases":
          "打":
            "meaning": "to play (a sport)"
      "乒乓球比赛很激烈。":
        "native": "The table tennis match is very fierce."
        "bases":
          "激烈":
            "meaning": "fierce; intense"
  "zh-2105":
    "native": "badminton"
    "notes":
      "n1": "Badminton, played with a feathered shuttlecock over a net. 羽毛 (yǔmáo) is feather."
    "examples":
      "我喜欢打羽毛球。":
        "native": "I like playing badminton."
        "bases":
          "打":
            "meaning": "to play (a sport)"
      "羽毛球很轻。":
        "native": "The shuttlecock is very light."
        "bases":
          "轻":
            "meaning": "light (not heavy)"
  "zh-2106":
    "native": "tennis"
    "notes":
      "n1": "Tennis, played with a racket over a net. 网 (wǎng) is a net."
    "examples":
      "她打网球。":
        "native": "She plays tennis."
        "bases":
          "打":
            "meaning": "to play (a sport)"
      "网球场很大。": "The tennis court is very big."
  "zh-2107":
    "native": "basketball"
    "notes":
      "n1": "Basketball, played by shooting a ball through a high hoop. 篮 (lán) is a basket."
    "examples":
      "他打篮球。":
        "native": "He plays basketball."
        "bases":
          "打":
            "meaning": "to play (a sport)"
      "篮球比赛很精彩。":
        "native": "The basketball match is exciting."
        "bases":
          "精彩":
            "meaning": "exciting"
  "zh-2108":
    "native": "volleyball"
    "notes":
      "n1": "Volleyball, played by hitting a ball over a net with the hands. 排 (pái) is a row."
    "examples":
      "我们打排球。":
        "native": "We play volleyball."
        "bases":
          "打":
            "meaning": "to play (a sport)"
      "排球很好玩。":
        "native": "Volleyball is great fun."
        "bases":
          "好玩":
            "meaning": "fun"
  "zh-2109":
    "native": "baseball"
    "notes":
      "n1": "Baseball, played with a bat and a ball, around a diamond. 棒 (bàng) is a bat or stick."
    "examples":
      "他喜欢棒球。": "He likes baseball."
      "棒球比赛很长。": "A baseball match is very long."
  "zh-2110":
    "native": "gymnastics"
    "notes":
      "n1": "Gymnastics, exercises of strength, balance and flexibility. 体 (tǐ) is the body."
    "examples":
      "她练体操。":
        "native": "She trains in gymnastics."
        "bases":
          "练":
            "meaning": "to practise"
      "体操很难。": "Gymnastics is very hard."
  "zh-2111":
    "native": "weightlifting"
    "notes":
      "n1": "Weightlifting, lifting heavy weights. 举 (jǔ) is to lift, and 重 (zhòng) is heavy."
    "examples":
      "他做举重。": "He does weightlifting."
      "举重需要很大的力气。":
        "native": "Weightlifting needs a lot of strength."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2112":
    "native": "archery"
    "notes":
      "n1": "Archery, shooting arrows at a target. 射 (shè) is to shoot, and 箭 (jiàn) is an arrow."
    "examples":
      "他练射箭。":
        "native": "He practises archery."
        "bases":
          "练":
            "meaning": "to practise"
      "射箭很有趣。": "Archery is interesting."
  "zh-2113":
    "native": "to skate on ice"
    "notes":
      "n1": "To skate on ice, in a rink or on a lake. 滑 (huá) is to slide, and 冰 (bīng) is ice."
    "examples":
      "冬天我去滑冰。": "In winter I go skating."
      "滑冰很好玩。":
        "native": "Skating is great fun."
        "bases":
          "好玩":
            "meaning": "fun"
  "zh-2114":
    "native": "champion; first place"
    "notes":
      "n1": "The champion, the winner of a competition. 冠 (guàn) is a crown, and 军 (jūn) is an army."
    "examples":
      "他是冠军。": "He is the champion."
      "冠军很高兴。": "The champion is very happy."
  "zh-2115":
    "native": "runner-up; second place"
    "notes":
      "n1": "The second-place winner, the runner-up. 亚 (yà) is second or sub."
    "examples":
      "她拿了亚军。":
        "native": "She came second."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "亚军也很好。": "Second place is also very good."
  "zh-2116":
    "native": "third place"
    "notes":
      "n1": "The third-place winner. 季 (jì) is the third in a series."
    "examples":
      "他拿了季军。":
        "native": "He took third place."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "季军比亚军低。":
        "native": "Third place is lower than second."
        "bases":
          "比":
            "meaning": "to (a score: three to two)"
          "低":
            "meaning": "low"
  "zh-2117":
    "native": "gold medal"
    "notes":
      "n1": "A gold medal, the top prize in a competition. 金 (jīn) is gold, and 牌 (pái) is a medal."
    "examples":
      "他拿了金牌。":
        "native": "He won a gold medal."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "金牌很重。":
        "native": "The gold medal is heavy."
        "bases":
          "重":
            "meaning": "heavy"
  "zh-2118":
    "native": "silver medal"
    "notes":
      "n1": "A silver medal, the second prize in a competition. 银 (yín) is silver."
    "examples":
      "她拿到银牌。":
        "native": "She got a silver medal."
        "bases":
          "拿到":
            "meaning": "to get; to obtain"
      "银牌很漂亮。": "The silver medal is very pretty."
  "zh-2119":
    "native": "bronze medal"
    "notes":
      "n1": "A bronze medal, the third prize in a competition. 铜 (tóng) is bronze."
    "examples":
      "他拿了铜牌。":
        "native": "He won a bronze medal."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "铜牌也很好。": "A bronze medal is also very good."
  "zh-2120":
    "native": "coach; trainer"
    "notes":
      "n1": "A coach, who trains an athlete or a team. 教 (jiào) is to teach, and 练 (liàn) is to practise."
    "examples":
      "我的教练很严格。":
        "native": "My coach is very strict."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "严格":
            "meaning": "strict"
      "教练说要锻炼。":
        "native": "The coach says we must train."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-2121":
    "native": "athlete; sportsperson"
    "notes":
      "n1": "An athlete, a person who competes in sport. 员 (yuán) is a member."
    "examples":
      "他是运动员。": "He is an athlete."
      "运动员很累。": "The athletes are very tired."
  "zh-2122":
    "native": "court; pitch"
    "notes":
      "n1": "A court or pitch, the playing area for a ball game. 场 (chǎng) is an open place."
    "examples":
      "球场很大。": "The court is very big."
      "我们去球场打球。":
        "native": "We go to the court to play ball."
        "bases":
          "打":
            "meaning": "to play (a sport)"
  "zh-2123":
    "native": "racket; bat"
    "notes":
      "n1": "A racket or bat, for hitting a ball. 拍 (pāi) is a bat or racket."
    "examples":
      "他有一个球拍。":
        "native": "He has a racket."
        "bases":
          "有":
            "meaning": "to have; there is"
      "球拍很轻。":
        "native": "The racket is very light."
        "bases":
          "轻":
            "meaning": "light (not heavy)"
  "zh-2124":
    "native": "fan (of a ball game)"
    "notes":
      "n1": "A fan of a ball game. 迷 (mí) is a fan."
    "examples":
      "他是球迷。": "He is a football fan."
      "球迷很多。": "There are a lot of fans."
  "zh-2125":
    "native": "to score a point"
    "notes":
      "n1": "To score points in a game. 得 (dé) is to get, and 分 (fēn) is a point."
    "examples":
      "他得分了。":
        "native": "He has scored."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "我们得分很高。": "We scored a lot of points."
  "zh-2126":
    "native": "to lose"
    "notes":
      "n1": "To lose a game or a contest. Its opposite is 赢 (yíng), to win."
    "examples":
      "我输了比赛。":
        "native": "I lost the match."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "他不怕输。":
        "native": "He is not afraid to lose."
        "bases":
          "怕":
            "meaning": "to fear"
  "zh-2127":
    "native": "to win"
    "notes":
      "n1": "To win a game or a contest. Its opposite is 输 (shū), to lose."
    "examples":
      "我们赢了！":
        "native": "We won!"
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "谁赢了？":
        "native": "Who won?"
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2128":
    "native": "draw; tie"
    "notes":
      "n1": "A draw, when neither side wins. 平 (píng) is level, and 局 (jú) is a game."
    "examples":
      "比赛是平局。": "The match was a draw."
      "两队平局。":
        "native": "The two teams drew."
        "bases":
          "队":
            "meaning": "team"
  "zh-2129":
    "native": "opponent; rival"
    "notes":
      "n1": "An opponent in a game or a contest. 对 (duì) is opposite, and 手 (shǒu) is a person."
    "examples":
      "我的对手很强。":
        "native": "My opponent is very strong."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "强":
            "meaning": "strong"
      "对手很厉害。":
        "native": "The opponent is very formidable."
        "bases":
          "厉害":
            "meaning": "awesome; formidable"
  "zh-2130":
    "native": "score"
    "notes":
      "n1": "The score in a match, such as two to one. 分 (fēn) is a point."
    "examples":
      "比分是三比二。":
        "native": "The score is three to two."
        "bases":
          "比":
            "meaning": "to (a score: three to two)"
      "比分很接近。":
        "native": "The score is very close."
        "bases":
          "接近":
            "meaning": "close; near"
  "zh-2131":
    "native": "final"
    "notes":
      "n1": "The final of a competition, the last match. 决 (jué) is to decide, and 赛 (sài) is a contest."
    "examples":
      "明天有决赛。":
        "native": "There is the final tomorrow."
        "bases":
          "有":
            "meaning": "to have; there is"
      "决赛很精彩。":
        "native": "The final is very exciting."
        "bases":
          "精彩":
            "meaning": "exciting"
  "zh-2132":
    "native": "semi-final"
    "notes":
      "n1": "The semi-final, the match before the final. 半 (bàn) is half."
    "examples":
      "我们进入半决赛。":
        "native": "We have reached the semi-final."
        "bases":
          "进入":
            "meaning": "to enter"
      "半决赛很激烈。":
        "native": "The semi-final is very fierce."
        "bases":
          "激烈":
            "meaning": "fierce; intense"
  "zh-2133":
    "native": "heat; preliminary round"
    "notes":
      "n1": "A preliminary round, before the main competition. 预 (yù) is in advance."
    "examples":
      "预赛是下午。": "The heats are in the afternoon."
      "他在预赛里很好。": "He did very well in the heats."
  "zh-2134":
    "native": "to foul; to break the rules"
    "notes":
      "n1": "To break the rules of a game. 犯 (fàn) is to commit, and 规 (guī) is a rule."
    "examples":
      "他犯规了。":
        "native": "He has committed a foul."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "这是犯规。": "This is a foul."
  "zh-2135":
    "native": "referee; umpire"
    "notes":
      "n1": "A referee or umpire, who makes sure the rules are kept. 裁 (cái) is to decide, and 判 (pàn) is to judge."
    "examples":
      "裁判吹了哨子。":
        "native": "The referee blew the whistle."
        "bases":
          "吹":
            "meaning": "to blow (a whistle)"
          "了":
            "meaning": "a particle: a change has happened"
          "哨子":
            "meaning": "whistle"
      "裁判很公平。":
        "native": "The referee is very fair."
        "bases":
          "公平":
            "meaning": "fair"
  "zh-2136":
    "native": "competition venue"
    "notes":
      "n1": "The place where a competition is held. 赛 (sài) is a contest, and 场 (chǎng) is a place."
    "examples":
      "赛场上有很多人。":
        "native": "There are many people at the venue."
        "bases":
          "有":
            "meaning": "to have; there is"
      "我们去赛场看比赛。": "We go to the venue to see the match."
  "zh-2137":
    "native": "to warm up"
    "notes":
      "n1": "To warm the body up before exercise. 热 (rè) is warm, and 身 (shēn) is the body."
    "examples":
      "比赛前要热身。":
        "native": "Warm up before the match."
        "bases":
          "要":
            "meaning": "must; to want"
      "我每天热身一下。":
        "native": "I warm up for a moment every day."
        "bases":
          "每天":
            "meaning": "every day"
          "一下":
            "meaning": "a little; have a try"
  "zh-2138":
    "native": "free throw; penalty kick"
    "notes":
      "n1": "A free shot at goal, given after a foul. 罚 (fá) is to penalise."
    "examples":
      "他罚球得分了。":
        "native": "He scored from a free throw."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "罚球很重要。": "The free throw is very important."
  "zh-2139":
    "native": "to shoot at goal"
    "notes":
      "n1": "To kick or shoot the ball at the goal in football. 门 (mén) is a goal or door."
    "examples":
      "他射门了。":
        "native": "He has shot at goal."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "射门要快。":
        "native": "Shoot at goal quickly."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-2140":
    "native": "to score a goal"
    "notes":
      "n1": "To put the ball into the goal. 进 (jìn) is to enter, and 球 (qiú) is a ball."
    "examples":
      "他进球了！":
        "native": "He has scored a goal!"
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "我们进了两个球。":
        "native": "We scored two goals."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2141":
    "native": "goalkeeper"
    "notes":
      "n1": "A goalkeeper, who guards the goal. 守 (shǒu) is to guard, and 门 (mén) is the goal."
    "examples":
      "守门员很厉害。":
        "native": "The goalkeeper is very good."
        "bases":
          "厉害":
            "meaning": "awesome; formidable"
      "守门员接住了球。":
        "native": "The goalkeeper caught the ball."
        "bases":
          "接":
            "meaning": "to catch; to receive"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2142":
    "native": "defender; back"
    "notes":
      "n1": "A defender, a player who guards the back of the team. 后 (hòu) is back, and 卫 (wèi) is to guard."
    "examples":
      "他是后卫。": "He is a defender."
      "后卫很努力。": "The defender works very hard."
  "zh-2143":
    "native": "forward; striker"
    "notes":
      "n1": "A forward, a player who attacks the goal. 前 (qián) is front."
    "examples":
      "他是前锋。": "He is a forward."
      "前锋进球了。":
        "native": "The forward scored."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2144":
    "native": "midfield"
    "notes":
      "n1": "The middle part of a pitch, between the two goals. 中 (zhōng) is middle."
    "examples":
      "他在中场踢球。":
        "native": "He plays in midfield."
        "bases":
          "踢":
            "meaning": "to kick"
      "中场的球员很快。":
        "native": "The midfield players are quick."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "球员":
            "meaning": "player"
  "zh-2145":
    "native": "high jump"
    "notes":
      "n1": "The high jump, jumping over a bar. 跳 (tiào) is to jump, and 高 (gāo) is high."
    "examples":
      "她参加跳高。": "She takes part in the high jump."
      "跳高很难。": "The high jump is very hard."
  "zh-2146":
    "native": "substitute; reserve"
    "notes":
      "n1": "A substitute, a player who comes on in place of another. 替 (tì) is to replace, and 补 (bǔ) is to make up."
    "examples":
      "他是替补。": "He is a substitute."
      "替补上场了。":
        "native": "The substitute has come on to the pitch."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
