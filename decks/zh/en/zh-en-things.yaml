"cards":
  "zh-1629":
    "native": "bag; packet"
    "notes":
      "n1": "A bag or a packet, for carrying things. 书包 (shūbāo) is a school bag, and 背包 (bēibāo) is a backpack."
    "examples":
      "我的包里有钥匙。":
        "native": "There are keys in my bag."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "有":
            "meaning": "to have; there is"
      "这个包很大。": "This bag is very big."
  "zh-1630":
    "native": "backpack"
    "notes":
      "n1": "A backpack, carried on the back. 背 (bēi) is to carry on the back."
    "examples":
      "背包很重。":
        "native": "The backpack is heavy."
        "bases":
          "重":
            "meaning": "heavy"
      "他背着背包去学校。":
        "native": "He goes to school with a backpack on his back."
        "bases":
          "着":
            "meaning": "a particle: an action goes on"
  "zh-1631":
    "native": "suitcase"
    "notes":
      "n1": "A suitcase, for clothes on a journey. 行李 (xíngli) is luggage, and 箱 (xiāng) is a box."
    "examples":
      "行李箱很重。":
        "native": "The suitcase is heavy."
        "bases":
          "重":
            "meaning": "heavy"
      "我的行李箱在车上。":
        "native": "My suitcase is in the car."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1632":
    "native": "box; case"
    "notes":
      "n1": "A box or a case, for keeping things. 子 (zi) makes it a noun."
    "examples":
      "箱子里有书。":
        "native": "There are books in the box."
        "bases":
          "有":
            "meaning": "to have; there is"
      "这个箱子很旧。": "This box is very old."
  "zh-1633":
    "native": "small box"
    "notes":
      "n1": "A small box, with a lid. 盒 (hé) is a box with a lid."
    "examples":
      "盒子是空的。":
        "native": "The box is empty."
        "bases":
          "空":
            "meaning": "empty"
          "的":
            "meaning": "a particle: of; belonging to"
      "我买了一个盒子。":
        "native": "I bought a small box."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1634":
    "native": "pen; pencil"
    "notes":
      "n1": "A pen or a pencil, for writing. 笔 (bǐ) is the general word."
    "examples":
      "这支笔很好。":
        "native": "This pen is very good."
        "bases":
          "支":
            "meaning": "the measure word for a pen or a stick"
      "笔在桌子上。": "The pen is on the table."
  "zh-1635":
    "native": "pencil"
    "notes":
      "n1": "A pencil, with graphite inside. 铅 (qiān) is lead, and 笔 (bǐ) is a pen."
    "examples":
      "铅笔很短。": "The pencil is very short."
      "孩子用铅笔写字。":
        "native": "The child writes characters with a pencil."
        "bases":
          "用":
            "meaning": "to use"
  "zh-1636":
    "native": "eraser; rubber"
    "notes":
      "n1": "A rubber, for rubbing out pencil marks. 橡 (xiàng) is rubber."
    "examples":
      "橡皮在哪里？": "Where is the eraser?"
      "请借我橡皮。": "Please lend me the eraser."
  "zh-1637":
    "native": "ruler"
    "notes":
      "n1": "A ruler, for measuring a line. 尺 (chǐ) is a ruler."
    "examples":
      "尺子是长的。":
        "native": "The ruler is long."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "用尺子画线。":
        "native": "Draw a line with a ruler."
        "bases":
          "用":
            "meaning": "to use"
          "画":
            "meaning": "to draw"
  "zh-1638":
    "native": "scissors"
    "notes":
      "n1": "Scissors, for cutting paper or cloth. 剪 (jiǎn) is to cut, and 刀 (dāo) is a knife."
    "examples":
      "剪刀很快。": "The scissors are very sharp."
      "剪刀在盒子里。": "The scissors are in the box."
  "zh-1639":
    "native": "glue"
    "notes":
      "n1": "Glue, for sticking paper together. 胶 (jiāo) is glue."
    "examples":
      "胶水用完了。":
        "native": "The glue has run out."
        "bases":
          "用":
            "meaning": "to use"
          "完":
            "meaning": "finished"
          "了":
            "meaning": "a particle: a change has happened"
      "用胶水粘纸。":
        "native": "Stick the paper with glue."
        "bases":
          "用":
            "meaning": "to use"
          "粘":
            "meaning": "to stick"
  "zh-1640":
    "native": "notebook; exercise book"
    "notes":
      "n1": "A notebook, for writing in. 本 (běn) is a book."
    "examples":
      "本子上有字。":
        "native": "There are characters in the notebook."
        "bases":
          "有":
            "meaning": "to have; there is"
      "我买了一个本子。":
        "native": "I bought a notebook."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1641":
    "native": "envelope"
    "notes":
      "n1": "An envelope, for a letter. 信 (xìn) is a letter, and 封 (fēng) is a seal."
    "examples":
      "信封里有信。":
        "native": "There is a letter in the envelope."
        "bases":
          "有":
            "meaning": "to have; there is"
          "信":
            "meaning": "letter"
      "请买一个信封。": "Please buy an envelope."
  "zh-1642":
    "native": "postage stamp"
    "notes":
      "n1": "A stamp, for posting a letter. 邮 (yóu) is post."
    "examples":
      "邮票在信封上。": "The stamp is on the envelope."
      "我买邮票。": "I buy stamps."
  "zh-1643":
    "native": "wristwatch"
    "notes":
      "n1": "A watch, worn on the wrist. 表 (biǎo) is a watch or clock."
    "examples":
      "手表很贵。": "The watch is expensive."
      "他戴手表。":
        "native": "He wears a watch."
        "bases":
          "戴":
            "meaning": "to wear"
  "zh-1644":
    "native": "battery"
    "notes":
      "n1": "A battery, which gives power to a device. 电 (diàn) is electricity."
    "examples":
      "电池没电了。":
        "native": "The battery has run out of power."
        "bases":
          "没":
            "meaning": "not; did not"
          "电":
            "meaning": "electricity"
          "了":
            "meaning": "a particle: a change has happened"
      "我买了两个电池。":
        "native": "I bought two batteries."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1645":
    "native": "charger"
    "notes":
      "n1": "A charger, for charging a battery or a phone. 充 (chōng) is to fill."
    "examples":
      "充电器在哪儿？":
        "native": "Where is the charger?"
        "bases":
          "哪儿":
            "meaning": "where"
      "请带上充电器。": "Please bring the charger."
  "zh-1646":
    "native": "torch; flashlight"
    "notes":
      "n1": "A torch, for light in the dark. 筒 (tǒng) is a tube."
    "examples":
      "手电筒很亮。":
        "native": "The torch is very bright."
        "bases":
          "亮":
            "meaning": "bright"
      "晚上用手电筒照路。":
        "native": "At night use a torch to light the way."
        "bases":
          "用":
            "meaning": "to use"
          "照路":
            "meaning": "to light the way"
  "zh-1647":
    "native": "camera"
    "notes":
      "n1": "A camera, for taking photographs. 相 (xiàng) is a picture or photo."
    "examples":
      "相机很贵。": "The camera is expensive."
      "他用相机拍照片。":
        "native": "He takes photos with a camera."
        "bases":
          "用":
            "meaning": "to use"
          "拍":
            "meaning": "to take a photo; to pat"
  "zh-1648":
    "native": "photo"
    "notes":
      "n1": "A photograph, a picture taken by a camera. 照 (zhào) is to take a picture."
    "examples":
      "这张照片很好。": "This photo is very good."
      "我有很多照片。":
        "native": "I have a lot of photos."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1649":
    "native": "toothbrush"
    "notes":
      "n1": "A toothbrush, for cleaning the teeth. 牙 (yá) is a tooth."
    "examples":
      "牙刷在洗手间里。": "The toothbrush is in the bathroom."
      "我每天用牙刷。":
        "native": "I use a toothbrush every day."
        "bases":
          "每天":
            "meaning": "every day"
          "用":
            "meaning": "to use"
  "zh-1650":
    "native": "medicine"
    "notes":
      "n1": "Medicine, to cure an illness. 药店 (yàodiàn) is a pharmacy."
    "examples":
      "这个药很苦。": "This medicine is very bitter."
      "请吃药。": "Please take the medicine."
  "zh-1651":
    "native": "sticking plaster; band-aid"
    "notes":
      "n1": "A small sticking plaster, for a cut. 创 (chuāng) is a wound or cut."
    "examples":
      "手上有创可贴。":
        "native": "There is a plaster on the hand."
        "bases":
          "有":
            "meaning": "to have; there is"
      "我买了创可贴。":
        "native": "I bought a sticking plaster."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1652":
    "native": "kettle; water bottle"
    "notes":
      "n1": "A kettle for boiling water, or a bottle for carrying water. 壶 (hú) is a pot."
    "examples":
      "水壶里有开水。":
        "native": "There is boiled water in the kettle."
        "bases":
          "有":
            "meaning": "to have; there is"
      "我带着水壶。":
        "native": "I am carrying a water bottle."
        "bases":
          "着":
            "meaning": "a particle: an action goes on"
  "zh-1653":
    "native": "pot; pan"
    "notes":
      "n1": "A pot or a pan, for cooking. 锅子 (guōzi) is a cooking pot."
    "examples":
      "锅很热。": "The pan is very hot."
      "把水放在锅里。":
        "native": "Put the water in the pot."
        "bases":
          "把":
            "meaning": "the measure word for things with a handle"
  "zh-1654":
    "native": "card"
    "notes":
      "n1": "A card, such as a bank card or a credit card."
    "examples":
      "我的卡在包里。":
        "native": "My card is in the bag."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "这张卡不能用。":
        "native": "This card cannot be used."
        "bases":
          "能":
            "meaning": "can; may"
          "用":
            "meaning": "to use"
  "zh-1655":
    "native": "school bag"
    "notes":
      "n1": "A school bag, for books. 包 (bāo) is a bag."
    "examples":
      "孩子的书包很重。":
        "native": "The child's school bag is heavy."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "重":
            "meaning": "heavy"
      "书包里有书。":
        "native": "There are books in the school bag."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1656":
    "native": "folder"
    "notes":
      "n1": "A folder for keeping papers together. 文件 (wénjiàn) is a document."
    "examples":
      "文件夹在桌子上。": "The folder is on the table."
      "请把文件放进文件夹。":
        "native": "Please put the documents in the folder."
        "bases":
          "把":
            "meaning": "the measure word for things with a handle"
  "zh-1657":
    "native": "stapler"
    "notes":
      "n1": "A stapler, for fixing papers together. 订 (dìng) is to fix."
    "examples":
      "订书机没有钉子了。":
        "native": "The stapler has run out of staples."
        "bases":
          "没有":
            "meaning": "there is not; did not"
          "了":
            "meaning": "a particle: a change has happened"
      "请借我订书机。": "Please lend me the stapler."
  "zh-1658":
    "native": "calculator"
    "notes":
      "n1": "A calculator, for doing sums. 计算 (jìsuàn) is to calculate."
    "examples":
      "计算器很好用。":
        "native": "The calculator is easy to use."
        "bases":
          "用":
            "meaning": "to use"
      "用计算器算钱。":
        "native": "Work out the money with a calculator."
        "bases":
          "用":
            "meaning": "to use"
  "zh-1659":
    "native": "toy"
    "notes":
      "n1": "A toy, for children to play with. 玩 (wán) is to play."
    "examples":
      "孩子有很多玩具。":
        "native": "The child has a lot of toys."
        "bases":
          "有":
            "meaning": "to have; there is"
      "玩具在盒子里。": "The toys are in the box."
  "zh-1660":
    "native": "ball"
    "notes":
      "n1": "A ball, round, for games."
    "examples":
      "球很大。": "The ball is very big."
      "孩子踢球。":
        "native": "The children kick a ball."
        "bases":
          "踢":
            "meaning": "to kick"
  "zh-1661":
    "native": "building blocks"
    "notes":
      "n1": "Building blocks, for children to build with. 积 (jī) is to gather, and 木 (mù) is wood."
    "examples":
      "积木很漂亮。": "The building blocks are very pretty."
      "孩子用积木搭房子。":
        "native": "The child builds a house with blocks."
        "bases":
          "用":
            "meaning": "to use"
          "搭":
            "meaning": "to build"
  "zh-1662":
    "native": "gift; present"
    "notes":
      "n1": "A present, given to someone on a special day. 礼 (lǐ) is courtesy or a gift."
    "examples":
      "这是礼物。": "This is a present."
      "我买了一个礼物。":
        "native": "I bought a present."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1663":
    "native": "tissue; paper napkin"
    "notes":
      "n1": "A paper tissue, for wiping the face or hands. 巾 (jīn) is a cloth."
    "examples":
      "纸巾在包里。": "The tissues are in the bag."
      "请给我一张纸巾。":
        "native": "Please give me a tissue."
        "bases":
          "给":
            "meaning": "to give; for"
  "zh-1664":
    "native": "raincoat"
    "notes":
      "n1": "A raincoat, worn in the rain. 衣 (yī) is clothes."
    "examples":
      "雨衣很轻。":
        "native": "The raincoat is very light."
        "bases":
          "轻":
            "meaning": "light (not heavy)"
      "下雨了，穿雨衣吧。":
        "native": "It is raining; put on a raincoat."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1665":
    "native": "tool"
    "notes":
      "n1": "A tool, for doing a job with the hands. 工 (gōng) is work."
    "examples":
      "这些工具很好。":
        "native": "These tools are very good."
        "bases":
          "些":
            "meaning": "some"
      "用工具修椅子。":
        "native": "Mend the chair with tools."
        "bases":
          "用":
            "meaning": "to use"
          "修":
            "meaning": "to mend"
  "zh-1666":
    "native": "screwdriver"
    "notes":
      "n1": "A screwdriver, for turning screws. 螺丝 (luósī) is a screw."
    "examples":
      "螺丝刀在哪里？": "Where is the screwdriver?"
      "用螺丝刀拧螺丝。":
        "native": "Turn the screws with a screwdriver."
        "bases":
          "用":
            "meaning": "to use"
          "拧":
            "meaning": "to turn; to screw"
          "螺丝":
            "meaning": "screw"
  "zh-1667":
    "native": "hammer"
    "notes":
      "n1": "A hammer, for knocking in nails. 锤 (chuí) is to hit or knock."
    "examples":
      "锤子很重。":
        "native": "The hammer is heavy."
        "bases":
          "重":
            "meaning": "heavy"
      "用锤子敲钉子。":
        "native": "Knock the nail with a hammer."
        "bases":
          "用":
            "meaning": "to use"
          "敲":
            "meaning": "to knock"
  "zh-1668":
    "native": "rope; string"
    "notes":
      "n1": "A rope or string, for tying things."
    "examples":
      "绳子很长。": "The rope is very long."
      "用绳子绑箱子。":
        "native": "Tie the box with a rope."
        "bases":
          "用":
            "meaning": "to use"
          "绑":
            "meaning": "to tie"
  "zh-1669":
    "native": "basin; bowl"
    "notes":
      "n1": "A basin, a wide bowl for water or plants."
    "examples":
      "盆里有水。":
        "native": "There is water in the basin."
        "bases":
          "有":
            "meaning": "to have; there is"
      "花在盆里。": "The flower is in a pot."
  "zh-1670":
    "native": "broom"
    "notes":
      "n1": "A broom, for sweeping the floor. 扫 (sǎo) is to sweep."
    "examples":
      "扫帚在门旁边。": "The broom is next to the door."
      "用扫帚扫地。":
        "native": "Sweep the floor with a broom."
        "bases":
          "用":
            "meaning": "to use"
          "扫":
            "meaning": "to sweep"
          "地":
            "meaning": "ground"
  "zh-1671":
    "native": "cleaning cloth"
    "notes":
      "n1": "A cloth for wiping a table or a floor. 抹 (mā) is to wipe."
    "examples":
      "抹布很脏了。":
        "native": "The cleaning cloth is very dirty."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "用抹布擦桌子。":
        "native": "Wipe the table with a cloth."
        "bases":
          "用":
            "meaning": "to use"
  "zh-1672":
    "native": "lighter"
    "notes":
      "n1": "A lighter, for lighting a fire or a cigarette. 打 (dǎ) is to strike, and 火 (huǒ) is fire."
    "examples":
      "打火机没有气了。":
        "native": "The lighter has run out of gas."
        "bases":
          "没有":
            "meaning": "there is not; did not"
          "气":
            "meaning": "gas; air"
          "了":
            "meaning": "a particle: a change has happened"
      "请不要用打火机。":
        "native": "Please do not use a lighter."
        "bases":
          "要":
            "meaning": "must; to want"
          "用":
            "meaning": "to use"
  "zh-1673":
    "native": "nail"
    "notes":
      "n1": "A nail, a thin metal spike for fixing wood."
    "examples":
      "钉子很长。": "The nail is very long."
      "墙上有钉子。":
        "native": "There is a nail in the wall."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1674":
    "native": "electric wire; cable"
    "notes":
      "n1": "An electric wire, which carries power. 线 (xiàn) is a line or thread."
    "examples":
      "电线在墙里。": "The wire is in the wall."
      "电线很危险。": "Electric wires are dangerous."
  "zh-1675":
    "native": "socket"
    "notes":
      "n1": "A socket, where a plug goes in. 插 (chā) is to insert."
    "examples":
