      "请把充电器插在插座上。":
        "native": "Please plug the charger into the socket."
        "bases":
          "把":
            "meaning": "the measure word for things with a handle"
          "插":
            "meaning": "to insert; to plug in"
  "zh-1676":
    "native": "light bulb"
    "notes":
      "n1": "A light bulb, which lights a room. 泡 (pào) is a bubble or bulb."
    "examples":
      "灯泡坏了。":
        "native": "The light bulb has gone."
        "bases":
          "坏":
            "meaning": "broken"
          "了":
            "meaning": "a particle: a change has happened"
      "换一个灯泡。": "Change the light bulb."
  "zh-1677":
    "native": "newspaper"
    "notes":
      "n1": "A newspaper, printed every day or week. 报 (bào) is a report."
    "examples":
      "我每天看报纸。":
        "native": "I read the newspaper every day."
        "bases":
          "每天":
            "meaning": "every day"
      "报纸在桌子上。": "The newspaper is on the table."
  "zh-1678":
    "native": "magazine"
    "notes":
      "n1": "A magazine, printed regularly, with articles and pictures. 杂 (zá) is mixed."
    "examples":
      "杂志很好看。": "The magazine is very nice to look at."
      "他在看杂志。": "He is reading a magazine."
