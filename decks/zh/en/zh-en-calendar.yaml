"schema": 1
"id": "zh-en-calendar"
"kind": "layer"
"core": "zh-calendar"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Months and years"
"description": "Forty words for dates: the days of the week with numbers, the months and the years, the festivals and holidays, the start and end of a month, and the words for last, this and next. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1348":
    "native": "calendar"
    "notes":
      "n1": "A calendar, with the days of the year printed on it. 日 (rì) is a day, and 历 (lì) is a calendar."
    "examples":
      "墙上有一本日历。":
        "native": "There is a calendar on the wall."
        "bases":
          "有":
            "meaning": "to have; there is"
      "我在日历上写生日。": "I write the birthday on the calendar."
  "zh-1349":
    "native": "month (of the year)"
    "notes":
      "n1": "A month of the year, counted by number. 份 (fèn) is a share or part."
    "examples":
      "这个月份很热。": "This month is very hot."
      "哪个月份最冷？": "Which month is the coldest?"
  "zh-1350":
    "native": "year (a number of the year)"
    "notes":
      "n1": "A year, as a number, such as 2020. 年 (nián) is a year."
    "examples":
      "这张照片是哪年份？": "Which year is this photo from?"
      "年份很老了。":
        "native": "The year is very old."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1351":
    "native": "festival; holiday"
    "notes":
      "n1": "A festival, a day kept as a holiday. 节 (jié) is a festival."
    "examples":
      "中秋节是节日。":
        "native": "The Mid-Autumn Festival is a festival."
        "bases":
          "中秋节":
            "meaning": "Mid-Autumn Festival"
      "节日的时候很热闹。":
        "native": "At festival time it is very busy."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1352":
    "native": "holiday period"
    "notes":
      "n1": "A holiday period, a time away from work or school. 假 (jià) is a holiday."
    "examples":
      "这个假期很长。": "This holiday is very long."
      "假期我去旅行。": "In the holidays I go travelling."
  "zh-1353":
    "native": "day off; holiday"
    "notes":
      "n1": "A day off, when you do not work. 假日 (jiàrì) is the single day, and 假期 (jiàqī) the period."
    "examples":
      "周六是假日。": "Saturday is a day off."
      "假日我在家。": "On my day off I stay at home."
  "zh-1354":
    "native": "Monday"
    "notes":
      "n1": "Monday, the first day of the working week. 周 (zhōu) is the week, and 一 (yī) is one."
    "examples":
      "周一我上班。": "On Monday I go to work."
      "周一很忙。": "Monday is very busy."
  "zh-1355":
    "native": "Tuesday"
    "notes":
      "n1": "Tuesday, the second day of the week. 二 (èr) is two."
    "examples":
      "周二我去学校。": "On Tuesday I go to school."
      "周二下午有会。":
        "native": "There is a meeting on Tuesday afternoon."
        "bases":
          "有":
            "meaning": "to have; there is"
          "会":
            "meaning": "can; to know how to"
  "zh-1356":
    "native": "Wednesday"
    "notes":
      "n1": "Wednesday, the third day of the week. 三 (sān) is three."
    "examples":
      "周三我游泳。": "On Wednesday I swim."
      "周三很热。": "Wednesday is very hot."
  "zh-1357":
    "native": "Thursday"
    "notes":
      "n1": "Thursday, the fourth day of the week. 四 (sì) is four."
    "examples":
      "周四我休息。": "On Thursday I rest."
      "周四有会。":
        "native": "There is a meeting on Thursday."
        "bases":
          "有":
            "meaning": "to have; there is"
          "会":
            "meaning": "can; to know how to"
  "zh-1358":
    "native": "Friday"
    "notes":
      "n1": "Friday, the fifth day of the week. 五 (wǔ) is five."
    "examples":
      "周五我不上班。": "On Friday I do not go to work."
      "周五晚上我吃饭。": "On Friday evening I eat out."
  "zh-1359":
    "native": "Saturday"
    "notes":
      "n1": "Saturday, the sixth day of the week. 六 (liù) is six."
    "examples":
      "周六我们去公园。": "On Saturday we go to the park."
      "周六我很忙。": "I am very busy on Saturday."
  "zh-1360":
    "native": "Sunday"
    "notes":
      "n1": "Sunday, the seventh day of the week. 日 (rì) is the sun or a day."
    "examples":
      "周日我不工作。": "On Sunday I do not work."
      "周日很安静。": "Sunday is very quiet."
  "zh-1361":
    "native": "this year"
    "notes":
      "n1": "This year, the year we are in. 今 (jīn) is now or this."
    "examples":
      "今年我二十岁。": "This year I am twenty years old."
      "今年很热。": "This year is very hot."
  "zh-1362":
    "native": "last year"
    "notes":
      "n1": "Last year, the year before this one. 去 (qù) is to go; here it means past."
    "examples":
      "去年我去中国。": "Last year I went to China."
      "去年很冷。": "Last year was very cold."
  "zh-1363":
    "native": "next year"
    "notes":
      "n1": "Next year, the year after this one. 明 (míng) is bright, and here it means the coming."
    "examples":
      "明年我去中国。": "Next year I will go to China."
      "明年我工作。": "Next year I will work."
  "zh-1364":
    "native": "the year before last"
    "notes":
      "n1": "The year before last, two years ago. 前 (qián) is before."
    "examples":
      "前年我在北京。":
        "native": "I was in Beijing the year before last."
        "bases":
          "北京":
            "meaning": "Beijing"
      "前年的冬天很冷。":
        "native": "The winter two years ago was very cold."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1365":
    "native": "the year after next"
    "notes":
      "n1": "The year after next, two years from now. 后 (hòu) is after."
    "examples":
      "后年我结婚。":
        "native": "I will get married the year after next."
        "bases":
          "结婚":
            "meaning": "to marry"
      "后年的夏天我去旅行。":
        "native": "I will travel next summer, the year after next."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1366":
    "native": "New Year's Day"
    "notes":
      "n1": "New Year's Day, the first day of January. 元 (yuán) is the first, and 旦 (dàn) is a day."
    "examples":
      "元旦是一月一日。": "New Year's Day is the first of January."
      "元旦我休息。": "On New Year's Day I rest."
  "zh-1367":
    "native": "birthday"
    "notes":
      "n1": "A birthday, the day of a person's birth. 生 (shēng) is to be born, and 日 (rì) is a day."
    "examples":
      "这是我的生日。":
        "native": "It is my birthday."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "我的生日在五月。":
        "native": "My birthday is in May."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1368":
    "native": "date"
    "notes":
      "n1": "A date, a day in the calendar, given by its number. 期 (qī) is a period."
    "examples":
      "请写日期。": "Please write the date."
      "这个日期对吗？": "Is this date right?"
  "zh-1369":
    "native": "festival; section"
    "notes":
      "n1": "A festival, or a section of time, such as a school period. 节日 (jiérì) is a festival day."
    "examples":
      "春节是大节。":
        "native": "The Spring Festival is a big festival."
        "bases":
          "春节":
            "meaning": "Spring Festival"
      "这一节课很长。": "This class period is very long."
  "zh-1370":
    "native": "beginning of the month"
    "notes":
      "n1": "The first days of a month. 初 (chū) is the beginning."
    "examples":
      "月初我去学校。": "At the start of the month I go to school."
      "月初很忙。": "The start of the month is very busy."
  "zh-1371":
    "native": "end of the month"
    "notes":
      "n1": "The last days of a month. 底 (dǐ) is the bottom or end."
    "examples":
      "月底交报告。":
        "native": "Hand in the report at the end of the month."
        "bases":
          "交":
            "meaning": "to hand in; to pay"
      "月底我很累。": "At the end of the month I am very tired."
  "zh-1372":
    "native": "first ten days of the month"
    "notes":
      "n1": "The first ten days of a month. 旬 (xún) is a period of ten days."
    "examples":
      "上旬很热。": "The first ten days are very hot."
      "我上旬去北京。":
        "native": "I go to Beijing in the first ten days."
        "bases":
          "北京":
            "meaning": "Beijing"
  "zh-1373":
    "native": "middle ten days of the month"
    "notes":
      "n1": "The middle ten days of a month, from the 11th to the 20th. 中 (zhōng) is middle."
    "examples":
      "中旬下雨。": "It rains in the middle ten days."
      "中旬我休息。": "I rest in the middle ten days."
  "zh-1374":
    "native": "last ten days of the month"
    "notes":
      "n1": "The last ten days of a month. 下 (xià) is down or the end here."
    "examples":
      "下旬很冷。": "The last ten days are very cold."
      "我下旬回家。": "I go home in the last ten days."
  "zh-1375":
    "native": "this month"
    "notes":
      "n1": "This month, the month we are in. 本 (běn) is this."
    "examples":
      "本月我很忙。": "I am very busy this month."
      "本月的工资多了。":
        "native": "This month's pay is higher."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1376":
    "native": "next week"
    "notes":
      "n1": "The week after this one. 下 (xià) is next."
    "examples":
      "下周我去北京。":
        "native": "I go to Beijing next week."
        "bases":
          "北京":
            "meaning": "Beijing"
      "下周见！": "See you next week!"
  "zh-1377":
    "native": "last week"
    "notes":
      "n1": "The week before this one. 上 (shàng) is last here."
    "examples":
      "上周我很忙。": "I was very busy last week."
      "上周你在哪里？": "Where were you last week?"
  "zh-1378":
    "native": "every week; weekly"
    "notes":
      "n1": "Every week, weekly. 每 (měi) is every."
    "examples":
      "每周我去游泳。": "I go swimming every week."
      "每周都有会。":
        "native": "There is a meeting every week."
        "bases":
          "有":
            "meaning": "to have; there is"
          "会":
            "meaning": "can; to know how to"
  "zh-1379":
    "native": "every month; monthly"
    "notes":
      "n1": "Every month, monthly. 月 (yuè) is a month."
    "examples":
      "每月我付房租。": "I pay the rent every month."
      "每月的工资是多少？":
        "native": "How much is the monthly pay?"
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1380":
    "native": "every year; yearly"
    "notes":
      "n1": "Every year, yearly. 年 (nián) is a year."
    "examples":
      "每年我回家一次。": "I go home once every year."
      "每年夏天很热。": "Every summer is very hot."
  "zh-1381":
    "native": "lunar calendar"
    "notes":
      "n1": "The lunar calendar, by the moon, used for festivals. 农 (nóng) is farming, and 历 (lì) is a calendar."
    "examples":
      "春节是农历的节日。":
        "native": "The Spring Festival is a festival of the lunar calendar."
        "bases":
          "春节":
            "meaning": "Spring Festival"
          "的":
            "meaning": "a particle: of; belonging to"
      "农历的日期不一样。":
        "native": "The dates on the lunar calendar are different."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "一样":
            "meaning": "the same"
  "zh-1382":
    "native": "solar calendar"
    "notes":
      "n1": "The solar calendar, by the sun, which most people use. 公 (gōng) is public."
    "examples":
      "元旦是公历的节日。":
        "native": "New Year's Day is a holiday of the solar calendar."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "公历一月有三十一天。":
        "native": "January has thirty-one days in the solar calendar."
        "bases":
          "有":
            "meaning": "to have; there is"
          "三十一":
            "meaning": "thirty-one"
  "zh-1383":
    "native": "leap year"
    "notes":
      "n1": "A leap year, with an extra day in February. 闰 (rùn) is the extra part of a calendar."
    "examples":
      "今年是闰年。": "This year is a leap year."
      "闰年的二月有二十九天。":
        "native": "February in a leap year has twenty-nine days."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "有":
            "meaning": "to have; there is"
          "二十九":
            "meaning": "twenty-nine"
  "zh-1384":
    "native": "century"
    "notes":
      "n1": "A century, a hundred years. 世 (shì) is a generation, and 纪 (jì) is a record."
    "examples":
      "二十一世纪很快。":
        "native": "The twenty-first century is fast."
        "bases":
          "二十一":
            "meaning": "twenty-one"
      "这个房子有一个世纪了。":
        "native": "This house is a century old."
        "bases":
          "有":
            "meaning": "to have; there is"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1385":
    "native": "decade; era"
    "notes":
      "n1": "A decade or an era, a period of years. 代 (dài) is an age."
    "examples":
      "八十年代很热闹。": "The eighties were very lively."
      "这是哪个年代的房子？":
        "native": "Which era is this house from?"
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1386":
    "native": "period; time"
    "notes":
      "n1": "A period of time, a stage in history or life. 时 (shí) is time."
    "examples":
      "学习的时期很快过去了。":
        "native": "The time of study went by quickly."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "过去":
            "meaning": "past; over"
          "了":
            "meaning": "a particle: a change has happened"
      "这个时期天气很好。": "The weather is very good at this time."
  "zh-1387":
    "native": "schedule; agenda"
    "notes":
      "n1": "A schedule of the day or the week, the things you plan to do. 程 (chéng) is a process or course."
    "examples":
      "我的日程很满。":
        "native": "My schedule is very full."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "满":
            "meaning": "full"
      "请看今天的日程。":
        "native": "Please look at today's schedule."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
