"cards":
  "zh-1037":
    "confusables":
      "w1":
        "why": "车站 (chēzhàn) is a station, not a bank."
      "w2":
        "why": "超市 (chāoshì) is a supermarket, not a bank."
    "bases":
      "请问":
        "meaning": "excuse me; may I ask"
      "有":
        "meaning": "to have; there is"
      "银行":
        "meaning": "bank"
    "native": "Excuse me, is there a bank nearby?"
  "zh-1038":
    "confusables":
      "w1":
        "why": "左 (zuǒ) is left, the other way round."
      "w2":
        "why": "后 (hòu) is back or behind, not a turn."
    "native": "Go straight on, then turn right."
  "zh-1039":
    "confusables":
      "w1":
        "why": "旁边 (pángbiān) is beside, not across the way."
      "w2":
        "why": "地下 (dìxià) is underground, not across the road."
    "bases":
      "银行":
        "meaning": "bank"
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "The bank is in the building opposite."
  "zh-1040":
    "confusables":
      "w1":
        "why": "近 (jìn) is near, the opposite of far."
      "w2":
        "why": "公里 (gōnglǐ) is a unit of distance, not a word for far."
    "native": "The metro station is far from here."
  "zh-1041":
    "confusables":
      "w1":
        "why": "南 (nán) is south, the opposite direction."
      "w2":
        "why": "东 (dōng) is east, a different direction."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
      "往":
        "meaning": "towards"
    "native": "Cross the bridge and go north."
  "zh-1042":
    "confusables":
      "w1":
        "why": "楼 (lóu) is a building, not a floor of one."
      "w2":
        "why": "地下 (dìxià) is underground, not the third floor."
    "native": "He works on the third floor."
  "zh-1043":
    "confusables":
      "w1":
        "why": "那边 (nàbiān) is that side, the other way."
      "w2":
        "why": "哪边 (nǎbiān) is which side, a question."
    "bases":
      "到":
        "meaning": "to arrive; to reach"
    "native": "Please come this way."
  "zh-1044":
    "confusables":
      "w1":
        "why": "右 (yòu) is right, the other way."
      "w2":
        "why": "直 (zhí) is straight, not a turn."
    "native": "Turn left at the crossroads, and that is the school."
