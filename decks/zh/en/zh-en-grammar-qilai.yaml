"name": "看起来 (kàn qǐlai): it looks or seems"
"license": "CC-BY-SA-4.0"
"description": "起来 (qǐlai) after a verb or adjective gives a judgement from what can be seen: 这个看起来很好 (zhè ge kàn qǐlai hěn hǎo), this looks good. Not yet checked by a Mandarin speaker: please report any mistake."
"tags":
