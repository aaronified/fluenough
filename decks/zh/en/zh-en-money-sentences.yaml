"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Money in sentences"
"description": "Eight sentences about money: saving and spending, bills, debts, prices and investment. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "zh-4507":
    "native": "We should save money first, then spend it."
    "confusables":
      "w1":
        "why": "储蓄 is savings as a whole; 存钱 is the act of putting money aside, so the two are close but not the same."
      "w2":
        "why": "理财 is managing money in general, not the order of saving and spending in this sentence."
    "bases":
      "存钱":
        "meaning": "to save money"
  "zh-4508":
    "native": "This month's salary is not enough to pay the rent."
    "confusables":
      "w1":
        "why": "薪水 is the spoken near-synonym of 工资 for pay; the sentence is about pay, so it fits either word."
      "w2":
        "why": "收入 is all the money coming in, not only pay from a job."
    "bases":
      "这个月":
        "meaning": "this month"
      "的":
        "meaning": "particle"
      "不够":
        "meaning": "not enough"
  "zh-4509":
    "native": "If your bank card is lost, report it as soon as possible."
    "confusables":
      "w1":
        "why": "信用卡 is a card you borrow on and pay back later; a lost 银行卡 is one linked to your own money."
      "w2":
        "why": "账户 is the account itself, the thing the card opens; the sentence is about the card, not the account."
    "bases":
      "了":
        "meaning": "particle"
      "要":
        "meaning": "must"
      "尽快":
        "meaning": "as soon as possible"
  "zh-4510":
    "native": "Inflation makes prices higher and higher."
    "confusables":
      "w1":
        "why": "价格 is the price of one item; 物价 is the general level of prices, which is what inflation raises."
      "w2":
        "why": "利率 is the interest rate, a different measure that central banks set to fight inflation."
    "bases":
      "让":
        "meaning": "to make"
      "越来越":
        "meaning": "more and more"
  "zh-4511":
    "native": "He borrowed money from a friend and now cannot pay it back."
    "confusables":
      "w1":
        "why": "欠钱 is owing money, which describes the same debt; the sentence is about borrowing and then not being able to repay."
      "w2":
        "why": "还钱 is paying back; the sentence says he cannot do it, so the sentence is about failing to pay."
    "bases":
      "了":
        "meaning": "particle"
      "的":
        "meaning": "particle"
      "还不起":
        "meaning": "cannot repay"
  "zh-4512":
    "native": "This piece of clothing is very expensive, and we cannot afford it."
    "confusables":
      "w1":
        "why": "廉价 means cheap, the opposite of this sentence; a learner may choose it by the sense of price alone."
      "w2":
        "why": "奢侈 is about spending on luxury, a judgement on the buyer rather than the price of the item."
    "bases":
      "这件":
        "meaning": "this"
      "买不起":
        "meaning": "cannot afford"
  "zh-4513":
    "native": "His assets are more than his debts."
    "confusables":
      "w1":
        "why": "财产 is what a person owns; 资产 is the accounting word for what a firm or bank holds."
      "w2":
        "why": "债务 is a debt, the thing that 负债 counts on the other side of the balance."
    "bases":
      "他的":
        "meaning": "his"
      "比":
        "meaning": "than"
  "zh-4514":
    "native": "He bought a fund and hopes to make money."
    "confusables":
      "w1":
        "why": "股票 is a share in one company; a fund holds many shares, so the two are different investments."
      "w2":
        "why": "股市 is the whole market where shares are traded, not one investment."
    "bases":
      "了":
        "meaning": "particle"
      "能":
        "meaning": "can"
