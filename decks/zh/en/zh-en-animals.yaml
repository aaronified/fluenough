"schema": 1
"id": "zh-en-animals"
"kind": "layer"
"core": "zh-animals"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Animals"
"description": "Thirty-five words for animals: pets and farm animals, birds and fish and insects, the zoo's big animals, and what they eat and do. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1518":
    "native": "animal"
    "notes":
      "n1": "An animal, any living creature that is not a plant. 物 (wù) is a thing."
    "examples":
      "这是什么动物？": "What animal is this?"
      "动物很可爱。": "The animals are very cute."
  "zh-1519":
    "native": "dog"
    "notes":
      "n1": "A dog, a pet that barks. 狗 (gǒu) is the word for dog."
    "examples":
      "这只狗很聪明。": "This dog is very clever."
      "狗喜欢跑步。": "Dogs like running."
  "zh-1520":
    "native": "cat"
    "notes":
      "n1": "A cat, a pet that catches mice."
    "examples":
      "我家有一只猫。":
        "native": "We have a cat at home."
        "bases":
          "有":
            "meaning": "to have; there is"
      "猫在床上睡觉。": "The cat sleeps on the bed."
  "zh-1521":
    "native": "bird"
    "notes":
      "n1": "A bird, which flies and sings. 鸡 (jī) is a chicken, a different bird."
    "examples":
      "鸟在树上唱歌。": "The bird sings in the tree."
      "鸟会飞。":
        "native": "Birds can fly."
        "bases":
          "会":
            "meaning": "can; to know how to"
          "飞":
            "meaning": "to fly"
  "zh-1522":
    "native": "pig"
    "notes":
      "n1": "A pig, a farm animal whose meat is pork. 猪肉 (zhūròu) is pork."
    "examples":
      "猪在院子里。": "The pig is in the yard."
      "猪很胖。": "The pig is very fat."
  "zh-1523":
    "native": "cow; ox"
    "notes":
      "n1": "A cow, a farm animal that gives milk. 牛奶 (niúnǎi) is milk."
    "examples":
      "牛在草地上吃草。":
        "native": "The cow eats grass in the field."
        "bases":
          "草地":
            "meaning": "grassland; a lawn"
      "牛很大。": "The cow is very big."
  "zh-1524":
    "native": "sheep; goat"
    "notes":
      "n1": "A sheep or a goat, a farm animal with wool or milk. 羊肉 (yángròu) is mutton."
    "examples":
      "羊很可爱。": "The sheep is very cute."
      "羊在草地上。":
        "native": "The sheep is on the grass."
        "bases":
          "草地":
            "meaning": "grassland; a lawn"
  "zh-1525":
    "native": "rabbit"
    "notes":
      "n1": "A rabbit, a small animal with long ears."
    "examples":
      "兔子很快。": "The rabbit is very fast."
      "孩子喜欢兔子。": "Children like rabbits."
  "zh-1526":
    "native": "tiger"
    "notes":
      "n1": "A tiger, a big striped cat in the forest. 老 (lǎo) is old, and 虎 (hǔ) is a tiger."
    "examples":
      "老虎吃肉。": "The tiger eats meat."
      "老虎很大。": "The tiger is very big."
  "zh-1527":
    "native": "lion"
    "notes":
      "n1": "A lion, the big cat of the grasslands."
    "examples":
      "狮子很强。":
        "native": "The lion is very strong."
        "bases":
          "强":
            "meaning": "strong"
      "狮子在草原上。":
        "native": "The lion is on the grassland."
        "bases":
          "草原":
            "meaning": "grassland; prairie"
  "zh-1528":
    "native": "elephant"
    "notes":
      "n1": "An elephant, the biggest land animal, with a long trunk."
    "examples":
      "大象吃草。": "The elephant eats grass."
      "大象很大。": "The elephant is very big."
  "zh-1529":
    "native": "panda"
    "notes":
      "n1": "A giant panda, black and white, that eats bamboo."
    "examples":
      "熊猫很可爱。": "The panda is very cute."
      "熊猫吃竹子。":
        "native": "The panda eats bamboo."
        "bases":
          "竹子":
            "meaning": "bamboo"
  "zh-1530":
    "native": "monkey"
    "notes":
      "n1": "A monkey, which climbs trees. 子 (zi) makes it a noun."
    "examples":
      "猴子喜欢吃香蕉。": "Monkeys like to eat bananas."
      "猴子在树上。": "The monkey is in the tree."
  "zh-1531":
    "native": "snake"
    "notes":
      "n1": "A snake, which has no legs."
    "examples":
      "蛇很长。": "The snake is very long."
      "草里有蛇。":
        "native": "There is a snake in the grass."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1532":
    "native": "frog"
    "notes":
      "n1": "A frog, a green animal that jumps and lives in water."
    "examples":
      "青蛙在水里。": "The frog is in the water."
      "青蛙会跳。":
        "native": "Frogs can jump."
        "bases":
          "会":
            "meaning": "can; to know how to"
          "跳":
            "meaning": "to jump"
  "zh-1533":
    "native": "butterfly"
    "notes":
      "n1": "A butterfly, with coloured wings."
    "examples":
      "蝴蝶很漂亮。": "The butterfly is very pretty."
      "花上有蝴蝶。":
        "native": "There is a butterfly on the flower."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1534":
    "native": "bee"
    "notes":
      "n1": "A bee, which makes honey. 蜜 (mì) is honey."
    "examples":
      "蜜蜂在花里。": "The bees are in the flowers."
      "蜜蜂做蜂蜜。": "Bees make honey."
  "zh-1535":
    "native": "ant"
    "notes":
      "n1": "An ant, a very small insect that lives in groups."
    "examples":
      "蚂蚁很小。": "The ant is very small."
      "蚂蚁在地上走。":
        "native": "The ants walk on the ground."
        "bases":
          "地上":
            "meaning": "on the ground"
  "zh-1536":
    "native": "mosquito"
    "notes":
      "n1": "A mosquito, which bites and makes you itch."
    "examples":
      "蚊子咬我。":
        "native": "A mosquito bites me."
        "bases":
          "咬":
            "meaning": "to bite"
      "晚上蚊子很多。": "There are a lot of mosquitoes at night."
  "zh-1537":
    "native": "fly"
    "notes":
      "n1": "A house fly, a small insect that lands on food."
    "examples":
      "苍蝇在饭上。": "A fly is on the food."
      "苍蝇很多。": "There are a lot of flies."
  "zh-1538":
    "native": "spider"
    "notes":
      "n1": "A spider, which spins a web."
    "examples":
      "蜘蛛在窗户上。": "A spider is on the window."
      "蜘蛛很可怕。":
        "native": "Spiders are very frightening."
        "bases":
          "可怕":
            "meaning": "frightening"
  "zh-1539":
    "native": "deer"
    "notes":
      "n1": "A deer, with antlers, in the forest."
    "examples":
      "鹿在森林里。": "The deer is in the forest."
      "鹿跑得很快。":
        "native": "The deer runs very fast."
        "bases":
          "得":
            "meaning": "a particle after a verb: how it is done"
  "zh-1540":
    "native": "bear"
    "notes":
      "n1": "A bear, a big furry animal of the forest."
    "examples":
      "熊很大。": "The bear is very big."
      "熊在山上。": "The bear is on the mountain."
  "zh-1541":
    "native": "wolf"
    "notes":
      "n1": "A wolf, a wild dog that hunts in packs."
    "examples":
      "狼在山里。": "The wolf is in the mountains."
      "狼很聪明。": "The wolf is very clever."
  "zh-1542":
    "native": "dolphin"
    "notes":
      "n1": "A dolphin, a clever sea animal."
    "examples":
      "海豚会游泳。":
        "native": "Dolphins can swim."
        "bases":
          "会":
            "meaning": "can; to know how to"
      "海豚在海里。": "The dolphins are in the sea."
  "zh-1543":
    "native": "whale"
    "notes":
      "n1": "A whale, the biggest animal in the sea."
    "examples":
      "鲸鱼很大。": "The whale is very big."
      "鲸鱼在海里。": "The whale is in the sea."
  "zh-1544":
    "native": "penguin"
    "notes":
      "n1": "A penguin, a bird that cannot fly and lives in cold places."
    "examples":
      "企鹅不会飞。":
        "native": "Penguins cannot fly."
        "bases":
          "会":
            "meaning": "can; to know how to"
          "飞":
            "meaning": "to fly"
      "企鹅很可爱。": "The penguin is very cute."
  "zh-1545":
    "native": "giraffe"
    "notes":
      "n1": "A giraffe, with a very long neck. 长 (cháng) is long and 颈 (jǐng) is neck."
    "examples":
      "长颈鹿很高。": "The giraffe is very tall."
      "长颈鹿吃树叶。": "The giraffe eats leaves."
  "zh-1546":
    "native": "zebra"
    "notes":
      "n1": "A zebra, a horse-like animal with black and white stripes. 斑 (bān) is a spot or stripe."
    "examples":
      "斑马很漂亮。": "The zebra is very pretty."
      "斑马有条纹。":
        "native": "The zebra has stripes."
        "bases":
          "有":
            "meaning": "to have; there is"
          "条纹":
            "meaning": "stripes"
  "zh-1547":
    "native": "turtle; tortoise"
    "notes":
      "n1": "A turtle, with a hard shell, which moves slowly."
    "examples":
      "乌龟很慢。": "The turtle is very slow."
      "乌龟在水里。": "The turtle is in the water."
  "zh-1548":
    "native": "zoo"
    "notes":
      "n1": "A zoo, where animals are kept for people to see. 园 (yuán) is a garden."
    "examples":
      "我们去动物园看大象。": "We go to the zoo to see the elephants."
      "动物园很大。": "The zoo is very big."
  "zh-1549":
    "native": "pet"
    "notes":
      "n1": "A pet, an animal kept at home for company. 宠 (chǒng) is to pet or spoil."
    "examples":
      "我有一只宠物狗。":
        "native": "I have a pet dog."
        "bases":
          "有":
            "meaning": "to have; there is"
      "宠物需要照顾。":
        "native": "Pets need looking after."
        "bases":
          "照顾":
            "meaning": "to look after"
  "zh-1550":
    "native": "animal feed"
    "notes":
      "n1": "Food for animals on a farm. 饲 (sì) is to feed an animal."
    "examples":
      "牛吃饲料。": "The cows eat feed."
      "饲料在仓库里。":
        "native": "The feed is in the store."
        "bases":
          "仓库":
            "meaning": "warehouse; store"
  "zh-1551":
    "native": "to graze; to eat grass"
    "notes":
      "n1": "To eat grass, as a cow or a horse does."
    "examples":
      "马在草地上吃草。":
        "native": "The horse is grazing on the grass."
        "bases":
          "草地":
            "meaning": "grassland; a lawn"
      "羊喜欢吃草。": "Sheep like to graze."
  "zh-1552":
    "native": "to keep; to raise (animals or plants)"
    "notes":
      "n1": "To keep an animal or plant and look after it. 养 (yǎng) is to raise."
    "examples":
      "我养了一只猫。":
        "native": "I have kept a cat."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "他养鸟。": "He keeps birds."
