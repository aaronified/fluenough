"name": "把 (bǎ) with the object in sentences"
"description": "Sentences that move the object in front of the verb with 把 (bǎ), to say what was done to it: 把门关上 (close the door), 把饭吃完 (finish the meal). Not yet checked by a Mandarin speaker: please report any mistake."
