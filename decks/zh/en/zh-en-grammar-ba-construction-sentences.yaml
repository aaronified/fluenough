"cards":
  "zh-2280":
    "confusables":
      "w1":
        "why": "开 (kāi) is to open, the opposite of closing."
      "w2":
        "why": "锁 (suǒ) is a lock, a thing not an action."
    "bases":
      "把":
        "meaning": "a particle that puts the object before the verb"
    "native": "Please close the door."
  "zh-2281":
    "confusables":
      "w1":
        "why": "喝 (hē) is to drink, not to eat."
      "w2":
        "why": "买 (mǎi) is to buy, before eating."
    "bases":
      "把":
        "meaning": "a particle that puts the object before the verb"
      "完":
        "meaning": "finished"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "He has finished the meal."
  "zh-2282":
    "confusables":
      "w1":
        "why": "读 (dú) is to read, not to write."
      "w2":
        "why": "练习 (liànxí) is to practise, not to finish."
    "bases":
      "把":
        "meaning": "a particle that puts the object before the verb"
      "完":
        "meaning": "finished"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "I have finished the homework."
  "zh-2283":
    "confusables":
      "w1":
        "why": "脏 (zāng) is dirty, the opposite state."
      "w2":
        "why": "晒 (shài) is to dry in the sun, another step."
    "bases":
      "把":
        "meaning": "a particle that puts the object before the verb"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "Mum has washed the clothes clean."
  "zh-2284":
    "confusables":
      "w1":
        "why": "带 (dài) is to bring, not to put down."
      "w2":
        "why": "送 (sòng) is to give, not to put."
    "bases":
      "把":
        "meaning": "a particle that puts the object before the verb"
    "native": "Please put the book on the table."
  "zh-2285":
    "confusables":
      "w1":
        "why": "借 (jiè) is to borrow, not to give."
      "w2":
        "why": "买 (mǎi) is to buy, not to give."
    "bases":
      "把":
        "meaning": "a particle that puts the object before the verb"
      "给":
        "meaning": "to give; for"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "He has given me the book."
  "zh-2286":
    "confusables":
      "w1":
        "why": "整理 (zhěnglǐ) is to tidy, a close word."
      "w2":
        "why": "打扫 (dǎsǎo) is to clean, a close word."
    "bases":
      "把":
        "meaning": "a particle that puts the object before the verb"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "I have tidied the room."
  "zh-2287":
    "confusables":
      "w1":
        "why": "丢 (diū) is to lose, a different result."
      "w2":
        "why": "找 (zhǎo) is to look for, not to put."
    "bases":
      "把":
        "meaning": "a particle that puts the object before the verb"
      "哪儿":
        "meaning": "where"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "Where did you put the keys?"
