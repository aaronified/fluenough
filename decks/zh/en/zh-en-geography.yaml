"schema": 1
"id": "zh-en-geography"
"kind": "layer"
"core": "zh-geography"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Geography"
"description": "Forty words for the shape of a country and its places: the land, the sea and the mountains, the regions and the borders, the people and the cities, and the climate and the resources. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-2759":
    "native": "geography"
    "notes":
      "n1": "The land, the water and the places on the earth. 地 (dì) is the ground, and 理 (lǐ) is a pattern."
    "examples":
      "我喜欢地理。": "I like geography."
      "这本书讲地理。": "This book is about geography."
  "zh-2760":
    "native": "continent; mainland"
    "notes":
      "n1": "A large area of land. 大 (dà) is big, and 陆 (lù) is land."
    "examples":
      "亚洲是一块大陆。":
        "native": "Asia is a continent."
        "bases":
          "亚洲":
            "meaning": "Asia"
          "块":
            "meaning": "measure word for lumps and pieces"
      "这个岛离大陆很远。": "This island is far from the mainland."
  "zh-2761":
    "native": "peninsula"
    "notes":
      "n1": "Land that sticks out into the sea, joined on one side. 半 (bàn) is half, and 岛 (dǎo) is an island."
    "examples":
      "这里是一个半岛。":
        "native": "This is a peninsula."
        "bases":
          "这里":
            "meaning": "here"
      "半岛的海很清。":
        "native": "The sea around the peninsula is very clear."
        "bases":
          "的":
            "meaning": "of"
          "清":
            "meaning": "clear"
  "zh-2762":
    "native": "strait"
    "notes":
      "n1": "A narrow passage of sea between two pieces of land. 海 (hǎi) is the sea, and 峡 (xiá) is a gorge."
    "examples":
      "船过了海峡。":
        "native": "The ship went through the strait."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "海峡很窄。": "The strait is very narrow."
  "zh-2763":
    "native": "border"
    "notes":
      "n1": "The line between two countries or areas. 边 (biān) is an edge, and 界 (jiè) is a boundary."
    "examples":
      "两国的边界很长。":
        "native": "The border between the two countries is very long."
        "bases":
          "的":
            "meaning": "of"
      "我们在边界上过了海关。":
        "native": "We went through customs at the border."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2764":
    "native": "capital (city)"
    "notes":
      "n1": "The main city of a country. 首 (shǒu) is first, and 都 (dū) is a capital."
    "examples":
      "北京是中国的首都。":
        "native": "Beijing is the capital of China."
        "bases":
          "北京":
            "meaning": "Beijing"
          "的":
            "meaning": "of"
      "首都很大。": "The capital is very big."
  "zh-2765":
    "native": "capital (of a province or region)"
    "notes":
      "n1": "The main city of a province or region. 首 (shǒu) is first, and 府 (fǔ) is a seat of government."
    "examples":
      "这个省的首府在哪里？":
        "native": "Where is the capital of this province?"
        "bases":
          "的":
            "meaning": "of"
      "首府的人口很多。":
        "native": "The regional capital has many people."
        "bases":
          "的":
            "meaning": "of"
  "zh-2766":
    "native": "province"
    "notes":
      "n1": "A large area inside a country. 省 (shěng) is a province."
    "examples":
      "中国有很多省。":
        "native": "China has many provinces."
        "bases":
          "有":
            "meaning": "to have"
      "这个省很大。": "This province is very big."
  "zh-2767":
    "native": "state; region"
    "notes":
      "n1": "A large area of a country, under its own government. 州 (zhōu) is a state."
    "examples":
      "这个州很大。": "This state is very big."
      "州的首府在中间。":
        "native": "The state capital is in the middle."
        "bases":
          "的":
            "meaning": "of"
  "zh-2768":
    "native": "county"
    "notes":
      "n1": "A smaller area inside a province. 县 (xiàn) is a county."
    "examples":
      "这个县很小。": "This county is very small."
      "县里有很多村。":
        "native": "There are many villages in the county."
        "bases":
          "有":
            "meaning": "to have"
  "zh-2769":
    "native": "district"
    "notes":
      "n1": "A part of a city. 区 (qū) is a district."
    "examples":
      "我住在这个区。": "I live in this district."
      "这个区很安静。": "This district is very quiet."
  "zh-2770":
    "native": "town"
    "notes":
      "n1": "A small town. 镇 (zhèn) is a town."
    "examples":
      "这个镇很小。": "This town is very small."
      "镇上有一个市场。":
        "native": "There is a market in the town."
        "bases":
          "有":
            "meaning": "to have"
  "zh-2771":
    "native": "village"
    "notes":
      "n1": "A small place in the countryside. 村 (cūn) is a village."
    "examples":
      "我们的村很美。":
        "native": "Our village is very beautiful."
        "bases":
          "的":
            "meaning": "of"
          "美":
            "meaning": "beautiful"
      "村里很安静。": "The village is very quiet."
  "zh-2772":
    "native": "countryside"
    "notes":
      "n1": "The land outside the towns. 乡 (xiāng) is a rural area, and 村 (cūn) is a village."
    "examples":
      "我喜欢乡村的生活。":
        "native": "I like life in the countryside."
        "bases":
          "的":
            "meaning": "of"
          "生活":
            "meaning": "life"
      "乡村的空气很好。":
        "native": "The air in the countryside is very good."
        "bases":
          "的":
            "meaning": "of"
  "zh-2773":
    "native": "street"
    "notes":
      "n1": "A road in a town. 街 (jiē) is a street, and 道 (dào) is a road."
    "examples":
      "这条街道很长。":
        "native": "This street is very long."
        "bases":
          "条":
            "meaning": "measure word for long things"
      "街道上人很多。": "There are many people on the street."
  "zh-2774":
    "native": "population"
    "notes":
      "n1": "The number of people who live in a place. 人 (rén) is a person, and 口 (kǒu) is a mouth."
    "examples":
      "中国的人口很多。":
        "native": "China has a large population."
        "bases":
          "的":
            "meaning": "of"
      "这个城市的人口在增加。":
        "native": "The population of this city is growing."
        "bases":
          "的":
            "meaning": "of"
  "zh-2775":
    "native": "area (size of land)"
    "notes":
      "n1": "How much land a place covers. 面 (miàn) is a surface, and 积 (jī) is a total."
    "examples":
      "这个国家的面积很大。":
        "native": "This country's area is very large."
        "bases":
          "的":
            "meaning": "of"
      "面积有多大？":
        "native": "How big is the area?"
        "bases":
          "有":
            "meaning": "to have"
  "zh-2776":
    "native": "area; region"
    "notes":
      "n1": "A part of the land. 地 (dì) is ground, and 区 (qū) is a district."
    "examples":
      "这个地区很干燥。": "This region is very dry."
      "北方的地区很冷。":
        "native": "The northern regions are very cold."
        "bases":
          "的":
            "meaning": "of"
  "zh-2777":
    "native": "the south"
    "notes":
      "n1": "The southern part of a country. 南 (nán) is south, and 方 (fāng) is a direction."
    "examples":
      "南方很热。": "The south is very hot."
      "我住在南方。": "I live in the south."
  "zh-2778":
    "native": "the north"
    "notes":
      "n1": "The northern part of a country. 北 (běi) is north, and 方 (fāng) is a direction."
    "examples":
      "北方很冷。": "The north is very cold."
      "北方的冬天很长。":
        "native": "The winter in the north is very long."
        "bases":
          "的":
            "meaning": "of"
  "zh-2779":
    "native": "eastern part"
    "notes":
      "n1": "The east of a country. 东 (dōng) is east, and 部 (bù) is a part."
    "examples":
      "东部有很多城市。":
        "native": "The east has many cities."
        "bases":
          "有":
            "meaning": "to have"
      "东部的海很大。":
        "native": "The sea in the east is very big."
        "bases":
          "的":
            "meaning": "of"
  "zh-2780":
    "native": "western part"
    "notes":
      "n1": "The west of a country. 西 (xī) is west, and 部 (bù) is a part."
    "examples":
      "西部的山很高。":
        "native": "The mountains in the west are very high."
        "bases":
          "的":
            "meaning": "of"
      "西部的人口不多。":
        "native": "The west does not have many people."
        "bases":
          "的":
            "meaning": "of"
  "zh-2781":
    "native": "central part"
    "notes":
      "n1": "The middle of a country. 中 (zhōng) is middle, and 部 (bù) is a part."
    "examples":
      "中部有一条大河。":
        "native": "There is a big river in the central part."
        "bases":
          "有":
            "meaning": "to have"
          "条":
            "meaning": "measure word for long things"
      "中部的气候很好。":
        "native": "The climate in the centre is very good."
        "bases":
          "的":
            "meaning": "of"
  "zh-2782":
    "native": "coastal area"
    "notes":
      "n1": "The land along the coast. 沿 (yán) is along, and 海 (hǎi) is the sea."
    "examples":
      "沿海的城市很热闹。":
        "native": "The coastal cities are very lively."
        "bases":
          "的":
            "meaning": "of"
      "沿海有很多港口。":
        "native": "There are many ports along the coast."
        "bases":
          "有":
            "meaning": "to have"
  "zh-2783":
    "native": "inland"
    "notes":
      "n1": "The land away from the sea. 内 (nèi) is inside, and 陆 (lù) is land."
    "examples":
      "内陆的气候很干。":
        "native": "The inland climate is very dry."
        "bases":
          "的":
            "meaning": "of"
          "干":
            "meaning": "dry"
      "这个城市在内陆。": "This city is inland."
  "zh-2784":
    "native": "port"
    "notes":
      "n1": "A place where ships load and unload. 港 (gǎng) is a harbour, and 口 (kǒu) is an opening."
    "examples":
      "这个港口很大。": "This port is very big."
      "船停在港口。":
        "native": "The ship is docked at the port."
        "bases":
          "停":
            "meaning": "to stop; to park"
  "zh-2785":
    "native": "mountain range"
    "notes":
      "n1": "A long line of mountains. 山 (shān) is a mountain, and 脉 (mài) is a vein or a range."
    "examples":
      "这条山脉很长。":
        "native": "This mountain range is very long."
        "bases":
          "条":
            "meaning": "measure word for long things"
      "山脉的北边很冷。":
        "native": "The north side of the range is very cold."
        "bases":
          "的":
            "meaning": "of"
          "北边":
            "meaning": "the north side"
  "zh-2786":
    "native": "plain"
    "notes":
      "n1": "A large flat area of land. 平 (píng) is flat, and 原 (yuán) is a plain."
    "examples":
      "这里是一大片平原。":
        "native": "This is a large plain."
        "bases":
          "这里":
            "meaning": "here"
      "平原上有很多农田。":
        "native": "There are many fields on the plain."
        "bases":
          "有":
            "meaning": "to have"
          "农田":
            "meaning": "farmland"
  "zh-2787":
    "native": "basin"
    "notes":
      "n1": "A low area of land with hills around it. 盆 (pén) is a basin, and 地 (dì) is ground."
    "examples":
      "四川是一个盆地。":
        "native": "Sichuan is a basin."
        "bases":
          "四川":
            "meaning": "Sichuan"
      "盆地里很热。": "It is very hot in the basin."
  "zh-2788":
    "native": "altitude"
    "notes":
      "n1": "The height of a place above the sea. 海 (hǎi) is the sea, and 拔 (bá) is to rise."
    "examples":
      "这座山的海拔很高。":
        "native": "This mountain is very high above the sea."
        "bases":
          "座":
            "meaning": "measure word for mountains and buildings"
          "的":
            "meaning": "of"
      "海拔高的地方很冷。":
        "native": "High places are very cold."
        "bases":
          "的":
            "meaning": "of"
  "zh-2789":
    "native": "latitude"
    "notes":
      "n1": "The distance north or south of the equator. 纬 (wěi) is latitude, and 度 (dù) is a degree."
    "examples":
      "北京的纬度很高。":
        "native": "Beijing is at a high latitude."
        "bases":
          "北京":
            "meaning": "Beijing"
          "的":
            "meaning": "of"
      "纬度越高，天气越冷。":
        "native": "The higher the latitude, the colder the weather."
        "bases":
          "越":
            "meaning": "the more ... the more"
  "zh-2790":
    "native": "longitude"
    "notes":
      "n1": "The distance east or west of a fixed line. 经 (jīng) is a line, and 度 (dù) is a degree."
    "examples":
      "这个城市的经度是多少？":
        "native": "What is the longitude of this city?"
        "bases":
          "的":
            "meaning": "of"
      "经度和纬度不同。":
        "native": "Longitude and latitude are different."
        "bases":
          "和":
            "meaning": "and"
          "不同":
            "meaning": "different"
  "zh-2791":
    "native": "monsoon"
    "notes":
      "n1": "A wind that changes with the season. 季 (jì) is a season, and 风 (fēng) is wind."
    "examples":
      "夏天有季风。":
        "native": "There is a monsoon in summer."
        "bases":
          "有":
            "meaning": "to have"
      "季风带来了雨。":
        "native": "The monsoon brought rain."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2792":
    "native": "temperate zone"
    "notes":
      "n1": "A zone of the earth with mild seasons. 温 (wēn) is warm, and 带 (dài) is a zone."
    "examples":
      "这里是温带。":
        "native": "This is a temperate zone."
        "bases":
          "这里":
            "meaning": "here"
      "温带的夏天不太热。":
        "native": "Summers in a temperate zone are not too hot."
        "bases":
          "的":
            "meaning": "of"
  "zh-2793":
    "native": "tropics"
    "notes":
      "n1": "A hot zone of the earth near the equator. 热 (rè) is hot, and 带 (dài) is a zone."
    "examples":
      "热带很热。": "The tropics are very hot."
      "热带的雨林很大。":
        "native": "The tropical rainforest is very big."
        "bases":
          "的":
            "meaning": "of"
  "zh-2794":
    "native": "humid; moist"
    "notes":
      "n1": "Slightly wet. 湿 (shī) is wet, and 润 (rùn) is moist."
    "examples":
      "这里的气候很湿润。":
        "native": "The climate here is very humid."
        "bases":
          "这里":
            "meaning": "here"
          "的":
            "meaning": "of"
      "空气很湿润。": "The air is very moist."
  "zh-2795":
    "native": "soil"
    "notes":
      "n1": "The earth in which plants grow. 土 (tǔ) is earth, and 壤 (rǎng) is soil."
    "examples":
      "这里的土壤很好。":
        "native": "The soil here is very good."
        "bases":
          "这里":
            "meaning": "here"
          "的":
            "meaning": "of"
      "土壤里有很多水。":
        "native": "There is a lot of water in the soil."
        "bases":
          "有":
            "meaning": "to have"
  "zh-2796":
    "native": "resource"
    "notes":
      "n1": "Things that a country can use. 资 (zī) is money or material, and 源 (yuán) is a source."
    "examples":
      "这个国家的资源很多。":
        "native": "This country has many resources."
        "bases":
          "的":
            "meaning": "of"
      "我们要保护资源。":
        "native": "We must protect the resources."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-2797":
    "native": "mineral resources"
    "notes":
      "n1": "Minerals that are dug out of the ground. 矿 (kuàng) is a mine, and 产 (chǎn) is a product."
    "examples":
      "这里有很多矿产。":
        "native": "There are many minerals here."
        "bases":
          "这里":
            "meaning": "here"
          "有":
            "meaning": "to have"
      "矿产是国家的财富。":
        "native": "Minerals are the country's wealth."
        "bases":
          "的":
            "meaning": "of"
          "财富":
            "meaning": "wealth"
  "zh-2798":
    "native": "energy source"
    "notes":
      "n1": "A source of power. 能 (néng) is ability, and 源 (yuán) is a source."
    "examples":
      "太阳是一种能源。":
        "native": "The sun is a kind of energy source."
        "bases":
          "种":
            "meaning": "kind; type"
      "能源很重要。": "Energy sources are very important."
