"name": "没有 (méiyǒu): not as ... as"
"license": "CC-BY-SA-4.0"
"description": "Saying one thing is not as much as another: 没有 (méiyǒu) before the thing compared with. Not yet checked by a Mandarin speaker: please report any mistake."
"tags":
- "unreviewed"
"pattern":
  "name": "没有 (méiyǒu): not as ... as"
  "slot_name": "form"
  "prompt": "{lemma} ({gloss}), {slot}"
  "slots":
    "plain": "a plain statement"
    "not-as": "not as ... as, with 没有 (méiyǒu)"
  "entries":
    "gao": "tall"
    "da": "big"
    "kuai": "fast"
    "piaoliang": "pretty"
  "notes": "没有 (méiyǒu) before the thing compared with says it is not as much as it: 他没有我高 (tā méiyǒu wǒ gāo), he is not as tall as me. It is the same as 不比 (bù bǐ) in meaning, but 没有 (méiyǒu) is said more often in speech. The thing compared with comes straight after 没有 (méiyǒu), with no 比 (bǐ)."
