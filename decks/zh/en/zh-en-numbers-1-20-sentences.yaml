"id": "zh-en-numbers-1-20-sentences"
"kind": "layer"
"core": "zh-numbers-1-20-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Numbers in sentences"
"description": "Counting and asking about numbers from one to twenty, with the set of numbers one to ten. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0218":
    "native": "One, two, three, four."
    "confusables":
      "w1":
        "why": "两 (liǎng) would count one, two, three, four in the amount form, not the count."
      "w2":
        "why": "五 (wǔ) would count one to five, not one to four."
  "zh-0219":
    "native": "Seven, eight, nine, ten."
    "confusables":
      "w1":
        "why": "六 (liù) would count six to nine, not seven to ten."
      "w2":
        "why": "十一 (shíyī) would count seven to eleven, not seven to ten."
  "zh-0220":
    "native": "Who is number one?"
    "confusables":
      "w1":
        "why": "哪 (nǎ) would ask which one is one, not who."
      "w2":
        "why": "二 (èr) would ask who is two, not who is one."
  "zh-0221":
    "native": "What number is ten?"
    "confusables":
      "w1":
        "why": "哪 (nǎ) would ask which number ten is, not how many it is."
      "w2":
        "why": "三 (sān) would say whether three is ten, not what ten is."
  "zh-0222":
    "native": "One is one, two is two."
    "confusables":
      "w1":
        "why": "三 (sān) would say three is three, not one is one."
      "w2":
        "why": "十 (shí) would say one is ten, not one is one."
  "zh-0223":
    "native": "Are all eleven of you coming?"
    "bases":
      "个":
        "meaning": "measure word for people and things"
    "confusables":
      "w1":
        "why": "我们 (wǒmen) would ask whether all eleven of us are coming, not you."
      "w2":
        "why": "几 (jǐ) would ask how many people are coming, not give the number eleven."
  "zh-0224":
    "native": "Two, three, five."
    "confusables":
      "w1":
        "why": "一 (yī) would count one, three, five, not two, three, five."
      "w2":
        "why": "六 (liù) would count six, not five."
  "zh-0225":
    "native": "What number is six?"
    "confusables":
      "w1":
        "why": "哪 (nǎ) would ask which number, not what six is."
      "w2":
        "why": "五 (wǔ) would ask what number five is, not six."
  "zh-0226":
    "native": "Counting from one to ten"
    "explanation": "The numbers one to ten. Count them in this order, and learn 十 (shí) as the step that makes eleven and twenty with 一 (yī) and 二 (èr)."
