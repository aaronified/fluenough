"cards":
  "zh-4699":
    "native": "Dumplings are an important food for northern people at New Year."
    "confusables":
      "w1":
        "why": "春卷 (chūnjuǎn) is a spring roll, a fried or baked roll rather than a dumpling."
      "w2":
        "why": "包子 (bāozi) is a steamed bun, not a dumpling with a folded wrapper."
    "bases":
      "是":
        "meaning": "is"
      "北方人":
        "meaning": "northern people"
      "过年":
        "meaning": "celebrate New Year"
      "的":
        "meaning": "particle"
      "食物":
        "meaning": "food"
  "zh-4700":
    "native": "The food in this restaurant is very authentic, and many people come specially to eat it."
    "confusables":
      "w1":
        "why": "美食 (měishí) is a noun for delicacies. The sentence says the cooking is authentic, which is an adjective."
      "w2":
        "why": "小吃 (xiǎochī) is a snack, a small dish, not a restaurant's cooking as a whole."
    "bases":
      "的":
        "meaning": "particle"
      "很":
        "meaning": "very"
      "很多":
        "meaning": "many"
      "人":
        "meaning": "people"
      "专门":
        "meaning": "specially"
      "来":
        "meaning": "come"
      "吃":
        "meaning": "eat"
  "zh-4701":
    "native": "He uses many spices to braise the meat, and it tastes very good."
    "confusables":
      "w1":
        "why": "腊肉 (làròu) is cured pork, preserved for months, not meat braised fresh."
      "w2":
        "why": "调味料 (tiáowèiliào) are seasonings such as salt and soy sauce. The sentence names spices, a separate group."
    "bases":
      "他":
        "meaning": "he"
      "用":
        "meaning": "use"
      "很多":
        "meaning": "many"
      "肉":
        "meaning": "meat"
      "很":
        "meaning": "very"
  "zh-4702":
    "native": "This tea must be steeped in boiled water, not cold water."
    "confusables":
      "w1":
        "why": "饮茶 (yǐnchá) is the act of drinking tea. The sentence is about how to brew the leaves."
      "w2":
        "why": "茶道 (chádào) is the ritual of tea as an art, not the steeping instructions."
    "bases":
      "要":
        "meaning": "must"
      "用":
        "meaning": "use"
      "泡":
        "meaning": "steep"
      "不":
        "meaning": "not"
      "能":
        "meaning": "cannot"
  "zh-4703":
    "native": "Grandmother teaches me to make rice cake every Spring Festival."
    "confusables":
      "w1":
        "why": "做法 (zuòfǎ) is a method or recipe, a noun. The sentence needs the verb to make."
      "w2":
        "why": "节日 (jiérì) is a festival, the day itself. The sentence is about the food made for it."
    "bases":
      "都":
        "meaning": "every year"
      "我":
        "meaning": "I"
  "zh-4704":
    "native": "We shared the delicacies together and talked for a long time."
    "confusables":
      "w1":
        "why": "聚餐 (jùcān) is eating together. The sentence is about sharing the food itself."
      "w2":
        "why": "宴会 (yànhuì) is a formal banquet, not a friendly meal shared between friends."
    "bases":
      "聊":
        "meaning": "chat"
      "了":
        "meaning": "particle"
      "很":
        "meaning": "very"
      "久":
        "meaning": "for a long time"
  "zh-4705":
    "native": "There were many dishes at the banquet, but many people did not finish eating."
    "confusables":
      "w1":
        "why": "饭菜 (fàncài) is the food of an everyday meal, not the dishes of a banquet."
      "w2":
        "why": "餐具 (cānjù) is the tableware, such as bowls and chopsticks, which the sentence does not mention."
    "bases":
      "的":
        "meaning": "particle"
      "很":
        "meaning": "very"
      "多":
        "meaning": "many"
      "但":
        "meaning": "but"
      "很多":
        "meaning": "many"
      "人":
        "meaning": "people"
      "没":
        "meaning": "not"
      "吃完":
        "meaning": "finish eating"
  "zh-4706":
    "native": "At the winter solstice southern people eat sweet dumplings, and northern people eat dumplings."
    "confusables":
      "w1":
        "why": "节气 (jiéqì) is the name for a whole group of solar terms. The sentence names one, 冬至 (dōngzhì)."
      "w2":
        "why": "馄饨 (húntun) is a wonton in broth, not a sweet dumpling."
    "bases":
      "时":
        "meaning": "at the time"
      "南方人":
        "meaning": "southern people"
      "吃":
        "meaning": "eat"
      "北方人":
        "meaning": "northern people"
