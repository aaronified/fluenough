"name": "Sixth characters: the work"
"description": "Ten characters for work and study: the meeting and the team, the staff and the post, the work and the materials, the report and the finance. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
- "script"
"cards":
  "zh-3124":
    "native": "meeting; to discuss (as a character)"
    "notes":
      "n1": "A discussion or a meeting. 会议 (huìyì) is a meeting, and 议 (yì) is to discuss."
    "examples":
      "明天有会议。":
        "native": "There is a meeting tomorrow."
        "bases":
          "有":
            "meaning": "to have"
      "会议在三楼。": "The meeting is on the third floor."
  "zh-3125":
    "native": "member; staff (as a character)"
    "notes":
      "n1": "A member of a group or staff. 员工 (yuángōng) is a staff member, and 员 (yuán) is a member."
    "examples":
      "他是员工。": "He is a staff member."
      "员工很努力。": "The staff work very hard."
  "zh-3126":
    "native": "group; team (as a character)"
    "notes":
      "n1": "A group of people together. 团队 (tuánduì) is a team, and 团 (tuán) is a group."
    "examples":
      "我们是一个团队。": "We are one team."
      "团队很好。": "The team is very good."
  "zh-3127":
    "native": "team; line (as a character)"
    "notes":
      "n1": "A team or a group in a line. 团队 (tuánduì) is a team, and 队 (duì) is a team."
    "examples":
      "团队很大。": "The team is very big."
      "队很长。": "The line is very long."
  "zh-3128":
    "native": "work; to make (as a character)"
    "notes":
      "n1": "Work or creation. 工作 (gōngzuò) is work, and 作 (zuò) is to do."
    "examples":
      "我的工作很好。":
        "native": "My work is very good."
        "bases":
          "的":
            "meaning": "of"
      "我写作业。": "I do my homework."
  "zh-3129":
    "native": "material; stuff (as a character)"
    "notes":
      "n1": "Material or information. 资料 (zīliào) is material, and 料 (liào) is stuff."
    "examples":
      "资料很多。":
        "native": "There is a lot of material."
        "bases":
          "资料":
            "meaning": "material; data"
      "我看资料。":
        "native": "I read the material."
        "bases":
          "资料":
            "meaning": "material; data"
  "zh-3130":
    "native": "resource; capital (as a character)"
    "notes":
      "n1": "Money or resources. 资源 (zīyuán) is a resource, and 资 (zī) is capital."
    "examples":
      "资源很多。": "There are many resources."
      "这个公司的资很大。":
        "native": "This company has a lot of capital."
        "bases":
          "的":
            "meaning": "of"
  "zh-3131":
    "native": "to tell; to announce (as a character)"
    "notes":
      "n1": "To tell someone something. 报告 (bàogào) is a report, and 告 (gào) is to tell."
    "examples":
      "报告很长。": "The report is very long."
      "他告诉我了。":
        "native": "He told me."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3132":
    "native": "affairs; duty (as a character)"
    "notes":
      "n1": "Affairs or work to be done. 财务 (cáiwù) is finance, and 务 (wù) is affairs."
    "examples":
      "财务部在三楼。":
        "native": "The finance department is on the third floor."
        "bases":
          "部":
            "meaning": "department; part"
      "财务工作很忙。": "The finance work is very busy."
  "zh-3133":
    "native": "post; duty (as a character)"
    "notes":
      "n1": "A job or a post. 职位 (zhíwèi) is a post, and 职 (zhí) is a duty."
    "examples":
      "职位很好。": "The post is very good."
      "他的职很高。":
        "native": "His post is very high."
        "bases":
          "的":
            "meaning": "of"
