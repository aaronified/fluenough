"cards":
  "zh-2890":
    "native": "excited; moved"
    "notes":
      "n1": "Feeling strong emotion. 激 (jī) is to stir, and 动 (dòng) is to move."
    "examples":
      "我很激动。": "I am very excited."
      "他激动得说不出话。":
        "native": "He was too excited to speak."
        "bases":
          "得":
            "meaning": "a particle: how it is done"
          "话":
            "meaning": "words; speech"
  "zh-2891":
    "native": "excited; thrilled"
    "notes":
      "n1": "Feeling very happy and full of energy. 兴 (xīng) is high spirits, and 奋 (fèn) is excited."
    "examples":
      "孩子们很兴奋。":
        "native": "The children are very excited."
        "bases":
          "孩子们":
            "meaning": "children"
      "他对比赛很兴奋。": "He is thrilled about the match."
  "zh-2892":
    "native": "disappointed"
    "notes":
      "n1": "Feeling sad that something did not happen. 失 (shī) is to lose, and 望 (wàng) is hope."
    "examples":
      "我很失望。": "I am very disappointed."
      "结果让大家失望。":
        "native": "The result disappointed everyone."
        "bases":
          "结果":
            "meaning": "result"
          "让":
            "meaning": "to let; to make"
  "zh-2893":
    "native": "satisfied; pleased"
    "notes":
      "n1": "Feeling happy with the result. 满 (mǎn) is full, and 意 (yì) is intention."
    "examples":
      "老板很满意。": "The boss is very satisfied."
      "我对结果很满意。":
        "native": "I am very pleased with the result."
        "bases":
          "结果":
            "meaning": "result"
  "zh-2894":
    "native": "dissatisfied"
    "notes":
      "n1": "Not pleased with something. 不 (bù) is not, and 满 (mǎn) is full or satisfied."
    "examples":
      "他对服务很不满。":
        "native": "He is very dissatisfied with the service."
        "bases":
          "服务":
            "meaning": "service"
      "大家都有不满。":
        "native": "Everyone has complaints."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-2895":
    "native": "wronged; hard done by"
    "notes":
      "n1": "Feeling that you have been treated unfairly. 委 (wěi) is to yield, and 屈 (qū) is to be wronged."
    "examples":
      "她觉得很委屈。": "She feels hard done by."
      "我不想让你委屈。":
        "native": "I do not want you to feel wronged."
        "bases":
          "让":
            "meaning": "to let; to make"
  "zh-2896":
    "native": "awkward; embarrassed"
    "notes":
      "n1": "Feeling uncomfortable in a social situation. 尴 (gān) and 尬 (gà) describe an awkward moment."
    "examples":
      "他很尴尬。": "He feels awkward."
      "这个场面很尴尬。":
        "native": "The scene is very awkward."
        "bases":
          "场面":
            "meaning": "scene"
  "zh-2897":
    "native": "shy"
    "notes":
      "n1": "Feeling shy in front of people. 害 (hài) is to feel, and 羞 (xiū) is shame."
    "examples":
      "她很害羞。": "She is very shy."
      "别害羞。": "Do not be shy."
  "zh-2898":
    "native": "proud; arrogant"
    "notes":
      "n1": "Feeling very proud, sometimes too proud. 骄 (jiāo) is haughty, and 傲 (ào) is proud."
    "examples":
      "父母为我骄傲。":
        "native": "My parents are proud of me."
        "bases":
          "为":
            "meaning": "for"
      "他不要骄傲。":
        "native": "He should not be arrogant."
        "bases":
          "不要":
            "meaning": "do not"
  "zh-2899":
    "native": "proud (of an achievement)"
    "notes":
      "n1": "Feeling proud of what you have done. 自 (zì) is self, and 豪 (háo) is proud."
    "examples":
      "我为这个成绩而自豪。":
        "native": "I am proud of this result."
        "bases":
          "为":
            "meaning": "for"
          "而":
            "meaning": "and (linking)"
      "他很自豪。": "He is very proud."
  "zh-2900":
    "native": "to be jealous"
    "notes":
      "n1": "To want what someone else has. 嫉 (jí) is jealousy, and 妒 (dù) is envy."
    "examples":
      "别嫉妒别人。": "Do not be jealous of other people."
      "她嫉妒我的成绩。":
        "native": "She is jealous of my results."
        "bases":
          "的":
            "meaning": "of"
  "zh-2901":
    "native": "to envy; to admire"
    "notes":
      "n1": "To wish you had something that someone else has. 羡 (xiàn) is to envy, and 慕 (mù) is to admire."
    "examples":
      "我很羡慕你。": "I envy you."
      "大家都羡慕他的工作。":
        "native": "Everyone envies his job."
        "bases":
          "的":
            "meaning": "of"
  "zh-2902":
    "native": "to sympathise"
    "notes":
      "n1": "To feel for someone who is in trouble. 同 (tóng) is together, and 情 (qíng) is feeling."
    "examples":
      "我同情他。": "I sympathise with him."
      "大家都同情她。": "Everyone feels sorry for her."
  "zh-2903":
    "native": "to be grateful"
    "notes":
      "n1": "To be thankful for help. 感 (gǎn) is to feel, and 激 (jī) is to stir."
    "examples":
      "我很感激你。": "I am very grateful to you."
      "他感激老师的帮助。":
        "native": "He is grateful for the teacher's help."
        "bases":
          "的":
            "meaning": "of"
  "zh-2904":
    "native": "to thank"
    "notes":
      "n1": "To say thank you. 感 (gǎn) is to feel, and 谢 (xiè) is to thank."
    "examples":
      "我感谢你的帮助。":
        "native": "I thank you for your help."
        "bases":
          "的":
            "meaning": "of"
      "感谢大家。": "Thank you, everyone."
  "zh-2905":
    "native": "to miss someone"
    "notes":
      "n1": "To think of someone who is far away. 思 (sī) is to think, and 念 (niàn) is to remember."
    "examples":
      "我思念家人。": "I miss my family."
      "她思念远方的朋友。":
        "native": "She misses her friend far away."
        "bases":
          "远方":
            "meaning": "far away"
          "的":
            "meaning": "of"
  "zh-2906":
    "native": "to miss"
    "notes":
      "n1": "To long for someone to be near. 想 (xiǎng) is to think, and 念 (niàn) is to remember."
    "examples":
      "我很想念你。": "I miss you very much."
      "他想念故乡。":
        "native": "He misses his hometown."
        "bases":
          "故乡":
            "meaning": "hometown"
  "zh-2907":
    "native": "lonely"
    "notes":
      "n1": "Feeling alone and sad. 寂 (jì) is quiet, and 寞 (mò) is lonely."
    "examples":
      "他一个人很寂寞。": "He is lonely on his own."
      "晚上我感到寂寞。":
        "native": "In the evening I feel lonely."
        "bases":
          "感到":
            "meaning": "to feel"
  "zh-2908":
    "native": "lonely; solitary"
    "notes":
      "n1": "Being alone, often in a sad way. 孤 (gū) is alone, and 独 (dú) is alone."
    "examples":
      "老人很孤独。":
        "native": "The old man is very lonely."
        "bases":
          "老人":
            "meaning": "old person"
      "他喜欢孤独。": "He likes being alone."
  "zh-2909":
    "native": "annoyed; bothered"
    "notes":
      "n1": "Feeling irritated. 烦 (fán) is annoyed."
    "examples":
      "我很烦。": "I am very annoyed."
      "这件事让我很烦。":
        "native": "This matter bothers me."
        "bases":
          "事":
            "meaning": "matter"
          "让":
            "meaning": "to let; to make"
  "zh-2910":
    "native": "worry; trouble"
    "notes":
      "n1": "A worry that stays in the mind. 烦 (fán) is annoyance, and 恼 (nǎo) is anger."
    "examples":
      "他有很多烦恼。":
        "native": "He has many worries."
        "bases":
          "有":
            "meaning": "to have; there is"
      "别让烦恼影响你。":
        "native": "Do not let worries affect you."
        "bases":
          "让":
            "meaning": "to let; to make"
          "影响":
            "meaning": "to affect"
  "zh-2911":
    "native": "bored; dull"
    "notes":
      "n1": "Not interesting, or feeling bored. 无 (wú) is without, and 聊 (liáo) is chat."
    "examples":
      "我很无聊。": "I am very bored."
      "这个电影很无聊。":
        "native": "This film is very dull."
        "bases":
          "电影":
            "meaning": "film"
  "zh-2912":
    "native": "to be tired of"
    "notes":
      "n1": "To be bored of something after a long time. 厌 (yàn) is to dislike, and 烦 (fán) is annoyance."
    "examples":
      "我厌烦了这个工作。":
        "native": "I am tired of this job."
        "bases":
          "了":
            "meaning": "a particle: a finished action"
      "大家都厌烦了。":
        "native": "Everyone has grown tired of it."
        "bases":
          "了":
            "meaning": "a particle: a finished action"
  "zh-2913":
    "native": "to dislike; annoying"
    "notes":
      "n1": "To find something annoying or unpleasant. 讨 (tǎo) is to seek, and 厌 (yàn) is to dislike."
    "examples":
      "我讨厌下雨。": "I dislike rain."
      "这个人很讨厌。": "This person is very annoying."
  "zh-2914":
    "native": "to hate"
    "notes":
      "n1": "To feel very strong dislike. 恨 (hèn) is hate."
    "examples":
      "我不恨他。": "I do not hate him."
      "她恨这个地方。": "She hates this place."
  "zh-2915":
    "native": "to love"
    "notes":
      "n1": "To have deep love for someone. 爱 (ài) is love."
    "examples":
      "我爱我的家人。":
        "native": "I love my family."
        "bases":
          "的":
            "meaning": "of"
      "他爱音乐。": "He loves music."
  "zh-2916":
    "native": "mood; emotion"
    "notes":
      "n1": "The way you feel at a time. 情 (qíng) is feeling, and 绪 (xù) is a thread or state."
    "examples":
      "他的情绪很好。":
        "native": "His mood is very good."
        "bases":
          "的":
            "meaning": "of"
      "别影响别人的情绪。":
        "native": "Do not affect other people's moods."
        "bases":
          "影响":
            "meaning": "to affect"
          "的":
            "meaning": "of"
  "zh-2917":
    "native": "happy; cheerful"
    "notes":
      "n1": "Feeling happy. 开 (kāi) is to open, and 心 (xīn) is heart."
    "examples":
      "我今天很开心。": "I am very happy today."
      "大家玩得很开心。":
        "native": "Everyone had a happy time."
        "bases":
          "得":
            "meaning": "a particle: how it is done"
  "zh-2918":
    "native": "happy; joyful"
    "notes":
      "n1": "Having a sense of joy. 快 (kuài) is quick, and 乐 (lè) is joy."
    "examples":
      "孩子们很快乐。":
        "native": "The children are very happy."
        "bases":
          "孩子们":
            "meaning": "children"
      "祝你快乐。":
        "native": "I wish you happiness."
        "bases":
          "祝":
            "meaning": "to wish"
  "zh-2919":
    "native": "happy; blessed"
    "notes":
      "n1": "Feeling deep joy and contentment. 幸 (xìng) is fortunate, and 福 (fú) is good fortune."
    "examples":
      "他很幸福。": "He is very happy."
      "我们过得很幸福。":
        "native": "We are living happily."
        "bases":
          "得":
            "meaning": "a particle: how it is done"
  "zh-2920":
    "native": "sad; upset"
    "notes":
      "n1": "Feeling sad. 难 (nán) is hard, and 过 (guò) is to pass."
    "examples":
      "我很难过。": "I am very sad."
      "她听到消息很难过。":
        "native": "She was sad to hear the news."
        "bases":
          "听到":
            "meaning": "to hear"
          "消息":
            "meaning": "news"
  "zh-2921":
    "native": "painful; miserable"
    "notes":
      "n1": "Feeling great pain or suffering. 痛 (tòng) is pain, and 苦 (kǔ) is bitter."
    "examples":
      "他很痛苦。": "He is in great pain."
      "这段经历很痛苦。":
        "native": "This experience was very painful."
        "bases":
          "段":
            "meaning": "measure word for a period"
          "经历":
            "meaning": "experience"
  "zh-2922":
    "native": "surprised"
    "notes":
      "n1": "Feeling surprised by something. 惊 (jīng) is shock, and 讶 (yà) is surprise."
    "examples":
      "大家很惊讶。": "Everyone was surprised."
      "她的回答让我惊讶。":
        "native": "Her answer surprised me."
        "bases":
          "的":
            "meaning": "of"
          "让":
            "meaning": "to let; to make"
  "zh-2923":
    "native": "startled; shocked"
    "notes":
      "n1": "Surprised in a sudden way. 吃 (chī) is to eat, and 惊 (jīng) is shock."
    "examples":
      "我很吃惊。": "I was very shocked."
      "大家都吃惊。": "Everyone was shocked."
  "zh-2924":
    "native": "curious"
    "notes":
      "n1": "Wanting to know more. 好 (hào) is to like, and 奇 (qí) is strange."
    "examples":
      "孩子很好奇。": "The child is very curious."
      "我对这件事很好奇。":
        "native": "I am curious about this matter."
        "bases":
          "事":
            "meaning": "matter"
  "zh-2925":
    "native": "to admire"
    "notes":
      "n1": "To think highly of someone. 佩 (pèi) is to respect, and 服 (fú) is to submit."
    "examples":
      "我很佩服他。": "I really admire him."
      "大家都佩服她的勇气。":
        "native": "Everyone admires her courage."
        "bases":
          "的":
            "meaning": "of"
          "勇气":
            "meaning": "courage"
  "zh-2926":
    "native": "to regret"
    "notes":
      "n1": "To feel sorry about something done. 后 (hòu) is after, and 悔 (huǐ) is regret."
    "examples":
      "我很后悔。": "I regret it very much."
      "他后悔没有早点说。":
        "native": "He regrets not saying it earlier."
        "bases":
          "没有":
            "meaning": "there is not"
          "早点":
            "meaning": "earlier"
  "zh-2927":
    "native": "guilty"
    "notes":
      "n1": "Feeling bad about a mistake. 内 (nèi) is inside, and 疚 (jiù) is guilt."
    "examples":
      "我觉得很内疚。": "I feel very guilty."
      "他对错误感到内疚。":
        "native": "He feels guilty about the mistake."
        "bases":
          "错误":
            "meaning": "mistake"
          "感到":
            "meaning": "to feel"
  "zh-2928":
    "native": "calm; peaceful"
    "notes":
      "n1": "Quiet and not upset. 平 (píng) is flat, and 静 (jìng) is quiet."
    "examples":
      "他的心很平静。":
        "native": "His heart is calm."
        "bases":
          "的":
            "meaning": "of"
      "湖面很平静。":
        "native": "The lake is very calm."
        "bases":
          "湖面":
            "meaning": "lake surface"
  "zh-2929":
    "native": "to relax"
    "notes":
      "n1": "To let the body or mind rest. 放 (fàng) is to let go, and 松 (sōng) is loose."
    "examples":
      "请放松。": "Please relax."
      "周末我放松一下。":
        "native": "I relax a bit at the weekend."
        "bases":
          "一下":
            "meaning": "a little while"
  "zh-2930":
    "native": "temper"
    "notes":
      "n1": "The way a person usually reacts to things. 脾 (pí) is a spleen, and 气 (qì) is spirit."
    "examples":
      "他的脾气很好。":
        "native": "He has a good temper."
        "bases":
          "的":
            "meaning": "of"
      "别发脾气。": "Do not lose your temper."
  "zh-2931":
    "native": "character; personality"
    "notes":
      "n1": "The character of a person. 性 (xìng) is nature, and 格 (gé) is a type."
    "examples":
      "她的性格很开朗。":
        "native": "She has a cheerful character."
        "bases":
          "的":
            "meaning": "of"
          "开朗":
            "meaning": "cheerful"
      "两人性格不同。":
        "native": "The two have different personalities."
        "bases":
          "不同":
            "meaning": "different"
  "zh-2932":
    "native": "mood"
    "notes":
      "n1": "How you feel at a time. 心 (xīn) is heart, and 情 (qíng) is feeling."
    "examples":
      "我今天心情很好。": "I am in a good mood today."
      "她的心情不好。":
        "native": "She is in a bad mood."
        "bases":
          "的":
            "meaning": "of"
  "zh-2933":
    "native": "to pity"
    "notes":
      "n1": "To feel sorry for someone who suffers. 怜 (lián) is pity, and 悯 (mǐn) is sorrow."
    "examples":
      "大家怜悯这个孩子。": "Everyone pities this child."
      "他没有怜悯。":
        "native": "He has no pity in his heart."
        "bases":
          "没有":
            "meaning": "there is not"
  "zh-2934":
    "native": "regretful; a pity"
    "notes":
      "n1": "Sorry that something did not happen. 遗 (yí) is to leave behind, and 憾 (hàn) is regret."
    "examples":
      "很遗憾，我不能去。":
        "native": "I am sorry, I cannot go."
        "bases":
          "能":
            "meaning": "can; may"
      "这是一件遗憾的事。":
        "native": "That is a regrettable matter."
        "bases":
          "的":
            "meaning": "of"
          "事":
            "meaning": "matter"
  "zh-2935":
    "native": "to sigh with emotion"
    "notes":
      "n1": "To feel deeply about something. 感 (gǎn) is to feel, and 慨 (kǎi) is to sigh."
    "examples":
      "他感慨了很久。":
        "native": "He sighed with emotion for a long time."
        "bases":
          "了":
            "meaning": "a particle: a finished action"
          "久":
            "meaning": "long (of time)"
      "大家都很感慨。": "Everyone was deeply moved."
  "zh-2936":
    "native": "pleased with oneself"
    "notes":
      "n1": "Feeling proud of one's success. 得 (dé) is to get, and 意 (yì) is satisfaction."
    "examples":
      "他很得意。": "He is very pleased with himself."
      "别太得意。": "Do not be too pleased with yourself."
  "zh-2937":
    "native": "worried; anxious"
    "notes":
      "n1": "Feeling anxious because of waiting. 着 (zháo) is to be, and 急 (jí) is urgent."
    "examples":
      "我很着急。": "I am very anxious."
      "别着急。": "Do not worry."
  "zh-2938":
    "native": "flustered; panicky"
    "notes":
      "n1": "Acting in a hurry from fear. 慌 (huāng) is panic, and 张 (zhāng) is tense."
    "examples":
      "他很慌张。": "He is very flustered."
      "大家慌张跑了。":
        "native": "Everyone ran off in a panic."
        "bases":
          "了":
            "meaning": "a particle: a finished action"
  "zh-2939":
    "native": "furious"
    "notes":
      "n1": "Very angry. 愤 (fèn) is anger, and 怒 (nù) is rage."
    "examples":
      "他很愤怒。": "He is furious."
      "大家的愤怒越来越大。":
        "native": "Everyone's anger grew stronger."
        "bases":
          "的":
            "meaning": "of"
          "越":
            "meaning": "more and more"
  "zh-2940":
    "native": "anxious"
    "notes":
      "n1": "Worried and unable to relax. 焦 (jiāo) is anxious, and 虑 (lǜ) is worry."
    "examples":
      "她很焦虑。": "She is very anxious."
      "这件事让我焦虑。":
        "native": "This matter makes me anxious."
        "bases":
          "事":
            "meaning": "matter"
          "让":
            "meaning": "to let; to make"
  "zh-2941":
    "native": "optimistic"
    "notes":
      "n1": "Expecting good things. 乐 (lè) is joy, and 观 (guān) is a view."
    "examples":
      "他很乐观。": "He is very optimistic."
      "我们要乐观。":
        "native": "We must be optimistic."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-2942":
    "native": "pessimistic"
    "notes":
      "n1": "Expecting bad things. 悲 (bēi) is sad, and 观 (guān) is a view."
    "examples":
      "他对未来很悲观。":
        "native": "He is very pessimistic about the future."
        "bases":
          "未来":
            "meaning": "future"
      "别这么悲观。":
        "native": "Do not be so pessimistic."
        "bases":
          "这么":
            "meaning": "so"
  "zh-2943":
    "native": "confident"
    "notes":
