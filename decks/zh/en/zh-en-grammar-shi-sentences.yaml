schema: 1
id: "zh-en-grammar-shi-sentences"
kind: "layer"
core: "zh-grammar-shi-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "是 (shì) and 不 (bù) in sentences"
license: "CC-BY-SA-4.0"
description: "Seven sentences that say what something is and is not, and what someone does not do. Not yet checked by a Mandarin speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "zh-0600":
    "native": "I am a student, not a teacher."
    "confusables":
      "w1":
        "why": "也 (yě) would say also: I am also a student."
      "w2":
        "why": "医生 (yīshēng) would say doctor, not teacher."
  "zh-0601":
    "native": "She is my classmate."
    "confusables":
      "w1":
        "why": "他 (tā) is he. It sounds the same as 她 (tā), she, but is written with a different first part."
      "w2":
        "why": "朋友 (péngyou) would say friend."
      "w3":
        "why": "同事 (tóngshì) would say colleague, not classmate."
  "zh-0602":
    "native": "We are all students."
    "confusables":
      "w1":
        "why": "也 (yě) would say also: we are also students."
      "w2":
        "why": "还是 (háishi) means or, as in students or teachers?"
  "zh-0603":
    "native": "He is a manager, not a doctor."
    "confusables":
      "w1":
        "why": "老师 (lǎoshī) would say teacher, not manager."
      "w2":
        "why": "同事 (tóngshì) would say colleague, not manager."
  "zh-0604":
    "native": "This is not tea, it is water."
    "confusables":
      "w1":
        "why": "那 (nà) would say that, not this."
      "w2":
        "why": "鱼 (yú) would say fish, not water."
  "zh-0605":
    "native": "I am not going to school."
    "confusables":
      "w1":
        "why": "来 (lái) would say come, not go."
      "w2":
        "why": "家 (jiā) would say home, not school."
  "zh-0606":
    "native": "This is expensive, I am not buying it."
    "confusables":
      "w1":
        "why": "卖 (mài) would say sell. It sounds like 买 (mǎi), buy, but its tone falls."
      "w2":
        "why": "便宜 (piányi) would say cheap, the opposite of 贵 (guì)."
      "w3":
        "why": "太 (tài) would say too: too expensive."
