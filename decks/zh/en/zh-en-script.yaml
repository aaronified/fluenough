"name": "How Chinese script works"
"intro": "Chinese characters are written one stroke at a time, in a set order, and many of them are built from smaller parts. Each character is one syllable, and most of the parts show a meaning or a sound."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
- "script"
"features":
  "strokes":
    "name": "Strokes"
    "text": "A character is made of strokes: a dot, a horizontal line, a vertical line, a hook, a dash. Learn the strokes first, because a character is only as clear as the strokes it is made of."
  "stroke-order":
    "name": "Stroke order"
    "text": "Each character has one order for its strokes: from top to bottom and from left to right, with a horizontal stroke before a vertical one where they cross. 十 is written across, then down."
  "radicals":
    "name": "Radicals"
    "text": "Many characters share a part that hints at their meaning. The left part of 妈 (mā), mother, is 女 (nǚ), woman, and 好 (hǎo), good, and 她 (tā), she, share it too. Such a shared part is a radical."
  "simplified":
    "name": "Simplified characters"
    "text": "Mainland China writes simplified characters, with fewer strokes, such as 国 (guó), country. Taiwan writes the traditional forms, such as 國 (guó), country. The sound and the meaning are the same; only the strokes differ."
