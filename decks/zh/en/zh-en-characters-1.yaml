"id": "zh-en-characters-1"
"kind": "layer"
"core": "zh-characters-1"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "First characters"
"description": "Ten characters that go with the first words: big and small, the plural we, you and they, a thousand and ten thousand, country, study, life, teacher and middle. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
- "script"
"cards":
  "zh-0243":
    "native": "big"
    "notes":
      "n1": "大 (dà) is big. Its opposite is 小 (xiǎo), small."
    "examples":
      "这很大吗？": "Is this big?"
      "房子很大。": "The house is very big."
    "bases":
      "这":
        "meaning": "this"
      "房子":
        "meaning": "house, flat"
  "zh-0244":
    "native": "small"
    "notes":
      "n1": "小 (xiǎo) is small, and also young. Its opposite is 大 (dà), big."
    "examples":
      "他很小。": "He is young."
      "这很小。": "This is very small."
    "bases":
      "这":
        "meaning": "this"
  "zh-0245":
    "native": "plural marker"
    "notes":
      "n1": "们 (men) makes a pronoun plural: 我们 (wǒmen), we, 你们 (nǐmen), you all, and 他们 (tāmen), they. It is never used alone."
    "examples":
      "我们很好。": "We are well."
      "你们很好吗？": "Are you all well?"
  "zh-0246":
    "native": "thousand"
    "notes":
      "n1": "千 (qiān) is a thousand. 一千 (yīqiān) is one thousand."
    "examples":
      "一千人。": "One thousand people."
      "五千也很多。": "Five thousand is also a lot."
  "zh-0247":
    "native": "ten thousand"
    "notes":
      "n1": "万 (wàn) is ten thousand. Before it, 一 (yī) is said yí, because 万 has the fourth tone."
    "examples":
      "一万人。": "Ten thousand people."
      "十万人很多。": "A hundred thousand people is a lot."
  "zh-0248":
    "native": "country"
    "notes":
      "n1": "国 (guó) is country. 中国 (Zhōngguó) is China. Taiwan writes the traditional form, 國 (guó)."
    "examples":
      "中国很大。": "China is very big."
      "国很大吗？": "Is the country very big?"
    "bases":
      "中国":
        "meaning": "China"
  "zh-0249":
    "native": "to study, to learn"
    "notes":
      "n1": "学 (xué) is to study or to learn. It is the first part of 学生 (xuésheng), student."
    "examples":
      "我学中文。": "I study Chinese."
      "你学中文吗？": "Do you study Chinese?"
    "bases":
      "中文":
        "meaning": "the Chinese language"
  "zh-0250":
    "native": "life; to be born"
    "notes":
      "n1": "生 (shēng) is life, or to be born. In 学生 (xuésheng), student, it names a person who studies."
    "examples":
      "他是学生。": "He is a student."
      "学生很多。": "There are many students."
    "bases":
      "学生":
        "meaning": "student"
  "zh-0251":
    "native": "teacher, master"
    "notes":
      "n1": "师 (shī) is teacher or master. 老师 (lǎoshī), teacher, adds 老 (lǎo), old, as a sign of respect."
    "examples":
      "老师很好。": "The teacher is very good."
      "他是老师吗？": "Is he a teacher?"
    "bases":
      "老师":
        "meaning": "teacher"
  "zh-0252":
    "native": "middle"
    "notes":
      "n1": "中 (zhōng) is middle. It is the first part of 中国 (Zhōngguó), China, and 中文 (Zhōngwén), the Chinese language."
    "examples":
      "你是中国人吗？": "Are you Chinese?"
      "中国人很多。": "There are many Chinese people."
    "bases":
      "中国人":
        "meaning": "a Chinese person"
