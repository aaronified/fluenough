"cards":
  "zh-1388":
    "confusables":
      "w1":
        "why": "去年 (qùnián) is last year, the past, not this year."
      "w2":
        "why": "明年 (míngnián) is next year, the future."
    "native": "This year I am twenty years old."
  "zh-1389":
    "confusables":
      "w1":
        "why": "今年 (jīnnián) is this year, not next."
      "w2":
        "why": "后年 (hòunián) is the year after next, two years on."
    "native": "Next year I will go to China."
  "zh-1390":
    "confusables":
      "w1":
        "why": "周日 (zhōurì) is Sunday, a day off."
      "w2":
        "why": "假期 (jiàqī) is a holiday period, not a day of the week."
    "native": "On Monday I go to work."
  "zh-1391":
    "confusables":
      "w1":
        "why": "节日 (jiérì) is a festival, a single day."
      "w2":
        "why": "周末 (zhōumò) is the weekend, a short break."
    "native": "This holiday is very long."
  "zh-1392":
    "confusables":
      "w1":
        "why": "元旦 (yuándàn) is New Year's Day, a different holiday."
      "w2":
        "why": "生日 (shēngrì) is a birthday, not a festival."
    "bases":
      "春节":
        "meaning": "Spring Festival"
    "native": "Is the Spring Festival in January or February?"
  "zh-1393":
    "confusables":
      "w1":
        "why": "月底 (yuèdǐ) is the end of the month, the other end."
      "w2":
        "why": "上旬 (shàngxún) is the first ten days, a longer span."
    "native": "At the start of the month I go to school."
  "zh-1394":
    "confusables":
      "w1":
        "why": "每周 (měizhōu) is every week, without a day named."
      "w2":
        "why": "周五 (zhōuwǔ) is Friday, not Wednesday."
    "native": "I go swimming every Wednesday."
  "zh-1395":
    "confusables":
      "w1":
        "why": "日期 (rìqī) is a date in general, not a birthday."
      "w2":
        "why": "日历 (rìlì) is a calendar, the paper on the wall."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "It is my birthday."
