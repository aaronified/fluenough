"name": "Common radicals"
"description": "Ten common radicals, the parts that many characters share: mouth, water, hand, wood, sun, moon, fire, mountain, heart and child. Each is also a word of its own. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
- "script"
"cards":
  "zh-0233":
    "native": "mouth"
    "notes":
      "n1": "口 (kǒu) is mouth. It is the radical in many characters about eating and speaking, such as 吗 (ma), the question particle. 人口 (rénkǒu) is population."
    "examples":
      "人口很多。":
        "native": "The population is very large."
        "bases":
          "人口":
            "meaning": "population"
      "人口多吗？":
        "native": "Is the population large?"
        "bases":
          "人口":
            "meaning": "population"
  "zh-0234":
    "native": "water"
    "notes":
      "n1": "水 (shuǐ) is water. On the left of a character it is written as three dots, as in 海 (hǎi), sea, and 河 (hé), river."
    "examples":
      "水好吗？": "Is the water all right?"
      "这水很好。":
        "native": "This water is very good."
        "bases":
          "这":
            "meaning": "this"
  "zh-0235":
    "native": "hand"
    "notes":
      "n1": "手 (shǒu) is hand. On the left of a character it becomes a shorter form, as in 打 (dǎ), to hit or to play."
    "examples":
      "你手好吗？": "Is your hand all right?"
      "他的手很好。":
        "native": "His hands are fine."
        "bases":
          "的":
            "meaning": "a particle that links a possessor to what is possessed"
  "zh-0236":
    "native": "wood, tree"
    "notes":
      "n1": "木 (mù) is wood or a tree, most often inside a word such as 木头 (mùtou), wood. It is also the radical in 林 (lín), forest, which has two trees in it."
    "examples":
      "这木头很老。":
        "native": "This wood is very old."
        "bases":
          "木头":
            "meaning": "wood"
      "木头很多吗？":
        "native": "Is there a lot of wood?"
        "bases":
          "木头":
            "meaning": "wood"
  "zh-0237":
    "native": "sun, day"
    "notes":
      "n1": "日 (rì) is the sun, and also a day, as in a date. In speech a date is usually said with 号 (hào) instead. It is the radical in 明 (míng), bright, and in 时 (shí), time."
    "examples":
      "三月五日。": "The fifth of March."
      "几月几日？": "Which month and which day?"
  "zh-0238":
    "native": "moon, month"
    "notes":
      "n1": "月 (yuè) is the moon, and also a month, as in 几月 (jǐ yuè), which month. It sits beside 日 (rì) in 明 (míng), bright."
    "examples":
      "月很亮。":
        "native": "The moon is very bright."
        "bases":
          "亮":
            "meaning": "bright"
      "几月？": "Which month?"
  "zh-0239":
    "native": "fire"
    "notes":
      "n1": "火 (huǒ) is fire. At the bottom of a character it is written as four dots, as in 热 (rè), hot."
    "examples":
      "火很热。":
        "native": "The fire is very hot."
        "bases":
          "热":
            "meaning": "hot"
      "人很怕火。":
        "native": "People are very afraid of fire."
        "bases":
          "怕":
            "meaning": "to fear"
  "zh-0240":
    "native": "mountain"
    "notes":
      "n1": "山 (shān) is mountain. It is the radical in 岛 (dǎo), island, and 岸 (àn), shore."
    "examples":
      "山很高。":
        "native": "The mountain is very high."
        "bases":
          "高":
            "meaning": "tall, high"
      "山很多吗？": "Are there many mountains?"
  "zh-0241":
    "native": "heart, mind"
    "notes":
      "n1": "心 (xīn) is heart, and also mind or feelings. At the bottom of a character it is written with the same strokes, as in 想 (xiǎng), to think."
    "examples":
      "他心很好。": "He is kind-hearted."
      "他心很好吗？": "Is he kind-hearted?"
  "zh-0242":
    "native": "child, son"
    "notes":
      "n1": "子 (zǐ) is child or son. In 孩子 (háizi), child, it is said in the neutral tone, with no tone of its own."
    "examples":
      "孩子很多。":
        "native": "There are many children."
        "bases":
          "孩子":
            "meaning": "child"
      "他是孩子吗？":
        "native": "Is he a child?"
        "bases":
          "孩子":
            "meaning": "child"
