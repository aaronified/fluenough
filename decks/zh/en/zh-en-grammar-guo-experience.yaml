"name": "过 (guo): has done it before"
"license": "CC-BY-SA-4.0"
"description": "Experience: 过 (guo) after the verb says you have done something before. Not yet checked by a Mandarin speaker: please report any mistake."
"tags":
- "unreviewed"
"pattern":
  "name": "过 (guo): has done it before"
  "slot_name": "form"
  "prompt": "{lemma} ({gloss}), {slot}"
  "slots":
    "bare": "a plain statement"
    "exp": "has done it before, with 过 (guo)"
    "not": "has never done it, with 没 (méi) before the verb and 过 (guo) after it"
  "entries":
    "qu": "to go"
    "chi": "to eat"
    "kan": "to read"
    "he": "to drink"
    "lai": "to come"
    "jian": "to meet; to see"
    "qi": "to ride"
  "notes": "过 (guo) goes straight after the verb, before any object: 我去过北京 (wǒ qù guo běijīng), I have been to Beijing. It says you did it at some time before, not when. To say you have never done it, put 没 (méi) before the verb and keep 过 (guo) after it: 我没去过北京 (wǒ méi qù guo běijīng), I have never been to Beijing. 过 (guo) is said in a neutral tone, so it has no tone mark. Do not use 了 (le) for this sense."
