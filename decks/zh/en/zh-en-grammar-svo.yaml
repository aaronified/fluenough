  "notes": "The order is as in English: subject, verb, object. 我吃鱼 (wǒ chī yú) is I eat fish, word for word. The verb never changes for the person or the number. Small words that say how, how often or whether go between the subject and the verb, never at the end: 也 (yě), also; 不 (bù), not; 都 (dōu), all; 常常 (chángcháng), often; 总是 (zǒngshì), always. 我也吃鱼 (wǒ yě chī yú) is I eat fish too, and 我吃鱼也 (wǒ chī yú yě) would be wrong. A word for when or where does not go there: it comes before the verb as well (see the next deck)."
