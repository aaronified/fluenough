"name": "More verbs"
"description": "Thirty words for more daily actions: to clean, cook and tidy up; to study, teach and know; to feel, hope and need; to set off, travel and go out; to run, swim, sing and dance; and to help, see, lend, enter and return. Not yet checked by a Mandarin speaker: please report any mistake."
