"cards":
  "zh-0552":
    "native": "to clean; to sweep"
    "notes":
      "n1": "To clean a place by sweeping or tidying it: 打扫房间 (dǎsǎo fángjiān), to clean the room."
    "examples":
      "我们打扫房间。": "We clean the room."
      "周末你打扫吗？": "Do you clean at the weekend?"
  "zh-0553":
    "native": "to tidy up; to pack"
    "notes":
      "n1": "To tidy up, to put things in order, or to pack. 收拾东西 (shōushi dōngxi), to tidy one's things."
    "examples":
      "你收拾东西吗？": "Are you tidying your things?"
      "早上收拾房间。": "We tidy the room in the morning."
  "zh-0554":
    "native": "to cook"
    "notes":
      "n1": "To cook a meal. 做 (zuò) is to make or do, and 饭 (fàn) is the meal."
    "examples":
      "妈妈做饭。": "Mum cooks."
      "晚上你做饭吗？": "Do you cook in the evening?"
  "zh-0555":
    "native": "cooked rice; a meal"
    "notes":
      "n1": "Cooked rice, or a meal in general. 吃饭 (chīfàn), to eat a meal; 做饭 (zuòfàn), to cook."
    "examples":
      "饭很好吃。": "The meal is very tasty."
      "饭很多。": "There is a lot of food."
  "zh-0556":
    "native": "to study; to learn"
    "notes":
      "n1": "To study or to learn. It is more general than 读 (dú), to read."
    "examples":
      "我们学习。": "We study."
      "你学习吗？": "Do you study?"
  "zh-0557":
    "native": "to practise"
    "notes":
      "n1": "To practise, or to do exercises and drills. 练习写字 (liànxí xiě zì), to practise writing characters."
    "examples":
      "他们练习写字。": "They practise writing characters."
      "你练习吗？": "Do you practise?"
  "zh-0558":
    "native": "to teach; to show"
    "notes":
      "n1": "To teach, or to show someone how to do a thing. 老师 (lǎoshī) is the teacher who does it."
    "examples":
      "老师教我们。": "The teacher teaches us."
      "妈妈教我写字。": "Mum teaches me to write characters."
  "zh-0559":
    "native": "to know (a fact)"
    "notes":
      "n1": "To know a fact, or that something is so. Compare 认识 (rènshi), to know a person."
    "examples":
      "我知道。": "I know."
      "你知道吗？": "Do you know?"
  "zh-0560":
    "native": "to understand"
    "notes":
      "n1": "To understand what is said or meant. 你明白吗 (nǐ míngbai ma)? means: do you understand?"
    "examples":
      "我明白。": "I understand."
      "你明白吗？": "Do you understand?"
  "zh-0561":
    "native": "to feel; to think"
    "notes":
      "n1": "To feel, or to think that something is so: 我觉得 (wǒ juéde), I think."
    "examples":
      "我觉得很好。": "I think it is very good."
      "你觉得累吗？": "Do you feel tired?"
  "zh-0562":
    "native": "to hope; to wish"
    "notes":
      "n1": "To hope, or to wish for something. It is stronger than 想 (xiǎng), to want."
    "examples":
      "我希望你来。": "I hope you come."
      "我们希望早来。": "We hope to come early."
  "zh-0563":
    "native": "to need"
    "notes":
      "n1": "To need something. 需要钱 (xūyào qián), to need money."
    "examples":
      "我需要钱。": "I need money."
      "你需要茶吗？": "Do you need tea?"
  "zh-0564":
    "native": "should; ought to"
    "notes":
      "n1": "Should, or ought to, for what is right to do: 应该休息 (yīnggāi xiūxi), should rest."
    "examples":
      "我们应该早来。": "We should come early."
      "你应该休息。": "You should rest."
  "zh-0565":
    "native": "to end; to finish"
    "notes":
      "n1": "To end or to finish. Its opposite is 开始 (kāishǐ), to begin."
    "examples":
      "现在结束。": "It ends now."
      "几点结束？": "What time does it finish?"
  "zh-0566":
    "native": "to set off; to start a journey"
    "notes":
      "n1": "To set off, to start a journey. 几点出发 (jǐ diǎn chūfā), what time do you set off?"
    "examples":
      "我们明天出发。": "We set off tomorrow."
      "你几点出发？": "What time do you set off?"
  "zh-0567":
    "native": "to go out"
    "notes":
      "n1": "To go out of the house, for a short trip. It is less than 旅行 (lǚxíng), to travel."
    "examples":
      "我现在出门。": "I am going out now."
      "你早上出门吗？": "Do you go out in the morning?"
  "zh-0568":
    "native": "to travel"
    "notes":
      "n1": "To travel, for a trip or a holiday away from home."
    "examples":
      "我们去旅行。": "We go travelling."
      "你喜欢旅行吗？": "Do you like travelling?"
  "zh-0569":
    "native": "to stroll; to browse"
    "notes":
      "n1": "To stroll or look around, for pleasure, as in a shop or a park."
    "examples":
      "周末我们逛。": "At the weekend we stroll about."
      "你们今天逛吗？": "Are you going out to stroll today?"
  "zh-0570":
    "native": "to jog; to run"
    "notes":
      "n1": "To run or jog, for exercise. 跑 (pǎo) is to run."
    "examples":
      "我跑步。": "I jog."
      "早上你跑步吗？": "Do you jog in the morning?"
  "zh-0571":
    "native": "to swim"
    "notes":
      "n1": "To swim. 游 (yóu) is to swim and 泳 (yǒng) is swimming."
    "examples":
      "他游泳。": "He swims."
      "你们游泳吗？": "Do you swim?"
  "zh-0572":
    "native": "to sing"
    "notes":
      "n1": "To sing. 歌 (gē) is a song."
    "examples":
      "她唱歌。": "She sings."
      "你们唱歌吗？": "Do you sing?"
  "zh-0573":
    "native": "to dance"
    "notes":
      "n1": "To dance. 跳 (tiào) is to jump, and 舞 (wǔ) is dance."
    "examples":
      "妹妹跳舞。": "The younger sister dances."
      "你跳舞吗？": "Do you dance?"
  "zh-0574":
    "native": "to exercise; to do sport"
    "notes":
      "n1": "To exercise or do sport. It is also a noun for sport."
    "examples":
      "我们运动。": "We exercise."
      "你运动吗？": "Do you exercise?"
  "zh-0575":
    "native": "to take a walk"
    "notes":
      "n1": "To take a walk, slowly, for fresh air. Compare 跑步 (pǎobù), to jog."
    "examples":
      "我们散步。": "We take a walk."
      "晚上你散步吗？": "Do you take a walk in the evening?"
  "zh-0576":
    "native": "to help"
    "notes":
      "n1": "To help, to lend a hand. 请帮忙 (qǐng bāngmáng), please help."
    "examples":
      "请帮忙。": "Please help."
      "你帮忙吗？": "Will you help?"
  "zh-0577":
    "native": "to see; to meet"
    "notes":
      "n1": "To see or to meet a person. 明天见 (míngtiān jiàn), see you tomorrow."
    "examples":
      "明天见。": "See you tomorrow."
      "我们见老师。": "We see the teacher."
  "zh-0578":
    "native": "to change; to exchange"
    "notes":
      "n1": "To change or exchange. 换衣服 (huàn yīfu), to change one's clothes."
    "examples":
      "请换。": "Please exchange it."
      "你换鞋吗？": "Are you changing your shoes?"
  "zh-0579":
    "native": "to lend; to borrow"
    "notes":
      "n1": "To lend, or to borrow. 借 (jiè) means both: to lend something to someone, and to borrow it from them."
    "examples":
      "我借书。": "I borrow a book."
      "你借钱吗？": "Do you lend money?"
  "zh-0580":
    "native": "to enter; to go in"
    "notes":
      "n1": "To enter, or to go in. Its opposite is 出 (chū), to go out."
    "examples":
      "请进。": "Please come in."
      "我们进学校。": "We go into the school."
  "zh-0581":
    "native": "to return; to go back"
    "notes":
      "n1": "To return, or to go back. 回家 (huíjiā) is to go home."
    "examples":
      "我早回。": "I return early."
      "你几点回？": "What time do you return?"
