"name": "Doubling an adjective: 小小的 (xiǎoxiǎo de), a lively description"
"license": "CC-BY-SA-4.0"
"description": "An adjective can be doubled, with 的 (de) after it before a noun, to make the description lively or affectionate: 小小的房间 (xiǎoxiǎo de fángjiān), a small room. Not yet checked by a Mandarin speaker: please report any mistake."
