- "beginner"
- "unreviewed"
"cards":
  "zh-2684":
    "confusables":
      "w1":
        "why": "读 (dú) is to read aloud, not to look at."
      "w2":
        "why": "买 (mǎi) is to buy, a different action."
    "bases":
      "看看":
        "meaning": "have a look"
    "native": "Have a look at this book."
  "zh-2685":
    "confusables":
      "w1":
        "why": "问 (wèn) is to ask, not to think."
      "w2":
        "why": "解决 (jiějué) is to solve, which comes later."
    "bases":
      "想想":
        "meaning": "think for a moment"
    "native": "I will think about this problem for a moment."
  "zh-2686":
    "confusables":
      "w1":
        "why": "穿 (chuān) is to wear, the result of trying it on."
      "w2":
        "why": "买 (mǎi) is to buy, not to try."
    "bases":
      "试试":
        "meaning": "try for a moment"
    "native": "I will try on this piece of clothing."
  "zh-2687":
    "confusables":
      "w1":
        "why": "问题 (wèntí) is a problem, a noun."
      "w2":
        "why": "回答 (huídá) is to answer, the other side."
    "bases":
      "问问":
        "meaning": "ask for a moment"
    "native": "He will ask the teacher for a moment."
  "zh-2688":
    "confusables":
      "w1":
        "why": "大 (dà) is big, the opposite of small."
      "w2":
        "why": "宽 (kuān) is wide, a different quality."
    "bases":
      "小小":
        "meaning": "small (affectionate)"
      "的":
        "meaning": "a particle: of; the one that"
    "native": "The small room is very quiet."
  "zh-2689":
    "confusables":
      "w1":
        "why": "黄 (huáng) is yellow, a different colour."
      "w2":
        "why": "热 (rè) is hot, a different state."
    "bases":
      "的":
        "meaning": "a particle: of; the one that"
      "红红":
        "meaning": "rosy; red"
    "native": "Her face is rosy."
  "zh-2690":
    "confusables":
      "w1":
        "why": "短 (duǎn) is short, the opposite of long."
      "w2":
        "why": "直 (zhí) is straight, a different shape."
    "bases":
      "长长":
        "meaning": "long"
      "的":
        "meaning": "a particle: of; the one that"
    "native": "The long hair is very pretty."
  "zh-2691":
    "confusables":
      "w1":
        "why": "矮 (ǎi) is short, the opposite of tall."
      "w2":
        "why": "远 (yuǎn) is far, a different idea."
    "bases":
      "座":
        "meaning": "measure word for mountains and buildings"
      "高高":
        "meaning": "quite tall"
      "的":
        "meaning": "a particle: of; the one that"
    "native": "This mountain is quite tall."
