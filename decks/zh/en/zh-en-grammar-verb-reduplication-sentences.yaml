  "name": "English"
"name": "Doubling verbs and adjectives: 看看 (kànkan) and 小小的 (xiǎoxiǎo de)"
"description": "Sentences that double a verb to make it short and light, such as 看看 (kànkan), and double an adjective to make it lively, such as 小小的 (xiǎoxiǎo de). Not yet checked by a Mandarin speaker: please report any mistake."
