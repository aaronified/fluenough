"cards":
  "zh-3596":
    "confusables":
      "w1":
        "why": "道歉 (dàoqiàn) is to apologise, not to thank."
      "w2":
        "why": "感谢 (gǎnxiè) is to thank formally."
    "bases":
      "谢谢":
        "meaning": "thank you"
      "的":
        "meaning": "of"
      "了":
        "meaning": "a particle"
    "native": "Thank you for the gift, you are too kind."
  "zh-3597":
    "confusables":
      "w1":
        "why": "抱歉 (bàoqiàn) is a formal sorry."
      "w2":
        "why": "迟到 (chídào) is to be late, the fact."
    "bases":
      "了":
        "meaning": "a particle"
    "native": "Sorry, I am late."
  "zh-3598":
    "confusables":
      "w1":
        "why": "拜访 (bàifǎng) is a formal visit."
      "w2":
        "why": "请客 (qǐngkè) is to invite and pay, the host's role."
    "bases":
      "要":
        "meaning": "to want"
    "native": "We are visiting his home, so we must bring a gift."
  "zh-3599":
    "confusables":
      "w1":
        "why": "客人 (kèrén) is a guest, the other role."
      "w2":
        "why": "招待 (zhāodài) is to entertain, the host's act."
    "bases":
      "让":
        "meaning": "to let; to make"
    "native": "The host asked us to sit down first."
  "zh-3600":
    "confusables":
      "w1":
        "why": "耐心 (nàixīn) is patient, a different quality."
      "w2":
        "why": "热情 (rèqíng) is warm, a different quality."
    "native": "He is very sensible, and also very considerate."
  "zh-3601":
    "confusables":
      "w1":
        "why": "夸奖 (kuājiǎng) is to praise, the opposite."
      "w2":
        "why": "称赞 (chēngzàn) is to commend, the opposite."
    "bases":
      "不要":
        "meaning": "do not"
      "了":
        "meaning": "a particle"
    "native": "Please do not blame the child, he has already apologised."
  "zh-3602":
    "confusables":
      "w1":
        "why": "干杯 (gānbēi) is to cheers, which comes with the toast."
      "w2":
        "why": "恭喜 (gōngxǐ) is to congratulate, a close word."
    "bases":
      "向":
        "meaning": "towards"
    "native": "Everyone toasted the teacher and congratulated him."
  "zh-3603":
    "confusables":
      "w1":
        "why": "温柔 (wēnróu) is gentle, a different quality."
      "w2":
        "why": "礼节 (lǐjié) is formal courtesy, a related word."
    "bases":
      "没有":
        "meaning": "there is not"
    "native": "She is very rough and has no manners."
