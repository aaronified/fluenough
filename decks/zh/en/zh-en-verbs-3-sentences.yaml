"cards":
  "zh-2418":
    "confusables":
      "w1":
        "why": "听见 (tīngjiàn) is to hear, not to see."
      "w2":
        "why": "想起 (xiǎngqǐ) is to remember, a different sense."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "I saw him."
  "zh-2419":
    "confusables":
      "w1":
        "why": "计划 (jìhuà) is a plan, a noun in this sense."
      "w2":
        "why": "选择 (xuǎnzé) is to choose, a different act."
    "native": "I have decided to go to China."
  "zh-2420":
    "confusables":
      "w1":
        "why": "害怕 (hàipà) is to be afraid, a different feeling."
      "w2":
        "why": "生气 (shēngqì) is to be angry, another feeling."
    "native": "Mum is very worried."
  "zh-2421":
    "confusables":
      "w1":
        "why": "拒绝 (jùjué) is to refuse, the opposite."
      "w2":
        "why": "反对 (fǎnduì) is to oppose, the opposite."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
      "意见":
        "meaning": "opinion"
    "native": "I agree with your opinion."
  "zh-2422":
    "confusables":
      "w1":
        "why": "处理 (chǔlǐ) is to handle, which may not solve it."
      "w2":
        "why": "讨论 (tǎolùn) is to discuss, not to solve."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "We solved the problem."
  "zh-2423":
    "confusables":
      "w1":
        "why": "批评 (pīpíng) is to criticise, the opposite."
      "w2":
        "why": "鼓励 (gǔlì) is to encourage, a close word."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "The teacher praised me."
  "zh-2424":
    "confusables":
      "w1":
        "why": "怀疑 (huáiyí) is to doubt, the opposite."
      "w2":
        "why": "支持 (zhīchí) is to support, a different act."
    "native": "I believe you."
  "zh-2425":
    "confusables":
      "w1":
        "why": "失败 (shībài) is to fail, the opposite."
      "w2":
        "why": "尝试 (chángshì) is to try, before the result."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "He has succeeded."
