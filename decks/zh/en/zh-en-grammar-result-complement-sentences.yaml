"name": "完 (wán), 懂 (dǒng), 到 (dào) and 好 (hǎo) after the verb in sentences"
"description": "Sentences where a result word after the verb says how the action ended: 吃完 (finish eating), 听懂 (understand by hearing), 找到 (find), 做好 (make well). Not yet checked by a Mandarin speaker: please report any mistake."
