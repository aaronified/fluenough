- "beginner"
- "unreviewed"
"cards":
  "zh-1904":
    "confusables":
      "w1":
        "why": "喝 (hē) is to drink, not to finish a meal."
      "w2":
        "why": "买 (mǎi) is to buy, not to eat."
    "bases":
      "完":
        "meaning": "finished"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "I have finished eating."
  "zh-1905":
    "confusables":
      "w1":
        "why": "说 (shuō) is to speak, not to understand."
      "w2":
        "why": "写 (xiě) is to write, a different action."
    "bases":
      "懂":
        "meaning": "to understand"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "Did he understand what he heard?"
  "zh-1906":
    "confusables":
      "w1":
        "why": "丢 (diū) is to lose, which is not finding."
      "w2":
        "why": "带 (dài) is to bring, not to find."
    "bases":
      "没":
        "meaning": "not; did not"
      "到":
        "meaning": "to arrive; to reach"
    "native": "I did not find the keys."
  "zh-1907":
    "confusables":
      "w1":
        "why": "学习 (xuéxí) is to study, a general word."
      "w2":
        "why": "练习 (liànxí) is to practise, not to finish."
    "bases":
      "作业":
        "meaning": "homework"
      "完":
        "meaning": "finished"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "Have you finished the homework?"
  "zh-1908":
    "confusables":
      "w1":
        "why": "认识 (rènshi) is to know a person or a word, not to understand it."
      "w2":
        "why": "读 (dú) is to read aloud."
    "bases":
      "懂":
        "meaning": "to understand"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "I have understood this character."
  "zh-1909":
    "confusables":
      "w1":
        "why": "吃 (chī) is to eat, after the meal is ready."
      "w2":
        "why": "买 (mǎi) is to buy, not to make."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "Is the meal ready?"
  "zh-1910":
    "confusables":
      "w1":
        "why": "卖 (mài) is to sell, the opposite of buying."
      "w2":
        "why": "借 (jiè) is to borrow, not to buy."
    "bases":
      "到":
        "meaning": "to arrive; to reach"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "I got that book."
  "zh-1911":
    "confusables":
      "w1":
        "why": "听 (tīng) is to listen, not to speak."
      "w2":
        "why": "写 (xiě) is to write, not to speak."
    "bases":
      "得":
        "meaning": "a particle after a verb: how it is done"
      "清楚":
        "meaning": "clear"
    "native": "He speaks very clearly."
