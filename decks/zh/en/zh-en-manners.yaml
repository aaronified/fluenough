"cards":
  "zh-3546":
    "native": "politeness"
    "notes":
      "n1": "Behaviour that shows respect for others. 礼 (lǐ) is courtesy, and 貌 (mào) is manner."
    "examples":
      "他很有礼貌。":
        "native": "He is very polite."
        "bases":
          "有":
            "meaning": "to have; there is"
      "要对老人有礼貌。":
        "native": "You must be polite to the elderly."
        "bases":
          "要":
            "meaning": "to want"
          "老人":
            "meaning": "old person"
          "有":
            "meaning": "to have; there is"
  "zh-3547":
    "native": "to respect"
    "notes":
      "n1": "To think highly of someone. 尊 (zūn) is to honour, and 敬 (jìng) is to respect."
    "examples":
      "我很尊敬老师。": "I respect my teacher very much."
      "大家尊敬他。": "Everyone respects him."
  "zh-3548":
    "native": "polite; modest"
    "notes":
      "n1": "Showing manners by not being too direct. 客 (kè) is a guest, and 气 (qì) is manner."
    "examples":
      "不要客气。":
        "native": "Please do not be polite."
        "bases":
          "不要":
            "meaning": "do not"
      "他很客气。": "He is very courteous."
  "zh-3549":
    "native": "modest; humble"
    "notes":
      "n1": "Not showing off about one's own ability. 谦 (qiān) is humble, and 虚 (xū) is empty."
    "examples":
      "他很谦虚。": "He is very modest."
      "谦虚是一种美德。":
        "native": "Modesty is a virtue."
        "bases":
          "种":
            "meaning": "kind; type"
          "美德":
            "meaning": "virtue"
  "zh-3550":
    "native": "appropriate; proper"
    "notes":
      "n1": "Suitable for the situation. 得 (dé) is fitting, and 体 (tǐ) is manner."
    "examples":
      "她说话很得体。":
        "native": "Her speech is very appropriate."
        "bases":
          "说话":
            "meaning": "to speak"
      "穿着要得体。":
        "native": "Dress should be suitable."
        "bases":
          "要":
            "meaning": "to want"
  "zh-3551":
    "native": "sensible; knowing how to behave"
    "notes":
      "n1": "Knowing how to behave well for one's age. 懂 (dǒng) is to understand, and 事 (shì) is matter."
    "examples":
      "孩子很懂事。": "The child is very sensible."
      "他从小就很懂事。":
        "native": "He has been well behaved since he was small."
        "bases":
          "从小":
            "meaning": "since childhood"
  "zh-3552":
    "native": "considerate"
    "notes":
      "n1": "Thoughtful about the feelings of others. 体 (tǐ) is body, and 贴 (tiē) is close."
    "examples":
      "他很体贴。": "He is very considerate."
      "妈妈很体贴。": "Mum is very thoughtful."
  "zh-3553":
    "native": "thorough; attentive"
    "notes":
      "n1": "Careful and complete in looking after people. 周 (zhōu) is complete, and 到 (dào) is reached."
    "examples":
      "服务很周到。": "The service is very attentive."
      "他考虑得很周到。":
        "native": "He has thought it through very carefully."
        "bases":
          "得":
            "meaning": "a particle: how it is done"
  "zh-3554":
    "native": "sorry"
    "notes":
      "n1": "Feeling sorry for a mistake or trouble caused. 抱 (bào) is to hold, and 歉 (qiàn) is apology."
    "examples":
      "很抱歉。": "I am very sorry."
      "抱歉让你久等了。":
        "native": "Sorry to have kept you waiting."
        "bases":
          "让":
            "meaning": "to let; to make"
          "久":
            "meaning": "long (of time)"
          "了":
            "meaning": "a particle"
  "zh-3555":
    "native": "to apologise"
    "notes":
      "n1": "To say you are sorry. 道 (dào) is to say, and 歉 (qiàn) is apology."
    "examples":
      "他向我道歉了。":
        "native": "He apologised to me."
        "bases":
          "向":
            "meaning": "towards"
          "了":
            "meaning": "a particle"
      "请道歉。": "Please apologise."
  "zh-3556":
    "native": "polite formality"
    "notes":
      "n1": "Polite words that are not meant literally. 客 (kè) is a guest, and 套 (tào) is a set."
    "examples":
      "这只是客套。":
        "native": "This is just politeness."
        "bases":
          "只是":
            "meaning": "only; just"
      "不要说客套话。":
        "native": "Do not say empty polite words."
        "bases":
          "不要":
            "meaning": "do not"
          "客套话":
            "meaning": "polite formula"
  "zh-3557":
    "native": "to invite as a host; to treat"
    "notes":
      "n1": "To pay for a meal for a guest. 请 (qǐng) is to invite, and 客 (kè) is a guest."
    "examples":
      "今天我请客。": "Today I am treating you."
      "他请我们吃饭。": "He invited us to a meal."
  "zh-3558":
    "native": "to be a guest"
    "notes":
      "n1": "To visit someone's home as a guest. 做 (zuò) is to be, and 客 (kè) is a guest."
    "examples":
      "我去朋友家做客。": "I am going to a friend's home as a guest."
      "做客要带礼物。":
        "native": "When visiting, bring a gift."
        "bases":
          "要":
            "meaning": "to want"
  "zh-3559":
    "native": "to visit (formally)"
    "notes":
      "n1": "To visit someone in a formal way. 拜 (bài) is to pay respect, and 访 (fǎng) is to visit."
    "examples":
      "我拜访了老师。":
        "native": "I visited my teacher."
        "bases":
          "了":
            "meaning": "a particle"
      "欢迎你来拜访。": "You are welcome to come and visit."
  "zh-3560":
    "native": "to greet; to send regards"
    "notes":
      "n1": "To ask how someone is. 问 (wèn) is to ask, and 候 (hòu) is to wait or greet."
    "examples":
      "请代我问候他。":
        "native": "Please send my regards to him."
        "bases":
          "代":
            "meaning": "on behalf of"
      "大家问候老师。": "Everyone sent their regards to the teacher."
  "zh-3561":
    "native": "to say hello"
    "notes":
      "n1": "To greet someone. 打 (dǎ) is to make, and 招呼 (zhāohu) is a greeting."
    "examples":
      "他跟我打招呼。":
        "native": "He said hello to me."
        "bases":
          "跟":
            "meaning": "with"
      "见面要打招呼。":
        "native": "When you meet, say hello."
        "bases":
          "要":
            "meaning": "to want"
  "zh-3562":
    "native": "to bow"
    "notes":
      "n1": "To bend the body forward to show respect. 鞠 (jū) is to bend, and 躬 (gōng) is to bow."
    "examples":
      "他向大家鞠躬。":
        "native": "He bowed to everyone."
        "bases":
          "向":
            "meaning": "towards"
      "日本人常常鞠躬。":
        "native": "Japanese people often bow."
        "bases":
          "日本人":
            "meaning": "Japanese person"
  "zh-3563":
    "native": "to shake hands"
    "notes":
      "n1": "To hold someone's hand as a greeting. 握 (wò) is to grip, and 手 (shǒu) is hand."
    "examples":
      "我们握手了。":
        "native": "We shook hands."
        "bases":
          "了":
            "meaning": "a particle"
      "见到他要握手。":
        "native": "When you meet him, shake hands."
        "bases":
          "见到":
            "meaning": "to meet; to see"
          "要":
            "meaning": "to want"
  "zh-3564":
    "native": "to hug"
    "notes":
      "n1": "To put your arms round someone. 拥 (yōng) is to embrace, and 抱 (bào) is to hold."
    "examples":
      "朋友们拥抱了。":
        "native": "The friends hugged."
        "bases":
          "朋友们":
            "meaning": "friends"
          "了":
            "meaning": "a particle"
      "她拥抱了妈妈。":
        "native": "She hugged her mother."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3565":
    "native": "to toast; to offer a drink"
    "notes":
      "n1": "To raise a glass to someone. 敬 (jìng) is to respect, and 酒 (jiǔ) is alcohol."
    "examples":
      "大家向老师敬酒。":
        "native": "Everyone toasted the teacher."
        "bases":
          "向":
            "meaning": "towards"
      "敬酒的时候要站起来。":
        "native": "When you toast, stand up."
        "bases":
          "的":
            "meaning": "of"
          "要":
            "meaning": "to want"
          "起来":
            "meaning": "up"
  "zh-3566":
    "native": "to cheers; to drink up"
    "notes":
      "n1": "To say cheers and drink. 干 (gān) is dry, and 杯 (bēi) is a cup."
    "examples":
      "为了健康，干杯！":
        "native": "To health, cheers!"
        "bases":
          "为":
            "meaning": "for"
          "了":
            "meaning": "a particle"
      "我们一起干杯。": "Let us all drink together."
  "zh-3567":
    "native": "red envelope with money"
    "notes":
      "n1": "A red envelope with money given as a gift. 红 (hóng) is red, and 包 (bāo) is a packet."
    "examples":
      "过年给孩子红包。":
        "native": "At New Year we give children red envelopes."
        "bases":
          "过年":
            "meaning": "New Year"
          "给":
            "meaning": "to give; for"
      "他收到了红包。":
        "native": "He received a red envelope."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3568":
    "native": "to meet"
    "notes":
      "n1": "To come together with someone. 见 (jiàn) is to see, and 面 (miàn) is face."
    "examples":
      "我们明天见面。": "We will meet tomorrow."
      "很高兴见面。": "Glad to meet you."
  "zh-3569":
    "native": "to say goodbye"
    "notes":
      "n1": "To say farewell. 告 (gào) is to tell, and 别 (bié) is to part."
    "examples":
      "大家告别了。":
        "native": "Everyone said goodbye."
        "bases":
          "了":
            "meaning": "a particle"
      "告别的时候很难过。":
        "native": "It was sad to say goodbye."
        "bases":
          "的":
            "meaning": "of"
  "zh-3570":
    "native": "to visit (formal)"
    "notes":
      "n1": "A polite word for someone coming to a place. 光 (guāng) is honour, and 临 (lín) is to arrive."
    "examples":
      "欢迎光临。": "Welcome, please come in."
      "感谢您的光临。":
        "native": "Thank you for your visit."
        "bases":
          "的":
            "meaning": "of"
  "zh-3571":
    "native": "to congratulate"
    "notes":
      "n1": "To wish someone happiness for good news. 恭 (gōng) is respectful, and 喜 (xǐ) is joy."
    "examples":
      "恭喜你！": "Congratulations!"
      "大家恭喜他结婚。":
        "native": "Everyone congratulated him on his marriage."
        "bases":
          "结婚":
            "meaning": "to marry"
  "zh-3572":
    "native": "to celebrate; to congratulate"
    "notes":
      "n1": "To say you are happy for someone's success. 祝 (zhù) is to wish, and 贺 (hè) is to congratulate."
    "examples":
      "我祝贺你。": "I congratulate you."
      "大家祝贺他的成功。":
        "native": "Everyone celebrated his success."
        "bases":
          "的":
            "meaning": "of"
  "zh-3573":
    "native": "etiquette; formal courtesy"
    "notes":
      "n1": "A formal way of behaving politely. 礼 (lǐ) is courtesy, and 节 (jié) is a section."
    "examples":
      "礼节很重要。": "Formal courtesy is very important."
      "他很懂礼节。":
        "native": "He understands etiquette well."
        "bases":
          "懂":
            "meaning": "to understand"
  "zh-3574":
    "native": "rule; custom"
    "notes":
      "n1": "A rule for how things are done. 规 (guī) is a rule, and 矩 (jǔ) is a standard."
    "examples":
      "这里有规矩。":
        "native": "There are rules here."
        "bases":
          "这里":
            "meaning": "here"
          "有":
            "meaning": "to have; there is"
      "家里的规矩很多。":
        "native": "There are many rules at home."
        "bases":
          "家里":
            "meaning": "at home"
          "的":
            "meaning": "of"
  "zh-3575":
    "native": "rude; impolite"
    "notes":
      "n1": "Not polite or proper. 失 (shī) is to lose, and 礼 (lǐ) is courtesy."
    "examples":
      "这样做很失礼。":
        "native": "Doing it this way is very rude."
        "bases":
          "这样":
            "meaning": "like this"
      "我失礼了。":
        "native": "I was impolite."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3576":
    "native": "to offend"
    "notes":
      "n1": "To say or do something that upsets someone. 冒 (mào) is to risk, and 犯 (fàn) is to offend."
    "examples":
      "对不起，我没有冒犯你。":
        "native": "Sorry, I did not mean to offend you."
        "bases":
          "没有":
            "meaning": "there is not"
      "这句话很冒犯。":
        "native": "This remark is very offensive."
        "bases":
          "句":
            "meaning": "measure word for sentences"
          "话":
            "meaning": "words; speech"
  "zh-3577":
    "native": "patient"
    "notes":
      "n1": "Able to wait calmly. 耐 (nài) is to endure, and 心 (xīn) is heart."
    "examples":
      "老师很耐心。": "The teacher is very patient."
      "请耐心等一下。":
        "native": "Please wait patiently for a moment."
        "bases":
          "一下":
            "meaning": "a little while"
  "zh-3578":
    "native": "sincere"
    "notes":
      "n1": "Honest and genuine. 诚 (chéng) is sincere, and 恳 (kěn) is earnest."
    "examples":
      "他的态度很诚恳。":
        "native": "His attitude is very sincere."
        "bases":
          "的":
            "meaning": "of"
      "谢谢你诚恳的帮助。":
        "native": "Thank you for your sincere help."
        "bases":
          "谢谢":
            "meaning": "thank you"
          "的":
            "meaning": "of"
  "zh-3579":
    "native": "warm-hearted; helpful"
    "notes":
      "n1": "Eager to help others. 热 (rè) is warm, and 心 (xīn) is heart."
    "examples":
      "邻居很热心。": "The neighbours are very helpful."
      "他热心帮助别人。": "He is keen to help others."
  "zh-3580":
    "native": "frank; straightforward"
    "notes":
      "n1": "Saying what one thinks openly. 直 (zhí) is direct, and 率 (shuài) is frank."
    "examples":
      "她的话很直率。":
        "native": "Her words are very frank."
        "bases":
          "的":
            "meaning": "of"
          "话":
            "meaning": "words; speech"
      "他性格直率。": "He is a frank person."
  "zh-3581":
    "native": "to understand and forgive"
    "notes":
      "n1": "To feel for someone's situation. 体 (tǐ) is to understand, and 谅 (liàng) is to forgive."
    "examples":
      "请体谅我。": "Please understand my situation."
      "大家体谅他的困难。":
        "native": "Everyone understood his difficulties."
        "bases":
          "的":
            "meaning": "of"
          "困难":
            "meaning": "difficult"
  "zh-3582":
    "native": "to forgive; to excuse"
    "notes":
      "n1": "To excuse someone's mistake. 包 (bāo) is to include, and 涵 (hán) is to tolerate."
    "examples":
      "请多包涵。": "Please excuse me."
      "他请大家包涵。": "He asked everyone to forgive him."
  "zh-3583":
    "native": "host; owner"
    "notes":
      "n1": "The person who receives guests at home. 主 (zhǔ) is host, and 人 (rén) is a person."
    "examples":
      "主人很热情。": "The host is very warm."
      "感谢主人的款待。":
        "native": "Thank you to the host for the hospitality."
        "bases":
          "的":
            "meaning": "of"
  "zh-3584":
    "native": "to give up a seat"
    "notes":
      "n1": "To let someone else sit down. 让 (ràng) is to let, and 座 (zuò) is a seat."
    "examples":
      "请给老人让座。":
        "native": "Please give your seat to an elderly person."
        "bases":
          "给":
            "meaning": "to give; for"
          "老人":
            "meaning": "old person"
      "他主动让座。":
        "native": "He offered his seat."
        "bases":
          "主动":
            "meaning": "on one's own initiative"
  "zh-3585":
    "native": "to entertain (guests)"
    "notes":
      "n1": "To look after guests. 招 (zhāo) is to invite, and 待 (dài) is to treat."
    "examples":
      "我们招待了客人。":
        "native": "We entertained the guests."
        "bases":
          "了":
            "meaning": "a particle"
      "招待得很周到。":
        "native": "The hospitality was very thorough."
        "bases":
          "得":
            "meaning": "a particle: how it is done"
  "zh-3586":
    "native": "to host generously"
    "notes":
      "n1": "To welcome guests with food and kindness. 款 (kuǎn) is kindness, and 待 (dài) is to treat."
    "examples":
      "主人款待了我们。":
        "native": "The host gave us a warm welcome."
        "bases":
          "了":
            "meaning": "a particle"
      "感谢你的款待。":
        "native": "Thank you for your hospitality."
        "bases":
          "的":
            "meaning": "of"
  "zh-3587":
    "native": "polite expression"
    "notes":
      "n1": "A polite word or phrase. 礼 (lǐ) is courtesy, 貌 (mào) is manner, and 语 (yǔ) is language."
    "examples":
      "说礼貌语很好。": "Using polite expressions is good."
      "这是常用的礼貌语。":
        "native": "This is a common polite phrase."
        "bases":
          "常用":
            "meaning": "commonly used"
          "的":
            "meaning": "of"
  "zh-3588":
    "native": "to praise"
    "notes":
      "n1": "To say something good about someone. 夸 (kuā) is to boast, and 奖 (jiǎng) is a prize."
    "examples":
      "老师夸奖了我。":
        "native": "The teacher praised me."
        "bases":
          "了":
            "meaning": "a particle"
      "他夸奖我的菜很好吃。":
        "native": "He praised my cooking."
        "bases":
          "的":
            "meaning": "of"
  "zh-3589":
    "native": "to commend"
    "notes":
      "n1": "To say that someone did well. 称 (chēng) is to call, and 赞 (zàn) is to praise."
    "examples":
      "大家称赞他。": "Everyone commended him."
      "这个设计得到了称赞。":
        "native": "This design received praise."
        "bases":
          "设计":
            "meaning": "design"
          "得到":
            "meaning": "to get"
          "了":
            "meaning": "a particle"
  "zh-3590":
    "native": "to blame; to scold"
    "notes":
      "n1": "To tell someone they did wrong. 责 (zé) is to blame, and 备 (bèi) is to demand."
    "examples":
      "老师责备了他。":
        "native": "The teacher scolded him."
        "bases":
          "了":
            "meaning": "a particle"
      "不要责备孩子。":
        "native": "Do not blame the child."
        "bases":
          "不要":
            "meaning": "do not"
  "zh-3591":
    "native": "tolerant; forgiving"
    "notes":
      "n1": "Willing to forgive. 宽 (kuān) is wide, and 容 (róng) is to allow."
    "examples":
      "她很宽容。": "She is very forgiving."
      "我们要宽容别人。":
        "native": "We must be tolerant of others."
        "bases":
          "要":
            "meaning": "to want"
  "zh-3592":
    "native": "to endure; to be patient"
    "notes":
      "n1": "To control oneself and wait. 忍 (rěn) is to bear, and 耐 (nài) is to endure."
    "examples":
      "他忍耐了很久。":
        "native": "He endured it for a long time."
        "bases":
          "了":
            "meaning": "a particle"
          "久":
            "meaning": "long (of time)"
      "请忍耐一下。":
        "native": "Please bear with it for a moment."
        "bases":
          "一下":
            "meaning": "a little while"
  "zh-3593":
    "native": "respectable; dignified"
    "notes":
      "n1": "Looking good and proper in front of others. 体 (tǐ) is manner, and 面 (miàn) is face."
    "examples":
      "他穿得很体面。":
        "native": "He is dressed very respectably."
        "bases":
          "得":
            "meaning": "a particle: how it is done"
      "这个工作很体面。": "This job is very respectable."
  "zh-3594":
    "native": "rough; rude"
    "notes":
      "n1": "Not polite or gentle in manner. 粗 (cū) is rough, and 鲁 (lǔ) is blunt."
    "examples":
      "他很粗鲁。": "He is very rough."
      "不要说粗鲁的话。":
        "native": "Do not use rude language."
        "bases":
          "不要":
            "meaning": "do not"
