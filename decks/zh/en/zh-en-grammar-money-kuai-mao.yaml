  "notes": "块 (kuài) counts yuan, the whole unit of money, and 毛 (máo) counts mao, a tenth of a yuan: ten 毛 (máo) make one 块 (kuài), so 十毛钱 (shí máo qián) and 一块钱 (yí kuài qián) are the same sum. 钱 (qián) is money. In writing the units are 元 (yuán) and 角 (jiǎo); here the spoken words are taught. 一 (yī) is said yí before 块 (kuài), and yì before 毛 (máo), as in 一本书 (yì běn shū)."
