"id": "zh-en-daily-life"
"kind": "layer"
"core": "zh-daily-life"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "A day"
"description": "Forty-five words for a day at home: the alarm and the wake-up, washing and dressing, the hot water and the towel, the rest at noon and the quiet at night. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1289":
    "native": "alarm clock"
    "notes":
      "n1": "An alarm clock, which rings to wake you. 钟 (zhōng) is a clock."
    "examples":
      "闹钟响了，我醒了。":
        "native": "The alarm went off, and I woke up."
        "bases":
          "响":
            "meaning": "to ring; to sound"
          "了":
            "meaning": "a particle: a change has happened"
      "我的闹钟七点响。":
        "native": "My alarm rings at seven."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "响":
            "meaning": "to ring; to sound"
  "zh-1290":
    "native": "comb"
    "notes":
      "n1": "A comb, for the hair. 梳 (shū) is to comb."
    "examples":
      "梳子在桌子上。": "The comb is on the table."
      "我用梳子梳头。":
        "native": "I comb my hair with a comb."
        "bases":
          "用":
            "meaning": "to use"
  "zh-1291":
    "native": "towel"
    "notes":
      "n1": "A towel, for drying the face or the hands. 毛 (máo) is fur or fibre."
    "examples":
      "毛巾很干净。": "The towel is very clean."
      "妈妈用毛巾擦脸。":
        "native": "Mum wipes her face with a towel."
        "bases":
          "用":
            "meaning": "to use"
  "zh-1292":
    "native": "soap"
    "notes":
      "n1": "Soap, for washing the hands and body. 肥 (féi) is fat, from which soap was once made."
    "examples":
      "肥皂在洗手间里。": "The soap is in the bathroom."
      "我用肥皂洗手。":
        "native": "I wash my hands with soap."
        "bases":
          "用":
            "meaning": "to use"
  "zh-1293":
    "native": "toothpaste"
    "notes":
      "n1": "Toothpaste, for brushing the teeth. 膏 (gāo) is a paste."
    "examples":
      "牙膏用完了。":
        "native": "The toothpaste has run out."
        "bases":
          "用":
            "meaning": "to use"
          "完":
            "meaning": "finished"
          "了":
            "meaning": "a particle: a change has happened"
      "我每天用牙膏刷牙。":
        "native": "I brush my teeth with toothpaste every day."
        "bases":
          "每天":
            "meaning": "every day"
          "用":
            "meaning": "to use"
  "zh-1294":
    "native": "bathroom; toilet"
    "notes":
      "n1": "A bathroom or toilet, a polite word. 洗手 (xǐshǒu) is to wash the hands, and 间 (jiān) is a room."
    "examples":
      "洗手间在那儿。": "The bathroom is over there."
      "我去洗手间一下。":
        "native": "I will go to the bathroom for a moment."
        "bases":
          "一下":
            "meaning": "a little; have a try"
  "zh-1295":
    "native": "slippers"
    "notes":
      "n1": "Slippers, soft shoes worn at home. 鞋 (xié) is a shoe."
    "examples":
      "拖鞋在门口。": "The slippers are at the door."
      "他穿拖鞋去洗手间。": "He wears slippers to go to the bathroom."
  "zh-1296":
    "native": "to put on make-up"
    "notes":
      "n1": "To put on make-up. 妆 (zhuāng) is make-up."
    "examples":
      "她每天化妆。":
        "native": "She puts on make-up every day."
        "bases":
          "每天":
            "meaning": "every day"
      "她化妆很快。": "She puts on make-up quickly."
  "zh-1297":
    "native": "to shave"
    "notes":
      "n1": "To shave the beard. 刮 (guā) is to scrape, and 胡子 (húzi) is a beard."
    "examples":
      "爸爸早上刮胡子。": "Dad shaves in the morning."
      "我不喜欢刮胡子。": "I do not like shaving."
  "zh-1298":
    "native": "to wash the face"
    "notes":
      "n1": "To wash the face in the morning. 脸 (liǎn) is the face."
    "examples":
      "我先洗脸，再刷牙。": "I wash my face first, then brush my teeth."
      "孩子早上洗脸。": "The child washes his face in the morning."
  "zh-1299":
    "native": "to comb the hair"
    "notes":
      "n1": "To comb the hair. 梳 (shū) is to comb."
    "examples":
      "她在镜子前梳头。": "She combs her hair in front of the mirror."
      "梳头以后我走。": "After combing my hair I leave."
  "zh-1300":
    "native": "to take off (clothes or shoes)"
    "notes":
      "n1": "To take off clothes or shoes. Its opposite is 穿 (chuān), to put on."
    "examples":
      "进门以后脱鞋。": "Take off your shoes after you come in."
      "他脱了外套。":
        "native": "He took off his coat."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1301":
    "native": "to fold"
    "notes":
      "n1": "To fold clothes or paper into layers."
    "examples":
      "我叠衣服。": "I fold the clothes."
      "请把毛巾叠好。":
        "native": "Please fold the towel neatly."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
  "zh-1302":
    "native": "to pour"
    "notes":
      "n1": "To pour a drink or liquid out of a container."
    "examples":
      "我倒水。": "I pour some water."
      "请倒一杯茶。": "Please pour a cup of tea."
  "zh-1303":
    "native": "to rinse; to wash with water"
    "notes":
      "n1": "To rinse with water, or to wash out with running water."
    "examples":
      "我冲一下杯子。":
        "native": "I rinse the cup quickly."
        "bases":
          "一下":
            "meaning": "a little; have a try"
      "冲个澡再睡。":
        "native": "Have a shower, then sleep."
        "bases":
          "澡":
            "meaning": "bath"
          "睡":
            "meaning": "to sleep"
  "zh-1304":
    "native": "to boil; to burn; to heat"
    "notes":
      "n1": "To heat water or food on a fire, or to burn. 烧水 (shāoshuǐ) is to boil water."
    "examples":
      "我烧水。": "I am boiling water."
      "水烧开了。":
        "native": "The water has boiled."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1305":
    "native": "boiled water"
    "notes":
      "n1": "Water that has been boiled. 开 (kāi) is to boil, here."
    "examples":
      "喝开水很好。": "Drinking boiled water is good."
      "这个杯子有开水。":
        "native": "This cup has boiled water in it."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1306":
    "native": "hot water"
    "notes":
      "n1": "Hot water from a tap or a kettle. 热 (rè) is hot."
    "examples":
      "热水在厨房。": "The hot water is in the kitchen."
      "我用热水洗脸。":
        "native": "I wash my face with hot water."
        "bases":
          "用":
            "meaning": "to use"
  "zh-1307":
    "native": "cold water"
    "notes":
      "n1": "Cold water, not hot. 凉 (liáng) is cool, and 水 (shuǐ) is water."
    "examples":
      "我喝凉水。": "I drink cold water."
      "凉水很好。": "Cold water is nice."
  "zh-1308":
    "native": "to dry in the air"
    "notes":
      "n1": "To hang clothes or things out to dry in the air or sun."
    "examples":
      "我在阳台晾衣服。": "I hang the clothes out to dry on the balcony."
      "毛巾晾在窗户上。": "The towel is drying on the window."
  "zh-1309":
    "native": "to wake someone"
    "notes":
      "n1": "To wake someone up by calling or knocking. 叫 (jiào) is to call, and 醒 (xǐng) is to wake."
    "examples":
      "妈妈早上叫醒孩子。": "Mum wakes the child in the morning."
      "请叫醒我。": "Please wake me."
  "zh-1310":
    "native": "early morning"
    "notes":
      "n1": "The early morning, just after dawn. 清 (qīng) is clear, and 晨 (chén) is morning."
    "examples":
      "清晨很安静。": "The early morning is very quiet."
      "我清晨散步。": "I go for a walk in the early morning."
  "zh-1311":
    "native": "dusk; early evening"
    "notes":
      "n1": "The time just before dark, in the early evening. 晚 (wǎn) is evening."
    "examples":
      "傍晚我回家。": "I go home at dusk."
      "傍晚的风很凉快。":
        "native": "The evening breeze is cool."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1312":
    "native": "late at night"
    "notes":
      "n1": "The late hours of the night, when most people sleep. 深 (shēn) is deep, and 夜 (yè) is night."
    "examples":
      "深夜他还在工作。": "Late at night he is still working."
      "深夜很安静。": "The night is very quiet."
  "zh-1313":
    "native": "lunch break; midday rest"
    "notes":
      "n1": "A rest or nap at noon. 午 (wǔ) is noon, and 休 (xiū) is to rest."
    "examples":
      "我午休一下。":
        "native": "I rest for a moment at lunchtime."
        "bases":
          "一下":
            "meaning": "a little; have a try"
      "午休以后我继续工作。":
        "native": "After the lunch break I carry on working."
        "bases":
          "继续":
            "meaning": "to continue"
  "zh-1314":
    "native": "to chat"
    "notes":
      "n1": "To chat with someone, about nothing in particular. 聊 (liáo) is to talk."
    "examples":
      "我们聊天很开心。":
        "native": "We chat happily."
        "bases":
          "开心":
            "meaning": "happy"
      "晚上他和朋友聊天。":
        "native": "In the evening he chats with a friend."
        "bases":
          "和":
            "meaning": "and"
  "zh-1315":
    "native": "to doze; to nap"
    "notes":
      "n1": "To doze off for a short time, sitting or standing. 盹 (dǔn) is a doze."
    "examples":
      "他在沙发上打盹。": "He dozes on the sofa."
      "午饭以后我打盹。": "After lunch I doze off."
  "zh-1316":
    "native": "good night"
    "notes":
      "n1": "Good night, said before going to sleep. 安 (ān) is peace."
    "examples":
      "晚安！明天见。": "Good night! See you tomorrow."
      "妈妈说：晚安。": "Mum says: good night."
  "zh-1317":
    "native": "to dream"
    "notes":
      "n1": "To dream while asleep. 梦 (mèng) is a dream."
    "examples":
      "我昨天做梦了。":
        "native": "I dreamt yesterday."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "孩子在做梦。": "The child is dreaming."
  "zh-1318":
    "native": "to wake up"
    "notes":
      "n1": "To wake up from sleep."
    "examples":
      "我七点醒。": "I wake up at seven."
      "他还没醒。":
        "native": "He has not woken up yet."
        "bases":
          "没":
            "meaning": "not; did not"
  "zh-1319":
    "native": "habit; to be used to"
    "notes":
      "n1": "A habit, or to be used to doing something. 习 (xí) is practice."
    "examples":
      "早起是我的习惯。":
        "native": "Getting up early is my habit."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "我习惯了这个城市。":
        "native": "I am used to this city."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1320":
    "native": "switch"
    "notes":
      "n1": "A switch, for turning a light or machine on and off. 开 (kāi) is to open and 关 (guān) is to close."
    "examples":
      "灯的开关在门旁边。":
        "native": "The light switch is next to the door."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "请按开关。":
        "native": "Please press the switch."
        "bases":
          "按":
            "meaning": "to press"
  "zh-1321":
    "native": "breakfast"
    "notes":
      "n1": "Breakfast, a more formal word than 早饭 (zǎofàn)."
    "examples":
      "我每天吃早餐。":
        "native": "I eat breakfast every day."
        "bases":
          "每天":
            "meaning": "every day"
      "早餐是面包。": "Breakfast is bread."
  "zh-1322":
    "native": "dinner"
    "notes":
      "n1": "Dinner, a more formal word than 晚饭 (wǎnfàn)."
    "examples":
      "晚餐很好吃。": "Dinner is delicious."
      "我们一起吃晚餐。": "We eat dinner together."
  "zh-1323":
    "native": "at night"
    "notes":
      "n1": "In the night, after dark. 夜 (yè) is night and 里 (lǐ) is inside."
    "examples":
      "夜里很冷。": "It is very cold at night."
      "夜里他咳嗽。": "At night he coughs."
  "zh-1324":
    "native": "midnight; the middle of the night"
    "notes":
      "n1": "The middle of the night, around midnight. 半 (bàn) is half."
    "examples":
      "半夜我醒了。":
        "native": "I woke up in the middle of the night."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "半夜很安静。": "The middle of the night is very quiet."
  "zh-1325":
    "native": "to get light; dawn"
    "notes":
      "n1": "For the day to break and get light. 天 (tiān) is the sky or the day, and 亮 (liàng) is bright."
    "examples":
      "天亮了，我起床。":
        "native": "It is light; I get up."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "天亮很早。": "It gets light very early."
  "zh-1326":
    "native": "to get dark"
    "notes":
      "n1": "For the sky to get dark. 黑 (hēi) is black or dark."
    "examples":
      "天黑了，我们回家。":
        "native": "It is dark; we go home."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "天黑以后不要出去。":
        "native": "Do not go out after dark."
        "bases":
          "要":
            "meaning": "must; to want"
          "出去":
            "meaning": "out"
  "zh-1327":
    "native": "noisy; to make a noise"
    "notes":
      "n1": "Noisy, making a lot of sound. 闹钟 (nàozhōng) is an alarm clock."
    "examples":
      "外面很闹。": "It is very noisy outside."
      "孩子很闹。": "The child is very noisy."
  "zh-1328":
    "native": "to get up early"
    "notes":
      "n1": "To get up early in the morning. 早 (zǎo) is early, and 起 (qǐ) is to rise."
    "examples":
      "我每天早起。":
        "native": "I get up early every day."
        "bases":
          "每天":
            "meaning": "every day"
      "早起对身体好。": "Getting up early is good for the body."
  "zh-1329":
    "native": "to get up late"
    "notes":
      "n1": "To get up late in the morning. 晚 (wǎn) is late, and 起 (qǐ) is to rise."
    "examples":
      "周末我晚起。": "At the weekend I get up late."
      "他晚起了。":
        "native": "He got up late."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1330":
    "native": "busy; hectic"
    "notes":
      "n1": "Busy, with a lot to do. 忙 (máng) is busy, and 碌 (lù) is the same sense."
    "examples":
      "早上很忙碌。": "The morning is very busy."
      "他的生活很忙碌。":
        "native": "His life is very busy."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "生活":
            "meaning": "life; daily life"
  "zh-1331":
    "native": "leisure; free time"
    "notes":
      "n1": "Leisure, time to rest and enjoy oneself. 休 (xiū) is rest, and 闲 (xián) is free."
    "examples":
      "周末是休闲的时间。":
        "native": "The weekend is leisure time."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "他喜欢休闲运动。": "He likes leisure sports."
  "zh-1332":
    "native": "free; not busy"
    "notes":
      "n1": "Free, with time to spare. 空 (kōng) is empty, and 闲 (xián) is free."
    "examples":
      "我现在有空闲。":
        "native": "I am free now."
        "bases":
          "有":
            "meaning": "to have; there is"
      "周末我很空闲。": "I am very free at the weekend."
  "zh-1333":
    "native": "to tidy up; to put in order"
    "notes":
      "n1": "To tidy up or put things in order."
    "examples":
      "我整理房间。": "I tidy the room."
      "请整理一下桌子。":
        "native": "Please tidy the table a little."
        "bases":
          "一下":
            "meaning": "a little; have a try"
