"schema": 1
"id": "zh-en-news"
"kind": "layer"
"core": "zh-news"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "News"
"description": "Fifty-five words for the news: the reporters and the papers, the broadcasts and the readers, the government and the economy, the events and the debate. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-2967":
    "native": "news"
    "notes":
      "n1": "Information about recent events. 新 (xīn) is new, and 闻 (wén) is to hear."
    "examples":
      "今天有什么新闻？":
        "native": "What is the news today?"
        "bases":
          "有":
            "meaning": "to have; there is"
      "这条新闻很重要。":
        "native": "This news is important."
        "bases":
          "条":
            "meaning": "measure word for long things"
  "zh-2968":
    "native": "reporter"
    "notes":
      "n1": "A person who writes or broadcasts the news. 记 (jì) is to record, and 者 (zhě) is a person."
    "examples":
      "她是记者。": "She is a reporter."
      "记者在现场采访。": "The reporter is interviewing on the spot."
  "zh-2969":
    "native": "to interview"
    "notes":
      "n1": "To ask someone questions for a story. 采 (cǎi) is to collect, and 访 (fǎng) is to visit."
    "examples":
      "记者采访了市长。":
        "native": "The reporter interviewed the mayor."
        "bases":
          "了":
            "meaning": "a particle"
          "市长":
            "meaning": "mayor"
      "他接受了采访。":
        "native": "He agreed to be interviewed."
        "bases":
          "接受":
            "meaning": "to accept"
          "了":
            "meaning": "a particle"
  "zh-2970":
    "native": "report; news story"
    "notes":
      "n1": "A piece of news in a paper or on air. 报 (bào) is to report, and 道 (dào) is to say."
    "examples":
      "这个报道很长。": "This report is very long."
      "报道说明天下雨。": "The report says it will rain tomorrow."
  "zh-2971":
    "native": "headline; title"
    "notes":
      "n1": "The title of a news story. 标 (biāo) is a mark, and 题 (tí) is a topic."
    "examples":
      "标题很大。": "The headline is very big."
      "这个标题很有意思。":
        "native": "This headline is very interesting."
        "bases":
          "有":
            "meaning": "to have; there is"
          "意思":
            "meaning": "meaning; interest"
  "zh-2972":
    "native": "front-page story; top news"
    "notes":
      "n1": "The main news of the day. 头 (tóu) is head, and 条 (tiáo) is a strip."
    "examples":
      "这是今天的头条。":
        "native": "This is today's top story."
        "bases":
          "的":
            "meaning": "of"
      "头条新闻是什么？": "What is the main news?"
  "zh-2973":
    "native": "radio broadcast"
    "notes":
      "n1": "A programme that is sent out on the radio. 广 (guǎng) is wide, and 播 (bō) is to spread."
    "examples":
      "我听广播。": "I listen to the radio."
      "广播里有新闻。":
        "native": "There is news on the radio."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-2974":
    "native": "television station"
    "notes":
      "n1": "The company that makes television programmes. 电 (diàn) is electricity, 视 (shì) is to look, and 台 (tái) is a station."
    "examples":
      "他在电视台工作。": "He works at a television station."
      "这家电视台很大。": "This television station is very big."
  "zh-2975":
    "native": "live broadcast"
    "notes":
      "n1": "A programme that is shown as it happens. 直 (zhí) is direct, and 播 (bō) is to broadcast."
    "examples":
      "比赛直播了。":
        "native": "The match was broadcast live."
        "bases":
          "了":
            "meaning": "a particle"
      "我们看直播。": "We watch the live broadcast."
  "zh-2976":
    "native": "programme"
    "notes":
      "n1": "A show on radio or television. 节 (jié) is a section, and 目 (mù) is a list."
    "examples":
      "这个节目很好看。": "This programme is very good to watch."
      "晚上有什么节目？":
        "native": "What is on tonight?"
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-2977":
    "native": "audience; viewers"
    "notes":
      "n1": "People who watch a show. 观 (guān) is to watch, and 众 (zhòng) is a crowd."
    "examples":
      "观众很多。": "There is a large audience."
      "观众很喜欢这个节目。": "The audience likes this programme."
  "zh-2978":
    "native": "listeners"
    "notes":
      "n1": "People who listen to a radio programme. 听 (tīng) is to listen, and 众 (zhòng) is a crowd."
    "examples":
      "听众打电话来了。":
        "native": "The listeners rang in."
        "bases":
          "了":
            "meaning": "a particle"
      "节目的听众很多。":
        "native": "The programme has many listeners."
        "bases":
          "的":
            "meaning": "of"
  "zh-2979":
    "native": "reader"
    "notes":
      "n1": "A person who reads a paper or book. 读 (dú) is to read, and 者 (zhě) is a person."
    "examples":
      "这份报纸的读者很多。":
        "native": "This paper has many readers."
        "bases":
          "的":
            "meaning": "of"
      "读者给我们写信。":
        "native": "Readers write to us."
        "bases":
          "给":
            "meaning": "to give; for"
          "信":
            "meaning": "letter"
  "zh-2980":
    "native": "editor"
    "notes":
      "n1": "A person who decides what goes into a paper. 编 (biān) is to arrange, and 辑 (jí) is to collect."
    "examples":
      "她是报纸的编辑。":
        "native": "She is the paper's editor."
        "bases":
          "的":
            "meaning": "of"
      "编辑看了这篇文章。":
        "native": "The editor read this article."
        "bases":
          "了":
            "meaning": "a particle"
          "篇":
            "meaning": "measure word for articles"
          "文章":
            "meaning": "article"
  "zh-2981":
    "native": "to publish"
    "notes":
      "n1": "To print and sell a book or paper. 出 (chū) is to come out, and 版 (bǎn) is a print plate."
    "examples":
      "这本书出版了。":
        "native": "This book has been published."
        "bases":
          "了":
            "meaning": "a particle"
      "这家公司出版杂志。": "This company publishes magazines."
  "zh-2982":
    "native": "to publish; to state"
    "notes":
      "n1": "To make public. 发 (fā) is to send out, and 表 (biǎo) is to show."
    "examples":
      "他发表了一篇文章。":
        "native": "He published an article."
        "bases":
          "了":
            "meaning": "a particle"
          "篇":
            "meaning": "measure word for articles"
          "文章":
            "meaning": "article"
      "政府发表了声明。":
        "native": "The government issued a statement."
        "bases":
          "了":
            "meaning": "a particle"
          "声明":
            "meaning": "statement"
  "zh-2983":
    "native": "commentary; comment"
    "notes":
      "n1": "A written opinion about news or events. 评 (píng) is to judge, and 论 (lùn) is to discuss."
    "examples":
      "这篇评论很有意思。":
        "native": "This commentary is very interesting."
        "bases":
          "篇":
            "meaning": "measure word for articles"
          "有":
            "meaning": "to have; there is"
          "意思":
            "meaning": "meaning; interest"
      "大家在网上评论。":
        "native": "People are commenting online."
        "bases":
          "网上":
            "meaning": "online"
  "zh-2984":
    "native": "editorial"
    "notes":
      "n1": "The main opinion article of a newspaper. 社 (shè) is a society, and 论 (lùn) is an opinion."
    "examples":
      "报纸的社论很长。":
        "native": "The paper's editorial is very long."
        "bases":
          "的":
            "meaning": "of"
      "社论谈到了环境。":
        "native": "The editorial talks about the environment."
        "bases":
          "谈":
            "meaning": "to talk about"
          "到":
            "meaning": "to arrive; to reach"
          "了":
            "meaning": "a particle"
          "环境":
            "meaning": "environment"
  "zh-2985":
    "native": "expert"
    "notes":
      "n1": "A person who knows a subject very well. 专 (zhuān) is special, and 家 (jiā) is a person."
    "examples":
      "专家说这是对的。":
        "native": "The expert says this is right."
        "bases":
          "的":
            "meaning": "of"
      "他是经济专家。": "He is an economics expert."
  "zh-2986":
    "native": "data"
    "notes":
      "n1": "Facts and figures. 数 (shù) is number, and 据 (jù) is evidence."
    "examples":
      "数据显示人口在增加。":
        "native": "The data show the population is growing."
        "bases":
          "显示":
            "meaning": "to show"
      "这些数据很准确。":
        "native": "These figures are very accurate."
        "bases":
          "这些":
            "meaning": "these"
          "准确":
            "meaning": "accurate"
  "zh-2987":
    "native": "statistics"
    "notes":
      "n1": "Numbers collected and counted. 统 (tǒng) is to unify, and 计 (jì) is to count."
    "examples":
      "这是最新的统计。":
        "native": "This is the latest statistics."
        "bases":
          "最新":
            "meaning": "latest"
          "的":
            "meaning": "of"
      "统计结果出来了。":
        "native": "The statistics have come out."
        "bases":
          "结果":
            "meaning": "result"
          "出来":
            "meaning": "to come out"
          "了":
            "meaning": "a particle"
  "zh-2988":
    "native": "accident"
    "notes":
      "n1": "Something bad that happens by chance. 事 (shì) is matter, and 故 (gù) is a cause."
    "examples":
      "发生了一起交通事故。":
        "native": "There was a traffic accident."
        "bases":
          "发生":
            "meaning": "to happen"
          "了":
            "meaning": "a particle"
          "起":
            "meaning": "measure word for incidents"
          "交通":
            "meaning": "traffic"
      "事故很严重。":
        "native": "The accident was serious."
        "bases":
          "严重":
            "meaning": "serious"
  "zh-2989":
    "native": "criminal"
    "notes":
      "n1": "A person who has broken the law. 罪 (zuì) is a crime, and 犯 (fàn) is to commit."
    "examples":
      "罪犯被抓住了。":
        "native": "The criminal was caught."
        "bases":
          "被":
            "meaning": "a particle for the passive"
          "抓住":
            "meaning": "to catch"
          "了":
            "meaning": "a particle"
      "这个罪犯逃走了。":
        "native": "This criminal escaped."
        "bases":
          "逃走":
            "meaning": "to escape"
          "了":
            "meaning": "a particle"
  "zh-2990":
    "native": "government"
    "notes":
      "n1": "The people who run a country. 政 (zhèng) is politics, and 府 (fǔ) is a government office."
    "examples":
      "政府要帮助农民。":
        "native": "The government will help the farmers."
        "bases":
          "要":
            "meaning": "must; to want"
      "政府发表了新的政策。":
        "native": "The government announced a new policy."
        "bases":
          "了":
            "meaning": "a particle"
          "的":
            "meaning": "of"
  "zh-2991":
    "native": "policy"
    "notes":
      "n1": "A plan that a government follows. 政 (zhèng) is politics, and 策 (cè) is a plan."
    "examples":
      "这个政策很好。": "This policy is very good."
      "新政策什么时候开始？": "When does the new policy start?"
  "zh-2992":
    "native": "economy"
    "notes":
      "n1": "The way a country makes and uses money and goods. 经 (jīng) is to manage, and 济 (jì) is to help."
    "examples":
      "经济在发展。": "The economy is developing."
      "经济很好。": "The economy is doing well."
  "zh-2993":
    "native": "shares; stock"
    "notes":
      "n1": "A small part of a company that is bought and sold. 股 (gǔ) is a share, and 票 (piào) is a certificate."
    "examples":
      "他买了股票。":
        "native": "He bought some shares."
        "bases":
          "了":
            "meaning": "a particle"
      "股票价格下降了。":
        "native": "The share price has fallen."
        "bases":
          "下降":
            "meaning": "to fall"
          "了":
            "meaning": "a particle"
  "zh-2994":
    "native": "exchange rate"
    "notes":
      "n1": "The price of one money in another money. 汇 (huì) is to exchange, and 率 (lǜ) is a rate."
    "examples":
      "汇率很高。": "The exchange rate is high."
      "汇率每天都变。":
        "native": "The exchange rate changes every day."
        "bases":
          "每天":
            "meaning": "every day"
          "变":
            "meaning": "to change"
  "zh-2995":
    "native": "climate change"
    "notes":
      "n1": "Long-term change in the weather. 气 (qì) is air, 候 (hòu) is weather, 变 (biàn) is to change, and 化 (huà) is to change into."
    "examples":
      "气候变化很严重。":
        "native": "Climate change is very serious."
        "bases":
          "变化":
            "meaning": "change"
          "严重":
            "meaning": "serious"
      "大家都在关心气候变化。":
        "native": "Everyone cares about climate change."
        "bases":
          "关心":
            "meaning": "to care about"
          "变化":
            "meaning": "change"
  "zh-2996":
    "native": "science and technology"
    "notes":
      "n1": "Science and the things made from it. 科 (kē) is a science, and 技 (jì) is a skill."
    "examples":
      "科技发展很快。": "Science and technology are developing quickly."
      "他在科技公司工作。": "He works at a technology company."
  "zh-2997":
    "native": "to innovate"
    "notes":
      "n1": "To make new things. 创 (chuàng) is to create, and 新 (xīn) is new."
    "examples":
      "我们要创新。":
        "native": "We must innovate."
        "bases":
          "要":
            "meaning": "must; to want"
      "这个产品很有创新。":
        "native": "This product is very innovative."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-2998":
    "native": "to research and develop"
    "notes":
      "n1": "To do research and make new products. 研 (yán) is to study, and 发 (fā) is to develop."
    "examples":
      "公司在研发新药。":
        "native": "The company is developing a new medicine."
        "bases":
          "新药":
            "meaning": "new medicine"
      "研发费用很高。": "The research costs are very high."
  "zh-2999":
    "native": "to invent"
    "notes":
      "n1": "To make something new for the first time. 发 (fā) is to send out, and 明 (míng) is clear."
    "examples":
      "他发明了一种机器。":
        "native": "He invented a kind of machine."
        "bases":
          "了":
            "meaning": "a particle"
          "种":
            "meaning": "kind; type"
          "机器":
            "meaning": "machine"
      "这个发明很重要。": "This invention is very important."
  "zh-3000":
    "native": "industry"
    "notes":
      "n1": "A group of businesses that make the same kind of thing. 产 (chǎn) is to produce, and 业 (yè) is work."
    "examples":
      "旅游产业很大。": "The tourism industry is very big."
      "这个产业在增长。": "This industry is growing."
  "zh-3001":
    "native": "to grow; to increase"
    "notes":
      "n1": "To become bigger or more. 增 (zēng) is to add, and 长 (zhǎng) is to grow."
    "examples":
      "收入在增长。":
        "native": "Income is growing."
        "bases":
          "收入":
            "meaning": "income"
      "人口增长很快。": "The population is growing fast."
  "zh-3002":
    "native": "to be unemployed"
    "notes":
      "n1": "To lose a job. 失 (shī) is to lose, and 业 (yè) is work."
    "examples":
      "他失业了。":
        "native": "He is unemployed."
        "bases":
          "了":
            "meaning": "a particle"
      "失业的人很多。":
        "native": "Many people are unemployed."
        "bases":
          "的":
            "meaning": "of"
  "zh-3003":
    "native": "to find work"
    "notes":
      "n1": "To get a job. 就 (jiù) is to take up, and 业 (yè) is work."
    "examples":
      "大学生很难就业。":
        "native": "University students find it hard to find work."
        "bases":
          "大学生":
            "meaning": "university student"
      "这个城市就业机会很多。":
        "native": "This city has many job opportunities."
        "bases":
          "机会":
            "meaning": "chance; opportunity"
  "zh-3004":
    "native": "epidemic situation"
    "notes":
      "n1": "The state of an illness spreading. 疫 (yì) is an epidemic, and 情 (qíng) is the situation."
    "examples":
      "疫情很严重。":
        "native": "The epidemic is very serious."
        "bases":
          "严重":
            "meaning": "serious"
      "疫情已经控制住了。":
        "native": "The epidemic has been brought under control."
        "bases":
          "控制":
            "meaning": "to control"
          "了":
            "meaning": "a particle"
  "zh-3005":
    "native": "election"
    "notes":
      "n1": "A vote to choose leaders. 选 (xuǎn) is to choose, and 举 (jǔ) is to raise."
    "examples":
      "下个月有选举。":
        "native": "There is an election next month."
        "bases":
          "有":
            "meaning": "to have; there is"
      "选举的结果出来了。":
        "native": "The election result is out."
        "bases":
          "的":
            "meaning": "of"
          "结果":
            "meaning": "result"
          "出来":
            "meaning": "to come out"
          "了":
            "meaning": "a particle"
  "zh-3006":
    "native": "president"
    "notes":
      "n1": "The head of a country. 总 (zǒng) is overall, and 统 (tǒng) is to rule."
    "examples":
      "总统说了一句话。":
        "native": "The president said a few words."
        "bases":
          "了":
            "meaning": "a particle"
          "句":
            "meaning": "measure word for sentences"
          "话":
            "meaning": "words; speech"
      "这位总统很有名。":
        "native": "This president is very famous."
        "bases":
          "有":
            "meaning": "to have; there is"
          "名":
            "meaning": "measure word for people"
  "zh-3007":
    "native": "parliament"
    "notes":
      "n1": "The group of people who make the laws. 议 (yì) is to discuss, and 会 (huì) is a meeting."
    "examples":
      "议会通过了法律。":
        "native": "Parliament passed the law."
        "bases":
          "了":
            "meaning": "a particle"
      "议会今天开会。": "Parliament meets today."
  "zh-3008":
    "native": "law"
    "notes":
      "n1": "The rules a country has. 法 (fǎ) is a law, and 律 (lǜ) is a rule."
    "examples":
      "这个法律很重要。": "This law is very important."
      "要遵守法律。":
        "native": "You must obey the law."
        "bases":
          "要":
            "meaning": "must; to want"
          "遵守":
            "meaning": "to obey"
  "zh-3009":
    "native": "politics"
    "notes":
      "n1": "The activity of running a country. 政 (zhèng) is government, and 治 (zhì) is to govern."
    "examples":
      "他对政治很有兴趣。":
        "native": "He is very interested in politics."
        "bases":
          "有":
            "meaning": "to have; there is"
      "政治问题很复杂。": "Political problems are very complicated."
  "zh-3010":
    "native": "diplomacy"
    "notes":
      "n1": "The work of countries talking to one another. 外 (wài) is outside, and 交 (jiāo) is to exchange."
    "examples":
      "外交很重要。": "Diplomacy is very important."
      "他在外交部工作。":
        "native": "He works in the foreign ministry."
        "bases":
          "外交部":
            "meaning": "foreign ministry"
  "zh-3011":
    "native": "peace"
    "notes":
      "n1": "A time without war. 和 (hé) is harmony, and 平 (píng) is peace."
    "examples":
      "我们希望和平。": "We hope for peace."
      "这个地区很和平。": "This region is peaceful."
  "zh-3012":
    "native": "war"
    "notes":
      "n1": "A fight between countries. 战 (zhàn) is to fight, and 争 (zhēng) is to struggle."
    "examples":
      "战争很可怕。":
        "native": "War is terrible."
        "bases":
          "可怕":
            "meaning": "terrible"
      "战争结束了。":
        "native": "The war has ended."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3013":
    "native": "conflict; clash"
    "notes":
      "n1": "A fight or disagreement between groups. 冲 (chōng) is to rush, and 突 (tū) is to break out."
    "examples":
      "两国发生了冲突。":
        "native": "Clashes broke out between the two countries."
        "bases":
          "发生":
            "meaning": "to happen"
          "了":
            "meaning": "a particle"
      "这次冲突很严重。":
        "native": "This conflict is very serious."
        "bases":
          "严重":
            "meaning": "serious"
  "zh-3014":
    "native": "to rescue"
    "notes":
