"name": "Doubling a verb: 看看 (kànkan), a short or light try"
"license": "CC-BY-SA-4.0"
"description": "A verb can be doubled to say that an action is short, light or tried for a moment: 看看 (kànkan), have a look. Not yet checked by a Mandarin speaker: please report any mistake."
