    "reduplicated": "the verb doubled, with no 了 (le)"
    "past": "the verb doubled with 了 (le) in the middle: V 了 (le) V"
  "entries":
    "kan": "to look; to read"
    "ting": "to listen"
    "shi": "to try"
    "xiang": "to think"
    "wen": "to ask"
  "notes": "A doubled verb such as 看看 (kànkan) is light and short, like have a look: 我看看书 (wǒ kànkan shū), I will have a look at the book. The second syllable is said with a neutral tone. For a finished try, put 了 (le) in the middle: 我看了看书 (wǒ kàn le kan shū), I had a look at the book. Only one-syllable verbs double this way: 看看 (kànkan), 听听 (tīngting), 试试 (shìshi), 想想 (xiǎngxiang), 问问 (wènwen). Two-syllable verbs such as 介绍 (jièshào) do not double this way, and 一下 (yíxià) can take the place of the doubling in speech."
