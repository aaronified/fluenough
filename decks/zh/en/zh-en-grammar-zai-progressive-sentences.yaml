"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1216":
    "confusables":
      "w1":
        "why": "写 (xiě) is to write, a different action."
      "w2":
        "why": "听 (tīng) is to listen, not to read."
    "native": "He is reading a book."
  "zh-1217":
    "confusables":
      "w1":
        "why": "吃 (chī) is to eat, which comes after cooking."
      "w2":
        "why": "买 (mǎi) is to buy, which comes before cooking."
    "native": "Mum is cooking right now."
  "zh-1218":
    "confusables":
      "w1":
        "why": "休息 (xiūxi) is to rest, another suggestion."
      "w2":
        "why": "学习 (xuéxí) is to study, a different idea."
    "native": "Let us go and eat."
  "zh-1219":
    "confusables":
      "w1":
        "why": "学习 (xuéxí) is to study, not to work."
      "w2":
        "why": "睡觉 (shuìjiào) is to sleep, not to work."
    "native": "Where do you work?"
  "zh-1220":
    "confusables":
      "w1":
        "why": "休息 (xiūxi) is to rest, a different state."
      "w2":
        "why": "起床 (qǐchuáng) is to get up, the opposite time."
    "bases":
      "没":
        "meaning": "not; did not"
    "native": "I am not sleeping."
  "zh-1221":
    "confusables":
      "w1":
        "why": "走 (zǒu) is to walk or leave, not to rest."
      "w2":
        "why": "工作 (gōngzuò) is to work, the opposite of a rest."
    "bases":
      "一下":
        "meaning": "a little; have a try"
    "native": "Let us have a rest."
  "zh-1222":
    "confusables":
      "w1":
        "why": "工作 (gōngzuò) is to work, not to study."
      "w2":
        "why": "上班 (shàngbān) is to go to work, not to study."
    "native": "They are studying."
  "zh-1223":
    "confusables":
      "w1":
        "why": "吃 (chī) is to eat, not to drink."
      "w2":
        "why": "茶 (chá) is tea, a different drink."
    "native": "Is the child drinking water?"
