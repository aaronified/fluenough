  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "在 (zài) and 吧 (ba) in sentences"
"description": "Sentences that say what is going on now with 在 (zài), and suggestions with 吧 (ba). Not yet checked by a Mandarin speaker: please report any mistake."
