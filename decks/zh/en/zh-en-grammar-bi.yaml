"name": "比 (bǐ): more than"
"license": "CC-BY-SA-4.0"
"description": "Comparing two things: 比 (bǐ) before the thing compared to, for more than, and 不比 (bù bǐ) for not more than. Not yet checked by a Mandarin speaker: please report any mistake."
"tags":
- "unreviewed"
"pattern":
  "name": "比 (bǐ): more than"
  "slot_name": "form"
  "prompt": "{lemma} ({gloss}), {slot}"
  "slots":
    "plain": "a plain statement"
    "bi": "more than, with 比 (bǐ)"
    "not-bi": "not more than, with 不比 (bù bǐ)"
  "entries":
    "gao": "tall"
    "da": "big"
    "kuai": "fast"
    "gui": "expensive"
    "leng": "cold"
  "notes": "比 (bǐ) goes before the thing you compare with, and after the subject: 他比我高 (tā bǐ wǒ gāo), he is taller than me. Do not add 很 (hěn) or 更 (gèng) with it. To say the comparison is not true, put 不 (bù) before 比 (bǐ): 他不比我高 (tā bù bǐ wǒ gāo), he is not taller than me. 不 (bù) is said bù here, before a third tone."
