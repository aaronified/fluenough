"cards":
  "zh-3460":
    "confusables":
      "w1":
        "why": "求职 (qiúzhí) is to look for work, the earlier stage."
      "w2":
        "why": "录用 (lùyòng) is to hire, the result."
    "native": "I want to apply for this post."
  "zh-3461":
    "confusables":
      "w1":
        "why": "回答 (huídá) is to answer, what the candidate does."
      "w2":
        "why": "简历 (jiǎnlì) is a CV, a written paper."
    "bases":
      "了":
        "meaning": "a particle"
      "的":
        "meaning": "of"
    "native": "The interviewer asked me about my experience."
  "zh-3462":
    "confusables":
      "w1":
        "why": "降职 (jiàngzhí) is to be demoted, the opposite."
      "w2":
        "why": "升职 (shēngzhí) is to be promoted, a close word."
    "bases":
      "了":
        "meaning": "a particle"
    "native": "He was promoted, and his pay went up too."
  "zh-3463":
    "confusables":
      "w1":
        "why": "创业 (chuàngyè) is to start a business, a different path."
      "w2":
        "why": "辞职 (cízhí) is to resign, which may come before a change."
    "native": "I want to change careers and become a designer."
  "zh-3464":
    "confusables":
      "w1":
        "why": "设计师 (shèjìshī) is a designer, a different job."
      "w2":
        "why": "工程师 (gōngchéngshī) is an engineer, a different job."
    "bases":
      "的":
        "meaning": "of"
    "native": "His field is programming."
  "zh-3465":
    "confusables":
      "w1":
        "why": "技能 (jìnéng) is a skill, a more general word."
      "w2":
        "why": "能力 (nénglì) is ability, a general word."
    "bases":
      "的":
        "meaning": "of"
      "文章":
        "meaning": "article"
    "native": "My special skill is writing articles."
  "zh-3466":
    "confusables":
      "w1":
        "why": "报到 (bàodào) is to report for duty, the start."
      "w2":
        "why": "辞退 (cítuì) is to dismiss, the opposite."
    "bases":
      "可以":
        "meaning": "can"
    "native": "After the probation period you can become permanent."
  "zh-3467":
    "confusables":
      "w1":
        "why": "希望 (xīwàng) is to hope, a feeling rather than a goal."
      "w2":
        "why": "目标 (mùbiāo) is a goal, a practical aim."
    "bases":
      "的":
        "meaning": "of"
    "native": "This is my ideal, and also my dream."
