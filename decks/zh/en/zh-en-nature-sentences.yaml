"cards":
  "zh-2606":
    "confusables":
      "w1":
        "why": "小溪 (xiǎoxī) is a stream, which is smaller."
      "w2":
        "why": "海 (hǎi) is the sea, not a river."
    "bases":
      "河边":
        "meaning": "by the river"
      "了":
        "meaning": "a particle: a change has happened"
      "久":
        "meaning": "long (of time)"
    "native": "We sat by the river for a long time."
  "zh-2607":
    "confusables":
      "w1":
        "why": "森林 (sēnlín) is a forest, a larger area."
      "w2":
        "why": "树林 (shùlín) is a wood, a smaller group."
    "bases":
      "山上":
        "meaning": "on the mountain"
      "有":
        "meaning": "to have; there is"
    "native": "There are many trees on the mountain."
  "zh-2608":
    "confusables":
      "w1":
        "why": "泥 (ní) is mud, which is wet."
      "w2":
        "why": "石头 (shítou) is a stone, which is hard."
    "native": "The sand is very hot."
  "zh-2609":
    "confusables":
      "w1":
        "why": "阳光 (yángguāng) is sunshine, which is daytime."
      "w2":
        "why": "雨 (yǔ) is rain, which falls."
    "bases":
      "天上":
        "meaning": "in the sky"
      "有":
        "meaning": "to have; there is"
    "native": "There are many stars in the sky."
  "zh-2610":
    "confusables":
      "w1":
        "why": "海洋 (hǎiyáng) is the ocean, far bigger."
      "w2":
        "why": "泉 (quán) is a spring, which is where water rises."
    "bases":
      "有":
        "meaning": "to have; there is"
    "native": "There are fish in the pond."
  "zh-2611":
    "confusables":
      "w1":
        "why": "晴 (qíng) is sunny, the opposite."
      "w2":
        "why": "刮风 (guāfēng) is windy, a different weather."
    "native": "It is cloudy today, and it is thundering too."
  "zh-2612":
    "confusables":
      "w1":
        "why": "洞 (dòng) is a hole, not a cliff."
      "w2":
        "why": "岩石 (yánshí) is rock, which may be on a cliff."
    "bases":
      "不要":
        "meaning": "do not"
      "靠近":
        "meaning": "to approach"
    "native": "Do not go near the cliff."
  "zh-2613":
    "confusables":
      "w1":
        "why": "柳树 (liǔshù) is a willow, a different tree."
      "w2":
        "why": "果树 (guǒshù) is a fruit tree."
    "bases":
      "和":
        "meaning": "and"
    "native": "Bamboo and pine trees are both very tall."
