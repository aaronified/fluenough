    "notes":
      "n1": "An event where employers meet job seekers. 招 (zhāo) is to recruit, 聘 (pìn) is to employ, and 会 (huì) is a meeting."
    "examples":
      "招聘会在明天。": "The job fair is tomorrow."
      "很多公司参加了招聘会。":
        "native": "Many companies took part in the job fair."
        "bases":
          "了":
            "meaning": "a particle"
