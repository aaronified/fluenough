      "工人在工厂工作。": "The workers work in the factory."
      "工人很辛苦。": "The workers are very hard-working."
  "zh-3432":
    "native": "businessman"
    "notes":
      "n1": "A person who buys and sells goods. 商 (shāng) is trade, and 人 (rén) is a person."
    "examples":
      "他是商人。": "He is a businessman."
      "商人去了北京。":
        "native": "The businessman went to Beijing."
        "bases":
          "了":
            "meaning": "a particle"
          "北京":
            "meaning": "Beijing"
  "zh-3433":
    "native": "sales assistant"
    "notes":
      "n1": "A person who sells goods or services. 销 (xiāo) is to sell, 售 (shòu) is to sell, and 员 (yuán) is a member."
    "examples":
      "她是销售员。": "She is a sales assistant."
      "销售员很热情。": "The sales assistant is very friendly."
  "zh-3434":
    "native": "office worker"
    "notes":
      "n1": "A person who works in an office. 职 (zhí) is a post, and 员 (yuán) is a member."
    "examples":
      "他是公司职员。": "He is an office worker at the company."
      "职员们在开会。":
