        "bases":
          "要":
            "meaning": "to want"
          "着":
            "meaning": "a particle: an action goes on"
  "zh-3438":
    "native": "experience"
    "notes":
      "n1": "Knowledge gained from doing something. 经 (jīng) is to pass through, and 验 (yàn) is to test."
    "examples":
      "他很有经验。":
        "native": "He has a lot of experience."
