      "转正以后工资高一些。": "After becoming permanent the pay is a bit higher."
  "zh-3454":
    "native": "labour; work"
    "notes":
      "n1": "Work that people do with their hands or minds. 劳 (láo) is toil, and 动 (dòng) is to act."
    "examples":
      "劳动很辛苦。": "Labour is very hard."
      "我们重视劳动。": "We value labour."
  "zh-3455":
    "native": "labour law"
    "notes":
      "n1": "The laws about work and workers. 劳 (láo) is labour, 动 (dòng) is work, and 法 (fǎ) is law."
    "examples":
      "劳动法保护工人。": "The labour law protects workers."
      "你了解劳动法吗？":
        "native": "Do you know the labour law?"
        "bases":
          "了解":
            "meaning": "to understand"
  "zh-3456":
