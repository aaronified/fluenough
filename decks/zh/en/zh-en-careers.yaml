    "notes":
      "n1": "Money set aside by workers and employers for housing. 公 (gōng) is public, 积 (jī) is to accumulate, and 金 (jīn) is money."
    "examples":
      "每个月交公积金。":
        "native": "Pay into the housing fund each month."
        "bases":
          "交":
            "meaning": "to hand over; to pay"
      "公积金可以买房。":
        "native": "The housing fund can be used to buy a flat."
        "bases":
          "可以":
            "meaning": "can"
  "zh-3458":
    "native": "interviewer"
    "notes":
      "n1": "A person who interviews candidates. 面 (miàn) is face-to-face, 试 (shì) is to test, and 官 (guān) is an official."
    "examples":
      "面试官问了我一个问题。":
        "native": "The interviewer asked me a question."
        "bases":
          "了":
            "meaning": "a particle"
      "面试官很友好。":
        "native": "The interviewer is very friendly."
        "bases":
          "友好":
            "meaning": "friendly"
