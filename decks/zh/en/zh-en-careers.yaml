    "notes":
      "n1": "A goal you hope to achieve. 梦 (mèng) is a dream, and 想 (xiǎng) is to think."
    "examples":
      "这是我的梦想。":
        "native": "This is my dream."
        "bases":
          "的":
            "meaning": "of"
      "他有一个梦想。":
        "native": "He has an ambition."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-3443":
    "native": "ideal; aspiration"
    "notes":
      "n1": "A goal that you think is the best. 理 (lǐ) is reason, and 想 (xiǎng) is to think."
    "examples":
      "我的理想是当老师。":
        "native": "My ideal is to become a teacher."
        "bases":
          "的":
            "meaning": "of"
          "当":
            "meaning": "to be; to serve as"
      "理想很高。": "The ideal is very high."
