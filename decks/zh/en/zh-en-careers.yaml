          "的":
            "meaning": "of"
          "强":
            "meaning": "strong"
      "提高能力很重要。": "Improving ability is very important."
  "zh-3441":
    "native": "special skill"
    "notes":
      "n1": "A thing a person does especially well. 特 (tè) is special, and 长 (cháng) is a strength."
    "examples":
      "他的特长是音乐。":
        "native": "His special skill is music."
        "bases":
          "的":
            "meaning": "of"
      "你有什么特长？":
        "native": "What are you especially good at?"
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-3442":
