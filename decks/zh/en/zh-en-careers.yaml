          "的":
            "meaning": "of"
      "他很专业。": "He is very professional."
  "zh-3436":
    "native": "level of education"
    "notes":
      "n1": "The schooling a person has had. 学 (xué) is study, and 历 (lì) is a history."
    "examples":
      "他的学历很高。":
