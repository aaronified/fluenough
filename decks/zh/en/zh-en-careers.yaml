"cards":
  "zh-3410":
    "native": "to look for work"
    "notes":
      "n1": "To seek a job. 求 (qiú) is to seek, and 职 (zhí) is a post."
    "examples":
      "他在求职。": "He is looking for work."
      "求职很难。": "Looking for work is hard."
  "zh-3411":
    "native": "to apply for a job"
    "notes":
      "n1": "To answer an advertisement for a post. 应 (yìng) is to respond, and 聘 (pìn) is to employ."
    "examples":
      "我来应聘。": "I have come to apply for the job."
      "他应聘了这个职位。":
        "native": "He applied for this post."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3412":
    "native": "to hire"
    "notes":
      "n1": "To take someone on for a job. 录 (lù) is to record, and 用 (yòng) is to use."
    "examples":
      "公司录用了他。":
        "native": "The company hired him."
        "bases":
          "了":
            "meaning": "a particle"
      "我被录用了。":
        "native": "I was hired."
        "bases":
          "被":
            "meaning": "a particle for the passive"
          "了":
            "meaning": "a particle"
  "zh-3413":
    "native": "to admit (to a school)"
    "notes":
      "n1": "To accept someone into a school or course. 录 (lù) is to record, and 取 (qǔ) is to take."
    "examples":
      "大学录取了我。":
        "native": "The university admitted me."
        "bases":
          "了":
            "meaning": "a particle"
      "录取通知书来了。":
        "native": "The admission letter has arrived."
        "bases":
          "通知书":
            "meaning": "notice (letter)"
          "了":
            "meaning": "a particle"
  "zh-3414":
    "native": "to do an internship"
    "notes":
      "n1": "To work for a short time to learn a job. 实 (shí) is real, and 习 (xí) is to practise."
    "examples":
      "他在公司实习。": "He is doing an internship at the company."
      "实习三个月。": "An internship of three months."
  "zh-3415":
    "native": "intern"
    "notes":
      "n1": "A person who is learning a job. 实 (shí) is real, 习 (xí) is to practise, and 生 (shēng) is a student."
    "examples":
      "我是实习生。": "I am an intern."
      "实习生很努力。": "The interns work hard."
  "zh-3416":
    "native": "pay; salary"
    "notes":
      "n1": "The money you are paid for work. 薪 (xīn) is a salary, and 资 (zī) is money."
    "examples":
      "薪资多少？": "What is the salary?"
      "薪资很高。": "The pay is very high."
  "zh-3417":
    "native": "treatment; conditions"
    "notes":
      "n1": "The pay and benefits of a job. 待 (dài) is to treat, and 遇 (yù) is to meet."
    "examples":
      "待遇很好。": "The conditions are very good."
      "这个工作的待遇怎么样？":
        "native": "How are the conditions for this job?"
        "bases":
          "的":
            "meaning": "of"
          "怎么样":
            "meaning": "how is it"
  "zh-3418":
    "native": "to be promoted"
    "notes":
      "n1": "To move up to a higher rank. 晋 (jìn) is to advance, and 升 (shēng) is to rise."
    "examples":
      "他晋升了。":
        "native": "He has been promoted."
        "bases":
          "了":
            "meaning": "a particle"
      "晋升需要时间。": "Promotion takes time."
  "zh-3419":
    "native": "to be promoted (informal)"
    "notes":
      "n1": "To get a higher post. 升 (shēng) is to rise, and 职 (zhí) is a post."
    "examples":
      "我下个月升职。": "I am being promoted next month."
      "他升职了。":
        "native": "He got promoted."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3420":
    "native": "to be demoted"
    "notes":
      "n1": "To move down to a lower post. 降 (jiàng) is to lower, and 职 (zhí) is a post."
    "examples":
      "他被降职了。":
        "native": "He was demoted."
        "bases":
          "被":
            "meaning": "a particle for the passive"
          "了":
            "meaning": "a particle"
      "降职很难受。":
        "native": "Being demoted is very hard."
        "bases":
          "难受":
            "meaning": "unwell; uncomfortable"
  "zh-3421":
    "native": "to transfer"
    "notes":
      "n1": "To move someone to another post or place. 调 (diào) is to move, and 动 (dòng) is to act."
    "examples":
      "他被调动到北京。":
        "native": "He was transferred to Beijing."
        "bases":
          "被":
            "meaning": "a particle for the passive"
          "到":
            "meaning": "to arrive; to reach"
          "北京":
            "meaning": "Beijing"
      "调动工作要申请。":
        "native": "A transfer needs an application."
        "bases":
          "要":
            "meaning": "to want"
  "zh-3422":
    "native": "to change career"
    "notes":
      "n1": "To change to a different kind of work. 转 (zhuǎn) is to turn, and 行 (háng) is a trade."
    "examples":
      "他转行了。":
        "native": "He changed careers."
        "bases":
          "了":
            "meaning": "a particle"
      "转行不容易。": "Changing career is not easy."
  "zh-3423":
    "native": "to start a business"
    "notes":
      "n1": "To set up a new company. 创 (chuàng) is to create, and 业 (yè) is business."
    "examples":
      "他想创业。": "He wants to start a business."
      "创业的人很多。":
        "native": "Many people start businesses."
        "bases":
          "的":
            "meaning": "of"
  "zh-3424":
    "native": "founder"
    "notes":
      "n1": "A person who started a company. 创 (chuàng) is to create, 始 (shǐ) is to begin, and 人 (rén) is a person."
    "examples":
      "她是公司的创始人。":
        "native": "She is the company's founder."
        "bases":
          "的":
            "meaning": "of"
      "创始人很有经验。":
        "native": "The founder has a lot of experience."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-3425":
    "native": "teacher"
    "notes":
      "n1": "A person who teaches. 教 (jiāo) is to teach, and 师 (shī) is a master."
    "examples":
      "他是教师。": "He is a teacher."
      "教师很辛苦。": "Teachers work very hard."
  "zh-3426":
    "native": "designer"
    "notes":
      "n1": "A person who plans how things look or work. 设 (shè) is to design, 计 (jì) is to plan, and 师 (shī) is a master."
    "examples":
      "她是设计师。": "She is a designer."
      "这个设计师很有名。": "This designer is very famous."
  "zh-3427":
    "native": "programmer"
    "notes":
      "n1": "A person who writes computer programs. 程 (chéng) is a program, 序 (xù) is order, and 员 (yuán) is a member."
    "examples":
      "他是程序员。": "He is a programmer."
      "程序员每天加班。":
        "native": "Programmers work overtime every day."
        "bases":
          "每天":
            "meaning": "every day"
  "zh-3428":
    "native": "accountant"
    "notes":
      "n1": "A person who keeps financial records. 会 (kuài) is to count, 计 (jì) is to calculate, and 师 (shī) is a master."
    "examples":
      "她是会计师。": "She is an accountant."
      "会计师很仔细。":
        "native": "The accountant is very careful."
        "bases":
          "仔细":
            "meaning": "careful; detailed"
  "zh-3429":
    "native": "actor"
    "notes":
      "n1": "A person who acts in films or on stage. 演 (yǎn) is to perform, and 员 (yuán) is a member."
    "examples":
      "他是演员。": "He is an actor."
      "这个演员很有名。": "This actor is very famous."
  "zh-3430":
    "native": "soldier"
    "notes":
      "n1": "A person who serves in the army. 军 (jūn) is an army, and 人 (rén) is a person."
    "examples":
      "他是军人。": "He is a soldier."
      "军人很勇敢。":
        "native": "Soldiers are very brave."
        "bases":
          "勇敢":
            "meaning": "brave"
  "zh-3431":
    "native": "worker"
