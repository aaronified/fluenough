    "notes":
      "n1": "A trial time at the start of a job. 试 (shì) is to try, 用 (yòng) is to use, and 期 (qī) is a period."
    "examples":
      "试用期是三个月。": "The probation period is three months."
      "试用期很辛苦。": "The probation period is very hard."
  "zh-3453":
