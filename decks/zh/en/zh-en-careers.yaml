    "native": "to retire"
    "notes":
      "n1": "To stop working at the end of a career. 退 (tuì) is to step back, and 休 (xiū) is to rest."
    "examples":
      "他明年退休。": "He retires next year."
      "退休以后他很开心。": "He is very happy since retiring."
  "zh-3445":
    "native": "to dismiss"
    "notes":
      "n1": "To ask someone to leave a job. 辞 (cí) is to leave, and 退 (tuì) is to return."
    "examples":
      "公司辞退了他。":
        "native": "The company dismissed him."
        "bases":
          "了":
            "meaning": "a particle"
      "他被辞退了。":
        "native": "He was dismissed."
        "bases":
          "被":
            "meaning": "a particle for the passive"
          "了":
            "meaning": "a particle"
  "zh-3446":
    "native": "to fire"
    "notes":
      "n1": "To end someone's job by force. 解 (jiě) is to release, and 雇 (gù) is to employ."
    "examples":
      "老板解雇了他。":
        "native": "The boss fired him."
        "bases":
          "了":
            "meaning": "a particle"
      "解雇员工很难。": "Firing staff is very hard."
  "zh-3447":
    "native": "supervisor"
    "notes":
      "n1": "A person in charge of a team or department. 主 (zhǔ) is main, and 管 (guǎn) is to manage."
    "examples":
      "我的主管很好。":
        "native": "My supervisor is very good."
        "bases":
          "的":
            "meaning": "of"
      "主管来了。":
        "native": "The supervisor has come."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3448":
    "native": "partner"
    "notes":
      "n1": "A person who owns a business with others. 合 (hé) is together, 伙 (huǒ) is a group, and 人 (rén) is a person."
    "examples":
      "他是我的合伙人。":
        "native": "He is my business partner."
        "bases":
          "的":
            "meaning": "of"
      "合伙人一起工作。": "The partners work together."
  "zh-3449":
    "native": "shareholder"
    "notes":
      "n1": "A person who owns part of a company. 股 (gǔ) is a share, and 东 (dōng) is an owner."
    "examples":
      "他是公司的股东。":
        "native": "He is a shareholder in the company."
        "bases":
          "的":
            "meaning": "of"
      "股东开会了。":
        "native": "The shareholders have held a meeting."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3450":
    "native": "job application letter"
    "notes":
      "n1": "A letter you send when you look for work. 求 (qiú) is to seek, 职 (zhí) is a post, and 信 (xìn) is a letter."
    "examples":
      "我写了一封求职信。":
        "native": "I wrote a job application letter."
        "bases":
          "了":
            "meaning": "a particle"
          "封":
            "meaning": "measure word for letters"
      "求职信要写清楚。":
        "native": "The application letter must be clear."
        "bases":
          "要":
            "meaning": "to want"
  "zh-3451":
    "native": "to report for duty"
    "notes":
      "n1": "To arrive and register at a new job or school. 报 (bào) is to report, and 到 (dào) is to arrive."
    "examples":
      "我明天去公司报到。": "I report to the company tomorrow."
      "请来这里报到。":
        "native": "Please come here to register."
        "bases":
          "这里":
            "meaning": "here"
