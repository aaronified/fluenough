        "bases":
          "职员们":
            "meaning": "office workers"
  "zh-3435":
    "native": "major; specialist field"
    "notes":
      "n1": "A subject you study or a field you work in. 专 (zhuān) is special, and 业 (yè) is work."
    "examples":
