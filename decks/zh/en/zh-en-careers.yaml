          "有":
            "meaning": "to have; there is"
      "工作经验很重要。": "Work experience is very important."
  "zh-3439":
    "native": "skill"
    "notes":
      "n1": "A practical ability learned by training. 技 (jì) is a skill, and 能 (néng) is ability."
    "examples":
      "她有很多技能。":
        "native": "She has many skills."
        "bases":
          "有":
            "meaning": "to have; there is"
      "这个工作需要技能。": "This job needs skills."
  "zh-3440":
    "native": "ability"
    "notes":
      "n1": "The power to do something. 能 (néng) is can, and 力 (lì) is strength."
    "examples":
      "他的能力很强。":
        "native": "His ability is very strong."
