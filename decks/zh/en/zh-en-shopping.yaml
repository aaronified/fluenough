"schema": 1
"id": "zh-en-shopping"
"kind": "layer"
"core": "zh-shopping"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Shopping"
"description": "Fifty words for shopping: the price and the discount, paying and the receipt, the card and the change, trying on, returning and exchanging, and the parts of a shop. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1709":
    "native": "discount; special offer"
    "notes":
      "n1": "A discount or a special offer, lower than the usual price. 惠 (huì) is a favour."
    "examples":
      "这个有优惠。":
        "native": "This has a special offer."
        "bases":
          "有":
            "meaning": "to have; there is"
      "优惠的价格很好。":
        "native": "The discount price is very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1710":
    "native": "discount"
    "notes":
      "n1": "A discount, a part of the price taken off. 折 (zhé) is a fold or discount, and 扣 (kòu) is to take off."
    "examples":
      "折扣是八折。": "The discount is twenty percent off."
      "这里有折扣。":
        "native": "There is a discount here."
        "bases":
          "这里":
            "meaning": "here"
          "有":
            "meaning": "to have; there is"
  "zh-1711":
    "native": "to pay"
    "notes":
      "n1": "To pay money for goods. 付 (fù) is to pay, and 款 (kuǎn) is money."
    "examples":
      "请付款。": "Please pay."
      "我付款了。":
        "native": "I have paid."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1712":
    "native": "credit card"
    "notes":
      "n1": "A credit card, which lets you pay now and pay the bank later. 信用 (xìnyòng) is credit."
    "examples":
      "我用信用卡付款。":
        "native": "I pay by credit card."
        "bases":
          "用":
            "meaning": "to use"
      "信用卡很方便。": "Credit cards are convenient."
  "zh-1713":
    "native": "to pay by card"
    "notes":
      "n1": "To pay by swiping a card through a machine. 刷 (shuā) is to swipe."
    "examples":
      "可以刷卡吗？":
        "native": "Can I pay by card?"
        "bases":
          "可以":
            "meaning": "can; may"
      "请刷卡。": "Please pay by card."
  "zh-1714":
    "native": "receipt"
    "notes":
      "n1": "A receipt, a paper that shows you have paid. 收 (shōu) is to receive."
    "examples":
      "请给我收据。":
        "native": "Please give me a receipt."
        "bases":
          "给":
            "meaning": "to give; for"
      "收据上有总价。":
        "native": "The receipt shows the total."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1715":
    "native": "to give change"
    "notes":
      "n1": "To give back the change from money paid. 找 (zhǎo) is to give back, and 零 (líng) is small change."
    "examples":
      "请找零。": "Please give the change."
      "找零是五块。":
        "native": "The change is five yuan."
        "bases":
          "块":
            "meaning": "the measure word for money; a yuan"
  "zh-1716":
    "native": "in total; altogether"
    "notes":
      "n1": "Altogether, the sum of everything. 总 (zǒng) is the whole, and 共 (gòng) is together."
    "examples":
      "总共一百块。":
        "native": "That is one hundred yuan altogether."
        "bases":
          "块":
            "meaning": "the measure word for money; a yuan"
      "我们总共买了三罐。":
        "native": "We bought three things in total."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1717":
    "native": "sum; total"
    "notes":
      "n1": "The total of a list of numbers or prices. 合 (hé) is to add together, and 计 (jì) is to count."
    "examples":
      "合计多少钱？": "What is the total?"
      "合计是五十块。":
        "native": "The total is fifty yuan."
        "bases":
          "块":
            "meaning": "the measure word for money; a yuan"
  "zh-1718":
    "native": "tax"
    "notes":
      "n1": "A tax, money paid to the government on goods or income."
    "examples":
      "价格不包括税。":
        "native": "The price does not include tax."
        "bases":
          "包括":
            "meaning": "to include"
      "税很高。": "The tax is very high."
  "zh-1719":
    "native": "discount (in tenths of the price)"
    "notes":
      "n1": "A discount, given as a part of the price. 八 折 (bā zhé) is eighty percent of the price."
    "examples":
      "这个八折。": "This one is twenty percent off."
      "打七折。":
        "native": "Give thirty percent off."
        "bases":
          "打":
            "meaning": "to give (a discount)"
  "zh-1720":
    "native": "to try"
    "notes":
      "n1": "To try something to see if it works or fits. 试穿 (shìchuān) is to try on clothes."
    "examples":
      "我可以试一下吗？":
        "native": "May I try it?"
        "bases":
          "可以":
            "meaning": "can; may"
          "一下":
            "meaning": "a little; have a try"
      "试了一下，很好。":
        "native": "I tried it, and it is very good."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "一下":
            "meaning": "a little; have a try"
  "zh-1721":
    "native": "brand"
    "notes":
      "n1": "A brand, a name that a company gives to its goods. 品 (pǐn) is goods, and 牌 (pái) is a sign."
    "examples":
      "这个品牌很有名。": "This brand is famous."
      "我只买好品牌。": "I only buy good brands."
  "zh-1722":
    "native": "free gift"
    "notes":
      "n1": "A free gift given with a purchase. 赠 (zèng) is to give as a gift."
    "examples":
      "买一个送一个赠品。": "Buy one and get a free gift."
      "赠品是小盒子。": "The free gift is a small box."
  "zh-1723":
    "native": "to promote; to sell at a special price"
    "notes":
      "n1": "To sell with a special offer to attract buyers. 促 (cù) is to push, and 销 (xiāo) is to sell."
    "examples":
      "这个商品在促销。":
        "native": "This product is on promotion."
        "bases":
          "商品":
            "meaning": "goods"
      "商场促销了。":
        "native": "The mall has a promotion."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1724":
    "native": "special price"
    "notes":
      "n1": "A special price, lower than the normal one. 特 (tè) is special, and 价 (jià) is a price."
    "examples":
      "这个是特价。": "This is at a special price."
      "特价的牛奶很便宜。":
        "native": "The milk at a special price is very cheap."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1725":
    "native": "original price"
    "notes":
      "n1": "The price before any discount. 原 (yuán) is original."
    "examples":
      "原价是一百块。":
        "native": "The original price was one hundred yuan."
        "bases":
          "块":
            "meaning": "the measure word for money; a yuan"
      "这个比原价便宜了。":
        "native": "This is cheaper than the original price."
        "bases":
          "比":
            "meaning": "than"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1726":
    "native": "unit price"
    "notes":
      "n1": "The price of one item, for each unit of goods. 单 (dān) is one, and 价 (jià) is a price."
    "examples":
      "苹果的单价是五块。":
        "native": "The unit price of an apple is five yuan."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "块":
            "meaning": "the measure word for money; a yuan"
      "单价是多少？": "What is the unit price?"
  "zh-1727":
    "native": "total price"
    "notes":
      "n1": "The total price of all the goods bought. 总 (zǒng) is total."
    "examples":
      "总价是三十块。":
        "native": "The total price is thirty yuan."
        "bases":
          "块":
            "meaning": "the measure word for money; a yuan"
      "请看总价。": "Please look at the total."
  "zh-1728":
    "native": "to pay money"
    "notes":
      "n1": "To pay the money for something. 钱 (qián) is money."
    "examples":
      "我来付钱。": "I will pay."
      "请先付钱。": "Please pay first."
  "zh-1729":
    "native": "to give change"
    "notes":
      "n1": "To give back money as change. 找 (zhǎo) is to give back."
    "examples":
      "请找钱。": "Please give me the change."
      "她找了我十块。":
        "native": "She gave me ten yuan change."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "块":
            "meaning": "the measure word for money; a yuan"
  "zh-1730":
    "native": "shopping bag"
    "notes":
      "n1": "A bag for carrying goods bought in a shop. 袋 (dài) is a bag."
    "examples":
      "购物袋要钱吗？":
        "native": "Does the shopping bag cost money?"
        "bases":
          "要":
            "meaning": "must; to want"
      "我有一个购物袋。":
        "native": "I have a shopping bag."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1731":
    "native": "cashier"
    "notes":
      "n1": "A cashier, who takes the money at a till. 员 (yuán) is a member of staff."
    "examples":
      "收银员在那儿。": "The cashier is over there."
      "收银员很快。": "The cashier is quick."
  "zh-1732":
    "native": "shop assistant"
    "notes":
      "n1": "A shop assistant, who sells goods to customers. 售 (shòu) is to sell, and 货 (huò) is goods."
    "examples":
      "售货员很热情。":
        "native": "The shop assistant is very friendly."
        "bases":
          "热情":
            "meaning": "friendly; warm"
      "请问售货员在哪里？":
        "native": "Excuse me, where is the shop assistant?"
        "bases":
          "请问":
            "meaning": "excuse me; may I ask"
  "zh-1733":
    "native": "counter"
    "notes":
      "n1": "A counter, a table in a shop where you pay or ask. 柜 (guì) is a cupboard, and 台 (tái) is a table."
    "examples":
      "柜台在门口。": "The counter is at the door."
      "请到柜台付款。":
        "native": "Please pay at the counter."
        "bases":
          "到":
            "meaning": "to arrive; to reach"
  "zh-1734":
    "native": "fitting room"
    "notes":
      "n1": "A changing room, where you try on clothes. 试 (shì) is to try, and 衣 (yī) is clothes."
    "examples":
      "试衣间在那边。": "The fitting room is over there."
      "我去试衣间试一下。":
        "native": "I will go to the fitting room to try it."
        "bases":
          "一下":
            "meaning": "a little; have a try"
  "zh-1735":
    "native": "to return goods"
    "notes":
      "n1": "To return goods to a shop for a refund. 退 (tuì) is to give back."
    "examples":
      "这个可以退货吗？":
        "native": "Can this be returned?"
        "bases":
          "可以":
            "meaning": "can; may"
      "我要退货。":
        "native": "I want to return it."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-1736":
    "native": "to exchange goods"
    "notes":
      "n1": "To swap goods for another one. 换 (huàn) is to change."
    "examples":
      "可以换货吗？":
        "native": "Can I exchange it?"
        "bases":
          "可以":
            "meaning": "can; may"
      "我要换货。":
        "native": "I want to exchange it."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-1737":
    "native": "warranty; repair service"
    "notes":
      "n1": "A warranty, a promise to repair goods for a time after sale. 保 (bǎo) is to keep or guarantee."
    "examples":
      "这个有一年保修。":
        "native": "This has a one-year warranty."
        "bases":
          "有":
            "meaning": "to have; there is"
      "保修期是两年。":
        "native": "The warranty period is two years."
        "bases":
          "期":
            "meaning": "period; date"
  "zh-1738":
    "native": "invoice; official receipt"
    "notes":
      "n1": "An official receipt or invoice, needed for tax or refunds. 发 (fā) is to issue."
    "examples":
      "请给我发票。":
        "native": "Please give me an invoice."
        "bases":
          "给":
            "meaning": "to give; for"
      "发票上有税。":
        "native": "The invoice shows the tax."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1739":
    "native": "goods in stock"
    "notes":
      "n1": "Goods that are in stock and can be taken at once. 现 (xiàn) is now."
    "examples":
      "这个是现货。": "This is in stock."
      "现货很少。": "There is little in stock."
  "zh-1740":
    "native": "out of stock"
    "notes":
      "n1": "Not in stock, the goods have run out. 缺 (quē) is to lack."
    "examples":
      "这个缺货了。":
        "native": "This is out of stock."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "牛奶缺货。": "The milk is out of stock."
  "zh-1741":
    "native": "famous brand; designer label"
    "notes":
      "n1": "A famous brand, a well-known maker of goods. 名 (míng) is famous."
    "examples":
      "她穿名牌。": "She wears designer labels."
      "名牌很贵。": "Famous brands are expensive."
  "zh-1742":
    "native": "shopping mall"
    "notes":
      "n1": "A shopping mall, a large building with many shops. 商 (shāng) is trade."
    "examples":
      "商场很大。": "The mall is very big."
      "我去商场买衣服。": "I go to the mall to buy clothes."
  "zh-1743":
    "native": "to bargain"
    "notes":
      "n1": "To bargain over the price, going back and forth. 讨价 (tǎojià) is to ask for a lower price."
    "examples":
      "在市场可以讨价还价。":
        "native": "You can bargain at the market."
        "bases":
          "可以":
            "meaning": "can; may"
      "他喜欢讨价还价。": "He likes to bargain."
  "zh-1744":
    "native": "good value; cheap and good"
    "notes":
      "n1": "Good value, good for the money. 实 (shí) is real, and 惠 (huì) is a benefit."
    "examples":
      "这个很实惠。": "This is good value."
      "买大包装很实惠。": "Buying the large pack is good value."
  "zh-1745":
    "native": "worth the money; a good buy"
    "notes":
      "n1": "Worth the price, a good deal. 划算 (huásuàn) is said of a bargain."
    "examples":
      "这个很划算。": "This is a good buy."
      "买两个更划算。": "Buying two is a better deal."
  "zh-1746":
    "native": "shop assistant; clerk"
    "notes":
      "n1": "A member of staff in a shop. 员 (yuán) is a member."
    "examples":
      "店员很友好。":
        "native": "The shop assistant is friendly."
        "bases":
          "友好":
            "meaning": "friendly"
      "请问店员在吗？":
        "native": "Excuse me, is the shop assistant here?"
        "bases":
          "请问":
            "meaning": "excuse me; may I ask"
  "zh-1747":
    "native": "to include postage"
    "notes":
      "n1": "To include postage in the price, so the buyer pays no delivery. 邮 (yóu) is post."
    "examples":
      "这个包邮。": "This includes postage."
      "买两件包邮。": "Buy two items and postage is included."
  "zh-1748":
    "native": "to shop online"
    "notes":
      "n1": "To shop on the internet. 网 (wǎng) is the net or internet."
    "examples":
      "我常常网购。": "I often shop online."
      "网购很方便。": "Online shopping is convenient."
  "zh-1749":
    "native": "online shop"
    "notes":
      "n1": "A shop on the internet, with no building. 店 (diàn) is a shop."
    "examples":
      "这是一家网店。": "This is an online shop."
      "网店的东西很便宜。":
        "native": "The things in the online shop are cheap."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1750":
    "native": "courier; delivery"
    "notes":
      "n1": "A delivery service, a parcel brought to the door. 递 (dì) is to hand over."
    "examples":
      "快递来了。":
        "native": "The delivery has come."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "我用快递寄东西。":
        "native": "I send things by courier."
        "bases":
          "用":
            "meaning": "to use"
          "寄":
            "meaning": "to post; to send"
  "zh-1751":
    "native": "postage"
    "notes":
      "n1": "The cost of sending a parcel by post. 费 (fèi) is a fee."
    "examples":
      "邮费是十块。":
        "native": "The postage is ten yuan."
        "bases":
          "块":
            "meaning": "the measure word for money; a yuan"
      "邮费很贵。": "The postage is expensive."
  "zh-1752":
    "native": "deposit"
    "notes":
      "n1": "A sum of money paid in advance and returned later. 押 (yā) is to pledge."
    "examples":
      "要付押金吗？":
        "native": "Is a deposit needed?"
        "bases":
          "要":
            "meaning": "must; to want"
      "押金退了。":
        "native": "The deposit has been returned."
        "bases":
          "退":
            "meaning": "to return"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1753":
    "native": "sample"
    "notes":
      "n1": "A sample of goods, shown to a buyer before buying. 样 (yàng) is a pattern, and 品 (pǐn) is a thing."
    "examples":
      "请试一下样品。":
        "native": "Please try the sample."
        "bases":
          "一下":
            "meaning": "a little; have a try"
      "样品是免费的。":
        "native": "The sample is free."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1754":
    "native": "style; model"
    "notes":
      "n1": "A style or a model of goods. 款式 (kuǎnshì) is the style of clothes."
    "examples":
      "这款很好。": "This model is very good."
      "有很多款。":
        "native": "There are many models."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1755":
    "native": "the measure word for a tin or jar; a tin"
    "notes":
      "n1": "A tin or a jar, and the measure word for things in one. 罐头 (guàntou) is a tin of food."
    "examples":
      "这罐牛奶很贵。": "This tin of milk is expensive."
      "我买了一罐可乐。":
        "native": "I bought a can of cola."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1756":
    "native": "look; appearance; style"
    "notes":
      "n1": "The look or appearance of a thing. 样 (yàng) is a pattern."
    "examples":
      "这个样子很好看。":
        "native": "This style looks very nice."
        "bases":
          "好看":
            "meaning": "nice to look at"
      "他的样子很累。":
        "native": "He looks very tired."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1757":
    "native": "price"
    "notes":
      "n1": "The price of a thing, in money. 钱 (qián) is money."
    "examples":
      "价钱多少？": "What is the price?"
      "价钱很合理。":
        "native": "The price is reasonable."
        "bases":
          "合理":
            "meaning": "reasonable"
  "zh-1758":
    "native": "big sale"
    "notes":
      "n1": "A big sale, when goods are sold at much lower prices. 减 (jiǎn) is to reduce, and 价 (jià) is a price."
    "examples":
      "今天有大减价。":
        "native": "There is a big sale today."
        "bases":
          "有":
            "meaning": "to have; there is"
      "大减价的时候人很多。":
        "native": "There are many people during the big sale."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
