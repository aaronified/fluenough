  "notes": "在 (zài) puts a thing in a place: 钥匙在桌子上 (yàoshi zài zhuōzi shàng), the keys are on the table. The place comes last, after 在 (zài): 上 (shàng), on; 下 (xià), under; 里 (lǐ), in. Ask where with 在哪里 (zài nǎlǐ): 钥匙在哪里 (yàoshi zài nǎlǐ), where are the keys? Do not add 吗 (ma) to a question with 哪里 (nǎlǐ)."
