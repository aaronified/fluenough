"core": "zh-about-me"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "About me"
"description": "Words for talking about yourself: your age, your country and where you come from, your job and school, where you live, your hobbies and how to give a phone number or address. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0261":
    "native": "year of age; years old"
    "notes":
      "n1": "Used for a person's age, after a number: 二十岁 (èrshí suì), twenty years old. The question is 几岁 (jǐ suì), how old."
    "examples":
      "我二十岁。": "I am twenty years old."
      "你几岁？": "How old are you?"
  "zh-0262":
    "native": "age"
    "notes":
      "n1": "A formal word for age, as a form asks for it. In speech people say 岁 (suì) after a number instead."
    "examples":
      "年龄是多少？": "What is the age?"
      "老师年龄大吗？": "Is the teacher old?"
    "synonyms":
      "years-old": "age, in speech"
  "zh-0263":
    "native": "country; nation"
    "notes":
      "n1": "A country, as a state. 国 (guó) on its own is the character for country, taught in the first characters."
    "examples":
      "国家很大。": "The country is very big."
      "这是什么国家？": "What country is this?"
  "zh-0264":
    "native": "China"
    "notes":
      "n1": "China. Its characters are 中 (zhōng), middle, and 国 (guó), country, both taught in the first characters."
    "examples":
      "我来自中国。": "I come from China."
      "中国很大。": "China is very big."
  "zh-0265":
    "native": "the United States; America"
    "notes":
      "n1": "The United States. 美 (měi) means beautiful, and 国 (guó) country."
    "examples":
      "他是美国人。": "He is American."
      "你去美国吗？": "Are you going to America?"
  "zh-0266":
    "native": "the United Kingdom; Britain"
    "notes":
      "n1": "The United Kingdom, or Britain in speech. 英 (yīng) is the first character, as in 英语 (yīngyǔ), English."
    "examples":
      "英国很好。": "The United Kingdom is very nice."
      "他们是英国人吗？": "Are they British?"
  "zh-0267":
    "native": "France"
    "notes":
      "n1": "France. 法 (fǎ) is the first character, which means law or method."
    "examples":
      "法国很大吗？": "Is France very big?"
      "我朋友是法国人。": "My friend is French."
  "zh-0268":
    "native": "Japan"
    "notes":
      "n1": "Japan. 日 (rì) is the sun, a radical taught in the strokes and radicals unit."
    "examples":
      "他是日本人。": "He is Japanese."
      "日本人来吗？": "Are the Japanese coming?"
  "zh-0269":
    "native": "doctor"
    "notes":
      "n1": "A doctor. 医 (yī) is the character for medicine, and 生 (shēng) is the character taught in the first characters."
    "examples":
      "他是医生。": "He is a doctor."
      "医生好吗？": "Is the doctor well?"
  "zh-0270":
    "native": "work; job"
    "notes":
      "n1": "Work, or a job. 工作 (gōngzuò) is also a verb, to work, in the same form."
    "examples":
      "工作好吗？": "Is the work good?"
      "爸爸妈妈都工作。": "Dad and Mum both work."
  "zh-0271":
    "native": "occupation; profession"
    "notes":
      "n1": "The kind of job a person has, as a form asks for it. In speech, 工作 (gōngzuò) is more usual."
    "examples":
      "职业是什么？": "What is the occupation?"
      "医生是职业。": "A doctor is an occupation."
  "zh-0272":
    "native": "to live (in a place)"
    "notes":
      "n1": "To live in a place, with the place after it. Often said as 住在 (zhù zài), live at."
    "examples":
      "你住哪里？": "Where do you live?"
      "爷爷住哪里？": "Where does grandfather live?"
  "zh-0273":
    "native": "to come from"
    "notes":
      "n1": "To come from a place, such as a home town or a country, with the place after it."
    "examples":
      "你来自哪里？": "Where are you from?"
      "她来自美国。": "She comes from America."
  "zh-0274":
    "native": "to like"
    "notes":
      "n1": "To like, or be fond of. It is milder than 爱 (ài), to love, which is a different word."
    "examples":
      "我喜欢你们。": "I like you all."
      "妈妈喜欢鱼。": "Mum likes fish."
  "zh-0275":
    "native": "hobby; interest"
    "notes":
      "n1": "A hobby, or a thing a person likes to do in their free time."
    "examples":
      "爱好是什么？": "What is the hobby?"
      "爱好很多。": "There are many hobbies."
  "zh-0276":
    "native": "telephone; phone call"
    "notes":
      "n1": "A telephone, or a phone call. For a phone number, say 电话号码 (diànhuà hàomǎ)."
    "examples":
      "老师，电话是多少？": "Teacher, what is your phone number?"
      "电话很好。": "The phone is very good."
  "zh-0277":
    "native": "number (of a phone, room or bus)"
    "notes":
      "n1": "A number that names a thing: a phone, a room or a bus. 号 (hào) is its first character."
    "examples":
      "号码对吗？": "Is the number right?"
      "号码是多少？": "What is the number?"
  "zh-0278":
    "native": "address"
    "notes":
      "n1": "An address, for a home or for post. The question is 地址是什么 (dìzhǐ shì shénme), what is the address."
    "examples":
      "地址是什么？": "What is the address?"
      "地址对吗？": "Is the address right?"
  "zh-0279":
    "native": "man; adult male"
    "notes":
      "n1": "A man, an adult male. The opposite is 女人 (nǚrén), a woman."
    "examples":
      "他是男人。": "He is a man."
      "男人也来吗？": "Are the men coming too?"
    "antonyms":
      "woman": "a woman"
  "zh-0280":
    "native": "school"
    "notes":
      "n1": "A school. 学 (xué), to learn, is its first character."
    "examples":
      "学校很好。": "The school is very good."
      "你去学校吗？": "Are you going to school?"
