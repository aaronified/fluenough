"cards":
  "zh-2026":
    "confusables":
      "w1":
        "why": "散步 (sànbù) is to walk for pleasure, not to run."
      "w2":
        "why": "游泳 (yóuyǒng) is to swim, another sport."
    "bases":
      "每天":
        "meaning": "every day"
    "native": "I go running every morning."
  "zh-2027":
    "confusables":
      "w1":
        "why": "唱歌 (chànggē) is to sing, another hobby."
      "w2":
        "why": "跳舞 (tiàowǔ) is to dance, another hobby."
    "bases":
      "和":
        "meaning": "and"
    "native": "He likes playing chess and fishing."
  "zh-2028":
    "confusables":
      "w1":
        "why": "露营 (lùyíng) is to camp, a different outing."
      "w2":
        "why": "旅游 (lǚyóu) is to travel as a tourist, not to hike."
    "native": "At the weekend I go hiking."
  "zh-2029":
    "confusables":
      "w1":
        "why": "书法 (shūfǎ) is calligraphy, a different art."
      "w2":
        "why": "摄影 (shèyǐng) is photography, another art."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "Her hobby is drawing."
  "zh-2030":
    "confusables":
      "w1":
        "why": "俱乐部 (jùlèbù) is a club, a close word."
      "w2":
        "why": "班级 (bānjí) is a class, not a club."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "I have joined a club."
  "zh-2031":
    "confusables":
      "w1":
        "why": "小说 (xiǎoshuō) is a novel, a book."
      "w2":
        "why": "漫画 (mànhuà) is a comic, a picture story."
    "native": "This game is very interesting."
  "zh-2032":
    "confusables":
      "w1":
        "why": "业余 (yèyú) is spare-time, a broader word."
      "w2":
        "why": "周末 (zhōumò) is the weekend, a time not a state."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "We cook when we are free."
  "zh-2033":
    "confusables":
      "w1":
        "why": "吉他 (jítā) is a guitar, a different instrument."
      "w2":
        "why": "唱歌 (chànggē) is to sing, not to play."
    "bases":
      "会":
        "meaning": "can; to know how to"
      "弹":
        "meaning": "to play (a stringed instrument)"
    "native": "He can play the piano."
