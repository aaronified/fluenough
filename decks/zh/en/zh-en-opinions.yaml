"id": "zh-en-opinions"
"kind": "layer"
"core": "zh-opinions"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Opinions"
"description": "Fifty words for having and sharing opinions: the view and the attitude, the reason and the evidence, the agreeing and the disagreeing, the fair and the right, and the rights and duties of a citizen. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-3060":
    "native": "opinion"
    "notes":
      "n1": "What you think about something. 意 (yì) is intention, and 见 (jiàn) is a view."
    "examples":
      "我的意见是这样。":
        "native": "My opinion is this."
        "bases":
          "的":
            "meaning": "of"
          "这样":
            "meaning": "like this"
      "你有什么意见？":
        "native": "Do you have any opinion?"
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-3061":
    "native": "viewpoint"
    "notes":
      "n1": "The way someone sees a question. 观 (guān) is to view, and 点 (diǎn) is a point."
    "examples":
      "这个观点很有意思。":
        "native": "This viewpoint is very interesting."
        "bases":
          "有":
            "meaning": "to have; there is"
          "意思":
            "meaning": "meaning; interest"
      "我们的观点不同。":
        "native": "Our viewpoints are different."
        "bases":
          "的":
            "meaning": "of"
          "不同":
            "meaning": "different"
  "zh-3062":
    "native": "position; stance"
    "notes":
      "n1": "The side that someone takes. 立 (lì) is to stand, and 场 (chǎng) is a place."
    "examples":
      "他的立场很清楚。":
        "native": "His position is very clear."
        "bases":
          "的":
            "meaning": "of"
      "我们有相同的立场。":
        "native": "We take the same position."
        "bases":
          "有":
            "meaning": "to have; there is"
          "相同":
            "meaning": "the same"
          "的":
            "meaning": "of"
  "zh-3063":
    "native": "attitude"
    "notes":
      "n1": "The way you feel and act about something. 态 (tài) is manner, and 度 (dù) is a degree."
    "examples":
      "他的态度很好。":
        "native": "His attitude is very good."
        "bases":
          "的":
            "meaning": "of"
      "对工作要有认真的态度。":
        "native": "You need a serious attitude to work."
        "bases":
          "要":
            "meaning": "must; to want"
          "有":
            "meaning": "to have; there is"
          "的":
            "meaning": "of"
  "zh-3064":
    "native": "view; way of seeing"
    "notes":
      "n1": "What you think about a matter. 看 (kàn) is to look, and 法 (fǎ) is a way."
    "examples":
      "你的看法是什么？":
        "native": "What is your view?"
        "bases":
          "的":
            "meaning": "of"
      "我们的看法一样。":
        "native": "Our views are the same."
        "bases":
          "的":
            "meaning": "of"
          "一样":
            "meaning": "the same"
  "zh-3065":
    "native": "suggestion"
    "notes":
      "n1": "An idea offered to someone. 建 (jiàn) is to build, and 议 (yì) is to discuss."
    "examples":
      "我有一个建议。":
        "native": "I have a suggestion."
        "bases":
          "有":
            "meaning": "to have; there is"
      "他的建议很好。":
        "native": "His suggestion is very good."
        "bases":
          "的":
            "meaning": "of"
  "zh-3066":
    "native": "to argue"
    "notes":
      "n1": "To argue and discuss about a question. 争 (zhēng) is to dispute, and 论 (lùn) is to discuss."
    "examples":
      "他们在争论。": "They are arguing."
      "这个问题有很多争论。":
        "native": "This question has a lot of argument."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-3067":
    "native": "to debate"
    "notes":
      "n1": "To argue two sides of a question in a formal way. 辩 (biàn) is to argue, and 论 (lùn) is to discuss."
    "examples":
      "我们辩论了一个下午。":
        "native": "We debated all afternoon."
        "bases":
          "了":
            "meaning": "a particle"
      "辩论很激烈。":
        "native": "The debate was very heated."
        "bases":
          "激烈":
            "meaning": "heated; fierce"
  "zh-3068":
    "native": "reason"
    "notes":
      "n1": "The reason for an action or view. 理 (lǐ) is reason, and 由 (yóu) is a cause."
    "examples":
      "你的理由是什么？":
        "native": "What is your reason?"
        "bases":
          "的":
            "meaning": "of"
      "我有充分的理由。":
        "native": "I have good reasons."
        "bases":
          "有":
            "meaning": "to have; there is"
          "充分":
            "meaning": "enough; ample"
          "的":
            "meaning": "of"
  "zh-3069":
    "native": "evidence"
    "notes":
      "n1": "Facts that show something is true. 证 (zhèng) is proof, and 据 (jù) is a basis."
    "examples":
      "这个证据很有力。":
        "native": "This evidence is very strong."
        "bases":
          "有力":
            "meaning": "strong; powerful"
      "没有证据。":
        "native": "There is no evidence."
        "bases":
          "没有":
            "meaning": "there is not"
  "zh-3070":
    "native": "fact"
    "notes":
      "n1": "Something that is true. 事 (shì) is matter, and 实 (shí) is true."
    "examples":
      "这是事实。": "This is a fact."
      "事实不是这样的。":
        "native": "The facts are not like this."
        "bases":
          "这样":
            "meaning": "like this"
          "的":
            "meaning": "of"
  "zh-3071":
    "native": "reason; sense"
    "notes":
      "n1": "The sense or logic behind something. 道 (dào) is a way, and 理 (lǐ) is reason."
    "examples":
      "他说得有道理。":
        "native": "What he says makes sense."
        "bases":
          "得":
            "meaning": "a particle: how it is done"
          "有":
            "meaning": "to have; there is"
      "这个道理很简单。": "This principle is very simple."
  "zh-3072":
    "native": "prejudice"
    "notes":
      "n1": "An unfair opinion formed in advance. 偏 (piān) is biased, and 见 (jiàn) is a view."
    "examples":
      "不要有偏见。":
        "native": "Do not have prejudice."
        "bases":
          "不要":
            "meaning": "do not"
          "有":
            "meaning": "to have; there is"
      "他对别人有偏见。":
        "native": "He is prejudiced against other people."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-3073":
    "native": "fair; just"
    "notes":
      "n1": "Treating people the same way. 公 (gōng) is public, and 正 (zhèng) is right."
    "examples":
      "老师很公正。": "The teacher is very fair."
      "这个判断很公正。": "This judgement is very fair."
  "zh-3074":
    "native": "objective"
    "notes":
      "n1": "Based on facts and not on feelings. 客 (kè) is guest, and 观 (guān) is a view."
    "examples":
      "我们要客观。":
        "native": "We must be objective."
        "bases":
          "要":
            "meaning": "must; to want"
      "这个报道很客观。": "This report is very objective."
  "zh-3075":
    "native": "subjective"
    "notes":
      "n1": "Based on personal feelings. 主 (zhǔ) is main, and 观 (guān) is a view."
    "examples":
      "这是主观的看法。":
        "native": "This is a subjective view."
        "bases":
          "的":
            "meaning": "of"
      "他的判断很主观。":
        "native": "His judgement is very subjective."
        "bases":
          "的":
            "meaning": "of"
  "zh-3076":
    "native": "reasonable"
    "notes":
      "n1": "Fair and sensible. 合 (hé) is fitting, and 理 (lǐ) is reason."
    "examples":
      "这个要求很合理。":
        "native": "This request is very reasonable."
        "bases":
          "要求":
            "meaning": "request; requirement"
      "价格很合理。": "The price is very reasonable."
  "zh-3077":
    "native": "makes sense"
    "notes":
      "n1": "Sensible and reasonable. 有 (yǒu) is to have, 道理 (dàolǐ) is sense."
    "examples":
      "你说得有道理。":
        "native": "What you say makes sense."
        "bases":
          "得":
            "meaning": "a particle: how it is done"
          "有":
            "meaning": "to have; there is"
      "这个想法有道理。":
        "native": "This idea makes sense."
        "bases":
          "想法":
            "meaning": "idea"
          "有":
            "meaning": "to have; there is"
  "zh-3078":
    "native": "to value; to take seriously"
    "notes":
      "n1": "To think something is important. 重 (zhòng) is heavy, and 视 (shì) is to look at."
    "examples":
      "我们很重视教育。":
        "native": "We value education very much."
        "bases":
          "教育":
            "meaning": "education"
      "政府重视这个问题。": "The government takes this problem seriously."
  "zh-3079":
    "native": "to ignore"
    "notes":
      "n1": "To not pay attention to. 忽 (hū) is careless, and 视 (shì) is to look at."
    "examples":
      "不要忽视意见。":
        "native": "Do not ignore opinions."
        "bases":
          "不要":
            "meaning": "do not"
      "他忽视了这个问题。":
        "native": "He ignored this problem."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3080":
    "native": "to praise"
    "notes":
      "n1": "To say that something is good. 赞 (zàn) is to praise, and 美 (měi) is beautiful."
    "examples":
      "大家赞美他的努力。":
        "native": "Everyone praised his efforts."
        "bases":
          "的":
            "meaning": "of"
      "这个作品值得赞美。":
        "native": "This work deserves praise."
        "bases":
          "作品":
            "meaning": "work (of art)"
          "值得":
            "meaning": "worth"
  "zh-3081":
    "native": "to criticise"
    "notes":
      "n1": "To judge something and find faults. 批 (pī) is to criticise, and 判 (pàn) is to judge."
    "examples":
      "他批判了这个观点。":
        "native": "He criticised this view."
        "bases":
          "了":
            "meaning": "a particle"
      "大家批判他的说法。":
        "native": "We must look at problems critically."
        "bases":
          "的":
            "meaning": "of"
          "说法":
            "meaning": "claim; way of putting it"
  "zh-3082":
    "native": "to question"
    "notes":
      "n1": "To ask whether something is true. 质 (zhì) is quality, and 疑 (yí) is doubt."
    "examples":
      "大家质疑这个结果。":
        "native": "Everyone questions this result."
        "bases":
          "结果":
            "meaning": "result"
      "我要质疑这个说法。":
        "native": "I want to question this claim."
        "bases":
          "要":
            "meaning": "must; to want"
          "说法":
            "meaning": "claim; way of putting it"
  "zh-3083":
    "native": "to deny"
    "notes":
      "n1": "To say something is not true. 否 (fǒu) is no, and 认 (rèn) is to admit."
    "examples":
      "他否认了这件事。":
        "native": "He denied this matter."
        "bases":
          "了":
            "meaning": "a particle"
          "事":
            "meaning": "matter"
      "他否认自己说过。": "He denied having said it."
  "zh-3084":
    "native": "certain; sure"
    "notes":
      "n1": "Known and not in doubt. 确 (què) is firm, and 定 (dìng) is fixed."
    "examples":
      "我很确定。": "I am very sure."
      "结果还没有确定。":
        "native": "The result is not yet certain."
        "bases":
          "结果":
            "meaning": "result"
          "没有":
            "meaning": "there is not"
  "zh-3085":
    "native": "surely not; is it possible that"
    "notes":
      "n1": "A question word that shows surprise. 难 (nán) is hard, and 道 (dào) is to say."
    "examples":
      "难道你不知道吗？": "Surely you do not know?"
      "难道这样也不行？":
        "native": "Surely this will not work either?"
        "bases":
          "这样":
            "meaning": "like this"
  "zh-3086":
    "native": "perhaps"
    "notes":
      "n1": "Showing that something may be true. 或 (huò) is maybe, and 许 (xǔ) is allowed."
    "examples":
      "或许他不知道。": "Perhaps he does not know."
      "或许明天会下雨。":
        "native": "Perhaps it will rain tomorrow."
        "bases":
          "会":
            "meaning": "can; to know how to"
  "zh-3087":
    "native": "maybe"
    "notes":
      "n1": "Showing a guess. 也 (yě) is also, and 许 (xǔ) is perhaps."
    "examples":
      "也许你是对的。":
        "native": "Maybe you are right."
        "bases":
          "的":
            "meaning": "of"
      "也许我错了。":
        "native": "Maybe I am wrong."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3088":
    "native": "certainly"
    "notes":
      "n1": "Being sure about something. 肯 (kěn) is willing, and 定 (dìng) is certain."
    "examples":
      "他肯定会来。":
        "native": "He will definitely come."
        "bases":
          "会":
            "meaning": "can; to know how to"
      "我肯定是对的。":
        "native": "I am certainly right."
        "bases":
          "的":
            "meaning": "of"
  "zh-3089":
    "native": "to agree with"
    "notes":
      "n1": "To agree with an idea. 赞 (zàn) is to support, and 同 (tóng) is the same."
    "examples":
      "我赞同你的观点。":
        "native": "I agree with your viewpoint."
        "bases":
          "的":
            "meaning": "of"
      "大家都赞同这个建议。": "Everyone agrees with this suggestion."
  "zh-3090":
    "native": "to rebut"
    "notes":
      "n1": "To argue back against what someone says. 反 (fǎn) is back, and 驳 (bó) is to refute."
    "examples":
      "他反驳了我的意见。":
        "native": "He rebutted my opinion."
        "bases":
          "了":
            "meaning": "a particle"
          "的":
            "meaning": "of"
      "很难反驳这个证据。": "It is hard to rebut this evidence."
  "zh-3091":
    "native": "value; worth"
    "notes":
      "n1": "How much something is worth or matters. 价 (jià) is price, and 值 (zhí) is worth."
    "examples":
      "这本书很有价值。":
        "native": "This book has great value."
        "bases":
          "有":
            "meaning": "to have; there is"
      "朋友的价值很大。":
        "native": "A friend is worth a great deal."
        "bases":
          "的":
            "meaning": "of"
  "zh-3092":
    "native": "principle"
    "notes":
      "n1": "A basic rule that guides behaviour. 原 (yuán) is origin, and 则 (zé) is a rule."
    "examples":
      "我有自己的原则。":
        "native": "I have my own principles."
        "bases":
          "有":
            "meaning": "to have; there is"
          "的":
            "meaning": "of"
      "这是一个重要的原则。":
        "native": "This is an important principle."
        "bases":
          "的":
            "meaning": "of"
  "zh-3093":
    "native": "evaluation; review"
    "notes":
      "n1": "A judgement of how good something is. 评 (píng) is to judge, and 价 (jià) is value."
    "examples":
      "大家对这个产品评价很高。": "People rate this product very highly."
      "这个评价很公正。": "This evaluation is very fair."
  "zh-3094":
    "native": "correct"
    "notes":
      "n1": "Right, with no mistakes. 正 (zhèng) is right, and 确 (què) is sure."
    "examples":
      "你的答案正确。":
        "native": "Your answer is correct."
        "bases":
          "的":
            "meaning": "of"
      "这是正确的做法。":
        "native": "This is the right way to do it."
        "bases":
          "的":
            "meaning": "of"
          "做法":
            "meaning": "way of doing"
  "zh-3095":
    "native": "mistake; error"
    "notes":
      "n1": "Something that is not right. 错 (cuò) is wrong, and 误 (wù) is a mistake."
    "examples":
      "这是一个错误。": "This is a mistake."
      "我们要改正错误。":
        "native": "We must correct the mistakes."
        "bases":
          "要":
            "meaning": "must; to want"
          "改正":
            "meaning": "to correct"
  "zh-3096":
    "native": "reliable"
    "notes":
      "n1": "You can trust it to be right. 可 (kě) is can, and 靠 (kào) is to rely on."
    "examples":
      "这个消息很可靠。": "This news is very reliable."
      "他是一个可靠的人。":
        "native": "He is a reliable person."
        "bases":
          "的":
            "meaning": "of"
  "zh-3097":
    "native": "key; crucial point"
    "notes":
      "n1": "The most important part. 关 (guān) is a gate, and 键 (jiàn) is a key."
    "examples":
      "关键是什么？": "What is the key point?"
      "这是关键的一步。":
        "native": "This is a crucial step."
        "bases":
          "的":
            "meaning": "of"
          "步":
            "meaning": "step"
  "zh-3098":
    "native": "strength; advantage"
    "notes":
      "n1": "A good quality. 优 (yōu) is excellent, and 点 (diǎn) is a point."
    "examples":
      "他的优点很多。":
        "native": "He has many strengths."
        "bases":
          "的":
            "meaning": "of"
      "这个方案有优点。":
        "native": "This plan has advantages."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-3099":
    "native": "weakness; disadvantage"
    "notes":
      "n1": "A bad quality. 缺 (quē) is lacking, and 点 (diǎn) is a point."
    "examples":
      "他的缺点是太急。":
        "native": "His weakness is that he is too impatient."
        "bases":
          "的":
            "meaning": "of"
          "急":
            "meaning": "hasty; urgent"
      "这个办法有缺点。":
        "native": "This method has disadvantages."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-3100":
    "native": "interest; benefit"
    "notes":
      "n1": "Something that is good for someone. 利 (lì) is profit, and 益 (yì) is benefit."
    "examples":
      "我们要考虑大家的利益。":
        "native": "We must consider everyone's interests."
        "bases":
          "要":
            "meaning": "must; to want"
          "的":
            "meaning": "of"
      "这不符合他的利益。":
        "native": "This is not in his interest."
        "bases":
          "符合":
            "meaning": "to fit; to match"
          "的":
            "meaning": "of"
  "zh-3101":
    "native": "responsibility"
    "notes":
      "n1": "A duty that you must carry out. 责 (zé) is duty, and 任 (rèn) is a post."
    "examples":
      "这是我的责任。":
        "native": "This is my responsibility."
        "bases":
          "的":
            "meaning": "of"
      "大家都有责任。":
        "native": "Everyone has a responsibility."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-3102":
    "native": "right"
    "notes":
      "n1": "Something you are allowed to do or have. 权 (quán) is power, and 利 (lì) is benefit."
    "examples":
      "每个人都有权利。":
        "native": "Everyone has rights."
        "bases":
          "有":
            "meaning": "to have; there is"
      "这是你的权利。":
        "native": "This is your right."
        "bases":
          "的":
            "meaning": "of"
  "zh-3103":
    "native": "freedom"
    "notes":
      "n1": "The power to act and speak as you choose. 自 (zì) is self, and 由 (yóu) is to allow."
    "examples":
      "我们要自由。":
        "native": "We want freedom."
        "bases":
          "要":
            "meaning": "must; to want"
      "言论自由很重要。":
        "native": "Freedom of speech is very important."
        "bases":
          "言论":
            "meaning": "speech; opinions"
  "zh-3104":
    "native": "equal"
    "notes":
      "n1": "The same for everyone. 平 (píng) is level, and 等 (děng) is equal."
    "examples":
      "大家都是平等的。":
        "native": "Everyone is equal."
        "bases":
          "的":
            "meaning": "of"
      "男女平等很重要。":
        "native": "Equality between men and women is important."
        "bases":
          "男女":
            "meaning": "men and women"
  "zh-3105":
    "native": "to respect"
    "notes":
      "n1": "To think highly of others. 尊 (zūn) is to honour, and 重 (zhòng) is to value."
    "examples":
      "我们要尊重别人。":
        "native": "We must respect other people."
        "bases":
          "要":
            "meaning": "must; to want"
      "老师很尊重学生。": "The teacher respects the students."
  "zh-3106":
    "native": "to consider"
    "notes":
      "n1": "To think about something before deciding. 考 (kǎo) is to think, and 虑 (lǜ) is to worry."
    "examples":
      "请你考虑一下。":
        "native": "Please think it over."
        "bases":
          "一下":
            "meaning": "a little while"
      "我们要考虑这个问题。":
        "native": "We need to consider this problem."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-3107":
    "native": "to judge"
    "notes":
      "n1": "To decide what is true or right. 判 (pàn) is to judge, and 断 (duàn) is to decide."
    "examples":
      "我们要判断对错。":
        "native": "We must judge what is right and wrong."
        "bases":
          "要":
            "meaning": "must; to want"
          "对错":
            "meaning": "right and wrong"
      "他的判断很准。":
        "native": "His judgement is very accurate."
        "bases":
          "的":
            "meaning": "of"
          "准":
            "meaning": "accurate"
  "zh-3108":
    "native": "to analyse"
    "notes":
      "n1": "To break something down to understand it. 分 (fēn) is to divide, and 析 (xī) is to analyse."
    "examples":
      "我们分析了数据。":
        "native": "We analysed the data."
        "bases":
          "了":
            "meaning": "a particle"
      "这个分析很清楚。": "This analysis is very clear."
  "zh-3109":
    "native": "conclusion"
    "notes":
      "n1": "The final judgement after thinking. 结 (jié) is to end, and 论 (lùn) is a discussion."
    "examples":
      "结论是什么？": "What is the conclusion?"
      "我们得出了一个结论。":
        "native": "We reached a conclusion."
        "bases":
          "得出":
            "meaning": "to reach (a conclusion)"
          "了":
            "meaning": "a particle"
