"cards":
  "zh-3732":
    "confusables":
      "w1":
        "why": "情节 (qíngjié) is a plot detail, a smaller unit."
      "w2":
        "why": "结局 (jiéjú) is the ending, a different part."
    "bases":
      "部":
        "meaning": "measure word for films"
      "的":
        "meaning": "of"
    "native": "The plot of this film is very exciting."
  "zh-3733":
    "confusables":
      "w1":
        "why": "悲剧 (bēijù) is a tragedy, the opposite of comedy."
      "w2":
        "why": "纪录片 (jìlùpiàn) is a documentary, a different kind."
    "bases":
      "和":
        "meaning": "and"
    "native": "I like watching animation and comedy."
  "zh-3734":
    "confusables":
      "w1":
        "why": "字幕 (zìmù) is subtitles, the text on screen."
      "w2":
        "why": "配乐 (pèiyuè) is music that goes with a film, a different thing."
    "bases":
      "部":
        "meaning": "measure word for films"
      "电影":
        "meaning": "film"
      "的":
        "meaning": "of"
    "native": "The dubbing of this film is very nice to listen to."
  "zh-3735":
    "confusables":
      "w1":
        "why": "角色 (juésè) is a role, a related word."
      "w2":
        "why": "导演 (dǎoyǎn) is the director, a different job."
    "native": "This lead actor's acting is very good."
  "zh-3736":
    "confusables":
      "w1":
        "why": "感人 (gǎnrén) is moving, a different feeling."
      "w2":
        "why": "搞笑 (gǎoxiào) is funny, the opposite kind of film."
    "bases":
      "部":
        "meaning": "measure word for films"
      "恐怖片":
        "meaning": "horror film"
      "让":
        "meaning": "to let; to make"
    "native": "This horror film frightens people."
  "zh-3737":
    "confusables":
      "w1":
        "why": "系列 (xìliè) is a series, a larger group."
      "w2":
        "why": "首映 (shǒuyìng) is the premiere, a different event."
    "bases":
      "比":
        "meaning": "than"
      "第":
        "meaning": "ordinal prefix"
      "部":
        "meaning": "measure word for films"
    "native": "This sequel is more exciting than the first."
  "zh-3738":
    "confusables":
      "w1":
        "why": "影评 (yǐngpíng) is a film review, a written opinion."
      "w2":
        "why": "上映 (shàngyìng) is to be released, a different stage."
    "native": "The box office is high, and the rating is good too."
  "zh-3739":
    "confusables":
      "w1":
        "why": "影厅 (yǐngtīng) is a cinema hall, a room inside."
      "w2":
        "why": "片场 (piànchǎng) is a film set, where films are made."
    "native": "We go to the cinema to buy tickets and go in."
