"id": "zh-en-grammar-direction-complement-sentences"
"kind": "layer"
"core": "zh-grammar-direction-complement-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "进 (jìn), 出 (chū), 下 (xià), 回 (huí) after the verb in sentences"
"description": "Sentences where a direction word after the verb says where the action goes: 走进 (walk in), 跑出 (run out), 坐下 (sit down), 走进来 (come in). Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-2161":
    "confusables":
      "w1":
        "why": "出 (chū) is out, the opposite direction."
      "w2":
        "why": "回 (huí) is back, another direction."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "He has walked into the classroom."
  "zh-2162":
    "confusables":
      "w1":
        "why": "上 (shàng) is up, the opposite direction."
      "w2":
        "why": "出 (chū) is out, not down."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "We have come down."
  "zh-2163":
    "confusables":
      "w1":
        "why": "放 (fàng) is to put, not to take out."
      "w2":
        "why": "送 (sòng) is to give or send, not to take out."
    "bases":
      "把":
        "meaning": "a particle that puts the object before the verb"
      "出来":
        "meaning": "out (towards the speaker)"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "She has taken the book out."
  "zh-2164":
    "confusables":
      "w1":
        "why": "走 (zǒu) is to walk, not to run."
      "w2":
        "why": "回 (huí) is back, the opposite direction."
    "bases":
      "出去":
        "meaning": "out (away from the speaker)"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "The child has run out to play."
  "zh-2165":
    "confusables":
      "w1":
        "why": "站 (zhàn) is to stand, the opposite."
      "w2":
        "why": "走 (zǒu) is to walk, not to sit."
    "native": "Please sit down."
  "zh-2166":
    "confusables":
      "w1":
        "why": "来 (lái) is to come, a different direction."
      "w2":
        "why": "走 (zǒu) is to walk, not to return."
    "bases":
      "回去":
        "meaning": "back (there)"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "He has gone back."
  "zh-2167":
    "confusables":
      "w1":
        "why": "走 (zǒu) is to walk, not to move over."
      "w2":
        "why": "来 (lái) is to come, a different word."
    "bases":
      "过来":
        "meaning": "over (towards the speaker)"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "The car has come over here."
  "zh-2168":
    "confusables":
      "w1":
        "why": "出 (chū) is out, the opposite direction."
      "w2":
        "why": "回 (huí) is back, another direction."
    "bases":
      "进来":
        "meaning": "in (towards the speaker)"
    "native": "Come in, please."
