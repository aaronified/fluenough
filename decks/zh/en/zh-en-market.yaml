schema: 1
"id": "zh-en-market"
"kind": "layer"
"core": "zh-market"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Market"
"description": "Forty words for the market: the market and the food market, the stall, the customer, the fruit and the vegetables, the meat and eggs, the jin for weighing, the price, the adjectives fresh, sweet, spicy and sour, the bag and basket, weighing, small change, paying and cash, bargaining, the morning market, queuing and the receipt. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0760":
    "native": "market"
    "notes":
      "n1": "市场 (shìchǎng) is 'market', a place where things are bought and sold."
    "examples":
      "这个市场很大。": "This market is big."
      "市场在哪里？": "Where is the market?"
  "zh-0761":
    "native": "food market; wet market"
    "notes":
      "n1": "菜市场 (càishìchǎng) is a food market, selling vegetables, fruit, meat and fish, often in the open air."
    "examples":
      "菜市场很热闹。": "The food market is lively."
      "菜市场在学校旁边吗？": "Is the food market next to the school?"
  "zh-0762":
    "native": "stall"
    "notes":
      "n1": "摊子 (tānzi) is a stall: a small table or cart where a seller puts out goods."
    "examples":
      "这个摊子很干净。": "This stall is clean."
      "摊子在市场里。": "The stall is in the market."
  "zh-0763":
    "native": "customer"
    "notes":
      "n1": "顾客 (gùkè) is 'customer', the person who buys. 客户 (kèhù) is a business client, a different word."
    "examples":
      "顾客很多。": "There are many customers."
      "顾客买水果吗？": "Do customers buy fruit?"
  "zh-0764":
    "native": "fruit"
    "notes":
      "n1": "水果 (shuǐguǒ) is 'fruit'. Name one kind with 苹果 (píngguǒ), apple, to say which fruit."
    "examples":
      "这个水果很新鲜。": "This fruit is fresh."
      "你买水果吗？": "Do you buy fruit?"
  "zh-0765":
    "native": "vegetables"
    "notes":
      "n1": "蔬菜 (shūcài) is 'vegetables', the green and root foods sold at a market stall."
    "examples":
      "我买蔬菜。": "I buy vegetables."
      "蔬菜很便宜。": "Vegetables are cheap."
  "zh-0766":
    "native": "apple"
    "notes":
      "n1": "苹果 (píngguǒ) is 'apple'. Count apples with 个 (gè): 两个苹果 (liǎng gè píngguǒ), two apples."
    "examples":
      "苹果多少钱？": "How much are the apples?"
      "我买两个苹果。": "I buy two apples."
  "zh-0767":
    "native": "banana"
    "notes":
      "n1": "香蕉 (xiāngjiāo) is 'banana'. Fruit is often weighed by the jin: 一斤香蕉 (yì jīn xiāngjiāo), a jin of bananas."
    "examples":
      "香蕉很甜。": "Bananas are sweet."
      "一斤香蕉多少钱？": "How much is a jin of bananas?"
  "zh-0768":
    "native": "orange"
    "notes":
      "n1": "橙子 (chéngzi) is 'orange', the fruit. The 子 (zi) ending is neutral, as in 桌子 (zhuōzi), table."
    "examples":
      "橙子很酸吗？": "Are oranges sour?"
      "我买三个橙子。": "I buy three oranges."
  "zh-0769":
    "native": "watermelon"
    "notes":
      "n1": "西瓜 (xīguā) is 'watermelon', a big green fruit with red flesh. It is often sold cut into pieces."
    "examples":
      "西瓜很大。": "The watermelon is big."
      "这个西瓜多少钱？": "How much is this watermelon?"
  "zh-0770":
    "native": "grapes"
    "notes":
      "n1": "葡萄 (pútao) is 'grapes'. The second syllable 萄 (tao) is said neutral, so it has no tone mark."
    "examples":
      "葡萄很甜。": "Grapes are sweet."
      "你吃葡萄吗？": "Do you eat grapes?"
  "zh-0771":
    "native": "Chinese cabbage"
    "notes":
      "n1": "白菜 (báicài) is 'Chinese cabbage', the pale leafy vegetable used in many soups and stir-fries."
    "examples":
      "白菜很新鲜。": "The Chinese cabbage is fresh."
      "我买一斤白菜。": "I buy a jin of Chinese cabbage."
  "zh-0772":
    "native": "tomato"
    "notes":
      "n1": "西红柿 (xīhóngshì) is 'tomato', a red fruit eaten as a vegetable. To ask the price per jin, say 多少钱一斤 (duōshao qián yì jīn) after the name: 西红柿多少钱一斤 (xīhóngshì duōshao qián yì jīn)."
    "examples":
      "西红柿很酸。": "Tomatoes are sour."
      "西红柿多少钱一斤？": "How much are tomatoes per jin?"
  "zh-0773":
    "native": "potato"
    "notes":
      "n1": "土豆 (tǔdòu) is 'potato'. It is weighed by the jin: 三斤土豆 (sān jīn tǔdòu), three jin of potatoes."
    "examples":
      "土豆很便宜。": "Potatoes are cheap."
      "我买三斤土豆。": "I buy three jin of potatoes."
  "zh-0774":
    "native": "cucumber"
    "notes":
      "n1": "黄瓜 (huángguā) is 'cucumber', the long green vegetable eaten raw or in salads."
    "examples":
      "黄瓜很新鲜。": "The cucumbers are fresh."
      "黄瓜也很便宜。": "Cucumbers are cheap too."
  "zh-0775":
    "native": "chili"
    "notes":
      "n1": "辣椒 (làjiāo) is 'chili', the hot pepper. The taste it gives is 辣 (là), spicy."
    "examples":
      "辣椒很辣。": "Chili is spicy."
      "你吃辣椒吗？": "Do you eat chili?"
  "zh-0776":
    "native": "spring onion"
    "notes":
      "n1": "葱 (cōng) is 'spring onion', the thin green stalk used to flavour cooking."
    "examples":
      "葱很新鲜。": "The spring onion is fresh."
      "我买一斤葱。": "I buy a jin of spring onion."
  "zh-0777":
    "native": "ginger"
    "notes":
      "n1": "姜 (jiāng) is 'ginger', the knobbly root used in cooking and in tea."
    "examples":
      "姜很辣。": "Ginger is spicy."
      "姜多少钱一斤？": "How much is ginger per jin?"
  "zh-0778":
    "native": "tofu"
    "notes":
      "n1": "豆腐 (dòufu) is 'tofu', soft white bean curd."
    "examples":
      "豆腐很便宜。": "Tofu is cheap."
      "豆腐很新鲜吗？": "Is the tofu fresh?"
  "zh-0779":
    "native": "meat"
    "notes":
      "n1": "肉 (ròu) is 'meat', as sold at a market stall. It is weighed by the jin: 两斤肉 (liǎng jīn ròu), two jin of meat."
    "examples":
      "肉很贵。": "Meat is expensive."
      "我买两斤肉。": "I buy two jin of meat."
  "zh-0780":
    "native": "egg"
    "notes":
      "n1": "鸡蛋 (jīdàn) is 'egg', from a chicken: 鸡 (jī) is chicken and 蛋 (dàn) is egg. Count eggs with 个 (gè), not by the jin."
    "examples":
      "鸡蛋多少钱一个？": "How much is each egg?"
      "我买十个鸡蛋。": "I buy ten eggs."
  "zh-0781":
    "native": "jin, half a kilogram"
    "notes":
      "n1": "斤 (jīn) is the jin, a unit of weight: half a kilogram, 500 grams. 公斤 (gōngjīn) is a kilogram, 1,000 grams, a different unit."
    "examples":
      "一斤苹果多少钱？": "How much is a jin of apples?"
      "我买两斤米。": "I buy two jin of rice."
  "zh-0782":
    "native": "price"
    "notes":
      "n1": "价格 (jiàgé) is 'price', the amount a thing costs. In speech people ask 多少钱 (duōshao qián), how much money."
    "examples":
      "价格很贵。": "The price is high."
      "价格很便宜吗？": "Is the price low?"
  "zh-0783":
    "native": "fresh"
    "notes":
      "n1": "新鲜 (xīnxiān) is 'fresh', said of food. 新 (xīn) is 'new', so 新鲜 is not the word for new things."
    "examples":
      "这个西瓜很新鲜。": "This watermelon is fresh."
      "鱼很新鲜吗？": "Is the fish fresh?"
  "zh-0784":
    "native": "sweet"
    "notes":
      "n1": "甜 (tián) is 'sweet', the taste of sugar and of many fruits. Its opposite is 酸 (suān), sour."
    "examples":
      "苹果很甜，那个很酸。": "The apple is sweet, and that one is sour."
      "这个苹果很甜吗？": "Is this apple sweet?"
  "zh-0785":
    "native": "spicy"
    "notes":
      "n1": "辣 (là) is 'spicy', hot in taste. It is not 热 (rè), which is hot in temperature."
    "examples":
      "这个很辣吗？": "Is this spicy?"
      "不辣，很好吃。": "Not spicy, and tasty."
  "zh-0786":
    "native": "sour"
    "notes":
      "n1": "酸 (suān) is 'sour', the taste of a lemon or an unripe orange."
    "examples":
      "这个橙子很酸。": "This orange is sour."
      "西红柿很酸吗？": "Are tomatoes sour?"
  "zh-0787":
    "native": "bag"
    "notes":
      "n1": "袋子 (dàizi) is 'bag', a bag for carrying shopping. The 子 (zi) ending is neutral, as in 桌子 (zhuōzi)."
    "examples":
      "袋子在桌子上。": "The bag is on the table."
      "我有一个袋子。":
        "native": "I have a bag."
        "bases":
          "有": { "meaning": "to have" }
  "zh-0788":
    "native": "basket"
    "notes":
      "n1": "篮子 (lánzi) is 'basket', a container with a handle for carrying goods. The 子 (zi) ending is neutral."
    "examples":
      "篮子里有水果。":
        "native": "There is fruit in the basket."
        "bases":
          "有": { "meaning": "to have; there is" }
      "篮子很大。": "The basket is big."
  "zh-0789":
    "native": "to weigh"
    "notes":
      "n1": "称 (chēng) is 'to weigh': a seller puts goods on a scale. 秤 (chèng) is the scale itself, the noun."
    "examples":
      "请帮我称一斤。": "Please weigh a jin for me."
      "老板称西红柿。": "The seller weighs tomatoes."
  "zh-0790":
    "native": "small change"
    "notes":
      "n1": "零钱 (língqián) is 'small change', the coins and small notes. 钱 (qián) is money in general."
    "examples":
      "你有零钱吗？":
        "native": "Do you have any small change?"
        "bases":
          "有": { "meaning": "to have" }
      "我没有零钱。":
        "native": "I have no small change."
        "bases":
          "没有": { "meaning": "to not have; there is not" }
  "zh-0791":
    "native": "to take (money); to accept"
    "notes":
      "n1": "收 (shōu) is 'to take', as a seller takes money: 收钱 (shōu qián). It is the opposite side of 付 (fù), to pay."
    "examples":
      "老板收钱吗？": "Does the seller take money?"
      "这儿收现金吗？": "Does this place take cash?"
  "zh-0792":
    "native": "to pay"
    "notes":
      "n1": "付 (fù) is 'to pay': 付钱 (fù qián), to pay the money."
    "examples":
      "我付钱。": "I pay the money."
      "你付现金吗？": "Do you pay in cash?"
  "zh-0793":
    "native": "cash"
    "notes":
      "n1": "现金 (xiànjīn) is 'cash', money in notes and coins, as opposed to a card."
    "examples":
      "我只有现金。":
        "native": "I only have cash."
        "bases":
          "有": { "meaning": "to have" }
      "我没有现金。":
        "native": "I have no cash."
        "bases":
          "没有": { "meaning": "to not have; there is not" }
  "zh-0794":
    "native": "to bargain"
    "notes":
      "n1": "讲价 (jiǎngjià) is 'to bargain': to talk about the price until a lower one is agreed. It is done at a stall, where prices are not fixed."
    "examples":
      "你们讲价吗？": "Do you bargain?"
      "我们讲价。": "We bargain."
  "zh-0795":
    "native": "morning market"
    "notes":
      "n1": "早市 (zǎoshì) is 'morning market', a market held early in the day."
    "examples":
      "早市很热闹。": "The morning market is lively."
      "我早上去早市。": "I go to the morning market in the morning."
  "zh-0796":
    "native": "to queue"
    "notes":
      "n1": "排队 (páiduì) is 'to queue', to stand in a line: 排 (pái) is a row and 队 (duì) is a line of people."
    "examples":
      "大家排队。": "Everyone queues."
      "我们排队买水果。": "We queue to buy fruit."
  "zh-0797":
    "native": "lively; busy"
    "notes":
      "n1": "热闹 (rènao) is 'lively', full of people and noise and activity, said of a place."
    "examples":
      "市场很热闹。": "The market is lively."
      "今天很热闹吗？": "Is it lively today?"
  "zh-0798":
    "native": "receipt"
    "notes":
      "n1": "小票 (xiǎopiào) is 'receipt', the small paper a shop gives you for what you paid."
    "examples":
      "小票在哪里？": "Where is the receipt?"
      "我有小票吗？":
        "native": "Do I have a receipt?"
        "bases":
          "有": { "meaning": "to have" }
  "zh-0799":
    "native": "scale"
    "notes":
      "n1": "秤 (chèng) is 'scale', the instrument a seller uses to weigh goods. 称 (chēng) is the verb 'to weigh'."
    "examples":
      "秤在桌子上。": "The scale is on the table."
      "这个秤很新。": "This scale is new."
