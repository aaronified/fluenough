"id": "zh-en-clothes"
"kind": "layer"
"core": "zh-clothes"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Clothes and colours"
"description": "Forty words for clothes and shopping for them: trousers and skirts, coats and shoes, hats and gloves, the buttons and zips, the colours, and the words for size, trying on and fit. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1464":
    "native": "trousers"
    "notes":
      "n1": "Trousers, worn on the legs. 子 (zi) makes it a noun."
    "examples":
      "裤子很长。": "The trousers are very long."
      "我买了两条裤子。":
        "native": "I bought two pairs of trousers."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "条":
            "meaning": "the measure word for long things, such as trousers"
  "zh-1465":
    "native": "skirt"
    "notes":
      "n1": "A skirt, worn by women and girls. 裙 (qún) is a skirt."
    "examples":
      "裙子很漂亮。": "The skirt is very pretty."
      "她穿红色的裙子。":
        "native": "She wears a red skirt."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1466":
    "native": "shirt"
    "notes":
      "n1": "A shirt, with buttons, worn over the body. 衫 (shān) is a shirt."
    "examples":
      "衬衫很干净。": "The shirt is very clean."
      "我要买一件衬衫。":
        "native": "I want to buy a shirt."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-1467":
    "native": "coat; jacket"
    "notes":
      "n1": "A coat or jacket, worn over other clothes. 套 (tào) is a set or cover."
    "examples":
      "外套很暖和。": "The coat is very warm."
      "我脱了外套。":
        "native": "I took off my coat."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1468":
    "native": "sweater; woollen jumper"
    "notes":
      "n1": "A knitted sweater, warm in winter. 毛 (máo) is wool."
    "examples":
      "毛衣很暖和。": "The sweater is very warm."
      "冬天我穿毛衣。": "In winter I wear a sweater."
  "zh-1469":
    "native": "overcoat"
    "notes":
      "n1": "A long, heavy overcoat, for cold weather. 大 (dà) is big."
    "examples":
      "大衣很贵。": "The overcoat is expensive."
      "冬天穿大衣。": "Wear an overcoat in winter."
  "zh-1470":
    "native": "short sleeves"
    "notes":
      "n1": "A shirt or top with short sleeves. 短 (duǎn) is short, and 袖 (xiù) is a sleeve."
    "examples":
      "这件衬衫是短袖的。":
        "native": "This shirt has short sleeves."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "夏天穿短袖。": "Wear short sleeves in summer."
  "zh-1471":
    "native": "long sleeves"
    "notes":
      "n1": "A shirt or top with long sleeves. 长 (cháng) is long."
    "examples":
      "这件外套是长袖的。":
        "native": "This coat has long sleeves."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "秋天穿长袖。": "Wear long sleeves in autumn."
  "zh-1472":
    "native": "socks"
    "notes":
      "n1": "Socks, worn on the feet inside shoes."
    "examples":
      "袜子很干净。": "The socks are very clean."
      "我买了三双袜子。":
        "native": "I bought three pairs of socks."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1473":
    "native": "apron"
    "notes":
      "n1": "An apron, worn over the clothes while cooking. 围 (wéi) is to wrap around, and 裙 (qún) is a skirt."
    "examples":
      "做饭的时候穿围裙。":
        "native": "Wear an apron when you cook."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "这条围裙很干净。":
        "native": "This apron is very clean."
        "bases":
          "条":
            "meaning": "the measure word for long things, such as trousers"
  "zh-1474":
    "native": "leather shoes"
    "notes":
      "n1": "Leather shoes, for work or a formal occasion. 皮 (pí) is leather."
    "examples":
      "他穿皮鞋上班。": "He wears leather shoes to work."
      "皮鞋很贵。": "Leather shoes are expensive."
  "zh-1475":
    "native": "sports shoes; trainers"
    "notes":
      "n1": "Sports shoes, for running or exercise. 运动 (yùndòng) is sport."
    "examples":
      "我穿运动鞋跑步。": "I wear sports shoes to run."
      "运动鞋很舒服。": "Sports shoes are very comfortable."
  "zh-1476":
    "native": "hat; cap"
    "notes":
      "n1": "A hat or cap, worn on the head. 帽 (mào) is a hat."
    "examples":
      "帽子很大。": "The hat is very big."
      "冬天戴帽子。":
        "native": "Wear a hat in winter."
        "bases":
          "戴":
            "meaning": "to wear (a hat, gloves, glasses)"
  "zh-1477":
    "native": "scarf"
    "notes":
      "n1": "A scarf, wound around the neck for warmth. 围 (wéi) is to wrap around."
    "examples":
      "围巾很暖和。": "The scarf is very warm."
      "我戴围巾出门。":
        "native": "I go out wearing a scarf."
        "bases":
          "戴":
            "meaning": "to wear (a hat, gloves, glasses)"
  "zh-1478":
    "native": "gloves"
    "notes":
      "n1": "Gloves, worn on the hands in cold weather. 手 (shǒu) is hand."
    "examples":
      "手套在桌子上。": "The gloves are on the table."
      "冬天我戴手套。":
        "native": "In winter I wear gloves."
        "bases":
          "戴":
            "meaning": "to wear (a hat, gloves, glasses)"
  "zh-1479":
    "native": "tie; necktie"
    "notes":
      "n1": "A tie, worn around the neck with a shirt. 领 (lǐng) is the collar."
    "examples":
      "他戴领带。":
        "native": "He wears a tie."
        "bases":
          "戴":
            "meaning": "to wear (a hat, gloves, glasses)"
      "领带是红的。":
        "native": "The tie is red."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1480":
    "native": "pocket"
    "notes":
      "n1": "A pocket, in clothes or a bag. 口 (kǒu) is an opening, and 袋 (dài) is a bag."
    "examples":
      "钥匙在口袋里。": "The keys are in the pocket."
      "这件衣服有口袋。":
        "native": "This garment has pockets."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1481":
    "native": "button"
    "notes":
      "n1": "A button, which fastens clothes. 扣 (kòu) is to fasten."
    "examples":
      "扣子掉了。":
        "native": "A button has come off."
        "bases":
          "掉":
            "meaning": "to fall off; to drop"
          "了":
            "meaning": "a particle: a change has happened"
      "请把扣子扣好。":
        "native": "Please do up the buttons."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
          "扣":
            "meaning": "to fasten"
  "zh-1482":
    "native": "zip; zipper"
    "notes":
      "n1": "A zip, a fastener with teeth. 拉 (lā) is to pull."
    "examples":
      "拉链坏了。":
        "native": "The zip is broken."
        "bases":
          "坏":
            "meaning": "broken; bad"
          "了":
            "meaning": "a particle: a change has happened"
      "请拉上拉链。":
        "native": "Please do up the zip."
        "bases":
          "拉":
            "meaning": "to pull"
  "zh-1483":
    "native": "hanger"
    "notes":
      "n1": "A hanger, for hanging clothes. 架 (jià) is a frame."
    "examples":
      "衣架在柜子里。": "The hangers are in the cupboard."
      "请把衣服挂在衣架上。":
        "native": "Please hang the clothes on a hanger."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
          "挂":
            "meaning": "to hang"
  "zh-1484":
    "native": "colour"
    "notes":
      "n1": "The colour of a thing. 色 (sè) is colour."
    "examples":
      "你要什么颜色？":
        "native": "Which colour do you want?"
        "bases":
          "要":
            "meaning": "must; to want"
      "这个颜色很好看。": "This colour is very nice."
  "zh-1485":
    "native": "red"
    "notes":
      "n1": "The colour red. 红 (hóng) is red."
    "examples":
      "红色很漂亮。": "Red is very pretty."
      "她穿红色的裙子。":
        "native": "She wears a red skirt."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1486":
    "native": "blue"
    "notes":
      "n1": "The colour blue. 蓝 (lán) is blue."
    "examples":
      "蓝色的天很好。":
        "native": "The blue sky is lovely."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "我喜欢蓝色。": "I like blue."
  "zh-1487":
    "native": "green"
    "notes":
      "n1": "The colour green. 绿 (lǜ) is green."
    "examples":
      "绿色的树很多。":
        "native": "There are many green trees."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "绿色是我的颜色。":
        "native": "Green is my colour."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1488":
    "native": "yellow"
    "notes":
      "n1": "The colour yellow. 黄 (huáng) is yellow."
    "examples":
      "黄色的花很漂亮。":
        "native": "The yellow flowers are very pretty."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "香蕉是黄色的。":
        "native": "Bananas are yellow."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1489":
    "native": "white"
    "notes":
      "n1": "The colour white. 白 (bái) is white."
    "examples":
      "白色的衬衫很好看。":
        "native": "The white shirt is very nice."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "雪是白色的。":
        "native": "Snow is white."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1490":
    "native": "black"
    "notes":
      "n1": "The colour black. 黑 (hēi) is black."
    "examples":
      "黑色的鞋很好看。":
        "native": "The black shoes are very nice."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "他穿黑色的西装。":
        "native": "He wears a black suit."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1491":
    "native": "grey"
    "notes":
      "n1": "The colour grey, between white and black. 灰 (huī) is grey, like ash."
    "examples":
      "灰色的大衣很暖和。":
        "native": "The grey overcoat is very warm."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "天是灰色的。":
        "native": "The sky is grey."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1492":
    "native": "size (of clothes)"
    "notes":
      "n1": "The size of clothes, in numbers or letters. 尺 (chǐ) is a ruler, and 码 (mǎ) is a number."
    "examples":
      "你穿什么尺码？": "What size do you wear?"
      "这个尺码太小了。":
        "native": "This size is too small."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1493":
    "native": "to try on"
    "notes":
      "n1": "To try on clothes to see how they fit. 试 (shì) is to try."
    "examples":
      "我可以试穿吗？":
        "native": "May I try it on?"
        "bases":
          "可以":
            "meaning": "can; may"
      "请先试穿一下。":
        "native": "Please try it on first."
        "bases":
          "一下":
            "meaning": "a little; have a try"
  "zh-1494":
    "native": "fitting; suitable"
    "notes":
      "n1": "Fitting well, or suitable for a purpose. 合 (hé) is to fit together."
    "examples":
      "这件衣服很合适。": "This garment fits very well."
      "这双鞋不合适。": "These shoes do not fit."
  "zh-1495":
    "native": "style; design"
    "notes":
      "n1": "The style or design of clothes. 款 (kuǎn) is a style, and 式 (shì) is a form."
    "examples":
      "这个款式很新。": "This style is very new."
      "款式很多。": "There are many styles."
  "zh-1496":
    "native": "quality"
    "notes":
      "n1": "The quality of a thing, how good it is. 质 (zhì) is quality, and 量 (liàng) is amount."
    "examples":
      "质量很好。": "The quality is very good."
      "这个衬衫的质量不好。":
        "native": "The quality of this shirt is not good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1497":
    "native": "jeans"
    "notes":
      "n1": "Jeans, trousers of blue denim. 牛仔 (niúzǎi) is cowboy or denim."
    "examples":
      "我买了一条牛仔裤。":
        "native": "I bought a pair of jeans."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "条":
            "meaning": "the measure word for long things, such as trousers"
      "牛仔裤很舒服。": "Jeans are very comfortable."
  "zh-1498":
    "native": "suit"
    "notes":
      "n1": "A suit for work or a formal event. 西 (xī) is west, and 装 (zhuāng) is dress."
    "examples":
      "他穿西装。": "He wears a suit."
      "西装很贵。": "A suit is expensive."
  "zh-1499":
    "native": "fashionable"
    "notes":
      "n1": "Fashionable, in the latest style. 时 (shí) is time, and 尚 (shàng) is fashionable."
    "examples":
      "这件衣服很时尚。": "This garment is very fashionable."
      "她很时尚。": "She is very fashionable."
  "zh-1500":
    "native": "sleeve"
    "notes":
      "n1": "A sleeve of a shirt or coat. 袖 (xiù) is a sleeve."
    "examples":
      "袖子太长了。":
        "native": "The sleeves are too long."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "她把袖子卷起来。":
        "native": "She rolls up her sleeves."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
          "卷":
            "meaning": "to roll up"
          "起来":
            "meaning": "up"
  "zh-1501":
    "native": "pink"
    "notes":
      "n1": "The colour pink. 粉 (fěn) is powder or pink."
    "examples":
      "粉色的裙子很漂亮。":
        "native": "The pink skirt is very pretty."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "她喜欢粉色。": "She likes pink."
  "zh-1502":
    "native": "purple"
    "notes":
      "n1": "The colour purple. 紫 (zǐ) is purple."
    "examples":
      "紫色的花很好看。":
        "native": "The purple flowers are very nice."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "这件衬衫是紫色的。":
        "native": "This shirt is purple."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1503":
    "native": "brown"
    "notes":
      "n1": "The colour brown. 棕 (zōng) is brown."
    "examples":
      "棕色的鞋很好看。":
        "native": "The brown shoes are very nice."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "他穿棕色的外套。":
        "native": "He wears a brown coat."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
