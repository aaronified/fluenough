  "notes": "正在 (zhèngzài) before the verb and 呢 (ne) at the end show an action happening right now: 他正在看书呢 (tā zhèngzài kàn shū ne), he is reading a book. For the negative use 没在 (méi zài): 他没在看书呢 (tā méi zài kàn shū ne), he is not reading now. Do not use 了 (le) with 正在 (zhèngzài)."
