"cards":
  "zh-4824":
    "native": "I did not understand what the teacher said."
    "confusables":
      "w1":
        "why": "to hear a sound; not to understand the words"
      "w2":
        "why": "to hear every word clearly, which is not the same as understanding"
    "bases":
      "老师":
        "meaning": "teacher"
      "的":
        "meaning": "particle"
      "话":
        "meaning": "words; speech"
      "我":
        "meaning": "I"
      "没":
        "meaning": "not"
  "zh-4825":
    "native": "I finally found that book."
    "confusables":
      "w1":
        "why": "to look for, without the result of finding"
      "w2":
        "why": "to get hold of something, which may be a document or a prize"
    "bases":
      "我":
        "meaning": "I"
      "终于":
        "meaning": "finally"
      "了":
        "meaning": "completed-action particle"
  "zh-4826":
    "native": "After I finish the homework, I go for a walk."
    "confusables":
      "w1":
        "why": "to write something properly, not only to finish it"
      "w2":
        "why": "to complete a task, a more formal word"
    "bases":
      "我":
        "meaning": "I"
      "去":
        "meaning": "go"
  "zh-4827":
    "native": "After the guest walked in, everyone stood up."
    "confusables":
      "w1":
        "why": "to stand, without the upward movement"
      "w2":
        "why": "to sit down, the opposite movement"
    "bases":
      "客人":
        "meaning": "guest"
      "大家":
        "meaning": "everyone"
      "都":
        "meaning": "all; both"
      "了":
        "meaning": "completed-action particle"
  "zh-4828":
    "native": "That cup was broken by him."
    "confusables":
      "w1":
        "why": "to fall and break into pieces, which needs a fall"
      "w2":
        "why": "to bump into something and damage it"
    "bases":
      "被":
        "meaning": "passive marker"
      "他":
        "meaning": "he"
      "了":
        "meaning": "completed-action particle"
  "zh-4829":
    "native": "The weather got better, so we went out to play."
    "confusables":
      "w1":
        "why": "a change, as a noun; not a verb with a result"
      "w2":
        "why": "to change something on purpose, with a direction"
    "bases":
      "了":
        "meaning": "completed-action particle"
      "出去":
        "meaning": "go out"
  "zh-4830":
    "native": "He left a note behind."
    "confusables":
      "w1":
        "why": "to keep or to leave, without the sense of staying behind"
      "w2":
        "why": "to be left over, of things not taken"
    "bases":
      "他":
        "meaning": "he"
      "了":
        "meaning": "completed-action particle"
      "张":
        "meaning": "measure for flat things"
      "纸条":
        "meaning": "note"
  "zh-4831":
    "native": "I threw away all these old things."
    "confusables":
      "w1":
        "why": "to throw, without the sense of gone for good"
      "w2":
        "why": "to lose something, not to throw it away on purpose"
    "bases":
      "这些":
        "meaning": "these"
      "我":
        "meaning": "I"
      "都":
        "meaning": "all; both"
      "了":
        "meaning": "completed-action particle"
