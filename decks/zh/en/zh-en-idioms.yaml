"cards":
  "zh-4322":
    "native": "wholeheartedly; single-mindedly"
    "notes":
      "n1": "一心一意 (yī xīn yí yì) means with one heart and one purpose. The 一 is pronounced yí before a fourth tone. Its opposite is 三心二意 (sān xīn èr yì), to be unsure and keep changing one's mind."
    "examples":
      "她一心一意地准备考试。":
        "native": "She prepares for the exam with her whole heart."
        "bases":
          "地":
            "meaning": "adverb marker"
      "他做事一心一意，从不分心。":
        "native": "He works single-mindedly and never loses focus."
        "bases":
          "做事":
            "meaning": "to do things, to work"
          "从不":
            "meaning": "never"
          "分心":
            "meaning": "to be distracted"
  "zh-4323":
    "native": "of two minds; hesitant and undecided"
    "notes":
      "n1": "三心二意 (sān xīn èr yì) means to be unsure and keep changing one's mind. It is said of someone who cannot commit. Compare 一心一意 (yī xīn yí yì), wholeheartedly."
    "examples":
      "别三心二意了，快做决定吧。":
        "native": "Stop wavering and make a decision."
        "bases":
          "了":
            "meaning": "particle"
      "他买了又退，真是三心二意。":
        "native": "He buys it and then returns it; he really cannot make up his mind."
        "bases":
          "了":
            "meaning": "completed action"
          "退":
            "meaning": "to return goods"
          "真是":
            "meaning": "really"
  "zh-4324":
    "native": "to give up halfway"
    "notes":
      "n1": "半途而废 (bàn tú ér fèi) means to stop halfway through a task. 途 (tú) is the road and 而 (ér) links the two halves. It is said of a task that is left unfinished."
    "examples":
      "学外语不能半途而废。":
        "native": "You cannot give up halfway when you learn a foreign language."
        "bases":
          "不能":
            "meaning": "cannot"
      "这个项目才做了一半，他就半途而废了。":
        "native": "He quit this project after only half the work was done."
        "bases":
          "这个":
            "meaning": "this"
          "才":
            "meaning": "only"
          "了":
            "meaning": "completed action"
  "zh-4325":
    "native": "to spoil by adding what is not needed"
    "notes":
      "n1": "画蛇添足 (huà shé tiān zú) comes from a story: after drawing a snake, a man adds feet to it and loses the prize. It means to spoil something by adding what it does not need."
    "examples":
      "这篇文章已经很好了，不必再画蛇添足。":
        "native": "This article is already good, so there is no need to spoil it with more."
        "bases":
          "这篇":
            "meaning": "this (article)"
          "文章":
            "meaning": "article"
          "了":
            "meaning": "particle"
          "不必":
            "meaning": "no need"
      "他的设计本来很简单，后来加了很多装饰，真是画蛇添足。":
        "native": "His design was simple at first, but after he added many decorations it was spoiled."
        "bases":
          "的":
            "meaning": "of"
          "设计":
            "meaning": "design"
          "本来":
            "meaning": "originally"
          "后来":
            "meaning": "later"
          "了":
            "meaning": "completed action"
          "很多":
            "meaning": "many"
          "真是":
            "meaning": "really"
  "zh-4326":
    "native": "to mend the pen after losing a sheep; better late than never"
    "notes":
      "n1": "亡羊补牢 (wáng yáng bǔ láo) means to repair the sheep pen after a sheep has been lost. It means it is not too late to fix a problem now, so the same loss does not happen again."
    "examples":
      "出了问题就要亡羊补牢，别等到损失更大。":
        "native": "When a problem appears, fix it now, and do not wait until the loss is bigger."
        "bases":
          "了":
            "meaning": "completed action"
          "要":
            "meaning": "should"
          "等到":
            "meaning": "until"
          "损失":
            "meaning": "loss"
      "他虽然晚了点，但是亡羊补牢，还来得及。":
        "native": "He is a little late, but it is not too late to fix it, so there is still time."
        "bases":
          "虽然":
            "meaning": "although"
          "了":
            "meaning": "completed action"
          "但是":
            "meaning": "but"
          "来得及":
            "meaning": "in time"
  "zh-4327":
    "native": "to wait for luck instead of working"
    "notes":
      "n1": "守株待兔 (shǒu zhū dài tù) comes from a story about a farmer who waits by a tree stump for another rabbit to run into it. It is said of someone who waits for luck instead of working."
    "examples":
      "不努力工作，只是守株待兔，是不会成功的。":
        "native": "Without hard work, just waiting for luck will not bring success."
        "bases":
          "只是":
            "meaning": "merely"
          "不会":
            "meaning": "will not"
          "的":
            "meaning": "particle"
      "他每天在路边等，希望有好运气，这就是守株待兔。":
        "native": "He waits by the road every day, hoping for good luck; this is exactly waiting for luck."
        "bases":
          "每天":
            "meaning": "every day"
          "路边":
            "meaning": "roadside"
          "有":
            "meaning": "to have"
          "运气":
            "meaning": "luck"
          "就是":
            "meaning": "is exactly"
  "zh-4328":
    "native": "to talk to someone who cannot understand"
    "notes":
      "n1": "对牛弹琴 (duì niú tán qín) means to explain something to someone who cannot understand it, so the effort is wasted. It can be said of a listener who lacks the background."
    "examples":
      "跟他讲这些理论，简直是对牛弹琴。":
        "native": "Explaining these theories to him is simply wasted effort."
        "bases":
          "跟":
            "meaning": "to, with"
          "这些":
            "meaning": "these"
          "理论":
            "meaning": "theory"
          "简直":
            "meaning": "simply"
      "孩子还小，给他讲这么难的道理，就像对牛弹琴。":
        "native": "The child is still small; explaining such a hard principle to him is like playing to a cow."
        "bases":
          "给":
            "meaning": "to"
          "这么":
            "meaning": "so"
          "的":
            "meaning": "particle"
          "就像":
            "meaning": "like"
  "zh-4329":
    "native": "self-contradictory"
    "notes":
      "n1": "自相矛盾 (zì xiāng máo dùn) means to say two things that cannot both be true. It comes from a seller who praised his shield as unbreakable and his spear as unstoppable. 矛 (máo) is a spear and 盾 (dùn) a shield."
    "examples":
      "他前面说要去，后面又说不去，真是自相矛盾。":
        "native": "First he says he will go, then he says he will not; he really contradicts himself."
        "bases":
          "要":
            "meaning": "to want"
          "不去":
            "meaning": "not to go"
          "真是":
            "meaning": "really"
      "这份报告一会儿说成功，一会儿说失败，自相矛盾。":
        "native": "This report says it succeeded, then it says it failed; it contradicts itself."
        "bases":
          "这份":
            "meaning": "this (document)"
          "一会儿":
            "meaning": "a moment"
  "zh-4330":
    "native": "a frog in a well; a narrow view"
    "notes":
      "n1": "井底之蛙 (jǐng dǐ zhī wā) is a frog at the bottom of a well, which thinks the sky is only as big as the mouth of the well. It describes someone with a narrow view who knows little of the wider world."
    "examples":
      "他从来没出国，有时候像井底之蛙。":
        "native": "He has never been abroad, and sometimes he is like a frog in a well."
        "bases":
          "没":
            "meaning": "not"
          "出国":
            "meaning": "to go abroad"
          "有时候":
            "meaning": "sometimes"
          "像":
            "meaning": "like"
      "我们要多读书、多旅行，不要做井底之蛙。":
        "native": "We should read more and travel more; we should not be frogs in a well."
        "bases":
          "要":
            "meaning": "should"
          "不要":
            "meaning": "should not"
  "zh-4331":
    "native": "a loss may turn out to be a gain"
    "notes":
      "n1": "塞翁失马 (sài wēng shī mǎ) comes from a story of an old man whose horse ran away, then came back with another horse. It means a loss may turn out to be good luck, and the other way round."
    "examples":
      "虽然这次考试没通过，但是塞翁失马，我找到了真正的兴趣。":
        "native": "I did not pass this exam, but a loss can be a gain: I found a real interest."
        "bases":
          "虽然":
            "meaning": "although"
          "这次":
            "meaning": "this time"
          "没":
            "meaning": "not"
          "但是":
            "meaning": "but"
          "找到":
            "meaning": "to find"
          "了":
            "meaning": "completed action"
          "真正":
            "meaning": "real"
          "的":
            "meaning": "of"
      "一场大雨让计划取消了，结果我们有了意外的收获，真是塞翁失马。":
        "native": "A heavy rain cancelled our plan, but as a result we had an unexpected gain; it really was a loss that became a gain."
        "bases":
          "一场":
            "meaning": "a (rain)"
          "让":
            "meaning": "to make"
          "了":
            "meaning": "completed action"
          "结果":
            "meaning": "as a result"
          "有":
            "meaning": "to have"
          "意外":
            "meaning": "unexpected"
          "的":
            "meaning": "of"
          "真是":
            "meaning": "really"
  "zh-4332":
    "native": "to fool oneself"
    "notes":
      "n1": "掩耳盗铃 (yǎn ěr dào líng) means to cover one's own ears while stealing a bell, thinking that if one cannot hear it, others cannot either. It means to fool oneself."
    "examples":
      "他明明知道自己错了，还不承认，这就是掩耳盗铃。":
        "native": "He clearly knows he is wrong, yet he will not admit it; this is fooling himself."
        "bases":
          "明明":
            "meaning": "clearly"
          "了":
            "meaning": "particle"
          "就是":
            "meaning": "is exactly"
      "他把垃圾藏在床底下，以为没人看见，真是掩耳盗铃。":
        "native": "He hides the rubbish under the bed, thinking nobody sees it; he really is fooling himself."
        "bases":
          "把":
            "meaning": "(object marker)"
          "床底下":
            "meaning": "under the bed"
          "以为":
            "meaning": "to think"
          "没":
            "meaning": "not"
          "真是":
            "meaning": "really"
  "zh-4333":
    "native": "to cling to an old method and fail to adapt"
    "notes":
      "n1": "刻舟求剑 (kè zhōu qiú jiàn) comes from a story of a man who marked his boat where his sword fell into the river, then searched for the sword at that mark after the boat had moved. It means to be rigid and unable to adapt."
    "examples":
      "时代变了，我们的做法也要变，不能刻舟求剑。":
        "native": "Times have changed, so our methods must change too; we cannot cling to the old ways."
        "bases":
          "时代":
            "meaning": "era"
          "变":
            "meaning": "to change"
          "了":
            "meaning": "particle"
          "的":
            "meaning": "of"
          "做法":
            "meaning": "method"
          "要":
            "meaning": "must"
          "不能":
            "meaning": "cannot"
      "老师还用十年前的教材上课，这就是刻舟求剑。":
        "native": "The teacher still teaches with a textbook from ten years ago; this is clinging to the old way."
        "bases":
          "用":
            "meaning": "to use"
          "十年":
            "meaning": "ten years"
          "的":
            "meaning": "of"
          "教材":
            "meaning": "textbook"
          "就是":
            "meaning": "is exactly"
  "zh-4334":
    "native": "all theory and no practice"
    "notes":
      "n1": "纸上谈兵 (zhǐ shàng tán bīng) means to talk about war on paper, without real experience. It is used for plans that look good in theory but fail in practice."
    "examples":
      "他的方案写得很漂亮，但是没有实际经验，只是纸上谈兵。":
        "native": "His plan is nicely written, but he has no practical experience; it is only theory."
        "bases":
          "的":
            "meaning": "of"
          "得":
            "meaning": "particle"
          "但是":
            "meaning": "but"
          "没有":
            "meaning": "not have"
          "实际":
            "meaning": "practical"
          "只是":
            "meaning": "merely"
      "这些建议都是纸上谈兵，没有人真正试过。":
        "native": "These suggestions are all theory; nobody has really tried them."
        "bases":
          "这些":
            "meaning": "these"
          "没有":
            "meaning": "not have"
          "真正":
            "meaning": "really"
  "zh-4335":
    "native": "to say one loves something one does not really want"
    "notes":
      "n1": "叶公好龙 (yè gōng hào lóng) comes from a story of a duke who loved dragons, painted them everywhere, then was terrified when a real dragon came to see him. It means to say one loves something while not truly wanting it."
    "examples":
      "他说很喜欢运动，可是从来不去锻炼，真是叶公好龙。":
        "native": "He says he loves sport, but he never goes to exercise; he really loves dragons only on paper."
        "bases":
          "可是":
            "meaning": "but"
          "不去":
            "meaning": "never go"
          "真是":
            "meaning": "really"
      "他天天说要学画画，却一次都没去过美术班，真是叶公好龙。":
        "native": "He says every day that he wants to learn painting, yet he has never once been to an art class."
        "bases":
          "天天":
            "meaning": "every day"
          "要":
            "meaning": "to want"
          "却":
            "meaning": "but"
          "一次":
            "meaning": "once"
          "没":
            "meaning": "not"
          "美术班":
            "meaning": "art class"
          "真是":
            "meaning": "really"
  "zh-4336":
    "native": "to ruin a thing by forcing it to grow"
    "notes":
      "n1": "拔苗助长 (bá miáo zhù zhǎng) comes from a story of a farmer who pulled up his young shoots to help them grow, and killed them. It means to hurt a thing by forcing it to grow too fast."
    "examples":
      "父母总想让孩子马上会说外语，这是拔苗助长。":
        "native": "Parents always want their child to speak a foreign language at once; this is forcing growth."
        "bases":
          "总":
            "meaning": "always"
          "让":
            "meaning": "to let"
          "会":
            "meaning": "can"
      "他刚开始跑步，就每天跑二十公里，这样身体会受伤，就是拔苗助长。":
        "native": "He has just started running and runs twenty kilometres a day; his body will be hurt, which is forcing growth."
        "bases":
          "每天":
            "meaning": "every day"
          "这样":
            "meaning": "like this"
          "会":
            "meaning": "will"
          "就是":
            "meaning": "is exactly"
  "zh-4337":
    "native": "needless fear from imagined danger"
    "notes":
      "n1": "杯弓蛇影 (bēi gōng shé yǐng) comes from a story of a man who saw a snake's reflection in a cup of wine and fell ill with fear. It describes groundless fear caused by imagining danger."
    "examples":
      "房间里没有虫子，你别杯弓蛇影了。":
        "native": "There are no insects in the room; stop imagining things."
        "bases":
          "没有":
            "meaning": "there is no"
          "了":
            "meaning": "particle"
      "他听到一点声音就以为有人跟踪他，真是杯弓蛇影。":
        "native": "He hears a small sound and thinks someone is following him; he really is frightened by shadows."
        "bases":
          "听到":
            "meaning": "to hear"
          "一点":
            "meaning": "a bit"
          "以为":
            "meaning": "to think"
          "有":
            "meaning": "there is"
          "跟踪":
            "meaning": "to follow"
          "真是":
            "meaning": "really"
  "zh-4338":
    "native": "to comfort oneself with an illusion"
    "notes":
      "n1": "望梅止渴 (wàng méi zhǐ kě) comes from a story of soldiers too thirsty to march, whose commander said a plum grove was just ahead. The thought of plums eased their thirst. It describes comfort taken in an imagined hope."
    "examples":
      "我们只能望梅止渴，等待明天的消息。":
        "native": "We can only comfort ourselves with hope while we wait for tomorrow's news."
        "bases":
          "只能":
            "meaning": "can only"
          "的":
            "meaning": "of"
      "没有钱买房子，他常常看房子照片，这只是望梅止渴。":
        "native": "He has no money to buy a house, so he often looks at photos of houses; this is only comfort in illusion."
        "bases":
          "没有":
            "meaning": "not have"
          "只是":
            "meaning": "merely"
  "zh-4339":
    "native": "to bully others by borrowing someone's power"
    "notes":
      "n1": "狐假虎威 (hú jiǎ hǔ wēi) comes from a story of a fox that walks behind a tiger and frightens the other animals with the tiger's power. It describes someone who uses another person's power to intimidate."
    "examples":
      "他仗着老板的关系，在办公室里狐假虎威。":
        "native": "He relies on his boss's connections and bullies people in the office."
        "bases":
          "仗着":
            "meaning": "to rely on"
          "的":
            "meaning": "of"
      "小弟借着哥哥的名字到处欺负人，真是狐假虎威。":
        "native": "The younger brother uses his older brother's name to bully people everywhere; he really is a fox in a tiger's skin."
        "bases":
          "小弟":
            "meaning": "younger brother"
          "借着":
            "meaning": "to use"
          "的":
            "meaning": "of"
          "到处":
            "meaning": "everywhere"
          "欺负":
            "meaning": "to bully"
          "真是":
            "meaning": "really"
  "zh-4340":
    "native": "a bird scared by a bow; someone easily frightened"
    "notes":
      "n1": "惊弓之鸟 (jīng gōng zhī niǎo) is a bird so frightened by a bow that it flies at the slightest sound. It describes someone who is easily alarmed after a shock."
    "examples":
      "出了事故以后，他变成了惊弓之鸟，一听见车声就紧张。":
        "native": "After the accident he became easily frightened, and at the sound of a car he got nervous."
        "bases":
          "了":
            "meaning": "completed action"
          "一听见":
            "meaning": "as soon as one hears"
          "车声":
            "meaning": "sound of a car"
      "他被老板骂过一次，就像惊弓之鸟，每次进办公室都很害怕。":
        "native": "He was scolded once by his boss, and like a frightened bird he is afraid every time he enters the office."
        "bases":
          "被":
            "meaning": "passive marker"
          "一次":
            "meaning": "once"
          "就像":
            "meaning": "like"
          "每次":
            "meaning": "every time"
  "zh-4341":
    "native": "to pass for a skill one does not have"
    "notes":
      "n1": "滥竽充数 (làn yú chōng shù) comes from a story of a man who could not play the reed organ but pretended to play in an orchestra. It means to fill a place with no real ability."
    "examples":
      "他不会弹琴，只是在乐队里滥竽充数。":
        "native": "He cannot play an instrument; he is only filling a place in the band."
        "bases":
          "不会":
            "meaning": "cannot"
          "弹琴":
            "meaning": "to play an instrument"
          "只是":
            "meaning": "merely"
      "这个团队里有些人没有能力，只是滥竽充数。":
        "native": "Some people in this team lack the ability; they are only filling a place."
        "bases":
          "这个":
            "meaning": "this"
          "有些":
            "meaning": "some"
          "没有":
            "meaning": "not have"
          "只是":
            "meaning": "merely"
  "zh-4342":
    "native": "to follow a guide rigidly without thinking"
    "notes":
      "n1": "按图索骥 (àn tú suǒ jì) means to look for a horse by following a picture of it. It describes someone who follows a guide rigidly and cannot adapt to what is really there."
    "examples":
      "他只会按图索骥，遇到新情况就不知道怎么办。":
        "native": "He can only follow the guide; when a new situation comes, he does not know what to do."
        "bases":
          "只会":
            "meaning": "can only"
          "情况":
            "meaning": "situation"
          "办":
            "meaning": "to handle"
      "他用旧地图按图索骥，结果走错了路。":
        "native": "He follows an old map rigidly and takes the wrong road."
        "bases":
          "用":
            "meaning": "to use"
          "结果":
            "meaning": "as a result"
          "走错":
            "meaning": "to take the wrong way"
          "了":
            "meaning": "completed action"
  "zh-4343":
    "native": "to copy others and lose one's own way"
    "notes":
      "n1": "邯郸学步 (hán dān xué bù) comes from a story of a young man who went to Handan to learn how people walked there, forgot his own way, and had to crawl home. It warns against copying others and losing one's own style."
    "examples":
      "你应该有自己的风格，不要邯郸学步。":
        "native": "You should have your own style and not copy others."
        "bases":
          "有":
            "meaning": "to have"
          "的":
            "meaning": "of"
          "不要":
            "meaning": "should not"
      "他总是学别人说话，结果失去了自己的个性，这就是邯郸学步。":
        "native": "He always copies how others talk, and as a result he has lost his own personality; this is copying and losing one's way."
        "bases":
          "说话":
            "meaning": "to speak"
          "结果":
            "meaning": "as a result"
          "失去":
            "meaning": "to lose"
          "了":
            "meaning": "completed action"
          "的":
            "meaning": "of"
          "个性":
            "meaning": "personality"
          "就是":
