"cards":
  "zh-3022":
    "confusables":
      "w1":
        "why": "报道 (bàodào) is a report, a longer piece."
      "w2":
        "why": "消息 (xiāoxi) is a piece of news, a general word."
    "bases":
      "的":
        "meaning": "of"
    "native": "Today's news is very important."
  "zh-3023":
    "confusables":
      "w1":
        "why": "编辑 (biānjí) is an editor, a different job."
      "w2":
        "why": "读者 (dúzhě) is a reader, the other side."
    "bases":
      "了":
        "meaning": "a particle"
    "native": "The reporter interviewed the expert."
  "zh-3024":
    "confusables":
      "w1":
        "why": "统计 (tǒngjì) is statistics, a counting method."
      "w2":
        "why": "失败 (shībài) is to fail, a different result."
    "bases":
      "显示":
        "meaning": "to show"
    "native": "The data show the economy is growing."
  "zh-3025":
    "confusables":
      "w1":
        "why": "法律 (fǎlǜ) is a law, which is fixed."
      "w2":
        "why": "公布 (gōngbù) is to announce, which is close."
    "bases":
      "了":
        "meaning": "a particle"
      "的":
        "meaning": "of"
    "native": "The government announced a new policy."
  "zh-3026":
    "confusables":
      "w1":
        "why": "事件 (shìjiàn) is an event, a wider word."
      "w2":
        "why": "冲突 (chōngtū) is a clash, a different kind of event."
    "bases":
      "起":
        "meaning": "measure word for incidents"
      "严重":
        "meaning": "serious"
    "native": "This accident is very serious."
  "zh-3027":
    "confusables":
      "w1":
        "why": "外交 (wàijiāo) is diplomacy, a way to keep peace."
      "w2":
        "why": "政治 (zhèngzhì) is politics, a wider field."
    "bases":
      "比":
        "meaning": "than"
    "native": "Peace is better than war."
  "zh-3028":
    "confusables":
      "w1":
        "why": "直播 (zhíbō) is a live broadcast, not a recorded video."
      "w2":
        "why": "节目 (jiémù) is a programme, a broader word."
    "bases":
      "热门":
        "meaning": "popular"
    "native": "This video is very popular on the website."
  "zh-3029":
    "confusables":
      "w1":
        "why": "就业 (jiùyè) is to find work, the opposite."
      "w2":
        "why": "经济 (jīngjì) is the economy, a larger idea."
    "bases":
      "的":
        "meaning": "of"
    "native": "Many people are unemployed."
