  "notes": "A bare command with 你 (nǐ) is blunt. 请 (qǐng) before the verb makes it a polite request: 请等一下 (qǐng děng yíxià), please wait a moment. To ask a favour of someone you respect, open with 麻烦 (máfan), sorry to trouble you, and use 您 (nín), the polite you: 麻烦您等一下 (máfan nín děng yíxià). 一下 (yíxià) after the verb makes the request short and light: a moment, a little. 请 (qǐng) alone is enough for a guest or a customer; add 麻烦 (máfan) and 您 (nín) for a stranger, an elder or a favour that costs effort. Do not say 请 (qǐng) to a close friend for something small: it sounds distant."
