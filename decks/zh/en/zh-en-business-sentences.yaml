"cards":
  "zh-3524":
    "confusables":
      "w1":
        "why": "利润 (lìrùn) is profit, a different number."
      "w2":
        "why": "成本 (chéngběn) is the cost to make it, a different number."
    "bases":
      "的":
        "meaning": "of"
    "native": "Our product is of very good quality, and the price is not expensive."
  "zh-3525":
    "confusables":
      "w1":
        "why": "亏损 (kuīsǔn) is a loss, the opposite."
      "w2":
        "why": "利润 (lìrùn) is profit, a close word."
    "bases":
      "了":
        "meaning": "a particle"
    "native": "The company made a profit this year, and income has increased."
  "zh-3526":
    "confusables":
      "w1":
        "why": "出口 (chūkǒu) is to export, the opposite."
      "w2":
        "why": "采购 (cǎigòu) is to purchase, a close act."
    "bases":
      "要":
        "meaning": "to want"
      "签":
        "meaning": "to sign"
      "机器":
        "meaning": "machine"
    "native": "We will sign the contract, and then import the machines."
  "zh-3527":
    "confusables":
      "w1":
        "why": "商品 (shāngpǐn) is goods, a wider word."
      "w2":
        "why": "供应 (gōngyìng) is to supply, a related act."
    "bases":
      "不够":
        "meaning": "not enough"
      "了":
        "meaning": "a particle"
    "native": "There are many orders, and the stock is not enough."
  "zh-3528":
    "confusables":
      "w1":
        "why": "缩小 (suōxiǎo) is to shrink, the opposite."
      "w2":
        "why": "推广 (tuīguǎng) is to promote, a close act."
    "bases":
      "要":
        "meaning": "to want"
    "native": "He wants to expand the market and also do marketing."
  "zh-3529":
    "confusables":
      "w1":
        "why": "保证 (bǎozhèng) is to guarantee, the other side."
      "w2":
        "why": "协议 (xiéyì) is an agreement, which is broken here."
    "bases":
      "要":
        "meaning": "to want"
      "损失":
        "meaning": "loss"
    "native": "Breaking the contract means paying for the loss."
  "zh-3530":
    "confusables":
      "w1":
        "why": "消费 (xiāofèi) is to spend, the act rather than the person."
      "w2":
        "why": "顾客 (gùkè) is a customer, a close word."
    "bases":
      "关心":
        "meaning": "to care about"
      "和":
        "meaning": "and"
    "native": "Consumers care a lot about credit and honesty."
  "zh-3531":
    "confusables":
      "w1":
        "why": "版权 (bǎnquán) is copyright, a different right."
      "w2":
        "why": "品牌 (pǐnpái) is a brand, a wider idea."
    "bases":
      "的":
        "meaning": "of"
      "和":
        "meaning": "and"
    "native": "Our patents and trademarks are both very well known."
