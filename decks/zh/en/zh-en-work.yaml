"id": "zh-en-work"
"kind": "layer"
"core": "zh-work"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Work"
"description": "Thirty-five words for work: the company and the office, the boss and the people who work for one, jobs such as engineer, lawyer and nurse, the meeting, the email and the contract, and the verbs for working. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0644":
    "native": "company"
    "notes":
      "n1": "公司 (gōngsī) is 'company'. It is used for a business of any size. 工作 (gōngzuò) is the work itself, not the place."
    "examples":
      "我们公司很大。": "Our company is big."
      "你们公司很忙吗？": "Is your company busy?"
  "zh-0645":
    "native": "office"
    "notes":
      "n1": "办公室 (bàngōngshì) is 'office', the room where people work at desks. 在 (zài) before it says where you are."
    "examples":
      "办公室很安静。": "The office is quiet."
      "我在办公室。": "I am in the office."
  "zh-0646":
    "native": "boss; owner"
    "notes":
      "n1": "老板 (lǎobǎn) is 'boss', the owner or head of a business. 老师 (lǎoshī) is 'teacher', a different word."
    "examples":
      "老板很忙。": "The boss is busy."
      "你是老板吗？": "Are you the boss?"
  "zh-0647":
    "native": "factory"
    "notes":
      "n1": "工厂 (gōngchǎng) is 'factory'. In 他在工厂工作 (tā zài gōngchǎng gōngzuò), 在 (zài) shows where he works."
    "examples":
      "工厂很大。": "The factory is big."
      "他在工厂工作。": "He works in a factory."
  "zh-0648":
    "native": "engineer"
    "notes":
      "n1": "工程师 (gōngchéngshī) is 'engineer'. After 是 (shì), a job is named with no measure word: 他是工程师 (tā shì gōngchéngshī), he is an engineer."
    "examples":
      "他是工程师。": "He is an engineer."
      "你姐姐是工程师吗？": "Is your older sister an engineer?"
  "zh-0649":
    "native": "lawyer"
    "notes":
      "n1": "律师 (lǜshī) is 'lawyer'. The vowel of lǜ is the one written ü in pinyin."
    "examples":
      "我朋友是律师。": "My friend is a lawyer."
      "律师很忙吗？": "Is the lawyer busy?"
  "zh-0650":
    "native": "nurse"
    "notes":
      "n1": "护士 (hùshi) is 'nurse'. The second syllable is neutral, so it is said short and light: hùshi."
    "examples":
      "护士很累。": "The nurse is tired."
      "她是护士。": "She is a nurse."
  "zh-0651":
    "native": "driver"
    "notes":
      "n1": "司机 (sījī) is 'driver', of a car, a bus or a taxi."
    "examples":
      "司机很忙。": "The driver is busy."
      "你是司机吗？": "Are you a driver?"
  "zh-0652":
    "native": "cook; chef"
    "notes":
      "n1": "厨师 (chúshī) is 'cook', someone who cooks food as a job. 做饭 (zuò fàn) is to cook a meal, as anyone does at home."
    "examples":
      "他是厨师。": "He is a cook."
      "厨师很累吗？": "Is the cook tired?"
  "zh-0653":
    "native": "police officer"
    "notes":
      "n1": "警察 (jǐngchá) is 'police officer', and also 'the police' as a group."
    "examples":
      "警察很忙。": "The police officer is busy."
      "他是警察吗？": "Is he a police officer?"
  "zh-0654":
    "native": "farmer"
    "notes":
      "n1": "农民 (nóngmín) is 'farmer', a person who works the land."
    "examples":
      "农民很累。": "The farmer is tired."
      "我弟弟是农民。": "My younger brother is a farmer."
  "zh-0655":
    "native": "secretary"
    "notes":
      "n1": "秘书 (mìshū) is 'secretary', the person who helps a boss at the office with papers and calls."
    "examples":
      "秘书很忙。": "The secretary is busy."
      "你是秘书吗？": "Are you a secretary?"
  "zh-0656":
    "native": "meeting"
    "notes":
      "n1": "会议 (huìyì) is 'meeting', a formal gathering to discuss something. 开会 (kāihuì) is the verb for having one."
    "examples":
      "会议很长。": "The meeting is long."
      "会议几点？": "What time is the meeting?"
  "zh-0657":
    "native": "to have a meeting"
    "notes":
      "n1": "开会 (kāihuì) is 'to have a meeting', one verb. Its noun is 会议 (huìyì)."
    "examples":
      "我们今天开会。": "We have a meeting today."
      "你明天开会吗？": "Do you have a meeting tomorrow?"
  "zh-0658":
    "native": "computer"
    "notes":
      "n1": "电脑 (diànnǎo) is 'computer'."
    "examples":
      "电脑很好。": "The computer is good."
      "电脑在办公室。": "The computer is in the office."
  "zh-0659":
    "native": "document; file"
    "notes":
      "n1": "文件 (wénjiàn) is 'document' or 'file', on paper or on a computer."
    "examples":
      "文件很多。": "The documents are many."
      "你写文件吗？": "Do you write documents?"
  "zh-0660":
    "native": "email; mail"
    "notes":
      "n1": "邮件 (yóujiàn) is 'email', and also 'post' or 'mail' sent by letter. 看 (kàn) is 'to read' with it."
    "examples":
      "我看邮件。": "I read emails."
      "你看邮件吗？": "Do you read emails?"
  "zh-0661":
    "native": "salary"
    "notes":
      "n1": "工资 (gōngzī) is 'salary', the money paid each month for work. 钱 (qián) is 'money' in general."
    "examples":
      "工资很好。": "The salary is good."
      "工资很高吗？": "Is the salary high?"
  "zh-0662":
    "native": "hard; tiring"
    "notes":
      "n1": "辛苦 (xīnkǔ) is 'hard' and 'tiring', said of work or a journey. It describes the effort, not the person's character."
    "examples":
      "你很辛苦。": "You work hard."
      "工作很辛苦吗？": "Is the work tiring?"
  "zh-0663":
    "native": "hard-working; diligent"
    "notes":
      "n1": "努力 (nǔlì) is 'hard-working' and 'diligent', of a person who tries hard in work or study."
    "examples":
      "他很努力。": "He is hard-working."
      "你很努力吗？": "Are you hard-working?"
  "zh-0664":
    "native": "to go on a business trip"
    "notes":
      "n1": "出差 (chūchāi) is 'to go on a business trip', away from the office for work."
    "examples":
      "我明天出差。": "I go on a business trip tomorrow."
      "他今天出差吗？": "Is he going on a business trip today?"
  "zh-0665":
    "native": "to work overtime"
    "notes":
      "n1": "加班 (jiābān) is 'to work overtime', extra hours after the working day. 下班 (xiàbān) is leaving work."
    "examples":
      "我们今天加班。": "We work overtime today."
      "你常常加班吗？": "Do you often work overtime?"
  "zh-0666":
    "native": "business; trade"
    "notes":
      "n1": "生意 (shēngyi) is 'business', buying and selling. 做生意 (zuò shēngyi) is to do business."
    "examples":
      "他做生意。": "He does business."
      "生意很好吗？": "Is business good?"
  "zh-0667":
    "native": "to make a phone call"
    "notes":
      "n1": "打电话 (dǎdiànhuà) is 'to make a phone call'. 电话 (diànhuà) alone is 'telephone'."
    "examples":
      "我打电话。": "I make a phone call."
      "你明天打电话吗？": "Will you make a phone call tomorrow?"
  "zh-0668":
    "native": "job interview"
    "notes":
      "n1": "面试 (miànshì) is 'interview', the meeting in which an employer asks a candidate questions."
    "examples":
      "我明天面试。": "I have an interview tomorrow."
      "面试很难吗？": "Is the interview hard?"
  "zh-0669":
    "native": "guest; customer"
    "notes":
      "n1": "客人 (kèrén) is 'guest', and also a customer in a shop or restaurant."
    "examples":
      "他是客人。": "He is a guest."
      "客人很忙吗？": "Is the guest busy?"
  "zh-0670":
    "native": "client; customer"
    "notes":
      "n1": "客户 (kèhù) is 'client', a business that buys from a company. 客人 (kèrén) is a guest or a shop customer."
    "examples":
      "他是客户。": "He is a client."
      "客户很累吗？": "Is the client tired?"
  "zh-0671":
    "native": "contract"
    "notes":
      "n1": "合同 (hétong) is 'contract', a written agreement that both sides sign."
    "examples":
      "合同很长。": "The contract is long."
      "你看合同吗？": "Do you read the contract?"
  "zh-0672":
    "native": "superior; boss"
    "notes":
      "n1": "上司 (shàngsi) is 'one's superior at work'. 老板 (lǎobǎn) is the owner or head of the business."
    "examples":
      "上司很忙。": "The superior is busy."
      "他是上司吗？": "Is he your superior?"
  "zh-0673":
    "native": "civil servant"
    "notes":
      "n1": "公务员 (gōngwùyuán) is 'civil servant', a person who works for the government."
    "examples":
      "他是公务员。": "He is a civil servant."
      "公务员很忙吗？": "Are civil servants busy?"
  "zh-0674":
    "native": "to manage"
    "notes":
      "n1": "管理 (guǎnlǐ) is 'to manage' a company, an office or people."
    "examples":
      "他管理公司。": "He manages the company."
      "你管理办公室吗？": "Do you manage the office?"
  "zh-0675":
    "native": "to take part in; to attend"
    "notes":
      "n1": "参加 (cānjiā) is 'to take part in' or 'to attend', a meeting, a class or a race."
    "examples":
      "我参加会议。": "I attend the meeting."
      "你们明天参加面试吗？": "Are you attending the interview tomorrow?"
  "zh-0676":
    "native": "to complete; to finish"
    "notes":
      "n1": "完成 (wánchéng) is 'to complete' a task, such as a piece of work."
    "examples":
      "我完成工作。": "I finish the work."
      "你明天完成吗？": "Will you finish it tomorrow?"
  "zh-0677":
    "native": "on time"
    "notes":
      "n1": "准时 (zhǔnshí) is 'on time', at the hour that was set."
    "examples":
      "他很准时。": "He is on time."
      "会议很准时吗？": "Is the meeting on time?"
  "zh-0678":
    "native": "report"
    "notes":
      "n1": "报告 (bàogào) is 'report', a written account of work. As a verb it is 'to report'."
    "examples":
      "报告很长。": "The report is long."
      "你写报告吗？": "Do you write reports?"
