"name": "出来 (chūlai): come out, bring out, or work out"
"license": "CC-BY-SA-4.0"
"description": "出来 (chūlai) after a verb means that something is brought out, found or worked out by the action: 我想出来了 (wǒ xiǎng chūlai le), I have thought of it. Not yet checked by a Mandarin speaker: please report any mistake."
"tags":
- "unreviewed"
"pattern":
  "name": "出来 (chūlai): come out, bring out, or work out"
  "slot_name": "form"
  "prompt": "{lemma} ({gloss}), {slot}"
  "slots":
    "plain": "a plain statement"
    "result": "the verb followed by 出来 (chūlai): thought of, found, or said out"
    "result-not": "出来 (chūlai) with 没 (méi): not yet found or worked out"
  "entries":
    "xiang": "to think"
    "zhao": "to look for"
    "xie": "to write"
    "shuo2": "to say"
  "notes": "出来 (chūlai) after a verb can mean that something is found, thought of or said out: 我想出办法了 (wǒ xiǎng chū bànfǎ le), I have thought of a way. To say it has not happened yet, put 没 (méi) before the verb: 我还没找出答案 (wǒ hái méi zhǎo chū dá'àn), I have not found the answer yet. The verb and 出 (chū) can be separated by an object, as in 写出了一个故事 (xiě chū le yí ge gùshi)."
