"cards":
  "zh-2692":
    "native": "printer"
    "notes":
      "n1": "A machine that prints paper. 打 (dǎ) is to make, 印 (yìn) is to print, and 机 (jī) is a machine."
    "examples":
      "打印机坏了。":
        "native": "The printer is broken."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "请用这台打印机。":
        "native": "Please use this printer."
        "bases":
          "用":
            "meaning": "to use"
  "zh-2693":
    "native": "to photocopy"
    "notes":
      "n1": "To make a copy of a paper. 复 (fù) is again, and 印 (yìn) is to print."
    "examples":
      "我复印了一份文件。":
        "native": "I photocopied a document."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "请帮我复印这些资料。":
        "native": "Please copy these materials for me."
        "bases":
          "这些":
            "meaning": "these"
          "资料":
            "meaning": "material; data"
  "zh-2694":
    "native": "fax"
    "notes":
      "n1": "A copy of a paper sent down a phone line. 传 (chuán) is to pass on, and 真 (zhēn) is true."
    "examples":
      "请发传真给我。":
        "native": "Please fax it to me."
        "bases":
          "给":
            "meaning": "to give; for"
      "传真机在前台。":
        "native": "The fax machine is at the front desk."
        "bases":
          "传真机":
            "meaning": "fax machine"
  "zh-2695":
    "native": "project"
    "notes":
      "n1": "A piece of work with a plan and a goal. 项 (xiàng) is an item, and 目 (mù) is a goal."
    "examples":
      "这个项目很重要。": "This project is very important."
      "项目已经开始了。":
        "native": "The project has already started."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2696":
    "native": "target; goal"
    "notes":
      "n1": "The aim you are working towards. 目 (mù) is an eye, and 标 (biāo) is a mark."
    "examples":
      "我们的目标是什么？":
        "native": "What is our goal?"
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "目标完成了。":
        "native": "The target has been reached."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2697":
    "native": "progress"
    "notes":
      "n1": "How far a piece of work has got. 进 (jìn) is to advance, and 度 (dù) is a degree."
    "examples":
      "项目的进度很快。":
        "native": "The project is progressing quickly."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "请告诉我进度。": "Please tell me the progress."
  "zh-2698":
    "native": "performance; results"
    "notes":
      "n1": "The results of work. 业 (yè) is work, and 绩 (jì) is a result."
    "examples":
      "他的业绩很好。":
        "native": "His performance is very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "今年的业绩不错。":
        "native": "This year's results are not bad."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "不错":
            "meaning": "not bad"
  "zh-2699":
    "native": "to resign"
    "notes":
      "n1": "To leave a job by your own choice. 辞 (cí) is to leave, and 职 (zhí) is a post."
    "examples":
      "他辞职了。":
        "native": "He has resigned."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "我想辞职。": "I want to resign."
  "zh-2700":
    "native": "CV; resume"
    "notes":
      "n1": "A short written account of your work and study. 简 (jiǎn) is brief, and 历 (lì) is a history."
    "examples":
      "请发一份简历。": "Please send a CV."
      "他的简历很好看。":
        "native": "His CV looks very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2701":
    "native": "to recruit"
    "notes":
      "n1": "To look for people to hire. 招 (zhāo) is to recruit, and 聘 (pìn) is to employ."
    "examples":
      "公司在招聘员工。": "The company is recruiting staff."
      "他们招聘了三个人。":
        "native": "They recruited three people."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2702":
    "native": "training"
    "notes":
      "n1": "Teaching for a job. 培 (péi) is to cultivate, and 训 (xùn) is to train."
    "examples":
      "我们有新员工培训。":
        "native": "We have training for new staff."
        "bases":
          "有":
            "meaning": "to have; there is"
      "培训很有用。":
        "native": "The training is very useful."
        "bases":
          "有用":
            "meaning": "useful"
  "zh-2703":
    "native": "position; post"
    "notes":
      "n1": "A job in an organisation. 职 (zhí) is a post, and 位 (wèi) is a position."
    "examples":
      "这个职位很好。": "This post is very good."
      "他申请了一个新职位。":
        "native": "He applied for a new post."
        "bases":
          "申请":
            "meaning": "to apply"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2704":
    "native": "department"
    "notes":
      "n1": "A part of a company. 部 (bù) is a section, and 门 (mén) is a door."
    "examples":
      "我在销售部门。": "I am in the sales department."
      "这个部门很大。": "This department is very big."
  "zh-2705":
    "native": "assistant"
    "notes":
      "n1": "A person who helps a boss. 助 (zhù) is to help, and 理 (lǐ) is to manage."
    "examples":
      "她是我的助理。":
        "native": "She is my assistant."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "助理帮我准备资料。":
        "native": "The assistant helps me prepare the materials."
        "bases":
          "资料":
            "meaning": "material; data"
  "zh-2706":
    "native": "to get a pay rise"
    "notes":
      "n1": "To be paid more money for the same work. 加 (jiā) is to add, and 薪 (xīn) is a salary."
    "examples":
      "他下个月加薪。": "He gets a pay rise next month."
      "公司不给加薪。":
        "native": "The company does not give pay rises."
        "bases":
          "给":
            "meaning": "to give; for"
  "zh-2707":
    "native": "subordinate"
    "notes":
      "n1": "Someone who works under you. 下 (xià) is below, and 属 (shǔ) is to belong to."
    "examples":
      "他有五个下属。":
        "native": "He has five staff under him."
        "bases":
          "有":
            "meaning": "to have; there is"
      "下属要听上司的话。":
        "native": "Subordinates should listen to the boss."
        "bases":
          "要":
            "meaning": "must; to want"
          "的":
            "meaning": "a particle: of; belonging to"
          "话":
            "meaning": "words; speech"
  "zh-2708":
    "native": "to take leave"
    "notes":
      "n1": "To take time off from work. 休 (xiū) is to rest, and 假 (jià) is leave."
    "examples":
      "我下周休假。": "I am on leave next week."
      "他休假去了海边。":
        "native": "He went to the seaside on holiday."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2709":
    "native": "to be late"
    "notes":
      "n1": "To arrive after the time you should. 迟 (chí) is late, and 到 (dào) is to arrive."
    "examples":
      "他今天迟到了。":
        "native": "He was late today."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "不要迟到。":
        "native": "Do not be late."
        "bases":
          "不要":
            "meaning": "do not"
  "zh-2710":
    "native": "to leave early"
    "notes":
      "n1": "To leave before the end of work. 早 (zǎo) is early, and 退 (tuì) is to leave."
    "examples":
      "他早退了一个小时。":
        "native": "He left an hour early."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "不能早退。":
        "native": "You cannot leave early."
        "bases":
          "能":
            "meaning": "can; may"
  "zh-2711":
    "native": "attendance record"
    "notes":
      "n1": "The record of when staff arrive and leave. 考 (kǎo) is to check, and 勤 (qín) is diligence."
    "examples":
      "考勤表在门口。":
        "native": "The attendance sheet is at the door."
        "bases":
          "考勤表":
            "meaning": "attendance sheet"
      "请每天打考勤。":
        "native": "Please clock in and out every day."
        "bases":
          "每天":
            "meaning": "every day"
  "zh-2712":
    "native": "finance"
    "notes":
      "n1": "The money side of a company. 财 (cái) is money, and 务 (wù) is affairs."
    "examples":
      "财务部在三楼。":
        "native": "The finance department is on the third floor."
        "bases":
          "财务部":
            "meaning": "finance department"
      "财务报告很重要。": "The financial report is important."
  "zh-2713":
    "native": "to sell"
    "notes":
      "n1": "To sell goods or services. 销 (xiāo) is to sell off, and 售 (shòu) is to sell."
    "examples":
      "他负责销售。": "He is in charge of sales."
      "这个产品销售很好。": "This product sells very well."
  "zh-2714":
    "native": "advertisement"
    "notes":
      "n1": "A message to sell something. 广 (guǎng) is wide, and 告 (gào) is to tell."
    "examples":
      "我们要做一个广告。":
        "native": "We are going to make an advertisement."
        "bases":
          "要":
            "meaning": "must; to want"
      "这个广告很有意思。":
        "native": "This advertisement is very interesting."
        "bases":
          "有":
            "meaning": "to have; there is"
          "意思":
            "meaning": "meaning; interest"
  "zh-2715":
    "native": "plan; proposal"
    "notes":
      "n1": "A written plan for a task. 方 (fāng) is a way, and 案 (àn) is a case."
    "examples":
      "请写一个方案。": "Please write a proposal."
      "这个方案可以吗？":
        "native": "Is this plan acceptable?"
        "bases":
          "可以":
            "meaning": "can; may"
  "zh-2716":
    "native": "budget"
    "notes":
      "n1": "The amount of money planned for a project. 预 (yù) is in advance, and 算 (suàn) is to calculate."
    "examples":
      "预算不够了。":
        "native": "The budget is not enough."
        "bases":
          "不够":
            "meaning": "not enough"
          "了":
            "meaning": "a particle: a change has happened"
      "我们要控制预算。":
        "native": "We must control the budget."
        "bases":
          "要":
            "meaning": "must; to want"
          "控制":
            "meaning": "to control"
  "zh-2717":
    "native": "cost"
    "notes":
      "n1": "The money spent to make something. 成 (chéng) is to make, and 本 (běn) is a base."
    "examples":
      "成本太高了。":
        "native": "The cost is too high."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "降低成本很重要。":
        "native": "Lowering costs is important."
        "bases":
          "降低":
            "meaning": "to lower"
  "zh-2718":
    "native": "profit"
    "notes":
      "n1": "The money left after costs. 利 (lì) is profit, and 润 (rùn) is moisture or gain."
    "examples":
      "这个月的利润很高。":
        "native": "This month's profit is high."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "利润下降了。":
        "native": "The profit has fallen."
        "bases":
          "下降":
            "meaning": "to fall"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2719":
    "native": "product"
    "notes":
      "n1": "Something that a company makes or sells. 产 (chǎn) is to produce, and 品 (pǐn) is a thing."
    "examples":
      "这个产品很好用。":
        "native": "This product is easy to use."
        "bases":
          "好用":
            "meaning": "easy to use"
      "新产品下个月上市。":
        "native": "The new product goes on sale next month."
        "bases":
          "上市":
            "meaning": "to go on sale"
  "zh-2720":
    "native": "warehouse"
    "notes":
      "n1": "A large building for storing goods. 仓 (cāng) is a granary, and 库 (kù) is a store."
    "examples":
      "货放在仓库里。":
        "native": "The goods are kept in the warehouse."
        "bases":
          "货":
            "meaning": "goods"
      "仓库很大。": "The warehouse is very big."
  "zh-2721":
    "native": "logistics"
    "notes":
      "n1": "The movement of goods from maker to buyer. 物 (wù) is goods, and 流 (liú) is flow."
    "examples":
      "物流公司很快。": "The logistics company is very fast."
      "这个包裹的物流很慢。":
        "native": "The delivery of this parcel is very slow."
        "bases":
          "包裹":
            "meaning": "parcel"
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2722":
    "native": "to cooperate"
    "notes":
      "n1": "To work together. 合 (hé) is together, and 作 (zuò) is to do."
    "examples":
      "我们合作得很好。":
        "native": "We are cooperating very well."
        "bases":
          "得":
            "meaning": "a particle: how it is done"
      "希望以后继续合作。":
        "native": "We hope to keep working together."
        "bases":
          "继续":
            "meaning": "to continue"
  "zh-2723":
    "native": "to negotiate"
    "notes":
      "n1": "To discuss to reach an agreement. 谈 (tán) is to talk, and 判 (pàn) is to judge."
    "examples":
      "我们在谈判。": "We are negotiating."
      "谈判很难。": "The negotiation is difficult."
  "zh-2724":
    "native": "to sign"
    "notes":
      "n1": "To write your name on a paper. 签 (qiān) is to sign, and 字 (zì) is a character."
    "examples":
      "请在这里签字。":
        "native": "Please sign here."
        "bases":
          "这里":
            "meaning": "here"
      "合同已经签字了。":
        "native": "The contract has been signed."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2725":
    "native": "team"
    "notes":
      "n1": "A group of people working together. 团 (tuán) is a group, and 队 (duì) is a team."
    "examples":
      "我们是一个团队。": "We are one team."
      "团队很努力。": "The team works very hard."
  "zh-2726":
    "native": "leader"
    "notes":
      "n1": "The person who leads a group. 领 (lǐng) is to lead, and 导 (dǎo) is to guide."
    "examples":
      "领导来了。":
        "native": "The leader has come."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "我的领导很严格。":
        "native": "My leader is very strict."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2727":
    "native": "staff; employee"
    "notes":
      "n1": "A person who works for a company. 员 (yuán) is a member, and 工 (gōng) is work."
    "examples":
      "公司有三百名员工。":
        "native": "The company has three hundred staff."
        "bases":
          "有":
            "meaning": "to have; there is"
          "名":
            "meaning": "measure word for people"
      "新员工今天来了。":
        "native": "The new staff member came today."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2728":
    "native": "meeting room"
    "notes":
      "n1": "A room for meetings. 会 (huì) is to meet, 议 (yì) is to discuss, and 室 (shì) is a room."
    "examples":
      "会议室在三楼。": "The meeting room is on the third floor."
      "会议室里很安静。": "The meeting room is very quiet."
  "zh-2729":
    "native": "salary; pay"
    "notes":
      "n1": "The money you are paid for work. 薪 (xīn) is a salary, and 水 (shui) is water."
    "examples":
      "他的薪水很高。":
        "native": "His salary is very high."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "薪水每月发一次。": "The salary is paid once a month."
  "zh-2730":
    "native": "bonus"
    "notes":
      "n1": "Extra money given for good work. 奖 (jiǎng) is a prize, and 金 (jīn) is money."
    "examples":
      "今年有奖金。":
        "native": "There is a bonus this year."
        "bases":
          "有":
            "meaning": "to have; there is"
      "他拿到了奖金。":
        "native": "He got the bonus."
        "bases":
          "拿到":
            "meaning": "to get"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2731":
    "native": "benefits"
    "notes":
      "n1": "Extras that a company gives its staff. 福 (fú) is good fortune, and 利 (lì) is benefit."
    "examples":
      "公司的福利很好。":
        "native": "The company's benefits are very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "有什么福利？":
        "native": "What benefits are there?"
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-2732":
    "native": "front desk; reception"
    "notes":
      "n1": "The desk at the front of an office. 前 (qián) is front, and 台 (tái) is a table."
    "examples":
      "请去前台问一下。":
        "native": "Please ask at the front desk."
        "bases":
          "一下":
            "meaning": "a little while"
      "前台在一楼。": "The reception is on the first floor."
  "zh-2733":
    "native": "meeting room for guests"
    "notes":
      "n1": "A room to meet visitors. 会 (huì) is to meet, 客 (kè) is a guest, and 室 (shì) is a room."
    "examples":
      "客人在会客室等你。": "The guest is waiting for you in the meeting room."
      "会客室很干净。": "The meeting room is very clean."
  "zh-2734":
    "native": "entry control; access card"
    "notes":
      "n1": "The system that controls who can enter a building. 门 (mén) is a door, and 禁 (jìn) is to forbid."
    "examples":
      "门禁卡丢了。":
        "native": "I have lost my access card."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "请刷门禁卡。":
        "native": "Please swipe your access card."
        "bases":
          "刷":
            "meaning": "to swipe"
  "zh-2735":
    "native": "to be at work"
    "notes":
      "n1": "To come to work on a day. 出 (chū) is to go out, and 勤 (qín) is work."
    "examples":
      "今天他出勤了。":
        "native": "He came to work today."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "今天出勤的人很多。":
        "native": "Many people came to work today."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2736":
    "native": "end of the year"
    "notes":
      "n1": "The last part of the year, when work is reviewed. 年 (nián) is year, and 终 (zhōng) is the end."
    "examples":
      "年终要做总结。":
        "native": "A summary is needed at year end."
        "bases":
          "要":
            "meaning": "must; to want"
          "总结":
            "meaning": "summary"
      "年终会议在下午。": "The year-end meeting is in the afternoon."
