"cards":
  "zh-3262":
    "confusables":
      "w1":
        "why": "护照 (hùzhào) is a passport, a document you need."
      "w2":
        "why": "护照 (hùzhào) is a passport, a document, not a form."
    "bases":
      "表":
        "meaning": "form; table"
    "native": "Please process the paperwork; this is the application form."
  "zh-3263":
    "confusables":
      "w1":
        "why": "关 (guān) is to close, the end of the hours."
      "w2":
        "why": "开 (kāi) is to open, the start of the hours."
    "bases":
      "到":
        "meaning": "to arrive; to reach"
    "native": "What time do the opening hours end?"
  "zh-3264":
    "confusables":
      "w1":
        "why": "借 (jiè) is to borrow, a different act."
      "w2":
        "why": "卖 (mài) is to sell, the opposite of buying."
    "bases":
      "要":
        "meaning": "to need"
      "不要":
        "meaning": "do not"
    "native": "I want to withdraw money, not deposit it."
  "zh-3265":
    "confusables":
      "w1":
        "why": "钱包 (qiánbāo) is a wallet, not a receipt."
      "w2":
        "why": "电话 (diànhuà) is a call, a different thing."
    "bases":
      "给":
        "meaning": "to give; for"
      "和":
        "meaning": "and"
    "native": "Please give me the receipt and the invoice."
  "zh-3266":
    "confusables":
      "w1":
        "why": "修理 (xiūlǐ) is to repair, a close word."
      "w2":
        "why": "坏 (huài) is broken, the state before repair."
    "bases":
      "的":
        "meaning": "of"
    "native": "My computer needs repairing."
  "zh-3267":
    "confusables":
      "w1":
        "why": "银行 (yínháng) is a bank, a different place."
      "w2":
        "why": "电梯 (diàntī) is a lift, a different place."
    "native": "Please wait at the counter; the queue ticket is very important."
  "zh-3268":
    "confusables":
      "w1":
        "why": "付款 (fùkuǎn) is to pay, a different act."
      "w2":
        "why": "问 (wèn) is to ask, a simpler act."
    "bases":
      "要":
        "meaning": "to need"
      "了":
        "meaning": "a particle"
    "native": "I want to complain, this parcel is broken."
  "zh-3269":
    "confusables":
      "w1":
        "why": "买 (mǎi) is to buy, which comes after the trial."
      "w2":
        "why": "下载 (xiàzài) is to download, a different step."
    "native": "I would like to try this app."
