"cards":
  "zh-3810":
    "confusables":
      "w1":
        "why": "回家 (huíjiā) is to go home, a different place."
      "w2":
        "why": "来 (lái) is to come, a different direction."
    "native": "As soon as class ends, I leave."
  "zh-3811":
    "confusables":
      "w1":
        "why": "出发 (chūfā) is to set off, which comes before arriving."
      "w2":
        "why": "走 (zǒu) is to leave, a different action."
    "bases":
      "到":
        "meaning": "to arrive"
    "native": "As soon as he arrives, he eats."
  "zh-3812":
    "confusables":
      "w1":
        "why": "喝 (hē) is to drink, a different act."
      "w2":
        "why": "学习 (xuéxí) is to study, which is a different task."
    "native": "I eat first, and then I work."
  "zh-3813":
    "confusables":
      "w1":
        "why": "起床 (qǐchuáng) is to get up, which comes after sleeping."
      "w2":
        "why": "休息 (xiūxi) is to rest, a related state."
    "native": "He has a bath first, and then sleeps."
  "zh-3814":
    "confusables":
      "w1":
        "why": "晴 (qíng) is sunny, the opposite of rain."
      "w2":
        "why": "出门 (chūmén) is to go out, the opposite of going home."
    "bases":
      "了":
        "meaning": "a particle"
    "native": "It is raining, so I will go home."
  "zh-3815":
    "confusables":
      "w1":
        "why": "休息 (xiūxi) is to rest, a different state."
      "w2":
        "why": "睡觉 (shuìjiào) is to sleep, the opposite of getting up."
    "native": "As soon as we get up, we set off."
  "zh-3816":
    "confusables":
      "w1":
        "why": "听 (tīng) is to listen, a different act."
      "w2":
        "why": "买 (mǎi) is to buy, a different act."
    "native": "First read the book, and then write the homework."
  "zh-3817":
    "confusables":
      "w1":
        "why": "听 (tīng) is to listen, which comes before laughing."
      "w2":
        "why": "难过 (nánguò) is sad, the opposite feeling."
    "native": "As soon as I speak, he laughs."
