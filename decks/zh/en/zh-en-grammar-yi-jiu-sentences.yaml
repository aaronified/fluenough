  "name": "English"
"name": "一 (yī) ... 就 (jiù) and 先 (xiān) ... 然后 (ránhòu): as soon as, and first ... then"
"description": "Sentences that link two actions in order: 一下课我就走 (as soon as class ends, I leave), and 先吃饭 (xiān chīfàn)，然后工作 (first eat, then work). Not yet checked by a Mandarin speaker: please report any mistake."
