schema: 1
id: "zh-en-grammar-de-sentences"
kind: "layer"
core: "zh-grammar-de-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "的 (de) in sentences"
license: "CC-BY-SA-4.0"
description: "Six sentences that say whose a thing is and what it is like: my book, the teacher's book, a very good book. Not yet checked by a Mandarin speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "zh-0624":
    "native": "This is my book."
    "confusables":
      "w1":
        "why": "那 (nà) would say that: that is my book."
      "w2":
        "why": "你 (nǐ) would say you: this is your book."
    "bases":
      "的": { "meaning": "particle: joins the owner to the thing, as my or of" }
  "zh-0625":
    "native": "This is the teacher's book."
    "confusables":
      "w1":
        "why": "那 (nà) would say that: that is the teacher's book."
      "w2":
        "why": "学生 (xuésheng) would say student: this is the student's book."
    "bases":
      "的": { "meaning": "particle: joins the owner to the thing, as the teacher's or of the teacher" }
  "zh-0626":
    "native": "My friend is a teacher."
    "confusables":
      "w1":
        "why": "你 (nǐ) would say you: your friend is a teacher."
      "w2":
        "why": "学生 (xuésheng) would say student, not teacher."
    "bases":
      "的": { "meaning": "particle: joins the owner to the thing, as my or of" }
  "zh-0627":
    "native": "Our room is very big."
    "confusables":
      "w1":
        "why": "他 (tā) would say he: his room is very big."
      "w2":
        "why": "小 (xiǎo) would say small, the opposite of big."
    "bases":
      "的": { "meaning": "particle: joins the owner to the thing, as our or of" }
  "zh-0628":
    "native": "This is a very good book."
    "confusables":
      "w1":
        "why": "那 (nà) would say that: that is a very good book."
      "w2":
        "why": "大 (dà) would say big: a big book, not a good one."
    "bases":
      "的": { "meaning": "particle: joins the describing words to the noun" }
  "zh-0629":
    "native": "Your room is very quiet."
    "confusables":
      "w1":
        "why": "我 (wǒ) would say I: my room is very quiet."
      "w2":
        "why": "吵 (chǎo) would say noisy, the opposite of quiet."
    "bases":
      "的": { "meaning": "particle: joins the owner to the thing, as your or of" }
