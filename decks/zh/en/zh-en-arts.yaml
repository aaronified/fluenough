          "的":
            "meaning": "of"
          "有力":
            "meaning": "powerful"
  "zh-3763":
    "native": "composition"
    "notes":
      "n1": "How the parts of a picture are arranged. 构 (gòu) is to build, and 图 (tú) is a picture."
