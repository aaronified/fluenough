"cards":
  "zh-3746":
    "native": "art"
    "notes":
      "n1": "Works made to show beauty or feeling. 艺 (yì) is skill, and 术 (shù) is technique."
    "examples":
      "他很喜欢艺术。": "He loves art."
      "艺术很有意思。":
        "native": "Art is very interesting."
        "bases":
          "有":
            "meaning": "to have; there is"
          "意思":
            "meaning": "meaning; interest"
  "zh-3747":
    "native": "painter"
    "notes":
      "n1": "A person who paints. 画 (huà) is to paint, and 家 (jiā) is a person who does something."
    "examples":
      "她是画家。": "She is a painter."
      "这位画家很有名。": "This painter is very famous."
  "zh-3748":
    "native": "to paint; to draw"
    "notes":
      "n1": "To make a picture with a brush or pen. 画 (huà) is to draw or a picture."
    "examples":
      "我会画画。":
        "native": "I can paint."
        "bases":
          "会":
            "meaning": "can; to know how to"
      "他在画一幅画。":
        "native": "He is painting a picture."
        "bases":
          "幅":
            "meaning": "measure word for paintings"
  "zh-3749":
    "native": "sculpture"
    "notes":
      "n1": "A work of art cut or shaped from stone or metal. 雕 (diāo) is to carve, and 塑 (sù) is to mould."
    "examples":
      "公园里有一个雕塑。":
        "native": "There is a sculpture in the park."
        "bases":
          "有":
            "meaning": "to have; there is"
      "这个雕塑很大。": "This sculpture is very big."
  "zh-3750":
    "native": "calligraphy and painting"
    "notes":
      "n1": "Writing and painting as an art. 书 (shū) is writing, and 画 (huà) is painting."
    "examples":
      "他擅长书画。":
        "native": "He is good at calligraphy and painting."
        "bases":
          "擅长":
            "meaning": "to be good at"
      "书画展览很好看。": "The calligraphy and painting exhibition is very nice to see."
  "zh-3751":
    "native": "brush (for writing or painting)"
    "notes":
      "n1": "A brush made of animal hair. 毛 (máo) is hair, and 笔 (bǐ) is a pen."
    "examples":
      "用毛笔写字。":
        "native": "Write with a brush."
        "bases":
          "用":
            "meaning": "to use"
      "这支毛笔很好。":
        "native": "This brush is very good."
        "bases":
          "支":
            "meaning": "measure word for pens and brushes"
  "zh-3752":
    "native": "ink"
    "notes":
      "n1": "The black ink used for writing and painting. 墨 (mò) is ink."
    "examples":
      "墨很黑。": "The ink is very black."
      "用墨要适量。":
        "native": "Use the right amount of ink."
