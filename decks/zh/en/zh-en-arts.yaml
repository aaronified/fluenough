          "用":
            "meaning": "to use"
          "要":
            "meaning": "to want"
          "适量":
            "meaning": "in the right amount"
  "zh-3753":
    "native": "photographer"
    "notes":
      "n1": "A person who takes photos or films professionally. 摄 (shè) is to take, 影 (yǐng) is an image, and 师 (shī) is a master."
    "examples":
      "他是摄影师。": "He is a photographer."
      "摄影师拍了很多照片。":
        "native": "The photographer took many photos."
        "bases":
          "拍":
            "meaning": "to shoot (a photo or film)"
          "了":
            "meaning": "a particle"
  "zh-3754":
    "native": "exhibition"
    "notes":
      "n1": "A show of works for people to see. 展 (zhǎn) is to display, and 览 (lǎn) is to view."
    "examples":
      "这个展览很好。": "This exhibition is very good."
      "展览什么时候开始？": "When does the exhibition start?"
  "zh-3755":
    "native": "exhibition (event)"
    "notes":
      "n1": "A large event where things are shown. 展览 (zhǎnlǎn) is an exhibition, and 会 (huì) is an event."
    "examples":
      "我们去看展览会。": "We are going to the exhibition."
      "展览会很大。": "The exhibition is very big."
  "zh-3756":
    "native": "exhibit"
    "notes":
      "n1": "A thing shown in an exhibition. 展 (zhǎn) is to show, and 品 (pǐn) is a thing."
    "examples":
      "这件展品很贵。": "This exhibit is very expensive."
      "展品很多。": "There are many exhibits."
  "zh-3757":
    "native": "work (of art or writing)"
    "notes":
      "n1": "A piece of art, writing or music. 作 (zuò) is to make, and 品 (pǐn) is a thing."
    "examples":
      "这是他的作品。":
        "native": "This is his work."
        "bases":
          "的":
            "meaning": "of"
      "作品很有意思。":
        "native": "The work is very interesting."
        "bases":
          "有":
            "meaning": "to have; there is"
          "意思":
            "meaning": "meaning; interest"
  "zh-3758":
    "native": "to create"
    "notes":
      "n1": "To make a new work of art. 创 (chuàng) is to create, and 作 (zuò) is to make."
    "examples":
      "他在创作一首歌。":
        "native": "He is creating a song."
        "bases":
          "首":
            "meaning": "measure word for poems and songs"
      "创作需要灵感。": "Creating takes inspiration."
  "zh-3759":
    "native": "inspiration"
    "notes":
      "n1": "A sudden good idea for making art. 灵 (líng) is spirit, and 感 (gǎn) is feeling."
    "examples":
      "我有了灵感。":
        "native": "I have had an inspiration."
        "bases":
          "有":
            "meaning": "to have; there is"
          "了":
            "meaning": "a particle"
      "灵感来自生活。":
        "native": "Inspiration comes from life."
        "bases":
          "生活":
            "meaning": "life"
  "zh-3760":
    "native": "style"
    "notes":
      "n1": "The way a work looks or sounds. 风 (fēng) is manner, and 格 (gé) is a type."
    "examples":
      "这位画家的风格很独特。":
