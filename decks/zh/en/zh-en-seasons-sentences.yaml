"cards":
  "zh-1450":
    "confusables":
      "w1":
        "why": "冷 (lěng) is cold, the opposite of good weather here."
      "w2":
        "why": "热 (rè) is hot, a different weather."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "The spring weather is very good."
  "zh-1451":
    "confusables":
      "w1":
        "why": "春天 (chūntiān) is spring, a mild season."
      "w2":
        "why": "秋天 (qiūtiān) is autumn, with cool winds."
    "native": "Summer is very hot, and winter is very cold."
  "zh-1452":
    "confusables":
      "w1":
        "why": "开花 (kāihuā) is to bloom, the spring event."
      "w2":
        "why": "下雪 (xiàxuě) is to snow, a winter event."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
      "落":
        "meaning": "to fall"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "In autumn the leaves have fallen."
  "zh-1453":
    "confusables":
      "w1":
        "why": "干燥 (gānzào) is dry, the opposite of damp."
      "w2":
        "why": "晴 (qíng) is clear and sunny, the opposite of rain."
    "native": "It is raining today, and it is damp."
  "zh-1454":
    "confusables":
      "w1":
        "why": "阴天 (yīntiān) is a cloudy day, not sunny."
      "w2":
        "why": "暴雨 (bàoyǔ) is a heavy rain, not sunny."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "On sunny days I go to the park."
  "zh-1455":
    "confusables":
      "w1":
        "why": "月亮 (yuèliang) is the moon, which shines at night."
      "w2":
        "why": "夜 (yè) is night, when the sun is gone."
    "bases":
      "出来":
        "meaning": "to come out"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "The sun has come out."
  "zh-1456":
    "confusables":
      "w1":
        "why": "草 (cǎo) is grass, not a flower."
      "w2":
        "why": "树叶 (shùyè) is tree leaves, not flowers."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "She likes the spring flowers."
  "zh-1457":
    "confusables":
      "w1":
        "why": "温度 (wēndù) is temperature, not a feeling of wind."
      "w2":
        "why": "凉快 (liángkuai) is cool, a state of the air."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "The wind of this season is very comfortable."
