"cards":
  "zh-2737":
    "confusables":
      "w1":
        "why": "下属 (xiàshǔ) is someone under you, not your boss."
      "w2":
        "why": "领导 (lǐngdǎo) is a leader, a general word."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
      "有":
        "meaning": "to have; there is"
    "native": "My boss says there is a meeting tomorrow."
  "zh-2738":
    "confusables":
      "w1":
        "why": "休假 (xiūjià) is to take leave, which ends later."
      "w2":
        "why": "迟到 (chídào) is to be late, a different thing."
    "bases":
      "要":
        "meaning": "must; to want"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "He is going to resign."
  "zh-2739":
    "confusables":
      "w1":
        "why": "目标 (mùbiāo) is a goal, not how far it has got."
      "w2":
        "why": "预算 (yùsuàn) is a budget, a different number."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "The project is moving quickly."
  "zh-2740":
    "confusables":
      "w1":
        "why": "复印 (fùyìn) is to copy, a different action."
      "w2":
        "why": "传真 (chuánzhēn) is a fax, a different machine."
    "bases":
      "这里":
        "meaning": "here"
    "native": "Please sign here."
  "zh-2741":
    "confusables":
      "w1":
        "why": "员工 (yuángōng) is a staff member, one person."
      "w2":
        "why": "部门 (bùmén) is a department, a part of a company."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "Our team works very hard."
  "zh-2742":
    "confusables":
      "w1":
        "why": "奖金 (jiǎngjīn) is a bonus, extra money."
      "w2":
        "why": "利润 (lìrùn) is profit, which a company earns."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "His salary is very high."
  "zh-2743":
    "confusables":
      "w1":
        "why": "产品 (chǎnpǐn) is a product, the thing being sold."
      "w2":
        "why": "方案 (fāng'àn) is a plan, not an advert."
    "bases":
      "有":
        "meaning": "to have; there is"
      "意思":
        "meaning": "meaning; interest"
    "native": "The advertisement is very interesting."
  "zh-2744":
    "confusables":
      "w1":
        "why": "上班 (shàngbān) is to start work, the opposite."
      "w2":
        "why": "仓库 (cāngkù) is a warehouse, a different place."
    "bases":
      "取":
        "meaning": "to collect"
      "资料":
        "meaning": "material; data"
    "native": "After work I go to the front desk to collect the materials."
