"schema": 1
"id": "zh-en-illness"
"kind": "layer"
"core": "zh-illness"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Illness and medicine"
"description": "Forty words for being ill: the common illnesses and symptoms, the doctor and the clinic, the tablets and the doses, and the words on a medicine label. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-2169":
    "native": "to be ill; to fall ill"
    "notes":
      "n1": "To be ill, not in good health. 生 (shēng) is to be born or become, and 病 (bìng) is an illness."
    "examples":
      "我生病了。":
        "native": "I am ill."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "他常常生病。": "He often falls ill."
  "zh-2170":
    "native": "cold; flu"
    "notes":
      "n1": "A cold, an infection of the nose and throat. 感 (gǎn) is to feel or catch, and 冒 (mào) is to rise."
    "examples":
      "我感冒了。":
        "native": "I have a cold."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "感冒很难受。":
        "native": "A cold is very unpleasant."
        "bases":
          "难受":
            "meaning": "uncomfortable"
  "zh-2171":
    "native": "to have a fever"
    "notes":
      "n1": "To have a high temperature, with a fever. 发 (fā) is to give out, and 烧 (shāo) is to burn or be hot."
    "examples":
      "孩子发烧了。":
        "native": "The child has a fever."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "我发烧了，很热。":
        "native": "I have a fever and I am very hot."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2172":
    "native": "to cough"
    "notes":
      "n1": "To cough, to push air out of the throat. 咳 (ké) is to cough."
    "examples":
      "他咳嗽得很厉害。":
        "native": "He coughs badly."
        "bases":
          "得":
            "meaning": "a particle after a verb: how it is done"
          "厉害":
            "meaning": "awful; severe"
      "夜里他咳嗽。": "At night he coughs."
  "zh-2173":
    "native": "to have diarrhoea"
    "notes":
      "n1": "To have loose bowels, diarrhoea. 拉 (lā) is to pull, here to pass out, and 肚子 (dùzi) is the stomach."
    "examples":
      "我拉肚子了。":
        "native": "I have diarrhoea."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "吃坏了东西，拉肚子。":
        "native": "I ate something bad, and I have diarrhoea."
        "bases":
          "坏":
            "meaning": "broken; bad"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2174":
    "native": "to have a runny nose"
    "notes":
      "n1": "To have a runny nose. 流 (liú) is to flow, and 鼻涕 (bítì) is nasal mucus."
    "examples":
      "孩子流鼻涕。": "The child has a runny nose."
      "我流鼻涕，很难受。":
        "native": "My nose is running, and I feel awful."
        "bases":
          "难受":
            "meaning": "uncomfortable"
  "zh-2175":
    "native": "to sneeze"
    "notes":
      "n1": "To sneeze, with a sudden blow of air through the nose. 喷嚏 (pēntì) is a sneeze."
    "examples":
      "他打喷嚏了。":
        "native": "He sneezed."
        "bases":
          "打":
            "meaning": "to give; to make (a sound)"
          "喷嚏":
            "meaning": "sneeze"
          "了":
            "meaning": "a particle: a change has happened"
      "别在这里打喷嚏。":
        "native": "Do not sneeze here."
        "bases":
          "这里":
            "meaning": "here"
          "打":
            "meaning": "to give; to make (a sound)"
          "喷嚏":
            "meaning": "sneeze"
  "zh-2176":
    "native": "to be allergic"
    "notes":
      "n1": "To be allergic to something, a bad reaction to it. 过 (guò) is too much, and 敏 (mǐn) is sensitive."
    "examples":
      "我对花过敏。": "I am allergic to flowers."
      "这个药会过敏。":
        "native": "This medicine can cause an allergy."
        "bases":
          "会":
            "meaning": "can; to know how to"
  "zh-2177":
    "native": "to break a bone"
    "notes":
      "n1": "To break a bone, a fracture. 骨 (gǔ) is bone, and 折 (zhé) is to break."
    "examples":
      "他骨折了。":
        "native": "He has broken a bone."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "骨折很疼。": "A broken bone is very painful."
  "zh-2178":
    "native": "scald; burn"
    "notes":
      "n1": "A burn caused by hot water or steam. 烫 (tàng) is hot enough to burn, and 伤 (shāng) is a wound."
    "examples":
      "手上有烫伤。":
        "native": "There is a burn on the hand."
        "bases":
          "有":
            "meaning": "to have; there is"
      "烫伤要用冷水冲。":
        "native": "A scald should be rinsed with cold water."
        "bases":
          "要":
            "meaning": "must; to want"
          "用":
            "meaning": "to use"
  "zh-2179":
    "native": "to suffer heat stroke"
    "notes":
      "n1": "To suffer from heat stroke, from too much heat. 中 (zhòng) is to be hit by, and 暑 (shǔ) is summer heat."
    "examples":
      "天很热，他中暑了。":
        "native": "It is very hot, and he has heat stroke."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "夏天要小心中暑。":
        "native": "In summer be careful of heat stroke."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-2180":
    "native": "to be car sick"
    "notes":
      "n1": "To feel sick in a moving vehicle. 晕 (yùn) is dizzy, and 车 (chē) is a vehicle."
    "examples":
      "我晕车。": "I get car sick."
      "坐船也会晕车。":
        "native": "I also feel sick on a boat."
        "bases":
          "会":
            "meaning": "can; to know how to"
  "zh-2181":
    "native": "to be infected"
    "notes":
      "n1": "To be infected by germs or a disease. 感 (gǎn) is to catch, and 染 (rǎn) is to infect."
    "examples":
      "伤口感染了。":
        "native": "The wound has become infected."
        "bases":
          "伤口":
            "meaning": "wound"
          "了":
            "meaning": "a particle: a change has happened"
      "要防止感染。":
        "native": "You must prevent infection."
        "bases":
          "要":
            "meaning": "must; to want"
          "防止":
            "meaning": "to prevent"
  "zh-2182":
    "native": "to be inflamed"
    "notes":
      "n1": "To be swollen and red from an infection. 炎 (yán) is inflammation."
    "examples":
      "我的喉咙发炎了。":
        "native": "My throat is inflamed."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "喉咙":
            "meaning": "throat"
          "了":
            "meaning": "a particle: a change has happened"
      "伤口发炎了。":
        "native": "The wound is inflamed."
        "bases":
          "伤口":
            "meaning": "wound"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2183":
    "native": "ointment; cream"
    "notes":
      "n1": "An ointment, a paste for putting on the skin. 膏 (gāo) is a paste."
    "examples":
      "请擦药膏。": "Please put on the ointment."
      "药膏在桌子上。": "The ointment is on the table."
  "zh-2184":
    "native": "to bring down a fever"
    "notes":
      "n1": "To bring a fever down, to make the temperature go back to normal. 退 (tuì) is to go back."
    "examples":
      "吃药以后退烧了。":
        "native": "After taking the medicine the fever has come down."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "这个药能退烧。":
        "native": "This medicine can bring the fever down."
        "bases":
          "能":
            "meaning": "can; may"
  "zh-2185":
    "native": "painkiller"
    "notes":
      "n1": "A painkiller, medicine that stops pain. 止 (zhǐ) is to stop, and 痛 (tòng) is pain."
    "examples":
      "我要一片止痛药。":
        "native": "I want a painkiller."
        "bases":
          "要":
            "meaning": "must; to want"
      "止痛药不要多吃。":
        "native": "Do not take too many painkillers."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-2186":
    "native": "capsule"
    "notes":
      "n1": "A capsule of medicine, a small shell with powder inside. 胶 (jiāo) is glue, and 囊 (náng) is a bag."
    "examples":
      "这个药是胶囊。": "This medicine is a capsule."
      "一次两粒胶囊。":
        "native": "Two capsules at a time."
        "bases":
          "粒":
            "meaning": "the measure word for small round things"
  "zh-2187":
    "native": "tablet; slice; piece"
    "notes":
      "n1": "A tablet of medicine, or a flat slice of something. 一 片 (yí piàn) is one tablet or slice."
    "examples":
      "每次一片。":
        "native": "One tablet each time."
        "bases":
          "每次":
            "meaning": "each time"
      "一片面包。": "A slice of bread."
  "zh-2188":
    "native": "granules to dissolve in water"
    "notes":
      "n1": "A medicine in granules, which you dissolve in hot water to drink. 冲 (chōng) is to pour water on."
    "examples":
      "这个冲剂很苦。": "This granule medicine is very bitter."
      "用热水冲冲剂。":
        "native": "Dissolve the granules in hot water."
        "bases":
          "用":
            "meaning": "to use"
  "zh-2189":
    "native": "dose"
    "notes":
      "n1": "The amount of medicine to take at one time. 剂 (jì) is a dose, and 量 (liàng) is amount."
    "examples":
      "剂量要按说明。":
        "native": "The dose must follow the instructions."
        "bases":
          "要":
            "meaning": "must; to want"
          "按":
            "meaning": "to follow; to press"
          "说明":
            "meaning": "instructions"
      "剂量太多了。":
        "native": "The dose is too large."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2190":
    "native": "after meals"
    "notes":
      "n1": "After a meal. 饭 (fàn) is a meal, and 后 (hòu) is after."
    "examples":
      "饭后吃药。": "Take the medicine after meals."
      "饭后我休息。": "After a meal I rest."
  "zh-2191":
    "native": "before meals"
    "notes":
      "n1": "Before a meal. 前 (qián) is before."
    "examples":
      "饭前要洗手。":
        "native": "Wash your hands before meals."
        "bases":
          "要":
            "meaning": "must; to want"
          "洗手":
            "meaning": "to wash the hands"
      "饭前吃这个药。": "Take this medicine before meals."
  "zh-2192":
    "native": "on time; as directed"
    "notes":
      "n1": "On time, at the set time. 按 (àn) is to follow, and 时 (shí) is time."
    "examples":
      "请按时吃药。": "Please take the medicine on time."
      "他按时上班。": "He goes to work on time."
  "zh-2193":
    "native": "precautions"
    "notes":
      "n1": "Things to be careful of, the warnings. 注意 (zhùyì) is to pay attention, and 事项 (shìxiàng) is a matter."
    "examples":
      "请看注意事项。": "Please read the precautions."
      "注意事项很重要。": "The precautions are very important."
  "zh-2194":
    "native": "side effect"
    "notes":
      "n1": "A side effect of a medicine, a harmful result besides its use. 副 (fù) is secondary."
    "examples":
      "这个药有副作用吗？":
        "native": "Does this medicine have side effects?"
        "bases":
          "有":
            "meaning": "to have; there is"
      "副作用很小。": "The side effects are very small."
  "zh-2195":
    "native": "to register at a clinic"
    "notes":
      "n1": "To register at a hospital or clinic, to book a doctor. 挂 (guà) is to hang, and 号 (hào) is a number."
    "examples":
      "我去挂号。": "I am going to register."
      "挂号费是十块。":
        "native": "The registration fee is ten yuan."
        "bases":
          "挂号费":
            "meaning": "registration fee"
          "块":
            "meaning": "the measure word for money; a yuan"
  "zh-2196":
    "native": "body temperature"
    "notes":
      "n1": "The temperature of the body. 体 (tǐ) is the body, and 温 (wēn) is warmth."
    "examples":
      "体温很高。": "The body temperature is very high."
      "量体温。":
        "native": "Take the temperature."
        "bases":
          "量":
            "meaning": "to measure"
  "zh-2197":
    "native": "blood pressure"
    "notes":
      "n1": "The pressure of the blood in the veins. 血 (xuè) is blood, and 压 (yā) is pressure."
    "examples":
      "血压很正常。":
        "native": "The blood pressure is normal."
        "bases":
          "正常":
            "meaning": "normal"
      "医生量血压。":
        "native": "The doctor takes my blood pressure."
        "bases":
          "量":
            "meaning": "to measure"
  "zh-2198":
    "native": "to examine; to check"
    "notes":
      "n1": "To examine a patient or check something carefully. 检 (jiǎn) is to inspect, and 查 (chá) is to look into."
    "examples":
      "医生检查我。": "The doctor examines me."
      "要做身体检查。":
        "native": "I need a medical check-up."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-2199":
    "native": "to be in hospital"
    "notes":
      "n1": "To stay in hospital as a patient. 住 (zhù) is to live, and 院 (yuàn) is a hospital."
    "examples":
      "他住院了。":
        "native": "He is in hospital."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "住院要多久？":
        "native": "How long is the hospital stay?"
        "bases":
          "要":
            "meaning": "must; to want"
          "久":
            "meaning": "long, of time"
  "zh-2200":
    "native": "to leave hospital"
    "notes":
      "n1": "To leave hospital after treatment. 出 (chū) is to go out."
    "examples":
      "他明天出院。": "He leaves hospital tomorrow."
      "出院以后要休息。":
        "native": "After leaving hospital you must rest."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-2201":
    "native": "to have an injection"
    "notes":
      "n1": "To have an injection in the arm or leg. 打 (dǎ) is to give, and 针 (zhēn) is a needle."
    "examples":
      "医生给我打针。":
        "native": "The doctor gives me an injection."
        "bases":
          "给":
            "meaning": "to give; for"
      "打针不疼。": "The injection does not hurt."
  "zh-2202":
    "native": "to take medicine"
    "notes":
      "n1": "To take medicine by mouth. 吃 (chī) is to eat, and 药 (yào) is medicine."
    "examples":
      "我吃药了。":
        "native": "I have taken my medicine."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "每天吃药。":
        "native": "Take the medicine every day."
        "bases":
          "每天":
            "meaning": "every day"
  "zh-2203":
    "native": "to swallow"
    "notes":
      "n1": "To swallow something whole."
    "examples":
      "请慢慢吞药。":
        "native": "Please swallow the medicine slowly."
        "bases":
          "慢慢":
            "meaning": "slowly"
      "他吞下了药。":
        "native": "He swallowed the medicine."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2204":
    "native": "to chew"
    "notes":
      "n1": "To chew food with the teeth."
    "examples":
      "请慢慢嚼。":
        "native": "Please chew slowly."
        "bases":
          "慢慢":
            "meaning": "slowly"
      "嚼得很细。":
        "native": "Chew it very finely."
        "bases":
          "得":
            "meaning": "a particle after a verb: how it is done"
          "细":
            "meaning": "fine; thin"
  "zh-2205":
    "native": "to shiver; to tremble"
    "notes":
      "n1": "To shake from cold or fear, or from a fever. 抖 (dǒu) is to shake."
    "examples":
      "他冷得发抖。":
        "native": "He is shivering from the cold."
        "bases":
          "得":
            "meaning": "a particle after a verb: how it is done"
      "发烧时会发抖。":
        "native": "When you have a fever you shiver."
        "bases":
          "时":
            "meaning": "time; when"
          "会":
            "meaning": "can; to know how to"
  "zh-2206":
    "native": "nauseous; disgusting"
    "notes":
      "n1": "Feeling sick in the stomach, or disgusting. 恶 (ě) is bad, and 心 (xin) is the heart or mind."
    "examples":
      "我觉得恶心。": "I feel sick."
      "这个味道很恶心。": "This smell is disgusting."
  "zh-2207":
    "native": "weak; lacking strength"
    "notes":
      "n1": "Lacking strength, tired and weak. 乏 (fá) is tired, and 力 (lì) is strength."
    "examples":
      "我很乏力。": "I feel very weak."
      "感冒以后他乏力。": "After the cold he feels weak."
  "zh-2208":
    "native": "to pull out a tooth"
    "notes":
      "n1": "To pull out a tooth at the dentist. 拔 (bá) is to pull out, and 牙 (yá) is a tooth."
    "examples":
      "我要拔牙。":
        "native": "I need to have a tooth pulled."
        "bases":
          "要":
            "meaning": "must; to want"
      "拔牙以后不能吃硬的。":
        "native": "After a tooth is pulled you must not eat hard food."
        "bases":
          "能":
            "meaning": "can; may"
          "硬":
            "meaning": "hard"
          "的":
            "meaning": "a particle: of; belonging to"
