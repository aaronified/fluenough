"cards":
  "zh-1259":
    "confusables":
      "w1":
        "why": "医院 (yīyuàn) is a hospital, not the police."
      "w2":
        "why": "车站 (chēzhàn) is a station, not the police."
    "bases":
      "请问":
        "meaning": "excuse me; may I ask"
    "native": "Excuse me, where is the police station?"
  "zh-1260":
    "confusables":
      "w1":
        "why": "钥匙 (yàoshi) is a key, a different thing."
      "w2":
        "why": "钱 (qián) is money, not the wallet."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "I have lost my wallet."
  "zh-1261":
    "confusables":
      "w1":
        "why": "救护车 (jiùhùchē) is an ambulance, for the sick."
      "w2":
        "why": "报警 (bàojǐng) is to call the police, not the fire number."
    "bases":
      "打":
        "meaning": "to dial; to hit"
    "native": "For a fire, please dial one one nine."
  "zh-1262":
    "confusables":
      "w1":
        "why": "安全 (ānquán) is safe, the opposite of danger."
      "w2":
        "why": "紧急 (jǐnjí) is urgent, a different word."
    "bases":
      "有":
        "meaning": "to have; there is"
      "要":
        "meaning": "must; to want"
    "native": "There is danger, so be careful."
  "zh-1263":
    "confusables":
      "w1":
        "why": "没关系 (méiguānxi) is the answer, not an apology."
      "w2":
        "why": "不好意思 (bùhǎoyìsi) is also an apology, but a lighter one."
    "bases":
      "迟到":
        "meaning": "to be late"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "Sorry, I am late."
  "zh-1264":
    "confusables":
      "w1":
        "why": "翻译 (fānyì) is to translate, not to repeat."
      "w2":
        "why": "听 (tīng) is to listen, not to speak again."
    "bases":
      "一遍":
        "meaning": "once more"
    "native": "Please say it once more."
  "zh-1265":
    "confusables":
      "w1":
        "why": "表格 (biǎogé) is a form, not a dictionary."
      "w2":
        "why": "通知 (tōngzhī) is a notice, not a dictionary."
    "bases":
      "查":
        "meaning": "to look up"
    "native": "I do not know this character; please help me look it up in the dictionary."
  "zh-1266":
    "confusables":
      "w1":
        "why": "找不到 (zhǎobudào) is cannot find, a state, not a request for help."
      "w2":
        "why": "小偷 (xiǎotōu) is a thief, not lost."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "I am lost; please help me."
