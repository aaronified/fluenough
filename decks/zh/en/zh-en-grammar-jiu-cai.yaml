"name": "就 (jiù) and 才 (cái): early or quick, and late or only then"
"license": "CC-BY-SA-4.0"
"description": "The pair 就 (jiù) and 才 (cái) shows whether an action was early or late, quick or slow: 我六点就起床了 (wǒ liù diǎn jiù qǐchuáng le), I got up as early as six; 我七点才起床 (wǒ qī diǎn cái qǐchuáng), I only got up at seven. Not yet checked by a Mandarin speaker: please report any mistake."
