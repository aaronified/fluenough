  "entries":
    "qichuang": "to get up"
    "dao": "to arrive"
    "xue": "to learn; to study"
    "chifan": "to eat a meal"
  "notes": "就 (jiù) says an action was early or quicker than expected: 我六点就起床了 (wǒ liù diǎn jiù qǐchuáng le), I got up as early as six. 才 (cái) says it was late, or that it happened only then: 我七点才起床 (wǒ qī diǎn cái qǐchuáng), I only got up at seven. Both come before the verb. A number of years or a time after 就 (jiù) or 才 (cái) helps show which: 我三岁就学中文 (wǒ sān suì jiù xué Zhōngwén), I started learning Chinese at three; 我大学才学中文 (wǒ dàxué cái xué Zhōngwén), I only started at university."
