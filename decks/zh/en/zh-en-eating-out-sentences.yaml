"cards":
  "zh-1831":
    "confusables":
      "w1":
        "why": "菜单 (càidān) is the menu, which comes before ordering."
      "w2":
        "why": "结账 (jiézhàng) is to pay, which comes at the end."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "We have already ordered."
  "zh-1832":
    "confusables":
      "w1":
        "why": "咸 (xián) is salty, a different taste."
      "w2":
        "why": "辣 (là) is spicy, a different taste."
    "native": "This soup is very tasty."
  "zh-1833":
    "confusables":
      "w1":
        "why": "外卖 (wàimài) is a takeaway or delivery, a different order."
      "w2":
        "why": "堂食 (tángshí) is eating in, the opposite."
    "bases":
      "剩下":
        "meaning": "left over"
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "Please pack the leftover dishes to take away."
  "zh-1834":
    "confusables":
      "w1":
        "why": "清淡 (qīngdàn) is light food, the opposite."
      "w2":
        "why": "辣 (là) is spicy, a different taste."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "I do not eat greasy food."
  "zh-1835":
    "confusables":
      "w1":
        "why": "小费 (xiǎofèi) is a tip, which is separate."
      "w2":
        "why": "账单 (zhàngdān) is the bill, the total."
    "bases":
      "包括":
        "meaning": "to include"
      "在内":
        "meaning": "included"
    "native": "Is the service charge included?"
  "zh-1836":
    "confusables":
      "w1":
        "why": "包间 (bāojiān) is a private room, not a seat by the window."
      "w2":
        "why": "餐桌 (cānzhuō) is a dining table, not a seat."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "The seat by the window is very good."
  "zh-1837":
    "confusables":
      "w1":
        "why": "包子 (bāozi) is a steamed bun, not dumplings."
      "w2":
        "why": "米饭 (mǐfàn) is cooked rice, not dumplings."
    "bases":
      "要":
        "meaning": "must; to want"
    "native": "I want one portion of dumplings."
  "zh-1838":
    "confusables":
      "w1":
        "why": "现金 (xiànjīn) is cash, another way to pay."
      "w2":
        "why": "信用卡 (xìnyòngkǎ) is a credit card, another way to pay."
    "native": "Please scan the code to pay for the drinks."
