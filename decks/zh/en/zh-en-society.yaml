    "notes":
      "n1": "儿童 (értóng) is a child, the word used in formal, official and medical talk. 孩子 (háizi) is the everyday word for a child, and 小孩 (xiǎohái) is a little more casual. 儿童 (értóng) is also the word for children's rights and services."
