  "zh-4563":
    "native": "social class; stratum"
    "notes":
      "n1": "阶层 (jiēcéng) is a social class or stratum, a group of people with similar work, income and status. 阶级 (jiējí) is the class in the Marxist sense of conflict; 阶层 (jiēcéng) is the neutral word used in sociology and surveys."
