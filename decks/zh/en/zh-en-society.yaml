          "举办":
            "meaning": "to hold"
          "一次":
            "meaning": "once"
          "讲座":
            "meaning": "lecture"
  "zh-4559":
    "native": "neighbours; the people living nearby"
    "notes":
      "n1": "邻里 (línlǐ) is neighbours in the sense of the people who live near each other, in a street or a block. 邻居 (línjū) is one neighbour, a single household next door; 邻里 (línlǐ) is the group, and the relation between them."
