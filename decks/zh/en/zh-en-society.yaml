            "meaning": "particle"
          "相互":
            "meaning": "mutual"
  "zh-4562":
    "native": "difference; gap"
    "notes":
      "n1": "差异 (chāyì) is a difference between things or groups, often in numbers or conditions. 区别 (qūbié) is a distinction that sets things apart; 差异 (chāyì) is more about how much they vary. Use 差异 (chāyì) for measurable gaps."
