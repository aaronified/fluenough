"core": "zh-society"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Society"
"description": "Fifty words for society: villages and cities, schools and welfare, ageing, work, communities, rights and the groups that make up a population. Not yet checked by a Mandarin speaker: please report any mistake."
