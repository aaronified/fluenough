        "bases":
          "不同":
            "meaning": "different"
          "的":
            "meaning": "particle"
  "zh-4561":
    "native": "diverse; plural; many-sided"
    "notes":
      "n1": "多元 (duōyuán) describes a society or a culture with many kinds of people, ideas or sources, not one. 单一 (dānyī) is single, the opposite. 多元文化 (duōyuán wénhuà) is a multicultural society."
