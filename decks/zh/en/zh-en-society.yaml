"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "zh-4521":
    "native": "village; a small settlement in the countryside"
    "notes":
      "n1": "村庄 (cūnzhuāng) is a village, a small group of houses in the countryside. 农村 (nóngcūn) is the countryside as a whole, the wider word. 村子 (cūnzi) is the everyday word for a village, and 村庄 (cūnzhuāng) is slightly more formal, often in writing."
    "examples":
      "这个村庄有三百多户人家。":
        "native": "This village has over three hundred households."
        "bases":
          "这个":
            "meaning": "this"
          "有":
            "meaning": "has"
          "三百多":
            "meaning": "over three hundred"
          "户":
            "meaning": "household"
          "人家":
            "meaning": "families"
      "很多年轻人离开村庄，去城市工作。":
        "native": "Many young people leave the village to work in the city."
        "bases":
          "很多":
            "meaning": "many"
          "年轻人":
            "meaning": "young people"
  "zh-4522":
    "native": "migrant; immigrant; to migrate"
    "notes":
      "n1": "移民 (yímín) is a person who moves to live in another country or region, or the act of moving. 难民 (nànmín) is someone who flees because of war or danger; a 移民 (yímín) usually moves by choice to find work or a home."
    "examples":
      "他是三年前来的移民。":
        "native": "He is an immigrant who came three years ago."
        "bases":
          "三年前":
            "meaning": "three years ago"
          "的":
            "meaning": "particle"
      "城市里有很多农村来的移民。":
        "native": "There are many migrants from the countryside in the city."
        "bases":
          "有":
            "meaning": "there are"
          "很多":
            "meaning": "many"
          "的":
            "meaning": "particle"
  "zh-4523":
    "native": "education; schooling and teaching"
    "notes":
      "n1": "教育 (jiàoyù) is the whole process of teaching and learning, from school to training. 教学 (jiàoxué) is teaching in class, one part of 教育 (jiàoyù). People also say 受教育 (shòu jiàoyù), to receive an education."
    "examples":
      "这个城市的教育水平很高。":
        "native": "This city's education is at a very high level."
        "bases":
          "这个":
            "meaning": "this"
          "的":
            "meaning": "particle"
          "水平":
            "meaning": "level"
      "父母很重视孩子的教育。":
        "native": "Parents value their children's education very much."
        "bases":
          "的":
            "meaning": "particle"
  "zh-4524":
    "native": "ethnic group; nation"
    "notes":
      "n1": "民族 (mínzú) is an ethnic group, a people with a shared language, history or culture, and it also means a nation in the political sense. 国家 (guójiā) is the state. Speaking of a person's 民族 (mínzú) is normal in China, where the country has many of them."
    "examples":
      "中国有五十六个民族。":
        "native": "China has fifty-six ethnic groups."
        "bases":
          "有":
            "meaning": "has"
          "五十六":
            "meaning": "fifty-six"
      "不同民族的人在这里一起生活。":
        "native": "People of different ethnic groups live together here."
        "bases":
          "不同":
            "meaning": "different"
          "的":
            "meaning": "particle"
          "这里":
            "meaning": "here"
          "生活":
            "meaning": "to live"
  "zh-4525":
    "native": "religion"
    "notes":
      "n1": "宗教 (zōngjiào) is religion: a faith with its beliefs, its rites and its community. 信仰 (xìnyǎng) is the belief itself, the faith a person holds, which may or may not be part of a religion."
    "examples":
      "他的家庭信仰什么宗教？":
        "native": "What religion does his family follow?"
        "bases":
          "他的":
            "meaning": "his"
      "政府尊重公民的宗教自由。":
        "native": "The government respects citizens' religious freedom."
        "bases":
          "的":
            "meaning": "particle"
  "zh-4526":
    "native": "system; institution; rules set by a society"
    "notes":
      "n1": "制度 (zhìdù) is a formal system of rules and organisations, such as the school system or the tax system. 体制 (tǐzhì) is the structure of a whole state or organisation; 制度 (zhìdù) is a single set of rules within it."
    "examples":
      "这个国家的教育制度很严格。":
        "native": "This country's education system is very strict."
        "bases":
          "这个":
            "meaning": "this"
          "的":
            "meaning": "particle"
      "社会制度会影响人们的生活。":
        "native": "The social system affects how people live."
        "bases":
          "会":
            "meaning": "will"
          "影响":
            "meaning": "to affect"
          "人们":
            "meaning": "people"
          "的":
            "meaning": "particle"
          "生活":
            "meaning": "life"
  "zh-4527":
    "native": "volunteer"
    "notes":
      "n1": "志愿者 (zhìyuànzhě) is a person who gives time for free to a cause or a community. 义工 (yìgōng) is a common informal word for the same person in everyday speech. 志愿 (zhìyuàn) is the wish or will to do such work."
    "examples":
      "周末，他在社区当志愿者。":
        "native": "At weekends he works as a volunteer in the community."
        "bases":
          "当":
            "meaning": "to be"
      "很多志愿者帮助老人买菜。":
        "native": "Many volunteers help older people buy food."
        "bases":
          "很多":
            "meaning": "many"
  "zh-4528":
    "native": "charity; charitable"
    "notes":
      "n1": "慈善 (císhàn) is giving money or time to help people in need, as charity. As an adjective it describes an organisation or an act of that kind. 公益 (gōngyì) is public benefit; 慈善 (císhàn) is helping the poor in particular."
    "examples":
      "这家公司每年都做慈善。":
        "native": "This company does charity work every year."
        "bases":
          "这家":
            "meaning": "this"
      "他把钱捐给了慈善机构。":
        "native": "He gave his money to a charity."
        "bases":
          "把":
            "meaning": "object marker"
          "捐":
            "meaning": "to donate"
          "给":
            "meaning": "to"
          "了":
            "meaning": "particle"
          "机构":
            "meaning": "organisation"
  "zh-4529":
    "native": "poor; in need; poverty"
    "notes":
      "n1": "贫困 (pínkùn) describes poverty as a condition of a family, a region or a group, usually in official and written talk. 贫穷 (pínqióng) means the same thing and is more everyday. 穷 (qióng) is the plain word for poor."
    "examples":
      "这个地区曾经很贫困。":
        "native": "This area was once very poor."
        "bases":
          "这个":
            "meaning": "this"
          "曾经":
            "meaning": "once"
      "政府的目标是帮助贫困家庭。":
        "native": "The government's aim is to help poor households."
        "bases":
          "的":
            "meaning": "particle"
  "zh-4530":
    "native": "to provide for the elderly; old-age care"
    "notes":
      "n1": "养老 (yǎnglǎo) is caring for the old, with money, a home or support, as a verb or a noun. 养老金 (yǎnglǎojīn) is the pension paid to a retired person. People also say 养老院 (yǎnglǎoyuàn), a care home."
    "examples":
      "子女有责任养老。":
        "native": "Children have a duty to look after their parents in old age."
        "bases":
          "子女":
            "meaning": "children"
          "有":
            "meaning": "have"
      "很多城市都在建养老院。":
        "native": "Many cities are building care homes."
        "bases":
          "很多":
            "meaning": "many"
          "建":
            "meaning": "to build"
          "养老院":
            "meaning": "care home"
  "zh-4531":
    "native": "medical care; treatment"
    "notes":
      "n1": "医疗 (yīliáo) is medical care as a service: hospitals, doctors and treatment. 医生 (yīshēng) is the doctor and 治疗 (zhìliáo) is the treatment itself. 医疗 (yīliáo) is the wider social word, used about the system and about access to care."
    "examples":
      "这个地区的医疗条件比较差。":
        "native": "Medical conditions in this area are fairly poor."
        "bases":
          "这个":
            "meaning": "this"
          "的":
            "meaning": "particle"
          "条件":
            "meaning": "conditions"
          "差":
            "meaning": "poor"
      "政府增加了医疗的投入。":
        "native": "The government has increased its spending on medical care."
        "bases":
          "了":
            "meaning": "particle"
          "的":
            "meaning": "particle"
          "投入":
            "meaning": "investment"
  "zh-4532":
    "native": "traffic; transport"
    "notes":
      "n1": "交通 (jiāotōng) is traffic and transport: the roads, railways, buses and the people using them. 堵车 (dǔchē) is a traffic jam, a common complaint in talk about 交通 (jiāotōng). 交通规则 (jiāotōng guīzé) are the road rules."
    "examples":
      "这个城市的交通很方便。":
        "native": "Transport in this city is very convenient."
        "bases":
          "这个":
            "meaning": "this"
          "的":
            "meaning": "particle"
      "早上的交通总是很拥挤。":
        "native": "Traffic in the morning is always very crowded."
        "bases":
          "的":
            "meaning": "particle"
  "zh-4533":
    "native": "public; shared by everyone"
    "notes":
      "n1": "公共 (gōnggòng) describes things that belong to or serve everyone: a park, a bus or a library. 私人 (sīrén) is private. 公共场所 (gōnggòng chǎngsuǒ) is a public place, and people are expected to keep it clean."
    "examples":
      "请不要在公共场所大声说话。":
        "native": "Please do not speak loudly in public places."
        "bases":
          "不要":
            "meaning": "do not"
          "场所":
            "meaning": "place"
          "大声":
            "meaning": "loudly"
          "说话":
            "meaning": "to speak"
      "公共图书馆对所有人开放。":
        "native": "The public library is open to everyone."
  "zh-4534":
    "native": "harmonious; in harmony"
    "notes":
      "n1": "和谐 (héxié) describes people or a society that get on together without conflict, a word often used in politics and in ordinary praise. 和平 (hépíng) is peace, the absence of war; 和谐 (héxié) is the good relation inside a group."
    "examples":
      "大家和谐相处，社区很安静。":
        "native": "Everyone gets on well, and the community is very quiet."
        "bases":
          "相处":
            "meaning": "to get along"
      "家庭和谐比什么都重要。":
        "native": "Family harmony matters more than anything else."
        "bases":
          "比":
            "meaning": "than"
  "zh-4535":
    "native": "progress; improvement"
    "notes":
      "n1": "进步 (jìnbù) is progress or getting better, the noun for a gain in skill, life or society. As a verb it means to advance. 发展 (fāzhǎn) is development, a wider word for growth of a society or an economy."
    "examples":
      "社会取得了很大的进步。":
        "native": "Society has made great progress."
        "bases":
          "取得":
            "meaning": "to achieve"
          "了":
            "meaning": "particle"
          "很大":
            "meaning": "great"
          "的":
            "meaning": "particle"
      "学习要有进步才行。":
        "native": "Studying must bring progress to be worth it."
        "bases":
          "要":
            "meaning": "must"
          "有":
            "meaning": "have"
          "才":
            "meaning": "only then"
  "zh-4536":
    "native": "modernisation"
    "notes":
      "n1": "现代化 (xiàndàihuà) is becoming modern: new industry, technology, cities and ways of living. 现代 (xiàndài) is the modern age, and 化 (huà) is the suffix for turning into something. The word is common in official and newspaper talk."
    "examples":
      "这个国家正在推进现代化。":
        "native": "This country is pushing forward with modernisation."
        "bases":
          "这个":
            "meaning": "this"
          "正在":
            "meaning": "currently"
          "推进":
            "meaning": "to push forward"
      "农村的现代化比城市慢。":
        "native": "Modernisation in the countryside is slower than in the cities."
        "bases":
          "的":
            "meaning": "particle"
          "比":
            "meaning": "than"
  "zh-4537":
    "native": "globalisation"
    "notes":
      "n1": "全球化 (quánqiúhuà) is the spread of trade, money, ideas and culture across the whole world. 国际 (guójì) is international, between countries; 全球化 (quánqiúhuà) describes the whole system that ties countries together."
    "examples":
      "全球化让很多人买到了便宜的商品。":
        "native": "Globalisation has let many people buy cheap goods."
        "bases":
          "让":
            "meaning": "to let"
          "很多":
            "meaning": "many"
          "买到":
            "meaning": "to buy"
          "了":
            "meaning": "particle"
          "的":
            "meaning": "particle"
      "全球化也带来了文化的交流。":
        "native": "Globalisation has also brought cultural exchange."
        "bases":
          "带来":
            "meaning": "to bring"
          "了":
            "meaning": "particle"
          "的":
            "meaning": "particle"
  "zh-4538":
    "native": "industry; manufacturing"
    "notes":
      "n1": "工业 (gōngyè) is manufacturing and heavy production, the factories and the making of goods. 农业 (nóngyè) is farming, and 服务业 (fúwùyè) is the service sector. Economists say 工业 (gōngyè) for the making part."
    "examples":
      "这个城市以工业为主。":
        "native": "This city is mainly industrial."
        "bases":
          "这个":
            "meaning": "this"
          "以":
            "meaning": "with"
          "为主":
            "meaning": "mainly"
      "工业污染对环境影响很大。":
        "native": "Industrial pollution has a great effect on the environment."
        "bases":
          "影响":
            "meaning": "effect"
          "很大":
            "meaning": "great"
  "zh-4539":
    "native": "agriculture; farming"
    "notes":
      "n1": "农业 (nóngyè) is farming: growing crops, raising animals and the work on the land. 农民 (nóngmín) is a farmer. 工业 (gōngyè) is manufacturing, the opposite side of the economy from farming."
    "examples":
      "他家世世代代都从事农业。":
        "native": "His family has been in farming for generations."
        "bases":
          "他家":
            "meaning": "his family"
          "世世代代":
            "meaning": "for generations"
          "从事":
            "meaning": "to be engaged in"
      "现代农业需要新的技术。":
        "native": "Modern farming needs new technology."
        "bases":
          "新的":
            "meaning": "new"
          "技术":
            "meaning": "technology"
  "zh-4540":
    "native": "media; news and information outlets"
    "notes":
      "n1": "媒体 (méitǐ) is the media: newspapers, television, radio and websites that carry news. 新闻 (xīnwén) is the news itself. 媒体 (méitǐ) is the set of outlets that report it, which people can trust or doubt."
    "examples":
      "媒体报道了这个事件。":
        "native": "The media reported this event."
        "bases":
          "了":
            "meaning": "particle"
          "这个":
            "meaning": "this"
      "现在很多人从网络媒体获取新闻。":
        "native": "Now many people get the news from online media."
        "bases":
          "很多":
            "meaning": "many"
          "从":
            "meaning": "from"
          "获取":
            "meaning": "to get"
  "zh-4541":
    "native": "public opinion"
    "notes":
      "n1": "舆论 (yúlùn) is what the public thinks and says about an issue, as shown in the press and online. 民意 (mínyì) is the will of the people, a more formal idea. 舆论 (yúlùn) can be strong and fast, and officials watch it closely."
    "examples":
      "这件事引起了社会舆论。":
        "native": "This matter caused public debate in society."
        "bases":
          "这件":
            "meaning": "this"
          "事":
            "meaning": "matter"
          "引起":
            "meaning": "to cause"
          "了":
            "meaning": "particle"
      "媒体要负责任地引导舆论。":
        "native": "The media must guide public opinion responsibly."
        "bases":
          "要":
            "meaning": "must"
          "负责任":
            "meaning": "responsibly"
          "地":
            "meaning": "particle"
          "引导":
            "meaning": "to guide"
  "zh-4542":
    "native": "socialising; social interaction"
    "notes":
      "n1": "社交 (shèjiāo) is meeting and talking with other people, either in life or on social media. 社会 (shèhuì) is society, the whole body of people, a different word that is not about talking. 社交媒体 (shèjiāo méitǐ) is social media."
    "examples":
      "他社交能力很强，朋友很多。":
        "native": "He is very good at socialising and has many friends."
        "bases":
          "很强":
            "meaning": "strong"
          "很多":
            "meaning": "many"
      "老人的社交太少，容易感到孤单。":
        "native": "Old people have too little social contact and easily feel lonely."
        "bases":
          "的":
            "meaning": "particle"
          "太少":
            "meaning": "too little"
          "感到":
            "meaning": "to feel"
          "孤单":
            "meaning": "lonely"
  "zh-4543":
    "native": "proportion; ratio"
    "notes":
      "n1": "比例 (bǐlì) is a proportion, the share one number takes of another, often shown as a percentage in a survey. 数据 (shùjù) is the data behind it. Writers say 比例 (bǐlì) when comparing groups, such as the share of women in work."
    "examples":
      "这个学校的男女比例很平衡。":
        "native": "The ratio of boys to girls at this school is very balanced."
        "bases":
          "这个":
            "meaning": "this"
          "的":
            "meaning": "particle"
          "男女":
            "meaning": "men and women"
          "平衡":
            "meaning": "balanced"
      "老年人的比例越来越高。":
        "native": "The proportion of older people is getting higher and higher."
        "bases":
          "老年人":
            "meaning": "elderly people"
          "的":
            "meaning": "particle"
          "越来越":
            "meaning": "more and more"
  "zh-4544":
    "native": "to fall; to decline"
    "notes":
      "n1": "下降 (xiàjiàng) is to fall or go down: numbers, prices, levels. 增长 (zēngzhǎng) is growth, the opposite. 下降 (xiàjiàng) is often used for a steady decline in a statistic, such as birth rates or wages."
    "examples":
      "这个城市的人口在下降。":
        "native": "The population of this city is falling."
        "bases":
          "这个":
            "meaning": "this"
          "的":
            "meaning": "particle"
      "出生率下降得很快。":
        "native": "The birth rate is falling very fast."
        "bases":
          "出生率":
            "meaning": "birth rate"
          "得":
            "meaning": "particle"
  "zh-4545":
    "native": "chance; opportunity"
    "notes":
      "n1": "机会 (jīhuì) is a chance to do something, a good moment that may or may not come back. 机遇 (jīyù) is a larger, historical chance, used in policy talk. People say 有机会 (yǒu jīhuì), to have a chance, in daily speech."
    "examples":
      "大学给了他很多学习的机会。":
        "native": "The university gave him many chances to learn."
        "bases":
          "给":
            "meaning": "to give"
          "了":
            "meaning": "particle"
          "很多":
            "meaning": "many"
          "的":
            "meaning": "particle"
      "每个人都应该有平等的机会。":
        "native": "Everyone should have an equal chance."
        "bases":
          "每个人":
            "meaning": "everyone"
          "有":
            "meaning": "have"
          "的":
            "meaning": "particle"
  "zh-4546":
    "native": "reform"
    "notes":
      "n1": "改革 (gǎigé) is reform: changing a system or an institution to make it better. 革命 (gémìng) is revolution, a far more sudden break. 改革 (gǎigé) is usually a planned, gradual change, a word often used in news about policy."
    "examples":
      "政府宣布了新的改革方案。":
        "native": "The government announced a new reform plan."
        "bases":
          "宣布":
            "meaning": "to announce"
          "了":
            "meaning": "particle"
          "新的":
            "meaning": "new"
      "这项改革让学校的管理更透明。":
        "native": "This reform makes school management more transparent."
        "bases":
          "这项":
            "meaning": "this"
          "让":
            "meaning": "to make"
          "的":
            "meaning": "particle"
  "zh-4547":
    "native": "urbanisation; the growth of towns and cities"
    "notes":
      "n1": "城镇化 (chéngzhènhuà) is the process by which more people move into towns and cities and the countryside turns urban. 城市化 (chéngshìhuà) is the same process, the usual word in other places. 城镇 (chéngzhèn) is a town."
    "examples":
      "城镇化让很多村子变成了城市。":
        "native": "Urbanisation has turned many villages into cities."
        "bases":
          "让":
            "meaning": "to make"
          "很多":
            "meaning": "many"
          "了":
            "meaning": "particle"
      "城镇化的速度很快。":
        "native": "The pace of urbanisation is very fast."
        "bases":
          "的":
            "meaning": "particle"
          "速度":
            "meaning": "speed"
  "zh-4548":
    "native": "ageing of a population"
    "notes":
      "n1": "老龄化 (lǎolínghuà) is the ageing of a population, when more people are old and fewer are young. 老年人 (lǎoniánrén) is an old person, the word for an individual. 老龄化 (lǎolínghuà) is a term for the whole society and its problems."
    "examples":
      "这个国家面临严重的老龄化问题。":
        "native": "This country faces a serious problem of an ageing population."
        "bases":
          "这个":
            "meaning": "this"
          "面临":
            "meaning": "to face"
          "严重":
            "meaning": "serious"
          "的":
            "meaning": "particle"
      "老龄化会增加养老和医疗的压力。":
        "native": "An ageing population increases the pressure on old-age care and medical care."
        "bases":
