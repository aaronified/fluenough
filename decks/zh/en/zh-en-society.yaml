        "native": "This organisation helps children in the countryside to go to school."
        "bases":
          "这个":
            "meaning": "this"
          "的":
            "meaning": "particle"
      "他们组织了一次社区活动。":
        "native": "They organised a community event."
        "bases":
          "了":
            "meaning": "particle"
          "一次":
            "meaning": "one"
          "活动":
            "meaning": "activity"
  "zh-4558":
    "native": "association; society of members"
    "notes":
      "n1": "协会 (xiéhuì) is an association: a body of members who share a trade, a hobby or a cause and who elect their officers. 组织 (zǔzhī) is the wider word for any body; 协会 (xiéhuì) is a specific kind of organisation, with members."
    "examples":
      "他是本地书法协会的会员。":
        "native": "He is a member of the local calligraphy association."
        "bases":
