        "bases":
          "要":
            "meaning": "must"
          "的":
            "meaning": "particle"
  "zh-4568":
    "native": "young people; youth"
    "notes":
      "n1": "青年 (qīngnián) is a young person or young people as a group, often in the sense of the age and the generation. 年轻人 (niánqīngrén) is the everyday phrase for the same group. 青年 (qīngnián) is more often used in formal and political talk."
