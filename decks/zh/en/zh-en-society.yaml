          "了":
            "meaning": "particle"
          "中产阶层":
            "meaning": "middle class"
  "zh-4564":
    "native": "farmer; peasant"
    "notes":
      "n1": "农民 (nóngmín) is a farmer, a person who works the land in the countryside. 农业 (nóngyè) is the farming itself. 农民工 (nóngmíngōng) is a farm worker who moves to the city for work, a term common in news about migration."
