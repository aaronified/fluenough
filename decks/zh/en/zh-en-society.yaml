          "之间":
            "meaning": "between"
  "zh-4560":
    "native": "to tolerate; to accept and include"
    "notes":
      "n1": "包容 (bāoróng) is to accept differences and include people who are unlike oneself. 宽容 (kuānróng) is forgiving someone's fault; 包容 (bāoróng) is wider, a readiness to take in what is different. Both are praised in social talk."
