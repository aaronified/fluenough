    "notes":
      "n1": "老人 (lǎorén) is an old person, usually one past retirement age. 老年人 (lǎoniánrén) is the more formal word for the same people, used in policy. People say 老人 (lǎorén) in speech and 老年人 (lǎoniánrén) in writing and official notices."
