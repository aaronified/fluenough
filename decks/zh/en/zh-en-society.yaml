          "和":
            "meaning": "and"
          "的":
            "meaning": "particle"
  "zh-4549":
    "native": "gender; sex as a category"
    "notes":
      "n1": "性别 (xìngbié) is gender, the category a person belongs to, and the word used in surveys and rules. 男女 (nánnǚ) is men and women, the everyday pair. 性别平等 (xìngbié píngděng) is gender equality, a phrase often used in policy."
    "examples":
      "表格上要填写性别。":
        "native": "The form asks you to fill in your gender."
        "bases":
          "要":
            "meaning": "must"
          "填写":
            "meaning": "to fill in"
      "工作中的性别歧视要被禁止。":
        "native": "Gender discrimination at work must be forbidden."
        "bases":
          "的":
            "meaning": "particle"
          "歧视":
            "meaning": "discrimination"
          "要":
            "meaning": "must"
          "被":
            "meaning": "be"
  "zh-4550":
    "native": "family clan; extended family"
    "notes":
      "n1": "家族 (jiāzú) is an extended family, a line of relatives with a shared name and history. 家庭 (jiātíng) is the household, the smaller unit of parents and children. 家族 (jiāzú) is the wider group that people may trace back many generations."
    "examples":
      "他们家族在这里住了两百年。":
        "native": "His clan has lived here for two hundred years."
        "bases":
          "这里":
            "meaning": "here"
          "了":
            "meaning": "particle"
          "两百年":
            "meaning": "two hundred years"
      "过年的时候，全家族都回老家。":
        "native": "At New Year the whole extended family goes back to the hometown."
        "bases":
          "过年":
            "meaning": "New Year"
          "的":
            "meaning": "particle"
          "全":
            "meaning": "whole"
          "老家":
            "meaning": "hometown"
  "zh-4551":
    "native": "generation gap"
    "notes":
      "n1": "代沟 (dàigōu) is the gap in outlook between parents and children, or between two generations. 代 (dài) is a generation and 沟 (gōu) is a ditch, so the image is of a gap that is hard to cross. People talk about 代沟 (dàigōu) when they disagree on habits."
    "examples":
      "父母和孩子之间有代沟。":
        "native": "There is a generation gap between parents and children."
        "bases":
          "和":
            "meaning": "and"
          "之间":
            "meaning": "between"
          "有":
            "meaning": "there is"
      "我们努力缩小代沟，多交流。":
        "native": "We try hard to narrow the generation gap by talking more."
  "zh-4552":
    "native": "public benefit; charity for the public good"
    "notes":
      "n1": "公益 (gōngyì) is work for the public good, such as a free clinic or a tree-planting day, done without profit. 慈善 (císhàn) is charity for those in need. 公益 (gōngyì) covers a wider set of causes, from the environment to culture."
    "examples":
      "这家基金会专门做公益。":
        "native": "This foundation works specially on public-good projects."
        "bases":
          "这家":
            "meaning": "this"
          "基金会":
            "meaning": "foundation"
          "专门":
            "meaning": "specially"
      "公益活动让社区变得更好。":
        "native": "Public-good activities make the community better."
        "bases":
          "活动":
            "meaning": "activity"
          "让":
            "meaning": "to make"
          "变得":
            "meaning": "become"
  "zh-4553":
    "native": "human rights"
    "notes":
      "n1": "人权 (rénquán) is human rights: the basic rights every person holds, such as life, speech and fair treatment. 权利 (quánlì) is a right, a more general word for something one may claim. 人权 (rénquán) is the broad term used in international talk."
    "examples":
      "每个人都有基本的人权。":
        "native": "Everyone has basic human rights."
        "bases":
          "每个人":
            "meaning": "everyone"
          "有":
            "meaning": "have"
          "基本":
            "meaning": "basic"
          "的":
            "meaning": "particle"
      "这份报告讨论了人权问题。":
        "native": "This report discusses human rights issues."
        "bases":
          "这份":
            "meaning": "this"
          "了":
            "meaning": "particle"
  "zh-4554":
    "native": "refugee"
    "notes":
      "n1": "难民 (nànmín) is a refugee: someone who flees their home because of war, persecution or disaster and seeks safety elsewhere. 移民 (yímín) is a migrant who moves more by choice. A 难民 (nànmín) has a need for protection that a 移民 (yímín) may not."
    "examples":
      "这个国家接收了很多难民。":
        "native": "This country has taken in many refugees."
        "bases":
          "这个":
            "meaning": "this"
          "接收":
            "meaning": "to take in"
          "了":
            "meaning": "particle"
          "很多":
            "meaning": "many"
      "难民需要食物、住所和安全。":
        "native": "Refugees need food, shelter and safety."
        "bases":
          "食物":
            "meaning": "food"
          "住所":
            "meaning": "shelter"
          "和":
            "meaning": "and"
  "zh-4555":
    "native": "town and countryside; urban and rural"
    "notes":
      "n1": "城乡 (chéngxiāng) means the towns and the countryside together, and the gap between them. 城乡差距 (chéngxiāng chājù) is the gap in incomes and services. 农村 (nóngcūn) is only the rural side; 城乡 (chéngxiāng) covers both."
    "examples":
      "城乡之间的收入差距越来越大。":
        "native": "The income gap between town and countryside keeps widening."
        "bases":
          "之间":
            "meaning": "between"
          "的":
            "meaning": "particle"
          "差距":
            "meaning": "gap"
          "越来越":
            "meaning": "more and more"
      "政府希望促进城乡的平衡发展。":
        "native": "The government hopes to promote balanced development between town and countryside."
        "bases":
          "促进":
            "meaning": "to promote"
          "的":
            "meaning": "particle"
          "平衡":
            "meaning": "balanced"
  "zh-4556":
    "native": "to take part; to participate"
    "notes":
      "n1": "参与 (cānyù) is taking part in an activity, a decision or a public matter. 参加 (cānjiā) is the everyday word for joining an event such as a class or a meeting; 参与 (cānyù) is more formal and stresses a real share in the outcome."
    "examples":
      "居民可以参与社区的决定。":
        "native": "Residents can take part in community decisions."
        "bases":
          "可以":
            "meaning": "can"
          "的":
            "meaning": "particle"
      "年轻人积极参与公益活动。":
        "native": "Young people actively take part in public-good activities."
        "bases":
          "年轻人":
            "meaning": "young people"
          "积极":
            "meaning": "actively"
          "活动":
            "meaning": "activity"
  "zh-4557":
    "native": "organisation; to organise"
    "notes":
      "n1": "组织 (zǔzhī) is an organisation, a body of people with a shared aim, and it is also the verb to organise. 团体 (tuántǐ) is a group of people, and 协会 (xiéhuì) is an association of members with a shared trade or purpose."
    "examples":
