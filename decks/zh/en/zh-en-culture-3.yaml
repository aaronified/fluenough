core: zh-culture-3
native:
  code: en
  iso639_3: eng
  name: English
name: "Culture: chengyu with their classical source line"
description: "Eighteen chengyu, each with the classical passage it comes from, in the public domain. Each shows who wrote it and where the story comes from. The text is shown in simplified characters, with the traditional form beside it. Not yet checked by a Chinese speaker: please report any mistake."
license: CC-BY-SA-4.0
tags:
- unreviewed
cards:
  zh-6100:
    native: "A farmer of Song found a hare that had run into a tree stump and broken its neck, so he left his plough and waited by the stump for more hares."
    notes:
      n1: "From the Han Feizi, a book by the Legalist philosopher Han Fei (c. 280 to 233 BCE). 耕田 (gēng tián) means to plough a field, and 株 (zhū) is a tree stump left in the ground."
    bases:
      "宋人":
        meaning: "people of the state of Song"
      "有":
        meaning: "there is, to have"
      "耕田":
        meaning: "to plough a field"
      "者":
        meaning: "the one who (a particle)"
      "田中":
        meaning: "in the field"
      "株":
        meaning: "a tree stump"
      "兔":
        meaning: "a hare"
      "触":
        meaning: "to bump into"
      "折颈":
        meaning: "to break the neck"
      "而":
        meaning: "and, then (a connecting word)"
      "死":
        meaning: "to die"
  zh-6101:
    native: "A man of Chu was selling shields and spears."
    notes:
      n1: "From the Han Feizi, in a story about a seller who praised both his shield and his spear until a question showed they could not both be true. 鬻 (yù) means to sell, and 盾 (dùn) means shield."
    bases:
      "楚人":
        meaning: "a man of Chu"
      "有":
        meaning: "there is, to have"
      "鬻":
        meaning: "to sell"
      "盾":
        meaning: "a shield"
      "与":
        meaning: "and (joining two nouns)"
      "矛":
        meaning: "a spear"
      "者":
        meaning: "the one who (a particle)"
  zh-6102:
    native: "King Xuan of Qi liked to have three hundred men play the reed organ together."
    notes:
      n1: "From the Han Feizi. 齐 (Qí) is the state of Qi, and 竽 (yú) is a reed organ with many pipes, played by a group."
    bases:
      "齐":
        meaning: "the state of Qi"
      "宣王":
        meaning: "King Xuan"
      "使":
        meaning: "to send, to make"
      "吹":
        meaning: "to blow"
      "竽":
        meaning: "a reed organ"
      "必":
        meaning: "certainly, must"
  zh-6103:
    native: "A man of Zheng bought the box and gave back the pearl inside it."
    notes:
      n1: "From the Han Feizi. 椟 (dú) is a wooden box, and 珠 (zhū) is a pearl. The story is a warning about judging something by its container. 郑人 (Zhèng rén) means a man of Zheng."
    bases:
      "郑人":
        meaning: "a man of Zheng"
      "其":
        meaning: "his, its"
      "椟":
        meaning: "a wooden box"
      "而":
        meaning: "and, then (a connecting word)"
      "珠":
        meaning: "a pearl"
  zh-6104:
    native: "The man who drew feet on the snake lost the wine."
    notes:
      n1: "From the Zhanguo Ce, a collection of Warring States stories compiled by Liu Xiang (77 to 6 BCE). The story is about a contest to draw a snake first."
    bases:
      "为":
        meaning: "to be, to make"
      "足":
        meaning: "a foot, feet"
      "者":
        meaning: "the one who (a particle)"
      "终":
        meaning: "in the end"
      "亡":
        meaning: "to lose, to perish"
      "其":
        meaning: "his, its"
  zh-6105:
    native: "The tiger went out to hunt all the beasts to eat them, and caught a fox."
    notes:
      n1: "From the Zhanguo Ce, the Chu section. 百兽 (bǎi shòu) means all kinds of beasts, which the tiger hunts."
    bases:
      "虎":
        meaning: "a tiger"
      "求":
        meaning: "to seek"
      "百兽":
        meaning: "all kinds of beasts"
      "而":
        meaning: "and, then (a connecting word)"
      "食":
        meaning: "to eat"
      "之":
        meaning: "of, belonging to"
      "得":
        meaning: "to get, to catch"
      "狐":
        meaning: "a fox"
  zh-6106:
    native: "It is not too late to mend the pen after the sheep are lost."
    notes:
      n1: "From the Zhanguo Ce, the Chu section. 亡羊 (wáng yáng) means to lose a sheep, and 补牢 (bǔ láo) means to mend a pen."
    bases:
      "亡羊":
        meaning: "to lose a sheep"
      "而":
        meaning: "and, then (a connecting word)"
      "补牢":
        meaning: "to mend a pen"
      "未":
        meaning: "not yet"
      "为":
        meaning: "to be, to make"
  zh-6107:
    native: "The snipe and the clam would not let go of each other, and the fisherman caught both."
    notes:
      n1: "From the Zhanguo Ce, the Yan section, a fable about a snipe and a clam. 渔者 (yú zhě) means a fisherman, and 禽 (qín) here means to catch. 并 (bìng) means together, both."
    bases:
      "两者":
        meaning: "the two of them"
      "不肯":
        meaning: "to refuse"
      "相":
        meaning: "each other"
      "舍":
        meaning: "to let go"
      "渔者":
        meaning: "a fisherman"
      "得":
        meaning: "to get, to catch"
      "而":
        meaning: "and, then (a connecting word)"
      "并":
        meaning: "together, both"
      "禽":
        meaning: "to catch, a bird"
      "之":
        meaning: "of, belonging to"
  zh-6108:
    native: "When three people say there is a tiger in the street, people begin to believe it."
    notes:
      n1: "From the Zhanguo Ce, the Wei section. 三人 (sān rén) means three people, and 成 (chéng) means to become."
    bases:
      "三人":
        meaning: "three people"
      "言":
        meaning: "to say"
      "而":
        meaning: "and, then (a connecting word)"
      "成":
        meaning: "to become, to make"
      "虎":
        meaning: "a tiger"
  zh-6109:
    native: "A man of Song pitied his seedlings for not growing, and pulled them up."
    notes:
      n1: "From the Mencius, where Mencius tells a parable about trying to make things grow faster than they can. 闵 (mǐn) means to pity, and 揠 (yà) means to pull up."
    bases:
      "宋人":
        meaning: "people of the state of Song"
      "有":
        meaning: "there is, to have"
      "闵":
        meaning: "to pity"
      "其":
        meaning: "his, its"
      "苗":
        meaning: "a young seedling"
      "之":
        meaning: "of, belonging to"
      "不长":
        meaning: "does not grow"
      "而":
        meaning: "and, then (a connecting word)"
      "揠":
        meaning: "to pull up"
      "者":
        meaning: "the one who (a particle)"
  zh-6110:
    native: "A frog in a well cannot talk to a sea creature, because it is held back by the small space it lives in."
    notes:
      n1: "From the Zhuangzi, the Qiu Shui chapter. 井蛙 (jǐng wā) is a frog in a well, and 墟 (xū) is a small, limited place. Some editions give a variant character for the frog."
    bases:
      "井蛙":
        meaning: "a frog in a well"
      "不可":
        meaning: "cannot"
      "以":
        meaning: "with, by means of"
      "于":
        meaning: "to, from, in"
      "海者":
        meaning: "a creature of the sea"
      "拘":
        meaning: "to be held back"
      "墟":
        meaning: "a small place, a village"
  zh-6111:
    native: "A man living near the frontier lost his horse for no reason, and it ran off into the land of the Hu."
    notes:
      n1: "From the Huainanzi, a book compiled under Liu An. 塞上 (sài shàng) means the frontier, and 胡 (hú) means the northern peoples."
    bases:
      "塞上":
        meaning: "the frontier"
      "之":
        meaning: "of, belonging to"
      "有":
        meaning: "there is, to have"
      "善":
        meaning: "good at, skilled in"
      "术者":
        meaning: "a person skilled in an art"
      "无故":
        meaning: "for no reason"
      "亡":
        meaning: "to lose, to perish"
      "而":
        meaning: "and, then (a connecting word)"
      "胡":
        meaning: "the Hu, northern peoples"
  zh-6112:
    native: "Lian Po heard of it, bared his upper body, carried a bundle of thorns, and went to the gate of Lin Xiangru to beg forgiveness."
    notes:
      n1: "From the Shiji, chapter 81, about two officials of Zhao. 廉颇 (Lián pō) is a general, and 蔺相如 (Lìn Xiàngrú) is the official he apologised to. 负荆 (fù jīng) means to carry a bundle of thorns, and 肉袒 (ròu tǎn) means to bare the upper body."
    bases:
      "廉颇":
        meaning: "General Lian Po"
      "之":
        meaning: "of, belonging to"
      "肉袒":
        meaning: "to bare the upper body"
      "负荆":
        meaning: "to carry a bundle of thorns"
      "因":
        meaning: "so, then"
      "至":
        meaning: "to, as far as"
      "蔺相如":
        meaning: "Lin Xiangru"
      "谢罪":
        meaning: "to apologise"
  zh-6113:
    native: "They sank their boats, broke their cooking pots, burned their huts and carried only three days of food."
    notes:
      n1: "From the Shiji, chapter 7, about the battle of Julu. 釜 (fǔ) is a cooking pot, and 甑 (zèng) is a steamer pot. 皆 (jiē) means all. 庐舍 (lú shè) means huts and houses. 粮 (liáng) means food supplies."
    bases:
      "皆":
        meaning: "all"
      "沉船":
        meaning: "to sink the boats"
      "破":
        meaning: "to break"
      "釜":
        meaning: "a cooking pot"
      "甑":
        meaning: "a steamer pot"
      "庐舍":
        meaning: "huts and houses"
      "持":
        meaning: "to take, to hold"
      "三日":
        meaning: "three days"
      "粮":
        meaning: "food supplies"
  zh-6114:
    native: "King Goujian of Yue returned to his state, suffered hardship and thought hard, and put gall by his seat."
    notes:
      n1: "From the Shiji, chapter 41, about the king of Yue. 句践 (Gōu Jiàn) is King Goujian, and 胆 (dǎn) is gall, which he tasted to remind himself of his shame. 乃 (nǎi) means then, thereupon."
    bases:
      "越王":
        meaning: "the king of Yue"
      "句践":
        meaning: "King Goujian"
      "反":
        meaning: "to return"
      "乃":
        meaning: "then, thereupon"
      "苦身":
        meaning: "to suffer hardship"
      "焦思":
        meaning: "to think anxiously"
      "置":
        meaning: "to place"
      "胆":
        meaning: "gall"
      "于":
        meaning: "to, from, in"
  zh-6115:
    native: "Kuo could read his father's books but did not know how to adapt when things changed."
    notes:
      n1: "From the Shiji, chapter 81, about a general who knew only his father's books. 括 (Kuò) is the name of the general, and 徒 (tú) means only."
    bases:
      "括":
        meaning: "Zhao Kuo, a name"
      "徒":
        meaning: "only, merely"
      "能":
        meaning: "can, able to"
      "其父":
        meaning: "his father"
      "书传":
        meaning: "books and records"
      "不知":
        meaning: "do not know"
      "合变":
        meaning: "to adapt to change"
  zh-6116:
    native: "I ask to return the intact jade to Zhao."
    notes:
      n1: "From the Shiji, chapter 81, the story of a jade disc of Zhao. 完璧 (wán bì) means an intact jade disc, and 赵 (Zhào) is the state of Zhao. 臣 (chén) means I, a minister speaking. 归 (guī) means to return."
    bases:
      "臣":
        meaning: "I, a minister speaking"
      "完璧":
        meaning: "an intact jade disc"
      "归":
        meaning: "to return"
      "赵":
        meaning: "the state of Zhao"
  zh-6117:
    native: "He visited me three times in my thatched hut and asked me about the affairs of the age."
    notes:
      n1: "From the Former Memorial, a letter by Zhuge Liang to the ruler of Shu. 草庐 (cǎo lú) means a thatched hut, and 咨 (zī) means to consult. 臣 (chén) means I, a minister speaking."
    bases:
      "三顾":
        meaning: "three visits"
      "臣":
        meaning: "I, a minister speaking"
      "于":
        meaning: "to, from, in"
      "草庐":
        meaning: "a thatched hut"
      "之":
        meaning: "of, belonging to"
      "咨":
        meaning: "to consult"
      "以":
        meaning: "with, by means of"
      "当世":
        meaning: "the affairs of the age"
      "事":
        meaning: "affairs, matters"
