"cards":
  "zh-0464":
    "native": "Is this room very pretty?"
    "confusables":
      "w1":
        "why": "好 (hǎo) would say good, not pretty."
      "w2":
        "why": "大 (dà) would say big, not pretty."
  "zh-0465":
    "native": "The school is far, and the room is quiet."
    "confusables":
      "w1":
        "why": "近 (jìn) would say near, the opposite of far."
      "w2":
        "why": "吵 (chǎo) would say noisy, the opposite of quiet."
  "zh-0466":
    "native": "This piece of clothing is cheap, and good too."
    "confusables":
      "w1":
        "why": "贵 (guì) would say expensive, the opposite of cheap."
      "w2":
        "why": "旧 (jiù) would say old, not cheap."
  "zh-0467":
    "native": "He is clever and busy too."
    "confusables":
      "w1":
        "why": "累 (lèi) would say tired, not busy."
      "w2":
        "why": "年轻 (niánqīng) would say young, not clever."
  "zh-0468":
    "native": "Is this character easy to write?"
    "confusables":
      "w1":
        "why": "难 (nán) would say hard, the opposite of easy."
      "w2":
        "why": "重要 (zhòngyào) would say important, not easy."
  "zh-0469":
    "native": "The fish is tasty, and the rice is cheap."
    "confusables":
      "w1":
        "why": "贵 (guì) would say expensive, the opposite of cheap."
      "w2":
        "why": "好 (hǎo) would say good, not tasty."
  "zh-0470":
    "native": "I am tired, and Mum is busy."
    "confusables":
      "w1":
        "why": "饿 (è) would say hungry, not tired."
      "w2":
        "why": "慢 (màn) would say slow, not busy."
  "zh-0471":
    "native": "The water is hot, and the tea is cold."
    "confusables":
      "w1":
        "why": "暖和 (nuǎnhuo) would say warm, which is milder than hot."
      "w2":
        "why": "快 (kuài) would say fast, not hot."
  "zh-0472":
    "native": "This piece of clothing is too short, and too old."
    "confusables":
      "w1":
        "why": "长 (cháng) would say long, the opposite of short."
      "w2":
        "why": "新 (xīn) would say new, the opposite of old."
