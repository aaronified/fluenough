  "name": "English"
"name": "How long and how many times in sentences"
"description": "Sentences that say how long an action took, or how many times it happened: 学了三年 (studied for three years), 去了两次 (went twice). Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-2223":
    "confusables":
      "w1":
        "why": "学习 (xuéxí) is to study, with no time given."
      "w2":
        "why": "读书 (dúshū) is to study or read, a wider word."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
      "三年":
        "meaning": "three years"
      "中文":
        "meaning": "Chinese (the language)"
    "native": "I have studied Chinese for three years."
  "zh-2224":
    "confusables":
      "w1":
        "why": "睡觉 (shuìjiào) is to sleep, with no length of time."
      "w2":
        "why": "休息 (xiūxi) is to rest, a different activity."
    "bases":
      "睡":
        "meaning": "to sleep"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "He slept for eight hours."
  "zh-2225":
    "confusables":
      "w1":
        "why": "候 (hòu) is to wait, a word in 等候 (děnghòu)."
      "w2":
        "why": "迟 (chí) is late, not waiting."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "I waited for you for an hour."
  "zh-2226":
    "confusables":
      "w1":
        "why": "来 (lái) is to come, the other way round."
      "w2":
        "why": "回家 (huíjiā) is to go home, not to a city."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
      "北京":
        "meaning": "Beijing"
    "native": "I went to Beijing twice."
  "zh-2227":
    "confusables":
      "w1":
        "why": "喝 (hē) is to drink, not to eat."
      "w2":
        "why": "买 (mǎi) is to buy, not to eat."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "She has eaten dumplings three times."
  "zh-2228":
    "confusables":
      "w1":
        "why": "休息 (xiūxi) is to rest, not to work."
      "w2":
        "why": "上班 (shàngbān) is to go to work, a single day's act."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "I have worked for two years."
  "zh-2229":
    "confusables":
      "w1":
        "why": "读 (dú) is to read aloud or study, a different sense."
      "w2":
        "why": "写 (xiě) is to write, not to read."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "He has read this book once."
  "zh-2230":
    "confusables":
      "w1":
        "why": "去 (qù) is to go, the other way round."
      "w2":
        "why": "回家 (huíjiā) is to go home, not to a country."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "We have come to China twice."
