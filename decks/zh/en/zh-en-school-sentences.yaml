"cards":
  "zh-1962":
    "confusables":
      "w1":
        "why": "下课 (xiàkè) is the end of a lesson, the opposite."
      "w2":
        "why": "放假 (fàngjià) is a holiday, not a lesson."
    "bases":
      "每天":
        "meaning": "every day"
    "native": "I have lessons every day."
  "zh-1963":
    "confusables":
      "w1":
        "why": "考试 (kǎoshì) is an exam, not homework."
      "w2":
        "why": "练习 (liànxí) is practice, not a hand-in."
    "bases":
      "要":
        "meaning": "must; to want"
      "交":
        "meaning": "to hand in"
      "给":
        "meaning": "to give; to"
    "native": "The homework must be handed to the teacher."
  "zh-1964":
    "confusables":
      "w1":
        "why": "预习 (yùxí) is to prepare ahead, the other way round."
      "w2":
        "why": "放假 (fàngjià) is a holiday, when there is no exam."
    "bases":
      "有":
        "meaning": "to have; there is"
      "要":
        "meaning": "must; to want"
    "native": "There is an exam tomorrow, so you must revise."
  "zh-1965":
    "confusables":
      "w1":
        "why": "及格 (jígé) is to pass, a lower mark."
      "w2":
        "why": "满分 (mǎnfēn) is full marks, a higher result."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "His results are very good."
  "zh-1966":
    "confusables":
      "w1":
        "why": "黑板 (hēibǎn) is a blackboard, not a student."
      "w2":
        "why": "粉笔 (fěnbǐ) is chalk, not a classroom."
    "native": "The students are writing characters in the classroom."
  "zh-1967":
    "confusables":
      "w1":
        "why": "寒假 (hánjià) is the winter holiday, not a term."
      "w2":
        "why": "暑假 (shǔjià) is the summer holiday, not a term."
    "native": "We go to China next term."
  "zh-1968":
    "confusables":
      "w1":
        "why": "答案 (dá'àn) is the answer, not the question."
      "w2":
        "why": "题 (tí) is a question, a close word."
    "native": "This question is very difficult."
  "zh-1969":
    "confusables":
      "w1":
        "why": "校长 (xiàozhǎng) is the principal, a person."
      "w2":
        "why": "同学 (tóngxué) is a classmate, a person."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "The school uniform is blue."
