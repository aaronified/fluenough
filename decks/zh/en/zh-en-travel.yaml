        "native": "The children love the amusement park."
        "bases":
          "孩子们":
            "meaning": "children"
      "游乐园里很热闹。": "The amusement park is very lively."
  "zh-3186":
    "native": "aquarium"
    "notes":
      "n1": "A building with fish and sea animals on show. 水 (shuǐ) is water, 族 (zú) is a group, and 馆 (guǎn) is a building."
    "examples":
      "水族馆里有很多鱼。":
        "native": "There are many fish in the aquarium."
        "bases":
          "有":
            "meaning": "to have"
      "我们去看水族馆。": "We go to see the aquarium."
  "zh-3187":
    "native": "view; scenery"
    "notes":
      "n1": "The look of a place. 景 (jǐng) is a view, and 色 (sè) is colour."
    "examples":
      "这里的景色很美。":
        "native": "The view here is very beautiful."
        "bases":
          "这里":
            "meaning": "here"
          "的":
            "meaning": "of"
          "美":
            "meaning": "beautiful"
      "景色很好看。": "The scenery is very nice to look at."
  "zh-3188":
    "native": "scenery; sights"
    "notes":
      "n1": "The beauty of a place. 风 (fēng) is wind, and 光 (guāng) is light."
    "examples":
      "这里的风光很好。":
        "native": "The scenery here is very good."
        "bases":
          "这里":
            "meaning": "here"
          "的":
            "meaning": "of"
      "风光很美丽。":
        "native": "The scenery is very beautiful."
        "bases":
          "美丽":
            "meaning": "beautiful"
  "zh-3189":
    "native": "island"
    "notes":
      "n1": "An island in the sea. 海 (hǎi) is the sea, and 岛 (dǎo) is an island."
    "examples":
      "海岛很漂亮。": "The island is very pretty."
      "我想去海岛度假。":
        "native": "I want to go on holiday to an island."
        "bases":
          "度假":
            "meaning": "to go on holiday"
  "zh-3190":
    "native": "snow scene"
    "notes":
      "n1": "The view of snow. 雪 (xuě) is snow, and 景 (jǐng) is a scene."
    "examples":
      "雪景很美。":
        "native": "The snow scene is beautiful."
        "bases":
          "美":
            "meaning": "beautiful"
      "我们去看雪景。": "We go to see the snow."
  "zh-3191":
    "native": "night view"
    "notes":
      "n1": "The view of a place at night. 夜 (yè) is night, and 景 (jǐng) is a view."
    "examples":
      "这个城市的夜景很美。":
        "native": "The city's night view is very beautiful."
        "bases":
          "的":
            "meaning": "of"
          "美":
            "meaning": "beautiful"
      "我们在船上看夜景。": "We watched the night view from the boat."
  "zh-3192":
    "native": "hot spring"
    "notes":
      "n1": "Hot water that comes up from the ground. 温 (wēn) is warm, and 泉 (quán) is a spring."
    "examples":
      "我们去泡温泉。":
        "native": "We go to soak in the hot springs."
        "bases":
          "泡":
            "meaning": "to soak"
      "温泉很舒服。": "The hot spring is very relaxing."
  "zh-3193":
    "native": "guide; handbook"
    "notes":
      "n1": "A book or map that helps you find your way. 指 (zhǐ) is to point, and 南 (nán) is the south."
    "examples":
      "这本旅游指南很好。": "This travel guide is very good."
      "我买了一本指南。":
        "native": "I bought a guide."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3194":
    "native": "strategy guide; travel tips"
    "notes":
      "n1": "A set of tips for a trip or a game. 攻 (gōng) is to attack, and 略 (lüè) is a plan."
    "examples":
      "这个攻略很有用。":
        "native": "This travel guide is very useful."
        "bases":
          "有用":
            "meaning": "useful"
      "我看了旅游攻略。":
        "native": "I read a travel guide."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3195":
    "native": "inn; guesthouse"
    "notes":
      "n1": "A small hotel for travellers. 客 (kè) is a guest, and 栈 (zhàn) is an inn."
    "examples":
      "我们住在一家客栈。": "We stayed at a small inn."
      "客栈很便宜。": "The inn is very cheap."
  "zh-3196":
    "native": "room charge"
    "notes":
      "n1": "The money to pay for a room. 房 (fáng) is a room, and 费 (fèi) is a fee."
    "examples":
      "房费包括早饭吗？":
        "native": "Does the room charge include breakfast?"
        "bases":
          "包括":
            "meaning": "to include"
      "房费很贵。": "The room charge is very expensive."
  "zh-3197":
