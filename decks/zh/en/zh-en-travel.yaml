"cards":
  "zh-3148":
    "native": "journey"
    "notes":
      "n1": "The way from one place to another. 旅 (lǚ) is travel, and 途 (tú) is a road."
    "examples":
      "旅途很长。": "The journey is very long."
      "旅途很愉快。":
        "native": "The journey was very pleasant."
        "bases":
          "愉快":
            "meaning": "pleasant"
  "zh-3149":
    "native": "to go on an outing"
    "notes":
      "n1": "To go out for a trip or a day out. 出 (chū) is to go out, and 游 (yóu) is to travel."
    "examples":
      "我们周末出游。": "We go on an outing at the weekend."
      "全家出游了。":
        "native": "The whole family went on a trip."
        "bases":
          "全家":
            "meaning": "whole family"
          "了":
            "meaning": "a particle"
  "zh-3150":
    "native": "to tour; to visit"
    "notes":
      "n1": "To look around a place for pleasure. 游 (yóu) is to tour, and 览 (lǎn) is to view."
    "examples":
      "我们游览了这个城市。":
        "native": "We toured this city."
        "bases":
          "了":
            "meaning": "a particle"
      "游览很有意思。":
        "native": "Touring is very interesting."
        "bases":
          "有":
            "meaning": "to have"
          "意思":
            "meaning": "meaning; interest"
  "zh-3151":
    "native": "famous sight"
    "notes":
      "n1": "A famous place to see. 名 (míng) is famous, and 胜 (shèng) is a scene."
    "examples":
      "这里有很多名胜。":
        "native": "There are many famous sights here."
        "bases":
          "这里":
            "meaning": "here"
          "有":
            "meaning": "to have"
      "名胜都很漂亮。": "The famous sights are very pretty."
  "zh-3152":
    "native": "custom"
    "notes":
      "n1": "The way people do things in a place. 风 (fēng) is custom, and 俗 (sú) is custom."
    "examples":
      "每个地方的风俗不同。":
        "native": "Each place has different customs."
        "bases":
          "的":
            "meaning": "of"
          "不同":
            "meaning": "different"
      "我想了解当地的风俗。":
        "native": "I want to learn about the local customs."
        "bases":
          "了解":
            "meaning": "to understand"
          "的":
            "meaning": "of"
  "zh-3153":
    "native": "tradition; custom"
    "notes":
      "n1": "A custom that has been followed for a long time. 习 (xí) is habit, and 俗 (sú) is custom."
    "examples":
      "这个习俗很有意思。":
        "native": "This tradition is very interesting."
        "bases":
          "有":
            "meaning": "to have"
          "意思":
            "meaning": "meaning; interest"
      "习俗要尊重。":
        "native": "Traditions must be respected."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-3154":
    "native": "local"
    "notes":
      "n1": "The place where you are. 当 (dāng) is this, and 地 (dì) is a place."
    "examples":
      "当地人很友好。":
        "native": "The local people are very friendly."
        "bases":
          "友好":
            "meaning": "friendly"
      "我们吃了当地的饭。":
        "native": "We ate the local food."
        "bases":
          "了":
            "meaning": "a particle"
          "的":
            "meaning": "of"
  "zh-3155":
    "native": "local; this place"
    "notes":
      "n1": "This place, where one lives. 本 (běn) is this, and 地 (dì) is a place."
    "examples":
      "本地的天气很好。":
        "native": "The local weather is very good."
        "bases":
          "的":
            "meaning": "of"
      "这是本地的特产。":
        "native": "This is a local speciality."
        "bases":
          "的":
            "meaning": "of"
          "特产":
            "meaning": "local speciality"
  "zh-3156":
    "native": "other places; out of town"
    "notes":
      "n1": "A place outside one's own area. 外 (wài) is outside, and 地 (dì) is a place."
    "examples":
      "我来自外地。": "I come from out of town."
      "外地人很多。": "There are many people from other places."
  "zh-3157":
    "native": "foreign country"
    "notes":
      "n1": "A country other than one's own. 外 (wài) is outside, and 国 (guó) is a country."
    "examples":
      "我去外国旅游。": "I travel abroad."
      "外国的风景很美。":
        "native": "The scenery abroad is beautiful."
        "bases":
          "的":
            "meaning": "of"
          "美":
            "meaning": "beautiful"
  "zh-3158":
    "native": "foreign language"
    "notes":
      "n1": "A language from another country. 外 (wài) is outside, and 语 (yǔ) is language."
    "examples":
      "你会说外语吗？":
        "native": "Can you speak a foreign language?"
        "bases":
          "会":
            "meaning": "can; to know how to"
      "学习外语很有用。":
        "native": "Learning a foreign language is very useful."
        "bases":
          "有用":
            "meaning": "useful"
  "zh-3159":
    "native": "guided tour; guide"
    "notes":
      "n1": "A tour with a guide who explains things. 导 (dǎo) is to lead, and 览 (lǎn) is to view."
    "examples":
      "我们参加了导览。":
        "native": "We joined a guided tour."
        "bases":
          "了":
            "meaning": "a particle"
      "导览很详细。":
        "native": "The guided tour is very detailed."
        "bases":
          "详细":
            "meaning": "detailed"
  "zh-3160":
    "native": "travel agency"
    "notes":
      "n1": "A company that arranges trips. 旅 (lǚ) is travel, 行 (xíng) is to go, and 社 (shè) is a company."
    "examples":
      "我在旅行社订了票。":
        "native": "I booked the tickets at the travel agency."
        "bases":
          "订":
            "meaning": "to book"
          "了":
            "meaning": "a particle"
      "这家旅行社很好。": "This travel agency is very good."
  "zh-3161":
    "native": "group; party"
    "notes":
      "n1": "A group of people travelling or working together. 团 (tuán) is a group, and 体 (tǐ) is a body."
    "examples":
      "我们是一个团体。": "We are a group."
      "团体票便宜一些。":
        "native": "Group tickets are a bit cheaper."
        "bases":
          "团体票":
            "meaning": "group ticket"
  "zh-3162":
    "native": "independent travel"
    "notes":
      "n1": "A trip planned and paid for by yourself. 自 (zì) is self, 助 (zhù) is help, and 游 (yóu) is to travel."
    "examples":
      "我喜欢自助游。": "I like independent travel."
      "自助游要自己订酒店。":
        "native": "On an independent trip you book the hotel yourself."
        "bases":
          "要":
            "meaning": "must; to want"
          "订":
            "meaning": "to book"
  "zh-3163":
    "native": "to drive yourself"
    "notes":
      "n1": "To drive a car on a trip by yourself. 自 (zì) is self, and 驾 (jià) is to drive."
    "examples":
      "我们自驾去海边。": "We drive ourselves to the seaside."
      "自驾游很自由。":
        "native": "Self-drive trips are very free."
        "bases":
          "自驾游":
            "meaning": "self-drive trip"
  "zh-3164":
    "native": "boat ticket"
    "notes":
      "n1": "A ticket for a boat. 船 (chuán) is a boat, and 票 (piào) is a ticket."
    "examples":
      "船票多少钱？": "How much is the boat ticket?"
      "我买了两张船票。":
        "native": "I bought two boat tickets."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3165":
    "native": "plane ticket"
    "notes":
      "n1": "A ticket for a flight. 机 (jī) is a plane, and 票 (piào) is a ticket."
    "examples":
      "机票很贵。": "The plane ticket is very expensive."
      "我的机票在包里。":
        "native": "My plane ticket is in my bag."
        "bases":
          "的":
            "meaning": "of"
  "zh-3166":
    "native": "speed of a vehicle"
    "notes":
      "n1": "How fast a vehicle goes. 车 (chē) is a vehicle, and 速 (sù) is speed."
    "examples":
      "车速太快了。":
        "native": "The vehicle is going too fast."
        "bases":
          "了":
            "meaning": "a particle"
      "请注意车速。":
        "native": "Please watch your speed."
        "bases":
          "注意":
            "meaning": "to pay attention"
  "zh-3167":
    "native": "road conditions"
    "notes":
      "n1": "The state of the roads. 路 (lù) is a road, and 况 (kuàng) is the situation."
    "examples":
      "路况很好。": "The road conditions are good."
      "现在的路况怎么样？":
        "native": "How are the roads now?"
        "bases":
          "的":
            "meaning": "of"
          "怎么样":
            "meaning": "how is it"
  "zh-3168":
    "native": "road sign"
    "notes":
      "n1": "A sign on the road that shows the way. 路 (lù) is a road, and 标 (biāo) is a sign."
    "examples":
      "路标在哪里？": "Where is the road sign?"
      "这个路标很清楚。": "This road sign is very clear."
  "zh-3169":
    "native": "station name"
    "notes":
      "n1": "The name of a station. 站 (zhàn) is a station, and 名 (míng) is a name."
    "examples":
      "站名是什么？": "What is the station name?"
      "这个站名很长。": "This station name is very long."
  "zh-3170":
    "native": "footbridge"
    "notes":
      "n1": "A bridge for people to cross a busy road. 天 (tiān) is sky, and 桥 (qiáo) is a bridge."
    "examples":
      "走天桥过马路。": "Cross the road by the footbridge."
      "天桥上人很多。": "There are many people on the footbridge."
  "zh-3171":
    "native": "crowd"
    "notes":
      "n1": "A large group of people. 人 (rén) is a person, and 群 (qún) is a group."
    "examples":
      "车站里有很多人群。":
        "native": "There is a big crowd in the station."
        "bases":
          "有":
            "meaning": "to have"
      "人群很挤。":
        "native": "The crowd is very crowded."
        "bases":
          "挤":
            "meaning": "crowded"
  "zh-3172":
    "native": "crowded"
    "notes":
      "n1": "Too many people in one space. 拥 (yōng) is to crowd, and 挤 (jǐ) is to squeeze."
    "examples":
      "地铁很拥挤。": "The metro is very crowded."
      "早上的路很拥挤。":
        "native": "The roads are crowded in the morning."
        "bases":
          "的":
            "meaning": "of"
  "zh-3173":
    "native": "folk customs"
    "notes":
      "n1": "The customs of ordinary people. 民 (mín) is people, and 俗 (sú) is custom."
    "examples":
      "这里的民俗很特别。":
        "native": "The folk customs here are very special."
        "bases":
          "这里":
            "meaning": "here"
          "的":
            "meaning": "of"
          "特别":
            "meaning": "especially"
      "我们参观了民俗博物馆。":
        "native": "We visited a folk museum."
        "bases":
          "参观":
            "meaning": "to visit (a place)"
          "了":
            "meaning": "a particle"
  "zh-3174":
    "native": "business card"
    "notes":
      "n1": "A small card with your name and details. 名 (míng) is a name, and 片 (piàn) is a piece."
    "examples":
      "请给我你的名片。":
        "native": "Please give me your business card."
        "bases":
          "给":
            "meaning": "to give; for"
          "的":
            "meaning": "of"
      "我有一张名片。":
        "native": "I have a business card."
        "bases":
          "有":
            "meaning": "to have"
  "zh-3175":
    "native": "to climb a mountain"
    "notes":
      "n1": "To walk up a mountain. 登 (dēng) is to climb, and 山 (shān) is a mountain."
    "examples":
      "我们周末去登山。": "We go climbing at the weekend."
      "登山要带水。":
        "native": "Take water when you climb a mountain."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-3176":
    "native": "viewing platform"
    "notes":
      "n1": "A place high up to look at the view. 观 (guān) is to view, 景 (jǐng) is a scene, and 台 (tái) is a platform."
    "examples":
      "观景台上风很大。": "It is very windy on the viewing platform."
      "我们在观景台拍照。": "We took photos on the viewing platform."
  "zh-3177":
    "native": "sunrise"
    "notes":
      "n1": "The time when the sun comes up. 日 (rì) is the sun, and 出 (chū) is to come out."
    "examples":
      "我们去看日出。": "We go to see the sunrise."
      "日出很美。":
        "native": "The sunrise is beautiful."
        "bases":
          "美":
            "meaning": "beautiful"
  "zh-3178":
    "native": "sunset"
    "notes":
      "n1": "The time when the sun goes down. 日 (rì) is the sun, and 落 (luò) is to fall."
    "examples":
      "日落的时候很美。":
        "native": "The sunset is very beautiful."
        "bases":
          "的":
            "meaning": "of"
          "美":
            "meaning": "beautiful"
      "我们在海边看日落。": "We watched the sunset by the sea."
  "zh-3179":
    "native": "seaside"
    "notes":
      "n1": "The land beside the sea. 海 (hǎi) is the sea, and 滨 (bīn) is the shore."
    "examples":
      "海滨很安静。": "The seaside is very quiet."
      "我们住在海滨。": "We are staying by the seaside."
  "zh-3180":
    "native": "city wall"
    "notes":
      "n1": "The wall around an old city. 城 (chéng) is a city, and 墙 (qiáng) is a wall."
    "examples":
      "城墙很长。": "The city wall is very long."
      "我们走了一段城墙。":
        "native": "We walked along part of the city wall."
        "bases":
          "了":
            "meaning": "a particle"
          "段":
            "meaning": "measure word for a stretch"
  "zh-3181":
    "native": "temple"
    "notes":
      "n1": "A place for religious worship. 寺 (sì) is a temple, and 院 (yuàn) is a court."
    "examples":
      "寺院很安静。": "The temple is very quiet."
      "我们参观了一个寺院。":
        "native": "We visited a temple."
        "bases":
          "参观":
            "meaning": "to visit (a place)"
          "了":
            "meaning": "a particle"
  "zh-3182":
    "native": "art gallery"
    "notes":
      "n1": "A building for showing art. 美 (měi) is beautiful, 术 (shù) is art, and 馆 (guǎn) is a building."
    "examples":
      "这个美术馆很大。": "This art gallery is very big."
      "美术馆里有很多画。":
        "native": "There are many paintings in the art gallery."
        "bases":
          "有":
            "meaning": "to have"
          "画":
            "meaning": "painting"
  "zh-3183":
    "native": "memorial hall"
    "notes":
      "n1": "A building that remembers a person or event. 纪 (jì) is to record, 念 (niàn) is to think of, and 馆 (guǎn) is a building."
    "examples":
      "我们参观了纪念馆。":
        "native": "We visited the memorial hall."
        "bases":
          "参观":
            "meaning": "to visit (a place)"
          "了":
            "meaning": "a particle"
      "纪念馆很庄严。":
        "native": "The memorial hall is very solemn."
        "bases":
          "庄严":
            "meaning": "solemn"
  "zh-3184":
    "native": "botanical garden"
    "notes":
      "n1": "A garden with many kinds of plants. 植 (zhí) is to plant, 物 (wù) is a thing, and 园 (yuán) is a garden."
    "examples":
      "植物园里有很多花。":
        "native": "There are many flowers in the botanical garden."
        "bases":
          "有":
            "meaning": "to have"
      "我们去植物园散步。": "We go for a walk in the botanical garden."
  "zh-3185":
    "native": "amusement park"
    "notes":
      "n1": "A park with rides and games. 游 (yóu) is to play, 乐 (lè) is fun, and 园 (yuán) is a park."
