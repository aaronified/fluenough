"name": "要 (yào) and 快要 (kuàiyào) with 了 (le): about to happen"
"license": "CC-BY-SA-4.0"
"description": "要 (yào) and 快要 (kuàiyào), with 了 (le) at the end, say that something is going to happen or is about to happen: 要下雨了 (yào xiàyǔ le), it is going to rain; 快要下雨了 (kuàiyào xiàyǔ le), it is about to rain. Not yet checked by a Mandarin speaker: please report any mistake."
"tags":
- "unreviewed"
"pattern":
  "name": "要 (yào) and 快要 (kuàiyào) with 了 (le): about to happen"
  "slot_name": "form"
  "prompt": "{lemma} ({gloss}), {slot}"
  "slots":
    "plain": "a statement that it has happened, with 了 (le)"
    "soon": "要 (yào) before the verb with 了 (le) at the end: going to happen"
    "about-to": "快要 (kuàiyào) before the verb with 了 (le) at the end: about to happen"
  "entries":
    "xiayu": "to rain"
    "fangjia": "to have a holiday"
    "kaoshi": "exam"
    "chifan2": "to be ready"
  "notes": "要 (yào) is going to, and it can be said with the 了 (le) at the end: 要下雨了 (yào xiàyǔ le), it is going to rain. 快要 (kuàiyào) is about to, a little closer: 快要放假了 (kuàiyào fàngjià le), the holiday is about to start. Use 了 (le) at the end of both, so the change is clear. Do not use 要 (yào) for the past, and do not say 要 (yào) with 了 (le) for a state that will not change."
