  "notes": "The negative of 有 (yǒu) is 没有 (méiyǒu), with 没 (méi), not 不 (bù): 我没有书 (wǒ méiyǒu shū), I do not have a book. Never 我不有书 (wǒ bù yǒu shū). 没有 (méiyǒu) does not change for the person: 他没有电话 (tā méiyǒu diànhuà), he does not have a phone."
