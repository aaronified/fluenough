"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-4144":
    "native": "escape to safety"
    "notes":
      "n1": "逃生 (táoshēng): escape to safety. It is one of the words a safety notice or an emergency uses."
    "examples":
      "大家要快点逃生。":
        "native": "Everyone must escape quickly."
      "他们从窗口逃生。":
        "native": "They escaped through the window."
        "bases":
          "从":
            "meaning": "from"
  "zh-4145":
    "native": "evacuate; disperse"
    "notes":
      "n1": "疏散 (shūsàn): evacuate; disperse. It is one of the words a safety notice or an emergency uses."
    "examples":
      "请大家有序疏散。":
        "native": "Please evacuate in an orderly way."
      "警察正在疏散人群。":
        "native": "The police are moving the crowd on."
  "zh-4146":
    "native": "fire extinguisher"
    "notes":
      "n1": "灭火器 (mièhuǒqì): fire extinguisher. It is one of the words a safety notice or an emergency uses."
    "examples":
      "灭火器在门口。":
        "native": "The fire extinguisher is at the door."
        "bases":
          "在":
            "meaning": "is at"
      "请用灭火器灭火。":
        "native": "Please use the extinguisher to put out the fire."
  "zh-4147":
    "native": "stretcher"
    "notes":
      "n1": "担架 (dānjià): stretcher. It is one of the words a safety notice or an emergency uses."
    "examples":
      "请用担架把他抬走。":
        "native": "Please use a stretcher to carry him away."
        "bases":
          "把":
            "meaning": "(marks the person moved)"
      "担架在走廊里。":
        "native": "The stretcher is in the corridor."
        "bases":
          "在":
            "meaning": "is"
  "zh-4148":
    "native": "firefighter"
    "notes":
      "n1": "消防员 (xiāofángyuán): firefighter. It is one of the words a safety notice or an emergency uses."
    "examples":
      "消防员在救人。":
        "native": "The firefighter is rescuing someone."
        "bases":
          "在":
            "meaning": "is"
      "消防员穿着红色的衣服。":
        "native": "The firefighter is wearing red clothes."
        "bases":
          "的":
            "meaning": "(linking word)"
  "zh-4149":
    "native": "assemble; gather"
    "notes":
      "n1": "集合 (jíhé): assemble; gather. It is one of the words a safety notice or an emergency uses."
    "examples":
      "大家在门口集合。":
        "native": "Everyone gathers at the door."
        "bases":
          "在":
            "meaning": "at"
      "五分钟后集合。":
        "native": "Assemble in five minutes."
  "zh-4150":
    "native": "withdraw; leave an area"
    "notes":
      "n1": "撤离 (chèlí): withdraw; leave an area. It is one of the words a safety notice or an emergency uses."
    "examples":
      "居民已经撤离。":
        "native": "The residents have already left the area."
      "请按照指示撤离。":
        "native": "Please leave by following the instructions."
  "zh-4151":
    "native": "fall down"
    "notes":
      "n1": "摔倒 (shuāidǎo): fall down. It is one of the words a safety notice or an emergency uses."
    "examples":
      "他在楼梯上摔倒了。":
        "native": "He fell down on the stairs."
        "bases":
          "在":
            "meaning": "on"
          "了":
            "meaning": "(a change has happened)"
      "老人摔倒了，需要帮助。":
        "native": "The old man fell and needs help."
        "bases":
          "了":
            "meaning": "(a change has happened)"
  "zh-4152":
    "native": "faint"
    "notes":
      "n1": "晕倒 (yūndǎo): faint. It is one of the words a safety notice or an emergency uses."
    "examples":
      "他热得晕倒了。":
        "native": "He was so hot that he fainted."
        "bases":
          "得":
            "meaning": "(linking word: so ... that)"
          "了":
            "meaning": "(a change has happened)"
      "那个女孩突然晕倒。":
        "native": "The girl suddenly fainted."
  "zh-4153":
    "native": "have a power cut"
    "notes":
      "n1": "停电 (tíngdiàn): have a power cut. It is one of the words a safety notice or an emergency uses."
    "examples":
      "刚才停电了。":
        "native": "There was a power cut just now."
        "bases":
          "了":
            "meaning": "(a change has happened)"
      "停电的时候不要用电梯。":
        "native": "Do not use the lift during a power cut."
        "bases":
          "的":
            "meaning": "(linking word)"
  "zh-4154":
    "native": "leak water"
    "notes":
      "n1": "漏水 (lòushuǐ): leak water. It is one of the words a safety notice or an emergency uses."
    "examples":
      "厨房的水管漏水。":
        "native": "The kitchen pipe is leaking."
        "bases":
          "的":
            "meaning": "of"
      "天花板在漏水。":
        "native": "The ceiling is leaking."
        "bases":
          "在":
            "meaning": "is"
  "zh-4155":
    "native": "leak (gas, chemicals)"
    "notes":
      "n1": "泄漏 (xièlòu): leak (gas, chemicals). It is one of the words a safety notice or an emergency uses."
    "examples":
      "煤气泄漏了。":
        "native": "The gas has leaked."
        "bases":
          "了":
            "meaning": "(a change has happened)"
      "化学品泄漏很危险。":
        "native": "A chemical leak is very dangerous."
  "zh-4156":
    "native": "thick smoke"
    "notes":
      "n1": "浓烟 (nóngyān): thick smoke. It is one of the words a safety notice or an emergency uses."
    "examples":
      "房间里全是浓烟。":
        "native": "The room is full of thick smoke."
      "浓烟让我们看不清路。":
        "native": "The thick smoke made it hard to see the way."
        "bases":
          "让":
            "meaning": "made"
  "zh-4157":
    "native": "suffocate"
    "notes":
      "n1": "窒息 (zhìxī): suffocate. It is one of the words a safety notice or an emergency uses."
    "examples":
      "他差点窒息。":
        "native": "He nearly suffocated."
      "烟太多，人会窒息。":
        "native": "With so much smoke, people can suffocate."
  "zh-4158":
    "native": "victim"
    "notes":
      "n1": "受害者 (shòuhàizhě): victim. It is one of the words a safety notice or an emergency uses."
    "examples":
      "受害者需要医生。":
        "native": "The victims need a doctor."
      "警察在找受害者的家人。":
        "native": "The police are looking for the victim's family."
        "bases":
          "在":
            "meaning": "(marks the action)"
          "的":
            "meaning": "of"
  "zh-4159":
    "native": "call for help"
    "notes":
      "n1": "呼救 (hūjiù): call for help. It is one of the words a safety notice or an emergency uses."
    "examples":
      "他大声呼救。":
        "native": "He called out loudly for help."
      "没有人听到他的呼救。":
        "native": "No one heard his cry for help."
        "bases":
          "的":
            "meaning": "of"
  "zh-4160":
    "native": "report a crime or accident to the police"
    "notes":
      "n1": "报案 (bào'àn): report a crime or accident to the police. It is one of the words a safety notice or an emergency uses."
    "examples":
      "我要去报案。":
        "native": "I am going to report it to the police."
      "他们已经报案了。":
        "native": "They have already reported it to the police."
        "bases":
          "了":
            "meaning": "(a change has happened)"
  "zh-4161":
    "native": "prevent fire"
    "notes":
      "n1": "防火 (fánghuǒ): prevent fire. It is one of the words a safety notice or an emergency uses."
    "examples":
      "楼里要注意防火。":
        "native": "Take care to prevent fire in the building."
      "这扇门是防火门。":
        "native": "This door is a fire door."
  "zh-4162":
    "native": "alarm device"
    "notes":
      "n1": "警报器 (jǐngbàoqì): alarm device. It is one of the words a safety notice or an emergency uses."
    "examples":
      "火警警报器响了。":
        "native": "The fire alarm has gone off."
        "bases":
          "了":
            "meaning": "(a change has happened)"
      "请不要碰警报器。":
        "native": "Please do not touch the alarm."
  "zh-4163":
    "native": "tornado"
    "notes":
      "n1": "龙卷风 (lóngjuǎnfēng): tornado. It is one of the words a safety notice or an emergency uses."
    "examples":
      "那里发生了龙卷风。":
        "native": "A tornado happened there."
        "bases":
          "了":
            "meaning": "(a change has happened)"
      "龙卷风很可怕。":
        "native": "Tornadoes are very frightening."
  "zh-4164":
    "native": "slip and fall"
    "notes":
      "n1": "滑倒 (huádǎo): slip and fall. It is one of the words a safety notice or an emergency uses."
    "examples":
      "地上有水，小心滑倒。":
        "native": "There is water on the floor, so be careful not to slip."
      "他在雨里滑倒了。":
        "native": "He slipped in the rain."
        "bases":
          "在":
            "meaning": "in"
          "了":
            "meaning": "(a change has happened)"
  "zh-4165":
    "native": "first-aid kit"
    "notes":
      "n1": "急救箱 (jíjiùxiāng): first-aid kit. It is one of the words a safety notice or an emergency uses."
    "examples":
      "急救箱在厨房里。":
        "native": "The first-aid kit is in the kitchen."
        "bases":
          "在":
            "meaning": "is"
      "出门前检查急救箱。":
        "native": "Check the first-aid kit before going out."
  "zh-4166":
    "native": "cut"
    "notes":
      "n1": "割伤 (gēshāng): cut. It is one of the words a safety notice or an emergency uses."
    "examples":
      "他的手指割伤了。":
        "native": "He cut his finger."
        "bases":
          "的":
            "meaning": "of"
          "了":
            "meaning": "(a change has happened)"
      "玻璃会割伤人。":
        "native": "Glass can cut people."
  "zh-4167":
    "native": "be poisoned"
    "notes":
      "n1": "中毒 (zhòngdú): be poisoned. It is one of the words a safety notice or an emergency uses."
    "examples":
      "他吃了坏的东西，中毒了。":
        "native": "He ate something bad and was poisoned."
        "bases":
          "了":
            "meaning": "(a change has happened)"
          "的":
            "meaning": "(linking word)"
      "小孩子不能喝这个，会中毒。":
        "native": "Small children must not drink this, or they will be poisoned."
  "zh-4168":
    "native": "get an electric shock"
    "notes":
      "n1": "触电 (chùdiàn): get an electric shock. It is one of the words a safety notice or an emergency uses."
    "examples":
      "别用湿手碰插座，会触电。":
        "native": "Don't touch the socket with wet hands, or you will get an electric shock."
      "他差点触电。":
        "native": "He nearly got an electric shock."
  "zh-4169":
    "native": "drown"
    "notes":
      "n1": "溺水 (nìshuǐ): drown. It is one of the words a safety notice or an emergency uses."
    "examples":
      "孩子在河里溺水了。":
        "native": "A child drowned in the river."
        "bases":
          "在":
            "meaning": "in"
          "了":
            "meaning": "(a change has happened)"
      "游泳时要注意防止溺水。":
        "native": "When swimming, take care to prevent drowning."
  "zh-4170":
    "native": "put out a fire"
    "notes":
      "n1": "灭火 (mièhuǒ): put out a fire. It is one of the words a safety notice or an emergency uses."
    "examples":
      "大家一起灭火。":
        "native": "Everyone puts out the fire together."
      "他用水灭火。":
        "native": "He puts out the fire with water."
  "zh-4171":
    "native": "go missing (a person or a pet)"
    "notes":
      "n1": "走失 (zǒushī): go missing (a person or a pet). It is one of the words a safety notice or an emergency uses."
    "examples":
      "老人走失了。":
        "native": "The old person has gone missing."
        "bases":
          "了":
            "meaning": "(a change has happened)"
      "请看好孩子，别让他走失。":
        "native": "Please keep an eye on the child so he does not get lost."
        "bases":
          "让":
            "meaning": "let"
  "zh-4172":
    "native": "catch fire"
    "notes":
      "n1": "失火 (shīhuǒ): catch fire. It is one of the words a safety notice or an emergency uses."
    "examples":
      "昨天晚上失火了。":
        "native": "There was a fire last night."
        "bases":
          "了":
            "meaning": "(a change has happened)"
      "厨房失火了，快打电话。":
        "native": "The kitchen is on fire, call quickly."
        "bases":
          "了":
            "meaning": "(a change has happened)"
  "zh-4173":
    "native": "explode; an explosion"
    "notes":
      "n1": "爆炸 (bàozhà): explode; an explosion. It is one of the words a safety notice or an emergency uses."
    "examples":
      "汽车爆炸了。":
        "native": "The car exploded."
        "bases":
          "了":
            "meaning": "(a change has happened)"
      "那个工厂发生爆炸。":
        "native": "There was an explosion at that factory."
  "zh-4174":
    "native": "police line; cordon"
    "notes":
      "n1": "警戒线 (jǐngjièxiàn): police line; cordon. It is one of the words a safety notice or an emergency uses."
    "examples":
      "请不要越过警戒线。":
        "native": "Please do not cross the police line."
      "警戒线外面很安全。":
        "native": "It is safe outside the police line."
  "zh-4175":
    "native": "shelter"
    "notes":
      "n1": "避难所 (bìnànsuǒ): shelter. It is one of the words a safety notice or an emergency uses."
    "examples":
      "避难所在学校里。":
        "native": "The shelter is in the school."
        "bases":
          "在":
            "meaning": "is"
      "我们去避难所吧。":
        "native": "Let's go to the shelter."
  "zh-4176":
    "native": "emergency (as an adjective)"
    "notes":
      "n1": "应急 (yìngjí): emergency (as an adjective). It is one of the words a safety notice or an emergency uses."
    "examples":
      "家里要准备应急包。":
        "native": "Keep an emergency kit at home."
      "这是应急电话。":
        "native": "This is an emergency telephone."
  "zh-4177":
    "native": "escape from"
    "notes":
      "n1": "逃离 (táolí): escape from. It is one of the words a safety notice or an emergency uses."
    "examples":
      "他们从火里逃离了。":
        "native": "They escaped from the fire."
        "bases":
          "从":
            "meaning": "from"
          "了":
            "meaning": "(a change has happened)"
      "狗从房间里逃离了。":
        "native": "The dog escaped from the room."
        "bases":
          "从":
            "meaning": "from"
          "了":
            "meaning": "(a change has happened)"
  "zh-4178":
    "native": "hide"
    "notes":
      "n1": "躲藏 (duǒcáng): hide. It is one of the words a safety notice or an emergency uses."
    "examples":
      "孩子躲藏在床下。":
        "native": "The child is hiding under the bed."
        "bases":
          "在":
            "meaning": "(marks the place)"
      "请不要躲藏，出来吧。":
        "native": "Please do not hide, come out."
  "zh-4179":
    "native": "life jacket"
    "notes":
      "n1": "救生衣 (jiùshēngyī): life jacket. It is one of the words a safety notice or an emergency uses."
    "examples":
      "下水前要穿救生衣。":
        "native": "Wear a life jacket before going into the water."
      "这件救生衣是新的。":
        "native": "This life jacket is new."
        "bases":
          "的":
            "meaning": "(linking word)"
  "zh-4180":
    "native": "flood and waterlogging"
    "notes":
      "n1": "洪涝 (hónglào): flood and waterlogging. It is one of the words a safety notice or an emergency uses."
    "examples":
      "今年洪涝很严重。":
        "native": "The floods are very serious this year."
      "洪涝以后要注意疾病。":
        "native": "After floods, watch out for disease."
  "zh-4181":
    "native": "disaster prevention"
    "notes":
      "n1": "防灾 (fángzāi): disaster prevention. It is one of the words a safety notice or an emergency uses."
    "examples":
      "学校每年都有防灾演习。":
        "native": "The school holds a disaster drill every year."
      "要做好防灾准备。":
        "native": "Get ready for disasters."
  "zh-4182":
    "native": "go missing"
    "notes":
      "n1": "失踪 (shīzōng): go missing. It is one of the words a safety notice or an emergency uses."
    "examples":
      "那个男人失踪了。":
        "native": "That man has gone missing."
        "bases":
          "了":
            "meaning": "(a change has happened)"
      "有三个人失踪了。":
        "native": "Three people have gone missing."
        "bases":
          "了":
            "meaning": "(a change has happened)"
  "zh-4183":
    "native": "aftershock"
    "notes":
      "n1": "余震 (yúzhèn): aftershock. It is one of the words a safety notice or an emergency uses."
    "examples":
      "地震以后有很多余震。":
        "native": "After the earthquake there were many aftershocks."
      "余震很小，大家不要怕。":
        "native": "The aftershocks are small, so don't be afraid, everyone."
