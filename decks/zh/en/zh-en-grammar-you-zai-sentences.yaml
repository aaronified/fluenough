schema: 1
id: "zh-en-grammar-you-zai-sentences"
kind: "layer"
core: "zh-grammar-you-zai-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "有 (yǒu), 没有 (méiyǒu) and 在 (zài) in sentences"
license: "CC-BY-SA-4.0"
description: "Eight sentences that say what someone has, does not have, and where things are. Not yet checked by a Mandarin speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "zh-0630":
    "native": "I have a key."
    "confusables":
      "w1":
        "why": "是 (shì) would say I am, not I have."
      "w2":
        "why": "你 (nǐ) would say you: you have a key."
    "bases":
      "有": { "meaning": "to have" }
  "zh-0631":
    "native": "I do not have a key."
    "confusables":
      "w1":
        "why": "不 (bù) would say not, but not with 有 (yǒu): it is 没有 (méiyǒu)."
      "w2":
        "why": "她 (tā) would say she: she does not have a key."
    "bases":
      "没有": { "meaning": "not to have" }
  "zh-0632":
    "native": "Do you have a book?"
    "confusables":
      "w1":
        "why": "我 (wǒ) would say I: do I have a book?"
      "w2":
        "why": "呢 (ne) would ask and you?, a different question."
    "bases":
      "有": { "meaning": "to have" }
  "zh-0633":
    "native": "The keys are on the table."
    "confusables":
      "w1":
        "why": "下 (xià) would say under: the keys are under the table."
      "w2":
        "why": "里 (lǐ) would say in: the keys are in the table."
  "zh-0634":
    "native": "Where is the book?"
    "confusables":
      "w1":
        "why": "哪 (nǎ) would ask which, as in which book."
      "w2":
        "why": "谁 (shéi) would ask who, not where."
  "zh-0635":
    "native": "The chair is in the room."
    "confusables":
      "w1":
        "why": "上 (shàng) would say on: the chair is on the room."
      "w2":
        "why": "外面 (wàimiàn) would say outside: the chair is outside the room."
  "zh-0636":
    "native": "He does not have a phone."
    "confusables":
      "w1":
        "why": "她 (tā) would say she, not he."
      "w2":
        "why": "我 (wǒ) would say I, not he."
    "bases":
      "没有": { "meaning": "not to have" }
