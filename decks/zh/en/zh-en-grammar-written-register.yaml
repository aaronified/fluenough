  "notes": "Notices, news and official letters use a written style that differs from talk. Many written words have two syllables where talk has one or a phrase: 会议明天举行 (huìyì míngtiān jǔxíng) for 我们明天开会 (wǒmen míngtiān kāihuì), and 这里禁止停车 (zhèlǐ jìnzhǐ tíngchē) for 这里不能停车 (zhèlǐ bù néng tíngchē). A few small words change too: 已 (yǐ) for 已经 (yǐjīng), already; 及 (jí) for 和 (hé), and; 均 (jūn) for 都 (dōu), all. Written style is also more polite: 感谢 (gǎnxiè) and 您 (nín) for 谢谢 (xièxie) and 你 (nǐ). Use the written word in a notice or a letter, and the spoken one with friends: saying 我支付费用 (wǒ zhīfù fèiyòng) aloud in a shop sounds stiff. The meaning of each pair is the same."
