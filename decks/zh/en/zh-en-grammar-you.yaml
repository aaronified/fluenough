  "notes": "有 (yǒu) is to have, and it is the same for every person: 我有 (wǒ yǒu), 你有 (nǐ yǒu), 他有 (tā yǒu), 我们有 (wǒmen yǒu). The noun does not change for a plural: 我们有书 (wǒmen yǒu shū), we have books. 有 (yǒu) takes the thing had after it, and no 是 (shì) is needed. A number or a measure word goes between 有 (yǒu) and its noun; those come with the measure words, later in the course."
