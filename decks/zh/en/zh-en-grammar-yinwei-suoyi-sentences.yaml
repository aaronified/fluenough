"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "因为 (yīnwèi), 虽然 (suīrán), 还是 (háishi) and 或者 (huòzhě) in sentences"
"description": "Sentences that join two ideas: because ... so, although ... but, and or in a question and in a statement. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-2040":
    "confusables":
      "w1":
        "why": "晴天 (qíngtiān) is a sunny day, the opposite of rain."
      "w2":
        "why": "阴天 (yīntiān) is a cloudy day, not rain."
    "bases":
      "因为":
        "meaning": "because"
      "所以":
        "meaning": "so; therefore"
    "native": "Because it is raining, I do not go out."
  "zh-2041":
    "confusables":
      "w1":
        "why": "便宜 (piányi) is cheap, the opposite of expensive."
      "w2":
        "why": "快 (kuài) is fast, not a price."
    "bases":
      "虽然":
        "meaning": "although"
      "但是":
        "meaning": "but"
    "native": "Although it is expensive, it is very good."
  "zh-2042":
    "confusables":
      "w1":
        "why": "水 (shuǐ) is water, another drink."
      "w2":
        "why": "果汁 (guǒzhī) is fruit juice, another drink."
    "native": "Tea or coffee?"
  "zh-2043":
    "confusables":
      "w1":
        "why": "饭馆 (fànguǎn) is a restaurant, another place."
      "w2":
        "why": "医院 (yīyuàn) is a hospital, another place."
    "bases":
      "或者":
        "meaning": "or (in a statement)"
    "native": "We go to school or to the park."
  "zh-2044":
    "confusables":
      "w1":
        "why": "渴 (kě) is thirsty, a different need."
      "w2":
        "why": "饱 (bǎo) is full, the state after eating."
    "bases":
      "所以":
        "meaning": "so; therefore"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "He is very hungry, so he ate two steamed buns."
  "zh-2045":
    "confusables":
      "w1":
        "why": "忙 (máng) is busy, not tired."
      "w2":
        "why": "难 (nán) is difficult, a different word."
    "bases":
      "虽然":
        "meaning": "although"
      "但是":
        "meaning": "but"
    "native": "Although I am tired, I am very happy."
  "zh-2046":
    "confusables":
      "w1":
        "why": "飞机 (fēijī) is a plane, a different way to travel."
      "w2":
        "why": "船 (chuán) is a boat, a different way to travel."
    "native": "Do you go by bus or by metro?"
  "zh-2047":
    "confusables":
      "w1":
        "why": "热 (rè) is hot, the opposite of cold."
      "w2":
        "why": "凉快 (liángkuai) is cool and pleasant, not cold."
    "bases":
      "因为":
        "meaning": "because"
      "所以":
        "meaning": "so; therefore"
    "native": "Because the weather is cold, I wear a coat."
