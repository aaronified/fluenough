"name": "还是 (háishi) and 或者 (huòzhě): or"
"license": "CC-BY-SA-4.0"
"description": "Offering a choice: 还是 (háishi) is or in a question, and 或者 (huòzhě) is or in a statement. Not yet checked by a Mandarin speaker: please report any mistake."
