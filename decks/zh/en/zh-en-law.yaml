"schema": 1
"id": "zh-en-law"
"kind": "layer"
"core": "zh-law"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Law"
"description": "Forty words for the police, the courts, rights and the rules: crime, arrest, prison, bail, contracts, duty and privacy. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-4190":
    "native": "statute; formal regulation"
    "notes":
      "n1": "法规 (fǎguī) is a formal legal rule, such as a regulation that a government office makes under a law. Compare 法律 (fǎlǜ), the law itself, and 规定 (guīdìng), the everyday rule of an office or a school."
    "examples":
      "这个城市有新的交通法规。":
        "native": "This city has new traffic regulations."
        "bases":
          "这个":
            "meaning": "this"
          "有":
            "meaning": "has; there is"
          "的":
            "meaning": "of; 's"
          "交通":
            "meaning": "traffic"
      "工厂必须遵守安全法规。":
        "native": "The factory must follow the safety regulations."
        "bases":
          "必须":
            "meaning": "must"
          "遵守":
            "meaning": "to obey; to observe"
  "zh-4191":
    "native": "to break the law; unlawful"
    "notes":
      "n1": "违法 (wéifǎ) is to break the law by one act, such as 违法停车 (wéifǎ tíngchē), parking where it is banned. The opposite is 合法 (héfǎ), legal."
    "examples":
      "他违法停车，被罚款了。":
        "native": "He parked illegally and was fined."
        "bases":
          "被":
            "meaning": "passive marker"
          "了":
            "meaning": "completed action"
      "这种行为是违法的。":
        "native": "This kind of behaviour is against the law."
        "bases":
          "这种":
            "meaning": "this kind of"
          "行为":
            "meaning": "behaviour"
          "的":
            "meaning": "of; 's"
  "zh-4192":
    "native": "legal; lawful"
    "notes":
      "n1": "合法 (héfǎ) describes a thing or an activity that the law allows, as in 合法的工作 (héfǎ de gōngzuò), a legal job. Its opposite is 非法 (fēifǎ)."
    "examples":
      "这家公司是合法经营的。":
        "native": "This company runs its business legally."
        "bases":
          "这家":
            "meaning": "this (a company)"
          "经营":
            "meaning": "to run (a business)"
          "的":
            "meaning": "of; 's"
      "他找到了一份合法的工作。":
        "native": "He found a legal job."
        "bases":
          "找到":
            "meaning": "to find"
          "了":
            "meaning": "completed action"
          "一份":
            "meaning": "a (a job or a document)"
          "的":
            "meaning": "of; 's"
  "zh-4193":
    "native": "illegal"
    "notes":
      "n1": "非法 (fēifǎ) is illegal, and is used of a whole trade or activity that is banned, such as 非法买卖 (fēifǎ mǎimài), illegal trade. For one act people say 违法 (wéifǎ)."
    "examples":
      "警方查获了一批非法药品。":
        "native": "The police seized a batch of illegal drugs."
        "bases":
          "警方":
            "meaning": "the police"
          "查获":
            "meaning": "to seize; to find and confiscate"
          "了":
            "meaning": "completed action"
          "一批":
            "meaning": "a batch of"
          "药品":
            "meaning": "medicine"
      "非法买卖是违法的。":
        "native": "Illegal trade is against the law."
        "bases":
          "买卖":
            "meaning": "trade"
          "的":
            "meaning": "of; 's"
  "zh-4194":
    "native": "police station (local)"
    "notes":
      "n1": "派出所 (pàichūsuǒ) is the local police station, the one a person goes to first in a neighbourhood. A bigger office is 警察局 (jǐngchájú). People say 去派出所 (qù pàichūsuǒ), go to the police station."
    "examples":
      "他去派出所报案了。":
        "native": "He went to the police station to report a crime."
        "bases":
          "了":
            "meaning": "completed action"
      "派出所就在车站旁边。":
        "native": "The police station is right beside the station."
  "zh-4195":
    "native": "police officer"
    "notes":
      "n1": "警官 (jǐngguān) is a police officer, a more formal word than 警察 (jǐngchá) in a report or a notice. With a surname it is a title: 王警官 (Wáng jǐngguān), Officer Wang."
    "examples":
      "那位警官很耐心。":
        "native": "That police officer is very patient."
        "bases":
          "那位":
            "meaning": "that (a person, polite)"
      "王警官让我填一张表。":
        "native": "Officer Wang asked me to fill in a form."
        "bases":
          "让":
            "meaning": "to let; to ask"
          "一张":
            "meaning": "a (a sheet or a form)"
          "表":
            "meaning": "form; table"
  "zh-4196":
    "native": "witness"
    "notes":
      "n1": "证人 (zhèngrén) is a person who saw or knows about an event. To act as one is 做证人 (zuò zhèngrén). The verb for giving evidence in court is 作证 (zuòzhèng), so say 他作证 (tā zuòzhèng), he testified."
    "examples":
      "他是这个案子的证人。":
        "native": "He is a witness in this case."
        "bases":
          "这个":
            "meaning": "this"
          "案子":
            "meaning": "case (a legal matter)"
          "的":
            "meaning": "of; 's"
      "证人说他看见了那辆车。":
        "native": "The witness said he saw that car."
        "bases":
          "了":
            "meaning": "completed action"
          "那辆":
            "meaning": "that (a vehicle)"
  "zh-4197":
    "native": "testimony; a statement given as a witness"
    "notes":
      "n1": "证词 (zhèngcí) is what a witness says, in a statement or in court. 证人 (zhèngrén) is the person and 证词 (zhèngcí) the words. Use it for the account, not for a document of identity."
    "examples":
      "他的证词和录像不一样。":
        "native": "His testimony does not match the video."
        "bases":
          "的":
            "meaning": "of; 's"
          "和":
            "meaning": "and"
          "录像":
            "meaning": "video recording"
          "一样":
            "meaning": "the same"
      "请把你的证词写在这里。":
        "native": "Please write your statement here."
        "bases":
          "把":
            "meaning": "marker of an object moved"
          "的":
            "meaning": "of; 's"
          "这里":
            "meaning": "here"
  "zh-4198":
    "native": "to commit a crime"
    "notes":
      "n1": "犯罪 (fànzuì) is to commit a crime. The noun 罪犯 (zuìfàn) is the person who did it, and 犯罪率 (fànzuìlǜ) is the crime rate. Do not use it for a small fault such as a late arrival."
    "examples":
      "这个人犯罪了。":
        "native": "This person committed a crime."
        "bases":
          "这个":
            "meaning": "this"
          "了":
            "meaning": "completed action"
      "很多人为了钱而犯罪。":
        "native": "Many people commit crimes for money."
        "bases":
          "很多":
            "meaning": "many"
          "为了":
            "meaning": "for the sake of"
          "而":
            "meaning": "and so; in order to"
  "zh-4199":
    "native": "crime; guilt"
    "notes":
      "n1": "罪 (zuì) is the crime itself or guilt. It appears in 有罪 (yǒuzuì), guilty, and 无罪 (wúzuì), not guilty, and in 认罪 (rènzuì), to admit guilt. A person who did it is 罪犯 (zuìfàn)."
    "examples":
      "他没有罪。":
        "native": "He is not guilty."
        "bases":
          "没有":
            "meaning": "there is not; did not"
      "这种罪很严重。":
        "native": "This kind of crime is very serious."
        "bases":
          "这种":
            "meaning": "this kind of"
          "严重":
            "meaning": "serious"
  "zh-4200":
    "native": "guilty"
    "notes":
      "n1": "有罪 (yǒuzuì) is guilty, as decided by a court: 法院判他有罪 (fǎyuàn pàn tā yǒuzuì), the court found him guilty. It is a verdict, so do not use it for saying sorry."
    "examples":
      "法院认为他有罪。":
        "native": "The court found him guilty."
        "bases":
          "认为":
            "meaning": "to think; to consider"
      "他被判有罪。":
        "native": "He was sentenced as guilty."
        "bases":
          "被":
            "meaning": "passive marker"
          "判":
            "meaning": "to judge; to sentence"
  "zh-4201":
    "native": "not guilty"
    "notes":
      "n1": "无罪 (wúzuì) is not guilty, the verdict of a court when the charge fails. 他被判无罪 (tā bèi pàn wúzuì), he was found not guilty. The opposite is 有罪 (yǒuzuì)."
    "examples":
      "法院判他无罪。":
        "native": "The court found him not guilty."
        "bases":
          "判":
            "meaning": "to judge; to sentence"
      "他的证据证明他无罪。":
        "native": "His evidence proves that he is innocent."
        "bases":
          "的":
            "meaning": "of; 's"
  "zh-4202":
    "native": "suspect"
    "notes":
      "n1": "嫌疑人 (xiányírén) is a suspect: a person the police are looking at, who has not yet been found guilty. Use it before a court decides; afterwards the person is a defendant."
    "examples":
      "警方还在找嫌疑人。":
        "native": "The police are still looking for the suspect."
        "bases":
          "警方":
            "meaning": "the police"
      "嫌疑人已经被带到派出所了。":
        "native": "The suspect has already been taken to the police station."
        "bases":
          "被":
            "meaning": "passive marker"
          "带到":
            "meaning": "to take to"
          "了":
            "meaning": "completed action"
  "zh-4203":
    "native": "to rob"
    "notes":
      "n1": "抢劫 (qiǎngjié) is robbery: taking something with force or a threat of force. A theft without force is 偷 (tōu), to steal. A robber is a 抢劫犯 (qiǎngjiéfàn)."
    "examples":
      "有人在路上抢劫。":
        "native": "There was a robbery in the street."
        "bases":
          "有人":
            "meaning": "someone"
          "路上":
            "meaning": "on the road"
      "他抢劫了一家银行。":
        "native": "He robbed a bank."
        "bases":
          "了":
            "meaning": "completed action"
          "一家":
            "meaning": "a (a company)"
  "zh-4204":
    "native": "to defraud; to scam"
    "notes":
      "n1": "诈骗 (zhàpiàn) is to cheat someone out of money by a lie, as in 电话诈骗 (diànhuà zhàpiàn), phone fraud. Warnings about it use 小心 (xiǎoxīn), be careful, and 不要相信 (búyào xiāngxìn), do not trust."
    "examples":
      "有人用电话诈骗老人。":
        "native": "Someone is using the phone to scam an old person."
        "bases":
          "有人":
            "meaning": "someone"
          "用":
            "meaning": "to use"
          "老人":
            "meaning": "old person"
      "不要相信陌生人的电话，小心诈骗。":
        "native": "Do not trust calls from strangers; watch out for fraud."
        "bases":
          "不要":
            "meaning": "do not"
          "陌生人":
            "meaning": "stranger"
          "的":
            "meaning": "of; 's"
  "zh-4205":
    "native": "to arrest"
    "notes":
      "n1": "逮捕 (dàibǔ) is to arrest, a formal act that needs an order, so it is the word in news reports. In talk people say 被抓 (bèi zhuā), to be caught, and the police word for a short hold is 拘留 (jūliú)."
    "examples":
      "警察昨天逮捕了他。":
        "native": "The police arrested him yesterday."
        "bases":
          "了":
            "meaning": "completed action"
      "他被逮捕了。":
        "native": "He was arrested."
        "bases":
          "被":
            "meaning": "passive marker"
          "了":
            "meaning": "completed action"
  "zh-4206":
    "native": "to detain (for a short time)"
    "notes":
      "n1": "拘留 (jūliú) is to hold someone for days, not years. It is a penalty for a minor offence and also the hold before a charge. For a long term in prison use 坐牢 (zuòláo)."
    "examples":
      "他被拘留了三天。":
        "native": "He was held for three days."
        "bases":
          "被":
            "meaning": "passive marker"
          "了":
            "meaning": "completed action"
          "三天":
            "meaning": "three days"
      "这个人因为打人被拘留了。":
        "native": "This man was detained for hitting someone."
        "bases":
          "这个":
            "meaning": "this"
          "因为":
            "meaning": "because"
          "被":
            "meaning": "passive marker"
          "了":
            "meaning": "completed action"
  "zh-4207":
    "native": "prison"
    "notes":
      "n1": "监狱 (jiānyù) is the prison, the building. 坐牢 (zuòláo) is the state of serving a sentence there, and 进监狱 (jìn jiānyù) is to go into prison."
    "examples":
      "他被关进了监狱。":
        "native": "He was locked up in prison."
        "bases":
          "被":
            "meaning": "passive marker"
          "关进":
            "meaning": "to lock in"
          "了":
            "meaning": "completed action"
      "这座监狱很大。":
        "native": "This prison is very big."
        "bases":
          "这座":
            "meaning": "this (a building)"
  "zh-4208":
    "native": "to be in prison; to serve a prison sentence"
    "notes":
      "n1": "坐牢 (zuòláo) is to be in prison, said of the sentence and the time served. It is common in speech: 坐了三年牢 (zuò le sān nián láo), served three years. It is not a place; the place is 监狱 (jiānyù)."
    "examples":
      "他因为诈骗坐牢了。":
        "native": "He went to prison for fraud."
        "bases":
          "因为":
            "meaning": "because"
          "了":
            "meaning": "completed action"
      "坐牢的人不能随便出来。":
        "native": "A person in prison cannot simply come out."
        "bases":
          "的":
            "meaning": "of; 's"
          "不能":
            "meaning": "cannot"
          "随便":
            "meaning": "casually; at will"
          "出来":
            "meaning": "to come out"
  "zh-4209":
    "native": "to bail out; to grant bail"
    "notes":
      "n1": "保释 (bǎoshì) is to let a person wait for trial outside prison, by paying money or giving a promise. The money is 保释金 (bǎoshìjīn), bail. It is said of the court or of the family: 交保释金 (jiāo bǎoshìjīn), to pay the bail."
    "examples":
      "法院同意保释他。":
        "native": "The court agreed to bail him out."
      "他已经被保释了。":
        "native": "He has already been released on bail."
        "bases":
          "被":
            "meaning": "passive marker"
          "了":
            "meaning": "completed action"
  "zh-4210":
    "native": "to sue; to prosecute"
    "notes":
      "n1": "起诉 (qǐsù) is to bring a case to court. A private person sues a company or a neighbour; in a criminal case the state prosecutes. Both use 起诉 (qǐsù), so the context decides who is doing it."
    "examples":
      "他决定起诉那家公司。":
        "native": "He decided to sue that company."
        "bases":
          "那家":
            "meaning": "that (a company)"
      "检察院起诉了他。":
        "native": "The prosecutors charged him."
        "bases":
          "检察院":
            "meaning": "prosecutor's office"
          "了":
            "meaning": "completed action"
  "zh-4211":
    "native": "lawsuit; litigation"
    "notes":
      "n1": "诉讼 (sùsòng) is a legal case in court, a formal word. In everyday speech people say 打官司 (dǎ guānsi), to go to court, and 诉讼 (sùsòng) is used in notices and in news reports."
    "examples":
      "这场诉讼拖了三年。":
        "native": "This lawsuit dragged on for three years."
        "bases":
          "这场":
            "meaning": "this (a court case)"
          "拖":
            "meaning": "to drag on"
          "了":
            "meaning": "completed action"
          "三年":
            "meaning": "three years"
      "他们正在进行一场诉讼。":
        "native": "They are in a lawsuit."
        "bases":
          "正在":
            "meaning": "in the middle of"
          "进行":
            "meaning": "to carry on"
          "一场":
            "meaning": "a (a case or a match)"
  "zh-4212":
    "native": "to appeal"
    "notes":
      "n1": "上诉 (shàngsù) is to appeal a court's judgment to a higher court. It comes only after 判决 (pànjué), the judgment, has been given, so you cannot appeal before the trial ends."
    "examples":
      "他不服判决，决定上诉。":
        "native": "He does not accept the judgment and decides to appeal."
        "bases":
          "不服":
            "meaning": "not to accept"
      "律师说可以上诉。":
        "native": "The lawyer says he can appeal."
        "bases":
          "可以":
            "meaning": "may; can"
  "zh-4213":
    "native": "judgment; sentence (of a court)"
    "notes":
      "n1": "判决 (pànjué) is a court's judgment, the decision and sentence together. As a verb it is to rule: 法院判决 (fǎyuàn pànjué), the court ruled. Newspapers print it as the final word of a case."
    "examples":
      "法院的判决今天公布了。":
        "native": "The court's judgment was announced today."
        "bases":
          "的":
            "meaning": "of; 's"
          "了":
            "meaning": "completed action"
      "法官宣读了判决。":
        "native": "The judge read out the judgment."
        "bases":
          "宣读":
            "meaning": "to read out formally"
          "了":
            "meaning": "completed action"
  "zh-4214":
    "native": "to defend (in court)"
    "notes":
      "n1": "辩护 (biànhù) is to defend a person in court. The lawyer who does it is a 辩护律师 (biànhù lǜshī), a defence lawyer. Use it for legal defence, not for defending an opinion in a debate."
    "examples":
      "律师为他辩护。":
        "native": "The lawyer defended him."
        "bases":
          "为":
            "meaning": "for"
      "他请了一位律师为他辩护。":
        "native": "He hired a lawyer to defend him."
        "bases":
          "了":
            "meaning": "completed action"
          "一位":
            "meaning": "a (a person, polite)"
          "为":
            "meaning": "for"
  "zh-4215":
    "native": "to mediate"
    "notes":
      "n1": "调解 (tiáojiě) is to help two sides reach an agreement without a court. Quarrels between neighbours and small contract disputes are often settled this way, through 人民调解 (rénmín tiáojiě), community mediation."
    "examples":
      "邻居之间的矛盾，可以先调解。":
        "native": "A quarrel between neighbours can be mediated first."
        "bases":
          "之间":
            "meaning": "between"
          "的":
            "meaning": "of; 's"
          "可以":
            "meaning": "may; can"
      "社区请人来调解。":
        "native": "The community asked someone to mediate."
  "zh-4216":
    "native": "written record of a statement"
    "notes":
      "n1": "笔录 (bǐlù) is the written record of what a person said, as taken at a police station. You are asked to read it and sign it, so check it before you 签字 (qiānzì), sign. It is not the same as 证词 (zhèngcí), which is the account itself."
    "examples":
      "请你看一下笔录，没问题就签字。":
        "native": "Please read the record, and if it is right, sign."
        "bases":
          "看一下":
            "meaning": "to take a look"
          "没问题":
            "meaning": "no problem"
      "警察做了笔录。":
        "native": "The police took a written statement."
        "bases":
          "了":
            "meaning": "completed action"
  "zh-4217":
    "native": "to report lost (a card or a phone)"
    "notes":
      "n1": "挂失 (guàshī) is to report a card, a phone or a book as lost so that it can be stopped or replaced. A bank card is reported at the bank, not at the police station, which only takes a report of a crime."
    "examples":
      "我的银行卡丢了，要马上挂失。":
        "native": "I have lost my bank card and must report it lost at once."
        "bases":
          "的":
            "meaning": "of; 's"
          "银行卡":
            "meaning": "bank card"
          "了":
            "meaning": "completed action"
          "要":
            "meaning": "must; to want"
      "手机丢了可以去营业厅挂失。":
        "native": "If you lose your phone you can report it lost at the shop."
        "bases":
          "了":
            "meaning": "completed action"
          "可以":
            "meaning": "may; can"
          "营业厅":
            "meaning": "shop or office of a company"
  "zh-4218":
    "native": "identity papers; official card"
    "notes":
      "n1": "证件 (zhèngjiàn) is any identity document or official card: an ID card, a passport, a driving licence. 身份证 (shēnfènzhèng) is the everyday word for the ID card itself, so use 证件 (zhèngjiàn) when you mean the whole set."
    "examples":
      "请带好您的证件。":
        "native": "Please bring your identity papers."
        "bases":
          "带好":
            "meaning": "to bring along"
          "的":
            "meaning": "of; 's"
      "这个窗口只办证件。":
        "native": "This counter only handles identity papers."
        "bases":
          "这个":
            "meaning": "this"
          "办":
            "meaning": "to handle; to do"
  "zh-4219":
    "native": "driving licence"
    "notes":
      "n1": "驾照 (jiàzhào) is a driving licence. To take the driving test is 考驾照 (kǎo jiàzhào). Without one you cannot drive a car legally, and you may be fined."
    "examples":
      "他拿到了驾照。":
        "native": "He got his driving licence."
        "bases":
          "拿到":
            "meaning": "to get; to obtain"
          "了":
            "meaning": "completed action"
      "没有驾照不能开车。":
        "native": "You cannot drive without a licence."
        "bases":
          "没有":
            "meaning": "there is not; did not"
          "不能":
            "meaning": "cannot"
  "zh-4220":
    "native": "a fine (money); to fine"
    "notes":
      "n1": "罚款 (fákuǎn) is a fine, the money one pays, and also the verb to fine someone. Its usual phrase is 交罚款 (jiāo fákuǎn), to pay a fine. It is used for littering, parking and traffic offences."
    "examples":
      "乱扔垃圾要交罚款。":
        "native": "Littering means paying a fine."
        "bases":
          "乱扔":
            "meaning": "to throw about"
          "要":
            "meaning": "must; to want"
          "交":
            "meaning": "to pay; to hand over"
      "他被罚款了。":
        "native": "He was fined."
        "bases":
          "被":
            "meaning": "passive marker"
          "了":
            "meaning": "completed action"
  "zh-4221":
    "native": "duty; obligation"
    "notes":
      "n1": "义务 (yìwù) is a duty that a person must do, by law or by a moral obligation, such as 纳税的义务 (nàshuì de yìwù), the duty to pay tax. The opposite side in legal talk is 权利 (quánlì), a right."
    "examples":
      "每个公民都有纳税的义务。":
        "native": "Every citizen has a duty to pay tax."
        "bases":
          "每个":
            "meaning": "every"
          "有":
            "meaning": "has; there is"
          "的":
            "meaning": "of; 's"
      "帮助别人不是我的义务。":
        "native": "Helping others is not my duty."
        "bases":
          "不是":
            "meaning": "is not"
          "的":
            "meaning": "of; 's"
  "zh-4222":
    "native": "clause; term (of a contract or law)"
    "notes":
      "n1": "条款 (tiáokuǎn) is one clause or term in a contract, a law or an agreement. 合同条款 (hétong tiáokuǎn) is a contract term. Read the 条款 (tiáokuǎn) before you sign, because the small print is where the terms are."
    "examples":
      "合同的第三条款很重要。":
        "native": "The third clause of the contract is very important."
        "bases":
          "的":
            "meaning": "of; 's"
      "签字前请仔细看条款。":
        "native": "Please read the terms carefully before you sign."
        "bases":
          "仔细":
            "meaning": "carefully"
  "zh-4223":
    "native": "rule; regulation"
    "notes":
      "n1": "规定 (guīdìng) is a rule set by an office, a school or a company, and is less formal than 法律 (fǎlǜ), the law. 按规定 (àn guīdìng) means as the rules say. As a verb, 法律规定 (fǎlǜ guīdìng) means the law stipulates."
    "examples":
      "学校有很多规定。":
        "native": "The school has many rules."
        "bases":
          "有":
            "meaning": "has; there is"
          "很多":
            "meaning": "many"
      "按照规定，这里不能停车。":
        "native": "According to the rules, you cannot park here."
        "bases":
          "按照":
            "meaning": "according to"
          "这里":
            "meaning": "here"
          "不能":
            "meaning": "cannot"
  "zh-4224":
    "native": "to forbid; to ban"
    "notes":
      "n1": "禁止 (jìnzhǐ) is to forbid, usually on a sign or in a notice: 禁止停车 (jìnzhǐ tíngchē), no parking. It is stronger than saying 不允许 (bù yǔnxǔ), not allowed, which is the word in conversation."
    "examples":
      "这里禁止吸烟。":
        "native": "Smoking is forbidden here."
        "bases":
          "这里":
            "meaning": "here"
          "吸烟":
            "meaning": "to smoke"
      "法律禁止随便扔垃圾。":
        "native": "The law forbids throwing rubbish about."
        "bases":
          "随便":
            "meaning": "casually; at will"
  "zh-4225":
    "native": "to allow; to permit"
    "notes":
      "n1": "允许 (yǔnxǔ) is to allow, to give permission, in a rule or in a person's word: 允许拍照 (yǔnxǔ pāizhào), photography is allowed. The opposite is 禁止 (jìnzhǐ), to forbid."
    "examples":
      "博物馆允许拍照吗？":
        "native": "Is photography allowed in the museum?"
      "老师不允许迟到。":
        "native": "The teacher does not allow lateness."
  "zh-4226":
    "native": "to report (a crime or wrongdoing) to the authorities"
    "notes":
      "n1": "举报 (jǔbào) is to report a wrongdoing or a crime to the authorities, not only to the police: a company, a restaurant or a neighbour can be reported. For a lost card, use 挂失 (guàshī), not 举报 (jǔbào)."
    "examples":
      "有人向警察举报了他。":
        "native": "Someone reported him to the police."
        "bases":
          "有人":
            "meaning": "someone"
          "向":
            "meaning": "to; towards"
          "了":
            "meaning": "completed action"
      "你可以打举报电话。":
        "native": "You can call the report hotline."
        "bases":
          "可以":
            "meaning": "may; can"
  "zh-4227":
    "native": "privacy"
    "notes":
      "n1": "隐私 (yǐnsī) is privacy, a person's private life, data and secrets. The usual phrases are 保护隐私 (bǎohù yǐnsī), to protect privacy, and 侵犯隐私 (qīnfàn yǐnsī), to invade privacy."
    "examples":
      "请保护别人的隐私。":
        "native": "Please respect other people's privacy."
        "bases":
          "的":
            "meaning": "of; 's"
      "未经同意，不能公开别人的隐私。":
        "native": "Without consent, you cannot make other people's private life public."
        "bases":
          "未经":
            "meaning": "without (approval)"
          "不能":
            "meaning": "cannot"
          "的":
            "meaning": "of; 's"
  "zh-4228":
    "native": "to lose (formal)"
    "notes":
      "n1": "遗失 (yíshī) is to lose something, a formal word used in notices and certificates: 遗失声明 (yíshī shēngmíng), a notice of loss. In talk people say 丢 (diū), to lose."
    "examples":
      "护照遗失了，要去领事馆补办。":
        "native": "The passport was lost, so he must go to the consulate to get a new one."
        "bases":
          "了":
            "meaning": "completed action"
          "要":
            "meaning": "must; to want"
          "补办":
            "meaning": "to re-apply for"
      "这张票已经遗失了。":
        "native": "This ticket has already been lost."
        "bases":
          "这张":
            "meaning": "this (a ticket)"
          "了":
            "meaning": "completed action"
  "zh-4229":
    "native": "plaintiff; the person who brings a case to court"
    "notes":
      "n1": "原告 (yuángào) is the plaintiff, the person who brings a case to court and asks for a remedy. The person being sued is 被告 (bèigào), the defendant. The two words always come as a pair in a case."
    "examples":
      "原告在法庭上讲了话。":
        "native": "The plaintiff spoke in court."
        "bases":
          "法庭":
            "meaning": "court room"
          "了":
            "meaning": "completed action"
          "话":
            "meaning": "words; speech"
      "原告说被告欠了他的钱。":
        "native": "The plaintiff says the defendant owes him money."
        "bases":
          "被告":
            "meaning": "defendant"
          "欠":
            "meaning": "to owe"
          "了":
            "meaning": "completed action"
          "的":
            "meaning": "of; 's"
