name: 'Culture: Tang and Song poems'
description: 'Eighteen short poems from the Tang and Song periods, in the public domain. Each shows who wrote it, when, and where it comes from. The text is shown in simplified characters, with the traditional
  form beside it. Not yet checked by a Chinese speaker: please report any mistake.'
license: CC-BY-SA-4.0
tags:
- unreviewed
cards:
  zh-6000:
    native: In spring I sleep on and miss the dawn; birds sing everywhere; after last night's wind and rain, how many flowers have fallen?
    notes:
      n1: Meng Haoran (689 or 691 to 740) wrote this short poem about waking late in spring. 啼 (tí) is the cry of a bird, and 晓 (xiǎo) is the dawn.
    bases:
      春眠:
        meaning: spring sleep
      觉:
        meaning: to wake up, to become aware
      晓:
        meaning: dawn
      处处:
        meaning: everywhere
      啼鸟:
        meaning: singing birds
      夜来:
        meaning: last night, during the night
      风雨:
        meaning: wind and rain
      声:
        meaning: sound
      花落:
        meaning: the flowers fall
      多少:
        meaning: how many, how much
  zh-6001:
    native: Before my bed the moonlight is so bright that I take it for frost on the ground; I raise my head to the moon and lower it, thinking of home.
    notes:
      n1: Li Bai (701 to 762) wrote this quatrain while away from home. The text is the one on Wikisource; school books often print 明月光 (míngyuèguāng) and 望明月 (wàng míngyuè) in the first and third lines.
    bases:
      床前:
        meaning: in front of the bed
      月光:
        meaning: moonlight
      疑:
        meaning: to suspect, to wonder
      地上:
        meaning: on the ground
      举头:
        meaning: to raise one's head
      望:
        meaning: to gaze at
      山月:
        meaning: the mountain moon
      低头:
        meaning: to lower one's head
      思:
        meaning: to think of, to miss
      故乡:
        meaning: home town
  zh-6002:
    native: The white sun sets behind the mountains and the Yellow River flows into the sea; to see a thousand miles, climb one more storey.
    notes:
      n1: Wang Zhihuan (c. 688 to 742) wrote this poem about a tower by the Yellow River. 层 (céng) is a storey, and 穷 (qióng) means to exhaust. 欲 (yù) means to wish to.
    bases:
      白日:
        meaning: the sun
      依:
        meaning: to lean on
      尽:
        meaning: to end, to disappear
      黄河:
        meaning: the Yellow River
      入海:
        meaning: to flow into the sea
      流:
        meaning: to flow
      欲:
        meaning: to wish to
      穷:
        meaning: to exhaust, to reach the end
      千里:
        meaning: a thousand li, far away
      目:
        meaning: eye
      更上:
        meaning: to climb higher
      一层楼:
        meaning: one more storey
  zh-6003:
    native: A thousand mountains, no birds flying; ten thousand paths, no people; an old man in a straw cape alone in a boat, fishing in the cold river snow.
    notes:
      n1: Liu Zongyuan (773 to 819) wrote this poem about a lone fisher on a snowy river. 径 (jìng) is a path, 江 (jiāng) a river, 笠 (lì) a bamboo hat and 蓑 (suō) a straw raincoat.
    bases:
      千山:
        meaning: a thousand mountains
      绝:
        meaning: to vanish, to cease
      万径:
        meaning: ten thousand paths
      踪:
        meaning: trace, track
      灭:
        meaning: to disappear
      孤舟:
        meaning: a lone boat
      蓑笠:
        meaning: straw cape and hat
      翁:
        meaning: old man
      独:
        meaning: alone
      寒江:
        meaning: the cold river
  zh-6004:
    native: The kind mother's thread in her hand; the clothes on the body of her son who wanders far.
    notes:
      n1: Meng Jiao (751 to 814) wrote this poem for his mother. The first couplet is given here; the whole poem has eight lines.
    bases:
      慈母:
        meaning: kind mother
      手中:
        meaning: in the hand
      游子:
        meaning: a wanderer, a son far from home
      身上:
        meaning: on the body
      衣:
        meaning: clothes
  zh-6005:
    native: Against the wall a few branches of plum; braving the cold it opens alone; I know from far off it is not snow, for there is a faint scent coming.
    notes:
      n1: Wang Anshi (1021 to 1086) wrote this poem in the Northern Song period. 凌 (líng) means to brave, and 遥 (yáo) means far away.
    bases:
      墙角:
        meaning: a corner of a wall
      数:
        meaning: a few
      枝:
        meaning: branch (counter for flowers)
      梅:
        meaning: plum blossom
      凌寒:
        meaning: braving the cold
      独自:
        meaning: by oneself
      遥知:
        meaning: to know from afar
      不是:
        meaning: is not
      为有:
        meaning: because there is
      暗香:
        meaning: a faint fragrance
  zh-6006:
    native: The water of Peach Blossom Pool is a thousand feet deep, but it cannot match Wang Lun's feeling as he sends me off.
    notes:
      n1: Li Bai wrote this for a friend who came to the pool to see him off. Only the second couplet is given here. 汪 (wāng) is part of the name Wang Lun, and 潭 (tán) is a deep pool.
    bases:
      桃花潭:
        meaning: Peach Blossom Pool
      深:
        meaning: deep
      千尺:
        meaning: a thousand feet
      不及:
        meaning: cannot match
      汪伦:
        meaning: Wang Lun, a friend of the poet
      情:
        meaning: feeling, affection
  zh-6007:
    native: Through the window the western peaks hold their eternal snow; at the door moored ships come from far away Eastern Wu.
    notes:
      n1: Du Fu (712 to 770) wrote this quatrain, the second couplet given here. 岭 (lǐng) is a mountain ridge and 吴 (wú) is the old name of a region.
    bases:
      窗:
        meaning: window
      含:
        meaning: to hold, to contain
      西岭:
        meaning: the western peaks
      千秋雪:
        meaning: snow of a thousand autumns, eternal snow
      泊:
        meaning: to moor
      东吴:
        meaning: Eastern Wu
      万里:
        meaning: ten thousand li, very far
  zh-6008:
    native: The children do not know me when we meet; smiling, they ask the visitor where he has come from.
    notes:
      n1: He Zhizhang (c. 659 to 744) wrote this poem after a long time away from home. 何 (hé) means what or where.
    bases:
      相见:
        meaning: to meet each other
      相识:
        meaning: to know each other
      笑问:
        meaning: to ask with a smile
      客:
        meaning: a guest, a visitor
      从:
        meaning: from
      何处:
        meaning: where
  zh-6009:
    native: It follows the wind and slips into the night; it moistens all things, so fine that it makes no sound.
    notes:
      n1: Du Fu wrote this poem about a spring rain that comes at the right time. 潜 (qián) means to slip in secretly.
    bases:
      随风:
        meaning: with the wind
      潜入:
        meaning: to slip into
      润物:
        meaning: moistens things
      细:
        meaning: fine, gentle
      无声:
        meaning: silently
  zh-6010:
    native: At dawn I leave White Emperor City among the coloured clouds, and in one day I return a thousand li to Jiangling.
    notes:
      n1: Li Bai wrote this poem about a boat journey from Baidi to Jiangling. 还 (huán) here means to return, not 'still'. 江陵 (jiānglíng) is a city on the river.
    bases:
      朝辞:
        meaning: to leave at dawn
      白帝:
        meaning: White Emperor City
      彩云:
        meaning: coloured clouds
      间:
        meaning: among
      千里:
        meaning: a thousand li
      江陵:
        meaning: Jiangling
      一日:
        meaning: one day
      还:
        meaning: to return
  zh-6011:
    native: One does not know the true face of Mount Lu, only because one is standing inside this mountain.
    notes:
      n1: Su Shi (1037 to 1101) wrote this poem about the view of a mountain from close by. 庐 (lú) is part of the name of Mount Lu, and 缘 (yuán) means because of. 此 (cǐ) means this.
    bases:
      不识:
        meaning: does not know
      庐山:
        meaning: Mount Lu
      真面目:
        meaning: true appearance
      缘:
        meaning: because of
      此:
        meaning: this
      山中:
        meaning: in the mountains
  zh-6012:
    native: Thick and green, the grass on the plain withers and flourishes each year; wildfire cannot burn it all, and the spring wind brings it back.
    notes:
      n1: Bai Juyi (772 to 846) wrote this poem as a farewell. 枯 (kū) means to wither.
    bases:
      离离:
        meaning: thick and luxuriant
      原上:
        meaning: on the plain
      一岁:
        meaning: each year
      一:
        meaning: each time
      枯荣:
        meaning: withering and flourishing
      野火:
        meaning: wildfire
      不尽:
        meaning: not exhausted
      吹:
        meaning: to blow
  zh-6013:
    native: My old friend has prepared a meal of chicken and millet and invited me to his farmhouse.
    notes:
      n1: Meng Haoran wrote this poem about a visit to a friend's farm. 黍 (shǔ) is millet.
    bases:
      故人:
        meaning: an old friend
      具:
        meaning: to prepare
      鸡黍:
        meaning: chicken and millet, a simple meal
      邀:
        meaning: to invite
      至:
        meaning: to come to
      田家:
        meaning: a farmhouse
  zh-6014:
    native: The state is broken, but the mountains and rivers remain; in the spring city the grasses and trees grow deep.
    notes:
      n1: Du Fu (712 to 770) wrote this poem. Only the first couplet is given here.
    bases:
      国破:
        meaning: the state is broken
      山河:
        meaning: mountains and rivers
      城春:
        meaning: spring in the city
      深:
        meaning: deep
  zh-6015:
    native: After fresh rain on the empty mountain, the evening air is autumn; the bright moon shines through the pines and the clear spring flows over the stones.
    notes:
      n1: Wang Wei (699 to 761) wrote this poem about a quiet mountain home. Only the first couplet pair is given here.
    bases:
      空山:
        meaning: an empty mountain
      新雨:
        meaning: fresh rain
      晚来:
        meaning: late in the evening
      秋:
        meaning: autumn
      明月:
        meaning: the bright moon
      松间:
        meaning: among the pines
      照:
        meaning: to shine
      清泉:
        meaning: a clear spring
      石上:
        meaning: on the rocks
      流:
        meaning: to flow
  zh-6016:
    native: The river Chu opens where the Heavenly Gate mountains are cut in two; the green water flows east and turns back here.
    notes:
      n1: Li Bai wrote this poem about a river passage between two peaks. 楚 (chǔ) is an old kingdom, 碧 (bì) is green, and 此 (cǐ) means this. 江 (jiāng) is a river.
    bases:
      天门:
        meaning: Heavenly Gate, two mountains on the river
      中断:
        meaning: cut in two
      楚江:
        meaning: the Chu River
      碧水:
        meaning: green water
      东流:
        meaning: flows east
      至此:
        meaning: to this point
  zh-6017:
    native: On the empty mountain I see no one, only hear voices; the evening light enters the deep forest and shines again on the green moss.
    notes:
      n1: Wang Wei wrote this poem about a deer park. 苔 (tái) is moss and 返 (fǎn) means to turn back.
    bases:
      空山:
        meaning: an empty mountain
      不见:
        meaning: cannot see
      但:
        meaning: only
      人语:
        meaning: human voices
      响:
        meaning: to sound, to echo
      返景:
        meaning: the reflected light of the sun
      深林:
        meaning: deep forest
      复:
        meaning: again
      照:
        meaning: to shine
      青苔:
        meaning: green moss
