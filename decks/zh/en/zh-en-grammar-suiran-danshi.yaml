"name": "虽然 (suīrán) ... 但是 (dànshì): although ... but"
"license": "CC-BY-SA-4.0"
"description": "Although something is so, something else is also so: 虽然 (suīrán) gives the concession, and 但是 (dànshì) the main point. Not yet checked by a Mandarin speaker: please report any mistake."
"tags":
- "unreviewed"
"pattern":
  "name": "虽然 (suīrán) ... 但是 (dànshì): although ... but"
  "slot_name": "form"
  "prompt": "{lemma} ({gloss}), {slot}"
  "slots":
    "plain": "a plain statement"
    "although": "although, with 虽然 (suīrán)"
    "but": "although ... but, with 虽然 (suīrán) ... 但是 (dànshì)"
  "entries":
    "yuan": "far"
    "gui": "expensive"
    "lei": "tired"
    "xiao": "small"
    "nan": "difficult"
  "notes": "虽然 (suīrán) gives the thing that is true, and 但是 (dànshì) gives the point that still stands: 虽然这里很远 (suīrán zhèlǐ hěn yuǎn)，但是我很高兴 (dànshì wǒ hěn gāoxìng), although it is far here, I am happy. 但是 (dànshì) can be shortened to 但 (dàn) in speech. Do not use 虽然 (suīrán) and 但是 (dànshì) with 因为 (yīnwèi) in the same sentence."
