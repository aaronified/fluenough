        "bases":
          "的":
            "meaning": "particle"
          "第一步":
            "meaning": "first step"
          "存钱":
            "meaning": "to save money"
  "zh-4490":
    "native": "credit; lending by banks and firms"
    "notes":
      "n1": "信贷 (xìndài) is lending by banks or other firms, the general word for credit. 信用 (xìnyòng) is trust and creditworthiness, the quality that lets you borrow. A 信贷 is the money lent; a 信用 is the reason it is lent."
    "examples":
