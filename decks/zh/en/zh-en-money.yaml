        "bases":
          "困难":
            "meaning": "difficult"
          "的":
            "meaning": "particle"
          "会":
            "meaning": "will"
  "zh-4489":
    "native": "to manage money; personal finance"
    "notes":
      "n1": "理财 (lǐcái) is managing money well: saving, investing and planning spending so that it lasts or grows. 管钱 (guǎn qián) only means holding money. 理财 means using it wisely, so people say 学习理财 (xuéxí lǐcái), learn to manage money."
    "examples":
      "很多年轻人开始学习理财。":
        "native": "Many young people are beginning to learn about managing money."
        "bases":
          "很多":
            "meaning": "many"
          "年轻人":
            "meaning": "young people"
      "理财的第一步是先存钱。":
