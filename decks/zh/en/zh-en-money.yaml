"id": "zh-en-money"
"kind": "layer"
"core": "zh-money"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Money"
"description": "Fifty words for money: cash and cards, banks, bills and prices, borrowing, debt, saving and investing, and the contracts that bind them. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "zh-4457":
    "native": "currency; money a state issues and accepts"
    "notes":
      "n1": "货币 (huòbì) is money as a system: the notes and coins a state issues and accepts. 钱 (qián) is the everyday word for the money you hold or spend. 人民币 (rénmínbì) is the Chinese currency, so 货币 is the wider word."
    "examples":
      "中国的货币是人民币。":
        "native": "China's currency is the renminbi."
        "bases":
          "的":
            "meaning": "particle"
      "这种货币在很多国家都能用。":
        "native": "This currency can be used in many countries."
        "bases":
          "这种":
            "meaning": "this kind of"
          "很多":
            "meaning": "many"
          "能":
            "meaning": "can"
          "用":
            "meaning": "to use"
  "zh-4458":
    "native": "renminbi; the Chinese currency, unit yuan"
    "notes":
      "n1": "人民币 (rénmínbì) is the currency of mainland China, and its unit is 元 (yuán). In speech people say 块 (kuài) for the yuan. 美元 (měiyuán) is the US dollar, a separate currency that needs exchanging."
    "examples":
      "我想把人民币换成美元。":
        "native": "I want to change renminbi into US dollars."
        "bases":
          "把":
            "meaning": "object marker"
          "换成":
            "meaning": "to exchange into"
          "美元":
            "meaning": "US dollars"
      "这个商店只收人民币。":
        "native": "This shop only accepts renminbi."
        "bases":
          "这个":
            "meaning": "this"
  "zh-4459":
    "native": "foreign currency; foreign exchange"
    "notes":
      "n1": "外汇 (wàihuì) is money from another country, and the dealings in it. 换钱 (huàn qián) is the everyday phrase for changing money at a bank counter; 外汇 is the wider financial word and appears on bank boards and in the news."
    "examples":
      "他去银行换外汇。":
        "native": "He goes to the bank to change foreign currency."
      "现在外汇市场的汇率一直在变。":
        "native": "The exchange rate in the foreign currency market keeps changing."
        "bases":
          "的":
            "meaning": "particle"
          "变":
            "meaning": "to change"
  "zh-4460":
    "native": "bank card; the card for your own account"
    "notes":
      "n1": "银行卡 (yínhángkǎ) is the card a bank issues for taking out and paying with your own money. 信用卡 (xìnyòngkǎ) is different: the bank lends you the money, and you pay it back later. Most cash machines take both."
    "examples":
      "用银行卡取钱，要先输入密码。":
        "native": "To withdraw money with a bank card, you must enter the PIN first."
        "bases":
          "用":
            "meaning": "to use"
          "取钱":
            "meaning": "to withdraw money"
          "要":
            "meaning": "must"
      "我的银行卡丢了，我要去挂失。":
        "native": "I have lost my bank card, so I have to go and report it lost."
        "bases":
          "我的":
            "meaning": "my"
          "了":
            "meaning": "particle"
          "要":
            "meaning": "must"
  "zh-4461":
    "native": "wages; the regular monthly pay for work"
    "notes":
      "n1": "工资 (gōngzī) is the regular pay for work, usually paid each month. 薪水 (xīnshuǐ) is a near-synonym in speech; 工资 is the word on a payslip and in a contract, and it is the safer choice in writing."
    "examples":
      "他每个月的工资是五千块。":
        "native": "His monthly salary is five thousand yuan."
        "bases":
          "每个月":
            "meaning": "every month"
          "的":
            "meaning": "particle"
          "五千":
            "meaning": "five thousand"
          "块":
            "meaning": "yuan"
      "工资发了，我请大家吃饭。":
        "native": "The wages have been paid, so I am treating everyone to a meal."
        "bases":
          "了":
            "meaning": "particle"
  "zh-4462":
    "native": "expenditure; money paid out"
    "notes":
      "n1": "支出 (zhīchū) is the money a person, a household or a firm pays out, the opposite of 收入 (shōurù), income. In talk people say 花的钱 (huā de qián), the money spent; 支出 is the word for a budget or an account."
    "examples":
      "我们每个月的支出比收入多。":
        "native": "Each month our spending is more than our income."
        "bases":
          "每个月":
            "meaning": "every month"
          "的":
            "meaning": "particle"
          "比":
            "meaning": "than"
      "这个月的支出要记下来。":
        "native": "This month's spending must be written down."
        "bases":
          "这个月":
            "meaning": "this month"
          "的":
            "meaning": "particle"
          "要":
            "meaning": "must"
          "记":
            "meaning": "to record"
          "下来":
            "meaning": "down"
  "zh-4463":
    "native": "loan; money borrowed"
    "notes":
      "n1": "借款 (jièkuǎn) is money borrowed, the loan itself. 贷款 (dàikuǎn) is the same loan seen from the lender's side, as a bank's loan to you. In a contract, 借款 is the amount the borrower owes."
    "examples":
      "这笔借款要在年底还清。":
        "native": "This loan must be paid off by the end of the year."
        "bases":
          "这笔":
            "meaning": "this"
          "要":
            "meaning": "must"
          "年底":
            "meaning": "year end"
          "还清":
            "meaning": "to pay off"
      "借款的利息是多少？":
        "native": "What is the interest on the loan?"
        "bases":
          "的":
            "meaning": "particle"
  "zh-4464":
    "native": "to repay a loan or card balance"
    "notes":
      "n1": "还款 (huánkuǎn) is paying back a loan or the balance on a card. 还钱 (huán qián) is the everyday phrase for paying back money owed to a person. Banks use 还款日 (huánkuǎnrì), the repayment day, on statements."
    "examples":
      "按时还款可以保护你的信用记录。":
        "native": "Repaying on time protects your credit record."
        "bases":
          "可以":
            "meaning": "can"
          "你的":
            "meaning": "your"
          "记录":
            "meaning": "record"
      "每个月的还款日是五号。":
        "native": "The repayment day is the fifth of every month."
        "bases":
          "每个月":
            "meaning": "every month"
          "的":
            "meaning": "particle"
          "还款日":
            "meaning": "repayment day"
          "五号":
            "meaning": "the fifth"
  "zh-4465":
    "native": "fund; money pooled for investment"
    "notes":
      "n1": "基金 (jījīn) is a pool of money from many people, managed by a company to invest. 股票 (gǔpiào) is a share in one company; a fund holds many, so it spreads the risk. Fund managers charge a fee, which buyers should check."
    "examples":
      "我买了基金，每个月投一点钱。":
        "native": "I bought a fund and put a little money into it each month."
        "bases":
          "了":
            "meaning": "particle"
          "每个月":
            "meaning": "every month"
          "投":
            "meaning": "to invest"
          "一点":
            "meaning": "a little"
      "这个基金的风险比较大。":
        "native": "This fund carries fairly high risk."
        "bases":
          "这个":
            "meaning": "this"
          "的":
            "meaning": "particle"
          "风险":
            "meaning": "risk"
  "zh-4466":
    "native": "savings; putting money aside"
    "notes":
      "n1": "储蓄 (chǔxù) is money set aside for later, or the habit of setting it aside. 存款 (cúnkuǎn) is the deposit in a bank account; 储蓄 is the wider idea. People say 养成储蓄的习惯 (yǎngchéng chǔxù de xíguàn), to form the saving habit."
    "examples":
      "他每个月都存一点钱，养成了储蓄的习惯。":
        "native": "He puts a little money aside every month and has formed the habit of saving."
        "bases":
          "每个月":
            "meaning": "every month"
          "存":
            "meaning": "to put aside"
          "一点":
            "meaning": "a little"
          "养成":
            "meaning": "to form"
          "了":
            "meaning": "particle"
          "的":
            "meaning": "particle"
      "年轻人的储蓄比父母那一代少。":
        "native": "Young people save less than their parents' generation did."
        "bases":
          "年轻人":
            "meaning": "young people"
          "的":
            "meaning": "particle"
          "比":
            "meaning": "than"
          "那一代":
            "meaning": "that generation"
  "zh-4467":
    "native": "property; what a person owns"
    "notes":
      "n1": "财产 (cáichǎn) is what a person or a family owns: a flat, savings, goods. In law it is the word used when property is divided, as after a divorce. 资产 (zīchǎn) is the accounting word for what a firm or a bank holds."
    "examples":
      "这套房子是他的全部财产。":
        "native": "This flat is all of his property."
        "bases":
          "这套":
            "meaning": "this (flat)"
          "他的":
            "meaning": "his"
          "全部":
            "meaning": "entire"
      "离婚以后，两个人要分割财产。":
        "native": "After the divorce the two people must divide their property."
        "bases":
          "离婚":
            "meaning": "divorce"
          "两个人":
            "meaning": "two people"
          "要":
            "meaning": "must"
          "分割":
            "meaning": "to divide"
  "zh-4468":
    "native": "to be in debt; to owe money"
    "notes":
      "n1": "负债 (fùzhài) is the state of owing money, a financial word for a person or firm with debts, often measured against what it owns. In talk, say 欠钱 (qiàn qián), to owe money. 负债 is more often used about companies."
    "examples":
      "这家公司负债很多，已经很难还。":
        "native": "This company owes a lot, and it is already very hard for it to pay back."
        "bases":
          "这家":
            "meaning": "this"
          "很多":
            "meaning": "a lot"
      "负债的人要学会管理钱。":
        "native": "People who are in debt need to learn to manage money."
        "bases":
          "的":
            "meaning": "particle"
          "要":
            "meaning": "must"
          "学会":
            "meaning": "to learn to"
  "zh-4469":
    "native": "inflation; a general rise in prices"
    "notes":
      "n1": "通货膨胀 (tōnghuòpéngzhàng) is a general rise in prices, so the same money buys less. Economists say 通胀 (tōngzhàng) for short. In talk people say 东西涨价了 (dōngxi zhǎngjià le), things have gone up in price."
    "examples":
      "通货膨胀的时候，同样的钱买不了那么多东西。":
        "native": "When there is inflation, the same money buys fewer things."
        "bases":
          "的":
            "meaning": "particle"
          "同样":
            "meaning": "same"
          "买不了":
            "meaning": "cannot buy"
          "那么多":
            "meaning": "so much"
      "通货膨胀让老人的养老金越来越不值钱。":
        "native": "Inflation makes old people's pensions worth less and less."
        "bases":
          "让":
            "meaning": "to make"
          "老人":
            "meaning": "old people"
          "的":
            "meaning": "particle"
          "养老金":
            "meaning": "pension"
          "越来越":
            "meaning": "more and more"
          "值钱":
            "meaning": "worth money"
  "zh-4470":
    "native": "price of a thing"
    "notes":
      "n1": "价格 (jiàgé) is the price of one thing: the figure on a label or a bill. 价钱 (jiàqian) is the spoken word for the same thing. 物价 (wùjià) is the level of prices for many goods together, so people say 物价上涨 (wùjià shàngzhǎng), prices rise."
    "examples":
      "这件衣服的价格很合理。":
        "native": "The price of this piece of clothing is very reasonable."
        "bases":
          "这件":
            "meaning": "this"
          "的":
            "meaning": "particle"
      "油的价格最近一直在涨。":
        "native": "The price of oil has been rising steadily lately."
        "bases":
          "的":
            "meaning": "particle"
          "最近":
            "meaning": "recently"
          "涨":
            "meaning": "to rise"
  "zh-4471":
    "native": "to spend money"
    "notes":
      "n1": "花钱 (huāqián) is to spend money, the everyday verb, and it is neutral: 花钱多 (huā qián duō) can mean spending a lot or being wasteful, depending on the words around it. 省钱 (shěng qián) is the opposite, to save money."
    "examples":
      "别乱花钱，想想再买。":
        "native": "Do not spend money carelessly; think before you buy."
        "bases":
          "想想":
            "meaning": "think"
      "我买了一本书，花钱不多。":
        "native": "I bought a book, and it did not cost much."
        "bases":
          "了":
            "meaning": "particle"
          "一本":
            "meaning": "one (copy)"
          "不多":
            "meaning": "not much"
  "zh-4472":
    "native": "to save money"
    "notes":
      "n1": "省钱 (shěng qián) is to spend less so that money is kept back. 节约 (jiéyuē) is saving a resource such as water or power; 省钱 is about money in one's own pocket. Say 省钱的办法 (shěngqián de bànfǎ), a way to save money, for a tip."
    "examples":
      "自己做饭可以省钱。":
        "native": "Cooking for yourself can save money."
        "bases":
          "可以":
            "meaning": "can"
      "他买了二手车，省了不少钱。":
        "native": "He bought a used car and saved quite a lot of money."
        "bases":
          "了":
            "meaning": "particle"
          "二手车":
            "meaning": "used car"
          "不少":
            "meaning": "quite a lot"
  "zh-4473":
    "native": "to owe money"
    "notes":
      "n1": "欠钱 (qiàn qián) is to owe money to someone. 欠 (qiàn) means owe, and the person follows: 欠他两百块 (qiàn tā liǎngbǎi kuài), owes him two hundred yuan. 欠钱 alone is the general word for being in debt to a person."
    "examples":
      "他欠我三百块钱，还没还。":
        "native": "He owes me three hundred yuan and has not paid it back yet."
        "bases":
          "欠":
            "meaning": "to owe"
          "块":
            "meaning": "yuan"
          "还没":
            "meaning": "not yet"
      "我不想欠钱，所以先存一点。":
        "native": "I do not want to owe money, so I save a little first."
        "bases":
          "不想":
            "meaning": "do not want"
          "所以":
            "meaning": "so"
          "存":
            "meaning": "to save"
          "一点":
            "meaning": "a little"
  "zh-4474":
    "native": "to borrow money; to lend money"
    "notes":
      "n1": "借钱 (jiè qián) means borrowing money from someone, or lending it: 向朋友借钱 (xiàng péngyou jiè qián), to borrow from a friend, and 借钱给朋友 (jiè qián gěi péngyou), to lend one to a friend. 借 covers both directions, so context decides."
    "examples":
      "他向朋友借钱，说下个月还。":
        "native": "He borrowed money from a friend and said he would pay it back next month."
        "bases":
          "向":
            "meaning": "from"
          "下个月":
            "meaning": "next month"
      "借钱给别人，要写清楚。":
        "native": "When you lend money to someone, write it down clearly."
        "bases":
          "给":
            "meaning": "to"
          "要":
            "meaning": "must"
          "写清楚":
            "meaning": "write clearly"
  "zh-4475":
    "native": "to pay back money"
    "notes":
      "n1": "还钱 (huán qián) is to give back money one owes. 还 (huán) means return or repay, and the same verb returns things, as in 还书 (huán shū), to return a book. For a debt, 还钱 is what people say first."
    "examples":
      "我下周一定还钱给你。":
        "native": "I will definitely pay you back next week."
        "bases":
          "给":
            "meaning": "to"
      "借了钱就要还钱，这是常识。":
        "native": "If you borrow money you have to pay it back; this is common sense."
        "bases":
          "了":
            "meaning": "particle"
          "要":
            "meaning": "must"
  "zh-4476":
    "native": "small change; loose coins and small notes"
    "notes":
      "n1": "零钱 (língqián) is small change, the coins and small notes you get back in a shop. 找零 (zhǎolíng) is the act of giving that change back, a separate word in the deck. Keep some 零钱 for buses and markets, where people often have no change."
    "examples":
      "我没有零钱，你用手机付吧。":
        "native": "I have no small change, so pay with your phone."
        "bases":
          "没有":
            "meaning": "do not have"
          "用":
            "meaning": "to use"
      "卖菜的人没有零钱找给我。":
        "native": "The vegetable seller had no change to give me."
        "bases":
          "卖菜":
            "meaning": "sell vegetables"
          "的":
            "meaning": "particle"
          "没有":
            "meaning": "did not have"
          "给":
            "meaning": "to"
  "zh-4477":
    "native": "cash; physical notes and coins"
    "notes":
      "n1": "现金 (xiànjīn) is physical money, notes and coins, as opposed to a card or a phone payment. 付现金 (fù xiànjīn) is to pay in cash. Some small shops and markets still take only 现金, so carry a little."
    "examples":
      "这家店只收现金，不收卡。":
        "native": "This shop accepts only cash, not cards."
        "bases":
          "这家":
            "meaning": "this"
      "出门带点现金比较安全。":
        "native": "It is safer to carry a little cash when you go out."
  "zh-4478":
    "native": "accountant; accounting"
    "notes":
      "n1": "会计 (kuàijì) is the work of keeping a firm's accounts, or the person who does it. 财务 (cáiwù) is the wider finance side of an organisation; 会计 is the bookkeeping part, with its own qualifications and rules."
    "examples":
      "我妈妈是会计，在一家公司工作。":
        "native": "My mother is an accountant and works at a company."
        "bases":
          "一家":
            "meaning": "a"
      "会计要把每一笔钱都记清楚。":
        "native": "An accountant must record every single sum clearly."
        "bases":
          "要":
            "meaning": "must"
          "把":
            "meaning": "object marker"
          "一笔":
            "meaning": "one sum"
          "记清楚":
            "meaning": "record clearly"
  "zh-4479":
    "native": "assets; what a firm or bank owns"
    "notes":
      "n1": "资产 (zīchǎn) is what a company, bank or government owns that has value, such as buildings, cash and money owed to it. 财产 (cáichǎn) is the same idea for a person or family, the word used in law and in everyday talk about what you own."
    "examples":
      "这家银行的资产很大。":
        "native": "This bank has very large assets."
        "bases":
          "这家":
            "meaning": "this"
          "的":
            "meaning": "particle"
      "房子也是一种资产。":
        "native": "A house is also a kind of asset."
        "bases":
          "一种":
            "meaning": "a kind of"
  "zh-4480":
    "native": "debt; a sum owed"
    "notes":
      "n1": "债务 (zhàiwù) is a sum owed, often a large one, to a bank or several people. 欠钱 (qiàn qián) is the everyday form for owing money; 债务 is more formal and is the word for a debt that is recorded in writing, such as a loan or a bond."
    "examples":
      "他背着很多债务，生活很辛苦。":
        "native": "He carries a lot of debt, and life is hard for him."
        "bases":
          "着":
            "meaning": "particle"
          "很多":
            "meaning": "a lot"
          "生活":
            "meaning": "life"
      "减少债务是我们的目标。":
        "native": "Reducing debt is our goal."
        "bases":
          "我们的":
            "meaning": "our"
  "zh-4481":
    "native": "house prices; the price of a flat or house"
    "notes":
      "n1": "房价 (fángjià) is the price of a flat or house. Rent is 房租 (fángzū), a different figure paid monthly. In news reports people talk about 房价上涨 (fángjià shàngzhǎng), rising house prices, and about the young who cannot buy."
    "examples":
      "这个城市的房价很高。":
        "native": "House prices in this city are very high."
        "bases":
          "这个":
            "meaning": "this"
          "的":
            "meaning": "particle"
      "年轻人买房子越来越难，因为房价涨得太快。":
        "native": "It is getting harder and harder for young people to buy a flat, because house prices are rising too fast."
        "bases":
          "年轻人":
            "meaning": "young people"
          "买房子":
            "meaning": "to buy a flat"
          "越来越":
            "meaning": "more and more"
          "因为":
            "meaning": "because"
          "涨":
            "meaning": "to rise"
          "得":
            "meaning": "particle"
  "zh-4482":
    "native": "prices of goods; the cost of living"
    "notes":
      "n1": "物价 (wùjià) is the general level of prices for goods and services, not the price of one thing. 价格 (jiàgé) is the price of one item; 物价 covers many together, so people say 物价上涨 (wùjià shàngzhǎng), prices are rising, or 稳定物价 (wěndìng wùjià), keep prices steady."
    "examples":
      "最近物价涨得厉害。":
        "native": "Prices have gone up a lot recently."
        "bases":
          "最近":
            "meaning": "recently"
          "涨":
            "meaning": "to rise"
          "得":
            "meaning": "particle"
          "厉害":
            "meaning": "a lot"
      "政府努力稳定物价。":
        "native": "The government is working hard to keep prices stable."
        "bases":
          "稳定":
            "meaning": "to keep steady"
  "zh-4483":
    "native": "extravagant; luxurious"
    "notes":
      "n1": "奢侈 (shēchǐ) describes spending far more than needed on luxuries. 贵 (guì) only means expensive; 奢侈 is a judgement about how someone spends, so it is often used as a criticism. 浪费 (làngfèi) is waste; 奢侈 is the choice to buy luxury."
    "examples":
      "他的生活很奢侈，买的都是名牌。":
        "native": "His life is extravagant; everything he buys is a designer brand."
        "bases":
          "他的":
            "meaning": "his"
          "生活":
            "meaning": "life"
          "的":
            "meaning": "particle"
          "都是":
            "meaning": "all are"
      "节日里大家不要奢侈浪费。":
        "native": "At festivals people should not be extravagant and waste money."
        "bases":
          "不要":
            "meaning": "do not"
  "zh-4484":
    "native": "poor; in poverty"
    "notes":
      "n1": "贫穷 (pínqióng) is poverty: not having enough money for food and a home. 穷 (qióng) is the everyday word for poor and can describe a person; 贫穷 is more formal and is used about a country or a region. Its opposite is 富裕 (fùyù)."
    "examples":
      "这个村子曾经很贫穷，现在变好了。":
