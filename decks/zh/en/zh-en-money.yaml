  "zh-4495":
    "native": "debt; money owed"
    "notes":
      "n1": "欠款 (qiànkuǎn) is money owed for goods or a loan, the sum still to be paid. 借款 (jièkuǎn) is money you borrow; 欠款 is the sum outstanding, often owed to a supplier or a shop. In a business, 欠款 must be chased."
