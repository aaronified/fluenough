          "款项":
            "meaning": "sum of money"
          "全部":
            "meaning": "in full"
  "zh-4487":
    "native": "finance; banking and investment"
    "notes":
      "n1": "金融 (jīnróng) is the business of money as a field: banks, loans, shares and insurance. 经济 (jīngjì) is the economy as a whole; 金融 is the part that moves money between people, firms and countries."
    "examples":
