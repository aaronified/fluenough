          "积分":
            "meaning": "points"
          "可以":
            "meaning": "can"
          "一张":
            "meaning": "a"
          "电影票":
            "meaning": "cinema ticket"
  "zh-4493":
    "native": "to withdraw money from an account"
    "notes":
      "n1": "提款 (tíkuǎn) is taking money out of a bank account, at a counter or a cash machine. 取款 (qǔkuǎn) means the same act. 提款机 (tíkuǎnjī) is the cash machine itself, and a word people use on the street."
