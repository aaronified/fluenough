          "让":
            "meaning": "to make"
          "负担":
            "meaning": "burden"
  "zh-4491":
    "native": "face value; denomination"
    "notes":
      "n1": "面额 (miàn'é) is the value printed on a note, a coin or a voucher. A hundred-yuan note has the 面额 of 一百块 (yì bǎi kuài), printed on its front. Money is counted by its 面额, not by its size or colour."
    "examples":
      "这张纸币的面额是五十块。":
        "native": "The face value of this banknote is fifty yuan."
        "bases":
