  "zh-4496":
    "native": "contract; a written agreement with legal force"
    "notes":
      "n1": "合同 (hétong) is a written agreement that both sides sign and that has legal force. 协议 (xiéyì) is an agreement and can be informal; 合同 has terms, dates and clauses, and is used for jobs, rent and sales."
