        "native": "He works at a finance company."
        "bases":
          "一家":
            "meaning": "a"
      "金融危机会影响很多人的生活。":
        "native": "A financial crisis affects the lives of many people."
        "bases":
          "危机":
            "meaning": "crisis"
          "会":
            "meaning": "will"
          "影响":
            "meaning": "to affect"
          "很多":
            "meaning": "many"
          "的":
            "meaning": "particle"
          "生活":
            "meaning": "life"
  "zh-4488":
    "native": "public finance; the government's budget"
    "notes":
      "n1": "财政 (cáizhèng) is the state's money: the taxes it collects and what it spends. 家里的钱 (jiālǐ de qián) is a household's money; 财政 is about the government's budget, not a family's. 税收 (shuìshōu) is one part of it."
    "examples":
