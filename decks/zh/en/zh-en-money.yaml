        "bases":
          "消除":
            "meaning": "to eliminate"
          "的":
            "meaning": "particle"
  "zh-4485":
    "native": "well-off; wealthy; prosperous"
    "notes":
      "n1": "富裕 (fùyù) describes a person, a family or a region with plenty of money and a comfortable life. 有钱 (yǒu qián) is the everyday phrase for rich, usually of a person. 富裕 suits a place as well as a family, and it is often the word in official reports."
    "examples":
      "他们一家人生活富裕，经常出去旅游。":
        "native": "The family lives comfortably and often goes travelling."
        "bases":
          "一家人":
            "meaning": "a family"
          "生活":
            "meaning": "life"
          "出去":
            "meaning": "to go out"
      "这个地区越来越富裕。":
        "native": "This area is getting more and more prosperous."
        "bases":
          "这个":
            "meaning": "this"
          "越来越":
            "meaning": "more and more"
  "zh-4486":
    "native": "to pay (formal)"
    "notes":
      "n1": "支付 (zhīfù) is the formal word for paying: a payment to a company or a person, often by phone or card, and the word on bank and app screens. 付款 (fùkuǎn) is the everyday word for paying a bill, and it is a separate card in the deck."
    "examples":
