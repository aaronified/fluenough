"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0582":
    "native": "Shall we clean the room together?"
    "confusables":
      "w1":
        "why": "收拾 (shōushi) would say tidy up, not sweep or clean a room."
      "w2":
        "why": "做饭 (zuòfàn) would say cook, not clean."
  "zh-0583":
    "native": "Mum teaches us to cook."
    "confusables":
      "w1":
        "why": "学习 (xuéxí) would say to study, not to teach."
      "w2":
        "why": "练习 (liànxí) would say to practise, by oneself."
  "zh-0584":
    "native": "I know that you need money."
    "confusables":
      "w1":
        "why": "明白 (míngbai) would say understand, not know a fact."
      "w2":
        "why": "希望 (xīwàng) would say hope, not know."
  "zh-0585":
    "native": "I think we should come early."
    "confusables":
      "w1":
        "why": "希望 (xīwàng) would say hope, a wish, not an opinion."
      "w2":
        "why": "结束 (jiéshù) would say finish, not think."
  "zh-0586":
    "native": "We set off at seven tomorrow."
    "confusables":
      "w1":
        "why": "出门 (chūmén) would say go out for a short trip."
      "w2":
        "why": "进 (jìn) would say enter, not set off."
  "zh-0587":
    "native": "At the weekend we go for a walk."
    "confusables":
      "w1":
        "why": "跑步 (pǎobù) would say to jog, not to walk."
      "w2":
        "why": "逛 (guàng) would say to browse, not to take a walk for air."
  "zh-0588":
    "native": "They sing, and we dance."
    "confusables":
      "w1":
        "why": "运动 (yùndòng) would say to exercise, not to dance."
      "w2":
        "why": "游泳 (yóuyǒng) would say to swim, not to dance."
  "zh-0589":
    "native": "Please come in and sit down."
    "confusables":
      "w1":
        "why": "回 (huí) would say return, not come in."
      "w2":
        "why": "站 (zhàn) would say stand, not sit."
  "zh-0590":
    "native": "I change my clothes."
    "confusables":
      "w1":
        "why": "借 (jiè) would say lend or borrow, not change."
      "w2":
        "why": "穿 (chuān) would say put on, which is a different action."
