"schema": 1
"id": "zh-en-eating-out"
"kind": "layer"
"core": "zh-eating-out"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Eating out"
"description": "Fifty words for a meal out: booking a table, the courses and the drinks, the hot pot and the barbecue, asking for the bill, the tip and the take-away, and the tableware. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1781":
    "native": "to book; to reserve"
    "notes":
      "n1": "To book a table or a room in advance. 订 (dìng) is to order or reserve."
    "examples":
      "我想预订一张桌子。": "I would like to book a table."
      "预订了包间。":
        "native": "They booked a private room."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1782":
    "native": "private room"
    "notes":
      "n1": "A private room in a restaurant, for a group. 间 (jiān) is a room."
    "examples":
      "我们要一个包间。":
        "native": "We want a private room."
        "bases":
          "要":
            "meaning": "must; to want"
      "包间很安静。": "The private room is very quiet."
  "zh-1783":
    "native": "drinks (alcoholic and soft)"
    "notes":
      "n1": "Drinks of all kinds, served at a meal. 酒 (jiǔ) is wine, and 水 (shuǐ) is water."
    "examples":
      "酒水单在这里。":
        "native": "The drinks list is here."
        "bases":
          "单":
            "meaning": "list; single"
          "这里":
            "meaning": "here"
      "我不要酒水。":
        "native": "I do not want a drink."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-1784":
    "native": "staple food"
    "notes":
      "n1": "The main food of a meal, such as rice, noodles or bread. 主 (zhǔ) is main."
    "examples":
      "主食是米饭或者面条。":
        "native": "The staple is rice or noodles."
        "bases":
          "或者":
            "meaning": "or"
      "我不吃主食。": "I do not eat the staple food."
  "zh-1785":
    "native": "cold dish"
    "notes":
      "n1": "A cold dish, served before the hot ones. 凉 (liáng) is cool."
    "examples":
      "凉菜先上。": "The cold dishes come first."
      "这个凉菜很好吃。": "This cold dish is delicious."
  "zh-1786":
    "native": "hot dish"
    "notes":
      "n1": "A hot dish, cooked and served warm. 热 (rè) is hot."
    "examples":
      "热菜来了。":
        "native": "The hot dishes have come."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "热菜很香。": "The hot dishes smell good."
  "zh-1787":
    "native": "soup"
    "notes":
      "n1": "Soup, a liquid food with ingredients in it."
    "examples":
      "这个汤很鲜。": "This soup is very tasty."
      "汤太烫了。":
        "native": "The soup is too hot."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1788":
    "native": "signature dish"
    "notes":
      "n1": "A dish that a restaurant is famous for. 招牌 (zhāopái) is a shop sign."
    "examples":
      "招牌菜是烤鸭。": "The signature dish is roast duck."
      "这家饭馆的招牌菜很好吃。":
        "native": "This restaurant's signature dish is delicious."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1789":
    "native": "to recommend"
    "notes":
      "n1": "To suggest a dish or a thing as good. 推 (tuī) is to push, and 荐 (jiàn) is to recommend."
    "examples":
      "你推荐什么？": "What do you recommend?"
      "服务员推荐这个。": "The waiter recommends this one."
  "zh-1790":
    "native": "mildly spicy"
    "notes":
      "n1": "Only a little spicy. 微 (wēi) is slight."
    "examples":
      "要微辣的。":
        "native": "I want it mildly spicy."
        "bases":
          "要":
            "meaning": "must; to want"
          "的":
            "meaning": "a particle: of; belonging to"
      "这个微辣。": "This is mildly spicy."
  "zh-1791":
    "native": "light; not greasy or salty"
    "notes":
      "n1": "Light in taste, not oily or heavy. 清 (qīng) is clear."
    "examples":
      "我喜欢清淡的菜。":
        "native": "I like light dishes."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "这个汤很清淡。": "This soup is light."
  "zh-1792":
    "native": "greasy; oily"
    "notes":
      "n1": "Greasy and oily, too much oil in the food."
    "examples":
      "这个菜很油腻。": "This dish is very greasy."
      "我不吃油腻的东西。":
        "native": "I do not eat greasy food."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1793":
    "native": "portion; serving"
    "notes":
      "n1": "A portion or a serving of food. 一 份 (yí fèn) is one serving."
    "examples":
      "我要一份饺子。":
        "native": "I want one portion of dumplings."
        "bases":
          "要":
            "meaning": "must; to want"
      "两份米饭，谢谢。":
        "native": "Two portions of rice, thank you."
        "bases":
          "谢谢":
            "meaning": "thank you"
  "zh-1794":
    "native": "to refill a drink"
    "notes":
      "n1": "To fill a cup again, a free refill. 续 (xù) is to continue, and 杯 (bēi) is a cup."
    "examples":
      "可以续杯吗？":
        "native": "Can I have a refill?"
        "bases":
          "可以":
            "meaning": "can; may"
      "茶可以续杯。":
        "native": "The tea can be refilled."
        "bases":
          "可以":
            "meaning": "can; may"
  "zh-1795":
    "native": "to pack food to take away"
    "notes":
      "n1": "To pack leftover or ordered food to take away. 打 (dǎ) is to make, and 包 (bāo) is a packet."
    "examples":
      "请打包。": "Please pack it to take away."
      "剩下的菜打包吧。":
        "native": "Pack the leftover dishes to take away."
        "bases":
          "剩下":
            "meaning": "left over"
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1796":
    "native": "takeaway; food delivery"
    "notes":
      "n1": "Food ordered to take away or to be delivered. 外 (wài) is outside, and 卖 (mài) is to sell."
    "examples":
      "我点了外卖。":
        "native": "I ordered a takeaway."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "外卖很快到。":
        "native": "The delivery arrives quickly."
        "bases":
          "到":
            "meaning": "to arrive; to reach"
  "zh-1797":
    "native": "eating in"
    "notes":
      "n1": "Eating a meal inside the restaurant, not taking it away. 堂 (táng) is a hall."
    "examples":
      "我们堂食。": "We will eat in."
      "堂食有座位。":
        "native": "There are seats for eating in."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1798":
    "native": "service charge"
    "notes":
      "n1": "A charge for service, added to the bill. 费 (fèi) is a fee."
    "examples":
      "服务费是十块。":
        "native": "The service charge is ten yuan."
        "bases":
          "块":
            "meaning": "the measure word for money; a yuan"
      "有服务费吗？":
        "native": "Is there a service charge?"
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1799":
    "native": "tip"
    "notes":
      "n1": "A tip, extra money given to a waiter. 小 (xiǎo) is small, and 费 (fèi) is a fee."
    "examples":
      "我给小费。":
        "native": "I give a tip."
        "bases":
          "给":
            "meaning": "to give; for"
      "小费不是必须的。":
        "native": "A tip is not required."
        "bases":
          "必须":
            "meaning": "must; have to"
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1800":
    "native": "to scan a code"
    "notes":
      "n1": "To scan a code with a phone. 扫 (sǎo) is to sweep or scan, and 码 (mǎ) is a code."
    "examples":
      "请扫码点菜。": "Please scan the code to order."
      "扫码付款很方便。": "Paying by scanning the code is convenient."
  "zh-1801":
    "native": "QR code"
    "notes":
      "n1": "A square code of dots that a phone can read. 二维 (èrwéi) is two-dimensional."
    "examples":
      "二维码在桌子上。": "The QR code is on the table."
      "请扫二维码。":
        "native": "Please scan the QR code."
        "bases":
          "扫":
            "meaning": "to sweep; to scan"
  "zh-1802":
    "native": "napkin; paper serviette"
    "notes":
      "n1": "A paper napkin, for wiping the mouth and hands. 餐 (cān) is a meal."
    "examples":
      "餐巾纸在哪里？": "Where are the napkins?"
      "请给我一张餐巾纸。":
        "native": "Please give me a napkin."
        "bases":
          "给":
            "meaning": "to give; for"
  "zh-1803":
    "native": "tableware; cutlery"
    "notes":
      "n1": "Tableware, the knives, forks and spoons for a meal. 具 (jù) is a tool."
    "examples":
      "餐具很干净。": "The tableware is very clean."
      "请拿餐具。": "Please bring the cutlery."
  "zh-1804":
    "native": "small plate; saucer"
    "notes":
      "n1": "A small plate, for a small amount of food or a sauce. 一 碟 (yì dié) is one small plate."
    "examples":
      "一碟饺子。": "A small plate of dumplings."
      "这个碟很小。": "This small plate is very small."
  "zh-1805":
    "native": "plate; dish"
    "notes":
      "n1": "A flat plate, or a dish of food. 一 盘 (yì pán) is one plate of food."
    "examples":
      "一盘饺子。": "A plate of dumplings."
      "盘子很干净。": "The plate is very clean."
  "zh-1806":
    "native": "dining table"
    "notes":
      "n1": "A table for eating a meal at. 桌 (zhuō) is a table."
    "examples":
      "餐桌上有菜。":
        "native": "There are dishes on the dining table."
        "bases":
          "有":
            "meaning": "to have; there is"
      "餐桌很大。": "The dining table is very big."
  "zh-1807":
    "native": "by the window"
    "notes":
      "n1": "The place next to a window. 边 (biān) is an edge or side."
    "examples":
      "窗边的座位很好。":
        "native": "The seat by the window is very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "我们坐在窗边。": "We sit by the window."
  "zh-1808":
    "native": "to eat until full"
    "notes":
      "n1": "To eat until you are full. 饱 (bǎo) is full."
    "examples":
      "我吃饱了。":
        "native": "I am full."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "吃饱以后我休息。": "After I have eaten my fill I rest."
  "zh-1809":
    "native": "scalding hot"
    "notes":
      "n1": "Very hot, hot enough to burn the mouth. 烫 (tàng) is scalding."
    "examples":
      "汤很烫。": "The soup is scalding."
      "小心烫嘴。": "Careful, it will burn your mouth."
  "zh-1810":
    "native": "chilled; iced"
    "notes":
      "n1": "Chilled in ice, cold to drink. 镇 (zhèn) is to cool or hold down."
    "examples":
      "冰镇的啤酒很好。":
        "native": "The chilled beer is very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "饮料要冰镇吗？":
        "native": "Do you want the drink chilled?"
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-1811":
    "native": "fresh; tasty"
    "notes":
      "n1": "Fresh, and full of taste, as food from the sea or a broth. 鲜 (xiān) is the taste of good food."
    "examples":
      "这个鱼很鲜。": "This fish is very fresh."
      "汤很鲜。": "The soup is very tasty."
  "zh-1812":
    "native": "coriander"
    "notes":
      "n1": "Coriander, a herb with a strong smell, used in many dishes. 香 (xiāng) is fragrant."
    "examples":
      "不要香菜。":
        "native": "No coriander, please."
        "bases":
          "要":
            "meaning": "must; to want"
      "香菜很香。": "The coriander smells strong."
  "zh-1813":
    "native": "dipping sauce"
    "notes":
      "n1": "A sauce for dipping food in. 蘸 (zhàn) is to dip."
    "examples":
      "请给我蘸料。":
        "native": "Please give me the dipping sauce."
        "bases":
          "给":
            "meaning": "to give; for"
      "蘸料很辣。": "The dipping sauce is spicy."
  "zh-1814":
    "native": "hot pot base"
    "notes":
      "n1": "The soup base in a hot pot, the broth. 锅 (guō) is a pot, and 底 (dǐ) is the bottom."
    "examples":
      "锅底是辣的。":
        "native": "The hot pot base is spicy."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "我要清汤锅底。":
        "native": "I want a clear broth base."
        "bases":
          "要":
            "meaning": "must; to want"
          "清汤":
            "meaning": "clear broth"
  "zh-1815":
    "native": "to rinse in hot water"
    "notes":
      "n1": "To cook a thin slice of food by dipping it into boiling soup for a moment."
    "examples":
      "我涮肉。": "I dip the meat in the hot pot."
      "涮菜很快。": "Dipping the vegetables is quick."
  "zh-1816":
    "native": "sliced meat"
    "notes":
      "n1": "Thin slices of meat, for hot pot or stir-fry. 片 (piàn) is a slice."
    "examples":
      "肉片很薄。":
        "native": "The meat slices are very thin."
        "bases":
          "薄":
            "meaning": "thin"
      "我要一盘肉片。":
        "native": "I want a plate of sliced meat."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-1817":
    "native": "beef balls"
    "notes":
      "n1": "Balls of minced beef, cooked in soup. 丸 (wán) is a ball."
    "examples":
      "牛肉丸很好吃。": "The beef balls are delicious."
      "我要一份牛肉丸。":
        "native": "I want a portion of beef balls."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-1818":
    "native": "glass noodles; vermicelli"
    "notes":
      "n1": "Thin noodles made from starch, which go soft in soup. 粉 (fěn) is powder, and 丝 (sī) is a thread."
    "examples":
      "粉丝很滑。":
        "native": "The glass noodles are slippery."
        "bases":
          "滑":
            "meaning": "slippery"
      "汤里有粉丝。":
        "native": "There are glass noodles in the soup."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1819":
    "native": "cooked; ripe"
    "notes":
      "n1": "Cooked through, or ripe. Its opposite is 生 (shēng), raw."
    "examples":
      "肉熟了。":
        "native": "The meat is cooked."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "这个菜没熟。":
        "native": "This dish is not cooked yet."
        "bases":
          "没":
            "meaning": "not; did not"
  "zh-1820":
    "native": "roast meat; barbecue"
    "notes":
      "n1": "Grilled or roasted meat, cooked over a fire. 烤 (kǎo) is to roast."
    "examples":
      "我们吃烤肉。": "We eat barbecue."
      "烤肉很香。": "The barbecue smells good."
  "zh-1821":
    "native": "barbecue"
    "notes":
      "n1": "A barbecue, food grilled on a fire outdoors. 烧 (shāo) is to burn."
    "examples":
      "周末我们去吃烧烤。": "At the weekend we go for a barbecue."
      "烧烤很贵。": "The barbecue is expensive."
  "zh-1822":
    "native": "roast duck"
    "notes":
      "n1": "Roast duck, a famous dish of Beijing. 鸭 (yā) is a duck."
    "examples":
      "烤鸭很好吃。": "Roast duck is delicious."
      "我点一只烤鸭。": "I order a roast duck."
  "zh-1823":
    "native": "curry"
    "notes":
      "n1": "Curry, a spicy sauce or dish from South Asia."
    "examples":
      "咖喱很辣。": "The curry is spicy."
      "我喜欢咖喱饭。": "I like curry with rice."
  "zh-1824":
    "native": "sushi"
    "notes":
      "n1": "Sushi, rice with raw fish or other fillings, from Japan."
    "examples":
      "寿司很新鲜。": "The sushi is very fresh."
      "我喜欢吃寿司。": "I like to eat sushi."
  "zh-1825":
    "native": "dishes (on a menu)"
    "notes":
      "n1": "The dishes on a menu, as a whole. 品 (pǐn) is a thing or item."
    "examples":
      "菜品很多。": "There are a lot of dishes."
      "这家店的菜品很好。":
        "native": "This shop's dishes are very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1826":
    "native": "set meal"
    "notes":
      "n1": "A set meal, several dishes at a fixed price. 套 (tào) is a set."
    "examples":
      "我要一份套餐。":
        "native": "I want a set meal."
        "bases":
          "要":
            "meaning": "must; to want"
      "套餐很便宜。": "The set meal is cheap."
  "zh-1827":
    "native": "to order dishes one by one"
    "notes":
      "n1": "To order dishes separately, not as a set meal. 单 (dān) is single."
    "examples":
      "我们单点。": "We will order each dish separately."
      "单点比套餐贵。":
        "native": "Ordering separately is more expensive than a set meal."
        "bases":
          "比":
            "meaning": "than"
  "zh-1828":
    "native": "to wait for a table"
    "notes":
      "n1": "To wait for a free seat in a busy restaurant. 等 (děng) is to wait, and 位 (wèi) is a seat."
    "examples":
      "要等位吗？":
        "native": "Do we have to wait for a table?"
        "bases":
          "要":
            "meaning": "must; to want"
      "我们在门口等位。": "We wait for a table at the door."
  "zh-1829":
    "native": "empty seat"
    "notes":
      "n1": "A seat that is free and empty. 空 (kōng) is empty."
    "examples":
      "有空位吗？":
        "native": "Is there an empty seat?"
        "bases":
          "有":
            "meaning": "to have; there is"
      "这里没有空位。":
        "native": "There are no empty seats here."
        "bases":
          "这里":
            "meaning": "here"
          "没有":
            "meaning": "there is not; did not"
  "zh-1830":
    "native": "full; no seats left"
    "notes":
      "n1": "Full, with every seat taken. 满 (mǎn) is full, and 座 (zuò) is a seat."
    "examples":
      "今天满座了。":
        "native": "Today every seat is taken."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "饭馆满座了。":
        "native": "The restaurant is full."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
