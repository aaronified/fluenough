"name": "Abstract words in sentences"
"description": "Sentences about ideas, values and feelings: a debate about justice, a talk about duty and a judgement of character. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-4442":
    "native": "This society needs more fairness and justice."
    "confusables":
      "w1":
        "why": "公正 (gōngzhèng) is the broader word for justice; 公平 (gōngpíng) is fair treatment in a single case."
      "w2":
        "why": "平等 (píngděng) is equal status, one part of fairness, not the whole of it."
    "bases":
      "这个":
        "meaning": "this"
      "更多":
        "meaning": "more"
      "的":
        "meaning": "of"
      "和":
        "meaning": "and"
  "zh-4443":
    "native": "He has the courage to admit his mistake, and everyone respects him for it."
    "confusables":
      "w1":
        "why": "勇敢 (yǒnggǎn) is the adjective brave; the sentence uses the noun 勇气 for the courage to admit a mistake."
      "w2":
        "why": "谦虚 (qiānxū) is modesty, a different virtue from owning up to a mistake."
    "bases":
      "有":
        "meaning": "to have"
  "zh-4444":
    "native": "This decision goes against his conscience."
    "confusables":
      "w1":
        "why": "道德 (dàodé) is shared moral standards; 良心 is one person's inner sense of right."
      "w2":
        "why": "信念 (xìnniàn) is a firm belief, which may be good or bad, so it does not name the inner voice."
    "bases":
      "这个":
        "meaning": "this"
      "违背":
        "meaning": "to go against"
      "了":
        "meaning": "particle"
      "的":
        "meaning": "of"
  "zh-4445":
    "native": "The theme of this book is family love and a sense of responsibility."
    "confusables":
      "w1":
        "why": "友情 (yǒuqíng) is the bond between friends, not between family."
      "w2":
        "why": "责任 (zérèn) is a duty one must carry, a different idea from the feeling of responsibility."
    "bases":
      "这本":
        "meaning": "this (book)"
      "的":
        "meaning": "of"
      "主题":
        "meaning": "theme"
      "和":
        "meaning": "and"
  "zh-4446":
    "native": "His theory makes sense, but his logic is still not clear enough."
    "confusables":
      "w1":
        "why": "概念 (gàiniàn) is a concept, one idea with its key features; the sentence is about the whole theory."
      "w2":
        "why": "推理 (tuīlǐ) is the act of reasoning; the sentence says the logic is unclear, which is a property, not an act."
    "bases":
      "的":
        "meaning": "of"
      "但是":
        "meaning": "but"
      "不够":
        "meaning": "not enough"
  "zh-4447":
    "native": "Everyone has their own values, and we should respect other people's choices."
    "confusables":
      "w1":
        "why": "信仰 (xìnyǎng) is a faith; values are a wider set of beliefs about what matters."
      "w2":
        "why": "观念 (guānniàn) is a way of thinking; the sentence is about what each person holds to be important."
    "bases":
      "每个":
        "meaning": "every"
      "有":
        "meaning": "to have"
      "的":
        "meaning": "particle"
  "zh-4448":
    "native": "He has not admitted his mistake, and his good attitude and habit of reflection still need to be developed."
    "confusables":
      "w1":
        "why": "良心 (liángxīn) is conscience, the inner voice; the sentence is about habits of thinking."
      "w2":
        "why": "思考 (sīkǎo) is thinking in general, while 反思 is looking back at oneself."
    "bases":
      "没有":
        "meaning": "not"
      "的":
        "meaning": "of"
      "良好":
        "meaning": "good"
      "和":
        "meaning": "and"
      "培养":
        "meaning": "to develop"
  "zh-4449":
    "native": "Everything he says is arrogant, yet he is brave and not afraid to offend people."
    "confusables":
      "w1":
        "why": "骄傲 (jiāo'ào) is pride, which can be earned; 傲慢 is looking down on others, a different fault."
      "w2":
        "why": "谨慎 (jǐnshèn) is careful and cautious, the opposite of being bold and not afraid to offend."
    "bases":
      "的":
        "meaning": "particle"
      "每句话":
        "meaning": "every word"
      "却":
        "meaning": "but"
      "不怕":
        "meaning": "not afraid"
      "得罪":
        "meaning": "to offend"
  "zh-4450":
    "native": "This article tells the truth about the accident, and the author thought carefully about the causes."
    "confusables":
      "w1":
        "why": "真理 (zhēnlǐ) is a general truth that holds in every case; the sentence is about what happened in one accident."
      "w2":
        "why": "结果 (jiéguǒ) is an outcome, which is what comes after; the sentence is about why the accident happened."
    "bases":
      "这篇":
        "meaning": "this (article)"
      "文章":
        "meaning": "article"
      "的":
        "meaning": "particle"
      "认真地":
        "meaning": "seriously"
      "了":
        "meaning": "particle"
