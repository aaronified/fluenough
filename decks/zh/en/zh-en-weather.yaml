"schema": 1
"id": "zh-en-weather"
"kind": "layer"
"core": "zh-weather"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Weather"
"description": "Forty words for the weather: the forecast and the temperature, cloud and fog and smog, the rain and the storms, the wind, the ice and the snow, and the climate. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1567":
    "native": "weather"
    "notes":
      "n1": "The weather of a day or a place, hot, cold, wet or dry. 天 (tiān) is the sky, and 气 (qì) is air."
    "examples":
      "今天天气很好。": "The weather today is very good."
      "这里的天气怎么样？":
        "native": "How is the weather here?"
        "bases":
          "这里":
            "meaning": "here"
          "的":
            "meaning": "a particle: of; belonging to"
          "怎么样":
            "meaning": "how about it"
  "zh-1568":
    "native": "air temperature"
    "notes":
      "n1": "The temperature of the air outside. 温 (wēn) is warm, and 气 (qì) is air."
    "examples":
      "今天的气温是十度。":
        "native": "The air temperature today is ten degrees."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "度":
            "meaning": "degree"
      "气温很低。":
        "native": "The temperature is very low."
        "bases":
          "低":
            "meaning": "low"
  "zh-1569":
    "native": "weather conditions"
    "notes":
      "n1": "The state of the weather and the sky, as it is observed. 象 (xiàng) is an image or sign."
    "examples":
      "气象报告说明天晴。": "The weather report says tomorrow will be clear."
      "气象很好。": "The weather conditions are good."
  "zh-1570":
    "native": "forecast"
    "notes":
      "n1": "A forecast, a report of what the weather will be. 预 (yù) is in advance, and 报 (bào) is a report."
    "examples":
      "天气预报说下雨。": "The forecast says it will rain."
      "我看天气预报。": "I look at the weather forecast."
  "zh-1571":
    "native": "sunny day"
    "notes":
      "n1": "A day with clear sky and sun. 晴 (qíng) is clear."
    "examples":
      "晴天我去公园。": "On sunny days I go to the park."
      "明天是晴天。": "Tomorrow will be a sunny day."
  "zh-1572":
    "native": "cloudy"
    "notes":
      "n1": "Cloudy, with a lot of cloud in the sky. 多 (duō) is many, and 云 (yún) is cloud."
    "examples":
      "今天多云。": "It is cloudy today."
      "多云的天不热。":
        "native": "On a cloudy day it is not hot."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1573":
    "native": "smog"
    "notes":
      "n1": "Smog, a thick haze of pollution in the air. 雾 (wù) is fog, and 霾 (mái) is haze."
    "examples":
      "今天有雾霾。":
        "native": "There is smog today."
        "bases":
          "有":
            "meaning": "to have; there is"
      "雾霾很大，不要出去。":
        "native": "The smog is thick; do not go out."
        "bases":
          "要":
            "meaning": "must; to want"
          "出去":
            "meaning": "out"
  "zh-1574":
    "native": "air"
    "notes":
      "n1": "The air we breathe. 空 (kōng) is empty, and 气 (qì) is air."
    "examples":
      "空气很干净。": "The air is very clean."
      "山上的空气很好。":
        "native": "The air on the mountain is very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1575":
    "native": "pollution"
    "notes":
      "n1": "Pollution, dirt in the air, water or soil that harms people. 污 (wū) is dirty."
    "examples":
      "空气污染很严重。":
        "native": "Air pollution is very serious."
        "bases":
          "严重":
            "meaning": "serious"
      "河水有污染。":
        "native": "The river water is polluted."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1576":
    "native": "muggy and hot"
    "notes":
      "n1": "Hot and damp, with no wind, so that it is hard to breathe. 闷 (mēn) is stuffy."
    "examples":
      "今天很闷热。": "It is very muggy today."
      "房间很闷热。": "The room is stuffy and hot."
  "zh-1577":
    "native": "cold air; cold front"
    "notes":
      "n1": "A mass of cold air that moves in and brings a fall in temperature. 冷 (lěng) is cold."
    "examples":
      "冷空气来了。":
        "native": "A cold front has arrived."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "冷空气让气温降了。":
        "native": "The cold air has made the temperature fall."
        "bases":
          "让":
            "meaning": "to let; to make"
          "降":
            "meaning": "to fall; to lower"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1578":
    "native": "typhoon"
    "notes":
      "n1": "A typhoon, a big storm with strong winds over the sea. 台 (tái) is a typhoon's name in Chinese."
    "examples":
      "台风来了。":
        "native": "A typhoon has arrived."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "台风很危险。": "A typhoon is very dangerous."
  "zh-1579":
    "native": "flood"
    "notes":
      "n1": "A flood, when a river or the rain covers the land with water. 洪 (hóng) is a great flood."
    "examples":
      "洪水来了。":
        "native": "The flood has come."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "洪水让房子坏了。":
        "native": "The flood has damaged the houses."
        "bases":
          "让":
            "meaning": "to let; to make"
          "坏":
            "meaning": "broken; bad"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1580":
    "native": "drought"
    "notes":
      "n1": "A drought, a long time with no rain. 干 (gān) is dry, and 旱 (hàn) is drought."
    "examples":
      "今年有干旱。":
        "native": "There is a drought this year."
        "bases":
          "有":
            "meaning": "to have; there is"
      "干旱的时候水很少。":
        "native": "In a drought there is very little water."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1581":
    "native": "frost"
    "notes":
      "n1": "Frost, the white ice on the ground on cold mornings."
    "examples":
      "早上地上有霜。":
        "native": "There is frost on the ground in the morning."
        "bases":
          "地上":
            "meaning": "on the ground"
          "有":
            "meaning": "to have; there is"
      "霜很冷。": "The frost is very cold."
  "zh-1582":
    "native": "ice"
    "notes":
      "n1": "Ice, frozen water. 冰箱 (bīngxiāng) is a fridge."
    "examples":
      "湖上有冰。":
        "native": "There is ice on the lake."
        "bases":
          "有":
            "meaning": "to have; there is"
      "冰很滑。":
        "native": "The ice is very slippery."
        "bases":
          "滑":
            "meaning": "slippery"
  "zh-1583":
    "native": "humidity"
    "notes":
      "n1": "The amount of water in the air. 湿 (shī) is wet, and 度 (dù) is a degree."
    "examples":
      "湿度很高。": "The humidity is very high."
      "湿度太低了。":
        "native": "The humidity is too low."
        "bases":
          "低":
            "meaning": "low"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1584":
    "native": "to get colder"
    "notes":
      "n1": "For the temperature to fall. 降 (jiàng) is to fall."
    "examples":
      "明天会降温。":
        "native": "Tomorrow it will get colder."
        "bases":
          "会":
            "meaning": "can; to know how to"
      "夜里降温了。":
        "native": "It has got colder at night."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1585":
    "native": "to get warmer"
    "notes":
      "n1": "For the temperature to rise. 升 (shēng) is to rise."
    "examples":
      "春天气温升温了。":
        "native": "In spring the temperature has risen."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "下午升温很快。": "In the afternoon it gets warm quickly."
  "zh-1586":
    "native": "strong wind; gale"
    "notes":
      "n1": "A strong wind, much stronger than a breeze. 风 (fēng) is wind."
    "examples":
      "外面有大风。":
        "native": "There is a strong wind outside."
        "bases":
          "有":
            "meaning": "to have; there is"
      "大风把伞吹坏了。":
        "native": "The strong wind broke the umbrella."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
          "伞":
            "meaning": "umbrella"
          "吹":
            "meaning": "to blow"
          "坏":
            "meaning": "broken; bad"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1587":
    "native": "light rain"
    "notes":
      "n1": "A light rain, a small fall of rain. 小 (xiǎo) is small."
    "examples":
      "外面下小雨。": "It is drizzling outside."
      "小雨不大。": "The light rain is not heavy."
  "zh-1588":
    "native": "moderate rain"
    "notes":
      "n1": "A moderate rain, between a light rain and a heavy rain. 中 (zhōng) is middle."
    "examples":
      "明天有中雨。":
        "native": "Tomorrow there will be moderate rain."
        "bases":
          "有":
            "meaning": "to have; there is"
      "中雨很常见。":
        "native": "Moderate rain is very common."
        "bases":
          "常见":
            "meaning": "common"
  "zh-1589":
    "native": "heavy rain"
    "notes":
      "n1": "A heavy rain, a lot of rain at once. 大 (dà) is big."
    "examples":
      "外面下大雨了。":
        "native": "It is pouring with rain outside."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "大雨把路淹了。":
        "native": "The heavy rain has flooded the road."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
          "淹":
            "meaning": "to flood"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1590":
    "native": "thunderstorm"
    "notes":
      "n1": "A storm with thunder and rain. 雷 (léi) is thunder, and 雨 (yǔ) is rain."
    "examples":
      "下午可能有雷雨。":
        "native": "There may be a thunderstorm in the afternoon."
        "bases":
          "有":
            "meaning": "to have; there is"
      "雷雨以后很凉快。": "It is cool after the thunderstorm."
  "zh-1591":
    "native": "hail"
    "notes":
      "n1": "Hail, hard lumps of ice that fall from the sky."
    "examples":
      "冰雹打坏了车。":
        "native": "The hail damaged the car."
        "bases":
          "打":
            "meaning": "to hit; to make (a sound)"
          "坏":
            "meaning": "broken; bad"
          "了":
            "meaning": "a particle: a change has happened"
      "冰雹很痛。":
        "native": "Hail hurts."
        "bases":
          "痛":
            "meaning": "painful"
  "zh-1592":
    "native": "sky"
    "notes":
      "n1": "The sky, the space above us."
    "examples":
      "天空很蓝。":
        "native": "The sky is very blue."
        "bases":
          "蓝":
            "meaning": "blue"
      "天空中有很多星星。":
        "native": "There are many stars in the sky."
        "bases":
          "有":
            "meaning": "to have; there is"
          "星星":
            "meaning": "stars"
  "zh-1593":
    "native": "cloud"
    "notes":
      "n1": "A cloud in the sky, white or grey."
    "examples":
      "天上有云。":
        "native": "There are clouds in the sky."
        "bases":
          "有":
            "meaning": "to have; there is"
      "云很白。": "The clouds are very white."
  "zh-1594":
    "native": "umbrella"
    "notes":
      "n1": "An umbrella, for keeping off the rain. 伞 (sǎn) is an umbrella."
    "examples":
      "出门带雨伞。": "Take an umbrella when you go out."
      "我的雨伞坏了。":
        "native": "My umbrella is broken."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "坏":
            "meaning": "broken; bad"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1595":
    "native": "sun protection"
    "notes":
      "n1": "Protection from the sun, such as a sunscreen or a hat. 防 (fáng) is to guard against."
    "examples":
      "夏天要做防晒。":
        "native": "In summer you must use sun protection."
        "bases":
          "要":
            "meaning": "must; to want"
      "防晒霜很好。": "Sunscreen is good."
  "zh-1596":
    "native": "climate"
    "notes":
      "n1": "The usual weather of a place over the years. 候 (hòu) is a season or time."
    "examples":
      "这里的气候很好。":
        "native": "The climate here is very good."
        "bases":
          "这里":
            "meaning": "here"
          "的":
            "meaning": "a particle: of; belonging to"
      "气候在变化。":
        "native": "The climate is changing."
        "bases":
          "变化":
            "meaning": "to change"
  "zh-1597":
    "native": "bitterly cold"
    "notes":
      "n1": "Very cold, cold enough to make you shiver. 寒 (hán) is cold."
    "examples":
      "冬天很寒冷。": "Winter is bitterly cold."
      "外面寒冷得很。":
        "native": "It is bitterly cold outside."
        "bases":
          "得":
            "meaning": "a particle after a verb: how it is done"
  "zh-1598":
    "native": "scorching hot"
    "notes":
      "n1": "Very hot, hot enough to be uncomfortable. 炎 (yán) is flame or heat."
    "examples":
      "夏天很炎热。": "Summer is scorching hot."
      "沙漠很炎热。":
        "native": "The desert is scorching hot."
        "bases":
          "沙漠":
            "meaning": "desert"
  "zh-1599":
    "native": "warm"
    "notes":
      "n1": "Warm and comfortable. 温 (wēn) is warm."
    "examples":
      "春天很温暖。": "Spring is warm."
      "房间很温暖。": "The room is warm."
  "zh-1600":
    "native": "lightning"
    "notes":
      "n1": "Lightning, the bright flash in a storm. 闪 (shǎn) is to flash."
    "examples":
      "闪电很亮。":
        "native": "The lightning is very bright."
        "bases":
          "亮":
            "meaning": "bright"
      "闪电以后有雷。":
        "native": "After the lightning comes the thunder."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1601":
    "native": "thermometer"
    "notes":
      "n1": "A thermometer, which shows the temperature. 计 (jì) is a meter or gauge."
    "examples":
      "温度计上是二十度。":
        "native": "The thermometer reads twenty degrees."
        "bases":
          "度":
            "meaning": "degree"
      "请看温度计。": "Please look at the thermometer."
  "zh-1602":
    "native": "rainy season"
    "notes":
      "n1": "The season when it rains a lot. 季 (jì) is a season."
    "examples":
      "夏天是雨季。": "Summer is the rainy season."
      "雨季很潮湿。": "The rainy season is very damp."
  "zh-1603":
    "native": "storm wind"
    "notes":
      "n1": "A violent wind, a storm. 暴 (bào) is violent."
    "examples":
      "暴风来了。":
        "native": "A storm wind has come."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "暴风把树吹倒了。":
        "native": "The storm wind blew the tree down."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
          "吹":
            "meaning": "to blow"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1604":
    "native": "high temperature; heat"
    "notes":
      "n1": "A high temperature, very hot weather. 高 (gāo) is high."
    "examples":
      "今天是高温。": "It is very hot today."
      "高温天气很难受。":
        "native": "Very hot weather is unpleasant."
        "bases":
          "难受":
            "meaning": "uncomfortable"
  "zh-1605":
    "native": "low temperature"
    "notes":
      "n1": "A low temperature, very cold weather. 低 (dī) is low."
    "examples":
      "冬天有低温。":
        "native": "In winter there are low temperatures."
        "bases":
          "有":
            "meaning": "to have; there is"
      "低温很危险。": "Low temperatures are dangerous."
  "zh-1606":
    "native": "wind direction"
    "notes":
      "n1": "The direction the wind blows from. 向 (xiàng) is a direction."
    "examples":
      "风向是北风。": "The wind direction is from the north."
      "风向变了。":
        "native": "The wind direction has changed."
        "bases":
          "变":
            "meaning": "to change"
          "了":
            "meaning": "a particle: a change has happened"
