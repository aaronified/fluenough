"id": "zh-en-emergencies-sentences"
"kind": "layer"
"core": "zh-emergencies-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Emergencies in sentences"
"description": "Sentences using the forty emergency words: escape, evacuation, fire, a fall, a leak, a power cut, a rescue and where to go. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-7000":
    "confusables":
      "w1":
        "why": "安全 (ānquán) is safe, a state rather than the act of escaping."
      "w2":
        "why": "救命 (jiùmìng) is the cry 'Help!', a call for rescue rather than an escape."
    "native": "Please escape quickly, everyone."
  "zh-7001":
    "confusables":
      "w1":
        "why": "救护车 (jiùhùchē) is an ambulance, which takes the injured away rather than the crowd."
      "w2":
        "why": "消防车 (xiāofángchē) is a fire engine, which fights fires rather than moves people."
    "bases":
      "从":
        "meaning": "from"
    "native": "Everyone, evacuate down the stairs."
  "zh-7002":
    "confusables":
      "w1":
        "why": "手电筒 (shǒudiàntǒng) is a torch, a light rather than a tool for fire."
      "w2":
        "why": "水桶 (shuǐtǒng) is a bucket, a container for water rather than a fire tool."
    "bases":
      "有":
        "meaning": "there is; to have"
    "native": "There is a fire extinguisher in the kitchen."
  "zh-7003":
    "confusables":
      "w1":
        "why": "救护车 (jiùhùchē) is an ambulance, a vehicle rather than the stretcher itself."
      "w2":
        "why": "药店 (yàodiàn) is a pharmacy, a shop for medicine rather than a hospital."
    "bases":
      "有":
        "meaning": "there is; to have"
    "native": "There is a stretcher in the hospital."
  "zh-7004":
    "confusables":
      "w1":
        "why": "警报 (jǐngbào) is an alarm, a warning sound rather than a person."
      "w2":
        "why": "警察局 (jǐngchájú) is a police station, a building for a different service."
    "native": "The firefighter goes at once to rescue people."
  "zh-7005":
    "confusables":
      "w1":
        "why": "等 (děng) is to wait, a single action rather than gathering together."
      "w2":
        "why": "开会 (kāihuì) is to have a meeting, a planned gathering with an agenda."
    "native": "Please go to the door and assemble."
  "zh-7006":
    "confusables":
      "w1":
        "why": "出发 (chūfā) is to set off on a journey, not to leave a danger."
      "w2":
        "why": "离开 (líkāi) is to leave, without the sense of an emergency."
    "native": "We leave this area at once."
  "zh-7007":
    "confusables":
      "w1":
        "why": "摔伤 (shuāishāng) is to be hurt by a fall, which comes after the fall."
      "w2":
        "why": "受伤 (shòushāng) is to be injured, a wider word."
    "bases":
      "了":
        "meaning": "a change has happened"
    "native": "The child fell down."
  "zh-7008":
    "confusables":
      "w1":
        "why": "摔倒 (shuāidǎo) is to fall down, not to lose consciousness."
      "w2":
        "why": "生病 (shēngbìng) is to be ill, a longer state rather than a sudden faint."
    "bases":
      "了":
        "meaning": "a change has happened"
    "native": "He fainted in the hospital."
  "zh-7009":
    "confusables":
      "w1":
        "why": "电源 (diànyuán) is a power supply, the source of electricity rather than its loss."
      "w2":
        "why": "开关 (kāiguān) is a switch, a part you turn rather than a cut."
    "bases":
      "了":
        "meaning": "a change has happened"
    "native": "There was a power cut tonight."
  "zh-7010":
    "confusables":
      "w1":
        "why": "水 (shuǐ) is water itself, not a leak."
      "w2":
        "why": "水壶 (shuǐhú) is a kettle, a container rather than a fitting."
    "bases":
      "了":
        "meaning": "a change has happened"
    "native": "The tap is leaking."
  "zh-7011":
    "confusables":
      "w1":
        "why": "漏水 (lòushuǐ) is to leak water, a leak of a different kind."
      "w2":
        "why": "电线 (diànxiàn) is an electric wire, a different hazard."
    "native": "A gas leak is very dangerous."
  "zh-7012":
    "confusables":
      "w1":
        "why": "失火 (shīhuǒ) is to catch fire, the cause of the smoke."
      "w2":
        "why": "火 (huǒ) is fire itself, the flame rather than the smoke."
    "bases":
      "有":
        "meaning": "there is; to have"
    "native": "There is thick smoke in the building."
  "zh-7013":
    "confusables":
      "w1":
        "why": "呼救 (hūjiù) is to call for help, which a person may do first."
      "w2":
        "why": "溺水 (nìshuǐ) is to drown in water, a different danger."
    "native": "The child is suffocating in thick smoke."
  "zh-7014":
    "confusables":
      "w1":
        "why": "受伤 (shòushāng) is to be injured, a state rather than a person."
      "w2":
        "why": "病人 (bìngrén) is a patient, a person under medical care."
    "native": "The victim is at the hospital."
  "zh-7015":
    "confusables":
      "w1":
        "why": "救命 (jiùmìng) is the short cry 'Help!', not a request made to a crowd."
      "w2":
        "why": "急救 (jíjiù) is first aid, the treatment that follows."
    "bases":
      "向":
        "meaning": "towards"
    "native": "The child calls out to everyone for help."
  "zh-7016":
    "confusables":
      "w1":
        "why": "报警 (bàojǐng) is to call the police, a phone call rather than a visit."
      "w2":
        "why": "报告 (bàogào) is a report, a spoken or written account rather than a complaint."
    "native": "He goes to the police station to report it."
  "zh-7017":
    "confusables":
      "w1":
        "why": "着火 (zháohuǒ) is to catch fire, the thing that must be prevented."
      "w2":
        "why": "灭火 (mièhuǒ) is to put out a fire, which comes after the fire starts."
    "bases":
      "要":
        "meaning": "must; need to"
    "native": "Everyone must take care to prevent fire."
  "zh-7018":
    "confusables":
      "w1":
        "why": "警报 (jǐngbào) is a warning, the general word for an alarm rather than the device."
      "w2":
        "why": "报警 (bàojǐng) is to call the police, an action rather than a device."
    "native": "The alarm is at the door, so everyone should leave quickly."
  "zh-7019":
    "confusables":
      "w1":
        "why": "风 (fēng) is wind in general, not a storm."
      "w2":
        "why": "洪水 (hóngshuǐ) is a flood, a different natural danger."
    "bases":
      "和":
        "meaning": "and"
    "native": "Typhoons and tornadoes are both very dangerous."
  "zh-7020":
    "confusables":
      "w1":
        "why": "滑 (huá) is slippery, a quality of the ground rather than a fall."
      "w2":
        "why": "摔倒 (shuāidǎo) is to fall down, which can follow a slip."
    "native": "On rainy days, be careful not to slip."
  "zh-7021":
    "confusables":
      "w1":
        "why": "急救 (jíjiù) is first aid, the treatment rather than the box."
      "w2":
        "why": "止痛药 (zhǐtòngyào) is a painkiller, a medicine rather than a kit."
    "bases":
      "有":
        "meaning": "there is; to have"
    "native": "There is a first-aid kit in the car."
  "zh-7022":
    "confusables":
      "w1":
        "why": "烫伤 (tàngshāng) is a scald, a burn from heat rather than a cut."
      "w2":
        "why": "伤口 (shāngkǒu) is a wound, the injured place rather than the act of cutting."
    "bases":
      "了":
        "meaning": "a change has happened"
    "native": "The child cut his hand."
  "zh-7023":
    "confusables":
      "w1":
        "why": "吃药 (chīyào) is to take medicine, a treatment rather than a poisoning."
      "w2":
        "why": "打针 (dǎzhēn) is to have an injection, a medical treatment."
    "bases":
      "了":
        "meaning": "a change has happened"
    "native": "The child has been poisoned, so go to hospital quickly."
  "zh-7024":
    "confusables":
      "w1":
        "why": "电池 (diànchí) is a battery, a store of power rather than a live wire."
      "w2":
        "why": "开关 (kāiguān) is a switch, a part you press rather than a cable."
    "native": "The cable is in the rain, so be careful of an electric shock."
  "zh-7025":
    "confusables":
      "w1":
        "why": "水 (shuǐ) is water, the thing itself rather than the danger of drowning."
      "w2":
        "why": "开水 (kāishuǐ) is boiled water, which is for drinking rather than swimming."
    "native": "Be careful not to drown."
  "zh-7026":
    "confusables":
      "w1":
        "why": "着火 (zháohuǒ) is to catch fire, the state before the fire is put out."
      "w2":
        "why": "灭火器 (mièhuǒqì) is the extinguisher, the tool used to put out a fire."
    "bases":
      "正在":
        "meaning": "in the middle of"
    "native": "They are putting out the fire."
  "zh-7027":
    "confusables":
      "w1":
        "why": "走 (zǒu) is to walk, the everyday verb rather than to be lost."
      "w2":
        "why": "找不到 (zhǎobudào) is cannot find, the result of looking."
    "bases":
      "的":
        "meaning": "of"
      "了":
        "meaning": "a change has happened"
    "native": "My dog has gone missing."
  "zh-7028":
    "confusables":
      "w1":
        "why": "火灾 (huǒzāi) is a fire disaster, a noun rather than the start of a fire."
      "w2":
        "why": "着火 (zháohuǒ) is to catch fire, a near match with a different use."
    "bases":
      "了":
        "meaning": "a change has happened"
    "native": "The house is on fire, so quickly phone the police."
  "zh-7029":
    "confusables":
      "w1":
        "why": "地震 (dìzhèn) is an earthquake, a natural disaster rather than a blast."
      "w2":
        "why": "紧急 (jǐnjí) is urgent, an adjective rather than a blast."
    "bases":
      "了":
        "meaning": "a change has happened"
    "native": "The factory exploded, and it is very dangerous."
  "zh-7030":
    "confusables":
      "w1":
        "why": "门口 (ménkǒu) is a doorway, a place rather than a line."
      "w2":
        "why": "进 (jìn) is to enter, the opposite direction."
    "native": "Everyone waits outside the police line."
  "zh-7031":
    "confusables":
      "w1":
        "why": "医院 (yīyuàn) is a hospital, a medical place rather than a shelter."
      "w2":
        "why": "地方 (dìfang) is a place in general, a wider word."
    "native": "The child is at the shelter."
  "zh-7032":
    "confusables":
      "w1":
        "why": "紧急 (jǐnjí) is urgent, a near match with a different use."
      "w2":
        "why": "入口 (rùkǒu) is an entrance, the other way through a door."
    "bases":
      "有":
        "meaning": "there is; to have"
    "native": "There is an emergency exit here."
  "zh-7033":
    "confusables":
      "w1":
        "why": "逃生 (táoshēng) is to escape to safety, the aim of the escape."
      "w2":
        "why": "走 (zǒu) is to walk or leave, a plain verb."
    "bases":
      "从":
        "meaning": "from"
      "了":
        "meaning": "a change has happened"
    "native": "The child escaped from the room."
  "zh-7034":
    "confusables":
      "w1":
        "why": "逃离 (táolí) is to escape from a place, the opposite of hiding."
      "w2":
        "why": "找 (zhǎo) is to look for, which is what a searcher does."
    "native": "Everyone is hiding in the room."
  "zh-7035":
    "confusables":
      "w1":
        "why": "衣服 (yīfu) is clothes, a wider word."
      "w2":
        "why": "雨衣 (yǔyī) is a raincoat, a different garment."
    "bases":
      "要":
        "meaning": "must; need to"
    "native": "The child must wear a life jacket."
  "zh-7036":
    "confusables":
      "w1":
        "why": "洪水 (hóngshuǐ) is a flood, the event itself rather than the general word."
      "w2":
        "why": "大雨 (dàyǔ) is heavy rain, which can cause flooding."
    "native": "Floods are very dangerous."
  "zh-7037":
    "confusables":
      "w1":
        "why": "危险 (wēixiǎn) is dangerous, a quality rather than an action."
      "w2":
        "why": "检查 (jiǎnchá) is to check or inspect, a different kind of preparation."
    "native": "Disaster prevention is very important."
  "zh-7038":
    "confusables":
      "w1":
        "why": "走失 (zǒushī) is to go missing, a near match for a child or a pet."
      "w2":
        "why": "找不到 (zhǎobudào) is cannot find, the result of looking."
    "bases":
      "了":
        "meaning": "a change has happened"
    "native": "The child has gone missing, so everyone is looking for him."
  "zh-7039":
    "confusables":
      "w1":
        "why": "洪水 (hóngshuǐ) is a flood, a different disaster."
      "w2":
        "why": "危险 (wēixiǎn) is dangerous, a quality rather than a disaster."
    "bases":
      "有":
        "meaning": "there is; to have"
    "native": "After the earthquake there are aftershocks."
