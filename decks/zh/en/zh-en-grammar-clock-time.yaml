  "notes": "点 (diǎn) is 'o'clock', and 半 (bàn) after it is half past: 七点半 (qī diǎn bàn), half past seven. Two o'clock is 两点 (liǎng diǎn), with 两 (liǎng) and not 二 (èr), as 两 is said before 点 (diǎn). The hour comes first and the minutes after it: this table gives only the hour and the half."
