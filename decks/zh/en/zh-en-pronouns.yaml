  "name": "English"
"name": "Pronouns and people words"
"description": "Ten words for who and which: we, you (plural), they (for people), she, they (women), it (for things and animals), oneself, other people, this and that. Not yet checked by a Mandarin speaker:\
  \ please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0157":
    "native": "we; us"
    "notes":
      "n1": "我们 (wǒmen) is 'we' and 'us'. It adds 们 (men) to 我 (wǒ), I, for more than one person."
      "n2": "我们 is the plural of 我 (wǒ); 们 (men) marks a group of people, not a thing."
    "examples":
      "我们是同学。": "We are classmates."
      "我们都是学生。": "We are all students."
  "zh-0158":
    "native": "you (plural)"
    "notes":
      "n1": "你们 (nǐmen) is 'you' for more than one person. 您 (nín) is the polite single 'you'."
      "n2": "你们 adds 们 (men) to 你 (nǐ), you, as 我们 does to 我 (wǒ)."
    "examples":
      "你们好吗？": "How are you all?"
      "你们是老师吗？": "Are you all teachers?"
  "zh-0159":
    "native": "they; them (people)"
    "notes":
      "n1": "他们 (tāmen) is 'they' for a group of men or of mixed people, written with 他 (tā), he."
      "n2": "他们 is also used for a group of people when the sex is not given."
    "examples":
      "他们是朋友。": "They are friends."
      "他们都来吗？": "Are they all coming?"
  "zh-0160":
    "native": "she; her"
    "notes":
      "n1": "她 (tā) is 'she' and 'her'. It is written with the 女 (nǚ) radical, for women."
      "n2": "她 and 他 (tā) are the same sound; the written character tells which."
    "examples":
      "她是我朋友。": "She is my friend."
      "她好吗？": "How is she?"
  "zh-0161":
    "native": "they; them (women)"
    "notes":
      "n1": "她们 (tāmen) is 'they' for a group of women, written with 她 (tā), she."
      "n2": "她们 is said the same as 他们 (tāmen); only the written character differs."
    "examples":
      "她们都是老师。": "They are all teachers."
      "她们很高兴。": "They are very happy."
  "zh-0162":
    "native": "it"
    "notes":
      "n1": "它 (tā) is 'it', for a thing or an animal. It is said the same as 她 (tā) and 他 (tā)."
    "examples":
      "它很好。": "It is good."
      "它很高兴吗？": "Is it happy?"
  "zh-0163":
    "native": "oneself; myself; yourself"
    "notes":
      "n1": "自己 (zìjǐ) is 'oneself'. After a pronoun it adds 'myself', 'yourself', as in 我自己 (wǒ zìjǐ)."
    "examples":
      "我自己来。": "I'll come myself."
      "你自己好吗？": "Are you well yourself?"
  "zh-0164":
    "native": "other people"
    "notes":
      "n1": "别人 (biérén) is 'other people', the people who are not you or those you name."
    "examples":
      "别人是老师。": "The others are teachers."
      "别人都来。": "The others all come."
  "zh-0165":
    "native": "this"
    "notes":
      "n1": "这 (zhè) is 'this', for a thing near the speaker or a person close by. 这是 (zhè shì) is 'this is'."
    "examples":
      "这是我朋友。": "This is my friend."
      "这很好。": "This is good."
  "zh-0166":
    "native": "that"
    "notes":
      "n1": "那 (nà) is 'that', for a thing or person further away. 那是 (nà shì) is 'that is'."
    "examples":
      "那是老师。": "That is a teacher."
      "那很好吗？": "Is that good?"
