"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Opinions in sentences"
"description": "Sentences about giving a view, agreeing or disagreeing politely, and giving reasons. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-3110":
    "confusables":
      "w1":
        "why": "看法 (kànfǎ) is a view, which is close in meaning."
      "w2":
        "why": "建议 (jiànyì) is a suggestion, which is a proposal."
    "bases":
      "的":
        "meaning": "of"
      "这样":
        "meaning": "like this"
    "native": "My opinion is this."
  "zh-3111":
    "confusables":
      "w1":
        "why": "证据 (zhèngjù) is evidence, a different thing."
      "w2":
        "why": "道理 (dàolǐ) is sense, a close but different word."
    "native": "This reason is very reasonable."
  "zh-3112":
    "confusables":
      "w1":
        "why": "重视 (zhòngshì) is to take seriously, the opposite."
      "w2":
        "why": "否认 (fǒurèn) is to deny, a different act."
    "bases":
      "了":
        "meaning": "a particle"
    "native": "He ignored the facts."
  "zh-3113":
    "confusables":
      "w1":
        "why": "反驳 (fǎnbó) is to rebut, the opposite."
      "w2":
        "why": "同意 (tóngyì) is to agree, a close word."
    "bases":
      "的":
        "meaning": "of"
    "native": "We agree with your viewpoint."
  "zh-3114":
    "confusables":
      "w1":
        "why": "肯定 (kěndìng) is certainly, the opposite of maybe."
      "w2":
        "why": "或许 (huòxǔ) is perhaps, a close word."
    "bases":
      "的":
        "meaning": "of"
    "native": "Maybe you are right."
  "zh-3115":
    "confusables":
      "w1":
        "why": "正确 (zhèngquè) is correct, a close word."
      "w2":
        "why": "错误 (cuòwù) is a mistake, the opposite."
    "native": "This conclusion is very reliable."
  "zh-3116":
    "confusables":
      "w1":
        "why": "责任 (zérèn) is a duty, a different idea."
      "w2":
        "why": "利益 (lìyì) is a benefit, a different idea."
    "bases":
      "要":
        "meaning": "must; to want"
      "的":
        "meaning": "of"
    "native": "Everyone must respect other people's rights."
  "zh-3117":
    "confusables":
      "w1":
        "why": "辩论 (biànlùn) is a formal debate, a more structured kind."
      "w2":
        "why": "讨论 (tǎolùn) is to discuss, a calmer kind."
    "native": "He is arguing about this problem."
