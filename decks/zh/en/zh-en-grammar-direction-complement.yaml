  "entries":
    "zou": "to walk"
    "pao": "to run"
    "zuo": "to sit"
    "hui": "to return"
  "notes": "A direction word goes straight after the verb: 走进教室 (zǒujìn jiàoshì), walk into the classroom; 跑出教室 (pǎochū jiàoshì), run out of the classroom; 坐下 (zuòxià), sit down. The direction is the word that follows the verb, and the place comes after it. 进 (jìn) is into, 出 (chū) is out, 下 (xià) is down, and 回去 (huíqù) is back there."
