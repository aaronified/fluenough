"name": "进 (jìn), 出 (chū), 下 (xià), 回 (huí): the direction of an action"
"license": "CC-BY-SA-4.0"
"description": "The direction an action goes: a word after the verb, such as 进 (jìn) into, 出 (chū) out, 下 (xià) down, or 回 (huí) back. Not yet checked by a Mandarin speaker: please report any mistake."
