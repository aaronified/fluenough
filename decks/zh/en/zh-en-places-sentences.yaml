"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1148":
    "confusables":
      "w1":
        "why": "火车站 (huǒchēzhàn) is a railway station, not a bank."
      "w2":
        "why": "商店 (shāngdiàn) is a shop, a different kind of place."
    "native": "The bank is next to the hospital."
  "zh-1149":
    "confusables":
      "w1":
        "why": "学校 (xuéxiào) is a school, where you study, not read in a public place."
      "w2":
        "why": "公司 (gōngsī) is a company, a place of work."
    "native": "I go to the library to read."
  "zh-1150":
    "confusables":
      "w1":
        "why": "村子 (cūnzi) is a village, a small place."
      "w2":
        "why": "农村 (nóngcūn) is the countryside, not a city."
    "native": "This city is very big."
  "zh-1151":
    "confusables":
      "w1":
        "why": "小学 (xiǎoxué) is primary school, a later stage."
      "w2":
        "why": "大学 (dàxué) is a university, far too late for a child."
    "native": "The child learns characters at kindergarten."
  "zh-1152":
    "confusables":
      "w1":
        "why": "河 (hé) is a river, not the sea."
      "w2":
        "why": "湖 (hú) is a lake, still water."
    "bases":
      "有":
        "meaning": "to have; there is"
    "native": "There are many people at the seaside."
  "zh-1153":
    "confusables":
      "w1":
        "why": "商店 (shāngdiàn) is a shop, not one that sells books only."
      "w2":
        "why": "药店 (yàodiàn) is a pharmacy, which sells medicine."
    "native": "I buy books in the bookshop."
  "zh-1154":
    "confusables":
      "w1":
        "why": "理发店 (lǐfàdiàn) is a hairdresser's."
      "w2":
        "why": "洗衣店 (xǐyīdiàn) is a laundry."
    "native": "The pharmacy is opposite the bank."
  "zh-1155":
    "confusables":
      "w1":
        "why": "厨房 (chúfáng) is a kitchen, where food is cooked, not eaten."
      "w2":
        "why": "饭馆 (fànguǎn) is a restaurant, a close fit, but the sentence says 餐厅 (cāntīng)."
    "bases":
      "每天":
        "meaning": "every day"
    "native": "He goes to the restaurant to eat every day."
