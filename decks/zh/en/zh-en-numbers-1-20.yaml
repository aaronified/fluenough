"name": "Numbers 1 to 20"
"description": "Nine number words: one, two (two ways: 二 and 两), three, five, six, seven, eleven, and twenty. Four, eight, nine and ten are taught with the tones. Not yet checked by a Mandarin speaker:\
  \ please report any mistake."
