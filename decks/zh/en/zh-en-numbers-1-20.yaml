"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0209":
    "native": "one"
    "notes":
      "n1": "一 (yī) is one. Its tone changes before some tones: it is said yí before a fourth tone and yì before the others (see tone sandhi)."
    "examples":
      "一，十一，二十。": "One, eleven, twenty."
      "一，二，三。": "One, two, three."
  "zh-0210":
    "native": "two (in counting)"
    "notes":
      "n1": "二 (èr) is two, in counting: 一 (yī), 二 (èr), 三 (sān) is one, two, three."
    "examples":
      "二，四，六，八。": "Two, four, six, eight."
      "二，四，六。": "Two, four, six."
  "zh-0211":
    "native": "two (amount)"
    "notes":
      "n1": "两 (liǎng) is also two, the word used for two of something, before a measure word, as in 两个 (liǎng ge), two of them. 二 (èr) is the two of counting and of numbers."
    "examples":
      "两个人。":
        "native": "Two people."
        "bases":
          "个":
            "meaning": "measure word for people and things"
      "我有两个孩子。":
        "native": "I have two children."
        "bases":
          "有":
            "meaning": "to have"
          "个":
            "meaning": "measure word for people and things"
  "zh-0212":
    "native": "three"
    "notes":
      "n1": "三 (sān) is three."
    "examples":
      "三，四，五。": "Three, four, five."
      "三，六，九。": "Three, six, nine."
  "zh-0213":
    "native": "five"
    "notes":
      "n1": "五 (wǔ) is five. Its tone is the third tone, so the third-tone rules apply to it."
    "examples":
      "五，六，七。": "Five, six, seven."
      "五，十。": "Five, ten."
  "zh-0214":
    "native": "six"
    "notes":
      "n1": "六 (liù) is six."
    "examples":
      "六，七，八。": "Six, seven, eight."
      "六，十。": "Six, ten."
  "zh-0215":
    "native": "seven"
    "notes":
      "n1": "七 (qī) is seven."
    "examples":
      "七，十一。": "Seven, eleven."
      "七，八，九。": "Seven, eight, nine."
  "zh-0216":
    "native": "eleven"
    "notes":
      "n1": "十一 (shíyī) is eleven: 十 (shí), ten, and 一 (yī), one, said together."
    "examples":
      "十一，二十。": "Eleven, twenty."
      "十一，十。": "Eleven, ten."
  "zh-0217":
    "native": "twenty"
    "notes":
      "n1": "二十 (èrshí) is twenty: 二 (èr), two, and 十 (shí), ten."
    "examples":
      "二十，十一，十。": "Twenty, eleven, ten."
      "二十，二。": "Twenty, two."
