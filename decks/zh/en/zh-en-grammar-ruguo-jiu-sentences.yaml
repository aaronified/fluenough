"id": "zh-en-grammar-ruguo-jiu-sentences"
"kind": "layer"
"core": "zh-grammar-ruguo-jiu-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "如果 (rúguǒ) ... 就 (jiù), 只要 (zhǐyào) ... 就 (jiù), 除非 (chúfēi) ... 否则 (fǒuzé): if, as long as, and unless"
"description": "Sentences that set a condition and its result: 如果下雨 (rúguǒ xiàyǔ)，我就不去 (if it rains, I will not go), 只要你来 (zhǐyào nǐ lái)，我就高兴 (as long as you come, I am happy), and 除非你同意 (chúfēi nǐ tóngyì)，否则我不去 (unless you agree, I will not go). Not yet checked by a Mandarin speaker: please report any mistake."
