"cards":
  "zh-2959":
    "confusables":
      "w1":
        "why": "散步 (sànbù) is to take a walk, the activity."
      "w2":
        "why": "回家 (huíjiā) is to go home, a different plan."
    "bases":
      "如果":
        "meaning": "if"
    "native": "If it rains, we will not go to the park."
  "zh-2960":
    "confusables":
      "w1":
        "why": "晴 (qíng) is sunny, a weather word."
      "w2":
        "why": "阴 (yīn) is cloudy, the opposite."
    "bases":
      "只要":
        "meaning": "as long as"
    "native": "As long as the weather is good, we will go for a walk."
  "zh-2961":
    "confusables":
      "w1":
        "why": "拒绝 (jùjué) is to refuse, a different act."
      "w2":
        "why": "答应 (dāying) is to agree or promise, the other side."
    "bases":
      "除非":
        "meaning": "unless"
      "否则":
        "meaning": "otherwise"
    "native": "Unless you agree, I will not go."
  "zh-2962":
    "confusables":
      "w1":
        "why": "忙 (máng) is busy, the opposite of having time."
      "w2":
        "why": "明天 (míngtiān) is tomorrow, a time word."
    "bases":
      "如果":
        "meaning": "if"
      "有":
        "meaning": "to have; there is"
    "native": "If you have time, let us eat together."
  "zh-2963":
    "confusables":
      "w1":
        "why": "失败 (shībài) is to fail, the opposite."
      "w2":
        "why": "尝试 (chángshì) is to try, which comes before success."
    "bases":
      "只要":
        "meaning": "as long as"
      "能":
        "meaning": "can; may"
    "native": "As long as you work hard, you can succeed."
  "zh-2964":
    "confusables":
      "w1":
        "why": "还 (huán) is to return, the opposite of lending."
      "w2":
        "why": "买 (mǎi) is to buy, not to borrow."
    "bases":
      "的":
        "meaning": "of"
      "如果":
        "meaning": "if"
      "可以":
        "meaning": "can; may"
      "的话":
        "meaning": "if that is so"
    "native": "I would like to borrow your book, if that is all right."
  "zh-2965":
    "confusables":
      "w1":
        "why": "难过 (nánguò) is sad, the opposite of happy."
      "w2":
        "why": "生气 (shēngqì) is angry, a different feeling."
    "bases":
      "如果":
        "meaning": "if"
    "native": "If I pass the exam, I will be very happy."
  "zh-2966":
    "confusables":
      "w1":
        "why": "饭 (fàn) is a meal, a noun."
      "w2":
        "why": "喝 (hē) is to drink, a different act."
    "bases":
      "除非":
        "meaning": "unless"
      "否则":
        "meaning": "otherwise"
    "native": "Unless you come, we will not eat."
