"schema": 1
"id": "zh-en-body"
"kind": "layer"
"core": "zh-body"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "The body"
"description": "Thirty-five words for the body: the head and face, the arms and legs, the inside of the body, and words for feeling unwell, exercise and health. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1059":
    "native": "head"
    "notes":
      "n1": "The head, the top of the body. 头发 (tóufa) is hair, and 头疼 (tóuténg) is a headache."
    "examples":
      "我的头很疼。":
        "native": "My head hurts a lot."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "他低下了头。":
        "native": "He lowered his head."
        "bases":
          "低":
            "meaning": "low; to lower"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1060":
    "native": "hair (on the head)"
    "notes":
      "n1": "The hair on the head. 发 (fa) is hair, the same word."
    "examples":
      "她的头发很长。":
        "native": "Her hair is very long."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "我每天洗头发。":
        "native": "I wash my hair every day."
        "bases":
          "每天":
            "meaning": "every day"
  "zh-1061":
    "native": "eye"
    "notes":
      "n1": "An eye, one of the two organs for seeing. 睛 (jīng) is the pupil of the eye."
    "examples":
      "她的眼睛很大。":
        "native": "Her eyes are very big."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "我眼睛不舒服。": "My eyes do not feel well."
  "zh-1062":
    "native": "ear"
    "notes":
      "n1": "An ear, for hearing. 耳 (ěr) is the ear, and 朵 (duǒ) is a flower or a small thing."
    "examples":
      "耳朵很小。": "The ears are very small."
      "我的耳朵很疼。":
        "native": "My ear hurts."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1063":
    "native": "nose"
    "notes":
      "n1": "A nose, for smelling and breathing. 子 (zi) makes it a noun."
    "examples":
      "他的鼻子很大。":
        "native": "His nose is very big."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "我鼻子不通。":
        "native": "My nose is blocked."
        "bases":
          "通":
            "meaning": "open; not blocked"
  "zh-1064":
    "native": "mouth"
    "notes":
      "n1": "The mouth, for eating and speaking. 口 (kǒu) is the opening of the mouth."
    "examples":
      "请张开嘴。": "Please open your mouth."
      "她的嘴很小。":
        "native": "Her mouth is very small."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1065":
    "native": "tooth"
    "notes":
      "n1": "A tooth. 牙齿 (yáchǐ) is the word for the teeth together."
    "examples":
      "我的牙很疼。":
        "native": "My tooth hurts."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "每天刷牙。":
        "native": "Brush your teeth every day."
        "bases":
          "每天":
            "meaning": "every day"
          "刷":
            "meaning": "to brush"
  "zh-1066":
    "native": "face"
    "notes":
      "n1": "The face, the front of the head. 脸色 (liǎnsè) is the colour of the face."
    "examples":
      "他的脸很大。":
        "native": "His face is very big."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "你的脸很红。":
        "native": "Your face is very red."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1067":
    "native": "neck"
    "notes":
      "n1": "The neck, between the head and the shoulders."
    "examples":
      "我的脖子很疼。":
        "native": "My neck hurts."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "她的脖子很长。":
        "native": "Her neck is very long."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1068":
    "native": "shoulder"
    "notes":
      "n1": "The shoulder, where the arm joins the body."
    "examples":
      "他的肩膀很宽。":
        "native": "His shoulders are broad."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "宽":
            "meaning": "wide; broad"
      "我肩膀很累。": "My shoulders are very tired."
  "zh-1069":
    "native": "finger"
    "notes":
      "n1": "A finger of the hand. 指 (zhǐ) is to point."
    "examples":
      "我的手指很冷。":
        "native": "My fingers are cold."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "她用手指指门口。":
        "native": "She points at the door with her finger."
        "bases":
          "用":
            "meaning": "to use"
          "指":
            "meaning": "to point"
  "zh-1070":
    "native": "arm"
    "notes":
      "n1": "The arm, from the shoulder to the hand."
    "examples":
      "他的胳膊很长。":
        "native": "His arms are long."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "我的胳膊疼。":
        "native": "My arm hurts."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1071":
    "native": "leg"
    "notes":
      "n1": "A leg, the part of the body from the hip to the foot."
    "examples":
      "我的腿很累。":
        "native": "My legs are very tired."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "他的腿很长。":
        "native": "His legs are very long."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1072":
    "native": "foot"
    "notes":
      "n1": "A foot, at the end of the leg. 脚 (jiǎo) is also the lower part of some things."
    "examples":
      "我的脚很疼。":
        "native": "My foot hurts."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "脚太大了。":
        "native": "The foot is too big."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1073":
    "native": "knee"
    "notes":
      "n1": "The knee, in the middle of the leg. 盖 (gài) is a cover."
    "examples":
      "我的膝盖疼。":
        "native": "My knee hurts."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "他的膝盖很大。":
        "native": "His knees are big."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1074":
    "native": "back (of the body)"
    "notes":
      "n1": "The back of the body, from the neck to the waist. 背 (bèi) is also to carry on the back."
    "examples":
      "我的背很疼。":
        "native": "My back hurts."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "她的背很直。":
        "native": "Her back is very straight."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1075":
    "native": "stomach; belly"
    "notes":
      "n1": "The stomach, or the belly. Its opposite is the back, 背 (bèi)."
    "examples":
      "我肚子疼。": "My stomach hurts."
      "他的肚子很大。":
        "native": "His belly is big."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1076":
    "native": "heart (organ)"
    "notes":
      "n1": "The heart, the organ that pumps blood. 心 (xīn) is the heart, in feeling too."
    "examples":
      "心脏很重要。": "The heart is very important."
      "运动对心脏好。": "Exercise is good for the heart."
  "zh-1077":
    "native": "skin"
    "notes":
      "n1": "The skin that covers the body. 皮 (pí) is the skin or peel."
    "examples":
      "她的皮肤很白。":
        "native": "Her skin is very fair."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "冬天皮肤很干。":
        "native": "In winter the skin is very dry."
        "bases":
          "干":
            "meaning": "dry"
  "zh-1078":
    "native": "body"
    "notes":
      "n1": "The whole body. 身 (shēn) is the body or trunk, and 体 (tǐ) is the body."
    "examples":
      "身体很好。": "The body is well."
      "他身体不好。": "He is not well."
  "zh-1079":
    "native": "bone"
    "notes":
      "n1": "A bone, the hard part inside the body."
    "examples":
      "这个骨头很大。": "This bone is very big."
      "狗喜欢骨头。": "Dogs like bones."
  "zh-1080":
    "native": "blood"
    "notes":
      "n1": "Blood, the red liquid in the body. 血液 (xuèyè) is blood as a liquid."
    "examples":
      "他流了很多血。":
        "native": "He lost a lot of blood."
        "bases":
          "流":
            "meaning": "to flow; to run"
          "了":
            "meaning": "a particle: a change has happened"
      "血是红的。":
        "native": "Blood is red."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1081":
    "native": "painful; to hurt"
    "notes":
      "n1": "To hurt, to feel pain. 疼痛 (téngtòng) is the pain itself."
    "examples":
      "我很疼。": "I am in pain."
      "哪儿疼？":
        "native": "Where does it hurt?"
        "bases":
          "哪儿":
            "meaning": "where"
  "zh-1082":
    "native": "itchy"
    "notes":
      "n1": "Itchy, a feeling that makes you want to scratch."
    "examples":
      "我的手很痒。":
        "native": "My hand is itchy."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "蚊子咬了我，很痒。":
        "native": "A mosquito bit me, and it is itchy."
        "bases":
          "咬":
            "meaning": "to bite"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1083":
    "native": "to have a headache"
    "notes":
      "n1": "A headache, pain in the head. 头 (tóu) is the head, and 疼 (téng) is pain."
    "examples":
      "我头疼。": "I have a headache."
      "他今天头疼。": "He has a headache today."
  "zh-1084":
    "native": "glasses"
    "notes":
      "n1": "Glasses, worn in front of the eyes to help seeing. 镜 (jìng) is a mirror or a lens."
    "examples":
      "他戴眼镜。":
        "native": "He wears glasses."
        "bases":
          "戴":
            "meaning": "to wear (glasses, a hat)"
      "我的眼镜很贵。":
        "native": "My glasses are expensive."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1085":
    "native": "strength"
    "notes":
      "n1": "Physical strength. 力 (lì) is force, and 气 (qì) is breath or energy."
    "examples":
      "他很有力气。":
        "native": "He is very strong."
        "bases":
          "有":
            "meaning": "to have; there is"
      "我没有力气。":
        "native": "I have no strength."
        "bases":
          "没":
            "meaning": "not; did not"
          "有":
            "meaning": "to have; there is"
  "zh-1086":
    "native": "to exercise; to train"
    "notes":
      "n1": "To exercise the body to keep fit."
    "examples":
      "我每天锻炼。":
        "native": "I exercise every day."
        "bases":
          "每天":
            "meaning": "every day"
      "他在公园锻炼身体。": "He exercises his body in the park."
  "zh-1087":
    "native": "healthy"
    "notes":
      "n1": "Healthy, in good health. Its opposite is 生病 (shēngbìng), to be ill."
    "examples":
      "他很健康。": "He is very healthy."
      "多运动很健康。": "Plenty of exercise is healthy."
  "zh-1088":
    "native": "chest"
    "notes":
      "n1": "The chest, the front of the body between the neck and the stomach."
    "examples":
      "我的胸很疼。":
        "native": "My chest hurts."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "他的胸很宽。":
        "native": "His chest is broad."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "宽":
            "meaning": "wide; broad"
  "zh-1089":
    "native": "stomach (organ)"
    "notes":
      "n1": "The stomach, where food goes after the mouth. 肚子 (dùzi) is the belly outside."
    "examples":
      "我的胃不舒服。":
        "native": "My stomach is upset."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "吃饭以后胃好了。":
        "native": "After the meal my stomach felt better."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1090":
    "native": "sweat"
    "notes":
      "n1": "Sweat, the water that comes out of the skin when hot or after exercise."
    "examples":
      "我出了很多汗。":
        "native": "I sweated a lot."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "运动以后有汗。":
        "native": "There is sweat after exercise."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1091":
    "native": "to feel; a feeling"
    "notes":
      "n1": "To feel something, in the body or the mind. 觉得 (juéde) is to think or feel."
    "examples":
      "我感觉很累。": "I feel very tired."
      "他的感觉很好。":
        "native": "He has a good feeling about it."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1092":
    "native": "lungs"
    "notes":
      "n1": "The lungs, the organs for breathing, inside the chest."
    "examples":
      "抽烟对肺不好。":
        "native": "Smoking is bad for the lungs."
        "bases":
          "抽烟":
            "meaning": "to smoke"
      "我的肺很健康。":
        "native": "My lungs are healthy."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1093":
    "native": "fingernail"
    "notes":
      "n1": "A fingernail, the hard part at the end of the finger. 甲 (jiǎ) is a shell or a hard cover."
    "examples":
      "我的指甲很长。":
        "native": "My nails are long."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "剪指甲。":
        "native": "Cut your nails."
        "bases":
          "剪":
            "meaning": "to cut"
