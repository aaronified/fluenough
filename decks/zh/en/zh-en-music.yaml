"schema": 1
"id": "zh-en-music"
"kind": "layer"
"core": "zh-music"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Music"
"description": "Forty words for music: songs and singers, the instruments, the sound and the rhythm, concerts and bands, and the words for recording and singing together. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-2048":
    "native": "music"
    "notes":
      "n1": "Music, sounds arranged in a pleasing way. 音 (yīn) is sound, and 乐 (yuè) is music."
    "examples":
      "我喜欢听音乐。": "I like listening to music."
      "音乐很好听。": "The music sounds very nice."
  "zh-2049":
    "native": "song"
    "notes":
      "n1": "A song, a piece of music with words to be sung. 唱歌 (chànggē) is to sing."
    "examples":
      "这首歌很好听。":
        "native": "This song sounds very nice."
        "bases":
          "首":
            "meaning": "the measure word for a song or a poem"
      "她唱一首歌。":
        "native": "She sings a song."
        "bases":
          "首":
            "meaning": "the measure word for a song or a poem"
  "zh-2050":
    "native": "song (as a piece of music)"
    "notes":
      "n1": "A song, a piece of music with a tune and words. 曲 (qǔ) is a tune or a piece of music."
    "examples":
      "这首歌曲很有名。":
        "native": "This song is very famous."
        "bases":
          "首":
            "meaning": "the measure word for a song or a poem"
      "我会唱很多歌曲。":
        "native": "I can sing many songs."
        "bases":
          "会":
            "meaning": "can; to know how to"
  "zh-2051":
    "native": "lyrics"
    "notes":
      "n1": "The words of a song. 词 (cí) is a word or a set of words."
    "examples":
      "歌词很有意思。":
        "native": "The lyrics are very meaningful."
        "bases":
          "有":
            "meaning": "to have; there is"
          "意思":
            "meaning": "meaning; interest"
      "我记不住歌词。":
        "native": "I cannot remember the lyrics."
        "bases":
          "记":
            "meaning": "to remember"
  "zh-2052":
    "native": "singer"
    "notes":
      "n1": "A singer, a person who sings as a job. 手 (shǒu) is a person who does a thing."
    "examples":
      "她是歌手。": "She is a singer."
      "这位歌手很有名。": "This singer is very famous."
  "zh-2053":
    "native": "to sing"
    "notes":
      "n1": "To sing a song. 唱歌 (chànggē) is to sing."
    "examples":
      "他唱得很好。":
        "native": "He sings very well."
        "bases":
          "得":
            "meaning": "a particle after a verb: how it is done"
      "我们一起唱。": "Let us sing together."
  "zh-2054":
    "native": "record; album"
    "notes":
      "n1": "A record or album of songs or music. 片 (piàn) is a flat thing."
    "examples":
      "这张唱片很好。": "This record is very good."
      "我买了一张唱片。":
        "native": "I bought an album."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2055":
    "native": "musical instrument"
    "notes":
      "n1": "A musical instrument, something played to make music. 器 (qì) is an instrument or tool."
    "examples":
      "这个乐器很贵。": "This instrument is expensive."
      "他会很多乐器。":
        "native": "He can play many instruments."
        "bases":
          "会":
            "meaning": "can; to know how to"
  "zh-2056":
    "native": "violin"
    "notes":
      "n1": "A violin, a small stringed instrument played with a bow. 琴 (qín) is a stringed instrument."
    "examples":
      "她拉小提琴。":
        "native": "She plays the violin."
        "bases":
          "拉":
            "meaning": "to pull; to play (a bowed instrument)"
      "小提琴很好听。": "The violin sounds very nice."
  "zh-2057":
    "native": "stringed instrument; zither"
    "notes":
      "n1": "A stringed instrument, played by plucking or striking. 钢琴 (gāngqín) is a piano, and 古琴 (gǔqín) is an ancient zither."
    "examples":
      "这把琴很好听。":
        "native": "This instrument sounds very nice."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
      "他的琴很好。":
        "native": "His instrument is very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2058":
    "native": "flute"
    "notes":
      "n1": "A bamboo flute, played by blowing across a hole. 子 (zi) makes it a noun."
    "examples":
      "他吹笛子。":
        "native": "He plays the flute."
        "bases":
          "吹":
            "meaning": "to blow; to play (a wind instrument)"
      "笛子的声音很好听。":
        "native": "The sound of the flute is very nice."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2059":
    "native": "erhu (a two-string fiddle)"
    "notes":
      "n1": "The erhu, a Chinese fiddle with two strings. 二 (èr) is two, and 胡 (hú) is a fiddle."
    "examples":
      "他拉二胡。":
        "native": "He plays the erhu."
        "bases":
          "拉":
            "meaning": "to pull; to play (a bowed instrument)"
      "二胡的声音很特别。":
        "native": "The sound of the erhu is very special."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "特别":
            "meaning": "especially"
  "zh-2060":
    "native": "guzheng (a plucked zither)"
    "notes":
      "n1": "The guzheng, a Chinese zither with many strings. 古 (gǔ) is ancient, and 筝 (zhēng) is a zither."
    "examples":
      "她弹古筝。":
        "native": "She plays the guzheng."
        "bases":
          "弹":
            "meaning": "to play (a plucked instrument)"
      "古筝很好听。": "The guzheng sounds very nice."
  "zh-2061":
    "native": "rhythm; beat"
    "notes":
      "n1": "The rhythm of a piece of music, the regular beat. 节 (jié) is a section."
    "examples":
      "这首歌的节奏很快。":
        "native": "The rhythm of this song is very fast."
        "bases":
          "首":
            "meaning": "the measure word for a song or a poem"
          "的":
            "meaning": "a particle: of; belonging to"
      "节奏很好。": "The rhythm is very good."
  "zh-2062":
    "native": "melody; tune"
    "notes":
      "n1": "The tune of a song, the line of notes that you can hum. 旋 (xuán) is to turn."
    "examples":
      "这个旋律很美。":
        "native": "This melody is very beautiful."
        "bases":
          "美":
            "meaning": "beautiful"
      "我记得这段旋律。":
        "native": "I remember this melody."
        "bases":
          "记得":
            "meaning": "to remember"
          "段":
            "meaning": "the measure word for a section"
  "zh-2063":
    "native": "pitch; tone"
    "notes":
      "n1": "The pitch of a sound, how high or low it is. 音 (yīn) is sound, and 调 (diào) is tune."
    "examples":
      "这个音调很高。": "This pitch is very high."
      "他的音调很低。":
        "native": "His voice is very low."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "低":
            "meaning": "low"
  "zh-2064":
    "native": "volume"
    "notes":
      "n1": "How loud a sound is. 量 (liàng) is amount or size."
    "examples":
      "请开小音量。": "Please turn the volume down."
      "音量太大了。":
        "native": "The volume is too loud."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2065":
    "native": "sound; voice"
    "notes":
      "n1": "A sound, or a voice. 声 (shēng) is sound, and 音 (yīn) is a note or sound."
    "examples":
      "声音很大。": "The sound is very loud."
      "她的声音很好听。":
        "native": "Her voice is very nice."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2066":
    "native": "pleasant to hear"
    "notes":
      "n1": "Nice to listen to, pleasant to the ear. 听 (tīng) is to listen."
    "examples":
      "这首歌很好听。":
        "native": "This song is very pleasant to hear."
        "bases":
          "首":
            "meaning": "the measure word for a song or a poem"
      "他的声音好听。":
        "native": "His voice is nice to listen to."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2067":
    "native": "unpleasant to hear"
    "notes":
      "n1": "Unpleasant to listen to, harsh to the ear. 难 (nán) is hard, and 听 (tīng) is to listen."
    "examples":
      "这个声音很难听。": "This sound is very unpleasant."
      "他唱得很难听。":
        "native": "He sings very badly."
        "bases":
          "得":
            "meaning": "a particle after a verb: how it is done"
  "zh-2068":
    "native": "concert (of singers)"
    "notes":
      "n1": "A concert, where singers perform songs. 演 (yǎn) is to perform, and 唱 (chàng) is to sing."
    "examples":
      "我去看演唱会。": "I am going to a concert."
      "演唱会很精彩。":
        "native": "The concert is exciting."
        "bases":
          "精彩":
            "meaning": "exciting"
  "zh-2069":
    "native": "concert (of music)"
    "notes":
      "n1": "A concert of music, played by an orchestra or musicians. 会 (huì) is a meeting or event."
    "examples":
      "音乐会在晚上七点。": "The concert is at seven in the evening."
      "我们去听音乐会。": "We go to hear a concert."
  "zh-2070":
    "native": "band; orchestra"
    "notes":
      "n1": "A band or an orchestra, a group of musicians. 队 (duì) is a team."
    "examples":
      "他在乐队里弹吉他。":
        "native": "He plays the guitar in a band."
        "bases":
          "弹":
            "meaning": "to play (a plucked instrument)"
      "乐队很有名。": "The band is very famous."
  "zh-2071":
    "native": "fan (of singers)"
    "notes":
      "n1": "A fan of a singer or of songs. 迷 (mí) is a fan or a passion."
    "examples":
      "她是我的歌迷。":
        "native": "She is my fan."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "歌迷很多。": "There are a lot of fans."
  "zh-2072":
    "native": "to record sound"
    "notes":
      "n1": "To record sound onto a tape, a disc or a file. 录 (lù) is to record, and 音 (yīn) is sound."
    "examples":
      "我在录音。": "I am recording."
      "录音很清楚。":
        "native": "The recording is very clear."
        "bases":
          "清楚":
            "meaning": "clear"
  "zh-2073":
    "native": "microphone"
    "notes":
      "n1": "A microphone, for amplifying the voice. The word is a sound loan."
    "examples":
      "请用麦克风。":
        "native": "Please use the microphone."
        "bases":
          "用":
            "meaning": "to use"
      "麦克风坏了。":
        "native": "The microphone is broken."
        "bases":
          "坏":
            "meaning": "broken"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2074":
    "native": "to request a song"
    "notes":
      "n1": "To ask for a song to be played or sung. 点 (diǎn) is to choose, and 歌 (gē) is a song."
    "examples":
      "我要点歌。":
        "native": "I want to request a song."
        "bases":
          "要":
            "meaning": "must; to want"
      "请点歌吧。": "Please request a song."
  "zh-2075":
    "native": "original singer (of a song)"
    "notes":
      "n1": "The first singer of a song, the one who recorded it first. 原 (yuán) is original."
    "examples":
      "这首歌的原唱是她。":
        "native": "The original singer of this song is her."
        "bases":
          "首":
            "meaning": "the measure word for a song or a poem"
          "的":
            "meaning": "a particle: of; belonging to"
      "原唱的声音很好。":
        "native": "The original singer's voice is very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2076":
    "native": "accompaniment"
    "notes":
      "n1": "The music that goes with a singer, played behind the voice. 伴 (bàn) is to accompany."
    "examples":
      "我唱歌用伴奏。":
        "native": "I sing with the accompaniment."
        "bases":
          "用":
            "meaning": "to use"
      "伴奏很好听。": "The accompaniment sounds nice."
  "zh-2077":
    "native": "to sing in a chorus"
    "notes":
      "n1": "To sing together, in a group. 合 (hé) is together, and 唱 (chàng) is to sing."
    "examples":
      "我们合唱。": "We sing together."
      "合唱团很大。":
        "native": "The choir is very big."
        "bases":
          "团":
            "meaning": "group"
  "zh-2078":
    "native": "to sing alone (solo)"
    "notes":
      "n1": "To sing alone, without others. 独 (dú) is alone."
    "examples":
      "她独唱了一首歌。":
        "native": "She sang a solo song."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "首":
            "meaning": "the measure word for a song or a poem"
      "独唱很难。": "Singing alone is hard."
  "zh-2079":
    "native": "to compose music"
    "notes":
      "n1": "To write a piece of music. 作 (zuò) is to make, and 曲 (qǔ) is a tune."
    "examples":
      "他会作曲。":
        "native": "He can compose music."
        "bases":
          "会":
            "meaning": "can; to know how to"
      "她在作曲。": "She is composing music."
  "zh-2080":
    "native": "to write lyrics"
    "notes":
      "n1": "To write the words of a song. 词 (cí) is words."
    "examples":
      "他作词。": "He writes lyrics."
      "作词和作曲都难。":
        "native": "Writing lyrics and composing are both hard."
        "bases":
          "和":
            "meaning": "and"
  "zh-2081":
    "native": "to conduct (an orchestra)"
    "notes":
      "n1": "To lead an orchestra or choir with the hands. 指 (zhǐ) is to point, and 挥 (huī) is to wave."
    "examples":
      "他指挥乐队。": "He conducts the orchestra."
      "指挥的手很快。":
        "native": "The conductor's hands move quickly."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2082":
    "native": "music score"
    "notes":
      "n1": "The written music, the notes on paper. 谱 (pǔ) is a score or list."
    "examples":
      "请看乐谱。": "Please look at the score."
      "乐谱上有很多音符。":
        "native": "The score has many notes."
        "bases":
          "有":
            "meaning": "to have; there is"
          "音符":
            "meaning": "musical note"
  "zh-2083":
    "native": "tune; key"
    "notes":
      "n1": "A tune or key in music. 音调 (yīndiào) is the pitch."
    "examples":
      "这个调很好听。": "This tune is very nice."
      "他唱的调很高。":
        "native": "The tune he sings is very high."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2084":
    "native": "beat; time signature"
    "notes":
      "n1": "The beat of a piece of music, counted in regular groups. 拍 (pāi) is to beat, and 子 (zi) makes it a noun."
    "examples":
      "这首歌的拍子很快。":
        "native": "The beat of this song is fast."
        "bases":
          "首":
            "meaning": "the measure word for a song or a poem"
          "的":
            "meaning": "a particle: of; belonging to"
      "跟着拍子唱。":
        "native": "Sing along with the beat."
        "bases":
          "跟":
            "meaning": "to follow"
          "着":
            "meaning": "a particle: an action goes on"
  "zh-2085":
    "native": "to listen to songs"
    "notes":
      "n1": "To listen to music or songs. 听 (tīng) is to listen."
    "examples":
      "我每天听歌。":
        "native": "I listen to songs every day."
        "bases":
          "每天":
            "meaning": "every day"
      "他在听歌。": "He is listening to songs."
  "zh-2086":
    "native": "to sing along"
    "notes":
      "n1": "To sing along with a song or a singer. 跟 (gēn) is to follow."
    "examples":
      "大家一起跟唱。": "Everyone sings along together."
      "请跟唱这首歌。":
        "native": "Please sing along with this song."
        "bases":
          "首":
            "meaning": "the measure word for a song or a poem"
  "zh-2087":
    "native": "treble; high note"
    "notes":
      "n1": "A high note or a high voice part. 高 (gāo) is high, and 音 (yīn) is a note."
    "examples":
      "她的高音很好。":
        "native": "Her high notes are very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "这首歌有很高的高音。":
        "native": "This song has very high notes."
        "bases":
          "首":
            "meaning": "the measure word for a song or a poem"
          "有":
            "meaning": "to have; there is"
          "的":
            "meaning": "a particle: of; belonging to"
