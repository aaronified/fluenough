"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0413":
    "native": "How many shall we buy?"
    "confusables":
      "w1":
        "why": "少 (shǎo) would say few, not how many."
      "w2":
        "why": "半 (bàn) would say half, which is not a count."
  "zh-0414":
    "native": "This number is very large."
    "confusables":
      "w1":
        "why": "数量 (shùliàng) is an amount of things, not a figure written down."
      "w2":
        "why": "许多 (xǔduō) is many, which says nothing about a figure."
  "zh-0415":
    "native": "Each of us drinks tea."
    "confusables":
      "w1":
        "why": "所有 (suǒyǒu) would say all, as one group, not each one."
      "w2":
        "why": "一共 (yígòng) would say in all, as a total."
  "zh-0416":
    "native": "How much are these shoes?"
    "confusables":
      "w1":
        "why": "个 (gè) is the usual measure, but shoes come in 双 (shuāng) pairs."
      "w2":
        "why": "件 (jiàn) is for clothes and single things, not a pair of shoes."
  "zh-0417":
    "native": "They buy about ten."
    "confusables":
      "w1":
        "why": "差不多 (chàbuduō) means almost the same, not a number about."
      "w2":
        "why": "许多 (xǔduō) is many, not about ten."
  "zh-0418":
    "native": "There are few books and a lot of paper."
    "confusables":
      "w1":
        "why": "够 (gòu) would say enough, not how many."
      "w2":
        "why": "半 (bàn) would say half, not a lot."
  "zh-0419":
    "native": "I want to drink half a glass of water."
    "confusables":
      "w1":
        "why": "一些 (yìxiē) is some, with no half."
      "w2":
        "why": "个 (gè) is the wrong measure for a drink; 杯 (bēi) is the word for a cup."
  "zh-0420":
    "native": "Is this piece of clothing big enough?"
    "confusables":
      "w1":
        "why": "太 (tài) would say too big, as a complaint."
      "w2":
        "why": "很 (hěn) would say very big, not big enough."
  "zh-0421":
    "native": "How many of you are coming?"
    "confusables":
      "w1":
        "why": "个 (gè) is the casual measure for people; 位 (wèi) is the polite one."
      "w2":
        "why": "所有 (suǒyǒu) would say all, not how many."
