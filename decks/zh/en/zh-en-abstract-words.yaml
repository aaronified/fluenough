"cards":
  "zh-4387":
    "native": "idea; way of thinking; concept"
    "notes":
      "n1": "观念 (guānniàn) is a belief or way of thinking about something, held by a person or a society. 观点 (guāndiǎn) is a view on one issue, which is a narrower thing."
    "examples":
      "现在的年轻人观念很开放。":
        "native": "Young people today have very open ways of thinking."
        "bases":
          "的":
            "meaning": "particle"
          "年轻人":
            "meaning": "young people"
      "这种观念已经过时了。":
        "native": "This way of thinking is already out of date."
        "bases":
          "这种":
            "meaning": "this kind of"
          "过时":
            "meaning": "out of date"
          "了":
            "meaning": "particle"
  "zh-4388":
    "native": "morality; moral standards"
    "notes":
      "n1": "道德 (dàodé) means the shared sense of right and wrong. 法律 (fǎlǜ) is written law; 道德 (dàodé) is what people judge to be good behaviour, even when no law applies."
    "examples":
      "诚实是一种基本的道德。":
        "native": "Honesty is a basic moral principle."
        "bases":
          "一种":
            "meaning": "a kind of"
          "基本":
            "meaning": "basic"
          "的":
            "meaning": "particle"
      "他的行为不符合道德。":
        "native": "His behaviour does not match moral standards."
        "bases":
          "的":
            "meaning": "of"
          "行为":
            "meaning": "behaviour"
          "符合":
            "meaning": "to match"
  "zh-4389":
    "native": "fair; just"
    "notes":
      "n1": "公平 (gōngpíng) means treating people in the same way when the case is the same. 公正 (gōngzhèng) is the wider word for justice, and 平等 (píngděng) is equal status."
    "examples":
      "老师对每个学生都很公平。":
        "native": "The teacher is very fair to every student."
        "bases":
          "每个":
            "meaning": "every"
      "这个规则对大家不公平。":
        "native": "This rule is not fair to everyone."
        "bases":
          "这个":
            "meaning": "this"
          "规则":
            "meaning": "rule"
  "zh-4390":
    "native": "justice; righteousness"
    "notes":
      "n1": "正义 (zhèngyì) is what is right and just, the idea that wrongs should be put right. 公平 (gōngpíng) is more about fair treatment in a single case."
    "examples":
      "他为了正义站出来说话。":
        "native": "He stood up and spoke for justice."
        "bases":
          "为了":
            "meaning": "for the sake of"
          "站出来":
            "meaning": "to stand up"
          "说话":
            "meaning": "to speak"
      "正义最终会得到伸张。":
        "native": "Justice will be upheld in the end."
        "bases":
          "最终":
            "meaning": "in the end"
          "会":
            "meaning": "will"
          "得到":
            "meaning": "to get"
          "伸张":
            "meaning": "to be upheld"
  "zh-4391":
    "native": "courage"
    "notes":
      "n1": "勇气 (yǒngqì) is the strength to face fear or danger. 勇敢 (yǒnggǎn) is the adjective, brave. You can say 有勇气 (yǒu yǒngqì), to have courage."
    "examples":
      "她有勇气承认自己的错误。":
        "native": "She has the courage to admit her own mistake."
        "bases":
          "有":
            "meaning": "to have"
          "的":
            "meaning": "of"
      "需要勇气才能说出真话。":
        "native": "It takes courage to tell the truth."
        "bases":
          "才能":
            "meaning": "only then can"
          "说出":
            "meaning": "to say"
          "真话":
            "meaning": "the truth"
  "zh-4392":
    "native": "belief; conviction"
    "notes":
      "n1": "信念 (xìnniàn) is a firm belief that guides what a person does. 信仰 (xìnyǎng) is a religious or deep faith, and is a different word."
    "examples":
      "他的信念从来没有动摇过。":
        "native": "His conviction has never wavered."
        "bases":
          "的":
            "meaning": "of"
          "没有":
            "meaning": "not"
          "动摇":
            "meaning": "to waver"
      "我们要坚守自己的信念。":
        "native": "We must hold firmly to our beliefs."
        "bases":
          "要":
            "meaning": "must"
          "坚守":
            "meaning": "to hold firm to"
          "的":
            "meaning": "of"
  "zh-4393":
    "native": "virtue; good moral quality"
    "notes":
      "n1": "美德 (měidé) is a good quality of character, such as honesty, kindness or patience. 道德 (dàodé) is the general system of moral standards; 美德 (měidé) is one good part of it."
    "examples":
      "谦虚是一种美德。":
        "native": "Modesty is a virtue."
        "bases":
          "一种":
            "meaning": "a kind of"
      "她身上有很多美德。":
        "native": "She has many virtues."
        "bases":
          "身上":
            "meaning": "on her"
          "有":
            "meaning": "to have"
          "很多":
            "meaning": "many"
  "zh-4394":
    "native": "conscience"
    "notes":
      "n1": "良心 (liángxīn) is the inner sense of what is right, which tells a person when they have done wrong. 良好 (liánghǎo) is a different word meaning good, as in a good result."
    "examples":
      "他的良心不允许他撒谎。":
        "native": "His conscience does not let him tell a lie."
        "bases":
          "的":
            "meaning": "of"
          "撒谎":
            "meaning": "to lie"
      "做了错事以后，他的良心一直不安。":
        "native": "After he did something wrong, his conscience was uneasy all the time."
        "bases":
          "了":
            "meaning": "particle"
          "错事":
            "meaning": "wrong deed"
          "的":
            "meaning": "of"
          "不安":
            "meaning": "uneasy"
  "zh-4395":
    "native": "dignity; self-respect"
    "notes":
      "n1": "尊严 (zūnyán) is the sense that a person deserves respect and should be treated with honour. 尊重 (zūnzhòng) is the act of showing respect to someone."
    "examples":
      "每个人都有做人的尊严。":
        "native": "Everyone has the dignity of being a person."
        "bases":
          "每个":
            "meaning": "every"
          "有":
            "meaning": "to have"
          "做人":
            "meaning": "to be a person"
          "的":
            "meaning": "of"
      "他在别人面前失去了尊严。":
        "native": "He lost his dignity in front of others."
        "bases":
          "面前":
            "meaning": "presence"
          "失去":
            "meaning": "to lose"
          "了":
            "meaning": "particle"
  "zh-4396":
    "native": "honour; glory"
    "notes":
      "n1": "荣誉 (róngyù) is respect that comes from a good deed or a great achievement. 名誉 (míngyù) is a reputation, which can be good or bad."
    "examples":
      "他为学校赢得了荣誉。":
        "native": "He won honour for the school."
        "bases":
          "为":
            "meaning": "for"
          "赢得":
            "meaning": "to win"
          "了":
            "meaning": "particle"
      "把荣誉看得比生命还重要，这样不好。":
        "native": "To value honour more than life is not a good thing."
        "bases":
          "把":
            "meaning": "(object marker)"
          "看得":
            "meaning": "to regard"
          "比":
            "meaning": "than"
          "生命":
            "meaning": "life"
          "这样":
            "meaning": "like this"
  "zh-4397":
    "native": "theory"
    "notes":
      "n1": "理论 (lǐlùn) is a set of ideas that explain how something works. 理想 (lǐxiǎng) is a hope or goal for the future, which is a different word."
    "examples":
      "这个理论很有道理。":
        "native": "This theory makes a lot of sense."
        "bases":
          "这个":
            "meaning": "this"
      "理论要和实践结合起来。":
        "native": "Theory must be combined with practice."
        "bases":
          "要":
            "meaning": "must"
          "和":
            "meaning": "with"
          "实践":
            "meaning": "practice"
          "结合":
            "meaning": "to combine"
          "起来":
            "meaning": "particle"
  "zh-4398":
    "native": "concept"
    "notes":
      "n1": "概念 (gàiniàn) is an idea that names one kind of thing and its key features. 观念 (guānniàn) is a broader way of thinking, not a precise definition."
    "examples":
      "这个概念很难理解。":
        "native": "This concept is hard to understand."
        "bases":
          "这个":
            "meaning": "this"
      "他把两个概念混在一起了。":
        "native": "He mixed up the two concepts."
        "bases":
          "把":
            "meaning": "(object marker)"
          "两个":
            "meaning": "two"
          "混":
            "meaning": "to mix"
          "了":
            "meaning": "particle"
  "zh-4399":
    "native": "logic"
    "notes":
      "n1": "逻辑 (luójí) is the rule of sound reasoning, where each step follows from the one before. 推理 (tuīlǐ) is the act of reasoning to a conclusion."
    "examples":
      "这篇文章的逻辑很清楚。":
        "native": "The logic of this article is very clear."
        "bases":
          "这篇":
            "meaning": "this (article)"
          "文章":
            "meaning": "article"
          "的":
            "meaning": "of"
      "他的话没有逻辑。":
        "native": "His words have no logic."
        "bases":
          "的":
            "meaning": "of"
          "话":
            "meaning": "words"
          "没有":
            "meaning": "not have"
  "zh-4400":
    "native": "essence; nature"
    "notes":
      "n1": "本质 (běnzhì) is the basic nature of a thing, what it is at its core. 现象 (xiànxiàng) is how a thing looks on the surface."
    "examples":
      "我们要看清问题的本质。":
        "native": "We must see the true nature of the problem."
        "bases":
          "要":
            "meaning": "must"
          "看清":
            "meaning": "to see clearly"
          "的":
            "meaning": "of"
      "这两件事的本质不同。":
        "native": "The essence of these two things is different."
        "bases":
          "两件":
            "meaning": "two"
          "事":
            "meaning": "thing"
          "的":
            "meaning": "of"
          "不同":
            "meaning": "different"
  "zh-4401":
    "native": "meaning; significance"
    "notes":
      "n1": "意义 (yìyì) is the importance or meaning of something. 含义 (hányì) is what a word or sign means. 意义 (yìyì) is about why something matters."
    "examples":
      "这次旅行对我很有意义。":
        "native": "This trip was very meaningful to me."
        "bases":
          "这次":
            "meaning": "this time"
          "有意义":
            "meaning": "meaningful"
      "他觉得工作没有意义。":
        "native": "He feels that his work has no meaning."
        "bases":
          "没有":
            "meaning": "not have"
  "zh-4402":
    "native": "motive; reason for acting"
    "notes":
      "n1": "动机 (dòngjī) is the reason that makes a person do something. 目的 (mùdì) is the goal they aim for. A motive is the reason behind the act."
    "examples":
      "他的动机很好，但是方法不对。":
        "native": "His motive is good, but his method is wrong."
        "bases":
          "的":
            "meaning": "of"
          "但是":
            "meaning": "but"
          "不对":
            "meaning": "not right"
      "我们不知道他的真正动机。":
        "native": "We do not know his real motive."
        "bases":
          "的":
            "meaning": "of"
          "真正":
            "meaning": "real"
  "zh-4403":
    "native": "wisdom"
    "notes":
      "n1": "智慧 (zhìhuì) is deep understanding that comes from knowledge and experience, used in how one lives. 聪明 (cōngmíng) is being quick to learn, which is a different thing."
    "examples":
      "老人的话里有很多智慧。":
        "native": "There is much wisdom in what the old man says."
        "bases":
          "老人":
            "meaning": "elderly person"
          "的":
            "meaning": "of"
          "话":
            "meaning": "words"
          "有":
            "meaning": "to have"
          "很多":
            "meaning": "many"
      "他用智慧解决了这个问题。":
        "native": "He solved this problem with wisdom."
        "bases":
          "用":
            "meaning": "to use"
          "了":
            "meaning": "particle"
          "这个":
            "meaning": "this"
  "zh-4404":
    "native": "curiosity"
    "notes":
      "n1": "好奇心 (hàoqíxīn) is the wish to know and to find out about things. 怀疑 (huáiyí) is doubt about whether something is true."
    "examples":
      "孩子的好奇心很强。":
        "native": "The child's curiosity is very strong."
        "bases":
          "的":
            "meaning": "of"
          "强":
            "meaning": "strong"
      "好奇心能带我们去发现新东西。":
        "native": "Curiosity can lead us to discover new things."
        "bases":
          "能":
            "meaning": "can"
  "zh-4405":
    "native": "pressure; stress"
    "notes":
      "n1": "压力 (yālì) is the strain a person feels from demands, work or worry, and also physical pressure on a thing. 紧张 (jǐnzhāng) is the state of being nervous."
    "examples":
      "工作的压力越来越大。":
        "native": "The pressure of work keeps growing."
        "bases":
          "的":
            "meaning": "of"
          "越来越":
            "meaning": "more and more"
      "考试前，他感到很大的压力。":
        "native": "Before the exam he felt great pressure."
        "bases":
          "感到":
            "meaning": "to feel"
          "很大":
            "meaning": "great"
          "的":
            "meaning": "particle"
  "zh-4406":
    "native": "to satisfy; to be content"
    "notes":
      "n1": "满足 (mǎnzú) means to meet a need or a wish, or to be content with what one has. 满意 (mǎnyì) is a feeling of being pleased with something."
    "examples":
      "这个答案不能满足我的要求。":
        "native": "This answer does not meet my request."
        "bases":
          "这个":
            "meaning": "this"
          "不能":
            "meaning": "cannot"
          "的":
            "meaning": "of"
          "要求":
            "meaning": "request"
      "他对现在的生活很满足。":
        "native": "He is very content with his life now."
        "bases":
          "的":
            "meaning": "of"
          "生活":
            "meaning": "life"
  "zh-4407":
    "native": "guilty; remorseful"
    "notes":
      "n1": "愧疚 (kuìjiù) means feeling guilty and ashamed about having done wrong. 后悔 (hòuhuǐ) is regret about a choice, which can be lighter."
    "examples":
      "他对朋友感到很愧疚。":
        "native": "He feels very guilty towards his friend."
        "bases":
          "感到":
            "meaning": "to feel"
      "说了伤人的话，她心里很愧疚。":
        "native": "She said hurtful things, and inside she feels very guilty."
        "bases":
          "了":
            "meaning": "particle"
          "伤人":
            "meaning": "hurtful"
          "的":
            "meaning": "particle"
          "话":
            "meaning": "words"
          "心里":
            "meaning": "inside"
  "zh-4408":
    "native": "self-control; moderation"
    "notes":
      "n1": "节制 (jiézhì) is the ability to hold back from too much, such as food, drink or spending. 克制 (kèzhì) is the act of controlling one's feelings in the moment."
    "examples":
      "吃东西要有节制。":
        "native": "Eat with moderation."
        "bases":
          "要":
            "meaning": "should"
          "有":
            "meaning": "to have"
      "他缺乏节制，花钱太多。":
        "native": "He lacks self-control and spends too much money."
        "bases":
          "缺乏":
            "meaning": "to lack"
          "花钱":
            "meaning": "to spend money"
          "太多":
            "meaning": "too much"
  "zh-4409":
    "native": "society"
    "notes":
      "n1": "社会 (shèhuì) is the whole group of people living together under shared rules. 社区 (shèqū) is a smaller local community, a neighbourhood."
    "examples":
      "每个人都是社会的一部分。":
        "native": "Every person is a part of society."
        "bases":
          "每个":
            "meaning": "every"
          "的":
            "meaning": "of"
          "一部分":
            "meaning": "part"
      "这个社会需要更多的理解。":
        "native": "This society needs more understanding."
        "bases":
          "这个":
            "meaning": "this"
          "更多":
            "meaning": "more"
          "的":
            "meaning": "of"
  "zh-4410":
    "native": "future"
    "notes":
      "n1": "未来 (wèilái) is the time that is yet to come. 将来 (jiānglái) means the same, but is more often used in everyday speech for a time ahead."
    "examples":
      "我们要为未来做准备。":
        "native": "We must prepare for the future."
        "bases":
          "要":
            "meaning": "must"
          "为":
            "meaning": "for"
      "谁也不知道未来会怎样。":
        "native": "Nobody knows how the future will be."
        "bases":
          "会":
            "meaning": "will"
  "zh-4411":
    "native": "truth"
    "notes":
      "n1": "真理 (zhēnlǐ) is a truth that is general and proved, and holds in every case. 真相 (zhēnxiàng) is the facts of one event, what really happened."
    "examples":
      "科学的目的是寻找真理。":
        "native": "The aim of science is to search for truth."
        "bases":
          "的":
            "meaning": "of"
          "寻找":
            "meaning": "to search for"
      "历史上有很多真理被人们证明了。":
        "native": "Many truths in history have been proved by people."
        "bases":
          "有":
            "meaning": "to have"
          "很多":
            "meaning": "many"
          "被":
            "meaning": "passive"
          "人们":
            "meaning": "people"
          "了":
            "meaning": "particle"
  "zh-4412":
    "native": "idea; opinion"
    "notes":
      "n1": "想法 (xiǎngfǎ) is a thought or an idea a person has, which may be a plan or a view. 方法 (fāngfǎ) is a way of doing something; the two words are different."
    "examples":
      "你有什么好想法吗？":
        "native": "Do you have any good ideas?"
        "bases":
          "有":
            "meaning": "to have"
      "我们的想法不一样。":
        "native": "Our ideas are not the same."
        "bases":
          "的":
            "meaning": "of"
          "一样":
            "meaning": "the same"
  "zh-4413":
    "native": "method; way"
    "notes":
      "n1": "方法 (fāngfǎ) is a way of doing a task, step by step. 想法 (xiǎngfǎ) is an idea in the mind, not a way of working."
    "examples":
      "这个方法很简单，但很有效。":
        "native": "This method is simple, but very effective."
        "bases":
          "这个":
            "meaning": "this"
          "但":
            "meaning": "but"
          "有效":
            "meaning": "effective"
      "我们要换一种学习方法。":
        "native": "We must change the way we study."
        "bases":
          "要":
            "meaning": "must"
          "一种":
            "meaning": "a kind of"
  "zh-4414":
    "native": "order"
    "notes":
      "n1": "秩序 (zhìxù) is the orderly state in which things happen in the right way and place. 混乱 (hùnluàn) is the state of confusion, when order is lost."
    "examples":
      "大家排队买票，秩序很好。":
        "native": "Everyone queued to buy tickets, and the order was very good."
        "bases":
          "买票":
            "meaning": "to buy tickets"
      "地震以后，城市的秩序很快恢复了。":
        "native": "After the earthquake, order in the city was restored quickly."
        "bases":
          "的":
            "meaning": "of"
          "很快":
            "meaning": "quickly"
          "恢复":
            "meaning": "to recover"
          "了":
            "meaning": "particle"
  "zh-4415":
    "native": "diligent; hardworking"
    "notes":
      "n1": "勤奋 (qínfèn) describes someone who works hard and steadily. 努力 (nǔlì) is the more general word for making an effort."
    "examples":
      "他是一个非常勤奋的学生。":
        "native": "He is a very diligent student."
        "bases":
          "一个":
            "meaning": "a"
          "的":
            "meaning": "particle"
      "勤奋的人总会有收获。":
        "native": "Diligent people always gain something."
        "bases":
          "的":
            "meaning": "particle"
          "总会":
            "meaning": "always will"
          "有":
            "meaning": "to have"
  "zh-4416":
    "native": "lazy"
    "notes":
      "n1": "懒惰 (lǎnduò) describes a person who does not want to work or try. 懒 (lǎn) alone is a shorter word meaning lazy, used in everyday speech."
    "examples":
      "懒惰会让人失去很多机会。":
        "native": "Laziness makes people lose many chances."
        "bases":
          "会":
            "meaning": "will"
          "让":
            "meaning": "to make"
          "失去":
            "meaning": "to lose"
          "很多":
            "meaning": "many"
          "机会":
            "meaning": "opportunity"
      "他不是笨，只是太懒惰。":
        "native": "He is not stupid, he is only too lazy."
        "bases":
          "不是":
            "meaning": "is not"
          "只是":
            "meaning": "only"
  "zh-4417":
    "native": "the truth of what happened"
    "notes":
      "n1": "真相 (zhēnxiàng) is what really happened, the facts behind an event. 真理 (zhēnlǐ) is a general truth that holds in many cases."
    "examples":
