"name": "Quantities"
"description": "Twenty-five words for how much and how many: the measure words for cups, bottles, pairs, pieces, books and people, and words for some, each, about and enough. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0388":
    "native": "measure word for most things and people"
    "notes":
      "n1": "The measure word for most things and people, between a number and its noun: 三个人 (sān ge rén), three people. 这个 (zhège), this, and 那个 (nàge), that, are built on it."
    "examples":
      "我们一共十个人。": "There are ten of us in all."
      "你吃几个？": "How many will you eat?"
  "zh-0389":
    "native": "some; a few"
    "notes":
      "n1": "Some or a few, with no exact count. It takes no measure word: 一些鱼 (yìxiē yú), some fish. 一些 (yìxiē) is one word, not 一 (yī) and 些 (xiē) apart."
    "examples":
      "我买一些鱼。": "I buy some fish."
      "你喝一些水吗？": "Are you drinking some water?"
  "zh-0390":
    "native": "few; little; less"
    "notes":
      "n1": "Few or little, the opposite of 多 (duō), many or much. It can come before a verb as well: 少喝 (shǎo hē), drink less."
    "examples":
      "鱼很少。": "There is very little fish."
      "你少喝水。": "Drink less water."
  "zh-0391":
    "native": "half"
    "notes":
      "n1": "Half, as a number. A measure word can follow it: 半杯 (bàn bēi), half a cup; 半个 (bàn ge), half of one."
    "examples":
      "我喝半杯水。": "I drink half a glass of water."
      "我吃半个。": "I eat half of one."
  "zh-0392":
    "native": "each; every"
    "notes":
      "n1": "Each or every, before a measure word and a noun: 每个人 (měi ge rén), every person; 每本书 (měi běn shū), every book."
    "examples":
      "每个人都来。": "Everyone comes."
      "每本书很好。": "Every book is good."
  "zh-0393":
    "native": "all; every"
    "notes":
      "n1": "All of a group, taken as a whole: 所有人 (suǒyǒu rén), everybody. It is more formal than 都 (dōu), all, which comes after the subject."
    "examples":
      "你们所有人都很好。": "All of you are well."
      "所有人都来。": "Everyone is coming."
  "zh-0394":
    "native": "about; around"
    "notes":
      "n1": "About or around, after a number: 十个左右 (shí ge zuǒyòu), about ten. Literally the left and the right, the two sides of a place."
    "examples":
      "他买十个左右。": "He buys about ten."
      "我们吃五个左右。": "We eat about five."
  "zh-0395":
    "native": "book"
    "notes":
      "n1": "A book. Its measure word is 本 (běn): 一本书 (yì běn shū), one book. 看书 (kàn shū) means to read books."
    "examples":
      "这本书很好。": "This book is good."
      "你看书吗？": "Do you read books?"
  "zh-0396":
    "native": "measure word for books"
    "notes":
      "n1": "The measure word for books and other bound things: 一本书 (yì běn shū), one book. Most other things take 个 (gè)."
    "examples":
      "我买一本书。": "I buy a book."
      "你看这本书吗？": "Are you reading this book?"
  "zh-0397":
    "native": "paper"
    "notes":
      "n1": "Paper. A sheet of it is 一张纸 (yì zhāng zhǐ), with 张 (zhāng), the measure word for flat things."
    "examples":
      "我买纸。": "I buy paper."
      "这是纸吗？": "Is this paper?"
  "zh-0398":
    "native": "tea"
    "notes":
      "n1": "Tea. A cup of it is 一杯茶 (yì bēi chá), with 杯 (bēi), the word for a cup."
    "examples":
      "我喝茶。": "I drink tea."
      "你喝茶吗？": "Do you drink tea?"
  "zh-0399":
    "native": "cup; glass; measure for a drink"
    "notes":
      "n1": "A cup or glass, and the measure word for a drink: 一杯水 (yì bēi shuǐ), a glass of water."
    "examples":
      "我喝一杯茶。": "I drink a cup of tea."
      "这杯水很好。": "This glass of water is good."
  "zh-0400":
    "native": "bottle"
    "notes":
      "n1": "A bottle, or the amount it holds: 一瓶水 (yì píng shuǐ), a bottle of water."
    "examples":
      "我买一瓶水。": "I buy a bottle of water."
      "这瓶水很大。": "This bottle of water is big."
  "zh-0401":
    "native": "pair; measure word for pairs"
    "notes":
      "n1": "A pair, the measure word for things that come in twos: 一双鞋 (yì shuāng xié), a pair of shoes."
    "examples":
      "我买一双鞋。": "I buy a pair of shoes."
      "这双鞋很大。": "These shoes are big."
  "zh-0402":
    "native": "shoes"
    "notes":
      "n1": "Shoes. Its measure word is 双 (shuāng), a pair: 一双鞋 (yì shuāng xié), one pair of shoes."
    "examples":
      "鞋很小。": "The shoes are small."
      "你买鞋吗？": "Do you buy shoes?"
  "zh-0403":
    "native": "measure word for items and clothes"
    "notes":
      "n1": "The measure word for single items, clothes and things: 一件衣服 (yí jiàn yīfu), a piece of clothing. 这件 (zhè jiàn), this one, is common in shops."
    "examples":
      "这件衣服很好。": "This piece of clothing is good."
      "我买一件衣服。": "I buy a piece of clothing."
  "zh-0404":
    "native": "clothes"
    "notes":
      "n1": "Clothes. Its measure word is 件 (jiàn): 一件衣服 (yí jiàn yīfu), a piece of clothing."
    "examples":
      "衣服很小。": "The clothes are small."
      "你买衣服吗？": "Do you buy clothes?"
  "zh-0405":
    "native": "polite measure word for people"
    "notes":
      "n1": "The polite measure word for people: 几位 (jǐ wèi), how many people, and 这位 (zhè wèi), this person. 个 (gè) is the casual one for people."
    "examples":
      "这位是王先生。": "This is Mr. Wang."
      "几位老师来？": "How many teachers are coming?"
  "zh-0406":
    "native": "money"
    "notes":
      "n1": "Money. The question 多少钱 (duōshao qián), how much is it?, is the one used in shops."
    "examples":
      "多少钱？": "How much is it?"
      "钱很少。": "There is little money."
  "zh-0407":
    "native": "enough"
    "notes":
      "n1": "Enough, as in 够吗 (gòu ma), is it enough? Its opposite is 不够 (bú gòu), not enough."
    "examples":
      "这够吗？": "Is this enough?"
      "水够吗？": "Is there enough water?"
  "zh-0408":
    "native": "rice"
    "notes":
      "n1": "Rice, uncooked or cooked. It is sold by weight, as in 公斤 (gōngjīn), kilogram."
    "examples":
      "我买米。": "I buy rice."
      "米很多。": "There is a lot of rice."
  "zh-0409":
    "native": "kilogram"
    "notes":
      "n1": "A kilogram, the weight measure for food and goods: 两公斤米 (liǎng gōngjīn mǐ), two kilograms of rice."
    "examples":
      "一公斤米多少钱？": "How much is one kilogram of rice?"
      "我买两公斤米。": "I buy two kilograms of rice."
  "zh-0410":
    "native": "quantity; amount"
    "notes":
      "n1": "Quantity, the amount of things there is: 数量很大 (shùliàng hěn dà), the quantity is large. It is not a figure, which is 数字 (shùzì)."
    "examples":
      "数量很大。": "The quantity is large."
      "数量少吗？": "Is the quantity small?"
  "zh-0411":
    "native": "number; figure"
    "notes":
      "n1": "A number as a figure, written down: 这个数字 (zhège shùzì), this number. For how many things there are, see 数量 (shùliàng)."
    "examples":
      "这个数字很大。": "This number is large."
      "你写数字吗？": "Do you write numbers?"
  "zh-0412":
    "native": "many; a lot of; much"
    "notes":
      "n1": "Many or much, a more formal word than 很多 (hěn duō), a lot of: 许多人 (xǔduō rén), many people."
    "examples":
      "许多人来。": "Many people come."
      "他吃许多鱼。": "He eats a lot of fish."
