"cards":
  "zh-2799":
    "confusables":
      "w1":
        "why": "首府 (shǒufǔ) is a provincial capital, not the national capital."
      "w2":
        "why": "城市 (chéngshì) is a city, a general word."
    "bases":
      "的":
        "meaning": "of"
      "北京":
        "meaning": "Beijing"
    "native": "The capital of China is Beijing."
  "zh-2800":
    "confusables":
      "w1":
        "why": "东部 (dōngbù) is the east, a different direction."
      "w2":
        "why": "西部 (xībù) is the west, a different direction."
    "native": "The north is very cold, and the south is very hot."
  "zh-2801":
    "confusables":
      "w1":
        "why": "州 (zhōu) is a state, a different level."
      "w2":
        "why": "镇 (zhèn) is a town, a smaller place."
    "bases":
      "有":
        "meaning": "to have"
    "native": "This province has many counties."
  "zh-2802":
    "confusables":
      "w1":
        "why": "海峡 (hǎixiá) is a strait, a narrow sea passage."
      "w2":
        "why": "半岛 (bàndǎo) is a peninsula, a piece of land."
    "native": "The port is on the coast."
  "zh-2803":
    "confusables":
      "w1":
        "why": "纬度 (wěidù) is latitude, not altitude."
      "w2":
        "why": "经度 (jīngdù) is longitude, a different line."
    "bases":
      "的":
        "meaning": "of"
    "native": "The altitude of this region is very high."
  "zh-2804":
    "confusables":
      "w1":
        "why": "冬天 (dōngtiān) is winter, the other season."
      "w2":
        "why": "台风 (táifēng) is a typhoon, a storm."
    "bases":
      "有":
        "meaning": "to have"
    "native": "There is a monsoon in summer, and it is very humid."
  "zh-2805":
    "confusables":
      "w1":
        "why": "村 (cūn) is a village, a small place."
      "w2":
        "why": "区 (qū) is a district, a part of a city."
    "bases":
      "条":
        "meaning": "measure word for long things"
      "通":
        "meaning": "to lead to; to connect"
      "向":
        "meaning": "towards"
    "native": "This street leads to the border."
  "zh-2806":
    "confusables":
      "w1":
        "why": "资源 (zīyuán) is a resource, a wider word."
      "w2":
        "why": "土壤 (tǔrǎng) is soil, which is different."
    "bases":
      "这里":
        "meaning": "here"
      "的":
        "meaning": "of"
      "和":
        "meaning": "and"
    "native": "There are many minerals and energy sources here."
