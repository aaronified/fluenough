"cards":
  "zh-1202":
    "confusables":
      "w1":
        "why": "卧室 (wòshì) is a bedroom, one room only."
      "w2":
        "why": "客厅 (kètīng) is a living room, one room only."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
      "有":
        "meaning": "to have; there is"
    "native": "Our flat has three rooms."
  "zh-1203":
    "confusables":
      "w1":
        "why": "扫地 (sǎodì) is to sweep, a different chore."
      "w2":
        "why": "打扫 (dǎsǎo) is to clean up, a general word."
    "native": "Mum is cooking in the kitchen, and Dad is washing the dishes."
  "zh-1204":
    "confusables":
      "w1":
        "why": "关灯 (guāndēng) is to turn off a light, a different act."
      "w2":
        "why": "窗帘 (chuānglián) is a curtain, which hangs at the window."
    "bases":
      "着":
        "meaning": "a particle: an action goes on"
    "native": "The window is open, and it is cool."
  "zh-1205":
    "confusables":
      "w1":
        "why": "电梯 (diàntī) is a lift, not the stairs."
      "w2":
        "why": "楼 (lóu) is a building or a floor."
    "bases":
      "窄":
        "meaning": "narrow"
    "native": "The stairs are very narrow."
  "zh-1206":
    "confusables":
      "w1":
        "why": "朋友 (péngyou) is a friend, not a neighbour."
      "w2":
        "why": "同事 (tóngshì) is a colleague at work."
    "bases":
      "友好":
        "meaning": "friendly"
    "native": "The neighbours are very friendly."
  "zh-1207":
    "confusables":
      "w1":
        "why": "洗衣机 (xǐyījī) is a washing machine, not a bin."
      "w2":
        "why": "冰箱 (bīngxiāng) is a fridge, not a bin."
    "bases":
      "把":
        "meaning": "a particle that puts the object before the verb"
    "native": "He puts the rubbish in the bin."
  "zh-1208":
    "confusables":
      "w1":
        "why": "房子 (fángzi) is a house, not the rent."
      "w2":
        "why": "钱 (qián) is money in general, not the rent."
    "bases":
      "块":
        "meaning": "the measure word for money; a yuan"
    "native": "The landlord says the rent is two thousand yuan."
  "zh-1209":
    "confusables":
      "w1":
        "why": "今天 (jīntiān) is today, not next month."
      "w2":
        "why": "年 (nián) is a year, too long a time."
    "native": "We move house next month."
