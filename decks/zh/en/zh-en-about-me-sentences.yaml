"core": "zh-about-me-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "About me in sentences"
"description": "Sentences about yourself and others: your surname, your age, your country, where you live, what you like and the school. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0281":
    "native": "My surname is Wang."
    "confusables":
      "w1":
        "why": "张 (Zhāng) would say the surname is Zhang, not Wang."
      "w2":
        "why": "李 (Lǐ) would say the surname is Li, not Wang."
  "zh-0282":
    "native": "I am a student. Are you a teacher?"
    "confusables":
      "w1":
        "why": "同学 (tóngxué) would say classmates, not a student and a teacher."
      "w2":
        "why": "朋友 (péngyou) would say a friend, not a teacher."
  "zh-0283":
    "native": "She is twenty years old."
    "confusables":
      "w1":
        "why": "我 (wǒ) would say I am twenty, not she."
      "w2":
        "why": "你们 (nǐmen) would say you all are twenty."
  "zh-0284":
    "native": "He is American."
    "confusables":
      "w1":
        "why": "英国 (Yīngguó) would say he is from the United Kingdom."
      "w2":
        "why": "法国 (Fǎguó) would say he is French."
  "zh-0285":
    "native": "Where does mum live?"
    "confusables":
      "w1":
        "why": "去 (qù) would ask where she goes, not where she lives."
      "w2":
        "why": "来 (lái) would ask where she comes to, not where she lives."
  "zh-0286":
    "native": "I like fish."
    "confusables":
      "w1":
        "why": "高兴 (gāoxìng) would say I am happy, not that I like fish."
      "w2":
        "why": "欢迎 (huānyíng) would say welcome, not like."
  "zh-0287":
    "native": "The school is very good."
    "confusables":
      "w1":
        "why": "学生 (xuésheng) would say the student is good, not the school."
      "w2":
        "why": "老师 (lǎoshī) would say the teacher is good, not the school."
  "zh-0288":
    "native": "What is the number?"
    "confusables":
      "w1":
        "why": "名字 (míngzi) would ask for the name, not the number."
      "w2":
        "why": "地址 (dìzhǐ) would ask for the address, not the number."
