  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "过 (guo) in sentences"
"description": "Sentences about what you have done before, with 过 (guo) after the verb, and never with 没 (méi) at the same time. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1402":
    "confusables":
      "w1":
        "why": "饺子 (jiǎozi) is dumplings, another dish, not hot pot."
      "w2":
        "why": "包子 (bāozi) is a steamed bun, another food."
    "native": "Have you ever eaten hot pot?"
  "zh-1403":
    "confusables":
      "w1":
        "why": "来 (lái) is to come, the other way round from going."
      "w2":
        "why": "回家 (huíjiā) is to go home, a different place."
    "bases":
      "北京":
        "meaning": "Beijing"
    "native": "I have been to Beijing."
  "zh-1404":
    "confusables":
      "w1":
        "why": "认识 (rènshi) is to know someone, which he may do."
      "w2":
        "why": "朋友 (péngyou) is a friend, a different kind of person."
    "bases":
      "没":
        "meaning": "not; did not"
    "native": "He has never seen that person."
  "zh-1405":
    "confusables":
      "w1":
        "why": "学校 (xuéxiào) is a school, a different place."
      "w2":
        "why": "公司 (gōngsī) is a company, a different place."
    "bases":
      "这里":
        "meaning": "here"
    "native": "We have come here twice."
  "zh-1406":
    "confusables":
      "w1":
        "why": "茶 (chá) is tea, another drink."
      "w2":
        "why": "果汁 (guǒzhī) is fruit juice, another drink."
    "bases":
      "没":
        "meaning": "not; did not"
    "native": "She has never drunk coffee."
  "zh-1407":
    "confusables":
      "w1":
        "why": "汽车 (qìchē) is a car, not a bicycle."
      "w2":
        "why": "摩托车 (mótuōchē) is a motorbike, a different vehicle."
    "native": "Have you ever ridden a bicycle?"
  "zh-1408":
    "confusables":
      "w1":
        "why": "书店 (shūdiàn) is a bookshop, a place not a book."
      "w2":
        "why": "字典 (zìdiǎn) is a dictionary, a different book."
    "native": "I have read this book."
  "zh-1409":
    "confusables":
      "w1":
        "why": "去 (qù) is to go, a different movement."
      "w2":
        "why": "回家 (huíjiā) is to go home, not to China."
    "native": "He has come to China three times."
