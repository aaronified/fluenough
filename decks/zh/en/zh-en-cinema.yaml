        "bases":
          "电影":
            "meaning": "film"
  "zh-3719":
    "native": "cinema hall"
    "notes":
      "n1": "A room in a cinema where films are shown. 影 (yǐng) is a film, and 厅 (tīng) is a hall."
    "examples":
      "影厅在三楼。": "The cinema hall is on the third floor."
      "这个影厅很大。": "This cinema hall is very big."
  "zh-3720":
    "native": "to show (a film)"
    "notes":
      "n1": "To project a film on a screen. 放 (fàng) is to release, and 映 (yìng) is to show."
    "examples":
      "电影开始放映了。":
        "native": "The film has started showing."
        "bases":
          "电影":
            "meaning": "film"
          "了":
            "meaning": "a particle"
      "这部电影放映了一个月。":
        "native": "This film has been shown for a month."
        "bases":
          "部":
            "meaning": "measure word for films"
          "电影":
            "meaning": "film"
          "了":
            "meaning": "a particle"
  "zh-3721":
    "native": "to record"
    "notes":
      "n1": "To make a recording of sound or video. 录 (lù) is to record, and 制 (zhì) is to make."
    "examples":
      "我们录制了视频。":
        "native": "We recorded a video."
        "bases":
          "了":
            "meaning": "a particle"
      "节目已经录制好了。":
        "native": "The programme has been recorded."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3722":
    "native": "to film"
    "notes":
      "n1": "To take a film or photo. 拍 (pāi) is to shoot, and 摄 (shè) is to film."
    "examples":
      "他们在拍摄电影。":
        "native": "They are filming a movie."
