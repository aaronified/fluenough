"cards":
  "zh-3682":
    "native": "film"
    "notes":
      "n1": "A moving picture for the cinema. 影 (yǐng) is a shadow or image, and 片 (piàn) is a piece."
    "examples":
      "这部影片很好。":
        "native": "This film is very good."
        "bases":
          "部":
            "meaning": "measure word for films"
      "影片很长。": "The film is very long."
  "zh-3683":
    "native": "plot"
    "notes":
      "n1": "The story of a play or film. 剧 (jù) is a play, and 情 (qíng) is situation."
    "examples":
      "剧情很精彩。": "The plot is very exciting."
      "剧情有点复杂。":
        "native": "The plot is a bit complicated."
        "bases":
          "有点":
            "meaning": "a bit"
  "zh-3684":
    "native": "leading role"
    "notes":
      "n1": "The main character in a film or play. 主 (zhǔ) is main, and 角 (jué) is a role."
    "examples":
      "她是这部电影的主角。":
        "native": "She is the lead in this film."
        "bases":
          "部":
            "meaning": "measure word for films"
          "电影":
            "meaning": "film"
          "的":
            "meaning": "of"
      "主角演得很好。":
        "native": "The lead actor acted very well."
        "bases":
          "演":
            "meaning": "to act"
          "得":
            "meaning": "a particle: how it is done"
  "zh-3685":
    "native": "director"
    "notes":
      "n1": "The person who directs a film. 导 (dǎo) is to guide, and 演 (yǎn) is to act."
    "examples":
      "这位导演很有名。": "This director is very famous."
      "导演说了几句话。":
        "native": "The director said a few words."
        "bases":
          "了":
            "meaning": "a particle"
          "句":
            "meaning": "measure word for sentences"
          "话":
            "meaning": "words; speech"
  "zh-3686":
    "native": "script"
    "notes":
      "n1": "The written text of a play or film. 剧 (jù) is a play, and 本 (běn) is a book."
    "examples":
      "剧本写得很好。":
        "native": "The script is very well written."
        "bases":
          "得":
            "meaning": "a particle: how it is done"
      "我读了剧本。":
        "native": "I read the script."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3687":
    "native": "shot; camera lens"
    "notes":
      "n1": "A single view in a film. 镜 (jìng) is a mirror, and 头 (tóu) is a head."
    "examples":
      "这个镜头很美。":
        "native": "This shot is very beautiful."
        "bases":
          "美":
            "meaning": "beautiful"
      "镜头很近。": "The shot is very close."
  "zh-3688":
    "native": "special effects"
    "notes":
      "n1": "Visual effects made for a film. 特 (tè) is special, and 效 (xiào) is effect."
    "examples":
      "特效很多。": "There are a lot of special effects."
      "这部电影的特效很好。":
        "native": "This film's special effects are very good."
        "bases":
          "部":
            "meaning": "measure word for films"
          "电影":
            "meaning": "film"
          "的":
            "meaning": "of"
  "zh-3689":
    "native": "subtitles"
    "notes":
      "n1": "The words shown at the bottom of a film. 字 (zì) is a character, and 幕 (mù) is a screen."
    "examples":
      "这部电影有字幕。":
        "native": "This film has subtitles."
        "bases":
          "部":
            "meaning": "measure word for films"
          "电影":
            "meaning": "film"
          "有":
            "meaning": "to have; there is"
      "字幕看不清楚。": "The subtitles are hard to read."
  "zh-3690":
    "native": "dubbing; voice-over"
    "notes":
      "n1": "Voice recorded to replace the original sound. 配 (pèi) is to match, and 音 (yīn) is sound."
    "examples":
      "这部电影是中文配音。":
        "native": "This film is dubbed in Chinese."
        "bases":
          "部":
            "meaning": "measure word for films"
          "电影":
            "meaning": "film"
          "中文":
            "meaning": "Chinese (the language)"
      "配音很好听。": "The dubbing is very nice to listen to."
  "zh-3691":
    "native": "box office"
    "notes":
      "n1": "The money a film earns from ticket sales. 票 (piào) is a ticket, and 房 (fáng) is a room."
    "examples":
      "票房很高。": "The box office is very high."
      "这部电影的票房很好。":
        "native": "This film's box office was very good."
        "bases":
          "部":
            "meaning": "measure word for films"
          "电影":
            "meaning": "film"
          "的":
            "meaning": "of"
  "zh-3692":
    "native": "premiere"
    "notes":
      "n1": "The first showing of a film. 首 (shǒu) is first, and 映 (yìng) is to show."
    "examples":
      "首映在下周。": "The premiere is next week."
      "我去看了首映。":
        "native": "I went to the premiere."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3693":
    "native": "to be released (in cinemas)"
    "notes":
      "n1": "To be shown in cinemas for the first time. 上 (shàng) is to go up, and 映 (yìng) is to show."
    "examples":
      "这部电影明天上映。":
        "native": "This film is released tomorrow."
        "bases":
          "部":
            "meaning": "measure word for films"
          "电影":
            "meaning": "film"
      "电影上映了。":
        "native": "The film has been released."
        "bases":
          "电影":
            "meaning": "film"
          "了":
            "meaning": "a particle"
  "zh-3694":
    "native": "trailer"
    "notes":
      "n1": "A short film that shows what a film will be like. 预告 (yùgào) is to announce in advance, and 片 (piàn) is a piece."
    "examples":
      "我看了预告片。":
        "native": "I watched the trailer."
        "bases":
          "了":
            "meaning": "a particle"
      "预告片很精彩。": "The trailer is very exciting."
  "zh-3695":
    "native": "sequel"
    "notes":
      "n1": "A later film that continues the story. 续 (xù) is to continue, and 集 (jí) is an episode."
    "examples":
      "这是续集。": "This is the sequel."
      "续集比第一部好。":
        "native": "The sequel is better than the first."
        "bases":
          "比":
            "meaning": "than"
          "第":
            "meaning": "ordinal prefix"
          "部":
            "meaning": "measure word for films"
  "zh-3696":
    "native": "series"
    "notes":
      "n1": "A group of films or things that go together. 系 (xì) is to connect, and 列 (liè) is a row."
    "examples":
      "这是一个系列电影。":
        "native": "This is a series of films."
        "bases":
          "电影":
            "meaning": "film"
      "这个系列很有名。": "This series is very famous."
  "zh-3697":
    "native": "comedy"
    "notes":
      "n1": "A film or play that makes people laugh. 喜 (xǐ) is joy, and 剧 (jù) is a play."
    "examples":
      "我喜欢看喜剧。": "I like watching comedies."
      "这部喜剧很好笑。":
        "native": "This comedy is very funny."
        "bases":
          "部":
            "meaning": "measure word for films"
          "好笑":
            "meaning": "funny"
  "zh-3698":
    "native": "tragedy"
    "notes":
      "n1": "A sad film or play. 悲 (bēi) is sad, and 剧 (jù) is a play."
    "examples":
      "这是一部悲剧。":
        "native": "This is a tragedy."
        "bases":
          "部":
            "meaning": "measure word for films"
      "悲剧让人难过。":
        "native": "The tragedy makes people sad."
        "bases":
          "让":
            "meaning": "to let; to make"
  "zh-3699":
    "native": "animation"
    "notes":
      "n1": "A film made from drawings. 动 (dòng) is to move, and 画 (huà) is a picture."
    "examples":
      "孩子们喜欢动画。":
        "native": "The children like animation."
        "bases":
          "孩子们":
            "meaning": "children"
      "这部动画很有意思。":
        "native": "This animation is very interesting."
        "bases":
          "部":
            "meaning": "measure word for films"
          "有":
            "meaning": "to have; there is"
          "意思":
            "meaning": "meaning; interest"
  "zh-3700":
    "native": "documentary"
    "notes":
      "n1": "A film that shows real events. 纪录 (jìlù) is to record, and 片 (piàn) is a film."
    "examples":
      "我看了一部纪录片。":
        "native": "I watched a documentary."
        "bases":
          "了":
            "meaning": "a particle"
          "部":
            "meaning": "measure word for films"
      "纪录片很真实。":
        "native": "The documentary is very real."
        "bases":
          "真实":
            "meaning": "real"
  "zh-3701":
    "native": "science fiction"
    "notes":
      "n1": "Stories about science and the future. 科 (kē) is science, and 幻 (huàn) is imaginary."
    "examples":
      "我喜欢科幻电影。":
        "native": "I like science fiction films."
        "bases":
          "电影":
            "meaning": "film"
      "这部科幻片很精彩。":
        "native": "This science fiction film is very exciting."
        "bases":
          "部":
            "meaning": "measure word for films"
          "科幻片":
            "meaning": "science fiction film"
  "zh-3702":
    "native": "frightening"
    "notes":
      "n1": "Very scary. 恐 (kǒng) is fear, and 怖 (bù) is terror."
    "examples":
      "这部电影很恐怖。":
        "native": "This film is very scary."
        "bases":
          "部":
            "meaning": "measure word for films"
          "电影":
            "meaning": "film"
      "我不敢看恐怖片。":
