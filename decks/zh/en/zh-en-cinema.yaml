    "examples":
      "她的演技很好。":
        "native": "Her acting skill is very good."
        "bases":
          "的":
            "meaning": "of"
      "这个演员的演技很高。":
        "native": "This actor's acting is very high-level."
        "bases":
          "的":
            "meaning": "of"
  "zh-3726":
    "native": "soundtrack; background music"
