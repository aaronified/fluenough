          "敢":
            "meaning": "to dare"
          "恐怖片":
            "meaning": "horror film"
  "zh-3703":
    "native": "romance film"
    "notes":
      "n1": "A film about love. 爱 (ài) is love, 情 (qíng) is feeling, and 片 (piàn) is a film."
    "examples":
      "这是一部爱情片。":
        "native": "This is a romance film."
        "bases":
          "部":
            "meaning": "measure word for films"
      "爱情片让我感动。":
        "native": "The romance film moved me."
        "bases":
          "让":
            "meaning": "to let; to make"
  "zh-3704":
    "native": "action film"
    "notes":
      "n1": "A film with a lot of fighting and movement. 动作 (dòngzuò) is action, and 片 (piàn) is a film."
    "examples":
      "我喜欢动作片。": "I like action films."
      "这部动作片很紧张。":
        "native": "This action film is very tense."
        "bases":
          "部":
            "meaning": "measure word for films"
  "zh-3705":
    "native": "martial arts (film or story)"
    "notes":
      "n1": "Stories about fighters with swords and skills. 武 (wǔ) is martial, and 侠 (xiá) is a chivalrous hero."
    "examples":
      "武侠电影很好看。":
        "native": "Martial arts films are very nice to watch."
        "bases":
          "电影":
            "meaning": "film"
      "他很喜欢武侠小说。": "He loves martial arts novels."
  "zh-3706":
    "native": "war film"
    "notes":
      "n1": "A film about war. 战争 (zhànzhēng) is war, and 片 (piàn) is a film."
    "examples":
      "这是一部战争片。":
        "native": "This is a war film."
        "bases":
          "部":
            "meaning": "measure word for films"
      "战争片很残酷。":
        "native": "War films are very cruel."
        "bases":
          "残酷":
            "meaning": "cruel"
  "zh-3707":
    "native": "stage"
    "notes":
      "n1": "The raised area where actors perform. 舞 (wǔ) is dance, and 台 (tái) is a platform."
    "examples":
      "演员在舞台上。": "The actors are on the stage."
      "舞台很大。": "The stage is very big."
  "zh-3708":
    "native": "film review"
    "notes":
      "n1": "A written opinion of a film. 影 (yǐng) is a film, and 评 (píng) is a review."
    "examples":
      "我写了一篇影评。":
        "native": "I wrote a film review."
        "bases":
          "了":
            "meaning": "a particle"
          "篇":
            "meaning": "measure word for articles"
      "这篇影评很好。":
        "native": "This film review is very good."
        "bases":
          "篇":
            "meaning": "measure word for articles"
  "zh-3709":
    "native": "rating; score"
    "notes":
      "n1": "A mark given to a film or product. 评 (píng) is to judge, and 分 (fēn) is a score."
    "examples":
      "这部电影评分很高。":
        "native": "This film has a high rating."
        "bases":
          "部":
            "meaning": "measure word for films"
          "电影":
            "meaning": "film"
      "评分在网上。":
        "native": "The ratings are online."
        "bases":
          "网上":
            "meaning": "online"
  "zh-3710":
    "native": "wonderful; exciting"
    "notes":
      "n1": "Very good and interesting. 精 (jīng) is fine, and 彩 (cǎi) is colour."
    "examples":
      "这部电影很精彩。":
        "native": "This film is very exciting."
        "bases":
          "部":
            "meaning": "measure word for films"
          "电影":
            "meaning": "film"
      "比赛很精彩。": "The match was very exciting."
  "zh-3711":
    "native": "moving; touching"
    "notes":
      "n1": "Making people feel emotion. 感 (gǎn) is to feel, and 人 (rén) is a person."
    "examples":
      "这个故事很感人。":
        "native": "This story is very moving."
        "bases":
          "故事":
            "meaning": "story"
      "结局很感人。": "The ending is very touching."
  "zh-3712":
    "native": "funny"
    "notes":
      "n1": "Making people laugh. 搞 (gǎo) is to do, and 笑 (xiào) is to laugh."
    "examples":
      "这部电影很搞笑。":
        "native": "This film is very funny."
        "bases":
          "部":
            "meaning": "measure word for films"
          "电影":
            "meaning": "film"
      "他的表演很搞笑。":
        "native": "His acting is very funny."
        "bases":
          "的":
            "meaning": "of"
          "表演":
            "meaning": "to perform"
  "zh-3713":
    "native": "ending"
    "notes":
      "n1": "The way a story finishes. 结 (jié) is to end, and 局 (jú) is a situation."
    "examples":
      "结局很好。": "The ending is very good."
      "我不喜欢这个结局。": "I do not like this ending."
  "zh-3714":
    "native": "plot details"
    "notes":
      "n1": "The events in a story. 情 (qíng) is feeling, and 节 (jié) is a section."
    "examples":
      "情节很复杂。": "The plot is very complicated."
      "这个情节很有意思。":
        "native": "This plot point is very interesting."
        "bases":
          "有":
            "meaning": "to have; there is"
          "意思":
            "meaning": "meaning; interest"
  "zh-3715":
    "native": "role; character"
    "notes":
      "n1": "The part someone plays. 角 (jué) is a role, and 色 (sè) is a type."
    "examples":
      "他演一个角色。":
        "native": "He plays a role."
        "bases":
          "演":
            "meaning": "to act"
      "这个角色很难演。":
        "native": "This role is very hard to play."
        "bases":
          "演":
            "meaning": "to act"
  "zh-3716":
    "native": "action; movement"
    "notes":
      "n1": "A movement, or what someone does. 动 (dòng) is to move, and 作 (zuò) is to do."
    "examples":
      "动作很快。": "The movement is very fast."
      "这个动作很难。": "This action is very hard."
  "zh-3717":
    "native": "popcorn"
    "notes":
      "n1": "Corn that has been heated until it pops. 爆 (bào) is to burst, 米 (mǐ) is rice, and 花 (huā) is a flower."
    "examples":
      "我买了一桶爆米花。":
        "native": "I bought a tub of popcorn."
        "bases":
          "了":
            "meaning": "a particle"
          "桶":
            "meaning": "tub; bucket"
      "爆米花很好吃。": "The popcorn is very tasty."
  "zh-3718":
    "native": "to enter (a venue)"
    "notes":
      "n1": "To go in to a place for a show. 入 (rù) is to enter, and 场 (chǎng) is a place."
    "examples":
      "请排队入场。": "Please queue to enter."
      "电影几点入场？":
