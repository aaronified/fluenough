      "n1": "Music that goes with a film. 配 (pèi) is to match, and 乐 (yuè) is music."
    "examples":
      "这部电影的配乐很好听。":
        "native": "This film's soundtrack is very nice to listen to."
        "bases":
          "部":
            "meaning": "measure word for films"
          "电影":
            "meaning": "film"
          "的":
            "meaning": "of"
      "配乐让人感动。":
        "native": "The music moves people."
        "bases":
          "让":
            "meaning": "to let; to make"
  "zh-3727":
    "native": "drama; theatre"
    "notes":
      "n1": "A play performed on stage. 戏 (xì) is a play, and 剧 (jù) is a drama."
    "examples":
      "我喜欢看戏剧。": "I like watching drama."
      "戏剧学校在北京。":
        "native": "The drama school is in Beijing."
        "bases":
          "北京":
            "meaning": "Beijing"
