"cards":
  "zh-1094":
    "confusables":
      "w1":
        "why": "眼睛 (yǎnjing) is the eye, one part of the head."
      "w2":
        "why": "鼻子 (bízi) is the nose, another part of the face."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "My head hurts a lot."
  "zh-1095":
    "confusables":
      "w1":
        "why": "运动 (yùndòng) is sport or exercise in general, not training the body."
      "w2":
        "why": "健康 (jiànkāng) is healthy, the result rather than the act."
    "bases":
      "每天":
        "meaning": "every day"
    "native": "He exercises his body every day."
  "zh-1096":
    "confusables":
      "w1":
        "why": "耳朵 (ěrduo) is an ear, for hearing."
      "w2":
        "why": "鼻子 (bízi) is the nose, for smelling."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "Her eyes are very big."
  "zh-1097":
    "confusables":
      "w1":
        "why": "头疼 (tóuténg) is a headache, not a stomach ache."
      "w2":
        "why": "累 (lèi) is tired, a feeling, not pain."
    "native": "I do not feel well; my stomach hurts."
  "zh-1098":
    "confusables":
      "w1":
        "why": "脚 (jiǎo) is the foot, not the hand."
      "w2":
        "why": "脸 (liǎn) is the face, not the hand."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "Your hands are very clean."
  "zh-1099":
    "confusables":
      "w1":
        "why": "皮肤 (pífū) is the skin, which does not sweat as a whole."
      "w2":
        "why": "心脏 (xīnzàng) is the heart, an organ inside."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "I am very tired, and I have sweated a lot."
  "zh-1100":
    "confusables":
      "w1":
        "why": "脚 (jiǎo) is the foot, at the end of the leg."
      "w2":
        "why": "背 (bèi) is the back, not the leg."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "His legs are very long."
  "zh-1101":
    "confusables":
      "w1":
        "why": "眼睛 (yǎnjing) is the eye, not the glasses."
      "w2":
        "why": "耳朵 (ěrduo) is the ear, another part of the head."
    "bases":
      "戴":
        "meaning": "to wear (glasses, a hat)"
    "native": "He wears glasses."
