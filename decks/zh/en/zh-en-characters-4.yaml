"name": "Fourth characters: the town"
"description": "Ten characters for the town: the room, the doctor's and the public place, the company and the office, the language and writing, the newspaper, the bank, and the body. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
- "script"
"cards":
  "zh-2342":
    "native": "room"
    "notes":
      "n1": "A room, a space inside a building for a purpose. 教室 (jiàoshì) is a classroom, and 卧室 (wòshì) is a bedroom."
    "examples":
      "教室很大。": "The classroom is very big."
      "办公室在二楼。": "The office is on the second floor."
  "zh-2343":
    "native": "medicine; doctor's work"
    "notes":
      "n1": "Medicine, the work of doctors and nurses. 医生 (yīshēng) is a doctor, and 医院 (yīyuàn) is a hospital."
    "examples":
      "医生在医院工作。": "The doctor works in the hospital."
      "我去医院看病。":
        "native": "I go to the hospital to see a doctor."
        "bases":
          "病":
            "meaning": "illness"
  "zh-2344":
    "native": "public; common; fair"
    "notes":
      "n1": "Public, belonging to everyone, or fair. 公园 (gōngyuán) is a public park, and 公司 (gōngsī) is a company."
    "examples":
      "公园很大。": "The public park is very big."
      "公司很忙。": "The company is very busy."
  "zh-2345":
    "native": "office; department; to manage"
    "notes":
      "n1": "A department or an office that manages a task. 公司 (gōngsī) is a company, and 司机 (sījī) is a driver."
    "examples":
      "司机很好。": "The driver is very good."
      "他在公司工作。": "He works at a company."
  "zh-2346":
    "native": "language; speech"
    "notes":
      "n1": "Language, a way of speaking. 语文 (yǔwén) is the language lesson, and 英语 (yīngyǔ) is English."
    "examples":
      "语文课很有趣。": "The language lesson is interesting."
      "他会说英语。":
        "native": "He can speak English."
        "bases":
          "会":
            "meaning": "can; to know how to"
  "zh-2347":
    "native": "writing; text; culture"
    "notes":
      "n1": "Writing, a text, or culture. 作文 (zuòwén) is a composition, and 文化 (wénhuà) is culture."
    "examples":
      "作文写得很好。":
        "native": "The composition is very well written."
        "bases":
          "得":
            "meaning": "a particle after a verb: how it is done"
      "这是一份文件。": "This is a document."
  "zh-2348":
    "native": "newspaper; report"
    "notes":
      "n1": "A newspaper, or a report of news. 报纸 (bàozhǐ) is a newspaper, and 报告 (bàogào) is a report."
    "examples":
      "报纸在桌子上。": "The newspaper is on the table."
      "请报名。":
        "native": "Please sign up."
        "bases":
          "报名":
            "meaning": "to sign up"
  "zh-2349":
    "native": "silver; bank (in names)"
    "notes":
      "n1": "Silver, the metal. 银行 (yínháng) is a bank, and 银牌 (yínpái) is a silver medal."
    "examples":
      "银行在医院旁边。": "The bank is next to the hospital."
      "他拿了银牌。":
        "native": "He took the silver medal."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2350":
    "native": "body; trunk"
    "notes":
      "n1": "The body, or the trunk of the body. 身体 (shēntǐ) is the body, and 身材 (shēncái) is a figure."
    "examples":
      "身体很好。": "The body is well."
      "他的身材很好。":
        "native": "He has a very good figure."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2351":
    "native": "body; form; physical"
    "notes":
      "n1": "The body, or a form of a thing. 体育 (tǐyù) is PE, and 体重 (tǐzhòng) is body weight."
    "examples":
      "体育课很好。": "The PE lesson is good."
      "体温很高。": "The body temperature is very high."
