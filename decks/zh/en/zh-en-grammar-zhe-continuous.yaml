"name": "着 (zhe): the state goes on"
"license": "CC-BY-SA-4.0"
"description": "着 (zhe) after a verb for a state that goes on, in a question, and with a second verb for how something is done. Not yet checked by a Mandarin speaker: please report any mistake."
"tags":
- "unreviewed"
"pattern":
  "name": "着 (zhe): the state goes on"
  "slot_name": "form"
  "prompt": "{lemma} ({gloss}), {slot}"
  "slots":
    "state": "with 着 (zhe) after the verb: the state goes on"
    "ask": "asked with 着 (zhe) and 吗 (ma)"
    "while": "with 着 (zhe) and a second verb: doing it in that state"
  "entries":
    "zuo": "to sit"
    "zhan": "to stand"
    "kai": "to open; to be open"
    "chuan": "to wear"
    "na": "to hold; to carry"
    "dai": "to bring; to have with you"
    "kan": "to watch; to look"
  "notes": "着 (zhe) goes straight after a verb and says the action or the state it left goes on: 门开着 (mén kāi zhe), the door is open (it was opened and stays so). It is said in the neutral tone, so it has no tone mark. In a question it keeps 着 (zhe) and takes 吗 (ma): 他坐着吗 (tā zuò zhe ma). Put a second verb after it to say what is done in that state, with the first verb saying how: 他坐着看书 (tā zuò zhe kàn shū), he sits and reads. To deny a state, 没 (méi) goes before the verb and 着 (zhe) is usually dropped: 他没带钱 (tā méi dài qián). Do not use 着 (zhe) for an action that happens once and ends: that is 了 (le)."
