  "notes": "A describing word needs 很 (hěn) in front of it in a plain statement: 我很忙 (wǒ hěn máng), I am busy. 很 (hěn) can mean very, but in a plain sentence it is often only the word that comes before the describing word. Without it, a bare describing word after its subject often sounds like a contrast: 我忙 (wǒ máng) suggests that someone else is not. The negative puts 不 (bù) in front: 我不忙 (wǒ bù máng), I am not busy. 不 (bù) is said bú before a fourth tone, as in 不热 (bú rè), not hot."
