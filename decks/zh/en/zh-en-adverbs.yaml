"id": "zh-en-adverbs"
"kind": "layer"
"core": "zh-adverbs"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Adverbs"
"description": "Thirty adverbs for how often, how much, how well and when: always, often, never, already, still, again, too, very, the most, together, certainly, maybe, at once, first, then, only and actually. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0344":
    "native": "always"
    "notes":
      "n1": "Every time, without exception. It comes before the verb or adjective."
    "examples":
      "妈妈总是很高兴。": "Mum is always very happy."
      "你总是来吗？": "Do you always come?"
  "zh-0345":
    "native": "often"
    "notes":
      "n1": "Often, for a habit that comes back. Less certain than 总是 (zǒngshì), always."
    "examples":
      "我常常喝水。": "I often drink water."
      "你常常吃鱼吗？": "Do you often eat fish?"
  "zh-0346":
    "native": "regularly; often"
    "notes":
      "n1": "Often and regularly, as a habit that is kept up. Close to 常常 (chángcháng), often."
    "examples":
      "我们经常回家。": "We often go home."
      "老师经常问什么？": "What does the teacher often ask?"
  "zh-0347":
    "native": "occasionally; now and then"
    "notes":
      "n1": "Now and then, not often. Its opposite is 总是 (zǒngshì), always."
    "examples":
      "我偶尔吃鱼。": "I eat fish now and then."
      "他偶尔来。": "He comes now and then."
  "zh-0348":
    "native": "never; ever"
    "notes":
      "n1": "Used with a negative: 从来不 (cónglái bù), never. 不 (bù) is the negative."
    "examples":
      "他从来不买鱼。": "He never buys fish."
      "你从来不喝水吗？": "Do you never drink water?"
  "zh-0349":
    "native": "already"
    "notes":
      "n1": "Already, for a thing done before the time one thought. It comes before the verb."
    "examples":
      "妈妈已经起床了。":
        "native": "Mum has already got up."
        "bases":
          "了": &id001
            "meaning": "(marks a change or a completed action)"
      "你已经回家了吗？":
        "native": "Have you already gone home?"
        "bases":
          "了": *id001
  "zh-0350":
    "native": "just; only just"
    "notes":
      "n1": "Just now, a moment ago, or only just. 刚才 (gāngcai), a little while ago, is a different word."
    "examples":
      "我刚起床。": "I have just got up."
      "他刚来。": "He has just come."
  "zh-0351":
    "native": "still; also; yet"
    "notes":
      "n1": "Still, also, or even more. It comes before the verb or adjective."
    "examples":
      "你还吃吗？": "Are you still eating?"
      "他还好吗？": "Is he still well?"
  "zh-0352":
    "native": "again; then"
    "notes":
      "n1": "Again, for a thing done once more, or then, in the future. 再见 (zàijiàn), goodbye, is from this word."
    "examples":
      "请再说。": "Please say it again."
      "我们再去。": "We will go again."
  "zh-0353":
    "native": "again; also"
    "notes":
      "n1": "Again, for a thing that happened before and happened once more, often with 了 (le) after the verb. 再 (zài) is for the future."
    "examples":
      "他又来了。":
        "native": "He came again."
        "bases":
          "了": *id001
      "你又买鱼了吗？":
        "native": "Did you buy fish again?"
        "bases":
          "了": *id001
  "zh-0354":
    "native": "too; so"
    "notes":
      "n1": "Too much, as in a complaint or a surprise. It comes before an adjective."
    "examples":
      "太好！": "Great!"
      "太大吗？": "Is it too big?"
  "zh-0355":
    "native": "very; extremely"
    "notes":
      "n1": "Very, more strongly than 很 (hěn). 非常感谢 (fēicháng gǎnxiè), thank you very much, is from this word."
    "examples":
      "我非常高兴。": "I am very happy."
      "老师非常好。": "The teacher is very good."
  "zh-0356":
    "native": "fairly; rather"
    "notes":
      "n1": "Fairly or rather: a milder way to say very. It is also a verb, to compare."
    "examples":
      "他比较好。": "He is fairly good."
      "这比较大吗？": "Is this fairly big?"
  "zh-0357":
    "native": "more; even more"
    "notes":
      "n1": "More, for a comparison or a rise. It comes before an adjective: 更好 (gèng hǎo), better."
    "examples":
      "你更好。": "You are even better."
      "他更高兴吗？": "Is he even happier?"
  "zh-0358":
    "native": "most"
    "notes":
      "n1": "The most, of all. It comes before an adjective: 最好 (zuì hǎo), the best."
    "examples":
      "我最喜欢鱼。": "I like fish the most."
      "妈妈最大。": "Mum is the oldest."
  "zh-0359":
    "native": "together"
    "notes":
      "n1": "Together, with other people. It comes before the verb."
    "examples":
      "我们一起吃饭。": "We eat together."
      "你们一起来吗？": "Are you all coming together?"
  "zh-0360":
    "native": "certainly; definitely"
    "notes":
      "n1": "Certainly, or without fail. Stronger than 可能 (kěnéng), possibly."
    "examples":
      "我一定来。": "I will definitely come."
      "你一定去吗？": "Are you definitely going?"
  "zh-0361":
    "native": "maybe; possibly"
    "notes":
      "n1": "Maybe, or probably. Weaker than 一定 (yídìng), certainly."
    "examples":
      "他可能来。": "He may come."
      "老师可能回家。": "The teacher may go home."
  "zh-0362":
    "native": "of course; certainly"
    "notes":
      "n1": "Of course, when a thing is clear. It is also a reply: 当然 (dāngrán), of course."
    "examples":
      "当然，我来。": "Of course, I will come."
      "当然好。": "Of course, that is fine."
  "zh-0363":
    "native": "at once; right away"
    "notes":
      "n1": "At once, very soon. It is said for a thing that happens soon."
    "examples":
      "我马上来。": "I am coming right away."
      "老师马上开始。": "The teacher will begin at once."
    "synonyms":
      "at-once": "at once; straight away"
  "zh-0364":
    "native": "first; before"
    "notes":
      "n1": "First, before another action. It comes before the verb."
    "examples":
      "你先吃。": "You eat first."
      "我先走。": "I will leave first."
  "zh-0365":
    "native": "then; after that"
    "notes":
      "n1": "Then, after that, in a sequence of actions. It joins two actions in order."
    "examples":
      "我们吃饭，然后回家。": "We eat, then go home."
      "你写，然后说。": "Write, then speak."
  "zh-0366":
    "native": "altogether; in all"
    "notes":
      "n1": "Altogether, in total. It is used for a total of a count or a price."
    "examples":
      "一共多少？": "How much altogether?"
      "一共二十。": "Twenty in all."
  "zh-0367":
    "native": "only; just"
    "notes":
      "n1": "Only, and nothing more. It comes before the verb or the noun."
    "examples":
      "我只喝水。": "I only drink water."
      "你只吃鱼吗？": "Do you eat only fish?"
  "zh-0368":
    "native": "do not; don't"
    "notes":
      "n1": "Do not, for a request or a warning, before a verb: 别走 (bié zǒu), don't go."
    "examples":
      "别走。": "Don't go."
      "别忘了。":
        "native": "Don't forget."
        "bases":
          "了": *id001
  "zh-0369":
    "native": "actually; in fact"
    "notes":
      "n1": "Actually, or in fact, when a thing is not what one thought."
    "examples":
      "其实我很好。": "Actually, I am fine."
      "其实他不来。": "Actually, he is not coming."
  "zh-0370":
    "native": "really; truly"
    "notes":
      "n1": "Really, or very, in speech. 真好 (zhēn hǎo) is really good."
    "examples":
      "真好！": "Really good!"
      "妈妈真高兴。": "Mum is really happy."
  "zh-0371":
    "native": "almost; about; nearly the same"
    "notes":
      "n1": "Almost, or about the same. Used for a rough amount or a thing that is nearly right."
    "examples":
      "差不多吗？": "Is it about the same?"
      "我们差不多。": "We are about the same."
  "zh-0372":
    "native": "probably; about; roughly"
    "notes":
      "n1": "Probably, or roughly. Less sure than 一定 (yídìng), certainly."
    "examples":
      "他大概来。": "He will probably come."
      "大概多少？": "About how much?"
  "zh-0373":
    "native": "just; exactly; then"
    "notes":
      "n1": "Just, exactly, or at once. It has many uses; this card is the basic one."
    "examples":
      "我就来。": "I'll be right there."
      "就是你。": "It is exactly you."
