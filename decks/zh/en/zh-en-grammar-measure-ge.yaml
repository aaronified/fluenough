  "notes": "个 (ge) is the measure word for a person, and it is the one to use when no other measure word fits. Put it between 这 (zhè), 那 (nà) or 哪 (nǎ) and the noun: 这个人 (zhè ge rén), this person; 那个老师 (nà ge lǎoshī), that teacher; 哪个学生 (nǎ ge xuésheng), which student. 个 (ge) is said in a neutral tone, so it has no tone mark."
