tags:
- unreviewed
cards:
  zh-6050:
    native: To learn and to practise what one learns at the right times is a pleasure; when friends come from far away, is that not a joy?
    notes:
      n1: The Analects record sayings of Confucius (c. 551 to c. 479 BCE), gathered by his disciples. 说 (yuè) here means to be pleased, and 乐 (lè) means joyful. 亦 (yì) means also.
    bases:
      学而:
        meaning: to learn, and then
      时习:
        meaning: to practise at the right times
      之:
        meaning: it, what is learned
      不亦:
        meaning: is it not also
      说:
        meaning: to be pleased
      乎:
        meaning: (question particle)
      有朋:
        meaning: friends
      自:
        meaning: from
      远方:
        meaning: a distant place
      乐:
        meaning: joyful
  zh-6051:
    native: If you make a mistake, do not hesitate to change it.
    notes:
      n1: A saying from the Analects of Confucius. 惮 (dàn) means to be reluctant or afraid. 勿 (wù) means do not.
    bases:
      则:
        meaning: then
      勿:
        meaning: do not
      惮:
        meaning: to fear, to hesitate
      改:
        meaning: to change
  zh-6052:
    native: Review the old and learn the new, and you can be a teacher.
    notes:
      n1: A saying from the Analects of Confucius. 矣 (yǐ) is a sentence-ending particle.
    bases:
      温故:
        meaning: to review what one has learned
      而:
        meaning: and
      知新:
        meaning: to learn what is new
      可以:
        meaning: can, may
      为师:
        meaning: to be a teacher
      矣:
        meaning: (particle)
  zh-6053:
    native: Learning without thinking leads to confusion; thinking without learning leads to danger.
    notes:
      n1: A saying from the Analects of Confucius. 罔 (wǎng) means lost or confused, and 殆 (dài) means in danger.
    bases:
      学而:
        meaning: to learn, and then
      思:
        meaning: to think
      则:
        meaning: then
      罔:
        meaning: to be confused
      思而:
        meaning: to think, and then
      殆:
        meaning: in danger
  zh-6054:
    native: 'To know what you know, and to admit what you do not know: that is knowing.'
    notes:
      n1: A saying from the Analects of Confucius. 也 (yě) is a sentence-ending particle.
    bases:
      知之:
        meaning: to know it
      为:
        meaning: to regard as
      不知:
        meaning: not to know
  zh-6055:
    native: The gentleman understands what is right; the petty person understands what is profitable.
    notes:
      n1: A saying from the Analects of Confucius. 喻 (yù) means to understand. 君 (jūn) means a lord, and 君子 (jūnzǐ) is a gentleman.
    bases:
      君子:
        meaning: a gentleman, a person of virtue
      喻于:
        meaning: to understand as
      义:
        meaning: righteousness
      小人:
        meaning: a petty person
      利:
        meaning: profit
  zh-6056:
    native: Virtue is never alone; it always has neighbours.
    notes:
      n1: A saying from the Analects of Confucius. 邻 (lín) means neighbour.
    bases:
      德:
        meaning: virtue
      孤:
        meaning: alone
      必有:
        meaning: must have
      邻:
        meaning: neighbour
  zh-6057:
    native: When three people walk together, there must be one from whom I can learn.
    notes:
      n1: A saying from the Analects of Confucius. 焉 (yān) is a particle meaning here or in it.
    bases:
      三人行:
        meaning: when three people walk together
      必有:
        meaning: there must be
      焉:
        meaning: (here, in it)
  zh-6058:
    native: Only when the year turns cold do we know that the pine and the cypress are the last to wither.
    notes:
      n1: A saying from the Analects of Confucius. 凋 (diāo) means to wither, and 柏 (bǎi) is cypress.
    bases:
      岁寒:
        meaning: the cold of the year
      松柏:
        meaning: pine and cypress
      之后:
        meaning: later
      凋:
        meaning: to wither
  zh-6059:
    native: Do not impose on other people what you do not want for yourself.
    notes:
      n1: A saying from the Analects of Confucius. 欲 (yù) means to want, and 施 (shī) means to impose or give. 勿 (wù) means do not.
    bases:
      己所:
        meaning: what one oneself
      不:
        meaning: do not
      欲:
        meaning: to want
      勿:
        meaning: do not
      施于:
        meaning: to impose on
  zh-6060:
    native: The gentleman seeks the cause within himself; the petty person seeks it in others.
    notes:
      n1: A saying from the Analects of Confucius. 诸 (zhū) stands for 之于 (zhī yú), here to or in. 君 (jūn) means a lord; 君子 (jūnzǐ) is a gentleman.
    bases:
      君子:
        meaning: a gentleman, a person of virtue
      求诸己:
        meaning: to seek within oneself
      小人:
        meaning: a petty person
      求诸人:
        meaning: to seek from others
  zh-6061:
    native: Without accumulating half-steps you cannot reach a thousand li; without accumulating small streams you cannot form rivers and seas.
    notes:
      n1: Xunzi (c. 310 to after 238 BCE) wrote this in the chapter on learning. 跬 (kuǐ) is a half-step. 江 (jiāng) is a river.
    bases:
      不积:
        meaning: not to accumulate
      跬步:
        meaning: a half-step
      无以:
        meaning: have no means to
      至:
        meaning: to reach
      千里:
        meaning: a thousand li
      小流:
        meaning: small streams
      成:
        meaning: to form
      江海:
        meaning: rivers and seas
  zh-6062:
    native: Blue comes from indigo, yet it is bluer than the indigo.
    notes:
      n1: 'Xunzi used this image in the chapter on learning: a student can surpass the teacher. 蓝 (lán) is the indigo plant.'
    bases:
      青:
        meaning: blue
      取之:
        meaning: to take it from
      于:
        meaning: from, than
      而:
        meaning: and
  zh-6063:
    native: Respect my own elders, and extend that respect to the elders of others; care for my own young, and extend that care to the young of others.
    notes:
      n1: Mencius (c. 371 to c. 289 BC) wrote this in the first book of his sayings. 吾 (wú) means my.
    bases:
      吾:
        meaning: my
      以及:
        meaning: and extend to
      人之:
        meaning: other people's
      幼:
        meaning: to care for as the young
  zh-6064:
    native: Timing is not as important as the advantage of place, and the advantage of place is not as important as harmony among people.
    notes:
      n1: Mencius (c. 371 to c. 289 BC) wrote this in the second book of his sayings. 和 (hé) here means harmony.
    bases:
      天时:
        meaning: the right time, the season
      不如:
        meaning: is not as good as
      地利:
        meaning: an advantage of the land
      人和:
        meaning: harmony among people
  zh-6065:
    native: Whoever has the way has many to help; whoever has lost the way has few to help.
    notes:
      n1: Mencius (c. 371 to c. 289 BC) wrote this in the second book of his sayings. 寡 (guǎ) means few.
    bases:
      得道者:
        meaning: one who has the way
      多助:
        meaning: many helpers
      失道者:
        meaning: one who has lost the way
      寡助:
        meaning: few helpers
  zh-6066:
    native: The gentleman studies widely and examines himself every day; then his knowledge is clear and his conduct is without fault.
    notes:
      n1: Xunzi (c. 310 to after 238 BCE) wrote this in the chapter on learning. 参 (cān) means to examine, and 省 (xǐng) means to reflect. 君 (jūn) and 矣 (yǐ) are in the sentence.
    bases:
      君子:
        meaning: a gentleman, a person of virtue
      博学:
        meaning: to study widely
      而:
        meaning: and
      参省:
        meaning: to examine
      乎:
        meaning: (particle)
      己:
        meaning: oneself
      则:
        meaning: then
      知明:
        meaning: clear knowledge
      无过:
        meaning: without fault
      矣:
        meaning: (particle)
  zh-6067:
    native: Tangled grass that grows among hemp stands straight without support.
    notes:
      n1: Xunzi (c. 310 to after 238 BCE) used this image in the chapter on learning. 蓬 (péng) is a tangled grass, and 麻 (má) is hemp.
    bases:
      蓬生:
        meaning: grows among, as a weed
      麻中:
        meaning: among hemp
      不扶:
        meaning: without support
      而:
        meaning: and
