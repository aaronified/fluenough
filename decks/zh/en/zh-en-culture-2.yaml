name: 'Culture: sayings of the Warring States and Han masters'
description: 'Eighteen short sayings from the Analects, Mencius and Xunzi, in the public domain. Each shows who said it and where it comes from. The text is shown in simplified characters, with the traditional
  form beside it. Not yet checked by a Chinese speaker: please report any mistake.'
