"name": "得 (de) after a verb: how it is done; 地 (de) before a verb: in a way; 的 (de) for nouns"
"description": "Sentences that use the three de: 他说得很快 (he speaks very fast), 他很快地说 (he says it quickly), and 他的书 (his book). Not yet checked by a Mandarin speaker: please report any mistake."
