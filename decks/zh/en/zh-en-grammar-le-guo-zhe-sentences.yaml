  "name": "English"
"name": "了 (le), 过 (guo) and 着 (zhe): finished, done before, and going on; 正在 (zhèngzài) ... 呢 (ne): happening now"
"description": "Sentences that contrast the aspect markers: 我吃了饭 (I ate), 我吃过北京烤鸭 (I have eaten Peking duck), 门开着 (the door is open), and 他正在看书呢 (he is reading now). Not yet checked by a Mandarin speaker: please report any mistake."
