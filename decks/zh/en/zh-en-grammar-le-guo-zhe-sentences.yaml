"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-4000":
    "confusables":
      "w1":
        "why": "喝 (hē) is to drink, a different act."
      "w2":
        "why": "买 (mǎi) is to buy, a different act."
    "bases":
      "了":
        "meaning": "a particle: a finished action"
      "北京烤鸭":
        "meaning": "Peking duck"
    "native": "I have eaten, and I have also eaten Peking duck before."
  "zh-4001":
    "confusables":
      "w1":
        "why": "关 (guān) is to close, the opposite of opening."
      "w2":
        "why": "好 (hǎo) is good, a different state."
    "bases":
      "着":
        "meaning": "a particle: a state continues"
    "native": "The door is open."
  "zh-4002":
    "confusables":
      "w1":
        "why": "写 (xiě) is to write, a different act."
      "w2":
        "why": "听 (tīng) is to listen, a different act."
    "bases":
      "正在":
        "meaning": "in the middle of"
    "native": "He is reading a book now."
  "zh-4003":
    "confusables":
      "w1":
        "why": "做 (zuò) is to do, a close word."
      "w2":
        "why": "看 (kàn) is to read, a different act."
    "bases":
      "没":
        "meaning": "not"
    "native": "I am not doing my homework right now."
  "zh-4004":
    "confusables":
      "w1":
        "why": "来 (lái) is to come, the other direction."
      "w2":
        "why": "走 (zǒu) is to walk or leave, a different act."
    "bases":
      "北京":
        "meaning": "Beijing"
    "native": "I have been to China, and I have also been to Beijing."
  "zh-4005":
    "confusables":
      "w1":
        "why": "脱 (tuō) is to take off, the opposite."
      "w2":
        "why": "脱 (tuō) is to take off, the opposite of wearing."
    "bases":
      "着":
        "meaning": "a particle: a state continues"
    "native": "He is wearing new clothes."
  "zh-4006":
    "confusables":
      "w1":
        "why": "现在 (xiànzài) is now, a different time."
      "w2":
        "why": "以前 (yǐqián) is before, a different time."
    "bases":
      "刚才":
        "meaning": "just now"
      "完":
        "meaning": "finished"
      "了":
        "meaning": "a particle: a finished action"
    "native": "We finished eating just now."
  "zh-4007":
    "confusables":
      "w1":
        "why": "放 (fàng) is to put, a different act."
      "w2":
        "why": "站 (zhàn) is to stand, a different act."
    "bases":
      "着":
        "meaning": "a particle: a state continues"
    "native": "There is a map hanging on the wall."
