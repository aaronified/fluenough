  "zh-4656":
    "native": "to ferment"
    "notes":
      "n1": "发酵 (fājiào) is to ferment, when a food changes slowly through the action of yeast or bacteria. 泡菜 (pàocài) is pickled vegetables, one food that ferments."
    "examples":
      "面团要先发酵。":
        "native": "The dough has to ferment first."
        "bases":
          "面团":
            "meaning": "dough"
          "要":
            "meaning": "must"
          "发酵":
            "meaning": "to ferment"
      "豆腐有些也需要发酵。":
        "native": "Some tofu also needs to ferment."
        "bases":
          "豆腐":
            "meaning": "tofu"
          "有些":
            "meaning": "some"
          "也":
            "meaning": "also"
          "发酵":
            "meaning": "to ferment"
