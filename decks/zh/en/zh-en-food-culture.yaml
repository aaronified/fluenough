  "zh-4649":
    "native": "diet; food and drink"
    "notes":
      "n1": "饮食 (yǐnshí) is the food and drink a person or a people eats, and how they eat it. 吃饭 (chīfàn) is the everyday verb to eat a meal."
    "examples":
      "他的饮食很健康。":
        "native": "His diet is very healthy."
        "bases":
          "他":
            "meaning": "he"
          "的":
            "meaning": "particle"
          "饮食":
            "meaning": "diet"
          "很":
            "meaning": "very"
      "中国的饮食文化很丰富。":
        "native": "China's food culture is very rich."
        "bases":
          "的":
            "meaning": "particle"
          "饮食":
            "meaning": "diet"
          "很":
            "meaning": "very"
          "丰富":
            "meaning": "rich"
  "zh-4650":
    "native": "regional cuisine; cooking school of a region"
    "notes":
      "n1": "菜系 (càixì) is a regional style of cooking with its own dishes and tastes, such as 川菜 (chuāncài), Sichuan cooking. 地方菜 (dìfāngcài) is a local dish or local cooking in general."
    "examples":
      "川菜是一个很有名的菜系。":
        "native": "Sichuan cuisine is a famous regional cuisine."
        "bases":
          "川菜":
            "meaning": "Sichuan cuisine"
          "是":
            "meaning": "is"
          "很":
            "meaning": "very"
          "的":
            "meaning": "particle"
          "菜系":
            "meaning": "regional cuisine"
      "每个菜系都有自己的特色。":
        "native": "Each regional cuisine has its own character."
        "bases":
          "菜系":
            "meaning": "regional cuisine"
          "都":
            "meaning": "each"
          "有":
            "meaning": "has"
          "的":
            "meaning": "particle"
          "特色":
            "meaning": "character"
  "zh-4651":
    "native": "eight-treasure rice pudding"
    "notes":
      "n1": "八宝饭 (bābǎofàn) is a sweet rice pudding with dried fruit and nuts, served at festivals. 八 (bā) is eight and 宝 (bǎo) is treasure, so it is named for its many good ingredients."
    "examples":
      "过年的时候我们吃八宝饭。":
        "native": "At New Year we eat eight-treasure rice pudding."
        "bases":
          "过年":
            "meaning": "New Year"
          "的":
            "meaning": "particle"
          "时候":
            "meaning": "time"
          "吃":
            "meaning": "eat"
          "八宝饭":
            "meaning": "eight-treasure rice pudding"
      "八宝饭上面放着红枣。":
        "native": "The eight-treasure rice pudding has red dates on top."
        "bases":
          "八宝饭":
            "meaning": "eight-treasure rice pudding"
          "面":
            "meaning": "top"
          "着":
            "meaning": "particle"
          "红枣":
            "meaning": "red dates"
  "zh-4652":
    "native": "teahouse"
    "notes":
      "n1": "茶馆 (cháguǎn) is a teahouse, a place where people sit, drink tea and talk. 咖啡馆 (kāfēiguǎn) is a coffee shop."
    "examples":
      "老人常去茶馆聊天。":
        "native": "Older people often go to the teahouse to chat."
        "bases":
