            "meaning": "often"
          "去":
            "meaning": "go"
          "茶馆":
            "meaning": "teahouse"
      "这个茶馆很安静。":
        "native": "This teahouse is very quiet."
        "bases":
          "这个":
            "meaning": "this"
          "茶馆":
            "meaning": "teahouse"
          "很":
            "meaning": "very"
  "zh-4653":
    "native": "tea ceremony; the art of making tea"
    "notes":
      "n1": "茶道 (chádào) is the art and ritual of preparing and serving tea, with care in every step. 茶艺 (cháyì) is the craft of tea-making."
    "examples":
      "她学茶道。":
        "native": "She is learning the tea ceremony."
        "bases":
          "茶道":
            "meaning": "tea ceremony"
      "茶道讲究每一个动作。":
        "native": "The tea ceremony stresses every single movement."
        "bases":
          "茶道":
            "meaning": "tea ceremony"
          "讲究":
            "meaning": "stresses"
  "zh-4654":
    "native": "seasoning; condiment"
    "notes":
      "n1": "调味料 (tiáowèiliào) is a seasoning or condiment added to food, such as salt, soy sauce or vinegar. 调料 (tiáoliào) is the everyday word for the same things."
    "examples":
      "这种调味料很咸。":
        "native": "This seasoning is very salty."
        "bases":
          "调味料":
            "meaning": "seasoning"
          "很":
            "meaning": "very"
      "做菜的时候要少放调味料。":
        "native": "When you cook, use less seasoning."
        "bases":
          "的":
            "meaning": "particle"
          "时候":
            "meaning": "time"
          "要":
            "meaning": "must"
          "调味料":
            "meaning": "seasoning"
