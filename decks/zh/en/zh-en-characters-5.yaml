"name": "Fifth characters: the news"
"description": "Ten characters for the news: the report and the hearing, the screen and the broadcast, the government and its policy, the economy and the business, the printed page. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
- "script"
"cards":
  "zh-3036":
    "native": "hear; news (as a character)"
    "notes":
      "n1": "To hear, and so news. 新闻 (xīnwén) is news, and 闻 (wén) is to hear."
    "examples":
      "今天有什么新闻？":
        "native": "What is the news today?"
        "bases":
          "有":
            "meaning": "to have"
      "我听到了新闻。":
        "native": "I heard the news."
        "bases":
          "到":
            "meaning": "to arrive; to reach"
          "了":
            "meaning": "a particle"
  "zh-3037":
    "native": "to look at; to see"
    "notes":
      "n1": "To look at carefully. 电视 (diànshì) is television, and 视 (shì) is to look."
    "examples":
      "我看电视。": "I watch television."
      "这个电视很大。": "This television is very big."
  "zh-3038":
    "native": "to broadcast; to spread"
    "notes":
      "n1": "To send out on the air or to sow. 广播 (guǎngbō) is a radio broadcast, and 播 (bō) is to broadcast."
    "examples":
      "我听广播。": "I listen to the radio."
      "节目很好。": "The programme is good."
  "zh-3039":
    "native": "message; news (as a character)"
    "notes":
      "n1": "Information or a message. 消息 (xiāoxi) is news, and 讯 (xùn) is information."
    "examples":
      "有好消息。":
        "native": "There is good news."
        "bases":
          "有":
            "meaning": "to have"
      "我听到一个消息。":
        "native": "I heard some news."
        "bases":
          "到":
            "meaning": "to arrive; to reach"
  "zh-3040":
    "native": "government; politics"
    "notes":
      "n1": "The running of a country. 政府 (zhèngfǔ) is the government, and 政 (zhèng) is politics."
    "examples":
      "政府很大。": "The government is very big."
      "政策很好。": "The policy is good."
  "zh-3041":
    "native": "government office; house"
    "notes":
      "n1": "A government office or a large house. 政府 (zhèngfǔ) is the government, and 府 (fǔ) is an office."
    "examples":
      "政府在北京。":
        "native": "The government is in Beijing."
        "bases":
          "北京":
            "meaning": "Beijing"
      "首府很大。": "The capital city is very big."
  "zh-3042":
    "native": "to help; to aid (as a character)"
    "notes":
      "n1": "To help or to relieve. 经济 (jīngjì) is the economy, and 济 (jì) is to help."
    "examples":
      "经济很好。": "The economy is very good."
      "经济在发展。": "The economy is developing."
  "zh-3043":
    "native": "work; trade"
    "notes":
      "n1": "Work, or a line of business. 工业 (gōngyè) is industry, and 业 (yè) is work."
    "examples":
      "我的工作很好。":
        "native": "My work is very good."
        "bases":
          "的":
            "meaning": "of"
      "这个行业很大。":
        "native": "This line of business is very big."
        "bases":
          "行业":
            "meaning": "line of business"
  "zh-3044":
    "native": "to announce; cloth"
    "notes":
      "n1": "To announce publicly, or cloth. 公布 (gōngbù) is to announce, and 布 (bù) is to spread out."
    "examples":
      "政府公布了结果。":
        "native": "The government announced the result."
        "bases":
          "了":
            "meaning": "a particle"
          "结果":
            "meaning": "result"
      "这块布很好。":
        "native": "This piece of cloth is very good."
        "bases":
          "块":
            "meaning": "measure word for lumps and pieces"
  "zh-3045":
    "native": "edition; page; print"
    "notes":
      "n1": "A printed page or an edition. 报纸 (bàozhǐ) is a newspaper, and 版 (bǎn) is a page."
    "examples":
      "报纸的版很大。":
        "native": "The page of the newspaper is very big."
        "bases":
          "的":
            "meaning": "of"
      "这是新版。": "This is the new edition."
