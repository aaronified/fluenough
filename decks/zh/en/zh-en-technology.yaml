"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-3338":
    "native": "software"
    "notes":
      "n1": "The programs that run on a computer. 软 (ruǎn) is soft, and 件 (jiàn) is a thing."
    "examples":
      "这个软件很好用。":
        "native": "This software is very easy to use."
        "bases":
          "好用":
            "meaning": "easy to use"
      "软件要更新。":
        "native": "The software needs updating."
        "bases":
          "要":
            "meaning": "to need"
  "zh-3339":
    "native": "hardware"
    "notes":
      "n1": "The physical parts of a computer. 硬 (yìng) is hard, and 件 (jiàn) is a part."
    "examples":
      "硬件坏了。":
        "native": "The hardware is broken."
        "bases":
          "了":
            "meaning": "a particle"
      "这个电脑的硬件很好。":
        "native": "This computer's hardware is very good."
        "bases":
          "的":
            "meaning": "of"
  "zh-3340":
    "native": "program"
    "notes":
      "n1": "A set of instructions for a computer. 程 (chéng) is a procedure, and 序 (xù) is an order."
    "examples":
      "这个程序很大。": "This program is very big."
      "程序出错了。":
        "native": "The program has an error."
        "bases":
          "出错":
            "meaning": "to make an error"
          "了":
            "meaning": "a particle"
  "zh-3341":
    "native": "system"
    "notes":
      "n1": "A set of parts that work together. 系 (xì) is to connect, and 统 (tǒng) is a whole."
    "examples":
      "系统很稳定。":
        "native": "The system is very stable."
        "bases":
          "稳定":
            "meaning": "stable"
      "我的系统要更新。":
        "native": "My system needs updating."
        "bases":
          "的":
            "meaning": "of"
          "要":
            "meaning": "to need"
  "zh-3342":
    "native": "account number; username"
    "notes":
      "n1": "The name or number used to log in. 账 (zhàng) is an account, and 号 (hào) is a number."
    "examples":
      "我的账号是什么？":
        "native": "What is my username?"
        "bases":
          "的":
            "meaning": "of"
      "账号登录失败。": "Login to the account failed."
  "zh-3343":
    "native": "to log in"
    "notes":
      "n1": "To enter an account on a device or site. 登 (dēng) is to register, and 录 (lù) is to record."
    "examples":
      "请登录。": "Please log in."
      "我登录了网站。":
        "native": "I logged in to the website."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3344":
    "native": "to register; to sign up"
    "notes":
      "n1": "To create a new account. 注 (zhù) is to note, and 册 (cè) is a book."
    "examples":
      "我要注册一个账号。":
        "native": "I want to register a new account."
        "bases":
          "要":
            "meaning": "to need"
      "注册很简单。": "Signing up is very simple."
  "zh-3345":
    "native": "to update"
    "notes":
      "n1": "To make something new or current. 更 (gēng) is to change, and 新 (xīn) is new."
    "examples":
      "请更新软件。": "Please update the software."
      "系统已经更新了。":
        "native": "The system has been updated."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3346":
    "native": "to upgrade"
    "notes":
      "n1": "To make something better or newer. 升 (shēng) is to rise, and 级 (jí) is a level."
    "examples":
      "手机需要升级。": "The phone needs upgrading."
      "电脑升级了。":
        "native": "The computer has been upgraded."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3347":
    "native": "to back up"
    "notes":
      "n1": "To make a copy of files in case of loss. 备 (bèi) is to prepare, and 份 (fèn) is a copy."
    "examples":
      "请备份文件。": "Please back up the files."
      "我每天备份照片。":
        "native": "I back up my photos every day."
        "bases":
          "每天":
            "meaning": "every day"
  "zh-3348":
    "native": "to store"
    "notes":
      "n1": "To keep data for later use. 存 (cún) is to keep, and 储 (chǔ) is to store."
    "examples":
      "存储空间不够了。":
        "native": "The storage space is not enough."
        "bases":
          "空间":
            "meaning": "space"
          "不够":
            "meaning": "not enough"
          "了":
            "meaning": "a particle"
      "数据存储在哪里？": "Where is the data stored?"
  "zh-3349":
    "native": "memory (RAM)"
    "notes":
      "n1": "The memory a computer uses to run programs. 内 (nèi) is inside, and 存 (cún) is storage."
    "examples":
      "内存很大。": "The memory is very big."
      "内存不够，电脑很慢。":
        "native": "There is not enough memory, so the computer is slow."
        "bases":
          "不够":
            "meaning": "not enough"
  "zh-3350":
    "native": "chip"
    "notes":
      "n1": "A small piece of silicon with circuits. 芯 (xīn) is the core, and 片 (piàn) is a piece."
    "examples":
      "这个芯片很快。": "This chip is very fast."
      "手机的芯片坏了。":
        "native": "The phone's chip is broken."
        "bases":
          "的":
            "meaning": "of"
          "了":
            "meaning": "a particle"
  "zh-3351":
    "native": "keyboard"
    "notes":
      "n1": "The set of keys you type on. 键 (jiàn) is a key, and 盘 (pán) is a board."
    "examples":
      "键盘坏了。":
        "native": "The keyboard is broken."
        "bases":
          "了":
            "meaning": "a particle"
      "这个键盘很好用。":
        "native": "This keyboard is very easy to use."
        "bases":
          "好用":
            "meaning": "easy to use"
  "zh-3352":
    "native": "mouse (for a computer)"
    "notes":
      "n1": "A small device you move to point at things on the screen. 鼠 (shǔ) is a mouse, and 标 (biāo) is a mark."
    "examples":
      "鼠标不动了。":
        "native": "The mouse has stopped moving."
        "bases":
          "动":
            "meaning": "to move"
          "了":
            "meaning": "a particle"
      "请用鼠标点这里。":
        "native": "Please click here with the mouse."
        "bases":
          "用":
            "meaning": "to use"
          "这里":
            "meaning": "here"
  "zh-3353":
    "native": "camera (on a device)"
    "notes":
      "n1": "A small camera on a phone or computer. 摄 (shè) is to film, 像 (xiàng) is an image, and 头 (tóu) is a head."
    "examples":
      "摄像头坏了。":
        "native": "The camera is broken."
        "bases":
          "了":
            "meaning": "a particle"
      "手机有两个摄像头。":
        "native": "The phone has two cameras."
        "bases":
          "有":
            "meaning": "to have"
  "zh-3354":
    "native": "to scan"
    "notes":
      "n1": "To copy a paper into a computer as an image. 扫 (sǎo) is to sweep, and 描 (miáo) is to trace."
    "examples":
      "请扫描这张纸。": "Please scan this paper."
      "扫描文件很快。": "Scanning the file is very quick."
  "zh-3355":
    "native": "to print"
    "notes":
      "n1": "To make a paper copy from a computer. 打 (dǎ) is to make, and 印 (yìn) is to print."
    "examples":
      "请打印这个文件。": "Please print this file."
      "打印机没有纸了。":
        "native": "The printer has run out of paper."
        "bases":
          "没有":
            "meaning": "there is not"
          "了":
            "meaning": "a particle"
  "zh-3356":
    "native": "to connect"
    "notes":
      "n1": "To link two devices or places. 连 (lián) is to join, and 接 (jiē) is to connect."
    "examples":
      "请连接网络。": "Please connect to the network."
      "连接失败了。":
        "native": "The connection failed."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3357":
    "native": "Bluetooth"
    "notes":
      "n1": "A short-range wireless connection. 蓝 (lán) is blue, and 牙 (yá) is a tooth."
    "examples":
      "打开蓝牙。": "Turn on Bluetooth."
      "蓝牙耳机很方便。": "Bluetooth earphones are very convenient."
  "zh-3358":
    "native": "wireless"
    "notes":
      "n1": "Without a cable. 无 (wú) is without, and 线 (xiàn) is a wire."
    "examples":
      "无线网络很快。": "The wireless network is very fast."
      "这个耳机是无线的。":
        "native": "These earphones are wireless."
        "bases":
          "的":
            "meaning": "of"
  "zh-3359":
    "native": "data allowance"
    "notes":
      "n1": "The amount of data you can use. 流 (liú) is to flow, and 量 (liàng) is an amount."
    "examples":
      "我的流量用完了。":
        "native": "I have run out of data."
        "bases":
          "的":
            "meaning": "of"
          "用完":
            "meaning": "to use up"
          "了":
            "meaning": "a particle"
      "这个套餐有很多流量。":
        "native": "This plan has a lot of data."
        "bases":
          "有":
            "meaning": "to have"
  "zh-3360":
    "native": "to lag; to stutter"
    "notes":
      "n1": "To move slowly or in jumps. 卡 (kǎ) is to jam, and 顿 (dùn) is to pause."
    "examples":
      "手机很卡顿。": "The phone is very laggy."
      "视频卡顿了。":
        "native": "The video stuttered."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3361":
    "native": "to freeze; to crash"
    "notes":
      "n1": "For a computer to stop responding. 死 (sǐ) is dead, and 机 (jī) is a machine."
    "examples":
      "电脑死机了。":
        "native": "The computer has frozen."
        "bases":
          "了":
            "meaning": "a particle"
      "又死机了。":
        "native": "It has crashed again."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3362":
    "native": "to restart"
    "notes":
      "n1": "To turn off and on again. 重 (chóng) is again, and 启 (qǐ) is to start."
    "examples":
      "请重启电脑。": "Please restart the computer."
      "重启以后就好了。":
        "native": "It was fine after the restart."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3363":
    "native": "to close; to shut down"
    "notes":
      "n1": "To shut a program or device. 关 (guān) is to close, and 闭 (bì) is shut."
    "examples":
      "请关闭这个程序。": "Please close this program."
      "网站关闭了。":
        "native": "The website has shut down."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3364":
    "native": "to open"
    "notes":
      "n1": "To make a program or device start. 打 (dǎ) is to make, and 开 (kāi) is to open."
    "examples":
      "请打开电脑。": "Please turn on the computer."
      "文件打不开。":
        "native": "The file will not open."
        "bases":
          "打不开":
            "meaning": "cannot open"
  "zh-3365":
    "native": "to set up; to adjust"
    "notes":
      "n1": "To choose how a device works. 设 (shè) is to set, and 置 (zhì) is to place."
    "examples":
      "请设置密码。": "Please set a password."
      "在设置里改一下。":
        "native": "Change it in the settings."
        "bases":
          "改":
            "meaning": "to change"
          "一下":
            "meaning": "a little while"
  "zh-3366":
    "native": "function; feature"
    "notes":
      "n1": "What a device or program can do. 功 (gōng) is effect, and 能 (néng) is ability."
    "examples":
      "这个功能很好用。":
        "native": "This feature is very easy to use."
        "bases":
          "好用":
            "meaning": "easy to use"
      "手机有很多功能。":
        "native": "The phone has many features."
        "bases":
          "有":
            "meaning": "to have"
  "zh-3367":
    "native": "interface; screen layout"
    "notes":
      "n1": "The screen you see and use. 界 (jiè) is a boundary, and 面 (miàn) is a surface."
    "examples":
      "这个界面很清楚。": "This screen layout is very clear."
      "界面变了。":
        "native": "The screen layout has changed."
        "bases":
          "变":
            "meaning": "to change"
          "了":
            "meaning": "a particle"
  "zh-3368":
    "native": "button"
    "notes":
      "n1": "Something you press to make a device work. 按 (àn) is to press, and 钮 (niǔ) is a button."
    "examples":
      "请按这个按钮。": "Please press this button."
      "按钮坏了。":
        "native": "The button is broken."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3369":
    "native": "icon"
    "notes":
      "n1": "A small picture that stands for an app or file. 图 (tú) is a picture, and 标 (biāo) is a mark."
    "examples":
      "点一下这个图标。":
        "native": "Tap this icon once."
        "bases":
          "一下":
            "meaning": "a little while"
      "图标在桌面上。":
        "native": "The icon is on the desktop."
        "bases":
          "桌面":
            "meaning": "desktop"
  "zh-3370":
    "native": "automatic"
    "notes":
      "n1": "Working by itself, without a person. 自 (zì) is self, and 动 (dòng) is to move."
    "examples":
      "自动保存了。":
        "native": "It has been saved automatically."
        "bases":
          "了":
            "meaning": "a particle"
      "这个功能是自动的。":
        "native": "This feature is automatic."
        "bases":
          "的":
            "meaning": "of"
  "zh-3371":
    "native": "smart; intelligent"
    "notes":
      "n1": "Able to think and act by itself. 智 (zhì) is wisdom, and 能 (néng) is ability."
    "examples":
      "这是智能手机。": "This is a smartphone."
      "智能家居很方便。":
        "native": "Smart homes are very convenient."
        "bases":
          "家居":
            "meaning": "home furnishing"
  "zh-3372":
    "native": "code (of a program)"
    "notes":
      "n1": "The written instructions of a program. 代 (dài) is a substitute, and 码 (mǎ) is a code."
    "examples":
      "这段代码有问题。":
        "native": "This piece of code has a problem."
        "bases":
          "段":
            "meaning": "measure word for a passage"
          "有":
            "meaning": "to have"
      "代码很长。": "The code is very long."
  "zh-3373":
    "native": "to program"
    "notes":
      "n1": "To write instructions for a computer. 编 (biān) is to write, and 程 (chéng) is a program."
    "examples":
      "我在学编程。": "I am learning to program."
      "编程很难。": "Programming is hard."
  "zh-3374":
    "native": "to test"
    "notes":
      "n1": "To check that something works. 测 (cè) is to measure, and 试 (shì) is to try."
    "examples":
      "请测试这个程序。": "Please test this program."
      "测试结果很好。":
        "native": "The test result is very good."
        "bases":
          "结果":
            "meaning": "result"
  "zh-3375":
    "native": "document (file)"
    "notes":
      "n1": "A file with text on a computer. 文 (wén) is text, and 档 (dàng) is a file."
    "examples":
      "这个文档很长。": "This document is very long."
      "请保存文档。": "Please save the document."
  "zh-3376":
    "native": "picture; image"
    "notes":
      "n1": "A picture on a screen or paper. 图 (tú) is a picture, and 片 (piàn) is a piece."
    "examples":
      "这张图片很清楚。": "This picture is very clear."
      "图片太大了。":
        "native": "The picture is too big."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3377":
    "native": "to search"
    "notes":
      "n1": "To look for information on a computer. 搜 (sōu) is to search, and 索 (suǒ) is to seek."
    "examples":
      "请搜索这个词。":
        "native": "Please search for this word."
        "bases":
          "词":
            "meaning": "word"
      "网上搜索很快。":
        "native": "Searching online is quick."
        "bases":
          "网上":
            "meaning": "online"
  "zh-3378":
    "native": "to browse"
    "notes":
      "n1": "To look through a website or documents. 浏 (liú) is to skim, and 览 (lǎn) is to view."
    "examples":
      "我在浏览网站。": "I am browsing the website."
      "浏览速度很快。":
        "native": "Browsing is very fast."
        "bases":
          "速度":
            "meaning": "speed"
  "zh-3379":
    "native": "to save"
    "notes":
      "n1": "To keep data so you can use it later. 保 (bǎo) is to keep, and 存 (cún) is to store."
    "examples":
      "请保存文件。": "Please save the file."
      "保存失败了。":
        "native": "Saving failed."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3380":
    "native": "to delete"
    "notes":
      "n1": "To remove data. 删 (shān) is to cut out, and 除 (chú) is to remove."
    "examples":
      "请删除这个文件。": "Please delete this file."
      "照片被删除了。":
        "native": "The photo has been deleted."
        "bases":
          "被":
            "meaning": "a particle for the passive"
          "了":
            "meaning": "a particle"
  "zh-3381":
    "native": "to copy"
    "notes":
      "n1": "To make a copy of text or a file. 复 (fù) is again, and 制 (zhì) is to make."
    "examples":
      "请复制这段话。":
        "native": "Please copy this passage."
        "bases":
          "段":
            "meaning": "measure word for a passage"
          "话":
            "meaning": "words; speech"
      "文件复制好了。":
        "native": "The file has been copied."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3382":
    "native": "to paste"
    "notes":
      "n1": "To put copied text or a file in a new place. 粘 (zhān) is to stick, and 贴 (tiē) is to paste."
    "examples":
      "请粘贴在这里。":
        "native": "Please paste it here."
        "bases":
          "这里":
            "meaning": "here"
      "复制和粘贴很方便。":
        "native": "Copy and paste is very convenient."
        "bases":
          "和":
            "meaning": "and"
  "zh-3383":
    "native": "to enter; to type in"
    "notes":
      "n1": "To put information into a device. 输 (shū) is to transmit, and 入 (rù) is to enter."
    "examples":
      "请输入密码。": "Please enter the password."
      "输入错误了。":
        "native": "The input is wrong."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3384":
    "native": "to show; to display"
    "notes":
      "n1": "To make something visible on a screen. 显 (xiǎn) is to show, and 示 (shì) is to show."
    "examples":
      "屏幕显示了一个图标。":
        "native": "The screen showed an icon."
        "bases":
          "了":
            "meaning": "a particle"
      "显示得很清楚。":
        "native": "It displays very clearly."
        "bases":
          "得":
            "meaning": "a particle: how it is done"
  "zh-3385":
    "native": "to play (media)"
    "notes":
      "n1": "To make a video or music play. 播 (bō) is to broadcast, and 放 (fàng) is to play."
    "examples":
      "请播放视频。": "Please play the video."
      "音乐开始播放了。":
        "native": "The music has started playing."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3386":
    "native": "to pause"
    "notes":
      "n1": "To stop for a short time. 暂 (zàn) is briefly, and 停 (tíng) is to stop."
    "examples":
      "请暂停一下。":
        "native": "Please pause for a moment."
        "bases":
          "一下":
            "meaning": "a little while"
      "视频暂停了。":
        "native": "The video has paused."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3387":
    "native": "power supply; power button"
    "notes":
      "n1": "The source of power for a device. 电 (diàn) is electricity, and 源 (yuán) is a source."
    "examples":
      "请按电源键。": "Please press the power button."
      "电源坏了。":
        "native": "The power supply is broken."
        "bases":
          "了":
            "meaning": "a particle"
