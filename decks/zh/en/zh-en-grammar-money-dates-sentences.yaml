"cards":
  "zh-0752":
    "native": "How much is this?"
    "confusables":
      "w1":
        "why": "几 (jǐ) asks how many, not how much money."
      "w2":
        "why": "贵 (guì) is 'expensive', an answer about the price, not a question about it."
  "zh-0753":
    "native": "A bottle of water is two kuai."
    "confusables":
      "w1":
        "why": "杯 (bēi) counts cups, so it would say a cup of water."
      "w2":
        "why": "双 (shuāng) counts pairs, so it would not fit water."
    "bases":
      "块": { "meaning": "kuài, a yuan: the spoken unit of money" }
  "zh-0754":
    "native": "Altogether, five kuai and five mao."
    "confusables":
      "w1":
        "why": "三 (sān) is three, so it would give a different sum."
      "w2":
        "why": "十一 (shíyī) is eleven, so it would give a different sum."
    "bases":
      "块": { "meaning": "kuài, a yuan: the spoken unit of money" }
      "毛": { "meaning": "máo, a mao: a tenth of a kuai" }
  "zh-0755":
    "native": "Today is the second of February."
    "confusables":
      "w1":
        "why": "年 (nián) is a year, not a day of the month."
      "w2":
        "why": "星期 (xīngqī) is a week or a day of it, not the day of the month."
  "zh-0756":
    "native": "We go to school on Wednesday."
    "confusables":
      "w1":
        "why": "星期天 (xīngqītiān) is Sunday, so it would name the wrong day."
      "w2":
        "why": "今天 (jīntiān) is today, not a day of the week."
  "zh-0757":
    "native": "What time is it now?"
    "confusables":
      "w1":
        "why": "时间 (shíjiān) is 'time' in general, so it would not ask the hour."
      "w2":
        "why": "多少 (duōshao) asks how much or how many, not what hour."
  "zh-0758":
    "native": "I eat at half past seven."
    "confusables":
      "w1":
        "why": "分 (fēn) counts minutes, so it would not give the hour."
      "w2":
        "why": "小时 (xiǎoshí) is an hour as a length of time, not a clock time."
  "zh-0759":
    "native": "He goes to bed at half past eleven."
    "confusables":
      "w1":
        "why": "上午 (shàngwǔ) is the morning, a part of the day, not an hour."
      "w2":
        "why": "下午 (xiàwǔ) is the afternoon, so it would give the wrong part of the day."
