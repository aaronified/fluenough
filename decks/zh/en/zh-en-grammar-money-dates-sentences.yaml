"name": "Money, dates and times in sentences"
"description": "Sentences with the money, dates and times of this unit: how much, a bottle of water at two kuai, five kuai and five mao, the second of February, Wednesday, the time, and half past seven and eleven. Not yet checked by a Mandarin speaker: please report any mistake."
