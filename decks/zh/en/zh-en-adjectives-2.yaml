"id": "zh-en-adjectives-2"
"kind": "layer"
"core": "zh-adjectives-2"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "More adjectives"
"description": "Fifty adjectives for describing things and people: size and shape, the feel of things, how people behave and feel, and how easy or hard something is. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-2620":
    "native": "wide; broad"
    "notes":
      "n1": "Having a large distance from side to side. 宽 (kuān) is wide."
    "examples":
      "这个房间很宽。": "This room is very wide."
      "路很宽。": "The road is wide."
  "zh-2621":
    "native": "narrow"
    "notes":
      "n1": "Having a small distance from side to side. 窄 (zhǎi) is narrow."
    "examples":
      "这条路很窄。":
        "native": "This road is very narrow."
        "bases":
          "条":
            "meaning": "measure word for long things"
      "门太窄了。":
        "native": "The door is too narrow."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2622":
    "native": "thick"
    "notes":
      "n1": "Having a large distance from top to bottom. 厚 (hòu) is thick."
    "examples":
      "这本书很厚。": "This book is very thick."
      "墙很厚。": "The wall is thick."
  "zh-2623":
    "native": "thin"
    "notes":
      "n1": "Having a small distance from top to bottom. 薄 (báo) is thin."
    "examples":
      "这张纸很薄。": "This paper is very thin."
      "衣服太薄了。":
        "native": "The clothes are too thin."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2624":
    "native": "shallow; light (of colour)"
    "notes":
      "n1": "Not deep, or a pale colour. 浅 (qiǎn) is shallow."
    "examples":
      "这个池塘很浅。": "This pond is very shallow."
      "我喜欢浅蓝色。": "I like light blue."
  "zh-2625":
    "native": "dark"
    "notes":
      "n1": "Not bright. 暗 (àn) is dark."
    "examples":
      "房间里很暗。": "It is very dark in the room."
      "天暗了。":
        "native": "The sky has gone dark."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2626":
    "native": "soft"
    "notes":
      "n1": "Not hard when pressed. 软 (ruǎn) is soft."
    "examples":
      "床很软。": "The bed is very soft."
      "这个面包很软。": "This bread is very soft."
  "zh-2627":
    "native": "slippery"
    "notes":
      "n1": "Smooth and difficult to hold or stand on. 滑 (huá) is slippery."
    "examples":
      "地板很滑。": "The floor is slippery."
      "小心，路很滑。": "Careful, the road is slippery."
  "zh-2628":
    "native": "bent; curved"
    "notes":
      "n1": "Not straight. 弯 (wān) is bent."
    "examples":
      "这条路很弯。":
        "native": "This road is very winding."
        "bases":
          "条":
            "meaning": "measure word for long things"
      "他的腿弯了。":
        "native": "His leg is bent."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2629":
    "native": "flat; level"
    "notes":
      "n1": "Smooth and without bumps. 平 (píng) is flat."
    "examples":
      "桌子很平。": "The table is very flat."
      "地面很平。":
        "native": "The ground is very level."
        "bases":
          "地面":
            "meaning": "ground"
  "zh-2630":
    "native": "round"
    "notes":
      "n1": "Shaped like a circle. 圆 (yuán) is round."
    "examples":
      "月亮很圆。": "The moon is very round."
      "这个桌子是圆的。":
        "native": "This table is round."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2631":
    "native": "pointed; sharp"
    "notes":
      "n1": "Having a sharp end. 尖 (jiān) is pointed."
    "examples":
      "这支笔很尖。":
        "native": "This pencil is very sharp."
        "bases":
          "支":
            "meaning": "measure word for pens"
      "山很尖。": "The mountain is very pointed."
  "zh-2632":
    "native": "heavy"
    "notes":
      "n1": "Having a lot of weight. 重 (zhòng) is heavy."
    "examples":
      "这个箱子很重。": "This suitcase is very heavy."
      "书包太重了。":
        "native": "The school bag is too heavy."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2633":
    "native": "light (not heavy)"
    "notes":
      "n1": "Having little weight. 轻 (qīng) is light."
    "examples":
      "这个包很轻。": "This bag is very light."
      "他的声音很轻。":
        "native": "His voice is very soft."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2634":
    "native": "weak; light (of taste)"
    "notes":
      "n1": "Not strong in taste or colour. 淡 (dàn) is weak or light."
    "examples":
      "这个汤很淡。": "This soup is very weak."
      "天空是淡蓝色的。":
        "native": "The sky is a pale blue."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2635":
    "native": "smelly; bad-smelling"
    "notes":
      "n1": "Having a bad smell. 臭 (chòu) is smelly."
    "examples":
      "这个垃圾很臭。": "This rubbish smells very bad."
      "房间里很臭。": "The room smells very bad."
  "zh-2636":
    "native": "sleepy"
    "notes":
      "n1": "Wanting to sleep. 困 (kùn) is sleepy."
    "examples":
      "我很困。": "I am very sleepy."
      "他一直很困。": "He has been sleepy all the time."
  "zh-2637":
    "native": "calm; calm-headed"
    "notes":
      "n1": "Calm and not upset. 冷 (lěng) is cold, and 静 (jìng) is quiet."
    "examples":
      "请冷静。": "Please stay calm."
      "他很冷静。": "He is very calm."
  "zh-2638":
    "native": "nervous; tense"
    "notes":
      "n1": "Worried and not relaxed. 紧 (jǐn) is tight, and 张 (zhāng) is to stretch."
    "examples":
      "我很紧张。": "I am very nervous."
      "考试前大家都紧张。": "Everyone is nervous before the exam."
  "zh-2639":
    "native": "relaxed; easy"
    "notes":
      "n1": "Not tense, or not hard. 轻 (qīng) is light, and 松 (sōng) is loose."
    "examples":
      "工作很轻松。": "The work is easy."
      "我心情很轻松。":
        "native": "I feel very relaxed."
        "bases":
          "心情":
            "meaning": "mood"
  "zh-2640":
    "native": "complicated"
    "notes":
      "n1": "Having many parts and hard to understand. 复 (fù) is double, and 杂 (zá) is mixed."
    "examples":
      "这个问题很复杂。": "This problem is very complicated."
      "规则很复杂。":
        "native": "The rules are very complicated."
        "bases":
          "规则":
            "meaning": "rule"
  "zh-2641":
    "native": "simple; easy"
    "notes":
      "n1": "Not hard, or with few parts. 简 (jiǎn) is simple, and 单 (dān) is single."
    "examples":
      "这个问题很简单。": "This problem is very simple."
      "菜很简单。": "The dish is very simple."
  "zh-2642":
    "native": "stupid; clumsy"
    "notes":
      "n1": "Not clever or not skilful. 笨 (bèn) is clumsy."
    "examples":
      "我很笨。": "I am not very clever."
      "他做事很笨。":
        "native": "He is clumsy at doing things."
        "bases":
          "做事":
            "meaning": "to do things; work"
  "zh-2643":
    "native": "lazy"
    "notes":
      "n1": "Not wanting to work or move. 懒 (lǎn) is lazy."
    "examples":
      "他很懒。": "He is very lazy."
      "周末我很懒。": "I am very lazy at the weekend."
  "zh-2644":
    "native": "hard-working; diligent"
    "notes":
      "n1": "Willing to work hard. 勤 (qín) is diligent, and 快 (kuai) is quick."
    "examples":
      "她很勤快。": "She is very hard-working."
      "他每天都很勤快。":
        "native": "He works hard every day."
        "bases":
          "每天":
            "meaning": "every day"
  "zh-2645":
    "native": "honest"
    "notes":
      "n1": "Telling the truth. 诚 (chéng) is sincere, and 实 (shí) is true."
    "examples":
      "他很诚实。": "He is very honest."
      "诚实很重要。": "Honesty is very important."
  "zh-2646":
    "native": "warm; friendly"
    "notes":
      "n1": "Friendly and kind to people. 热 (rè) is warm, and 情 (qíng) is feeling."
    "examples":
      "老板很热情。": "The boss is very friendly."
      "大家都很热情。": "Everyone is very warm."
  "zh-2647":
    "native": "cold; distant"
    "notes":
      "n1": "Not friendly or not interested. 冷 (lěng) is cold, and 淡 (dàn) is weak."
    "examples":
      "他的态度很冷淡。":
        "native": "His attitude is very cold."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "态度":
            "meaning": "attitude"
      "她对我很冷淡。": "She is distant with me."
  "zh-2648":
    "native": "generous; natural"
    "notes":
      "n1": "Generous, or easy and natural in manner. 大 (dà) is big, and 方 (fāng) is a side."
    "examples":
      "他很大方。": "He is very generous."
      "她的样子很大方。":
        "native": "She looks very natural."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2649":
    "native": "mean; stingy"
    "notes":
      "n1": "Not generous with money. 小 (xiǎo) is small, and 气 (qì) is spirit."
    "examples":
      "他很小气。": "He is very stingy."
      "不要这么小气。":
        "native": "Do not be so mean."
        "bases":
          "不要":
            "meaning": "do not"
          "这么":
            "meaning": "so"
  "zh-2650":
    "native": "strict"
    "notes":
      "n1": "Following rules closely. 严 (yán) is strict, and 格 (gé) is a rule."
    "examples":
      "老师很严格。": "The teacher is very strict."
      "规定很严格。":
        "native": "The rules are very strict."
        "bases":
          "规定":
            "meaning": "rule; regulation"
  "zh-2651":
    "native": "gentle; tender"
    "notes":
      "n1": "Soft and kind in manner. 温 (wēn) is warm, and 柔 (róu) is soft."
    "examples":
      "她的声音很温柔。":
        "native": "Her voice is very gentle."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "妈妈很温柔。": "Mum is very gentle."
  "zh-2652":
    "native": "careless"
    "notes":
      "n1": "Not paying attention to detail. 粗 (cū) is rough, and 心 (xīn) is heart."
    "examples":
      "我太粗心了。":
        "native": "I was too careless."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "他做事很粗心。":
        "native": "He is careless in his work."
        "bases":
          "事":
            "meaning": "matter; affair"
  "zh-2653":
    "native": "careless; sloppy"
    "notes":
      "n1": "Not careful enough. 马 (mǎ) is horse, and 虎 (hǔ) is tiger."
    "examples":
      "做事不要马虎。":
        "native": "Do not be sloppy in your work."
        "bases":
          "事":
            "meaning": "matter; affair"
          "不要":
            "meaning": "do not"
      "他的字很马虎。":
        "native": "His handwriting is very sloppy."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2654":
    "native": "strange; odd"
    "notes":
      "n1": "Not usual, and surprising. 奇 (qí) is odd, and 怪 (guài) is strange."
    "examples":
      "这个声音很奇怪。": "This sound is very strange."
      "他的样子很奇怪。":
        "native": "He looks very odd."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2655":
    "native": "normal"
    "notes":
      "n1": "As usual; not unusual. 正 (zhèng) is right, and 常 (cháng) is usual."
    "examples":
      "一切都很正常。":
        "native": "Everything is normal."
        "bases":
          "一切":
            "meaning": "everything"
      "这是正常的。":
        "native": "This is normal."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2656":
    "native": "ordinary; common"
    "notes":
      "n1": "Not special or unusual. 普 (pǔ) is general, and 通 (tōng) is common."
    "examples":
      "这是一个普通的房间。":
        "native": "This is an ordinary room."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "普通话很好学。":
        "native": "Standard Mandarin is easy to learn."
        "bases":
          "普通话":
            "meaning": "Standard Mandarin"
  "zh-2657":
    "native": "necessary"
    "notes":
      "n1": "Needed. 必 (bì) is must, and 要 (yào) is need."
    "examples":
      "这个很必要。": "This is very necessary."
      "没有必要去。":
        "native": "There is no need to go."
        "bases":
          "没有":
            "meaning": "there is not"
  "zh-2658":
    "native": "messy; untidy"
    "notes":
      "n1": "Not in order. 乱 (luàn) is messy."
    "examples":
      "房间很乱。": "The room is very messy."
      "桌子上很乱。": "The table is very messy."
  "zh-2659":
    "native": "sad; heartbroken"
    "notes":
      "n1": "Feeling very sad. 伤 (shāng) is hurt, and 心 (xīn) is heart."
    "examples":
      "她很伤心。": "She is very sad."
      "别伤心了。":
        "native": "Do not be sad."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2660":
    "native": "relieved; at ease"
    "notes":
      "n1": "Not worried. 放 (fàng) is to put down, and 心 (xīn) is heart."
    "examples":
      "你放心吧。": "Do not worry."
      "我很放心。": "I feel relieved."
  "zh-2661":
    "native": "famous"
    "notes":
      "n1": "Known to many people. 著 (zhù) is famous, and 名 (míng) is a name."
    "examples":
      "这是一个著名的城市。":
        "native": "This is a famous city."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "他是著名的老师。":
        "native": "He is a famous teacher."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2662":
    "native": "clear"
    "notes":
      "n1": "Easy to see or understand. 清 (qīng) is clear, and 楚 (chǔ) is clear."
    "examples":
      "这个字很清楚。": "This character is very clear."
      "我听得很清楚。":
        "native": "I can hear it very clearly."
        "bases":
          "得":
            "meaning": "a particle: how it is done"
  "zh-2663":
    "native": "blurry; unclear"
    "notes":
      "n1": "Not clear. 模 (mó) is a model, and 糊 (hú) is sticky."
    "examples":
      "照片很模糊。": "The photo is very blurry."
      "我的记忆很模糊。":
        "native": "My memory is very vague."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "记忆":
            "meaning": "memory"
  "zh-2664":
    "native": "kind; warm"
    "notes":
      "n1": "Friendly and warm. 亲 (qīn) is close, and 切 (qiē) is intimate."
    "examples":
      "老人很亲切。":
        "native": "The old man is very kind."
        "bases":
          "老人":
            "meaning": "old person"
      "他的笑容很亲切。":
        "native": "His smile is very warm."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2665":
    "native": "cool"
    "notes":
      "n1": "Not hot, but not cold. 凉 (liáng) is cool."
    "examples":
      "水很凉。": "The water is cool."
      "天凉了。":
        "native": "It has become cool."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2666":
    "native": "bad; broken"
    "notes":
      "n1": "Not good, or not working. 坏 (huài) is bad."
    "examples":
      "电脑坏了。":
        "native": "The computer is broken."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "天气很坏。": "The weather is bad."
  "zh-2667":
    "native": "fake; false"
    "notes":
      "n1": "Not real. 假 (jiǎ) is false."
    "examples":
      "这是假的。":
        "native": "This is fake."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "这个消息是假的。":
        "native": "This news is false."
        "bases":
          "消息":
            "meaning": "news; message"
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2668":
    "native": "yellow"
    "notes":
      "n1": "The colour of a lemon or the sun. 黄 (huáng) is yellow."
    "examples":
      "这件衣服是黄的。":
        "native": "This piece of clothing is yellow."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "黄花很漂亮。": "The yellow flowers are very pretty."
  "zh-2669":
    "native": "lucky"
    "notes":
      "n1": "Having good luck. 幸 (xìng) is fortunate, and 运 (yùn) is luck."
    "examples":
      "我很幸运。": "I am very lucky."
      "他的工作很幸运。":
        "native": "His work has been very lucky."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
