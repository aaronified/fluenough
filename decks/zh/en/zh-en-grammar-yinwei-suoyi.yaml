"name": "因为 (yīnwèi) ... 所以 (suǒyǐ): because ... so"
"license": "CC-BY-SA-4.0"
"description": "The reason and the result: 因为 (yīnwèi) says why, and 所以 (suǒyǐ) says what follows. Not yet checked by a Mandarin speaker: please report any mistake."
"tags":
- "unreviewed"
"pattern":
  "name": "因为 (yīnwèi) ... 所以 (suǒyǐ): because ... so"
  "slot_name": "form"
  "prompt": "{lemma} ({gloss}), {slot}"
  "slots":
    "plain": "a plain statement"
    "because": "the reason, with 因为 (yīnwèi)"
    "so": "the reason and the result, with 因为 (yīnwèi) ... 所以 (suǒyǐ)"
  "entries":
    "lei": "tired"
    "e": "hungry"
    "leng": "cold"
    "mang": "busy"
    "xiayu": "to rain"
    "gaoxing": "happy"
  "notes": "因为 (yīnwèi) starts the reason and 所以 (suǒyǐ) starts the result, with a comma between: 因为我很累 (yīnwèi wǒ hěn lèi)，所以我睡觉 (suǒyǐ wǒ shuìjiào), because I am tired, I sleep. You may use one of the two without the other, but not both together with 但是 (dànshì). 所以 (suǒyǐ) is said with a third tone."
