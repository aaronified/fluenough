"cards":
  "zh-2544":
    "confusables":
      "w1":
        "why": "护照 (hùzhào) is the passport itself, not the visa."
      "w2":
        "why": "入境 (rùjìng) is to enter, which needs the visa."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
      "有":
        "meaning": "to have; there is"
      "效":
        "meaning": "effect; valid"
    "native": "Is my visa still valid?"
  "zh-2545":
    "confusables":
      "w1":
        "why": "降落 (jiàngluò) is to land, the opposite."
      "w2":
        "why": "登机 (dēngjī) is to board, before the take-off."
    "native": "The plane takes off at nine."
  "zh-2546":
    "confusables":
      "w1":
        "why": "海关 (hǎiguān) is customs, not a door."
      "w2":
        "why": "路 (lù) is a road, not a door."
    "bases":
      "从":
        "meaning": "from"
      "进去":
        "meaning": "to go in"
      "出来":
        "meaning": "to come out"
    "native": "Please go in through the entrance and come out through the exit."
  "zh-2547":
    "confusables":
      "w1":
        "why": "票价 (piàojià) is a fare, for transport."
      "w2":
        "why": "导游 (dǎoyóu) is a guide, a person."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "The entry ticket to this sight is very expensive."
  "zh-2548":
    "confusables":
      "w1":
        "why": "退票 (tuìpiào) is to refund, which is different."
      "w2":
        "why": "取消 (qǔxiāo) is to cancel, the end of the booking."
    "bases":
      "到":
        "meaning": "to arrive"
    "native": "I want to change my ticket to tomorrow."
  "zh-2549":
    "confusables":
      "w1":
        "why": "旅馆 (lǚguǎn) is an inn, a simpler place."
      "w2":
        "why": "海滩 (hǎitān) is the beach, not a place to stay."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "We stay at a guesthouse by the sea."
  "zh-2550":
    "confusables":
      "w1":
        "why": "左 (zuǒ) is left, the opposite direction."
      "w2":
        "why": "问路 (wènlù) is to ask the way, not to follow a map."
    "bases":
      "往":
        "meaning": "towards"
    "native": "The satnav says to turn right."
  "zh-2551":
    "confusables":
      "w1":
        "why": "山谷 (shāngǔ) is a valley, one kind of scenery."
      "w2":
        "why": "瀑布 (pùbù) is a waterfall, one kind of scenery."
    "bases":
      "这里":
        "meaning": "here"
      "的":
        "meaning": "a particle: of; belonging to"
      "美":
        "meaning": "beautiful"
    "native": "The scenery here is beautiful."
