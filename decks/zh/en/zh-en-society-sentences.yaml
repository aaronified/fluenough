  "name": "English"
"name": "Society in sentences"
"description": "Eight sentences about society: community, ageing, migration, charity and the gaps between groups. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "zh-4571":
    "native": "We should respect different ethnic groups and religions."
    "confusables":
      "w1":
        "why": "包容 (bāoróng) is accepting people who are different, which the sentence asks for; 尊重 (zūnzhòng) is respect, which it also asks for."
      "w2":
        "why": "宽容 (kuānróng) is forgiving someone's fault, not accepting a whole group of people."
    "bases":
      "不同":
        "meaning": "different"
      "的":
        "meaning": "particle"
      "和":
        "meaning": "and"
  "zh-4572":
    "native": "The gap between town and countryside needs the government to narrow it."
    "confusables":
      "w1":
        "why": "差异 (chāyì) is a difference in general; 差距 (chājù) in this sentence is a gap in level, so 差异 (chāyì) is close but broader."
      "w2":
        "why": "区别 (qūbié) is a distinction that sets two things apart, not a gap in income or services."
    "bases":
      "之间":
        "meaning": "between"
      "的":
        "meaning": "particle"
      "差距":
        "meaning": "gap"
  "zh-4573":
    "native": "Ageing makes the pressure on old-age care and medical care greater and greater."
    "confusables":
      "w1":
        "why": "老人 (lǎorén) is one old person; 老龄化 (lǎolínghuà) describes the whole population growing older."
      "w2":
        "why": "青年 (qīngnián) is young people, the other end of the age balance that ageing shifts."
    "bases":
      "让":
        "meaning": "to make"
      "和":
        "meaning": "and"
      "的":
        "meaning": "particle"
      "越来越":
        "meaning": "more and more"
  "zh-4574":
    "native": "In this community, residents can join in various activities."
    "confusables":
      "w1":
        "why": "参与 (cānyù) is the more formal word for taking part, with a real say in the outcome; 参加 (cānjiā) is simply joining."
      "w2":
        "why": "组织 (zǔzhī) is to organise or an organisation; in the sentence the residents join in, they do not run the event."
    "bases":
      "这个":
        "meaning": "this"
      "可以":
        "meaning": "can"
      "各种":
        "meaning": "various"
      "活动":
        "meaning": "activity"
  "zh-4575":
    "native": "Many migrant farm workers come to the city to work and look for chances."
    "confusables":
      "w1":
        "why": "移民 (yímín) is someone who moves to live elsewhere, usually by choice; a farm worker moves for work."
      "w2":
        "why": "难民 (nànmín) is someone who flees danger, which is not the reason in this sentence."
    "bases":
      "很多":
        "meaning": "many"
      "农民工":
        "meaning": "migrant farm worker"
      "打工":
        "meaning": "to work for wages"
      "寻找":
        "meaning": "to look for"
  "zh-4576":
    "native": "Public-good work and charity both help poor people."
    "confusables":
      "w1":
        "why": "公共 (gōnggòng) is public, shared by everyone; it is an adjective for places and services, not a kind of help."
      "w2":
        "why": "贫穷 (pínqióng) means poor too, but it names the state of having little; the sentence is about giving help to the poor."
    "bases":
      "和":
        "meaning": "and"
      "了":
        "meaning": "particle"
      "的":
        "meaning": "particle"
  "zh-4577":
    "native": "Children in the countryside should also have the chance of an education."
    "confusables":
      "w1":
        "why": "儿童 (értóng) is the formal word for children, used in policy; the sentence says 孩子 (háizi), the everyday word."
      "w2":
        "why": "青年 (qīngnián) is young people, usually older than the children in this sentence."
    "bases":
      "的":
        "meaning": "particle"
      "有":
        "meaning": "have"
      "受":
        "meaning": "to receive"
  "zh-4578":
    "native": "The data show that the proportion of older people is falling."
    "confusables":
      "w1":
        "why": "增长 (zēngzhǎng) is growth, the opposite of 下降 (xiàjiàng), which is what the sentence says the figure is doing."
      "w2":
        "why": "统计 (tǒngjì) is the counting and tabulating of figures; it is how the data were made, not what they show."
    "bases":
      "老年人":
        "meaning": "elderly people"
      "的":
        "meaning": "particle"
