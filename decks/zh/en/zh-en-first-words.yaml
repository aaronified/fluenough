schema: 1
id: "zh-en-first-words"
kind: "layer"
core: "zh-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "Twelve short words that make most first sentences: the pronouns, the verb 是 (shì), the questions 吗 (ma), 什么 (shénme), 哪里 (nǎlǐ) and 多少 (duōshao), and the words 好 (hǎo), 很 (hěn) and 人 (rén)."
cards:
  "zh-0019":
    native: "I; me"
    notes:
      "n1": "我 (wǒ) is the same for 'I' and 'me'. Chinese does not change a pronoun for its role in the sentence."
    examples:
      "我是学生。": "I am a student."
      "我不懂。": "I don't understand."
  "zh-0020":
    native: "you"
    notes:
      "n1": "你 (nǐ) is 'you' to one person you know well or to a peer. For an elder or a stranger, 您 (nín) is more polite (see the phrasebook)."
    examples:
      "你好吗？": "How are you?"
      "你叫什么名字？": "What is your name?"
  "zh-0021":
    native: "he; him"
    notes:
      "n1": "他 (tā) is 'he' or 'him'. It sounds the same for a man or a woman; in writing, 她 (tā) is used for 'she'."
    examples:
      "他是老师。": "He is a teacher."
      "他很好。": "He is well."
  "zh-0022":
    native: "to be (is, are, am)"
    alt_native: ["am", "are", "is"]
    notes:
      "n1": "是 (shì) links two things: 'this is a book'. It does not change for the person. It is left out before adjectives, as in 天气很好 (tiānqì hěn hǎo), the weather is good."
    examples:
      "我是学生。": "I am a student."
      "这是书。": "This is a book."
  "zh-0023":
    native: "not; no"
    notes:
      "n1": "不 (bù) goes before the verb or adjective. Its tone changes to a second tone before a fourth tone: 不是 (bú shì), 不对 (bú duì)."
    examples:
      "今天不冷。": "It is not cold today."
      "我不懂。": "I don't understand."
  "zh-0024":
    native: "good; well; OK"
    alt_native: ["fine"]
    notes:
      "n1": "好 (hǎo) is 'good' and 'well'. 好的 (hǎo de) is an easy way to say 'OK'."
    examples:
      "天气很好。": "The weather is good."
      "好的。": "OK."
  "zh-0025":
    native: "question particle (turns a statement into a question)"
    notes:
      "n1": "吗 (ma) goes at the end of a statement to make it a yes-or-no question. Its tone is neutral."
    examples:
      "你好吗？": "How are you?"
      "你是学生吗？": "Are you a student?"
  "zh-0026":
    native: "what"
    notes:
      "n1": "什么 (shénme) is 'what'. It stands where the English word would, and is not moved to the front of the sentence."
    examples:
      "你叫什么名字？": "What is your name?"
      "这是什么？": "What is this?"
  "zh-0027":
    native: "where"
    notes:
      "n1": "哪里 (nǎlǐ) is 'where'. Written 哪裡 (nǎlǐ) in traditional characters, the form used in Taiwan."
    examples:
      "厕所在哪里？": "Where is the toilet?"
      "你是哪里人？": "Where are you from?"
  "zh-0028":
    native: "how many; how much"
    notes:
      "n1": "多少 (duōshao) asks for an amount, usually when the number is not small. For a small number, 几 (jǐ) is used: 几个人 (jǐ ge rén), how many people."
    examples:
      "多少钱？": "How much is it?"
      "你有多少书？": "How many books do you have?"
  "zh-0029":
    native: "person; people"
    notes:
      "n1": "人 (rén) is 'person' and 'people'. 中国人 (Zhōngguórén) is a Chinese person."
    examples:
      "中国人。": "Chinese person."
      "很多人。": "Many people."
  "zh-0030":
    native: "very"
    notes:
      "n1": "很 (hěn) is 'very', but in a sentence about a state it is often only a link before an adjective: 我很忙 (wǒ hěn máng), I am busy."
    examples:
      "我很忙。": "I am busy."
      "很好。": "Very good."
