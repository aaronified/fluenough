"schema": 1
"id": "zh-en-phone"
"kind": "layer"
"core": "zh-phone"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Phone"
"description": "Thirty-five words for using a phone: calling and answering, numbers and messages, the battery and the screen, and the apps. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-2440":
    "native": "mobile phone"
    "notes":
      "n1": "A phone you carry. 手 (shǒu) is hand, and 机 (jī) is a machine."
    "examples":
      "我的手机没电了。":
        "native": "My phone has run out of battery."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "没":
            "meaning": "not; did not"
          "电":
            "meaning": "electricity; power"
          "了":
            "meaning": "a particle: a change has happened"
      "请把手机放好。":
        "native": "Please put your phone away."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
  "zh-2441":
    "native": "to make (a call); to hit"
    "notes":
      "n1": "Used with 电话 (diànhuà) to make a call. 打 (dǎ) is also to hit or to play."
    "examples":
      "我打电话给妈妈。":
        "native": "I call Mum."
        "bases":
          "给":
            "meaning": "to give; for"
      "你明天打给我。":
        "native": "Call me tomorrow."
        "bases":
          "给":
            "meaning": "to give; for"
  "zh-2442":
    "native": "to answer (a call); to receive"
    "notes":
      "n1": "To pick up a call. 接 (jiē) is to take or to receive."
    "examples":
      "请接电话。": "Please answer the phone."
      "他没接我的电话。":
        "native": "He did not answer my call."
        "bases":
          "没":
            "meaning": "not; did not"
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2443":
    "native": "to hang up (a call); to hang"
    "notes":
      "n1": "To end a call. 挂 (guà) is to hang something up."
    "examples":
      "我挂了电话。":
        "native": "I hung up the phone."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "请别挂电话。": "Please do not hang up."
  "zh-2444":
    "native": "to send"
    "notes":
      "n1": "To send a message or a file. 发 (fā) is to send out."
    "examples":
      "我发了一条短信。":
        "native": "I sent a text message."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "条":
            "meaning": "measure word for messages and long thin things"
      "请把照片发给我。":
        "native": "Please send me the photo."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
          "给":
            "meaning": "to give; for"
  "zh-2445":
    "native": "text message"
    "notes":
      "n1": "A message sent from one phone to another. 短 (duǎn) is short, and 信 (xìn) is a letter."
    "examples":
      "我收到一条短信。":
        "native": "I received a text message."
        "bases":
          "条":
            "meaning": "measure word for messages and long thin things"
      "短信里有地址。":
        "native": "The message has the address in it."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-2446":
    "native": "WeChat (a messaging app)"
    "notes":
      "n1": "A messaging app used across China. 微 (wēi) is small, and 信 (xìn) is a message."
    "examples":
      "我们用微信联系。":
        "native": "We keep in touch on WeChat."
        "bases":
          "用":
            "meaning": "to use"
      "你有微信吗？":
        "native": "Do you have WeChat?"
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-2447":
    "native": "message left for someone"
    "notes":
      "n1": "A note or message left for another person. 留 (liú) is to leave, and 言 (yán) is words."
    "examples":
      "请留言。": "Please leave a message."
      "他给我留言了。":
        "native": "He left me a message."
        "bases":
          "给":
            "meaning": "to give; for"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2448":
    "native": "to receive"
    "notes":
      "n1": "To get something that was sent. 收 (shōu) is to receive, and 到 (dào) is to arrive."
    "examples":
      "我收到你的短信了。":
        "native": "I got your text message."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "了":
            "meaning": "a particle: a change has happened"
      "收到了。":
        "native": "Got it."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2449":
    "native": "to charge (a battery)"
    "notes":
      "n1": "To put power back into a battery. 充 (chōng) is to fill, and 电 (diàn) is power."
    "examples":
      "手机要充电了。":
        "native": "The phone needs charging."
        "bases":
          "要":
            "meaning": "must; to want"
          "了":
            "meaning": "a particle: a change has happened"
      "我在充电。": "I am charging it."
  "zh-2450":
    "native": "screen"
    "notes":
      "n1": "The part of a phone or computer that shows pictures. 屏 (píng) is a screen, and 幕 (mù) is a curtain."
    "examples":
      "屏幕太小了。":
        "native": "The screen is too small."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "请看屏幕。": "Please look at the screen."
  "zh-2451":
    "native": "password"
    "notes":
      "n1": "The secret code that opens a phone or an account. 密 (mì) is secret, and 码 (mǎ) is a code."
    "examples":
      "我忘了密码。":
        "native": "I have forgotten the password."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "请输入密码。":
        "native": "Please enter the password."
        "bases":
          "输入":
            "meaning": "to enter (data)"
  "zh-2452":
    "native": "app; application"
    "notes":
      "n1": "A program on a phone. 应 (yìng) is to respond, and 用 (yòng) is to use."
    "examples":
      "这个应用很方便。": "This app is very handy."
      "我删除了一个应用。":
        "native": "I deleted an app."
        "bases":
          "删除":
            "meaning": "to delete"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2453":
    "native": "to download"
    "notes":
      "n1": "To copy a file or app from the internet to a phone. 下 (xià) is down, and 载 (zài) is to carry."
    "examples":
      "我下载了一个应用。":
        "native": "I downloaded an app."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "这个文件可以下载吗？":
        "native": "Can this file be downloaded?"
        "bases":
          "可以":
            "meaning": "can; may"
  "zh-2454":
    "native": "to install"
    "notes":
      "n1": "To set up a program on a device. 安 (ān) is safe or settled, and 装 (zhuāng) is to fit."
    "examples":
      "请安装这个应用。": "Please install this app."
      "安装好了吗？":
        "native": "Has it been installed?"
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2455":
    "native": "signal; reception"
    "notes":
      "n1": "The strength of the phone connection. 信 (xìn) is a message, and 号 (hào) is a sign."
    "examples":
      "这里没有信号。":
        "native": "There is no signal here."
        "bases":
          "这里":
            "meaning": "here"
          "没有":
            "meaning": "there is not"
      "信号很好。": "The signal is very good."
  "zh-2456":
    "native": "network; the internet"
    "notes":
      "n1": "The connection that lets devices talk to each other. 网 (wǎng) is a net, and 络 (luò) is a network."
    "examples":
      "网络很慢。": "The network is very slow."
      "我家的网络很好。":
        "native": "My home network is very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2457":
    "native": "to go online"
    "notes":
      "n1": "To use the internet. 上 (shàng) is on, and 网 (wǎng) is the net."
    "examples":
      "我在上网。": "I am online."
      "你可以在这里上网吗？":
        "native": "Can you go online here?"
        "bases":
          "可以":
            "meaning": "can; may"
          "这里":
            "meaning": "here"
  "zh-2458":
    "native": "call (a conversation on the phone)"
    "notes":
      "n1": "A phone conversation. 通 (tōng) is to connect, and 话 (huà) is speech."
    "examples":
      "通话结束了。":
        "native": "The call has ended."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "我们的通话很短。":
        "native": "Our call was very short."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2459":
    "native": "to switch off"
    "notes":
      "n1": "To turn a phone or computer off. 关 (guān) is to close, and 机 (jī) is a machine."
    "examples":
      "请关机。": "Please switch it off."
      "手机关机了。":
        "native": "The phone is switched off."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2460":
    "native": "to switch on"
    "notes":
      "n1": "To turn a phone or computer on. 开 (kāi) is to open, and 机 (jī) is a machine."
    "examples":
      "我开机了。":
        "native": "I have switched it on."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "电脑开机很慢。": "The computer starts slowly."
  "zh-2461":
    "native": "the line is busy"
    "notes":
      "n1": "The sign that the number you called is engaged. 忙 (máng) is busy, and 线 (xiàn) is a line."
    "examples":
      "电话是忙线。": "The line is busy."
      "他的电话一直忙线。":
        "native": "His line has been busy all the time."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-2462":
    "native": "to press"
    "notes":
      "n1": "To push a button. 按 (àn) is to press down."
    "examples":
      "请按这个键。": "Please press this key."
      "按一下电源。":
        "native": "Press the power button once."
        "bases":
          "一下":
            "meaning": "a little while; once"
          "电源":
            "meaning": "power (supply)"
  "zh-2463":
    "native": "key (on a keyboard or phone)"
    "notes":
      "n1": "A button you press. 键 (jiàn) is a key."
    "examples":
      "这个键坏了。":
        "native": "This key is broken."
        "bases":
          "坏":
            "meaning": "broken"
          "了":
            "meaning": "a particle: a change has happened"
      "按回车键。":
        "native": "Press the enter key."
        "bases":
          "回车":
            "meaning": "enter (on a keyboard)"
  "zh-2464":
    "native": "to dial"
    "notes":
      "n1": "To press the numbers of a phone. 拨 (bō) is to dial or to move with the fingers."
    "examples":
      "请拨这个号码。": "Please dial this number."
      "我拨错了号码。":
        "native": "I dialled the wrong number."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2465":
    "native": "to charge a fee"
    "notes":
      "n1": "To ask for money for a service. 收 (shōu) is to collect, and 费 (fèi) is a fee."
    "examples":
      "打电话收费吗？": "Is there a charge for calling?"
      "这个应用不收费。": "This app is free of charge."
  "zh-2466":
    "native": "cost; fee"
    "notes":
      "n1": "The money to pay for something. 费 (fèi) is a fee, and 用 (yòng) is use."
    "examples":
      "费用是多少？": "How much is the cost?"
      "我付了费用。":
        "native": "I paid the fee."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2467":
    "native": "voice (a spoken message)"
    "notes":
      "n1": "A message you speak instead of write. 语 (yǔ) is speech, and 音 (yīn) is sound."
    "examples":
      "我发了一条语音。":
        "native": "I sent a voice message."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "条":
            "meaning": "measure word for messages and long thin things"
      "语音太长了。":
        "native": "The voice message is too long."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2468":
    "native": "group (in a chat)"
    "notes":
      "n1": "A chat with several people. 群 (qún) is a group."
    "examples":
      "我在这个群里。": "I am in this group."
      "群里有很多人。":
        "native": "There are many people in the group."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-2469":
    "native": "to scan"
    "notes":
      "n1": "To read a code with the phone camera. 扫 (sǎo) is to sweep or scan."
    "examples":
      "请扫这个码。":
        "native": "Please scan this code."
        "bases":
          "码":
            "meaning": "code"
      "我扫了二维码。":
        "native": "I scanned the QR code."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-2470":
    "native": "earphones; headphones"
    "notes":
      "n1": "What you wear in your ears to listen. 耳 (ěr) is the ear, and 机 (jī) is a machine."
    "examples":
      "我的耳机坏了。":
        "native": "My earphones are broken."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "坏":
            "meaning": "broken"
          "了":
            "meaning": "a particle: a change has happened"
      "请戴上耳机。":
        "native": "Please put your earphones on."
        "bases":
          "戴":
            "meaning": "to wear"
  "zh-2471":
    "native": "to upload"
    "notes":
      "n1": "To send a file or a photo to the internet. 上 (shàng) is up, and 传 (chuán) is to pass on."
    "examples":
      "我上传了照片。":
        "native": "I uploaded the photo."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "请上传照片。": "Please upload the photo."
  "zh-2472":
    "native": "silent mode"
    "notes":
      "n1": "A setting that turns off the sound. 静 (jìng) is quiet, and 音 (yīn) is sound."
    "examples":
      "手机开静音了。":
        "native": "The phone is on silent."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "请把手机调成静音。":
        "native": "Please set your phone to silent."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
          "成":
            "meaning": "to become; into"
  "zh-2473":
    "native": "to forward"
    "notes":
      "n1": "To send on a message that someone else sent. 转 (zhuǎn) is to pass on, and 发 (fā) is to send."
    "examples":
      "我转发了这条消息。":
        "native": "I forwarded this message."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "条":
            "meaning": "measure word for messages and long thin things"
          "消息":
            "meaning": "message; news"
      "请不要转发。":
        "native": "Please do not forward it."
        "bases":
          "不要":
            "meaning": "do not"
  "zh-2474":
    "native": "to like (a post)"
    "notes":
      "n1": "To press the button that shows you like a post. 点 (diǎn) is to press, and 赞 (zàn) is praise."
    "examples":
      "我给他的照片点赞了。":
        "native": "I liked his photo."
        "bases":
          "给":
            "meaning": "to give; for"
          "的":
            "meaning": "a particle: of; belonging to"
          "了":
            "meaning": "a particle: a change has happened"
      "谢谢你的点赞。":
        "native": "Thank you for your like."
        "bases":
          "谢谢":
            "meaning": "thank you"
          "的":
            "meaning": "a particle: of; belonging to"
