"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Where things are in sentences"
"description": "Sentences that say where a thing is, with the place words for each side and each spot. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0537":
    "native": "Where is the key?"
    "confusables":
      "w1":
        "why": "哪 (nǎ) asks which one, not where."
      "w2":
        "why": "几 (jǐ) asks how many, not where."
  "zh-0538":
    "native": "The chair is beside the table, and the bed is on the right."
    "confusables":
      "w1":
        "why": "前面 (qiánmiàn) would say in front, not beside."
      "w2":
        "why": "左边 (zuǒbian) would say on the left, not on the right."
  "zh-0539":
    "native": "The book is on the table, and the shoes are under the bed."
    "confusables":
      "w1":
        "why": "里 (lǐ) would say inside, not on or under."
      "w2":
        "why": "外面 (wàimiàn) would say outside, not under."
  "zh-0540":
    "native": "Are you behind me?"
    "confusables":
      "w1":
        "why": "前面 (qiánmiàn) would say in front of me, the other side."
      "w2":
        "why": "中间 (zhōngjiān) would say in the middle, not behind."
  "zh-0541":
    "native": "There is far, and here is near."
    "confusables":
      "w1":
        "why": "中间 (zhōngjiān) would say in the middle, not far or near."
      "w2":
        "why": "这 (zhè) would say this, not here."
  "zh-0542":
    "native": "The table is in the middle, and there are many things."
    "confusables":
      "w1":
        "why": "右边 (yòubian) would say on the right, not in the middle."
      "w2":
        "why": "旁边 (pángbiān) would say beside, not in the middle."
  "zh-0543":
    "native": "It is cold outside, and the room is warm."
    "confusables":
      "w1":
        "why": "里 (lǐ) would say inside, the opposite of outside."
      "w2":
        "why": "热 (rè) would say hot, not warm."
  "zh-0544":
    "native": "Are you sitting on the chair?"
    "confusables":
      "w1":
        "why": "下 (xià) would say under, not on."
      "w2":
        "why": "床 (chuáng) is a bed, not a chair."
  "zh-0545":
    "native": "The things are on the left, and the money is on the right."
    "confusables":
      "w1":
        "why": "中间 (zhōngjiān) would say in the middle."
      "w2":
        "why": "后面 (hòumiàn) would say behind, not on the left."
