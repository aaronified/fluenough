"name": "Polite requests and rhetorical questions in sentences"
"description": "Sentences with polite requests, such as 请等一下 (qǐng děng yíxià), please wait a moment, and rhetorical questions, such as 谁知道呢 (shéi zhīdào ne), who knows? Not yet checked by a Mandarin speaker: please report any mistake."
