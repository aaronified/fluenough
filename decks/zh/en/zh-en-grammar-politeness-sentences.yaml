"cards":
  "zh-4878":
    "confusables":
      "w1":
        "why": "站 (zhàn) is to stand, not to sit."
      "w2":
        "why": "进 (jìn) is to come in, not to sit."
    "native": "Please sit down."
  "zh-4879":
    "confusables":
      "w1":
        "why": "看 (kàn) is to look, not to wait."
      "w2":
        "why": "坐 (zuò) is to sit, not to wait."
    "bases":
      "一下":
        "meaning": "a little; for a moment (softens a request)"
    "native": "Please wait a moment."
  "zh-4880":
    "confusables":
      "w1":
        "why": "借 (jiè) is to borrow, a different favour."
      "w2":
        "why": "拿 (ná) is to hold or carry, not to help."
    "bases":
      "一下":
        "meaning": "a little; for a moment (softens a request)"
    "native": "Sorry to trouble you, could you help me?"
  "zh-4881":
    "confusables":
      "w1":
        "why": "说 (shuō) is to say, not to tell someone."
      "w2":
        "why": "问 (wèn) is to ask, not to tell."
    "bases":
      "的":
        "meaning": "a particle: of; the thing belonging to"
    "native": "Please tell me your name."
  "zh-4882":
    "confusables":
      "w1":
        "why": "出 (chū) is to go out, the opposite of coming in."
      "w2":
        "why": "坐 (zuò) is to sit, not to come in."
    "native": "Hello, please come in."
  "zh-4883":
    "confusables":
      "w1":
        "why": "学生 (xuésheng) is a student, not a teacher."
      "w2":
        "why": "医生 (yīshēng) is a doctor, not a teacher."
    "native": "Isn't he the teacher?"
  "zh-4884":
    "confusables":
      "w1":
        "why": "同意 (tóngyì) is to agree, not to know."
      "w2":
        "why": "希望 (xīwàng) is to hope, not to know."
    "native": "Can it be that you do not know?"
  "zh-4885":
    "confusables":
      "w1":
        "why": "来 (lái) is to come, the other direction."
      "w2":
        "why": "回家 (huíjiā) is to go home, a different place."
    "bases":
      "能":
        "meaning": "can; to be able to"
    "native": "How could I go?"
  "zh-4886":
    "confusables":
      "w1":
        "why": "怎么 (zěnme) is how, another question word."
      "w2":
        "why": "什么 (shénme) is what, another question word."
    "native": "Who knows?"
  "zh-4887":
    "confusables":
      "w1":
        "why": "什么 (shénme) is what, another question word."
      "w2":
        "why": "怎么 (zěnme) is how, another question word."
    "bases":
      "有":
        "meaning": "to have"
    "native": "Where would I have any money?"
  "zh-4888":
    "confusables":
      "w1":
        "why": "容易 (róngyì) is easy, the opposite of hard."
      "w2":
        "why": "重要 (zhòngyào) is important, not hard."
    "bases":
      "有":
        "meaning": "to have"
      "的":
        "meaning": "a particle: of; the thing belonging to"
    "native": "What is hard about that?"
