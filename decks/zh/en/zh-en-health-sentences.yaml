"cards":
  "zh-2868":
    "confusables":
      "w1":
        "why": "嗓子 (sǎngzi) is the voice, which may be sore too."
      "w2":
        "why": "咳 (ké) is to cough, a different action."
    "bases":
      "的":
        "meaning": "of"
    "native": "My throat is very sore."
  "zh-2869":
    "confusables":
      "w1":
        "why": "糖尿病 (tángniàobìng) is diabetes, a different illness."
      "w2":
        "why": "哮喘 (xiàochuǎn) is asthma, a different illness."
    "bases":
      "有":
        "meaning": "to have"
      "要":
        "meaning": "must; to need"
    "native": "He has high blood pressure, so he must take medicine."
  "zh-2870":
    "confusables":
      "w1":
        "why": "绷带 (bēngdài) is a bandage, used after bleeding."
      "w2":
        "why": "包扎 (bāozhā) is to bandage, done after bleeding."
    "native": "The wound is still bleeding."
  "zh-2871":
    "confusables":
      "w1":
        "why": "药片 (yàopiàn) is a tablet, not an injection."
      "w2":
        "why": "输液 (shūyè) is an infusion, a different treatment."
    "bases":
      "怕":
        "meaning": "to be afraid"
      "但":
        "meaning": "but"
      "要":
        "meaning": "must; to need"
    "native": "I am afraid of needles, but I must have an injection."
  "zh-2872":
    "confusables":
      "w1":
        "why": "医院 (yīyuàn) is a hospital, a place rather than a check."
      "w2":
        "why": "体检 (tǐjiǎn) is a check-up, a different kind."
    "bases":
      "让":
        "meaning": "to let"
    "native": "The doctor asked me to come back for a check next week."
  "zh-2873":
    "confusables":
      "w1":
        "why": "睡眠 (shuìmián) is sleep, the noun for the state."
      "w2":
        "why": "晕 (yūn) is dizzy, a different feeling."
    "bases":
      "最近":
        "meaning": "recently"
    "native": "I have not been sleeping well lately, and I am very tired."
  "zh-2874":
    "confusables":
      "w1":
        "why": "皮疹 (pízhěn) is a rash, a different problem."
      "w2":
        "why": "消毒 (xiāodú) is to disinfect, a different action."
    "bases":
      "要":
        "meaning": "must; to need"
      "戴":
        "meaning": "to wear"
    "native": "Wear a mask when you go out."
  "zh-2875":
    "confusables":
      "w1":
        "why": "扭伤 (niǔshāng) is to sprain, not to fall."
      "w2":
        "why": "救护车 (jiùhùchē) is an ambulance, a vehicle."
    "bases":
      "了":
        "meaning": "a particle: a finished action"
    "native": "He hurt his leg in a fall and went to the emergency room."
