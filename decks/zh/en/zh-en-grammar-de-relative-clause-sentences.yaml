"name": "The 的 (de) relative clause: the book I bought, the friend who came"
"description": "Sentences that describe a noun with a whole clause before 的 (de), such as 我买的书 (the book I bought) and 这是我买的书 (this is the book I bought). Not yet checked by a Mandarin speaker: please report any mistake."
