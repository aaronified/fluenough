"cards":
  "zh-3330":
    "confusables":
      "w1":
        "why": "卖 (mài) is to sell, the opposite of buying."
      "w2":
        "why": "借 (jiè) is to borrow, not to buy."
    "bases":
      "的":
        "meaning": "of; the one that"
    "native": "This is the book I bought."
  "zh-3331":
    "confusables":
      "w1":
        "why": "看 (kàn) is to read or look, not to write."
      "w2":
        "why": "说 (shuō) is to speak, not to write."
    "bases":
      "的":
        "meaning": "of; the one that"
      "信":
        "meaning": "letter"
    "native": "The letter he wrote is very long."
  "zh-3332":
    "confusables":
      "w1":
        "why": "老师 (lǎoshī) is a teacher, which is a different role."
      "w2":
        "why": "学生 (xuésheng) is a student, which is a different role."
    "bases":
      "的":
        "meaning": "of; the one that"
    "native": "All the friends I know are very good."
  "zh-3333":
    "confusables":
      "w1":
        "why": "来 (lái) is to come, not to go."
      "w2":
        "why": "走 (zǒu) is to walk or leave, a different act."
    "bases":
      "的":
        "meaning": "of; the one that"
    "native": "This restaurant is one I have been to."
  "zh-3334":
    "confusables":
      "w1":
        "why": "做 (zuò) is to make, not to eat."
      "w2":
        "why": "喝 (hē) is to drink, a different act."
    "bases":
      "的":
        "meaning": "of; the one that"
    "native": "The dish I ate was very tasty."
  "zh-3335":
    "confusables":
      "w1":
        "why": "买 (mǎi) is to buy, not to make."
      "w2":
        "why": "吃 (chī) is to eat, a different act."
    "bases":
      "的":
        "meaning": "of; the one that"
    "native": "The meal she made is very tasty."
  "zh-3336":
    "confusables":
      "w1":
        "why": "朋友 (péngyou) is a friend, a narrower idea."
      "w2":
        "why": "老师 (lǎoshī) is a teacher, a different role."
    "bases":
      "的":
        "meaning": "of; the one that"
    "native": "This is a person I know."
  "zh-3337":
    "confusables":
      "w1":
        "why": "电话 (diànhuà) is a telephone call, a different thing."
      "w2":
        "why": "钱 (qián) is money, a different thing."
    "bases":
      "的":
        "meaning": "of; the one that"
      "电影":
        "meaning": "film"
    "native": "The film tickets I bought are on the table."
