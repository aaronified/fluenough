"id": "zh-en-law-sentences"
"kind": "layer"
"core": "zh-law-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Law in sentences"
"description": "Sentences about the police, a case in court, a contract, bail and privacy. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-4230":
    "confusables":
      "w1":
        "why": "证词 (zhèngcí) is a witness's account; here the police write the record themselves."
      "w2":
        "why": "举报 (jǔbào) is to report a wrongdoing to the authorities, not to take a case to the station."
    "bases":
      "了":
        "meaning": "completed action"
    "native": "He reported the case at the police station, and the police took a statement."
  "zh-4231":
    "confusables":
      "w1":
        "why": "违约 (wéiyuē) is breaking a contract, something a side does, not the terms themselves."
      "w2":
        "why": "规定 (guīdìng) is a rule set by an office, not a clause in a contract."
    "bases":
      "这份":
        "meaning": "this (a document or a share)"
      "的":
        "meaning": "of; 's"
      "不利":
        "meaning": "unfavourable"
    "native": "The terms of this contract are very unfavourable to us."
  "zh-4232":
    "confusables":
      "w1":
        "why": "无罪 (wúzuì) is the opposite verdict, not guilty."
      "w2":
        "why": "判决 (pànjué) is the judgment as a noun; the sentence uses the verb 判 (pàn) instead."
    "bases":
      "判":
        "meaning": "to judge; to sentence"
      "但是":
        "meaning": "but"
      "可以":
        "meaning": "may; can"
    "native": "The judge found him guilty, but he can still appeal."
  "zh-4233":
    "confusables":
      "w1":
        "why": "拘留 (jūliú) is a short detention, a lighter step than an arrest."
      "w2":
        "why": "坐牢 (zuòláo) is serving a prison term, which comes only after a court decides."
    "bases":
      "路上":
        "meaning": "on the road"
      "了":
        "meaning": "completed action"
      "那个":
        "meaning": "that"
    "native": "The police arrested that suspect in the street."
  "zh-4234":
    "confusables":
      "w1":
        "why": "禁止 (jìnzhǐ) is a firm ban, usually on a sign; this sentence explains a permission."
      "w2":
        "why": "隐私 (yǐnsī) is privacy, which photos can break, not the rule about taking them."
    "bases":
      "未经":
        "meaning": "without (approval)"
      "不能":
        "meaning": "cannot"
      "这里":
        "meaning": "here"
    "native": "You may not take photos here without permission."
  "zh-4235":
    "confusables":
      "w1":
        "why": "遗失 (yíshī) is the formal word for losing something, with no thief involved."
      "w2":
        "why": "丢 (diū) is to lose something, but not to have it stolen."
    "bases":
      "了":
        "meaning": "completed action"
      "的":
        "meaning": "of; 's"
    "native": "A thief stole my wallet, so I went at once to report it lost."
  "zh-4236":
    "confusables":
      "w1":
        "why": "逮捕 (dàibǔ) is the arrest itself; this sentence says how long the hold lasted."
      "w2":
        "why": "保释 (bǎoshì) is bail, which lets a suspect wait outside prison."
    "bases":
      "的":
        "meaning": "of; 's"
      "被":
        "meaning": "passive marker"
      "了":
        "meaning": "completed action"
      "三天":
        "meaning": "three days"
    "native": "The robber was held for three days."
  "zh-4237":
    "confusables":
      "w1":
        "why": "罚款 (fákuǎn) is a fine for a wrong, not the money paid for bail."
      "w2":
        "why": "赔偿 (péicháng) is compensation for harm done, not money to leave prison."
    "bases":
      "交":
        "meaning": "to pay; to hand over"
      "了":
        "meaning": "completed action"
      "保释金":
        "meaning": "bail money"
      "可以":
        "meaning": "may; can"
    "native": "After he paid the bail, he could go home."
  "zh-4238":
    "confusables":
      "w1":
        "why": "抢劫 (qiǎngjié) is robbery with force; the company cheated, it did not use force."
      "w2":
        "why": "违法 (wéifǎ) is breaking the law in general, a wider word than the scam itself."
    "bases":
      "这家":
        "meaning": "this (a company)"
      "了":
        "meaning": "completed action"
      "很多":
        "meaning": "many"
      "被":
        "meaning": "passive marker"
    "native": "The company cheated many customers and was sued."
  "zh-4239":
    "confusables":
      "w1":
        "why": "禁止 (jìnzhǐ) is a ban; this sentence asks for care, not a notice."
      "w2":
        "why": "举报 (jǔbào) is to report a wrongdoing, which is not the same as sharing photos."
    "bases":
      "为了":
        "meaning": "for the sake of"
      "不要":
        "meaning": "do not"
      "的":
        "meaning": "of; 's"
    "native": "To protect privacy, please do not make other people's photos public."
