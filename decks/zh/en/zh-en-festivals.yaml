"id": "zh-en-festivals"
"kind": "layer"
"core": "zh-festivals"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Festivals"
"description": "Forty-five words for festivals: the Spring Festival and the Mid-Autumn Festival, the food and the lanterns, the fireworks and the red couplets, the family and the wishes, and the words for the holidays and the celebration. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-3882":
    "native": "Spring Festival"
    "notes":
      "n1": "The Chinese New Year festival. 春 (chūn) is spring, and 节 (jié) is a festival."
    "examples":
      "春节很热闹。": "The Spring Festival is very lively."
      "春节放假七天。": "The Spring Festival holiday is seven days."
  "zh-3883":
    "native": "Mid-Autumn Festival"
    "notes":
      "n1": "The festival of the full moon in autumn. 中 (zhōng) is middle, and 秋 (qiū) is autumn."
    "examples":
      "中秋的月亮很圆。":
        "native": "The moon at Mid-Autumn is very round."
        "bases":
          "的":
            "meaning": "of"
      "中秋和家人团圆。":
        "native": "At Mid-Autumn we are reunited with family."
        "bases":
          "和":
            "meaning": "and"
  "zh-3884":
    "native": "Dragon Boat Festival"
    "notes":
      "n1": "A festival in early summer with dragon boats and rice dumplings. 端 (duān) is the start, and 午 (wǔ) is noon."
    "examples":
      "端午吃粽子。": "At the Dragon Boat Festival we eat rice dumplings."
      "端午有龙舟比赛。":
        "native": "There are dragon boat races at the Dragon Boat Festival."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-3885":
    "native": "Lantern Festival"
    "notes":
      "n1": "The festival that ends the New Year, with lanterns and sweet dumplings. 元 (yuán) is first, and 宵 (xiāo) is night."
    "examples":
      "元宵有灯会。":
        "native": "There are lantern shows at the Lantern Festival."
        "bases":
          "有":
            "meaning": "to have; there is"
      "元宵吃汤圆。": "At the Lantern Festival we eat sweet dumplings."
  "zh-3886":
    "native": "rice dumpling"
    "notes":
      "n1": "Sticky rice wrapped in leaves. 粽 (zòng) is a rice dumpling, and 子 (zi) is a word ending."
    "examples":
      "粽子很好吃。": "The rice dumplings are very tasty."
      "我买了几个粽子。":
        "native": "I bought a few rice dumplings."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3887":
    "native": "mooncake"
    "notes":
      "n1": "A round cake eaten at the Mid-Autumn Festival. 月 (yuè) is the moon, and 饼 (bǐng) is a cake."
    "examples":
      "月饼很甜。": "The mooncakes are very sweet."
      "中秋要吃月饼。":
        "native": "At Mid-Autumn you eat mooncakes."
        "bases":
          "要":
            "meaning": "to want"
  "zh-3888":
    "native": "to celebrate"
    "notes":
      "n1": "To mark a happy day with activities. 庆 (qìng) is to celebrate, and 祝 (zhù) is to wish."
    "examples":
      "大家庆祝节日。": "Everyone celebrates the festival."
      "我们一起庆祝。": "Let us celebrate together."
  "zh-3889":
    "native": "festive celebration"
    "notes":
      "n1": "A celebration of a festival. 节 (jié) is a festival, and 庆 (qìng) is a celebration."
    "examples":
      "城市有很多节庆活动。":
        "native": "The city has many festive events."
        "bases":
          "有":
            "meaning": "to have; there is"
          "活动":
            "meaning": "activity"
      "节庆很热闹。": "The festive celebration is very lively."
  "zh-3890":
    "native": "dragon dance"
    "notes":
      "n1": "A dance with a long dragon made of cloth. 舞 (wǔ) is to dance, and 龙 (lóng) is a dragon."
    "examples":
      "大家看舞龙。": "Everyone watches the dragon dance."
      "舞龙很精彩。": "The dragon dance is very exciting."
  "zh-3891":
    "native": "lion dance"
    "notes":
      "n1": "A dance with a lion costume. 舞 (wǔ) is to dance, and 狮 (shī) is a lion."
    "examples":
      "舞狮很热闹。": "The lion dance is very lively."
      "孩子喜欢舞狮。": "The children like the lion dance."
  "zh-3892":
    "native": "lantern"
    "notes":
      "n1": "A paper lantern. 灯 (dēng) is a lamp, and 笼 (lóng) is a cover."
    "examples":
      "门口挂着红灯笼。":
        "native": "Red lanterns hang at the door."
        "bases":
          "着":
            "meaning": "a particle: a state continues"
      "灯笼很漂亮。": "The lanterns are very pretty."
  "zh-3893":
    "native": "fireworks"
    "notes":
      "n1": "Fireworks that burst in the sky. 烟 (yān) is smoke, and 花 (huā) is a flower."
    "examples":
      "晚上放烟花。": "There are fireworks in the evening."
      "烟花很好看。": "The fireworks are very nice to see."
  "zh-3894":
    "native": "firecrackers"
    "notes":
      "n1": "Loud fireworks that make a noise. 爆 (bào) is to burst, and 竹 (zhú) is bamboo."
    "examples":
      "过年放爆竹。":
        "native": "Set off firecrackers at New Year."
        "bases":
          "过年":
            "meaning": "to celebrate New Year"
      "爆竹声很大。":
        "native": "The sound of the firecrackers is very loud."
        "bases":
          "声":
            "meaning": "sound"
  "zh-3895":
    "native": "firecrackers"
    "notes":
      "n1": "A string of firecrackers. 鞭 (biān) is a whip, and 炮 (pào) is a cannon."
    "examples":
      "鞭炮响了。":
        "native": "The firecrackers went off."
        "bases":
          "响":
            "meaning": "to sound"
          "了":
            "meaning": "a particle"
      "不要放太多鞭炮。":
        "native": "Do not set off too many firecrackers."
        "bases":
          "不要":
            "meaning": "do not"
  "zh-3896":
    "native": "couplet"
    "notes":
      "n1": "Two lines of poetry written on red paper. 对 (duì) is a pair, and 联 (lián) is a link."
    "examples":
      "门上贴着对联。":
        "native": "A couplet is pasted on the door."
        "bases":
          "贴":
            "meaning": "to stick up"
          "着":
            "meaning": "a particle: a state continues"
      "对联写得很好。":
        "native": "The couplet is very well written."
        "bases":
          "得":
            "meaning": "a particle: how it is done"
  "zh-3897":
    "native": "spring couplet"
    "notes":
      "n1": "A red couplet put up at the Spring Festival. 春 (chūn) is spring, and 联 (lián) is a couplet."
    "examples":
      "家里贴了春联。":
        "native": "We put spring couplets up at home."
        "bases":
          "家里":
            "meaning": "at home"
          "贴":
            "meaning": "to stick up"
          "了":
            "meaning": "a particle"
      "春联是红色的。":
        "native": "The spring couplets are red."
        "bases":
          "的":
            "meaning": "of"
  "zh-3898":
    "native": "to be reunited"
    "notes":
      "n1": "To come together with family. 团 (tuán) is a group, and 圆 (yuán) is round."
    "examples":
      "中秋和家人团圆。":
        "native": "At Mid-Autumn families are reunited."
        "bases":
          "和":
            "meaning": "and"
      "过年大家团圆了。":
        "native": "At New Year everyone was together again."
        "bases":
          "过年":
            "meaning": "to celebrate New Year"
          "了":
            "meaning": "a particle"
  "zh-3899":
    "native": "to get together"
    "notes":
      "n1": "To meet again after a time apart. 团 (tuán) is a group, and 聚 (jù) is to gather."
    "examples":
      "我们终于团聚了。":
        "native": "We were finally reunited."
        "bases":
          "终于":
            "meaning": "at last"
          "了":
            "meaning": "a particle"
      "节日是团聚的时候。":
        "native": "Festivals are a time to get together."
        "bases":
          "的":
            "meaning": "of"
  "zh-3900":
    "native": "blessing; good wishes"
    "notes":
      "n1": "Good wishes for someone. 祝 (zhù) is to wish, and 福 (fú) is good fortune."
    "examples":
      "我给你送祝福。":
        "native": "I send you my best wishes."
        "bases":
          "给":
            "meaning": "to give; for"
      "祝福你新年快乐。":
        "native": "I wish you a happy New Year."
        "bases":
          "新年":
            "meaning": "new year"
  "zh-3901":
    "native": "to pay a New Year visit"
    "notes":
      "n1": "To visit or greet people at New Year. 拜 (bài) is to pay respects, and 年 (nián) is the year."
    "examples":
      "我们去拜年。": "We go to pay New Year visits."
      "大家互相拜年。":
        "native": "Everyone greets each other at New Year."
        "bases":
          "互相":
            "meaning": "each other"
  "zh-3902":
    "native": "New Year's Eve dinner"
    "notes":
      "n1": "The big family meal on the last night of the year. 年 (nián) is year, 夜 (yè) is night, and 饭 (fàn) is a meal."
    "examples":
      "我们吃年夜饭。": "We have the New Year's Eve dinner."
      "年夜饭很丰盛。":
        "native": "The New Year's Eve dinner is very rich."
        "bases":
          "丰盛":
            "meaning": "rich; lavish"
  "zh-3903":
    "native": "New Year money for children"
    "notes":
      "n1": "Money given to children at New Year. 压 (yā) is to press, 岁 (suì) is year, and 钱 (qián) is money."
    "examples":
      "孩子收到压岁钱。": "The child received New Year money."
      "压岁钱要给孩子。":
        "native": "New Year money is given to the children."
        "bases":
          "要":
            "meaning": "to want"
          "给":
            "meaning": "to give; for"
  "zh-3904":
    "native": "New Year's Eve"
    "notes":
      "n1": "The last night of the year. 除 (chú) is to remove, and 夕 (xī) is evening."
    "examples":
      "除夕很热闹。": "New Year's Eve is very lively."
      "除夕晚上放烟花。": "There are fireworks on New Year's Eve."
  "zh-3905":
    "native": "National Day"
    "notes":
      "n1": "The national holiday of a country. 国 (guó) is a country, and 庆 (qìng) is a celebration."
    "examples":
      "国庆放假七天。": "National Day is a seven-day holiday."
      "国庆节很热闹。":
        "native": "National Day is very lively."
        "bases":
          "国庆节":
            "meaning": "National Day"
  "zh-3906":
    "native": "Christmas"
    "notes":
      "n1": "The Christian festival of Christmas. 圣 (shèng) is holy, 诞 (dàn) is birth, and 节 (jié) is a festival."
    "examples":
      "圣诞节快到了。":
        "native": "Christmas is coming soon."
        "bases":
          "到":
            "meaning": "to arrive; to reach"
          "了":
            "meaning": "a particle"
      "圣诞节有很多礼物。":
        "native": "There are many presents at Christmas."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-3907":
    "native": "Valentine's Day"
    "notes":
      "n1": "A day for lovers. 情 (qíng) is love, 人 (rén) is a person, and 节 (jié) is a festival."
    "examples":
      "情人节送花。": "On Valentine's Day we give flowers."
      "情人节很浪漫。":
        "native": "Valentine's Day is very romantic."
        "bases":
          "浪漫":
            "meaning": "romantic"
  "zh-3908":
    "native": "candle"
    "notes":
      "n1": "A stick of wax with a wick. 蜡 (là) is wax, and 烛 (zhú) is a candle."
    "examples":
      "点蜡烛。": "Light the candles."
      "蛋糕上有蜡烛。":
        "native": "There are candles on the cake."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-3909":
    "native": "to make a wish"
    "notes":
      "n1": "To wish for something. 许 (xǔ) is to promise, and 愿 (yuàn) is a wish."
    "examples":
      "孩子在许愿。": "The child is making a wish."
      "吹蜡烛要许愿。":
        "native": "Blow out the candles and make a wish."
        "bases":
          "吹":
            "meaning": "to blow"
          "要":
            "meaning": "to want"
  "zh-3910":
    "native": "temple fair"
    "notes":
      "n1": "A fair held at a temple. 庙 (miào) is a temple, and 会 (huì) is a gathering."
    "examples":
      "庙会很热闹。": "The temple fair is very lively."
      "我们去逛庙会。": "We go to the temple fair."
  "zh-3911":
    "native": "decorative lantern"
    "notes":
      "n1": "A decorated lantern in the shape of flowers or animals. 花 (huā) is a flower, and 灯 (dēng) is a lamp."
    "examples":
      "花灯很漂亮。": "The decorative lanterns are very pretty."
      "晚上看花灯。": "In the evening we look at the lanterns."
  "zh-3912":
    "native": "lantern show"
    "notes":
      "n1": "A show of lanterns. 灯 (dēng) is a lamp, and 会 (huì) is a gathering."
    "examples":
      "灯会在公园里。": "The lantern show is in the park."
      "灯会很美。":
        "native": "The lantern show is very beautiful."
        "bases":
          "美":
            "meaning": "beautiful"
  "zh-3913":
    "native": "to enjoy the moon"
    "notes":
      "n1": "To look at and enjoy the moon. 赏 (shǎng) is to admire, and 月 (yuè) is the moon."
    "examples":
      "中秋我们赏月。": "At Mid-Autumn we enjoy the moon."
      "大家一起赏月。": "Everyone enjoys the moon together."
  "zh-3914":
    "native": "to enjoy the flowers"
    "notes":
      "n1": "To look at flowers in bloom. 赏 (shǎng) is to admire, and 花 (huā) is a flower."
    "examples":
      "春天去赏花。": "In spring we go to see the flowers."
      "赏花很有意思。":
        "native": "Flower viewing is very interesting."
        "bases":
          "有":
            "meaning": "to have; there is"
          "意思":
            "meaning": "meaning; interest"
  "zh-3915":
    "native": "to go on a spring outing"
    "notes":
      "n1": "To walk in the countryside in spring. 踏 (tà) is to step, and 青 (qīng) is green."
    "examples":
      "春天我们踏青。": "In spring we go for a walk in the countryside."
      "踏青很舒服。": "A spring walk is very pleasant."
  "zh-3916":
    "native": "dragon boat"
    "notes":
      "n1": "A long boat decorated like a dragon. 龙 (lóng) is a dragon, and 舟 (zhōu) is a boat."
    "examples":
      "龙舟比赛很激烈。":
        "native": "The dragon boat race is very fierce."
        "bases":
          "激烈":
            "meaning": "fierce"
      "这条龙舟很长。":
        "native": "This dragon boat is very long."
        "bases":
          "条":
            "meaning": "measure word for long things"
  "zh-3917":
    "native": "New Year picture"
    "notes":
      "n1": "A picture put up at New Year for luck. 年 (nián) is the year, and 画 (huà) is a picture."
    "examples":
      "家里挂着年画。":
        "native": "A New Year picture hangs at home."
        "bases":
          "家里":
            "meaning": "at home"
          "着":
            "meaning": "a particle: a state continues"
      "年画很喜庆。": "The New Year picture is very festive."
  "zh-3918":
    "native": "joyful"
    "notes":
      "n1": "Full of happiness and fun. 欢 (huān) is joyful, and 乐 (lè) is happy."
    "examples":
      "大家很欢乐。": "Everyone is very joyful."
      "节日的气氛很欢乐。":
        "native": "The festive atmosphere is very joyful."
        "bases":
          "的":
            "meaning": "of"
          "气氛":
            "meaning": "atmosphere"
  "zh-3919":
    "native": "festive"
    "notes":
      "n1": "Happy and celebratory. 喜 (xǐ) is joy, and 庆 (qìng) is a celebration."
    "examples":
      "房间布置得很喜庆。":
        "native": "The room is decorated very festively."
        "bases":
          "布置":
            "meaning": "to decorate"
          "得":
            "meaning": "a particle: how it is done"
      "红色很喜庆。": "Red looks very festive."
  "zh-3920":
    "native": "public holidays"
    "notes":
      "n1": "Festival and holiday days. 节 (jié) is a festival, 假 (jià) is a holiday, and 日 (rì) is a day."
    "examples":
      "节假日人很多。": "There are many people on holidays."
      "节假日要休息。":
        "native": "You should rest on public holidays."
        "bases":
          "要":
            "meaning": "to want"
  "zh-3921":
    "native": "relatives"
    "notes":
      "n1": "Family members who are not in the immediate family. 亲 (qīn) is close, and 戚 (qī) is a relative."
    "examples":
      "过年有很多亲戚。":
        "native": "At New Year there are many relatives."
        "bases":
          "过年":
            "meaning": "to celebrate New Year"
          "有":
            "meaning": "to have; there is"
      "我去看亲戚。": "I go to visit my relatives."
  "zh-3922":
    "native": "elders"
    "notes":
      "n1": "People older than you in the family. 长 (zhǎng) is older, and 辈 (bèi) is a generation."
    "examples":
      "要尊敬长辈。":
        "native": "We must respect our elders."
        "bases":
          "要":
            "meaning": "to want"
      "长辈给我红包。":
        "native": "The elders gave me red envelopes."
        "bases":
          "给":
            "meaning": "to give; for"
  "zh-3923":
    "native": "younger generation"
    "notes":
      "n1": "People younger than you in the family. 晚 (wǎn) is later, and 辈 (bèi) is a generation."
    "examples":
      "长辈给晚辈红包。":
        "native": "Elders give red envelopes to the younger generation."
        "bases":
          "给":
            "meaning": "to give; for"
      "晚辈要尊重长辈。":
        "native": "The younger generation should respect the elders."
        "bases":
          "要":
            "meaning": "to want"
  "zh-3924":
    "native": "sweet glutinous rice ball"
    "notes":
      "n1": "A sweet dumpling in soup. 汤 (tāng) is soup, and 圆 (yuán) is round."
    "examples":
      "元宵吃汤圆。": "At Lantern Festival we eat sweet dumplings."
      "汤圆很甜。": "The sweet dumplings are very sweet."
  "zh-3925":
    "native": "New Year cake"
    "notes":
      "n1": "A sticky rice cake eaten at New Year. 年 (nián) is year, and 糕 (gāo) is a cake."
    "examples":
      "春节吃年糕。": "At the Spring Festival we eat New Year cakes."
      "年糕很粘。":
        "native": "New Year cakes are very sticky."
        "bases":
          "粘":
            "meaning": "sticky"
  "zh-3926":
    "native": "to commemorate"
    "notes":
      "n1": "To remember an event or person. 纪 (jì) is to record, and 念 (niàn) is to think of."
    "examples":
      "我们纪念这个节日。": "We commemorate this festival."
      "纪念日很重要。":
        "native": "Commemoration days are very important."
        "bases":
          "纪念日":
            "meaning": "commemoration day"
