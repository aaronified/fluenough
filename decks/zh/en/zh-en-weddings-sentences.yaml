"cards":
  "zh-3986":
    "confusables":
      "w1":
        "why": "婚宴 (hūnyàn) is the wedding feast, a part of the day."
      "w2":
        "why": "求婚 (qiúhūn) is to propose, which comes before."
    "native": "They are getting married next year, and the wedding is at the hotel."
  "zh-3987":
    "confusables":
      "w1":
        "why": "衣服 (yīfu) is clothes, a wider word."
      "w2":
        "why": "帽子 (màozi) is a hat, a different item."
    "bases":
      "着":
        "meaning": "a particle: a state continues"
      "的":
        "meaning": "of"
    "native": "The bride wears a white wedding dress."
  "zh-3988":
    "confusables":
      "w1":
        "why": "领证 (lǐngzhèng) is to collect the certificate, after registering."
      "w2":
        "why": "证婚人 (zhènghūnrén) is the witness, a different role."
    "bases":
      "了":
        "meaning": "a particle"
    "native": "We registered at the hall."
  "zh-3989":
    "confusables":
      "w1":
        "why": "夫妻 (fūqī) is a married couple, the pair together."
      "w2":
        "why": "老公 (lǎogōng) is a casual word for husband."
    "bases":
      "的":
        "meaning": "of"
      "和":
        "meaning": "and"
    "native": "This is my husband and wife."
  "zh-3990":
    "confusables":
      "w1":
        "why": "表白 (biǎobái) is to declare love, a different step."
      "w2":
        "why": "订婚 (dìnghūn) is to get engaged, which comes after."
    "bases":
      "向":
        "meaning": "towards"
      "了":
        "meaning": "a particle"
    "native": "He proposed to her, and she was very moved."
  "zh-3991":
    "confusables":
      "w1":
        "why": "爱情 (àiqíng) is romantic love, a specific kind."
      "w2":
        "why": "恋爱 (liàn'ài) is to be in love, an action."
    "bases":
      "的":
        "meaning": "of"
    "native": "Our feelings for each other are very good."
  "zh-3992":
    "confusables":
      "w1":
        "why": "晚辈 (wǎnbèi) is a younger person, a different role."
      "w2":
        "why": "喜糖 (xǐtáng) is wedding sweets, a different gift."
    "bases":
      "向":
        "meaning": "towards"
    "native": "The bride serves tea to the elders, and everyone is very happy."
  "zh-3993":
    "confusables":
      "w1":
        "why": "贺卡 (hèkǎ) is a greeting card, a different paper."
      "w2":
        "why": "红包 (hóngbāo) is a red envelope, a different gift."
    "bases":
      "了":
        "meaning": "a particle"
    "native": "All the guests received invitations."
