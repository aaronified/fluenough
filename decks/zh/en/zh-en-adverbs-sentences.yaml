"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0374":
    "native": "Shall we eat together?"
    "confusables":
      "w1":
        "why": "一定 (yídìng) would say certainly, not together."
      "w2":
        "why": "马上 (mǎshàng) would say at once, not together."
  "zh-0375":
    "native": "Does he often come?"
    "confusables":
      "w1":
        "why": "总是 (zǒngshì) would say always, which is stronger than often."
      "w2":
        "why": "偶尔 (ǒu'ěr) would say now and then, which is less often."
  "zh-0376":
    "native": "Do you never eat fish?"
    "confusables":
      "w1":
        "why": "偶尔 (ǒu'ěr) would say now and then, so not never."
      "w2":
        "why": "还 (hái) would say still, which is not never."
  "zh-0377":
    "native": "Mum has already got up."
    "confusables":
      "w1":
        "why": "刚 (gāng) would say just now, not already."
      "w2":
        "why": "先 (xiān) would say first, before another action."
  "zh-0378":
    "native": "Please say it again."
    "confusables":
      "w1":
        "why": "又 (yòu) would say again, for a thing that already happened."
      "w2":
        "why": "还 (hái) would say still, not again."
  "zh-0379":
    "native": "You are really good!"
    "confusables":
      "w1":
        "why": "太 (tài) would say too good, not really good."
      "w2":
        "why": "非常 (fēicháng) would say very good, a stronger form."
  "zh-0380":
    "native": "I am coming right away, you eat first."
    "confusables":
      "w1":
        "why": "刚 (gāng) would say just now, not at once."
      "w2":
        "why": "然后 (ránhòu) would say then, after the first thing."
  "zh-0381":
    "native": "Actually, he is not coming."
    "confusables":
      "w1":
        "why": "大概 (dàgài) would say probably, a guess, not a fact."
      "w2":
        "why": "可能 (kěnéng) would say maybe, a guess, not a fact."
