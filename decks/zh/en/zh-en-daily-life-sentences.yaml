"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "A day in sentences"
"description": "Sentences about the morning and the night: waking up, washing, going to work and going to bed. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1334":
    "confusables":
      "w1":
        "why": "睡觉 (shuìjiào) is to sleep, the opposite of getting up."
      "w2":
        "why": "上班 (shàngbān) is to go to work, which comes later."
    "bases":
      "每天":
        "meaning": "every day"
    "native": "I get up at seven every morning."
  "zh-1335":
    "confusables":
      "w1":
        "why": "叫醒 (jiàoxǐng) is to wake someone else, not yourself."
      "w2":
        "why": "做梦 (zuòmèng) is to dream, which is not waking up."
    "bases":
      "响":
        "meaning": "to ring; to sound"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "The alarm rang, and I woke up."
  "zh-1336":
    "confusables":
      "w1":
        "why": "梳头 (shūtóu) is to comb the hair, a different act."
      "w2":
        "why": "刮胡子 (guāhúzi) is to shave, for men mostly."
    "native": "I wash my face first, then I brush my teeth."
  "zh-1337":
    "confusables":
      "w1":
        "why": "早起 (zǎoqǐ) is to get up early, the other end of the day."
      "w2":
        "why": "深夜 (shēnyè) is late at night, a time not a deed."
    "native": "At eleven in the evening I go to sleep."
  "zh-1338":
    "confusables":
      "w1":
        "why": "肥皂 (féizào) is soap, which is for washing."
      "w2":
        "why": "牙膏 (yágāo) is toothpaste, for the teeth."
    "bases":
      "用":
        "meaning": "to use"
    "native": "Mum wipes her face with a towel."
  "zh-1339":
    "confusables":
      "w1":
        "why": "脱 (tuō) is to take off, the opposite of wearing."
      "w2":
        "why": "梳子 (shūzi) is a comb, not a shoe."
    "native": "He wears slippers to go to the bathroom."
  "zh-1340":
    "confusables":
      "w1":
        "why": "晚起 (wǎnqǐ) is to get up late, the opposite."
      "w2":
        "why": "刷牙 (shuāyá) is to brush the teeth, a different habit."
    "native": "I am used to getting up early."
  "zh-1341":
    "confusables":
      "w1":
        "why": "打盹 (dǎdǔn) is to doze, a short sleep, not a rest."
      "w2":
        "why": "聊天 (liáotiān) is to chat, a different act."
    "bases":
      "一下":
        "meaning": "a little; have a try"
    "native": "In the afternoon I rest for a moment."
