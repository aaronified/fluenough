"cards":
  "zh-1553":
    "confusables":
      "w1":
        "why": "狗 (gǒu) is a dog, another pet."
      "w2":
        "why": "兔子 (tùzi) is a rabbit, a different pet."
    "bases":
      "有":
        "meaning": "to have; there is"
    "native": "We have a cat at home."
  "zh-1554":
    "confusables":
      "w1":
        "why": "老虎 (lǎohǔ) is a tiger, a fierce animal."
      "w2":
        "why": "狮子 (shīzi) is a lion, not a panda."
    "bases":
      "可爱":
        "meaning": "lovely; cute"
    "native": "The panda is very cute."
  "zh-1555":
    "confusables":
      "w1":
        "why": "大象 (dàxiàng) is an elephant, the opposite of small."
      "w2":
        "why": "蚊子 (wénzi) is a mosquito, small but a different insect."
    "native": "The ant is very small."
  "zh-1556":
    "confusables":
      "w1":
        "why": "青蛙 (qīngwā) is a frog, not a bird."
      "w2":
        "why": "蜜蜂 (mìfēng) is a bee, which buzzes."
    "native": "The bird sings in the tree."
  "zh-1557":
    "confusables":
      "w1":
        "why": "熊猫 (xióngmāo) is a panda, which eats bamboo."
      "w2":
        "why": "牛 (niú) is a cow, a farm animal."
    "native": "Monkeys like to eat bananas."
  "zh-1558":
    "confusables":
      "w1":
        "why": "鲸鱼 (jīngyú) is a whale, a different sea animal."
      "w2":
        "why": "企鹅 (qǐ'é) is a penguin, which cannot swim well."
    "bases":
      "会":
        "meaning": "can; to know how to"
    "native": "Dolphins can swim."
  "zh-1559":
    "confusables":
      "w1":
        "why": "饲料 (sìliào) is animal feed, not a place to visit."
      "w2":
        "why": "宠物 (chǒngwù) is a pet at home, not a zoo."
    "native": "We go to the zoo to see the elephants."
  "zh-1560":
    "confusables":
      "w1":
        "why": "猫 (māo) is a cat, a different pet."
      "w2":
        "why": "鸡 (jī) is a chicken, a farm bird."
    "native": "This dog is very clever."
