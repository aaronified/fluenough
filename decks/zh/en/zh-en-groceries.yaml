"id": "zh-en-groceries"
"kind": "layer"
"core": "zh-groceries"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Groceries"
"description": "Forty words for the supermarket: bread, rice, noodles, milk, sugar and salt, meat and sauces, packaged food, and the words for shopping, sales and dates. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0822":
    "native": "supermarket"
    "notes":
      "n1": "A supermarket is a large shop where you take goods from shelves yourself. A market with stalls is 菜市场 (càishìchǎng)."
    "examples":
      "我每天都去超市。":
        "native": "I go to the supermarket every day."
        "bases":
          "每天":
            "meaning": "every day"
      "超市在学校旁边。": "The supermarket is next to the school."
  "zh-0823":
    "native": "milk"
    "notes":
      "n1": "Milk, drunk warm or cold. 牛 (niú) is cow, and 奶 (nǎi) is milk: the word is a compound."
    "examples":
      "我每天早上喝牛奶。":
        "native": "I drink milk every morning."
        "bases":
          "每天":
            "meaning": "every day"
      "孩子只喝牛奶。": "The child only drinks milk."
  "zh-0824":
    "native": "bread"
    "notes":
      "n1": "Bread, a loaf or a roll. 面 (miàn) is flour and 包 (bāo) is a bun or to wrap."
    "examples":
      "他早上吃面包。": "He eats bread in the morning."
      "面包很新鲜。": "The bread is very fresh."
  "zh-0825":
    "native": "rice (uncooked or as grain)"
    "notes":
      "n1": "Rice as grain, before it is cooked. Cooked rice is 米饭 (mǐfàn)."
    "examples":
      "我们每天吃大米。":
        "native": "We eat rice every day."
        "bases":
          "每天":
            "meaning": "every day"
      "大米很便宜。": "Rice is cheap."
  "zh-0826":
    "native": "noodles"
    "notes":
      "n1": "Noodles, long and thin, in soup or fried. 面 (miàn) is flour, and 条 (tiáo) is a long thin thing."
    "examples":
      "妈妈做面条。": "Mum makes noodles."
      "面条很热。": "The noodles are very hot."
  "zh-0827":
    "native": "biscuit; cookie"
    "notes":
      "n1": "A dry biscuit or cookie, bought in a packet. Cake is 蛋糕 (dàngāo)."
    "examples":
      "饼干在桌子上。": "The biscuits are on the table."
      "孩子喜欢吃饼干。": "Children like eating biscuits."
  "zh-0828":
    "native": "sugar; sweets"
    "notes":
      "n1": "Sugar, for tea and coffee. The same word is used for a sweet, as in 糖果 (tángguǒ)."
    "examples":
      "咖啡里加糖。": "Put sugar in the coffee."
      "他不吃糖。": "He does not eat sugar."
  "zh-0829":
    "native": "salt"
    "notes":
      "n1": "Salt, for cooking. 糖 (táng) is sugar, the opposite taste."
    "examples":
      "妈妈在汤里加盐。":
        "native": "Mum adds salt to the soup."
        "bases":
          "汤":
            "meaning": "soup"
      "我不喜欢太多盐。": "I do not like too much salt."
  "zh-0830":
    "native": "soy sauce"
    "notes":
      "n1": "Soy sauce, a dark liquid for cooking and dipping. 油 (yóu) is oil, a different thing."
    "examples":
      "我用酱油做菜。":
        "native": "I cook a dish with soy sauce."
        "bases":
          "用":
            "meaning": "to use"
      "酱油在冰箱旁边。": "The soy sauce is next to the fridge."
  "zh-0831":
    "native": "vinegar"
    "notes":
      "n1": "Vinegar, sour and used with dumplings. The taste word is 酸 (suān), sour."
    "examples":
      "饺子要蘸醋。":
        "native": "You dip dumplings in vinegar."
        "bases":
          "要":
            "meaning": "to want; to need"
          "蘸":
            "meaning": "to dip"
      "这个醋很酸。": "This vinegar is very sour."
  "zh-0832":
    "native": "oil"
    "notes":
      "n1": "Cooking oil, for frying. 油 (yóu) is the oil; the same word is in 酱油 (jiàngyóu), soy sauce."
    "examples":
      "菜里放油。":
        "native": "Put oil in the dish."
        "bases":
          "放":
            "meaning": "to put in; to add"
      "油用完了。":
        "native": "The oil has run out."
        "bases":
          "用":
            "meaning": "to use"
          "完":
            "meaning": "finished"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-0833":
    "native": "peanut"
    "notes":
      "n1": "Peanuts, eaten roasted, boiled or in a sauce. The word is one unit, not a description of the plant."
    "examples":
      "他喜欢吃花生。": "He likes to eat peanuts."
      "花生很香。": "Peanuts smell good."
  "zh-0834":
    "native": "beef"
    "notes":
      "n1": "Beef, cow meat. Pork is 猪肉 (zhūròu)."
    "examples":
      "我买了一斤牛肉。":
        "native": "I bought half a kilo of beef."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "牛肉很贵。": "Beef is expensive."
  "zh-0835":
    "native": "pork"
    "notes":
      "n1": "Pork, pig meat. 猪 (zhū) is pig and 肉 (ròu) is meat."
    "examples":
      "这个饺子是猪肉的。":
        "native": "These dumplings are pork."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "猪肉很新鲜。": "The pork is very fresh."
  "zh-0836":
    "native": "mutton; lamb"
    "notes":
      "n1": "Mutton or lamb, a meat eaten a lot in the north. 羊 (yáng) is sheep."
    "examples":
      "冬天我吃羊肉。": "In winter I eat mutton."
      "羊肉很热。": "The mutton is very hot."
  "zh-0837":
    "native": "chicken (meat)"
    "notes":
      "n1": "Chicken, the meat. The bird is 鸡 (jī)."
    "examples":
      "鸡肉很便宜。": "Chicken is cheap."
      "他不吃鸡肉。": "He does not eat chicken."
  "zh-0838":
    "native": "duck"
    "notes":
      "n1": "A duck, the bird or its meat. 鸭 (yā) and 子 (zi) make the word."
    "examples":
      "鸭子在水里。": "The duck is in the water."
      "我喜欢吃烤鸭子。": "I like to eat roast duck."
  "zh-0839":
    "native": "dumplings"
    "notes":
      "n1": "Dumplings, with a filling in a thin wrapper. Steamed buns are 包子 (bāozi)."
    "examples":
      "饺子很好吃。": "The dumplings are delicious."
      "我们包饺子。": "We make dumplings."
  "zh-0840":
    "native": "steamed bun"
    "notes":
      "n1": "A steamed bun, round with a filling. Dumplings are 饺子 (jiǎozi)."
    "examples":
      "早上我吃一个包子。": "In the morning I eat a steamed bun."
      "包子是热的。":
        "native": "The steamed buns are hot."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-0841":
    "native": "cooked rice"
    "notes":
      "n1": "Cooked rice, the staple at a meal. Uncooked rice is 大米 (dàmǐ)."
    "examples":
      "中午我吃米饭。": "At noon I eat rice."
      "米饭很香。": "The rice smells good."
  "zh-0842":
    "native": "coffee"
    "notes":
      "n1": "Coffee, a drink. Tea is 茶 (chá)."
    "examples":
      "我每天喝咖啡。":
        "native": "I drink coffee every day."
        "bases":
          "每天":
            "meaning": "every day"
      "咖啡很热。": "The coffee is very hot."
  "zh-0843":
    "native": "fruit juice"
    "notes":
      "n1": "Fruit juice, pressed from fruit. 水果 (shuǐguǒ) is fruit."
    "examples":
      "孩子喜欢喝果汁。": "Children like to drink fruit juice."
      "果汁很甜。": "The juice is very sweet."
  "zh-0844":
    "native": "beer"
    "notes":
      "n1": "Beer, an alcoholic drink. 酒 (jiǔ) is alcohol or wine."
    "examples":
      "他喜欢喝啤酒。": "He likes to drink beer."
      "啤酒很冷。": "The beer is very cold."
  "zh-0845":
    "native": "bottled mineral water"
    "notes":
      "n1": "Bottled water from a spring. Plain water is 水 (shuǐ)."
    "examples":
      "我买一瓶矿泉水。": "I buy a bottle of mineral water."
      "矿泉水在冰箱里。": "The mineral water is in the fridge."
  "zh-0846":
    "native": "cola"
    "notes":
      "n1": "Cola, a sweet fizzy drink. The name is a sound loan."
    "examples":
      "孩子喝可乐。": "The child drinks cola."
      "可乐很甜。": "Cola is very sweet."
  "zh-0847":
    "native": "to shop"
    "notes":
      "n1": "To shop, buy things in a shop. 购物 (gòuwù) is also the noun for shopping."
    "examples":
      "我周末去购物。": "I go shopping at the weekend."
      "她每天购物。":
        "native": "She shops every day."
        "bases":
          "每天":
            "meaning": "every day"
  "zh-0848":
    "native": "shopping trolley"
    "notes":
      "n1": "A trolley for goods in a supermarket. 车 (chē) is a vehicle."
    "examples":
      "他推着购物车。":
        "native": "He pushes the trolley."
        "bases":
          "推":
            "meaning": "to push"
          "着":
            "meaning": "a particle: an action goes on"
      "购物车里有很多东西。":
        "native": "There are many things in the trolley."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-0849":
    "native": "to give a discount; on sale"
    "notes":
      "n1": "To give a discount, as in a sale. 折 (zhé) is a fold, and to fold a price is to cut it."
    "examples":
      "今天打折吗？": "Is it on sale today?"
      "这个牛奶打折了。":
        "native": "This milk is on sale."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-0850":
    "native": "free of charge"
    "notes":
      "n1": "Free, with no price. 费 (fèi) is a fee; 免 (miǎn) means to let go."
    "examples":
      "饼干免费。": "The biscuits are free."
      "试吃是免费的。":
        "native": "The tasting is free."
        "bases":
          "试吃":
            "meaning": "a tasting; to try a food"
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-0851":
    "native": "to be past its date; to expire"
    "notes":
      "n1": "Past its date, as food that is no longer fresh enough to sell. 过 (guò) is to pass, and 期 (qī) is a date."
    "examples":
      "这瓶牛奶过期了。":
        "native": "This bottle of milk is past its date."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "饼干不能过期。":
        "native": "The biscuits must not go past their date."
        "bases":
          "能":
            "meaning": "can; to be able to"
  "zh-0852":
    "native": "shelf life; best before date"
    "notes":
      "n1": "The time a food stays good to eat, printed on the packet. 质 (zhì) is quality."
    "examples":
      "保质期是三个月。": "The shelf life is three months."
      "我看一下保质期。":
        "native": "I look at the best before date."
        "bases":
          "一下":
            "meaning": "a little; have a try"
  "zh-0853":
    "native": "fridge"
    "notes":
      "n1": "A fridge. 冰 (bīng) is ice, and 箱 (xiāng) is a box."
    "examples":
      "牛奶在冰箱里。": "The milk is in the fridge."
      "冰箱里没有饼干。":
        "native": "There are no biscuits in the fridge."
        "bases":
          "没有":
            "meaning": "there is not; did not"
  "zh-0854":
    "native": "to freeze; frozen"
    "notes":
      "n1": "To freeze food, or frozen food in a freezer. 冷 (lěng) is cold."
    "examples":
      "肉要冷冻。":
        "native": "The meat must be frozen."
        "bases":
          "要":
            "meaning": "to want; to need"
      "冷冻的饺子很方便。":
        "native": "Frozen dumplings are convenient."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-0855":
    "native": "packaging; packet"
    "notes":
      "n1": "The packaging of goods: the box, the bag or the wrapper. 装 (zhuāng) is to pack."
    "examples":
      "这个包装很漂亮。": "This packaging is very pretty."
      "包装上有保质期。":
        "native": "The packaging has the best before date."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-0856":
    "native": "shelf (in a shop)"
    "notes":
      "n1": "A shelf for goods in a shop. 货 (huò) is goods and 架 (jià) is a frame."
    "examples":
      "牛奶在第三个货架上。":
        "native": "The milk is on the third shelf."
        "bases":
          "第":
            "meaning": "the ordinal prefix"
      "货架上没有面包了。":
        "native": "There is no bread left on the shelf."
        "bases":
          "没有":
            "meaning": "there is not; did not"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-0857":
    "native": "bottle"
    "notes":
      "n1": "A bottle, glass or plastic, for drinks. 瓶 (píng) is a bottle; 子 (zi) makes it a noun."
    "examples":
      "这个瓶子是空的。":
        "native": "This bottle is empty."
        "bases":
          "空":
            "meaning": "empty"
          "的":
            "meaning": "a particle: of; belonging to"
      "我买了两个瓶子。":
        "native": "I bought two bottles."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-0858":
    "native": "tin; canned food"
    "notes":
      "n1": "Canned food, in a tin. 罐 (guàn) is a jar."
    "examples":
      "罐头可以放很久。":
        "native": "Canned food keeps a long time."
        "bases":
          "可以":
            "meaning": "can; may"
          "放":
            "meaning": "to put in; to add"
          "久":
            "meaning": "long, of time"
      "我买了一罐鱼罐头。":
        "native": "I bought a tin of fish."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "罐":
            "meaning": "a jar; a tin"
  "zh-0859":
    "native": "cake"
    "notes":
      "n1": "A cake, sweet and soft. 蛋 (dàn) is egg."
    "examples":
      "今天是她的生日，我买蛋糕。":
        "native": "It is her birthday today, so I buy a cake."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "蛋糕很甜。": "The cake is very sweet."
  "zh-0860":
    "native": "chocolate"
    "notes":
      "n1": "Chocolate, a sweet food. The word is a sound loan."
    "examples":
      "孩子喜欢吃巧克力。": "Children like to eat chocolate."
      "巧克力很贵。": "Chocolate is expensive."
  "zh-0861":
    "native": "sweets; candy"
    "notes":
      "n1": "Sweets, the small sweet things a child eats. Sugar alone is 糖 (táng)."
    "examples":
      "他给孩子糖果。":
        "native": "He gives the children sweets."
        "bases":
          "给":
            "meaning": "to give; for"
      "糖果在商店里。": "The sweets are in the shop."
