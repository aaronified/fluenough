"core": "zh-phone-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Phones in sentences"
"description": "Sentences about calls, messages, the battery and the apps. Not yet checked by a Mandarin speaker: please report any mistake."
