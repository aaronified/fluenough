"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-2475":
    "confusables":
      "w1":
        "why": "挂 (guà) is to hang up, the opposite of answering."
      "w2":
        "why": "拨 (bō) is to dial, before the call starts."
    "native": "Hello, it is Xiao Wang speaking."
  "zh-2476":
    "confusables":
      "w1":
        "why": "电池 (diànchí) is the battery itself, not the phone."
      "w2":
        "why": "充电器 (chōngdiànqì) is the charger, a different thing."
    "bases":
      "的":
        "meaning": "a particle: of; belonging to"
      "没":
        "meaning": "not; did not"
      "电":
        "meaning": "electricity; power"
      "了":
        "meaning": "a particle: a change has happened"
    "native": "My phone has run out of battery."
  "zh-2477":
    "confusables":
      "w1":
        "why": "发 (fā) is to send, not to reply."
      "w2":
        "why": "收到 (shōudào) is to receive, which may come before the reply."
    "bases":
      "没":
        "meaning": "not; did not"
    "native": "Why have you not replied to the text message yet?"
  "zh-2478":
    "confusables":
      "w1":
        "why": "网络 (wǎngluò) is the network, a wider idea."
      "w2":
        "why": "屏幕 (píngmù) is the screen, a different part."
    "bases":
      "这里":
        "meaning": "here"
      "没有":
        "meaning": "there is not"
    "native": "There is no signal here."
  "zh-2479":
    "confusables":
      "w1":
        "why": "下载 (xiàzài) is to download, to get a file to the phone."
      "w2":
        "why": "录音 (lùyīn) is to record sound, not a picture."
    "bases":
      "把":
        "meaning": "a particle that puts the object before the verb"
      "给":
        "meaning": "to give; for"
    "native": "Please send me the photo."
  "zh-2480":
    "confusables":
      "w1":
        "why": "号码 (hàomǎ) is a number, not a secret code."
      "w2":
        "why": "按 (àn) is to press, a different action."
    "bases":
      "输入":
        "meaning": "to enter (data)"
    "native": "Please enter the password."
  "zh-2481":
    "confusables":
      "w1":
        "why": "忘记 (wàngjì) is to forget, which is what happened here."
      "w2":
        "why": "电话 (diànhuà) is the call, not the number."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "I have forgotten his number."
  "zh-2482":
    "confusables":
      "w1":
        "why": "应用 (yìngyòng) is any app, a wider word."
      "w2":
        "why": "上网 (shàngwǎng) is to go online, not a particular app."
    "bases":
      "用":
        "meaning": "to use"
    "native": "We keep in touch on WeChat."
