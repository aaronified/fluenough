"core": "zh-location"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Where things are"
"description": "Eighteen words for where things are: in, on, under, in front, behind, beside, left, right, middle and outside, the furniture and a key, and here and there. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0519":
    "native": "to be at; to be in"
    "notes":
      "n1": "To be at or in a place. The place comes after it: 在家 (zài jiā), at home; 在桌子上 (zài zhuōzi shang), on the table."
    "examples":
      "钥匙在桌子上。": "The key is on the table."
      "我在家。": "I am at home."
  "zh-0520":
    "native": "inside; in"
    "notes":
      "n1": "Inside, after a noun for a place: 房间里 (fángjiān li), in the room. Its opposite is 外面 (wàimiàn), outside."
    "examples":
      "房间里很安静。": "It is very quiet in the room."
      "茶在杯里。": "The tea is in the cup."
  "zh-0521":
    "native": "on; above"
    "notes":
      "n1": "On or above, after a noun: 桌子上 (zhuōzi shang), on the table. Its opposite is 下 (xià), under."
    "examples":
      "书在桌子上。": "The book is on the table."
      "衣服在床上。": "The clothes are on the bed."
  "zh-0522":
    "native": "under; below"
    "notes":
      "n1": "Under or below, after a noun: 床下 (chuáng xia), under the bed. Its opposite is 上 (shàng), on."
    "examples":
      "鞋在床下。": "The shoes are under the bed."
      "钱在桌子下。": "The money is under the table."
  "zh-0523":
    "native": "in front; ahead"
    "notes":
      "n1": "In front, ahead. Its opposite is 后面 (hòumiàn), behind."
    "examples":
      "椅子在桌子前面。": "The chair is in front of the table."
      "学校在前面。": "The school is ahead."
  "zh-0524":
    "native": "behind; at the back"
    "notes":
      "n1": "Behind, at the back. Its opposite is 前面 (qiánmiàn), in front."
    "examples":
      "床在后面。": "The bed is at the back."
      "你在我后面。": "You are behind me."
  "zh-0525":
    "native": "beside; next to"
    "notes":
      "n1": "Beside, next to. 旁边 (pángbiān) is the side of a thing, close to it."
    "examples":
      "椅子在桌子旁边。": "The chair is beside the table."
      "他在我旁边。": "He is beside me."
  "zh-0526":
    "native": "the left side"
    "notes":
      "n1": "The left side. Its opposite is 右边 (yòubian), the right side."
    "examples":
      "学校在左边。": "The school is on the left."
      "桌子在左边。": "The table is on the left."
  "zh-0527":
    "native": "the right side"
    "notes":
      "n1": "The right side. Its opposite is 左边 (zuǒbian), the left side."
    "examples":
      "床在右边。": "The bed is on the right."
      "钥匙在右边吗？": "Is the key on the right?"
  "zh-0528":
    "native": "middle; the centre"
    "notes":
      "n1": "The middle, of a room or a group. 中间 (zhōngjiān) is the middle point between the two sides."
    "examples":
      "桌子在中间。": "The table is in the middle."
      "椅子在中间吗？": "Is the chair in the middle?"
  "zh-0529":
    "native": "outside"
    "notes":
      "n1": "Outside, or the outside of a place. Its opposite is 里 (lǐ), inside."
    "examples":
      "外面很冷。": "It is cold outside."
      "你在外面吗？": "Are you outside?"
  "zh-0530":
    "native": "thing; things"
    "notes":
      "n1": "A thing, or things of any kind. It is the everyday word for an object. 东 (dōng) and 西 (xī) on their own are east and west."
    "examples":
      "东西在桌子上。": "The things are on the table."
      "东西很多。": "There are many things."
  "zh-0531":
    "native": "key"
    "notes":
      "n1": "A key, for a door, a lock or a box."
    "examples":
      "钥匙在哪里？": "Where is the key?"
      "钥匙在床上吗？": "Is the key on the bed?"
  "zh-0532":
    "native": "table; desk"
    "notes":
      "n1": "A table or a desk. It is the piece of furniture you put things on."
    "examples":
      "桌子很大。": "The table is very big."
      "茶在桌子上。": "The tea is on the table."
  "zh-0533":
    "native": "chair"
    "notes":
      "n1": "A chair, for one person to sit on."
    "examples":
      "椅子很旧。": "The chair is very old."
      "你坐在椅子上吗？": "Are you sitting on the chair?"
  "zh-0534":
    "native": "bed"
    "notes":
      "n1": "A bed, for sleeping on."
    "examples":
      "床很小。": "The bed is very small."
      "你在床上吗？": "Are you on the bed?"
  "zh-0535":
    "native": "here"
    "notes":
      "n1": "Here, in this place. Its opposite is 那儿 (nàr), there."
    "examples":
      "这儿很好。": "It is good here."
      "这儿很安静。": "It is quiet here."
  "zh-0536":
    "native": "there"
    "notes":
      "n1": "There, in that place. Its opposite is 这儿 (zhèr), here."
    "examples":
      "那儿很远。": "It is far there."
      "钥匙在那儿。": "The key is over there."
  "zh-0599":
    "native": "Place words"
    "explanation": "Words for where something is: 里 (lǐ) in, 上 (shàng) on, 下 (xià) under, 前面 (qiánmiàn) in front, 后面 (hòumiàn) behind, 旁边 (pángbiān) beside, 左边 (zuǒbian) left, 右边 (yòubian) right, 中间 (zhōngjiān) middle and 外面 (wàimiàn) outside."
