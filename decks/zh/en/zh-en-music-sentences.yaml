"cards":
  "zh-2088":
    "confusables":
      "w1":
        "why": "唱歌 (chànggē) is to sing, another music activity."
      "w2":
        "why": "跳舞 (tiàowǔ) is to dance, another activity."
    "native": "I like listening to music."
  "zh-2089":
    "confusables":
      "w1":
        "why": "作曲 (zuòqǔ) is to compose, a different job."
      "w2":
        "why": "指挥 (zhǐhuī) is to conduct, a different job."
    "native": "She is a singer."
  "zh-2090":
    "confusables":
      "w1":
        "why": "钢琴 (gāngqín) is a piano, an instrument."
      "w2":
        "why": "吉他 (jítā) is a guitar, an instrument."
    "native": "This instrument is expensive."
  "zh-2091":
    "confusables":
      "w1":
        "why": "难听 (nántīng) is unpleasant, the opposite."
      "w2":
        "why": "安静 (ānjìng) is quiet, a different quality."
    "native": "The sound is very nice."
  "zh-2092":
    "confusables":
      "w1":
        "why": "独唱 (dúchàng) is to sing alone, the opposite."
      "w2":
        "why": "伴奏 (bànzòu) is the accompaniment, not singing."
    "native": "Let us sing together."
  "zh-2093":
    "confusables":
      "w1":
        "why": "作词 (zuòcí) is to write lyrics, a different task."
      "w2":
        "why": "指挥 (zhǐhuī) is to conduct, a different task."
    "bases":
      "会":
        "meaning": "can; to know how to"
    "native": "He can compose music."
  "zh-2094":
    "confusables":
      "w1":
        "why": "演唱会 (yǎnchànghuì) is a concert of singers, a close word."
      "w2":
        "why": "乐队 (yuèduì) is a band, a group of players."
    "native": "The concert is at seven in the evening."
  "zh-2095":
    "confusables":
      "w1":
        "why": "歌曲 (gēqǔ) is the song, not its words."
      "w2":
        "why": "歌手 (gēshǒu) is the singer, a person."
    "bases":
      "首":
        "meaning": "the measure word for a song or a poem"
      "的":
        "meaning": "a particle: of; belonging to"
      "有":
        "meaning": "to have; there is"
      "意思":
        "meaning": "meaning; interest"
    "native": "The lyrics of this song are very interesting."
