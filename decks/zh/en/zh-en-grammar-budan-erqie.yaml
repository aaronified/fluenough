"name": "不但 (bú dàn) ... 而且 (érqiě): not only ... but also"
"license": "CC-BY-SA-4.0"
"description": "不但 (bú dàn) ... 而且 (érqiě) adds a second point to the first: 他不但聪明 (tā búdàn cōngming)，而且努力 (tā búdàn cōngming, érqiě nǔlì), he is not only clever but also hard-working. 还 (hái) can replace 而且 (érqiě) in speech. Not yet checked by a Mandarin speaker: please report any mistake."
"tags":
- "unreviewed"
"pattern":
  "name": "不但 (bú dàn) ... 而且 (érqiě): not only ... but also"
  "slot_name": "form"
  "prompt": "{lemma} ({gloss}), {slot}"
  "slots":
    "plain": "a plain statement with 很 (hěn)"
    "both": "不但 (bú dàn) before the first point, then 而且 (érqiě) before the second"
    "also": "不但 (bú dàn) before the first point, then 还 (hái) before the second"
  "entries":
    "congming": "clever"
    "piaoliang": "pretty"
    "pianyi": "cheap"
  "notes": "不但 (bú dàn) starts the first point and 而且 (érqiě) or 还 (hái) starts the second: 他不但聪明 (tā búdàn cōngming)，而且努力 (tā búdàn cōngming, érqiě nǔlì), he is not only clever but also hard-working. Both points should be the same kind of thing: two adjectives, or two verbs. 不但 (bú dàn) is written with the second syllable in the neutral tone when it is spoken fast. The second point is usually the stronger one."
