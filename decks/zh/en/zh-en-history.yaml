"cards":
  "zh-3818":
    "native": "history"
    "notes":
      "n1": "The past of a people or place. 历 (lì) is to pass through, and 史 (shǐ) is history."
    "examples":
      "我喜欢历史。": "I like history."
      "这座城市的历史很长。":
        "native": "This city has a long history."
        "bases":
          "座":
            "meaning": "measure word for mountains and buildings"
          "的":
            "meaning": "of"
  "zh-3819":
    "native": "ancient times"
    "notes":
      "n1": "A long time ago. 古 (gǔ) is ancient, and 代 (dài) is an age."
    "examples":
      "古代的人很聪明。":
        "native": "People in ancient times were clever."
        "bases":
          "的":
            "meaning": "of"
      "古代有很多故事。":
        "native": "There are many stories from ancient times."
        "bases":
          "有":
            "meaning": "to have"
  "zh-3820":
    "native": "modern times"
    "notes":
      "n1": "The present age. 现 (xiàn) is now, and 代 (dài) is an age."
    "examples":
      "现代城市很大。": "Modern cities are very big."
      "现代生活很方便。":
        "native": "Modern life is very convenient."
        "bases":
          "生活":
            "meaning": "life"
  "zh-3821":
    "native": "modern period (19th-20th century)"
    "notes":
      "n1": "The period before the present. 近 (jìn) is near, and 代 (dài) is an age."
    "examples":
      "近代的历史很复杂。":
        "native": "The modern period's history is very complicated."
        "bases":
          "的":
            "meaning": "of"
      "这是近代的照片。":
        "native": "This is a photo from the modern period."
        "bases":
          "的":
            "meaning": "of"
  "zh-3822":
    "native": "dynasty"
    "notes":
      "n1": "A ruling family and its period. 朝 (cháo) is a court, and 代 (dài) is an age."
    "examples":
      "每个朝代都不同。":
        "native": "Each dynasty was different."
        "bases":
          "不同":
            "meaning": "different"
      "这个朝代很长。": "This dynasty lasted a long time."
  "zh-3823":
    "native": "emperor"
    "notes":
      "n1": "The ruler of an empire. 皇 (huáng) is emperor, and 帝 (dì) is ruler."
    "examples":
      "皇帝住在皇宫里。": "The emperor lived in the palace."
      "这位皇帝很有名。": "This emperor is very famous."
  "zh-3824":
    "native": "dynasty; royal house"
    "notes":
      "n1": "A line of rulers from one family. 王 (wáng) is king, and 朝 (cháo) is a court."
    "examples":
      "这个王朝很强大。":
        "native": "This dynasty was very powerful."
        "bases":
          "强大":
            "meaning": "powerful"
      "王朝结束了。":
        "native": "The dynasty came to an end."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3825":
    "native": "Warring States period"
    "notes":
      "n1": "The period when many kingdoms fought each other. 战 (zhàn) is war, and 国 (guó) is a country."
    "examples":
      "战国时期很乱。": "The Warring States period was chaotic."
      "战国的历史很长。":
        "native": "The history of the Warring States is very long."
        "bases":
          "的":
            "meaning": "of"
  "zh-3826":
    "native": "Han (dynasty or people)"
    "notes":
      "n1": "The Han dynasty, or the Han people. 汉 (Hàn) is the name of a dynasty and people."
    "examples":
      "汉朝很长。":
        "native": "The Han dynasty lasted a long time."
        "bases":
          "汉朝":
            "meaning": "the Han dynasty"
      "汉人很多。":
        "native": "There are many Han people."
        "bases":
          "汉人":
            "meaning": "Han people"
  "zh-3827":
    "native": "Tang (dynasty)"
    "notes":
      "n1": "The Tang dynasty. 唐 (Táng) is the name of a famous dynasty."
    "examples":
      "唐朝很强大。":
        "native": "The Tang dynasty was very powerful."
        "bases":
          "唐朝":
            "meaning": "the Tang dynasty"
          "强大":
            "meaning": "powerful"
      "唐代的诗很有名。":
        "native": "Tang poetry is very famous."
        "bases":
          "唐代":
            "meaning": "the Tang period"
          "的":
            "meaning": "of"
  "zh-3828":
    "native": "Song (dynasty)"
    "notes":
      "n1": "The Song dynasty. 宋 (Sòng) is the name of a dynasty."
    "examples":
      "宋朝的画很美。":
        "native": "Song dynasty paintings are very beautiful."
        "bases":
          "宋朝":
            "meaning": "the Song dynasty"
          "的":
            "meaning": "of"
          "美":
            "meaning": "beautiful"
      "宋代的城市很大。":
        "native": "The cities of the Song dynasty were very big."
        "bases":
          "宋代":
            "meaning": "the Song period"
          "的":
            "meaning": "of"
  "zh-3829":
    "native": "revolution"
    "notes":
      "n1": "A great change in power or society. 革 (gé) is to reform, and 命 (mìng) is fate."
    "examples":
      "革命改变了国家。":
        "native": "The revolution changed the country."
        "bases":
          "了":
            "meaning": "a particle"
      "这次革命很重要。": "This revolution was very important."
  "zh-3830":
    "native": "to become independent"
    "notes":
      "n1": "To be free of control by others. 独 (dú) is alone, and 立 (lì) is to stand."
    "examples":
      "这个国家独立了。":
        "native": "This country became independent."
        "bases":
          "了":
            "meaning": "a particle"
      "独立的日子很重要。":
        "native": "The day of independence is very important."
        "bases":
          "的":
            "meaning": "of"
          "日子":
            "meaning": "day; days"
  "zh-3831":
    "native": "to colonise"
    "notes":
      "n1": "To take control of another land. 殖 (zhí) is to settle, and 民 (mín) is people."
    "examples":
      "那个国家被殖民了。":
        "native": "That country was colonised."
        "bases":
          "被":
            "meaning": "a particle for the passive"
          "了":
            "meaning": "a particle"
      "殖民时期很长。": "The colonial period was very long."
  "zh-3832":
    "native": "battle"
    "notes":
      "n1": "A major fight in a war. 战 (zhàn) is war, and 役 (yì) is a campaign."
    "examples":
      "这场战役很激烈。":
        "native": "This battle was very fierce."
        "bases":
          "激烈":
            "meaning": "fierce"
      "战役的结果很重要。":
        "native": "The result of the battle was very important."
        "bases":
          "的":
            "meaning": "of"
          "结果":
            "meaning": "result"
  "zh-3833":
    "native": "peace treaty"
    "notes":
      "n1": "A formal agreement that ends a war. 和 (hé) is peace, and 约 (yuē) is an agreement."
    "examples":
      "两国签了和约。":
        "native": "The two countries signed a peace treaty."
        "bases":
          "签":
            "meaning": "to sign"
          "了":
            "meaning": "a particle"
      "和约改变了历史。":
        "native": "The peace treaty changed history."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3834":
    "native": "treaty"
    "notes":
      "n1": "A formal written agreement between countries. 条 (tiáo) is an article, and 约 (yuē) is an agreement."
    "examples":
      "这是一个重要条约。": "This is an important treaty."
      "条约需要签字。": "The treaty needs to be signed."
  "zh-3835":
    "native": "civilisation"
    "notes":
      "n1": "A society with writing, cities and learning. 文 (wén) is writing, and 明 (míng) is bright."
    "examples":
      "古埃及是一个文明。":
        "native": "Ancient Egypt was a civilisation."
        "bases":
          "古":
            "meaning": "ancient"
          "埃及":
            "meaning": "Egypt"
      "中国文明很长。": "China's civilisation is very long."
  "zh-3836":
    "native": "ruins; site"
    "notes":
      "n1": "The place where old buildings once stood. 遗 (yí) is to leave behind, and 址 (zhǐ) is a site."
    "examples":
      "这个遗址很古老。": "This site is very ancient."
      "我们参观了遗址。":
        "native": "We visited the ruins."
        "bases":
          "参观":
            "meaning": "to visit"
          "了":
            "meaning": "a particle"
  "zh-3837":
    "native": "cultural relic"
    "notes":
      "n1": "Old objects of value from the past. 文 (wén) is culture, and 物 (wù) is a thing."
    "examples":
      "博物馆有很多文物。":
        "native": "The museum has many relics."
        "bases":
          "有":
            "meaning": "to have"
      "文物要保护。":
        "native": "Relics must be protected."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-3838":
    "native": "historic site"
    "notes":
      "n1": "A place from the past that is still standing. 古 (gǔ) is ancient, and 迹 (jì) is a trace."
    "examples":
      "这里有很多古迹。":
        "native": "There are many historic sites here."
        "bases":
          "这里":
            "meaning": "here"
          "有":
            "meaning": "to have"
      "古迹很美。":
        "native": "The historic sites are very beautiful."
        "bases":
          "美":
            "meaning": "beautiful"
  "zh-3839":
    "native": "document; literature (historical)"
    "notes":
      "n1": "Written records from the past. 文 (wén) is writing, and 献 (xiàn) is to offer."
    "examples":
      "这份文献很重要。": "This document is very important."
      "他研究古代文献。": "He studies ancient documents."
  "zh-3840":
    "native": "historian"
    "notes":
      "n1": "A person who studies history. 历史 (lìshǐ) is history, 学 (xué) is study, and 家 (jiā) is an expert."
    "examples":
      "她是历史学家。":
        "native": "She is a historian."
        "bases":
          "学家":
            "meaning": "expert"
      "历史学家写了一本书。":
        "native": "The historian wrote a book."
        "bases":
          "学家":
            "meaning": "expert"
          "了":
            "meaning": "a particle"
  "zh-3841":
    "native": "history book"
    "notes":
      "n1": "A book that records the past. 史 (shǐ) is history, and 书 (shū) is a book."
    "examples":
      "这本史书很厚。": "This history book is very thick."
      "史书记录了这件事。":
        "native": "The history book recorded this event."
        "bases":
          "记录":
            "meaning": "record"
          "了":
            "meaning": "a particle"
          "事":
            "meaning": "matter"
  "zh-3842":
    "native": "Forbidden City"
    "notes":
      "n1": "The old imperial palace in Beijing. 故 (gù) is old, and 宫 (gōng) is a palace."
    "examples":
      "故宫在北京。":
        "native": "The Forbidden City is in Beijing."
        "bases":
          "北京":
            "meaning": "Beijing"
      "故宫很大。": "The Forbidden City is very big."
  "zh-3843":
    "native": "Great Wall"
    "notes":
      "n1": "The long wall built to defend China. 长 (cháng) is long, and 城 (chéng) is a wall."
    "examples":
      "长城很长。": "The Great Wall is very long."
      "我们去爬长城。":
        "native": "We went to climb the Great Wall."
        "bases":
          "爬":
            "meaning": "to climb"
  "zh-3844":
    "native": "Silk Road"
    "notes":
      "n1": "The old trade route between China and the West. 丝 (sī) is silk, 绸 (chóu) is silk cloth, 之 (zhī) is of, and 路 (lù) is a road."
    "examples":
      "丝绸之路很有名。":
        "native": "The Silk Road is very famous."
        "bases":
          "丝绸":
            "meaning": "silk"
          "之":
            "meaning": "of"
      "丝绸之路很长。":
        "native": "The Silk Road is very long."
        "bases":
          "丝绸":
            "meaning": "silk"
          "之":
            "meaning": "of"
  "zh-3845":
    "native": "imperial examinations"
    "notes":
      "n1": "The exam system used to choose officials in China. 科 (kē) is a subject, and 举 (jǔ) is to select."
    "examples":
      "科举考试很难。": "The imperial examinations were very hard."
      "科举制度很久。":
        "native": "The examination system lasted a long time."
        "bases":
          "制度":
            "meaning": "system"
          "久":
            "meaning": "long (of time)"
  "zh-3846":
    "native": "Confucianism"
    "notes":
      "n1": "The school of thought of Confucius. 儒 (rú) is a scholar, and 家 (jiā) is a school."
    "examples":
      "儒家的思想很重要。":
        "native": "The ideas of Confucianism are very important."
        "bases":
          "的":
            "meaning": "of"
          "思想":
            "meaning": "thought; ideas"
      "儒家讲礼。":
        "native": "Confucianism stresses ritual."
        "bases":
          "礼":
            "meaning": "ritual; courtesy"
  "zh-3847":
    "native": "Daoism"
    "notes":
      "n1": "A school of thought about the Way. 道 (dào) is the Way, and 家 (jiā) is a school."
    "examples":
      "道家的思想很深。":
        "native": "The ideas of Daoism are very deep."
        "bases":
          "的":
            "meaning": "of"
          "思想":
            "meaning": "thought; ideas"
          "深":
            "meaning": "deep"
      "道家讲自然。":
        "native": "Daoism stresses nature."
        "bases":
          "自然":
            "meaning": "nature"
  "zh-3848":
    "native": "Buddhism"
    "notes":
      "n1": "A religion from India. 佛 (fó) is Buddha, and 教 (jiào) is a religion."
    "examples":
      "佛教很古老。": "Buddhism is very ancient."
      "很多人信佛教。":
        "native": "Many people follow Buddhism."
        "bases":
          "信":
            "meaning": "to believe"
  "zh-3849":
    "native": "Confucius"
    "notes":
      "n1": "A famous Chinese teacher and thinker. 孔 (Kǒng) is a surname, and 子 (zǐ) is a respectful title."
    "examples":
      "孔子很有名。": "Confucius is very famous."
      "孔子说了很多话。":
        "native": "Confucius said many things."
        "bases":
          "了":
            "meaning": "a particle"
          "话":
            "meaning": "words; speech"
  "zh-3850":
    "native": "feudal lord"
    "notes":
      "n1": "A ruler of a small state under an emperor. 诸 (zhū) is many, and 侯 (hóu) is a lord."
    "examples":
      "诸侯打仗了。":
        "native": "The feudal lords went to war."
        "bases":
          "打仗":
            "meaning": "to fight a war"
          "了":
            "meaning": "a particle"
      "诸侯很多。": "There were many feudal lords."
  "zh-3851":
    "native": "imperial palace"
    "notes":
      "n1": "The palace where an emperor lived. 皇 (huáng) is emperor, and 宫 (gōng) is a palace."
    "examples":
      "皇宫很大。": "The imperial palace is very big."
      "皇宫里有很多宫殿。":
        "native": "There are many halls in the imperial palace."
        "bases":
          "有":
            "meaning": "to have"
  "zh-3852":
    "native": "palace; grand hall"
    "notes":
      "n1": "A large and grand building. 宫 (gōng) is a palace, and 殿 (diàn) is a hall."
    "examples":
      "这座宫殿很美。":
        "native": "This palace is very beautiful."
        "bases":
          "座":
            "meaning": "measure word for mountains and buildings"
          "美":
            "meaning": "beautiful"
      "宫殿很古老。": "The palace is very ancient."
  "zh-3853":
    "native": "castle; fortress"
    "notes":
      "n1": "A strong building with walls. 城 (chéng) is a city wall, and 堡 (bǎo) is a fortress."
    "examples":
      "这个城堡很大。": "This castle is very big."
      "城堡在山上。": "The castle is on the mountain."
  "zh-3854":
    "native": "slave"
    "notes":
      "n1": "A person owned by someone else. 奴 (nú) is a slave, and 隶 (lì) is a servant."
    "examples":
      "古代有奴隶。":
        "native": "There were slaves in ancient times."
        "bases":
          "有":
            "meaning": "to have"
      "奴隶制度很残酷。":
        "native": "The slavery system was very cruel."
        "bases":
          "制度":
            "meaning": "system"
          "残酷":
            "meaning": "cruel"
  "zh-3855":
    "native": "to revolt"
    "notes":
      "n1": "To rise up against rulers. 起 (qǐ) is to rise, and 义 (yì) is justice."
    "examples":
      "农民起义了。":
        "native": "The peasants revolted."
        "bases":
          "了":
            "meaning": "a particle"
      "起义的人很多。":
        "native": "Many people rose up."
        "bases":
          "的":
            "meaning": "of"
  "zh-3856":
    "native": "to unify"
    "notes":
      "n1": "To bring different parts together as one. 统 (tǒng) is to unify, and 一 (yī) is one."
    "examples":
      "国家统一了。":
        "native": "The country was unified."
        "bases":
          "了":
            "meaning": "a particle"
      "统一是很重要的。":
        "native": "Unity is very important."
        "bases":
          "的":
            "meaning": "of"
  "zh-3857":
    "native": "to split"
    "notes":
      "n1": "To break into parts. 分 (fēn) is to divide, and 裂 (liè) is to crack."
    "examples":
      "国家分裂了。":
        "native": "The country split."
        "bases":
          "了":
            "meaning": "a particle"
      "分裂很可惜。":
        "native": "The split is a pity."
        "bases":
          "可惜":
            "meaning": "a pity"
  "zh-3858":
    "native": "prosperous"
    "notes":
      "n1": "Full of trade and wealth. 繁 (fán) is many, and 荣 (róng) is flourishing."
    "examples":
      "那个时代很繁荣。":
        "native": "That age was very prosperous."
        "bases":
          "时代":
            "meaning": "age"
      "城市很繁荣。": "The city is very prosperous."
  "zh-3859":
    "native": "to decline"
    "notes":
      "n1": "To become weaker and less important. 衰 (shuāi) is to decline, and 落 (luò) is to fall."
    "examples":
      "王朝开始衰落。": "The dynasty began to decline."
      "城市慢慢衰落了。":
        "native": "The city slowly declined."
        "bases":
          "慢慢":
            "meaning": "slowly"
          "了":
            "meaning": "a particle"
  "zh-3860":
    "native": "to rise suddenly"
    "notes":
      "n1": "To rise to power or success. 崛 (jué) is to rise, and 起 (qǐ) is to rise."
    "examples":
      "这个国家崛起了。":
        "native": "This country rose to power."
        "bases":
          "了":
            "meaning": "a particle"
      "城市正在崛起。":
        "native": "The city is rising quickly."
        "bases":
          "正在":
            "meaning": "in the middle of"
  "zh-3861":
    "native": "figure; character"
    "notes":
      "n1": "A famous person in history or a story. 人 (rén) is a person, and 物 (wù) is a thing."
    "examples":
      "他是历史人物。": "He is a historical figure."
      "这本书写了很多人物。":
        "native": "This book describes many figures."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3862":
    "native": "tradition"
    "notes":
      "n1": "A custom that is passed down. 传 (chuán) is to pass on, and 统 (tǒng) is a line."
    "examples":
      "传统很重要。": "Tradition is very important."
      "这是中国的传统。":
        "native": "This is a Chinese tradition."
        "bases":
          "的":
            "meaning": "of"
  "zh-3863":
    "native": "culture"
    "notes":
      "n1": "The beliefs and arts of a people. 文 (wén) is writing, and 化 (huà) is to change."
    "examples":
      "中国文化很长。": "Chinese culture is very long."
      "我喜欢中国文化。": "I like Chinese culture."
  "zh-3864":
    "native": "ancient"
    "notes":
      "n1": "Very old. 古 (gǔ) is ancient, and 老 (lǎo) is old."
    "examples":
      "这是古老的城市。":
        "native": "This is an ancient city."
        "bases":
          "的":
            "meaning": "of"
      "古老的房子很美。":
        "native": "The old house is very beautiful."
        "bases":
          "的":
            "meaning": "of"
          "美":
            "meaning": "beautiful"
  "zh-3865":
    "native": "to occupy"
    "notes":
      "n1": "To take control of a place by force. 占 (zhàn) is to occupy, and 领 (lǐng) is to lead."
    "examples":
      "军队占领了这座城。":
        "native": "The army occupied the city."
        "bases":
          "军队":
            "meaning": "army"
          "了":
            "meaning": "a particle"
          "座":
            "meaning": "measure word for mountains and buildings"
