"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-4008":
    "native": "relationship"
    "notes":
      "n1": "The way two people or things are connected. 关 (guān) is a link, and 系 (xì) is to connect."
    "examples":
      "我们的关系很好。":
        "native": "Our relationship is very good."
        "bases":
          "的":
            "meaning": "of"
      "他和她关系很近。":
        "native": "He and she are very close."
        "bases":
          "和":
            "meaning": "and"
  "zh-4009":
    "native": "fellow townsman"
    "notes":
      "n1": "A person from the same home area. 老 (lǎo) is old or familiar, and 乡 (xiāng) is a village."
    "examples":
      "他是我的老乡。":
        "native": "He is from the same home area as me."
        "bases":
          "的":
            "meaning": "of"
      "老乡之间很亲。":
        "native": "People from the same home area are close."
        "bases":
          "之间":
            "meaning": "between"
          "亲":
            "meaning": "close; dear"
  "zh-4010":
    "native": "roommate"
    "notes":
      "n1": "A person who shares a room. 室 (shì) is a room, and 友 (yǒu) is a friend."
    "examples":
      "我的室友很好。":
        "native": "My roommate is very good."
        "bases":
          "的":
            "meaning": "of"
      "室友每天一起吃饭。":
        "native": "My roommates eat together every day."
        "bases":
          "每天":
            "meaning": "every day"
  "zh-4011":
    "native": "relatives; loved ones"
    "notes":
      "n1": "People in your family. 亲 (qīn) is close, and 人 (rén) is a person."
    "examples":
      "我想念亲人。": "I miss my family."
      "亲人很重要。": "Family is very important."
  "zh-4012":
    "native": "brothers"
    "notes":
      "n1": "Brothers. 兄 (xiōng) is an older brother, and 弟 (dì) is a younger brother."
    "examples":
      "他有两个兄弟。":
        "native": "He has two brothers."
        "bases":
          "有":
            "meaning": "to have; there is"
      "兄弟之间要互相帮助。":
        "native": "Brothers should help each other."
        "bases":
          "之间":
            "meaning": "between"
          "要":
            "meaning": "to want"
          "互相":
            "meaning": "each other"
  "zh-4013":
    "native": "sisters"
    "notes":
      "n1": "Sisters. 姐 (jiě) is an older sister, and 妹 (mèi) is a younger sister."
    "examples":
      "她们是姐妹。": "They are sisters."
      "姐妹很亲密。": "The sisters are very close."
  "zh-4014":
    "native": "maternal grandfather"
    "notes":
      "n1": "Your mother's father. 外 (wài) is outer, and 公 (gōng) is a grandfather."
    "examples":
      "外公很和蔼。":
        "native": "My grandfather on my mother's side is very kind."
        "bases":
          "和蔼":
            "meaning": "kind and gentle"
      "我去看外公。": "I go to see my maternal grandfather."
  "zh-4015":
    "native": "maternal grandmother"
    "notes":
      "n1": "Your mother's mother. 外 (wài) is outer, and 婆 (pó) is a grandmother."
    "examples":
      "外婆做的饭很好吃。":
        "native": "The food grandmother makes is very tasty."
        "bases":
          "的":
            "meaning": "of"
      "外婆很爱我。": "Grandmother loves me very much."
  "zh-4016":
    "native": "uncle (father's younger brother)"
    "notes":
      "n1": "Your father's younger brother. 叔 (shū) is an uncle."
    "examples":
      "叔叔来了。":
        "native": "Uncle has come."
        "bases":
          "了":
            "meaning": "a particle"
      "我的叔叔很高。":
        "native": "My uncle is very tall."
        "bases":
          "的":
            "meaning": "of"
  "zh-4017":
    "native": "aunt; a respectful term for a woman"
    "notes":
      "n1": "A word for an aunt or a woman of mother's age. 阿 (ā) is a prefix, and 姨 (yí) is an aunt."
    "examples":
      "阿姨很热情。": "The aunt is very warm."
      "阿姨做饭很好。": "The aunt cooks very well."
  "zh-4018":
    "native": "uncle (mother's brother)"
    "notes":
      "n1": "Your mother's brother. 舅 (jiù) is a maternal uncle."
    "examples":
      "舅舅住在北京。":
        "native": "My uncle lives in Beijing."
        "bases":
          "北京":
            "meaning": "Beijing"
      "舅舅很会说话。":
        "native": "My uncle is very good at talking."
        "bases":
          "会":
            "meaning": "can; to know how to"
          "说话":
            "meaning": "to talk"
  "zh-4019":
    "native": "aunt (father's sister)"
    "notes":
      "n1": "Your father's sister. 姑 (gū) is an aunt."
    "examples":
      "姑姑有两个孩子。":
        "native": "My aunt has two children."
        "bases":
          "有":
            "meaning": "to have; there is"
      "姑姑很喜欢旅游。": "My aunt loves travel."
  "zh-4020":
    "native": "older male cousin"
    "notes":
      "n1": "A male cousin older than you. 表 (biǎo) is a cousin, and 哥 (gē) is an older brother."
    "examples":
      "我的表哥很高。":
        "native": "My older male cousin is very tall."
        "bases":
          "的":
            "meaning": "of"
      "表哥在大学工作。": "My older male cousin works at a university."
  "zh-4021":
    "native": "younger female cousin"
    "notes":
      "n1": "A female cousin younger than you. 表 (biǎo) is a cousin, and 妹 (mèi) is a younger sister."
    "examples":
      "表妹很可爱。": "My younger female cousin is very cute."
      "我和表妹一起玩。":
        "native": "My cousin and I play together."
        "bases":
          "和":
            "meaning": "and"
  "zh-4022":
    "native": "grandson"
    "notes":
      "n1": "A son of one's son. 孙 (sūn) is a grandchild, and 子 (zi) is a child."
    "examples":
      "他有一个孙子。":
        "native": "He has a grandson."
        "bases":
          "有":
            "meaning": "to have; there is"
      "孙子很聪明。": "The grandson is very clever."
  "zh-4023":
    "native": "granddaughter"
    "notes":
      "n1": "A daughter of one's son. 孙 (sūn) is a grandchild, and 女 (nǚ) is a girl."
    "examples":
      "她有一个孙女。":
        "native": "She has a granddaughter."
        "bases":
          "有":
            "meaning": "to have; there is"
      "孙女很可爱。": "The granddaughter is very cute."
  "zh-4024":
    "native": "lover"
    "notes":
      "n1": "A person you are in love with. 恋 (liàn) is to love, and 人 (rén) is a person."
    "examples":
      "他们是恋人。": "They are lovers."
      "恋人之间要信任。":
        "native": "Lovers must trust each other."
        "bases":
          "之间":
            "meaning": "between"
          "要":
            "meaning": "to want"
  "zh-4025":
    "native": "partner; companion"
    "notes":
      "n1": "A person who works or plays with you. 伙 (huǒ) is a group, and 伴 (bàn) is a companion."
    "examples":
      "他是我的好伙伴。":
        "native": "He is my good partner."
        "bases":
          "的":
            "meaning": "of"
      "伙伴们一起工作。":
        "native": "The partners work together."
        "bases":
          "伙伴们":
            "meaning": "partners"
  "zh-4026":
    "native": "partner (in work)"
    "notes":
      "n1": "A person who works with you as a team. 搭 (dā) is to team up, and 档 (dàng) is a partner."
    "examples":
      "他是我的搭档。":
        "native": "He is my working partner."
        "bases":
          "的":
            "meaning": "of"
      "搭档很默契。": "The partners work in perfect harmony."
  "zh-4027":
    "native": "close friend; soul mate"
    "notes":
      "n1": "A friend who understands you very well. 知 (zhī) is to know, and 己 (jǐ) is oneself."
    "examples":
      "她是我的知己。":
        "native": "She is my close friend."
        "bases":
          "的":
            "meaning": "of"
      "知己很难找。": "A true friend is hard to find."
  "zh-4028":
    "native": "to trust"
    "notes":
      "n1": "To believe someone is honest. 信 (xìn) is to believe, and 任 (rèn) is to trust."
    "examples":
      "我信任你。": "I trust you."
      "信任很重要。": "Trust is very important."
  "zh-4029":
    "native": "to accompany"
    "notes":
      "n1": "To keep someone company. 陪 (péi) is to accompany, and 伴 (bàn) is a companion."
    "examples":
      "她陪伴着我。":
        "native": "She keeps me company."
        "bases":
          "着":
            "meaning": "a particle: a state continues"
      "朋友的陪伴很重要。":
        "native": "A friend's company is very important."
        "bases":
          "的":
            "meaning": "of"
  "zh-4030":
    "native": "to look after"
    "notes":
      "n1": "To care for someone. 照 (zhào) is to shine on, and 顾 (gù) is to look after."
    "examples":
      "她照顾孩子。": "She looks after the child."
      "请照顾好自己。": "Please look after yourself."
  "zh-4031":
    "native": "to care about"
    "notes":
      "n1": "To be concerned about someone. 关 (guān) is to care, and 心 (xīn) is heart."
    "examples":
      "大家关心他。": "Everyone cares about him."
      "谢谢你的关心。":
        "native": "Thank you for your concern."
        "bases":
          "谢谢":
            "meaning": "thank you"
          "的":
            "meaning": "of"
  "zh-4032":
    "native": "misunderstanding"
    "notes":
      "n1": "A wrong idea about someone or something. 误 (wù) is mistaken, and 会 (huì) is to understand."
    "examples":
      "这是一个误会。": "This is a misunderstanding."
      "我们之间有误会。":
        "native": "There is a misunderstanding between us."
        "bases":
          "之间":
            "meaning": "between"
          "有":
            "meaning": "to have; there is"
  "zh-4033":
    "native": "conflict; contradiction"
    "notes":
      "n1": "A disagreement between people. 矛 (máo) is a spear, and 盾 (dùn) is a shield."
    "examples":
      "他们有矛盾。":
        "native": "They have a conflict."
        "bases":
          "有":
            "meaning": "to have; there is"
      "矛盾解决了。":
        "native": "The conflict was resolved."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-4034":
    "native": "to quarrel"
    "notes":
      "n1": "To argue loudly with someone. 吵 (chǎo) is to make a noise, and 架 (jià) is a quarrel."
    "examples":
      "他们吵架了。":
        "native": "They had a quarrel."
        "bases":
          "了":
            "meaning": "a particle"
      "不要吵架。":
        "native": "Do not quarrel."
        "bases":
          "不要":
            "meaning": "do not"
  "zh-4035":
    "native": "to argue"
    "notes":
      "n1": "To quarrel with raised voices. 争 (zhēng) is to contend, and 吵 (chǎo) is to argue loudly."
    "examples":
      "两人争吵起来。":
        "native": "The two began to argue."
        "bases":
          "起来":
            "meaning": "up"
      "争吵很伤感情。": "Quarrels hurt feelings."
  "zh-4036":
    "native": "to make up"
    "notes":
      "n1": "To become friends again after a quarrel. 和 (hé) is harmony, and 好 (hǎo) is good."
    "examples":
      "我们和好了。":
        "native": "We have made up."
        "bases":
          "了":
            "meaning": "a particle"
      "他们很快和好。": "They made up quickly."
  "zh-4037":
    "native": "to separate"
    "notes":
      "n1": "To go in different directions. 分 (fēn) is to divide, and 开 (kāi) is to open or leave."
    "examples":
      "我们分开了。":
        "native": "We went our separate ways."
        "bases":
          "了":
            "meaning": "a particle"
      "朋友之间不要分开。":
        "native": "Friends should not be separated."
        "bases":
          "之间":
            "meaning": "between"
          "不要":
            "meaning": "do not"
  "zh-4038":
    "native": "to break up"
    "notes":
      "n1": "To end a relationship. 分 (fēn) is to part, and 手 (shǒu) is hand."
    "examples":
      "他们分手了。":
        "native": "They broke up."
        "bases":
          "了":
            "meaning": "a particle"
      "分手很难过。": "Breaking up is very sad."
  "zh-4039":
    "native": "to become distant"
    "notes":
      "n1": "To drift apart from someone. 疏 (shū) is distant, and 远 (yuǎn) is far."
    "examples":
      "他和朋友疏远了。":
        "native": "He has become distant from his friends."
        "bases":
          "和":
            "meaning": "and"
          "了":
            "meaning": "a particle"
      "不要疏远家人。":
        "native": "Do not drift away from your family."
        "bases":
          "不要":
            "meaning": "do not"
  "zh-4040":
    "native": "to keep in touch"
    "notes":
      "n1": "To visit each other or keep contact. 来 (lái) is to come, and 往 (wǎng) is to go."
    "examples":
      "我们很少来往。": "We rarely keep in touch."
      "两家人常来往。":
        "native": "The two families often visit each other."
        "bases":
          "常":
            "meaning": "often"
  "zh-4041":
    "native": "to associate"
    "notes":
      "n1": "To mix with others or date someone. 交 (jiāo) is to mix, and 往 (wǎng) is to go."
    "examples":
      "他交往了很多朋友。":
        "native": "He has met many friends."
        "bases":
          "了":
            "meaning": "a particle"
      "我们在交往。": "We are going out together."
  "zh-4042":
    "native": "party; get-together"
    "notes":
      "n1": "A social gathering. 聚 (jù) is to gather, and 会 (huì) is a meeting."
    "examples":
      "今晚有聚会。":
        "native": "There is a get-together tonight."
        "bases":
          "今晚":
            "meaning": "tonight"
          "有":
            "meaning": "to have; there is"
      "聚会很热闹。": "The party was very lively."
  "zh-4043":
    "native": "to miss (the past)"
    "notes":
      "n1": "To think fondly of something gone. 怀 (huái) is to hold in mind, and 念 (niàn) is to remember."
    "examples":
      "我怀念小时候。":
        "native": "I miss my childhood."
        "bases":
          "小时候":
            "meaning": "when young"
      "她怀念老朋友。": "She misses her old friends."
  "zh-4044":
    "native": "loyal"
    "notes":
      "n1": "Faithful and loyal. 忠 (zhōng) is loyal, and 诚 (chéng) is sincere."
    "examples":
      "他对朋友很忠诚。": "He is very loyal to his friends."
      "忠诚的朋友很少。":
        "native": "Loyal friends are rare."
        "bases":
          "的":
            "meaning": "of"
  "zh-4045":
    "native": "friendship"
    "notes":
      "n1": "A relationship between friends. 友 (yǒu) is a friend, and 谊 (yì) is friendship."
    "examples":
      "我们的友谊很深。":
        "native": "Our friendship is very deep."
        "bases":
          "的":
            "meaning": "of"
          "深":
            "meaning": "deep"
      "友谊很珍贵。":
        "native": "Friendship is very precious."
        "bases":
          "珍贵":
            "meaning": "precious"
  "zh-4046":
    "native": "friendly feeling"
    "notes":
      "n1": "The feeling between friends. 友 (yǒu) is a friend, and 情 (qíng) is feeling."
    "examples":
      "这是真正的友情。":
        "native": "This is true friendship."
        "bases":
          "真正":
            "meaning": "truly"
          "的":
            "meaning": "of"
      "友情很长久。":
        "native": "The friendship has lasted a long time."
        "bases":
          "长久":
            "meaning": "lasting"
  "zh-4047":
    "native": "close; intimate"
    "notes":
      "n1": "Very close to each other. 亲 (qīn) is close, and 密 (mì) is dense."
    "examples":
      "他们很亲密。": "They are very close."
      "两人关系很亲密。": "The two have a very close relationship."
  "zh-4048":
    "native": "familiar"
    "notes":
      "n1": "Knowing someone or something well. 熟 (shú) is familiar, and 悉 (xī) is to know."
    "examples":
      "我很熟悉他。": "I know him well."
      "这个地方我很熟悉。": "I know this place well."
  "zh-4049":
    "native": "confidence"
    "notes":
      "n1": "Belief in oneself or others. 信 (xìn) is belief, and 心 (xīn) is heart."
    "examples":
      "我有信心。":
        "native": "I have confidence."
        "bases":
          "有":
            "meaning": "to have; there is"
      "他对朋友很有信心。":
        "native": "He has a lot of faith in his friends."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-4050":
    "native": "tacit understanding"
    "notes":
      "n1": "Understanding without needing to say much. 默 (mò) is silent, and 契 (qì) is a bond."
    "examples":
      "我们很有默契。":
        "native": "We understand each other without words."
        "bases":
          "有":
            "meaning": "to have; there is"
      "他们的默契很好。":
        "native": "Their understanding is very good."
        "bases":
          "的":
            "meaning": "of"
  "zh-4051":
    "native": "to unite"
    "notes":
      "n1": "To work together as one. 团 (tuán) is a group, and 结 (jié) is to join."
    "examples":
      "我们要团结。":
        "native": "We must unite."
        "bases":
          "要":
            "meaning": "to want"
      "大家很团结。": "Everyone is very united."
  "zh-4052":
    "native": "to help each other"
    "notes":
      "n1": "To help one another. 互 (hù) is mutual, and 助 (zhù) is to help."
    "examples":
      "邻居之间要互助。":
        "native": "Neighbours should help each other."
        "bases":
          "之间":
            "meaning": "between"
          "要":
            "meaning": "to want"
      "互助很重要。": "Mutual help is very important."
  "zh-4053":
    "native": "to depend on"
    "notes":
      "n1": "To rely on someone. 依 (yī) is to depend, and 赖 (lài) is to rely on."
    "examples":
      "孩子依赖父母。": "The child depends on the parents."
      "不要过分依赖别人。":
        "native": "Do not depend on others too much."
        "bases":
          "不要":
            "meaning": "do not"
          "过分":
            "meaning": "excessive"
  "zh-4054":
    "native": "hypocritical"
    "notes":
      "n1": "Not sincere, pretending to be good. 虚 (xū) is empty, and 伪 (wěi) is false."
    "examples":
      "他的态度很虚伪。":
        "native": "His attitude is very hypocritical."
        "bases":
          "的":
            "meaning": "of"
      "虚伪的人不可靠。":
        "native": "Hypocritical people cannot be relied on."
        "bases":
          "的":
            "meaning": "of"
  "zh-4055":
    "native": "sincere"
    "notes":
      "n1": "Honest and from the heart. 真 (zhēn) is true, and 诚 (chéng) is sincere."
    "examples":
      "他的感谢很真诚。":
        "native": "His thanks were very sincere."
        "bases":
          "的":
            "meaning": "of"
      "我们要真诚地对待朋友。":
        "native": "We must treat friends sincerely."
        "bases":
          "要":
            "meaning": "to want"
          "地":
            "meaning": "a particle: how it is done"
          "对待":
            "meaning": "to treat"
  "zh-4056":
    "native": "old friend"
    "notes":
      "n1": "A friend you have known for a long time. 老 (lǎo) is old, and 朋友 (péngyou) is a friend."
    "examples":
      "他是我的老朋友。":
        "native": "He is my old friend."
        "bases":
          "的":
            "meaning": "of"
      "老朋友见面很开心。": "It is happy to meet an old friend."
  "zh-4057":
    "native": "unfamiliar; strange"
    "notes":
      "n1": "Not known or familiar. 陌 (mò) is unfamiliar, and 生 (shēng) is new."
    "examples":
      "这里很陌生。":
        "native": "This place is unfamiliar."
        "bases":
          "这里":
            "meaning": "here"
      "他对我很陌生。": "He is a stranger to me."
