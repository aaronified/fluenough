"cards":
  "zh-3402":
    "confusables":
      "w1":
        "why": "好看 (hǎokàn) is nice to look at, a different quality."
      "w2":
        "why": "饱 (bǎo) is full, which is not about looks."
    "bases":
      "看起来":
        "meaning": "looks; seems"
    "native": "This looks very tasty."
  "zh-3403":
    "confusables":
      "w1":
        "why": "忙 (máng) is busy, a different state."
      "w2":
        "why": "困 (kùn) is sleepy, a more specific state."
    "bases":
      "看起来":
        "meaning": "looks; seems"
    "native": "He looks very tired."
  "zh-3404":
    "confusables":
      "w1":
        "why": "听 (tīng) is to listen, a different act."
      "w2":
        "why": "问 (wèn) is to ask, a different act."
    "bases":
      "下去":
        "meaning": "to go on"
    "native": "Please go on speaking."
  "zh-3405":
    "confusables":
      "w1":
        "why": "跑 (pǎo) is to run, a different way to move."
      "w2":
        "why": "坐 (zuò) is to sit, the opposite of walking."
    "bases":
      "不能":
        "meaning": "cannot"
      "下去":
        "meaning": "to go on"
      "了":
        "meaning": "a particle"
    "native": "I cannot walk on any further."
  "zh-3406":
    "confusables":
      "w1":
        "why": "找 (zhǎo) is to look for, not to think of."
      "w2":
        "why": "问 (wèn) is to ask, a different act."
    "bases":
      "了":
        "meaning": "a particle"
    "native": "I have thought of a way."
  "zh-3407":
    "confusables":
      "w1":
        "why": "问题 (wèntí) is a problem, not an answer."
      "w2":
        "why": "回答 (huídá) is to answer, a related act."
    "bases":
      "没":
        "meaning": "not; did not"
    "native": "He has not yet found the answer."
  "zh-3408":
    "confusables":
      "w1":
        "why": "读 (dú) is to read aloud, not to write."
      "w2":
        "why": "看 (kàn) is to look, not to write."
    "bases":
      "故事":
        "meaning": "story"
      "出来":
        "meaning": "to come out; to figure out"
      "了":
        "meaning": "a particle"
    "native": "Have you written out this story?"
  "zh-3409":
    "confusables":
      "w1":
        "why": "听 (tīng) is to listen, a different act."
      "w2":
        "why": "等 (děng) is to wait, a different act."
    "bases":
      "下去":
        "meaning": "to go on"
    "native": "Shall we go on talking, all right?"
