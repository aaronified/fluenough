  "name": "English"
"name": "起来 (qǐlai), 下去 (xiàqu) and 出来 (chūlai): the extended senses of the direction complements"
"description": "Sentences that use the extended senses of the direction words after a verb or adjective: 看起来很好 (it looks good), 说下去 (go on speaking), and 想出来 (think of, work out). Not yet checked by a Mandarin speaker: please report any mistake."
