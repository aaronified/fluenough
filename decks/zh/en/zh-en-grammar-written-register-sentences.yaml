"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Written style in sentences"
"description": "Sentences in the written style of notices and news, such as 会议明天举行 (huìyì míngtiān jǔxíng), the meeting will be held tomorrow. Not yet checked by a Mandarin speaker: please report any mistake."
