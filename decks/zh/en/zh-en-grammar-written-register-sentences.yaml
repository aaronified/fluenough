"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-4868":
    "confusables":
      "w1":
        "why": "开会 (kāihuì) is the spoken word for having a meeting."
      "w2":
        "why": "参加 (cānjiā) is to attend, not to hold."
    "native": "The meeting will be held tomorrow."
  "zh-4869":
    "confusables":
      "w1":
        "why": "允许 (yǔnxǔ) is to allow, the opposite of forbid."
      "w2":
        "why": "拍照 (pāizhào) is to take photos, another notice."
    "bases":
      "这里":
        "meaning": "here"
    "native": "No parking here."
  "zh-4870":
    "confusables":
      "w1":
        "why": "暂停 (zàntíng) is to pause, not to cancel."
      "w2":
        "why": "举行 (jǔxíng) is to hold, the opposite of cancel."
    "bases":
      "的":
        "meaning": "a particle: of; the thing belonging to"
    "native": "Tomorrow's meeting is cancelled."
  "zh-4871":
    "confusables":
      "w1":
        "why": "告诉 (gàosu) is to tell, the spoken word."
      "w2":
        "why": "说 (shuō) is to say, a spoken word."
    "native": "The school has notified us of a meeting tomorrow."
  "zh-4872":
    "confusables":
      "w1":
        "why": "付钱 (fùqián) is to pay money, the spoken phrase."
      "w2":
        "why": "收费 (shōufèi) is to charge a fee, not to pay it."
    "native": "Please pay the fee."
  "zh-4873":
    "confusables":
      "w1":
        "why": "开会 (kāihuì) is the spoken word for having a meeting."
      "w2":
        "why": "同意 (tóngyì) is to agree, not to attend."
    "bases":
      "及":
        "meaning": "and (written style; spoken 和 (hé))"
      "均":
        "meaning": "all; both (written style; spoken 都 (dōu))"
    "native": "The teachers and students all attended the meeting."
  "zh-4874":
    "confusables":
      "w1":
        "why": "已经 (yǐjīng) is the spoken word for already."
      "w2":
        "why": "护照 (hùzhào) is a passport, not a visa."
    "bases":
      "已":
        "meaning": "already (written style; spoken 已经 (yǐjīng))"
    "native": "He has already applied for a visa."
  "zh-4875":
    "confusables":
      "w1":
        "why": "感谢 (gǎnxiè) is to thank, not to welcome."
      "w2":
        "why": "请 (qǐng) is please, a request."
    "native": "Welcome (to our shop)."
  "zh-4876":
    "confusables":
      "w1":
        "why": "已经 (yǐjīng) is the spoken word for already."
      "w2":
        "why": "暂停 (zàntíng) is to pause, not to cancel."
    "bases":
      "已":
        "meaning": "already (written style; spoken 已经 (yǐjīng))"
    "native": "The meeting has been cancelled."
  "zh-4877":
    "confusables":
      "w1":
        "why": "欢迎 (huānyíng) is to welcome, not to thank."
      "w2":
        "why": "麻烦 (máfan) is to trouble someone, not to thank them."
    "bases":
      "的":
        "meaning": "a particle: of; the thing belonging to"
    "native": "Thank you for coming."
