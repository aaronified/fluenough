"name": "觉得 (juéde) and 认为 (rènwéi): giving an opinion, and 听说 (tīngshuō): reporting what you heard"
"description": "Sentences that give an opinion, such as 我觉得这个很好 (I think this is very good), and that report what someone else said, such as 听说他要来 (I heard he is coming). Not yet checked by a Mandarin speaker: please report any mistake."
