"cards":
  "zh-3052":
    "confusables":
      "w1":
        "why": "想 (xiǎng) is to think, a more general word."
      "w2":
        "why": "喜欢 (xǐhuan) is to like, a feeling rather than a view."
    "native": "I think this book is very good to read."
  "zh-3053":
    "confusables":
      "w1":
        "why": "觉得 (juéde) is to think, a more everyday word."
      "w2":
        "why": "错 (cuò) is wrong, the opposite of right."
    "bases":
      "认为":
        "meaning": "to consider"
    "native": "I do not think this method is right."
  "zh-3054":
    "confusables":
      "w1":
        "why": "容易 (róngyì) is easy, the opposite."
      "w2":
        "why": "简单 (jiǎndān) is simple, a different idea."
    "bases":
      "中文":
        "meaning": "Chinese (the language)"
    "native": "I think Chinese is very difficult."
  "zh-3055":
    "confusables":
      "w1":
        "why": "告诉 (gàosu) is to tell, which is what someone did."
      "w2":
        "why": "问 (wèn) is to ask, a different act."
    "bases":
      "听说":
        "meaning": "I heard that"
    "native": "I heard that he is coming tomorrow."
  "zh-3056":
    "confusables":
      "w1":
        "why": "容易 (róngyì) is easy, the opposite."
      "w2":
        "why": "成绩 (chéngjì) is a result, a different word."
    "bases":
      "听说":
        "meaning": "I heard that"
    "native": "I heard that the exam is very difficult."
  "zh-3057":
    "confusables":
      "w1":
        "why": "喜欢 (xǐhuan) is to like, not to judge."
      "w2":
        "why": "漂亮 (piàoliang) is pretty, a different quality."
    "bases":
      "电影":
        "meaning": "film"
    "native": "I do not think this film is good."
  "zh-3058":
    "confusables":
      "w1":
        "why": "问题 (wèntí) is a problem, the opposite of a solution."
      "w2":
        "why": "计划 (jìhuà) is a plan, a bigger idea."
    "bases":
      "听说":
        "meaning": "I heard that"
      "有":
        "meaning": "to have; there is"
    "native": "I heard that you have a good idea."
  "zh-3059":
    "confusables":
      "w1":
        "why": "错 (cuò) is wrong, the opposite of right."
      "w2":
        "why": "觉得 (juéde) is to think, a more everyday word."
    "bases":
      "认为":
        "meaning": "to consider"
      "的":
        "meaning": "of"
      "话":
        "meaning": "words; speech"
    "native": "I think what he says is right."
