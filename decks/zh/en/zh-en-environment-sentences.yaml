"core": "zh-environment-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "The environment in sentences"
"description": "Sentences about sorting rubbish, saving energy, clean air and looking after the land. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-3660":
    "confusables":
      "w1":
        "why": "扔 (rēng) is to throw away, which is not sorting."
      "w2":
        "why": "废物 (fèiwù) is waste, a noun."
    "bases":
      "把":
        "meaning": "a particle that puts the object before the verb"
    "native": "Please sort the rubbish, and then recycle it."
  "zh-3661":
    "confusables":
      "w1":
        "why": "浪费 (làngfèi) is to waste, the opposite."
      "w2":
        "why": "节水 (jiéshuǐ) is to save water, a close word."
    "bases":
      "要":
        "meaning": "to need"
    "native": "We must save water and also save energy."
  "zh-3662":
    "confusables":
      "w1":
        "why": "阴 (yīn) is cloudy, the opposite of clear."
      "w2":
        "why": "沙尘 (shāchén) is dust, which makes the air worse."
    "native": "The air quality is very good, and the sky is clear."
  "zh-3663":
    "confusables":
      "w1":
        "why": "纸袋 (zhǐdài) is a paper bag, which breaks down more easily."
      "w2":
        "why": "可持续 (kěchíxù) is sustainable, a broader idea."
    "bases":
      "袋":
        "meaning": "bag"
    "native": "Plastic bags are very hard to break down."
  "zh-3664":
    "confusables":
      "w1":
        "why": "无害 (wúhài) is harmless, the opposite."
      "w2":
        "why": "减排 (jiǎnpái) is to cut emissions, a related action."
    "bases":
      "的":
        "meaning": "of"
      "废气":
        "meaning": "waste gas"
    "native": "The exhaust that cars give off is very harmful."
  "zh-3665":
    "confusables":
      "w1":
        "why": "砍伐 (kǎnfá) is to cut down trees, the opposite of planting."
      "w2":
        "why": "绿化 (lǜhuà) is to make green, a related act."
    "bases":
      "要":
        "meaning": "to need"
    "native": "We must plant trees and protect the ecology."
  "zh-3666":
    "confusables":
      "w1":
        "why": "安静 (ānjìng) is quiet, the opposite."
      "w2":
        "why": "污水 (wūshuǐ) is dirty water, a different kind of pollution."
    "bases":
      "的":
        "meaning": "of"
    "native": "The noise in this city is very loud."
  "zh-3667":
    "confusables":
      "w1":
        "why": "能源 (néngyuán) is energy, a wider word."
      "w2":
        "why": "电动车 (diàndòngchē) is an electric vehicle, a different thing."
    "bases":
      "和":
        "meaning": "and"
    "native": "Solar and wind energy are very clean."
