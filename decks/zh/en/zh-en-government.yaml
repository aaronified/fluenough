"schema": 1
"id": "zh-en-government"
"kind": "layer"
"core": "zh-government"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Government"
"description": "Forty words for government and public life: the ministers and the councils, the vote and the election, the laws and the courts, the citizens and their rights, and the words for how power is used. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-3276":
    "native": "minister"
    "notes":
      "n1": "The head of a government department. 部 (bù) is a department, and 长 (zhǎng) is the head."
    "examples":
      "他是部长。": "He is a minister."
      "部长在开会。": "The minister is in a meeting."
  "zh-3277":
    "native": "mayor"
    "notes":
      "n1": "The head of a city. 市 (shì) is a city, and 长 (zhǎng) is the head."
    "examples":
      "市长很忙。": "The mayor is very busy."
      "市长来了。":
        "native": "The mayor has come."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3278":
    "native": "governor of a province"
    "notes":
      "n1": "The head of a province. 省 (shěng) is a province, and 长 (zhǎng) is the head."
    "examples":
      "省长讲话了。":
        "native": "The governor has made a speech."
        "bases":
          "讲话":
            "meaning": "to make a speech"
          "了":
            "meaning": "a particle"
      "这位省长很有名。": "This governor is very well known."
  "zh-3279":
    "native": "voter"
    "notes":
      "n1": "A citizen who can vote in an election. 选 (xuǎn) is to choose, and 民 (mín) is a people."
    "examples":
      "选民很多。": "There are many voters."
      "选民投票了。":
        "native": "The voters cast their votes."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3280":
    "native": "to vote"
    "notes":
      "n1": "To put a vote in a box. 投 (tóu) is to cast, and 票 (piào) is a ballot."
    "examples":
      "大家投票。": "Everyone votes."
      "请投票。": "Please vote."
  "zh-3281":
    "native": "member of a council"
    "notes":
      "n1": "A person elected to a council or parliament. 议 (yì) is to discuss, and 员 (yuán) is a member."
    "examples":
      "他是议员。": "He is a council member."
      "议员们在讨论。":
        "native": "The council members are discussing."
        "bases":
          "议员们":
            "meaning": "council members"
  "zh-3282":
    "native": "congress; national assembly"
    "notes":
      "n1": "The law-making body of a country. 国 (guó) is a country, and 会 (huì) is a meeting."
    "examples":
      "国会通过了这个法律。":
        "native": "Congress passed this law."
        "bases":
          "了":
            "meaning": "a particle"
      "国会今天开会。": "Congress meets today."
  "zh-3283":
    "native": "court"
    "notes":
      "n1": "A place where legal cases are judged. 法 (fǎ) is law, and 院 (yuàn) is a building."
    "examples":
      "法院在哪里？": "Where is the court?"
      "这个案子在法院。":
        "native": "This case is in court."
        "bases":
          "案子":
            "meaning": "case"
  "zh-3284":
    "native": "judge"
    "notes":
      "n1": "A person who judges in a court. 法 (fǎ) is law, and 官 (guān) is an official."
    "examples":
      "法官很公正。": "The judge is very fair."
      "法官说话了。":
        "native": "The judge spoke."
        "bases":
          "说话":
            "meaning": "to speak"
          "了":
            "meaning": "a particle"
  "zh-3285":
    "native": "administration"
    "notes":
      "n1": "The work of running a government. 行 (xíng) is to carry out, and 政 (zhèng) is government."
    "examples":
      "行政工作很多。": "There is a lot of administrative work."
      "他在行政部门工作。": "He works in the administration."
  "zh-3286":
    "native": "government office; organ"
    "notes":
      "n1": "An office that runs part of the government. 机 (jī) is a mechanism, and 关 (guān) is a gate."
    "examples":
      "机关在三楼。": "The office is on the third floor."
      "机关的人很多。":
        "native": "There are many people in the office."
        "bases":
          "的":
            "meaning": "of"
  "zh-3287":
    "native": "official"
    "notes":
      "n1": "A person who works for the government. 官 (guān) is an official, and 员 (yuán) is a member."
    "examples":
      "这个官员很忙。": "This official is very busy."
      "官员要服务人民。":
        "native": "Officials must serve the people."
        "bases":
          "要":
            "meaning": "must; to want"
          "人民":
            "meaning": "the people"
  "zh-3288":
    "native": "power; authority"
    "notes":
      "n1": "The right to make decisions and control. 权 (quán) is power, and 力 (lì) is strength."
    "examples":
      "他有很大的权力。":
        "native": "He has great power."
        "bases":
          "有":
            "meaning": "to have; there is"
          "的":
            "meaning": "of"
      "权力要受到限制。":
        "native": "Power must be limited."
        "bases":
          "要":
            "meaning": "must; to want"
          "受到":
            "meaning": "to receive; to be subject to"
          "限制":
            "meaning": "to limit"
  "zh-3289":
    "native": "regime; political power"
    "notes":
      "n1": "The power to rule a country. 政 (zhèng) is government, and 权 (quán) is power."
    "examples":
      "政权变了。":
        "native": "The regime has changed."
        "bases":
          "变":
            "meaning": "to change"
          "了":
            "meaning": "a particle"
      "这个政权很稳定。":
        "native": "This regime is very stable."
        "bases":
          "稳定":
            "meaning": "stable"
  "zh-3290":
    "native": "constitution"
    "notes":
      "n1": "The basic law of a country. 宪 (xiàn) is a constitution, and 法 (fǎ) is law."
    "examples":
      "宪法很重要。": "The constitution is very important."
      "大家要遵守宪法。":
        "native": "Everyone must obey the constitution."
        "bases":
          "要":
            "meaning": "must; to want"
          "遵守":
            "meaning": "to obey"
  "zh-3291":
    "native": "regulation"
    "notes":
      "n1": "A written rule made by a government. 条 (tiáo) is an item, and 例 (lì) is an example."
    "examples":
      "这个条例很严格。": "This regulation is very strict."
      "条例已经通过了。":
        "native": "The regulation has been passed."
        "bases":
          "了":
            "meaning": "a particle"
  "zh-3292":
    "native": "permit; licence"
    "notes":
      "n1": "An official paper that allows you to do something. 许 (xǔ) is to allow, 可 (kě) is can, and 证 (zhèng) is a certificate."
    "examples":
      "你有许可证吗？":
        "native": "Do you have a permit?"
        "bases":
          "有":
            "meaning": "to have; there is"
      "办许可证要多久？":
        "native": "How long does it take to get a licence?"
        "bases":
          "办":
            "meaning": "to handle"
          "要":
            "meaning": "must; to want"
          "久":
            "meaning": "long (of time)"
  "zh-3293":
    "native": "licence; certificate"
    "notes":
      "n1": "An official paper that allows you to work or drive. 执 (zhí) is to hold, and 照 (zhào) is a permit."
    "examples":
      "我有驾驶执照。":
        "native": "I have a driving licence."
        "bases":
          "有":
            "meaning": "to have; there is"
          "驾驶":
            "meaning": "to drive"
      "这个执照很重要。": "This licence is very important."
  "zh-3294":
    "native": "tax revenue"
    "notes":
      "n1": "The money a government gets from taxes. 税 (shuì) is tax, and 收 (shōu) is to collect."
    "examples":
      "税收增加了。":
        "native": "Tax revenue has increased."
        "bases":
          "了":
            "meaning": "a particle"
      "税收用在教育上。":
        "native": "Tax revenue is spent on education."
        "bases":
          "用":
            "meaning": "to use"
          "教育":
            "meaning": "education"
  "zh-3295":
    "native": "to pay tax"
    "notes":
      "n1": "To pay the tax that is due. 纳 (nà) is to pay, and 税 (shuì) is tax."
    "examples":
      "每个人都要纳税。":
        "native": "Everyone must pay tax."
        "bases":
          "要":
            "meaning": "must; to want"
      "他按时纳税。": "He pays his tax on time."
  "zh-3296":
    "native": "citizen"
    "notes":
      "n1": "A person who belongs to a country. 公 (gōng) is public, and 民 (mín) is a person."
    "examples":
      "他是中国公民。": "He is a Chinese citizen."
      "公民有权利。":
        "native": "Citizens have rights."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-3297":
    "native": "household registration"
    "notes":
      "n1": "The official record of where a person lives. 户 (hù) is a household, and 口 (kǒu) is a person."
    "examples":
      "我的户口在北京。":
        "native": "My household registration is in Beijing."
        "bases":
          "的":
            "meaning": "of"
          "北京":
            "meaning": "Beijing"
      "办户口要带身份证。":
        "native": "To register, bring your identity card."
        "bases":
          "办":
            "meaning": "to handle"
          "要":
            "meaning": "must; to want"
  "zh-3298":
    "native": "resident"
    "notes":
      "n1": "A person who lives in a place. 居 (jū) is to live, and 民 (mín) is a person."
    "examples":
      "这里的居民很友好。":
        "native": "The residents here are very friendly."
        "bases":
          "这里":
            "meaning": "here"
          "的":
            "meaning": "of"
          "友好":
            "meaning": "friendly"
      "居民很多。": "There are many residents."
  "zh-3299":
    "native": "ambassador"
    "notes":
      "n1": "A person who represents a country abroad. 大 (dà) is big, and 使 (shǐ) is an envoy."
    "examples":
      "大使在使馆工作。":
        "native": "The ambassador works at the embassy."
        "bases":
          "使馆":
            "meaning": "embassy"
      "大使说了一句话。":
        "native": "The ambassador said a few words."
        "bases":
          "了":
            "meaning": "a particle"
          "句":
            "meaning": "measure word for sentences"
          "话":
            "meaning": "words; speech"
  "zh-3300":
    "native": "consulate"
    "notes":
      "n1": "An office of a country in another city. 领 (lǐng) is to lead, 事 (shì) is affairs, and 馆 (guǎn) is a building."
    "examples":
      "领事馆在哪里？": "Where is the consulate?"
      "我去领事馆办签证。":
        "native": "I go to the consulate to get a visa."
        "bases":
          "办":
            "meaning": "to handle"
  "zh-3301":
    "native": "national flag"
    "notes":
      "n1": "The flag of a country. 国 (guó) is a country, and 旗 (qí) is a flag."
    "examples":
      "国旗很大。": "The national flag is very big."
      "大家向国旗敬礼。":
        "native": "Everyone salutes the national flag."
        "bases":
          "向":
            "meaning": "towards"
          "敬礼":
            "meaning": "to salute"
  "zh-3302":
    "native": "national anthem"
    "notes":
      "n1": "The song of a country. 国 (guó) is a country, and 歌 (gē) is a song."
    "examples":
      "大家唱国歌。": "Everyone sings the national anthem."
      "国歌很好听。": "The anthem is very nice to listen to."
  "zh-3303":
    "native": "prime minister"
    "notes":
      "n1": "The head of the government in some countries. 首 (shǒu) is first, and 相 (xiàng) is a minister."
    "examples":
      "首相今天来了。":
        "native": "The prime minister came today."
        "bases":
          "了":
            "meaning": "a particle"
      "首相讲了话。":
        "native": "The prime minister gave a speech."
        "bases":
          "了":
            "meaning": "a particle"
          "话":
            "meaning": "words; speech"
  "zh-3304":
    "native": "agenda item; topic for discussion"
    "notes":
      "n1": "A subject for a meeting to discuss. 议 (yì) is to discuss, and 题 (tí) is a topic."
    "examples":
      "今天的议题是什么？":
        "native": "What is today's agenda?"
        "bases":
          "的":
            "meaning": "of"
      "这个议题很重要。": "This item is very important."
  "zh-3305":
    "native": "to approve"
    "notes":
      "n1": "To agree officially to something. 批 (pī) is to approve, and 准 (zhǔn) is to permit."
    "examples":
      "政府批准了这个计划。":
        "native": "The government approved this plan."
        "bases":
          "了":
            "meaning": "a particle"
      "还没有批准。":
        "native": "It has not been approved yet."
        "bases":
          "没有":
            "meaning": "there is not"
  "zh-3306":
    "native": "the public; the people"
    "notes":
      "n1": "Ordinary people. 民 (mín) is the people, and 众 (zhòng) is a crowd."
    "examples":
      "民众很关心这个问题。":
        "native": "The public cares very much about this issue."
        "bases":
          "关心":
            "meaning": "to care about"
      "政府要听民众的意见。":
        "native": "The government must listen to the public."
        "bases":
          "要":
            "meaning": "must; to want"
          "的":
            "meaning": "of"
  "zh-3307":
    "native": "masses; crowd"
    "notes":
      "n1": "A large number of ordinary people. 群 (qún) is a group, and 众 (zhòng) is a crowd."
    "examples":
      "群众很多。": "There is a large crowd."
      "群众的意见很重要。":
        "native": "The views of the masses are important."
        "bases":
          "的":
            "meaning": "of"
  "zh-3308":
    "native": "open; public"
    "notes":
      "n1": "Open to everyone, not secret. 公 (gōng) is public, and 开 (kāi) is open."
    "examples":
      "结果公开了。":
        "native": "The result was made public."
        "bases":
          "结果":
            "meaning": "result"
          "了":
            "meaning": "a particle"
      "政府要公开信息。":
        "native": "The government must make information public."
        "bases":
          "要":
            "meaning": "must; to want"
          "信息":
            "meaning": "information"
  "zh-3309":
    "native": "transparent; open"
    "notes":
      "n1": "Clear and open, so people can see what happens. 透 (tòu) is to pass through, and 明 (míng) is clear."
    "examples":
      "这个过程很透明。":
        "native": "This process is very transparent."
        "bases":
          "过程":
            "meaning": "process"
      "政府要透明。":
        "native": "The government must be transparent."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-3310":
    "native": "corrupt"
    "notes":
      "n1": "Using power for private gain. 腐 (fǔ) is to rot, and 败 (bài) is to ruin."
    "examples":
      "腐败是大问题。": "Corruption is a big problem."
      "这个官员很腐败。": "This official is corrupt."
  "zh-3311":
    "native": "to govern; to manage"
    "notes":
      "n1": "To control and organise a place or matter. 治 (zhì) is to govern, and 理 (lǐ) is to manage."
    "examples":
      "政府要治理环境。":
        "native": "The government must manage the environment."
        "bases":
          "要":
            "meaning": "must; to want"
          "环境":
            "meaning": "environment"
      "这个城市治理得很好。":
        "native": "This city is well governed."
        "bases":
          "得":
            "meaning": "a particle: how it is done"
  "zh-3312":
    "native": "to supervise"
    "notes":
      "n1": "To watch and check that rules are followed. 监 (jiān) is to watch, and 督 (dū) is to oversee."
    "examples":
      "大家监督政府。": "Everyone watches over the government."
      "谁来监督？": "Who will supervise?"
  "zh-3313":
    "native": "political party"
    "notes":
      "n1": "A group that works for political aims. 政 (zhèng) is politics, and 党 (dǎng) is a party."
    "examples":
      "这个政党很大。": "This political party is very big."
      "政党的目标是什么？":
        "native": "What is the aim of the party?"
        "bases":
          "的":
            "meaning": "of"
  "zh-3314":
    "native": "to run for election"
    "notes":
      "n1": "To compete for a political post. 竞 (jìng) is to compete, and 选 (xuǎn) is to choose."
    "examples":
      "他要竞选市长。":
        "native": "He is going to run for mayor."
        "bases":
          "要":
            "meaning": "must; to want"
      "竞选很激烈。":
        "native": "The election campaign is very fierce."
        "bases":
          "激烈":
            "meaning": "fierce; heated"
  "zh-3315":
    "native": "justice; judiciary"
    "notes":
      "n1": "The part of government that judges cases. 司 (sī) is to manage, and 法 (fǎ) is law."
    "examples":
      "司法要公正。":
        "native": "Justice must be fair."
        "bases":
          "要":
            "meaning": "must; to want"
      "他在司法部门工作。": "He works in the justice department."
