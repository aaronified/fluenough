"id": "zh-en-transport-sentences"
"kind": "layer"
"core": "zh-transport-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Getting around in sentences"
"description": "Sentences about travelling: which bus to take, when the train leaves, and where to get off. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0993":
    "confusables":
      "w1":
        "why": "车站 (chēzhàn) is a station, which is a place, not the bus route."
      "w2":
        "why": "地图 (dìtú) is a map, something you look at."
    "bases":
      "请问":
        "meaning": "excuse me; may I ask"
      "的":
        "meaning": "a particle: of; belonging to"
    "native": "Excuse me, where is the bus to the airport?"
  "zh-0994":
    "confusables":
      "w1":
        "why": "飞机 (fēijī) is a plane, which flies rather than runs on rails."
      "w2":
        "why": "船 (chuán) is a boat, on water."
    "native": "The train leaves at seven."
  "zh-0995":
    "confusables":
      "w1":
        "why": "出租车 (chūzūchē) is a taxi, which the speaker does not take."
      "w2":
        "why": "自行车 (zìxíngchē) is a bicycle, not the metro."
    "bases":
      "会":
        "meaning": "can; to know how to"
    "native": "I cannot drive, so I take the metro."
  "zh-0996":
    "confusables":
      "w1":
        "why": "停车 (tíngchē) is to park, a different action."
      "w2":
        "why": "上车 (shàngchē) is to get on a vehicle, not a jam."
    "bases":
      "了":
        "meaning": "a particle: a change has happened"
    "native": "There is a traffic jam here."
  "zh-0997":
    "confusables":
      "w1":
        "why": "上车 (shàngchē) is to get on, the opposite."
      "w2":
        "why": "机场 (jīchǎng) is an airport, a place, not the act of getting off."
    "native": "I get off at the metro station."
  "zh-0998":
    "confusables":
      "w1":
        "why": "火车 (huǒchē) is a train, which runs on land."
      "w2":
        "why": "船 (chuán) is a boat, which goes by water."
    "native": "They fly to America."
  "zh-0999":
    "confusables":
      "w1":
        "why": "快 (kuài) is fast, which is about speed, not price."
      "w2":
        "why": "慢 (màn) is slow, the opposite of fast."
    "bases":
      "比":
        "meaning": "than"
    "native": "A taxi is more expensive than a bus."
  "zh-1000":
    "confusables":
      "w1":
        "why": "出发 (chūfā) is to leave, the other end of the trip."
      "w2":
        "why": "晚 (wǎn) is late; the train is not late."
    "bases":
      "到":
        "meaning": "to arrive; to reach"
    "native": "The train arrives at ten."
