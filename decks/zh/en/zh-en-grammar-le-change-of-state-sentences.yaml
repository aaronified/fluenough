  "zh-4835":
    "confusables":
      "w1":
        "why": "热 (rè) is hot, the opposite of cold."
      "w2":
        "why": "暖和 (nuǎnhuo) is warm, not cold."
    "bases":
      "了":
        "meaning": "a particle at the end of a sentence: the situation has changed"
