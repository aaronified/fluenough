"cards":
  "zh-3796":
    "confusables":
      "w1":
        "why": "线条 (xiàntiáo) is the lines, a different part of a drawing."
      "w2":
        "why": "构图 (gòutú) is composition, the arrangement."
    "bases":
      "幅":
        "meaning": "measure word for paintings"
      "的":
        "meaning": "of"
      "美":
        "meaning": "beautiful"
    "native": "The colours in this painting are beautiful."
  "zh-3797":
    "confusables":
      "w1":
        "why": "展品 (zhǎnpǐn) is an exhibit, a thing on show."
      "w2":
        "why": "画廊 (huàláng) is a gallery, the place."
    "bases":
      "的":
        "meaning": "of"
      "有":
        "meaning": "to have; there is"
    "native": "The works in this exhibition have a strong style."
  "zh-3798":
    "confusables":
      "w1":
        "why": "墨 (mò) is ink, which is used with the brush."
      "w2":
        "why": "纸 (zhǐ) is paper, which is also used."
    "bases":
      "用":
        "meaning": "to use"
    "native": "The calligrapher writes characters with a brush."
  "zh-3799":
    "confusables":
      "w1":
        "why": "画 (huà) is to paint or draw, a different verb."
      "w2":
        "why": "写 (xiě) is to write, a different act."
    "native": "He is carving a sculpture."
  "zh-3800":
    "confusables":
      "w1":
        "why": "喜欢 (xǐhuan) is to like, a simpler feeling."
      "w2":
        "why": "佩服 (pèifú) is to admire a person, not a work."
    "bases":
      "的":
        "meaning": "of"
    "native": "I really appreciate his works."
  "zh-3801":
    "confusables":
      "w1":
        "why": "唱歌 (chànggē) is to sing, a voice rather than an instrument."
      "w2":
        "why": "跳舞 (tiàowǔ) is to dance, a different art."
    "bases":
      "的":
        "meaning": "of"
    "native": "Her performance on the instrument is very nice to hear."
  "zh-3802":
    "confusables":
      "w1":
        "why": "美术馆 (měishùguǎn) is an art museum, a bigger place."
      "w2":
        "why": "博物馆 (bówùguǎn) is a museum, a wider idea."
    "native": "This gallery is open for free at the weekend."
  "zh-3803":
    "confusables":
      "w1":
        "why": "诗歌 (shīgē) is poetry, a different form."
      "w2":
        "why": "小说 (xiǎoshuō) is a novel, a different form."
    "bases":
      "的":
        "meaning": "of"
    "native": "This writer's essays are very moving."
