"schema": 1
"id": "zh-en-help"
"kind": "layer"
"core": "zh-help"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Help and emergencies"
"description": "Thirty-five words for asking for help: help itself, getting lost, losing things, the emergency services, danger, saying sorry, and asking someone to repeat or explain. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1224":
    "native": "help"
    "notes":
      "n1": "Help, the act of helping someone, or to help. 帮 (bāng) is to help, and 助 (zhù) is to aid."
    "examples":
      "请帮助我。": "Please help me."
      "谢谢你的帮助。":
        "native": "Thank you for your help."
        "bases":
          "谢谢":
            "meaning": "thank you"
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-1225":
    "native": "help; save a life"
    "notes":
      "n1": "A cry for help in danger. 救 (jiù) is to save, and 命 (mìng) is life."
    "examples":
      "救命！": "Help!"
      "他救了我的命。":
        "native": "He saved my life."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
          "的":
            "meaning": "a particle: of; belonging to"
          "命":
            "meaning": "life"
  "zh-1226":
    "native": "first aid"
    "notes":
      "n1": "First aid, the help given to someone who is hurt or ill before a doctor comes. 急 (jí) is urgent."
    "examples":
      "他会急救。":
        "native": "He knows first aid."
        "bases":
          "会":
            "meaning": "can; to know how to"
      "这是急救箱。":
        "native": "This is a first-aid box."
        "bases":
          "箱":
            "meaning": "box"
  "zh-1227":
    "native": "ambulance"
    "notes":
      "n1": "An ambulance, a vehicle for taking the sick and hurt to hospital. 护 (hù) is to protect."
    "examples":
      "救护车来了。":
        "native": "The ambulance has come."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "请叫救护车。": "Please call an ambulance."
  "zh-1228":
    "native": "fire (a disaster)"
    "notes":
      "n1": "A fire that does damage. 火 (huǒ) is fire and 灾 (zāi) is a disaster."
    "examples":
      "这里发生了火灾。":
        "native": "There has been a fire here."
        "bases":
          "这里":
            "meaning": "here"
          "发生":
            "meaning": "to happen"
          "了":
            "meaning": "a particle: a change has happened"
      "火灾很危险。": "A fire is very dangerous."
  "zh-1229":
    "native": "to catch fire"
    "notes":
      "n1": "To catch fire, or to be on fire. 着 (zháo) is to catch or touch."
    "examples":
      "房子着火了！":
        "native": "The house is on fire!"
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "厨房着火了。":
        "native": "The kitchen has caught fire."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1230":
    "native": "earthquake"
    "notes":
      "n1": "An earthquake, when the ground shakes. 震 (zhèn) is to shake."
    "examples":
      "昨天有地震。":
        "native": "There was an earthquake yesterday."
        "bases":
          "有":
            "meaning": "to have; there is"
      "地震很可怕。":
        "native": "An earthquake is very frightening."
        "bases":
          "可怕":
            "meaning": "frightening"
  "zh-1231":
    "native": "thief"
    "notes":
      "n1": "A thief, a person who steals. 偷 (tōu) is to steal."
    "examples":
      "小偷在那儿！": "The thief is over there!"
      "要小心小偷。":
        "native": "Be careful of thieves."
        "bases":
          "要":
            "meaning": "must; to want"
  "zh-1232":
    "native": "to lose; to drop"
    "notes":
      "n1": "To lose something, or to have it taken. 丢 (diū) is to lose something."
    "examples":
      "我丢了钥匙。":
        "native": "I have lost my keys."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "别丢了票。":
        "native": "Do not lose the ticket."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1233":
    "native": "wallet; purse"
    "notes":
      "n1": "A wallet, for money and cards. 包 (bāo) is a bag."
    "examples":
      "我的钱包丢了。":
        "native": "My wallet is lost."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
          "了":
            "meaning": "a particle: a change has happened"
      "钱包里有很多钱。":
        "native": "There is a lot of money in the wallet."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-1234":
    "native": "to get lost"
    "notes":
      "n1": "To lose your way. 迷 (mí) is to be confused, and 路 (lù) is a road."
    "examples":
      "我迷路了。":
        "native": "I am lost."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "他在城市里迷路了。":
        "native": "He got lost in the city."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1235":
    "native": "cannot find"
    "notes":
      "n1": "Cannot find, when you have looked and not found it. 找 (zhǎo) is to look for."
    "examples":
      "我找不到钥匙。": "I cannot find my keys."
      "车站找不到了。":
        "native": "The station cannot be found."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1236":
    "native": "to call the police; to raise the alarm"
    "notes":
      "n1": "To report a crime or danger to the police. 报 (bào) is to report, and 警 (jǐng) is police."
    "examples":
      "我要报警。":
        "native": "I want to call the police."
        "bases":
          "要":
            "meaning": "must; to want"
      "请马上报警。": "Please call the police at once."
  "zh-1237":
    "native": "urgent; emergency"
    "notes":
      "n1": "Urgent, needing quick action. 紧 (jǐn) is tight, and 急 (jí) is hurry."
    "examples":
      "这是紧急情况。":
        "native": "This is an emergency."
        "bases":
          "情况":
            "meaning": "situation"
      "请马上打电话，很紧急。":
        "native": "Please call at once; it is urgent."
        "bases":
          "打":
            "meaning": "to dial; to hit"
  "zh-1238":
    "native": "dangerous"
    "notes":
      "n1": "Dangerous, likely to cause harm. Its opposite is 安全 (ānquán), safe."
    "examples":
      "这条路很危险。":
        "native": "This road is very dangerous."
        "bases":
          "条":
            "meaning": "the measure word for long things, such as roads"
      "火很危险。": "Fire is dangerous."
  "zh-1239":
    "native": "careful"
    "notes":
      "n1": "Careful, watching what you do. 心 (xīn) is the heart or mind."
    "examples":
      "路上要小心。":
        "native": "Be careful on the road."
        "bases":
          "要":
            "meaning": "must; to want"
      "小心一点！": "Be more careful!"
  "zh-1240":
    "native": "to ask for; to request"
    "notes":
      "n1": "To ask someone for something, politely. 请 (qǐng) is to invite or ask."
    "examples":
      "我请求你的帮助。":
        "native": "I ask you for your help."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "他请求再说一遍。":
        "native": "He asks to say it once more."
        "bases":
          "一遍":
            "meaning": "once more"
  "zh-1241":
    "native": "sorry"
    "notes":
      "n1": "Sorry, to say you are sorry. 对不起 (duìbuqǐ) is said to apologise."
    "examples":
      "对不起，我迟到了。":
        "native": "Sorry, I am late."
        "bases":
          "迟到":
            "meaning": "to be late"
          "了":
            "meaning": "a particle: a change has happened"
      "对不起，请再说一遍。":
        "native": "Sorry, please say it again."
        "bases":
          "一遍":
            "meaning": "once more"
  "zh-1242":
    "native": "it does not matter; never mind"
    "notes":
      "n1": "It does not matter, said to put someone at ease. 关系 (guānxi) is a relation or matter."
    "examples":
      "没关系。": "It does not matter."
      "对不起！没关系。": "Sorry! That is all right."
  "zh-1243":
    "native": "excuse me; sorry, embarrassed"
    "notes":
      "n1": "To feel awkward or sorry for a small thing. 不好意思 (bùhǎoyìsi) is said to say sorry lightly."
    "examples":
      "不好意思，我迟到了。":
        "native": "Excuse me, I am late."
        "bases":
          "迟到":
            "meaning": "to be late"
          "了":
            "meaning": "a particle: a change has happened"
      "不好意思，打扰你了。":
        "native": "Sorry to disturb you."
        "bases":
          "打扰":
            "meaning": "to disturb"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1244":
    "native": "to trouble; to bother; trouble"
    "notes":
      "n1": "To bother someone, or a trouble in itself. 麻 (má) is hemp, and 烦 (fán) is annoyance."
    "examples":
      "对不起，麻烦你了。":
        "native": "Sorry to trouble you."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "这个事很麻烦。":
        "native": "This matter is a lot of trouble."
        "bases":
          "事":
            "meaning": "matter; affair"
  "zh-1245":
    "native": "to translate; translator"
    "notes":
      "n1": "To translate, from one language into another. 译 (yì) is to translate."
    "examples":
      "请帮我翻译。": "Please translate for me."
      "他是翻译。": "He is a translator."
  "zh-1246":
    "native": "dictionary"
    "notes":
      "n1": "A dictionary of characters or words. 字 (zì) is a character."
    "examples":
      "我用字典查字。":
        "native": "I look up characters in a dictionary."
        "bases":
          "用":
            "meaning": "to use"
          "查":
            "meaning": "to look up"
      "字典很厚。":
        "native": "The dictionary is very thick."
        "bases":
          "厚":
            "meaning": "thick"
  "zh-1247":
    "native": "to save; to rescue"
    "notes":
      "n1": "To save someone from danger."
    "examples":
      "警察救了他。":
        "native": "The police saved him."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "快来救我！": "Come quickly and save me!"
  "zh-1248":
    "native": "fire engine"
    "notes":
      "n1": "A fire engine, sent to put out fires. 消防 (xiāofáng) is fire-fighting."
    "examples":
      "消防车来了。":
        "native": "The fire engine has come."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "消防车很快。": "The fire engine is quick."
  "zh-1249":
    "native": "alarm; warning"
    "notes":
      "n1": "An alarm, a sound or sign to warn of danger. 报 (bào) is a report."
    "examples":
      "警报响了！":
        "native": "The alarm has gone off!"
        "bases":
          "响":
            "meaning": "loud; to ring"
          "了":
            "meaning": "a particle: a change has happened"
      "这个警报很响。":
        "native": "This alarm is very loud."
        "bases":
          "响":
            "meaning": "loud; to ring"
  "zh-1250":
    "native": "to have an accident"
    "notes":
      "n1": "To have an accident or trouble. 事 (shì) is a matter or event."
    "examples":
      "他出事了。":
        "native": "He has had an accident."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "路上出事了。":
        "native": "There was an accident on the road."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1251":
    "native": "to be injured"
    "notes":
      "n1": "To be hurt in an accident. 伤 (shāng) is a wound."
    "examples":
      "他受伤了。":
        "native": "He has been injured."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "有人受伤了吗？":
        "native": "Has anyone been hurt?"
        "bases":
          "有":
            "meaning": "to have; there is"
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1252":
    "native": "wound; injury"
    "notes":
      "n1": "A wound, or an injury to the body."
    "examples":
      "手上有伤。":
        "native": "There is a wound on the hand."
        "bases":
          "有":
            "meaning": "to have; there is"
      "伤不重。":
        "native": "The injury is not serious."
        "bases":
          "重":
            "meaning": "heavy; serious"
  "zh-1253":
    "native": "way; method; solution"
    "notes":
      "n1": "A way of doing something, a method or a solution. 办 (bàn) is to do or handle."
    "examples":
      "有办法吗？":
        "native": "Is there a way?"
        "bases":
          "有":
            "meaning": "to have; there is"
      "我想不出办法。":
        "native": "I cannot think of a solution."
        "bases":
          "出":
            "meaning": "to come out; to produce"
  "zh-1254":
    "native": "to inform; a notice"
    "notes":
      "n1": "To inform someone, or the notice itself. 知 (zhī) is to know."
    "examples":
      "我通知他了。":
        "native": "I have told him."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "这是通知。": "This is a notice."
  "zh-1255":
    "native": "to fill in"
    "notes":
      "n1": "To fill in a form or a space."
    "examples":
      "请填表格。": "Please fill in the form."
      "把空格填上。":
        "native": "Fill in the blanks."
        "bases":
          "把":
            "meaning": "a particle that puts the object before the verb"
          "空格":
            "meaning": "a blank space"
  "zh-1256":
    "native": "form; table"
    "notes":
      "n1": "A form with boxes to fill in, or a table of figures. 表 (biǎo) is a table or list."
    "examples":
      "请填这个表格。": "Please fill in this form."
      "表格在桌子上。": "The form is on the table."
  "zh-1257":
    "native": "to sign one's name"
    "notes":
      "n1": "To sign your name on a form or a paper. 名 (míng) is a name."
    "examples":
      "请在这里签名。": "Please sign your name here."
      "他签名了。":
        "native": "He has signed."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-1258":
    "native": "language"
    "notes":
      "n1": "A language, a way of speaking. 语 (yǔ) is speech."
    "examples":
      "你会几种语言？":
        "native": "How many languages do you speak?"
        "bases":
          "会":
            "meaning": "can; to know how to"
          "种":
            "meaning": "the measure word for a kind"
      "这个语言很难。": "This language is very hard."
