"cards":
  "zh-4122":
    "confusables":
      "w1":
        "why": "押金 (yājīn) is a deposit, a different payment."
      "w2":
        "why": "房东 (fángdōng) is the landlord, a different person."
    "bases":
      "套":
        "meaning": "measure word for sets and flats"
      "的":
        "meaning": "of"
    "native": "The rent for this flat is very expensive."
  "zh-4123":
    "confusables":
      "w1":
        "why": "搬出 (bānchū) is to move out, the opposite."
      "w2":
        "why": "入住 (rùzhù) is to move in, a formal word."
    "bases":
      "要":
        "meaning": "to want"
      "交":
        "meaning": "to hand over"
    "native": "You must pay the deposit before moving in."
  "zh-4124":
    "confusables":
      "w1":
        "why": "朝向 (cháoxiàng) is the direction a flat faces."
      "w2":
        "why": "装修 (zhuāngxiū) is to renovate, a different job."
    "bases":
      "要":
        "meaning": "to want"
    "native": "The room needs ventilation, and the light is also very good."
  "zh-4125":
    "confusables":
      "w1":
        "why": "新 (xīn) is new, the opposite of old."
      "w2":
        "why": "装饰 (zhuāngshì) is decoration, a different thing."
    "bases":
      "的":
        "meaning": "of"
    "native": "Our furniture is very old."
  "zh-4126":
    "confusables":
      "w1":
        "why": "煤气 (méiqì) is gas, a different utility."
      "w2":
        "why": "物业 (wùyè) is property management, a different service."
    "bases":
      "和":
        "meaning": "and"
      "要":
        "meaning": "to want"
      "交":
        "meaning": "to hand over"
    "native": "Both the electricity and the water bills must be paid."
  "zh-4127":
    "confusables":
      "w1":
        "why": "退房 (tuìfáng) is to check out, a related act."
      "w2":
        "why": "租房 (zūfáng) is to rent a flat, the starting point."
    "bases":
      "要":
        "meaning": "to want"
    "native": "Do I renew the lease, or move out?"
  "zh-4128":
    "confusables":
      "w1":
        "why": "房产 (fángchǎn) is property, the thing being bought."
      "w2":
        "why": "租金 (zūjīn) is rent, not a mortgage."
    "bases":
      "和":
        "meaning": "and"
    "native": "The down payment and the mortgage are both very expensive."
  "zh-4129":
    "confusables":
      "w1":
        "why": "淋浴 (línyù) is a shower, a different fitting."
      "w2":
        "why": "灶台 (zàotái) is the cooker top, a different place."
    "bases":
      "的":
        "meaning": "of"
      "了":
        "meaning": "a particle"
    "native": "The toilet in the bathroom is broken."
