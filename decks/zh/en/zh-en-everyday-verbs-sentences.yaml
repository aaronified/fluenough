"cards":
  "zh-0330":
    "native": "Does mum get up?"
    "confusables":
      "w1":
        "why": "睡觉 (shuìjiào) would say sleep, not get up."
      "w2":
        "why": "看 (kàn) would say look at, not get up."
  "zh-0331":
    "native": "We are eating a meal. Are you going home?"
    "confusables":
      "w1":
        "why": "喝 (hē) would say drink, not eat a meal."
      "w2":
        "why": "上班 (shàngbān) would say go to work, not go home."
  "zh-0332":
    "native": "Does dad finish work?"
    "confusables":
      "w1":
        "why": "上班 (shàngbān) would ask whether dad goes to work, not whether he finishes."
      "w2":
        "why": "放学 (fàngxué) would ask about school ending, not work."
  "zh-0333":
    "native": "The child finishes school. Shall we wait?"
    "confusables":
      "w1":
        "why": "上学 (shàngxué) would say the child goes to school, not that school ends."
      "w2":
        "why": "回家 (huíjiā) would say go home, not wait."
  "zh-0334":
    "native": "Please sit down, I will speak."
    "confusables":
      "w1":
        "why": "站 (zhàn) would say stand up, not sit down."
      "w2":
        "why": "听 (tīng) would say listen, not speak."
  "zh-0335":
    "native": "What are you preparing?"
    "confusables":
      "w1":
        "why": "问 (wèn) would say ask, not prepare."
      "w2":
        "why": "回答 (huídá) would say answer, not prepare."
  "zh-0336":
    "native": "The teacher asks, and everyone answers."
    "confusables":
      "w1":
        "why": "告诉 (gàosu) would say tell, not ask."
      "w2":
        "why": "说 (shuō) would say speak, not answer."
  "zh-0337":
    "native": "I want to go to school."
    "confusables":
      "w1":
        "why": "忘 (wàng) would say forget, not want."
      "w2":
        "why": "走 (zǒu) would say walk, not want."
