"cards":
  "zh-1890":
    "confusables":
      "w1":
        "why": "炒菜 (chǎocài) is to stir-fry, a later step."
      "w2":
        "why": "做菜 (zuòcài) is to cook, a wider word."
    "native": "Mum is cutting vegetables in the kitchen."
  "zh-1891":
    "confusables":
      "w1":
        "why": "糖 (táng) is sugar, a different seasoning."
      "w2":
        "why": "醋 (cù) is vinegar, a sour seasoning."
    "bases":
      "要":
        "meaning": "must; to want"
    "native": "This dish needs a lot of salt."
  "zh-1892":
    "confusables":
      "w1":
        "why": "搅 (jiǎo) is to stir, a different action."
      "w2":
        "why": "剁 (duò) is to chop, not to beat."
    "bases":
      "把":
        "meaning": "a particle that puts the object before the verb"
      "打":
        "meaning": "to beat; to hit"
      "散":
        "meaning": "loose; to scatter"
    "native": "First beat the eggs loose."
  "zh-1893":
    "confusables":
      "w1":
        "why": "小火 (xiǎohuǒ) is low heat, the opposite."
      "w2":
        "why": "中火 (zhōnghuǒ) is medium heat, a different level."
    "bases":
      "用":
        "meaning": "to use"
      "分钟":
        "meaning": "minute (of time)"
    "native": "Please stir-fry on high heat for three minutes."
  "zh-1894":
    "confusables":
      "w1":
        "why": "擀 (gǎn) is to roll out, a later step."
      "w2":
        "why": "腌 (yān) is to marinate, a different step."
    "bases":
      "要":
        "meaning": "must; to want"
      "一下":
        "meaning": "a little; have a try"
    "native": "The flour needs a knead."
  "zh-1895":
    "confusables":
      "w1":
        "why": "冷水 (lěngshuǐ) is cold water, not for thawing."
      "w2":
        "why": "冰 (bīng) is ice, which thaws to water."
    "bases":
      "块":
        "meaning": "the measure word for a piece"
      "要":
        "meaning": "must; to want"
    "native": "Does this piece of meat need thawing?"
  "zh-1896":
    "confusables":
      "w1":
        "why": "炖 (dùn) is to stew, a longer method."
      "w2":
        "why": "煎 (jiān) is to pan-fry, a different method."
    "bases":
      "要":
        "meaning": "must; to want"
      "趁":
        "meaning": "to take the chance of"
    "native": "After it comes out of the pot, eat it while it is hot."
  "zh-1897":
    "confusables":
      "w1":
        "why": "香油 (xiāngyóu) is sesame oil, a different flavour."
      "w2":
        "why": "味精 (wèijīng) is MSG, another seasoning."
    "bases":
      "有":
        "meaning": "to have; there is"
      "和":
        "meaning": "and"
    "native": "There is star anise and cinnamon bark in the soup."
