"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "比 (bǐ), 跟 (gēn) and 没有 (méiyǒu) in sentences"
"description": "Sentences that compare two things: 比 (bǐ) for more and less, 跟 (gēn) ... 一样 (yíyàng) for the same, and 没有 (méiyǒu) for not as much. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-1621":
    "confusables":
      "w1":
        "why": "贵 (guì) is expensive, the opposite."
      "w2":
        "why": "大 (dà) is big, a different thing to compare."
    "bases":
      "比":
        "meaning": "than; more than"
    "native": "This one is cheaper than that one."
  "zh-1622":
    "confusables":
      "w1":
        "why": "慢 (màn) is slow, the opposite of fast."
      "w2":
        "why": "车 (chē) is a vehicle, not a speed."
    "bases":
      "比":
        "meaning": "than; more than"
    "native": "The metro is faster than the bus."
  "zh-1623":
    "confusables":
      "w1":
        "why": "胖 (pàng) is fat, a different body word."
      "w2":
        "why": "大 (dà) is big, not tall."
    "bases":
      "跟":
        "meaning": "with; as ... as"
      "一样":
        "meaning": "the same"
    "native": "He is as tall as me."
  "zh-1624":
    "confusables":
      "w1":
        "why": "热 (rè) is hot, the opposite of cold."
      "w2":
        "why": "凉快 (liángkuai) is cool and pleasant, a feeling, not a comparison."
    "bases":
      "没有":
        "meaning": "not as; there is not"
    "native": "Today is not as cold as yesterday."
  "zh-1625":
    "confusables":
      "w1":
        "why": "胖 (pàng) is fat, not pretty."
      "w2":
        "why": "瘦 (shòu) is thin, not pretty."
    "bases":
      "比":
        "meaning": "than; more than"
    "native": "She is prettier than her younger sister."
  "zh-1626":
    "confusables":
      "w1":
        "why": "小 (xiǎo) is small, the opposite of big."
      "w2":
        "why": "远 (yuǎn) is far, not a size."
    "bases":
      "比":
        "meaning": "than; more than"
    "native": "The house is not bigger than that one."
  "zh-1627":
    "confusables":
      "w1":
        "why": "便宜 (piányi) is cheap, the opposite of expensive."
      "w2":
        "why": "快 (kuài) is fast, not a price."
    "bases":
      "跟":
        "meaning": "with; as ... as"
      "一样":
        "meaning": "the same"
    "native": "This book is as expensive as that one."
  "zh-1628":
    "confusables":
      "w1":
        "why": "小 (xiǎo) is small, which fits this comparison."
      "w2":
        "why": "胖 (pàng) is fat, not big in age or size."
    "bases":
      "没有":
        "meaning": "not as; there is not"
    "native": "He is not as big as me."
