"id": "zh-en-family"
"kind": "layer"
"core": "zh-family"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Family"
"description": "Fourteen words for family: dad, mum, the older and younger brothers and sisters, son, daughter, home, family members, grandparents on the father's side, child and parents. Not yet checked\
  \ by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0181":
    "native": "dad; father"
    "notes":
      "n1": "爸爸 (bàba) is 'dad', 'father'. It is said twice, as the pair of syllables."
    "examples":
      "我爸爸是老师。": "Dad is a teacher."
      "爸爸好吗？": "Is dad well?"
  "zh-0182":
    "native": "mum; mother"
    "notes":
      "n1": "妈妈 (māma) is 'mum', 'mother'. Like 爸爸 (bàba), it is said with the same syllable twice."
    "examples":
      "我妈妈很好。": "My mum is well."
      "妈妈来吗？": "Is mum coming?"
  "zh-0183":
    "native": "older brother"
    "notes":
      "n1": "哥哥 (gēge) is 'older brother'. 弟弟 (dìdi) is the younger brother, and the two words are told apart by the first syllable."
    "examples":
      "我哥哥是学生。": "My older brother is a student."
      "哥哥也来吗？": "Is my older brother coming too?"
  "zh-0184":
    "native": "older sister"
    "notes":
      "n1": "姐姐 (jiějie) is 'older sister'. 妹妹 (mèimei) is the younger sister."
    "examples":
      "我姐姐很高兴。": "My older sister is very happy."
      "姐姐是老师吗？": "Is my older sister a teacher?"
  "zh-0185":
    "native": "younger brother"
    "notes":
      "n1": "弟弟 (dìdi) is 'younger brother'. It is the younger one of the two brothers, as 哥哥 (gēge) is the older."
    "examples":
      "我弟弟是学生。": "My younger brother is a student."
      "弟弟好吗？": "Is my younger brother well?"
  "zh-0186":
    "native": "younger sister"
    "notes":
      "n1": "妹妹 (mèimei) is 'younger sister'. It is the younger one of the two sisters, as 姐姐 (jiějie) is the older."
    "examples":
      "我妹妹很好。": "My younger sister is well."
      "妹妹也是学生。": "My younger sister is a student too."
  "zh-0187":
    "native": "son"
    "notes":
      "n1": "儿子 (érzi) is 'son'."
    "examples":
      "他是我儿子。": "He is my son."
      "儿子好吗？": "Is your son well?"
  "zh-0188":
    "native": "daughter"
    "notes":
      "n1": "女儿 (nǚ'ér) is 'daughter'. The apostrophe separates the two syllables, so it is not read as nǚér."
    "examples":
      "她是我女儿。": "She is my daughter."
      "女儿来吗？": "Is the daughter coming?"
  "zh-0189":
    "native": "home; family"
    "notes":
      "n1": "家 (jiā) is 'home' and 'family'. 家人 (jiārén) is the family members, as people."
    "examples":
      "我家很好。": "My home is good."
      "你家好吗？": "Is your family well?"
  "zh-0190":
    "native": "family members"
    "notes":
      "n1": "家人 (jiārén) is 'family members', the people who live in one 家 (jiā), home."
    "examples":
      "我家人都好。": "All my family are well."
      "家人来吗？": "Are the family members coming?"
  "zh-0191":
    "native": "grandfather (father's side)"
    "notes":
      "n1": "爷爷 (yéye) is 'grandfather', on the father's side. 奶奶 (nǎinai) is the grandmother on the same side."
    "examples":
      "爷爷是老师。": "Grandfather is a teacher."
      "爷爷好吗？": "Is grandfather well?"
  "zh-0192":
    "native": "grandmother (father's side)"
    "notes":
      "n1": "奶奶 (nǎinai) is 'grandmother', on the father's side."
    "examples":
      "奶奶很高兴。": "Grandmother is very happy."
      "奶奶来吗？": "Is grandmother coming?"
  "zh-0193":
    "native": "child"
    "notes":
      "n1": "孩子 (háizi) is 'child', a son or a daughter."
    "examples":
      "孩子是学生。": "The child is a student."
      "孩子好吗？": "Is the child well?"
  "zh-0194":
    "native": "parents"
    "notes":
      "n1": "父母 (fùmǔ) is 'parents', the father and the mother together."
    "examples":
      "我父母都好。": "My parents are both well."
      "父母是老师吗？": "Are your parents teachers?"
