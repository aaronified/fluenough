"cards":
  "zh-0195":
    "native": "Mum and dad are both well."
    "confusables":
      "w1":
        "why": "哥哥 (gēge) would say the older brother is well, not the parents."
      "w2":
        "why": "孩子 (háizi) would say the child is well, not the parents."
  "zh-0196":
    "native": "Are all your family coming?"
    "confusables":
      "w1":
        "why": "家 (jiā) would ask whether the home comes, not the family."
      "w2":
        "why": "父母 (fùmǔ) would ask whether only the parents come, not everyone."
  "zh-0197":
    "native": "She is my older sister."
    "confusables":
      "w1":
        "why": "妹妹 (mèimei) would say she is my younger sister, not my older one."
      "w2":
        "why": "女儿 (nǚ'ér) would say she is my daughter, not my sister."
  "zh-0198":
    "native": "My younger brother is very happy."
    "confusables":
      "w1":
        "why": "哥哥 (gēge) would say my older brother is happy, not the younger one."
      "w2":
        "why": "妹妹 (mèimei) would say my younger sister is happy, not my brother."
  "zh-0199":
    "native": "Is the son a student too?"
    "confusables":
      "w1":
        "why": "女儿 (nǚ'ér) would ask about a daughter, not a son."
      "w2":
        "why": "孩子 (háizi) would ask about a child of either sex, not a son."
  "zh-0200":
    "native": "Grandfather and grandmother are both well."
    "confusables":
      "w1":
        "why": "爸爸 (bàba) would say dad is well, not the grandparents."
      "w2":
        "why": "父母 (fùmǔ) would say the parents are well, not the grandparents."
  "zh-0201":
    "native": "My child is well."
    "confusables":
      "w1":
        "why": "家人 (jiārén) would say the family members are well, not the child."
      "w2":
        "why": "你 (nǐ) would say your child is well, not mine."
  "zh-0202":
    "native": "Is mum a teacher?"
    "confusables":
      "w1":
        "why": "爸爸 (bàba) would ask whether dad is a teacher, not mum."
      "w2":
        "why": "奶奶 (nǎinai) would ask whether grandmother is a teacher, not mum."
