"name": "想 (xiǎng): want to do something"
"license": "CC-BY-SA-4.0"
"description": "Wanting to do something: 想 (xiǎng) goes before the verb, and 不 (bù) before 想 (xiǎng) says you do not want to. Not yet checked by a Mandarin speaker: please report any mistake."
"tags":
- "unreviewed"
"pattern":
  "name": "想 (xiǎng): want to do something"
  "slot_name": "form"
  "prompt": "{lemma} ({gloss}), {slot}"
  "slots":
    "bare": "a plain statement"
    "want": "wanting to do it, with 想 (xiǎng)"
    "not": "not wanting to, with 不 (bù) before 想 (xiǎng)"
  "entries":
    "qu": "to go"
    "chi": "to eat"
    "mai": "to buy"
    "he": "to drink"
    "lai": "to come"
    "kan": "to read"
  "notes": "想 (xiǎng) goes before the verb: 我想去学校 (wǒ xiǎng qù xuéxiào), I want to go to school. Put 不 (bù) before 想 (xiǎng), not after it: 我不想吃饭 (wǒ bù xiǎng chī fàn), I do not want to eat. 想 (xiǎng) is also said as 'to think' in 想一想 (xiǎng yi xiǎng), but here it means want. 不 (bù) is said bú before a fourth tone, as in 不会 (bú huì), and bù before the others, as in 不想 (bù xiǎng)."
