          "教材":
            "meaning": "teaching material"
          "很":
            "meaning": "very"
          "有用":
            "meaning": "useful"
      "老师换了新的教材。":
        "native": "The teacher has changed to a new textbook."
        "bases":
          "老师":
            "meaning": "teacher"
          "了":
            "meaning": "particle"
          "的":
            "meaning": "particle"
