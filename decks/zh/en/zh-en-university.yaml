        "bases":
          "很多":
            "meaning": "many"
          "家长":
            "meaning": "parents"
          "为":
            "meaning": "for"
          "的":
            "meaning": "particle"
          "学费":
            "meaning": "tuition fee"
  "zh-4610":
    "native": "research topic; subject for study"
    "notes":
      "n1": "课题 (kètí) is a research topic or project, a question a researcher studies. 题目 (tímù) is a title or an exam question."
    "examples":
