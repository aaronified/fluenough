        "bases":
          "去":
            "meaning": "go"
          "留学":
            "meaning": "to study abroad"
      "他在日本留学三年了。":
        "native": "He has been studying in Japan for three years."
        "bases":
          "他":
            "meaning": "he"
          "留学":
            "meaning": "to study abroad"
          "了":
            "meaning": "particle"
  "zh-4609":
    "native": "tuition fee"
    "notes":
      "n1": "学费 (xuéfèi) is the fee you pay to study at a school or university. 费用 (fèiyòng) is a cost in general."
    "examples":
      "今年的学费是五万块。":
