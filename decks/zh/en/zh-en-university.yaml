"cards":
  "zh-4585":
    "native": "college; a faculty inside a university"
    "notes":
      "n1": "学院 (xuéyuàn) is a faculty or college inside a university, such as 医学院 (yīxuéyuàn), the medical faculty. 大学 (dàxué) is the whole university, and 学校 (xuéxiào) is any school."
    "examples":
      "我的学院在校园北边。":
        "native": "My college is on the north side of the campus."
        "bases":
          "我":
            "meaning": "I"
          "的":
            "meaning": "particle"
          "学院":
            "meaning": "college"
          "北边":
            "meaning": "north"
      "这个学院有三个系。":
        "native": "This college has three departments."
        "bases":
          "这个":
            "meaning": "this"
          "学院":
            "meaning": "college"
          "有":
            "meaning": "has"
          "系":
            "meaning": "department"
  "zh-4586":
    "native": "degree; an academic qualification"
    "notes":
      "n1": "学位 (xuéwèi) is the qualification a university gives, such as a bachelor's or master's degree. 学历 (xuélì) is the level of schooling a person has finished, a wider word."
    "examples":
      "他有一个硕士学位。":
        "native": "He has a master's degree."
        "bases":
          "他":
            "meaning": "he"
          "有":
            "meaning": "has"
          "学位":
            "meaning": "degree"
      "我的学位论文下个月完成。":
        "native": "I will finish my degree thesis next month."
        "bases":
          "我":
            "meaning": "I"
          "的":
            "meaning": "particle"
          "学位":
            "meaning": "degree"
          "下个":
            "meaning": "next"
          "完成":
            "meaning": "finish"
  "zh-4587":
    "native": "undergraduate course; bachelor's level study"
    "notes":
      "n1": "本科 (běnkē) is the undergraduate course that leads to a bachelor's degree. 研究生 (yánjiūshēng) is the study that comes after it."
    "examples":
      "他读本科三年级。":
        "native": "He is in the third year of his undergraduate course."
        "bases":
          "他":
            "meaning": "he"
          "本科":
            "meaning": "undergraduate course"
      "本科毕业以后他想读研究生。":
        "native": "After his undergraduate degree he wants to study for a postgraduate degree."
        "bases":
          "本科":
            "meaning": "undergraduate course"
          "他":
            "meaning": "he"
  "zh-4588":
    "native": "postgraduate; graduate student"
    "notes":
      "n1": "研究生 (yánjiūshēng) is a postgraduate student, someone who studies after a bachelor's degree. 本科生 (běnkēshēng) is an undergraduate student."
    "examples":
      "我姐姐是研究生。":
        "native": "My older sister is a postgraduate student."
        "bases":
          "我":
            "meaning": "I"
          "是":
            "meaning": "is"
          "研究生":
            "meaning": "postgraduate"
      "研究生要写一篇论文。":
        "native": "A postgraduate student must write a thesis."
        "bases":
          "研究生":
            "meaning": "postgraduate"
          "要":
            "meaning": "must"
          "写":
            "meaning": "write"
          "篇":
            "meaning": "measure"
  "zh-4589":
    "native": "doctorate; PhD holder"
    "notes":
      "n1": "博士 (bóshì) is a doctorate, the highest academic degree, or a person who holds one. A medical doctor is 医生 (yīshēng), a different word."
    "examples":
      "她正在读博士。":
        "native": "She is studying for a doctorate."
        "bases":
          "正在":
            "meaning": "currently"
          "博士":
            "meaning": "doctorate"
      "他三年前拿到了博士学位。":
        "native": "He got his doctorate three years ago."
        "bases":
          "他":
            "meaning": "he"
          "拿到":
            "meaning": "obtain"
          "了":
            "meaning": "particle"
          "博士":
            "meaning": "doctorate"
  "zh-4590":
    "native": "master's degree; master's student"
    "notes":
      "n1": "硕士 (shuòshì) is a master's degree, which comes between a bachelor's degree and a doctorate. 硕士生 (shuòshìshēng) is a master's student."
    "examples":
      "我想考硕士。":
        "native": "I want to take the entrance exam for a master's."
        "bases":
          "我":
            "meaning": "I"
          "硕士":
            "meaning": "master's degree"
      "硕士课程一般需要两年。":
        "native": "A master's course usually takes two years."
        "bases":
          "硕士":
            "meaning": "master's degree"
          "一般":
            "meaning": "usually"
  "zh-4591":
    "native": "professor"
    "notes":
      "n1": "教授 (jiàoshòu) is a full professor, the top rank of academic staff. As a verb it means to teach, as in 教授中文 (jiàoshòu Zhōngwén), to teach Chinese."
    "examples":
      "张教授教我们历史。":
        "native": "Professor Zhang teaches us history."
        "bases":
          "张":
            "meaning": "Zhang"
          "教授":
            "meaning": "professor"
      "教授的办公室在三楼。":
        "native": "The professor's office is on the third floor."
        "bases":
          "教授":
            "meaning": "professor"
          "的":
            "meaning": "particle"
          "办公室":
            "meaning": "office"
  "zh-4592":
    "native": "lecturer"
    "notes":
      "n1": "讲师 (jiǎngshī) is a lecturer, a rank below 副教授 (fùjiàoshòu, associate professor) and above 助教 (zhùjiào, teaching assistant)."
    "examples":
      "他是这门课的讲师。":
        "native": "He is the lecturer for this course."
        "bases":
          "他":
            "meaning": "he"
          "是":
            "meaning": "is"
          "的":
            "meaning": "particle"
          "讲师":
            "meaning": "lecturer"
      "讲师下个星期有一场讲座。":
        "native": "The lecturer gives a talk next week."
        "bases":
          "讲师":
            "meaning": "lecturer"
          "下个":
            "meaning": "next"
          "有":
            "meaning": "has"
  "zh-4593":
    "native": "teaching assistant"
    "notes":
      "n1": "助教 (zhùjiào) is a teaching assistant. They help a lecturer with classes and with marking, 批改 (pīgǎi)."
    "examples":
      "助教帮教授批改作业。":
        "native": "The teaching assistant helps the professor mark homework."
        "bases":
          "助教":
            "meaning": "teaching assistant"
          "批改":
            "meaning": "mark"
      "我是这门课的助教。":
        "native": "I am the teaching assistant for this course."
        "bases":
          "我":
            "meaning": "I"
          "是":
            "meaning": "is"
          "的":
            "meaning": "particle"
          "助教":
            "meaning": "teaching assistant"
  "zh-4594":
    "native": "credit; course credit"
    "notes":
      "n1": "学分 (xuéfēn) is the credit value of a course. A student needs a set number of credits to graduate."
    "examples":
      "这门课有三个学分。":
        "native": "This course is worth three credits."
        "bases":
          "这门课":
            "meaning": "this course"
          "有":
            "meaning": "has"
          "学分":
            "meaning": "credit"
      "我还差五个学分才能毕业。":
        "native": "I still need five more credits before I can graduate."
        "bases":
          "我":
            "meaning": "I"
          "差":
            "meaning": "lack"
          "学分":
            "meaning": "credit"
          "才":
            "meaning": "only then"
          "能":
            "meaning": "can"
  "zh-4595":
    "native": "to choose courses; to register for classes"
    "notes":
      "n1": "选课 (xuǎnkè) is to pick the courses you will take in a term. 选 (xuǎn) means choose and 课 (kè) means course, so the word joins the two. 选择 (xuǎnzé) is choose in general."
    "examples":
      "下学期我要选课。":
        "native": "Next term I need to choose my courses."
        "bases":
          "我":
            "meaning": "I"
          "要":
            "meaning": "need to"
          "选课":
            "meaning": "to choose courses"
      "选课的时候要看课程表。":
        "native": "When you choose courses, you should look at the timetable."
        "bases":
          "选课":
            "meaning": "to choose courses"
          "的":
            "meaning": "particle"
          "时候":
            "meaning": "time"
          "要":
            "meaning": "must"
          "表":
            "meaning": "timetable"
  "zh-4596":
    "native": "thesis; academic paper"
    "notes":
      "n1": "论文 (lùnwén) is an academic paper or thesis. A degree thesis is the long paper written to graduate. 作文 (zuòwén) is a school essay."
    "examples":
      "他在写毕业论文。":
        "native": "He is writing his graduation thesis."
        "bases":
          "他":
            "meaning": "he"
          "写":
            "meaning": "write"
          "论文":
            "meaning": "thesis"
      "这篇论文发表在一个国际期刊上。":
        "native": "This paper was published in an international journal."
        "bases":
          "篇":
            "meaning": "measure"
          "论文":
            "meaning": "thesis"
          "国际":
            "meaning": "international"
          "期刊":
            "meaning": "journal"
  "zh-4597":
    "native": "to enter school; to start at a school"
    "notes":
      "n1": "入学 (rùxué) means to start at a school or university. 开学 (kāixué) is the first day of term, and 毕业 (bìyè) is leaving with a degree."
    "examples":
      "他明年九月入学。":
        "native": "He starts university next September."
        "bases":
          "他":
            "meaning": "he"
          "九":
            "meaning": "nine"
          "入学":
            "meaning": "to enter school"
      "入学以前要交一些材料。":
        "native": "Before you enter, you must hand in some documents."
        "bases":
          "入学":
            "meaning": "to enter school"
          "要":
            "meaning": "must"
          "交":
            "meaning": "hand in"
  "zh-4598":
    "native": "to sign up; to register"
    "notes":
      "n1": "报名 (bàomíng) is to sign up for something, such as a course, an exam or a race. 报到 (bàodào) is to check in when you arrive."
    "examples":
      "我们下周去报名参加考试。":
        "native": "We will go and sign up for the exam next week."
        "bases":
          "去":
            "meaning": "go"
          "报名":
            "meaning": "to sign up"
          "参加":
            "meaning": "take part in"
      "报名的截止时间是星期五。":
        "native": "The deadline for signing up is Friday."
        "bases":
          "报名":
            "meaning": "to sign up"
          "的":
            "meaning": "particle"
          "截止":
            "meaning": "deadline"
          "是":
            "meaning": "is"
          "星期五":
            "meaning": "Friday"
  "zh-4599":
    "native": "scholarship"
    "notes":
      "n1": "奖学金 (jiǎngxuéjīn) is money given to a student for good results or need, usually not paid back. 助学金 (zhùxuéjīn) is a grant to help a student who is short of money."
    "examples":
      "她得到了一笔奖学金。":
        "native": "She received a scholarship."
        "bases":
          "得到":
            "meaning": "get"
          "了":
            "meaning": "particle"
          "奖学金":
            "meaning": "scholarship"
      "成绩好的学生可以申请奖学金。":
        "native": "Students with good grades can apply for a scholarship."
        "bases":
          "好":
            "meaning": "good"
          "的":
            "meaning": "particle"
          "学生":
            "meaning": "students"
          "可以":
            "meaning": "can"
          "奖学金":
            "meaning": "scholarship"
  "zh-4600":
    "native": "laboratory"
    "notes":
      "n1": "实验室 (shíyànshì) is a laboratory, the room where experiments are done. 实验 (shíyàn) is the experiment itself."
    "examples":
      "这个实验室很大。":
        "native": "This lab is very big."
        "bases":
          "这个":
            "meaning": "this"
          "实验室":
            "meaning": "laboratory"
          "很":
            "meaning": "very"
      "我每天下午在实验室工作。":
        "native": "I work in the lab every afternoon."
        "bases":
          "我":
            "meaning": "I"
          "每天":
            "meaning": "every day"
          "实验室":
            "meaning": "laboratory"
  "zh-4601":
    "native": "academic learning; scholarship"
    "notes":
      "n1": "学术 (xuéshù) is academic learning as a field. It also comes before nouns as an adjective: 学术会议 (xuéshù huìyì) is an academic conference."
    "examples":
      "这是一个学术会议。":
        "native": "This is an academic conference."
        "bases":
          "是":
            "meaning": "is"
          "学术":
            "meaning": "academic learning"
          "会议":
            "meaning": "conference"
      "他的学术成绩很好。":
        "native": "His academic results are very good."
        "bases":
          "他":
            "meaning": "he"
          "的":
            "meaning": "particle"
          "学术":
            "meaning": "academic learning"
          "很":
            "meaning": "very"
          "好":
            "meaning": "good"
  "zh-4602":
    "native": "scholar"
    "notes":
      "n1": "学者 (xuézhě) is a scholar, someone who studies a subject in depth. 专家 (zhuānjiā) is an expert, who may have practical skill more than research."
    "examples":
      "他是一位历史学者。":
        "native": "He is a scholar of history."
        "bases":
          "他":
            "meaning": "he"
          "是":
            "meaning": "is"
          "学者":
            "meaning": "scholar"
      "很多学者研究这个问题。":
        "native": "Many scholars study this question."
        "bases":
          "很多":
            "meaning": "many"
          "学者":
            "meaning": "scholar"
          "这个":
            "meaning": "this"
  "zh-4603":
    "native": "classmate; fellow student"
    "notes":
      "n1": "同学 (tóngxué) is a classmate or fellow student, and students also call each other this. 同事 (tóngshì) is a colleague at work."
    "examples":
      "他是我的大学同学。":
        "native": "He is my classmate from university."
        "bases":
          "他":
            "meaning": "he"
          "是":
            "meaning": "is"
          "我":
            "meaning": "I"
          "的":
            "meaning": "particle"
          "同学":
            "meaning": "classmate"
      "同学们在图书馆里学习。":
        "native": "The classmates study in the library."
        "bases":
          "同学们":
            "meaning": "classmates"
  "zh-4604":
    "native": "campus"
    "notes":
      "n1": "校园 (xiàoyuán) is the campus, the grounds of a school or university. It also means school life in general."
    "examples":
      "校园里有很多树。":
        "native": "There are many trees on the campus."
        "bases":
          "校园":
            "meaning": "campus"
          "有":
            "meaning": "has"
          "很多":
            "meaning": "many"
      "我每天早上在校园里跑步。":
        "native": "Every morning I go running on campus."
        "bases":
          "我":
            "meaning": "I"
          "每天":
            "meaning": "every day"
          "校园":
            "meaning": "campus"
  "zh-4605":
    "native": "notes; notes written down"
    "notes":
      "n1": "笔记 (bǐjì) are the notes you write while you study or listen to a lecture. 记 (jì) is to write down or remember."
    "examples":
      "我的笔记很整齐。":
        "native": "My notes are very neat."
        "bases":
          "我":
            "meaning": "I"
          "的":
            "meaning": "particle"
          "笔记":
            "meaning": "notes"
          "很":
            "meaning": "very"
      "上课的时候要记笔记。":
        "native": "You should take notes while you are in class."
        "bases":
          "的":
            "meaning": "particle"
          "时候":
            "meaning": "time"
          "要":
            "meaning": "must"
          "记":
            "meaning": "write down"
          "笔记":
            "meaning": "notes"
  "zh-4606":
    "native": "to defend a thesis"
    "notes":
      "n1": "答辩 (dábiàn) is to defend a thesis in front of a panel, the formal oral exam at the end of a degree. The word can also mean a formal reply to a charge."
    "examples":
      "他下个月要去答辩。":
        "native": "He has to defend his thesis next month."
        "bases":
          "他":
            "meaning": "he"
          "下个月":
            "meaning": "next month"
          "要":
            "meaning": "must"
          "去":
            "meaning": "go"
          "答辩":
            "meaning": "to defend a thesis"
      "答辩的时候老师问了很多问题。":
        "native": "During the defence the teachers asked many questions."
        "bases":
          "答辩":
            "meaning": "to defend a thesis"
          "的":
            "meaning": "particle"
          "时候":
            "meaning": "time"
          "老师":
            "meaning": "teacher"
          "了":
            "meaning": "particle"
          "很多":
            "meaning": "many"
  "zh-4607":
    "native": "supervisor; mentor"
    "notes":
      "n1": "导师 (dǎoshī) is a thesis supervisor or mentor who guides a student's research. 老师 (lǎoshī) is the general word for teacher."
    "examples":
      "我的导师很严格。":
        "native": "My supervisor is very strict."
        "bases":
          "我":
            "meaning": "I"
          "的":
            "meaning": "particle"
          "导师":
            "meaning": "supervisor"
          "很":
            "meaning": "very"
      "研究生每周都要和导师见面。":
        "native": "Postgraduate students have to meet their supervisor every week."
        "bases":
          "都":
            "meaning": "all"
          "要":
            "meaning": "must"
          "和":
            "meaning": "with"
          "导师":
            "meaning": "supervisor"
  "zh-4608":
    "native": "to study abroad"
    "notes":
      "n1": "留学 (liúxué) is to study in another country as a student from abroad. 留学生 (liúxuéshēng) is an overseas student."
    "examples":
      "她想去英国留学。":
