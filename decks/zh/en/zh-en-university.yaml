        "bases":
          "他":
            "meaning": "he"
          "的":
            "meaning": "particle"
          "课题":
            "meaning": "research topic"
          "是":
            "meaning": "is"
      "这个课题需要很长时间。":
        "native": "This research topic needs a long time."
        "bases":
          "这个":
            "meaning": "this"
          "课题":
            "meaning": "research topic"
          "很":
            "meaning": "very"
  "zh-4611":
    "native": "to take the postgraduate entrance exam"
    "notes":
      "n1": "考研 (kǎoyán) is short for 考研究生 (kǎo yánjiūshēng), to sit the entrance exam for postgraduate study. Students use it in everyday talk."
    "examples":
      "他今年考研。":
        "native": "He is taking the postgraduate exam this year."
        "bases":
          "他":
            "meaning": "he"
          "考研":
            "meaning": "to take the postgraduate entrance exam"
      "很多学生大四的时候就开始考研。":
        "native": "Many students start preparing for the postgraduate exam in their fourth year."
        "bases":
          "很多":
            "meaning": "many"
          "学生":
            "meaning": "students"
          "大四":
            "meaning": "fourth year"
          "的":
            "meaning": "particle"
          "时候":
            "meaning": "time"
          "考研":
            "meaning": "to take the postgraduate entrance exam"
  "zh-4612":
    "native": "teaching material; textbook"
    "notes":
      "n1": "教材 (jiàocái) is the textbook or teaching material a course uses. 课本 (kèběn) is a school textbook, a more everyday word."
