"schema": 1
"id": "zh-en-food"
"kind": "layer"
"core": "zh-food"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Food and drink"
"description": "Sixty words for food and drink: the meals of the day, the things on the table, the vegetables, fruit and drinks, and the ways food is cooked and tastes. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0876":
    "native": "breakfast"
    "notes":
      "n1": "The first meal of the day. 早 (zǎo) is early, and 饭 (fàn) is a meal or cooked rice."
    "examples":
      "早饭在七点。": "Breakfast is at seven o'clock."
      "我不吃早饭。": "I do not eat breakfast."
  "zh-0877":
    "native": "lunch"
    "notes":
      "n1": "The midday meal. 午 (wǔ) is noon."
    "examples":
      "我中午吃午饭。": "I have lunch at noon."
      "午饭很贵。": "Lunch is expensive."
  "zh-0878":
    "native": "dinner; supper"
    "notes":
      "n1": "The evening meal. 晚 (wǎn) is evening."
    "examples":
      "我们晚饭吃米饭。": "We have rice for dinner."
      "晚饭以后我看书。": "After dinner I read."
  "zh-0879":
    "native": "restaurant"
    "notes":
      "n1": "A restaurant, where you eat out. 馆 (guǎn) is a building for a kind of business."
    "examples":
      "我们去饭馆吃饭。": "We go to a restaurant to eat."
      "这个饭馆很好。": "This restaurant is very good."
  "zh-0880":
    "native": "menu"
    "notes":
      "n1": "The menu in a restaurant, with the dishes and their prices. 单 (dān) is a list."
    "examples":
      "请给我菜单。":
        "native": "Please give me the menu."
        "bases":
          "给":
            "meaning": "to give; for"
      "菜单上有什么？":
        "native": "What is on the menu?"
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-0881":
    "native": "waiter; waitress"
    "notes":
      "n1": "A person who serves in a restaurant or shop. 员 (yuán) is a member of staff."
    "examples":
      "服务员很热情。":
        "native": "The waiter is very friendly."
        "bases":
          "热情":
            "meaning": "friendly; warm"
      "服务员来了。":
        "native": "The waiter has come."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-0882":
    "native": "bill"
    "notes":
      "n1": "The bill for a meal or goods. 账 (zhàng) is an account."
    "examples":
      "请给我账单。":
        "native": "Please give me the bill."
        "bases":
          "给":
            "meaning": "to give; for"
      "账单是多少？": "How much is the bill?"
  "zh-0883":
    "native": "to pay the bill"
    "notes":
      "n1": "To pay for a meal at the end. 结 (jié) is to settle."
    "examples":
      "我去结账。": "I go to pay."
      "在前面结账。": "Pay at the front."
  "zh-0884":
    "native": "to order food"
    "notes":
      "n1": "To order dishes in a restaurant. 菜 (cài) is a dish."
    "examples":
      "我们点菜吧。": "Let us order the food."
      "我先点菜。": "I will order first."
  "zh-0885":
    "native": "seat"
    "notes":
      "n1": "A seat, in a bus, a cinema or a restaurant."
    "examples":
      "这个座位有人吗？":
        "native": "Is this seat taken?"
        "bases":
          "有":
            "meaning": "to have; there is"
      "请坐这个座位。": "Please sit in this seat."
  "zh-0886":
    "native": "snack; street food"
    "notes":
      "n1": "A small snack or street food, often local to a place."
    "examples":
      "这儿的小吃很有名。":
        "native": "The snacks here are famous."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "我喜欢吃小吃。": "I like to eat snacks."
  "zh-0887":
    "native": "bowl"
    "notes":
      "n1": "A bowl, for rice, noodles or soup."
    "examples":
      "碗很大。": "The bowl is very big."
      "我要一个碗。":
        "native": "I want a bowl."
        "bases":
          "要":
            "meaning": "to want; to need"
  "zh-0888":
    "native": "chopsticks"
    "notes":
      "n1": "A pair of chopsticks for eating. 子 (zi) makes the word a noun."
    "examples":
      "用筷子吃饭。":
        "native": "Eat with chopsticks."
        "bases":
          "用":
            "meaning": "to use"
      "筷子在桌子上。": "The chopsticks are on the table."
  "zh-0889":
    "native": "spoon"
    "notes":
      "n1": "A spoon, for soup and rice."
    "examples":
      "用勺子喝汤。":
        "native": "Drink the soup with a spoon."
        "bases":
          "用":
            "meaning": "to use"
      "孩子用勺子吃饭。":
        "native": "The child eats with a spoon."
        "bases":
          "用":
            "meaning": "to use"
  "zh-0890":
    "native": "plate"
    "notes":
      "n1": "A plate, flat, for food."
    "examples":
      "盘子很干净。": "The plate is clean."
      "盘子里有饺子。":
        "native": "There are dumplings on the plate."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-0891":
    "native": "cup; glass"
    "notes":
      "n1": "A cup or glass, for a drink."
    "examples":
      "杯子里有水。":
        "native": "There is water in the cup."
        "bases":
          "有":
            "meaning": "to have; there is"
      "我买了三个杯子。":
        "native": "I bought three cups."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-0892":
    "native": "fork"
    "notes":
      "n1": "A fork, for eating."
    "examples":
      "用叉子吃面包。":
        "native": "Eat bread with a fork."
        "bases":
          "用":
            "meaning": "to use"
      "叉子在盘子旁边。": "The fork is next to the plate."
  "zh-0893":
    "native": "knife"
    "notes":
      "n1": "A knife, for cutting food."
    "examples":
      "刀很快。": "The knife is very sharp."
      "用刀切肉。":
        "native": "Cut the meat with a knife."
        "bases":
          "用":
            "meaning": "to use"
  "zh-0894":
    "native": "soy milk"
    "notes":
      "n1": "Soy milk, drunk hot in the morning. 豆 (dòu) is a bean."
    "examples":
      "早饭我喝豆浆。": "For breakfast I drink soy milk."
      "豆浆是热的。":
        "native": "The soy milk is hot."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-0895":
    "native": "fried dough stick"
    "notes":
      "n1": "A long fried dough stick, eaten for breakfast with soy milk."
    "examples":
      "早上我吃油条。": "In the morning I eat a fried dough stick."
      "油条很香。": "The fried dough sticks smell good."
  "zh-0896":
    "native": "steamed bread"
    "notes":
      "n1": "A plain steamed bun, soft and white, with no filling."
    "examples":
      "馒头很白。": "The steamed bread is very white."
      "他吃两个馒头。": "He eats two steamed breads."
  "zh-0897":
    "native": "congee; rice porridge"
    "notes":
      "n1": "A thin rice porridge, often eaten in the morning or evening."
    "examples":
      "晚上我喝粥。": "In the evening I drink congee."
      "粥很热。": "The congee is very hot."
  "zh-0898":
    "native": "shrimp; prawn"
    "notes":
      "n1": "A shrimp or prawn, from the sea or a river."
    "examples":
      "虾很贵。": "Shrimp is expensive."
      "我喜欢吃虾。": "I like to eat shrimp."
  "zh-0899":
    "native": "crab"
    "notes":
      "n1": "A crab, a shellfish eaten especially in autumn."
    "examples":
      "秋天吃螃蟹。": "Eat crab in autumn."
      "螃蟹很大。": "The crab is very big."
  "zh-0900":
    "native": "mushroom"
    "notes":
      "n1": "A mushroom, eaten fresh or dried."
    "examples":
      "蘑菇很好吃。": "The mushrooms are delicious."
      "汤里有蘑菇。":
        "native": "There are mushrooms in the soup."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-0901":
    "native": "aubergine; eggplant"
    "notes":
      "n1": "An aubergine, purple and soft when cooked."
    "examples":
      "我不吃茄子。": "I do not eat aubergine."
      "茄子很便宜。": "Aubergine is cheap."
  "zh-0902":
    "native": "radish; white radish"
    "notes":
      "n1": "A radish, a root vegetable, white or red."
    "examples":
      "萝卜很便宜。": "Radish is cheap."
      "汤里有萝卜。":
        "native": "There is radish in the soup."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-0903":
    "native": "green vegetables; bok choy"
    "notes":
      "n1": "Green leafy vegetables, cooked quickly. 青 (qīng) is green."
    "examples":
      "青菜很新鲜。": "The greens are very fresh."
      "我每天吃青菜。":
        "native": "I eat greens every day."
        "bases":
          "每天":
            "meaning": "every day"
  "zh-0904":
    "native": "onion"
    "notes":
      "n1": "An onion. 洋 (yáng) means foreign, and 葱 (cōng) is spring onion."
    "examples":
      "洋葱很辣。": "Onion is very sharp."
      "汤里放洋葱。": "Put onion in the soup."
  "zh-0905":
    "native": "garlic"
    "notes":
      "n1": "Garlic, strong in flavour. 蒜 (suàn) is garlic."
    "examples":
      "大蒜很香。": "The garlic smells good."
      "我用大蒜做菜。":
        "native": "I cook a dish with garlic."
        "bases":
          "用":
            "meaning": "to use"
  "zh-0906":
    "native": "Sichuan pepper"
    "notes":
      "n1": "Sichuan pepper, a spice that numbs the mouth. 椒 (jiāo) is pepper."
    "examples":
      "花椒很麻。": "Sichuan pepper is numbing."
      "这个菜有花椒。":
        "native": "This dish has Sichuan pepper in it."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-0907":
    "native": "sesame"
    "notes":
      "n1": "Sesame seeds, sprinkled on bread or used in oil."
    "examples":
      "芝麻很香。": "Sesame smells good."
      "面包上有芝麻。":
        "native": "There are sesame seeds on the bread."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-0908":
    "native": "honey"
    "notes":
      "n1": "Honey, made by bees. 蜂 (fēng) is a bee."
    "examples":
      "我喜欢蜂蜜。": "I like honey."
      "牛奶里加蜂蜜。": "Put honey in the milk."
  "zh-0909":
    "native": "cheese"
    "notes":
      "n1": "Cheese, made from milk. 奶 (nǎi) is milk."
    "examples":
      "面包上有奶酪。":
        "native": "There is cheese on the bread."
        "bases":
          "有":
            "meaning": "to have; there is"
      "奶酪很贵。": "Cheese is expensive."
  "zh-0910":
    "native": "butter"
    "notes":
      "n1": "Butter, spread on bread. 黄 (huáng) is yellow."
    "examples":
      "面包上放黄油。": "Put butter on the bread."
      "黄油在冰箱里。": "The butter is in the fridge."
  "zh-0911":
    "native": "strawberry"
    "notes":
      "n1": "A strawberry, a red fruit with small seeds. 草 (cǎo) is grass."
    "examples":
      "草莓很甜。": "Strawberries are very sweet."
      "我买一斤草莓。": "I buy half a kilo of strawberries."
  "zh-0912":
    "native": "lychee"
    "notes":
      "n1": "A lychee, a sweet fruit with a rough red skin."
    "examples":
      "荔枝很甜。": "Lychees are very sweet."
      "夏天有荔枝。":
        "native": "There are lychees in summer."
        "bases":
          "有":
            "meaning": "to have; there is"
  "zh-0913":
    "native": "pear"
    "notes":
      "n1": "A pear, a juicy fruit."
    "examples":
      "梨很大。": "The pear is very big."
      "我吃一个梨。": "I eat a pear."
  "zh-0914":
    "native": "peach"
    "notes":
      "n1": "A peach, a soft fruit with fuzzy skin. 桃 (táo) is peach."
    "examples":
      "桃子很甜。": "The peach is very sweet."
      "这个桃子很大。": "This peach is very big."
  "zh-0915":
    "native": "lemon"
    "notes":
      "n1": "A lemon, sour and yellow."
    "examples":
      "柠檬很酸。": "Lemons are very sour."
      "我喝柠檬水。": "I drink lemon water."
  "zh-0916":
    "native": "mango"
    "notes":
      "n1": "A mango, a sweet yellow fruit."
    "examples":
      "芒果很甜。": "Mangoes are very sweet."
      "我喜欢芒果。": "I like mangoes."
  "zh-0917":
    "native": "fizzy drink; soda"
    "notes":
      "n1": "A fizzy soft drink. 汽 (qì) is steam or gas."
    "examples":
      "汽水很冷。": "The fizzy drink is very cold."
      "孩子喝汽水。": "The child drinks fizzy drink."
  "zh-0918":
    "native": "to boil; to cook in water"
    "notes":
      "n1": "To cook food in boiling water."
    "examples":
      "我煮面条。": "I cook noodles."
      "水开了。":
        "native": "The water has boiled."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-0919":
    "native": "to stir-fry"
    "notes":
      "n1": "To stir-fry food quickly in a hot pan."
    "examples":
      "妈妈炒菜。": "Mum stir-fries a dish."
      "我喜欢炒青菜。": "I like stir-fried greens."
  "zh-0920":
    "native": "to steam"
    "notes":
      "n1": "To cook food by steam."
    "examples":
      "我蒸包子。": "I steam the buns."
      "蒸的饺子很好吃。":
        "native": "Steamed dumplings are delicious."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-0921":
    "native": "to deep-fry"
    "notes":
      "n1": "To fry food in a lot of hot oil."
    "examples":
      "我炸鸡肉。": "I deep-fry chicken."
      "油条是炸的。":
        "native": "Fried dough sticks are deep-fried."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
  "zh-0922":
    "native": "to roast; to bake"
    "notes":
      "n1": "To cook food over a fire or in an oven."
    "examples":
      "我烤面包。": "I toast the bread."
      "烤鸭子很好吃。": "Roast duck is delicious."
  "zh-0923":
    "native": "salty"
    "notes":
      "n1": "Salty, the taste of salt. Its opposite is 淡 (dàn), not salty."
    "examples":
      "汤太咸了。":
        "native": "The soup is too salty."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
      "这个菜不咸。": "This dish is not salty."
  "zh-0924":
    "native": "to taste"
    "notes":
      "n1": "To taste a food, to try it with the mouth."
    "examples":
      "你尝一下。":
        "native": "Taste it."
        "bases":
          "一下":
            "meaning": "a little; have a try"
      "请尝尝汤。": "Please taste the soup."
  "zh-0925":
    "native": "thirsty"
    "notes":
      "n1": "Thirsty, wanting a drink."
    "examples":
      "我很渴。": "I am very thirsty."
      "渴了就喝水。":
        "native": "When you are thirsty, drink water."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-0926":
    "native": "alcohol; wine"
    "notes":
      "n1": "Alcoholic drink, such as wine or spirits. Beer is 啤酒 (píjiǔ)."
    "examples":
      "他不喝酒。": "He does not drink alcohol."
      "这个酒很贵。": "This wine is expensive."
  "zh-0927":
    "native": "dish; vegetables"
    "notes":
      "n1": "A dish of food, or vegetables. 菜 (cài) can mean both."
    "examples":
      "这个菜很好吃。": "This dish is delicious."
      "菜太多了。":
        "native": "There is too much food."
        "bases":
          "了":
            "meaning": "a particle: a change has happened"
  "zh-0928":
    "native": "taste; flavour"
    "notes":
      "n1": "The taste or flavour of food."
    "examples":
      "汤的味道很好。":
        "native": "The soup tastes very good."
        "bases":
          "的":
            "meaning": "a particle: of; belonging to"
      "味道很香。": "It has a good smell and taste."
  "zh-0929":
    "native": "fragrant; smelling good"
    "notes":
      "n1": "Fragrant, with a good smell or taste. Its opposite is 臭 (chòu), bad-smelling."
    "examples":
      "饭很香。": "The food smells good."
      "这个面包很香。": "This bread smells good."
  "zh-0930":
    "native": "hot pot"
    "notes":
      "n1": "A hot pot, a pot of soup at the table in which food is cooked. 锅 (guō) is a pot."
    "examples":
      "我们去吃火锅。": "We go to eat hot pot."
      "火锅很辣。": "The hot pot is very spicy."
  "zh-0931":
    "native": "pepper (black pepper)"
    "notes":
      "n1": "Black pepper, a spice for food."
    "examples":
      "汤里加胡椒。": "Add pepper to the soup."
      "胡椒很辣。": "Pepper is spicy."
  "zh-0932":
    "native": "milk tea"
    "notes":
      "n1": "Milk tea, sweet and warm. 茶 (chá) is tea."
    "examples":
      "我喝奶茶。": "I drink milk tea."
      "奶茶很甜。": "The milk tea is very sweet."
  "zh-0933":
    "native": "drink"
    "notes":
      "n1": "A drink, any drink that is not water."
    "examples":
      "这个饮料很便宜。": "This drink is cheap."
      "你要什么饮料？":
        "native": "Which drink do you want?"
        "bases":
          "要":
            "meaning": "to want; to need"
  "zh-0934":
    "native": "ice cream"
    "notes":
      "n1": "Ice cream, cold and sweet."
    "examples":
      "孩子喜欢冰淇淋。": "Children like ice cream."
      "冰淇淋很冷。": "The ice cream is very cold."
  "zh-0935":
    "native": "chips; fries"
    "notes":
      "n1": "Chips, or French fries, long and thin."
    "examples":
      "薯条很热。": "The fries are hot."
      "孩子喜欢吃薯条。": "Children like to eat fries."
