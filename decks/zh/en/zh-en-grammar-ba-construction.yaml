"name": "把 (bǎ): the object before the verb"
"license": "CC-BY-SA-4.0"
"description": "Putting the object before the verb with 把 (bǎ), to say what was done to it and with what result. Not yet checked by a Mandarin speaker: please report any mistake."
"tags":
- "unreviewed"
"pattern":
  "name": "把 (bǎ): the object before the verb"
  "slot_name": "form"
  "prompt": "{lemma} ({gloss}), {slot}"
  "slots":
    "plain": "a plain statement, the object after the verb"
    "ba": "with 把 (bǎ), the object before the verb and the result after it"
  "entries":
    "fang": "to put"
    "xie": "to write"
    "chi": "to eat"
    "xi": "to wash"
    "guan": "to close"
    "song": "to give; to send"
  "notes": "With 把 (bǎ), the object comes before the verb, and something must happen to it: 我把书放在桌子上 (wǒ bǎ shū fàng zài zhuōzi shàng), I put the book on the table. The verb must have a result or a direction after it, such as 完 (wán), 干净 (gānjìng) or 上 (shàng). Do not use 把 (bǎ) with a verb alone, and do not use it with 是 (shì) or 有 (yǒu)."
