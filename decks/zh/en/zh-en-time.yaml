"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Time and days"
"description": "Twenty-five words for time and days: the hour and the minute, morning, noon and evening, today, tomorrow and yesterday, the week and the weekend, and before and after, with their opposites. Not yet checked by a Mandarin speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "zh-0479":
    "native": "time"
    "notes":
      "n1": "Time, as a length or a general idea: 时间很快 (shíjiān hěn kuài), time passes quickly. For the hour on a clock, ask 几点 (jǐ diǎn), what time."
    "examples":
      "时间很快。": "Time passes quickly."
      "时间很少。": "There is little time."
  "zh-0480":
    "native": "o'clock"
    "notes":
      "n1": "O'clock, for the hour: 三点 (sān diǎn), three o'clock. It is not the same word as 一点 (yìdiǎn), a little."
    "examples":
      "三点来。": "Come at three o'clock."
      "他十一点睡觉。": "He goes to sleep at eleven o'clock."
  "zh-0481":
    "native": "minute"
    "notes":
      "n1": "A minute, for the time past the hour: 三点五分 (sān diǎn wǔ fēn), five past three. The same character also means a cent in money."
    "examples":
      "三点五分。": "Five past three."
      "我等三十分。": "I wait thirty minutes."
  "zh-0482":
    "native": "now; at present"
    "notes":
      "n1": "Now, at the present time. It usually comes before the verb: 你现在吃饭吗 (nǐ xiànzài chīfàn ma)? Are you eating now?"
    "examples":
      "现在几点？": "What time is it now?"
      "你现在吃饭吗？": "Are you eating now?"
  "zh-0483":
    "native": "today"
    "notes":
      "n1": "Today, the day we are in. 天 (tiān) on its own is a day, not today."
    "examples":
      "今天很热。": "It is very hot today."
      "今天你来吗？": "Are you coming today?"
  "zh-0484":
    "native": "tomorrow"
    "notes":
      "n1": "Tomorrow, the day after today. Its opposite is 昨天 (zuótiān), yesterday."
    "examples":
      "明天来。": "Come tomorrow."
      "明天你们去学校吗？": "Are you going to school tomorrow?"
  "zh-0485":
    "native": "yesterday"
    "notes":
      "n1": "Yesterday, the day before today. Its opposite is 明天 (míngtiān), tomorrow."
    "examples":
      "昨天很忙。": "Yesterday was very busy."
      "你昨天吃鱼吗？": "Did you eat fish yesterday?"
  "zh-0486":
    "native": "day; weather"
    "notes":
      "n1": "A day, as a length of time: 一天 (yì tiān), one day. It is also the weather in 天很冷 (tiān hěn lěng), it is cold."
    "examples":
      "天很冷。": "It is cold."
      "一天很快。": "A day goes by quickly."
  "zh-0487":
    "native": "morning"
    "notes":
      "n1": "The morning, from sunrise to about noon. 早上九点 (zǎoshang jiǔ diǎn), nine in the morning."
    "examples":
      "早上很冷。": "The morning is very cold."
      "早上吃饭吗？": "Do you eat in the morning?"
  "zh-0488":
    "native": "forenoon; before noon"
    "notes":
      "n1": "The forenoon, the time before noon. Its opposite is 下午 (xiàwǔ), afternoon."
    "examples":
      "上午很忙。": "The forenoon is very busy."
      "你上午来吗？": "Are you coming in the morning?"
  "zh-0489":
    "native": "noon; midday"
    "notes":
      "n1": "Noon, around twelve o'clock, between 上午 (shàngwǔ) and 下午 (xiàwǔ)."
    "examples":
      "中午吃饭。": "We eat at noon."
      "中午你们吃鱼吗？": "Will you eat fish at noon?"
  "zh-0490":
    "native": "afternoon"
    "notes":
      "n1": "The afternoon, after noon. Its opposite is 上午 (shàngwǔ), the forenoon."
    "examples":
      "下午来。": "Come in the afternoon."
      "下午很热吗？": "Is it very hot in the afternoon?"
  "zh-0491":
    "native": "evening; night"
    "notes":
      "n1": "The evening and the night, after the sun goes down. 晚上睡觉 (wǎnshang shuìjiào), to sleep at night."
    "examples":
      "晚上睡觉。": "Sleep at night."
      "晚上你回家吗？": "Are you going home in the evening?"
  "zh-0492":
    "native": "week; weekday"
    "notes":
      "n1": "A week, and the day of it with a number: 星期一 (xīngqī yī), Monday; 星期三 (xīngqī sān), Wednesday."
    "examples":
      "星期一来。": "Come on Monday."
      "星期三我们去学校。": "On Wednesday we go to school."
  "zh-0493":
    "native": "hour"
    "notes":
      "n1": "An hour, as a length of time: 一小时 (yì xiǎoshí), one hour. It is not the same as 点 (diǎn), o'clock."
    "examples":
      "两小时。": "Two hours."
      "我们等一小时。": "We wait one hour."
  "zh-0494":
    "native": "early"
    "notes":
      "n1": "Early, before the usual time. Its opposite is 晚 (wǎn), late."
    "examples":
      "早来。": "Come early."
      "他很早起床。": "He gets up very early."
  "zh-0495":
    "native": "late"
    "notes":
      "n1": "Late, after the usual time. Its opposite is 早 (zǎo), early."
    "examples":
      "他很晚睡觉。": "He goes to sleep very late."
      "你们来晚吗？": "Are you coming late?"
  "zh-0496":
    "native": "to close; to shut"
    "notes":
      "n1": "To close or shut, for a shop or a door. Its opposite is 开 (kāi), to open."
    "examples":
      "请关。": "Please close it."
      "几点关？": "What time does it close?"
  "zh-0497":
    "native": "to be open for business"
    "notes":
      "n1": "To be open for business, of a shop. 现在营业 (xiànzài yíngyè), now open."
    "examples":
      "现在营业。": "It is open for business now."
      "中午营业吗？": "Is it open at noon?"
  "zh-0498":
    "native": "to open for business; to open the door"
    "notes":
      "n1": "To open a door, or of a shop, to open for business. 早上几点开门 (zǎoshang jǐ diǎn kāimén), what time does it open in the morning?"
    "examples":
      "现在开门。": "It opens now."
      "早上几点开门？": "What time does it open in the morning?"
  "zh-0499":
    "native": "before; in the past"
    "notes":
      "n1": "Before, in the past, or before a time. Its opposite is 以后 (yǐhòu), after."
    "examples":
      "以前很忙。": "Before, it was very busy."
      "以前你住哪里？": "Where did you live before?"
  "zh-0500":
    "native": "after; later"
    "notes":
      "n1": "After, later, in the future. Its opposite is 以前 (yǐqián), before."
    "examples":
      "以后再来。": "Come again later."
      "以后吃饭吗？": "Will you eat later?"
  "zh-0501":
    "native": "Sunday"
    "notes":
      "n1": "Sunday. The formal word is 星期日 (xīngqīrì), but 星期天 (xīngqītiān) is the usual one in speech."
    "examples":
      "星期天不上班。": "No work on Sunday."
      "星期天你们来吗？": "Are you coming on Sunday?"
  "zh-0502":
    "native": "weekend"
    "notes":
      "n1": "The weekend, Saturday and Sunday. 周 (zhōu) is the week and 末 (mò) is the end of it."
    "examples":
      "周末很快。": "The weekend goes by quickly."
      "周末你做什么？": "What do you do at the weekend?"
  "zh-0503":
    "native": "year"
    "notes":
      "n1": "A year, as a length of time: 一年 (yì nián), one year."
    "examples":
      "一年很长。": "A year is very long."
      "一年很快。": "A year goes by quickly."
