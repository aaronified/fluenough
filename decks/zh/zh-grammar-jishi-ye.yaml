  "entries":
  - "lemma": "下雨"
    "key": "xiayu"
    "reading": "xiàyǔ"
    "forms":
      "plain": "下雨我去"
      "even-if": "即使下雨，我也去"
      "even-if-not": "即使不下雨，我也去"
    "readings":
      "plain": "xiàyǔ wǒ qù"
      "even-if": "jíshǐ xiàyǔ, wǒ yě qù"
      "even-if-not": "jíshǐ bú xiàyǔ, wǒ yě qù"
  - "lemma": "贵"
    "key": "gui"
    "reading": "guì"
    "forms":
      "plain": "这个很贵"
      "even-if": "即使这个贵，我也买"
      "even-if-not": "即使这个不贵，我也不买"
    "readings":
      "plain": "zhè ge hěn guì"
      "even-if": "jíshǐ zhè ge guì, wǒ yě mǎi"
      "even-if-not": "jíshǐ zhè ge bú guì, wǒ yě bù mǎi"
  - "lemma": "累"
    "key": "lei"
    "reading": "lèi"
    "forms":
      "plain": "我很累"
      "even-if": "即使我很累，我也工作"
      "even-if-not": "即使我不累，我也工作"
    "readings":
      "plain": "wǒ hěn lèi"
      "even-if": "jíshǐ wǒ hěn lèi, wǒ yě gōngzuò"
      "even-if-not": "jíshǐ wǒ bú lèi, wǒ yě gōngzuò"
  - "lemma": "努力"
    "key": "nuli"
    "reading": "nǔlì"
    "forms":
      "plain": "他努力"
      "even-if": "即使他努力，也不一定成功"
      "even-if-not": "即使他不努力，也不一定失败"
    "readings":
      "plain": "tā nǔlì"
      "even-if": "jíshǐ tā nǔlì, yě bù yídìng chénggōng"
      "even-if-not": "jíshǐ tā bù nǔlì, yě bù yídìng shībài"
