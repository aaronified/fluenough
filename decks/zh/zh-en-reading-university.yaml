  - "id": "zh-campus-notice"
    "title": "Notice about the final exams"
    "theme": "university"
    "sentences":
      - "text": "各位 同学， 期末 考试 从 一 月 十 号 开始。"
        "reading": "gèwèi tóngxué, qīmò kǎoshì cóng yí yuè shí hào kāishǐ."
      - "text": "考场 在 图书馆 旁边 的 教室 里。"
        "reading": "kǎochǎng zài túshūguǎn pángbiān de jiàoshì lǐ."
      - "text": "请 同学们 提前 十五 分钟 到。"
        "reading": "qǐng tóngxuémen tíqián shíwǔ fēnzhōng dào."
      - "text": "没有 学生证 的 同学 不 能 进入 考场。"
        "reading": "méiyǒu xuéshēngzhèng de tóngxué bù néng jìnrù kǎochǎng."
