  - "id": "zh-student-diary"
    "title": "A week of study"
    "theme": "university"
    "sentences":
      - "text": "这个 学期 我 选 了 三 门 课。"
        "reading": "zhège xuéqī wǒ xuǎn le sān mén kè."
      - "text": "周一 我 去 实验室 做 实验， 很 累。"
        "reading": "zhōuyī wǒ qù shíyànshì zuò shíyàn, hěn lèi."
      - "text": "周三 的 讲座 很 有意思， 我 做 了 很多 笔记。"
        "reading": "zhōusān de jiǎngzuò hěn yǒuyìsi, wǒ zuò le hěnduō bǐjì."
      - "text": "周末 我 和 同学 一起 复习， 准备 下周 的 考试。"
        "reading": "zhōumò wǒ hé tóngxué yìqǐ fùxí, zhǔnbèi xiàzhōu de kǎoshì."
