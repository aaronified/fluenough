- "id": "idiom-story"
  "title": "A farmer and a rabbit"
  "theme": "idioms"
  "sentences":
  - "text": "从前 有 个 农夫 在 田里 干活。"
    "reading": "cóngqián yǒu ge nóngfū zài tiánlǐ gànhuó."
  - "text": "一天， 一 只 兔子 跑 过来， 撞 在 树桩 上 死 了。"
    "reading": "yì tiān, yì zhī tùzi pǎo guòlái, zhuàng zài shùzhuāng shàng sǐ le."
  - "text": "农夫 捡 起 兔子， 高兴 极 了。"
    "reading": "nóngfū jiǎn qǐ tùzi, gāoxìng jí le."
  - "text": "从此 他 不再 干活， 每天 坐 在 树下 等 兔子。"
    "reading": "cóngcǐ tā bú zài gànhuó, měitiān zuò zài shùxià děng tùzi."
