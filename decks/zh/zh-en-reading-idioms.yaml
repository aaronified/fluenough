- "id": "idiom-in-use"
  "title": "A friend's idioms"
  "theme": "idioms"
  "sentences":
  - "text": "我 的 朋友 说话 常 用 成语。"
    "reading": "wǒ de péngyou shuōhuà cháng yòng chéngyǔ."
  - "text": "他 说 做 事 要 一心一意， 不要 三心二意。"
    "reading": "tā shuō zuò shì yào yī xīn yí yì, bú yào sān xīn èr yì."
  - "text": "我 忘 了 写 作业， 他 说 亡羊补牢， 现在 写 还 来得及。"
    "reading": "wǒ wàng le xiě zuòyè, tā shuō wáng yáng bǔ láo, xiànzài xiě hái láidejí."
  - "text": "我 很 感谢 他 的 提醒。"
    "reading": "wǒ hěn gǎnxiè tā de tíxǐng."
  "questions":
  - "id": "zh-4384"
    "prompt":
      "en": "Which idiom in the talk means 'single-minded'?"
    "options":
    - "en": "三心二意 (sān xīn èr yì)"
    - "en": "一心一意 (yī xīn yí yì)"
    "answer": 2
  - "id": "zh-4385"
    "prompt":
      "en": "The friend says 亡羊补牢 when it is already too late to do anything."
    "answer": false
  - "id": "zh-4386"
    "prompt":
      "en": "Which idiom did the friend use to say a mistake can still be fixed in time?"
