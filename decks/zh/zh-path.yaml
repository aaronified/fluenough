# The order Mandarin Chinese is taught in, one unit per line, from every
# language it is taught from: each deck is named by its core id, and a
# learner from English is taught zh-en-<name> for zh-<name> (ADR-0013,
# ADR-0036).
#
# This is also Mandarin's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"):
# every unit from the first words to B1, planned, with its size in words,
# its grammar topics, the three milestones, and for each unit its listening
# and reading passages. The first six units are written (the phrasebook and
# the first words, the tones, the pinyin spelling, the sounds English
# lacks, the questions, and addressing); every other unit is planned: the course teaches it as
# "Coming" until a deck is written. A
# theme named here that decks/themes.yaml does not list yet is added to it
# with its first deck.
#
# The course: Mandarin as taught in mainland China (Putonghua), written in
# simplified characters, with pinyin with tone marks as the reading (based
# on the standard Hanyu Pinyin romanisation). Cantonese (#377) is a course
# of its own. Simplified and traditional characters are two scripts of this
# one course (owner, 2026-10-20), as Devanagari and Perso-Arabic are of
# Hindustani: each card gives both. The code is "zh", the
# code the IPA course already gives its Mandarin examples (ISO 639-1 zh;
# its ISO 639-3 code is cmn).
#
# Sizes. The plan's levels are about 700, 900 and 1,200 words (low
# confidence). Mandarin is tier V (docs/plans/language-paths-scheme.md,
# x3.7 in time), and a Mandarin B1 needs more words than a Romance one (the
# new HSK's first four levels list about 500, 1,270, 2,250 and 3,250
# words), so the levels here are raised, as Japanese's are, to about 800,
# 1,050 and 1,500 words, about 3,350 in all: near the most the validator's
# range (2,000-3,500 up to B1, each level within half to one and a half
# times its size) allows. The tier stretches the time a level takes, not
# the words it holds. Sizes are one number for every native language.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"):
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units, read in pinyin: the tones first among the
#    sounds, then the pinyin spelling and the tone changes, then the sounds
#    English lacks, then the first themes;
# 3. the script, after the first word units ("After units 4-6"): strokes,
#    stroke order and the common radicals, then the characters a set at a
#    time through A1, A2 and B1, as the scheme's tier V order has it
#    ("characters (radicals first, gradual)"): about 300 by A1, 600 by A2
#    and 900 by B1 (the new HSK's first three levels; low confidence). A
#    learner who learns without the script skips them (#554), and keeps
#    pinyin, which is the reading, not the script;
# 4. a core of about 200 common words in themed units, before the large
#    tables ("Yes, smaller (~200)");
# 5. rules as forms: shi (to be) and bu (not), the questions, the word
#    order of time and place, de, you (to have), adjectives with hen, and
#    the first measure words, practised on the words already known;
# 6. sentences, each after its words and rules; then the other themes,
#    each its words, then its rules, then its sentences.
# Mandarin's grammar keeps the East Asian order of
# docs/plans/language-paths-scheme.md within each level: measure words,
# SVO and time-place order, le and guo, de, then the complements and ba
# and bei. Its spine is the measure words (from A1, by the themes that
# need them), the aspect markers le, guo and zhe (A1 and A2), ba (A2,
# again at B1 with complements) and the complements: degree, result,
# direction and potential at A2, and their extended senses at B1.
#
# Mandarin is written without spaces between words, so the checks that
# split a card's text into words wait for its words to be given
# (docs/plans/language-paths.md, "Scripts without spaces").
#
# The core's order is by judgement, most common first: about me, everyday
# verbs, the common adverbs and function words, how much and how many,
# describing words, time, where things are, more verbs. It was meant to
# come from Wikipedia's counts (tools/wikipedia_frequency.py, #516): order
# the core again from the counts once they are written.
#
# Script units not written yet. The format has no planned form for an
# alphabet unit, which counts neither words nor grammar: a planned unit is
# a theme, which counts words, or a grammar topic. So each planned script
# unit is planned as a grammar unit of 0 words with a topic named
# script-..., and when its deck is written it becomes a plain list unit,
# its deck goes into alphabet, and its topic leaves the grammar count.
#
# Every deck of Mandarin is listed exactly once.
schema: 1
kind: "path"
id: "zh-path"
language: "zh"
# No gender classes: a noun takes no gender (#512; DECK-FORMAT.md, Card
# data). A noun's measure word goes in its notes and in the rules.
genders: []
# Where Mandarin is spoken, for a rater's region and a card's region note
# (ADR-0036): the main groups of Mandarin dialects in China (northern,
# with Beijing and the northeast, whose speech the standard is based on;
# the central plains and northwest; the lower Yangtze; the southwest), the
# south and southeast of China, where most speak Putonghua beside Wu, Yue,
# Min or Hakka and their accent differs; and the standard Mandarins of
# Taiwan and of Singapore and Malaysia, which have their own norms of
# sound and word. Each is named with example places so that a rater can
# place themselves. Taiwan writes traditional characters; its speakers
# still rate sound and word. Low confidence on the grouping: a native
# reviewer checks this list before any rating names a region. The ids are
# permanent, as card ids are; rename a name, never an id. The app adds
# "Elsewhere" after them (Hong Kong, Macau, and Chinese communities
# abroad).
regions:
  - id: "northern"
    name: { "en": "Northern and northeastern China (Beijing, Tianjin, Hebei, Shandong, Harbin, Shenyang)" }
  - id: "central-plains-northwest"
    name: { "en": "Central plains and northwest China (Henan, Shaanxi, Gansu: Zhengzhou, Xi'an, Lanzhou)" }
  - id: "lower-yangtze"
    name: { "en": "Lower Yangtze (Jiangsu and Anhui: Nanjing, Hefei, Yangzhou)" }
  - id: "southwestern"
    name: { "en": "Southwest China (Sichuan, Chongqing, Yunnan, Guizhou, Hubei: Chengdu, Kunming, Wuhan)" }
  - id: "southern-china"
    name: { "en": "South and southeast China, beside Wu, Yue, Min and Hakka (Shanghai, Hangzhou, Guangzhou, Shenzhen, Fuzhou, Xiamen)" }
  - id: "taiwan"
    name: { "en": "Taiwan (Taipei, Taichung, Kaohsiung)" }
  - id: "singapore-malaysia"
    name: { "en": "Singapore and Malaysia (Singapore, Kuala Lumpur, Penang, Johor Bahru)" }
# The decks that need the script: a learner who learns without it skips
# them. No script deck is written yet; the planned script units (strokes
# and radicals, and the seven character sets) join this list as each is
# written, so it is left out until then.
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  # 1. The phrasebook, taught whole from the first lesson, with the first
  # words beside it: zh-phrasebook (15-25 survival phrases, which count no
  # words) and zh-first-words.
  - decks: ["zh-phrasebook", "zh-first-words", "*"]
    words: 12
  # 2. The first word units, read in pinyin: the tones first.
  - decks: ["zh-tones", "zh-tones-sentences", "zh-reading-tones", "*"]
    words: 16
    listening_passages:
      - { id: "four-tones", text: { "en": "One syllable in the four tones and the neutral tone: ma, mother, hemp, horse, to scold" } }
    reading_passages:
      - { id: "tone-pairs-list", text: { "en": "A list of word pairs in pinyin told apart only by their tone marks" } }
  - decks: ["zh-pinyin", "zh-pinyin-sentences", "zh-reading-pinyin", "zh-grammar-pinyin-spelling", "zh-grammar-tone-sandhi"]
    words: 8
    grammar: ["pinyin-spelling", "tone-sandhi"]
    listening_passages:
      - { id: "ni-hao-is-ni-hao", text: { "en": "Hearing two third tones meet: ni hao said as ni hao with a rising first syllable, and yi and bu changing their tone" } }
    reading_passages:
      - { id: "pinyin-spelling-chart", text: { "en": "A chart of pinyin spellings: where the tone mark sits, yu and u after j, q and x, and the shortened iu, ui and un" } }
  - decks: ["zh-sound-differences", "zh-sound-differences-sentences", "zh-reading-sound-differences", "*"]
    words: 16
    listening_passages:
      - { id: "zh-ch-sh-and-j-q-x", text: { "en": "Pairs of words told apart by sounds English lacks: zhi and ji, chi and qi, shi and xi, lu and lü" } }
    reading_passages:
      - { id: "sound-pairs-list", text: { "en": "A list of word pairs in pinyin that differ by one sound" } }
  - decks: ["zh-questions", "zh-questions-sentences", "zh-reading-questions", "*"]
    words: 15
    listening_passages:
      - { id: "at-the-information-desk", text: { "en": "Asking who, what, where and when at an information desk" } }
    reading_passages:
      - { id: "visitor-faq", text: { "en": "A short visitor's sheet of questions and answers" } }
  - decks: ["zh-addressing", "zh-addressing-sentences", "zh-reading-addressing", "*"]
    words: 20
    listening_passages:
      - { id: "teacher-and-classmate", text: { "en": "Meeting a teacher and a classmate: surnames, laoshi, xiansheng and nin" } }
    reading_passages:
      - { id: "name-cards", text: { "en": "Business cards exchanged at a meeting, surname first" } }
  - decks: ["zh-pronouns", "zh-pronouns-sentences", "zh-reading-pronouns", "*"]
    words: 10
    listening_passages:
      - { id: "who-is-that", text: { "en": "Pointing out who is who in a group photo: I, you, he, she, we" } }
    reading_passages:
      - { id: "class-photo-caption", text: { "en": "A caption under a class photo naming each person" } }
  - decks: ["zh-family", "zh-family-sentences", "zh-reading-family", "*"]
    words: 14
    listening_passages:
      - { id: "my-family", text: { "en": "Talking about your family, with the separate words for older and younger brothers and sisters" } }
    reading_passages:
      - { id: "family-introduction", text: { "en": "A short self-introduction naming the family" } }
  - decks: ["zh-numbers-1-20", "zh-numbers-1-20-sentences", "zh-reading-numbers", "*"]
    words: 9
    listening_passages:
      - { id: "counting-on-fingers", text: { "en": "Counting from one to twenty, and the two words for two: er and liang" } }
    reading_passages:
      - { id: "locker-numbers", text: { "en": "Locker numbers at a station" } }
  # 3. The script, after the first word units (#554: skipped by a learner
  # who learns without it). Strokes, stroke order and the common radicals
  # first, then the first set of characters: numbers, people and the
  # simplest pictures.
  - planned: { id: "zh-strokes-radicals", grammar: "script-strokes-radicals", words: 0 }
    listening_passages:
      - { id: "naming-the-strokes", text: { "en": "A teacher names the basic strokes and the order they are written in, while writing ren, person, and kou, mouth" } }
    reading_passages:
      - { id: "radical-chart", text: { "en": "A chart of common radicals with their meanings: water, hand, mouth, person, wood" } }
  - planned: { id: "zh-characters-1", grammar: "script-characters-1", words: 0 }
    listening_passages:
      - { id: "one-two-three", text: { "en": "Hearing the words whose characters are taught: the numbers, person, big, small, I, you" } }
    reading_passages:
      - { id: "number-signs", text: { "en": "Simple signs in characters: floor numbers, prices, big and small sizes" } }
  # 4. The core: about 200 common words, most common first (by judgement
  # until the Wikipedia counts are written, #516).
  - planned: { id: "zh-about-me", theme: "about-me", words: 20 }
    listening_passages:
      - { id: "self-introduction", text: { "en": "A self-introduction on the first day at a language school" } }
    reading_passages:
      - { id: "registration-card", text: { "en": "A registration card: name, age, country, job" } }
  - planned: { id: "zh-everyday-verbs", theme: "everyday-verbs", words: 35 }
    listening_passages:
      - { id: "a-morning-at-home", text: { "en": "A mother says what each person in the house does in the morning" } }
    reading_passages:
      - { id: "note-on-the-table", text: { "en": "A note on the table: what to eat, what to drink, when to come home" } }
  - planned: { id: "zh-adverbs", theme: "adverbs", words: 30 }
    listening_passages:
      - { id: "how-often", text: { "en": "Saying how often and how much: always, also, all, very, too" } }
    reading_passages:
      - { id: "habit-survey", text: { "en": "A short survey about everyday habits" } }
  - planned: { id: "zh-quantities", theme: "quantities", words: 25 }
    listening_passages:
      - { id: "how-many-do-you-want", text: { "en": "Asking how much and how many at a bakery: ji and duoshao" } }
    reading_passages:
      - { id: "recipe-amounts", text: { "en": "The amounts on a recipe card" } }
  - planned: { id: "zh-describing", theme: "describing", words: 35 }
    listening_passages:
      - { id: "how-is-it", text: { "en": "A friend asks about your new room: big, quiet, convenient" } }
    reading_passages:
      - { id: "postcard-from-hangzhou", text: { "en": "A short postcard: the weather, the food, the people" } }
  - planned: { id: "zh-time", theme: "time", words: 25 }
    listening_passages:
      - { id: "what-time-is-it", text: { "en": "Asking and telling the time" } }
    reading_passages:
      - { id: "shop-hours", text: { "en": "The opening hours on a shop door" } }
  - planned: { id: "zh-location", theme: "location", words: 15 }
    listening_passages:
      - { id: "where-is-my-key", text: { "en": "Looking for a key: on, under, in, next to" } }
    reading_passages:
      - { id: "room-layout", text: { "en": "A note saying where things are in a room" } }
  - planned: { id: "zh-more-verbs", theme: "more-verbs", words: 30 }
    listening_passages:
      - { id: "weekend-chores", text: { "en": "Someone lists what they will do this weekend" } }
    reading_passages:
      - { id: "to-do-list", text: { "en": "A short to-do list" } }
  # 5. Rules as forms, practised on the words known: shi and bu, the
  # questions, word order, de, you and zai, adjectives with hen, and the
  # first measure words.
  - planned: { id: "zh-grammar-shi", grammar: ["shi", "bu-negation"] }
    listening_passages:
      - { id: "i-am-a-student", text: { "en": "Saying who and what you are, and are not: a student, not a teacher" } }
    reading_passages:
      - { id: "profile-card", text: { "en": "A profile card: what each person is and is not" } }
  - planned: { id: "zh-grammar-questions", grammar: ["question-ma", "question-words", "a-not-a"] }
    listening_passages:
      - { id: "is-it-yours", text: { "en": "Asking with ma, with a question word, and with the verb said twice: shi bu shi" } }
    reading_passages:
      - { id: "quiz-card", text: { "en": "A short quiz of questions and answers" } }
  - planned: { id: "zh-grammar-word-order", grammar: ["svo", "time-place-order"] }
    listening_passages:
      - { id: "when-and-where", text: { "en": "Saying when and where you do things, both before the verb: I eat at home at seven" } }
    reading_passages:
      - { id: "week-plan", text: { "en": "A week's plan: who does what, when and where" } }
  - planned: { id: "zh-grammar-de", grammar: ["de-possessive", "de-attributive"] }
    listening_passages:
      - { id: "whose-bag", text: { "en": "Asking whose things these are: my book, the teacher's bag, the red one" } }
    reading_passages:
      - { id: "lost-and-found", text: { "en": "A lost-and-found board naming whose each thing is" } }
  - planned: { id: "zh-grammar-you-zai", grammar: ["you", "mei-you", "zai-location"] }
    listening_passages:
      - { id: "is-there-a-bank", text: { "en": "Asking whether there is a bank nearby, and where it is" } }
    reading_passages:
      - { id: "floor-guide", text: { "en": "A floor guide in a department store: what is on each floor" } }
  - planned: { id: "zh-grammar-adjectives", grammar: ["hen-adjective", "adjective-predicate"] }
    listening_passages:
      - { id: "a-quiet-town", text: { "en": "Describing a town with hen and no verb for is: quiet, busy, not expensive" } }
    reading_passages:
      - { id: "hotel-review", text: { "en": "A short hotel review: the room, the staff, the food" } }
  - planned: { id: "zh-grammar-measure-words", grammar: ["measure-ge", "number-measure-noun", "zhe-na-measure"] }
    listening_passages:
      - { id: "this-one-that-one", text: { "en": "Pointing at things in a shop with ge: this one, that one, which one, three of them" } }
    reading_passages:
      - { id: "shop-labels", text: { "en": "Labels in a shop window counting its goods" } }
  # 6. Sentences, each after its words and rules; then the other A1
  # themes, each its words, its rules, then its sentences.
  - planned: { id: "zh-work", theme: "work", words: 35 }
    listening_passages:
      - { id: "what-is-your-job", text: { "en": "Two people ask each other what they do for a living" } }
    reading_passages:
      - { id: "job-card", text: { "en": "A business card and a short job description" } }
  - planned: { id: "zh-numbers-big", theme: "numbers-big", words: 35 }
    listening_passages:
      - { id: "prices-and-years", text: { "en": "Hearing prices in yuan, years and phone numbers, with wan for ten thousand" } }
    reading_passages:
      - { id: "price-tags", text: { "en": "Price tags and a bus-route number board" } }
  - planned: { id: "zh-grammar-money-dates", grammar: ["money-kuai-mao", "dates", "clock-time"] }
    listening_passages:
      - { id: "how-much-is-it", text: { "en": "Paying at a stall: kuai and mao, and the date on the receipt" } }
    reading_passages:
      - { id: "bus-ticket", text: { "en": "A bus ticket with its date, time and fare" } }
  - planned: { id: "zh-market", theme: "market", words: 40 }
    listening_passages:
      - { id: "at-the-wet-market", text: { "en": "Buying fruit and vegetables by the jin at a market stall" } }
    reading_passages:
      - { id: "market-price-board", text: { "en": "A price board at a market" } }
  - planned: { id: "zh-grammar-measure-words-2", grammar: "measure-words-common" }
    listening_passages:
      - { id: "two-books-three-cups", text: { "en": "Ordering and buying with the right measure word: a cup of tea, two books, a sheet of paper" } }
    reading_passages:
      - { id: "order-slip", text: { "en": "An order slip with counted items" } }
  - planned: { id: "zh-groceries", theme: "groceries", words: 40 }
    listening_passages:
      - { id: "shopping-list-aloud", text: { "en": "Two people go through a shopping list at a supermarket" } }
    reading_passages:
      - { id: "shopping-list", text: { "en": "A handwritten shopping list" } }
  - planned: { id: "zh-food", theme: "food", words: 60 }
    listening_passages:
      - { id: "ordering-noodles", text: { "en": "Ordering a bowl of noodles and dumplings at a small restaurant" } }
    reading_passages:
      - { id: "menu-card", text: { "en": "A restaurant menu card with dishes and prices" } }
  - planned: { id: "zh-grammar-le", grammar: "le-completed" }
    listening_passages:
      - { id: "what-did-you-eat", text: { "en": "Saying what you ate and bought yesterday, with le after the verb, and not, with mei" } }
    reading_passages:
      - { id: "yesterday-note", text: { "en": "A short note about yesterday" } }
  - planned: { id: "zh-transport", theme: "transport", words: 35 }
    listening_passages:
      - { id: "which-bus", text: { "en": "Asking which bus or metro line goes to the city centre" } }
    reading_passages:
      - { id: "station-timetable", text: { "en": "A train and bus timetable at a station" } }
  - planned: { id: "zh-directions", theme: "directions", words: 30 }
    listening_passages:
      - { id: "asking-the-way", text: { "en": "Asking the way to the station and being told: go straight, turn left, it is opposite" } }
    reading_passages:
      - { id: "simple-map", text: { "en": "A simple map with a route in words" } }
  - planned: { id: "zh-grammar-modal-verbs", grammar: ["xiang-yao", "hui-neng-keyi"] }
    listening_passages:
      - { id: "i-want-to-go", text: { "en": "Saying what you want to do, can do and may do: want to go, can swim, may sit" } }
    reading_passages:
      - { id: "wish-list", text: { "en": "A wish list for a trip" } }
  - planned: { id: "zh-body", theme: "body", words: 35 }
    listening_passages:
      - { id: "where-it-hurts", text: { "en": "Telling a doctor where it hurts" } }
    reading_passages:
      - { id: "stretching-chart", text: { "en": "A chart of simple morning exercises in a park" } }
  - planned: { id: "zh-places", theme: "places", words: 40 }
    listening_passages:
      - { id: "walk-to-the-station", text: { "en": "A neighbour names the places you pass on the way to the station" } }
    reading_passages:
      - { id: "street-signs", text: { "en": "Signs along a street: post office, bank, hospital, park" } }
  - planned: { id: "zh-home", theme: "home", words: 40 }
    listening_passages:
      - { id: "a-flat-tour", text: { "en": "A tour of a small flat, room by room" } }
    reading_passages:
      - { id: "flat-advert", text: { "en": "A short advert for a flat to rent" } }
  - planned: { id: "zh-grammar-zai-ba", grammar: ["zai-progressive", "ba-suggestion"] }
    listening_passages:
      - { id: "what-are-you-doing", text: { "en": "Saying what you are doing right now, and suggesting: let's go" } }
    reading_passages:
      - { id: "chat-messages", text: { "en": "A few chat messages about what each person is doing" } }
  - planned: { id: "zh-help", theme: "help", words: 35 }
    listening_passages:
      - { id: "lost-in-the-city", text: { "en": "Asking for help when lost" } }
    reading_passages:
      - { id: "emergency-numbers", text: { "en": "A card of emergency numbers and what to say" } }
  # The second set of characters: about 300 by the end of A1.
  - planned: { id: "zh-characters-2", grammar: "script-characters-2", words: 0 }
    listening_passages:
      - { id: "days-and-dates", text: { "en": "Hearing the words whose characters are taught: day, month, year, the week, food and places" } }
    reading_passages:
      - { id: "calendar-page", text: { "en": "A calendar page with the days and dates in characters" } }
    milestone: "A1"
  # A2: the themes and grammar of the CEFR's A2, each its words, its rules,
  # then its sentences: le, guo and zhe, comparison, the complements of
  # degree, result, direction and potential, ba, and more characters.
  - planned: { id: "zh-daily-life", theme: "daily-life", words: 45 }
    listening_passages:
      - { id: "a-normal-day", text: { "en": "Someone talks through an ordinary working day" } }
    reading_passages:
      - { id: "daily-timetable", text: { "en": "A timetable for a day: wake, work, eat, wash, sleep" } }
  - planned: { id: "zh-grammar-le-change", grammar: "le-change-of-state" }
    listening_passages:
      - { id: "it-is-raining-now", text: { "en": "Saying what has changed, with le at the end: it is raining now, I am not going any more" } }
    reading_passages:
      - { id: "news-from-home", text: { "en": "A message with news from home: what is new" } }
