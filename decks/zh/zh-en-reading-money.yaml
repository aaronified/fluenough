  - "id": "zh-market-prices"
    "title": "Prices at a market stall"
    "theme": "money"
    "sentences":
      - "text": "这家 店 的 水果 很 贵， 苹果 一斤 十五 块。"
        "reading": "zhè jiā diàn de shuǐguǒ hěn guì, píngguǒ yì jīn shíwǔ kuài."
      - "text": "我 讲了 半天 价， 老板 最后 便宜 了 两 块。"
        "reading": "wǒ jiǎngle bàntiān jià, lǎobǎn zuìhòu piányi le liǎng kuài."
      - "text": "他 说 不 能 再 降 了， 因为 物价 涨 了。"
        "reading": "tā shuō bù néng zài jiàng le, yīnwèi wùjià zhǎng le."
      - "text": "我 只 买 了 一 斤， 付 了 现金。"
        "reading": "wǒ zhǐ mǎi le yì jīn, fù le xiànjīn."
    "questions":
