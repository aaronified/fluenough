  - "id": "zh-bill-and-receipt"
    "title": "A bill and a payment"
    "theme": "money"
    "sentences":
      - "text": "这是 这个月 的 电费 账单。"
        "reading": "zhè shì zhège yuè de diànfèi zhàngdān."
      - "text": "一共 两百三十 块， 请 在 月底 以前 付款。"
        "reading": "yígòng liǎngbǎi sānshí kuài, qǐng zài yuèdǐ yǐqián fùkuǎn."
      - "text": "我 用 银行卡 付了 钱， 收据 在 这里。"
        "reading": "wǒ yòng yínhángkǎ fùle qián, shōujù zài zhèlǐ."
      - "text": "下个月 的 账单 会 更 便宜 吗？"
        "reading": "xià ge yuè de zhàngdān huì gèng piányi ma?"
