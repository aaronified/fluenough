  "entries":
  - "lemma": "下课"
    "key": "xiake"
    "reading": "xiàkè"
    "forms":
      "plain": "下课了，我走"
      "yi-jiu": "一下课我就走"
      "yi-jiu-not": "一下课，我就不走了"
    "readings":
      "plain": "xiàkè le, wǒ zǒu"
      "yi-jiu": "yí xiàkè wǒ jiù zǒu"
      "yi-jiu-not": "yí xiàkè, wǒ jiù bù zǒu le"
  - "lemma": "到"
    "key": "dao"
    "reading": "dào"
    "forms":
      "plain": "他到了，我们吃饭"
      "yi-jiu": "他一到我们就吃饭"
      "yi-jiu-not": "他一到就走"
    "readings":
      "plain": "tā dào le, wǒmen chīfàn"
      "yi-jiu": "tā yí dào wǒmen jiù chīfàn"
      "yi-jiu-not": "tā yí dào jiù zǒu"
  - "lemma": "起床"
    "key": "qichuang"
    "reading": "qǐchuáng"
    "forms":
      "plain": "他起床，然后吃饭"
      "yi-jiu": "他一起床就吃饭"
      "yi-jiu-not": "他一起床就不吃饭"
    "readings":
      "plain": "tā qǐchuáng, ránhòu chīfàn"
      "yi-jiu": "tā yì qǐchuáng jiù chīfàn"
      "yi-jiu-not": "tā yì qǐchuáng jiù bù chīfàn"
  - "lemma": "下雨"
    "key": "xiayu"
    "reading": "xiàyǔ"
    "forms":
      "plain": "下雨了，我回家"
      "yi-jiu": "一下雨我就回家"
      "yi-jiu-not": "一下雨，我就不出门"
    "readings":
      "plain": "xiàyǔ le, wǒ huíjiā"
      "yi-jiu": "yí xiàyǔ wǒ jiù huíjiā"
      "yi-jiu-not": "yí xiàyǔ, wǒ jiù bù chūmén"
