- "id": "zh-characters-at-the-station"
  "title": "Characters at the station"
  "sentences":
  - "text": "请 从 入口 进。"
    "reading": "qǐng cóng rùkǒu jìn."
  - "text": "出口 在 左边。"
    "reading": "chūkǒu zài zuǒbiān."
  - "text": "请 检 票。"
    "reading": "qǐng jiǎn piào."
  - "text": "火车 迟 了。"
    "reading": "huǒchē chí le."
  "questions":
  - "id": "zh-1703"
    "prompt":
      "en": "请 从 入口 进 (qǐng cóng rùkǒu jìn) means:"
    "options":
    - "en": "come in through the entrance"
    - "en": "go out through the exit"
    "answer": 1
  - "id": "zh-1704"
    "prompt":
      "en": "出口 在 左边 (chūkǒu zài zuǒbiān) says the exit is on the left."
    "answer": true
  - "id": "zh-1705"
    "prompt":
      "en": "火车 迟 了 (huǒchē chí le) means:"
    "options":
    - "en": "the train is late"
    - "en": "the train is early"
    "answer": 1
- "id": "zh-station-signs"
  "title": "Station signs"
  "sentences":
  - "text": "一号线 (yīhàoxiàn) 的 站台 在 地下。"
    "reading": "yīhàoxiàn de zhàntái zài dìxià."
  - "text": "候车室 在 二 楼。"
    "reading": "hòuchēshì zài èr lóu."
  - "text": "乘客 请 检 票。"
    "reading": "chéngkè qǐng jiǎn piào."
  - "text": "出口 在 那边。"
    "reading": "chūkǒu zài nàbiān."
  "questions":
  - "id": "zh-1706"
    "prompt":
      "en": "一号线 (yīhàoxiàn) is:"
    "options":
    - "en": "line one"
    - "en": "line two"
    "answer": 1
  - "id": "zh-1707"
    "prompt":
      "en": "站台 在 地下 (zhàntái zài dìxià) says the platform is underground."
    "answer": true
  - "id": "zh-1708"
    "prompt":
      "en": "候车室 在 二 楼 (hòuchēshì zài èr lóu) means the waiting room is:"
