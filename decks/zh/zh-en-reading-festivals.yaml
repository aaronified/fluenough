- "id": "zh-festival-poster"
  "title": "Festival poster"
  "theme": "festivals"
  "sentences":
  - "text": "中秋 节 快乐！ 一起 赏月， 吃 月饼。"
    "reading": "Zhōngqiū jié kuàilè! yìqǐ shǎngyuè, chī yuèbǐng."
  - "text": "晚上 七 点 有 灯会。"
    "reading": "wǎnshang qī diǎn yǒu dēnghuì."
  - "text": "欢迎 大家 带 家人 来。"
    "reading": "huānyíng dàjiā dài jiārén lái."
  - "text": "祝 您 团圆 幸福。"
    "reading": "zhù nín tuányuán xìngfú."
