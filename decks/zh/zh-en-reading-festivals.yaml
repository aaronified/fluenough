- "id": "zh-spring-festival"
  "title": "Spring Festival"
  "theme": "festivals"
  "sentences":
  - "text": "春节 快 到 了， 我们 要 买 年货。"
    "reading": "Chūnjié kuài dào le, wǒmen yào mǎi niánhuò."
  - "text": "妈妈 包 饺子， 爸爸 贴 春联。"
    "reading": "māma bāo jiǎozi, bàba tiē chūnlián."
  - "text": "晚上 我们 吃 年夜饭， 孩子 收 压岁钱。"
    "reading": "wǎnshang wǒmen chī niányèfàn, háizi shōu yāsuìqián."
  - "text": "大家 放 鞭炮， 很 热闹。"
    "reading": "dàjiā fàng biānpào, hěn rènao."
