  "entries":
  - "lemma": "努力"
    "key": "nuli"
    "reading": "nǔlì"
    "forms":
      "plain": "我努力，他就高兴"
      "as-long-as": "只要你努力，我就高兴"
      "as-long-as-not": "只要你不努力，我就不高兴"
    "readings":
      "plain": "wǒ nǔlì, tā jiù gāoxìng"
      "as-long-as": "zhǐyào nǐ nǔlì, wǒ jiù gāoxìng"
      "as-long-as-not": "zhǐyào nǐ bù nǔlì, wǒ jiù bù gāoxìng"
  - "lemma": "成功"
    "key": "chenggong"
    "reading": "chénggōng"
    "forms":
      "plain": "我们成功，就回家"
      "as-long-as": "只要我们成功，就回家"
      "as-long-as-not": "只要我们不成功，就不回家"
    "readings":
      "plain": "wǒmen chénggōng, jiù huíjiā"
      "as-long-as": "zhǐyào wǒmen chénggōng, jiù huíjiā"
      "as-long-as-not": "zhǐyào wǒmen bù chénggōng, jiù bù huíjiā"
  - "lemma": "来"
    "key": "lai2"
    "reading": "lái"
    "forms":
      "plain": "他来，我们去公园"
      "as-long-as": "只要他来，我们就去公园"
      "as-long-as-not": "只要他不来，我们就不去公园"
    "readings":
      "plain": "tā lái, wǒmen qù gōngyuán"
      "as-long-as": "zhǐyào tā lái, wǒmen jiù qù gōngyuán"
      "as-long-as-not": "zhǐyào tā bù lái, wǒmen jiù bú qù gōngyuán"
