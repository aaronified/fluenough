- "id": "zh-shopping-list-aloud"
  "title": "A shopping list"
  "theme": "groceries"
  "sentences":
  - "text": "我们 去 超市 买 东西。"
    "reading": "wǒmen qù chāoshì mǎi dōngxi."
  - "text": "要 牛奶、面包、大米 和 鸡蛋。"
    "reading": "yào niúnǎi, miànbāo, dàmǐ hé jīdàn."
  - "text": "饼干 今天 打折。"
    "reading": "bǐnggān jīntiān dǎzhé."
  - "text": "糖 不 用 买 了。"
    "reading": "táng bú yòng mǎi le."
  "questions":
  - "id": "zh-0870"
    "prompt":
      "en": "饼干 今天 打折 (bǐnggān jīntiān dǎzhé) means:"
    "options":
    - "en": "the biscuits are on sale today"
    - "en": "the biscuits are free today"
    "answer": 1
  - "id": "zh-0871"
    "prompt":
      "en": "糖 不 用 买 了 (táng bú yòng mǎi le) says that the sugar does not need buying any more."
    "answer": true
  - "id": "zh-0872"
    "prompt":
      "en": "The list names 牛奶 (niúnǎi), 面包 (miànbāo), 大米 (dàmǐ) and 鸡蛋 (jīdàn):"
    "options":
    - "en": "milk, bread, rice and eggs"
    - "en": "milk, bread, rice and meat"
    "answer": 1
- "id": "zh-shelf-notice"
  "title": "A notice on a shelf"
  "theme": "groceries"
  "sentences":
  - "text": "这 个 牛奶 过期 了。"
    "reading": "zhè ge niúnǎi guòqī le."
  - "text": "请 看 保质期。"
    "reading": "qǐng kàn bǎozhìqī."
  - "text": "饺子 是 冷冻 的。"
    "reading": "jiǎozi shì lěngdòng de."
  - "text": "购物车 在 门口。"
    "reading": "gòuwùchē zài ménkǒu."
  "questions":
  - "id": "zh-0873"
    "prompt":
      "en": "这 个 牛奶 过期 了 (zhè ge niúnǎi guòqī le) says the milk:"
    "options":
    - "en": "is past its date"
    - "en": "is free"
    "answer": 1
  - "id": "zh-0874"
    "prompt":
      "en": "请 看 保质期 (qǐng kàn bǎozhìqī) asks you to look at the best before date."
    "answer": true
  - "id": "zh-0875"
    "prompt":
      "en": "饺子 是 冷冻 的 (jiǎozi shì lěngdòng de) means the dumplings are:"
    "options":
    - "en": "frozen"
    - "en": "hot"
    "answer": 1
