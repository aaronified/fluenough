    "answer": 1
- "id": "zh-sums-quiz"
  "title": "A sums quiz"
  "theme": "numbers-big"
  "sentences":
  - "text": "二加三是五。"
    "reading": "èr jiā sān shì wǔ."
  - "text": "十减一是九。"
    "reading": "shí jiǎn yī shì jiǔ."
