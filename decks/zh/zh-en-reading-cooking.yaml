- "id": "zh-recipe-card"
  "title": "A recipe card"
  "theme": "cooking"
  "sentences":
  - "text": "配料： 番茄 两 个， 鸡蛋 三 个。"
    "reading": "pèiliào: fānqié liǎng gè, jīdàn sān gè."
  - "text": "做法： 先 切块， 再 炒 熟。"
    "reading": "zuòfǎ: xiān qiēkuài, zài chǎo shú."
  - "text": "火 要 大 一 点。"
    "reading": "huǒ yào dà yìdiǎn."
  - "text": "小心 烫 手。"
    "reading": "xiǎoxīn tàng shǒu."
