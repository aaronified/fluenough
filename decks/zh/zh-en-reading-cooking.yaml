- "id": "zh-a-recipe-aloud"
  "title": "A recipe, aloud"
  "theme": "cooking"
  "sentences":
  - "text": "先 切 番茄， 再 切 鸡蛋。"
    "reading": "xiān qiē fānqié, zài qiē jīdàn."
  - "text": "锅 里 放 油， 下 鸡蛋 炒 一下。"
    "reading": "guō lǐ fàng yóu, xià jīdàn chǎo yíxià."
  - "text": "加 一 点 盐 和 糖。"
    "reading": "jiā yìdiǎn yán hé táng."
  - "text": "最后 出锅。"
    "reading": "zuìhòu chūguō."
