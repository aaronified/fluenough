  - "lemma": "聪明"
    "key": "congming"
    "reading": "cōngming"
    "forms":
      "plain": "他很聪明，也很努力"
      "both": "他不但聪明 (tā búdàn cōngming)，而且努力"
      "also": "他不但聪明 (tā búdàn cōngming)，还努力"
