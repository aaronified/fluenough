- "id": "zh-recycling-talk"
  "title": "Recycling talk"
  "theme": "environment"
  "sentences":
  - "text": "我们 家 每 天 分 垃圾， 纸 和 塑料 分开。"
    "reading": "wǒmen jiā měitiān fēn lājī, zhǐ hé sùliào fēnkāi."
  - "text": "空气 质量 好 了， 我 很 高兴。"
    "reading": "kōngqì zhìliàng hǎo le, wǒ hěn gāoxìng."
  - "text": "节水 也 很 重要。"
    "reading": "jiéshuǐ yě hěn zhòngyào."
  - "text": "大家 应该 一起 保护 环境。"
    "reading": "dàjiā yīnggāi yìqǐ bǎohù huánjìng."
