- "id": "zh-clean-up-notice"
  "title": "Clean-up notice"
  "theme": "environment"
  "sentences":
  - "text": "小区 将 于 周六 组织 清理 活动。"
    "reading": "xiǎoqū jiāng yú zhōuliù zǔzhī qīnglǐ huódòng."
  - "text": "请 大家 把 垃圾 放 进 垃圾桶。"
    "reading": "qǐng dàjiā bǎ lājī fàng jìn lājītǒng."
  - "text": "不要 把 废物 扔 在 河边。"
    "reading": "búyào bǎ fèiwù rēng zài hé biān."
  - "text": "请 保护 树木 和 草地。"
    "reading": "qǐng bǎohù shùmù hé cǎodì."
