  "theme": "relationships"
  "sentences":
  - "text": "我 的 邻居 是 老 朋友， 我们 关系 很 好。"
    "reading": "wǒ de línjū shì lǎo péngyou, wǒmen guānxi hěn hǎo."
  - "text": "他 很 热情， 经常 帮 我 照顾 孩子。"
    "reading": "tā hěn rèqíng, jīngcháng bāng wǒ zhàogù háizi."
  - "text": "我们 偶尔 吵架， 但 很 快 和好。"
    "reading": "wǒmen ǒu'ěr chǎojià, dàn hěn kuài héhǎo."
  - "text": "我 很 信任 他， 也 很 感激 他。"
    "reading": "wǒ hěn xìnrèn tā, yě hěn gǎnjī tā."
