- "id": "zh-lost-wallet-report"
  "title": "Reporting a lost wallet"
  "theme": "law"
  "sentences":
  - "text": "我 的 钱包 丢 了， 我 去 派出所 报案。"
    "reading": "wǒ de qiánbāo diū le, wǒ qù pàichūsuǒ bào'àn."
  - "text": "警官 让 我 看 一下 笔录， 还 要 看 我 的 证件。"
    "reading": "jǐngguān ràng wǒ kàn yíxià bǐlù, hái yào kàn wǒ de zhèngjiàn."
  - "text": "银行卡 要 去 银行 挂失， 警察 不能 做 这件事。"
    "reading": "yínhángkǎ yào qù yínháng guàshī, jǐngchá bù néng zuò zhè jiàn shì."
  - "text": "两天 以后， 有人 送来 了 钱包， 里面 的 钱 没有 少。"
    "reading": "liǎng tiān yǐhòu, yǒu rén sòng lái le qiánbāo, lǐmiàn de qián méiyǒu shǎo."
  "questions":
  - "id": "zh-4243"
    "prompt":
      "en": "Which word in the report means 'to report a card lost'?"
    "options":
    - "en": "报案 (bào'àn)"
    - "en": "挂失 (guàshī)"
    "answer": 2
  - "id": "zh-4244"
    "prompt":
      "en": "The officer lets the speaker leave without reading any record."
    "answer": false
  - "id": "zh-4245"
    "prompt":
      "en": "Which word means 'a written record of a statement'?"
