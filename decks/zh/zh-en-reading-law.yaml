- "id": "zh-rights-leaflet"
  "title": "A tenant's rights"
  "theme": "law"
  "sentences":
  - "text": "租客 有 权利 知道 押金 的 数目。"
    "reading": "zūkè yǒu quánlì zhīdao yājīn de shùmù."
  - "text": "房东 不能 随便 进入 房间， 要 先 通知 你。"
    "reading": "fángdōng bù néng suíbiàn jìnrù fángjiān, yào xiān tōngzhī nǐ."
  - "text": "合同 的 条款 要 写 清楚， 违约 的 人 要 赔偿。"
    "reading": "hétong de tiáokuǎn yào xiě qīngchu, wéiyuē de rén yào péicháng."
  - "text": "如果 有 问题， 可以 先 找 社区 调解。"
    "reading": "rúguǒ yǒu wèntí, kěyǐ xiān zhǎo shèqū tiáojiě."
