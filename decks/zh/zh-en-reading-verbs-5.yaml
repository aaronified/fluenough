    "theme": "verbs-5"
    "sentences":
      - "text": "他 从 小 就 喜欢 做饭， 大学 毕业 以后 找到 了 一 份 工作。"
        "reading": "tā cóng xiǎo jiù xǐhuan zuòfàn, dàxué bìyè yǐhòu zhǎodào le yí fèn gōngzuò."
      - "text": "可是 他 没有 忘掉 自己 的 梦想， 每天 晚上 都 在 家 练习。"
        "reading": "kěshì tā méiyǒu wàngdiào zìjǐ de mèngxiǎng, měitiān wǎnshang dōu zài jiā liànxí."
      - "text": "两 年 以后， 他 的 小 店 终于 开张 了。"
        "reading": "liǎng nián yǐhòu, tā de xiǎo diàn zhōngyú kāizhāng le."
