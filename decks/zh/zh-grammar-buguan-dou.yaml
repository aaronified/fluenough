  "entries":
  - "lemma": "说"
    "key": "shuo"
    "reading": "shuō"
    "forms":
      "plain": "你说什么我都去"
      "no-matter": "不管你说什么，我都去"
      "no-matter-not": "不管你不说，我都去"
    "readings":
      "plain": "nǐ shuō shénme wǒ dōu qù"
      "no-matter": "bùguǎn nǐ shuō shénme, wǒ dōu qù"
      "no-matter-not": "bùguǎn nǐ bù shuō, wǒ dōu qù"
  - "lemma": "下雨"
    "key": "xiayu2"
    "reading": "xiàyǔ"
    "forms":
      "plain": "下雨我们去"
      "no-matter": "不管下雨，我们都去"
      "no-matter-not": "不管下不下雨，我们都去"
    "readings":
      "plain": "xiàyǔ wǒmen qù"
      "no-matter": "bùguǎn xiàyǔ, wǒmen dōu qù"
      "no-matter-not": "bùguǎn xià bu xiàyǔ, wǒmen dōu qù"
  - "lemma": "做"
    "key": "zuo"
    "reading": "zuò"
    "forms":
      "plain": "他做这个"
      "no-matter": "不管谁做，都要做好"
      "no-matter-not": "不管谁不做，都要做好"
    "readings":
      "plain": "tā zuò zhè ge"
      "no-matter": "bùguǎn shéi zuò, dōu yào zuò hǎo"
      "no-matter-not": "bùguǎn shéi bù zuò, dōu yào zuò hǎo"
  - "lemma": "吃"
    "key": "chi"
    "reading": "chī"
    "forms":
      "plain": "我吃饭"
      "no-matter": "不管贵不贵，我都吃"
      "no-matter-not": "不管好不好吃，我都吃"
    "readings":
      "plain": "wǒ chīfàn"
      "no-matter": "bùguǎn guì bu guì, wǒ dōu chī"
      "no-matter-not": "bùguǎn hǎo bu hǎochī, wǒ dōu chī"
