- "id": "zh-how-many-do-you-want"
  "title": "How many do you want?"
  "theme": "quantities"
  "sentences":
  - "text": "你买几个？"
    "reading": "nǐ mǎi jǐ ge?"
  - "text": "我买一本书。"
    "reading": "wǒ mǎi yì běn shū."
  - "text": "我们一共十个人。"
    "reading": "wǒmen yígòng shí ge rén."
  - "text": "这双鞋多少钱？"
    "reading": "zhè shuāng xié duōshao qián?"
  "questions":
  - "id": "zh-0422"
    "prompt":
      "en": "你买几个 (nǐ mǎi jǐ ge?) asks:"
    "options":
    - "en": "how many you will buy"
    - "en": "how much you have"
    "answer": 1
  - "id": "zh-0423"
    "prompt":
      "en": "我买一本书 (wǒ mǎi yì běn shū) says that the speaker buys one book."
    "answer": true
  - "id": "zh-0424"
    "prompt":
      "en": "这双鞋多少钱 (zhè shuāng xié duōshao qián?) means:"
    "options":
    - "en": "How much are these shoes?"
    - "en": "How many shoes are there?"
    "answer": 1
