    "reading": "nǐ kàn le nà bù diànyǐng ma?"
  - "text": "我 看 了， 剧情 很 感人， 结局 很 好。"
    "reading": "wǒ kàn le, jùqíng hěn gǎnrén, jiéjú hěn hǎo."
