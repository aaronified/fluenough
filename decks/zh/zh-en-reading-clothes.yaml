    "prompt":
      "en": "你 要 什么 颜色 (nǐ yào shénme yánsè) asks:"
    "options":
    - "en": "what size do you want"
    - "en": "what colour do you want"
    "answer": 2
  - "id": "zh-1513"
    "prompt":
      "en": "我要蓝色的 (wǒ yào lánsè de) and 大号 (dà hào) say the speaker wants a large blue one."
    "answer": true
  - "id": "zh-1514"
    "prompt":
      "en": "试穿 一下 吧 (shìchuān yíxià ba) means:"
    "options":
