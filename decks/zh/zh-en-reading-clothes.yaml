  "title": "Choosing a shirt"
  "theme": "clothes"
  "sentences":
  - "text": "你 要 什么 颜色？"
    "reading": "nǐ yào shénme yánsè?"
  - "text": "白色 的 还是 蓝色 的？"
    "reading": "báisè de háishi lánsè de?"
  - "text": "我 要 蓝色 的， 大 号。"
    "reading": "wǒ yào lánsè de, dà hào."
  - "text": "试穿 一下 吧。"
    "reading": "shìchuān yíxià ba."
  "questions":
