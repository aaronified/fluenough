  "entries":
  - "lemma": "同意"
    "key": "tongyi"
    "reading": "tóngyì"
    "forms":
      "plain": "我不去"
      "unless": "除非你同意，否则我不去"
      "unless-not": "除非你不同意，我才去"
    "readings":
      "plain": "wǒ bú qù"
      "unless": "chúfēi nǐ tóngyì, fǒuzé wǒ bú qù"
      "unless-not": "chúfēi nǐ bù tóngyì, wǒ cái qù"
  - "lemma": "帮忙"
    "key": "bangmang"
    "reading": "bāngmáng"
    "forms":
      "plain": "我不帮忙"
      "unless": "除非你请我，否则我不帮忙"
      "unless-not": "除非你不请我，我才帮忙"
    "readings":
      "plain": "wǒ bù bāngmáng"
      "unless": "chúfēi nǐ qǐng wǒ, fǒuzé wǒ bù bāngmáng"
      "unless-not": "chúfēi nǐ bù qǐng wǒ, wǒ cái bāngmáng"
  - "lemma": "吃饭"
    "key": "chifan"
    "reading": "chīfàn"
    "forms":
      "plain": "我们不吃饭"
      "unless": "除非你来，否则我们不吃饭"
      "unless-not": "除非你不来，我们才吃饭"
    "readings":
      "plain": "wǒmen bù chīfàn"
      "unless": "chúfēi nǐ lái, fǒuzé wǒmen bù chīfàn"
      "unless-not": "chúfēi nǐ bù lái, wǒmen cái chīfàn"
