- "id": "zh-weather-forecast"
  "title": "A weather forecast"
  "theme": "weather"
  "sentences":
  - "text": "明天 有 小雨， 气温 十 度。"
    "reading": "míngtiān yǒu xiǎoyǔ, qìwēn shí dù."
  - "text": "后天 多云， 有 风。"
    "reading": "hòutiān duōyún, yǒu fēng."
  - "text": "周末 可能 有 雾霾。"
    "reading": "zhōumò kěnéng yǒu wùmái."
  - "text": "出门 带 雨伞。"
    "reading": "chūmén dài yǔsǎn."
  "questions":
  - "id": "zh-1615"
    "prompt":
      "en": "明天 有 小雨 (míngtiān yǒu xiǎoyǔ) means tomorrow there will be:"
    "options":
    - "en": "heavy snow"
    - "en": "light rain"
    "answer": 2
  - "id": "zh-1616"
    "prompt":
      "en": "出门 带 雨伞 (chūmén dài yǔsǎn) says to take an umbrella when going out."
    "answer": true
  - "id": "zh-1617"
    "prompt":
      "en": "周末 可能 有 雾霾 (zhōumò kěnéng yǒu wùmái) means:"
    "options":
    - "en": "there may be smog at the weekend"
    - "en": "it will be sunny at the weekend"
    "answer": 1
- "id": "zh-weather-message"
  "title": "A weather message"
  "theme": "weather"
  "sentences":
  - "text": "你 那边 天气 怎么样？"
    "reading": "nǐ nàbiān tiānqì zěnmeyàng?"
  - "text": "这里 很 闷热， 下午 可能 有 雷雨。"
    "reading": "zhèlǐ hěn mēnrè, xiàwǔ kěnéng yǒu léiyǔ."
  - "text": "注意 安全， 别 忘 了 带 雨伞。"
    "reading": "zhùyì ānquán, bié wàng le dài yǔsǎn."
  - "text": "好 的， 谢谢！"
    "reading": "hǎo de, xièxie!"
  "questions":
  - "id": "zh-1618"
    "prompt":
      "en": "闷热 (mēnrè) means:"
    "options":
    - "en": "muggy and hot"
    - "en": "cold and dry"
    "answer": 1
  - "id": "zh-1619"
    "prompt":
      "en": "下午 可能 有 雷雨 (xiàwǔ kěnéng yǒu léiyǔ) says a thunderstorm may come in the afternoon."
    "answer": true
  - "id": "zh-1620"
    "prompt":
      "en": "别 忘 了 带 雨伞 (bié wàng le dài yǔsǎn) means:"
    "options":
    - "en": "do not forget to take an umbrella"
    - "en": "do not take an umbrella"
    "answer": 1
