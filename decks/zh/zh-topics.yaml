  - id: "zh-word-order"
    name: { en: "Word order, and be, have and location" }
    summary: { en: "The order of a basic sentence, where time and place go, and the patterns with shi (is), you (have) and zai (be at)." }
    term: { text: "语序", reading: "yǔxù" }
    kind: "grammar"
    level: "A1"
    decks: ["zh-grammar-svo", "zh-grammar-time-place-order", "zh-grammar-shi", "zh-grammar-you", "zh-grammar-zai-location"]
    grammar: ["svo", "time-place-order", "shi", "you", "zai-location"]
  - id: "zh-questions-negation"
    name: { en: "Questions and negation" }
    summary: { en: "How to ask questions with ma, with question words, with the A-not-A form and with haishi (or), and how to say no with bu and mei." }
    kind: "grammar"
    level: "A1"
    decks: ["zh-grammar-question-ma", "zh-grammar-question-words", "zh-grammar-a-not-a", "zh-grammar-haishi-huozhe", "zh-grammar-rhetorical-questions", "zh-grammar-bu-negation", "zh-grammar-mei-you"]
    grammar: ["question-ma", "question-words", "a-not-a", "haishi-huozhe", "rhetorical-questions", "bu-negation", "mei-you"]
  - id: "zh-measure-de"
    name: { en: "Measure words and the particle de" }
    summary: { en: "The measure words that stand between a number or this and a noun, and the particle de that joins a possessor, a describing word or a clause to a noun." }
    term: { text: "量词", reading: "liàngcí" }
    kind: "grammar"
    level: "A1"
    decks: ["zh-grammar-measure-ge", "zh-grammar-number-measure-noun", "zh-grammar-zhe-na-measure", "zh-grammar-measure-words-common", "zh-grammar-de-possessive", "zh-grammar-de-attributive", "zh-grammar-de-relative-clause", "zh-grammar-de-adverbial"]
