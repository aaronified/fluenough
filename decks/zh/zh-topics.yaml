# Topics a learner of Mandarin Chinese would search for: what each one is, and the decks that teach it (wiki/Plan-Deck-Kinds-And-Topics.md, D6).
# A script topic lists its characters; a topic holds no card text of its own.
schema: 1
kind: "topics"
id: "zh-topics"
language: "zh"
license: "CC-BY-SA-4.0"
topics:
  - id: "zh-pinyin"
    name: { en: "Pinyin" }
    summary: { en: "The romanisation of Mandarin Chinese: the letters that spell its sounds, how tone marks are written over them, and how syllables are spelled." }
    term: { text: "拼音", reading: "pīnyīn" }
    kind: "script"
    level: "A1"
    decks: ["zh-pinyin", "zh-grammar-pinyin-spelling"]
    grammar: ["pinyin-spelling"]
  - id: "zh-tones"
    name: { en: "Tones" }
    summary: { en: "The four tones and the neutral tone, which change the meaning of a syllable, and the tone changes that happen when two third tones meet." }
    term: { text: "声调", reading: "shēngdiào" }
    kind: "script"
    level: "A1"
    decks: ["zh-tones", "zh-grammar-tone-sandhi"]
    grammar: ["tone-sandhi"]
  - id: "zh-strokes-radicals"
    name: { en: "Strokes and radicals" }
    summary: { en: "The strokes that make up a character, the order in which they are written, and the radicals that group characters by their meaning." }
    term: { text: "笔画", reading: "bǐhuà" }
    kind: "script"
    level: "A1"
    decks: ["zh-strokes-radicals"]
    script_units: ["strokes", "stroke-order", "radicals"]
    chars: ["口", "水", "手", "木", "日", "月", "火", "山", "心", "子"]
  - id: "zh-characters-1"
    name: { en: "Basic characters, set 1" }
    summary: { en: "The first set of basic characters, in simplified form, each with its reading and the words that use it." }
    kind: "script"
    level: "A1"
    decks: ["zh-characters-1"]
    chars: ["大", "小", "们", "千", "万", "国", "学", "生", "师", "中"]
