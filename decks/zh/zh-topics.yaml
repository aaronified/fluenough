  - id: "zh-describing-comparing"
    name: { en: "Describing and comparing" }
    summary: { en: "How an adjective works as the predicate of a sentence, how reduplication softens it, and how to compare things with bi and with mei-you." }
    kind: "grammar"
    level: "A1"
    decks: ["zh-grammar-adjective-predicate", "zh-grammar-hen-adjective", "zh-grammar-adjective-reduplication", "zh-grammar-bi", "zh-grammar-gen-yiyang", "zh-grammar-mei-you-comparison"]
