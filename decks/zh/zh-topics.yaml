  - id: "zh-aspect-emphasis"
    name: { en: "Aspect particles and emphasis" }
    summary: { en: "The small words that show whether an action is done, changed, tried before or still going on, and the shi-de pattern that stresses when, how or by whom." }
    kind: "grammar"
    level: "A1"
    decks: ["zh-grammar-le-completed", "zh-grammar-le-change-of-state", "zh-grammar-guo-experience", "zh-grammar-zhe-continuous", "zh-grammar-zai-progressive", "zh-grammar-zhengzai-ne", "zh-grammar-le-guo-zhe", "zh-grammar-shi-de"]
