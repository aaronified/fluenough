  "title": "Job interview"
  "theme": "careers"
  "sentences":
  - "text": "你 好， 请 坐。 你 为 什么 要 应聘？"
    "reading": "nǐ hǎo, qǐng zuò. nǐ wèishénme yào yìngpìn?"
  - "text": "我 有 三 年 的 工作 经验。"
    "reading": "wǒ yǒu sān nián de gōngzuò jīngyàn."
  - "text": "我 的 特长 是 管理 团队。"
    "reading": "wǒ de tècháng shì guǎnlǐ tuánduì."
