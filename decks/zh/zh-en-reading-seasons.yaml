- "id": "zh-seasonal-greeting"
  "title": "A seasonal greeting"
  "theme": "seasons"
  "sentences":
  - "text": "春天 到 了， 花 开 了。"
    "reading": "chūntiān dào le, huā kāi le."
  - "text": "秋天 的 风 很 凉爽。"
    "reading": "qiūtiān de fēng hěn liángshuǎng."
  - "text": "冬天 下雪 了。"
    "reading": "dōngtiān xiàxuě le."
  - "text": "祝 你 身体 健康！"
    "reading": "zhù nǐ shēntǐ jiànkāng!"
  "questions":
  - "id": "zh-1461"
    "prompt":
      "en": "春天到了 (chūntiān dào le) and 花开了 (huā kāi le) say:"
    "options":
    - "en": "spring has come and the flowers have opened"
    - "en": "winter has come and the leaves have fallen"
    "answer": 1
  - "id": "zh-1462"
    "prompt":
      "en": "秋天 的 风 很 凉爽 (qiūtiān de fēng hěn liángshuǎng) says the autumn wind is cool and fresh."
    "answer": true
  - "id": "zh-1463"
    "prompt":
