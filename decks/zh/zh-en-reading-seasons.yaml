- "id": "zh-spring-outing"
  "title": "A spring outing"
  "theme": "seasons"
  "sentences":
  - "text": "春天 我们 去 公园 看 花。"
    "reading": "chūntiān wǒmen qù gōngyuán kàn huā."
  - "text": "天气 很 暖和， 有 风。"
    "reading": "tiānqì hěn nuǎnhuo, yǒu fēng."
  - "text": "太阳 很 好。"
    "reading": "tàiyáng hěn hǎo."
  - "text": "晚上 会 下雨， 我们 早 回家。"
    "reading": "wǎnshang huì xiàyǔ, wǒmen zǎo huíjiā."
