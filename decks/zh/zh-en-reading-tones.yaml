passages:
  - id: "zh-four-tones"
    title: "Four tones"
    theme: "tones"
    sentences:
      - text: "妈，麻，马，骂。"
        reading: "mā, má, mǎ, mà."
    questions:
      - id: "zh-0054"
        prompt: { en: "Which word means 'horse'?" }
        options:
          - { en: "mother" }
          - { en: "hemp" }
          - { en: "horse" }
          - { en: "to scold" }
        answer: 3
      - id: "zh-0055"
        prompt: { en: "The word for 'to scold' has the fourth tone." }
        answer: true
  - id: "zh-tone-pairs-list"
    title: "Tone pairs"
    theme: "tones"
    sentences:
      - text: "买，卖。"
        reading: "mǎi, mài."
      - text: "八，爸。"
        reading: "bā, bà."
      - text: "白，百。"
        reading: "bái, bǎi."
    questions:
      - id: "zh-0056"
        prompt: { en: "Which word means 'to sell'?" }
        options:
          - { en: "to buy" }
          - { en: "to sell" }
          - { en: "to open" }
        answer: 2
      - id: "zh-0057"
        prompt: { en: "买 (mǎi) and 卖 (mài) differ only in their tone." }
        answer: true
