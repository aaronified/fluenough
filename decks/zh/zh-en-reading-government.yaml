- "id": "zh-form-instructions"
  "title": "Form instructions"
  "theme": "government"
  "sentences":
  - "text": "姓名： 请 写 全 名。"
    "reading": "xìngmíng: qǐng xiě quán míng."
  - "text": "户口 所在地： 请 填 写 地址。"
    "reading": "hùkǒu suǒzàidì: qǐng tiánxiě dìzhǐ."
