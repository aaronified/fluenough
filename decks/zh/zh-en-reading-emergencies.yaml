- "id": "zh-evacuation-notice"
  "title": "Evacuation notice"
  "theme": "emergencies"
  "sentences":
  - "text": "请 大家 注意， 大楼 里 有 浓烟。"
    "reading": "qǐng dàjiā zhùyì, dàlóu lǐ yǒu nóngyān."
  - "text": "请 大家 有序 疏散， 不要 乘坐 电梯。"
    "reading": "qǐng dàjiā yǒuxù shūsàn, búyào chéngzuò diàntī."
  - "text": "消防员 已经 到 了， 请 听 他们 的 指挥。"
    "reading": "xiāofángyuán yǐjīng dào le, qǐng tīng tāmen de zhǐhuī."
  - "text": "请 到 避难所 集合， 不要 回去 拿 东西。"
    "reading": "qǐng dào bìnànsuǒ jíhé, búyào huíqù ná dōngxi."
  "questions":
  - "id": "zh-4184"
    "prompt":
      "en": "Which word in the notice means 'to evacuate in an orderly way'?"
    "options":
    - "en": "浓烟 (nóngyān)"
    - "en": "疏散 (shūsàn)"
    "answer": 2
  - "id": "zh-4185"
    "prompt":
      "en": "The notice says people may take the lift to leave."
    "answer": false
  - "id": "zh-4186"
    "prompt":
      "en": "Which word in the notice means 'firefighter'?"
    "options":
    - "en": "救生衣 (jiùshēngyī)"
    - "en": "消防员 (xiāofángyuán)"
    "answer": 2
- "id": "zh-first-aid-at-home"
  "title": "First aid at home"
  "theme": "emergencies"
  "sentences":
  - "text": "如果 有人 晕倒， 先 不要 摇 他， 请 马上 打 急救 电话。"
    "reading": "rúguǒ yǒu rén yūndǎo, xiān búyào yáo tā, qǐng mǎshàng dǎ jíjiù diànhuà."
  - "text": "急救箱 在 厨房 的 柜子 里， 里面 有 纱布 和 药。"
    "reading": "jíjiùxiāng zài chúfáng de guìzi lǐ, lǐmiàn yǒu shābù hé yào."
  - "text": "如果 手 割伤 了， 要 先 用 水 洗 干净。"
    "reading": "rúguǒ shǒu gēshāng le, yào xiān yòng shuǐ xǐ gānjìng."
  - "text": "停电 的 时候， 不要 用 蜡烛， 以免 失火。"
    "reading": "tíngdiàn de shíhou, búyào yòng làzhú, yǐmiǎn shīhuǒ."
  "questions":
  - "id": "zh-4187"
    "prompt":
      "en": "Which word in the text means 'to faint'?"
    "options":
    - "en": "摔倒 (shuāidǎo)"
    - "en": "晕倒 (yūndǎo)"
    "answer": 2
  - "id": "zh-4188"
    "prompt":
      "en": "The text says to wash a cut with water first."
    "answer": true
  - "id": "zh-4189"
    "prompt":
      "en": "Which word in the text means 'first-aid kit'?"
    "options":
    - "en": "担架 (dānjià)"
    - "en": "急救箱 (jíjiùxiāng)"
    "answer": 2
