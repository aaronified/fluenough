  "title": "A cold and a fever"
  "theme": "illness"
  "sentences":
  - "text": "我感冒了， 还 发烧。"
    "reading": "wǒ gǎnmào le, hái fāshāo."
  - "text": "今天不能上班 (jīntiān bù néng shàngbān)。"
    "reading": "jīntiān bù néng shàngbān."
  - "text": "我 要 去 医院。"
    "reading": "wǒ yào qù yīyuàn."
  - "text": "请 给 我 药。"
    "reading": "qǐng gěi wǒ yào."
