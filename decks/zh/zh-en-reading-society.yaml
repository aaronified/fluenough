    "title": "Results of a survey"
    "theme": "society"
    "sentences":
      - "text": "这次 调查 的 对象 是 城市 居民。"
        "reading": "zhè cì diàochá de duìxiàng shì chéngshì jūmín."
      - "text": "大部分 人 说， 工作 和 家庭 都 很 重要。"
        "reading": "dàbùfen rén shuō, gōngzuò hé jiātíng dōu hěn zhòngyào."
      - "text": "年轻人 中 有 更 多 的 人 参与 志愿 活动。"
        "reading": "niánqīngrén zhōng yǒu gèng duō de rén cānyù zhìyuàn huódòng."
      - "text": "调查 的 结果 显示， 老年人 的 比例 在 增长。"
        "reading": "diàochá de jiéguǒ xiǎnshì, lǎoniánrén de bǐlì zài zēngzhǎng."
