  - "id": "zh-village-letter"
    "title": "A letter from a village"
    "theme": "society"
    "sentences":
      - "text": "我们 家 住在 一个 小 村庄 里。"
        "reading": "wǒmen jiā zhùzài yí ge xiǎo cūnzhuāng lǐ."
      - "text": "我 的 儿子 去 城里 工作 了。"
        "reading": "wǒ de érzi qù chénglǐ gōngzuò le."
      - "text": "城里 的 生活 很 方便， 但 房价 很 高。"
        "reading": "chénglǐ de shēnghuó hěn fāngbiàn, dàn fángjià hěn gāo."
      - "text": "我们 希望 他 能 在 城里 找到 好 的 机会。"
        "reading": "wǒmen xīwàng tā néng zài chénglǐ zhǎodào hǎo de jīhuì."
