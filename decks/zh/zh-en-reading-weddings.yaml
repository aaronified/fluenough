- "id": "zh-wedding-card"
  "title": "Wedding card"
  "theme": "weddings"
  "sentences":
  - "text": "诚挚 邀请 您 参加 我们 的 婚礼。"
    "reading": "chéngzhì yāoqǐng nín cānjiā wǒmen de hūnlǐ."
  - "text": "时间： 十 月 十 日， 下午 五 点。"
    "reading": "shíjiān: shí yuè shí rì, xiàwǔ wǔ diǎn."
  - "text": "地点： 礼堂 二 楼。"
    "reading": "dìdiǎn: lǐtáng èr lóu."
  - "text": "期待 您 的 光临！"
    "reading": "qīdài nín de guānglín!"
