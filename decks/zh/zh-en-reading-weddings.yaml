  "title": "Wedding plans"
  "theme": "weddings"
  "sentences":
  - "text": "我们 下个月 结婚， 婚礼 在 礼堂。"
    "reading": "wǒmen xià ge yuè jiéhūn, hūnlǐ zài lǐtáng."
  - "text": "宾客 大约 一百 人， 婚宴 在 酒店。"
    "reading": "bīnkè dàyuē yìbǎi rén, hūnyàn zài jiǔdiàn."
  - "text": "新娘 的 婚纱 很 漂亮。"
    "reading": "xīnniáng de hūnshā hěn piàoliang."
  - "text": "我们 还 要 选 戒指 和 花束。"
    "reading": "wǒmen hái yào xuǎn jièzhi hé huāshù."
