- "id": "zh-describing-a-room"
  "title": "Describing a room"
  "theme": "adjectives-2"
  "sentences":
  - "text": "我 的 房间 很 宽， 也 很 亮。"
    "reading": "wǒ de fángjiān hěn kuān, yě hěn liàng."
  - "text": "窗户 很 大， 墙 很 白。"
    "reading": "chuānghu hěn dà, qiáng hěn bái."
  - "text": "床 很 软， 桌子 很 平。"
    "reading": "chuáng hěn ruǎn, zhuōzi hěn píng."
  - "text": "我 很 喜欢 它。"
    "reading": "wǒ hěn xǐhuan tā."
