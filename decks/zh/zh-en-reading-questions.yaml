tags: ["beginner", "unreviewed"]
passages:
  - id: "zh-information-desk"
    title: "At the information desk"
    theme: "questions"
    sentences:
      - text: "请问，谁来？"
        reading: "qǐngwèn, shéi lái?"
      - text: "你去哪里？"
        reading: "nǐ qù nǎlǐ?"
    questions:
      - id: "zh-0112"
        prompt: { en: "谁 (shéi) in the first question asks:" }
        options:
          - { en: "who" }
          - { en: "where" }
          - { en: "why" }
        answer: 1
      - id: "zh-0113"
        prompt: { en: "哪里 (nǎlǐ) in the second question asks where you are going." }
        answer: true
  - id: "zh-visitor-faq"
    title: "A visitor's question"
    theme: "questions"
    sentences:
      - text: "你是谁？"
        reading: "nǐ shì shéi?"
      - text: "你呢？"
        reading: "nǐ ne?"
    questions:
      - id: "zh-0114"
        prompt: { en: "呢 (ne) at the end of 你呢 (nǐ ne) asks 'and you?'." }
        answer: true
      - id: "zh-0115"
        prompt: { en: "Which word means 'or' in a question that offers two choices, 还是 (háishi)?" }
        options:
          - { en: "or" }
          - { en: "also" }
          - { en: "please" }
        answer: 1
