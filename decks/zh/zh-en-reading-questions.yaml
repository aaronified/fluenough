name: "Chinese reading: asking questions"
kind: reading
language: { code: zh, iso639_3: cmn, name: "Mandarin Chinese", script: han_simplified, scripts: ["han_simplified", "han_traditional"], tts: "zh-CN", icon: "中" }
native:   { code: en, iso639_3: eng, name: English }
