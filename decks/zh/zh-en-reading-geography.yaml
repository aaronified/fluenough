  "theme": "geography"
  "sentences":
  - "text": "中国 有 很 多 省， 每 个 省 都 有 首府。"
    "reading": "Zhōngguó yǒu hěn duō shěng, měi ge shěng dōu yǒu shǒufǔ."
  - "text": "北京 是 首都， 上海 是 大 城市。"
    "reading": "Běijīng shì shǒudū, Shànghǎi shì dà chéngshì."
  - "text": "南方 的 城市 很 热， 北方 的 城市 很 冷。"
    "reading": "nánfāng de chéngshì hěn rè, běifāng de chéngshì hěn lěng."
  - "text": "有 一 条 大 河 在 中部。"
    "reading": "yǒu yì tiáo dà hé zài zhōngbù."
