  - "id": "tea-house-visit"
    "title": "A morning at the teahouse"
    "theme": "food-culture"
    "sentences":
      - "text": "周末 早上， 我 和 朋友 去 茶馆 饮茶。"
        "reading": "zhōumò zǎoshang, wǒ hé péngyou qù cháguǎn yǐnchá."
      - "text": "我们 点 了 几 样 点心， 有 春卷 和 包子。"
        "reading": "wǒmen diǎn le jǐ yàng diǎnxin, yǒu chūnjuǎn hé bāozi."
      - "text": "茶 很 香， 点心 也 很 好吃。"
        "reading": "chá hěn xiāng, diǎnxin yě hěn hǎochī."
      - "text": "我 觉得 这 家 茶馆 的 气氛 很 地道。"
        "reading": "wǒ juéde zhè jiā cháguǎn de qìfēn hěn dìdao."
