    "theme": "food-culture"
    "sentences":
      - "text": "中国 有 很多 菜系， 每 一 个 都 有 自己 的 特色。"
        "reading": "Zhōngguó yǒu hěnduō càixì, měi yí ge dōu yǒu zìjǐ de tèsè."
      - "text": "川菜 很 辣， 粤菜 比较 清淡。"
        "reading": "chuāncài hěn là, yuècài bǐjiào qīngdàn."
      - "text": "北方 人 常 吃 面食， 南方 人 常 吃 米饭。"
        "reading": "běifāng rén cháng chī miànshí, nánfāng rén cháng chī mǐfàn."
      - "text": "这些 菜系 的 做法 和 口味 都 不 一样。"
        "reading": "zhèxiē càixì de zuòfǎ hé kǒuwèi dōu bù yíyàng."
