- "id": "zh-etiquette-guide"
  "title": "Etiquette guide"
  "theme": "manners"
  "sentences":
  - "text": "见面 时 可以 握手 或者 打招呼。"
    "reading": "jiànmiàn shí kěyǐ wòshǒu huòzhě dǎzhāohu."
  - "text": "敬酒 的 时候， 要 说 一 句 好 话。"
    "reading": "jìngjiǔ de shíhou, yào shuō yí jù hǎo huà."
  - "text": "不要 问 太 多 个人 问题。"
    "reading": "búyào wèn tài duō gèrén wèntí."
  - "text": "对 老人 要 有 礼貌。"
    "reading": "duì lǎorén yào yǒu lǐmào."
