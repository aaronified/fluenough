- "id": "zh-readers-letters"
  "title": "Readers' letters"
  "theme": "opinions"
  "sentences":
  - "text": "我 认为 政府 应该 重视 教育。"
    "reading": "wǒ rènwéi zhèngfǔ yīnggāi zhòngshì jiàoyù."
  - "text": "请 大家 尊重 不同 的 观点。"
    "reading": "qǐng dàjiā zūnzhòng bùtóng de guāndiǎn."
  - "text": "这个 建议 很 合理， 我 赞同。"
    "reading": "zhè ge jiànyì hěn hélǐ, wǒ zàntóng."
  - "text": "不要 有 偏见。"
    "reading": "búyào yǒu piānjiàn."
