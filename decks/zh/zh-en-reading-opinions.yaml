- "id": "zh-agreeing-and-disagreeing"
  "title": "Agreeing and disagreeing"
  "theme": "opinions"
  "sentences":
  - "text": "我 不 太 同意 你 的 看法。"
    "reading": "wǒ bú tài tóngyì nǐ de kànfǎ."
  - "text": "但是 你 的 理由 有 道理。"
    "reading": "dànshì nǐ de lǐyóu yǒu dàolǐ."
  - "text": "我们 应该 客观 地 看 这 个 问题。"
    "reading": "wǒmen yīnggāi kèguān de kàn zhè ge wèntí."
  - "text": "也许 你 说 得 对。"
    "reading": "yěxǔ nǐ shuō de duì."
