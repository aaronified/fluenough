schema: 1
id: "ipa-en-rare"
kind: "layer"
core: "ipa-rare"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Rare sounds and tones"
description: "Sounds made without air from the lungs: clicks, implosives and ejectives; the chart's other symbols for the throat; and the marks for tone. None of the languages in this app uses them."
license: "CC0-1.0"
tags: ["advanced", "unreviewed"]
cards:
  "ipa-0138":
    native: "a kiss-like click of the lips (bilabial click)"
    notes:
      "n1": "Clicks use no air from the lungs: the tongue seals the mouth at two points, and lowering it makes a pocket of thin air that pops when the front seal opens. ʘ is the click of the lips, like a kiss, found only in a few languages of southern Africa such as Taa. Its letter is a bullseye, a circle with a dot in it."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "cela": "to ask (Zulu): the c is the dental click /ǀ/, not the bilabial click /ʘ/"
  "ipa-0139":
    native: "a tut-tut click at the teeth (dental click)"
    notes:
      "n1": "The tsk or tut-tut of English disapproval, which Zulu and Xhosa use as a consonant and spell c. Its letter is a single upright bar; it looks like the phrase-boundary bar | but is a different character."
    examples:
      "cela": "to ask (Zulu)"
      "cat": "cat (English): the c is said /k/"
  "ipa-0140":
    native: "a click like a cork popping (postalveolar click)"
    notes:
      "n1": "The tongue tip is pulled sharply down from the roof of the mouth just behind the ridge, with a hollow pop: Zulu and Xhosa q. Its letter is an exclamation mark, and the chart names it (post)alveolar."
    examples:
      "qala": "to begin (Zulu)"
      "queen": "queen (English): the q is said /kw/"
  "ipa-0141":
    native: "a sharp click with the flat of the tongue (palatoalveolar click)"
    notes:
      "n1": "The flat front of the tongue is pulled down sharply from just behind the ridge, a sharper sound than ǃ. Khoekhoe, also called Nama, and other languages of southern Africa have it. Its letter is an upright bar crossed by two strokes."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "qala": "to begin (Zulu): the q is the postalveolar click /ǃ/, not /ǂ/"
  "ipa-0142":
    native: "a giddy-up click at the side of the tongue (alveolar lateral click)"
    notes:
      "n1": "The click riders make to urge on a horse: the seal opens at the side of the tongue. Zulu and Xhosa spell it x, as at the start of the name Xhosa. Its letter is two upright bars, which look like the phrase-boundary ‖ but are a different character."
    examples:
      "xola": "to forgive (Zulu)"
      "box": "box (English): the x is said /ks/"
  "ipa-0143":
    native: "b with the air drawn inwards (voiced bilabial implosive)"
    notes:
      "n1": "Implosives are made by lowering the larynx while the mouth is closed, so air is drawn in as the lips open, with a hollow, gulping sound. Every implosive letter is a voiced stop with a hook on top: ɓ is b with the hook. Sindhi, spoken in Pakistan and India, and Hausa, in West Africa, both have ɓ."
    examples:
      "ba": "three (Vietnamese)"
      "bed": "bed (English): the b is a plain stop /b/"
  "ipa-0144":
    native: "d with the air drawn inwards (voiced dental or alveolar implosive)"
    notes:
      "n1": "d with a hook on top: an implosive at the teeth or the ridge. Vietnamese đ is often ɗ, and Sindhi and Hausa have it too."
    examples:
      "đi": "to go (Vietnamese)"
      "do": "do (English): the d is a plain stop /d/"
  "ipa-0145":
    native: "a palatal stop with the air drawn inwards (voiced palatal implosive)"
    notes:
      "n1": "ɟ with a hook on top: an implosive at the hard palate. Sindhi has it, with a letter of its own in its alphabet."
      "n2": "Speaker's check: that Swahili j is ʄ."
    examples:
      "jina": "name (Swahili)"
      "jam": "jam (English): the j is said /dʒ/"
  "ipa-0146":
    native: "g with the air drawn inwards (voiced velar implosive)"
    notes:
      "n1": "ɡ with a hook on top: an implosive at the soft palate. Sindhi has it, and so do some languages of Africa."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "go": "go (English): the g is a plain stop /ɡ/"
  "ipa-0147":
    native: "a uvular stop with the air drawn inwards (voiced uvular implosive)"
    notes:
      "n1": "ɢ with a hook on top: an implosive at the uvula, the rarest of the five. Like ɢ, it is a small capital, here with the hook."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "go": "go (English): the g is a plain stop /ɡ/, at the soft palate"
  "ipa-0148":
    native: "p with a popping release from the throat (bilabial ejective)"
    notes:
      "n1": "Ejectives are made with the vocal folds shut: the larynx rises like a piston and pushes the air out, so the release is a sharp pop. An apostrophe after a letter marks one, as in pʼ, tʼ, kʼ and sʼ. Georgian, Amharic and Quechua have ejectives; the languages in this app do not."
    examples:
      "p'unchay": "day (Quechua)"
      "pen": "pen (English): the p is said /pʰ/, with a puff of breath"
  "ipa-0149":
    native: "t with a popping release from the throat (dental or alveolar ejective)"
    notes:
      "n1": "t made as an ejective, with the vocal folds shut and the air pushed out by the rising larynx. Georgian tells tʼ from both d and tʰ, a three-way contrast where Hindi has four."
    examples:
      "t'anta": "bread (Quechua)"
      "ten": "ten (English): the t is said /tʰ/, with a puff of breath"
  "ipa-0150":
    native: "k with a popping release from the throat (velar ejective)"
    notes:
      "n1": "k made as an ejective, among the commonest ejectives in the world's languages. It is heard in Amharic, Georgian and many languages of the Americas."
    examples:
      "k'uychi": "rainbow (Quechua)"
      "kit": "kit (English): the k is said /kʰ/, with a puff of breath"
  "ipa-0151":
    native: "s with a popping release from the throat (alveolar ejective fricative)"
    notes:
      "n1": "Not only stops can be ejectives: sʼ is an s pushed out by the rising larynx with the vocal folds shut. It is rare; Amharic has it."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "sun": "sun (English): the s is said /s/, with no pop"
  "ipa-0152":
    native: "sh and the loch sound at once (simultaneous ʃ and x)"
    notes:
      "n1": "A hissing rasp made at two places at once, where ʃ and x are made. It is the Swedish sj sound, as in sju, seven, which phoneticians still argue about. Its letter is an h with a hook."
    examples:
      "sju": "seven (Swedish)"
      "sill": "herring (Swedish): the s is said /s/"
  "ipa-0153":
    native: "a harsh hiss at the epiglottis (voiceless epiglottal fricative)"
    notes:
      "n1": "The epiglottis, the flap that closes off the windpipe when you swallow, is pulled back towards the throat wall, giving a harsher hiss than ħ. A few languages of the Caucasus, such as Agul, have it. Its letter is a small capital H."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "hat": "hat (English): the h is said /h/, in the glottis, not the epiglottis"
  "ipa-0154":
    native: "a harsh voiced squeeze at the epiglottis (voiced epiglottal fricative)"
    notes:
      "n1": "ʜ with voice, deeper and harsher than ʕ. Its letter is ʕ with a bar, matching ʡ."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "hat": "hat (English): the h is said /h/, with no voice"
  "ipa-0155":
    native: "a stop at the epiglottis (epiglottal plosive)"
    notes:
      "n1": "The epiglottis closes against the back of the throat and lets go, a stop deeper in the throat than ʔ. Its letter is a glottal stop with a bar. It is among the rarest consonants."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "hat": "hat (English): the h is said /h/, with no stop"
  "ipa-0156":
    native: "a tone letter flagged at the top: extra-high pitch (extra-high tone)"
    notes:
      "n1": "Tone letters draw pitch: the upright stick is the speaker's range, and a flag from it shows where the voice is, so ˥ is the top. In tone languages such as Mandarin, Cantonese, Thai and Yoruba, pitch alone can change a word. The letters were devised by the Chinese linguist Yuen Ren Chao, in 1930."
    examples:
      "妈": "mother (Mandarin)"
      "麻": "hemp (Mandarin): má"
  "ipa-0157":
    native: "a tone letter flagged in the middle: mid pitch (mid tone)"
    notes:
      "n1": "The flag halfway up the stick is mid pitch. Five levels run from top to bottom, ˥ ˦ ˧ ˨ ˩: extra high, high, mid, low and extra low. A syllable's tone letters follow it, as in ma˧."
    examples:
      "試": "to try (Cantonese)"
      "詩": "poem (Cantonese): si1"
  "ipa-0158":
    native: "a tone letter flagged at the bottom: extra-low pitch (extra-low tone)"
    notes:
      "n1": "The flag at the foot of the stick is the bottom of the speaker's range. With ˥ at the top, it is one end of the scale that the other tone letters sit between."
    examples:
      "马": "horse (Mandarin)"
      "妈": "mother (Mandarin): mā"
  "ipa-0159":
    native: "tone letters joined: a falling tone (contour tone)"
    notes:
      "n1": "Joined tone letters draw the path of the pitch: ˥˩ falls from top to bottom, like the Mandarin fourth tone of mà, to scold, and ˩˥ rises. A contour can turn, as in ˧˦˧, rising and then falling."
    examples:
      "骂": "to scold (Mandarin)"
      "妈": "mother (Mandarin): mā"
  "ipa-0160":
    native: "an acute accent: high tone (tone mark over a vowel)"
    notes:
      "n1": "Tone can also be marked over the vowel, shown here on e: é high, ē mid and è low, with e̋ and ȅ for extra high and extra low, and ě and ê for rising and falling. In the IPA an acute accent is a high tone, not the stress it marks in Spanish spelling, as in café; stress is ˈ."
      "n2": "Speaker's check: the Yoruba tone of ó."
    examples:
      "ó": "he; she (Yoruba)"
      "café": "coffee (Spanish): in Spanish the acute accent marks stress, not tone"
  "ipa-0161":
    native: "a small down arrow: the next high tones step down (downstep)"
    notes:
      "n1": "A downstep lowers the pitch of the high tones after it, so a run of highs steps down like stairs, as in many tone languages of Africa. Its opposite is ꜛ, upstep. The larger arrows ↗ and ↘ mark a rise or fall across a whole utterance."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "ma ma": "mama (Mandarin): mā mā"
