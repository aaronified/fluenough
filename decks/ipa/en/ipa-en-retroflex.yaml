schema: 1
id: "ipa-en-retroflex"
kind: "layer"
core: "ipa-retroflex"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Curled back: the retroflex hook"
description: "One rule for every sound made with the tongue curled back: the ordinary letter with a hook below, turning right. ʈ ɖ ɳ came in the last unit; here are the rest."
license: "CC0-1.0"
tags: ["beginner", "unreviewed"]
cards:
  "ipa-0055":
    native: "t curled back with a puff of breath (aspirated voiceless retroflex plosive)"
    notes:
      "n1": "ʈ followed by a puff of breath: Hindi ठ, Bengali ঠ, Telugu ఠ, as at the end of Hindi आठ, eight. The hook says where the tongue is and the raised h says what the breath does, so the two marks combine freely."
    examples:
      "आठ": "eight (Hindi)"
      "મીઠું": "salt (Gujarati)"
  "ipa-0056":
    native: "d curled back with a breathy voice (breathy-voiced retroflex plosive)"
    notes:
      "n1": "ɖ said with a murmur of breath: Hindi ढ, Bengali ঢ. It mostly begins a word, as in Hindi ढाई, two and a half; between vowels Hindi usually has the flap ɽʱ instead, written ढ़."
    examples:
      "ढाई": "two and a half (Hindi)"
      "ঢাক": "a big drum (Bengali)"
  "ipa-0057":
    native: "sh with the tongue curled back (voiceless retroflex fricative)"
    notes:
      "n1": "s with the retroflex hook: a hiss with the tongue tip curled back, darker than ʃ. Telugu ష and Kannada ಷ are ʂ, as in భాష, language, while their శ and ಶ are ʃ; Hindi, Bengali and Gujarati now say ष, ষ and ષ as ʃ. Mandarin sh, as in Shanghai, is often written ʂ too."
    examples:
      "భాష": "language (Telugu)"
      "ಭಾಷೆ": "language (Kannada)"
  "ipa-0058":
    native: "zh with the tongue curled back (voiced retroflex fricative)"
    notes:
      "n1": "ʂ with voice: z with the retroflex hook. None of the languages in this app has it. Mandarin r, as in rén, person, is often written ʐ, and so is Polish ż."
  "ipa-0059":
    native: "l with the tongue curled back (retroflex lateral approximant)"
    notes:
      "n1": "l with the retroflex hook: the tongue tip curls back and the air flows round its sides. Marathi ळ, Gujarati ળ, Telugu ళ and Kannada ಳ are ɭ, and each language tells it apart from l, as in Marathi पोळी, chapati. Hindi and Bengali have no ɭ."
    examples:
      "पोळी": "chapati (Marathi)"
      "నీళ్ళు": "water (Telugu)"
      "ಮಗಳು": "daughter (Kannada)"
  "ipa-0060":
    native: "a gliding r with the tongue curled back (retroflex approximant)"
    notes:
      "n1": "ɹ with the retroflex hook: the tongue curls back towards the roof of the mouth without touching it. It is the ழ of Tamil, in the name Tamil itself, and Malayalam has it too; none of the languages in this app does. The letter is a turned r with the hook."
  "ipa-0061":
    native: "r flapped with the tongue curled back (retroflex flap)"
    notes:
      "n1": "The tongue curls back and flicks forward against the roof of the mouth in one quick stroke. Hindi ड़ and Bengali ড়, ड and ড with a dot below, are ɽ, as in Hindi सड़क, road, and Bengali বাড়ি, home. Romanisations write it r, but it is neither the r of र nor d."
    examples:
      "सड़क": "road (Hindi)"
      "বাড়ি": "home; house (Bengali)"
  "ipa-0062":
    native: "r flapped and curled back, with a breathy voice (breathy-voiced retroflex flap)"
    notes:
      "n1": "ɽ said with a murmur of breath: Hindi ढ़, as in पढ़ना, to read. Bengali writes ঢ় for it, but most Bengali speakers now say it as plain ɽ."
    examples:
      "पढ़ना": "to read (Hindi)"
