schema: 1
id: "ipa-en-diacritics"
kind: "layer"
core: "ipa-diacritics"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Marks on and between letters"
description: "The diacritics you meet most, each shown on a typical letter: nasal vowels, syllabic consonants, voice and breath, the tongue and the lips; then the smaller marks of length, linking and phrasing."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ipa-0122":
    native: "said through the nose too (nasalised)"
    notes:
      "n1": "A tilde above a letter, shown here on a, lets air out through the nose as well as the mouth. Hindi writes a nasal vowel with the moon and dot ँ (m̐), as in माँ (mām̐), mother, and Bengali with ঁ (m̐), as in দাঁত (dām̐t), tooth. French has nasal vowels too, as in vin, wine."
    examples:
      "माँ": "mother (Hindi)"
      "দাঁত": "tooth (Bengali)"
      "काम": "work (Hindi): the aa is said through the mouth alone"
  "ipa-0123":
    native: "a consonant that is a syllable on its own (syllabic)"
    notes:
      "n1": "A short upright line below a consonant, shown here on n, makes it a syllable by itself, with no vowel: English hidden is ˈhɪdn̩, two syllables. On a letter with a tail below, such as ŋ, the line goes above instead."
    examples:
      "hidden": "hidden (English)"
      "tin": "tin (English): the n follows a vowel, so it is not a syllable by itself"
  "ipa-0124":
    native: "a vowel that is not a syllable of its own (non-syllabic)"
    notes:
      "n1": "An arch below a vowel, shown here on i, says it makes no syllable of its own but glides into or out of the vowel beside it: Spanish aire, air, is ˈai̯ɾe, two syllables, not three. It is one way to write the second half of a diphthong; many transcriptions write j or w there instead."
    examples:
      "aire": "air (Spanish)"
      "día": "day (Spanish): the i is a syllable of its own"
  "ipa-0125":
    native: "said without voice (voiceless)"
    notes:
      "n1": "A small ring below a letter, shown here on n, takes the voice away: n̥ is an n breathed out through the nose. On a letter with a tail below, such as ŋ, the ring goes above. Welsh and Burmese have voiceless nasals, as in Welsh fy nhad, my father, and English l loses its voice after p, as in play, [pl̥eɪ]."
    examples:
      "fy nhad": "my father (Welsh)"
      "now": "now (English): the n is said with voice"
  "ipa-0126":
    native: "said with voice (voiced)"
    notes:
      "n1": "A small v below a letter, shown here on t, adds voice to a sound that usually has none. American English water has a voiced t, [ˈwɑt̬ɚ]. It is the opposite of the ring below."
    examples:
      "better": "better (English)"
      "tea": "tea (English): the t is said without voice"
  "ipa-0127":
    native: "a murmured, breathy voice, as the IPA chart writes it (breathy voiced)"
    notes:
      "n1": "Two dots below a letter, shown here on b, give it a breathy voice. This is the chart's own way to write the murmur of Hindi भ (bha), which this course writes bʱ. It goes on vowels too: Gujarati has breathy vowels."
    examples:
      "ભાઈ": "brother (Gujarati)"
      "बात": "talk (Hindi): the b is said with clear voice, not breathy"
  "ipa-0128":
    native: "the tongue rises as for y (palatalised)"
    notes:
      "n1": "A small raised j after a letter means the middle of the tongue rises towards the palate during that sound, giving it a y-like colour: tʲ. Russian tells such soft consonants from plain ones, as in мать (mat'), mother, which ends in tʲ."
    examples:
      "мать": "mother (Russian)"
      "мат": "checkmate (Russian): the т (te) is hard: no y-glide"
  "ipa-0129":
    native: "the lips round (labialised)"
    notes:
      "n1": "A small raised w after a letter rounds the lips during that sound: kʷ is a k with rounded lips, as at the start of English queen. Many languages of Africa and the Caucasus tell words apart with it."
    examples:
      "quick": "quick (English)"
      "kick": "kick (English): the k is said with the lips spread, not rounded"
  "ipa-0130":
    native: "a dark, hollow l (velarised l)"
    notes:
      "n1": "A tilde through a letter means the back of the tongue is raised towards the soft palate, or pulled into the throat. Its usual use is ɫ, the dark, hollow l at the end of English feel and full. Indian languages and Spanish have only the clear l, and a broad transcription of English writes l for both."
    examples:
      "full": "full (English)"
      "light": "light (English): the l is a clear /l/"
  "ipa-0131":
    native: "no audible release (unreleased)"
    notes:
      "n1": "A small corner at the top right of a stop, shown here on t, means it is held and never released with a pop: English that cat often ends in t̚. In Thai, Vietnamese and Korean, stops at the end of a word are always unreleased."
    examples:
      "act": "act (English)"
      "tea": "tea (English): the t is released with a burst"
  "ipa-0132":
    native: "a vowel coloured by r (r-coloured)"
    notes:
      "n1": "A small hook on the right of a vowel colours it with r, the tongue curling or bunching while the vowel is said. ɚ is the r-coloured schwa of American English butter, and ɝ the vowel of American bird. British speech has plain ə and ɜː there."
    examples:
      "butter": "butter (American English)"
      "hammer": "hammer (English): in British English the er is just /ə/, with no r-colour"
  "ipa-0133":
    native: "a little longer (half-long)"
    notes:
      "n1": "The top half of the length mark makes a sound only a little longer than short, as in eˑ. It is for narrow transcription, and for languages such as Estonian that have three degrees of length."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "bit": "bit (English): the vowel is short and carries no length mark"
  "ipa-0134":
    native: "extra short (extra-short)"
    notes:
      "n1": "A breve, the small cup above a letter, shown here on e, makes a sound shorter than usual, such as a vowel squeezed between two consonants. It is the opposite of ː."
    examples:
      "police": "police (English)"
      "peace": "peace (English): the vowel has full length"
  "ipa-0135":
    native: "no break between words (linking)"
    notes:
      "n1": "A curve at the foot of the line joins two words with no break between them, as in French liaison: les amis, the friends, is le‿zami. It is the opposite of the syllable break, the full stop."
    examples:
      "les amis": "the friends (French)"
      "les cafés": "the cafés (French): the next word begins with a consonant, so nothing links"
  "ipa-0136":
    native: "the end of a short group within a phrase (minor group)"
    notes:
      "n1": "A single upright bar marks the end of a minor, or foot, group: a short stretch of speech inside a longer phrase. It is for transcribing whole utterances, not single words, and it looks like the click ǀ but is a different character."
    examples:
      "yes, please": "yes, please (English)"
      "thank you": "thank you (English): one short group, so no bar"
  "ipa-0137":
    native: "the end of an intonation phrase (major group)"
    notes:
      "n1": "Two upright bars mark the end of a major, or intonation, group: a stretch of speech said on one tune, often a whole sentence. The single bar | marks a smaller group inside it, and the click ǁ is another character that looks the same."
    examples:
      "yes, please. Thanks.": "yes, please. Thanks. (English)"
      "yes": "yes (English): one group, so no double bar"
