schema: 1
id: "ipa-en-places"
kind: "layer"
core: "ipa-places"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "From the lips to the throat"
description: "The chart's columns, through its stops and nasals: the lips, lip and teeth, the teeth, curled back, the hard palate, the soft palate, the uvula and the glottis."
license: "CC0-1.0"
tags: ["beginner", "unreviewed"]
cards:
  "ipa-0024":
    native: "m made with lip on teeth (labiodental nasal)"
    notes:
      "n1": "An m made with the lower lip against the upper teeth, where f is made: the labiodental column. It is what m or n becomes before f in many languages, as in English comfort and Spanish enfermo, so a broad transcription rarely needs it. Its letter is m with a tail below."
    examples:
      "enfermo": "ill (Spanish)"
      "enemigo": "enemy (Spanish): the n is said /n/"
  "ipa-0025":
    native: "t with the tongue on the teeth (voiceless dental plosive)"
    notes:
      "n1": "The small bridge below a letter, shown here on t, moves it onto the teeth: t̪ is a t with the tongue tip against the back of the upper teeth. This is Hindi त (ta), Bengali ত (ta) and Telugu త (ta), and Spanish t too. For plosives the chart puts dental, alveolar and postalveolar in one wide column, and the bridge tells them apart."
    examples:
      "तीन": "three (Hindi)"
      "తాత": "grandfather (Telugu)"
      "tea": "tea (English): the t is on the ridge behind the teeth, /t/, not on the teeth"
  "ipa-0027":
    native: "t with the tongue curled back (voiceless retroflex plosive)"
    notes:
      "n1": "Retroflex means bent back: the tongue tip curls up behind the ridge. Every retroflex letter is the ordinary letter with a hook below turning right, so ʈ is t with the hook. Hindi ट (ṭa), Bengali ট (ṭa) and Telugu ట (ṭa) are ʈ, against t̪ on the teeth: English t is in between, nearer ʈ to an Indian ear."
    examples:
      "टमाटर": "tomato (Hindi)"
      "টাকা": "money; rupee (Bengali)"
      "तीन": "three (Hindi): the t is on the teeth, /t̪/, not curled back"
  "ipa-0026":
    native: "d with the tongue on the teeth (voiced dental plosive)"
    notes:
      "n1": "t̪ with voice: Hindi द (da), Bengali দ (da), Telugu ద (da). To Indian ears English d sounds curled back, which is why English words written in Indian scripts take ड (ḍa), as in डॉक्टर (ḍôkṭar). The bridge also goes under n and l, but broad transcriptions leave it off where the language has only one n or l."
    examples:
      "दस": "ten (Hindi)"
      "দুধ": "milk (Bengali)"
      "day": "day (English): the d is on the ridge behind the teeth, /d/, not on the teeth"
  "ipa-0028":
    native: "d with the tongue curled back (voiced retroflex plosive)"
    notes:
      "n1": "d with the retroflex hook: the tongue curls back as for ʈ, with voice. Hindi ड (ḍa), Bengali ড (ḍa) and Telugu డ (ḍa) are ɖ, and borrowed English words take it for d, as in Hindi डॉक्टर (ḍôkṭar). Between vowels, Hindi and Bengali usually have the flap ɽ instead, written with a dot below: ड़ (ṛa), ড় (ṛa)."
    examples:
      "डॉक्टर": "doctor (Hindi)"
      "ડાબે": "on the left (Gujarati)"
      "दस": "ten (Hindi): the d is on the teeth, /d̪/, not curled back"
  "ipa-0029":
    native: "n with the tongue curled back (retroflex nasal)"
    notes:
      "n1": "n with the retroflex hook: the tongue curls back as for ɖ while the air flows through the nose. Marathi ण (ṇa), Gujarati ણ (ṇa), Telugu ణ (ṇa) and Kannada ಣ (ṇa) are ɳ, as in Marathi पाणी (pāṇi), water. Bengali and Assamese still write ণ (ṇa), but say it n."
    examples:
      "पाणी": "water (Marathi)"
      "ಕೋಣೆ": "room (Kannada)"
      "नाम": "name (Hindi): the n is not curled back: it is /n/"
  "ipa-0030":
    native: "k made at the hard palate (voiceless palatal plosive)"
    notes:
      "n1": "Not s and not k: c is a stop made with the middle of the tongue against the hard palate, between t and k, like Hungarian ty. It heads the palatal column, with j and ɲ further down. Some descriptions write Hindi च (ca) as c, but most, and this course, write it tʃ."
    examples:
      "tyúk": "hen (Hungarian)"
      "cat": "cat (English): the c is said /k/, not at the hard palate"
  "ipa-0031":
    native: "g made at the hard palate (voiced palatal plosive)"
    notes:
      "n1": "c with voice, like Hungarian gy. Its letter is a dotless j with a bar across it. Some descriptions write Hindi ज (ja) as ɟ, but most write it dʒ."
    examples:
      "gyár": "factory (Hungarian)"
      "gem": "gem (English): the g is said /dʒ/"
  "ipa-0032":
    native: "ny, as in Spanish ñ (palatal nasal)"
    notes:
      "n1": "The middle of the tongue presses the hard palate while the air flows through the nose, as in Spanish año and niño. Its letter is n with a tail on its left leg. Hindi ञ (ña) and its partners in the other Indian scripts stand for it, though they are heard mostly before च (ca) and ज (ja)."
      "n2": "Speaker's check: the Indian-language tags: ɲ may need tags for the languages that write ञ (ña)."
    examples:
      "año": "year (Spanish)"
      "niño": "boy (Spanish)"
      "nada": "nothing (Spanish): the n is said /n/"
  "ipa-0033":
    native: "ng as in sing (velar nasal)"
    notes:
      "n1": "The ng of English sing is one sound, not n and g: the back of the tongue closes against the soft palate as for k, and the air flows through the nose. Its letter is n with a long tail. Bengali writes it ং (ṃ) or ঙ (ṅa), as in বাঙালি (bāṅāli), and the other Indian scripts have ङ (ṅa) and the dot ं (ṃ) before k and g."
      "n2": "Speaker's check: the tags on ŋ for the Indian languages that write ङ (ṅa) or the dot."
    examples:
      "বাঙালি": "a Bengali, a person from Bengal (Bengali)"
      "sing": "sing (English)"
      "sin": "sin (English): the n is said /n/"
  "ipa-0034":
    native: "k made at the uvula (voiceless uvular plosive)"
    notes:
      "n1": "A stop further back than k, with the back of the tongue against the uvula, the soft flap at the back of the mouth. It is Arabic qaf, and Hindi and Urdu write it क़ (qa) in words from Arabic and Persian, though most Hindi speakers say k. The uvular column comes right after the velar one."
    examples:
      "قلب": "heart (Arabic)"
      "queen": "queen (English): the q is said /kw/"
  "ipa-0035":
    native: "g made at the uvula (voiced uvular plosive)"
    notes:
      "n1": "q with voice. Its letter is a small capital G: the chart uses small capitals mostly for sounds made further back than the ordinary letter. It is rare as a sound of its own."
      "n2": "Speaker's check: that Persian says ق (qāf) and غ (ghayn) as ɢ."
    examples:
      "قند": "sugar (Persian)"
      "go": "go (English): the g is said /ɡ/, at the soft palate, not the uvula"
  "ipa-0036":
    native: "ng made at the uvula (uvular nasal)"
    notes:
      "n1": "A nasal with the back of the tongue against the uvula, written as a small capital N. Japanese ん (n) at the end of a word is often said this way. It completes the nasal row from the lips back: m ɱ n ɳ ɲ ŋ ɴ."
      "n2": "Speaker's check: that Japanese ん (n) at the end of a word is ɴ."
    examples:
      "ほん": "book (Japanese)"
      "no": "no (English): the n is said /n/"
  "ipa-0037":
    native: "a catch in the throat (glottal stop)"
    notes:
      "n1": "The vocal folds snap shut and let go, as in the middle of English uh-oh, or the t that many British speakers say in water. Its letter is a question mark without the dot, the one plosive of the glottal column. Arabic and Hawaiian write it as a letter of their own."
    examples:
      "uh-oh": "uh-oh (English)"
      "don't": "do not (English): the apostrophe is silent: no catch in the throat"
