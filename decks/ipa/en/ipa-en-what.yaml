schema: 1
id: "ipa-en-what"
kind: "layer"
core: "ipa-what"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "What the IPA is"
description: "What the International Phonetic Alphabet is, why it was made, and how its chart is built: consonants by place, manner and voicing, vowels by height, backness and rounding, and the marks added to a letter."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ipa-0180":
    native: "a set of symbols that writes the sounds of speech, the same in every language"
    notes:
      "n1": "The IPA is an alphabet for how words are said, not how they are spelt. It is based mostly on Latin letters, and it was devised by the International Phonetic Association, starting in the late 19th century, as a standard way to write the sounds of speech. Linguists, dictionary makers, language learners and teachers, speech and language therapists, singers and actors use it. The idea is one symbol for each sound, whatever the language. Source: English Wikipedia, International Phonetic Alphabet. In the examples, the card's sound is ʃ, the sh of English ship."
    examples:
      "ship": "ship (English): the sh is ʃ"
      "chef": "chef (French): the ch is also ʃ, so the IPA writes it with the same symbol as English sh"
      "chat": "chat (English): the ch here is tʃ, a different sound, so it has a different symbol"
  "ipa-0181":
    native: "the same letters can be said in different ways, and one sound can be spelt in different ways"
    notes:
      "n1": "This is why the IPA exists. English spells ʌf as ough in tough, əʊ in though and uː in through, so the spelling cannot tell you the sound. A transcription can: it gives one symbol to each sound, whatever the spelling. The transcriptions here are of standard British English. Source: dictionary entries, such as English Wiktionary for tough, though and through."
    examples:
      "tough": "tough (English): the letters ough are said ʌf"
      "though": "though (English): the same letters ough are said əʊ here, not ʌf"
      "through": "through (English): the same letters ough are said uː here, not ʌf"
  "ipa-0182":
    native: "the society of language teachers that made the IPA, founded in Paris in 1886"
    notes:
      "n1": "The International Phonetic Association was founded in Paris in 1886 by a group of language teachers led by the French linguist Paul Passy. It began as a tool for teaching: its founders wanted schoolchildren to learn how foreign languages are really pronounced, not just how they are spelt. Source: English Wikipedia, International Phonetic Association."
      "n2": "The first version of the International Phonetic Alphabet was published in 1888. Its aim was one letter for each sound, used the same way in every language. The Association still keeps the alphabet and revises its chart now and then. Source: English Wikipedia, History of the International Phonetic Alphabet, and the Association's chart page."
  "ipa-0183":
    native: "every consonant on the chart is named by three facts: where it is made, how it is made, and whether the voice hums"
    notes:
      "n1": "The consonant chart is a table. The columns are the places where a sound is made, from the lips at the left to the throat at the right. The rows are the manners: how the air is stopped or let through. Where a cell holds two symbols, the left one is voiceless and the right one is voiced. So p is the voiceless sound made with both lips by stopping the air, and b is the same with voice. Source: the IPA chart, 2020 revision, on the Association's website."
      "n2": "Change one fact at a time and you move one step on the chart. pin to bin changes only the voicing. bin to din changes only the place, from the lips to the ridge behind the teeth. bin to min changes only the manner, from a stop to a nasal. Sources: the IPA chart, and English Wikipedia, International Phonetic Alphabet."
  "ipa-0184":
    native: "every vowel is placed by how high the tongue is, how far back it is, and whether the lips are rounded"
    notes:
      "n1": "The vowel chart is a side view of the mouth. Up and down is the height of the tongue, from close at the top to open at the bottom. Left to right is the backness, from front to back. Where two symbols share a dot, the left one has spread lips and the right one has rounded lips. So i is close and front, u is close, back and rounded, and a is open and front. Source: the IPA chart, 2020 revision, on the Association's website."
  "ipa-0185":
    native: "small marks added to a letter to give more detail about the sound"
    notes:
      "n1": "The chart has a table of diacritics: marks above, below or after a letter that change it a little without changing what it basically is. A small raised h after p, as in pʰ, adds a puff of breath. Later units teach the common ones. Source: the IPA chart, 2020 revision, on the Association's website."
      "n2": "English p is said with a puff of breath at the start of a stressed syllable, as in pin, and without one after s, as in spin. The puff is written ʰ. Source: English Wikipedia, Aspiration (phonetics). In the examples, the card's mark is ʰ."
    examples:
      "pin": "pin (English): the p is written pʰ, with the puff of breath"
      "spin": "spin (English): the p comes after s and has no puff, so it has no ʰ"
  "ipa-0186":
    native: "marks between letters for how long, how strong and how high a sound is"
    notes:
      "n1": "Some marks are not part of a letter. ː after a sound makes it long. ˈ before a syllable marks the main stress, and ˌ a lighter one. The chart also has marks for tone, the pitch of a syllable, used by languages such as Mandarin. Source: the IPA chart, 2020 revision, on the Association's website."
