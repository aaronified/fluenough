schema: 1
id: "ipa-en-narrow"
kind: "layer"
core: "ipa-narrow"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Fine detail in square brackets"
description: "The rest of the chart's diacritics, for narrow transcription: voice quality, release, the tongue's position and root, and which part of the tongue does the work. Each is shown on a typical letter."
license: "CC-BY-SA-4.0"
tags: ["advanced", "unreviewed"]
cards:
  "ipa-0162":
    native: "a tilde below: a creaky, croaking voice (creaky voiced)"
    notes:
      "n1": "A tilde below a letter, shown here on a, gives it a creaky voice, like the low croak at the end of a tired sentence. Some languages of Mexico and South-East Asia tell creaky vowels from plain ones. It is the partner of the two dots below for breathy voice."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "father": "father (English): the a is said with ordinary, clear voice"
  "ipa-0163":
    native: "a small raised n: released through the nose (nasal release)"
    notes:
      "n1": "A small raised n after a stop, shown here on d, means it is released by lowering the soft palate, so the air bursts out through the nose and not the mouth. English sudden has it: the d opens straight into the n, [ˈsʌdⁿn̩]."
    examples:
      "sudden": "sudden (English)"
      "dad": "dad (English): the d is released through the mouth"
  "ipa-0164":
    native: "a small raised l: released at the sides of the tongue (lateral release)"
    notes:
      "n1": "A small raised l after a stop, shown here on d, means it is released by dropping the sides of the tongue, as for l, while the tip stays where it is. English middle has it: the d opens straight into the l."
    examples:
      "middle": "middle (English)"
      "dog": "dog (English): the d is released through the mouth"
  "ipa-0165":
    native: "a small raised gamma: the back of the tongue raised (velarised)"
    notes:
      "n1": "A small raised ɣ after a letter, shown here on t, means the back of the tongue rises towards the soft palate during the sound, darkening it. The hard consonants of Russian and the broad ones of Irish are often described this way. The tilde through a letter, as in ɫ, can say the same in one mark."
    examples:
      "tá": "is (Irish)"
      "te": "hot (Irish): the t is slender, /tʲ/, with the tongue raised towards the palate"
  "ipa-0166":
    native: "a small raised ʕ: the throat narrowed (pharyngealised)"
    notes:
      "n1": "A small raised ʕ after a letter, shown here on t, means the root of the tongue is pulled back into the throat during the sound. The emphatic consonants of Arabic, such as ط (ṭāʾ), are described this way."
    examples:
      "طين": "mud (Arabic)"
      "تين": "figs (Arabic): the t is plain /t/, with no narrowing of the throat"
  "ipa-0167":
    native: "a right half-ring below: lips more rounded (more rounded)"
    notes:
      "n1": "The right half of a small ring below a vowel, shown here on ɔ, says the lips are more rounded than usual for that letter. Its mirror image, the left half-ring, says less rounded."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "law": "law (English): the vowel is /ɔ/ with ordinary rounding"
  "ipa-0168":
    native: "a left half-ring below: lips less rounded (less rounded)"
    notes:
      "n1": "The left half of a small ring below a vowel, shown here on ɔ, says the lips are less rounded than usual for that letter. Its mirror image, the right half-ring, says more rounded."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "law": "law (English): the vowel is /ɔ/ with ordinary rounding"
  "ipa-0169":
    native: "a plus below: a little further forward (advanced)"
    notes:
      "n1": "A small plus below a letter, shown here on u, moves the sound a little towards the front of the mouth: u̟ is an oo with the tongue further forward, as many English speakers say the vowel of goose. Its opposite is the minus below, for a sound made a little further back."
    examples:
      "goose": "goose (English)"
      "uno": "one (Spanish): the u is the back /u/, not advanced"
  "ipa-0170":
    native: "a minus below: a little further back (retracted)"
    notes:
      "n1": "A short line below a letter, shown here on e, moves the sound a little towards the back of the mouth. On a consonant it marks a place just behind the usual one: s̠ is an s made a little further back."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "été": "summer (French): the é is the plain /e/, not drawn back"
  "ipa-0171":
    native: "two dots above: towards the centre (centralised)"
    notes:
      "n1": "Two dots above a vowel, shown here on e, move it towards the centre of the vowel chart, where ə is. Unstressed vowels are often written this way in narrow transcription."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "été": "summer (French): the é is the plain /e/, not drawn towards the centre"
  "ipa-0172":
    native: "a small cross above: halfway to the centre (mid-centralised)"
    notes:
      "n1": "A small cross above a vowel, shown here on e, moves it halfway from where the letter is towards ə in the centre of the chart, less far than the two dots above. It suits a vowel that is weakened, but not all the way to ə."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "été": "summer (French): the é is the plain /e/, not halfway to the centre"
  "ipa-0174":
    native: "an up tack below: a little higher (raised)"
    notes:
      "n1": "A small up tack below a letter, shown here on e, raises the tongue a little: e̝ lies between e and i. On a consonant it narrows the gap, so an approximant becomes a fricative: Czech ř is often written r̝."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "été": "summer (French): the é is the plain /e/, not raised"
  "ipa-0175":
    native: "a down tack below: a little lower (lowered)"
    notes:
      "n1": "A small down tack below a letter, shown here on e, lowers the tongue a little: e̞ is a true mid e, between e and ɛ, as Spanish e is often described. On a fricative it widens the gap into an approximant: β̞ is the gliding b of Spanish beber."
    examples:
      "mesa": "table (Spanish)"
      "été": "summer (French): the é is the true close-mid /e/, not lowered"
  "ipa-0176":
    native: "a left tack below: the tongue root forward (advanced tongue root)"
    notes:
      "n1": "A small left tack below a vowel, shown here on e, means the root of the tongue is pushed forward, widening the throat. Many languages of West Africa, such as Akan and Igbo, sort their vowels into two sets by the tongue root, and a word takes its vowels from one set."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "été": "summer (French): the é has the tongue root in its usual place"
  "ipa-0177":
    native: "a right tack below: the tongue root back (retracted tongue root)"
    notes:
      "n1": "A small right tack below a vowel, shown here on e, means the root of the tongue is pulled back, narrowing the throat. It marks the other set of vowels in languages such as Akan."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "été": "summer (French): the é has the tongue root in its usual place"
  "ipa-0173":
    native: "a seagull below: the tongue against the upper lip (linguolabial)"
    notes:
      "n1": "The mark below, shaped like a flying seagull, means the tongue tip touches the upper lip instead of the teeth or the ridge: t̼ is a t made with tongue and lip. It is rare, found in a few languages of Vanuatu."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "tea": "tea (English): the t is at the ridge, not the tongue against the upper lip"
  "ipa-0178":
    native: "an upturned bridge below: made with the tongue tip (apical)"
    notes:
      "n1": "An upside-down bridge below a consonant, shown here on t, means it is made with the very tip of the tongue. The s of Spain is often described as apical, s̺, which gives it a slight sh-like sound."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "tea": "tea (English): no particular part of the tongue is marked: a plain /t/"
  "ipa-0179":
    native: "a small square below: made with the tongue blade (laminal)"
    notes:
      "n1": "A small square below a consonant, shown here on t, means it is made with the blade of the tongue, the flat part just behind the tip. With the bridge for dental and the upturned bridge for apical, it lets a transcription say which part of the tongue touches where."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "tea": "tea (English): no particular part of the tongue is marked: a plain /t/"
