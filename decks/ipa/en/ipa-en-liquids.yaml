schema: 1
id: "ipa-en-liquids"
kind: "layer"
core: "ipa-liquids"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "r, l and the glides"
description: "The chart's approximants, trills, taps and laterals: the many kinds of r and l, and the glides between a consonant and a vowel."
license: "CC0-1.0"
tags: ["beginner", "unreviewed"]
cards:
  "ipa-0079":
    native: "v without a buzz, lip near the teeth (labiodental approximant)"
    notes:
      "n1": "The lower lip comes close to the upper teeth, as for v, but not close enough to buzz. Hindi and Marathi व, Gujarati વ, Telugu వ and Kannada ವ are usually ʋ, which English ears hear sometimes as v and sometimes as w. Its letter is a v with a rounded bottom and a hook."
    examples:
      "वहाँ": "there (Hindi)"
      "వేడి": "hot (Telugu)"
  "ipa-0080":
    native: "the r of English (alveolar approximant)"
    notes:
      "n1": "The r of most English: the tongue comes up towards the ridge but never touches it. Its letter is r turned upside down, because plain r is the rolled r; English dictionaries often write r anyway, for convenience. Assamese ৰ is close to it, as in ৰাতি, night."
    examples:
      "rain": "rain (English)"
      "ৰাতি": "night (Assamese)"
  "ipa-0081":
    native: "a rolled r (alveolar trill)"
    notes:
      "n1": "The rolled r of Spanish perro, dog: the tongue tip vibrates against the ridge several times. Spanish tells it from the single tap ɾ, as in perro against pero, but. Indian r is usually a tap and sometimes rolled, and many transcriptions write it r, since these languages have only one r."
    examples:
      "perro": "dog (Spanish)"
      "rojo": "red (Spanish)"
  "ipa-0082":
    native: "a single quick tap of r (alveolar tap)"
    notes:
      "n1": "One quick tap of the tongue tip on the ridge: Spanish r between vowels, as in pero, and the usual r of Hindi र, Bengali র and Telugu ర. American English says the t of water this way. Its letter is called the fish-hook r."
    examples:
      "pero": "but (Spanish)"
      "परिवार": "family (Hindi)"
  "ipa-0083":
    native: "a g that glides, with no touch (velar approximant)"
    notes:
      "n1": "The back of the tongue rises towards the soft palate, as for ɡ, but leaves a gap: like a w without rounded lips. Spanish g between vowels can soften this far, as in agua. Its letter is a turned m with a long leg, the consonant partner of the vowel ɯ."
  "ipa-0084":
    native: "a w blown without voice (voiceless labial-velar fricative)"
    notes:
      "n1": "w without voice, blown out: the wh of which as some Scottish, Irish and older American speakers say it, against witch with w. Its letter is w turned upside down."
  "ipa-0085":
    native: "a w with the tongue placed for y (labial-palatal approximant)"
    notes:
      "n1": "Lips rounded as for w and the tongue raised as for j, both at once: French huit, eight. It is the glide of the vowel y. Its letter is h turned upside down."
  "ipa-0086":
    native: "an r rolled at the uvula (uvular trill)"
    notes:
      "n1": "The uvula vibrates against the back of the tongue: a trill heard from some speakers of French, German and Dutch. Its letter is a small capital R, which fits the rule that small capitals are mostly sounds made further back."
  "ipa-0087":
    native: "a brr with flapping lips (bilabial trill)"
    notes:
      "n1": "The lips vibrate against each other, as in the brr of someone cold. A few languages of Papua New Guinea and Brazil use it in words. Its letter is a small capital B."
  "ipa-0088":
    native: "the lower lip flicked off the teeth (labiodental flap)"
    notes:
      "n1": "The lower lip is drawn back and flicked forward against the upper teeth in one stroke. It is found in languages of central Africa such as Mono, and it was the last letter added to the chart, in 2005. Its letter is v with a hook on the right."
  "ipa-0089":
    native: "an l flicked like a tap (alveolar lateral flap)"
    notes:
      "n1": "A single tap like ɾ, but with the air passing round the sides of the tongue as for l. Japanese r is sometimes said this way, which is one reason English ears hear it between r and l. Its letter is a turned r with a long leg."
  "ipa-0090":
    native: "an l at the hard palate, like ly (palatal lateral approximant)"
    notes:
      "n1": "An l made with the middle of the tongue against the hard palate: Italian gli, and the ll of traditional Castilian calle, though most speakers in Spain now say ʝ there. Its letter is y turned upside down."
  "ipa-0091":
    native: "an l at the soft palate (velar lateral approximant)"
    notes:
      "n1": "An l made with the back of the tongue against the soft palate, where k is made, and the air flowing round its sides. It is rare: a few languages of New Guinea have it. Its letter is a small capital L."
  "ipa-0092":
    native: "a hissing l (voiceless alveolar lateral fricative)"
    notes:
      "n1": "Place the tongue for l and blow hard, without voice: the ll of Welsh Llanelli. Its letter is l with a belt round it. The lateral fricative row has just these two letters, ɬ and ɮ."
  "ipa-0093":
    native: "a buzzing l (voiced alveolar lateral fricative)"
    notes:
      "n1": "ɬ with voice: the tongue placed for l, with the air buzzing round its sides. Zulu dl is the usual example. Its letter joins l and ʒ: an l with an ezh tail."
