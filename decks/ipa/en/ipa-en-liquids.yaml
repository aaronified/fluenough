schema: 1
id: "ipa-en-liquids"
kind: "layer"
core: "ipa-liquids"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "r, l and the glides"
description: "The chart's approximants, trills, taps and laterals: the many kinds of r and l, and the glides between a consonant and a vowel."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ipa-0079":
    native: "the lower lip near the upper teeth, gliding with no buzz (labiodental approximant)"
    notes:
      "n1": "The lower lip comes close to the upper teeth, as for v, but not close enough to buzz. Hindi and Marathi व (va), Gujarati વ (va), Telugu వ (va) and Kannada ವ (va) are usually ʋ, which English ears hear sometimes as v and sometimes as w. Its letter is a v with a rounded bottom and a hook."
    examples:
      "वहाँ": "there (Hindi)"
      "వేడి": "hot (Telugu)"
      "van": "van (English): the v is said /v/, with a buzz"
  "ipa-0080":
    native: "the tongue rising towards the ridge, never touching, as in red (alveolar approximant)"
    notes:
      "n1": "The r of most English: the tongue comes up towards the ridge but never touches it. Its letter is r turned upside down, because plain r is the rolled r; English dictionaries often write r anyway, for convenience. Assamese ৰ (ra) is close to it, as in ৰাতি (rāti), night."
    examples:
      "rain": "rain (English)"
      "ৰাতি": "night (Assamese)"
      "pero": "but (Spanish): the r is said as a tap /ɾ/"
  "ipa-0082":
    native: "one quick tap of the tongue tip on the ridge (alveolar tap)"
    notes:
      "n1": "One quick tap of the tongue tip on the ridge: Spanish r between vowels, as in pero, and the usual r of Hindi र (ra), Bengali র (ra) and Telugu ర (ra), though their transcriptions, this app's among them, write r, as these languages have only one r. American English says the t of water this way. Its letter is called the fish-hook r."
    examples:
      "pero": "but (Spanish)"
      "perro": "dog (Spanish): the rr is rolled /r/"
  "ipa-0081":
    native: "the tongue tip rolled against the ridge (alveolar trill)"
    notes:
      "n1": "The rolled r of Spanish perro, dog: the tongue tip vibrates against the ridge several times. Spanish tells it from the single tap ɾ, as in perro against pero, but. Indian r is usually a tap and sometimes rolled, and many transcriptions write it r, since these languages have only one r."
    examples:
      "perro": "dog (Spanish)"
      "rojo": "red (Spanish)"
      "pero": "but (Spanish): the r between vowels is a single tap /ɾ/"
  "ipa-0086":
    native: "the uvula rolled against the back of the tongue (uvular trill)"
    notes:
      "n1": "The uvula vibrates against the back of the tongue: a trill heard from some speakers of French, German and Dutch. Its letter is a small capital R, which fits the rule that small capitals are mostly sounds made further back."
    examples:
      "rot": "red (German)"
      "red": "red (English): the r is said /ɹ/"
  "ipa-0087":
    native: "both lips vibrating, as when shivering (bilabial trill)"
    notes:
      "n1": "The lips vibrate against each other, as in the brr of someone cold. A few languages of Papua New Guinea and Brazil use it in words. Its letter is a small capital B."
    examples:
      "brr": "brr, the sound of shivering (English)"
      "bed": "bed (English): the b is said /b/, a stop"
  "ipa-0088":
    native: "the lower lip flicked off the upper teeth (labiodental flap)"
    notes:
      "n1": "The lower lip is drawn back and flicked forward against the upper teeth in one stroke. It is found in languages of central Africa such as Mono, and it was the last letter added to the chart, in 2005. Its letter is v with a hook on the right."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "very": "very (English): the v is said /v/, with the lip held against the teeth"
  "ipa-0089":
    native: "one tap of the tongue, with the air round its sides (alveolar lateral flap)"
    notes:
      "n1": "A single tap like ɾ, but with the air passing round the sides of the tongue as for l. Japanese r is sometimes said this way, which is one reason English ears hear it between r and l. Its letter is a turned r with a long leg."
    examples:
      "さくら": "cherry blossom (Japanese)"
      "lip": "lip (English): the l is said /l/, held, not flicked"
  "ipa-0090":
    native: "the air round the sides of the tongue pressed to the hard palate (palatal lateral approximant)"
    notes:
      "n1": "An l made with the middle of the tongue against the hard palate: Italian gli, and the ll of traditional Castilian calle, though most speakers in Spain now say ʝ there. Its letter is y turned upside down."
    examples:
      "famiglia": "family (Italian)"
      "luna": "moon (Italian): the l is said /l/"
  "ipa-0091":
    native: "the air round the sides of the tongue at the soft palate (velar lateral approximant)"
    notes:
      "n1": "An l made with the back of the tongue against the soft palate, where k is made, and the air flowing round its sides. It is rare: a few languages of New Guinea have it. Its letter is a small capital L."
      "n2": "No example yet has this sound in a word: one is wanted from a speaker or a phonetician."
    examples:
      "light": "light (English): the l is said /l/ at the ridge, not at the soft palate"
  "ipa-0092":
    native: "a hiss round the sides of the tongue, no voice, as in Welsh Llanelli (voiceless alveolar lateral fricative)"
    notes:
      "n1": "Place the tongue for l and blow hard, without voice: the ll of Welsh Llanelli. Its letter is l with a belt round it. The lateral fricative row has just these two letters, ɬ and ɮ."
    examples:
      "llan": "church; village (Welsh)"
      "bell": "bell (English): the l is said /l/, with voice"
  "ipa-0093":
    native: "a buzz round the sides of the tongue (voiced alveolar lateral fricative)"
    notes:
      "n1": "ɬ with voice: the tongue placed for l, with the air buzzing round its sides. Zulu dl is the usual example. Its letter joins l and ʒ: an l with an ezh tail."
    examples:
      "dlala": "to play (Zulu)"
      "lala": "to sleep (Zulu): the l is said /l/"
  "ipa-0083":
    native: "the back of the tongue gliding up to the soft palate, lips spread (velar approximant)"
    notes:
      "n1": "The back of the tongue rises towards the soft palate, as for ɡ, but leaves a gap: like a w without rounded lips. Spanish g between vowels can soften this far, as in agua. Its letter is a turned m with a long leg, the consonant partner of the vowel ɯ."
    examples:
      "lago": "lake (Spanish)"
      "gato": "cat (Spanish): the g at the start of a word is said /ɡ/, a stop"
  "ipa-0084":
    native: "a rounded glide blown without voice, as some say which (voiceless labial-velar fricative)"
    notes:
      "n1": "w without voice, blown out: the wh of which as some Scottish, Irish and older American speakers say it, against witch with w. Its letter is w turned upside down."
    examples:
      "which": "which (English)"
      "witch": "witch (English): the w is said /w/, with voice"
  "ipa-0085":
    native: "rounded lips with the tongue raised to the palate, gliding, as in French huit (labial-palatal approximant)"
    notes:
      "n1": "Lips rounded as for w and the tongue raised as for j, both at once: French huit, eight. It is the glide of the vowel y. Its letter is h turned upside down."
    examples:
      "huit": "eight (French)"
      "oui": "yes (French): the ou is said /w/"
