schema: 1
id: "ipa-en-familiar"
kind: "layer"
core: "ipa-familiar"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Letters you already know"
description: "The letters that keep their usual Latin sound, and the few that look familiar but work differently: j is the y of yes, ɡ has an open tail, and x is a rasp."
license: "CC0-1.0"
tags: ["beginner", "unreviewed"]
cards:
  "ipa-0007":
    native: "p, closing both lips (voiceless bilabial plosive)"
    notes:
      "n1": "Both lips close and open, with no voice. It is the first letter of the consonant chart: the plosive row, where the air is stopped and let go, in the bilabial column, on the voiceless left. Indian p has no puff of breath after it; with a puff it is pʰ, another sound."
    examples:
      "पानी": "water (Hindi)"
      "pan": "bread (Spanish)"
  "ipa-0008":
    native: "b, closing both lips with voice (voiced bilabial plosive)"
    notes:
      "n1": "The lips close and open while the voice hums. It shares p's cell on the chart, on the voiced right. Spanish writes this sound with both b and v, so vivir is biˈbiɾ; between vowels Spanish b softens to β."
    examples:
      "बेटी": "daughter (Hindi)"
      "vivir": "to live (Spanish)"
  "ipa-0009":
    native: "t with the tongue on the ridge behind the teeth (voiceless alveolar plosive)"
    notes:
      "n1": "The t of English ten: the tongue tip touches the ridge just behind the upper teeth, the alveolar column. Assamese t is this sound. Hindi, Marathi, Gujarati, Bengali, Telugu and Kannada have t̪ on the teeth and ʈ curled back instead, and hear English t as ʈ. Spanish t is on the teeth too, but a broad transcription of Spanish writes it t, as Spanish has no other t."
    examples:
      "তিনি": "three (Assamese)"
      "tea": "tea (English)"
      "tomate": "tomato (Spanish)"
  "ipa-0010":
    native: "d with the tongue on the ridge behind the teeth (voiced alveolar plosive)"
    notes:
      "n1": "The d of English day, made where t is but with voice. Assamese has this d; the other Indian languages here split it into d̪ on the teeth and ɖ curled back. Spanish d is on the teeth and is written d, and between vowels it softens to ð."
    examples:
      "দহ": "ten (Assamese)"
      "day": "day (English)"
  "ipa-0011":
    native: "k, the back of the tongue on the soft palate (voiceless velar plosive)"
    notes:
      "n1": "The back of the tongue presses against the soft palate and lets go. It sits in the velar column, far to the right, because the chart's columns run from the lips back towards the throat. Like p, Indian k has no puff of breath; the puffed one is kʰ."
    examples:
      "कमरा": "room (Hindi)"
      "casa": "house (Spanish)"
  "ipa-0012":
    native: "g as in go, with an open tail (voiced velar plosive)"
    notes:
      "n1": "Always the g of go, never the g of gem. The IPA prints it with an open tail, ɡ, not the two-loop g of many typefaces, and Unicode gives it a code of its own. It is the voiced partner of k."
    examples:
      "आगे": "ahead (Hindi)"
      "grande": "big (Spanish)"
  "ipa-0013":
    native: "m, through the nose with closed lips (bilabial nasal)"
    notes:
      "n1": "The lips close as for p and b, but the air flows out through the nose. It is the nasal of the bilabial column. Nasals are voiced, so each cell of the nasal row holds one letter, on the right."
    examples:
      "মা": "mother (Bengali)"
      "mesa": "table (Spanish)"
  "ipa-0014":
    native: "n, through the nose with the tongue on the ridge (alveolar nasal)"
    notes:
      "n1": "The tongue closes the mouth where t is made, and the air goes out through the nose. In Hindi and the other Indian languages n is on the teeth, like t̪, but a broad transcription still writes n. The curled-back n of Marathi ण is another letter, ɳ."
    examples:
      "नाम": "name (Hindi)"
      "noche": "night (Spanish)"
  "ipa-0015":
    native: "f, lower lip on upper teeth (voiceless labiodental fricative)"
    notes:
      "n1": "The lower lip rests on the upper teeth and air hisses through: the labiodental column, second from the left, in the fricative row. Hindi writes f as फ़, फ with a dot below, in words from Persian and English, as in दफ़्तर, office. Plain फ is pʰ, a p with a puff of breath."
    examples:
      "दफ़्तर": "office (Hindi)"
      "café": "coffee (Spanish)"
  "ipa-0016":
    native: "v as in van, with a buzz (voiced labiodental fricative)"
    notes:
      "n1": "The v of English van: lip on teeth, with voice and a buzz. Spanish has no v sound, whatever its spelling: v is said b. The softer v of Hindi व and Telugu వ, with no buzz, is another letter, ʋ."
    examples:
      "van": "van (English)"
  "ipa-0017":
    native: "s as in sun (voiceless alveolar fricative)"
    notes:
      "n1": "Always the s of sun, never the z sound of rose. Assamese says চ and ছ as s, while its স, শ and ষ are x. Bengali says most of its স as ʃ, and keeps s for a few words and clusters."
    examples:
      "सात": "seven (Hindi)"
      "চাহ": "tea (Assamese)"
      "mesa": "table (Spanish)"
  "ipa-0018":
    native: "z as in zoo (voiced alveolar fricative)"
    notes:
      "n1": "s with voice, the z of English zoo. Hindi writes it ज़, ज with a dot below, in words from Persian and English, and Assamese says জ, ঝ and য as z. Spanish has no z sound: in Spain its letter z is θ."
    examples:
      "मेज़": "table (Hindi)"
      "জল": "water (Assamese)"
      "zoo": "zoo (English)"
  "ipa-0019":
    native: "h, just breath (voiceless glottal fricative)"
    notes:
      "n1": "Breath through the open vocal folds, as in English hat. The glottal column is the last on the right, the furthest back a sound can be made. Hindi and Gujarati ह and હ are usually said with voice, ɦ, and Spanish h is silent."
    examples:
      "হাত": "hand (Bengali)"
      "hat": "hat (English)"
  "ipa-0020":
    native: "l, air round the sides of the tongue (alveolar lateral approximant)"
    notes:
      "n1": "The tongue tip touches the ridge and the air flows round its sides, which is what lateral means. Indian and Spanish l is clear all through the word, without the dark, hollow l at the end of English feel. Its curled-back partner is ɭ."
    examples:
      "साल": "year (Hindi)"
      "libro": "book (Spanish)"
  "ipa-0021":
    native: "w, rounded lips and raised tongue (voiced labial-velar approximant)"
    notes:
      "n1": "The lips round while the back of the tongue rises, so w is made at two places at once and sits among the chart's other symbols, not in a column. Spanish has it in ue and ua, as in bueno, ˈbweno, and Assamese writes it ৱ. Hindi व is usually the softer ʋ."
    examples:
      "win": "win (English)"
      "bueno": "good (Spanish)"
      "দুৱাৰ": "door (Assamese)"
  "ipa-0022":
    native: "y as in yes, written j (voiced palatal approximant)"
    notes:
      "n1": "The IPA uses j for the y of yes, as German and Dutch spell it, never for the j of jam, which is dʒ. It is the approximant of the palatal column: the tongue rises towards the hard palate without touching it. Every language here has it: Hindi य, Telugu య, Spanish i in bien."
    examples:
      "यहाँ": "here (Hindi)"
      "yes": "yes (English)"
  "ipa-0023":
    native: "a rasp at the back of the mouth, as in loch (voiceless velar fricative)"
    notes:
      "n1": "Not ks: x is the rasp of Scottish loch and German Bach, made where k is but without closing. Assamese says স, শ and ষ as x, as in অসম, Assam, and Spanish j is x, as in ajo. Hindi writes it ख़, ख with a dot below, in words from Persian and Arabic; plain ख is kʰ."
    examples:
      "অসম": "Assam (Assamese)"
      "ajo": "garlic (Spanish)"
      "तारीख़": "date (Hindi)"
