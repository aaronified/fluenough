schema: 1
id: "ipa-en-vowels"
kind: "layer"
core: "ipa-vowels"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The vowel chart"
description: "The vowel chart is a map of the mouth: the tongue high to low, front to back, and where two vowels share a dot, spread lips on the left and rounded on the right. All 28 vowels, top row first."
license: "CC0-1.0"
tags: ["beginner", "unreviewed"]
cards:
  "ipa-0094":
    native: "ee as in see (close front unrounded vowel)"
    notes:
      "n1": "The top left corner of the vowel chart: the tongue high and forward, the lips spread. The chart is a side view of the mouth facing left, with the tongue highest at the top, close, and the jaw lowest at the bottom, open. Spanish i and Hindi ई are i, and the long ई is written iː."
    examples:
      "తీపి": "sweet (Telugu)"
      "vivir": "to live (Spanish)"
  "ipa-0095":
    native: "ee with rounded lips (close front rounded vowel)"
    notes:
      "n1": "Say i and round your lips without moving the tongue: French tu, German über. Where two vowels share a dot on the chart, the left one has spread lips and the right one rounded, so y sits just right of i. In the IPA y is always this vowel, never the y of yes, which is j."
  "ipa-0096":
    native: "ee pulled back to the middle (close central unrounded vowel)"
    notes:
      "n1": "A high vowel in the middle of the mouth, between i and ɯ: Russian ы, as in ты, you. The bar through the i marks it as central."
  "ipa-0097":
    native: "oo pushed forward to the middle (close central rounded vowel)"
    notes:
      "n1": "The rounded partner of ɨ: a u said with the tongue further forward. Many Australians and younger speakers in southern England say the oo of goose close to it. The bar through the u marks it as central."
  "ipa-0098":
    native: "oo with spread lips (close back unrounded vowel)"
    notes:
      "n1": "The tongue as for u, but with the lips spread. Its letter is a turned m. Korean ㅡ is ɯ, and Japanese u lies between ɯ and u."
  "ipa-0099":
    native: "oo as in food (close back rounded vowel)"
    notes:
      "n1": "The top right corner: the tongue high and back, the lips rounded. Spanish u and Hindi ऊ are u, and the long ऊ is written uː. English food is close, though many English speakers say it further forward."
    examples:
      "आलू": "potato (Hindi)"
      "uno": "one (Spanish)"
  "ipa-0100":
    native: "i as in sit (near-close near-front unrounded vowel)"
    notes:
      "n1": "A little lower and more central than i: the vowel of English sit, against seat with i. Its letter is a small capital I; here, and in ʏ, the small capital means a little lower and more central. Hindi short इ is usually ɪ, as in दिन, day."
    examples:
      "दिन": "day (Hindi)"
      "sit": "sit (English)"
  "ipa-0101":
    native: "i as in sit with rounded lips (near-close near-front rounded vowel)"
    notes:
      "n1": "ɪ with rounded lips, written as a small capital Y: German fünf, five. It sits just right of ɪ on the chart."
  "ipa-0102":
    native: "u as in book (near-close near-back rounded vowel)"
    notes:
      "n1": "A little lower and more central than u: the vowel of English book and put. Hindi short उ is usually ʊ, as in सुबह, morning. Its letter is the Latin upsilon, shaped like a horseshoe."
    examples:
      "सुबह": "morning (Hindi)"
      "book": "book (English)"
  "ipa-0103":
    native: "e as in café (close-mid front unrounded vowel)"
    notes:
      "n1": "A front vowel between i and the open a, with spread lips: Spanish e, as in mesa, and Hindi ए. English has it mostly as the start of the glide eɪ, in day. The close-mid row is the second from the top."
    examples:
      "mesa": "table (Spanish)"
      "एक": "one (Hindi)"
  "ipa-0104":
    native: "e with rounded lips (close-mid front rounded vowel)"
    notes:
      "n1": "e said with rounded lips: French peu, German schön. Its letter is the slashed o of Danish and Norwegian, where it is a letter of the alphabet."
  "ipa-0105":
    native: "e pulled back to the middle (close-mid central unrounded vowel)"
    notes:
      "n1": "A vowel in the middle of the mouth, a little higher than ə, between e and ɤ. Its letter is e reversed, flipped left to right. Few languages have it as a vowel of its own."
  "ipa-0106":
    native: "o pushed forward to the middle (close-mid central rounded vowel)"
    notes:
      "n1": "The rounded partner of ɘ: an o said with the tongue further forward, as in Swedish full. Its letter is a barred o."
  "ipa-0107":
    native: "o with spread lips (close-mid back unrounded vowel)"
    notes:
      "n1": "The tongue as for o, but with the lips spread: Mandarin e, as in è, hungry, is close to it. Its letter is the ram's horns, which sits on the line; the gamma ɣ hangs below it."
  "ipa-0108":
    native: "o as in Spanish no (close-mid back rounded vowel)"
    notes:
      "n1": "The back, rounded partner of e: Spanish o and Hindi ओ, a pure vowel with no glide. English go glides away from it, oʊ in American speech and əʊ in British."
    examples:
      "noche": "night (Spanish)"
      "दो": "two (Hindi)"
  "ipa-0109":
    native: "the a of about, weak and central (mid central vowel, schwa)"
    notes:
      "n1": "The vowel in the very middle of the chart, with the tongue at rest: the a of English about. Its name is schwa and its letter is a turned e. Hindi, Marathi and Gujarati अ is ə, as in Hindi कल, while Bengali and Assamese say their অ as ɔ."
    examples:
      "कल": "tomorrow; yesterday (Hindi)"
      "about": "about (English)"
  "ipa-0110":
    native: "e as in bed (open-mid front unrounded vowel)"
    notes:
      "n1": "Lower than e, the jaw a little more open: English bed, and Hindi ऐ, as in है, is. Its letter is the Greek epsilon. Gujarati and Assamese have both e and ɛ, and tell words apart by them."
    examples:
      "है": "is (Hindi)"
      "bed": "bed (English)"
  "ipa-0111":
    native: "e as in bed with rounded lips (open-mid front rounded vowel)"
    notes:
      "n1": "ɛ said with rounded lips: French sœur, sister, German Hölle. Its letter is the o-e ligature."
  "ipa-0112":
    native: "the vowel of British bird (open-mid central unrounded vowel)"
    notes:
      "n1": "A central vowel a little lower than ə: British English bird and nurse, written ɜː. American English colours it with r, ɝ. Its letter is a reversed epsilon."
  "ipa-0113":
    native: "the vowel of British bird with rounded lips (open-mid central rounded vowel)"
    notes:
      "n1": "ɜ with rounded lips, one of the rarest vowels on the chart. Its letter is a reversed epsilon closed into a loop."
  "ipa-0114":
    native: "u as in cup (open-mid back unrounded vowel)"
    notes:
      "n1": "On the chart an open-mid back vowel with spread lips; English dictionaries use it for the vowel of cup and love, though most speakers now say it more centrally. Its letter is a turned v."
    examples:
      "cup": "cup (English)"
  "ipa-0115":
    native: "aw as in law (open-mid back rounded vowel)"
    notes:
      "n1": "A rounded back vowel, lower than o: Bengali and Assamese অ, as in Bengali দশ, ten, and Hindi औ in standard speech, as in और. Its letter is the open o, a c facing the other way."
    examples:
      "দশ": "ten (Bengali)"
      "और": "and; more (Hindi)"
  "ipa-0116":
    native: "a as in cat (near-open front unrounded vowel)"
    notes:
      "n1": "Between ɛ and a, with the jaw nearly open: the vowel of English cat. Bengali says its এ as æ in many words, as in এক, one, and writes æ as ্যা in words such as হ্যাঁ, yes. Its letter, ash, joins a and e."
    examples:
      "এক": "one (Bengali)"
      "cat": "cat (English)"
  "ipa-0117":
    native: "a short, central a (near-open central vowel)"
    notes:
      "n1": "A central vowel just above fully open: Portuguese cama, bed, and the vowel many British speakers really say in cup. Its letter is a turned a."
  "ipa-0118":
    native: "a as in Spanish casa (open front unrounded vowel)"
    notes:
      "n1": "The bottom left corner of the chart, though a is used for any open a in the middle of the mouth too: Spanish casa, Hindi आ, written aː, Telugu అ and ఆ. English has it as the start of the glides in my, aɪ, and now, aʊ."
    examples:
      "casa": "house (Spanish)"
      "ఆరు": "six (Telugu)"
  "ipa-0119":
    native: "a with rounded lips (open front rounded vowel)"
    notes:
      "n1": "The rounded partner of a, and one of the rarest vowels on the chart: it is there to complete the pattern of pairs. Its letter is a small capital OE ligature."
  "ipa-0120":
    native: "a far back, as in father (open back unrounded vowel)"
    notes:
      "n1": "The bottom right corner: an open a with the tongue pulled back, as in English father and spa. Its letter is the round-backed alpha, not the a with a hook of most typefaces. Some transcriptions of Hindi write आ as ɑː."
    examples:
      "spa": "spa (English)"
  "ipa-0121":
    native: "o as in British hot (open back rounded vowel)"
    notes:
      "n1": "ɑ with rounded lips: the vowel of British English hot and dog, where American English says ɑ. Its letter is a turned alpha. Many Assamese speakers say অ close to it."
