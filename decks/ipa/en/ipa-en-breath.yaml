schema: 1
id: "ipa-en-breath"
kind: "layer"
core: "ipa-breath"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "A puff of breath and a breathy voice"
description: "ʰ and ʱ, which give Indian languages four stops at each place, as in p pʰ b bʱ; then the affricates, a stop that slides into a hiss."
license: "CC0-1.0"
tags: ["beginner", "unreviewed"]
cards:
  "ipa-0038":
    native: "a small raised h: a puff of breath after (aspirated)"
    notes:
      "n1": "A small raised h changes the letter before it: kʰ is k followed by a puff of breath, as in Hindi ख. Hold a hand before your mouth: English pin has a puff and spin has none, but English never tells words apart by it. Hindi, Bengali and the other Indian languages do, so kʰ and k are different sounds, as in खिड़की, window, against कमरा, room."
    examples:
      "खिड़की": "window (Hindi)"
  "ipa-0039":
    native: "a small raised hooked h: a murmured, breathy voice (breathy voice)"
    notes:
      "n1": "A small raised h with a hook, the letter ɦ in miniature, gives the sound before it a breathy, murmured voice: bʱ is b said while letting out breath, as in Bengali ভাত, rice. With ʰ and ʱ, Indian languages have four stops at each place, as in प फ ब भ: p, pʰ, b and bʱ. The official chart writes breathy voice with two dots below, b̤, but many transcriptions of Indian languages use ʱ."
    examples:
      "ভাত": "cooked rice (Bengali)"
  "ipa-0040":
    native: "p with a puff of breath (aspirated voiceless bilabial plosive)"
    notes:
      "n1": "p followed by a puff of breath, like a firmly said English pin. Hindi फ, Bengali and Assamese ফ and Telugu ఫ are pʰ, though many speakers say it close to f in some words. With p, b and bʱ it makes the four bilabial stops of Indian languages."
    examples:
      "চাফা": "clean (Assamese)"
  "ipa-0041":
    native: "b with a breathy voice (breathy-voiced bilabial plosive)"
    notes:
      "n1": "b said with a murmur of breath, as in Hindi भाई, brother. English has nothing like it, and English speakers tend to hear plain b; try saying b while sighing. It is the fourth of the series p, pʰ, b, bʱ."
    examples:
      "भाई": "brother (Hindi)"
      "ভাত": "cooked rice (Assamese)"
  "ipa-0042":
    native: "t on the teeth with a puff of breath (aspirated voiceless dental plosive)"
    notes:
      "n1": "t̪ followed by a puff of breath: Hindi थ, Bengali থ, Telugu థ. It is not the th of English thin, which is the fricative θ. Romanisations write th for both, but the IPA keeps them apart."
    examples:
      "পথ": "way; path (Bengali)"
      "के साथ": "with (Hindi)"
  "ipa-0043":
    native: "d on the teeth with a breathy voice (breathy-voiced dental plosive)"
    notes:
      "n1": "d̪ said with a murmur of breath: Hindi ध, Bengali ধ, Telugu ధ, as at the end of Hindi दूध, milk. It is not the th of English this, which is ð. Two marks combine here: the bridge below says where the tongue is, and the raised ʱ after says what the voice does."
    examples:
      "दूध": "milk (Hindi)"
      "ధర": "price (Telugu)"
  "ipa-0044":
    native: "t on the ridge with a puff of breath (aspirated voiceless alveolar plosive)"
    notes:
      "n1": "Assamese has a single t, made at the ridge as in English, and gives it a breathy partner: থ is tʰ, as in পথ, way. In a narrow transcription English ten is [tʰɛn], since English t has a puff at the start of a stressed syllable."
    examples:
      "পথ": "way; path (Assamese)"
  "ipa-0045":
    native: "d on the ridge with a breathy voice (breathy-voiced alveolar plosive)"
    notes:
      "n1": "Assamese ধ and ঢ are both dʱ: a d at the ridge said with a murmur of breath, as in ধুনীয়া, beautiful. The other Indian languages here split it into d̪ʱ on the teeth and ɖʱ curled back."
    examples:
      "ধুনীয়া": "beautiful (Assamese)"
  "ipa-0046":
    native: "k with a puff of breath (aspirated voiceless velar plosive)"
    notes:
      "n1": "k followed by a puff of breath: Hindi ख, Bengali and Assamese খ, Telugu ఖ. Do not confuse it with x, the rasp of Hindi ख़, ख with a dot below. Romanisations write kh for both."
    examples:
      "खाना": "food (Hindi)"
      "খুৰা": "uncle (Assamese)"
  "ipa-0047":
    native: "g with a breathy voice (breathy-voiced velar plosive)"
    notes:
      "n1": "ɡ said with a murmur of breath: Hindi and Marathi घ, Bengali and Assamese ঘ, as in घर, house. Romanisations write gh, but it is one sound, not g followed by h."
    examples:
      "घर": "home; house (Hindi)"
      "घरी": "at home (Marathi)"
      "ঘৰ": "house; home (Assamese)"
  "ipa-0048":
    native: "ch as in church (voiceless postalveolar affricate)"
    notes:
      "n1": "An affricate is a stop that slides into a hiss as one sound: tʃ is t released into ʃ, the ch of English church. It is Hindi च, Bengali চ, Telugu చ and Spanish ch, as in leche. It takes two letters, and a tie bar, t͡ʃ, can join them to show that they are one sound."
    examples:
      "चाय": "tea (Hindi)"
      "leche": "milk (Spanish)"
  "ipa-0049":
    native: "ch with a puff of breath (aspirated voiceless postalveolar affricate)"
    notes:
      "n1": "tʃ followed by a puff of breath: Hindi छ, Bengali ছ, as in Hindi छह, six. Romanisations often write it chh. Assamese says its ছ as plain s."
    examples:
      "छह": "six (Hindi)"
      "मछली": "fish (Hindi)"
  "ipa-0050":
    native: "j as in jam (voiced postalveolar affricate)"
    notes:
      "n1": "d released into ʒ, the j of English jam: Hindi ज, Bengali জ, Telugu జ. It is the sound English speakers expect from the letter j, which the IPA keeps for the y of yes. Assamese says its জ as z."
    examples:
      "आज": "today (Hindi)"
      "জল": "water (Bengali)"
      "jam": "jam (English)"
  "ipa-0051":
    native: "j with a breathy voice (breathy-voiced postalveolar affricate)"
    notes:
      "n1": "dʒ said with a murmur of breath: Hindi झ, Bengali ঝ, Telugu ఝ, as in Bengali ঝাল, spicy. Romanisations write it jh, but it is one sound."
    examples:
      "ঝাল": "spicy (Bengali)"
  "ipa-0052":
    native: "ts as in cats (voiceless alveolar affricate)"
    notes:
      "n1": "t released into s as one sound, like the ts of English cats or German Zeit. Marathi says च this way before a, o and u in most native words: चार, four, and चहा, tea, begin with ts. Many Telugu speakers do the same in words such as చాలా, very."
    examples:
      "चार": "four (Marathi)"
      "चहा": "tea (Marathi)"
  "ipa-0053":
    native: "dz as in adze (voiced alveolar affricate)"
    notes:
      "n1": "d released into z as one sound, the voiced partner of ts. Marathi says ज this way before a, o and u in most native words, as in जवळ, near. The two letters look like d followed by z; only a tie bar, d͡z, or knowing the language shows they are one sound."
    examples:
      "जवळ": "near (Marathi)"
  "ipa-0054":
    native: "a tie bar: two letters said as one sound"
    notes:
      "n1": "The arch joins two letters into one sound: t͡ʃ is the single sound of church, not t followed by ʃ. The chart also uses it for a sound made at two places at once, such as the k͡p of Yoruba and other West African languages. Broad transcriptions, like this app's, usually leave it out and write tʃ."
