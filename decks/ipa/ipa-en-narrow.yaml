schema: 1
id: ipa-en-narrow
name: "Fine detail in square brackets"
kind: vocab
language: { code: ipa, iso639_3: zxx, name: IPA, script: ipa, typed: false, icon: "ə" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
source: "Arranged after the IPA chart, 2020 revision, of the International Phonetic Association (https://www.internationalphoneticassociation.org/content/ipa-chart), and the Handbook of the International Phonetic Association (1999)"
description: "The rest of the chart's diacritics, for narrow transcription: voice quality, release, the tongue's position and root, and which part of the tongue does the work. Each is shown on a typical letter."
tags: [advanced, unreviewed]
cards:
  - id: ipa-0162
    target: "a̰"
    native: "a tilde below: a creaky, croaking voice (creaky voiced)"
    notes: "A tilde below a letter, shown here on a, gives it a creaky voice, like the low croak at the end of a tired sentence. Some languages of Mexico and South-East Asia tell creaky vowels from plain ones. It is the partner of the two dots below for breathy voice."
    modes: [recognition, production]
  - id: ipa-0163
    target: "dⁿ"
    native: "a small raised n: released through the nose (nasal release)"
    notes: "A small raised n after a stop, shown here on d, means it is released by lowering the soft palate, so the air bursts out through the nose and not the mouth. English sudden has it: the d opens straight into the n, [ˈsʌdⁿn̩]."
    modes: [recognition, production]
  - id: ipa-0164
    target: "dˡ"
    native: "a small raised l: released at the sides of the tongue (lateral release)"
    notes: "A small raised l after a stop, shown here on d, means it is released by dropping the sides of the tongue, as for l, while the tip stays where it is. English middle has it: the d opens straight into the l."
    modes: [recognition, production]
  - id: ipa-0165
    target: "tˠ"
    native: "a small raised gamma: the back of the tongue raised (velarised)"
    notes: "A small raised ɣ after a letter, shown here on t, means the back of the tongue rises towards the soft palate during the sound, darkening it. The hard consonants of Russian and the broad ones of Irish are often described this way. The tilde through a letter, as in ɫ, can say the same in one mark."
    modes: [recognition, production]
  - id: ipa-0166
    target: "tˤ"
    native: "a small raised ʕ: the throat narrowed (pharyngealised)"
    notes: "A small raised ʕ after a letter, shown here on t, means the root of the tongue is pulled back into the throat during the sound. The emphatic consonants of Arabic, such as ط, are described this way."
    modes: [recognition, production]
  - id: ipa-0167
    target: "ɔ̹"
    native: "a right half-ring below: lips more rounded (more rounded)"
    notes: "The right half of a small ring below a vowel, shown here on ɔ, says the lips are more rounded than usual for that letter. Its mirror image, the left half-ring, says less rounded."
    modes: [recognition, production]
  - id: ipa-0168
    target: "ɔ̜"
    native: "a left half-ring below: lips less rounded (less rounded)"
    notes: "The left half of a small ring below a vowel, shown here on ɔ, says the lips are less rounded than usual for that letter. Its mirror image, the right half-ring, says more rounded."
    modes: [recognition, production]
  - id: ipa-0169
    target: "u̟"
    native: "a plus below: a little further forward (advanced)"
    notes: "A small plus below a letter, shown here on u, moves the sound a little towards the front of the mouth: u̟ is an oo with the tongue further forward, as many English speakers say the vowel of goose. Its opposite is the minus below, for a sound made a little further back."
    modes: [recognition, production]
  - id: ipa-0170
    target: "e̠"
    native: "a minus below: a little further back (retracted)"
    notes: "A short line below a letter, shown here on e, moves the sound a little towards the back of the mouth. On a consonant it marks a place just behind the usual one: s̠ is an s made a little further back."
    modes: [recognition, production]
  - id: ipa-0171
    target: "ë"
    native: "two dots above: towards the centre (centralised)"
    notes: "Two dots above a vowel, shown here on e, move it towards the centre of the vowel chart, where ə is. Unstressed vowels are often written this way in narrow transcription."
    modes: [recognition, production]
  - id: ipa-0172
    target: "e̽"
    native: "a small cross above: halfway to the centre (mid-centralised)"
    notes: "A small cross above a vowel, shown here on e, moves it halfway from where the letter is towards ə in the centre of the chart, less far than the two dots above. It suits a vowel that is weakened, but not all the way to ə."
    modes: [recognition, production]
  - id: ipa-0173
    target: "t̼"
    native: "a seagull below: the tongue against the upper lip (linguolabial)"
    notes: "The mark below, shaped like a flying seagull, means the tongue tip touches the upper lip instead of the teeth or the ridge: t̼ is a t made with tongue and lip. It is rare, found in a few languages of Vanuatu."
    modes: [recognition, production]
  - id: ipa-0174
    target: "e̝"
    native: "an up tack below: a little higher (raised)"
    notes: "A small up tack below a letter, shown here on e, raises the tongue a little: e̝ lies between e and i. On a consonant it narrows the gap, so an approximant becomes a fricative: Czech ř is often written r̝."
    modes: [recognition, production]
  - id: ipa-0175
    target: "e̞"
    native: "a down tack below: a little lower (lowered)"
    notes: "A small down tack below a letter, shown here on e, lowers the tongue a little: e̞ is a true mid e, between e and ɛ, as Spanish e is often described. On a fricative it widens the gap into an approximant: β̞ is the gliding b of Spanish beber."
    modes: [recognition, production]
  - id: ipa-0176
    target: "e̘"
    native: "a left tack below: the tongue root forward (advanced tongue root)"
    notes: "A small left tack below a vowel, shown here on e, means the root of the tongue is pushed forward, widening the throat. Many languages of West Africa, such as Akan and Igbo, sort their vowels into two sets by the tongue root, and a word takes its vowels from one set."
    modes: [recognition, production]
  - id: ipa-0177
    target: "e̙"
    native: "a right tack below: the tongue root back (retracted tongue root)"
    notes: "A small right tack below a vowel, shown here on e, means the root of the tongue is pulled back, narrowing the throat. It marks the other set of vowels in languages such as Akan."
    modes: [recognition, production]
  - id: ipa-0178
    target: "t̺"
    native: "an upturned bridge below: made with the tongue tip (apical)"
    notes: "An upside-down bridge below a consonant, shown here on t, means it is made with the very tip of the tongue. The s of Spain is often described as apical, s̺, which gives it a slight sh-like sound."
    modes: [recognition, production]
  - id: ipa-0179
    target: "t̻"
    native: "a small square below: made with the tongue blade (laminal)"
    notes: "A small square below a consonant, shown here on t, means it is made with the blade of the tongue, the flat part just behind the tip. With the bridge for dental and the upturned bridge for apical, it lets a transcription say which part of the tongue touches where."
    modes: [recognition, production]
