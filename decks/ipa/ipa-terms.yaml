# The terms the IPA course uses, one card each, with an example contrast
# and, where a licence-cleared Wikimedia Commons file fits, its picture.
# A concept card: its target is a term, not a symbol. In its examples, "has
# this sound" marks a word that shows the term and "does not" one that does
# not, as the card's translations say. A term with no cleared picture has none.
schema: 1
id: "ipa-terms"
part: "core"
kind: "vocab"
language: { code: "ipa", iso639_3: "zxx", name: "IPA", script: "ipa", typed: false, icon: "ə" }
license: "CC-BY-SA-4.0"
source: "Handbook of the International Phonetic Association (Cambridge University Press, 1999); the IPA chart, 2020 revision (https://www.internationalphoneticassociation.org/content/ipa-chart); English Wikipedia, the page of each term; Lisker and Abramson, A cross-language study of voicing in initial stops, Word 20(3), 1964"
tags: ["beginner", "unreviewed"]
cards:
  - id: "ipa-0192"
    target: "phoneme"
    tags: ["core"]
    examples:
      - target: "pin"
        language: "en"
        ipa: "pɪn"
      - target: "bin"
        language: "en"
        ipa: "bɪn"
        sounds: false
    modes: ["listening", "speaking"]
    notes:
      - { id: "n1", kind: "note", source: "https://en.wikipedia.org/wiki/Phoneme" }
  - id: "ipa-0193"
    target: "allophone"
    tags: ["core"]
    examples:
      - target: "pin"
        language: "en"
        ipa: "[pʰɪn]"
      - target: "spin"
        language: "en"
        ipa: "[spɪn]"
      - target: "फल"
        language: "hi"
        reading: "phal"
        ipa: "pʰəl"
        sounds: false
    modes: ["listening", "speaking"]
    notes:
      - { id: "n1", kind: "note", source: "https://en.wikipedia.org/wiki/Allophone" }
      - { id: "n2", kind: "note", source: "https://en.wikipedia.org/wiki/Aspiration_(phonetics)" }
    image: "decks/ipa/images/ipa-0193.webp"
    image_credit: { source: "https://commons.wikimedia.org/wiki/File:Phoneme-allophone-determination-chart.svg", license: "public-domain", credit: "AnonMoos, released into the public domain" }
  - id: "ipa-0194"
    target: "minimal pair"
    tags: ["core"]
    examples:
