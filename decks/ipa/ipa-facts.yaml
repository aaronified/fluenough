description: "One true thing about the International Phonetic Alphabet a day, in English, Bengali and Hindi. Not yet checked by a phonetician, or by a speaker of Bengali or Hindi: please report any mistake."
facts:
  - id: ipa-fact-001
    tags: [history]
    source: "https://en.wikipedia.org/wiki/International_Phonetic_Association"
    text:
      en: "The International Phonetic Association was founded in Paris in 1886 by a group of language teachers led by the French linguist Paul Passy. It was first called the Phonetic Teachers' Association."
      bn: "আন্তর্জাতিক ধ্বনিতাত্ত্বিক সমিতি (International Phonetic Association) ১৮৮৬ সালে প্যারিসে প্রতিষ্ঠা করেন একদল ভাষা-শিক্ষক, ফরাসি ভাষাবিদ পল পাসির নেতৃত্বে। শুরুতে এর নাম ছিল 'ধ্বনিতত্ত্ব-শিক্ষকদের সমিতি' (Phonetic Teachers' Association)।"
      hi: "अंतरराष्ट्रीय ध्वन्यात्मक संघ (International Phonetic Association) की स्थापना 1886 में पेरिस में भाषा-शिक्षकों के एक समूह ने की, जिसके अगुआ फ़्रांसीसी भाषाविद पॉल पासी थे। शुरू में इसका नाम 'ध्वनि-शिक्षकों का संघ' (Phonetic Teachers' Association) था।"
  - id: ipa-fact-002
    tags: [history]
    source: "https://en.wikipedia.org/wiki/History_of_the_International_Phonetic_Alphabet"
    text:
      en: "The first version of the International Phonetic Alphabet was published in 1888. Its aim was one letter for each sound, used the same way in every language."
      bn: "আন্তর্জাতিক ধ্বনিমূলক বর্ণমালার (IPA) প্রথম সংস্করণ প্রকাশিত হয় ১৮৮৮ সালে। লক্ষ্য ছিল প্রতিটি ধ্বনির জন্য একটি অক্ষর, যা সব ভাষায় একইভাবে ব্যবহৃত হবে।"
      hi: "अंतरराष्ट्रीय ध्वन्यात्मक वर्णमाला (IPA) का पहला संस्करण 1888 में प्रकाशित हुआ। लक्ष्य था हर ध्वनि के लिए एक अक्षर, जो हर भाषा में एक ही तरह इस्तेमाल हो।"
  - id: ipa-fact-003
    tags: [history]
    source: "https://en.wikipedia.org/wiki/International_Phonetic_Association"
    text:
      en: "The IPA began as a tool for teaching: its founders wanted schoolchildren to learn how foreign languages are really pronounced, not just how they are spelled."
      bn: "IPA-র শুরু শিক্ষার হাতিয়ার হিসেবে: এর প্রতিষ্ঠাতারা চাইতেন, স্কুলের ছেলেমেয়েরা বিদেশি ভাষার শুধু বানান নয়, আসল উচ্চারণও শিখুক।"
      hi: "IPA की शुरुआत पढ़ाने के एक साधन के रूप में हुई: इसके संस्थापक चाहते थे कि स्कूली बच्चे विदेशी भाषाओं की सिर्फ़ वर्तनी नहीं, उनका असली उच्चारण भी सीखें।"
  - id: ipa-fact-004
    tags: [history]
    source: "https://en.wikipedia.org/wiki/History_of_the_International_Phonetic_Alphabet"
    text:
      en: "It was the Danish linguist Otto Jespersen who suggested to Paul Passy the idea of a single phonetic alphabet for all languages."
      bn: "সব ভাষার জন্য একটিই ধ্বনিমূলক বর্ণমালার ধারণাটি পল পাসিকে দিয়েছিলেন ডেনিশ ভাষাবিদ অটো ইয়েসপারসেন।"
      hi: "सभी भाषाओं के लिए एक ही ध्वन्यात्मक वर्णमाला का विचार पॉल पासी को डेनिश भाषाविद ओटो येस्पर्सन ने सुझाया था।"
  - id: ipa-fact-005
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Romic_alphabet"
    text:
      en: "The IPA grew out of the Romic alphabet of the English phonetician Henry Sweet, which itself built on the Phonotypic Alphabet of Isaac Pitman and Alexander John Ellis."
      bn: "IPA গড়ে উঠেছে ইংরেজ ধ্বনিতাত্ত্বিক হেনরি সুইটের রোমিক বর্ণমালা থেকে, আর সেটির ভিত্তি ছিল আইজ্যাক পিটম্যান ও আলেকজান্ডার জন এলিসের ফোনোটাইপিক বর্ণমালা।"
      hi: "IPA अंग्रेज़ ध्वनिविज्ञानी हेनरी स्वीट की रोमिक वर्णमाला से निकली, जो ख़ुद आइज़ैक पिटमैन और अलेक्ज़ेंडर जॉन एलिस की फ़ोनोटाइपिक वर्णमाला पर आधारित थी।"
  - id: ipa-fact-006
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Journal_of_the_International_Phonetic_Association"
    text:
      en: "For decades the association's journal, Le Maître Phonétique, was printed in phonetic transcription instead of ordinary spelling. In 1971 it was replaced by the Journal of the International Phonetic Association."
      bn: "কয়েক দশক ধরে সমিতির পত্রিকা Le Maître Phonétique সাধারণ বানানে নয়, ধ্বনিমূলক লিপিতে ছাপা হতো। ১৯৭১ সালে তার জায়গা নেয় Journal of the International Phonetic Association।"
      hi: "दशकों तक संघ की पत्रिका Le Maître Phonétique साधारण वर्तनी में नहीं, ध्वन्यात्मक लिपि में छपती थी। 1971 में उसकी जगह Journal of the International Phonetic Association ने ली।"
  - id: ipa-fact-007
    tags: [history]
    source: "https://en.wikipedia.org/wiki/History_of_the_International_Phonetic_Alphabet"
    text:
      en: "In 1989 the association held a convention in Kiel, Germany, that revised the alphabet thoroughly. Much of today's chart dates from the Kiel Convention."
      bn: "১৯৮৯ সালে জার্মানির কিল শহরে সমিতির এক সম্মেলনে বর্ণমালাটি আগাগোড়া সংশোধন করা হয়। আজকের চার্টের অনেকটাই সেই কিল সম্মেলনের ফল।"
      hi: "1989 में जर्मनी के कील शहर में संघ के एक सम्मेलन में वर्णमाला को पूरी तरह संशोधित किया गया। आज के चार्ट का बड़ा हिस्सा इसी कील सम्मेलन से आया है।"
  - id: ipa-fact-008
    tags: [history, letters]
    source: "https://en.wikipedia.org/wiki/Click_letter"
    text:
      en: "Today's click letters, ǀ ǃ ǂ ǁ, were adopted at the Kiel Convention in 1989, in place of older click letters such as ʇ and ʖ."
      bn: "আজকের ক্লিক-অক্ষরগুলি, ǀ ǃ ǂ ǁ, গৃহীত হয় ১৯৮৯ সালের কিল সম্মেলনে, ʇ ও ʖ-এর মতো পুরোনো ক্লিক-অক্ষরের জায়গায়।"
      hi: "आज के क्लिक-अक्षर, ǀ ǃ ǂ ǁ, 1989 के कील सम्मेलन में अपनाए गए, ʇ और ʖ जैसे पुराने क्लिक-अक्षरों की जगह।"
  - id: ipa-fact-009
    tags: [history]
    source: "https://www.internationalphoneticassociation.org/content/ipa-chart"
    text:
      en: "Since Kiel the chart has been updated in 1993, 1996, 2005, 2015, 2018 and 2020. The 2020 chart is the current one."
      bn: "কিলের পরে চার্টটি হালনাগাদ হয়েছে ১৯৯৩, ১৯৯৬, ২০০৫, ২০১৫, ২০১৮ ও ২০২০ সালে। ২০২০-এর চার্টটিই এখন চালু।"
      hi: "कील के बाद चार्ट को 1993, 1996, 2005, 2015, 2018 और 2020 में अद्यतन किया गया। 2020 का चार्ट ही अभी चलन में है।"
  - id: ipa-fact-010
    tags: [history, letters]
    source: "https://en.wikipedia.org/wiki/Voiced_labiodental_flap"
    text:
      en: "The newest letter in the IPA is ⱱ, the labiodental flap, added in 2005. The lower lip flicks against the upper teeth, a sound of central African languages such as Mono."
      bn: "IPA-র সবচেয়ে নতুন অক্ষর ⱱ, ২০০৫ সালে যোগ হয়। এতে নিচের ঠোঁট ওপরের দাঁতে ঝটকা দিয়ে লাগে; এটি মোনোর মতো মধ্য আফ্রিকার কিছু ভাষার ধ্বনি।"
      hi: "IPA का सबसे नया अक्षर ⱱ है, जो 2005 में जोड़ा गया। इसमें निचला होंठ ऊपर के दाँतों से झटके से टकराता है; यह मोनो जैसी मध्य अफ़्रीका की भाषाओं की ध्वनि है।"
  - id: ipa-fact-011
    tags: [history, letters]
    source: "https://en.wikipedia.org/wiki/Implosive_consonant"
    text:
      en: "In 1993 the IPA withdrew its separate letters for voiceless implosives, such as ƥ and ƭ. They are now written with the voiced letter and the ring below for voiceless, as in ɓ̥."
      bn: "১৯৯৩ সালে IPA অঘোষ ইমপ্লোসিভের (বাতাস ভেতরে টেনে বলা ধ্বনির) আলাদা অক্ষরগুলো, যেমন ƥ ও ƭ, তুলে দেয়। এখন সেগুলো লেখা হয় ঘোষ অক্ষরের নিচে অঘোষের ছোট বৃত্ত বসিয়ে, যেমন ɓ̥।"
      hi: "1993 में IPA ने अघोष अंतःस्फोटी ध्वनियों (हवा अंदर खींचकर बोली जाने वाली) के अलग अक्षर, जैसे ƥ और ƭ, हटा दिए। अब इन्हें सघोष अक्षर के नीचे अघोष का छोटा वृत्त लगाकर लिखा जाता है, जैसे ɓ̥।"
  - id: ipa-fact-012
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Handbook_of_the_International_Phonetic_Association"
    text:
      en: "The Handbook of the International Phonetic Association, published by Cambridge University Press in 1999, is the association's own guide to using the alphabet."
      bn: "১৯৯৯ সালে কেমব্রিজ ইউনিভার্সিটি প্রেস থেকে প্রকাশিত Handbook of the International Phonetic Association বইটি বর্ণমালাটি ব্যবহারের জন্য সমিতির নিজস্ব নির্দেশিকা।"
      hi: "1999 में कैम्ब्रिज यूनिवर्सिटी प्रेस से प्रकाशित Handbook of the International Phonetic Association वर्णमाला के इस्तेमाल पर संघ की अपनी मार्गदर्शिका है।"
  - id: ipa-fact-013
    tags: [history]
    source: "https://en.wikipedia.org/wiki/The_North_Wind_and_the_Sun"
    text:
      en: "The association's journal describes the sounds of one language at a time in its Illustrations of the IPA, and each traditionally includes Aesop's fable The North Wind and the Sun, transcribed in that language."
      bn: "সমিতির পত্রিকা Illustrations of the IPA নামে একেকবার একেকটি ভাষার ধ্বনির বর্ণনা ছাপে, আর প্রথা অনুযায়ী প্রতিটিতে থাকে সেই ভাষায় ঈশপের গল্প 'উত্তুরে হাওয়া আর সূর্য', ধ্বনিমূলক লিপিতে লেখা।"
      hi: "संघ की पत्रिका Illustrations of the IPA नाम से एक-एक भाषा की ध्वनियों का विवरण छापती है, और परंपरा से हर विवरण में उस भाषा में ईसप की कहानी 'उत्तरी हवा और सूरज' ध्वन्यात्मक लिपि में दी जाती है।"
  - id: ipa-fact-014
    tags: [licence]
    source: "https://www.internationalphoneticassociation.org/content/ipa-chart"
    text:
      en: "The IPA chart is published under a Creative Commons licence, CC BY-SA 3.0: anyone may copy and adapt it, as long as they credit the association and share their version under the same licence."
      bn: "IPA চার্ট প্রকাশিত হয় ক্রিয়েটিভ কমন্স লাইসেন্স CC BY-SA 3.0-তে: যে কেউ এটি নকল করতে ও বদলাতে পারেন, যদি সমিতির নাম উল্লেখ করেন এবং নিজের সংস্করণও একই লাইসেন্সে দেন।"
      hi: "IPA चार्ट क्रिएटिव कॉमन्स लाइसेंस CC BY-SA 3.0 के तहत प्रकाशित है: कोई भी इसकी नक़ल कर सकता है और इसे बदल सकता है, बशर्ते वह संघ का नाम दे और अपना संस्करण भी इसी लाइसेंस के तहत साझा करे।"
  - id: ipa-fact-015
    tags: [letters]
    source: "https://en.wikipedia.org/wiki/Voiced_palatal_approximant"
    text:
      en: "The IPA writes the y sound of yes with j, as German, Dutch and the Scandinavian languages spell it. The j of English jam is written dʒ."
      bn: "IPA ইংরেজি yes-এর y ধ্বনিটি লেখে j দিয়ে, জার্মান, ডাচ ও স্ক্যান্ডিনেভীয় ভাষাগুলোর বানানের মতো। ইংরেজি jam-এর j লেখা হয় dʒ।"
      hi: "IPA अंग्रेज़ी yes की y ध्वनि को j से लिखती है, जैसे जर्मन, डच और स्कैंडिनेवियाई भाषाएँ लिखती हैं। अंग्रेज़ी jam का j, dʒ लिखा जाता है।"
  - id: ipa-fact-016
    tags: [letters]
    source: "https://en.wikipedia.org/wiki/International_Phonetic_Alphabet"
    text:
      en: "Each IPA symbol is meant to stand for one sound. English spelling writes the single sound ʃ as sh in ship, ti in nation and s in sugar; the IPA always writes ʃ."
      bn: "প্রতিটি IPA চিহ্ন একটিই ধ্বনি বোঝায়। ইংরেজি বানানে একই ʃ ধ্বনি ship-এ sh, nation-এ ti আর sugar-এ s; IPA সবসময় লেখে ʃ।"
      hi: "हर IPA चिह्न एक ही ध्वनि के लिए है। अंग्रेज़ी वर्तनी एक ही ध्वनि ʃ को ship में sh, nation में ti और sugar में s लिखती है; IPA हमेशा ʃ लिखती है।"
  - id: ipa-fact-017
    tags: [letters]
    source: "https://en.wikipedia.org/wiki/International_Phonetic_Alphabet"
    text:
      en: "IPA letters come mostly from the Latin alphabet, with a few taken from Greek, such as θ (theta), β (beta) and χ (chi)."
      bn: "IPA-র অক্ষরগুলির বেশিরভাগই লাতিন বর্ণমালা থেকে; কয়েকটি এসেছে গ্রিক থেকে, যেমন θ (থিটা), β (বিটা) ও χ (কাই)।"
      hi: "IPA के अक्षर ज़्यादातर लैटिन वर्णमाला से हैं; कुछ यूनानी से लिए गए हैं, जैसे θ (थीटा), β (बीटा) और χ (काई)।"
  - id: ipa-fact-018
    tags: [letters]
    source: "https://en.wikipedia.org/wiki/International_Phonetic_Alphabet"
    text:
      en: "Many IPA letters are ordinary letters turned upside down: ə is a turned e, ɐ a turned a, ɹ a turned r and ʌ a turned v. Printers could make them from type they already had."
      bn: "অনেক IPA অক্ষর আসলে সাধারণ অক্ষর উল্টে বসানো: ə উল্টো e, ɐ উল্টো a, ɹ উল্টো r আর ʌ উল্টো v। ছাপাখানাগুলো নিজেদের কাছে থাকা টাইপ দিয়েই এগুলো ছাপতে পারত।"
      hi: "कई IPA अक्षर साधारण अक्षरों को उलटकर बने हैं: ə उलटा e है, ɐ उलटा a, ɹ उलटा r और ʌ उलटा v। छापेख़ाने इन्हें अपने पास पहले से मौजूद टाइप से ही छाप सकते थे।"
  - id: ipa-fact-019
    tags: [letters]
    source: "https://en.wikipedia.org/wiki/Schwa"
    text:
      en: "The name of ə, schwa, comes from Hebrew, where shva is the name of a vowel sign."
      bn: "ə-এর নাম 'শোয়া' (schwa) এসেছে হিব্রু থেকে, যেখানে 'শ্ভা' একটি স্বরচিহ্নের নাম।"
      hi: "ə का नाम 'श्वा' (schwa) हिब्रू से आया है, जहाँ 'श्वा' एक स्वर-चिह्न का नाम है।"
  - id: ipa-fact-020
    tags: [letters, pronunciation]
    source: "https://en.wikipedia.org/wiki/Retroflex_consonant"
    text:
      en: "All the retroflex letters, for sounds made with the tongue curled back, share one mark: a hook below turning right, as in ʈ ɖ ɳ ʂ ɭ. Retroflex sounds are a hallmark of the languages of South Asia."
      bn: "জিভ পেছনে বাঁকিয়ে বলা মূর্ধন্য ধ্বনির সব অক্ষরে একই চিহ্ন: নিচে ডানদিকে বাঁকা একটি হুক, যেমন ʈ ɖ ɳ ʂ ɭ। মূর্ধন্য ধ্বনি দক্ষিণ এশিয়ার ভাষাগুলির এক বিশেষ বৈশিষ্ট্য।"
      hi: "जीभ पीछे मोड़कर बोली जाने वाली मूर्धन्य ध्वनियों के सभी अक्षरों में एक ही चिह्न है: नीचे दाईं ओर मुड़ा एक हुक, जैसे ʈ ɖ ɳ ʂ ɭ। मूर्धन्य ध्वनियाँ दक्षिण एशिया की भाषाओं की एक ख़ास पहचान हैं।"
  - id: ipa-fact-021
    tags: [letters, pronunciation]
    source: "https://en.wikipedia.org/wiki/Implosive_consonant"
    text:
      en: "Implosives, said by drawing air inwards, all have a hook on top: ɓ ɗ ʄ ɠ ʛ. Sindhi, spoken in Pakistan and India, has four of them."
      bn: "বাতাস ভেতরে টেনে বলা ইমপ্লোসিভ ধ্বনির সব অক্ষরের মাথায় হুক থাকে: ɓ ɗ ʄ ɠ ʛ। পাকিস্তান ও ভারতে প্রচলিত সিন্ধি ভাষায় এর চারটি আছে।"
      hi: "हवा अंदर खींचकर बोली जाने वाली अंतःस्फोटी ध्वनियों के सभी अक्षरों के ऊपर हुक होता है: ɓ ɗ ʄ ɠ ʛ। पाकिस्तान और भारत में बोली जाने वाली सिंधी में इनमें से चार हैं।"
  - id: ipa-fact-022
    tags: [pronunciation]
    source: "https://en.wikipedia.org/wiki/Click_consonant"
    text:
      en: "Zulu and Xhosa use clicks as ordinary consonants and spell them with c, q and x. The name Xhosa itself begins with a click."
      bn: "জুলু ও খোসা ভাষায় ক্লিক সাধারণ ব্যঞ্জনের মতোই ব্যবহৃত হয়, বানানে লেখা হয় c, q ও x দিয়ে। Xhosa নামটিই একটি ক্লিক দিয়ে শুরু।"
      hi: "ज़ुलू और खोसा भाषाओं में क्लिक साधारण व्यंजनों की तरह इस्तेमाल होते हैं और c, q और x से लिखे जाते हैं। Xhosa नाम ख़ुद एक क्लिक से शुरू होता है।"
  - id: ipa-fact-023
    tags: [history, tone]
    source: "https://en.wikipedia.org/wiki/Tone_letter"
    text:
      en: "The tone letters ˥ ˦ ˧ ˨ ˩ were devised by the Chinese linguist Yuen Ren Chao and published in 1930. They draw the pitch of a syllable beside an upright stick."
      bn: "সুরচিহ্ন ˥ ˦ ˧ ˨ ˩ তৈরি করেন চীনা ভাষাবিদ ইউয়েন রেন চাও, প্রকাশিত হয় ১৯৩০ সালে। একটি খাড়া দণ্ডের পাশে এগুলো সিলেবলের সুরের ওঠানামা এঁকে দেখায়।"
      hi: "सुर-चिह्न ˥ ˦ ˧ ˨ ˩ चीनी भाषाविद युएन रेन चाओ ने बनाए और 1930 में प्रकाशित किए। ये एक खड़ी डंडी के पास सिलेबल के सुर की ऊँचाई खींचकर दिखाते हैं।"
  - id: ipa-fact-024
    tags: [history, vowels]
    source: "https://en.wikipedia.org/wiki/Cardinal_vowels"
    text:
      en: "The IPA's vowel chart is a simplified map of the mouth, based on the cardinal vowels that the British phonetician Daniel Jones devised in the early twentieth century."
      bn: "IPA-র স্বর-চার্টটি মুখের একটি সরল মানচিত্র, যার ভিত্তি বিংশ শতকের গোড়ায় ব্রিটিশ ধ্বনিতাত্ত্বিক ড্যানিয়েল জোন্সের তৈরি 'কার্ডিনাল স্বর'।"
      hi: "IPA का स्वर-चार्ट मुँह का एक सरल नक़्शा है, जो बीसवीं सदी की शुरुआत में ब्रिटिश ध्वनिविज्ञानी डेनियल जोन्स के बनाए 'कार्डिनल स्वरों' पर आधारित है।"
  - id: ipa-fact-025
    tags: [pronunciation]
    source: "https://en.wikipedia.org/wiki/Hindustani_phonology"
    text:
      en: "In the IPA the four kinds of stop of Hindi and Bengali, as in प फ ब भ, are p, pʰ, b and bʱ. English tells only two of them apart, p and b."
      bn: "IPA-তে হিন্দি ও বাংলার চার রকম স্পর্শধ্বনি, যেমন প ফ ব ভ, লেখা হয় p, pʰ, b ও bʱ। ইংরেজিতে এদের মধ্যে কেবল দুটিকে আলাদা করা হয়: p আর b।"
      hi: "IPA में हिंदी और बांग्ला के चार तरह के स्पर्श व्यंजन, जैसे प फ ब भ, p, pʰ, b और bʱ लिखे जाते हैं। अंग्रेज़ी इनमें से सिर्फ़ दो में फ़र्क़ करती है, p और b।"
  - id: ipa-fact-026
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Extensions_to_the_International_Phonetic_Alphabet"
    text:
      en: "The extIPA, the Extensions to the IPA, adds symbols for speech therapists to transcribe disordered speech, such as lisps and stutters. It was first published in 1990."
      bn: "extIPA, অর্থাৎ IPA-র সম্প্রসারণ, স্পিচ থেরাপিস্টদের জন্য নতুন চিহ্ন যোগ করে, যাতে তোতলামি বা লিস্পের মতো অস্বাভাবিক উচ্চারণ লেখা যায়। এটি প্রথম প্রকাশিত হয় ১৯৯০ সালে।"
      hi: "extIPA, यानी IPA के विस्तार, स्पीच थेरेपिस्टों के लिए ऐसे चिह्न जोड़ते हैं जिनसे हकलाने या तुतलाने जैसी असामान्य बोली लिखी जा सके। ये पहली बार 1990 में प्रकाशित हुए।"
  - id: ipa-fact-027
    tags: [unicode]
    source: "https://en.wikipedia.org/wiki/IPA_Extensions"
    text:
      en: "Unicode keeps most of the IPA's own letters in a block of their own, IPA Extensions, from U+0250 to U+02AF. Raised letters such as ʰ are in Spacing Modifier Letters, and marks such as the tilde in Combining Diacritical Marks."
      bn: "ইউনিকোড IPA-র নিজস্ব বেশিরভাগ অক্ষর রাখে আলাদা একটি ব্লকে, IPA Extensions, U+0250 থেকে U+02AF পর্যন্ত। ʰ-এর মতো ওপরে বসা ছোট অক্ষর আছে Spacing Modifier Letters ব্লকে, আর টিল্ডের মতো চিহ্ন Combining Diacritical Marks-এ।"
      hi: "यूनिकोड IPA के ज़्यादातर अपने अक्षरों को एक अलग ब्लॉक IPA Extensions में रखता है, U+0250 से U+02AF तक। ʰ जैसे ऊपर लिखे छोटे अक्षर Spacing Modifier Letters में हैं, और टिल्ड जैसे चिह्न Combining Diacritical Marks में।"
  - id: ipa-fact-028
    tags: [letters, unicode]
    source: "https://en.wikipedia.org/wiki/Voiced_velar_plosive"
    text:
      en: "The IPA's g has an open tail, ɡ, and Unicode gives it a code of its own, U+0261, apart from the ordinary g."
      bn: "IPA-র g-এর লেজ খোলা, ɡ, আর ইউনিকোডে এর নিজস্ব কোড আছে, U+0261, সাধারণ g থেকে আলাদা।"
      hi: "IPA का g खुली पूँछ वाला है, ɡ, और यूनिकोड में इसका अपना अलग कोड है, U+0261, साधारण g से अलग।"
  - id: ipa-fact-029
    tags: [transcription]
    source: "https://en.wikipedia.org/wiki/Phonetic_transcription"
    text:
      en: "Between slashes a transcription is broad, with only the sounds that tell words apart; between square brackets it is narrow, with detail. English pin is /pɪn/, but [pʰɪn]."
      bn: "স্ল্যাশের মধ্যে লেখা প্রতিলিপি স্থূল (broad), তাতে কেবল শব্দ আলাদা করে এমন ধ্বনি থাকে; তৃতীয় বন্ধনীর মধ্যে তা সূক্ষ্ম (narrow), খুঁটিনাটি সহ। ইংরেজি pin হলো /pɪn/, কিন্তু [pʰɪn]।"
      hi: "स्लैश के बीच लिखा लिप्यंतरण स्थूल (broad) होता है, जिसमें सिर्फ़ शब्दों में फ़र्क़ करने वाली ध्वनियाँ होती हैं; बड़े कोष्ठक [ ] में यह सूक्ष्म (narrow) होता है, बारीकियों के साथ। अंग्रेज़ी pin /pɪn/ है, पर [pʰɪn]।"
  - id: ipa-fact-030
    tags: [transcription]
    source: "https://en.wikipedia.org/wiki/Stress_(linguistics)"
    text:
      en: "The IPA marks stress with ˈ before the stressed syllable, not over its vowel as Spanish spelling does: Spanish café is kaˈfe."
      bn: "IPA জোর বোঝায় জোর-পড়া সিলেবলের আগে ˈ বসিয়ে, স্প্যানিশ বানানের মতো স্বরের ওপরে নয়: স্প্যানিশ café হলো kaˈfe।"
      hi: "IPA बलाघात को बल वाले सिलेबल से पहले ˈ लगाकर दिखाती है, स्पेनी वर्तनी की तरह स्वर के ऊपर नहीं: स्पेनी café, kaˈfe है।"
  - id: ipa-fact-031
    tags: [letters]
    source: "https://en.wikipedia.org/wiki/Length_(phonetics)"
    text:
      en: "The IPA length mark ː is not a colon: it is two small triangles pointing at each other. One triangle alone, ˑ, means half-long."
      bn: "IPA-র দৈর্ঘ্যচিহ্ন ː কোলন নয়: এ হলো মুখোমুখি দুটি ছোট ত্রিভুজ। একটি মাত্র ত্রিভুজ, ˑ, মানে আধা-দীর্ঘ।"
      hi: "IPA का दीर्घता-चिह्न ː कोलन नहीं है: यह आमने-सामने के दो छोटे त्रिकोण हैं। अकेला एक त्रिकोण, ˑ, अर्ध-दीर्घ बताता है।"
  - id: ipa-fact-032
    tags: [letters]
    source: "https://en.wikipedia.org/wiki/International_Phonetic_Alphabet"
    text:
      en: "Small capital letters in the IPA mostly stand for sounds made further back than the ordinary letter: ɢ, ɴ and ʀ are made at the uvula, behind ɡ, n and r."
      bn: "IPA-তে ছোট আকারের বড় হাতের অক্ষর (small capital) সাধারণত সাধারণ অক্ষরের চেয়ে মুখের আরও পেছনে তৈরি ধ্বনি বোঝায়: ɢ, ɴ ও ʀ উচ্চারিত হয় আলজিভে, ɡ, n ও r-এর পেছনে।"
      hi: "IPA में छोटे आकार के बड़े अक्षर (small capitals) ज़्यादातर साधारण अक्षर से और पीछे बनने वाली ध्वनियाँ दिखाते हैं: ɢ, ɴ और ʀ अलिजिह्वा पर बनते हैं, ɡ, n और r से पीछे।"
  - id: ipa-fact-033
    tags: [pronunciation]
    source: "https://en.wikipedia.org/wiki/Voiceless_velar_fricative"
    text:
      en: "The IPA letter x is not ks but the rasp of Scottish loch. Assamese says স, শ and ষ with this sound, so অসম, Assam, has it twice."
      bn: "IPA-র x মানে ks নয়, স্কটিশ loch-এর মতো গলার ঘষা ধ্বনি। অসমিয়ায় স, শ ও ষ এই ধ্বনিতে বলা হয়, তাই অসম শব্দে এটি দুবার আছে।"
      hi: "IPA का x, ks नहीं, बल्कि स्कॉटिश loch जैसी गले की रगड़ वाली ध्वनि है। असमिया में স, শ और ষ इसी ध्वनि से बोले जाते हैं, इसलिए অসম (असम) में यह दो बार आती है।"
  - id: ipa-fact-034
    tags: [use]
    source: "https://en.wikipedia.org/wiki/International_Phonetic_Alphabet"
    text:
      en: "Learners' dictionaries of English, such as those from Oxford and Cambridge, give each word's pronunciation in the IPA."
      bn: "অক্সফোর্ড ও কেমব্রিজের মতো ইংরেজি শিক্ষার্থীদের অভিধানে প্রতিটি শব্দের উচ্চারণ IPA-তে দেওয়া থাকে।"
      hi: "ऑक्सफ़ोर्ड और कैम्ब्रिज जैसे अंग्रेज़ी सीखने वालों के शब्दकोश हर शब्द का उच्चारण IPA में देते हैं।"
  - id: ipa-fact-035
    tags: [unicode]
    source: "https://en.wikipedia.org/wiki/SAMPA"
    text:
      en: "SAMPA and X-SAMPA, devised by the phonetician John Wells, write IPA sounds with ordinary keyboard characters: ə, for example, is @."
      bn: "ধ্বনিতাত্ত্বিক জন ওয়েলসের তৈরি SAMPA ও X-SAMPA সাধারণ কিবোর্ডের অক্ষর দিয়ে IPA ধ্বনি লেখে: যেমন ə লেখা হয় @।"
      hi: "ध्वनिविज्ञानी जॉन वेल्स के बनाए SAMPA और X-SAMPA, IPA ध्वनियों को साधारण कीबोर्ड के अक्षरों से लिखते हैं: जैसे ə को @ लिखा जाता है।"
  - id: ipa-fact-036
    tags: [chart]
    source: "https://www.internationalphoneticassociation.org/content/ipa-chart"
    text:
      en: "In the chart's consonant table, the voiceless sound of each cell is on the left and the voiced one on the right, and shaded boxes mark sounds judged impossible to make."
      bn: "চার্টের ব্যঞ্জন-সারণিতে প্রতিটি ঘরে অঘোষ ধ্বনি বাঁয়ে আর ঘোষ ধ্বনি ডানে থাকে, আর ছায়া-করা ঘরগুলো এমন ধ্বনির, যা উচ্চারণ করা অসম্ভব বলে ধরা হয়।"
      hi: "चार्ट की व्यंजन-तालिका में हर खाने में अघोष ध्वनि बाईं ओर और सघोष दाईं ओर होती है, और छायांकित खाने उन ध्वनियों के हैं जिन्हें बोलना असंभव माना जाता है।"
  - id: ipa-fact-037
    tags: [use]
    source: "https://en.wikipedia.org/wiki/International_Phonetic_Alphabet"
    text:
      en: "The IPA is used well beyond linguistics: singers use it to learn the words of songs in other languages, and speech therapists to record how a person speaks."
      bn: "IPA শুধু ভাষাবিজ্ঞানে নয়: গায়করা অন্য ভাষার গানের কথা শিখতে আর স্পিচ থেরাপিস্টরা কারো কথা বলার ধরন লিখে রাখতে এটি ব্যবহার করেন।"
      hi: "IPA भाषाविज्ञान से बाहर भी काम आती है: गायक दूसरी भाषाओं के गीतों के बोल सीखने में और स्पीच थेरेपिस्ट किसी के बोलने का ढंग दर्ज करने में इसका इस्तेमाल करते हैं।"
