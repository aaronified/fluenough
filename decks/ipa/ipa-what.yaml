    tags: ["core"]
    modes: ["listening", "speaking"]
    notes:
      - { id: "n1", kind: "note", source: "https://www.internationalphoneticassociation.org/content/ipa-chart" }
  - id: "ipa-0185"
    target: "diacritics"
    tags: ["core"]
