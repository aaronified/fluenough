schema: 1
id: ipa-en-rare
name: "Rare sounds and tones"
kind: vocab
language: { code: ipa, iso639_3: zxx, name: IPA, script: ipa, typed: false, icon: "ə" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
source: "Arranged after the IPA chart, 2020 revision, of the International Phonetic Association (https://www.internationalphoneticassociation.org/content/ipa-chart), and the Handbook of the International Phonetic Association (1999)"
description: "Sounds made without air from the lungs: clicks, implosives and ejectives; the chart's other symbols for the throat; and the marks for tone. None of the languages in this app uses them."
tags: [advanced, unreviewed]
cards:
  - id: ipa-0138
    target: "ʘ"
    native: "a kiss-like click of the lips (bilabial click)"
    notes: "Clicks use no air from the lungs: the tongue seals the mouth at two points, and lowering it makes a pocket of thin air that pops when the front seal opens. ʘ is the click of the lips, like a kiss, found only in a few languages of southern Africa such as Taa. Its letter is a bullseye, a circle with a dot in it."
    modes: [recognition, production]
  - id: ipa-0139
    target: "ǀ"
    native: "a tut-tut click at the teeth (dental click)"
    notes: "The tsk or tut-tut of English disapproval, which Zulu and Xhosa use as a consonant and spell c. Its letter is a single upright bar; it looks like the phrase-boundary bar | but is a different character."
    modes: [recognition, production]
  - id: ipa-0140
    target: "ǃ"
    native: "a click like a cork popping (postalveolar click)"
    notes: "The tongue tip is pulled sharply down from the roof of the mouth just behind the ridge, with a hollow pop: Zulu and Xhosa q. Its letter is an exclamation mark, and the chart names it (post)alveolar."
    modes: [recognition, production]
  - id: ipa-0141
    target: "ǂ"
    native: "a sharp click with the flat of the tongue (palatoalveolar click)"
    notes: "The flat front of the tongue is pulled down sharply from just behind the ridge, a sharper sound than ǃ. Khoekhoe, also called Nama, and other languages of southern Africa have it. Its letter is an upright bar crossed by two strokes."
    modes: [recognition, production]
  - id: ipa-0142
    target: "ǁ"
    native: "a giddy-up click at the side of the tongue (alveolar lateral click)"
    notes: "The click riders make to urge on a horse: the seal opens at the side of the tongue. Zulu and Xhosa spell it x, as at the start of the name Xhosa. Its letter is two upright bars, which look like the phrase-boundary ‖ but are a different character."
    modes: [recognition, production]
  - id: ipa-0143
    target: "ɓ"
    native: "b with the air drawn inwards (voiced bilabial implosive)"
    notes: "Implosives are made by lowering the larynx while the mouth is closed, so air is drawn in as the lips open, with a hollow, gulping sound. Every implosive letter is a voiced stop with a hook on top: ɓ is b with the hook. Sindhi, spoken in Pakistan and India, and Hausa, in West Africa, both have ɓ."
    modes: [recognition, production]
  - id: ipa-0144
    target: "ɗ"
    native: "d with the air drawn inwards (voiced dental or alveolar implosive)"
    notes: "d with a hook on top: an implosive at the teeth or the ridge. Vietnamese đ is often ɗ, and Sindhi and Hausa have it too."
    modes: [recognition, production]
  - id: ipa-0145
    target: "ʄ"
    native: "a palatal stop with the air drawn inwards (voiced palatal implosive)"
    notes: "ɟ with a hook on top: an implosive at the hard palate. Sindhi has it, with a letter of its own in its alphabet."
    modes: [recognition, production]
  - id: ipa-0146
    target: "ɠ"
    native: "g with the air drawn inwards (voiced velar implosive)"
    notes: "ɡ with a hook on top: an implosive at the soft palate. Sindhi has it, and so do some languages of Africa."
    modes: [recognition, production]
  - id: ipa-0147
    target: "ʛ"
    native: "a uvular stop with the air drawn inwards (voiced uvular implosive)"
    notes: "ɢ with a hook on top: an implosive at the uvula, the rarest of the five. Like ɢ, it is a small capital, here with the hook."
    modes: [recognition, production]
  - id: ipa-0148
    target: "pʼ"
    native: "p with a popping release from the throat (bilabial ejective)"
    notes: "Ejectives are made with the vocal folds shut: the larynx rises like a piston and pushes the air out, so the release is a sharp pop. An apostrophe after a letter marks one, as in pʼ, tʼ, kʼ and sʼ. Georgian, Amharic and Quechua have ejectives; the languages in this app do not."
    modes: [recognition, production]
  - id: ipa-0149
    target: "tʼ"
    native: "t with a popping release from the throat (dental or alveolar ejective)"
    notes: "t made as an ejective, with the vocal folds shut and the air pushed out by the rising larynx. Georgian tells tʼ from both d and tʰ, a three-way contrast where Hindi has four."
    modes: [recognition, production]
  - id: ipa-0150
    target: "kʼ"
    native: "k with a popping release from the throat (velar ejective)"
    notes: "k made as an ejective, among the commonest ejectives in the world's languages. It is heard in Amharic, Georgian and many languages of the Americas."
    modes: [recognition, production]
  - id: ipa-0151
    target: "sʼ"
    native: "s with a popping release from the throat (alveolar ejective fricative)"
    notes: "Not only stops can be ejectives: sʼ is an s pushed out by the rising larynx with the vocal folds shut. It is rare; Amharic has it."
    modes: [recognition, production]
  - id: ipa-0152
    target: "ɧ"
    native: "sh and the loch sound at once (simultaneous ʃ and x)"
    notes: "A hissing rasp made at two places at once, where ʃ and x are made. It is the Swedish sj sound, as in sju, seven, which phoneticians still argue about. Its letter is an h with a hook."
    modes: [recognition, production]
  - id: ipa-0153
    target: "ʜ"
    native: "a harsh hiss at the epiglottis (voiceless epiglottal fricative)"
    notes: "The epiglottis, the flap that closes off the windpipe when you swallow, is pulled back towards the throat wall, giving a harsher hiss than ħ. A few languages of the Caucasus, such as Agul, have it. Its letter is a small capital H."
    modes: [recognition, production]
  - id: ipa-0154
    target: "ʢ"
    native: "a harsh voiced squeeze at the epiglottis (voiced epiglottal fricative)"
    notes: "ʜ with voice, deeper and harsher than ʕ. Its letter is ʕ with a bar, matching ʡ."
    modes: [recognition, production]
  - id: ipa-0155
    target: "ʡ"
    native: "a stop at the epiglottis (epiglottal plosive)"
    notes: "The epiglottis closes against the back of the throat and lets go, a stop deeper in the throat than ʔ. Its letter is a glottal stop with a bar. It is among the rarest consonants."
    modes: [recognition, production]
  - id: ipa-0156
    target: "˥"
    native: "a tone letter flagged at the top: extra-high pitch (extra-high tone)"
    notes: "Tone letters draw pitch: the upright stick is the speaker's range, and a flag from it shows where the voice is, so ˥ is the top. In tone languages such as Mandarin, Cantonese, Thai and Yoruba, pitch alone can change a word. The letters were devised by the Chinese linguist Yuen Ren Chao, in 1930."
    modes: [recognition, production]
  - id: ipa-0157
    target: "˧"
    native: "a tone letter flagged in the middle: mid pitch (mid tone)"
    notes: "The flag halfway up the stick is mid pitch. Five levels run from top to bottom, ˥ ˦ ˧ ˨ ˩: extra high, high, mid, low and extra low. A syllable's tone letters follow it, as in ma˧."
    modes: [recognition, production]
  - id: ipa-0158
    target: "˩"
    native: "a tone letter flagged at the bottom: extra-low pitch (extra-low tone)"
    notes: "The flag at the foot of the stick is the bottom of the speaker's range. With ˥ at the top, it is one end of the scale that the other tone letters sit between."
    modes: [recognition, production]
  - id: ipa-0159
    target: "˥˩"
    native: "tone letters joined: a falling tone (contour tone)"
    notes: "Joined tone letters draw the path of the pitch: ˥˩ falls from top to bottom, like the Mandarin fourth tone of mà, to scold, and ˩˥ rises. A contour can turn, as in ˧˦˧, rising and then falling."
    modes: [recognition, production]
  - id: ipa-0160
    target: "é"
    native: "an acute accent: high tone (tone mark over a vowel)"
    notes: "Tone can also be marked over the vowel, shown here on e: é high, ē mid and è low, with e̋ and ȅ for extra high and extra low, and ě and ê for rising and falling. In the IPA an acute accent is a high tone, not the stress it marks in Spanish spelling, as in café; stress is ˈ."
    modes: [recognition, production]
  - id: ipa-0161
    target: "ꜜ"
    native: "a small down arrow: the next high tones step down (downstep)"
    notes: "A downstep lowers the pitch of the high tones after it, so a run of highs steps down like stairs, as in many tone languages of Africa. Its opposite is ꜛ, upstep. The larger arrows ↗ and ↘ mark a rise or fall across a whole utterance."
    modes: [recognition, production]
