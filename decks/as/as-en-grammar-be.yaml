        "তই / তহঁত": "আছিলি"
        "তুমি / তোমালোক": "আছিলা"
        "আপুনি / সি / তাই / তেওঁ": "আছিল"
      readings:
        "মই / আমি": ["āsilum̐", "āsilu"]
        "তই / তহঁত": "āsili"
        "তুমি / তোমালোক": "āsilā"
        "আপুনি / সি / তাই / তেওঁ": "āsil"
      ipas:
