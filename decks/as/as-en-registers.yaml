schema: 1
id: as-en-registers
name: "Formal Assamese and everyday Assamese"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Assamese is written much as it is spoken, but signs, forms, offices and the news use formal words from Sanskrit that nobody says at home. Here they are, with the everyday word beside each. Recognition only. Not yet checked by an Assamese speaker: please report any mistake."
tags: [reading, unreviewed]
cards:
  - ref: as-0130
    notes: "Formal. Between friends, often 'thanks' in English, or nothing at all."
    modes: [recognition]
  - ref: as-0065
    native: "water (formal); everyday পানী"
    notes: "On notices and in songs and poems. In speech it survives in জলপান (zôlpān), a snack."
    modes: [recognition]
  - ref: as-0407
    native: "food (formal); everyday ভাত or খোৱা বস্তু"
    notes: "On menus and in the news. At home a meal is ভাত (bhāt)."
    modes: [recognition]
  - id: as-0431
    target: "প্ৰৱেশ"
    native: "entry; way in (on signs)"
    reading: "prôwex"
    ipa: "pɹɔwex"
    pos: "other"
    modes: [recognition]
    notes: "On doors and gates: প্ৰৱেশ, entry; প্ৰস্থান (prôsthān), exit."
  - id: as-0432
    target: "প্ৰস্থান"
    native: "exit; way out (on signs)"
    reading: "prôsthān"
    ipa: "pɹɔstʰan"
    pos: "other"
    modes: [recognition]
  - id: as-0433
    target: "ধূমপান নিষেধ"
    native: "no smoking (on signs)"
    reading: "dhumpān nixedh"
    ipa: "dʱumpan nixedʱ"
    pos: "other"
    modes: [recognition]
    notes: "নিষেধ (nixedh), forbidden: the word to look for on any notice."
  - id: as-0434
    target: "শৌচালয়"
    native: "toilet (on signs)"
    reading: "xôusālôy"
    ipa: "xɔusalɔj"
    pos: "other"
    modes: [recognition]
    notes: "Speakers say বাথৰুম (bāthrum) or টয়লেট (tôylet)."
  - id: as-0435
    target: "অনুগ্ৰহ কৰি"
    native: "please (formal, written)"
    reading: "ônugrôhô kori"
    ipa: "ɔnuɡɹɔhɔ koɹi"
    pos: "other"
    modes: [recognition]
    notes: "On signs, forms and announcements. In speech the polite verb in -ক is enough: বহক (bôhôk), please sit."
  - id: as-0436
    target: "স্বাগতম"
    native: "welcome (on signs and banners)"
    reading: "xāgôtôm"
    ipa: "xaɡɔtɔm"
    pos: "other"
    modes: [recognition]
    notes: "At the door of a home, a host says আহক (āhôk), come in."
  - id: as-0437
    target: "বিদ্যালয়"
    native: "school (formal); everyday স্কুল"
    reading: "bidyālôy"
    ipa: "bidjalɔj"
    pos: "other"
    modes: [recognition]
    notes: "In school names: a college is মহাবিদ্যালয় (môhābidyālôy), and a university বিশ্ববিদ্যালয় (bixxobidyālôy)."
  - id: as-0438
    target: "আৰক্ষী"
    native: "police (formal); everyday পুলিচ"
    reading: "ārokkhi"
    ipa: "aɹokkʰi"
    pos: "other"
    modes: [recognition]
    notes: "On police stations and in the news."
  - id: as-0439
    target: "পিতৃ"
    native: "father (formal); everyday দেউতা"
    reading: "pitri"
    ipa: "pitri"
    pos: "other"
    modes: [recognition]
    notes: "On forms: পিতৃৰ নাম (pitrir nām), father's name."
  - id: as-0440
    target: "মাতৃ"
    native: "mother (formal); everyday মা or আই"
    reading: "mātri"
    ipa: "matri"
    pos: "other"
    modes: [recognition]
    notes: "In মাতৃভাষা (mātribhāxā), mother tongue."
  - id: as-0441
    target: "সমাচাৰ"
    native: "news (formal); everyday খবৰ"
    reading: "xômāsār"
    ipa: "xɔmasaɹ"
    pos: "other"
    modes: [recognition]
    notes: "Read on the radio and television. Friends ask কি খবৰ? (ki khobor?), what's the news?"
  - id: as-0442
    target: "যাত্ৰী"
    native: "passenger; traveller (formal)"
    reading: "zātri"
    ipa: "zatɹi"
    pos: "other"
    modes: [recognition]
    notes: "On buses, trains and ferries: যাত্ৰীসকল (zātrixôkôl), passengers, with -সকল, the respectful plural."
  - id: as-0443
    target: "প্ৰয়োজন"
    native: "need (formal); in speech, লাগে"
    reading: "prôyuzôn"
    ipa: "pɹɔjʊzɔn"
    pos: "other"
    modes: [recognition]
    notes: "Written: আপোনাৰ কি প্ৰয়োজন? Said: আপোনাক কি লাগে? (apunak ki lage?), what do you need?"
