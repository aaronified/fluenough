schema: 1
id: as-en-registers
name: "Formal Assamese and everyday Assamese"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Assamese is written much as it is spoken, but signs, forms, offices and the news use formal words from Sanskrit that nobody says at home. Here they are, with the everyday word beside each. Recognition only. Not yet checked by an Assamese speaker: please report any mistake."
tags: [reading, unreviewed]
cards:
  - ref: as-0130
    notes: "Formal. Between friends, often 'thanks' in English, or nothing at all."
    modes: [recognition]
  - ref: as-0065
    native: "water (formal); everyday পানী"
    notes: "On notices and in songs and poems. In speech it survives in জলপান (jolpan), a snack."
    modes: [recognition]
  - ref: as-0407
    native: "food (formal); everyday ভাত or খোৱা বস্তু"
    notes: "On menus and in the news. At home a meal is ভাত (bhat)."
    modes: [recognition]
  - id: as-0431
    target: "প্ৰৱেশ"
    native: "entry; way in (on signs)"
    reading: "prowex"
    pos: "other"
    modes: [recognition]
    notes: "On doors and gates: প্ৰৱেশ, entry; প্ৰস্থান (prosthan), exit."
  - id: as-0432
    target: "প্ৰস্থান"
    native: "exit; way out (on signs)"
    reading: "prosthan"
    pos: "other"
    modes: [recognition]
  - id: as-0433
    target: "ধূমপান নিষেধ"
    native: "no smoking (on signs)"
    reading: "dhumpan nixedh"
    pos: "other"
    modes: [recognition]
    notes: "নিষেধ (nixedh), forbidden: the word to look for on any notice."
  - id: as-0434
    target: "শৌচালয়"
    native: "toilet (on signs)"
    reading: "xousaloy"
    pos: "other"
    modes: [recognition]
    notes: "Speakers say বাথৰুম (bathrum) or টয়লেট (toylet)."
  - id: as-0435
    target: "অনুগ্ৰহ কৰি"
    native: "please (formal, written)"
    reading: "onugroho kori"
    pos: "other"
    modes: [recognition]
    notes: "On signs, forms and announcements. In speech the polite verb in -ক is enough: বহক (bohok), please sit."
  - id: as-0436
    target: "স্বাগতম"
    native: "welcome (on signs and banners)"
    reading: "xagotom"
    pos: "other"
    modes: [recognition]
    notes: "At the door of a home, a host says আহক (ahok), come in."
  - id: as-0437
    target: "বিদ্যালয়"
    native: "school (formal); everyday স্কুল"
    reading: "bidyaloy"
    pos: "other"
    modes: [recognition]
    notes: "In school names: a college is মহাবিদ্যালয় (mohabidyaloy), and a university বিশ্ববিদ্যালয় (bixobidyaloy)."
  - id: as-0438
    target: "আৰক্ষী"
    native: "police (formal); everyday পুলিচ"
    reading: "arokkhi"
    pos: "other"
    modes: [recognition]
    notes: "On police stations and in the news."
  - id: as-0439
    target: "পিতৃ"
    native: "father (formal); everyday দেউতা"
    reading: "pitri"
    pos: "other"
    modes: [recognition]
    notes: "On forms: পিতৃৰ নাম (pitrir nam), father's name."
  - id: as-0440
    target: "মাতৃ"
    native: "mother (formal); everyday মা or আই"
    reading: "matri"
    pos: "other"
    modes: [recognition]
    notes: "In মাতৃভাষা (matribhaxa), mother tongue."
  - id: as-0441
    target: "সমাচাৰ"
    native: "news (formal); everyday খবৰ"
    reading: "xomasar"
    pos: "other"
    modes: [recognition]
    notes: "Read on the radio and television. Friends ask কি খবৰ? (ki khobor?), what's the news?"
  - id: as-0442
    target: "যাত্ৰী"
    native: "passenger; traveller (formal)"
    reading: "jatri"
    pos: "other"
    modes: [recognition]
    notes: "On buses, trains and ferries: যাত্ৰীসকল (jatrixokol), passengers, with -সকল, the respectful plural."
  - id: as-0443
    target: "প্ৰয়োজন"
    native: "need (formal); in speech, লাগে"
    reading: "proyujon"
    pos: "other"
    modes: [recognition]
    notes: "Written: আপোনাৰ কি প্ৰয়োজন? Said: আপোনাক কি লাগে? (apunak ki lage?), what do you need?"
