schema: 1
id: as-en-grammar-future
name: "Present and future"
kind: grammar
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I go, I will go: the simple present, for habits and facts, and the future. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Simple present and future"
  slot_name: "tense, person and respect"
  slots: ["present, মই / আমি", "present, তই / তহঁত", "present, তুমি / তোমালোক", "present, আপুনি / সি / তাই / তেওঁ", "future, মই / আমি", "future, তই / তহঁত", "future, তুমি / তোমালোক", "future, আপুনি / সি / তাই / তেওঁ"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The present is for habits and facts: মই চাহ খাওঁ, I drink tea. Its endings are -ওঁ, none, -আ and -এ. The future's are -ইম, -ইবি, -ইবা and -ইব: কৰিম, I will do; a stem ending in a vowel takes them without the -ই-: যাম, খাম. With তুমি, যোৱা and খোৱা change their vowel: তুমি যোৱা, you go. The future with আপুনি, সি, তাই and তেওঁ ends in a vowel said but not written: কৰিব, koribo. The verb changes for person and respect, never for gender or number. The ending -ওঁ is also written -ো, without ঁ, and both are accepted."
  entries:
    - lemma: "কৰা"
      key: kora
      reading: "kora"
      gloss: "to do"
      forms:
        "present, মই / আমি": ["কৰোঁ", "কৰো"]
        "present, তই / তহঁত": "কৰ"
        "present, তুমি / তোমালোক": "কৰা"
        "present, আপুনি / সি / তাই / তেওঁ": "কৰে"
        "future, মই / আমি": "কৰিম"
        "future, তই / তহঁত": "কৰিবি"
        "future, তুমি / তোমালোক": "কৰিবা"
        "future, আপুনি / সি / তাই / তেওঁ": "কৰিব"
      readings:
        "present, মই / আমি": ["koru", "koru"]
        "present, তই / তহঁত": "kor"
        "present, তুমি / তোমালোক": "kora"
        "present, আপুনি / সি / তাই / তেওঁ": "kore"
        "future, মই / আমি": "korim"
        "future, তই / তহঁত": "koribi"
        "future, তুমি / তোমালোক": "koriba"
        "future, আপুনি / সি / তাই / তেওঁ": "koribo"
    - lemma: "যোৱা"
      key: juwa
      reading: "juwa"
      gloss: "to go"
      forms:
        "present, মই / আমি": ["যাওঁ", "যাও"]
        "present, তই / তহঁত": "যাৱ"
        "present, তুমি / তোমালোক": "যোৱা"
        "present, আপুনি / সি / তাই / তেওঁ": "যায়"
        "future, মই / আমি": "যাম"
        "future, তই / তহঁত": "যাবি"
        "future, তুমি / তোমালোক": "যাবা"
        "future, আপুনি / সি / তাই / তেওঁ": "যাব"
      readings:
        "present, মই / আমি": ["jau", "jau"]
        "present, তই / তহঁত": "jaw"
        "present, তুমি / তোমালোক": "juwa"
        "present, আপুনি / সি / তাই / তেওঁ": "jay"
        "future, মই / আমি": "jam"
        "future, তই / তহঁত": "jabi"
        "future, তুমি / তোমালোক": "jaba"
        "future, আপুনি / সি / তাই / তেওঁ": "jabo"
    - lemma: "অহা"
      key: oha
      reading: "oha"
      gloss: "to come"
      forms:
        "present, মই / আমি": ["আহোঁ", "আহো"]
        "present, তই / তহঁত": "আহ"
        "present, তুমি / তোমালোক": "আহা"
        "present, আপুনি / সি / তাই / তেওঁ": "আহে"
        "future, মই / আমি": "আহিম"
        "future, তই / তহঁত": "আহিবি"
        "future, তুমি / তোমালোক": "আহিবা"
        "future, আপুনি / সি / তাই / তেওঁ": "আহিব"
      readings:
        "present, মই / আমি": ["ahu", "ahu"]
        "present, তই / তহঁত": "ah"
        "present, তুমি / তোমালোক": "aha"
        "present, আপুনি / সি / তাই / তেওঁ": "ahe"
        "future, মই / আমি": "ahim"
        "future, তই / তহঁত": "ahibi"
        "future, তুমি / তোমালোক": "ahiba"
        "future, আপুনি / সি / তাই / তেওঁ": "ahibo"
    - lemma: "খোৱা"
      key: khuwa
      reading: "khuwa"
      gloss: "to eat; to drink"
      forms:
        "present, মই / আমি": ["খাওঁ", "খাও"]
        "present, তই / তহঁত": "খাৱ"
        "present, তুমি / তোমালোক": "খোৱা"
        "present, আপুনি / সি / তাই / তেওঁ": "খায়"
        "future, মই / আমি": "খাম"
        "future, তই / তহঁত": "খাবি"
        "future, তুমি / তোমালোক": "খাবা"
        "future, আপুনি / সি / তাই / তেওঁ": "খাব"
      readings:
        "present, মই / আমি": ["khau", "khau"]
        "present, তই / তহঁত": "khaw"
        "present, তুমি / তোমালোক": "khuwa"
        "present, আপুনি / সি / তাই / তেওঁ": "khay"
        "future, মই / আমি": "kham"
        "future, তই / তহঁত": "khabi"
        "future, তুমি / তোমালোক": "khaba"
        "future, আপুনি / সি / তাই / তেওঁ": "khabo"
