schema: 1
id: as-en-grammar-future
name: "Present and future"
kind: grammar
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I go, I will go: the simple present, for habits and facts, and the future. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Simple present and future"
  slot_name: "tense, person and respect"
  slots: ["present, মই / আমি", "present, তই / তহঁত", "present, তুমি / তোমালোক", "present, আপুনি / সি / তাই / তেওঁ", "future, মই / আমি", "future, তই / তহঁত", "future, তুমি / তোমালোক", "future, আপুনি / সি / তাই / তেওঁ"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The present is for habits and facts: মই চাহ খাওঁ, I drink tea. Its endings are -ওঁ, none, -আ and -এ. The future's are -ইম, -ইবি, -ইবা and -ইব: কৰিম, I will do; a stem ending in a vowel takes them without the -ই-: যাম, খাম. With তুমি, যোৱা and খোৱা change their vowel: তুমি যোৱা, you go. The future with আপুনি, সি, তাই and তেওঁ ends in a vowel said but not written: কৰিব, koribo. The verb changes for person and respect, never for gender or number. The ending -ওঁ is also written -ো, without ঁ, and both are accepted."
  entries:
    - lemma: "কৰা"
      key: kora
      reading: "kôrā"
      ipa: "kɔɹa"
      gloss: "to do"
      forms:
        "present, মই / আমি": ["কৰোঁ", "কৰো"]
        "present, তই / তহঁত": "কৰ"
        "present, তুমি / তোমালোক": "কৰা"
        "present, আপুনি / সি / তাই / তেওঁ": "কৰে"
        "future, মই / আমি": "কৰিম"
        "future, তই / তহঁত": "কৰিবি"
        "future, তুমি / তোমালোক": "কৰিবা"
        "future, আপুনি / সি / তাই / তেওঁ": "কৰিব"
      readings:
        "present, মই / আমি": ["kôrum̐", "kôru"]
        "present, তই / তহঁত": "kôr"
        "present, তুমি / তোমালোক": "kôrā"
        "present, আপুনি / সি / তাই / তেওঁ": "kôre"
        "future, মই / আমি": "korim"
        "future, তই / তহঁত": "koribi"
        "future, তুমি / তোমালোক": "koribā"
        "future, আপুনি / সি / তাই / তেওঁ": "koribô"
      ipas:
        "present, মই / আমি": "kɔɹʊ̃"
        "present, তই / তহঁত": "kɔɹ"
        "present, তুমি / তোমালোক": "kɔɹa"
        "present, আপুনি / সি / তাই / তেওঁ": "kɔɹe"
        "future, মই / আমি": "koɹim"
        "future, তই / তহঁত": "koɹibi"
        "future, তুমি / তোমালোক": "koɹiba"
        "future, আপুনি / সি / তাই / তেওঁ": "koɹibɔ"
    - lemma: "যোৱা"
      key: juwa
      reading: "zuwā"
      ipa: "zʊwa"
      gloss: "to go"
      forms:
        "present, মই / আমি": ["যাওঁ", "যাও"]
        "present, তই / তহঁত": "যাৱ"
        "present, তুমি / তোমালোক": "যোৱা"
        "present, আপুনি / সি / তাই / তেওঁ": "যায়"
        "future, মই / আমি": "যাম"
        "future, তই / তহঁত": "যাবি"
        "future, তুমি / তোমালোক": "যাবা"
