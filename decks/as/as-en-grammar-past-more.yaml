      key: kora
      reading: "kora"
      gloss: "to do"
      forms:
        "was doing, মই / আমি": ["কৰি আছিলোঁ", "কৰি আছিলো"]
        "was doing, তই / তহঁত": "কৰি আছিলি"
        "was doing, তুমি / তোমালোক": "কৰি আছিলা"
        "was doing, আপুনি / সি / তাই / তেওঁ": "কৰি আছিল"
        "had done, used to, মই / আমি": ["কৰিছিলোঁ", "কৰিছিলো"]
        "had done, used to, তই / তহঁত": "কৰিছিলি"
        "had done, used to, তুমি / তোমালোক": "কৰিছিলা"
        "had done, used to, আপুনি / সি / তাই / তেওঁ": "কৰিছিল"
      readings:
        "was doing, মই / আমি": ["kori asilu", "kori asilu"]
        "was doing, তই / তহঁত": "kori asili"
        "was doing, তুমি / তোমালোক": "kori asila"
        "was doing, আপুনি / সি / তাই / তেওঁ": "kori asil"
        "had done, used to, মই / আমি": ["korisilu", "korisilu"]
        "had done, used to, তই / তহঁত": "korisili"
        "had done, used to, তুমি / তোমালোক": "korisila"
        "had done, used to, আপুনি / সি / তাই / তেওঁ": "korisil"
    - lemma: "যোৱা"
      key: juwa
      reading: "juwa"
