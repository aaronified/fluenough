schema: 1
id: as-en-grammar-past-more
name: "Was doing, had done, used to"
kind: grammar
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I was eating, I had gone, I used to go: the past continuous, and the -ইছিল past, which says had done and used to. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Past continuous and past perfect"
  slot_name: "tense, person and respect"
  slots: ["was doing, মই / আমি", "was doing, তই / তহঁত", "was doing, তুমি / তোমালোক", "was doing, আপুনি / সি / তাই / তেওঁ", "had done, used to, মই / আমি", "had done, used to, তই / তহঁত", "had done, used to, তুমি / তোমালোক", "had done, used to, আপুনি / সি / তাই / তেওঁ"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Was doing is the present continuous with আছিল in place of আছে: কৰি আছোঁ, I am doing; কৰি আছিলোঁ, I was doing. The -ইছিল past says had done: মই অহাৰ আগতে সি গৈছিল, he had gone before I came. It is also the plain past for something further back, and for what used to happen: সৰুতে মই তাত থাকিছিলোঁ, I lived there as a child. যোৱা takes গৈ: গৈ আছিলোঁ, গৈছিলোঁ. আপুনি takes the same form as সি, তাই and তেওঁ. The ending -ওঁ is also written -ো, without ঁ, and both are accepted."
