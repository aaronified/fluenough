# The order Assamese is taught from English in: one unit per line. First the
# script, the sounds English lacks, and how Assamese grammar differs from
# English; then a theme deck and the grammar that goes with it. Every as-en
# deck is listed exactly once. See ADR-0013 and docs/DECK-FORMAT.md.
schema: 1
kind: path
id: as-en-path
language: as
native: en
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  - [as-en-script-vowels, as-en-script-consonants, as-en-script-reading]
  - [as-en-script-vowel-signs, as-en-script-conjuncts]
  - [as-en-sound-differences]
  - [as-en-grammar-differences]
  - [as-en-first-words, as-en-grammar-sentences, "*"]
  - [as-en-questions, as-en-grammar-questions, "*"]
  - [as-en-addressing, as-en-grammar-pronouns, "*"]
  - [as-en-about-me, "*"]
  - [as-en-family, as-en-grammar-be, "*"]
  - [as-en-work, as-en-grammar-demonstratives, "*"]
  - [as-en-numbers-1-20, "*"]
  - [as-en-numbers-big, "*"]
  - [as-en-market, as-en-grammar-nouns, as-en-grammar-articles, "*"]
  - [as-en-groceries, as-en-grammar-gender-number, as-en-grammar-needs, "*"]
  - [as-en-transport, as-en-grammar-postpositions, "*"]
  - [as-en-directions, as-en-grammar-continuous, "*"]
  - [as-en-home, as-en-grammar-adjectives, "*"]
  - [as-en-time, as-en-grammar-future, "*"]
  - [as-en-daily-life, as-en-grammar-negative, "*"]
  - [as-en-calendar, as-en-grammar-past, "*"]
  - [as-en-grammar-past-more, as-en-grammar-conjunct-verbs]
  - [as-en-grammar-compound-verbs]
  - [as-en-eating-out, as-en-grammar-conjunctions, as-en-grammar-likes, "*"]
  - [as-en-help, as-en-grammar-irregular, as-en-grammar-pitfalls, "*"]
  - [as-en-registers]
  - [as-en-slang]
  - [as-en-grammar-can-must]
  - [as-en-spelling]
  - [as-en-reading-aitar-mas]
  - ["*"]
