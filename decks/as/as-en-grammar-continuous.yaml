schema: 1
id: as-en-grammar-continuous
name: "Present continuous"
kind: grammar
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I am doing, she is coming: what is happening now. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Present continuous"
  slot_name: "person and respect"
  slots: ["মই / আমি", "তই / তহঁত", "তুমি / তোমালোক", "আপুনি / সি / তাই / তেওঁ"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The verb in -ই (-i), then আছ- (ās-) with the person's ending: কৰি আছোঁ (kori āsum̐), I am doing, 'doing I am'. যোৱা (zuwā) takes the stem গৈ (gôi): গৈ আছোঁ (gôi āsum̐), I am going. The verb changes for person and respect, never for gender or number: মই (moi) and আমি (āmi) take the same form, and আপুনি (āpuni) the same as সি (si), তাই (tāi) and তেওঁ (teum̐). The ending -ওঁ (-um̐) is also written -ো (u), without ঁ (ôm̐), and both are accepted."
  entries:
    - lemma: "কৰা"
      key: kora
      reading: "kôrā"
      ipa: "kɔɹa"
      gloss: "to do"
      forms:
        "মই / আমি": ["কৰি আছোঁ", "কৰি আছো"]
        "তই / তহঁত": "কৰি আছ"
        "তুমি / তোমালোক": "কৰি আছা"
        "আপুনি / সি / তাই / তেওঁ": "কৰি আছে"
      readings:
        "মই / আমি": ["kori āsum̐", "kori āsu"]
        "তই / তহঁত": "kori ās"
        "তুমি / তোমালোক": "kori āsā"
        "আপুনি / সি / তাই / তেওঁ": "kori āse"
      ipas:
        "মই / আমি": "koɹi asʊ̃"
        "তই / তহঁত": "koɹi as"
        "তুমি / তোমালোক": "koɹi asa"
        "আপুনি / সি / তাই / তেওঁ": "koɹi ase"
    - lemma: "যোৱা"
      key: juwa
      reading: "zuwā"
      ipa: "zʊwa"
      gloss: "to go"
      forms:
        "মই / আমি": ["গৈ আছোঁ", "গৈ আছো"]
        "তই / তহঁত": "গৈ আছ"
        "তুমি / তোমালোক": "গৈ আছা"
        "আপুনি / সি / তাই / তেওঁ": "গৈ আছে"
      readings:
        "মই / আমি": ["gôi āsum̐", "gôi āsu"]
        "তই / তহঁত": "gôi ās"
        "তুমি / তোমালোক": "gôi āsā"
        "আপুনি / সি / তাই / তেওঁ": "gôi āse"
      ipas:
        "মই / আমি": "ɡɔi asʊ̃"
        "তই / তহঁত": "ɡɔi as"
        "তুমি / তোমালোক": "ɡɔi asa"
        "আপুনি / সি / তাই / তেওঁ": "ɡɔi ase"
    - lemma: "অহা"
      key: oha
      reading: "ôhā"
      ipa: "ɔha"
      gloss: "to come"
      forms:
        "মই / আমি": ["আহি আছোঁ", "আহি আছো"]
        "তই / তহঁত": "আহি আছ"
        "তুমি / তোমালোক": "আহি আছা"
        "আপুনি / সি / তাই / তেওঁ": "আহি আছে"
      readings:
        "মই / আমি": ["āhi āsum̐", "āhi āsu"]
        "তই / তহঁত": "āhi ās"
        "তুমি / তোমালোক": "āhi āsā"
        "আপুনি / সি / তাই / তেওঁ": "āhi āse"
      ipas:
