schema: 1
id: as-en-grammar-continuous
name: "Present continuous"
kind: grammar
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I am doing, she is coming: what is happening now. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Present continuous"
  slot_name: "person and respect"
  slots: ["মই / আমি", "তই / তহঁত", "তুমি / তোমালোক", "আপুনি / সি / তাই / তেওঁ"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The verb in -ই, then আছ- with the person's ending: কৰি আছোঁ, I am doing, 'doing I am'. যোৱা takes the stem গৈ: গৈ আছোঁ, I am going. The verb changes for person and respect, never for gender or number: মই and আমি take the same form, and আপুনি the same as সি, তাই and তেওঁ. The ending -ওঁ is also written -ো, without ঁ, and both are accepted."
  entries:
    - lemma: "কৰা"
      key: kora
      reading: "kora"
      gloss: "to do"
      forms:
        "মই / আমি": ["কৰি আছোঁ", "কৰি আছো"]
        "তই / তহঁত": "কৰি আছ"
        "তুমি / তোমালোক": "কৰি আছা"
        "আপুনি / সি / তাই / তেওঁ": "কৰি আছে"
      readings:
        "মই / আমি": ["kori asu", "kori asu"]
        "তই / তহঁত": "kori as"
        "তুমি / তোমালোক": "kori asa"
        "আপুনি / সি / তাই / তেওঁ": "kori ase"
    - lemma: "যোৱা"
      key: juwa
      reading: "juwa"
      gloss: "to go"
      forms:
        "মই / আমি": ["গৈ আছোঁ", "গৈ আছো"]
        "তই / তহঁত": "গৈ আছ"
        "তুমি / তোমালোক": "গৈ আছা"
        "আপুনি / সি / তাই / তেওঁ": "গৈ আছে"
      readings:
        "মই / আমি": ["goi asu", "goi asu"]
        "তই / তহঁত": "goi as"
        "তুমি / তোমালোক": "goi asa"
        "আপুনি / সি / তাই / তেওঁ": "goi ase"
    - lemma: "অহা"
      key: oha
      reading: "oha"
      gloss: "to come"
      forms:
        "মই / আমি": ["আহি আছোঁ", "আহি আছো"]
        "তই / তহঁত": "আহি আছ"
        "তুমি / তোমালোক": "আহি আছা"
        "আপুনি / সি / তাই / তেওঁ": "আহি আছে"
      readings:
        "মই / আমি": ["ahi asu", "ahi asu"]
        "তই / তহঁত": "ahi as"
        "তুমি / তোমালোক": "ahi asa"
        "আপুনি / সি / তাই / তেওঁ": "ahi ase"
    - lemma: "খোৱা"
      key: khuwa
      reading: "khuwa"
      gloss: "to eat; to drink"
      forms:
        "মই / আমি": ["খাই আছোঁ", "খাই আছো"]
        "তই / তহঁত": "খাই আছ"
        "তুমি / তোমালোক": "খাই আছা"
        "আপুনি / সি / তাই / তেওঁ": "খাই আছে"
      readings:
        "মই / আমি": ["khai asu", "khai asu"]
        "তই / তহঁত": "khai as"
        "তুমি / তোমালোক": "khai asa"
        "আপুনি / সি / তাই / তেওঁ": "khai ase"
    - lemma: "পঢ়া"
      key: porha
      reading: "porha"
      gloss: "to read; to study"
      forms:
        "মই / আমি": ["পঢ়ি আছোঁ", "পঢ়ি আছো"]
        "তই / তহঁত": "পঢ়ি আছ"
        "তুমি / তোমালোক": "পঢ়ি আছা"
        "আপুনি / সি / তাই / তেওঁ": "পঢ়ি আছে"
      readings:
        "মই / আমি": ["porhi asu", "porhi asu"]
        "তই / তহঁত": "porhi as"
        "তুমি / তোমালোক": "porhi asa"
        "আপুনি / সি / তাই / তেওঁ": "porhi ase"
