# How Assamese spells a generated number (ADR-0011). Like Bengali and Hindi,
# Assamese has a word of its own for each number from 21 to 99: পঁচিশ, 25,
# is not বিশ পাঁচ. The decks teach 1 to 20, the tens and 25, so
# tens_and_units is false, and only the numbers whose last two digits the
# decks teach a word for are generated. The hundreds join into one word
# (দুশ, 200); the thousands are two (তিনি হাজাৰ, 3,000), and 2,000 is also
# said as one, দুহাজাৰ.
schema: 1
id: as-numbers
name: "Assamese numbers"
kind: numbers
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN }
license: CC0-1.0
description: "How Assamese spells a generated number from the words its number decks teach (ADR-0011). Not yet checked by an Assamese speaker: please report any mistake."
tens_and_units: false
words:
