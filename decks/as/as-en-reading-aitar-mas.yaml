schema: 1
id: as-en-reading-aitar-mas
name: "Reading: Fish for Grandmother"
kind: reading
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
source: "Written for this deck and released under CC0"
description: "আইতাৰ বাবে মাছ, Fish for Grandmother: a short story in four scenes, written for this deck in everyday Assamese and released under CC0. Mamoni goes to the market for her grandmother, bargains for fish, rides the bus home, and sits down to a sour fish curry. The glossary gives the words and forms the theme decks don't teach. Not yet checked by an Assamese speaker: please report any mistake."
tags: [reading, unreviewed]
passages:
  - id: as-aitar-mas-01
    title: "Sunday morning"
    theme: daily-life
    sentences:
      - text: "আজি দেওবাৰ।"
        reading: "āzi deubār."
        ipa: "azi deʊbaɹ"
      - text: "মামণি ৰাতিপুৱা সাত বজাত উঠে।"
        reading: "māmoni rātipuwā xāt bôzāt uthe."
        ipa: "mamoni ɹatipuwa xat bɔzat utʰe"
      - text: "তাই চাহ বনাই আইতাক দিয়ে।"
        reading: "tāi sāh bônāi āitāk diye."
        ipa: "tai sah bɔnai aitak dije"
      - text: "আইতাই কয়: ঘৰত মাছ নাই, বজাৰলৈ যোৱা।"
        reading: "āitāi kôy: ghôrôt mās nāi, bôzārôlôi zuwā."
        ipa: "aitai kɔj ɡʱɔɹɔt mas nai bɔzaɹɔlɔi zʊwa"
      - text: "মামণি মোনা লৈ বজাৰলৈ যায়।"
        reading: "māmoni munā lôi bôzārôlôi zāy."
        ipa: "mamoni mʊna lɔi bɔzaɹɔlɔi zaj"
    glossary:
      - word: "মামণি"
        modern: "মামণি"
        reading: "māmoni"
        ipa: "mamoni"
        meaning: { en: "Mamoni, a girl's name" }
        note: { en: "also a pet name for a little girl" }
      - word: "উঠে"
        modern: "উঠে"
        reading: "uthe"
        ipa: "utʰe"
        meaning: { en: "gets up" }
        note: { en: "from উঠা (utha), to get up" }
      - word: "বনাই"
        modern: "বনাই"
        reading: "bônāi"
        ipa: "bɔnai"
        meaning: { en: "having made" }
        note: { en: "from বনোৱা (bonuwa), to make. The -ই form joins two actions: she makes tea and gives it" }
      - word: "আইতাক"
        modern: "আইতাক"
        reading: "āitāk"
        ipa: "aitak"
        meaning: { en: "to Grandmother; (to) her grandmother" }
        note: { en: "আইতা with -ক, 'to'. It is also how Assamese says 'her grandmother'" }
      - word: "দিয়ে"
        modern: "দিয়ে"
        reading: "diye"
        ipa: "dije"
        meaning: { en: "gives" }
        note: { en: "from দিয়া (diya), to give" }
      - word: "আইতাই"
        modern: "আইতাই"
        reading: "āitāi"
        ipa: "aitai"
        meaning: { en: "Grandmother (doing something)" }
        note: { en: "after a vowel the doer's -এ is -ই" }
      - word: "কয়"
        modern: "কয়"
        reading: "kôy"
        ipa: "kɔj"
        meaning: { en: "says" }
        note: { en: "from কোৱা (kuwa), to say: সি কয়, তাই কয়, he or she says" }
      - word: "লৈ"
        modern: "লৈ"
        reading: "lôi"
        ipa: "lɔi"
        meaning: { en: "taking; with" }
        note: { en: "from লোৱা (luwa), to take: মোনা লৈ, taking a bag" }
    questions:
      - id: as-0466
        prompt: { en: "What day is it?" }
        options:
          - { en: "Saturday" }
          - { en: "Sunday" }
          - { en: "Monday" }
        answer: 2
      - id: as-0467
        prompt: { en: "Mamoni makes tea for her grandmother." }
        answer: true
      - id: as-0468
        prompt: { en: "Why does Mamoni go to the market?" }
        options:
          - { en: "There is no fish at home." }
          - { en: "Her grandmother is ill." }
          - { en: "She wants to buy tea." }
        answer: 1
  - id: as-aitar-mas-02
    title: "At the market"
    theme: market
    sentences:
      - text: "বজাৰত বৰ ভিৰ।"
        reading: "bôzārôt bôr bhir."
        ipa: "bɔzaɹɔt bɔɹ bʱiɹ"
      - text: "মামণিয়ে মাছৰ দাম সোধে।"
        reading: "māmoniye māsôr dām xudhe."
        ipa: "mamonije masɔɹ dam xʊdʱe"
      - text: "দোকানীয়ে কয়: কিলোত দুশ টকা।"
        reading: "dukāniye kôy: kilot dux tôkā."
        ipa: "dʊkanije kɔj kilot dux tɔka"
      - text: "মামণিয়ে কয়: বেছি দাম! অলপ কম কৰক।"
        reading: "māmoniye kôy: besi dām! ôlôp kôm kôrôk."
        ipa: "mamonije kɔj besi dam ɔlɔp kɔm kɔɹɔk"
      - text: "দোকানীয়ে হাঁহি হাঁহি এশ আশী টকা লয়।"
        reading: "dukāniye hām̐hi hām̐hi ex āxi tôkā lôy."
        ipa: "dʊkanije hãhi hãhi ex axi tɔka lɔj"
      - text: "মামণিয়ে এক কিলো মাছ আৰু আধা কিলো বিলাহী কিনে।"
        reading: "māmoniye ek kilo mās āru ādhā kilo bilāhi kine."
        ipa: "mamonije ek kilo mas aɹu adʱa kilo bilahi kine"
    glossary:
      - word: "বজাৰত"
        modern: "বজাৰত"
        reading: "bôzārôt"
        ipa: "bɔzaɹɔt"
        meaning: { en: "in the market" }
        note: { en: "বজাৰ with -অত, 'in'" }
      - word: "মামণিয়ে"
        modern: "মামণিয়ে"
        reading: "māmoniye"
        ipa: "mamonije"
        meaning: { en: "Mamoni (doing something to something)" }
        note: { en: "-এ, here -য়ে, marks the doer of a verb that has an object: মামণিয়ে দাম সোধে, Mamoni asks the price" }
      - word: "মাছৰ"
        modern: "মাছৰ"
        reading: "māsôr"
        ipa: "masɔɹ"
        meaning: { en: "of fish; the fish's" }
        note: { en: "-ৰ, 'of', with -অ- after a consonant" }
      - word: "সোধে"
        modern: "সোধে"
        reading: "xudhe"
        ipa: "xʊdʱe"
        meaning: { en: "asks" }
        note: { en: "from সোধা (xudha), to ask" }
      - word: "দোকানীয়ে"
        modern: "দোকানীয়ে"
        reading: "dukāniye"
        ipa: "dʊkanije"
        meaning: { en: "the seller (doing something)" }
        note: { en: "দোকানী, shopkeeper, with the doer's -এ" }
      - word: "কয়"
        modern: "কয়"
        reading: "kôy"
        ipa: "kɔj"
        meaning: { en: "says" }
        note: { en: "from কোৱা (kuwa), to say: সি কয়, তাই কয়, he or she says" }
      - word: "কিলোত"
        modern: "কিলোত"
        reading: "kilot"
        ipa: "kilot"
        meaning: { en: "per kilo; a kilo" }
        note: { en: "কিলো with -ত, 'in, at': the price at a kilo" }
      - word: "হাঁহি হাঁহি"
        modern: "হাঁহি হাঁহি"
        reading: "hām̐hi hām̐hi"
        ipa: "hãhi hãhi"
        meaning: { en: "smiling all the while" }
        note: { en: "from হাঁহা (haha), to laugh; said twice, it goes on" }
      - word: "লয়"
        modern: "লয়"
        reading: "lôy"
        ipa: "lɔj"
        meaning: { en: "takes" }
        note: { en: "from লোৱা (luwa), to take" }
      - word: "কিনে"
        modern: "কিনে"
        reading: "kine"
        ipa: "kine"
        meaning: { en: "buys" }
        note: { en: "from কিনা (kina), to buy" }
    questions:
      - id: as-0469
        prompt: { en: "What does the seller first ask for a kilo of fish?" }
        options:
          - { en: "150 rupees" }
          - { en: "200 rupees" }
          - { en: "250 rupees" }
        answer: 2
      - id: as-0470
        prompt: { en: "Mamoni bargains with the seller." }
        answer: true
      - id: as-0471
        prompt: { en: "What does Mamoni buy?" }
        options:
          - { en: "Fish and tomatoes" }
          - { en: "Fish and onions" }
          - { en: "Chicken and eggs" }
        answer: 1
  - id: as-aitar-mas-03
    title: "On the bus"
    theme: transport
    sentences:
      - text: "মামণি বাছেৰে ঘৰলৈ উভতি যায়।"
        reading: "māmoni bāsere ghôrôlôi ubhoti zāy."
        ipa: "mamoni baseɹe ɡʱɔɹɔlɔi ubʱoti zaj"
      - text: "বাছত এটাও ছিট খালী নাই।"
        reading: "bāsôt etāu sit khāli nāi."
        ipa: "basɔt etaʊ sit kʰali nai"
      - text: "কণ্ডাক্টৰে ভাড়া বিচাৰে: দহ টকা।"
        reading: "kôndāktôre bhārā bisāre: dôh tôkā."
        ipa: "kɔndaktɔɹe bʱaɹa bisaɹe dɔh tɔka"
      - text: "মামণিয়ে কয়: চাৰিআলিত ৰখাই দিয়ক।"
        reading: "māmoniye kôy: sāriālit rôkhāi diyôk."
        ipa: "mamonije kɔj saɹialit ɹɔkʰai dijɔk"
    glossary:
      - word: "মামণি"
        modern: "মামণি"
        reading: "māmoni"
        ipa: "mamoni"
        meaning: { en: "Mamoni, a girl's name" }
        note: { en: "also a pet name for a little girl" }
      - word: "বাছেৰে"
        modern: "বাছেৰে"
        reading: "bāsere"
        ipa: "baseɹe"
        meaning: { en: "by bus" }
        note: { en: "-এৰে, 'by, with'" }
      - word: "উভতি"
        modern: "উভতি"
        reading: "ubhoti"
        ipa: "ubʱoti"
        meaning: { en: "returning; back" }
        note: { en: "from উভতা (ubhota), to return: উভতি যায়, goes back" }
      - word: "বাছত"
        modern: "বাছত"
        reading: "bāsôt"
        ipa: "basɔt"
        meaning: { en: "on the bus" }
        note: { en: "বাছ with -অত, 'in, on'" }
      - word: "এটাও"
        modern: "এটাও"
        reading: "etāu"
        ipa: "etaʊ"
        meaning: { en: "not even one (with a negative verb)" }
        note: { en: "এটা, one, with -ও, 'even'" }
      - word: "কণ্ডাক্টৰে"
        modern: "কণ্ডাক্টৰে"
        reading: "kôndāktôre"
        ipa: "kɔndaktɔɹe"
        meaning: { en: "the conductor (doing something)" }
        note: { en: "from English conductor, with the doer's -এ" }
      - word: "বিচাৰে"
        modern: "বিচাৰে"
        reading: "bisāre"
        ipa: "bisaɹe"
        meaning: { en: "asks for; wants" }
        note: { en: "from বিচৰা (bisora), to look for; to want" }
      - word: "মামণিয়ে"
        modern: "মামণিয়ে"
        reading: "māmoniye"
        ipa: "mamonije"
        meaning: { en: "Mamoni (doing something to something)" }
        note: { en: "-এ, here -য়ে, marks the doer of a verb that has an object: মামণিয়ে দাম সোধে, Mamoni asks the price" }
      - word: "কয়"
        modern: "কয়"
        reading: "kôy"
        ipa: "kɔj"
        meaning: { en: "says" }
        note: { en: "from কোৱা (kuwa), to say: সি কয়, তাই কয়, he or she says" }
      - word: "চাৰিআলিত"
        modern: "চাৰিআলিত"
        reading: "sāriālit"
        ipa: "saɹialit"
        meaning: { en: "at the crossroads" }
        note: { en: "চাৰিআলি with -ত, 'at'" }
    questions:
      - id: as-0472
        prompt: { en: "How much is the bus fare?" }
        options:
          - { en: "10 rupees" }
          - { en: "20 rupees" }
          - { en: "5 rupees" }
        answer: 1
      - id: as-0473
        prompt: { en: "Mamoni finds a free seat on the bus." }
        answer: false
      - id: as-0474
        prompt: { en: "Where does Mamoni get off?" }
        options:
          - { en: "At the crossroads" }
          - { en: "At the station" }
          - { en: "At the market" }
        answer: 1
  - id: as-aitar-mas-04
    title: "Sour fish curry"
    theme: eating-out
    sentences:
      - text: "ঘৰত আইতাই মাছৰ টেঙা ৰান্ধে।"
        reading: "ghôrôt āitāi māsôr teṅā rāndhe."
        ipa: "ɡʱɔɹɔt aitai masɔɹ teŋa ɹandʱe"
      - text: "দুপৰীয়া দুয়ো একেলগে ভাত খায়।"
        reading: "duporiyā duyu ekelôge bhāt khāy."
        ipa: "dupoɹija dujʊ ekelɔɡe bʱat kʰaj"
      - text: "আইতাই সোধে: সোৱাদ লাগিছে নে?"
        reading: "āitāi xudhe: xuwād lāgise ne?"
        ipa: "aitai xʊdʱe xʊwad laɡise ne"
      - text: "মামণিয়ে কয়: বৰ সোৱাদ লাগিছে, আইতা!"
        reading: "māmoniye kôy: bôr xuwād lāgise, āitā!"
        ipa: "mamonije kɔj bɔɹ xʊwad laɡise aita"
    glossary:
      - word: "আইতাই"
        modern: "আইতাই"
        reading: "āitāi"
        ipa: "aitai"
        meaning: { en: "Grandmother (doing something)" }
        note: { en: "after a vowel the doer's -এ is -ই" }
      - word: "মাছৰ"
        modern: "মাছৰ"
        reading: "māsôr"
        ipa: "masɔɹ"
        meaning: { en: "of fish; the fish's" }
        note: { en: "-ৰ, 'of', with -অ- after a consonant" }
      - word: "ৰান্ধে"
        modern: "ৰান্ধে"
        reading: "rāndhe"
        ipa: "ɹandʱe"
        meaning: { en: "cooks" }
        note: { en: "from ৰন্ধা (rondha), to cook" }
      - word: "দুয়ো"
        modern: "দুয়ো"
        reading: "duyu"
        ipa: "dujʊ"
        meaning: { en: "both of them" }
        note: { en: "from দুই, two" }
      - word: "সোধে"
        modern: "সোধে"
        reading: "xudhe"
        ipa: "xʊdʱe"
        meaning: { en: "asks" }
        note: { en: "from সোধা (xudha), to ask" }
      - word: "মামণিয়ে"
        modern: "মামণিয়ে"
        reading: "māmoniye"
        ipa: "mamonije"
        meaning: { en: "Mamoni (doing something to something)" }
        note: { en: "-এ, here -য়ে, marks the doer of a verb that has an object: মামণিয়ে দাম সোধে, Mamoni asks the price" }
      - word: "কয়"
        modern: "কয়"
        reading: "kôy"
        ipa: "kɔj"
        meaning: { en: "says" }
        note: { en: "from কোৱা (kuwa), to say: সি কয়, তাই কয়, he or she says" }
    questions:
      - id: as-0475
        prompt: { en: "What does Grandmother cook?" }
        options:
          - { en: "A sour fish curry" }
          - { en: "Chicken" }
          - { en: "Rice cakes" }
        answer: 1
      - id: as-0476
        prompt: { en: "Mamoni doesn't like the food." }
        answer: false
