schema: 1
id: as-en-reading-aitar-mas
name: "Reading: Fish for Grandmother"
kind: reading
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
source: "Written for this deck and released under CC0"
description: "আইতাৰ বাবে মাছ, Fish for Grandmother: a short story in four scenes, written for this deck in everyday Assamese and released under CC0. Mamoni goes to the market for her grandmother, bargains for fish, rides the bus home, and sits down to a sour fish curry. The glossary gives the words and forms the theme decks don't teach. Not yet checked by an Assamese speaker: please report any mistake."
tags: [reading, unreviewed]
passages:
  - id: as-aitar-mas-01
    title: "Sunday morning"
    theme: daily-life
    sentences:
      - text: "আজি দেওবাৰ।"
        reading: "aji deubar."
      - text: "মামণি ৰাতিপুৱা সাত বজাত উঠে।"
        reading: "mamoni ratipuwa xat bojat uthe."
      - text: "তাই চাহ বনাই আইতাক দিয়ে।"
        reading: "tai sah bonai aitak diye."
      - text: "আইতাই কয়: ঘৰত মাছ নাই, বজাৰলৈ যোৱা।"
        reading: "aitai koy: ghorot mas nai, bojaroloi juwa."
      - text: "মামণি মোনা লৈ বজাৰলৈ যায়।"
        reading: "mamoni muna loi bojaroloi jay."
    glossary:
      - word: "মামণি"
        modern: "মামণি"
        reading: "mamoni"
        meaning: { en: "Mamoni, a girl's name" }
        note: { en: "also a pet name for a little girl" }
      - word: "উঠে"
        modern: "উঠে"
        reading: "uthe"
        meaning: { en: "gets up" }
        note: { en: "from উঠা (utha), to get up" }
      - word: "বনাই"
        modern: "বনাই"
        reading: "bonai"
        meaning: { en: "having made" }
        note: { en: "from বনোৱা (bonuwa), to make. The -ই form joins two actions: she makes tea and gives it" }
      - word: "আইতাক"
        modern: "আইতাক"
        reading: "aitak"
        meaning: { en: "to Grandmother; (to) her grandmother" }
        note: { en: "আইতা with -ক, 'to'. It is also how Assamese says 'her grandmother'" }
      - word: "দিয়ে"
        modern: "দিয়ে"
        reading: "diye"
        meaning: { en: "gives" }
        note: { en: "from দিয়া (diya), to give" }
      - word: "আইতাই"
        modern: "আইতাই"
        reading: "aitai"
        meaning: { en: "Grandmother (doing something)" }
        note: { en: "after a vowel the doer's -এ is -ই" }
      - word: "কয়"
        modern: "কয়"
        reading: "koy"
        meaning: { en: "says" }
        note: { en: "from কোৱা (kuwa), to say: সি কয়, তাই কয়, he or she says" }
      - word: "লৈ"
        modern: "লৈ"
        reading: "loi"
        meaning: { en: "taking; with" }
        note: { en: "from লোৱা (luwa), to take: মোনা লৈ, taking a bag" }
    questions:
      - id: as-0466
        prompt: { en: "What day is it?" }
        options:
          - { en: "Saturday" }
          - { en: "Sunday" }
          - { en: "Monday" }
        answer: 2
      - id: as-0467
        prompt: { en: "Mamoni makes tea for her grandmother." }
        answer: true
      - id: as-0468
        prompt: { en: "Why does Mamoni go to the market?" }
        options:
          - { en: "There is no fish at home." }
          - { en: "Her grandmother is ill." }
          - { en: "She wants to buy tea." }
        answer: 1
  - id: as-aitar-mas-02
    title: "At the market"
    theme: market
    sentences:
      - text: "বজাৰত বৰ ভিৰ।"
        reading: "bojarot bor bhir."
      - text: "মামণিয়ে মাছৰ দাম সোধে।"
        reading: "mamoniye masor dam xudhe."
      - text: "দোকানীয়ে কয়: কিলোত দুশ টকা।"
        reading: "dukaniye koy: kilot dux toka."
      - text: "মামণিয়ে কয়: বেছি দাম! অলপ কম কৰক।"
        reading: "mamoniye koy: besi dam! olop kom korok."
      - text: "দোকানীয়ে হাঁহি হাঁহি এশ আশী টকা লয়।"
        reading: "dukaniye hahi hahi ex axi toka loy."
      - text: "মামণিয়ে এক কিলো মাছ আৰু আধা কিলো বিলাহী কিনে।"
        reading: "mamoniye ek kilo mas aru adha kilo bilahi kine."
    glossary:
      - word: "বজাৰত"
        modern: "বজাৰত"
        reading: "bojarot"
        meaning: { en: "in the market" }
        note: { en: "বজাৰ with -অত, 'in'" }
      - word: "মামণিয়ে"
        modern: "মামণিয়ে"
        reading: "mamoniye"
        meaning: { en: "Mamoni (doing something to something)" }
        note: { en: "-এ, here -য়ে, marks the doer of a verb that has an object: মামণিয়ে দাম সোধে, Mamoni asks the price" }
      - word: "মাছৰ"
        modern: "মাছৰ"
        reading: "masor"
        meaning: { en: "of fish; the fish's" }
        note: { en: "-ৰ, 'of', with -অ- after a consonant" }
      - word: "সোধে"
        modern: "সোধে"
        reading: "xudhe"
        meaning: { en: "asks" }
        note: { en: "from সোধা (xudha), to ask" }
      - word: "দোকানীয়ে"
        modern: "দোকানীয়ে"
        reading: "dukaniye"
        meaning: { en: "the seller (doing something)" }
        note: { en: "দোকানী, shopkeeper, with the doer's -এ" }
      - word: "কয়"
        modern: "কয়"
        reading: "koy"
        meaning: { en: "says" }
        note: { en: "from কোৱা (kuwa), to say: সি কয়, তাই কয়, he or she says" }
      - word: "কিলোত"
        modern: "কিলোত"
        reading: "kilot"
        meaning: { en: "per kilo; a kilo" }
        note: { en: "কিলো with -ত, 'in, at': the price at a kilo" }
      - word: "হাঁহি হাঁহি"
        modern: "হাঁহি হাঁহি"
        reading: "hahi hahi"
        meaning: { en: "smiling all the while" }
        note: { en: "from হাঁহা (haha), to laugh; said twice, it goes on" }
      - word: "লয়"
        modern: "লয়"
        reading: "loy"
        meaning: { en: "takes" }
        note: { en: "from লোৱা (luwa), to take" }
      - word: "কিনে"
        modern: "কিনে"
        reading: "kine"
        meaning: { en: "buys" }
        note: { en: "from কিনা (kina), to buy" }
    questions:
      - id: as-0469
        prompt: { en: "What does the seller first ask for a kilo of fish?" }
        options:
          - { en: "150 rupees" }
          - { en: "200 rupees" }
          - { en: "250 rupees" }
        answer: 2
      - id: as-0470
        prompt: { en: "Mamoni bargains with the seller." }
        answer: true
      - id: as-0471
        prompt: { en: "What does Mamoni buy?" }
        options:
          - { en: "Fish and tomatoes" }
          - { en: "Fish and onions" }
          - { en: "Chicken and eggs" }
        answer: 1
  - id: as-aitar-mas-03
    title: "On the bus"
    theme: transport
    sentences:
      - text: "মামণি বাছেৰে ঘৰলৈ উভতি যায়।"
        reading: "mamoni basere ghoroloi ubhoti jay."
      - text: "বাছত এটাও ছিট খালী নাই।"
        reading: "basot etau sit khali nai."
      - text: "কণ্ডাক্টৰে ভাড়া বিচাৰে: দহ টকা।"
        reading: "kondaktore bhara bisare: doh toka."
      - text: "মামণিয়ে কয়: চাৰিআলিত ৰখাই দিয়ক।"
        reading: "mamoniye koy: sarialit rokhai diyok."
    glossary:
      - word: "মামণি"
        modern: "মামণি"
        reading: "mamoni"
        meaning: { en: "Mamoni, a girl's name" }
        note: { en: "also a pet name for a little girl" }
      - word: "বাছেৰে"
        modern: "বাছেৰে"
        reading: "basere"
        meaning: { en: "by bus" }
        note: { en: "-এৰে, 'by, with'" }
      - word: "উভতি"
        modern: "উভতি"
        reading: "ubhoti"
        meaning: { en: "returning; back" }
        note: { en: "from উভতা (ubhota), to return: উভতি যায়, goes back" }
      - word: "বাছত"
        modern: "বাছত"
        reading: "basot"
        meaning: { en: "on the bus" }
        note: { en: "বাছ with -অত, 'in, on'" }
      - word: "এটাও"
        modern: "এটাও"
        reading: "etau"
        meaning: { en: "not even one (with a negative verb)" }
        note: { en: "এটা, one, with -ও, 'even'" }
      - word: "কণ্ডাক্টৰে"
        modern: "কণ্ডাক্টৰে"
        reading: "kondaktore"
        meaning: { en: "the conductor (doing something)" }
        note: { en: "from English conductor, with the doer's -এ" }
      - word: "বিচাৰে"
        modern: "বিচাৰে"
        reading: "bisare"
        meaning: { en: "asks for; wants" }
        note: { en: "from বিচৰা (bisora), to look for; to want" }
      - word: "মামণিয়ে"
        modern: "মামণিয়ে"
        reading: "mamoniye"
        meaning: { en: "Mamoni (doing something to something)" }
        note: { en: "-এ, here -য়ে, marks the doer of a verb that has an object: মামণিয়ে দাম সোধে, Mamoni asks the price" }
      - word: "কয়"
        modern: "কয়"
        reading: "koy"
        meaning: { en: "says" }
        note: { en: "from কোৱা (kuwa), to say: সি কয়, তাই কয়, he or she says" }
      - word: "চাৰিআলিত"
        modern: "চাৰিআলিত"
        reading: "sarialit"
        meaning: { en: "at the crossroads" }
        note: { en: "চাৰিআলি with -ত, 'at'" }
    questions:
      - id: as-0472
        prompt: { en: "How much is the bus fare?" }
        options:
          - { en: "10 rupees" }
          - { en: "20 rupees" }
          - { en: "5 rupees" }
        answer: 1
      - id: as-0473
        prompt: { en: "Mamoni finds a free seat on the bus." }
        answer: false
      - id: as-0474
        prompt: { en: "Where does Mamoni get off?" }
        options:
          - { en: "At the crossroads" }
          - { en: "At the station" }
          - { en: "At the market" }
        answer: 1
  - id: as-aitar-mas-04
    title: "Sour fish curry"
    theme: eating-out
    sentences:
      - text: "ঘৰত আইতাই মাছৰ টেঙা ৰান্ধে।"
        reading: "ghorot aitai masor tenga randhe."
      - text: "দুপৰীয়া দুয়ো একেলগে ভাত খায়।"
        reading: "duporiya duyu ekeloge bhat khay."
      - text: "আইতাই সোধে: সোৱাদ লাগিছে নে?"
        reading: "aitai xudhe: xuwad lagise ne?"
      - text: "মামণিয়ে কয়: বৰ সোৱাদ লাগিছে, আইতা!"
        reading: "mamoniye koy: bor xuwad lagise, aita!"
    glossary:
      - word: "আইতাই"
        modern: "আইতাই"
        reading: "aitai"
        meaning: { en: "Grandmother (doing something)" }
        note: { en: "after a vowel the doer's -এ is -ই" }
      - word: "মাছৰ"
        modern: "মাছৰ"
        reading: "masor"
        meaning: { en: "of fish; the fish's" }
        note: { en: "-ৰ, 'of', with -অ- after a consonant" }
      - word: "ৰান্ধে"
        modern: "ৰান্ধে"
        reading: "randhe"
        meaning: { en: "cooks" }
        note: { en: "from ৰন্ধা (rondha), to cook" }
      - word: "দুয়ো"
        modern: "দুয়ো"
        reading: "duyu"
        meaning: { en: "both of them" }
        note: { en: "from দুই, two" }
      - word: "সোধে"
        modern: "সোধে"
        reading: "xudhe"
        meaning: { en: "asks" }
        note: { en: "from সোধা (xudha), to ask" }
      - word: "মামণিয়ে"
        modern: "মামণিয়ে"
        reading: "mamoniye"
        meaning: { en: "Mamoni (doing something to something)" }
        note: { en: "-এ, here -য়ে, marks the doer of a verb that has an object: মামণিয়ে দাম সোধে, Mamoni asks the price" }
      - word: "কয়"
        modern: "কয়"
        reading: "koy"
        meaning: { en: "says" }
        note: { en: "from কোৱা (kuwa), to say: সি কয়, তাই কয়, he or she says" }
    questions:
      - id: as-0475
        prompt: { en: "What does Grandmother cook?" }
        options:
          - { en: "A sour fish curry" }
          - { en: "Chicken" }
          - { en: "Rice cakes" }
        answer: 1
      - id: as-0476
        prompt: { en: "Mamoni doesn't like the food." }
        answer: false
