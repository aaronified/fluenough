passages:
  - id: "as-cricket-talk"
    title: "Friends talk about a cricket match"
    theme: "sports"
    sentences:
      - text: "কালি ক্ৰিকেট খেলা হ'ল।"
        reading: "kāli kriket khelā hol."
      - text: "আমি জিকিলোঁ।"
        reading: "āmi zikilum̐."
      - text: "দলনায়কে বহুত ভাল খেলিলে।"
        reading: "dôlônāyôke bohut bhāl khelile."
      - text: "আহক, আকৌ খেলোঁ।"
        reading: "āhôk, ākôu khelum̐."
    questions:
      - id: "as-3744"
        prompt: { en: "The friends played cricket yesterday." }
        answer: true
      - id: "as-3745"
        prompt: { en: "Who won the match?" }
        options:
          - { en: "The speakers" }
          - { en: "The other team" }
          - { en: "Nobody" }
        answer: 1
      - id: "as-3746"
        prompt: { en: "What do the friends suggest?" }
        options:
          - { en: "To play again" }
          - { en: "To stop" }
          - { en: "To go home" }
        answer: 1
  - id: "as-match-report"
    title: "A short match report"
    theme: "sports"
    sentences:
      - text: "দল আজি ভালকৈ খেলিলে।"
        reading: "dôl āzi bhālôkôi khelile."
      - text: "এক গ'ল দিলে।"
        reading: "ek gol dile."
      - text: "শেষত আমি জিকিলোঁ।"
        reading: "xexôt āmi zikilum̐."
      - text: "প্ৰশিক্ষক খুচীয়া।"
        reading: "proxikkhôk khusiyā."
    questions:
      - id: "as-3747"
        prompt: { en: "The team played well today." }
        answer: true
      - id: "as-3748"
        prompt: { en: "How many goals were scored?" }
        options:
          - { en: "One" }
          - { en: "Two" }
          - { en: "Three" }
        answer: 1
      - id: "as-3749"
        prompt: { en: "How does the coach feel?" }
        options:
          - { en: "Sad" }
          - { en: "Happy" }
          - { en: "Angry" }
        answer: 2
