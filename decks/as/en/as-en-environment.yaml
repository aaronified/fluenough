schema: 1
id: "as-en-environment"
kind: "layer"
core: "as-environment"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Environment: air, pollution, waste and care"
license: "CC-BY-SA-4.0"
description: "Caring for the world we live in: the air, the pollution, the waste, the trees and the rivers that need looking after. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3489":
    native: "environment"
    notes:
      "n1": "The surroundings of living things: the air, the water, the land."
    examples:
      "পৰিৱেশ ভাল।": "The environment is good."
      "পৰিৱেশ ৰক্ষা কৰা।": { native: "To protect the environment.", bases: { "ৰক্ষা": "protection; safety" } }
  "as-3490":
    native: "pollution"
    notes:
      "n1": "Dirt that spoils the air, the water or the land."
    examples:
      "দূষণ বহুত।": "There is a lot of pollution."
      "দূষণ বেয়া।": "Pollution is bad."
  "as-3491":
    native: "air"
    notes:
      "n1": "The air we breathe. The ordinary word is বতাহ (bôtāh) for moving air."
    examples:
      "বায়ু পৰিষ্কাৰ।": "The air is clean."
      "বায়ু ভাল।": "The air is good."
  "as-3492":
    native: "water pollution"
    notes:
      "n1": "Dirty water in rivers and ponds."
    examples:
  "as-3493":
    native: "tree (formal)"
    notes:
      "n1": "The formal word for tree; in speech: গছ (gôs)."
    examples:
      "বৃক্ষ বহুত।": "There are many trees."
      "বৃক্ষ ৰোপণ কৰা।": "To plant trees."
  "as-3494":
    native: "planting"
    notes:
      "n1": "The act of planting a tree or a seed."
    examples:
      "ৰোপণ ভাল।": "The planting is good."
      "ৰোপণ বহুত।": "There is a lot of planting."
  "as-3495":
    native: "waste; refuse"
    notes:
      "n1": "Things thrown away that can be recycled or burnt."
    examples:
      "বৰ্জ্য বহুত।": "There is a lot of waste."
      "বৰ্জ্য পেলোৱা।": "To throw away the waste."
  "as-3496":
    native: "reuse; recycling"
    notes:
      "n1": "Using something again instead of throwing it away."
    examples:
      "পুনৰ্ব্যৱহাৰ ভাল।": "Reuse is good."
      "পুনৰ্ব্যৱহাৰ কৰা।": "To reuse."
  "as-3497":
    native: "conservation; protection"
    notes:
      "n1": "Keeping nature and resources safe for the future."
    examples:
      "সংৰক্ষণ কৰা।": "To conserve."
      "সংৰক্ষণ ভাল।": "Conservation is good."
  "as-3498":
    native: "cutting trees"
    notes:
      "n1": "Cutting wood from the trees."
    examples:
  "as-3499":
    native: "climate change"
    notes:
      "n1": "The change in the usual weather of the earth."
    bases:
      "পৰিৱৰ্তন": "change"
    examples:
  "as-3500":
    native: "polluted; dirty"
    notes:
      "n1": "Spoilt by dirt or poison."
    examples:
      "পানী দূষিত।": "The water is polluted."
      "বায়ু দূষিত।": "The air is polluted."
  "as-3501":
    native: "green (of nature)"
    notes:
      "n1": "The green of trees and fields. Another word for green is সেউজীয়া (seuziyā)."
    examples:
      "সবুজ গছ।": "Green trees."
      "সবুজ পৰিৱেশ।": "A green environment."
  "as-3502":
    native: "river pollution"
    notes:
      "n1": "Pollution of the river water."
