schema: 1
id: "as-en-about-me"
kind: "layer"
core: "as-about-me"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "About me"
license: "CC0-1.0"
description: "Your name, where you are from, where you live, and the languages you speak. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0166":
    native: "name"
  "as-0167":
    native: "My name is …"
    notes:
      "n1": "There is no 'is': 'my name …'. মোৰ (mur), my, is said with an o close to u."
  "as-0168":
    native: "What is your name?"
    notes:
      "n1": "To a child or a friend: তোমাৰ নাম কি? (tumar nam ki?)."
  "as-0169":
    native: "I'm from …"
    notes:
      "n1": "Literally 'I have come from …'. -ৰ পৰা (-r pora), 'from', comes after the place: গুৱাহাটীৰ পৰা (guwāhātir pôrā), from Guwahati."
  "as-0170":
    native: "I live in …"
    notes:
      "n1": "-ত (-t), 'in', joins the end of the place: গুৱাহাটীত (guwāhātit), in Guwahati. After a consonant it is -অত (-ôt): অসমত (ôxômôt), in Assam."
  "as-0052":
    notes:
      "n1": "আপোনাৰ ঘৰ ক (āpunār ghôr kô)'ত? (apunar ghor kot?), 'where is your home?', asks where your family comes from, and is often the first question."
  "as-0171":
    native: "family"
  "as-0120":
    notes:
      "n1": "In this deck: work, what you do."
  "as-0172":
    native: "village; home village"
    notes:
      "n1": "Many people in Guwahati still call the village their family comes from home."
  "as-0173":
    native: "country"
    notes:
      "n1": "শ (xô) is the rasp x. The state song of Assam is ও মোৰ আপোনাৰ দেশ (o mur āpunār dex), 'O my own dear land'."
  "as-0174":
    native: "language"
  "as-0175":
    native: "Assamese (the language; a person from Assam)"
    notes:
      "n1": "Chat writes it Axomiya or Oxomiya. In English it is also called Asamiya."
  "as-0176":
    native: "English (the language)"
    notes:
      "n1": "মই ইংৰাজী ক (moi iṅrāzi kô)'ব পাৰোঁ (moi ingraji kobo paru), I can speak English."
  "as-0177":
    native: "age"
    notes:
      "n1": "আপোনাৰ বয়স কিমান? (apunar boyox kiman?), how old are you?"
