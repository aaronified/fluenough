schema: 1
id: "as-en-government"
kind: "layer"
core: "as-government"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Government: offices, forms, laws and elections"
license: "CC-BY-SA-4.0"
description: "How the state works for its people: the government office, the officer, the certificate, the permit and the vote. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3390":
    native: "government"
    notes:
      "n1": "The people who run the state and make its rules."
    examples:
      "সৰকাৰ ডাঙৰ।": "The government is big."
      "সৰকাৰ আহিছে।": "The government has come."
  "as-3391":
    native: "government (of the state); official"
    notes:
      "n1": "Of the state: সৰকাৰী অফিচ (xôrkāri ophis), a government office."
    examples:
      "সৰকাৰী কাম।": "Government work."
      "এইটো সৰকাৰী।": "This is official."
  "as-3392":
    native: "officer"
    notes:
      "n1": "A person in charge in an office. Written as said in English."
    examples:
      "অফিচাৰ আহিছে।": "The officer has come."
      "অফিচাৰ ভাল।": "The officer is good."
  "as-3393":
    native: "rule; regulation"
    notes:
      "n1": "What must be done by everyone."
    examples:
      "নিয়ম মানা।": { native: "To follow the rule.", bases: { "মানা": "to obey; to accept" } }
      "নিয়ম বহুত।": "There are many rules."
  "as-3394":
    native: "certificate"
    notes:
      "n1": "A paper that proves something, such as a birth or a degree."
    examples:
      "প্ৰমাণপত্ৰ লাগে।": "A certificate is needed."
      "প্ৰমাণপত্ৰ আছে।": { native: "There is a certificate.", bases: { "আছে": "to be; there is; to have" } }
  "as-3395":
    native: "citizen"
    notes:
      "n1": "A person who belongs to a country and has its rights."
    examples:
      "নাগৰিক ভাল।": "The citizen is good."
      "নাগৰিক বহুত।": "There are many citizens."
  "as-3396":
    native: "minister"
    notes:
      "n1": "A member of the government who leads a department."
    examples:
      "মন্ত্ৰী আহিছে।": "The minister has come."
      "মন্ত্ৰী ব্যস্ত।": "The minister is busy."
  "as-3397":
    native: "parliament"
    notes:
      "n1": "The group of elected people who make the laws."
    examples:
      "সংসদ ডাঙৰ।": "The parliament is big."
      "সংসদত মানুহ।": { native: "There are people in parliament.", bases: { "সংসদত": "parliament" } }
  "as-3398":
    native: "centre; the central government"
    notes:
      "n1": "The middle, or the national government of the whole country."
    examples:
      "কেন্দ্ৰ ডাঙৰ।": "The centre is big."
      "কেন্দ্ৰত অফিচ।": { native: "There is an office at the centre.", bases: { "কেন্দ্ৰত": "centre; the central government" } }
  "as-3399":
    native: "application form"
    notes:
      "n1": "The paper you fill in to ask for something from an office."
    examples:
      "আবেদনপত্ৰ লাগে।": "An application form is needed."
      "আবেদনপত্ৰ পূৰণ কৰা।": "To fill in the application form."
  "as-3400":
    native: "permission"
    notes:
      "n1": "The approval to do something."
    examples:
      "অনুমতি আছে।": { native: "There is permission.", bases: { "আছে": "to be; there is; to have" } }
      "অনুমতি নাই।": "There is no permission."
  "as-3401":
    native: "licence"
    notes:
      "n1": "An official paper that allows you to do something, such as drive. Written as said in English."
    examples:
      "লাইচেন্স আছে নেকি?": { native: "Do you have a licence?", bases: { "আছে": "to be; there is; to have" } }
      "লাইচেন্স নাই।": "There is no licence."
  "as-3402":
    native: "voter"
    notes:
      "n1": "A person who is allowed to vote in an election."
    examples:
      "ভোটাৰ বহুত।": "There are many voters."
      "ভোটাৰ আহিছে।": "The voter has come."
  "as-3403":
    native: "member of the legislative assembly"
    notes:
      "n1": "An elected person who represents a constituency in the state assembly."
    examples:
      "বিধায়ক আহিছে।": "The MLA has come."
      "বিধায়ক ব্যস্ত।": "The MLA is busy."
  "as-3404":
    native: "to approve"
    notes:
      "n1": "To say yes to a request or a plan."
    bases:
      "অনুমোদন": "approval"
    examples:
  "as-3405":
    native: "citizenship"
    notes:
      "n1": "Being a citizen of the country."
    examples:
      "নাগৰিকত্ব ভাল।": "Citizenship is good."
      "নাগৰিকত্ব আছে।": { native: "There is citizenship.", bases: { "আছে": "to be; there is; to have" } }
