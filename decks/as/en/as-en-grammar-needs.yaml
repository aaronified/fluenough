schema: 1
id: "as-en-grammar-needs"
kind: "layer"
core: "as-grammar-needs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Need and want"
license: "CC0-1.0"
description: "লাগে (lāge), নালাগে (nālāge) and দৰকাৰ (dôrkār): what you need, what you want, and what you don't. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-2062":
    native: "is needed; is wanted"
    notes:
      "n1": "It stays the same whoever needs it, and the one who needs takes -ক (-kô): মোক (muk), তোমাক (tumāk), আপোনাক (āpunāk) … লাগে (lāge), 'to me it is needed'."
  "as-2063":
    native: "What would you like? (what a shopkeeper asks)"
  "as-2064":
    native: "I'd like some water."
  "as-2065":
    native: "is not needed; no, thank you"
    notes:
      "n1": "The opposite of লাগে (lāge): মোক নালাগে (muk nālāge), I don't want it. On its own, a polite no."
  "as-2066":
    native: "I don't want this."
  "as-2067":
    native: "need; necessary"
    notes:
      "n1": "The one who needs takes -ৰ (-rô): মোৰ টকাৰ দৰকাৰ (mur tôkār dôrkār), I need money, 'of me there is need of money'."
  "as-2068":
    native: "There's no need."
  "as-2069":
    native: "I need some help."
  "as-2070":
    native: "I want to go home."
    notes:
      "n1": "To want to do something: the verb in -ব (-bô), then খোজা (khuzā), to want: যাব খুজিছোঁ (zāb khuzisum̐), I want to go."
  "as-2071":
    native: "I'd like a little more rice."
    notes:
      "n1": "মোক (muk) can be left out when it is clear who needs it."
