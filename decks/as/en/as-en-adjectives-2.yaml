schema: 1
id: "as-en-adjectives-2"
kind: "layer"
core: "as-adjectives-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing a room"
license: "CC-BY-SA-4.0"
description: "How a room looks and feels: light or dark, smooth or rough, warm or cool, and the things in it, the walls, the roof and the cupboard. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3060":
    native: "lit; bright (with light)"
    notes:
      "n1": "A room with plenty of light in it. The opposite is অন্ধকাৰ (ôndhôkār)."
    examples:
      "কোঠাটো আলোকিত।": "The room is lit."
      "ঘৰ আলোকিত।": "The house is bright."
  "as-3061":
    native: "dark"
    notes:
      "n1": "With no light. The opposite is আলোকিত (ālokit)."
    examples:
      "কোঠা অন্ধকাৰ।": "The room is dark."
      "ৰাতি অন্ধকাৰ।": "The night is dark."
  "as-3062":
    native: "bright; brilliant"
    notes:
      "n1": "Of a light or colour that shines strongly."
    examples:
      "আলো উজ্জ্বল।": "The light is bright."
      "ৰং উজ্জ্বল।": "The colour is bright."
  "as-3063":
    native: "smooth; sleek"
    notes:
      "n1": "Smooth to touch, like polished wood or stone. The opposite is খৰখৰীয়া (khôrôkhôriyā)."
    examples:
      "মেজ চিকণ।": "The table is smooth."
      "দেৱাল চিকণ।": "The wall is smooth."
  "as-3064":
    native: "rough; coarse"
    notes:
      "n1": "Rough to touch, like a brick wall or old cloth. The opposite is চিকণ (sikôṇ)."
    examples:
      "দেৱাল খৰখৰীয়া।": "The wall is rough."
      "মাটি খৰখৰীয়া।": "The ground is rough."
  "as-3065":
    native: "comfortable; cosy"
    notes:
      "n1": "Of a chair, a bed or a room that is nice to be in."
    examples:
      "চকী আৰামী।": "The chair is comfortable."
      "বিচনা আৰামী।": "The bed is comfortable."
  "as-3066":
    native: "thick; dense; close together"
    notes:
      "n1": "Of a thing packed close together, like a dense forest or thick cloth."
    examples:
      "ঘন জংগল।": "A dense jungle."
      "ঘন বৰষুণ।": "Heavy, thick rain."
  "as-3067":
    native: "cool; cold (not harsh)"
    notes:
      "n1": "Pleasantly cool, not cold like winter."
    examples:
      "কোঠা শীতল।": "The room is cool."
      "পানী শীতল।": "The water is cool."
  "as-3068":
    native: "floor (of a room)"
    notes:
      "n1": "The floor you stand on inside a room. A storey of a building is মহলা (môhôlā)."
    examples:
      "তলা চিকণ।": "The floor is smooth."
      "তলাত মানুহ।": { native: "There are people on the floor.", bases: { "তলাত": "floor (of a room)" } }
  "as-3069":
    native: "roof"
    notes:
      "n1": "The top covering of a house, of tin or of grass."
    examples:
      "চাল ওপৰত।": "The roof is above."
      "চাল নতুন।": "The roof is new."
  "as-3070":
    native: "wall"
    notes:
      "n1": "The side of a room."
    examples:
      "দেৱাল সেউজ।": "The wall is green."
      "দেৱালত ছবি।": { native: "There is a picture on the wall.", bases: { "দেৱালত": "wall" } }
  "as-3071":
    native: "cupboard; cabinet"
    notes:
      "n1": "A cupboard with doors, for clothes and books."
    examples:
      "আলমাৰী ডাঙৰ।": "The cupboard is big."
      "আলমাৰীত কাপোৰ।": { native: "Clothes in the cupboard.", bases: { "আলমাৰীত": "cupboard; cabinet" } }
  "as-3072":
    native: "shelf"
    notes:
      "n1": "A flat board on a wall to put things on."
    examples:
      "ৰেকত কিতাপ।": { native: "Books on the shelf.", bases: { "ৰেকত": "shelf" } }
      "ৰেক সৰু।": "The shelf is small."
  "as-3073":
    native: "carpet; rug"
    notes:
      "n1": "A soft floor covering. Written as said in English."
    examples:
      "কাৰ্পেট নতুন।": "The carpet is new."
      "কাৰ্পেটত বহা।": { native: "Sit on the carpet.", bases: { "কাৰ্পেটত": "carpet; rug" } }
  "as-3074":
    native: "curtain"
    notes:
      "n1": "The cloth hung at a window to keep out the light."
    examples:
      "পৰ্দা ৰঙা।": "The curtain is red."
      "খিৰিকীত পৰ্দা।": "A curtain at the window."
  "as-3075":
    native: "light"
    notes:
      "n1": "Light from the sun, a lamp or a bulb."
    examples:
      "আলো বহুত।": "There is a lot of light."
      "আলো নাই।": "There is no light."
  "as-3076":
    native: "a wide room"
    notes:
      "n1": "A large, spacious room."
    examples:
  "as-3077":
    native: "a small room"
    notes:
      "n1": "A small room, such as a bedroom or a store."
    examples:
  "as-3078":
    native: "to decorate the house"
    notes:
      "n1": "To make a house look nice."
    examples:
