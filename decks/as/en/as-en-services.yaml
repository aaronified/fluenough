schema: 1
id: "as-en-services"
kind: "layer"
core: "as-services"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Services: bank, post, repair and tailor"
license: "CC-BY-SA-4.0"
description: "Going to the post office, the bank, the tailor and the repair shop, with the forms, the counter and the money. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3360":
    native: "post; mail"
    notes:
      "n1": "Letters and parcels sent through the post office."
    examples:
      "ডাক আহিছে।": "The post has come."
      "ডাক বহুত।": "There is a lot of post."
  "as-3361":
    native: "parcel"
    notes:
      "n1": "A box or packet sent by post. Written as said in English."
    examples:
      "পাৰ্চেল আহিছে।": "The parcel has come."
      "পাৰ্চেল ভাৰী।": "The parcel is heavy."
  "as-3362":
    native: "postage; postal charge"
    notes:
      "n1": "The money paid to send a letter or a parcel."
    examples:
      "ডাক-মাচুল কিমান?": "How much is the postage?"
      "ডাক-মাচুল বেছি।": "The postage is high."
  "as-3363":
    native: "counter"
    notes:
      "n1": "The table where you are served in an office or a shop. Written as said in English."
    examples:
      "কাউণ্টাৰত মানুহ।": { native: "There are people at the counter.", bases: { "কাউণ্টাৰত": "counter" } }
      "কাউণ্টাৰ খোলা।": "The counter is open."
  "as-3364":
    native: "form (to fill in)"
    notes:
      "n1": "A paper with spaces to write your name and details. Written as said in English."
    examples:
      "ফৰ্ম পূৰণ কৰা।": "To fill in the form."
      "ফৰ্ম নতুন।": "The form is new."
  "as-3365":
    native: "application"
    notes:
      "n1": "A written request for something, such as a job or a licence."
    examples:
      "আবেদন দিয়া।": "To give an application."
      "আবেদন ঠিক।": "The application is right."
  "as-3366":
    native: "repair"
    notes:
      "n1": "The act of fixing something that is broken."
    examples:
      "মেৰামতি কৰা।": "To repair."
      "মেৰামতি বহুত।": "There is a lot of repair work."
  "as-3367":
    native: "tailor"
    notes:
      "n1": "A person who sews clothes to measure."
    examples:
      "দৰ্জি ভাল।": "The tailor is good."
      "দৰ্জি আহিছে।": "The tailor has come."
  "as-3368":
    native: "sewing; stitching"
    notes:
      "n1": "The work of joining cloth with a needle and thread. The verb is সেলাই কৰা (selāi kôrā)."
    examples:
      "সেলাই ভাল।": "The stitching is good."
      "সেলাই কৰা।": "To sew."
  "as-3369":
    native: "service"
    notes:
      "n1": "The help a shop or an office gives to a customer."
    examples:
      "সেৱা ভাল।": "The service is good."
      "সেৱা বহুত।": "There is a lot of service."
  "as-3370":
    native: "loan; debt"
    notes:
      "n1": "Money borrowed from a bank that must be paid back."
    examples:
      "ঋণ লোৱা।": "To take a loan."
      "ঋণ বহুত।": "There is a lot of debt."
  "as-3371":
    native: "interest (on money)"
    notes:
      "n1": "The extra money a bank pays or charges on money kept or borrowed."
    examples:
      "সুদ বেছি।": "The interest is high."
      "সুদ কিমান?": "What is the interest?"
  "as-3372":
    native: "to deposit money"
    notes:
      "n1": "To put money into a bank account."
    bases:
      "জমা": "deposit; saved"
    examples:
  "as-3373":
    native: "it takes time"
    notes:
      "n1": "Of a task that needs a long time to finish."
    examples:
  "as-3374":
    native: "to fix; to arrange"
    notes:
      "n1": "To make something right or ready."
    examples:
  "as-3375":
    native: "to sew"
    notes:
      "n1": "To join cloth with a needle and thread."
