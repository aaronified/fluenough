schema: 1
id: "as-en-script"
kind: "layer"
core: "as-script"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How Assamese script works"
intro: "Assamese is written in the script it shares with Bengali, with two letters of its own. It is built from a few ideas that come back in letter after letter. They look strange at first because English has none of them. Once you have seen them, the letters start to make sense."
features:
  "headline":
    name: "The headline"
    text: "Most letters hang from a line along the top, and in a word the lines join into one. Read along the top, not along a baseline as in English."
  "half-headline":
    name: "Letters with half a headline"
    text: "Some letters carry only part of the line, so it stops short over them. Where it breaks often shows where one letter ends."
  "no-headline":
    name: "Letters with no headline"
    text: "A few letters and marks have no line at all and stand apart in a word."
  "assamese-letters":
    name: "Two letters of Assamese's own"
    text: "ৰ (r) is ব (bô) with a slanting stroke across it, and ৱ (w) is ব (bô) with a stroke below. Bengali writes r as র (rô), ব (bô) with a dot below, and has no w letter at all. Look closely at ব (bô), ৰ (rô) and ৱ (wô): one stroke tells them apart."
  "rows":
    name: "Rows of five"
    text: "Most consonants come in five rows of five, each named after its first letter: ক-বৰ্গ (kô-bôrg), চ-বৰ্গ (sô-bôrg), ট-বৰ্গ (tô-bôrg), ত-বৰ্গ (tô-bôrg) and প-বৰ্গ (pô-bôrg). The columns work the same way in every row: plain (ক), with a breath (খ), voiced (গ), voiced with a breath (ঘ), and through the nose (ঙ). Assamese no longer says every row as Sanskrit did: the চ (sô) row is s and z, and the ট (tô) row sounds like the ত (tô) row."
  "same-sound":
    name: "Several letters, one sound"
    text: "Spelling keeps letters that Assamese says alike. স (xô), শ (xô) and ষ (xô) are all x, a rasp at the back of the mouth; চ (sô) and ছ (sô) are both s; জ (zô), ঝ (zô) and য (zô) are z, written j in chat; ত (tô) and ট (tô) are one t. Learn each word's spelling as you meet it."
  "inherent-vowel":
    name: "The vowel you don't see"
    text: "Every consonant carries a vowel unless a sign changes it: the open o of অ (ô), like the aw in 'awe'. ক (kô) alone is ko. So কলম (kôlôm) is kolom, with no vowel written at all."
  "final-vowel":
    name: "The last o is usually not said"
    text: "At the end of most words the carried o goes quiet: ঘৰ (ghôr) is ghor, not ghoro, and অসম (ôxôm) is oxom. Some forms keep it, such as যাব (zābô), will go, so learn each word as it's said."
  "vowel-signs":
    name: "Vowels as signs on a letter"
    text: "After a consonant a vowel is a sign on it, not a letter of its own, named after its vowel: আকাৰ (ākār) is the sign for আ (ā). ি (i), ে (e) and ৈ (ôi) are written before the consonant but said after it: you see ি (i) then ক (kô), and say ki. ো (u) and ৌ (ôu) go on both sides: কো (ko) is ko."
  "apostrophe":
    name: "An apostrophe for o"
    text: "Assamese writes an apostrophe after a letter to show that its vowel is a closed o, not the open o it would carry: ক (kô)'ত (kot, where), হ (hô)'ল (hol, it became), ল (lô)'ৰা (lora, boy). Casual typing often leaves it out."
  "hoxonto":
    name: "The mark that takes the vowel away"
    text: "The small slanting stroke below a letter, ্, means no vowel after it. You'll rarely see it, because two consonants usually join instead."
  "conjuncts":
    name: "Letters that join"
    text: "Two consonants with no vowel between them are written as one shape, side by side or one above the other. Some look nothing like their parts: ক্ষ (kkhô) is ক (kô) and ষ (xô)."
  "r-forms":
    name: "ৰ (rô) written as a stroke"
    text: "Next to another consonant ৰ (rô) isn't written in full. After it, it's a stroke at its foot (প্ৰ); before it, a small hook on top, the reph (ৰ্ম)."
  "phola":
    name: "য (zô) written as a sign"
    text: "After a consonant য (zô) is written as a hook beside it (ব্য), said as a y glide: ব্যস্ত (byôstô, busy)."
  "dot-below":
    name: "A dot below makes another letter"
    text: "Some letters differ only by a dot below: ড (dô) and ড় (rô), ঢ (dhô) and ঢ় (rhô), য (zô) and য় (yô). Look for the dot every time. য (zô) is z, but য় (yô) is y; ড় (rô) is said like ৰ (rô)."
  "nasal-marks":
    name: "The moon and the circle"
    text: "The moon and dot ঁ (ôm̐) above a letter makes its vowel nasal, said through the nose as well, and it changes the word: বাহ (bāh) is a nest, বাঁহ (bām̐h, said through the nose) bamboo. Chat leaves it out. The small circle ং (ôṅ) after a vowel is ng: ৰং (rôṅ, colour)."
  "digits":
    name: "Assamese digits"
    text: "Assamese writes the same digits as Bengali, in prices, dates and phone numbers. ৪ (4) is 4, though it looks like an 8, and ৮ (8) is 8."
