      "c1": { why: "The perfect: I have read." }
      "c2": { why: "The past: I read." }
  "as-3420":
    native: "She cooks in order to eat."
    bases:
      "বাবে": "for; in order to"
    confusables:
      "c1": { why: "The perfect: she has eaten." }
      "c2": { why: "The if-form, not the purpose." }
  "as-3421":
    native: "He went to the market in order to buy."
    notes:
      "n1": "গ'ল (gol) is from যোৱা (zuwā), to go: the stem changes from যো- (zu-) to গ- (gô-)."
    bases:
      "বাবে": "for; in order to"
    confusables:
      "c1": { why: "The purpose of selling, the opposite." }
      "c2": { why: "The purpose of learning, another action." }
  "as-3422":
    native: "We go to school in order to learn."
    bases:
      "বাবে": "for; in order to"
    confusables:
      "c1": { why: "The purpose of reading, close but a different aim." }
      "c2": { why: "The purpose of drawing, another aim." }
  "as-3423":
    native: "I take paper in order to draw a picture."
    bases:
      "বাবে": "for; in order to"
    confusables:
      "c1": { why: "The purpose of buying, not drawing." }
      "c2": { why: "The purpose of sleeping, not drawing." }
  "as-3424":
    native: "He goes home in order to sleep."
    bases:
      "বাবে": "for; in order to"
    confusables:
      "c1": { why: "The purpose of going, the verb itself." }
      "c2": { why: "The purpose of coming, the opposite direction." }
