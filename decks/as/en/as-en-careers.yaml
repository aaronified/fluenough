schema: 1
id: "as-en-careers"
kind: "layer"
core: "as-careers"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Careers: jobs, work and interviews"
license: "CC-BY-SA-4.0"
description: "Looking for work and doing it: the job, the salary, the interview, the contract and the boss who gives the post. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3462":
    native: "salary; pay"
    notes:
      "n1": "The money paid each month for work."
    examples:
      "বেতন বেছি।": "The salary is high."
      "বেতন কিমান?": "What is the salary?"
  "as-3463":
    native: "to give an interview"
    notes:
      "n1": "To go to a job interview and answer the questions."
  "as-3464":
    native: "contract; agreement"
    notes:
      "n1": "A written agreement for work, with its terms."
    examples:
      "চুক্তি ঠিক।": "The contract is right."
      "চুক্তি পঢ়া।": "To read the contract."
  "as-3465":
    native: "experience"
    notes:
      "n1": "The work one has already done, and what one has learnt from it."
    examples:
      "অভিজ্ঞতা বহুত।": "There is a lot of experience."
      "অভিজ্ঞতা নাই।": "There is no experience."
  "as-3466":
    native: "qualification; skill"
    notes:
      "n1": "What a person can do well, or the degree they hold."
    examples:
      "যোগ্যতা আছে।": { native: "There is qualification.", bases: { "আছে": "to be; there is; to have" } }
      "যোগ্যতা ভাল।": "The qualification is good."
  "as-3467":
    native: "post; position"
    notes:
      "n1": "A place in an office or a company, with a name and a job."
    examples:
      "পদ খালী।": "The post is vacant."
      "এইটো পদ ডাঙৰ।": "This post is big."
  "as-3468":
    native: "progress; promotion"
    notes:
      "n1": "Getting better, or moving up at work."
    examples:
      "উন্নতি ভাল।": "The progress is good."
      "উন্নতি বহুত।": "There is a lot of progress."
  "as-3469":
    native: "to take leave"
    notes:
      "n1": "To stay away from work for a day or more."
  "as-3470":
    native: "employed; appointed"
    notes:
      "n1": "Of a person who has been given a job."
    examples:
      "তেওঁ নিযুক্ত।": "He is employed."
      "মই নিযুক্ত।": "I am employed."
  "as-3471":
    native: "unemployed; without work"
    notes:
      "n1": "Without a job, and looking for one."
    examples:
      "তাই বেকাৰ।": "She is unemployed."
      "বেকাৰ হৈ থকা।": { native: "To stay without work.", bases: { "হৈ": "to become; to be" } }
  "as-3472":
    native: "worker"
    notes:
      "n1": "A person who works with their hands or in a company."
    examples:
      "কৰ্মী বহুত।": "There are many workers."
      "কৰ্মী ভাল।": "The worker is good."
  "as-3473":
    native: "training"
    notes:
      "n1": "Learning a job or a skill from an expert."
    examples:
      "প্ৰশিক্ষণ লোৱা।": "To take training."
      "প্ৰশিক্ষণ ভাল।": "The training is good."
  "as-3474":
    native: "to take responsibility"
    notes:
      "n1": "To accept a duty at work."
