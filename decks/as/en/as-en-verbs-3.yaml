schema: 1
id: "as-en-verbs-3"
kind: "layer"
core: "as-verbs-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More daily actions"
license: "CC-BY-SA-4.0"
description: "Everyday verbs for moving, going in and out, throwing, running, tidying, asking and losing things. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-2910":
    native: "aeroplane; plane"
    notes:
      "n1": "Written as said in English."
    examples:
      "প্লেইন উৰে।": "The plane flies."
      "প্লেইন ডাঙৰ।": "The plane is big."
  "as-2911":
    native: "lamp; candle"
    notes:
      "n1": "A small light with oil or wax. Not the night: that is ৰাতি (rāti)."
    examples:
      "বাতি জ্বলে।": "The lamp burns."
      "বাতি ৰাখা।": "Put the lamp down."
  "as-2912":
    native: "to get down; to descend"
    notes:
      "n1": "To come down from a bus, a stair or a horse. The opposite is উঠা (uthā), to get up."
    examples:
      "মই বাছৰ পৰা নামোঁ।": { native: "I get down from the bus.", bases: { "নামোঁ": "to get down; to descend" } }
      "সি চিৰিৰে নামে।": { native: "He comes down the stairs.", bases: { "নামে": "to get down; to descend" } }
  "as-2913":
    native: "to enter; to go in"
    notes:
      "n1": "To go into a room or a house. The opposite is ওলোৱা (oluwā), to come out."
    examples:
      "তাই ঘৰলৈ সোমাল।": { native: "She went into the house.", bases: { "সোমাল": "to enter" } }
      "মই কোঠালৈ সোমাওঁ।": { native: "I go into the room.", bases: { "সোমাওঁ": "to enter" } }
  "as-2914":
    native: "to come out; to go out"
    notes:
      "n1": "To go outside from inside a place."
    examples:
      "মানুহ ওলাল।": { native: "The people came out.", bases: { "ওলাল": "to come out; to go out" } }
      "সি ঘৰৰ পৰা ওলাল।": { native: "He came out of the house.", bases: { "ওলাল": "to come out; to go out" } }
  "as-2915":
    native: "to throw"
    notes:
      "n1": "To throw something away or across the room."
    examples:
      "পাত ফালিলোঁ।": { native: "I threw away the leaf.", bases: { "ফালিলোঁ": "to throw" } }
      "তাই পাত ফালে।": { native: "She throws the leaf.", bases: { "ফালে": "to throw" } }
  "as-2916":
    native: "to fly"
    notes:
      "n1": "Of birds, aeroplanes and kites."
    examples:
      "চৰাই উৰে।": { native: "The bird flies.", bases: { "উৰে": "to fly" } }
      "প্লেইন উৰিছে।": { native: "The plane is flying.", bases: { "উৰিছে": "to fly" } }
  "as-2917":
    native: "to run"
    notes:
      "n1": "To run fast. A slow walk is চলা (sôlā)."
    examples:
      "ল'ৰা দৌৰে।": { native: "The boy runs.", bases: { "দৌৰে": "to run" } }
      "মই দৌৰোঁ।": { native: "I run.", bases: { "দৌৰোঁ": "to run" } }
  "as-2918":
    native: "to arrange; to tidy up"
    notes:
      "n1": "To put things in order, in their place."
    examples:
      "কিতাপ গুছোঁ।": { native: "I arrange the books.", bases: { "গুছোঁ": "to arrange; to tidy" } }
      "তাই ঘৰ গুছে।": { native: "She tidies the house.", bases: { "গুছে": "to arrange; to tidy" } }
  "as-2919":
    native: "to ask"
    notes:
      "n1": "To ask a question. The noun is প্ৰশ্ন (prôśn)."
    examples:
      "প্ৰশ্ন সুধিছোঁ।": { native: "I have asked a question.", bases: { "সুধিছোঁ": "to ask" } }
      "তেওঁ দাম সুধে।": { native: "He asks the price.", bases: { "সুধে": "to ask" } }
  "as-2920":
    native: "to shout; to cry out"
    notes:
      "n1": "To call out loudly."
    examples:
      "তাই চিঞৰে।": { native: "She shouts.", bases: { "চিঞৰে": "to shout" } }
      "মানুহে চিঞৰিছে।": { native: "The people are shouting.", bases: { "চিঞৰিছে": "to shout" } }
  "as-2921":
    native: "to lose; to lose track of"
    notes:
      "n1": "To no longer have a thing, or to lose one's way."
    examples:
      "মোৰ চাবি হেৰাল।": { native: "I have lost my key.", bases: { "হেৰাল": "to lose" } }
      "মই বাট হেৰালোঁ।": { native: "I lost my way.", bases: { "হেৰালোঁ": "to lose" } }
  "as-2922":
    native: "to be able to; can"
    notes:
      "n1": "With another verb: মই যাব পাৰোঁ (moi zāb pārum̐), I can go."
    examples:
      "মই যাব পাৰোঁ।": { native: "I can go.", bases: { "পাৰোঁ": "to be able; can" } }
      "তুমি কৰিব পাৰিবা?": { native: "Can you do it?", bases: { "পাৰিবা": "to be able; can" } }
  "as-2923":
    native: "to burn; to light"
    notes:
      "n1": "Of a fire, a lamp or a candle."
    examples:
      "জুই জ্বলে।": { native: "The fire is burning.", bases: { "জ্বলে": "to burn" } }
      "বাতি জ্বলিছে।": { native: "The lamp is burning.", bases: { "জ্বলিছে": "to burn" } }
  "as-2924":
    native: "to tie; to bind"
    notes:
      "n1": "To tie a knot or a bundle."
    examples:
      "মোনা বান্ধা।": "To tie a bag."
      "তাই মোনা বান্ধে।": { native: "She ties the bag.", bases: { "বান্ধে": "to tie" } }
  "as-2925":
    native: "ball"
    notes:
      "n1": "A ball for playing games."
    examples:
      "বল কালি।": "The ball is yesterday's."
      "বল ফালা।": "To throw a ball."
  "as-2926":
    native: "to begin; to start"
    notes:
      "n1": "To start doing something."
    bases:
      "আৰম্ভ": "beginning; start"
    examples:
  "as-2927":
    native: "to finish; to end"
    notes:
      "n1": "To complete something to its end."
    bases:
      "শেষ": "end; last; finish"
    examples:
  "as-2928":
    native: "to close; to shut"
    notes:
      "n1": "To close a door or a window."
    bases:
      "বন্ধ": "closed; shut"
    examples:
