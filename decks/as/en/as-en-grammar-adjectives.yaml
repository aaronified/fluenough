schema: 1
id: "as-en-grammar-adjectives"
kind: "layer"
core: "as-grammar-adjectives"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing words"
license: "CC-BY-SA-4.0"
description: "Good, big, new: a describing word never changes, needs no verb after a noun, and says 'than' with -তকৈ (-tôkôi). Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-2084":
    native: "good"
    notes:
      "n1": "A describing word never changes: ভাল ল (bhāl lô)'ৰা (rā), a good boy; ভাল ছোৱালী (bhāl suwāli), a good girl; ভাল কিতাপবোৰ (bhāl kitāpôbur), good books."
    examples:
      "অনুবাদ ভাল।": { native: "The translation is good.", bases: {  } }
      "অফিচাৰ ভাল।": { native: "The officer is good.", bases: {  } }
  "as-2085":
    native: "bad"
    examples:
      "অগ্নিকাণ্ড বেয়া।": { native: "The fire is bad.", bases: {  } }
      "অপৰাধ বেয়া।": { native: "Crime is bad.", bases: {  } }
  "as-2086":
    native: "big; elder"
    examples:
      "আদালতটো ডাঙৰ।": { native: "The court is big.", bases: { "আদালতটো": "court" } }
      "আলমাৰী ডাঙৰ।": { native: "The cupboard is big.", bases: {  } }
  "as-2087":
    native: "small; younger"
    examples:
      "অক্ষৰ সৰু।": { native: "The letter is small.", bases: {  } }
      "আঙুলিটো সৰু।": { native: "The finger is small.", bases: { "আঙুলিটো": "finger" } }
  "as-2088":
    native: "new"
    examples:
      "এপটো নতুন।": { native: "The app is new.", bases: { "এপটো": "app" } }
      "কলেজটো নতুন।": { native: "The college is new.", bases: { "কলেজটো": "college" } }
  "as-2089":
    native: "old (of things)"
    notes:
      "n1": "For people, বুঢ়া (burhā), old."
    examples:
      "গোহালিটো পুৰণি।": { native: "The cowshed is old.", bases: { "গোহালিটো": "cowshed" } }
      "গ্ৰন্থ পুৰণি।": { native: "The book is old.", bases: {  } }
  "as-2090":
    native: "hot"
    examples:
      "ইমান গৰম!": { native: "So hot!", bases: { "গৰম": "hot" } }
      "ওমলেট গৰম।": { native: "The omelette is hot.", bases: {  } }
  "as-2091":
    native: "cold"
    examples:
      "তৰমুজ ঠাণ্ডা।": { native: "Watermelon is cold.", bases: {  } }
      "দৈ ঠাণ্ডা।": { native: "The curd is cold.", bases: {  } }
  "as-2092":
    native: "beautiful; pretty"
    examples:
      "অভিনেত্ৰী ধুনীয়া।": { native: "The actress is lovely.", bases: {  } }
      "উপকূল ধুনীয়া।": { native: "The coast is beautiful.", bases: {  } }
  "as-2093":
    native: "clean"
    examples:
      "চাফা কৰা": { native: "to clean", bases: { "কৰা": "to do; to make" } }
      "জলাশয়টো চাফা।": { native: "The water body is clean.", bases: { "জলাশয়টো": "water body" } }
  "as-2094":
    native: "This is a good book."
    bases:
      "এইখন": "this"
      "কিতাপ": "book"
  "as-2095":
    native: "The room is big."
    notes:
      "n1": "No verb is needed: 'the room big'."
  "as-2096":
    native: "The tea is very hot."
  "as-2097":
    native: "This one is bigger than that one."
    notes:
      "n1": "No -er: 'than' is -তকৈ (-tôkôi) on the thing compared, and the describing word stays as it is."
    bases:
      "এইটো": "this"
      "সেইটোতকৈ": "that one"
  "as-2098":
    native: "the best"
    notes:
      "n1": "'Better than all': সকলো (xôkôlu), all, with -তকৈ (-tôkôi)."
    bases:
      "সকলোতকৈ": "all"
