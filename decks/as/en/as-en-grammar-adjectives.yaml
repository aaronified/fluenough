  "as-2097":
    native: "This one is bigger than that one."
    notes:
      "n1": "No -er: 'than' is -তকৈ (-tôkôi) on the thing compared, and the describing word stays as it is."
  "as-2098":
    native: "the best"
    notes:
      "n1": "'Better than all': সকলো (sôkôlu), all, with -তকৈ (-tôkôi)."
