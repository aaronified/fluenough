name: "Describing words"
license: "CC0-1.0"
description: "Good, big, new: a describing word never changes, needs no verb after a noun, and says 'than' with -তকৈ (-tôkôi). Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-2084":
    native: "good"
    notes:
      "n1": "A describing word never changes: ভাল ল (bhāl lô)'ৰা (rā), a good boy; ভাল ছোৱালী (bhāl suwāli), a good girl; ভাল কিতাপবোৰ (bhāl kitāpôbur), good books."
