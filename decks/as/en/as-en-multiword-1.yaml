native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: noun or adjective + কৰা (kôrā)"
description: "Eighteen Assamese verbs made of a noun or adjective and কৰা (kôrā): to commit suicide, to tilt, to sign, to hunt, to shorten, to sharpen, to lengthen, to erect, to copy, to translate, to vomit, to judge, to separate, to love, to like, to gain, to digest, to study. Not yet checked by an Assamese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "as-4550":
    native: "to commit suicide"
    notes:
      "u1": "Only কৰা (kôrā) changes with tense and person; the word before it, আত্মহত্যা (ātmôhôtyā), stays fixed. Attested on en.wiktionary, page আত্মহত্যা কৰা (ātmôhôtyā kôrā)."
    bases:
      "আত্মহত্যা": { meaning: "suicide" }

