schema: 1
id: "as-en-script-vowel-signs"
kind: "layer"
core: "as-script-vowel-signs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Assamese vowel signs"
license: "CC0-1.0"
description: "After a consonant a vowel is written as a sign (kar) on it, before, after, below or around it. Here on ক (kô) and on ম (mô). Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0067":
    native: "ka (k + the a sign)"
    notes:
      "n1": "The a sign া (akar) is written after the consonant: ক (kô) + া (ā) = কা (kā), as in কাম (kām, work). Compare ক (kô) on its own, which is 'ko'."
  "as-0068":
    native: "ki (k + the short i sign)"
    notes:
      "n1": "The short i sign ি (hroswo ikar) is written BEFORE the consonant but said after it: you see ি (i) then ক (kô), and say 'ki'. কি (ki) is 'what'."
  "as-0069":
    native: "ki (k + the long i sign)"
    notes:
      "n1": "The long i sign ী (dirgho ikar) is written after the consonant. It sounds just like কি (ki), so it is drilled by reading and writing only: no ear or recogniser can tell them apart. Many Assamese words end in it: পানী (pāni, water)."
  "as-0070":
    native: "ku (k + the short u sign)"
    notes:
      "n1": "The short u sign ু (hroswo ukar) hangs below the consonant: কুকুৰ (kukur, dog)."
  "as-0071":
    native: "ku (k + the long u sign)"
    notes:
      "n1": "The long u sign ূ (dirgho ukar) also hangs below. It sounds just like কু (ku), so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  "as-0072":
    native: "kri (k + the ri sign)"
    notes:
      "n1": "The ri sign ৃ (rikar) hangs below the consonant: কৃষক (krixôk, farmer). A recogniser writes this sound as ক্ৰি (kri), so it is drilled by reading and writing only."
  "as-0073":
    native: "ke (k + the e sign)"
    notes:
      "n1": "The e sign ে (ekar) is written BEFORE the consonant and said after it: কেতিয়া (ketiyā, when)."
  "as-0074":
    native: "koi (k + the oi sign)"
    notes:
      "n1": "The oi sign ৈ (oikar) is also written before the consonant and said after it: কৈ দিয়ক (kôi diyôk), please tell me. A recogniser may write this sound as কই (koi), so it is drilled by reading and writing only."
  "as-0075":
    native: "ko (k + the o sign)"
    notes:
      "n1": "The o sign ো (okar) comes in two parts around the consonant: ে (e) before it and া (ā) after it. This is the closed o of 'go', and in many words it is said nearer u, as chat writes it: কোন (kun, who)."
  "as-0076":
    native: "kou (k + the ou sign)"
    notes:
      "n1": "The ou sign ৌ (oukar) also comes in two parts: ে (e) before the consonant and ৗ (ôu) after it: আকৌ (ākôu, again). A recogniser may write this sound as কউ (kou), so it is drilled by reading and writing only."
  "as-0077":
    native: "k (with the hoxonto: no vowel)"
    notes:
      "n1": "The hoxonto ্ below a consonant takes its vowel away: ক্ (k) is 'k' alone. Usually two consonants join into a conjunct instead, so you see it mostly in single letters and new words. A sign rather than a syllable you say, so it is drilled by reading and writing only."
  "as-0078":
    native: "ma (m + the a sign)"
    notes:
      "n1": "The same a sign on another consonant: each sign keeps its place on almost every consonant. After ৰ (rô), শ (xô) and হ (hô) the u signs join in shapes of their own: ৰু (ru), শু (xu), হু (hu). মা (mā, mother)."
  "as-0079":
    native: "mi (m + the short i sign)"
    notes:
      "n1": "The short i sign is written before ম (mô), as before ক (kô), and said after it: মিঠা (mithā, sweet)."
  "as-0080":
    native: "mi (m + the long i sign)"
    notes:
      "n1": "The long i sign is written after ম (mô). It sounds just like মি (mi), so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  "as-0081":
    native: "mu (m + the short u sign)"
    notes:
      "n1": "The short u sign hangs below ম (mô), as below ক (kô): মুখ (mukh, face)."
  "as-0082":
    native: "mu (m + the long u sign)"
    notes:
      "n1": "The long u sign hangs below ম (mô): মূৰ (mur, head). It sounds just like মু (mu), so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  "as-0083":
    native: "me (m + the e sign)"
    notes:
      "n1": "The e sign is written before ম (mô) and said after it: মেজ (mez, table)."
  "as-0084":
    native: "mo (m + the o sign)"
    notes:
      "n1": "The o sign wraps around ম (mô) in two parts, as it wraps around ক (kô). In মোৰ (mur, my) it is said nearer u."
