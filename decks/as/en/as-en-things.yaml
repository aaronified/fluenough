schema: 1
id: "as-en-things"
kind: "layer"
core: "as-things"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Things around you"
license: "CC-BY-SA-4.0"
description: "Things in a house and a bag: the kitchen, the table and the things you carry. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-2425":
    native: "plate"
    notes:
      "n1": "থাল (thāl) is a plate, for food."
    examples:
      "থালত ভাত আছে।": { native: "There is rice on the plate.", bases: { "থালত": "plate", "আছে": "be; have" } }
      "থালখন ডাঙৰ।": { native: "The plate is big.", bases: { "থালখন": "plate" } }
  "as-2426":
    native: "glass"
    notes:
      "n1": "গিলাচ (gilās) is a glass, for water or tea."
    examples:
      "গিলাচত পানী আছে।": { native: "There is water in the glass.", bases: { "গিলাচত": "glass", "আছে": "be; have" } }
      "মই গিলাচ ধুওঁ।": { native: "I wash the glass.", bases: {  } }
  "as-2427":
    native: "bowl"
    notes:
      "n1": "বাটি (bāṭi) is a bowl, for curry or curd."
    examples:
      "বাটিত দৈ আছে।": { native: "There is curd in the bowl.", bases: { "বাটিত": "bowl", "দৈ": "curd", "আছে": "be; have" } }
      "বাটিটো সৰু।": { native: "The bowl is small.", bases: { "বাটিটো": "bowl" } }
  "as-2428":
    native: "spoon"
    notes:
      "n1": "চামুচ (sāmuc) is a spoon."
    examples:
      "মই চামুচেৰে খাওঁ।": { native: "I eat with a spoon.", bases: { "চামুচেৰে": "spoon" } }
      "চামুচটো ডাঙৰ।": { native: "The spoon is big.", bases: { "চামুচটো": "spoon" } }
  "as-2429":
    native: "knife"
    notes:
      "n1": "ছুৰী (surī) is a knife."
    examples:
      "ছুৰীখন ধাৰাল।": { native: "The knife is sharp.", bases: { "ছুৰীখন": "knife", "ধাৰাল": "sharp" } }
      "মই ছুৰীৰে কাটোঁ।": { native: "I cut with a knife.", bases: { "ছুৰীৰে": "knife" } }
  "as-2430":
    native: "cup"
    notes:
      "n1": "কাপ (kāp) is a cup, for tea or coffee."
    examples:
      "কাপত চাহ আছে।": { native: "There is tea in the cup.", bases: { "কাপত": "cup", "আছে": "be; have" } }
      "কাপটো সৰু।": { native: "The cup is small.", bases: { "কাপটো": "cup" } }
  "as-2431":
    native: "bag; sack"
    notes:
      "n1": "থলি (thôli) is a bag, made of cloth or paper."
    examples:
      "থলিত কিতাপ আছে।": { native: "There is a book in the bag.", bases: { "থলিত": "bag", "আছে": "be; have" } }
      "থলিটো ডাঙৰ।": { native: "The bag is big.", bases: { "থলিটো": "bag" } }
  "as-2432":
    native: "box"
    notes:
      "n1": "বাকচ (bāksô) is a box."
    examples:
      "বাকচটো খালী।": { native: "The box is empty.", bases: { "বাকচটো": "box" } }
      "বাকচত কাপোৰ আছে।": { native: "There are clothes in the box.", bases: { "বাকচত": "box", "কাপোৰ": "cloth; clothes", "আছে": "be; have" } }
  "as-2433":
    native: "paper"
    notes:
      "n1": "কাগজ (kāgôz) is paper, for writing."
    examples:
      "মই কাগজত লিখোঁ।": { native: "I write on paper.", bases: { "কাগজত": "paper" } }
      "কাগজখন নতুন।": { native: "The paper is new.", bases: { "কাগজখন": "paper" } }
  "as-2434":
    native: "pencil"
    notes:
      "n1": "পেঞ্জিল (penjil) is a pencil."
    examples:
      "মই পেঞ্জিলেৰে লিখোঁ।": { native: "I write with a pencil.", bases: { "পেঞ্জিলেৰে": "pencil" } }
      "পেঞ্জিলটো সৰু।": { native: "The pencil is small.", bases: { "পেঞ্জিলটো": "pencil" } }
  "as-2435":
    native: "towel"
    notes:
      "n1": "তোৱালে (towālē) is a towel, for the face and hands."
    examples:
      "তোৱালেৰে মুখ মোছোঁ।": { native: "I wipe my face with a towel.", bases: { "তোৱালেৰে": "towel", "মুখ": "mouth; face", "মোছোঁ": "wipe" } }
      "তোৱালেখন নৰম।": { native: "The towel is soft.", bases: { "তোৱালেখন": "towel" } }
  "as-2436":
    native: "comb"
    notes:
      "n1": "চিৰুণী (sirunī) is a comb."
    examples:
      "মই চিৰুণীৰে চুলি আঁচোঁ।": { native: "I comb my hair with a comb.", bases: { "চিৰুণীৰে": "comb", "চুলি": "hair", "আঁচোঁ": "comb" } }
      "চিৰুণীটো সৰু।": { native: "The comb is small.", bases: { "চিৰুণীটো": "comb" } }
  "as-2437":
    native: "book"
    notes:
      "n1": "কিতাপ (kitāp) is a book."
    examples:
      "মই কিতাপ পঢ়োঁ।": { native: "I read a book.", bases: {  } }
      "কিতাপখন ডাঙৰ।": { native: "The book is big.", bases: { "কিতাপখন": "book" } }
  "as-2438":
    native: "bed"
    notes:
      "n1": "বিছনা (bisônā) is a bed."
    examples:
      "বিছনাত শুওঁ।": { native: "I sleep on the bed.", bases: { "বিছনাত": "bed" } }
      "বিছনাখন নৰম।": { native: "The bed is soft.", bases: { "বিছনাখন": "bed" } }
  "as-2439":
    native: "watch; clock"
    notes:
      "n1": "ঘড়ী (ghôṛī) is a watch or a clock."
    examples:
      "ঘড়ীটো ভাল।": { native: "The watch is good.", bases: { "ঘড়ীটো": "watch" } }
      "ঘড়ীটো বন্ধ।": { native: "The clock has stopped.", bases: { "ঘড়ীটো": "watch", "বন্ধ": "closed; stopped" } }
  "as-2440":
    native: "glasses"
    notes:
      "n1": "চশমা (côsmā) is a pair of glasses."
    examples:
      "মই চশমা পিন্ধোঁ।": { native: "I wear glasses.", bases: {  } }
      "চশমাটো নতুন।": { native: "The glasses are new.", bases: { "চশমাটো": "glasses" } }
  "as-2441":
    native: "umbrella"
    notes:
      "n1": "ছাতা (sātā) is an umbrella."
    examples:
      "মই ছাতা লওঁ।": { native: "I take an umbrella.", bases: {  } }
      "ছাতাটো ডাঙৰ।": { native: "The umbrella is big.", bases: { "ছাতাটো": "umbrella" } }
  "as-2442":
    native: "mobile phone"
    notes:
      "n1": "মোবাইল (mobāil) is a mobile phone."
    examples:
      "মই মোবাইলত কথা কওঁ।": { native: "I talk on the mobile.", bases: { "মোবাইলত": "mobile phone", "কথা": "talk; word" } }
      "মোবাইলটো নতুন।": { native: "The mobile is new.", bases: { "মোবাইলটো": "mobile phone" } }
  "as-2443":
    native: "camera"
    notes:
      "n1": "কেমেৰা (kemerā) is a camera."
    examples:
      "মই কেমেৰা কিনোঁ।": { native: "I buy a camera.", bases: {  } }
      "কেমেৰাটো ভাল।": { native: "The camera is good.", bases: { "কেমেৰাটো": "camera" } }
  "as-2444":
    native: "fridge"
    notes:
      "n1": "ফ্ৰিজ (phrij) is a fridge, for cold food."
    examples:
      "ফ্ৰিজত গাখীৰ আছে।": { native: "There is milk in the fridge.", bases: { "ফ্ৰিজত": "fridge", "আছে": "be; have" } }
      "ফ্ৰিজটো ঠাণ্ডা।": { native: "The fridge is cold.", bases: { "ফ্ৰিজটো": "fridge" } }
  "as-2445":
    native: "bag"
    notes:
      "n1": "বেগ (beg) is a bag, carried on the shoulder."
    examples:
      "বেগটো ভাৰী।": { native: "The bag is heavy.", bases: { "বেগটো": "bag" } }
      "বেগত কিতাপ আছে।": { native: "There is a book in the bag.", bases: { "বেগত": "bag", "আছে": "be; have" } }
  "as-2446":
    native: "table"
    notes:
      "n1": "টেবুল (tebul) is a table."
    examples:
      "কিতাপ টেবুলৰ ওপৰত।": { native: "The book is on the table.", bases: { "টেবুলৰ": "table" } }
      "টেবুলটো ডাঙৰ।": { native: "The table is big.", bases: { "টেবুলটো": "table" } }
