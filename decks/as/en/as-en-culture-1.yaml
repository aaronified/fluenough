tags: ["unreviewed"]
description: "Short lines from the medieval Vaishnava works of Sankardev and Madhavdev, in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by an Assamese speaker: please report any mistake."

cards:
  "as-4100":
    native: "To cross this ocean of worldly life, the tender feet of Krishna are the boat."
    notes:
      "n1": "A line from the Bhatima, a set of verses of praise attributed to Sankardev on Assamese Wikisource. It is written in Brajavali, the literary language that Sankardev is credited with devising, not in everyday Assamese."
  "as-4101":
    native: "Madhava is the king above the gods, and the Name is above all religious duty."
    notes:
      "n1": "Another line from the same page of the Bhatima, in Brajavali. Madhava is a name of Krishna, and the verse puts the singing of his name above everything else."
  "as-4102":
    native: "The king says, \"Teacher, do not speak against me; whatever may come, let it come, if I worship Madhava.\""
    notes:
      "n1": "The king speaks to his teacher in the story of King Harishchandra, which Sankardev retold in verse. The word Madhava is a name of Krishna."
  "as-4103":
    native: "This is a most priceless jewel of devotion to Hari, and it took great effort of mine to bring it out."
    notes:
      "n1": "The poet speaks of his own book in its opening verses. Hari is a name of Krishna, and the book gathers verses on devotion from the Bhagavata."
  "as-4104":
    native: "Whoever, thinking over the tales of Krishna in his mind, stays patient for a moment."
    notes:
      "n1": "The first half of a verse of the Naam Ghosa, the book of hymns for which Madhavdev is best known. The sentence goes on in the next line."
  "as-4105":
    native: "Mahesha says, \"Hearing the names that begin with the sound ra, my mind becomes supremely glad.\""
    notes:
      "n1": "Mahesha is a name of Shiva, who speaks in this verse of the Naam Ghosa. The names that begin with the sound ra include Rama."
  "as-4106":
    native: "See Hari among the gathered gopis, playing at the sport of a thief's cunning."
    notes:
      "n1": "The opening song of a short play on the boy Krishna stealing butter, shown as a transcription on a Wikisource user page, so the spelling may differ from a printed edition. The gopis are the cowherd women of Krishna's village."
  "as-4107":
    native: "\"Who are you in my house?\" says the milkmaid; \"I am the younger brother of Balai,\" says Vanamali."
    notes:
      "n1": "A short play in which the boy Krishna is found in a milkmaid's house, as the page's song shows. Vanamali (garlanded with forest flowers) and Balai are other names of Krishna and of his elder brother Balarama."
  "as-4108":
    native: "O my mind, cling to the feet of Rama."
    notes:
      "n1": "The opening words of a borgeet, one of the devotional songs of Sankardev; the page quotes them as the song that brought followers to him."
