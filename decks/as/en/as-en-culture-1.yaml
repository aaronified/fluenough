name: "Culture 1: medieval and Vaishnava works"
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
description: "Short lines from the medieval Vaishnava works of Sankardev and Madhavdev, in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by an Assamese speaker: please report any mistake."

cards:
  "as-4100":
    native: "To cross this ocean of worldly life, the tender feet of Krishna are the boat."
    notes:
      "n1": "A line from the Bhatima, a set of verses of praise attributed to Sankardev on Assamese Wikisource. It is written in Brajavali, the literary language that Sankardev is credited with devising, not in everyday Assamese."
  "as-4101":
    native: "Madhava is the king above the gods, and the Name is above all religious duty."
    notes:
      "n1": "Another line from the same page of the Bhatima, in Brajavali. Madhava is a name of Krishna, and the verse puts the singing of his name above everything else."
  "as-4102":
    native: "The king says, \"Teacher, do not speak against me; whatever may come, let it come, if I worship Madhava.\""
    notes:
      "n1": "The king speaks to his teacher in the story of King Harishchandra, which Sankardev retold in verse. The word Madhava is a name of Krishna."
  "as-4103":
    native: "This is a most priceless jewel of devotion to Hari, and it took great effort of mine to bring it out."
    notes:
      "n1": "The poet speaks of his own book in its opening verses. Hari is a name of Krishna, and the book gathers verses on devotion from the Bhagavata."
  "as-4104":
    native: "Whoever, thinking over the tales of Krishna in his mind, stays patient for a moment."
    notes:
      "n1": "The first half of a verse of the Naam Ghosa, the book of hymns for which Madhavdev is best known. The sentence goes on in the next line."
  "as-4105":
    native: "Mahesha says, \"Hearing the names that begin with the sound ra, my mind becomes supremely glad.\""
    notes:
      "n1": "Mahesha is a name of Shiva, who speaks in this verse of the Naam Ghosa. The names that begin with the sound ra include Rama."
  "as-4108":
    native: "O my mind, cling to the feet of Rama."
    notes:
      "n1": "The opening words of a borgeet, one of the devotional songs of Sankardev; the page quotes them as the song that brought followers to him."
  "as-4110":
    native: "Without the Name there is no way forward in the Kali age."
    notes:
      "n1": "A line from the section on the Name in the Kirtan-ghosha, a book of verses by Sankardev. The verses hold that in the Kali age, the present age of strife, the Name is the only way."
  "as-4111":
    native: "In other religious duties there is no claim to this."
    notes:
      "n1": "The first line of the following couplet in the Kirtan-ghosha; the second line, on the card after this one, says the Name is the essence."
  "as-4112":
    native: "Know that in the Kali age the Name alone is the essence."
    notes:
      "n1": "The second line of a couplet in the Kirtan-ghosha, after the line on other religious duties; the two lines together say the Name is the essence in the Kali age."
  "as-4113":
    native: "Sankar, the servant of Krishna, says."
    notes:
      "n1": "The line names the poet in the verse: Sankar is the name by which Sankardev signs his verses, and he calls himself the servant of Krishna."
  "as-4114":
    native: "Death may come today or tomorrow."
    notes:
      "n1": "A line from the Kirtan-ghosha warning that death can come at any time; the next line answers it by calling on the Name of Hari."
  "as-4115":
    native: "Take refuge in the Name of Hari."
    notes:
      "n1": "A line from the Kirtan-ghosha calling the reader to refuge in the Name of Hari, a name of Krishna."
  "as-4116":
    native: "Elders, do not blame me."
    notes:
      "n1": "The poet asks the elders not to blame him; the lines after it say that the scripture came to him from Varanasi."
  "as-4117":
    native: "Look, it will accomplish seven works for the one who takes it without ceasing."
    notes:
      "n1": "The line before it in the Kirtan-ghosha names the one who takes the Name without ceasing; this line says what the Name does for that person."
  "as-4118":
    native: "I will tell the story of Ajamil openly."
    notes:
      "n1": "The opening line of the tale of Ajamil; the verse before it says the tale is from the Bhagavata, and the lines after it go on to the dreadful hell that awaits sinners."
  "as-4119":
    native: "Let living beings do what is right and not do wrong."
    notes:
      "n1": "The next line calls this Krishna's command, the word of the four Vedas, and so presents the tale as a teaching on right conduct."
  "as-4120":
    native: "He lies fallen like a tree cut at the root."
    notes:
      "n1": "A line from the Ajamil tale describing a sinner in hell; the lines around it describe the punishment of such a sinner."
