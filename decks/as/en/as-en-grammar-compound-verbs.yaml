schema: 1
id: "as-en-grammar-compound-verbs"
kind: "layer"
core: "as-grammar-compound-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs that add a shade"
license: "CC0-1.0"
description: "The first verb in -ই (-i), and a second after it that adds a shade: done for good, gone off, done for oneself, done for someone, tried out. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-2113":
    native: "I've eaten it all up."
    notes:
      "n1": "পেলোৱা (peluwā), throw, after a verb in -ই (-i): done completely, and at once."
    bases:
      "পেলালোঁ": "to throw; to do completely"
  "as-2114":
    native: "I've gone and said it."
    bases:
      "পেলালোঁ": "to throw; to do completely"
  "as-2115":
    native: "I forgot."
    notes:
      "n1": "যোৱা (zuwā), go, after a verb: a change that has happened. পাহৰা (pāhôrā) is to forget."
    bases:
      "পাহৰি": "to forget"
      "গ'লোঁ": "to go"
  "as-2116":
    native: "He fell down."
    bases:
      "সি": "he; that"
      "পৰি": "from; to fall"
      "গ'ল": "to go"
  "as-2117":
    native: "He went away."
    bases:
      "সি": "he; that"
      "গুচি": "to go away"
      "গ'ল": "to go"
  "as-2118":
    native: "He's gone (off)."
    notes:
      "n1": "-গৈ (-gôi) on a verb is 'off, away there'; -হি (-hi) is 'here': সি আহিলহি (xi āhilhi), he's come (here)."
    bases:
      "সি": "he; that"
      "গ'লগৈ": "to go"
  "as-2119":
    native: "I bought it (for myself)."
    notes:
      "n1": "লোৱা (luwā), take, after a verb: for oneself."
    bases:
      "কিনি": "to buy"
      "ল'লোঁ": "to take"
  "as-2120":
    native: "I've learned it."
    bases:
      "শিকি": "to learn"
      "ল'লোঁ": "to take"
  "as-2121":
    native: "Please fetch it (for me)."
    notes:
      "n1": "দিয়া (diyā), give, after a verb: done for someone."
    bases:
      "আনি": "to bring"
  "as-2122":
    native: "Do it for me."
    notes:
      "n1": "To a friend; to someone you respect, কৰি দিয়ক (kori diyôk)."
    bases:
      "কৰি": "to do; to make"
      "দিয়া": "to give"
  "as-2123":
    native: "Try it; taste it."
    notes:
      "n1": "চোৱা (suwā), look, after a verb: try it and see."
    bases:
      "চোৱা": "to see; to watch; to try"
  "as-2124":
    native: "Keep doing it."
    notes:
      "n1": "থকা (thôkā), stay, after a verb: keep on doing."
    bases:
      "কৰি": "to do; to make"
      "থাকা": "to stay; to keep on"
  "as-2125":
    native: "The boy burst into tears."
    notes:
      "n1": "উঠা (uthā), rise, after a verb: all of a sudden."
    bases:
      "কান্দি": "to cry"
