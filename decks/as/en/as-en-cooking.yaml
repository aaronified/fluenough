schema: 1
id: "as-en-cooking"
kind: "layer"
core: "as-cooking"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Cooking"
license: "CC-BY-SA-4.0"
description: "The kitchen, the stove and the pan, the spices and the steps of a dish. The words for cooking at home, with the verbs already taught. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-2707":
    native: "recipe"
    notes:
      "n1": "The written steps for a dish. Written as said in English."
    examples:
      "ৰেচিপিটো ভাল।": { native: "The recipe is good.", bases: { "ৰেচিপিটো": "recipe" } }
      "মই নতুন ৰেচিপি বিচাৰোঁ।": "I am looking for a new recipe."
  "as-2708":
    native: "ingredient"
    notes:
      "n1": "One item needed for a dish, such as rice, salt or oil."
    examples:
      "উপকৰণ কিমান লাগে?": "How many ingredients are needed?"
      "উপকৰণ সকলো আছে।": { native: "All the ingredients are there.", bases: { "আছে": "to be; there is; to have" } }
  "as-2709":
    native: "spice; spices"
    notes:
      "n1": "Dried spices ground or whole, added to a curry."
    examples:
      "মছলা বহুত।": "There are a lot of spices."
      "মছলা বেয়া নহয়।": "The spices are not bad."
  "as-2710":
    native: "powder; ground spice"
    notes:
      "n1": "A spice ground to a powder, such as turmeric."
    examples:
      "হালধিৰ গুৰি।": "Turmeric powder."
      "মৰিচৰ গুৰি বহুত।": "There is a lot of chilli powder."
  "as-2711":
    native: "stove; hearth"
    notes:
      "n1": "The fire or gas stove where food is cooked."
    examples:
      "চুলাত জুই আছে।": { native: "The stove has fire in it.", bases: { "চুলাত": "stove; hearth", "আছে": "to be; there is; to have" } }
      "চুলা ডাঙৰ।": "The stove is big."
  "as-2712":
    native: "pan; wok"
    notes:
      "n1": "A round iron pan for frying and cooking curries."
    examples:
      "কড়াত তেল।": { native: "Oil in the pan.", bases: { "কড়াত": "pan; wok" } }
      "কড়া গৰম।": "The pan is hot."
  "as-2713":
    native: "lid; cover"
    notes:
      "n1": "The cover on a pan or a pot, to keep the heat in."
    examples:
      "ঢাকনি ঠিক আছে।": { native: "The lid fits well.", bases: { "আছে": "to be; there is; to have" } }
      "ঢাকনি খোলা।": "Open the lid."
  "as-2714":
    native: "smell; aroma"
    notes:
      "n1": "The smell of a dish cooking, pleasant or not."
    examples:
      "ভাতৰ গোন্ধ ভাল।": "The smell of the rice is good."
      "গোন্ধ বহুত।": "There is a strong smell."
  "as-2715":
    native: "taste; flavour"
    notes:
      "n1": "How food tastes. Also a feeling of liking it."
    examples:
      "স্বাদ ভাল।": "The taste is good."
      "স্বাদ বেয়া।": "The taste is bad."
  "as-2716":
    native: "leaf"
    notes:
      "n1": "A leaf, used to wrap or serve food. A banana leaf is কলপাত (kôlpāt)."
    examples:
      "পাতত ভাত।": { native: "Rice on a leaf.", bases: { "পাতত": "leaf" } }
      "পাত সেউজীয়া।": "The leaf is green."
  "as-2717":
    native: "steam"
    notes:
      "n1": "The steam from a pot of boiling water or a steamed dish."
    examples:
      "ভাপ উঠিছে।": "Steam is rising."
      "ভাপত সিজা।": { native: "Steamed (cooked in steam).", bases: { "ভাপত": "steam" } }
  "as-2718":
    native: "whole; uncut"
    notes:
      "n1": "Not cut or ground: a whole spice or a whole fish."
    examples:
      "গোটা মৰিচ।": "Whole chillies."
      "গোটা মাছ।": "A whole fish."
  "as-2719":
    native: "serving"
    notes:
      "n1": "The act of serving food to guests and family."
    examples:
      "পৰিবেশন কৰা।": "To serve."
      "পৰিবেশন ভাল।": "The serving is good."
  "as-2720":
    native: "ordinary; simple"
    notes:
      "n1": "A simple dish made without many spices."
    examples:
      "সাধাৰণ ভাত।": "Plain rice."
      "এইটো সাধাৰণ।": "This is simple."
  "as-2721":
    native: "to grind (to powder)"
    notes:
      "n1": "To make a powder: spices are ground on a stone."
    examples:
  "as-2722":
    native: "to add salt"
    notes:
      "n1": "Salt is added to a dish: নিমখ দিয়ক (nimôkh diyôk), add salt, please."
    examples:
  "as-2723":
    native: "to mix"
    notes:
      "n1": "Taught before; here it is the step of a recipe."
    examples:
      "তেল আৰু মছলা মিহলাওঁ।": { native: "I mix the oil and the spices.", bases: { "মিহলাওঁ": "to mix" } }
      "মিহলাই দিয়ক।": { native: "Please mix it in.", bases: { "মিহলাই": "to mix" } }
  "as-2724":
    native: "meal; eating"
    notes:
      "n1": "The act of eating a meal, formal."
    examples:
      "ভোজন কৰা।": "To eat a meal."
      "ভোজন প্ৰস্তুত।": "The meal is ready."
  "as-2725":
    native: "ready; prepared"
    notes:
      "n1": "A dish that is ready to eat."
    examples:
      "ভাত প্ৰস্তুত।": "The rice is ready."
      "চাহ প্ৰস্তুত।": "The tea is ready."
