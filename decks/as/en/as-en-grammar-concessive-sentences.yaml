cards:
  "as-3706":
    native: "Even if it rains, I will go."
    bases:
      "হ'লেও": "to become; to be"
    confusables:
      "c1": { why: "Still, the word of the result, not the condition." }
      "c2": { why: "Although, a different way of the same idea." }
  "as-3707":
    native: "Although it is bad, I still eat it."
    bases:
      "তথাপি": "still; nevertheless"
    confusables:
      "c1": { why: "Good, the opposite of bad." }
      "c2": { why: "A lot, not bad." }
  "as-3708":
    native: "Even though he ate, he is tired."
    confusables:
      "c1": { why: "Well, the opposite of tired." }
      "c2": { why: "Weak, close to tired." }
  "as-3709":
    native: "Even if he comes, I will go."
    confusables:
      "c1": { why: "The perfect: he has come." }
      "c2": { why: "The future: he will come." }
  "as-3710":
    native: "Even at night, he studies."
    bases:
      "হ'লেও": "to become; to be"
    confusables:
      "c1": { why: "The perfect: he has lain down." }
      "c2": { why: "The future: he will study." }
  "as-3711":
    native: "Even though he listened, he did not understand."
    confusables:
      "c1": { why: "The perfect: he has listened." }
      "c2": { why: "The perfect: he has understood." }
  "as-3712":
    native: "Even though I did it, the work was not done."
    notes:
      "n1": "নহ'ল (nôhol) is from হোৱা (huwā), to become, with the negative ন- (nô-) in front, and the stem is shortened in the past."
    bases:
      "নহ'ল": "to become; to be"
    confusables:
      "c1": { why: "The perfect: he has done." }
      "c2": { why: "The future: I will do it." }
