schema: 1
id: "as-en-relationships"
kind: "layer"
core: "as-relationships"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Relationships: neighbours, friends and thanks"
license: "CC-BY-SA-4.0"
description: "The people we live among: friendship and trust, respect and forgiveness, the neighbour and the quarrel, and the thank-you. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3750":
    native: "relationship; connection"
    notes:
      "n1": "The way two people are connected: as friends, relatives or neighbours."
    examples:
      "সম্পৰ্ক ভাল।": "The relationship is good."
      "সম্পৰ্ক বহুত।": "There is a close relationship."
  "as-3751":
    native: "friendship"
    notes:
      "n1": "The bond between two friends."
    examples:
      "বন্ধুত্ব ভাল।": "The friendship is good."
      "বন্ধুত্ব বহুত ডাঙৰ।": "The friendship is very great."
  "as-3752":
    native: "trust; belief"
    notes:
      "n1": "The feeling that someone can be relied on."
    examples:
      "বিশ্বাস আছে।": { native: "There is trust.", bases: { "আছে": "to be; there is; to have" } }
      "বিশ্বাস ভাল।": "Trust is good."
  "as-3753":
    native: "respect"
    notes:
      "n1": "Honour shown to elders and to others."
    examples:
      "সন্মান ভাল।": "Respect is good."
      "সন্মান কৰা।": "To respect."
  "as-3754":
    native: "forgiveness"
    notes:
      "n1": "Letting go of anger after a wrong."
    examples:
      "ক্ষমা কৰিবা।": "Please forgive."
      "ক্ষমা ভাল।": "Forgiveness is good."
  "as-3755":
    native: "quarrel; dispute"
    notes:
      "n1": "An angry argument between two people."
    examples:
      "বিবাদ বেয়া।": "A quarrel is bad."
      "বিবাদ নকৰিবা।": "Do not quarrel."
  "as-3756":
    native: "agreement; match"
    notes:
      "n1": "The state of being the same, or in agreement."
    examples:
      "মিল আছে।": { native: "There is agreement.", bases: { "আছে": "to be; there is; to have" } }
      "মিল নাই।": "There is no agreement."
  "as-3757":
    native: "of the same age"
    notes:
      "n1": "Of people who are of the same age."
    examples:
      "তেওঁ সমবয়সী।": "He is of the same age."
      "সমবয়সী বন্ধু।": "A friend of the same age."
  "as-3758":
    native: "sympathy; compassion"
    notes:
      "n1": "Feeling for another person who is in trouble."
    examples:
      "সহানুভূতি আছে।": { native: "There is sympathy.", bases: { "আছে": "to be; there is; to have" } }
      "সহানুভূতি দিয়া।": "To show sympathy."
  "as-3759":
    native: "patience"
    notes:
      "n1": "Waiting calmly without anger."
    examples:
      "ধৈৰ্য ভাল।": "Patience is good."
      "ধৈৰ্য ধৰা।": "To be patient."
  "as-3760":
    native: "love (romantic or deep)"
    notes:
      "n1": "A strong feeling of love for a partner or a dear one."
    examples:
      "প্ৰেম ধুনীয়া।": "Love is lovely."
      "প্ৰেম বহুত।": "There is a lot of love."
  "as-3761":
    native: "neighbour"
    notes:
      "n1": "A person who lives next to your house."
    examples:
      "চুবুৰীয়া ভাল।": "The neighbour is good."
      "চুবুৰীয়া আহিছে।": "The neighbour has come."
  "as-3762":
    native: "to respect"
    notes:
      "n1": "To show respect to someone."
    examples:
  "as-3763":
    native: "to forgive"
    notes:
      "n1": "To let go of anger after a wrong."
    examples:
  "as-3764":
    native: "to trust"
    notes:
      "n1": "To believe that someone can be relied on."
    examples:
  "as-3765":
    native: "to get along; to agree"
    notes:
      "n1": "To be in agreement with someone."
