      "তেওঁ গীৰ্জালৈ যায়।": { native: "He goes to the church.", bases: { "গীৰ্জালৈ": "church" } }
      "গীৰ্জাটো ডাঙৰ।": { native: "The church is big.", bases: { "গীৰ্জাটো": "church" } }
  "as-2403":
    native: "mosque"
    notes:
      "n1": "মছজিদ (môsozid) is a mosque."
