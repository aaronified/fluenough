    native: "bridge"
    notes:
      "n1": "সেতু (setu) is a bridge."
    examples:
      "সেতুখন নতুন।": { native: "The bridge is new.", bases: { "সেতুখন": "bridge" } }
      "সেতুখন ডাঙৰ।": { native: "The bridge is big.", bases: { "সেতুখন": "bridge" } }
