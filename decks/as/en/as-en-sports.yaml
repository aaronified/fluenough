schema: 1
id: "as-en-sports"
kind: "layer"
core: "as-sports"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sports: games, teams, matches and medals"
license: "CC-BY-SA-4.0"
description: "Playing and watching sport: the team, the player, the goal, the match, the win and the loss, and the medal at the end. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3719":
    native: "player; sportsman"
    notes:
      "n1": "A person who plays a sport, in a team or alone."
    examples:
      "খেলাডু ভাল।": "The player is good."
      "খেলাডু আহিছে।": "The player has come."
  "as-3720":
    native: "goal; score in football"
    notes:
      "n1": "The point scored when the ball goes into the net. Written as said in English."
    examples:
      "গ'ল দিলে।": "He scored a goal."
      "গ'ল বহুত।": "There are many goals."
  "as-3721":
    native: "cricket"
    notes:
      "n1": "A bat-and-ball game played by two teams. Written as said in English."
    examples:
      "ক্ৰিকেট ভাল লাগে।": "I like cricket."
      "ক্ৰিকেট খেলিছোঁ।": "I have played cricket."
  "as-3722":
    native: "volleyball"
    notes:
      "n1": "A game where a ball is hit over a net. Written as said in English."
    examples:
      "ভলিবল খেল।": "Volleyball is a game."
      "ভলিবল ডাঙৰ।": "The volleyball is big."
  "as-3723":
    native: "race"
    notes:
      "n1": "A contest of speed in running or on bicycles."
    examples:
      "দৌৰ ভাল।": "The race is good."
      "দৌৰ আহিছে।": "The race is coming."
  "as-3724":
    native: "medal"
    notes:
      "n1": "A metal disc given to the winners of a contest."
    examples:
      "পদক পালে।": { native: "He got a medal.", bases: { "পালে": "to get; to receive" } }
      "পদক ডাঙৰ।": "The medal is big."
  "as-3725":
    native: "gold"
    notes:
      "n1": "The gold metal; a gold medal is স্বৰ্ণ পদক (xwôrnô pôdôk)."
    examples:
      "স্বৰ্ণ ডাঙৰ।": "The gold is big."
      "স্বৰ্ণ পদক।": "A gold medal."
  "as-3726":
    native: "silver"
    notes:
      "n1": "The silver metal; a silver medal is ৰূপ পদক (rup pôdôk)."
    examples:
      "ৰূপ পদক।": "A silver medal."
      "ৰূপ ধুনীয়া।": "Silver is lovely."
  "as-3727":
    native: "coach; trainer"
    notes:
      "n1": "The person who teaches and trains a team or a player."
    examples:
      "প্ৰশিক্ষক ভাল।": "The coach is good."
      "প্ৰশিক্ষক আহিছে।": "The coach has come."
  "as-3728":
    native: "referee; umpire"
    notes:
      "n1": "The person who keeps the rules in a match. Written as said in English."
    examples:
      "ৰেফাৰী ভাল।": "The referee is good."
      "ৰেফাৰী আহিছে।": "The referee has come."
  "as-3729":
    native: "record"
    notes:
      "n1": "The best result ever recorded. Written as said in English."
    examples:
      "ৰেকৰ্ড ভাল।": "The record is good."
      "নতুন ৰেকৰ্ড।": "A new record."
  "as-3730":
    native: "captain (of a team)"
    notes:
      "n1": "The leader of a team on the field."
    examples:
      "দলনায়ক ভাল।": "The captain is good."
      "দলনায়ক আহিছে।": "The captain has come."
  "as-3731":
    native: "to win"
    notes:
      "n1": "The opposite of হাৰা (hārā), to lose."
    examples:
      "আমি জিকিলোঁ।": { native: "We won.", bases: { "জিকিলোঁ": "to win" } }
      "তাই জিকিছে।": { native: "She is winning.", bases: { "জিকিছে": "to win" } }
  "as-3732":
    native: "to lose"
    notes:
      "n1": "The opposite of জিকা (zikā), to win."
    examples:
      "আমি হাৰিলোঁ।": { native: "We lost.", bases: { "হাৰিলোঁ": "to lose" } }
      "তেওঁলোক হাৰিছে।": { native: "They are losing.", bases: { "হাৰিছে": "to lose" } }
  "as-3733":
    native: "sport; games (formal)"
    notes:
      "n1": "The formal word for sport; in speech খেল (khel)."
    examples:
      "ক্ৰীড়া ভাল।": "Sport is good."
      "ক্ৰীড়া বহুত।": "There is a lot of sport."
  "as-3734":
    native: "sports team"
    notes:
      "n1": "A group of players on one side."
  "as-3735":
    native: "to break a record"
    notes:
      "n1": "To do better than the best ever done."
    bases:
      "ভঙা": "to break"
