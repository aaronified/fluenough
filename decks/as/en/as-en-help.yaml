schema: 1
id: "as-en-help"
kind: "layer"
core: "as-help"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Help"
license: "CC0-1.0"
description: "Asking for help, doctors and medicine, and saying you are lost. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0421":
    native: "help"
  "as-0422":
    native: "Please help!"
  "as-0423":
    native: "Help! Save me!"
  "as-0424":
    native: "Wait a moment, please!"
    notes:
      "n1": "ৰ (rô)'ব (bô), 'you will stay', is a polite request. To a friend: অলপ ৰ (ôlôp rô)'বা (olop roba)."
  "as-0425":
    native: "hospital"
    notes:
      "n1": "Formally, and on signs, চিকিৎসালয় (sikitsālôy)."
  "as-0426":
    native: "medicine"
    notes:
      "n1": "The everyday word. The formal one is ঔষধ (ôuxôdh)."
  "as-0427":
    native: "pain; ache"
    notes:
      "n1": "মূৰৰ বিষ (murôr bix), a headache; পেটৰ বিষ (petôr bix), a stomach ache. In Bengali and Hindi the same word, বিষ (bix), विष (viś), means poison."
  "as-0428":
    native: "I'm lost."
    notes:
      "n1": "Literally 'I have lost the way'."
  "as-0429":
    native: "I didn't understand."
    notes:
      "n1": "Literally 'I did not get it, understanding'. I understand: বুজি পাইছোঁ (buzi pāisum̐)."
  "as-0430":
    native: "Where is the toilet?"
    notes:
      "n1": "Signs say শৌচালয় (xôusālôy)."
