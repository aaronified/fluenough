schema: 1
id: "as-en-help"
kind: "layer"
core: "as-help"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Help"
license: "CC-BY-SA-4.0"
description: "Asking for help, doctors and medicine, and saying you are lost. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0421":
    native: "help"
    examples:
      "সহায় কৰক!": { native: "Please help!", bases: { "কৰক": "to do; to make" } }
      "সহায় কৰা": { native: "to help", bases: { "কৰা": "to do; to make" } }
  "as-0424":
    native: "Wait a moment, please!"
    notes:
      "n1": "ৰ (rô)'ব (bô), 'you will stay', is a polite request. To a friend: অলপ ৰ (ôlôp rô)'বা (olop roba)."
    bases:
      "অলপ": "a little"
      "ৰ'ব": "to wait; to stay"
  "as-0425":
    native: "hospital"
    notes:
      "n1": "Formally, and on signs, চিকিৎসালয় (sikitsālôy)."
    examples:
      "মই হস্পিতালত আছোঁ।": { native: "I am in hospital.", bases: { "আছোঁ": "to be; there is; to have", "হস্পিতালত": "hospital" } }
  "as-0426":
    native: "medicine"
    notes:
      "n1": "The everyday word. The formal one is ঔষধ (ôuxôdh)."
    examples:
      "তুমি দৰব খাবা।": { native: "You will take the medicine.", bases: {  } }
  "as-0427":
    native: "pain; ache"
    notes:
      "n1": "মূৰৰ বিষ (murôr bix), a headache; পেটৰ বিষ (petôr bix), a stomach ache. In Bengali and Hindi the same word, বিষ (bix), विष (viś), means poison."
    examples:
      "মোৰ মূৰত বিষ।": { native: "I have a headache.", bases: {  } }
