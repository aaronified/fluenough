tags: ["unreviewed"]
cards:
  "as-2739":
    native: "My house is bigger than yours."
    notes:
      "n1": "-তকৈ (-tôkôi) means 'than' and joins the thing compared: ঘৰতকৈ (ghôrôtôkôi), than the house. 'Bigger' is just ডাঙৰ (dāṅôr), big."
    confusables:
      "c1": { why: "Small, the opposite of big." }
      "c2": { why: "Long, a different measure." }
  "as-2740":
    native: "Fish is better than meat."
    notes:
      "n1": "-তকৈ (-tôkôi) joins মাংস (māṅxô), meat: মাংসতকৈ (māṅxôôtôkôi), than meat. 'Better' is just ভাল (bhāl), good."
    confusables:
      "c1": { why: "Bad, the opposite of better." }
      "c2": { why: "Than rice: a different comparison in the sentence." }
  "as-2741":
    native: "Today is hotter than yesterday."
    notes:
      "n1": "কালি (kāli) means 'yesterday'; 'tomorrow' is কাইলৈ (kāilôi). -তকৈ (-tôkôi) makes 'than yesterday': কালিতকৈ (kālitôkôi)."
    confusables:
      "c1": { why: "Cold, the opposite of hot." }
      "c2": { why: "Heat, a noun, not the comparison." }
  "as-2742":
    native: "He is the biggest of all."
    notes:
      "n1": "সকলোতকৈ (xôkôlutkôi) is 'than all': সকলো (xôkôlu), all, plus -তকৈ (-tôkôi). 'The biggest' is said as 'bigger than all'."
    confusables:
      "c1": { why: "Small, the opposite of biggest." }
      "c2": { why: "Short, not big." }
  "as-2743":
    native: "Our town is the biggest."
    notes:
      "n1": "আমাৰ শহৰ (āmār xôhôr) is 'our town'. The same 'than all' form সকলোতকৈ (xôkôlutkôi) gives 'the biggest'."
    confusables:
      "c1": { why: "A village, the opposite of a town." }
      "c2": { why: "A city, close but a different word." }
  "as-2744":
    native: "Coffee is not much better than tea."
    notes:
      "n1": "নহয় (nôhôy) means 'is not'. বেছি ভাল (besi bhāl), 'much better', comes after the thing compared, চাহতকৈ (sāhôtôkôi), than tea."
    confusables:
      "c1": { why: "Bad, not better." }
      "c2": { why: "Two, a number, not a comparison." }
  "as-2745":
    native: "The village is smaller than Guwahati."
    notes:
      "n1": "-তকৈ (-tôkôi), 'than', joins গৌহাটী (gôuhāti), Guwahati: গৌহাটীতকৈ (gôuhātitôkôi). 'Smaller' is just সৰু (soru), small."
    bases:
      "গৌহাটীতকৈ": "Guwahati"
    confusables:
      "c1": { why: "Town, the kind of place Guwahati is." }
      "c2": { why: "Big, the opposite of small." }
  "as-2746":
    native: "This one is better than that one."
    notes:
      "n1": "সেইটো (xeitu), 'that one', and এইটো (eitu), 'this one', are the pair. -তকৈ (-tôkôi) joins সেইটো (xeitu): সেইটোতকৈ (xeitutkôi), than that one."
    confusables:
      "c1": { why: "That one, a word of the sentence itself." }
      "c2": { why: "Tall, not better." }
