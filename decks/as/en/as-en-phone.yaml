schema: 1
id: "as-en-phone"
kind: "layer"
core: "as-phone"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phone"
license: "CC-BY-SA-4.0"
description: "Using a phone: calling, the message, the battery and the network, and the apps on the screen. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-2943":
    native: "phone; telephone"
    notes:
      "n1": "The word for a mobile or a landline phone. Written as said in English."
    examples:
      "মোৰ ফোন ব্যস্ত।": "My phone is busy."
      "ফোনটো নতুন।": { native: "The phone is new.", bases: { "ফোনটো": "phone; telephone" } }
  "as-2944":
    native: "to call; to phone"
    notes:
      "n1": "To telephone someone: ফোন কৰিবা (phon kôribā), will you call?"
    examples:
  "as-2945":
    native: "busy; occupied"
    notes:
      "n1": "Of a person, a line or a time. The opposite is খালী (khālī), free."
    examples:
      "তেওঁ ব্যস্ত।": "He is busy."
      "লাইন ব্যস্ত।": "The line is busy."
  "as-2946":
    native: "text message"
    notes:
      "n1": "A short written message sent on the phone. Written as said in English."
    examples:
      "মেচেজ পাইছোঁ।": { native: "I have received a message.", bases: { "পাইছোঁ": "to get; to receive" } }
      "মেচেজ লিখা।": "To write a message."
  "as-2947":
    native: "charge; battery power"
    notes:
      "n1": "How much power the phone has. Written as said in English."
    examples:
      "ফোনত চাৰ্জ নাই।": "There is no charge on the phone."
      "চাৰ্জ কিমান?": "How much charge is there?"
  "as-2948":
    native: "battery"
    notes:
      "n1": "The battery inside the phone. Written as said in English."
    examples:
      "বেটাৰী শেষ।": { native: "The battery is finished.", bases: { "শেষ": "end; last; finish" } }
      "নতুন বেটাৰী।": "A new battery."
  "as-2949":
    native: "network; signal"
    notes:
      "n1": "The mobile signal from the company. Written as said in English."
    examples:
      "নেটৱৰ্ক নাই।": "There is no network."
      "নেটৱৰ্ক ভাল।": "The network is good."
  "as-2950":
    native: "internet"
    notes:
      "n1": "The network of the whole world that links computers and phones. Written as said in English."
    examples:
      "ইণ্টাৰনেট আছে নেকি?": { native: "Is there internet?", bases: { "আছে": "to be; there is; to have" } }
      "ইণ্টাৰনেট নাই।": "There is no internet."
  "as-2951":
    native: "app"
    notes:
      "n1": "A programme on the phone. Written as said in English."
    examples:
      "এপ খোলা।": "Open the app."
      "এপটো নতুন।": { native: "The app is new.", bases: { "এপটো": "app" } }
  "as-2952":
    native: "ring; ringtone"
    notes:
      "n1": "The sound a phone makes when someone calls."
    examples:
      "ৰিং বাজিছে।": { native: "The phone is ringing.", bases: { "বাজিছে": "to play; to sound; to ring" } }
      "ৰিং শুনা।": "To hear the ring."
  "as-2953":
    native: "news; a message; information"
    notes:
      "n1": "News, or a piece of information someone sends you."
    examples:
      "বাতৰি ভাল।": "The news is good."
      "বাতৰি পাইছে।": { native: "He has got the news.", bases: { "পাইছে": "to get; to receive" } }
  "as-2954":
    native: "letter"
    notes:
      "n1": "A letter on paper, sent by post. Not a phone message."
    examples:
      "চিঠি লিখিছোঁ।": "I have written a letter."
      "চিঠি আহিছে।": "A letter has come."
  "as-2955":
    native: "email"
    notes:
      "n1": "An electronic letter. Written as said in English."
    examples:
      "ইমেইল পাইছোঁ।": { native: "I have received an email.", bases: { "পাইছোঁ": "to get; to receive" } }
      "ইমেইল কৰিবা।": "You will send an email."
  "as-2956":
    native: "password"
    notes:
      "n1": "The secret word to open an account. Written as said in English."
    examples:
      "পাছৱৰ্ড কি?": "What is the password?"
      "পাছৱৰ্ড নাই।": "There is no password."
  "as-2957":
    native: "account"
    notes:
      "n1": "A place in an app or a bank that holds your name and data. Written as said in English."
    examples:
      "একাউন্ট আছে।": { native: "There is an account.", bases: { "আছে": "to be; there is; to have" } }
      "মোৰ একাউন্ট নাই।": "I have no account."
  "as-2958":
    native: "on; working; running"
    notes:
      "n1": "Of a phone or a machine that is switched on and working. The opposite is বন্ধ (bôndhô)."
    examples:
      "ফোন চালু।": "The phone is on."
      "নেটৱৰ্ক চালু।": "The network is working."
  "as-2959":
    native: "free; empty; not busy"
    notes:
      "n1": "Of a line, a seat or a person with no work. The opposite is ব্যস্ত (byôstô)."
    examples:
      "তেওঁ খালী।": "He is free."
      "বেঞ্চ খালী।": "The bench is empty."
  "as-2960":
    native: "to talk; to speak"
    notes:
      "n1": "To talk to someone on the phone or in person."
    bases:
      "কথা": "talk; speech; matter"
    examples:
  "as-2961":
    native: "line; phone line"
    notes:
      "n1": "The connection between two phones or a queue of people."
    examples:
      "লাইন ভাল নাই।": "The line is not good."
      "লাইনত মানুহ বহুত।": { native: "There are many people in the line.", bases: { "লাইনত": "line; phone line" } }
