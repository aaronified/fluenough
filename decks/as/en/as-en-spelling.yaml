schema: 1
id: "as-en-spelling"
kind: "layer"
core: "as-spelling"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Assamese spellings, standard and casual"
license: "CC0-1.0"
description: "Spellings you will meet on the web, on old signs and in older print: Bengali letters typed for Assamese ones, marks left out, and older names. Here each is beside the standard spelling. Recognition only. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0458":
    native: "house; standard ঘৰ (ghôr)"
    notes:
      "n1": "Typed with the Bengali র (rô), a dot below, in place of Assamese ৰ (rô), a stroke across. A keyboard with no ৰ (rô) does this, and so does some text on the web. The word is the same."
  "as-0459":
    native: "I go; standard যাওঁ (zāum̐)"
    notes:
      "n1": "Casual typing often leaves out the nasal mark ঁ (ôm̐) that ends 'I' verbs: যাও (zāu), খাও (khāu), আছো (āsu). Standard spelling keeps it: যাওঁ (zāum̐), খাওঁ (khāum̐), আছোঁ (āsum̐)."
  "as-0460":
    native: "it became; it is (in a definition); standard হ (hô)'ল (lô)"
    notes:
      "n1": "Casual typing often drops the apostrophe that marks a closed o. Careful writing keeps it: ক (kô)'ত (tô), হ (hô)'ল (lô), ল (lô)'ৰা (rā)."
  "as-0461":
    native: "where; standard ক (kô)'ত (tô)"
    notes:
      "n1": "The same apostrophe, left out. Without it the word looks as if it should be said with the open o."
  "as-0462":
    native: "Assam; in Assamese অসম (ôxôm)"
    notes:
      "n1": "The name as Bengali, Hindi and older writing spell it, after English Assam. Assamese writes অসম (ôxôm)."
  "as-0463":
    native: "Guwahati; today গুৱাহাটী (guwāhāti)"
    notes:
      "n1": "An older spelling, after the English Gauhati, still on some old signs and in older books. Today the city is গুৱাহাটী (guwāhāti), and Guwahati in English too."
  "as-0464":
    native: "water; standard পানী (pāni)"
    notes:
      "n1": "Written with the short i, as Bengali spells it. Assamese spelling has the long ী (i): পানী (pāni)."
  "as-0465":
    native: "Assamese; standard অসমীয়া (ôxomiyā)"
    notes:
      "n1": "A common slip, with the short i. Standard spelling has the long ী (i), as in পানী (pāni)."
