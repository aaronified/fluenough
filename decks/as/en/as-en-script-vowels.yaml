schema: 1
id: "as-en-script-vowels"
kind: "layer"
core: "as-script-vowels"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Assamese vowels"
license: "CC0-1.0"
description: "The eleven vowels as they are written on their own: at the start of a word, or after another vowel. Assamese shares them with Bengali. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0001":
    native: "o, open (the vowel every consonant carries)"
    notes:
      "n1": "Said with the mouth open, like the 'o' of British 'hot' or the 'aw' of 'law'. Every consonant carries it unless a sign changes it: ক (kô) is 'ko'. On its own it starts a word: অসম (ôxôm, Assam), which chat writes Axom."
  "as-0002":
    native: "a (as in 'father')"
    notes:
      "n1": "Like the 'a' of 'father', never the 'a' of 'cat': আম (ām, mango). Assamese has no long and short vowels, so hold it no longer than any other."
  "as-0003":
    native: "i, short form (hroswo i)"
    notes:
      "n1": "Like the 'ee' of 'see': ইয়াত (iyāt, here). Assamese writes i two ways, short and long, but both sound the same: which one a word takes is spelling."
  "as-0004":
    native: "i, long form (dirgho i)"
    notes:
      "n1": "Sounds just like ই (i), the 'ee' of 'see'. The long form is kept from Sanskrit spelling: ঈদ (id, Eid). Because it sounds the same, it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  "as-0005":
    native: "u, short form (hroswo u)"
    notes:
      "n1": "Like the 'oo' of 'food': উজু (uzu, easy). As with i, the short and long forms of u sound the same."
  "as-0006":
    native: "u, long form (dirgho u)"
    notes:
      "n1": "Sounds just like উ (u). It is rare: ঊষা (uxā, dawn), and the number ঊনৈশ (unôix, nineteen). Because it sounds the same, it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  "as-0007":
    native: "ri (a vowel letter)"
    notes:
      "n1": "Said 'ri', as at the start of 'river', though it is written as one vowel. It comes in words from Sanskrit: ঋতু (ritu, season). A recogniser writes this sound as ৰি (ri), so it is drilled by reading and writing only."
  "as-0008":
    native: "e (as in 'café'; often 'e' as in 'bed')"
    notes:
      "n1": "Usually the 'e' of 'café', without the glide of English 'say'. In many words it is opener, like the 'e' of 'bed': এক (ek, one). The spelling doesn't show which."
  "as-0009":
    native: "oi (as in 'boy')"
    notes:
      "n1": "A glide from o to i, like the 'oy' of 'boy'. It is rare at the start of a word: ঐক্য (ôikyô, unity). A recogniser often writes this sound as অই (ôi), so it is drilled by reading and writing only."
  "as-0010":
    native: "o, closed (as in 'go'; often close to u)"
    notes:
      "n1": "Like the 'o' of 'go', without the 'w' English adds at the end: হোটেল (hotel, hotel). In many everyday words it is said closer to u, and chat writes it u: মোৰ (mur, my). Don't confuse it with অ (ô), the open o."
  "as-0011":
    native: "ou (o gliding to u)"
    notes:
      "n1": "A glide from o to u, as in 'go' run into 'oo'. It is rare: ঔষধ (ôuxôdh, medicine, a formal word; people say দৰব (dôrôb)). A recogniser often writes this sound as অউ (ôu), so it is drilled by reading and writing only."
