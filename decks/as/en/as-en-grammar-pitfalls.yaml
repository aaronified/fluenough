schema: 1
id: "as-en-grammar-pitfalls"
kind: "layer"
core: "as-grammar-pitfalls"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Pitfalls"
license: "CC0-1.0"
description: "The mistakes English speakers make most in Assamese. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-2148":
    native: "I drink water."
    notes:
      "n1": "Assamese eats water and tea, and even cigarettes: খোৱা (khuwā) covers drinking and smoking. চিগাৰেট খোৱা (sigāret khuwā), to smoke."
    bases:
      "মই": "I"
  "as-2009":
    notes:
      "n1": "With আপুনি (āpuni), a request ends in -ক (-kô). তুমি বহা (tumi bôhā) is for friends; তই বহ (toi bôh) for the very close, and rude to a stranger."
  "as-2149":
    native: "I don't know."
    notes:
      "n1": "'Not' on a verb is ন- (nô-) before it, not a separate word: জানোঁ (zānum̐), I know; নাজানোঁ (nāzānum̐), I don't know."
    bases:
      "মই": "I"
      "নাজানোঁ": "to know"
  "as-2150":
    native: "I'm hungry."
    notes:
      "n1": "'Hunger has struck me'. So too মোৰ পিয়াহ লাগিছে (mur piyāh lāgise), I'm thirsty."
    bases:
      "মোৰ": "I"
      "ভোক": "hunger"
  "as-2151":
    native: "I have to go now."
    notes:
      "n1": "'Going will be needed': the verb in -ব (-bô), then লাগিব (lāgib)."
    bases:
      "মই": "I"
      "যাব": "to go"
  "as-2152":
    native: "She is my younger sister."
    notes:
      "n1": "Assamese tells an elder sibling from a younger: বাই (bāi), elder sister; ভনী (bhoni), younger sister; ককাই (kôkāi), elder brother; ভাই (bhāi), younger brother."
    bases:
      "তাই": "she"
      "মোৰ": "I"
      "ভনী": "younger sister"
  "as-2153":
    native: "my father"
    notes:
      "n1": "A word for family takes an ending for whose it is: মোৰ দেউতা (mur deutā), my father; তোমাৰ দেউতাৰা (tumār deutārā), your father; তাৰ দেউতাক (tār deutāk), his father."
    bases:
      "মোৰ": "I"
  "as-2154":
    native: "your father (familiar)"
    notes:
      "n1": "With তুমি (tumi) the family word takes -ৰা (-rā): তোমাৰ মাৰা (tumār mārā), your mother."
    bases:
      "তোমাৰ": "you (familiar)"
  "as-2155":
    native: "his father; her father"
    notes:
      "n1": "With সি (si), তাই (tāi), তেওঁ (teum̐) and আপুনি (āpuni) it takes -ক (-kô): তাৰ মাক (tār māk), his mother; আপোনাৰ দেউতাক (āpunār deutāk), your father."
    bases:
      "তেওঁৰ": "he; she"
  "as-2156":
    native: "He came yesterday."
    notes:
      "n1": "কালি (kāli) is yesterday, and tomorrow is কাইলৈ (kāilôi); আজি (āzi) is today. অহা (ôhā), to come, changes its stem: আহ- (āh-)."
    bases:
      "সি": "he; that"
      "আহিল": "to come"
  "as-2157":
    native: "Where do you live?"
    notes:
      "n1": "আপুনি (āpuni) takes the same verb form as সি (si), he: আপুনি থাকে (āpuni thāke), সি থাকে (si thāke). With তুমি (tumi) it is থাকা (thākā)."
    bases:
      "থাকে": "to stay; to keep on"
  "as-2158":
    native: "yes; is"
    notes:
      "n1": "হয় (hôy) is 'yes', and নহয় (nôhôy) is 'no' and 'is not'."
