schema: 1
id: "as-en-multiword-4"
kind: "layer"
core: "as-multiword-4"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: compound and experiencer"
description: "Compound verbs, where a second verb adds its sense to the first, and experiencer constructions, where the feeling is the subject. Not yet checked by an Assamese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "as-4650":
    native: "to detect something, as doctors detect disease germs"
    notes:
      "u1": "A compound verb: the second verb adds the sense of completing or managing the action."
  "as-4651":
    native: "to be detected or caught, as a smuggler was caught at an airport"
    notes:
      "u1": "A compound verb: the second verb shows the result, here of being caught or detected."
  "as-4652":
    native: "to become something, or to occur or happen"
    notes:
      "u1": "Used both as to become and as to happen; the same phrase covers both senses."
    bases:
      "হৈ": { meaning: "to become; to be" }
  "as-4653":
    native: "to insert one thing into another"
    notes:
      "u1": "The object goes before the phrase; the second verb gives the sense of putting the first in."
  "as-4654":
    native: "to point something out, so that someone notices it"
    notes:
      "u1": "Used of pointing something out so that another person sees or understands it."
  "as-4655":
    native: "to understand something, or to come to know it"
    notes:
      "u1": "The second verb carries the sense of getting the meaning, so the phrase means to understand."
    bases:
      "পোৱা": { meaning: "to get; to receive" }
  "as-4656":
    native: "to recognise someone or something, or to remember it"
    notes:
      "u1": "The second verb gives the sense of getting hold of the recognition, not of a thing."
    bases:
      "চিনি": { meaning: "sugar" }
      "পোৱা": { meaning: "to get; to receive" }
      "h1": "Spelled like the noun চিনি (sini), sugar; as a verb it means to recognise, not sugar."
  "as-4657":
    native: "to reach a place after going towards it"
    notes:
      "u1": "Used for arriving somewhere after going there; the second verb carries the result."
    bases:
      "পা": { meaning: "to get; to receive" }
  "as-4658":
    native: "to be hungry, as in I am hungry"
    notes:
      "u1": "The feeling is the grammatical subject, so the verb agrees with the feeling and the person feeling it is marked as possessor."
    bases:
      "ভোক": { meaning: "hunger" }
      "লগা": { meaning: "to feel" }
  "as-4659":
    native: "I love you, or I like you"
    notes:
      "u1": "The person liked takes the -k ending, and the verb is the first-person form of the verb to get."
    bases:
      "তোমাক": { meaning: "object form of তুমি (tumi) meaning you" }
      "পাওঁ": { meaning: "to get; to like" }
  "as-4660":
    native: "I hate you, or I dislike you"
    notes:
      "u1": "The same pattern as the card for love or like, with the opposite feeling."
    bases:
      "তোমাক": { meaning: "object form of তুমি (tumi) meaning you" }
      "পাওঁ": { meaning: "to get; to like" }
