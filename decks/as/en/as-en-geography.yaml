schema: 1
id: "as-en-geography"
kind: "layer"
core: "as-geography"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Geography: the world, maps and places"
license: "CC-BY-SA-4.0"
description: "The world and its parts: the continents and the oceans, the map, the regions, the coast and the directions. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3126":
    native: "earth; the world"
    notes:
      "n1": "The planet we live on. Also the world of people, as in all of the earth."
    examples:
      "পৃথিৱী ডাঙৰ।": "The earth is big."
      "পৃথিৱীত বহুত দেশ।": { native: "There are many countries in the world.", bases: { "পৃথিৱীত": "earth; the world" } }
  "as-3127":
    native: "world; universe"
    notes:
      "n1": "The whole world, of people and of things. Used in names such as বিশ্ববিদ্যালয় (bixxobidyālôy), a university."
    examples:
      "বিশ্ব ডাঙৰ।": "The world is big."
      "বিশ্বত বহুত মানুহ।": { native: "There are many people in the world.", bases: { "বিশ্বত": "world; universe" } }
  "as-3128":
    native: "continent"
    notes:
      "n1": "One of the great lands of the earth, such as Asia."
    examples:
      "এইটো মহাদেশ।": "This is a continent."
      "মহাদেশ বহুত।": "There are many continents."
  "as-3129":
    native: "ocean"
    notes:
      "n1": "A very large sea, such as the Indian Ocean."
    examples:
      "মহাসাগৰ ডাঙৰ।": "The ocean is big."
      "মহাসাগৰত পানী।": { native: "There is water in the ocean.", bases: { "মহাসাগৰত": "ocean" } }
  "as-3130":
    native: "map"
    notes:
      "n1": "A drawing of the land, with its rivers and towns."
    examples:
      "মানচিত্ৰ ভাল।": "The map is good."
      "মানচিত্ৰত অসম।": { native: "Assam is on the map.", bases: { "মানচিত্ৰত": "map" } }
  "as-3131":
    native: "region; area"
    notes:
      "n1": "A part of a country or of the world, with its own features."
    examples:
      "এইটো অঞ্চল ধুনীয়া।": "This region is beautiful."
      "অঞ্চল বহুত ডাঙৰ।": "The region is very big."
  "as-3132":
    native: "province; state"
    notes:
      "n1": "A large part of a country, with its own government."
    examples:
      "প্ৰদেশ ডাঙৰ।": "The state is big."
      "প্ৰদেশৰ নাম।": { native: "The name of the state.", bases: { "প্ৰদেশৰ": "province; state" } }
  "as-3133":
    native: "border; boundary"
    notes:
      "n1": "The line that marks where one country or state ends."
    examples:
      "সীমা দূৰ।": "The border is far."
      "সীমাত ৰাস্তা।": { native: "There is a road at the border.", bases: { "সীমাত": "border; boundary" } }
  "as-3134":
    native: "direction; side"
    notes:
      "n1": "Which way. The four directions are উত্তৰ (uttôr, north), দক্ষিণ (dôkkhin, south), পূব (pub, east) and পশ্চিম (poscim, west)."
    examples:
      "কোনটো দিশ?": "Which direction?"
      "এইটো দিশ।": "This direction."
  "as-3135":
    native: "south"
    notes:
      "n1": "The direction opposite to north."
    examples:
      "দক্ষিণ দিশ।": "The south direction."
      "দক্ষিণত সাগৰ।": { native: "The sea is to the south.", bases: { "দক্ষিণত": "south" } }
  "as-3136":
    native: "east"
    notes:
      "n1": "The direction where the sun rises."
    examples:
      "পূবত ৰ'দ।": { native: "The sun is in the east.", bases: { "পূবত": "east" } }
      "পূব দিশ।": "The east direction."
  "as-3137":
    native: "west"
    notes:
      "n1": "The direction where the sun sets."
    examples:
      "পশ্চিমত পাহাৰ।": { native: "There are hills to the west.", bases: { "পশ্চিমত": "west" } }
      "পশ্চিম দিশ।": "The west direction."
  "as-3138":
    native: "coast; shore"
    notes:
      "n1": "The land along the edge of the sea."
    examples:
      "উপকূল ধুনীয়া।": "The coast is beautiful."
      "উপকূলত মানুহ।": { native: "There are people on the coast.", bases: { "উপকূলত": "coast; shore" } }
  "as-3139":
    native: "desert"
    notes:
      "n1": "A dry land with little rain and sand."
    examples:
      "মৰুভূমি গৰম।": "The desert is hot."
      "মৰুভূমিত বালি।": { native: "There is sand in the desert.", bases: { "মৰুভূমিত": "desert" } }
  "as-3140":
    native: "climate"
    notes:
      "n1": "The usual weather of a place over many years."
    examples:
      "জলবায়ু ভাল।": "The climate is good."
      "জলবায়ু বেয়া।": "The climate is bad."
  "as-3141":
    native: "globe; sphere"
    notes:
      "n1": "A ball showing the earth, with its countries."
    examples:
      "গোলক ডাঙৰ।": "The globe is big."
      "গোলকত দেশ।": { native: "There are countries on the globe.", bases: { "গোলকত": "globe; sphere" } }
  "as-3142":
    native: "India"
    notes:
      "n1": "The country of India, of which Assam is a state. Written as it is said in Assamese."
    examples:
      "ভাৰত ডাঙৰ দেশ।": "India is a big country."
      "অসম ভাৰতত।": { native: "Assam is in India.", bases: { "ভাৰতত": "India" } }
  "as-3143":
    native: "depth"
    notes:
      "n1": "How deep a sea, a river or a well is."
    examples:
      "গভীৰতা বেছি।": "The depth is great."
      "নদীৰ গভীৰতা।": "The depth of the river."
  "as-3144":
    native: "earthquake"
    notes:
      "n1": "The shaking of the earth."
    examples:
      "ভূমিকম্প হৈছে।": { native: "There was an earthquake.", bases: { "হৈছে": "to become; to be" } }
      "ভূমিকম্প বেয়া।": "The earthquake is bad."
  "as-3145":
    native: "name of a country"
    notes:
      "n1": "The name of a country, as it appears on a map."
    examples:
  "as-3146":
    native: "a map of the world"
    notes:
      "n1": "A map that shows all the continents."
    examples:
