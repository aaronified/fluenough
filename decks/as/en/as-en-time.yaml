schema: 1
id: "as-en-time"
kind: "layer"
core: "as-time"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Time and days"
license: "CC-BY-SA-4.0"
description: "Today, yesterday and tomorrow, each with its own word, telling the time, and the days of the week. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0350":
    native: "today"
    examples:
      "আজি অতি গৰম।": { native: "Today it is very hot.", bases: {  } }
      "আজি অনুষ্ঠান আছে।": { native: "There is a programme today.", bases: { "আছে": "to be; there is; to have" } }
  "as-0351":
    native: "tomorrow"
    notes:
      "n1": "Unlike Hindi and Bengali, which use one word for both, Assamese has a word for tomorrow and another for yesterday: কালি (kāli)."
    examples:
      "নিযুক্তি কাইলৈ।": { native: "The appointment is tomorrow.", bases: {  } }
      "বুকিং কাইলৈ।": { native: "The booking is tomorrow.", bases: {  } }
  "as-0352":
    native: "yesterday"
    examples:
      "আজি কালিতকৈ গৰম।": { native: "Today is hotter than yesterday.", bases: { "কালিতকৈ": "yesterday" } }
      "কালি ভাল আছিল।": { native: "Yesterday was good.", bases: { "আছিল": "was" } }
  "as-0353":
    native: "now"
    examples:
      "এতিয়া শীত।": { native: "It is cold now.", bases: {  } }
      "অফাৰ এতিয়া আছে।": { native: "The offer is on now.", bases: { "আছে": "to be; there is; to have" } }
  "as-0354":
    native: "morning"
    notes:
      "n1": "ৰাতিপুৱা সাত বজাত (rātipuwā xāt bôzāt), at seven in the morning."
    examples:
      "ৰাতিপুৱা ভাল।": { native: "Morning is good.", bases: {  } }
      "ৰাতিপুৱা মই জলপান খাওঁ।": { native: "In the morning I eat breakfast.", bases: {  } }
  "as-0355":
    native: "midday; early afternoon"
    examples:
      "দুপৰীয়াৰ ভাত": { native: "lunch", bases: { "দুপৰীয়াৰ": "midday; early afternoon" } }
      "দুপৰীয়া তাপ বহুত।": { native: "At midday the heat is great.", bases: {  } }
  "as-0356":
    native: "evening; dusk"
    notes:
      "n1": "The hour when cattle come home and the dust they raise hangs in the light: গো (cattle) and ধূলি (dust)."
    examples:
      "গধূলি ভাল।": { native: "Evening is good.", bases: {  } }
      "গধূলি মই ঘৰত।": { native: "In the evening I am at home.", bases: {  } }
  "as-0357":
    native: "night"
    examples:
      "ৰাতি অন্ধকাৰ।": { native: "The night is dark.", bases: {  } }
      "ৰাতি থকা": { native: "to stay the night", bases: {  } }
  "as-0358":
    native: "o'clock"
    notes:
      "n1": "চাৰি বজা (sāri bôzā), four o'clock; চাৰি বজাত (sāri bôzāt), at four. From বজা (bôzā), to ring, as a clock chimes."
    examples:
      "কিমান বাজিছে?": { native: "What time is it?", bases: { "বাজিছে": "o'clock" } }
      "মই সদায় সাত বজাত উঠোঁ।": { native: "I get up at seven every day.", bases: { "মই": "I", "বজাত": "o'clock" } }
  "as-0359":
    native: "half past four; 4½"
    notes:
      "n1": "সাৰে (xāre) adds a half to any number from three on. Half past one is ডেৰ (der), half past two আঢ়ৈ (ārhôi)."
    bases:
      "সাৰে": "and a half"
  "as-0360":
    native: "What time is it?"
    notes:
      "n1": "Literally 'how many has it rung?'. The answer: চাৰি বাজিছে (sāri bāzise), it's four."
  "as-0361":
    native: "day"
    examples:
      "উৎসৱী দিন।": { native: "A festive day.", bases: {  } }
      "শুভ দিন।": { native: "An auspicious day.", bases: {  } }
  "as-0362":
    native: "week"
    examples:
      "এটা সপ্তাহ।": { native: "A week.", bases: {  } }
      "মই প্ৰতি সপ্তাহে ফুটবল খেলোঁ।": { native: "I play football every week.", bases: { "প্ৰতি": "each; every", "সপ্তাহে": "week" } }
  "as-0363":
    native: "Monday"
    notes:
      "n1": "Each day ends in বাৰ (bār), and most names match Bengali's and Hindi's."
    examples:
      "আজি সোমবাৰ।": { native: "Today is Monday.", bases: {  } }
      "সোমবাৰ এটা দিন।": { native: "Monday is a day.", bases: {  } }
  "as-0364":
    native: "Tuesday"
    examples:
      "আজি মঙলবাৰ।": { native: "Today is Tuesday.", bases: {  } }
      "মঙলবাৰ এটা দিন।": { native: "Tuesday is a day.", bases: {  } }
  "as-0365":
    native: "Wednesday"
    examples:
      "আজি বুধবাৰ।": { native: "Today is Wednesday.", bases: {  } }
      "বুধবাৰ এটা দিন।": { native: "Wednesday is a day.", bases: {  } }
  "as-0366":
    native: "Thursday"
    examples:
      "আজি বৃহস্পতিবাৰ।": { native: "Today is Thursday.", bases: {  } }
      "বৃহস্পতিবাৰ এটা দিন।": { native: "Thursday is a day.", bases: {  } }
  "as-0367":
    native: "Friday"
    examples:
      "আজি শুক্ৰবাৰ।": { native: "Today is Friday.", bases: {  } }
      "শুক্ৰবাৰ এটা দিন।": { native: "Friday is a day.", bases: {  } }
  "as-0368":
    native: "Saturday"
    examples:
      "আজি শনিবাৰ।": { native: "Today is Saturday.", bases: {  } }
      "শনিবাৰ এটা দিন।": { native: "Saturday is a day.", bases: {  } }
  "as-0369":
    native: "Sunday"
    notes:
      "n1": "Here Assamese differs from Bengali and Hindi, which say রবিবার (robibār) and रविवार (ravivār)."
    examples:
      "আজি দেওবাৰ।": { native: "Today is Sunday.", bases: {  } }
      "দেওবাৰ এটা দিন।": { native: "Sunday is a day.", bases: {  } }
