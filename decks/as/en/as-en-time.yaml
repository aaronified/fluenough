schema: 1
id: "as-en-time"
kind: "layer"
core: "as-time"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Time and days"
license: "CC-BY-SA-4.0"
description: "Today, yesterday and tomorrow, each with its own word, telling the time, and the days of the week. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0350":
    native: "today"
    examples:
      "আজি অতি গৰম।": { native: "Today it is very hot.", bases: {  } }
      "আজি অনুষ্ঠান আছে।": { native: "There is a programme today.", bases: { "আছে": "to be; there is; to have" } }
  "as-0351":
    native: "tomorrow"
    notes:
      "n1": "Unlike Hindi and Bengali, which use one word for both, Assamese has a word for tomorrow and another for yesterday: কালি (kāli)."
    examples:
      "নিযুক্তি কাইলৈ।": { native: "The appointment is tomorrow.", bases: {  } }
      "বুকিং কাইলৈ।": { native: "The booking is tomorrow.", bases: {  } }
  "as-0352":
    native: "yesterday"
    examples:
      "বল কালি।": { native: "The ball is yesterday's.", bases: {  } }
  "as-0353":
    native: "now"
    examples:
      "এতিয়া শীত।": { native: "It is cold now.", bases: {  } }
      "অফাৰ এতিয়া আছে।": { native: "The offer is on now.", bases: { "আছে": "to be; there is; to have" } }
  "as-0354":
    native: "morning"
    notes:
      "n1": "ৰাতিপুৱা সাত বজাত (rātipuwā xāt bôzāt), at seven in the morning."
  "as-0355":
    native: "midday; early afternoon"
    examples:
      "দুপৰীয়া তাপ বহুত।": { native: "At midday the heat is great.", bases: {  } }
  "as-0356":
    native: "evening; dusk"
    notes:
      "n1": "The hour when cattle come home and the dust they raise hangs in the light: গো (cattle) and ধূলি (dust)."
  "as-0357":
    native: "night"
    examples:
      "ৰাতি অন্ধকাৰ।": { native: "The night is dark.", bases: {  } }
      "ৰাতি থকা": { native: "to stay the night", bases: {  } }
  "as-0358":
    native: "o'clock"
    notes:
      "n1": "চাৰি বজা (sāri bôzā), four o'clock; চাৰি বজাত (sāri bôzāt), at four. From বজা (bôzā), to ring, as a clock chimes."
  "as-0359":
    native: "half past four; 4½"
    notes:
      "n1": "সাৰে (xāre) adds a half to any number from three on. Half past one is ডেৰ (der), half past two আঢ়ৈ (ārhôi)."
    bases:
      "সাৰে": "and a half"
  "as-0360":
    native: "What time is it?"
    notes:
      "n1": "Literally 'how many has it rung?'. The answer: চাৰি বাজিছে (sāri bāzise), it's four."
  "as-0361":
    native: "day"
    examples:
      "উৎসৱী দিন।": { native: "A festive day.", bases: {  } }
      "শুভ দিন।": { native: "An auspicious day.", bases: {  } }
  "as-0362":
    native: "week"
  "as-0363":
    native: "Monday"
    notes:
      "n1": "Each day ends in বাৰ (bār), and most names match Bengali's and Hindi's."
  "as-0364":
    native: "Tuesday"
  "as-0365":
    native: "Wednesday"
  "as-0366":
    native: "Thursday"
  "as-0367":
    native: "Friday"
  "as-0368":
    native: "Saturday"
  "as-0369":
    native: "Sunday"
    notes:
      "n1": "Here Assamese differs from Bengali and Hindi, which say রবিবার (robibār) and रविवार (ravivār)."
