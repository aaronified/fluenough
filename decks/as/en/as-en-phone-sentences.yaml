native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phone: sentences"
license: "CC-BY-SA-4.0"
description: "Sentences built from the words of this unit and the ones before it. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-2962":
    native: "Will you call?"
    notes:
      "n1": "নেকি (neki) turns this into a yes-or-no question. ফোন কৰা (phon kôrā), 'to phone', is literally 'do phone'; কৰিবা (koribā) is the future 'you' form."
    confusables:
      "c1": { why: "A message, not a call." }
      "c2": { why: "A letter on paper, not a call." }
  "as-2963":
    native: "My phone has no charge."
    notes:
      "n1": "ফোনত (phonôt), 'on the phone', comes first, and নাই (nāi), 'there is not', says the charge is missing. It is the negative of আছে (āse), 'there is'."
    confusables:
      "c1": { why: "The battery, close but not the charge." }
      "c2": { why: "The signal, a different thing." }
  "as-2964":
    native: "Open the app."
    notes:
      "n1": "এপটো (epôtu) is 'the app': এপ (epô), app, plus the ending -টো (-tu). খোলা (khulā), 'open', is the dictionary form used as a command."
    confusables:
      "c1": { why: "Closed, the opposite of open." }
      "c2": { why: "Working, not open." }
  "as-2965":
    native: "I have got the news."
    notes:
      "n1": "পাইছোঁ (pāisum̐) is from পোৱা (puwā), 'to get', whose stem becomes পা- (pā-). বাতৰি (bātori) means 'news'."
    bases:
      "পাইছোঁ": "to get; to receive"
    confusables:
      "c1": { why: "A ring, a sound not news." }
      "c2": { why: "An email, one way to get the news." }
  "as-2966":
    native: "The line is busy."
    confusables:
      "c1": { why: "Free, the opposite of busy." }
      "c2": { why: "News, not the state of the line." }
  "as-2967":
    native: "He is talking."
    notes:
      "n1": "কৈছে (kôise) is from কোৱা (kuwā), 'to say', whose stem changes to কৈ- (kôi-). কথা কোৱা (kôthā kuwā) is 'to speak'."
    bases:
      "কথা": "talk; speech; matter"
    confusables:
      "c1": { why: "To hear, not to talk." }
      "c2": { why: "To write, not to talk." }
  "as-2968":
    native: "There is no internet."
    notes:
      "n1": "নাই (nāi), 'there is not', is the negative of আছে (āse), 'there is'. ইণ্টাৰনেট নাই (intārônet nāi) needs no other verb."
    confusables:
      "c1": { why: "The signal, close to the internet." }
      "c2": { why: "Charge, not the internet." }
  "as-2969":
    native: "What is the password?"
    notes:
      "n1": "কি (ki), 'what', goes after the thing asked about, and no verb 'is' is needed."
    confusables:
      "c1": { why: "The account, a related word." }
      "c2": { why: "An email, not the password." }
