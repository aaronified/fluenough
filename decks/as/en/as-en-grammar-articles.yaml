native: { code: "en", iso639_3: "eng", name: "English" }
name: "Classifiers: a and the"
license: "CC0-1.0"
description: "Assamese has no 'a' or 'the'. A classifier does their work: -টো (-tu) and -টা (-tā) for things, -জন (-zôn) and -জনী (-zoni) for people, -খন (-khôn) for flat and large things. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-2041":
    native: "The book is on the table."
    notes:
      "n1": "Assamese has no 'the': -খন (-khôn) after the noun does its work."
  "as-2042":
    native: "A man has come."
    notes:
      "n1": "এজন (ezôn), 'one' with -জন (-zôn) for a man, does the work of 'a'."
  "as-2043":
    native: "The man has come."
  "as-2044":
    native: "Where is the girl?"
    notes:
      "n1": "-জনী (-zoni) is for a woman or a girl: এজনী ছোৱালী (ezoni suwāli), a girl."
  "as-2045":
    native: "A mango, please."
    notes:
      "n1": "After a number, things take -টা (-tā): এটা (etā), দুটা (dutā), তিনিটা (tinitā). After a noun it is -টো (-tu): আমটো (āmôtu), the mango."
  "as-2046":
    native: "Where are the mangoes?"
    notes:
      "n1": "-বোৰ (-bur), 'the several', makes a plural."
  "as-2047":
    native: "Two cups of tea, please."
    notes:
      "n1": "With a measure, such as a cup, a kilo or a day, the number takes no classifier: দুকাপ (dukāp), দুকিলো (dukilu), দুদিন (dudin)."
  "as-2048":
    native: "Someone has come."
    notes:
      "n1": "কোনোবা (kunubā) is 'someone'; কিবা (kibā), 'something'."
  "as-2049":
    native: "the car"
    notes:
      "n1": "-খন (-khôn) is for vehicles, flat things, books and places: গাড়ীখন (gārikhôn), কিতাপখন (kitāpkhôn), চহৰখন (sôhôrôkhôn)."
  "as-2050":
    native: "the pen"
    notes:
      "n1": "-ডাল (-dāl) is for long, thin things: a pen, a stick, a rope."
  "as-2051":
    native: "the water"
    notes:
      "n1": "-খিনি (-khini) is for an amount of something you don't count: water, rice, milk."
