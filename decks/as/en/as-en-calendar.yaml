schema: 1
id: "as-en-calendar"
kind: "layer"
core: "as-calendar"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Months and years"
license: "CC0-1.0"
description: "The months as Assamese writes them, how to read a year, and Bihu, which marks the Assamese year. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0390":
    native: "month"
    notes:
      "n1": "The Assamese calendar's months, ব (bô)'হাগ (bohag) to চ (sô)'ত (sot), mark festivals and farming; daily life uses the Gregorian months."
  "as-0391":
    native: "year"
    notes:
      "n1": "A year is read as a number: 2020 is দুহাজাৰ বিশ (duhāzār bix)."
  "as-0392":
    native: "date"
    notes:
      "n1": "আজি কিমান তাৰিখ? (aji kiman tarikh?), what's the date today?"
  "as-0393":
    native: "January"
    notes:
      "n1": "Assamese writes the English months with its own letters: ৱ (wô) for w, চ (sô) and ছ (sô) for s, ভ (bhô) for v."
  "as-0394":
    native: "February"
  "as-0395":
    native: "March"
  "as-0396":
    native: "April"
  "as-0397":
    native: "May"
  "as-0398":
    native: "June"
  "as-0399":
    native: "July"
  "as-0400":
    native: "August"
  "as-0401":
    native: "September"
  "as-0402":
    native: "October"
  "as-0403":
    native: "November"
  "as-0404":
    native: "December"
  "as-0405":
    native: "Bihu (the festival)"
    notes:
      "n1": "Assam's festival, three times a year: ব (bô)'হাগ বিহু (bohag bihu) in mid-April brings in the new year with dancing and songs; মাঘ বিহু (māgh bihu) in January feasts after the harvest; কাতি বিহু (kāti bihu) in October lights lamps in the fields."
  "as-0406":
    native: "Bohag (the first Assamese month, mid-April to mid-May)"
    notes:
      "n1": "Its Bihu is also called ৰঙালী বিহু (rôṅāli bihu), the Bihu of joy."
