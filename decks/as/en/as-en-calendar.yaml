  "as-0405":
    native: "Bihu (the festival)"
    notes:
      "n1": "Assam's festival, three times a year: ব (bô)'হাগ বিহু (bohag bihu) in mid-April brings in the new year with dancing and songs; মাঘ বিহু (māgh bihu) in January feasts after the harvest; কাতি বিহু (kāti bihu) in October lights lamps in the fields."
    examples:
      "কঙালী বিহু": { native: "Kongali Bihu (the lean festival, in October)", bases: { "কঙালী": "Kongali (the autumn lean festival)" } }
      "ব'হাগ বিহু": { native: "Rongali Bihu (the spring festival, in mid-April)", bases: {  } }
  "as-0406":
    native: "Bohag (the first Assamese month, mid-April to mid-May)"
    notes:
      "n1": "Its Bihu is also called ৰঙালী বিহু (rôṅāli bihu), the Bihu of joy."
    examples:
      "ব'হাগ বিহুত বহুত নাচ আছে।": { native: "There is a lot of dancing at Rongali Bihu.", bases: { "আছে": "to be; there is; to have" } }
      "ব'হাগ বিহু": { native: "Rongali Bihu (the spring festival, in mid-April)", bases: {  } }
