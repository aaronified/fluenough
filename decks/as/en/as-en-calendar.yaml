schema: 1
id: "as-en-calendar"
kind: "layer"
core: "as-calendar"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Months and years"
license: "CC-BY-SA-4.0"
description: "The months as Assamese writes them, how to read a year, and Bihu, which marks the Assamese year. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0390":
    native: "month"
    notes:
      "n1": "The Assamese calendar's months, ব (bô)'হাগ (bohag) to চ (sô)'ত (sot), mark festivals and farming; daily life uses the Gregorian months."
    examples:
      "মাহ ত্ৰিশ দিন।": { native: "A month is thirty days.", bases: {  } }
      "এটা বছৰত বাৰ মাহ।": { native: "A year has twelve months.", bases: {  } }
  "as-0391":
    native: "year"
    notes:
      "n1": "A year is read as a number: 2020 is দুহাজাৰ বিশ (duhāzār bix)."
    examples:
      "এটা বছৰত বাৰ মাহ।": { native: "A year has twelve months.", bases: { "বছৰত": "in the year" } }
      "নতুন বছৰ": { native: "new year", bases: {  } }
  "as-0392":
    native: "date (day of the month)"
    notes:
      "n1": "আজি কিমান তাৰিখ? (aji kiman tarikh?), what's the date today?"
    examples:
      "আজিৰ তাৰিখ কি?": { native: "What is today's date?", bases: {  } }
      "এইটো তাৰিখ।": { native: "This is a date.", bases: {  } }
  "as-0393":
    native: "January"
    notes:
      "n1": "Assamese writes the English months with its own letters: ৱ (wô) for w, চ (sô) and ছ (sô) for s, ভ (bhô) for v."
    examples:
      "জানুৱাৰী এটা মাহ।": { native: "January is a month.", bases: {  } }
      "এইটো জানুৱাৰী মাহ।": { native: "This is the month of January.", bases: {  } }
  "as-0394":
    native: "February"
    examples:
      "ফেব্ৰুৱাৰী এটা মাহ।": { native: "February is a month.", bases: {  } }
