schema: 1
id: "as-en-home"
kind: "layer"
core: "as-home"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Home and neighbourhood"
license: "CC0-1.0"
description: "The rooms of a home, what is in them, the courtyard and gate of an Assamese house, and the people next door. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0328":
    native: "room"
    notes:
      "n1": "কোঠাত (kuthāt), in the room. The o is said close to u: not কথা (kôthā), a word."
  "as-0329":
    native: "kitchen"
    notes:
      "n1": "Literally 'cooking house'. In a village home the kitchen is often a building of its own."
  "as-0330":
    native: "bedroom"
    notes:
      "n1": "From শোৱা (xuwā), to sleep."
  "as-0331":
    native: "sitting room"
    notes:
      "n1": "From বহা (bôhā), to sit."
    bases:
      "বহা": "to sit"
  "as-0332":
    native: "bathroom; toilet"
  "as-0333":
    native: "door"
  "as-0334":
    native: "window"
  "as-0335":
    native: "stairs"
  "as-0336":
    native: "floor; storey"
    notes:
      "n1": "দুমহলা ঘৰ (dumôhôlā ghôr), a two-storey house."
  "as-0337":
    native: "key"
    notes:
      "n1": "The lock is তলা (tôlā)."
  "as-0338":
    native: "bed; bedding"
  "as-0339":
    native: "chair"
  "as-0340":
    native: "table"
  "as-0341":
    native: "fan"
  "as-0342":
    native: "light"
    notes:
      "n1": "লাইটটো জ্বলাই দিয়ক (lāittu zôlāi diyôk), please switch on the light."
  "as-0343":
    native: "neighbour"
    notes:
      "n1": "From চুবুৰি (suburi), a neighbourhood of a town or a village."
  "as-0302":
    native: "rent"
    notes:
      "n1": "In this deck: rent. ভাড়াঘৰ (bhārāghôr), a rented house."
  "as-0344":
    native: "flat; apartment"
  "as-0345":
    native: "courtyard; the yard in front of a house"
    notes:
      "n1": "Swept clean every morning in a village home; Bihu is danced in it."
  "as-0346":
    native: "the gateway; the path from the road to a house"
    notes:
      "n1": "Guests are welcomed and seen off at the পদূলি (poduli)."
  "as-0347":
    native: "betel nut and betel leaf (offered to guests)"
    notes:
      "n1": "Offered to a guest on a brass tray, the bota, and at every ceremony: a sign of welcome and respect."
    bases:
      "তামোল": "betel nut"
      "পাণ": "betel leaf"
  "as-0348":
    native: "There's a park in front of the house."
    notes:
      "n1": "এখন (ekhôn), one, with খন (khôn), the counting word for flat things and places."
    bases:
      "সন্মুখত": "front"
      "পাৰ্ক": "park"
      "আছে": "to be; to have"
  "as-0349":
    native: "Our street is very quiet."
    notes:
      "n1": "আলিটো (ālitu), 'the street': the counting word টো (tu) after a noun makes it definite."
    bases:
      "আমাৰ": "we"
      "শান্ত": "quiet"
