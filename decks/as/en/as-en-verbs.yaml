schema: 1
id: "as-en-verbs"
kind: "layer"
core: "as-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Everyday verbs"
license: "CC-BY-SA-4.0"
description: "Verbs of the day: eating, going, cooking, reading, washing, sleeping. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-2200":
    native: "go"
    notes:
      "n1": "The verb for go is যোৱা (zuwā); for a place, the word -লৈ (-lôi) is added, as in স্কুললৈ যায় (skulôlôi zāy)."
    examples:
      "মই বজাৰলৈ যাওঁ।": { native: "I go to the market.", bases: { "বজাৰলৈ": "to the market", "যাওঁ": "go", "মই": "I" } }
      "সি স্কুললৈ যায়।": { native: "He goes to school.", bases: { "স্কুললৈ": "to school", "যায়": "goes", "সি": "he; she" } }
  "as-2201":
    native: "come"
    notes:
      "n1": "The verb for come is আহা (āhā), the opposite of যোৱা (zuwā), to go."
    examples:
      "সি এতিয়া আহে।": { native: "He comes now.", bases: { "আহে": "comes", "সি": "he; she" } }
      "তুমি কালি আহিবা নে?": { native: "Will you come tomorrow?", bases: { "আহিবা": "will come", "নে": "question particle", "তুমি": "you" } }
  "as-2202":
    native: "do"
    notes:
      "n1": "The verb is কৰা (kôrā); it joins many nouns, as in কাম কৰা (kām kôrā), to work."
    examples:
      "তুমি কি কৰা?": { native: "What do you do?", bases: { "কৰা": "do", "তুমি": "you" } }
      "মই কাম কৰোঁ।": { native: "I work.", bases: { "কাম": "work", "কৰোঁ": "do", "মই": "I" } }
  "as-2203":
    native: "read; study"
    notes:
      "n1": "The verb is পঢ়া (pôrhā); it means to read a book and to study."
    examples:
      "মই কিতাপ পঢ়োঁ।": { native: "I read a book.", bases: { "কিতাপ": "book", "পঢ়োঁ": "read", "মই": "I" } }
      "তেওঁ বিদ্যালয়ত পঢ়ে।": { native: "He studies at school.", bases: { "বিদ্যালয়ত": "at school", "পঢ়ে": "studies", "তেওঁ": "he; she (polite)" } }
  "as-2204":
    native: "write"
    notes:
      "n1": "The verb is লিখা (likhā); the pen is the tool for writing."
    examples:
      "মই চিঠি লিখোঁ।": { native: "I write a letter.", bases: { "চিঠি": "letter", "লিখোঁ": "write", "মই": "I" } }
      "সি কলমেৰে লিখে।": { native: "He writes with a pen.", bases: { "কলমেৰে": "with a pen", "লিখে": "writes", "সি": "he; she" } }
  "as-2205":
    native: "hear; listen"
    notes:
      "n1": "The verb is শুনা (xunā); the same verb means to listen and to hear."
    examples:
      "মই গান শুনোঁ।": { native: "I listen to a song.", bases: { "গান": "song", "শুনোঁ": "listen", "মই": "I" } }
      "তুমি শুনা নে?": { native: "Do you hear?", bases: { "শুনা": "hear", "নে": "question particle", "তুমি": "you" } }
  "as-2206":
    native: "see; look at"
    notes:
      "n1": "The verb is দেখা (dekhā), to see."
    examples:
      "মই তেওঁক দেখোঁ।": { native: "I see him.", bases: { "তেওঁক": "him", "দেখোঁ": "see", "মই": "I" } }
      "সি মোক দেখে।": { native: "He sees me.", bases: { "দেখে": "sees", "সি": "he; she", "মোক": "me" } }
  "as-2207":
    native: "stay; remain"
    notes:
      "n1": "The verb is থকা (thôkā); it also means to be in a place for a time."
    examples:
      "মই ইয়াত থাকোঁ।": { native: "I stay here.", bases: { "থাকোঁ": "stay", "মই": "I" } }
      "সি ঘৰত থাকে।": { native: "He stays at home.", bases: { "ঘৰত": "at home", "থাকে": "stays", "সি": "he; she" } }
  "as-2208":
    native: "sit"
    notes:
      "n1": "The verb is বহা (bôhā); the opposite is উঠা (uthā), to get up."
    examples:
      "মই চকীত বহোঁ।": { native: "I sit on the chair.", bases: { "চকীত": "on the chair", "বহোঁ": "sit", "মই": "I" } }
      "তেওঁ বহে।": { native: "He sits.", bases: { "বহে": "sits", "তেওঁ": "he; she (polite)" } }
  "as-2209":
    native: "cook"
    notes:
      "n1": "The verb is ৰান্ধা (rāndhā); it is used for food being cooked."
    examples:
      "মই ভাত ৰান্ধোঁ।": { native: "I cook rice.", bases: { "ভাত": "rice; a meal", "ৰান্ধোঁ": "cook", "মই": "I" } }
      "মা ৰান্ধে।": { native: "Mother cooks.", bases: { "মা": "mother", "ৰান্ধে": "cooks" } }
  "as-2210":
    native: "buy"
    notes:
      "n1": "The verb is কিনা (kinā); it is the opposite of বেচা (besā), to sell."
    examples:
      "মই এটা কিতাপ কিনোঁ।": { native: "I buy a book.", bases: { "এটা": "a; one", "কিতাপ": "book", "কিনোঁ": "buy", "মই": "I" } }
      "সি বজাৰত কিনে।": { native: "He buys at the market.", bases: { "বজাৰত": "at the market", "কিনে": "buys", "সি": "he; she" } }
  "as-2211":
    native: "understand"
    notes:
      "n1": "The verb is বুজা (buzā); it is used for understanding a language or a remark."
    examples:
      "মই বুজোঁ।": { native: "I understand.", bases: { "বুজোঁ": "understand", "মই": "I" } }
      "তুমি বুজা নে?": { native: "Do you understand?", bases: { "বুজা": "understand", "নে": "question particle", "তুমি": "you" } }
  "as-2212":
    native: "know"
    notes:
      "n1": "The verb is জনা (zônā); it is used for knowing facts and languages."
    examples:
      "মই জানোঁ।": { native: "I know.", bases: { "জানোঁ": "know", "মই": "I" } }
      "সি জানে।": { native: "He knows.", bases: { "জানে": "knows", "সি": "he; she" } }
  "as-2213":
    native: "play"
    notes:
      "n1": "The verb is খেলা (khelā); the game comes before it, as in ক্ৰিকেট খেলা (kriket khelā)."
    examples:
      "শিশুসকলে খেলে।": { native: "The children play.", bases: { "শিশুসকলে": "the children", "খেলে": "play" } }
      "মই ক্ৰিকেট খেলোঁ।": { native: "I play cricket.", bases: { "ক্ৰিকেট": "cricket", "খেলোঁ": "play", "মই": "I" } }
  "as-2214":
    native: "sing"
    notes:
      "n1": "The verb is গোৱা (guwā); the song is গীত (git)."
    examples:
      "তেওঁ গীত গায়।": { native: "He sings a song.", bases: { "গীত": "song", "গায়": "sings", "তেওঁ": "he; she (polite)" } }
      "মই গাওঁ।": { native: "I sing.", bases: { "গাওঁ": "sing", "মই": "I" } }
  "as-2215":
    native: "dance"
    notes:
      "n1": "The verb is নাচা (nāsā); it is used for a dance."
    examples:
      "মই নাচোঁ।": { native: "I dance.", bases: { "নাচোঁ": "dance", "মই": "I" } }
      "সি নাচে।": { native: "He dances.", bases: { "নাচে": "dances", "সি": "he; she" } }
  "as-2216":
    native: "laugh"
    notes:
      "n1": "The verb is হাঁহা (hām̐hā); কান্দা (kāndā) is its opposite, to cry."
    examples:
      "শিশুটো হাঁহে।": { native: "The child laughs.", bases: { "শিশুটো": "the child", "হাঁহে": "laughs" } }
      "মই হাঁহোঁ।": { native: "I laugh.", bases: { "হাঁহোঁ": "laugh", "মই": "I" } }
  "as-2217":
    native: "cry"
    notes:
      "n1": "The verb is কান্দা (kāndā); it is used for a child who cries."
    examples:
      "শিশুটো কান্দে।": { native: "The child cries.", bases: { "শিশুটো": "the child", "কান্দে": "cries" } }
      "সি কান্দে।": { native: "He cries.", bases: { "কান্দে": "cries", "সি": "he; she" } }
  "as-2218":
    native: "give"
    notes:
      "n1": "The verb is দিয়া (diyā); the polite request is দিয়ক (diyôk), give, please."
    examples:
      "মোক এটা কলম দিয়ক।": { native: "Give me a pen.", bases: { "এটা": "a; one", "কলম": "pen", "দিয়ক": "give, please", "মোক": "me" } }
      "মই তোমাক কিতাপ দিওঁ।": { native: "I give you a book.", bases: { "তোমাক": "you", "কিতাপ": "book", "দিওঁ": "give", "মই": "I" } }
  "as-2219":
    native: "take"
    notes:
      "n1": "The verb is লোৱা (luwā); it is the opposite of দিয়া (diyā), to give."
    examples:
      "মই এটা কিতাপ লওঁ।": { native: "I take a book.", bases: { "এটা": "a; one", "কিতাপ": "book", "লওঁ": "take", "মই": "I" } }
      "সি ভাত লয়।": { native: "He takes rice.", bases: { "ভাত": "rice; a meal", "লয়": "takes", "সি": "he; she" } }
  "as-2220":
    native: "think"
    notes:
      "n1": "The verb is ভাবা (bhābā); it is used for thinking and for supposing."
    examples:
      "মই ভাবোঁ।": { native: "I think.", bases: { "ভাবোঁ": "think", "মই": "I" } }
      "সি ভাবে।": { native: "He thinks.", bases: { "ভাবে": "thinks", "সি": "he; she" } }
  "as-2221":
    native: "wash"
    notes:
      "n1": "The verb is ধোৱা (dhuwā); it is used for washing things and the body."
    examples:
      "মই মুখ ধোওঁ।": { native: "I wash my face.", bases: { "মুখ": "face", "ধোওঁ": "wash", "মই": "I" } }
      "তেওঁ কাপোৰ ধোৱে।": { native: "He washes clothes.", bases: { "কাপোৰ": "clothes", "ধোৱে": "washes", "তেওঁ": "he; she (polite)" } }
  "as-2222":
    native: "walk; move"
    notes:
      "n1": "The verb is চলা (sôlā); it is used for walking and for a thing moving."
    examples:
      "মই চলোঁ।": { native: "I walk.", bases: { "চলোঁ": "walk", "মই": "I" } }
      "সি ধীৰে চলে।": { native: "He walks slowly.", bases: { "ধীৰে": "slowly", "চলে": "walks", "সি": "he; she" } }
  "as-2223":
    native: "fall"
    notes:
      "n1": "The verb is পৰা (pôrā); it is used for a leaf or fruit that falls."
    examples:
      "পাত পৰে।": { native: "A leaf falls.", bases: { "পাত": "leaf", "পৰে": "falls" } }
      "ফল পৰে।": { native: "The fruit falls.", bases: { "ফল": "fruit", "পৰে": "falls" } }
  "as-2224":
    native: "look"
    notes:
      "n1": "The verb is চোৱা (suwā); for a plain look, use দেখা (dekhā)."
    examples:
      "মই চাওঁ।": { native: "I look.", bases: { "চাওঁ": "look", "মই": "I" } }
      "তুমি চোৱা।": { native: "You look.", bases: { "চোৱা": "look", "তুমি": "you" } }
  "as-2225":
    native: "stop"
    notes:
      "n1": "The verb is ৰখা (rôkhā); it is used for a bus or a person stopping."
    examples:
      "বাছ ৰখে।": { native: "The bus stops.", bases: { "বাছ": "bus", "ৰখে": "stops" } }
      "মই ইয়াত ৰখোঁ।": { native: "I stop here.", bases: { "ৰখোঁ": "stop", "মই": "I" } }
