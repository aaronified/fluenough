schema: 1
id: "as-en-registers"
kind: "layer"
core: "as-registers"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Formal Assamese and everyday Assamese"
license: "CC-BY-SA-4.0"
description: "Assamese is written much as it is spoken, but signs, forms, offices and the news use formal words from Sanskrit that nobody says at home. Here they are, with the everyday word beside each. Recognition only. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0130":
    notes:
      "n1": "Formal. Between friends, often 'thanks' in English, or nothing at all."
  "as-0065":
    native: "water (formal); everyday পানী (pāni)"
    notes:
      "n1": "On notices and in songs and poems. In speech it survives in জলপান (zôlpān), a snack."
  "as-0407":
    native: "food (formal); everyday ভাত (bhāt) or খোৱা বস্তু (khuwā bostu)"
    notes:
      "n1": "On menus and in the news. At home a meal is ভাত (bhāt)."
    examples:
      "আহাৰ ইয়াত।": { native: "The food is here.", bases: {  } }
      "আহাৰ আগতে ফোন কৰিবা।": { native: "Call before coming.", bases: {  } }
  "as-0431":
    native: "entry; way in (on signs)"
    notes:
      "n1": "On doors and gates: প্ৰৱেশ (prôwex), entry; প্ৰস্থান (prôsthān), exit."
    examples:
      "প্ৰৱেশ ইয়াত।": { native: "The entrance is here.", bases: {  } }
      "এইটো প্ৰৱেশ।": { native: "This is the entrance.", bases: {  } }
  "as-0432":
    native: "exit; way out (on signs)"
    examples:
      "প্ৰস্থান ইয়াত।": { native: "The exit is here.", bases: {  } }
      "এইটো প্ৰস্থান।": { native: "This is the exit.", bases: {  } }
  "as-0433":
    native: "no smoking (on signs)"
    notes:
      "n1": "নিষেধ (nixedh), forbidden: the word to look for on any notice."
    bases:
      "ধূমপান": "smoking"
      "নিষেধ": "prohibition"
  "as-0434":
    native: "toilet (on signs)"
    notes:
      "n1": "Speakers say বাথৰুম (bāthrum) or টয়লেট (tôylet)."
    examples:
      "শৌচালয় ইয়াত।": { native: "The toilet is here.", bases: {  } }
      "শৌচালয় কত?": { native: "Where is the toilet?", bases: {  } }
  "as-0435":
    native: "please (formal, written)"
    notes:
      "n1": "On signs, forms and announcements. In speech the polite verb in -ক (-kô) is enough: বহক (bôhôk), please sit."
    bases:
      "অনুগ্ৰহ": "favour; kindness"
      "কৰি": "to do; to make"
  "as-0436":
    native: "welcome (on signs and banners)"
    notes:
      "n1": "At the door of a home, a host says আহক (āhôk), come in."
    examples:
      "স্বাগতম, মেডাম।": { native: "Welcome, madam.", bases: {  } }
      "স্বাগতম, ছাৰ।": { native: "Welcome, sir.", bases: {  } }
  "as-0437":
    native: "school (formal); everyday স্কুল (skul)"
    notes:
      "n1": "In school names: a college is মহাবিদ্যালয় (môhābidyālôy), and a university বিশ্ববিদ্যালয় (bixxobidyālôy)."
    examples:
      "বিদ্যালয় ইয়াত।": { native: "The school is here.", bases: {  } }
      "তেওঁ বিদ্যালয়ত পঢ়ে।": { native: "He studies at school.", bases: { "বিদ্যালয়ত": "at school", "পঢ়ে": "studies", "তেওঁ": "he; she (polite)" } }
  "as-0438":
    native: "police (formal); everyday পুলিচ (pulis)"
    notes:
      "n1": "On police stations and in the news."
    examples:
      "আৰক্ষী ইয়াত।": { native: "The police are here.", bases: {  } }
      "এইটো আৰক্ষী।": { native: "This is the police.", bases: {  } }
  "as-0439":
    native: "father (formal); everyday দেউতা (deutā)"
    notes:
      "n1": "On forms: পিতৃৰ নাম (pitrir nām), father's name."
    examples:
      "মোৰ পিতৃ ইয়াত আছে।": { native: "My father is here.", bases: { "আছে": "to be; to have" } }
      "এইটো মোৰ পিতৃ।": { native: "This is my father.", bases: {  } }
  "as-0440":
    native: "mother (formal); everyday মা (mā) or আই (āi)"
    notes:
      "n1": "In মাতৃভাষা (mātribhāxā), mother tongue."
    examples:
      "মোৰ মাতৃ ইয়াত আছে।": { native: "My mother is here.", bases: { "আছে": "to be; to have" } }
      "এইটো মোৰ মাতৃ।": { native: "This is my mother.", bases: {  } }
  "as-0441":
    native: "news (formal); everyday খবৰ (khôbôr)"
    notes:
      "n1": "Read on the radio and television. Friends ask কি খবৰ? (ki khobor?), what's the news?"
    examples:
      "কাকতত সমাচাৰ।": { native: "News in the newspaper.", bases: { "কাকতত": "newspaper" } }
      "কাকতত সমাচাৰ আছে।": { native: "There is news in the newspaper.", bases: { "আছে": "to be; there is; to have" } }
  "as-0442":
    native: "passenger; traveller (formal)"
    notes:
      "n1": "On buses, trains and ferries: যাত্ৰীসকল (zātrixôkôl), passengers, with -সকল (-xôkôl), the respectful plural."
    examples:
      "এইটো যাত্ৰী।": { native: "This is a passenger.", bases: {  } }
      "মই যাত্ৰী।": { native: "I am a passenger.", bases: {  } }
  "as-0443":
    native: "need (formal); in speech, লাগে (lāge)"
    notes:
      "n1": "Written: আপোনাৰ কি প্ৰয়োজন (āpunār ki prôyuzôn)? Said: আপোনাক কি লাগে? (apunak ki lage?), what do you need?"
    examples:
      "মোৰ প্ৰয়োজন আছে।": { native: "I need it.", bases: { "আছে": "to be; to have" } }
      "এইটো প্ৰয়োজন।": { native: "This is necessary.", bases: {  } }
