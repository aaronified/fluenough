schema: 1
id: "as-en-opinions"
kind: "layer"
core: "as-opinions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Opinions: agree, disagree, praise and criticize"
license: "CC-BY-SA-4.0"
description: "How to say what you think: agreeing and disagreeing politely, praising, criticizing, and giving a reason. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3273":
    native: "opinions; views"
    notes:
      "n1": "What people think about a matter. The single view is মত (môt)."
    examples:
      "মতামত দিয়ক।": "Please give your views."
      "মতামত বহুত।": "There are many views."
  "as-3274":
    native: "in agreement"
    notes:
      "n1": "Of the same view. The opposite is অসহমত (ôxôhômôt)."
    examples:
      "মই সহমত।": "I agree."
      "তেওঁ সহমত।": "He agrees."
  "as-3275":
    native: "not in agreement"
    notes:
      "n1": "Of a different view. The opposite of সহমত (xôhômôt)."
    examples:
      "মই অসহমত।": "I disagree."
      "তাই অসহমত।": "She disagrees."
  "as-3276":
    native: "praise"
    notes:
      "n1": "Good words said about someone or something."
    examples:
      "প্ৰশংসা কৰা।": "To praise."
      "প্ৰশংসা পালোঁ।": { native: "I received praise.", bases: { "পালোঁ": "to get; to receive" } }
  "as-3277":
    native: "criticism"
    notes:
      "n1": "Pointing out what is wrong or weak."
    examples:
      "সমালোচনা ভাল।": "The criticism is good."
      "সমালোচনা বহুত।": "There is a lot of criticism."
  "as-3278":
    native: "support"
    notes:
      "n1": "Saying that you back someone or an idea."
    examples:
      "সমৰ্থন কৰা।": "To support."
      "সমৰ্থন বহুত।": "There is a lot of support."
  "as-3279":
    native: "opposition; objection"
    notes:
      "n1": "Saying that you are against something."
    examples:
      "বিৰোধিতা আছে।": { native: "There is opposition.", bases: { "আছে": "to be; there is; to have" } }
      "বিৰোধিতা নকৰিবা।": "Do not oppose."
  "as-3280":
    native: "reason; argument"
    notes:
      "n1": "A reason given to support what you think."
    examples:
      "যুক্তি ভাল।": "The reason is good."
      "যুক্তি দিয়ক।": "Please give a reason."
  "as-3281":
    native: "consideration; thought"
    notes:
      "n1": "Thinking carefully before deciding."
    examples:
      "বিবেচনা কৰা।": "To think it over."
      "বিবেচনা ভাল।": "The consideration is good."
  "as-3282":
    native: "suggestion; proposal"
    notes:
      "n1": "An idea offered for others to think about."
    examples:
      "প্ৰস্তাৱ ভাল।": "The suggestion is good."
      "প্ৰস্তাৱ দিয়ক।": "Please make a suggestion."
  "as-3283":
    native: "advice"
    notes:
      "n1": "What you tell someone to do for their good."
    examples:
      "পৰামৰ্শ দিয়ক।": "Please give advice."
      "পৰামৰ্শ ভাল।": "The advice is good."
  "as-3284":
    native: "right; proper; fitting"
    notes:
      "n1": "Right to do. The opposite is অনুচিত (ônuciti)."
    examples:
      "এইটো উচিত।": "This is right."
      "উচিত কথা।": { native: "The right thing to say.", bases: { "কথা": "talk; speech; matter" } }
  "as-3285":
    native: "not right; improper"
    notes:
      "n1": "Not the right thing to do."
    examples:
      "এইটো অনুচিত।": "This is not right."
      "অনুচিত কাম।": "An improper act."
  "as-3286":
    native: "true; real"
    notes:
      "n1": "What is really so. The opposite is মিছা (misā)."
    examples:
      "কথাটো সত্য।": { native: "What you said is true.", bases: { "কথাটো": "talk; speech; matter" } }
      "সত্য কথা।": { native: "The truth.", bases: { "কথা": "talk; speech; matter" } }
  "as-3287":
    native: "false; untrue"
    notes:
      "n1": "Not true. The opposite is সত্য (xôtyô)."
    examples:
      "কথাটো মিছা।": { native: "What you said is false.", bases: { "কথাটো": "talk; speech; matter" } }
      "মিছা কথা।": { native: "A lie.", bases: { "কথা": "talk; speech; matter" } }
  "as-3288":
    native: "idea; notion"
    notes:
      "n1": "What a person thinks or believes about something."
    examples:
      "ধাৰণা ভাল।": "The idea is good."
      "মোৰ ধাৰণা আছে।": { native: "I have an idea.", bases: { "আছে": "to be; there is; to have" } }
  "as-3289":
    native: "judgement; decision of the mind"
    notes:
      "n1": "Thinking and then deciding what is right."
    examples:
      "বিচাৰ ভাল।": "The judgement is good."
      "বিচাৰ কৰা।": "To judge."
  "as-3290":
    native: "to give one's view"
    notes:
      "n1": "To say what you think about something."
    examples:
  "as-3291":
    native: "it is not right"
    notes:
      "n1": "A polite way to say you disagree."
    examples:
