schema: 1
id: "as-en-questions"
kind: "layer"
core: "as-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Yes, no and questions"
license: "CC-BY-SA-4.0"
description: "Yes and no, the question words, and how a sentence becomes a question with নেকি (neki). Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0141":
    native: "no; it is not"
    notes:
      "n1": "নহয় (nôhôy) denies what something is: এইটো চাহ নহয় (eitu sāh nôhôy), this isn't tea. নাই (nāi) denies that something is there."
    examples:
      "কেতিয়াও নহয়।": { native: "Never.", bases: {  } }
      "ঠিক নহয়": { native: "it is not right", bases: {  } }
  "as-0143":
    native: "what"
    notes:
      "n1": "আপোনাৰ নাম কি? (apunar nam ki?), what is your name? The question word stays where the answer would go."
    examples:
      "অৰ্থ কি?": { native: "What is the meaning?", bases: {  } }
      "এইটো কি?": { native: "What is this?", bases: { "এইটো": "this" } }
  "as-0144":
    native: "who"
    notes:
      "n1": "The o here is said close to u, and chat writes kun."
  "as-0145":
    native: "where"
    notes:
      "n1": "The apostrophe after ক (kô) marks a closed o. Where to? is ক (kô)'লৈ (koloi)."
    examples:
      "… ক'ত?": { native: "Where is …?", bases: {  } }
      "আমবোৰ ক'ত?": { native: "Where are the mangoes?", bases: { "আমবোৰ": "mango" } }
  "as-0146":
    native: "when"
    examples:
      "আপুনি কেতিয়া আহিব?": { native: "When will you come?", bases: { "আহিব": "to come" } }
  "as-0147":
    native: "why"
    examples:
      "তুমি কিয় দেৰি কৰিলা?": { native: "Why are you late?", bases: {  } }
      "আপুনি অসমীয়া কিয় শিকি আছে?": { native: "Why are you learning Assamese?", bases: { "শিকি": "to learn", "আছে": "to be; to have" } }
  "as-0148":
    native: "how (in what way)"
    notes:
      "n1": "How someone is, is কেনে (kene): কেনে আছে (kene āse)? How are you?"
    examples:
      "আপোনালোক কেনেকৈ আছে?": { native: "How are you all?", bases: { "আছে": "are", "আপোনালোক": "you (polite, plural)" } }
  "as-0149":
    native: "how much; how many"
    notes:
      "n1": "কিমান হ (kimān hô)'ল? (kiman hol?), how much does that come to?"
    examples:
      "অগ্ৰিম কিমান?": { native: "How much is the advance?", bases: {  } }
      "উচ্চতা কিমান?": { native: "How tall is it?", bases: {  } }
  "as-0150":
    native: "which one"
    notes:
      "n1": "কোন (kun) with the classifier টো (tu), 'the one'. For a flat thing or a vehicle, কোনখন (kunkhôn): কোনখন বাছ (kunôkhôn bās)? Which bus?"
    examples:
      "কোনটো দিশ?": { native: "Which direction?", bases: {  } }
      "তুমি কোনটো বাছা?": { native: "Which one do you choose?", bases: {  } }
  "as-0151":
    native: "(at the end, turns a sentence into a yes-or-no question)"
    notes:
      "n1": "আপুনি অসমীয়া জানে (āpuni ôxomiyā zāne), you know Assamese; আপুনি অসমীয়া জানে নেকি (āpuni ôxomiyā zāne neki)? Do you know Assamese? A shorter নে (ne) is joined to the verb: ভাত খালেনে (bhāt khālene)? Have you eaten?"
    examples:
      "সঁচা নেকি?": { native: "Really?", bases: { "সঁচা": "true; really" } }
      "ইণ্টাৰনেট আছে নেকি?": { native: "Is there internet?", bases: { "আছে": "to be; there is; to have" } }
  "as-0152":
    native: "Really?"
    notes:
      "n1": "সঁচা (xôm̐sā), true; with নেকি (neki), 'is it true?'"
    bases:
      "সঁচা": "true; really"
