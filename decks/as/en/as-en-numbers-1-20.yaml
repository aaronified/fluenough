schema: 1
id: "as-en-numbers-1-20"
kind: "layer"
core: "as-numbers-1-20"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Numbers 1–20"
license: "CC-BY-SA-4.0"
description: "One to twenty. Every number up to a hundred has its own word in Assamese, as in Bengali, so these are the ones to learn first. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0222":
    native: "1, one"
    notes:
      "n1": "Assamese uses the same digits as Bengali, ১ ২ ৩ (1 2 3). Prices, signs and bus numbers use them or 1 2 3, so learn to read both. Before a counting word, one is এ- (e-): এটা (etā), one thing; এজন (ezôn), one person."
    examples:
      "অধ্যায় এক।": { native: "Chapter one.", bases: {  } }
      "এক ঘন্টা।": { native: "One hour.", bases: {  } }
  "as-0223":
    native: "2, two"
    notes:
      "n1": "Shortened to দু (du) before a counting word: দুটা (dutā), two things; দুজন (duzôn), two people."
    examples:
      "দুজন মানুহ": { native: "two people", bases: { "মানুহ": "person; man", "দুজন": "2, two" } }
      "মোৰ দুজন ভাইটি আছে।": { native: "I have two younger brothers.", bases: { "মোৰ": "I", "আছে": "to be; to have", "দুজন": "2, two" } }
  "as-0224":
    native: "3, three"
    examples:
      "মোৰ বয়স তিনি বছৰ।": { native: "I am three years old.", bases: {  } }
      "তিনিখন কিতাপ": { native: "three books", bases: { "কিতাপ": "book", "তিনিখন": "3, three" } }
  "as-0225":
    native: "6, six"
    examples:
      "মোৰ বয়স ছয় বছৰ।": { native: "I am six years old.", bases: {  } }
      "মোৰ ছয় টকা আছে।": { native: "I have six rupees.", bases: { "আছে": "to be; to have" } }
  "as-0226":
    native: "8, eight"
    examples:
      "মোৰ বয়স আঠ বছৰ।": { native: "I am eight years old.", bases: {  } }
      "মোৰ আঠ টকা আছে।": { native: "I have eight rupees.", bases: { "আছে": "to be; to have" } }
  "as-0227":
    native: "9, nine"
    notes:
      "n1": "Just one letter, carrying its open o."
    examples:
      "মোৰ বয়স ন বছৰ।": { native: "I am nine years old.", bases: {  } }
      "মোৰ ন টকা আছে।": { native: "I have nine rupees.", bases: { "আছে": "to be; to have" } }
  "as-0228":
    native: "10, ten"
    examples:
      "দহ কিলোমিটাৰ দূৰ।": { native: "Ten kilometres away.", bases: {  } }
      "প্ৰায় দহ বাজিল।": { native: "It is almost ten o'clock.", bases: { "বাজিল": "struck" } }
  "as-0229":
    native: "11, eleven"
    examples:
      "মোৰ বয়স এঘাৰ বছৰ।": { native: "I am eleven years old.", bases: {  } }
      "মই ৰাতি এঘাৰ বজাত শুবলৈ যাওঁ।": { native: "I go to bed at eleven at night.", bases: { "মই": "I", "যাওঁ": "to go" } }
  "as-0230":
    native: "12, twelve"
    notes:
      "n1": "Also a day of the week, and a time: এবাৰ (ebār), once."
    examples:
      "মোৰ বয়স বাৰ বছৰ।": { native: "I am twelve years old.", bases: {  } }
      "মোৰ বাৰ টকা আছে।": { native: "I have twelve rupees.", bases: { "আছে": "to be; to have" } }
  "as-0231":
    native: "13, thirteen"
    examples:
      "মোৰ বয়স তেৰ বছৰ।": { native: "I am thirteen years old.", bases: {  } }
      "মোৰ তেৰ টকা আছে।": { native: "I have thirteen rupees.", bases: { "আছে": "to be; to have" } }
  "as-0232":
    native: "14, fourteen"
    examples:
      "মোৰ বয়স চৈধ্য বছৰ।": { native: "I am fourteen years old.", bases: {  } }
      "মোৰ চৈধ্য টকা আছে।": { native: "I have fourteen rupees.", bases: { "আছে": "to be; to have" } }
  "as-0233":
    native: "15, fifteen"
    examples:
      "মোৰ বয়স পোন্ধৰ বছৰ।": { native: "I am fifteen years old.", bases: {  } }
      "মোৰ পোন্ধৰ টকা আছে।": { native: "I have fifteen rupees.", bases: { "আছে": "to be; to have" } }
  "as-0234":
    native: "16, sixteen"
    examples:
      "মোৰ বয়স ষোল্ল বছৰ।": { native: "I am sixteen years old.", bases: {  } }
      "মোৰ ষোল্ল টকা আছে।": { native: "I have sixteen rupees.", bases: { "আছে": "to be; to have" } }
  "as-0235":
    native: "17, seventeen"
    examples:
      "মোৰ বয়স সোতৰ বছৰ।": { native: "I am seventeen years old.", bases: {  } }
      "মোৰ সোতৰ টকা আছে।": { native: "I have seventeen rupees.", bases: { "আছে": "to be; to have" } }
  "as-0236":
    native: "18, eighteen"
    examples:
      "মোৰ বয়স ওঠৰ বছৰ।": { native: "I am eighteen years old.", bases: {  } }
      "মোৰ ওঠৰ টকা আছে।": { native: "I have eighteen rupees.", bases: { "আছে": "to be; to have" } }
  "as-0237":
    native: "19, nineteen"
    notes:
      "n1": "ঊন- (un-) means 'one short of': ঊনৈশ (unôix) is one short of twenty."
    examples:
      "মোৰ বয়স ঊনৈশ বছৰ।": { native: "I am nineteen years old.", bases: {  } }
      "মোৰ ঊনৈশ টকা আছে।": { native: "I have nineteen rupees.", bases: { "আছে": "to be; to have" } }
  "as-0238":
    native: "20, twenty"
    notes:
      "n1": "শ (xô) at the end is the rasp x."
    examples:
      "মোৰ বয়স বিশ বছৰ।": { native: "I am twenty years old.", bases: {  } }
      "মোৰ বিশ টকা আছে।": { native: "I have twenty rupees.", bases: { "আছে": "to be; to have" } }
