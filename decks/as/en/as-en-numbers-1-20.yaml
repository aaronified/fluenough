schema: 1
id: "as-en-numbers-1-20"
kind: "layer"
core: "as-numbers-1-20"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Numbers 1–20"
license: "CC0-1.0"
description: "One to twenty. Every number up to a hundred has its own word in Assamese, as in Bengali, so these are the ones to learn first. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0222":
    native: "1, one"
    notes:
      "n1": "Assamese uses the same digits as Bengali, ১ ২ ৩ (1 2 3). Prices, signs and bus numbers use them or 1 2 3, so learn to read both. Before a counting word, one is এ- (e-): এটা (etā), one thing; এজন (ezôn), one person."
  "as-0223":
    native: "2, two"
    notes:
      "n1": "Shortened to দু (du) before a counting word: দুটা (dutā), two things; দুজন (duzôn), two people."
  "as-0224":
    native: "3, three"
  "as-0225":
    native: "6, six"
  "as-0226":
    native: "8, eight"
  "as-0227":
    native: "9, nine"
    notes:
      "n1": "Just one letter, carrying its open o."
  "as-0228":
    native: "10, ten"
  "as-0229":
    native: "11, eleven"
  "as-0230":
    native: "12, twelve"
    notes:
      "n1": "Also a day of the week, and a time: এবাৰ (ebār), once."
  "as-0231":
    native: "13, thirteen"
  "as-0232":
    native: "14, fourteen"
  "as-0233":
    native: "15, fifteen"
  "as-0234":
    native: "16, sixteen"
  "as-0235":
    native: "17, seventeen"
  "as-0236":
    native: "18, eighteen"
  "as-0237":
    native: "19, nineteen"
    notes:
      "n1": "ঊন- (un-) means 'one short of': ঊনৈশ (unôix) is one short of twenty."
  "as-0238":
    native: "20, twenty"
    notes:
      "n1": "শ (xô) at the end is the rasp x."
