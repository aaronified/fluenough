schema: 1
id: "as-en-health"
kind: "layer"
core: "as-health"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Health and fitness"
license: "CC-BY-SA-4.0"
description: "Keeping well: the exercise, the walk, the sleep and the food that keeps the body strong. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3161":
    native: "health"
    notes:
      "n1": "The state of being well in body and mind."
    examples:
      "স্বাস্থ্য ভাল।": "Health is good."
      "স্বাস্থ্য বহুত দৰকাৰ।": "Health is very much needed."
  "as-3162":
    native: "exercise"
    notes:
      "n1": "Physical work done to keep the body fit, such as a walk or a run."
    examples:
      "ব্যায়াম কৰা।": "To exercise."
      "ব্যায়াম ভাল।": "Exercise is good."
  "as-3163":
    native: "to walk"
    notes:
      "n1": "To go on foot, slowly. A fast walk is দৌৰা (dourā) to run."
    examples:
      "মই হাঁটোঁ।": { native: "I walk.", bases: { "হাঁটোঁ": "to walk" } }
      "তাই হাঁটে।": { native: "She walks.", bases: { "হাঁটে": "to walk" } }
  "as-3164":
    native: "yoga"
    notes:
      "n1": "A set of exercises for the body and the breath."
    examples:
      "যোগ শিকোঁ।": "I am learning yoga."
      "যোগ ভাল লাগে।": "I like yoga."
  "as-3165":
    native: "strength; energy"
    notes:
      "n1": "The power of the body to work and to lift."
    examples:
      "শক্তি বহুত।": "There is a lot of strength."
      "শক্তি নাই।": "There is no strength."
  "as-3166":
    native: "nutrition; nourishment"
    notes:
      "n1": "The good food the body needs to grow and stay healthy."
    examples:
      "পুষ্টি ভাল।": "The nutrition is good."
      "পুষ্টি বহুত।": "There is a lot of nutrition."
  "as-3167":
    native: "sleep"
    notes:
      "n1": "The rest at night. To sleep is শোৱা (xuwā)."
    examples:
      "নিদ্ৰা ভাল।": "Sleep is good."
      "নিদ্ৰা নাই।": "There is no sleep."
  "as-3168":
    native: "to sleep (deeply)"
    notes:
      "n1": "To sleep soundly, a deep sleep. Less formal than শোৱা (xuwā)."
    examples:
      "মই ঘুমাওঁ।": { native: "I sleep.", bases: { "ঘুমাওঁ": "to sleep" } }
      "তাই ৰাতি ঘুমায়।": { native: "She sleeps at night.", bases: { "ঘুমায়": "to sleep" } }
  "as-3169":
    native: "gym"
    notes:
      "n1": "A room with machines for exercise."
    examples:
      "ব্যায়ামাগাৰ বহুত ডাঙৰ।": "The gym is very big."
      "ব্যায়ামাগাৰত মানুহ।": { native: "There are people in the gym.", bases: { "ব্যায়ামাগাৰত": "gym" } }
  "as-3170":
    native: "vitamin"
    notes:
      "n1": "A part of food the body needs in small amounts. Written as said in English."
    examples:
      "ভিটামিন আছে।": { native: "There are vitamins.", bases: { "আছে": "to be; there is; to have" } }
      "ফলত ভিটামিন।": "There are vitamins in fruit."
  "as-3171":
    native: "healthy; good for health"
    notes:
      "n1": "Good for health: স্বাস্থ্যকৰ খাদ্য (xwāsthyôkôr khādy), healthy food."
    examples:
      "স্বাস্থ্যকৰ খাদ্য।": "Healthy food."
      "এইটো স্বাস্থ্যকৰ।": "This is healthy."
  "as-3172":
    native: "energy; enthusiasm"
    notes:
      "n1": "The eagerness and force to do work."
    examples:
      "উদ্যম বহুত।": "There is a lot of energy."
      "উদ্যম নাই।": "There is no energy."
  "as-3173":
    native: "good health; well-being"
    notes:
      "n1": "The state of being well."
    examples:
      "সুস্থতা ভাল।": "Good health is good."
      "সুস্থতা বহুত দৰকাৰ।": "Good health is very much needed."
  "as-3174":
    native: "careful; cautious"
    notes:
      "n1": "Taking care so as not to get hurt or ill."
    examples:
      "সতৰ্ক হোৱা।": { native: "Be careful.", bases: { "হোৱা": "to become; to be" } }
      "তেওঁ সতৰ্ক।": "He is careful."
  "as-3175":
    native: "to work hard"
    notes:
      "n1": "To work with effort, with the body or the mind."
    examples:
      "মই খাটোঁ।": { native: "I work hard.", bases: { "খাটোঁ": "to work hard" } }
      "তাই বহুত খাটে।": { native: "She works hard.", bases: { "খাটে": "to work hard" } }
  "as-3176":
    native: "to drink water"
    notes:
      "n1": "To drink water often keeps the body well."
    examples:
  "as-3177":
    native: "to exercise"
    notes:
      "n1": "To do exercise each day."
    examples:
  "as-3178":
    native: "to gain strength"
    notes:
      "n1": "To become strong again after an illness."
    bases:
      "পোৱা": "to get; to receive"
    examples:
