      "c1": { why: "Rain, a natural source of water." }
      "c2": { why: "A drought, the problem irrigation solves." }
  "as-3549":
    native: "The granary is full."
    confusables:
      "c1": { why: "Empty, the opposite." }
      "c2": { why: "Big, not full." }
  "as-3550":
    native: "Paddy is sold at the market yard."
    confusables:
      "c1": { why: "To buy, the other side of selling." }
      "c2": { why: "To send, not sell." }
