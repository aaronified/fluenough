schema: 1
id: "as-en-script-reading"
kind: "layer"
core: "as-script-reading"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words to read"
license: "CC-BY-SA-4.0"
description: "Short everyday words written with letters alone, no vowel signs: the headline, ৰ (rô), the dot below and the vowel you do not see, at work. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0052":
    native: "house; home"
    notes:
      "n1": "Two letters under one headline. ঘ (ghô) is gho and ৰ (rô) is ro, but the last o isn't said: ghor. ঘৰত (ghôrôt), at home."
    examples:
      "কাঠৰ ঘৰ।": { native: "A house of wood.", bases: { "কাঠৰ": "wood; timber" } }
      "ঘৰ আলোকিত।": { native: "The house is bright.", bases: {  } }
  "as-0053":
    native: "Assam"
    notes:
      "n1": "অ (ô), স (xô) and ম (mô), each with the open o, and the last one quiet. স (xô) is the rasp x: chat writes the name Axom. অসমীয়া (ôxomiyā) is Assamese, the language and the people."
    examples:
      "মানচিত্ৰত অসম।": { native: "Assam is on the map.", bases: { "মানচিত্ৰত": "map" } }
      "মানচিত্ৰত অসম পূবত।": { native: "On the map, Assam is in the east.", bases: {  } }
  "as-0054":
    native: "pen"
    notes:
      "n1": "Three letters and no vowel written: ko-lo-m."
    examples:
      "কলম তলত আছে।": { native: "The pen is below.", bases: { "কলম": "pen", "আছে": "is" } }
      "তিনিটা কলম ইয়াত।": { native: "Three pens are here.", bases: { "কলম": "pen" } }
  "as-0055":
    native: "very; big, great"
    notes:
      "n1": "ব (bô) and then ৰ (rô), which is ব (bô) with a slanting stroke. One of the commonest words in Assamese: বৰ ভাল (bôr bhāl), very good."
    examples:
      "ভাস্কৰ্য বৰ।": { native: "The sculpture is big.", bases: {  } }
      "আজি বৰ গৰম।": { native: "It's very hot today.", bases: {  } }
  "as-0056":
    native: "mind; heart"
    notes:
      "n1": "ম (mô) and ন (nô) under one headline; the last o is quiet. মোৰ মন ভাল নাই (mur môn bhāl nāi), 'my heart is not well': I'm feeling low."
    examples:
      "মনত পৰা": { native: "to remember; to come to mind", bases: { "পৰা": "from; to fall", "মনত": "mind; heart" } }
      "মোৰ মনত চিন্তা আছে।": { native: "I have worries in my mind.", bases: { "আছে": "to be; there is; to have", "মনত": "mind; heart" } }
  "as-0057":
    native: "fruit; a result"
    notes:
      "n1": "ফ (phô) is প (pô) with a curl and a breath after it: ph, or f."
    examples:
      "পৰীক্ষাৰ ফল।": { native: "The result of the test.", bases: { "পৰীক্ষাৰ": "test; examination" } }
      "ফল পৰে।": { native: "The fruit falls.", bases: { "ফল": "fruit", "পৰে": "falls" } }
  "as-0058":
    native: "time"
    notes:
      "n1": "স (xô) is x. য় (yô) is য (zô) with a dot below, said y."
    examples:
      "কামৰ সময়": { native: "working hours", bases: {  } }
      "সময় লাগে": { native: "it takes time", bases: {  } }
  "as-0059":
    native: "way; path"
    notes:
      "n1": "প (pô) and থ (thô) both have only half a headline, so the line breaks over them."
    examples:
      "পথটো ডাঙৰ।": { native: "The path is big.", bases: { "পথটো": "way; path" } }
      "এইটো পথ।": { native: "This is a path.", bases: {  } }
  "as-0060":
    native: "town; city"
    notes:
      "n1": "গ (gô) has half a headline; then ৰ (rô). A city is also চহৰ (sôhôr)."
    examples:
      "এইটো নগৰ।": { native: "This is a town.", bases: {  } }
      "নগৰ ডাঙৰ।": { native: "The town is big.", bases: {  } }
  "as-0061":
    native: "hot (weather); warm"
    notes:
      "n1": "Hot weather or warm clothes. Hot as with chilli is জলা (zôlā)."
    examples:
      "খুব গৰম।": { native: "Very hot.", bases: { "গৰম": "hot" } }
      "ঘী গৰম।": { native: "The ghee is hot.", bases: {  } }
  "as-0062":
    native: "group; team; party"
    notes:
      "n1": "দ (dô) and ল (lô), each with its o, and the last one quiet."
    examples:
      "এইটো মোৰ দল।": { native: "This is my group.", bases: {  } }
      "খেলৰ দল": { native: "sports team", bases: {  } }
  "as-0063":
    native: "nail (of a finger)"
    notes:
      "n1": "খ (khô) has only half a headline."
    examples:
      "এইটো মোৰ নখ।": { native: "This is my nail.", bases: {  } }
      "নখ ডাঙৰ।": { native: "The nail is big.", bases: {  } }
  "as-0064":
    native: "less; a little"
    notes:
      "n1": "Only ক (kô) and ম (mô). With the a sign it is a different word: কাম (kām), work."
  "as-0065":
    native: "water (formal)"
    notes:
      "n1": "জ (zô) is said z, and chat writes it j. A bookish word: everyday water is পানী (pāni)."
  "as-0066":
    native: "opinion; view"
    notes:
      "n1": "ত (tô) is a t with the tongue behind the teeth. আপোনাৰ মত কি? (apunar mot ki?), what do you think?"
    examples:
      "এইটো মোৰ মত।": { native: "This is my opinion.", bases: {  } }
      "মত দিয়া": { native: "to give one's view", bases: {  } }
  "as-7525":
    native: "blood"
    notes:
      "n1": "ৰ (rô), then ক্ত (ktô) joined: ৰক্ত (rôkt, blood). The ত at the end is said with no vowel after it."
    examples:
      "এইটো ৰক্ত।": { native: "This is blood.", bases: {  } }
      "ৰক্ত বহুত।": { native: "There is a lot of blood.", bases: {  } }
  "as-7526":
    native: "hard; strong"
    notes:
      "n1": "শ (xô) and ক্ত (ktô) joined: শক্ত (xôkt, hard; strong). The same joined pair as in ৰক্ত (rôkt, blood)."
    examples:
      "এইটো শক্ত।": { native: "This is hard.", bases: {  } }
      "ঘৰ শক্ত।": { native: "The house is strong.", bases: {  } }
  "as-7527":
    native: "religion; duty; righteousness"
    notes:
      "n1": "ধ (dhô), then the reph ৰ্ on top of ম (mô): ধৰ্ম (dhôrm, religion; duty; righteousness)."
    examples:
      "এইটো ধৰ্ম।": { native: "This is a religion.", bases: {  } }
      "ধৰ্ম ভাল।": { native: "Religion is good.", bases: {  } }
  "as-7528":
    native: "autumn"
    notes:
      "n1": "শ (xô), ৰ (rô), then ৎ (khondo to): শৰৎ (xôrôt, autumn). The ৎ is a t sound with no vowel after it."
    examples:
      "এইটো শৰৎ।": { native: "This is autumn.", bases: {  } }
      "শৰৎ ভাল।": { native: "Autumn is good.", bases: {  } }
  "as-7529":
    native: "ice; snow"
    notes:
      "n1": "ব (bô), ৰ (rô), then ফ (phô) with a breath: বৰফ (bôrôf, ice; snow)."
    examples:
      "এইটো বৰফ।": { native: "This is ice.", bases: {  } }
      "বৰফ ঠাণ্ডা।": { native: "Ice is cold.", bases: {  } }
  "as-7530":
    native: "colour; paint"
    notes:
      "n1": "ৰ (rô), then ং (ng), the nasal sign on the vowel: ৰং (rôṅ, colour; paint)."
    examples:
      "এইটো ৰং।": { native: "This is a colour.", bases: {  } }
      "ৰং ভাল।": { native: "The colour is good.", bases: {  } }
  "as-7531":
    native: "anger; temper"
    notes:
      "n1": "খ (khô) with a breath, then ং (ng): খং (khôṅ, anger; temper)."
    examples:
      "এইটো খং।": { native: "This is anger.", bases: {  } }
      "খং বেয়া।": { native: "Anger is bad.", bases: {  } }
  "as-7532":
    native: "birth"
    notes:
      "n1": "জ (zô), then ন্ম (nmô) joined: জন্ম (zônm, birth)."
    examples:
      "এইটো জন্ম।": { native: "This is a birth.", bases: {  } }
      "জন্ম ভাল।": { native: "Birth is good.", bases: {  } }
  "as-7533":
    native: "age"
    notes:
      "n1": "ব (bô), then য (zô) said 'y' after it: বয়স (bôyôs, age)."
    examples:
      "এইটো বয়স।": { native: "This is age.", bases: {  } }
      "মোৰ বয়স।": { native: "My age.", bases: {  } }
  "as-7534":
    native: "fear"
    notes:
      "n1": "ভ (bhô) with a breath, then য (zô) said 'y': ভয় (bhôy, fear)."
    examples:
      "এইটো ভয়।": { native: "This is fear.", bases: {  } }
      "ভয় বেয়া।": { native: "Fear is bad.", bases: {  } }
  "as-7535":
    native: "news; information"
    notes:
      "n1": "খ (khô), ব (bô) and ৰ (rô) in a row: খবৰ (khôbôr, news; information)."
    examples:
      "এইটো খবৰ।": { native: "This is news.", bases: {  } }
      "খবৰ ভাল।": { native: "The news is good.", bases: {  } }
  "as-7536":
    native: "hobby; pastime"
    notes:
      "n1": "শ (xô) and খ (khô) with a breath: শখ (xôkh, hobby; pastime)."
    examples:
      "এইটো শখ।": { native: "This is a hobby.", bases: {  } }
      "শখ ভাল।": { native: "A hobby is good.", bases: {  } }
  "as-7537":
    native: "weather; season"
    notes:
      "n1": "ব (bô), ত (tô), then ৰ (rô) in a row: বতৰ (bôtôr, weather; season)."
    examples:
      "এইটো বতৰ।": { native: "This is the weather.", bases: {  } }
      "বতৰ ভাল।": { native: "The weather is good.", bases: {  } }
  "as-7538":
    native: "tree; plant"
    notes:
      "n1": "গ (gô), then ছ (sô), said s: গছ (gôs, tree; plant)."
    examples:
      "এইটো গছ।": { native: "This is a tree.", bases: {  } }
      "গছ ডাঙৰ।": { native: "The tree is big.", bases: {  } }
  "as-7539":
    native: "ideal; example to follow"
    notes:
      "n1": "অ (ô), দ (dô), then the reph ৰ্ on শ (xô): আদৰ্শ (ādôrx, ideal; example to follow)."
    examples:
      "এইটো আদৰ্শ।": { native: "This is an ideal.", bases: {  } }
      "আদৰ্শ ভাল।": { native: "An ideal is good.", bases: {  } }
