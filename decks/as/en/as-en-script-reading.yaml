schema: 1
id: "as-en-script-reading"
kind: "layer"
core: "as-script-reading"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words to read"
license: "CC-BY-SA-4.0"
description: "Short everyday words written with letters alone, no vowel signs: the headline, ৰ (rô), the dot below and the vowel you do not see, at work. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0052":
    native: "house; home"
    notes:
      "n1": "Two letters under one headline. ঘ (ghô) is gho and ৰ (rô) is ro, but the last o isn't said: ghor. ঘৰত (ghôrôt), at home."
    examples:
      "কাঠৰ ঘৰ।": { native: "A house of wood.", bases: { "কাঠৰ": "wood; timber" } }
      "ঘৰ আলোকিত।": { native: "The house is bright.", bases: {  } }
  "as-0053":
    native: "Assam"
    notes:
      "n1": "অ (ô), স (xô) and ম (mô), each with the open o, and the last one quiet. স (xô) is the rasp x: chat writes the name Axom. অসমীয়া (ôxomiyā) is Assamese, the language and the people."
    examples:
      "মানচিত্ৰত অসম।": { native: "Assam is on the map.", bases: { "মানচিত্ৰত": "map" } }
      "মানচিত্ৰত অসম পূবত।": { native: "On the map, Assam is in the east.", bases: {  } }
  "as-0054":
    native: "pen"
    notes:
      "n1": "Three letters and no vowel written: ko-lo-m."
    examples:
      "কলম তলত আছে।": { native: "The pen is below.", bases: { "কলম": "pen", "আছে": "is" } }
      "তিনিটা কলম ইয়াত।": { native: "Three pens are here.", bases: { "কলম": "pen" } }
  "as-0055":
    native: "very; big, great"
    notes:
      "n1": "ব (bô) and then ৰ (rô), which is ব (bô) with a slanting stroke. One of the commonest words in Assamese: বৰ ভাল (bôr bhāl), very good."
    examples:
      "ভাস্কৰ্য বৰ।": { native: "The sculpture is big.", bases: {  } }
      "আজি বৰ গৰম।": { native: "It's very hot today.", bases: {  } }
  "as-0056":
    native: "mind; heart"
    notes:
      "n1": "ম (mô) and ন (nô) under one headline; the last o is quiet. মোৰ মন ভাল নাই (mur môn bhāl nāi), 'my heart is not well': I'm feeling low."
  "as-0057":
    native: "fruit; a result"
    notes:
      "n1": "ফ (phô) is প (pô) with a curl and a breath after it: ph, or f."
    examples:
      "পৰীক্ষাৰ ফল।": { native: "The result of the test.", bases: { "পৰীক্ষাৰ": "test; examination" } }
      "ফল পৰে।": { native: "The fruit falls.", bases: { "ফল": "fruit", "পৰে": "falls" } }
  "as-0058":
    native: "time"
    notes:
      "n1": "স (xô) is x. য় (yô) is য (zô) with a dot below, said y."
    examples:
      "কামৰ সময়": { native: "working hours", bases: {  } }
      "সময় লাগে": { native: "it takes time", bases: {  } }
  "as-0059":
    native: "way; path"
    notes:
      "n1": "প (pô) and থ (thô) both have only half a headline, so the line breaks over them."
  "as-0060":
    native: "town; city"
    notes:
      "n1": "গ (gô) has half a headline; then ৰ (rô). A city is also চহৰ (sôhôr)."
  "as-0061":
    native: "hot (weather); warm"
    notes:
      "n1": "Hot weather or warm clothes. Hot as with chilli is জলা (zôlā)."
    examples:
      "খুব গৰম।": { native: "Very hot.", bases: { "গৰম": "hot" } }
      "ঘী গৰম।": { native: "The ghee is hot.", bases: {  } }
  "as-0062":
    native: "group; team; party"
    notes:
      "n1": "দ (dô) and ল (lô), each with its o, and the last one quiet."
    examples:
      "খেলৰ দল": { native: "sports team", bases: {  } }
  "as-0063":
    native: "nail (of a finger)"
    notes:
      "n1": "খ (khô) has only half a headline."
  "as-0064":
    native: "less; a little"
    notes:
      "n1": "Only ক (kô) and ম (mô). With the a sign it is a different word: কাম (kām), work."
  "as-0065":
    native: "water (formal)"
    notes:
      "n1": "জ (zô) is said z, and chat writes it j. A bookish word: everyday water is পানী (pāni)."
  "as-0066":
    native: "opinion; view"
    notes:
      "n1": "ত (tô) is a t with the tongue behind the teeth. আপোনাৰ মত কি? (apunar mot ki?), what do you think?"
    examples:
      "মত দিয়া": { native: "to give one's view", bases: {  } }
