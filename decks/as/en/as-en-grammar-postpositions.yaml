schema: 1
id: "as-en-grammar-postpositions"
kind: "layer"
core: "as-grammar-postpositions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Case endings and postpositions"
license: "CC-BY-SA-4.0"
description: "In, to, from, with: endings on the noun, and words after it. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-2003":
    notes:
      "n1": "-ত (-tô) is 'in' or 'at': ঘৰত (ghôrôt), at home; চহৰত (sôhôrôt), in town."
    examples:
      "ঘৰত অতিথি আছে।": { native: "There is a guest at home.", bases: { "আছে": "to be; there is; to have" } }
      "ঘৰত উম আছে।": { native: "There is warmth in the house.", bases: { "আছে": "to be; there is; to have" } }
  "as-2004":
    notes:
      "n1": "-লৈ (-lôi) is 'to' a place: বজাৰলৈ (bôzārôlôi), to the market."
    examples:
      "আমি বজাৰলৈ গৈছো।": { native: "We have gone to the market.", bases: {  } }
      "আমি বজাৰলৈ যাওঁ।": { native: "We are going to the market.", bases: { "বজাৰলৈ": "to the market", "যাওঁ": "go", "আমি": "we" } }
  "as-2072":
    native: "from Guwahati"
    notes:
      "n1": "'From' is -ৰ পৰা (-rô pôrā): the noun takes -ৰ (-rô), then পৰা (pôrā)."
    bases:
      "গুৱাহাটীৰ": "Guwahati"
      "পৰা": "from; to fall"
  "as-2073":
    native: "Give it to Ram, please."
    notes:
      "n1": "-ক (-kô) marks the one something is given or said to, and a person who is the object: ৰামক মাতক (rāmôk mātôk), call Ram."
    bases:
      "ৰামক": "Ram (a man's name)"
  "as-2074":
    native: "with me"
    notes:
      "n1": "লগত (lôgôt), 'with', after the -ৰ (-rô) form: তোমাৰ লগত (tumār lôgôt), with you."
    bases:
      "মোৰ": "I"
      "লগত": "company; meeting"
  "as-2075":
    native: "with a pen"
    notes:
      "n1": "-এৰে (-ere) is 'with' for a tool: কলমেৰে লিখা (kôlômere likhā), write with a pen. With a person it is লগত (lôgôt)."
    examples:
      "মই কলমেৰে লিখোঁ।": { native: "I write with a pen.", bases: {  } }
      "সি কলমেৰে লিখে।": { native: "He writes with a pen.", bases: { "কলমেৰে": "with a pen", "লিখে": "writes", "সি": "he; she" } }
  "as-2076":
    native: "on the table"
    bases:
      "ওপৰত": "top; above"
  "as-2077":
    native: "under the table"
    bases:
      "তলত": "below; under"
  "as-2078":
    native: "near the river"
    bases:
      "নদীৰ": "river"
  "as-2079":
    native: "for you"
    bases:
      "তোমাৰ": "you (familiar)"
      "বাবে": "for"
  "as-2080":
    native: "after the meal"
    notes:
      "n1": "'After eating rice': a verb takes -ৰ (-rô) before পাছত (pāsôt), as a noun does."
  "as-2081":
    native: "before the meal"
  "as-2082":
    native: "inside the house"
    notes:
      "n1": "Outside is বাহিৰত (bāhirôt): ঘৰৰ বাহিৰত (ghôrôr bāhirôt)."
    bases:
      "ভিতৰত": "inside"
  "as-2083":
    native: "until evening"
    notes:
      "n1": "-লৈকে (-lôike) is 'until' or 'as far as'."
    examples:
      "মই সন্ধিয়ালৈকে ইয়াত থাকোঁ।": { native: "I stay here until evening.", bases: { "সন্ধিয়ালৈকে": "until evening", "থাকোঁ": "to stay; to live" } }
      "সন্ধিয়ালৈকে ইয়াত থাকে।": { native: "He stays here until evening.", bases: { "সন্ধিয়ালৈকে": "until evening", "থাকে": "to stay; to live" } }
