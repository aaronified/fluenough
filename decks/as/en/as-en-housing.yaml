schema: 1
id: "as-en-housing"
kind: "layer"
core: "as-housing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Housing and renting"
license: "CC-BY-SA-4.0"
description: "Finding a place to live: the rented house, the owner and the tenant, the advance, the balcony and the rules of the house. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3793":
    native: "rented house"
    notes:
      "n1": "A house that you pay money each month to live in, not your own."
    examples:
      "ভাড়াঘৰ ভাল।": "The rented house is good."
      "ভাড়াঘৰ বিচাৰোঁ।": "I am looking for a rented house."
  "as-3794":
    native: "owner; landlord"
    notes:
      "n1": "The person who owns a house or a shop."
    examples:
      "মালিক ভাল।": "The owner is good."
      "মালিক আহিছে।": "The owner has come."
  "as-3795":
    native: "tenant"
    notes:
      "n1": "The person who pays rent to live in a house or room."
    examples:
      "ভাড়াটীয়া ভাল।": "The tenant is good."
      "ভাড়াটীয়া আহিছে।": "The tenant has come."
  "as-3796":
    native: "advance (payment)"
    notes:
      "n1": "Money paid before it is due, such as the first deposit on a flat."
    examples:
      "অগ্ৰিম কিমান?": "How much is the advance?"
      "অগ্ৰিম লাগে।": "An advance is needed."
  "as-3797":
    native: "place; space"
    notes:
      "n1": "A place, or the room a thing takes up."
    examples:
      "জায়গা বহল।": "The place is wide."
      "জায়গা নাই।": "There is no space."
  "as-3798":
    native: "balcony; verandah"
    notes:
      "n1": "The covered outer floor along the front of a house."
    examples:
      "বাৰান্দাত বহা।": { native: "Sit on the verandah.", bases: { "বাৰান্দাত": "balcony; verandah" } }
      "বাৰান্দা ডাঙৰ।": "The verandah is big."
  "as-3799":
    native: "roof terrace"
    notes:
      "n1": "The flat top of a building where one can stand."
    examples:
      "ছাদত মানুহ।": { native: "There are people on the roof.", bases: { "ছাদত": "roof terrace" } }
      "ছাদ নতুন।": "The roof is new."
  "as-3800":
    native: "gate"
    notes:
      "n1": "The entrance gate of a yard or a building. Written as said in English."
    examples:
      "গেট বন্ধ।": { native: "The gate is closed.", bases: { "বন্ধ": "closed; shut" } }
      "গেট খোলা।": "Open the gate."
  "as-3801":
    native: "water pipe; tap"
    notes:
      "n1": "The pipe that brings water into the house."
    bases:
      "নল": "pipe; tube"
  "as-3802":
    native: "to rent out"
    notes:
      "n1": "To let your house or room to another person for money."
  "as-3803":
    native: "to rent"
    notes:
      "n1": "To take a house or room for money each month."
  "as-3804":
    native: "the house is empty; to let"
    notes:
      "n1": "A room or house with no one living in it."
