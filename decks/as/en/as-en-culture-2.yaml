name: "Culture 2: from Orunodoi to the Jonaki writers"
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
description: "Short lines of Assamese prose and verse from the 1800s and early 1900s, from a reading book of 1849 to the novels and poems of Bordoloi, Bezbaroa, Agarwala and Padmanath Gohain Baruah, all in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by an Assamese speaker: please report any mistake."

cards:
  "as-4150":
    native: "At the start of the lesson I give a few pieces of advice; take them and do not neglect them."
    notes:
      "n1": "The author speaks to children at the start of a reading book of 1849, and the spelling is that of its time."
  "as-4151":
    native: "The great river Brahmaputra divides this country into two parts, the north bank and the south bank."
    notes:
      "n1": "A sentence from the book's opening description of the country of Assam and its rivers."
  "as-4152":
    native: "Kripabar Barbarua is a mighty archer, with a big belly and a topknot a-flutter."
    notes:
      "n1": "A sonnet about Kripabar Barbarua, which the page files under the Kakatar Tupi."
  "as-4153":
    native: "I will eat the seeds of the bokul, watch the marriage of the seuti, drink the honey of the karabi and take the dust of the keteki."
    notes:
      "n1": "A verse of Kodomkoli in which the speaker plays among flowers; the bokul, the seuti, the karabi and the keteki are names of flowering plants."
  "as-4154":
    native: "The boy's name is \"Jonki\" and the girl's name is \"Panei\"."
    notes:
      "n1": "The names of a young Miri (Mising) boy and girl who board a boat together in this novel."
  "as-4155":
    native: "After walking about a mile in this way, the girl turned west and set out along another road."
    notes:
      "n1": "A sentence from the second chapter of the novel, which follows the girl after she leaves the prayer house."
  "as-4156":
    native: "The worship of beauty is the game of life, and when the play is over, the dark curtain of time comes down."
    notes:
      "n1": "The last lines of a poem on this page of Pratima, a book of poems; the poet pictures life as a play on a stage."
  "as-4157":
    native: "The old cares are still there, but the old happiness is not."
    notes:
      "n1": "A line from the second chapter of the novel, in which the speaker looks back at days that are gone."
  "as-4160":
    native: "With effort, learning is surely gained, and this is never otherwise."
    notes:
      "n1": "The author, writing for children, says that learning comes from hard work and attention."
  "as-4161":
    native: "There is a quality greater than all other qualities."
    notes:
      "n1": "The line ends a passage that calls learning the root of all good qualities, which brings wealth and fame and cannot be lost."
  "as-4162":
    native: "Listen, and I will explain clearly how it will make you happy in the life to come."
    notes:
      "n1": "The author promises to explain how learning brings happiness after death, through the knowledge of God and of right and wrong."
  "as-4163":
    native: "As soon as the fire blazes up, whoever can says this mantra and pours ghee on it."
    notes:
      "n1": "From the essay on the Magh Bihu fires, in which the eldest Brahmin youth of the village says a mantra and pours ghee on the fire."
  "as-4164":
    native: "Only then does everyone eat chira, pitha and sandah as a light snack."
    notes:
      "n1": "The same essay: after the fire, the prayers and the respect paid to elders, everyone eats chira (flattened rice), pitha and other snacks."
  "as-4165":
    native: "After leaving Pampur, we spent eight months in Rangpur town."
    notes:
      "n1": "From the story Lahori, which tells of the narrator's move from Pampur to Rangpur town."
  "as-4166":
    native: "It is said that Assam had turned into a cremation ground through the troubles."
    notes:
      "n1": "The narrator, back from another country, recalls what he heard and saw of the troubles in Assam."
  "as-4167":
    native: "Even three or four villages had come into being."
    notes:
      "n1": "The same passage tells how the villages round the narrator filled with Assamese people carried off in the troubles."
  "as-4168":
    native: "The heart stirred, and quietly sighed away in a faint, soft tune."
    notes:
      "n1": "A verse from the poem Lila, about a heart that wakes to the beauty of nature."
  "as-4169":
    native: "Giving something into his hand and whispering a little advice in his ear, he went away."
    notes:
      "n1": "The line ends a short passage in Jon-Biri, in which someone gives a thing and a whispered word and then goes away."
