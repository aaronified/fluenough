name: "Culture 2: from Orunodoi to the Jonaki writers"
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
description: "Short lines of Assamese prose and verse from the 1800s and early 1900s, from a reading book of 1849 to the novels and poems of Bordoloi, Bezbaroa, Agarwala and Padmanath Gohain Baruah, all in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by an Assamese speaker: please report any mistake."

cards:
  "as-4150":
    native: "At the start of the lesson I give a few pieces of advice; take them and do not neglect them."
    notes:
      "n1": "The author speaks to children at the start of a reading book of 1849, and the spelling is that of its time."
  "as-4151":
    native: "The great river Brahmaputra divides this country into two parts, the north bank and the south bank."
    notes:
      "n1": "A sentence from the book's opening description of the country of Assam and its rivers."
  "as-4152":
    native: "Kripabar Barbarua is a mighty archer, with a big belly and a topknot a-flutter."
    notes:
      "n1": "A sonnet about Kripabar Barbarua, which the page files under the Kakatar Tupi."
  "as-4153":
    native: "I will eat the seeds of the bokul, watch the marriage of the seuti, drink the honey of the karabi and take the dust of the keteki."
    notes:
      "n1": "A verse of Kodomkoli in which the speaker plays among flowers; the bokul, the seuti, the karabi and the keteki are names of flowering plants."
  "as-4154":
    native: "The boy's name is \"Jonki\" and the girl's name is \"Panei\"."
    notes:
      "n1": "The names of a young Miri (Mising) boy and girl who board a boat together in this novel."
  "as-4155":
    native: "After walking about a mile in this way, the girl turned west and set out along another road."
    notes:
      "n1": "A sentence from the second chapter of the novel, which follows the girl after she leaves the prayer house."
  "as-4156":
    native: "The worship of beauty is the game of life, and when the play is over, the dark curtain of time comes down."
    notes:
      "n1": "The last lines of a poem on this page of Pratima, a book of poems; the poet pictures life as a play on a stage."
  "as-4157":
    native: "The old cares are still there, but the old happiness is not."
    notes:
      "n1": "A line from the second chapter of the novel, in which the speaker looks back at days that are gone."
