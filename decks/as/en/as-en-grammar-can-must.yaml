schema: 1
id: "as-en-grammar-can-must"
kind: "layer"
core: "as-grammar-can-must"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Can, may and must"
license: "CC0-1.0"
description: "Ability, knowing how, permission and duty: the verb in -ব (-bô) with পাৰ্ (pār), জান্ (zān), লাগিব (lāgib) and নাপায় (nāpāy). Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-2159":
    native: "I can speak Assamese."
    notes:
      "n1": "Can is the verb in -ব (-bô), then পাৰ্ (pār) with the person's ending: ক (kô)'ব পাৰোঁ (bô pārum̐), I can speak."
    bases:
      "মই": "I"
      "পাৰোঁ": "to be able"
  "as-2160":
    native: "Can you come tomorrow?"
    bases:
      "আহিব": "to come"
      "পাৰিবনে": "to be able"
  "as-2161":
    native: "I can't come."
    notes:
      "n1": "Can't is নোৱাৰ্ (nuwār), not ন- (nô-) with পাৰ্ (pār): নোৱাৰোঁ (nuwārum̐), I can't; নোৱাৰে (nuwāre), he can't."
    bases:
      "মই": "I"
      "আহিব": "to come"
      "নোৱাৰোঁ": "to be able"
  "as-2162":
    native: "I can swim."
    notes:
      "n1": "For a skill, 'know how': the verb in -ব (-bô), then জান্ (zān), to know."
    bases:
      "মই": "I"
      "সাঁতুৰিব": "to swim"
      "জানোঁ": "to know"
  "as-2163":
    native: "You may come in."
    notes:
      "n1": "পাৰে (pāre) is also may: you can, you are allowed."
    bases:
      "ভিতৰলৈ": "inside"
      "আহিব": "to come"
      "পাৰে": "to be able"
  "as-2164":
    native: "You mustn't take photos here."
    notes:
      "n1": "Mustn't is the verb in -ব (-bô) with নাপায় (nāpāy), the same for everyone."
    bases:
      "ফটো": "photo"
      "তুলিব": "to take (a photo)"
      "নাপায়": "to get; to like"
  "as-2165":
    native: "You must come tomorrow."
    notes:
      "n1": "Must is the verb in -ব (-bô) with লাগিব (lāgib), 'will be needed', or লাগে (lāge): the same for everyone."
    bases:
      "আহিব": "to come"
  "as-2166":
    native: "I don't have to go."
    notes:
      "n1": "Don't have to is the verb in -ব (-bô) with নালাগে (nālāge), 'is not needed'."
    bases:
      "মই": "I"
      "যাব": "to go"
  "as-2167":
    native: "May I go?"
    bases:
      "মই": "I"
      "যাব": "to go"
      "পাৰোঁনে": "to be able"
