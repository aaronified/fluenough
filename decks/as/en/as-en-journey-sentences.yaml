core: "as-journey-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Journey: sentences"
license: "CC-BY-SA-4.0"
description: "Sentences built from the words of this unit and the ones before it. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-2996":
    native: "The train is on the platform."
    notes:
      "n1": "-ত (-t), 'on', joins প্লেটফৰ্ম (pletôphôrm), platform: প্লেটফৰ্মত (pletôphôrmôt). No word for 'is' is needed."
    confusables:
      "c1": { why: "A ship, not a train." }
      "c2": { why: "A small boat, not a train." }
  "as-2997":
    native: "Why are you late?"
    notes:
      "n1": "কিয় (kiyô), 'why', comes before the verb. দেৰি কৰা (deri kôrā) is literally 'do lateness', and কৰিলা (korilā) is the past 'you' form."
    confusables:
      "c1": { why: "On time, the opposite." }
      "c2": { why: "A seat, not lateness." }
  "as-2998":
    native: "I am sitting in the seat."
    notes:
      "n1": "বহিছোঁ (bohisum̐) is the stem বহ- (bôh-) of বহা (bôhā), 'to sit', plus -িছোঁ (-isum̐). আসনত (āxônôt) is 'in the seat'."
    confusables:
      "c1": { why: "A house, not a seat." }
      "c2": { why: "A room, not a seat." }
  "as-2999":
    native: "The bus will leave now."
    notes:
      "n1": "ছাড়িব (sāribô) is the stem ছাড়- (sār-) of ছাড়া (sārā), 'to leave', plus -িব (-ibô), the future."
    confusables:
      "c1": { why: "Will arrive, the opposite direction." }
      "c2": { why: "Will come, not leave." }
  "as-3000":
    native: "The driver is good."
    confusables:
      "c1": { why: "A passenger, not the driver." }
      "c2": { why: "A driver, the same role." }
  "as-3001":
    native: "Our journey is long."
    notes:
      "n1": "আমাৰ (āmār), 'our', comes from আমি (āmi), 'we': the vowel changes before -ৰ (-r), 'of'."
    confusables:
      "c1": { why: "Short, the opposite." }
      "c2": { why: "Wide, not long." }
  "as-3002":
    native: "There are many kilometres."
    confusables:
      "c1": { why: "Distance, the same idea." }
      "c2": { why: "Weight, not distance." }
  "as-3003":
    native: "I have a problem."
    notes:
      "n1": "মোৰ (mur), 'my', stands for 'I have': মোৰ অসুবিধা (mur ôxubidhā) is literally 'my problem'."
    confusables:
      "c1": { why: "Convenience, the opposite." }
      "c2": { why: "Pain, not an inconvenience." }
