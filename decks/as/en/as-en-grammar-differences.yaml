schema: 1
id: "as-en-grammar-differences"
kind: "layer"
core: "as-grammar-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How Assamese grammar differs from English"
license: "CC0-1.0"
description: "Before any theme: the verb last, no is, endings for in, to and of, a doer's -এ (-e), no gender in the verb, three yous, classifiers for a and the, and how Assamese says have, not and questions. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-2001":
    native: "I eat rice."
    notes:
      "n1": "The verb comes last: subject, object, verb. Word for word, 'I rice eat'."
    bases:
      "মই": "I"
  "as-2002":
    native: "He is a doctor. / She is a doctor."
    notes:
      "n1": "No word for 'am', 'is' or 'are' when saying what someone is: 'he doctor'. Where someone is, or how they are, takes আছে (āse): মই ভালে আছোঁ (moi bhāle āsum̐), I'm well."
    bases:
      "তেওঁ": "he; she"
  "as-2003":
    native: "at home; in the house"
    notes:
      "n1": "Assamese puts 'in' and 'at' after the noun, as an ending: ঘৰ (ghôr, house) + -ত (-tô)."
  "as-2004":
    native: "to the market"
    notes:
      "n1": "'To' a place is the ending -লৈ (-lôi): বজাৰ (bôzār, market) + -লৈ (-lôi)."
  "as-2005":
    native: "father's book"
    notes:
      "n1": "'Of' is the ending -ৰ (-rô) on the owner, who comes first: দেউতা (deutā, father) + -ৰ (-rô)."
    bases:
      "কিতাপ": "book"
  "as-2006":
    native: "Ram ate rice."
    notes:
      "n1": "A noun that does something to something takes -এ (-e): ৰাম (rām) + -এ (-e). After a vowel it is -ই (-i) or -য়ে (-ye): দেউতাই (deutāi), মায়ে (māye). Most pronouns, such as মই (moi) and সি (si), do not take it."
    bases:
      "ৰামে": "Ram (a man's name)"
  "as-2007":
    native: "He came."
    notes:
      "n1": "সি (si) is 'he'. The verb আহিল (āhil), 'came', is the same for a man, a woman or a thing."
    bases:
      "সি": "he; that"
      "আহিল": "to come"
  "as-2008":
    native: "She came."
    notes:
      "n1": "তাই (tāi) is 'she'. Only the pronoun shows it: no verb, describing word or noun ending changes for a woman."
    bases:
      "তাই": "she"
      "আহিল": "to come"
  "as-2009":
    native: "Please sit down."
    notes:
      "n1": "Three words for 'you', each with its own verb ending: আপুনি (āpuni), for strangers and elders, takes -ক (-kô) in a request."
    bases:
      "বহক": "to sit"
  "as-2010":
    native: "Sit down. (familiar)"
    notes:
      "n1": "তুমি (tumi), for friends, family and those younger, takes -আ (-ā)."
    bases:
      "তুমি": "you (familiar)"
      "বহা": "to sit"
  "as-2011":
    native: "Sit! (intimate)"
    notes:
      "n1": "তই (toi), only for very close friends and small children, takes the bare stem. To anyone else it is rude."
    bases:
      "তই": "you (intimate)"
      "বহ": "to sit"
  "as-2012":
    native: "I'll go."
    notes:
      "n1": "The ending -ম (-mô) says 'I' in the future, so মই (moi) can be left out."
  "as-2013":
    native: "a book; one book"
    notes:
      "n1": "No word for 'a': 'one' takes a classifier, here -খন (-khôn), for books and flat things. এখন (ekhôn) is 'one' or 'a'."
    bases:
      "কিতাপ": "book"
  "as-2014":
    native: "the book"
    notes:
      "n1": "No word for 'the' either: the classifier on the noun makes it definite."
  "as-2015":
    native: "I have a book."
    notes:
      "n1": "No verb 'have': 'of me a book there is', with আছে (āse), 'there is'."
    bases:
      "মোৰ": "I"
      "কিতাপ": "book"
      "আছে": "to be; to have"
  "as-2016":
    native: "I don't go."
    notes:
      "n1": "'Not' is ন- (nô-) at the front of the verb, with a vowel that echoes the verb's own: যাওঁ (zāum̐), I go; নাযাওঁ (nāzāum̐), I don't go."
    bases:
      "মই": "I"
      "নাযাওঁ": "to go"
  "as-2017":
    native: "There's no time."
    notes:
      "n1": "নাই (nāi) is 'there is not', the opposite of আছে (āse)."
  "as-2018":
    native: "Will you go?"
    notes:
      "n1": "A yes-or-no question adds -নে (-ne) to the verb and keeps the statement's word order: আপুনি যাব (āpuni zāb), you will go."
    bases:
      "যাবনে": "to go"
