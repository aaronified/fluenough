tags: ["unreviewed"]

cards:
  "as-4700":
    native: "to do pointless work; to busy oneself with something that comes to nothing"
    notes:
      "u1": "A fixed phrase for a person busy with pointless work that comes to nothing; as.wikiquote gives it as a verb phrase, to make work that has no use."
  "as-4701":
    native: "a great danger; a deep and bottomless trouble"
    notes:
      "u1": "A fixed phrase for a great danger or a deep, bottomless trouble; as.wikiquote gives its meaning only as great danger, with no verb attached."
  "as-4702":
    native: "a weak, spineless or dim-witted person; literally a fish in a little water"
    notes:
      "u1": "A fixed phrase used of a person, not a thing, for someone weak, spineless or dim-witted; as.wikiquote applies it to people with those traits."
    bases:
      "অলপ": { meaning: "a little" }
  "as-4704":
    native: "to be unable to choose the right one when there are too many choices"
    notes:
      "u1": "A fixed phrase for being unable to pick the right one when there are too many choices; as.wikiquote describes failing to choose the correct one among several."
    bases:
      "বগলী": { meaning: "egret, heron or crane" }
      "কণা": { meaning: "blind" }
  "as-4705":
    native: "to size up the situation and make the arrangements that suit it"
    notes:
      "u1": "A fixed phrase for sizing up a situation and making the arrangements it needs; as.wikiquote gives it as a verb phrase, to look at the situation and make arrangements."
  "as-4706":
    native: "to cling pointlessly to a task and refuse to let it go"
    notes:
      "u1": "A fixed phrase for someone who clings to a task for no reason and will not let it go; as.wikiquote describes holding on to a task pointlessly and refusing to drop it."
  "as-4707":
    native: "a heartfelt plea that gets no response; crying in the wilderness"
    notes:
      "u1": "A fixed phrase for a heartfelt plea that gets no response; as.wikiquote gives its meaning as an earnest request that fails."
  "as-4708":
    native: "a castle in the air; a baseless fancy"
    notes:
      "u1": "A fixed phrase for a baseless fancy or a castle in the air; as.wikiquote describes imagination that has no basis."
  "as-4709":
    native: "to count the days eagerly until a day one has been waiting for"
    notes:
      "u1": "A fixed phrase for waiting eagerly for a day one has been looking forward to; as.wikiquote describes waiting with eagerness for one particular day."
  "as-4710":
    native: "to go thirsty with the sea in front of you; to leave plenty of resources unused"
    notes:
      "u1": "A fixed phrase for not using help that is at hand even when one has plenty of means; as.wikiquote says it applies even when plenty of means and convenience are available."
    bases:
      "আগত": { meaning: "in front; before" }
      "মৰা": { meaning: "to die" }
  "as-4711":
    native: "to look for wealth without doing any work"
    notes:
      "u1": "A fixed phrase for seeking wealth and property without doing any work; as.wikiquote describes seeking money without working for it."
    bases:
      "বিচৰা": { meaning: "to search for; to seek" }
  "as-4712":
    native: "to dash someone's hopes"
    notes:
      "u1": "A fixed phrase for dashing someone's hopes; as.wikiquote gives its meaning as to disappoint someone, as a verb phrase."
    bases:
      "চেঁচা": { meaning: "cold" }
      "ঢলা": { meaning: "to pour" }
  "as-4713":
    native: "to go astray; to take the wrong path"
    notes:
      "u1": "A fixed phrase for going astray or taking the wrong path; as.wikiquote gives its meaning as going on the wrong path."
  "as-4714":
    native: "to be in a tearing hurry, rushing about in a flap"
    notes:
      "u1": "A fixed phrase for being in a tearing hurry and rushing about in a flap; as.wikiquote gives its meaning as being in a hurry."
    bases:
      "আই": { meaning: "mother" }
      "বাই": { meaning: "elder sister" }
  "as-4715":
    native: "idle, pointless talk"
    notes:
      "u1": "A fixed phrase for idle, pointless talk; as.wikiquote gives its meaning as unnecessary talk."
    bases:
      "কথা": { meaning: "talk; speech; matter" }
  "as-4717":
    native: "to beat someone roughly, with a series of blows"
    notes:
      "u1": "A fixed phrase for beating someone roughly with a series of blows; as.wikiquote gives its meaning as beating someone with blows one after another."
