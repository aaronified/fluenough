native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word phrases: idioms"
description: "Sixteen Assamese idioms from the as.wikiquote page of idioms, each with its meaning in English (a paraphrase of the page): not a word-by-word translation. Not yet checked by an Assamese speaker: please report any mistake."
