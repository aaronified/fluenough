schema: 1
id: "as-en-emergencies"
kind: "layer"
core: "as-emergencies"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Emergencies: accidents, fire, help and safety"
license: "CC-BY-SA-4.0"
description: "What to do in a crisis: the accident, the fire, the injured person, the ambulance, the safe place to run, and the number to call. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3818":
    native: "urgent; emergency"
    notes:
      "n1": "Needing action at once."
    examples:
      "জৰুৰী কাম।": "An urgent task."
      "এইটো জৰুৰী।": "This is urgent."
  "as-3819":
    native: "accident"
    notes:
      "n1": "A sudden event where someone is hurt."
    examples:
      "দুৰ্ঘটনা হ'ল।": { native: "An accident happened.", bases: { "হ'ল": "to become; to be" } }
      "দুৰ্ঘটনা বেয়া।": "The accident is bad."
  "as-3820":
    native: "fire (a big one)"
    notes:
      "n1": "A large fire that destroys things. For a small fire use জুই (zui)."
    examples:
      "অগ্নিকাণ্ড হ'ল।": { native: "There was a fire.", bases: { "হ'ল": "to become; to be" } }
      "অগ্নিকাণ্ড বেয়া।": "The fire is bad."
  "as-3821":
    native: "injured; hurt"
    notes:
      "n1": "Of a person who has been hurt in an accident."
    examples:
      "তেওঁ আহত।": "He is injured."
      "আহত মানুহ।": "An injured person."
  "as-3822":
    native: "safety; security"
    notes:
      "n1": "Being safe from harm."
    examples:
      "নিৰাপত্তা ভাল।": "Safety is good."
      "নিৰাপত্তা দৰকাৰ।": "Safety is needed."
  "as-3823":
    native: "ambulance"
    notes:
      "n1": "The vehicle that carries the injured to hospital. Written as said in English."
    examples:
      "অ্যাম্বুলেন্স আহিছে।": "The ambulance has come."
      "অ্যাম্বুলেন্স ডাকিব।": { native: "Call an ambulance.", bases: { "ডাকিব": "to call" } }
  "as-3824":
    native: "first aid"
    notes:
      "n1": "The first treatment given to an injured person before the doctor comes."
    bases:
      "প্ৰাথমিক": "first; primary"
      "চিকিৎসা": "treatment; medical care"
    examples:
      "প্ৰাথমিক চিকিৎসা লাগে।": { native: "First aid is needed.", bases: { "প্ৰাথমিক": "first; primary", "চিকিৎসা": "treatment; medical care" } }
      "প্ৰাথমিক চিকিৎসা ভাল।": { native: "The first aid is good.", bases: { "প্ৰাথমিক": "first; primary", "চিকিৎসা": "treatment; medical care" } }
  "as-3825":
    native: "danger"
    notes:
      "n1": "A situation where harm may come."
    examples:
      "বিপদ আছে।": { native: "There is danger.", bases: { "আছে": "to be; there is; to have" } }
      "বিপদ বহুত।": "There is much danger."
  "as-3826":
    native: "to escape; to run away"
    notes:
      "n1": "To get away from danger."
    examples:
      "মই পলাওঁ।": { native: "I run away.", bases: { "পলাওঁ": "to escape; to run away" } }
      "তাই পলাই গ'ল।": { native: "She ran away.", bases: { "পলাই": "to escape; to run away" } }
  "as-3827":
    native: "rescue"
    notes:
      "n1": "Saving a person from danger."
    examples:
      "উদ্ধাৰ হ'ল।": { native: "The rescue was done.", bases: { "হ'ল": "to become; to be" } }
      "উদ্ধাৰ ভাল।": "The rescue is good."
  "as-3828":
    native: "emergency number"
    notes:
      "n1": "The number to call for help in an emergency."
    examples:
  "as-3829":
    native: "to rescue"
    notes:
      "n1": "To save someone from danger."
    examples:
  "as-3830":
    native: "to help"
    notes:
      "n1": "To give help to someone who needs it."
    examples:
