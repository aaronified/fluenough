schema: 1
id: "as-en-more-verbs"
kind: "layer"
core: "as-more-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs"
license: "CC-BY-SA-4.0"
description: "Verbs of the kitchen and the house: cutting, frying, mixing, sending, hiding and drying. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-2290":
    native: "cut"
    notes:
      "n1": "The verb is কটা (kôtā), to cut, as in cutting vegetables."
    examples:
      "মই পিঁয়াজ কটোঁ।": { native: "I cut the onion.", bases: { "পিঁয়াজ": "onion", "কটোঁ": "cut", "মই": "I" } }
      "সি কাঠ কটে।": { native: "He cuts wood.", bases: { "কাঠ": "wood", "কটে": "cuts", "সি": "he; she" } }
  "as-2291":
    native: "fry"
    notes:
      "n1": "The verb is ভজা (bhôzā), to fry, as in frying fish or vegetables."
    examples:
      "মই মাছ ভজোঁ।": { native: "I fry the fish.", bases: { "মাছ": "fish", "ভজোঁ": "fry", "মই": "I" } }
      "তেওঁ আলু ভজে।": { native: "He fries potatoes.", bases: { "আলু": "potato", "ভজে": "fries", "তেওঁ": "he; she (polite)" } }
  "as-2292":
    native: "boil"
    notes:
      "n1": "The verb is সিজা (sizā), to boil, as in boiling water."
    examples:
      "মই পানী সিজোঁ।": { native: "I boil the water.", bases: { "পানী": "water", "সিজোঁ": "boil", "মই": "I" } }
      "ভাত সিজে।": { native: "The rice is boiling.", bases: { "ভাত": "rice; a meal", "সিজে": "boils" } }
  "as-2293":
    native: "open"
    notes:
      "n1": "The verb is খোলা (khulā), to open; its opposite is বন্ধ কৰা (bôndh kôrā), to close."
    examples:
      "মই বাকচটো খোলোঁ।": { native: "I open the box.", bases: { "বাকচটো": "the box", "খোলোঁ": "open", "মই": "I" } }
      "দুৱাৰখন খোলে।": { native: "The door opens.", bases: { "দুৱাৰখন": "the door", "খোলে": "opens" } }
  "as-2294":
    native: "send"
    notes:
      "n1": "The verb is পঠিওৱা (pothiuwā), to send, as in sending a letter."
    examples:
      "মই চিঠি পঠাওঁ।": { native: "I send a letter.", bases: { "চিঠি": "letter", "পঠাওঁ": "send", "মই": "I" } }
      "তেওঁ কিতাপ পঠায়।": { native: "He sends a book.", bases: { "কিতাপ": "book", "পঠায়": "sends", "তেওঁ": "he; she (polite)" } }
  "as-2295":
    native: "bring"
    notes:
      "n1": "The verb is আনা (ānā), to bring; it is the opposite of নিয়া (niyā), to take away."
    examples:
      "মই পানী আনোঁ।": { native: "I bring water.", bases: { "পানী": "water", "আনোঁ": "bring", "মই": "I" } }
      "সি কিতাপ আনে।": { native: "He brings a book.", bases: { "কিতাপ": "book", "আনে": "brings", "সি": "he; she" } }
  "as-2296":
    native: "take away"
    notes:
      "n1": "The verb is নিয়া (niyā), to take away from here."
    examples:
      "মই কিতাপ নিওঁ।": { native: "I take the book away.", bases: { "কিতাপ": "book", "নিওঁ": "take away", "মই": "I" } }
      "তেওঁ ভাত নিয়ে।": { native: "He takes the rice away.", bases: { "ভাত": "rice; a meal", "নিয়ে": "takes away", "তেওঁ": "he; she (polite)" } }
  "as-2297":
    native: "hold; catch"
    notes:
      "n1": "The verb is ধৰা (dhôrā), to hold or catch."
    examples:
      "মই হাত ধৰোঁ।": { native: "I hold the hand.", bases: { "হাত": "hand", "ধৰোঁ": "hold", "মই": "I" } }
      "সি বলটো ধৰে।": { native: "He catches the ball.", bases: { "বলটো": "the ball", "ধৰে": "catches", "সি": "he; she" } }
  "as-2298":
    native: "pull"
    notes:
      "n1": "The verb is টানা (tānā), to pull; its opposite is ঠেলা (thelā), to push."
    examples:
      "মই দুৱাৰ টানোঁ।": { native: "I pull the door.", bases: { "দুৱাৰ": "door", "টানোঁ": "pull", "মই": "I" } }
      "সি বেগ টানে।": { native: "He pulls the bag.", bases: { "বেগ": "bag", "টানে": "pulls", "সি": "he; she" } }
  "as-2299":
    native: "push"
    notes:
      "n1": "The verb is ঠেলা (thelā), to push, the opposite of টানা (tānā), to pull."
    examples:
      "মই দুৱাৰ ঠেলোঁ।": { native: "I push the door.", bases: { "দুৱাৰ": "door", "ঠেলোঁ": "push", "মই": "I" } }
      "তেওঁ গাড়ী ঠেলে।": { native: "He pushes the cart.", bases: { "গাড়ী": "cart", "ঠেলে": "pushes", "তেওঁ": "he; she (polite)" } }
  "as-2300":
    native: "search; look for"
    notes:
      "n1": "The verb is বিচাৰা (bisārā), to look for something lost."
    examples:
      "মই চাবি বিচাৰোঁ।": { native: "I look for the key.", bases: { "চাবি": "key", "বিচাৰোঁ": "look for", "মই": "I" } }
      "তেওঁ কলম বিচাৰে।": { native: "He looks for a pen.", bases: { "কলম": "pen", "বিচাৰে": "looks for", "তেওঁ": "he; she (polite)" } }
  "as-2301":
    native: "break"
    notes:
      "n1": "The verb is ভাঙা (bhāṅā), to break a thing into pieces."
    examples:
      "মই কাপ ভাঙোঁ।": { native: "I break the cup.", bases: { "কাপ": "cup", "ভাঙোঁ": "break", "মই": "I" } }
      "গিলাচটো ভাঙিল।": { native: "The glass broke.", bases: { "গিলাচটো": "the glass", "ভাঙিল": "broke" } }
  "as-2302":
    native: "mix"
    notes:
      "n1": "The verb is মিহলোৱা (mihôluwā), to mix things together."
    examples:
      "মই চাহ মিহলাওঁ।": { native: "I mix the tea.", bases: { "চাহ": "tea", "মিহলাওঁ": "mix", "মই": "I" } }
      "তেওঁ পানী মিহলায়।": { native: "He mixes the water.", bases: { "পানী": "water", "মিহলায়": "mixes", "তেওঁ": "he; she (polite)" } }
  "as-2303":
    native: "count"
    notes:
      "n1": "The verb is গণা (gônā), to count."
    examples:
      "মই টকা গণোঁ।": { native: "I count the money.", bases: { "টকা": "money", "গণোঁ": "count", "মই": "I" } }
      "শিশুটোৱে গণে।": { native: "The child counts.", bases: { "শিশুটোৱে": "the child", "গণে": "counts" } }
  "as-2304":
    native: "search; look for; seek"
    notes:
      "n1": "The verb is খোজা (khuzā), to look for a person or a thing."
    examples:
      "মই তেওঁক খোজোঁ।": { native: "I look for him.", bases: { "তেওঁক": "him; her", "খোজোঁ": "look for", "মই": "I" } }
      "সি তাক খোজে।": { native: "He looks for her.", bases: { "তাক": "her", "খোজে": "looks for", "সি": "he; she" } }
  "as-2305":
    native: "decorate; dress"
    notes:
      "n1": "The verb is সাজা (sāzā), to decorate a room, or to dress up."
    examples:
      "মই কোঠা সাজোঁ।": { native: "I decorate the room.", bases: { "কোঠা": "room", "সাজোঁ": "decorate", "মই": "I" } }
      "তেওঁ সুন্দৰকৈ সাজে।": { native: "She dresses up nicely.", bases: { "সুন্দৰকৈ": "nicely", "সাজে": "dresses up", "তেওঁ": "he; she (polite)" } }
  "as-2306":
    native: "hide"
    notes:
      "n1": "The verb is লুকুৱা (lukuwā), to hide."
    examples:
      "মই কিতাপ লুকাওঁ।": { native: "I hide the book.", bases: { "কিতাপ": "book", "লুকাওঁ": "hide", "মই": "I" } }
      "শিশুটোৱে লুকায়।": { native: "The child hides.", bases: { "শিশুটোৱে": "the child", "লুকায়": "hides" } }
  "as-2307":
    native: "take out"
    notes:
      "n1": "The verb is উলিওৱা (uliuwā), to take out of a place."
    examples:
      "মই বেগৰ পৰা কিতাপ উলিয়াওঁ।": { native: "I take a book out of the bag.", bases: { "বেগৰ": "from the bag", "কিতাপ": "book", "উলিয়াওঁ": "take out", "মই": "I" } }
      "তেওঁ টকা উলিয়ায়।": { native: "He takes out money.", bases: { "টকা": "money", "উলিয়ায়": "takes out", "তেওঁ": "he; she (polite)" } }
  "as-2308":
    native: "roam; travel; go about"
    notes:
      "n1": "The verb is ফুৰা (phurā), to go about for pleasure or for work."
    examples:
      "মই ফুৰোঁ।": { native: "I go about.", bases: { "ফুৰোঁ": "go about", "মই": "I" } }
      "তেওঁলোক ফুৰে।": { native: "They travel.", bases: { "তেওঁলোক": "they (polite)", "ফুৰে": "travel" } }
  "as-2309":
    native: "wear"
    notes:
      "n1": "The verb is পিন্ধা (pindhā), to wear clothes or shoes."
    examples:
      "মই জোতা পিন্ধোঁ।": { native: "I wear shoes.", bases: { "জোতা": "shoes", "পিন্ধোঁ": "wear", "মই": "I" } }
      "তেওঁ চোলা পিন্ধে।": { native: "He wears a shirt.", bases: { "চোলা": "shirt", "পিন্ধে": "wears", "তেওঁ": "he; she (polite)" } }
  "as-2310":
    native: "turn; return"
    notes:
      "n1": "The verb is ঘূৰা (ghurā), to turn or to return."
    examples:
      "মই ঘূৰি যাওঁ।": { native: "I return.", bases: { "ঘূৰি": "return", "যাওঁ": "go", "মই": "I" } }
      "সি ঘৰলৈ ঘূৰে।": { native: "He returns home.", bases: { "ঘৰলৈ": "home", "ঘূৰে": "returns", "সি": "he; she" } }
  "as-2311":
    native: "hit; strike"
    notes:
      "n1": "The verb is মাৰা (mārā), to hit."
    examples:
      "মই বলটো মাৰোঁ।": { native: "I hit the ball.", bases: { "বলটো": "the ball", "মাৰোঁ": "hit", "মই": "I" } }
      "সি তাক মাৰে।": { native: "He hits her.", bases: { "তাক": "her", "মাৰে": "hits", "সি": "he; she" } }
  "as-2312":
    native: "keep; put"
    notes:
      "n1": "The verb is ৰাখা (rākhā), to keep something in a place."
    examples:
      "মই কিতাপ টেবুলত ৰাখোঁ।": { native: "I keep the book on the table.", bases: { "কিতাপ": "book", "টেবুলত": "on the table", "ৰাখোঁ": "keep", "মই": "I" } }
      "তেওঁ টকা ৰাখে।": { native: "He keeps money.", bases: { "টকা": "money", "ৰাখে": "keeps", "তেওঁ": "he; she (polite)" } }
  "as-2313":
    native: "dry"
    notes:
      "n1": "The verb is শুকুৱা (xukuwā), to dry in the sun or the wind."
    examples:
      "মই কাপোৰ শুকুৱাওঁ।": { native: "I dry the clothes.", bases: { "কাপোৰ": "clothes", "শুকুৱাওঁ": "dry", "মই": "I" } }
      "কাপোৰ শুকাল।": { native: "The clothes dried.", bases: { "কাপোৰ": "clothes", "শুকাল": "dried" } }
