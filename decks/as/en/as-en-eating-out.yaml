schema: 1
id: "as-en-eating-out"
kind: "layer"
core: "as-eating-out"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Eating out"
license: "CC0-1.0"
description: "Ordering, asking for less spice, Assam's everyday dishes, and paying the bill. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0407":
    native: "food; a meal"
    notes:
      "n1": "A careful word. In speech a meal is ভাত (bhāt), rice."
  "as-0111":
    notes:
      "n1": "In this deck: a meal. ভাত খালেনে? (bhat khalene?), 'have you eaten rice?', means 'have you eaten?', and is often asked as a greeting."
  "as-0408":
    native: "water"
    notes:
      "n1": "পানী খোৱা (pāni khuwā), to drink water: Assamese 'eats' water and tea."
  "as-0409":
    native: "tea"
    notes:
      "n1": "Assam tea is drunk with milk and sugar, গাখীৰ চাহ (gākhir sāh), or without milk as ৰঙা চাহ (rôṅā sāh), 'red tea'."
  "as-0410":
    native: "coffee"
  "as-0411":
    native: "I'd like …; I need …"
    notes:
      "n1": "'To me … is needed': মোক এগিলাচ পানী লাগে (muk egilās pāni lāge), I'd like a glass of water."
    bases:
      "মোক": "I"
  "as-0412":
    native: "more; and"
    notes:
      "n1": "আৰু অলপ (āru ôlôp), a little more. Between two nouns it is 'and': মাছ আৰু ভাত (mās āru bhāt), fish and rice."
  "as-0413":
    native: "hot (with chilli); spicy"
    notes:
      "n1": "জলা কম কৰিব (zôlā kôm koribô), less spicy, please. Assamese cooking uses few spices, and the heat often comes from a raw chilli on the side."
  "as-0414":
    native: "sweet"
  "as-0415":
    native: "sour; a sour curry"
    notes:
      "n1": "মাছৰ টেঙা (māsôr teṅā), a light, sour fish curry soured with tomato or lemon, is Assam's best-loved dish."
  "as-0416":
    native: "pitha (rice cakes)"
    notes:
      "n1": "Made of rice flour, sweet or plain, above all at Bihu: তিল পিঠা (til pithā) is rolled round sesame and jaggery."
  "as-0417":
    native: "vegetarian (food)"
    notes:
      "n1": "With meat or fish is আমিষ (āmix). Menus also say 'veg' and 'non-veg'."
  "as-0418":
    native: "The bill, please."
    bases:
      "বিলটো": "bill"
  "as-0419":
    native: "That was delicious."
    notes:
      "n1": "Literally 'it tasted very good': সোৱাদ (xuwād), taste."
    bases:
      "সোৱাদ": "taste"
  "as-0420":
    native: "Have you eaten? (respectful)"
    notes:
      "n1": "Asked as often as 'how are you?'. To a friend: ভাত খালানে? (bhat khalane?)."
