schema: 1
id: "as-en-script-conjuncts"
kind: "layer"
core: "as-script-conjuncts"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Assamese conjuncts"
license: "CC-BY-SA-4.0"
description: "Two consonants with no vowel between them are written joined. These are the ones a beginner meets first, each in an everyday word, with ৰ (rô) as a stroke below or a hook on top. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0085":
    native: "k + murdhonyo xo, said kkh"
    notes:
      "n1": "Looks nothing like its parts, and the Assamese alphabet counts it as a letter of its own. It is said 'kkh' inside a word, and 'kh' at the start: শিক্ষক (xikkhôk, teacher), ক্ষমা (khômā, forgiveness)."
    examples:
      "অক্ষৰ বহুত।": { native: "There are many letters.", bases: {  } }
      "অপেক্ষা কৰা": { native: "to wait", bases: { "অপেক্ষা": "waiting", "কৰা": "to do; to make" } }
  "as-0086":
    native: "j + ny, said gy"
    notes:
      "n1": "Looks nothing like its parts. It is said 'gy': জ্ঞান (gyān, knowledge)."
    examples:
      "অভিজ্ঞতা নাই।": { native: "There is no experience.", bases: {  } }
      "অভিজ্ঞতা বহুত।": { native: "There is a lot of experience.", bases: {  } }
  "as-0087":
    native: "k + t"
    notes:
      "n1": "ক (kô) and ত (tô) joined: ৰক্ত (rôktô, blood)."
    examples:
      "চুক্তি ঠিক।": { native: "The contract is right.", bases: {  } }
      "চুক্তি পঢ়া।": { native: "Read the contract.", bases: {  } }
  "as-0088":
    native: "k + the r-sign"
    notes:
      "n1": "A ৰ (rô) after a consonant is written as a stroke below it, the r-sign (ৰ-ফলা): ক্ৰিকেট (kriket, cricket)."
    examples:
      "আক্ৰমণ কৰা": { native: "to attack", bases: {  } }
      "আক্ৰমণ বেয়া।": { native: "The attack is bad.", bases: {  } }
  "as-0089":
    native: "p + the r-sign"
    notes:
      "n1": "The r-sign below প (pô): প্ৰেম (prem, love)."
    examples:
      "এইটো প্ৰাচীন।": { native: "This is ancient.", bases: {  } }
      "কামৰূপ প্ৰাচীন।": { native: "Kamarupa is ancient.", bases: {  } }
  "as-0090":
    native: "t + the r-sign"
    notes:
      "n1": "The r-sign below ত (tô): ছাত্ৰ (sātrô, student)."
    examples:
      "অভিনেত্ৰী আহিছে।": { native: "The actress has come.", bases: {  } }
      "আবেদনপত্ৰ লাগে।": { native: "An application form is needed.", bases: {  } }
  "as-0091":
    native: "b + the r-sign"
    notes:
      "n1": "The r-sign below ব (bô): ব্ৰহ্মপুত্ৰ (bromhoputro), the great river of Assam, which has ত্ৰ (trô) at its end as well."
    examples:
      "ফেব্ৰুৱাৰী এটা মাহ।": { native: "February is a month.", bases: {  } }
      "এইটো ফেব্ৰুৱাৰী মাহ।": { native: "This is the month of February.", bases: {  } }
  "as-0092":
    native: "the r-hook + m"
    notes:
      "n1": "A ৰ (rô) before another consonant is written as a small hook on top of it, the reph (ৰেফ): কৰ্ম (kôrmô, work; a deed), ধৰ্ম (dhôrmô, religion)."
    examples:
      "কৰ্মচাৰী উপস্থিত।": { native: "The staff are present.", bases: {  } }
      "কৰ্মী বহুত।": { native: "There are many workers.", bases: {  } }
  "as-0093":
    native: "n + t"
    notes:
      "n1": "ন (nô) and ত (tô) joined: শান্ত (xāntô, calm; quiet)."
    examples:
      "এইটো সিদ্ধান্ত।": { native: "This is the decision.", bases: {  } }
      "চিন্তা কৰা": { native: "to worry", bases: {  } }
  "as-0094":
    native: "n + d"
    notes:
      "n1": "ন (nô) and দ (dô) joined: সুন্দৰ (xundôr, beautiful)."
    examples:
      "আনন্দ পোৱা": { native: "to feel joy", bases: { "পোৱা": "to get; to receive" } }
      "উদ্যান সুন্দৰ।": { native: "The park is beautiful.", bases: { "সুন্দৰ": "beautiful" } }
  "as-0095":
    native: "s + t"
    notes:
      "n1": "Before t, স (xô) is said 's', not x: ৰাস্তা (rāstā, road)."
    examples:
      "ৰাস্তাত": { native: "on the road", bases: {  } }
      "এইটো সস্তা।": { native: "This is cheap.", bases: {  } }
  "as-0096":
    native: "s + th"
    notes:
      "n1": "স (xô) and থ (thô) joined, with স (xô) said 's': স্থান (sthān, place)."
    examples:
      "এইটো স্বাস্থ্যকৰ।": { native: "This is healthy.", bases: {  } }
      "এতিয়া সুস্থ।": { native: "Now he is well.", bases: {  } }
  "as-0097":
    native: "s + k"
    notes:
      "n1": "স (xô) and ক (kô) joined, with স (xô) said 's': নমস্কাৰ (nômôskār, hello), স্কুল (skul, school)."
    examples:
      "অতিথিক নমস্কাৰ।": { native: "Greetings to the guest.", bases: {  } }
      "পুৰস্কাৰ ডাঙৰ।": { native: "The prize is big.", bases: {  } }
  "as-0098":
    native: "murdhonyo xo + t, said st"
    notes:
      "n1": "Assamese writes the st of English words with ষ্ট (stô): ষ্টেচন (stesôn, station). Before t it is said 's'."
    examples:
      "কষ্ট নাই।": { native: "There is no discomfort.", bases: {  } }
      "চেষ্টা কৰা": { native: "to try", bases: { "চেষ্টা": "attempt", "কৰা": "to do; to make" } }
  "as-0099":
    native: "ny + s, said ns"
    notes:
      "n1": "ঞ (ñô) and চ (sô) joined, said 'ns', since চ (sô) is s: পঞ্চাশ (pônsāx, fifty)."
    examples:
      "জলসিঞ্চন বহুত।": { native: "There is a lot of irrigation.", bases: {  } }
      "জলসিঞ্চন ভাল।": { native: "Irrigation is good.", bases: {  } }
  "as-0100":
    native: "ng + k"
    notes:
      "n1": "ঙ (ṅô) and ক (kô) joined: অঙ্ক (ôṅkô, sum; maths)."
  "as-0101":
    native: "l + p"
    notes:
      "n1": "ল (lô) and প (pô) joined: গল্প (gôlpô, story)."
    examples:
      "গল্প ভাল।": { native: "The story is good.", bases: {  } }
      "গল্প শুনা।": { native: "To hear a story.", bases: {  } }
  "as-0102":
    native: "b + the y-sign"
    notes:
      "n1": "A য (zô) after a consonant is written as the y-sign (য-ফলা): ব্যস্ত (byôstô, busy)."
    examples:
      "কৃষক ব্যস্ত।": { native: "The farmer is busy.", bases: {  } }
      "কৰ্তব্য ডাঙৰ।": { native: "The duty is big.", bases: {  } }
  "as-0103":
    native: "n + n"
    notes:
      "n1": "Two ন (nô) joined: ভিন্ন (bhinnô, different). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    examples:
      "উন্নতি বহুত।": { native: "There is a lot of progress.", bases: {  } }
      "উন্নতি ভাল।": { native: "The progress is good.", bases: {  } }
  "as-0104":
    native: "t + t"
    notes:
      "n1": "Two ত (tô) joined: উত্তৰ (uttôr, answer; north). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    examples:
      "আবৃত্তি কৰা": { native: "to recite", bases: { "আবৃত্তি": "recitation" } }
      "উত্তৰ ঠিক।": { native: "The answer is right.", bases: {  } }
  "as-0105":
    native: "d + dh"
    notes:
      "n1": "দ (dô) and ধ (dhô) joined: যুদ্ধ (zuddhô, war). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    examples:
      "উদ্ধাৰ কৰা": { native: "to rescue", bases: {  } }
      "উদ্ধাৰ ভাল।": { native: "The rescue is good.", bases: {  } }
  "as-0106":
    native: "l + l"
    notes:
      "n1": "Two ল (lô) joined, one above the other: ষোল্ল (xullô, sixteen), চল্লিশ (sollix, forty). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    examples:
      "এইটো চল্লিশ টকা।": { native: "This is forty rupees.", bases: {  } }
      "মোৰ চল্লিশ টকা আছে।": { native: "I have forty rupees.", bases: { "আছে": "to be; to have" } }
  "as-0107":
    native: "b + b"
    notes:
      "n1": "Two ব (bô) joined: নব্বৈ (nôbbôi, ninety). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    examples:
      "মোৰ নব্বৈ টকা আছে।": { native: "I have ninety rupees.", bases: { "আছে": "to be; to have" } }
      "এইটো নব্বৈ টকা।": { native: "This is ninety rupees.", bases: {  } }
  "as-7500":
    native: "n + dh, said ndh"
    notes:
      "n1": "ন (nô) and ধ (dhô) joined: অন্ধকাৰ (ôndhôkār, dark), and কান্ধ (kāndh, shoulder). Said 'ndh' inside a word."
    examples:
      "এইটো কান্ধ।": { native: "This is a shoulder.", bases: {  } }
      "ঘৰ অন্ধকাৰ।": { native: "The house is dark.", bases: {  } }
  "as-7501":
    native: "g + the r-sign"
    notes:
      "n1": "The r-sign below গ (gô), still said r: আগ্ৰহ (āgrôh, interest; eagerness)."
    examples:
      "আগ্ৰহ ভাল।": { native: "Interest is good.", bases: {  } }
      "মোৰ আগ্ৰহ বহুত।": { native: "I have a lot of interest.", bases: {  } }
  "as-7502":
    native: "d + y, said dy"
    notes:
      "n1": "দ (dô) and য (zô) joined, said 'dy' in these words: উদ্যান (udyān, garden; park) and খাদ্য (khādy, food)."
    examples:
      "এইটো উদ্যান।": { native: "This is a park.", bases: {  } }
      "খাদ্য ভাল।": { native: "The food is good.", bases: {  } }
  "as-7503":
    native: "the r-hook + y"
    notes:
      "n1": "A ৰ (rô) before য (zô) is the reph on top of the য: পৰ্যটক (pôrzôtôk, tourist) and ধৈৰ্য (dhôirz, patience)."
    examples:
      "এইটো পৰ্যটক।": { native: "This is a tourist.", bases: {  } }
      "ধৈৰ্য বহুত।": { native: "There is a lot of patience.", bases: {  } }
  "as-7504":
    native: "t + y, said ty"
    notes:
      "n1": "ত (tô) and য (zô) joined, said 'ty' in this word: উপত্যকা (upôtyôkā, valley)."
    examples:
      "এইটো উপত্যকা।": { native: "This is a valley.", bases: {  } }
      "উপত্যকা ডাঙৰ।": { native: "The valley is big.", bases: {  } }
  "as-7505":
    native: "the r-hook + j"
    notes:
      "n1": "The reph on top of জ (zô): গীৰ্জা (girzā, church), written with the reph and said 'rz'."
    examples:
      "এইটো গীৰ্জা।": { native: "This is a church.", bases: {  } }
      "গীৰ্জা ডাঙৰ।": { native: "The church is big.", bases: {  } }
  "as-7506":
    native: "n + d, murdhonyo"
    notes:
      "n1": "ণ (nô, the murdhonyo no) and ড (dô) joined: মণ্ডপ (môndôp, pavilion; wedding stage)."
    examples:
      "এইটো মণ্ডপ।": { native: "This is a pavilion.", bases: {  } }
      "মণ্ডপ ডাঙৰ।": { native: "The pavilion is big.", bases: {  } }
  "as-7507":
    native: "bh + the r-sign"
    notes:
      "n1": "ভ (bhô) with the r-sign, a ৰ (rô) stroke below: ভ্ৰমণ (bhrômôn, trip; travel; a tour)."
    examples:
      "এইটো ভ্ৰমণ।": { native: "This is a trip.", bases: {  } }
      "ভ্ৰমণ ভাল।": { native: "The trip is good.", bases: {  } }
  "as-7508":
    native: "the r-hook + b"
    notes:
      "n1": "The reph on top of ব (bô): গৰ্ব (gôrb, pride) and নিৰ্বাচন (nirbāsôn, election)."
    examples:
      "গৰ্ব বেয়া।": { native: "Pride is bad.", bases: {  } }
      "এইটো নিৰ্বাচন।": { native: "This is an election.", bases: {  } }
  "as-7509":
    native: "n + t, murdhonyo"
    notes:
      "n1": "ণ (nô, the murdhonyo no) and ট (tô) joined: কাউণ্টাৰ (kāuntār, counter) and ইণ্টাৰনেট (intārônet, internet)."
    examples:
      "এইটো কাউণ্টাৰ।": { native: "This is a counter.", bases: {  } }
      "ইণ্টাৰনেট ভাল।": { native: "The internet is good.", bases: {  } }
  "as-7510":
    native: "the r-hook + x"
    notes:
      "n1": "The reph on top of শ (xô): দৰ্শক (dôrxôk, viewer; audience)."
    examples:
      "এইটো দৰ্শক।": { native: "This is a viewer.", bases: {  } }
      "দৰ্শক বহুত।": { native: "There are many viewers.", bases: {  } }
  "as-7511":
    native: "the r-hook + k"
    notes:
      "n1": "The reph on top of ক (kô): পাৰ্ক (pārk, park), and সতৰ্ক (xôtôrk, careful; cautious) in the same pattern."
    examples:
      "এইটো পাৰ্ক।": { native: "This is a park.", bases: {  } }
      "সতৰ্ক ভাল।": { native: "Being careful is good.", bases: {  } }
  "as-7512":
    native: "m + b"
    notes:
      "n1": "ম (mô) and ব (bô) joined: কম্বল (kômbôl, blanket) and নম্বৰ (nômbôr, marks; score)."
    examples:
      "এইটো কম্বল।": { native: "This is a blanket.", bases: {  } }
      "নম্বৰ ভাল।": { native: "The marks are good.", bases: {  } }
  "as-7513":
    native: "m + bh"
    notes:
      "n1": "ম (mô) and ভ (bhô) joined: আৰম্ভ (ārômbhô, beginning; start)."
    examples:
      "এইটো আৰম্ভ।": { native: "This is a beginning.", bases: {  } }
      "আৰম্ভ ভাল।": { native: "The beginning is good.", bases: {  } }
  "as-7514":
    native: "k + l"
    notes:
      "n1": "ক (kô) and ল (lô) joined: ক্লাব (klābô, club) and ক্লান্ত (klānt, tired)."
    examples:
      "এইটো ক্লাব।": { native: "This is a club.", bases: {  } }
      "মই ক্লান্ত।": { native: "I am tired.", bases: {  } }
  "as-7515":
    native: "m + p"
    notes:
      "n1": "ম (mô) and প (pô) joined: কম্পিউটাৰ (kompiutār, computer) and ভূমিকম্প (bhumikômp, earthquake)."
    examples:
      "এইটো কম্পিউটাৰ।": { native: "This is a computer.", bases: {  } }
      "ভূমিকম্প বেয়া।": { native: "Earthquakes are bad.", bases: {  } }
  "as-7516":
    native: "n + m"
    notes:
      "n1": "ন (nô) and ম (mô) joined: জন্ম (zônm, birth) and সন্মান (xônmān, respect)."
    examples:
      "এইটো সন্মান।": { native: "This is respect.", bases: {  } }
      "মোৰ জন্ম।": { native: "This is my birth.", bases: {  } }
  "as-7517":
    native: "the r-hook + d"
    notes:
      "n1": "The reph on top of ড (dô): কাৰ্ড (kārd, card)."
    examples:
      "এইটো কাৰ্ড।": { native: "This is a card.", bases: {  } }
      "কাৰ্ড ভাল।": { native: "The card is good.", bases: {  } }
  "as-7518":
    native: "k + s"
    notes:
      "n1": "ক (kô) and স (xô) joined: ৰিক্সা (riksā, cycle rickshaw)."
    examples:
      "এইটো ৰিক্সা।": { native: "This is a rickshaw.", bases: {  } }
      "ৰিক্সা বহুত।": { native: "There are many rickshaws.", bases: {  } }
  "as-7519":
    native: "l + t"
    notes:
      "n1": "ল (lô) and ট (tô) joined: বাল্টি (bālti, bucket)."
    examples:
      "এইটো বাল্টি।": { native: "This is a bucket.", bases: {  } }
      "বাল্টি ডাঙৰ।": { native: "The bucket is big.", bases: {  } }
  "as-7520":
    native: "z + b"
    notes:
      "n1": "জ (zô) and ব (bô) joined: জ্বৰ (zôr, fever)."
    examples:
      "জ্বৰ বেয়া।": { native: "Fever is bad.", bases: {  } }
      "এইটো জ্বৰ।": { native: "This is a fever.", bases: {  } }
  "as-7521":
    native: "p + l"
    notes:
      "n1": "প (pô) and ল (lô) joined: প্লাষ্টিক (plāxtik, plastic) and প্লেটফৰ্ম (pletôphôrm, platform)."
    examples:
      "এইটো প্লাষ্টিক।": { native: "This is plastic.", bases: {  } }
      "প্লেটফৰ্ম ডাঙৰ।": { native: "The platform is big.", bases: {  } }
  "as-7522":
    native: "n + y"
    notes:
      "n1": "ন (nô) and য (zô) joined, said 'ny': উপন্যাস (upônyāx, novel) and ন্যায় (nyāy, justice; fairness)."
    examples:
      "এইটো উপন্যাস।": { native: "This is a novel.", bases: {  } }
      "ন্যায় ভাল।": { native: "Justice is good.", bases: {  } }
  "as-7523":
    native: "dh + y"
    notes:
      "n1": "ধ (dhô) and য (zô) joined, said 'dhy': অধ্যায় (ôdhyāy, chapter)."
    examples:
      "এইটো অধ্যায়।": { native: "This is a chapter.", bases: {  } }
      "অধ্যায় ভাল।": { native: "The chapter is good.", bases: {  } }
  "as-7524":
    native: "the r-hook + n, murdhonyo"
    notes:
      "n1": "The reph on top of ণ (nô, the murdhonyo no): পূৰ্ণিমা (purnimā, full moon)."
    examples:
      "এইটো পূৰ্ণিমা।": { native: "This is the full moon.", bases: {  } }
      "পূৰ্ণিমা ভাল।": { native: "The full moon is good.", bases: {  } }
