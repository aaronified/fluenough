schema: 1
id: "as-en-script-conjuncts"
kind: "layer"
core: "as-script-conjuncts"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Assamese conjuncts"
license: "CC0-1.0"
description: "Two consonants with no vowel between them are written joined. These are the ones a beginner meets first, each in an everyday word, with ৰ (rô) as a stroke below or a hook on top. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0085":
    native: "k + murdhonyo xo, said kkh"
    notes:
      "n1": "Looks nothing like its parts, and the Assamese alphabet counts it as a letter of its own. It is said 'kkh' inside a word, and 'kh' at the start: শিক্ষক (xikkhôk, teacher), ক্ষমা (khômā, forgiveness)."
  "as-0086":
    native: "j + ny, said gy"
    notes:
      "n1": "Looks nothing like its parts. It is said 'gy': জ্ঞান (gyān, knowledge)."
  "as-0087":
    native: "k + t"
    notes:
      "n1": "ক (kô) and ত (tô) joined: ৰক্ত (rôktô, blood)."
  "as-0088":
    native: "k + the r-sign"
    notes:
      "n1": "A ৰ (rô) after a consonant is written as a stroke below it, the r-sign (ৰ-ফলা): ক্ৰিকেট (kriket, cricket)."
  "as-0089":
    native: "p + the r-sign"
    notes:
      "n1": "The r-sign below প (pô): প্ৰেম (prem, love)."
  "as-0090":
    native: "t + the r-sign"
    notes:
      "n1": "The r-sign below ত (tô): ছাত্ৰ (sātrô, student)."
  "as-0091":
    native: "b + the r-sign"
    notes:
      "n1": "The r-sign below ব (bô): ব্ৰহ্মপুত্ৰ (bromhoputro), the great river of Assam, which has ত্ৰ (trô) at its end as well."
  "as-0092":
    native: "the r-hook + m"
    notes:
      "n1": "A ৰ (rô) before another consonant is written as a small hook on top of it, the reph (ৰেফ): কৰ্ম (kôrmô, work; a deed), ধৰ্ম (dhôrmô, religion)."
  "as-0093":
    native: "n + t"
    notes:
      "n1": "ন (nô) and ত (tô) joined: শান্ত (xāntô, calm; quiet)."
  "as-0094":
    native: "n + d"
    notes:
      "n1": "ন (nô) and দ (dô) joined: সুন্দৰ (xundôr, beautiful)."
  "as-0095":
    native: "s + t"
    notes:
      "n1": "Before t, স (xô) is said 's', not x: ৰাস্তা (rāstā, road)."
  "as-0096":
    native: "s + th"
    notes:
      "n1": "স (xô) and থ (thô) joined, with স (xô) said 's': স্থান (sthān, place)."
  "as-0097":
    native: "s + k"
    notes:
      "n1": "স (xô) and ক (kô) joined, with স (xô) said 's': নমস্কাৰ (nômôskār, hello), স্কুল (skul, school)."
  "as-0098":
    native: "murdhonyo xo + t, said st"
    notes:
      "n1": "Assamese writes the st of English words with ষ্ট (stô): ষ্টেচন (stesôn, station). Before t it is said 's'."
  "as-0099":
    native: "ny + s, said ns"
    notes:
      "n1": "ঞ (ñô) and চ (sô) joined, said 'ns', since চ (sô) is s: পঞ্চাশ (pônsāx, fifty)."
  "as-0100":
    native: "ng + k"
    notes:
      "n1": "ঙ (ṅô) and ক (kô) joined: অঙ্ক (ôṅkô, sum; maths)."
  "as-0101":
    native: "l + p"
    notes:
      "n1": "ল (lô) and প (pô) joined: গল্প (gôlpô, story)."
  "as-0102":
    native: "b + the y-sign"
    notes:
      "n1": "A য (zô) after a consonant is written as the y-sign (য-ফলা): ব্যস্ত (byôstô, busy)."
  "as-0103":
    native: "n + n"
    notes:
      "n1": "Two ন (nô) joined: ভিন্ন (bhinnô, different). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "as-0104":
    native: "t + t"
    notes:
      "n1": "Two ত (tô) joined: উত্তৰ (uttôr, answer; north). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "as-0105":
    native: "d + dh"
    notes:
      "n1": "দ (dô) and ধ (dhô) joined: যুদ্ধ (zuddhô, war). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "as-0106":
    native: "l + l"
    notes:
      "n1": "Two ল (lô) joined, one above the other: ষোল্ল (xullô, sixteen), চল্লিশ (sollix, forty). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "as-0107":
    native: "b + b"
    notes:
      "n1": "Two ব (bô) joined: নব্বৈ (nôbbôi, ninety). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
