schema: 1
id: "as-en-agriculture"
kind: "layer"
core: "as-agriculture"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Agriculture: farms, crops and the harvest"
license: "CC-BY-SA-4.0"
description: "The farm and the crop: the field and the plough, the seed and the harvest, and the market where the crop is sold. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3530":
    native: "crop; grain"
    notes:
      "n1": "The food plants grown on a farm, such as rice, pulses or mustard."
    examples:
      "শস্য ভাল।": "The crop is good."
      "শস্য বহুত।": "There is a good crop."
  "as-3531":
    native: "harvest; the crop in the field"
    notes:
      "n1": "What is gathered from the fields at the end of the season."
    examples:
      "ফচল ভাল।": "The harvest is good."
      "ফচল ওলাল।": "The crop has come up."
  "as-3532":
    native: "field (for crops)"
    notes:
      "n1": "A piece of land for growing rice or vegetables."
    examples:
      "খেতত ধান।": { native: "Paddy in the field.", bases: { "খেতত": "field (for crops)" } }
      "খেত বহল।": "The field is wide."
  "as-3533":
    native: "plough"
    notes:
      "n1": "The tool pulled by oxen to turn the soil."
    examples:
      "হাল নতুন।": "The plough is new."
      "হাল বোৱা।": { native: "To plough.", bases: { "বোৱা": "to plough" } }
  "as-3534":
    native: "plough (wooden)"
    notes:
      "n1": "The wooden plough used on a farm. Also হাল (hāl)."
    examples:
      "লাঙল ডাঙৰ।": "The plough is big."
      "লাঙল ভাৰী।": "The plough is heavy."
  "as-3535":
    native: "ox; bullock"
    notes:
      "n1": "A male cow used to pull the plough."
    examples:
      "বলদ শক্ত।": "The ox is strong."
      "বলদ খেতত।": "The ox is in the field."
  "as-3536":
    native: "irrigation"
    notes:
      "n1": "Giving water to the fields by channels or pumps."
    examples:
      "জলসিঞ্চন ভাল।": "Irrigation is good."
      "জলসিঞ্চন বহুত।": "There is a lot of irrigation."
  "as-3537":
    native: "agriculture; farming"
    notes:
      "n1": "The work of growing crops and rearing animals."
    examples:
      "কৃষি ভাল।": "Farming is good."
      "কৃষি কৰা।": "To farm."
  "as-3538":
    native: "farmer (formal)"
    notes:
      "n1": "The formal word for a farmer; in speech খেতিয়ক (khetiyôk)."
    examples:
      "কৃষক ব্যস্ত।": "The farmer is busy."
      "কৃষক আহিছে।": "The farmer has come."
  "as-3539":
    native: "production; yield"
    notes:
      "n1": "How much a field or a factory produces."
    examples:
      "উৎপাদন বেছি।": "The production is high."
      "উৎপাদন কম।": "The production is low."
  "as-3540":
    native: "granary; grain store"
    notes:
      "n1": "A store-house for rice and grain after the harvest."
    examples:
      "ভঁড়াল ভৰা।": "The granary is full."
      "ভঁড়াল ডাঙৰ।": "The granary is big."
  "as-3541":
    native: "market yard; wholesale market"
    notes:
      "n1": "A big market where farmers sell their crops."
    examples:
      "মণ্ডি বহুত ডাঙৰ।": "The market yard is very big."
      "মণ্ডিত দাম বেছি।": { native: "The price is high at the market yard.", bases: { "মণ্ডিত": "market yard; wholesale market" } }
  "as-3542":
    native: "to farm"
    notes:
      "n1": "To grow crops in the fields."
    bases:
      "খেতি": "farming"
    examples:
  "as-3543":
    native: "to plough"
    notes:
      "n1": "To turn the soil with a plough."
    bases:
      "বোৱা": "to plough"
    examples:
  "as-3544":
    native: "to plant"
    notes:
      "n1": "To put young plants or seeds into the soil."
    examples:
