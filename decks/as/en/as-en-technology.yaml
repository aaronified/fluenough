schema: 1
id: "as-en-technology"
kind: "layer"
core: "as-technology"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Technology: computers, apps and the internet"
license: "CC-BY-SA-4.0"
description: "The machines and the internet we use every day: the website, the screen, the keyboard, the download and the password. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3431":
    native: "website"
    notes:
      "n1": "A place on the internet with pages of words and pictures. Written as said in English."
    examples:
      "ৱেবছাইট ভাল।": "The website is good."
      "ৱেবছাইট খোলা।": "Open the website."
  "as-3432":
    native: "screen"
    notes:
      "n1": "The flat glass part of a phone or a computer where you see things. Written as said in English."
    examples:
      "স্ক্ৰীন ডাঙৰ।": "The screen is big."
      "স্ক্ৰীন ভাঙিল।": "The screen broke."
  "as-3433":
    native: "keyboard"
    notes:
      "n1": "The row of keys you press to write. Written as said in English."
    examples:
      "কীবৰ্ড নতুন।": "The keyboard is new."
      "কীবৰ্ড ঠিক।": "The keyboard is right."
  "as-3434":
    native: "mouse"
    notes:
      "n1": "The small device you move on the desk to point at the screen. Written as said in English."
    examples:
      "মাউচ কাম কৰে।": "The mouse works."
      "মাউচ নাই।": "There is no mouse."
  "as-3435":
    native: "software; programme"
    notes:
      "n1": "The programmes that make a computer work. Written as said in English."
    examples:
      "ছফ্টৱেৰ নতুন।": "The software is new."
      "ছফ্টৱেৰ ভাল।": "The software is good."
  "as-3436":
    native: "hardware; machine parts"
    notes:
      "n1": "The parts of a computer you can touch. Written as said in English."
    examples:
      "হাৰ্ডৱেৰ ভাল।": "The hardware is good."
      "হাৰ্ডৱেৰ বেয়া।": "The hardware is bad."
  "as-3437":
    native: "download"
    notes:
      "n1": "Copying a file from the internet to your device. Written as said in English. To download: ডাউনলোড কৰা (dāunlod kôrā)."
    examples:
      "ডাউনলোড হ'ল।": { native: "The download is done.", bases: { "হ'ল": "to become; to be" } }
      "ডাউনলোড বহুত।": "There are many downloads."
  "as-3438":
    native: "upload"
    notes:
      "n1": "Sending a file from your device to the internet. Written as said in English."
    examples:
      "আপলোড কৰা।": "To upload."
      "আপলোড ভাল।": "The upload is good."
  "as-3439":
    native: "charger"
    notes:
      "n1": "The plug and cable that fill up a phone's battery. Written as said in English."
    examples:
      "চাৰ্জাৰ আছে।": { native: "There is a charger.", bases: { "আছে": "to be; there is; to have" } }
      "চাৰ্জাৰ নাই।": "There is no charger."
  "as-3440":
    native: "information; data"
    notes:
      "n1": "Facts and figures stored or sent."
    examples:
      "তথ্য ঠিক।": "The information is right."
      "তথ্য বহুত।": "There is a lot of information."
  "as-3441":
    native: "virus (computer)"
    notes:
      "n1": "A harmful programme that can damage a computer. Written as said in English."
    examples:
      "ভাইৰাছ আছে।": { native: "There is a virus.", bases: { "আছে": "to be; there is; to have" } }
      "ভাইৰাছ বেয়া।": "The virus is bad."
  "as-3442":
    native: "safety; security"
    notes:
      "n1": "Keeping information and people safe."
    examples:
      "সুৰক্ষা ভাল।": "The security is good."
      "সুৰক্ষা বহুত দৰকাৰ।": "Security is very much needed."
  "as-3443":
    native: "connection"
    notes:
      "n1": "The link between a device and the internet or another device."
    examples:
      "সংযোগ নাই।": "There is no connection."
      "সংযোগ ভাল।": "The connection is good."
  "as-3444":
    native: "technology"
    notes:
      "n1": "The use of science and machines in everyday life."
    examples:
      "প্ৰযুক্তি ভাল।": "Technology is good."
      "প্ৰযুক্তি বহুত।": "There is a lot of technology."
  "as-3445":
    native: "digital"
    notes:
      "n1": "Of a thing stored or shown by electronic means. Written as said in English."
    examples:
      "ডিজিটেল কিতাপ।": "A digital book."
      "এইটো ডিজিটেল।": "This is digital."
  "as-3446":
    native: "offline"
    notes:
      "n1": "Not connected to the internet. The opposite is অনলাইন (ônlāin)."
    examples:
      "অফলাইনত কাম কৰোঁ।": { native: "I work offline.", bases: { "অফলাইনত": "offline" } }
      "ফোন অফলাইন।": "The phone is offline."
  "as-3447":
    native: "to charge (a battery)"
    notes:
      "n1": "To fill a phone or a battery with power."
  "as-3448":
    native: "to upload"
    notes:
      "n1": "To send a file to the internet."
