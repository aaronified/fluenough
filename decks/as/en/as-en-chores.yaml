schema: 1
id: "as-en-chores"
kind: "layer"
core: "as-chores"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Chores"
license: "CC-BY-SA-4.0"
description: "The housework: sweeping, washing the dishes and the clothes, fetching water, and sharing the work at home. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-2845":
    native: "domestic; of the house"
    notes:
      "n1": "Of the house and its work: ঘৰুৱা কাম (ghôruwā kām), housework."
    examples:
      "ঘৰুৱা কাম বহুত।": "There is a lot of housework."
      "এইটো ঘৰুৱা কাম।": "This is housework."
  "as-2846":
    native: "broom"
    notes:
      "n1": "A broom of grass or of straw, to sweep the floor."
    examples:
      "ঝাৰু নতুন।": "The broom is new."
      "ঝাৰু ৰাখা।": "Put the broom away."
  "as-2847":
    native: "to wipe; to sweep"
    notes:
      "n1": "To wipe a table or to sweep the floor with a broom."
    examples:
      "মই মেজ মচোঁ।": { native: "I wipe the table.", bases: { "মচোঁ": "to wipe; to sweep" } }
      "তাই মচে।": { native: "She wipes.", bases: { "মচে": "to wipe; to sweep" } }
  "as-2848":
    native: "utensils; dishes"
    notes:
      "n1": "The pots, plates and cups used to cook and eat."
    examples:
      "বাচন বহুত।": "There are a lot of dishes."
      "বাচন ময়লা।": "The dishes are dirty."
  "as-2849":
    native: "rubbish; waste"
    notes:
      "n1": "Things thrown away from the house."
    examples:
      "আবৰ্জনা বহুত।": "There is a lot of rubbish."
      "আবৰ্জনা পেলোৱা।": "Throw the rubbish away."
  "as-2850":
    native: "to throw away"
    notes:
      "n1": "To throw out something no longer wanted."
    examples:
      "পুৰণি কাপোৰ পেলাওঁ।": { native: "I throw away the old clothes.", bases: { "পেলাওঁ": "to throw away" } }
      "তেওঁ আবৰ্জনা পেলাব।": { native: "He will throw away the rubbish.", bases: { "পেলাব": "to throw away" } }
  "as-2851":
    native: "responsibility; duty"
    notes:
      "n1": "The work that is yours to do."
    examples:
      "এইটো মোৰ দায়িত্ব।": "This is my responsibility."
      "দায়িত্ব বহুত।": "There is a lot of responsibility."
  "as-2852":
    native: "share; part"
    notes:
      "n1": "One part of the work or of food, given to each person."
    examples:
      "মোৰ ভাগ কিমান?": "How much is my share?"
      "ভাগ সমান।": "The shares are equal."
  "as-2853":
    native: "equal; the same"
    notes:
      "n1": "The same amount for each person."
    examples:
      "সকলো সমান।": "Everyone is equal."
      "ভাগ সমান।": "The shares are equal."
  "as-2854":
    native: "to make the bed"
    notes:
      "n1": "To spread the sheet and blanket on the bed."
    examples:
  "as-2855":
    native: "to wash the dishes"
    notes:
      "n1": "The daily chore after the meal."
    examples:
  "as-2856":
    native: "to wash the clothes"
    notes:
      "n1": "Clothes are washed in the river, the pond or a bucket."
    examples:
  "as-2857":
    native: "to fetch water"
    notes:
      "n1": "To bring water from the well or the tap."
    examples:
  "as-2858":
    native: "to clean the house"
    notes:
      "n1": "To make the house clean."
    examples:
  "as-2859":
    native: "to dry the clothes"
    notes:
      "n1": "To hang the washed clothes in the sun to dry."
    examples:
  "as-2860":
    native: "to wipe the dust"
    notes:
      "n1": "To remove the dust from a table or a shelf."
    examples:
  "as-2861":
    native: "to clean the garden"
    notes:
      "n1": "To cut the weeds and clear the garden."
    examples:
  "as-2862":
    native: "to milk the cow"
    notes:
      "n1": "To milk a cow or a goat."
    bases:
      "দোৱা": "to milk"
