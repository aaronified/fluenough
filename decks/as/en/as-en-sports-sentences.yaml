cards:
  "as-3736":
    native: "The captain scored a goal."
    notes:
      "n1": "দিলে (dile) is the past 'he, she' form of দিয়া (diyā), 'to give': the stem দি- (di-) takes -লে (-le). The doer দলনায়ক (dôlônāyôk), captain, comes first."
    confusables:
      "c1": { why: "The coach, not the scorer." }
      "c2": { why: "The referee, who watches the goal." }
  "as-3737":
    native: "We won."
    notes:
      "n1": "জিকিলোঁ (zikilum̐) is the past 'I, we' form of জিকা (zikā), 'to win': the stem জিক- (zik-) loses the -া (-ā) and takes -িলোঁ (-ilum̐). আমি (āmi) means 'we'."
    confusables:
      "c1": { why: "The past of lose, the opposite." }
      "c2": { why: "To lose, the opposite of win." }
  "as-3738":
    native: "He got a gold medal."
    notes:
      "n1": "তেওঁ (teum̐) is the respectful 'he or she'. পালে (pāle) is the past of পোৱা (puwā), 'to get': the stem becomes পা- (pā-)."
    bases:
      "পালে": "to get; to receive"
    confusables:
      "c1": { why: "Silver, a lower medal." }
      "c2": { why: "The coach, not the medal." }
  "as-3739":
    native: "I like cricket."
    notes:
      "n1": "ভাল লাগে (bhāl lāge) is literally 'good is felt': the thing liked comes first, here ক্ৰিকেট (kriket), and the person who likes it can be left out or shown as মোৰ (mur), 'my, to me'."
    confusables:
      "c1": { why: "Football, a different game." }
      "c2": { why: "Volleyball, a different game." }
  "as-3740":
    native: "A new record."
    confusables:
      "c1": { why: "Old, the opposite of new." }
      "c2": { why: "A medal, a different prize." }
  "as-3741":
    native: "The referee has come."
    notes:
      "n1": "আহিছে (āhise) is from অহা (ôhā), 'to come', whose stem changes to আহ- (āh-). ৰেফাৰী (rephāri), referee, comes first."
    confusables:
      "c1": { why: "A player, on the field." }
      "c2": { why: "The captain, a team leader." }
  "as-3742":
    native: "The race is good."
    confusables:
      "c1": { why: "A game, a wider idea." }
      "c2": { why: "Sport, a wider idea." }
  "as-3743":
    native: "She is winning."
    notes:
      "n1": "তাই (tāi) is the plain 'she'; the respectful word is তেওঁ (teum̐). জিকিছে (zikise) is জিক- (zik-), the stem of জিকা (zikā), 'to win', plus -িছে (-ise)."
    confusables:
      "c1": { why: "The perfect of lose, the opposite." }
      "c2": { why: "A player of an instrument, not a sportswoman." }
