schema: 1
id: "as-en-law"
kind: "layer"
core: "as-law"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Law: police, courts, rights and the rules"
license: "CC-BY-SA-4.0"
description: "The law and the people who keep it: the crime and the judge, the evidence and the case, the right and the duty. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3856":
    native: "law"
    notes:
      "n1": "The rules a country makes and everyone must follow."
    examples:
      "আইন ঠিক।": "The law is right."
      "আইন মানা।": { native: "To obey the law.", bases: { "মানা": "to obey; to accept" } }
  "as-3857":
    native: "crime; offence"
    notes:
      "n1": "An act that the law forbids."
    examples:
      "অপৰাধ বেয়া।": "Crime is bad."
      "অপৰাধ হ'ল।": { native: "A crime was committed.", bases: { "হ'ল": "to become; to be" } }
  "as-3858":
    native: "criminal; offender"
    notes:
      "n1": "A person who has committed a crime."
    examples:
      "অপৰাধী ধৰা পৰিল।": "The criminal was caught."
      "অপৰাধী বহুত।": "There are many criminals."
  "as-3859":
    native: "judge"
    notes:
      "n1": "The person who decides a case in a court."
    examples:
      "বিচাৰক আহিছে।": "The judge has come."
      "বিচাৰক ভাল।": "The judge is good."
  "as-3860":
    native: "evidence; testimony"
    notes:
      "n1": "What a witness says or what proves a fact in court."
    examples:
      "সাক্ষ্য আছে।": { native: "There is evidence.", bases: { "আছে": "to be; there is; to have" } }
      "সাক্ষ্য দিয়া।": "To give evidence."
  "as-3861":
    native: "right (legal or moral)"
    notes:
      "n1": "What a person is allowed to have or do by law."
    examples:
      "অধিকাৰ আছে।": { native: "There is a right.", bases: { "আছে": "to be; there is; to have" } }
      "মোৰ অধিকাৰ।": "It is my right."
  "as-3862":
    native: "duty"
    notes:
      "n1": "What a person must do by law or by conscience."
    examples:
      "কৰ্তব্য ডাঙৰ।": "The duty is big."
      "এইটো মোৰ কৰ্তব্য।": "This is my duty."
  "as-3863":
    native: "punishment; penalty"
    notes:
      "n1": "What the court orders as a result of a crime."
    examples:
      "দণ্ড হ'ল।": { native: "A punishment was given.", bases: { "হ'ল": "to become; to be" } }
      "দণ্ড বেছি।": "The punishment is high."
  "as-3864":
    native: "bail"
    notes:
      "n1": "Money or a promise that lets an accused person go free until the trial."
    examples:
      "জামিন পালে।": { native: "He got bail.", bases: { "পালে": "to get; to receive" } }
      "জামিন লাগে।": "Bail is needed."
  "as-3865":
    native: "case (in court)"
    notes:
      "n1": "A legal matter brought before a court."
    examples:
      "মামলা চলিছে।": "The case is going on."
      "মামলা ডাঙৰ।": "The case is big."
  "as-3866":
    native: "complaint; charge"
    notes:
      "n1": "A formal statement that someone has done wrong."
    examples:
      "অভিযোগ আছে।": { native: "There is a complaint.", bases: { "আছে": "to be; there is; to have" } }
      "অভিযোগ লিখা।": "To write a complaint."
  "as-3867":
    native: "innocent"
    notes:
      "n1": "Not guilty of a crime. The opposite is অপৰাধী (oporādhi)."
    examples:
      "তেওঁ নিৰপৰাধ।": "He is innocent."
      "মই নিৰপৰাধ।": "I am innocent."
  "as-3868":
    native: "justice; fairness"
    notes:
      "n1": "Doing what is right and fair under the law."
    examples:
      "ন্যায় হ'ল।": { native: "Justice was done.", bases: { "হ'ল": "to become; to be" } }
      "ন্যায় ভাল।": "Justice is good."
  "as-3869":
    native: "illegal; against the law"
    notes:
      "n1": "Not allowed by the law. The opposite is আইনী (āini), legal."
    examples:
      "এইটো বেআইনী।": "This is illegal."
      "বেআইনী কাম।": "An illegal act."
  "as-3870":
    native: "to file a complaint"
    notes:
      "n1": "To say formally that someone has done wrong."
    examples:
  "as-3871":
    native: "to punish"
    notes:
      "n1": "To give the punishment set by the court."
    examples:
