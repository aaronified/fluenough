schema: 1
id: "as-en-grammar-conjunctions"
kind: "layer"
core: "as-grammar-conjunctions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Joining words"
license: "CC-BY-SA-4.0"
description: "And, but, or, because, if: joining words and sentences. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-2126":
    native: "and"
    notes:
      "n1": "চাহ আৰু বিস্কুট (sāh āru biskut), tea and biscuits. আৰু (āru) is also 'more': আৰু অলপ (āru ôlôp), a little more."
    examples:
      "পেঁপা আৰু ঢোল।": { native: "The pepa and the drum.", bases: {  } }
      "বিহুৱান আৰু নাচনী।": { native: "The male and female dancers.", bases: {  } }
  "as-2127":
    native: "but"
    examples:
      "এইটো সস্তা, কিন্তু ভাল।": { native: "This is cheap, but good.", bases: {  } }
  "as-2128":
    native: "or"
    notes:
      "n1": "In a statement. Also বা (bā)."
  "as-2129":
    native: "or (in a question)"
    notes:
      "n1": "চাহ নে কফি (sāh ne kophi)?, tea or coffee? The same -নে (-ne) asks a yes-or-no question."
    examples:
      "তুমি বুজা নে?": { native: "Do you understand?", bases: { "বুজা": "understand", "নে": "question particle", "তুমি": "you" } }
      "তুমি শুনা নে?": { native: "Do you hear?", bases: { "শুনা": "hear", "নে": "question particle", "তুমি": "you" } }
  "as-2130":
    native: "because"
    notes:
      "n1": "It begins the reason: মই নাহিলোঁ (moi nāhilum̐), কিয়নো মোৰ জ্বৰ আছিল (kiyônu mur zôr āsil), I didn't come, because I had a fever. Also কাৰণ (kārôn)."
    examples:
      "তাই দুখিত, কিয়নো বৰষুণ।": { native: "She is sad, because of the rain.", bases: {  } }
  "as-2131":
    native: "that's why; so"
  "as-2132":
    native: "that (quoting what is said or thought)"
    notes:
      "n1": "It comes after the words quoted: সি আহিব বুলি ক (si āhib buli kô)'লে (le), he said that he would come."
    examples:
      "কাইলৈ যাব বুলি তেওঁ কৈছিল।": { native: "He said that he would go tomorrow.", bases: {  } }
      "তুমি আহিবা বুলি মই জানো।": { native: "I know that you will come.", bases: {  } }
  "as-2133":
    native: "if"
    notes:
      "n1": "Often the verb's -লে (-le) says it alone: বৰষুণ দিলে (bôroxun dile), if it rains."
    examples:
      "যদি বেছি লাগে, তেন্তে কিনিম।": { native: "If it is needed in quantity, then I will buy.", bases: {  } }
      "যদি সময় থাকিলে, তেন্তে পঢ়িম।": { native: "If there is time, then I will read.", bases: {  } }
  "as-2134":
    native: "then (after an if)"
    examples:
      "যদি তুমি আহিলে, তেন্তে চাহ খাম।": { native: "If you come, then I will drink tea.", bases: {  } }
      "যদি তেওঁ গ'লে, তেন্তে মইও যাম।": { native: "If he goes, then I will go too.", bases: {  } }
  "as-2135":
    native: "although; even if"
    examples:
      "যদিও বেয়া, তথাপি খাওঁ।": { native: "Although it is bad, I still eat it.", bases: { "তথাপি": "still; nevertheless" } }
  "as-2136":
    native: "otherwise; or else"
  "as-2137":
    native: "me too"
    notes:
      "n1": "-ও (-o) on a word is 'too' or 'even': তুমিও (tumiu), you too."
    examples:
      "যদি তেওঁ গ'লে, তেন্তে মইও যাম।": { native: "If he goes, then I will go too.", bases: {  } }
