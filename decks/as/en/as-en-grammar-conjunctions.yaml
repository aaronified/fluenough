schema: 1
id: "as-en-grammar-conjunctions"
kind: "layer"
core: "as-grammar-conjunctions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Joining words"
license: "CC0-1.0"
description: "And, but, or, because, if: joining words and sentences. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-2126":
    native: "and"
    notes:
      "n1": "চাহ আৰু বিস্কুট (sāh āru biskut), tea and biscuits. আৰু (āru) is also 'more': আৰু অলপ (āru ôlôp), a little more."
  "as-2127":
    native: "but"
  "as-2128":
    native: "or"
    notes:
      "n1": "In a statement. Also বা (bā)."
  "as-2129":
    native: "or (in a question)"
    notes:
      "n1": "চাহ নে কফি (sāh ne kophi)?, tea or coffee? The same -নে (-ne) asks a yes-or-no question."
  "as-2130":
    native: "because"
    notes:
      "n1": "It begins the reason: মই নাহিলোঁ (moi nāhilum̐), কিয়নো মোৰ জ্বৰ আছিল (kiyônu mur zôr āsil), I didn't come, because I had a fever. Also কাৰণ (kārôn)."
  "as-2131":
    native: "that's why; so"
  "as-2132":
    native: "that (quoting what is said or thought)"
    notes:
      "n1": "It comes after the words quoted: সি আহিব বুলি ক (si āhib buli kô)'লে (le), he said that he would come."
  "as-2133":
    native: "if"
    notes:
      "n1": "Often the verb's -লে (-le) says it alone: বৰষুণ দিলে (bôroxun dile), if it rains."
  "as-2134":
    native: "then (after an if)"
  "as-2135":
    native: "although; even if"
  "as-2136":
    native: "otherwise; or else"
  "as-2137":
    native: "me too"
    notes:
      "n1": "-ও (-o) on a word is 'too' or 'even': তুমিও (tumiu), you too."
