schema: 1
id: "as-en-grammar-gender-number"
kind: "layer"
core: "as-grammar-gender-number"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "No gender; number and classifiers"
license: "CC0-1.0"
description: "Assamese has no grammatical gender: only the pronouns সি (si) and তাই (tāi), and the classifiers -জন (-zôn) and -জনী (-zoni), tell a man from a woman. So this deck teaches number instead: the plurals -বোৰ (-bur), -হঁত (-hôm̐t) and -সকল (-sôkôl), and a number with its classifier. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-2008":
    notes:
      "n1": "Only the pronoun says it is a woman: the verb is the same as for সি (si), he."
  "as-2052":
    native: "They came."
    notes:
      "n1": "The verb doesn't change for number: সি আহিল (xi āhil), সিহঁত আহিল (xihôm̐t āhil)."
    bases:
      "সিহঁত": "they"
      "আহিল": "to come"
  "as-2053":
    native: "The boys are playing."
    notes:
      "n1": "-বোৰ (-bur) makes a plural of anything, people too."
    bases:
      "খেলি": "to play"
      "আছে": "to be; to have"
  "as-2054":
    native: "the boys; the lads"
    notes:
      "n1": "-হঁত (-hôm̐t) makes a plural of people, mostly familiar: ল (lô)'ৰাহঁত (rāhôm̐t), ছোৱালীহঁত (suwālihôm̐t)."
  "as-2055":
    native: "the teachers"
    notes:
      "n1": "-সকল (-sôkôl) is a respectful plural for people. -বিলাক (bilāk) is another plural, for people or things."
  "as-2056":
    native: "three books"
    notes:
      "n1": "After a number the noun stays singular, and the classifier goes on the number: তিনিখন (tinikhôn), three (flat things)."
    bases:
      "কিতাপ": "book"
  "as-2057":
    native: "two people"
    notes:
      "n1": "-জন (-zôn) counts men, and people in general; -জনী (-zoni) counts women: দুজনী ছোৱালী (duzoni suwāli), two girls."
    bases:
      "মানুহ": "person; man"
  "as-2058":
    native: "a lot of people"
    notes:
      "n1": "After বহুত (bohut), many, the noun stays singular too."
    bases:
      "বহুত": "a lot"
      "মানুহ": "person; man"
  "as-2059":
    native: "a good boy, a good girl"
    notes:
      "n1": "A describing word never changes for gender or number."
  "as-2060":
    native: "a student (a man), a student (a woman)"
    notes:
      "n1": "A few nouns from Sanskrit have a woman's form in -ঈ (-i): ছাত্ৰী (sātri). Most nouns have one form for both."
  "as-2061":
    native: "the man, the woman"
    notes:
      "n1": "মানুহ (mānuh) is any person; the classifier can say which: -জন (-zôn) for a man, -জনী (-zoni) for a woman."
    bases:
      "মানুহজন": "person; man"
      "মানুহজনী": "person; man"
