cards:
  "as-2621":
    native: "There is a lot of dancing at Rongali Bihu."
    bases:
      "আছে": "to be; there is; to have"
    confusables:
      "c1": { why: "The January feast, not the spring festival." }
      "c2": { why: "The lean festival of autumn, not the dancing one." }
  "as-2622":
    native: "The bonfire burns and the drum plays."
    bases:
      "জ্বলে": "to burn"
      "বাজে": "to play; to sound; to ring"
    confusables:
      "c1": { why: "A ritual, not the sound of the drum." }
      "c2": { why: "A meal, not the bonfire." }
  "as-2623":
    native: "The guest brings a gift."
    confusables:
      "c1": { why: "An invitation, not the gift itself." }
      "c2": { why: "A programme, not a person." }
  "as-2624":
    native: "The dancer wears new costume."
    confusables:
      "c1": { why: "A male dancer, not the woman in the sentence." }
      "c2": { why: "A feeling, not a person." }
  "as-2625":
    native: "Today is a day of joy."
    confusables:
      "c1": { why: "The festival itself, not the feeling." }
      "c2": { why: "Festive is an adjective, not the day itself." }
  "as-2626":
    native: "There is a puja at the temple."
    bases:
      "আছে": "to be; there is; to have"
    confusables:
      "c1": { why: "A prayer hall, not a temple." }
      "c2": { why: "A church, a different place of worship." }
  "as-2627":
    native: "Your invitation is good."
    confusables:
      "c1": { why: "A gift, not an invitation." }
      "c2": { why: "A donation, not an invitation." }
  "as-2628":
    native: "At Bihu I sing a song."
    confusables:
      "c1": { why: "To eat, not to sing." }
      "c2": { why: "To dance, not to sing." }
  "as-2629":
    native: "At Kongali Bihu fires are lit."
    bases:
      "কঙালী": "Kongali (the autumn lean festival)"
      "জ্বলে": "to burn"
    confusables:
      "c1": { why: "The bonfire of January, not this autumn festival." }
      "c2": { why: "The full moon, not the fires." }
  "as-2630":
    native: "Greetings to the guest."
    confusables:
      "c1": { why: "Thank you, not a greeting." }
      "c2": { why: "Welcome, a sign word, not a greeting to a person." }
