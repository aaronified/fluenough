schema: 1
id: "as-en-market"
kind: "layer"
core: "as-market"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Market"
license: "CC-BY-SA-4.0"
description: "Asking the price, bargaining, paying: what a market stall needs. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0266":
    native: "market"
    notes:
      "n1": "বজাৰলৈ যোৱা (bôzārôlôi zuwā), to go to the market. Many towns have a weekly হাট (hāt), a market day."
    examples:
      "বজাৰত সস্তা।": { native: "It is cheap at the market.", bases: { "বজাৰত": "market" } }
      "মই বজাৰলৈ যাওঁ।": { native: "I go to the market.", bases: { "বজাৰলৈ": "to the market", "যাওঁ": "go", "মই": "I" } }
  "as-0267":
    native: "How much is it?"
    notes:
      "n1": "Also এইটো কিমান? (eitu kiman?), how much is this one? and, for the total, কিমান হ (kimān hô)'ল? (kiman hol?)."
  "as-0268":
    native: "price"
    examples:
      "টিকটৰ দাম": { native: "the ticket price; fare", bases: {  } }
      "দাম কিমান?": { native: "How much is it?", bases: {  } }
  "as-0269":
    native: "rupee; money"
    notes:
      "n1": "The same word for a rupee and for money: এশ টকা (ex tôkā), a hundred rupees. Unlike English, the noun stays as it is after a number."
    examples:
      "টকা জমা": { native: "to deposit money", bases: { "জমা": "deposit; saved" } }
      "এটিএমত টকা আছে।": { native: "There is money in the ATM.", bases: { "আছে": "to be; there is; to have" } }
  "as-0270":
    native: "money; a paisa"
    notes:
      "n1": "Strictly a hundredth of a rupee, but in speech money in general: পইচা নাই (poisā nāi), I've no money."
    examples:
      "মোৰ পইচা নাই।": { native: "I have no money.", bases: {  } }
      "এইটো পইচা।": { native: "This is money.", bases: {  } }
  "as-0271":
    native: "change; small notes and coins"
    notes:
      "n1": "খুচুৰা আছে নেকি? (khusura ase neki?), do you have change?"
    examples:
      "মোক খুচুৰা দিয়ক।": { native: "Please give me change.", bases: {  } }
      "খুচুৰা ফেৰত আহিল।": { native: "The change came back.", bases: {  } }
  "as-0272":
    native: "That's too expensive!"
    notes:
      "n1": "বেছি (besi) is 'more, too much'; its opposite is কম (kôm), 'less'."
    bases:
      "বেছি": "more; too much"
  "as-0273":
    native: "Please lower it a little."
    notes:
      "n1": "The polite way to bargain: অলপ (ôlôp), a little. Bargaining, দৰদাম (dôrdām), is expected at markets, not in shops with fixed prices."
    bases:
      "অলপ": "a little"
      "কৰক": "to do; to make"
  "as-0274":
    native: "bag"
    notes:
      "n1": "Many shoppers bring their own cloth bag to the market."
    examples:
      "প্লাষ্টিকৰ মোনা।": { native: "A plastic bag.", bases: { "প্লাষ্টিকৰ": "plastic" } }
      "মোনা পূৰণ।": { native: "The bag is full.", bases: {  } }
  "as-0275":
    native: "shop"
    notes:
      "n1": "The o is said close to u: dukan."
    examples:
      "দোকান ইয়াত।": { native: "The shop is here.", bases: {  } }
      "মই দোকানলৈ যাওঁ।": { native: "I go to the shop.", bases: { "দোকানলৈ": "to the shop" } }
  "as-0276":
    native: "please give (me)"
    notes:
      "n1": "এক কিলো দিয়ক (ek kilo diyôk), a kilo, please. To a friend: দিয়া (diyā)."
    examples:
      "আনি দিয়ক।": { native: "Please fetch it (for me).", bases: { "আনি": "to bring" } }
      "ঠিকনা দিয়ক।": { native: "Please give the address.", bases: {  } }
  "as-0277":
    native: "kilo"
    notes:
      "n1": "আধা কিলো (ādhā kilo), half a kilo; ডেৰ কিলো (der kilo), a kilo and a half."
    examples:
      "মই এক কিলো কিনোঁ।": { native: "I buy one kilo.", bases: {  } }
      "মই দুটা কিলো চাউল কিনোঁ।": { native: "I buy two kilos of rice.", bases: {  } }
  "as-0278":
    native: "Nothing else."
    notes:
      "n1": "লাগে (lāge), 'is needed'; নালাগে (nālāge), 'is not needed'."
    bases:
      "একো": "anything; nothing"
  "as-0279":
    native: "bargaining"
    notes:
      "n1": "দৰদাম কৰা (dôrdām kôrā), to bargain."
    examples:
      "দোকানত দৰদাম কৰোঁ।": { native: "I bargain at the shop.", bases: {  } }
      "মই দৰদাম কৰোঁ।": { native: "I bargain.", bases: {  } }
