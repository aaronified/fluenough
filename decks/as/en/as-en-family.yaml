schema: 1
id: "as-en-family"
kind: "layer"
core: "as-family"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Family"
license: "CC-BY-SA-4.0"
description: "Parents, brothers and sisters, grandparents, and the aunts and uncles on each side, each with its own word, and a word that changes with whose relative it is. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0178":
    native: "parents"
    notes:
      "n1": "Mother and father together, mother first. Formally পিতৃ-মাতৃ (pitri-mātri)."
    examples:
      "মোৰ মা-দেউতা ইয়াত আছে।": { native: "My parents are here.", bases: { "আছে": "to be; to have" } }
      "মোৰ মা-দেউতা ভাল আছে।": { native: "My parents are well.", bases: { "আছে": "to be; to have" } }
  "as-0179":
    native: "father; my father"
    notes:
      "n1": "Kinship words change with whose relative it is. দেউতা (deutā) is my father; your father is দেউতাৰা (deutārā), and his or hers দেউতাক (deutāk). So are মা (mā), মাৰা (mārā), মাক (mother) and ককাই (kôkāi), ককায়েৰা (kôkāyerā), ককায়েক (elder brother)."
    examples:
      "তেওঁৰ দেউতাক": { native: "his father; her father", bases: { "তেওঁৰ": "he; she", "দেউতাক": "father; my father" } }
      "তোমাৰ দেউতাৰা": { native: "your father (familiar)", bases: { "তোমাৰ": "you (familiar)", "দেউতাৰা": "father; my father" } }
  "as-0180":
    native: "mother; my mother"
    notes:
      "n1": "Also আই (āi). Your mother is মাৰা (mārā), his or her mother মাক (māk)."
    examples:
      "মাৰ স্নেহ।": { native: "A mother's affection.", bases: { "মাৰ": "mother; my mother" } }
      "মা ৰান্ধে।": { native: "Mother cooks.", bases: { "মা": "mother", "ৰান্ধে": "cooks" } }
  "as-0181":
    native: "elder brother"
    notes:
      "n1": "With respect, ককাইদেউ (kôkāideu). Assamese has no everyday word for a brother or a sister, only elder and younger."
    examples:
      "আপোনাৰ ভাই-ককাই আছে নেকি?": { native: "Do you have any brothers?", bases: { "আছে": "to be; to have" } }
      "যি মানুহ আহিছে, সি মোৰ ককাই।": { native: "The man who has come is my elder brother.", bases: { "যি": "who; which (relative)" } }
  "as-0155":
    notes:
      "n1": "Formally ভাই (bhāi)."
    examples:
      "ভাইটি, ইয়ালৈ আহা।": { native: "Little brother, come here.", bases: { "ইয়ালৈ": "here (to here)", "আহা": "to come" } }
      "মোৰ দুজন ভাইটি আছে।": { native: "I have two younger brothers.", bases: { "মোৰ": "I", "আছে": "to be; to have" } }
  "as-0182":
    native: "elder sister"
    notes:
      "n1": "With respect, বাইদেউ (bāideu)."
    examples:
      "মোৰ বাই ইয়াত আছে।": { native: "My elder sister is here.", bases: { "আছে": "to be; to have" } }
      "এইটো মোৰ বাই।": { native: "This is my elder sister.", bases: {  } }
  "as-0156":
    notes:
      "n1": "Formally ভনী (bhoni)."
    examples:
      "ভণ্টি, ইয়ালৈ আহা।": { native: "Little sister, come here.", bases: { "ইয়ালৈ": "here (to here)", "আহা": "to come" } }
      "ভণ্টি, কেনে আছ?": { native: "Little sister, how are you?", bases: { "কেনে": "how", "আছ": "to be; to have" } }
  "as-0183":
    native: "brothers"
    notes:
      "n1": "Younger and elder brothers together. Sisters together are বাই-ভনী (bāi-bhoni)."
    examples:
      "মোৰ ভাই-ককাই ইয়াত আছে।": { native: "My brothers are here.", bases: { "আছে": "to be; to have" } }
      "এইটো মোৰ ভাই-ককাই।": { native: "These are my brothers.", bases: {  } }
  "as-0184":
    native: "son; boy"
    notes:
      "n1": "The apostrophe marks a closed o. মোৰ ল (mur lô)'ৰা (mur lora), my son."
    examples:
      "ল'ৰা দৌৰে।": { native: "The boy runs.", bases: { "দৌৰে": "to run" } }
      "ল'ৰা বাঢ়িছে।": { native: "The boy is growing.", bases: { "বাঢ়িছে": "to grow" } }
  "as-0185":
    native: "daughter; girl"
    notes:
      "n1": "Also জীয়ৰী (ziyori), a daughter."
    examples:
      "ছোৱালীজনী ক'ত?": { native: "Where is the girl?", bases: { "ছোৱালীজনী": "daughter; girl" } }
      "আপোনাৰ ল'ৰা-ছোৱালী কেইজন?": { native: "How many children do you have?", bases: {  } }
  "as-0186":
    native: "children"
    notes:
      "n1": "Literally 'boys and girls'."
    examples:
      "মোৰ ল'ৰা-ছোৱালী ইয়াত আছে।": { native: "My children are here.", bases: { "আছে": "to be; to have" } }
      "এইটো মোৰ ল'ৰা-ছোৱালী।": { native: "These are my children.", bases: {  } }
  "as-0187":
    native: "husband"
    notes:
      "n1": "The ব (bô) under স (xô) is not said. A woman speaking of her husband often just says তেওঁ (teum̐), 'he', the respectful pronoun."
    examples:
      "এইটো মোৰ স্বামী।": { native: "This is my husband.", bases: {  } }
      "মোৰ স্বামী ইয়াত আছে।": { native: "My husband is here.", bases: { "আছে": "to be; to have" } }
  "as-0188":
    native: "wife"
    notes:
      "n1": "Formally পত্নী (potni)."
    examples:
      "এইটো মোৰ ঘৈণী।": { native: "This is my wife.", bases: {  } }
      "মোৰ ঘৈণী ইয়াত আছে।": { native: "My wife is here.", bases: { "আছে": "to be; to have" } }
  "as-0159":
    native: "grandfather"
    examples:
      "এইটো মোৰ ককা।": { native: "This is my grandfather.", bases: {  } }
      "মোৰ ককা ইয়াত আছে।": { native: "My grandfather is here.", bases: { "আছে": "to be; to have" } }
  "as-0160":
    native: "grandmother"
    examples:
      "এইটো মোৰ আইতা।": { native: "This is my grandmother.", bases: {  } }
      "মোৰ আইতা ইয়াত আছে।": { native: "My grandmother is here.", bases: { "আছে": "to be; to have" } }
  "as-0157":
    native: "uncle (father's younger brother)"
    notes:
      "n1": "Also how you address a man of your parents' age. His wife is খুৰী (khuri)."
    examples:
      "মোৰ খুৰা ইয়াত আছে।": { native: "My uncle is here.", bases: { "আছে": "to be; to have" } }
      "এইটো মোৰ খুৰা।": { native: "This is my uncle.", bases: {  } }
  "as-0158":
    native: "aunt (wife of father's younger brother)"
    examples:
      "মোৰ খুৰী ইয়াত আছে।": { native: "My aunt is here.", bases: { "আছে": "to be; to have" } }
      "এইটো মোৰ খুৰী।": { native: "This is my aunt.", bases: {  } }
  "as-0189":
    native: "uncle (father's elder brother)"
    notes:
      "n1": "Literally 'big father'. His wife is বৰমা (bôrmā), 'big mother'."
    examples:
      "এইটো মোৰ বৰদেউতা।": { native: "This is my uncle.", bases: {  } }
      "মোৰ বৰদেউতা ভাল।": { native: "My uncle is well.", bases: {  } }
  "as-0190":
    native: "uncle (mother's brother)"
    notes:
      "n1": "His wife is মামী (māmi)."
    examples:
      "এইটো মোৰ মামা।": { native: "This is my uncle (mother's brother).", bases: {  } }
      "মোৰ মামা ইয়াত আছে।": { native: "My uncle is here.", bases: { "আছে": "to be; to have" } }
  "as-0191":
    native: "aunt (mother's sister)"
    notes:
      "n1": "Her husband is মহা (môhā)."
    examples:
      "এইটো মোৰ মাহী।": { native: "This is my aunt (mother's sister).", bases: {  } }
      "মোৰ মাহী ইয়াত আছে।": { native: "My aunt is here.", bases: { "আছে": "to be; to have" } }
  "as-0192":
    native: "aunt (father's sister)"
    notes:
      "n1": "Her husband is পেহা (pehā)."
    examples:
      "এইটো মোৰ পেহী।": { native: "This is my aunt (father's sister).", bases: {  } }
      "মোৰ পেহী ইয়াত আছে।": { native: "My aunt is here.", bases: { "আছে": "to be; to have" } }
  "as-0193":
    native: "father-in-law"
    examples:
      "এইটো মোৰ শহুৰ।": { native: "This is my father-in-law.", bases: {  } }
      "মোৰ শহুৰ ইয়াত আছে।": { native: "My father-in-law is here.", bases: { "আছে": "to be; to have" } }
  "as-0194":
    native: "mother-in-law"
    examples:
      "এইটো মোৰ শাহু।": { native: "This is my mother-in-law.", bases: {  } }
      "মোৰ শাহু ইয়াত আছে।": { native: "My mother-in-law is here.", bases: { "আছে": "to be; to have" } }
  "as-0195":
    native: "relative"
    examples:
      "সি মোৰ আত্মীয়।": { native: "He is my relative.", bases: {  } }
      "এইটো মোৰ আত্মীয়।": { native: "This is my relative.", bases: {  } }
  "as-0196":
    native: "I have two younger brothers."
    notes:
      "n1": "'Of me two younger brothers are': Assamese says 'have' with আছে (āse). দুজন (duzôn) is two with জন (zôn), the counting word for people."
    bases:
      "মোৰ": "I"
      "আছে": "to be; to have"
  "as-0197":
    native: "Do you have any brothers?"
    bases:
      "আছে": "to be; to have"
  "as-0198":
    native: "I'm married."
    notes:
      "n1": "Literally 'my wedding has happened'. বিয়া (biyā), a wedding."
    bases:
      "মোৰ": "I"
      "বিয়া": "marriage"
      "হৈছে": "to be; to become"
