schema: 1
id: "as-en-family"
kind: "layer"
core: "as-family"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Family"
license: "CC0-1.0"
description: "Parents, brothers and sisters, grandparents, and the aunts and uncles on each side, each with its own word, and a word that changes with whose relative it is. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0178":
    native: "parents"
    notes:
      "n1": "Mother and father together, mother first. Formally পিতৃ-মাতৃ (pitri-mātri)."
  "as-0179":
    native: "father; my father"
    notes:
      "n1": "Kinship words change with whose relative it is. দেউতা (deutā) is my father; your father is দেউতাৰা (deutārā), and his or hers দেউতাক (deutāk). So are মা (mā), মাৰা (mārā), মাক (mother) and ককাই (kôkāi), ককায়েৰা (kôkāyerā), ককায়েক (elder brother)."
  "as-0180":
    native: "mother; my mother"
    notes:
      "n1": "Also আই (āi). Your mother is মাৰা (mārā), his or her mother মাক (māk)."
  "as-0181":
    native: "elder brother"
    notes:
      "n1": "With respect, ককাইদেউ (kôkāideu). Assamese has no everyday word for a brother or a sister, only elder and younger."
  "as-0155":
    notes:
      "n1": "Formally ভাই (bhāi)."
  "as-0182":
    native: "elder sister"
    notes:
      "n1": "With respect, বাইদেউ (bāideu)."
  "as-0156":
    notes:
      "n1": "Formally ভনী (bhoni)."
  "as-0183":
    native: "brothers"
    notes:
      "n1": "Younger and elder brothers together. Sisters together are বাই-ভনী (bāi-bhoni)."
  "as-0184":
    native: "son; boy"
    notes:
      "n1": "The apostrophe marks a closed o. মোৰ ল (mur lô)'ৰা (mur lora), my son."
  "as-0185":
    native: "daughter; girl"
    notes:
      "n1": "Also জীয়ৰী (ziyori), a daughter."
  "as-0186":
    native: "children"
    notes:
      "n1": "Literally 'boys and girls'."
  "as-0187":
    native: "husband"
    notes:
      "n1": "The ব (bô) under স (xô) is not said. A woman speaking of her husband often just says তেওঁ (teum̐), 'he', the respectful pronoun."
  "as-0188":
    native: "wife"
    notes:
      "n1": "Formally পত্নী (potni)."
  "as-0159":
    native: "grandfather"
  "as-0160":
    native: "grandmother"
  "as-0157":
    native: "uncle (father's younger brother)"
    notes:
      "n1": "Also how you address a man of your parents' age. His wife is খুৰী (khuri)."
  "as-0158":
    native: "aunt (wife of father's younger brother)"
  "as-0189":
    native: "uncle (father's elder brother)"
    notes:
      "n1": "Literally 'big father'. His wife is বৰমা (bôrmā), 'big mother'."
  "as-0190":
    native: "uncle (mother's brother)"
    notes:
      "n1": "His wife is মামী (māmi)."
  "as-0191":
    native: "aunt (mother's sister)"
    notes:
      "n1": "Her husband is মহা (môhā)."
  "as-0192":
    native: "aunt (father's sister)"
    notes:
      "n1": "Her husband is পেহা (pehā)."
  "as-0193":
    native: "father-in-law"
  "as-0194":
    native: "mother-in-law"
  "as-0195":
    native: "relative"
  "as-0196":
    native: "I have two younger brothers."
    notes:
      "n1": "'Of me two younger brothers are': Assamese says 'have' with আছে (āse). দুজন (duzôn) is two with জন (zôn), the counting word for people."
    bases:
      "মোৰ": "I"
      "আছে": "to be; to have"
  "as-0197":
    native: "Do you have any brothers?"
    bases:
      "আছে": "to be; to have"
  "as-0198":
    native: "I'm married."
    notes:
      "n1": "Literally 'my wedding has happened'. বিয়া (biyā), a wedding."
    bases:
      "মোৰ": "I"
      "বিয়া": "marriage"
      "হৈছে": "to be; to become"
