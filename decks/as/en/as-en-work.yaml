schema: 1
id: "as-en-work"
kind: "layer"
core: "as-work"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Work"
license: "CC0-1.0"
description: "Jobs, the workplace, and how to ask and say what someone does. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0199":
    native: "job (employment)"
    notes:
      "n1": "কাম (kām) is work of any kind; চাকৰি (sākori) is a job with a salary. A government job, চৰকাৰী চাকৰি (sôrkāri sākori), is still many families' dream."
  "as-0200":
    native: "office"
    notes:
      "n1": "English f is written ফ (phô) and s is written চ (sô). Formally কাৰ্যালয় (kārzālôy)."
  "as-0201":
    native: "teacher"
    notes:
      "n1": "A woman teacher is শিক্ষয়িত্ৰী (xikkhoyitri). In speech, often ছাৰ (sār) and বাইদেউ (bāideu), or টিচাৰ (tisār)."
  "as-0202":
    native: "shopkeeper"
    notes:
      "n1": "From দোকান (dukān), shop."
  "as-0203":
    native: "driver"
    notes:
      "n1": "English v is written ভ (bhô)."
  "as-0204":
    native: "engineer"
  "as-0205":
    native: "lawyer"
  "as-0206":
    native: "nurse"
  "as-0207":
    native: "farmer"
    notes:
      "n1": "From খেতি (kheti), farming. Formally কৃষক (krixôk)."
  "as-0208":
    native: "cook"
    notes:
      "n1": "From ৰন্ধা (rôndhā), to cook."
  "as-0209":
    native: "writer"
    notes:
      "n1": "A woman writer is লেখিকা (lekhikā)."
  "as-0210":
    native: "journalist; reporter"
  "as-0211":
    native: "doctor"
  "as-0212":
    native: "police; a police officer"
    notes:
      "n1": "Formally আৰক্ষী (ārokkhi). The emergency number in India is 112."
  "as-0213":
    native: "student"
    notes:
      "n1": "A woman student is ছাত্ৰী (sātri)."
  "as-0214":
    native: "day off; holiday; leave"
    notes:
      "n1": "আজি মোৰ ছুটী (āzi mur suti), I have the day off today."
  "as-0215":
    native: "salary; pay"
  "as-0216":
    native: "business; trade"
  "as-0217":
    native: "tea garden; tea estate"
    notes:
      "n1": "Assam grows more tea than any other state of India, on estates whose workers' families were brought from central and eastern India in the 1800s."
  "as-0218":
    native: "What do you do (for a living)?"
  "as-0219":
    native: "I'm a teacher."
    notes:
      "n1": "No verb is needed: 'I teacher'. Also মই এজন শিক্ষক (moi ezôn xikkhôk), with এজন (ezôn), one person."
  "as-0220":
    native: "Where do you work?"
  "as-0221":
    native: "I work in an office."
    notes:
      "n1": "A man and a woman say the same: Assamese verbs change for I, you and he, never for gender."
