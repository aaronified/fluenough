schema: 1
id: "as-en-work"
kind: "layer"
core: "as-work"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Work"
license: "CC-BY-SA-4.0"
description: "Jobs, the workplace, and how to ask and say what someone does. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0199":
    native: "job (employment)"
    notes:
      "n1": "কাম (kām) is work of any kind; চাকৰি (sākori) is a job with a salary. A government job, চৰকাৰী চাকৰি (sôrkāri sākori), is still many families' dream."
    examples:
      "মোৰ চাকৰি ভাল।": { native: "My job is good.", bases: {  } }
      "তেওঁ চাকৰি পালে।": { native: "He got a job.", bases: { "পালে": "to get; to receive" } }
  "as-0200":
    native: "office"
    notes:
      "n1": "English f is written ফ (phô) and s is written চ (sô). Formally কাৰ্যালয় (kārzālôy)."
    examples:
      "কেন্দ্ৰত অফিচ।": { native: "There is an office at the centre.", bases: { "কেন্দ্ৰত": "centre; the central government" } }
      "সৰকাৰী অফিচ ডাঙৰ।": { native: "The government office is big.", bases: {  } }
  "as-0201":
    native: "teacher"
    notes:
      "n1": "A woman teacher is শিক্ষয়িত্ৰী (xikkhoyitri). In speech, often ছাৰ (sār) and বাইদেউ (bāideu), or টিচাৰ (tisār)."
    examples:
      "তেওঁলোক শিক্ষক।": { native: "They are teachers.", bases: { "শিক্ষক": "teacher", "তেওঁলোক": "they (polite)" } }
      "প্ৰধান শিক্ষক": { native: "headmaster; head teacher", bases: { "প্ৰধান": "main; chief" } }
  "as-0202":
    native: "shopkeeper"
    notes:
      "n1": "From দোকান (dukān), shop."
    examples:
      "দোকানী চাউল বেচে।": { native: "The shopkeeper sells rice.", bases: { "বেচে": "to sell" } }
      "দোকানী ফেৰত দিয়ে।": { native: "The shopkeeper gives back the change.", bases: {  } }
  "as-0203":
    native: "driver"
    notes:
      "n1": "English v is written ভ (bhô)."
    examples:
      "সি ড্ৰাইভাৰ।": { native: "He is a driver.", bases: {  } }
      "মোৰ ভাই ড্ৰাইভাৰ।": { native: "My brother is a driver.", bases: {  } }
  "as-0204":
    native: "engineer"
    examples:
      "সি ইঞ্জিনিয়াৰ।": { native: "He is an engineer.", bases: {  } }
      "মোৰ ভাই ইঞ্জিনিয়াৰ।": { native: "My brother is an engineer.", bases: {  } }
  "as-0205":
    native: "lawyer"
    examples:
      "সি উকীল।": { native: "He is a lawyer.", bases: {  } }
      "মোৰ ককা উকীল।": { native: "My grandfather is a lawyer.", bases: {  } }
  "as-0206":
    native: "nurse"
    examples:
      "মই নাৰ্চ।": { native: "I am a nurse.", bases: {  } }
      "তাই নাৰ্চ।": { native: "She is a nurse.", bases: {  } }
  "as-0207":
    native: "farmer"
    notes:
      "n1": "From খেতি (kheti), farming. Formally কৃষক (krixôk)."
    examples:
      "সি খেতিয়ক।": { native: "He is a farmer.", bases: {  } }
      "মোৰ ককা খেতিয়ক।": { native: "My grandfather is a farmer.", bases: {  } }
  "as-0208":
    native: "cook"
    notes:
      "n1": "From ৰন্ধা (rôndhā), to cook."
    examples:
      "তাই ৰান্ধনী।": { native: "She is a cook.", bases: {  } }
      "মোৰ আইতা ৰান্ধনী।": { native: "My grandmother is a cook.", bases: {  } }
  "as-0209":
    native: "writer"
    notes:
      "n1": "A woman writer is লেখিকা (lekhikā)."
    examples:
      "সি লেখক।": { native: "He is a writer.", bases: {  } }
      "মোৰ খুৰা লেখক।": { native: "My uncle is a writer.", bases: {  } }
  "as-0210":
    native: "journalist; reporter"
    examples:
      "সি সাংবাদিক।": { native: "He is a journalist.", bases: {  } }
      "সাংবাদিক খবৰ লিখিছে।": { native: "The reporter has written the news.", bases: {  } }
  "as-0211":
    native: "doctor"
    examples:
      "সি ডাক্তৰ।": { native: "He is a doctor.", bases: {  } }
      "ডাক্তৰ আহিছে।": { native: "The doctor has come.", bases: {  } }
  "as-0212":
    native: "police; a police officer"
    notes:
      "n1": "Formally আৰক্ষী (ārokkhi). The emergency number in India is 112."
    examples:
      "এইটো পুলিচ।": { native: "This is a police officer.", bases: {  } }
      "পুলিচ ইয়াত।": { native: "The police are here.", bases: {  } }
  "as-0213":
    native: "student"
    notes:
      "n1": "A woman student is ছাত্ৰী (sātri)."
    examples:
      "ছাত্ৰ, ছাত্ৰী": { native: "a student (a man), a student (a woman)", bases: { "ছাত্ৰী": "student" } }
      "ছাত্ৰ উত্তৰ দিছে।": { native: "The student has given the answer.", bases: {  } }
  "as-0214":
    native: "day off; holiday; leave"
    notes:
      "n1": "আজি মোৰ ছুটী (āzi mur suti), I have the day off today."
    examples:
      "মোৰ ছুটী আছে।": { native: "I have a holiday.", bases: { "আছে": "to be; to have" } }
      "ছুটী লোৱা": { native: "to take leave", bases: {  } }
  "as-0215":
    native: "salary; pay"
    examples:
      "মোৰ দৰমহা ভাল।": { native: "My salary is good.", bases: {  } }
      "মোক দৰমহা দিয়ক।": { native: "Please give me my salary.", bases: {  } }
  "as-0216":
    native: "business; trade"
    examples:
      "মোৰ বেপাৰ ভাল।": { native: "My business is good.", bases: {  } }
      "মোৰ বেপাৰ ইয়াত।": { native: "My business is here.", bases: {  } }
  "as-0217":
    native: "tea garden; tea estate"
    notes:
      "n1": "Assam grows more tea than any other state of India, on estates whose workers' families were brought from central and eastern India in the 1800s."
    bases:
      "বাগান": "garden"
  "as-0218":
    native: "What do you do (for a living)?"
    bases:
      "কৰে": "to do; to make"
  "as-0219":
    native: "I'm a teacher."
    notes:
      "n1": "No verb is needed: 'I teacher'. Also মই এজন শিক্ষক (moi ezôn xikkhôk), with এজন (ezôn), one person."
    bases:
      "মই": "I"
  "as-0220":
    native: "Where do you work?"
    bases:
      "কৰে": "to do; to make"
  "as-0221":
    native: "I work in an office."
    notes:
      "n1": "A man and a woman say the same: Assamese verbs change for I, you and he, never for gender."
    bases:
      "মই": "I"
      "কৰোঁ": "to do; to make"
