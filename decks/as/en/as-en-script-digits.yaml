schema: 1
id: "as-en-script-digits"
kind: "layer"
core: "as-script-digits"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Assamese digits"
license: "CC-BY-SA-4.0"
description: "The ten digits of Assamese, which are the Bengali digits, each with the Assamese number word it names. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["beginner", "unreviewed", "script"]
cards:
  "as-2168":
    native: "0 (zero)"
    notes:
      "n1": "A plain oval with no stroke, the same idea as the Western 0. It is a digit, not a letter. Its word শূন্য (xūnyô, zero) comes from Sanskrit; Assamese says শ (x) as 'x'."
  "as-2169":
    native: "1 (one)"
    notes:
      "n1": "A short upright stroke. Its word এক (ek, one) is the same in Assamese and Bengali."
  "as-2170":
    native: "2 (two)"
    notes:
      "n1": "Its word দুই (dui, two) is said 'dooi'."
  "as-2171":
    native: "3 (three)"
    notes:
      "n1": "Its word তিনি (tini, three) ends in an 'i' that Bengali drops in its own form তিন (tin)."
  "as-2172":
    native: "4 (four)"
    notes:
      "n1": "Looks like an 8, but is 4. Its word চাৰি (sāri, four) starts with 's', and the 'r' is the Assamese letter ৰ (r). Do not read ৪ (4) as ৮ (8)."
  "as-2173":
    native: "5 (five)"
    notes:
      "n1": "Its word পাঁচ (pām̐s, five) ends in 's', not the 'ch' of Bengali পাঁচ (pām̐c)."
  "as-2174":
    native: "6 (six)"
    notes:
      "n1": "Its word ছয় (sôy, six) starts with 's': Assamese says the letter ছ (ch) as 's'."
  "as-2175":
    native: "7 (seven)"
    notes:
      "n1": "Its word সাত (xāt, seven) starts with 'x', the sound of the 'ch' in Scottish 'loch'."
  "as-2176":
    native: "8 (eight)"
    notes:
      "n1": "The true 8. Its word আঠ (āth, eight) has a short 'th' at the end. Do not read ৪ (4) as this digit."
  "as-2177":
    native: "9 (nine)"
    notes:
      "n1": "Its word ন (nô, nine) is the same as the letter ন (n). It is a digit, not a letter."
