name: "Nature: trees, land and water: sentences"
license: "CC-BY-SA-4.0"
description: "Sentences built from the words of this unit and the ones before it. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3033":
    native: "In spring the flowers bloom."
    notes:
      "n1": "বসন্তত (bôxôntôt) is 'in spring' with -ত (-t), 'in'. ফুটে (phute) is from ফুটা (phutā), 'to bloom', with the stem ফুট- (phut-)."
    confusables:
      "c1": { why: "Weather, not flowers." }
      "c2": { why: "Autumn, not spring." }
  "as-3034":
    native: "Sit in the shade of the tree."
    notes:
      "n1": "-ৰ (-r) means 'of': গছৰ (gôsôr), of the tree. ছাঁত (sām̐t) is 'in the shade', and বহা (bôhā), 'sit', is a command."
    confusables:
      "c1": { why: "Sunshine, the opposite of shade." }
      "c2": { why: "Rain, not shade." }
  "as-3035":
    native: "There is sand on the river bank."
    notes:
      "n1": "The place word takes -ৰ (-r), 'of', and the next takes -ত (-t), 'on': নদীৰ পাৰত (nodir pārôt), on the bank of the river."
    bases:
      "পাৰত": "riverbank; side; edge"
    confusables:
      "c1": { why: "A stone, not sand." }
      "c2": { why: "Soil, not sand." }
  "as-3036":
    native: "The bee flies to the flower."
    notes:
      "n1": "উৰে (ure) is from উৰা (urā), 'to fly', with the stem উৰ- (ur-). ফুলত (phulôt) has the ending -ত (-t)."
    confusables:
      "c1": { why: "A bird, not a bee." }
      "c2": { why: "An animal, too general." }
  "as-3037":
    native: "The grass in the valley is green."
    notes:
      "n1": "No word for 'is' is needed: সেউজ (xeuz), green, follows ঘাঁহ (ghām̐h), grass. উপত্যকাত (upôtyôkāt) is 'in the valley'."
    confusables:
      "c1": { why: "A thorn, not grass." }
      "c2": { why: "Wood, not grass." }
  "as-3038":
    native: "The tree is growing."
    notes:
      "n1": "বাঢ়িছে (bārhise) is the stem বাঢ়- (bārh-) of বাঢ়া (bārhā), 'to grow', plus -িছে (-ise)."
    confusables:
      "c1": { why: "Dry, the opposite of growing." }
      "c2": { why: "To fall, not to grow." }
  "as-3039":
    native: "There is a tiger in the jungle."
    notes:
      "n1": "The place comes first and the animal next: জংগলত বাঘ আছে (zôṅgôlôt bāgh āse) is literally 'in the jungle a tiger there is'."
    bases:
      "আছে": "to be; there is; to have"
    confusables:
      "c1": { why: "An elephant, also a jungle animal." }
      "c2": { why: "A lion, a different animal." }
  "as-3040":
    native: "I like beauty."
    notes:
      "n1": "ভাল লাগে (bhāl lāge) is literally 'good is felt': the thing liked, সৌন্দৰ্য (xôundôrz), beauty, comes first."
    confusables:
      "c1": { why: "Joy, a feeling, not beauty." }
      "c2": { why: "Greens, not beauty." }
