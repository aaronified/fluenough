description: "Sentences built from the words of this unit and the ones before it. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-2659":
    native: "I buy two kilos of rice."
    notes:
      "n1": "The number and measure come before the thing: দুটা কিলো চাউল (dutā kilo sāul) is literally 'two kilo rice'. কিনোঁ (kinum̐) is the 'I' present of কিনা (kinā), 'to buy'."
    confusables:
      "c1": { why: "To sell, the other side of buying." }
      "c2": { why: "The verb is buy; a wrong verb for the sentence." }
  "as-2660":
    native: "How much is this?"
    notes:
      "n1": "এইটো (eitu) is 'this one': এই (ei), this, plus the ending -টো (-tu). কিমান (kimān), 'how much', goes last and no verb is needed."
    confusables:
      "c1": { why: "Also means price, but formal; the question is the same." }
      "c2": { why: "Weight, not price." }
  "as-2661":
    native: "This is cheap, but good."
    notes:
      "n1": "কিন্তু (kintu), 'but', joins two short statements, and neither needs a word for 'is'."
    confusables:
      "c1": { why: "The opposite of cheap." }
      "c2": { why: "A loss, not a quality." }
  "as-2662":
    native: "The shopkeeper gives back the change."
    notes:
      "n1": "ফেৰত (pherôt), 'back', plus দিয়ে (diye), the 'he, she' present of দিয়া (diyā), 'to give', makes ফেৰত দিয়া (pherôt diyā), 'to give back'."
    confusables:
      "c1": { why: "The customer, the other person in the shop." }
      "c2": { why: "Cash, not the act of giving change." }
  "as-2663":
    native: "There is a sale today."
    notes:
      "n1": "আছে (āse) here means 'there is'. বিক্ৰী (bikri), selling, is the thing that there is."
    bases:
      "আছে": "to be; there is; to have"
    confusables:
      "c1": { why: "Close in meaning, but a single deal rather than the sale." }
      "c2": { why: "A discount, a part of a sale." }
  "as-2664":
    native: "We choose an offer online."
    notes:
      "n1": "বাছোঁ (bāsum̐) is the 'I, we' present of বাছা (bāsā), 'to choose': the stem বাছ- (bās-) takes -ওঁ (-um̐). অনলাইনত (ônôlāinôt) is অনলাইন (ônôlāin), online, plus -ত (-t), 'on'."
    confusables:
      "c1": { why: "A shop, not the internet." }
      "c2": { why: "A market, not online." }
  "as-2665":
    native: "If the size is right, I will buy it."
    notes:
      "n1": "হ'লে (hole), 'if it is', is from হোৱা (huwā), 'to be, become': the stem is হ- (ho-) and -লে (-le) makes 'if'. The 'if' part comes before the main verb কিনিম (kinim), 'I will buy'."
    bases:
      "হ'লে": "to become; to be"
    confusables:
      "c1": { why: "To sell, not to buy." }
      "c2": { why: "Another, not the size." }
  "as-2666":
    native: "How much is still owed?"
    confusables:
      "c1": { why: "A discount, not what is still owed." }
      "c2": { why: "Back, not what is owed." }
