schema: 1
id: "as-en-abstract-words"
kind: "layer"
core: "as-abstract-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Abstract words: ideas, values, feelings and duty"
license: "CC-BY-SA-4.0"
description: "The words for ideas and values that people talk about: justice and honesty, duty and dignity, peace and unity, and what is right to do. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3926":
    native: "religion; duty; righteousness"
    notes:
      "n1": "The faith a person follows, and also the right way of living."
    examples:
      "ধৰ্ম ভাল।": "Religion is good."
      "ধৰ্ম মানা।": { native: "To follow one's faith.", bases: { "মানা": "to obey; to accept" } }
  "as-3927":
    native: "ethics; morals; policy"
    notes:
      "n1": "The rules of good behaviour that a person keeps."
    examples:
      "নীতি ভাল।": "The morals are good."
      "নীতি বহুত।": "There are many rules of conduct."
  "as-3928":
    native: "equality"
    notes:
      "n1": "The state of being equal with others."
    examples:
      "সমতা ভাল।": "Equality is good."
      "সমতা দৰকাৰ।": "Equality is needed."
  "as-3929":
    native: "peace"
    notes:
      "n1": "The state of calm without war or fighting."
    examples:
      "শান্তি ভাল।": "Peace is good."
      "শান্তি আছে।": { native: "There is peace.", bases: { "আছে": "to be; there is; to have" } }
  "as-3930":
    native: "unity"
    notes:
      "n1": "Being together and of one mind."
    examples:
      "একতা ভাল।": "Unity is good."
      "একতা দৰকাৰ।": "Unity is needed."
  "as-3931":
    native: "dignity; honour"
    notes:
      "n1": "The respect a person deserves for being who they are."
    examples:
      "মৰ্যাদা ভাল।": "Dignity is good."
      "মৰ্যাদা ৰখা।": "To keep one's dignity."
  "as-3932":
    native: "honesty"
    notes:
      "n1": "The quality of always telling the truth and acting fairly."
    examples:
      "সততা ভাল।": "Honesty is good."
      "সততা বহুত দৰকাৰ।": "Honesty is very much needed."
  "as-3933":
    native: "humility; modesty"
    notes:
      "n1": "Not boasting; treating others with respect."
    examples:
      "বিনয় ভাল।": "Humility is good."
      "তেওঁৰ বিনয় আছে।": { native: "He has humility.", bases: { "আছে": "to be; there is; to have" } }
  "as-3934":
    native: "gratitude; thankfulness"
    notes:
      "n1": "Feeling and showing thanks for what was given."
    examples:
      "কৃতজ্ঞতা ভাল।": "Gratitude is good."
      "কৃতজ্ঞতা জনাওঁ।": "I show my gratitude."
  "as-3935":
    native: "curiosity"
    notes:
      "n1": "The wish to know and to learn about things."
    examples:
      "কৌতূহল বহুত।": "There is a lot of curiosity."
      "কৌতূহল ভাল।": "Curiosity is good."
  "as-3936":
    native: "pride; arrogance"
    notes:
      "n1": "Too high an opinion of oneself. Not the same as গৰ্ব (gôrbô), healthy pride."
    examples:
      "অহংকাৰ বেয়া।": "Arrogance is bad."
      "তাৰ অহংকাৰ বহুত।": "He has much arrogance."
  "as-3937":
    native: "greed; desire for more"
    notes:
      "n1": "A strong wish to have more than you need."
    examples:
      "লোভ বেয়া।": "Greed is bad."
      "লোভ নকৰিবা।": "Do not be greedy."
  "as-3938":
    native: "tolerance"
    notes:
      "n1": "Accepting others who are different from you."
    examples:
      "সহিষ্ণুতা ভাল।": "Tolerance is good."
      "সহিষ্ণুতা দৰকাৰ।": "Tolerance is needed."
  "as-3939":
    native: "generosity"
    notes:
      "n1": "Giving freely to others, and being open-hearted."
    examples:
      "উদাৰতা ভাল।": "Generosity is good."
      "তেওঁৰ উদাৰতা আছে।": { native: "He has generosity.", bases: { "আছে": "to be; there is; to have" } }
  "as-3940":
    native: "courage"
    notes:
      "n1": "Being brave when there is danger or fear."
    examples:
      "সাহস ভাল।": "Courage is good."
      "সাহস আছে।": { native: "There is courage.", bases: { "আছে": "to be; there is; to have" } }
  "as-3941":
    native: "determination; resolve"
    notes:
      "n1": "A firm decision to achieve a goal."
    examples:
      "সংকল্প ডাঙৰ।": "The resolve is strong."
      "সংকল্প আছে।": { native: "There is resolve.", bases: { "আছে": "to be; there is; to have" } }
  "as-3942":
    native: "values; principles"
    notes:
      "n1": "The beliefs that guide how a person behaves."
    examples:
      "মূল্যবোধ ভাল।": "The values are good."
      "মূল্যবোধ বহুত।": "There are many values."
  "as-3943":
    native: "moral; ethical"
    notes:
      "n1": "Of right and wrong in behaviour."
    examples:
      "নৈতিক কাম।": "A moral act."
      "এইটো নৈতিক।": "This is moral."
  "as-3944":
    native: "brotherhood; fellowship"
    notes:
      "n1": "The feeling of being like brothers to one another."
    examples:
      "ভ্ৰাতৃত্ব ভাল।": "Brotherhood is good."
      "ভ্ৰাতৃত্ব বহুত।": "There is much brotherhood."
  "as-3945":
    native: "ideal; example to follow"
    notes:
      "n1": "A model of how one should be."
    examples:
      "আদৰ্শ ভাল।": "The ideal is good."
      "আদৰ্শ মানুহ।": "An ideal person."
