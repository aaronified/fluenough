id: "as-en-illness-sentences"
kind: "layer"
core: "as-illness-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Illness and the doctor: sentences"
license: "CC-BY-SA-4.0"
description: "Sentences built from the words of this unit and the ones before it. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-2693":
    native: "I have a headache."
    notes:
      "n1": "Pain is placed 'in' the body part: মূৰত বিষ (murôt bix) is literally 'in the head pain'. মোৰ (mur), 'my', comes first and no verb is needed."
    confusables:
      "c1": { why: "A belly ache, not a head ache." }
      "c2": { why: "The head, not the ache." }
  "as-2694":
    native: "You will take the medicine."
    notes:
      "n1": "খাবা (khābā) is the future 'you' form of খোৱা (khuwā), 'to eat': the stem becomes খা- (khā-). Assamese 'eats' medicine where English says 'take' it."
    confusables:
      "c1": { why: "To lie down, not to take medicine." }
      "c2": { why: "To come, not to take medicine." }
  "as-2695":
    native: "The doctor has come."
    notes:
      "n1": "আহিছে (āhise) is from অহা (ôhā), 'to come', whose stem changes to আহ- (āh-)."
    confusables:
      "c1": { why: "The patient, not the doctor." }
      "c2": { why: "A nurse, not the doctor." }
  "as-2696":
    native: "I am in hospital."
    notes:
      "n1": "হস্পিতালত (hospitālôt), 'in hospital', takes -ত (-t). আছোঁ (āsum̐) is the 'I' form of 'to be' for being at a place."
    bases:
      "আছোঁ": "to be; there is; to have"
      "হস্পিতালত": "hospital"
    confusables:
      "c1": { why: "A clinic, a smaller place than a hospital." }
      "c2": { why: "Home, not a hospital." }
  "as-2697":
    native: "I have a fever."
    notes:
      "n1": "মোৰ গা জ্বৰ (mur gā zôr) is literally 'my body fever'. গা (gā) is 'body' and no verb is needed."
    confusables:
      "c1": { why: "A cold, not a fever." }
      "c2": { why: "A cough, not a fever." }
  "as-2698":
    native: "Take a rest."
    notes:
      "n1": "বিশ্ৰাম লোৱা (bixrām luwā) is literally 'take rest'. The dictionary form of লোৱা (luwā) works as the command."
    confusables:
      "c1": { why: "Work, the opposite of rest." }
      "c2": { why: "To go, not to rest." }
  "as-2699":
    native: "He is well now."
    confusables:
      "c1": { why: "Ill, the opposite of well." }
      "c2": { why: "Weak, not yet recovered." }
  "as-2700":
    native: "Take two tablets."
    notes:
      "n1": "খাবা (khābā) is from খোৱা (khuwā), 'to eat', whose stem becomes খা- (khā-). The number and classifier come first: দুটা (dutā), two."
    confusables:
      "c1": { why: "A fox, nothing to do with a pill." }
      "c2": { why: "A chilli, not a tablet." }
