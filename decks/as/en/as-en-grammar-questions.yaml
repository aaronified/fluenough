schema: 1
id: "as-en-grammar-questions"
kind: "layer"
core: "as-grammar-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Basic questions"
license: "CC0-1.0"
description: "Yes/no questions with -নে (-ne) and নেকি (neki), and question words. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-2029":
    native: "Do you know Assamese?"
    notes:
      "n1": "-নে (-ne) at the end of the verb makes a yes/no question."
    bases:
      "জানেনে": "to know"
  "as-2030":
    native: "Will you have tea?"
    notes:
      "n1": "To someone you respect. To a friend, চাহ খাবানে? (sah khabane?)"
  "as-2031":
    native: "What is this?"
    notes:
      "n1": "The question word goes where the answer would: এইটো কিতাপ (eitu kitāp), this is a book."
    bases:
      "এইটো": "this"
  "as-2032":
    native: "Where are you going?"
    notes:
      "n1": "ক (kô)'লৈ (lôi), 'to where', from ক (kô)'ত (tô), 'where'. The apostrophe marks the vowel o."
    bases:
      "তুমি": "you (familiar)"
      "গৈ": "to go"
      "আছা": "to be; to have"
      "ক'লৈ": "where"
  "as-2033":
    native: "Who is he? / Who is she?"
    notes:
      "n1": "তেওঁ (teum̐) is a respectful 'he' or 'she'."
    bases:
      "তেওঁ": "he; she"
  "as-2034":
    native: "When will you come?"
    bases:
      "আহিব": "to come"
  "as-2035":
    native: "Why are you learning Assamese?"
    bases:
      "শিকি": "to learn"
      "আছে": "to be; to have"
  "as-2036":
    native: "How many children do you have?"
    notes:
      "n1": "কেইজন (keizôn), 'how many people': কেই- (kei-), how many, with -জন (-zôn), the classifier for people. For things, কেইটা (keitā) or কেইখন (keikhôn)."
  "as-2037":
    native: "How much is it?"
    notes:
      "n1": "In a shop: 'how much has it come to?' কিমান (kimān) is 'how much'."
    bases:
      "হ'ল": "to be; to become"
  "as-2038":
    native: "How are you? (respectful)"
    notes:
      "n1": "To a friend, কেনে আছা? (kene asa?) The answer: ভালে আছোঁ (bhāle āsum̐), I'm well."
    bases:
      "কেনে": "how"
      "আছে": "to be; to have"
  "as-2039":
    native: "It's good, isn't it?"
    notes:
      "n1": "নহয়নে (nôhôyône), 'isn't it', at the end asks for agreement."
  "as-2040":
    native: "Have you eaten?"
    notes:
      "n1": "নেকি (neki) after the verb is another way to ask yes or no, common in speech. Asking whether someone has eaten is an everyday greeting."
