schema: 1
id: "as-en-verbs-5"
kind: "layer"
core: "as-verbs-5"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sequence actions: what happened next"
license: "CC-BY-SA-4.0"
description: "The verbs of a long story told in order: to lift and to join, to spread out and to stand, to finish and to begin again, one step after the next. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-4046":
    native: "to lift; to pick up"
    notes:
      "n1": "To lift a thing up, or to pick something from the ground."
    examples:
      "বাটি তোলা।": "Lift the bowl."
      "তাই বল তুলিলে।": { native: "She picked up the ball.", bases: { "তুলিলে": "to lift; to pick up" } }
  "as-4047":
    native: "to join; to tie together"
    notes:
      "n1": "To join two things, or to tie them with string."
    examples:
      "দুটা কাপোৰ জোৰা।": "Join the two cloths."
      "তেওঁ দড়ি জোৰে।": { native: "He ties the rope together.", bases: { "দড়ি": "rope; string", "জোৰে": "to join; to tie" } }
  "as-4048":
    native: "to spread out"
    notes:
      "n1": "To lay something flat, such as a mat or a cloth."
    examples:
      "চাদৰ পাতা।": "Spread the sheet."
      "তাই চাদৰ পাতিলে।": { native: "She spread the sheet.", bases: { "পাতিলে": "to spread" } }
  "as-4049":
    native: "to stand up"
    notes:
      "n1": "To rise to one's feet from sitting or lying."
    bases:
      "থিয়": "standing"
      "হোৱা": "to become; to be"
    examples:
  "as-4050":
    native: "to empty"
    notes:
      "n1": "To make a place or a container empty."
    examples:
  "as-4051":
    native: "at the end; finally"
    notes:
      "n1": "The last of the steps in a story or a list."
    examples:
      "শেষত ভাল হ'ল।": { native: "At the end it turned out well.", bases: { "হ'ল": "to become; to be" } }
      "শেষত আহিলোঁ।": "Finally I came."
  "as-4052":
    native: "after that"
    notes:
      "n1": "The word that joins one step to the next."
    examples:
  "as-4053":
    native: "first; at first"
    notes:
      "n1": "The first step in a sequence."
    examples:
      "প্ৰথমে বহা।": "First, sit down."
      "প্ৰথমে কাম কৰা।": "First, do the work."
  "as-4054":
    native: "before that"
    notes:
      "n1": "The step before the one just named."
    examples:
  "as-4055":
    native: "together"
    notes:
      "n1": "With another person, at the same time."
    examples:
      "আমি একেলগে যাওঁ।": "We go together."
      "তেওঁলোক একেলগে খায়।": "They eat together."
  "as-4056":
    native: "beginning; start"
    notes:
      "n1": "The first part of a task or a story. The opposite is শেষ (xes), the end."
    examples:
      "আৰম্ভ ভাল।": "The beginning is good."
      "আৰম্ভত বৰষুণ।": { native: "In the beginning, rain.", bases: { "আৰম্ভত": "beginning; start" } }
  "as-4057":
    native: "again"
    notes:
      "n1": "One more time after the first try."
    examples:
      "পুনৰ যাওঁ।": "I go again."
      "পুনৰ আহিবা।": "You will come again."
  "as-4058":
    native: "finished; completed"
    notes:
      "n1": "Of a task that is done."
    examples:
      "কাম সমাপ্ত।": "The work is finished."
      "গল্প সমাপ্ত।": "The story is finished."
  "as-4059":
    native: "slowly; gently"
    notes:
      "n1": "Taken at a slow and careful pace. Also written লাহে (lāhe)."
    examples:
      "ধীৰে যাওঁ।": "I go slowly."
      "ধীৰে কওক।": "Please say it slowly."
  "as-4060":
    native: "quickly; fast"
    notes:
      "n1": "With speed. The opposite is ধীৰে (dhīrē)."
    examples:
      "দ্ৰুত দৌৰোঁ।": "I run fast."
      "দ্ৰুত আহা।": "Come quickly."
  "as-4061":
    native: "afterwards"
    notes:
      "n1": "After that, later on."
    examples:
