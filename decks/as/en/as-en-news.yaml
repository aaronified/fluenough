schema: 1
id: "as-en-news"
kind: "layer"
core: "as-news"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "News: papers, reporters, elections and warnings"
license: "CC-BY-SA-4.0"
description: "The news of the day: the paper, the reporter, the election, the warning and the headline. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3242":
    native: "news (formal)"
    notes:
      "n1": "The formal word for news. Everyday people say বাতৰি (bātôri)."
    examples:
      "আজিৰ সমাচাৰ।": "Today's news."
      "সমাচাৰ ভাল।": "The news is good."
  "as-3243":
    native: "newspaper"
    notes:
      "n1": "A paper of news printed each day."
    examples:
      "কাকত আহিছে।": "The newspaper has come."
      "কাকতত সমাচাৰ।": { native: "News in the newspaper.", bases: { "কাকতত": "newspaper" } }
  "as-3244":
    native: "editor"
    notes:
      "n1": "The person who decides what goes into a newspaper."
    examples:
      "সম্পাদক ব্যস্ত।": "The editor is busy."
      "সম্পাদক আহিছে।": "The editor has come."
  "as-3245":
    native: "journalist; reporter"
    notes:
      "n1": "A person who writes the news."
    examples:
      "সাংবাদিক আহিছে।": "The reporter has come."
      "সাংবাদিক বহুত।": "There are many reporters."
  "as-3246":
    native: "election"
    notes:
      "n1": "The vote in which people choose their leaders."
    examples:
      "নিৰ্বাচন আহিছে।": "The election is coming."
      "নিৰ্বাচন বহুত ডাঙৰ।": "The election is very big."
  "as-3247":
    native: "vote"
    notes:
      "n1": "The choice a person makes in an election."
    examples:
      "ভোট দিয়া।": "To give a vote."
      "ভোট বহুত।": "There are many votes."
  "as-3248":
    native: "warning"
    notes:
      "n1": "A notice that says danger may come."
    examples:
      "সতৰ্কবাণী আছে।": { native: "There is a warning.", bases: { "আছে": "to be; there is; to have" } }
      "সতৰ্কবাণী ভাল।": "The warning is good."
  "as-3249":
    native: "headline"
    notes:
      "n1": "The big title at the top of a news story."
    examples:
      "শিৰোনাম ডাঙৰ।": "The headline is big."
      "শিৰোনামটো ভাল।": { native: "The headline is good.", bases: { "শিৰোনামটো": "headline" } }
  "as-3250":
    native: "news; information"
    notes:
      "n1": "A piece of news. Also used for a message."
    examples:
      "খবৰ ভাল।": "The news is good."
      "খবৰ পাইছোঁ।": { native: "I have got the news.", bases: { "পাইছোঁ": "to get; to receive" } }
  "as-3251":
    native: "national news"
    notes:
      "n1": "News of the whole country."
    examples:
  "as-3252":
    native: "today's news"
    notes:
      "n1": "The news of today."
    examples:
  "as-3253":
    native: "radio"
    notes:
      "n1": "The machine that brings sound and news. Written as said in English."
    examples:
      "ৰেডিঅ বাজে।": { native: "The radio is playing.", bases: { "বাজে": "to play; to sound; to ring" } }
      "ৰেডিঅ নতুন।": "The radio is new."
  "as-3254":
    native: "television"
    notes:
      "n1": "The screen that shows news and films. Written as said in English."
    examples:
      "টেলিভিচন চলিছে।": "The television is on."
      "টেলিভিচন ডাঙৰ।": "The television is big."
  "as-3255":
    native: "to walk; to move; to run (of a machine)"
    notes:
      "n1": "Of a machine that is on, or a person walking."
    examples:
      "টেলিভিচন চলে।": { native: "The television runs.", bases: { "চলে": "to walk; to move" } }
      "মই চলোঁ।": { native: "I walk.", bases: { "চলোঁ": "to walk; to move" } }
  "as-3256":
    native: "description; detail; account"
    notes:
      "n1": "A full account of what happened."
    examples:
      "বিবৰণ ভাল।": "The account is good."
      "বিবৰণ লিখিছোঁ।": "I have written the account."
  "as-3257":
    native: "event; incident"
    notes:
      "n1": "Something that happened."
    examples:
      "ঘটনা ভাল।": "The event is good."
      "ঘটনা ডাঙৰ।": "The incident is big."
  "as-3258":
    native: "interview"
    notes:
      "n1": "A talk in which a reporter asks questions."
    examples:
      "সাক্ষাৎকাৰ আছে।": { native: "There is an interview.", bases: { "আছে": "to be; there is; to have" } }
      "সাক্ষাৎকাৰ ভাল।": "The interview is good."
