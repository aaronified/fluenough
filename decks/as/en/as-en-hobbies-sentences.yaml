tags: ["unreviewed"]
cards:
  "as-2818":
    native: "I play football every week."
    notes:
      "n1": "প্ৰতি (proti), 'every', comes before the time word: প্ৰতি সপ্তাহে (proti xôptāhe), every week. খেলোঁ (khelum̐) is the 'I' present of খেলা (khelā), 'to play'."
    bases:
      "প্ৰতি": "each; every"
    confusables:
      "c1": { why: "To swim, not to play football." }
      "c2": { why: "To sing, not to play." }
  "as-2819":
    native: "She plays the flute."
    notes:
      "n1": "বজায় (bôzāy) is from বজোৱা (bôzuwā), 'to play an instrument', whose stem becomes বজা- (bôzā-). বাঁহী (bām̐hi) is the flute."
    confusables:
      "c1": { why: "A guitar, a different instrument." }
      "c2": { why: "A picture, not an instrument." }
  "as-2820":
    native: "We go to the club."
    notes:
      "n1": "-লৈ (-lôi), 'to', marks where you are going: ক্লাবলৈ (klābôlôi), to the club."
    confusables:
      "c1": { why: "The school, not the club." }
      "c2": { why: "The garden, not the club." }
  "as-2821":
    native: "This is a red picture."
    confusables:
      "c1": { why: "Blue, a different colour." }
      "c2": { why: "White, a different colour." }
  "as-2822":
    native: "I have heard a story."
    notes:
      "n1": "শুনিছোঁ (xunisum̐) is the stem শুন- (xun-) of শুনা (xunā), 'to hear', plus -িছোঁ (-isum̐). গল্প শুনা (gôlp xunā) is 'to listen to a story'."
    confusables:
      "c1": { why: "A joke, not a long story." }
      "c2": { why: "A song, not a story." }
  "as-2823":
    native: "We won at football."
    notes:
      "n1": "জয় পালোঁ (zôy pālum̐) is literally 'got victory'. পালোঁ (pālum̐) is from পোৱা (puwā), 'to get', with the stem পা- (pā-)."
    bases:
      "পালোঁ": "to get; to receive"
    confusables:
      "c1": { why: "Defeat, the opposite of winning." }
      "c2": { why: "A contest, not the result." }
  "as-2824":
    native: "I like music."
    notes:
      "n1": "ভাল লাগে (bhāl lāge) is literally 'good is felt': the thing liked, সংগীত (xoṅgit), music, comes first."
    confusables:
      "c1": { why: "A game, not music." }
      "c2": { why: "Interest, a feeling, not music." }
  "as-2825":
    native: "Flowers bloom in the garden."
    notes:
      "n1": "বাগানত (bāgānôt) is 'in the garden'. ফুটে (phute) is from ফুটা (phutā), 'to bloom', with the stem ফুট- (phut-)."
    bases:
      "ফুটে": "to bloom; to open"
    confusables:
      "c1": { why: "Colour, not a garden." }
      "c2": { why: "A trip, not a garden." }
