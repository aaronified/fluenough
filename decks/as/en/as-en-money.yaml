schema: 1
id: "as-en-money"
kind: "layer"
core: "as-money"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Money: banks, bills, prices and payment"
license: "CC-BY-SA-4.0"
description: "Handling money: the bank, the savings, the income and the expense, the bill and the receipt, the debt and the payment. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3960":
    native: "wealth; riches"
    notes:
      "n1": "Money and property that a person owns."
    examples:
      "ধন বহুত।": "There is a lot of wealth."
      "ধন বেছি মানুহ।": "A rich person."
  "as-3961":
    native: "income"
    notes:
      "n1": "The money a person earns each month."
    examples:
      "আয় বেছি।": "The income is high."
      "মোৰ আয় কম।": "My income is low."
  "as-3962":
    native: "expense; spending"
    notes:
      "n1": "The money spent on things."
    examples:
      "ব্যয় বেছি।": "The spending is high."
      "ব্যয় কম।": "The spending is low."
  "as-3963":
    native: "savings"
    notes:
      "n1": "The money kept aside for later."
    examples:
      "সঞ্চয় ভাল।": "Savings are good."
      "সঞ্চয় কৰা।": "To save money."
  "as-3964":
    native: "budget"
    notes:
      "n1": "A plan of how money will be earned and spent. Written as said in English."
    examples:
      "বজেট ঠিক।": "The budget is right."
      "বজেট বনোৱা।": { native: "To make a budget.", bases: { "বনোৱা": "to build; to make" } }
  "as-3965":
    native: "loan; borrowing"
    notes:
      "n1": "Money borrowed from someone else, to be paid back."
    examples:
      "উধাৰ লোৱা।": "To take a loan."
      "উধাৰ বহুত।": "There is a lot of borrowing."
  "as-3966":
    native: "debt"
    notes:
      "n1": "Money owed to someone, to be paid back later."
    examples:
      "ধাৰ আছে।": { native: "There is a debt.", bases: { "আছে": "to be; there is; to have" } }
      "ধাৰ শোধ কৰা।": { native: "To pay off a debt.", bases: { "শোধ": "repayment; payment off" } }
  "as-3967":
    native: "tax"
    notes:
      "n1": "The money the state takes from income and goods."
    examples:
      "কৰ বেছি।": "The tax is high."
      "কৰ দিয়া।": "To pay tax."
  "as-3968":
    native: "currency; coin"
    notes:
      "n1": "The money of a country, in coins and notes."
    examples:
      "মুদ্ৰা নতুন।": "The currency is new."
      "মুদ্ৰা বহুত।": "There is a lot of currency."
  "as-3969":
    native: "ATM (cash machine)"
    notes:
      "n1": "The machine at a bank that gives cash. Written as said in English."
    examples:
      "এটিএম আছে।": { native: "There is an ATM.", bases: { "আছে": "to be; there is; to have" } }
      "এটিএম খালী।": "The ATM is empty."
  "as-3970":
    native: "receipt"
    notes:
      "n1": "The paper that shows what was paid."
    examples:
      "ৰসিদ লোৱা।": "Take the receipt."
      "ৰসিদ নাই।": "There is no receipt."
  "as-3971":
    native: "charge; fee"
    notes:
      "n1": "The small payment for a service."
    examples:
      "মাচুল বেছি।": "The charge is high."
      "মাচুল কিমান?": "What is the charge?"
  "as-3973":
    native: "to borrow"
    notes:
      "n1": "To take money on loan from someone."
  "as-3974":
    native: "to save money"
    notes:
      "n1": "To put money aside in a bank."
    bases:
      "জমা": "deposit; saved"
  "as-3975":
    native: "to pay back a debt"
    notes:
      "n1": "To return the money one owes."
    bases:
      "শোধ": "repayment; payment off"
