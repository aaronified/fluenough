schema: 1
id: "as-en-verbs-4"
kind: "layer"
core: "as-verbs-4"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Story actions"
license: "CC-BY-SA-4.0"
description: "The verbs of a story: to leave, to enter, to be born, to live, to die, to chase, to think and to decide, with the people and creatures that act in folk tales. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3886":
    native: "to leave; to let go; to give up"
    notes:
      "n1": "To leave a place or a person, or to let something go."
    examples:
      "মই ঘৰ এৰিলোঁ।": { native: "I left the house.", bases: { "এৰিলোঁ": "to leave; to let go" } }
      "তাই মোক এৰিল।": { native: "She left me.", bases: { "এৰিল": "to leave; to let go" } }
  "as-3887":
    native: "to enter; to go in"
    notes:
      "n1": "To go into a place. The opposite is ওলোৱা (oluwā), to come out."
    examples:
      "সি কোঠাত ঢুকিল।": { native: "He entered the room.", bases: { "ঢুকিল": "to enter" } }
      "মই ঘৰত ঢুকোঁ।": { native: "I enter the house.", bases: { "ঢুকোঁ": "to enter" } }
  "as-3888":
    native: "to die"
    notes:
      "n1": "Of people, animals and plants."
    examples:
      "গছ মৰিল।": { native: "The tree died.", bases: { "মৰিল": "to die" } }
      "সি মৰে।": { native: "He dies.", bases: { "মৰে": "to die" } }
  "as-3889":
    native: "to be born"
    notes:
      "n1": "The start of life: জন্ম (zônmô), birth."
    examples:
      "তাই জন্মিল।": { native: "She was born.", bases: { "জন্মিল": "to be born" } }
      "শিশু জন্মে।": { native: "A child is born.", bases: { "জন্মে": "to be born" } }
  "as-3890":
    native: "to live; to survive"
    notes:
      "n1": "To remain alive, or to be saved from death."
    examples:
      "তেওঁ বাচিল।": { native: "He survived.", bases: { "বাচিল": "to live; to survive" } }
      "মই বাচোঁ।": { native: "I live.", bases: { "বাচোঁ": "to live; to survive" } }
  "as-3891":
    native: "to chase"
    notes:
      "n1": "To run after an animal or a person to catch or drive it away."
    examples:
      "কুকুৰ বিৰাল খেদে।": { native: "The dog chases the cat.", bases: { "খেদে": "to chase" } }
      "মানুহে বাঘ খেদিলে।": { native: "The people chased the tiger.", bases: { "খেদিলে": "to chase" } }
  "as-3892":
    native: "prince"
    notes:
      "n1": "The son of a king in a story."
    examples:
      "ৰাজকুমাৰ ধুনীয়া।": "The prince is handsome."
      "ৰাজকুমাৰ আহিছে।": "The prince has come."
  "as-3893":
    native: "princess"
    notes:
      "n1": "The daughter of a king in a story."
    examples:
      "ৰাজকুমাৰী ভাল।": "The princess is good."
      "ৰাজকুমাৰী আহিছে।": "The princess has come."
  "as-3894":
    native: "demon; ogre"
    notes:
      "n1": "A frightening being in folk tales."
    examples:
      "ৰাক্ষস বহুত ডাঙৰ।": "The demon is very big."
      "ৰাক্ষস মানুহ খায়।": "The demon eats people."
  "as-3895":
    native: "giant"
    notes:
      "n1": "A very big and strong being in old stories."
    examples:
      "দৈত্য ডাঙৰ।": "The giant is big."
      "দৈত্য আহিছে।": "The giant has come."
  "as-3896":
    native: "ghost; spirit"
    notes:
      "n1": "A spirit of a dead person in a story."
    examples:
      "ভূত আছে।": { native: "There is a ghost.", bases: { "আছে": "to be; there is; to have" } }
      "ভূত ভয় দেখায়।": "The ghost frightens."
  "as-3897":
    native: "to dare; to be brave"
    notes:
      "n1": "To act bravely in spite of fear."
    bases:
      "সাহস": "courage"
  "as-3898":
    native: "to end; to be finished"
    notes:
      "n1": "Of a story, a day or a task: to come to its end."
    bases:
      "শেষ": "end; last; finish"
      "হোৱা": "to become; to be"
  "as-3899":
    native: "birth"
    notes:
      "n1": "The start of life. The verb is জন্মা (zônmā)."
    examples:
      "জন্ম ভাল।": "Birth is good."
      "জন্ম বহুত ডাঙৰ।": "A birth is very big news."
