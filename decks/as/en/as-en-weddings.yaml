schema: 1
id: "as-en-weddings"
kind: "layer"
core: "as-weddings"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Weddings: the invitation, the rites and the guests"
license: "CC-BY-SA-4.0"
description: "A wedding in the family: the invitation, the bride and the groom, the blessing, the guests and the feast after the rites. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3677":
    native: "wedding; marriage"
    notes:
      "n1": "The marriage ceremony. To marry someone is বিয়া কৰা (biyā kôrā)."
    examples:
      "বিয়া আহিছে।": "The wedding is coming."
      "বিয়া ডাঙৰ।": "The wedding is big."
  "as-3678":
    native: "bride"
    notes:
      "n1": "The woman getting married. The groom is ডেকা (dekā)."
    examples:
      "কইনা ধুনীয়া।": "The bride is lovely."
      "কইনা আহিছে।": "The bride has come."
  "as-3679":
    native: "groom; young man"
    notes:
      "n1": "The man getting married. The bride is কইনা (koinā)."
    examples:
      "ডেকা ভাল।": "The groom is good."
      "ডেকা আহিছে।": "The groom has come."
  "as-3680":
    native: "invited guest"
    notes:
      "n1": "A person who has been asked to a wedding or a feast."
    examples:
      "নিমন্ত্ৰিত বহুত।": "There are many invited guests."
      "নিমন্ত্ৰিত আহিছে।": "The invited guests have come."
  "as-3681":
    native: "wedding party (groom's side)"
    notes:
      "n1": "The group that comes with the groom to the bride's house."
    examples:
      "বৰযাত্ৰী আহিছে।": "The wedding party has come."
      "বৰযাত্ৰী বহুত।": "The wedding party is large."
  "as-3682":
    native: "blessing"
    notes:
      "n1": "Good wishes given by elders at a wedding."
    examples:
      "আশীৰ্বাদ দিয়া।": "To give a blessing."
      "আশীৰ্বাদ ভাল।": "The blessing is good."
  "as-3683":
    native: "rite; custom"
    notes:
      "n1": "A custom followed at a ceremony."
    examples:
      "ৰীতি ভাল।": "The custom is good."
      "ৰীতি বহুত।": "There are many rites."
  "as-3684":
    native: "marriage (formal)"
    notes:
      "n1": "The formal word for marriage; in speech বিয়া (biyā)."
    examples:
      "বিবাহ শুভ।": "The marriage is auspicious."
      "বিবাহ হ'ল।": { native: "The marriage was done.", bases: { "হ'ল": "to become; to be" } }
  "as-3685":
    native: "priest"
    notes:
      "n1": "The person who performs a religious ceremony."
    examples:
      "পুৰোহিত আহিছে।": "The priest has come."
      "পুৰোহিত ভাল।": "The priest is good."
  "as-3686":
    native: "pavilion; wedding stage"
    notes:
      "n1": "The covered space where the wedding rites are done."
    examples:
      "মণ্ডপ ডাঙৰ।": "The pavilion is big."
      "মণ্ডপত ফুল।": { native: "Flowers at the pavilion.", bases: { "মণ্ডপত": "pavilion; wedding stage" } }
  "as-3687":
    native: "garland"
    notes:
      "n1": "A string of flowers put around the neck at a wedding."
    examples:
      "মালা ধুনীয়া।": "The garland is lovely."
      "ফুলৰ মালা।": "A garland of flowers."
  "as-3688":
    native: "witness"
    notes:
      "n1": "A person who sees and confirms a ceremony."
    examples:
      "সাক্ষী আছে।": { native: "There are witnesses.", bases: { "আছে": "to be; there is; to have" } }
      "সাক্ষী ভাল।": "The witness is good."
  "as-3689":
    native: "auspicious; good luck"
    notes:
      "n1": "Of a happy and lucky day or start."
    examples:
      "শুভ দিন।": "An auspicious day."
      "শুভ কাম।": "An auspicious act."
  "as-3690":
    native: "good wishes"
    notes:
      "n1": "Wishes for happiness given to the couple."
    examples:
      "শুভেচ্ছা লোৱা।": "To take good wishes."
      "শুভেচ্ছা বহুত।": "There are many good wishes."
  "as-3691":
    native: "to marry"
    notes:
      "n1": "To get married; the bride or groom is taken in marriage."
    examples:
  "as-3692":
    native: "wedding feast"
    notes:
      "n1": "The big meal after the rites."
    examples:
