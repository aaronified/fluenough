schema: 1
id: "as-en-addressing"
kind: "layer"
core: "as-addressing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Addressing people"
license: "CC-BY-SA-4.0"
description: "What to call a shopkeeper, a driver or an older woman: Assamese speakers address strangers as family, and add -দেউ (-deu) for respect. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0153":
    native: "elder brother (respectful); to a man a little older"
    notes:
      "n1": "ককাই (kôkāi), elder brother, with -দেউ (-deu), a mark of respect. In Guwahati many people say দাদা (dādā) to a shopkeeper or a driver: দাদা (dādā), কিমান হ (kimān hô)'ল (lô)? Friendly and polite at once."
    examples:
      "ককাইদেউ, কেনে আছে?": { native: "Elder brother, how are you?", bases: { "কেনে": "how", "আছে": "to be; to have" } }
      "মোৰ ককাইদেউ ইয়াত আছে।": { native: "My elder brother is here.", bases: { "আছে": "to be; to have" } }
  "as-0154":
    native: "elder sister (respectful); to a woman a little older"
    notes:
      "n1": "বাই (bāi), elder sister, with -দেউ (-deu). What you call a woman at a stall or a counter: বাইদেউ (bāideu), এইটো কিমান (eitu kimān)? How much is this?"
    examples:
      "বাইদেউ, কেনে আছে?": { native: "Elder sister, how are you?", bases: { "কেনে": "how", "আছে": "to be; to have" } }
      "মোৰ বাইদেউ ইয়াত আছে।": { native: "My elder sister is here.", bases: { "আছে": "to be; to have" } }
  "as-0155":
    native: "younger brother; to a younger man or a boy"
    notes:
      "n1": "To a waiter, or a boy at a shop. Warm, not rude."
  "as-0156":
    native: "younger sister; to a younger woman or a girl"
    notes:
      "n1": "The fond form; the plain word is ভনী (bhoni)."
  "as-0157":
    native: "uncle; to a man of your parents' age"
    notes:
      "n1": "Strictly your father's younger brother. With more respect, খুৰাদেউ (khurādeu)."
  "as-0158":
    native: "aunty; to a woman of your parents' age"
    notes:
      "n1": "Strictly the wife of খুৰা (khurā). In towns many say আণ্টি (ānti), from English aunty."
  "as-0159":
    native: "grandfather; to an old man"
    notes:
      "n1": "On either side, a father's father or a mother's father. Careful: ককাই (kôkāi), with -ই (-i), is an elder brother."
  "as-0160":
    native: "grandmother; to an old woman"
    notes:
      "n1": "On either side. আই (āi) alone is mother."
  "as-0161":
    native: "Mr; sir (after a man's name, respectful)"
    notes:
      "n1": "From ডাঙৰ (dāṅôr), big, great: বৰুৱা ডাঙৰীয়া (boruā dāṅoriyā), Mr Baruah. Formal: in speeches, letters and the news."
    examples:
      "মোহন ডাঙৰীয়া ইয়াত আছে।": { native: "Mr Mohon is here.", bases: { "মোহন": "Mohon (a name)", "আছে": "to be; to have" } }
      "ডাঙৰীয়া, আপুনি ভাল আছে নে?": { native: "Sir, are you well?", bases: { "আছে": "to be; there is; to have" } }
  "as-0162":
    native: "sir"
    notes:
      "n1": "From English, used in offices, shops and schools. Assamese writes English s with ছ (sô) or চ (sô)."
    examples:
      "ছাৰ, এইটো কি?": { native: "Sir, what is this?", bases: {  } }
      "ছাৰ, ইয়ালৈ আহক।": { native: "Sir, come here.", bases: { "ইয়ালৈ": "here (to here)", "আহক": "to come (polite)" } }
  "as-0163":
    native: "madam"
    examples:
      "মেডাম, এইটো কি?": { native: "Madam, what is this?", bases: {  } }
      "মেডাম, আপোনাৰ নাম?": { native: "Madam, your name?", bases: {  } }
  "as-0164":
    native: "friend"
    notes:
      "n1": "Also লগৰীয়া (lôgoriyā), a companion, the friend you go about with."
    examples:
      "সমবয়সী বন্ধু।": { native: "A friend of the same age.", bases: {  } }
      "সেইজন মোৰ বন্ধু।": { native: "That person is my friend.", bases: { "বন্ধু": "friend", "সেইজন": "that person", "মোৰ": "my" } }
  "as-0165":
    native: "excuse me; listen (to get attention)"
    notes:
      "n1": "The polite request form of শুনা (xunā), to hear: 'please listen'. Often with a word of family: শুনক (xunôk), বাইদেউ (bāideu)."
    examples:
      "শুনক, ছাৰ।": { native: "Excuse me, sir.", bases: {  } }
      "শুনক, এইটো কি?": { native: "Excuse me, what is this?", bases: {  } }
