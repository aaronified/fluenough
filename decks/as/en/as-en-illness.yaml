schema: 1
id: "as-en-illness"
kind: "layer"
core: "as-illness"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Illness and the doctor"
license: "CC-BY-SA-4.0"
description: "Feeling unwell, the pain, the fever and the cough, and telling a doctor or a chemist what is wrong. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-2673":
    native: "fever"
    notes:
      "n1": "The word for a fever, and for feeling feverish: গা জ্বৰ (gā zwôr), a hot body."
    examples:
      "মোৰ জ্বৰ আছে।": { native: "I have a fever.", bases: { "আছে": "to be; there is; to have" } }
      "জ্বৰত শুই থকা।": { native: "To lie down with a fever.", bases: { "জ্বৰত": "fever" } }
  "as-2674":
    native: "cough"
    notes:
      "n1": "A dry or wet cough. To cough is কাহি (kāhi)."
    examples:
      "কাহ বহুত।": "There is a lot of coughing."
      "মোৰ কাহ আছে।": { native: "I have a cough.", bases: { "আছে": "to be; there is; to have" } }
  "as-2675":
    native: "cold (the illness); runny nose"
    notes:
      "n1": "The illness of a cold, with a blocked or runny nose."
    examples:
      "মোৰ সৰ্দি লাগিছে।": { native: "I have caught a cold.", bases: { "লাগিছে": "to be needed; to feel like" } }
      "সৰ্দি ভাল নহয়।": "A cold is not good."
  "as-2676":
    native: "ill; unwell"
    notes:
      "n1": "The opposite is সুস্থ (xusthô), well."
    examples:
      "মই অসুস্থ।": "I am ill."
      "তেওঁ অসুস্থ।": "He is unwell."
  "as-2677":
    native: "well; healthy; recovered"
    notes:
      "n1": "The opposite of অসুস্থ (ônxusthô)."
    examples:
      "মই সুস্থ।": "I am well."
      "এতিয়া সুস্থ।": "Now he is well."
  "as-2678":
    native: "illness; disease"
    notes:
      "n1": "The word for any illness, from a cold to a serious disease."
    examples:
      "এইটো ৰোগ নহয়।": "This is not an illness."
      "ৰোগ বহুত।": "There are many illnesses."
  "as-2679":
    native: "patient; sick person"
    notes:
      "n1": "A person who is ill and being cared for."
    examples:
      "ৰোগী শুই আছে।": { native: "The patient is lying down.", bases: { "আছে": "to be; there is; to have" } }
      "ৰোগী ভাল আছে।": { native: "The patient is well.", bases: { "আছে": "to be; there is; to have" } }
  "as-2680":
    native: "medicine (formal)"
    notes:
      "n1": "The formal word for medicine; in speech people say দৰব (dôrôb)."
    examples:
      "ঔষধ আছে।": { native: "There is medicine.", bases: { "আছে": "to be; there is; to have" } }
      "ঔষধ খাবা।": "You will take the medicine."
  "as-2681":
    native: "tablet; pill"
    notes:
      "n1": "A small round medicine to swallow."
    examples:
      "বটী দুটা খাবা।": "Take two tablets."
      "বটী সৰু।": "The tablet is small."
  "as-2682":
    native: "wound; sore"
    notes:
      "n1": "A cut or a sore on the skin."
    examples:
      "হাতত ঘা।": "A wound on the hand."
      "ঘা বহুত।": "There is a big wound."
  "as-2683":
    native: "vomit; sickness"
    notes:
      "n1": "To be sick is বমি কৰা (bômi kôrā)."
    examples:
      "বমি হৈছে।": { native: "I am being sick.", bases: { "হৈছে": "to become; to be" } }
      "বমি বহুত।": "There is a lot of vomit."
  "as-2684":
    native: "weak"
    notes:
      "n1": "Without strength, after an illness."
    examples:
      "মই দুৰ্বল।": "I am weak."
      "ৰোগীজন দুৰ্বল।": "The patient is weak."
  "as-2685":
    native: "breath"
    notes:
      "n1": "Breathing. To be short of breath is শ্বাস নোপোৱা (xwās nopuwā)."
    examples:
      "শ্বাস ভাল।": "The breathing is fine."
      "মোৰ শ্বাস ভাৰী।": "My breathing is heavy."
  "as-2686":
    native: "pain; hardship; discomfort"
    notes:
      "n1": "A general discomfort in the body."
    examples:
      "মোৰ কষ্ট বহুত।": "I am in a lot of pain."
      "কষ্ট নাই।": "There is no discomfort."
  "as-2687":
    native: "rest"
    notes:
      "n1": "The rest a sick person needs. To rest is বিশ্ৰাম কৰা (bixrām kôrā)."
    examples:
      "বিশ্ৰাম লোৱা।": "Take a rest."
      "বিশ্ৰাম ভাল।": "Rest is good."
  "as-2688":
    native: "test; examination"
    notes:
      "n1": "A doctor’s test: a check of blood or the body."
    examples:
      "পৰীক্ষা কৰিব।": "The doctor will test."
      "পৰীক্ষাৰ ফল।": { native: "The result of the test.", bases: { "পৰীক্ষাৰ": "test; examination" } }
  "as-2689":
    native: "report; test result"
    notes:
      "n1": "A written result from a clinic or a lab. Written as said in English."
    examples:
      "ৰিপোৰ্ট আছে।": { native: "There is the report.", bases: { "আছে": "to be; there is; to have" } }
      "ৰিপোৰ্ট ভাল।": "The report is good."
  "as-2690":
    native: "injection"
    notes:
      "n1": "An injection given by a doctor or a nurse. Written as said in English."
    examples:
      "ইনজেকচন দিব।": "They will give an injection."
      "ইনজেকচন বেয়া লাগে।": "An injection feels bad."
  "as-2691":
    native: "fever (a hot body)"
    notes:
      "n1": "The phrase for a fever, said of the whole body."
    examples:
  "as-2692":
    native: "to feel dizzy"
    notes:
      "n1": "Literally a head that turns: the feeling of spinning before a faint."
