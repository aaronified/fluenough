schema: 1
id: "as-en-history"
kind: "layer"
core: "as-history"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "History: kings, forts, wars and heritage"
license: "CC-BY-SA-4.0"
description: "The past of a place: its kings and queens, its forts and battles, its heritage and the ancestors who built it. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3643":
    native: "history"
    notes:
      "n1": "The record of what happened in the past. As a school subject: ইতিহাস পঢ়া (itihās pôrhā), to study history."
    examples:
      "ইতিহাস ডাঙৰ।": "History is big."
      "ইতিহাস ভাল লাগে।": "I like history."
  "as-3644":
    native: "king"
    notes:
      "n1": "The man who rules a kingdom. The queen is ৰাণী (rāṇī)."
    examples:
      "ৰজা আহিছে।": "The king has come."
      "ৰজা বহুত ডাঙৰ।": "The king was very great."
  "as-3645":
    native: "queen"
    notes:
      "n1": "The woman who rules or who is the wife of a king."
    examples:
      "ৰাণী ধুনীয়া।": "The queen is lovely."
      "ৰাণী আহিছে।": "The queen has come."
  "as-3646":
    native: "war; battle"
    notes:
      "n1": "A fight between armies."
    examples:
      "যুদ্ধ বেয়া।": "War is bad."
      "যুদ্ধ হৈছিল।": { native: "There was a war.", bases: { "হৈছিল": "to become; to be" } }
  "as-3647":
    native: "reign; rule of a king"
    notes:
      "n1": "The years a king rules."
    examples:
      "ৰাজত্ব দীঘল।": "The reign was long."
      "ৰাজত্ব ভাল।": "The reign was good."
  "as-3648":
    native: "fort"
    notes:
      "n1": "A strong building with high walls to defend a place."
    examples:
      "দুৰ্গ ডাঙৰ।": "The fort is big."
      "দুৰ্গত ৰজা।": { native: "The king is in the fort.", bases: { "দুৰ্গত": "fort" } }
  "as-3649":
    native: "heritage"
    notes:
      "n1": "The old things and customs a people keeps from the past."
    examples:
      "ঐতিহ্য ধুনীয়া।": "The heritage is lovely."
      "ঐতিহ্য বহুত।": "There is a lot of heritage."
  "as-3650":
    native: "freedom; independence"
    notes:
      "n1": "The state of being free to rule oneself."
    examples:
      "স্বাধীনতা ভাল।": "Freedom is good."
      "স্বাধীনতা দিন।": "Independence Day."
  "as-3651":
    native: "ancestor"
    notes:
      "n1": "The people who lived before us, from whom we descend."
    examples:
      "পূৰ্বপুৰুষ বহুত।": "There were many ancestors."
      "পূৰ্বপুৰুষৰ গাঁও।": { native: "The village of our ancestors.", bases: { "পূৰ্বপুৰুষৰ": "ancestor" } }
  "as-3652":
    native: "rule; governance"
    notes:
      "n1": "The power to govern a land."
    examples:
      "শাসন ভাল।": "The rule is good."
      "শাসন বহুত।": "The rule was long."
  "as-3653":
    native: "attack; invasion"
    notes:
      "n1": "An armed attack on a place."
    examples:
      "আক্ৰমণ হৈছিল।": { native: "There was an attack.", bases: { "হৈছিল": "to become; to be" } }
      "আক্ৰমণ বেয়া।": "The attack is bad."
  "as-3654":
    native: "victory"
    notes:
      "n1": "The win in a war or a battle."
    examples:
      "বিজয় ডাঙৰ।": "The victory is great."
      "বিজয় হ'ল।": { native: "There was a victory.", bases: { "হ'ল": "to become; to be" } }
  "as-3655":
    native: "civilization"
    notes:
      "n1": "The way of life of a great people in one period."
    examples:
      "সভ্যতা প্ৰাচীন।": "The civilization is ancient."
      "সভ্যতা ধুনীয়া।": "The civilization is lovely."
  "as-3656":
    native: "ancient; very old"
    notes:
      "n1": "Of a very old time or thing."
    examples:
      "প্ৰাচীন দুৰ্গ।": "An ancient fort."
      "এইটো প্ৰাচীন।": "This is ancient."
  "as-3657":
    native: "Ahom (the dynasty that ruled Assam)"
    notes:
      "n1": "The dynasty that ruled Assam for six hundred years. Written as said in English."
    examples:
      "আহোম ৰাজত্ব।": "The Ahom reign."
      "আহোম ৰজা।": "An Ahom king."
  "as-3658":
    native: "Kamarupa (an ancient kingdom)"
    notes:
      "n1": "An ancient kingdom of the Brahmaputra valley."
    examples:
      "কামৰূপ প্ৰাচীন।": "Kamarupa is ancient."
      "কামৰূপ ৰাজ্য।": "The kingdom of Kamarupa."
  "as-3659":
    native: "dynasty"
    notes:
      "n1": "A family of kings who rule for many years."
    examples:
      "ৰাজবংশ ডাঙৰ।": "The dynasty is great."
      "ৰাজবংশ শেষ।": { native: "The dynasty ended.", bases: { "শেষ": "end; last; finish" } }
  "as-3660":
    native: "to rule"
    notes:
      "n1": "To govern a land as king or queen."
    examples:
  "as-3661":
    native: "to attack"
    notes:
      "n1": "To make an armed attack."
    examples:
  "as-3662":
    native: "to conquer; to win"
    notes:
      "n1": "To win a battle or a land."
    examples:
