schema: 1
id: "as-en-clothes"
kind: "layer"
core: "as-clothes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Clothes and colours"
license: "CC-BY-SA-4.0"
description: "Clothes, and the colours of them. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-2447":
    native: "cloth; clothes"
    notes:
      "n1": "কাপোৰ (kāpôr) is cloth, and also clothes in general."
    examples:
      "এইটো কাপোৰ নতুন।": { native: "This cloth is new.", bases: {  } }
      "মই কাপোৰ কিনোঁ।": { native: "I buy clothes.", bases: {  } }
  "as-2448":
    native: "dhoti"
    notes:
      "n1": "ধুতি (dhuti) is a long cloth wrapped round the waist by men."
    examples:
      "তেওঁ ধুতি পিন্ধে।": { native: "He wears a dhoti.", bases: {  } }
      "ধুতিটো নতুন।": { native: "The dhoti is new.", bases: { "ধুতিটো": "dhoti" } }
  "as-2449":
    native: "kurta"
    notes:
      "n1": "কুৰ্তা (kurtā) is a long loose shirt."
    examples:
      "মই কুৰ্তা পিন্ধোঁ।": { native: "I wear a kurta.", bases: {  } }
      "কুৰ্তাটো সুন্দৰ।": { native: "The kurta is beautiful.", bases: { "কুৰ্তাটো": "kurta", "সুন্দৰ": "beautiful" } }
  "as-2450":
    native: "shawl; wrap"
    notes:
      "n1": "চাদৰ (sādôr) is a shawl or a wrap, worn over the shoulders."
    examples:
      "মই চাদৰ লওঁ।": { native: "I take a shawl.", bases: {  } }
      "চাদৰখন গৰম।": { native: "The shawl is warm.", bases: { "চাদৰখন": "shawl" } }
  "as-2451":
    native: "gamosa"
    notes:
      "n1": "গামোচা (gāmosā) is a red-bordered cotton towel, used on the head and for wiping."
    examples:
      "মই গামোচাৰে মুখ মোছোঁ।": { native: "I wipe my face with a gamosa.", bases: { "গামোচাৰে": "gamosa", "মুখ": "mouth; face", "মোছোঁ": "wipe" } }
      "গামোচাখন নৰম।": { native: "The gamosa is soft.", bases: { "গামোচাখন": "gamosa" } }
  "as-2452":
    native: "shirt; top"
    notes:
      "n1": "জামা (zāmā) is a shirt or top."
    examples:
      "মোৰ জামাটো নীলা।": { native: "My shirt is blue.", bases: { "জামাটো": "shirt" } }
      "জামাটো নতুন।": { native: "The shirt is new.", bases: { "জামাটো": "shirt" } }
  "as-2453":
    native: "shoes"
    notes:
      "n1": "জোতা (zotā) is a pair of shoes."
    examples:
      "মই জোতা পিন্ধোঁ।": { native: "I wear shoes.", bases: {  } }
      "জোতাটো ডাঙৰ।": { native: "The shoes are big.", bases: { "জোতাটো": "shoes" } }
  "as-2454":
    native: "sandals"
    notes:
      "n1": "চপ্পল (sôppôl) is a pair of sandals."
    examples:
      "মই চপ্পল পিন্ধোঁ।": { native: "I wear sandals.", bases: {  } }
      "চপ্পলটো সৰু।": { native: "The sandals are small.", bases: { "চপ্পলটো": "sandals" } }
  "as-2455":
    native: "socks"
    notes:
      "n1": "মোজা (mozā) is a pair of socks."
    examples:
      "মই মোজা পিন্ধোঁ।": { native: "I wear socks.", bases: {  } }
      "মোজাটো নতুন।": { native: "The socks are new.", bases: { "মোজাটো": "socks" } }
  "as-2456":
    native: "cap; hat"
    notes:
      "n1": "টুপী (tupi) is a cap or a hat."
    examples:
      "তেওঁ টুপী পিন্ধে।": { native: "He wears a cap.", bases: {  } }
      "টুপীটো বগা।": { native: "The cap is white.", bases: { "টুপীটো": "cap" } }
  "as-2457":
    native: "jewellery"
    notes:
      "n1": "গহনা (gôhôn) is jewellery."
    examples:
      "গহনাটো সুন্দৰ।": { native: "The jewellery is beautiful.", bases: { "গহনাটো": "jewellery", "সুন্দৰ": "beautiful" } }
      "তাই গহনা পিন্ধে।": { native: "She wears jewellery.", bases: { "তাই": "she" } }
  "as-2458":
    native: "trousers"
    notes:
      "n1": "পেণ্ট (pent) is a pair of trousers."
    examples:
      "মই পেণ্ট পিন্ধোঁ।": { native: "I wear trousers.", bases: {  } }
      "পেণ্টটো নতুন।": { native: "The trousers are new.", bases: { "পেণ্টটো": "trousers" } }
  "as-2459":
    native: "belt"
    notes:
      "n1": "বেল্ট (belṭ) is a belt, worn round the waist."
    examples:
      "বেল্টটো শক্ত।": { native: "The belt is strong.", bases: { "বেল্টটো": "belt" } }
      "মই বেল্ট পিন্ধোঁ।": { native: "I wear a belt.", bases: {  } }
  "as-2460":
    native: "scarf; stole"
    notes:
      "n1": "ওৰণি (orôṇi) is a scarf or a stole, worn by women."
    examples:
      "ওৰণিটো ৰঙা।": { native: "The scarf is red.", bases: { "ওৰণিটো": "scarf" } }
      "তাই ওৰণি লয়।": { native: "She takes a scarf.", bases: { "তাই": "she" } }
  "as-2461":
    native: "handkerchief"
    notes:
      "n1": "কমাল (kômāl) is a handkerchief."
    examples:
      "কমালেৰে মুখ মোছোঁ।": { native: "I wipe my face with a handkerchief.", bases: { "কমালেৰে": "handkerchief", "মুখ": "mouth; face", "মোছোঁ": "wipe" } }
      "কমালটো সৰু।": { native: "The handkerchief is small.", bases: { "কমালটো": "handkerchief" } }
  "as-2462":
    native: "jacket"
    notes:
      "n1": "জেকেট (zheket) is a jacket, worn for warmth."
    examples:
      "জেকেটটো গৰম।": { native: "The jacket is warm.", bases: { "জেকেটটো": "jacket" } }
      "মই জেকেট পিন্ধোঁ।": { native: "I wear a jacket.", bases: {  } }
  "as-2463":
    native: "red"
    notes:
      "n1": "ৰঙা (rôṅā) is red, a colour. The colours are a set below."
    examples:
      "শাৰীখন ৰঙা।": { native: "The saree is red.", bases: {  } }
      "জামাটো ৰঙা।": { native: "The shirt is red.", bases: {  } }
  "as-2464":
    native: "blue"
    notes:
      "n1": "নীলা (nilā) is blue."
    examples:
      "মোৰ জামাটো নীলা।": { native: "My shirt is blue.", bases: {  } }
      "আকাশ নীলা।": { native: "The sky is blue.", bases: { "আকাশ": "sky" } }
  "as-2465":
    native: "green"
    notes:
      "n1": "সেউজীয়া (xeujiyā) is green."
    examples:
      "পাতটো সেউজীয়া।": { native: "The leaf is green.", bases: { "পাতটো": "leaf" } }
      "মোৰ চপ্পল সেউজীয়া।": { native: "My sandals are green.", bases: {  } }
  "as-2466":
    native: "yellow"
    notes:
      "n1": "হালধীয়া (hāldhiyā) is yellow."
    examples:
      "ফুলটো হালধীয়া।": { native: "The flower is yellow.", bases: { "ফুলটো": "flower" } }
      "মোৰ টুপী হালধীয়া।": { native: "My cap is yellow.", bases: {  } }
  "as-2467":
    native: "white"
    notes:
      "n1": "বগা (bogā) is white."
    examples:
      "গাখীৰ বগা।": { native: "Milk is white.", bases: {  } }
      "টুপীটো বগা।": { native: "The cap is white.", bases: {  } }
  "as-2468":
    native: "black"
    notes:
      "n1": "Black, the last colour of the set: kôlā in ISO 15919."
    examples:
      "চুলি ক'লা।": { native: "The hair is black.", bases: { "চুলি": "hair" } }
      "জোতাটো ক'লা।": { native: "The shoes are black.", bases: {  } }
  "as-2469":
    native: "Colours: six words"
    explanation: "Six colours: ৰঙা (rôṅā), red; নীলা (nilā), blue; সেউজীয়া (xeujiyā), green; হালধীয়া (hāldhiyā), yellow; বগা (bogā), white; and black (kôlā). Learn them as one set."
