schema: 1
id: "as-en-feelings"
kind: "layer"
core: "as-feelings"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Feelings and moods"
license: "CC-BY-SA-4.0"
description: "How people feel inside: happy and sad, afraid and angry, hopeful and worried, and the words for love and for envy. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3193":
    native: "happy; glad"
    notes:
      "n1": "Full of joy. A stronger word than খুচীয়া (khusiyā)."
    examples:
      "মই আনন্দিত।": "I am happy."
      "তাই আনন্দিত।": "She is happy."
  "as-3194":
    native: "sorry; sad"
    notes:
      "n1": "Sad or sorry for something. Also used to say sorry."
    examples:
      "তাই দুখিত।": "She is sad."
      "মই দুখিত।": "I am sorry."
  "as-3195":
    native: "sorrow; grief"
    notes:
      "n1": "The feeling of being sad. The adjective is দুখী (dukhi)."
    examples:
      "মোৰ দুখ বহুত।": "I am very sad."
      "দুখ নাই।": "There is no sorrow."
  "as-3196":
    native: "fear"
    notes:
      "n1": "The feeling when something might hurt you."
    examples:
      "ভয় লাগে।": "I am afraid."
      "তাৰ ভয় আছে।": { native: "He has fear.", bases: { "আছে": "to be; there is; to have" } }
  "as-3197":
    native: "anger"
    notes:
      "n1": "A strong feeling of being annoyed. Also খং (không)."
    examples:
      "তাৰ ৰাগ উঠিছে।": "He has become angry."
      "ৰাগ বেয়া।": "Anger is bad."
  "as-3198":
    native: "anger; temper"
    notes:
      "n1": "Short for a temper: খং উঠা (không uthā), to get angry."
    examples:
      "তাৰ খং উঠিছে।": "He is angry."
      "খং নকৰিবা।": "Do not get angry."
  "as-3199":
    native: "hope"
    notes:
      "n1": "A wish that good things will come."
    examples:
      "আশা আছে।": { native: "There is hope.", bases: { "আছে": "to be; there is; to have" } }
      "মোৰ আশা ভাল।": "My hope is good."
  "as-3200":
    native: "worry; thought"
    notes:
      "n1": "A worry in the mind about what might happen."
    examples:
      "মোৰ চিন্তা বহুত।": "I am very worried."
      "চিন্তা নকৰিবা।": "Do not worry."
  "as-3201":
    native: "anxious; worried"
    notes:
      "n1": "Feeling worried and uneasy."
    examples:
      "তেওঁ উদ্বিগ্ন।": "He is anxious."
      "মই উদ্বিগ্ন।": "I am anxious."
  "as-3202":
    native: "shame; embarrassment"
    notes:
      "n1": "The feeling of being embarrassed in front of others."
    examples:
      "লাজ লাগে।": "I feel embarrassed."
      "লাজ নাই।": "There is no shame."
  "as-3203":
    native: "pride"
    notes:
      "n1": "Pleasure in one's own success. Too much of it is not good."
    examples:
      "গৰ্ব বহুত।": "There is a lot of pride."
      "তাৰ গৰ্ব আছে।": { native: "He has pride.", bases: { "আছে": "to be; there is; to have" } }
  "as-3204":
    native: "satisfaction; contentment"
    notes:
      "n1": "The feeling of being happy with what you have."
    examples:
      "সন্তোষ ভাল।": "Contentment is good."
      "মোৰ সন্তোষ আছে।": { native: "I am content.", bases: { "আছে": "to be; there is; to have" } }
  "as-3205":
    native: "disappointed; hopeless"
    notes:
      "n1": "Feeling that something did not turn out as hoped."
    examples:
      "তেওঁ নিৰাশ।": "He is disappointed."
      "মই নিৰাশ।": "I am disappointed."
  "as-3206":
    native: "emotion; feeling"
    notes:
      "n1": "A strong feeling inside the heart."
    examples:
      "আবেগ বহুত।": "There is a lot of emotion."
      "তাৰ আবেগ ভাল।": "His feeling is good."
  "as-3207":
    native: "affection; tenderness"
    notes:
      "n1": "The warm love a parent or elder has for the young."
    examples:
      "মাৰ স্নেহ।": "A mother's affection."
      "স্নেহ বহুত।": "There is much affection."
  "as-3208":
    native: "love; liking"
    notes:
      "n1": "A strong feeling of liking or love for a person or a thing."
    examples:
      "ভালপোৱা বহুত।": "There is a lot of love."
      "মোৰ ভালপোৱা।": "My love."
  "as-3209":
    native: "hatred; disgust"
    notes:
      "n1": "A strong dislike that makes a person turn away."
    examples:
      "ঘৃণা নকৰিবা।": "Do not hate."
      "ঘৃণা বেয়া।": "Hatred is bad."
  "as-3210":
    native: "envy; jealousy"
    notes:
      "n1": "Wanting what another person has."
    examples:
      "হিংসা বেয়া।": "Envy is bad."
      "হিংসা নকৰিবা।": "Do not be envious."
  "as-3211":
    native: "irritation; annoyance"
    notes:
      "n1": "The feeling of being annoyed by something."
    examples:
      "বিৰক্তি লাগে।": "I feel annoyed."
      "বিৰক্তি বহুত।": "There is a lot of annoyance."
  "as-3212":
    native: "mind; heart; feeling"
    notes:
      "n1": "The inner feelings. Also used in মনত চিন্তা (mônôt cintā), a worry in the mind."
    examples:
      "মন ভাল।": "I am in good spirits."
      "মনত চিন্তা।": { native: "A worry in the mind.", bases: { "মনত": "mind; heart; feeling" } }
  "as-3213":
    native: "to be scared"
    notes:
      "n1": "To feel fear."
    bases:
      "পোৱা": "to get; to receive"
    examples:
  "as-3214":
    native: "to feel joy"
    notes:
      "n1": "To be happy about something."
    bases:
      "পোৱা": "to get; to receive"
    examples:
  "as-3215":
    native: "to worry"
    notes:
      "n1": "To feel anxious about something."
