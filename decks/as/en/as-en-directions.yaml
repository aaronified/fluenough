schema: 1
id: "as-en-directions"
kind: "layer"
core: "as-directions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Directions"
license: "CC0-1.0"
description: "Left, right, straight on, and asking where something is. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0314":
    native: "Where is …?"
    notes:
      "n1": "Put the place first: ষ্টেচন ক (stesôn kô)'ত (tô)? Where's the station? Politely, ষ্টেচনটো ক (xtesônôtu kô)'ত (tô), কৈ দিব নেকি (kôi dib neki)? Could you tell me where the station is?"
  "as-0315":
    native: "right (side)"
    notes:
      "n1": "সোঁফালে (xum̐phāle), to the right. ফাল (phāl) is a side or direction."
  "as-0316":
    native: "left (side)"
    notes:
      "n1": "বাওঁফালে (bāum̐phāle), to the left."
  "as-0317":
    native: "straight on"
  "as-0318":
    native: "please turn"
    notes:
      "n1": "সোঁফালে ঘূৰক (xum̐phāle ghurôk), turn right."
  "as-0319":
    native: "ahead; in front"
    notes:
      "n1": "Formally সন্মুখত (xonmukhôt)."
  "as-0320":
    native: "behind; at the back"
    notes:
      "n1": "পাছ (pās), the back, and ফাল (phāl), side."
  "as-0321":
    native: "near"
    notes:
      "n1": "After the place, with -ৰ (-rô): ষ্টেচনৰ ওচৰত (stesônôr usôrôt), near the station."
  "as-0322":
    native: "far; distance"
    notes:
      "n1": "কিমান দূৰ? (kiman dur?), how far is it?"
  "as-0323":
    native: "here"
  "as-0324":
    native: "there"
  "as-0325":
    native: "way; route"
    notes:
      "n1": "বাটটো কৈ দিয়ক (bāttu kôi diyôk), please tell me the way."
  "as-0326":
    native: "road; street"
    notes:
      "n1": "Also ৰাস্তা (rāstā) and পথ (pôth)."
  "as-0327":
    native: "crossroads"
    notes:
      "n1": "Literally 'four roads'. Many places in Assam are named after their crossroads, and a bus conductor will call them out."
