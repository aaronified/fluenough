schema: 1
id: "as-en-directions"
kind: "layer"
core: "as-directions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Directions"
license: "CC-BY-SA-4.0"
description: "Left, right, straight on, and asking where something is. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0314":
    native: "Where is …?"
    notes:
      "n1": "Put the place first: ষ্টেচন ক (stesôn kô)'ত (tô)? Where's the station? Politely, ষ্টেচনটো ক (xtesônôtu kô)'ত (tô), কৈ দিব নেকি (kôi dib neki)? Could you tell me where the station is?"
  "as-0315":
    native: "right (side)"
    notes:
      "n1": "সোঁফালে (xum̐phāle), to the right. ফাল (phāl) is a side or direction."
    examples:
      "সোঁফালে যাওক।": { native: "Go to the right.", bases: { "সোঁফালে": "right side" } }
      "এইটো মোৰ সোঁ হাত।": { native: "This is my right hand.", bases: {  } }
  "as-0316":
    native: "left (side)"
    notes:
      "n1": "বাওঁফালে (bāum̐phāle), to the left."
    examples:
      "বাওঁফালে যাওক।": { native: "Go to the left.", bases: { "বাওঁফালে": "left side" } }
      "এইটো মোৰ বাওঁ হাত।": { native: "This is my left hand.", bases: {  } }
  "as-0317":
    native: "straight on"
    bases:
      "পোনে": "straight"
  "as-0318":
    native: "please turn"
    notes:
      "n1": "সোঁফালে ঘূৰক (xum̐phāle ghurôk), turn right."
    examples:
      "বাওঁফালে ঘূৰক।": { native: "Please turn left.", bases: { "বাওঁফালে": "left side" } }
      "সোঁফালে ঘূৰক।": { native: "Please turn right.", bases: { "সোঁফালে": "right side" } }
  "as-0319":
    native: "ahead; in front"
    notes:
      "n1": "Formally সন্মুখত (xonmukhôt)."
    examples:
      "ঘৰৰ আগত।": { native: "In front of the house.", bases: {  } }
      "ভাত খোৱাৰ আগতে": { native: "before the meal", bases: { "আগতে": "ahead; in front" } }
  "as-0320":
    native: "behind; at the back"
    notes:
      "n1": "পাছ (pās), the back, and ফাল (phāl), side."
    examples:
      "ঘৰৰ পাছফালে।": { native: "Behind the house.", bases: {  } }
      "পাছফালে যাওক।": { native: "Go to the back.", bases: {  } }
  "as-0321":
    native: "near"
    notes:
      "n1": "After the place, with -ৰ (-rô): ষ্টেচনৰ ওচৰত (stesônôr usôrôt), near the station."
    examples:
      "মোৰ ঘৰ ওচৰত।": { native: "My house is near.", bases: { "ঘৰ": "house", "মোৰ": "my", "ওচৰত": "near" } }
      "নদীৰ ওচৰত": { native: "near the river", bases: { "নদীৰ": "river" } }
  "as-0322":
    native: "far; distance"
    notes:
      "n1": "কিমান দূৰ? (kiman dur?), how far is it?"
    examples:
      "সীমা দূৰ।": { native: "The border is far.", bases: {  } }
      "দহ কিলোমিটাৰ দূৰ।": { native: "Ten kilometres away.", bases: {  } }
  "as-0323":
    native: "here"
    examples:
      "আপোনাৰ কিতাপ ইয়াত।": { native: "Your book is here.", bases: { "কিতাপ": "book", "আপোনাৰ": "your (polite)", "ইয়াত": "here" } }
      "ইয়াত সুবিধা।": { native: "It is convenient here.", bases: {  } }
  "as-0324":
    native: "there"
    examples:
      "তাত মোৰ কিতাপ আছে।": { native: "My book is there.", bases: { "আছে": "to be; to have" } }
      "তাত এটা দোকান আছে।": { native: "There is a shop there.", bases: { "আছে": "to be; to have" } }
  "as-0325":
    native: "way; route"
    notes:
      "n1": "বাটটো কৈ দিয়ক (bāttu kôi diyôk), please tell me the way."
    examples:
      "বাটত ধূলি বহুত।": { native: "There is a lot of dust on the road.", bases: { "বাটত": "way; route" } }
      "বাট দীঘল।": { native: "The route is long.", bases: {  } }
  "as-0326":
    native: "road; street"
    notes:
      "n1": "Also ৰাস্তা (rāstā) and পথ (pôth)."
    examples:
      "ইয়াত এটা আলি আছে।": { native: "There is a road here.", bases: { "আছে": "to be; to have" } }
      "আমাৰ আলিটো বৰ শান্ত।": { native: "Our street is very quiet.", bases: { "আমাৰ": "we", "শান্ত": "quiet", "আলিটো": "road; street" } }
  "as-0327":
    native: "crossroads"
    notes:
      "n1": "Literally 'four roads'. Many places in Assam are named after their crossroads, and a bus conductor will call them out."
    examples:
      "চাৰিআলি ইয়াত।": { native: "The crossroads is here.", bases: {  } }
      "চাৰিআলিত বাওঁফালে ঘূৰক।": { native: "Turn left at the crossroads.", bases: { "চাৰিআলিত": "crossroads", "বাওঁফালে": "left side" } }
