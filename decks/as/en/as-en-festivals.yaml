schema: 1
id: "as-en-festivals"
kind: "layer"
core: "as-festivals"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Festivals and celebrations"
license: "CC-BY-SA-4.0"
description: "Bihu, the puja, the feast and the gifts: the words for the days people celebrate together. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-2595":
    native: "festival"
    notes:
      "n1": "A big celebration with the whole village. Assamese uses উৎসৱ (utsôb) for a festival of any kind."
    examples:
      "আজি উৎসৱ আছে।": { native: "There is a festival today.", bases: { "আছে": "to be; there is; to have" } }
      "উৎসৱ ধুনীয়া।": "The festival is beautiful."
  "as-2596":
    native: "Bihu (the festival)"
    notes:
      "n1": "The main festival of Assam. There are three Bihus in the year, each with its own name."
    examples:
      "বিহু আহিছে।": "Bihu has come."
      "বিহু ডাঙৰ উৎসৱ।": "Bihu is a big festival."
  "as-2597":
    native: "Rongali Bihu (the spring festival, in mid-April)"
    notes:
      "n1": "The spring Bihu of mid-April, at the start of the Assamese new year."
    examples:
  "as-2598":
    native: "dance"
    notes:
      "n1": "The dancing of Bihu and of other festivals."
    examples:
      "নাচ ভাল।": "The dance is good."
      "আজি নাচ আছে।": { native: "There is dancing today.", bases: { "আছে": "to be; there is; to have" } }
  "as-2599":
    native: "person; people"
    notes:
      "n1": "A single person or people in general."
    examples:
      "মানুহ বহুত।": "There are many people."
      "ঘৰত মানুহ আছে।": { native: "There are people at home.", bases: { "আছে": "to be; there is; to have" } }
  "as-2600":
    native: "Bhogali Bihu (the harvest feast, in January)"
    notes:
      "n1": "In January, the feast of the harvest, with much food and a bonfire."
    bases:
      "ভোগালী": "Bhogali (the January harvest feast)"
    examples:
  "as-2601":
    native: "Kongali Bihu (the lean festival, in October)"
    notes:
      "n1": "In October, when the granary is empty. People light fires in the fields."
    bases:
      "কঙালী": "Kongali (the autumn lean festival)"
    examples:
  "as-2602":
    native: "worship; puja; prayer"
    notes:
      "n1": "The ritual worship of a god, at home or in a temple."
    examples:
      "ঘৰত পূজা আছে।": { native: "There is a puja at home.", bases: { "আছে": "to be; there is; to have" } }
      "মন্দিৰত পূজা।": "Worship at the temple."
  "as-2603":
    native: "feast; big meal"
    notes:
      "n1": "A big meal for many guests, often with rice, curries and sweets."
    examples:
      "আজি ভোজ আছে।": { native: "There is a feast today.", bases: { "আছে": "to be; there is; to have" } }
      "ভোজত মানুহ বহুত।": { native: "There are many people at the feast.", bases: { "ভোজত": "feast; big meal" } }
  "as-2604":
    native: "gift; present"
    notes:
      "n1": "Given to a friend or a relative at a festival."
    examples:
      "তোমাৰ উপহাৰ ভাল।": "Your gift is good."
      "মই উপহাৰ দিম।": "I will give a gift."
  "as-2605":
    native: "drum"
    notes:
      "n1": "A drum played at the Bihu dances."
    examples:
      "ঢোল বাজে।": { native: "The drum plays.", bases: { "বাজে": "to play; to sound; to ring" } }
      "ঢোল ডাঙৰ।": "The drum is big."
  "as-2606":
    native: "pepa (a long buffalo-horn trumpet)"
    notes:
      "n1": "A long horn played at Bihu, made from buffalo horn or bamboo."
    examples:
      "পেঁপা বাজিছে।": { native: "The pepa is playing.", bases: { "বাজিছে": "to play; to sound; to ring" } }
      "পেঁপা আৰু ঢোল।": "The pepa and the drum."
  "as-2607":
    native: "bonfire (of Bhogali Bihu)"
    notes:
      "n1": "A big heap of straw and wood, set alight on the eve of Bhogali Bihu."
    examples:
      "মেজিত জুই জ্বলে।": { native: "The bonfire is burning.", bases: { "মেজিত": "bonfire (of Bhogali Bihu)", "জ্বলে": "to burn" } }
      "মেজি ডাঙৰ।": "The bonfire is big."
  "as-2608":
    native: "fire"
    notes:
      "n1": "The word for a fire, and for a flame."
    examples:
      "জুই জ্বলে।": { native: "The fire is burning.", bases: { "জ্বলে": "to burn" } }
      "জুইত পানী।": { native: "Water on the fire.", bases: { "জুইত": "fire" } }
  "as-2609":
    native: "female dancer"
    notes:
      "n1": "A woman who dances at a festival. A man who dances is বিহুৱান (bihuwān)."
    examples:
      "নাচনী ধুনীয়া।": "The dancer is lovely."
      "নাচনী নাচে।": "The dancer dances."
  "as-2610":
    native: "male dancer (at Bihu)"
    notes:
      "n1": "The man who dances at Bihu, as নাচনী (nāsôni) is the woman."
    examples:
      "বিহুৱান আহিছে।": "The male dancer has come."
      "বিহুৱান আৰু নাচনী।": "The male and female dancers."
  "as-2611":
    native: "joy; delight"
    notes:
      "n1": "The happiness of a festival."
    examples:
      "আজি বহুত আনন্দ।": "Today there is great joy."
      "আনন্দত গীত গাওঁ।": { native: "In joy I sing a song.", bases: { "আনন্দত": "joy; delight" } }
  "as-2612":
    native: "song"
    notes:
      "n1": "A song sung at a festival."
    examples:
      "গীত ভাল।": "The song is good."
      "এইটো গীত ধুনীয়া।": "This song is beautiful."
  "as-2613":
    native: "guest"
    notes:
      "n1": "A guest at the house. Guests are welcomed with a gamosa."
    examples:
      "ঘৰত অতিথি আছে।": { native: "There is a guest at home.", bases: { "আছে": "to be; there is; to have" } }
      "অতিথিক নমস্কাৰ।": { native: "Greetings to the guest.", bases: { "অতিথিক": "guest" } }
  "as-2614":
    native: "invitation"
    notes:
      "n1": "A card or a word asking someone to a festival or a meal."
    examples:
      "তোমাৰ নিমন্ত্ৰণ।": "Your invitation."
      "নিমন্ত্ৰণ পালোঁ।": { native: "I received the invitation.", bases: { "পালোঁ": "to get; to receive" } }
  "as-2615":
    native: "programme; event"
    notes:
      "n1": "A planned event with a stage, speakers and music."
    examples:
      "আজি অনুষ্ঠান আছে।": { native: "There is a programme today.", bases: { "আছে": "to be; there is; to have" } }
      "অনুষ্ঠান বহুত ভাল।": "The programme is very good."
  "as-2616":
    native: "dress; costume; dressing up"
    notes:
      "n1": "The dress worn for a festival, such as the Bihu costume."
    examples:
      "নতুন সাজ।": "New clothes for the festival."
      "তোমাৰ সাজ ধুনীয়া।": "Your dress is lovely."
  "as-2617":
    native: "full moon"
    notes:
      "n1": "The night of the full moon, when many festivals are held."
    examples:
      "আজি পূৰ্ণিমা।": "Today is the full moon."
      "পূৰ্ণিমাৰ জোন ডাঙৰ।": { native: "The full moon is big.", bases: { "পূৰ্ণিমাৰ": "full moon" } }
  "as-2618":
    native: "celebration"
    notes:
      "n1": "The act of celebrating, with food, music and dance."
    examples:
      "উদযাপন কৰা।": "To celebrate."
      "বিহুৰ উদযাপন।": "The celebration of Bihu."
  "as-2619":
    native: "festive"
    notes:
      "n1": "Of a festival; full of festive mood."
    examples:
      "উৎসৱী দিন।": "A festive day."
      "আজি উৎসৱী।": "Today is festive."
  "as-2620":
    native: "new year"
    notes:
      "n1": "The Assamese new year falls in mid-April, at Rongali Bihu."
