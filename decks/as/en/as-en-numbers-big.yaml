schema: 1
id: "as-en-numbers-big"
kind: "layer"
core: "as-numbers-big"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Tens and big numbers"
license: "CC-BY-SA-4.0"
description: "The tens, the hundreds, a thousand, lakh and crore, and the halves every market uses. Each number from 21 to 99 has a word of its own: here is one, 25, to show how. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0239":
    native: "30, thirty"
    notes:
      "n1": "As in Bengali and Hindi, 21 to 99 are not built from parts: each has its own word, which you learn one by one, as with পঁচিশ (pom̐six), 25."
    examples:
      "মোৰ বয়স ত্ৰিশ বছৰ।": { native: "I am thirty years old.", bases: {  } }
      "মোৰ ত্ৰিশ টকা আছে।": { native: "I have thirty rupees.", bases: { "আছে": "to be; to have" } }
  "as-0240":
    native: "40, forty"
    examples:
      "মোৰ বয়স চল্লিশ বছৰ।": { native: "I am forty years old.", bases: {  } }
      "মোৰ চল্লিশ টকা আছে।": { native: "I have forty rupees.", bases: { "আছে": "to be; to have" } }
  "as-0241":
    native: "50, fifty"
    examples:
      "মোৰ বয়স পঞ্চাশ বছৰ।": { native: "I am fifty years old.", bases: {  } }
      "মোৰ পঞ্চাশ টকা আছে।": { native: "I have fifty rupees.", bases: { "আছে": "to be; to have" } }
  "as-0242":
    native: "60, sixty"
    examples:
      "মোৰ বয়স ষাঠি বছৰ।": { native: "I am sixty years old.", bases: {  } }
      "মোৰ ষাঠি টকা আছে।": { native: "I have sixty rupees.", bases: { "আছে": "to be; to have" } }
  "as-0243":
    native: "70, seventy"
    examples:
      "মোৰ বয়স সত্তৰ বছৰ।": { native: "I am seventy years old.", bases: {  } }
      "মোৰ সত্তৰ টকা আছে।": { native: "I have seventy rupees.", bases: { "আছে": "to be; to have" } }
  "as-0244":
    native: "80, eighty"
    examples:
      "মোৰ বয়স আশী বছৰ।": { native: "I am eighty years old.", bases: {  } }
      "মোৰ আশী টকা আছে।": { native: "I have eighty rupees.", bases: { "আছে": "to be; to have" } }
  "as-0245":
    native: "90, ninety"
    examples:
      "মোৰ বয়স নব্বৈ বছৰ।": { native: "I am ninety years old.", bases: {  } }
      "মোৰ নব্বৈ টকা আছে।": { native: "I have ninety rupees.", bases: { "আছে": "to be; to have" } }
  "as-0246":
    native: "25, twenty-five"
    notes:
      "n1": "From পাঁচ (pām̐s), five, and বিশ (bix), twenty, fused into one word."
    examples:
      "মোৰ বয়স পঁচিশ বছৰ।": { native: "I am twenty-five years old.", bases: {  } }
      "মোৰ পঁচিশ টকা আছে।": { native: "I have twenty-five rupees.", bases: { "আছে": "to be; to have" } }
  "as-0247":
    native: "100, a hundred"
    notes:
      "n1": "Hundreds join into one word: দুশ (dux) is 200, তিনিশ (tinix) 300, পাঁচশ (pām̐sôx) 500."
    examples:
      "এইটো এশ টকা।": { native: "This is a hundred rupees.", bases: {  } }
      "মোৰ এশ টকা আছে।": { native: "I have a hundred rupees.", bases: { "আছে": "to be; to have" } }
  "as-0248":
    native: "200, two hundred"
    notes:
      "n1": "The hundreds join into one word, never two."
    examples:
      "এইটো দুশ টকা।": { native: "This is two hundred rupees.", bases: {  } }
      "মোৰ দুশ টকা আছে।": { native: "I have two hundred rupees.", bases: { "আছে": "to be; to have" } }
  "as-0249":
    native: "300, three hundred"
    examples:
      "এইটো তিনিশ টকা।": { native: "This is three hundred rupees.", bases: {  } }
      "মোৰ তিনিশ টকা আছে।": { native: "I have three hundred rupees.", bases: { "আছে": "to be; to have" } }
  "as-0250":
    native: "400, four hundred"
    examples:
      "এইটো চাৰিশ টকা।": { native: "This is four hundred rupees.", bases: {  } }
      "মোৰ চাৰিশ টকা আছে।": { native: "I have four hundred rupees.", bases: { "আছে": "to be; to have" } }
  "as-0251":
    native: "500, five hundred"
    examples:
      "এইটো পাঁচশ টকা।": { native: "This is five hundred rupees.", bases: {  } }
      "পাঁচশ গ্ৰাম চাউল।": { native: "Five hundred grams of rice.", bases: { "চাউল": "rice" } }
  "as-0252":
    native: "600, six hundred"
    examples:
      "এইটো ছশ টকা।": { native: "This is six hundred rupees.", bases: {  } }
      "মোৰ ছশ টকা আছে।": { native: "I have six hundred rupees.", bases: { "আছে": "to be; to have" } }
  "as-0253":
    native: "700, seven hundred"
    examples:
      "এইটো সাতশ টকা।": { native: "This is seven hundred rupees.", bases: {  } }
      "মোৰ সাতশ টকা আছে।": { native: "I have seven hundred rupees.", bases: { "আছে": "to be; to have" } }
  "as-0254":
    native: "800, eight hundred"
    examples:
      "এইটো আঠশ টকা।": { native: "This is eight hundred rupees.", bases: {  } }
      "মোৰ আঠশ টকা আছে।": { native: "I have eight hundred rupees.", bases: { "আছে": "to be; to have" } }
  "as-0255":
    native: "900, nine hundred"
    examples:
      "এইটো নশ টকা।": { native: "This is nine hundred rupees.", bases: {  } }
      "মোৰ নশ টকা আছে।": { native: "I have nine hundred rupees.", bases: { "আছে": "to be; to have" } }
  "as-0256":
    native: "1,000, a thousand"
    notes:
      "n1": "On its own or with এক (ek): এক হাজাৰ (ek hāzār). Two thousand is দুহাজাৰ (duhāzār) or দুই হাজাৰ (dui hāzār)."
    examples:
      "এইটো হাজাৰ টকা।": { native: "This is a thousand rupees.", bases: {  } }
      "মোৰ হাজাৰ টকা আছে।": { native: "I have a thousand rupees.", bases: { "আছে": "to be; to have" } }
  "as-0257":
    native: "2,000, two thousand"
    notes:
      "n1": "Also দুই হাজাৰ (dui hāzār). Three thousand is তিনি হাজাৰ (tini hāzār), and so on."
    examples:
      "এইটো দুহাজাৰ টকা।": { native: "This is two thousand rupees.", bases: {  } }
      "মোৰ দুহাজাৰ টকা আছে।": { native: "I have two thousand rupees.", bases: { "আছে": "to be; to have" } }
  "as-0258":
    native: "1,00,000, a lakh (a hundred thousand)"
    notes:
      "n1": "South Asian numbering counts in lakhs and crores, and places its commas to match: 1,00,000 is one lakh. Formally লক্ষ (lôkkhô)."
    examples:
      "এইটো লাখ টকা।": { native: "This is a lakh rupees.", bases: {  } }
      "মোৰ লাখ টকা আছে।": { native: "I have a lakh rupees.", bases: { "আছে": "to be; to have" } }
  "as-0259":
    native: "1,00,00,000, a crore (ten million)"
    notes:
      "n1": "A hundred lakh."
    examples:
      "এইটো কোটি টকা।": { native: "This is a crore rupees.", bases: {  } }
      "মোৰ কোটি টকা আছে।": { native: "I have a crore rupees.", bases: { "আছে": "to be; to have" } }
  "as-0260":
    native: "1½, one and a half"
    notes:
      "n1": "With hundreds too: ডেৰশ (derôx) is 150. Heard constantly in markets."
    examples:
      "এইটো ডেৰ টকা।": { native: "This is one and a half rupees.", bases: {  } }
      "মোৰ ডেৰ টকা আছে।": { native: "I have one and a half rupees.", bases: { "আছে": "to be; to have" } }
  "as-0261":
    native: "2½, two and a half"
    notes:
      "n1": "আঢ়ৈশ (ārhôix) is 250. From 3½ on, Assamese says সাৰে (xāre), 'and a half': সাৰে তিনি (xāre tini), 3½."
    examples:
      "এইটো আঢ়ৈ টকা।": { native: "This is two and a half rupees.", bases: {  } }
      "মোৰ আঢ়ৈ টকা আছে।": { native: "I have two and a half rupees.", bases: { "আছে": "to be; to have" } }
  "as-0262":
    native: "½, half"
    notes:
      "n1": "আধা কিলো (ādhā kilo), half a kilo. With a number, the half is ডেৰ (der), আঢ়ৈ (ārhôi) or সাৰে (sāre) instead."
    examples:
      "এইটো আধা টকা।": { native: "This is half a rupee.", bases: {  } }
      "মোৰ আধা টকা আছে।": { native: "I have half a rupee.", bases: { "আছে": "to be; to have" } }
  "as-0263":
    native: "250, two hundred and fifty"
    notes:
      "n1": "The hundred, then the rest, with no 'and'. Also আঢ়ৈশ (ārhôix)."
  "as-0264":
    native: "150, a hundred and fifty"
    notes:
      "n1": "Also ডেৰশ (derôx), 'one and a half hundred'."
  "as-0265":
    native: "2020, two thousand and twenty"
    notes:
      "n1": "A year is read as a number, thousands first."
