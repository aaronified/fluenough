schema: 1
id: "as-en-numbers-big"
kind: "layer"
core: "as-numbers-big"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Tens and big numbers"
license: "CC0-1.0"
description: "The tens, the hundreds, a thousand, lakh and crore, and the halves every market uses. Each number from 21 to 99 has a word of its own: here is one, 25, to show how. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0239":
    native: "30, thirty"
    notes:
      "n1": "As in Bengali and Hindi, 21 to 99 are not built from parts: each has its own word, which you learn one by one, as with পঁচিশ (pom̐six), 25."
  "as-0240":
    native: "40, forty"
  "as-0241":
    native: "50, fifty"
  "as-0242":
    native: "60, sixty"
  "as-0243":
    native: "70, seventy"
  "as-0244":
    native: "80, eighty"
  "as-0245":
    native: "90, ninety"
  "as-0246":
    native: "25, twenty-five"
    notes:
      "n1": "From পাঁচ (pām̐s), five, and বিশ (bix), twenty, fused into one word."
  "as-0247":
    native: "100, a hundred"
    notes:
      "n1": "Hundreds join into one word: দুশ (dux) is 200, তিনিশ (tinix) 300, পাঁচশ (pām̐sôx) 500."
  "as-0248":
    native: "200, two hundred"
    notes:
      "n1": "The hundreds join into one word, never two."
  "as-0249":
    native: "300, three hundred"
  "as-0250":
    native: "400, four hundred"
  "as-0251":
    native: "500, five hundred"
  "as-0252":
    native: "600, six hundred"
  "as-0253":
    native: "700, seven hundred"
  "as-0254":
    native: "800, eight hundred"
  "as-0255":
    native: "900, nine hundred"
  "as-0256":
    native: "1,000, a thousand"
    notes:
      "n1": "On its own or with এক (ek): এক হাজাৰ (ek hāzār). Two thousand is দুহাজাৰ (duhāzār) or দুই হাজাৰ (dui hāzār)."
  "as-0257":
    native: "2,000, two thousand"
    notes:
      "n1": "Also দুই হাজাৰ (dui hāzār). Three thousand is তিনি হাজাৰ (tini hāzār), and so on."
  "as-0258":
    native: "1,00,000, a lakh (a hundred thousand)"
    notes:
      "n1": "South Asian numbering counts in lakhs and crores, and places its commas to match: 1,00,000 is one lakh. Formally লক্ষ (lôkkhô)."
  "as-0259":
    native: "1,00,00,000, a crore (ten million)"
    notes:
      "n1": "A hundred lakh."
  "as-0260":
    native: "1½, one and a half"
    notes:
      "n1": "With hundreds too: ডেৰশ (derôx) is 150. Heard constantly in markets."
  "as-0261":
    native: "2½, two and a half"
    notes:
      "n1": "আঢ়ৈশ (ārhôix) is 250. From 3½ on, Assamese says সাৰে (xāre), 'and a half': সাৰে তিনি (xāre tini), 3½."
  "as-0262":
    native: "½, half"
    notes:
      "n1": "আধা কিলো (ādhā kilo), half a kilo. With a number, the half is ডেৰ (der), আঢ়ৈ (ārhôi) or সাৰে (sāre) instead."
  "as-0263":
    native: "250, two hundred and fifty"
    notes:
      "n1": "The hundred, then the rest, with no 'and'. Also আঢ়ৈশ (ārhôix)."
  "as-0264":
    native: "150, a hundred and fifty"
    notes:
      "n1": "Also ডেৰশ (derôx), 'one and a half hundred'."
  "as-0265":
    native: "2020, two thousand and twenty"
    notes:
      "n1": "A year is read as a number, thousands first."
