schema: 1
id: "as-en-arts"
kind: "layer"
core: "as-arts"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Arts: music, dance, painting and the stage"
license: "CC-BY-SA-4.0"
description: "The arts: the singer and the player, the painter and the artist, the stage and the exhibition, the tune and the rhythm. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3601":
    native: "art; the arts"
    notes:
      "n1": "Any work made with skill and imagination: painting, music, dance."
    examples:
      "কলা ভাল।": "Art is good."
      "কলা বহুত।": "There is a lot of art."
  "as-3602":
    native: "painting (the art)"
    notes:
      "n1": "The art of painting pictures."
    examples:
      "চিত্ৰকলা ধুনীয়া।": "Painting is beautiful."
      "চিত্ৰকলা শিকোঁ।": "I am learning painting."
  "as-3603":
    native: "artist"
    notes:
      "n1": "A person who makes art: a painter, a singer or a dancer."
    examples:
      "শিল্পী ধুনীয়া।": "The artist is talented."
      "শিল্পী আহিছে।": "The artist has come."
  "as-3604":
    native: "singer"
    notes:
      "n1": "A person who sings. A female singer is also গায়ক (gāyôk) in formal speech."
    examples:
      "গায়ক ভাল।": "The singer is good."
      "গায়ক আহিছে।": "The singer has come."
  "as-3605":
    native: "player (of an instrument)"
    notes:
      "n1": "A person who plays a musical instrument."
    examples:
      "বাদক ভাল।": "The player is good."
      "বাদক বহুত।": "There are many players."
  "as-3606":
    native: "tune; note (of music)"
    notes:
      "n1": "The pitch and the tune of a song."
    examples:
      "সুৰ ভাল।": "The tune is good."
      "সুৰ মধুৰ।": { native: "The tune is sweet.", bases: { "মধুৰ": "sweet; pleasant" } }
  "as-3607":
    native: "rhythm; beat"
    notes:
      "n1": "The beat that keeps time in a song or a dance."
    examples:
      "তাল ঠিক।": "The rhythm is right."
      "তাল বহুত।": "There is a lot of rhythm."
  "as-3608":
    native: "stage"
    notes:
      "n1": "The raised floor where actors and singers perform."
    examples:
      "মঞ্চ ডাঙৰ।": "The stage is big."
      "মঞ্চত গায়ক।": { native: "The singer is on the stage.", bases: { "মঞ্চত": "stage" } }
  "as-3609":
    native: "paintbrush"
    notes:
      "n1": "The brush a painter uses with colour."
    examples:
      "তুলি নতুন।": "The brush is new."
      "তুলিত ৰং।": { native: "Colour on the brush.", bases: { "তুলিত": "paintbrush" } }
  "as-3610":
    native: "exhibition; show"
    notes:
      "n1": "A place where paintings or other works are shown to the public."
    examples:
      "প্ৰদৰ্শনী আছে।": { native: "There is an exhibition.", bases: { "আছে": "to be; there is; to have" } }
      "প্ৰদৰ্শনী ভাল।": "The exhibition is good."
  "as-3611":
    native: "sculpture"
    notes:
      "n1": "A work of art carved or made in stone, wood or clay."
    examples:
      "ভাস্কৰ্য ধুনীয়া।": "The sculpture is beautiful."
      "ভাস্কৰ্য বৰ।": "The sculpture is big."
  "as-3612":
    native: "dance (formal)"
    notes:
      "n1": "The formal word for dance; in speech নাচ (nāc)."
    examples:
      "নৃত্য ভাল।": "The dance is good."
      "নৃত্য শিকা।": "To learn dance."
  "as-3613":
    native: "musician"
    notes:
      "n1": "A person who knows and makes music well."
    examples:
      "সংগীতজ্ঞ আহিছে।": "The musician has come."
      "সংগীতজ্ঞ ভাল।": "The musician is good."
  "as-3614":
    native: "talent"
    notes:
      "n1": "A natural gift for art or skill."
    examples:
      "প্ৰতিভা বহুত।": "There is a lot of talent."
      "প্ৰতিভা আছে।": { native: "There is talent.", bases: { "আছে": "to be; there is; to have" } }
  "as-3615":
    native: "to sing a song"
    notes:
      "n1": "To sing a song for others to hear."
    examples:
  "as-3616":
    native: "to paint a picture"
    notes:
      "n1": "To draw or paint a picture."
    examples:
