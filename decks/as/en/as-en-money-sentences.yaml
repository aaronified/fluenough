id: "as-en-money-sentences"
kind: "layer"
core: "as-money-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Money: banks, bills, prices and payment: sentences"
license: "CC-BY-SA-4.0"
description: "Sentences built from the words of this unit and the ones before it. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3976":
    native: "My income is high and my spending is low."
    notes:
      "n1": "আৰু (āru) means 'and'. Both halves need no word for 'is': আয় বেছি (āy besi) and ব্যয় কম (byôy kôm)."
    confusables:
      "c1": { why: "Debt, a different money matter." }
      "c2": { why: "Savings, what is left over." }
  "as-3977":
    native: "Make the budget right."
    notes:
      "n1": "ঠিক কৰা (thik kôrā) is literally 'do right', that is, to fix or settle."
    confusables:
      "c1": { why: "Tax, a different money matter." }
      "c2": { why: "A fee, a small payment." }
  "as-3978":
    native: "There is money in the ATM."
    notes:
      "n1": "-ত (-t), 'in', joins এটিএম (etiem), ATM: এটিএমত (etiemôt). আছে (āse) means 'there is'."
    bases:
      "আছে": "to be; there is; to have"
    confusables:
      "c1": { why: "Empty, the opposite." }
      "c2": { why: "A receipt, not cash." }
  "as-3979":
    native: "Take the receipt."
    notes:
      "n1": "লোৱা (luwā), 'to take', is the dictionary form used as a command: ৰসিদ লোৱা (roxid luwā), take the receipt."
    confusables:
      "c1": { why: "A loan, a different paper." }
      "c2": { why: "Currency, not a receipt." }
  "as-3980":
    native: "Pay back the debt."
    notes:
      "n1": "শোধ কৰা (xudh kôrā) is literally 'do repayment'. ধাৰ (dhār) is the debt being paid."
    bases:
      "শোধ": "repayment; payment off"
    confusables:
      "c1": { why: "To borrow, the opposite action." }
      "c2": { why: "To save, a different action." }
  "as-3981":
    native: "Pay the tax."
    notes:
      "n1": "Assamese 'gives' tax where English says 'pay': কৰ দিয়া (kôr diyā). কৰ (kôr), tax, is not কৰা (kôrā), 'to do'."
    confusables:
      "c1": { why: "Spending, a different matter." }
      "c2": { why: "Wealth, a different idea." }
  "as-3982":
    native: "Cash money is needed."
    notes:
      "n1": "লাগে (lāge) means 'is needed': the thing needed, নগদ টকা (nôgôd tôkā), comes first."
    confusables:
      "c1": { why: "A card, another way to pay." }
      "c2": { why: "Online, another way to pay." }
  "as-3983":
    native: "The income is low."
    confusables:
      "c1": { why: "Spending, a different money matter." }
      "c2": { why: "More, the opposite of low." }
