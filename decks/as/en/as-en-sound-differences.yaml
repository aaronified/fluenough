schema: 1
id: "as-en-sound-differences"
kind: "layer"
core: "as-sound-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sounds to tell apart"
license: "CC0-1.0"
description: "Pairs of everyday words that differ in one sound: a breath after a consonant, the rasp x against h, kh and s, the vowel every consonant carries against a, and a nasal vowel. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0108":
    native: "to say; to tell"
    notes:
      "n1": "Aspiration: খোৱা (khuwā, to eat) is কোৱা (kuwā, to say) with a puff of breath after the k."
  "as-0109":
    native: "to eat; to drink"
    notes:
      "n1": "Aspiration: খোৱা (khuwā, to eat) is কোৱা (kuwā, to say) with a puff of breath after the k. Assamese eats and drinks with one verb: চাহ খোৱা (sāh khuwā), to drink tea."
  "as-0110":
    native: "rheumatism"
    notes:
      "n1": "Aspiration: ভাত (bhāt, cooked rice) is বাত (bāt, rheumatism) with a breath after the b. Say বাত (bāt) at dinner and you've asked for rheumatism."
  "as-0111":
    native: "cooked rice; a meal"
    notes:
      "n1": "Aspiration: ভাত (bhāt, cooked rice) is বাত (bāt, rheumatism) with a breath after the b. Rice is the meal: ভাত খালেনে? (bhat khalene?), 'have you eaten rice?', means 'have you eaten?'."
  "as-0112":
    native: "gift; donation"
    notes:
      "n1": "Aspiration: ধান (dhān, paddy) is দান (dān, gift) with a breath after the d."
  "as-0113":
    native: "paddy (rice in the husk)"
    notes:
      "n1": "Aspiration: ধান (dhān, paddy) is দান (dān, gift) with a breath after the d. Husked, it is চাউল (sāul); cooked, ভাত (bhāt)."
  "as-0114":
    native: "7, seven"
    notes:
      "n1": "x against h: সাত (xāt, seven) starts with the rasp x, at the back of the mouth; হাত (hāt, hand) with a plain breath."
  "as-0115":
    native: "hand; arm"
    notes:
      "n1": "x against h: সাত (xāt, seven) starts with the rasp x, at the back of the mouth; হাত (hāt, hand) with a plain breath."
  "as-0116":
    native: "fertiliser; the essence of a thing"
    notes:
      "n1": "x against kh: সাৰ (xār) has the rasp x, the tongue not quite touching; খাৰ (khār) has a k with a breath after it. সাৰ পোৱা (xār puwā) is to wake up."
  "as-0117":
    native: "khar, an alkaline dish (and the ash water it is made with)"
    notes:
      "n1": "x against kh: খাৰ (khār) has a k with a breath after it; সাৰ (xār) has the rasp x. Khar, made with water filtered through the ash of banana peel, starts a traditional Assamese meal, and Assamese people call themselves খাৰখোৱা (khārkhuwā), khar-eaters, in fun."
  "as-0118":
    native: "4, four"
    notes:
      "n1": "x against s: চাৰি (sāri, four) starts with s, which Assamese writes চ (sô); শাৰী (xāri, a row) with the rasp x."
  "as-0119":
    native: "row; line"
    notes:
      "n1": "x against s: শাৰী (xāri, a row) starts with the rasp x; চাৰি (sāri, four) with s."
  "as-0064":
    notes:
      "n1": "The open o against a: কম (kôm, less) has the vowel every consonant carries; কাম (kām, work) has আ (ā), the 'a' of 'father'."
  "as-0120":
    native: "work; a job to do"
    notes:
      "n1": "The open o against a: কম (kôm, less) has the vowel every consonant carries; কাম (kām, work) has আ (ā), the 'a' of 'father'."
  "as-0065":
    notes:
      "n1": "The open o against a: জল (zôl, water) has the vowel every consonant carries; জাল (zāl, net) has আ (ā), the 'a' of 'father'."
  "as-0121":
    native: "net (for fishing)"
    notes:
      "n1": "The open o against a: জল (zôl, water) has the vowel every consonant carries; জাল (zāl, net) has আ (ā), the 'a' of 'father'."
  "as-0122":
    native: "nest"
    notes:
      "n1": "Nasal vowel: বাঁহ (bām̐h, bamboo) is বাহ (bāh, nest) with the vowel said through the nose as well, marked by ঁ (ôm̐) above. Chat and these readings leave the mark out, so listen for it."
  "as-0123":
    native: "bamboo"
    notes:
      "n1": "Nasal vowel: বাঁহ (bām̐h, bamboo) is বাহ (bāh, nest) with the vowel said through the nose as well, marked by ঁ (ôm̐) above."
  "as-0124":
    native: "the back; behind; later"
    notes:
      "n1": "Nasal vowel: পাঁচ (pām̐s, five) is said through the nose; পাছ (pās, back) is not. পাছত (pāsôt), later; behind."
  "as-0125":
    native: "5, five"
    notes:
      "n1": "Nasal vowel: পাঁচ (pām̐s, five) is said through the nose; পাছ (pās, back) is not."
