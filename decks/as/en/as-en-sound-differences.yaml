schema: 1
id: "as-en-sound-differences"
kind: "layer"
core: "as-sound-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sounds to tell apart"
license: "CC-BY-SA-4.0"
description: "Pairs of everyday words that differ in one sound: a breath after a consonant, the rasp x against h, kh and s, the vowel every consonant carries against a, and a nasal vowel. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0108":
    native: "to say; to tell"
    notes:
      "n1": "Aspiration: খোৱা (khuwā, to eat) is কোৱা (kuwā, to say) with a puff of breath after the k."
    examples:
      "এবাৰ কওক।": { native: "Please say it once.", bases: { "কওক": "say, please" } }
      "কথা কোৱা": { native: "to talk; to speak", bases: { "কথা": "talk; speech; matter" } }
  "as-0109":
    native: "to eat; to drink"
    notes:
      "n1": "Aspiration: খোৱা (khuwā, to eat) is কোৱা (kuwā, to say) with a puff of breath after the k. Assamese eats and drinks with one verb: চাহ খোৱা (sāh khuwā), to drink tea."
    examples:
      "ঔষধ খাবা।": { native: "You will take the medicine.", bases: { "খাবা": "to eat; to drink" } }
      "খাই চোৱা।": { native: "Try it; taste it.", bases: { "চোৱা": "to see; to watch; to try", "খাই": "to eat; to drink" } }
  "as-0110":
    native: "rheumatism"
    notes:
      "n1": "Aspiration: ভাত (bhāt, cooked rice) is বাত (bāt, rheumatism) with a breath after the b. Say বাত (bāt) at dinner and you've asked for rheumatism."
    examples:
      "মোৰ বাত আছে।": { native: "I have rheumatism.", bases: { "আছে": "to be; to have" } }
      "মোৰ ককাৰ বাত আছে।": { native: "My grandfather has rheumatism.", bases: { "আছে": "to be; to have" } }
  "as-0111":
    native: "cooked rice; a meal"
    notes:
      "n1": "Aspiration: ভাত (bhāt, cooked rice) is বাত (bāt, rheumatism) with a breath after the b. Rice is the meal: ভাত খালেনে? (bhat khalene?), 'have you eaten rice?', means 'have you eaten?'."
    examples:
      "দুপৰীয়াৰ ভাত": { native: "lunch", bases: {  } }
      "পাতত ভাত।": { native: "Rice on a leaf.", bases: { "পাতত": "leaf" } }
  "as-0112":
    native: "gift; donation"
    notes:
      "n1": "Aspiration: ধান (dhān, paddy) is দান (dān, gift) with a breath after the d."
    examples:
      "এইটো মোৰ দান।": { native: "This is my gift.", bases: {  } }
      "এইটো তোমাৰ দান।": { native: "This is your gift.", bases: {  } }
  "as-0113":
    native: "paddy (rice in the husk)"
    notes:
      "n1": "Aspiration: ধান (dhān, paddy) is দান (dān, gift) with a breath after the d. Husked, it is চাউল (sāul); cooked, ভাত (bhāt)."
    examples:
      "ধানৰ ফচল ভাল।": { native: "The paddy harvest is good.", bases: { "ধানৰ": "paddy (rice in the husk)" } }
      "খেতত ধান।": { native: "Paddy in the field.", bases: { "খেতত": "field (for crops)" } }
  "as-0114":
    native: "7, seven"
    notes:
      "n1": "x against h: সাত (xāt, seven) starts with the rasp x, at the back of the mouth; হাত (hāt, hand) with a plain breath."
    examples:
      "মোৰ বয়স সাত বছৰ।": { native: "I am seven years old.", bases: {  } }
      "মই সদায় সাত বজাত উঠোঁ।": { native: "I get up at seven every day.", bases: { "মই": "I" } }
  "as-0115":
    native: "hand (in speech also the arm)"
    notes:
      "n1": "x against h: সাত (xāt, seven) starts with the rasp x, at the back of the mouth; হাত (hāt, hand) with a plain breath."
    examples:
      "হাতত ঘা।": { native: "A wound on the hand.", bases: { "হাতত": "hand (in speech also the arm)" } }
      "মই হাত ধৰোঁ।": { native: "I hold the hand.", bases: { "হাত": "hand", "ধৰোঁ": "hold", "মই": "I" } }
  "as-0116":
    native: "fertiliser; the essence of a thing"
    notes:
      "n1": "x against kh: সাৰ (xār) has the rasp x, the tongue not quite touching; খাৰ (khār) has a k with a breath after it. সাৰ পোৱা (xār puwā) is to wake up."
    examples:
      "সাৰ ইয়াত।": { native: "The fertiliser is here.", bases: {  } }
      "মই সাৰ দিওঁ।": { native: "I put fertiliser.", bases: {  } }
  "as-0117":
    native: "khar, an alkaline dish (and the ash water it is made with)"
    notes:
      "n1": "x against kh: খাৰ (khār) has a k with a breath after it; সাৰ (xār) has the rasp x. Khar, made with water filtered through the ash of banana peel, starts a traditional Assamese meal, and Assamese people call themselves খাৰখোৱা (khārkhuwā), khar-eaters, in fun."
    examples:
      "এইটো খাৰ।": { native: "This is khar.", bases: {  } }
      "মই খাৰ খাওঁ।": { native: "I eat khar.", bases: {  } }
  "as-0118":
    native: "4, four"
    notes:
      "n1": "x against s: চাৰি (sāri, four) starts with s, which Assamese writes চ (sô); শাৰী (xāri, a row) with the rasp x."
    examples:
      "মোৰ বয়স চাৰি বছৰ।": { native: "I am four years old.", bases: {  } }
      "সাৰে চাৰি": { native: "half past four; 4½", bases: { "সাৰে": "and a half" } }
  "as-0119":
    native: "row; line"
    notes:
      "n1": "x against s: শাৰী (xāri, a row) starts with the rasp x; চাৰি (sāri, four) with s."
    examples:
      "শাৰীটো ডাঙৰ।": { native: "The row is big.", bases: { "শাৰীটো": "row; line" } }
      "শাৰীখন ৰঙা।": { native: "The saree is red.", bases: { "শাৰীখন": "row; line" } }
  "as-0064":
    notes:
      "n1": "The open o against a: কম (kôm, less) has the vowel every consonant carries; কাম (kām, work) has আ (ā), the 'a' of 'father'."
    examples:
      "ব্যথা কম।": { native: "The pain is less.", bases: {  } }
      "ব্যয় কম।": { native: "The spending is low.", bases: {  } }
  "as-0120":
    native: "work; a job to do"
    notes:
      "n1": "The open o against a: কম (kôm, less) has the vowel every consonant carries; কাম (kām, work) has আ (ā), the 'a' of 'father'."
    examples:
      "কম্পিউটাৰত কাম।": { native: "Work on the computer.", bases: { "কম্পিউটাৰত": "computer" } }
      "কাম কঠিন।": { native: "The work is hard.", bases: {  } }
  "as-0065":
    notes:
      "n1": "The open o against a: জল (zôl, water) has the vowel every consonant carries; জাল (zāl, net) has আ (ā), the 'a' of 'father'."
    examples:
      "জল ইয়াত।": { native: "The water is here.", bases: {  } }
      "মই জল খাওঁ।": { native: "I drink water.", bases: {  } }
  "as-0121":
    native: "net (for fishing)"
    notes:
      "n1": "The open o against a: জল (zôl, water) has the vowel every consonant carries; জাল (zāl, net) has আ (ā), the 'a' of 'father'."
    examples:
      "এইটো জাল।": { native: "This is a net.", bases: {  } }
      "মাছৰ জাল ইয়াত।": { native: "The fishing net is here.", bases: {  } }
  "as-0122":
    native: "nest"
    notes:
      "n1": "Nasal vowel: বাঁহ (bām̐h, bamboo) is বাহ (bāh, nest) with the vowel said through the nose as well, marked by ঁ (ôm̐) above. Chat and these readings leave the mark out, so listen for it."
    examples:
      "চৰাইৰ বাহ ইয়াত।": { native: "The bird's nest is here.", bases: {  } }
      "এইটো বাহ।": { native: "This is a nest.", bases: {  } }
  "as-0123":
    native: "bamboo"
    notes:
      "n1": "Nasal vowel: বাঁহ (bām̐h, bamboo) is বাহ (bāh, nest) with the vowel said through the nose as well, marked by ঁ (ôm̐) above."
    examples:
      "এইটো বাঁহ।": { native: "This is bamboo.", bases: {  } }
      "বাঁহ ডাঙৰ।": { native: "The bamboo is big.", bases: {  } }
  "as-0124":
    native: "the back; behind; later"
    notes:
      "n1": "Nasal vowel: পাঁচ (pām̐s, five) is said through the nose; পাছ (pās, back) is not. পাছত (pāsôt), later; behind."
    examples:
      "তাৰ পাছত": { native: "after that; then", bases: { "তাৰ": "he; that", "পাছত": "the back; behind; later" } }
      "ভাত খোৱাৰ পাছত": { native: "after the meal", bases: { "পাছত": "the back; behind; later" } }
  "as-0125":
    native: "5, five"
    notes:
      "n1": "Nasal vowel: পাঁচ (pām̐s, five) is said through the nose; পাছ (pās, back) is not."
    examples:
      "মোৰ বয়স পাঁচ বছৰ।": { native: "I am five years old.", bases: {  } }
      "পাঁচ কিলোমিটাৰ।": { native: "Five kilometres.", bases: {  } }
