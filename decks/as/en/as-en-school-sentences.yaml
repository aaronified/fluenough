tags: ["unreviewed"]
cards:
  "as-2780":
    native: "I go to school."
    notes:
      "n1": "-লৈ (-lôi), 'to', marks where you are going: স্কুললৈ (skulôlôi), to school. যাওঁ (zāum̐) is the 'I' form of যোৱা (zuwā), 'to go', with the stem যা- (zā-)."
    confusables:
      "c1": { why: "To come, the opposite direction." }
      "c2": { why: "Home, not school." }
  "as-2781":
    native: "The female teacher has asked a question."
    notes:
      "n1": "শিক্ষয়ত্ৰী (xikkhôyotri) is the female teacher; the male teacher is শিক্ষক (xikkhôk). সুধিছে (xudhise) is the stem সুধ- (xudh-) of সুধা (xudhā), 'to ask', plus -িছে (-ise)."
    bases:
      "সুধিছে": "to ask"
    confusables:
      "c1": { why: "An answer, not a question." }
      "c2": { why: "A lesson, not a question." }
  "as-2782":
    native: "The student has given the answer."
    notes:
      "n1": "দিছে (dise) is a form of দিয়া (diyā), 'to give', with the stem দি- (di-) and the ending -ছে (-se). The answer উত্তৰ (uttôr) comes before the verb."
    confusables:
      "c1": { why: "An eraser, not an answer." }
      "c2": { why: "A notebook, not an answer." }
  "as-2783":
    native: "Write the sum in the notebook."
    notes:
      "n1": "-ত (-t), 'in', joins খাতা (khātā), notebook: খাতাত (khātāt). লিখা (likhā), 'write', is a command ending in -া (-ā)."
    confusables:
      "c1": { why: "Chalk, a board tool, not a notebook." }
      "c2": { why: "A bench, a piece of furniture." }
  "as-2784":
    native: "Are you present today?"
    notes:
      "n1": "নেকি (neki) at the end turns a statement into a yes-or-no question. আছা (āsā) is the 'you' form of 'to be' for someone called তুমি (tumi)."
    bases:
      "আছা": "to be; there is; to have"
    confusables:
      "c1": { why: "Absent, the opposite of present." }
      "c2": { why: "Why, a question word." }
  "as-2785":
    native: "I like science."
    notes:
      "n1": "ভাল লাগে (bhāl lāge) is literally 'good is felt': the subject liked, বিজ্ঞান (bigyān), science, comes first."
    confusables:
      "c1": { why: "Geography, another school subject." }
      "c2": { why: "Maths, another school subject." }
  "as-2786":
    native: "The bell is ringing."
    notes:
      "n1": "বাজিছে (bāzise) is the stem বাজ- (bāz-) of বাজা (bāzā), 'to ring, sound', plus -িছে (-ise)."
    bases:
      "বাজিছে": "to play; to sound; to ring"
    confusables:
      "c1": { why: "A festival, not a bell." }
      "c2": { why: "Thunder, the other sort of noise." }
  "as-2787":
    native: "I draw a picture."
    notes:
      "n1": "আঁকোঁ (ām̐kum̐) is the 'I' present of আঁকা (ām̐kā), 'to draw': the stem আঁক- (ām̐k-) keeps its chandrabindu and takes -ওঁ (-um̐)."
    confusables:
      "c1": { why: "To read, not to draw." }
      "c2": { why: "To write, not to draw." }
