schema: 1
id: "as-en-transport"
kind: "layer"
core: "as-transport"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bus, auto, cab"
license: "CC0-1.0"
description: "Getting a ride, agreeing the fare and getting off where you want, and the boats that cross the Brahmaputra. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0298":
    native: "bus"
    notes:
      "n1": "Assamese writes the s of English words with ছ (sô) or চ (sô): বাছ (bās), bus. বাছেৰে (bāsere), by bus."
  "as-0299":
    native: "auto-rickshaw"
    notes:
      "n1": "Shared autos and city buses run fixed routes in Guwahati; call out where you are going before you get in."
  "as-0300":
    native: "taxi"
  "as-0301":
    native: "cycle rickshaw"
  "as-0302":
    native: "fare"
    notes:
      "n1": "ভাড়া কিমান? (bhara kiman?), how much is the fare? The same word is rent."
  "as-0303":
    native: "Please put the meter on."
    notes:
      "n1": "Ask before you get in. If the driver refuses, agree the fare first."
    bases:
      "মিটাৰ": "meter"
      "অন": "on"
      "কৰক": "to do; to make"
  "as-0304":
    native: "I need to go to the station."
    notes:
      "n1": "-লৈ (-loi), 'to', joins the end of the place, with -অ- (-ô-) after a consonant: ঘৰলৈ (ghôrôlôi), home. যাব লাগে (zāb lāge), 'going is needed'."
    bases:
      "যাব": "to go"
  "as-0305":
    native: "How long will it take?"
    notes:
      "n1": "Literally 'how much time will it need?'"
  "as-0306":
    native: "Stop here, please."
    notes:
      "n1": "ইয়াতে (iyāte), right here."
    bases:
      "ৰখাই": "to stop"
  "as-0307":
    native: "station"
    notes:
      "n1": "English st is written ষ্ট (stô), and s is চ (sô)."
  "as-0308":
    native: "ticket"
  "as-0309":
    native: "seat"
    notes:
      "n1": "Formally আসন (āxôn)."
  "as-0310":
    native: "a crowd; crowded"
    notes:
      "n1": "বাছত বৰ ভিৰ (bāsôt bôr bhir), the bus is very crowded."
  "as-0311":
    native: "empty; free (of a seat)"
    notes:
      "n1": "এই ছিটটো খালী নেকি? (ei sittu khali neki?), is this seat free?"
  "as-0312":
    native: "let's go; please go"
    notes:
      "n1": "To a friend: ব (bô)'লা (bola), let's go."
  "as-0313":
    native: "boat"
    notes:
      "n1": "Across the Brahmaputra, people and motorbikes ride the ferries, and the small motor boats are ভুটভুটী (bhutbhuti), named for the sound of their engines."
