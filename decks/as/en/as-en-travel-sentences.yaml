id: "as-en-travel-sentences"
kind: "layer"
core: "as-travel-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Travel: hotels, bookings and trips: sentences"
license: "CC-BY-SA-4.0"
description: "Sentences built from the words of this unit and the ones before it. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3346":
    native: "I have booked a room at the hotel."
    notes:
      "n1": "-ত (-t), 'at', joins হোটেল (hutel): হোটেলত (hutelôt), at the hotel. বুক কৰা (buk kôrā), 'to book', is the English word বুক (buk) plus কৰা (kôrā), 'to do'."
    bases:
      "বুক": "book (a seat or ticket)"
    confusables:
      "c1": { why: "Will leave, not the booking." }
      "c2": { why: "A passport, not a room." }
  "as-3347":
    native: "The booking is tomorrow."
    notes:
      "n1": "No word for 'is' is needed: বুকিং (bukiṅ), booking, is simply followed by কাইলৈ (kāilôi), tomorrow."
    confusables:
      "c1": { why: "Will leave, the other end of the stay." }
      "c2": { why: "The reception desk, not the booking." }
  "as-3348":
    native: "I go to the museum."
    notes:
      "n1": "-লৈ (-lôi) means 'to' and marks where you are going: মিউজিয়ামলৈ (miuziyāmôlôi), to the museum. যাওঁ (zāum̐) is the 'I' form of যোৱা (zuwā), 'to go', whose stem becomes যা- (zā-)."
    confusables:
      "c1": { why: "A beach, a different place." }
      "c2": { why: "A guide, a person not a place." }
  "as-3349":
    native: "The tourist goes to the beach."
    notes:
      "n1": "যায় (zāy) is the 'he, she' present of যোৱা (zuwā), 'to go': the stem becomes যা- (zā-). The goal takes -লৈ (-lôi), 'to': সৈকতলৈ (xôikôtôlôi)."
    confusables:
      "c1": { why: "A guide, a person who goes with them." }
      "c2": { why: "A visa, a paper not a person." }
  "as-3350":
    native: "A passport is needed."
    notes:
      "n1": "লাগে (lāge) means 'is needed': the thing needed comes first and the person who needs it can be left out, as in পাছপৰ্ট লাগে (pāsôpôrt lāge)."
    confusables:
      "c1": { why: "A visa, the other paper needed to go abroad." }
      "c2": { why: "An address, not a passport." }
  "as-3351":
    native: "The suitcase is heavy."
    notes:
      "n1": "No word for 'is' is needed: the adjective ভাৰী (bhāri), heavy, comes straight after সুটকেচ (xutôkes), suitcase."
    confusables:
      "c1": { why: "Light, the opposite of heavy." }
      "c2": { why: "A bag, close but a different thing." }
  "as-3352":
    native: "The route is long."
    confusables:
      "c1": { why: "Short, the opposite of long." }
      "c2": { why: "Distance, close in meaning." }
  "as-3353":
    native: "There are pictures in the museum."
    notes:
      "n1": "আছে (āse) here means 'there is'. মিউজিয়ামত (miuziyāmôt), in the museum, comes first, then the thing that is there."
    bases:
      "আছে": "to be; there is; to have"
    confusables:
      "c1": { why: "A plane, not a museum." }
      "c2": { why: "A hotel, not a museum." }
