id: "as-en-first-words"
kind: "layer"
core: "as-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "The respect Assamese builds into 'you', how a host welcomes a guest, and 'what's new?'. Greetings and saying you are still learning are in the phrasebook. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0127":
    native: "you (respectful)"
    notes:
      "n1": "Assamese has three words for 'you': আপুনি (āpuni) for strangers, elders and customers; তুমি (tumi) for friends and family; তই (toi) only for the very close, and rude to anyone else. The verb changes with each. A learner is always safe with আপুনি (āpuni)."
  "as-0138":
    native: "Come in, sit down. (welcoming a guest)"
    notes:
      "n1": "What a host says at the door. A guest in an Assamese home is offered tea, and in many homes তামোল-পাণ (tāmul-pān), betel nut and leaf. অহা (ôhā), to come, changes its stem: আহ- (āh-)."
    bases:
      "আহক": "to come"
      "বহক": "to sit"
  "as-0139":
    native: "What's new?; How's things?"
    notes:
      "n1": "To someone you know: 'what news?'"
    bases:
      "খবৰ": "news"
  "as-2531":
    native: "right; okay; fine"
    notes:
      "n1": "ঠিক (ṭhik) is 'right' or 'correct', and in reply 'all right'. ঠিক আছে (ṭhik āse), 'it is all right', is the everyday way to agree or to say that things are fine."
    examples:
      "ঠিক আছে।":
        native: "It's all right."
        bases:
          "ঠিক": "right"
          "আছে": "is"
      "ঠিক আছে, ধন্যবাদ।":
        native: "All right, thank you."
        bases:
          "ঠিক": "right"
          "আছে": "is"
          "ধন্যবাদ": "thank you"
