schema: 1
id: "as-en-workplace"
kind: "layer"
core: "as-workplace"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The workplace"
license: "CC-BY-SA-4.0"
description: "The office and the people in it: the manager, the colleagues, the meetings, the files and the deadlines. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3093":
    native: "manager"
    notes:
      "n1": "The person who leads the team at work. Written as said in English."
    examples:
      "মেনেজাৰ আহিছে।": "The manager has come."
      "মেনেজাৰ ভাল।": "The manager is good."
  "as-3094":
    native: "colleague; co-worker"
    notes:
      "n1": "A person who works at the same office."
    examples:
      "সহকৰ্মী বহুত।": "There are many colleagues."
      "মোৰ সহকৰ্মী ভাল।": "My colleague is good."
  "as-3095":
    native: "employee; staff member"
    notes:
      "n1": "A person who is paid to work in an office or a shop."
    examples:
      "কৰ্মচাৰী উপস্থিত।": "The staff are present."
      "নতুন কৰ্মচাৰী।": "A new employee."
  "as-3096":
    native: "boss"
    notes:
      "n1": "The person above you at work. Written as said in English."
    examples:
      "বস আহিছে।": "The boss has come."
      "বস কঠিন।": "The boss is strict."
  "as-3097":
    native: "report"
    notes:
      "n1": "A written account of work done."
    examples:
      "প্ৰতিবেদন লিখিছোঁ।": "I have written the report."
      "প্ৰতিবেদন ভাল।": "The report is good."
  "as-3098":
    native: "decision"
    notes:
      "n1": "The choice made at a meeting. To decide is সিদ্ধান্ত লোৱা (siddhānt luwā)."
    examples:
      "সিদ্ধান্ত ভাল।": "The decision is good."
      "এইটো সিদ্ধান্ত।": "This is the decision."
  "as-3099":
    native: "computer"
    notes:
      "n1": "The machine for work and study. Written as said in English."
    examples:
      "কম্পিউটাৰ ঠিক।": "The computer is working."
      "কম্পিউটাৰত কাম।": { native: "Work on the computer.", bases: { "কম্পিউটাৰত": "computer" } }
  "as-3100":
    native: "file (for papers or computer)"
    notes:
      "n1": "A folder of papers, or a document on the computer. Written as said in English."
    examples:
      "ফাইল নতুন।": "The file is new."
      "ফাইল বিচাৰোঁ।": "I am looking for the file."
  "as-3101":
    native: "appointment; job offer"
    notes:
      "n1": "The act of hiring someone for a job, or a fixed meeting time."
    examples:
      "নিযুক্তি পালোঁ।": { native: "I have got the appointment.", bases: { "পালোঁ": "to get; to receive" } }
      "নিযুক্তি কাইলৈ।": "The appointment is tomorrow."
  "as-3102":
    native: "meeting; interview"
    notes:
      "n1": "A meeting with a person, for work or for a question."
    examples:
      "সাক্ষাৎ ভাল।": "The meeting went well."
      "সাক্ষাৎ আছে।": { native: "There is a meeting.", bases: { "আছে": "to be; there is; to have" } }
  "as-3103":
    native: "discussion"
    notes:
      "n1": "A talk about a topic, between people."
    examples:
      "আলোচনা বহুত।": "There is a lot of discussion."
      "আলোচনা ভাল।": "The discussion is good."
  "as-3104":
    native: "introduction; identity"
    notes:
      "n1": "When people are introduced to each other. Also the identity of a person."
    examples:
      "পৰিচয় দিয়ক।": "Please introduce yourself."
      "পৰিচয় ভাল।": "The introduction is good."
  "as-3105":
    native: "deadline; time limit"
    notes:
      "n1": "The last time by which work must be done."
    examples:
      "সময়সীমা কাইলৈ।": "The deadline is tomorrow."
      "সময়সীমা শেষ।": { native: "The deadline is over.", bases: { "শেষ": "end; last; finish" } }
  "as-3106":
    native: "department; section"
    notes:
      "n1": "A part of an office with its own work."
    examples:
      "বিভাগ ডাঙৰ।": "The department is big."
      "বিভাগত কাম।": { native: "Work in the department.", bases: { "বিভাগত": "department; section" } }
  "as-3107":
    native: "meeting; assembly"
    notes:
      "n1": "A meeting of many people to talk and decide things."
    examples:
      "সভা আছে।": { native: "There is a meeting.", bases: { "আছে": "to be; there is; to have" } }
      "সভা শেষ।": { native: "The meeting is over.", bases: { "শেষ": "end; last; finish" } }
  "as-3108":
    native: "sitting; meeting (of a few people)"
    notes:
      "n1": "A small meeting, sitting together."
    examples:
      "বৈঠক আহিছে।": "The meeting has come."
      "বৈঠক বহুত দীঘল।": "The meeting is very long."
  "as-3109":
    native: "working hours"
    notes:
      "n1": "The hours of the working day."
    examples:
  "as-3110":
    native: "to discuss"
    notes:
      "n1": "To talk over a topic with others."
    examples:
  "as-3111":
    native: "to decide"
    notes:
      "n1": "To make a decision."
    examples:
  "as-3112":
    native: "to finish the work"
    notes:
      "n1": "To complete the task."
    bases:
      "শেষ": "end; last; finish"
    examples:
