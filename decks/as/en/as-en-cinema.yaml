schema: 1
id: "as-en-cinema"
kind: "layer"
core: "as-cinema"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Cinema: films, actors and the screen"
license: "CC-BY-SA-4.0"
description: "Going to the pictures and talking about a film: the actor, the director, the story, the hero and the review. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3571":
    native: "film; movie"
    notes:
      "n1": "A story shown on the screen. Written as said in English."
    examples:
      "ফিল্ম ভাল।": "The film is good."
      "ফিল্ম দেখিছোঁ।": "I have seen a film."
  "as-3572":
    native: "actor"
    notes:
      "n1": "A man who acts in a film or a play."
    examples:
      "অভিনেতা ভাল।": "The actor is good."
      "অভিনেতা আহিছে।": "The actor has come."
  "as-3573":
    native: "actress"
    notes:
      "n1": "A woman who acts in a film or a play."
    examples:
      "অভিনেত্ৰী ধুনীয়া।": "The actress is lovely."
      "অভিনেত্ৰী আহিছে।": "The actress has come."
  "as-3574":
    native: "director"
    notes:
      "n1": "The person who makes a film and tells the actors what to do."
    examples:
      "পৰিচালক ভাল।": "The director is good."
      "পৰিচালক ব্যস্ত।": "The director is busy."
  "as-3575":
    native: "story; plot"
    notes:
      "n1": "The story of a film, a book or a song."
    examples:
      "কাহিনী ভাল।": "The story is good."
      "কাহিনী দীঘল।": "The story is long."
  "as-3576":
    native: "scene"
    notes:
      "n1": "One part of a film, where the action takes place in one place."
    examples:
      "দৃশ্য ভাল।": "The scene is good."
      "এইটো দৃশ্য ডাঙৰ।": "This scene is big."
  "as-3577":
    native: "hero (male lead)"
    notes:
      "n1": "The main man in a film, the one the story follows."
    examples:
      "নায়ক ধুনীয়া।": "The hero is lovely."
      "নায়ক আহিছে।": "The hero has come."
  "as-3578":
    native: "heroine (female lead)"
    notes:
      "n1": "The main woman in a film."
    examples:
      "নায়িকা ভাল।": "The heroine is good."
      "নায়িকা আহিছে।": "The heroine has come."
  "as-3579":
    native: "dialogue"
    notes:
      "n1": "The words spoken by the actors to each other."
    examples:
      "সংলাপ ভাল।": "The dialogue is good."
      "সংলাপ শুনা।": "To listen to the dialogue."
  "as-3580":
    native: "award; prize"
    notes:
      "n1": "A prize given for good work in a film or a game."
    examples:
      "পুৰস্কাৰ পালে।": { native: "He got an award.", bases: { "পালে": "to get; to receive" } }
      "পুৰস্কাৰ ডাঙৰ।": "The prize is big."
  "as-3581":
    native: "trailer"
    notes:
      "n1": "A short film that shows a little of the next film. Written as said in English."
    examples:
      "ট্ৰেইলাৰ ভাল।": "The trailer is good."
      "ট্ৰেইলাৰ দেখিলোঁ।": "I saw the trailer."
  "as-3582":
    native: "genre"
    notes:
      "n1": "The kind of film: comedy, drama, horror. Written as said in English."
    examples:
      "জেনাৰ ভাল।": "The genre is good."
      "এইটো জেনাৰ।": "This is a genre."
  "as-3583":
    native: "play; drama"
    notes:
      "n1": "A story acted on a stage by actors."
    examples:
      "নাটক ভাল।": "The play is good."
      "নাটক দেখিছোঁ।": "I have seen a play."
  "as-3584":
    native: "viewer; audience"
    notes:
      "n1": "A person who watches a film, a play or a show."
    examples:
      "দৰ্শক বহুত।": "There are many viewers."
      "দৰ্শক আহিছে।": "The viewers have come."
  "as-3585":
    native: "to act (in a film or play)"
    notes:
      "n1": "To play a part in a film or a play."
    bases:
      "অভিনয়": "acting"
    examples:
  "as-3586":
    native: "cinema hall"
    notes:
      "n1": "The building where films are shown."
