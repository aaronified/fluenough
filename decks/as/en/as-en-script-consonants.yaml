schema: 1
id: "as-en-script-consonants"
kind: "layer"
core: "as-script-consonants"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Assamese consonants"
license: "CC0-1.0"
description: "Every consonant, each carrying its vowel o, then the dotted letters and the three marks for nasals and breath, on ক (kô). Assamese says many letters alike: স (xô), শ (xô) and ষ (xô) are all x, চ (sô) and ছ (sô) are s, জ (zô) and য (zô) are z, and ত (tô) and ট (tô) are one t. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0012":
    native: "k (kô)"
    notes:
      "n1": "Like the 'k' of 'skin', with no puff of breath after it. Every consonant carries the open vowel o (অ) unless a sign changes it."
  "as-0013":
    native: "kh, with a breath (khô)"
    notes:
      "n1": "ক (kô) with a puff of breath after it, as in the 'kh' of 'blockhead': খাৰ (khār), the alkaline dish every Assamese meal starts with. Don't confuse it with the rasp x of স (xô)."
  "as-0014":
    native: "g (gô)"
    notes:
      "n1": "Like the 'g' of 'go': গছ (gôs, tree)."
  "as-0015":
    native: "gh, with a breath (ghô)"
    notes:
      "n1": "গ (gô) with a breath after it, as in the 'gh' of 'doghouse': ঘৰ (ghôr, house; home)."
  "as-0016":
    native: "ng (as in 'singer')"
    notes:
      "n1": "The 'ng' of 'singer'. Assamese has it between vowels, where Bengali often writes ং (ôṅ): ৰঙা (rôṅā, red), ডাঙৰ (dāṅôr, big). It never starts a word."
  "as-0017":
    native: "s (prothom so, 'the first s')"
    notes:
      "n1": "Said s, not the 'ch' it is in Bengali and Hindi: চাহ (sāh, tea). Assamese writes English s with it too: অফিচ (ôphis, office)."
  "as-0018":
    native: "s (ditiyo so, 'the second s')"
    notes:
      "n1": "Sounds just like চ (sô), s: ছবি (sobi, picture). Once it had a breath after it; Assamese lost it. Because it sounds the same, it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  "as-0019":
    native: "j, said z (borgiyo jo)"
    notes:
      "n1": "Said z, as in 'zoo', not the 'j' of 'judge', though chat writes it j: জোন (zun, moon). It is called borgiyo jo, 'the j of the rows', to tell it from য (zô), which sounds the same."
  "as-0020":
    native: "j, with a breath (zô)"
    notes:
      "n1": "জ (zô) with a breath after it in careful speech, though most people say it as z. It is rare, in words from Sanskrit and Hindi. Because it sounds like জ (zô), it is drilled by reading and writing only."
  "as-0021":
    native: "ny (in conjuncts)"
    notes:
      "n1": "A nasal made against the palate. You see it almost only in conjuncts such as ঞ্চ (nsô) and ঞ্জ (nz), where it sounds like n: পঞ্চাশ (pônsāx, fifty). Hardly ever heard on its own, so it is drilled by reading and writing only."
  "as-0022":
    native: "t (to, of the ট (tô) row)"
    notes:
      "n1": "In Bengali and Hindi the tongue curls back for ট (tô). Assamese says ট (tô) and ত (tô) alike, with the tongue on the ridge behind the teeth, just where English says 't': টকা (tôkā, rupee; money). Because it sounds like ত (tô), it is drilled by reading and writing only."
  "as-0023":
    native: "th, with a breath (tho, of the ট (tô) row)"
    notes:
      "n1": "ট (tô) with a breath after it, said just like থ (thô): ঠাই (thāi, place). Because it sounds the same, it is drilled by reading and writing only."
  "as-0024":
    native: "d (do, of the ট (tô) row)"
    notes:
      "n1": "Said just like দ (dô), with the tongue on the ridge behind the teeth: ডাক্তৰ (dāktôr, doctor). Because it sounds the same, it is drilled by reading and writing only."
  "as-0025":
    native: "dh, with a breath (dho, of the ট (tô) row)"
    notes:
      "n1": "ড (dô) with a breath after it, said just like ধ (dhô): ঢোল (dhul), the drum of Bihu. Because it sounds the same, it is drilled by reading and writing only."
  "as-0026":
    native: "n (murdhonyo no)"
    notes:
      "n1": "Sounds just like ন (nô): murdhonyo means 'curled back', as it once was. It is a spelling, mostly in words from Sanskrit and in সোণ (xun, gold; and, to a child, 'dear'). Because it sounds the same, it is drilled by reading and writing only."
  "as-0027":
    native: "t (tô)"
    notes:
      "n1": "Like the 't' of 'stop', with no puff of breath, the tongue on the ridge behind the teeth: তুমি (tumi, you). Assamese says ট (tô) the same way."
  "as-0028":
    native: "th, with a breath (thô)"
    notes:
      "n1": "ত (tô) with a breath after it. Not the 'th' of 'thin': কথা (kôthā, a word; talk)."
  "as-0029":
    native: "d (dô)"
    notes:
      "n1": "Like the 'd' of 'day': দেউতা (deutā, father)."
  "as-0030":
    native: "dh, with a breath (dhô)"
    notes:
      "n1": "দ (dô) with a breath after it. Not the 'th' of 'this': ধান (dhān, paddy, rice still in its husk)."
  "as-0031":
    native: "n (donto no)"
    notes:
      "n1": "The 'n' of 'no'. Donto means 'of the teeth', to tell it from ণ (nô), which sounds the same: নাম (nām, name)."
  "as-0032":
    native: "p (pô)"
    notes:
      "n1": "Like the 'p' of 'spin', with no puff of breath: পানী (pāni, water)."
  "as-0033":
    native: "ph, with a breath (phô)"
    notes:
      "n1": "প (pô) with a breath after it. Many speakers say it like English 'f', and Assamese writes English f with it: ফুল (phul, flower). Chat writes it ph or f."
  "as-0034":
    native: "b (bô)"
    notes:
      "n1": "Like the 'b' of 'boy': বিহু (bihu), the great festival of Assam. Compare ৰ (rô), which is ব (bô) with a slanting stroke inside."
  "as-0035":
    native: "bh, with a breath (bhô)"
    notes:
      "n1": "ব (bô) with a breath after it: ভাত (bhāt, cooked rice). Assamese writes English v with it: ড্ৰাইভাৰ (drāibhār, driver)."
  "as-0036":
    native: "m (mô)"
    notes:
      "n1": "Like the 'm' of 'mother': মাছ (mās, fish), the heart of an Assamese meal."
  "as-0037":
    native: "j, said z (ontostho jo)"
    notes:
      "n1": "At the start of a word it sounds just like জ (zô), z: যোৱা (zuwā, to go). After another consonant it is written as the y-sign (য-ফলা), as in ব্য (byô). Because it sounds the same as জ (zô), it is drilled by reading and writing only."
  "as-0038":
    native: "r (rô)"
    notes:
      "n1": "Assamese's own r: ব (bô) with a slanting stroke across it. Bengali writes র (rô) instead, ব (bô) with a dot below, so text typed on a Bengali keyboard sometimes shows র (rô) where ৰ (rô) belongs. Said with a light touch of the tongue, often a little like English 'r': ৰাতি (rāti, night)."
  "as-0039":
    native: "l (lô)"
    notes:
      "n1": "A clear 'l', as at the start of 'leaf': লাহে লাহে (lāhe lāhe, slowly, gently), a phrase Assam lives by."
  "as-0040":
    native: "w (ontostho wo)"
    notes:
      "n1": "Assamese's own w: ব (bô) with a stroke below. Bengali has no such letter. It comes mostly between vowels: খোৱা (khuwā, to eat)."
  "as-0041":
    native: "x (talobyo xo)"
    notes:
      "n1": "Said x, just like স (xô): শনিবাৰ (xonibār, Saturday). Not the 'sh' of Bengali and Hindi. Because it sounds the same as স (xô), it is drilled by reading and writing only."
  "as-0042":
    native: "x (murdhonyo xo)"
    notes:
      "n1": "Said x, just like স (xô). It is a spelling, mostly in words from Sanskrit: ভাষা (bhāxā, language). Because it sounds the same, it is drilled by reading and writing only."
  "as-0043":
    native: "x, a rasp at the back of the mouth (donto xo)"
    notes:
      "n1": "Assamese's best-known sound: not s but x, a rasp at the back of the mouth, like the 'ch' of Scottish 'loch' or German 'Bach'. That is why Assam, অসম (ôxôm), is typed Axom: সাত (xāt, seven). Next to t, th or k it is s: ৰাস্তা (rāstā, road)."
  "as-0044":
    native: "h (hô)"
    notes:
      "n1": "Like the 'h' of 'hat': হাত (hāt, hand). Keep it apart from the rasp of স (xô): সাত (xāt) is seven."
  "as-0045":
    native: "r, written ড (dô) with a dot below"
    notes:
      "n1": "ড (dô) with a dot below. In Assamese it sounds like ৰ (rô), and only a few words use it: ঘড়ী (ghori, clock; watch). It never starts a word. Because it sounds like ৰ (rô), it is drilled by reading and writing only."
  "as-0046":
    native: "rh, written ঢ (dhô) with a dot below"
    notes:
      "n1": "ঢ (dhô) with a dot below: an r with a breath after it. It never starts a word: পঢ়া (pôrhā, to read; to study). It is rare, so it is drilled by reading and writing only."
  "as-0047":
    native: "y (ontostho yo)"
    notes:
      "n1": "য (zô) with a dot below: a 'y' glide between vowels. It never starts a word: কেতিয়া (ketiyā, when)."
  "as-0048":
    native: "t, with no vowel (khondo to)"
    notes:
      "n1": "A t that ends a syllable with no vowel after it: হঠাৎ (hôthāt, suddenly), উৎসৱ (utxôw, festival)."
  "as-0049":
    native: "ng after a vowel (onuswar), on ক (kô)"
    notes:
      "n1": "ং (onuswar) after a vowel is said 'ng': কং (kôṅ) is 'kong', as in ৰং (rôṅ, colour). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  "as-0050":
    native: "the breath mark (bixorgo), on ক (kô)"
    notes:
      "n1": "ঃ (bixorgo) is rare, in words from Sanskrit: দুঃখিত (dukhitô, sorry). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  "as-0051":
    native: "nasal vowel mark (sondrobindu), on কা (kā)"
    notes:
      "n1": "ঁ (sondrobindu) above a letter makes its vowel nasal, said through the nose as well: কাঁহ (kām̐h), the bell metal of Sarthebari. With it or without it are different words: বাহ (bāh, nest), বাঁহ (bām̐h, bamboo, said through the nose). Chat leaves it out, and so do these readings. A mark rather than a sound of its own, so it is drilled by reading and writing only."
