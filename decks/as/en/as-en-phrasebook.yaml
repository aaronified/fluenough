schema: 1
id: "as-en-phrasebook"
kind: "layer"
core: "as-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "20 phrases to say whole from the first day, before their words are taught: greetings and thanks, yes and no, saying you are still learning Assamese, asking for it slowly or again, and asking for help. Not yet checked by a Assamese speaker: please report any mistake."
license: "CC0-1.0"
cards:
  "as-0126":
    native: "hello; goodbye"
    notes:
      "n1": "Said with palms pressed together, to anyone. স (xô) before k is said s. Many Muslim families greet with 'assalamu alaikum' instead. Neither is universal."
  "as-0128":
    native: "How are you? (respectful)"
    notes:
      "n1": "To a friend: কেনে আছা? (kene asa?). Assamese has no grammatical gender, so it is the same to a man or a woman."
  "as-0129":
    native: "I'm fine."
    notes:
      "n1": "From ভাল (bhāl), good, well. The -ওঁ (-um̐) at the end of the verb means 'I', and chat writes it u: আছোঁ (āsum̐), I am."
  "as-0130":
    native: "thank you"
    notes:
      "n1": "Formal. Among family and friends thanks are often left unsaid, and many people say 'thank you' in English."
  "as-0131":
    native: "OK; all right; well then"
    notes:
      "n1": "The all-purpose 'all right'. Also ঠিক আছে (thik āse), and হ (hô)'ব (hobo), 'it will do'. বাৰু (bāru), যাওঁ (baru, jau): well, I'm off."
  "as-0132":
    native: "See you again."
    notes:
      "n1": "Literally 'I'll get your company again'. লগ (lôg) is company, being together."
  "as-0133":
    native: "Sorry; excuse me."
    notes:
      "n1": "For a small mistake, or to get past someone. Also ক্ষমা কৰিব (khômā koribô). The polite future, 'you will forgive', makes a gentle request."
  "as-0134":
    native: "I don't know Assamese."
    notes:
      "n1": "'Not' is a prefix on the verb: জানো (zānu), I know; নাজানো (nāzānu), I don't know."
  "as-0135":
    native: "I'm still learning Assamese."
    notes:
      "n1": "The same for a man and a woman: Assamese verbs do not show gender."
  "as-0136":
    native: "Please speak slowly."
    notes:
      "n1": "কওক (kôuk) is the polite request form of কোৱা (kuwā, to say). Most verbs take -ক (-kô) for a polite request: বহক (bôhôk), please sit; আহক (āhôk), please come; দিয়ক (diyôk), please give. লাহে লাহে (lāhe lāhe), slowly, is also how Assam likes life: unhurried."
  "as-0137":
    native: "Please say that again."
    notes:
      "n1": "আকৌ (ākôu), again; এবাৰ (ebār), once."
  "as-0140":
    native: "yes"
    notes:
      "n1": "Literally 'it is'. Politely, হয় (hôy), ছাৰ (hoy, sar), yes, sir."
  "as-0142":
    native: "no; there isn't"
    notes:
      "n1": "খুচুৰা নাই (khusurā nāi), there's no change."
  "as-0167":
    native: "My name is …"
    notes:
      "n1": "There is no 'is': 'my name …'. মোৰ (mur), my, is said with an o close to u."
  "as-0168":
    native: "What is your name?"
    notes:
      "n1": "To a child or a friend: তোমাৰ নাম কি? (tumar nam ki?)."
  "as-0422":
    native: "Please help!"
  "as-0423":
    native: "Help! Save me!"
  "as-0428":
    native: "I'm lost."
    notes:
      "n1": "Literally 'I have lost the way'."
  "as-0429":
    native: "I didn't understand."
    notes:
      "n1": "Literally 'I did not get it, understanding'. I understand: বুজি পাইছোঁ (buzi pāisum̐)."
  "as-0430":
    native: "Where is the toilet?"
    notes:
      "n1": "Signs say শৌচালয় (xôusālôy)."
