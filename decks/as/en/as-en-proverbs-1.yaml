cards:
  "as-4400":
    native: "Keep both sides satisfied: let the guest stay and let the rice cook."
    notes:
      "literal": "Said to protect both sides, finishing two necessary tasks at the same time."
    bases:
      "অতিথিও": { meaning: "guest, even" }
      "ৰওক": { meaning: "let stay" }
      "চাউলো": { meaning: "rice, too" }
      "সিজক": { meaning: "boil (imperative)" }
  "as-4401":
    native: "Give no place to a stranger guest, and do not spoil the children by indulging them."
    notes:
      "literal": "A stranger may bring danger to the house, and indulging young children spoils their character."
    bases:
      "অচিন": { meaning: "strange, unknown" }
      "আলহীক": { meaning: "guest (object)" }
      "নিদিবা": { meaning: "do not give" }
      "ঠাই": { meaning: "place" }
      "ল’ৰা-ছোৱালীক": { meaning: "children (object)" }
      "লাই": { meaning: "indulgence" }
  "as-4402":
    native: "Eating too much is an invitation to death."
    notes:
      "literal": "Anything beyond what is needed is harmful."
    bases:
      "অধিক": { meaning: "excess, more" }
      "মৃত্যুক": { meaning: "death (object)" }
      "আহ্বান": { meaning: "invitation, call" }
  "as-4403":
    native: "Great need can spoil even a good character."
    notes:
      "literal": "When there is great need, even an honest person may do wrong."
    bases:
      "অভাৱত": { meaning: "in need, in want" }
      "স্বভাৱ": { meaning: "nature, character" }
      "নষ্ট": { meaning: "ruin, spoilt" }
  "as-4404":
    native: "Pride is the root of a fall."
    notes:
      "literal": "When pride enters the mind, humility of character is lost."
    bases:
      "অহঙ্কাৰেই": { meaning: "pride itself" }
      "পতনৰ": { meaning: "of fall" }
  "as-4405":
    native: "Few words are the sign of a wise person."
    notes:
      "literal": "The wise do not talk idly; they speak little and weigh each thing before saying it."
    bases:
      "কথন": { meaning: "speaking, speech" }
      "জ্ঞানীৰ": { meaning: "of the wise" }
      "লক্ষণ": { meaning: "sign, mark" }
  "as-4406":
    native: "If you are good, the whole world is good."
    notes:
      "literal": "If one's own surroundings are good, the whole world seems good; a person who is right keeps everything else right."
    bases:
      "আপোন": { meaning: "own, one's own" }
      "ভালেই": { meaning: "good, indeed" }
      "জগত": { meaning: "world" }
  "as-4407":
    native: "The cow that goes ahead is eaten by the tiger."
    notes:
      "literal": "It is not wise to rush ahead in everything; going first is often where danger lies."
    bases:
      "আগৰ": { meaning: "former, previous" }
      "বাঘে": { meaning: "tiger" }
      "খায়": { meaning: "eats" }
  "as-4408":
    native: "Stretch your legs only as far as your blanket reaches."
    notes:
      "literal": "One should act only according to one's own capacity."
    bases:
      "আঁঠুৱা": { meaning: "knee (uncertain form)" }
      "চাই": { meaning: "seeing, looking" }
      "ঠেং": { meaning: "leg" }
      "মেলিবা": { meaning: "stretch out" }
  "as-4409":
    native: "Whoever plants a thorn for others is pierced by it themselves."
    notes:
      "literal": "Trying to harm others brings harm to oneself."
    bases:
      "আনলৈ": { meaning: "to others" }
      "হুল": { meaning: "sting" }
      "পুতি": { meaning: "planting" }
      "নিজে": { meaning: "oneself" }
      "মৰে": { meaning: "dies" }
      "ফুটি": { meaning: "bursts" }
  "as-4410":
    native: "What is written on the forehead no one can take away, and what is not written no one can give."
    notes:
      "literal": "What is fated to be yours cannot be taken, and what is not fated cannot be given."
    bases:
      "আছে": { meaning: "is, has" }
      "কপালত": { meaning: "on the forehead, in fate" }
      "নিব": { meaning: "will take" }
      "কোনে": { meaning: "who" }
      "দিব": { meaning: "will give" }
  "as-4411":
    native: "Through excess pride, Lanka was destroyed."
    notes:
      "literal": "Ravana's pride destroyed the golden Lanka; without giving up pride, ruin is certain."
    bases:
      "দৰ্পে": { meaning: "in pride" }
      "হত": { meaning: "ruined" }
      "লংকা": { meaning: "Lanka" }
  "as-4412":
    native: "Once bitten by a snake, one fears even its tail."
    notes:
      "literal": "After one disaster, even small dangers are feared."
    bases:
      "সাপে": { meaning: "snake" }
      "খালে": { meaning: "ate" }
      "লেজুলৈকো": { meaning: "even to the tail" }
  "as-4413":
    native: "One hand cannot clap."
    notes:
      "literal": "A quarrel needs at least two sides."
    bases:
      "এখন": { meaning: "one (classifier)" }
      "হাতেৰে": { meaning: "with the hand" }
      "চাপৰি": { meaning: "clap" }
      "নাবাজে": { meaning: "does not sound" }
  "as-4414":
    native: "Leaves of one tree cannot be different from one another."
    notes:
      "literal": "People of one family share the same character."
    bases:
      "একে": { meaning: "same, one" }
      "গছৰ": { meaning: "of tree" }
      "পাণ": { meaning: "leaf" }
      "নো": { meaning: "indeed" }
      "হ’ব": { meaning: "will be" }
  "as-4415":
    native: "An example is better than advice."
    notes:
      "literal": "Showing how to do something is better than only advising it."
    bases:
      "উপদেশতকৈ": { meaning: "than advice" }
      "আৰ্হি": { meaning: "example, model" }
  "as-4416":
    native: "Rubbed again and again, even a stone wears away."
    notes:
      "literal": "With steady effort, even hard work becomes easy."
    bases:
      "ঘহোঁতে": { meaning: "by rubbing" }
      "শিলো": { meaning: "stone" }
      "ক্ষয়": { meaning: "wear, erosion" }
      "যায়": { meaning: "goes" }
  "as-4417":
    native: "Crying does not make a debt disappear."
    notes:
      "literal": "Crying does not clear a debt (the sense of the word for debt is unclear; to be checked)."
    bases:
      "কান্দিলে": { meaning: "on crying" }
      "শুজ": { meaning: "dry" }
      "নেযায়": { meaning: "does not go" }
  "as-4418":
    native: "A dog's tail never becomes straight."
    notes:
      "literal": "Some people's nature does not change however much they try."
    bases:
      "কুকুৰৰ": { meaning: "of dog" }
      "নেজ": { meaning: "tail" }
      "পোন": { meaning: "straight" }
  "as-4419":
    native: "When pulled too tight, the knot snaps."
    notes:
      "literal": "Rules that are too strict force people into lying."
    bases:
      "টান": { meaning: "tight, strict" }
      "হ’লে": { meaning: "if it becomes" }
      "গাঁঠি": { meaning: "knot" }
      "ছিগি": { meaning: "tears, snaps" }
      "যায়": { meaning: "goes" }
