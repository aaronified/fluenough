native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture 3: folk tales of Burhi Aair Sadhu"
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
description: "The opening sentences of ten traditional Assamese folk tales from Burhi Aair Sadhu, the collection that Lakshminath Bezbaroa compiled and wrote down. The author died in 1938, so the text is in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by an Assamese speaker: please report any mistake."

cards:
  "as-4200":
    native: "There was a jackal and a monkey."
    notes:
      "n1": "The opening sentence of the tale; the two animals become friends in the lines that follow."
  "as-4201":
    native: "Long ago, in a certain place, there was a tiger."
    notes:
      "n1": "The opening sentence of the tale; a crab meets the tiger on the road in the next lines."
  "as-4202":
    native: "A merchant had two wives; the elder one had only one daughter, and her name was Tejimola."
    notes:
      "n1": "The opening of the tale of Tejimola."
  "as-4203":
    native: "There was an old man and an old woman."
    notes:
      "n1": "The opening sentence of the tale; foxes come and talk to the old man in the lines that follow."
  "as-4204":
    native: "One day the fish gathered together in order to decide to go to war against the animals that eat fish."
    notes:
      "n1": "The beginning of a clause that goes on in the next line of the tale, where the fish meet at noon."
  "as-4205":
    native: "In a village a man had two beautiful daughters."
    notes:
      "n1": "The opening sentence of the tale; the daughters are named in the next lines."
  "as-4206":
    native: "A rich farmer had two wives; the elder was Elagi and the younger was Lagi."
    notes:
      "n1": "The opening of the tale; Tula and Teja are the children of the two wives."
  "as-4207":
    native: "A king had two queens, and both of them became pregnant."
    notes:
      "n1": "The opening of the tale; the younger queen's child is born as an ou, the fruit of the elephant-apple tree."
  "as-4208":
    native: "At one time, in a certain place, there was a very rich man, and he had two wives."
    notes:
      "n1": "The opening of the tale; each wife has a daughter in the lines that follow."
  "as-4209":
    native: "One day a man had invited his son-in-law to come and share the Bihu feast."
    notes:
      "n1": "The opening sentence of the tale; the son-in-law sets out in the evening in the next lines."
  "as-4210":
    native: "There was a woman gardener."
    notes:
      "n1": "The opening sentence of the tale: the gardener tends a flower tree that will not bloom, and she asks the tree, the cow and others why."
  "as-4211":
    native: "One day a poor man fished all day but caught only one singhi fish."
    notes:
      "n1": "The opening sentence of the tale: the man fishes all day and catches one singhi fish, and the rest of the story follows from that."
  "as-4212":
    native: "An old man had seven sons."
    notes:
      "n1": "The opening of the tale: the old man dies before his sons are grown, and the youngest son is the one the brothers love most."
  "as-4213":
    native: "In a country there was a potter."
    notes:
      "n1": "The opening sentence of the tale; the potter has much wealth but no son, and his wife bears only daughters in the lines that follow."
  "as-4214":
    native: "It is said that there was a crow and a tipchi bird."
    notes:
      "n1": "The opening of the tale; the two birds become friends, and the crow then proposes a contest of grain that ends in a threat to eat the other."
  "as-4215":
    native: "There were two very dear women friends."
    notes:
      "n1": "The opening of the tale: when one friend dies she gives her son into the hands of the other, with instructions to bring him up well."
  "as-4216":
    native: "There was an old woman."
    notes:
      "n1": "The opening of the tale: the old woman says a phrase about the Long-Legged One, and a thief and a tiger overhear it and wonder what it means."
  "as-4217":
    native: "In a village there was an old woman."
    notes:
      "n1": "The opening of the tale: an egg the boy brings home hatches into a girl who lives in the smoke-loft and comes down to eat the old woman's leftover rice."
