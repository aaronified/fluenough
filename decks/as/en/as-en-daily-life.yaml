schema: 1
id: "as-en-daily-life"
kind: "layer"
core: "as-daily-life"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "A day"
license: "CC-BY-SA-4.0"
description: "The day from waking to sleeping, and how often things happen. Verbs are given in their -আ (-ā) form, the one a dictionary lists. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0370":
    native: "to get up"
    notes:
      "n1": "Waking up is সাৰ পোৱা (xār puwā)."
    examples:
      "ভাপ উঠিছে।": { native: "Steam is rising.", bases: { "উঠিছে": "to get up" } }
      "খং উঠা": { native: "to get angry", bases: { "খং": "anger" } }
  "as-0371":
    native: "to bathe; to have a wash"
    notes:
      "n1": "Literally 'to wash the body'."
    bases:
      "গা": "body"
      "ধোৱা": "to wash"
  "as-0372":
    native: "to brush one's teeth"
    notes:
      "n1": "Literally 'to rub the teeth'."
    bases:
      "দাঁত": "tooth"
      "ঘঁহা": "to rub; to brush"
  "as-0373":
    native: "breakfast; a light meal"
    notes:
      "n1": "The traditional Assamese breakfast: flattened or puffed rice, চিৰা (sirā) or আখৈ (ākhôi), with curd and jaggery, দৈ-গুৰ (dôi-gur). Today it can be any snack with tea."
    examples:
      "মই ৰাতিপুৱা জলপান খাওঁ।": { native: "I have breakfast in the morning.", bases: {  } }
      "মোৰ জলপান ভাল।": { native: "My breakfast is good.", bases: {  } }
  "as-0374":
    native: "lunch"
    notes:
      "n1": "Literally 'midday rice': a meal is ভাত (bhāt), rice."
  "as-0375":
    native: "dinner"
    notes:
      "n1": "Literally 'night rice'."
  "as-0376":
    native: "to go to work"
    bases:
      "যোৱা": "to go"
  "as-0377":
    native: "to come home"
    bases:
      "অহা": "to come"
  "as-0378":
    native: "to cook"
    examples:
      "মই ৰন্ধা ভাল পাওঁ।": { native: "I like to cook.", bases: { "পাওঁ": "to get; to like" } }
  "as-0379":
    native: "to sleep; to lie down"
    notes:
      "n1": "Falling asleep is টোপনি যোৱা (tuponi zuwā): টোপনি (tuponi) is sleep."
    examples:
      "শোৱনি কোঠা": { native: "bedroom", bases: { "শোৱনি": "to sleep; to lie down" } }
      "জ্বৰত শুই থকা।": { native: "To lie down with a fever.", bases: { "জ্বৰত": "fever", "শুই": "to sleep; to lie down" } }
  "as-0380":
    native: "always; every day"
    examples:
      "মই সদায় ৰাতিপুৱা জলপান খাওঁ।": { native: "I always have breakfast in the morning.", bases: {  } }
      "মই সদায় সাত বজাত উঠোঁ।": { native: "I get up at seven every day.", bases: { "মই": "I" } }
  "as-0381":
    native: "every day"
    examples:
      "মই প্ৰতিদিনে জলপান খাওঁ।": { native: "I have breakfast every day.", bases: {  } }
      "প্ৰতিদিনে হাঁটা ভাল।": { native: "Walking every day is good.", bases: {  } }
  "as-0382":
    native: "sometimes"
    notes:
      "n1": "কেতিয়া (ketiyā), when, with -বা (-bā), 'some': at some time."
    examples:
      "মই কেতিয়াবা ৰান্ধোঁ।": { native: "I sometimes cook.", bases: {  } }
      "কেতিয়াবা আহিবা।": { native: "You will come sometime.", bases: {  } }
  "as-0383":
    native: "usually"
    examples:
      "মই সাধাৰণতে ৰাতিপুৱা জলপান খাওঁ।": { native: "I usually have breakfast in the morning.", bases: {  } }
      "মোৰ পৰিয়াল সাধাৰণতে ইয়াত থাকে।": { native: "My family usually lives here.", bases: { "থাকে": "to stay; to live" } }
  "as-0384":
    native: "together"
    notes:
      "n1": "আমি একেলগে ভাত খাওঁ (āmi ekelôge bhāt khāum̐), we eat together."
    examples:
      "আমি একেলগে যাওঁ।": { native: "We go together.", bases: {  } }
      "আমি একেলগে কাম সমাপ্ত কৰিলোঁ।": { native: "We finished the work together.", bases: {  } }
  "as-0385":
    native: "after that; then"
    notes:
      "n1": "After a noun, পাছত (pāsôt) means after: ভাতৰ পাছত (bhātôr pāsôt), after the meal."
    bases:
      "তাৰ": "he; that"
  "as-0386":
    native: "I get up at seven every day."
    notes:
      "n1": "The -ওঁ (-um̐) ending is 'I': উঠোঁ (uthum̐), I get up."
    bases:
      "মই": "I"
  "as-0387":
    native: "Then I go to work."
    bases:
      "তাৰ": "he; that"
      "মই": "I"
      "যাওঁ": "to go"
  "as-0388":
    native: "I go to bed at eleven at night."
    notes:
      "n1": "শুবলৈ (xubôlôi), 'to sleep', with যাওঁ (zāum̐), I go."
    bases:
      "মই": "I"
      "যাওঁ": "to go"
  "as-0389":
    native: "I'm never late."
    notes:
      "n1": "পলম (pôlôm), delay; নকৰোঁ (nôkôrum̐), I don't do. 'Never' is কেতিয়াও (ketiyāu), 'ever', with a negative verb."
    bases:
      "মই": "I"
      "পলম": "delay"
      "নকৰোঁ": "to do; to make"
