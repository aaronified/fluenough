name: "Culture 4: history and places of Assam"
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
description: "Short sentences from histories and a play by Padmanath Gohain Baruah, and from Gunabhiram Barua's Assam Buranji, about the Ahom kings, the battle of Saraighat, the Rang Ghar and the general Lachit Borphukan. The authors died in 1946 and 1894, so the text is in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by an Assamese speaker: please report any mistake."

cards:
  "as-4250":
    native: "This time the defeat of the Mughals at our hands is certain."
    notes:
      "n1": "A line spoken by Panifukan in a play about Lachit Borphukan, the Ahom general who led the fight against the Mughals; in this scene the commanders agree to advance on the enemy."
  "as-4251":
    native: "Sukapha Swargadeo was the first king of the Ahoms in the land of Assam."
    notes:
      "n1": "A sentence of this short history of Assam, which names Sukapha as the first king of the Ahoms. Swargadeo is the title of an Ahom king."
  "as-4252":
    native: "As far as he extended his kingdom, so far his own name became the name of the country, Asam-desh."
    notes:
      "n1": "The book explains here how the land got the name Asam, from the name that people gave to Sukapha, and how the name Asam became Ahom in the Tai mouth."
  "as-4253":
    native: "After the glory won in the battle of Saraighat, the Ahom nobles became puffed up;"
    notes:
      "n1": "The first sentence of a chapter of the short history, which says what happened to the nobles of the Ahom court after the victory at Saraighat."
  "as-4254":
    native: "Sitting on the upper floor of this house, the king watched buffalo fights, elephant fights, bird fights, wrestling and other sports."
    notes:
      "n1": "The house is the Rang Ghar of Rangpur, which the book says was built in 1746; the sentence says what the king did there."
  "as-4260":
    native: "There was a son of Sachipatra, the chief minister of King Nilambar."
    notes:
      "n1": "The account of King Nilambar and his chief minister Sachipatra, from the history Buranji Bodh."
  "as-4261":
    native: "Then, in 1498, Sachipatra attacked Nilambar's capital Kamatapur with many Muslim soldiers."
    notes:
      "n1": "The attack on Kamatapur as the history gives it; the year is written in the Christian era."
  "as-4262":
    native: "In the battle both Mula Gabharu and Turbak fell."
    notes:
      "n1": "A line from the account of a battle in the history, in which two named men fell."
  "as-4263":
    native: "In that battle many of the Muslims' guns remained in the hands of the Ahoms."
    notes:
      "n1": "From the same battle, as the history tells it."
  "as-4264":
    native: "In his day the famous Chinese traveller Hiuen Tsang came to this country."
    notes:
      "n1": "The history names the Chinese traveller Hiuen Tsang as a visitor to this country."
  "as-4265":
    native: "That was the beginning of Brahmins coming to this country."
    notes:
      "n1": "A short line in the history that marks the start of Brahmins coming to the country."
  "as-4266":
    native: "Among these, King Susenghphaa Swargadeo was famous."
    notes:
      "n1": "A line in the history that names Susenghphaa Swargadeo, one of the Ahom kings, as famous."
  "as-4267":
    native: "In the same way, an Assamese soldier can fight on land, in water and on horseback."
    notes:
      "n1": "A line from the history about the skill of Assamese soldiers in war."
  "as-4268":
    native: "Then, as he came near again and again, Joymati recognised the prince."
    notes:
      "n1": "The story of Joymati, who recognised the prince when he came near."
  "as-4269":
    native: "His satra was on the Nilachal hill in Guwahati."
    notes:
      "n1": "A line from Buranji Bodh about a satra (Vaishnava monastery) on Nilachal hill in Guwahati."
  "as-4270":
    native: "When he gave up the throne, his wife Phuleswari Kunwari became the great queen."
    notes:
      "n1": "A line about the succession of a king, after which his wife became the queen."
  "as-4271":
    native: "The king worships the goddess, so the people must honour the goddess."
    notes:
      "n1": "A line about the royal worship of the goddess Gosani, which the people must honour."
  "as-4272":
    native: "Here was the capital of Bhagadatta, son of King Naraka."
    notes:
      "n1": "A line from Gunabhiram Barua's history of Assam, naming the capital of Bhagadatta, son of Naraka."
