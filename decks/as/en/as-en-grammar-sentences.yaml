id: "as-en-grammar-sentences"
kind: "layer"
core: "as-grammar-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Basic sentences"
license: "CC0-1.0"
description: "Word order, no 'is', and how Assamese says 'have' and 'like'. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-2019":
    native: "I am a student."
    notes:
      "n1": "No separate 'am'. এজন (ezôn), 'one person', often stands where English has 'a'. A woman says মই এজনী ছাত্ৰী (moi ezoni sātri)."
  "as-2020":
    native: "This is my house."
    notes:
      "n1": "There is no 'is' in the present."
  "as-2021":
    native: "I drink tea."
    notes:
      "n1": "Assamese eats its tea: খোৱা (khuwā) is 'to eat' and 'to drink'. Subject, object, verb."
  "as-2022":
    native: "She is learning Assamese."
  "as-2023":
    native: "I like Assamese."
    notes:
      "n1": "'I get it good': ভাল পোৱা (bhāl puwā) is 'to like', and the one who likes is the doer."
  "as-2024":
    native: "I have a car."
    notes:
      "n1": "'Of me a car there is': the owner takes -ৰ (-rô), and আছে (āse) says 'there is'."
  "as-2025":
    native: "I don't have any money on me."
    notes:
      "n1": "'With me there is no money'. নাই (nāi) is the same for one thing or many."
  "as-2026":
    native: "This isn't good."
    notes:
      "n1": "নহয় (nôhôy) says what something is not; নাই (nāi), that it is not there."
  "as-2027":
    native: "Please don't go."
    notes:
      "n1": "A polite 'don't' is the negative future, here for আপুনি (āpuni). To a friend, নাযাবা (nāzābā)."
  "as-2028":
    native: "It's very hot today."
    notes:
      "n1": "বৰ (bôr) is 'very'. No verb is needed."
