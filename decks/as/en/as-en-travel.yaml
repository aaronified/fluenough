schema: 1
id: "as-en-travel"
kind: "layer"
core: "as-travel"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Travel: hotels, bookings and trips"
license: "CC-BY-SA-4.0"
description: "Going away for a few days: the hotel and the room, the booking, the check-in and check-out, the passport and the places to see. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3330":
    native: "booking"
    notes:
      "n1": "A reservation made in advance for a room or a seat. Written as said in English."
    examples:
      "বুকিং আছে।": { native: "There is a booking.", bases: { "আছে": "to be; there is; to have" } }
      "বুকিং ঠিক।": "The booking is right."
  "as-3331":
    native: "check-in"
    notes:
      "n1": "Arriving at a hotel and taking the room. Written as said in English."
    examples:
      "চেক-ইন কৰা।": "To check in."
      "চেক-ইন কাইলৈ।": "Check-in is tomorrow."
  "as-3332":
    native: "check-out"
    notes:
      "n1": "Leaving a hotel and giving back the room. Written as said in English."
    examples:
      "চেক-আউট কিমান বজাত?": "At what time is check-out?"
      "চেক-আউট বাৰ বজাত।": "Check-out is at twelve."
  "as-3333":
    native: "passport"
    notes:
      "n1": "The travel book with your name, needed to go abroad. Written as said in English."
    examples:
      "পাছপৰ্ট আছে নেকি?": { native: "Do you have a passport?", bases: { "আছে": "to be; there is; to have" } }
      "পাছপৰ্ট নাই।": "There is no passport."
  "as-3334":
    native: "visa"
    notes:
      "n1": "The permission to enter a country. Written as said in English."
    examples:
      "ভিছা লাগে।": "A visa is needed."
      "ভিছা আহিছে।": "The visa has come."
  "as-3335":
    native: "tourist"
    notes:
      "n1": "A person who travels to see new places."
    examples:
      "পৰ্যটক বহুত।": "There are many tourists."
      "পৰ্যটক আহিছে।": "The tourists have come."
  "as-3336":
    native: "tourism"
    notes:
      "n1": "The business and the trade of travel and visits."
    examples:
      "পৰ্যটন ভাল।": "Tourism is good."
      "পৰ্যটন বহুত।": "There is a lot of tourism."
  "as-3337":
    native: "guide"
    notes:
      "n1": "A person who shows you the places. Written as said in English."
    examples:
      "গাইড আহিছে।": "The guide has come."
      "গাইড ভাল।": "The guide is good."
  "as-3338":
    native: "place to see; sight"
    notes:
      "n1": "A place that is worth visiting, a sight."
    bases:
      "দৰ্শনীয়": "worth seeing; notable"
      "স্থান": "place"
    examples:
  "as-3339":
    native: "museum"
    notes:
      "n1": "A building with old things and pictures to see. Written as said in English."
    examples:
      "মিউজিয়াম ডাঙৰ।": "The museum is big."
      "মিউজিয়ামত ছবি।": { native: "There are pictures in the museum.", bases: { "মিউজিয়ামত": "museum" } }
  "as-3340":
    native: "beach; shore"
    notes:
      "n1": "The sandy shore by the sea."
    examples:
      "সৈকত ধুনীয়া।": "The beach is lovely."
      "সৈকতত বালি।": { native: "There is sand on the beach.", bases: { "সৈকতত": "beach; shore" } }
  "as-3341":
    native: "address"
    notes:
      "n1": "Where a person or a hotel is."
    examples:
      "ঠিকনা দিয়ক।": "Please give the address."
      "ঠিকনা ঠিক।": "The address is right."
  "as-3342":
    native: "suitcase"
    notes:
      "n1": "A large case for clothes on a trip. Written as said in English."
    examples:
      "সুটকেচ ভাৰী।": "The suitcase is heavy."
      "সুটকেচ খোলা।": "Open the suitcase."
  "as-3343":
    native: "to stay the night"
    notes:
      "n1": "To spend one night at a place."
    examples:
  "as-3344":
    native: "tourist spot"
    notes:
      "n1": "A place that many visitors come to see."
    examples:
      "পৰ্যটনস্থল ধুনীয়া।": "The tourist spot is lovely."
      "পৰ্যটনস্থলত মানুহ।": { native: "There are people at the tourist spot.", bases: { "পৰ্যটনস্থলত": "tourist spot" } }
  "as-3345":
    native: "to travel; to tour"
    notes:
      "n1": "To go on a trip for pleasure."
