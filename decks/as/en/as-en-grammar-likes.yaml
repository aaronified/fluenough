schema: 1
id: "as-en-grammar-likes"
kind: "layer"
core: "as-grammar-likes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Likes"
license: "CC0-1.0"
description: "ভাল পোৱা (bhāl puwā) and ভাল লগা (bhāl lôgā): what you like, and what you liked. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-2138":
    native: "to like; to love"
    notes:
      "n1": "'To get good'. The one who likes is the doer: মই চাহ ভাল পাওঁ (moi sāh bhāl pāum̐), I like tea. A person liked takes -ক (-kô): মই তোমাক ভাল পাওঁ (moi tumāk bhāl pāum̐)."
    bases:
      "পোৱা": "to get; to like"
  "as-2139":
    native: "I like tea."
    bases:
      "মই": "I"
      "পাওঁ": "to get; to like"
  "as-2140":
    native: "I don't like coffee."
    notes:
      "n1": "The not goes on পোৱা (puwā): নাপাওঁ (nāpāum̐)."
    bases:
      "মই": "I"
      "নাপাওঁ": "to get; to like"
  "as-2141":
    native: "What do you like?"
    bases:
      "পায়": "to get; to like"
  "as-2142":
    native: "I like watching films."
    notes:
      "n1": "An action you like takes -বলৈ (-bôlôi): চাবলৈ (sābôlôi), to watch."
    bases:
      "মই": "I"
      "চিনেমা": "film"
      "চাবলৈ": "to see; to watch"
      "পাওঁ": "to get; to like"
  "as-2143":
    native: "to please; to like (what you try or see)"
    notes:
      "n1": "The one who likes takes -ৰ (-rô): মোৰ ভাল লাগিল (mur bhāl lāgil), I liked it. ভাল পোৱা (bhāl puwā) is a lasting liking."
    bases:
      "লগা": "to be felt; to seem"
  "as-2144":
    native: "I liked it."
    bases:
      "মোৰ": "I"
  "as-2145":
    native: "I didn't like it."
    bases:
      "মোৰ": "I"
  "as-2146":
    native: "Did you like it?"
  "as-2147":
    native: "I love you."
    notes:
      "n1": "The same ভাল পোৱা (bhāl puwā), with তোমাক (tumāk), you, as its object."
    bases:
      "মই": "I"
      "তোমাক": "you (familiar)"
      "পাওঁ": "to get; to like"
