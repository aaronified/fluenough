schema: 1
id: "as-en-hobbies"
kind: "layer"
core: "as-hobbies"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hobbies"
license: "CC-BY-SA-4.0"
description: "What people do for fun at the weekend: playing, singing, drawing, swimming, reading and the clubs they join. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-2794":
    native: "hobby; pastime"
    notes:
      "n1": "Something you like doing for fun in your free time."
    examples:
      "মোৰ শখ গীত গোৱা।": "My hobby is singing songs."
      "তোমাৰ শখ কি?": "What is your hobby?"
  "as-2795":
    native: "game; sport; play"
    notes:
      "n1": "A game played by children or in a team. Also a play in the theatre."
    examples:
      "খেল ভাল লাগে।": "I like games."
      "আজি খেল আছে।": { native: "There is a game today.", bases: { "আছে": "to be; there is; to have" } }
  "as-2796":
    native: "photo; picture"
    notes:
      "n1": "A photograph or a painted picture. To take a photo is ছবি তোলা (sôbi tulā)."
    examples:
      "ছবি ধুনীয়া।": "The photo is beautiful."
      "এইটো ছবি মোৰ।": "This photo is mine."
  "as-2797":
    native: "trip; travel; a tour"
    notes:
      "n1": "A journey for pleasure, to see a place."
    examples:
      "ভ্ৰমণ ভাল লাগে।": "I like travelling."
      "আমাৰ ভ্ৰমণ আছে।": { native: "We have a trip.", bases: { "আছে": "to be; there is; to have" } }
  "as-2798":
    native: "swimming"
    notes:
      "n1": "To swim is সাঁতুৰা (sām̐turā)."
    examples:
      "সাঁতোৰ ভাল।": "Swimming is good."
      "সাঁতোৰ শিকা।": "To learn swimming."
  "as-2799":
    native: "to swim"
    notes:
      "n1": "The verb for swimming in the river or the pond."
    examples:
      "মই সাঁতুৰোঁ।": { native: "I swim.", bases: { "সাঁতুৰোঁ": "to swim" } }
      "তাই পুখুৰীত সাঁতুৰে।": { native: "She swims in the pond.", bases: { "সাঁতুৰে": "to swim" } }
  "as-2800":
    native: "football"
    notes:
      "n1": "Written as said in English."
    examples:
      "ফুটবল খেলিছোঁ।": "I have played football."
      "ফুটবল বহুত ভাল।": "Football is very good."
  "as-2801":
    native: "musical instrument"
    notes:
      "n1": "An instrument such as the flute, the drum or the guitar."
    examples:
      "বাদ্য বজাওঁ।": "I play an instrument."
      "বাদ্য ভাল।": "The instrument is good."
  "as-2802":
    native: "flute"
    notes:
      "n1": "A bamboo flute. Played at night and at festivals."
    examples:
      "বাঁহী বজাওঁ।": "I play the flute."
      "বাঁহী ধুনীয়া।": "The flute is lovely."
  "as-2803":
    native: "guitar"
    notes:
      "n1": "Written as said in English."
    examples:
      "গিটাৰ বজাওঁ।": "I play the guitar."
      "গিটাৰ নতুন।": "The guitar is new."
  "as-2804":
    native: "colour; paint"
    notes:
      "n1": "The colour of a thing, or paint for a picture."
    examples:
      "ৰং ধুনীয়া।": "The colour is beautiful."
      "ৰং কৰা।": "To colour; to paint."
  "as-2805":
    native: "story; tale"
    notes:
      "n1": "A story told or read. Also chat."
    examples:
      "গল্প ভাল।": "The story is good."
      "গল্প শুনা।": "To hear a story."
  "as-2806":
    native: "music"
    notes:
      "n1": "Music in general, sung or played."
    examples:
      "সংগীত ভাল লাগে।": "I like music."
      "সংগীত শিকোঁ।": "I am learning music."
  "as-2807":
    native: "club"
    notes:
      "n1": "A group of people who meet to do a hobby together. Written as said in English."
    examples:
      "ক্লাবত মানুহ বহুত।": { native: "There are many people at the club.", bases: { "ক্লাবত": "club" } }
      "মই ক্লাবত আছোঁ।": { native: "I am at the club.", bases: { "ক্লাবত": "club", "আছোঁ": "to be; there is; to have" } }
  "as-2808":
    native: "competition; contest"
    notes:
      "n1": "A contest where people try to win."
    examples:
      "প্ৰতিযোগিতা আছে।": { native: "There is a competition.", bases: { "আছে": "to be; there is; to have" } }
      "প্ৰতিযোগিতা বহুত ডাঙৰ।": "The competition is very big."
  "as-2809":
    native: "victory; win"
    notes:
      "n1": "The opposite of পৰাজয় (porāzoy), defeat."
    examples:
      "জয় হৈছে।": { native: "We have won.", bases: { "হৈছে": "to become; to be" } }
      "জয় ভাল।": "Winning is good."
  "as-2810":
    native: "defeat; loss in a contest"
    notes:
      "n1": "The opposite of জয় (zoy)."
    examples:
      "পৰাজয় বেয়া।": "Defeat is bad."
      "আমি পৰাজয় পালোঁ।": { native: "We were defeated.", bases: { "পালোঁ": "to get; to receive" } }
  "as-2811":
    native: "joke; humour"
    notes:
      "n1": "Something said to make people laugh."
    examples:
      "কৌতুক ভাল।": "The joke is good."
      "কৌতুক বহুত।": "There are many jokes."
  "as-2812":
    native: "regular; done often"
    notes:
      "n1": "Done again and again at set times."
    examples:
      "নিয়মিত খেল।": "Regular games."
      "নিয়মিত অভ্যাস।": "Regular practice."
  "as-2813":
    native: "practice; habit"
    notes:
      "n1": "Doing something again and again to get better at it."
    examples:
      "অভ্যাস বহুত।": "There is a lot of practice."
      "মই অভ্যাস কৰোঁ।": "I practise."
  "as-2814":
    native: "interest; eagerness"
    notes:
      "n1": "A wish to do or learn something."
    examples:
      "আগ্ৰহ বহুত।": "There is a lot of interest."
      "তাৰ আগ্ৰহ আছে।": { native: "He has an interest.", bases: { "আছে": "to be; there is; to have" } }
  "as-2815":
    native: "to play (an instrument)"
    notes:
      "n1": "The verb for playing a musical instrument."
    examples:
      "বাঁহী বজোৱা।": "To play the flute."
      "তেওঁ গিটাৰ বজায়।": { native: "He plays the guitar.", bases: { "বজায়": "to play (an instrument)" } }
  "as-2816":
    native: "garden (a planted garden)"
    notes:
      "n1": "A garden of flowers or of fruit trees."
    examples:
      "বাগানত ফুল।": { native: "Flowers in the garden.", bases: { "বাগানত": "garden (a planted garden)" } }
      "বাগান ধুনীয়া।": "The garden is beautiful."
  "as-2817":
    native: "it is fun; to enjoy oneself"
    notes:
      "n1": "Said of something that is fun to do: বাগানত কাম কৰা মজা লাগে (bāgānôt kām kôrā môzā lāge), gardening is fun."
    examples:
