id: "as-en-environment-sentences"
kind: "layer"
core: "as-environment-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Environment: air, pollution, waste and care: sentences"
license: "CC-BY-SA-4.0"
description: "Sentences built from the words of this unit and the ones before it. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3503":
    native: "The air is polluted."
    confusables:
      "c1": { why: "Clean, the opposite of polluted." }
      "c2": { why: "Wind, close but a different thing." }
  "as-3504":
    native: "Plant a tree."
    notes:
      "n1": "ৰোপণ কৰা (rupôn kôrā), 'to plant', is a noun plus কৰা (kôrā), 'to do', used here as a command."
    confusables:
      "c1": { why: "Wood, not a plant." }
      "c2": { why: "A branch, a part of a tree." }
  "as-3505":
    native: "He will throw away the waste."
    notes:
      "n1": "পেলাব (pelābô) is from পেলোৱা (peluwā), 'to throw', whose stem becomes পেলা- (pelā-); -ব (-bô) makes the future."
    confusables:
      "c1": { why: "Reuse, the opposite of throwing away." }
      "c2": { why: "Conservation, the goal rather than the action." }
  "as-3506":
    native: "The river is polluted."
    confusables:
      "c1": { why: "Green, a different quality." }
      "c2": { why: "Clean, the opposite." }
  "as-3507":
    native: "A green environment is good."
    notes:
      "n1": "সবুজ (xobuz) and সেউজ (xeuz) both mean 'green'; this course also uses সেউজ (xeuz) for the grass of the valley."
    confusables:
      "c1": { why: "Pollution, the opposite." }
      "c2": { why: "Waste, a problem not a good thing." }
  "as-3508":
    native: "To protect."
    notes:
      "n1": "সংৰক্ষণ কৰা (xôṅrôkkhôn kôrā), 'to protect', is a noun plus কৰা (kôrā), 'to do'."
    confusables:
      "c1": { why: "Planting, one way to protect." }
      "c2": { why: "Pollution, the opposite of protecting." }
  "as-3509":
    native: "There are many trees."
    notes:
      "n1": "বৃক্ষ (brikkh) is the formal word for 'tree'; this course uses গছ (gôs) in everyday sentences."
    confusables:
      "c1": { why: "A tree, the ordinary word." }
      "c2": { why: "A forest, a bigger place." }
  "as-3510":
    native: "The water is clean."
    confusables:
      "c1": { why: "Polluted, the opposite." }
      "c2": { why: "Dirty, close but a different adjective." }
