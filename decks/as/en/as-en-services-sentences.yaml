id: "as-en-services-sentences"
kind: "layer"
core: "as-services-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Services: bank, post, repair and tailor: sentences"
license: "CC-BY-SA-4.0"
description: "Sentences built from the words of this unit and the ones before it. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-3376":
    native: "I send a parcel."
    notes:
      "n1": "এটা (etā), 'one', is also used like 'a' before a thing: এটা পাৰ্চেল (etā pārsel), a parcel."
    confusables:
      "c1": { why: "The perfect: it has come, not sent." }
      "c2": { why: "To take, the opposite direction." }
  "as-3377":
    native: "Fill in the form."
    notes:
      "n1": "The command ends in -া (-ā), the same as the dictionary form, and is what you say to someone you call তুমি (tumi), 'you'. পূৰণ কৰা (purôn kôrā) is literally 'do filling'."
    confusables:
      "c1": { why: "An application, a different paper." }
      "c2": { why: "A counter, the place not the paper." }
  "as-3378":
    native: "The tailor sews the cloth."
    notes:
      "n1": "সেলাই কৰা (xelāi kôrā), 'to sew', is the noun সেলাই (xelāi), sewing, plus কৰা (kôrā), 'to do'. কৰে (kôre) is its 'he, she' present."
    confusables:
      "c1": { why: "Repair, not sewing." }
      "c2": { why: "To wash, not to sew." }
  "as-3379":
    native: "To repair."
    notes:
      "n1": "মেৰামতি (merāmoti), repair, plus কৰা (kôrā), 'to do', makes 'to repair'. The same form also works as the command 'repair it'."
    confusables:
      "c1": { why: "To break, the opposite action." }
      "c2": { why: "Service, a noun not the act." }
  "as-3380":
    native: "The postage is high."
    confusables:
      "c1": { why: "Interest, a money word, not postage." }
      "c2": { why: "A price, close in meaning." }
  "as-3381":
    native: "Take a loan."
    notes:
      "n1": "লোৱা (luwā), 'to take', is used for borrowing: ঋণ লোৱা (rin luwā) is literally 'take a loan'. The dictionary form also works as the command."
    confusables:
      "c1": { why: "Money, not a loan." }
      "c2": { why: "Money, not a loan." }
  "as-3382":
    native: "The counter service is good."
    notes:
      "n1": "-ত (-t), 'at', joins কাউণ্টাৰ (kāuntār), counter: কাউণ্টাৰত (kāuntārôt), at the counter. সেৱা (xewā) means 'service'."
    confusables:
      "c1": { why: "A form, a paper not the service." }
      "c2": { why: "An application, a paper." }
  "as-3383":
    native: "The parcel is heavy."
    confusables:
      "c1": { why: "Light, the opposite of heavy." }
      "c2": { why: "A bag, not a parcel." }
