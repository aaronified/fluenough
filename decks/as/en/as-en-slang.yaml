schema: 1
id: "as-en-slang"
kind: "layer"
core: "as-slang"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Slang"
license: "CC-BY-SA-4.0"
description: "Everyday slang and pet names: what friends and families say that a textbook doesn't. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0444":
    native: "What's up?; What happened?"
    notes:
      "n1": "Literally 'what happened?'. Also, among friends, just কি? (ki?)."
    bases:
      "হ'ল": "to be; to become"
  "as-0445":
    native: "bro; mate"
    notes:
      "n1": "Literally 'younger brother', but between friends any young man: কি ভাই? (ki bhai?), what's up, mate?"
    examples:
      "এইজন মোৰ ভাই।": { native: "This person is my brother.", bases: { "ভাই": "brother", "এইজন": "this person", "মোৰ": "my" } }
      "মোৰ ভাই শক্ত।": { native: "My brother is strong.", bases: { "মোৰ": "my", "ভাই": "brother" } }
  "as-0446":
    native: "terrific; awesome"
    notes:
      "n1": "জব্বৰ হৈছে! (jobbor hoise!), that's brilliant!"
    examples:
      "এইটো জব্বৰ।": { native: "This is terrific.", bases: {  } }
      "জব্বৰ ডাঙৰ।": { native: "It is terrific and big.", bases: {  } }
  "as-0447":
    native: "totally; absolutely"
    notes:
      "n1": "একদম ঠিক (ekdôm thik), exactly right."
    examples:
      "একদম ভাল।": { native: "Totally good.", bases: {  } }
      "একদম ডাঙৰ।": { native: "Absolutely big.", bases: {  } }
  "as-0448":
    native: "never mind; let it go"
    notes:
      "n1": "Literally 'let it be'. Shrugs off a mistake or an argument."
    bases:
      "দে": "to give"
      "হ'ব": "to be; to become"
  "as-0449":
    native: "a mess; a muddle"
    notes:
      "n1": "সকলো খেলিমেলি হৈ গ (xôkôlu khelimeli hôi gô)'ল (xokolu khelimeli hoi gol), everything got into a mess."
    examples:
      "ঘৰ খেলিমেলি।": { native: "The house is a mess.", bases: {  } }
      "খেলিমেলি ইয়াত।": { native: "The mess is here.", bases: {  } }
  "as-0450":
    native: "nutter; crazy guy"
    notes:
      "n1": "From পাগল (pāgôl), mad. Teasing between friends; rude to anyone else. পাগল নেকি? (pagol neki?), are you mad?"
    examples:
      "সি পগলা।": { native: "He is crazy.", bases: {  } }
      "মোৰ ভাই পগলা।": { native: "My brother is crazy.", bases: {  } }
  "as-0451":
    native: "don't stress"
    notes:
      "n1": "'Don't take tension', to a friend. With respect, চিন্তা নকৰিব (sintā nôkoribô), please don't worry."
    bases:
      "টেনচন": "tension; stress"
      "নল'বা": "to take"
  "as-0452":
    native: "fun"
    notes:
      "n1": "বৰ মজা পালোঁ (bôr môzā pālum̐), I had great fun."
    examples:
      "মজা লাগে।": { native: "It is fun.", bases: { "লাগে": "to need; to feel" } }
      "মজা লাগে": { native: "it is fun; to enjoy oneself", bases: {  } }
  "as-0453":
    native: "Oh my God! (literally 'oh my mother')"
    notes:
      "n1": "Surprise, shock or delight. আই (āi) is mother."
    bases:
      "মোৰ": "I"
  "as-0454":
    native: "dear boy; son (fondly, to a boy)"
    notes:
      "n1": "What an older person calls a boy or a young man. A fond form is বোপাই (bupāi)."
    examples:
      "বাপু, ইয়ালৈ আহা।": { native: "Son, come here.", bases: { "ইয়ালৈ": "here (to here)", "আহা": "to come" } }
      "বাপু, কেনে আছ?": { native: "Son, how are you?", bases: { "কেনে": "how", "আছ": "to be; to have" } }
  "as-0455":
    native: "dear girl (fondly, to a girl)"
    notes:
      "n1": "What parents and grandparents call a daughter or a granddaughter."
    examples:
      "মাজনী, ইয়ালৈ আহা।": { native: "Dear girl, come here.", bases: { "ইয়ালৈ": "here (to here)", "আহা": "to come" } }
      "মাজনী, কেনে আছ?": { native: "Dear girl, how are you?", bases: { "কেনে": "how", "আছ": "to be; to have" } }
  "as-0456":
    native: "gold; darling"
    notes:
      "n1": "Gold, and the commonest pet name for a child or a loved one."
    examples:
      "সোণ, ইয়ালৈ আহা।": { native: "Darling, come here.", bases: { "ইয়ালৈ": "here (to here)", "আহা": "to come" } }
      "সোণ, কেনে আছ?": { native: "Darling, how are you?", bases: { "কেনে": "how", "আছ": "to be; to have" } }
  "as-0457":
    native: "to smoke a cigarette"
    notes:
      "n1": "Literally 'to eat a cigarette': Assamese eats tea, water and smoke alike. Smoking on a sign is ধূমপান (dhumpān)."
    bases:
      "চিগাৰেট": "cigarette"
