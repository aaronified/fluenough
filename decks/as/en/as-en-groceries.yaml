schema: 1
id: "as-en-groceries"
kind: "layer"
core: "as-groceries"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Groceries"
license: "CC-BY-SA-4.0"
description: "Vegetables, fish, meat, eggs and the staples, several with words of Assam's own. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-0280":
    native: "vegetables"
    notes:
      "n1": "শাক (xāk), leafy greens, and পাচলি (pāsoli), other vegetables."
    bases:
      "শাক": "leafy greens"
      "পাচলি": "vegetable"
  "as-0281":
    native: "potato"
    examples:
      "তেওঁ আলু ভজে।": { native: "He fries potatoes.", bases: { "আলু": "potato", "ভজে": "fries", "তেওঁ": "he; she (polite)" } }
  "as-0282":
    native: "onion"
    examples:
      "মই পিঁয়াজ কটোঁ।": { native: "I cut the onion.", bases: { "পিঁয়াজ": "onion", "কটোঁ": "cut", "মই": "I" } }
      "চুলাত তেল আৰু পিঁয়াজ ভজে।": { native: "On the stove, the oil and onions are fried.", bases: {  } }
  "as-0283":
    native: "tomato"
    notes:
      "n1": "A word of Assam's own, where Bengali and Hindi say tomato. বিলাহীৰ টেঙা (bilāhir teṅā), a sour fish curry made with tomato."
  "as-0284":
    native: "chilli"
    notes:
      "n1": "From জলা (zôlā), hot. ভূত জলকীয়া (bhut zôlokiyā), the ghost pepper, grown in Assam, is among the hottest chillies in the world."
  "as-0285":
    native: "garlic"
  "as-0286":
    native: "ginger"
  "as-0287":
    native: "fish"
    notes:
      "n1": "Fish and rice, মাছ-ভাত (mās-bhāt), is the everyday Assamese meal. River fish such as ৰৌ (rôu, rohu) are favourites."
    examples:
      "গোটা মাছ।": { native: "A whole fish.", bases: {  } }
      "পুখুৰীত মাছ আছে।": { native: "There are fish in the pond.", bases: { "পুখুৰীত": "pond", "আছে": "be; have" } }
  "as-0288":
    native: "meat"
    notes:
      "n1": "ং (ôṅ) is ng, and স (xô) is x."
  "as-0289":
    native: "mutton (goat meat)"
    notes:
      "n1": "Also ছাগলীৰ মাংস (sāgolir māṅxô), goat's meat. In India 'mutton' almost always means goat."
  "as-0290":
    native: "chicken; hen"
    notes:
      "n1": "Careful: কুকুৰ (kukur), with no final a, is a dog. Chicken meat is কুকুৰাৰ মাংস (kukurār māṅxô); shops also say চিকেন (siken)."
  "as-0291":
    native: "egg"
    notes:
      "n1": "Also a word of Assam's own. Duck eggs, হাঁহৰ কণী (hām̐hôr koni), are popular too."
  "as-0292":
    native: "milk"
    examples:
      "গাখীৰ দোৱা": { native: "to milk the cow", bases: { "দোৱা": "to milk" } }
      "গাখীৰ বগা।": { native: "Milk is white.", bases: {  } }
  "as-0293":
    native: "rice (uncooked)"
    notes:
      "n1": "Cooked rice is ভাত (bhāt); rice in the husk, ধান (dhān). Assam grows its own kinds, among them বৰা চাউল (bôrā sāul), sticky rice."
    examples:
      "দোকানী চাউল বেচে।": { native: "The shopkeeper sells rice.", bases: { "বেচে": "to sell" } }
      "পাঁচশ গ্ৰাম চাউল।": { native: "Five hundred grams of rice.", bases: { "চাউল": "rice" } }
  "as-0294":
    native: "lentils; dal"
  "as-0295":
    native: "salt"
    examples:
      "নিমখ দিয়া": { native: "to add salt", bases: {  } }
  "as-0296":
    native: "oil"
    notes:
      "n1": "Cooking is mostly with mustard oil, সৰিয়হৰ তেল (xoriyôhôr tel)."
    examples:
      "কড়াত তেল।": { native: "Oil in the pan.", bases: { "কড়াত": "pan; wok" } }
      "চুলাত তেল আৰু পিঁয়াজ ভজে।": { native: "On the stove, the oil and onions are fried.", bases: {  } }
  "as-0297":
    native: "banana"
    notes:
      "n1": "কল (kôl) also means a machine or a tap: পানীৰ কল (pānir kôl), a water tap."
