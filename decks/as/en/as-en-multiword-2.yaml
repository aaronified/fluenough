native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: noun or adjective with other verbs"
description: "Fifteen Assamese verbs made of a noun or adjective and a verb other than কৰা (kôrā): to lean, to shorten, to lengthen, to be digested, to turn red, to gather, to want, to get to know, to supply, to walk, to spit, to spit betel juice, to bury, to belch, to call by name. Not yet checked by an Assamese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "as-4600":
    native: "to lean; to slant"
    notes:
      "u1": "Only হোৱা (huwā) changes with tense and person; the word before it, কাতি (kāti), stays fixed. Attested on en.wiktionary, page কাতি হোৱা (kāti huwā)."
    bases:
      "কাতি": { meaning: "tilt; slant" }
      "হোৱা": { meaning: "to become" }

