schema: 1
id: "as-en-grammar-conjunct-verbs"
kind: "layer"
core: "as-grammar-conjunct-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Noun + কৰা (kôrā)"
license: "CC0-1.0"
description: "Many Assamese verbs are a noun with কৰা (kôrā), do, and some take খোৱা (khuwā), eat, or উঠা (uthā), rise: কাম কৰা (kām kôrā), to work; ভয় খোৱা (bhôy khuwā), to be afraid. Only the verb changes. Not yet checked by an Assamese speaker: please report any mistake."
cards:
  "as-2099":
    native: "to work"
    notes:
      "n1": "কাম (kām), work, and কৰা (kôrā), to do. Only কৰা (kôrā) changes: মই কাম কৰোঁ (moi kām kôrum̐), I work; কাম কৰিলোঁ (kām korilum̐), I worked."
  "as-2100":
    native: "to phone"
    notes:
      "n1": "মোক ফোন কৰিব (muk phun korib), please call me."
  "as-2101":
    native: "to help"
    notes:
      "n1": "The one helped takes -ক (-kô): মোক সহায় কৰক (muk xôhāy kôrôk), please help me."
  "as-2102":
    native: "to try"
  "as-2103":
    native: "to spend (money)"
  "as-2104":
    native: "to clean"
  "as-2105":
    native: "to begin"
  "as-2106":
    native: "to be late; to delay"
    notes:
      "n1": "পলম নকৰিব (pôlôm nôkorib), please don't be late."
  "as-2107":
    native: "to wait"
    notes:
      "n1": "অলপ অপেক্ষা কৰক (ôlôp ôpekkhā kôrôk), please wait a little. In speech, also ৰ (rô)'ব (robo), wait."
  "as-2108":
    native: "to talk; to chat"
    notes:
      "n1": "With পতা (pôtā), not কৰা (kôrā): তেওঁৰ লগত কথা পাতিলোঁ (teum̐r lôgôt kôthā pātilum̐), I talked with him."
  "as-2109":
    native: "to be afraid"
    notes:
      "n1": "'To eat fear': মই ভয় খালোঁ (moi bhôy khālum̐), I was afraid."
  "as-2110":
    native: "to get angry"
    notes:
      "n1": "'Anger rises', and the one angry takes -ৰ (-rô): মোৰ খং উঠিল (mur khôṅ uthil), I got angry."
  "as-2111":
    native: "to remember; to come to mind"
    notes:
      "n1": "'To fall into the mind', and the one who remembers takes -ৰ (-rô): মোৰ মনত পৰিছে (mur mônôt porise), I remember."
  "as-2112":
    native: "to bathe"
    notes:
      "n1": "'To wash the body'."
