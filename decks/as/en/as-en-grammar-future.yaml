id: "as-en-grammar-future"
kind: "layer"
core: "as-grammar-future"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Present and future"
license: "CC0-1.0"
description: "I go, I will go: the simple present, for habits and facts, and the future. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "Simple present and future"
  slot_name: "tense, person and respect"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "kora": "to do"
    "juwa": "to go"
    "oha": "to come"
    "khuwa": "to eat; to drink"
  notes: "The present is for habits and facts: মই চাহ খাওঁ (moi sāh khāum̐), I drink tea. Its endings are -ওঁ (-um̐), none, -আ (-ā) and -এ (-e). The future's are -ইম (-im), -ইবি (-ibi), -ইবা (-ibā) and -ইব (-ib): কৰিম (korim), I will do; a stem ending in a vowel takes them without the -ই- (-i-): যাম (zām), খাম (khām). With তুমি (tumi), যোৱা (zuwā) and খোৱা (khuwā) change their vowel: তুমি যোৱা (tumi zuwā), you go. The future with আপুনি (āpuni), সি (si), তাই (tāi) and তেওঁ (teum̐) ends in a vowel said but not written: কৰিব (korib). The verb changes for person and respect, never for gender or number. The ending -ওঁ (-um̐) is also written -ো (u), without ঁ (ôm̐), and both are accepted."
