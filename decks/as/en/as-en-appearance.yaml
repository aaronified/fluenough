schema: 1
id: "as-en-appearance"
kind: "layer"
core: "as-appearance"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Appearance: looks, height and age"
license: "CC-BY-SA-4.0"
description: "How people look: tall or short, thin or fat, the hair, the face, the beard and how old someone seems. Not yet checked by an Assamese speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "as-2877":
    native: "height"
    notes:
      "n1": "How tall a person is. Asked as কিমান উচ্চতা? (kimān ucchôtā?), how tall?"
    examples:
      "তাৰ উচ্চতা ডাঙৰ।": "He is tall."
      "উচ্চতা কিমান?": "How tall is it?"
  "as-2878":
    native: "fat; thick"
    notes:
      "n1": "Of a person, or of a thick thing like a rope. The opposite is পাতল (patôl)."
    examples:
      "সি মোটা।": "He is fat."
      "মোটা কাপোৰ।": "Thick cloth."
  "as-2879":
    native: "thin; slim"
    notes:
      "n1": "Of a person or a thin thing. The opposite is মোটা (motā)."
    examples:
      "তাই পাতল।": "She is thin."
      "পাতল কাপোৰ।": "Thin cloth."
  "as-2880":
    native: "fair (of skin)"
    notes:
      "n1": "Of a light skin colour. Written as said in English."
    examples:
      "তেওঁ ফৰ্চা।": "He is fair."
      "ফৰ্চা মুখ।": "A fair face."
  "as-2881":
    native: "beard"
    notes:
      "n1": "The hair on the chin of a man."
    examples:
      "তেওঁৰ দাড়ি আছে।": { native: "He has a beard.", bases: { "আছে": "to be; there is; to have" } }
      "দাড়ি ডাঙৰ।": "The beard is big."
  "as-2882":
    native: "moustache"
    notes:
      "n1": "The hair above the lip of a man."
    examples:
      "গোঁফ সৰু।": "The moustache is small."
      "তাৰ গোঁফ আছে।": { native: "He has a moustache.", bases: { "আছে": "to be; there is; to have" } }
  "as-2883":
    native: "face; look; appearance"
    notes:
      "n1": "The look of a face, and how a person seems."
    examples:
      "তাৰ চেহেৰা ভাল।": "His face looks good."
      "চেহেৰা খুচীয়া।": "The face looks happy."
  "as-2884":
    native: "young"
    notes:
      "n1": "Of a young person, a youth. The opposite is বৃদ্ধ (buddhô)."
    examples:
      "তৰুণ মানুহ।": "A young person."
      "মহিলাজন তৰুণ।": "The woman is young."
  "as-2885":
    native: "old; elderly"
    notes:
      "n1": "Of an old person. The opposite is তৰুণ (tôruṇ)."
    examples:
      "বৃদ্ধ মানুহ।": "An old person."
      "তেওঁ বৃদ্ধ।": "He is old."
  "as-2886":
    native: "old man; grandfather (affectionate)"
    notes:
      "n1": "An old man. To an old man you may say বুঢ়া (burhā) as a respectful word."
    examples:
      "বুঢ়া ভাল।": "The old man is well."
      "বুঢ়া খুচীয়া।": "The old man is happy."
  "as-2887":
    native: "old woman; grandmother (affectionate)"
    notes:
      "n1": "An old woman. The male form is বুঢ়া (burhā)."
    examples:
      "বুঢ়ী ভাল।": "The old woman is well."
      "বুঢ়ী আহিছে।": "The old woman has come."
  "as-2888":
    native: "woman; lady"
    notes:
      "n1": "An adult woman, formal and polite. In speech people say তাই (tāi) or মানুহজনী (mānuhzoni)."
    examples:
      "মহিলা ধুনীয়া।": "The woman is lovely."
      "মহিলা আহিছে।": "The woman has come."
  "as-2889":
    native: "man (adult male)"
    notes:
      "n1": "An adult man, formal. The opposite is মহিলা (mohilā)."
    examples:
      "পুৰুষ বহুত।": "There are many men."
      "পুৰুষ আৰু মহিলা।": "Men and women."
  "as-2890":
    native: "child; baby"
    notes:
      "n1": "A small child. Children together are ল'ৰা-ছোৱালী (lorā-suwāli)."
    examples:
      "শিশু সৰু।": "The child is small."
      "শিশু শুই আছে।": { native: "The baby is sleeping.", bases: { "আছে": "to be; there is; to have" } }
  "as-2891":
    native: "special; particular"
    notes:
      "n1": "Not ordinary. A feature that stands out."
    examples:
      "এইটো বিশেষ।": "This is special."
      "বিশেষ পোছাক।": "A special dress."
  "as-2892":
    native: "dress; costume; clothes (formal)"
    notes:
      "n1": "The clothes a person wears for an occasion. In speech: কাপোৰ (kāpur)."
    examples:
      "তাইৰ পোছাক ধুনীয়া।": { native: "Her dress is lovely.", bases: { "তাইৰ": "she" } }
      "নতুন পোছাক।": "A new dress."
  "as-2893":
    native: "attractive; charming"
    notes:
      "n1": "Of someone or something that draws the eye and is pleasing to look at."
    examples:
      "তাই আকৰ্ষণীয়।": "She is attractive."
      "আকৰ্ষণীয় চেহেৰা।": "An attractive face."
  "as-2894":
    native: "seems; looks like"
    notes:
      "n1": "To look like something: তাই ভাল দেখা লাগে (tāi bhāl dekhā lāge), she looks well."
    examples:
  "as-2895":
    native: "wide-eyed; big eyes"
    notes:
      "n1": "Eyes that are wide and open."
