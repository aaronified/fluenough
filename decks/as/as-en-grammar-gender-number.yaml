schema: 1
id: as-en-grammar-gender-number
name: "No gender; number and classifiers"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Assamese has no grammatical gender: only the pronouns সি (si) and তাই (tāi), and the classifiers -জন (-zôn) and -জনী (-zoni), tell a man from a woman. So this deck teaches number instead: the plurals -বোৰ (-bur), -হঁত (-hôm̐t) and -সকল (-sôkôl), and a number with its classifier. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - ref: as-2007
    tags: []
  - ref: as-2008
    tags: []
    notes: "Only the pronoun says it is a woman: the verb is the same as for সি (si), he."
  - id: as-2052
    target: "সিহঁত আহিল।"
    native: "They came."
    reading: "xihôm̐t āhil."
    ipa: "xihɔ̃t ahil"
    pos: "phrase"
    notes: "The verb doesn't change for number: সি আহিল (xi āhil), সিহঁত আহিল (xihôm̐t āhil)."
  - id: as-2053
    target: "ল'ৰাবোৰ খেলি আছে।"
    native: "The boys are playing."
    reading: "lorābur kheli āse."
    ipa: "loɹabʊɹ kʰeli ase"
    pos: "phrase"
    notes: "-বোৰ (-bur) makes a plural of anything, people too."
  - id: as-2054
    target: "ল'ৰাহঁত"
    native: "the boys; the lads"
    reading: "lorāhôm̐t"
    ipa: "loɹahɔ̃t"
    pos: "noun"
    notes: "-হঁত (-hôm̐t) makes a plural of people, mostly familiar: ল (lô)'ৰাহঁত (rāhôm̐t), ছোৱালীহঁত (suwālihôm̐t)."
  - id: as-2055
    target: "শিক্ষকসকল"
    native: "the teachers"
    reading: "xikkhôkxôkôl"
    ipa: "xikkʰɔkxɔkɔl"
    pos: "noun"
    notes: "-সকল (-sôkôl) is a respectful plural for people. -বিলাক (bilāk) is another plural, for people or things."
  - id: as-2056
    target: "তিনিখন কিতাপ"
    native: "three books"
    reading: "tinikhôn kitāp"
    ipa: "tinikʰɔn kitap"
    pos: "phrase"
    notes: "After a number the noun stays singular, and the classifier goes on the number: তিনিখন (tinikhôn), three (flat things)."
  - id: as-2057
    target: "দুজন মানুহ"
    native: "two people"
    reading: "duzôn mānuh"
    ipa: "duzɔn manuh"
    pos: "phrase"
    notes: "-জন (-zôn) counts men, and people in general; -জনী (-zoni) counts women: দুজনী ছোৱালী (duzoni suwāli), two girls."
  - id: as-2058
    target: "বহুত মানুহ"
    native: "a lot of people"
    reading: "bohut mānuh"
    ipa: "bohut manuh"
    pos: "phrase"
    notes: "After বহুত (bohut), many, the noun stays singular too."
  - id: as-2059
    target: "ভাল ল'ৰা, ভাল ছোৱালী"
    native: "a good boy, a good girl"
    reading: "bhāl lorā, bhāl suwāli"
    ipa: "bʱal loɹa bʱal sʊwali"
    pos: "phrase"
    notes: "A describing word never changes for gender or number."
  - id: as-2060
    target: "ছাত্ৰ, ছাত্ৰী"
    native: "a student (a man), a student (a woman)"
    reading: "sātrô, sātri"
    ipa: "satɹɔ satɹi"
    pos: "phrase"
    notes: "A few nouns from Sanskrit have a woman's form in -ঈ (-i): ছাত্ৰী (sātri). Most nouns have one form for both."
  - id: as-2061
    target: "মানুহজন, মানুহজনী"
    native: "the man, the woman"
    reading: "mānuhzôn, mānuhzoni"
    ipa: "manuhzɔn manuhzoni"
    pos: "phrase"
    notes: "মানুহ (mānuh) is any person; the classifier can say which: -জন (-zôn) for a man, -জনী (-zoni) for a woman."
