schema: 1
id: as-en-grammar-pronouns
name: "Pronouns and possessives"
kind: grammar
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I, you, he and she, with my and your, me as an object, and for me. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Personal pronouns"
  slot_name: "form"
  slots: ["possessive: my, your …", "object: me, you …", "for: for me, to me …"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Assamese has three words for 'you': আপুনি (respectful), তুমি (familiar) and তই (intimate, only for the very close or a child). 'He' is সি and 'she' is তাই; তেওঁ is a respectful he or she, and ই is 'he' for someone here. Plurals add -হঁত or -লোক: সিহঁত, তেওঁলোক. A possessive never changes for the thing owned: মোৰ কিতাপ, মোৰ ঘৰ. -ক marks the object and the one given to: মোক দিয়া, give it to me. -লৈ is for or towards: মোলৈ, for me. মই takes the stem মো- before an ending, and তুমি and আপুনি take তোমা- and আপোনা-."
  entries:
    - lemma: "মই"
      key: moi
      reading: "moi"
      gloss: "I"
      forms:
        "possessive: my, your …": "মোৰ"
        "object: me, you …": "মোক"
        "for: for me, to me …": "মোলৈ"
      readings:
        "possessive: my, your …": "mur"
        "object: me, you …": "muk"
        "for: for me, to me …": "muloi"
    - lemma: "তই"
      key: toi
      reading: "toi"
      gloss: "you, intimate"
      forms:
        "possessive: my, your …": "তোৰ"
        "object: me, you …": "তোক"
        "for: for me, to me …": "তোলৈ"
      readings:
        "possessive: my, your …": "tur"
        "object: me, you …": "tuk"
        "for: for me, to me …": "tuloi"
    - lemma: "তুমি"
      key: tumi
      reading: "tumi"
      gloss: "you, familiar"
      forms:
        "possessive: my, your …": "তোমাৰ"
        "object: me, you …": "তোমাক"
        "for: for me, to me …": "তোমালৈ"
      readings:
        "possessive: my, your …": "tumar"
        "object: me, you …": "tumak"
        "for: for me, to me …": "tumaloi"
    - lemma: "আপুনি"
      key: apuni
      reading: "apuni"
      gloss: "you, respectful"
      forms:
        "possessive: my, your …": "আপোনাৰ"
        "object: me, you …": "আপোনাক"
        "for: for me, to me …": "আপোনালৈ"
      readings:
        "possessive: my, your …": "apunar"
        "object: me, you …": "apunak"
        "for: for me, to me …": "apunaloi"
    - lemma: "সি"
      key: xi
      reading: "xi"
      gloss: "he"
      forms:
        "possessive: my, your …": "তাৰ"
        "object: me, you …": "তাক"
