schema: 1
id: as-en-grammar-conjunctions
name: "Joining words"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "And, but, or, because, if: joining words and sentences. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: as-2126
    target: "আৰু"
    native: "and"
    reading: "aru"
    pos: "other"
    notes: "চাহ আৰু বিস্কুট, tea and biscuits. আৰু is also 'more': আৰু অলপ, a little more."
  - id: as-2127
    target: "কিন্তু"
    native: "but"
    reading: "kintu"
    pos: "other"
  - id: as-2128
    target: "নাইবা"
    native: "or"
    reading: "naiba"
    pos: "other"
    notes: "In a statement. Also বা (ba)."
  - id: as-2129
    target: "নে"
    native: "or (in a question)"
    reading: "ne"
    pos: "other"
    notes: "চাহ নে কফি?, tea or coffee? The same -নে asks a yes-or-no question."
  - id: as-2130
    target: "কিয়নো"
    native: "because"
    reading: "kiyonu"
    pos: "other"
    notes: "It begins the reason: মই নাহিলোঁ, কিয়নো মোৰ জ্বৰ আছিল, I didn't come, because I had a fever. Also কাৰণ (karon)."
  - id: as-2131
    target: "সেইবাবে"
    native: "that's why; so"
    reading: "xeibabe"
    pos: "other"
  - id: as-2132
    target: "বুলি"
    native: "that (quoting what is said or thought)"
    reading: "buli"
    pos: "other"
    notes: "It comes after the words quoted: সি আহিব বুলি ক'লে, he said that he would come."
  - id: as-2133
    target: "যদি"
    native: "if"
    reading: "jodi"
    pos: "other"
    notes: "Often the verb's -লে says it alone: বৰষুণ দিলে, if it rains."
  - id: as-2134
    target: "তেন্তে"
    native: "then (after an if)"
    reading: "tente"
    pos: "other"
  - id: as-2135
    target: "যদিও"
    native: "although; even if"
    reading: "jodiu"
    pos: "other"
  - id: as-2136
    target: "নহ'লে"
    native: "otherwise; or else"
    reading: "nohole"
    pos: "other"
  - id: as-2137
    target: "মইও"
    native: "me too"
    reading: "moiu"
    pos: "other"
    notes: "-ও on a word is 'too' or 'even': তুমিও, you too."
