schema: 1
id: as-en-grammar-conjunctions
name: "Joining words"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "And, but, or, because, if: joining words and sentences. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: as-2126
    target: "আৰু"
    native: "and"
    reading: "āru"
    ipa: "aɹu"
    pos: "other"
    notes: "চাহ আৰু বিস্কুট (sāh āru biskut), tea and biscuits. আৰু (āru) is also 'more': আৰু অলপ (āru ôlôp), a little more."
  - id: as-2127
    target: "কিন্তু"
    native: "but"
    reading: "kintu"
    ipa: "kintu"
    pos: "other"
  - id: as-2128
    target: "নাইবা"
    native: "or"
    reading: "nāibā"
    ipa: "naiba"
    pos: "other"
    notes: "In a statement. Also বা (bā)."
  - id: as-2129
    target: "নে"
    native: "or (in a question)"
    reading: "ne"
    ipa: "ne"
    pos: "other"
    notes: "চাহ নে কফি (sāh ne kophi)?, tea or coffee? The same -নে (-ne) asks a yes-or-no question."
  - id: as-2130
    target: "কিয়নো"
    native: "because"
    reading: "kiyônu"
    ipa: "kijɔnʊ"
    pos: "other"
    notes: "It begins the reason: মই নাহিলোঁ (moi nāhilum̐), কিয়নো মোৰ জ্বৰ আছিল (kiyônu mur zôr āsil), I didn't come, because I had a fever. Also কাৰণ (kārôn)."
  - id: as-2131
    target: "সেইবাবে"
    native: "that's why; so"
    reading: "xeibābe"
    ipa: "xeibabe"
    pos: "other"
  - id: as-2132
    target: "বুলি"
    native: "that (quoting what is said or thought)"
    reading: "buli"
    ipa: "buli"
    pos: "other"
    notes: "It comes after the words quoted: সি আহিব বুলি ক (si āhib buli kô)'লে (le), he said that he would come."
  - id: as-2133
    target: "যদি"
    native: "if"
    reading: "zodi"
    ipa: "zodi"
    pos: "other"
    notes: "Often the verb's -লে (-le) says it alone: বৰষুণ দিলে (bôroxun dile), if it rains."
  - id: as-2134
    target: "তেন্তে"
    native: "then (after an if)"
    reading: "tente"
    ipa: "tente"
    pos: "other"
  - id: as-2135
    target: "যদিও"
    native: "although; even if"
    reading: "zodiu"
    ipa: "zodiʊ"
    pos: "other"
  - id: as-2136
    target: "নহ'লে"
    native: "otherwise; or else"
    reading: "nôhole"
    ipa: "nɔhole"
    pos: "other"
  - id: as-2137
    target: "মইও"
    native: "me too"
    reading: "moiu"
    ipa: "moiʊ"
    pos: "other"
    notes: "-ও (-o) on a word is 'too' or 'even': তুমিও (tumiu), you too."
