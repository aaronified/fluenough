# Topics a learner of Assamese would search for: what each one is, and the decks that teach it (wiki/Plan-Deck-Kinds-And-Topics.md, D6).
# A topic holds no card text of its own; it names the decks that already teach it.
# A script topic lists the language's script decks; no `chars` yet (tools/topic_chars.py writes them).
schema: 1
kind: "topics"
id: "as-topics"
language: "as"
license: "CC-BY-SA-4.0"
topics:
  - id: "as-classifiers-articles"
    name: { en: "Classifiers and articles" }
    summary: { en: "Assamese has no word for 'the' or 'a'. A classifier after the noun does that job, and the kind of thing decides which classifier is used." }
    kind: "grammar"
    level: "A1"
    decks: ["as-grammar-articles", "as-grammar-differences"]
  - id: "as-pronouns"
    name: { en: "Pronouns" }
    summary: { en: "The words for I, you, he, she and we, their polite and plural forms, and the possessive and object forms that change with each pronoun." }
    kind: "grammar"
    level: "A1"
    decks: ["as-pronouns", "as-grammar-pronouns"]
  - id: "as-honorifics"
    name: { en: "Honorifics" }
    summary: { en: "How Assamese marks respect and familiarity: the polite and familiar forms of 'you', the verb endings that go with them, and the words used to address elders and strangers." }
    kind: "grammar"
    level: "B1"
    decks: ["as-grammar-honorifics"]
  - id: "as-tenses"
    name: { en: "Tenses" }
    summary: { en: "How Assamese places an action in the past, the future and the perfect, and how it says that something was going on, with the verb endings that show each one." }
    kind: "grammar"
    level: "A1"
    decks: ["as-grammar-future", "as-grammar-past", "as-grammar-past-continuous", "as-grammar-past-more", "as-grammar-perfect"]
  - id: "as-verbs"
    name: { en: "Common verbs" }
    summary: { en: "The verbs a learner meets first, such as go, come, do, read, eat and sleep, and the verbs of daily life that follow them." }
    kind: "verbs"
    level: "A1"
    decks: ["as-verbs", "as-verbs-3", "as-verbs-4", "as-verbs-5"]
  - id: "as-postpositions"
    name: { en: "Postpositions" }
    summary: { en: "Small words that come after a noun to show place, direction, reason or company, such as 'in', 'with' and 'for', instead of coming before it as in English." }
    kind: "grammar"
    level: "A1"
    decks: ["as-grammar-postpositions"]
  - id: "as-conditionals"
    name: { en: "Conditionals" }
    summary: { en: "If-clauses such as 'if it rains, I will stay home', and the verb forms that say what would happen under a condition." }
    kind: "grammar"
    level: "B1"
    decks: ["as-grammar-conditional"]
  - id: "as-compound-verbs"
    name: { en: "Compound and conjunct verbs" }
    summary: { en: "Verbs made from two parts: a verb joined to another verb, or a noun joined to a light verb such as 'do' or 'be', which together mean one action." }
    kind: "verbs"
    level: "A2"
    decks: ["as-grammar-compound-verbs", "as-grammar-conjunct-verbs"]
  - id: "as-sounds"
    name: { en: "Sounds and contrasts" }
    summary: { en: "Pairs of letters that are easy to confuse, such as the aspirated and unaspirated consonants, the x sound, and the vowel that is dropped at the end of a word." }
    kind: "other"
    level: "A1"
    decks: ["as-sound-differences"]
  - id: "as-script-alphabet"
    name: { en: "The alphabet" }
    summary: { en: "The Assamese letters that are used in the Bengali-style script: the vowels, the consonants and the vowel signs that attach to them." }
    kind: "script"
    level: "A1"
    decks: ["as-script-vowels", "as-script-consonants", "as-script-vowel-signs"]
  - id: "as-script-conjuncts-digits"
    name: { en: "Conjuncts and digits" }
    summary: { en: "Consonants joined into one shape that is read as one unit, and the Assamese digits from zero to nine." }
    kind: "script"
    level: "A1"
    decks: ["as-script-conjuncts", "as-script-digits"]
  - id: "as-culture-medieval"
    name: { en: "Medieval Vaishnava works" }
    summary: { en: "Short lines from the medieval Vaishnava works of Sankardev and Madhavdev, such as the Bhatima, the Harishchandra story and the borgeets, in the public domain, with who wrote each one and where it comes from." }
    kind: "other"
    level: "B1"
    decks: ["as-culture-1"]
  - id: "as-culture-prose-verse"
    name: { en: "Assamese prose and verse of the 1800s and early 1900s" }
    summary: { en: "Short lines of Assamese prose and verse from a reading book of 1849 to the novels and poems of Bordoloi, Bezbaroa, Agarwala and Padmanath Gohain Baruah, in the public domain, with who wrote each one, when, and where it comes from." }
    kind: "other"
    level: "B1"
    decks: ["as-culture-2"]
  - id: "as-culture-folk-tales"
    name: { en: "Folk tales of Burhi Aair Sadhu" }
    summary: { en: "The opening sentences of ten traditional Assamese folk tales from Burhi Aair Sadhu, which Lakshminath Bezbaroa compiled and wrote down, in the public domain, with the title and source of each." }
    kind: "other"
    level: "B1"
    decks: ["as-culture-3"]
  - id: "as-culture-history-places"
    name: { en: "The history and places of Assam" }
    summary: { en: "Short sentences from histories and a play by Padmanath Gohain Baruah about the Ahom kings, the battle of Saraighat, the Rang Ghar and Lachit Borphukan, in the public domain, with who wrote each one and where it comes from." }
    kind: "other"
    level: "B1"
    decks: ["as-culture-4"]
  - id: "as-proverbs"
    name: { en: "Proverbs" }
    summary: { en: "Assamese sayings from as.wikiquote about everyday life, guests and character, judging people, and the weather and farming, each with a plain English meaning and its literal sense." }
    kind: "other"
    level: "B1"
    decks: ["as-proverbs-1", "as-proverbs-2", "as-proverbs-3"]
  - id: "as-verbs-noun-adjective"
    name: { en: "Verbs made of a noun or adjective" }
    summary: { en: "Assamese verbs made of a noun or adjective and a second verb, such as the verbs for to shorten, to be digested and to gather, with the meaning of each in English." }
    kind: "other"
    level: "B1"
    decks: ["as-multiword-1", "as-multiword-2"]
  - id: "as-idioms"
    name: { en: "Assamese idioms" }
    summary: { en: "Sixteen Assamese idioms from as.wikiquote, each with a plain English meaning that paraphrases the idiom rather than translating it word by word." }
    kind: "other"
    level: "B1"
    decks: ["as-multiword-3"]
  - id: "as-compound-experiencer"
    name: { en: "Compound verbs and feelings as subject" }
    summary: { en: "Compound verbs, where a second verb adds its sense to the first, and experiencer phrases, where the feeling is the subject of the sentence rather than the person who feels it." }
    kind: "other"
    level: "A2"
    decks: ["as-multiword-4"]
