schema: 1
id: as-en-numbers-big
name: "Tens and big numbers"
kind: vocab
theme: numbers-big
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The tens, the hundreds, a thousand, lakh and crore, and the halves every market uses. Each number from 21 to 99 has a word of its own: here is one, 25, to show how. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0239
    target: "ত্ৰিশ"
    native: "30, thirty"
    reading: "trix"
    ipa: "tɹix"
    pos: "other"
    notes: "As in Bengali and Hindi, 21 to 99 are not built from parts: each has its own word, which you learn one by one, as with পঁচিশ (pom̐six), 25."
  - id: as-0240
    target: "চল্লিশ"
    native: "40, forty"
    reading: "sollix"
    ipa: "sollix"
    pos: "other"
  - id: as-0241
    target: "পঞ্চাশ"
    native: "50, fifty"
    reading: "pônsāx"
    ipa: "pɔnsax"
    pos: "other"
  - id: as-0242
    target: "ষাঠি"
    native: "60, sixty"
    reading: "xāthi"
    ipa: "xatʰi"
    pos: "other"
  - id: as-0243
    target: "সত্তৰ"
    native: "70, seventy"
    reading: "xôttôr"
    ipa: "xɔttɔɹ"
    pos: "other"
  - id: as-0244
    target: "আশী"
    native: "80, eighty"
    reading: "āxi"
    ipa: "axi"
    pos: "other"
  - id: as-0245
    target: "নব্বৈ"
    native: "90, ninety"
    reading: "nôbbôi"
    ipa: "nɔbbɔi"
    pos: "other"
  - id: as-0246
    target: "পঁচিশ"
    native: "25, twenty-five"
    reading: "pom̐six"
    ipa: "põsix"
    pos: "other"
    notes: "From পাঁচ (pām̐s), five, and বিশ (bix), twenty, fused into one word."
  - id: as-0247
    target: "এশ"
    native: "100, a hundred"
    reading: "ex"
    ipa: "ex"
    pos: "other"
    notes: "Hundreds join into one word: দুশ (dux) is 200, তিনিশ (tinix) 300, পাঁচশ (pām̐sôx) 500."
  - id: as-0248
    target: "দুশ"
    native: "200, two hundred"
    reading: "dux"
    ipa: "dux"
    pos: "other"
    notes: "The hundreds join into one word, never two."
  - id: as-0249
    target: "তিনিশ"
    native: "300, three hundred"
    reading: "tinix"
    ipa: "tinix"
    pos: "other"
  - id: as-0250
    target: "চাৰিশ"
    native: "400, four hundred"
    reading: "sārix"
    ipa: "saɹix"
    pos: "other"
  - id: as-0251
    target: "পাঁচশ"
    native: "500, five hundred"
    reading: "pām̐sôx"
    ipa: "pãsɔx"
    pos: "other"
  - id: as-0252
    target: "ছশ"
    native: "600, six hundred"
    reading: "sôx"
    ipa: "sɔx"
    pos: "other"
  - id: as-0253
    target: "সাতশ"
    native: "700, seven hundred"
    reading: "xātôx"
    ipa: "xatɔx"
    pos: "other"
  - id: as-0254
    target: "আঠশ"
    native: "800, eight hundred"
    reading: "āthôx"
    ipa: "atʰɔx"
    pos: "other"
  - id: as-0255
    target: "নশ"
    native: "900, nine hundred"
    reading: "nôx"
    ipa: "nɔx"
    pos: "other"
  - id: as-0256
    target: "হাজাৰ"
    native: "1,000, a thousand"
    reading: "hāzār"
    ipa: "hazaɹ"
    pos: "other"
    notes: "On its own or with এক (ek): এক হাজাৰ (ek hāzār). Two thousand is দুহাজাৰ (duhāzār) or দুই হাজাৰ (dui hāzār)."
  - id: as-0257
    target: "দুহাজাৰ"
    native: "2,000, two thousand"
    reading: "duhāzār"
    ipa: "duhazaɹ"
    alt_target: ["দুই হাজাৰ"]
    pos: "other"
    notes: "Also দুই হাজাৰ (dui hāzār). Three thousand is তিনি হাজাৰ (tini hāzār), and so on."
  - id: as-0258
    target: "লাখ"
    native: "1,00,000, a lakh (a hundred thousand)"
    reading: "lākh"
    ipa: "lakʰ"
    alt_target: ["লক্ষ"]
    pos: "other"
    notes: "South Asian numbering counts in lakhs and crores, and places its commas to match: 1,00,000 is one lakh. Formally লক্ষ (lôkkhô)."
  - id: as-0259
    target: "কোটি"
    native: "1,00,00,000, a crore (ten million)"
    reading: "kuti"
    ipa: "kʊti"
    pos: "other"
    notes: "A hundred lakh."
  - id: as-0260
    target: "ডেৰ"
    native: "1½, one and a half"
    reading: "der"
    ipa: "deɹ"
    pos: "other"
    notes: "With hundreds too: ডেৰশ (derôx) is 150. Heard constantly in markets."
  - id: as-0261
    target: "আঢ়ৈ"
    native: "2½, two and a half"
    reading: "ārhôi"
    ipa: "aɹɔi"
    pos: "other"
    notes: "আঢ়ৈশ (ārhôix) is 250. From 3½ on, Assamese says সাৰে (xāre), 'and a half': সাৰে তিনি (xāre tini), 3½."
  - id: as-0262
    target: "আধা"
    native: "½, half"
    reading: "ādhā"
    ipa: "adʱa"
    pos: "other"
    notes: "আধা কিলো (ādhā kilo), half a kilo. With a number, the half is ডেৰ (der), আঢ়ৈ (ārhôi) or সাৰে (sāre) instead."
  - id: as-0263
    target: "দুশ পঞ্চাশ"
    native: "250, two hundred and fifty"
    reading: "dux pônsāx"
    ipa: "dux pɔnsax"
    pos: "other"
    notes: "The hundred, then the rest, with no 'and'. Also আঢ়ৈশ (ārhôix)."
  - id: as-0264
    target: "এশ পঞ্চাশ"
    native: "150, a hundred and fifty"
    reading: "ex pônsāx"
    ipa: "ex pɔnsax"
    pos: "other"
    notes: "Also ডেৰশ (derôx), 'one and a half hundred'."
  - id: as-0265
    target: "দুহাজাৰ বিশ"
    native: "2020, two thousand and twenty"
    reading: "duhāzār bix"
    ipa: "duhazaɹ bix"
    pos: "other"
    notes: "A year is read as a number, thousands first."
