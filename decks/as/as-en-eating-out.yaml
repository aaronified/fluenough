schema: 1
id: as-en-eating-out
name: "Eating out"
kind: vocab
theme: eating-out
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Ordering, asking for less spice, Assam's everyday dishes, and paying the bill. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0407
    target: "আহাৰ"
    native: "food; a meal"
    reading: "āhār"
    ipa: "ahaɹ"
    pos: "noun"
    notes: "A careful word. In speech a meal is ভাত (bhāt), rice."
  - ref: as-0111
    notes: "In this deck: a meal. ভাত খালেনে? (bhat khalene?), 'have you eaten rice?', means 'have you eaten?', and is often asked as a greeting."
  - id: as-0408
    target: "পানী"
    native: "water"
    reading: "pāni"
    ipa: "pani"
    pos: "noun"
    notes: "পানী খোৱা (pāni khuwā), to drink water: Assamese 'eats' water and tea."
  - id: as-0409
    target: "চাহ"
    native: "tea"
    reading: "sāh"
    ipa: "sah"
    pos: "noun"
    notes: "Assam tea is drunk with milk and sugar, গাখীৰ চাহ (gākhir sāh), or without milk as ৰঙা চাহ (rôṅā sāh), 'red tea'."
  - id: as-0410
    target: "কফি"
    native: "coffee"
    reading: "kophi"
    ipa: "kopʰi"
    pos: "noun"
  - id: as-0411
    target: "মোক … লাগে।"
    native: "I'd like …; I need …"
    reading: "muk... lāge."
    ipa: "mʊk laɡe"
    pos: "phrase"
    notes: "'To me … is needed': মোক এগিলাচ পানী লাগে (muk egilās pāni lāge), I'd like a glass of water."
  - id: as-0412
    target: "আৰু"
    native: "more; and"
    reading: "āru"
    ipa: "aɹu"
    pos: "other"
    notes: "আৰু অলপ (āru ôlôp), a little more. Between two nouns it is 'and': মাছ আৰু ভাত, fish and rice."
  - id: as-0413
    target: "জলা"
    native: "hot (with chilli); spicy"
    reading: "zôlā"
    ipa: "zɔla"
    pos: "adj"
    notes: "জলা কম কৰিব (zôlā kôm koribô), less spicy, please. Assamese cooking uses few spices, and the heat often comes from a raw chilli on the side."
  - id: as-0414
    target: "মিঠা"
    native: "sweet"
    reading: "mithā"
    ipa: "mitʰa"
    pos: "adj"
  - id: as-0415
    target: "টেঙা"
    native: "sour; a sour curry"
    reading: "teṅā"
    ipa: "teŋa"
    pos: "adj"
    notes: "মাছৰ টেঙা (māsôr teṅā), a light, sour fish curry soured with tomato or lemon, is Assam's best-loved dish."
  - id: as-0416
    target: "পিঠা"
    native: "pitha (rice cakes)"
    reading: "pithā"
    ipa: "pitʰa"
    pos: "noun"
    notes: "Made of rice flour, sweet or plain, above all at Bihu: তিল পিঠা (til pithā) is rolled round sesame and jaggery."
  - id: as-0417
    target: "নিৰামিষ"
    native: "vegetarian (food)"
    reading: "nirāmix"
    ipa: "niɹamix"
    pos: "adj"
    notes: "With meat or fish is আমিষ (āmix). Menus also say 'veg' and 'non-veg'."
  - id: as-0418
    target: "বিলটো দিয়ক।"
    native: "The bill, please."
    reading: "biltu diyôk."
    ipa: "biltʊ dijɔk"
    pos: "phrase"
    tags: ["polite"]
  - id: as-0419
    target: "বৰ সোৱাদ লাগিল।"
    native: "That was delicious."
    reading: "bôr xuwād lāgil."
    ipa: "bɔɹ xʊwad laɡil"
    pos: "phrase"
    notes: "Literally 'it tasted very good': সোৱাদ (xuwād), taste."
  - id: as-0420
    target: "ভাত খালেনে?"
    native: "Have you eaten? (respectful)"
    reading: "bhāt khālene?"
    ipa: "bʱat kʰalene"
    pos: "phrase"
    tags: ["greeting"]
    notes: "Asked as often as 'how are you?'. To a friend: ভাত খালানে? (bhat khalane?)."
