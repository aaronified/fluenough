schema: 1
id: as-en-grammar-nouns
name: "Nouns: the, plural and case"
kind: grammar
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "A classifier for 'the', -বোৰ for the plural, and the endings for of, in and to. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Noun forms"
  slot_name: "form"
  slots: ["the one: -টো, -খন …", "the ones: -বোৰ", "of: -ৰ", "in, at: -ত", "to: -লৈ"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Assamese has no 'the': a classifier after the noun does its work. -টো is for most things and animals, -খন for flat or large things, vehicles, books and places, -জন for a man and -জনী for a woman. -বোৰ makes a plural of anything; people also take -হঁত, or -সকল with respect: ল'ৰাহঁত, the boys. The endings go straight onto the noun: ঘৰৰ, ঘৰত, ঘৰলৈ. 'From' is -ৰ পৰা: ঘৰৰ পৰা, from home. A few nouns change before an ending: গাঁও, village, becomes গাঁৱ-: গাঁৱত, in the village."
  entries:
    - lemma: "ঘৰ"
      key: ghor
      reading: "ghor"
      gloss: "house"
      forms:
        "the one: -টো, -খন …": ["ঘৰটো", "ঘৰখন"]
        "the ones: -বোৰ": "ঘৰবোৰ"
        "of: -ৰ": "ঘৰৰ"
        "in, at: -ত": "ঘৰত"
        "to: -লৈ": "ঘৰলৈ"
      readings:
        "the one: -টো, -খন …": ["ghortu", "ghorkhon"]
        "the ones: -বোৰ": "ghorbur"
        "of: -ৰ": "ghoror"
        "in, at: -ত": "ghorot"
        "to: -লৈ": "ghoroloi"
    - lemma: "দোকান"
      key: dukan
      reading: "dukan"
      gloss: "shop"
      forms:
        "the one: -টো, -খন …": "দোকানখন"
        "the ones: -বোৰ": "দোকানবোৰ"
        "of: -ৰ": "দোকানৰ"
        "in, at: -ত": "দোকানত"
        "to: -লৈ": "দোকানলৈ"
      readings:
        "the one: -টো, -খন …": "dukankhon"
        "the ones: -বোৰ": "dukanbur"
        "of: -ৰ": "dukanor"
        "in, at: -ত": "dukanot"
        "to: -লৈ": "dukanoloi"
    - lemma: "কোঠা"
      key: kutha
      reading: "kutha"
      gloss: "room"
      forms:
        "the one: -টো, -খন …": "কোঠাটো"
        "the ones: -বোৰ": "কোঠাবোৰ"
        "of: -ৰ": "কোঠাৰ"
        "in, at: -ত": "কোঠাত"
        "to: -লৈ": "কোঠালৈ"
      readings:
        "the one: -টো, -খন …": "kuthatu"
        "the ones: -বোৰ": "kuthabur"
        "of: -ৰ": "kuthar"
        "in, at: -ত": "kuthat"
        "to: -লৈ": "kuthaloi"
    - lemma: "চহৰ"
      key: sohor
      reading: "sohor"
      gloss: "town; city"
      forms:
        "the one: -টো, -খন …": "চহৰখন"
        "the ones: -বোৰ": "চহৰবোৰ"
        "of: -ৰ": "চহৰৰ"
        "in, at: -ত": "চহৰত"
        "to: -লৈ": "চহৰলৈ"
      readings:
        "the one: -টো, -খন …": "sohorkhon"
        "the ones: -বোৰ": "sohorbur"
        "of: -ৰ": "sohoror"
        "in, at: -ত": "sohorot"
        "to: -লৈ": "sohoroloi"
    - lemma: "গাড়ী"
      key: gari
      reading: "gari"
      gloss: "car"
      forms:
        "the one: -টো, -খন …": "গাড়ীখন"
        "the ones: -বোৰ": "গাড়ীবোৰ"
        "of: -ৰ": "গাড়ীৰ"
        "in, at: -ত": "গাড়ীত"
        "to: -লৈ": "গাড়ীলৈ"
      readings:
        "the one: -টো, -খন …": "garikhon"
        "the ones: -বোৰ": "garibur"
        "of: -ৰ": "garir"
        "in, at: -ত": "garit"
        "to: -লৈ": "gariloi"
    - lemma: "গাঁও"
      key: gao
      reading: "gao"
      gloss: "village"
      forms:
        "the one: -টো, -খন …": "গাঁওখন"
        "the ones: -বোৰ": "গাঁওবোৰ"
        "of: -ৰ": "গাঁৱৰ"
        "in, at: -ত": "গাঁৱত"
        "to: -লৈ": "গাঁৱলৈ"
      readings:
        "the one: -টো, -খন …": "gaokhon"
        "the ones: -বোৰ": "gaobur"
        "of: -ৰ": "gaor"
        "in, at: -ত": "gaot"
        "to: -লৈ": "gaoloi"
