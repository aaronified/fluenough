schema: 1
id: as-en-grammar-nouns
name: "Nouns: the, plural and case"
kind: grammar
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "A classifier for 'the', -বোৰ (-bur) for the plural, and the endings for of, in and to. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Noun forms"
  slot_name: "form"
  slots: ["the one: -টো (-tu), -খন (-khôn) …", "the ones: -বোৰ (-bur)", "of: -ৰ (-rô)", "in, at: -ত (-tô)", "to: -লৈ (-lôi)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Assamese has no 'the': a classifier after the noun does its work. -টো (-tu) is for most things and animals, -খন (-khôn) for flat or large things, vehicles, books and places, -জন (-zôn) for a man and -জনী (-zoni) for a woman. -বোৰ (-bur) makes a plural of anything; people also take -হঁত (-hôm̐t), or -সকল (-sôkôl) with respect: ল (lô)'ৰাহঁত (rāhôm̐t), the boys. The endings go straight onto the noun: ঘৰৰ (ghôrôr), ঘৰত (ghôrôt), ঘৰলৈ (ghôrôlôi). 'From' is -ৰ পৰা (-rô pôrā): ঘৰৰ পৰা (ghôrôr pôrā), from home. A few nouns change before an ending: গাঁও (gām̐o), village, becomes গাঁৱ- (gām̐w-): গাঁৱত (gām̐wôt), in the village."
  entries:
    - lemma: "ঘৰ"
      key: ghor
      reading: "ghôr"
      ipa: "ɡʱɔɹ"
      gloss: "house"
      forms:
        "the one: -টো (-tu), -খন (-khôn) …": ["ঘৰটো", "ঘৰখন"]
        "the ones: -বোৰ (-bur)": "ঘৰবোৰ"
        "of: -ৰ (-rô)": "ঘৰৰ"
        "in, at: -ত (-tô)": "ঘৰত"
        "to: -লৈ (-lôi)": "ঘৰলৈ"
      readings:
        "the one: -টো (-tu), -খন (-khôn) …": ["ghôrtu", "ghôrkhôn"]
        "the ones: -বোৰ (-bur)": "ghôrbur"
        "of: -ৰ (-rô)": "ghôrôr"
        "in, at: -ত (-tô)": "ghôrôt"
        "to: -লৈ (-lôi)": "ghôrôlôi"
      ipas:
        "the one: -টো (-tu), -খন (-khôn) …": "ɡʱɔɹtʊ"
        "the ones: -বোৰ (-bur)": "ɡʱɔɹbʊɹ"
        "of: -ৰ (-rô)": "ɡʱɔɹɔɹ"
        "in, at: -ত (-tô)": "ɡʱɔɹɔt"
        "to: -লৈ (-lôi)": "ɡʱɔɹɔlɔi"
    - lemma: "দোকান"
      key: dukan
      reading: "dukān"
      ipa: "dʊkan"
      gloss: "shop"
      forms:
        "the one: -টো (-tu), -খন (-khôn) …": "দোকানখন"
        "the ones: -বোৰ (-bur)": "দোকানবোৰ"
        "of: -ৰ (-rô)": "দোকানৰ"
        "in, at: -ত (-tô)": "দোকানত"
        "to: -লৈ (-lôi)": "দোকানলৈ"
      readings:
        "the one: -টো (-tu), -খন (-khôn) …": "dukānkhôn"
        "the ones: -বোৰ (-bur)": "dukānbur"
        "of: -ৰ (-rô)": "dukānôr"
        "in, at: -ত (-tô)": "dukānôt"
        "to: -লৈ (-lôi)": "dukānôlôi"
      ipas:
        "the one: -টো (-tu), -খন (-khôn) …": "dʊkankʰɔn"
        "the ones: -বোৰ (-bur)": "dʊkanbʊɹ"
        "of: -ৰ (-rô)": "dʊkanɔɹ"
        "in, at: -ত (-tô)": "dʊkanɔt"
        "to: -লৈ (-lôi)": "dʊkanɔlɔi"
