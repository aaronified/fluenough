schema: 1
id: as-en-grammar-nouns
name: "Nouns: the, plural and case"
kind: grammar
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "A classifier for 'the', -বোৰ for the plural, and the endings for of, in and to. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Noun forms"
  slot_name: "form"
  slots: ["the one: -টো, -খন …", "the ones: -বোৰ", "of: -ৰ", "in, at: -ত", "to: -লৈ"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Assamese has no 'the': a classifier after the noun does its work. -টো is for most things and animals, -খন for flat or large things, vehicles, books and places, -জন for a man and -জনী for a woman. -বোৰ makes a plural of anything; people also take -হঁত, or -সকল with respect: ল'ৰাহঁত, the boys. The endings go straight onto the noun: ঘৰৰ, ঘৰত, ঘৰলৈ. 'From' is -ৰ পৰা: ঘৰৰ পৰা, from home. A few nouns change before an ending: গাঁও, village, becomes গাঁৱ-: গাঁৱত, in the village."
  entries:
    - lemma: "ঘৰ"
      key: ghor
      reading: "ghôr"
      ipa: "ɡʱɔɹ"
      gloss: "house"
      forms:
        "the one: -টো, -খন …": ["ঘৰটো", "ঘৰখন"]
        "the ones: -বোৰ": "ঘৰবোৰ"
        "of: -ৰ": "ঘৰৰ"
        "in, at: -ত": "ঘৰত"
        "to: -লৈ": "ঘৰলৈ"
      readings:
        "the one: -টো, -খন …": ["ghôrtu", "ghôrkhôn"]
        "the ones: -বোৰ": "ghôrbur"
        "of: -ৰ": "ghôrôr"
        "in, at: -ত": "ghôrôt"
        "to: -লৈ": "ghôrôlôi"
      ipas:
        "the one: -টো, -খন …": "ɡʱɔɹtʊ"
        "the ones: -বোৰ": "ɡʱɔɹbʊɹ"
        "of: -ৰ": "ɡʱɔɹɔɹ"
        "in, at: -ত": "ɡʱɔɹɔt"
        "to: -লৈ": "ɡʱɔɹɔlɔi"
    - lemma: "দোকান"
      key: dukan
      reading: "dukān"
      ipa: "dʊkan"
      gloss: "shop"
      forms:
        "the one: -টো, -খন …": "দোকানখন"
        "the ones: -বোৰ": "দোকানবোৰ"
        "of: -ৰ": "দোকানৰ"
        "in, at: -ত": "দোকানত"
        "to: -লৈ": "দোকানলৈ"
      readings:
        "the one: -টো, -খন …": "dukānkhôn"
        "the ones: -বোৰ": "dukānbur"
        "of: -ৰ": "dukānôr"
        "in, at: -ত": "dukānôt"
        "to: -লৈ": "dukānôlôi"
      ipas:
