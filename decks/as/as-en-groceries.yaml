schema: 1
id: as-en-groceries
name: "Groceries"
kind: vocab
theme: groceries
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Vegetables, fish, meat, eggs and the staples, several with words of Assam's own. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0280
    target: "শাক-পাচলি"
    native: "vegetables"
    reading: "xak-pasoli"
    pos: "noun"
    notes: "শাক (xak), leafy greens, and পাচলি (pasoli), other vegetables."
  - id: as-0281
    target: "আলু"
    native: "potato"
    reading: "alu"
    pos: "noun"
  - id: as-0282
    target: "পিঁয়াজ"
    native: "onion"
    reading: "piyaj"
    pos: "noun"
  - id: as-0283
    target: "বিলাহী"
    native: "tomato"
    reading: "bilahi"
    pos: "noun"
    notes: "A word of Assam's own, where Bengali and Hindi say tomato. বিলাহীৰ টেঙা (bilahir tenga), a sour fish curry made with tomato."
  - id: as-0284
    target: "জলকীয়া"
    native: "chilli"
    reading: "jolokiya"
    pos: "noun"
    notes: "From জলা (jola), hot. ভূত জলকীয়া (bhut jolokiya), the ghost pepper, grown in Assam, is among the hottest chillies in the world."
  - id: as-0285
    target: "নহৰু"
    native: "garlic"
    reading: "nohoru"
    pos: "noun"
  - id: as-0286
    target: "আদা"
    native: "ginger"
    reading: "ada"
    pos: "noun"
  - id: as-0287
    target: "মাছ"
    native: "fish"
    reading: "mas"
    pos: "noun"
    notes: "Fish and rice, মাছ-ভাত (mas-bhat), is the everyday Assamese meal. River fish such as ৰৌ (rou, rohu) are favourites."
  - id: as-0288
    target: "মাংস"
    native: "meat"
    reading: "mangxo"
    pos: "noun"
    notes: "ং is ng, and স is x."
  - id: as-0289
    target: "মাটন"
    native: "mutton (goat meat)"
    reading: "maton"
    pos: "noun"
    notes: "Also ছাগলীৰ মাংস (sagolir mangxo), goat's meat. In India 'mutton' almost always means goat."
  - id: as-0290
    target: "কুকুৰা"
    native: "chicken; hen"
    reading: "kukura"
    pos: "noun"
    notes: "Careful: কুকুৰ (kukur), with no final a, is a dog. Chicken meat is কুকুৰাৰ মাংস (kukurar mangxo); shops also say চিকেন (siken)."
  - id: as-0291
    target: "কণী"
    native: "egg"
    reading: "koni"
    pos: "noun"
    notes: "Also a word of Assam's own. Duck eggs, হাঁহৰ কণী (hahor koni), are popular too."
  - id: as-0292
    target: "গাখীৰ"
    native: "milk"
    reading: "gakhir"
    pos: "noun"
  - id: as-0293
    target: "চাউল"
    native: "rice (uncooked)"
    reading: "saul"
    pos: "noun"
    notes: "Cooked rice is ভাত (bhat); rice in the husk, ধান (dhan). Assam grows its own kinds, among them বৰা চাউল (bora saul), sticky rice."
  - id: as-0294
    target: "দাইল"
    native: "lentils; dal"
    reading: "dail"
    pos: "noun"
  - id: as-0295
    target: "নিমখ"
    native: "salt"
    reading: "nimokh"
    pos: "noun"
  - id: as-0296
    target: "তেল"
    native: "oil"
    reading: "tel"
    pos: "noun"
    notes: "Cooking is mostly with mustard oil, সৰিয়হৰ তেল (xoriyohor tel)."
  - id: as-0297
    target: "কল"
    native: "banana"
    reading: "kol"
    pos: "noun"
    notes: "কল also means a machine or a tap: পানীৰ কল (panir kol), a water tap."
