id: as-en-groceries
name: "Groceries"
kind: vocab
theme: groceries
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Vegetables, fish, meat, eggs and the staples, several with words of Assam's own. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0280
    target: "শাক-পাচলি"
    native: "vegetables"
    reading: "xāk-pāsoli"
    ipa: "xakpasoli"
    pos: "noun"
    notes: "শাক (xāk), leafy greens, and পাচলি (pāsoli), other vegetables."
  - id: as-0281
    target: "আলু"
    native: "potato"
    reading: "ālu"
    ipa: "alu"
    pos: "noun"
  - id: as-0282
    target: "পিঁয়াজ"
    native: "onion"
    reading: "pim̐yāz"
    ipa: "pĩjaz"
    pos: "noun"
  - id: as-0283
    target: "বিলাহী"
    native: "tomato"
    reading: "bilāhi"
    ipa: "bilahi"
    pos: "noun"
    notes: "A word of Assam's own, where Bengali and Hindi say tomato. বিলাহীৰ টেঙা (bilāhir teṅā), a sour fish curry made with tomato."
  - id: as-0284
    target: "জলকীয়া"
    native: "chilli"
    reading: "zôlokiyā"
    ipa: "zɔlokija"
    pos: "noun"
    notes: "From জলা (zôlā), hot. ভূত জলকীয়া (bhut zôlokiyā), the ghost pepper, grown in Assam, is among the hottest chillies in the world."
  - id: as-0285
    target: "নহৰু"
    native: "garlic"
    reading: "nôhoru"
    ipa: "nɔhoɹu"
    pos: "noun"
  - id: as-0286
    target: "আদা"
    native: "ginger"
    reading: "ādā"
    ipa: "ada"
    pos: "noun"
  - id: as-0287
    target: "মাছ"
    native: "fish"
    reading: "mās"
    ipa: "mas"
    pos: "noun"
    notes: "Fish and rice, মাছ-ভাত (mās-bhāt), is the everyday Assamese meal. River fish such as ৰৌ (rôu, rohu) are favourites."
  - id: as-0288
    target: "মাংস"
    native: "meat"
    reading: "māṅxô"
    ipa: "maŋxɔ"
    pos: "noun"
    notes: "ং is ng, and স is x."
  - id: as-0289
    target: "মাটন"
    native: "mutton (goat meat)"
    reading: "mātôn"
    ipa: "matɔn"
    pos: "noun"
    notes: "Also ছাগলীৰ মাংস (sāgolir māṅxô), goat's meat. In India 'mutton' almost always means goat."
  - id: as-0290
    target: "কুকুৰা"
    native: "chicken; hen"
    reading: "kukurā"
    ipa: "kukuɹa"
    pos: "noun"
    notes: "Careful: কুকুৰ (kukur), with no final a, is a dog. Chicken meat is কুকুৰাৰ মাংস (kukurār māṅxô); shops also say চিকেন (siken)."
  - id: as-0291
    target: "কণী"
    native: "egg"
    reading: "koni"
    ipa: "koni"
    pos: "noun"
    notes: "Also a word of Assam's own. Duck eggs, হাঁহৰ কণী (hām̐hôr koni), are popular too."
  - id: as-0292
    target: "গাখীৰ"
    native: "milk"
    reading: "gākhir"
    ipa: "ɡakʰiɹ"
    pos: "noun"
  - id: as-0293
    target: "চাউল"
    native: "rice (uncooked)"
    reading: "sāul"
    ipa: "saul"
    pos: "noun"
    notes: "Cooked rice is ভাত (bhāt); rice in the husk, ধান (dhān). Assam grows its own kinds, among them বৰা চাউল (bôrā sāul), sticky rice."
  - id: as-0294
    target: "দাইল"
    native: "lentils; dal"
    reading: "dāil"
    ipa: "dail"
    pos: "noun"
  - id: as-0295
    target: "নিমখ"
    native: "salt"
    reading: "nimôkh"
    ipa: "nimɔkʰ"
    pos: "noun"
  - id: as-0296
    target: "তেল"
    native: "oil"
    reading: "tel"
    ipa: "tel"
    pos: "noun"
    notes: "Cooking is mostly with mustard oil, সৰিয়হৰ তেল (xoriyôhôr tel)."
  - id: as-0297
    target: "কল"
    native: "banana"
    reading: "kôl"
    ipa: "kɔl"
    pos: "noun"
    notes: "কল also means a machine or a tap: পানীৰ কল (pānir kôl), a water tap."
