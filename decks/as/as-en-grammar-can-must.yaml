schema: 1
id: as-en-grammar-can-must
name: "Can, may and must"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Ability, knowing how, permission and duty: the verb in -ব with পাৰ্, জান্, লাগিব and নাপায়. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: as-2159
    target: "মই অসমীয়া ক'ব পাৰোঁ।"
    native: "I can speak Assamese."
    reading: "moi oxomiya kobo paru."
    alt_target: ["মই অসমীয়া ক'ব পাৰো।"]
    pos: "phrase"
    notes: "Can is the verb in -ব, then পাৰ্ with the person's ending: ক'ব পাৰোঁ, I can speak."
  - id: as-2160
    target: "আপুনি কাইলৈ আহিব পাৰিবনে?"
    native: "Can you come tomorrow?"
    reading: "apuni kailoi ahibo paribone?"
    pos: "phrase"
  - id: as-2161
    target: "মই আহিব নোৱাৰোঁ।"
    native: "I can't come."
    reading: "moi ahibo nuwaru."
    alt_target: ["মই আহিব নোৱাৰো।"]
    pos: "phrase"
    notes: "Can't is নোৱাৰ্, not ন- with পাৰ্: নোৱাৰোঁ, I can't; নোৱাৰে, he can't."
  - id: as-2162
    target: "মই সাঁতুৰিব জানোঁ।"
    native: "I can swim."
    reading: "moi xaturibo janu."
    alt_target: ["মই সাঁতুৰিব জানো।"]
    pos: "phrase"
    notes: "For a skill, 'know how': the verb in -ব, then জান্, to know."
  - id: as-2163
    target: "আপুনি ভিতৰলৈ আহিব পাৰে।"
    native: "You may come in."
    reading: "apuni bhitoroloi ahibo pare."
    pos: "phrase"
    notes: "পাৰে is also may: you can, you are allowed."
  - id: as-2164
    target: "ইয়াত ফটো তুলিব নাপায়।"
    native: "You mustn't take photos here."
    reading: "iyat photo tulibo napay."
    pos: "phrase"
    notes: "Mustn't is the verb in -ব with নাপায়, the same for everyone."
  - ref: as-2151
  - id: as-2165
    target: "আপুনি কাইলৈ আহিব লাগিব।"
    native: "You must come tomorrow."
    reading: "apuni kailoi ahibo lagibo."
    pos: "phrase"
    notes: "Must is the verb in -ব with লাগিব, 'will be needed', or লাগে: the same for everyone."
  - id: as-2166
    target: "মই যাব নালাগে।"
    native: "I don't have to go."
    reading: "moi jabo nalage."
    pos: "phrase"
    notes: "Don't have to is the verb in -ব with নালাগে, 'is not needed'."
  - id: as-2167
    target: "মই যাব পাৰোঁনে?"
    native: "May I go?"
    reading: "moi jabo parune?"
    pos: "phrase"
