schema: 1
id: as-en-grammar-can-must
name: "Can, may and must"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Ability, knowing how, permission and duty: the verb in -ব (-bô) with পাৰ্ (pār), জান্ (zān), লাগিব (lāgib) and নাপায় (nāpāy). Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: as-2159
    target: "মই অসমীয়া ক'ব পাৰোঁ।"
    native: "I can speak Assamese."
    reading: "moi ôxomiyā kobô pārum̐."
    ipa: "moi ɔxomija kobɔ paɹʊ̃"
    alt_target: ["মই অসমীয়া ক'ব পাৰো।"]
    pos: "phrase"
    notes: "Can is the verb in -ব (-bô), then পাৰ্ (pār) with the person's ending: ক (kô)'ব পাৰোঁ (bô pārum̐), I can speak."
  - id: as-2160
    target: "আপুনি কাইলৈ আহিব পাৰিবনে?"
    native: "Can you come tomorrow?"
    reading: "āpuni kāilôi āhibô pāribône?"
    ipa: "apuni kailɔi ahibɔ paɹibɔne"
    pos: "phrase"
  - id: as-2161
    target: "মই আহিব নোৱাৰোঁ।"
    native: "I can't come."
    reading: "moi āhibô nuwārum̐."
    ipa: "moi ahibɔ nʊwaɹʊ̃"
    alt_target: ["মই আহিব নোৱাৰো।"]
    pos: "phrase"
    notes: "Can't is নোৱাৰ্ (nuwār), not ন- (nô-) with পাৰ্ (pār): নোৱাৰোঁ (nuwārum̐), I can't; নোৱাৰে (nuwāre), he can't."
  - id: as-2162
    target: "মই সাঁতুৰিব জানোঁ।"
    native: "I can swim."
    reading: "moi xām̐turibô zānum̐."
    ipa: "moi xãtuɹibɔ zanʊ̃"
    alt_target: ["মই সাঁতুৰিব জানো।"]
    pos: "phrase"
    notes: "For a skill, 'know how': the verb in -ব (-bô), then জান্ (zān), to know."
  - id: as-2163
    target: "আপুনি ভিতৰলৈ আহিব পাৰে।"
    native: "You may come in."
    reading: "āpuni bhitôrôlôi āhibô pāre."
    ipa: "apuni bʱitɔɹɔlɔi ahibɔ paɹe"
    pos: "phrase"
    notes: "পাৰে (pāre) is also may: you can, you are allowed."
  - id: as-2164
    target: "ইয়াত ফটো তুলিব নাপায়।"
    native: "You mustn't take photos here."
    reading: "iyāt phôto tulibô nāpāy."
    ipa: "ijat pʰɔto tulibɔ napaj"
    pos: "phrase"
    notes: "Mustn't is the verb in -ব (-bô) with নাপায় (nāpāy), the same for everyone."
  - ref: as-2151
  - id: as-2165
    target: "আপুনি কাইলৈ আহিব লাগিব।"
    native: "You must come tomorrow."
    reading: "āpuni kāilôi āhibô lāgibô."
    ipa: "apuni kailɔi ahibɔ laɡibɔ"
    pos: "phrase"
    notes: "Must is the verb in -ব (-bô) with লাগিব (lāgib), 'will be needed', or লাগে (lāge): the same for everyone."
  - id: as-2166
    target: "মই যাব নালাগে।"
    native: "I don't have to go."
    reading: "moi zābô nālāge."
    ipa: "moi zabɔ nalaɡe"
    pos: "phrase"
    notes: "Don't have to is the verb in -ব (-bô) with নালাগে (nālāge), 'is not needed'."
  - id: as-2167
    target: "মই যাব পাৰোঁনে?"
    native: "May I go?"
    reading: "moi zābô pārum̐ne?"
    ipa: "moi zabɔ paɹʊ̃ne"
    pos: "phrase"
