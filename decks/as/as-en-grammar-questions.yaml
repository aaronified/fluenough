schema: 1
id: as-en-grammar-questions
name: "Basic questions"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Yes/no questions with -নে and নেকি, and question words. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: as-2029
    target: "আপুনি অসমীয়া জানেনে?"
    native: "Do you know Assamese?"
    reading: "apuni oxomiya janene?"
    pos: "phrase"
    notes: "-নে at the end of the verb makes a yes/no question."
  - id: as-2030
    target: "চাহ খাবনে?"
    native: "Will you have tea?"
    reading: "sah khabone?"
    pos: "phrase"
    notes: "To someone you respect. To a friend, চাহ খাবানে? (sah khabane?)"
  - id: as-2031
    target: "এইটো কি?"
    native: "What is this?"
    reading: "eitu ki?"
    pos: "phrase"
    notes: "The question word goes where the answer would: এইটো কিতাপ, this is a book."
  - id: as-2032
    target: "তুমি ক'লৈ গৈ আছা?"
    native: "Where are you going?"
    reading: "tumi koloi goi asa?"
    pos: "phrase"
    notes: "ক'লৈ, 'to where', from ক'ত, 'where'. The apostrophe marks the vowel o."
  - id: as-2033
    target: "তেওঁ কোন?"
    native: "Who is he? / Who is she?"
    reading: "teu kun?"
    pos: "phrase"
    notes: "তেওঁ is a respectful 'he' or 'she'."
  - id: as-2034
    target: "আপুনি কেতিয়া আহিব?"
    native: "When will you come?"
    reading: "apuni ketiya ahibo?"
    pos: "phrase"
  - id: as-2035
    target: "আপুনি অসমীয়া কিয় শিকি আছে?"
    native: "Why are you learning Assamese?"
    reading: "apuni oxomiya kiyo xiki ase?"
    pos: "phrase"
  - id: as-2036
    target: "আপোনাৰ ল'ৰা-ছোৱালী কেইজন?"
    native: "How many children do you have?"
    reading: "apunar lora-suwali keijon?"
    pos: "phrase"
    notes: "কেইজন, 'how many people': কেই-, how many, with -জন, the classifier for people. For things, কেইটা or কেইখন."
  - id: as-2037
    target: "কিমান হ'ল?"
    native: "How much is it?"
    reading: "kiman hol?"
    pos: "phrase"
    notes: "In a shop: 'how much has it come to?' কিমান is 'how much'."
  - id: as-2038
    target: "কেনে আছে?"
    native: "How are you? (respectful)"
    reading: "kene ase?"
    pos: "phrase"
    notes: "To a friend, কেনে আছা? (kene asa?) The answer: ভালে আছোঁ (bhale asu), I'm well."
  - id: as-2039
    target: "ভাল, নহয়নে?"
    native: "It's good, isn't it?"
    reading: "bhal, nohoyne?"
    pos: "phrase"
    notes: "নহয়নে, 'isn't it', at the end asks for agreement."
  - id: as-2040
    target: "ভাত খালা নেকি?"
    native: "Have you eaten?"
    reading: "bhat khala neki?"
    pos: "phrase"
    notes: "নেকি after the verb is another way to ask yes or no, common in speech. Asking whether someone has eaten is an everyday greeting."
