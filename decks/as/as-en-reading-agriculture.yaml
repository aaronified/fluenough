passages:
  - id: "as-a-farmer-talks"
    title: "A farmer talks about the season"
    theme: "agriculture"
    sentences:
      - text: "এইবাৰ ধানৰ ফচল ভাল।"
        reading: "eibār dhānôr phôsôl bhāl."
      - text: "জুট আৰু চাউল দুয়োটা হ'ল।"
        reading: "zut āru sāul duyōṭā hôl."
      - text: "বৰষুণ সময়ত আহিল।"
        reading: "bôrôxun xômôyôt āhil."
      - text: "এতিয়া ভঁড়ালত ৰাখিম।"
        reading: "etiyā bhum̐ḍālôt rākhim."
    questions:
      - id: "as-3552"
        prompt: { en: "The rice harvest is good this time." }
        answer: true
      - id: "as-3553"
        prompt: { en: "What else grew this season?" }
        options:
          - { en: "Jute" }
          - { en: "Tea" }
          - { en: "Coffee" }
        answer: 1
      - id: "as-3554"
        prompt: { en: "Where will the farmer keep the harvest?" }
        options:
          - { en: "In the granary" }
          - { en: "In the river" }
          - { en: "In the sky" }
        answer: 1
  - id: "as-market-prices"
    title: "A crop price board at a market"
    theme: "agriculture"
    sentences:
      - text: "ধান প্ৰতি মণ দুশ টকা।"
        reading: "dhān prôti môṇ dux tôkā."
      - text: "আলু প্ৰতি কিলো দহ টকা।"
        reading: "ālu prôti kilo dôh tôkā."
      - text: "মণ্ডি আজি খোলা।"
        reading: "môṇḍi āzi khulā."
      - text: "নতুন দাম কাইলৈ।"
        reading: "nôtun dām kāilôi."
    questions:
      - id: "as-3555"
        prompt: { en: "Rice is sold by the kilo." }
        answer: false
      - id: "as-3556"
        prompt: { en: "How much is a kilo of potatoes?" }
        options:
          - { en: "Ten rupees" }
          - { en: "Two hundred rupees" }
          - { en: "Fifty rupees" }
        answer: 1
      - id: "as-3557"
        prompt: { en: "When is the new price?" }
        options:
          - { en: "Today" }
          - { en: "Tomorrow" }
          - { en: "Never" }
        answer: 2
