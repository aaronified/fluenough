description: "One true, surprising thing about Assamese a day, in English, Bengali and Hindi. Not yet checked by an Assamese speaker: please report any mistake."
facts:
  - id: as-fact-001
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Assamese_language"
    text:
      en: "Assamese is the easternmost of the Indo-Aryan languages. With Bengali and Odia it descends from the Magadhi Prakrit of ancient eastern India."
      bn: "অসমিয়া ইন্দো-আর্য ভাষাগুলোর মধ্যে সবচেয়ে পূর্বের। বাংলা ও ওড়িয়ার মতো এটিও প্রাচীন পূর্ব ভারতের মাগধী প্রাকৃত থেকে এসেছে।"
      hi: "असमिया भारतीय-आर्य भाषाओं में सबसे पूर्वी है। बांग्ला और ओड़िया की तरह यह भी प्राचीन पूर्वी भारत की मागधी प्राकृत से निकली है।"
  - id: as-fact-002
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Assamese_language"
    text:
      en: "About 15 million people speak Assamese as their first language, nearly all of them in Assam, and many more speak it as a second language across the Northeast."
      bn: "প্রায় দেড় কোটি মানুষের মাতৃভাষা অসমিয়া, তাঁদের প্রায় সবাই অসমে থাকেন; উত্তর-পূর্বে আরও বহু মানুষ এটি দ্বিতীয় ভাষা হিসেবে বলেন।"
      hi: "लगभग डेढ़ करोड़ लोगों की मातृभाषा असमिया है, जिनमें से लगभग सभी असम में रहते हैं; पूर्वोत्तर में और भी बहुत से लोग इसे दूसरी भाषा के रूप में बोलते हैं।"
  - id: as-fact-003
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Eighth_Schedule_to_the_Constitution_of_India"
    text:
      en: "Assamese is the official language of Assam and one of the 22 languages listed in the Eighth Schedule of India's Constitution."
      bn: "অসমিয়া অসমের সরকারি ভাষা, এবং ভারতের সংবিধানের অষ্টম তফসিলের ২২টি ভাষার একটি।"
      hi: "असमिया असम की राजभाषा है, और भारत के संविधान की आठवीं अनुसूची की 22 भाषाओं में से एक है।"
  - id: as-fact-004
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Classical_languages_of_India"
    text:
      en: "In October 2024 India declared Assamese a classical language, together with Bengali, Marathi, Pali and Prakrit."
      bn: "২০২৪ সালের অক্টোবরে ভারত অসমিয়াকে ধ্রুপদী ভাষার মর্যাদা দেয়, বাংলা, মারাঠি, পালি ও প্রাকৃতের সঙ্গে।"
      hi: "अक्टूबर 2024 में भारत ने असमिया को बांग्ला, मराठी, पालि और प्राकृत के साथ शास्त्रीय भाषा का दर्जा दिया।"
  - id: as-fact-005
    tags: [script]
    text:
      en: "Assamese and Bengali share one script, but Assamese has two letters of its own: ৰ for r, where Bengali writes র, and ৱ for w, which Bengali lacks."
      bn: "অসমিয়া আর বাংলা একই লিপিতে লেখা হয়, তবে অসমিয়ার নিজস্ব দুটি অক্ষর আছে: r-এর জন্য ৰ, যেখানে বাংলা লেখে র, আর w-এর জন্য ৱ, যা বাংলায় নেই।"
      hi: "असमिया और बांग्ला एक ही लिपि में लिखी जाती हैं, पर असमिया के अपने दो अक्षर हैं: r के लिए ৰ, जहाँ बांग्ला র लिखती है, और w के लिए ৱ, जो बांग्ला में नहीं है।"
  - id: as-fact-006
    tags: [script]
    source: "https://www.unicode.org/charts/PDF/U0980.pdf"
    text:
      en: "Unicode puts Assamese letters in the block it calls Bengali. ৰ is named BENGALI LETTER RA WITH MIDDLE DIAGONAL, and ৱ BENGALI LETTER RA WITH LOWER DIAGONAL."
      bn: "ইউনিকোড অসমিয়া অক্ষরগুলো রেখেছে যে ব্লকে, তার নাম বাংলা। ৰ-এর নাম BENGALI LETTER RA WITH MIDDLE DIAGONAL, আর ৱ-এর BENGALI LETTER RA WITH LOWER DIAGONAL।"
      hi: "यूनिकोड ने असमिया अक्षरों को उस ब्लॉक में रखा है जिसे वह बांग्ला कहता है। ৰ का नाम BENGALI LETTER RA WITH MIDDLE DIAGONAL है, और ৱ का BENGALI LETTER RA WITH LOWER DIAGONAL।"
  - id: as-fact-007
    tags: [pronunciation]
    source: "https://en.wikipedia.org/wiki/Assamese_phonology"
    text:
      en: "স, শ and ষ, three letters for s and sh in Sanskrit, are all said x in Assamese: a rasp at the back of the mouth, like the ch of German 'Bach'. Few Indo-Aryan languages have this sound."
      bn: "সংস্কৃতের স, শ, ষ তিনটিই অসমিয়ায় উচ্চারিত হয় x হিসেবে: মুখের পেছনে একটা ঘর্ষণ ধ্বনি, জার্মান 'Bach'-এর ch-এর মতো। খুব কম ইন্দো-আর্য ভাষায় এই ধ্বনি আছে।"
      hi: "संस्कृत के स, श और ष, तीनों असमिया में x बोले जाते हैं: मुँह के पिछले हिस्से में एक घर्षण ध्वनि, जर्मन 'Bach' के ch जैसी। बहुत कम भारतीय-आर्य भाषाओं में यह ध्वनि है।"
  - id: as-fact-008
    tags: [pronunciation, script]
    text:
      en: "That x is why Assamese chat spells অসম, Assam, as Axom, and সপোন, a dream, as xopun."
      bn: "এই x-এর জন্যই অসমিয়া চ্যাটে অসম লেখা হয় Axom, আর সপোন (স্বপ্ন) লেখা হয় xopun।"
      hi: "इसी x के कारण असमिया चैट में অসম (असम) को Axom लिखा जाता है, और সপোন (सपना) को xopun।"
  - id: as-fact-009
    tags: [pronunciation]
    source: "https://en.wikipedia.org/wiki/Assamese_phonology"
    text:
      en: "Assamese says চ and ছ as s, not ch: চাহ, tea, is sah. And জ, ঝ and য are all said z, though chat writes them j: জল, water, is said zol."
      bn: "অসমিয়ায় চ আর ছ উচ্চারিত হয় s, ch নয়: চাহ (চা) হলো sah। আর জ, ঝ, য তিনটিই উচ্চারিত হয় z, যদিও চ্যাটে লেখা হয় j: জল-এর উচ্চারণ zol।"
      hi: "असमिया में চ और ছ को s बोला जाता है, ch नहीं: চাহ (चाय) sah है। और জ, ঝ, য तीनों z बोले जाते हैं, हालाँकि चैट में j लिखा जाता है: জল (जल) का उच्चारण zol है।"
  - id: as-fact-010
    tags: [pronunciation]
    source: "https://en.wikipedia.org/wiki/Assamese_phonology"
    text:
      en: "Unusually for an Indo-Aryan language, Assamese does not tell a dental t from a retroflex one: ত and ট are both said with the tongue on the ridge behind the teeth, as English t is."
      bn: "ইন্দো-আর্য ভাষার পক্ষে অস্বাভাবিকভাবে, অসমিয়ায় দন্ত্য ত আর মূর্ধন্য ট-এর তফাত নেই: ত আর ট দুটোই বলা হয় দাঁতের পেছনের মাড়িতে জিভ রেখে, ইংরেজি t-এর মতো।"
      hi: "भारतीय-आर्य भाषाओं में असामान्य रूप से, असमिया में दंत्य और मूर्धन्य t का भेद नहीं है: ত और ট दोनों दाँतों के पीछे के मसूड़े पर जीभ रखकर बोले जाते हैं, अंग्रेज़ी t की तरह।"
  - id: as-fact-011
    tags: [pronunciation]
    text:
      en: "Like Bengali, Assamese gives every consonant an open o, not an a: ক is ko. At the end of most words it falls silent: ঘৰ, house, is ghor."
      bn: "বাংলার মতো অসমিয়াতেও প্রতিটি ব্যঞ্জনের সঙ্গে থাকে খোলা অ, আ নয়: ক হলো ko। বেশির ভাগ শব্দের শেষে তা উচ্চারিত হয় না: ঘৰ (ঘর) হলো ghor।"
      hi: "बांग्ला की तरह असमिया में भी हर व्यंजन के साथ खुला ओ आता है, अ नहीं: ক को ko बोलते हैं। ज़्यादातर शब्दों के अंत में यह नहीं बोला जाता: ঘৰ (घर) ghor है।"
  - id: as-fact-012
    tags: [script]
    text:
      en: "Assamese writes an apostrophe inside a word to mark a closed o: ক'ত is kot, where, and ল'ৰা is lora, boy."
      bn: "অসমিয়ায় শব্দের ভেতরে একটা ঊর্ধ্বকমা দিয়ে বন্ধ ও বোঝানো হয়: ক'ত হলো kot (কোথায়), ল'ৰা হলো lora (ছেলে)।"
      hi: "असमिया में शब्द के भीतर एक अपॉस्ट्रॉफ़ी से बंद ओ दिखाया जाता है: ক'ত है kot (कहाँ), और ল'ৰা है lora (लड़का)।"
  - id: as-fact-013
    tags: [grammar]
    text:
      en: "Assamese verbs change for person and for respect, but not for number or gender: মই যাওঁ is I go, and আমি যাওঁ, we go, has the same verb."
      bn: "অসমিয়া ক্রিয়া পুরুষ আর সম্মান অনুযায়ী বদলায়, কিন্তু বচন বা লিঙ্গ অনুযায়ী নয়: মই যাওঁ (আমি যাই) আর আমি যাওঁ (আমরা যাই), ক্রিয়া একই।"
      hi: "असमिया क्रिया पुरुष और आदर के अनुसार बदलती है, पर वचन या लिंग के अनुसार नहीं: মই যাওঁ (मैं जाता हूँ) और আমি যাওঁ (हम जाते हैं) में क्रिया एक ही है।"
  - id: as-fact-014
    tags: [grammar]
    text:
      en: "Assamese has three words for you: তই for the very close, তুমি for friends and family, and আপুনি for elders and strangers. The verb changes with each."
      bn: "অসমিয়ায় 'তুমি'-র তিনটি শব্দ: খুব কাছের জনের জন্য তই, বন্ধু ও পরিবারের জন্য তুমি, আর বড়দের ও অচেনাদের জন্য আপুনি। প্রতিটির সঙ্গে ক্রিয়া বদলায়।"
      hi: "असमिया में 'तुम' के तीन शब्द हैं: बहुत क़रीबी के लिए তই, दोस्तों और परिवार के लिए তুমি, और बड़ों व अजनबियों के लिए আপুনি। हर एक के साथ क्रिया बदलती है।"
  - id: as-fact-015
    tags: [grammar]
    text:
      en: "Assamese has 'he' and 'she', সি and তাই, but no grammatical gender: verbs and describing words stay the same for a man, a woman or a thing."
      bn: "অসমিয়ায় 'সে' পুরুষ আর নারীর জন্য আলাদা, সি আর তাই, কিন্তু ব্যাকরণগত লিঙ্গ নেই: পুরুষ, নারী বা বস্তু, ক্রিয়া ও বিশেষণ একই থাকে।"
      hi: "असमिया में 'वह' पुरुष और स्त्री के लिए अलग हैं, সি और তাই, पर व्याकरणिक लिंग नहीं है: पुरुष हो, स्त्री या वस्तु, क्रिया और विशेषण एक जैसे रहते हैं।"
  - id: as-fact-016
    tags: [grammar, words]
    text:
      en: "Assamese kinship words change with whose relative it is: দেউতা is my father, দেউতাৰা your father, and দেউতাক his or her father."
      bn: "অসমিয়ায় আত্মীয়বাচক শব্দ বদলায় কার আত্মীয় তার ওপর: দেউতা মানে আমার বাবা, দেউতাৰা তোমার বাবা, আর দেউতাক তার বাবা।"
      hi: "असमिया में रिश्ते के शब्द इस पर बदलते हैं कि रिश्तेदार किसका है: দেউতা मेरे पिता, দেউতাৰা तुम्हारे पिता, और দেউতাক उसके पिता।"
  - id: as-fact-017
    tags: [grammar]
    text:
      en: "Assamese counts with classifiers, chosen by the kind of thing: এজন মানুহ, a man; এজনী ছোৱালী, a girl; এখন কিতাপ, a book; এটা আম, a mango."
      bn: "অসমিয়ায় গোনার সময় জিনিসের ধরন অনুযায়ী নির্দেশক বসে: এজন মানুহ (একজন মানুষ), এজনী ছোৱালী (একটি মেয়ে), এখন কিতাপ (একটি বই), এটা আম (একটি আম)।"
      hi: "असमिया में गिनती के समय चीज़ के प्रकार के अनुसार गणक शब्द लगता है: এজন মানুহ (एक आदमी), এজনী ছোৱালী (एक लड़की), এখন কিতাপ (एक किताब), এটা আম (एक आम)।"
  - id: as-fact-018
    tags: [grammar]
    text:
      en: "Assamese has no word for 'the': a classifier after the noun does the job. কিতাপখন is the book, and ল'ৰাটো the boy."
      bn: "অসমিয়ায় 'the'-এর আলাদা শব্দ নেই: বিশেষ্যের পরে নির্দেশকই সে কাজ করে। কিতাপখন মানে বইটা, ল'ৰাটো মানে ছেলেটা।"
      hi: "असमिया में 'the' के लिए अलग शब्द नहीं है: संज्ञा के बाद गणक शब्द यही काम करता है। কিতাপখন का अर्थ है वह किताब, और ল'ৰাটো वह लड़का।"
  - id: as-fact-019
    tags: [grammar]
    text:
      en: "In Assamese, 'not' is a prefix on the verb that echoes the verb's first vowel: কৰোঁ, I do, নকৰোঁ, I don't; জানো, I know, নাজানো, I don't know; দিওঁ, I give, নিদিওঁ, I don't give."
      bn: "অসমিয়ায় 'না' ক্রিয়ার আগে উপসর্গ হয়ে বসে, আর ক্রিয়ার প্রথম স্বরের সুর নেয়: কৰোঁ (করি), নকৰোঁ (করি না); জানো (জানি), নাজানো (জানি না); দিওঁ (দিই), নিদিওঁ (দিই না)।"
      hi: "असमिया में 'नहीं' क्रिया से पहले उपसर्ग बनकर लगता है और क्रिया के पहले स्वर की गूँज लेता है: কৰোঁ (करता हूँ), নকৰোঁ (नहीं करता); জানো (जानता हूँ), নাজানো (नहीं जानता); দিওঁ (देता हूँ), নিদিওঁ (नहीं देता)।"
  - id: as-fact-020
    tags: [grammar]
    text:
      en: "A yes-or-no question in Assamese often ends in নেকি: আপুনি অসমীয়া জানে নেকি? Do you know Assamese?"
      bn: "অসমিয়ায় হ্যাঁ-না প্রশ্নের শেষে প্রায়ই বসে নেকি: আপুনি অসমীয়া জানে নেকি? আপনি কি অসমিয়া জানেন?"
      hi: "असमिया में हाँ-ना वाले प्रश्न के अंत में अक्सर নেকি आता है: আপুনি অসমীয়া জানে নেকি? क्या आप असमिया जानते हैं?"
  - id: as-fact-021
    tags: [grammar]
    text:
      en: "Assamese marks the doer of a verb that has an object with -এ: মামণিয়ে মাছ কিনে, Mamoni buys fish. With no object there is no -এ: মামণি যায়, Mamoni goes."
      bn: "অসমিয়ায় সকর্মক ক্রিয়ার কর্তার সঙ্গে -এ বসে: মামণিয়ে মাছ কিনে (মামণি মাছ কেনে)। কর্ম না থাকলে -এ নেই: মামণি যায় (মামণি যায়)।"
      hi: "असमिया में सकर्मक क्रिया के कर्ता के साथ -এ लगता है: মামণিয়ে মাছ কিনে (मामणि मछली ख़रीदती है)। कर्म न हो तो -এ नहीं लगता: মামণি যায় (मामणि जाती है)।"
  - id: as-fact-022
    tags: [words]
    text:
      en: "Assamese has one word for yesterday, কালি, and another for tomorrow, কাইলৈ, where Hindi and Bengali use one word for both."
      bn: "অসমিয়ায় গতকালের জন্য একটি শব্দ, কালি, আর আগামীকালের জন্য আরেকটি, কাইলৈ; হিন্দি আর বাংলায় দুটোর জন্য একই শব্দ।"
      hi: "असमिया में बीते कल के लिए एक शब्द है, কালি, और आने वाले कल के लिए दूसरा, কাইলৈ; हिंदी और बांग्ला में दोनों के लिए एक ही शब्द है।"
  - id: as-fact-023
    tags: [words]
    text:
      en: "Assamese eats its drinks: খোৱা, to eat, is also to drink water or tea, and even to smoke."
      bn: "অসমিয়ায় পানীয়ও 'খাওয়া' হয়: খোৱা মানে খাওয়া, আবার জল বা চা পান করা, এমনকি ধূমপান করাও।"
      hi: "असमिया में पेय भी 'खाए' जाते हैं: খোৱা का अर्थ खाना है, और पानी या चाय पीना भी, यहाँ तक कि धूम्रपान करना भी।"
  - id: as-fact-024
    tags: [words, history]
    source: "https://en.wikipedia.org/wiki/Assamese_language"
    text:
      en: "Assamese has taken many words from the Tibeto-Burman languages around it, such as Bodo, and from Tai, the language of the Ahoms."
      bn: "অসমিয়া আশপাশের তিব্বতি-বর্মি ভাষা, যেমন বোড়ো, আর আহোমদের ভাষা তাই থেকে বহু শব্দ নিয়েছে।"
      hi: "असमिया ने आसपास की तिब्बती-बर्मी भाषाओं, जैसे बोडो, और अहोमों की भाषा ताई से बहुत से शब्द लिए हैं।"
  - id: as-fact-025
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Ahom_kingdom"
    text:
      en: "The Ahoms, a Tai people who came from the east, ruled Assam for almost 600 years, from 1228 to 1826, and over time came to speak Assamese."
      bn: "আহোমরা, পূর্ব দিক থেকে আসা এক তাই জাতি, ১২২৮ থেকে ১৮২৬ পর্যন্ত প্রায় ৬০০ বছর অসম শাসন করে, আর কালক্রমে অসমিয়া ভাষা গ্রহণ করে।"
      hi: "अहोम, पूर्व से आए एक ताई लोग, 1228 से 1826 तक लगभग 600 वर्ष असम पर राज करते रहे, और समय के साथ असमिया बोलने लगे।"
  - id: as-fact-026
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Buranji"
    text:
      en: "The Ahom court kept chronicles called বুৰঞ্জী, at first in Tai and later in Assamese: an early tradition of history written in prose in India."
      bn: "আহোম রাজদরবারে বুৰঞ্জী নামের ইতিবৃত্ত লেখা হত, প্রথমে তাই ভাষায়, পরে অসমিয়ায়: ভারতে গদ্যে লেখা ইতিহাসের এক প্রাচীন ধারা।"
      hi: "अहोम दरबार में বুৰঞ্জী नाम के इतिवृत्त लिखे जाते थे, पहले ताई में और बाद में असमिया में: भारत में गद्य में लिखे इतिहास की एक प्राचीन परंपरा।"
  - id: as-fact-027
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Saptakanda_Ramayana"
    text:
      en: "Madhav Kandali's Assamese Ramayana, from the 14th century, is one of the earliest translations of Valmiki's Ramayana into a modern Indian language."
      bn: "চতুর্দশ শতকে মাধব কন্দলীর অসমিয়া রামায়ণ বাল্মীকি রামায়ণের আধুনিক ভারতীয় ভাষায় প্রথম দিকের অনুবাদগুলোর একটি।"
      hi: "14वीं सदी में माधव कंदली की असमिया रामायण, वाल्मीकि रामायण के किसी आधुनिक भारतीय भाषा में सबसे पुराने अनुवादों में से एक है।"
  - id: as-fact-028
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Sankardev"
    text:
      en: "Srimanta Sankardev (1449–1568) wrote devotional songs, the বৰগীত, and plays, the অংকীয়া নাট, in Brajavali, a literary language that blends Assamese with Maithili."
      bn: "শ্রীমন্ত শংকরদেব (১৪৪৯–১৫৬৮) ব্রজাবলিতে ভক্তিগীত বৰগীত আর নাটক অংকীয়া নাট রচনা করেন; ব্রজাবলি অসমিয়া আর মৈথিলী মেশানো এক সাহিত্যিক ভাষা।"
      hi: "श्रीमंत शंकरदेव (1449–1568) ने ब्रजावली में भक्ति गीत বৰগীত और नाटक অংকীয়া নাট रचे; ब्रजावली असमिया और मैथिली को मिलाने वाली एक साहित्यिक भाषा है।"
  - id: as-fact-029
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Assamese_language"
    text:
      en: "From 1836 to 1873 the British made Bengali the language of Assam's schools and courts. Assamese was restored in 1873."
      bn: "১৮৩৬ থেকে ১৮৭৩ পর্যন্ত ব্রিটিশরা অসমের স্কুল আর আদালতের ভাষা করেছিল বাংলা। ১৮৭৩ সালে অসমিয়া আবার ফিরে আসে।"
      hi: "1836 से 1873 तक अंग्रेज़ों ने असम के स्कूलों और अदालतों की भाषा बांग्ला कर दी थी। 1873 में असमिया को फिर से बहाल किया गया।"
  - id: as-fact-030
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Orunodoi"
    text:
      en: "The first Assamese magazine, অৰুণোদই (Orunodoi), was printed by American Baptist missionaries in Sivasagar from 1846. Standard Assamese grew from the speech of that eastern part of Assam."
      bn: "প্রথম অসমিয়া পত্রিকা অৰুণোদই ১৮৪৬ থেকে শিবসাগরে আমেরিকান ব্যাপটিস্ট মিশনারিরা ছাপতেন। প্রমিত অসমিয়া গড়ে উঠেছে অসমের সেই পূর্বাঞ্চলের কথ্য ভাষা থেকে।"
      hi: "पहली असमिया पत्रिका অৰুণোদই 1846 से शिवसागर में अमेरिकी बैप्टिस्ट मिशनरी छापते थे। मानक असमिया असम के उसी पूर्वी भाग की बोली से विकसित हुई।"
  - id: as-fact-031
    tags: [history, script]
    source: "https://en.wikipedia.org/wiki/Hemkosh"
    text:
      en: "Hemchandra Barua's dictionary হেমকোষ (Hemkosh), published in 1900, set the standard for Assamese spelling, which follows the Sanskrit origin of words rather than their sound."
      bn: "হেমচন্দ্র বরুয়ার অভিধান হেমকোষ, ১৯০০ সালে প্রকাশিত, অসমিয়া বানানের মান ঠিক করে দেয়; সে বানান শব্দের ধ্বনি নয়, সংস্কৃত উৎস অনুসরণ করে।"
      hi: "हेमचंद्र बरुआ का शब्दकोश হেমকোষ (हेमकोष), 1900 में प्रकाशित, असमिया वर्तनी का मानक बना; यह वर्तनी शब्द की ध्वनि के बजाय उसके संस्कृत मूल का पालन करती है।"
  - id: as-fact-032
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Asam_Sahitya_Sabha"
    text:
      en: "অসম সাহিত্য সভা, the Assam Literary Society, founded in 1917, looks after the Assamese language and its literature."
      bn: "১৯১৭ সালে প্রতিষ্ঠিত অসম সাহিত্য সভা অসমিয়া ভাষা ও সাহিত্যের দেখভাল করে।"
      hi: "1917 में स्थापित অসম সাহিত্য সভা (असम साहित्य सभा) असमिया भाषा और साहित्य की देखरेख करती है।"
  - id: as-fact-033
    tags: [history, words]
    source: "https://en.wikipedia.org/wiki/Nagamese_Creole"
    text:
      en: "Nagamese, the everyday common language of Nagaland, where dozens of languages are spoken, is a creole built on Assamese."
      bn: "নাগাল্যান্ডে কয়েক ডজন ভাষা বলা হয়; সেখানকার রোজকার সাধারণ ভাষা নাগামিজ অসমিয়ার ওপর গড়ে ওঠা এক ক্রেওল।"
      hi: "नगालैंड में दर्जनों भाषाएँ बोली जाती हैं; वहाँ की रोज़मर्रा की साझा भाषा नागामीज़ असमिया पर आधारित एक क्रियोल है।"
  - id: as-fact-034
    tags: [numbers, script]
    text:
      en: "Assamese writes the same digits as Bengali: ১, ২, ৩. Watch ৪, which is 4 though it looks like an 8, and ৮, which is 8."
      bn: "অসমিয়া আর বাংলার অঙ্ক একই: ১, ২, ৩। খেয়াল রাখুন, ৪ মানে চার, যদিও দেখতে 8-এর মতো, আর ৮ মানে আট।"
      hi: "असमिया के अंक बांग्ला जैसे ही हैं: ১, ২, ৩। ध्यान रहे, ৪ का अर्थ 4 है, भले ही वह 8 जैसा दिखे, और ৮ का अर्थ 8 है।"
  - id: as-fact-035
    tags: [script, words]
    text:
      en: "Assamese spells English words with its own letters: s as চ or ছ, st as ষ্ট, v as ভ. So bus is বাছ, station ষ্টেচন, and driver ড্ৰাইভাৰ."
      bn: "অসমিয়া ইংরেজি শব্দ নিজের অক্ষরে লেখে: s হয় চ বা ছ, st হয় ষ্ট, v হয় ভ। তাই bus হলো বাছ, station ষ্টেচন, আর driver ড্ৰাইভাৰ।"
      hi: "असमिया अंग्रेज़ी शब्द अपने अक्षरों में लिखती है: s को চ या ছ, st को ষ্ট, v को ভ। इसलिए bus है বাছ, station ষ্টেচন, और driver ড্ৰাইভাৰ।"
  - id: as-fact-036
    tags: [words]
    source: "https://en.wikipedia.org/wiki/Bihu"
    text:
      en: "Bihu, Assam's festival, comes three times a year: ব'হাগ বিহু in mid-April brings in the Assamese new year, মাঘ বিহু in January follows the harvest, and কাতি বিহু in October."
      bn: "অসমের উৎসব বিহু বছরে তিনবার আসে: এপ্রিলের মাঝামাঝি ব'হাগ বিহু অসমিয়া নববর্ষ আনে, জানুয়ারিতে মাঘ বিহু ফসল তোলার পরে, আর অক্টোবরে কাতি বিহু।"
      hi: "असम का त्योहार बिहू साल में तीन बार आता है: अप्रैल के मध्य में ব'হাগ বিহু असमिया नया साल लाता है, जनवरी में মাঘ বিহু फ़सल कटने के बाद, और अक्टूबर में কাতি বিহু।"
  - id: as-fact-101
    contrast: en
    tags: [pronunciation]
    text:
      en: "English has no x sound. To make it, start a k, but don't let the tongue quite touch the roof of the mouth: the air rasps through, as in Scottish 'loch'. সাত (xat) is seven; হাত (hat), with an English h, is a hand."
  - id: as-fact-102
    contrast: en
    tags: [pronunciation]
    text:
      en: "Good news for English speakers: Assamese t and d are said where English says them, behind the teeth, for both ত and ট. Hindi and Bengali make you learn two."
  - id: as-fact-103
    contrast: bn
    tags: [words]
    text:
      en: "Bengali কাল means both yesterday and tomorrow. Assamese has two words: কালি, yesterday, and কাইলৈ, tomorrow."
      bn: "বাংলায় 'কাল' মানে গতকাল আর আগামীকাল দুটোই। অসমিয়ায় দুটি আলাদা শব্দ: কালি মানে গতকাল, কাইলৈ মানে আগামীকাল।"
  - id: as-fact-104
    contrast: bn
    tags: [words, pitfall]
    text:
      en: "Careful, Bengali speakers: বিষ in Assamese is pain, not poison. মূৰৰ বিষ is a headache."
      bn: "সাবধান: অসমিয়ায় বিষ মানে ব্যথা, গরল নয়। মূৰৰ বিষ মানে মাথাব্যথা।"
  - id: as-fact-105
    contrast: bn
    tags: [pronunciation]
    text:
      en: "Where Bengali says শ as sh, Assamese says x: Bengali দেশ is desh, Assamese দেশ is dex."
      bn: "বাংলায় শ উচ্চারণ হয় শ-এর মতো, অসমিয়ায় x: বাংলায় দেশ 'দেশ', অসমিয়ায় দেশ 'dex'।"
  - id: as-fact-106
    contrast: bn
    tags: [script]
    text:
      en: "Typing Assamese on a Bengali keyboard gives র where ৰ belongs. To an Assamese reader, ঘর looks like a misprint for ঘৰ."
      bn: "বাংলা কি-বোর্ডে অসমিয়া টাইপ করলে ৰ-এর জায়গায় আসে র। অসমিয়া পাঠকের চোখে ঘর যেন ঘৰ-এর ছাপার ভুল।"
  - id: as-fact-107
    contrast: hi
    tags: [grammar]
    text:
      en: "Hindi verbs show gender: वह जाता है, वह जाती है. Assamese verbs never do: সি যায়, he goes, and তাই যায়, she goes."
      hi: "हिंदी की क्रिया लिंग दिखाती है: वह जाता है, वह जाती है। असमिया की क्रिया कभी नहीं: সি যায় (वह जाता है), তাই যায় (वह जाती है)।"
  - id: as-fact-108
    contrast: hi
    tags: [pronunciation]
    text:
      en: "Assamese জ is the z of Hindi ज़, not ज: জল, water, is said zol, and জোন, the moon, zun."
      hi: "असमिया জ हिंदी के ज़ जैसा है, ज जैसा नहीं: জল (पानी) को ज़ोल और জোন (चाँद) को ज़ुन बोलते हैं।"
