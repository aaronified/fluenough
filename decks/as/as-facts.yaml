description: "One true, surprising thing about Assamese a day, in English, Bengali and Hindi. Not yet checked by an Assamese speaker: please report any mistake."
facts:
  - id: as-fact-001
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Assamese_language"
    text:
      en: "Assamese is the easternmost of the Indo-Aryan languages. With Bengali and Odia it descends from the Magadhi Prakrit of ancient eastern India."
      bn: "ইন্দো-আর্য ভাষাগুলোর মধ্যে অসমিয়া সবচেয়ে পূর্বদিকের। বাংলা ও ওড়িয়ার মতো এটিও প্রাচীন পূর্ব ভারতের মাগধী প্রাকৃত থেকে এসেছে।"
      hi: "भारतीय-आर्य भाषाओं में असमिया सबसे पूर्वी भाषा है। बांग्ला और ओड़िया की तरह यह भी प्राचीन पूर्वी भारत की मागधी प्राकृत से निकली है।"
  - id: as-fact-002
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Assamese_language"
    text:
      en: "About 15 million people speak Assamese as their first language, nearly all of them in Assam, and many more speak it as a second language across the Northeast."
      bn: "প্রায় দেড় কোটি মানুষের মাতৃভাষা অসমিয়া; তাঁদের প্রায় সবাই অসমে বাস করেন। উত্তর-পূর্ব ভারতের আরও বহু মানুষ এটি দ্বিতীয় ভাষা হিসেবে বলেন।"
      hi: "लगभग डेढ़ करोड़ लोगों की मातृभाषा असमिया है, जिनमें से लगभग सभी असम में रहते हैं; पूर्वोत्तर के और भी बहुत-से लोग इसे दूसरी भाषा के तौर पर बोलते हैं।"
  - id: as-fact-003
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Eighth_Schedule_to_the_Constitution_of_India"
    text:
      en: "Assamese is the official language of Assam and one of the 22 languages listed in the Eighth Schedule of India's Constitution."
      bn: "অসমিয়া অসমের সরকারি ভাষা, এবং ভারতের সংবিধানের অষ্টম তফসিলভুক্ত ২২টি ভাষার একটি।"
      hi: "असमिया असम की राजभाषा है और भारत के संविधान की आठवीं अनुसूची में शामिल 22 भाषाओं में से एक है।"
  - id: as-fact-004
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Classical_languages_of_India"
    text:
      en: "In October 2024 India declared Assamese a classical language, together with Bengali, Marathi, Pali and Prakrit."
      bn: "২০২৪ সালের অক্টোবরে ভারত বাংলা, মারাঠি, পালি ও প্রাকৃতের সঙ্গে অসমিয়াকেও ধ্রুপদী ভাষার মর্যাদা দেয়।"
      hi: "अक्टूबर 2024 में भारत ने बांग्ला, मराठी, पालि और प्राकृत के साथ असमिया को भी शास्त्रीय भाषा का दर्जा दिया।"
  - id: as-fact-005
    tags: [script]
    text:
      en: "Assamese and Bengali share one script, but Assamese has two letters of its own: ৰ (rô) for r, where Bengali writes র (rô), and ৱ (wô) for w, which Bengali lacks."
      bn: "অসমিয়া ও বাংলা একই লিপিতে লেখা হয়, তবে অসমিয়ার নিজস্ব দুটি অক্ষর আছে: r-এর জন্য ৰ, যেখানে বাংলায় লেখা হয় র; আর w-এর জন্য ৱ, যা বাংলায় নেই।"
      hi: "असमिया और बांग्ला एक ही लिपि में लिखी जाती हैं, पर असमिया के अपने दो अक्षर हैं: r के लिए ৰ (rô), जहाँ बांग्ला में র (rô) लिखा जाता है, और w के लिए ৱ (wô), जो बांग्ला में है ही नहीं।"
  - id: as-fact-006
    tags: [script]
    source: "https://www.unicode.org/charts/PDF/U0980.pdf"
    text:
      en: "Unicode puts Assamese letters in the block it calls Bengali. ৰ (rô) is named BENGALI LETTER RA WITH MIDDLE DIAGONAL, and ৱ (wô) BENGALI LETTER RA WITH LOWER DIAGONAL."
      bn: "ইউনিকোডে অসমিয়া অক্ষরগুলো যে ব্লকে রাখা হয়েছে, তার নাম 'বাংলা'। ৰ-এর নাম BENGALI LETTER RA WITH MIDDLE DIAGONAL, আর ৱ-এর নাম BENGALI LETTER RA WITH LOWER DIAGONAL।"
      hi: "यूनिकोड में असमिया अक्षर उस ब्लॉक में रखे गए हैं जिसका नाम 'बांग्ला' है। ৰ (rô) का नाम BENGALI LETTER RA WITH MIDDLE DIAGONAL है, और ৱ (wô) का BENGALI LETTER RA WITH LOWER DIAGONAL।"
  - id: as-fact-007
    tags: [pronunciation]
    source: "https://en.wikipedia.org/wiki/Assamese_phonology"
    text:
      en: "স (xô), শ (xô) and ষ (xô), three letters for s and sh in Sanskrit, are all said x in Assamese: a rasp at the back of the mouth, like the ch of German 'Bach'. Few Indo-Aryan languages have this sound."
      bn: "সংস্কৃতের স, শ, ষ, তিনটিই অসমিয়ায় x-এর মতো উচ্চারিত হয়: মুখের পেছন দিকের একটি ঘর্ষণ ধ্বনি, জার্মান 'Bach'-এর ch-এর মতো। খুব কম ইন্দো-আর্য ভাষাতেই এই ধ্বনি আছে।"
      hi: "संस्कृत के स, श और ष, तीनों असमिया में x की तरह बोले जाते हैं: मुँह के पिछले हिस्से की एक घर्षण ध्वनि, जर्मन 'Bach' के ch जैसी। बहुत कम भारतीय-आर्य भाषाओं में यह ध्वनि मिलती है।"
  - id: as-fact-008
    tags: [pronunciation, script]
    text:
      en: "That x is why Assamese chat spells অসম (ôxôm), Assam, as Axom, and সপোন (sôpun), a dream, as xopun."
      bn: "এই x-এর জন্যই অসমিয়া চ্যাটে অসম লেখা হয় Axom, আর সপোন (স্বপ্ন) লেখা হয় xopun।"
      hi: "इसी x की वजह से असमिया चैट में অসম (असम) Axom लिखा जाता है, और সপোন (सपना) xopun।"
  - id: as-fact-009
    tags: [pronunciation]
    source: "https://en.wikipedia.org/wiki/Assamese_phonology"
    text:
      en: "Assamese says চ (sô) and ছ (sô) as s, not ch: চাহ (sāh), tea, is sah. And জ (zô), ঝ (zô) and য (zô) are all said z, though chat writes them j: জল (zôl), water, is said zol."
      bn: "অসমিয়ায় চ আর ছ উচ্চারিত হয় s-এর মতো, ch-এর মতো নয়: চাহ (চা) উচ্চারিত হয় sah। আবার জ, ঝ ও য তিনটিই উচ্চারিত হয় z-এর মতো, যদিও চ্যাটে j লেখা হয়: জল-এর উচ্চারণ zol।"
      hi: "असमिया में চ (sô) और ছ (sô) का उच्चारण s जैसा होता है, ch जैसा नहीं: চাহ (चाय) sah है। और জ (zô), ঝ (zô), য (zô) तीनों z बोले जाते हैं, हालाँकि चैट में j लिखा जाता है: জল (जल) का उच्चारण zol है।"
  - id: as-fact-010
    tags: [pronunciation]
    source: "https://en.wikipedia.org/wiki/Assamese_phonology"
    text:
      en: "Unusually for an Indo-Aryan language, Assamese does not tell a dental t from a retroflex one: ত (tô) and ট (tô) are both said with the tongue on the ridge behind the teeth, as English t is."
      bn: "ইন্দো-আর্য ভাষার পক্ষে যা অস্বাভাবিক, অসমিয়ায় দন্ত্য ত আর মূর্ধন্য ট-এর মধ্যে কোনো তফাত নেই: ত ও ট দুটিই বলা হয় দাঁতের পেছনের মাড়িতে জিভ ঠেকিয়ে, ইংরেজি t-এর মতো।"
      hi: "भारतीय-आर्य भाषाओं के लिहाज़ से असामान्य बात यह है कि असमिया में दंत्य और मूर्धन्य t का भेद नहीं है: ত (tô) और ট (tô) दोनों दाँतों के पीछे के मसूड़े पर जीभ रखकर बोले जाते हैं, अंग्रेज़ी के t की तरह।"
  - id: as-fact-011
    tags: [pronunciation]
    text:
      en: "Like Bengali, Assamese gives every consonant an open o, not an a: ক (kô) is ko. At the end of most words it falls silent: ঘৰ (ghôr), house, is ghor."
      bn: "বাংলার মতো অসমিয়াতেও প্রতিটি ব্যঞ্জনের সঙ্গে জড়িয়ে থাকে একটি 'ও'-ঘেঁষা অন্তর্নিহিত স্বর, 'আ' নয়: ক-কে বলা হয় ko। বেশিরভাগ শব্দের শেষে সেটি উচ্চারিত হয় না: ঘৰ (ঘর) হলো ghor।"
      hi: "बांग्ला की तरह असमिया में भी हर व्यंजन के साथ खुला 'ओ' जैसा स्वर जुड़ा रहता है, 'अ' जैसा नहीं: ক (kô) को ko बोला जाता है। ज़्यादातर शब्दों के अंत में यह बोला नहीं जाता: ঘৰ (घर) ghor है।"
  - id: as-fact-012
    tags: [script]
    text:
      en: "Assamese writes an apostrophe inside a word to mark a closed o: ক (kô)'ত (tô) is kot, where, and ল (lô)'ৰা (rā) is lora, boy."
      bn: "অসমিয়ায় শব্দের ভেতরে একটি ঊর্ধ্বকমা (') বন্ধ 'ও' ধ্বনি বোঝায়: ক'ত হলো kot (কোথায়), ল'ৰা হলো lora (ছেলে)।"
      hi: "असमिया में शब्द के भीतर एक अपॉस्ट्रॉफ़ी (') बंद 'ओ' ध्वनि दिखाती है: ক (kô)'ত (tô) kot (कहाँ) है, और ল (lô)'ৰা (rā) lora (लड़का)।"
  - id: as-fact-013
    tags: [grammar]
    text:
      en: "Assamese verbs change for person and for respect, but not for number or gender: মই যাওঁ (moi zāum̐) is I go, and আমি যাওঁ (āmi zāum̐), we go, has the same verb."
      bn: "অসমিয়া ক্রিয়া পুরুষ ও সম্মান অনুযায়ী বদলায়, কিন্তু বচন বা লিঙ্গ অনুযায়ী বদলায় না: মই যাওঁ (আমি যাই) আর আমি যাওঁ (আমরা যাই), দুটোতেই ক্রিয়া একই।"
      hi: "असमिया क्रिया पुरुष और आदर के अनुसार बदलती है, पर वचन या लिंग के अनुसार नहीं: মই যাওঁ (मैं जाता हूँ) और আমি যাওঁ (हम जाते हैं) में क्रिया वही रहती है।"
  - id: as-fact-014
    tags: [grammar]
    text:
      en: "Assamese has three words for you: তই (toi) for the very close, তুমি (tumi) for friends and family, and আপুনি (āpuni) for elders and strangers. The verb changes with each."
      bn: "সম্বোধনের জন্য অসমিয়ায় তিনটি শব্দ আছে: খুব কাছের জনের জন্য তই, বন্ধু ও পরিবারের জন্য তুমি, আর বড়দের ও অচেনাদের জন্য আপুনি। প্রতিটির সঙ্গে ক্রিয়ার রূপও বদলায়।"
      hi: "असमिया में संबोधन के लिए तीन शब्द हैं: बहुत क़रीबी के लिए তই (toi), दोस्तों और परिवार के लिए তুমি (tumi), और बड़ों व अजनबियों के लिए আপুনি (āpuni)। हर एक के साथ क्रिया का रूप भी बदलता है।"
  - id: as-fact-015
    tags: [grammar]
    text:
      en: "Assamese has 'he' and 'she', সি (si) and তাই (tāi), but no grammatical gender: verbs and describing words stay the same for a man, a woman or a thing."
      bn: "অসমিয়ায় 'সে' বলতে পুরুষ ও নারীর জন্য আলাদা শব্দ আছে, সি আর তাই, তবু ব্যাকরণগত লিঙ্গ নেই: পুরুষ, নারী বা বস্তু যা-ই হোক, ক্রিয়া ও বিশেষণ একই থাকে।"
      hi: "असमिया में 'वह' के लिए पुरुष और स्त्री के अलग शब्द हैं, সি (si) और তাই (tāi), फिर भी व्याकरणिक लिंग नहीं है: पुरुष हो, स्त्री या वस्तु, क्रिया और विशेषण वही रहते हैं।"
  - id: as-fact-016
    tags: [grammar, words]
    text:
      en: "Assamese kinship words change with whose relative it is: দেউতা (deutā) is my father, দেউতাৰা (deutārā) your father, and দেউতাক (deutāk) his or her father."
      bn: "অসমিয়ায় আত্মীয়বাচক শব্দের রূপ বদলায় কার আত্মীয় তার ওপর নির্ভর করে: দেউতা মানে আমার বাবা, দেউতাৰা মানে তোমার বাবা, আর দেউতাক মানে তার বাবা।"
      hi: "असमिया में रिश्ते के शब्द का रूप इस पर निर्भर करता है कि रिश्तेदार किसका है: দেউতা (deutā) यानी मेरे पिता, দেউতাৰা (deutārā) यानी तुम्हारे पिता, और দেউতাক (deutāk) यानी उसके पिता।"
  - id: as-fact-017
    tags: [grammar]
    text:
      en: "Assamese counts with classifiers, chosen by the kind of thing: এজন মানুহ (ezôn mānuh), a man; এজনী ছোৱালী (ezoni suwāli), a girl; এখন কিতাপ (ekhôn kitāp), a book; এটা আম (etā ām), a mango."
      bn: "অসমিয়ায় গোনার সময় জিনিসের ধরন অনুযায়ী আলাদা নির্দেশক বসে: এজন মানুহ (একজন মানুষ), এজনী ছোৱালী (একটি মেয়ে), এখন কিতাপ (একটি বই), এটা আম (একটি আম)।"
      hi: "असमिया में गिनती के समय चीज़ के प्रकार के हिसाब से अलग विशेष शब्द लगता है: এজন মানুহ (एक आदमी), এজনী ছোৱালী (एक लड़की), এখন কিতাপ (एक किताब), এটা আম (एक आम)।"
  - id: as-fact-018
    tags: [grammar]
    text:
      en: "Assamese has no word for 'the': a classifier after the noun does the job. কিতাপখন (kitāpkhôn) is the book, and ল (lô)'ৰাটো (rātu) the boy."
      bn: "অসমিয়ায় 'the'-এর জন্য আলাদা শব্দ নেই; বিশেষ্যের পরে বসা নির্দেশকই সে কাজ করে। কিতাপখন মানে 'বইটা', ল'ৰাটো মানে 'ছেলেটা'।"
      hi: "असमिया में 'the' के लिए कोई अलग शब्द नहीं है: संज्ञा के बाद लगने वाला ऐसा विशेष शब्द ही यह काम करता है। কিতাপখন (kitāpkhôn) का अर्थ है 'वह किताब', और ল (lô)'ৰাটো (rātu) 'वह लड़का'।"
  - id: as-fact-019
    tags: [grammar]
    text:
      en: "In Assamese, 'not' is a prefix on the verb that echoes the verb's first vowel: কৰোঁ (kôrum̐), I do, নকৰোঁ (nôkôrum̐), I don't; জানো (zānu), I know, নাজানো (nāzānu), I don't know; দিওঁ (dium̐), I give, নিদিওঁ (nidium̐), I don't give."
      bn: "অসমিয়ায় নঞর্থক 'না' ক্রিয়ার আগে উপসর্গ হয়ে বসে এবং ক্রিয়ার প্রথম স্বরের সুর নেয়: কৰোঁ (করি), নকৰোঁ (করি না); জানো (জানি), নাজানো (জানি না); দিওঁ (দিই), নিদিওঁ (দিই না)।"
      hi: "असमिया में 'नहीं' क्रिया से पहले उपसर्ग के रूप में लगता है और क्रिया के पहले स्वर के अनुरूप ढल जाता है: কৰোঁ (करता हूँ), নকৰোঁ (नहीं करता); জানো (जानता हूँ), নাজানো (नहीं जानता); দিওঁ (देता हूँ), নিদিওঁ (नहीं देता)।"
  - id: as-fact-020
    tags: [grammar]
    text:
      en: "A yes-or-no question in Assamese often ends in নেকি (neki): আপুনি অসমীয়া জানে নেকি (āpuni ôxomiyā zāne neki)? Do you know Assamese?"
      bn: "অসমিয়ায় হ্যাঁ-না প্রশ্নের শেষে প্রায়ই নেকি বসে: আপুনি অসমীয়া জানে নেকি? অর্থাৎ 'আপনি কি অসমিয়া জানেন?'"
      hi: "असमिया में हाँ-या-ना वाले प्रश्न के अंत में अक्सर নেকি (neki) लगता है: আপুনি অসমীয়া জানে নেকি (āpuni ôxomiyā zāne neki)? यानी 'क्या आप असमिया जानते हैं?'"
  - id: as-fact-021
    tags: [grammar]
    text:
      en: "Assamese marks the doer of a verb that has an object with -এ (-e): মামণিয়ে মাছ কিনে (māmoniye mās kine), Mamoni buys fish. With no object there is no -এ (-e): মামণি যায় (māmoni zāy), Mamoni goes."
      bn: "অসমিয়ায় সকর্মক ক্রিয়ার কর্তার সঙ্গে -এ যুক্ত হয়: মামণিয়ে মাছ কিনে (মামণি মাছ কেনে)। কর্ম না থাকলে -এ বসে না: মামণি যায় (মামণি যায়)।"
      hi: "असमिया में सकर्मक क्रिया के कर्ता के साथ -এ (-e) जुड़ता है: মামণিয়ে মাছ কিনে (मामणि मछली ख़रीदती है)। कर्म न हो तो -এ (-e) नहीं जुड़ता: মামণি যায় (मामणि जाती है)।"
  - id: as-fact-022
    tags: [words]
    text:
      en: "Assamese has one word for yesterday, কালি (kāli), and another for tomorrow, কাইলৈ (kāilôi), where Hindi and Bengali use one word for both."
      bn: "অসমিয়ায় গতকালের জন্য এক শব্দ, কালি, আর আগামীকালের জন্য আরেক শব্দ, কাইলৈ; হিন্দি আর বাংলায় দুটোর জন্যই একই শব্দ।"
      hi: "असमिया में बीते कल के लिए एक शब्द है, কালি (kāli), और आने वाले कल के लिए दूसरा, কাইলৈ (kāilôi); हिंदी और बांग्ला में दोनों के लिए एक ही शब्द चलता है।"
  - id: as-fact-023
    tags: [words]
    text:
      en: "Assamese eats its drinks: খোৱা (khuwā), to eat, is also to drink water or tea, and even to smoke."
      bn: "অসমিয়ায় পানীয়ও 'খাওয়া' হয়: খোৱা মানে শুধু খাওয়া নয়, জল বা চা পান করা, এমনকি ধূমপান করাও।"
      hi: "असमिया में पेय पदार्थ भी 'खाए' जाते हैं: খোৱা (khuwā) का अर्थ केवल खाना नहीं, पानी या चाय पीना और यहाँ तक कि धूम्रपान करना भी है।"
  - id: as-fact-024
    tags: [words, history]
    source: "https://en.wikipedia.org/wiki/Assamese_language"
    text:
      en: "Assamese has taken many words from the Tibeto-Burman languages around it, such as Bodo, and from Tai, the language of the Ahoms."
      bn: "অসমিয়া আশপাশের তিব্বতি-বর্মি ভাষা, যেমন বোড়ো, এবং আহোমদের ভাষা তাই থেকে বহু শব্দ নিয়েছে।"
      hi: "असमिया ने आसपास की तिब्बती-बर्मी भाषाओं, जैसे बोडो, और अहोमों की भाषा ताई से बहुत-से शब्द लिए हैं।"
  - id: as-fact-025
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Ahom_kingdom"
    text:
      en: "The Ahoms, a Tai people who came from the east, ruled Assam for almost 600 years, from 1228 to 1826, and over time came to speak Assamese."
      bn: "আহোমরা, পূর্ব দিক থেকে আসা এক তাই জনগোষ্ঠী, ১২২৮ থেকে ১৮২৬ সাল পর্যন্ত প্রায় ৬০০ বছর অসম শাসন করে, আর ধীরে ধীরে অসমিয়া ভাষা গ্রহণ করে নেয়।"
      hi: "अहोम, पूर्व से आया एक ताई समुदाय, 1228 से 1826 तक लगभग 600 वर्ष असम पर शासन करता रहा, और धीरे-धीरे असमिया भाषा अपना ली।"
  - id: as-fact-026
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Buranji"
    text:
      en: "The Ahom court kept chronicles called বুৰঞ্জী (buronzi), at first in Tai and later in Assamese: an early tradition of history written in prose in India."
      bn: "আহোম রাজদরবারে বুৰঞ্জী নামে ইতিবৃত্ত লেখা হতো, প্রথমে তাই ভাষায়, পরে অসমিয়ায়: ভারতে গদ্যে লেখা ইতিহাসের এক প্রাচীন ধারা।"
      hi: "अहोम दरबार में বুৰঞ্জী (buronzi) नाम के इतिवृत्त लिखे जाते थे, पहले ताई भाषा में और फिर असमिया में: यह भारत में गद्य-इतिहास लेखन की एक प्राचीन परंपरा है।"
  - id: as-fact-027
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Saptakanda_Ramayana"
    text:
      en: "Madhav Kandali's Assamese Ramayana, from the 14th century, is one of the earliest translations of Valmiki's Ramayana into a modern Indian language."
      bn: "চতুর্দশ শতকে লেখা মাধব কন্দলীর অসমিয়া রামায়ণ বাল্মীকি রামায়ণের কোনো আধুনিক ভারতীয় ভাষায় প্রথম দিককার অনুবাদগুলোর একটি।"
      hi: "14वीं सदी में रचित माधव कंदली की असमिया रामायण वाल्मीकि रामायण के किसी आधुनिक भारतीय भाषा में सबसे पुराने अनुवादों में से एक है।"
  - id: as-fact-028
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Sankardev"
    text:
      en: "Srimanta Sankardev (1449–1568) wrote devotional songs, the বৰগীত (bôrogit), and plays, the অংকীয়া নাট (ôṅkiyā nāt), in Brajavali, a literary language that blends Assamese with Maithili."
      bn: "শ্রীমন্ত শংকরদেব (১৪৪৯–১৫৬৮) ব্রজাবলিতে ভক্তিগীত বৰগীত ও নাটক অংকীয়া নাট রচনা করেছিলেন; ব্রজাবলি অসমিয়া আর মৈথিলী মেশানো এক সাহিত্যিক ভাষা।"
      hi: "श्रीमंत शंकरदेव (1449–1568) ने ब्रजावली में भक्ति गीत বৰগীত (bôrogit) और नाटक অংকীয়া নাট (ôṅkiyā nāt) रचे; ब्रजावली असमिया और मैथिली के मेल से बनी एक साहित्यिक भाषा है।"
  - id: as-fact-029
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Assamese_language"
    text:
      en: "From 1836 to 1873 the British made Bengali the language of Assam's schools and courts. Assamese was restored in 1873."
      bn: "১৮৩৬ থেকে ১৮৭৩ সাল পর্যন্ত ব্রিটিশরা অসমের স্কুল ও আদালতের ভাষা করেছিল বাংলা। ১৮৭৩ সালে অসমিয়া আবার সেই জায়গা ফিরে পায়।"
      hi: "1836 से 1873 तक अंग्रेज़ों ने असम के स्कूलों और अदालतों की भाषा बांग्ला कर दी थी। 1873 में असमिया को उसकी जगह वापस मिली।"
  - id: as-fact-030
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Orunodoi"
    text:
      en: "The first Assamese magazine, অৰুণোদই (Orunodoi), was printed by American Baptist missionaries in Sivasagar from 1846. Standard Assamese grew from the speech of that eastern part of Assam."
      bn: "প্রথম অসমিয়া পত্রিকা অৰুণোদই ১৮৪৬ সাল থেকে শিবসাগরে আমেরিকান ব্যাপটিস্ট মিশনারিরা ছাপতেন। প্রমিত অসমিয়া গড়ে উঠেছে অসমের সেই পূর্বাঞ্চলের কথ্য ভাষা থেকে।"
      hi: "पहली असमिया पत्रिका অৰুণোদই (ôrunudoi) अमेरिकी बैप्टिस्ट मिशनरी 1846 से शिवसागर में छापते थे। मानक असमिया असम के उसी पूर्वी इलाक़े की बोली से विकसित हुई।"
  - id: as-fact-031
    tags: [history, script]
    source: "https://en.wikipedia.org/wiki/Hemkosh"
    text:
      en: "Hemchandra Barua's dictionary হেমকোষ (Hemkosh), published in 1900, set the standard for Assamese spelling, which follows the Sanskrit origin of words rather than their sound."
      bn: "১৯০০ সালে প্রকাশিত হেমচন্দ্র বরুয়ার অভিধান হেমকোষ অসমিয়া বানানের মান ঠিক করে দেয়; এ বানান শব্দের উচ্চারণ নয়, সংস্কৃত উৎস অনুসরণ করে।"
      hi: "1900 में प्रकाशित हेमचंद्र बरुआ का शब्दकोश হেমকোষ (हेमकोष) असमिया वर्तनी का मानक बन गया; यह वर्तनी शब्द के उच्चारण के बजाय उसके संस्कृत मूल का अनुसरण करती है।"
  - id: as-fact-032
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Asam_Sahitya_Sabha"
    text:
      en: "অসম সাহিত্য সভা (ôxôm sāhity sôbhā), the Assam Literary Society, founded in 1917, looks after the Assamese language and its literature."
      bn: "১৯১৭ সালে প্রতিষ্ঠিত অসম সাহিত্য সভা অসমিয়া ভাষা ও সাহিত্যের দেখভাল করে।"
      hi: "1917 में स्थापित অসম সাহিত্য সভা (असम साहित्य सभा) असमिया भाषा और साहित्य की देखरेख करती है।"
  - id: as-fact-033
    tags: [history, words]
    source: "https://en.wikipedia.org/wiki/Nagamese_Creole"
    text:
      en: "Nagamese, the everyday common language of Nagaland, where dozens of languages are spoken, is a creole built on Assamese."
      bn: "নাগাল্যান্ডে কয়েক ডজন ভাষা প্রচলিত; সেখানকার রোজকার সর্বজনীন ভাষা নাগামিজ, যা অসমিয়ার ওপর ভর করে গড়ে ওঠা একটি ক্রেওল।"
      hi: "नगालैंड में दर्जनों भाषाएँ बोली जाती हैं; वहाँ आपसी बोलचाल की साझा भाषा नागामीज़ है, जो असमिया पर आधारित एक क्रियोल है।"
  - id: as-fact-034
    tags: [numbers, script]
    text:
      en: "Assamese writes the same digits as Bengali: ১ (1), ২ (2), ৩ (3). Watch ৪ (4), which is 4 though it looks like an 8, and ৮ (8), which is 8."
      bn: "অসমিয়া ও বাংলার অঙ্ক একই: ১, ২, ৩। তবে খেয়াল রাখবেন, ৪ মানে চার, যদিও দেখতে 8-এর মতো, আর ৮ মানে আট।"
      hi: "असमिया के अंक बांग्ला जैसे ही हैं: ১ (1), ২ (2), ৩ (3)। ध्यान रहे, ৪ (4) का अर्थ 4 है, भले ही वह 8 जैसा दिखे, और ৮ (8) का अर्थ 8 है।"
  - id: as-fact-035
    tags: [script, words]
    text:
      en: "Assamese spells English words with its own letters: s as চ (sô) or ছ (sô), st as ষ্ট (stô), v as ভ (bhô). So bus is বাছ (bās), station ষ্টেচন (stesôn), and driver ড্ৰাইভাৰ (drāibhār)."
      bn: "অসমিয়া ইংরেজি শব্দ নিজের অক্ষরে লেখে: s-এর জায়গায় চ বা ছ, st-এর জায়গায় ষ্ট, v-এর জায়গায় ভ। তাই bus হয় বাছ, station ষ্টেচন, আর driver ড্ৰাইভাৰ।"
      hi: "असमिया अंग्रेज़ी शब्दों को अपने अक्षरों में लिखती है: s के लिए চ (sô) या ছ (sô), st के लिए ষ্ট (stô), v के लिए ভ (bhô)। इसलिए bus বাছ (bās) है, station ষ্টেচন (stesôn), और driver ড্ৰাইভাৰ (drāibhār)।"
  - id: as-fact-036
    tags: [words]
    source: "https://en.wikipedia.org/wiki/Bihu"
    text:
      en: "Bihu, Assam's festival, comes three times a year: ব (bô)'হাগ বিহু (hāg bihu) in mid-April brings in the Assamese new year, মাঘ বিহু (māgh bihu) in January follows the harvest, and কাতি বিহু (kāti bihu) in October."
      bn: "অসমের উৎসব বিহু বছরে তিনবার আসে: এপ্রিলের মাঝামাঝি ব'হাগ বিহু নিয়ে আসে অসমিয়া নববর্ষ, ফসল তোলার পর জানুয়ারিতে মাঘ বিহু, আর অক্টোবরে কাতি বিহু।"
      hi: "असम का त्योहार बिहू साल में तीन बार आता है: अप्रैल के मध्य में ব (bô)'হাগ বিহু (hāg bihu) असमिया नववर्ष लेकर आता है, फ़सल कटने के बाद जनवरी में মাঘ বিহু (māgh bihu), और अक्टूबर में কাতি বিহু (kāti bihu)।"
  - id: as-fact-101
    contrast: en
    tags: [pronunciation]
    text:
      en: "English has no x sound. To make it, start a k, but don't let the tongue quite touch the roof of the mouth: the air rasps through, as in Scottish 'loch'. সাত (xāt) is seven; হাত (hāt), with an English h, is a hand."
  - id: as-fact-102
    contrast: en
    tags: [pronunciation]
    text:
      en: "Good news for English speakers: Assamese t and d are said where English says them, behind the teeth, for both ত (tô) and ট (tô). Hindi and Bengali make you learn two."
  - id: as-fact-103
    contrast: bn
    tags: [words]
    text:
      en: "Bengali কাল (kāl) means both yesterday and tomorrow. Assamese has two words: কালি (kāli), yesterday, and কাইলৈ (kāilôi), tomorrow."
      bn: "বাংলায় 'কাল' মানে গতকাল ও আগামীকাল, দুটোই। অসমিয়ায় আছে আলাদা দুটি শব্দ: কালি মানে গতকাল, কাইলৈ মানে আগামীকাল।"
  - id: as-fact-104
    contrast: bn
    tags: [words, pitfall]
    text:
      en: "Careful, Bengali speakers: বিষ (bix) in Assamese is pain, not poison. মূৰৰ বিষ (murôr bix) is a headache."
      bn: "সাবধান: অসমিয়ায় 'বিষ' মানে ব্যথা, গরল নয়; মূৰৰ বিষ মানে মাথাব্যথা।"
  - id: as-fact-105
    contrast: bn
    tags: [pronunciation]
    text:
      en: "Where Bengali says শ (xô) as sh, Assamese says x: Bengali দেশ (dex) is desh, Assamese দেশ (dex) is dex."
      bn: "বাংলায় শ উচ্চারিত হয় 'শ'-এর মতো, অসমিয়ায় x-এর মতো: বাংলায় 'দেশ' উচ্চারিত হয় 'দেশ', অসমিয়ায় 'dex'।"
  - id: as-fact-106
    contrast: bn
    tags: [script]
    text:
      en: "Typing Assamese on a Bengali keyboard gives র (rô) where ৰ (rô) belongs. To an Assamese reader, ঘর (ghôr) looks like a misprint for ঘৰ (ghôr)."
      bn: "বাংলা কি-বোর্ডে অসমিয়া টাইপ করলে ৰ-এর জায়গায় র আসে। তাই অসমিয়া পাঠকের চোখে ঘর যেন ঘৰ-এর ছাপার ভুল।"
  - id: as-fact-107
    contrast: hi
    tags: [grammar]
    text:
      en: "Hindi verbs show gender: वह जाता है (vah jātā hai), वह जाती है (vah jātī hai). Assamese verbs never do: সি যায় (si zāy), he goes, and তাই যায় (tāi zāy), she goes."
      hi: "हिंदी में क्रिया लिंग दिखाती है: वह जाता है, वह जाती है। असमिया की क्रिया लिंग नहीं दिखाती: সি যায় (वह जाता है), তাই যায় (वह जाती है)।"
  - id: as-fact-108
    contrast: hi
    tags: [pronunciation]
    text:
      en: "Assamese জ (zô) is the z of Hindi ज़ (za), not ज (ja): জল (zôl), water, is said zol, and জোন (zun), the moon, zun."
      hi: "असमिया का জ (zô) हिंदी के ज़ जैसा है, ज जैसा नहीं: জল (पानी) को 'ज़ोल' और জোন (चाँद) को 'ज़ुन' बोला जाता है।"
