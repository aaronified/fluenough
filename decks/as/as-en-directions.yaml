schema: 1
id: as-en-directions
name: "Directions"
kind: vocab
theme: directions
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Left, right, straight on, and asking where something is. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0314
    target: "… ক'ত?"
    native: "Where is …?"
    reading: "... kot?"
    ipa: "kot"
    pos: "phrase"
    notes: "Put the place first: ষ্টেচন ক'ত? Where's the station? Politely, ষ্টেচনটো ক'ত, কৈ দিব নেকি? Could you tell me where the station is?"
  - id: as-0315
    target: "সোঁ"
    native: "right (side)"
    reading: "xum̐"
    ipa: "xʊ̃"
    pos: "adj"
    notes: "সোঁফালে (xum̐phāle), to the right. ফাল (phāl) is a side or direction."
  - id: as-0316
    target: "বাওঁ"
    native: "left (side)"
    reading: "bāum̐"
    ipa: "baʊ̃"
    pos: "adj"
    notes: "বাওঁফালে (bāum̐phāle), to the left."
  - id: as-0317
    target: "পোনে পোনে"
    native: "straight on"
    reading: "pune pune"
    ipa: "pʊne pʊne"
    pos: "phrase"
  - id: as-0318
    target: "ঘূৰক"
    native: "please turn"
    reading: "ghurôk"
    ipa: "ɡʱuɹɔk"
    pos: "verb"
    tags: ["polite"]
    notes: "সোঁফালে ঘূৰক (xum̐phāle ghurôk), turn right."
  - id: as-0319
    target: "আগত"
    native: "ahead; in front"
    reading: "āgôt"
    ipa: "aɡɔt"
    pos: "adv"
    notes: "Formally সন্মুখত (xonmukhôt)."
  - id: as-0320
    target: "পাছফালে"
    native: "behind; at the back"
    reading: "pāsphāle"
    ipa: "paspʰale"
    pos: "adv"
    notes: "পাছ (pās), the back, and ফাল (phāl), side."
  - id: as-0321
    target: "ওচৰত"
    native: "near"
    reading: "usôrôt"
    ipa: "ʊsɔɹɔt"
    pos: "adv"
    notes: "After the place, with -ৰ: ষ্টেচনৰ ওচৰত (stesônôr usôrôt), near the station."
  - id: as-0322
    target: "দূৰ"
    native: "far; distance"
    reading: "dur"
    ipa: "duɹ"
    pos: "adj"
    notes: "কিমান দূৰ? (kiman dur?), how far is it?"
  - id: as-0323
    target: "ইয়াত"
    native: "here"
    reading: "iyāt"
    ipa: "ijat"
    pos: "adv"
  - id: as-0324
    target: "তাত"
    native: "there"
    reading: "tāt"
    ipa: "tat"
    pos: "adv"
  - id: as-0325
    target: "বাট"
    native: "way; route"
    reading: "bāt"
    ipa: "bat"
    pos: "noun"
    notes: "বাটটো কৈ দিয়ক (bāttu kôi diyôk), please tell me the way."
  - id: as-0326
    target: "আলি"
    native: "road; street"
    reading: "āli"
    ipa: "ali"
    pos: "noun"
    notes: "Also ৰাস্তা (rāstā) and পথ (pôth)."
  - id: as-0327
    target: "চাৰিআলি"
    native: "crossroads"
    reading: "sāriāli"
    ipa: "saɹiali"
    pos: "noun"
    notes: "Literally 'four roads'. Many places in Assam are named after their crossroads, and a bus conductor will call them out."
