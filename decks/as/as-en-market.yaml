schema: 1
id: as-en-market
name: "Market"
kind: vocab
theme: market
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Asking the price, bargaining, paying: what a market stall needs. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0266
    target: "বজাৰ"
    native: "market"
    reading: "bôzār"
    ipa: "bɔzaɹ"
    pos: "noun"
    notes: "বজাৰলৈ যোৱা (bôzārôlôi zuwā), to go to the market. Many towns have a weekly হাট (hāt), a market day."
  - id: as-0267
    target: "দাম কিমান?"
    native: "How much is it?"
    reading: "dām kimān?"
    ipa: "dam kiman"
    pos: "phrase"
    notes: "Also এইটো কিমান? (eitu kiman?), how much is this one? and, for the total, কিমান হ (kimān hô)'ল? (kiman hol?)."
  - id: as-0268
    target: "দাম"
    native: "price"
    reading: "dām"
    ipa: "dam"
    pos: "noun"
  - id: as-0269
    target: "টকা"
    native: "rupee; money"
    reading: "tôkā"
    ipa: "tɔka"
    pos: "noun"
    notes: "The same word for a rupee and for money: এশ টকা (ex tôkā), a hundred rupees. Unlike English, the noun stays as it is after a number."
  - id: as-0270
    target: "পইচা"
    native: "money; a paisa"
    reading: "poisā"
    ipa: "poisa"
    pos: "noun"
    notes: "Strictly a hundredth of a rupee, but in speech money in general: পইচা নাই (poisā nāi), I've no money."
  - id: as-0271
    target: "খুচুৰা"
    native: "change; small notes and coins"
    reading: "khusurā"
    ipa: "kʰusuɹa"
    pos: "noun"
    notes: "খুচুৰা আছে নেকি? (khusura ase neki?), do you have change?"
  - id: as-0272
    target: "বেছি দাম!"
    native: "That's too expensive!"
    reading: "besi dām!"
    ipa: "besi dam"
    pos: "phrase"
    notes: "বেছি (besi) is 'more, too much'; its opposite is কম (kôm), 'less'."
  - id: as-0273
    target: "অলপ কম কৰক।"
    native: "Please lower it a little."
    reading: "ôlôp kôm kôrôk."
    ipa: "ɔlɔp kɔm kɔɹɔk"
    pos: "phrase"
    tags: ["polite"]
    notes: "The polite way to bargain: অলপ (ôlôp), a little. Bargaining, দৰদাম (dôrdām), is expected at markets, not in shops with fixed prices."
  - id: as-0274
    target: "মোনা"
    native: "bag"
    reading: "munā"
    ipa: "mʊna"
    pos: "noun"
    notes: "Many shoppers bring their own cloth bag to the market."
  - id: as-0275
    target: "দোকান"
    native: "shop"
    reading: "dukān"
    ipa: "dʊkan"
    pos: "noun"
    notes: "The o is said close to u: dukan."
  - id: as-0276
    target: "দিয়ক"
    native: "please give (me)"
    reading: "diyôk"
    ipa: "dijɔk"
    pos: "verb"
    tags: ["polite"]
    notes: "এক কিলো দিয়ক (ek kilo diyôk), a kilo, please. To a friend: দিয়া (diyā)."
  - id: as-0277
    target: "কিলো"
    native: "kilo"
    reading: "kilo"
    ipa: "kilo"
    pos: "noun"
    notes: "আধা কিলো (ādhā kilo), half a kilo; ডেৰ কিলো (der kilo), a kilo and a half."
  - id: as-0278
    target: "আৰু একো নালাগে।"
    native: "Nothing else."
    reading: "āru eku nālāge."
    ipa: "aɹu ekʊ nalaɡe"
    pos: "phrase"
    notes: "লাগে (lāge), 'is needed'; নালাগে (nālāge), 'is not needed'."
  - id: as-0279
    target: "দৰদাম"
    native: "bargaining"
    reading: "dôrdām"
    ipa: "dɔɹdam"
    pos: "noun"
    notes: "দৰদাম কৰা (dôrdām kôrā), to bargain."
