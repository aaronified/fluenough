schema: 1
id: as-en-market
name: "Market"
kind: vocab
theme: market
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Asking the price, bargaining, paying: what a market stall needs. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0266
    target: "বজাৰ"
    native: "market"
    reading: "bojar"
    pos: "noun"
    notes: "বজাৰলৈ যোৱা (bojaroloi juwa), to go to the market. Many towns have a weekly হাট (hat), a market day."
  - id: as-0267
    target: "দাম কিমান?"
    native: "How much is it?"
    reading: "dam kiman?"
    pos: "phrase"
    notes: "Also এইটো কিমান? (eitu kiman?), how much is this one? and, for the total, কিমান হ'ল? (kiman hol?)."
  - id: as-0268
    target: "দাম"
    native: "price"
    reading: "dam"
    pos: "noun"
  - id: as-0269
    target: "টকা"
    native: "rupee; money"
    reading: "toka"
    pos: "noun"
    notes: "The same word for a rupee and for money: এশ টকা (ex toka), a hundred rupees. Unlike English, the noun stays as it is after a number."
  - id: as-0270
    target: "পইচা"
    native: "money; a paisa"
    reading: "poisa"
    pos: "noun"
    notes: "Strictly a hundredth of a rupee, but in speech money in general: পইচা নাই (poisa nai), I've no money."
  - id: as-0271
    target: "খুচুৰা"
    native: "change; small notes and coins"
    reading: "khusura"
    pos: "noun"
    notes: "খুচুৰা আছে নেকি? (khusura ase neki?), do you have change?"
  - id: as-0272
    target: "বেছি দাম!"
    native: "That's too expensive!"
    reading: "besi dam!"
    pos: "phrase"
    notes: "বেছি (besi) is 'more, too much'; its opposite is কম (kom), 'less'."
  - id: as-0273
    target: "অলপ কম কৰক।"
    native: "Please lower it a little."
    reading: "olop kom korok."
    pos: "phrase"
    tags: ["polite"]
    notes: "The polite way to bargain: অলপ (olop), a little. Bargaining, দৰদাম (dordam), is expected at markets, not in shops with fixed prices."
  - id: as-0274
    target: "মোনা"
    native: "bag"
    reading: "muna"
    pos: "noun"
    notes: "Many shoppers bring their own cloth bag to the market."
  - id: as-0275
    target: "দোকান"
    native: "shop"
    reading: "dukan"
    pos: "noun"
    notes: "The o is said close to u: dukan."
  - id: as-0276
    target: "দিয়ক"
    native: "please give (me)"
    reading: "diyok"
    pos: "verb"
    tags: ["polite"]
    notes: "এক কিলো দিয়ক (ek kilo diyok), a kilo, please. To a friend: দিয়া (diya)."
  - id: as-0277
    target: "কিলো"
    native: "kilo"
    reading: "kilo"
    pos: "noun"
    notes: "আধা কিলো (adha kilo), half a kilo; ডেৰ কিলো (der kilo), a kilo and a half."
  - id: as-0278
    target: "আৰু একো নালাগে।"
    native: "Nothing else."
    reading: "aru eku nalage."
    pos: "phrase"
    notes: "লাগে (lage), 'is needed'; নালাগে, 'is not needed'."
  - id: as-0279
    target: "দৰদাম"
    native: "bargaining"
    reading: "dordam"
    pos: "noun"
    notes: "দৰদাম কৰা (dordam kora), to bargain."
