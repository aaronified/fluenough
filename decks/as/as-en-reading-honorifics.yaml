passages:
  - id: "as-addressing-an-elder"
    title: "Speaking to an elder, a stranger and a friend"
    sentences:
      - text: "ককাইদেউ, আপুনি কেনে আছে?"
        reading: "kôkāideu, āpuni kene āse?"
      - text: "আপুনি বহক।"
        reading: "āpuni bôhôk."
      - text: "তুমি মোৰ বন্ধু, তুমি বহা।"
        reading: "tumi mur bondhu, tumi bôhā."
      - text: "মেডাম, আপোনাক ধন্যবাদ।"
        reading: "medām, āpunāk dhônyôbād."
    questions:
      - id: "as-4081"
        prompt: { en: "The speaker asks an elder how they are." }
        answer: true
      - id: "as-4082"
        prompt: { en: "What does the speaker tell the elder?" }
        options:
          - { en: "To sit down" }
          - { en: "To run" }
          - { en: "To go" }
        answer: 1
      - id: "as-4083"
        prompt: { en: "What form is used for the friend?" }
        options:
          - { en: "Polite" }
          - { en: "Informal" }
          - { en: "Formal letter" }
        answer: 2
  - id: "as-formal-letter"
    title: "A formal letter and its closing"
    sentences:
      - text: "সন্মানীয় মহোদয়, আপোনাৰ সমীপত।"
        reading: "xônmānīyô môhôdôy, āpunār xômīpôt."
      - text: "আপোনাৰ আবেদনপত্ৰ পাইছোঁ।"
        reading: "āpunār ābedônpôtrô paisum̐."
      - text: "আপুনি কৃপা কৰি উত্তৰ দিয়ক।"
        reading: "āpuni kripā kôri uttôr diyôk."
      - text: "আপোনাৰ বিশ্বস্ত।"
        reading: "āpunār bixwôstô."
    questions:
      - id: "as-4084"
        prompt: { en: "The letter is written in a formal tone." }
        answer: true
      - id: "as-4085"
        prompt: { en: "What does the writer ask the reader to do?" }
        options:
          - { en: "Reply" }
          - { en: "Forget" }
          - { en: "Sleep" }
        answer: 1
      - id: "as-4086"
        prompt: { en: "How is the letter closed?" }
        options:
          - { en: "Yours faithfully" }
          - { en: "Love" }
          - { en: "See you" }
        answer: 1
