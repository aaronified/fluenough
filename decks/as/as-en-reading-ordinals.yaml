passages:
  - id: "as-which-floor"
    title: "Finding a flat: the first floor, the second, the third"
    sentences:
      - text: "ফ্লেটটো প্ৰথম মহলাত নে দ্বিতীয়?"
        reading: "phletôtu prôthôm môhôlāt ne ditiy?"
      - text: "তৃতীয় মহলাত কোঠা বেছি।"
        reading: "tritiy môhôlāt kuthā besi."
      - text: "চতুৰ্থ মহলাত লিফ্ট নাই।"
        reading: "soturth môhôlāt lipht nāi."
      - text: "প্ৰথম মহলা দেখিম।"
        reading: "prôthôm môhôlā dekhim."
    questions:
      - id: "as-4040"
        prompt: { en: "The question asks whether the flat is on the first or second floor." }
        answer: true
      - id: "as-4041"
        prompt: { en: "Which floor has more rooms?" }
        options:
          - { en: "The first" }
          - { en: "The third" }
          - { en: "The fourth" }
        answer: 2
      - id: "as-4042"
        prompt: { en: "What is missing on the fourth floor?" }
        options:
          - { en: "Light" }
          - { en: "A lift" }
          - { en: "A door" }
        answer: 2
  - id: "as-month-calendar"
    title: "A calendar of events: the first, second and third week of the month"
    sentences:
      - text: "প্ৰথম সপ্তাহত কাম।"
        reading: "prôthôm xôptāhôt kām."
      - text: "দ্বিতীয় সপ্তাহত বিহু।"
        reading: "ditiy xôptāhôt bihu."
      - text: "তৃতীয় সপ্তাহত পঢ়া।"
        reading: "tritiy xôptāhôt pôrhā."
      - text: "শেষ সপ্তাহত ছুটী।"
        reading: "xex xôptāhôt suti."
    questions:
      - id: "as-4043"
        prompt: { en: "Work is in the first week." }
        answer: true
      - id: "as-4044"
        prompt: { en: "What is in the second week?" }
        options:
          - { en: "Bihu" }
          - { en: "Study" }
          - { en: "A holiday" }
        answer: 1
      - id: "as-4045"
        prompt: { en: "What is in the last week?" }
        options:
          - { en: "Work" }
          - { en: "A holiday" }
          - { en: "Study" }
        answer: 2
