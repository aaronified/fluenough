# How every Assamese reading is spelled (#47): the way Assamese is typed in
# a chat, spelled as said. See "Romanisation" in docs/DECK-FORMAT.md.
schema: 1
kind: romanisation
id: as-romanisation
language: as
scheme: "Based on ISO 15919's letters, spelled as said, and departing from the standard where a learner is better served (ADR-0025; the README lists the departures): ā for আ; ô for the inherent vowel where it is said [ɔ] and o where it is said [o], as after an apostrophe (lorā), and nothing where it is silent; i and u for both the short and the long vowel; u for ও, said [ʊ] (mur, tumār), but o in words from English; t th d dh for both rows, which Assamese says alike, on the gums; n for ন and ণ; s for চ and ছ; z for জ, ঝ and য, as said; x for স, শ and ষ (ôxôm); r for ৰ and ড়, rh for ঢ়; w for ৱ; y for য়; ṅ for ঙ and ং; m̐ for ঁ. A য-ফলা is a y glide (byôsto). ক্ষ is kkh, as said. A typed answer needs none of the marks, nor the nasal m̐, which chat leaves out."
standard: "ISO 15919"
# How a reading's letters are typed, read from the left, longest first:
# each reading is spelled so before an answer is compared with it.
typed:
  - ["ṅkh", "nkh"]
  - ["ṅgh", "ngh"]
  - ["ṅk", "nk"]
  - ["ṅg", "ng"]
  - ["ṅ", "ng"]
  - ["ñch", "nchh"]
  - ["ñc", "nch"]
  - ["ñjh", "njh"]
  - ["ñj", "nj"]
  - ["ñ", "ny"]
  - ["cch", "chh"]
  - ["cc", "chch"]
  - ["ch", "chh"]
  - ["c", "ch"]
  - ["ś", "sh"]
  - ["ṣ", "sh"]
  - ["m̐", ""]
  - ["ṁ", "n"]
  - ["k͟h", "kh"]
equivalents:
  - ["i", "ee", "ii"]
  - ["u", "oo", "uu", "o"]
  - ["a", "aa"]
  - ["j", "z"]
  - ["ph", "f"]
  - ["w", "v"]
