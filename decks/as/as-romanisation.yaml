# How every Assamese reading is spelled (#47): the way Assamese is typed in
# a chat, spelled as said. See "Romanisation" in docs/DECK-FORMAT.md.
schema: 1
kind: romanisation
id: as-romanisation
language: as
scheme: "Popular Assamese chat spelling, as said: lowercase, no length marks, ঁ dropped. o for the vowel every consonant carries where it is said (ghor, moi), u for ও (mur, tumar) but o in English words (photo), a for আ, x for স, শ and ষ (oxom, the Axom of chat), s for চ and ছ (sah), j for জ, ঝ and য, though said z (jol), ph for ফ, w for ৱ, y for য়, r for ৰ and ড়, rh for ঢ়, kkh for ক্ষ, and the future -ব written bo (jabo)."
equivalents:
  - ["i", "ee", "ii"]
  - ["u", "oo", "uu"]
  - ["a", "aa"]
  - ["j", "z"]
  - ["ph", "f"]
  - ["w", "v"]
