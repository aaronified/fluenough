schema: 1
id: as-en-work
name: "Work"
kind: vocab
theme: work
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Jobs, the workplace, and how to ask and say what someone does. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0199
    target: "চাকৰি"
    native: "job (employment)"
    reading: "sakori"
    pos: "noun"
    notes: "কাম (kam) is work of any kind; চাকৰি is a job with a salary. A government job, চৰকাৰী চাকৰি (sorkari sakori), is still many families' dream."
  - ref: as-0120
  - id: as-0200
    target: "অফিচ"
    native: "office"
    reading: "ophis"
    alt_target: ["কাৰ্যালয়"]
    pos: "noun"
    notes: "English f is written ফ and s is written চ. Formally কাৰ্যালয় (karjaloy)."
  - id: as-0201
    target: "শিক্ষক"
    native: "teacher"
    reading: "xikkhok"
    alt_target: ["টিচাৰ"]
    pos: "noun"
    notes: "A woman teacher is শিক্ষয়িত্ৰী (xikkhoyitri). In speech, often ছাৰ (sar) and বাইদেউ (baideu), or টিচাৰ (tisar)."
  - id: as-0202
    target: "দোকানী"
    native: "shopkeeper"
    reading: "dukani"
    pos: "noun"
    notes: "From দোকান (dukan), shop."
  - id: as-0203
    target: "ড্ৰাইভাৰ"
    native: "driver"
    reading: "draibhar"
    pos: "noun"
    notes: "English v is written ভ."
  - id: as-0204
    target: "ইঞ্জিনিয়াৰ"
    native: "engineer"
    reading: "injiniyar"
    pos: "noun"
  - id: as-0205
    target: "উকীল"
    native: "lawyer"
    reading: "ukil"
    pos: "noun"
  - id: as-0206
    target: "নাৰ্চ"
    native: "nurse"
    reading: "nars"
    pos: "noun"
  - id: as-0207
    target: "খেতিয়ক"
    native: "farmer"
    reading: "khetiyok"
    pos: "noun"
    notes: "From খেতি (kheti), farming. Formally কৃষক (krixok)."
  - id: as-0208
    target: "ৰান্ধনী"
    native: "cook"
    reading: "randhoni"
    pos: "noun"
    notes: "From ৰন্ধা (rondha), to cook."
  - id: as-0209
    target: "লেখক"
    native: "writer"
    reading: "lekhok"
    pos: "noun"
    notes: "A woman writer is লেখিকা (lekhika)."
  - id: as-0210
    target: "সাংবাদিক"
    native: "journalist; reporter"
    reading: "xangbadik"
    pos: "noun"
  - id: as-0211
    target: "ডাক্তৰ"
    native: "doctor"
    reading: "daktor"
    pos: "noun"
  - id: as-0212
    target: "পুলিচ"
    native: "police; a police officer"
    reading: "pulis"
    pos: "noun"
    notes: "Formally আৰক্ষী (arokkhi). The emergency number in India is 112."
  - id: as-0213
    target: "ছাত্ৰ"
    native: "student"
    reading: "satro"
    pos: "noun"
    notes: "A woman student is ছাত্ৰী (satri)."
  - id: as-0214
    target: "ছুটী"
    native: "day off; holiday; leave"
    reading: "suti"
    pos: "noun"
    notes: "আজি মোৰ ছুটী (aji mur suti), I have the day off today."
  - id: as-0215
    target: "দৰমহা"
    native: "salary; pay"
    reading: "dormoha"
    pos: "noun"
  - id: as-0216
    target: "বেপাৰ"
    native: "business; trade"
    reading: "bepar"
    pos: "noun"
  - id: as-0217
    target: "চাহ বাগান"
    native: "tea garden; tea estate"
    reading: "sah bagan"
    pos: "phrase"
    notes: "Assam grows more tea than any other state of India, on estates whose workers' families were brought from central and eastern India in the 1800s."
  - id: as-0218
    target: "আপুনি কি কাম কৰে?"
    native: "What do you do (for a living)?"
    reading: "apuni ki kam kore?"
    pos: "phrase"
  - id: as-0219
    target: "মই শিক্ষক।"
    native: "I'm a teacher."
    reading: "moi xikkhok."
    pos: "phrase"
    notes: "No verb is needed: 'I teacher'. Also মই এজন শিক্ষক (moi ejon xikkhok), with এজন, one person."
  - id: as-0220
    target: "আপুনি ক'ত কাম কৰে?"
    native: "Where do you work?"
    reading: "apuni kot kam kore?"
    pos: "phrase"
  - id: as-0221
    target: "মই এটা অফিচত কাম কৰোঁ।"
    native: "I work in an office."
    reading: "moi eta ophisot kam koru."
    pos: "phrase"
    notes: "A man and a woman say the same: Assamese verbs change for I, you and he, never for gender."
