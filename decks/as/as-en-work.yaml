schema: 1
id: as-en-work
name: "Work"
kind: vocab
theme: work
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Jobs, the workplace, and how to ask and say what someone does. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0199
    target: "চাকৰি"
    native: "job (employment)"
    reading: "sākori"
    ipa: "sakoɹi"
    pos: "noun"
    notes: "কাম (kām) is work of any kind; চাকৰি (sākori) is a job with a salary. A government job, চৰকাৰী চাকৰি (sôrkāri sākori), is still many families' dream."
  - ref: as-0120
  - id: as-0200
    target: "অফিচ"
    native: "office"
    reading: "ôphis"
    ipa: "ɔpʰis"
    alt_target: ["কাৰ্যালয়"]
    pos: "noun"
    notes: "English f is written ফ (phô) and s is written চ (sô). Formally কাৰ্যালয় (kārzālôy)."
  - id: as-0201
    target: "শিক্ষক"
    native: "teacher"
    reading: "xikkhôk"
    ipa: "xikkʰɔk"
    alt_target: ["টিচাৰ"]
    pos: "noun"
    notes: "A woman teacher is শিক্ষয়িত্ৰী (xikkhoyitri). In speech, often ছাৰ (sār) and বাইদেউ (bāideu), or টিচাৰ (tisār)."
  - id: as-0202
    target: "দোকানী"
    native: "shopkeeper"
    reading: "dukāni"
    ipa: "dʊkani"
    pos: "noun"
    notes: "From দোকান (dukān), shop."
  - id: as-0203
    target: "ড্ৰাইভাৰ"
    native: "driver"
    reading: "drāibhār"
    ipa: "dɹaibʱaɹ"
    pos: "noun"
    notes: "English v is written ভ (bhô)."
  - id: as-0204
    target: "ইঞ্জিনিয়াৰ"
    native: "engineer"
    reading: "inziniyār"
    ipa: "inzinijaɹ"
    pos: "noun"
  - id: as-0205
    target: "উকীল"
    native: "lawyer"
    reading: "ukil"
    ipa: "ukil"
    pos: "noun"
  - id: as-0206
    target: "নাৰ্চ"
    native: "nurse"
    reading: "nārs"
    ipa: "naɹs"
    pos: "noun"
  - id: as-0207
    target: "খেতিয়ক"
    native: "farmer"
    reading: "khetiyôk"
    ipa: "kʰetijɔk"
    pos: "noun"
    notes: "From খেতি (kheti), farming. Formally কৃষক (krixôk)."
  - id: as-0208
    target: "ৰান্ধনী"
    native: "cook"
    reading: "rāndhoni"
    ipa: "ɹandʱoni"
    pos: "noun"
    notes: "From ৰন্ধা (rôndhā), to cook."
  - id: as-0209
    target: "লেখক"
    native: "writer"
    reading: "lekhôk"
    ipa: "lekʰɔk"
    pos: "noun"
    notes: "A woman writer is লেখিকা (lekhikā)."
  - id: as-0210
    target: "সাংবাদিক"
    native: "journalist; reporter"
    reading: "xāṅbādik"
    ipa: "xaŋbadik"
    pos: "noun"
  - id: as-0211
    target: "ডাক্তৰ"
    native: "doctor"
    reading: "dāktôr"
    ipa: "daktɔɹ"
    pos: "noun"
  - id: as-0212
    target: "পুলিচ"
    native: "police; a police officer"
    reading: "pulis"
    ipa: "pulis"
    pos: "noun"
    notes: "Formally আৰক্ষী (ārokkhi). The emergency number in India is 112."
  - id: as-0213
    target: "ছাত্ৰ"
    native: "student"
    reading: "sātrô"
    ipa: "satɹɔ"
    pos: "noun"
    notes: "A woman student is ছাত্ৰী (sātri)."
  - id: as-0214
    target: "ছুটী"
    native: "day off; holiday; leave"
    reading: "suti"
    ipa: "suti"
    pos: "noun"
    notes: "আজি মোৰ ছুটী (āzi mur suti), I have the day off today."
  - id: as-0215
    target: "দৰমহা"
    native: "salary; pay"
    reading: "dôrmôhā"
    ipa: "dɔɹmɔha"
    pos: "noun"
  - id: as-0216
    target: "বেপাৰ"
    native: "business; trade"
    reading: "bepār"
    ipa: "bepaɹ"
    pos: "noun"
  - id: as-0217
    target: "চাহ বাগান"
    native: "tea garden; tea estate"
    reading: "sāh bāgān"
    ipa: "sah baɡan"
    pos: "phrase"
    notes: "Assam grows more tea than any other state of India, on estates whose workers' families were brought from central and eastern India in the 1800s."
  - id: as-0218
    target: "আপুনি কি কাম কৰে?"
    native: "What do you do (for a living)?"
    reading: "āpuni ki kām kôre?"
    ipa: "apuni ki kam kɔɹe"
    pos: "phrase"
  - id: as-0219
    target: "মই শিক্ষক।"
    native: "I'm a teacher."
    reading: "moi xikkhôk."
    ipa: "moi xikkʰɔk"
    pos: "phrase"
    notes: "No verb is needed: 'I teacher'. Also মই এজন শিক্ষক (moi ezôn xikkhôk), with এজন (ezôn), one person."
  - id: as-0220
    target: "আপুনি ক'ত কাম কৰে?"
    native: "Where do you work?"
    reading: "āpuni kot kām kôre?"
    ipa: "apuni kot kam kɔɹe"
    pos: "phrase"
  - id: as-0221
    target: "মই এটা অফিচত কাম কৰোঁ।"
    native: "I work in an office."
    reading: "moi etā ôphisôt kām kôrum̐."
    ipa: "moi eta ɔpʰisɔt kam kɔɹʊ̃"
    pos: "phrase"
    notes: "A man and a woman say the same: Assamese verbs change for I, you and he, never for gender."
