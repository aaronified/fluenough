passages:
  - id: "as-renting-a-flat"
    title: "Asking an owner about a flat to rent"
    theme: "housing"
    sentences:
      - text: "আপোনাৰ ফ্লেটটো ভাড়া দিব নে?"
        reading: "āpunār phlettô bhārā dib ne?"
      - text: "কোঠা দুটা আছে।"
        reading: "kuthā dutā āse."
      - text: "অগ্ৰিম কিমান?"
        reading: "ogrim kimān?"
      - text: "ভাড়া মাহে মাহে।"
        reading: "bhārā māhe māhe."
    questions:
      - id: "as-3812"
        prompt: { en: "The speaker asks whether a flat is for rent." }
        answer: true
      - id: "as-3813"
        prompt: { en: "How many rooms are there?" }
        options:
          - { en: "One" }
          - { en: "Two" }
          - { en: "Three" }
        answer: 2
      - id: "as-3814"
        prompt: { en: "What does the speaker ask about the money?" }
        options:
          - { en: "The advance" }
          - { en: "The colour" }
          - { en: "The age" }
        answer: 1
  - id: "as-rental-terms"
    title: "The terms of a rental"
    theme: "housing"
    sentences:
      - text: "ভাড়া প্ৰতি মাহে।"
        reading: "bhārā prôti māhe."
      - text: "অগ্ৰিম তিনি মাহৰ।"
        reading: "ogrim tini māhôr."
      - text: "পানী নল মালিকৰ।"
        reading: "pāni nôl mālikôr."
      - text: "ভাড়াটীয়াই পৰিষ্কাৰ ৰাখিব।"
        reading: "bhārāṭiyāi porixkār rākhib."
    questions:
      - id: "as-3815"
        prompt: { en: "The rent is paid each month." }
        answer: true
      - id: "as-3816"
        prompt: { en: "How many months of advance are needed?" }
        options:
          - { en: "One" }
          - { en: "Two" }
          - { en: "Three" }
        answer: 3
      - id: "as-3817"
        prompt: { en: "Who must keep the house clean?" }
        options:
          - { en: "The owner" }
          - { en: "The tenant" }
          - { en: "The neighbour" }
        answer: 2
