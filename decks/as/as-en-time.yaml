schema: 1
id: as-en-time
name: "Time and days"
kind: vocab
theme: time
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Today, yesterday and tomorrow, each with its own word, telling the time, and the days of the week. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0350
    target: "আজি"
    native: "today"
    reading: "āzi"
    ipa: "azi"
    pos: "adv"
  - id: as-0351
    target: "কাইলৈ"
    native: "tomorrow"
    reading: "kāilôi"
    ipa: "kailɔi"
    pos: "adv"
    notes: "Unlike Hindi and Bengali, which use one word for both, Assamese has a word for tomorrow and another for yesterday: কালি (kāli)."
  - id: as-0352
    target: "কালি"
    native: "yesterday"
    reading: "kāli"
    ipa: "kali"
    pos: "adv"
  - id: as-0353
    target: "এতিয়া"
    native: "now"
    reading: "etiyā"
    ipa: "etija"
    pos: "adv"
  - id: as-0354
    target: "ৰাতিপুৱা"
    native: "morning"
    reading: "rātipuwā"
    ipa: "ɹatipuwa"
    pos: "noun"
    notes: "ৰাতিপুৱা সাত বজাত (rātipuwā xāt bôzāt), at seven in the morning."
  - id: as-0355
    target: "দুপৰীয়া"
    native: "midday; early afternoon"
    reading: "duporiyā"
    ipa: "dupoɹija"
    pos: "noun"
  - id: as-0356
    target: "গধূলি"
    native: "evening; dusk"
    reading: "godhuli"
    ipa: "ɡodʱuli"
    pos: "noun"
    notes: "The hour when cattle come home and the dust they raise hangs in the light: গো (cattle) and ধূলি (dust)."
  - id: as-0357
    target: "ৰাতি"
    native: "night"
    reading: "rāti"
    ipa: "ɹati"
    pos: "noun"
  - id: as-0358
    target: "বজা"
    native: "o'clock"
    reading: "bôzā"
    ipa: "bɔza"
    pos: "noun"
    notes: "চাৰি বজা (sāri bôzā), four o'clock; চাৰি বজাত (sāri bôzāt), at four. From বজা (bôzā), to ring, as a clock chimes."
  - id: as-0359
    target: "সাৰে চাৰি"
    native: "half past four; 4½"
    reading: "xāre sāri"
    ipa: "xaɹe saɹi"
    pos: "phrase"
    notes: "সাৰে (xāre) adds a half to any number from three on. Half past one is ডেৰ (der), half past two আঢ়ৈ (ārhôi)."
  - id: as-0360
    target: "কিমান বাজিছে?"
    native: "What time is it?"
    reading: "kimān bāzise?"
    ipa: "kiman bazise"
    pos: "phrase"
    notes: "Literally 'how many has it rung?'. The answer: চাৰি বাজিছে (sāri bāzise), it's four."
  - id: as-0361
    target: "দিন"
    native: "day"
    reading: "din"
    ipa: "din"
    pos: "noun"
  - id: as-0362
    target: "সপ্তাহ"
    native: "week"
    reading: "xôptāh"
    ipa: "xɔptah"
    pos: "noun"
  - id: as-0363
    target: "সোমবাৰ"
    native: "Monday"
    reading: "xumbār"
    ipa: "xʊmbaɹ"
    pos: "noun"
    notes: "Each day ends in বাৰ (bār), and most names match Bengali's and Hindi's."
  - id: as-0364
    target: "মঙলবাৰ"
    native: "Tuesday"
    reading: "môṅôlbār"
    ipa: "mɔŋɔlbaɹ"
    pos: "noun"
  - id: as-0365
    target: "বুধবাৰ"
    native: "Wednesday"
    reading: "budhbār"
    ipa: "budʱbaɹ"
    pos: "noun"
  - id: as-0366
    target: "বৃহস্পতিবাৰ"
    native: "Thursday"
    reading: "brihôspotibār"
    ipa: "brihɔspotibaɹ"
    pos: "noun"
  - id: as-0367
    target: "শুক্ৰবাৰ"
    native: "Friday"
    reading: "xukrôbār"
    ipa: "xukɹɔbaɹ"
    pos: "noun"
  - id: as-0368
    target: "শনিবাৰ"
    native: "Saturday"
    reading: "xonibār"
    ipa: "xonibaɹ"
    pos: "noun"
  - id: as-0369
    target: "দেওবাৰ"
    native: "Sunday"
    reading: "deubār"
    ipa: "deʊbaɹ"
    pos: "noun"
    notes: "Here Assamese differs from Bengali and Hindi, which say রবিবার (robibār) and रविवार (ravivār)."
