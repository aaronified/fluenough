id: as-en-grammar-sentences
name: "Basic sentences"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Word order, no 'is', and how Assamese says 'have' and 'like'. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: as-2019
    target: "মই এজন ছাত্ৰ।"
    native: "I am a student."
    reading: "moi ezôn sātrô."
    ipa: "moi ezɔn satɹɔ"
    pos: "phrase"
    notes: "No separate 'am'. এজন (ezôn), 'one person', often stands where English has 'a'. A woman says মই এজনী ছাত্ৰী (moi ezoni sātri)."
  - id: as-2020
    target: "এইটো মোৰ ঘৰ।"
    native: "This is my house."
    reading: "eitu mur ghôr."
    ipa: "eitʊ mʊɹ ɡʱɔɹ"
    pos: "phrase"
    notes: "There is no 'is' in the present."
  - id: as-2021
    target: "মই চাহ খাওঁ।"
    native: "I drink tea."
    reading: "moi sāh khāum̐."
    ipa: "moi sah kʰaʊ̃"
    alt_target: ["মই চাহ খাও।"]
    pos: "phrase"
    notes: "Assamese eats its tea: খোৱা (khuwā) is 'to eat' and 'to drink'. Subject, object, verb."
  - id: as-2022
    target: "তাই অসমীয়া শিকি আছে।"
    native: "She is learning Assamese."
    reading: "tāi ôxomiyā xiki āse."
    ipa: "tai ɔxomija xiki ase"
    pos: "phrase"
  - id: as-2023
    target: "মই অসমীয়া ভাল পাওঁ।"
    native: "I like Assamese."
    reading: "moi ôxomiyā bhāl pāum̐."
    ipa: "moi ɔxomija bʱal paʊ̃"
    alt_target: ["মই অসমীয়া ভাল পাও।"]
    pos: "phrase"
    notes: "'I get it good': ভাল পোৱা (bhāl puwā) is 'to like', and the one who likes is the doer."
  - id: as-2024
    target: "মোৰ এখন গাড়ী আছে।"
    native: "I have a car."
    reading: "mur ekhôn gāri āse."
    ipa: "mʊɹ ekʰɔn ɡaɹi ase"
    pos: "phrase"
    notes: "'Of me a car there is': the owner takes -ৰ (-rô), and আছে (āse) says 'there is'."
  - id: as-2025
    target: "মোৰ লগত টকা নাই।"
    native: "I don't have any money on me."
    reading: "mur lôgôt tôkā nāi."
    ipa: "mʊɹ lɔɡɔt tɔka nai"
    pos: "phrase"
    notes: "'With me there is no money'. নাই (nāi) is the same for one thing or many."
  - id: as-2026
    target: "এইটো ভাল নহয়।"
    native: "This isn't good."
    reading: "eitu bhāl nôhôy."
    ipa: "eitʊ bʱal nɔhɔj"
    pos: "phrase"
    notes: "নহয় (nôhôy) says what something is not; নাই (nāi), that it is not there."
  - id: as-2027
    target: "নাযাব।"
    native: "Please don't go."
    reading: "nāzābô."
    ipa: "nazabɔ"
    pos: "phrase"
    notes: "A polite 'don't' is the negative future, here for আপুনি (āpuni). To a friend, নাযাবা (nāzābā)."
  - id: as-2028
    target: "আজি বৰ গৰম।"
    native: "It's very hot today."
    reading: "āzi bôr gôrôm."
    ipa: "azi bɔɹ ɡɔɹɔm"
    pos: "phrase"
    notes: "বৰ (bôr) is 'very'. No verb is needed."
