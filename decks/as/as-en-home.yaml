    notes: "From চুবুৰি (suburi), a neighbourhood of a town or a village."
  - ref: as-0302
    native: "rent"
    notes: "In this deck: rent. ভাড়াঘৰ (bhārāghôr), a rented house."
  - id: as-0344
    target: "ফ্লেট"
    native: "flat; apartment"
    reading: "phlet"
    ipa: "pʰlet"
    pos: "noun"
  - id: as-0345
    target: "চোতাল"
    native: "courtyard; the yard in front of a house"
    reading: "sutāl"
    ipa: "sʊtal"
    pos: "noun"
    notes: "Swept clean every morning in a village home; Bihu is danced in it."
  - id: as-0346
    target: "পদূলি"
    native: "the gateway; the path from the road to a house"
    reading: "poduli"
    ipa: "poduli"
    pos: "noun"
    notes: "Guests are welcomed and seen off at the পদূলি (poduli)."
  - id: as-0347
    target: "তামোল-পাণ"
    native: "betel nut and betel leaf (offered to guests)"
    reading: "tāmul-pān"
    ipa: "tamʊlpan"
    pos: "noun"
    notes: "Offered to a guest on a brass tray, the bota, and at every ceremony: a sign of welcome and respect."
  - id: as-0348
    target: "ঘৰৰ সন্মুখত এখন পাৰ্ক আছে।"
    native: "There's a park in front of the house."
    reading: "ghôrôr xonmukhôt ekhôn pārk āse."
    ipa: "ɡʱɔɹɔɹ xonmukʰɔt ekʰɔn paɹk ase"
    pos: "phrase"
    notes: "এখন (ekhôn), one, with খন (khôn), the counting word for flat things and places."
  - id: as-0349
    target: "আমাৰ আলিটো বৰ শান্ত।"
    native: "Our street is very quiet."
    reading: "āmār ālitu bôr xāntô."
    ipa: "amaɹ alitʊ bɔɹ xantɔ"
    pos: "phrase"
    notes: "আলিটো (ālitu), 'the street': the counting word টো (tu) after a noun makes it definite."
