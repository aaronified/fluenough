schema: 1
id: as-en-daily-life
name: "A day"
kind: vocab
theme: daily-life
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The day from waking to sleeping, and how often things happen. Verbs are given in their -আ form, the one a dictionary lists. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0370
    target: "উঠা"
    native: "to get up"
    reading: "utha"
    pos: "verb"
    notes: "Waking up is সাৰ পোৱা (xar puwa)."
  - id: as-0371
    target: "গা ধোৱা"
    native: "to bathe; to have a wash"
    reading: "ga dhuwa"
    pos: "phrase"
    notes: "Literally 'to wash the body'."
  - id: as-0372
    target: "দাঁত ঘঁহা"
    native: "to brush one's teeth"
    reading: "dat ghoha"
    pos: "phrase"
    notes: "Literally 'to rub the teeth'."
  - id: as-0373
    target: "জলপান"
    native: "breakfast; a light meal"
    reading: "jolpan"
    pos: "noun"
    notes: "The traditional Assamese breakfast: flattened or puffed rice, চিৰা (sira) or আখৈ (akhoi), with curd and jaggery, দৈ-গুৰ (doi-gur). Today it can be any snack with tea."
  - id: as-0374
    target: "দুপৰীয়াৰ ভাত"
    native: "lunch"
    reading: "duporiyar bhat"
    pos: "phrase"
    notes: "Literally 'midday rice': a meal is ভাত, rice."
  - id: as-0375
    target: "ৰাতিৰ ভাত"
    native: "dinner"
    reading: "ratir bhat"
    pos: "phrase"
    notes: "Literally 'night rice'."
  - id: as-0376
    target: "কামলৈ যোৱা"
    native: "to go to work"
    reading: "kamoloi juwa"
    pos: "phrase"
  - id: as-0377
    target: "ঘৰলৈ অহা"
    native: "to come home"
    reading: "ghoroloi oha"
    pos: "phrase"
  - id: as-0378
    target: "ৰন্ধা"
    native: "to cook"
    reading: "rondha"
    pos: "verb"
  - id: as-0379
    target: "শোৱা"
    native: "to sleep; to lie down"
    reading: "xuwa"
    pos: "verb"
    notes: "Falling asleep is টোপনি যোৱা (tuponi juwa): টোপনি is sleep."
  - id: as-0380
    target: "সদায়"
    native: "always; every day"
    reading: "xodai"
    pos: "adv"
  - id: as-0381
    target: "প্ৰতিদিনে"
    native: "every day"
    reading: "protidine"
    pos: "adv"
  - id: as-0382
    target: "কেতিয়াবা"
    native: "sometimes"
    reading: "ketiyaba"
    pos: "adv"
    notes: "কেতিয়া (ketiya), when, with -বা, 'some': at some time."
  - id: as-0383
    target: "সাধাৰণতে"
    native: "usually"
    reading: "xadharonote"
    pos: "adv"
  - id: as-0384
    target: "একেলগে"
    native: "together"
    reading: "ekeloge"
    pos: "adv"
    notes: "আমি একেলগে ভাত খাওঁ (ami ekeloge bhat khau), we eat together."
  - id: as-0385
    target: "তাৰ পাছত"
    native: "after that; then"
    reading: "tar pasot"
    pos: "phrase"
    notes: "After a noun, পাছত means after: ভাতৰ পাছত (bhator pasot), after the meal."
  - id: as-0386
    target: "মই সদায় সাত বজাত উঠোঁ।"
    native: "I get up at seven every day."
    reading: "moi xodai xat bojat uthu."
    pos: "phrase"
    notes: "The -ওঁ ending is 'I': উঠোঁ (uthu), I get up."
  - id: as-0387
    target: "তাৰ পাছত মই কামলৈ যাওঁ।"
    native: "Then I go to work."
    reading: "tar pasot moi kamoloi jau."
    pos: "phrase"
  - id: as-0388
    target: "মই ৰাতি এঘাৰ বজাত শুবলৈ যাওঁ।"
    native: "I go to bed at eleven at night."
    reading: "moi rati eghar bojat xuboloi jau."
    pos: "phrase"
    notes: "শুবলৈ (xuboloi), 'to sleep', with যাওঁ, I go."
  - id: as-0389
    target: "মই কেতিয়াও পলম নকৰোঁ।"
    native: "I'm never late."
    reading: "moi ketiyau polom nokoru."
    pos: "phrase"
    notes: "পলম (polom), delay; নকৰোঁ, I don't do. 'Never' is কেতিয়াও (ketiyau), 'ever', with a negative verb."
