schema: 1
id: as-en-daily-life
name: "A day"
kind: vocab
theme: daily-life
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The day from waking to sleeping, and how often things happen. Verbs are given in their -আ form, the one a dictionary lists. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0370
    target: "উঠা"
    native: "to get up"
    reading: "uthā"
    ipa: "utʰa"
    pos: "verb"
    notes: "Waking up is সাৰ পোৱা (xār puwā)."
  - id: as-0371
    target: "গা ধোৱা"
    native: "to bathe; to have a wash"
    reading: "gā dhuwā"
    ipa: "ɡa dʱʊwa"
    pos: "phrase"
    notes: "Literally 'to wash the body'."
  - id: as-0372
    target: "দাঁত ঘঁহা"
    native: "to brush one's teeth"
    reading: "dām̐t ghôm̐hā"
    ipa: "dãt ɡʱɔ̃ha"
    pos: "phrase"
    notes: "Literally 'to rub the teeth'."
  - id: as-0373
    target: "জলপান"
    native: "breakfast; a light meal"
    reading: "zôlpān"
    ipa: "zɔlpan"
    pos: "noun"
    notes: "The traditional Assamese breakfast: flattened or puffed rice, চিৰা (sirā) or আখৈ (ākhôi), with curd and jaggery, দৈ-গুৰ (dôi-gur). Today it can be any snack with tea."
  - id: as-0374
    target: "দুপৰীয়াৰ ভাত"
    native: "lunch"
    reading: "duporiyār bhāt"
    ipa: "dupoɹijaɹ bʱat"
    pos: "phrase"
    notes: "Literally 'midday rice': a meal is ভাত, rice."
  - id: as-0375
    target: "ৰাতিৰ ভাত"
    native: "dinner"
    reading: "rātir bhāt"
    ipa: "ɹatiɹ bʱat"
    pos: "phrase"
    notes: "Literally 'night rice'."
  - id: as-0376
    target: "কামলৈ যোৱা"
    native: "to go to work"
    reading: "kāmôlôi zuwā"
    ipa: "kamɔlɔi zʊwa"
    pos: "phrase"
  - id: as-0377
    target: "ঘৰলৈ অহা"
    native: "to come home"
    reading: "ghôrôlôi ôhā"
    ipa: "ɡʱɔɹɔlɔi ɔha"
    pos: "phrase"
  - id: as-0378
    target: "ৰন্ধা"
    native: "to cook"
    reading: "rôndhā"
    ipa: "ɹɔndʱa"
    pos: "verb"
  - id: as-0379
    target: "শোৱা"
    native: "to sleep; to lie down"
    reading: "xuwā"
    ipa: "xʊwa"
    pos: "verb"
    notes: "Falling asleep is টোপনি যোৱা (tuponi zuwā): টোপনি is sleep."
  - id: as-0380
    target: "সদায়"
    native: "always; every day"
    reading: "xôdāi"
    ipa: "xɔdai"
    pos: "adv"
  - id: as-0381
    target: "প্ৰতিদিনে"
    native: "every day"
    reading: "protidine"
    ipa: "pɹotidine"
    pos: "adv"
  - id: as-0382
    target: "কেতিয়াবা"
    native: "sometimes"
    reading: "ketiyābā"
    ipa: "ketijaba"
    pos: "adv"
    notes: "কেতিয়া (ketiyā), when, with -বা, 'some': at some time."
  - id: as-0383
    target: "সাধাৰণতে"
    native: "usually"
    reading: "xādhārônôte"
    ipa: "xadʱaɹɔnɔte"
    pos: "adv"
  - id: as-0384
    target: "একেলগে"
    native: "together"
    reading: "ekelôge"
    ipa: "ekelɔɡe"
    pos: "adv"
    notes: "আমি একেলগে ভাত খাওঁ (āmi ekelôge bhāt khāum̐), we eat together."
  - id: as-0385
    target: "তাৰ পাছত"
    native: "after that; then"
    reading: "tār pāsôt"
    ipa: "taɹ pasɔt"
    pos: "phrase"
    notes: "After a noun, পাছত means after: ভাতৰ পাছত (bhātôr pāsôt), after the meal."
  - id: as-0386
    target: "মই সদায় সাত বজাত উঠোঁ।"
    native: "I get up at seven every day."
    reading: "moi xôdāi xāt bôzāt uthum̐."
    ipa: "moi xɔdai xat bɔzat utʰʊ̃"
    pos: "phrase"
    notes: "The -ওঁ ending is 'I': উঠোঁ (uthum̐), I get up."
  - id: as-0387
    target: "তাৰ পাছত মই কামলৈ যাওঁ।"
    native: "Then I go to work."
    reading: "tār pāsôt moi kāmôlôi zāum̐."
    ipa: "taɹ pasɔt moi kamɔlɔi zaʊ̃"
    pos: "phrase"
  - id: as-0388
    target: "মই ৰাতি এঘাৰ বজাত শুবলৈ যাওঁ।"
    native: "I go to bed at eleven at night."
    reading: "moi rāti eghār bôzāt xubôlôi zāum̐."
    ipa: "moi ɹati eɡʱaɹ bɔzat xubɔlɔi zaʊ̃"
    pos: "phrase"
    notes: "শুবলৈ (xubôlôi), 'to sleep', with যাওঁ, I go."
  - id: as-0389
    target: "মই কেতিয়াও পলম নকৰোঁ।"
    native: "I'm never late."
    reading: "moi ketiyāu pôlôm nôkôrum̐."
    ipa: "moi ketijaʊ pɔlɔm nɔkɔɹʊ̃"
    pos: "phrase"
    notes: "পলম (pôlôm), delay; নকৰোঁ, I don't do. 'Never' is কেতিয়াও (ketiyāu), 'ever', with a negative verb."
