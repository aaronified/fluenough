id: as-en-slang
name: "Slang"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Everyday slang and pet names: what friends and families say that a textbook doesn't. Not yet checked by an Assamese speaker: please report any mistake."
tags: [slang, unreviewed]
cards:
  - id: as-0444
    target: "কি হ'ল?"
    native: "What's up? What happened?"
    reading: "ki hol?"
    ipa: "ki hol"
    pos: "phrase"
    notes: "Literally 'what happened?'. Also, among friends, just কি? (ki?)."
  - id: as-0445
    target: "ভাই"
    native: "bro; mate"
    reading: "bhāi"
    ipa: "bʱai"
    pos: "noun"
    notes: "Literally 'younger brother', but between friends any young man: কি ভাই? (ki bhai?), what's up, mate?"
  - id: as-0446
    target: "জব্বৰ"
    native: "terrific; awesome"
    reading: "zôbbôr"
    ipa: "zɔbbɔɹ"
    pos: "adj"
    notes: "জব্বৰ হৈছে! (jobbor hoise!), that's brilliant!"
  - id: as-0447
    target: "একদম"
    native: "totally; absolutely"
    reading: "ekdôm"
    ipa: "ekdɔm"
    pos: "adv"
    notes: "একদম ঠিক (ekdôm thik), exactly right."
  - id: as-0448
    target: "হ'ব দে"
    native: "never mind; let it go"
    reading: "hobô de"
    ipa: "hobɔ de"
    pos: "phrase"
    notes: "Literally 'let it be'. Shrugs off a mistake or an argument."
  - id: as-0449
    target: "খেলিমেলি"
    native: "a mess; a muddle"
    reading: "khelimeli"
    ipa: "kʰelimeli"
    pos: "noun"
    notes: "সকলো খেলিমেলি হৈ গ (sôkôlu khelimeli hôi gô)'ল (xokolu khelimeli hoi gol), everything got into a mess."
  - id: as-0450
    target: "পগলা"
    native: "nutter; crazy guy"
    reading: "pôglā"
    ipa: "pɔɡla"
    pos: "noun"
    notes: "From পাগল (pāgôl), mad. Teasing between friends; rude to anyone else. পাগল নেকি? (pagol neki?), are you mad?"
  - id: as-0451
    target: "টেনচন নল'বা"
    native: "don't stress"
    reading: "tensôn nôlobā"
    ipa: "tensɔn nɔloba"
    pos: "phrase"
    notes: "'Don't take tension', to a friend. With respect, চিন্তা নকৰিব (sintā nôkoribô), please don't worry."
  - id: as-0452
    target: "মজা"
    native: "fun"
    reading: "môzā"
    ipa: "mɔza"
    pos: "noun"
    notes: "বৰ মজা পালোঁ (bôr môzā pālum̐), I had great fun."
  - id: as-0453
    target: "অ' মোৰ আই!"
    native: "Oh my God! (literally 'oh my mother')"
    reading: "ô' mur āi!"
    ipa: "ɔ mʊɹ ai"
    pos: "phrase"
    notes: "Surprise, shock or delight. আই (āi) is mother."
  - id: as-0454
    target: "বাপু"
    native: "dear boy; son (fondly, to a boy)"
    reading: "bāpu"
    ipa: "bapu"
    pos: "noun"
    notes: "What an older person calls a boy or a young man. A fond form is বোপাই (bupāi)."
  - id: as-0455
    target: "মাজনী"
    native: "dear girl (fondly, to a girl)"
    reading: "māzoni"
    ipa: "mazoni"
    pos: "noun"
    notes: "What parents and grandparents call a daughter or a granddaughter."
  - id: as-0456
    target: "সোণ"
    native: "gold; darling"
    reading: "xun"
    ipa: "xʊn"
    pos: "noun"
    notes: "Gold, and the commonest pet name for a child or a loved one."
  - id: as-0457
    target: "চিগাৰেট খোৱা"
    native: "to smoke a cigarette"
    reading: "sigāret khuwā"
    ipa: "siɡaɹet kʰʊwa"
    pos: "phrase"
    notes: "Literally 'to eat a cigarette': Assamese eats tea, water and smoke alike. Smoking on a sign is ধূমপান (dhumpān)."
