schema: 1
id: as-en-script-vowel-signs
name: "Assamese vowel signs"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "After a consonant a vowel is written as a sign (kar) on it, before, after, below or around it. Here on ক (kô) and on ম (mô). Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: as-0067
    target: "কা"
    native: "ka (k + the a sign)"
    reading: "kā"
    ipa: "ka"
    notes: "The a sign া (akar) is written after the consonant: ক (kô) + া (ā) = কা (kā), as in কাম (kām, work). Compare ক (kô) on its own, which is 'ko'."
  - id: as-0068
    target: "কি"
    native: "ki (k + the short i sign)"
    reading: "ki"
    ipa: "ki"
    notes: "The short i sign ি (hroswo ikar) is written BEFORE the consonant but said after it: you see ি (i) then ক (kô), and say 'ki'. কি (ki) is 'what'."
  - id: as-0069
    target: "কী"
    native: "ki (k + the long i sign)"
    reading: "ki"
    ipa: "ki"
    modes: [recognition, production]
    notes: "The long i sign ী (dirgho ikar) is written after the consonant. It sounds just like কি (ki), so it is drilled by reading and writing only: no ear or recogniser can tell them apart. Many Assamese words end in it: পানী (pāni, water)."
  - id: as-0070
    target: "কু"
    native: "ku (k + the short u sign)"
    reading: "ku"
    ipa: "ku"
    notes: "The short u sign ু (hroswo ukar) hangs below the consonant: কুকুৰ (kukur, dog)."
  - id: as-0071
    target: "কূ"
    native: "ku (k + the long u sign)"
    reading: "ku"
    ipa: "ku"
    modes: [recognition, production]
    notes: "The long u sign ূ (dirgho ukar) also hangs below. It sounds just like কু (ku), so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: as-0072
    target: "কৃ"
    native: "kri (k + the ri sign)"
    reading: "kri"
    ipa: "kri"
    modes: [recognition, production]
    notes: "The ri sign ৃ (rikar) hangs below the consonant: কৃষক (krixôk, farmer). A recogniser writes this sound as ক্ৰি (kri), so it is drilled by reading and writing only."
  - id: as-0073
    target: "কে"
    native: "ke (k + the e sign)"
    reading: "ke"
    ipa: "ke"
    notes: "The e sign ে (ekar) is written BEFORE the consonant and said after it: কেতিয়া (ketiyā, when)."
  - id: as-0074
    target: "কৈ"
    native: "koi (k + the oi sign)"
    reading: "kôi"
    ipa: "kɔi"
    modes: [recognition, production]
    notes: "The oi sign ৈ (oikar) is also written before the consonant and said after it: কৈ দিয়ক (kôi diyôk), please tell me. A recogniser may write this sound as কই (koi), so it is drilled by reading and writing only."
  - id: as-0075
    target: "কো"
    native: "ko (k + the o sign)"
    reading: "ko"
    ipa: "ko"
    notes: "The o sign ো (okar) comes in two parts around the consonant: ে (e) before it and া (ā) after it. This is the closed o of 'go', and in many words it is said nearer u, as chat writes it: কোন (kun, who)."
  - id: as-0076
    target: "কৌ"
    native: "kou (k + the ou sign)"
    reading: "kôu"
    ipa: "kɔu"
    modes: [recognition, production]
    notes: "The ou sign ৌ (oukar) also comes in two parts: ে (e) before the consonant and ৗ (ôu) after it: আকৌ (ākôu, again). A recogniser may write this sound as কউ (kou), so it is drilled by reading and writing only."
  - id: as-0077
    target: "ক্"
    native: "k (with the hoxonto: no vowel)"
    reading: "k"
    ipa: "k"
    modes: [recognition, production]
    notes: "The hoxonto ্ below a consonant takes its vowel away: ক্ (k) is 'k' alone. Usually two consonants join into a conjunct instead, so you see it mostly in single letters and new words. A sign rather than a syllable you say, so it is drilled by reading and writing only."
  - id: as-0078
    target: "মা"
    native: "ma (m + the a sign)"
    reading: "mā"
    ipa: "ma"
    notes: "The same a sign on another consonant: each sign keeps its place on almost every consonant. After ৰ (rô), শ (xô) and হ (hô) the u signs join in shapes of their own: ৰু (ru), শু (xu), হু (hu). মা (mā, mother)."
  - id: as-0079
    target: "মি"
    native: "mi (m + the short i sign)"
    reading: "mi"
    ipa: "mi"
    notes: "The short i sign is written before ম (mô), as before ক (kô), and said after it: মিঠা (mithā, sweet)."
  - id: as-0080
    target: "মী"
    native: "mi (m + the long i sign)"
    reading: "mi"
    ipa: "mi"
    modes: [recognition, production]
    notes: "The long i sign is written after ম (mô). It sounds just like মি (mi), so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: as-0081
    target: "মু"
    native: "mu (m + the short u sign)"
    reading: "mu"
    ipa: "mu"
    notes: "The short u sign hangs below ম (mô), as below ক (kô): মুখ (mukh, face)."
  - id: as-0082
    target: "মূ"
    native: "mu (m + the long u sign)"
    reading: "mu"
    ipa: "mu"
    modes: [recognition, production]
    notes: "The long u sign hangs below ম (mô): মূৰ (mur, head). It sounds just like মু (mu), so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: as-0083
    target: "মে"
    native: "me (m + the e sign)"
    reading: "me"
    ipa: "me"
    notes: "The e sign is written before ম (mô) and said after it: মেজ (mez, table)."
  - id: as-0084
    target: "মো"
    native: "mo (m + the o sign)"
    reading: "mo"
    ipa: "mo"
    notes: "The o sign wraps around ম (mô) in two parts, as it wraps around ক (kô). In মোৰ (mur, my) it is said nearer u."
