schema: 1
id: as-en-script-vowel-signs
name: "Assamese vowel signs"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "After a consonant a vowel is written as a sign (kar) on it, before, after, below or around it. Here on ক and on ম. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: as-0067
    target: "কা"
    native: "ka (k + the a sign)"
    reading: "ka"
    notes: "The a sign া (akar) is written after the consonant: ক + া = কা, as in কাম (kam, work). Compare ক on its own, which is 'ko'."
  - id: as-0068
    target: "কি"
    native: "ki (k + the short i sign)"
    reading: "ki"
    notes: "The short i sign ি (hroswo ikar) is written BEFORE the consonant but said after it: you see ি then ক, and say 'ki'. কি (ki) is 'what'."
  - id: as-0069
    target: "কী"
    native: "ki (k + the long i sign)"
    reading: "ki"
    modes: [recognition, production]
    notes: "The long i sign ী (dirgho ikar) is written after the consonant. It sounds just like কি, so it is drilled by reading and writing only: no ear or recogniser can tell them apart. Many Assamese words end in it: পানী (pani, water)."
  - id: as-0070
    target: "কু"
    native: "ku (k + the short u sign)"
    reading: "ku"
    notes: "The short u sign ু (hroswo ukar) hangs below the consonant: কুকুৰ (kukur, dog)."
  - id: as-0071
    target: "কূ"
    native: "ku (k + the long u sign)"
    reading: "ku"
    modes: [recognition, production]
    notes: "The long u sign ূ (dirgho ukar) also hangs below. It sounds just like কু, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: as-0072
    target: "কৃ"
    native: "kri (k + the ri sign)"
    reading: "kri"
    modes: [recognition, production]
    notes: "The ri sign ৃ (rikar) hangs below the consonant: কৃষক (krixok, farmer). A recogniser writes this sound as ক্ৰি, so it is drilled by reading and writing only."
  - id: as-0073
    target: "কে"
    native: "ke (k + the e sign)"
    reading: "ke"
    notes: "The e sign ে (ekar) is written BEFORE the consonant and said after it: কেতিয়া (ketiya, when)."
  - id: as-0074
    target: "কৈ"
    native: "koi (k + the oi sign)"
    reading: "koi"
    modes: [recognition, production]
    notes: "The oi sign ৈ (oikar) is also written before the consonant and said after it: কৈ দিয়ক (koi diyok), please tell me. A recogniser may write this sound as কই, so it is drilled by reading and writing only."
  - id: as-0075
    target: "কো"
    native: "ko (k + the o sign)"
    reading: "ko"
    notes: "The o sign ো (okar) comes in two parts around the consonant: ে before it and া after it. This is the closed o of 'go', and in many words it is said nearer u, as chat writes it: কোন (kun, who)."
  - id: as-0076
    target: "কৌ"
    native: "kou (k + the ou sign)"
    reading: "kou"
    modes: [recognition, production]
    notes: "The ou sign ৌ (oukar) also comes in two parts: ে before the consonant and ৗ after it: আকৌ (akou, again). A recogniser may write this sound as কউ, so it is drilled by reading and writing only."
  - id: as-0077
    target: "ক্"
    native: "k (with the hoxonto: no vowel)"
    reading: "k"
    modes: [recognition, production]
    notes: "The hoxonto ্ below a consonant takes its vowel away: ক্ is 'k' alone. Usually two consonants join into a conjunct instead, so you see it mostly in single letters and new words. A sign rather than a syllable you say, so it is drilled by reading and writing only."
  - id: as-0078
    target: "মা"
    native: "ma (m + the a sign)"
    reading: "ma"
    notes: "The same a sign on another consonant: each sign keeps its place on almost every consonant. After ৰ, শ and হ the u signs join in shapes of their own: ৰু, শু, হু. মা (ma, mother)."
  - id: as-0079
    target: "মি"
    native: "mi (m + the short i sign)"
    reading: "mi"
    notes: "The short i sign is written before ম, as before ক, and said after it: মিঠা (mitha, sweet)."
  - id: as-0080
    target: "মী"
    native: "mi (m + the long i sign)"
    reading: "mi"
    modes: [recognition, production]
    notes: "The long i sign is written after ম. It sounds just like মি, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: as-0081
    target: "মু"
    native: "mu (m + the short u sign)"
    reading: "mu"
    notes: "The short u sign hangs below ম, as below ক: মুখ (mukh, face)."
  - id: as-0082
    target: "মূ"
    native: "mu (m + the long u sign)"
    reading: "mu"
    modes: [recognition, production]
    notes: "The long u sign hangs below ম: মূৰ (mur, head). It sounds just like মু, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: as-0083
    target: "মে"
    native: "me (m + the e sign)"
    reading: "me"
    notes: "The e sign is written before ম and said after it: মেজ (mej, table)."
  - id: as-0084
    target: "মো"
    native: "mo (m + the o sign)"
    reading: "mo"
    notes: "The o sign wraps around ম in two parts, as it wraps around ক. In মোৰ (mur, my) it is said nearer u."
