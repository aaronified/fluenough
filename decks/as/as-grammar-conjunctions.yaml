      - { target: "তুমি শুনা নে?", reading: "tumi xunā ne?", ipa: "tumi xuna ne", bases: [{"word": "শুনা", "base": "শুনা", "reading": "xunā"}, {"word": "নে", "base": "নে", "reading": "ne"}, {"word": "তুমি", "base": "তুমি", "reading": "tumi"}] }
  - id: "as-2130"
    target: "কিয়নো"
    reading: "kiyônu"
    ipa: "kijɔnʊ"
    pos: "other"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "মই খাওঁ কিয়নো ভোক লাগিছে।", reading: "moi khāum̐ kiyônu bhuk lāgise.", ipa: "moi kʰaʊ̃ kijɔnʊ bʱʊk laɡise", bases: [{"word": "খাওঁ", "ref": "as-0109"}, {"word": "ভোক", "base": "ভোক", "reading": "bhuk"}, {"word": "লাগিছে", "base": "লগা", "reading": "lôgā"}] }
      - { target: "তাই দুখিত, কিয়নো বৰষুণ।", reading: "tāi dukhit, kiyônu bôroxun.", ipa: "tai dukʰit kijɔnʊ bɔɹoxun", bases: [{"word": "তাই", "ref": "as-2180"}] }
  - id: "as-2131"
    target: "সেইবাবে"
    reading: "xeibābe"
    ipa: "xeibabe"
    pos: "other"
    examples:
      - { target: "এইটো ভাল, সেইবাবে মই খাওঁ।", reading: "eitu bhāl, seibābe moi khāum̐.", ipa: "eitʊ bʱal seibabe moi kʰaʊ̃", bases: [{"word": "এইটো", "ref": "as-2193"}, {"word": "ভাল", "ref": "as-2084"}, {"word": "খাওঁ", "ref": "as-0109"}] }
      - { target: "সি ডাঙৰ, সেইবাবে ভাল।", reading: "si dāṅôr, seibābe bhāl.", ipa: "si daŋɔɹ seibabe bʱal", bases: [{"word": "সি", "ref": "as-2180"}, {"word": "ভাল", "ref": "as-2084"}] }
  - id: "as-2132"
    target: "বুলি"
    reading: "buli"
    ipa: "buli"
    pos: "other"
