    examples:
      - { target: "কাইলৈ যাব বুলি তেওঁ কৈছিল।", reading: "kāilôi zābô buli teum̐ kôisil.", ipa: "kailɔi zab buli teʊ̃ kɔisil", bases: [{"word": "কৈছিল", "ref": "as-0108"}, {"word": "যাব", "ref": "as-2200"}] }
      - { target: "তুমি আহিবা বুলি মই জানো।", reading: "tumi āhibā buli moi zānu.", ipa: "tumi ahiba buli moi zanʊ", bases: [{"word": "জানো", "ref": "as-2212"}, {"word": "আহিবা", "ref": "as-2201"}] }
  - id: "as-2133"
    target: "যদি"
    reading: "zodi"
    ipa: "zodi"
    pos: "other"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "যদি বেছি লাগে, তেন্তে কিনিম।", reading: "zodi besi lāge, tente kinim.", ipa: "zodi besi laɡe tente kinim", bases: [{"word": "কিনিম", "ref": "as-2210"}] }
      - { target: "যদি সময় থাকিলে, তেন্তে পঢ়িম।", reading: "zodi xômôy thākile, tente porhim.", ipa: "zodi xɔmɔj tʰakile tente poɹim", bases: [{"word": "থাকিলে", "ref": "as-2207"}, {"word": "পঢ়িম", "ref": "as-2203"}] }
  - id: "as-2134"
    target: "তেন্তে"
    reading: "tente"
    ipa: "tente"
    pos: "other"
    examples:
      - { target: "যদি তুমি আহিলে, তেন্তে চাহ খাম।", reading: "zodi tumi āhile, tente sāh khām.", ipa: "zodi tumi ahile tente sah kʰam", bases: [{"word": "আহিলে", "ref": "as-2201"}, {"word": "খাম", "ref": "as-0109"}] }
      - { target: "যদি তেওঁ গ'লে, তেন্তে মইও যাম।", reading: "zodi teum̐ gole, tente moiu zām.", ipa: "zodi teʊ̃ ɡole tente moiʊ zam", bases: [{"word": "গ'লে", "ref": "as-2200"}, {"word": "যাম", "ref": "as-2200"}] }
