    ipa: "kintu"
    pos: "other"
    examples:
      - { target: "ভাল, কিন্তু ডাঙৰ।", reading: "bhāl, kintu dāṅôr.", ipa: "bʱal kintu daŋɔɹ", bases: [{"word": "ভাল", "ref": "as-2084"}, {"word": "কিন্তু", "base": "কিন্তু", "reading": "kintu"}] }
      - { target: "এইটো সস্তা, কিন্তু ভাল।", reading: "eitu xôstā, kintu bhāl.", ipa: "eitʊ sɔsta kintu bʱal", bases: [] }
