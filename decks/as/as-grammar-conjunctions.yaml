      - { target: "যদিও বেয়া, তথাপি খাওঁ।", reading: "zodiu beyā, tôthāpi khāum̐.", ipa: "zodiʊ beja tɔtʰapi kʰaʊ̃", bases: [{"word": "তথাপি", "base": "তথাপি", "reading": "tôthāpi"}, {"word": "খাওঁ", "ref": "as-0109"}] }
  - id: "as-2136"
    target: "নহ'লে"
    reading: "nôhole"
    ipa: "nɔhole"
    pos: "other"
    examples:
      - { target: "খাওক, নহ'লে ঠাণ্ডা হ'ব।", reading: "khāuk, nôhole thāndā hob.", ipa: "kʰaʊk nɔhole tʰanda hob", bases: [{"word": "খাওক", "ref": "as-0109"}, {"word": "নহ'লে", "base": "নহ'লে", "reading": "nôhole"}, {"word": "হ'ব", "base": "হ'ব", "reading": "hob"}] }
      - { target: "যাওক, নহ'লে দেৰি হ'ব।", reading: "zāuk, nôhole deri hob.", ipa: "zaʊk nɔhole deɹi hob", bases: [{"word": "যাওক", "ref": "as-2200"}, {"word": "নহ'লে", "base": "নহ'লে", "reading": "nôhole"}, {"word": "হ'ব", "base": "হ'ব", "reading": "hob"}] }
