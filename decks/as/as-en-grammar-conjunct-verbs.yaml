schema: 1
id: as-en-grammar-conjunct-verbs
name: "Noun + কৰা"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Many Assamese verbs are a noun with কৰা, do, and some take খোৱা, eat, or উঠা, rise: কাম কৰা, to work; ভয় খোৱা, to be afraid. Only the verb changes. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: as-2099
    target: "কাম কৰা"
    native: "to work"
    reading: "kām kôrā"
    ipa: "kam kɔɹa"
    pos: "phrase"
    notes: "কাম, work, and কৰা, to do. Only কৰা changes: মই কাম কৰোঁ, I work; কাম কৰিলোঁ, I worked."
  - id: as-2100
    target: "ফোন কৰা"
    native: "to phone"
    reading: "phon kôrā"
    ipa: "pʰon kɔɹa"
    pos: "phrase"
    notes: "মোক ফোন কৰিব, please call me."
  - id: as-2101
    target: "সহায় কৰা"
    native: "to help"
    reading: "xôhāy kôrā"
    ipa: "xɔhaj kɔɹa"
    pos: "phrase"
    notes: "The one helped takes -ক: মোক সহায় কৰক, please help me."
  - id: as-2102
    target: "চেষ্টা কৰা"
