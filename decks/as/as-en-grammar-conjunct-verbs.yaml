id: as-en-grammar-conjunct-verbs
name: "Noun + কৰা (kôrā)"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Many Assamese verbs are a noun with কৰা (kôrā), do, and some take খোৱা (khuwā), eat, or উঠা (uthā), rise: কাম কৰা (kām kôrā), to work; ভয় খোৱা (bhôy khuwā), to be afraid. Only the verb changes. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: as-2099
    target: "কাম কৰা"
    native: "to work"
    reading: "kām kôrā"
    ipa: "kam kɔɹa"
    pos: "phrase"
    notes: "কাম (kām), work, and কৰা (kôrā), to do. Only কৰা (kôrā) changes: মই কাম কৰোঁ (moi kām kôrum̐), I work; কাম কৰিলোঁ (kām korilum̐), I worked."
  - id: as-2100
    target: "ফোন কৰা"
    native: "to phone"
    reading: "phon kôrā"
    ipa: "pʰon kɔɹa"
    pos: "phrase"
    notes: "মোক ফোন কৰিব (muk phun korib), please call me."
  - id: as-2101
    target: "সহায় কৰা"
    native: "to help"
    reading: "xôhāy kôrā"
    ipa: "xɔhaj kɔɹa"
    pos: "phrase"
    notes: "The one helped takes -ক (-kô): মোক সহায় কৰক (muk xôhāy kôrôk), please help me."
  - id: as-2102
    target: "চেষ্টা কৰা"
    native: "to try"
    reading: "sestā kôrā"
    ipa: "sesta kɔɹa"
    pos: "phrase"
  - id: as-2103
    target: "খৰচ কৰা"
    native: "to spend (money)"
    reading: "khôrôs kôrā"
    ipa: "kʰɔɹɔs kɔɹa"
    pos: "phrase"
  - id: as-2104
    target: "চাফা কৰা"
    native: "to clean"
    reading: "sāphā kôrā"
    ipa: "sapʰa kɔɹa"
    pos: "phrase"
  - id: as-2105
    target: "আৰম্ভ কৰা"
    native: "to begin"
    reading: "ārômbhô kôrā"
    ipa: "aɹɔmbʱɔ kɔɹa"
    pos: "phrase"
  - id: as-2106
    target: "পলম কৰা"
    native: "to be late; to delay"
    reading: "pôlôm kôrā"
    ipa: "pɔlɔm kɔɹa"
    pos: "phrase"
    notes: "পলম নকৰিব (pôlôm nôkorib), please don't be late."
  - id: as-2107
    target: "অপেক্ষা কৰা"
    native: "to wait"
    reading: "ôpekkhā kôrā"
    ipa: "ɔpekkʰa kɔɹa"
    pos: "phrase"
    notes: "অলপ অপেক্ষা কৰক (ôlôp ôpekkhā kôrôk), please wait a little. In speech, also ৰ (rô)'ব (robo), wait."
  - id: as-2108
    target: "কথা পতা"
    native: "to talk; to chat"
    reading: "kôthā pôtā"
    ipa: "kɔtʰa pɔta"
    pos: "phrase"
    notes: "With পতা (pôtā), not কৰা (kôrā): তেওঁৰ লগত কথা পাতিলোঁ (teum̐r lôgôt kôthā pātilum̐), I talked with him."
  - id: as-2109
    target: "ভয় খোৱা"
    native: "to be afraid"
    reading: "bhôy khuwā"
    ipa: "bʱɔj kʰʊwa"
    pos: "phrase"
    notes: "'To eat fear': মই ভয় খালোঁ (moi bhôy khālum̐), I was afraid."
  - id: as-2110
    target: "খং উঠা"
    native: "to get angry"
    reading: "khôṅ uthā"
    ipa: "kʰɔŋ utʰa"
    pos: "phrase"
    notes: "'Anger rises', and the one angry takes -ৰ (-rô): মোৰ খং উঠিল (mur khôṅ uthil), I got angry."
  - id: as-2111
    target: "মনত পৰা"
    native: "to remember; to come to mind"
    reading: "mônôt pôrā"
    ipa: "mɔnɔt pɔɹa"
    pos: "phrase"
    notes: "'To fall into the mind', and the one who remembers takes -ৰ (-rô): মোৰ মনত পৰিছে (mur mônôt porise), I remember."
  - id: as-2112
    target: "গা ধোৱা"
    native: "to bathe"
    reading: "gā dhuwā"
    ipa: "ɡa dʱʊwa"
    pos: "phrase"
    notes: "'To wash the body'."
