    ipa: "sapʰa kɔɹa"
    pos: "phrase"
  - id: as-2105
    target: "আৰম্ভ কৰা"
    native: "to begin"
    reading: "ārômbhô kôrā"
    ipa: "aɹɔmbʱɔ kɔɹa"
    pos: "phrase"
  - id: as-2106
    target: "পলম কৰা"
