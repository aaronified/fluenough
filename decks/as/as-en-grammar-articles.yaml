schema: 1
id: as-en-grammar-articles
name: "Classifiers: a and the"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Assamese has no 'a' or 'the'. A classifier does their work: -টো and -টা for things, -জন and -জনী for people, -খন for flat and large things. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: as-2041
    target: "কিতাপখন মেজৰ ওপৰত আছে।"
    native: "The book is on the table."
    reading: "kitapkhon mejor uporot ase."
    pos: "phrase"
    notes: "Assamese has no 'the': -খন after the noun does its work."
  - id: as-2042
    target: "এজন মানুহ আহিছে।"
    native: "A man has come."
    reading: "ejon manuh ahise."
    pos: "phrase"
    notes: "এজন, 'one' with -জন for a man, does the work of 'a'."
  - id: as-2043
    target: "মানুহজন আহিছে।"
    native: "The man has come."
    reading: "manuhjon ahise."
    pos: "phrase"
  - id: as-2044
    target: "ছোৱালীজনী ক'ত?"
    native: "Where is the girl?"
    reading: "suwalijoni kot?"
    pos: "phrase"
    notes: "-জনী is for a woman or a girl: এজনী ছোৱালী, a girl."
  - id: as-2045
    target: "এটা আম দিয়ক।"
    native: "A mango, please."
    reading: "eta am diyok."
    pos: "phrase"
    notes: "After a number, things take -টা: এটা, দুটা, তিনিটা. After a noun it is -টো: আমটো, the mango."
  - id: as-2046
    target: "আমবোৰ ক'ত?"
    native: "Where are the mangoes?"
    reading: "ambur kot?"
    pos: "phrase"
    notes: "-বোৰ, 'the several', makes a plural."
  - id: as-2047
    target: "দুকাপ চাহ দিয়ক।"
    native: "Two cups of tea, please."
    reading: "dukap sah diyok."
    pos: "phrase"
    notes: "With a measure, such as a cup, a kilo or a day, the number takes no classifier: দুকাপ, দুকিলো, দুদিন."
  - id: as-2048
    target: "কোনোবা আহিছে।"
    native: "Someone has come."
    reading: "kunuba ahise."
    pos: "phrase"
    notes: "কোনোবা is 'someone'; কিবা (kiba), 'something'."
  - id: as-2049
    target: "গাড়ীখন"
    native: "the car"
    reading: "garikhon"
    pos: "noun"
    notes: "-খন is for vehicles, flat things, books and places: গাড়ীখন, কিতাপখন, চহৰখন."
  - id: as-2050
    target: "কলমডাল"
    native: "the pen"
    reading: "kolomdal"
    pos: "noun"
    notes: "-ডাল is for long, thin things: a pen, a stick, a rope."
  - id: as-2051
    target: "পানীখিনি"
    native: "the water"
    reading: "panikhini"
    pos: "noun"
    notes: "-খিনি is for an amount of something you don't count: water, rice, milk."
