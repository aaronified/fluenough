schema: 1
id: as-en-grammar-articles
name: "Classifiers: a and the"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Assamese has no 'a' or 'the'. A classifier does their work: -টো (-tu) and -টা (-tā) for things, -জন (-zôn) and -জনী (-zoni) for people, -খন (-khôn) for flat and large things. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: as-2041
    target: "কিতাপখন মেজৰ ওপৰত আছে।"
    native: "The book is on the table."
    reading: "kitāpkhôn mezôr upôrôt āse."
    ipa: "kitapkʰɔn mezɔɹ ʊpɔɹɔt ase"
    pos: "phrase"
    notes: "Assamese has no 'the': -খন (-khôn) after the noun does its work."
  - id: as-2042
    target: "এজন মানুহ আহিছে।"
    native: "A man has come."
    reading: "ezôn mānuh āhise."
    ipa: "ezɔn manuh ahise"
    pos: "phrase"
    notes: "এজন (ezôn), 'one' with -জন (-zôn) for a man, does the work of 'a'."
  - id: as-2043
    target: "মানুহজন আহিছে।"
    native: "The man has come."
    reading: "mānuhzôn āhise."
    ipa: "manuhzɔn ahise"
    pos: "phrase"
  - id: as-2044
    target: "ছোৱালীজনী ক'ত?"
    native: "Where is the girl?"
    reading: "suwālizoni kot?"
    ipa: "sʊwalizoni kot"
    pos: "phrase"
    notes: "-জনী (-zoni) is for a woman or a girl: এজনী ছোৱালী (ezoni suwāli), a girl."
  - id: as-2045
    target: "এটা আম দিয়ক।"
    native: "A mango, please."
    reading: "etā ām diyôk."
    ipa: "eta am dijɔk"
    pos: "phrase"
    notes: "After a number, things take -টা (-tā): এটা (etā), দুটা (dutā), তিনিটা (tinitā). After a noun it is -টো (-tu): আমটো (āmôtu), the mango."
  - id: as-2046
    target: "আমবোৰ ক'ত?"
    native: "Where are the mangoes?"
    reading: "āmbur kot?"
    ipa: "ambʊɹ kot"
    pos: "phrase"
    notes: "-বোৰ (-bur), 'the several', makes a plural."
  - id: as-2047
    target: "দুকাপ চাহ দিয়ক।"
    native: "Two cups of tea, please."
    reading: "dukāp sāh diyôk."
    ipa: "dukap sah dijɔk"
    pos: "phrase"
    notes: "With a measure, such as a cup, a kilo or a day, the number takes no classifier: দুকাপ (dukāp), দুকিলো (dukilu), দুদিন (dudin)."
  - id: as-2048
    target: "কোনোবা আহিছে।"
    native: "Someone has come."
    reading: "kunubā āhise."
    ipa: "kʊnʊba ahise"
    pos: "phrase"
    notes: "কোনোবা (kunubā) is 'someone'; কিবা (kibā), 'something'."
  - id: as-2049
    target: "গাড়ীখন"
    native: "the car"
    picture: "🚗"
    reading: "gārikhôn"
    ipa: "ɡaɹikʰɔn"
    pos: "noun"
    notes: "-খন (-khôn) is for vehicles, flat things, books and places: গাড়ীখন (gārikhôn), কিতাপখন (kitāpkhôn), চহৰখন (sôhôrôkhôn)."
  - id: as-2050
    target: "কলমডাল"
    native: "the pen"
    picture: "🖊"
    reading: "kôlômdāl"
    ipa: "kɔlɔmdal"
    pos: "noun"
    notes: "-ডাল (-dāl) is for long, thin things: a pen, a stick, a rope."
  - id: as-2051
    target: "পানীখিনি"
    native: "the water"
    reading: "pānikhini"
    ipa: "panikʰini"
    pos: "noun"
    notes: "-খিনি (-khini) is for an amount of something you don't count: water, rice, milk."
