schema: 1
id: as-en-grammar-needs
name: "Need and want"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "লাগে, নালাগে and দৰকাৰ: what you need, what you want, and what you don't. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: as-2062
    target: "লাগে"
    native: "is needed; is wanted"
    reading: "lage"
    pos: "verb"
    notes: "It stays the same whoever needs it, and the one who needs takes -ক: মোক, তোমাক, আপোনাক … লাগে, 'to me it is needed'."
  - id: as-2063
    target: "আপোনাক কি লাগে?"
    native: "What would you like? (what a shopkeeper asks)"
    reading: "apunak ki lage?"
    pos: "phrase"
  - id: as-2064
    target: "মোক পানী লাগে।"
    native: "I'd like some water."
    reading: "muk pani lage."
    pos: "phrase"
  - id: as-2065
    target: "নালাগে"
    native: "is not needed; no, thank you"
    reading: "nalage"
    pos: "verb"
    notes: "The opposite of লাগে: মোক নালাগে, I don't want it. On its own, a polite no."
  - id: as-2066
    target: "মোক এইটো নালাগে।"
    native: "I don't want this."
    reading: "muk eitu nalage."
    pos: "phrase"
  - id: as-2067
    target: "দৰকাৰ"
    native: "need; necessary"
    reading: "dorkar"
    pos: "noun"
    notes: "The one who needs takes -ৰ: মোৰ টকাৰ দৰকাৰ, I need money, 'of me there is need of money'."
  - id: as-2068
    target: "দৰকাৰ নাই।"
    native: "There's no need."
    reading: "dorkar nai."
    pos: "phrase"
  - id: as-2069
    target: "মোক অলপ সহায় লাগে।"
    native: "I need some help."
    reading: "muk olop xohay lage."
    pos: "phrase"
  - id: as-2070
    target: "মই ঘৰলৈ যাব খুজিছোঁ।"
    native: "I want to go home."
    reading: "moi ghoroloi jabo khujisu."
    alt_target: ["মই ঘৰলৈ যাব খুজিছো।"]
    pos: "phrase"
    notes: "To want to do something: the verb in -ব, then খোজা, to want: যাব খুজিছোঁ, I want to go."
  - id: as-2071
    target: "আৰু অলপ ভাত লাগে।"
    native: "I'd like a little more rice."
    reading: "aru olop bhat lage."
    pos: "phrase"
    notes: "মোক can be left out when it is clear who needs it."
