schema: 1
id: as-en-script-reading
name: "First words to read"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Short everyday words written with letters alone, no vowel signs: the headline, ৰ, the dot below and the vowel you do not see, at work. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: as-0052
    target: "ঘৰ"
    native: "house; home"
    reading: "ghôr"
    ipa: "ɡʱɔɹ"
    pos: "noun"
    notes: "Two letters under one headline. ঘ is gho and ৰ is ro, but the last o isn't said: ghor. ঘৰত (ghôrôt), at home."
  - id: as-0053
    target: "অসম"
    native: "Assam"
    reading: "ôxôm"
    ipa: "ɔxɔm"
    pos: "noun"
    notes: "অ, স and ম, each with the open o, and the last one quiet. স is the rasp x: chat writes the name Axom. অসমীয়া (ôxomiyā) is Assamese, the language and the people."
  - id: as-0054
    target: "কলম"
    native: "pen"
    reading: "kôlôm"
    ipa: "kɔlɔm"
    pos: "noun"
    notes: "Three letters and no vowel written: ko-lo-m."
  - id: as-0055
    target: "বৰ"
    native: "very; big, great"
    reading: "bôr"
    ipa: "bɔɹ"
    pos: "adv"
    notes: "ব and then ৰ, which is ব with a slanting stroke. One of the commonest words in Assamese: বৰ ভাল (bôr bhāl), very good."
  - id: as-0056
    target: "মন"
    native: "mind; heart"
    reading: "môn"
    ipa: "mɔn"
    pos: "noun"
    notes: "ম and ন under one headline; the last o is quiet. মোৰ মন ভাল নাই (mur môn bhāl nāi), 'my heart is not well': I'm feeling low."
  - id: as-0057
    target: "ফল"
    native: "fruit; a result"
    reading: "phôl"
    ipa: "pʰɔl"
    pos: "noun"
    notes: "ফ is প with a curl and a breath after it: ph, or f."
  - id: as-0058
    target: "সময়"
    native: "time"
    reading: "xômôy"
    ipa: "xɔmɔj"
    pos: "noun"
    notes: "স is x. য় is য with a dot below, said y."
  - id: as-0059
    target: "পথ"
    native: "way; path"
    reading: "pôth"
    ipa: "pɔtʰ"
    pos: "noun"
    notes: "প and থ both have only half a headline, so the line breaks over them."
  - id: as-0060
    target: "নগৰ"
    native: "town; city"
    reading: "nôgôr"
    ipa: "nɔɡɔɹ"
    pos: "noun"
    notes: "গ has half a headline; then ৰ. A city is also চহৰ (sôhôr)."
  - id: as-0061
    target: "গৰম"
    native: "hot (weather); warm"
    reading: "gôrôm"
    ipa: "ɡɔɹɔm"
    pos: "adj"
    notes: "Hot weather or warm clothes. Hot as with chilli is জলা (zôlā)."
  - id: as-0062
    target: "দল"
    native: "group; team; party"
    reading: "dôl"
    ipa: "dɔl"
    pos: "noun"
    notes: "দ and ল, each with its o, and the last one quiet."
  - id: as-0063
    target: "নখ"
    native: "nail (of a finger)"
    reading: "nôkh"
    ipa: "nɔkʰ"
    pos: "noun"
    notes: "খ has only half a headline."
  - id: as-0064
    target: "কম"
    native: "less; a little"
    reading: "kôm"
    ipa: "kɔm"
    pos: "adj"
    notes: "Only ক and ম. With the a sign it is a different word: কাম (kām), work."
  - id: as-0065
    target: "জল"
    native: "water (formal)"
    reading: "zôl"
    ipa: "zɔl"
    pos: "noun"
    notes: "জ is said z, and chat writes it j. A bookish word: everyday water is পানী (pāni)."
  - id: as-0066
    target: "মত"
    native: "opinion; view"
    reading: "môt"
    ipa: "mɔt"
    pos: "noun"
    notes: "ত is a t with the tongue behind the teeth. আপোনাৰ মত কি? (apunar mot ki?), what do you think?"
