schema: 1
id: as-en-grammar-compound-verbs
name: "Verbs that add a shade"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The first verb in -ই, and a second after it that adds a shade: done for good, gone off, done for oneself, done for someone, tried out. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: as-2113
    target: "খাই পেলালোঁ।"
    native: "I've eaten it all up."
    reading: "khāi pelālum̐."
    ipa: "kʰai pelalʊ̃"
    alt_target: ["খাই পেলালো।"]
    pos: "phrase"
    notes: "পেলোৱা, throw, after a verb in -ই: done completely, and at once."
  - id: as-2114
    target: "কৈ পেলালোঁ।"
    native: "I've gone and said it."
    reading: "kôi pelālum̐."
    ipa: "kɔi pelalʊ̃"
    alt_target: ["কৈ পেলালো।"]
    pos: "phrase"
  - id: as-2115
    target: "পাহৰি গ'লোঁ।"
    native: "I forgot."
    reading: "pāhori golum̐."
    ipa: "pahoɹi ɡolʊ̃"
    alt_target: ["পাহৰি গ'লো।"]
    pos: "phrase"
    notes: "যোৱা, go, after a verb: a change that has happened. পাহৰা is to forget."
  - id: as-2116
    target: "সি পৰি গ'ল।"
    native: "He fell down."
    reading: "xi pori gol."
    ipa: "xi poɹi ɡol"
    pos: "phrase"
  - id: as-2117
    target: "সি গুচি গ'ল।"
    native: "He went away."
    reading: "xi gusi gol."
    ipa: "xi ɡusi ɡol"
    pos: "phrase"
  - id: as-2118
    target: "সি গ'লগৈ।"
    native: "He's gone (off)."
    reading: "xi golgôi."
    ipa: "xi ɡolɡɔi"
    pos: "phrase"
    notes: "-গৈ on a verb is 'off, away there'; -হি is 'here': সি আহিলহি (xi āhilhi), he's come (here)."
  - id: as-2119
    target: "কিনি ল'লোঁ।"
    native: "I bought it (for myself)."
    reading: "kini lolum̐."
    ipa: "kini lolʊ̃"
    alt_target: ["কিনি ল'লো।"]
    pos: "phrase"
    notes: "লোৱা, take, after a verb: for oneself."
  - id: as-2120
    target: "শিকি ল'লোঁ।"
    native: "I've learned it."
    reading: "xiki lolum̐."
    ipa: "xiki lolʊ̃"
    alt_target: ["শিকি ল'লো।"]
    pos: "phrase"
  - id: as-2121
    target: "আনি দিয়ক।"
    native: "Please fetch it (for me)."
    reading: "āni diyôk."
    ipa: "ani dijɔk"
    pos: "phrase"
    notes: "দিয়া, give, after a verb: done for someone."
  - id: as-2122
    target: "কৰি দিয়া।"
    native: "Do it for me."
    reading: "kori diyā."
    ipa: "koɹi dija"
    pos: "phrase"
    notes: "To a friend; to someone you respect, কৰি দিয়ক (kori diyôk)."
  - id: as-2123
    target: "খাই চোৱা।"
    native: "Try it; taste it."
    reading: "khāi suwā."
    ipa: "kʰai sʊwa"
    pos: "phrase"
    notes: "চোৱা, look, after a verb: try it and see."
  - id: as-2124
    target: "কৰি থাকা।"
    native: "Keep doing it."
    reading: "kori thākā."
    ipa: "koɹi tʰaka"
    pos: "phrase"
    notes: "থকা, stay, after a verb: keep on doing."
  - id: as-2125
    target: "ল'ৰাটো কান্দি উঠিল।"
    native: "The boy burst into tears."
    reading: "lorātu kāndi uthil."
    ipa: "loɹatʊ kandi utʰil"
    pos: "phrase"
    notes: "উঠা, rise, after a verb: all of a sudden."
