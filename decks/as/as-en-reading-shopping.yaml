passages:
  - id: "as-bargaining"
    title: "Bargaining at a stall"
    theme: "shopping"
    sentences:
      - text: "এইটো কিমান?"
        reading: "eitu kimān?"
      - text: "দাম বহুত বেছি।"
        reading: "dām bohut besi."
      - text: "বাৰু, আমি দুটা কিনোঁ।"
        reading: "bāru, āmi dutā kinum̐."
      - text: "ঠিক আছে।"
        reading: "ṭhik āse."
    questions:
      - id: "as-2667"
        prompt: { en: "The buyer says the price is too high." }
        answer: true
      - id: "as-2668"
        prompt: { en: "How many does the buyer take?" }
        options:
          - { en: "Two" }
          - { en: "Five" }
          - { en: "Nothing" }
        answer: 1
      - id: "as-2669"
        prompt: { en: "Does the buyer agree in the end?" }
        options:
          - { en: "Yes, all right" }
          - { en: "No, never" }
        answer: 1
  - id: "as-price-list"
    title: "A shop's price list"
    theme: "shopping"
    sentences:
      - text: "চাউল কিলো পঞ্চাশ টকা।"
        reading: "chāul kilo pônsāx tôkā."
      - text: "দাইল কিলো এশ টকা।"
        reading: "dāil kilo ex tôkā."
      - text: "আজি বিক্ৰী আছে।"
        reading: "āzi bikrī āse."
      - text: "প্লাষ্টিকৰ মোনা নাই।"
        reading: "plāstikôr mônā nāi."
    questions:
      - id: "as-2670"
        prompt: { en: "Rice costs fifty rupees a kilo." }
        answer: true
      - id: "as-2671"
        prompt: { en: "What does lentil cost a kilo?" }
        options:
          - { en: "Fifty rupees" }
          - { en: "One hundred rupees" }
          - { en: "Two hundred rupees" }
        answer: 2
      - id: "as-2672"
        prompt: { en: "What is not sold here?" }
        options:
          - { en: "Rice" }
          - { en: "Plastic bags" }
          - { en: "Lentils" }
        answer: 2
