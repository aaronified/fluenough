schema: 1
id: as-en-calendar
name: "Months and years"
kind: vocab
theme: calendar
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The months as Assamese writes them, how to read a year, and Bihu, which marks the Assamese year. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0390
    target: "মাহ"
    native: "month"
    reading: "māh"
    ipa: "mah"
    pos: "noun"
    notes: "The Assamese calendar's months, ব (bô)'হাগ (bohag) to চ (sô)'ত (sot), mark festivals and farming; daily life uses the Gregorian months."
  - id: as-0391
    target: "বছৰ"
    native: "year"
    reading: "bôsôr"
    ipa: "bɔsɔɹ"
    pos: "noun"
    notes: "A year is read as a number: 2020 is দুহাজাৰ বিশ (duhāzār bix)."
  - id: as-0392
    target: "তাৰিখ"
    native: "date"
    reading: "tārikh"
    ipa: "taɹikʰ"
    pos: "noun"
    notes: "আজি কিমান তাৰিখ? (aji kiman tarikh?), what's the date today?"
  - id: as-0393
    target: "জানুৱাৰী"
    native: "January"
    reading: "zānuwāri"
    ipa: "zanuwaɹi"
    pos: "noun"
    notes: "Assamese writes the English months with its own letters: ৱ (wô) for w, চ (sô) and ছ (sô) for s, ভ (bhô) for v."
  - id: as-0394
    target: "ফেব্ৰুৱাৰী"
    native: "February"
    reading: "phebruwāri"
    ipa: "pʰebɹuwaɹi"
    pos: "noun"
  - id: as-0395
    target: "মাৰ্চ"
    native: "March"
    reading: "mārs"
    ipa: "maɹs"
    pos: "noun"
  - id: as-0396
    target: "এপ্ৰিল"
    native: "April"
    reading: "epril"
    ipa: "epɹil"
    pos: "noun"
  - id: as-0397
    target: "মে'"
    native: "May"
    reading: "me'"
    ipa: "me"
    pos: "noun"
  - id: as-0398
    target: "জুন"
    native: "June"
    reading: "zun"
    ipa: "zun"
    pos: "noun"
  - id: as-0399
    target: "জুলাই"
    native: "July"
    reading: "zulāi"
    ipa: "zulai"
    pos: "noun"
  - id: as-0400
    target: "আগষ্ট"
    native: "August"
    reading: "āgôst"
    ipa: "aɡɔst"
    pos: "noun"
  - id: as-0401
    target: "ছেপ্তেম্বৰ"
    native: "September"
    reading: "septembôr"
    ipa: "septembɔɹ"
    pos: "noun"
  - id: as-0402
    target: "অক্টোবৰ"
    native: "October"
    reading: "ôktobôr"
    ipa: "ɔktobɔɹ"
    pos: "noun"
  - id: as-0403
    target: "নৱেম্বৰ"
    native: "November"
    reading: "nôwembôr"
    ipa: "nɔwembɔɹ"
    pos: "noun"
  - id: as-0404
    target: "ডিচেম্বৰ"
    native: "December"
    reading: "disembôr"
    ipa: "disembɔɹ"
    pos: "noun"
  - id: as-0405
    target: "বিহু"
    native: "Bihu (the festival)"
    reading: "bihu"
    ipa: "bihu"
    pos: "noun"
    notes: "Assam's festival, three times a year: ব (bô)'হাগ বিহু (bohag bihu) in mid-April brings in the new year with dancing and songs; মাঘ বিহু (māgh bihu) in January feasts after the harvest; কাতি বিহু (kāti bihu) in October lights lamps in the fields."
  - id: as-0406
    target: "ব'হাগ"
    native: "Bohag (the first Assamese month, mid-April to mid-May)"
    reading: "bohāg"
    ipa: "bohaɡ"
    pos: "noun"
    notes: "Its Bihu is also called ৰঙালী বিহু (rôṅāli bihu), the Bihu of joy."
