description: "The mistakes English speakers make most in Assamese. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: as-2148
    target: "মই পানী খাওঁ।"
    native: "I drink water."
    reading: "moi pāni khāum̐."
    ipa: "moi pani kʰaʊ̃"
    alt_target: ["মই পানী খাও।"]
    pos: "phrase"
    notes: "Assamese eats water and tea, and even cigarettes: খোৱা covers drinking and smoking. চিগাৰেট খোৱা, to smoke."
  - ref: as-2009
    notes: "With আপুনি, a request ends in -ক. তুমি বহা is for friends; তই বহ for the very close, and rude to a stranger."
  - id: as-2149
    target: "মই নাজানোঁ।"
    native: "I don't know."
    reading: "moi nāzānum̐."
    ipa: "moi nazanʊ̃"
    alt_target: ["মই নাজানো।"]
    pos: "phrase"
    notes: "'Not' on a verb is ন- before it, not a separate word: জানোঁ, I know; নাজানোঁ, I don't know."
  - id: as-2150
    target: "মোৰ ভোক লাগিছে।"
    native: "I'm hungry."
    reading: "mur bhuk lāgise."
    ipa: "mʊɹ bʱʊk laɡise"
    pos: "phrase"
    notes: "'Hunger has struck me'. So too মোৰ পিয়াহ লাগিছে, I'm thirsty."
  - id: as-2151
    target: "মই এতিয়া যাব লাগিব।"
    native: "I have to go now."
    reading: "moi etiyā zābô lāgibô."
    ipa: "moi etija zabɔ laɡibɔ"
    pos: "phrase"
    notes: "'Going will be needed': the verb in -ব, then লাগিব."
  - id: as-2152
    target: "তাই মোৰ ভনী।"
    native: "She is my younger sister."
    reading: "tāi mur bhoni."
    ipa: "tai mʊɹ bʱoni"
    pos: "phrase"
    notes: "Assamese tells an elder sibling from a younger: বাই (bāi), elder sister; ভনী, younger sister; ককাই (kôkāi), elder brother; ভাই (bhāi), younger brother."
  - id: as-2153
    target: "মোৰ দেউতা"
    native: "my father"
    reading: "mur deutā"
    ipa: "mʊɹ deuta"
    pos: "phrase"
    notes: "A word for family takes an ending for whose it is: মোৰ দেউতা, my father; তোমাৰ দেউতাৰা, your father; তাৰ দেউতাক, his father."
  - id: as-2154
    target: "তোমাৰ দেউতাৰা"
    native: "your father (familiar)"
    reading: "tumār deutārā"
    ipa: "tʊmaɹ deutaɹa"
    pos: "phrase"
    notes: "With তুমি the family word takes -ৰা: তোমাৰ মাৰা, your mother."
  - id: as-2155
    target: "তেওঁৰ দেউতাক"
    native: "his father; her father"
    reading: "teum̐r deutāk"
    ipa: "teʊ̃ɹ deutak"
    pos: "phrase"
    notes: "With সি, তাই, তেওঁ and আপুনি it takes -ক: তাৰ মাক, his mother; আপোনাৰ দেউতাক, your father."
  - id: as-2156
    target: "সি কালি আহিল।"
    native: "He came yesterday."
    reading: "xi kāli āhil."
    ipa: "xi kali ahil"
    pos: "phrase"
    notes: "কালি is yesterday, and tomorrow is কাইলৈ (kāilôi); আজি (āzi) is today."
  - id: as-2157
    target: "আপুনি ক'ত থাকে?"
    native: "Where do you live?"
    reading: "āpuni kot thāke?"
    ipa: "apuni kot tʰake"
    pos: "phrase"
    notes: "আপুনি takes the same verb form as সি, he: আপুনি থাকে, সি থাকে. With তুমি it is থাকা."
  - id: as-2158
    target: "হয়"
    native: "yes; is"
    reading: "hôy"
    ipa: "hɔj"
    pos: "other"
    notes: "হয় is 'yes', and নহয় (nôhôy) is 'no' and 'is not'."
