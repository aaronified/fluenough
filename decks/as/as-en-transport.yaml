schema: 1
id: as-en-transport
name: "Bus, auto, cab"
kind: vocab
theme: transport
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Getting a ride, agreeing the fare and getting off where you want, and the boats that cross the Brahmaputra. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0298
    target: "বাছ"
    native: "bus"
    reading: "bās"
    ipa: "bas"
    pos: "noun"
    notes: "Assamese writes the s of English words with ছ (sô) or চ (sô): বাছ (bās), bus. বাছেৰে (bāsere), by bus."
  - id: as-0299
    target: "অটো"
    native: "auto-rickshaw"
    reading: "ôto"
    ipa: "ɔto"
    pos: "noun"
    notes: "Shared autos and city buses run fixed routes in Guwahati; call out where you are going before you get in."
  - id: as-0300
    target: "টেক্সি"
    native: "taxi"
    reading: "teksi"
    ipa: "teksi"
    pos: "noun"
  - id: as-0301
    target: "ৰিক্সা"
    native: "cycle rickshaw"
    reading: "riksā"
    ipa: "ɹiksa"
    pos: "noun"
  - id: as-0302
    target: "ভাড়া"
    native: "fare"
    reading: "bhārā"
    ipa: "bʱaɹa"
    pos: "noun"
    notes: "ভাড়া কিমান? (bhara kiman?), how much is the fare? The same word is rent."
  - id: as-0303
    target: "মিটাৰ অন কৰক।"
    native: "Please put the meter on."
    reading: "mitār ôn kôrôk."
    ipa: "mitaɹ ɔn kɔɹɔk"
    pos: "phrase"
    tags: ["polite"]
    notes: "Ask before you get in. If the driver refuses, agree the fare first."
  - id: as-0304
    target: "ষ্টেচনলৈ যাব লাগে।"
    native: "I need to go to the station."
    reading: "stesônôlôi zābô lāge."
    ipa: "stesɔnɔlɔi zabɔ laɡe"
    pos: "phrase"
    notes: "-লৈ (-loi), 'to', joins the end of the place, with -অ- (-ô-) after a consonant: ঘৰলৈ (ghôrôlôi), home. যাব লাগে (zāb lāge), 'going is needed'."
  - id: as-0305
    target: "কিমান সময় লাগিব?"
    native: "How long will it take?"
    reading: "kimān xômôy lāgibô?"
    ipa: "kiman xɔmɔj laɡibɔ"
    pos: "phrase"
    notes: "Literally 'how much time will it need?'"
  - id: as-0306
    target: "ইয়াতে ৰখাই দিয়ক।"
    native: "Stop here, please."
    reading: "iyāte rôkhāi diyôk."
    ipa: "ijate ɹɔkʰai dijɔk"
    pos: "phrase"
    tags: ["polite"]
    notes: "ইয়াতে (iyāte), right here."
  - id: as-0307
    target: "ষ্টেচন"
    native: "station"
    reading: "stesôn"
    ipa: "stesɔn"
    pos: "noun"
    notes: "English st is written ষ্ট (stô), and s is চ (sô)."
  - id: as-0308
    target: "টিকট"
    native: "ticket"
    reading: "tikôt"
    ipa: "tikɔt"
    pos: "noun"
  - id: as-0309
    target: "ছিট"
    native: "seat"
    reading: "sit"
    ipa: "sit"
    pos: "noun"
    notes: "Formally আসন (āxôn)."
  - id: as-0310
    target: "ভিৰ"
    native: "a crowd; crowded"
    reading: "bhir"
    ipa: "bʱiɹ"
    pos: "noun"
    notes: "বাছত বৰ ভিৰ (bāsôt bôr bhir), the bus is very crowded."
  - id: as-0311
    target: "খালী"
    native: "empty; free (of a seat)"
    reading: "khāli"
    ipa: "kʰali"
    pos: "adj"
    notes: "এই ছিটটো খালী নেকি? (ei sittu khali neki?), is this seat free?"
  - id: as-0312
    target: "ব'লক"
    native: "let's go; please go"
    reading: "bolôk"
    ipa: "bolɔk"
    pos: "verb"
    tags: ["polite"]
    notes: "To a friend: ব (bô)'লা (bola), let's go."
  - id: as-0313
    target: "নাও"
    native: "boat"
    reading: "nāo"
    ipa: "nao"
    pos: "noun"
    notes: "Across the Brahmaputra, people and motorbikes ride the ferries, and the small motor boats are ভুটভুটী (bhutbhuti), named for the sound of their engines."
