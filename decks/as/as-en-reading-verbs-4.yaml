  - id: "as-short-story"
    title: "A short story with a turn"
    theme: "verbs-4"
    sentences:
      - text: "এটা ৰাক্ষস বনত থাকিছিল।"
        reading: "etā rākkhôx bônôt thākisil."
      - text: "এদিন সি জংগলৰ পৰা ওলাল।"
        reading: "edin si zôṅgôlôr pôrā ulāl."
      - text: "মানুহ সকলো ভয় খালে।"
        reading: "mānuh sôkôlu bhôy khāle."
      - text: "কিন্তু এজনী ছাত্ৰীয়ে সাহস কৰিলে।"
        reading: "kintu ezoni sātriye xāhôx korile."
