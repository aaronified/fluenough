    sentences:
      - text: "এদিন এজন ৰাজকুমাৰ আহিল।"
        reading: "edin ezôn rāzokumār āhil."
      - text: "তাৰ পাছত দৈত্যই খেদিলে।"
        reading: "tār pāsôt dôityoi khedile."
      - text: "শেষত ৰাজকুমাৰে বাচিল।"
        reading: "xexôt rāzokumāre bāsil."
      - text: "এইটোৱে গল্পৰ শেষ।"
        reading: "eituwe gôlpôr xex."
