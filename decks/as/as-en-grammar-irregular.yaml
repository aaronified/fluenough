schema: 1
id: as-en-grammar-irregular
name: "Irregular verbs"
kind: grammar
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The common verbs whose stem changes from tense to tense. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Irregular verbs"
  slot_name: "form"
  slots: ["present, মই", "past, মই", "future, মই", "request, তুমি", "request, আপুনি"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "A stem that ends in a vowel changes it: খা- gives খাওঁ, খালোঁ, খাম, and with তুমি খোৱা; ক- gives কওঁ, ক'লোঁ and কোৱা. যোৱা takes গ'- in the past: গ'লোঁ, I went. The verb noun, the form a dictionary lists, often changes its vowel too: থাক-, stay, gives থকা; আহ-, come, gives অহা. A request to আপুনি ends in -ক or -ওক: আহক, বহক, খাওক. The ending -ওঁ is also written -ো, without ঁ, and both are accepted."
  entries:
    - lemma: "যোৱা"
      key: juwa
      reading: "zuwā"
      ipa: "zʊwa"
      gloss: "to go"
      forms:
        "present, মই": ["যাওঁ", "যাও"]
        "past, মই": ["গ'লোঁ", "গ'লো"]
        "future, মই": "যাম"
        "request, তুমি": "যোৱা"
        "request, আপুনি": "যাওক"
      readings:
        "present, মই": ["zāum̐", "zāu"]
        "past, মই": ["golum̐", "golu"]
        "future, মই": "zām"
        "request, তুমি": "zuwā"
        "request, আপুনি": "zāuk"
      ipas:
        "present, মই": "zaʊ̃"
        "past, মই": "ɡolʊ̃"
        "future, মই": "zam"
        "request, তুমি": "zʊwa"
        "request, আপুনি": "zaʊk"
    - lemma: "অহা"
      key: oha
      reading: "ôhā"
      ipa: "ɔha"
      gloss: "to come"
      forms:
        "present, মই": ["আহোঁ", "আহো"]
        "past, মই": ["আহিলোঁ", "আহিলো"]
        "future, মই": "আহিম"
        "request, তুমি": "আহা"
        "request, আপুনি": "আহক"
      readings:
        "present, মই": ["āhum̐", "āhu"]
        "past, মই": ["āhilum̐", "āhilu"]
        "future, মই": "āhim"
        "request, তুমি": "āhā"
        "request, আপুনি": "āhôk"
      ipas:
        "present, মই": "ahʊ̃"
        "past, মই": "ahilʊ̃"
        "future, মই": "ahim"
        "request, তুমি": "aha"
        "request, আপুনি": "ahɔk"
