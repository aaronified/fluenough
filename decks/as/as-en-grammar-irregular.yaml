      forms:
        "present, মই": ["থাকোঁ", "থাকো"]
        "past, মই": ["থাকিলোঁ", "থাকিলো"]
        "future, মই": "থাকিম"
        "request, তুমি": "থাকা"
        "request, আপুনি": "থাকক"
      readings:
        "present, মই": ["thaku", "thaku"]
        "past, মই": ["thakilu", "thakilu"]
