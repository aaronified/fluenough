schema: 1
id: as-en-grammar-irregular
name: "Irregular verbs"
kind: grammar
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The common verbs whose stem changes from tense to tense. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Irregular verbs"
  slot_name: "form"
  slots: ["present, মই (moi)", "past, মই (moi)", "future, মই (moi)", "request, তুমি (tumi)", "request, আপুনি (āpuni)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "A stem that ends in a vowel changes it: খা- (khā-) gives খাওঁ (khāum̐), খালোঁ (khālum̐), খাম (khām), and with তুমি খোৱা (tumi khuwā); ক- (kô-) gives কওঁ (kôum̐), ক (kô)'লোঁ (lum̐) and কোৱা (kuwā). যোৱা (zuwā) takes গ (gô)'- in the past: গ (gô)'লোঁ (lum̐), I went. The verb noun, the form a dictionary lists, often changes its vowel too: থাক- (thāk-), stay, gives থকা (thôkā); আহ- (āh-), come, gives অহা (ôhā). A request to আপুনি (āpuni) ends in -ক (-kô) or -ওক (-uk): আহক (āhôk), বহক (bôhôk), খাওক (khāuk). The ending -ওঁ (-um̐) is also written -ো (u), without ঁ (ôm̐), and both are accepted."
  entries:
    - lemma: "যোৱা"
      key: juwa
      reading: "zuwā"
      ipa: "zʊwa"
      gloss: "to go"
      forms:
        "present, মই (moi)": ["যাওঁ", "যাও"]
        "past, মই (moi)": ["গ'লোঁ", "গ'লো"]
        "future, মই (moi)": "যাম"
        "request, তুমি (tumi)": "যোৱা"
        "request, আপুনি (āpuni)": "যাওক"
      readings:
        "present, মই (moi)": ["zāum̐", "zāu"]
        "past, মই (moi)": ["golum̐", "golu"]
        "future, মই (moi)": "zām"
        "request, তুমি (tumi)": "zuwā"
        "request, আপুনি (āpuni)": "zāuk"
      ipas:
        "present, মই (moi)": "zaʊ̃"
        "past, মই (moi)": "ɡolʊ̃"
        "future, মই (moi)": "zam"
        "request, তুমি (tumi)": "zʊwa"
        "request, আপুনি (āpuni)": "zaʊk"
    - lemma: "অহা"
      key: oha
      reading: "ôhā"
      ipa: "ɔha"
      gloss: "to come"
      forms:
        "present, মই (moi)": ["আহোঁ", "আহো"]
        "past, মই (moi)": ["আহিলোঁ", "আহিলো"]
        "future, মই (moi)": "আহিম"
        "request, তুমি (tumi)": "আহা"
        "request, আপুনি (āpuni)": "আহক"
      readings:
        "present, মই (moi)": ["āhum̐", "āhu"]
        "past, মই (moi)": ["āhilum̐", "āhilu"]
        "future, মই (moi)": "āhim"
