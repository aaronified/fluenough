schema: 1
id: as-en-script-conjuncts
name: "Assamese conjuncts"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Two consonants with no vowel between them are written joined. These are the ones a beginner meets first, each in an everyday word, with ৰ as a stroke below or a hook on top. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: as-0085
    target: "ক্ষ"
    native: "k + murdhonyo xo, said kkh"
    reading: "kkhô"
    ipa: "kkʰɔ"
    notes: "Looks nothing like its parts, and the Assamese alphabet counts it as a letter of its own. It is said 'kkh' inside a word, and 'kh' at the start: শিক্ষক (xikkhôk, teacher), ক্ষমা (khômā, forgiveness)."
  - id: as-0086
    target: "জ্ঞ"
    native: "j + ny, said gy"
    reading: "gyô"
    ipa: "ɡjɔ"
    notes: "Looks nothing like its parts. It is said 'gy': জ্ঞান (gyān, knowledge)."
  - id: as-0087
    target: "ক্ত"
    native: "k + t"
    reading: "ktô"
    ipa: "ktɔ"
    notes: "ক and ত joined: ৰক্ত (rôktô, blood)."
  - id: as-0088
    target: "ক্ৰ"
    native: "k + the r-sign"
    reading: "krô"
    ipa: "kɹɔ"
    notes: "A ৰ after a consonant is written as a stroke below it, the r-sign (ৰ-ফলা): ক্ৰিকেট (kriket, cricket)."
  - id: as-0089
    target: "প্ৰ"
    native: "p + the r-sign"
    reading: "prô"
    ipa: "pɹɔ"
    notes: "The r-sign below প: প্ৰেম (prem, love)."
  - id: as-0090
    target: "ত্ৰ"
    native: "t + the r-sign"
    reading: "trô"
    ipa: "tɹɔ"
    notes: "The r-sign below ত: ছাত্ৰ (sātrô, student)."
  - id: as-0091
    target: "ব্ৰ"
    native: "b + the r-sign"
    reading: "brô"
    ipa: "bɹɔ"
    notes: "The r-sign below ব: ব্ৰহ্মপুত্ৰ (bromhoputro), the great river of Assam, which has ত্ৰ at its end as well."
  - id: as-0092
    target: "ৰ্ম"
    native: "the r-hook + m"
    reading: "rmô"
    ipa: "ɹmɔ"
    notes: "A ৰ before another consonant is written as a small hook on top of it, the reph (ৰেফ): কৰ্ম (kôrmô, work; a deed), ধৰ্ম (dhôrmô, religion)."
  - id: as-0093
    target: "ন্ত"
    native: "n + t"
    reading: "ntô"
    ipa: "ntɔ"
    notes: "ন and ত joined: শান্ত (xāntô, calm; quiet)."
  - id: as-0094
    target: "ন্দ"
    native: "n + d"
    reading: "ndô"
    ipa: "ndɔ"
    notes: "ন and দ joined: সুন্দৰ (xundôr, beautiful)."
  - id: as-0095
    target: "স্ত"
    native: "s + t"
    reading: "stô"
    ipa: "stɔ"
    notes: "Before t, স is said 's', not x: ৰাস্তা (rāstā, road)."
  - id: as-0096
    target: "স্থ"
    native: "s + th"
    reading: "sthô"
    ipa: "stʰɔ"
    notes: "স and থ joined, with স said 's': স্থান (sthān, place)."
  - id: as-0097
    target: "স্ক"
    native: "s + k"
    reading: "skô"
    ipa: "skɔ"
    notes: "স and ক joined, with স said 's': নমস্কাৰ (nômôskār, hello), স্কুল (skul, school)."
  - id: as-0098
    target: "ষ্ট"
    native: "murdhonyo xo + t, said st"
    reading: "stô"
    ipa: "stɔ"
    notes: "Assamese writes the st of English words with ষ্ট: ষ্টেচন (stesôn, station). Before t it is said 's'."
  - id: as-0099
    target: "ঞ্চ"
    native: "ny + s, said ns"
    reading: "nsô"
    ipa: "nsɔ"
    notes: "ঞ and চ joined, said 'ns', since চ is s: পঞ্চাশ (pônsāx, fifty)."
  - id: as-0100
    target: "ঙ্ক"
    native: "ng + k"
    reading: "ṅkô"
    ipa: "ŋkɔ"
    notes: "ঙ and ক joined: অঙ্ক (ôṅkô, sum; maths)."
  - id: as-0101
    target: "ল্প"
    native: "l + p"
    reading: "lpô"
    ipa: "lpɔ"
    notes: "ল and প joined: গল্প (gôlpô, story)."
  - id: as-0102
    target: "ব্য"
    native: "b + the y-sign"
    reading: "byô"
    ipa: "bjɔ"
    notes: "A য after a consonant is written as the y-sign (য-ফলা): ব্যস্ত (byôstô, busy)."
  - id: as-0103
    target: "ন্ন"
    native: "n + n"
    reading: "nnô"
    ipa: "nnɔ"
    modes: [recognition, production]
    notes: "Two ন joined: ভিন্ন (bhinnô, different). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  - id: as-0104
    target: "ত্ত"
    native: "t + t"
    reading: "ttô"
    ipa: "ttɔ"
    modes: [recognition, production]
    notes: "Two ত joined: উত্তৰ (uttôr, answer; north). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  - id: as-0105
    target: "দ্ধ"
    native: "d + dh"
    reading: "ddhô"
    ipa: "ddʱɔ"
    modes: [recognition, production]
    notes: "দ and ধ joined: যুদ্ধ (zuddhô, war). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  - id: as-0106
    target: "ল্ল"
    native: "l + l"
    reading: "llô"
    ipa: "llɔ"
    modes: [recognition, production]
    notes: "Two ল joined, one above the other: ষোল্ল (xullô, sixteen), চল্লিশ (sollix, forty). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  - id: as-0107
    target: "ব্ব"
    native: "b + b"
    reading: "bbô"
    ipa: "bbɔ"
    modes: [recognition, production]
    notes: "Two ব joined: নব্বৈ (nôbbôi, ninety). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
