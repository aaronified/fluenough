schema: 1
id: as-en-script-consonants
name: "Assamese consonants"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Every consonant, each carrying its vowel o, then the dotted letters and the three marks for nasals and breath, on ক (kô). Assamese says many letters alike: স (xô), শ (xô) and ষ (xô) are all x, চ (sô) and ছ (sô) are s, জ (zô) and য (zô) are z, and ত (tô) and ট (tô) are one t. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: as-0012
    target: "ক"
    native: "k (kô)"
    reading: "kô"
    ipa: "kɔ"
    notes: "Like the 'k' of 'skin', with no puff of breath after it. Every consonant carries the open vowel o (অ) unless a sign changes it."
  - id: as-0013
    target: "খ"
    native: "kh, with a breath (khô)"
    reading: "khô"
    ipa: "kʰɔ"
    notes: "ক (kô) with a puff of breath after it, as in the 'kh' of 'blockhead': খাৰ (khār), the alkaline dish every Assamese meal starts with. Don't confuse it with the rasp x of স (xô)."
  - id: as-0014
    target: "গ"
    native: "g (gô)"
    reading: "gô"
    ipa: "ɡɔ"
    notes: "Like the 'g' of 'go': গছ (gôs, tree)."
  - id: as-0015
    target: "ঘ"
    native: "gh, with a breath (ghô)"
    reading: "ghô"
    ipa: "ɡʱɔ"
    notes: "গ (gô) with a breath after it, as in the 'gh' of 'doghouse': ঘৰ (ghôr, house; home)."
  - id: as-0016
    target: "ঙ"
    native: "ng (as in 'singer')"
    reading: "ṅô"
    ipa: "ŋɔ"
    notes: "The 'ng' of 'singer'. Assamese has it between vowels, where Bengali often writes ং (ôṅ): ৰঙা (rôṅā, red), ডাঙৰ (dāṅôr, big). It never starts a word."
  - id: as-0017
    target: "চ"
    native: "s (prothom so, 'the first s')"
    reading: "sô"
    ipa: "sɔ"
    notes: "Said s, not the 'ch' it is in Bengali and Hindi: চাহ (sāh, tea). Assamese writes English s with it too: অফিচ (ôphis, office)."
  - id: as-0018
    target: "ছ"
    native: "s (ditiyo so, 'the second s')"
    reading: "sô"
    ipa: "sɔ"
    modes: [recognition, production]
    notes: "Sounds just like চ (sô), s: ছবি (sobi, picture). Once it had a breath after it; Assamese lost it. Because it sounds the same, it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: as-0019
    target: "জ"
    native: "j, said z (borgiyo jo)"
    reading: "zô"
    ipa: "zɔ"
    notes: "Said z, as in 'zoo', not the 'j' of 'judge', though chat writes it j: জোন (zun, moon). It is called borgiyo jo, 'the j of the rows', to tell it from য (zô), which sounds the same."
  - id: as-0020
    target: "ঝ"
    native: "j, with a breath (zô)"
    reading: "zô"
    ipa: "zɔ"
    modes: [recognition, production]
    notes: "জ (zô) with a breath after it in careful speech, though most people say it as z. It is rare, in words from Sanskrit and Hindi. Because it sounds like জ (zô), it is drilled by reading and writing only."
  - id: as-0021
    target: "ঞ"
    native: "ny (in conjuncts)"
    reading: "ñô"
    ipa: "ɲɔ"
    modes: [recognition, production]
    notes: "A nasal made against the palate. You see it almost only in conjuncts such as ঞ্চ (nsô) and ঞ্জ (nz), where it sounds like n: পঞ্চাশ (pônsāx, fifty). Hardly ever heard on its own, so it is drilled by reading and writing only."
  - id: as-0022
    target: "ট"
    native: "t (to, of the ট (tô) row)"
    reading: "tô"
    ipa: "tɔ"
    modes: [recognition, production]
    notes: "In Bengali and Hindi the tongue curls back for ট (tô). Assamese says ট (tô) and ত (tô) alike, with the tongue on the ridge behind the teeth, just where English says 't': টকা (tôkā, rupee; money). Because it sounds like ত (tô), it is drilled by reading and writing only."
  - id: as-0023
    target: "ঠ"
    native: "th, with a breath (tho, of the ট (tô) row)"
    reading: "thô"
    ipa: "tʰɔ"
    modes: [recognition, production]
    notes: "ট (tô) with a breath after it, said just like থ (thô): ঠাই (thāi, place). Because it sounds the same, it is drilled by reading and writing only."
  - id: as-0024
    target: "ড"
    native: "d (do, of the ট (tô) row)"
    reading: "dô"
    ipa: "dɔ"
    modes: [recognition, production]
    notes: "Said just like দ (dô), with the tongue on the ridge behind the teeth: ডাক্তৰ (dāktôr, doctor). Because it sounds the same, it is drilled by reading and writing only."
  - id: as-0025
    target: "ঢ"
    native: "dh, with a breath (dho, of the ট (tô) row)"
    reading: "dhô"
    ipa: "dʱɔ"
    modes: [recognition, production]
    notes: "ড (dô) with a breath after it, said just like ধ (dhô): ঢোল (dhul), the drum of Bihu. Because it sounds the same, it is drilled by reading and writing only."
  - id: as-0026
    target: "ণ"
    native: "n (murdhonyo no)"
    reading: "nô"
    ipa: "nɔ"
    modes: [recognition, production]
    notes: "Sounds just like ন (nô): murdhonyo means 'curled back', as it once was. It is a spelling, mostly in words from Sanskrit and in সোণ (xun, gold; and, to a child, 'dear'). Because it sounds the same, it is drilled by reading and writing only."
  - id: as-0027
    target: "ত"
    native: "t (tô)"
    reading: "tô"
    ipa: "tɔ"
    notes: "Like the 't' of 'stop', with no puff of breath, the tongue on the ridge behind the teeth: তুমি (tumi, you). Assamese says ট (tô) the same way."
  - id: as-0028
    target: "থ"
    native: "th, with a breath (thô)"
    reading: "thô"
    ipa: "tʰɔ"
    notes: "ত (tô) with a breath after it. Not the 'th' of 'thin': কথা (kôthā, a word; talk)."
  - id: as-0029
    target: "দ"
    native: "d (dô)"
    reading: "dô"
    ipa: "dɔ"
    notes: "Like the 'd' of 'day': দেউতা (deutā, father)."
  - id: as-0030
    target: "ধ"
    native: "dh, with a breath (dhô)"
    reading: "dhô"
    ipa: "dʱɔ"
    notes: "দ (dô) with a breath after it. Not the 'th' of 'this': ধান (dhān, paddy, rice still in its husk)."
  - id: as-0031
    target: "ন"
    native: "n (donto no)"
    reading: "nô"
    ipa: "nɔ"
    notes: "The 'n' of 'no'. Donto means 'of the teeth', to tell it from ণ (nô), which sounds the same: নাম (nām, name)."
  - id: as-0032
    target: "প"
    native: "p (pô)"
    reading: "pô"
    ipa: "pɔ"
    notes: "Like the 'p' of 'spin', with no puff of breath: পানী (pāni, water)."
  - id: as-0033
    target: "ফ"
    native: "ph, with a breath (phô)"
    reading: "phô"
    ipa: "pʰɔ"
    notes: "প (pô) with a breath after it. Many speakers say it like English 'f', and Assamese writes English f with it: ফুল (phul, flower). Chat writes it ph or f."
  - id: as-0034
    target: "ব"
    native: "b (bô)"
    reading: "bô"
    ipa: "bɔ"
    notes: "Like the 'b' of 'boy': বিহু (bihu), the great festival of Assam. Compare ৰ (rô), which is ব (bô) with a slanting stroke inside."
  - id: as-0035
    target: "ভ"
    native: "bh, with a breath (bhô)"
    reading: "bhô"
    ipa: "bʱɔ"
    notes: "ব (bô) with a breath after it: ভাত (bhāt, cooked rice). Assamese writes English v with it: ড্ৰাইভাৰ (drāibhār, driver)."
  - id: as-0036
    target: "ম"
    native: "m (mô)"
    reading: "mô"
    ipa: "mɔ"
    notes: "Like the 'm' of 'mother': মাছ (mās, fish), the heart of an Assamese meal."
  - id: as-0037
    target: "য"
    native: "j, said z (ontostho jo)"
    reading: "zô"
    ipa: "zɔ"
    modes: [recognition, production]
    notes: "At the start of a word it sounds just like জ (zô), z: যোৱা (zuwā, to go). After another consonant it is written as the y-sign (য-ফলা), as in ব্য (byô). Because it sounds the same as জ (zô), it is drilled by reading and writing only."
  - id: as-0038
    target: "ৰ"
    native: "r (rô)"
    reading: "rô"
    ipa: "ɹɔ"
    notes: "Assamese's own r: ব (bô) with a slanting stroke across it. Bengali writes র (rô) instead, ব (bô) with a dot below, so text typed on a Bengali keyboard sometimes shows র (rô) where ৰ (rô) belongs. Said with a light touch of the tongue, often a little like English 'r': ৰাতি (rāti, night)."
  - id: as-0039
    target: "ল"
    native: "l (lô)"
    reading: "lô"
    ipa: "lɔ"
    notes: "A clear 'l', as at the start of 'leaf': লাহে লাহে (lāhe lāhe, slowly, gently), a phrase Assam lives by."
  - id: as-0040
    target: "ৱ"
    native: "w (ontostho wo)"
    reading: "wô"
    ipa: "wɔ"
    notes: "Assamese's own w: ব (bô) with a stroke below. Bengali has no such letter. It comes mostly between vowels: খোৱা (khuwā, to eat)."
  - id: as-0041
    target: "শ"
    native: "x (talobyo xo)"
    reading: "xô"
    ipa: "xɔ"
    modes: [recognition, production]
    notes: "Said x, just like স (xô): শনিবাৰ (xonibār, Saturday). Not the 'sh' of Bengali and Hindi. Because it sounds the same as স (xô), it is drilled by reading and writing only."
  - id: as-0042
    target: "ষ"
    native: "x (murdhonyo xo)"
    reading: "xô"
    ipa: "xɔ"
    modes: [recognition, production]
    notes: "Said x, just like স (xô). It is a spelling, mostly in words from Sanskrit: ভাষা (bhāxā, language). Because it sounds the same, it is drilled by reading and writing only."
  - id: as-0043
    target: "স"
    native: "x, a rasp at the back of the mouth (donto xo)"
    reading: "xô"
    ipa: "xɔ"
    notes: "Assamese's best-known sound: not s but x, a rasp at the back of the mouth, like the 'ch' of Scottish 'loch' or German 'Bach'. That is why Assam, অসম (ôxôm), is typed Axom: সাত (xāt, seven). Next to t, th or k it is s: ৰাস্তা (rāstā, road)."
  - id: as-0044
    target: "হ"
    native: "h (hô)"
    reading: "hô"
    ipa: "hɔ"
    notes: "Like the 'h' of 'hat': হাত (hāt, hand). Keep it apart from the rasp of স (xô): সাত (xāt) is seven."
  - id: as-0045
    target: "ড়"
    native: "r, written ড (dô) with a dot below"
    reading: "rô"
    ipa: "ɹɔ"
    modes: [recognition, production]
    notes: "ড (dô) with a dot below. In Assamese it sounds like ৰ (rô), and only a few words use it: ঘড়ী (ghori, clock; watch). It never starts a word. Because it sounds like ৰ (rô), it is drilled by reading and writing only."
  - id: as-0046
    target: "ঢ়"
    native: "rh, written ঢ (dhô) with a dot below"
    reading: "rhô"
    ipa: "ɹɔ"
    modes: [recognition, production]
    notes: "ঢ (dhô) with a dot below: an r with a breath after it. It never starts a word: পঢ়া (pôrhā, to read; to study). It is rare, so it is drilled by reading and writing only."
  - id: as-0047
    target: "য়"
    native: "y (ontostho yo)"
    reading: "yô"
    ipa: "jɔ"
    notes: "য (zô) with a dot below: a 'y' glide between vowels. It never starts a word: কেতিয়া (ketiyā, when)."
  - id: as-0048
    target: "ৎ"
    native: "t, with no vowel (khondo to)"
    reading: "t"
    ipa: "t"
    notes: "A t that ends a syllable with no vowel after it: হঠাৎ (hôthāt, suddenly), উৎসৱ (utxôw, festival)."
  - id: as-0049
    target: "কং"
    native: "ng after a vowel (onuswar), on ক (kô)"
    reading: "kôṅ"
    ipa: "kɔŋ"
    modes: [recognition, production]
    notes: "ং (onuswar) after a vowel is said 'ng': কং (kôṅ) is 'kong', as in ৰং (rôṅ, colour). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: as-0050
    target: "কঃ"
    native: "the breath mark (bixorgo), on ক (kô)"
    reading: "kôḥ"
    ipa: "kɔh"
    modes: [recognition, production]
    notes: "ঃ (bixorgo) is rare, in words from Sanskrit: দুঃখিত (dukhitô, sorry). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: as-0051
    target: "কাঁ"
    native: "nasal vowel mark (sondrobindu), on কা (kā)"
    reading: "kām̐"
    ipa: "kã"
    modes: [recognition, production]
    notes: "ঁ (sondrobindu) above a letter makes its vowel nasal, said through the nose as well: কাঁহ (kām̐h), the bell metal of Sarthebari. With it or without it are different words: বাহ (bāh, nest), বাঁহ (bām̐h, bamboo, said through the nose). Chat leaves it out, and so do these readings. A mark rather than a sound of its own, so it is drilled by reading and writing only."
