schema: 1
id: as-en-script-vowels
name: "Assamese vowels"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The eleven vowels as they are written on their own: at the start of a word, or after another vowel. Assamese shares them with Bengali. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: as-0001
    target: "অ"
    native: "o, open (the vowel every consonant carries)"
    reading: "o"
    notes: "Said with the mouth open, like the 'o' of British 'hot' or the 'aw' of 'law'. Every consonant carries it unless a sign changes it: ক is 'ko'. On its own it starts a word: অসম (oxom, Assam), which chat writes Axom."
  - id: as-0002
    target: "আ"
    native: "a (as in 'father')"
    reading: "a"
    notes: "Like the 'a' of 'father', never the 'a' of 'cat': আম (am, mango). Assamese has no long and short vowels, so hold it no longer than any other."
  - id: as-0003
    target: "ই"
    native: "i, short form (hroswo i)"
    reading: "i"
    notes: "Like the 'ee' of 'see': ইয়াত (iyat, here). Assamese writes i two ways, short and long, but both sound the same: which one a word takes is spelling."
  - id: as-0004
    target: "ঈ"
    native: "i, long form (dirgho i)"
    reading: "i"
    modes: [recognition, production]
    notes: "Sounds just like ই, the 'ee' of 'see'. The long form is kept from Sanskrit spelling: ঈদ (id, Eid). Because it sounds the same, it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: as-0005
    target: "উ"
    native: "u, short form (hroswo u)"
    reading: "u"
    notes: "Like the 'oo' of 'food': উজু (uju, easy). As with i, the short and long forms of u sound the same."
  - id: as-0006
    target: "ঊ"
    native: "u, long form (dirgho u)"
    reading: "u"
    modes: [recognition, production]
    notes: "Sounds just like উ. It is rare: ঊষা (uxa, dawn), and the number ঊনৈশ (unoix, nineteen). Because it sounds the same, it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: as-0007
    target: "ঋ"
    native: "ri (a vowel letter)"
    reading: "ri"
    modes: [recognition, production]
    notes: "Said 'ri', as at the start of 'river', though it is written as one vowel. It comes in words from Sanskrit: ঋতু (ritu, season). A recogniser writes this sound as ৰি, so it is drilled by reading and writing only."
  - id: as-0008
    target: "এ"
    native: "e (as in 'café'; often 'e' as in 'bed')"
    reading: "e"
    notes: "Usually the 'e' of 'café', without the glide of English 'say'. In many words it is opener, like the 'e' of 'bed': এক (ek, one). The spelling doesn't show which."
  - id: as-0009
    target: "ঐ"
    native: "oi (as in 'boy')"
    reading: "oi"
    modes: [recognition, production]
    notes: "A glide from o to i, like the 'oy' of 'boy'. It is rare at the start of a word: ঐক্য (oikyo, unity). A recogniser often writes this sound as অই, so it is drilled by reading and writing only."
  - id: as-0010
    target: "ও"
    native: "o, closed (as in 'go'; often close to u)"
    reading: "o"
    notes: "Like the 'o' of 'go', without the 'w' English adds at the end: হোটেল (hotel, hotel). In many everyday words it is said closer to u, and chat writes it u: মোৰ (mur, my). Don't confuse it with অ, the open o."
  - id: as-0011
    target: "ঔ"
    native: "ou (o gliding to u)"
    reading: "ou"
    modes: [recognition, production]
    notes: "A glide from o to u, as in 'go' run into 'oo'. It is rare: ঔষধ (ouxodh, medicine, a formal word; people say দৰব). A recogniser often writes this sound as অউ, so it is drilled by reading and writing only."
