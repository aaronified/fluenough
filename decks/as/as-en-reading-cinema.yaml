tags: ["unreviewed"]
passages:
  - id: "as-after-the-film"
    title: "Friends talk about a film they saw"
    theme: "cinema"
    sentences:
      - text: "কালি এটা ফিল্ম দেখিলোঁ।"
        reading: "kāli etā philm dekhilōm̐."
      - text: "নায়ক ভাল আছিল।"
        reading: "nāyôk bhāl āsil."
      - text: "কাহিনী দীঘল আছিল।"
        reading: "kāhinī dighôl āsil."
      - text: "সংলাপ ভাল লাগিল।"
        reading: "xôṅlāp bhāl lāgil."
    questions:
      - id: "as-3595"
        prompt: { en: "The speaker saw a film yesterday." }
        answer: true
      - id: "as-3596"
        prompt: { en: "What did the speaker think of the hero?" }
        options:
          - { en: "He was good" }
          - { en: "He was bad" }
          - { en: "He was missing" }
        answer: 1
      - id: "as-3597"
        prompt: { en: "What did the speaker like?" }
        options:
          - { en: "The dialogue" }
          - { en: "The ticket" }
          - { en: "The seat" }
        answer: 1
  - id: "as-film-review"
    title: "A short film review"
    theme: "cinema"
    sentences:
      - text: "এই ফিল্মটো নতুন।"
        reading: "ei philmtu nôtun."
      - text: "দৃশ্য ধুনীয়া আৰু পৰিচালক ভাল।"
        reading: "drixyô dhuniyā āru porixālôk bhāl."
      - text: "অভিনেত্ৰীয়ে ভাল অভিনয় কৰিছে।"
        reading: "ôbhinetrīye bhāl ôbhinôy kôrise."
      - text: "মই দুটা তাৰা দিম।"
        reading: "moi dutā tārā dim."
    questions:
      - id: "as-3598"
        prompt: { en: "The film is new." }
        answer: true
      - id: "as-3599"
        prompt: { en: "Who is praised for good acting?" }
        options:
          - { en: "The actress" }
          - { en: "The cook" }
          - { en: "The driver" }
        answer: 1
      - id: "as-3600"
        prompt: { en: "How many stars does the reviewer give?" }
        options:
          - { en: "One" }
          - { en: "Two" }
          - { en: "Five" }
        answer: 2
