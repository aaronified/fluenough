schema: 1
id: as-en-grammar-differences
name: "How Assamese grammar differs from English"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Before any theme: the verb last, no is, endings for in, to and of, a doer's -এ (-e), no gender in the verb, three yous, classifiers for a and the, and how Assamese says have, not and questions. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: as-2001
    target: "মই ভাত খাওঁ।"
    native: "I eat rice."
    reading: "moi bhāt khāum̐."
    ipa: "moi bʱat kʰaʊ̃"
    alt_target: ["মই ভাত খাও।"]
    tags: ["grammar", "word-order"]
    notes: "The verb comes last: subject, object, verb. Word for word, 'I rice eat'."
  - id: as-2002
    target: "তেওঁ ডাক্তৰ।"
    native: "He is a doctor. / She is a doctor."
    reading: "teum̐ dāktôr."
    ipa: "teʊ̃ daktɔɹ"
    tags: ["grammar", "no-is"]
    notes: "No word for 'am', 'is' or 'are' when saying what someone is: 'he doctor'. Where someone is, or how they are, takes আছে (āse): মই ভালে আছোঁ (moi bhāle āsum̐), I'm well."
  - id: as-2003
    target: "ঘৰত"
    native: "at home; in the house"
    reading: "ghôrôt"
    ipa: "ɡʱɔɹɔt"
    tags: ["grammar", "case-endings"]
    notes: "Assamese puts 'in' and 'at' after the noun, as an ending: ঘৰ (ghôr, house) + -ত (-tô)."
  - id: as-2004
    target: "বজাৰলৈ"
    native: "to the market"
    reading: "bôzārôlôi"
    ipa: "bɔzaɹɔlɔi"
    tags: ["grammar", "case-endings"]
    notes: "'To' a place is the ending -লৈ (-lôi): বজাৰ (bôzār, market) + -লৈ (-lôi)."
  - id: as-2005
    target: "দেউতাৰ কিতাপ"
    native: "father's book"
    reading: "deutār kitāp"
    ipa: "deutaɹ kitap"
    tags: ["grammar", "case-endings"]
    notes: "'Of' is the ending -ৰ (-rô) on the owner, who comes first: দেউতা (deutā, father) + -ৰ (-rô)."
  - id: as-2006
    target: "ৰামে ভাত খালে।"
    native: "Ram ate rice."
    reading: "rāme bhāt khāle."
    ipa: "ɹame bʱat kʰale"
    tags: ["grammar", "doer"]
    notes: "A noun that does something to something takes -এ (-e): ৰাম (rām) + -এ (-e). After a vowel it is -ই (-i) or -য়ে (-ye): দেউতাই (deutāi), মায়ে (māye). Most pronouns, such as মই (moi) and সি (si), do not take it."
  - id: as-2007
    target: "সি আহিল।"
    native: "He came."
    reading: "xi āhil."
    ipa: "xi ahil"
    tags: ["grammar", "gender"]
    notes: "সি (si) is 'he'. The verb আহিল (āhil), 'came', is the same for a man, a woman or a thing."
  - id: as-2008
    target: "তাই আহিল।"
    native: "She came."
    reading: "tāi āhil."
    ipa: "tai ahil"
    tags: ["grammar", "gender"]
    notes: "তাই (tāi) is 'she'. Only the pronoun shows it: no verb, describing word or noun ending changes for a woman."
  - id: as-2009
    target: "আপুনি বহক।"
    native: "Please sit down."
    reading: "āpuni bôhôk."
    ipa: "apuni bɔhɔk"
    tags: ["grammar", "three-yous"]
    notes: "Three words for 'you', each with its own verb ending: আপুনি (āpuni), for strangers and elders, takes -ক (-kô) in a request."
  - id: as-2010
    target: "তুমি বহা।"
    native: "Sit down. (familiar)"
    reading: "tumi bôhā."
    ipa: "tumi bɔha"
    tags: ["grammar", "three-yous"]
    notes: "তুমি (tumi), for friends, family and those younger, takes -আ (-ā)."
  - id: as-2011
    target: "তই বহ।"
    native: "Sit! (intimate)"
    reading: "toi bôh."
    ipa: "toi bɔh"
    tags: ["grammar", "three-yous"]
    notes: "তই (toi), only for very close friends and small children, takes the bare stem. To anyone else it is rude."
  - id: as-2012
    target: "যাম।"
    native: "I'll go."
    reading: "zām."
    ipa: "zam"
    tags: ["grammar", "person-endings"]
    notes: "The ending -ম (-mô) says 'I' in the future, so মই (moi) can be left out."
  - id: as-2013
    target: "এখন কিতাপ"
    native: "a book; one book"
    reading: "ekhôn kitāp"
    ipa: "ekʰɔn kitap"
    tags: ["grammar", "classifiers"]
    notes: "No word for 'a': 'one' takes a classifier, here -খন (-khôn), for books and flat things. এখন (ekhôn) is 'one' or 'a'."
  - id: as-2014
    target: "কিতাপখন"
    native: "the book"
    reading: "kitāpkhôn"
    ipa: "kitapkʰɔn"
    tags: ["grammar", "classifiers"]
    notes: "No word for 'the' either: the classifier on the noun makes it definite."
  - id: as-2015
    target: "মোৰ এখন কিতাপ আছে।"
    native: "I have a book."
    reading: "mur ekhôn kitāp āse."
    ipa: "mʊɹ ekʰɔn kitap ase"
    tags: ["grammar", "have"]
    notes: "No verb 'have': 'of me a book there is', with আছে (āse), 'there is'."
  - id: as-2016
    target: "মই নাযাওঁ।"
    native: "I don't go."
    reading: "moi nāzāum̐."
    ipa: "moi nazaʊ̃"
    alt_target: ["মই নাযাও।"]
    tags: ["grammar", "negation"]
    notes: "'Not' is ন- (nô-) at the front of the verb, with a vowel that echoes the verb's own: যাওঁ (zāum̐), I go; নাযাওঁ (nāzāum̐), I don't go."
  - id: as-2017
    target: "সময় নাই।"
    native: "There's no time."
    reading: "xômôy nāi."
    ipa: "xɔmɔj nai"
    tags: ["grammar", "negation"]
    notes: "নাই (nāi) is 'there is not', the opposite of আছে (āse)."
  - id: as-2018
    target: "আপুনি যাবনে?"
    native: "Will you go?"
    reading: "āpuni zābône?"
    ipa: "apuni zabɔne"
    tags: ["grammar", "questions"]
    notes: "A yes-or-no question adds -নে (-ne) to the verb and keeps the statement's word order: আপুনি যাব (āpuni zāb), you will go."
