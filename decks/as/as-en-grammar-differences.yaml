schema: 1
id: as-en-grammar-differences
name: "How Assamese grammar differs from English"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Before any theme: the verb last, no is, endings for in, to and of, a doer's -এ, no gender in the verb, three yous, classifiers for a and the, and how Assamese says have, not and questions. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: as-2001
    target: "মই ভাত খাওঁ।"
    native: "I eat rice."
    reading: "moi bhat khau."
    alt_target: ["মই ভাত খাও।"]
    tags: ["grammar", "word-order"]
    notes: "The verb comes last: subject, object, verb. Word for word, 'I rice eat'."
  - id: as-2002
    target: "তেওঁ ডাক্তৰ।"
    native: "He is a doctor. / She is a doctor."
    reading: "teu daktor."
    tags: ["grammar", "no-is"]
    notes: "No word for 'am', 'is' or 'are' when saying what someone is: 'he doctor'. Where someone is, or how they are, takes আছে: মই ভালে আছোঁ, I'm well."
  - id: as-2003
    target: "ঘৰত"
    native: "at home; in the house"
    reading: "ghorot"
    tags: ["grammar", "case-endings"]
    notes: "Assamese puts 'in' and 'at' after the noun, as an ending: ঘৰ (ghor, house) + -ত."
  - id: as-2004
    target: "বজাৰলৈ"
    native: "to the market"
    reading: "bojaroloi"
    tags: ["grammar", "case-endings"]
    notes: "'To' a place is the ending -লৈ: বজাৰ (bojar, market) + -লৈ."
  - id: as-2005
    target: "দেউতাৰ কিতাপ"
    native: "father's book"
    reading: "deutar kitap"
    tags: ["grammar", "case-endings"]
    notes: "'Of' is the ending -ৰ on the owner, who comes first: দেউতা (deuta, father) + -ৰ."
  - id: as-2006
    target: "ৰামে ভাত খালে।"
    native: "Ram ate rice."
    reading: "rame bhat khale."
    tags: ["grammar", "doer"]
    notes: "A noun that does something to something takes -এ: ৰাম + -এ. After a vowel it is -ই or -য়ে: দেউতাই, মায়ে. Most pronouns, such as মই and সি, do not take it."
  - id: as-2007
    target: "সি আহিল।"
    native: "He came."
    reading: "xi ahil."
    tags: ["grammar", "gender"]
    notes: "সি is 'he'. The verb আহিল, 'came', is the same for a man, a woman or a thing."
  - id: as-2008
    target: "তাই আহিল।"
    native: "She came."
    reading: "tai ahil."
    tags: ["grammar", "gender"]
    notes: "তাই is 'she'. Only the pronoun shows it: no verb, describing word or noun ending changes for a woman."
  - id: as-2009
    target: "আপুনি বহক।"
    native: "Please sit down."
    reading: "apuni bohok."
    tags: ["grammar", "three-yous"]
    notes: "Three words for 'you', each with its own verb ending: আপুনি, for strangers and elders, takes -ক in a request."
  - id: as-2010
    target: "তুমি বহা।"
    native: "Sit down. (familiar)"
    reading: "tumi boha."
    tags: ["grammar", "three-yous"]
    notes: "তুমি, for friends, family and those younger, takes -আ."
  - id: as-2011
    target: "তই বহ।"
    native: "Sit! (intimate)"
    reading: "toi boh."
    tags: ["grammar", "three-yous"]
    notes: "তই, only for very close friends and small children, takes the bare stem. To anyone else it is rude."
  - id: as-2012
    target: "যাম।"
    native: "I'll go."
    reading: "jam."
    tags: ["grammar", "person-endings"]
    notes: "The ending -ম says 'I' in the future, so মই can be left out."
  - id: as-2013
    target: "এখন কিতাপ"
    native: "a book; one book"
    reading: "ekhon kitap"
    tags: ["grammar", "classifiers"]
    notes: "No word for 'a': 'one' takes a classifier, here -খন, for books and flat things. এখন is 'one' or 'a'."
  - id: as-2014
    target: "কিতাপখন"
    native: "the book"
    reading: "kitapkhon"
    tags: ["grammar", "classifiers"]
    notes: "No word for 'the' either: the classifier on the noun makes it definite."
  - id: as-2015
    target: "মোৰ এখন কিতাপ আছে।"
    native: "I have a book."
    reading: "mur ekhon kitap ase."
    tags: ["grammar", "have"]
    notes: "No verb 'have': 'of me a book there is', with আছে, 'there is'."
  - id: as-2016
    target: "মই নাযাওঁ।"
    native: "I don't go."
    reading: "moi najau."
    alt_target: ["মই নাযাও।"]
    tags: ["grammar", "negation"]
    notes: "'Not' is ন- at the front of the verb, with a vowel that echoes the verb's own: যাওঁ, I go; নাযাওঁ, I don't go."
  - id: as-2017
    target: "সময় নাই।"
    native: "There's no time."
    reading: "xomoy nai."
    tags: ["grammar", "negation"]
    notes: "নাই is 'there is not', the opposite of আছে."
  - id: as-2018
    target: "আপুনি যাবনে?"
    native: "Will you go?"
    reading: "apuni jabone?"
    tags: ["grammar", "questions"]
    notes: "A yes-or-no question adds -নে to the verb and keeps the statement's word order: আপুনি যাব, you will go."
