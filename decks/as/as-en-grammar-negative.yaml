schema: 1
id: as-en-grammar-negative
name: "Don't and won't"
kind: grammar
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I don't go, she won't come: Assamese says not with ন- at the front of the verb. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Negative"
  slot_name: "tense, person and respect"
  slots: ["don't, মই / আমি", "don't, তই / তহঁত", "don't, তুমি / তোমালোক", "don't, আপুনি / সি / তাই / তেওঁ", "won't, মই / আমি", "won't, তই / তহঁত", "won't, তুমি / তোমালোক", "won't, আপুনি / সি / তাই / তেওঁ"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Not is ন- before the verb, and its vowel echoes the verb's first vowel: কৰোঁ, নকৰোঁ; যাওঁ, নাযাওঁ; শুনোঁ, নুশুনোঁ; খেলোঁ, নেখেলোঁ. Before a verb that starts with a vowel the two run together: আহোঁ, নাহোঁ, I don't come. In the past, ন- goes on the past form, নকৰিলোঁ, I didn't do it, or the verb noun takes নাই: মই কৰা নাই, I haven't done it. A 'don't' said to someone is the negative future: নকৰিবা, don't, to a friend; নকৰিব, to someone you respect. আপুনি takes the same form as সি, তাই and তেওঁ. The ending -ওঁ is also written -ো, without ঁ, and both are accepted."
