schema: 1
id: as-en-spelling
name: "Assamese spellings, standard and casual"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Spellings you will meet on the web, on old signs and in older print: Bengali letters typed for Assamese ones, marks left out, and older names. Here each is beside the standard spelling. Recognition only. Not yet checked by an Assamese speaker: please report any mistake."
tags: [advanced, unreviewed]
cards:
  - id: as-0458
    target: "ঘর"
    native: "house; standard ঘৰ"
    reading: "ghôr"
    ipa: "ɡʱɔɹ"
    pos: "other"
    modes: [recognition]
    notes: "Typed with the Bengali র, a dot below, in place of Assamese ৰ, a stroke across. A keyboard with no ৰ does this, and so does some text on the web. The word is the same."
  - id: as-0459
    target: "যাও"
    native: "I go; standard যাওঁ"
    reading: "zāu"
    ipa: "zaʊ"
    pos: "other"
    modes: [recognition]
    notes: "Casual typing often leaves out the nasal mark ঁ that ends 'I' verbs: যাও, খাও, আছো. Standard spelling keeps it: যাওঁ, খাওঁ, আছোঁ."
  - id: as-0460
    target: "হল"
    native: "it became; it is (in a definition); standard হ'ল"
    reading: "hôl"
    ipa: "hɔl"
    pos: "other"
    modes: [recognition]
    notes: "Casual typing often drops the apostrophe that marks a closed o. Careful writing keeps it: ক'ত, হ'ল, ল'ৰা."
  - id: as-0461
    target: "কত"
    native: "where; standard ক'ত"
    reading: "kôt"
    ipa: "kɔt"
    pos: "other"
    modes: [recognition]
    notes: "The same apostrophe, left out. Without it the word looks as if it should be said with the open o."
  - id: as-0462
    target: "আসাম"
    native: "Assam; in Assamese অসম"
    reading: "āsām"
    ipa: "asam"
    pos: "other"
    modes: [recognition]
    notes: "The name as Bengali, Hindi and older writing spell it, after English Assam. Assamese writes অসম (ôxôm)."
  - id: as-0463
    target: "গৌহাটী"
    native: "Guwahati; today গুৱাহাটী"
    reading: "gôuhāti"
    ipa: "ɡɔuhati"
    pos: "other"
    modes: [recognition]
    notes: "An older spelling, after the English Gauhati, still on some old signs and in older books. Today the city is গুৱাহাটী (guwāhāti), and Guwahati in English too."
  - id: as-0464
    target: "পানি"
    native: "water; standard পানী"
    reading: "pāni"
    ipa: "pani"
    pos: "other"
    modes: [recognition]
    notes: "Written with the short i, as Bengali spells it. Assamese spelling has the long ী: পানী."
  - id: as-0465
    target: "অসমিয়া"
    native: "Assamese; standard অসমীয়া"
    reading: "ôxomiyā"
    ipa: "ɔxomija"
    pos: "other"
    modes: [recognition]
    notes: "A common slip, with the short i. Standard spelling has the long ী, as in পানী."
