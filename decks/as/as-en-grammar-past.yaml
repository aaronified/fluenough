schema: 1
id: as-en-grammar-past
name: "Past: did and have done"
kind: grammar
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I did, she went, I have eaten: the simple past and the present perfect, by person and respect. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Simple past and present perfect"
  slot_name: "tense, person and respect"
  slots: ["did, মই / আমি", "did, তই / তহঁত", "did, তুমি / তোমালোক", "did, আপুনি / সি / তাই / তেওঁ", "have done, মই / আমি", "have done, তই / তহঁত", "have done, তুমি / তোমালোক", "have done, আপুনি / সি / তাই / তেওঁ"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The simple past ends in -ইলোঁ, -ইলি, -ইলা and -ইলে: কৰিলোঁ, I did. A verb with no object ends in -ইল with আপুনি, সি, তাই and তেওঁ: সি আহিল, he came; and so does গ'ল, went, the past of যোৱা. A stem ending in a vowel drops the -ই-: খালোঁ, I ate; ক'লোঁ, I said. The present perfect, for what has just happened, ends in -ইছোঁ, -ইছ, -ইছা and -ইছে: খাইছোঁ, I have eaten; যোৱা takes গৈ: গৈছোঁ, I have gone. The ending -ওঁ is also written -ো, without ঁ, and both are accepted."
