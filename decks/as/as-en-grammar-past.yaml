        "have done, আপুনি / সি / তাই / তেওঁ": "কৰিছে"
      readings:
        "did, মই / আমি": ["korilu", "korilu"]
        "did, তই / তহঁত": "korili"
        "did, তুমি / তোমালোক": "korila"
        "did, আপুনি / সি / তাই / তেওঁ": "korile"
