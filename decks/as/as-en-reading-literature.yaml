passages:
  - id: "as-a-poem-read-aloud"
    title: "A teacher reads a short poem and explains it"
    theme: "literature"
    sentences:
      - text: "এইটো এটা ছোট কবিতা।"
        reading: "eitu etā sut kobitā."
      - text: "কবিয়ে ফুলৰ কথা লিখিছে।"
        reading: "kobiye phulôr kôthā likhise."
      - text: "ছন্দ ধুনীয়া।"
        reading: "sônd dhuniyā."
      - text: "অৰ্থ বুজিলে ভাল।"
        reading: "ôrth buzile bhāl."
    questions:
      - id: "as-4028"
        prompt: { en: "The poem is short." }
        answer: true
      - id: "as-4029"
        prompt: { en: "What does the poet write about?" }
        options:
          - { en: "Flowers" }
          - { en: "Cars" }
          - { en: "Money" }
        answer: 1
      - id: "as-4030"
        prompt: { en: "What is said about the rhythm?" }
        options:
          - { en: "It is bad" }
          - { en: "It is lovely" }
          - { en: "It is missing" }
        answer: 2
  - id: "as-book-blurb"
    title: "The back-cover blurb of a novel"
    theme: "literature"
    sentences:
      - text: "এই উপন্যাসত এজন ছোৱালী আছে।"
        reading: "ei upônyāxôt ezôn suwāli āse."
      - text: "সি গাঁৱৰ পৰা আহিছে।"
        reading: "si gām̐wôr pôrā āhise."
      - text: "কাহিনী দীঘল আৰু ধুনীয়া।"
        reading: "kāhini dighôl āru dhuniyā."
      - text: "পাঠকে ভাল পাব।"
        reading: "pāthôke bhāl pābô."
    questions:
      - id: "as-4031"
        prompt: { en: "The novel has a girl in it." }
        answer: true
      - id: "as-4032"
        prompt: { en: "Where does she come from?" }
        options:
          - { en: "A village" }
          - { en: "A city" }
          - { en: "A ship" }
        answer: 1
      - id: "as-4033"
        prompt: { en: "What will the reader do?" }
        options:
          - { en: "Dislike it" }
          - { en: "Enjoy it" }
          - { en: "Burn it" }
        answer: 2
