name: "Help"
kind: vocab
theme: help
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Asking for help, doctors and medicine, and saying you are lost. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0421
    target: "সহায়"
    native: "help"
    reading: "xôhāy"
    ipa: "xɔhaj"
    pos: "noun"
  - id: as-0422
    target: "সহায় কৰক!"
    native: "Please help!"
    reading: "xôhāy kôrôk!"
    ipa: "xɔhaj kɔɹɔk"
    pos: "phrase"
    tags: ["polite"]
  - id: as-0423
    target: "বচাওক!"
    native: "Help! Save me!"
    reading: "bôsāuk!"
    ipa: "bɔsaʊk"
    pos: "phrase"
  - id: as-0424
    target: "অলপ ৰ'ব!"
    native: "Wait a moment, please!"
    reading: "ôlôp robô!"
    ipa: "ɔlɔp ɹobɔ"
    pos: "phrase"
    tags: ["polite"]
    notes: "ৰ (rô)'ব (bô), 'you will stay', is a polite request. To a friend: অলপ ৰ (ôlôp rô)'বা (olop roba)."
  - ref: as-0212
  - ref: as-0211
  - id: as-0425
    target: "হস্পিতাল"
    native: "hospital"
    picture: "🏥"
    reading: "hospitāl"
    ipa: "hospital"
    alt_target: ["চিকিৎসালয়"]
    pos: "noun"
    notes: "Formally, and on signs, চিকিৎসালয় (sikitsālôy)."
  - id: as-0426
    target: "দৰব"
    native: "medicine"
    picture: "💊"
    reading: "dôrôb"
    ipa: "dɔɹɔb"
    pos: "noun"
    notes: "The everyday word. The formal one is ঔষধ (ôuxôdh)."
  - id: as-0427
    target: "বিষ"
    native: "pain; ache"
    reading: "bix"
    ipa: "bix"
    pos: "noun"
    notes: "মূৰৰ বিষ (murôr bix), a headache; পেটৰ বিষ (petôr bix), a stomach ache. In Bengali and Hindi the same word, বিষ (bix), विष (viś), means poison."
  - id: as-0428
    target: "মই বাট হেৰুৱালোঁ।"
    native: "I'm lost."
    reading: "moi bāt heruwālum̐."
    ipa: "moi bat heɹuwalʊ̃"
    pos: "phrase"
    notes: "Literally 'I have lost the way'."
  - id: as-0429
    target: "মই বুজি নাপালোঁ।"
    native: "I didn't understand."
    reading: "moi buzi nāpālum̐."
    ipa: "moi buzi napalʊ̃"
    pos: "phrase"
    notes: "Literally 'I did not get it, understanding'. I understand: বুজি পাইছোঁ (buzi pāisum̐)."
  - id: as-0430
    target: "বাথৰুম ক'ত?"
    native: "Where is the toilet?"
    reading: "bāthrum kot?"
    ipa: "batʰɹum kot"
    pos: "phrase"
    notes: "Signs say শৌচালয় (xôusālôy)."
