schema: 1
id: as-en-grammar-postpositions
name: "Case endings and postpositions"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "In, to, from, with: endings on the noun, and words after it. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - ref: as-2003
    notes: "-ত is 'in' or 'at': ঘৰত, at home; চহৰত, in town."
  - ref: as-2004
    notes: "-লৈ is 'to' a place: বজাৰলৈ, to the market."
  - id: as-2072
    target: "গুৱাহাটীৰ পৰা"
    native: "from Guwahati"
    reading: "guwāhātir pôrā"
    ipa: "ɡuwahatiɹ pɔɹa"
    pos: "phrase"
    notes: "'From' is -ৰ পৰা: the noun takes -ৰ, then পৰা."
  - id: as-2073
    target: "ৰামক দিয়ক।"
    native: "Give it to Ram, please."
    reading: "rāmôk diyôk."
    ipa: "ɹamɔk dijɔk"
    pos: "phrase"
    notes: "-ক marks the one something is given or said to, and a person who is the object: ৰামক মাতক, call Ram."
  - id: as-2074
    target: "মোৰ লগত"
    native: "with me"
    reading: "mur lôgôt"
    ipa: "mʊɹ lɔɡɔt"
    pos: "phrase"
    notes: "লগত, 'with', after the -ৰ form: তোমাৰ লগত, with you."
  - id: as-2075
    target: "কলমেৰে"
    native: "with a pen"
    reading: "kôlômere"
    ipa: "kɔlɔmeɹe"
    pos: "other"
    notes: "-এৰে is 'with' for a tool: কলমেৰে লিখা, write with a pen. With a person it is লগত."
  - id: as-2076
    target: "মেজৰ ওপৰত"
    native: "on the table"
    reading: "mezôr upôrôt"
    ipa: "mezɔɹ ʊpɔɹɔt"
    pos: "phrase"
  - id: as-2077
    target: "মেজৰ তলত"
    native: "under the table"
    reading: "mezôr tôlôt"
    ipa: "mezɔɹ tɔlɔt"
    pos: "phrase"
  - id: as-2078
    target: "নদীৰ ওচৰত"
    native: "near the river"
    reading: "nodir usôrôt"
    ipa: "nodiɹ ʊsɔɹɔt"
    pos: "phrase"
  - id: as-2079
    target: "তোমাৰ বাবে"
    native: "for you"
    reading: "tumār bābe"
    ipa: "tʊmaɹ babe"
    pos: "phrase"
  - id: as-2080
    target: "ভাত খোৱাৰ পাছত"
    native: "after the meal"
    reading: "bhāt khuwār pāsôt"
    ipa: "bʱat kʰʊwaɹ pasɔt"
    pos: "phrase"
    notes: "'After eating rice': a verb takes -ৰ before পাছত, as a noun does."
  - id: as-2081
    target: "ভাত খোৱাৰ আগতে"
    native: "before the meal"
    reading: "bhāt khuwār āgôte"
    ipa: "bʱat kʰʊwaɹ aɡɔte"
    pos: "phrase"
  - id: as-2082
    target: "ঘৰৰ ভিতৰত"
    native: "inside the house"
    reading: "ghôrôr bhitôrôt"
    ipa: "ɡʱɔɹɔɹ bʱitɔɹɔt"
    pos: "phrase"
    notes: "Outside is বাহিৰত (bāhirôt): ঘৰৰ বাহিৰত."
  - id: as-2083
    target: "সন্ধিয়ালৈকে"
    native: "until evening"
    reading: "xondhiyālôike"
    ipa: "xondʱijalɔike"
    pos: "other"
    notes: "-লৈকে is 'until' or 'as far as'."
