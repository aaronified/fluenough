native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "One to twenty. Every number up to a hundred has its own word in Assamese, as in Bengali, so these are the ones to learn first. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0222
    target: "এক"
    native: "1, one"
    reading: "ek"
    ipa: "ek"
    pos: "other"
    notes: "Assamese uses the same digits as Bengali, ১ ২ ৩. Prices, signs and bus numbers use them or 1 2 3, so learn to read both. Before a counting word, one is এ- (e-): এটা (etā), one thing; এজন (ezôn), one person."
  - id: as-0223
    target: "দুই"
