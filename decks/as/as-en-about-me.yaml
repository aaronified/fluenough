schema: 1
id: as-en-about-me
name: "About me"
kind: vocab
theme: about-me
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Your name, where you are from, where you live, and the languages you speak. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0166
    target: "নাম"
    native: "name"
    reading: "nam"
    pos: "noun"
  - id: as-0167
    target: "মোৰ নাম …"
    native: "My name is …"
    reading: "mur nam ..."
    pos: "phrase"
    notes: "There is no 'is': 'my name …'. মোৰ (mur), my, is said with an o close to u."
  - id: as-0168
    target: "আপোনাৰ নাম কি?"
    native: "What is your name?"
    reading: "apunar nam ki?"
    pos: "phrase"
    tags: ["polite"]
    notes: "To a child or a friend: তোমাৰ নাম কি? (tumar nam ki?)."
  - id: as-0169
    target: "মই …ৰ পৰা আহিছোঁ।"
    native: "I'm from …"
    reading: "moi ...r pora ahisu."
    pos: "phrase"
    notes: "Literally 'I have come from …'. -ৰ পৰা (-r pora), 'from', comes after the place: গুৱাহাটীৰ পৰা (guwahatir pora), from Guwahati."
  - id: as-0170
    target: "মই …ত থাকোঁ।"
    native: "I live in …"
    reading: "moi ...t thaku."
    pos: "phrase"
    notes: "-ত (-t), 'in', joins the end of the place: গুৱাহাটীত (guwahatit), in Guwahati. After a consonant it is -অত: অসমত (oxomot), in Assam."
  - ref: as-0052
    notes: "আপোনাৰ ঘৰ ক'ত? (apunar ghor kot?), 'where is your home?', asks where your family comes from, and is often the first question."
  - id: as-0171
    target: "পৰিয়াল"
    native: "family"
    reading: "poriyal"
    pos: "noun"
  - ref: as-0120
    notes: "In this deck: work, what you do."
  - id: as-0172
    target: "গাঁও"
    native: "village; home village"
    reading: "gao"
    pos: "noun"
    notes: "Many people in Guwahati still call the village their family comes from home."
  - id: as-0173
    target: "দেশ"
    native: "country"
    reading: "dex"
    pos: "noun"
    notes: "শ is the rasp x. The state song of Assam is ও মোৰ আপোনাৰ দেশ (o mur apunar dex), 'O my own dear land'."
  - id: as-0174
    target: "ভাষা"
    native: "language"
    reading: "bhaxa"
    pos: "noun"
  - id: as-0175
    target: "অসমীয়া"
    native: "Assamese (the language; a person from Assam)"
    reading: "oxomiya"
    pos: "noun"
    notes: "Chat writes it Axomiya or Oxomiya. In English it is also called Asamiya."
  - id: as-0176
    target: "ইংৰাজী"
    native: "English (the language)"
    reading: "ingraji"
    pos: "noun"
    notes: "মই ইংৰাজী ক'ব পাৰোঁ (moi ingraji kobo paru), I can speak English."
  - id: as-0177
    target: "বয়স"
    native: "age"
    reading: "boyox"
    pos: "noun"
    notes: "আপোনাৰ বয়স কিমান? (apunar boyox kiman?), how old are you?"
