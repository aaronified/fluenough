id: as-en-grammar-likes
name: "Likes"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "ভাল পোৱা and ভাল লগা: what you like, and what you liked. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - ref: as-2023
  - id: as-2138
    target: "ভাল পোৱা"
    native: "to like; to love"
    reading: "bhal puwa"
    pos: "phrase"
    notes: "'To get good'. The one who likes is the doer: মই চাহ ভাল পাওঁ, I like tea. A person liked takes -ক: মই তোমাক ভাল পাওঁ."
  - id: as-2139
    target: "মই চাহ ভাল পাওঁ।"
    native: "I like tea."
    reading: "moi sah bhal pau."
    alt_target: ["মই চাহ ভাল পাও।"]
    pos: "phrase"
  - id: as-2140
    target: "মই কফি ভাল নাপাওঁ।"
    native: "I don't like coffee."
    reading: "moi kophi bhal napau."
    alt_target: ["মই কফি ভাল নাপাও।"]
    pos: "phrase"
    notes: "The not goes on পোৱা: নাপাওঁ."
  - id: as-2141
    target: "আপুনি কি ভাল পায়?"
    native: "What do you like?"
    reading: "apuni ki bhal pay?"
    pos: "phrase"
  - id: as-2142
    target: "মই চিনেমা চাবলৈ ভাল পাওঁ।"
    native: "I like watching films."
    reading: "moi sinema saboloi bhal pau."
    alt_target: ["মই চিনেমা চাবলৈ ভাল পাও।"]
    pos: "phrase"
    notes: "An action you like takes -বলৈ: চাবলৈ, to watch."
  - id: as-2143
    target: "ভাল লগা"
    native: "to please; to like (what you try or see)"
    reading: "bhal loga"
    pos: "phrase"
    notes: "The one who likes takes -ৰ: মোৰ ভাল লাগিল, I liked it. ভাল পোৱা is a lasting liking."
  - id: as-2144
    target: "মোৰ ভাল লাগিল।"
    native: "I liked it."
    reading: "mur bhal lagil."
    pos: "phrase"
  - id: as-2145
    target: "মোৰ ভাল নালাগিল।"
    native: "I didn't like it."
    reading: "mur bhal nalagil."
    pos: "phrase"
  - id: as-2146
    target: "আপোনাৰ ভাল লাগিলনে?"
    native: "Did you like it?"
    reading: "apunar bhal lagilne?"
    pos: "phrase"
  - id: as-2147
    target: "মই তোমাক ভাল পাওঁ।"
    native: "I love you."
    reading: "moi tumak bhal pau."
    alt_target: ["মই তোমাক ভাল পাও।"]
    pos: "phrase"
    notes: "The same ভাল পোৱা, with তোমাক, you, as its object."
