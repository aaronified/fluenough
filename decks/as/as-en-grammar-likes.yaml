name: "Likes"
kind: vocab
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "ভাল পোৱা (bhāl puwā) and ভাল লগা (bhāl lôgā): what you like, and what you liked. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - ref: as-2023
  - id: as-2138
    target: "ভাল পোৱা"
    native: "to like; to love"
    reading: "bhāl puwā"
    ipa: "bʱal pʊwa"
    pos: "phrase"
    notes: "'To get good'. The one who likes is the doer: মই চাহ ভাল পাওঁ (moi sāh bhāl pāum̐), I like tea. A person liked takes -ক (-kô): মই তোমাক ভাল পাওঁ (moi tumāk bhāl pāum̐)."
  - id: as-2139
    target: "মই চাহ ভাল পাওঁ।"
    native: "I like tea."
    reading: "moi sāh bhāl pāum̐."
    ipa: "moi sah bʱal paʊ̃"
    alt_target: ["মই চাহ ভাল পাও।"]
    pos: "phrase"
  - id: as-2140
    target: "মই কফি ভাল নাপাওঁ।"
    native: "I don't like coffee."
    reading: "moi kophi bhāl nāpāum̐."
    ipa: "moi kopʰi bʱal napaʊ̃"
    alt_target: ["মই কফি ভাল নাপাও।"]
    pos: "phrase"
    notes: "The not goes on পোৱা (puwā): নাপাওঁ (nāpāum̐)."
  - id: as-2141
    target: "আপুনি কি ভাল পায়?"
    native: "What do you like?"
    reading: "āpuni ki bhāl pāy?"
    ipa: "apuni ki bʱal paj"
    pos: "phrase"
  - id: as-2142
    target: "মই চিনেমা চাবলৈ ভাল পাওঁ।"
    native: "I like watching films."
    reading: "moi sinemā sābôlôi bhāl pāum̐."
    ipa: "moi sinema sabɔlɔi bʱal paʊ̃"
    alt_target: ["মই চিনেমা চাবলৈ ভাল পাও।"]
    pos: "phrase"
    notes: "An action you like takes -বলৈ (-bôlôi): চাবলৈ (sābôlôi), to watch."
  - id: as-2143
    target: "ভাল লগা"
    native: "to please; to like (what you try or see)"
    reading: "bhāl lôgā"
    ipa: "bʱal lɔɡa"
    pos: "phrase"
    notes: "The one who likes takes -ৰ (-rô): মোৰ ভাল লাগিল (mur bhāl lāgil), I liked it. ভাল পোৱা (bhāl puwā) is a lasting liking."
  - id: as-2144
    target: "মোৰ ভাল লাগিল।"
    native: "I liked it."
    reading: "mur bhāl lāgil."
    ipa: "mʊɹ bʱal laɡil"
    pos: "phrase"
  - id: as-2145
    target: "মোৰ ভাল নালাগিল।"
    native: "I didn't like it."
    reading: "mur bhāl nālāgil."
    ipa: "mʊɹ bʱal nalaɡil"
    pos: "phrase"
  - id: as-2146
    target: "আপোনাৰ ভাল লাগিলনে?"
    native: "Did you like it?"
    reading: "āpunār bhāl lāgilne?"
    ipa: "apʊnaɹ bʱal laɡilne"
    pos: "phrase"
  - id: as-2147
    target: "মই তোমাক ভাল পাওঁ।"
    native: "I love you."
    reading: "moi tumāk bhāl pāum̐."
    ipa: "moi tʊmak bʱal paʊ̃"
    alt_target: ["মই তোমাক ভাল পাও।"]
    pos: "phrase"
    notes: "The same ভাল পোৱা (bhāl puwā), with তোমাক (tumāk), you, as its object."
