schema: 1
id: as-en-questions
name: "Yes, no and questions"
kind: vocab
theme: questions
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Yes and no, the question words, and how a sentence becomes a question with নেকি. Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0140
    target: "হয়"
    native: "yes"
    reading: "hoy"
    pos: "other"
    notes: "Literally 'it is'. Politely, হয়, ছাৰ (hoy, sar), yes, sir."
  - id: as-0141
    target: "নহয়"
    native: "no; it is not"
    reading: "nohoy"
    pos: "other"
    notes: "নহয় denies what something is: এইটো চাহ নহয় (eitu sah nohoy), this isn't tea. নাই (nai) denies that something is there."
  - id: as-0142
    target: "নাই"
    native: "no; there isn't"
    reading: "nai"
    pos: "other"
    notes: "খুচুৰা নাই (khusura nai), there's no change."
  - id: as-0143
    target: "কি"
    native: "what"
    reading: "ki"
    pos: "other"
    notes: "আপোনাৰ নাম কি? (apunar nam ki?), what is your name? The question word stays where the answer would go."
  - id: as-0144
    target: "কোন"
    native: "who"
    reading: "kun"
    pos: "other"
    notes: "The o here is said close to u, and chat writes kun."
  - id: as-0145
    target: "ক'ত"
    native: "where"
    reading: "kot"
    pos: "other"
    notes: "The apostrophe after ক marks a closed o. Where to? is ক'লৈ (koloi)."
  - id: as-0146
    target: "কেতিয়া"
    native: "when"
    reading: "ketiya"
    pos: "other"
  - id: as-0147
    target: "কিয়"
    native: "why"
    reading: "kiyo"
    pos: "other"
  - id: as-0148
    target: "কেনেকৈ"
    native: "how (in what way)"
    reading: "kenekoi"
    pos: "other"
    notes: "How someone is, is কেনে (kene): কেনে আছে? How are you?"
  - id: as-0149
    target: "কিমান"
    native: "how much; how many"
    reading: "kiman"
    pos: "other"
    notes: "কিমান হ'ল? (kiman hol?), how much does that come to?"
  - id: as-0150
    target: "কোনটো"
    native: "which one"
    reading: "kuntu"
    pos: "other"
    notes: "কোন with the classifier টো, 'the one'. For a flat thing or a vehicle, কোনখন (kunkhon): কোনখন বাছ? Which bus?"
  - id: as-0151
    target: "নেকি"
    native: "(at the end, turns a sentence into a yes-or-no question)"
    reading: "neki"
    pos: "particle"
    notes: "আপুনি অসমীয়া জানে (apuni oxomiya jane), you know Assamese; আপুনি অসমীয়া জানে নেকি? Do you know Assamese? A shorter নে (ne) is joined to the verb: ভাত খালেনে? Have you eaten?"
  - id: as-0152
    target: "সঁচা নেকি?"
    native: "Really?"
    reading: "xosa neki?"
    pos: "phrase"
    notes: "সঁচা (xosa), true; with নেকি, 'is it true?'"
