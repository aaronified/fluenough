schema: 1
id: as-en-questions
name: "Yes, no and questions"
kind: vocab
theme: questions
language: { code: as, iso639_3: asm, name: Assamese, script: bengali, tts: as-IN, icon: "অ" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Yes and no, the question words, and how a sentence becomes a question with নেকি (neki). Not yet checked by an Assamese speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: as-0140
    target: "হয়"
    native: "yes"
    reading: "hôy"
    ipa: "hɔj"
    pos: "other"
    notes: "Literally 'it is'. Politely, হয় (hôy), ছাৰ (hoy, sar), yes, sir."
  - id: as-0141
    target: "নহয়"
    native: "no; it is not"
    reading: "nôhôy"
    ipa: "nɔhɔj"
    pos: "other"
    notes: "নহয় (nôhôy) denies what something is: এইটো চাহ নহয় (eitu sāh nôhôy), this isn't tea. নাই (nāi) denies that something is there."
  - id: as-0142
    target: "নাই"
    native: "no; there isn't"
    reading: "nāi"
    ipa: "nai"
    pos: "other"
    notes: "খুচুৰা নাই (khusurā nāi), there's no change."
  - id: as-0143
    target: "কি"
    native: "what"
    reading: "ki"
    ipa: "ki"
    pos: "other"
    notes: "আপোনাৰ নাম কি? (apunar nam ki?), what is your name? The question word stays where the answer would go."
  - id: as-0144
    target: "কোন"
    native: "who"
    reading: "kun"
    ipa: "kʊn"
    pos: "other"
    notes: "The o here is said close to u, and chat writes kun."
  - id: as-0145
    target: "ক'ত"
    native: "where"
    reading: "kot"
    ipa: "kot"
    pos: "other"
    notes: "The apostrophe after ক (kô) marks a closed o. Where to? is ক (kô)'লৈ (koloi)."
  - id: as-0146
    target: "কেতিয়া"
    native: "when"
    reading: "ketiyā"
    ipa: "ketija"
    pos: "other"
  - id: as-0147
    target: "কিয়"
    native: "why"
    reading: "kiyô"
    ipa: "kijɔ"
    pos: "other"
  - id: as-0148
    target: "কেনেকৈ"
    native: "how (in what way)"
    reading: "kenekôi"
    ipa: "kenekɔi"
    pos: "other"
    notes: "How someone is, is কেনে (kene): কেনে আছে (kene āse)? How are you?"
  - id: as-0149
    target: "কিমান"
    native: "how much; how many"
    reading: "kimān"
    ipa: "kiman"
    pos: "other"
    notes: "কিমান হ (kimān hô)'ল? (kiman hol?), how much does that come to?"
  - id: as-0150
    target: "কোনটো"
    native: "which one"
    reading: "kuntu"
    ipa: "kʊntʊ"
    pos: "other"
    notes: "কোন (kun) with the classifier টো (tu), 'the one'. For a flat thing or a vehicle, কোনখন (kunkhôn): কোনখন বাছ (kunôkhôn bās)? Which bus?"
  - id: as-0151
    target: "নেকি"
    native: "(at the end, turns a sentence into a yes-or-no question)"
    reading: "neki"
    ipa: "neki"
    pos: "particle"
    notes: "আপুনি অসমীয়া জানে (āpuni ôxomiyā zāne), you know Assamese; আপুনি অসমীয়া জানে নেকি (āpuni ôxomiyā zāne neki)? Do you know Assamese? A shorter নে (ne) is joined to the verb: ভাত খালেনে (bhāt khālene)? Have you eaten?"
  - id: as-0152
    target: "সঁচা নেকি?"
    native: "Really?"
    reading: "xôm̐sā neki?"
    ipa: "xɔ̃sa neki"
    pos: "phrase"
    notes: "সঁচা (xôm̐sā), true; with নেকি (neki), 'is it true?'"
