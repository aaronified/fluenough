  "ne-0118":
    native: "mother"
    notes:
      "n1": "The everyday word for 'mother'. Said by children and used in speech."
    examples:
      "मेरी आमा घरमा हुनुहुन्छ।":
        native: "My mother is at home."
        bases:
          "मेरी": "my"
          "आमा": "mother"
          "घरमा": "at home"
      "आमा, म आएँ।":
        native: "Mum, I have come."
        bases:
          "आमा": "mother"
          "म": "I"
  "ne-0119":
    native: "father"
    notes:
      "n1": "The everyday word for 'father'."
    examples:
      "मेरा बुबा शिक्षक हुनुहुन्छ।":
        native: "My father is a teacher."
        bases:
          "मेरा": "my"
          "बुबा": "father"
          "शिक्षक": "teacher"
      "बुबा, पानी?":
        native: "Dad, water?"
        bases:
          "बुबा": "father"
          "पानी": "water"
  "ne-0120":
    native: "brother"
    notes:
      "n1": "Any brother, older or younger."
    examples:
      "मेरो भाइ विद्यार्थी हो।":
        native: "My brother is a student."
        bases:
          "मेरो": "my"
          "भाइ": "brother"
          "विद्यार्थी": "student"
      "भाइ, आऊ!":
        native: "Brother, come!"
        bases:
          "भाइ": "brother"
          "आऊ": "come"
  "ne-0121":
    native: "sister"
    notes:
      "n1": "Any sister, older or younger."
    examples:
      "मेरी बहिनी घरमा छे।":
        native: "My sister is at home."
        bases:
          "मेरी": "my"
          "बहिनी": "sister"
          "घरमा": "at home"
      "बहिनी, खाना तयार छ।":
        native: "Sister, the food is ready."
        bases:
          "बहिनी": "sister"
          "खाना": "food"
          "तयार": "ready"
  "ne-0122":
    native: "child"
    notes:
      "n1": "A child, or a young one of an animal."
    examples:
      "बच्चा खेल्छ।":
        native: "The child plays."
        bases:
          "बच्चा": "child"
          "खेल्छ": "play"
      "बच्चा सानो छ।":
        native: "The child is small."
        bases:
          "बच्चा": "child"
          "सानो": "small"
          "छ": "is"
  "ne-0123":
    native: "man; person"
    notes:
      "n1": "Used for a man, and for a person of either sex. पुरुष (puruṣ) is only 'a man' as opposed to a woman."
    examples:
      "त्यो मान्छे नेपाली हो।":
        native: "That man is Nepali."
        bases:
          "त्यो": "that"
          "मान्छे": "man"
          "नेपाली": "Nepali"
      "मान्छे घरमा छन्।":
        native: "The people are at home."
        bases:
          "मान्छे": "people"
          "घरमा": "at home"
  "ne-0124":
    native: "woman"
    notes:
      "n1": "An adult woman. Plain and everyday."
    examples:
      "त्यो आइमाई डाक्टर हो।":
        native: "That woman is a doctor."
        bases:
          "त्यो": "that"
          "आइमाई": "woman"
          "डाक्टर": "doctor"
      "आइमाई, पानी चाहियो।":
