schema: 1
id: "ne-en-first-words"
kind: "layer"
core: "ne-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "The first words of Nepali: the pronouns, yes and no, the numbers 1 to 10, the family, and the everyday words for food, house, name and time. Not yet checked by a Nepali speaker: please report any mistake."
cards:
  "ne-0101":
    native: "yes"
    notes:
      "n1": "Also हो (ho) is 'is' with a noun: यो पानी हो (yo pānī ho), this is water."
    examples:
      "हो, यो पानी हो।":
        native: "Yes, this is water."
        bases:
          "हो": "is"
          "यो": "this"
          "पानी": "water"
      "हो, म आउँछु।":
        native: "Yes, I'll come."
        bases:
          "म": "I"
          "आउँछु": "come"
  "ne-0102":
    native: "no; it is not"
    notes:
      "n1": "The negative of हो (ho). Said alone or with a noun: यो घर होइन (yo ghar hoina), this is not a house."
    examples:
      "होइन, यो घर होइन।":
        native: "No, this is not a house."
        bases:
          "घर": "house"
      "होइन, धन्यवाद।":
        native: "No, thank you."
        bases:
          "धन्यवाद": "thank you"
  "ne-0103":
    native: "I"
    notes:
      "n1": "The first person. Nepali says म (ma) for 'I' and does not change it for politeness."
    examples:
      "म विद्यार्थी हुँ।":
        native: "I am a student."
        bases:
          "म": "I"
          "विद्यार्थी": "student"
          "हुँ": "am"
      "म ठीक छु।":
        native: "I am fine."
        bases:
          "म": "I"
          "ठीक": "fine"
  "ne-0104":
    native: "you (respectful)"
    notes:
      "n1": "The respectful 'you', for anyone older or a stranger. तिमी (timī) is 'you' for a friend or child; तँ (tã) for a very close friend."
    examples:
      "तपाईं ठीक हुनुहुन्छ?":
        native: "Are you well?"
        bases:
          "तपाईं": "you"
          "ठीक": "fine"
          "हुनुहुन्छ": "are"
      "तपाईं नेपाली हुनुहुन्छ?":
        native: "Are you Nepali?"
        bases:
          "तपाईं": "you"
          "नेपाली": "Nepali"
          "हुनुहुन्छ": "are"
  "ne-0105":
    native: "he; she (respectful)"
    notes:
      "n1": "The respectful 'he' or 'she'. उ (u) is the plain form for someone you know well."
    examples:
      "उहाँ मेरो आमा हुनुहुन्छ।":
        native: "She is my mother."
        bases:
          "उहाँ": "she"
          "मेरो": "my"
          "आमा": "mother"
          "हुनुहुन्छ": "is"
      "उहाँ घरमा हुनुहुन्छ।":
        native: "He is at home."
        bases:
          "उहाँ": "he"
          "घरमा": "at home"
          "हुनुहुन्छ": "is"
  "ne-0106":
    native: "we"
    notes:
      "n1": "Means 'we' with the listener included or not. Used for any group of 'we'."
    examples:
      "हामी नेपाली हौं।":
        native: "We are Nepali."
        bases:
          "हामी": "we"
          "नेपाली": "Nepali"
          "हौं": "are"
      "हामी घर जान्छौं।":
        native: "We are going home."
        bases:
          "हामी": "we"
          "घर": "home"
          "जान्छौं": "go"
  "ne-0107":
    native: "they"
    notes:
      "n1": "The plural of उनी (unī). For a group of people, it is the usual 'they'."
    examples:
      "उनीहरू पढ्छन्।":
        native: "They study."
        bases:
          "उनीहरू": "they"
          "पढ्छन्": "study"
      "उनीहरू नेपाली हुन्।":
        native: "They are Nepali."
        bases:
          "उनीहरू": "they"
          "नेपाली": "Nepali"
          "हुन्": "are"
  "ne-0108":
    native: "one"
    notes:
      "n1": "The number 1."
    examples:
      "एक गिलास पानी।":
        native: "One glass of water."
        bases:
          "एक": "one"
          "गिलास": "glass"
          "पानी": "water"
      "एक कप चिया।":
        native: "One cup of tea."
        bases:
          "एक": "one"
          "कप": "cup"
          "चिया": "tea"
  "ne-0109":
    native: "two"
    notes:
      "n1": "The number 2."
    examples:
      "दुई गिलास पानी।":
