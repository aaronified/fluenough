        bases:
          "आइमाई": "woman"
          "पानी": "water"
          "चाहियो": "want"
  "ne-0125":
    native: "water"
    notes:
      "n1": "The everyday word for water."
    examples:
      "मलाई पानी चाहिन्छ।":
        native: "I need water."
        bases:
          "मलाई": "to me"
          "पानी": "water"
          "चाहिन्छ": "need"
      "पानी ठण्डा छ।":
        native: "The water is cold."
        bases:
          "पानी": "water"
          "ठण्डा": "cold"
  "ne-0126":
    native: "food; meal; rice (in a meal)"
    notes:
      "n1": "Food in general. In a meal, भात (bhāt) is rice and पाउरोटी (pauroṭī) is bread."
    examples:
      "खाना तयार छ।":
        native: "The food is ready."
        bases:
          "खाना": "food"
          "तयार": "ready"
      "म खाना खान्छु।":
        native: "I eat food."
        bases:
          "म": "I"
          "खाना": "food"
          "खान्छु": "eat"
  "ne-0127":
    native: "tea"
    notes:
      "n1": "Milk tea, sweetened, is the common everyday tea."
    examples:
      "चिया तातो छ।":
        native: "The tea is hot."
        bases:
          "चिया": "tea"
          "तातो": "hot"
          "छ": "is"
      "मलाई चिया मन पर्छ।":
        native: "I like tea."
        bases:
          "मलाई": "to me"
          "चिया": "tea"
          "पर्छ": "like"
  "ne-0128":
    native: "house; home"
    notes:
      "n1": "A house, or home in the sense of the place you live."
    examples:
      "मेरो घर ठूलो छ।":
        native: "My house is big."
        bases:
          "मेरो": "my"
          "घर": "house"
          "ठूलो": "big"
      "घर कहाँ छ?":
        native: "Where is the house?"
        bases:
          "घर": "house"
          "कहाँ": "where"
  "ne-0129":
    native: "name"
    notes:
      "n1": "Your name is तपाईंको नाम (tapāīm̐ko nām)."
    examples:
