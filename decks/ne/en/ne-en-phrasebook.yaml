schema: 1
id: "ne-en-phrasebook"
kind: "layer"
core: "ne-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty phrases to say whole from the first day, before their words are taught: greetings and goodbye, thanks and sorry, asking for slower speech, asking for help and where the toilet is. Not yet checked by a Nepali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
cards:
  "ne-0001":
    native: "hello; goodbye"
    notes:
      "n1": "Said with the palms pressed together, to anyone and at any time of day. Also the usual goodbye."
    bases:
      "नमस्ते": "hello; goodbye"
  "ne-0002":
    native: "good morning"
    notes:
      "n1": "Said in the morning, until about noon. शुभ (śubha) means 'auspicious'."
    bases:
      "शुभ प्रभात": "good morning"
  "ne-0003":
    native: "good evening"
    notes:
      "n1": "Said in the evening. सन्ध्या (sandhyā) is 'evening'."
    bases:
      "शुभ सन्ध्या": "good evening"
  "ne-0004":
    native: "good night"
    notes:
      "n1": "Said at bedtime. रात्री (rātrī) is 'night'."
    bases:
      "शुभ रात्री": "good night"
  "ne-0005":
    native: "see you again; bye"
    notes:
      "n1": "Literally 'we will meet again'. Said when leaving."
    bases:
      "फेरि भेटौंला": "see you again; bye"
  "ne-0006":
    native: "please"
    notes:
      "n1": "Put before a request, or said alone when asking for something."
    bases:
      "कृपया": "please"
  "ne-0007":
    native: "thank you"
    notes:
      "n1": "Polite and common. Among close friends people often say only धन्यवाद (dhanyavād) or nothing at all."
    bases:
      "धन्यवाद": "thank you"
  "ne-0008":
    native: "you're welcome"
    notes:
      "n1": "Literally 'it is welcome'. Said in reply to thanks."
    bases:
      "स्वागत छ": "you're welcome"
  "ne-0009":
    native: "sorry; excuse me; pardon me"
    notes:
      "n1": "Said to say sorry, and to ask someone's pardon. गर्नुहोस् (garnuhos) is the polite 'please do'."
    bases:
      "माफ गर्नुहोस्": "sorry; excuse me; pardon me"
  "ne-0010":
    native: "excuse me (to get attention)"
    notes:
      "n1": "Literally 'please listen'. Said to get someone's attention."
    bases:
      "सुन्नुहोस् है": "excuse me (to get attention)"
  "ne-0011":
    native: "I don't understand"
    notes:
      "n1": "Literally 'to me it is not understood'. The ending -inam̐ is the negative."
    bases:
      "मलाई बुझिनँ": "I don't understand"
  "ne-0012":
    native: "I don't know Nepali"
    notes:
      "n1": "Literally 'Nepali does not come to me'. Put another language's name in place of नेपाली (nepālī)."
    bases:
      "मलाई नेपाली आउँदैन": "I don't know Nepali"
  "ne-0013":
    native: "please speak slowly"
    notes:
      "n1": "बिस्तारै (bistārai) is 'slowly'; बोल्नुहोस् (bolnuhos) is 'please speak'."
    bases:
      "बिस्तारै बोल्नुहोस्": "please speak slowly"
  "ne-0014":
    native: "do you speak English?"
    notes:
      "n1": "Respectful. अंग्रेजी (aṅgrejī) is 'English'."
    bases:
      "तपाईं अंग्रेजी बोल्नुहुन्छ?": "do you speak English?"
  "ne-0015":
    native: "how are you?"
    notes:
      "n1": "Respectful. To a friend: तिमी कस्तो छौ? (timī kasto chhau?)."
    bases:
      "तपाईं कस्तो हुनुहुन्छ?": "how are you?"
  "ne-0016":
    native: "I'm fine"
    notes:
      "n1": "The answer to how are you. ठीक (ṭhīk) is 'fine'."
    bases:
      "म ठीक छु": "I'm fine"
  "ne-0017":
    native: "what is your name?"
    notes:
      "n1": "Respectful. The answer is मेरो नाम ... हो (mero nām ... ho)."
    bases:
      "तपाईंको नाम के हो?": "what is your name?"
  "ne-0018":
    native: "my name is ..."
    notes:
      "n1": "Put your name where the dots are. नाम (nām) is 'name'."
    bases:
      "मेरो नाम ... हो": "my name is ..."
  "ne-0019":
    native: "where is the toilet?"
    notes:
      "n1": "शौचालय (śauchālaya) is 'toilet'."
    bases:
      "शौचालय कहाँ छ?": "where is the toilet?"
  "ne-0020":
    native: "help!"
    notes:
      "n1": "Shouted in an emergency."
    bases:
      "बचाउ!": "help!"
