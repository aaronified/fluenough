schema: 1
id: "awa-en-phrasebook"
kind: "layer"
core: "awa-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty phrases to say whole from the first day, before their words are taught: greetings and goodbye, thanks and sorry, asking for slower speech, asking for help and where the toilet is. Not yet checked by an Awadhi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
cards:
  "awa-0001":
    native: "hello"
    notes:
      "n1": "The usual greeting, said with the hands pressed together."
    bases:
      "प्रणाम": "hello"
  "awa-0002":
    native: "good morning"
    notes:
      "n1": "Said in the morning."
    bases:
      "सुप्रभात": "good morning"
  "awa-0003":
    native: "good evening"
    notes:
      "n1": "Said in the evening."
    bases:
      "शुभ": "auspicious; good"
      "संध्या": "evening"
  "awa-0004":
    native: "good night"
    notes:
      "n1": "Said at bedtime."
    bases:
      "शुभ": "auspicious; good"
      "रात्रि": "night"
  "awa-0005":
    native: "see you again"
    notes:
      "n1": "Literally 'there will be a meeting again'. Said when leaving."
    bases:
      "फिर": "again"
      "भेंट": "meeting"
      "होई": "will happen"
  "awa-0006":
    native: "please"
    notes:
      "n1": "Put before a request."
    bases:
      "कृपया": "please"
  "awa-0007":
    native: "thank you"
    notes:
      "n1": "Polite and common."
    bases:
      "धन्यवाद": "thank you"
  "awa-0008":
    native: "you're welcome; no problem"
    notes:
      "n1": "Literally 'there is no matter'. Said in reply to thanks."
    bases:
      "कउनो": "any"
      "बात": "matter"
  "awa-0009":
    native: "sorry"
    notes:
      "n1": "Said to say sorry."
    bases:
      "माफ": "forgiveness"
      "करा": "please do"
  "awa-0010":
    native: "excuse me"
    notes:
      "n1": "Literally 'please listen'. Said to get someone's attention."
    bases:
      "सुनौ": "excuse me"
  "awa-0011":
    native: "I don't understand"
    notes:
      "n1": "Literally 'understanding does not come to me'."
    bases:
      "हमका": "to me"
      "समझ": "understanding"
      "आवत": "coming"
  "awa-0012":
    native: "I don't know Awadhi"
    notes:
      "n1": "Put another language's name in place of अवधी (avadhī)."
    bases:
      "हमका": "to me"
      "अवधी": "Awadhi"
      "आवत": "coming"
  "awa-0013":
    native: "please speak slowly"
    notes:
      "n1": "धीरे (dhīre) is 'slowly'."
    bases:
      "धीरे": "slowly"
      "बोलौ": "speak"
  "awa-0014":
    native: "do you speak English?"
    notes:
      "n1": "Respectful."
    bases:
      "आप": "you (respectful)"
      "अंग्रेजी": "English"
      "बोलत": "speaking"
      "हौ": "are"
  "awa-0015":
    native: "how are you?"
    notes:
      "n1": "Respectful."
    bases:
      "आप": "you (respectful)"
      "कइसे": "how"
      "हौ": "are"
  "awa-0016":
    native: "I'm fine"
    notes:
      "n1": "The answer to how are you. ठीक (ṭhīk) is 'fine'."
    bases:
      "ठीक": "fine"
      "हन": "are; am"
  "awa-0017":
    native: "what is your name?"
    notes:
      "n1": "Respectful. The answer is हमार (hamār) नाव (nāv) ... आय (āy)."
    bases:
      "आपके": "your (respectful)"
      "आय": "is"
  "awa-0018":
    native: "my name is ..."
    notes:
      "n1": "Put your name where the dots are."
    bases:
      "हमार": "my"
      "आय": "is"
  "awa-0019":
    native: "where is the toilet?"
    notes:
      "n1": "सौचालय (saucālay) is 'toilet'."
    bases:
      "सौचालय": "toilet"
      "बा": "is"
  "awa-0020":
    native: "help!"
    notes:
      "n1": "Shouted in an emergency."

    bases:
      "बचाओ": "help!"