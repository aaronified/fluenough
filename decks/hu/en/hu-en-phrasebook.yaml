schema: 1
id: "hu-en-phrasebook"
kind: "layer"
core: "hu-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty survival phrases to say whole from the first lesson, before their words are taught: greetings and goodbyes, sorry, not understanding, asking the way and the price, and asking for help. Not yet checked by a Hungarian speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "hu-0011":
    native: "Good day; hello (polite)."
    notes:
      "n1": "A polite hello, in the daytime. Among friends, say szia."
    bases:
      "napot": "day"
  "hu-0012":
    native: "Good morning."
    notes:
      "n1": "Said in the morning, until about noon."
    bases:
      "reggelt": "morning"
  "hu-0013":
    native: "Good night."
    notes:
      "n1": "Said at bedtime, or when leaving late."
    bases:
      "éjszakát": "night"
  "hu-0014":
    native: "Goodbye (formal)."
    notes:
      "n1": "The formal goodbye, literally until seeing again."
    bases:
      "Viszontlátásra": "goodbye; until seeing again"
  "hu-0015":
    native: "Sorry; excuse me."
    notes:
      "n1": "Used to apologise, or to get past someone."
    bases:
      "Bocsánat": "sorry; pardon"
  "hu-0016":
    native: "Excuse me; I'm sorry."
    notes:
      "n1": "Literally: I ask for pardon. It is a stronger apology."
    bases:
      "Elnézést": "pardon; excuse"
      "kérek": "to ask for; to want"
  "hu-0017":
    native: "I don't understand."
    notes:
      "n1": "Nem is no or not. Értem is I understand."
    bases:
      "értem": "to understand"
  "hu-0018":
    native: "I don't speak Hungarian."
    notes:
      "n1": "Magyarul means in Hungarian. Other languages take the -ul ending too, as angolul does."
    bases:
      "beszélek": "to speak"
      "magyarul": "in Hungarian"
  "hu-0019":
    native: "Do you speak English?"
    notes:
      "n1": "The polite form, to a stranger."
    bases:
      "Beszél": "to speak (polite you)"
      "angolul": "in English"
  "hu-0020":
    native: "More slowly, please."
    notes:
      "n1": "Lassan is slowly. Lassabban is more slowly."
    bases:
      "Lassabban": "more slowly"
  "hu-0021":
    native: "How much does it cost?"
    notes:
      "n1": "Literally: how much does it come to."
    bases:
      "Mennyibe": "how much"
      "kerül": "to cost"
  "hu-0022":
    native: "The bill, please."
    notes:
      "n1": "Számla is a bill or an invoice."
    bases:
      "A": "the"
      "számlát": "bill; invoice"
  "hu-0023":
    native: "Help!"
    notes:
      "n1": "A cry for help."
    bases:
      "Segítség": "help"
  "hu-0024":
    native: "Where is the railway station?"
    notes:
      "n1": "Vasútállomás is a railway station. Put another place in for it."
    bases:
      "Hol": "where"
      "van": "is"
      "a": "the"
      "vasútállomás": "railway station"
  "hu-0025":
    native: "What does this mean?"
    notes:
      "n1": "Jelent is the verb to mean."
    bases:
      "Mit": "what"
      "jelent": "to mean"
      "ez": "this"
  "hu-0026":
    native: "My name is Anna."
    notes:
      "n1": "Literally: I am Anna. Put any name before vagyok."
    bases:
      "Anna": "Anna (a first name)"
      "vagyok": "to be"
  "hu-0027":
    native: "Pleased to meet you."
    notes:
      "n1": "A formal greeting, on meeting someone new."
    bases:
      "Örvendek": "to be glad"
  "hu-0028":
    native: "Where are you from?"
    notes:
      "n1": "Literally: from where did you come. Answer with the place."
    bases:
      "Honnan": "from where"
      "jöttél": "to come"
  "hu-0029":
    native: "All right; OK."
    notes:
      "n1": "An everyday OK."
    bases:
      "Rendben": "all right; OK"
  "hu-0030":
    native: "Enjoy your meal!"
    notes:
      "n1": "Literally: good appetite."
    bases:
      "étvágyat": "appetite"
