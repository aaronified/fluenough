"name": "Phrasebook: the tablets' formulae"
"description": "Three formulae of the tablets, read in transliteration. This language has no survival phrases: a reading course of administrative tablets, so fewer than fifteen defensible phrases exist. Not yet checked by a Mycenologist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "gmy-0011":
    "native": "they do not give"
    "notes":
      "n1": "A formula of the tablets, the path's own example. Its gloss follows the editions and the sense is conventional, not checked."
  "gmy-0012":
    "native": "so many"
    "notes":
      "n1": "The quantity formula of the tablets, read in transliteration."
  "gmy-0013":
    "native": "the total"
    "notes":
      "n1": "The total written at the foot of a tablet's list. The editions gloss it as total; the Greek is disputed."
