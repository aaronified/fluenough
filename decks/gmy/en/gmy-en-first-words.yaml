  "iso639_3": "eng"
  "name": "English"
"name": "First words"
"description": "Thirty-three words of Mycenaean Greek, the Greek of the Linear B tablets of the palaces of Pylos, Knossos and Mycenae, about 1450 to 1200 BCE. Each target is the word's Linear B spelling and the reading is its standard transliteration. Every word and gloss is from its entry on Wiktionary, named in its note; the IPA is that entry's phonemic form, simplified, with the classical Greek word given in the note. Not yet checked by a Linear B specialist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "gmy-0001":
    "native": "water"
    "notes":
      "n1": "Hudōr, water (the classical Greek word is hydōr). Wiktionary, the Mycenaean entry u-do."
  "gmy-0002":
    "native": "father"
    "notes":
      "n1": "Patēr, father (masculine; classical patēr). Wiktionary, pa-te. The same spelling also writes pantes, all (plural)."
  "gmy-0003":
    "native": "mother"
    "notes":
      "n1": "Mātēr, mother (feminine; classical mētēr). Wiktionary, ma-te; the spelling ma-te-re is its plural and a dative form."
  "gmy-0004":
    "native": "king; lord"
    "notes":
      "n1": "Wanaks, king, lord: the Mycenaean ruler of a palace (the classical word is anax, without the w). Wiktionary, wa-na-ka; its feminine is wa-na-sa."
  "gmy-0005":
    "native": "queen; lady"
    "notes":
      "n1": "Wanassa, queen, and a divine title or the name of a goddess (classical anassa). Wiktionary, wa-na-sa."
  "gmy-0006":
    "native": "god"
    "notes":
      "n1": "Tʰehos, god (classical theos). Wiktionary, te-o."
  "gmy-0007":
    "native": "bronze"
    "notes":
      "n1": "Kʰalkos, bronze (classical khalkos, copper or bronze). Wiktionary, ka-ko."
  "gmy-0008":
    "native": "olive oil"
    "notes":
      "n1": "Elaiwon, olive oil (classical elaion), spelled e-rai-wo on tablet PY Fr 1184 and, with the i left out, e-ra-wo. Wiktionary, e-rai-wo (whose entry quotes the tablet) and e-ra-wo."
  "gmy-0009":
    "native": "tripod cauldron"
    "notes":
      "n1": "Tripōs, a three-legged cauldron (classical tripous, tripod). Wiktionary, ti-ri-po."
  "gmy-0010":
    "native": "two"
    "notes":
      "n1": "Dwo, two: a syllable sign that also stands for the numeral (the word is duwo, classical duo); the entry says the numeral is more often written with a number sign. Wiktionary, dwo."
  "gmy-0011":
    "native": "and"
    "notes":
      "n1": "Qe, and: a particle put after the word it joins, like the classical -te. Wiktionary, qe (its first entry is the syllable sign qe, which stands for kʷe, gʷe or kʷʰe)."
  "gmy-0012":
    "native": "all (dative plural)"
    "notes":
      "n1": "Pansi, to all, for all (dative plural). The same spelling also writes the verb pʰāsi, he says. Wiktionary, pa-si."
  "gmy-0013":
    "native": "so much; so many"
    "notes":
      "n1": "Tos(s)os, so much, so many, such an amount or number (classical tosos). Wiktionary, to-so, labelled a determiner."
  "gmy-0014":
    "native": "he has; she has"
    "notes":
      "n1": "E-ke, hekʰei, he or she has (third singular present). Wiktionary lists e-ke as a form of the verb e-ke-e, to have, which is classical ekhein."
  "gmy-0015":
    "native": "person; human being"
    "notes":
      "n1": "Antʰrōkʷos, person, human (classical anthrōpos, with kʷ where the classical word has p). Wiktionary, a-to-ro-qo."
  "gmy-0016":
    "native": "for women; of a woman"
    "notes":
      "n1": "Gunaiā, an adjective: depicting a woman, for women's use (from gunē, woman). Wiktionary, ku-na-ja. It describes women's goods on the tablets; it is not the noun woman, which has another spelling."
  "gmy-0017":
    "native": "village; community"
    "notes":
      "n1": "Dāmos, village, community, also the body that allocated land holdings. Wiktionary, da-mo (classical dēmos)."
  "gmy-0018":
    "native": "lady; Potnia"
    "notes":
      "n1": "Potnia, lady, and a goddess, the Potnia of the tablets (classical potnia). Wiktionary, po-ti-ni-ja."
  "gmy-0019":
    "native": "slave; servant"
    "notes":
      "n1": "Dohelos, male slave, servant (feminine do-e-ra; classical doulos). Wiktionary, do-e-ro."
  "gmy-0020":
    "native": "plot of land"
    "notes":
      "n1": "Ktoinā, an estate, a plot of land (feminine). Wiktionary, ko-to-na."
  "gmy-0021":
    "native": "wine"
    "notes":
      "n1": "Woinos, wine (classical oinos, without the w). Wiktionary, wo-no."
  "gmy-0022":
    "native": "priest"
    "notes":
      "n1": "Hijereus, priest, diviner (classical hiereus). Wiktionary, i-je-re-u."
  "gmy-0023":
    "native": "boy; youth"
    "notes":
      "n1": "Korwos, boy, youth (classical koros). Wiktionary, ko-wo (another word spelled ko-wo, kōwos, means sheepskin)."
  "gmy-0024":
    "native": "girl; maiden"
    "notes":
      "n1": "Korwā, girl, maiden (feminine; classical korē). Wiktionary, ko-wa."
  "gmy-0025":
    "native": "gold"
    "notes":
      "n1": "Kʰrusos, gold (classical khrusos). Wiktionary, ku-ru-so."
  "gmy-0026":
    "native": "honey"
    "notes":
      "n1": "Meli, honey (classical meli). Wiktionary, me-ri."
  "gmy-0027":
    "native": "local chieftain; court official"
    "notes":
      "n1": "Gʷasileus, a court official or local chieftain (classical basileus, king). Wiktionary, qa-si-re-u; its feminine is qa-si-re-ja."
  "gmy-0028":
    "native": "shepherd"
    "notes":
      "n1": "Poimēn, shepherd (classical poimēn). Wiktionary, po-me."
  "gmy-0029":
    "native": "messenger"
    "notes":
      "n1": "Angelos, messenger (classical angelos). Wiktionary, a-ke-ro."
  "gmy-0030":
    "native": "table"
    "notes":
      "n1": "Torpedza, table (feminine; classical trapeza). Wiktionary, to-pe-za."
  "gmy-0031":
    "native": "follower; companion"
    "notes":
      "n1": "Hekʷetās, a follower, companion, and a high-ranking official attached to the palace, perhaps a companion of the wanax. Wiktionary, e-qe-ta."
  "gmy-0032":
    "native": "lawagetas"
    "notes":
      "n1": "Lāwāgetās, a high official of the palace, second in rank to the wanax, traditionally read as the leader of the host. Wiktionary, ra-wa-ke-ta."
  "gmy-0033":
    "native": "potter"
    "notes":
      "n1": "Kerameus, potter (masculine). Wiktionary, ke-ra-me-u (classical kerameus)."
