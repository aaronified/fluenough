  "name": "English"
"name": "First words"
"description": "Twenty-one words of the Linear B tablets of Mycenaean Greek, about 1450 to 1200 BCE, in the syllabary of the tablets. The reading is the standard transliteration (pa-te); the Greek a learner restores is given in the notes. Only words attested in the sources read are marked as such; the rest are marked doubtful. The IPA is broad and reconstructed, for about the fifth century BC, a reading aid for a reading course. Not yet checked by a Mycenaean specialist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "gmy-0001":
    "native": "water"
    "notes":
      "n1": "Hydōr, water (Greek hudōr, the Linear B spelling is u-do). Source: Wiktionary, Mycenaean Greek Swadesh list (water, item 150)."
  "gmy-0002":
    "native": "father"
    "notes":
      "n1": "Pater, father (Greek patēr). Attested. Source: Wiktionary, Mycenaean Greek Swadesh list (item 43); Wikipedia, Linear B."
  "gmy-0003":
    "native": "mother"
    "notes":
      "n1": "Meter, mother (Greek mētēr). Attested in the Linear B spelling ma-te-re. Source: Wiktionary, Mycenaean Greek Swadesh list (item 42)."
  "gmy-0004":
    "native": "lord; king (the wanax, the high ruler of a palace)"
    "notes":
      "n1": "Wanax, lord, overlord or king (Greek anax). Source: Wikipedia, Linear B (the wanax spelling) and Mycenaean Greek."
  "gmy-0005":
    "native": "queen (lady of the palace)"
    "notes":
      "n1": "Wanassa, queen (Greek anassa, lady). Source: Wikipedia, Mycenaean Greek."
  "gmy-0006":
    "native": "god"
    "notes":
      "n1": "Theos, god (Greek theos). Source: Wikipedia, Mycenaean Greek."
  "gmy-0007":
    "native": "bronze (copper)"
    "notes":
      "n1": "Khalkos, bronze (Greek khalkos; the source gives copper). Source: Wikipedia, Linear B and Mycenaean Greek."
  "gmy-0008":
    "native": "olive oil"
    "notes":
      "n1": "Elaion, olive oil (Greek elaion); also written e-rai-wo. Source: Wikipedia, Mycenaean Greek."
  "gmy-0009":
    "native": "tripod"
    "notes":
      "n1": "Tripous, tripod (Greek tripous). Source: Wikipedia, Linear B."
  "gmy-0010":
    "native": "two"
    "notes":
      "n1": "Dwo, two (Greek duo). Source: Wiktionary, Mycenaean Greek Swadesh list (item 23)."
  "gmy-0011":
    "native": "and"
    "notes":
      "n1": "Qe, and (Greek te, Homeric -te), written as an enclitic after a word. Source: Wiktionary, Mycenaean Greek Swadesh list (item 204)."
  "gmy-0012":
    "native": "all; everything"
    "notes":
      "n1": "Panta, all (Greek panta). Source: Wikipedia, Linear B (orthography). The Swadesh list gives pa-si and pa-te for all."
  "gmy-0013":
    "native": "so much; so many"
    "notes":
      "n1": "Tosos, so much (Greek tosos). Source: Wikipedia, Linear B."
  "gmy-0014":
    "native": "I"
    "notes":
      "n1": "Egō, I (Greek egō). The sources give e-ko for I, and also note the possibility ekhō (I have), so the reading is not certain. Source: Wikipedia, Linear B."
  "gmy-0015":
    "native": "human being; man"
    "notes":
      "n1": "Anthrōpos, human being (Greek anthrōpos). The gloss human being is from the Swadesh list; the Greek restoration is not in the sources read. Source: Wiktionary, Mycenaean Greek Swadesh list (item 38)."
  "gmy-0016":
    "native": "woman"
    "notes":
      "n1": "Gunaia, woman (Greek gunē). The word is given for woman in the Swadesh list; its Greek restoration is not in the sources read. Source: Wiktionary, Mycenaean Greek Swadesh list (item 36)."
  "gmy-0017":
    "native": "people; district"
    "notes":
      "n1": "Damos, people or community (Greek dāmos). Not in the sources read; doubtful until checked against a Linear B lexicon."
  "gmy-0018":
    "native": "mistress; lady (a goddess's title)"
    "notes":
      "n1": "Potnia, mistress or lady (Greek potnia). Not in the sources read; doubtful until checked against a Linear B lexicon."
  "gmy-0019":
    "native": "slave"
    "notes":
      "n1": "Doulos, slave (Greek doulos). Not in the sources read; doubtful until checked against a Linear B lexicon."
  "gmy-0020":
    "native": "plot of land"
    "notes":
      "n1": "Ktoinā, a plot of land (Greek ktoinā). Given in the path plan; not in the sources read, so doubtful until checked."
  "gmy-0021":
    "native": "wine"
    "notes":
      "n1": "Woinos, wine (Greek oinos, with w in Mycenaean). Given in the path plan; not in the sources read, so doubtful until checked."
