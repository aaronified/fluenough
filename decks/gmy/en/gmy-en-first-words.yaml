"name": "First words"
"description": "Ten words of the Linear B tablets, from Knossos, Pylos and Thebes: titles, the palace's metals and objects, and the commonest particles. Each card's target is its Linear B signs, and its reading is the standard syllable transliteration; the Greek behind the spelling is a scholar's reconstruction. There is no pronunciation and no native speaker. Not yet checked by a Mycenologist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "gmy-0001":
    "native": "king"
    "notes":
      "n1": "Wanax, king: the title of the palace's ruler, in the tablets as wa-na-ka. The Greek is a scholar's reconstruction, and the word is attested."
  "gmy-0002":
    "native": "the community; the district"
    "notes":
      "n1": "Damos, the community or land of a district, in the tablets as da-mo. The Greek is reconstructed."
  "gmy-0003":
    "native": "mistress; lady"
    "notes":
      "n1": "Potnia, mistress or lady, the title of a goddess or a great woman, in the tablets as po-ti-ni-ja."
  "gmy-0004":
    "native": "bronze"
    "notes":
      "n1": "Khalkos, bronze, in the tablets as ka-ko. The Greek is reconstructed from the spelling."
  "gmy-0005":
    "native": "gold"
    "notes":
      "n1": "Khrusos, gold, in the tablets as ku-ru-so. The Greek is reconstructed from the spelling."
  "gmy-0006":
    "native": "tripod"
    "notes":
      "n1": "Tripous, a three-legged stand, in the tablets as ti-ri-po-de. The Greek is reconstructed from the spelling."
  "gmy-0007":
    "native": "so many"
    "notes":
      "n1": "So many, a quantity word of the tablets, in the form to-so. Its use with numbers is attested."
  "gmy-0008":
    "native": "not"
    "notes":
      "n1": "The negative particle of the tablets, in the form o-u. Its Greek is reconstructed as ou."
  "gmy-0009":
    "native": "boy; youth"
    "notes":
      "n1": "Kouros, a youth, in the tablets as ko-ro; the word is attested and its Greek is reconstructed."
  "gmy-0010":
    "native": "new"
    "notes":
      "n1": "Neos, new, in the tablets as ne-wo, with its feminine ne-wa, which the path cites for agreement."
