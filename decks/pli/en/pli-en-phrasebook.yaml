"tags":
- "unreviewed"
"cards":
  "pli-0011":
    "native": "Homage to him, the Blessed One, the Worthy One, the fully Awakened One."
    "notes":
      "n1": "The opening formula of Pali recitation, attested in the canon and in chanting. Namo tassa is said before the Three Refuges."
  "pli-0012":
    "native": "I go to the Buddha for refuge."
    "notes":
      "n1": "The first of the Three Refuges (Khuddakapāṭha 1). Attested."
  "pli-0013":
    "native": "I go to the Dhamma for refuge."
    "notes":
      "n1": "The second of the Three Refuges. Attested."
  "pli-0014":
    "native": "I go to the Sangha for refuge."
    "notes":
      "n1": "The third of the Three Refuges. Attested."
  "pli-0015":
    "native": "Venerable sir."
    "notes":
      "n1": "Bhante is how a layperson or a junior monk addresses a monk. Attested very often in the canon."
  "pli-0016":
    "native": "Friend."
    "notes":
      "n1": "Āvuso is how a monk addresses a monk who is his junior or his equal, or a layperson. Attested very often."
  "pli-0017":
    "native": "Yes, venerable sir."
    "notes":
      "n1": "Evaṁ, bhante is the usual yes to a monk or to the Buddha. Attested very often."
  "pli-0018":
    "native": "Well said, well said, well said."
    "notes":
      "n1": "The threefold sādhu is the response of approval after a teaching or a gift. Attested in chanting and in the commentaries; the single sādhu is canonical."
  "pli-0019":
    "native": "Thus have I heard."
    "notes":
      "n1": "The opening of nearly every sutta, said to be Ānanda's. Attested."
  "pli-0020":
    "native": "All conditioned things are impermanent."
    "notes":
      "n1": "Dhammapada 277, the first of the three marks. Attested."
  "pli-0021":
    "native": "Strive on with diligence."
    "notes":
      "n1": "The Buddha's last words (Dīgha Nikāya 16). Attested; the ending -etha is for more than one person."
  "pli-0022":
    "native": "Is it bearable for you, are you getting by?"
    "notes":
      "n1": "The stock inquiry after someone's health and comfort in the Vinaya and the suttas. Attested in this pattern with kacci vo (to you all) or kacci te; a scholar should confirm the exact wording."
  "pli-0023":
    "native": "May all beings be happy."
    "notes":
      "n1": "A wish of loving-kindness in common chanting, drawn from the Mettā Sutta; this exact wording is liturgical rather than a canonical line. Conventional."
  "pli-0024":
    "native": "I do not know."
    "notes":
      "n1": "Not a quoted line: composed from attested words (na, jānāmi) and therefore conventional."
  "pli-0025":
    "native": "Listen."
    "notes":
      "n1": "Suṇātha, listen (to more than one person), as in the canon's formula suṇātha sādhukaṁ manasi karotha, listen and pay close attention. Attested."
