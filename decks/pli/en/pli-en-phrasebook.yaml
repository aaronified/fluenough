"name": "Phrasebook: first phrases"
"description": "Fifteen attested or conventional Pali phrases from the canon and from chanting: the Three Refuges, how to address a monk, yes and well said, how a sutta begins, a stock question after someone's health, and I do not know. Devanagari with the same reading and IPA as the first-words deck. Each card's note says whether it is quoted or conventional. Not yet checked by a Pali scholar: please report any mistake."
