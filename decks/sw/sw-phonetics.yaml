schema: 1
kind: "phonetics"
id: "sw-phonetics"
language: "sw"
variety: "Standard Swahili (Kiswahili sanifu), as the course's broad ipa writes it (tools/transcribe.py swahili_ipa(): penultimate stress marked, the vowels a e i o u) and as Wiktionary's Swahili pronunciation forms write the consonants, not a coastal dialect (Kimvita, Kiamu) and not Congolese or Ugandan speech"
description: "Rules that turn a card's broad ipa into its narrow [ ] form, in order. Written for tools/derive_phonetic.py, never read by the app. Each rule applies the regular expression to the whole ipa string and replaces every match; the next rule works on the result. Only rules that are attested are here. The course's broad ipa for Swahili writes a prenasalised stop as a nasal and a stop (mb nd ŋɡ ndʒ nz), the nasal that stands alone as a syllable (the m of mtu, mkono) as a plain m, and b d ɡ dʒ w as plain letters. So the rules add what it does not say: a word-initial m or n before a consonant is a syllabic nasal (sw-m-syllabic, sw-n-syllabic), a b d ɡ j that is not prenasalised is an implosive ɓ ɗ ɠ ʄ (sw-*-implosive; after a nasal the stop stays plain, which is the prenasalised stop), and a consonant before w is labialised (sw-labialised). the prenasalised stops are not written (see (4a) below). Source for all of them: Wiktionary's Swahili pronunciation forms (kaikki.org dump of the Swahili entries, read 2026-11-27: 21723 entries, 1305 sound forms, 1302 of them written phonemically between slashes and 3 narrow). Wiktionary's forms are phonemic and in a convention that differs from the deck's, so they were read as evidence for each rule, not copied; each rule's source gives its counts. Left out, on purpose, and why (the same items are rows of docs/review-queue/sw.md): (4a) the prenasalised stops mb nd ŋɡ ndʒ nz as one sound: Wiktionary writes them with a superscript nasal in every form that has one (ᵐb in 80 forms, ⁿd in 75, ᵑɡ in 108, ⁿdʒ in 10, ⁿz in 18, no counter-example but mbwa) and the sound is attested, but the validator's IPA letter set (tools/validate_decks.py IPA_RE) has ⁿ (U+207F) and not ᵐ ᵑ (U+1D50, U+1D51), so a form with them would be refused and a rule for ⁿ alone would write the prenasalised stops inconsistently; the sequence stays a nasal and a stop, as in the broad ipa, and the implosive rules leave a stop after a nasal plain; (0) aspiration of the voiceless stops: not standard Swahili (Wikipedia, Swahili phonology: some dialects only, unmarked in the orthography); Wiktionary writes ʰ in 40 forms (Pemba [pʰɛᵐbɑ], mtu [m̩tʰu]) next to the plain stop in the same words, so no rule writes it; (1) the vowels: Wiktionary writes ɑ ɛ ɔ in every form, Wikipedia (Swahili phonology, after Polomé) says ɑ is pronounced [a] except after w, ɛ i ɔ u are [e ɪ o ʊ] in unstressed syllables and before a prenasalised consonant, and that final a can be [ə]; the sources disagree, so the deck's a e i o u stand and nothing is written; (2) the vowel length ː for a doubled vowel: Wiktionary writes it in 59 of 75 words with a doubled vowel (mguu [m̩ɠuː], ree [ɾɛː]) but a hiatus in the rest (laana [lɑˈɑnɑ], aali [ɑˈɑli], maada), and Wikipedia says length is not phonemic; (3) the tap [ɾ] against the trill [r]: Wikipedia says a tap by most speakers, which is what the broad ipa already writes; (4) ᶬ for mv (Wiktionary writes it in five forms, not in the course's words; mvi and mvumo are syllabic m̩v) and the clusters mp nk ns, which are plain; (5) m before ɲ (mnyama) and before m (mmoja) as syllabic: the dump has no such form; (6) the word mbwa, written [m̩bʷɑ] in Wiktionary (a syllabic m, unlike [ᵐbuzi]): one entry, and the rules write [mbʷa]; (7) the fricatives ð θ ɣ ʒ and the pharyngeals of Arabic loans (laani [lɑˈʕɑni], hata [ˈħɑtːɑ]): the broad ipa has no such sound written for them to narrow. A rule left out is not a claim that it does not exist. The rules ship unreviewed: a Swahili phonetician should confirm that the implosives are the standard realisation (Wikipedia's table writes ɓ ~ b, ɗ ~ d, ɠ ~ ɡ as variants) and the syllabic nasals."
rules:
  - id: "sw-n-syllabic"
    pattern: '(?:^|(?<=\s)|(?<=^ˈ)|(?<=\sˈ))n(?=ˈ?tʃ)'
    replace: "n̩"
    source: "Wiktionary's Swahili pronunciation forms (kaikki.org dump read 2026-11-27, phonemic): the word-initial n before a consonant that is not prenasalised is a syllable of its own in nchi [ˈn̩tʃi], the only such form. Only n before tʃ, so no unattested word is touched; the pattern is a word start, or a word start and the stress mark."
  - id: "sw-m-syllabic"
    pattern: '(?:^|(?<=\s)|(?<=^ˈ)|(?<=\sˈ))m(?=ˈ?[fhklnpstvzʃɾdɡ])'
    replace: "m̩"
    source: "Wiktionary's Swahili pronunciation forms (kaikki.org dump read 2026-11-27, phonemic): a word-initial m before a consonant is the syllabic m̩ in all 64 forms of the shapes listed, none writes a plain m (mtu [ˈm̩tu], mkulima, mzee, mlango, mfinyanzi, mhudumu, mpea, mvi, mshikaki, mruzi, mnara, mdomo [m̩ˈɗɔmɔ], mgeni, mjanja [m̩ˈʄɑ…]); before w the m is a plain consonant (mwaka [ˈmʷɑkɑ], 28 forms), and mb is a prenasalised stop, which is not given a rule here (a b in the list is not there on purpose). The consonants listed are the ones the dump attests after m̩: f h k l n p s t (tʃ) v z ʃ ɾ d ɡ (and j, which the broad ipa writes dʒ). m before ɲ or m is not attested and is left alone."
  - id: "sw-dzh-implosive"
    pattern: "(?<!n)dʒ"
    replace: "ʄ"
    source: "Wiktionary's Swahili pronunciation forms (kaikki.org dump read 2026-11-27, phonemic): j that is not prenasalised is the implosive ʄ in all 81 forms that have it (moja [ˈmɔʄɑ], mirija, wajibu [ˈwɑʄiɓu], jedhamu, mjanja [m̩ˈʄɑⁿdʒɑ]); the plain affricate dʒ is written only after a nasal (ⁿdʒ, sw-prenasal). The broad ipa writes j as dʒ."
  - id: "sw-b-implosive"
    pattern: "(?<!m)b"
    replace: "ɓ"
    source: "Wiktionary's Swahili pronunciation forms (kaikki.org dump read 2026-11-27, phonemic): b that is not prenasalised is the implosive ɓ in 157 forms; a plain b is written in three forms only (mbwa [ˈm̩bʷɑ] and two forms of hotuba [hoˈtuba]). Wikipedia (Swahili phonology) lists the stops as ɓ ~ b, so the implosive is the written variant, not the only one; see the review queue."
  - id: "sw-d-implosive"
    pattern: "(?<!n)d"
    replace: "ɗ"
    source: "Wiktionary's Swahili pronunciation forms (kaikki.org dump read 2026-11-27, phonemic): d that is not prenasalised is the implosive ɗ in 83 forms (dawa [ˈɗɑwɑ], duru, idadi [iˈɗɑɗi], mdomo [m̩ˈɗɔmɔ], madondoandume); the plain d is written only for dh (dhambi, dhakari) and in ardhi. Wikipedia lists ɗ ~ d."
  - id: "sw-g-implosive"
    pattern: "(?<!ŋ)ɡ"
    replace: "ɠ"
    source: "Wiktionary's Swahili pronunciation forms (kaikki.org dump read 2026-11-27, phonemic): ɡ that is not prenasalised is the implosive ɠ in 73 forms (magari [mɑˈɠɑɾi], lugha, zogo, Mghana [m̩ˈɠɑnɑ], mguu [m̩ˈɠuː]); the plain ɡ is written only in ghafi and ghulamu, which are gh. Wikipedia lists ɠ ~ ɡ."
  - id: "sw-labialised"
    pattern: "([bkmpstɓɡɠɲɾ])w(?=[aeiou])"
    replace: "\\1ʷ"
    source: "Wiktionary's Swahili pronunciation forms (kaikki.org dump read 2026-11-27, phonemic): a consonant before w and a vowel is labialised in all 56 forms that have the shape, none writes the w apart: k (kwanza, kweli, kwenda), m (mwaka [ˈmʷɑkɑ], 28 forms), t (kuitwa, mtwana), p (pwani), ɓ (kubwa, bweni), ɡ (chungwa), ɲ (nywa), ɾ (Kinyarwanda), s (Kiswahili), b after a nasal (mbwa, mbweha, written ʷ after a syllabic m or ᵐ). Only these consonants, the ones the dump attests; last, after the implosive rules."
