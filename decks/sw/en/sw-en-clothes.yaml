    notes:
      "n1": "Noun class 9/10: nguo, nguo. The entry marks it as used in the plural."
      "n2": "Meaning used: clothing or clothes (sense 3 of the entry). A1-relevant sense is sense 3 of 3 (sense 1 not the A1 meaning)."
    examples:
      "Hapa ni nguo.":
        native: "Here is a clothing or clothes."
        bases:
          "Hapa": "here"
          "ni": "is"
          "nguo": "clothing or clothes"
      "Ninapenda nguo.":
        native: "I like the clothing or clothes."
        bases:
