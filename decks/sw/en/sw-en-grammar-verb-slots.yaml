schema: 1
id: "sw-en-grammar-verb-slots"
kind: "layer"
core: "sw-grammar-verb-slots"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verb slots and not"
description: "Three verbs, read, like and eat, each in six frames (now, past, future and the three that say not) for the six persons. Built from the forms and the verb appendix on Wiktionary. Not yet checked by a Swahili speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
pattern:
  name: "The Swahili verb: subject, tense, stem; and negation"
  slot_name: "person"
  prompt: "{lemma} ({gloss}), {slot}"
  slots:
    "i": "I"
    "you": "you (one person)"
    "he-she": "he or she"
    "we": "we"
    "you-pl": "you (more than one)"
    "they": "they"
  entries:
    "soma-present": "to read; present: subject + na + stem"
    "soma-past": "to read; past: subject + li + stem"
    "soma-future": "to read; future: subject + ta + stem"
    "soma-neg-present": "to read; not now: negative subject + stem ending in -i"
    "soma-neg-past": "to read; did not: negative subject + ku + stem"
    "soma-neg-future": "to read; will not: negative subject + ta + stem"
    "penda-present": "to love; to like; present: subject + na + stem"
    "penda-past": "to love; to like; past: subject + li + stem"
    "penda-future": "to love; to like; future: subject + ta + stem"
    "penda-neg-present": "to love; to like; not now: negative subject + stem ending in -i"
    "penda-neg-past": "to love; to like; did not: negative subject + ku + stem"
    "penda-neg-future": "to love; to like; will not: negative subject + ta + stem"
    "la-present": "to eat; present: subject + na + stem"
    "la-past": "to eat; past: subject + li + stem"
    "la-future": "to eat; future: subject + ta + stem"
    "la-neg-present": "to eat; not now: negative subject + stem ending in -i"
    "la-neg-past": "to eat; did not: negative subject + ku + stem"
    "la-neg-future": "to eat; will not: negative subject + ta + stem"
  notes: "A Swahili verb is one word built from slots in a fixed order: subject, tense, (object), stem. In ni-na-ku-penda, I like you, ni- is I, -na- is now, -ku- is you and -penda is the stem. The subjects are ni- (I), u- (you), a- (he or she), tu- (we), m- (you, many) and wa- (they). Tense markers: -na- for now, -li- for the past, -ta- for the future. Saying not changes the front: the subjects become si-, hu-, ha-, hatu-, ham- and hawa-. The negative present drops the tense marker and ends in -i (somi, pendi; the stem -la gives li); the negative past uses -ku- in place of -li-; the negative future keeps -ta-. A short stem such as -la keeps its ku after a marker (ninakula, nilikula), and in the negative past the ku joins the subject (sikula). The 1st and 2nd person past can also be longer, with -li- extended to -nali- (Wiktionary's verb appendix). Sources: Wiktionary's Swahili verb appendix and the verb entries -soma, -penda and -la; the table is each verb's forms built on those."
