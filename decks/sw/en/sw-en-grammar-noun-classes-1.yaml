tags: ["beginner", "grammar", "unreviewed"]
pattern:
  name: "Noun classes: singular and plural"
  slot_name: "number"
  prompt: "{lemma} ({gloss}), {slot}"
  slots:
    "singular": "singular (one)"
    "plural": "plural (more than one)"
  entries:
    "mtu": "person; class m-wa"
    "mtoto": "child; class m-wa"
    "mgeni": "stranger; guest; class m-wa"
    "mwanamke": "woman; class m-wa"
    "mti": "tree; class m-mi"
    "mkono": "hand; arm; class m-mi"
    "mwaka": "year; class m-mi"
    "mlima": "hill; mountain; class m-mi"
    "jina": "name; class ji-ma"
    "jicho": "eye; class ji-ma"
    "yai": "egg; class ji-ma"
    "embe": "mango; class ji-ma"
    "kitabu": "book; class ki-vi"
    "kiti": "chair; class ki-vi"
    "kitu": "thing; class ki-vi"
    "chumba": "room; class ki-vi"
    "kikombe": "cup; class ki-vi"
    "nyumba": "house; class n"
    "paka": "cat; class n"
    "nchi": "country; class n"
    "shule": "school; class n"
    "chai": "tea; class n"
    "mbwa": "dog; class n (also m-wa)"
    "ulimi": "tongue; class u"
    "uso": "face; class u"
    "uzi": "thread; class u"
    "ubavu": "rib; side; class u"
    "ukuta": "wall; class u"
    "ufunguo": "key; class u"
  notes: "Every Swahili noun belongs to a class, and the class shows in its prefix; the plural is another prefix, so the classes come in pairs named after them. m- with wa- holds mostly people; m- with mi- trees, plants and many other things; ji- (or no prefix) with ma- fruits and round things; ki- with vi- tools, languages and small things; n- (often only the sound n, m or ny, and the plural looks like the singular) holds many animals, loanwords and other things; u- takes n- or no prefix in the plural. Wiktionary numbers these I and II, III and IV, V and VI, VII and VIII, IX and X, and XI. The stem can change when the prefix does: chumba becomes vyumba (ch turns into vy), ulimi becomes ndimi, uso becomes nyuso, ubavu becomes mbavu, ukuta loses its u- to become kuta, and mwanamke becomes wanawake, where both parts change. Words for people and animals can sit in the n class and still agree like people: Wiktionary lists mbwa as class I and IX."
