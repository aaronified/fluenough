name: "Noun classes: one and many"
description: "Twenty-nine nouns from the six noun-class pairs of Swahili, each with its singular and its plural. Taken from the entries and the noun-class appendix on Wiktionary. Not yet checked by a Swahili speaker: please report any mistake."
