schema: 1
id: "sw-en-sound-differences"
kind: "layer"
core: "sw-sound-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Swahili sounds that differ from English"
description: "17 words for the sounds Swahili has and English lacks or spells differently: ng' and ng, prenasalised mb nd nj nz mv, syllabic m and n, ny, dh gh th, long vowels and stress. Taken from Wiktionary's pronunciation page and the words' own entries. Not yet checked by a Swahili speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sw-0800":
    native: "cow; ox"
    notes:
      "n1": "ng' with an apostrophe is one sound, the ng at the end of English sing, [ŋ]. Wiktionary's pronunciation page gives this very word as its example. Swahili also says it at the start of a word, as here, where English never does."
      "n2": "Wiktionary lists the word in classes I and IX: the plural ng'ombe looks the same as the singular."
  "sw-0801":
    native: "drum; dance"
    notes:
      "n1": "ng without an apostrophe is a different sound from ng': the n and the g are said together, one after the other, as in English finger [ŋɡ]. Wiktionary lists it among the prenasalised consonants, with mb, mv, nd, nj and nz."
      "n2": "Compare ng'ombe, cow: the apostrophe is the only thing that tells ng' [ŋ] from ng [ŋɡ]."
  "sw-0802":
    native: "dog"
    notes:
      "n1": "mb is one sound: the lips close for m and open for b without a break. Wiktionary writes it [ᵐb], one of its prenasalised consonants. In this word it begins the only syllable."
  "sw-0803":
    native: "banana"
    notes:
      "n1": "nd is one prenasalised sound, [ⁿd]: begin with the nasal and release straight into d. It is the same pattern as mb in mbwa."
  "sw-0804":
    native: "path; road; way"
    notes:
      "n1": "nj is a prenasalised j, [ⁿdʒ]. The spelling is nj, and the sound is an n followed at once by the j of English judge. In the course's IPA it is written ndʒ."
  "sw-0805":
    native: "fly (the insect)"
    notes:
      "n1": "nz is a prenasalised z, [ⁿz]. Here it is the whole word, with no vowel: the word is a single syllable."
  "sw-0806":
    native: "rain"
    notes:
      "n1": "mv is a prenasalised v, [ᶬv], the lips close for m and then open into v. Wiktionary lists mv among the prenasalised consonants."
      "n2": "Wiktionary lists it as a class IX noun with no plural."
  "sw-0807":
    native: "child"
    notes:
      "n1": "The m before t is a syllable of its own, a syllabic m, written [m̩] by Wiktionary, which gives mtoto as its example. So mtoto has three syllables: m, to, to."
      "n2": "Stress falls on the second-last syllable, here the first to. The course's IPA marks it: mˈtoto."
  "sw-0808":
    native: "country"
    notes:
      "n1": "The n is a syllable of its own, a syllabic n, written [n̩] by Wiktionary, which gives nchi as its example. So nchi has two syllables: n and chi. The course's IPA puts the stress mark before the n."
      "n2": "ch is one sound, [tʃ], as in English church."
  "sw-0809":
    native: "house"
    notes:
      "n1": "ny is one sound, [ɲ]: the middle of the tongue presses on the roof of the mouth. It is not an n followed by a y. Wiktionary lists the word as a class IX noun with the plural nyumba."
  "sw-0810":
    native: "sin; crime; offence"
    notes:
      "n1": "dh is one sound, [ð], the th of English this. Wiktionary gives this word as its example. dh, gh, th and kh belong to borrowed words, as the pronunciation page lists them."
      "n2": "Wiktionary lists the word as a class V noun with the plural madhambi."
  "sw-0811":
    native: "expensive"
    notes:
      "n1": "gh is one sound, [ɣ]: a g with the tongue not quite closing, a voiced scrape. Wiktionary gives this word as its example."
      "n2": "Wiktionary gives the word as invariable, so it takes no class prefix."
  "sw-0812":
    native: "thirty"
    notes:
      "n1": "th is one sound, [θ], the th of English thin, not the ð of dhambi. Wiktionary lists it with dh, gh and kh."
      "n2": "Wiktionary gives the word as invariable."
  "sw-0813":
    native: "tea"
    notes:
      "n1": "ch is one sound, [tʃ], as in English church, even before a vowel. The course writes it tʃ in the IPA."
  "sw-0814":
    native: "school"
    notes:
      "n1": "sh is one sound, [ʃ], as in English ship. Wiktionary lists the word as a class IX noun with the plural shule."
  "sw-0815":
    native: "sheep"
    notes:
      "n1": "The oo is two vowels said as one long one. Wiktionary marks length with [ː] and gives kondoo as its example."
      "n2": "The nd is the prenasalised sound of ndizi."
  "sw-0816":
    native: "book"
    notes:
      "n1": "Stress usually falls on the second-last syllable, the one before the last: ki-TA-bu. Swahili does not write the stress, and the course's IPA marks it with ˈ."
      "n2": "Swahili has five vowels, written a, e, i, o, u. Wiktionary gives them as [ɑ ɛ i ɔ u]; the course's IPA writes a, e, i, o, u."
