schema: 1
id: "sw-en-sound-differences"
kind: "layer"
core: "sw-sound-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Swahili sounds that differ from English"
description: "16 words for the sounds Swahili has and English lacks or spells differently: ng' and ng, prenasalised mb nd nj nz mv, syllabic m and n, ny, dh gh th, long vowels and stress. Taken from Wiktionary's pronunciation page and the words' own entries. Not yet checked by a Swahili speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sw-0800":
    native: "across; overseas; abroad"
    notes:
      "n1": "ng' with an apostrophe is one sound, the ng at the end of English sing, [ŋ]. Wiktionary's pronunciation page gives ng'ombe, cow, as its example, and ng'ambo has the same first sound. Swahili says it at the start of a word, where English never does."
      "n2": "Wiktionary lists the word as a class IX noun with the plural ng'ambo."
  "sw-0801":
    native: "drum; dance"
    notes:
      "n1": "ng without an apostrophe is a different sound from ng': the n and the g are said together, one after the other, as in English finger [ŋɡ]. Wiktionary lists it among the prenasalised consonants, with mb, mv, nd, nj and nz."
      "n2": "Compare ng'ambo: the apostrophe is the only thing that tells ng' [ŋ] from ng [ŋɡ]."
  "sw-0802":
    native: "seed"
    notes:
      "n1": "mb is one sound: the lips close for m and open for b without a break. Wiktionary writes it [ᵐb], one of its prenasalised consonants."
      "n2": "Wiktionary lists the word as a class IX noun with the plural mbegu."
  "sw-0803":
    native: "dream"
    notes:
      "n1": "nd is one prenasalised sound, [ⁿd]: begin with the nasal and release straight into d. It is the same pattern as mb in mbegu."
  "sw-0804":
    native: "pigeon; dove"
    notes:
      "n1": "nj is a prenasalised j, [ⁿdʒ]. The spelling is nj, and the sound is an n followed at once by the j of English judge. In the course's IPA it is written ndʒ."
  "sw-0805":
    native: "locust"
    notes:
      "n1": "nz is a prenasalised z, [ⁿz]: begin with the nasal and release straight into z. It is one of the prenasalised consonants Wiktionary lists."
  "sw-0806":
    native: "rain"
    notes:
      "n1": "mv is a prenasalised v, [ᶬv]: the lips close for m and then open into v. Wiktionary lists mv among the prenasalised consonants."
      "n2": "Wiktionary lists it as a class IX noun with no plural."
  "sw-0807":
    native: "tree"
    notes:
      "n1": "The m before t is a syllable of its own, a syllabic m, written [m̩] by Wiktionary, which gives mtoto, child, as its example. So mti has two syllables, m and ti, and the course's IPA puts the stress mark before the m."
      "n2": "Wiktionary's example of a syllabic n is nchi, country: an n that is a syllable by itself before ch."
  "sw-0808":
    native: "star"
    notes:
      "n1": "ny is one sound, [ɲ]: the middle of the tongue presses on the roof of the mouth. It is not an n followed by a y."
      "n2": "Wiktionary has several entries for the spelling nyota; this one is the star in the sky, a class IX noun with the plural nyota."
  "sw-0809":
    native: "sin; crime; offence"
    notes:
      "n1": "dh is one sound, [ð], the th of English this. Wiktionary gives this word as its example. dh, gh, th and kh belong to borrowed words, as the pronunciation page lists them."
      "n2": "Wiktionary lists the word as a class V noun with the plural madhambi."
  "sw-0810":
    native: "cost; expense; charge"
    notes:
      "n1": "gh is one sound, [ɣ]: a g with the tongue not quite closing, a voiced scrape. Wiktionary gives ghali, expensive, as its example, and gharama begins the same way."
      "n2": "Wiktionary lists the word as a class IX noun with the plural gharama."
  "sw-0811":
    native: "value"
    notes:
      "n1": "th is one sound, [θ], the th of English thin, not the ð of dhambi. Wiktionary lists it with dh, gh and kh."
      "n2": "Wiktionary lists the word as a class IX noun with the plural thamani."
  "sw-0812":
    native: "certificate; short note"
    notes:
      "n1": "ch is one sound, [tʃ], as in English church. The course writes it tʃ in the IPA."
      "n2": "Wiktionary lists the word as a class VII noun with the plural vyeti: the ch of the singular turns into vy."
  "sw-0813":
    native: "thanks; gratitude"
    notes:
      "n1": "sh is one sound, [ʃ], as in English ship."
      "n2": "Wiktionary also lists shukrani as a formal way to say thank you."
  "sw-0814":
    native: "throat"
    notes:
      "n1": "The oo is two vowels said as one long one. Wiktionary marks length with [ː] and gives kondoo, sheep, as its example; koo has the same two vowels."
      "n2": "Wiktionary lists the word as a class V noun with the plural makoo."
  "sw-0815":
    native: "letter"
    notes:
      "n1": "Stress usually falls on the second-last syllable, the one before the last: ba-RU-a. Swahili does not write the stress, and the course's IPA marks it with ˈ."
      "n2": "Swahili has five vowels, written a, e, i, o, u. Wiktionary gives them as [ɑ ɛ i ɔ u]; the course's IPA writes a, e, i, o, u."
