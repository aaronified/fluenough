core: "sw-family"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Family"
description: "Twenty-seven words for family: parents, brothers and sisters, grandparents, aunts and uncles, children, in-laws and the people you marry. Not yet checked by a Swahili speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sw-1440":
    native: "father (male parent)"
    notes:
      "n1": "Baba is father, class I/IX, and its plural baba is in class II/X. Baba yangu is my father, with yangu for class IX."
    examples:
      "Baba yangu ni mwalimu.":
        native: "My father is a teacher."
        bases:
          "Baba": "father"
          "yangu": "my (class IX)"
          "ni": "is"
          "mwalimu": "teacher"
      "Baba yako ni nani?":
        native: "Who is your father?"
        bases:
          "Baba": "father"
          "yako": "your (class IX)"
          "ni": "is"
          "nani": "who"
  "sw-1441":
    native: "mother (female parent)"
    notes:
      "n1": "Mama is mother, class I/IX, and its plural mama is in class II/X. It is also the respectful word for an older woman, so Habari, mama? greets one."
    examples:
      "Mama yako ni nani?":
        native: "Who is your mother?"
        bases:
          "Mama": "mother"
          "yako": "your (class IX)"
          "ni": "is"
          "nani": "who"
      "Habari, mama?":
        native: "Hello, madam."
        bases:
          "Habari": "news; greeting"
          "mama": "madam"
