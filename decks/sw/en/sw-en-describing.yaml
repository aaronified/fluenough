core: "sw-describing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing"
description: "Words for describing people and things: size, shape, quality, colour, age, taste, temperature and feelings. Each adjective shows its class agreement in its examples. Not yet checked by a Swahili speaker: please report any mistake."
