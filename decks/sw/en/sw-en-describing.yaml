cards:
  "sw-1860":
    native: "good; kind"
    notes:
      "n1": "Stem -zuri. It takes the class prefix of its noun: mzuri with mtu (class 1), nzuri with nyumba (class 9)."
    examples:
      "Mtu ni mzuri.":
        native: "A person is good."
        bases:
          "Mtu": "person"
          "ni": "is; am"
          "mzuri": "good"
      "Nyumba ni nzuri.":
        native: "The house is good."
        bases:
          "Nyumba": "house"
          "ni": "is; am"
          "nzuri": "good"
  "sw-1861":
