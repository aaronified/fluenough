core: "sw-more-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs"
description: "Everyday verbs, each with the stem it is built on. Derived verbs say which verb they come from. Not yet checked by a Swahili speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "sw-2070":
    native: "to have"
    notes:
      "n1": "Stem wa na. Nina is I have (first person, present); una is you have."
    examples:
      "Mimi nina chai.":
        native: "I have tea."
        bases:
          "Mimi": "I"
          "nina": "to have (I have)"
          "chai": "tea"
      "Wewe una kitabu.":
        native: "You have a book."
        bases:
          "Wewe": "you"
          "una": "to have (you have)"
          "kitabu": "book"
