      "kufungua": { meaning: "to close, fasten, lock up" }
    notes:
      "n1": "Conversive form of -funga, so its stem is -fungua; it means the opposite of kufunga. Also means to give birth."
    examples:
      "Ninataka kufungua duka.":
        native: "I want to open the shop."
        bases:
          "Ninataka": "I want"
          "kufungua": "to open"
          "duka": "shop"
      "Ninapenda kufungua nyumba.":
        native: "I like to open the house."
        bases:
          "Ninapenda": "I like"
          "kufungua": "to open"
          "nyumba": "house"
