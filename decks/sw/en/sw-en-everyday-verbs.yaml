schema: 1
id: "sw-en-everyday-verbs"
kind: "layer"
core: "sw-everyday-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Everyday verbs"
description: "Thirty-six everyday verbs in the infinitive: eat, drink, go, come, see, say, read, write, do, get, sit, sleep, wake, love, want, know, cook, buy, sell, pay, give, take, bring, put, open, close, stand, run, walk, laugh, play, sing, hear, watch, enter and be. Not yet checked by a Swahili speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "sw-1650":
    native: "to eat"
    notes:
      "n1": "Stem -la (infinitive kula). Also means to consume, to eradicate."
    examples:
      "Ninataka kula.":
        native: "I want to eat."
        bases:
          "Ninataka": "I want"
          "kula": "to eat"
      "Ninapenda kula ndizi.":
        native: "I like to eat bananas."
        bases:
          "Ninapenda": "I like"
          "kula": "to eat"
          "ndizi": "banana"
  "sw-1651":
    native: "to drink"
    notes:
      "n1": "Stem -nywa (infinitive kunywa)."
    examples:
      "Ninataka kunywa maji.":
        native: "I want to drink water."
        bases:
          "Ninataka": "I want"
          "kunywa": "to drink"
          "maji": "water"
      "Ninapenda kunywa chai.":
        native: "I like to drink tea."
        bases:
          "Ninapenda": "I like"
