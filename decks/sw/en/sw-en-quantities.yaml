tags: ["unreviewed"]

cards:
  "sw-1790":
    native: "each, every"
    notes:
      "n1": "Determiner, placed before the noun it counts."
    examples:
      "Kila siku ninataka chai.":
        native: "Every day I want tea."
        bases:
          "Kila": "each"
          "siku": "day"
          "ninataka": "I want"
          "chai": "tea"
      "Ninapenda kula kila siku.":
        native: "I like to eat every day."
        bases:
          "Ninapenda": "I like"
          "kula": "to eat"
          "kila": "each"
          "siku": "day"
  "sw-1791":
    native: "a little, a bit, slightly, little"
    notes:
      "n1": "Also an adjective: small (kidogo agrees with class VII, as in kiasi kidogo)."
    examples:
      "Ninataka maji kidogo.":
        native: "I want a little water."
        bases:
          "Ninataka": "I want"
          "maji": "water"
