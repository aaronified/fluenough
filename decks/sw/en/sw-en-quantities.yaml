schema: 1
id: "sw-en-quantities"
kind: "layer"
core: "sw-quantities"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Quantities"
description: "Words for amounts and quantities: a little, half, a quarter, many, few, all, other, one, and the owner. Not yet checked by a Swahili speaker: please report any mistake."
