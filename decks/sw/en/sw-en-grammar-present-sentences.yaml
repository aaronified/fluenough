schema: 1
id: "sw-en-grammar-present-sentences"
kind: "layer"
core: "sw-grammar-present-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The present in sentences"
description: "Nine short sentences with the present tense and the verb to be. Five are Wiktionary examples and four are written from the table. Not yet checked by a Swahili speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "sw-0700":
    native: "They are eating."
    notes:
      "n1": "wa- (they) + -na- (now) + -kula (eat). Wiktionary's -na- entry gives this sentence."
    bases:
      "Wanakula": "they are eating"
  "sw-0701":
    native: "You see us."
    notes:
      "n1": "u- (you) + -na- (now) + -tu- (us) + -ona (see). Wiktionary's -tu- entry gives this sentence."
    bases:
      "Unatuona": "you see us"
  "sw-0702":
    native: "It is getting cold."
    notes:
      "n1": "i- (it) + -na- + -kuwa (to be, to become). Here -na- says that something is starting to happen. Wiktionary's -na- entry gives this sentence."
    bases:
      "Inakuwa": "it is getting; it becomes"
      "baridi": "cold"
  "sw-0703":
    native: "We are at the school."
    notes:
      "n1": "tupo is tu- (we) + -po (at the place): we are there. shuleni is shule, school, with -ni, at. Wiktionary's -wapo entry gives this sentence."
    bases:
      "Tupo": "we are (there)"
      "shuleni": "at the school"
  "sw-0704":
    native: "The people are inside the room."
    notes:
      "n1": "wamo is wa- (they) + -mo (inside): they are in. chumbani is chumba, room, with -ni, in. Wiktionary's wamo entry gives this sentence."
    bases:
      "Watu": "people"
      "wamo": "they are inside"
      "chumbani": "in the room"
  "sw-0705":
    native: "You are a teacher."
    notes:
      "n1": "Written from the verb table: ni is are, the same for every person. Not a Wiktionary example."
    bases:
      "Wewe": "you"
      "ni": "are; is"
      "mwalimu": "teacher"
  "sw-0706":
    native: "I am not a teacher."
    notes:
      "n1": "Written from the verb table: si is am not, the same for every person. Not a Wiktionary example."
    bases:
      "Mimi": "I"
      "si": "am not; is not"
      "mwalimu": "teacher"
  "sw-0707":
    native: "We are eating."
    notes:
      "n1": "Written from the verb table: tu- (we) + -na- + -kula (eat). Not a Wiktionary example."
    bases:
      "Sisi": "we"
      "tunakula": "we are eating"
  "sw-0708":
    native: "The child is sleeping."
    notes:
      "n1": "Written from the verb table: a- (he or she) + -na- + -lala (sleep). The subject mtoto is class I, so the verb takes a-. Not a Wiktionary example."
    bases:
      "Mtoto": "child"
      "analala": "he or she is sleeping"
