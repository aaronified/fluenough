schema: 1
id: "sw-en-grammar-agreement"
kind: "layer"
core: "sw-grammar-agreement"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Agreement: the class on the describing word"
description: "Eighteen describing words, possessives, demonstratives and number words, each in the form it takes for the eleven noun classes I to XI. Taken from the word entries on Wiktionary. Not yet checked by a Swahili speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
pattern:
  name: "Class agreement of describing words"
  slot_name: "class"
  prompt: "{lemma} ({gloss}), {slot}"
  slots:
    "c1": "class I (m-wa, one)"
    "c2": "class II (m-wa, many)"
    "c3": "class III (m-mi, one)"
    "c4": "class IV (m-mi, many)"
    "c5": "class V (ji-ma, one)"
    "c6": "class VI (ma, many)"
    "c7": "class VII (ki-vi, one)"
    "c8": "class VIII (ki-vi, many)"
    "c9": "class IX (n, one)"
    "c10": "class X (n, many)"
    "c11": "class XI (u)"
  entries:
    "zuri": "good; nice"
    "refu": "tall; long"
    "pya": "new"
    "dogo": "small"
    "ingine": "other; another"
    "angu": "my"
    "ako": "your (one person)"
    "ake": "his; her; its"
    "etu": "our"
    "hii": "this"
    "hiyo": "that (just mentioned)"
    "le": "that over there"
    "ote": "all; every"
    "a": "of"
    "moja": "one"
    "wili": "two"
    "tatu": "three"
    "nne": "four"
  notes: "A describing word takes the class of the noun it goes with, and it takes it on its front: mtoto mzuri, watoto wazuri, kitu kizuri, vitu vizuri. Each row is one word and each column one class; a stem is shown with a hyphen, as -zuri. The prefix can fuse with the stem: -refu becomes ndefu in the n classes, and a stem that begins with a vowel takes mw-, as in mwingine. The same classes decide the possessives (-angu, my: kitabu changu, nyumba yangu), the demonstratives (hii, this: huyu, hiki, hizi), all (-ote), the linking of (-a: kitabu cha mtoto) and the numbers (-wili, two: watoto wawili). Classes I, III and XI often share a form, and classes IX and X share a form with each other for describing words; a blank means the word has no form in that class (two, for example, has no singular class). Classes XVI, XVII and XVIII (the places) take pa-, ku- and m-: nyumbani kwangu. Source: Wiktionary's entries for each word, which list the forms by class."
