schema: 1
id: "sw-en-grammar-noun-classes-1-sentences"
kind: "layer"
core: "sw-grammar-noun-classes-1-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Noun classes in phrases"
description: "Thirteen short phrases, one for each noun class, showing the noun and the adjective that agrees with it. Taken from Wiktionary's prefix entries. Not yet checked by a Swahili speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "sw-0400":
    native: "a nice child"
    notes:
      "n1": "mtoto is class I (m-wa): the adjective takes the same prefix, m-, and so does the noun. Wiktionary's m- entry gives this phrase."
    bases:
      "mtoto": "child"
      "mzuri": "good; nice"
  "sw-0401":
    native: "nice children"
    notes:
      "n1": "The plural of mtoto is watoto, class II. The prefix wa- is on the noun and again on the adjective. Wiktionary's wa- entry gives this phrase."
    bases:
      "watoto": "children"
      "wazuri": "good; nice (with watoto)"
  "sw-0402":
    native: "a tall tree"
    notes:
      "n1": "mti is class III (m-mi), the pair for trees and plants. The adjective repeats m-. Wiktionary's m- entry gives this phrase."
    bases:
      "mti": "tree"
      "mrefu": "tall; long"
  "sw-0403":
    native: "tall trees"
    notes:
      "n1": "The plural of mti is miti, class IV: the prefix mi- is on the noun and on the adjective. Wiktionary's mi- entry gives this phrase."
    bases:
      "miti": "trees"
      "mirefu": "tall; long (with miti)"
  "sw-0404":
    native: "a new tooth"
    notes:
      "n1": "jino is class V (ji-ma). The adjective takes ji- as well: jipya, from -pya. Wiktionary's ji- entry gives this phrase."
    bases:
      "jino": "tooth"
      "jipya": "new"
  "sw-0405":
    native: "dirty water"
    notes:
      "n1": "maji is a ma word, class VI, and has no singular (water is counted by the amount). The adjective takes ma-: machafu, from -chafu. Wiktionary's ma- entry gives this phrase."
    bases:
      "maji": "water"
      "machafu": "dirty"
  "sw-0406":
    native: "a nice thing"
    notes:
      "n1": "kitu is class VII (ki-vi): both words begin with ki-. Wiktionary's ki- entry gives this phrase."
    bases:
      "kitu": "thing"
      "kizuri": "good; nice (with kitu)"
  "sw-0407":
    native: "nice things"
    notes:
      "n1": "The plural of kitu is vitu, class VIII: vi- on both words. Wiktionary's vi- entry gives this phrase."
    bases:
      "vitu": "things"
      "vizuri": "good; nice (with vitu)"
  "sw-0408":
    native: "nice clothes; a nice piece of cloth"
    notes:
      "n1": "nguo is an n class word, class IX. The adjective takes an n- of its own: nzuri, from -zuri. The same form is used for the plural, clothes. Wiktionary's n- entry gives this phrase."
    bases:
      "nguo": "clothes; a piece of cloth"
      "nzuri": "good; nice (with nguo)"
  "sw-0409":
    native: "a long tongue"
    notes:
      "n1": "ulimi is class XI (u-). The adjective takes m-, not u-: mrefu. Wiktionary's u- entry gives this phrase."
    bases:
      "ulimi": "tongue"
      "mrefu": "tall; long"
  "sw-0410":
    native: "Traveling is great."
    notes:
      "n1": "kusafiri is a verb used as a noun: the ku- of the infinitive makes a noun of class XV. The adjective takes ku- as well: kuzuri. Wiktionary's ku- entry gives this sentence. The verb kusafiri comes later on the path."
    bases:
      "Kusafiri": "traveling; to travel"
      "ni": "is; are"
      "kuzuri": "good; nice (with mahali)"
      "sana": "very"
  "sw-0411":
    native: "another place"
    notes:
      "n1": "mahali, place, is a locative word of class XVI, and the adjective takes pa-: pengine, from -ingine. Wiktionary's p- entry gives this phrase."
    bases:
      "mahali": "place"
      "pengine": "other; another"
  "sw-0412":
    native: "in a small house"
    notes:
      "n1": "nyumbani, with the ending -ni, means in the house, and it agrees as a mu word, class XVIII: the adjective takes m-, mdogo. Wiktionary's m- entry gives this phrase."
    bases:
      "nyumbani": "at home; in the house"
      "mdogo": "small (with a place inside)"
