  "sw-1528":
    native: "twenty"
    notes:
      "n1": "Ishirini is twenty, invariable. After it come the units with na, as in ishirini na moja, twenty-one, which is not in this unit."
    examples:
      "Ishirini ni nambari.":
        native: "Twenty is a number."
        bases:
          "Ishirini": "twenty"
          "ni": "is"
          "nambari": "number"
      "Watu ishirini ni walimu.":
