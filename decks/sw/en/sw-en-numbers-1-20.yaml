  "sw-1517":
    native: "nine"
    notes:
      "n1": "Tisa is nine. It is invariable, so it does not change for the noun's class."
    examples:
      "Ni saa tisa.":
        native: "It is nine o'clock."
        bases:
          "Ni": "it is"
          "saa": "o'clock"
          "tisa": "nine"
      "Watoto tisa ni wadogo.":
        native: "Nine children are small."
