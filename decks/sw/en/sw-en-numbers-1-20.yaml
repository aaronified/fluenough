schema: 1
id: "sw-en-numbers-1-20"
kind: "layer"
core: "sw-numbers-1-20"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Numbers one to twenty"
description: "Twenty-two words for counting: zero, the numbers from three to ten, the teens, twenty, and the words for number, first and second. Not yet checked by a Swahili speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sw-1510":
    native: "zero"
    notes:
      "n1": "Sifuri is zero. It does not change for class, so it is invariable."
    examples:
      "Sifuri ni nambari.":
        native: "Zero is a number."
        bases:
          "Sifuri": "zero"
          "ni": "is"
          "nambari": "number"
      "Sifuri, moja, mbili.":
        native: "Zero, one, two."
        bases:
          "Sifuri": "zero"
          "moja": "one"
          "mbili": "two"
  "sw-1511":
    native: "three"
    notes:
      "n1": "Tatu is three. It takes the class of its noun: watu watatu, three people (class II), and vitabu vitatu, three books (class VIII)."
    examples:
      "Watoto watatu ni wadogo.":
        native: "Three children are small."
        bases:
          "Watoto": "children"
          "watatu": "three (class II)"
          "ni": "are"
          "wadogo": "small (class II)"
      "Vitabu vitatu ni vizuri.":
        native: "Three books are good."
        bases:
          "Vitabu": "books"
          "vitatu": "three (class VIII)"
          "ni": "are"
          "vizuri": "good (class VIII)"
  "sw-1512":
    native: "four"
    notes:
      "n1": "Nne is four. It takes the class of its noun: watu wanne, four people (class II), and miti minne, four trees (class IV)."
    examples:
      "Watu wanne ni walimu.":
        native: "Four people are teachers."
        bases:
          "Watu": "people"
          "wanne": "four (class II)"
          "ni": "are"
          "walimu": "teachers"
      "Miti minne ni mirefu.":
        native: "Four trees are tall."
        bases:
          "Miti": "trees"
          "minne": "four (class IV)"
          "ni": "are"
          "mirefu": "tall (class IV)"
  "sw-1513":
    native: "five"
    notes:
      "n1": "Tano is five. It takes the class of its noun: watu watano, five people (class II), and vitabu vitano, five books (class VIII)."
    examples:
      "Watu watano ni walimu.":
        native: "Five people are teachers."
        bases:
          "Watu": "people"
          "watano": "five (class II)"
          "ni": "are"
          "walimu": "teachers"
      "Nina vitabu vitano.":
        native: "I have five books."
        bases:
          "Nina": "I have"
          "vitabu": "books"
          "vitano": "five (class VIII)"
  "sw-1514":
    native: "six"
    notes:
      "n1": "Sita is six. It is invariable, so it does not change for the noun's class."
    examples:
      "Watu sita ni walimu.":
        native: "Six people are teachers."
        bases:
          "Watu": "people"
          "sita": "six"
          "ni": "are"
          "walimu": "teachers"
      "Nina watoto sita.":
        native: "I have six children."
        bases:
          "Nina": "I have"
          "watoto": "children"
          "sita": "six"
  "sw-1515":
    native: "seven"
    notes:
      "n1": "Saba is seven. It is invariable, like sita."
    examples:
      "Wiki ina siku saba.":
        native: "A week has seven days."
        bases:
          "Wiki": "week"
          "ina": "has"
          "siku": "days"
          "saba": "seven"
      "Watoto saba ni wadogo.":
        native: "Seven children are small."
        bases:
          "Watoto": "children"
          "saba": "seven"
          "ni": "are"
          "wadogo": "small (class II)"
  "sw-1516":
    native: "eight"
    notes:
      "n1": "Nane is eight. It takes the class of its noun: watu wanane, eight people (class II), and vitabu vinane, eight books (class VIII)."
    examples:
      "Watu wanane ni walimu.":
        native: "Eight people are teachers."
        bases:
          "Watu": "people"
          "wanane": "eight (class II)"
          "ni": "are"
          "walimu": "teachers"
      "Vitabu vinane ni vyangu.":
        native: "Eight books are mine."
        bases:
          "Vitabu": "books"
          "vinane": "eight (class VIII)"
          "ni": "are"
          "vyangu": "my (class VIII)"
  "sw-1517":
    native: "nine"
    notes:
      "n1": "Tisa is nine. It is invariable, so it does not change for the noun's class. Swahili time counts from 6 in the morning, so saa moja is seven o'clock."
    examples:
      "Ni saa tisa.":
        native: "It is three o'clock."
        bases:
          "Ni": "it is"
          "saa": "o'clock"
          "tisa": "nine"
      "Watoto tisa ni wadogo.":
        native: "Nine children are small."
        bases:
          "Watoto": "children"
          "tisa": "nine"
          "ni": "are"
          "wadogo": "small (class II)"
  "sw-1518":
    native: "ten"
    notes:
      "n1": "Kumi is ten, invariable. It is the base of the teens: kumi na moja is eleven, kumi na mbili is twelve, and so on. Swahili time counts from 6 in the morning, so saa moja is seven o'clock."
    examples:
      "Ni saa kumi.":
        native: "It is four o'clock."
        bases:
          "Ni": "it is"
          "saa": "o'clock"
          "kumi": "ten"
      "Watu kumi ni walimu.":
        native: "Ten people are teachers."
        bases:
          "Watu": "people"
          "kumi": "ten"
          "ni": "are"
          "walimu": "teachers"
  "sw-1519":
    native: "eleven"
    notes:
      "n1": "Kumi na moja is eleven: kumi, ten, then na, and, then moja, one. The teens are made the same way, with the units after na. Swahili time counts from 6 in the morning, so saa moja is seven o'clock."
    examples:
      "Ni saa kumi na moja.":
        native: "It is five o'clock."
        bases:
          "Ni": "it is"
          "saa": "o'clock"
          "kumi": "ten"
          "na": "and"
          "moja": "one"
      "Kumi na moja ni nambari.":
        native: "Eleven is a number."
        bases:
          "Kumi": "ten"
          "na": "and"
          "moja": "one"
          "ni": "is"
          "nambari": "number"
  "sw-1520":
    native: "twelve"
    notes:
      "n1": "Kumi na mbili is twelve: ten and two. Units 2 to 5 and 8 agree with the noun class, as in watu kumi na wawili, twelve people (class II). Swahili time counts from 6 in the morning, so saa moja is seven o'clock."
    examples:
      "Ni saa kumi na mbili.":
        native: "It is six o'clock."
        bases:
          "Ni": "it is"
          "saa": "o'clock"
          "kumi": "ten"
          "na": "and"
          "mbili": "two"
      "Watu kumi na wawili ni walimu.":
        native: "Twelve people are teachers."
        bases:
          "Watu": "people"
          "kumi": "ten"
          "na": "and"
          "wawili": "two (class II)"
          "ni": "are"
          "walimu": "teachers"
  "sw-1521":
    native: "thirteen"
    notes:
      "n1": "Kumi na tatu is thirteen: ten and three. Units 2 to 5 and 8 agree with the noun class, as in watu kumi na watatu, thirteen people (class II), and nina miaka kumi na mitatu, I am thirteen years old (class IV)."
    examples:
      "Nina miaka kumi na mitatu.":
        native: "I am thirteen years old."
        bases:
          "Nina": "I have"
          "miaka": "years"
          "kumi": "ten"
          "na": "and"
          "mitatu": "three (class IV)"
      "Kumi na tatu ni nambari.":
        native: "Thirteen is a number."
        bases:
          "Kumi": "ten"
          "na": "and"
          "tatu": "three"
          "ni": "is"
          "nambari": "number"
