          "wadogo": "small (class II)"
  "sw-1518":
    native: "ten"
    notes:
      "n1": "Kumi is ten, invariable. It is the base of the teens: kumi na moja is eleven, kumi na mbili is twelve, and so on."
    examples:
      "Ni saa kumi.":
        native: "It is ten o'clock."
        bases:
          "Ni": "it is"
          "saa": "o'clock"
          "kumi": "ten"
      "Watu kumi ni walimu.":
        native: "Ten people are teachers."
        bases:
          "Watu": "people"
          "kumi": "ten"
          "ni": "are"
          "walimu": "teachers"
  "sw-1519":
    native: "eleven"
    notes:
      "n1": "Kumi na moja is eleven: kumi, ten, then na, and, then moja, one. The teens are made the same way, with the units after na."
    examples:
      "Ni saa kumi na moja.":
        native: "It is eleven o'clock."
        bases:
          "Ni": "it is"
          "saa": "o'clock"
          "kumi": "ten"
          "na": "and"
          "moja": "one"
      "Kumi na moja ni nambari.":
        native: "Eleven is a number."
        bases:
          "Kumi": "ten"
          "na": "and"
          "moja": "one"
          "ni": "is"
          "nambari": "number"
  "sw-1520":
    native: "twelve"
    notes:
