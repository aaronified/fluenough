  "sw-1529":
    native: "number"
    notes:
      "n1": "Nambari is number, class IX, with the plural nambari in class X. It is the word for a number in a phone or a house."
    examples:
      "Nambari hii ni kubwa.":
        native: "This number is big."
        bases:
          "Nambari": "number"
          "hii": "this (class IX)"
          "ni": "is"
          "kubwa": "big"
      "Nambari ni tatu.":
        native: "The number is three."
        bases:
          "Nambari": "number"
          "ni": "is"
          "tatu": "three"
  "sw-1530":
    native: "first"
    notes:
      "n1": "Kwanza is first, invariable in the phrase -a kwanza. Siku ya kwanza is the first day, with ya for class IX. Mtoto wa kwanza is the first child, with wa for class I."
    examples:
      "Siku ya kwanza ni leo.":
        native: "The first day is today."
        bases:
          "Siku": "day"
          "ya": "of (class IX)"
          "kwanza": "first"
          "ni": "is"
          "leo": "today"
      "Ni mtoto wa kwanza.":
        native: "I am the first child."
        bases:
          "Ni": "am"
          "mtoto": "child"
          "wa": "of (class I)"
          "kwanza": "first"
  "sw-1531":
    native: "second (number two)"
    notes:
      "n1": "Pili is second, invariable in the phrase -a pili. Mtoto wa pili is the second child, and siku ya pili is the second day."
    examples:
      "Siku ya pili ni kesho.":
        native: "The second day is tomorrow."
        bases:
          "Siku": "day"
          "ya": "of (class IX)"
          "pili": "second"
          "ni": "is"
          "kesho": "tomorrow"
      "Mtoto wa pili ni mzuri.":
        native: "The second child is good."
        bases:
          "Mtoto": "child"
          "wa": "of (class I)"
          "pili": "second"
          "ni": "is"
          "mzuri": "good (class I)"
  "sw-1532":
    native: "Numbers one to ten"
    explanation: "The first ten numbers: moja (one), mbili (two), tatu (three), nne (four), tano (five), sita (six), saba (seven), nane (eight), tisa (nine) and kumi (ten). The numbers from three to eight take the class of their noun, as watu watatu or vitabu vitatu; moja and mbili are taught in the first words."
