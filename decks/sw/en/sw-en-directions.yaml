schema: 1
id: "sw-en-directions"
kind: "layer"
core: "sw-directions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Directions"
description: "Directions: left and right, in front and behind, the four compass points, and the words for path, road, corner, map and street. Not yet checked by a Swahili speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sw-2490":
    native: "left"
    notes:
      "n1": "An adverb of direction. It has no noun class."
    examples:
      "Ninaenda kushoto.":
        native: "I go left."
        bases:
          "Ninaenda": "to go (I go)"
          "kushoto": "left"
      "Nenda kushoto.":
        native: "Go left."
        bases:
          "Nenda": "to go (go!)"
          "kushoto": "left"
  "sw-2491":
    native: "right"
    notes:
      "n1": "An adverb meaning right. It is not the verb kulia, to cry."
    examples:
      "Ninaenda kulia.":
        native: "I go right."
        bases:
          "Ninaenda": "to go (I go)"
          "kulia": "right"
      "Nenda kulia.":
        native: "Go right."
        bases:
          "Nenda": "to go (go!)"
          "kulia": "right"
