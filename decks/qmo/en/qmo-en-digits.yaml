tags: ["beginner", "unreviewed", "script"]
cards:
  "qmo-0027":
    native: "1"
    notes:
      "n1": "Sounds like di-dah-dah-dah-dah. A dot and four dashes: the digits count up by trading a dot for a dash."
  "qmo-0028":
    native: "2"
    notes:
      "n1": "Sounds like di-di-dah-dah-dah. Two dots and three dashes."
  "qmo-0029":
    native: "3"
    notes:
      "n1": "Sounds like di-di-di-dah-dah. Three dots and two dashes."
  "qmo-0030":
    native: "4"
    notes:
      "n1": "Sounds like di-di-di-di-dah. Four dots and a dash."
  "qmo-0031":
    native: "5"
    notes:
      "n1": "Sounds like di-di-di-di-dit. Five dots."
  "qmo-0032":
    native: "6"
    notes:
      "n1": "Sounds like dah-di-di-di-dit. A dash and four dots: from 6 on, dashes come first."
  "qmo-0033":
    native: "7"
    notes:
      "n1": "Sounds like dah-dah-di-di-dit. Two dashes and three dots."
  "qmo-0034":
    native: "8"
    notes:
      "n1": "Sounds like dah-dah-dah-di-dit. Three dashes and two dots."
  "qmo-0035":
    native: "9"
    notes:
      "n1": "Sounds like dah-dah-dah-dah-dit. Four dashes and a dot."
  "qmo-0036":
    native: "0"
    notes:
      "n1": "Sounds like dah-dah-dah-dah-dah. Five dashes."
