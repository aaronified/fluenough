schema: 1
id: "qmo-en-punctuation"
kind: "layer"
core: "qmo-punctuation"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Morse: punctuation"
description: "The punctuation of Recommendation ITU-R M.1677-1: full stop, comma, colon, question mark, apostrophe, hyphen, slash, brackets, quotation marks, equals sign and at sign."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "qmo-0037":
    native: "full stop (.)"
    notes:
      "n1": "Sounds like di-dah-di-dah-di-dah. ITU: full stop. Dot, dash repeated three times."
  "qmo-0038":
    native: "comma (,)"
    notes:
      "n1": "Sounds like dah-dah-di-di-dah-dah. ITU: comma."
  "qmo-0039":
    native: "colon (:)"
    notes:
      "n1": "Sounds like dah-dah-dah-di-di-dit. ITU: colon or division sign."
  "qmo-0040":
    native: "question mark (?)"
    notes:
      "n1": "Sounds like di-di-dah-dah-di-dit. ITU: question mark, a request for repetition."
  "qmo-0041":
    native: "apostrophe (')"
    notes:
      "n1": "Sounds like di-dah-dah-dah-dah-dit. ITU: apostrophe."
  "qmo-0042":
    native: "hyphen (-)"
    notes:
      "n1": "Sounds like dah-di-di-di-di-dah. ITU: hyphen or minus sign."
  "qmo-0043":
    native: "slash (/)"
    notes:
      "n1": "Sounds like dah-di-di-dah-dit. ITU: fraction bar or division sign."
  "qmo-0044":
    native: "brackets: ( and )"
    notes:
      "n1": "Sounds like dah-di-dah-dah-di-dah. ITU: left and right bracket are the same sign: it opens and closes."
  "qmo-0045":
    native: "quotation marks (\")"
    notes:
      "n1": "Sounds like di-dah-di-di-dah-dit. ITU: quotation marks, the same sign before and after the quoted words."
  "qmo-0046":
    native: "equals sign (=)"
    notes:
      "n1": "Sounds like dah-di-di-di-dah. ITU: double hyphen. Also the break sign, which pauses a message."
  "qmo-0047":
    native: "at sign (@)"
    notes:
      "n1": "Sounds like di-dah-dah-di-dah-dit. ITU: commercial at, added to the code in 2004 for e-mail addresses."
