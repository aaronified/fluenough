cards:
  "qmo-0001":
    native: "e"
    notes:
      "n1": "Sounds like dit. The shortest sign: a single dot, the most common letter in English."
  "qmo-0002":
    native: "t"
    notes:
      "n1": "Sounds like dah. A single dash, the next most common letter."
  "qmo-0003":
    native: "i"
    notes:
      "n1": "Sounds like di-dit. Two dots."
  "qmo-0004":
    native: "a"
    notes:
      "n1": "Sounds like di-dah. A dot and a dash."
  "qmo-0005":
    native: "n"
    notes:
      "n1": "Sounds like dah-dit. The reverse of a: a dash and a dot."
  "qmo-0006":
    native: "m"
    notes:
      "n1": "Sounds like dah-dah. Two dashes."
