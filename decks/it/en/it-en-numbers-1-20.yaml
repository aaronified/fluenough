    notes:
      "n1": "Zero is zero, and it is invariable. It is also a masculine noun, zero, with the plural zeri."
    examples:
      "Ho zero euro.":
        native: "I have zero euros."
        bases:
          "Ho": "have"
          "zero": "zero"
      "Costa zero euro.":
        native: "It costs zero euros."
        bases:
          "Costa": "costs"
          "zero": "zero"
