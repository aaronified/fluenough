schema: 1
id: "it-en-quantities"
kind: "layer"
core: "it-quantities"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Quantities"
license: "CC-BY-SA-4.0"
description: "How much and how many: a lot, little, too much, enough, all, half, more and less, and the words for measures and containers (a kilo, a litre, a slice, a bottle, a cup). Not yet checked by an Italian speaker: please report any mistake."
cards:
  "it-1790":
    native: "much; very much; a lot"
    notes:
      "n1": "Means much, very much, a lot (with verbs). Superlative moltissimo."
    examples:
      "Parlo molto.":
        native: "I speak a lot."
        bases:
          "molto": "a lot"
      "Sto molto bene.":
        native: "I am very well."
        bases:
          "molto": "very"
  "it-1791":
    native: "little; not much"
    notes:
      "n1": "Means little, not much."
    examples:
      "Parlo poco.":
        native: "I speak little."
        bases:
          "poco": "little"
      "Capisco poco.":
        native: "I understand little."
        bases:
          "poco": "little"
  "it-1792":
    native: "so much; so many"
    notes:
