  "it-2560":
    native: "train"
    notes:
      "n1": "Masculine. The plural is treni."
    examples:
      "Questo è il treno.":
        native: "This is the train."
        bases:
          "Questo": "this"
          "è": "is"
          "il": "the"
          "treno": "train"
      "Dov'è il treno?":
        native: "Where is the train?"
        bases:
          "Dov'è": "where is"
          "il": "the"
          "treno": "train"
      "Ho un treno.":
        native: "I have a train."
        bases:
          "Ho": "I have"
          "un": "a"
          "treno": "train"
