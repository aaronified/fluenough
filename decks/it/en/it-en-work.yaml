id: "it-en-work"
kind: "layer"
core: "it-work"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Work"
license: "CC-BY-SA-4.0"
description: "Work and the people who do it: the job, the boss, the colleague, the company, the salary, the meeting and the project, and some jobs: the lawyer, the engineer, the cook, the doctor and the shopkeeper. Not yet checked by an Italian speaker: please report any mistake."
cards:
  "it-2140":
    native: "work; job"
    notes:
      "n1": "Masculine. The plural is lavori. Wiktionary gives work in all senses, and also labour and a job or task."
    examples:
      "Questo è il lavoro.":
        native: "This is the work."
        bases:
          "Questo": "this"
          "è": "is"
          "il": "the"
          "lavoro": "work; job"
      "Il lavoro è buono.":
        native: "The job is good."
        bases:
          "Il": "the"
          "lavoro": "work; job"
          "è": "is"
  "it-2141":
    native: "to work"
    notes:
      "n1": "Regular -are verb: the first-person singular present is lavoro (lavóro), with a closed o. Wiktionary also gives to function and to run a business."
    examples:
      "Io lavoro.":
        native: "I work."
        bases:
          "lavoro": "I work"
      "Voglio lavorare.":
        native: "I want to work."
        bases:
          "lavorare": "to work"
  "it-2142":
    native: "clerk; employee"
    notes:
      "n1": "Masculine. The feminine is impiegata and the plural is impiegati. Wiktionary gives clerk and office worker, and also employee and staff."
    examples:
      "Questo è l'impiegato.":
        native: "This is the clerk."
        bases:
          "Questo": "this"
          "è": "is"
          "l'impiegato": "clerk; employee"
      "Questa è l'impiegata.":
