schema: 1
id: "it-en-grammar-be-verbs-sentences"
kind: "layer"
core: "it-grammar-be-verbs-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "To be in sentences"
license: "CC-BY-SA-4.0"
description: "Sixteen short sentences with essere and stare. Three are Wiktionary examples, two are in the first-words unit and the rest are written from the table. Not yet checked by an Italian speaker: please report any mistake."
cards:
  "it-4100":
    native: "We are here."
    notes:
      "n1": "Siamo is essere with noi (we). Wiktionary's entry for essere gives this sentence."
  "it-4101":
    native: "Giovanni is from Naples."
    notes:
      "n1": "È is essere with he, she or it. Essere says where someone is from. Wiktionary's entry for essere gives this sentence."
    bases:
      "Giovanni": "Giovanni"
      "di": "of; from"
      "Napoli": "Naples"
  "it-4102":
    native: "How are you?"
    notes:
      "n1": "Stai is stare with tu. Stare asks about a condition. Wiktionary's entry for stare gives come stai (tu)?"
  "it-4103":
    native: "I am a student."
    notes:
      "n1": "Sono is essere with io. The sentence is the one in the course's first-words unit."
    bases:
      "studente": "student"
  "it-4104":
    native: "Are you Italian?"
    notes:
      "n1": "Sei is essere with tu. The sentence is the one in the course's first-words unit."
  "it-4105":
    native: "She is at home."
    notes:
      "n1": "È is essere with she. Essere also says where someone is. Wiktionary's essere entry has a similar sentence with a casa."
  "it-4106":
    native: "We are at school."
    notes:
      "n1": "Siamo is essere with noi."
  "it-4107":
    native: "Are you here?"
    notes:
      "n1": "Siete is essere with voi, you more than one."
  "it-4108":
    native: "They are here."
    notes:
      "n1": "Sono is also the form for loro, they."
  "it-4109":
    native: "This is a train."
    notes:
      "n1": "Essere says what something is."
    bases:
      "un": "a; one"
  "it-4110":
    native: "I am well."
    notes:
      "n1": "Sto is stare with io. Stare is the verb for a condition."
  "it-4111":
    native: "I am unwell."
    notes:
      "n1": "Sto is stare with io. Male is the opposite of bene."
  "it-4112":
    native: "We are well."
    notes:
      "n1": "Stiamo is stare with noi."
  "it-4113":
    native: "Are you well?"
    notes:
      "n1": "State is stare with voi."
  "it-4114":
    native: "They are well."
    notes:
      "n1": "Stanno is stare with loro."
  "it-4115":
    native: "He stays at home."
    notes:
      "n1": "Sta is stare with lui. Stare also means to stay, as in Wiktionary's Starà a casa."
