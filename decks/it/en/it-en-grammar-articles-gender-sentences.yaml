description: "Twenty-six short sentences with every article, for one and for many. All are written from the table. Not yet checked by an Italian speaker: please report any mistake."
cards:
  "it-4000":
    native: "The train is here."
    notes:
      "n1": "Il goes before most masculine nouns that begin with a consonant."
    bases:
      "Il": "the"
  "it-4001":
    native: "The trains are here."
    notes:
      "n1": "I is the plural of il, and treno becomes treni."
    bases:
      "I": "the"
  "it-4002":
    native: "The receipt is here."
    notes:
      "n1": "Lo goes before s plus a consonant."
    bases:
      "Lo": "the"
  "it-4003":
    native: "The receipts are there."
    notes:
      "n1": "Gli is the plural of lo, and scontrino becomes scontrini."
    bases:
      "Gli": "the"
  "it-4004":
    native: "I have a receipt."
    notes:
      "n1": "Uno goes where lo goes: before s plus a consonant."
    bases:
      "uno": "a"
  "it-4005":
    native: "Where is the shelf?"
    notes:
      "n1": "Dov'è is dove and è run together. Lo goes before s plus a consonant."
    bases:
      "lo": "the"
  "it-4006":
    native: "The friend is here."
    notes:
      "n1": "L' replaces il or lo before a vowel."
  "it-4007":
