    notes:
      "n1": "Feminine. The plural is destre. The page gives it as the feminine of the adjective destro, right-hand."
    examples:
      "Il supermercato è a destra.":
        native: "The supermarket is on the right."
        bases:
          "Il": "the"
          "è": "is"
          "a": "on"
          "destra": "right"
      "Il negozio è a destra.":
        native: "The shop is on the right."
