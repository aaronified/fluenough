schema: 1
id: "it-en-more-verbs"
kind: "layer"
core: "it-more-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs"
license: "CC-BY-SA-4.0"
description: "Thirty-five more everyday verbs: begin and finish, try and return, go in and out, walk and run, play and sing, love and hope, remember and forget, learn and teach, meet and explain. Each card gives the first-person singular present and the infinitive. Not yet checked by an Italian speaker: please report any mistake."
cards:
  "it-2070":
    native: "to begin; to start"
    notes:
      "n1": "Regular -are verb: the first-person singular present is comincio. Wiktionary also gives the past historic cominciai."
    examples:
      "Io comincio.":
        native: "I begin."
        bases:
          "comincio": "I begin"
      "Voglio cominciare.":
        native: "I want to begin."
        bases:
          "cominciare": "to begin; to start"
  "it-2071":
    native: "to finish; to end"
    notes:
      "n1": "A verb in -ire that adds -isc- in the present: the first-person singular is finisco (Wiktionary: finìsco), with the second singular finisci and third singular finisce."
    examples:
      "Io finisco.":
        native: "I finish."
        bases:
          "finisco": "I finish"
      "Voglio finire.":
        native: "I want to finish."
        bases:
          "finire": "to finish; to end"
