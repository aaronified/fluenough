schema: 1
id: "it-en-grammar-present-regular-sentences"
kind: "layer"
core: "it-grammar-present-regular-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The regular present in sentences"
license: "CC-BY-SA-4.0"
description: "Twenty-two short sentences with the regular present, one or two persons for each type of verb. All are written from the table. Not yet checked by an Italian speaker: please report any mistake."
cards:
  "it-4200":
    native: "I speak Italian."
    notes:
      "n1": "Parlo is parlare, an -are verb, with io: the ending -o."
  "it-4201":
    native: "They speak well."
    notes:
      "n1": "Parlano is parlare with loro: the ending -ano, stressed on the stem."
  "it-4202":
    native: "She looks at the train."
    notes:
      "n1": "Guarda is guardare with lei: the ending -a."
    bases:
      "il": "the"
  "it-4203":
    native: "You look for the door."
    notes:
      "n1": "Cerchi is cercare with tu. An h is added before the i so that the c stays hard: cerco, cerchi."
    bases:
      "la": "the"
  "it-4204":
    native: "We eat here."
    notes:
      "n1": "Mangiamo is mangiare with noi: the ending -iamo, and the stem keeps a single i."
  "it-4205":
    native: "Do you pay well?"
    notes:
      "n1": "Pagate is pagare with voi: the ending -ate."
  "it-4206":
    native: "We pay here."
    notes:
      "n1": "Paghiamo is pagare with noi. An h is added before the i so that the g stays hard: pago, paghiamo."
  "it-4207":
    native: "I read a book."
    notes:
      "n1": "Leggo is leggere, an -ere verb, with io: the ending -o."
    bases:
      "un": "a"
  "it-4208":
    native: "You write well."
    notes:
      "n1": "Scrivi is scrivere, an -ere verb, with tu: the ending -i."
  "it-4209":
    native: "He takes the train."
    notes:
      "n1": "Prende is prendere with lui: -ere verbs end -e in the third person singular."
    bases:
      "il": "the"
  "it-4210":
    native: "We see the house."
    notes:
      "n1": "Vediamo is vedere with noi: the ending -iamo."
    bases:
      "la": "the"
  "it-4211":
    native: "You close the door."
    notes:
      "n1": "Chiudete is chiudere with voi: -ere verbs end -ete."
    bases:
      "la": "the"
  "it-4212":
    native: "They have a coffee."
    notes:
      "n1": "Prendono is prendere with loro: the ending -ono, stressed on the stem."
    bases:
      "un": "a"
  "it-4213":
    native: "I sleep well."
    notes:
      "n1": "Dormo is dormire, an -ire verb that has no -isc-, with io."
  "it-4214":
    native: "Do you sleep here?"
    notes:
      "n1": "Dormite is dormire with voi: -ire verbs end -ite."
  "it-4215":
    native: "You open the door."
    notes:
      "n1": "Apri is aprire with tu: the ending -i."
    bases:
      "la": "the"
  "it-4216":
    native: "We hear well."
    notes:
      "n1": "Sentiamo is sentire with noi: the ending -iamo."
  "it-4217":
    native: "I understand."
    notes:
      "n1": "Capisco is capire with io: an -isc- verb adds -isc- before the -o. The phrasebook has non capisco."
  "it-4218":
    native: "They understand well."
    notes:
      "n1": "Capiscono is capire with loro: -isc- is also added here."
  "it-4219":
    native: "We understand."
    notes:
      "n1": "Capiamo is capire with noi: the ending -iamo, and no -isc- here."
  "it-4220":
    native: "You finish early."
    notes:
      "n1": "Finisci is finire with tu: an -isc- verb."
  "it-4221":
    native: "She prefers the train."
    notes:
      "n1": "Preferisce is preferire with lei: an -isc- verb adds -isc- before the -e."
    bases:
      "il": "the"
