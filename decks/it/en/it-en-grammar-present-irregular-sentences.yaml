schema: 1
id: "it-en-grammar-present-irregular-sentences"
kind: "layer"
core: "it-grammar-present-irregular-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The irregular present in sentences"
license: "CC-BY-SA-4.0"
description: "Thirty-three short sentences with the irregular verbs. Five are Wiktionary examples and the rest are written from the table. Not yet checked by an Italian speaker: please report any mistake."
cards:
  "it-4300":
    native: "I have a car."
    notes:
      "n1": "Ho is avere with io. The h is not said. Wiktionary's entry for avere gives this sentence."
    bases:
      "una": "a"
      "macchina": "car"
  "it-4301":
    native: "You have a book."
    notes:
      "n1": "Hai is avere with tu."
    bases:
      "un": "a"
  "it-4302":
    native: "She has a house."
    notes:
      "n1": "Ha is avere with lei."
    bases:
      "una": "a"
  "it-4303":
    native: "We have the train."
    notes:
      "n1": "Abbiamo is avere with noi: no h and a new stem."
    bases:
      "il": "the"
  "it-4304":
    native: "They have a house."
    notes:
      "n1": "Hanno is avere with loro. The h is not said."
    bases:
      "una": "a"
  "it-4305":
    native: "I go home."
    notes:
      "n1": "Vado is andare with io: the stem changes to vad-."
  "it-4306":
    native: "Shall we go home?"
    notes:
      "n1": "Andiamo is andare with noi. Wiktionary's entry for the preposition a gives this sentence."
  "it-4307":
    native: "They go to school."
    notes:
      "n1": "Vanno is andare with loro."
  "it-4308":
    native: "Two and three make five."
    notes:
      "n1": "Fanno is fare with loro, because the two numbers are plural. Wiktionary's entry for fare gives this sentence."
  "it-4309":
    native: "I make the coffee."
    notes:
      "n1": "Faccio is fare with io: the stem changes to facc-."
    bases:
      "il": "the"
  "it-4310":
    native: "You do well."
    notes:
      "n1": "Fate is fare with voi."
  "it-4311":
    native: "I come here."
    notes:
      "n1": "Vengo is venire with io: the stem changes to veng-."
  "it-4312":
    native: "Are you coming home?"
    notes:
      "n1": "Vieni is venire with tu."
  "it-4313":
    native: "They come early."
    notes:
      "n1": "Vengono is venire with loro."
  "it-4314":
    native: "I say yes."
    notes:
      "n1": "Dico is dire with io: the stem changes to dic-."
  "it-4315":
    native: "Do you say no?"
    notes:
      "n1": "Dite is dire with voi."
  "it-4316":
    native: "I give the water."
    notes:
      "n1": "Do is dare with io. The word is short: it has no ending."
  "it-4317":
    native: "She gives the bread."
    notes:
      "n1": "Dà is dare with lei: it is written with an accent."
    bases:
      "il": "the"
  "it-4318":
    native: "Can I open the door?"
    notes:
      "n1": "Posso is potere with io. It is followed by the infinitive aprire."
    bases:
      "la": "the"
  "it-4319":
    native: "She can do it."
    notes:
      "n1": "Può is potere with lei, followed by the infinitive fare. Wiktionary's entry for potere gives this sentence."
    bases:
      "lo": "it"
  "it-4320":
    native: "We can eat here."
    notes:
      "n1": "Possiamo is potere with noi."
  "it-4321":
    native: "I want a coffee."
    notes:
      "n1": "Voglio is volere with io: the stem changes to vogl-."
    bases:
      "un": "a"
  "it-4322":
    native: "Do you want water?"
    notes:
      "n1": "Vuoi is volere with tu."
  "it-4323":
    native: "They want to sleep."
    notes:
      "n1": "Vogliono is volere with loro, followed by the infinitive dormire."
  "it-4324":
    native: "I must sleep."
    notes:
      "n1": "Devo is dovere with io, followed by the infinitive dormire."
  "it-4325":
    native: "You must open the door."
    notes:
      "n1": "Devi is dovere with tu."
    bases:
      "la": "the"
  "it-4326":
    native: "We must pay."
    notes:
      "n1": "Dobbiamo is dovere with noi: the stem changes to dobb-."
  "it-4327":
    native: "I can swim."
    notes:
      "n1": "So is sapere with io. Sapere with an infinitive is to know how to. Wiktionary's entry for sapere gives this sentence."
  "it-4328":
    native: "Can you speak Italian?"
    notes:
      "n1": "Sai is sapere with tu, followed by parlare."
  "it-4329":
    native: "We can read."
    notes:
      "n1": "Sappiamo is sapere with noi: the stem changes to sapp-."
  "it-4330":
    native: "I go out early."
    notes:
      "n1": "Esco is uscire with io: the stem changes to esc-."
  "it-4331":
    native: "We go out now."
    notes:
      "n1": "Usciamo is uscire with noi: the stem goes back to usc-."
  "it-4332":
    native: "They go out later."
    notes:
      "n1": "Escono is uscire with loro."
