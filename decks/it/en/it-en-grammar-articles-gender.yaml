name: "Articles, gender and number"
license: "CC-BY-SA-4.0"
description: "The words for the and a with thirty nouns: il, lo, l', la, i, gli, le, and un, uno, una, un'. Each row shows the word for one thing, for more than one, and for a. Not yet checked by an Italian speaker: please report any mistake."
pattern:
  name: "The article, gender and number"
  slot_name: "form"
  slots:
    "def-sg": "the, one thing (il, lo, l', la)"
    "def-pl": "the, more than one (i, gli, le)"
    "indef-sg": "a or an (un, uno, una, un')"
  entries:
    "treno": "train"
    "prezzo": "price"
    "scontrino": "receipt"
    "scaffale": "shelf"
    "stomaco": "stomach (plural stomaci or stomachi)"
    "zoo": "zoo (does not change in the plural)"
    "psicologo": "psychologist"
    "studente": "student (man or boy)"
    "amico": "friend (man)"
    "albero": "tree"
    "uomo": "man; person (plural uomini)"
    "occhio": "eye"
    "autobus": "bus (does not change in the plural)"
    "euro": "euro (does not change in the plural)"
    "borsa": "bag"
    "tazza": "cup"
    "bocca": "mouth"
    "bicicletta": "bicycle"
    "studentessa": "student (woman or girl)"
    "amica": "friend (woman)"
    "idea": "idea"
    "unghia": "nail"
    "mano": "hand (feminine, though it ends in -o)"
    "nave": "ship"
    "dente": "tooth"
    "pelle": "skin"
    "quantita": "quantity (does not change in the plural)"
    "dito": "finger (plural le dita or i diti)"
    "braccio": "arm (plural le braccia or i bracci)"
  notes: "Every Italian noun is masculine or feminine, and the words for the and a change with it and with the first sound of the next word. Masculine, one: il before most consonants (il treno); lo before s plus a consonant, z, gn and ps (lo scontrino, lo zoo, lo psicologo), as Wiktionary's entry for lo lists; l' before a vowel (l'amico). The plural of il is i (i treni); the plural of lo and l' is gli (gli scontrini, gli amici). Feminine, one: la before a consonant (la borsa), l' before a vowel (l'amica); the plural is always le (le borse, le amiche). A or an: masculine un (un treno, un amico) and uno where lo is used (uno scontrino, uno zoo); feminine una (una borsa) and un' before a vowel (un'amica, un'idea). The plural of a noun: -o becomes -i, -a becomes -e, and -e becomes -i for both genders (treno, treni; borsa, borse; nave, navi; dente, denti). Nouns that end in a stressed vowel, and some others, do not change: la quantità, le quantità; l'autobus, gli autobus; lo zoo, gli zoo; l'euro, gli euro. Some plurals are irregular: uomo, uomini; mano is feminine though it ends in -o (la mano, le mani); dito has le dita when the fingers are seen together, or i diti; braccio has le braccia, or i bracci; stomaco has stomaci or stomachi; amico is amici and psicologo is psicologi. A noun in -e can be masculine or feminine (il dente, la nave), so learn the article with it. Sources: Wiktionary's entries for lo, gli, un, un' and for each noun, and Wikipedia's page on Italian grammar for the plural endings and the invariable nouns."
