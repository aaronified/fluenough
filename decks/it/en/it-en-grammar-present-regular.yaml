id: "it-en-grammar-present-regular"
kind: "layer"
core: "it-grammar-present-regular"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The present tense: regular verbs"
license: "CC-BY-SA-4.0"
description: "The present tense of sixteen everyday verbs in -are, -ere and -ire, including the -isc- type, for six persons. Not yet checked by an Italian speaker: please report any mistake."
pattern:
  name: "The present of regular verbs"
  slot_name: "person"
  slots:
    "io": "I (io)"
    "tu": "you, one person (tu)"
    "lui-lei": "he, she, it (lui, lei)"
    "noi": "we (noi)"
    "voi": "you, more than one (voi)"
    "loro": "they (loro)"
  entries:
    "parlare": "to talk (-are)"
    "guardare": "to look at (-are)"
    "cercare": "to look for (-are, adds h before i)"
    "pagare": "to pay (-are, adds h before i)"
    "mangiare": "to eat (-are, keeps one i)"
    "leggere": "to read (-ere)"
    "prendere": "to take (-ere)"
    "scrivere": "to write (-ere)"
    "vedere": "to see (-ere)"
    "chiudere": "to close (-ere)"
    "dormire": "to sleep (-ire)"
    "aprire": "to open (-ire)"
    "sentire": "to hear (-ire)"
    "capire": "to understand (-ire with -isc-)"
    "finire": "to finish (-ire with -isc-)"
    "preferire": "to prefer (-ire with -isc-)"
  notes: "Take off -are, -ere or -ire and add the endings for the person. Verbs in -are end -o, -i, -a, -iamo, -ate, -ano: parlo, parli, parla, parliamo, parlate, parlano. Verbs in -ere end -o, -i, -e, -iamo, -ete, -ono: leggo, leggi, legge, leggiamo, leggete, leggono. Verbs in -ire end -o, -i, -e, -iamo, -ite, -ono: dormo, dormi, dorme, dormiamo, dormite, dormono. Many -ire verbs add -isc- between the stem and the ending in io, tu, lui and lei, and loro: capisco, capisci, capisce, capiamo, capite, capiscono. Wiktionary's tables show which ones: capire, finire and preferire take it, dormire, aprire and sentire do not. Verbs in -care and -gare add an h before the i endings to keep the hard sound: cerco, cerchi, cerchiamo; pago, paghi, paghiamo. Mangiare keeps a single i: mangio, mangi, mangiamo. The noi and voi forms are stressed on the ending (parliamo, parlate); the loro form of -are, -ere and -ire verbs keeps the stress on the stem (parlano, leggono). Sources: Wiktionary's conjugation tables for each verb, and Wikipedia's page on Italian grammar for the three endings and the -isc- type."
