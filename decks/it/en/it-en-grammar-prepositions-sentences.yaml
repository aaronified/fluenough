kind: "layer"
core: "it-grammar-prepositions-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Prepositions in sentences"
license: "CC-BY-SA-4.0"
description: "Twenty short sentences with prepositions and articulated forms. Eight are Wiktionary examples and the rest are written from the table. Not yet checked by an Italian speaker: please report any mistake."
cards:
  "it-4350":
    native: "See you tomorrow!"
    notes:
      "n1": "A starts a goodbye with the time of the next meeting. Wiktionary's entry for a gives this one."
  "it-4351":
    native: "See you later!"
    notes:
      "n1": "A starts a goodbye with the time of the next meeting. Wiktionary's entry for a gives this one."
  "it-4352":
    native: "I go to school by bus."
    notes:
      "n1": "A means to a place and in means by with a vehicle. Wiktionary's entry for in gives this sentence."
  "it-4353":
    native: "Would you like some water?"
    notes:
      "n1": "Dell' is di and l' run together, and it means some. Wiktionary's entry for di gives this sentence."
  "it-4354":
    native: "The book is on the table."
    notes:
      "n1": "Sulla is su and la run together. Wiktionary's entry for su gives this sentence."
    bases:
      "Il": "the"
  "it-4355":
    native: "I have something in my pocket."
    notes:
      "n1": "In says where. Wiktionary's entry for in gives this sentence."
    bases:
      "tasca": "pocket"
  "it-4356":
    native: "in two weeks"
    notes:
      "n1": "Tra with a time means in. Fra can be used in the same way. Wiktionary's entry for tra gives this phrase."
  "it-4357":
    native: "the dog's tail"
    notes:
      "n1": "Del is di and il run together: the coda of the dog. Wiktionary's entry for di gives this phrase."
    bases:
      "la": "the"
      "coda": "tail"
  "it-4358":
    native: "The uncle's house."
    notes:
      "n1": "Dello is di and lo run together, because zio takes lo."
    bases:
      "La": "the"
  "it-4359":
    native: "Mum's bag."
    notes:
      "n1": "Della is di and la run together."
    bases:
      "La": "the"
  "it-4360":
    native: "The friend's house."
    notes:
      "n1": "Dell' is di and l' run together before a vowel."
    bases:
      "La": "the"
  "it-4361":
    native: "I am going to the doctor's."
    notes:
      "n1": "Dal is da and il run together. Wiktionary's entry for da has andare dal dottore."
  "it-4362":
    native: "I go to the supermarket."
    notes:
      "n1": "Al is a and il run together."
  "it-4363":
    native: "I go to the station."
    notes:
      "n1": "Alla is a and la run together."
  "it-4364":
    native: "We are at the zoo."
    notes:
      "n1": "Allo is a and lo run together, because zoo takes lo."
  "it-4365":
    native: "I am in the shop."
    notes:
      "n1": "Nel is in and il run together."
  "it-4366":
    native: "The coffee is in the cup."
    notes:
      "n1": "Nella is in and la run together."
    bases:
      "Il": "the"
  "it-4367":
    native: "The book is on the table."
    notes:
      "n1": "Sul is su and il run together."
    bases:
      "Il": "the"
  "it-4368":
    native: "The book is on the shelf."
    notes:
      "n1": "Sullo is su and lo run together, because scaffale takes lo."
    bases:
      "Il": "the"
  "it-4369":
    native: "We eat with the friends."
    notes:
      "n1": "Con stays apart from the article: con gli."
    bases:
      "gli": "the"
