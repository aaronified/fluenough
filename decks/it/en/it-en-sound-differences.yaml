schema: 1
id: "it-en-sound-differences"
kind: "layer"
core: "it-sound-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Italian sounds that differ from English"
license: "CC-BY-SA-4.0"
description: "21 words for the sounds Italian spells differently from English: doubled consonants (caro and carro), soft and hard c and g, sc, gn, gli, the silent h and the two sounds of z. Taken from the words' own Wiktionary entries and Wikipedia's pages on Italian spelling and Italian IPA. Not yet checked by an Italian speaker: please report any mistake."
cards:
  "it-0400":
    native: "shovel"
    notes:
      "n1": "One l, a short l: pa-la. Wiktionary gives it as a shovel. Palla (ball) has a doubled ll, which is a long consonant, held a moment longer. A doubled letter changes the word."
  "it-0401":
    native: "dear; expensive"
    notes:
      "pair": "Caro (dear) has one r. Carro (cart) has a doubled rr, a long r. Wikipedia's page on Italian spelling gives this pair as an example of length that changes the word."
  "it-0402":
    native: "cart; wagon"
    notes:
      "pair": "Carro (cart) has a doubled rr, a long r. Caro (dear) has one r. The length of the consonant is the only difference."
  "it-0403":
    native: "ninth"
    notes:
      "n1": "Nono (ninth) has one n. Nonno (grandfather, taught in the family unit) has a doubled nn, a long n. A doubled letter is said long."
  "it-0405":
    native: "thirst"
    notes:
      "n1": "Sete (thirst) has one t. Sette (seven) has a doubled tt, a long t. The doubled letter changes the word, so it matters when you speak."
  "it-0406":
    native: "dormouse"
    notes:
      "n1": "Gh before i keeps the hard g, as in English go: ghiro. Giro (turn, lap) has g before i with no h, and that is the soft g, as in English gem."
  "it-0407":
    native: "turn; tour; lap"
    notes:
      "n1": "G before i or e is soft, as in English gem: giro. Ghiro (dormouse) adds an h to keep the hard g. In giro the i is part of the spelling of the soft g."
  "it-0408":
    native: "sweet; candy"
    notes:
      "n1": "C before a, o or u is hard, like English k: caramella. The ch spelling (chi, che) also keeps the hard c before i and e."
  "it-0409":
    native: "top; peak; summit"
    notes:
      "n1": "C before i or e is soft, like English ch in church: cima. Compare the hard c of caramella."
  "it-0410":
    native: "scene; stage"
    notes:
      "n1": "Sc before e or i is said like English sh: scena. Wikipedia gives scerno (said with sh) against scherno (said with sk), where the h keeps the hard sound."
  "it-0411":
    native: "joke; trick"
    notes:
      "n1": "Sch before e or i is said sk, because the h keeps the hard sound: scherzo. Without the h, sce is said with sh, as in scena."
  "it-0412":
    native: "dream"
    notes:
      "n1": "Gn is one sound, like ny in canyon. Between two vowels it is long, said as if doubled: sogno. Wikipedia gives ogni as an example of this."
  "it-0413":
    native: "gnocchi; dumpling"
    notes:
      "n1": "Gn at the start of a word is the same sound as in sogno: like ny in canyon. Wiktionary lists the plural gnocchi, the form you meet on a menu."
  "it-0414":
    native: "leaf"
    notes:
      "n1": "Gli before a vowel is one sound, said like lli in million: foglia. Between vowels it is long. Wikipedia gives aglio as an example of this."
  "it-0415":
    native: "July"
    notes:
      "n1": "Gli before a vowel is said like lli in million, and is long between vowels: luglio. Wiktionary marks it as a noun with no plural."
  "it-0416":
    native: "has"
    notes:
      "n1": "Ha is the he, she or it form of avere, to have, and it does not show its base: ha comes from avere. The h is silent: ha sounds the same as a (to, at). Ho, hai, ha and hanno are forms of avere, and the h only tells them apart from o, ai, a and anno."
    bases:
      "ha": "to have"
  "it-0417":
    native: "to; at; in"
    notes:
      "n1": "A (to, at, in) has no h and ha (has) has one, but they sound the same. The h is silent in the forms ho, hai, ha and hanno."
  "it-0418":
    native: "paw; leg (of an animal)"
    notes:
      "n1": "Z is said ts in some words: zampa. Wikipedia says both ts and dz are written with z, and that the spelling does not tell you which, so you learn it word by word."
  "it-0419":
    native: "zebra"
    notes:
      "n1": "Z is said dz in some words: zebra. Compare zampa, said ts. The spelling does not tell you which one."
  "it-0420":
    native: "mosquito"
    notes:
      "n1": "Both z in zanzara are said dz. Wikipedia lists zanzara and zebra as examples of the voiced z, and zampa as the voiceless one."
