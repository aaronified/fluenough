schema: 1
id: "hne-en-phrasebook"
kind: "layer"
core: "hne-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty phrases to say whole from the first day, before their words are taught: greetings and goodbye, thanks and sorry, asking for slower speech, asking for help and where the toilet is. Not yet checked by a Chhattisgarhi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
cards:
  "hne-0001":
    native: "hello"
    notes:
      "n1": "The usual greeting. जोहार (johār) is a respectful greeting."
    bases:
      "जय जोहार": "hello"
  "hne-0002":
    native: "good morning"
    notes:
      "n1": "Said in the morning."
    bases:
      "सुप्रभात": "good morning"
  "hne-0003":
    native: "good evening"
    notes:
      "n1": "Said in the evening. संझा (sañjhā) is 'evening'."
    bases:
      "शुभ संझा": "good evening"
  "hne-0004":
    native: "good night"
    notes:
      "n1": "Said at bedtime. रात (rāt) is 'night'."
    bases:
      "शुभ रात": "good night"
  "hne-0005":
    native: "see you again"
    notes:
      "n1": "Literally 'there will be a meeting again'. Said when leaving."
    bases:
      "फेर भेंट होही": "see you again"
  "hne-0006":
    native: "please"
    notes:
      "n1": "Put before a request."
    bases:
      "कृपया": "please"
  "hne-0007":
    native: "thank you"
    notes:
      "n1": "Polite and common."
    bases:
      "धन्यवाद": "thank you"
  "hne-0008":
    native: "you're welcome; no problem"
    notes:
      "n1": "Literally 'there is no matter'. Said in reply to thanks."
    bases:
      "कोनो बात नोहे": "you're welcome; no problem"
  "hne-0009":
    native: "sorry"
    notes:
      "n1": "Said to say sorry."
    bases:
      "माफ करव": "sorry"
  "hne-0010":
    native: "excuse me"
    notes:
      "n1": "Literally 'please listen'. Said to get someone's attention."
    bases:
      "सुनव": "excuse me"
  "hne-0011":
    native: "I don't understand"
    notes:
      "n1": "Literally 'understanding does not come to me'."
    bases:
      "मोला समझ नई आवत": "I don't understand"
  "hne-0012":
    native: "I don't know Chhattisgarhi"
    notes:
      "n1": "Put another language's name in place of छत्तीसगढ़ी (chhattīsgaṛhī)."
    bases:
      "मोला छत्तीसगढ़ी नई आवय": "I don't know Chhattisgarhi"
  "hne-0013":
    native: "please speak slowly"
    notes:
      "n1": "धीरे (dhīre) is 'slowly'."
    bases:
      "धीरे गोठिया": "please speak slowly"
  "hne-0014":
    native: "do you speak English?"
    notes:
      "n1": "Respectful."
    bases:
      "का आप अंग्रेजी गोठिया सकथव?": "do you speak English?"
  "hne-0015":
    native: "how are you?"
    notes:
      "n1": "Respectful."
    bases:
      "आप कइसे हव?": "how are you?"
  "hne-0016":
    native: "I'm fine"
    notes:
      "n1": "The answer to how are you. ठीक (ṭhīk) is 'fine'."
    bases:
      "मैं ठीक हवं": "I'm fine"
  "hne-0017":
    native: "what is your name?"
    notes:
      "n1": "Respectful. The answer is मोर (mor) नाम (nām) ... हे (he)."
    bases:
      "आपके नाम का हे?": "what is your name?"
  "hne-0018":
    native: "my name is ..."
    notes:
      "n1": "Put your name where the dots are."
    bases:
      "मोर नाम ... हे": "my name is ..."
  "hne-0019":
    native: "where is the toilet?"
    notes:
      "n1": "शौचालय (śauchālay) is 'toilet'."
    bases:
      "शौचालय कहाँ हे?": "where is the toilet?"
  "hne-0020":
    native: "help!"
    notes:
      "n1": "Shouted in an emergency."
    bases:
      "बचाव!": "help!"
