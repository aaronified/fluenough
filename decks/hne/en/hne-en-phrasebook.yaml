description: "Nineteen phrases to say from the first day, before their words are taught: greetings and farewells, please and thank you, sorry and excuse me, yes and no, asking for slower speech and for help, and how to say your name. Not yet checked by a Chhattisgarhi speaker: please report any mistake."
