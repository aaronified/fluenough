native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "The first words of Chhattisgarhi: the pronouns, yes and no, the numbers 1 to 10, the family, and the everyday words for food, house, name and time. Not yet checked by a Chhattisgarhi speaker: please report any mistake."
cards:
  "hne-0101":
    native: "yes"
    notes:
      "n1": "The usual 'yes'."
    examples:
      "हाँ, यह पानी हे।":
        native: "Yes, this is water."
        bases:
          "हाँ": "yes"
          "यह": "this"
          "पानी": "water"
          "हे": "is"
  "hne-0102":
    native: "no; not"
    notes:
      "n1": "The negative. Before a verb it means 'not'."
    examples:
      "नई, मैं आवत नइं हवं।":
        native: "No, I am not coming."
        bases:
          "नई": "no"
          "मैं": "I"
          "आवत": "come"
          "नइं": "not"
          "हवं": "am"
  "hne-0103":
    native: "I"
    notes:
      "n1": "The first person. The Survey gives mai (or moi) for 'I'; mor is 'my'. Source: Grierson, Linguistic Survey of India, vol. VI (1904), the Chhattisgarhi section and the list of words (Raipur)."
    examples:
      "मैं डाक्टर हवं।":
        native: "I am a doctor."
        bases:
          "मैं": "I"
          "डाक्टर": "doctor"
          "हवं": "am"
      "मैं ठीक हवं।":
        native: "I am fine."
        bases:
          "मैं": "I"
          "ठीक": "fine"
          "हवं": "am"
  "hne-0104":
    native: "you (to a friend or child)"
    notes:
      "n1": "The Survey gives tai (or toi) for 'you' to one person; tor is 'your'. Source: Grierson, Linguistic Survey of India, vol. VI (1904), the Chhattisgarhi section and the list of words (Raipur)."
    examples:
      "तैं कहाँ हस?":
        native: "Where are you?"
        bases:
          "तैं": "you"
          "कहाँ": "where"
          "हस": "are"
      "तैं बढ़िया हस।":
        native: "You are well."
        bases:
          "तैं": "you"
          "बढ़िया": "good"
          "हस": "are"
  "hne-0105":
    native: "he; she"
    notes:
      "n1": "The Survey gives wo for 'that, he'. Source: Grierson, Linguistic Survey of India, vol. VI (1904), the Chhattisgarhi section and the list of words (Raipur)."
    examples:
      "वो घर में हे।":
        native: "He is at home."
        bases:
          "वो": "he"
          "घर": "home"
          "में": "at"
          "हे": "is"
      "वो डाक्टर हे।":
        native: "She is a doctor."
        bases:
          "वो": "she"
          "डाक्टर": "doctor"
          "हे": "is"
  "hne-0106":
    native: "we"
    notes:
      "n1": "The Survey gives ham and ham-man for 'we'. Source: Grierson, Linguistic Survey of India, vol. VI (1904), the Chhattisgarhi section and the list of words (Raipur)."
    bases:
      "हम": "we"
      "मन": "people (plural marker)"
    examples:
      "हम मन घर जावत हन।":
        native: "We are going home."
        bases:
          "हम": "we"
          "मन": "people"
          "घर": "home"
          "जावत": "go"
          "हन": "are"
      "हम मन छत्तीसगढ़िया हन।":
        native: "We are Chhattisgarhi."
        bases:
          "हम": "we"
          "मन": "people"
          "छत्तीसगढ़िया": "Chhattisgarhi"
          "हन": "are"
  "hne-0107":
    native: "they"
    notes:
      "n1": "The Survey gives wo-man for 'they' (the plural is made with -man). Source: Grierson, Linguistic Survey of India, vol. VI (1904), the Chhattisgarhi section and the list of words (Raipur)."
    examples:
      "वोमन पढ़थें।":
        native: "They study."
        bases:
          "वोमन": "they"
          "पढ़थें": "study"
      "वोमन नेपाली हन।":
        native: "They are Nepali."
        bases:
          "वोमन": "they"
          "नेपाली": "Nepali"
