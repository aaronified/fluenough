schema: 1
id: "sat-en-work"
kind: "layer"
core: "sat-work"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Work"
description: "Verbs of work: to sell, prepare and repair, collect, make, compose, dig, cut, sew and plough; and the jobs of a teacher and a mathematician. Not yet checked by a Santali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sat-1918":
    native: "to sell"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱟᱹᱠᱷᱨᱤᱧ (ākhriñ) gives only the meaning here; no further fact is taught from it."
  "sat-1919":
    native: "to prepare; to repair"
    wiktionary: true
    notes:
      "n1": "Wiktionary gives two senses: to prepare and to repair. The entry ᱡᱚᱛᱨᱟᱣ (jo̠traw) covers repair and mending."
  "sat-1920":
    native: "to repair; to mend; to maintain"
    wiktionary: true
    notes:
      "n1": "Wiktionary gives three senses: to repair, to mend and to maintain. Compare ᱥᱟᱡᱟᱣ (sajaw), which also means to repair."
  "sat-1921":
    native: "to collect"
    wiktionary: true
    notes:
      "n1": "Wiktionary also gives ᱡᱟᱣᱨᱟ (jawra) as an alternative spelling."
  "sat-1922":
    native: "to make; to create; to become"
    wiktionary: true
    notes:
      "n1": "Wiktionary gives three senses; the last is to become."
  "sat-1923":
    native: "to compose"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱜᱟᱵᱟᱱ (gaban) gives only the meaning here; no further fact is taught from it."
  "sat-1924":
    native: "to dig"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱞᱟ (la) gives only the meaning here; no further fact is taught from it."
  "sat-1925":
    native: "to cut"
    wiktionary: true
    notes:
      "n1": "Wiktionary compares it with the Khmer word kat, meaning to cut."
  "sat-1926":
    native: "to sew; to weave"
    wiktionary: true
    notes:
      "n1": "Wiktionary gives two senses: to sew and to weave."
  "sat-1927":
    native: "to plough"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱥᱤ (si) gives only the meaning here; no further fact is taught from it."
  "sat-1928":
    native: "teacher"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱡᱟᱪᱮᱛ (jacet) gives only the meaning here; no further fact is taught from it."
  "sat-1929":
    native: "mathematician"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱮᱞᱠᱷᱟᱨᱤᱭᱟᱹ (elkhariyā) gives only the meaning here; no further fact is taught from it."
