schema: 1
id: "sat-en-everyday-verbs"
kind: "layer"
core: "sat-everyday-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Everyday verbs"
description: "Verbs of everyday actions: eating, drinking, sleeping, going, coming, giving, washing, sitting, standing, running and more. Each meaning is the Wiktionary entry's gloss. Not yet checked by a Santali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sat-1600":
    native: "to eat"
    wiktionary: true
    dictionary:
      senses: ["to take a bite"]
      source: "https://en.wiktionary.org/wiki/ᱦᱟᱵ"
    notes:
      "n1": "Wiktionary also gives 'to take a bite' for this word, and lists ᱡᱚᱢ (jo̠m) as a synonym meaning 'to eat'."
  "sat-1601":
    native: "to eat, consume"
    wiktionary: true
    dictionary:
      senses: ["to suffer", "to hear", "to accept as true"]
      etymology: "Inherited from Proto-Munda *ɟv₁₀m. Cognate with Mundari जोम (jom)."
      source: "https://en.wiktionary.org/wiki/ᱡᱚᱢ"
    notes:
      "n1": "Wiktionary also gives 'to suffer', 'to hear' and 'to accept as true' for this word."
  "sat-1602":
    native: "to drink"
    wiktionary: true
    notes:
      "n1": "Wiktionary says it comes from Proto-Austroasiatic *ɲuʔ and is cognate with Vietnamese nhậu."
  "sat-1603":
    native: "to sleep"
    wiktionary: true
    notes:
      "n1": "The Wiktionary entry for ᱡᱟᱸᱯᱤᱫ (jãpit') gives this meaning only."
  "sat-1604":
    native: "to lie down, sleep"
    wiktionary: true
    notes:
      "n1": "The Wiktionary entry for ᱜᱤᱛᱤᱡ (gitic') gives this meaning only."
  "sat-1605":
    native: "to go"
    wiktionary: true
    notes:
      "n1": "The Wiktionary entry for ᱪᱟᱞᱟᱜ (calak') gives this meaning and one example only."
    examples:
      "ᱤᱧ ᱪᱟᱞᱟᱜ ᱤᱧ ᱥᱮ?": "Should I go?"
  "sat-1606":
    native: "to come"
    wiktionary: true
    dictionary:
      senses: ["to come back, to return"]
      source: "https://en.wiktionary.org/wiki/ᱦᱤᱡᱩᱜ"
    notes:
      "n1": "Wiktionary also gives 'to come back' and 'to return' for this word."
  "sat-1607":
    native: "to give"
    wiktionary: true
    notes:
      "n1": "The Wiktionary entry for ᱮᱢ (em) gives this meaning only."
  "sat-1608":
    native: "to bring"
    wiktionary: true
    notes:
      "n1": "The Wiktionary entry for ᱟᱹᱜᱩ (āgu) gives this meaning and one example only."
    examples:
      "ᱳᱱᱚ ᱱᱚᱰᱮ ᱟᱹᱜᱩᱭᱮᱢ ᱾": "Bring this here."
  "sat-1609":
    native: "to wash"
    wiktionary: true
    notes:
      "n1": "The Wiktionary entry for ᱟᱵᱩᱝ (abuṅ) gives this meaning only."
  "sat-1610":
    native: "to wipe"
    wiktionary: true
    notes:
      "n1": "The Wiktionary entry for ᱡᱳᱫ (jot') gives this meaning only."
  "sat-1611":
    native: "to sit"
    wiktionary: true
    notes:
      "n1": "The Wiktionary entry for ᱫᱩᱲᱩᱵ (duṛup') gives this meaning only."
  "sat-1612":
    native: "to stand"
    wiktionary: true
    notes:
      "n1": "The Wiktionary entry for ᱛᱮᱝᱜᱳ (teṅgo) gives this meaning only."
  "sat-1613":
    native: "to run"
    wiktionary: true
    notes:
      "n1": "The Wiktionary entry for ᱫᱟᱹᱲ (dāṛ) gives this meaning and two examples only."
    examples:
      "ᱩᱱᱤ ᱫᱟᱹᱲ ᱠᱮᱜᱼᱟᱭ ᱾": "He ran."
      "ᱩᱱᱤ ᱫᱟᱹᱲ ᱟᱭ ᱾": "He runs."
  "sat-1614":
    native: "to wait"
    wiktionary: true
    notes:
      "n1": "The Wiktionary entry for ᱛᱟᱹᱝᱜᱤ (tāṅgi) gives this meaning and one example only."
    examples:
      "ᱱᱚᱰᱮ ᱛᱟᱹᱝᱜᱤ ᱢᱮ ᱾": "Wait here."
  "sat-1615":
    native: "to call"
    wiktionary: true
    dictionary:
      senses: ["to phone"]
      source: "https://en.wiktionary.org/wiki/ᱦᱚᱦᱚ"
    notes:
      "n1": "Wiktionary also gives 'to phone' for this word, so it covers a phone call."
    examples:
      "ᱚᱠᱚᱭᱪᱷᱚᱸ ᱦᱚᱦᱚ ᱠᱮᱜᱼᱟ ᱠᱚ ᱾": "Somebody called."
  "sat-1616":
    native: "to stay; to remain"
    wiktionary: true
    dictionary:
      senses: ["to live"]
      source: "https://en.wiktionary.org/wiki/ᱛᱟᱦᱮᱸ"
    notes:
      "n1": "Wiktionary also gives 'to live' for this word."
  "sat-1617":
    native: "to begin; to start"
    wiktionary: true
    notes:
      "n1": "The Wiktionary entry for ᱮᱦᱳᱵ (ehop') gives this meaning only, and no pronunciation."
  "sat-1618":
    native: "to help"
    wiktionary: true
    notes:
      "n1": "The Wiktionary entry for ᱜᱚᱲᱚ (go̠ṛo̠) gives this meaning only."
  "sat-1619":
    native: "to push"
    wiktionary: true
    notes:
      "n1": "The Wiktionary entry for ᱰᱷᱟᱹᱠᱞᱟᱹᱩ (ḍhāklāu) gives this meaning only."
  "sat-1620":
    native: "to turn; to turn round"
    wiktionary: true
    dictionary:
      senses: ["to return", "to revolve"]
      source: "https://en.wiktionary.org/wiki/ᱱᱟᱹᱪᱩᱨ"
    notes:
      "n1": "Wiktionary also gives 'to return' and 'to revolve' for this word."
  "sat-1621":
    native: "to fall"
    wiktionary: true
    notes:
      "n1": "The Wiktionary entry for ᱵᱤᱱᱫᱲᱟᱹᱝ (bindṛāṅ) gives this meaning only."
  "sat-1622":
    native: "to exist; to be there"
    wiktionary: true
    dictionary:
      senses: ["to have"]
      source: "https://en.wiktionary.org/wiki/ᱢᱮᱱᱟᱜ"
    notes:
      "n1": "Wiktionary also gives 'to have' for this word."
    examples:
      "ᱵᱚᱝᱠᱟ ᱫᱚ ᱢᱮᱱᱟᱜ ᱠᱚᱣᱟ ᱥᱮ?": "Do gods exist?"
      "ᱱᱤᱛᱚᱜ ᱫᱚ ᱚᱠᱛᱚ ᱢᱮᱱᱟᱜ ᱜᱮᱭᱟ ᱾": "There is still time."
  "sat-1623":
    native: "to be; to become"
    wiktionary: true
    dictionary:
      senses: ["to be born", "to suffice", "to happen", "to be over, come to an end"]
      source: "https://en.wiktionary.org/wiki/ᱦᱚᱭᱚᱜ"
    notes:
      "n1": "Wiktionary also gives 'to be born', 'to suffice', 'to happen' and 'to be over' for this word."
