schema: 1
id: "sat-en-numbers-big"
kind: "layer"
core: "sat-numbers-big"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Tens and big numbers"
description: "The tens from thirty to ninety, and hundred, thousand, lakh and crore. Not yet checked by a Santali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sat-1930":
    native: "thirty"
    wiktionary: true
    notes:
      "n1": "Made of ᱯᱮ (pe), three, and ᱜᱮᱞ (gel), ten: three tens."
    bases:
      "ᱯᱮ": "three"
      "ᱜᱮᱞ": "ten"
  "sat-1931":
    native: "forty"
    wiktionary: true
    notes:
      "n1": "Made of ᱯᱩᱱ (pun) and ᱜᱮᱞ (gel), ten. Wiktionary calls ᱯᱩᱱ (pun) an alternative form of ᱯᱳᱱ (pon), four."
    bases:
      "ᱯᱩᱱ": "four"
      "ᱜᱮᱞ": "ten"
  "sat-1932":
    native: "fifty"
    wiktionary: true
    notes:
      "n1": "Made of ᱢᱚᱬᱮ (mo̠ṇe), five, and ᱜᱮᱞ (gel), ten: five tens."
    bases:
      "ᱢᱚᱬᱮ": "five"
      "ᱜᱮᱞ": "ten"
  "sat-1933":
    native: "sixty"
    wiktionary: true
    notes:
      "n1": "Made of ᱛᱩᱨᱩᱭ (turuy), six, and ᱜᱮᱞ (gel), ten: six tens."
    bases:
      "ᱛᱩᱨᱩᱭ": "six"
      "ᱜᱮᱞ": "ten"
  "sat-1934":
    native: "seventy"
    wiktionary: true
    notes:
      "n1": "Made of ᱮᱭᱟᱭ (eyay), seven, and ᱜᱮᱞ (gel), ten: seven tens."
    bases:
      "ᱮᱭᱟᱭ": "seven"
      "ᱜᱮᱞ": "ten"
  "sat-1935":
    native: "eighty"
    wiktionary: true
    notes:
      "n1": "Made of ᱤᱨᱟᱹᱞ (irāl), eight, and ᱜᱮᱞ (gel), ten: eight tens."
    bases:
      "ᱤᱨᱟᱹᱞ": "eight"
      "ᱜᱮᱞ": "ten"
  "sat-1936":
    native: "ninety"
    wiktionary: true
    notes:
      "n1": "Made of ᱟᱨᱮ (are), nine, and ᱜᱮᱞ (gel), ten: nine tens."
    bases:
      "ᱟᱨᱮ": "nine"
      "ᱜᱮᱞ": "ten"
  "sat-1937":
    native: "hundred"
    wiktionary: true
    notes:
      "n1": "From Hindi sau, meaning hundred. Wiktionary also gives ᱥᱟᱭ (say) as a word for hundred."
  "sat-1938":
    native: "thousand"
    wiktionary: true
    notes:
      "n1": "Ultimately from Classical Persian hazar, meaning thousand."
  "sat-1939":
    native: "hundred thousand; lakh"
    wiktionary: true
    notes:
      "n1": "Borrowed from Indo-Aryan, ultimately from Sanskrit lakṣa. Wiktionary also gives ᱞᱟᱠᱷ (lakh) as an alternative form."
  "sat-1940":
    native: "crore; ten million"
    wiktionary: true
    notes:
      "n1": "Borrowed from Hindi karoṛ."
