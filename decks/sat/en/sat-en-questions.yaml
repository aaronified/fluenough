schema: 1
id: "sat-en-questions"
kind: "layer"
core: "sat-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Questions"
description: "Question words and small words for asking and answering: when, how, why, who (plural), the question marker, the negative particle, not, and to ask. Only the words that could be sourced are here. Not yet checked by a Santali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sat-1300":
    native: "when"
    notes:
      "n1": "ᱛᱤᱱᱨᱮ (tinre) is built from ᱛᱤᱱ (tin) with the suffix -ᱨᱮ (-re), as the Wiktionary entry gives it."
    bases:
      "ᱛᱤᱱᱨᱮ": "when"
  "sat-1301":
    native: "how; why"
    notes:
      "n1": "The Wiktionary entry gives three senses: how, in what manner, and why. This card teaches 'how' and 'why'."
  "sat-1302":
    native: "who (plural)"
    notes:
      "n1": "ᱚᱠᱚᱭᱠᱚ (o̠ko̠yko̠) is ᱚᱠᱚᱭ (o̠ko̠y), 'who', with the plural marker ᱠᱚ (ko̠)."
    bases:
      "ᱚᱠᱚᱭᱠᱚ": "who (plural)"
  "sat-1303":
    native: "marks a question"
    notes:
      "n1": "ᱥᱮ (se) marks a question. The Wiktionary entry gives the same spelling for a separate conjunction, 'or', which is not taught here."
  "sat-1304":
    native: "negative particle"
    notes:
      "n1": "The Wiktionary entry gives only 'a negative particle', not 'no'. ᱵᱟᱝ (baṅ) is 'no'."
  "sat-1305":
    native: "not"
    notes:
      "n1": "ᱵᱟ (ba) is 'not', a negation adverb. ᱵᱟᱝ (baṅ), 'no', is spelled almost the same, with one more sign at the end."
  "sat-1306":
    native: "to ask"
    notes:
      "n1": "The Wiktionary entry gives 'to enquire' as a second sense of the same verb."
