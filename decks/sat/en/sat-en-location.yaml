cards:
  "sat-1912":
    native: "near"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱥᱳᱨ (sor) gives only the meaning here; no further fact is taught from it."
  "sat-1913":
    native: "far"
    wiktionary: true
    notes:
      "n1": "Wiktionary links it with the Khmer and Vietnamese words for far."
  "sat-1914":
