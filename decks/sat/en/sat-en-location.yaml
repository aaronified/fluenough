    wiktionary: true
    notes:
      "n1": "Wiktionary also gives 'floor of a house' as a sense of ᱚᱛ (o̠t). A separate sense of the entry names a letter of the Ol Chiki alphabet; that sense is not taught here."
  "sat-1916":
    native: "road; way"
    wiktionary: true
    notes:
