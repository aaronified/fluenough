core: "sat-describing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing things and feelings"
description: "Words for describing things: size, colour, shape, temperature, age and quality. Each meaning is the Wiktionary entry's gloss. Not yet checked by a Santali speaker: please report any mistake."
