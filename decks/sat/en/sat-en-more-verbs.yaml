schema: 1
id: "sat-en-more-verbs"
kind: "layer"
core: "sat-more-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs"
description: "More everyday verbs: seeing, hearing, speaking, knowing, feelings, play and sport, and handling things: pulling, cutting, tying and more. Each meaning is the Wiktionary entry's gloss. Not yet checked by a Santali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sat-1677":
    native: "to see; to look"
    wiktionary: true
    dictionary:
      senses: ["to seem, look, appear"]
      etymology: "From Proto-Munda *(n)El, meaning 'to see'."
      source: "https://en.wiktionary.org/wiki/ᱧᱮᱞ"
    notes:
      "n1": "Wiktionary says it comes from Proto-Munda *(n)El, meaning 'to see'."
  "sat-1678":
    native: "to hear; to listen"
    wiktionary: true
    notes:
      "n1": "The Wiktionary entry for ᱟᱧᱡᱚᱢ (añjo̠m) gives this meaning only."
  "sat-1679":
    native: "to speak"
    wiktionary: true
    notes:
      "n1": "The Wiktionary entry for ᱨᱳᱲ (roṛ) gives this meaning only, and no pronunciation."
  "sat-1680":
    native: "to say; to tell"
    wiktionary: true
    dictionary:
      senses: ["to wish", "to call"]
      source: "https://en.wiktionary.org/wiki/ᱢᱮᱱ"
    notes:
      "n1": "Wiktionary also gives 'to wish' and 'to call' for this word."
  "sat-1681":
    native: "to know"
    wiktionary: true
    notes:
