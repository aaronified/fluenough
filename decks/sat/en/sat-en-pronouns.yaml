schema: 1
id: "sat-en-pronouns"
kind: "layer"
core: "sat-pronouns"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Pronouns and people words"
description: "Pronouns and people words: we and you for two people and for more than two, both, all, everyone, anyone, someone, any, another one, nothing, nobody, much, many and the whole. Only the words that could be sourced are here. Not yet checked by a Santali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sat-1307":
    native: "we two (excluding you)"
    notes:
      "n1": "The Wiktionary entry gives 'dual exclusive': the 'we' of two people, which leaves out the person spoken to."
  "sat-1308":
    native: "we all (including you)"
    notes:
      "n1": "The Wiktionary entry gives 'plural inclusive': 'we' for more than two people, which includes the person spoken to."
  "sat-1309":
    native: "you two"
    notes:
      "n1": "The Wiktionary entry gives 'dual': 'you' for two people."
  "sat-1310":
    native: "you all"
    notes:
      "n1": "The Wiktionary entry gives 'plural': 'you' for more than two people."
  "sat-1311":
    native: "both"
    notes:
      "n1": "The Wiktionary entry also lists ᱵᱟᱱᱟ (bana) as a form of this word."
  "sat-1312":
    native: "all; everything"
    notes:
      "n1": "The Wiktionary entry lists ᱡᱷᱚᱛᱚ (jho̠to̠) as a variant spelling."
  "sat-1313":
    native: "everyone"
    notes:
      "n1": "Built from ᱡᱷᱚᱛᱚ (jho̠to̠), 'all', ᱦᱚᱲ (ho̠ṛ), 'man, human', and the plural marker ᱠᱚ (ko̠), as the Wiktionary entry gives it."
    bases:
      "ᱡᱷᱚᱛᱚ": "all"
      "ᱦᱚᱲ": "man, human"
      "ᱠᱚ": "plural marker"
  "sat-1314":
    native: "anyone; someone"
    notes:
      "n1": "The Wiktionary entry gives 'anyone, someone' as one sense. ᱡᱟᱦᱟᱸ (jahã), 'any', is a different word."
  "sat-1315":
    native: "any; anything; whatever"
    notes:
      "n1": "The Wiktionary entry gives four senses: any, anything, whatever and wherever. ᱡᱟᱦᱟᱸᱭ (jahãy), 'anyone', is a separate word."
  "sat-1316":
    native: "another one"
    notes:
      "n1": "The Wiktionary entry says it comes from ᱮᱴᱟᱜ (eṭak’)."
    bases:
      "ᱮᱴᱟᱜᱼᱤᱡ": "another one"
  "sat-1317":
    native: "nothing"
    notes:
      "n1": "Built from ᱪᱮᱫ (cet’), 'what', ᱦᱚᱸ (hõ̠), 'too', and ᱵᱟᱝ (baṅ), which the Wiktionary entry gives as 'not'."
    bases:
      "ᱦᱚᱸ": "too"
  "sat-1318":
    native: "nobody"
    notes:
      "n1": "Built from ᱚᱠᱚᱭ (o̠ko̠y), 'who, which', ᱦᱚᱸ (hõ̠), 'too', and ᱵᱟᱠᱚ (bako̠), 'not', as the Wiktionary entry gives it."
    bases:
      "ᱦᱚᱸ": "too"
      "ᱵᱟᱠᱚ": "not"
  "sat-1319":
    native: "much; many"
    notes:
      "n1": "The Wiktionary entry compares it with the Khmer អាត់ (ʼat) and the Vietnamese ít."
  "sat-1320":
    native: "the whole"
    notes:
      "n1": "The Wiktionary entry gives 'the whole' and no further facts."
