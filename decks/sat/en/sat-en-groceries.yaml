schema: 1
id: "sat-en-groceries"
kind: "layer"
core: "sat-groceries"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Groceries"
description: "Sugar, tea, milk, flour, wheat, salt, dal, masala, coffee, oil and fat. Not yet checked by a Santali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sat-1967":
    native: "sugar"
    wiktionary: true
    notes:
      "n1": "Probably from Odia cini."
  "sat-1968":
    native: "tea"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱪᱚ (co̠) gives only the meaning here; no further fact is taught from it."
  "sat-1969":
    native: "milk"
    wiktionary: true
    notes:
      "n1": "Wiktionary also gives ᱛᱚᱣᱟ (to̠wa) as an alternative form."
  "sat-1970":
    native: "flour; bread"
    wiktionary: true
    notes:
      "n1": "Wiktionary gives two senses: flour and bread. The word comes ultimately from a Prakrit, and from Sanskrit piṣṭa."
  "sat-1971":
    native: "wheat"
    wiktionary: true
    notes:
      "n1": "Ultimately from Sanskrit godhūma."
  "sat-1972":
    native: "salt"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱵᱩᱞᱩᱝ (buluṅ) gives only the meaning here; no further fact is taught from it."
  "sat-1973":
    native: "dal; lentils"
    wiktionary: true
    notes:
      "n1": "Ultimately from Sanskrit dāla."
  "sat-1974":
    native: "masala"
    wiktionary: true
    notes:
      "n1": "Borrowed from Indo-Aryan, from Classical Persian masālih, meaning materials or spices, from the Arabic plural of maṣlaḥa."
  "sat-1975":
    native: "coffee"
    wiktionary: true
    notes:
      "n1": "Borrowed from Bengali kophi, from English coffee."
  "sat-1976":
    native: "oil"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱥᱩᱱᱩᱢ (sunum) gives only the meaning here; no further fact is taught from it."
  "sat-1977":
    native: "fat"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱤᱛᱤᱞ (itil) gives only the meaning here; no further fact is taught from it."
