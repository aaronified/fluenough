    notes:
      "n1": "Wiktionary also gives the sense 'hill' for ᱵᱩᱨᱩ (buru); a separate word for hill is ᱵᱩᱱᱩᱢ (bunum)."
  "sat-2263":
    native: "hill"
    wiktionary: true
    notes:
