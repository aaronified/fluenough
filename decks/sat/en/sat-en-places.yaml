  "sat-2275":
    native: "China"
    wiktionary: true
    notes:
      "n1": "Wiktionary describes it as a country in East Asia."
  "sat-2276":
    native: "Singapore"
    wiktionary: true
    notes:
      "n1": "Wiktionary: an island and city-state in Southeast Asia, off the southern tip of the Malay Peninsula; a former British crown colony and a state of Malaysia (1963 to 1965)."
  "sat-2277":
    native: "Odisha"
    wiktionary: true
    notes:
      "n1": "Wiktionary describes it as a state in eastern India."
      "n2": "Borrowed from Odia 'oṛiśā', from Sanskrit 'oḍradeśa', 'land of the Odras'."
  "sat-2278":
    native: "Dumka"
    wiktionary: true
    notes:
      "n1": "Wiktionary gives two places of this name: a city and a district of Jharkhand, India."
  "sat-2279":
    native: "the Himalayas"
    wiktionary: true
    notes:
      "n1": "Source: the Wiktionary Santali entry for ᱦᱮᱢᱟᱞ ᱵᱩᱨᱩ (hemal buru), which gives only the meaning."
  "sat-2280":
    native: "Ganges"
    wiktionary: true
    notes:
      "n1": "Source: the Wiktionary Santali entry for ᱜᱚᱝᱜᱚ (go̠ṅgo̠), which gives only the meaning."
  "sat-2281":
    native: "Yamuna"
    wiktionary: true
    notes:
      "n1": "Borrowed from Bengali 'jomuna', itself borrowed from Sanskrit 'yamunā'."
  "sat-2282":
    native: "Antarctica"
    wiktionary: true
    notes:
      "n1": "Wiktionary: the southernmost continent, south of the Southern Ocean, containing the South Pole."
