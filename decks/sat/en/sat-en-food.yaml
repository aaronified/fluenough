tags: ["unreviewed"]
cards:
  "sat-1941":
    native: "buttermilk"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱜᱷᱳᱨ (ghor) gives only the meaning here; no further fact is taught from it."
  "sat-1942":
