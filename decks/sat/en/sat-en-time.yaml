schema: 1
id: "sat-en-time"
kind: "layer"
core: "sat-time"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Time and days"
description: "The hour, minute, second and clock; time, now, yesterday and tomorrow; day, night, afternoon and noon. Not yet checked by a Santali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sat-1900":
    native: "hour"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱴᱟᱲᱟᱝ (ṭaṛaṅ) gives only the meaning here; no further fact is taught from it."
  "sat-1901":
    native: "minute"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱴᱤᱲᱤᱡ (ṭiṛic') gives only the meaning here; no further fact is taught from it."
  "sat-1902":
    native: "second"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱴᱤᱯᱤᱡ (ṭipic') gives only the meaning here; no further fact is taught from it."
  "sat-1903":
    native: "time"
    wiktionary: true
    notes:
      "n1": "Borrowed from Bengali, which took it from Classical Persian waqt, from Arabic waqt, meaning time. Wiktionary's Santali entry gives the same chain."
  "sat-1904":
    native: "clock; timepiece"
    wiktionary: true
    notes:
      "n1": "Borrowed from Bengali, where the word is ghoṛi."
  "sat-1905":
    native: "now"
    wiktionary: true
    notes:
      "n1": "Wiktionary's only example puts it with a verb of going: 'Go now.' The example is in its entry for ᱱᱤᱛᱚᱜ (nito̠k')."
  "sat-1906":
    native: "yesterday"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱜᱳᱞᱚ (golo̠) gives only the meaning here; no further fact is taught from it."
  "sat-1907":
    native: "tomorrow"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱜᱟᱯᱟ (gapa) gives only the meaning here; no further fact is taught from it."
  "sat-1908":
    native: "day"
    wiktionary: true
    notes:
      "n1": "From Sanskrit dina, meaning day."
  "sat-1909":
    native: "night"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱧᱤᱸᱫᱟᱹ (ñĩdā) gives only the meaning here; no further fact is taught from it."
  "sat-1910":
    native: "afternoon"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱛᱟᱨᱟᱥᱤᱧ (tarasiñ) gives only the meaning here; no further fact is taught from it."
  "sat-1911":
    native: "noon; midday"
    wiktionary: true
    notes:
      "n1": "The English Wiktionary's Santali entry for ᱛᱤᱠᱤᱱ (tikin) gives only the meaning here; no further fact is taught from it."
