native: { code: "en", iso639_3: "eng", name: "English" }
name: "Numbers 1 to 20"
description: "Numbers from one to twenty: one, the teens from eleven to nineteen, and twenty. The numbers two to ten are in the first words. Not yet checked by a Santali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sat-1326":
    native: "one"
    notes:
      "n1": "The Wiktionary entry says it comes from Sanskrit एक (éka). ᱢᱤᱫ (mit') is also 'one', and is taught in the first words."
  "sat-1327":
    native: "twenty"
    notes:
      "n1": "The Wiktionary entry has a second spelling of twenty, ᱵᱟᱨ ᱜᱮᱞ (bar gel)."
  "sat-1328":
    native: "eleven"
    notes:
      "n1": "Its headword is two words: ᱜᱮᱞ (gel), ten, and ᱢᱤᱫ (mit'), one. The Wiktionary entry gives no further facts."
  "sat-1329":
    native: "twelve"
    notes:
      "n1": "Its headword is two words: ᱜᱮᱞ (gel), ten, and ᱵᱟᱨ (bar), two. The Wiktionary entry gives no further facts."
