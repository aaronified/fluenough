cards:
  "sat-1337":
    native: "to name; to call by name"
    notes:
      "n1": "The Wiktionary entry gives three senses: to name, to call by name and to praise. The name sense is the one taught here."
  "sat-1338":
    native: "person"
    notes:
      "n1": "The Wiktionary entry gives 'person' and no further facts."
  "sat-1339":
    native: "Santali language"
    notes:
      "n1": "The Wiktionary entry also gives 'Santali people' as a second sense."
  "sat-1340":
    native: "a Santal (a member of the Santal people)"
    notes:
      "n1": "Borrowed from Bengali সাঁওতাল (śãōtal)."
