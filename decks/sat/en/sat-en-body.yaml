id: "sat-en-body"
kind: "layer"
core: "sat-body"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The body"
description: "The body: eye, ear, nose, mouth, hand, leg, head, hair and more. Not yet checked by a Santali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sat-2214":
    native: "eye"
    wiktionary: true
    notes:
      "n1": "Inherited from Proto-Munda *maˀt ('eye'), from Proto-Austroasiatic *matʔ; cognate with Khmer 'mŏət' and Vietnamese 'mắt'."
