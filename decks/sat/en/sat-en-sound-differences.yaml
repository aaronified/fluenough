schema: 1
id: "sat-en-sound-differences"
kind: "layer"
core: "sat-sound-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sounds English lacks"
description: "Ten words for sounds English does not have: stopped final consonants, nasal vowels, a breathy d, curled-back t, d and r, and a middle ng. Taken from Wiktionary and Wikipedia. Not yet checked by a Santali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sat-0400":
    native: "hair"
    notes:
      "n1": "Santali words that end in a stop say it checked: the sound is closed and held with a catch in the throat, and not released. The apostrophe in the reading, up', marks it. The word is written with the voiced letter for b, but the last sound is a checked p."
  "sat-0401":
    native: "ash"
    notes:
      "n1": "The last sound is a checked c', the same stopped ending as in up'. It is written with the voiced letter for j. Before a vowel ending the voice may come back."
      "n2": "Santali keeps two o vowels apart: the closed o [o], as in this word, and the open o [ɔ], written o̠ in the readings, as in cãdo̠, moon."
  "sat-0402":
    native: "nose"
    notes:
      "n1": "The vowel is nasal: air also passes through the nose, as in French or Portuguese. The readings show it with a tilde, mũ. Nasal and plain vowels make different words in Santali: Wikipedia gives aɽɔt, dense, against aɽɔ̃t, unsympathetic or filthy."
  "sat-0403":
    native: "moon; month"
    notes:
      "n1": "Another nasal vowel, in the first syllable: cã. Wiktionary says the word was borrowed from Bengali."
      "n2": "The last vowel is the open o, [ɔ], written o̠ in the readings: not the closed o of toroc', ash."
  "sat-0404":
    native: "stone"
    notes:
      "n1": "dh is one sound, a d said with a puff of breath, [dʱ]. Santali has aspirated stops, mostly in words from Indian languages. Wikipedia gives this word as an example of one that arose inside Santali, when dihiri, stone, contracted."
  "sat-0405":
    native: "dust"
    notes:
      "n1": "ṛ is a single tap of the tongue with the tip curled back, [ɽ]. No Santali word begins with it. The first sound is the aspirated dh again, as in dhiri, stone."
  "sat-0406":
    native: "rat"
    notes:
      "n1": "ṭ is a retroflex t: the tongue tip is curled back to touch the roof of the mouth. Santali has this t as well as an ordinary t, and English has only the ordinary one."
  "sat-0407":
    native: "banyan"
    notes:
      "n1": "ṛ between two vowels: one quick tap with the tongue tip curled back, [ɽ], not an English r."
  "sat-0408":
    native: "boat"
    notes:
      "n1": "ḍ is a retroflex d: the tongue tip is curled back, as for ṭ in cuṭu, rat. The first vowel is the open o, nasalised: õ̠ in the readings, [ɔ̃]."
  "sat-0409":
    native: "cattle; cow"
    notes:
      "n1": "ṅ is the sound at the end of English sing, [ŋ]. Santali also says it in the middle of a word, as here, but no Santali word begins with it."
