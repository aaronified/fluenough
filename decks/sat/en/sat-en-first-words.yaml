schema: 1
id: "sat-en-first-words"
kind: "layer"
core: "sat-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "Yes, the pronouns, the numbers one to ten, family and people, and everyday words such as water, rice, bread, house, good, big and small. Not yet checked by a Santali speaker: please report any mistake."
cards:
  "sat-0101":
    native: "yes"
    notes:
      "n1": "The Santali word for yes is ᱦᱮᱸ (hẽ)."
    bases:
      "ᱦᱮᱸ": "yes"
  "sat-0102":
    native: "I; me"
    notes:
      "n1": "ᱤᱧ (iñ) is the first person singular, 'I'. Santali separates 'we' into exclusive and inclusive forms, and into singular, dual and plural."
    bases:
      "ᱤᱧ": "I; me"
  "sat-0103":
    native: "you"
    notes:
      "n1": "ᱟᱢ (am) is 'you' for one person. Used to a friend, and to anyone you speak to directly."
    bases:
      "ᱟᱢ": "you"
  "sat-0104":
    native: "he; she"
    notes:
      "n1": "ᱟᱡ (ac') refers back to a person already named, 'he' or 'she'. Santali does not separate he and she."
    bases:
      "ᱟᱡ": "he; she"
  "sat-0105":
    native: "we"
    notes:
      "n1": "ᱟᱞᱮ (ale) is 'we' for a group that leaves out the person spoken to. Sources differ on the inclusive form, so check before using it."
    bases:
      "ᱟᱞᱮ": "we"
  "sat-0106":
    native: "they"
    notes:
      "n1": "ᱟᱠᱳ (ako) refers back to more than one person already named, 'they'. Another source gives ᱩᱱᱠᱩ (unku) for 'they'."
  "sat-0107":
    native: "one"
    notes:
      "n1": "ᱢᱤᱫ (mit') is the number 1."
  "sat-0108":
    native: "two"
    notes:
      "n1": "ᱵᱟᱨ (bar) is the number 2."
  "sat-0109":
    native: "three"
    notes:
      "n1": "ᱯᱮ (pe) is the number 3."
  "sat-0110":
    native: "four"
    notes:
      "n1": "ᱯᱩᱱ (pon) is the number 4."
  "sat-0111":
    native: "five"
    notes:
      "n1": "ᱢᱚᱬᱮ (mo̠ṇe) is the number 5."
  "sat-0112":
    native: "six"
    notes:
      "n1": "ᱛᱩᱨᱩᱭ (turui) is the number 6. Only one source gives this word; check it."
  "sat-0113":
    native: "seven"
    notes:
      "n1": "ᱮᱭᱟᱭ (eyae) is the number 7. Only one source gives this word; check it."
  "sat-0114":
    native: "eight"
    notes:
      "n1": "ᱤᱨᱟᱹᱞ (iral) is the number 8. Only one source gives this word; check it."
  "sat-0115":
    native: "nine"
    notes:
      "n1": "ᱟᱨᱮ (are) is the number 9. Only one source gives this word; check it."
  "sat-0116":
    native: "ten"
    notes:
      "n1": "ᱜᱮᱞ (gel) is the number 10. Only one source gives this word; check it."
  "sat-0117":
    native: "mother"
    notes:
      "n1": "ᱮᱸᱜᱟ (enga) is 'mother'."
  "sat-0118":
    native: "father"
    notes:
      "n1": "ᱟᱹᱯᱩ (āpu) is 'father'. Another source gives ᱵᱟ (ba) for 'father', so check this word."
  "sat-0119":
    native: "child"
    notes:
      "n1": "ᱦᱚᱯᱚᱱ (ho̠po̠n) is 'child'. Its plural is also ᱦᱚᱯᱚᱱ."
  "sat-0120":
    native: "man"
    notes:
      "n1": "ᱦᱮᱨᱮᱞ (herel) is an adult man."
  "sat-0121":
    native: "woman"
    notes:
      "n1": "ᱮᱨᱟ (era) is an adult woman."
  "sat-0122":
    native: "water"
    notes:
      "n1": "ᱫᱟᱜ (dak') is 'water'."
    bases:
      "ᱫᱟᱜ": "water"
  "sat-0123":
    native: "rice"
    notes:
      "n1": "ᱫᱟᱠᱟ (dakā) is rice once cooked. Another source glosses it as 'cooked rice'."
    examples:
      "ᱛᱤᱠᱤᱱ ᱫᱚ ᱫᱟᱠᱟ ᱠᱚ ᱡᱚᱢᱟ।":
        native: "Tikin ate the cooked rice."
        bases:
          "ᱛᱤᱠᱤᱱ": "Tikin (a name)"
          "ᱫᱚ": "(marks the topic: as for Tikin)"
          "ᱠᱚ": "(plural marker: they)"
          "ᱡᱚᱢᱟ": "ate"
  "sat-0124":
    native: "food"
    notes:
      "n1": "ᱡᱚᱢᱟᱜ (jo̠mak') is 'food'. It comes from ᱡᱚᱢ (jo̠m), 'to eat'."
    bases:
      "ᱡᱚᱢᱟᱜ": "food"
  "sat-0125":
    native: "bread"
    notes:
      "n1": "ᱨᱩᱴᱤ (ruṭi) is 'bread'."
  "sat-0126":
    native: "house"
    notes:
      "n1": "ᱚᱲᱟᱜ (o̠ṛak') is 'house' or 'home'."
  "sat-0127":
    native: "name"
    notes:
      "n1": "ᱧᱩᱛᱩᱢ (ñutum) is 'name'."
    bases:
      "ᱧᱩᱛᱩᱢ": "name"
  "sat-0128":
    native: "good"
    notes:
      "n1": "ᱵᱩᱜᱤ (bugi) is 'good'."
    bases:
      "ᱵᱩᱜᱤ": "good"
  "sat-0129":
    native: "big"
    notes:
      "n1": "ᱢᱟᱨᱟᱝ (maraṅ) is 'big'."
  "sat-0130":
    native: "small"
    notes:
      "n1": "ᱦᱩᱰᱤᱧ (huḍiñ) is 'small'."
  "sat-0131":
    native: "here"
    notes:
      "n1": "ᱱᱚᱛᱮ (no̠te) is 'here', on this side."
    bases:
      "ᱱᱚᱛᱮ": "here"
  "sat-0132":
    native: "there"
    notes:
      "n1": "ᱚᱱᱛᱮ (o̠nte) is 'there', on that side."
    bases:
      "ᱚᱱᱛᱮ": "there"
  "sat-0133":
    native: "who"
    notes:
      "n1": "ᱚᱠᱚᱭ (o̠ko̠y) asks 'who?'."
    bases:
      "ᱚᱠᱚᱭ": "who"
  "sat-0134":
    native: "where"
    notes:
      "n1": "ᱚᱠᱟᱨᱮ (o̠kare) asks 'where?'."
    bases:
      "ᱚᱠᱟᱨᱮ": "where"
  "sat-0135":
    native: "what"
    notes:
      "n1": "ᱪᱮᱫ (cet') asks 'what?' for a thing. Another source gives ᱳᱠᱟ (oka) for 'what?', so check this word."
    bases:
      "ᱪᱮᱫ": "what"
  "sat-0136":
    native: "hello; greetings"
    notes:
      "n1": "ᱡᱚᱦᱟᱨ (jo̠har) is a greeting, 'hello'. It is said on its own, as a whole phrase."
    bases:
      "ᱡᱚᱦᱟᱨ": "hello; greetings"
  "sat-0137":
    native: "no"
    notes:
      "n1": "ᱵᱟᱝ (baṅ) means no. It is also used as the word for not."
  "sat-0138":
    native: "tea"
    notes:
      "n1": "ᱪᱟ (ca) is tea. It is probably taken from Bengali চা (cā)."
  "sat-0139":
    native: "today"
    notes:
      "n1": "ᱛᱤᱦᱤᱧ (tihiñ) is today."
  "sat-0140":
    native: "and"
    notes:
      "n1": "ᱟᱨ (ar) joins two words or phrases: and."
  "sat-0141":
    native: "elder brother"
    notes:
      "n1": "ᱫᱟᱫᱟ (dada) is an elder brother. Santali has other words for a younger brother."
  "sat-0142":
    native: "elder sister"
    notes:
      "n1": "ᱫᱟᱹᱭ (dāy) is an elder sister."
