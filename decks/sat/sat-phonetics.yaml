schema: 1
kind: "phonetics"
id: "sat-phonetics"
language: "sat"
variety: "Standard Santali (Ol Chiki), as the course's broad ipa writes it and as Wiktionary's untagged narrow forms write it, not a regional or Mundari-influenced speech"
description: "Rules that turn a card's broad ipa into its narrow [ ] form, in order. Written for tools/derive_phonetic.py, never read by the app. Each rule applies the regular expression to the whole ipa string and replaces every match; the next rule works on the result. Only rules that are attested are here. The course's broad ipa for Santali (tools/transcribe.py santali()) writes ᱪ as tʃ and ᱡ as dʒ, a voiced stop letter ᱜ ᱫ ᱵ ᱡ at the end of a word (the checked stop) as the plain voiceless k t p tʃ, the vowel with the long mark ᱹ as aː or eː (ãː ẽː when nasal), the aspirates as ʰ and ʱ, the glottal letter ᱦ as h and the nasal vowels by a tilde. So the rules add what it does not say: the palatal stops of Santali are the stops [c ɟ], not affricates (sat-jh-palatal, sat-j-palatal, sat-c-palatal), and the long-marked vowels are [ə] and [ɛ] (sat-a-long-nasal, sat-a-long, sat-e-long-nasal, sat-e-long). Sources: Wiktionary's narrow Santali forms (kaikki.org dump of the Santali entries, read 2026-11-26: 545 narrow forms for 452 distinct headword and form pairs, all with no note and no tag), compared word by word with the 259 cards whose target is a Wiktionary headword; see tools/phonetic_languages.yaml, entry sat. A rule is here only where every Wiktionary form of the shape agrees. No Wikipedia phonology page was read for these rules. Left out, on purpose, and why: (0) the checked final stops (ᱜ ᱫ ᱵ ᱡ at the end of a word, or before the ᱼ phaarkaa or ᱽ ahad marks): Wiktionary writes them two ways, 68 forms with an ejective ʼ ([kʼ tʼ pʼ cʼ]: ᱨᱳᱜ [rokʼ], ᱮᱱᱮᱡ [enecʼ]) and 8 forms with an unreleased stop and a glottal stop ([k̚ʔ t̚ʔ]: ᱫᱟᱜ [dak̚ʔ], ᱪᱮᱫ [cet̚ʔ]), and for 6 words (ᱢᱮᱱᱟᱜ, ᱱᱤᱛᱚᱜ, ᱪᱮᱫ, ᱛᱤᱱᱟᱹᱜ, ᱦᱤᱡᱩᱜ, ᱛᱤᱧ ᱡᱷᱚᱜ) lists both; ᱦᱤᱥᱟᱹᱵ [hisəb] and ᱵᱳᱫᱽ [bod] (with the ahad mark) write a plain stop, unreleased or voiced; and, above all, the broad ipa writes the checked ᱜ and the plain ᱠ both as k (ᱞᱟᱠ [lak] against ᱞᱟᱜ), ᱫ and ᱛ both as t, ᱵ and ᱯ both as p, ᱡ and ᱪ both as tʃ, so no rule on the ipa can tell which letter a final k t p tʃ came from; the engine, which sees the letters, must write the checked stop first, and a phonetician must choose between the ejective and the unreleased form; (1) the glottal ʔ for ᱦ: ᱡᱟᱦᱟᱸ [ɟaʔã], ᱛᱟᱸᱦᱮᱱ [tãʔen], ᱟᱨᱦᱳᱸ [arʔõ], ᱨᱚᱦᱚᱲ [rɔʔɔɽ], ᱜᱟᱹᱦᱞᱟᱹ [ɡəʔlə] against ᱦᱚᱦᱚ [hɔhɔ], ᱨᱟᱦᱟ [raha], ᱵᱟᱦᱨᱮ [bahre], ᱛᱟᱦᱮᱸ [tahẽ], ᱥᱟᱦᱮᱫ [sahetʼ]: the same letter in the same positions is h in some words and ʔ in others, so the pattern is lexical and nothing is written; (2) the aspiration mark: Wiktionary writes ʰ after ᱡ (ɟʰ, five forms) but ʱ after ᱵ ᱫ ᱰ ([bʱɔrotborsɔ], [dʱiri], [ɖʱ]) and ʰ in ᱵᱷᱟᱨᱚᱛ [bʰarɔt], so only the palatal is written; (3) the broad ipa's ɛ and o̠ against Wiktionary's e and ɔ (ᱞᱟ ᱮ words: alɛ against [ale], pɛ against [pe]; mo̠ɳe against [mɔɳe], ho̠po̠n against [hɔpɔn]): the broad ipa itself writes ᱮ as both e and ɛ and ᱚ as both ɔ and o̠ (the older cards were written by hand, the engine writes e and ɔ), which is a question for the broad ipa, not a narrowing, so no rule rewrites it; (4) n before ɖ as ɳ (ᱯᱳᱱᱰ [poɳɖ], ᱵᱷᱳᱱᱰᱳ [bʱoɳɖo], two forms) against ᱜᱩᱱᱴᱷᱤ [ɡunʈʰi] (n before ʈ stays n): too few forms and one counter-example; (5) ᱣ as [w] (most forms) or [v] (ᱡᱟᱨᱣᱟ [ɟarva], and the letter-name form); (6) ᱡᱤᱻ [ɟĩ] for the broad diː (the relaa mark ᱻ, one word); (7) ᱥᱮᱛᱟ [seˈta], tie bars (ᱡᱮᱞᱮᱧ [d͡ʒeleɲ], the headword of ᱡᱟᱝ lists ɖʒ and d͡ʒ among five variants), the phrase liaison ‿ and the syllable dots of ᱥᱟᱱᱛᱟᱲᱤ: single-entry or notation choices; (8) the letter-name forms ([cʼ~ɟ], [kʼ~ɡ], [v], [ʔ]): they name a letter, not a word. A rule left out is not a claim that it does not exist. The rules ship unreviewed: a Santali phonetician should confirm that ᱪ and ᱡ are the stops [c ɟ] in the variety the course teaches (Wiktionary writes them so in 39 of the 41 words that have a ᱡ, the other two being tie-barred or a variant list, and in every ᱪ form, but one editor's convention may be behind it) and that the long-marked vowels are [ə] and [ɛ]."
rules:
  - id: "sat-jh-palatal"
    pattern: "dʒʱ"
    replace: "ɟʰ"
    source: "Wiktionary's narrow Santali forms (kaikki.org dump of the Santali entries, read 2026-11-26, no note and no tag): ᱡᱷ is [ɟʰ] in all five forms that have it (ᱡᱷᱚᱛᱚ [ɟʰɔtɔ], ᱡᱷᱚᱨᱠᱟ [ɟʰɔrka], ᱡᱷᱚᱛᱚ ᱦᱚᱲ ᱠᱚ [ɟʰɔtɔ hɔɽ kɔ], ᱡᱷᱚᱛᱚᱦᱚᱲ ᱠᱚ [ɟʰɔtɔhɔɽ kɔ], ᱛᱤᱧ ᱡᱷᱚᱜ [tiɲ ɟʰɔkʼ]); the broad ipa writes it dʒʱ (the engine's ᱡ + ᱷ). The aspiration mark ʰ is Wiktionary's, against the ʱ of the broad ipa after the other voiced stops; see note 2 in the description. First, so sat-j-palatal does not turn it into ɟʱ."
  - id: "sat-j-palatal"
    pattern: "dʒ"
    replace: "ɟ"
    source: "Wiktionary's narrow Santali forms (kaikki.org dump of the Santali entries, read 2026-11-26, no note and no tag): ᱡ is the voiced palatal stop [ɟ] in 39 words (ᱥᱟᱡᱟᱣ [saɟaw], ᱡᱚᱢ [ɟɔm], ᱡᱟᱝᱜᱟ [ɟaŋɡa], ᱟᱧᱡᱚᱢ [aɲɟɔm], ᱛᱮᱡᱳ [teɟo], ᱡᱤᱞ [ɟil]); the only other forms are ᱡᱮᱞᱮᱧ [d͡ʒeleɲ] and the five-way variant list of ᱡᱟᱝ. The broad ipa writes ᱡ as dʒ when it is not the checked final stop (the final one is written tʃ and is not touched here)."
  - id: "sat-c-palatal"
    pattern: "tʃ(?!ʰ)"
    replace: "c"
    source: "Wiktionary's narrow Santali forms (kaikki.org dump of the Santali entries, read 2026-11-26, no note and no tag): ᱪ is the voiceless palatal stop [c] in every form that has it (ᱪᱤᱱ [cin], ᱪᱮᱠᱟᱛᱮ [cekate], ᱢᱚᱪᱟ [mɔca], ᱪᱟᱸᱫᱚ [cãdɔ], ᱪᱤᱠᱟᱸᱲ [cikãɽ], ᱨᱟᱪᱟᱜ [racakʼ], ᱪᱟᱹᱢᱰᱩᱞ [cəmɖul], ᱱᱟᱹᱪᱩᱨ [nəcur], ᱪᱮᱫ [cetʼ]); no form writes tʃ, and the checked final ᱡ is also [c] (ᱮᱱᱮᱡ [enecʼ], ᱟᱡ [acʼ]), which is what the broad ipa's final tʃ stands for either way. tʃʰ is left alone (no Wiktionary form has it)."
  - id: "sat-a-long-nasal"
    pattern: "ãː|ãː"
    replace: "ə̃"
    source: "Wiktionary's narrow Santali forms (kaikki.org dump of the Santali entries, read 2026-11-26, no note and no tag): ᱟᱺ (nasal long a) is [ə̃] in ᱥᱟᱺᱜᱤᱧ [sə̃ɡiɲ] and ᱯᱷᱟᱹᱠᱲᱟᱺᱜ [pʰəkɽə̃kʼ], the only two forms with it. The broad ipa writes it ãː. Before sat-a-long, which would leave the tilde on a bare ə otherwise."
  - id: "sat-a-long"
    pattern: "aː"
    replace: "ə"
    source: "Wiktionary's narrow Santali forms (kaikki.org dump of the Santali entries, read 2026-11-26, no note and no tag): ᱟᱹ (a with the long mark) is [ə] in every form that has it but one (ᱟᱹᱠᱷᱨᱤᱧ [əkʰriɲ], ᱫᱩᱢᱠᱟᱹ [dumkə], ᱯᱩᱨᱟᱹ [purə], ᱦᱟᱹᱠᱩ [həku], ᱫᱩᱨᱟᱹᱝ [durəŋ], ᱨᱟᱹᱯᱩᱫ [rəputʼ], ᱛᱟᱹᱝᱜᱤ [təŋɡi], ᱨᱩᱠᱷᱟᱹᱲ [rukʰəɽ], ᱥᱟᱹᱨᱤ [səri], about sixty words in all); the exception is ᱦᱟᱹᱱᱤ, whose form is a bare [uni] note, not a pronunciation. The broad ipa writes it aː (74 cards); no other source of aː exists in it, since the engine writes the long mark ᱹ as ː after the vowel and a plain ᱟ as a."
  - id: "sat-e-long-nasal"
    pattern: "ẽː|ẽː"
    replace: "ɛ̃"
    source: "Wiktionary's narrow Santali forms (kaikki.org dump of the Santali entries, read 2026-11-26, no note and no tag): ᱮᱺ (nasal e with the long mark) is [ɛ̃] in all four forms that have it (ᱥᱮᱺᱜᱮᱹᱞ [sɛ̃ɡɛl], ᱥᱮᱺᱬᱟ [sɛ̃ɳa], ᱦᱮᱺᱫᱮᱹ [hɛ̃dɛ], ᱪᱮᱺᱬᱮᱹ [cɛ̃ɳɛ]). The broad ipa writes it ẽː."
  - id: "sat-e-long"
    pattern: "eː"
    replace: "ɛ"
    source: "Wiktionary's narrow Santali forms (kaikki.org dump of the Santali entries, read 2026-11-26, no note and no tag): ᱮᱹ (e with the long mark) is [ɛ] in all five forms that have it (ᱦᱮᱹᱰᱮᱹᱡ [hɛ̃ɖɛcʼ], ᱥᱮᱺᱜᱮᱹᱞ [sɛ̃ɡɛl], ᱦᱮᱺᱫᱮᱹ [hɛ̃dɛ], ᱪᱮᱺᱬᱮᱹ [cɛ̃ɳɛ]); the broad ipa writes it eː. Last: it names the plain ɛ only after the ẽː rule has run."
