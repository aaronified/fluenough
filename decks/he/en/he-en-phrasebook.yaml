schema: 1
id: "he-en-phrasebook"
kind: "layer"
core: "he-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty survival phrases to say whole from the first lesson, before their words are taught: greetings and goodbyes, sorry, not understanding, asking the way and the price, and asking for help. Written with niqqud. The readings are a simple transliteration of Modern Hebrew. Not yet checked by a Hebrew speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "he-0011":
    native: "Good night."
    notes:
      "n1": "Said at night, on going to sleep and on leaving in the evening."
    bases:
      "לַיְלָה": "night"
  "he-0012":
    native: "Goodbye."
    notes:
      "n1": "Literally: to see each other."
    bases:
      "לְהִתְרָאוֹת": "goodbye; see you (literally to see each other)"
  "he-0013":
    native: "Excuse me; sorry."
    notes:
      "n1": "Excuse me, to get attention or to get past. For a mistake, say אֲנִי מִצְטַעֵר (ani mitstaér)."
    bases:
      "סְלִיחָה": "excuse; forgiveness"
  "he-0014":
    native: "I'm sorry (said by a man)."
    notes:
      "n1": "A woman says מִצְטַעֶרֶת (mitstaéret)."
    bases:
      "מִצְטַעֵר": "to be sorry"
  "he-0015":
    native: "I don't understand (said by a man)."
    notes:
      "n1": "A woman says אֲנִי לֹא מְבִינָה (ani lo mevína)."
    bases:
      "מֵבִין": "to understand"
  "he-0016":
    native: "I don't speak Hebrew (said by a man)."
    notes:
      "n1": "The present tense is מְדַבֵּר (medabér). The past is דִּבַּרְתִּי (dibártí), I spoke."
    bases:
      "מְדַבֵּר": "to speak"
      "עִבְרִית": "Hebrew (language)"
  "he-0017":
    native: "Do you speak English? (to a man)"
    notes:
      "n1": "To a woman, say אַתְּ מְדַבֶּרֶת (at medabéret)."
    bases:
      "מְדַבֵּר": "to speak"
      "אַנְגְּלִית": "English (language)"
  "he-0018":
    native: "How are you? (to a man)"
    notes:
      "n1": "To a woman: מָה שְׁלוֹמֵךְ? (ma shlomékh)."
    bases:
      "מָה": "what"
      "שְׁלוֹמְךָ": "peace; hello"
  "he-0019":
    native: "Please speak slowly. (to a man)"
    notes:
      "n1": "Slowly is לְאַט (leát). To a woman, say תְּדַבְּרִי לְאַט (tedabrí leát)."
    bases:
      "תְּדַבֵּר": "to speak"
      "לְאַט": "slowly"
  "he-0020":
    native: "Once more, please."
    notes:
      "n1": "Literally: another time, please."
    bases:
      "עוֹד": "again; more; still"
      "פַּעַם": "time; occasion"
  "he-0021":
    native: "How much does this cost?"
    notes:
      "n1": "Literally: how much does this come to."
    bases:
      "כַּמָּה": "how much"
      "זֶה": "this"
      "עוֹלֶה": "to cost; to go up"
  "he-0022":
    native: "The bill, please."
    notes:
      "n1": "Cheshbón is the bill, and also an account."
    bases:
      "הַחֶשְׁבּוֹן": "bill; account"
  "he-0023":
    native: "Help!"
    notes:
      "n1": "A cry for help."
    bases:
      "עֶזְרָה": "help"
  "he-0024":
    native: "Where is the station?"
    notes:
      "n1": "Tachaná is a station or a bus stop. Put another place in for it."
    bases:
      "אֵיפֹה": "where"
      "הַתַּחֲנָה": "station; stop"
  "he-0025":
    native: "What does that mean?"
    notes:
      "n1": "אוֹמֵר (omér) is the verb to say, and to mean."
    bases:
      "מָה": "what"
      "זֶה": "this"
      "אוֹמֵר": "to say; to mean"
  "he-0026":
    native: "My name is Anna."
    notes:
      "n1": "Literally: my name, Anna. Put any name after שְׁמִי (shmi)."
    bases:
      "שְׁמִי": "name"
      "אַנָּה": "Anna (a first name)"
  "he-0027":
    native: "Nice to meet you."
    notes:
      "n1": "Literally: pleasant to get to know."
    bases:
      "נָעִים": "pleasant; nice"
      "לְהַכִּיר": "to get to know"
  "he-0028":
    native: "Where are you from? (to a man)"
    notes:
      "n1": "To a woman: מֵאֵיפֹה אַתְּ? (meeifó at?)."
    bases:
      "מֵאֵיפֹה": "from where"
  "he-0029":
    native: "It's all right; OK."
    notes:
      "n1": "Literally: in order."
    bases:
      "בְּסֵדֶר": "order"
  "he-0030":
    native: "Enjoy your meal!"
    notes:
      "n1": "Literally: in appetite."
    bases:
      "בְּתֵאָבוֹן": "appetite"
