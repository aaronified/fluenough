    level: "B1"
    briefing: { en: "A serious novel about a mother, Sujata, whose son Brati was killed in the Naxalite movement of the 1970s. His body in the morgue was number 1084. The story follows her day on the eve of his death anniversary, as she remembers him and learns who he was. It was made into a Hindi film in 1998 by Govind Nihalani." }
    questions:
      - { id: "q1", prompt: { en: "What is the name of the mother in the story?" }, options: { en: ["Sujata", "Nandini", "Dibyanath"] }, answer: 1 }
      - { id: "q2", prompt: { en: "When does the story begin?" }, options: { en: ["On Brati's birthday", "On the eve of Brati's death anniversary", "On the day of a school exam"] }, answer: 2 }
      - { id: "q3", prompt: { en: "Who is Brati's girlfriend?" }, options: { en: ["Sujata", "Durga", "Nandini"] }, answer: 3 }
    tags: ["unreviewed"]
  - id: "bn-rec-ganadevata"
    medium: "book"
    script: "bengali"
    title: { text: "গণদেবতা", reading: "gônodebotā" }
    creator: ["bn-tarashankar-bandyopadhyay"]
    year: 1942
    level: "B1"
    briefing: { en: "A village novel set in Shibkalipur in rural Bengal. It shows how craftsmen, farmers and a rich landowner live together and quarrel, and how a young man tries to organise the village against poverty. The writer won India's Jnanpith Award for it in 1966. The language is rich, so it suits a patient reader." }
    questions:
      - { id: "q1", prompt: { en: "Who is the only blacksmith of the village?" }, options: { en: ["Aniruddha Karmakar", "Girish Sutradhar", "Srihari Pal"] }, answer: 1 }
      - { id: "q2", prompt: { en: "Which river do the blacksmith and the carpenter cross to open their shops in the city?" }, options: { en: ["The Padma", "The Mayurakshi", "The Hooghly"] }, answer: 2 }
      - { id: "q3", prompt: { en: "Who goes to jail for beating a survey official?" }, options: { en: ["Jatin", "Srihari Pal", "Debu Ghosh"] }, answer: 3 }
    tags: ["unreviewed"]
  - id: "bn-rec-himu"
    medium: "book"
    script: "bengali"
    title: { text: "হিমু", reading: "himu" }
    creator: ["bn-humayun-ahmed"]
    year: 1990
    level: "A2"
    briefing: { en: "Himu is a popular character who appears in a series of about twenty novels, beginning with Mayurakkhi in 1990. He is a wandering young man in Dhaka who owns almost nothing and walks the city at night. The books are short and easy to read, and they are loved by many young readers in Bangladesh." }
    questions:
      - { id: "q1", prompt: { en: "What colour is the panjabi Himu always wears?" }, options: { en: ["Yellow", "White", "Blue"] }, answer: 1 }
      - { id: "q2", prompt: { en: "What is unusual about his panjabi?" }, options: { en: ["It has no buttons", "It has no pocket", "It has no sleeves"] }, answer: 2 }
      - { id: "q3", prompt: { en: "Who gave him a Kashmiri shawl for winter?" }, options: { en: ["His cousin Badal", "His aunt", "His girlfriend Rupa"] }, answer: 3 }
    tags: ["unreviewed"]
  - id: "bn-rec-jai-baba-felunath"
    medium: "book"
    script: "bengali"
    title: { text: "জয় বাবা ফেলুনাথ", reading: "jôy bābā felunāth" }
    creator: ["bn-satyajit-ray"]
    year: 1975
    level: "A2"
    briefing: { en: "A Feluda detective story by Satyajit Ray. Feluda, his cousin Topshe and the writer Jatayu travel to Varanasi at the time of Durga Puja. A family asks them to find who is trying to steal a small golden statue. The plot is clear and fast, so it is a good first novel for a learner." }
    questions:
      - { id: "q1", prompt: { en: "Which city do the three friends visit?" }, options: { en: ["Varanasi", "Darjeeling", "Puri"] }, answer: 1 }
      - { id: "q2", prompt: { en: "What do thieves want to steal from the Ghosal family?" }, options: { en: ["A diamond ring", "A golden Ganesh statue", "A painting"] }, answer: 2 }
      - { id: "q3", prompt: { en: "Where had the statue been hidden?" }, options: { en: ["In a bank locker", "Under a bed", "Inside the lion of the Durga idol"] }, answer: 3 }
    tags: ["unreviewed"]
  - id: "bn-rec-nonte-phonte"
    medium: "comic"
    title: { text: "নন্টে ফন্টে", reading: "nônṭe phônṭe" }
    creator: ["bn-narayan-debnath"]
    year: 1969
    level: "A2"
    briefing: { en: "A funny comic strip about two schoolboys, Nonte and Phonte, who live in a school hostel in a small town in West Bengal. They love food and play tricks on the greedy hostel superintendent. Narayan Debnath drew it for the children's magazine Kishore Bharati, and it was also made into a cartoon series." }
    questions:
      - { id: "q1", prompt: { en: "Which older student has failed his class six times?" }, options: { en: ["Keltu", "Thakur", "Panga"] }, answer: 1 }
      - { id: "q2", prompt: { en: "What does the servant Thakur like to do?" }, options: { en: ["Sing in the bath", "Dance to the radio", "Play cricket"] }, answer: 2 }
      - { id: "q3", prompt: { en: "What do the two boys often love and hide?" }, options: { en: ["Comic books", "Letters", "Snacks"] }, answer: 3 }
    tags: ["unreviewed"]
