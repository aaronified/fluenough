      - { id: "q3", prompt: { en: "Who directed the music of the programme?" }, options: { en: ["Bani Kumar", "Birendra Krishna Bhadra", "Pankaj Kumar Mallik"] }, answer: 3 }
    tags: ["unreviewed"]
