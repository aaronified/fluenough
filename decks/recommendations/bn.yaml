      - { id: "q3", prompt: { en: "Who composed the music of the programme?" }, options: { en: ["Bani Kumar", "Pankaj Kumar Mallik", "Birendra Krishna Bhadra"] }, answer: 2 }
    tags: ["unreviewed"]
