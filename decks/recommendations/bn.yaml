    year: 1994
    level: "A2"
    briefing: { en: "A famous patriotic song by Pratul Mukhopadhyay, who is its poet, composer and singer. The title means I sing in Bengali. It is a good song for a learner because the title is simple. Many singers have made new versions of it since." }
    questions:
      - { id: "q1", prompt: { en: "Where did BBC Bangla place the song in its list of the greatest Bengali songs?" }, options: { en: ["First", "Tenth", "Sixth"] }, answer: 3 }
      - { id: "q2", prompt: { en: "In which action film, starring Jeet, is the song sung?" }, options: { en: ["Autograph", "Kranti", "Chokher Bali"] }, answer: 2 }
      - { id: "q3", prompt: { en: "Which popular artist of Bangladesh sang it after Pratul Mukhopadhyay?" }, options: { en: ["Mahmuduzzaman Babu", "Anupam Roy", "Iman Chakraborty"] }, answer: 1 }
    tags: ["unreviewed"]
  - id: "bn-rec-mahishasuramardini"
    medium: "podcast"
    title: { text: "মহিষাসুরমর্দিনী", reading: "mohiśāsuromordini" }
