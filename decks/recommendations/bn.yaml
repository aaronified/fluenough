    briefing: { en: "A radio programme of Sanskrit verses and songs about the goddess Durga and her fight with the demon Mahishasura. It is broadcast on Mahalaya, the day that begins the Durga Puja season, and many Bengali families wake up to listen. It has been aired since 1931." }
