# Popular works of Bengal and Bangladesh that are not in the public domain: the learner finds them (a library, a shop, a service) and the app asks
# the questions after the learner has marked the work as seen, read or heard. Nothing of a work is quoted (wiki/Plan-Language-Completeness.md,
# "Source-it-yourself works"). No links are given: no link has been checked. Years and creators were read on the English Wikipedia page of each work.
schema: 1
kind: "recommendations"
id: "recommendations-bn"
language: "bn"
license: "CC-BY-SA-4.0"
recommendations:
  - id: "bn-rec-pather-panchali"
    medium: "film"
    title: { text: "পথের পাঁচালী", reading: "pôther pām̐cāli" }
    creator: ["bn-satyajit-ray"]
    year: 1955
    level: "B1"
    briefing: { en: "Satyajit Ray's first film, about a poor family in a Bengali village in the late 1910s. It follows a brother and sister, Apu and Durga, as the family struggles to get by. A panchali (\u09aa\u09be\u0981\u099a\u09be\u09b2\u09c0, p\u0101m\u0310c\u0101li) is a kind of Bengali narrative folk song. The film is the first of the Apu Trilogy and one of the best-known Indian films abroad." }
    questions:
      - { id: "q1", prompt: { en: "Which old relative lives with the family and often takes food from the kitchen?" }, options: { en: ["Indir, an elderly cousin", "Apu's grandmother", "A neighbour's mother"] }, answer: 1 }
      - { id: "q2", prompt: { en: "What sound do Apu and Durga stop to listen for in the evening?" }, options: { en: ["A temple bell", "A train whistle", "A fisherman's song"] }, answer: 2 }
      - { id: "q3", prompt: { en: "What does Apu do with the necklace he finds as the family packs to leave?" }, options: { en: ["He gives it to his mother", "He buries it under a tree", "He throws it into a pond"] }, answer: 3 }
    tags: ["unreviewed"]
  - id: "bn-rec-charulata"
    medium: "film"
    title: { text: "চারুলতা", reading: "cārulotā" }
    creator: ["bn-satyajit-ray"]
    year: 1964
    level: "B1"
    briefing: { en: "A quiet drama set in Calcutta in 1879 about Charulata, a clever and lonely wife whose husband is busy with his newspaper. A young cousin comes to stay and encourages her to write. The film is based on a novella by Rabindranath Tagore and is often called one of Ray's finest." }
    questions:
      - { id: "q1", prompt: { en: "What does Charu's husband Bhupati publish?" }, options: { en: ["A small political newspaper", "A magazine of poems", "A school textbook"] }, answer: 1 }
      - { id: "q2", prompt: { en: "Who encourages Charu to write?" }, options: { en: ["Her brother Umapada", "Bhupati's younger cousin Amal", "Bhupati's friend Nishikanta"] }, answer: 2 }
      - { id: "q3", prompt: { en: "What does Charu's brother Umapada do that breaks Bhupati's trust?" }, options: { en: ["He sells the printing press", "He writes against Bhupati in another paper", "He takes money from the safe and runs away"] }, answer: 3 }
    tags: ["unreviewed"]
  - id: "bn-rec-sonar-kella"
    medium: "film"
    title: { text: "সোনার কেল্লা", reading: "śonār kellā" }
    creator: ["bn-satyajit-ray"]
    year: 1974
    level: "A2"
    briefing: { en: "A detective adventure based on Ray's own novel. The detective Feluda travels to Rajasthan to protect a boy who says he remembers a golden fort from a past life. It is a good first film for learners because the story is easy to follow." }
    questions:
      - { id: "q1", prompt: { en: "Which detective is hired to protect the boy Mukul?" }, options: { en: ["Feluda", "Byomkesh", "Jatayu"] }, answer: 1 }
      - { id: "q2", prompt: { en: "What does the boy Mukul say he remembers?" }, options: { en: ["The future", "A life before this one", "A foreign language"] }, answer: 2 }
      - { id: "q3", prompt: { en: "In which city is the golden fort that the characters finally reach?" }, options: { en: ["Jaipur", "Jodhpur", "Jaisalmer"] }, answer: 3 }
    tags: ["unreviewed"]
  - id: "bn-rec-goopy-gyne-bagha-byne"
    medium: "film"
    title: { text: "গুপী গাইন বাঘা বাইন", reading: "gupi gāin bāghā bāin" }
    creator: ["bn-satyajit-ray"]
    year: 1969
    level: "A2"
    briefing: { en: "A musical fantasy about a bad singer and a bad drummer who are sent away from their villages and meet in a forest. Ghosts give them magic gifts, and they use music to stop a war between two kingdoms. Ray wrote the songs himself, and the film has stayed popular with children and adults." }
    questions:
      - { id: "q1", prompt: { en: "Why is Goopy driven out of his village?" }, options: { en: ["He stole from the king", "He sang badly outside the king's window", "He refused to pay a tax"] }, answer: 2 }
      - { id: "q2", prompt: { en: "What do the king of the ghosts give the two friends?" }, options: { en: ["Three wishes that work only when they are together", "A magic flute", "A bag of gold"] }, answer: 1 }
      - { id: "q3", prompt: { en: "How do the two friends stop the army of Halla from attacking?" }, options: { en: ["They fight with swords", "They hide in the forest", "They sing and drum so that the soldiers cannot move"] }, answer: 3 }
    tags: ["unreviewed"]
  - id: "bn-rec-meghe-dhaka-tara"
    medium: "film"
    title: { text: "মেঘে ঢাকা তারা", reading: "meghe ḍhākā tārā" }
    creator: ["bn-ritwik-ghatak"]
    year: 1960
    level: "B1"
    briefing: { en: "A sad black-and-white drama about Nita, a young woman in a refugee family on the edge of Calcutta after the Partition. She works to keep her family going while everyone takes her kindness for granted. It is the first film of Ghatak's Partition trilogy and is often shown at festivals around the world." }
    questions:
      - { id: "q1", prompt: { en: "What illness does Nita get?" }, options: { en: ["Tuberculosis", "Cholera", "Malaria"] }, answer: 1 }
      - { id: "q2", prompt: { en: "What does Nita's elder brother Shankar want to become?" }, options: { en: ["A doctor", "A singer", "A teacher"] }, answer: 2 }
      - { id: "q3", prompt: { en: "Whom does Nita's lover Sanat leave her for?" }, options: { en: ["A rich neighbour", "A friend from work", "Her sister Geeta"] }, answer: 3 }
    tags: ["unreviewed"]
  - id: "bn-rec-jalsaghar"
    medium: "film"
    title: { text: "জলসাঘর", reading: "jôlśāghor" }
    creator: ["bn-satyajit-ray"]
    year: 1958
    level: "B1"
    briefing: { en: "A drama about Biswambhar Roy, a zamindar (\u099c\u09ae\u09bf\u09a6\u09be\u09b0, jomid\u0101r, a landowner of the old order) whose fortune is falling. He spends what is left on concerts in his music room, to show that he is still above his rich new neighbour. It is one of Ray's films with the most Indian classical music and dance." }
    questions:
      - { id: "q1", prompt: { en: "Who is Biswambhar's rival neighbour?" }, options: { en: ["Mahim Ganguly, who has newly become rich", "A young musician", "His own steward"] }, answer: 1 }
      - { id: "q2", prompt: { en: "What happened to Biswambhar's wife and son?" }, options: { en: ["They left him for the city", "They were killed when their boat was caught in a cyclone", "They moved abroad"] }, answer: 2 }
      - { id: "q3", prompt: { en: "How does the film end?" }, options: { en: ["He sells the palace", "He leaves for Calcutta by train", "He rides his white horse and is thrown and killed"] }, answer: 3 }
    tags: ["unreviewed"]
  - id: "bn-rec-matir-moina"
    medium: "film"
    title: { text: "মাটির ময়না", reading: "māṭir môynā" }
    creator: ["bn-tareque-masud"]
    year: 2002
    level: "B1"
    briefing: { en: "A film set in East Pakistan in the late 1960s, before the Liberation War of Bangladesh. A boy, Anu, is sent by his strict father to a madrasa (an Islamic school), while the country around him is changing. The director based it on his own childhood. It was Bangladesh's first submission for the Academy Award for Best Foreign Language Film." }
    questions:
      - { id: "q1", prompt: { en: "Where does Anu's father send him to study?" }, options: { en: ["To a madrasa", "To a boarding school in Dhaka", "To a relative's farm"] }, answer: 1 }
      - { id: "q2", prompt: { en: "What game does Anu play with his friend Rokon?" }, options: { en: ["Marbles", "Catch with an imaginary ball", "Kite flying"] }, answer: 2 }
      - { id: "q3", prompt: { en: "Why does Anu's little sister Asma die?" }, options: { en: ["She is lost in a flood", "She is hurt in a riot", "Her father refuses modern medicine"] }, answer: 3 }
    tags: ["unreviewed"]
  - id: "bn-rec-autograph"
    medium: "film"
    title: { text: "অটোগ্রাফ", reading: "ôṭogrāf" }
    creator: ["bn-srijit-mukherji"]
    year: 2010
    level: "B1"
    briefing: { en: "A musical drama about a young director who wants to remake Ray's film Nayak and asks a famous film star to act in it. The film is a tribute to the actor Uttam Kumar. It was the director's first film, and it was both a critical and a commercial success." }
    questions:
      - { id: "q1", prompt: { en: "Which older film does the young director want to remake?" }, options: { en: ["Nayak", "Charulata", "Jalsaghar"] }, answer: 1 }
      - { id: "q2", prompt: { en: "What is the name of the film star who agrees to pay for the project?" }, options: { en: ["Arun Chatterjee", "Uttam Kumar", "Shuvobrata"] }, answer: 1 }
      - { id: "q3", prompt: { en: "What does the director do with the secretly recorded conversation?" }, options: { en: ["He deletes it", "He gives it to the press", "He shows it to the star"] }, answer: 2 }
    tags: ["unreviewed"]
  - id: "bn-rec-chokher-bali"
    medium: "film"
    title: { text: "চোখের বালি", reading: "cokher bāli" }
    creator: ["bn-rituparno-ghosh"]
    year: 2003
    level: "B1"
    briefing: { en: "A period drama based on a Tagore novel of 1903, set in Kolkata in the early twentieth century. A young widow, Binodini, moves into a family's house and changes the lives of everyone in it. The title is a nickname that means a grain of sand in the eye, and it also means an eyesore." }
    questions:
      - { id: "q1", prompt: { en: "What happens to Binodini's husband?" }, options: { en: ["He dies the day after the wedding", "He goes abroad", "He leaves her for another woman"] }, answer: 1 }
      - { id: "q2", prompt: { en: "Which two women call each other Chokher Bali?" }, options: { en: ["Binodini and Ashalata", "Binodini and Rajalakshmi", "Ashalata and Rajalakshmi"] }, answer: 1 }
      - { id: "q3", prompt: { en: "What does Binodini do on the day she is to marry Behari?" }, options: { en: ["She marries someone else", "She disappears and leaves letters", "She asks Mahendra to stop it"] }, answer: 2 }
    tags: ["unreviewed"]
  - id: "bn-rec-apur-sansar"
    medium: "film"
    title: { text: "অপুর সংসার", reading: "ôpur śôṅśār" }
    creator: ["bn-satyajit-ray"]
    year: 1959
    level: "B1"
    briefing: { en: "The last film of the Apu Trilogy. Apu is a young graduate in Calcutta who wants to be a writer. A friend takes him to a village wedding, and his life takes a turn that he did not plan. It stars Soumitra Chatterjee in his first film role." }
    questions:
      - { id: "q1", prompt: { en: "Why is the first wedding at the village cancelled?" }, options: { en: ["The bride runs away", "The groom has a serious mental disorder", "The family cannot pay"] }, answer: 2 }
      - { id: "q2", prompt: { en: "What does Apu do with the manuscript of his novel?" }, options: { en: ["He publishes it", "He gives it to a friend", "He throws it away"] }, answer: 3 }
      - { id: "q3", prompt: { en: "Where does Pulu find Apu working years later?" }, options: { en: ["At a coal mine", "On a ship", "In a school"] }, answer: 1 }
    tags: ["unreviewed"]
  - id: "bn-rec-debi"
    medium: "book"
    script: "bengali"
    title: { text: "দেবী", reading: "debi" }
    creator: ["bn-humayun-ahmed"]
    year: 1985
    level: "B1"
    briefing: { en: "A short mystery novel from Bangladesh. A young wife, Ranu, seems to know things she should not know, and her husband tries to explain it with logic. It is the book that introduced the character Misir Ali, a university lecturer who solves puzzles by reasoning. It is a quick read with an eerie ending." }
    questions:
      - { id: "q1", prompt: { en: "What is the work of Ranu's husband Anis?" }, options: { en: ["He is a school teacher", "He is a duty officer at a hotel", "He is a doctor"] }, answer: 2 }
      - { id: "q2", prompt: { en: "What did Ranu find holding her leg when she was bathing in a river as a child?" }, options: { en: ["A fishing net", "A snake", "A dead body"] }, answer: 3 }
      - { id: "q3", prompt: { en: "What does Misir Ali notice about Neelu at the end?" }, options: { en: ["Her looks and manner begin to resemble Ranu's", "She forgets everything that happened", "She leaves the country"] }, answer: 1 }
    tags: ["unreviewed"]
  - id: "bn-rec-padma-nadir-majhi"
    medium: "book"
    script: "bengali"
    title: { text: "পদ্মা নদীর মাঝি", reading: "pôddā nodir mājhi" }
    creator: ["bn-manik-bandyopadhyay"]
    year: 1936
    level: "B1"
    briefing: { en: "A novel about poor fishermen on the Padma river in Bengal. It follows a fisherman called Kuber and the trader Hossain Miya, who promises a new life on a distant island. It was made into a well-known film in 1993 by Goutam Ghose, so a learner can compare the book with the screen version." }
    questions:
      - { id: "q1", prompt: { en: "What is Kuber's work?" }, options: { en: ["He is a fisherman", "He is a farmer", "He is a boat builder"] }, answer: 1 }
      - { id: "q2", prompt: { en: "Who offers the villagers a new settlement on an island?" }, options: { en: ["Rasu", "Hossain Miya", "Aminuddin"] }, answer: 2 }
      - { id: "q3", prompt: { en: "What is the name of the island Kuber goes to at the end?" }, options: { en: ["Sandwip", "Bhola", "Moynadeep"] }, answer: 3 }
    tags: ["unreviewed"]
  - id: "bn-rec-hajar-churashir-maa"
    medium: "book"
    script: "bengali"
