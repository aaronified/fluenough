    level: "B1"
    briefing: { en: "A 1961 historical film, directed by B. R. Panthulu, about Kittur Chennamma, a ruler in the Karnataka region who led an armed uprising against the British East India Company. The film is based on a play by A. N. Krishna Rao." }
