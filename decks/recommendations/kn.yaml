# Popular works of Karnataka in Kannada, recommended for the learner to find (some are in the public domain): the learner finds them (a library, a shop, a service) and the app asks
# the questions after the learner has marked the work as seen, read or heard. Nothing of a work is quoted (wiki/Plan-Language-Completeness.md,
# "Source-it-yourself works"). No links are given: no link has been checked. Briefings and questions use only what the page named in the creators file or the work's own
# Wikipedia article says (read 2026-11-15). Levels are defaults (B1) until a reviewer sets them. Not reviewed by a Kannada speaker (docs/review-queue/kn.md).
schema: 1
kind: "recommendations"
id: "recommendations-kn"
language: "kn"
license: "CC-BY-SA-4.0"
recommendations:
  - id: "kn-rec-samskara"
    medium: "film"
    title: { text: "ಸಂಸ್ಕಾರ", reading: "samskāra" }
    creator: ["kn-pattabhirama-reddy", "kn-u-r-ananthamurthy"]
    year: 1970
    level: "B1"
    briefing: { en: "A 1970 film, directed by Pattabhirama Reddy and based on U. R. Ananthamurthy's novel. A respected Brahmin priest in a rural village faces a crisis when a rebellious man who broke the community's customs dies and no one will cremate the body." }
    questions:
      - { id: "q1", prompt: { en: "What do Narayanappa and his friends do that turns the Brahmins of the village against him?" }, options: { en: ["They refuse to attend the temple festival", "They catch the sacred fish in the temple tank and eat them", "They burn the village's holy books"] }, answer: 2 }
      - { id: "q2", prompt: { en: "Who cremates Narayanappa's body in secret?" }, options: { en: ["Praneshacharya", "Chandri", "Narayanappa's friends"] }, answer: 2 }
      - { id: "q3", prompt: { en: "Where does Praneshacharya find himself when he wakes in the middle of the night?" }, options: { en: ["Lying in the temple courtyard", "On the road to Shimoga", "Lying in Chandri's lap"] }, answer: 3 }
    tags: ["unreviewed"]
