# Popular works of Karnataka in Kannada, recommended for the learner to find (some are in the public domain): the learner finds them (a library, a shop, a service) and the app asks
# the questions after the learner has marked the work as seen, read or heard. Nothing of a work is quoted (wiki/Plan-Language-Completeness.md,
# "Source-it-yourself works"). No links are given: no link has been checked. Briefings and questions use only what the page named in the creators file or the work's own
# Wikipedia article says (read 2026-11-15). Levels are defaults (B1) until a reviewer sets them. Not reviewed by a Kannada speaker (docs/review-queue/kn.md).
# Wave 3 (2026-11-16): Bhootayyana Maga Ayyu, Sharapanjara and Gejje Pooje added from their en Wikipedia articles (plots) and the creators' en Wikipedia pages (lifespans), read 2026-11-16; the list is 20.
# Wave 2 (2026-11-16): works added from en and kn Wikipedia and, for Marali Mannige, the 1959 Bengali translation scanned in the Digital Library of India (archive.org in.ernet.dli.2015.457745) and the Kuvempu University M.Phil. thesis archive.org kuh.mphil.585.pay.130221, which dates the writing to 1941 and names the village Kodi. Bedara Kannappa, Kittur Chennamma and Sandhya Raga (films) were dropped: no readable plot source (wiki/Deck-Work-Queue-KN.md section 7).
