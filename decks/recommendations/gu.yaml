# Popular works of Gujarati, recommended for the learner to find (some are in the public domain): the learner finds them (a library, a shop, a service) and the app asks
# the questions after the learner has marked the work as seen, read or heard. Nothing of a work is quoted (wiki/Plan-Language-Completeness.md,
# "Source-it-yourself works"). No links are given: no link has been checked.
# Years and creators were read on each work's en.wikipedia page (2026-11-18). Dropped works, with reasons, are in the builder's report.
# Review: the Gujarati title script of Mulu Manek (મૂળુ માણેક) is not on the work's page (not confirmed); check before a learner sees it.
