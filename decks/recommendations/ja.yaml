      - { id: "q1", prompt: { en: "What happens to the girl's parents after they eat the food in the empty town?" }, options: { en: ["They are turned into pigs", "They fall asleep for a hundred years", "They disappear into the sea"] }, answer: 1 }
      - { id: "q2", prompt: { en: "What new name does the bathhouse owner give the girl?" }, options: { en: ["Sen", "Haku", "Yuna"] }, answer: 1 }
      - { id: "q3", prompt: { en: "What kind of place does the girl work in?" }, options: { en: ["A bathhouse for spirits", "A train station", "A school"] }, answer: 1 }
