    medium: "film"
    title: { text: "せんとちひろのかみかくし", reading: "sen to chihiro no kamikakushi" }
    creator: ["ja-miyazaki-hayao"]
    year: 2001
    level: "A2"
    briefing: { en: "An animated film about a ten-year-old girl whose family stops at a strange town. It turns out to be a place for spirits, and she must work in a bathhouse to save her parents. It is one of the best-known Japanese films abroad." }
    questions:
      - { id: "q1", prompt: { en: "What happens to the girl's parents after they eat the food in the empty town?" }, options: { en: ["They fall asleep for a hundred years", "They are turned into pigs", "They disappear into the sea"] }, answer: 2 }
      - { id: "q2", prompt: { en: "What new name does the bathhouse owner give the girl?" }, options: { en: ["Haku", "Yuna", "Sen"] }, answer: 3 }
      - { id: "q3", prompt: { en: "Who is the boy who helps the girl and turns out to be a river spirit?" }, options: { en: ["Haku", "Kamaji", "Boh"] }, answer: 1 }
