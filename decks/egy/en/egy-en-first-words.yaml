"cards":
  "egy-0001":
    "native": "lord; master"
    "notes":
      "n1": "Nb, lord, as in nb tꜣwy, lord of the Two Lands, a royal title. The reading is the teaching vocalisation, not a reconstruction."
  "egy-0002":
    "native": "god"
    "notes":
      "n1": "Nṯr, god: the word for a god, and for the king's divinity. The reading is the teaching vocalisation."
  "egy-0003":
    "native": "good; beautiful"
    "notes":
      "n1": "Nfr, good or beautiful: the word of the most common stela epithets. The reading is the teaching vocalisation."
  "egy-0004":
    "native": "life"
    "notes":
      "n1": "Ꜥnḫ, life, as in ꜥnḫ wḏꜣ snb, life, prosperity, health. The reading is the teaching vocalisation."
  "egy-0005":
    "native": "house"
    "notes":
      "n1": "Pr, house, a masculine noun. The reading is the teaching vocalisation."
  "egy-0006":
    "native": "great; big"
    "notes":
      "n1": "Wr, great or big. The phrase nṯr ꜥꜣ, great god, uses the other word for great, ꜥꜣ. The reading is the teaching vocalisation."
  "egy-0007":
    "native": "water"
    "notes":
      "n1": "Mw, water. The gender is taken as masculine in the standard grammars; a scholar checks it. The reading is the teaching vocalisation."
  "egy-0008":
    "native": "not"
    "notes":
      "n1": "N, the negative particle before a verb in its common uses. It is one consonant, so its reading is the same letter."
  "egy-0009":
    "native": "peace; offering"
    "notes":
      "n1": "Ḥtp, peace or offering: the word of the offering formula, ḥtp-dj-nswt. The reading is the teaching vocalisation."
  "egy-0010":
    "native": "to say"
    "notes":
      "n1": "Ḏd, to say. The reading is the teaching vocalisation; the form in the phrase ḏd mdw is the same root."
