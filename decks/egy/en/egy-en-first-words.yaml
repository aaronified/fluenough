  "iso639_3": "eng"
  "name": "English"
"name": "First words"
"description": "34 words of Middle Egyptian, the language of the Middle Kingdom, about 2000 to 1650 BCE, written in hieroglyphs. Each target is the word's usual spelling, taken from the headword of its Wiktionary entry, written as a plain row of signs (the scribes grouped them in squares). The reading is the Egyptological transliteration; the IPA is Wiktionary's Middle Egyptian reconstruction, left out where the entry gives none. Every gloss and sign is from the entry named in its note. Not yet checked by an Egyptologist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "egy-0001":
    "native": "to; for"
    "notes":
      "n1": "N (n), the preposition to, for (the dative). Wiktionary, n. The headword is the ripple sign alone (N35); the entry also lists the senses in the direction of, towards and because of. Not the genitival adjective nj, of."
  "egy-0002":
    "native": "water"
    "notes":
      "n1": "Mw, water. Wiktionary, mw (also the Egyptian Swadesh list, item 150): water as a substance, and a body of water, sea, lake or river, and rain. The headword is written with the three-ripples sign N35A."
  "egy-0003":
    "native": "house"
    "notes":
      "n1": "Pr, house (masculine). Wiktionary, pr: house, the household, property, and for gods a temple. The headword is the house sign O1 with a stroke."
  "egy-0004":
    "native": "bread"
    "notes":
      "n1": "T, bread (masculine). Wiktionary, t: bread; the same spelling also writes the pronoun t, you. The sign X2 is the bread loaf; Wiktionary's headword also adds more signs. Wiktionary gives no pronunciation for this entry."
  "egy-0005":
    "native": "to live; life"
    "notes":
      "n1": "Ꜥnḫ, to live, to be alive (an intransitive verb; the same spelling is the noun life). Wiktionary, ꜥnḫ. Its headword is the ankh sign S34 with the n and ḫ signs; the ankh alone also writes the word in the greeting ꜥnḫ wḏꜣ snb."
  "egy-0006":
    "native": "sun; day"
    "notes":
      "n1": "Rꜥ, the sun, and in fixed expressions day; also the god Ra. Wiktionary, rꜥ (the sun disc N5 with r and ꜥ)."
  "egy-0007":
    "native": "mouth"
    "notes":
      "n1": "R, mouth (of a person or animal; masculine). Wiktionary, r: mouth, utterance, spell. The headword is the mouth sign D21 with a stroke. The same letters r also write the preposition r, to."
  "egy-0008":
    "native": "man (male person)"
    "notes":
      "n1": "Z, man, a male person (masculine), also someone, anyone. Wiktionary, z (also the Egyptian Swadesh list, item 37). Its headword is the bolt sign O34 with the seated-man sign A1 and a stroke; the bolt alone is the word z, door bolt."
  "egy-0009":
    "native": "one; alone"
    "notes":
      "n1": "Wꜥ, one (the cardinal number), also alone, unique. Wiktionary, wꜥ (Swadesh list, item 22). The headword writes the harpoon sign T21 with ꜥ and a stroke. Wiktionary gives its pronunciation with an unknown vowel, so no IPA is given here."
  "egy-0010":
    "native": "two"
    "notes":
      "n1": "Snwj, two. Wiktionary, snwj (Swadesh list, item 23); written as two strokes, as the entry's headword."
  "egy-0011":
    "native": "three"
    "notes":
      "n1": "Ḫmtw, three. Wiktionary, ḫmtw (Swadesh list, item 24); written as three strokes."
  "egy-0012":
    "native": "four"
    "notes":
      "n1": "Jfdw, four. Wiktionary, jfdw (Swadesh list, item 25); written as four strokes."
  "egy-0013":
    "native": "five"
    "notes":
      "n1": "Djw, five. Wiktionary, djw (Swadesh list, item 26); written as five strokes (the headword stacks two over three)."
  "egy-0014":
    "native": "land; country"
    "notes":
      "n1": "Tꜣ, land, realm, country, also the ground (masculine). Wiktionary, tꜣ: the headword is the land sign N17 with the canal sign N23 and a stroke. The Swadesh list gives tꜣ for earth, soil."
  "egy-0015":
    "native": "sky"
    "notes":
      "n1": "Pt, the sky, the heavens (feminine). Wiktionary, pt: the headword is p and t with the sky sign N1."
  "egy-0016":
    "native": "name"
    "notes":
      "n1": "Rn, name (masculine), by extension identity and reputation. Wiktionary, rn (Swadesh list, item 207). The headword is r and n with the sign A2, a man with his hand to his mouth."
  "egy-0017":
    "native": "heart"
    "notes":
      "n1": "Jb, the heart (masculine): the organ, and the seat of thought and feeling. Wiktionary, jb (Swadesh list, item 90): the headword is the heart sign F34 with a stroke."
  "egy-0018":
    "native": "god"
    "notes":
      "n1": "Nṯr, god (masculine); a dead person or a king can be called a god. Wiktionary, nṯr: the headword is the flag sign R8 with a stroke."
  "egy-0019":
    "native": "arm; hand"
    "notes":
      "n1": "Ꜥ, arm, hand (masculine); also the hoof or foot of an animal, a part. Wiktionary, ꜥ (Swadesh list, item 83, which gives ḏrt and ꜥ): the headword is the arm sign D36 with a stroke."
  "egy-0020":
    "native": "face"
    "notes":
      "n1": "Ḥr, face (masculine): of a person or animal. Wiktionary, ḥr: the headword is the face sign D2 with a stroke. The same spelling writes the preposition ḥr, on, upon."
  "egy-0021":
    "native": "eye"
    "notes":
      "n1": "Jrt, eye (feminine). Wiktionary, jrt (Swadesh list, item 74): the headword is the eye sign D4 with t and a stroke."
  "egy-0022":
    "native": "gold"
    "notes":
      "n1": "Nbw, gold (masculine). Wiktionary, nbw: the headword is the gold-collar sign S12."
  "egy-0023":
    "native": "mansion; temple"
    "notes":
      "n1": "Ḥwt, a large building, a mansion; also a palace or temple (feminine). Wiktionary, ḥwt (Swadesh list, item 151): the headword is the enclosure sign O6, t and the house sign O1."
  "egy-0024":
    "native": "all; every"
    "notes":
      "n1": "Nb, all, every, placed after its noun: rn nb, every name. Wiktionary, nb: the entry labels it a determiner; there is also a noun nb, lord, in its own entry. The sign is the basket V30."
  "egy-0025":
    "native": "to say; to speak"
    "notes":
      "n1": "Ḏd, to say, to speak (a transitive verb, with n for to whom). Wiktionary, ḏd (Swadesh list, item 140): the headword is the cobra I10 with the hand D46."
  "egy-0026":
    "native": "to see; to look at"
    "notes":
      "n1": "Mꜣꜣ, to look at, to see (a transitive verb). Wiktionary, mꜣꜣ (Swadesh list, item 101). The headword signs are U2, the eye D4 and two vultures G1; the entry gives no Middle Egyptian pronunciation."
  "egy-0027":
    "native": "good; beautiful"
    "notes":
      "n1": "Nfr, to be good, fine, beautiful; the same spelling is the adjective and a noun. Wiktionary, nfr (Swadesh list, item 185): the headword is the nfr sign F35 with f and r."
  "egy-0028":
    "native": "father"
    "notes":
      "n1": "Jt, father (masculine); also an ancestor. Wiktionary, jt (the same spelling also writes barley). The headword is j, t, f and the man sign A1. The Swadesh list gives jt for father."
  "egy-0029":
    "native": "mother"
    "notes":
      "n1": "Mwt, mother (feminine); also the goddess Mut. Wiktionary, mwt (Swadesh list, item 42): the headword is the vulture sign G14, t and the seated woman B1. The same letters also write the verb to die."
  "egy-0030":
    "native": "thousand"
    "notes":
      "n1": "Ḫꜣ, one thousand (the number word; also a herd). Wiktionary, ḫꜣ: the headword is the lotus sign M12."
  "egy-0031":
    "native": "papyrus stem; green"
    "notes":
      "n1": "Wꜣḏ, a papyrus stem (masculine), the emblem of Lower Egypt; the same root gives the colour green (Swadesh list, item 173, gives wꜣḏ for green). Wiktionary, wꜣḏ: the headword is the papyrus sign M13."
  "egy-0032":
    "native": "red"
    "notes":
      "n1": "Dšr, to be red; also the adjective red and a flamingo. Wiktionary, dšr (Swadesh list, item 172): the headword is d, š, r with the flamingo G27."
  "egy-0033":
    "native": "river"
    "notes":
      "n1": "Jtrw, river; also the Nile. Wiktionary, jtrw (Swadesh list, item 152). The headword is j, t, r, w and the water sign N35A."
  "egy-0034":
    "native": "king"
    "notes":
      "n1": "Nswt, the king of Upper Egypt, and the king of Egypt as a divine power (masculine). Wiktionary, nswt: the headword is the sedge sign M23, t and n."
