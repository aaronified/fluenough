"tags":
- "unreviewed"
"cards":
  "egy-0001":
    "native": "of (the genitive particle)"
    "notes":
      "n1": "N, of, the genitive particle. The sign N35 (water ripples, phonetic value n) is from the Gardiner sign list. The gloss is not in the sources read; doubtful until checked."
  "egy-0002":
    "native": "water"
    "notes":
      "n1": "Mw, water. Source: Wiktionary, Egyptian Swadesh list (item 150). The hieroglyph N35A is the water sign of the word; the sign choice is not in the sources read, so doubtful."
  "egy-0003":
    "native": "house"
    "notes":
      "n1": "Pr, house. Source: Wikipedia, Ancient Egyptian language (pr-jb.sn(j), house-heart); the sign O1 is the house, from Wikipedia, Egyptian biliteral signs."
  "egy-0004":
    "native": "bread; loaf"
    "notes":
      "n1": "T, bread loaf (the feminine noun t, bread). Source: Wikipedia, Gardiner's sign list (X1, bread bun, feminine t); the gloss bread is from the sign's description."
  "egy-0005":
    "native": "life"
    "notes":
      "n1": "Ꜥnḫ, life (the ankh sign, S34). The sign is from Wikipedia, Gardiner's sign list; the gloss life is not in the sources read, so doubtful until checked."
  "egy-0006":
    "native": "sun"
    "notes":
      "n1": "Rꜥ, sun (the sun disc, N5). Source: Wikipedia, Gardiner's sign list (N5, sun, rꜥ)."
  "egy-0007":
    "native": "mouth"
    "notes":
      "n1": "R, mouth. The sign D21 is the mouth. The gloss is not in the sources read, so doubtful until checked."
  "egy-0008":
    "native": "man (adult male)"
    "notes":
      "n1": "Z, man (adult male), the word z in the Swadesh list. Source: Wiktionary, Egyptian Swadesh list (item 37). The seated man sign A1 is the determinative of men."
  "egy-0009":
    "native": "one"
    "notes":
      "n1": "Wꜥ, one. Source: Wiktionary, Egyptian Swadesh list (item 22). The sign is one stroke."
  "egy-0010":
    "native": "two"
    "notes":
      "n1": "Snwj, two. Source: Wiktionary, Egyptian Swadesh list (item 23). The sign is two strokes."
  "egy-0011":
    "native": "three"
    "notes":
      "n1": "Ḫmtw, three. Source: Wiktionary, Egyptian Swadesh list (item 24). The sign is three strokes."
  "egy-0012":
    "native": "four"
    "notes":
      "n1": "Jfdw, four. Source: Wiktionary, Egyptian Swadesh list (item 25). The sign is four strokes."
  "egy-0013":
    "native": "five"
    "notes":
      "n1": "Djw, five. Source: Wiktionary, Egyptian Swadesh list (item 26). The sign is five strokes; the sign choice is not in the sources read, so doubtful."
