"name": "First words"
"description": "Thirteen words of Middle Egyptian, the language of the Middle Kingdom, about 2000 to 1650 BCE, written in hieroglyphs. The reading is the Egyptological transliteration (ꜥnḫ, rꜥ); the IPA is a broad reconstruction in the Egyptological vocalisation, a reading aid for a reading course. Only words attested in the sources read are marked as such; the rest are marked doubtful. Not yet checked by an Egyptologist: please report any mistake."
