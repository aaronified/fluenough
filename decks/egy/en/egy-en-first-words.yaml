"name": "First words"
"description": "Ten words of Middle Egyptian, the classical stage of the language. The target is the Egyptological transliteration; the reading is the teaching vocalisation (nefer, ankh), a convention for reading aloud and not a reconstruction. The hieroglyphs are not yet given. There is no speaker, so no IPA is given, and the cards have no example sentences yet: a scholar supplies them. Not yet checked by an Egyptologist: please report any mistake."
