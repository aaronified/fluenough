- "unreviewed"
"cards":
  "egy-0011":
    "native": "an offering which the king gives"
    "notes":
      "n1": "The offering formula, the commonest phrase of stelae. The reading is the teaching vocalisation."
  "egy-0012":
    "native": "an offering which the king gives to Osiris"
    "notes":
      "n1": "The offering formula with the god's name, Osiris. The reading is the teaching vocalisation."
  "egy-0013":
    "native": "an invocation offering"
    "notes":
      "n1": "The invocation offering of the stelae, the offering called for by the words. The reading is the teaching vocalisation."
  "egy-0014":
    "native": "life, prosperity, health"
    "notes":
      "n1": "The blessing that follows the king's name in the texts. The reading is the teaching vocalisation."
  "egy-0015":
    "native": "justified; true of voice"
    "notes":
      "n1": "The epithet after the name of the dead, true of voice. The reading is the teaching vocalisation."
  "egy-0016":
    "native": "lord of the Two Lands"
    "notes":
      "n1": "A royal title: the king, lord of the Two Lands. The reading is the teaching vocalisation."
  "egy-0017":
    "native": "lord of life"
    "notes":
      "n1": "A title of the king: lord of life. The reading is the teaching vocalisation."
  "egy-0018":
    "native": "great god"
    "notes":
      "n1": "Nṯr ꜥꜣ, great god, a title of gods and of the king. The reading is the teaching vocalisation."
  "egy-0019":
    "native": "the necropolis"
    "notes":
      "n1": "Literally the god's domain: the cemetery. The reading is the teaching vocalisation."
  "egy-0020":
    "native": "priest"
    "notes":
      "n1": "Literally servant of the god: a priest. The reading is the teaching vocalisation."
  "egy-0021":
    "native": "words to be spoken"
    "notes":
      "n1": "The formula of speech in the texts: the words spoken by the named speaker. The reading is the teaching vocalisation."
  "egy-0022":
    "native": "honoured; revered"
    "notes":
      "n1": "The status word after the name of the dead, honoured. The reading is the teaching vocalisation."
