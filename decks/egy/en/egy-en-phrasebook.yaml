"name": "Phrasebook: the offering formulae"
"description": "Twelve formulae of the stelae and tombs, in the transliteration, with the teaching vocalisation for reading aloud. A reading course, not a speaking one, so these are the formulae a reader meets; fewer than fifteen defensible formulae were found here. Not yet checked by an Egyptologist: please report any mistake."
