schema: 1
id: "ms-en-phrasebook"
kind: "layer"
core: "ms-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty things to say from the first day: greetings, thanks and sorry, asking for help, and saying you do not understand. Not yet checked by a Malay speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ms-0011":
    native: "hi; hello"
    notes:
      "n1": "Hai is casual. For a more formal start, use the time of day: selamat pagi, selamat petang."
    bases:
      "Hai": "hi"
  "ms-0012":
    native: "good morning"
    bases:
      "Selamat": "safe; well (in a greeting)"
      "pagi": "morning"
  "ms-0013":
    native: "good afternoon; good evening"
    bases:
      "Selamat": "safe; well (in a greeting)"
      "petang": "late afternoon; evening"
  "ms-0014":
    native: "good evening; good night"
    bases:
      "Selamat": "safe; well (in a greeting)"
      "malam": "night"
  "ms-0015":
    native: "goodbye (said by the one leaving)"
    notes:
      "n1": "Selamat tinggal is said by the person who is leaving. The one who stays says selamat jalan."
    bases:
      "Selamat": "safe; well (in a greeting)"
      "tinggal": "to stay; to remain"
  "ms-0016":
    native: "please; help"
    notes:
      "n1": "Tolong means please when you ask for something, and help as a request: tolong saya, help me."
    bases:
      "Tolong": "please; help"
  "ms-0017":
    native: "thank you"
    bases:
      "Terima": "to receive"
      "kasih": "love; kindness"
  "ms-0018":
    native: "thank you very much"
    bases:
      "Terima": "to receive"
      "kasih": "love; kindness"
      "banyak": "many; much; a lot"
  "ms-0019":
    native: "sorry; pardon"
    notes:
      "n1": "Maaf means sorry, and also pardon, when you did not hear something."
    bases:
      "Maaf": "sorry; pardon"
  "ms-0020":
    native: "excuse me, may I pass?"
    bases:
      "Maaf": "excuse me"
      "boleh": "may; can"
      "saya": "I"
      "lalu": "to pass"
  "ms-0021":
    native: "I don't understand."
    bases:
      "Saya": "I"
      "tidak": "not"
      "faham": "to understand"
  "ms-0022":
    native: "I don't know Malay."
    bases:
      "Saya": "I"
      "tidak": "not"
      "tahu": "to know"
      "bahasa": "language"
      "Melayu": "Malay"
  "ms-0023":
    native: "can you speak a little more slowly?"
    bases:
      "Boleh": "can"
      "cakap": "to speak"
      "perlahan": "slowly"
      "sikit": "a little"
  "ms-0024":
    native: "what is your name?"
    notes:
      "n1": "Siapa nama awak? is for a friend. For an older person, say Siapa nama anda?"
    bases:
      "Siapa": "who"
      "nama": "name"
      "awak": "you (informal)"
  "ms-0025":
    native: "my name is Amina."
    bases:
      "Nama": "name"
      "saya": "my"
      "Amina": "Amina, a name"
  "ms-0026":
    native: "how much is this?"
    bases:
      "Berapa": "how much; how many"
      "harga": "price"
      "ini": "this"
  "ms-0027":
    native: "where is the toilet?"
    bases:
      "Di": "at"
      "mana": "where"
      "tandas": "toilet"
  "ms-0028":
    native: "help me!"
    bases:
      "Tolong": "help"
      "saya": "me"
  "ms-0029":
    native: "do you speak English?"
    bases:
      "awak": "you (informal)"
      "cakap": "to speak"
      "bahasa": "language"
      "Inggeris": "English"
  "ms-0030":
    native: "how are you?"
    bases:
      "Apa": "what"
      "khabar": "news"
