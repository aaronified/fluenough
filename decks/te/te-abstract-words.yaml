        reading: "ī prayatnaṁlō nēnu vijayaṁ sādhiñcānu."
        ipa: "iː prajat̪namloː neːnu ʋidʒajam saːd̪ʱiɲtʃaːnu"
        bases:
          - { word: "ప్రయత్నంలో", base: "ప్రయత్నం", reading: "prayatnaṁlō" }
          - { word: "సాధించాను", base: "సాధించడం", reading: "sādhiñcānu" }
  - id: "te-6309"
    target: "అభివృద్ధి"
    reading: "abhivruddhi"
    ipa: "abʱiʋrud̪d̪ʱi"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "అభివృద్ధి చెందిన దేశం", reading: "abhivruddhi cendina dēśaṁ" }] }
    examples:
      - target: "ఈ ఊరిలో రోడ్ల అభివృద్ధి జరుగుతోంది."
        reading: "ī ūrilō rōḍla abhivruddhi jarugutōndi."
        ipa: "iː uːriloː roːɖla abʱiʋrud̪d̪ʱi dʒaruɡut̪oːnd̪i"
        bases:
          - { word: "ఊరిలో", base: "ఊరు", reading: "ūrilō" }
          - { word: "రోడ్ల", base: "రోడ్డు", reading: "rōḍla" }
          - { word: "జరుగుతోంది", base: "జరగడం", reading: "jarugutōndi" }
      - target: "దేశ అభివృద్ధికి విద్య ముఖ్యం."
        reading: "dēśa abhivruddhiki vidya mukhyaṁ."
        ipa: "d̪eːʃa abʱiʋrud̪d̪ʱiki ʋid̪ja mukʰjam"
        bases:
          - { word: "దేశ", base: "దేశం", reading: "dēśa" }
          - { word: "అభివృద్ధికి", base: "అభివృద్ధి", reading: "abhivruddhiki" }
    senses:
      - { id: "increase", pos: "noun", source: "https://en.wiktionary.org/wiki/అభివృద్ధి" }
      - { id: "improvement", pos: "noun", source: "https://en.wiktionary.org/wiki/అభివృద్ధి" }
