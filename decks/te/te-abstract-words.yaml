    examples:
      - target: "ఆమె ఉద్యోగం కోసం గట్టి ప్రయత్నం చేసింది."
        reading: "āme udyōgaṁ kōsaṁ gaṭṭi prayatnaṁ cēsindi."
        ipa: "aːme ud̪joːɡam koːsam ɡaʈʈi prajat̪nam tʃeːsind̪i"
