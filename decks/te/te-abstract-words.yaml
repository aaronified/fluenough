      - { id: "n1", kind: "usage", words: [{ word: "మంచి భావం", reading: "mañci bhāvaṁ" }] }
    examples:
      - target: "ఈ పాటలో గొప్ప భావం ఉంది."
        reading: "ī pāṭalō goppa bhāvaṁ undi."
        ipa: "iː paːʈaloː ɡoppa bʱaːʋam und̪i"
        bases:
          - { word: "పాటలో", base: "పాట", reading: "pāṭalō" }
