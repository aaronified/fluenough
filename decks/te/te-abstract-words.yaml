        reading: "satyaṁ eppaṭikī gelustundi."
        ipa: "sat̪jam eppaʈikiː ɡelust̪und̪i"
        bases:
          - { word: "గెలుస్తుంది", base: "గెలవడం", reading: "gelustundi" }
