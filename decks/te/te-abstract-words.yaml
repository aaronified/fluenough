      - target: "ఆ మాటకు అసలు భావం ఏమిటో చెప్పండి."
        reading: "ā māṭaku asalu bhāvaṁ ēmiṭō ceppaṇḍi."
        ipa: "aː maːʈaku asalu bʱaːʋam eːmiʈoː tʃeppaɳɖi"
        bases:
          - { word: "మాటకు", base: "మాట", reading: "māṭaku" }
