  - id: "te-6300"
    target: "జ్ఞానం"
    reading: "jñānaṁ"
    ipa: "dʒɲaːnam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "జ్ఞానంతో", reading: "jñānantō" }] }
    examples:
      - target: "పుస్తకాలు చదివితే జ్ఞానం పెరుగుతుంది."
        reading: "pustakālu cadivitē jñānaṁ perugutundi."
        ipa: "pust̪akaːlu tʃad̪iʋit̪eː dʒɲaːnam peruɡut̪und̪i"
        bases:
          - { word: "పుస్తకాలు", base: "పుస్తకం", reading: "pustakālu" }
          - { word: "చదివితే", base: "చదవడం", reading: "cadivitē" }
          - { word: "పెరుగుతుంది", base: "పెరగడం", reading: "perugutundi" }
      - target: "ఆయనకు ఆ విషయంలో చాలా జ్ఞానం ఉంది."
        reading: "āyanaku ā viṣayaṁlō cālā jñānaṁ undi."
        ipa: "aːjanaku aː ʋiʂajamloː tʃaːlaː dʒɲaːnam und̪i"
        bases:
          - { word: "ఆయనకు", base: "ఆయన", reading: "āyanaku" }
          - { word: "విషయంలో", base: "విషయం", reading: "viṣayaṁlō" }
          - { word: "ఉంది", base: "ఉండడం", reading: "undi" }
  - id: "te-6301"
    target: "విద్య"
    reading: "vidya"
    ipa: "ʋid̪ja"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "విద్యతో పాటు", reading: "vidyatō pāṭu" }] }
    examples:
      - target: "పిల్లలకు మంచి విద్య అవసరం."
        reading: "pillalaku mañci vidya avasaraṁ."
        ipa: "pillalaku maɲtʃi ʋid̪ja aʋasaram"
        bases:
          - { word: "పిల్లలకు", base: "పిల్లలు", reading: "pillalaku" }
      - target: "అతను విద్య కోసం ఊరు విడిచి వెళ్ళాడు."
        reading: "atanu vidya kōsaṁ ūru viḍici veḷḷāḍu."
        ipa: "at̪anu ʋid̪ja koːsam uːru ʋiɖitʃi ʋeɭɭaːɖu"
        bases:
          - { word: "విడిచి", base: "విడవడం", reading: "viḍici" }
          - { word: "వెళ్ళాడు", base: "వెళ్ళడం", reading: "veḷḷāḍu" }
    antonyms:
      - { id: "avidya", word: "అవిద్య", reading: "avidya", source: "https://en.wiktionary.org/wiki/విద్య" }
  - id: "te-6302"
    target: "అవకాశం"
    reading: "avakāśaṁ"
    ipa: "aʋakaːʃam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "అవకాశం లేదు", reading: "avakāśaṁ lēdu" }] }
    examples:
      - target: "ఈ ఉద్యోగానికి అవకాశం దొరికింది."
        reading: "ī udyōgāniki avakāśaṁ dorikindi."
        ipa: "iː ud̪joːɡaːniki aʋakaːʃam d̪orikind̪i"
        bases:
          - { word: "ఉద్యోగానికి", base: "ఉద్యోగం", reading: "udyōgāniki" }
          - { word: "దొరికింది", base: "దొరకడం", reading: "dorikindi" }
      - target: "మళ్ళీ ఒక అవకాశం ఇవ్వండి."
        reading: "maḷḷī oka avakāśaṁ ivvaṇḍi."
        ipa: "maɭɭiː oka aʋakaːʃam iʋʋaɳɖi"
        bases:
          - { word: "ఇవ్వండి", base: "ఇవ్వడం", reading: "ivvaṇḍi" }
  - id: "te-6303"
    target: "కారణం"
    reading: "kāraṇaṁ"
    ipa: "kaːraɳam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "కారణం లేకుండా", reading: "kāraṇaṁ lēkuṇḍā" }] }
    examples:
      - target: "ఆలస్యం కావడానికి కారణం ఏమిటి?"
        reading: "ālasyaṁ kāvaḍāniki kāraṇaṁ ēmiṭi?"
        ipa: "aːlasjam kaːʋaɖaːniki kaːraɳam eːmiʈi"
        bases:
          - { word: "కావడానికి", base: "కావడం", reading: "kāvaḍāniki" }
      - target: "అతను రాకపోవడానికి కారణం వర్షం."
        reading: "atanu rākapōvaḍāniki kāraṇaṁ varṣaṁ."
        ipa: "at̪anu raːkapoːʋaɖaːniki kaːraɳam ʋarʂam"
        bases:
          - { word: "రాకపోవడానికి", base: "రావడం", reading: "rākapōvaḍāniki" }
  - id: "te-6304"
    target: "పద్ధతి"
    reading: "paddhati"
    ipa: "pad̪d̪ʱat̪i"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "ఈ పద్ధతిలో", reading: "ī paddhatilō" }] }
    examples:
      - target: "ఈ పద్ధతిలో పని చేస్తే సమయం ఆదా అవుతుంది."
        reading: "ī paddhatilō pani cēstē samayaṁ ādā avutundi."
        ipa: "iː pad̪d̪ʱat̪iloː pani tʃeːst̪eː samajam aːd̪aː aʋut̪und̪i"
        bases:
          - { word: "పద్ధతిలో", base: "పద్ధతి", reading: "paddhatilō" }
          - { word: "చేస్తే", base: "చేయడం", reading: "cēstē" }
          - { word: "అవుతుంది", base: "అవడం", reading: "avutundi" }
      - target: "నేను కొత్త పద్ధతి నేర్చుకున్నాను."
        reading: "nēnu kotta paddhati nērcukunnānu."
        ipa: "neːnu kot̪t̪a pad̪d̪ʱat̪i neːrtʃukunnaːnu"
        bases:
          - { word: "నేర్చుకున్నాను", base: "నేర్చుకోవడం", reading: "nērcukunnānu" }
    senses:
      - { id: "manner", pos: "noun", source: "https://en.wiktionary.org/wiki/పద్ధతి" }
  - id: "te-6305"
    target: "సత్యం"
