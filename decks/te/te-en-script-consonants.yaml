schema: 1
id: te-en-script-consonants
name: "Telugu consonants"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Every consonant a beginner meets, each carrying its vowel a: the plain and breathy ones, the ones on the teeth and curled back, and the two l's."
tags: [beginner, unreviewed, script]
cards:
  - id: te-0014
    target: "క"
    native: "k (ka)"
    reading: "ka"
    ipa: "ka"
    notes: "Like the 'k' of 'skin', with no puff of breath. Every consonant carries the short a (అ) unless a sign changes it. కాలు (kālu, leg)."
  - id: te-0015
    target: "ఖ"
    native: "kh, with a breath (kha)"
    reading: "kha"
    ipa: "kʰa"
    notes: "క with a puff of breath after it, mostly in words from Sanskrit and Hindi: ఖర్చు (kharcu, expense)."
  - id: te-0016
    target: "గ"
    native: "g (ga)"
    reading: "ga"
    ipa: "ɡa"
    notes: "Like the 'g' of 'go': గది (gadi, room)."
  - id: te-0017
    target: "ఘ"
    native: "gh, with a breath (gha)"
    reading: "gha"
    ipa: "ɡʱa"
    notes: "గ with a breath after it, mostly in words from Sanskrit."
  - id: te-0018
    target: "ఙ"
    native: "ng (as in 'sing')"
    reading: "ṅa"
    ipa: "ŋa"
    modes: [recognition, production]
    notes: "Rare today: Telugu writes the sunna ం in its place. Hardly ever heard on its own, so it is drilled by reading and writing only."
  - id: te-0019
    target: "చ"
    native: "ch (ca)"
    reading: "ca"
    ipa: "tʃa"
    notes: "Like the 'ch' of 'church', with no puff of breath: చెయ్యి (ceyyi, hand)."
  - id: te-0020
    target: "ఛ"
    native: "chh, with a breath (cha)"
    reading: "cha"
    ipa: "tʃʰa"
    notes: "చ with a breath after it, in a few words from Sanskrit."
  - id: te-0021
    target: "జ"
    native: "j (ja)"
    reading: "ja"
    ipa: "dʒa"
    notes: "Like the 'j' of 'judge': జామ (jāma, guava)."
  - id: te-0022
    target: "ఝ"
    native: "jh, with a breath (jha)"
    reading: "jha"
    ipa: "dʒʱa"
    notes: "జ with a breath after it, in a few words from Sanskrit."
  - id: te-0023
    target: "ఞ"
    native: "ny (in conjuncts)"
    reading: "ña"
    ipa: "ɲa"
    modes: [recognition, production]
    notes: "Seen almost only in జ్ఞ, as in జ్ఞానం (jñānam, knowledge). Hardly ever heard on its own, so it is drilled by reading and writing only."
  - id: te-0024
    target: "ట"
    native: "t, curled back (ṭa)"
    reading: "ṭa"
    ipa: "ʈa"
    notes: "The tongue tip curls back to touch the roof of the mouth: retroflex. English 't' is close to this. Compare త: టమాట (ṭamāṭa, tomato)."
  - id: te-0025
    target: "ఠ"
    native: "th, curled back, with a breath (ṭha)"
    reading: "ṭha"
    ipa: "ʈʰa"
    notes: "ట with a breath after it, in words from Sanskrit: పాఠం (pāṭham, lesson)."
  - id: te-0026
    target: "డ"
    native: "d, curled back (ḍa)"
    reading: "ḍa"
    ipa: "ɖa"
    notes: "The tongue tip curls back, as for ట. English 'd' is close to this. Compare ద: డబ్బు (ḍabbu, money)."
  - id: te-0027
    target: "ఢ"
    native: "dh, curled back, with a breath (ḍha)"
    reading: "ḍha"
    ipa: "ɖʱa"
    notes: "డ with a breath after it, in a few words from Sanskrit."
  - id: te-0028
    target: "ణ"
    native: "n, curled back (ṇa)"
    reading: "ṇa"
    ipa: "ɳa"
    notes: "The tongue tip curls back, as for ట: దుకాణం (dukāṇam, shop). Compare న, on the teeth."
  - id: te-0029
    target: "త"
    native: "t, on the teeth (ta)"
    reading: "ta"
    ipa: "t̪a"
    notes: "The tongue touches the back of the upper teeth: dental. English has no such t; it sounds softer. Compare ట: తల (tala, head)."
  - id: te-0030
    target: "థ"
    native: "th, on the teeth, with a breath (tha)"
    reading: "tha"
    ipa: "t̪ʰa"
    notes: "త with a breath after it. Not the 'th' of 'thin': అర్థం (artham, meaning)."
  - id: te-0031
    target: "ద"
    native: "d, on the teeth (da)"
    reading: "da"
    ipa: "d̪a"
    notes: "The tongue touches the back of the upper teeth, as for త. Compare డ: దారి (dāri, way)."
  - id: te-0032
    target: "ధ"
    native: "dh, on the teeth, with a breath (dha)"
    reading: "dha"
    ipa: "d̪ʱa"
    notes: "ద with a breath after it. Not the 'th' of 'this': ధర (dhara, price)."
  - id: te-0033
    target: "న"
    native: "n, on the teeth (na)"
    reading: "na"
    ipa: "na"
    notes: "The 'n' of 'no', with the tongue on the teeth: నీళ్ళు (nīḷḷu, water). Compare ణ."
  - id: te-0034
    target: "ప"
    native: "p (pa)"
    reading: "pa"
    ipa: "pa"
    notes: "Like the 'p' of 'spin', with no puff of breath: పాలు (pālu, milk)."
  - id: te-0035
    target: "ఫ"
    native: "ph, with a breath (pha)"
    reading: "pha"
    ipa: "pʰa"
    notes: "ప with a breath after it. In English words it stands for 'f': ఫలం (phalam, fruit), కాఫీ (kāfī, coffee)."
  - id: te-0036
    target: "బ"
    native: "b (ba)"
    reading: "ba"
    ipa: "ba"
    notes: "Like the 'b' of 'boy': బడి (baḍi, school)."
  - id: te-0037
    target: "భ"
    native: "bh, with a breath (bha)"
    reading: "bha"
    ipa: "bʱa"
    notes: "బ with a breath after it. Not 'v': భాష (bhāṣa, language)."
  - id: te-0038
    target: "మ"
    native: "m (ma)"
    reading: "ma"
    ipa: "ma"
    notes: "Like the 'm' of 'mother': మనిషి (maniṣi, person)."
  - id: te-0039
    target: "య"
    native: "y (ya)"
    reading: "ya"
    ipa: "ja"
    notes: "Like the 'y' of 'yes': యాభై (yābhai, fifty)."
  - id: te-0040
    target: "ర"
    native: "r (ra)"
    reading: "ra"
    ipa: "ra"
    notes: "A single tap of the tongue, like the 'tt' of American 'butter'. Never silent: రోజు (rōju, day)."
  - id: te-0041
    target: "ల"
    native: "l, on the teeth (la)"
    reading: "la"
    ipa: "la"
    notes: "A clear 'l': లోపల (lōpala, inside). Compare ళ, curled back."
  - id: te-0042
    target: "వ"
    native: "v or w (va)"
    reading: "va"
    ipa: "ʋa"
    notes: "Between English 'v' and 'w': వారం (vāram, week)."
  - id: te-0043
    target: "శ"
    native: "sh (śa)"
    reading: "śa"
    ipa: "ʃa"
    notes: "The 'sh' of 'shop': శనివారం (śanivāram, Saturday)."
  - id: te-0044
    target: "ష"
    native: "sh, curled back (ṣa)"
    reading: "ṣa"
    ipa: "ʂa"
    modes: [recognition, production]
    notes: "Said with the tongue curled back in careful speech, in words from Sanskrit: భాష (bhāṣa, language). It sounds just like శ in everyday speech, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: te-0045
    target: "స"
    native: "s (sa)"
    reading: "sa"
    ipa: "sa"
    notes: "The 's' of 'sun'. Unlike శ, never 'sh': సమయం (samayam, time)."
  - id: te-0046
    target: "హ"
    native: "h (ha)"
    reading: "ha"
    ipa: "ha"
    notes: "Like the 'h' of 'hat': హైదరాబాద్ (haidarābād, Hyderabad)."
  - id: te-0047
    target: "ళ"
    native: "l, curled back (ḷa)"
    reading: "ḷa"
    ipa: "ɭa"
    notes: "The tongue tip curls back for this l, unlike ల: కళ (kaḷa, art), నీళ్ళు (nīḷḷu, water). Telugu tells them apart: కల (kala, with the l on the teeth) is a dream."
