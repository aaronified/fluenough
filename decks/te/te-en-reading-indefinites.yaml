"passages":
- "id": "te-lost-property-notice"
  "title": "A notice about a missing purse"
  "sentences":
  - "text": "ఈ బస్సులో ఒక పర్సు కనిపించడం లేదు."
    "reading": "ī bassulō oka parsu kanipiñcaḍaṁ lēdu."
    "ipa": "iː bassuloː oka parsu kanipiɲtʃaɖam leːd̪u"
  - "text": "అది నలుపు రంగు పర్సు, అందులో ఏదో కాగితాలు ఉన్నాయి."
    "reading": "adi nalupu raṅgu parsu, andulō ēdō kāgitālu unnāyi."
    "ipa": "ad̪i nalupu raŋɡu parsu and̪uloː eːd̪oː kaːɡit̪aːlu unnaːji"
  - "text": "ఏదైనా సమాచారం ఉంటే ఇక్కడ చెప్పండి."
    "reading": "ēdainā samācāraṁ uṇṭē ikkaḍa ceppaṇḍi."
    "ipa": "eːd̪ainaː samaːtʃaːram uɳʈeː ikkaɖa tʃeppaɳɖi"
  - "text": "పర్సులో డబ్బు ఏదీ లేదు."
    "reading": "parsulō ḍabbu ēdī lēdu."
    "ipa": "parsuloː ɖabbu eːd̪iː leːd̪u"
  "questions":
