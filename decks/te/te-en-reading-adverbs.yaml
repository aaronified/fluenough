  - "text": "నేను తరచుగా సినిమాకు వెళ్తాను."
    "reading": "nēnu taracugā sinimāku veḷtānu."
    "ipa": "neːnu t̪aratʃuɡaː sinimaːku ʋeɭt̪aːnu"
  - "text": "నేను కొన్నిసార్లు ఆలస్యంగా వస్తాను."
    "reading": "nēnu konnisārlu ālasyaṅgā vastānu."
    "ipa": "neːnu konnisaːrlu aːlasjaŋɡaː ʋast̪aːnu"
  - "text": "ఇది నా అలవాటు."
