  "sentences":
  - "text": "జనవరి మొదటి వారంలో బడి ఉంది."
    "reading": "janavari modaṭi vāramlō baḍi undi."
    "ipa": "dʒanaʋari mod̪aʈi ʋaːramloː baɖi und̪i"
  - "text": "ఫిబ్రవరి రెండవ వారంలో బజారు ఉంది."
    "reading": "phibravari reṇḍava vāramlō bajāru undi."
    "ipa": "pʰibraʋari reɳɖaʋa ʋaːramloː badʒaːru und̪i"
  - "text": "మార్చి మూడవ వారంలో నాకు పని ఉంది."
    "reading": "mārci mūḍava vāramlō nāku pani undi."
    "ipa": "maːrtʃi muːɖaʋa ʋaːramloː naːku pani und̪i"
  - "text": "మూడవ వారంలో బస్సు ఆలస్యంగా వస్తుంది."
    "reading": "mūḍava vāramlō bassu ālasyaṅgā vastundi."
    "ipa": "muːɖaʋa ʋaːramloː bassu aːlasjaŋɡaː ʋast̪und̪i"
