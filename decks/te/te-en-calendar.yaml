cards:
  - id: te-en-calendar-0001
    target: "నెల"
    native: "month"
    reading: "nela"
    pos: "noun"
    notes: "The Telugu calendar's months mark festivals such as ఉగాది (ugaadi), the new year; daily life uses the Gregorian months."
  - id: te-en-calendar-0002
    target: "సంవత్సరం"
    native: "year"
    reading: "samvatsaram"
    pos: "noun"
    notes: "A year is read as a number: 2020 is రెండు వేల ఇరవై (rendu veela iravai)."
