# The order Telugu is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner
# from English is taught te-en-home for te-home (ADR-0013, ADR-0036).
#
# This is also Telugu's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"): every
# unit from the first words to B1, written or planned, with its size in
# words, its grammar topics, the three milestones, and for each planned unit
# its listening and reading passages. The existing units keep their places
# and ids; the units written for A1 are placed among them where their words
# and rules are first needed. A2 and B1 units stay planned until a deck is
# written: the course teaches them as "Coming" until then. Sizes follow the
# plan's levels (about 700, 900 and 1,200 words; low confidence) and are
# one number for every native language. A theme named here that
# decks/themes.yaml does not list yet is added to it with its first deck.
#
# First a few words and basic sentences, the sounds the learner's language
# lacks and how Telugu grammar differs from it; then themes, each with the
# grammar that goes with it; the script comes after the first themes, before
# the rest. Every deck of Telugu is listed exactly once.
schema: 1
kind: "path"
id: "te-path"
language: "te"
# Where Telugu is spoken, for a rater's region and a card's region note
# (ADR-0036): the three regions its dialects are usually grouped by. The
# ids are permanent, as card ids are; rename a name, never an id. The app
# adds "Elsewhere" after them.
regions:
  - id: "telangana"
    name: { "en": "Telangana" }
  - id: "coastal-andhra"
    name: { "en": "Coastal Andhra" }
  - id: "rayalaseema"
    name: { "en": "Rayalaseema" }
# The decks that need the alphabet: a learner who learns without it
# skips them.
alphabet:
  - "te-script-vowels"
  - "te-script-consonants"
  - "te-script-reading"
  - "te-script-vowel-signs"
  - "te-script-conjuncts"
  - "te-spelling"
  - "te-reading-diddubatu"
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  - decks: ["te-phrasebook", "te-first-words", "te-grammar-sentences", "*"]
    words: 6
    grammar: ["sentences"]
  - decks: ["te-sound-differences"]
    words: 10
  - decks: ["te-grammar-differences"]
    words: 6
    grammar: ["differences"]
