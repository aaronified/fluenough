# The order Telugu is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner
# from English is taught te-en-home for te-home (ADR-0013, ADR-0036).
#
# This is also Telugu's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"): every
# unit from the first words to B1, written or planned, with its size in
# words, its grammar topics, the three milestones, and for each planned unit
# its listening and reading passages. A2 and B1 units stay planned until a
# deck is written: the course teaches them as "Coming" until then. Sizes
# follow the plan's levels (about 700, 900 and 1,200 words; low confidence)
# and are one number for every native language. A theme named here that
# decks/themes.yaml does not list yet is added to it with its first deck.
#
# Tense order (the tense, number and gender audit, 2026-10-23): the
# imperatives come after the eating-out theme, the first unit whose words
# they need (review, 2026-10-23); the perfect and the past continuous are
# planned after past-more.
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"):
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units;
# 3. the script, after the first six units ("After units 4-6"); a learner
#    who already reads it skips it (#554);
# 4. a core of about 200 common words in themed units, before the large
#    tables ("Yes, smaller (~200)");
# 5. rules as forms: noun endings, postpositions and conjunctions first,
#    then pronoun and verb forms, practised on the words already known;
# 6. sentences, each after its words and rules; then the other themes,
#    each its words, then its rules, then its sentences.
#
# The core's order is by judgement, most common first: everyday verbs,
# the common adverbs and function words (planned), how much and how many,
# describing words, time, where things are, more verbs. It was meant to
# come from Wikipedia's counts (tools/wikipedia_frequency.py, #516), but
# no Telugu Wikipedia dump could be fetched here (2026-10-17): order the
# core again from the counts once they are written.
#
# Every deck of Telugu is listed exactly once.
schema: 1
kind: "path"
id: "te-path"
language: "te"
# The gender classes a noun's gender is one of (#512; DECK-FORMAT.md, Card data).
genders: ["mahat", "amahat"]
# Where Telugu is spoken, for a rater's region and a card's region note
# (ADR-0036): the three regions its dialects are usually grouped by. The
# ids are permanent, as card ids are; rename a name, never an id. The app
# adds "Elsewhere" after them.
regions:
  - id: "telangana"
    name: { "en": "Telangana" }
  - id: "coastal-andhra"
    name: { "en": "Coastal Andhra" }
  - id: "rayalaseema"
    name: { "en": "Rayalaseema" }
# The decks that need the alphabet: a learner who learns without it
# skips them.
alphabet:
  - "te-script-vowels"
  - "te-script-consonants"
  - "te-script-reading"
  - "te-script-vowel-signs"
  - "te-script-conjuncts"
  - "te-script-digits"
  - "te-spelling"
  - "te-reading-diddubatu"
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  # 1. The phrasebook, taught whole from the first lesson.
  - decks: ["te-phrasebook", "te-first-words", "*"]
    words: 6
  # 2. The first word units.
  - decks: ["te-sound-differences"]
    words: 10
  - decks: ["te-questions", "*"]
    words: 11
  - decks: ["te-addressing", "te-pronouns", "*"]
    words: 33
  - decks: ["te-family", "*"]
    words: 25
  - decks: ["te-numbers-1-20", "*"]
    words: 20
  # 3. The script, after the first six units (#554: skipped by a learner
  # who already reads it).
  - ["te-script-vowels", "te-script-consonants", "te-script-reading"]
  - ["te-script-vowel-signs", "te-script-conjuncts", "te-script-digits"]
  # 4. The core: about 200 common words, most common first (by judgement
  # until the Wikipedia counts are written, #516).
  - decks: ["te-about-me", "*"]
    words: 7
  - decks: ["te-verbs", "*"]
    words: 33
  - decks: ["te-adverbs", "*"]
    words: 50
    listening_passages:
      - { id: "how-often", text: { "en": "Saying how often and how well things are done" } }
    reading_passages:
      - { id: "habit-survey", text: { "en": "A short survey about everyday habits" } }
  - decks: ["te-quantities", "*"]
    words: 30
  - decks: ["te-describing", "*"]
    words: 40
  - decks: ["te-time", "*"]
    words: 18
  - decks: ["te-location", "*"]
    words: 14
  - decks: ["te-more-verbs", "*"]
    words: 32
  # 5. Rules as forms, practised on the words known: noun endings and
  # conjunctions first, then pronoun and verb forms. The postpositions deck
  # is fixed phrases still, so it waits below for its words.
  - decks: ["te-grammar-noun-forms"]
    words: 0
    grammar: ["plural", "lo", "ki", "to", "nunci", "ni"]
  - decks: ["te-grammar-conjunctions"]
    words: 8
    grammar: ["conjunctions"]
  - decks: ["te-grammar-pronouns", "te-grammar-pronoun-forms"]
    words: 0
    grammar: ["pronouns", "pronoun-gen", "pronoun-dat", "pronoun-acc", "pronoun-with"]
