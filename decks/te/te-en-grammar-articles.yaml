schema: 1
id: te-en-grammar-articles
name: "No articles: a and the"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Telugu has no 'a' or 'the'. How it says them anyway. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: te-en-grammar-articles-0001
    target: "పుస్తకం బల్ల మీద ఉంది."
    native: "The book is on the table."
    reading: "pustakam balla miida undi."
    pos: "phrase"
    notes: "Telugu has no word for 'the' or 'a'; the context says which."
  - id: te-en-grammar-articles-0002
    target: "ఒక అబ్బాయి వచ్చాడు."
    native: "A boy came."
    reading: "oka abbaayi vachchaadu."
    pos: "phrase"
    notes: "ఒక, 'one', can do the work of 'a'."
  - id: te-en-grammar-articles-0003
    target: "అబ్బాయి వచ్చాడు."
    native: "The boy came."
    reading: "abbaayi vachchaadu."
    pos: "phrase"
  - id: te-en-grammar-articles-0004
    target: "ఒక టీ ఇవ్వండి."
    native: "One tea, please."
    reading: "oka tii ivvandi."
    pos: "phrase"
  - id: te-en-grammar-articles-0005
    target: "ఎవరో వచ్చారు."
    native: "Someone has come."
    reading: "evaroo vachchaaru."
    pos: "phrase"
    notes: "ఎవరో is 'someone'; ఏదో (eedoo), 'something'."
