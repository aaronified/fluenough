schema: 1
id: te-en-grammar-articles
name: "No articles: a and the"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Telugu has no 'a' or 'the'. How it says them anyway. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: te-0250
    target: "పుస్తకం బల్ల మీద ఉంది."
    native: "The book is on the table."
    reading: "pustakam balla mīda undi."
    ipa: "pust̪akam balla miːd̪a und̪i"
    pos: "phrase"
    notes: "Telugu has no word for 'the' or 'a'; the context says which."
    bases:
      - { word: "పుస్తకం", ref: "te-0865" }
      - { word: "మీద", ref: "te-0805" }
      - { word: "ఉంది", ref: "te-0633" }
  - id: te-0251
    target: "ఒక అబ్బాయి వచ్చాడు."
    native: "A boy came."
    reading: "oka abbāyi vaccāḍu."
    ipa: "oka abbaːji ʋatʃtʃaːɖu"
    pos: "phrase"
    notes: "ఒక (oka), 'one', can do the work of 'a'."
    bases:
      - { word: "ఒక", ref: "te-1034" }
      - { word: "అబ్బాయి", base: "అబ్బాయి", reading: "abbāyi", meaning: "boy; young man" }
      - { word: "వచ్చాడు", ref: "te-0623" }
  - id: te-0252
    target: "అబ్బాయి వచ్చాడు."
    native: "The boy came."
    reading: "abbāyi vaccāḍu."
    ipa: "abbaːji ʋatʃtʃaːɖu"
    pos: "phrase"
    bases:
      - { word: "అబ్బాయి", base: "అబ్బాయి", reading: "abbāyi", meaning: "boy; young man" }
      - { word: "వచ్చాడు", ref: "te-0623" }
  - id: te-0253
    target: "ఒక టీ ఇవ్వండి."
    native: "One tea, please."
    reading: "oka ṭī ivvaṇḍi."
    ipa: "oka ʈiː iʋʋaɳɖi"
    pos: "phrase"
    bases:
      - { word: "ఒక", ref: "te-1034" }
  - id: te-0254
    target: "ఎవరో వచ్చారు."
    native: "Someone has come."
    reading: "evarō vaccāru."
    ipa: "eʋaroː ʋatʃtʃaːru"
    pos: "phrase"
    notes: "ఎవరో (evarō) is 'someone'; ఏదో (ēdō), 'something'."
    bases:
      - { word: "ఎవరో", ref: "te-0161" }
      - { word: "వచ్చారు", ref: "te-0623" }
