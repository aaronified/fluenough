  - id: "te-4600"
    target: "వ్యవసాయం"
    reading: "vyavasāyaṁ"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "పొలం", reading: "polaṁ" }] }
    examples:
      - target: "వ్యవసాయం కష్టమైన పని."
        reading: "vyavasāyaṁ kaṣṭamaina pani."
        bases:
          - { word: "కష్టమైన", base: "కష్టం", reading: "kaṣṭam" }
      - target: "మా ఊళ్ళో వ్యవసాయం ముఖ్యమైనది."
        reading: "mā ūḷḷō vyavasāyaṁ mukhyamainadi."
        bases:
          - { word: "మా", base: "మేము", reading: "mēmu" }
          - { word: "ఊళ్ళో", base: "ఊరు", reading: "ūru" }
          - { word: "ముఖ్యమైనది", base: "ముఖ్యం", reading: "mukhyam" }
  - id: "te-4601"
    target: "సేద్యం"
    reading: "sēdyaṁ"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - "target": "సేద్యానికి చాలా ఓపిక కావాలి."
        "reading": "sēdyāniki cālā ōpika kāvāli."
        "bases":
          - "word": "కావాలి"
            "base": "కావడం"
            "reading": "kāvaḍaṁ"
          - "word": "సేద్యానికి"
            "base": "సేద్యం"
            "reading": "sēdyam"
          - "word": "ఓపిక"
            "base": "ఓపిక"
            "reading": "ōpika"
      - target: "ఈ భూమి సేద్యానికి మంచిది."
        reading: "ī bhūmi sēdyāniki mañcidi."
        bases:
          - { word: "సేద్యానికి", base: "సేద్యం", reading: "sēdyam" }
          - { word: "మంచిది", base: "మంచి", reading: "mañci" }
  - id: "te-4602"
    target: "నాగలి"
    reading: "nāgali"
    ipa: "naːɡali"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "ఎద్దులు", reading: "eddulu" }] }
    examples:
      - target: "రైతు నాగలితో పొలం దున్నాడు."
        reading: "raitu nāgalitō polaṁ dunnāḍu."
        bases:
          - { word: "నాగలితో", base: "నాగలి", reading: "nāgali" }
          - { word: "దున్నాడు", base: "దున్నడం", reading: "dunnaḍaṁ" }
      - target: "ఈ నాగలి చాలా పాతది."
        reading: "ī nāgali cālā pātadi."
        bases:
          - { word: "పాతది", base: "పాత", reading: "pāta" }
    synonyms:
      - { id: "halamu", word: "హలము", reading: "halamu", source: "https://en.wiktionary.org/wiki/నాగలి" }
  - id: "te-4603"
    target: "ట్రాక్టర్"
    reading: "ṭrākṭar"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "ట్రాక్టర్లు", reading: "ṭrākṭarlu" }] }
    examples:
      - target: "మా పొలంలో ట్రాక్టర్ ఉంది."
        reading: "mā polamlō ṭrākṭar undi."
        bases:
          - { word: "మా", base: "మేము", reading: "mēmu" }
          - { word: "పొలంలో", base: "పొలం", reading: "polam" }
          - { word: "ఉంది", base: "ఉండడం", reading: "uṇḍaḍaṁ" }
      - target: "ట్రాక్టర్‌తో దున్నితే పని త్వరగా అవుతుంది."
        reading: "ṭrākṭartō dunnitē pani tvaragā avutundi."
        bases:
          - { word: "ట్రాక్టర్‌తో", base: "ట్రాక్టర్", reading: "ṭrākṭar" }
          - { word: "దున్నితే", base: "దున్నడం", reading: "dunnaḍaṁ" }
          - { word: "అవుతుంది", base: "అవడం", reading: "avaḍaṁ" }
  - id: "te-4604"
    target: "చేను"
    reading: "cēnu"
    ipa: "t͡ɕeːnu"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    warning: "senses"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "చేలు", reading: "cēlu" }] }
    examples:
      - target: "చేనులో వరి పండుతోంది."
        reading: "cēnulō vari paṇḍutōndi."
