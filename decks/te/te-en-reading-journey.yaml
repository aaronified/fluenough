  "title": "Train timetable and platform notice"
  "sentences":
  - "text": "ఉదయం ఏడు గంటలకు రైలు, ప్లాట్‌ఫామ్ ఒకటి."
    "reading": "udayaṁ ēḍu gaṇṭalaku railu, plāṭphām okaṭi."
    "ipa": "ud̪ajam eːɖu ɡaɳʈalaku railu plaːʈpʰaːm okaʈi"
  - "text": "సాయంత్రం ఆరు గంటలకు ఇంటర్‌సిటీ, ప్లాట్‌ఫామ్ మూడు."
    "reading": "sāyantraṁ āru gaṇṭalaku iṇṭarsiṭī, plāṭphām mūḍu."
    "ipa": "saːjant̪ram aːru ɡaɳʈalaku iɳʈarsiʈiː plaːʈpʰaːm muːɖu"
  - "text": "రైలు ఆలస్యంగా వస్తోంది."
    "reading": "railu ālasyaṅgā vastōndi."
    "ipa": "railu aːlasjaŋɡaː ʋast̪oːnd̪i"
  - "text": "మీ టికెట్ చూపించండి."
    "reading": "mī ṭikeṭ cūpiñcaṇḍi."
    "ipa": "miː ʈikeʈ tʃuːpiɲtʃaɳɖi"
