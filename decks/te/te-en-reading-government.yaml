  "sentences":
  - "text": "ఈ పత్రంలో మీ పేరు రాయండి."
    "reading": "ī patramlō mī pēru rāyaṇḍi."
    "ipa": "iː pat̪ramloː miː peːru raːjaɳɖi"
  - "text": "దయచేసి ఈ పత్రానికి ఒక నకలు ఇవ్వండి."
    "reading": "dayacēsi ī patrāniki oka nakalu ivvaṇḍi."
    "ipa": "d̪ajatʃeːsi iː pat̪raːniki oka nakalu iʋʋaɳɖi"
  - "text": "దయచేసి జిల్లా కలెక్టర్ కార్యాలయంలో ఈ ఫారం ఇవ్వండి."
    "reading": "dayacēsi jillā kalekṭar kāryālayamlō ī phāraṁ ivvaṇḍi."
    "ipa": "d̪ajatʃeːsi dʒillaː kalekʈar kaːrjaːlajamloː iː pʰaːram iʋʋaɳɖi"
  - "text": "నియమాలు తెలుసుకోవడం ముఖ్యం."
    "reading": "niyamālu telusukōvaḍaṁ mukhyaṁ."
    "ipa": "nijamaːlu t̪elusukoːʋaɖam mukʰjam"
