schema: 1
id: te-en-addressing
name: "Addressing people"
kind: vocab
theme: addressing
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "What to call a shopkeeper, a driver or an older woman: Telugu speakers address strangers as family. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: te-en-addressing-0001
    target: "అన్నా"
    native: "elder brother; to a man a little older"
    reading: "annaa"
    pos: "noun"
    tags: ["honorific"]
    notes: "What you call a shopkeeper or an auto driver: అన్నా, ఎంత? Friendly and polite at once."
  - id: te-en-addressing-0002
    target: "అక్కా"
    native: "elder sister; to a woman a little older"
    reading: "akkaa"
    pos: "noun"
    tags: ["honorific"]
  - id: te-en-addressing-0003
    target: "తమ్ముడు"
    native: "younger brother; to a younger man"
    reading: "tammudu"
    pos: "noun"
  - id: te-en-addressing-0004
    target: "చెల్లి"
    native: "younger sister"
    reading: "chelli"
    pos: "noun"
  - id: te-en-addressing-0005
    target: "గారు"
    native: "Mr; Ms (after a name, respectful)"
    reading: "gaaru"
    pos: "particle"
    tags: ["honorific"]
    notes: "రాము గారు, Mr Ramu. It shows respect to anyone, man or woman."
  - id: te-en-addressing-0006
    target: "అండీ"
    native: "a word of respect, after a word or a reply"
    reading: "andii"
    pos: "particle"
    tags: ["honorific"]
    notes: "Added to soften and show respect: అవునండీ, yes; సరేనండీ, all right."
  - id: te-en-addressing-0007
    target: "సార్"
    native: "sir"
    reading: "saar"
    pos: "noun"
    tags: ["honorific"]
  - id: te-en-addressing-0008
    target: "మేడమ్"
    native: "madam"
    reading: "meedam"
    pos: "noun"
    tags: ["honorific"]
  - id: te-en-addressing-0009
    target: "బాబాయ్"
    native: "uncle; to a man of your parents' age"
    reading: "baabaay"
    pos: "noun"
    tags: ["honorific"]
    notes: "Strictly your father's younger brother."
  - id: te-en-addressing-0010
    target: "ఆంటీ"
    native: "aunty; to an older woman"
    reading: "aantii"
    pos: "noun"
    tags: ["honorific"]
  - id: te-en-addressing-0011
    target: "స్నేహితుడు"
    native: "friend (a man)"
    reading: "sneehitudu"
    pos: "noun"
    notes: "A woman friend is స్నేహితురాలు (sneehituraalu)."
