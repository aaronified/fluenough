tags: [beginner, unreviewed]
cards:
  - id: te-0157
    target: "అవును"
    native: "yes"
    reading: "avunu"
    pos: "other"
    notes: "Politely, అవునండీ (avunandi)."
  - id: te-0158
    target: "కాదు"
    native: "no; it is not"
    reading: "kadu"
    pos: "other"
    notes: "కాదు denies what something is: ఇది కాఫీ కాదు, this is not coffee. లేదు (ledu) denies that something is there or happened."
  - id: te-0159
    target: "లేదు"
    native: "no; there isn't"
    reading: "ledu"
    pos: "other"
    notes: "చిల్లర లేదు, there's no change."
  - id: te-0160
    target: "ఏమిటి"
    native: "what"
    reading: "emiti"
    alt_target: ["ఏంటి"]
    pos: "other"
    notes: "In speech often ఏంటి (enti)."
  - id: te-0161
    target: "ఎవరు"
    native: "who"
    reading: "evaru"
    pos: "other"
  - id: te-0162
    target: "ఎక్కడ"
    native: "where"
    reading: "ekkada"
    pos: "other"
  - id: te-0163
    target: "ఎప్పుడు"
    native: "when"
    reading: "eppudu"
    pos: "other"
  - id: te-0164
    target: "ఎందుకు"
    native: "why"
    reading: "enduku"
    pos: "other"
  - id: te-0165
    target: "ఎలా"
    native: "how"
    reading: "ela"
    pos: "other"
  - id: te-0166
    target: "ఎంత"
    native: "how much"
    reading: "enta"
    pos: "other"
    notes: "ఎన్ని (enni) is 'how many'."
  - id: te-0167
    target: "ఏది"
    native: "which one"
    reading: "edi"
    pos: "other"
  - id: te-0168
    target: "నిజమా?"
    native: "Really?"
    reading: "nijama?"
    pos: "phrase"
    notes: "-ఆ at the end turns a sentence into a yes/no question: నిజం (true) → నిజమా? (true?)."
