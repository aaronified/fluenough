cards:
  - id: te-0157
    target: "అవును"
    native: "yes"
    reading: "avunu"
    ipa: "aʋunu"
    pos: "other"
    notes: "Politely, అవునండీ (avunaṇḍī)."
  - id: te-0158
    target: "కాదు"
    native: "no; it is not"
    reading: "kādu"
    ipa: "kaːd̪u"
    pos: "other"
    notes: "కాదు denies what something is: ఇది కాఫీ కాదు, this is not coffee. లేదు (lēdu) denies that something is there or happened."
  - id: te-0159
