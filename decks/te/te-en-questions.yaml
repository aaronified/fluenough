schema: 1
id: te-en-questions
name: "Yes, no and questions"
kind: vocab
theme: questions
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Yes and no, the question words, and how a sentence becomes a question. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: te-en-questions-0001
    target: "అవును"
    native: "yes"
    reading: "avunu"
    pos: "other"
    notes: "Politely, అవునండీ (avunandii)."
  - id: te-en-questions-0002
    target: "కాదు"
    native: "no; it is not"
    reading: "kaadu"
    pos: "other"
    notes: "కాదు denies what something is: ఇది కాఫీ కాదు, this is not coffee. లేదు (leedu) denies that something is there or happened."
  - id: te-en-questions-0003
    target: "లేదు"
    native: "no; there isn't"
    reading: "leedu"
    pos: "other"
    notes: "చిల్లర లేదు, there's no change."
  - id: te-en-questions-0004
    target: "ఏమిటి"
    native: "what"
    reading: "eemiti"
    alt_target: ["ఏంటి"]
    pos: "other"
    notes: "In speech often ఏంటి (eenti)."
  - id: te-en-questions-0005
    target: "ఎవరు"
    native: "who"
    reading: "evaru"
    pos: "other"
  - id: te-en-questions-0006
    target: "ఎక్కడ"
    native: "where"
    reading: "ekkada"
    pos: "other"
  - id: te-en-questions-0007
    target: "ఎప్పుడు"
    native: "when"
    reading: "eppudu"
    pos: "other"
  - id: te-en-questions-0008
    target: "ఎందుకు"
    native: "why"
    reading: "enduku"
    pos: "other"
  - id: te-en-questions-0009
    target: "ఎలా"
    native: "how"
    reading: "elaa"
    pos: "other"
  - id: te-en-questions-0010
    target: "ఎంత"
    native: "how much"
    reading: "enta"
    pos: "other"
    notes: "ఎన్ని (enni) is 'how many'."
  - id: te-en-questions-0011
    target: "ఏది"
    native: "which one"
    reading: "eedi"
    pos: "other"
  - id: te-en-questions-0012
    target: "నిజమా?"
    native: "Really?"
    reading: "nijamaa?"
    pos: "phrase"
    notes: "-ఆ at the end turns a sentence into a yes/no question: నిజం (true) → నిజమా? (true?)."
