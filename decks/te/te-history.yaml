  - id: "te-5100"
    target: "చరిత్ర"
    reading: "caritra"
    ipa: "tʃarit̪ra"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    warning: "senses"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "చరిత్ర పుస్తకం", reading: "caritra pustakaṁ" }] }
    examples:
      - target: "నాకు భారత చరిత్ర ఇష్టం."
        reading: "nāku bhārata caritra iṣṭaṁ."
        ipa: "naːku bʱaːrat̪a tʃarit̪ra iʂʈam"
        bases:
          - { word: "నాకు", base: "నేను", reading: "nēnu" }
          - { word: "భారత", base: "భారత", reading: "bhārata" }
          - { word: "ఇష్టం", base: "ఇష్టం", reading: "iṣṭaṁ" }
      - target: "ఈ పుస్తకం చరిత్ర గురించి ఉంది."
        reading: "ī pustakaṁ caritra guriñci undi."
        ipa: "iː pust̪akam tʃarit̪ra ɡuriɲtʃi und̪i"
        bases:
          - { word: "ఈ", base: "ఈ", reading: "ī" }
          - { word: "పుస్తకం", base: "పుస్తకం", reading: "pustakaṁ" }
          - { word: "గురించి", base: "గురించి", reading: "guriñci" }
          - { word: "ఉంది", base: "ఉండడం", reading: "uṇḍaḍaṁ" }
    senses:
      - { id: "history", pos: "noun", source: "https://en.wiktionary.org/wiki/చరిత్ర" }
