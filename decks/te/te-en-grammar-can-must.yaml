schema: 1
id: te-en-grammar-can-must
name: "Can, may and must"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Ability, permission, need and duty: each is an ending on the verb. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: te-0492
    target: "నేను తెలుగు మాట్లాడగలను."
    native: "I can speak Telugu."
    reading: "nēnu telugu māṭlāḍagalanu."
    ipa: "neːnu t̪eluɡu maːʈlaːɖaɡalanu"
    pos: "phrase"
    notes: "Can is the verb with -గల- (-gala-), then the person: మాట్లాడగలను (māṭlāḍagalanu), I can speak."
    bases:
      - { word: "నేను", ref: "te-0593" }
      - { word: "తెలుగు", base: "తెలుగు", reading: "telugu", meaning: "Telugu (the language)" }
      - { word: "మాట్లాడగలను", ref: "te-0644" }
  - id: te-0493
    target: "మీరు రేపు రాగలరా?"
    native: "Can you come tomorrow?"
    reading: "mīru rēpu rāgalarā?"
    ipa: "miːru reːpu raːɡalaraː"
    pos: "phrase"
    bases:
      - { word: "రాగలరా", ref: "te-0623" }
  - id: te-0494
    target: "నేను రాలేను."
    native: "I can't come."
    reading: "nēnu rālēnu."
    ipa: "neːnu raːleːnu"
    pos: "phrase"
    notes: "Can't is the verb with లేను (lēnu), లేవు (lēvu), లేదు (lēdu) …: రాలేను (rālēnu), I can't come."
    bases:
      - { word: "నేను", ref: "te-0593" }
      - { word: "రాలేను", ref: "te-0623" }
  - id: te-0495
    target: "నాకు ఈత వచ్చు."
    native: "I can swim."
    reading: "nāku īta vaccu."
    ipa: "naːku iːt̪a ʋatʃtʃu"
    pos: "phrase"
    notes: "For a skill, the one who knows takes -కు (-ku) and the verb is వచ్చు (vaccu), comes: 'to me swimming comes'. The negative is రాదు (rādu)."
    bases:
      - { word: "నాకు", ref: "te-0593" }
      - { word: "ఈత", base: "ఈత", reading: "īta", meaning: "swimming" }
      - { word: "వచ్చు", ref: "te-0623" }
  - ref: te-0143
  - id: te-0496
    target: "మీరు లోపలికి రావచ్చు."
    native: "You may come in."
    reading: "mīru lōpaliki rāvaccu."
    ipa: "miːru loːpaliki raːʋatʃtʃu"
    pos: "phrase"
    notes: "May is the verb with -వచ్చు (-vaccu): రావచ్చు (rāvaccu), may come."
    bases:
      - { word: "లోపలికి", ref: "te-0800" }
      - { word: "రావచ్చు", ref: "te-0623" }
  - id: te-0497
    target: "ఇక్కడ ఫోటోలు తీయకూడదు."
    native: "You mustn't take photos here."
    reading: "ikkaḍa fōṭōlu tīyakūḍadu."
    ipa: "ikkaɖa foːʈoːlu t̪iːjakuːɖad̪u"
    pos: "phrase"
    notes: "Must not is the verb with -కూడదు (-kūḍadu)."
    bases:
      - { word: "ఫోటోలు", ref: "te-0895" }
      - { word: "తీయకూడదు", ref: "te-0836" }
  - ref: te-0377
  - id: te-0498
    target: "మీరు రేపు రావాలి."
    native: "You must come tomorrow."
    reading: "mīru rēpu rāvāli."
    ipa: "miːru reːpu raːʋaːli"
    pos: "phrase"
    notes: "Must is the verb with -ఆలి (-āli), the same for everyone: నేను వెళ్ళాలి (nēnu veḷḷāli), ఆమె వెళ్ళాలి (āme veḷḷāli)."
    bases:
      - { word: "రావాలి", ref: "te-0623" }
  - id: te-0499
    target: "నేను వెళ్ళనక్కర్లేదు."
    native: "I don't have to go."
    reading: "nēnu veḷḷanakkarlēdu."
    ipa: "neːnu ʋeɭɭanakkarleːd̪u"
    alt_target: ["నేను వెళ్ళక్కర్లేదు."]
    pos: "phrase"
    notes: "Don't have to is the verb with -అక్కర్లేదు (-akkarlēdu), 'there is no need'."
    bases:
      - { word: "నేను", ref: "te-0593" }
      - { word: "వెళ్ళనక్కర్లేదు", ref: "te-0622" }
