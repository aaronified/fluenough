id: te-en-grammar-conjunct-verbs
name: "Noun + చేయు and పడు"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Many Telugu verbs are a noun with చేయు, do, or పడు, fall: పని చేయడం, to work; భయపడడం, to be afraid. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: te-0479
    target: "పని చేయడం"
    native: "to work"
    reading: "pani cēyaḍam"
    ipa: "pani tʃeːjaɖam"
    pos: "phrase"
    notes: "పని, work, and చేయడం, to do. So too స్నానం చేయడం, to bathe, and వంట చేయడం, to cook."
  - id: te-0480
    target: "ఫోన్ చేయడం"
    native: "to phone"
    reading: "fōn cēyaḍam"
    ipa: "foːn tʃeːjaɖam"
    pos: "phrase"
    notes: "నాకు ఫోన్ చేయండి, please call me."
  - id: te-0481
    target: "సహాయం చేయడం"
    native: "to help"
    reading: "sahāyam cēyaḍam"
    ipa: "sahaːjam tʃeːjaɖam"
    pos: "phrase"
    notes: "The one helped takes -కు: నాకు సహాయం చేయండి, please help me."
  - id: te-0482
    target: "పెళ్ళి చేసుకోవడం"
    native: "to get married"
    reading: "peḷḷi cēsukōvaḍam"
    ipa: "peɭɭi tʃeːsukoːʋaɖam"
    alt_target: ["పెళ్లి చేసుకోవడం"]
    pos: "phrase"
    notes: "With -కొను, for oneself: పెళ్ళి చేసుకున్నాను, I got married."
  - id: te-0483
    target: "ప్రయత్నం చేయడం"
    native: "to try"
    reading: "prayatnam cēyaḍam"
    ipa: "prajat̪nam tʃeːjaɖam"
    alt_target: ["ప్రయత్నించడం"]
    pos: "phrase"
    notes: "Also one verb: ప్రయత్నించడం (prayatniñcaḍam)."
  - id: te-0484
    target: "ఖర్చు పెట్టడం"
    native: "to spend (money)"
    reading: "kharcu peṭṭaḍam"
    ipa: "kʰartʃu peʈʈaɖam"
    alt_target: ["ఖర్చు చేయడం"]
    pos: "phrase"
    notes: "With పెట్టు, put. Also ఖర్చు చేయడం."
  - id: te-0485
    target: "శుభ్రం చేయడం"
    native: "to clean"
    reading: "śubhram cēyaḍam"
    ipa: "ʃubʱram tʃeːjaɖam"
    pos: "phrase"
  - id: te-0486
    target: "ప్రయాణం చేయడం"
    native: "to travel"
    reading: "prayāṇam cēyaḍam"
    ipa: "prajaːɳam tʃeːjaɖam"
    pos: "phrase"
  - id: te-0487
    target: "మొదలు పెట్టడం"
    native: "to begin"
    reading: "modalu peṭṭaḍam"
    ipa: "mod̪alu peʈʈaɖam"
    pos: "phrase"
    notes: "మొదలు, a beginning, with పెట్టు, put."
  - id: te-0488
    target: "ఆలస్యం చేయడం"
    native: "to delay; to be late"
    reading: "ālasyam cēyaḍam"
    ipa: "aːlasjam tʃeːjaɖam"
    pos: "phrase"
    notes: "ఆలస్యం చేయకండి, please don't delay."
  - id: te-0489
    target: "భయపడడం"
    native: "to be afraid"
    reading: "bhayapaḍaḍam"
    ipa: "bʱajapaɖaɖam"
    pos: "noun"
    notes: "భయం, fear, and పడడం, to fall: నేను భయపడ్డాను, I was afraid."
  - id: te-0490
    target: "కష్టపడడం"
    native: "to work hard; to struggle"
    reading: "kaṣṭapaḍaḍam"
    ipa: "kaʂʈapaɖaɖam"
    pos: "noun"
  - id: te-0491
    target: "ఇష్టపడడం"
    native: "to like; to be fond of"
    reading: "iṣṭapaḍaḍam"
    ipa: "iʂʈapaɖaɖam"
    pos: "noun"
    notes: "Here the one who likes is the doer: నేను సంగీతాన్ని ఇష్టపడతాను, I like music. With ఇష్టం, the one who likes takes -కు instead."
