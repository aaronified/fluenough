  - id: te-0479
    target: "పని చేయడం"
    native: "to work"
    reading: "pani cēyaḍam"
    ipa: "pani tʃeːjaɖam"
    pos: "phrase"
    notes: "పని (pani), work, and చేయడం (cēyaḍam), to do. So too స్నానం చేయడం (snānam cēyaḍam), to bathe, and వంట చేయడం (vaṇṭa cēyaḍam), to cook."
    bases:
      - { word: "చేయడం", base: "చేయడం", reading: "cēyaḍam", meaning: "to do; to make" }
