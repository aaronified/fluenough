          - { "word": "దూకుతాడు", "base": "దూకడం", "reading": "dūkutāḍu" }
      - target: "ఆ కుక్క ఒక్కసారిగా దూకుతుంది."
        reading: "ā kukka okkasārigā dūkutundi."
        ipa: "aː kukka okkasaːriɡaː d̪uːkut̪und̪i"
