  "sentences":
      - "text": "నేను కొన్న చొక్కా బాగా ఉంది."
        "reading": "nēnu konna cokkā bāgā undi."
        "ipa": "neːnu konna tʃokkaː baːɡaː und̪i"
      - "text": "నాకు సహాయం చేసిన అమ్మాయి చాలా మంచి అమ్మాయి."
        "reading": "nāku sahāyaṁ cēsina ammāyi cālā mañci ammāyi."
        "ipa": "naːku sahaːjam tʃeːsina ammaːji tʃaːlaː maɲtʃi ammaːji"
      - "text": "ఈ దుకాణంలో అమ్మిన చొక్కా ధర తక్కువ."
        "reading": "ī dukāṇamlō ammina cokkā dhara takkuva."
        "ipa": "iː d̪ukaːɳamloː ammina tʃokkaː d̪ʱara t̪akkuʋa"
      - "text": "ఇక్కడ పని చేసే వాళ్ళు త్వరగా సహాయం చేస్తారు."
        "reading": "ikkaḍa pani cēsē vāḷḷu tvaragā sahāyaṁ cēstāru."
        "ipa": "ikkaɖa pani tʃeːseː ʋaːɭɭu t̪ʋaraɡaː sahaːjam tʃeːst̪aːru"
