    "reading": "nēnu ippaṭikē tini unnānu."
    "ipa": "neːnu ippaʈikeː t̪ini unnaːnu"
  - "text": "వాళ్ళు ఇంటికి వచ్చి ఉన్నారు."
    "reading": "vāḷḷu iṇṭiki vacci unnāru."
