  - id: "te-0805"
    target: "మీద"
    reading: "mīda"
    ipa: "miːd̪a"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "బల్ల మీద", reading: "balla mīda" }] }
    "examples": [
      {"target": "ఒడ్డు మీద కూర్చున్నాను.", "reading": "oḍḍu mīda kūrcunnānu.", "ipa": "oɖɖu miːd̪a kuːrtʃunnaːnu", "bases": [{"word": "కూర్చున్నాను", "base": "కూర్చోవడం", "reading": "kūrcōvaḍam"}]},
      {"target": "బెంచీ మీద కూర్చోండి.", "reading": "beñcī mīda kūrcōṇḍi.", "ipa": "beɲtʃiː miːd̪a kuːrtʃoːɳɖi", "bases": [{"word": "బెంచీ", "base": "బెంచ్", "reading": "beñc"}, {"word": "కూర్చోండి", "base": "కూర్చోవడం", "reading": "kūrcōvaḍam"}]}
    ]
  - id: "te-0806"
    target: "చుట్టూ"
    reading: "cuṭṭū"
    ipa: "tʃuʈʈuː"
