  - id: "te-0798"
    target: "పైన"
    reading: "paina"
    ipa: "paina"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "బల్ల పైన", reading: "balla paina" }, { word: "మీద", reading: "mīda" }] }
    "examples": [
      {"target": "నాకు పైన బెర్త్ ఇవ్వండి.", "reading": "nāku paina bert ivvaṇḍi.", "ipa": "naːku paina bert ʋiʋʋaɳɖi", "bases": [{"word": "ఇవ్వండి", "base": "ఇవ్వడం", "reading": "ivvaḍaṁ"}, {"word": "నాకు", "ref": "te-0593"}]}
    ]
  - id: "te-0799"
    target: "కింద"
    reading: "kinda"
    ipa: "kind̪a"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "బల్ల కింద", reading: "balla kinda" }] }
    "examples": [
      {"target": "వంతెన కింద నది ఉంది.", "reading": "vantena kinda nadi undi.", "ipa": "ʋant̪ena kind̪a nad̪i und̪i", "bases": [{"word": "ఉంది", "ref": "te-0633"}]},
      {"target": "ఓవర్‌బ్రిడ్జ్ ఎక్కండి, తర్వాత కిందకి దిగండి.", "reading": "ōvarbriḍj ekkaṇḍi, tarvāta kindaki digaṇḍi.", "ipa": "oːʋarbridʒ ekkaɳɖi t̪arʋaːt̪aː kindaki d̪igaɳɖi", "bases": [{"word": "ఎక్కండి", "ref": "te-0827"}, {"word": "దిగండి", "ref": "te-0828"}, {"word": "కిందకి", "base": "కింద", "reading": "kinda"}]}
    ]
  - id: "te-0800"
    target: "లోపల"
    reading: "lōpala"
    ipa: "loːpala"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "ఇంటి లోపల", reading: "iṇṭi lōpala" }, { word: "లోపలికి", reading: "lōpaliki" }] }
    "examples": [
      {"target": "మీరు లోపలికి రావచ్చు.", "reading": "mīru lōpaliki rāvaccu.", "ipa": "miːru loːpaliki raːʋatʃtʃu", "bases": [{"word": "లోపలికి", "base": "లోపల", "reading": "lōpala"}, {"word": "రావచ్చు", "ref": "te-0623"}]},
      {"target": "దయచేసి నన్ను లోపలికి అనుమతించండి.", "reading": "dayacēsi nannu lōpaliki anumatiñcaṇḍi.", "ipa": "d̪ajatʃeːsi nannu loːpaliki anumat̪iɲtʃaɳɖi", "bases": [{"word": "నన్ను", "base": "నేను", "reading": "nēnu"}, {"word": "లోపలికి", "base": "లోపల", "reading": "lōpala"}, {"word": "అనుమతించండి", "base": "అనుమతించడం", "reading": "anumatiñcaḍaṁ"}]}
    ]
  - id: "te-0801"
    target: "బయట"
    reading: "bayaṭa"
    ipa: "bajaʈa"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "ఇంటి బయట", reading: "iṇṭi bayaṭa" }, { word: "లోపల", reading: "lōpala" }] }
    "examples": [
      {"target": "పిల్లలు బయట ఆడుకుంటారు.", "reading": "pillalu bayaṭa āḍukuṇṭāru.", "ipa": "pillalu bajaʈa aːɖukuɳʈaːru", "bases": [{"word": "పిల్లలు", "base": "పిల్లవాడు", "reading": "pillavāḍu"}, {"word": "ఆడుకుంటారు", "base": "ఆడుకోవడం", "reading": "āḍukōvaḍam"}]}
    ]
  - id: "te-0802"
    target: "మధ్య"
    reading: "madhya"
    ipa: "mad̪ʱja"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "రెండు ఇళ్ళ మధ్య", reading: "reṇḍu iḷḷa madhya" }] }
    "examples": [
      {"target": "వాళ్ళిద్దరి మధ్య వాదన జరిగింది.", "reading": "vāḷḷiddari madhya vādana jarigindi.", "ipa": "ʋaːɭɭid̪ːari mad̪ʰja ʋaːd̪ana dʒariɡind̪i.", "bases": [{"word": "వాళ్ళిద్దరి", "base": "వాళ్ళు", "reading": "vāḷḷu"}, {"word": "జరిగింది", "base": "జరగడం", "reading": "jaragaḍaṁ"}]},
      {"target": "ఈ దేవాలయం ఊరి మధ్యలో ఉంది.", "reading": "ī dēvālayaṁ ūri madhyalō undi.", "ipa": "iː d̪eːʋaːlajam uːri mad̪ʱjaloː und̪i", "bases": [{"word": "ఈ", "base": "ఈ", "reading": "ī"}, {"word": "ఊరి", "base": "ఊరు", "reading": "ūru"}, {"word": "మధ్యలో", "base": "మధ్య", "reading": "madhya"}, {"word": "ఉంది", "base": "ఉండడం", "reading": "uṇḍaḍaṁ"}]}
    ]
  - id: "te-0803"
    target: "పక్కన"
    reading: "pakkana"
    ipa: "pakkana"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "బ్యాంకు పక్కన", reading: "byāṅku pakkana" }] }
    "examples": [
      {"target": "ఆంధ్రప్రదేశ్ తెలంగాణ పక్కన ఉంది.", "reading": "āndhrapradēś telaṅgāṇa pakkana undi.", "ipa": "aːnd̪ʱraprad̪eːʃ t̪elaŋɡaːɳa pakkana und̪i", "bases": [{"word": "ఉంది", "ref": "te-0633"}]},
      {"target": "ఆమె విసుగ్గా ఫోన్ పక్కన పెట్టింది.", "reading": "āme visuggā phōn pakkana peṭṭindi.", "ipa": "aːme ʋisuɡɡaː pʰoːn pakkana peʈʈind̪i", "bases": [{"word": "పెట్టింది", "base": "పెట్టడం", "reading": "peṭṭaḍam"}]}
    ]
