    notes:
      - { id: "n1", kind: "usage", words: [{ word: "ఇంటి చుట్టూ", reading: "iṇṭi cuṭṭū" }] }
    "examples": [
      {"target": "పట్నం చుట్టూ పచ్చదనం పుష్కలంగా ఉంది.", "reading": "paṭnaṁ cuṭṭū paccadanaṁ puṣkalaṅgā undi.", "ipa": "paʈnam tʃuʈʈuː patʃtʃad̪anam puʂkalaŋɡaː und̪i", "bases": [{"word": "ఉంది", "ref": "te-0633"}, {"word": "పుష్కలంగా", "base": "పుష్కలం", "reading": "puṣkalam"}]}
    ]
  - id: "te-0807"
    target: "వైపు"
    reading: "vaipu"
    ipa: "ʋaipu"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "ఆ వైపు", reading: "ā vaipu" }] }
    "examples": [
      {"target": "ఉత్తరం ఏ వైపు?", "reading": "uttaraṁ ē vaipu?", "ipa": "ut̪t̪aram eː ʋaipu", "bases": []},
      {"target": "బస్సు పడమర వైపు వెళ్తోంది.", "reading": "bassu paḍamara vaipu veḷtōndi.", "ipa": "bassu paɖamara ʋaipu ʋeɭt̪oːnd̪i", "bases": [{"word": "వెళ్తోంది", "base": "వెళ్లడం", "reading": "veḷlaḍam"}]}
    ]
