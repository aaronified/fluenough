cards:
  - id: "te-5900"
    target: "మాత్రం"
    reading: "mātram"
    ipa: "maːt̪ram"
    pos: "other"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - target: "అందరూ వచ్చారు, నేను మాత్రం రాలేదు."
        reading: "andarū vaccāru, nēnu mātram rālēdu."
        ipa: "and̪aruː vattʃaːru neːnu maːt̪ram raːleːd̪u"
        bases:
          - { word: "వచ్చారు", base: "రావడం", reading: "rāvaḍam" }
          - { word: "రాలేదు", base: "రావడం", reading: "rāvaḍam" }
      - target: "ఒక్క మాట మాత్రం చెప్పు."
        reading: "okka māṭa mātram ceppu."
        ipa: "okːa maːʈa maːt̪ram tʃepːu"
        bases:
          - { word: "చెప్పు", base: "చెప్పడం", reading: "ceppaḍam" }
  - id: "te-5901"
    target: "అయినా"
    reading: "ayinā"
    ipa: "ajinaː"
    pos: "other"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - target: "అతను ధనవంతుడు అయినా సంతోషంగా లేడు."
        reading: "atanu dhanavantuḍu ayinā santōṣaṅgā lēḍu."
        ipa: "at̪anu d̪ʱanavant̪uɖu ajinaː sant̪oːʂaŋgaː leːɖu"
      - target: "చాలా ఆలస్యమైంది, అయినా వెళ్దాం."
        reading: "cālā ālasyamaindi, ayinā veḷdāṁ."
        ipa: "tʃaːlaː aːlasjamaind̪i ajinaː veɭd̪aːm"
        bases:
          - { word: "వెళ్దాం", base: "వెళ్ళడం", reading: "veḷḷaḍaṁ" }
  - id: "te-5902"
    target: "అసలు"
    reading: "asalu"
    ipa: "asalu"
    pos: "other"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - target: "అసలు ఇది నా తప్పు కాదు."
        reading: "asalu idi nā tappu kādu."
        ipa: "asalu id̪i naː t̪appu kaːd̪u"
      - target: "అసలు నిజం ఏమిటి?"
        reading: "asalu nijaṁ ēmiṭi?"
        ipa: "asalu nidʒam eːmiʈi"
  - id: "te-5903"
    target: "ఇదే"
    reading: "idē"
    ipa: "id̪eː"
    pos: "pronoun"
    bases: "te-0600"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - target: "నాకు కావాల్సింది ఇదే."
        reading: "nāku kāvālsindi idē."
        ipa: "naːku kaːʋaːlsind̪i id̪eː"
      - target: "ఇదే మంచి సమయం."
        reading: "idē manci samayaṁ."
        ipa: "id̪eː mant͡ʃi samajam"
  - id: "te-5904"
    target: "కదా"
    reading: "kadā"
    ipa: "kad̪aː"
    pos: "other"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - target: "ఈ రోజు చల్లగా ఉంది కదా?"
        reading: "ī rōju callagā undi kadā?"
        ipa: "iː roːdʒu tʃalːaɡaː und̪i kad̪aː"
        bases:
          - { word: "ఉంది", base: "ఉండడం", reading: "uṇḍaḍaṁ" }
      - target: "నువ్వు రేపు వస్తావు కదా?"
        reading: "nuvvu rēpu vastāvu kadā?"
        ipa: "nuʋʋu reːpu vast̪aːʋu kad̪aː"
        bases:
          - { word: "వస్తావు", base: "రావడం", reading: "rāvaḍaṁ" }
  - id: "te-5905"
    target: "ఎంతో"
    reading: "entō"
    ipa: "ent̪oː"
    pos: "adv"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - target: "ఈ సినిమా ఎంతో బాగుంది."
        reading: "ī sinimā entō bāgundi."
        ipa: "iː sinimaː ent̪oː baːɡund̪i"
      - target: "నాకు ఎంతో ఆనందంగా ఉంది."
        reading: "nāku entō ānandaṅgā undi."
        ipa: "naːku ent̪oː aːnand̪aŋgaː und̪i"
        bases:
          - { word: "ఉంది", base: "ఉండడం", reading: "uṇḍaḍaṁ" }
  - id: "te-5906"
    target: "ఇప్పుడే"
    reading: "ippuḍē"
    ipa: "ippuɖeː"
    pos: "adv"
    bases: "te-0309"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - target: "ఇప్పుడే వస్తాను."
        reading: "ippuḍē vastānu."
        ipa: "ippuɖeː vast̪aːnu"
        bases:
          - { word: "వస్తాను", base: "రావడం", reading: "rāvaḍaṁ" }
      - target: "అతను ఇప్పుడే వెళ్ళాడు."
        reading: "atanu ippuḍē veḷḷāḍu."
        ipa: "at̪anu ippuɖeː veɭɭaːɖu"
        bases:
          - { word: "వెళ్ళాడు", base: "వెళ్ళడం", reading: "veḷḷaḍaṁ" }
  - id: "te-5907"
    target: "తప్పకుండా"
    reading: "tappakuṇḍā"
    ipa: "t̪appakuɳɖaː"
    pos: "adv"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - target: "రేపు తప్పకుండా రండి."
        reading: "rēpu tappakuṇḍā raṇḍi."
        ipa: "reːpu t̪appakuɳɖaː raɳɖi"
        bases:
          - { word: "రండి", base: "రావడం", reading: "rāvaḍaṁ" }
      - target: "నేను తప్పకుండా పరీక్షకు వెళ్తాను."
        reading: "nēnu tappakuṇḍā parīkṣaku veltānu."
        ipa: "neːnu t̪appakuɳɖaː pariːkʂaku ʋelt̪aːnu"
        bases:
          - { word: "వెళ్తాను", base: "వెళ్ళడం", reading: "veḷḷaḍaṁ" }
  - ref: "te-0359"
