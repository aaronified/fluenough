  "title": "A formal letter and its closing"
  "sentences":
  - "text": "సార్, మీరు ఎలా ఉన్నారు?"
    "reading": "sār, mīru elā unnāru?"
    "ipa": "saːr miːru elaː unnaːru"
  - "text": "మీరు నాకు సహాయం చేయండి."
    "reading": "mīru nāku sahāyaṁ cēyaṇḍi."
    "ipa": "miːru naːku sahaːjam tʃeːjaɳɖi"
  - "text": "నాకు సమయం ఇవ్వండి."
    "reading": "nāku samayaṁ ivvaṇḍi."
    "ipa": "naːku samajam iʋʋaɳɖi"
  - "text": "మీకు ధన్యవాదాలు సార్."
    "reading": "mīku dhanyavādālu sār."
    "ipa": "miːku d̪ʱanjaʋaːd̪aːlu saːr"
