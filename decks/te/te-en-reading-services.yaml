  "title": "Bank form"
  "sentences":
  - "text": "ఈ ఫారం నింపండి."
    "reading": "ī phāraṁ nimpaṇḍi."
    "ipa": "iː pʰaːram nimpaɳɖi"
  - "text": "చిరునామా ఈ ఫారంలో రాయండి."
    "reading": "cirunāmā ī phāramlō rāyaṇḍi."
    "ipa": "tʃirunaːmaː iː pʰaːramloː raːjaɳɖi"
  - "text": "గుర్తింపు కార్డు చూపించండి."
    "reading": "gurtimpu kārḍu cūpiñcaṇḍi."
    "ipa": "ɡurt̪impu kaːrɖu tʃuːpiɲtʃaɳɖi"
  - "text": "పిన్ ఎవరికీ చెప్పకండి."
    "reading": "pin evarikī ceppakaṇḍi."
    "ipa": "pin eʋarikiː tʃeppakaɳɖi"
