schema: 1
id: te-en-script-reading
name: "First words to read"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Short everyday words written with letters alone, no vowel signs: the tick, the vowel you do not see, the circle and doubled letters, at work."
tags: [beginner, unreviewed, script]
cards:
  - id: te-en-script-reading-0001
    target: "అల"
    native: "wave"
    reading: "ala"
    notes: "అ is the vowel a itself, and ల carries its short a, which is said at the end: a-la."
  - id: te-en-script-reading-0002
    target: "తల"
    native: "head"
    reading: "tala"
    notes: "త has the tick on top; ల doesn't. Both carry a."
  - id: te-en-script-reading-0003
    target: "కల"
    native: "dream"
    reading: "kala"
    notes: "క and ల, each with its a. With the curled-back ళ it would be కళ, art."
  - id: te-en-script-reading-0004
    target: "వల"
    native: "net (for fishing)"
    reading: "vala"
    notes: "వ is between v and w."
  - id: te-en-script-reading-0005
    target: "నగ"
    native: "jewel"
    reading: "naga"
    notes: "న and గ both wear the tick on top."
  - id: te-en-script-reading-0006
    target: "కలం"
    native: "pen"
    reading: "kalam"
    notes: "The circle ం at the end is an m: kalam."
  - id: te-en-script-reading-0007
    target: "జనం"
    native: "people; a crowd"
    reading: "janam"
    notes: "జ, న and the circle for m."
  - id: te-en-script-reading-0008
    target: "పదం"
    native: "word"
    reading: "padam"
    notes: "ప and ద, then the circle for m."
  - id: te-en-script-reading-0009
    target: "రథం"
    native: "chariot"
    reading: "ratham"
    notes: "థ is the t on the teeth with a breath after it."
  - id: te-en-script-reading-0010
    target: "సమయం"
    native: "time (the moment); an occasion"
    reading: "samayam"
    notes: "స is s, never sh; the circle at the end is m."
  - id: te-en-script-reading-0011
    target: "నగరం"
    native: "city"
    reading: "nagaram"
    notes: "Three letters with their a, and the circle for m."
  - id: te-en-script-reading-0012
    target: "అమ్మ"
    native: "mother"
    reading: "amma"
    notes: "A doubled m, held longer. The second మ is its vattu, a small hook at the lower right that looks little like మ."
  - id: te-en-script-reading-0013
    target: "అక్క"
    native: "elder sister"
    reading: "akka"
    notes: "A doubled k: the second క sits below the first as its vattu. Calling to her, you say అక్కా (akkaa)."
  - id: te-en-script-reading-0014
    target: "అన్న"
    native: "elder brother"
    reading: "anna"
    notes: "A doubled n, held longer: a-nna. Calling to him, you say అన్నా (annaa)."
  - id: te-en-script-reading-0015
    target: "అత్త"
    native: "aunt (father's sister, or mother's brother's wife); mother-in-law"
    reading: "atta"
    notes: "A doubled t on the teeth."
