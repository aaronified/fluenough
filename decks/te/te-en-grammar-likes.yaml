schema: 1
id: te-en-grammar-likes
name: "Likes"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "ఇష్టం and నచ్చు: what you like, and what you liked. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - ref: te-0151
  - id: te-0469
    target: "ఇష్టం"
    native: "liking; dear to someone"
    reading: "ishtam"
    pos: "noun"
    notes: "The one who likes takes -కు: నాకు ఇష్టం, I like it, 'to me it is dear'."
  - id: te-0470
    target: "నాకు టీ ఇష్టం."
    native: "I like tea."
    reading: "naaku tii ishtam."
    pos: "phrase"
  - id: te-0471
    target: "నాకు కాఫీ ఇష్టం లేదు."
    native: "I don't like coffee."
    reading: "naaku kaafii ishtam leedu."
    pos: "phrase"
  - id: te-0472
    target: "మీకు ఏం ఇష్టం?"
    native: "What do you like?"
    reading: "miiku eem ishtam?"
    pos: "phrase"
  - id: te-0473
    target: "నాకు సినిమాలు చూడడం ఇష్టం."
    native: "I like watching films."
    reading: "naaku sinimaalu chuudadam ishtam."
    pos: "phrase"
    notes: "An action you like takes the -డం form: చూడడం, watching."
  - id: te-0474
    target: "నచ్చడం"
    native: "to be liked; to please"
    reading: "nachchadam"
    pos: "verb"
    notes: "For a thing tried or seen: నాకు నచ్చింది, I liked it. ఇష్టం is a lasting liking."
  - id: te-0475
    target: "నాకు నచ్చింది."
    native: "I liked it."
    reading: "naaku nachchindi."
    pos: "phrase"
  - id: te-0476
    target: "నాకు నచ్చలేదు."
    native: "I didn't like it."
    reading: "naaku nachchaleedu."
    pos: "phrase"
  - id: te-0477
    target: "ఇది మీకు నచ్చిందా?"
    native: "Did you like it?"
    reading: "idi miiku nachchindaa?"
    pos: "phrase"
  - id: te-0478
    target: "నేను నిన్ను ప్రేమిస్తున్నాను."
    native: "I love you."
    reading: "neenu ninnu preemistunnaanu."
    pos: "phrase"
