- "id": "te-clean-up-notice"
  "title": "Clean-up notice"
  "sentences":
  - "text": "ఈ ఆదివారం ఉదయం వీధిలో శుభ్రత కార్యక్రమం ఉంది."
    "reading": "ī ādivāraṁ udayaṁ vīdhilō śubhrata kāryakramaṁ undi."
    "ipa": "iː aːd̪iʋaːram ud̪ajam ʋiːd̪ʱiloː ʃubʱrat̪a kaːrjakramam und̪i"
  - "text": "శుభ్రత కోసం చెత్తను చెత్తకుండీలో వేయండి."
    "reading": "śubhrata kōsaṁ cettanu cettakuṇḍīlō vēyaṇḍi."
    "ipa": "ʃubʱrat̪a koːsam tʃet̪t̪anu tʃet̪t̪akuɳɖiːloː ʋeːjaɳɖi"
  - "text": "కాలువలో చెత్త వేయకండి."
    "reading": "kāluvalō cetta vēyakaṇḍi."
    "ipa": "kaːluʋaloː tʃet̪t̪a ʋeːjakaɳɖi"
  - "text": "చెత్తకుండీ ఖాళీ చేయండి."
    "reading": "cettakuṇḍī khāḷī cēyaṇḍi."
    "ipa": "tʃet̪t̪akuɳɖiː kʰaːɭiː tʃeːjaɳɖi"
