schema: 1
id: te-en-grammar-differences
name: "How Telugu grammar differs from English"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Before any theme: the verb last, no is, endings for in, to and with, a verb for he against one shared by she and it, two yous, two wes, no articles, and how Telugu says have, not and questions."
tags: [beginner, unreviewed, grammar]
cards:
  - id: te-0117
    target: "నేను అన్నం తింటాను."
    native: "I eat rice."
    reading: "nēnu annam tiṇṭānu."
    ipa: "neːnu annam t̪iɳʈaːnu"
    tags: ["grammar", "word-order"]
    notes: "The verb comes last: subject, object, verb. Word for word, 'I rice eat'."
    bases:
      - { word: "నేను", ref: "te-0593" }
      - { word: "తింటాను", ref: "te-0624" }
  - id: te-0118
    target: "ఆయన డాక్టర్."
    native: "He is a doctor."
    reading: "āyana ḍākṭar."
    ipa: "aːjana ɖaːkʈar"
    tags: ["grammar", "no-is"]
    notes: "No 'is' when you say what someone is: 'he doctor'."
    bases:
      - { word: "ఆయన", ref: "te-0597" }
  - id: te-0119
    target: "గదిలో"
    native: "in the room"
    reading: "gadilō"
    ipa: "ɡad̪iloː"
    tags: ["grammar", "case-endings"]
    notes: "Telugu puts 'in' after the noun, as an ending: గది (gadi, room) + -లో (-lō)."
  - id: te-0120
    target: "బడికి"
    native: "to school"
    reading: "baḍiki"
    ipa: "baɖiki"
    tags: ["grammar", "case-endings"]
    notes: "'To' is the ending -కి (-ki) or -కు (-ku): బడి (baḍi, school) + -కి (-ki)."
  - id: te-0121
    target: "అమ్మతో"
    native: "with mother"
    reading: "ammatō"
    ipa: "ammat̪oː"
    tags: ["grammar", "case-endings"]
    notes: "'With' is the ending -తో (-tō): అమ్మ (amma) + -తో (-tō)."
  - id: te-0122
    target: "అతను వచ్చాడు."
    native: "He came."
    reading: "atanu vaccāḍu."
    ipa: "at̪anu ʋatʃtʃaːɖu"
    tags: ["grammar", "gender"]
    pos: "phrase"
    notes: "The verb shows whether 'he' is a man: -డు (-ḍu). రావడం (rāvaḍam) changes its stem in the past: వచ్చ- (vacc-)."
    bases:
      - { word: "అతను", ref: "te-0595" }
      - { word: "వచ్చాడు", ref: "te-0623" }
  - id: te-0123
    target: "ఆమె వచ్చింది."
    native: "She came."
    reading: "āme vaccindi."
    ipa: "aːme ʋatʃtʃind̪i"
    tags: ["grammar", "gender"]
    pos: "phrase"
    notes: "She and it share the verb ending -ది (-di); he has -డు (-ḍu). For respect: ఆవిడ వచ్చారు (āviḍa vaccāru), she came, just as ఆయన వచ్చారు (āyana vaccāru) for a man. రావడం (rāvaḍam) changes its stem in the past: వచ్చ- (vacc-)."
    bases:
      - { word: "ఆమె", ref: "te-0596" }
      - { word: "వచ్చింది", ref: "te-0623" }
  - id: te-0124
    target: "అది వచ్చింది."
    native: "It came."
    reading: "adi vaccindi."
    ipa: "ad̪i ʋatʃtʃind̪i"
    tags: ["grammar", "gender"]
    pos: "phrase"
    notes: "A thing or an animal takes -ది (-di), the ending 'she' shares: ఆమె వచ్చింది (āme vaccindi). రావడం (rāvaḍam) changes its stem in the past: వచ్చ- (vacc-)."
    bases:
      - { word: "అది", ref: "te-0599" }
      - { word: "వచ్చింది", ref: "te-0623" }
  - id: te-0125
    target: "నువ్వు రా."
    native: "Come! (to a friend)"
    reading: "nuvvu rā."
    ipa: "nuʋʋu raː"
    tags: ["grammar", "two-yous"]
    notes: "Two words for 'you': నువ్వు (nuvvu) to a friend, a child or a younger person."
    bases:
      - { word: "నువ్వు", ref: "te-0594" }
      - { word: "రా", ref: "te-0623" }
  - id: te-0126
    target: "మీరు రండి."
    native: "Please come."
    reading: "mīru raṇḍi."
    ipa: "miːru raɳɖi"
    tags: ["grammar", "two-yous"]
    notes: "మీరు (mīru) is the respectful 'you', and the plural, and its verb ends in -ండి (-aṇḍi)."
    bases:
      - { word: "రండి", ref: "te-0623" }
  - id: te-0127
    target: "మనం"
    native: "we (you and I)"
    reading: "manam"
    ipa: "manam"
    tags: ["grammar", "two-wes"]
    notes: "Two words for 'we': మనం (manam) includes the person you're talking to."
  - id: te-0128
    target: "మేము"
    native: "we (not you)"
    reading: "mēmu"
    ipa: "meːmu"
    tags: ["grammar", "two-wes"]
    notes: "మేము (mēmu) leaves the person you're talking to out."
  - id: te-0129
    target: "వస్తాను."
    native: "I'll come."
    reading: "vastānu."
    ipa: "ʋast̪aːnu"
    tags: ["grammar", "person-endings"]
    notes: "The ending -ను (-nu) says 'I', so నేను (nēnu) can be left out."
  - id: te-0130
    target: "ఒక పుస్తకం"
    native: "a book; one book"
    picture: "📖"
    reading: "oka pustakam"
    ipa: "oka pust̪akam"
    tags: ["grammar", "articles"]
    notes: "No word for 'the', and ఒక (oka), 'one', serves for 'a'."
    bases:
      - { word: "ఒక", ref: "te-1034" }
      - { word: "పుస్తకం", ref: "te-0865" }
  - id: te-0131
    target: "నా దగ్గర పుస్తకం ఉంది."
    native: "I have a book."
    reading: "nā daggara pustakam undi."
    ipa: "naː d̪aɡɡara pust̪akam und̪i"
    tags: ["grammar", "have"]
    notes: "No verb 'have': 'near me a book is'."
    bases:
      - { word: "నా", ref: "te-0593" }
      - { word: "పుస్తకం", ref: "te-0865" }
      - { word: "ఉంది", ref: "te-0633" }
  - id: te-0132
    target: "నేను రాను."
    native: "I won't come."
    reading: "nēnu rānu."
    ipa: "neːnu raːnu"
    tags: ["grammar", "negation"]
    notes: "'Not' is built into the verb: రాను (rānu) is 'won't come', వస్తాను (vastānu) 'will come'."
    bases:
      - { word: "నేను", ref: "te-0593" }
      - { word: "రాను", ref: "te-0623" }
  - id: te-0133
    target: "సమయం లేదు."
    native: "There's no time."
    reading: "samayam lēdu."
    ipa: "samajam leːd̪u"
    tags: ["grammar", "negation"]
    notes: "లేదు (lēdu) is 'there is not', the opposite of ఉంది (undi)."
  - id: te-0134
    target: "మీరు వస్తారా?"
    native: "Will you come?"
    reading: "mīru vastārā?"
    ipa: "miːru ʋast̪aːraː"
    tags: ["grammar", "questions"]
    notes: "A yes-or-no question ends in -ఆ (-ā): మీరు వస్తారు (you will come) becomes మీరు వస్తారా (mīru vastārā), the last u turned into a long a. రావడం (rāvaḍam) changes its stem in the present and future: వస్- (vas-)."
    bases:
      - { word: "వస్తారా", ref: "te-0623" }
