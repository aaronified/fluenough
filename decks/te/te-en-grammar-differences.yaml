schema: 1
id: te-en-grammar-differences
name: "How Telugu grammar differs from English"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Before any theme: the verb last, no is, endings for in, to and with, a man's verb against a woman's or a thing's, two yous, two wes, no articles, and how Telugu says have, not and questions."
tags: [beginner, unreviewed, grammar]
cards:
  - id: te-en-grammar-differences-0001
    target: "నేను అన్నం తింటాను."
    native: "I eat rice."
    reading: "neenu annam tintaanu."
    tags: ["grammar", "word-order"]
    notes: "The verb comes last: subject, object, verb. Word for word, 'I rice eat'."
  - id: te-en-grammar-differences-0002
    target: "ఆయన డాక్టర్."
    native: "He is a doctor."
    reading: "aayana daaktar."
    tags: ["grammar", "no-is"]
    notes: "No 'is' when you say what someone is: 'he doctor'."
  - id: te-en-grammar-differences-0003
    target: "గదిలో"
    native: "in the room"
    reading: "gadiloo"
    tags: ["grammar", "case-endings"]
    notes: "Telugu puts 'in' after the noun, as an ending: గది (gadi, room) + -లో."
  - id: te-en-grammar-differences-0004
    target: "బడికి"
    native: "to school"
    reading: "badiki"
    tags: ["grammar", "case-endings"]
    notes: "'To' is the ending -కి or -కు: బడి (badi, school) + -కి."
  - id: te-en-grammar-differences-0005
    target: "అమ్మతో"
    native: "with mother"
    reading: "ammatoo"
    tags: ["grammar", "case-endings"]
    notes: "'With' is the ending -తో: అమ్మ (amma) + -తో."
  - id: te-en-grammar-differences-0006
    target: "అతను వచ్చాడు."
    native: "He came."
    reading: "atanu vachchaadu."
    tags: ["grammar", "gender"]
    notes: "The verb shows whether 'he' is a man: -డు."
  - id: te-en-grammar-differences-0007
    target: "ఆమె వచ్చింది."
    native: "She came."
    reading: "aame vachchindi."
    tags: ["grammar", "gender"]
    notes: "A woman takes the same verb ending as a thing, -ది, not a man's."
  - id: te-en-grammar-differences-0008
    target: "అది వచ్చింది."
    native: "It came."
    reading: "adi vachchindi."
    tags: ["grammar", "gender"]
    notes: "A thing or an animal takes -ది, like a woman: ఆమె వచ్చింది."
  - id: te-en-grammar-differences-0009
    target: "నువ్వు రా."
    native: "Come! (to a friend)"
    reading: "nuvvu raa."
    tags: ["grammar", "two-yous"]
    notes: "Two words for 'you': నువ్వు to a friend, a child or a younger person."
  - id: te-en-grammar-differences-0010
    target: "మీరు రండి."
    native: "Please come."
    reading: "miiru randi."
    tags: ["grammar", "two-yous"]
    notes: "మీరు is the respectful 'you', and the plural, and its verb ends in -ండి."
  - id: te-en-grammar-differences-0011
    target: "మనం"
    native: "we (you and I)"
    reading: "manam"
    tags: ["grammar", "two-wes"]
    notes: "Two words for 'we': మనం includes the person you're talking to."
  - id: te-en-grammar-differences-0012
    target: "మేము"
    native: "we (not you)"
    reading: "meemu"
    tags: ["grammar", "two-wes"]
    notes: "మేము leaves the person you're talking to out."
  - id: te-en-grammar-differences-0013
    target: "వస్తాను."
    native: "I'll come."
    reading: "vastaanu."
    tags: ["grammar", "person-endings"]
    notes: "The ending -ను says 'I', so నేను can be left out."
  - id: te-en-grammar-differences-0014
    target: "ఒక పుస్తకం"
    native: "a book; one book"
    reading: "oka pustakam"
    tags: ["grammar", "articles"]
    notes: "No word for 'the', and ఒక, 'one', serves for 'a'."
  - id: te-en-grammar-differences-0015
    target: "నా దగ్గర పుస్తకం ఉంది."
    native: "I have a book."
    reading: "naa daggara pustakam undi."
    tags: ["grammar", "have"]
    notes: "No verb 'have': 'near me a book is'."
  - id: te-en-grammar-differences-0016
    target: "నేను రాను."
    native: "I won't come."
    reading: "neenu raanu."
    tags: ["grammar", "negation"]
    notes: "'Not' is built into the verb: రాను is 'won't come', వస్తాను 'will come'."
  - id: te-en-grammar-differences-0017
    target: "సమయం లేదు."
    native: "There's no time."
    reading: "samayam leedu."
    tags: ["grammar", "negation"]
    notes: "లేదు is 'there is not', the opposite of ఉంది."
  - id: te-en-grammar-differences-0018
    target: "మీరు వస్తారా?"
    native: "Will you come?"
    reading: "miiru vastaaraa?"
    tags: ["grammar", "questions"]
    notes: "A yes-or-no question ends in -ఆ: మీరు వస్తారు (you will come) becomes మీరు వస్తారా, the last u turned into aa."
