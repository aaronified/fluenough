    pos: "noun"
    "examples": [
      {"target": "రాత్రి చీకటిగా ఉంది.", "reading": "rātri cīkaṭigā uṁdi.", "ipa": "raːt̪ri t͡ʃiːkaʈiɡaː und̪i", "bases": [{"word": "చీకటిగా", "base": "చీకటి", "reading": "cīkaṭi"}, {"word": "ఉంది", "base": "ఉండు", "reading": "uṇḍu"}, {"word": "రాత్రి", "base": "రాత్రి", "reading": "rātri"}]},
      {"target": "రాత్రి ఛార్జ్ చేస్తాను.", "reading": "rātri chārj cēstānu.", "ipa": "raːt̪ri tʃʰaːrdʒ tʃeːst̪aːnu", "bases": [{"word": "రాత్రి", "base": "రాత్రి", "reading": "rātri"}, {"word": "చేస్తాను", "base": "చేయడం", "reading": "cēyaḍam"}, {"word": "ఛార్జ్", "base": "ఛార్జ్", "reading": "chārj"}]}
    ]
  - id: "te-0313"
    target: "గంటలు"
    reading: "gaṇṭalu"
    ipa: "ɡaɳʈalu"
    pos: "noun"
    notes:
      - { id: "n1", kind: "note" }
    "examples": [
      {"target": "ప్రయాణ సమయం రెండు గంటలు.", "reading": "prayāṇa samayaṁ reṇḍu gaṇṭalu.", "ipa": "prajaːɳa samajam rendu ganʈalu", "bases": [{"word": "గంటలు", "base": "గంటలు", "reading": "gaṇṭalu"}, {"word": "ప్రయాణ", "ref": "te-1905"}]},
      {"target": "రోజుకు ఎన్ని గంటలు పని?", "reading": "rōjuku enni gaṇṭalu pani?", "ipa": "roːdʒuku enni ɡaɳʈalu pani", "bases": []}
