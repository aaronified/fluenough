    "examples": [
      {"target": "మేము శనివారం గ్యాలరీకి వెళ్తాము.", "reading": "mēmu śanivāraṁ gyālarīki veḷtāmu.", "ipa": "meːmu ʃaniʋaːram ɡjaːlariːki ʋeɭt̪aːmu", "bases": [{"word": "గ్యాలరీకి", "base": "గ్యాలరీ", "reading": "gyālarī"}, {"word": "వెళ్తాము", "base": "వెళ్ళడం", "reading": "veḷḷaḍaṁ"}]},
      {"target": "శనివారం నేను పార్కుకి వెళ్తాను.", "reading": "śanivāraṁ nēnu pārkuki veḷtānu.", "ipa": "ʃaniʋaːram neːnu paːrkuki ʋeɭt̪aːnu", "bases": [{"word": "పార్కుకి", "base": "పార్కు", "reading": "pārku"}, {"word": "వెళ్తాను", "base": "వెళ్ళడం", "reading": "veḷḷaḍaṁ"}]}
    ]
  - id: "te-0324"
