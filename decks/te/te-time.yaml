cards:
  - id: "te-0306"
    target: "ఈరోజు"
    reading: "īrōju"
    ipa: "iːroːdʒu"
    alt_target: ["ఈ రోజు"]
    pos: "adv"
    "examples": [
      {"target": "ఈరోజు చాలా వేడిగా ఉంది.", "reading": "īrōju cālā vēḍigā undi.", "ipa": "iːroːdʒu tʃaːlaː ʋeːɖiɡaː und̪i", "bases": [{"word": "చాలా", "ref": "te-1026"}, {"word": "వేడిగా", "ref": "te-0505"}, {"word": "ఉంది", "ref": "te-0633"}]},
      {"target": "ఈరోజు జాతీయ వార్తలు ఏమిటి?", "reading": "īrōju jātīya vārtalu ēmiṭi?", "ipa": "iːroːdʒu dʒaːt̪iːja ʋaːrt̪alu eːmiʈi", "bases": [{"word": "వార్తలు", "base": "వార్త", "reading": "vārta"}]}
    ]
  - id: "te-0307"
    target: "రేపు"
    reading: "rēpu"
    ipa: "reːpu"
    pos: "adv"
    notes:
      - { id: "n1", kind: "note" }
    "examples": [
      {"target": "టోర్నమెంట్ రేపు మొదలవుతుంది.", "reading": "ṭōrnamenṭ rēpu modalavutundi.", "ipa": "ʈoːrnameɳʈ reːpu mod̪alaʋut̪und̪i", "bases": [{"word": "మొదలవుతుంది", "base": "మొదలవడం", "reading": "modalavaḍaṁ"}]},
      {"target": "మనం రేపు కలుస్తాం.", "reading": "manaṁ rēpu kalustāṁ.", "ipa": "manam reːpu kalust̪aːm", "bases": [{"word": "కలుస్తాం", "ref": "te-0649"}]}
    ]
  - id: "te-0308"
    target: "నిన్న"
    reading: "ninna"
    ipa: "ninna"
    pos: "adv"
    "examples": [
      {"target": "నిన్న రాత్రి ఒక పెద్ద అగ్నిప్రమాదం జరిగింది.", "reading": "ninna rātri oka pedda agnipramādaṁ jarigindi.", "ipa": "ninna raːt̪ri oka ped̪d̪a aɡnipramaːd̪am dʒariɡind̪i", "bases": [{"word": "నిన్న", "base": "నిన్న", "reading": "ninna"}, {"word": "రాత్రి", "base": "రాత్రి", "reading": "rātri"}, {"word": "ఒక", "base": "ఒక", "reading": "oka"}, {"word": "పెద్ద", "base": "పెద్ద", "reading": "pedda"}, {"word": "జరిగింది", "base": "జరగడం", "reading": "jaragaḍaṁ"}]}
    ]
  - id: "te-0309"
    target: "ఇప్పుడు"
    reading: "ippuḍu"
    ipa: "ippuɖu"
    pos: "adv"
    "examples": [
      {"target": "ఇప్పుడు వెళ్ళు.", "reading": "ippuḍu veḷḷu.", "ipa": "ippuɖu ʋeɭɭu", "bases": [{"word": "ఇప్పుడు", "base": "ఇప్పుడు", "reading": "ippuḍu"}, {"word": "వెళ్ళు", "ref": "te-0622"}]},
      {"target": "ఆమె ఇప్పుడు దువ్వుకుంటుంది.", "reading": "āme ippuḍu duvvukuṇṭundi.", "ipa": "aːme ippuɖu d̪uʋʋukuɳʈund̪i", "bases": [{"word": "దువ్వుకుంటుంది", "base": "దువ్వుకోవడం", "reading": "duvvukōvaḍam"}]}
    ]
