      {"target": "నేను ప్రతి ఆదివారం ఈత కొడతాను.", "reading": "nēnu prati ādivāraṁ īta koḍatānu.", "ipa": "neːnu prat̪i aːd̪iʋaːram iːt̪a koɖat̪aːnu", "bases": [{"word": "కొడతాను", "base": "కొట్టడం", "reading": "koṭṭaḍaṁ"}]}
