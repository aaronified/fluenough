    reading: "vāraṁ"
    ipa: "ʋaːram"
    pos: "noun"
    "examples": [
      {"target": "ఈ వారం రీఛార్జ్ చేశావా?", "reading": "ī vāraṁ rīchārj cēśāvā?", "ipa": "iː ʋaːram riːtʃʰaːrdʒ tʃeːʃaːʋaː", "bases": [{"word": "ఈ", "base": "ఈ", "reading": "ī"}, {"word": "వారం", "base": "వారం", "reading": "vāraṁ"}, {"word": "చేశావా", "base": "చేయడం", "reading": "cēyaḍam"}, {"word": "రీఛార్జ్", "base": "రీఛార్జ్", "reading": "rīchārj"}]},
      {"target": "ప్రతి వారం బ్యాకప్ ఉండాలి.", "reading": "prati vāraṁ byākap uṇḍāli.", "ipa": "prat̪i ʋaːram bjaːkap uɳɖaːli", "bases": [{"word": "ఉండాలి", "base": "ఉండడం", "reading": "uṇḍaḍam"}]}
