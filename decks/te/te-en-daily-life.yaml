    target: "నేను ఎప్పుడూ ఆలస్యంగా రాను."
    native: "I'm never late."
    reading: "nēnu eppuḍū ālasyaṅgā rānu."
    ipa: "neːnu eppuɖuː aːlasjaŋɡaː raːnu"
    pos: "phrase"
    notes: "'Never' is ఎప్పుడూ (eppuḍū) with a negative verb: 'I always don't come late'."
    bases:
      - { word: "నేను", ref: "te-0593" }
      - { word: "ఆలస్యంగా", base: "ఆలస్యం", reading: "ālasyam", meaning: "delay; lateness" }
      - { word: "రాను", ref: "te-0623" }
