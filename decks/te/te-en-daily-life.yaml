description: "The day from waking to sleeping, and how often things happen. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: te-0441
    target: "లేవడం"
    native: "to get up"
    reading: "levadam"
    pos: "verb"
    notes: "పొద్దున లేవడం, to get up in the morning."
  - id: te-0442
    target: "స్నానం చేయడం"
    native: "to bathe; to have a shower"
    reading: "snanam cheyadam"
    pos: "phrase"
  - id: te-0443
    target: "పళ్ళు తోముకోవడం"
    native: "to brush one's teeth"
    reading: "pallu tomukovadam"
    pos: "phrase"
  - id: te-0444
    target: "టిఫిన్"
    native: "breakfast; a light meal"
    reading: "tifin"
    pos: "noun"
    notes: "Many homes call breakfast టిఫిన్: idli, dosa or upma."
  - id: te-0445
    target: "మధ్యాహ్న భోజనం"
    native: "lunch"
    reading: "madhyahna bhojanam"
    pos: "phrase"
  - id: te-0446
    target: "రాత్రి భోజనం"
    native: "dinner"
    reading: "ratri bhojanam"
    pos: "phrase"
  - id: te-0447
    target: "పనికి వెళ్ళడం"
    native: "to go to work"
    reading: "paniki velladam"
    pos: "phrase"
  - id: te-0448
    target: "ఇంటికి రావడం"
    native: "to come home"
    reading: "intiki ravadam"
    pos: "phrase"
  - id: te-0449
    target: "వంట చేయడం"
    native: "to cook"
    reading: "vanta cheyadam"
    pos: "phrase"
  - id: te-0450
    target: "పడుకోవడం"
    native: "to go to bed; to lie down"
    reading: "padukovadam"
    pos: "verb"
    notes: "To sleep is నిద్రపోవడం (nidrapovadam)."
  - id: te-0451
    target: "రోజూ"
    native: "every day"
    reading: "roju"
    alt_target: ["ప్రతిరోజూ"]
    pos: "adv"
  - id: te-0452
    target: "అప్పుడప్పుడు"
    native: "sometimes"
    reading: "appudappudu"
    pos: "adv"
  - id: te-0453
    target: "ఎప్పుడూ"
    native: "always"
    reading: "eppudu"
    pos: "adv"
    notes: "With a negative verb it means never: నేను ఎప్పుడూ ఆలస్యంగా రాను, I'm never late."
  - id: te-0454
    target: "సాధారణంగా"
    native: "usually"
    reading: "sadharananga"
    pos: "adv"
  - id: te-0455
    target: "తర్వాత"
    native: "after that; then"
    reading: "tarvata"
    pos: "noun"
    notes: "After a noun it means after: భోజనం తర్వాత, after the meal."
  - id: te-0456
    target: "నేను రోజూ ఏడు గంటలకు లేస్తాను."
    native: "I get up at seven every day."
    reading: "nenu roju edu gantalaku lestanu."
    pos: "phrase"
  - id: te-0457
    target: "తర్వాత నేను పనికి వెళ్తాను."
    native: "Then I go to work."
    reading: "tarvata nenu paniki veltanu."
    pos: "phrase"
  - id: te-0458
    target: "నేను రాత్రి పదకొండు గంటలకు పడుకుంటాను."
    native: "I go to bed at eleven at night."
    reading: "nenu ratri padakondu gantalaku padukuntanu."
    pos: "phrase"
  - id: te-0459
    target: "నేను ఎప్పుడూ ఆలస్యంగా రాను."
    native: "I'm never late."
    reading: "nenu eppudu alasyanga ranu."
    pos: "phrase"
    notes: "'Never' is ఎప్పుడూ with a negative verb: 'I always don't come late'."
