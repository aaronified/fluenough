    - lemma: "మనం"
      key: manam
      reading: "manam"
      ipa: "manam"
      gloss: "we, you and I"
      forms:
        "possessive: my, your …": "మన"
        "to: to me …": "మనకు"
        "object: me …": "మనల్ని"
      readings:
        "possessive: my, your …": "mana"
        "to: to me …": "manaku"
        "object: me …": "manalni"
      ipas:
        "possessive: my, your …": "mana"
        "to: to me …": "manaku"
        "object: me …": "manalni"
    - lemma: "వాళ్ళు"
      key: vaallu
      reading: "vāḷḷu"
      ipa: "ʋaːɭɭu"
      gloss: "they"
      forms:
        "possessive: my, your …": "వాళ్ళ"
        "to: to me …": "వాళ్ళకి"
        "object: me …": "వాళ్ళని"
      readings:
        "possessive: my, your …": "vāḷḷa"
        "to: to me …": "vāḷḷaki"
        "object: me …": "vāḷḷani"
      ipas:
        "possessive: my, your …": "ʋaːɭɭa"
        "to: to me …": "ʋaːɭɭaki"
        "object: me …": "ʋaːɭɭani"
