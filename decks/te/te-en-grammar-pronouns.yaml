schema: 1
id: te-en-grammar-pronouns
name: "Pronouns and possessives"
kind: grammar
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I, you, he and she, with my and your, to me, and me as an object. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Personal pronouns"
  slot_name: "form"
  slots: ["possessive: my, your …", "to: to me …", "object: me …"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Telugu has two 'we': మనం includes the listener, మేము leaves them out. మీరు is 'you' for one person you respect and for more than one."
  entries:
    - lemma: "నేను"
      key: neenu
      reading: "nenu"
      gloss: "I"
      forms:
        "possessive: my, your …": "నా"
        "to: to me …": "నాకు"
        "object: me …": "నన్ను"
      readings:
        "possessive: my, your …": "na"
        "to: to me …": "naku"
        "object: me …": "nannu"
    - lemma: "నువ్వు"
      key: nuvvu
      reading: "nuvvu"
      gloss: "you, familiar"
      forms:
        "possessive: my, your …": "నీ"
        "to: to me …": "నీకు"
        "object: me …": "నిన్ను"
      readings:
        "possessive: my, your …": "ni"
        "to: to me …": "niku"
        "object: me …": "ninnu"
    - lemma: "మీరు"
      key: miiru
      reading: "miru"
      gloss: "you, respectful or plural"
      forms:
        "possessive: my, your …": "మీ"
        "to: to me …": "మీకు"
        "object: me …": "మిమ్మల్ని"
      readings:
        "possessive: my, your …": "mi"
        "to: to me …": "miku"
        "object: me …": "mimmalni"
    - lemma: "అతను"
      key: atanu
      reading: "atanu"
      gloss: "he"
      forms:
        "possessive: my, your …": "అతని"
        "to: to me …": "అతనికి"
        "object: me …": "అతన్ని"
      readings:
        "possessive: my, your …": "atani"
        "to: to me …": "ataniki"
        "object: me …": "atanni"
    - lemma: "ఆమె"
      key: aame
      reading: "ame"
      gloss: "she"
      forms:
        "possessive: my, your …": "ఆమె"
        "to: to me …": "ఆమెకు"
        "object: me …": "ఆమెను"
      readings:
        "possessive: my, your …": "ame"
        "to: to me …": "ameku"
        "object: me …": "amenu"
    - lemma: "అది"
      key: adi
      reading: "adi"
      gloss: "it"
      forms:
        "possessive: my, your …": "దాని"
        "to: to me …": "దానికి"
        "object: me …": "దాన్ని"
      readings:
        "possessive: my, your …": "dani"
        "to: to me …": "daniki"
        "object: me …": "danni"
    - lemma: "మేము"
      key: meemu
      reading: "memu"
      gloss: "we, not you"
      forms:
        "possessive: my, your …": "మా"
        "to: to me …": "మాకు"
        "object: me …": "మమ్మల్ని"
      readings:
        "possessive: my, your …": "ma"
        "to: to me …": "maku"
        "object: me …": "mammalni"
    - lemma: "మనం"
      key: manam
      reading: "manam"
      gloss: "we, you and I"
      forms:
        "possessive: my, your …": "మన"
        "to: to me …": "మనకు"
        "object: me …": "మనల్ని"
      readings:
        "possessive: my, your …": "mana"
        "to: to me …": "manaku"
        "object: me …": "manalni"
    - lemma: "వాళ్ళు"
      key: vaallu
      reading: "vallu"
      gloss: "they"
      forms:
        "possessive: my, your …": "వాళ్ళ"
        "to: to me …": "వాళ్ళకి"
        "object: me …": "వాళ్ళని"
      readings:
        "possessive: my, your …": "valla"
        "to: to me …": "vallaki"
        "object: me …": "vallani"
