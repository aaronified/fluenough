        "object: me …": "aːmenu"
    - lemma: "అది"
      key: adi
      reading: "adi"
      ipa: "ad̪i"
      gloss: "it"
      forms:
        "possessive: my, your …": "దాని"
        "to: to me …": "దానికి"
        "object: me …": "దాన్ని"
      readings:
        "possessive: my, your …": "dāni"
        "to: to me …": "dāniki"
        "object: me …": "dānni"
      ipas:
        "possessive: my, your …": "d̪aːni"
        "to: to me …": "d̪aːniki"
        "object: me …": "d̪aːnni"
    - lemma: "మేము"
      key: meemu
      reading: "mēmu"
      ipa: "meːmu"
      gloss: "we, not you"
      forms:
