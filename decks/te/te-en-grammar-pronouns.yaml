schema: 1
id: te-en-grammar-pronouns
name: "Pronouns and possessives"
kind: grammar
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I, you, he and she, with my and your, to me, and me as an object. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Personal pronouns"
  slot_name: "form"
  slots: ["possessive: my, your …", "to: to me …", "object: me …"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Telugu has two 'we': మనం (manam) includes the listener, మేము (mēmu) leaves them out. మీరు (mīru) is 'you' for one person you respect and for more than one."
  entries:
    - lemma: "నేను"
      key: neenu
      reading: "nēnu"
      ipa: "neːnu"
      gloss: "I"
      forms:
        "possessive: my, your …": "నా"
        "to: to me …": "నాకు"
        "object: me …": "నన్ను"
      readings:
        "possessive: my, your …": "nā"
        "to: to me …": "nāku"
        "object: me …": "nannu"
      ipas:
        "possessive: my, your …": "naː"
        "to: to me …": "naːku"
        "object: me …": "nannu"
    - lemma: "నువ్వు"
      key: nuvvu
      reading: "nuvvu"
      ipa: "nuʋʋu"
      gloss: "you, familiar"
      forms:
        "possessive: my, your …": "నీ"
        "to: to me …": "నీకు"
        "object: me …": "నిన్ను"
      readings:
        "possessive: my, your …": "nī"
        "to: to me …": "nīku"
        "object: me …": "ninnu"
      ipas:
        "possessive: my, your …": "niː"
        "to: to me …": "niːku"
        "object: me …": "ninnu"
    - lemma: "మీరు"
      key: miiru
      reading: "mīru"
      ipa: "miːru"
      gloss: "you, respectful or plural"
      forms:
        "possessive: my, your …": "మీ"
        "to: to me …": "మీకు"
        "object: me …": "మిమ్మల్ని"
      readings:
        "possessive: my, your …": "mī"
        "to: to me …": "mīku"
        "object: me …": "mimmalni"
      ipas:
        "possessive: my, your …": "miː"
        "to: to me …": "miːku"
        "object: me …": "mimmalni"
    - lemma: "అతను"
      key: atanu
      reading: "atanu"
      ipa: "at̪anu"
      gloss: "he"
      forms:
        "possessive: my, your …": "అతని"
        "to: to me …": "అతనికి"
        "object: me …": "అతన్ని"
      readings:
        "possessive: my, your …": "atani"
        "to: to me …": "ataniki"
        "object: me …": "atanni"
      ipas:
        "possessive: my, your …": "at̪ani"
        "to: to me …": "at̪aniki"
        "object: me …": "at̪anni"
    - lemma: "ఆమె"
      key: aame
      reading: "āme"
      ipa: "aːme"
      gloss: "she"
      forms:
        "possessive: my, your …": "ఆమె"
        "to: to me …": "ఆమెకు"
        "object: me …": "ఆమెను"
      readings:
        "possessive: my, your …": "āme"
        "to: to me …": "āmeku"
        "object: me …": "āmenu"
      ipas:
        "possessive: my, your …": "aːme"
