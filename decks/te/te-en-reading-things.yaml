  - "text": "ఒక గొడుగు ఉంది."
    "reading": "oka goḍugu undi."
    "ipa": "oka ɡoɖuɡu und̪i"
  - "text": "ఒక ఫోన్ ఉంది."
    "reading": "oka phōn undi."
    "ipa": "oka pʰoːn und̪i"
  - "text": "ఒక గడియారం ఉంది."
    "reading": "oka gaḍiyāraṁ undi."
    "ipa": "oka ɡaɖijaːram und̪i"
