- "id": "te-how-to-card"
  "title": "How to make tea"
  "sentences":
  - "text": "ఒక గిన్నెలో నీళ్ళు పెట్టండి."
    "reading": "oka ginnelō nīḷḷu peṭṭaṇḍi."
    "ipa": "oka ɡinneloː niːɭɭu peʈʈaɳɖi"
  - "text": "పాలు, పంచదార, ఒక చెంచా టీ పొడి వేయండి."
    "reading": "pālu, pañcadāra, oka ceñcā ṭī poḍi vēyaṇḍi."
    "ipa": "paːlu paɲtʃad̪aːra oka tʃeɲtʃaː ʈiː poɖi ʋeːjaɳɖi"
  - "text": "అంతా బాగా కలపండి."
    "reading": "antā bāgā kalapaṇḍi."
    "ipa": "ant̪aː baːɡaː kalapaɳɖi"
  - "text": "ఒక కప్పు టీ తీసుకోండి."
    "reading": "oka kappu ṭī tīsukōṇḍi."
    "ipa": "oka kappu ʈiː t̪iːsukoːɳɖi"
  "questions":
