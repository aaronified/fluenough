  "sentences":
  - "text": "ఇది ఎర్రని సంచి."
    "reading": "idi errani sañci."
    "ipa": "id̪i errani saɲtʃi"
  - "text": "ఈ సంచి చాలా పెద్దది."
    "reading": "ī sañci cālā peddadi."
    "ipa": "iː saɲtʃi tʃaːlaː ped̪d̪ad̪i"
  - "text": "సంచి మీద చిన్న మచ్చ ఉంది."
    "reading": "sañci mīda cinna macca undi."
    "ipa": "saɲtʃi miːd̪a tʃinna matʃtʃa und̪i"
  - "text": "దయచేసి ఇక్కడ అడగండి."
    "reading": "dayacēsi ikkaḍa aḍagaṇḍi."
    "ipa": "d̪ajatʃeːsi ikkaɖa aɖaɡaɳɖi"
