schema: 1
id: te-en-grammar-pitfalls
name: "Pitfalls"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The mistakes English speakers make most in Telugu. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: te-en-grammar-pitfalls-0001
    target: "మనం వెళ్దాం."
    native: "Let's go (you and I)."
    reading: "manam veldaam."
    pos: "phrase"
    notes: "Telugu has two 'we': మనం includes the listener, మేము leaves them out."
  - id: te-en-grammar-pitfalls-0002
    target: "మేము వెళ్తున్నాము."
    native: "We are going (not you)."
    reading: "meemu veltunnaamu."
    pos: "phrase"
    notes: "Said to someone who is staying behind."
  - id: te-en-grammar-pitfalls-0003
    target: "ఇది నీళ్ళు కాదు."
    native: "This isn't water."
    reading: "idi niillu kaadu."
    pos: "phrase"
    notes: "కాదు denies what something is."
  - id: te-en-grammar-pitfalls-0004
    target: "నీళ్ళు లేవు."
    native: "There's no water."
    reading: "niillu leevu."
    pos: "phrase"
    notes: "లేదు or లేవు denies that something is there."
  - id: te-en-grammar-pitfalls-0005
    target: "నాకు ఆకలిగా ఉంది."
    native: "I'm hungry."
    reading: "naaku aakaligaa undi."
    pos: "phrase"
    notes: "'To me there is hunger'."
  - id: te-en-grammar-pitfalls-0006
    target: "నేను వెళ్ళాలి."
    native: "I have to go."
    reading: "neenu vellaali."
    pos: "phrase"
    notes: "-ఆలి on the stem says 'must'."
  - id: te-en-grammar-pitfalls-0007
    target: "మీరు కూర్చోండి."
    native: "Please sit down."
    reading: "miiru kuurchoondi."
    pos: "phrase"
    notes: "With మీరు, a request ends in -అండి. నువ్వు కూర్చో is for friends and children."
  - id: te-en-grammar-pitfalls-0008
    target: "రాము గారు వచ్చారు."
    native: "Mr Ramu has come."
    reading: "raamu gaaru vachchaaru."
    pos: "phrase"
    notes: "Respect for one person takes the plural verb: వచ్చారు, not వచ్చాడు."
