schema: 1
id: te-en-grammar-demonstratives
name: "This and that"
kind: grammar
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "ఈ and ఆ, and the words built on them: this one, here, this way, so much. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Near and far"
  slot_name: "near or far"
  slots: ["near: ఈ, ఇ-", "far: ఆ, అ-"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Words for near things start with ఇ- or ఈ-, words for far ones with అ- or ఆ- (people: వీళ్ళు and వాళ్ళు). ఈ and ఆ stand before a noun and never change: ఈ పుస్తకం, this book; ఆ ఇల్లు, that house."
  entries:
    - lemma: "this, that (before a noun)"
      key: adj
      gloss: "before a noun"
      forms:
        "near: ఈ, ఇ-": "ఈ"
        "far: ఆ, అ-": "ఆ"
      readings:
        "near: ఈ, ఇ-": "ī"
        "far: ఆ, అ-": "ā"
      ipas:
        "near: ఈ, ఇ-": "iː"
        "far: ఆ, అ-": "aː"
    - lemma: "this one, that one (a thing)"
      key: thing
      gloss: "a thing"
      forms:
        "near: ఈ, ఇ-": "ఇది"
        "far: ఆ, అ-": "అది"
      readings:
        "near: ఈ, ఇ-": "idi"
        "far: ఆ, అ-": "adi"
      ipas:
        "near: ఈ, ఇ-": "id̪i"
        "far: ఆ, అ-": "ad̪i"
    - lemma: "these, those (things)"
      key: things
      gloss: "things"
      forms:
        "near: ఈ, ఇ-": "ఇవి"
        "far: ఆ, అ-": "అవి"
      readings:
        "near: ఈ, ఇ-": "ivi"
        "far: ఆ, అ-": "avi"
      ipas:
        "near: ఈ, ఇ-": "iʋi"
        "far: ఆ, అ-": "aʋi"
    - lemma: "this man, that man"
      key: man
      gloss: "a man"
      forms:
        "near: ఈ, ఇ-": "ఇతను"
        "far: ఆ, అ-": "అతను"
      readings:
        "near: ఈ, ఇ-": "itanu"
        "far: ఆ, అ-": "atanu"
      ipas:
        "near: ఈ, ఇ-": "it̪anu"
        "far: ఆ, అ-": "at̪anu"
    - lemma: "this woman, that woman"
      key: woman
      gloss: "a woman"
      forms:
        "near: ఈ, ఇ-": "ఈమె"
        "far: ఆ, అ-": "ఆమె"
      readings:
        "near: ఈ, ఇ-": "īme"
        "far: ఆ, అ-": "āme"
      ipas:
        "near: ఈ, ఇ-": "iːme"
        "far: ఆ, అ-": "aːme"
    - lemma: "this man, that man (respectful)"
      key: man-resp
      gloss: "a man, with respect"
      forms:
        "near: ఈ, ఇ-": "ఈయన"
        "far: ఆ, అ-": "ఆయన"
      readings:
        "near: ఈ, ఇ-": "īyana"
        "far: ఆ, అ-": "āyana"
      ipas:
        "near: ఈ, ఇ-": "iːjana"
        "far: ఆ, అ-": "aːjana"
    - lemma: "this woman, that woman (respectful)"
      key: woman-resp
      gloss: "a woman, with respect"
      forms:
        "near: ఈ, ఇ-": "ఈవిడ"
        "far: ఆ, అ-": "ఆవిడ"
      readings:
        "near: ఈ, ఇ-": "īviḍa"
        "far: ఆ, అ-": "āviḍa"
      ipas:
        "near: ఈ, ఇ-": "iːʋiɖa"
        "far: ఆ, అ-": "aːʋiɖa"
    - lemma: "these people, those people"
      key: people
      gloss: "people"
      forms:
        "near: ఈ, ఇ-": "వీళ్ళు"
        "far: ఆ, అ-": "వాళ్ళు"
      readings:
        "near: ఈ, ఇ-": "vīḷḷu"
        "far: ఆ, అ-": "vāḷḷu"
      ipas:
        "near: ఈ, ఇ-": "ʋiːɭɭu"
        "far: ఆ, అ-": "ʋaːɭɭu"
    - lemma: "here, there"
      key: place
      gloss: "place"
      forms:
        "near: ఈ, ఇ-": "ఇక్కడ"
        "far: ఆ, అ-": "అక్కడ"
      readings:
        "near: ఈ, ఇ-": "ikkaḍa"
        "far: ఆ, అ-": "akkaḍa"
      ipas:
        "near: ఈ, ఇ-": "ikkaɖa"
        "far: ఆ, అ-": "akkaɖa"
    - lemma: "this way, that way"
      key: direction
      gloss: "direction"
      forms:
        "near: ఈ, ఇ-": "ఇటు"
        "far: ఆ, అ-": "అటు"
      readings:
        "near: ఈ, ఇ-": "iṭu"
        "far: ఆ, అ-": "aṭu"
      ipas:
        "near: ఈ, ఇ-": "iʈu"
        "far: ఆ, అ-": "aʈu"
    - lemma: "like this, like that"
      key: manner
      gloss: "manner"
      forms:
        "near: ఈ, ఇ-": "ఇలా"
        "far: ఆ, అ-": "అలా"
      readings:
        "near: ఈ, ఇ-": "ilā"
        "far: ఆ, అ-": "alā"
      ipas:
        "near: ఈ, ఇ-": "ilaː"
        "far: ఆ, అ-": "alaː"
    - lemma: "this much, that much"
      key: amount
      gloss: "amount"
      forms:
        "near: ఈ, ఇ-": "ఇంత"
        "far: ఆ, అ-": "అంత"
      readings:
        "near: ఈ, ఇ-": "inta"
        "far: ఆ, అ-": "anta"
      ipas:
        "near: ఈ, ఇ-": "int̪a"
        "far: ఆ, అ-": "ant̪a"
    - lemma: "now, then"
      key: time
      gloss: "time"
      forms:
        "near: ఈ, ఇ-": "ఇప్పుడు"
        "far: ఆ, అ-": "అప్పుడు"
      readings:
        "near: ఈ, ఇ-": "ippuḍu"
        "far: ఆ, అ-": "appuḍu"
      ipas:
        "near: ఈ, ఇ-": "ippuɖu"
        "far: ఆ, అ-": "appuɖu"
