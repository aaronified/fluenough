schema: 1
id: te-en-grammar-past-more
name: "Used to"
kind: grammar
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I used to go, she used to come: the past of a habit. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Past habit"
  slot_name: "person"
  slots: ["నేను", "మేము", "నువ్వు", "మీరు", "అతను", "ఆమె / అది", "వాళ్ళు"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The habit in the past is the verb in -ఏ, then a word for the doer: వెళ్ళేవాడు, he used to go, 'a goer'. With నేను and నువ్వు it shows whether the speaker or the listener is a man or a woman: వెళ్ళేవాడిని (a man), వెళ్ళేదాన్ని (a woman). The verb agrees with the doer's person and number. In the third person a man has a form of his own; a woman takes the same form as a thing. మీరు, plural or respectful, takes the plural."
  entries:
    - lemma: "చేయడం"
      key: cheeyadam
      reading: "cheyadam"
      gloss: "to do"
      forms:
        "నేను": ["చేసేవాడిని", "చేసేదాన్ని"]
        "మేము": "చేసేవాళ్ళం"
        "నువ్వు": ["చేసేవాడివి", "చేసేదానివి"]
        "మీరు": "చేసేవారు"
        "అతను": "చేసేవాడు"
        "ఆమె / అది": "చేసేది"
        "వాళ్ళు": ["చేసేవారు", "చేసేవాళ్ళు"]
      readings:
        "నేను": ["chesevadini", "chesedanni"]
        "మేము": "chesevallam"
        "నువ్వు": ["chesevadivi", "chesedanivi"]
        "మీరు": "chesevaru"
        "అతను": "chesevadu"
        "ఆమె / అది": "chesedi"
        "వాళ్ళు": ["chesevaru", "chesevallu"]
    - lemma: "వెళ్ళడం"
      key: velladam
      reading: "velladam"
      gloss: "to go"
      forms:
        "నేను": ["వెళ్ళేవాడిని", "వెళ్ళేదాన్ని"]
        "మేము": "వెళ్ళేవాళ్ళం"
        "నువ్వు": ["వెళ్ళేవాడివి", "వెళ్ళేదానివి"]
        "మీరు": "వెళ్ళేవారు"
        "అతను": "వెళ్ళేవాడు"
        "ఆమె / అది": "వెళ్ళేది"
        "వాళ్ళు": ["వెళ్ళేవారు", "వెళ్ళేవాళ్ళు"]
      readings:
        "నేను": ["vellevadini", "velledanni"]
        "మేము": "vellevallam"
        "నువ్వు": ["vellevadivi", "velledanivi"]
        "మీరు": "vellevaru"
        "అతను": "vellevadu"
        "ఆమె / అది": "velledi"
        "వాళ్ళు": ["vellevaru", "vellevallu"]
    - lemma: "రావడం"
      key: raavadam
      reading: "ravadam"
      gloss: "to come"
      forms:
        "నేను": ["వచ్చేవాడిని", "వచ్చేదాన్ని"]
        "మేము": "వచ్చేవాళ్ళం"
        "నువ్వు": ["వచ్చేవాడివి", "వచ్చేదానివి"]
        "మీరు": "వచ్చేవారు"
        "అతను": "వచ్చేవాడు"
        "ఆమె / అది": "వచ్చేది"
        "వాళ్ళు": ["వచ్చేవారు", "వచ్చేవాళ్ళు"]
      readings:
        "నేను": ["vacchevadini", "vacchedanni"]
        "మేము": "vacchevallam"
        "నువ్వు": ["vacchevadivi", "vacchedanivi"]
        "మీరు": "vacchevaru"
        "అతను": "vacchevadu"
        "ఆమె / అది": "vacchedi"
        "వాళ్ళు": ["vacchevaru", "vacchevallu"]
    - lemma: "ఉండడం"
      key: undadam
      reading: "undadam"
      gloss: "to be; to live"
      forms:
        "నేను": ["ఉండేవాడిని", "ఉండేదాన్ని"]
        "మేము": "ఉండేవాళ్ళం"
        "నువ్వు": ["ఉండేవాడివి", "ఉండేదానివి"]
        "మీరు": "ఉండేవారు"
        "అతను": "ఉండేవాడు"
        "ఆమె / అది": "ఉండేది"
        "వాళ్ళు": ["ఉండేవారు", "ఉండేవాళ్ళు"]
      readings:
        "నేను": ["undevadini", "undedanni"]
        "మేము": "undevallam"
        "నువ్వు": ["undevadivi", "undedanivi"]
        "మీరు": "undevaru"
        "అతను": "undevadu"
        "ఆమె / అది": "undedi"
        "వాళ్ళు": ["undevaru", "undevallu"]
