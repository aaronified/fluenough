cards:
  - id: "te-3000"
    target: "ప్రపంచం"
    reading: "prapañcam"
    ipa: "prapaɲtʃam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "ప్రపంచ పటం", reading: "prapañca paṭam" }] }
    examples:
      - { target: "ప్రపంచం చాలా పెద్దది.", reading: "prapañcam cālā peddadi.", ipa: "prapaɲtʃam tʃaːlaː ped̪d̪ad̪i" }
      - { target: "ఈ ప్రపంచంలో చాలా దేశాలు ఉన్నాయి.", reading: "ī prapañcamlō cālā dēśālu unnāyi.", ipa: "iː prapaɲtʃamloː tʃaːlaː d̪eːʃaːlu unnaːji", bases: [{ word: "ప్రపంచంలో", base: "ప్రపంచం", reading: "prapañcam" }, { word: "దేశాలు", base: "దేశం", reading: "dēśam" }, { word: "ఉన్నాయి", base: "ఉండడం", reading: "uṇḍaḍam" }] }
  - id: "te-3001"
    target: "ఖండం"
    reading: "khaṇḍam"
    ipa: "kʰaɳɖam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "ఖండాలు", reading: "khaṇḍālu" }] }
    examples:
      - { target: "ఏడు ఖండాలు ఉన్నాయి.", reading: "ēḍu khaṇḍālu unnāyi.", ipa: "eːɖu kʰaɳɖaːlu unnaːji", bases: [{ word: "ఖండాలు", base: "ఖండం", reading: "khaṇḍam" }, { word: "ఉన్నాయి", base: "ఉండడం", reading: "uṇḍaḍam" }] }
      - { target: "ఆఫ్రికా చాలా పెద్ద ఖండం.", reading: "āphrikā cālā pedda khaṇḍam.", ipa: "aːpʰrikaː tʃaːlaː ped̪d̪a kʰaɳɖam" }
  - id: "te-3002"
    target: "భూగోళం"
    reading: "bhūgōḷam"
    ipa: "bʱuːɡoːɭam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "భూమి", reading: "bhūmi" }] }
    examples:
      - { target: "బడిలో భూగోళం చూశాను.", reading: "baḍilō bhūgōḷam cūśānu.", ipa: "baɖiloː bʱuːɡoːɭam tʃuːʃaːnu", bases: [{ word: "బడిలో", base: "బడి", reading: "baḍi" }, { word: "చూశాను", base: "చూడడం", reading: "cūḍaḍam" }] }
      - { target: "భూగోళం గుండ్రంగా ఉంటుంది.", reading: "bhūgōḷam guṇḍraṅgā uṇṭundi.", ipa: "bʱuːɡoːɭam ɡuɳɖraŋɡaː uɳʈund̪i", bases: [{ word: "ఉంటుంది", base: "ఉండడం", reading: "uṇḍaḍam" }] }
  - id: "te-3003"
    target: "పటం"
    reading: "paṭam"
    ipa: "paʈam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "పటంలో", reading: "paṭamlō" }] }
    examples:
      - { target: "పటంలో నగరం ఎక్కడ ఉంది?", reading: "paṭamlō nagaram ekkaḍa undi?", ipa: "paʈamloː naɡaram ekkaɖa und̪i", bases: [{ word: "పటంలో", base: "పటం", reading: "paṭam" }, { word: "ఉంది", ref: "te-0633" }] }
      - { target: "ఈ పటం జాగ్రత్తగా చూశాను.", reading: "ī paṭam jāgrattagā cūśānu.", ipa: "iː paʈam dʒaːɡrat̪t̪aɡaː tʃuːʃaːnu", bases: [{ word: "చూశాను", base: "చూడడం", reading: "cūḍaḍam" }] }
  - id: "te-3004"
    target: "దిక్కు"
    reading: "dikku"
    ipa: "d̪ikku"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "దిక్కులు", reading: "dikkulu" }] }
    examples:
      - { target: "నాలుగు దిక్కులు ఉన్నాయి.", reading: "nālugu dikkulu unnāyi.", ipa: "naːluɡu d̪ikkulu unnaːji", bases: [{ word: "దిక్కులు", base: "దిక్కు", reading: "dikku" }, { word: "ఉన్నాయి", base: "ఉండడం", reading: "uṇḍaḍam" }] }
      - { target: "ఏ దిక్కుకు వెళ్తున్నారు?", reading: "ē dikkuku veḷtunnāru?", ipa: "eː d̪ikkuku ʋeɭt̪unnaːru", bases: [{ word: "దిక్కుకు", base: "దిక్కు", reading: "dikku" }, { word: "వెళ్తున్నారు", base: "వెళ్లడం", reading: "veḷlaḍam" }] }
    synonyms:
      - { id: "mula", word: "మూల", reading: "mūla", source: "https://en.wiktionary.org/wiki/దిక్కు" }
      - { id: "disa", word: "దిశ", reading: "diśa", source: "https://en.wiktionary.org/wiki/దిక్కు" }
    senses:
      - { id: "quarter", pos: "noun", source: "https://en.wiktionary.org/wiki/దిక్కు" }
      - { id: "airt", pos: "noun", source: "https://en.wiktionary.org/wiki/దిక్కు" }
  - id: "te-3005"
    target: "దక్షిణం"
    reading: "dakṣiṇam"
    ipa: "d̪akʂiɳam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "దక్షిణ భారతదేశం", reading: "dakṣiṇa bhāratadēśam" }] }
    antonyms:
      - { id: "uttaram", word: "ఉత్తరం", reading: "uttaram" }
    examples:
      - { target: "ఆ పట్టణం దక్షిణంలో ఉంది.", reading: "ā paṭṭaṇam dakṣiṇamlō undi.", ipa: "aː paʈʈaɳam d̪akʂiɳamloː und̪i", bases: [{ word: "దక్షిణంలో", base: "దక్షిణం", reading: "dakṣiṇam" }, { word: "ఉంది", ref: "te-0633" }] }
      - { target: "ఇది దక్షిణం వైపు వెళ్లే రైలు.", reading: "idi dakṣiṇam vaipu veḷlē railu.", ipa: "id̪i d̪akʂiɳam ʋaipu ʋeɭleː railu", bases: [{ word: "వెళ్లే", base: "వెళ్లడం", reading: "veḷlaḍam" }] }
  - id: "te-3006"
    target: "తూర్పు"
    reading: "tūrpu"
    ipa: "t̪uːrpu"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "తూర్పు వైపు", reading: "tūrpu vaipu" }] }
    antonyms:
      - { id: "padamara", word: "పడమర", reading: "paḍamara" }
    examples:
      - { target: "సూర్యుడు తూర్పున ఉదయిస్తాడు.", reading: "sūryuḍu tūrpuna udayistāḍu.", ipa: "suːrjuɖu t̪uːrpuna ud̪ajist̪aːɖu", bases: [{ word: "తూర్పున", base: "తూర్పు", reading: "tūrpu" }, { word: "ఉదయిస్తాడు", base: "ఉదయించడం", reading: "udayiñcaḍam" }] }
      - { target: "మా ఊరు తూర్పు వైపు ఉంది.", reading: "mā ūru tūrpu vaipu undi.", ipa: "maː uːru t̪uːrpu ʋaipu und̪i", bases: [{ word: "ఉంది", ref: "te-0633" }] }
  - id: "te-3007"
    target: "పడమర"
    reading: "paḍamara"
    ipa: "paɖamara"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "పడమర దిక్కు", reading: "paḍamara dikku" }] }
    antonyms:
      - { id: "turpu", word: "తూర్పు", reading: "tūrpu" }
    examples:
      - { target: "సూర్యుడు పడమర దిక్కున అస్తమిస్తాడు.", reading: "sūryuḍu paḍamara dikkuna astamistāḍu.", ipa: "suːrjuɖu paɖamara d̪ikkuna ast̪amist̪aːɖu", bases: [{ word: "దిక్కున", base: "దిక్కు", reading: "dikku" }, { word: "అస్తమిస్తాడు", base: "అస్తమించడం", reading: "astamiñcaḍam" }] }
      - { target: "బస్సు పడమర వైపు వెళ్తోంది.", reading: "bassu paḍamara vaipu veḷtōndi.", ipa: "bassu paɖamara ʋaipu ʋeɭt̪oːnd̪i", bases: [{ word: "వెళ్తోంది", base: "వెళ్లడం", reading: "veḷlaḍam" }] }
    synonyms:
      - { id: "pascimamu", word: "పశ్చిమము", reading: "paścimamu", source: "https://en.wiktionary.org/wiki/పడమర" }
  - id: "te-3008"
    target: "సరిహద్దు"
    reading: "sarihaddu"
    ipa: "sarihad̪d̪u"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "రాష్ట్ర సరిహద్దు", reading: "rāṣṭra sarihaddu" }] }
    examples:
      - { target: "రెండు రాష్ట్రాల మధ్య సరిహద్దు ఉంది.", reading: "reṇḍu rāṣṭrāla madhya sarihaddu undi.", ipa: "reɳɖu raːʂʈraːla mad̪ʱja sarihad̪d̪u und̪i", bases: [{ word: "రాష్ట్రాల", base: "రాష్ట్రం", reading: "rāṣṭram" }, { word: "ఉంది", ref: "te-0633" }] }
      - { target: "సరిహద్దు దాటి వెళ్లొద్దు.", reading: "sarihaddu dāṭi veḷloddu.", ipa: "sarihad̪d̪u d̪aːʈi ʋeɭlod̪d̪u", bases: [{ word: "దాటి", base: "దాటడం", reading: "dāṭaḍam" }, { word: "వెళ్లొద్దు", base: "వెళ్లడం", reading: "veḷlaḍam" }] }
    synonyms:
      - { id: "syn1", word: "మేఱ", reading: "mēra", source: "https://en.wiktionary.org/wiki/సరిహద్దు" }
      - { id: "syn2", word: "పొలిమేఱ", reading: "polimēra", source: "https://en.wiktionary.org/wiki/సరిహద్దు" }
      - { id: "ella", word: "ఎల్ల", reading: "ella", source: "https://en.wiktionary.org/wiki/సరిహద్దు" }
      - { id: "ancu", word: "అంచు", reading: "añcu", source: "https://en.wiktionary.org/wiki/సరిహద్దు" }
  - id: "te-3009"
    target: "తీరం"
    reading: "tīram"
    ipa: "t̪iːram"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "సముద్ర తీరం", reading: "samudra tīram" }] }
    examples:
      - { target: "మేము తీరం వెంట నడిచాము.", reading: "mēmu tīram veṇṭa naḍicāmu.", ipa: "meːmu t̪iːram ʋeɳʈa naɖitʃaːmu", bases: [{ word: "నడిచాము", base: "నడవడం", reading: "naḍavaḍam" }] }
      - { target: "ఈ తీరం చాలా అందంగా ఉంది.", reading: "ī tīram cālā andaṅgā undi.", ipa: "iː t̪iːram tʃaːlaː and̪aŋɡaː und̪i", bases: [{ word: "ఉంది", ref: "te-0633" }] }
  - id: "te-3010"
    target: "ద్వీపకల్పం"
    reading: "dvīpakalpam"
    ipa: "d̪ʋiːpakalpam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "భారత ద్వీపకల్పం", reading: "bhārata dvīpakalpam" }] }
    examples:
      - { target: "ఈ ద్వీపకల్పం మూడు వైపులా నీటితో చుట్టుముట్టి ఉంది.", reading: "ī dvīpakalpam mūḍu vaipulā nīṭitō cuṭṭumuṭṭi undi.", ipa: "iː d̪ʋiːpakalpam muːɖu ʋaipulaː niːʈit̪oː tʃuʈʈumuʈʈi und̪i", bases: [{ word: "నీటితో", base: "నీరు", reading: "nīru" }, { word: "చుట్టుముట్టి", base: "చుట్టుముట్టడం", reading: "cuṭṭumuṭṭaḍam" }, { word: "ఉంది", ref: "te-0633" }] }
      - { target: "ఈ ద్వీపకల్పంలో చాలా ఊళ్ళు ఉన్నాయి.", reading: "ī dvīpakalpamlō cālā ūḷḷu unnāyi.", ipa: "iː d̪ʋiːpakalpamloː tʃaːlaː uːɭɭu unnaːji", bases: [{ word: "ద్వీపకల్పంలో", base: "ద్వీపకల్పం", reading: "dvīpakalpam" }, { word: "ఊళ్ళు", base: "ఊరు", reading: "ūru" }, { word: "ఉన్నాయి", base: "ఉండడం", reading: "uṇḍaḍam" }] }
  - id: "te-3011"
    target: "పట్టణం"
    reading: "paṭṭaṇam"
    ipa: "paʈʈaɳam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "పట్టణంలో", reading: "paṭṭaṇamlō" }] }
    examples:
      - { target: "పట్టణం చిన్నది కానీ చాలా శుభ్రంగా ఉంది.", reading: "paṭṭaṇam cinnadi kānī cālā śubhraṅgā undi.", ipa: "paʈʈaɳam tʃinnad̪i kaːniː tʃaːlaː ʃubʱraŋɡaː und̪i", bases: [{ word: "ఉంది", ref: "te-0633" }] }
      - { target: "మేము వారం రోజులు పట్టణంలో ఉన్నాము.", reading: "mēmu vāram rōjulu paṭṭaṇamlō unnāmu.", ipa: "meːmu ʋaːram roːdʒulu paʈʈaɳamloː unnaːmu", bases: [{ word: "పట్టణంలో", base: "పట్టణం", reading: "paṭṭaṇam" }, { word: "ఉన్నాము", base: "ఉండడం", reading: "uṇḍaḍam" }] }
  - id: "te-3012"
    target: "ప్రాంతం"
    reading: "prāntam"
    ipa: "praːnt̪am"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "ప్రాంతాల్లో", reading: "prāntāllō" }] }
    examples:
      - { target: "ఇది కొండల ప్రాంతం.", reading: "idi koṇḍala prāntam.", ipa: "id̪i koɳɖala praːnt̪am", bases: [{ word: "కొండల", base: "కొండ", reading: "koṇḍa" }] }
      - { target: "ఈ ప్రాంతంలో వర్షం ఎక్కువగా పడుతుంది.", reading: "ī prāntamlō varṣam ekkuvagā paḍutundi.", ipa: "iː praːnt̪amloː ʋarʂam ekkuʋaɡaː paɖut̪und̪i", bases: [{ word: "ప్రాంతంలో", base: "ప్రాంతం", reading: "prāntam" }, { word: "పడుతుంది", base: "పడడం", reading: "paḍaḍam" }] }
  - id: "te-3013"
    target: "గ్రామీణ"
    reading: "grāmīṇa"
    ipa: "ɡraːmiːɳa"
    pos: "adj"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "గ్రామీణ ప్రాంతం", reading: "grāmīṇa prāntam" }] }
    antonyms:
      - { id: "pattana", word: "పట్టణ", reading: "paṭṭaṇa" }
    examples:
      - { target: "గ్రామీణ ప్రాంతాల్లో బస్సులు తక్కువ.", reading: "grāmīṇa prāntāllō bassulu takkuva.", ipa: "ɡraːmiːɳa praːnt̪aːlloː bassulu t̪akkuʋa", bases: [{ word: "ప్రాంతాల్లో", base: "ప్రాంతం", reading: "prāntam" }, { word: "బస్సులు", base: "బస్సు", reading: "bassu" }] }
      - { target: "గ్రామీణ జీవితం ప్రశాంతంగా ఉంటుంది.", reading: "grāmīṇa jīvitam praśāntaṅgā uṇṭundi.", ipa: "ɡraːmiːɳa dʒiːʋit̪am praʃaːnt̪aŋɡaː uɳʈund̪i", bases: [{ word: "ఉంటుంది", base: "ఉండడం", reading: "uṇḍaḍam" }] }
  - id: "te-3014"
    target: "జనాభా"
    reading: "janābhā"
    ipa: "dʒanaːbʱaː"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
