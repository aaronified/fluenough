  "title": "A short story with a turn"
  "sentences":
  - "text": "నేను ఇంటికి వచ్చాను."
    "reading": "nēnu iṇṭiki vaccānu."
    "ipa": "neːnu iɳʈiki ʋatʃtʃaːnu"
  - "text": "నా పుస్తకం సంచిలో లేదు."
    "reading": "nā pustakaṁ sañcilō lēdu."
    "ipa": "naː pust̪akam saɲtʃiloː leːd̪u"
  - "text": "నేను ఇంట్లో వెతుకుతాను."
    "reading": "nēnu iṇṭlō vetukutānu."
    "ipa": "neːnu iɳʈloː ʋet̪ukut̪aːnu"
  - "text": "పుస్తకం బల్ల మీద ఉంది."
    "reading": "pustakaṁ balla mīda undi."
    "ipa": "pust̪akam balla miːd̪a und̪i"
