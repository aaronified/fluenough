- "id": "te-a-day-on-the-bus"
  "title": "A short story of a bus ride"
  "sentences":
  - "text": "నేను బస్సు ఎక్కుతూ కండక్టర్‌ని టికెట్ అడిగాను."
    "reading": "nēnu bassu ekkutū kaṇḍakṭarni ṭikeṭ aḍigānu."
    "ipa": "neːnu bassu ekkut̪uː kaɳɖakʈarni ʈikeʈ aɖiɡaːnu"
  - "text": "నేను కిటికీ పక్కన కూర్చుంటూ పాట విన్నాను."
    "reading": "nēnu kiṭikī pakkana kūrcuṇṭū pāṭa vinnānu."
    "ipa": "neːnu kiʈikiː pakkana kuːrtʃuɳʈuː paːʈa ʋinnaːnu"
  - "text": "ఒక తాత నిద్రపోతూ ప్రయాణం చేశాడు."
    "reading": "oka tāta nidrapōtū prayāṇaṁ cēśāḍu."
    "ipa": "oka t̪aːt̪a nid̪rapoːt̪uː prajaːɳam tʃeːʃaːɖu"
  - "text": "బస్ స్టాప్ దగ్గర దిగుతూ నేను నా పుస్తకం మర్చిపోయాను."
    "reading": "bas sṭāp daggara digutū nēnu nā pustakaṁ marcipōyānu."
    "ipa": "bas sʈaːp d̪aɡɡara d̪iɡut̪uː neːnu naː pust̪akam martʃipoːjaːnu"
