"description": "A short story of a bus ride, using the while forms (-తూ) of this unit: the narrator asks the conductor for a ticket as they get on, the narrator listens to a song by the window, a grandfather sleeps through the journey, and the narrator forgets a book while getting off. Not yet checked by a Telugu speaker: please report any mistake."
