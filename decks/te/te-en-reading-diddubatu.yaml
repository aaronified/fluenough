schema: 1
id: te-en-reading-diddubatu
name: "Reading: Diddubatu"
kind: reading
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
source: "Diddubatu, by Gurajada Apparao (1910), in the public domain"
description: "Five scenes from Gurajada Apparao's short story Diddubatu (1910), quoted letter for letter from the printing in Gurujadalu (2012), with questions and the older words explained. The story is told in the bookish Telugu of its day and its people talk the spoken Telugu of 1910: the glossary gives today's forms. The half-nasal ఁ is not said today and is left out of the romanisation. Not yet checked by a Telugu speaker: please report any mistake."
tags: [reading, advanced, unreviewed]
passages:
  - id: te-diddubatu-01
    title: "The door"
    source: "Gurujadalu (MaNaSu Foundation, 2012), page 525"
    sentences:
      - text: "“తలుపు! తలుపు!”"
        reading: "“talupu! talupu!”"
      - text: "తలుపు తెరవఁబడలేదు."
        reading: "talupu teravabadaleedu."
      - text: "ఒక నిమిష మతఁడూరుకొనెను."
        reading: "oka nimisha mataduurukonenu."
      - text: "గదిలోని గడియారము టింగుమని ఒంటిగంట కొట్టినది."
        reading: "gadilooni gadiyaaramu tingumani ontiganta kottinadi."
    glossary:
      - word: "తెరవఁబడలేదు"
        modern: "తెరవబడలేదు"
        reading: "teravabadaleedu"
        meaning: { en: "was not opened" }
        note: { en: "the half-nasal ఁ is no longer written; in speech, తలుపు తెరుచుకోలేదు, the door didn't open" }
      - word: "నిమిష మతఁడూరుకొనెను"
        modern: "నిమిషం అతను ఊరుకున్నాడు"
        reading: "nimisham atanu uurukunnaadu"
        meaning: { en: "for a minute he kept still" }
        note: { en: "bookish: నిమిషము, అతఁడు and ఊరుకొనెను run together" }
      - word: "గదిలోని"
        modern: "గదిలోని"
        reading: "gadilooni"
        meaning: { en: "in the room" }
      - word: "గడియారము"
        modern: "గడియారం"
        reading: "gadiyaaram"
        meaning: { en: "clock" }
        note: { en: "the bookish ending -ము is -ం today" }
      - word: "టింగుమని"
        modern: "టింగుమని"
        reading: "tingumani"
        meaning: { en: "with a ting: the chime of the clock" }
      - word: "ఒంటిగంట"
        modern: "ఒంటిగంట"
        reading: "ontiganta"
        meaning: { en: "one o'clock" }
      - word: "కొట్టినది"
        modern: "కొట్టింది"
        reading: "kottindi"
        meaning: { en: "struck" }
        note: { en: "the bookish past" }
    questions:
      - id: te-0559
        prompt: { en: "What time does the clock strike?" }
        options:
          - { en: "Two o'clock" }
          - { en: "One o'clock" }
          - { en: "Midnight" }
        answer: 2
      - id: te-0560
        prompt: { en: "Someone opens the door at once." }
        answer: false
  - id: te-diddubatu-02
    title: "Where is Amma?"
    source: "Gurujadalu (MaNaSu Foundation, 2012), page 526"
    sentences:
      - text: "“మీ అమ్మేదిరా?”"
        reading: "“mii ammeediraa?”"
      - text: "“మా యమ్మా? యింటున్నది బాబూ”."
        reading: "“maa yammaa? yintunnadi baabuu”."
      - text: "“మీ అమ్మ కాదురా; బుద్ధిహీనుఁడా, నా భార్యా”"
        reading: "“mii amma kaaduraa; buddhihiinudaa, naa bhaaryaa”"
      - text: "“అమ్మగారా? యెక్కడుంటారు బాబూ? పడుకున్నారు”"
        reading: "“ammagaaraa? yekkaduntaaru baabuu? padukunnaaru”"
      - text: "“యింట్లోనే లేదు”."
        reading: "“yintloonee leedu”."
    glossary:
      - word: "అమ్మేదిరా"
        modern: "అమ్మ ఏదిరా"
        reading: "amma eediraa"
        meaning: { en: "where's amma?" }
        note: { en: "-రా is how one talks to a boy or a man one need not be formal with" }
      - word: "యమ్మా"
        modern: "అమ్మా"
        reading: "ammaa"
        meaning: { en: "my mother?" }
        note: { en: "మా + అమ్మ: a y joins the two vowels" }
      - word: "యింటున్నది"
        modern: "ఇంట్లో ఉంది"
        reading: "intloo undi"
        meaning: { en: "she's at home" }
        note: { en: "spoken forms run together" }
      - word: "బాబూ"
        modern: "బాబూ"
        reading: "baabuu"
        meaning: { en: "sir: how a servant addresses his master" }
      - word: "బుద్ధిహీనుఁడా"
        modern: "బుద్ధిహీనుడా"
        reading: "buddhihiinudaa"
        meaning: { en: "you fool; literally 'you without sense'" }
      - word: "అమ్మగారా"
        modern: "అమ్మగారా"
        reading: "ammagaaraa"
        meaning: { en: "the mistress? అమ్మగారు is the lady of the house" }
      - word: "యెక్కడుంటారు"
        modern: "ఎక్కడ ఉంటారు"
        reading: "ekkada untaaru"
        meaning: { en: "where would she be?" }
        note: { en: "the respectful plural, for the mistress" }
      - word: "పడుకున్నారు"
        modern: "పడుకున్నారు"
        reading: "padukunnaaru"
        meaning: { en: "she's asleep; literally 'she has lain down'" }
      - word: "యింట్లోనే"
        modern: "ఇంట్లోనే"
        reading: "intloonee"
        meaning: { en: "in the house at all" }
    questions:
      - id: te-0561
        prompt: { en: "Who does Ramudu first think 'your amma' means?" }
        options:
          - { en: "Gopalarao's mother" }
          - { en: "His own mother" }
          - { en: "Gopalarao's sister" }
        answer: 2
      - id: te-0562
        prompt: { en: "Ramudu thinks the mistress is asleep." }
        answer: true
      - id: te-0563
        prompt: { en: "What does Gopalarao tell Ramudu about his wife?" }
        options:
          - { en: "She is in the kitchen" }
          - { en: "She is asleep in her room" }
          - { en: "She is not in the house" }
        answer: 3
  - id: te-diddubatu-03
    title: "What happened, Rama?"
    source: "Gurujadalu (MaNaSu Foundation, 2012), page 526"
    sentences:
      - text: "కుర్చీ పయి కూచుని “రామా యేమాయెరా?” యని దైన్యముతో ననెను."
        reading: "kurchii payi kuuchuni “raamaa yeemaayeraa?” yani dainyamutoo nanenu."
      - text: "“యేటో మాయలా వుంది బాబూ”"
        reading: "“yeetoo maayalaa vundi baabuu”"
      - text: "“పుట్టింటికి వెళ్లియుండునా?”"
        reading: "“puttintiki velliyundunaa?”"
      - text: "“అంత వారు కారనా? బాబూ కోపగించితే చెప్పలేను గాని ఆడారు చదువు నేరిస్తే యేటౌతది?”"
        reading: "“anta vaaru kaaranaa? baabuu koopaginchitee cheppaleenu gaani aadaaru chaduvu neeristee yeetautadi?”"
    glossary:
      - word: "పయి"
        modern: "పైన"
        reading: "paina"
        meaning: { en: "on" }
      - word: "కూచుని"
        modern: "కూర్చుని"
        reading: "kuurchuni"
        meaning: { en: "sitting down" }
        note: { en: "also said కూచుని" }
      - word: "యేమాయెరా"
        modern: "ఏమైందిరా"
        reading: "eemaindiraa"
        meaning: { en: "what has happened?" }
      - word: "యని"
        modern: "అని"
        reading: "ani"
        meaning: { en: "saying: it closes a quote" }
      - word: "దైన్యముతో"
        modern: "దైన్యంతో"
        reading: "dainyantoo"
        meaning: { en: "miserably, helplessly" }
      - word: "ననెను"
        modern: "అన్నాడు"
        reading: "annaadu"
        meaning: { en: "he said" }
        note: { en: "the bookish past అనెను, joined to the word before" }
      - word: "యేటో"
        modern: "ఏమిటో"
        reading: "eemitoo"
        meaning: { en: "who knows what" }
        note: { en: "a spoken form" }
      - word: "మాయలా"
        modern: "మాయలా"
        reading: "maayalaa"
        meaning: { en: "like magic: a mystery" }
      - word: "వుంది"
        modern: "ఉంది"
        reading: "undi"
        meaning: { en: "it is" }
        note: { en: "older print often writes a v- before u" }
      - word: "పుట్టింటికి"
        modern: "పుట్టింటికి"
        reading: "puttintiki"
        meaning: { en: "to her parents' home; పుట్టిల్లు is the house one was born in" }
      - word: "వెళ్లియుండునా"
        modern: "వెళ్ళి ఉంటుందా"
        reading: "velli untundaa"
        meaning: { en: "could she have gone?" }
      - word: "కోపగించితే"
        modern: "కోప్పడితే"
        reading: "kooppaditee"
        meaning: { en: "if you get angry" }
      - word: "ఆడారు"
        modern: "ఆడవాళ్ళు"
        reading: "aadavaallu"
        meaning: { en: "women" }
        note: { en: "a spoken form" }
      - word: "నేరిస్తే"
        modern: "నేర్చుకుంటే"
        reading: "neerchukuntee"
        meaning: { en: "if they learn" }
      - word: "యేటౌతది"
        modern: "ఏమవుతుంది"
        reading: "eemavutundi"
        meaning: { en: "what will come of it?" }
        note: { en: "a spoken form" }
    questions:
      - id: te-0564
        prompt: { en: "Gopalarao wonders whether his wife has gone to her parents' home." }
        answer: true
      - id: te-0565
        prompt: { en: "What does Ramudu blame?" }
        options:
          - { en: "Gopalarao's temper" }
          - { en: "Women learning to read" }
          - { en: "The neighbours" }
        answer: 2
      - id: te-0566
        prompt: { en: "Ramudu says it is a mystery to him." }
        answer: true
  - id: te-diddubatu-04
    title: "I am a beast"
    source: "Gurujadalu (MaNaSu Foundation, 2012), page 527"
    sentences:
      - text: "ఉత్తరము ముగించి “నేను పశువును” అని గోపాలరావు అనెను."
        reading: "uttaramu muginchi “neenu pashuvunu” ani goopaalaraavu anenu."
      - text: "“అదేటి బాబు ఆలా శలవిస్తారు?”"
        reading: "“adeeti baabu aalaa shalavistaaru?”"
      - text: "“శుద్ధ పశువును!”"
        reading: "“shuddha pashuvunu!”"
      - text: "రాముఁడు అతి ప్రయత్నముచే నవ్వు ఆచుకొనెను."
        reading: "raamudu ati prayatnamuchee navvu aachukonenu."
      - text: "“గుణవతి, విద్యానిధి, వినయ సంపన్నురాలు, నా చెడు బుద్ధికి తగిన శాస్తి చేసినది”."
        reading: "“gunavati, vidyaanidhi, vinaya sampannuraalu, naa chedu buddhiki tagina shaasti cheesinadi”."
      - text: "“యేటి చేసినారు బాబూ?”"
        reading: "“yeeti cheesinaaru baabuu?”"
    glossary:
      - word: "ఉత్తరము"
        modern: "ఉత్తరం"
        reading: "uttaram"
        meaning: { en: "the letter (his wife's)" }
      - word: "ముగించి"
        modern: "ముగించి"
        reading: "muginchi"
        meaning: { en: "having finished" }
      - word: "పశువును"
        modern: "పశువును"
        reading: "pashuvunu"
        meaning: { en: "I am a beast; పశువు is an animal, a brute" }
      - word: "అనెను"
        modern: "అన్నాడు"
        reading: "annaadu"
        meaning: { en: "said" }
        note: { en: "the bookish past" }
      - word: "అదేటి"
        modern: "అదేమిటి"
        reading: "adeemiti"
        meaning: { en: "what's that? why" }
        note: { en: "a spoken form" }
      - word: "శలవిస్తారు"
        modern: "సెలవిస్తారు"
        reading: "selavistaaru"
        meaning: { en: "do you say: a servant's polite word for his master's speaking" }
      - word: "శుద్ధ"
        modern: "శుద్ధ"
        reading: "shuddha"
        meaning: { en: "pure; utter" }
      - word: "ప్రయత్నముచే"
        modern: "ప్రయత్నంతో"
        reading: "prayatnantoo"
        meaning: { en: "with an effort" }
      - word: "ఆచుకొనెను"
        modern: "ఆపుకున్నాడు"
        reading: "aapukunnaadu"
        meaning: { en: "held back" }
        note: { en: "the bookish past" }
      - word: "గుణవతి"
        modern: "గుణవతి"
        reading: "gunavati"
        meaning: { en: "a woman of good character" }
      - word: "విద్యానిధి"
        modern: "విద్యానిధి"
        reading: "vidyaanidhi"
        meaning: { en: "a treasury of learning" }
      - word: "వినయ సంపన్నురాలు"
        modern: "వినయ సంపన్నురాలు"
        reading: "vinaya sampannuraalu"
        meaning: { en: "rich in modesty" }
      - word: "శాస్తి"
        modern: "శాస్తి"
        reading: "shaasti"
        meaning: { en: "a punishment; a lesson" }
      - word: "చేసినది"
        modern: "చేసింది"
        reading: "cheesindi"
        meaning: { en: "she did" }
        note: { en: "the bookish past" }
      - word: "యేటి"
        modern: "ఏమిటి"
        reading: "eemiti"
        meaning: { en: "what" }
        note: { en: "a spoken form" }
      - word: "చేసినారు"
        modern: "చేశారు"
        reading: "cheeshaaru"
        meaning: { en: "did she do (respectful)" }
    questions:
      - id: te-0567
        prompt: { en: "What does Gopalarao call himself after reading the letter?" }
        options:
          - { en: "A thief" }
          - { en: "A king" }
          - { en: "A beast" }
        answer: 3
      - id: te-0568
        prompt: { en: "Ramudu laughs out loud." }
        answer: false
      - id: te-0569
        prompt: { en: "Gopalarao says his wife has taught him the lesson he deserved." }
        answer: true
  - id: te-diddubatu-05
    title: "Laughter under the cot"
    source: "Gurujadalu (MaNaSu Foundation, 2012), page 528"
    sentences:
      - text: "“ఓరి వెధవా!” అని గోపాలరావు కోపముతో కుర్చీ నుండి లేచి నిలిచెను."
        reading: "“oori vedhavaa!” ani goopaalaraavu koopamutoo kurchii nundi leechi nilichenu."
      - text: "ఊసవలే రాముడు వెలి కెగసెను."
        reading: "uusavalee raamudu veli kegasenu."
      - text: "అంతట మంచము క్రింద నుండి అమృత నిష్యందిని యగు కలకల నగవును కరకంకణముల హృద్యారావమును విననయ్యెను."
        reading: "antata manchamu krinda nundi amruta nishyandini yagu kalakala nagavunu karakankanamula hrudyaaraavamunu vinanayyenu."
    glossary:
      - word: "ఓరి వెధవా"
        modern: "ఓరి వెధవా"
        reading: "oori vedhavaa"
        meaning: { en: "you rascal!" }
      - word: "కోపముతో"
        modern: "కోపంతో"
        reading: "koopantoo"
        meaning: { en: "in anger" }
      - word: "లేచి నిలిచెను"
        modern: "లేచి నిలబడ్డాడు"
        reading: "leechi nilabaddaadu"
        meaning: { en: "got up and stood" }
        note: { en: "the bookish past" }
      - word: "ఊసవలే"
        modern: "ఊసలా"
        reading: "uusalaa"
        meaning: { en: "like a winged termite: in a flash" }
        note: { en: "ఊస is the winged termite that swarms out after rain; వలె, like" }
      - word: "వెలి కెగసెను"
        modern: "బయటికి ఎగిరాడు"
        reading: "bayatiki egiraadu"
        meaning: { en: "shot outside" }
        note: { en: "bookish: వెలికి ఎగసెను, run together" }
      - word: "అంతట"
        modern: "అప్పుడు"
        reading: "appudu"
        meaning: { en: "then" }
      - word: "మంచము క్రింద"
        modern: "మంచం కింద"
        reading: "mancham kinda"
        meaning: { en: "from under the cot" }
      - word: "అమృత నిష్యందిని యగు"
        modern: "అమృతం కురిపించే"
        reading: "amrutam kuripinchee"
        meaning: { en: "pouring nectar" }
        note: { en: "bookish: యగు, being" }
      - word: "నగవును"
        modern: "నవ్వు"
        reading: "navvu"
        meaning: { en: "laughter" }
        note: { en: "నగవు is an older word for నవ్వు" }
      - word: "కరకంకణముల"
        modern: "చేతి గాజుల"
        reading: "cheeti gaajula"
        meaning: { en: "of the bangles on her wrists" }
      - word: "హృద్యారావమును"
        modern: "హృద్యారావం"
        reading: "hrudyaaraavam"
        meaning: { en: "a sound that delights the heart" }
      - word: "విననయ్యెను"
        modern: "వినిపించింది"
        reading: "vinipinchindi"
        meaning: { en: "could be heard" }
        note: { en: "the bookish past" }
    questions:
      - id: te-0570
        prompt: { en: "Gopalarao gets up from his chair in anger." }
        answer: true
      - id: te-0571
        prompt: { en: "What is heard from under the cot?" }
        options:
          - { en: "Laughter and the jingle of bangles" }
          - { en: "Crying" }
          - { en: "A song" }
