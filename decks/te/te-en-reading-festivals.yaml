  "sentences":
  - "text": "ఇది మా ఆహ్వానం."
    "reading": "idi mā āhvānaṁ."
    "ipa": "id̪i maː aːhʋaːnam"
  - "text": "దీపావళి రోజు మా ఇంట్లో రాత్రి భోజనం ఉంది."
    "reading": "dīpāvaḷi rōju mā iṇṭlō rātri bhōjanaṁ undi."
    "ipa": "d̪iːpaːʋaɭi roːdʒu maː iɳʈloː raːt̪ri bʱoːdʒanam und̪i"
  - "text": "మీరు ఆదివారం వస్తారా?"
    "reading": "mīru ādivāraṁ vastārā?"
    "ipa": "miːru aːd̪iʋaːram ʋast̪aːraː"
  - "text": "ఆదివారం స్నేహితులు, బంధువులు అందరూ వస్తారు."
    "reading": "ādivāraṁ snēhitulu, bandhuvulu andarū vastāru."
    "ipa": "aːd̪iʋaːram sneːhit̪ulu band̪ʱuʋulu and̪aruː ʋast̪aːru"
