  "title": "A notice for an art exhibition"
  "sentences":
  - "text": "మా గ్యాలరీలో శనివారం ఒక ప్రదర్శన జరుగుతుంది."
    "reading": "mā gyālarīlō śanivāraṁ oka pradarśana jarugutundi."
    "ipa": "maː ɡjaːlariːloː ʃaniʋaːram oka prad̪arʃana dʒaruɡut̪und̪i"
  - "text": "ఈ ప్రదర్శనలో కొత్త చిత్రాలు ఉంటాయి."
    "reading": "ī pradarśanalō kotta citrālu uṇṭāyi."
    "ipa": "iː prad̪arʃanaloː kot̪t̪a tʃit̪raːlu uɳʈaːji"
  - "text": "ఈ చిత్రాన్ని ఒక చిత్రకారుడు గీశాడు."
    "reading": "ī citrānni oka citrakāruḍu gīśāḍu."
    "ipa": "iː tʃit̪raːnni oka tʃit̪rakaːruɖu ɡiːʃaːɖu"
  - "text": "అందరూ రావచ్చు."
    "reading": "andarū rāvaccu."
    "ipa": "and̪aruː raːʋatʃtʃu"
