id: te-en-grammar-conjunctions
name: "Joining words"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "And, but, or, because: joining words and sentences. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: te-en-grammar-conjunctions-0001
    target: "మరియు"
    native: "and (formal)"
    reading: "mariyu"
    pos: "other"
    notes: "In speech, 'and' is often a long -ఊ on each word: టీయూ కాఫీయూ, tea and coffee."
  - id: te-en-grammar-conjunctions-0002
    target: "కానీ"
    native: "but"
    reading: "kaanii"
    pos: "other"
  - id: te-en-grammar-conjunctions-0003
    target: "లేదా"
    native: "or"
    reading: "leedaa"
    pos: "other"
  - id: te-en-grammar-conjunctions-0004
    target: "ఎందుకంటే"
    native: "because"
    reading: "endukantee"
    pos: "other"
  - id: te-en-grammar-conjunctions-0005
    target: "అందుకే"
    native: "that's why; so"
    reading: "andukee"
    pos: "other"
  - id: te-en-grammar-conjunctions-0006
    target: "అని"
    native: "that (quoting what is said or thought)"
    reading: "ani"
    pos: "other"
    notes: "Comes after the words quoted: వస్తాను అని చెప్పాడు, he said that he would come."
  - id: te-en-grammar-conjunctions-0007
    target: "అయితే"
    native: "if; then"
    reading: "ayitee"
    pos: "other"
    notes: "An 'if' is usually a verb ending: వర్షం పడితే, if it rains."
  - id: te-en-grammar-conjunctions-0008
    target: "కూడా"
    native: "also; too; even"
    reading: "kuudaa"
    pos: "other"
    notes: "నేను కూడా, me too."
