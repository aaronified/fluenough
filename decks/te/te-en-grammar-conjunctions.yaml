cards:
  - id: te-0352
    target: "మరియు"
    native: "and (formal)"
    reading: "mariyu"
    ipa: "mariju"
    pos: "other"
    notes: "In speech, 'and' is often a long -ఊ on each word: టీయూ కాఫీయూ, tea and coffee."
  - id: te-0353
    target: "కానీ"
    native: "but"
    reading: "kānī"
    ipa: "kaːniː"
    pos: "other"
  - id: te-0354
    target: "లేదా"
    native: "or"
    reading: "lēdā"
    ipa: "leːd̪aː"
    pos: "other"
  - id: te-0355
    target: "ఎందుకంటే"
    native: "because"
    reading: "endukaṇṭē"
    ipa: "end̪ukaɳʈeː"
    pos: "other"
  - id: te-0356
    target: "అందుకే"
    native: "that's why; so"
    reading: "andukē"
    ipa: "and̪ukeː"
    pos: "other"
  - id: te-0357
    target: "అని"
    native: "that (quoting what is said or thought)"
    reading: "ani"
    ipa: "ani"
    pos: "other"
    notes: "Comes after the words quoted: వస్తాను అని చెప్పాడు, he said that he would come."
  - id: te-0358
    target: "అయితే"
    native: "if; then"
    reading: "ayitē"
    ipa: "ajit̪eː"
    pos: "other"
    notes: "An 'if' is usually a verb ending: వర్షం పడితే, if it rains."
  - id: te-0359
    target: "కూడా"
    native: "also; too; even"
    reading: "kūḍā"
    ipa: "kuːɖaː"
    pos: "other"
    notes: "నేను కూడా, me too."
