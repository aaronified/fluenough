  - text: "సోమవారం గదులు శుభ్రం చేయండి."
    reading: "sōmavāraṁ gadulu śubhraṁ cēyaṇḍi."
    ipa: "soːmaʋaːram ɡad̪ulu ʃubʱram tʃeːjaɳɖi"
  - text: "మంగళవారం బట్టలు కడగండి."
    reading: "maṅgaḷavāraṁ baṭṭalu kaḍagaṇḍi."
    ipa: "maŋɡaɭaʋaːram baʈʈalu kaɖaɡaɳɖi"
  - text: "బుధవారం చెత్త తీయండి."
    reading: "budhavāraṁ cetta tīyaṇḍi."
    ipa: "bud̪ʱaʋaːram tʃet̪t̪a t̪iːjaɳɖi"
  - text: "శనివారం వంటిల్లు శుభ్రం చేయండి."
    reading: "śanivāraṁ vaṇṭillu śubhraṁ cēyaṇḍi."
    ipa: "ʃaniʋaːram ʋaɳʈillu ʃubʱram tʃeːjaɳɖi"
