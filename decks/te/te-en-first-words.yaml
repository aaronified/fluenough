schema: 1
id: te-en-first-words
name: "First words"
kind: vocab
theme: first-words
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Greetings, the respect Telugu builds into them, and how to say you are still learning. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: te-en-first-words-0001
    target: "నమస్కారం"
    native: "hello; goodbye"
    reading: "namaskaaram"
    pos: "other"
    tags: ["greeting"]
    notes: "Said with palms pressed together, to anyone. In a family, younger people often greet elders by touching their feet; a visitor is not expected to."
  - id: te-en-first-words-0002
    target: "మీరు"
    native: "you (respectful); you (plural)"
    reading: "miiru"
    pos: "other"
    tags: ["honorific"]
    notes: "Telugu has two words for 'you': మీరు for strangers, elders and anyone you respect, and నువ్వు (nuvvu) for friends, children and the very close. The verb changes with each. A learner is always safe with మీరు."
  - id: te-en-first-words-0003
    target: "ఏమండీ"
    native: "excuse me; hello (politely)"
    reading: "eemandii"
    pos: "other"
    tags: ["polite"]
    notes: "A polite way to get someone's attention."
  - id: te-en-first-words-0004
    target: "బాగున్నారా?"
    native: "How are you? (respectful)"
    reading: "baagunnaaraa?"
    pos: "phrase"
    tags: ["greeting"]
    notes: "Literally 'are you well?'. To a friend: బాగున్నావా? (baagunnaavaa?)."
  - id: te-en-first-words-0005
    target: "బాగున్నాను."
    native: "I'm fine."
    reading: "baagunnaanu."
    pos: "phrase"
    tags: ["greeting"]
    notes: "బాగు (baagu) is 'good, well'."
  - id: te-en-first-words-0006
    target: "ధన్యవాదాలు"
    native: "thank you"
    reading: "dhanyavaadaalu"
    pos: "other"
    tags: ["polite"]
    notes: "Formal. Many people simply say 'thanks' in English, and among family thanks are often left out."
  - id: te-en-first-words-0007
    target: "సరే"
    native: "OK; all right"
    reading: "saree"
    pos: "other"
  - id: te-en-first-words-0008
    target: "వెళ్ళొస్తాను"
    native: "goodbye (said by the one leaving)"
    reading: "vellostaanu"
    pos: "other"
    tags: ["greeting"]
    notes: "Literally 'I'll go and come back'. A plain 'I'm going' can sound final."
  - id: te-en-first-words-0009
    target: "నాకు తెలుగు రాదు."
    native: "I don't know Telugu."
    reading: "naaku telugu raadu."
    pos: "phrase"
    notes: "Literally 'Telugu does not come to me'."
  - id: te-en-first-words-0010
    target: "నేను ఇంకా తెలుగు నేర్చుకుంటున్నాను."
    native: "I'm still learning Telugu."
    reading: "neenu inkaa telugu neerchukuntunnaanu."
    pos: "phrase"
  - id: te-en-first-words-0011
    target: "నెమ్మదిగా మాట్లాడండి."
    native: "Please speak slowly."
    reading: "nemmadigaa maatlaadandi."
    pos: "phrase"
    tags: ["polite"]
    notes: "The ending -అండి makes a polite request: కూర్చోండి (kuurchoondi), please sit."
  - id: te-en-first-words-0012
    target: "మళ్ళీ చెప్పండి."
    native: "Please say that again."
    reading: "mallii cheppandi."
    pos: "phrase"
    tags: ["polite"]
