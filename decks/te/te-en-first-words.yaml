schema: 1
id: te-en-first-words
name: "First words"
kind: vocab
theme: first-words
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Greetings, the respect Telugu builds into them, and how to say you are still learning. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: te-0135
    target: "నమస్కారం"
    native: "hello; goodbye"
    reading: "namaskāram"
    ipa: "namaskaːram"
    pos: "other"
    tags: ["greeting"]
    notes: "Said with palms pressed together, to anyone. In a family, younger people often greet elders by touching their feet; a visitor is not expected to."
  - id: te-0136
    target: "మీరు"
    native: "you (respectful); you (plural)"
    reading: "mīru"
    ipa: "miːru"
    pos: "other"
    tags: ["honorific"]
    notes: "Telugu has two words for 'you': మీరు for strangers, elders and anyone you respect, and నువ్వు (nuvvu) for friends, children and the very close. The verb changes with each. A learner is always safe with మీరు."
  - id: te-0137
    target: "ఏమండీ"
    native: "excuse me; hello (politely)"
    reading: "ēmaṇḍī"
    ipa: "eːmaɳɖiː"
    pos: "other"
    tags: ["polite"]
    notes: "A polite way to get someone's attention."
  - id: te-0138
    target: "బాగున్నారా?"
    native: "How are you? (respectful)"
    reading: "bāgunnārā?"
    ipa: "baːɡunnaːraː"
    pos: "phrase"
    tags: ["greeting"]
    notes: "Literally 'are you well?'. To a friend: బాగున్నావా? (bagunnava?)."
  - id: te-0139
    target: "బాగున్నాను."
    native: "I'm fine."
    reading: "bāgunnānu."
    ipa: "baːɡunnaːnu"
    pos: "phrase"
    tags: ["greeting"]
    notes: "బాగు (bāgu) is 'good, well'."
  - id: te-0140
    target: "ధన్యవాదాలు"
    native: "thank you"
    reading: "dhanyavādālu"
    ipa: "d̪ʱanjaʋaːd̪aːlu"
    pos: "other"
    tags: ["polite"]
    notes: "Formal. Many people simply say 'thanks' in English, and among family thanks are often left out."
  - id: te-0141
    target: "సరే"
    native: "OK; all right"
    reading: "sarē"
    ipa: "sareː"
    pos: "other"
  - id: te-0142
    target: "వెళ్ళొస్తాను"
    native: "goodbye (said by the one leaving)"
    reading: "veḷḷostānu"
    ipa: "ʋeɭɭost̪aːnu"
    pos: "other"
    tags: ["greeting"]
    notes: "Literally 'I'll go and come back'. A plain 'I'm going' can sound final."
  - id: te-0143
    target: "నాకు తెలుగు రాదు."
    native: "I don't know Telugu."
    reading: "nāku telugu rādu."
    ipa: "naːku t̪eluɡu raːd̪u"
    pos: "phrase"
    notes: "Literally 'Telugu does not come to me'."
  - id: te-0144
    target: "నేను ఇంకా తెలుగు నేర్చుకుంటున్నాను."
    native: "I'm still learning Telugu."
    reading: "nēnu iṅkā telugu nērcukuṇṭunnānu."
    ipa: "neːnu iŋkaː t̪eluɡu neːrtʃukuɳʈunnaːnu"
    pos: "phrase"
  - id: te-0145
    target: "నెమ్మదిగా మాట్లాడండి."
    native: "Please speak slowly."
    reading: "nemmadigā māṭlāḍaṇḍi."
    ipa: "nemmad̪iɡaː maːʈlaːɖaɳɖi"
    pos: "phrase"
    tags: ["polite"]
    notes: "The ending -అండి makes a polite request: కూర్చోండి (kūrcōṇḍi), please sit."
  - id: te-0146
    target: "మళ్ళీ చెప్పండి."
    native: "Please say that again."
    reading: "maḷḷī ceppaṇḍi."
    ipa: "maɭɭiː tʃeppaɳɖi"
    pos: "phrase"
    tags: ["polite"]
