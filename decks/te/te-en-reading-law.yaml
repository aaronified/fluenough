  "title": "A leaflet on a tenant's rights"
  "sentences":
  - "text": "అద్దెదారుగా మీకు ఇంట్లో ఉండే హక్కు ఉంది."
    "reading": "addedārugā mīku iṇṭlō uṇḍē hakku undi."
    "ipa": "ad̪d̪ed̪aːruɡaː miːku iɳʈloː uɳɖeː hakku und̪i"
  - "text": "మీకు మాట్లాడే హక్కు ఉంది."
    "reading": "mīku māṭlāḍē hakku undi."
    "ipa": "miːku maːʈlaːɖeː hakku und̪i"
  - "text": "ఈ ఒప్పందం చట్టం ప్రకారం ఉండాలి."
    "reading": "ī oppandaṁ caṭṭaṁ prakāraṁ uṇḍāli."
    "ipa": "iː oppand̪am tʃaʈʈam prakaːram uɳɖaːli"
  - "text": "మీ హక్కుల ఉల్లంఘన జరిగితే కోర్టుకు వెళ్ళండి."
    "reading": "mī hakkula ullaṅghana jarigitē kōrṭuku veḷḷaṇḍi."
    "ipa": "miː hakkula ullaŋɡʱana dʒariɡit̪eː koːrʈuku ʋeɭɭaɳɖi"
