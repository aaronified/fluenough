schema: 1
id: te-en-grammar-sentences
name: "Basic sentences"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Word order, no 'is', and how Telugu says 'have' and 'like'. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: te-en-grammar-sentences-0001
    target: "నేను విద్యార్థిని."
    native: "I am a student."
    reading: "neenu vidyaarthini."
    pos: "phrase"
    notes: "No separate 'am': the ending -ని on విద్యార్థి says it."
  - id: te-en-grammar-sentences-0002
    target: "ఇది నా ఇల్లు."
    native: "This is my house."
    reading: "idi naa illu."
    pos: "phrase"
    notes: "There is no 'is' in the present."
  - id: te-en-grammar-sentences-0003
    target: "నేను టీ తాగుతాను."
    native: "I drink tea."
    reading: "neenu tii taagutaanu."
    pos: "phrase"
    notes: "Subject, object, verb: the verb comes last."
  - id: te-en-grammar-sentences-0004
    target: "ఆమె తెలుగు నేర్చుకుంటోంది."
    native: "She is learning Telugu."
    reading: "aame telugu neerchukuntoondi."
    pos: "phrase"
  - id: te-en-grammar-sentences-0005
    target: "నాకు తెలుగు ఇష్టం."
    native: "I like Telugu."
    reading: "naaku telugu ishtam."
    pos: "phrase"
    notes: "'To me, Telugu is liked': the one who likes takes -కి or -కు."
  - id: te-en-grammar-sentences-0006
    target: "నాకు ఒక కారు ఉంది."
    native: "I have a car."
    reading: "naaku oka kaaru undi."
    pos: "phrase"
    notes: "'To me there is a car': ఉంది, 'there is'."
  - id: te-en-grammar-sentences-0007
    target: "నా దగ్గర డబ్బులు లేవు."
    native: "I don't have any money on me."
    reading: "naa daggara dabbulu leevu."
    pos: "phrase"
    notes: "లేవు, 'there aren't', agrees with the plural డబ్బులు."
  - id: te-en-grammar-sentences-0008
    target: "ఇది బాగా లేదు."
    native: "This isn't good."
    reading: "idi baagaa leedu."
    pos: "phrase"
  - id: te-en-grammar-sentences-0009
    target: "వెళ్ళకండి."
    native: "Please don't go."
    reading: "vellakandi."
    pos: "phrase"
    notes: "-కండి makes a polite 'don't'."
  - id: te-en-grammar-sentences-0010
    target: "ఈరోజు చాలా వేడిగా ఉంది."
    native: "It's very hot today."
    reading: "iiroju chaalaa veedigaa undi."
    pos: "phrase"
