  "sentences":
  - "text": "ఈ గేటు ఉదయం ఆరు గంటలకు తెరవబడుతుంది."
    "reading": "ī gēṭu udayaṁ āru gaṇṭalaku teravabaḍutundi."
    "ipa": "iː ɡeːʈu ud̪ajam aːru ɡaɳʈalaku t̪eraʋabaɖut̪und̪i"
  - "text": "ఈ గేటు సాయంత్రం ఏడు గంటలకు మూయబడుతుంది."
    "reading": "ī gēṭu sāyantraṁ ēḍu gaṇṭalaku mūyabaḍutundi."
    "ipa": "iː ɡeːʈu saːjant̪ram eːɖu ɡaɳʈalaku muːjabaɖut̪und̪i"
  - "text": "నిన్న ఈ గది శుభ్రం చేయబడింది."
    "reading": "ninna ī gadi śubhraṁ cēyabaḍindi."
    "ipa": "ninna iː ɡad̪i ʃubʱram tʃeːjabaɖind̪i"
  - "text": "ఈ భోజనం వండబడుతుంది."
    "reading": "ī bhōjanaṁ vaṇḍabaḍutundi."
    "ipa": "iː bʱoːdʒanam ʋaɳɖabaɖut̪und̪i"
