schema: 1
id: te-en-grammar-future
name: "Future and habit"
kind: grammar
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I will go, she eats every day: one tense for both. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Non-past"
  slot_name: "person"
  slots: ["నేను", "మేము", "నువ్వు", "మీరు", "అతను", "ఆమె / అది", "వాళ్ళు"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The verb agrees with the doer's person and number. In the third person a man has a form of his own; a woman takes the same form as a thing: ఆమె వచ్చింది, అది వచ్చింది. మీరు, plural or respectful, takes the plural. The same form is the future and the habit: నేను టీ తాగుతాను is 'I will drink tea' and 'I drink tea'."
  entries:
    - lemma: "చేయడం"
      key: cheeyadam
      gloss: "to do"
      forms:
        "నేను": "చేస్తాను"
        "మేము": "చేస్తాము"
        "నువ్వు": "చేస్తావు"
        "మీరు": "చేస్తారు"
        "అతను": "చేస్తాడు"
        "ఆమె / అది": "చేస్తుంది"
        "వాళ్ళు": "చేస్తారు"
    - lemma: "వెళ్ళడం"
      key: velladam
      gloss: "to go"
      forms:
        "నేను": "వెళ్తాను"
        "మేము": "వెళ్తాము"
        "నువ్వు": "వెళ్తావు"
        "మీరు": "వెళ్తారు"
        "అతను": "వెళ్తాడు"
        "ఆమె / అది": "వెళ్తుంది"
        "వాళ్ళు": "వెళ్తారు"
    - lemma: "రావడం"
      key: raavadam
      gloss: "to come"
      forms:
        "నేను": "వస్తాను"
        "మేము": "వస్తాము"
        "నువ్వు": "వస్తావు"
        "మీరు": "వస్తారు"
        "అతను": "వస్తాడు"
        "ఆమె / అది": "వస్తుంది"
        "వాళ్ళు": "వస్తారు"
