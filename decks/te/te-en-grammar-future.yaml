schema: 1
id: te-en-grammar-future
name: "Future and habit"
kind: grammar
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I will go, she eats every day: one tense for both. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Non-past"
  slot_name: "person"
  slots: ["నేను", "మేము", "నువ్వు", "మీరు", "అతను", "ఆమె / అది", "వాళ్ళు"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The verb agrees with the doer's person and number. In the third person 'he' takes the masculine ending, -డు (-ḍu), and 'she' and 'it' share the ending -ది (-di): ఆమె వచ్చింది (āme vaccindi), అది వచ్చింది (adi vaccindi). మీరు (mīru), plural or respectful, takes the plural. The same form is the future and the habit: నేను టీ తాగుతాను (nēnu ṭī tāgutānu) is 'I will drink tea' and 'I drink tea'."
  entries:
    - lemma: "చేయడం"
      key: cheeyadam
      reading: "cēyaḍam"
      ipa: "tʃeːjaɖam"
      gloss: "to do"
      forms:
        "నేను": "చేస్తాను"
        "మేము": "చేస్తాము"
        "నువ్వు": "చేస్తావు"
        "మీరు": "చేస్తారు"
        "అతను": "చేస్తాడు"
        "ఆమె / అది": "చేస్తుంది"
        "వాళ్ళు": "చేస్తారు"
      readings:
        "నేను": "cēstānu"
        "మేము": "cēstāmu"
        "నువ్వు": "cēstāvu"
        "మీరు": "cēstāru"
        "అతను": "cēstāḍu"
        "ఆమె / అది": "cēstundi"
        "వాళ్ళు": "cēstāru"
      ipas:
        "నేను": "tʃeːst̪aːnu"
        "మేము": "tʃeːst̪aːmu"
        "నువ్వు": "tʃeːst̪aːʋu"
        "మీరు": "tʃeːst̪aːru"
        "అతను": "tʃeːst̪aːɖu"
        "ఆమె / అది": "tʃeːst̪und̪i"
        "వాళ్ళు": "tʃeːst̪aːru"
    - lemma: "వెళ్ళడం"
      key: velladam
      reading: "veḷḷaḍam"
      ipa: "ʋeɭɭaɖam"
      gloss: "to go"
      forms:
        "నేను": "వెళ్తాను"
        "మేము": "వెళ్తాము"
        "నువ్వు": "వెళ్తావు"
        "మీరు": "వెళ్తారు"
        "అతను": "వెళ్తాడు"
        "ఆమె / అది": "వెళ్తుంది"
        "వాళ్ళు": "వెళ్తారు"
      readings:
        "నేను": "veḷtānu"
        "మేము": "veḷtāmu"
        "నువ్వు": "veḷtāvu"
        "మీరు": "veḷtāru"
        "అతను": "veḷtāḍu"
        "ఆమె / అది": "veḷtundi"
        "వాళ్ళు": "veḷtāru"
      ipas:
        "నేను": "ʋeɭt̪aːnu"
        "మేము": "ʋeɭt̪aːmu"
        "నువ్వు": "ʋeɭt̪aːʋu"
        "మీరు": "ʋeɭt̪aːru"
        "అతను": "ʋeɭt̪aːɖu"
        "ఆమె / అది": "ʋeɭt̪und̪i"
        "వాళ్ళు": "ʋeɭt̪aːru"
    - lemma: "రావడం"
      key: raavadam
      reading: "rāvaḍam"
      ipa: "raːʋaɖam"
      gloss: "to come"
      forms:
        "నేను": "వస్తాను"
        "మేము": "వస్తాము"
        "నువ్వు": "వస్తావు"
        "మీరు": "వస్తారు"
        "అతను": "వస్తాడు"
        "ఆమె / అది": "వస్తుంది"
        "వాళ్ళు": "వస్తారు"
      readings:
        "నేను": "vastānu"
        "మేము": "vastāmu"
        "నువ్వు": "vastāvu"
        "మీరు": "vastāru"
        "అతను": "vastāḍu"
        "ఆమె / అది": "vastundi"
        "వాళ్ళు": "vastāru"
      ipas:
        "నేను": "ʋast̪aːnu"
        "మేము": "ʋast̪aːmu"
        "నువ్వు": "ʋast̪aːʋu"
        "మీరు": "ʋast̪aːru"
        "అతను": "ʋast̪aːɖu"
        "ఆమె / అది": "ʋast̪und̪i"
        "వాళ్ళు": "ʋast̪aːru"
