native: { code: "en", iso639_3: "eng", name: "English" }
name: "Respect"
description: "Showing respect in Telugu: the polite you మీరు (mīru) and the everyday you నువ్వు (nuvvu), the respect word -గారు (-gāru) after a name, the words సార్ (sār) and మేడమ్ (mēḍam), and the polite verb ending -ండి (-ṇḍi). Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "te-6400":
    native: "How are you? (to someone you call మీరు)"
    notes:
      "n1": "The polite you మీరు (mīru) takes the verb ending -ఆరు (-āru) in the present: ఉన్నారు (unnāru), are."
  "te-6401":
    native: "How are you? (to a friend)"
    notes:
      "n1": "The everyday you నువ్వు (nuvvu) takes -ఆవు (-āvu) in the present: ఉన్నావు (unnāvu), are. Use it only with someone you know well."
  "te-6402":
    native: "Mr Ramu, please come."
    notes:
      "n1": "-గారు (-gāru) goes after a name to show respect, whether the person is a man or a woman: రాము గారు (rāmu gāru), Mr Ramu. The polite come is రండి (raṇḍi)."
  "te-6403":
    native: "Sir, please sit."
    notes:
      "n1": "సార్ (sār), sir, is used on its own to address a man, or after a name. The polite sit is కూర్చోండి (kūrcōṇḍi): the verb takes -ండి (-ṇḍi)."
  "te-6404":
    native: "Madam, please tell me."
    notes:
      "n1": "మేడమ్ (mēḍam), madam, is used on its own to address a woman. The polite tell is చెప్పండి (ceppaṇḍi): the verb takes -ండి (-ṇḍi)."
  "te-6405":
    native: "Please sit here."
    notes:
      "n1": "ఇక్కడ (ikkaḍa), here, comes before the verb. The polite sit takes -ండి (-ṇḍi), as in కూర్చోండి (kūrcōṇḍi)."
  "te-6406":
    native: "What do you eat?"
    notes:
      "n1": "The polite you మీరు (mīru) takes the verb ending -ఆరు (-āru) in the present: తింటారు (tiṇṭāru), eat."
  "te-6407":
    native: "What do you eat?"
    notes:
      "n1": "The everyday you నువ్వు (nuvvu) takes -ఆవు (-āvu) in the present: తింటావు (tiṇṭāvu), eat. The same question is polite with మీరు (mīru) in te-6406."
  "te-6408":
    native: "What is your name? (polite)"
    notes:
      "n1": "మీ (mī), your, is the possessive of మీరు (mīru). The polite question takes no verb."
  "te-6409":
    native: "What is your name? (to a friend)"
    notes:
      "n1": "నీ (nī), your, is the possessive of నువ్వు (nuvvu). Use it only with someone you know well."
  "te-6410":
    native: "Where do you live? (polite)"
    notes:
      "n1": "The polite you మీరు (mīru) takes -ఆరు (-āru) in the present: ఉంటారు (uṇṭāru), stay or live."
  "te-6411":
    native: "Where do you live? (to a friend)"
    notes:
      "n1": "The everyday you నువ్వు (nuvvu) takes -ఆవు (-āvu) in the present: ఉంటావు (uṇṭāvu), stay or live."
  "te-6412":
    native: "You tell me. (polite)"
    notes:
      "n1": "The polite you మీరు (mīru) is the subject; నాకు (nāku), to me, comes before the verb. The polite tell takes -ండి (-ṇḍi), as in చెప్పండి (ceppaṇḍi)."
  "te-6413":
    native: "Sir, please drink some water."
    notes:
      "n1": "సార్ (sār), sir, is used on its own to address a man. The polite drink is తాగండి (tāgaṇḍi): the verb takes -ండి (-ṇḍi). The thing drunk comes first: నీళ్ళు (nīḷḷu), water."
  "te-6414":
    native: "Madam, all right."
    notes:
      "n1": "మేడమ్ (mēḍam), madam, is used on its own to address a woman. సరేనండి (sarēnaṇḍi), all right, adds -ండి (-ṇḍi) to show respect, as in te-0184."
