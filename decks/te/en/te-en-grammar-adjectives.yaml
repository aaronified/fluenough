schema: 1
id: "te-en-grammar-adjectives"
kind: "layer"
core: "te-grammar-adjectives"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing words"
description: "Good, big, new: a describing word before a noun never changes; after it, it takes -గా (-gā). Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "te-0500":
    native: "good"
    notes:
      "n1": "Before a noun a describing word never changes: మంచి అబ్బాయి (mañci abbāyi), a good boy; మంచి అమ్మాయి (mañci ammāyi), a good girl."
  "te-0501":
    native: "bad"
  "te-0502":
    native: "big; elder"
    alt_native: ["large"]
  "te-0503":
    native: "small; younger"
    alt_native: ["little"]
  "te-0504":
    native: "new"
  "te-0505":
    native: "hot"
  "te-0506":
    native: "cold; cool"
  "te-0507":
    native: "beautiful"
    alt_native: ["lovely"]
    notes:
      "n1": "Many describing words are a noun with -ఐన (-aina) or -మైన (-maina): అందం (andam), beauty; అందమైన (andamaina), beautiful."
  "te-0508":
    native: "clean"
  "te-0509":
    native: "This is a good book."
    alt_native: ["This book is good."]
  "te-0510":
    native: "This room is big."
    alt_native: ["This room is large."]
    notes:
      "n1": "To say a thing is big, the describing word takes -గా (-gā) and ఉంది (undi) follows: పెద్దగా ఉంది (peddagā undi)."
  "te-0511":
    native: "The coffee is very hot."
