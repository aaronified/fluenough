schema: 1
id: "te-en-grammar-adjectives"
kind: "layer"
core: "te-grammar-adjectives"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing words"
description: "Good, big, new: a describing word before a noun never changes; after it, it takes -గా (-gā). Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "te-0500":
    native: "good"
    notes:
      "n1": "Before a noun a describing word never changes: మంచి అబ్బాయి (mañci abbāyi), a good boy; మంచి అమ్మాయి (mañci ammāyi), a good girl."
    "examples": {
      "అతను మంచి ఆటగాడు.": {"native": "He is a good player.", "bases": {}},
      "అది మంచి ఆలోచన!": {"native": "That is a good idea!", "bases": {}}
    }
  "te-0501":
    native: "bad"
  "te-0502":
    native: "big; elder"
    alt_native: ["large"]
    "examples": {
      "ఆటస్థలం పెద్దది.": {"native": "The playground is big.", "bases": {}},
      "ఇది అన్నిటికంటే పెద్దది.": {"native": "This is the biggest of all.", "bases": {"పెద్దది": "big; elder"}}
    }
  "te-0503":
    native: "small; younger"
    alt_native: ["little"]
    "examples": {
      "అతను ఆమె కంటే చిన్నవాడు.": {"native": "He is younger than her.", "bases": {"చిన్నవాడు": "small; younger"}},
      "ఆ పడవ చాలా చిన్నది.": {"native": "That boat is very small.", "bases": {}}
    }
  "te-0504":
    native: "new"
    "examples": {
      "ఇది కొత్త యుగం.": {"native": "This is a new era.", "bases": {}},
      "ఈ పెన్ను కొత్తది.": {"native": "This pen is new.", "bases": {}}
    }
  "te-0505":
    native: "hot"
    "examples": {
      "మరీ వేడిగా ఉంది.": {"native": "It's too hot.", "bases": {}},
      "ఇవాళ చాలా వేడిగా ఉంది.": {"native": "It is very hot today.", "bases": {}}
    }
  "te-0506":
    native: "cold; cool"
    "examples": {
      "కిటికీ నుంచి చల్లని గాలి వస్తోంది.": {"native": "A cool breeze is coming through the window.", "bases": {}}
    }
  "te-0507":
    native: "beautiful"
    alt_native: ["lovely"]
    notes:
      "n1": "Many describing words are a noun with -ఐన (-aina) or -మైన (-maina): అందం (andam), beauty; అందమైన (andamaina), beautiful."
    "examples": {
      "ఆలయంలో అందమైన శిల్పాలు ఉన్నాయి.": {"native": "There are beautiful sculptures in the temple.", "bases": {}}
    }
  "te-0508":
    native: "clean"
    "examples": {
      "గాయానికి శుభ్రమైన బ్యాండేజ్ కట్టండి.": {"native": "Tie a clean bandage on the wound.", "bases": {}}
    }
  "te-0509":
    native: "This is a good book."
    alt_native: ["This book is good."]
  "te-0510":
    native: "This room is big."
    alt_native: ["This room is large."]
    notes:
      "n1": "To say a thing is big, the describing word takes -గా (-gā) and ఉంది (undi) follows: పెద్దగా ఉంది (peddagā undi)."
  "te-0511":
    native: "The coffee is very hot."
