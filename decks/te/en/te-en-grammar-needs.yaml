schema: 1
id: "te-en-grammar-needs"
kind: "layer"
core: "te-grammar-needs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Need and want"
description: "కావాలి (kāvāli), వద్దు (vaddu) and అవసరం (avasaraṁ): what you need, what you want, and what you don't. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "te-0460":
    native: "is needed; is wanted"
    alt_native: ["is required"]
    notes:
      "n1": "It stays the same whoever needs it, and the one who needs takes -కు (-ku): నాకు (nāku), మీకు (mīku), అతనికి (ataniki) … కావాలి (kāvāli), 'to me it is needed'."
  "te-0461":
    notes:
      "n1": "The person who needs something is in the dative: మీకు (mīku), 'to you'; the thing needed stays plain."
    native: "What would you like? (what a shopkeeper asks)"
    alt_native: ["What do you want?"]
  "te-0462":
    notes:
      "n1": "The person who needs something is in the dative: నాకు (nāku), 'to me'; the thing needed, నీళ్ళు (nīḷḷu), stays plain."
    native: "I'd like some water."
  "te-0463":
    native: "is not wanted; no, thank you"
    alt_native: ["No thanks."]
    notes:
      "n1": "The opposite of కావాలి (kāvāli): నాకు వద్దు (nāku vaddu), I don't want it. On its own, a polite no."
    "examples": {
      "చాలు, ఇంకా వద్దు.": {"native": "That's enough, no more.", "bases": {}},
      "నాకు ఇది వద్దు.": {"native": "I don't want this.", "bases": {}}
    }
  "te-0464":
    notes:
      "n1": "The one who does not want takes the -ku ending: నాకు (nāku), to me, while ఇది (idi), this, stays plain, as in the course's నాకు (nāku) వద్దు (vaddu)."
    native: "I don't want this."
  "te-0465":
    native: "need; necessary"
    alt_native: ["required", "essential"]
    notes:
      "n1": "నాకు డబ్బు అవసరం (nāku ḍabbu avasaraṁ), I need money: a firmer need than కావాలి (kāvāli)."
    "examples": {
      "అవసరం లేదు.": {"native": "There's no need.", "bases": {}},
      "పిల్లలకు మంచి విద్య అవసరం.": {"native": "Children need good education.", "bases": {}}
    }
  "te-0466":
    notes:
      "n1": "అవసరం (avasaraṁ), need, with లేదు (lēdu), there is not, is the way to say there is no need."
    native: "There's no need."
    alt_native: ["It is not necessary."]
  "te-0467":
    notes:
      "n1": "The person who needs something is in the dative: నాకు (nāku), 'to me'; the thing needed, సహాయం (sahāyaṁ), stays plain."
    native: "I need some help."
    alt_native: ["I require some help."]
  "te-0468":
    native: "I want to go home."
    alt_native: ["I wish to go home."]
    notes:
      "n1": "To want to do something: the verb in -ఆలని (-ālani), then ఉంది (undi), 'to me there is a wish to go'."
