schema: 1
id: "te-en-grammar-questions"
kind: "layer"
core: "te-grammar-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Basic questions"
description: "Yes/no questions with -ఆ (-ā), and question words. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "te-0169":
    native: "Do you speak Telugu?"
    notes:
      "n1": "-ఆ (-ā) at the end of the verb makes a yes/no question."
    bases:
      "తెలుగు": "Telugu (the language)"
  "te-0170":
    native: "Will you have tea?"
  "te-0171":
    native: "What is this?"
    notes:
      "n1": "The question word goes where the answer would."
  "te-0172":
    native: "Where are you going?"
    notes:
      "n1": "ఎక్కడికి (ekkaḍiki), 'to where', from ఎక్కడ (ekkaḍa), 'where'."
  "te-0173":
    native: "Who is he?"
    notes:
      "n1": "ఆయన (āyana) is a respectful 'he'; ఆవిడ (āviḍa), a respectful 'she'."
  "te-0174":
    native: "When will you come?"
    notes:
      "n1": "రావడం (rāvaḍam) changes its stem in the present and future: వస్- (vas-)."
  "te-0175":
    native: "Why are you learning Telugu?"
    bases:
      "తెలుగు": "Telugu (the language)"
  "te-0176":
    native: "How many children do you have?"
    notes:
      "n1": "ఎంత మంది (enta mandi), 'how many people'."
    bases:
      "మంది": "people (when counting)"
  "te-0177":
    native: "How is it?"
  "te-0178":
    native: "It's good, isn't it?"
    notes:
      "n1": "కదా (kadā) at the end asks for agreement."
    bases:
      "బాగుంది": "good; well"
      "కదా": "isn't it? (a tag question)"
