contrasts:
  "vowel-length": "a short or a long vowel"
  "dental-retroflex": "the tongue on the teeth or curled back"
  "lateral": "the l on the teeth or curled back"
  "gemination": "a single or a double consonant"
  "aspiration": "a breath after the consonant"
  "anusvara": "a closing m at a word's end against none"
  "rhotic": "a single tap of r against a trilled, held r"
  "visarga": "a breath h after a vowel against none"
description: "Telugu vowels come short or long (a and ā, i and ī, u and ū, e and ē, o and ō), and length changes the word: కలం (kalaṁ), pen, and కాలం (kālaṁ), time. English vowels have length too, but not as a contrast that changes words, so the long Telugu ones are new to an English learner. The t, d, n and l come in two forms: dental, with the tongue on the teeth (t̪, d̪, n̪, l̪), and retroflex, with the tongue curled back (ʈ, ɖ, ɳ, ɭ). English t, d and n sit on the ridge behind the teeth, close to the dental ones; the retroflex ones are new. The letter ḷ, written ళ, is the curled-back l. The letter ṟ, written ఱ, is a trilled r held longer than ర, close to English r but new. The sign ṁ, written ం, closes a word with an m. The sign ḥ, written ః, is a breath h after a vowel, and is new. Aspirated stops (kh, gh, ch, jh, ṭh, ḍh, th, dh, ph, bh) have a breath after the consonant: new to English, which has no such contrast."
