schema: 1
id: "te-en-things"
kind: "layer"
core: "te-things"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Things around you"
description: "Everyday objects: book, pen, bag, clock, phone, key, vehicles, things in the bathroom and on the bed, money, letters and photographs. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0865":
    native: "book"
    wiktionary: true
    notes:
      "n1": "In the plural {1}; 'in the book' is {2}."
    "examples": {
      "పుస్తకం తీసుకో.": {"native": "Take the book.", "bases": {"పుస్తకం": "book"}},
      "ఇది నా పుస్తకం.": {"native": "This is my book.", "bases": {}}
    }
  "te-0866":
    native: "pencil"
    wiktionary: true
    notes:
      "n1": "A word from English."
  "te-0867":
    native: "paper; a sheet of paper"
    wiktionary: true
    notes:
      "n1": "Also a document: {1}, a paper."
    "examples": {
      "దయచేసి కాగితం మడవండి.": {"native": "Please fold the paper.", "bases": {}},
      "ఈ ప్రింటర్‌లో కాగితం లేదు.": {"native": "There is no paper in this printer.", "bases": {}}
    }
  "te-0868":
    native: "bag; shopping bag"
    wiktionary: true
    notes:
      "n1": "A bag of cloth or plastic, for carrying."
    "examples": {
      "అది మీ సంచి కాదు.": {"native": "That is not your bag.", "bases": {}}
    }
  "te-0869":
    native: "umbrella"
    wiktionary: true
    notes:
      "n1": "Used against the sun as well as the rain."
    "examples": {
      "వర్షాకాలంలో గొడుగు తీసుకో.": {"native": "Take an umbrella in the rainy season.", "bases": {}},
      "నా గొడుగు ఎక్కడ ఉంది?": {"native": "Where is my umbrella?", "bases": {}}
    }
  "te-0870":
    native: "clock; watch"
    wiktionary: true
    notes:
      "n1": "It means both a clock and a wrist watch."
    "examples": {
      "ఈ ఎలక్ట్రానిక్ గడియారం పాడైపోయింది.": {"native": "This electronic clock has broken.", "bases": {}}
    }
  "te-0871":
    native: "glasses; spectacles"
    alt_native: ["eyeglasses", "specs"]
    wiktionary: true
    notes:
      "n1": "Always plural. Literally 'eye mirrors': {1}, eyes, and {2}, mirrors."
  "te-0872":
    native: "phone"
    alt_native: ["telephone"]
    notes:
      "n1": "A word from English; used for both a landline and a mobile."
    "examples": {
      "ఫోన్ చేయడం": {"native": "to phone", "bases": {"ఫోన్": "phone"}},
      "ఫోన్ తీసుకురా.": {"native": "Bring the phone.", "bases": {"ఫోన్": "phone"}}
    }
  "te-0873":
    native: "mobile phone"
    alt_native: ["cell phone"]
    notes:
      "n1": "Also {1} in speech."
  "te-0874":
    native: "computer"
    wiktionary: true
    notes:
      "n1": "A word from English."
    "examples": {
      "అతను కంప్యూటర్ వాడతాడు.": {"native": "He uses a computer.", "bases": {}},
      "ఆమెకు కంప్యూటర్ నైపుణ్యం ఉంది.": {"native": "She has computer skills.", "bases": {}}
    }
  "te-0875":
    native: "television"
    alt_native: ["TV"]
    notes:
      "n1": "Said as the English letters T and V."
    "examples": {
      "దయచేసి టీవీ ఆన్ చేయండి.": {"native": "Please switch on the TV.", "bases": {}},
      "నేను తక్కువగా టీవీ చూస్తాను.": {"native": "I watch TV rarely.", "bases": {}}
    }
  "te-0876":
    native: "lock"
    wiktionary: true
    notes:
      "n1": "The key is {1}, literally 'the lock's ear'."
    "examples": {
      "నేను తాళం తిప్పుతాను.": {"native": "I turn the key.", "bases": {}},
      "తాళం చెవి బల్ల మీద ఉంది.": {"native": "The key is on the table.", "bases": {"తాళం": "lock"}}
    }
  "te-0877":
    native: "bicycle"
    alt_native: ["bike", "cycle"]
    notes:
      "n1": "A word from English."
    "examples": {
      "ఆ పిల్లవాడు సైకిల్ నుంచి కిందపడతాడు.": {"native": "The boy falls down from the bicycle.", "bases": {}},
      "కార్ల ఉద్గారాలను తగ్గించడానికి సైకిల్ వాడండి.": {"native": "To cut down car emissions, use a bicycle.", "bases": {}}
    }
  "te-0878":
    native: "vehicle; cart; motorbike"
    wiktionary: true
    notes:
      "n1": "A general word: a cart, a motorbike, or any vehicle in speech."
    "examples": {
      "బండిని నెడతాడు.": {"native": "He pushes the cart.", "bases": {}},
      "పొగమంచులో బండి నెమ్మదిగా నడుస్తోంది.": {"native": "The vehicle is moving slowly in the fog.", "bases": {}}
    }
  "te-0879":
    native: "car"
    alt_native: ["automobile"]
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the -ఉ (-u) drops before -లు (-lu)."
    "examples": {
      "కారు పార్కింగ్‌లో పెట్టాను.": {"native": "I parked the car in the parking lot.", "bases": {}},
      "కారులో ఇంధనం ఉంది.": {"native": "There is fuel in the car.", "bases": {"కారులో": "car"}}
    }
  "te-0880":
    native: "scooter"
    notes:
      "n1": "A word from English."
  "te-0881":
    native: "soap"
    wiktionary: true
    notes:
      "n1": "The plural is {1}."
  "te-0882":
    native: "comb"
    wiktionary: true
    notes:
      "n1": "The verb is {1}, to comb."
  "te-0883":
    native: "mirror"
    wiktionary: true
    notes:
      "n1": "Also glass: {1}, spectacles, is 'eye glasses'."
    "examples": {
      "నేను అద్దం ముందు దువ్వుకుంటాను.": {"native": "I comb my hair in front of the mirror.", "bases": {}}
    }
  "te-0884":
    native: "broom"
    wiktionary: true
    notes:
      "n1": "The verb is {1}, to sweep."
  "te-0885":
    native: "bucket"
    alt_native: ["pail"]
    notes:
      "n1": "A word from English."
    "examples": {
      "నేను బకెట్ ఎత్తుతాను.": {"native": "I lift the bucket.", "bases": {}}
    }
  "te-0886":
    native: "pillow"
    wiktionary: true
    notes:
      "n1": "With {1}, a blanket, it makes up the bedding."
    "examples": {
      "పిల్లవాడు చాక్లెట్లను దిండు కింద దాచిపెడతాడు.": {"native": "The boy hides the chocolates under the pillow.", "bases": {}}
    }
  "te-0887":
    native: "blanket; sheet"
    wiktionary: true
    notes:
      "n1": "A cloth to cover yourself in bed."
    "examples": {
      "అమ్మ పిల్లవాడికి దుప్పటి కప్పుతుంది.": {"native": "Mum covers the child with a blanket.", "bases": {}},
      "చలిగా ఉంది, నేను దుప్పటిని చుట్టుకుంటాను.": {"native": "It is cold, so I wrap myself in a blanket.", "bases": {}}
    }
  "te-0888":
    native: "mat (of reed or straw)"
    wiktionary: true
    notes:
      "n1": "A mat to sit or sleep on."
    "examples": {
      "దయచేసి చాపను చుట్టండి.": {"native": "Please roll up the mat.", "bases": {}}
    }
  "te-0889":
    native: "towel"
    notes:
      "n1": "The Telugu word is {1}."
    "examples": {
      "దయచేసి టవల్ ఇవ్వండి.": {"native": "Please give me a towel.", "bases": {}}
    }
  "te-0890":
    native: "thing; object"
    alt_native: ["item"]
    wiktionary: true
    notes:
      "n1": "A word from Sanskrit."
    "examples": {
      "ఆమె చేతిపని వస్తువులు అమ్ముతుంది.": {"native": "She sells handicraft goods.", "bases": {}},
      "ఈ వస్తువు పరిమాణం చిన్నది.": {"native": "The size of this item is small.", "bases": {}}
    }
  "te-0891":
    native: "luggage; goods; household things"
    alt_native: ["baggage"]
    wiktionary: true
    notes:
      "n1": "Always singular: {1} is all the things together."
    "examples": {
      "సామాను బరువు ఎంత?": {"native": "How heavy is the luggage?", "bases": {"సామాను": "luggage; goods; household things"}}
    }
  "te-0892":
    native: "banknote; a written note"
    alt_native: ["bill"]
    notes:
      "n1": "The word for a banknote and for a note you write down."
  "te-0893":
    native: "coin"
    notes:
      "n1": "The plural is {1}."
  "te-0894":
    native: "box; trunk"
    wiktionary: true
    notes:
      "n1": "A box of any size, even a suitcase."
    "examples": {
      "ఈ పెట్టెలో ఏదీ లేదు.": {"native": "There is nothing in this box.", "bases": {}},
      "ఆమె డబ్బును ఒక పెట్టెలో దాచుకుంటుంది.": {"native": "She keeps her money in a box.", "bases": {}}
    }
  "te-0895":
    native: "photo"
    alt_native: ["photograph", "pic"]
    notes:
      "n1": "A word from English."
    "examples": {
      "ఫోటోలకు బ్యాకప్ తీసుకున్నావా?": {"native": "Did you back up the photos?", "bases": {}},
      "ఫోటోలు డిలీట్ చేయకండి.": {"native": "Do not delete the photos.", "bases": {}}
    }
  "te-0896":
    native: "letter (written)"
    wiktionary: true
    notes:
      "n1": "The everyday word is {1}."
    "examples": {
      "మున్సిపాలిటీ నుంచి ఒక లేఖ వచ్చింది.": {"native": "A letter came from the municipality.", "bases": {}}
    }
  "te-0897":
    native: "newspaper"
    wiktionary: true
    notes:
      "n1": "Built from {1}, news, and {2}, a paper."
  "te-0898":
    native: "picture; doll; toy"
    wiktionary: true
    notes:
      "n1": "It means a picture, a doll or a toy."
    "examples": {
      "నేను బొమ్మ గీస్తాను.": {"native": "I draw a picture.", "bases": {}},
      "ఈ బొమ్మ ఎవరు గీశారు?": {"native": "Who drew this picture?", "bases": {}}
    }
  "te-0899":
    native: "ball"
    wiktionary: true
    notes:
      "n1": "Also a marigold: {1}."
    "examples": {
      "ఆటగాడు బంతిని విసురుతాడు.": {"native": "The player throws the ball.", "bases": {}},
      "చివరి బంతికి సిక్సర్ కొట్టాడు.": {"native": "He hit a six off the last ball.", "bases": {}}
    }
  "te-0900":
    native: "candle"
    wiktionary: true
    notes:
      "n1": "Built from {1}, fat or wax, and {2}, a wick."
  "te-0901":
    native: "matchbox"
    wiktionary: true
    notes:
      "n1": "Built from {1}, fire, and {2}, a box."
  "te-0902":
    native: "rubbish; waste"
    alt_native: ["garbage", "trash"]
    wiktionary: true
    notes:
      "n1": "A dustbin is {1}."
    "examples": {
      "కాలువలో చెత్త వేయకండి.": {"native": "Do not put rubbish in the drain.", "bases": {}},
      "చెత్తబుట్టలో చెత్త ఉంది.": {"native": "There is rubbish in the dustbin.", "bases": {}}
    }
