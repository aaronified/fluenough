schema: 1
id: "te-en-restaurant"
kind: "layer"
core: "te-restaurant"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Restaurants and ordering"
description: "Ordering in Hyderabad and the Andhra towns: menus, the meal, asking for less spice, and taking food away. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-6425":
    native: "menu"
    notes:
      "n1": "From English. Menus in Hyderabad and the Andhra towns often list dishes in English letters too, so a learner sees both names."
    examples:
      "మెను ఇవ్వండి.": "Please give the menu."
      "మెనులో ఏమి ఉంది?": { "native": "What is on the menu?", "bases": { "మెనులో": "menu", "ఏమి": "what" } }
  "te-6426":
    native: "meals; a full rice meal"
    notes:
      "n1": "The plural of భోజనం (bhōjanaṁ), a meal. On a restaurant board, 'Meals' means a full rice meal with several dishes served together."
    examples:
      "మధ్యాహ్నం భోజనాలు బాగున్నాయి.": { "native": "The lunch meals are good.", "bases": { "మధ్యాహ్నం": "midday; afternoon", "బాగున్నాయి": "to be good; to taste good" } }
      "భోజనాలు ఎంత?": "How much are the meals?"
  "te-6427":
    native: "a cheap eating house"
    notes:
      "n1": "A mess is a cheap canteen-style place with a fixed meal, popular with students and workers. Telugu speakers use the English word."
    examples:
      "ఈ మెస్ చాలా చౌక.": "This mess is very cheap."
      "మెస్ భోజనం చాలా బాగుంది.": { "native": "The meal at the mess is very good.", "bases": { "బాగుంది": "to be good; to taste good" } }
  "te-6428":
    native: "takeaway; parcel"
    notes:
      "n1": "Food to take away. Ask for it to be packed with పార్సిల్ చేయండి (pārsil cēyaṇḍi), pack it for me."
    examples:
      "పార్సిల్ ఇవ్వండి.": "Please give it as a parcel, to take away."
      "నాకు పార్సిల్ కావాలి.": "I'd like a takeaway parcel."
  "te-6429":
    native: "non-vegetarian food"
    notes:
      "n1": "The opposite of శాకాహారం (śākāhāraṁ), vegetarian food. Menus mark dishes as veg or non-veg."
    examples:
      "నేను మాంసాహారం తింటాను.": "I eat non-vegetarian food."
      "ఇది మాంసాహారమా?": { "native": "Is this non-vegetarian?", "bases": { "మాంసాహారమా": "non-vegetarian food" } }
  "te-6430":
    native: "plate (a portion of food)"
    notes:
      "n1": "A portion of a dish is ordered by the plate: ఒక ప్లేట్ (oka plēṭ) is one plate. The plate you eat from is పళ్ళెం (paḷḷeṁ)."
    examples:
      "ఒక ప్లేట్ ఇవ్వండి.": "Please give one plate."
      "మటన్ ప్లేట్ ఎంత?": "How much is a plate of mutton?"
  "te-6431":
    native: "waiter"
    notes:
      "n1": "To call a waiter, many people say అన్నా (annā), elder brother, a friendly address to a man a little older."
    examples:
      "వెయిటర్ ఇక్కడ ఉన్నాడు.": "The waiter is here."
      "అన్నా, బిల్లు ఇవ్వండి.": "Brother, please give the bill."
  "te-6432":
    native: "Please give me a little more rice."
    notes:
      "n1": "ఇంకొంచెం (iṅkoñceṁ) is ఇంకా (iṅkā), more, with కొంచెం (koñceṁ), a little. It works for curry or chutney too: ఇంకొంచెం పచ్చడి (iṅkoñceṁ paccaḍi)."
  "te-6433":
    native: "Please put in less chilli."
    notes:
      "n1": "కారం తక్కువ (kāraṁ takkuva) is less spicy. Food in Andhra and Telangana is often hot, so this is a useful phrase."
  "te-6434":
    native: "How much is a plate?"
  "te-6435":
    native: "Is it spicy?"
  "te-6436":
    native: "Please give one more."
    notes:
      "n1": "ఇంకొకటి (iṅkokaṭi) is ఇంకా (iṅkā), more, with ఒకటి (okaṭi), one."
  "te-6437":
    native: "Please pack it to take away."
  "te-6438":
    native: "Brother, the menu, please."
  "te-6439":
    native: "The meal is very good."
    bases:
      "బాగుంది": "to be good; to taste good"
  "te-6440":
    native: "Is there a free table?"
    notes:
      "n1": "టేబుల్ (ṭēbul) is the English word table. The Telugu word is బల్ల (balla)."
