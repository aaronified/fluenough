description: "Eighteen short items from Telugu poems, plays, essays and novels by writers who died by 1955, each with its source, its rights basis and a note. Some dates are those of a later printing, and the notes say so. Not yet checked by a Telugu speaker: please report any mistake."

cards:
  "te-8850":
    native: "A country is not soil; a country is its people."
    notes:
      "n1": "Stanza 10 of Gurajada Apparao's poem Desamunu Preminchumanna, which asks people to love their country and to work for it. The poem was written in 1910 and printed in 1913."
    bases:
      "దేశమంటే": "as for the country (the word for country with an as-for ending)"
      "మట్టి": "soil, earth"
      "కాదోయి": "is not; the oi ending is a friendly address"
      "మనుషులోయి": "people; the oi ending is a friendly address"
  "te-8851":
    native: "Packing up and leaving here quickly is the sign of wisdom, but I do not at all want to give up Madhuravani."
    notes:
      "n1": "A sentence from Girisam's opening speech in the first scene. Girisam, the scheming 'teacher', says it alone on stage, soon before his pupil Venkatesam enters. It is printed in the 1961 edition of Gurajada Apparao's play Kanyasulkam on Telugu Wikisource. Madhuravani is a courtesan in the play. The edition uses an older spelling. Forms that differ from today's: యిక్కణ్ణింకి (yikkaṇṇiṅki) is ఇక్కణ్ణుంచి (ikkaṇṇuñci); యెత్తి (yetti) is ఎత్తి (etti); వెయ్యడమే (veyyaḍamē) is వేయడమే (vēyaḍamē); గాని (gāni) is కాని (kāni); యేమీ (yēmī) is ఏమీ (ēmī); వున్నది (vunnadi) is ఉన్నది (unnadi)."
    bases:
      "శీఘ్రంగా": "quickly"
      "యిక్కణ్ణింకి": "from here, with a from ending"
      "బిచాణా": "bedding and belongings, a traveller's bundle"
      "యెత్తి": "picking up, here packing up"
      "వెయ్యడమే": "doing it; the phrase means packing up and going"
      "బుద్ధికి": "to wisdom; the ki ending means to"
      "లక్షణం": "sign, mark, characteristic"
      "గాని": "but, however"
      "మధురవాణిని": "Madhuravani, the courtesan; the ni ending marks the object"
      "వదలడమంటే": "giving up; the phrase means to give up"
      "యేమీ": "at all"
      "మనస్కరించకుండా": "not willing, not inclined"
      "వున్నది": "is; it is"
  "te-8852":
    native: "Sparkling with cheer, laughing with a ripple of giggles, my lovely one, why will you not speak with me?"
    notes:
      "n1": "The opening lines of Basavaraju Apparao's poem Palukavelane, which asks why a beloved will not speak. The verb kalakalalāḍu means to look bright and lively; the doubled kala and kila are sound words that add to the picture of cheerful laughter. The poem is in his Songs, printed in 1934 as a memorial edition."
    bases:
      "కల": "doubled, part of the word for sparkling (kalakalalāḍu)"
      "లాడుచు": "to look bright and lively (the base is kalakalalāḍu)"
      "కిల": "tinkling sound, from the doubled sound word"
      "నవ్వుచు": "laughing"
      "కలికీ": "my graceful one, a term of address to a woman"
      "పలుక": "to speak; a poetic form in this line"
      "వేలనే": "why? (the nē addresses a girl)"
  "te-8853":
    native: "At sunset one evening, a traveller smeared with ash and dressed in saffron was walking toward the Yamuna river."
    notes:
      "n1": "The first sentence of Chilakamarti Lakshmi Narasimham's novel Hemalatha (1896), from its first chapter as printed on Telugu Wikisource. The printing uses an older, bookish spelling. Forms that differ from today's: శరీరమునందంతట (śarīramunandantaṭa) is శరీరమంతట (śarīramantaṭa); భస్మముఁ (bhasmamu) is భస్మము (bhasmamu), the half-nasal sign dropped; బూసికొని (būsikoni) is పూసుకొని (pūsukoni); కాషాయాంబరములఁ (kāṣāyāmbaramula) is కాషాయాంబరాలు (kāṣāyāmbarālu); యొక (yoka) is ఒక (oka); వచ్చుచుండెను (vaccucuṇḍenu) is వస్తూ (vastū) ఉండెను (uṇḍenu)."
    bases:
      "ఒకనాఁటి": "of one day; here, one evening"
      "సూర్యాస్తమయ": "sunset, as an adjective"
      "సమయమున": "at the time, the mun ending means at"
      "శరీరమునందంతట": "all over the body"
      "భస్మముఁ": "ash, the sacred ash"
      "బూసికొని": "having smeared on oneself"
      "కాషాయాంబరములఁ": "in saffron robes"
      "గట్టుకొనిన": "who had put on, wearing"
      "యొక": "a, one"
      "మార్గస్థుఁడు": "traveller, wayfarer"
      "యమునానది": "the Yamuna river"
      "వైపునకు": "towards"
      "వచ్చుచుండెను": "was walking, was coming"
  "te-8854":
    native: "Ah, what a song this is!"
    notes:
      "n1": "The stage director says this to himself, as an aside marked on the page, after a performer sings in Bobbili Yuddha Natakam, a play by Vedam Venkataraya Sastry."
    bases:
      "ఆహా": "an exclamation of wonder: ah"
      "యేమిపాటరా": "song; with the word for what, an exclamation: what a song"
      "దీనిది": "this one; its, this one's"
  "te-8855":
    native: "If we want fame, we must perform that very one."
    notes:
      "n1": "The stage director says this to a performer who objects to a part in which he is stabbed thirty-three times. The line is from the scenes before Act 1 of Bobbili Yuddha Natakam, by Vedam Venkataraya Sastry."
    bases:
      "మనకు": "we; to us"
      "కీర్తివలయునేని": "fame; with an ending meaning if we want"
      "దానినే": "that very one"
      "ఆడవలయును": "to act, to perform; must act"
  "te-8856":
    native: "Some fool who cannot bear to see others doing well must have said it."
    notes:
      "n1": "Girisam says this in his speech at the opening of Act 1 of Kanyasulkam, the play by Gurajada Apparao. The page marks the speech as his."
    bases:
      "ఓర్వలేని": "unable to bear, envious"
      "వెధవ": "fool, idiot"
      "యెవడైనా": "someone, anyone at all"
      "చెప్పివుంటాడు": "must have said"
  "te-8857":
    native: "Hey, my dear Shakespeare, why have you hung your face?"
    notes:
      "n1": "A line in Act 1 of Kanyasulkam that mixes English words into Telugu speech. The printed page does not show which character says it, so the note does not name the speaker."
    bases:
      "యేమివాయ్": "what; with a friendly address ending"
      "మైడియర్": "my dear, an English term of address written in Telugu script"
      "షేక్స్పియర్": "Shakespeare, used here as a playful name"
      "ముఖం": "face"
      "వేలవేసినావ్": "hung, as in hanging the face: sulking"
  "te-8858":
    native: "The papers he had brought were newspapers."
    notes:
      "n1": "From the second essay of Panuganti Lakshminarasimha Rao's book Sakshi, where a man brings papers into the Sakshi society and they turn out to be newspapers."
    bases:
      "అతను": "he"
      "తెచ్చిన": "brought, which he brought"
      "కాగితాలు": "papers"
      "వార్తా": "news"
      "పత్రికలవి": "newspapers; the ending marks these as"
  "te-8859":
    native: "In this town our dal will not cook, meaning our schemes will not work here."
    notes:
      "n1": "Girisam says this in his speech at the opening of Act 1 of Kanyasulkam. The idiom that our dal will not cook means that a plan will not succeed; the card gives that sense, not a word-for-word reading."
    bases:
      "ఈ": "this"
      "వూళ్ళో": "in the town"
      "మరి": "indeed, then"
      "మన": "our"
      "పప్పు": "dal, lentils; here an idiom"
      "వుడకదు": "will not cook; will not work out"
  "te-8860":
    native: "The people of Andhra University are the reason this novel came into being."
    notes:
      "n1": "From the opening page of Adivi Bapiraju's novel Narayanarao, headed Anjali (an offering). The author thanks the university people and his friends for their help with the book."
    bases:
      "ఈ": "this"
      "నవల": "novel"
      "ఉద్భవించడానికి": "for it to come into being"
      "ఆంధ్ర": "Andhra"
      "విశ్వవిద్యాలయమువారు": "the people of the university"
      "కారకులు": "cause, those responsible"
  "te-8861":
    native: "This time I must win, so that my name Vijayarama is fulfilled."
    notes:
      "n1": "King Vijayarama Raju says this to himself at the start of Bobbili Yuddha Natakam; the page marks it as an aside."
    bases:
      "ఈమాఱు": "this time"
      "నాకు": "to me; for me"
      "విజయము": "victory"
      "కలిగి": "having got; if I get"
      "నావిజయరామ": "Vijayarama, the king's name, with my"
      "నామము": "name"
      "సార్థము": "meaningful; fulfilled"
      "కావలయును": "must; should be"
  "te-8862":
    native: "When you yourselves cannot follow it, will your decree hold good in the world?"
    notes:
      "n1": "A rhetorical question in an essay by Gidugu Venkata Ramamurthy, written against a ban on colloquial writing. It asks whether a ban that its makers cannot follow themselves can hold in the world. The scan splits the word for in the world into two; the card writes it as one word."
    bases:
      "తామే": "they themselves; you yourselves"
      "అనుసరించ": "to follow, to obey"
      "లేనప్పుడు": "when there is not; when unable"
      "తమ": "your, their"
      "శాసనము": "decree, edict"
      "లోకములో": "in the world"
      "చెల్లుతుందా": "holds good; is valid"
  "te-8863":
    native: "A man or a woman must have principles; when told not to touch, you do not listen, do you?"
    notes:
      "n1": "The courtesan Madhuravani says this to Ramappantulu in Act 1 of Kanyasulkam, after he pinches her cheek, as the stage direction on the page shows."
    bases:
      "మొగవాడికయినా": "even a man"
      "ఆడదానికైనా": "even a woman"
      "నీతి": "morals, principle"
      "వుండాలి": "must have"
      "తాక": "touching; to touch"
      "వద్దంటే": "if told no"
      "చెవిని": "ear; to heed"
      "పెట్టరు": "do not put; do not heed"
      "గదా": "isn't it so"
  "te-8864":
    native: "For her, as her right hand, the great feudal lord and commander Gona Ganna Reddy ruled western Andhra, with Vardhamanapuram as his capital."
    notes:
      "n1": "From the introduction to Adivi Bapiraju's novel Gona Gannareddy, headed a history of the novel's period. The queen named in the preceding sentence is Rudramadevi. The printed parenthesis that names the modern town is not on the card."
    bases:
      "ఆమెకు": "to her; for her"
      "దక్షిణహస్తంగా": "as the right hand"
      "మహామాండలికప్రభువు": "great feudal lord"
      "మహాసేనాధిపతి": "great commander"
      "గోనగన్నారెడ్డి": "Gona Ganna Reddy, the name of the chief"
      "వర్ధమానపురం": "Vardhamanapuram, the town"
      "రాజధానిగా": "as the capital"
      "పశ్చిమాంధ్ర": "western Andhra"
      "భూమి": "land"
      "ఏలుతూఉండేవాడు": "was ruling; used to rule"
  "te-8865":
    native: "If you stay sensible and do everything I tell you, I will make you as great as Surendranath Banerjee."
    notes:
      "n1": "Girisam says this to Venkatesam as he leaves, in Act 1 of Kanyasulkam. The page names Surendranath Banerjee as the model of greatness the speaker promises."
    bases:
      "నువ్": "you"
      "బుద్ధిగావుండి": "sensibly; being sensible"
      "చెప్పిన": "that I told"
      "మాటల్లా": "words; all the things said"
      "వింటూంటే": "keep listening; obey"
      "నిన్ను": "you, as object"
      "సురేంద్రనాథ్": "Surendranath, a name"
      "బెనర్జీ": "Banerjee, the surname"
      "అంత": "as great"
      "గొప్పవాణ్ణి": "great; a great one"
      "చేస్తాను": "I will make"
  "te-8866":
    native: "Like the parijata tree, which drives out every fault and showers down what is right, and crushes sin and brings the wished-for fruit, is the fame of Ranga Rao on the stage."
    notes:
      "n1": "A verse from the stage director's speech in the scenes before Act 1 of Bobbili Yuddha Natakam. It praises fame won on the stage and compares it to a tree; the page marks it as a verse."
    bases:
      "తప్పు": "fault, wrong"
      "లెల్ల": "all, every"
      "నడఁచి": "having crushed, driven out"
      "యొప్పులు": "rightness, good"
      "గురియించు": "to shower down"
      "రంగారావుకీర్తి": "the fame of Ranga Rao"
      "రంగమందుఁ": "on the stage"
      "బాప": "sin"
      "మడఁచి": "having crushed"
      "యిష్టఫలము": "wished-for fruit"
      "లానఁగఁ": "to become, to be made; tentative"
      "జేయు": "to make, to bring about"
      "పారిజాత": "the parijata tree"
      "పాదపంబు": "tree"
      "కరణి": "like, in the manner of"
  "te-8867":
    native: "One day Janghala Sastri came rushing to the Sakshi society, panting, a bundle of papers in his hand, not minding the blow from a door that had hit his head."
    notes:
      "n1": "The opening sentence of the second essay in Panuganti Lakshminarasimha Rao's Sakshi. Janghala Sastri and the Sakshi society are named as characters in the essay."
    bases:
      "ఒకనాడు": "one day"
