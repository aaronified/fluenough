schema: 1
id: "te-en-grammar-conjunctions"
kind: "layer"
core: "te-grammar-conjunctions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Joining words"
description: "And, but, or, because: joining words and sentences. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "te-0352":
    native: "and (formal)"
    notes:
      "n1": "In speech, 'and' is often a long -ఊ (-ū) on each word: టీయూ కాఫీయూ (ṭīyū kāfīyū), tea and coffee."
  "te-0353":
    native: "but"
  "te-0354":
    native: "or"
  "te-0355":
    native: "because"
    alt_native: ["since", "as"]
  "te-0356":
    native: "that's why; so"
    alt_native: ["therefore", "hence"]
  "te-0357":
    native: "that (quoting what is said or thought)"
    notes:
      "n1": "Comes after the words quoted: వస్తాను అని చెప్పాడు (vastānu ani ceppāḍu), he said that he would come."
  "te-0358":
    native: "if; then"
    notes:
      "n1": "An 'if' is usually a verb ending: వర్షం పడితే (varṣam paḍitē), if it rains."
  "te-0359":
    native: "also; too; even"
    alt_native: ["as well", "in addition"]
    notes:
      "n1": "నేను కూడా (nēnu kūḍā), me too."

  "te-6515":
    native: "Joining words: and, but, or, because, so, if, also"
    explanation: "The words that join parts of a sentence: mariyu (and, formal), kānī (but), lēdā (or), endukaṇṭē (because), andukē (so), ani (that, when quoting), ayitē (if, then) and kūḍā (also)."
