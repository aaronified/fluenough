schema: 1
id: "te-en-grammar-conjunctions"
kind: "layer"
core: "te-grammar-conjunctions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Joining words"
description: "And, but, or, because: joining words and sentences. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "te-0352":
    native: "and (formal)"
    notes:
      "n1": "In speech, 'and' is often a long -ఊ (-ū) on each word: టీయూ కాఫీయూ (ṭīyū kāfīyū), tea and coffee."
  "te-0353":
    native: "but"
    "examples": {
      "అతని ఉద్దేశం మంచిదే, కానీ పద్ధతి సరికాదు.": {"native": "His intention is good, but his method is not right.", "bases": {}},
      "పట్టణం చిన్నది కానీ చాలా శుభ్రంగా ఉంది.": {"native": "The town is small but very clean.", "bases": {}}
    }
  "te-0354":
    native: "or"
    "examples": {
      "జీపే లేదా యూపీఐ ఉందా?": {"native": "Do you have GPay or UPI?", "bases": {}}
    }
  "te-0355":
    native: "because"
    alt_native: ["since", "as"]
  "te-0356":
    native: "that's why; so"
    alt_native: ["therefore", "hence"]
    "examples": {
      "ఉద్యోగి పనితీరు బాగుంది, అందుకే పదోన్నతి వచ్చింది.": {"native": "The employee's performance was good, so he got a promotion.", "bases": {}}
    }
  "te-0357":
    native: "that (quoting what is said or thought)"
    notes:
      "n1": "Comes after the words quoted: వస్తాను అని చెప్పాడు (vastānu ani ceppāḍu), he said that he would come."
    "examples": {
      "అతను ఇప్పుడు వస్తాడు అని అనుకుంటాడు.": {"native": "He thinks he will come now.", "bases": {}},
      "అన్నీ అసాధ్యం అని ఎందుకు అనుకుంటావు?": {"native": "Why do you think everything is impossible?", "bases": {}}
    }
  "te-0358":
    native: "if; then"
    notes:
      "n1": "An 'if' is usually a verb ending: వర్షం పడితే (varṣam paḍitē), if it rains."
    "examples": {
      "బ్యాండేజ్ తడిగా అయితే మార్చండి.": {"native": "If the bandage gets wet, change it.", "bases": {}}
    }
  "te-0359":
    native: "also; too; even"
    alt_native: ["as well", "in addition"]
    notes:
      "n1": "నేను కూడా (nēnu kūḍā), me too."
    "examples": {
      "ఈ బీమాలో ఆసుపత్రి ఖర్చు కూడా ఉంది.": {"native": "This insurance also covers hospital costs.", "bases": {}},
      "ఈ యాప్ ఆఫ్‌లైన్‌లో కూడా పని చేస్తుంది.": {"native": "This app also works offline.", "bases": {}}
    }

  "te-6515":
    native: "Joining words: and, but, or, because, so, if, also"
    explanation: "The words that join parts of a sentence: mariyu (and, formal), kānī (but), lēdā (or), endukaṇṭē (because), andukē (so), ani (that, when quoting), ayitē (if, then) and kūḍā (also)."
