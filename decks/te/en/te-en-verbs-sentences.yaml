schema: 1
id: "te-en-verbs-sentences"
kind: "layer"
core: "te-verbs-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Everyday verbs: sentences"
description: "Short sentences with the verbs and the words of the first units: what you do, what you eat and drink, where you go. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0652":
    notes:
      "n1": "The form for నేను (nēnu), 'I', ends in -tānu: తాగుతాను (tāgutānu), I drink."
    native: "I drink tea every day."
    alt_native: ["I have tea every day"]
  "te-0653":
    notes:
      "n1": "వెళ్తావు (veḷtāvu) is the form for నువ్వు (nuvvu), 'you'."
    native: "Where do you go?; Where will you go? (to a friend)"
    alt_native: ["Where are you going?"]
  "te-0655":
    notes:
      "n1": "The form for ఆమె (āme), 'she', is మాట్లాడుతుంది (māṭlāḍutundi), she speaks."
    native: "She speaks Telugu."
    bases:
      "తెలుగు": "Telugu (the language)"
  "te-0656":
    native: "We will come tomorrow."
    alt_native: ["We are coming tomorrow"]
    notes:
      "n1": "{1} changes its stem in the present and future: {2}."
  "te-0657":
    notes:
      "n1": "తింటారు (tiṇṭāru) is the polite form for మీరు (mīru), 'you', and also the plural 'they'."
    native: "What will you eat? (respectful)"
    alt_native: ["What would you like to eat?"]
  "te-0659":
    notes:
      "n1": "కూర్చోండి (kūrcōṇḍi) is the polite command, 'please sit', said to a person you address politely, or to several people."
    native: "Please sit down."
    alt_native: ["Please take a seat"]
  "te-0660":
    notes:
      "n1": "కూర్చోండి (kūrcōṇḍi) is the polite request form of కూర్చోవడం (kūrcōvaḍaṁ), to sit."
    native: "Please sit here."
    alt_native: ["Please take a seat here"]
  "te-0661":
    notes:
      "n1": "The postposition తో (tō) means 'with', so నాతో (nātō) is 'with me'."
    native: "Come with me."
    alt_native: ["Come along with me"]
  "te-0662":
    notes:
      "n1": "పాలు (pālu), milk, is left plain as the thing acted on, since the course leaves the ending off a thing that is not singled out and Telugu has no word for 'the'; తాగండి (tāgaṇḍi) is the polite request form of తాగడం (tāgaḍaṁ), to drink."
    native: "Please drink the milk."
    alt_native: ["Please have the milk"]
  "te-0663":
    notes:
      "n1": "మనం (manaṁ) is 'we' including the listener; మేము (mēmu) leaves the listener out. కలుస్తాం (kalustāṁ) has the short 'we' ending -āṁ."
    native: "We will meet tomorrow. (you and I)"
    alt_native: ["We are meeting tomorrow"]
