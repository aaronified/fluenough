schema: 1
id: "te-en-phrasebook"
kind: "layer"
core: "te-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty phrases to say whole from the first day, before their words are taught: good morning and good night, sorry and never mind, nice to meet you, and how to ask for English. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0573":
    native: "Good morning!"
    alt_native: ["Morning!"]
    notes:
      "n1": "Many people say {1}, the English words, or simply greet with {2}."
    bases:
      "శుభోదయం": "good morning"
  "te-0574":
    native: "Good night!"
    bases:
      "శుభ": "good; auspicious"
  "te-0575":
    native: "Welcome!"
    bases:
      "స్వాగతం": "welcome"
  "te-0576":
    native: "I'm sorry; excuse me."
    alt_native: ["Sorry", "Pardon me"]
    notes:
      "n1": "The ending -ండి (-aṇḍi) makes a polite request: 'please forgive me'."
    bases:
      "క్షమించండి": "to forgive; to excuse"
  "te-0577":
    native: "It doesn't matter; never mind."
    alt_native: ["Forget it"]
    notes:
      "n1": "Also said {1}."
    bases:
      "పర్వాలేదు": "it does not matter"
  "te-0578":
    native: "All right; will do."
    alt_native: ["Alright, I will do it"]
    bases:
      "అలాగే": "all right; in that way, then"
  "te-0579":
    native: "Certainly; of course."
    alt_native: ["Sure", "Definitely"]
    bases:
      "తప్పకుండా": "certainly; without fail"
  "te-0580":
    native: "Thank you! (casual)"
    alt_native: ["Thanks", "Cheers"]
    notes:
      "n1": "A casual, English 'thank you'. The formal word is {1}."
    bases:
      "థాంక్యూ": "thank you, from English"
  "te-0581":
    native: "Nice to meet you."
    alt_native: ["Pleased to meet you", "Good to meet you"]
  "te-0582":
    native: "See you again; let's meet again."
    alt_native: ["Until we meet again"]
  "te-0583":
    native: "Take care! Careful!"
    alt_native: ["Be careful"]
    bases:
      "జాగ్రత్త": "care; caution"
  "te-0584":
    native: "Congratulations!"
    alt_native: ["Congrats"]
    bases:
      "అభినందనలు": "congratulation"
  "te-0585":
    native: "Happy birthday!"
    bases:
      "పుట్టినరోజు": "birthday"
      "శుభాకాంక్షలు": "good wish; greeting"
  "te-0586":
    native: "I don't know."
    alt_native: ["I have no idea"]
    notes:
      "n1": "The word for 'know', {1}, has this negative form of its own."
  "te-0587":
    native: "I understand."
    alt_native: ["I get it", "Got it"]
    bases:
      "అర్థమైంది": "meaning; understanding"
  "te-0588":
    native: "Just a minute."
    alt_native: ["One moment", "Wait a minute"]
    bases:
      "నిమిషం": "minute"
  "te-0589":
    native: "Do you speak English?"
    notes:
      "n1": "Telugu says a language 'comes' to you: {1}, to come, is the verb for knowing a language."
      "n2": "{1} changes its stem in the present and future: {2}."
    bases:
      "ఇంగ్లీషు": "English"
  "te-0590":
    native: "Please say it in English."
    alt_native: ["Please say that in English"]
    bases:
      "ఇంగ్లీషులో": "English"
  "te-0591":
    native: "Great! Wow!"
    bases:
      "భలే": "great; wow"
  "te-0592":
    native: "You too!"
    alt_native: ["Same to you", "You as well"]
