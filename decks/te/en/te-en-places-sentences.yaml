id: "te-en-places-sentences"
kind: "layer"
core: "te-places-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Places: sentences"
description: "Sentences about where things are in town and country, with the words of the places unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0809":
    native: "There is a park next to the bank."
    notes:
      "n1": "పక్కన (pakkana), next to, comes after its place: బ్యాంకు (byāṅku) పక్కన (byāṅku pakkana)."
  "te-0810":
    notes:
      "n1": "మా (mā) is the genitive of మేము (mēmu), we, meaning 'our', and comes before ఊరు (ūru), town."
    native: "Our town is beside a river."
  "te-0811":
    native: "Where is the school?"
    notes:
      "n1": "The question word ఎక్కడ (ekkaḍa), where, comes after the subject, not at the start."
  "te-0812":
    native: "The hospital is near the bus stand."
    notes:
      "n1": "దగ్గర (daggara), near, follows the place: బస్టాండ్ (basṭāṇḍ) దగ్గర (basṭāṇḍ daggara)."
  "te-0813":
    notes:
      "n1": "గుడికి (guḍiki) is గుడి (guḍi), temple, with the -ki ending that means 'to' a place."
    native: "We will go to the temple tomorrow."
  "te-0814":
    native: "He works in a bank every day."
    notes:
      "n1": "{1} changes its stem in the present and future: {2}."
  "te-0815":
    native: "There is a river under the bridge."
    notes:
      "n1": "కింద (kinda), under, follows the thing: వంతెన (vantena) కింద (vantena kinda)."
  "te-0816":
    notes:
      "n1": "పొలంలో (polaṁlō) is పొలం (polaṁ), field, with the locative ending -lō meaning 'in'."
    native: "I am in the field."
  "te-0817":
    notes:
      "n1": "మైదానంలో (maidānaṁlō) is మైదానం (maidānaṁ), ground, with the locative ending -lō meaning 'on' or 'in'."
    native: "The children play on the ground."
  "te-0818":
    notes:
      "n1": "నగరానికి (nagarāniki), the city with the oblique -āni- and -ki, goes before దూరంగా (dūraṅgā), far, for 'far from'."
    native: "The airport is far from the city."
  "te-0819":
    notes:
      "n1": "ఆగండి (āgaṇḍi) is the polite form of the command 'stop', said to a person you address politely, or to several people."
    native: "Please stop near the junction."
  "te-0820":
    notes:
      "n1": "పెద్ద (pedda) is the form of the adjective 'big' that comes before a noun, as in పెద్ద (pedda) నగరం (nagaraṁ)."
    native: "The capital is a big city."
