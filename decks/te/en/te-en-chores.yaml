  "name": "English"
"name": "Chores"
"description": "Everyday housework: sweeping, washing clothes and dishes, cooking, tidying up and putting things away, with the words for the things you use. Not yet checked by a Telugu speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "te-2100":
    "native": "to sweep"
    "examples":
      "నేను రోజూ ఇల్లు ఊడుస్తాను.":
        "native": "I sweep the house every day."
        "bases":
          "ఊడుస్తాను":
            "meaning": "to sweep"
      "నేల ఊడ్చండి.":
        "native": "Sweep the floor."
        "bases":
          "ఊడ్చండి":
            "meaning": "to sweep"
    "notes":
      "n1": "In the present the stem changes from ఊడ్చు (ūḍcu): {1}. To tell someone to sweep: {2}."
      "n2": "Sweeping the floor: {1}."
  "te-2101":
    "native": "to wash (clothes)"
    "examples":
      "నేను బట్టలు ఉతుకుతాను.":
        "native": "I wash the clothes."
        "bases":
          "ఉతుకుతాను":
            "meaning": "to wash (clothes)"
      "బట్టలు ఉతకండి.":
        "native": "Wash the clothes."
        "bases":
          "ఉతకండి":
            "meaning": "to wash (clothes)"
    "notes":
      "n1": "In the present the stem changes from ఉతుకు (utuku): {1}. To tell someone to wash: {2}."
      "n2": "Washing clothes: {1}."
  "te-2102":
    "native": "to hang out to dry"
    "examples":
      "నేను బట్టలు ఆరేస్తాను.":
        "native": "I hang the clothes out to dry."
        "bases":
          "ఆరేస్తాను":
            "meaning": "to hang out to dry"
      "బట్టలు ఆరేయండి.":
        "native": "Hang the clothes out to dry."
        "bases":
          "ఆరేయండి":
            "meaning": "to hang out to dry"
    "notes":
      "n1": "In the present the stem changes: {1}. To tell someone to do it: {2}."
      "n2": "Hanging out clothes to dry: {1}."
  "te-2103":
    "native": "to iron"
    "examples":
      "అమ్మ బట్టలు ఇస్త్రీ చేస్తుంది.":
        "native": "Mum irons the clothes."
        "bases":
          "చేస్తుంది":
            "meaning": "to do"
      "చొక్కా ఇస్త్రీ చేయండి.":
        "native": "Iron the shirt."
        "bases":
          "చేయండి":
            "meaning": "to do"
    "notes":
      "n1": "The verb is ఇస్త్రీ (istrī, iron) with చేయడం (cēyaḍam, to do): {1}. To tell someone to do it: {2}."
      "n2": "The noun: {1}."
  "te-2104":
    "native": "to chop"
    "examples":
      "అమ్మ కూరగాయలు తరుగుతుంది.":
        "native": "Mum chops the vegetables."
        "bases":
          "తరుగుతుంది":
            "meaning": "to chop"
      "ఉల్లిపాయ తరగండి.":
        "native": "Chop the onion."
        "bases":
          "తరగండి":
            "meaning": "to chop"
    "notes":
      "n1": "In the present the stem changes: {1}. To tell someone to chop: {2}."
      "n2": "Chopping vegetables: {1}."
  "te-2105":
    "native": "to cook (by boiling)"
    "examples":
      "నేను అన్నం ఉడికిస్తాను.":
        "native": "I cook the rice."
        "bases":
          "ఉడికిస్తాను":
            "meaning": "to cook (by boiling)"
      "పప్పు ఉడికించండి.":
        "native": "Cook the lentils."
        "bases":
          "ఉడికించండి":
            "meaning": "to cook (by boiling)"
    "notes":
      "n1": "In the present the stem changes: {1}. To tell someone to cook: {2}."
      "n2": "Cooking rice: {1}."
  "te-2106":
    "native": "to tidy up; to arrange"
    "examples":
      "నేను గది సర్దుతాను.":
        "native": "I tidy up the room."
        "bases":
          "సర్దుతాను":
            "meaning": "to tidy up; to arrange"
      "బట్టలు సర్దండి.":
        "native": "Tidy up the clothes."
        "bases":
          "సర్దండి":
            "meaning": "to tidy up; to arrange"
    "notes":
      "n1": "{1} is the present; {2} tells someone to do it."
      "n2": "Tidying a room: {1}."
  "te-2107":
    "native": "to throw away"
    "examples":
      "నేను చెత్త పారేస్తాను.":
        "native": "I throw the rubbish away."
        "bases":
          "పారేస్తాను":
            "meaning": "to throw away"
      "ఈ చెత్త పారేయండి.":
        "native": "Throw this rubbish away."
        "bases":
          "పారేయండి":
            "meaning": "to throw away"
    "notes":
      "n1": "In the present the stem changes: {1}. To tell someone to do it: {2}."
      "n2": "Throwing rubbish away: {1}."
  "te-2108":
    "native": "to lift"
    "examples":
      "నేను బకెట్ ఎత్తుతాను.":
        "native": "I lift the bucket."
        "bases":
          "ఎత్తుతాను":
            "meaning": "to lift"
      "ఆ బుట్ట ఎత్తండి.":
        "native": "Lift that basket."
        "bases":
          "ఎత్తండి":
            "meaning": "to lift"
    "notes":
      "n1": "{1} is the present; {2} tells someone to lift."
  "te-2110":
    "native": "basket"
    "examples":
      "బుట్టలో కూరగాయలు ఉన్నాయి.":
        "native": "There are vegetables in the basket."
        "bases":
          "ఉన్నాయి":
            "meaning": "to be; to have"
          "బుట్టలో":
            "meaning": "basket"
      "ఈ బుట్ట పెద్దది.":
        "native": "This basket is big."
    "notes":
      "n1": "The plural and the place form: {1}."
    wiktionary: true
  "te-2111":
    "native": "dustbin; rubbish bin"
    "examples":
      "చెత్తబుట్టలో చెత్త ఉంది.":
        "native": "There is rubbish in the dustbin."
        "bases":
          "ఉంది":
            "meaning": "to be; to have"
          "చెత్తబుట్టలో":
            "meaning": "dustbin"
      "చెత్తబుట్ట నిండింది.":
        "native": "The dustbin is full."
        "bases":
          "నిండింది":
            "meaning": "to be full"
    "notes":
      "n1": "The plural and the place form: {1}."
  "te-2112":
    "native": "wall"
    "examples":
      "గోడ తుడవండి.":
        "native": "Wipe the wall."
        "bases":
          "తుడవండి":
            "meaning": "to wipe"
      "గోడ మీద బొమ్మ ఉంది.":
        "native": "There is a picture on the wall."
        "bases":
          "ఉంది":
            "meaning": "to be; to have"
    "notes":
      "n1": "The plural: {1}."
    synonyms: { "kudyamu": "wall" }
    wiktionary: true
  "te-2115":
    "native": "jug; lota; small brass pot"
    "examples":
      "చెంబు నా చేతిలో ఉంది.":
        "native": "The jug is in my hand."
        "bases":
          "ఉంది":
            "meaning": "to be; to have"
      "చెంబు కడగండి.":
        "native": "Wash the jug."
        "bases":
          "కడగండి":
            "meaning": "to wash"
    "notes":
      "n1": "The plural and the place form: {1}."
    senses:
      "cup": { native: "a cup, jug, ewer, goblet, tankard" }
    wiktionary: true
  "te-2117":
    "native": "housework"
    "examples":
      "నేను ఇంటి పని చేస్తాను.":
        "native": "I do the housework."
        "bases":
          "చేస్తాను":
            "meaning": "to do"
      "ఇంటి పనులు అందరూ చేయాలి.":
        "native": "Everyone should do the housework."
        "bases":
          "చేయాలి":
            "meaning": "to do"
    "notes":
      "n1": "The plural: {1}."
  "te-2118":
    "native": "detergent; washing powder"
    "examples":
      "బట్టలు ఉతకడానికి డిటర్జెంట్ కావాలి.":
        "native": "I need detergent to wash clothes."
      "ఈ డిటర్జెంట్ చాలా నురుగు ఇస్తుంది.":
        "native": "This detergent makes a lot of foam."
        "bases":
          "నురుగు": { "meaning": "foam" }
    "notes":
      "n1": "Used for washing clothes or dishes: {1}."
  "te-2119":
    "native": "dust"
    "examples":
      "ఇల్లంతా దుమ్ముగా ఉంది.":
        "native": "The whole house is dusty."
        "bases":
          "దుమ్ముగా": { "meaning": "dust" }
      "దుమ్ము తుడిచి ఫ్యాన్ కూడా శుభ్రం చెయ్యి.":
        "native": "Wipe off the dust and clean the fan too."
    "notes":
      "n1": "Dust that settles on things: {1}."
    synonyms: { "dhuli": "dust (a more formal word)" }
    wiktionary: true
