schema: 1
id: "te-en-verbs-3"
kind: "layer"
core: "te-verbs-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More daily actions"
description: "Sixty-one more verbs for a busy day: getting up and getting ready, going out, work, study, sending and using things, and feelings. Each has its form for 'I' and its polite request. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-2300":
    native: "to wash oneself"
    examples:
      "నేను ఉదయం కడుక్కుంటాను.":
        native: "I wash myself in the morning."
        bases:
          "కడుక్కుంటాను":
            meaning: "to wash oneself"
      "అతను ఇప్పుడు కడుక్కుంటాడు.":
        native: "He is washing himself now."
        bases:
          "కడుక్కుంటాడు":
            meaning: "to wash oneself"
    notes:
      "n1": "'I wash oneself' and 'I will wash oneself' are one form, {1}. The polite request is {2}."
