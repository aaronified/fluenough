schema: 1
id: "te-en-home-sentences"
kind: "layer"
core: "te-home-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Home: sentences"
description: "Ten sentences about the rooms and furniture of a home, with the words of the home unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-7130":
    notes:
      "n1": "గదిలో (gadilō), in the room, is the 'in' form of గది (gadi), room, the same pattern as the grammar deck's example."
    native: "I read in the room."
    confusables:
      "c1": { why: "వంటిల్లు (vaṇṭillu) 'kitchen', is where food is cooked, not where one reads." }
      "c2": { why: "పడకగది (paḍakagadi) 'bedroom', is where one sleeps." }
  "te-7131":
    notes:
      "n1": "పడకగదిలో (paḍakagadilō), in the bedroom, takes the 'in' form on the whole compound, as గదిలో (gadilō) does, and ఉంది (undi) says there is."
    native: "There is a bed in the bedroom."
    confusables:
      "c1": { why: "కుర్చీ (kurcī) 'chair', is for sitting, not for sleeping." }
      "c2": { why: "బల్ల (balla) 'table', is for putting things on." }
  "te-7132":
    notes:
      "n1": "ఎక్కడ (ekkaḍa), where, comes after the noun it asks about, as in వంటిల్లు (vaṇṭillu) ఎక్కడ (ekkaḍa)."
    native: "Where is the kitchen?"
    confusables:
      "c1": { why: "ఎప్పుడు (eppuḍu) 'when', asks for a time, not a place." }
      "c2": { why: "ఎందుకు (enduku) 'why', asks for a reason." }
  "te-7133":
    notes:
      "n1": "వేయండి (vēyaṇḍi) is the polite request form of వేయడం (vēyaḍaṁ), to put on, and ఇంట్లో (iṇṭlō), in the house, takes its 'in' form from the stem ఇంటి (iṇṭi) of ఇల్లు (illu)."
    native: "Please put on the light in this house."
    confusables:
      "c1": { why: "ఫ్యాన్ (phyān) 'fan', is a different appliance." }
      "c2": { why: "కిటికీ (kiṭikī) 'window', lets light in but is not a light." }
  "te-7134":
    notes:
      "n1": "మీద (mīda), on, comes after its noun, as in మంచం (mañcaṁ) మీద (mīda)."
    native: "I sleep on the bed."
    confusables:
      "c1": { why: "బల్ల (balla) 'table', is not for sleeping." }
      "c2": { why: "కుర్చీ (kurcī) 'chair', is not for sleeping." }
  "te-7135":
    notes:
      "n1": "తెరుస్తావా (terustāvā) is the 'you' question form for a friend or a child, of తెరవడం (teravaḍaṁ), to open."
    native: "Will you open the door?"
    confusables:
      "c1": { why: "కిటికీ (kiṭikī) 'window', is not a door." }
      "c2": { why: "మెట్లు (meṭlu) 'stairs', are not a door." }
  "te-7136":
    notes:
      "n1": "తెరుస్తాను (terustānu) is the 'I' form of తెరవడం (teravaḍaṁ), to open, and it does not keep the infinitive's stem unchanged."
    native: "I will open the window."
    confusables:
      "c1": { why: "తలుపు (talupu) 'door', is not a window." }
      "c2": { why: "ఫ్యాన్ (phyān) 'fan', is not a window." }
  "te-7137":
    notes:
      "n1": "దగ్గర (daggara), near, comes after the noun, as in బల్ల (balla) దగ్గర (daggara)."
    native: "Does he sit by the table?"
    confusables:
      "c1": { why: "కుర్చీ (kurcī) 'chair', is for one person to sit on, not the table." }
      "c2": { why: "మంచం (mañcaṁ) 'bed', is for sleeping." }
  "te-7138":
    notes:
      "n1": "తీసుకుంటుంది (tīsukuṇṭundi) is the 'she or it' form of తీసుకోవడం (tīsukōvaḍaṁ), to take, as the card's subject అమ్మ (amma), Mum, takes it; it does not keep the infinitive's form."
    native: "Mum takes a chair."
    confusables:
      "c1": { why: "బల్ల (balla) 'table', is not a chair." }
      "c2": { why: "మంచం (mañcaṁ) 'bed', is not a chair." }
  "te-7139":
    notes:
      "n1": "మెట్లు (meṭlu), stairs, is left plain as the thing acted on, as the grammar deck leaves the ending off a thing that is not singled out; ఎక్కుతాను (ekkutānu) is the 'I' form of ఎక్కడం (ekkaḍaṁ), to climb."
    native: "I climb the stairs."
    confusables:
      "c1": { why: "అంతస్తు (antastu) 'floor; storey', is a level, not the steps." }
      "c2": { why: "తలుపు (talupu) 'door', is not a set of steps." }
