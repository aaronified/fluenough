schema: 1
id: "te-en-home-sentences"
kind: "layer"
core: "te-home-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Home: sentences"
description: "Ten sentences about the rooms and furniture of a home, with the words of the home unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-7130":
    native: "I read in the room."
    confusables:
      "c1": { why: "వంటిల్లు (vaṇṭillu) 'kitchen', is where food is cooked, not where one reads." }
      "c2": { why: "పడకగది (paḍakagadi) 'bedroom', is where one sleeps." }
  "te-7131":
    native: "There is a bed in the bedroom."
    confusables:
      "c1": { why: "కుర్చీ (kurcī) 'chair', is for sitting, not for sleeping." }
      "c2": { why: "బల్ల (balla) 'table', is for putting things on." }
  "te-7132":
    native: "Where is the kitchen?"
    confusables:
      "c1": { why: "ఎప్పుడు (eppuḍu) 'when', asks for a time, not a place." }
      "c2": { why: "ఎందుకు (enduku) 'why', asks for a reason." }
  "te-7133":
    native: "There is a light in this house."
    confusables:
      "c1": { why: "ఫ్యాన్ (fyān) 'fan', is a different appliance." }
      "c2": { why: "కిటికీ (kiṭikī) 'window', lets light in but is not a light." }
  "te-7134":
    native: "I sleep on the bed."
    confusables:
      "c1": { why: "బల్ల (balla) 'table', is not for sleeping." }
      "c2": { why: "కుర్చీ (kurcī) 'chair', is not for sleeping." }
  "te-7135":
    native: "Will you open the door?"
    confusables:
      "c1": { why: "కిటికీ (kiṭikī) 'window', is not a door." }
      "c2": { why: "మెట్లు (meṭlu) 'stairs', are not a door." }
  "te-7136":
    native: "Please close the window."
    confusables:
      "c1": { why: "తలుపు (talupu) 'door', is not a window." }
      "c2": { why: "ఫ్యాన్ (fyān) 'fan', is not a window." }
  "te-7137":
    native: "Does he sit by the table?"
    confusables:
      "c1": { why: "కుర్చీ (kurcī) 'chair', is for one person to sit on, not the table." }
      "c2": { why: "మంచం (mañcaṁ) 'bed', is for sleeping." }
  "te-7138":
    native: "Mum will take a chair."
    confusables:
      "c1": { why: "బల్ల (balla) 'table', is not a chair." }
      "c2": { why: "మంచం (mañcaṁ) 'bed', is not a chair." }
  "te-7139":
    native: "I climb the stairs."
    confusables:
      "c1": { why: "అంతస్తు (antastu) 'floor; storey', is a level, not the steps." }
      "c2": { why: "తలుపు (talupu) 'door', is not a set of steps." }
