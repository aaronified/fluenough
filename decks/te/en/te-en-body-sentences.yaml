schema: 1
id: "te-en-body-sentences"
kind: "layer"
core: "te-body-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The body: sentences"
description: "Sentences about the body and where it hurts, with the words of the body unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0755":
    notes:
      "n1": "నాకు (nāku) is the dative of నేను (nēnu), I, so the sentence says the pain is to me."
    native: "I have a headache."
    alt_native: ["My head hurts."]
  "te-0756":
    notes:
      "n1": "నాకు (nāku) is the dative of నేను (nēnu), I, used for 'to me' with a pain or a feeling."
    native: "I have a stomach ache."
    alt_native: ["My stomach hurts.", "I have a stomachache."]
  "te-0757":
    notes:
      "n1": "నా (nā) is the genitive of నేను (nēnu), I, and comes before the noun కాలు (kālu), leg, to mean 'my'."
    native: "My leg hurts."
    alt_native: ["My leg aches."]
  "te-0758":
    notes:
      "n1": "కడగండి (kaḍagaṇḍi) is the polite form of the command 'wash', said to a person you address politely, or to several people, as in మూయండి (mūyaṇḍi) and తెరవండి (teravaṇḍi)."
    native: "Please wash your hands."
    alt_native: ["Wash your hands, please."]
  "te-0759":
    notes:
      "n1": "మూయండి (mūyaṇḍi) is the polite form of the command 'close', said to a person you address politely, or to several people, as in కడగండి (kaḍagaṇḍi)."
    native: "Please close your eyes."
    alt_native: ["Close your eyes, please."]
  "te-0760":
    notes:
      "n1": "తెరవండి (teravaṇḍi) is the polite form of the command 'open', said to a person you address politely, or to several people, as in మూయండి (mūyaṇḍi)."
    native: "Please open your mouth."
    alt_native: ["Open your mouth, please."]
  "te-0761":
    notes:
      "n1": "పొడవుగా (poḍavugā), long, is the adjective పొడవు (poḍavu), length, made into a word for how something is, with the same adverb pattern as సమానంగా (samānaṅgā), equally, in the comparison unit."
    native: "Her hair is long."
    alt_native: ["She has long hair."]
    bases:
      "పొడవుగా": "length; long"
  "te-0762":
    notes:
      "n1": "The first-person present-future ending -ānu is here on తోముకుంటాను (tōmukuṇṭānu), I brush, as in తాగుతాను (tāgutānu), I drink."
    native: "I brush my teeth."
    alt_native: ["I clean my teeth."]
    bases:
      "తోముకుంటాను": "to scrub; to brush (oneself)"
  "te-0763":
    notes:
      "n1": "అతని (atani) is the genitive of అతను (atanu), he, and comes before గొంతు (gontu), voice, to mean 'his'."
    native: "His voice is good."
    alt_native: ["He has a good voice."]
    bases:
      "బాగుంది": "good; well"
