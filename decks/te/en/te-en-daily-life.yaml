cards:
  "te-0441":
    native: "to get up"
    alt_native: ["to rise"]
    notes:
      "n1": "పొద్దున లేవడం (podduna lēvaḍam), to get up in the morning."
  "te-0442":
    native: "to bathe; to have a shower"
    alt_native: ["to take a bath", "to shower"]
    bases:
      "స్నానం": "bath"
  "te-0443":
    native: "to brush one's teeth"
    alt_native: ["to clean one's teeth"]
    bases:
      "తోముకోవడం": "to scrub; to brush (oneself)"
  "te-0444":
    native: "breakfast; a light meal"
    notes:
      "n1": "Many homes call breakfast టిఫిన్ (ṭifin): idli, dosa or upma."
  "te-0445":
    native: "lunch"
    bases:
      "మధ్యాహ్న": "midday; afternoon"
  "te-0446":
    native: "dinner"
    alt_native: ["supper"]
  "te-0447":
    native: "to go to work"
    alt_native: ["to head to work"]
  "te-0448":
    native: "to come home"
    alt_native: ["to return home"]
  "te-0449":
    native: "to cook"
    alt_native: ["to prepare food"]
    bases:
      "వంట": "cooking; a cooked dish"
  "te-0450":
    native: "to go to bed; to lie down"
    alt_native: ["to retire for the night"]
    notes:
      "n1": "To sleep is నిద్రపోవడం (nidrapōvaḍam)."
  "te-0451":
    native: "every day"
    alt_native: ["daily"]
  "te-0452":
    native: "sometimes"
    alt_native: ["now and then", "at times"]
  "te-0453":
    native: "always"
    alt_native: ["all the time"]
    notes:
      "n1": "With a negative verb it means never: నేను ఎప్పుడూ ఆలస్యంగా రాను (nēnu eppuḍū ālasyaṅgā rānu), I'm never late."
  "te-0454":
    native: "usually"
    alt_native: ["normally"]
  "te-0455":
    native: "after that; then"
    alt_native: ["afterwards"]
    notes:
      "n1": "After a noun it means after: భోజనం తర్వాత (bhōjanam tarvāta), after the meal."
  "te-0456":
    native: "I get up at seven every day."
    alt_native: ["I rise at seven every day."]
  "te-0457":
    native: "Then I go to work."
    alt_native: ["After that I go to work."]
  "te-0458":
    native: "I go to bed at eleven at night."
  "te-0459":
    native: "I'm never late."
    alt_native: ["I am never tardy."]
    notes:
      "n1": "'Never' is ఎప్పుడూ (eppuḍū) with a negative verb: 'I always don't come late'."
    bases:
      "ఆలస్యంగా": "delay; lateness"
