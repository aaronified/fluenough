schema: 1
id: "te-en-daily-life"
kind: "layer"
core: "te-daily-life"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "A day"
description: "The day from waking to sleeping, and how often things happen. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0441":
    native: "to get up"
    alt_native: ["to rise"]
    notes:
      "n1": "పొద్దున లేవడం (podduna lēvaḍaṁ), to get up in the morning."
  "te-0442":
    notes:
      "n1": "చేయడం (cēyaḍaṁ), doing, is the verb with the ending -ḍaṁ, as in స్నానం (snānaṁ) చేయడం (cēyaḍaṁ), to bathe."
    native: "to bathe; to have a shower"
    alt_native: ["to take a bath", "to shower"]
    bases:
      "స్నానం": "bath"
  "te-0443":
    notes:
      "n1": "తోముకోవడం (tōmukōvaḍaṁ), brushing, is the verb with the ending -ḍaṁ, meaning 'to brush'."
    native: "to brush one's teeth"
    alt_native: ["to clean one's teeth"]
    bases:
      "తోముకోవడం": "to scrub; to brush (oneself)"
  "te-0444":
    native: "breakfast; a light meal"
    notes:
      "n1": "Many homes call breakfast టిఫిన్ (ṭiphin): idli, dosa or upma."
  "te-0445":
    notes:
      "n1": "Here మధ్యాహ్న (madhyāhna), midday, comes before భోజనం (bhōjanaṁ), meal, and the pair means lunch."
    native: "lunch"
    bases:
      "మధ్యాహ్న": "midday; afternoon"
  "te-0446":
    notes:
      "n1": "రాత్రి (rātri), night, comes before భోజనం (bhōjanaṁ), meal, and the pair means dinner."
    native: "dinner"
    alt_native: ["supper"]
  "te-0447":
    notes:
      "n1": "వెళ్ళడం (veḷḷaḍaṁ), going, is the verb with the ending -ḍaṁ, meaning 'to go'."
    native: "to go to work"
    alt_native: ["to head to work"]
  "te-0448":
    notes:
      "n1": "రావడం (rāvaḍaṁ), coming, is the verb with the ending -ḍaṁ, meaning 'to come'."
    native: "to come home"
    alt_native: ["to return home"]
  "te-0449":
    notes:
      "n1": "చేయడం (cēyaḍaṁ), doing, is the verb with the ending -ḍaṁ, as in వంట (vaṇṭa) చేయడం (cēyaḍaṁ), to cook."
    native: "to cook"
    alt_native: ["to prepare food"]
    bases:
      "వంట": "cooking; a cooked dish"
  "te-0450":
    native: "to go to bed; to lie down"
    alt_native: ["to retire for the night"]
    notes:
      "n1": "To sleep is నిద్రపోవడం (nidrapōvaḍaṁ)."
  "te-0451":
    notes:
      "n1": "రోజూ (rōjū), every day, goes before the object, as in ఆమె (āme) రోజూ (rōjū) పెరుగు (perugu) తింటుంది (tiṇṭundi), she eats curd every day."
    native: "every day"
    alt_native: ["daily"]
    "examples": {
      "ఆమె రోజూ పుస్తకాలు చదువుతుంది.": {"native": "She reads books every day.", "bases": {}},
      "ఆమె రోజూ పెరుగు తింటుంది.": {"native": "She eats curd every day.", "bases": {}}
    }
  "te-0452":
    native: "sometimes"
    alt_native: ["now and then", "at times"]
  "te-0453":
    native: "always"
    alt_native: ["all the time"]
    notes:
      "n1": "With a negative verb it means never: నేను ఎప్పుడూ ఆలస్యంగా రాను (nēnu eppuḍū ālasyaṅgā rānu), I'm never late."
    "examples": {
      "నేను ఎప్పుడూ జాగ్రత్తపడతాను.": {"native": "I always take care.", "bases": {}},
      "నేను ఎప్పుడూ భయపడతాను.": {"native": "I am always scared.", "bases": {}}
    }
  "te-0454":
    native: "usually"
    alt_native: ["normally"]
  "te-0455":
    native: "after that; then"
    alt_native: ["afterwards"]
    notes:
      "n1": "After a noun it means after: భోజనం తర్వాత (bhōjanaṁ tarvāta), after the meal."
    "examples": {
      "భోజనం తర్వాత": {"native": "after the meal", "bases": {}},
      "తర్వాత నేను పనికి వెళ్తాను.": {"native": "Then I go to work.", "bases": {}}
    }
  "te-0456":
    notes:
      "n1": "గంటలకు (gaṇṭalaku) is the plural గంటలు (gaṇṭalu), hours, with the ending -ku, meaning 'at' a time."
    native: "I get up at seven every day."
    alt_native: ["I rise at seven every day."]
  "te-0457":
    notes:
      "n1": "Here తర్వాత (tarvāta), then, begins the sentence, where the course's after the meal puts it after its noun."
    native: "Then I go to work."
    alt_native: ["After that I go to work."]
  "te-0458":
    notes:
      "n1": "గంటలకు (gaṇṭalaku) is the plural గంటలు (gaṇṭalu), hours, with the ending -ku, meaning 'at' a time."
    native: "I go to bed at eleven at night."
  "te-0459":
    native: "I'm never late."
    alt_native: ["I am never tardy."]
    notes:
      "n1": "'Never' is ఎప్పుడూ (eppuḍū) with a negative verb: 'I always don't come late'."
    bases:
      "ఆలస్యంగా": "delay; lateness"
