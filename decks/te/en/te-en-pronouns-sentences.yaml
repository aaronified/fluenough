core: "te-pronouns-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Pronouns: sentences"
description: "Short sentences with the pronouns and the words of the first units: who is who, whose it is. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0612":
    notes:
      "n1": "Before a noun, 'my' is నా (nā) and 'our' is మా (mā), the possessive forms of నేను (nēnu) and మేము (mēmu)."
    native: "He is my father."
  "te-0613":
    native: "She is my elder sister."
    notes:
      "n1": "నా (nā), my, is the genitive of నేను (nēnu), I, and it comes before the noun it owns."
    alt_native: ["She is my older sister"]
  "te-0615":
    native: "He is my younger brother."
    notes:
      "n1": "తమ్ముడు (tammuḍu), younger brother, has its own word; the elder brother is అన్న (anna)."
    alt_native: ["He is my little brother"]
  "te-0616":
    native: "These are our children."
    notes:
      "n1": "మా (mā), our, is the genitive of మేము (mēmu), we, and comes before the noun."
  "te-0617":
    notes:
      "n1": "Before a noun, 'your' is నీ (nī), the possessive of నువ్వు (nuvvu)."
    native: "What is your name? (to a friend)"
  "te-0618":
    notes:
      "n1": "ఎవరి (evari), whose, is the possessive of ఎవరు (evaru), who."
    native: "Whose house is that?"
  "te-0620":
    notes:
      "n1": "మీరు (mīru) is also the polite 'you', used when speaking formally to one person."
    native: "Who are you?"
