"schema": 1
"id": "te-en-workplace"
"kind": "layer"
"core": "te-workplace"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "The workplace"
"description": "Meetings, the office, colleagues and bosses, and the words for documents, deadlines and pay. Not yet checked by a Telugu speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "te-2900":
    "native": "meeting"
    "examples":
      "రేపు పది గంటలకు మీటింగ్ ఉంది.":
        "native": "There is a meeting tomorrow at ten o'clock."
        "bases":
          "గంటలకు":
            "meaning": "at (the) hour; o'clock"
      "మీటింగ్ తర్వాత నేను ఫోన్ చేస్తాను.":
        "native": "I will call after the meeting."
    "notes":
      "n1": "In speech this is the usual word. The formal word is సమావేశం (samāvēśaṁ)."
  "te-2901":
    "native": "meeting; gathering (formal)"
    "examples":
      "సమావేశంలో అందరూ ఉన్నారు.":
        "native": "Everyone is at the meeting."
        "bases":
          "సమావేశంలో":
            "meaning": "in the meeting"
          "అందరూ":
            "meaning": "everyone"
      "సమావేశానికి రావాలి.":
        "native": "You must come to the meeting."
        "bases":
          "సమావేశానికి":
            "meaning": "to the meeting"
    "notes":
      "n1": "The formal word for a meeting. In speech people say మీటింగ్ (mīṭiṅg)."
    senses:
      "meeting": { native: "meeting, consorting together" }
      "conference": { native: "conference" }
    wiktionary: true
  "te-2902":
    "native": "boss"
    "examples":
      "మా బాస్ చాలా మంచివారు.":
        "native": "Our boss is very nice."
        "bases":
          "మా":
            "meaning": "our"
          "మంచివారు":
            "meaning": "good (a respectful word for a person)"
      "బాస్ నాకు ఒక ఫైలు ఇచ్చారు.":
        "native": "The boss gave me a file."
        "bases":
          "నాకు":
            "meaning": "to me"
    "notes":
      "n1": "Used for a man or a woman boss alike."
  "te-2903":
    "native": "colleague"
    "examples":
      "నా సహోద్యోగి రేపు సెలవులో ఉంటారు.":
        "native": "My colleague will be on leave tomorrow."
        "bases":
          "నా":
            "meaning": "my"
      "సహోద్యోగులు నాకు సహాయం చేశారు.":
        "native": "My colleagues helped me."
        "bases":
          "సహోద్యోగులు":
            "meaning": "colleagues"
          "నాకు":
            "meaning": "to me"
    "notes":
      "n1": "The plural is సహోద్యోగులు (sahōdyōgulu): the stem changes to సహోద్యోగుల-."
    wiktionary: true
  "te-2904":
    "native": "employee; staff member"
    "examples":
      "ఈ కంపెనీలో వంద మంది ఉద్యోగులు ఉన్నారు.":
        "native": "This company has a hundred employees."
        "bases":
          "కంపెనీలో":
            "meaning": "in the company"
          "ఉద్యోగులు":
            "meaning": "employees"
      "కొత్త ఉద్యోగి ఈ రోజు వచ్చారు.":
        "native": "The new employee came today."
    "notes":
      "n1": "The plural is ఉద్యోగులు (udyōgulu): the stem changes to ఉద్యోగుల-. The job itself is ఉద్యోగం (udyōgaṁ)."
    synonyms: { "udyogasthudu": "employee; government official" }
    senses:
      "officer": { native: "an officer, a functionary" }
    wiktionary: true
  "te-2905":
    "native": "manager"
    "examples":
      "మా మేనేజర్ ఇప్పుడు మీటింగ్‌లో ఉన్నారు.":
        "native": "Our manager is in a meeting now."
        "bases":
          "మా":
            "meaning": "our"
          "మీటింగ్‌లో":
            "meaning": "in the meeting"
      "మేనేజర్ నాకు ఫైలు పంపారు.":
        "native": "The manager sent me a file."
        "bases":
          "నాకు":
            "meaning": "to me"
    "notes":
      "n1": "Used in offices and companies."
  "te-2906":
    "native": "desk"
    "examples":
      "నా డెస్కు మీద ఫైళ్లు ఉన్నాయి.":
        "native": "There are files on my desk."
        "bases":
          "నా":
            "meaning": "my"
          "ఫైళ్లు":
            "meaning": "files"
      "డెస్కులో ఒక పెన్ను ఉంది.":
        "native": "There is a pen in the desk."
        "bases":
          "డెస్కులో":
            "meaning": "in the desk"
    "notes":
      "n1": "Also written డెస్క్ (ḍesk), as in English."
  "te-2907":
    "native": "printer"
    "examples":
      "ప్రింటర్ మళ్ళీ పని చేస్తోంది.":
        "native": "The printer is working again."
      "ఈ ప్రింటర్‌లో కాగితం లేదు.":
        "native": "There is no paper in this printer."
        "bases":
          "ప్రింటర్‌లో":
            "meaning": "in the printer"
    "notes":
      "n1": "The machine that prints on paper, at work or at home."
  "te-2908":
    "native": "file"
    "examples":
      "ఈ ఫైలు రేపు ఇవ్వండి.":
        "native": "Give me this file tomorrow."
      "ఫైలును మీ డెస్కు మీద పెట్టండి.":
        "native": "Put the file on your desk."
        "bases":
          "ఫైలును":
            "meaning": "the file (as the object)"
          "మీ":
            "meaning": "your"
          "పెట్టండి":
            "meaning": "put (polite command)"
    "notes":
      "n1": "The plural is ఫైళ్లు (phaiḷḷu): the stem changes to ఫైళ్ళ-."
  "te-2909":
    "native": "document; paper (formal)"
    "examples":
      "ఈ పత్రంలో మీ పేరు రాయండి.":
        "native": "Write your name on this document."
        "bases":
          "పత్రంలో":
            "meaning": "on this document"
          "మీ":
            "meaning": "your"
      "నేను రెండు పత్రాలు తీసుకున్నాను.":
        "native": "I took two documents."
        "bases":
          "పత్రాలు":
            "meaning": "documents"
          "తీసుకున్నాను":
            "meaning": "took (I took)"
    "notes":
      "n1": "The plural is పత్రాలు (patrālu): the stem changes to పత్రా-."
    wiktionary: true
  "te-2910":
    "native": "notice"
    "examples":
      "గోడ మీద ఒక నోటీసు ఉంది.":
        "native": "There is a notice on the wall."
      "ఆ నోటీసు చదివారా?":
        "native": "Did you read that notice?"
        "bases":
          "చదివారా":
            "meaning": "did (you) read"
    "notes":
      "n1": "A printed or written notice on a wall or a board."
  "te-2911":
    "native": "target; goal"
    "examples":
      "ఈ నెల లక్ష్యం ఏమిటి?":
        "native": "What is this month's target?"
      "మా లక్ష్యం సమయానికి పని పూర్తి చేయడం.":
        "native": "Our goal is to finish the work on time."
        "bases":
          "మా":
            "meaning": "our"
          "సమయానికి":
            "meaning": "on time"
    "notes":
      "n1": "A goal at work or in life, or a sales target."
    wiktionary: true
  "te-2912":
    "native": "deadline; time limit"
    "examples":
      "గడువు శుక్రవారం.":
        "native": "The deadline is Friday."
      "గడువు దాటితే మళ్ళీ దరఖాస్తు చేయాలి.":
        "native": "If the deadline passes, you must apply again."
        "bases":
          "దాటితే":
            "meaning": "if (it) passes"
    "notes":
      "n1": "The last day or time by which something must be done."
  "te-2913":
    "native": "attendance; present"
    "examples":
      "ఈ రోజు హాజరు తీసుకోండి.":
        "native": "Take attendance today."
        "bases":
          "తీసుకోండి":
            "meaning": "take (polite command)"
      "హాజరు తప్పనిసరి.":
        "native": "Attendance is compulsory."
    "notes":
      "n1": "When a name is called in a class or an office, హాజరు (hājaru) is the answer meaning 'present'."
  "te-2914":
    "native": "permission"
    "examples":
      "నాకు ఇంటికి వెళ్ళడానికి అనుమతి కావాలి.":
        "native": "I need permission to go home."
        "bases":
          "నాకు":
            "meaning": "to me"
          "ఇంటికి":
            "meaning": "home (to)"
      "మేనేజర్ అనుమతి ఇచ్చారు.":
        "native": "The manager gave permission."
    "notes":
      "n1": "Permission from the person in charge."
    wiktionary: true
  "te-2915":
    "native": "application; written request"
    "examples":
      "దరఖాస్తు ఫారం ఎక్కడ?":
        "native": "Where is the application form?"
      "నేను ఉద్యోగానికి దరఖాస్తు పంపాను.":
        "native": "I sent an application for the job."
        "bases":
          "ఉద్యోగానికి":
            "meaning": "for the job"
    "notes":
      "n1": "A form or a written request for a job, a course or a licence."
    senses:
      "application": { native: "application" }
    wiktionary: true
  "te-2916":
    "native": "interview"
    "examples":
      "రేపు ఉదయం ఇంటర్వ్యూ ఉంది.":
        "native": "There is an interview tomorrow morning."
      "ఇంటర్వ్యూలో ఏం అడిగారు?":
        "native": "What did they ask in the interview?"
        "bases":
          "ఇంటర్వ్యూలో":
            "meaning": "in the interview"
    "notes":
      "n1": "The English word is used in Telugu."
    wiktionary: true
  "te-2917":
    "native": "canteen"
    "examples":
      "మధ్యాహ్నం క్యాంటీన్‌లో భోజనం చేస్తాను.":
        "native": "I eat lunch in the canteen in the afternoon."
        "bases":
          "క్యాంటీన్‌లో":
            "meaning": "in the canteen"
      "క్యాంటీన్ ఎక్కడ ఉంది?":
        "native": "Where is the canteen?"
    "notes":
      "n1": "The canteen of a school, an office or a factory."
  "te-2918":
    "native": "lift; elevator"
    "examples":
      "లిఫ్టు పని చేయడం లేదు, మెట్లు ఎక్కండి.":
        "native": "The lift is not working; take the stairs."
        "bases":
          "ఎక్కండి":
            "meaning": "climb (take, polite command)"
      "లిఫ్టులో ఐదుగురు ఉన్నారు.":
        "native": "There are five people in the lift."
        "bases":
          "లిఫ్టులో":
            "meaning": "in the lift"
          "ఐదుగురు":
            "meaning": "five people"
    "notes":
      "n1": "Also written లిఫ్ట్ (liphṭ)."
  "te-2919":
    "native": "reception; front desk"
    "examples":
      "రిసెప్షన్‌లో మీ పేరు చెప్పండి.":
        "native": "Tell your name at reception."
        "bases":
          "రిసెప్షన్‌లో":
            "meaning": "at reception"
          "మీ":
            "meaning": "your"
      "రిసెప్షన్ మూడో అంతస్తులో ఉంది.":
        "native": "The reception is on the third floor."
        "bases":
          "మూడో":
            "meaning": "third"
          "అంతస్తులో":
            "meaning": "on the floor"
    "notes":
      "n1": "The front desk of an office or a hotel."
  "te-2920":
    "native": "ID card"
    "examples":
      "మీ ఐడీ కార్డు చూపించండి.":
        "native": "Show your ID card."
        "bases":
          "మీ":
            "meaning": "your"
          "చూపించండి":
            "meaning": "show (polite command)"
      "ఐడీ కార్డు లేకుండా లోపలికి రావద్దు.":
        "native": "Do not come in without an ID card."
        "bases":
          "లోపలికి":
            "meaning": "inside"
    "notes":
      "n1": "The English 'ID' is said as ఐడీ (aiḍī)."
  "te-2921":
    "native": "signature"
    "examples":
      "ఇక్కడ మీ సంతకం పెట్టండి.":
        "native": "Put your signature here."
        "bases":
          "మీ":
            "meaning": "your"
          "పెట్టండి":
            "meaning": "put (polite command)"
      "ఈ పత్రం మీద సంతకం లేదు.":
        "native": "There is no signature on this document."
    "notes":
      "n1": "The verb is సంతకం చేయడం (santakaṁ cēyaḍaṁ), to sign."
    wiktionary: true
  "te-2922":
    "native": "salary; pay (formal)"
    "examples":
      "నెల వేతనం ఎంత?":
        "native": "What is the monthly salary?"
      "వేతనం ప్రతి నెలా ఒకటో తేదీన వస్తుంది.":
        "native": "The salary comes on the first of every month."
        "bases":
          "నెలా":
            "meaning": "every month"
          "ఒకటో":
            "meaning": "first"
          "తేదీన":
            "meaning": "on the date"
    "notes":
      "n1": "A formal word. In speech people say జీతం (jītaṁ)."
    wiktionary: true
  "te-2923":
    "native": "promotion"
    "examples":
      "ఈ సంవత్సరం నాకు ప్రమోషన్ వచ్చింది.":
        "native": "I got a promotion this year."
        "bases":
          "నాకు":
            "meaning": "to me"
      "ప్రమోషన్ కోసం పని బాగా చేయాలి.":
        "native": "To get a promotion, you must do your work well."
    "notes":
      "n1": "The English word is used in Telugu."
  "te-2924":
    "native": "resignation"
    "examples":
      "అతను రాజీనామా ఇచ్చాడు.":
        "native": "He handed in his resignation."
        "bases":
          "అతను":
            "meaning": "he"
      "రాజీనామా ఆమోదించారు.":
        "native": "They accepted the resignation."
        "bases":
          "ఆమోదించారు":
            "meaning": "accepted"
    "notes":
      "n1": "Used for leaving a job, in writing or in speech."
    senses:
      "resignation": { native: "a resignation letter" }
    wiktionary: true
  "te-2925":
    "native": "company; firm"
    "examples":
      "మా కంపెనీ ఎక్కడ ఉంది?":
        "native": "Where is our company?"
        "bases":
          "మా":
            "meaning": "our"
      "ఆ కంపెనీలో ఎంత మంది పని చేస్తారు?":
        "native": "How many people work in that company?"
        "bases":
          "కంపెనీలో":
            "meaning": "in the company"
    "notes":
      "n1": "The formal word for a company is సంస్థ (saṁstha)."
  "te-2926":
    "native": "delay; lateness"
    "examples":
      "ట్రాఫిక్ వల్ల ఆలస్యం అయింది.":
        "native": "It was delayed because of traffic."
        "bases":
          "అయింది":
            "meaning": "became; happened"
      "క్షమించండి, నేను ఆలస్యంగా వచ్చాను.":
        "native": "Sorry, I came late."
        "bases":
          "క్షమించండి":
            "meaning": "excuse me; sorry"
          "ఆలస్యంగా":
            "meaning": "late"
    "notes":
      "n1": "As an adverb, ఆలస్యంగా (ālasyaṅgā) means late."
    wiktionary: true
  "te-2927":
    "native": "compulsory; must"
    "examples":
      "ఈ సమావేశం అందరికీ తప్పనిసరి.":
        "native": "This meeting is compulsory for everyone."
        "bases":
          "అందరికీ":
            "meaning": "for everyone"
      "ఈ ఫారం నింపడం తప్పనిసరి.":
        "native": "Filling in this form is compulsory."
    "notes":
      "n1": "An adjective, used before or after a noun: హాజరు తప్పనిసరి (hājaru tappanisari), attendance is compulsory."
    senses:
      "unavoidable": { native: "unavoidable, inevitable" }
    wiktionary: true
  "te-2928":
    "native": "important"
    "bases":
      "ముఖ్యమైన": { "meaning": "important" }
    "examples":
      "ఇది చాలా ముఖ్యమైన విషయం.":
        "native": "This is a very important matter."
      "ఈ నోటీసు ముఖ్యమైనది.":
        "native": "This notice is important."
        "bases":
          "ముఖ్యమైనది":
            "meaning": "is important"
    "notes":
      "n1": "Before a noun it is ముఖ్యమైన (mukhyamaina); on its own it is ముఖ్యమైనది (mukhyamainadi), and the stem changes from ముఖ్యమైన-."
  "te-2929":
    "native": "to postpone"
    "examples":
      "మీటింగ్ వాయిదా వేశారు.":
        "native": "They postponed the meeting."
        "bases":
          "వేశారు":
            "meaning": "put (they did)"
      "ఈ రోజు పని వాయిదా వేయొద్దు.":
        "native": "Don't postpone today's work."
        "bases":
          "వేయొద్దు":
            "meaning": "do not put"
    "notes":
      "n1": "వాయిదా (vāyidā) is a postponement, and the verb puts it: వాయిదా వేయడం."
  "te-2930":
    "native": "to inform; to let (someone) know"
    "examples":
      "గడువు మార్పు గురించి నేను మీకు తెలియజేస్తాను.":
        "native": "I will let you know about the change in the deadline."
        "bases":
          "మీకు":
            "meaning": "to you"
          "తెలియజేస్తాను":
            "meaning": "I will inform"
      "దయచేసి ఇమెయిల్‌లో తెలియజేయండి.":
        "native": "Please let me know by email."
        "bases":
          "ఇమెయిల్‌లో":
            "meaning": "by email"
          "తెలియజేయండి":
            "meaning": "inform (polite command)"
    "notes":
      "n1": "The everyday word for 'tell' is చెప్పడం (ceppaḍaṁ)."
  "te-2931":
    "native": "to cancel"
    "examples":
      "వర్షం వల్ల మీటింగ్ రద్దు చేశారు.":
        "native": "Because of the rain, they cancelled the meeting."
        "bases":
          "చేశారు":
            "meaning": "did"
      "రైలు రద్దు అయింది.":
