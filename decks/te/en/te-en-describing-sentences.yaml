schema: 1
id: "te-en-describing-sentences"
kind: "layer"
core: "te-describing-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing things and feelings: sentences"
description: "Sentences that describe things and say how you feel, with the words of the describing unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0976":
    notes:
      "n1": "నాకు (nāku) is the dative of నేను (nēnu), I, so the feeling of thirst is to me."
    native: "I am thirsty."
    alt_native: ["I feel thirsty."]
  "te-0977":
    notes:
      "n1": "అతనికి (ataniki) is the dative of అతను (atanu), he, so the anger is to him."
    native: "He is very angry."
    alt_native: ["He is very cross."]
  "te-0978":
    notes:
      "n1": "బరువుగా (baruvugā), heavy, has the ending -gā and goes with ఉంది (undi) to describe a thing."
    native: "This bag is very heavy."
  "te-0979":
    native: "This work is very easy."
    alt_native: ["This job is very easy."]
  "te-0980":
    native: "That shirt is expensive."
    alt_native: ["That shirt is costly."]
  "te-0981":
    notes:
      "n1": "పొడవుగా (poḍavugā), long, has the ending -gā and goes with ఉంది (undi) to describe a thing."
    native: "This room is long."
  "te-0982":
    notes:
      "n1": "అలసటగా (alasaṭagā), tired, has the ending -gā and goes with ఉన్నాను (unnānu) to describe the speaker."
    native: "I am very tired."
    alt_native: ["I am so tired."]
  "te-0983":
    notes:
      "n1": "నడవండి (naḍavaṇḍi) is the polite form of the command 'walk', said to a person you address politely, or to several people."
    native: "Please walk slowly."
    alt_native: ["Walk slowly, please."]
  "te-0984":
    notes:
      "n1": "పరిగెత్తగలను (parigettagalanu), I can run, has the ending -galanu, which means 'can'."
    native: "I can run fast."
    alt_native: ["I can run quickly."]
  "te-0985":
    notes:
      "n1": "చలిగా (caligā), cold, has the ending -gā and goes with ఉంది (undi) to describe the weather here."
    native: "It is cold here."
