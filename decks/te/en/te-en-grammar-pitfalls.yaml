schema: 1
id: "te-en-grammar-pitfalls"
kind: "layer"
core: "te-grammar-pitfalls"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Pitfalls"
description: "The mistakes English speakers make most in Telugu. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "te-0372":
    native: "Let's go (you and I)."
    alt_native: ["Let us go."]
    notes:
      "n1": "Telugu has two 'we': మనం (manam) includes the listener, మేము (mēmu) leaves them out."
  "te-0373":
    native: "We are going (not you)."
    notes:
      "n1": "Said to someone who is staying behind."
  "te-0374":
    native: "This isn't water."
    notes:
      "n1": "కాదు (kādu) denies what something is."
  "te-0375":
    native: "There's no water."
    alt_native: ["There isn't any water."]
    notes:
      "n1": "లేదు (lēdu) or లేవు (lēvu) denies that something is there."
  "te-0376":
    native: "I'm hungry."
    notes:
      "n1": "'To me there is hunger'."
  "te-0377":
    native: "I have to go."
    alt_native: ["I must go.", "I have got to go."]
    notes:
      "n1": "-ఆలి (-āli) on the stem says 'must'."
  "te-0378":
    native: "Please sit down."
    alt_native: ["Sit down, please."]
    notes:
      "n1": "With మీరు (mīru), a request ends in -అండి (-aṇḍi). నువ్వు కూర్చో (nuvvu kūrcō) is for friends and children."
  "te-0379":
    native: "Mr Ramu has come."
    alt_native: ["Mr Ramu has arrived."]
    notes:
      "n1": "Respect for one person takes the plural verb: వచ్చారు (vaccāru), not వచ్చాడు (vaccāḍu). రావడం (rāvaḍam) changes its stem in the past: వచ్చ- (vacc-)."
    bases:
      "రాము": "Ramu (a man's name)"
