schema: 1
id: "te-en-grammar-passive"
kind: "layer"
core: "te-grammar-passive"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Passive: -బడు (-baḍu), it was done"
description: "A verb's stem with -బడు (-baḍu) says that something was or is done, without saying who did it: 'it was done', 'it is done'. Everyday speech often avoids this form and uses an active sentence with 'they', or -అయింది (-ayindi, 'it became'). Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "was-done": "it was done, got done"
    "is-done": "it is done, is being done"
rules:
  "te-rule-passive-was":
    name: "-బడింది (-baḍindi): it was done"
    explanation: "{1} is a verb's stem with -బడు (-baḍu) added, in the past form for it: the same for every doer, and the doer is not named. {2} is 'it was done', {3} is 'it was eaten', and {4} is 'it was sent'. Use it when the doer is unknown or unimportant. A verb ending in -ుకో (-ukō) drops its 'వ' before -బడు, so తెలుసుకో becomes తెలుసుకోబడింది, 'it was found out'."
  "te-rule-passive-is":
    name: "-బడుతుంది (-baḍutundi): it is done"
    explanation: "{1} is the same stem with -బడుతుంది (-baḍutundi), the present form for it: 'it is done' or 'it is being done'. {2} is 'it is being done', {3} is 'it is sold', and {4} is 'it is opened'."
  "te-rule-passive-everyday":
    name: "Everyday alternatives: they did it, it got done"
    explanation: "In speech, people often avoid the passive. {1} is an active sentence with 'they' and no named doer: 'they did it'. {2} says that work got done with -అయింది (-ayindi, 'it became'), and {3} that it was finished, with -అయిపోయింది (-ayipōyindi). Verbs that take no passive, such as నడవడం (to walk), always use these alternatives."
