schema: 1
id: "te-en-places"
kind: "layer"
core: "te-places"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Places"
description: "Places in town and country: school, temple, bank, market, village, river, hill, and the states and districts you find on a map. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0764":
    native: "school"
    wiktionary: true
    notes:
      "n1": "The everyday word; the formal word is {1}."
    "examples": {
      "బడి ఎక్కడ ఉంది?": {"native": "Where is the school?", "bases": {}}
    }
  "te-0765":
    native: "college"
    wiktionary: true
    notes:
      "n1": "The formal word. In speech people say {1}."
  "te-0766":
    native: "university"
    wiktionary: true
    notes:
      "n1": "A long word from Sanskrit: {1}, world, and {2}, a place of learning."
  "te-0767":
    native: "temple"
    wiktionary: true
    notes:
      "n1": "A Hindu temple. The formal word is {1}."
    "examples": {
      "మేము రేపు గుడికి వెళ్తాము.": {"native": "We will go to the temple tomorrow.", "bases": {"గుడికి": "temple"}}
    }
  "te-0768":
    native: "mosque"
    wiktionary: true
    notes:
      "n1": "A word from Arabic, through Urdu."
  "te-0769":
    native: "church"
    wiktionary: true
    notes:
      "n1": "A word from English."
  "te-0770":
    native: "bank"
    wiktionary: true
    notes:
      "n1": "A word from English."
    "examples": {
      "అతను రోజూ బ్యాంకులో పని చేస్తాడు.": {"native": "He works in a bank every day.", "bases": {"బ్యాంకులో": "bank"}},
      "బ్యాంకు పక్కన ఒక పార్కు ఉంది.": {"native": "There is a park next to the bank.", "bases": {}}
    }
  "te-0771":
    native: "post office"
    notes:
      "n1": "From English 'post office'."
  "te-0772":
    native: "park"
    notes:
      "n1": "A word from English."
    "examples": {
      "ఉదయం పార్కులో పరుగెత్తుతాను.": {"native": "I run in the park in the morning.", "bases": {}},
      "శనివారం నేను పార్కుకి వెళ్తాను.": {"native": "On Saturday I go to the park.", "bases": {}}
    }
  "te-0773":
    native: "market; bazaar"
    alt_native: ["marketplace"]
    wiktionary: true
    notes:
      "n1": "A word from Persian: the market street."
    "examples": {
      "బజారులో ప్లాస్టిక్ సంచులు ఇస్తారు.": {"native": "In the market they give out plastic bags.", "bases": {"బజారులో": "market; bazaar"}}
    }
  "te-0774":
    native: "cinema; theatre"
    alt_native: ["movie theater"]
    notes:
      "n1": "A cinema hall is called a {1}."
    "examples": {
      "అభిమానులు థియేటర్ ముందు నిలబడ్డారు.": {"native": "The fans stood in front of the theatre.", "bases": {}},
      "థియేటర్‌లో ఒక ప్రేక్షకుడు నవ్వాడు.": {"native": "A viewer laughed in the theatre.", "bases": {}}
    }
  "te-0775":
    native: "hotel; restaurant"
    notes:
      "n1": "{1} often means a place to eat, not only a place to stay."
    "examples": {
      "నేను హోటల్ బుకింగ్ చేశాను.": {"native": "I booked a hotel.", "bases": {}},
      "బడ్జెట్‌లో ఉండే హోటల్ కావాలి.": {"native": "We want a hotel that fits our budget.", "bases": {}}
    }
  "te-0776":
    native: "airport"
    wiktionary: true
    notes:
      "n1": "Built from {1}, aeroplane, and {2}, shelter."
    "examples": {
      "విమానాశ్రయంలో విమానం ఎక్కాను.": {"native": "I boarded the plane at the airport.", "bases": {"విమానాశ్రయంలో": "airport"}},
      "విమానాశ్రయం నగరానికి దూరంగా ఉంది.": {"native": "The airport is far from the city.", "bases": {}}
    }
  "te-0777":
    native: "bus stand"
    alt_native: ["bus station", "bus terminal"]
    notes:
      "n1": "Built from {1}, bus, and English 'stand'."
    "examples": {
      "బస్టాండ్ సమీపంలో హోటల్ ఉంది.": {"native": "There is a hotel near the bus stand.", "bases": {"బస్టాండ్": "bus stand"}},
      "ఆసుపత్రి బస్టాండ్ దగ్గర ఉంది.": {"native": "The hospital is near the bus stand.", "bases": {}}
    }
  "te-0778":
    native: "town; city"
    wiktionary: true
    notes:
      "n1": "A town, as against {1}, a village."
    "examples": {
      "ఈ పట్నంలో కాలుష్యం ఎక్కువగా ఉంది.": {"native": "In this city, pollution is high.", "bases": {"పట్నంలో": "town; city"}},
      "ఈ పట్నంలో వీధుల శుభ్రత బాగా ఉంది.": {"native": "In this city the streets are very clean.", "bases": {"పట్నంలో": "town; city"}}
    }
  "te-0779":
    native: "village"
    wiktionary: true
    notes:
      "n1": "The formal word; {1} is the everyday one."
    "examples": {
      "గ్రామంలో జనాభా తక్కువ.": {"native": "The population in the village is small.", "bases": {}},
      "గ్రామంలో అందరికీ కబడ్డీ ఇష్టం.": {"native": "Everyone in the village likes kabaddi.", "bases": {}}
    }
  "te-0780":
    native: "village; the countryside"
    alt_native: ["the country"]
    wiktionary: true
    notes:
      "n1": "As in {1}, a village."
  "te-0781":
    native: "field; farmland"
    alt_native: ["fields"]
    wiktionary: true
    notes:
      "n1": "A field of crops; {1} is a garden or an orchard."
    "examples": {
      "నేను పొలంలో ఉన్నాను.": {"native": "I am in the field.", "bases": {"పొలంలో": "field; farmland"}},
      "పొలంలో పంట ఇంకా ఉంది.": {"native": "The crop is still in the field.", "bases": {"పొలంలో": "field; farmland"}}
    }
  "te-0782":
    native: "garden; orchard"
    wiktionary: true
    notes:
      "n1": "A garden, or an orchard of fruit trees."
    "examples": {
      "నేను తోటలో ఆడుకుంటాను.": {"native": "I play in the garden.", "bases": {}},
      "తోటలో ఒక మొక్క ఉంది.": {"native": "There is a plant in the garden.", "bases": {}}
    }
  "te-0783":
    native: "river"
    wiktionary: true
    notes:
      "n1": "{1} and {2} are the two great rivers of the Telugu country."
    "examples": {
      "నది వెడల్పుగా ఉంది.": {"native": "The river is wide.", "bases": {}}
    }
  "te-0784":
    native: "sea"
    wiktionary: true
    notes:
      "n1": "A word from Sanskrit."
    "examples": {
      "సముద్రం లోతు చాలా ఎక్కువ.": {"native": "The sea is very deep.", "bases": {}}
    }
  "te-0785":
    native: "hill"
    wiktionary: true
    notes:
      "n1": "A mountain is {1}."
    "examples": {
      "ఇది కొండల ప్రాంతం.": {"native": "This is a hilly region.", "bases": {}},
      "ఆ కొండ అంచు చాలా అపాయం.": {"native": "That cliff edge is very dangerous.", "bases": {}}
    }
  "te-0786":
    native: "forest"
    alt_native: ["woods"]
    wiktionary: true
    notes:
      "n1": "Its plural is {1}."
    "examples": {
      "అడవిలో అనేక జంతువులు ఉంటాయి.": {"native": "Many animals live in the forest.", "bases": {"అడవిలో": "forest"}}
    }
  "te-0787":
    native: "bridge"
    wiktionary: true
    notes:
      "n1": "In speech also {1}, from English."
    "examples": {
      "రైలు వంతెనను దాటుతుంది.": {"native": "The train crosses the bridge.", "bases": {}},
      "కృష్ణా నది మీద ఒక పెద్ద వంతెన ఉంది.": {"native": "There is a big bridge over the Krishna river.", "bases": {}}
    }
  "te-0788":
    native: "factory"
    notes:
      "n1": "The formal word. In speech also {1}."
    "examples": {
      "కర్మాగారాల ఉద్గారాలు ఎక్కువగా ఉన్నాయి.": {"native": "The emissions from factories are high.", "bases": {"కర్మాగారాల": "factory"}},
      "కర్మాగారం నుంచి విష వాయువులు వస్తున్నాయి.": {"native": "Poisonous gases are coming out of the factory.", "bases": {}}
    }
  "te-0789":
    native: "upper floor; a building with floors"
    alt_native: ["storey"]
    wiktionary: true
    notes:
      "n1": "{1} means upstairs."
      "pair": "Vowel length: {1} (mēḍa, upper floor) has the long ē where {2} (meḍa, neck) has the short e."
  "te-0790":
    native: "library"
    wiktionary: true
    notes:
      "n1": "Built from {1}, a book, and {2}, a house."
  "te-0791":
    native: "a ground; a playground"
    wiktionary: true
    notes:
      "n1": "Any wide open space, as for cricket."
    "examples": {
      "పిల్లలు మైదానంలో ఆడతారు.": {"native": "The children play on the ground.", "bases": {"మైదానంలో": "ground; a playground"}},
      "ఆ ఆటగాళ్ళు మైదానంలో ఆడతారు.": {"native": "Those players play on the field.", "bases": {}}
    }
  "te-0792":
    native: "junction; crossroads"
    alt_native: ["intersection"]
    notes:
      "n1": "Related to {1}, to come together."
    "examples": {
      "నగర కూడలిలో ఒక పెద్ద విగ్రహం ఉంది.": {"native": "There is a big statue at the city crossroads.", "bases": {}},
      "కూడలి దగ్గర ఆగండి.": {"native": "Please stop near the junction.", "bases": {}}
    }
  "te-0793":
    native: "beach"
    alt_native: ["seashore"]
    wiktionary: true
    notes:
      "n1": "A word from English."
  "te-0794":
    native: "lake"
    wiktionary: true
    notes:
      "n1": "A word from Sanskrit."
  "te-0795":
    native: "state"
    wiktionary: true
    notes:
      "n1": "As in {1} and {2}."
    "examples": {
      "ఈ రాష్ట్రానికి కొత్త ముఖ్యమంత్రి వచ్చారు.": {"native": "A new chief minister has come to this state.", "bases": {}},
      "రెండు రాష్ట్రాల మధ్య సరిహద్దు ఉంది.": {"native": "There is a border between the two states.", "bases": {}}
    }
  "te-0796":
    native: "district"
    wiktionary: true
    notes:
      "n1": "An area of administration. The word is from Urdu."
    "examples": {
      "జిల్లా కలెక్టర్ ఆఫీసులో ఈ ఫారం ఇవ్వండి.": {"native": "Hand in this form at the district collector's office.", "bases": {}}
    }
  "te-0797":
    native: "capital (city)"
    alt_native: ["capital city"]
    wiktionary: true
    notes:
      "n1": "{1} is the capital of Telangana."
    "examples": {
      "చెన్నై తమిళనాడు రాజధాని.": {"native": "Chennai is the capital of Tamil Nadu.", "bases": {}},
      "ఢిల్లీ భారతదేశ రాజధాని.": {"native": "Delhi is India's capital.", "bases": {}}
    }
