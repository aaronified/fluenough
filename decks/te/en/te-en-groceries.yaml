schema: 1
id: "te-en-groceries"
kind: "layer"
core: "te-groceries"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Groceries"
description: "Vegetables, fish, meat, eggs and the staples. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0255":
    native: "vegetables"
  "te-0256":
    native: "potato"
    alt_native: ["potatoes"]
    notes:
      "n1": "In speech often ఆలుగడ్డ (ālugaḍḍa)."
  "te-0257":
    native: "onion"
    alt_native: ["onions"]
    notes:
      "n1": "In Telangana often ఉల్లిగడ్డ (ulligaḍḍa)."
  "te-0258":
    native: "tomato"
    alt_native: ["tomatoes"]
  "te-0259":
    native: "chilli"
    alt_native: ["chili", "chilies"]
  "te-0260":
    native: "garlic"
  "te-0261":
    native: "fish"
    notes:
      "n1": "More than one: చేపలు (cēpalu)."
  "te-0262":
    native: "mutton (goat meat)"
    alt_native: ["goat meat"]
    notes:
      "n1": "Meat is మాంసం (māmsam). In India 'mutton' almost always means goat."
  "te-0263":
    native: "chicken; hen"
    notes:
      "n1": "Chicken meat is కోడి మాంసం (kōḍi māmsam); shops also say చికెన్ (ciken)."
  "te-0264":
    native: "egg"
    alt_native: ["eggs"]
    notes:
      "n1": "More than one: గుడ్లు (guḍlu)."
  "te-0265":
    native: "milk"
    notes:
      "n1": "Plural in grammar, like నీళ్ళు (water)."
  "te-0266":
    native: "rice (uncooked)"
    alt_native: ["raw rice"]
    notes:
      "n1": "Cooked rice is అన్నం (annam)."
  "te-0267":
    native: "lentils; dal"
    alt_native: ["lentil"]
  "te-6476":
    native: "drumstick (moringa pod)"
    notes:
      "n1": "The long green pod of the moringa tree, cooked in sambar and in dal. Common in Andhra and Telangana kitchens."
    examples:
      "సాంబారులో మునక్కాయ ఉంది.": "There is drumstick in the sambar."
      "మునక్కాయ పప్పు బాగుంటుంది.": { "native": "Drumstick dal is good.", "bases": { "బాగుంటుంది": "to be good; to taste good" } }
  "te-6479":
    native: "mushroom"
    notes:
      "n1": "Mushroom, cooked as a curry or a dry fry. Menus list it as పుట్టగొడుగు వేపుడు (puṭṭagoḍugu vēpuḍu)."
    examples:
      "పుట్టగొడుగు కూర చాలా బాగుంది.": { "native": "The mushroom curry is very good.", "bases": { "బాగుంది": "to be good; to taste good" } }
      "పుట్టగొడుగు వేపుడు ఇవ్వండి.": "Please give the mushroom dry fry."
  "te-6480":
    native: "cashew nut"
    notes:
      "n1": "Cashew nut, fried in ghee and added to rich curries like కుర్మా (kurmā)."
    examples:
      "జీడిపప్పు కుర్మాలో వేస్తారు.": "Cashew nuts are put in korma."
      "జీడిపప్పు చాలా రుచిగా ఉంది.": "The cashew nuts are very tasty."
  "te-6482":
    native: "ripe red chilli"
    notes:
      "n1": "A ripe red chilli, fresh or dried. Dried red chillies are also called ఎండుమిర్చి (eṇḍumirci). Ground chilli is కారం (kāraṁ)."
    examples:
      "ఈ పండుమిర్చి చాలా కారంగా ఉంది.": "This red chilli is very hot."
      "పండుమిర్చి కొంచెం వేయండి.": "Put in a little red chilli."
  "te-6483":
    native: "garlic chilli powder"
    notes:
      "n1": "A dry spice powder of chilli and garlic, వెల్లుల్లి (vellulli), eaten with idli and dosa in Andhra and Telangana."
    examples:
      "వెల్లులికారం ఇడ్లీతో బాగుంటుంది.": { "native": "Garlic chilli powder is good with idli.", "bases": { "బాగుంటుంది": "to be good; to taste good" } }
      "వెల్లులికారం కొంచెం వేయండి.": "Put in a little garlic chilli powder."
  "te-6484":
    native: "nallakaram; dark roasted spice powder"
    notes:
      "n1": "A dark Andhra spice powder of roasted red chillies, coriander, tamarind, garlic and other spices, eaten with rice and ghee or added to curries. నల్ల (nalla) means black, but it is not black pepper, which is మిరియాలు (miriyālu). కారం (kāraṁ) here is the hot spice powder."
    examples:
      "నల్లకారం ఘాటుగా ఉంటుంది.": { "native": "Nallakaram is pungent.", "bases": { "ఘాటుగా": "pungent; sharp-tasting" } }
      "నల్లకారం అన్నంతో బాగుంటుంది.": { "native": "Nallakaram is good with rice.", "bases": { "బాగుంటుంది": "to be good; to taste good" } }
  "te-6485":
    native: "country chicken"
    notes:
      "n1": "A free-range country chicken, leaner and tougher than a broiler chicken, and usually costs more. నాటు (nāṭu) means native or country, and కోడి (kōḍi) is chicken."
    examples:
      "నాటుకోడి కూర చాలా రుచిగా ఉంటుంది.": "Country chicken curry is very tasty."
      "నాటుకోడి ధర ఎక్కువ.": "Country chicken costs more."
  "te-6486":
    native: "hen's egg"
    notes:
      "n1": "A hen's egg, from కోడి (kōḍi), hen, and గుడ్డు (guḍḍu), egg. The plain word గుడ్డు (guḍḍu) is also used for an egg."
    examples:
      "కోడిగుడ్డు ఉడికించండి.": "Please boil the egg."
      "కోడిగుడ్డు కూర బాగుంది.": { "native": "The egg curry is good.", "bases": { "బాగుంది": "to be good; to taste good" } }
  "te-6487":
    native: "wings (chicken wings)"
    notes:
      "n1": "Chicken wings, a common starter in restaurants, often fried dry as రెక్కలు వేపుడు (rekkalu vēpuḍu). One wing is రెక్క (rekka)."
    examples:
      "రెక్కలు వేపుడు చాలా బాగుంది.": { "native": "The wing fry is very good.", "bases": { "రెక్కలు": "wing", "బాగుంది": "to be good; to taste good" } }
      "నాకు రెక్కలు కావాలి.": { "native": "I'd like wings.", "bases": { "రెక్కలు": "wing" } }
    bases:
      "రెక్కలు": "wing"
  "te-6488":
    native: "meat"
    notes:
      "n1": "Meat in general. A dish takes its name from the meat: గోంగూర మాంసం (gōṅgūra māṁsaṁ)."
    examples:
      "మాంసం తింటాను.": "I eat meat."
      "మాంసం ధర ఎంత?": "What is the price of the meat?"
  "te-6489":
    native: "goat meat; mutton"
    notes:
      "n1": "Goat meat, mutton. వేట (vēṭa) usually means hunting, but వేటమాంసం (vēṭamāṁsaṁ) is a word for goat meat. Telangana speakers also say యాటమాంసం (yāṭamāṁsaṁ)."
    examples:
      "వేటమాంసం కూర చాలా ఘాటుగా ఉంది.": { "native": "The goat meat curry is very hot.", "bases": { "ఘాటుగా": "pungent; sharp-tasting" } }
      "వేటమాంసం అంటే మేక మాంసం.": { "native": "Vetamamsam means goat meat.", "bases": { "అంటే": "to say; its form అంటే (aṇṭē) is used for 'means'" } }
  "te-6490":
    native: "goat meat; mutton"
    notes:
      "n1": "Goat meat, mutton. యాట (yāṭa) is the Telangana word for goat. The same meat is వేటమాంసం (vēṭamāṁsaṁ), and మటన్ (maṭan) on many menus."
    examples:
      "యాటమాంసం అన్నంతో బాగుంటుంది.": { "native": "Goat meat is good with rice.", "bases": { "బాగుంటుంది": "to be good; to taste good" } }
      "నాకు యాటమాంసం కావాలి.": "I'd like goat meat."
  "te-6491":
    native: "murrel fish"
    notes:
      "n1": "Murrel, a firm freshwater fish, prized in Andhra and the classic fish for చేపల పులుసు (cēpala pulusu)."
    examples:
      "కొరమీను పులుసు చాలా బాగుంటుంది.": { "native": "Murrel pulusu is very good.", "bases": { "బాగుంటుంది": "to be good; to taste good" } }
      "కొరమీను వేపుడు ఇవ్వండి.": "Please give the murrel dry fry."
  "te-6492":
    native: "crab"
    notes:
      "n1": "Crab, a coastal dish: పీతల వేపుడు (pītala vēpuḍu), crab dry fry. The plural is పీతలు (pītalu)."
    examples:
      "పీత కూర చాలా రుచిగా ఉంటుంది.": "Crab curry is very tasty."
      "పీతల వేపుడు ఇవ్వండి.": { "native": "Please give the crab dry fry.", "bases": { "పీతల": "crab" } }
  "te-6493":
    native: "prawns"
    notes:
      "n1": "Prawns, a favourite of coastal Andhra, fried or cooked in a pulusu or a curry. One prawn is రొయ్య (royya)."
    examples:
      "రొయ్యల వేపుడు చాలా బాగుంది.": { "native": "The prawn fry is very good.", "bases": { "రొయ్యల": "prawn", "బాగుంది": "to be good; to taste good" } }
      "నాకు రొయ్యలు కావాలి.": { "native": "I'd like prawns.", "bases": { "రొయ్యలు": "prawn" } }
    bases:
      "రొయ్యలు": "prawn"
  "te-6494":
    native: "small prawns"
    notes:
      "n1": "Small prawns, fresh or dried, cooked as a fry or a chutney. చిట్టి (ciṭṭi) means small."
    examples:
      "చిట్టి రొయ్యల పచ్చడి చాలా కారంగా ఉంటుంది.": { "native": "Small prawn chutney is very hot.", "bases": { "చిట్టి": "small", "రొయ్యల": "prawn" } }
      "నాకు చిట్టి రొయ్యలు కావాలి.": { "native": "I'd like small prawns.", "bases": { "చిట్టి": "small" } }
    bases:
      "చిట్టి": "small"
  "te-6495":
    native: "amaranth greens"
    notes:
      "n1": "Amaranth leaves, cooked as a dal or a dry fry. A common village green."
    examples:
      "తోటకూర పప్పు బాగుంటుంది.": { "native": "Amaranth dal is good.", "bases": { "బాగుంటుంది": "to be good; to taste good" } }
      "తోటకూర వేపుడు చేయండి.": "Make an amaranth dry fry."
  "te-6496":
    native: "gongura; sorrel leaves"
    notes:
      "n1": "Sorrel (roselle) leaves, the sour green of Andhra and Telangana, used in chutney and with mutton. The sourness comes from the leaves, not tamarind."
    examples:
      "గోంగూర పులుపుగా ఉంటుంది.": "Gongura is sour."
      "నాకు గోంగూర పచ్చడి ఇష్టం.": "I like gongura chutney."
  "te-6497":
    native: "brinjal; aubergine"
    notes:
      "n1": "Brinjal, the common purple vegetable. Its stuffed form is గుత్తివంకాయ (guttivaṅkāya)."
    examples:
      "వంకాయ కూర చాలా బాగుంది.": { "native": "The brinjal curry is very good.", "bases": { "బాగుంది": "to be good; to taste good" } }
      "నాకు వంకాయ వేపుడు ఇష్టం.": "I like brinjal dry fry."
  "te-6498":
    native: "stuffed brinjal"
    notes:
      "n1": "Small brinjals stuffed with a spice paste, often with groundnut or coconut, and cooked whole in a curry. గుత్తి (gutti) means a bunch or cluster."
    examples:
      "గుత్తివంకాయ కూర చాలా ఘాటుగా ఉంది.": { "native": "The stuffed brinjal curry is very hot.", "bases": { "ఘాటుగా": "pungent; sharp-tasting" } }
      "గుత్తివంకాయ చాలా బాగుంది.": { "native": "The stuffed brinjal is very good.", "bases": { "బాగుంది": "to be good; to taste good" } }
  "te-6499":
    native: "coriander leaves"
    notes:
      "n1": "Fresh coriander leaves, used as a garnish and in chutney."
    examples:
      "కొత్తిమీర పైన వేయండి.": "Put the coriander on top."
      "కొత్తిమీర చట్నీ ఇవ్వండి.": { "native": "Please give coriander chutney.", "bases": { "చట్నీ": "chutney" } }
  "te-6500":
    native: "finger millet"
    notes:
      "n1": "Finger millet, a grain for ragi mudda, ragi dosa and ragi sangati. రాగి (rāgi) also means copper."
    examples:
      "రాగి ముద్ద ఆరోగ్యానికి మంచిది.": { "native": "Ragi mudda is good for health.", "bases": { "ముద్ద": "ball; lump" } }
      "రాగి దోశ చేయండి.": "Make a ragi dosa."
  "te-6501":
    native: "jaggery"
    notes:
      "n1": "Jaggery, the unrefined sugar of Telugu kitchens, used in sweets like పాయసం (pāyasaṁ) and in pulusu."
    examples:
      "బెల్లం కొంచెం వేయండి.": "Put in a little jaggery."
      "బెల్లం పాయసం తీపిగా ఉంది.": "The jaggery payasam is sweet."
