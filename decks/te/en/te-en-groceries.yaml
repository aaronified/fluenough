schema: 1
id: "te-en-groceries"
kind: "layer"
core: "te-groceries"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Groceries"
description: "Vegetables, fish, meat, eggs and the staples. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0255":
    native: "vegetables"
  "te-0256":
    native: "potato"
    alt_native: ["potatoes"]
    notes:
      "n1": "In speech often ఆలుగడ్డ (ālugaḍḍa)."
  "te-0257":
    native: "onion"
    alt_native: ["onions"]
    notes:
      "n1": "In Telangana often ఉల్లిగడ్డ (ulligaḍḍa)."
  "te-0258":
    native: "tomato"
    alt_native: ["tomatoes"]
  "te-0259":
    native: "chilli"
    alt_native: ["chili", "chilies"]
  "te-0260":
    native: "garlic"
  "te-0261":
    native: "fish"
    notes:
      "n1": "More than one: చేపలు (cēpalu)."
  "te-0262":
    native: "mutton (goat meat)"
    alt_native: ["goat meat"]
    notes:
      "n1": "Meat is మాంసం (māmsam). In India 'mutton' almost always means goat."
  "te-0263":
    native: "chicken; hen"
    notes:
      "n1": "Chicken meat is కోడి మాంసం (kōḍi māmsam); shops also say చికెన్ (ciken)."
  "te-0264":
    native: "egg"
    alt_native: ["eggs"]
    notes:
      "n1": "More than one: గుడ్లు (guḍlu)."
  "te-0265":
    native: "milk"
    notes:
      "n1": "Plural in grammar, like నీళ్ళు (water)."
  "te-0266":
    native: "rice (uncooked)"
    alt_native: ["raw rice"]
    notes:
      "n1": "Cooked rice is అన్నం (annam)."
  "te-0267":
    native: "lentils; dal"
    alt_native: ["lentil"]
  "te-6476":
    native: "drumstick (moringa pod)"
    notes:
      "n1": "The long green pod of the moringa tree, cooked in sambar and in dal. Common in Andhra and Telangana kitchens."
    examples:
      "సాంబారులో మునక్కాయ ఉంది.": { "native": "There is drumstick in the sambar.", "bases": { "మునక్కాయ": "drumstick (moringa pod)", "ఉంది": "is; there is" } }
      "మునక్కాయ పప్పు బాగుంటుంది.": { "native": "Drumstick dal is good.", "bases": { "మునక్కాయ": "drumstick (moringa pod)", "బాగుంటుంది": "is good; tastes good" } }
  "te-6477":
    native: "curry leaves"
    notes:
      "n1": "Curry leaves, fried in oil with mustard seeds to start a tempering (పోపు, pōpu). Pick them out before eating."
    examples:
      "కరివేపాకు పోపులో వేయండి.": { "native": "Put the curry leaves in the tempering.", "bases": { "కరివేపాకు": "curry leaves", "పోపులో": "in the tempering", "వేయండి": "put in" } }
      "కరివేపాకు ఎక్కువ వేయండి.": { "native": "Put in more curry leaves.", "bases": { "కరివేపాకు": "curry leaves", "వేయండి": "put in" } }
  "te-6478":
    native: "onion (spoken)"
    notes:
      "n1": "The spoken word for onion. The full form is ఉల్లిపాయ (ullipāya, te-0257). Both are used."
    examples:
      "ఉల్లి తరిగి వేయండి.": { "native": "Chop the onion and put it in.", "bases": { "ఉల్లి": "onion (spoken)", "తరిగి": "chopping", "వేయండి": "put in" } }
      "ఉల్లి వేయించండి.": { "native": "Fry the onion.", "bases": { "ఉల్లి": "onion (spoken)", "వేయించండి": "fry" } }
  "te-6479":
    native: "mushroom"
    notes:
      "n1": "Mushroom, cooked as a curry or a dry fry. Hyderabad menus list it as పుట్టగొడుగు వేపుడు (puṭṭagoḍugu vēpuḍu)."
    examples:
      "పుట్టగొడుగు కూర చాలా బాగుంది.": { "native": "The mushroom curry is very good.", "bases": { "పుట్టగొడుగు": "mushroom", "బాగుంది": "is good; tastes good" } }
      "పుట్టగొడుగు వేపుడు ఇవ్వండి.": { "native": "Please give the mushroom dry fry.", "bases": { "పుట్టగొడుగు": "mushroom" } }
  "te-6480":
    native: "cashew nut"
    notes:
      "n1": "Cashew nut, fried in ghee and added to rich curries like కుర్మా (kurmā). A rich, sweet nut."
    examples:
      "జీడిపప్పు కుర్మాలో వేస్తారు.": { "native": "They put cashew nuts in the korma.", "bases": { "జీడిపప్పు": "cashew nut", "వేస్తారు": "they put in" } }
      "జీడిపప్పు చాలా రుచిగా ఉంది.": { "native": "The cashew nut is very tasty.", "bases": { "జీడిపప్పు": "cashew nut", "ఉంది": "is; there is" } }
  "te-6481":
    native: "green chilli"
    notes:
      "n1": "Fresh green chilli, the heat in most Andhra cooking. Menus often call it మిర్చి (mirci)."
    examples:
      "పచ్చిమిర్చి ఘాటుగా ఉంది.": { "native": "The green chilli is hot.", "bases": { "పచ్చిమిర్చి": "green chilli", "ఘాటుగా": "strong; hot", "ఉంది": "is; there is" } }
      "పచ్చిమిర్చి పచ్చడి చాలా కారంగా ఉంది.": { "native": "The green chilli chutney is very hot.", "bases": { "పచ్చిమిర్చి": "green chilli", "ఉంది": "is; there is" } }
  "te-6482":
    native: "red chilli"
    notes:
      "n1": "Dried red chilli, ground into the powder (కారం, kāraṁ) for pickles and curries."
    examples:
      "పండుమిర్చి కారంగా ఉంటుంది.": { "native": "Red chilli is hot.", "bases": { "పండుమిర్చి": "red chilli", "ఉంటుంది": "is; tastes" } }
      "పండుమిర్చి పొడి వేయండి.": { "native": "Put in red chilli powder.", "bases": { "పండుమిర్చి": "red chilli", "పొడి": "powder", "వేయండి": "put in" } }
  "te-6483":
    native: "garlic chilli powder"
    notes:
      "n1": "A dry spice of chilli powder and garlic (వెల్లుల్లి, vellulli, te-0260), eaten with idli and dosa in Andhra and Telangana."
    examples:
      "వెల్లులికారం ఇడ్లీతో బాగుంటుంది.": { "native": "Garlic chilli powder is good with idli.", "bases": { "వెల్లులికారం": "garlic chilli powder", "బాగుంటుంది": "is good; tastes good" } }
      "వెల్లులికారం కొంచెం వేయండి.": { "native": "Put in a little garlic chilli powder.", "bases": { "వెల్లులికారం": "garlic chilli powder", "వేయండి": "put in" } }
  "te-6484":
    native: "black pepper spice"
    notes:
      "n1": "A dark pepper spice of the kind used in pepper chicken and pepper charu. Not yet checked by a speaker: the menu's exact sense needs confirming."
    examples:
      "నల్లకారం చారులో బాగుంటుంది.": { "native": "Black pepper spice is good in the charu.", "bases": { "నల్లకారం": "black pepper spice", "బాగుంటుంది": "is good; tastes good" } }
      "నల్లకారం కొంచెం వేయండి.": { "native": "Put in a little black pepper spice.", "bases": { "నల్లకారం": "black pepper spice", "వేయండి": "put in" } }
  "te-6485":
    native: "country chicken"
    notes:
      "n1": "A free-range country chicken, leaner and more flavourful than a broiler (బ్రాయిలర్). Priced higher in Hyderabad markets."
    examples:
      "నాటుకోడి కూర చాలా రుచిగా ఉంటుంది.": { "native": "Country chicken curry is very tasty.", "bases": { "నాటుకోడి": "country chicken", "ఉంటుంది": "is; tastes" } }
      "నాటుకోడి ధర ఎక్కువ.": { "native": "Country chicken costs more.", "bases": { "నాటుకోడి": "country chicken", "ధర": "price" } }
  "te-6486":
    native: "hen's egg"
    notes:
      "n1": "A hen's egg. The word గుడ్డు (guḍḍu, te-0264) is the general word for egg."
    examples:
      "కోడిగుడ్డు ఉడికించండి.": { "native": "Boil the egg.", "bases": { "కోడిగుడ్డు": "hen's egg", "ఉడికించండి": "cook" } }
      "కోడిగుడ్డు కూర బాగుంది.": { "native": "The egg curry is good.", "bases": { "కోడిగుడ్డు": "hen's egg", "బాగుంది": "is good; tastes good" } }
  "te-6487":
    native: "chicken wings"
    notes:
      "n1": "Chicken wings, a common starter in Hyderabad restaurants, often fried dry as రెక్కలు వేపుడు (rekkalu vēpuḍu). Menus also spell it 'rekulu'."
    examples:
      "రెక్కలు వేపుడు చాలా బాగుంది.": { "native": "The chicken wing fry is very good.", "bases": { "రెక్కలు": "chicken wings", "బాగుంది": "is good; tastes good" } }
      "నాకు రెక్కలు కావాలి.": { "native": "I'd like chicken wings.", "bases": { "రెక్కలు": "chicken wings" } }
  "te-6488":
    native: "meat"
    notes:
      "n1": "Meat in general. A dish of meat takes its name from the meat: గోంగూర మాంసం (gōṅgūra māṁsaṁ)."
    examples:
      "మాంసం తింటాను.": { "native": "I eat meat.", "bases": { "మాంసం": "meat", "తింటాను": "I eat" } }
      "మాంసం ధర ఎంత?": { "native": "What is the price of the meat?", "bases": { "మాంసం": "meat", "ధర": "price" } }
  "te-6489":
    native: "goat meat (Telangana)"
    notes:
      "n1": "In Telangana, వేట (vēṭa) meat is goat or mutton, from the old hunting tradition. Not yet checked by a speaker: confirm the menu's sense."
    examples:
      "వేటమాంసం కూర చాలా ఘాటుగా ఉంది.": { "native": "The goat-meat curry is very hot.", "bases": { "వేటమాంసం": "goat meat (Telangana)", "ఘాటుగా": "strong; hot", "ఉంది": "is; there is" } }
      "వేటమాంసం అంటే మేక మాంసం.": { "native": "Vetamamsam means goat meat.", "bases": { "వేటమాంసం": "goat meat (Telangana)", "అంటే": "means", "మేక": "goat", "మాంసం": "meat" } }
  "te-6490":
    native: "goat meat (Telangana)"
    notes:
      "n1": "The same Telangana word for goat or mutton as వేటమాంసం (vēṭamāṁsaṁ). Not yet checked by a speaker: confirm the menu's sense."
    examples:
      "యాటమాంసం అన్నంతో బాగుంటుంది.": { "native": "Goat meat is good with rice.", "bases": { "యాటమాంసం": "goat meat (Telangana)", "బాగుంటుంది": "is good; tastes good" } }
      "నాకు యాటమాంసం కావాలి.": { "native": "I'd like goat meat.", "bases": { "యాటమాంసం": "goat meat (Telangana)" } }
  "te-6491":
    native: "murrel fish"
    notes:
      "n1": "Murrel, a firm freshwater fish of the Godavari and Krishna, the classic fish for చేపల పులుసు (cēpala pulusu)."
    examples:
      "కొరమీను పులుసు చాలా బాగుంటుంది.": { "native": "Murrel pulusu is very good.", "bases": { "కొరమీను": "murrel fish", "బాగుంటుంది": "is good; tastes good" } }
      "కొరమీను వేపుడు ఇవ్వండి.": { "native": "Please give the murrel dry fry.", "bases": { "కొరమీను": "murrel fish" } }
  "te-6492":
    native: "crab"
    notes:
      "n1": "Crab, a coastal Andhra dish: పీతల వేపుడు (pītala vēpuḍu), crab dry fry, and పీతల పులుసు (pītala pulusu)."
    examples:
      "పీతలు చాలా రుచిగా ఉన్నాయి.": { "native": "The crabs are very tasty.", "bases": { "పీతలు": "crab", "ఉన్నాయి": "are" } }
      "పీతల వేపుడు ఇవ్వండి.": { "native": "Please give the crab dry fry.", "bases": { "పీతల": "crabs" } }
  "te-6493":
    native: "prawns"
    notes:
      "n1": "Prawns, the favourite of coastal Andhra, fried or cooked in a pulusu or a curry."
    examples:
      "రొయ్యలు వేపుడు చాలా బాగుంది.": { "native": "The prawn fry is very good.", "bases": { "రొయ్యలు": "prawns", "బాగుంది": "is good; tastes good" } }
      "నాకు రొయ్యలు కావాలి.": { "native": "I'd like prawns.", "bases": { "రొయ్యలు": "prawns" } }
  "te-6494":
    native: "small prawns"
    notes:
      "n1": "Small prawns, fresh or dried, cooked as a fry or a chutney. చిట్టి (ciṭṭi) means small."
    examples:
      "చిట్టి రొయ్యల పచ్చడి చాలా కారంగా ఉంటుంది.": { "native": "Small-prawn chutney is very hot.", "bases": { "చిట్టి": "small", "రొయ్యల": "prawns", "ఉంటుంది": "is; tastes" } }
      "నాకు చిట్టి రొయ్యలు కావాలి.": { "native": "I'd like small prawns.", "bases": { "చిట్టి": "small", "రొయ్యలు": "prawns" } }
    bases:
      "చిట్టి": "small"
      "రొయ్యలు": "prawns"
  "te-6495":
    native: "amaranth greens"
    notes:
      "n1": "Amaranth leaves, cooked as a dal or a fry. A common village green."
    examples:
      "తోటకూర పప్పు బాగుంటుంది.": { "native": "Amaranth dal is good.", "bases": { "తోటకూర": "amaranth greens", "బాగుంటుంది": "is good; tastes good" } }
      "తోటకూర వేపుడు చేయండి.": { "native": "Make an amaranth dry fry.", "bases": { "తోటకూర": "amaranth greens", "చేయండి": "do; make" } }
  "te-6496":
    native: "sorrel leaves"
    notes:
      "n1": "Sorrel (roselle) leaves, the sour green of Andhra and Telangana, used in a chutney and with mutton. Its sourness comes from the leaves, not tamarind."
    examples:
      "గోంగూర పులుపుగా ఉంటుంది.": { "native": "Gongura is sour.", "bases": { "గోంగూర": "sorrel leaves", "ఉంటుంది": "is; tastes" } }
      "గోంగూర పచ్చడి ఇష్టం.": { "native": "I like gongura chutney.", "bases": { "గోంగూర": "sorrel leaves" } }
  "te-6497":
    native: "brinjal; aubergine"
    notes:
      "n1": "Brinjal, the common purple vegetable. Its stuffed form is గుత్తివంకాయ (gutti vaṅkāya)."
    examples:
      "వంకాయ కూర చాలా బాగుంది.": { "native": "The brinjal curry is very good.", "bases": { "వంకాయ": "brinjal; aubergine", "బాగుంది": "is good; tastes good" } }
      "వంకాయ వేపుడు ఇష్టం.": { "native": "I like brinjal dry fry.", "bases": { "వంకాయ": "brinjal; aubergine" } }
  "te-6498":
    native: "stuffed brinjal"
    notes:
      "n1": "Small brinjals stuffed with a paste of peanut, chilli and spices and cooked whole in a curry. గుత్తి (gutti) means 'stuffed' or 'bunch'."
    examples:
      "గుత్తివంకాయ కూర చాలా ఘాటుగా ఉంది.": { "native": "The stuffed brinjal curry is very hot.", "bases": { "గుత్తివంకాయ": "stuffed brinjal", "ఘాటుగా": "strong; hot", "ఉంది": "is; there is" } }
      "గుత్తివంకాయ చాలా బాగుంది.": { "native": "The stuffed brinjal is very good.", "bases": { "గుత్తివంకాయ": "stuffed brinjal", "బాగుంది": "is good; tastes good" } }
  "te-6499":
    native: "coriander leaves"
    notes:
      "n1": "Fresh coriander leaves, used as a garnish and in chutney."
    examples:
      "కొత్తిమీర పైన వేయండి.": { "native": "Put the coriander on top.", "bases": { "కొత్తిమీర": "coriander leaves", "పైన": "on top", "వేయండి": "put in" } }
      "కొత్తిమీర చట్నీ ఇవ్వండి.": { "native": "Please give coriander chutney.", "bases": { "కొత్తిమీర": "coriander leaves", "చట్నీ": "chutney" } }
  "te-6500":
    native: "finger millet"
    notes:
      "n1": "Finger millet, a grain for ragi mudda, ragi dosa and ragi sangati."
    examples:
      "రాగి ముద్ద ఆరోగ్యానికి మంచిది.": { "native": "Ragi mudda is good for health.", "bases": { "రాగి": "finger millet", "ముద్ద": "ball; mash", "ఆరోగ్యానికి": "for health", "మంచిది": "good" } }
      "రాగి దోశ చేయండి.": { "native": "Make a ragi dosa.", "bases": { "రాగి": "finger millet", "చేయండి": "do; make" } }
  "te-6501":
    native: "jaggery"
    notes:
      "n1": "Jaggery, the unrefined sugar of Telugu kitchens, used in sweets like పాయసం (pāyasaṁ) and in pulusu."
    examples:
