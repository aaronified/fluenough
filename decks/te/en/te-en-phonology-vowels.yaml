schema: 1
id: "te-en-phonology-vowels"
kind: "layer"
core: "te-phonology-vowels"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Telugu vowel sounds (IPA)"
description: "The vowels and diphthongs of Telugu, one card each: the IPA symbol, the letter, example words and, where this course's words give one, a minimal pair. For learners who know the IPA or want to learn it. Variety taught: standard (Coastal Andhra) colloquial Telugu. This is a proposal, not yet confirmed by the owner, a Telugu speaker or a phonetician. Where a source describes another dialect, the card says so."
license: "CC-BY-SA-4.0"
authors:
  - { name: "Fluenough contributors" }
  - { name: "Wikipedia contributors (Telugu language; Help:IPA/Telugu)", url: "https://en.wikipedia.org/wiki/Telugu_language" }
source: "Bhaskararao and Ray (2017), 'Illustrations of the IPA: Telugu', Journal of the International Phonetic Association 47(2): 231-241, doi 10.1017/S0025100316000207 (named in Wikipedia's references; the article itself was not read); Krishnamurti (2003), The Dravidian Languages, Cambridge University Press, and Lisker and Krishnamurti (1991), Proceedings of the XIIth International Congress of Phonetic Sciences 2: 90-93 (both as cited by Wikipedia). Text adapted from Wikipedia, 'Telugu language' (section Phonology) and 'Help:IPA/Telugu', CC BY-SA 4.0, https://en.wikipedia.org/wiki/Telugu_language"
tags: ["ipa", "phonology", "unreviewed"]
cards:
  "te-6605":
    native: "short close front vowel (i); the letter ఇ (i)"
    notes:
      "n1": "The i of 'dill' in Wikipedia's comparison. Short vowels occur in every position of a word. Telugu vowels contrast in length: see the long iː."
      "n2": "Minimal pair among this course's words: {1}, which one, and {2}, nothing; none, differ only in the length of the last vowel, i against iː. Both words end in a vowel; the source says native words do not end in a long vowel, so this pair and that statement need a Telugu speaker's check."
    examples:
      "ఇల్లు": "home; house"
      "ఇక్కడ": "here"
  "te-6606":
    native: "long close front vowel (iː); the letter ఈ (ī)"
    notes:
      "n1": "The ee of 'feet' in Wikipedia's comparison, held longer than i. Long vowels occur in any position, but the source says native Telugu words do not end in a long vowel."
    examples:
      "ఈగ": "fly"
      "నీరు": "water"
  "te-6607":
    native: "short close back vowel (u); the letter ఉ (u)"
    notes:
      "n1": "The oo of 'foot' in Wikipedia's comparison. A final u is common in Telugu words and is kept in readings, as in పండు (paṇḍu)."
    examples:
      "ఉప్పు": "salt"
      "తలుపు": "door"
  "te-6608":
    native: "long close back vowel (uː); the letter ఊ (ū)"
    notes:
      "n1": "The oo of 'cool' in Wikipedia's comparison, held longer than u."
      "n2": "Minimal pair among this course's words: {1}, day, and {2}, every day, differ only in the length of the last vowel, u against uː. Both words end in a vowel; the source says native words do not end in a long vowel, so this pair and that statement need a Telugu speaker's check."
    examples:
      "ఊరు": "town; home town"
      "ఊహ": "imagination; guess"
  "te-6609":
    native: "short mid front vowel (e); the letter ఎ (e)"
    notes:
      "n1": "The e of 'yell' in Wikipedia's comparison. The JIPA-based table writes plain e; Wikipedia's IPA help page writes the slightly lowered e̞."
      "n2": "Minimal pair among this course's words: {1}, neck, and {2}, upper floor; a building with floors, differ only in the length of the vowel, e against eː."
    examples:
      "ఎలుక": "rat; mouse"
      "ఎక్కడ": "where"
  "te-6610":
    native: "long mid front vowel (eː); the letter ఏ (ē)"
    notes:
      "n1": "The a of 'Yale' in Wikipedia's comparison, held longer than e."
      "n2": "Minimal pair among this course's words: {1}, month, and {2}, ground; soil; land, differ only in the length of the vowel, e against eː."
    examples:
      "ఏనుగు": "elephant"
      "నేను": "I"
  "te-6611":
    native: "short open central vowel (a); the letter అ (a)"
    notes:
      "n1": "Like the u of 'cut' in Wikipedia's comparison. The JIPA-based table writes a, or ɐ; this course writes a, as its other Telugu cards do."
      "n2": "Minimal pair among this course's words: {1}, many; several, and {2}, milk, differ only in the length of the vowel, a against aː."
    examples:
      "అడవి": "forest"
      "అన్ని": "all (of the things)"
  "te-6612":
    native: "long open central vowel (aː); the letter ఆ (ā)"
    notes:
      "n1": "The a of 'father' in Wikipedia's comparison, held longer than a."
      "n2": "Minimal pair among this course's words: {1}, to sing, and {2}, to fall; to take (time), differ only in the length of the vowel, aː against a."
    examples:
      "ఆకు": "leaf"
      "ఆట": "game; play"
  "te-6613":
    native: "short mid back vowel (o); the letter ఒ (o)"
    notes:
      "n1": "The o of 'story' (short) in Wikipedia's comparison. The source says short o is the one short vowel that does not occur at the end of a word. The JIPA-based table writes plain o; Wikipedia's IPA help page writes the slightly lowered o̞. None of this course's words forms a length pair with this vowel, so there is no minimal pair here."
    examples:
      "ఒక్క": "just one; a single"
      "ఒకటి": "1, one"
  "te-6614":
    native: "long mid back vowel (oː); the letter ఓ (ō)"
    notes:
      "n1": "The o of 'story' (long) in Wikipedia's comparison."
    examples:
      "ఓడ": "ship"
      "గోరు": "nail (of a finger or toe)"
  "te-6615":
    native: "the diphthong ai (ai); the letter ఐ (ai)"
    notes:
      "n1": "Telugu has two diphthongs, ai and au. Wikipedia's IPA help page writes ai as aɪ̯ and compares it to the i of 'kite'."
      "n2": "Minimal pair among this course's words: {1}, medical treatment; medical care, and {2}, musical instrument, differ only in the vowel, ai against aː."
    examples:
      "ఐదు": "5, five"
      "జైలు": "prison; jail"
  "te-6616":
    native: "the diphthong au (au); the letter ఔ (au)"
    notes:
      "n1": "The second Telugu diphthong. Wikipedia's IPA help page writes au as aʊ̯ and compares it to the ou of 'house'. The only word of this course's cards written with it is a loan, మౌస్ (maus), computer mouse."
    examples:
      "మౌస్": "computer mouse"
  "te-6617":
    native: "long open front vowel (æː), in loanwords"
    notes:
      "n1": "In most dialects æː occurs only in loanwords, and only long. In the Guntur dialect it is also a frequent variant of aː in certain past-tense verbs. The source does not name which loans have it, so this card has no example sounds; this course's cards write English loans such as ఫ్యాన్ (fyān, fan) and బ్యాగ్ (byāg, bag) with the sign ా (ā) after య్ (y), and their IPA there is the course's own."
