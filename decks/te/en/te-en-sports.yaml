        "native": "What is the score now?"
      "ఆటగాళ్లు స్కోరు పెంచారు.":
        "native": "The players raised the score."
        "bases":
          "ఆటగాళ్లు":
            "meaning": "player"
          "పెంచారు":
            "meaning": "to increase"
  "te-5407":
