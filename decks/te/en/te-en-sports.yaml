        "bases":
          "కొన్నాడు":
            "meaning": "to buy"
  "te-5402":
    "native": "wicket; a dismissal in cricket"
    "notes":
      "n1": "The wicket is the set of three stumps, and a batter who is out has lost a wicket."
    "examples":
      "మూడు వికెట్లు పడ్డాయి.":
        "native": "Three wickets have fallen."
        "bases":
          "వికెట్లు":
            "meaning": "wicket"
          "పడ్డాయి":
            "meaning": "to fall"
      "బౌలర్ ఒక వికెట్ తీశాడు.":
        "native": "The bowler took a wicket."
        "bases":
          "తీశాడు":
            "meaning": "to take"
  "te-5403":
    "native": "batting"
    "notes":
      "n1": "To bat is బ్యాటింగ్ చేయడం (byāṭiṅg cēyaḍaṁ), with the verb చేయడం, to do."
    "examples":
      "అతని బ్యాటింగ్ చాలా బాగుంది.":
        "native": "His batting is very good."
        "bases":
          "అతని":
            "meaning": "his"
          "బాగుంది":
            "meaning": "good"
      "తరువాత మా జట్టు బ్యాటింగ్ చేసింది.":
        "native": "After that our team batted."
        "bases":
          "మా":
            "meaning": "our"
          "చేసింది":
            "meaning": "to do"
