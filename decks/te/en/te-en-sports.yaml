"cards":
  "te-5400":
    "native": "cricket"
    "notes":
      "n1": "A word from English, said with the English sound; the game of bat and ball."
    "examples":
      "మా ఊరిలో పిల్లలు ప్రతి సాయంత్రం క్రికెట్ ఆడతారు.":
        "native": "The children in our village play cricket every evening."
        "bases":
          "ఊరిలో":
            "meaning": "village"
          "పిల్లలు":
            "meaning": "child"
          "మా":
            "meaning": "we"
          "ఆడతారు":
            "meaning": "to play"
      "నాకు క్రికెట్ చూడటం ఇష్టం.":
        "native": "I like watching cricket."
        "bases":
          "నాకు":
            "meaning": "I"
          "చూడటం":
            "meaning": "to watch"
    wiktionary: true
  "te-5401":
    "native": "bat (cricket)"
    "notes":
      "n1": "The cricket bat, said as in English."
    "examples":
      "ఆ బ్యాట్ పాతది.":
        "native": "That bat is old."
        "bases":
          "పాతది":
            "meaning": "old"
      "అతను కొత్త బ్యాట్ కొన్నాడు.":
