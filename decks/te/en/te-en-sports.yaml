        "native": "I am learning bowling."
        "bases":
          "నేర్చుకుంటున్నాను":
            "meaning": "to learn"
    wiktionary: true
  "te-5405":
    "native": "six (in cricket)"
    "notes":
      "n1": "A six is a hit that clears the boundary without touching the ground."
    "examples":
      "చివరి బంతికి సిక్సర్ కొట్టాడు.":
        "native": "He hit a six off the last ball."
        "bases":
          "బంతికి":
            "meaning": "ball"
          "కొట్టాడు":
            "meaning": "to hit"
      "ప్రేక్షకులు సిక్సర్ చూసి కేకలు వేశారు.":
        "native": "The spectators saw the six and cheered."
        "bases":
          "చూసి":
            "meaning": "to watch"
          "వేశారు":
            "meaning": "to do"
    wiktionary: true
  "te-5406":
    "native": "score"
    "notes":
      "n1": "Said as in English; the points of a match."
    "examples":
