  entries:
    "cheeyadam": "to do"
    "velladam": "to go"
    "raavadam": "to come"
    "tinadam": "to eat"
  notes: "The past continuous takes the -తూ (-tū) form of the verb, then ఉండు (uṇḍu, to be) in the same forms as the perfect: అప్పుడు నేను తింటూ ఉన్నాను (appuḍu nēnu tiṇṭū unnānu), I was eating then. The time word అప్పుడు (appuḍu), then, makes the sentence past; without a time word the same words can also read as the present, so a past sentence names its time. The present continuous uses -తున్నాను (-tunnānu) instead. The stem changes in చేస్తూ (cēstū) from చేయడం (cēyaḍaṁ), in వస్తూ (vastū) from రావడం (rāvaḍaṁ) and in తింటూ (tiṇṭū) from తినడం (tinaḍaṁ); వెళ్ళడం (veḷḷaḍaṁ) becomes వెళ్తూ (veḷtū)."
