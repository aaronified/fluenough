cards:
  "te-0340":
    native: "meal; food"
    notes:
      "n1": "భోజనం చేశారా (bhōjanam cēśārā)? Have you eaten? It is often asked as a greeting."
  "te-0341":
    native: "water"
    notes:
      "n1": "Plural in grammar: నీళ్ళు కావాలి (nīḷḷu kāvāli)."
  "te-0342":
    native: "tea"
    notes:
      "n1": "In Telangana also చాయ్ (cāy)."
  "te-0343":
    native: "coffee"
  "te-0344":
    native: "cooked rice; a meal"
  "te-0345":
    native: "I'd like …; I need …"
    notes:
      "n1": "'To me … is needed': నాకు నీళ్ళు కావాలి (nāku nīḷḷu kāvāli), I'd like some water."
  "te-0346":
    native: "more; still"
    notes:
      "n1": "ఇంకా కొంచెం (iṅkā koñcem), a little more."
  "te-0347":
    native: "spicy heat; chilli powder"
    notes:
      "n1": "కారం తక్కువ (kāram takkuva), less spicy. Andhra food is known for its heat."
  "te-0348":
    native: "sweet"
  "te-0349":
    native: "vegetarian food"
    notes:
      "n1": "Menus say 'veg' and 'non-veg'."
  "te-0350":
    native: "The bill, please."
    bases:
      "బిల్లు": "bill"
  "te-0351":
    native: "It's very good."
    bases:
      "బాగుంది": "good; well"
