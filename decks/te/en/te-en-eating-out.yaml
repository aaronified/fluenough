id: "te-en-eating-out"
kind: "layer"
core: "te-eating-out"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Eating out"
description: "Ordering, asking for less spice, and paying the bill. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0340":
    native: "meal; food"
    notes:
      "n1": "భోజనం చేశారా (bhōjanam cēśārā)? Have you eaten? It is often asked as a greeting."
  "te-0341":
    native: "water"
    notes:
      "n1": "Plural in grammar: నీళ్ళు కావాలి (nīḷḷu kāvāli)."
    "examples": {
      "నీళ్ళు తాగండి.": {"native": "Drink some water.", "bases": {"నీళ్ళు": "water"}},
      "నీళ్ళు తాగు.": {"native": "Drink water.", "bases": {"నీళ్ళు": "water"}}
    }
  "te-0342":
    native: "tea"
    alt_native: ["chai"]
    notes:
      "n1": "In Telangana also చాయ్ (cāy)."
    "examples": {
      "టీ తాగు.": {"native": "Drink tea.", "bases": {"టీ": "tea"}}
    }
  "te-0343":
    native: "coffee"
    "examples": {
      "మీరు కాఫీ తాగుతారా?": {"native": "Will you have coffee?", "bases": {}}
    }
  "te-0344":
    native: "cooked rice; a meal"
    "examples": {
      "నేను అన్నం ఉడికిస్తాను.": {"native": "I cook the rice.", "bases": {}},
      "పళ్ళెంలో అన్నం ఉంది.": {"native": "There is rice on the plate.", "bases": {}}
    }
  "te-0345":
    native: "I'd like …; I need …"
    alt_native: ["I want …"]
    notes:
      "n1": "'To me … is needed': నాకు నీళ్ళు కావాలి (nāku nīḷḷu kāvāli), I'd like some water."
  "te-0346":
    native: "more; still"
    notes:
      "n1": "ఇంకా కొంచెం (iṅkā koñcem), a little more."
    "examples": {
      "ఇంకా కొంచెం కావాలా?": {"native": "Do you want a little more?", "bases": {}}
    }
  "te-0347":
    native: "spicy heat; chilli powder"
    alt_native: ["chili powder"]
    notes:
      "n1": "కారం తక్కువ (kāram takkuva), less spicy. Andhra food is known for its heat."
  "te-0348":
    native: "sweet"
    "examples": {
      "ఈ పండు తీపిగా ఉంది.": {"native": "This fruit is sweet.", "bases": {"తీపిగా": "sweet"}}
    }
  "te-0349":
    native: "vegetarian food"
    alt_native: ["veg food"]
    notes:
      "n1": "Menus say 'veg' and 'non-veg'."
  "te-0350":
    native: "The bill, please."
    alt_native: ["Check, please."]
    bases:
      "బిల్లు": "bill"
  "te-0351":
    native: "It's very good."
    bases:
      "బాగుంది": "good; well"
