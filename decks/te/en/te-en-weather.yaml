      }
    },
    "te-1129": {
      "native": "sun",
      "examples": {
        "ఉదయం సూర్యుడు ఉదయించాడు.": {
          "native": "In the morning the sun rose.",
          "bases": {
            "ఉదయించాడు": {
              "meaning": "to rise"
            },
            "ఉదయం": {
              "meaning": "morning"
            }
          }
        },
        "సూర్యుడు మేఘాల వెనుక దాక్కున్నాడు.": {
          "native": "The sun hid behind the clouds.",
          "bases": {
            "మేఘాల": {
              "meaning": "cloud"
            },
            "దాక్కున్నాడు": {
              "meaning": "to hide"
