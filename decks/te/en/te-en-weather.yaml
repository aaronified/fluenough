  "cards": {
    "te-1113": {
      "native": "weather",
      "examples": {
        "ఈ రోజు వాతావరణం బాగుంది.": {
          "native": "The weather is good today.",
          "bases": {
            "బాగుంది": {
              "meaning": "good"
            },
            "ఈ": {
              "meaning": "this"
            },
            "రోజు": {
              "meaning": "day"
            }
          }
        },
        "రేపటి వాతావరణం ఎలా ఉంటుంది?": {
          "native": "What will tomorrow's weather be like?",
          "bases": {
            "ఉంటుంది": {
              "meaning": "to be"
            },
            "రేపటి": {
              "meaning": "tomorrow"
            }
          }
        }
      },
      "notes": {
        "n1": "Used for the weather of a day or a place, as in ఈ రోజు వాతావరణం (ī rōju vātāvaraṇaṁ, today's weather)."
      }
    },
    "te-1114": {
      "native": "sky",
      "examples": {
        "ఆకాశంలో మేఘాలు ఉన్నాయి.": {
          "native": "There are clouds in the sky.",
          "bases": {
            "ఉన్నాయి": {
              "meaning": "to be"
            },
            "ఆకాశంలో": {
              "meaning": "sky"
            },
            "మేఘాలు": {
              "meaning": "cloud"
            }
          }
        },
        "ఈ రోజు ఆకాశం నీలంగా ఉంది.": {
          "native": "The sky is blue today.",
          "bases": {
            "నీలంగా": {
              "meaning": "blue"
            },
            "ఉంది": {
              "meaning": "to be"
            },
            "ఈ": {
              "meaning": "this"
            },
            "రోజు": {
              "meaning": "day"
            }
          }
        }
      },
      "notes": {
        "n1": "In ఆకాశంలో (ākāśaṁlō, in the sky) the stem stays ఆకాశం before the ending -లో (-lō)."
      }
    },
    "te-1115": {
      "native": "cloud",
      "examples": {
        "ఆకాశంలో ఒక మేఘం ఉంది.": {
          "native": "There is one cloud in the sky.",
          "bases": {
            "ఉంది": {
              "meaning": "to be"
            },
            "ఆకాశంలో": {
              "meaning": "sky"
            },
            "ఒక": {
              "meaning": "one"
            }
          }
        },
        "మేఘం కదులుతోంది.": {
          "native": "The cloud is moving.",
          "bases": {
            "కదులుతోంది": {
              "meaning": "to move"
            }
          }
        }
      },
      "notes": {
        "n1": "The plural is మేఘాలు (mēghālu, clouds). The singular is used with ఒక (oka, one)."
      }
    },
    "te-1116": {
      "native": "rain",
      "examples": {
        "ఈ రోజు వర్షం పడుతోంది.": {
          "native": "It is raining today.",
          "bases": {
            "పడుతోంది": {
              "meaning": "to fall"
            },
            "ఈ": {
              "meaning": "this"
            },
            "రోజు": {
              "meaning": "day"
            }
          }
        },
        "వర్షం వల్ల రోడ్డు తడిగా ఉంది.": {
          "native": "Because of the rain, the road is wet.",
          "bases": {
            "తడిగా": {
              "meaning": "wet"
            },
            "ఉంది": {
              "meaning": "to be"
            },
            "వల్ల": {
              "meaning": "because of"
            },
            "రోడ్డు": {
              "meaning": "road"
            }
          }
        }
      },
      "notes": {
        "n1": "For the rain falling, say పడుతోంది (paḍutōṁdi, is falling). For a heavy pour, the verb is కురుస్తుంది (kurustuṁdi)."
      }
    },
    "te-1117": {
      "native": "sunshine; the sun's heat",
      "examples": {
        "ఈ రోజు ఎండ చాలా ఎక్కువగా ఉంది.": {
          "native": "Today the sun is very strong.",
          "bases": {
            "ఎక్కువగా": {
              "meaning": "more; much"
            },
            "ఉంది": {
              "meaning": "to be"
            },
            "ఈ": {
              "meaning": "this"
            },
            "రోజు": {
              "meaning": "day"
            },
            "చాలా": {
              "meaning": "very"
            }
          }
        },
        "ఎండలో నడవకు.": {
          "native": "Don't walk in the sun.",
          "bases": {
            "నడవకు": {
              "meaning": "to walk"
            },
            "ఎండలో": {
              "meaning": "sunshine"
            }
          }
        }
      },
      "notes": {
        "n1": "In ఎండలో (eṇḍalō, in the sun) the stem stays ఎండ before the ending -లో (-lō)."
      }
    },
    "te-1118": {
      "native": "wind; air",
      "examples": {
        "గాలి బలంగా వీస్తోంది.": {
          "native": "The wind is blowing strongly.",
          "bases": {
            "బలంగా": {
              "meaning": "strength"
            },
            "వీస్తోంది": {
              "meaning": "to blow"
            }
          }
        },
        "కిటికీ నుంచి చల్లని గాలి వస్తోంది.": {
          "native": "A cool breeze is coming through the window.",
          "bases": {
            "వస్తోంది": {
              "meaning": "to come"
            },
            "కిటికీ": {
              "meaning": "window"
            },
            "నుంచి": {
              "meaning": "from"
            }
          }
        }
      },
      "notes": {
        "n1": "గాలి (gāli) means both the wind and the air; in weather talk it is the wind."
      }
    },
    "te-1121": {
      "native": "dew; frost; snow",
      "examples": {
        "ఉదయం గడ్డి మీద మంచు ఉంది.": {
          "native": "There is dew on the grass in the morning.",
          "bases": {
            "ఉంది": {
              "meaning": "to be"
            },
            "ఉదయం": {
              "meaning": "morning"
            },
            "గడ్డి": {
              "meaning": "grass"
            },
            "మీద": {
              "meaning": "on"
            }
          }
        },
        "చలికాలంలో మంచు పడుతుంది.": {
          "native": "In winter, frost falls.",
          "bases": {
            "చలికాలంలో": {
              "meaning": "winter"
            },
            "పడుతుంది": {
              "meaning": "to fall"
            }
          }
        }
      },
      "notes": {
        "n1": "మంచు (mañcu) is dew in the morning, and frost or snow in winter."
      }
    },
    "te-1122": {
      "native": "storm",
      "examples": {
        "తీరానికి ఒక తుఫాను వస్తోంది.": {
          "native": "A storm is coming to the coast.",
          "bases": {
            "తీరానికి": {
              "meaning": "coast"
            },
            "వస్తోంది": {
              "meaning": "to come"
            },
            "ఒక": {
              "meaning": "one"
            }
          }
        },
        "తుఫాను వల్ల బస్సులు ఆగిపోయాయి.": {
          "native": "Buses stopped because of the storm.",
          "bases": {
            "బస్సులు": {
              "meaning": "bus"
            },
            "ఆగిపోయాయి": {
              "meaning": "to stop"
            },
            "వల్ల": {
              "meaning": "because of"
            }
          }
        }
      },
      "notes": {
        "n1": "తుఫాను (tuphānu) is a big storm, often a cyclone at the coast."
      }
    },
    "te-1123": {
      "native": "lightning",
      "examples": {
        "ఆకాశంలో మెరుపు మెరిసింది.": {
          "native": "Lightning flashed in the sky.",
          "bases": {
            "మెరిసింది": {
              "meaning": "to flash"
            },
            "ఆకాశంలో": {
              "meaning": "sky"
            }
          }
        },
        "మెరుపు తర్వాత ఉరుము వినిపించింది.": {
          "native": "After the lightning, thunder was heard.",
          "bases": {
            "వినిపించింది": {
              "meaning": "to be heard"
            },
            "తర్వాత": {
              "meaning": "after"
            }
          }
        }
      },
      "notes": {
        "n1": "The flash of light is మెరుపు (merupu). The thunder that follows it is ఉరుము (urumu)."
      }
    },
    "te-1124": {
      "native": "thunder",
      "examples": {
        "దూరంగా ఉరుము వినిపిస్తోంది.": {
          "native": "Thunder is heard in the distance.",
          "bases": {
            "దూరంగా": {
              "meaning": "distance"
            },
            "వినిపిస్తోంది": {
              "meaning": "to be heard"
            }
          }
        },
        "ఉరుములతో కూడిన వర్షం.": {
          "native": "Rain with thunder.",
          "bases": {
            "ఉరుములతో": {
              "meaning": "thunder"
            },
            "కూడిన": {
              "meaning": "to join"
            }
          }
        }
      },
      "notes": {
        "n1": "The thunder is ఉరుము (urumu). In the plural ఉరుములు (urumulu) it means several claps."
      }
    },
    "te-1125": {
      "native": "rainy season; monsoon",
      "examples": {
        "వర్షాకాలంలో ఎక్కువ వర్షం వస్తుంది.": {
          "native": "In the rainy season a lot of rain comes.",
          "bases": {
            "వస్తుంది": {
              "meaning": "to come"
            },
            "వర్షాకాలంలో": {
              "meaning": "rainy season"
            },
            "ఎక్కువ": {
              "meaning": "more; much"
            }
          }
        },
        "వర్షాకాలంలో గొడుగు తీసుకో.": {
          "native": "Take an umbrella in the rainy season.",
          "bases": {
            "తీసుకో": {
              "meaning": "to take"
