"schema": 1
"id": "te-en-cooking"
"kind": "layer"
"core": "te-cooking"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Cooking"
"description": "Pots, pans and the stove, the things you add to a dish, and the verbs for cooking it. Not yet checked by a Telugu speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "te-1600":
    "native": "stove, hearth"
    "notes":
      "n1": "The stove or hearth. Cooking gas is గ్యాస్ (gyās)."
    "examples":
      "పొయ్యి మీద కూర ఉంది.":
        "native": "There is curry on the stove."
        "bases":
          "ఉంది":
            "meaning": "there is"
      "పొయ్యి ఆర్పండి.":
        "native": "Turn off the stove."
        "bases":
          "ఆర్పండి":
            "meaning": "put out, turn off"
    wiktionary: true
  "te-1601":
    "native": "gas (for cooking)"
    "notes":
      "n1": "The cooking gas from a cylinder. The stove itself is పొయ్యి (poyyi)."
    "examples":
      "గ్యాస్ అయిపోయింది.":
        "native": "We have run out of gas."
        "bases":
          "అయిపోయింది":
            "meaning": "ran out"
      "గ్యాస్ ఆన్ చేయండి.":
        "native": "Turn the gas on."
        "bases":
          "చేయండి":
            "meaning": "do, switch"
  "te-1602":
    "native": "pressure cooker"
    "notes":
      "n1": "A pressure cooker, which whistles when the food is ready to be checked."
    "examples":
      "కుక్కర్‌లో అన్నం పెట్టాను.":
        "native": "I put the rice in the cooker."
        "bases":
          "కుక్కర్‌లో":
            "meaning": "in the cooker"
          "పెట్టాను":
            "meaning": "put"
      "కుక్కర్ విజిల్ వచ్చింది.":
        "native": "The cooker has whistled."
        "bases":
          "వచ్చింది":
            "meaning": "came"
          "విజిల్":
            "meaning": "whistle"
  "te-1603":
    "native": "frying pan, wok"
    "notes":
      "n1": "A round pan for frying and stir-frying. A flat griddle is పెనం (penaṁ)."
    "examples":
      "బాణలిలో నూనె పోయండి.":
        "native": "Pour oil into the pan."
        "bases":
          "బాణలిలో":
            "meaning": "in the pan"
          "పోయండి":
            "meaning": "pour"
      "బాణలి వేడిగా ఉంది.":
        "native": "The pan is hot."
        "bases":
          "వేడిగా":
            "meaning": "hot"
          "ఉంది":
            "meaning": "is"
  "te-1604":
    "native": "vessel, pot, utensil"
    "notes":
      "n1": "A general word for a cooking vessel. A clay pot is కుండ (kuṇḍa)."
    "examples":
      "పాత్రలో నీళ్ళు పోయండి.":
        "native": "Pour water into the vessel."
        "bases":
          "పాత్రలో":
            "meaning": "in the vessel"
          "పోయండి":
            "meaning": "pour"
      "ఈ పాత్ర పెద్దది.":
        "native": "This vessel is big."
        "bases":
          "పెద్దది":
            "meaning": "big"
    senses:
      "bowl": { native: "bowl, plate, vessel" }
      "role": { native: "role, character" }
    wiktionary: true
  "te-1605":
    "native": "clay pot"
    "notes":
      "n1": "A pot made of clay. It keeps water cool."
    "examples":
      "కుండలో నీళ్ళు ఉన్నాయి.":
        "native": "There is water in the pot."
        "bases":
          "కుండలో":
            "meaning": "in the pot"
          "ఉన్నాయి":
            "meaning": "there are"
      "మట్టి కుండ నీళ్ళను చల్లగా ఉంచుతుంది.":
        "native": "A clay pot keeps the water cool."
        "bases":
          "నీళ్ళను":
            "meaning": "the water"
          "చల్లగా":
            "meaning": "cool"
          "ఉంచుతుంది":
            "meaning": "keeps"
    senses:
      "earthen": { native: "an earthen pot; a pot" }
    wiktionary: true
  "te-1606":
    "native": "lid, cover"
    "notes":
      "n1": "The lid of a pot or pan."
    "examples":
      "మూత పెట్టండి.":
        "native": "Put the lid on."
        "bases":
          "పెట్టండి":
            "meaning": "put"
      "మూత తీయండి.":
        "native": "Take the lid off."
        "bases":
          "తీయండి":
            "meaning": "take, remove"
    senses:
      "closing": { native: "closing, covering" }
      "lid": { native: "a lid, cover" }
    wiktionary: true
  "te-1607":
    "native": "ladle, cooking spoon"
    "notes":
      "n1": "A long-handled spoon for stirring and serving. A small spoon is చెంచా (ceñcā)."
    "examples":
      "గరిటెతో కలపండి.":
        "native": "Stir it with the ladle."
        "bases":
          "గరిటెతో":
            "meaning": "with the ladle"
          "కలపండి":
            "meaning": "mix, stir"
      "గరిటె ఎక్కడ ఉంది?":
        "native": "Where is the ladle?"
        "bases":
          "ఉంది":
            "meaning": "is"
    senses:
      "spoon": { native: "spoon" }
      "ladle": { native: "ladle" }
      "spatula": { native: "spatula" }
    wiktionary: true
  "te-1608":
    "native": "mixer, blender"
    "notes":
      "n1": "An electric mixer or blender for grinding and mixing."
    "examples":
      "మిక్సీ ఆన్ చేయండి.":
        "native": "Switch the mixer on."
        "bases":
          "చేయండి":
            "meaning": "switch"
      "మిక్సీ పాడైంది.":
        "native": "The mixer is broken."
        "bases":
          "పాడైంది":
            "meaning": "broke, got spoiled"
  "te-1609":
    "native": "recipe"
    "notes":
      "n1": "A recipe: the steps for making a dish."
    "examples":
      "ఈ రెసిపీ సులభం.":
        "native": "This recipe is easy."
      "అమ్మ రెసిపీ చెప్పింది.":
        "native": "Mum told me the recipe."
        "bases":
          "చెప్పింది":
            "meaning": "told"
  "te-1611":
    "native": "tamarind"
    "notes":
      "n1": "Tamarind pulp makes a dish sour. It is soaked before use."
      "n2": "In the plural the stem changes: చింతపండ్లు (cintapaṇḍlu), tamarinds."
    "examples":
      "చింతపండు పులుపుగా ఉంది.":
        "native": "The tamarind is sour."
        "bases":
          "పులుపుగా":
            "meaning": "sour"
          "ఉంది":
            "meaning": "is"
      "చింతపండు నానబెట్టండి.":
        "native": "Soak the tamarind."
        "bases":
          "నానబెట్టండి":
            "meaning": "soak"
    wiktionary: true
  "te-1612":
    "native": "sugar"
    "notes":
      "n1": "Sugar, added to tea and sweets."
    "examples":
      "టీలో చక్కెర వేయండి.":
        "native": "Put sugar in the tea."
        "bases":
          "టీలో":
            "meaning": "in the tea"
          "వేయండి":
            "meaning": "put"
      "చక్కెర వద్దు.":
        "native": "No sugar."
    synonyms: { "sarkara": "sugar" }
    senses:
      "sugar": { native: "sugar" }
    wiktionary: true
  "te-1613":
    "native": "flour"
    "notes":
      "n1": "Flour. It also means powder and dough. In the plural the stem changes: పిండ్లు (piṇḍlu)."
    "examples":
      "గోధుమ పిండితో రొట్టె చేస్తాను.":
        "native": "I make bread with wheat flour."
        "bases":
          "పిండితో":
            "meaning": "with flour"
          "చేస్తాను":
            "meaning": "make"
      "పిండిని నీళ్ళతో కలపండి.":
        "native": "Mix the flour with water."
        "bases":
          "పిండిని":
            "meaning": "the flour"
          "కలపండి":
            "meaning": "mix"
    wiktionary: true
  "te-1614":
    "native": "piece, bit"
    "notes":
      "n1": "A piece or a bit of something. The plural is ముక్కలు (mukkalu)."
    "examples":
      "ఒక ముక్క అల్లం ఇవ్వండి.":
        "native": "Give me a piece of ginger."
        "bases":
          "ఇవ్వండి":
            "meaning": "give"
      "చిన్న ముక్కలుగా కోయండి.":
        "native": "Cut it into small pieces."
        "bases":
          "ముక్కలుగా":
            "meaning": "in pieces"
          "కోయండి":
            "meaning": "cut"
    synonyms: { "vrakka": "a piece, fragment, bit" }
    wiktionary: true
  "te-1615":
    "native": "rasam, a thin spiced soup"
    "notes":
      "n1": "A thin, tangy soup, eaten with rice."
    "examples":
      "అన్నంతో చారు తింటాను.":
        "native": "I eat rasam with rice."
        "bases":
          "అన్నంతో":
            "meaning": "with rice"
          "తింటాను":
            "meaning": "eat"
      "చారులో ఉప్పు ఎక్కువైంది.":
        "native": "There is too much salt in the rasam."
        "bases":
          "చారులో":
            "meaning": "in the rasam"
          "ఎక్కువైంది":
            "meaning": "became too much"
    wiktionary: true
  "te-1616":
    "native": "fire"
    "notes":
      "n1": "A fire or flame. Food is often cooked over it."
    "examples":
      "నిప్పు మీద వంట చేస్తారు.":
        "native": "They cook over the fire."
        "bases":
          "చేస్తారు":
            "meaning": "do, cook"
      "నిప్పు ఆర్పండి.":
        "native": "Put the fire out."
        "bases":
          "ఆర్పండి":
            "meaning": "put out"
    synonyms: { "ciccu": "flame, fire", "manta": "a blaze, flame, burning", "agni": "fire (also the god Agni)", "jvala": "flame, blaze" }
    senses:
      "fire": { native: "fire" }
      "ember": { native: "ember, cinder, live coal" }
    wiktionary: true
  "te-1617":
    "native": "cumin"
    "notes":
      "n1": "Cumin seed, often fried in oil at the start of a dish."
    "examples":
      "జీలకర్ర వేయించండి.":
        "native": "Fry the cumin."
        "bases":
          "వేయించండి":
            "meaning": "fry"
      "జీలకర్ర వాసన బాగుంది.":
        "native": "The cumin smells good."
        "bases":
          "బాగుంది":
            "meaning": "good"
          "వాసన":
            "meaning": "smell"
  "te-1619":
    "native": "curry leaves"
    "notes":
      "n1": "Fresh leaves put into curries for their flavour."
    "examples":
      "కూరలో కరివేపాకు వేయండి.":
        "native": "Add curry leaves to the curry."
        "bases":
          "కూరలో":
            "meaning": "in the curry"
          "వేయండి":
            "meaning": "add"
      "కరివేపాకు తాజాగా ఉంది.":
        "native": "The curry leaves are fresh."
        "bases":
          "తాజాగా":
            "meaning": "fresh"
          "ఉంది":
            "meaning": "are"
    wiktionary: true
  "te-1620":
    "native": "green chilli"
    "notes":
      "n1": "A fresh green chilli, hot. Red chilli powder is కారం (kāraṁ)."
    "examples":
      "పచ్చిమిర్చి ఘాటుగా ఉంది.":
        "native": "The green chilli is hot."
        "bases":
          "ఘాటుగా":
            "meaning": "hot, spicy"
          "ఉంది":
            "meaning": "is"
      "పచ్చిమిర్చి తక్కువ వేయండి.":
        "native": "Add less green chilli."
        "bases":
          "వేయండి":
            "meaning": "add"
  "te-1621":
    "native": "to boil"
    "notes":
      "n1": "The stem changes in the present and future: ఉడకబెడతాను (uḍakabeḍatānu), I boil. The command is ఉడకబెట్టండి (uḍakabeṭṭaṇḍi), boil."
    "examples":
      "నీళ్ళు ఉడకబెట్టండి.":
        "native": "Boil the water."
        "bases":
          "ఉడకబెట్టండి":
            "meaning": "boil"
      "గుడ్డు ఉడకబెట్టాను.":
        "native": "I boiled an egg."
        "bases":
          "ఉడకబెట్టాను":
            "meaning": "boiled"
  "te-1622":
    "native": "to fry"
    "notes":
      "n1": "The stem changes in the present and future: వేయిస్తాను (vēyistānu), I fry. The command is వేయించండి (vēyiñcaṇḍi), fry."
    "examples":
      "నూనెలో ఉల్లిపాయ వేయించండి.":
        "native": "Fry the onion in oil."
        "bases":
          "నూనెలో":
            "meaning": "in oil"
          "వేయించండి":
            "meaning": "fry"
      "వేయించిన గుడ్డు తింటాను.":
        "native": "I eat a fried egg."
        "bases":
          "వేయించిన":
            "meaning": "fried"
          "తింటాను":
            "meaning": "eat"
