schema: 1
id: "te-en-food-sentences"
kind: "layer"
core: "te-food-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Food and drink: sentences"
description: "Sentences about what you eat, drink and like, with the words of the food unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0716":
    notes:
      "n1": "The one who likes something is in the dative: నాకు (nāku), 'to me'; the thing liked, అరటిపండు (araṭipaṇḍu), stays plain."
    native: "I like bananas."
  "te-0717":
    notes:
      "n1": "The -tānu ending is the 'I' form for what you do regularly or will do, as in వెళ్తాను (veḷtānu), I go or I will go; తింటాను (tiṇṭānu) is that form of తినడం (tinaḍaṁ), to eat."
    native: "I eat idli in the morning."
    alt_native: ["I have idli in the morning."]
  "te-0718":
    native: "She eats curd every day."
    alt_native: ["She eats yogurt every day."]
  "te-0719":
    notes:
      "n1": "After ఒక (oka), one, the noun stays singular: గ్లాసు (glāsu), a glass, not a plural."
    native: "I need a glass of water."
    alt_native: ["I want a glass of water."]
  "te-0720":
    notes:
      "n1": "The question form of తాగుతారు (tāgutāru), 'you drink', is తాగుతారా (tāgutārā), do you drink?"
    native: "Will you have coffee?"
    alt_native: ["Would you like coffee?"]
  "te-0721":
    notes:
      "n1": "బాగుంది (bāgundi), good, is said with ఉంది (undi), as describing words are in the course, and చాలా (cālā), very, comes before it."
    native: "This curry is very good."
    alt_native: ["This curry is delicious."]
    bases:
      "బాగుంది": "good; well"
  "te-0722":
    notes:
      "n1": "A place takes లో (lō), 'in': పళ్ళెంలో (paḷḷeṁlō), in the plate."
    native: "There is rice on the plate."
  "te-0723":
    notes:
      "n1": "A place takes లో (lō), 'in': గిన్నెలో (ginnelō), in the bowl."
    native: "There is milk in the bowl."
  "te-0724":
    notes:
      "n1": "The one who needs takes the -ku ending: నాకు (nāku), to me; the thing needed, మామిడిపండు (māmiḍipaṇḍu), stays plain, and కావాలి (kāvāli), is wanted, does not change."
    native: "I would like a mango."
    alt_native: ["I want a mango."]
  "te-0725":
    native: "Mother cooks the curry."
    alt_native: ["Mum cooks the curry.", "Mom cooks the curry."]
  "te-0726":
    notes:
      "n1": "Before ఉంది (undi), 'it is', an adjective takes గా (gā): తీపిగా (tīpigā), sweet."
    native: "This fruit is sweet."
  "te-0727":
    notes:
      "n1": "The plural of పండు (paṇḍu), fruit, is irregular: పండ్లు (paṇḍlu), fruits."
    native: "He buys fruit."
    alt_native: ["He purchases fruit."]
