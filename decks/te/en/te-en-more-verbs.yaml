schema: 1
id: "te-en-more-verbs"
kind: "layer"
core: "te-more-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs"
description: "Thirty more verbs for everyday actions: sing, laugh, wash, open, close, climb, put, keep, forget, think, search, hit, fall, turn, show, run, fly, swim, cut, pull, call, mix, fill and wipe. Each has its form for 'I' and its polite request. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0821":
    native: "to sing"
    notes:
      "n1": "'I sing' and 'I will sing' are one form, {1}. Please sing is {2}."
      "n2": "A verb whose stem ends in {1} takes {2} for 'she' or 'it': {3}, I sing, but {4}."
    "examples": {
      "పిల్లలు పాట పాడతారు.": {"native": "The children sing a song.", "bases": {"పాడతారు": "to sing"}},
      "ఆమె జానపద పాటలు పాడుతుంది.": {"native": "She sings folk songs.", "bases": {}}
    }
  "te-0822":
    native: "to laugh; to smile"
    notes:
      "n1": "'I laugh' and 'I will laugh' are one form, {1}. Please laugh is {2}."
    "examples": {
      "అమ్మ కన్నీళ్లు తుడుచుకుని నవ్వింది.": {"native": "Mother wiped her tears and smiled.", "bases": {}},
      "ఆమె ఎల్లప్పుడూ నవ్వుతూ ఉంటుంది.": {"native": "She is always smiling.", "bases": {}}
    }
  "te-0823":
    native: "to cry; to weep"
    notes:
      "n1": "'I cry' and 'I will cry' are one form, {1}. Please cry is {2}."
      "n2": "{1} is also the number seven: the context tells them apart."
  "te-0824":
    native: "to wash (things)"
    notes:
      "n1": "'I wash' and 'I will wash' are one form, {1}. Please wash is {2}."
      "n2": "For things, as {1}, washing the dishes. Washing yourself is {2}."
    "examples": {
      "చెంబు కడగండి.": {"native": "Wash the jug.", "bases": {}},
      "నేను గిన్నెలు కడుగుతాను.": {"native": "I wash the dishes.", "bases": {"కడుగుతాను": "to wash (things)"}}
    }
  "te-0825":
    native: "to open"
    notes:
      "n1": "'I open' and 'I will open' are one form, {1}. Please open is {2}."
      "n2": "The opposite of {1}."
    "examples": {
      "గేటు ఎప్పుడు తెరుస్తారు?": {"native": "When do they open the gate?", "bases": {}},
      "నా అకౌంట్ తెరిచాను.": {"native": "I opened my account.", "bases": {}}
    }
  "te-0826":
    native: "to close; to shut"
    notes:
      "n1": "'I close' and 'I will close' are one form, {1}. Please close is {2}."
      "n2": "The opposite of {1}."
    "examples": {
      "ఆమె తలుపు మెల్లగా మూసింది.": {"native": "She closed the door gently.", "bases": {}},
      "ఆమె వెళ్ళినప్పుడు తలుపు మూసింది.": {"native": "When she left, she closed the door.", "bases": {"మూసింది": "to close; to shut"}}
    }
  "te-0827":
    native: "to climb; to get on"
    alt_native: ["to mount"]
    notes:
      "n1": "'I climb' and 'I will climb' are one form, {1}. Please climb is {2}."
      "n2": "{1} is to get on a bus; the opposite is {2}."
    "examples": {
      "బస్సు ఎక్కండి.": {"native": "Please get on the bus.", "bases": {"ఎక్కండి": "to climb; to get on"}},
      "ఏ రైలు ఎక్కాలి?": {"native": "Which train should I take?", "bases": {"ఎక్కాలి": "to climb; to get on"}}
    }
  "te-0828":
    native: "to get down; to get off"
    alt_native: ["to alight", "to descend"]
    notes:
      "n1": "'I get off' and 'I will get off' are one form, {1}. Please get off is {2}."
      "n2": "The opposite of {1}."
    "examples": {
      "ఇక్కడ దిగండి.": {"native": "Please get off here.", "bases": {"దిగండి": "to get down; to get off"}},
      "ఓవర్‌బ్రిడ్జ్ ఎక్కండి, తర్వాత కిందకి దిగండి.": {"native": "Go up the foot overbridge, then come down.", "bases": {"దిగండి": "to get down; to get off"}}
    }
  "te-0829":
    native: "to hold; to catch"
    alt_native: ["to grip"]
    notes:
      "n1": "'I hold' and 'I will hold' are one form, {1}. Please hold is {2}."
    "examples": {
      "అతను ట్రోఫీని చేతిలో పట్టుకున్నాడు.": {"native": "He held the trophy in his hand.", "bases": {}},
      "ఆ యోధుడు ఖడ్గం పట్టుకున్నాడు.": {"native": "That warrior held a sword.", "bases": {}}
    }
  "te-0830":
    native: "to put; to place; to serve"
    alt_native: ["to set down"]
    notes:
      "n1": "'I put' and 'I will put' are one form, {1}. Please put is {2}."
      "n2": "Also 'to serve food': {1}."
      "n3": "The stem loses a {1} in the {2} forms: {3} gives {4}."
    "examples": {
      "ఖర్చు పెట్టడం": {"native": "to spend (money)", "bases": {"ఖర్చు": "expense; cost", "పెట్టడం": "to put; to place; to serve"}},
      "మొదలు పెట్టడం": {"native": "to begin", "bases": {"మొదలు": "beginning; start", "పెట్టడం": "to put; to place; to serve"}}
    }
  "te-0831":
    native: "to keep; to leave (something somewhere)"
    notes:
      "n1": "'I keep' and 'I will keep' are one form, {1}. Please keep is {2}."
    "examples": {
      "పిల్లలకు ప్రమాదకరమైన వస్తువులను దూరంగా ఉంచండి.": {"native": "Keep dangerous things away from children.", "bases": {}},
      "మీ భద్రత కోసం తలుపు మూసి ఉంచండి.": {"native": "Keep the door shut for your safety.", "bases": {}}
    }
  "te-0832":
    native: "to teach"
    alt_native: ["to instruct"]
    notes:
      "n1": "'I teach' and 'I will teach' are one form, {1}. Please teach is {2}."
      "n2": "It is {1}, to learn, made causative: to make someone learn."
    "examples": {
      "నాకు చదరంగం నేర్పుతావా?": {"native": "Will you teach me chess?", "bases": {}},
      "పాఠశాలలో చిత్రలేఖనం నేర్పిస్తారు.": {"native": "They teach drawing at school.", "bases": {}}
    }
  "te-0833":
    native: "to forget"
    notes:
      "n1": "'I forget' and 'I will forget' are one form, {1}. Please forget is {2}."
      "n2": "Also written {1}."
    "examples": {
      "పాస్‌వర్డ్ మర్చిపోయాను.": {"native": "I forgot the password.", "bases": {}},
      "యూజర్‌నేమ్ మర్చిపోయాను.": {"native": "I have forgotten my username.", "bases": {}}
    }
  "te-0834":
    native: "to think"
    notes:
      "n1": "'I think' and 'I will think' are one form, {1}. Please think is {2}."
      "n2": "From {1}, a thought."
    "examples": {
      "విమర్శించే ముందు అందరూ ఆలోచించాలి.": {"native": "Everyone should think before criticizing.", "bases": {}},
      "పిల్లల భవిష్యత్తు గురించి తల్లిదండ్రులు ఆలోచిస్తారు.": {"native": "Parents think about their children's future.", "bases": {}}
    }
  "te-0835":
    native: "to search; to look for"
    alt_native: ["to seek"]
    notes:
      "n1": "'I search' and 'I will search' are one form, {1}. Please search is {2}."
      "n2": "In speech also {1}."
    "examples": {
      "నేను తాళం చెవి వెతుకుతాను.": {"native": "I will look for the key.", "bases": {"వెతుకుతాను": "to search; to look for"}}
    }
  "te-0836":
    native: "to take out; to pull; to remove"
    alt_native: ["to extract"]
    notes:
      "n1": "'I take out' and 'I will take out' are one form, {1}. Please take out is {2}."
      "n2": "{1} is to take a photo."
    "examples": {
      "ఫోటోలు తీయకండి.": {"native": "Please don't take photos.", "bases": {"తీయకండి": "to take out; to pull; to remove"}},
      "ఇక్కడ ఫోటోలు తీయకూడదు.": {"native": "You mustn't take photos here.", "bases": {"తీయకూడదు": "to take out; to pull; to remove"}}
    }
  "te-0837":
    native: "to put on; to throw; to lay"
    alt_native: ["to hurl"]
    notes:
      "n1": "'I put on' and 'I will put on' are one form, {1}. Please put on is {2}."
      "n2": "{1} asks a driver to put the meter on."
    "examples": {
      "ఏసీ వేయండి.": {"native": "Please switch the AC on.", "bases": {"వేయండి": "to put on; to throw; to lay"}},
      "తూకం వేయండి.": {"native": "Please weigh it.", "bases": {"వేయండి": "to put on; to throw; to lay"}}
    }
  "te-0838":
    native: "to hit; to strike"
    alt_native: ["to beat"]
    notes:
      "n1": "'I hit' and 'I will hit' are one form, {1}. Please hit is {2}."
      "n2": "{1} is to ring a bell."
      "n3": "The stem loses a {1} in the {2} forms: {3} gives {4}."
    "examples": {
      "బోర్ కొడుతోంది": {"native": "I'm bored", "bases": {"బోర్": "boredom", "కొడుతోంది": "to hit; to strike"}},
      "ఎవరో హారన్ కొట్టారు.": {"native": "Someone honked the horn.", "bases": {"కొట్టారు": "to hit; to strike"}}
    }
  "te-0839":
    native: "to fall; to take (time)"
    alt_native: ["to drop"]
    notes:
      "n1": "'I fall' and 'I will fall' are one form, {1}. Please fall is {2}."
      "n2": "Also 'to take time': {1}? is 'How long will it take?'"
    "examples": {
      "టెన్షన్ పడకు": {"native": "don't stress", "bases": {"టెన్షన్": "tension; stress", "పడకు": "to fall; to suffer"}},
      "ఎంత సేపు పడుతుంది?": {"native": "How long will it take?", "bases": {"సేపు": "a length of time", "పడుతుంది": "to fall; to take (time)"}}
    }
  "te-0840":
    native: "to stop (something)"
    alt_native: ["to halt"]
    notes:
      "n1": "'I stop' and 'I will stop' are one form, {1}. Please stop is {2}."
      "n2": "It stops something; {1} is what stops by itself."
    "examples": {
      "ఇక్కడ ఆపండి.": {"native": "Stop here, please.", "bases": {"ఆపండి": "to stop (something)"}},
      "రక్తస్రావం ఆపడానికి ఈ గుడ్డను వాడండి.": {"native": "Use this cloth to stop the bleeding.", "bases": {}}
    }
  "te-0841":
    native: "to turn; to wander about"
    alt_native: ["to rotate", "to roam"]
    notes:
      "n1": "'I turn' and 'I will turn' are one form, {1}. Please turn is {2}."
      "n2": "Also 'to wander around': {1}."
    "examples": {
      "సైకిల్ చక్రం తిరుగుతోంది.": {"native": "The bicycle wheel is turning.", "bases": {"తిరుగుతోంది": "to turn; to wander about"}},
      "వరుడి ఊరేగింపు ఊరంతా తిరిగింది.": {"native": "The groom's procession went all around the village.", "bases": {}}
    }
  "te-0842":
    native: "to show"
    alt_native: ["to display"]
    notes:
      "n1": "'I show' and 'I will show' are one form, {1}. Please show is {2}."
      "n2": "Built from {1}, to see: to make someone see."
    "examples": {
      "పత్రాలు చూపించండి.": {"native": "Please show your papers.", "bases": {"చూపించండి": "to show"}},
      "పీఎన్ఆర్ చూపించండి.": {"native": "Please show the PNR.", "bases": {"చూపించండి": "to show"}}
    }
  "te-0843":
    native: "to run"
    notes:
      "n1": "'I run' and 'I will run' are one form, {1}. Please run is {2}."
    "examples": {
      "నేను వేగంగా పరిగెత్తగలను.": {"native": "I can run fast.", "bases": {"పరిగెత్తగలను": "to run"}}
    }
  "te-0844":
    native: "to believe; to trust"
    alt_native: ["to have faith in"]
    notes:
      "n1": "'I trust' and 'I will trust' are one form, {1}. Please trust is {2}."
      "n2": "The noun is {1}, trust."
    "examples": {
      "నిజంగా నమ్మలేకపోతున్నాను.": {"native": "I really can't believe it.", "bases": {}}
    }
  "te-0845":
    native: "to fly; to jump up"
    alt_native: ["to leap"]
    notes:
      "n1": "'I fly' and 'I will fly' are one form, {1}. Please fly is {2}."
  "te-0846":
    native: "to swim"
    notes:
      "n1": "'I swim' and 'I will swim' are one form, {1}. Please swim is {2}."
      "n2": "{1} is swimming: {2}, I can swim."
  "te-0847":
    native: "to cut; to chop"
    notes:
      "n1": "'I cut' and 'I will cut' are one form, {1}. Please cut is {2}."
  "te-0848":
    native: "to pull; to drag"
    alt_native: ["to haul"]
    notes:
      "n1": "'I pull' and 'I will pull' are one form, {1}. Please pull is {2}."
  "te-0849":
    native: "to call; to invite"
    notes:
      "n1": "'I call' and 'I will call' are one form, {1}. Please call is {2}."
      "n2": "Also 'to invite': {1}."
    "examples": {
      "గుండెపోటు వచ్చినప్పుడు వెంటనే అంబులెన్స్ పిలవండి.": {"native": "When someone has a heart attack, call an ambulance at once.", "bases": {}}
    }
  "te-0850":
    native: "to mix; to join"
    alt_native: ["to blend"]
    notes:
      "n1": "'I mix' and 'I will mix' are one form, {1}. Please mix is {2}."
    "examples": {
      "వివాహం రెండు కుటుంబాలను కలుపుతుంది.": {"native": "Marriage joins two families.", "bases": {}}
    }
  "te-0851":
    native: "to fill"
    notes:
      "n1": "'I fill' and 'I will fill' are one form, {1}. Please fill is {2}."
    "examples": {
      "ఈ ఫారం నింపడం తప్పనిసరి.": {"native": "Filling in this form is compulsory.", "bases": {}},
      "మీ టికెట్ రద్దుచేయాలంటే ఈ ఫారం నింపండి.": {"native": "To cancel your ticket, fill in this form.", "bases": {}}
    }
  "te-0852":
    native: "to wipe"
    notes:
      "n1": "'I wipe' and 'I will wipe' are one form, {1}. Please wipe is {2}."
    "examples": {
      "గోడ తుడవండి.": {"native": "Wipe the wall.", "bases": {}},
      "రబ్బరుతో పొరపాటు తుడిచాను.": {"native": "I rubbed out the mistake with the eraser.", "bases": {}}
    }
