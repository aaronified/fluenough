schema: 1
id: "te-en-family"
kind: "layer"
core: "te-family"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Family"
description: "Parents, brothers and sisters, grandparents, and the aunts and uncles on each side, each with its own word. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0380":
    native: "parents"
    notes:
      "n1": "In speech also అమ్మానాన్నలు (ammānānnalu)."
    "examples": {
      "పిల్లల భవిష్యత్తు గురించి తల్లిదండ్రులు ఆలోచిస్తారు.": {"native": "Parents think about their children's future.", "bases": {}},
      "తల్లిదండ్రులు కూతురి విజయం గురించి గర్వంగా చెప్పారు.": {"native": "The parents spoke proudly about their daughter's success.", "bases": {}}
    }
  "te-0381":
    native: "father"
    alt_native: ["dad"]
    notes:
      "n1": "నాన్నగారు (nānnagāru) adds respect; తండ్రి (taṇḍri) is the formal word."
    "examples": {
      "ఆయన మా నాన్న.": {"native": "He is my father.", "bases": {}},
      "నాన్నకు మీసం లేదు.": {"native": "Dad has no moustache.", "bases": {}}
    }
  "te-0059":
    notes:
      "n1": "The formal word is తల్లి (talli)."
  "te-0061":
    notes:
      "n1": "Often అన్నయ్య (annayya)."
  "te-0182":
    notes:
      "n1": "Also చెల్లెలు (cellelu)."
  "te-0382":
    native: "brothers"
    notes:
      "n1": "Telugu has no everyday word for a brother or a sister, only elder and younger: అన్న (anna), తమ్ముడు (tammuḍu). Brothers together are అన్నదమ్ములు (annadammulu); sisters, అక్కచెల్లెళ్ళు (akkacelleḷḷu). The formal words are సోదరుడు (sōdaruḍu) and సోదరి (sōdari)."
    "examples": {
      "మీకు అన్నదమ్ములు ఉన్నారా?": {"native": "Do you have any brothers?", "bases": {}}
    }
  "te-0383":
    native: "son"
    "examples": {
      "నా కొడుకు జనన ధ్రువీకరణ పత్రం పోయింది.": {"native": "My son's birth certificate is lost.", "bases": {}},
      "ఆమె కొడుకు ఇంకా రాలేదని అమ్మ ఆందోళనగా చూస్తోంది.": {"native": "Mother is looking worried because her son has not come yet.", "bases": {}}
    }
  "te-0384":
    native: "daughter"
    notes:
      "n1": "Formally కుమార్తె (kumārte)."
    "examples": {
      "తల్లిదండ్రులు కూతురి విజయం గురించి గర్వంగా చెప్పారు.": {"native": "The parents spoke proudly about their daughter's success.", "bases": {}}
    }
  "te-0385":
    native: "husband"
    notes:
      "n1": "In speech also ఆయన (āyana), 'he': మా ఆయన (mā āyana), my husband."
  "te-0386":
    native: "wife"
    notes:
      "n1": "In speech also ఆవిడ (āviḍa), 'she': మా ఆవిడ (mā āviḍa), my wife."
  "te-0387":
    native: "children"
    alt_native: ["kids"]
    "examples": {
      "పిల్లలు ఆడుతున్నారు.": {"native": "The children are playing.", "bases": {}},
      "పిల్లలు నవ్వుతారు.": {"native": "The children laugh.", "bases": {}}
    }
  "te-0388":
    native: "grandfather"
    alt_native: ["grandpa"]
    notes:
      "n1": "On either side: a father's father or a mother's father."
    "examples": {
      "తాతకు నెరసిన జుట్టు ఉంది.": {"native": "Grandfather has grey hair.", "bases": {}},
      "తాత ప్రతి ఆదివారం చదరంగం ఆడతారు.": {"native": "Grandfather plays chess every Sunday.", "bases": {}}
    }
  "te-0389":
    native: "grandmother (father's mother)"
    alt_native: ["grandma"]
  "te-0390":
    native: "grandmother (mother's mother)"
    alt_native: ["grandma"]
    "examples": {
      "అమ్మమ్మ వీణ వాయిస్తుంది.": {"native": "Grandmother plays the veena.", "bases": {}}
    }
  "te-0187":
    native: "uncle (father's younger brother)"
    notes:
      "n1": "Also how you address a man of your parents' age. His wife is పిన్ని (pinni)."
  "te-0391":
    native: "uncle (father's elder brother)"
    notes:
      "n1": "His wife is పెద్దమ్మ (peddamma)."
  "te-0392":
    native: "uncle (mother's brother)"
    notes:
      "n1": "His wife is అత్త (atta)."
  "te-0062":
    native: "aunt (father's sister, or mother's brother's wife)"
    notes:
      "n1": "Also a mother-in-law: with respect, అత్తగారు (attagāru)."
  "te-0393":
    native: "aunt (mother's younger sister)"
    notes:
      "n1": "Also the wife of బాబాయ్ (bābāy). A mother's elder sister is పెద్దమ్మ (peddamma)."
  "te-0394":
    native: "father-in-law"
  "te-0395":
    native: "mother-in-law"
    "examples": {
      "అత్తగారు అల్లుడికి పాయసం పెట్టారు.": {"native": "The mother-in-law served payasam to the son-in-law.", "bases": {}}
    }
  "te-0396":
    native: "relative"
    alt_native: ["relation"]
    notes:
      "n1": "Plural బంధువులు (bandhuvulu)."
    "examples": {
      "వాళ్ళు మాకు ఆత్మీయమైన బంధువులు.": {"native": "They are dear relatives to us.", "bases": {}}
    }
  "te-0397":
    native: "I have two younger brothers."
    notes:
      "n1": "'To me two younger brothers are': people take ఉన్నారు (unnāru), things ఉన్నాయి (unnāyi)."
    bases:
      "ఇద్దరు": "two people"
  "te-0398":
    native: "Do you have any brothers?"
  "te-0399":
    native: "I'm married."
    notes:
      "n1": "Literally 'to me the wedding has happened'."
    bases:
      "పెళ్ళైంది": "wedding; marriage"
