schema: 1
id: "te-en-script-consonants"
kind: "layer"
core: "te-script-consonants"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Telugu consonants"
description: "Every consonant a beginner meets, each carrying its vowel a: the plain and breathy ones, the ones on the teeth and curled back, and the two l's."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "te-0014":
    native: "k (ka)"
    notes:
      "n1": "Like the 'k' of 'skin', with no puff of breath. Every consonant carries the short a (అ) unless a sign changes it. కాలు (kālu, leg)."
  "te-0015":
    native: "kh, with a breath (kha)"
    notes:
      "n1": "క (ka) with a puff of breath after it, mostly in words from Sanskrit and Hindi: ఖర్చు (kharcu, expense)."
  "te-0016":
    native: "g (ga)"
    notes:
      "n1": "Like the 'g' of 'go': గది (gadi, room)."
  "te-0017":
    native: "gh, with a breath (gha)"
    notes:
      "n1": "గ (ga) with a breath after it, mostly in words from Sanskrit."
  "te-0018":
    native: "ng (as in 'sing')"
    notes:
      "n1": "Rare today: Telugu writes the sunna ం (am) in its place. Hardly ever heard on its own, so it is drilled by reading and writing only."
  "te-0019":
    native: "ch (ca)"
    notes:
      "n1": "Like the 'ch' of 'church', with no puff of breath: చెయ్యి (ceyyi, hand)."
  "te-0020":
    native: "chh, with a breath (cha)"
    notes:
      "n1": "చ (ca) with a breath after it, in a few words from Sanskrit."
  "te-0021":
    native: "j (ja)"
    notes:
      "n1": "Like the 'j' of 'judge': జామ (jāma, guava)."
  "te-0022":
    native: "jh, with a breath (jha)"
    notes:
      "n1": "జ (ja) with a breath after it, in a few words from Sanskrit."
  "te-0023":
    native: "ny (in conjuncts)"
    notes:
      "n1": "Seen almost only in జ్ఞ (jña), as in జ్ఞానం (jñānam, knowledge). Hardly ever heard on its own, so it is drilled by reading and writing only."
  "te-0024":
    native: "t, curled back (ṭa)"
    notes:
      "n1": "The tongue tip curls back to touch the roof of the mouth: retroflex. English 't' is close to this. Compare త (ta): టమాట (ṭamāṭa, tomato)."
  "te-0025":
    native: "th, curled back, with a breath (ṭha)"
    notes:
      "n1": "ట (ṭa) with a breath after it, in words from Sanskrit: పాఠం (pāṭham, lesson)."
  "te-0026":
    native: "d, curled back (ḍa)"
    notes:
      "n1": "The tongue tip curls back, as for ట (ṭa). English 'd' is close to this. Compare ద (da): డబ్బు (ḍabbu, money)."
  "te-0027":
    native: "dh, curled back, with a breath (ḍha)"
    notes:
      "n1": "డ (ḍa) with a breath after it, in a few words from Sanskrit."
  "te-0028":
    native: "n, curled back (ṇa)"
    notes:
      "n1": "The tongue tip curls back, as for ట (ṭa): దుకాణం (dukāṇam, shop). Compare న (na), on the teeth."
  "te-0029":
    native: "t, on the teeth (ta)"
    notes:
      "n1": "The tongue touches the back of the upper teeth: dental. English has no such t; it sounds softer. Compare ట (ṭa): తల (tala, head)."
  "te-0030":
    native: "th, on the teeth, with a breath (tha)"
    notes:
      "n1": "త (ta) with a breath after it. Not the 'th' of 'thin': అర్థం (artham, meaning)."
  "te-0031":
    native: "d, on the teeth (da)"
    notes:
      "n1": "The tongue touches the back of the upper teeth, as for త (ta). Compare డ (ḍa): దారి (dāri, way)."
  "te-0032":
    native: "dh, on the teeth, with a breath (dha)"
    notes:
      "n1": "ద (da) with a breath after it. Not the 'th' of 'this': ధర (dhara, price)."
  "te-0033":
    native: "n, on the teeth (na)"
    notes:
      "n1": "The 'n' of 'no', with the tongue on the teeth: నీళ్ళు (nīḷḷu, water). Compare ణ (ṇa)."
  "te-0034":
    native: "p (pa)"
    notes:
      "n1": "Like the 'p' of 'spin', with no puff of breath: పాలు (pālu, milk)."
  "te-0035":
    native: "ph, with a breath (pha)"
    notes:
      "n1": "ప (pa) with a breath after it. In English words it stands for 'f': ఫలం (phalam, fruit), కాఫీ (kāfī, coffee)."
  "te-0036":
    native: "b (ba)"
    notes:
      "n1": "Like the 'b' of 'boy': బడి (baḍi, school)."
  "te-0037":
    native: "bh, with a breath (bha)"
    notes:
      "n1": "బ (ba) with a breath after it. Not 'v': భాష (bhāṣa, language)."
  "te-0038":
    native: "m (ma)"
    notes:
      "n1": "Like the 'm' of 'mother': మనిషి (maniṣi, person)."
  "te-0039":
    native: "y (ya)"
    notes:
      "n1": "Like the 'y' of 'yes': యాభై (yābhai, fifty)."
  "te-0040":
    native: "r (ra)"
    notes:
      "n1": "A single tap of the tongue, like the 'tt' of American 'butter'. Never silent: రోజు (rōju, day)."
  "te-0041":
    native: "l, on the teeth (la)"
    notes:
      "n1": "A clear 'l': లోపల (lōpala, inside). Compare ళ (ḷa), curled back."
  "te-0042":
    native: "v or w (va)"
    notes:
      "n1": "Between English 'v' and 'w': వారం (vāram, week)."
  "te-0043":
    native: "sh (śa)"
    notes:
      "n1": "The 'sh' of 'shop': శనివారం (śanivāram, Saturday)."
  "te-0044":
    native: "sh, curled back (ṣa)"
    notes:
      "n1": "Said with the tongue curled back in careful speech, in words from Sanskrit: భాష (bhāṣa, language). It sounds just like శ (śa) in everyday speech, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  "te-0045":
    native: "s (sa)"
    notes:
      "n1": "The 's' of 'sun'. Unlike శ (śa), never 'sh': సమయం (samayam, time)."
  "te-0046":
    native: "h (ha)"
    notes:
      "n1": "Like the 'h' of 'hat': హైదరాబాద్ (haidarābād, Hyderabad)."
  "te-0047":
    native: "l, curled back (ḷa)"
    notes:
      "n1": "The tongue tip curls back for this l, unlike ల (la): కళ (kaḷa, art), నీళ్ళు (nīḷḷu, water). Telugu tells them apart: కల (kala, with the l on the teeth) is a dream."
