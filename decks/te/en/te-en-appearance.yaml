"schema": 1
"id": "te-en-appearance"
"kind": "layer"
"core": "te-appearance"
"native": { "code": "en", "iso639_3": "eng", "name": "English" }
"name": "Appearance: looks, height and age"
"description": "Words for how people and things look: hair, face, height, age and build, and some colours. Not yet checked by a Telugu speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "te-2200":
    "native": "appearance; look; form"
    "examples":
      "అతని రూపం బాగుంది.":
        "native": "His appearance looks good."
        "bases":
          "అతని": { "meaning": "he" }
          "బాగుంది": { "meaning": "good; fine" }
      "నా రూపం ఎలా ఉంది?":
        "native": "What do I look like?"
        "bases":
          "నా": { "meaning": "I" }
          "ఉంది": { "meaning": "to be; to have" }
    "notes":
      "n1": "Used for how a person looks: {1}."
    wiktionary: true
  "te-2201":
    "native": "looks; features; appearance"
    "examples":
      "ఆమె రూపురేఖలు చాలా అందంగా ఉన్నాయి.":
        "native": "Her features look very beautiful."
        "bases":
          "అందంగా": { "meaning": "beauty" }
          "ఉన్నాయి": { "meaning": "to be; to have" }
      "అతని రూపురేఖలు బాగున్నాయి.":
        "native": "His looks are good."
        "bases":
          "అతని": { "meaning": "he" }
          "బాగున్నాయి": { "meaning": "good; fine" }
    "notes":
      "n1": "A person's whole look: {1}."
  "te-2202":
    "native": "beauty"
    "examples":
      "ఈ ఊరి అందం చాలా బాగుంది.":
        "native": "The beauty of this town is very nice."
        "bases":
          "ఊరి": { "meaning": "village; town" }
          "బాగుంది": { "meaning": "good; fine" }
      "ఈ పట్టణం అందంగా ఉంది.":
        "native": "This town is beautiful."
        "bases":
          "అందంగా": { "meaning": "beauty" }
          "ఉంది": { "meaning": "to be; to have" }
    "notes":
      "n1": "Beauty of a place or a person: {1}."
    wiktionary: true
  "te-2203":
    "native": "shape; form; build"
    "examples":
      "ఈ కుండ ఆకారం బాగుంది.":
        "native": "The shape of this pot is nice."
        "bases":
          "బాగుంది": { "meaning": "good; fine" }
      "నాకు ఈ ఆకారం ఇష్టం.":
        "native": "I like this shape."
        "bases":
          "నాకు": { "meaning": "I" }
    "notes":
      "n1": "The shape or build of a thing or a person: {1}."
    wiktionary: true
  "te-2204":
    "native": "height; how tall"
    "examples":
      "అతని ఎత్తు ఎంత?":
        "native": "How tall is he?"
        "bases":
          "అతని": { "meaning": "he" }
      "ఈ చెట్టు ఎత్తు చాలా ఉంది.":
        "native": "This tree is very tall."
        "bases":
          "ఉంది": { "meaning": "to be; to have" }
    "notes":
      "n1": "Height, how tall someone or something is: {1}."
    senses:
      "height": { native: "height" }
    wiktionary: true
  "te-2205":
    "native": "length; height"
    "examples":
      "ఈ గది పొడవు ఎంత?":
        "native": "How long is this room?"
      "ఈ తాడు పొడవుగా ఉంది.":
        "native": "This rope is long."
        "bases":
          "పొడవుగా":
            "meaning": "length; height"
          "ఉంది":
            "meaning": "to be; to have"
          "తాడు":
            "meaning": "rope"
    "notes":
      "n1": "Length, or the height of a person: {1}."
  "te-2206":
    "native": "age"
    "examples":
      "నీ వయసు ఎంత?":
        "native": "How old are you?"
        "bases":
          "నీ": { "meaning": "you" }
      "అతని వయసు ఎక్కువ.":
        "native": "He is old."
        "bases":
          "అతని": { "meaning": "he" }
    "notes":
      "n1": "A person's age in years: {1}."
    wiktionary: true
  "te-2207":
    "native": "moustache"
    "examples":
      "అతనికి మీసం ఉంది.":
        "native": "He has a moustache."
