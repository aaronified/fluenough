schema: 1
id: "te-en-addressing"
kind: "layer"
core: "te-addressing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Addressing people"
description: "What to call a shopkeeper, a driver or an older woman: Telugu speakers address strangers as family. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0179":
    native: "elder brother; to a man a little older"
    notes:
      "n1": "What you call a shopkeeper or an auto driver: అన్నా (annā), ఎంత (enta)? Friendly and polite at once."
  "te-0180":
    native: "elder sister; to a woman a little older"
  "te-0181":
    native: "younger brother; to a younger man"
    "examples": {
      "అతను నా తమ్ముడు.": {"native": "He is my younger brother.", "bases": {}}
    }
  "te-0182":
    native: "younger sister"
  "te-0183":
    native: "Mr; Ms (after a name, respectful)"
    notes:
      "n1": "రాము గారు (rāmu gāru), Mr Ramu. It shows respect to anyone, man or woman."
    "examples": {
      "రాము గారు వచ్చారు.": {"native": "Mr Ramu has come.", "bases": {"రాము": "Ramu (a man's name)"}},
      "రాము గారు, రండి.": {"native": "Mr Ramu, please come.", "bases": {"రాము": "Ramu (a man's name)", "గారు": "Mr; Ms (after a name, respectful)"}}
    }
  "te-0184":
    native: "a word of respect, after a word or a reply"
    notes:
      "n1": "Added to soften and show respect: అవునండీ (avunaṇḍī), yes; సరేనండీ (sarēnaṇḍī), all right."
  "te-0185":
    native: "sir"
    "examples": {
      "సార్, కూర్చోండి.": {"native": "Sir, please sit.", "bases": {"సార్": "sir"}},
      "సార్, నీళ్ళు తాగండి.": {"native": "Sir, please drink some water.", "bases": {"సార్": "sir"}}
    }
  "te-0186":
    native: "madam"
    "examples": {
      "మేడమ్, చెప్పండి.": {"native": "Madam, please tell me.", "bases": {"మేడమ్": "madam"}},
      "మేడమ్, సరేనండి.": {"native": "Madam, all right.", "bases": {"మేడమ్": "madam"}}
    }
  "te-0187":
    native: "uncle; to a man of your parents' age"
    notes:
      "n1": "Strictly your father's younger brother."
  "te-0188":
    native: "aunty; to an older woman"
  "te-0189":
    native: "friend (a man)"
    notes:
      "n1": "A woman friend is స్నేహితురాలు (snēhiturālu)."
    "examples": {
      "ఆ అందగాడు నా స్నేహితుడు.": {"native": "That handsome man is my friend.", "bases": {}}
    }
