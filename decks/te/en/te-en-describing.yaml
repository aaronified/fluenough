schema: 1
id: "te-en-describing"
kind: "layer"
core: "te-describing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing things and feelings"
description: "Words to describe things (long, short, heavy, easy, wet, dry, expensive) and how you feel (hungry, thirsty, tired, happy, afraid). Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0945":
    native: "long; tall"
    wiktionary: true
    notes:
      "n1": "{1} is length."
    "examples": {
      "ఆమెకు పొడవైన జడ ఉంది.": {"native": "She has a long plait.", "bases": {}}
    }
  "te-0946":
    native: "high; tall (of buildings, hills, trees)"
    notes:
      "n1": "{1} is height."
    "examples": {
      "ఎత్తైన ప్రాంతాల్లో ఆక్సిజన్ తక్కువగా ఉంటుంది.": {"native": "In high places there is less oxygen.", "bases": {}}
    }
  "te-0947":
    native: "short"
    wiktionary: true
    notes:
      "n1": "Short in height or in length."
    "examples": {
      "ఆ అబ్బాయి పొట్టిగా ఉన్నాడు.": {"native": "That boy is short.", "bases": {}}
    }
  "te-0948":
    native: "fat; thick"
    wiktionary: true
    notes:
      "n1": "Said of a person, {1} can sound blunt."
  "te-0949":
    native: "thin; slim; fine"
    alt_native: ["slender"]
    wiktionary: true
    notes:
      "n1": "Also fine, as thread is."
    "examples": {
      "ఆమె మెడలో సన్నని గొలుసు ఉంది.": {"native": "She has a thin chain on her neck.", "bases": {}}
    }
  "te-0950":
    native: "heavy"
    alt_native: ["weighty"]
    wiktionary: true
    notes:
      "n1": "{1} is weight."
  "te-0951":
    native: "light (not heavy)"
    notes:
      "n1": "{1} is lightness."
    "examples": {
      "ఈ కాన్వాస్ పెద్దది, కానీ తేలికైనది.": {"native": "This canvas is big, but light.", "bases": {}}
    }
  "te-0952":
    native: "easy"
    alt_native: ["simple"]
    wiktionary: true
    notes:
      "n1": "{1} means 'easily'."
    "examples": {
      "గణితం నాకు సులభం.": {"native": "Maths is easy for me.", "bases": {}},
      "ఈ పని చాలా సులభం.": {"native": "This work is very easy.", "bases": {}}
    }
  "te-0953":
    native: "difficult; hard"
    alt_native: ["tough"]
    wiktionary: true
    notes:
      "n1": "Also hardship or trouble, as a noun."
    "examples": {
      "ఓటమిని అంగీకరించడం కష్టం.": {"native": "Accepting defeat is hard.", "bases": {}}
    }
  "te-0954":
    native: "expensive"
    alt_native: ["costly"]
    notes:
      "n1": "{1} is the price."
    "examples": {
      "ఈ పరికరం చాలా ఖరీదైనది.": {"native": "This device is very expensive.", "bases": {"ఖరీదైనది": "expensive"}},
      "ఆ చొక్కా ఖరీదైనది.": {"native": "That shirt is expensive.", "bases": {"ఖరీదైనది": "expensive"}}
    }
  "te-0955":
    native: "cheap"
    alt_native: ["inexpensive"]
    wiktionary: true
    notes:
      "n1": "Also {1} before a noun."
  "te-0956":
    native: "empty; free (not busy)"
    alt_native: ["vacant"]
    wiktionary: true
    notes:
      "n1": "Also 'free', not busy: {1}."
    "examples": {
      "చెత్తకుండీ ఖాళీ చేయండి.": {"native": "Empty the dustbin.", "bases": {}}
    }
  "te-0957":
    native: "full"
    wiktionary: true
    notes:
      "n1": "{1} means 'full of'."
  "te-0958":
    native: "wet; damp"
    alt_native: ["moist"]
    wiktionary: true
    notes:
      "n1": "Also a noun: moisture."
    "examples": {
      "గాలి తడిగా ఉంది.": {"native": "The air is humid.", "bases": {}},
      "తడి నేలపై జారిపడతాను.": {"native": "I slip and fall on the wet floor.", "bases": {}}
    }
  "te-0959":
    native: "dry"
    wiktionary: true
    notes:
      "n1": "Also 'powder': {1}, chilli powder."
    "examples": {
      "వేసవిలో నేల పొడిగా ఉంటుంది.": {"native": "In summer the ground is dry.", "bases": {}},
      "వర్షం తర్వాత రోడ్డు ఇంకా పొడిగా లేదు.": {"native": "After the rain the road is still not dry.", "bases": {}}
    }
  "te-0960":
    native: "hard; firm; strong"
    alt_native: ["solid"]
    wiktionary: true
    notes:
      "n1": "{1} means 'loudly' or 'tightly'."
    "examples": {
      "వాళ్ళు గట్టిగా అరుస్తారు.": {"native": "They shout loudly.", "bases": {}},
      "దేవుడి మీద అతనికి గట్టి విశ్వాసం.": {"native": "He has strong faith in God.", "bases": {}}
    }
  "te-0961":
    native: "soft"
    wiktionary: true
    notes:
      "n1": "{1} means 'softly'."
  "te-0962":
    native: "dirty"
    wiktionary: true
    notes:
      "n1": "Also the noun 'dirt'. The opposite of {1}."
  "te-0963":
    native: "warm"
    wiktionary: true
    notes:
      "n1": "Between {1}, cold, and {2}, hot."
  "te-0964":
    native: "fast; quickly"
    alt_native: ["rapidly"]
    wiktionary: true
    notes:
      "n1": "From {1}, speed."
    "examples": {
      "నేను వేగంగా పరిగెత్తగలను.": {"native": "I can run fast.", "bases": {}},
      "నది ప్రవాహం వేగంగా ఉంది.": {"native": "The river's current is fast.", "bases": {}}
    }
  "te-0965":
    native: "slowly"
    wiktionary: true
    notes:
      "n1": "The opposite of {1}."
    "examples": {
      "నెమ్మదిగా చెప్పు.": {"native": "Say it slowly.", "bases": {"నెమ్మదిగా": "slowly"}},
      "నెమ్మదిగా నడవండి.": {"native": "Please walk slowly.", "bases": {}}
    }
  "te-0966":
    native: "hunger"
    wiktionary: true
    notes:
      "n1": "{1} is 'I am hungry'."
    "examples": {
      "నాకు ఆకలిగా ఉంది.": {"native": "I'm hungry.", "bases": {"ఆకలిగా": "hunger"}}
    }
  "te-0967":
    native: "thirst"
    wiktionary: true
    notes:
      "n1": "{1} is 'I am thirsty'."
    "examples": {
      "నాకు దాహంగా ఉంది.": {"native": "I am thirsty.", "bases": {"దాహంగా": "thirst"}}
    }
  "te-0968":
    native: "sleep; sleepiness"
    wiktionary: true
    notes:
      "n1": "{1} is 'I am sleepy': sleep is coming."
  "te-0969":
    native: "tiredness"
    alt_native: ["fatigue"]
    notes:
      "n1": "{1} is 'I am tired'."
    "examples": {
      "నేను చాలా అలసటగా ఉన్నాను.": {"native": "I am very tired.", "bases": {"అలసటగా": "tiredness"}}
    }
  "te-0970":
    native: "happiness; joy"
    alt_native: ["gladness"]
    wiktionary: true
    notes:
      "n1": "{1} is 'I am happy'."
    "examples": {
      "మిమ్మల్ని కలవడం సంతోషం.": {"native": "Nice to meet you.", "bases": {"సంతోషం": "happiness; joy"}},
      "రజతం గెలిచినందుకు అతను సంతోషంగా ఉన్నాడు.": {"native": "He is happy to have won the silver.", "bases": {}}
    }
  "te-0971":
    native: "sadness; pain; distress"
    alt_native: ["sorrow"]
    wiktionary: true
    notes:
      "n1": "It means both sorrow and pain."
  "te-0972":
    native: "anger"
    wiktionary: true
    notes:
      "n1": "{1} is 'I am angry'."
    "examples": {
      "అతనికి చాలా కోపంగా ఉంది.": {"native": "He is very angry.", "bases": {"కోపంగా": "anger"}}
    }
  "te-0973":
    native: "fear"
    wiktionary: true
    notes:
      "n1": "{1} is 'I am afraid'."
    "examples": {
      "థ్రిల్లర్ సినిమా చూస్తే భయంగా ఉంటుంది.": {"native": "Watching a thriller film feels scary.", "bases": {}}
    }
  "te-0974":
    native: "cold (the feeling); chill"
    wiktionary: true
    notes:
      "n1": "{1} is 'I feel cold'; {2} is a cold thing."
    "examples": {
      "ఇక్కడ చలిగా ఉంది.": {"native": "It is cold here.", "bases": {"చలిగా": "cold (the feeling); chill"}},
      "ఢిల్లీలో చలి ఎక్కువ.": {"native": "It is very cold in Delhi.", "bases": {}}
    }
