schema: 1
id: "te-en-agriculture"
kind: "layer"
core: "te-agriculture"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Agriculture: farms, crops and the harvest"
description: "Farm words: field, plough, tractor, seed, seedling, soil, water, fertiliser, crops such as paddy, cotton, wheat, sorghum and sugarcane, pests and disease, grain, warehouse, yield, irrigation and the people who work the land. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-4600":
    native: "farming; agriculture"
    wiktionary: true
    notes:
      "n1": "A general word for farming. For one piece of land, say {1}."
    examples:
      "వ్యవసాయం కష్టమైన పని.":
        native: "Farming is hard work."
        bases:
          "కష్టమైన":
            meaning: "hard; difficult"
      "మా ఊళ్ళో వ్యవసాయం ముఖ్యమైనది.":
        native: "Farming is important in our village."
        bases:
          "మా":
            meaning: "our"
          "ఊళ్ళో":
            meaning: "in the village"
          "ముఖ్యమైనది":
            meaning: "important"
  "te-4601":
    native: "farming; cultivation; tilling the land"
    notes:
      "n1": "A formal word for tilling and growing crops. In everyday talk people more often say వ్యవసాయం (vyavasāyam)."
    examples:
      "సేద్యానికి చాలా ఓపిక కావాలి.":
        "native": "Farming needs a lot of patience."
        "bases":
          "కావాలి":
            "meaning": "is needed; must have"
          "సేద్యానికి":
            "meaning": "farming; cultivation"
          "ఓపిక":
            "meaning": "patience"
      "ఈ భూమి సేద్యానికి మంచిది.":
        native: "This land is good for farming."
        bases:
          "సేద్యానికి":
            meaning: "for farming"
          "మంచిది":
            meaning: "good"
  "te-4602":
    native: "plough"
    wiktionary: true
    notes:
      "n1": "A plough is pulled by oxen: {1} pull it."
    examples:
      "రైతు నాగలితో పొలం దున్నాడు.":
        native: "The farmer ploughed the field with a plough."
        bases:
          "నాగలితో":
            meaning: "with a plough"
          "దున్నాడు":
            meaning: "ploughed"
      "ఈ నాగలి చాలా పాతది.":
        native: "This plough is very old."
        bases:
          "పాతది":
            meaning: "old"
    synonyms: { "halamu": "plough" }
  "te-4603":
    native: "tractor"
    notes:
      "n1": "The plural is {1}."
    examples:
      "మా పొలంలో ట్రాక్టర్ ఉంది.":
        native: "There is a tractor in our field."
        bases:
          "మా":
            meaning: "our"
          "పొలంలో":
            meaning: "in the field"
          "ఉంది":
            meaning: "is; there is"
      "ట్రాక్టర్‌తో దున్నితే పని త్వరగా అవుతుంది.":
        native: "If you plough with a tractor, the work is done quickly."
        bases:
          "ట్రాక్టర్‌తో":
            meaning: "with a tractor"
          "దున్నితే":
            meaning: "if one ploughs"
          "అవుతుంది":
            meaning: "gets done"
  "te-4604":
    native: "cultivated field; a plot under crops"
    wiktionary: true
    notes:
      "n1": "A field with a crop in it. The plural is {1}: the ending -ను (-nu) changes."
    examples:
      "చేనులో వరి పండుతోంది.":
        native: "Paddy is growing in the field."
        bases:
          "చేనులో":
            meaning: "in the field"
          "పండుతోంది":
            meaning: "is growing"
      "చేనుకి నీళ్ళు పెట్టాలి.":
        native: "The field must be watered."
        bases:
          "చేనుకి":
            meaning: "to the field"
          "నీళ్ళు":
            meaning: "water"
          "పెట్టాలి":
            meaning: "must put; must give"
    synonyms: { "polamu": "field" }
    senses:
      "field": { native: "field" }
      "cornfield": { native: "cornfield" }
  "te-4605":
    native: "seedling"
    wiktionary: true
    notes:
      "n1": "A young plant raised in a nursery bed, then moved to the field."
    examples:
      "నారు ఇప్పుడే నాటాలి.":
        native: "The seedlings must be planted now."
        bases:
          "నాటాలి":
            meaning: "must plant"
      "నారు పచ్చగా ఉంది.":
        "native": "The seedlings are green."
        "bases":
          "ఉంది":
            "meaning": "is"
          "పచ్చగా":
            "meaning": "green"
    senses:
      "tender": { native: "A tender young sprout, or plant" }
      "young": { native: "Young plants kept to be transplanted" }
  "te-4606":
    native: "sprout"
    wiktionary: true
    notes:
      "n1": "The first shoot of a seed above the soil. The plural is {1}."
    examples:
      "విత్తనం నుంచి మొలక వచ్చింది.":
        "native": "A sprout came up from the seed."
        "bases":
          "వచ్చింది":
            "meaning": "came up"
          "నుంచి":
            "meaning": "from; since"
      "రెండు రోజుల్లో మొలకలు కనిపిస్తాయి.":
        native: "The sprouts will show in two days."
        bases:
          "రోజుల్లో":
            meaning: "in days"
          "మొలకలు":
            meaning: "sprouts"
          "కనిపిస్తాయి":
            meaning: "will appear"
    synonyms: { "ankuramu": "a germ, a sprout, a bud" }
  "te-4607":
    native: "compost"
    notes:
      "n1": "Compost is made from rotted waste and used as manure."
    examples:
      "కంపోస్ట్ ఎరువుగా వాడతారు.":
        native: "Compost is used as fertiliser."
        bases:
          "ఎరువుగా":
            meaning: "as fertiliser"
          "వాడతారు":
            meaning: "use"
      "ఇంట్లో చెత్తతో కంపోస్ట్ చేయవచ్చు.":
        native: "You can make compost from household waste."
        bases:
          "ఇంట్లో":
            meaning: "at home"
          "చెత్తతో":
            meaning: "with waste"
          "చేయవచ్చు":
            meaning: "can make"
  "te-4608":
    native: "weeds"
    wiktionary: true
    notes:
      "n1": "Plants that grow where they are not wanted. Pulling them out is {1}."
    examples:
      "పొలంలో కలుపు ఎక్కువ ఉంది.":
        native: "There are a lot of weeds in the field."
        bases:
          "పొలంలో":
            meaning: "in the field"
          "ఉంది":
            meaning: "is; there is"
      "కలుపు తీయకపోతే పంట దెబ్బతింటుంది.":
        native: "If the weeds are not pulled out, the crop will be damaged."
        bases:
          "తీయకపోతే":
            meaning: "if one does not pull out"
          "దెబ్బతింటుంది":
            meaning: "will be damaged"
  "te-4609":
    native: "plant disease; damage by disease"
    wiktionary: true
    notes:
      "n1": "Damage to a crop by disease or pests. The plural is {1}: the stem changes."
    examples:
      "ఈ ఏడాది పత్తికి తెగులు వచ్చింది.":
        "native": "This year the cotton got a disease."
        "bases":
          "పత్తికి":
            "meaning": "to cotton"
          "వచ్చింది":
            "meaning": "got"
          "ఏడాది":
            "meaning": "year"
      "ఆకులపై తెగులు కనిపిస్తే మందు వేయాలి.":
        native: "If disease shows on the leaves, medicine must be sprayed."
        bases:
          "ఆకులపై":
            meaning: "on the leaves"
          "కనిపిస్తే":
            meaning: "if it shows"
          "వేయాలి":
            meaning: "must apply"
    senses:
      "disease": { native: "disease, sickness, illness" }
      "plant": { native: "plant disease" }
  "te-4610":
    native: "insect; worm; pest"
    wiktionary: true
    notes:
      "n1": "Insects and worms, and the pests that eat crops. The plural is {1}."
    examples:
      "ఆకులో పురుగు ఉంది.":
        native: "There is an insect on the leaf."
        bases:
          "ఆకులో":
            meaning: "on the leaf"
          "ఉంది":
            meaning: "is; there is"
      "పురుగులు పంటను తినేస్తున్నాయి.":
        native: "The insects are eating up the crop."
        bases:
          "పురుగులు":
            meaning: "insects"
          "పంటను":
            meaning: "the crop"
          "తినేస్తున్నాయి":
            meaning: "are eating up"
  "te-4611":
    native: "pesticide; insecticide"
    notes:
      "n1": "Literally 'insect medicine'. {1} is medicine."
    examples:
      "పురుగుమందు జాగ్రత్తగా వాడాలి.":
        "native": "Pesticide must be used carefully."
        "bases":
          "వాడాలి":
            "meaning": "must use"
          "జాగ్రత్తగా":
            "meaning": "care; caution"
      "పురుగుమందు పిల్లలకు దూరంగా పెట్టండి.":
        native: "Keep the pesticide away from children."
        bases:
          "పిల్లలకు":
            meaning: "to children"
          "పెట్టండి":
            meaning: "keep"
  "te-4612":
    native: "locust; grasshopper"
    wiktionary: true
    notes:
      "n1": "A locust swarm can destroy a whole field. The plural is {1}."
    examples:
      "మిడతలు పొలం అంతా తినేశాయి.":
        native: "The locusts ate the whole field."
        bases:
          "మిడతలు":
            meaning: "locusts"
          "తినేశాయి":
            meaning: "ate up"
      "మిడతల దండు ఊరి మీదికి వచ్చింది.":
        "native": "A swarm of locusts came over the village."
        "bases":
          "మిడతల":
            "meaning": "of locusts"
          "ఊరి":
            "meaning": "the village"
          "వచ్చింది":
            "meaning": "came"
          "దండు":
            "meaning": "army; troop"
  "te-4613":
    native: "grain; seed kernel"
    wiktionary: true
    notes:
      "n1": "One grain or seed. The plural is {1}."
    examples:
      "ఒక్క గింజ కూడా వృథా చేయకు.":
        "native": "Do not waste even a single grain."
        "bases":
          "చేయకు":
            "meaning": "do not do"
          "వృథా":
            "meaning": "waste"
      "ఈ పొలంలో గింజలు బాగా పండాయి.":
        native: "The grains have ripened well in this field."
        bases:
          "పొలంలో":
            meaning: "in this field"
          "గింజలు":
            meaning: "grains"
          "పండాయి":
            meaning: "have ripened"
  "te-4614":
    native: "grain; cereal (harvested)"
    wiktionary: true
    notes:
      "n1": "Harvested grain, stored for food or sale. The plural is {1}."
    examples:
      "ధాన్యాన్ని గోదాములో దాచారు.":
        native: "They stored the grain in the warehouse."
        bases:
          "ధాన్యాన్ని":
            meaning: "the grain"
          "గోదాములో":
            meaning: "in the warehouse"
          "దాచారు":
            meaning: "stored"
      "మార్కెట్లో ధాన్యం ధర పెరిగింది.":
        native: "The price of grain went up in the market."
        bases:
          "మార్కెట్లో":
            meaning: "in the market"
          "పెరిగింది":
            meaning: "went up"
  "te-4615":
    native: "warehouse; granary"
    notes:
      "n1": "A store for grain and goods. The plural is {1}."
    examples:
      "గోదాములో ధాన్యం నిల్వ ఉంది.":
        "native": "There is grain stored in the warehouse."
        "bases":
          "గోదాములో":
            "meaning": "in the warehouse"
          "ఉంది":
            "meaning": "is; there is"
          "నిల్వ":
            "meaning": "stock; storage"
      "రైతులు పంటను గోదాముకు తీసుకెళ్తారు.":
        native: "Farmers take the crop to the warehouse."
        bases:
          "రైతులు":
            meaning: "farmers"
          "పంటను":
            meaning: "the crop"
          "గోదాముకు":
            meaning: "to the warehouse"
          "తీసుకెళ్తారు":
            meaning: "take away"
  "te-4616":
    native: "sack (of grain or goods)"
    wiktionary: true
    notes:
      "n1": "A bag used for grain, cement and other goods. The plural is {1}."
    examples:
      "ఒక బస్తా బియ్యం ఎంత?":
        native: "How much is a sack of rice?"
      "వాళ్ళు పది బస్తాలు తీసుకెళ్ళారు.":
        native: "They took away ten sacks."
        bases:
          "బస్తాలు":
            meaning: "sacks"
          "తీసుకెళ్ళారు":
            meaning: "took away"
  "te-4617":
    native: "yield; amount harvested"
    wiktionary: true
    notes:
      "n1": "How much a field gives per acre, or per season."
    examples:
      "ఈ సారి ఎకరాకు మంచి దిగుబడి వచ్చింది.":
        "native": "This time the yield per acre was good."
        "bases":
          "ఎకరాకు":
            "meaning": "per acre"
          "వచ్చింది":
            "meaning": "was"
          "సారి":
            "meaning": "time (as in \"this time\")"
      "వర్షం లేకపోవడంతో దిగుబడి తగ్గింది.":
        native: "With no rain, the yield fell."
        bases:
          "లేకపోవడంతో":
            meaning: "because there was no"
          "తగ్గింది":
            meaning: "fell"
  "te-4618":
    native: "wheat"
    wiktionary: true
    notes:
      "n1": "{1} is wheat flour."
    examples:
      "చలికాలంలో గోధుమ పంట వేస్తారు.":
        native: "Wheat is sown in the winter."
        bases:
          "చలికాలంలో":
            meaning: "in winter"
          "వేస్తారు":
            meaning: "sow"
      "గోధుమపిండితో చపాతీలు చేస్తారు.":
        "native": "They make chapatis with wheat flour."
        "bases":
          "గోధుమపిండితో":
            "meaning": "with wheat flour"
          "చేస్తారు":
            "meaning": "make"
          "చపాతీలు":
            "meaning": "chapati"
  "te-4619":
    native: "paddy; rice plant"
    wiktionary: true
    notes:
      "n1": "Rice while it is still growing in the field. {1} is a paddy field."
    examples:
      "ఈ ఊళ్ళో వరి ఎక్కువగా పండుతుంది.":
        native: "A lot of paddy grows in this village."
        bases:
          "ఊళ్ళో":
            meaning: "in the village"
          "పండుతుంది":
            meaning: "grows"
      "వరి నాట్లు జూన్‌లో మొదలవుతాయి.":
        native: "Paddy planting starts in June."
        bases:
          "నాట్లు":
            meaning: "plantings"
          "జూన్‌లో":
            meaning: "in June"
          "మొదలవుతాయి":
            meaning: "start"
  "te-4620":
    native: "cotton (plant and fibre)"
    wiktionary: true
    notes:
      "n1": "{1} is a cotton field."
    examples:
      "పత్తి పంటకు ఈ ఏడాది మంచి ధర ఉంది.":
        "native": "Cotton has a good price this year."
        "bases":
          "పంటకు":
            "meaning": "for the crop"
          "ఉంది":
            "meaning": "is; there is"
          "ఏడాది":
            "meaning": "year"
      "అమ్మ పత్తితో దిండు చేసింది.":
        native: "Mum made a pillow with cotton."
        bases:
          "పత్తితో":
            meaning: "with cotton"
          "చేసింది":
            meaning: "made"
  "te-4621":
    native: "sugarcane"
    wiktionary: true
    notes:
      "n1": "Its juice is sold cold on the roadside. {1} is sugarcane juice."
    examples:
      "చెరకు రసం తాగితే బాగుంటుంది.":
        native: "Sugarcane juice is good to drink."
        bases:
          "తాగితే":
            meaning: "if one drinks"
          "బాగుంటుంది":
            meaning: "will be good"
      "ఈ ఊళ్ళో చెరకు చేలు ఎక్కువ.":
        native: "There are many sugarcane fields in this village."
        bases:
          "ఊళ్ళో":
            meaning: "in the village"
          "చేలు":
            meaning: "fields"
    synonyms: { "iksuvu": "sugar cane (Saccharum officinarum)" }
  "te-4622":
    native: "sorghum"
    wiktionary: true
    notes:
      "n1": "A cereal grown on dry land. The plural is {1}."
    examples:
      "జొన్న రొట్టె చాలా మందికి ఇష్టం.":
        native: "Many people like sorghum bread."
        bases:
          "మందికి":
            meaning: "to people"
      "వర్షం తక్కువ ఉన్న చోట జొన్న పండుతుంది.":
        native: "Sorghum grows where there is little rain."
        bases:
          "ఉన్న":
            meaning: "where there is"
          "చోట":
            meaning: "place"
          "పండుతుంది":
            meaning: "grows"
  "te-4623":
    native: "maize; corn"
    wiktionary: true
    notes:
      "n1": "{1} is a corn cob."
    examples:
      "పిల్లలు మొక్కజొన్న కంకులు కాల్చుకుని తిన్నారు.":
        native: "The children roasted corn cobs and ate them."
        bases:
          "కంకులు":
            meaning: "cobs"
          "కాల్చుకుని":
            meaning: "having roasted"
