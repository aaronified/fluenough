schema: 1
id: "te-en-environment"
kind: "layer"
core: "te-environment"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Environment: air, pollution, waste and care"
description: "Air, water, pollution, waste, recycling and looking after nature. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-4500":
    native: "environment"
    notes:
      "n1": "It has no plural."
    examples:
      "బడిలో పర్యావరణం గురించి చదువుతారు.": "At school they study about the environment."
      "ఈ రోజు పర్యావరణ దినోత్సవం.": "Today is World Environment Day."
  "te-4525":
    native: "gas"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to వాయువుల (vāyuvula-)."
    examples:
      "మొక్కలకు కర్బన వాయువు అవసరం.": "Plants need carbon dioxide gas."
      "కర్మాగారం నుంచి విష వాయువులు వస్తున్నాయి.": "Poisonous gases are coming out of the factory."
  "te-4526":
    native: "oxygen"
    wiktionary: true
    notes:
      "n1": "It has no plural."
    examples:
      "చెట్లు ఆక్సిజన్ ఇస్తాయి.": "Trees give oxygen."
      "ఎత్తైన ప్రాంతాల్లో ఆక్సిజన్ తక్కువగా ఉంటుంది.": "In high places there is less oxygen."
  "te-4501":
    native: "pollution"
    notes:
      "n1": "It has no plural."
    examples:
      "ఈ పట్నంలో కాలుష్యం ఎక్కువగా ఉంది.": "In this city, pollution is high."
      "కాలుష్యం వల్ల దగ్గు వస్తుంది.": "Pollution causes coughs."
  "te-4514":
    native: "global warming"
    notes:
      "n1": "It has no plural."
    examples:
      "భూతాపం వల్ల వాతావరణం మారుతోంది.": "Because of global warming, the climate is changing."
      "భూతాపం గురించి టీవీలో వింటారు.": "People hear about global warming on TV."
  "te-4506":
    native: "reuse"
    notes:
      "n1": "It has no plural."
    examples:
      "ఈ పునర్వినియోగం వల్ల డబ్బు ఆదా అవుతుంది.": "This kind of reuse saves money."
      "పునర్వినియోగం అంటే వస్తువులను మళ్ళీ వాడటం.": "Reuse means using things again."
  "te-4520":
    native: "recycling"
    notes:
      "n1": "It has no plural."
    examples:
      "ఈ కంపెనీ ప్లాస్టిక్ రీసైక్లింగ్ చేస్తుంది.": "This company does plastic recycling."
      "పాత కాగితాల రీసైక్లింగ్ గురించి పాఠం చదివాం.": "We read a lesson about recycling old paper."
  "te-4521":
    native: "dustbin"
    notes:
      "n1": "The plural is {1}: the stem changes to చెత్తకుండీల (cettakuṇḍīla-)."
    examples:
      "ఇంటి బయట చెత్తకుండీ ఉంది.": "There is a dustbin outside the house."
      "చెత్తకుండీ ఖాళీ చేయండి.": "Empty the dustbin."
  "te-4503":
    native: "waste"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to వ్యర్థాల (vyarthāla-)."
    examples:
      "ఇంటి వ్యర్థాలను రోజూ బయట పారేస్తారు.": "Every day people throw household waste outside."
      "వ్యర్థం ఎక్కడ వేయాలో మీకు తెలుసా?": "Do you know where to put the waste?"
  "te-4504":
    native: "plastic"
    notes:
      "n1": "The plural is {1}."
    examples:
      "బజారులో ప్లాస్టిక్ సంచులు ఇస్తారు.": "In the market they give out plastic bags."
      "నేలపై ప్లాస్టిక్ బాటిల్ పడి ఉంది.": "A plastic bottle is lying on the ground."
  "te-4505":
    native: "smoke"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to పొగల (pogala-)."
    examples:
      "పొగ ఆకాశంలోకి వెళ్తుంది.": "The smoke goes up into the sky."
      "ఫ్యాక్టరీ నుంచి దట్టమైన పొగలు వస్తున్నాయి.": "Thick smoke is coming out of the factory."
    synonyms: { "dhumamu": "smoke" }
  "te-4502":
    native: "cleanliness"
    notes:
      "n1": "It has no plural."
    examples:
      "ఈ పట్నంలో వీధుల శుభ్రత బాగా ఉంది.": "In this city the streets are very clean."
      "శుభ్రత కోసం చెత్తను చెత్తకుండీలో వేయండి.": "For cleanliness, put the rubbish into the dustbin."
  "te-4516":
    native: "protection"
    wiktionary: true
    notes:
      "n1": "It has no plural."
    examples:
      "అడవుల రక్షణ మన బాధ్యత.": "Protecting the forests is our responsibility."
      "ఈ చెరువుకు రక్షణ గోడ ఉంది.": "This pond has a protective wall."
  "te-4517":
    native: "conservation"
    wiktionary: true
    notes:
      "n1": "It has no plural."
    examples:
      "జంతువుల సంరక్షణ కోసం ఈ అడవిని చూస్తున్నారు.": "They are looking after this forest to conserve the animals."
      "ఈ అడవి సంరక్షణ ఎవరి బాధ్యత?": "Whose responsibility is the conservation of this forest?"
  "te-4518":
    native: "awareness"
    notes:
      "n1": "It has no plural."
    examples:
      "ప్రజల్లో ఇప్పుడు మంచి అవగాహన ఉంది.": "People now have good awareness."
      "పిల్లలకు అవగాహన ఇవ్వడానికి బొమ్మల పుస్తకం చదివారు.": "They read a picture book to raise children's awareness."
  "te-4519":
    native: "fuel"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to ఇంధనాల (indhanāla-)."
    examples:
      "కారులో ఇంధనం ఉంది.": "There is fuel in the car."
      "ఇంధనం ఆదా చేయడం మంచిది.": "It is good to save fuel."
  "te-4527":
    native: "electricity"
    wiktionary: true
    notes:
      "n1": "It has no plural."
    examples:
      "సౌర విద్యుత్తు ఇంటికి వెలుగు ఇస్తుంది.": "Solar electricity gives light to the house."
      "విద్యుత్తు ఆదా చేయడం మన బాధ్యత.": "Saving electricity is our responsibility."
    senses:
      "lightning": { native: "lightning" }
      "electricity": { native: "electricity" }
  "te-4507":
    native: "fertiliser"
    notes:
      "n1": "The plural is {1}: the stem changes to ఎరువుల (eruvula-)."
    examples:
      "రైతు పొలంలో ఎరువు వేస్తాడు.": "The farmer puts fertiliser in the field."
      "ఎరువు వేసిన చెట్లు పెద్దగా ఉన్నాయి.": "The trees that got fertiliser are big."
  "te-4508":
    native: "drain; canal"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to కాలువల (kāluvala-)."
    examples:
      "కాలువలో చెత్త వేయకండి.": "Do not put rubbish in the drain."
      "వర్షం పడితే కాలువ నీరు రోడ్డు మీదకు వస్తుంది.": "When it rains, the water from the drain comes over the road."
    synonyms: { "kulya": "a canal, channel" }
    senses:
      "canal": { native: "a canal, channel" }
      "stream": { native: "a stream" }
  "te-4509":
    native: "park; garden"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to ఉద్యానవనాల (udyānavanāla-)."
    examples:
      "సాయంత్రం మేము ఉద్యానవనానికి వెళ్తాము.": "In the evening we go to the park."
      "ఈ ఉద్యానవనంలో వందల మొక్కలు ఉన్నాయి.": "This park has hundreds of plants."
  "te-4510":
    native: "greenery"
    wiktionary: true
    notes:
      "n1": "It has no plural."
    examples:
      "పట్నం చుట్టూ పచ్చదనం పుష్కలంగా ఉంది.": "There is plenty of greenery around the town."
      "పచ్చదనం కళ్ళకు హాయిగా ఉంటుంది.": "Greenery is pleasant to the eyes."
  "te-4512":
    native: "crop"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to పంటల (paṇṭala-)."
    examples:
      "పొలంలో పంట ఇంకా ఉంది.": "The crop is still in the field."
      "మంచి పంట కోసం సమయానికి నీళ్ళు పెట్టాలి.": "For a good crop, water it on time."
    senses:
      "ripening": { native: "ripening" }
      "produce": { native: "produce, crop" }
  "te-4513":
    native: "living being"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to జీవుల (jīvula-)."
    examples:
      "భూమి మీద లక్షల జీవులు ఉన్నాయి.": "There are millions of living beings on earth."
      "ప్రతి జీవికి గాలి, నీరు అవసరం.": "Every living being needs air and water."
  "te-4511":
    native: "animal"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to జంతువుల (jantuvula-)."
    examples:
      "అడవిలో అనేక జంతువులు ఉంటాయి.": "Many animals live in the forest."
      "ఆ జంతువును దూరం నుంచి చూడండి.": "Watch that animal from a distance."
    synonyms: { "caramu": "moveable, locomotive, migratory" }
  "te-4522":
    native: "wildlife"
    notes:
      "n1": "The plural is {1}: the stem changes to వన్యప్రాణుల (vanyaprāṇula-)."
    examples:
      "ఈ అడవిలో అరుదైన వన్యప్రాణులు ఉన్నాయి.": "There is rare wildlife in this forest."
      "వన్యప్రాణుల వల్ల పర్యాటకులు ఎక్కువ మంది వస్తారు.": "Many tourists come because of the wildlife."
  "te-4523":
    native: "resource"
    notes:
      "n1": "The plural is {1}: the stem changes to వనరుల (vanarula-)."
    examples:
      "నీరు ఒక ముఖ్యమైన వనరు.": "Water is an important resource."
      "సహజ వనరులను జాగ్రత్తగా వాడాలి.": "Natural resources should be used carefully."
  "te-4524":
    native: "mineral"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to ఖనిజాల (khanijāla-)."
    examples:
      "ఈ కొండలో విలువైన ఖనిజాలు ఉన్నాయి.": "This hill has valuable minerals."
      "ఈ నేలలో ఇనుప ఖనిజం ఎక్కువగా ఉంది.": "There is a lot of iron ore in this soil."
  "te-4515":
    native: "emission"
    notes:
      "n1": "The plural is {1}: the stem changes to ఉద్గారాల (udgārāla-)."
    examples:
      "కర్మాగారాల ఉద్గారాలు ఎక్కువగా ఉన్నాయి.": "The emissions from factories are high."
      "కార్ల ఉద్గారాలను దూరం చేయడానికి సైకిల్ వాడండి.": "To cut down car emissions, use a bicycle."
