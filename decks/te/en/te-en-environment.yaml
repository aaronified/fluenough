schema: 1
id: "te-en-environment"
kind: "layer"
core: "te-environment"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Environment: air, pollution, waste and care"
description: "Air, water, pollution, waste, recycling and looking after nature. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-4500":
    native: "environment"
    notes:
      "n1": "It has no plural."
    examples:
      "బడిలో పర్యావరణం గురించి చదువుతారు.": {"native": "At school they study about the environment.", "bases": {"గురించి": {"meaning": "about; concerning"}}}
      "ఈ రోజు పర్యావరణ దినోత్సవం.": {"native": "Today is World Environment Day.", "bases": {"పర్యావరణ": {"meaning": "environment"}, "దినోత్సవం": {"meaning": "day (of celebration)"}}}
  "te-4525":
    native: "gas"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to వాయువుల (vāyuvula-)."
    examples:
      "మొక్కలకు కర్బన వాయువు అవసరం.": {"native": "Plants need carbon dioxide gas.", "bases": {"కర్బన": {"meaning": "carbon"}}}
      "కర్మాగారం నుంచి విష వాయువులు వస్తున్నాయి.": {"native": "Poisonous gases are coming out of the factory.", "bases": {"నుంచి": {"meaning": "from; since"}, "వాయువులు": {"meaning": "gas"}}}
  "te-4526":
    native: "oxygen"
    wiktionary: true
    notes:
      "n1": "It has no plural."
    examples:
      "చెట్లు ఆక్సిజన్ ఇస్తాయి.": "Trees give oxygen."
      "ఎత్తైన ప్రాంతాల్లో ఆక్సిజన్ తక్కువగా ఉంటుంది.": "In high places there is less oxygen."
  "te-4501":
    native: "pollution"
    notes:
      "n1": "It has no plural."
    examples:
      "ఈ పట్నంలో కాలుష్యం ఎక్కువగా ఉంది.": "In this city, pollution is high."
      "కాలుష్యం వల్ల దగ్గు వస్తుంది.": {"native": "Pollution causes coughs.", "bases": {"వల్ల": {"meaning": "because of; due to"}}}
  "te-4514":
    native: "global warming"
    notes:
      "n1": "It has no plural."
    examples:
      "భూతాపం వల్ల వాతావరణం మారుతోంది.": {"native": "Because of global warming, the climate is changing.", "bases": {"వల్ల": {"meaning": "because of; due to"}}}
      "భూతాపం గురించి టీవీలో వింటారు.": {"native": "People hear about global warming on TV.", "bases": {"గురించి": {"meaning": "about; concerning"}}}
  "te-4506":
    native: "reuse"
    notes:
      "n1": "It has no plural."
    examples:
      "వస్తువుల పునర్వినియోగం వల్ల డబ్బు ఆదా అవుతుంది.": {"native": "Reusing things saves money.", "bases": {"వల్ల": {"meaning": "because of; due to"}, "ఆదా": {"meaning": "saving"}}}
      "పునర్వినియోగం అంటే వస్తువులను మళ్ళీ వాడటం.": {"native": "Reuse means using things again.", "bases": {"అంటే": {"meaning": "to say; here, 'as for'"}}}
  "te-4520":
    native: "recycling"
    notes:
      "n1": "It has no plural."
    examples:
      "ఈ కంపెనీ ప్లాస్టిక్ రీసైక్లింగ్ చేస్తుంది.": "This company does plastic recycling."
      "పాత కాగితాల రీసైక్లింగ్ గురించి పాఠం చదివాం.": {"native": "We read a lesson about recycling old paper.", "bases": {"గురించి": {"meaning": "about; concerning"}}}
  "te-4521":
    native: "dustbin"
    notes:
      "n1": "The plural is {1}: the stem changes to చెత్తకుండీల (cettakuṇḍīla-)."
    examples:
      "ఇంటి బయట చెత్తకుండీ ఉంది.": "There is a dustbin outside the house."
      "చెత్తకుండీ ఖాళీ చేయండి.": "Empty the dustbin."
  "te-4503":
    native: "waste"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to వ్యర్థాల (vyarthāla-)."
    examples:
      "ఇంటి వ్యర్థాలను రోజూ బయట పారేస్తారు.": {"native": "Every day people throw household waste outside.", "bases": {"వ్యర్థాలను": {"meaning": "waste"}}}
      "వ్యర్థం ఎక్కడ వేయాలో మీకు తెలుసా?": "Do you know where to put the waste?"
  "te-4504":
    native: "plastic"
    notes:
      "n1": "The plural is {1}."
    examples:
      "బజారులో ప్లాస్టిక్ సంచులు ఇస్తారు.": "In the market they give out plastic bags."
      "నేలపై ప్లాస్టిక్ బాటిల్ పడి ఉంది.": {"native": "A plastic bottle is lying on the ground.", "bases": {"బాటిల్": {"meaning": "bottle"}}}
  "te-4505":
    native: "smoke"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to పొగల (pogala-)."
    examples:
      "పొగ ఆకాశంలోకి వెళ్తుంది.": "The smoke goes up into the sky."
      "ఫ్యాక్టరీ నుంచి దట్టమైన పొగలు వస్తున్నాయి.": {"native": "Thick smoke is coming out of the factory.", "bases": {"నుంచి": {"meaning": "from; since"}, "దట్టమైన": {"meaning": "thick; dense"}, "పొగలు": {"meaning": "smoke"}}}
    synonyms: { "dhumamu": "smoke" }
  "te-4502":
    native: "cleanliness"
    notes:
      "n1": "It has no plural."
    examples:
      "ఈ పట్నంలో వీధుల శుభ్రత బాగా ఉంది.": "In this city the streets are very clean."
      "శుభ్రత కోసం చెత్తను చెత్తకుండీలో వేయండి.": {"native": "For cleanliness, put the rubbish into the dustbin.", "bases": {"కోసం": {"meaning": "for; for the sake of"}}}
  "te-4516":
    native: "protection"
    wiktionary: true
    notes:
      "n1": "It has no plural."
    examples:
      "అడవుల రక్షణ మన బాధ్యత.": "Protecting the forests is our responsibility."
      "ఈ చెరువుకు రక్షణ గోడ ఉంది.": "This pond has a protective wall."
  "te-4517":
    native: "conservation"
    wiktionary: true
    notes:
      "n1": "It has no plural."
    examples:
      "జంతువుల సంరక్షణ కోసం ఈ అడవిని కాపాడుతున్నారు.": {"native": "They are protecting this forest to conserve the animals.", "bases": {"కోసం": {"meaning": "for; for the sake of"}, "కాపాడుతున్నారు": {"meaning": "to protect; to save"}}}
      "ఈ అడవి సంరక్షణ ఎవరి బాధ్యత?": "Whose responsibility is the conservation of this forest?"
  "te-4518":
    native: "awareness"
    notes:
      "n1": "It has no plural."
    examples:
      "ప్రజల్లో ఇప్పుడు మంచి అవగాహన ఉంది.": "People now have good awareness."
      "పిల్లలకు అవగాహన కలిగించడానికి బొమ్మల పుస్తకం చదివారు.": {"native": "They read a picture book to make the children aware.", "bases": {"కలిగించడానికి": {"meaning": "to cause; to give rise to"}}}
  "te-4519":
    native: "fuel"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to ఇంధనాల (indhanāla-)."
    examples:
      "కారులో ఇంధనం ఉంది.": "There is fuel in the car."
      "ఇంధనం ఆదా చేయడం మంచిది.": {"native": "It is good to save fuel.", "bases": {"ఆదా": {"meaning": "saving"}}}
  "te-4527":
    native: "electricity"
    wiktionary: true
    notes:
      "n1": "It has no plural."
    examples:
      "సౌర విద్యుత్తు ఇంటికి వెలుగు ఇస్తుంది.": {"native": "Solar electricity gives light to the house.", "bases": {"సౌర": {"meaning": "solar"}}}
      "విద్యుత్తు ఆదా చేయడం మన బాధ్యత.": {"native": "Saving electricity is our responsibility.", "bases": {"ఆదా": {"meaning": "saving"}}}
  "te-4507":
    native: "fertiliser"
    notes:
      "n1": "The plural is {1}: the stem changes to ఎరువుల (eruvula-)."
    examples:
      "రైతు పొలంలో ఎరువు వేస్తాడు.": "The farmer puts fertiliser in the field."
      "ఎరువు వేసిన చెట్లు పెద్దగా ఉన్నాయి.": "The trees that got fertiliser are big."
  "te-4508":
    native: "drain; canal"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to కాలువల (kāluvala-)."
    examples:
      "కాలువలో చెత్త వేయకండి.": {"native": "Do not put rubbish in the drain.", "bases": {"కాలువలో": {"meaning": "drain; canal"}}}
      "వర్షం పడితే కాలువ నీరు రోడ్డు మీదకు వస్తుంది.": "When it rains, the water from the drain comes over the road."
    synonyms: { "kulya": "a canal, channel" }
  "te-4509":
    native: "park; garden"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to ఉద్యానవనాల (udyānavanāla-)."
    examples:
      "సాయంత్రం మేము ఉద్యానవనానికి వెళ్తాము.": {"native": "In the evening we go to the park.", "bases": {"ఉద్యానవనానికి": {"meaning": "park; garden"}}}
      "ఈ ఉద్యానవనంలో వందల మొక్కలు ఉన్నాయి.": {"native": "This park has hundreds of plants.", "bases": {"ఉద్యానవనంలో": {"meaning": "park; garden"}}}
  "te-4510":
    native: "greenery"
    wiktionary: true
    notes:
      "n1": "It has no plural."
    examples:
      "పట్నం చుట్టూ పచ్చదనం పుష్కలంగా ఉంది.": {"native": "There is plenty of greenery around the town.", "bases": {"పుష్కలంగా": {"meaning": "plenty"}}}
      "పచ్చదనం కళ్ళకు హాయిగా ఉంటుంది.": {"native": "Greenery is pleasant to the eyes.", "bases": {"హాయిగా": {"meaning": "comfort; ease"}}}
  "te-4512":
    native: "crop"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to పంటల (paṇṭala-)."
    examples:
      "పొలంలో పంట ఇంకా ఉంది.": "The crop is still in the field."
      "మంచి పంట కోసం సమయానికి నీళ్ళు పెట్టాలి.": {"native": "For a good crop, water it on time.", "bases": {"కోసం": {"meaning": "for; for the sake of"}}}
  "te-4513":
    native: "living being"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to జీవుల (jīvula-)."
    examples:
      "భూమి మీద లక్షల జీవులు ఉన్నాయి.": {"native": "There are millions of living beings on earth.", "bases": {"జీవులు": {"meaning": "living being"}}}
      "ప్రతి జీవికి గాలి, నీరు అవసరం.": {"native": "Every living being needs air and water.", "bases": {"జీవికి": {"meaning": "living being"}}}
  "te-4511":
    native: "animal"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to జంతువుల (jantuvula-)."
    examples:
      "అడవిలో అనేక జంతువులు ఉంటాయి.": {"native": "Many animals live in the forest.", "bases": {"అనేక": {"meaning": "many; several"}, "జంతువులు": {"meaning": "animal"}}}
      "ఆ జంతువును దూరం నుంచి చూడండి.": {"native": "Watch that animal from a distance.", "bases": {"నుంచి": {"meaning": "from; since"}, "జంతువును": {"meaning": "animal"}}}
  "te-4522":
    native: "wildlife"
    notes:
      "n1": "The plural is {1}: the stem changes to వన్యప్రాణుల (vanyaprāṇula-)."
    examples:
      "ఈ అడవిలో అరుదైన వన్యప్రాణులు ఉన్నాయి.": {"native": "There is rare wildlife in this forest.", "bases": {"అరుదైన": {"meaning": "rare"}, "వన్యప్రాణులు": {"meaning": "wildlife"}}}
      "వన్యప్రాణుల వల్ల పర్యాటకులు ఎక్కువ మంది వస్తారు.": {"native": "Many tourists come because of the wildlife.", "bases": {"వల్ల": {"meaning": "because of; due to"}, "పర్యాటకులు": {"meaning": "tourist"}, "మంది": {"meaning": "people (counting persons)"}, "వన్యప్రాణుల": {"meaning": "wildlife"}}}
  "te-4523":
    native: "resource"
    notes:
      "n1": "The plural is {1}: the stem changes to వనరుల (vanarula-)."
    examples:
      "నీరు ఒక ముఖ్యమైన వనరు.": "Water is an important resource."
      "సహజ వనరులను జాగ్రత్తగా వాడాలి.": {"native": "Natural resources should be used carefully.", "bases": {"సహజ": {"meaning": "natural"}, "జాగ్రత్తగా": {"meaning": "care; caution"}, "వనరులను": {"meaning": "resource"}}}
  "te-4524":
    native: "mineral"
    wiktionary: true
    notes:
      "n1": "The plural is {1}: the stem changes to ఖనిజాల (khanijāla-)."
    examples:
      "ఈ కొండలో విలువైన ఖనిజాలు ఉన్నాయి.": {"native": "This hill has valuable minerals.", "bases": {"ఖనిజాలు": {"meaning": "mineral"}}}
      "ఈ నేలలో ఇనుప ఖనిజం ఎక్కువగా ఉంది.": {"native": "There is a lot of iron ore in this soil.", "bases": {"ఇనుప": {"meaning": "iron"}}}
  "te-4515":
    native: "emission"
    notes:
      "n1": "The plural is {1}: the stem changes to ఉద్గారాల (udgārāla-)."
    examples:
      "కర్మాగారాల ఉద్గారాలు ఎక్కువగా ఉన్నాయి.": {"native": "The emissions from factories are high.", "bases": {"ఉద్గారాలు": {"meaning": "emission"}}}
      "కార్ల ఉద్గారాలను తగ్గించడానికి సైకిల్ వాడండి.": {"native": "To cut down car emissions, use a bicycle.", "bases": {"ఉద్గారాలను": {"meaning": "emission"}}}
