schema: 1
id: "te-en-clothes-sentences"
kind: "layer"
core: "te-clothes-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Clothes and colours: sentences"
description: "Sentences about what people wear and in what colour, with the words of the clothes unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0935":
    notes:
      "n1": "ఎర్రని (errani), red, is the form before a noun, as in ఎర్రని (errani) చీర (cīra), a red sari."
    native: "She wears a red sari."
    alt_native: ["She is wearing a red sari."]
    bases:
      "కట్టుకుంటుంది": "to tie on; to wear (a sari or dhoti)"
  "te-0936":
    notes:
      "n1": "తెల్లని (tellani), white, is the form before a noun, as in తెల్లని (tellani) చొక్కా (cokkā), a white shirt."
    native: "I want a white shirt."
    alt_native: ["I would like a white shirt."]
  "te-0937":
    notes:
      "n1": "రంగులో (raṅgulō) is రంగు (raṅgu), colour, with the locative ending -lō, meaning 'in' a colour."
    native: "This shirt is blue (in colour)."
  "te-0938":
    native: "My shoes are black."
  "te-0939":
    notes:
      "n1": "మీకు (mīku) is the dative of మీరు (mīru), you, used for 'you like' with ఇష్టం (iṣṭaṁ), liking."
    native: "Which colour do you like?"
    alt_native: ["Which color do you like?"]
  "te-0940":
    notes:
      "n1": "జేబులో (jēbulō) is జేబు (jēbu), pocket, with the locative ending -lō, meaning 'in'."
    native: "There is money in the pocket."
  "te-0941":
    notes:
      "n1": "పెట్టుకుంటారు (peṭṭukuṇṭāru), they put on, has the third-person plural present-future ending -tāru, as in నవ్వుతారు (navvutāru), they laugh."
    native: "The children wear caps."
    alt_native: ["The kids wear caps."]
    bases:
      "పెట్టుకుంటారు": "to put on (oneself)"
  "te-0942":
    notes:
      "n1": "The colour comes first, then రంగు (raṅgu), colour: గులాబీ (gulābī) రంగు (raṅgu) is pink."
    native: "This is a pink sari."
  "te-0943":
    notes:
      "n1": "The first-person present-future ending -ānu is here on వేసుకుంటాను (vēsukuṇṭānu), I put on, as in తాగుతాను (tāgutānu), I drink."
    native: "I put on my sandals."
    bases:
      "వేసుకుంటాను": "to put on (clothes, shoes)"
  "te-0944":
    notes:
      "n1": "ఖరీదైనది (kharīdainadi) is the describing word for expensive, made with the -aina ending of ఖరీదు (kharīdu), cost, as the course's describing words are."
    native: "That coat is very expensive."
