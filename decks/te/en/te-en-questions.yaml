cards:
  "te-0157":
    native: "yes"
    alt_native: ["yeah", "yep"]
    notes:
      "n1": "Politely, అవునండీ (avunaṇḍī)."
  "te-0158":
    native: "no; it is not"
    alt_native: ["nope"]
    notes:
      "n1": "కాదు (kādu) denies what something is: ఇది కాఫీ కాదు (idi kāfī kādu), this is not coffee. లేదు (lēdu) denies that something is there or happened."
  "te-0159":
    native: "no; there isn't"
    alt_native: ["nope"]
    notes:
      "n1": "చిల్లర లేదు (cillara lēdu), there's no change."
  "te-0160":
    native: "what"
    notes:
      "n1": "In speech often ఏంటి (ēṇṭi)."
  "te-0161":
    native: "who"
  "te-0162":
    native: "where"
  "te-0163":
    native: "when"
  "te-0164":
    native: "why"
  "te-0165":
    native: "how"
  "te-0166":
    native: "how much"
    notes:
      "n1": "ఎన్ని (enni) is 'how many'."
  "te-0167":
    native: "which one"
  "te-0168":
    native: "Really?"
    notes:
      "n1": "-ఆ (-ā) at the end turns a sentence into a yes/no question: నిజం (true) → నిజమా? (true?)."
