schema: 1
id: "te-en-questions"
kind: "layer"
core: "te-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Yes, no and questions"
description: "Yes and no, the question words, and how a sentence becomes a question. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0157":
    native: "yes"
    alt_native: ["yeah", "yep"]
    notes:
      "n1": "Politely, అవునండీ (avunaṇḍī)."
  "te-0158":
    native: "no; it is not"
    alt_native: ["nope"]
    notes:
      "n1": "కాదు (kādu) denies what something is: ఇది కాఫీ కాదు (idi kāfī kādu), this is not coffee. లేదు (lēdu) denies that something is there or happened."
    "examples": {
      "అది నిజం కాదు.": {"native": "That is not true.", "bases": {}},
      "ఇది నీళ్ళు కాదు.": {"native": "This isn't water.", "bases": {}}
    }
  "te-0159":
    native: "no; there isn't"
    alt_native: ["nope"]
    notes:
      "n1": "చిల్లర లేదు (cillara lēdu), there's no change."
    "examples": {
      "ఇక్కడ సిగ్నల్ లేదు.": {"native": "There is no signal here.", "bases": {}}
    }
  "te-0160":
    native: "what"
    notes:
      "n1": "In speech often ఏంటి (ēṇṭi)."
  "te-0161":
    native: "who"
    "examples": {
      "మీరు ఎవరు?": {"native": "Who are you?", "bases": {}}
    }
  "te-0162":
    native: "where"
  "te-0163":
    native: "when"
    "examples": {
      "ఇక్కడికి ఎప్పుడు వచ్చావు?": {"native": "When did you come here?", "bases": {}},
      "ఓడ ఎప్పుడు బయలుదేరుతుంది?": {"native": "When does the ship leave?", "bases": {}}
    }
  "te-0164":
    native: "why"
    "examples": {
      "అతను ఎందుకు అరుస్తాడు?": {"native": "Why does he shout?", "bases": {}},
      "అదనపు చార్జీ ఎందుకు?": {"native": "Why the extra fare?", "bases": {}}
    }
  "te-0165":
    native: "how"
    "examples": {
      "ఎలా ఉంది?": {"native": "How is it?", "bases": {}},
      "ఎలా చెల్లించాలి?": {"native": "How should I pay?", "bases": {}}
    }
  "te-0166":
    native: "how much"
    notes:
      "n1": "ఎన్ని (enni) is 'how many'."
    "examples": {
      "చలాన్ ఎంత?": {"native": "How much is the e-challan?", "bases": {}}
    }
  "te-0167":
    native: "which one"
    "examples": {
      "ఆమెకు ఇష్టమైన పాట ఏది?": {"native": "Which is her favourite song?", "bases": {}}
    }
  "te-0168":
    native: "Really?"
    notes:
      "n1": "-ఆ (-ā) at the end turns a sentence into a yes/no question: నిజం (true) → నిజమా? (true?)."

  "te-6502":
    native: "Question words"
    explanation: "The words that ask: ēmiṭi (what), evaru (who), ekkaḍa (where), eppuḍu (when), enduku (why), elā (how), enta (how much) and ēdi (which one). Put one in a question to ask about that thing."
