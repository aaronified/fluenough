name: "Telugu archaic and rare letters"
description: "Letters that older print and inscriptions use, and that today's Telugu writes rarely or not at all. Recognition only. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["advanced", "unreviewed", "script"]
cards:
  "te-8650":
    native: "An older r, which today is written ర (ra)."
    notes:
      "n1": "Old print and old inscriptions write ఱ (ra), the shakata repha, in words such as ఱెక్క (rekka, wing), which is written రెక్క (rekka) today. It was a different sound in older Telugu, and most readers now say it as ర (ra), so you need it for old texts only."
  "te-8651":
    native: "A letter for a Dravidian sound, close to ళ (ḷa) but made without the tongue touching the palate."
    notes:
      "n1": "Telugu has let it fall out of use. You meet it in old books and in spellings of other Dravidian words, so a learner who reads an ఴ (ḻa) in a new text can take it as the nearest letter, ళ (ḷa)."
