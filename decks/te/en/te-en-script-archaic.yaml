cards:
  "te-8651":
    native: "A letter for a Dravidian sound, close to ళ (ḷa) but made without the tongue touching the palate."
    notes:
      "n1": "Telugu has let it fall out of use. You meet it in old books and in spellings of other Dravidian words, so a learner who reads an ఴ (ḻa) in a new text can take it as the nearest letter, ళ (ḷa)."
