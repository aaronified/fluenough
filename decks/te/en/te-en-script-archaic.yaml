schema: 1
id: "te-en-script-archaic"
kind: "layer"
core: "te-script-archaic"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Telugu archaic and rare letters"
description: "Letters that older print and inscriptions use, and that today's Telugu writes rarely or not at all. Recognition only. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["advanced", "unreviewed", "script"]
cards:
  "te-8651":
    native: "A retroflex approximant, the sound ɻ, lost from Telugu use; close to ళ (ḷa), but the tongue does not touch the palate."
    notes:
      "n1": "Modern Telugu does not use it. Wikipedia's IPA help page lists ఴ (ḻa) for the sound ɻ and says it is absent in modern Telugu, so you are unlikely to meet it outside old or specialist texts. Do not confuse it with ళ (ḷa), which is a different sound."
  "te-8652":
    native: "A vowel letter for a syllabic l: the sound of l with no vowel of its own. Old and rare; modern Telugu does not use it."
    notes:
      "n1": "Wikipedia's Telugu script article marks this letter 'Not in modern use' in its vowel table, and gives its sound as a syllabic l (IPA /l̩/). You are unlikely to meet it outside old or specialist texts. Its long partner is ౡ (l̥̄)."
  "te-8653":
    native: "The long form of the syllabic l letter: the sound of a long l with no vowel of its own. Archaic; modern Telugu does not use it."
    notes:
      "n1": "Wikipedia's Telugu script article marks this letter archaic in its vowel table, and gives its sound as a long syllabic l (IPA /l̩ː/). Its short partner is ఌ (l̥). You are unlikely to meet it outside old or specialist texts."
  "te-8654":
    native: "The sound ts, written with a letter of its own. Archaic and rarely written: Telugu writing usually uses చ (ca) for this sound instead."
    notes:
      "n1": "Wikipedia's Telugu script article lists this letter under archaic consonants, gives its sound as /t͡sa/, and says it is rarely used and commonly replaced by చ (ca). Do not confuse it with చ (ca), which is the everyday letter."
  "te-8655":
    native: "The sound dz, the voiced partner of ౘ (tsa), written with a letter of its own. Archaic and rarely written: Telugu writing usually uses జ (ja) for this sound instead."
    notes:
      "n1": "Wikipedia's Telugu script article lists this letter under archaic consonants, gives its sound as /d͡za/, and says it is rarely used and commonly replaced by జ (ja). Do not confuse it with జ (ja), which is the everyday letter."
  "te-8656":
    native: "The long vocalic r letter, taught here as the long vocalic r: the sound of a long r with no vowel of its own. This course teaches it here rather than in its vowel set."
    notes:
      "n1": "Wikipedia's Telugu script article gives this letter's sound as a long syllabic r (IPA /r̩ː/) in its vowel table. Unlike ఌ (l̥) and ౡ (l̥̄), the table does not mark it archaic."
