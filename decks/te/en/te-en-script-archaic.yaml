cards:
  "te-8651":
    native: "A retroflex approximant, the sound ɻ, lost from Telugu use; close to ళ (ḷa), but the tongue does not touch the palate."
    notes:
      "n1": "Modern Telugu does not use it. Wikipedia's IPA help page lists ఴ (ḻa) for the sound ɻ and says it is absent in modern Telugu, so you are unlikely to meet it outside old or specialist texts. Do not confuse it with ళ (ḷa), which is a different sound."
