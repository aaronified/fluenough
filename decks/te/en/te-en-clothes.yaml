schema: 1
id: "te-en-clothes"
kind: "layer"
core: "te-clothes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Clothes and colours"
description: "What people wear, from shirt and sari to shoes and bangles, and the colours: red, blue, green, white, black, pink and more. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0911":
    native: "clothes"
    alt_native: ["clothing"]
    wiktionary: true
    notes:
      "n1": "Always plural. The singular {1} is cloth."
    "examples": {
      "బట్టలు ఆరేయండి.": {"native": "Hang the clothes out to dry.", "bases": {}},
      "బట్టలు ఉతకండి.": {"native": "Wash the clothes.", "bases": {}}
    }
  "te-0912":
    native: "shirt"
    wiktionary: true
    notes:
      "n1": "Also {1} in speech."
    "examples": {
      "ఆ చొక్కా ఖరీదైనది.": {"native": "That shirt is expensive.", "bases": {}},
      "చొక్కా ఇస్త్రీ చేయండి.": {"native": "Iron the shirt.", "bases": {}}
    }
  "te-0913":
    native: "trousers"
    alt_native: ["pants"]
    notes:
      "n1": "A word from English."
  "te-0914":
    native: "sari"
    wiktionary: true
    notes:
      "n1": "A long cloth wrapped around the body."
    "examples": {
      "అమ్మ రోజూ చీర కట్టుకుంటుంది.": {"native": "Mum wears a sari every day.", "bases": {}}
    }
  "te-0915":
    native: "dhoti"
    wiktionary: true
    notes:
      "n1": "A cloth worn wrapped around the waist and legs."
    "examples": {
      "నేను పంచె కట్టుకుంటాను.": {"native": "I wear a dhoti.", "bases": {}}
    }
  "te-0916":
    native: "skirt; petticoat"
    wiktionary: true
    notes:
      "n1": "Also the long skirt of a half sari."
  "te-0917":
    native: "coat; jacket"
    alt_native: ["jacket"]
    wiktionary: true
    notes:
      "n1": "A word from English."
    "examples": {
      "ఆ కోటు చాలా ఖరీదైనది.": {"native": "That coat is very expensive.", "bases": {}}
    }
  "te-0918":
    native: "cap; hat"
    wiktionary: true
    notes:
      "n1": "A word shared with Hindi and Urdu."
    "examples": {
      "నేను టోపీ వేసుకుంటాను.": {"native": "I put on a cap.", "bases": {}},
      "పిల్లలు టోపీ పెట్టుకుంటారు.": {"native": "The children wear caps.", "bases": {"పెట్టుకుంటారు": "to put on (oneself)"}}
    }
  "te-0919":
    native: "shoes"
    wiktionary: true
    notes:
      "n1": "Always plural for a pair. The singular {1} is one shoe."
    "examples": {
      "నా బూట్లు నల్లవి.": {"native": "My shoes are black.", "bases": {}},
      "ఈ జత బూట్లు సరిపోతాయా?": {"native": "Will this pair of shoes fit?", "bases": {}}
    }
  "te-0920":
    native: "sandals; slippers"
    wiktionary: true
    notes:
      "n1": "Always plural for a pair. The singular {1} is one sandal."
    "examples": {
      "నేను చెప్పులు వేసుకుంటాను.": {"native": "I put on my sandals.", "bases": {"వేసుకుంటాను": "to put on (clothes, shoes)"}},
      "నాకు ఒక జత చెప్పులు కావాలి.": {"native": "I need a pair of sandals.", "bases": {}}
    }
  "te-0921":
    native: "socks"
    notes:
      "n1": "A word from English, with the plural -లు (-lu) added."
  "te-0922":
    native: "handkerchief; small cloth"
    alt_native: ["hanky"]
    wiktionary: true
    notes:
      "n1": "A handkerchief, or a small cloth worn on the head."
  "te-0923":
    native: "pocket"
    wiktionary: true
    notes:
      "n1": "A word from Persian."
    "examples": {
      "జేబులో డబ్బులు ఉన్నాయి.": {"native": "There is money in the pocket.", "bases": {"జేబులో": "pocket"}}
    }
  "te-0924":
    native: "belt"
    notes:
      "n1": "A word from English."
  "te-0925":
    native: "jewellery"
    alt_native: ["jewelry"]
    wiktionary: true
    notes:
      "n1": "Always plural. The singular {1} is one piece."
    "examples": {
      "బంగారు నగలు కొన్నారు.": {"native": "They bought gold jewellery.", "bases": {}}
    }
  "te-0926":
    native: "bangles"
    wiktionary: true
    notes:
      "n1": "The singular {1} is one bangle, and also glass."
  "te-0927":
    native: "colour"
    alt_native: ["color"]
    wiktionary: true
    notes:
      "n1": "Also paint, and the colour of a face or cloth."
    "examples": {
      "ఇది గులాబీ రంగు చీర.": {"native": "This is a pink sari.", "bases": {}},
      "ఈ బట్ట రంగు ఆకర్షణీయమైనది.": {"native": "The colour of this cloth is attractive.", "bases": {}}
    }
  "te-0928":
    native: "red"
    wiktionary: true
    notes:
      "n1": "Before a noun it becomes {1}: {2}, a red sari."
  "te-0929":
    native: "blue"
    wiktionary: true
    notes:
      "n1": "Before a noun it can be {1}: {2}, blue."
    "examples": {
      "ఈ చొక్కా నీలం రంగులో ఉంది.": {"native": "This shirt is blue (in colour).", "bases": {}},
      "ఈ రోజు ఆకాశం నీలంగా ఉంది.": {"native": "The sky is blue today.", "bases": {}}
    }
  "te-0930":
    native: "green"
    wiktionary: true
    notes:
      "n1": "Built from {1}, a leaf, and {2}, green."
  "te-0931":
    native: "white"
    wiktionary: true
    notes:
      "n1": "Before a noun it becomes {1}: {2}, a white shirt."
  "te-0932":
    native: "black"
    wiktionary: true
    notes:
      "n1": "Before a noun it becomes {1}: {2}, black hair."
  "te-0933":
    native: "pink; a rose"
    notes:
      "n1": "The same word is the rose and its colour."
    "examples": {
      "ఇది గులాబీ రంగు చీర.": {"native": "This is a pink sari.", "bases": {}}
    }
  "te-0934":
    native: "purple; violet"
    alt_native: ["violet"]
    wiktionary: true
    notes:
      "n1": "Also {1}."

  "te-6508":
    native: "The colours"
    explanation: "The colour words: erupu (red), nīlaṁ (blue), ākupacca (green), telupu (white), nalupu (black), gulābī (pink) and pasupu (yellow)."
