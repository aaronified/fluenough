schema: 1
id: "te-en-grammar-sentences"
kind: "layer"
core: "te-grammar-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Basic sentences"
description: "Word order, no 'is', and how Telugu says 'have' and 'like'. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "te-0147":
    native: "I am a student."
    notes:
      "n1": "No separate 'am': the ending -ని (-ni) on విద్యార్థి (vidyārthi) says it."
  "te-0148":
    native: "This is my house."
    alt_native: ["This is my home."]
    notes:
      "n1": "There is no 'is' in the present."
  "te-0149":
    native: "I drink tea."
    alt_native: ["I take tea."]
    notes:
      "n1": "Subject, object, verb: the verb comes last."
  "te-0150":
    native: "She is learning Telugu."
    alt_native: ["She is studying Telugu."]
    bases:
      "తెలుగు": "Telugu (the language)"
  "te-0151":
    native: "I like Telugu."
    alt_native: ["I enjoy Telugu."]
    notes:
      "n1": "'To me, Telugu is liked': the one who likes takes -కి (-ki) or -కు (-ku)."
    bases:
      "తెలుగు": "Telugu (the language)"
  "te-0152":
    native: "I have a car."
    alt_native: ["I own a car.", "I have got a car."]
    notes:
      "n1": "'To me there is a car': ఉంది (undi), 'there is'."
  "te-0153":
    native: "I don't have any money on me."
    alt_native: ["I have no money on me."]
    notes:
      "n1": "లేవు (lēvu), 'there aren't', agrees with the plural డబ్బులు (ḍabbulu)."
  "te-0154":
    native: "This isn't good."
    bases:
      "బాగా": "good; well"
  "te-0155":
    native: "Please don't go."
    alt_native: ["Please do not leave."]
    notes:
      "n1": "-కండి (-kaṇḍi) makes a polite 'don't'."
  "te-0156":
    native: "It's very hot today."
    alt_native: ["Today is very hot.", "It is really hot today."]
