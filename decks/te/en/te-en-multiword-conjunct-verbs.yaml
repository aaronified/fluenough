id: "te-en-multiword-conjunct-verbs"
kind: "layer"
core: "te-multiword-conjunct-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: conjunct verbs"
description: "Twenty verb phrases of a noun and a light verb: have a meal, have a job, do business, do yoga, perform a puja, make a complaint, fast, be late, be spent, get done, be troubled, feel hurt, take trouble, swim, clap, give advice, give permission, give time, give a gift, and give notice. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "te-9100":
    native: "to have a meal"
    notes:
      "u1": "భోజనం (bhōjanaṁ) చేయడం (cēyaḍaṁ) means to have a meal, a sit-down meal rather than a snack."
  "te-9101":
    native: "to have a job; to work at a job"
    notes:
      "u1": "ఉద్యోగం (udyōgaṁ) చేయడం (cēyaḍaṁ) means to have a job, to work for an employer. Compare పని (pani) చేయడం (cēyaḍaṁ), to work in general."
  "te-9102":
    native: "to do business; to run a business"
    notes:
      "u1": "వ్యాపారం (vyāpāraṁ) చేయడం (cēyaḍaṁ) means to trade or run a business of one's own."
  "te-9103":
    native: "to do yoga"
    notes:
      "u1": "యోగా (yōgā) చేయడం (cēyaḍaṁ) means to practise yoga as an exercise or a daily discipline."
  "te-9104":
    native: "to perform a puja; to worship"
    notes:
      "u1": "పూజ (pūja) చేయడం (cēyaḍaṁ) means to perform a puja, a Hindu act of worship at home or at a temple."
  "te-9105":
    native: "to make a complaint"
    notes:
      "u1": "ఫిర్యాదు (phiryādu) చేయడం (cēyaḍaṁ) means to make a formal complaint, to an office, a company or the police."
  "te-9106":
    native: "to fast"
    notes:
      "u1": "ఉపవాసం (upavāsaṁ) చేయడం (cēyaḍaṁ) means to fast, to go without food for a set time, usually for religious reasons. Also ఉపవాసం (upavāsaṁ) ఉండడం (uṇḍaḍaṁ), to keep a fast."
  "te-9107":
    native: "to be late; to be delayed"
    notes:
      "u1": "ఆలస్యం (ālasyaṁ) అవడం (avaḍaṁ) is said of something that happens late: the train is late, the meeting is delayed. The verb అవడం (avaḍaṁ) means to become."
    bases:
      "అవడం": { meaning: "to become; to happen" }
  "te-9108":
    native: "to be spent"
    notes:
      "u1": "ఖర్చు (kharcu) అవడం (avaḍaṁ) is said of money that is spent or used up, not of the person who spends it."
    bases:
      "అవడం": { meaning: "to become; to happen" }
  "te-9109":
    native: "to get done"
    notes:
      "u1": "పని (pani) అవడం (avaḍaṁ) means that a task gets done or is finished. For working, use పని (pani) చేయడం (cēyaḍaṁ)."
    bases:
      "అవడం": { meaning: "to become; to happen" }
  "te-9110":
    native: "to be troubled; to have difficulty"
    notes:
      "u1": "ఇబ్బంది (ibbandi) పడడం (paḍaḍaṁ) is said of a person who has trouble or difficulty. Here పడడం (paḍaḍaṁ) marks a state one is in, not the sense of falling."
    bases:
      "పడడం": { meaning: "to feel; to undergo a state (not to fall)" }
  "te-9111":
    native: "to feel hurt; to grieve"
    notes:
      "u1": "బాధ (bādha) పడడం (paḍaḍaṁ) means to feel hurt or to grieve over something. The verb is the same one as in ఇబ్బంది (ibbandi) పడడం (paḍaḍaṁ)."
    bases:
      "పడడం": { meaning: "to feel; to undergo a state (not to fall)" }
  "te-9112":
    native: "to take trouble; to make an effort"
    notes:
      "u1": "శ్రమ (śrama) పడడం (paḍaḍaṁ) means to take trouble, to work hard toward a goal."
    bases:
      "శ్రమ": { meaning: "effort; hard work" }
      "పడడం": { meaning: "to feel; to undergo a state (not to fall)" }
  "te-9113":
    native: "to swim"
    notes:
      "u1": "ఈత (īta) కొట్టడం (koṭṭaḍaṁ) means to swim. The verb is the one for hitting, here used for striking the water with the arms and legs."
    bases:
  "te-9114":
    native: "to clap"
    notes:
      "u1": "చప్పట్లు (cappaṭlu) కొట్టడం (koṭṭaḍaṁ) means to clap the hands, as an audience does for a performer."
    bases:
      "చప్పట్లు": { meaning: "clapping; applause" }
  "te-9115":
    native: "to give advice"
    notes:
      "u1": "సలహా (salahā) ఇవ్వడం (ivvaḍaṁ) means to give advice to someone, who is the object of the verb."
  "te-9116":
    native: "to give permission"
    notes:
      "u1": "అనుమతి (anumati) ఇవ్వడం (ivvaḍaṁ) means to give permission, to allow someone to do something."
  "te-9117":
    native: "to give time; to extend a deadline"
    notes:
      "u1": "గడువు (gaḍuvu) ఇవ్వడం (ivvaḍaṁ) means to give someone more time, for example to finish work."
  "te-9118":
    native: "to give a gift; to give a prize"
    notes:
      "u1": "బహుమతి (bahumati) ఇవ్వడం (ivvaḍaṁ) means to give a gift to someone; it is also used for giving a prize to a winner."
  "te-9119":
    native: "to give notice"
    notes:
      "u1": "నోటీసు (nōṭīsu) ఇవ్వడం (ivvaḍaṁ) means to give a formal notice, such as a warning from an office or notice that one is leaving a job."
