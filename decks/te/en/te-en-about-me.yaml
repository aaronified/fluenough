core: "te-about-me"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "About me"
description: "Your name, where you are from, where you live, and the people around you. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0190":
    native: "name"
  "te-0191":
    native: "My name is …"
    notes:
      "n1": "There is no 'is': 'my name …'."
  "te-0192":
    native: "What is your name?"
  "te-0193":
    native: "I'm from …"
    notes:
      "n1": "Literally 'I came from …'. నుంచి (nuñci), 'from', comes after the place. రావడం (rāvaḍam) changes its stem in the past: వచ్చ- (vacc-)."
    bases:
      "నుంచి": "from (after a noun)"
  "te-0194":
    native: "I live in …"
    notes:
      "n1": "-లో (lō), 'in', joins the end of the place: హైదరాబాద్‌లో (haidarābādlō), in Hyderabad."
    bases:
      "లో": "in (an ending)"
  "te-0195":
    native: "home; house"
  "te-0196":
    native: "family"
  "te-0197":
    native: "work"
  "te-0198":
    native: "town; home town"
    notes:
      "n1": "మీది ఏ ఊరు (mīdi ē ūru)? Which is your home town? A common first question."
  "te-0199":
    native: "country"
  "te-0200":
    native: "language"
