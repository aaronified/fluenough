schema: 1
id: "te-en-phonology-consonants"
kind: "layer"
core: "te-phonology-consonants"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Telugu consonant sounds (IPA)"
description: "The consonant phonemes of Telugu, one card each: the IPA symbol, the letter, example words and, where this course's words give one, a minimal pair. For learners who know the IPA or want to learn it. Variety taught: standard (Coastal Andhra) colloquial Telugu. This is a proposal, not yet confirmed by the owner, a Telugu speaker or a phonetician. Where a source describes another dialect, the card says so."
license: "CC-BY-SA-4.0"
authors:
  - { name: "Fluenough contributors" }
  - { name: "Wikipedia contributors (Telugu language; Help:IPA/Telugu)", url: "https://en.wikipedia.org/wiki/Telugu_language" }
source: "Bhaskararao and Ray (2017), 'Illustrations of the IPA: Telugu', Journal of the International Phonetic Association 47(2): 231-241, doi 10.1017/S0025100316000207 (named in Wikipedia's references; the article itself was not read); Krishnamurti (2003), The Dravidian Languages, Cambridge University Press, and Lisker and Krishnamurti (1991), Proceedings of the XIIth International Congress of Phonetic Sciences 2: 90-93 (both as cited by Wikipedia). Text adapted from Wikipedia, 'Telugu language' (section Phonology) and 'Help:IPA/Telugu', CC BY-SA 4.0, https://en.wikipedia.org/wiki/Telugu_language"
tags: ["ipa", "phonology", "unreviewed"]
cards:
  "te-6570":
    native: "voiced bilabial nasal (m); the letter మ (ma)"
    notes:
      "n1": "The m of 'much'. Telugu has three nasal phonemes: m, n and the curled-back ɳ. A word may end in m. In colloquial speech a later or final m is often said as a nasalised w: see the allophones deck."
      "n2": "Minimal pair among this course's words: {1}, you (respectful); you (plural), and {2}, water, differ only in m against n."
    examples:
      "మేక": "goat"
      "మీరు": "you (respectful); you (plural)"
  "te-6571":
    native: "voiced denti-alveolar nasal (n); the letter న (na)"
    notes:
      "n1": "The n of 'not'. The table puts n in the denti-alveolar column with t̪, d̪ and l: the tongue tip is at the teeth or just behind them. Compare ɳ, said with the tongue tip curled back."
      "n2": "Minimal pair among this course's words: {1}, you (respectful); you (plural), and {2}, water, differ only in n against m."
    examples:
      "నీరు": "water"
      "నది": "river"
  "te-6572":
    native: "voiced retroflex nasal (ɳ); the letter ణ (ṇa)"
    notes:
      "n1": "An n with the tongue tip curled back. It occurs between vowels and next to another curled-back consonant, as in వీణ (vīṇa) and పండు (paṇḍu). Unlike the other curled-back consonants, ɳ and ɭ do not begin words. In some colloquial speech ɳ merges with n."
    examples:
      "వీణ": "veena (a South Indian string instrument)"
      "పండు": "fruit; ripe"
  "te-6573":
    native: "voiceless bilabial stop (p), with no puff of breath; the letter ప (pa)"
    notes:
      "n1": "Like the p of 'span' in Wikipedia's comparison: the lips open without a puff of breath. The aspirated pʰ is a separate sound, found mostly in words from Sanskrit and Prakrit."
      "n2": "Minimal pair among this course's words: {1}, basket, and {2}, anthill; termite mound, differ only in voice, b against p."
    examples:
      "పాలు": "milk"
      "పని": "work"
  "te-6574":
    native: "voiceless dental stop (t̪), with no puff of breath; the letter త (ta)"
    notes:
      "n1": "The tongue tip rests on the back of the upper teeth. Wikipedia's table lists this sound in the denti-alveolar column and writes it t; its IPA help page writes it dental, and says that it and the curled-back ʈ both sound like English t to most English speakers. This course writes t̪, as its other Telugu cards do."
      "n2": "Minimal pair among this course's words: {1}, harvest; a cut, and {2}, fort, differ only in the place of the t: on the teeth, or curled back (t̪ against ʈ)."
    examples:
      "తల": "head"
      "తలుపు": "door"
  "te-6575":
    native: "voiceless retroflex stop (ʈ), with no puff of breath; the letter ట (ṭa)"
    notes:
      "n1": "The tongue tip curls back to touch behind the ridge. All the curled-back consonants occur between vowels and next to another curled-back consonant, and a few words begin with ʈ, ɖ, ʈʰ or ʂ, such as ṭakku 'pretence' and ṭhīvi 'grandeur' (examples from the source)."
      "n2": "Minimal pair among this course's words: {1}, fort, and {2}, harvest; a cut, differ only in the place of the t: curled back, or on the teeth (ʈ against t̪)."
    examples:
      "టీ": "tea"
      "కోట": "fort"
  "te-6576":
    native: "voiceless velar stop (k), with no puff of breath; the letter క (ka)"
    notes:
      "n1": "Like the k of 'scan' in Wikipedia's comparison: no puff of breath after it. The aspirated kʰ is found mostly in words from Sanskrit and Prakrit."
      "n2": "Minimal pair among this course's words: {1}, right (side), and {2}, temple, differ only in voice, k against g."
    examples:
      "కాలు": "leg; foot"
      "కత్తి": "knife"
  "te-6577":
    native: "voiced bilabial stop (b); the letter బ (ba)"
    notes:
      "n1": "The b of 'abash' in Wikipedia's comparison, said with the lips and with voice. The breathy bʱ is a separate sound, found mostly in words from Sanskrit and Prakrit."
      "n2": "Minimal pair among this course's words: {1}, basket, and {2}, anthill; termite mound, differ only in voice, b against p."
    examples:
      "బడి": "school"
      "బయట": "outside"
  "te-6578":
    native: "voiced dental stop (d̪); the letter ద (da)"
    notes:
      "n1": "The voiced partner of t̪, with the tongue tip on the back of the upper teeth. Wikipedia's IPA help page notes that some speakers use the dental stops d̪ and t̪ in place of English th (th-stopping)."
      "n2": "Minimal pair among this course's words: {1}, dust, and {2}, sneeze, differ only in voice, d̪ against t̪."
    examples:
      "దారి": "way; route"
      "నది": "river"
  "te-6579":
    native: "voiced retroflex stop (ɖ); the letter డ (ḍa)"
    notes:
      "n1": "The voiced partner of ʈ, with the tongue tip curled back. The source adds that the Proto-Dravidian approximant */ɻ/ merged with ɖ in Telugu."
      "n2": "Minimal pair among this course's words: {1}, to help (someone in need), and {2}, to play (as a child), differ only in the place of the d: on the teeth, or curled back (d̪ against ɖ)."
    examples:
      "గుడి": "temple"
      "ఓడ": "ship"
  "te-6580":
    native: "voiced velar stop (ɡ); the letter గ (ga)"
    notes:
      "n1": "The g of 'agate' in Wikipedia's comparison, made at the back of the tongue with voice. The breathy ɡʱ is found mostly in words from Sanskrit and Prakrit."
      "n2": "Minimal pair among this course's words: {1}, temple, and {2}, right (side), differ only in voice, g against k."
    examples:
      "గది": "room"
      "గోరు": "nail (of a finger or toe)"
  "te-6581":
    native: "voiceless postalveolar affricate (tʃ); the letter చ (ca)"
    notes:
      "n1": "The tch of 'catch' in Wikipedia's comparison, with no puff of breath. Sources disagree with this course's other cards on one point: Wikipedia, after the JIPA illustration, says native words with tʃ before a back or central vowel became ts, so that the letter చ (ca) there stands for ts (see the ts card). This course's other cards write tʃ for చ (ca) everywhere. A Telugu speaker needs to settle which words."
      "n2": "Minimal pair among this course's words: {1}, cultivated field; a plot under crops, and {2}, I, differ only in the first sound, tʃ against n."
    examples:
      "చేప": "fish"
      "చీర": "sari"
  "te-6582":
    native: "voiceless alveolar affricate (ts); once the letter ౘ (ts), today usually చ (ca)"
    notes:
      "n1": "The source gives ts and dz as phonemes of native words only, with no aspirated or breathy forms. Native words with tʃ or dʒ before a back or central vowel became ts and dz, and the change became a phoneme after words with tʃ and dʒ were borrowed. In colloquial speech ts is often said s (ts, ph and dz become s, f and j). No example word is given: the sources used name none with a gloss."
      "n2": "The old letter ౘ (ts) is listed in Wikipedia's IPA help page for ts. Modern spelling writes చ (ca) for both tʃ and ts."
  "te-6583":
    native: "voiced alveolar affricate (dz); once the letter ౙ (dz), today usually జ (ja)"
    notes:
      "n1": "The voiced partner of ts, in native words only. Between vowels it can become z. The source's example, said rāzu, is రాజు (rāju) in spelling. This course's own card for రాజు (rāju), king, writes it with dʒ, so the sources and the course differ: a Telugu speaker needs to settle it."
      "n2": "The old letter ౙ (dz) is listed in Wikipedia's IPA help page for dz or z. Modern spelling writes జ (ja) for both dʒ and dz."
    examples:
      "రాజు": "king"
  "te-6584":
    native: "voiced postalveolar affricate (dʒ); the letter జ (ja)"
    notes:
      "n1": "The j of 'jest' in Wikipedia's comparison. Before e, ē, i and ī it stays dʒ; before a, ā, u and o in native words the source has dz (see the dz card). The breathy dʒʱ is found mostly in words from Sanskrit and Prakrit."
    examples:
      "జేబు": "pocket"
      "జీతం": "salary; pay"
  "te-6585":
    native: "voiceless aspirated bilabial stop (pʰ): p with a puff of breath; the letter ఫ (pha)"
    notes:
      "n1": "A p followed by a puff of breath, mostly in words from Sanskrit and Prakrit. In colloquial speech pʰ becomes f. The same letter ఫ (pha) writes f in English loans: see the f card."
    examples:
      "ఫలితం": "result"
  "te-6586":
    native: "voiceless aspirated dental stop (t̪ʰ): t̪ with a puff of breath; the letter థ (tha)"
    notes:
      "n1": "A t̪ with a puff of breath, mostly in words from Sanskrit and Prakrit. The source adds that tʰ is used for English th in loans."
      "n2": "Minimal pair among this course's words: {1}, medal, and {2}, scheme; plan, differ only in the breath after the t: t̪ against t̪ʰ."
    examples:
      "కథ": "story"
      "పథకం": "scheme; plan"
  "te-6587":
    native: "voiceless aspirated retroflex stop (ʈʰ): ʈ with a puff of breath; the letter ఠ (ṭha)"
    notes:
      "n1": "A curled-back ʈ with a puff of breath, in words from Sanskrit and Prakrit. A few words begin with it, such as ṭhīvi 'grandeur'."
    examples:
      "పాఠం": "lesson"
      "మిఠాయి": "a sweet; sweets"
  "te-6588":
    native: "voiceless aspirated postalveolar affricate (tʃʰ): tʃ with a puff of breath; the letter ఛ (cha)"
    notes:
      "n1": "A tʃ with a puff of breath (the 'ch' of 'choose' in Wikipedia's comparison), mostly in words from Sanskrit and Prakrit."
    examples:
      "ఛాయ": "complexion; skin tone"
      "స్వేచ్ఛ": "freedom; liberty"
  "te-6589":
    native: "voiceless aspirated velar stop (kʰ): k with a puff of breath; the letter ఖ (kha)"
    notes:
      "n1": "A k with a puff of breath, mostly in words from Sanskrit and Prakrit. Telangana speech tends to have fewer aspirated consonants."
    examples:
      "ముఖం": "face"
      "ఖాళీ": "empty; free (not busy)"
  "te-6590":
    native: "voiced breathy bilabial stop (bʱ): b said with breathy voice; the letter భ (bha)"
    notes:
      "n1": "A b said with breathy voice, mostly in words from Sanskrit and Prakrit. The source calls the series 'breathy voiced' and the voiceless one 'aspirated'."
    examples:
      "భాష": "language"
      "భయం": "fear"
  "te-6591":
    native: "voiced breathy dental stop (d̪ʱ); the letter ధ (dha)"
    notes:
      "n1": "The breathy partner of d̪. The source says it is the only aspirate that occurs natively, in a few compound numbers such as 18, where an unaspirated form is more common, and suggests a link with the Proto-Dravidian laryngeal */H/. Elsewhere it is in words from Sanskrit and Prakrit."
    examples:
      "ధర": "price"
      "వీధి": "street"
  "te-6592":
    native: "voiced breathy retroflex stop (ɖʱ); the letter ఢ (ḍha)"
    notes:
      "n1": "The breathy partner of ɖ, in words from Sanskrit and Prakrit and in names such as Delhi."
    examples:
      "ఢిల్లీ": "Delhi"
  "te-6593":
    native: "voiced breathy postalveolar affricate (dʒʱ); the letter ఝ (jha)"
    notes:
      "n1": "The breathy partner of dʒ, in words from Sanskrit and Prakrit. It is rare: no word of this course's cards has it, so this card has no example word."
  "te-6594":
    native: "voiced breathy velar stop (ɡʱ); the letter ఘ (gha)"
    notes:
      "n1": "The breathy partner of ɡ, mostly in words from Sanskrit and Prakrit."
    examples:
      "మేఘం": "cloud"
      "సంఘటన": "incident; event"
  "te-6595":
    native: "voiceless alveolar sibilant (s); the letter స (sa)"
    notes:
      "n1": "The s of 'save' in Wikipedia's comparison. The source says s is the only fricative that occurs in native words: ʃ, ʂ, f and h occur in loans. In Standard Telugu and most dialects the letter శ (śa) is also said s, and Telangana dialects merge ś with ṣ."
    examples:
      "బస": "stay (a time spent in a place, such as a hotel)"
      "సభ": "hall; meeting; gathering"
  "te-6596":
    native: "voiceless postalveolar fricative (ʃ); the letter శ (śa)"
    notes:
      "n1": "The sh of 'mosh' in Wikipedia's comparison. A phoneme in the JIPA-based table, found in loans. In colloquial speech it is often said s (see the allophones deck)."
      "n2": "Minimal pair among this course's words: {1}, vomit; being sick, and {2}, peace, differ only in the first sound, ʋ against ʃ."
    examples:
      "ఆశ": "hope"
      "దోశ": "dosa; a thin pancake"
  "te-6597":
    native: "voiceless retroflex fricative (ʂ); the letter ష (ṣa)"
    notes:
      "n1": "An sh with the tongue tip curled back, in loanwords. Wikipedia's IPA help page gives పరిషత్ (pariṣat) as its example."
    examples:
      "భాష": "language"
      "కష్టం": "difficult; hard"
  "te-6598":
    native: "voiceless glottal fricative (h); the letter హ (ha)"
    notes:
      "n1": "The h of 'head'. The JIPA-based table writes h; Wikipedia's IPA help page writes the voiced ɦ, as in 'ahead'. The sources differ, and a Telugu speaker needs to settle which one this course should write."
      "n2": "Minimal pair among this course's words: {1}, sitting room; hall, and {2}, milk, differ only in the first sound, h against p."
    examples:
      "హాలు": "sitting room; hall"
      "గుహ": "cave"
  "te-6599":
    native: "voiceless labiodental fricative (f); written ఫ (pha) in loans"
    notes:
      "n1": "The f of English 'fan', in loanwords only. It is written with the letter ఫ (pha), the same letter as pʰ; in colloquial speech pʰ also becomes f."
      "n2": "Minimal pair among this course's words: {1}, copy, and {2}, coffee, differ only in p against f."
    examples:
      "ఫోన్": "phone"
      "కాఫీ": "coffee"
  "te-6600":
    native: "voiced labiodental approximant (ʋ); the letter వ (va)"
    notes:
      "n1": "Wikipedia's IPA help page compares it to the v of Indian English. Near rounded vowels it can be rounded (see the allophones deck)."
      "n2": "Minimal pair among this course's words: {1}, to come, and {2}, to write, differ only in the middle sound, ʋ against j."
    examples:
      "వారం": "week"
      "వీణ": "veena (a South Indian string instrument)"
  "te-6601":
    native: "voiced lateral approximant (l); the letter ల (la)"
    notes:
      "n1": "The l of 'leaf'. Compare ɭ, said with the tongue tip curled back."
      "n2": "Minimal pair among this course's words: {1}, car, and {2}, leg; foot, differ only in the middle sound, ɾ against l."
    examples:
      "పాలు": "milk"
      "కాలు": "leg; foot"
  "te-6602":
    native: "voiced retroflex lateral approximant (ɭ); the letter ళ (ḷa)"
    notes:
      "n1": "An l with the tongue tip curled back. Like ɳ it does not begin a word, and in some colloquial speech it merges with l. Its source gives kaḷa 'art' as an example."
      "n2": "Minimal pair among this course's words: {1}, dream, and {2}, art (painting, music, dance and the like), differ only in the second consonant, l against ɭ."
    examples:
      "కళ": "art (painting, music, dance and the like)"
      "తాళం": "lock"
  "te-6603":
    native: "palatal approximant (j); the letter య (ya)"
    notes:
      "n1": "The y of 'yak' in Wikipedia's comparison. The source says j begins a word only in borrowed words, such as yangu from English 'young' (its example)."
      "n2": "Minimal pair among this course's words: {1}, to come, and {2}, to write, differ only in the middle sound, ʋ against j."
    examples:
      "రాయి": "stone"
      "లయ": "rhythm; beat"
  "te-6604":
    native: "alveolar tap (ɾ); the letter ర (ra)"
    notes:
      "n1": "A single quick tap of the tongue tip. The old letter ఱ (ṟa) once stood for a trill; modern spelling writes ర (ra), as this course's spelling deck says."
      "n2": "Minimal pair among this course's words: {1}, finger, and {2}, root (of a plant), differ only in l against ɾ."
    examples:
      "వేరు": "root (of a plant)"
      "ధర": "price"
