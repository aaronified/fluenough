schema: 1
id: "te-en-sound-inventory"
kind: "layer"
core: "te-sound-inventory"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Telugu sounds, one by one"
description: "Every sound of Telugu on a card: the vowels short and long, the consonants by place with their breathy and curled-back forms, the closing m and breath signs and the double consonants. Each says whether the sound is the same as, close to or new to English, and how. Variety taught: standard (Coastal Andhra) colloquial Telugu. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
authors:
  - { name: "Fluenough contributors" }
  - { name: "Wikipedia contributors (Telugu language; Help:IPA/Telugu)", url: "https://en.wikipedia.org/wiki/Telugu_language" }
tags: ["beginner", "unreviewed", "sounds"]
cards:
  "te-9258":
    native: "short a (a)"
    notes:
      "n1": "Close to English: like the u of 'cut' in Wikipedia's comparison, said short. The long ఆ (ā) is its partner: కలం (kalaṁ, pen) against కాలం (kālaṁ, time)."
    examples:
      "అడవి": "forest"
  "te-9259":
    native: "long a (ā)"
    notes:
      "n1": "Close to English: the a of 'father', held longer than అ (a). English has long and short vowels, but length never changes a word there as it does in Telugu, so the holding is the new part."
    examples:
      "ఆకు": "leaf"
  "te-9260":
    native: "short i (i)"
    notes:
      "n1": "Close to English: the i of 'dill', said short. The long ఈ (ī) is its partner."
    examples:
      "ఇల్లు": "home; house"
  "te-9261":
    native: "long i (ī)"
    notes:
      "n1": "Close to English: the ee of 'feet', held longer than ఇ (i). The length is what changes the word."
    examples:
      "ఈగ": "fly"
  "te-9262":
    native: "short u (u)"
    notes:
      "n1": "Close to English: the oo of 'foot', said short. A Telugu word often ends in this u, as పండు (paṇḍu, fruit) does."
    examples:
      "ఉప్పు": "salt"
  "te-9263":
    native: "long u (ū)"
    notes:
      "n1": "Close to English: the oo of 'cool', held longer than ఉ (u)."
    examples:
      "ఊరు": "town; home town"
  "te-9264":
    native: "short e (e)"
    notes:
      "n1": "Close to English: the e of 'yell', said short and steady. The long ఏ (ē) is its partner."
    examples:
      "ఎలుక": "rat; mouse"
  "te-9265":
    native: "long e (ē)"
    notes:
      "n1": "Close to English: the a of 'Yale' in Wikipedia's comparison, held longer than ఎ (e). Hold it steady, and do not let it slide to an i as English 'ay' does."
    examples:
      "ఏనుగు": "elephant"
  "te-9266":
    native: "short o (o)"
    notes:
      "n1": "Close to English: the o of 'story' said short and steady. A Telugu word does not end in this short o."
    examples:
      "ఒకటి": "1, one"
  "te-9267":
    native: "long o (ō)"
    notes:
      "n1": "Close to English: the o of 'story', held longer than ఒ (o). Hold it steady, and do not let it slide to a u as English 'oh' does."
    examples:
      "ఓడ": "ship"
  "te-9268":
    native: "the diphthong ai (ai)"
    notes:
      "n1": "Close to English: a glide from a to i, like the i of 'kite'."
    examples:
      "ఐదు": "5, five"
  "te-9269":
    native: "the diphthong au (au)"
    notes:
      "n1": "Close to English: a glide from a to u, like the ou of 'house', mostly in words from Sanskrit."
    examples:
      "ఔషధం": "medicine"
  "te-9270":
    native: "ru, written as a vowel (ru)"
    notes:
      "n1": "Close to English: a vowel letter that this course writes and says ru: the Telugu tap of ర (ra), then u. It is found in words from Sanskrit."
    examples:
      "ఋతువు": "season"
  "te-9271":
    native: "k, with no puff of breath (ka)"
    notes:
      "n1": "Close to English: the k of 'skin', with no puff of breath after it. English k at the start of a word ('kin') has a puff, so keep Telugu క plain."
    examples:
      "కాలు": "leg; foot"
  "te-9272":
    native: "kh, k with a puff of breath (kha)"
    notes:
      "n1": "Close to English: the k of 'kin', with its puff of breath. English never uses the puff to tell two words apart, but in Telugu ఖ (kha) against క (ka) does. Found mostly in words from Sanskrit."
    examples:
      "ముఖం": "face"
  "te-9273":
    native: "g (ga)"
    notes:
      "n1": "Close to English: the g of 'agate', said with voice. The breathy ఘ (gha) is its partner."
    examples:
      "గది": "room"
  "te-9274":
    native: "gh, g with breathy voice (gha)"
    notes:
      "n1": "New to English: a g said with a breathy, murmured voice, in one breath with the g and not a g followed by an h. English has no such sound. Found mostly in words from Sanskrit."
    examples:
      "మేఘం": "cloud"
  "te-9275":
    native: "ng (ṅa)"
    notes:
      "n1": "Close to English: the ng of 'sing'. As a letter ఙ (ṅa) is rare, and found in words from Sanskrit."
    examples:
      "వాఙ్మయం": "literature"
  "te-9276":
    native: "c, as in 'catch' (ca)"
    notes:
      "n1": "Close to English: the tch of 'catch', with no puff of breath. The aspirated ఛ (cha) is its partner."
    examples:
      "చేప": "fish"
  "te-9277":
    native: "ch, c with a puff of breath (cha)"
    notes:
      "n1": "Close to English: the ch of 'choose', with a puff of breath. In Telugu the puff is what tells ఛ (cha) from చ (ca), which English never does. Found mostly in words from Sanskrit."
    examples:
      "ఛాయ": "complexion; skin tone"
  "te-9278":
    native: "j (ja)"
    notes:
      "n1": "Close to English: the j of 'jest'. The breathy ఝ (jha) is its partner."
    examples:
      "జేబు": "pocket"
  "te-9279":
    native: "jh, j with breathy voice (jha)"
    notes:
      "n1": "New to English: a j said with a breathy, murmured voice, with no English counterpart. It is rare, and found in words from Sanskrit."
    examples:
      "ఝరి": "stream; waterfall"
  "te-9280":
    native: "ny (ña)"
    notes:
      "n1": "Close to English: the ny of 'canyon', said as one sound. It is found next to a చ (ca) or జ (ja), as in the జ్ఞ of కృతజ్ఞత (krutajñata, gratitude)."
    examples:
      "కృతజ్ఞత": "gratitude; thankfulness"
  "te-9281":
    native: "t, tongue curled back (ṭa)"
    notes:
      "n1": "New to English: English t touches the ridge behind the teeth, so both Telugu t's (త (ta) on the teeth, ట (ṭa) curled back) sound like English t to a beginner. Curl the tongue tip back and hear the lower, hollower ట."
    examples:
      "టీ": "tea"
  "te-9282":
    native: "ṭh, curled-back t with a puff (ṭha)"
    notes:
      "n1": "New to English: ట (ṭa) with a puff of breath after it, the tongue tip curled back. Found in words from Sanskrit."
    examples:
      "పాఠం": "lesson"
  "te-9283":
    native: "d, tongue curled back (ḍa)"
    notes:
      "n1": "New to English: the voiced partner of ట (ṭa), with the tongue tip curled back instead of on the ridge behind the teeth as for English d."
    examples:
      "గుడి": "temple"
  "te-9284":
    native: "ḍh, curled-back d with breathy voice (ḍha)"
    notes:
      "n1": "New to English: డ (ḍa) said with breathy voice, the tongue tip curled back. Found in words from Sanskrit and in names such as Delhi."
    examples:
      "ఢిల్లీ": "Delhi"
  "te-9285":
    native: "n, tongue curled back (ṇa)"
    notes:
      "n1": "New to English: an n with the tongue tip curled back. It is said between vowels and next to another curled-back consonant, and a word does not begin with it."
    examples:
      "వీణ": "veena (a South Indian string instrument)"
  "te-9286":
    native: "t, tongue on the teeth (ta)"
    notes:
      "n1": "Close to English: a t with the tongue tip on the back of the upper teeth, where English t touches the ridge behind them. To a beginner it sounds like English t. Its partner ట (ṭa) is curled back."
    examples:
      "తల": "head"
  "te-9287":
    native: "th, t with a puff (tha)"
    notes:
      "n1": "Close to English: త (ta) with a puff of breath, like the t of 'tin' with the tongue on the teeth. It is not the th of 'thin'. Found mostly in words from Sanskrit."
    examples:
      "కథ": "story"
  "te-9288":
    native: "d, tongue on the teeth (da)"
    notes:
      "n1": "Close to English: the voiced partner of త (ta), with the tongue tip on the back of the upper teeth where English d touches the ridge behind them."
    examples:
      "దారి": "way; route"
  "te-9289":
    native: "dh, d with breathy voice (dha)"
    notes:
      "n1": "New to English: ద (da) said with breathy voice: a murmur in one breath with the d, not a d followed by an h. English has no such sound."
    examples:
      "ధర": "price"
  "te-9290":
    native: "n (na)"
    notes:
      "n1": "Close to English: the n of 'not', with the tongue tip at the teeth or just behind them. Its partner ణ (ṇa) is curled back."
    examples:
      "నది": "river"
  "te-9291":
    native: "p, with no puff of breath (pa)"
    notes:
      "n1": "Close to English: the p of 'span', with no puff of breath. English p at the start of a word ('pan') has a puff, so keep Telugu ప plain."
    examples:
      "పాలు": "milk"
  "te-9292":
    native: "ph, p with a puff of breath (pha)"
    notes:
      "n1": "Close to English: the p of 'pan', with its puff of breath. In Telugu the puff tells ఫ (pha) from ప (pa). In colloquial speech it is often said f, and the same letter writes f in English loans."
    examples:
      "ఫలితం": "result"
  "te-9293":
    native: "b (ba)"
    notes:
      "n1": "Same as English: the b of 'abash', said with voice. The breathy భ (bha) is its partner."
    examples:
      "బడి": "school"
  "te-9294":
    native: "bh, b with breathy voice (bha)"
    notes:
      "n1": "New to English: a b said with breathy, murmured voice, in one breath with the b and not a b followed by an h. English has no such sound."
    examples:
      "భాష": "language"
  "te-9295":
    native: "m (ma)"
    notes:
      "n1": "Same as English: the m of 'much'."
    examples:
      "మేక": "goat"
  "te-9296":
    native: "y (ya)"
    notes:
      "n1": "Same as English: the y of 'yak'. At the start of a word it is found only in loans."
    examples:
      "రాయి": "stone"
  "te-9297":
    native: "r, a tap (ra)"
    notes:
      "n1": "Close to English: one quick tap of the tongue tip, like the tt of American 'butter'. It is not the English r."
    examples:
      "రంగు": "colour"
  "te-9298":
    native: "l (la)"
    notes:
      "n1": "Same as English: the l of 'leaf'. Its partner ళ (ḷa) is curled back."
    examples:
      "కలం": "pen"
  "te-9299":
    native: "v or w (va)"
    notes:
      "n1": "Close to English: a soft sound between English v and w, with the teeth barely touching the lip."
    examples:
      "వారం": "week"
  "te-9300":
    native: "l, tongue curled back (ḷa)"
    notes:
      "n1": "New to English: an l with the tongue tip curled back. It is said between vowels, and a word does not begin with it."
    examples:
      "తాళం": "lock"
  "te-9301":
    native: "sh (śa)"
    notes:
      "n1": "Close to English: the sh of 'mosh'. In colloquial speech it is often said s."
    examples:
      "దోశ": "dosa; a thin pancake"
  "te-9302":
    native: "sh, tongue curled back (ṣa)"
    notes:
      "n1": "New to English: an sh with the tongue tip curled back, found in words from Sanskrit. To a beginner it sounds like శ (śa)."
    examples:
      "భాష": "language"
  "te-9303":
    native: "s (sa)"
    notes:
      "n1": "Same as English: the s of 'save'."
    examples:
      "సభ": "hall; meeting; gathering"
  "te-9304":
    native: "h (ha)"
    notes:
      "n1": "Close to English: the h of 'head'."
    examples:
      "హాలు": "sitting room; hall"
  "te-9305":
    native: "the closing m sign (ṁ)"
    notes:
      "n1": "Close to English: at the end of a word the sign ం (ṁ) is said as an m, like the m of 'time'. Inside a word it is the nasal of the next consonant."
    examples:
      "పుస్తకం": "book"
  "te-9306":
    native: "the breath sign (ḥ)"
    notes:
      "n1": "New to English: the sign ః (ḥ) is a breath h said after a vowel as a sound of its own. It is found in words from Sanskrit."
    examples:
      "దుఃఖం": "grief; deep sorrow"
  "te-9307":
    native: "double k (kka)"
    notes:
      "n1": "New to English: a double consonant is held a moment longer before it is released, as across the join of 'book-case'. Telugu does this inside one word: అక్క (akka, elder sister)."
    examples:
      "అక్క": "elder sister"
  "te-9308":
    native: "double t, on the teeth (tta)"
    notes:
      "n1": "New to English: త (ta) held twice as long, as across the join of 'hot tea' but with the tongue on the teeth, inside one word."
    examples:
      "అత్త": "aunt (father's sister, or mother's brother's wife); mother-in-law"
  "te-9309":
    native: "double m (mma)"
    notes:
      "n1": "New to English: the m held a moment longer, as across the join of 'home made', inside one word."
    examples:
      "అమ్మ": "mother"
  "te-9310":
    native: "double n (nna)"
    notes:
      "n1": "New to English: the n held a moment longer, as in 'unnamed', inside one word."
    examples:
      "అన్న": "elder brother"
  "te-9311":
    native: "double l (lla)"
    notes:
      "n1": "New to English: the l held a moment longer, as across the join of 'all lines', inside one word."
    examples:
      "అల్లం": "ginger"
  "te-9312":
    native: "double p (ppa)"
    notes:
      "n1": "New to English: the p held closed a moment longer before its release, as across the join of 'top part', inside one word."
    examples:
      "తప్పు": "mistake; wrong"
