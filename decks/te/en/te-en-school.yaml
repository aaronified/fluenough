  "te-1803":
    "native": "lesson"
    "notes":
      "n1": "In the plural {1}; in the lesson is {2}. The stem changes before the plural and the postpositions."
    "examples":
      "ఈ పాఠం కష్టంగా ఉంది.":
        "native": "This lesson is difficult."
        "bases":
          "కష్టంగా":
            "meaning": "difficult"
          "ఉంది":
            "meaning": "to be; to have"
      "టీచర్ కొత్త పాఠం చెప్పారు.":
        "native": "The teacher taught a new lesson."
        "bases":
          "చెప్పారు":
            "meaning": "to tell; to teach"
    "wiktionary": true
  "te-1804":
    "native": "exam; test"
    "notes":
      "n1": "An exam at school or for a job."
