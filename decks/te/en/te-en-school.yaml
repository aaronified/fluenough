"cards":
  "te-1800":
    "native": "school"
    "notes":
      "n1": "A school as a place."
    "examples":
      "నా పాఠశాల పెద్దది.":
        "native": "My school is big."
        "bases":
          "నా":
            "meaning": "I; my"
          "పెద్దది":
            "meaning": "big"
      "నేను ప్రతిరోజు పాఠశాలకు వెళ్తాను.":
        "native": "I go to school every day."
        "bases":
          "పాఠశాలకు":
            "meaning": "school"
          "వెళ్తాను":
            "meaning": "to go; I will go"
          "ప్రతిరోజు":
            "meaning": "every day"
    "wiktionary": true
  "te-1801":
    "native": "class; grade (a year at school)"
    "notes":
      "n1": "Also a lesson period or the pupils of one class."
    "examples":
      "మా తరగతిలో ముప్పై మంది ఉన్నారు.":
        "native": "There are thirty people in our class."
        "bases":
          "మా":
            "meaning": "we; our"
          "తరగతిలో":
            "meaning": "class"
          "ఉన్నారు":
            "meaning": "to be; to have"
          "మంది":
            "meaning": "people (counter for persons)"
      "ఇది నా తరగతి.":
        "native": "This is my class."
        "bases":
          "నా":
            "meaning": "I; my"
    "wiktionary": true
  "te-1802":
    "native": "classroom"
    "notes":
      "n1": "Written as two words; the room where a class is taught."
    "examples":
      "తరగతి గది శుభ్రంగా ఉంది.":
        "native": "The classroom is clean."
