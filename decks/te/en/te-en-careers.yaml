"schema": 1
"id": "te-en-careers"
"kind": "layer"
"core": "te-careers"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Careers: jobs, promotion and training"
"description": "Jobs, employers and workers, interviews and promotion, and the words for skills, training, income and responsibility. Not yet checked by a Telugu speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "te-4312":
    "native": "organisation"
    "examples":
      "ఆ సంస్థ ఢిల్లీలో ఉంది.":
        "native": "That organisation is in Delhi."
        "bases":
          "ఢిల్లీలో":
            "meaning": "Delhi"
          "ఉంది":
            "meaning": "to be; to have"
      "ఈ సంస్థలో మూడు వందల మంది పని చేస్తారు.":
        "native": "Three hundred people work in this organisation."
        "bases":
          "సంస్థలో":
            "meaning": "organisation"
          "వందల":
            "meaning": "hundred"
          "చేస్తారు":
            "meaning": "to do"
    "notes":
      "n1": "A company, a trust or any other body that employs people."
    senses:
      "organization": { native: "organization" }
      "company": { native: "company" }
      "institute": { native: "institute" }
    wiktionary: true
  "te-4301":
    "native": "employer; boss"
    "examples":
      "నా యజమాని చాలా మంచివారు.":
        "native": "My boss is very nice."
        "bases":
          "మంచివారు":
            "meaning": "good (said with respect)"
      "యజమాని ఈ రోజు ఆఫీసుకి వచ్చారు.":
        "native": "The boss came to the office today."
        "bases":
          "ఆఫీసుకి":
            "meaning": "office"
          "వచ్చారు":
            "meaning": "to come"
    "notes":
      "n1": "The person who employs you. It is a person, so a man or a woman can be యజమాని (yajamāni)."
    senses:
      "patron": { native: "patron of a yajna" }
      "master": { native: "master, lord, boss" }
      "owner": { native: "owner, proprietor" }
    wiktionary: true
  "te-4302":
    "native": "worker; labourer"
    "examples":
      "కార్మికులు ఉదయం ఆరు గంటలకు వస్తారు.":
        "native": "The workers come at six in the morning."
        "bases":
          "కార్మికులు":
            "meaning": "worker"
          "గంటలకు":
            "meaning": "at (the) hour; o'clock"
          "వస్తారు":
            "meaning": "to come"
      "కార్మికులకు మంచి జీతం ఇవ్వాలి.":
        "native": "The employer should give the workers a good salary."
        "bases":
          "కార్మికులకు":
            "meaning": "worker"
          "ఇవ్వాలి":
            "meaning": "to give"
    "notes":
      "n1": "A person who works with the hands or in a factory or on a site."
  "te-4303":
    "native": "shift (a set spell of work)"
    "examples":
      "ఈ వారం రాత్రి షిఫ్ట్ ఉంది.":
        "native": "There is a night shift this week."
        "bases":
          "ఉంది":
            "meaning": "to be; to have"
      "ఉదయం షిఫ్ట్ ఎనిమిదికి ఉంటుంది.":
        "native": "The morning shift is at eight."
        "bases":
          "ఎనిమిదికి":
            "meaning": "eight"
          "ఉంటుంది":
            "meaning": "to be; to have"
    "notes":
      "n1": "A set period of work in a day, such as the morning shift or the night shift."
  "te-4304":
    "native": "factory"
    "examples":
      "నా తమ్ముడు ఫ్యాక్టరీలో పని చేస్తాడు.":
        "native": "My younger brother works in a factory."
        "bases":
          "ఫ్యాక్టరీలో":
            "meaning": "factory"
          "చేస్తాడు":
            "meaning": "to do"
      "ఈ ఫ్యాక్టరీ పెద్దది.":
        "native": "This factory is big."
        "bases":
          "పెద్దది":
            "meaning": "big"
    "notes":
      "n1": "A borrowed word from English. The older word is కర్మాగారం (karmāgāraṁ)."
  "te-4305":
    "native": "experience"
    "examples":
      "నాకు మూడు సంవత్సరాల అనుభవం ఉంది.":
        "native": "I have three years of experience."
        "bases":
          "నాకు":
            "meaning": "I; me"
          "సంవత్సరాల":
            "meaning": "year"
          "ఉంది":
            "meaning": "to be; to have"
      "అనుభవం ఉంటే ఉద్యోగం వస్తుంది.":
        "native": "If you have experience, you will get the job."
        "bases":
          "ఉంటే":
            "meaning": "to be; to have"
          "వస్తుంది":
            "meaning": "to come"
    "notes":
      "n1": "Time spent doing a job, and the knowledge that comes with it."
  "te-4306":
    "native": "skill"
    "examples":
      "ఆమెకు కంప్యూటర్ నైపుణ్యం ఉంది.":
        "native": "She has computer skills."
        "bases":
          "ఆమెకు":
            "meaning": "she; her"
          "ఉంది":
            "meaning": "to be; to have"
      "నైపుణ్యం నేర్చుకోవడం కష్టం కాదు.":
        "native": "Learning a skill is not difficult."
    "notes":
      "n1": "Something one is good at, learnt or trained for."
    wiktionary: true
  "te-4307":
    "native": "appointment; hiring"
    "examples":
      "కొత్త ఉద్యోగుల నియామకం ఈ నెలలో జరుగుతుంది.":
        "native": "New employees will be hired this month."
        "bases":
          "ఉద్యోగుల":
            "meaning": "employee"
          "నెలలో":
            "meaning": "month"
          "జరుగుతుంది":
            "meaning": "to happen"
      "నియామకం పత్రం ఇంటికి వచ్చింది.":
        "native": "The appointment letter came home."
        "bases":
          "ఇంటికి":
            "meaning": "house; home"
          "వచ్చింది":
            "meaning": "to come"
    "notes":
      "n1": "Choosing a person for a post, or the appointment itself."
  "te-4308":
    "native": "promotion"
    "examples":
      "ఆయనకు పదోన్నతి వచ్చింది.":
        "native": "He got a promotion."
        "bases":
          "ఆయనకు":
            "meaning": "he; him"
          "వచ్చింది":
            "meaning": "to come"
      "పదోన్నతి తర్వాత జీతం పెరిగింది.":
        "native": "After the promotion, the salary went up."
        "bases":
          "పెరిగింది":
            "meaning": "to increase; to grow"
    "notes":
      "n1": "Moving up to a higher post."
  "te-4309":
    "native": "training"
    "examples":
      "కొత్త ఉద్యోగులకు మూడు రోజుల శిక్షణ ఉంటుంది.":
        "native": "New employees will have three days of training."
        "bases":
          "ఉద్యోగులకు":
            "meaning": "employee"
          "రోజుల":
            "meaning": "day"
          "ఉంటుంది":
            "meaning": "to be; to have"
      "ఈ కోర్సులో శిక్షణ ఉచితం.":
        "native": "The training in this course is free."
        "bases":
          "కోర్సులో":
            "meaning": "course"
    "notes":
      "n1": "Lessons and practice to learn a job."
    synonyms: { "నేర్పుట": "teaching; instruction" }
    wiktionary: true
  "te-4310":
    "native": "income"
    "examples":
      "ఆయనకు నెలకు మంచి ఆదాయం వస్తుంది.":
        "native": "He earns a good income every month."
        "bases":
          "ఆయనకు":
            "meaning": "he; him"
          "నెలకు":
            "meaning": "month"
          "వస్తుంది":
            "meaning": "to come"
      "కుటుంబ ఆదాయం పెరగాలి.":
        "native": "The family's income should go up."
        "bases":
          "పెరగాలి":
            "meaning": "to increase; to grow"
    "notes":
      "n1": "Money earned over a period, such as a month or a year."
    wiktionary: true
  "te-4311":
    "native": "future"
    "examples":
      "నా భవిష్యత్తు ఈ ఉద్యోగం మీద ఆధారపడి ఉంది.":
        "native": "My future depends on this job."
        "bases":
          "ఆధారపడి":
            "meaning": "to depend"
          "ఉంది":
            "meaning": "to be; to have"
      "పిల్లల భవిష్యత్తు గురించి తల్లిదండ్రులు ఆలోచిస్తారు.":
        "native": "Parents think about their children's future."
        "bases":
          "పిల్లల":
            "meaning": "child"
          "ఆలోచిస్తారు":
            "meaning": "to think"
    "notes":
      "n1": "The time ahead, and a person's prospects in work or life."
  "te-4313":
    "native": "qualification"
    "examples":
      "ఈ ఉద్యోగానికి డిగ్రీ విద్యార్హత అవసరం.":
        "native": "This job needs a degree as the qualification."
        "bases":
          "ఉద్యోగానికి":
            "meaning": "job"
      "నాకు ఏ విద్యార్హత ఉంది?":
        "native": "What qualification do I have?"
        "bases":
          "నాకు":
            "meaning": "I; me"
          "ఉంది":
            "meaning": "to be; to have"
    "notes":
      "n1": "The degree or certificate that a job asks for."
  "te-4314":
    "native": "responsibility; duty"
    "examples":
      "ఈ పని చేయడం నా బాధ్యత.":
        "native": "Doing this work is my responsibility."
      "ప్రతి ఉద్యోగికి బాధ్యతలు ఉంటాయి.":
        "native": "Every employee has responsibilities."
        "bases":
          "ఉద్యోగికి":
            "meaning": "employee"
          "బాధ్యతలు":
            "meaning": "responsibility"
          "ఉంటాయి":
            "meaning": "to be; to have"
    "notes":
      "n1": "A duty one must do, or the feeling of being responsible for something."
    wiktionary: true
