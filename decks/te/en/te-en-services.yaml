"schema": 1
"id": "te-en-services"
"kind": "layer"
"core": "te-services"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Services: bank, post, repair and tailor"
"description": "Words for banks, post offices, repairs, tailors and barbers: accounts, cards, forms, bills and fees. Not yet checked by a Telugu speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "te-3900":
    "native": "account (bank account)"
    "examples":
      "ఈ ఖాతాలో డబ్బు ఉంది.":
        "native": "There is money in this account."
        "bases":
          "ఖాతాలో":
            "meaning": "in the account"
          "ఉంది":
            "meaning": "to be; to have"
      "ఖాతా నంబరు చెప్పండి.":
        "native": "Tell me the account number."
        "bases":
          "చెప్పండి":
            "meaning": "to say; to tell"
          "నంబరు":
            "meaning": "number"
    "notes":
      "n1": "A bank account, or the account of a customer with a shop or a service. It is a thing, so its gender is amahat."
    "wiktionary": true
  "te-3901":
    "native": "ATM; cash machine"
    "examples":
      "ఏటీఎం ఎక్కడ ఉంది?":
        "native": "Where is the ATM?"
        "bases":
          "ఉంది":
            "meaning": "to be; to have"
      "ఏటీఎంలో డబ్బు తీసుకున్నాను.":
        "native": "I took money from the ATM."
        "bases":
          "ఏటీఎంలో":
            "meaning": "at the ATM"
          "తీసుకున్నాను":
            "meaning": "to take; to receive"
    "notes":
      "n1": "The English word, written in Telugu letters. People say it as ēṭīeṁ, with the letters spelled out."
  "te-3902":
    "native": "stamp (postage)"
    "examples":
      "ఈ కవరుకు స్టాంపు అంటించండి.":
        "native": "Stick a stamp on this envelope."
        "bases":
          "కవరుకు":
            "meaning": "to the envelope"
          "అంటించండి":
            "meaning": "to stick; to attach"
      "ఒక స్టాంపు ఎంత?":
        "native": "How much is one stamp?"
    "notes":
      "n1": "A postage stamp, bought at the post office and stuck on a letter or parcel."
    "wiktionary": true
  "te-3903":
    "native": "parcel; package"
    "examples":
      "పార్శిల్ రేపు వస్తుంది.":
        "native": "The parcel will come tomorrow."
        "bases":
          "వస్తుంది":
            "meaning": "to come"
      "ఈ పార్శిల్ చిరునామాకు పంపండి.":
        "native": "Send this parcel to the address."
        "bases":
          "చిరునామాకు":
            "meaning": "to the address"
          "పంపండి":
            "meaning": "to send"
    "notes":
      "n1": "A parcel is sent by post or by courier."
  "te-3904":
    "native": "address"
    "examples":
      "చిరునామా ఏమిటి?":
        "native": "What is the address?"
      "చిరునామా ఈ ఫారంలో రాయండి.":
        "native": "Write the address on this form."
        "bases":
          "ఫారంలో":
            "meaning": "on the form"
          "రాయండి":
            "meaning": "to write"
    "notes":
      "n1": "The address where someone lives or receives post."
    "synonyms":
      "paivilasamu": "a superscription or address on a letter"
    "wiktionary": true
  "te-3905":
    "native": "form (to fill in)"
    "examples":
      "ఈ ఫారం నింపండి.":
        "native": "Fill in this form."
        "bases":
          "నింపండి":
            "meaning": "to fill"
      "ఈ ఫారం ఎక్కడ దొరుకుతుంది?":
        "native": "Where can this form be found?"
        "bases":
          "దొరుకుతుంది":
            "meaning": "to be found; to be available"
    "notes":
      "n1": "A printed paper that is filled in at a bank, an office or a counter."
  "te-3906":
    "native": "service"
    "examples":
      "ఈ సేవకు రుసుము ఎంత?":
        "native": "What is the fee for this service?"
        "bases":
          "సేవకు":
            "meaning": "for the service"
      "వాళ్ళు మంచి సేవ ఇచ్చారు.":
        "native": "They gave good service."
        "bases":
          "ఇచ్చారు":
            "meaning": "to give"
    "notes":
      "n1": "A service is something done for a customer, such as banking, post or repair."
    "synonyms":
      "susrusa": "service, serving"
      "pani": "work"
      "koluvu": "service"
    "senses":
      "service":
        "native": "service"
      "servitude":
        "native": "servitude"
      "homage":
        "native": "homage"
      "reverence":
        "native": "reverence, worship"
    "wiktionary": true
  "te-3907":
    "native": "repair"
    "examples":
      "ఫ్రిజ్ మరమ్మతు చేయాలి.":
        "native": "The fridge needs repair."
        "bases":
          "చేయాలి":
            "meaning": "to do; must do"
          "ఫ్రిజ్":
            "meaning": "fridge"
      "మరమ్మతు ఎప్పుడు అవుతుంది?":
        "native": "When will the repair be done?"
        "bases":
          "అవుతుంది":
            "meaning": "to become; to be done"
    "notes":
      "n1": "The act of fixing something that is broken."
    "wiktionary": true
  "te-3908":
    "native": "ironing; pressing"
    "examples":
      "ఈ చొక్కాకు ఇస్త్రీ చేయండి.":
        "native": "Iron this shirt."
        "bases":
          "చొక్కాకు":
            "meaning": "to the shirt"
          "చేయండి":
            "meaning": "to do"
      "ఇస్త్రీ బట్టలు రేపు ఇస్తాను.":
        "native": "I will give the clothes for ironing tomorrow."
        "bases":
          "బట్టలు":
            "meaning": "clothes"
          "ఇస్తాను":
            "meaning": "to give"
    "notes":
      "n1": "Ironing is the service of pressing clothes. In బట్టలు (baṭṭalu, clothes), the stem of బట్ట (baṭṭa, cloth) changes to బట్టల- (baṭṭala-) before the endings."
    "wiktionary": true
  "te-3909":
    "native": "tailor"
    "examples":
      "దర్జీ ఈ చొక్కాను కుట్టాడు.":
        "native": "The tailor sewed this shirt."
        "bases":
          "చొక్కాను":
            "meaning": "the shirt"
          "కుట్టాడు":
            "meaning": "to sew"
      "దర్జీ పని బాగా చేస్తాడు.":
        "native": "The tailor does good work."
        "bases":
          "చేస్తాడు":
            "meaning": "to do"
    "notes":
      "n1": "A person who sews and alters clothes. The gender is mahat, because the word is for a person."
    "synonyms":
      "tailaru": "tailor"
    "wiktionary": true
  "te-3910":
    "native": "barber shop; hair salon"
    "examples":
      "క్షౌరశాల ఈ వీధిలో ఉంది.":
        "native": "The barber shop is on this street."
        "bases":
          "వీధిలో":
            "meaning": "on the street"
          "ఉంది":
            "meaning": "to be; to have"
      "క్షౌరశాలలో జుట్టు కత్తిరించాను.":
        "native": "I got my hair cut at the barber shop."
        "bases":
          "క్షౌరశాలలో":
            "meaning": "at the barber shop"
          "కత్తిరించాను":
            "meaning": "to cut"
    "notes":
      "n1": "A place where hair is cut and men are shaved. The barber himself is మంగలి (maṅgali)."
  "te-3911":
    "native": "barber"
    "examples":
      "మంగలి ఎప్పుడు వస్తాడు?":
        "native": "When will the barber come?"
        "bases":
          "వస్తాడు":
            "meaning": "to come"
      "మంగలి దుకాణం ఎక్కడ ఉంది?":
        "native": "Where is the barber's shop?"
        "bases":
          "ఉంది":
            "meaning": "to be; to have"
    "notes":
      "n1": "A person who cuts hair and shaves. The gender is mahat, because the word is for a person."
  "te-3912":
    "native": "loan; debt"
    "examples":
      "బ్యాంకు నుంచి అప్పు తీసుకున్నాడు.":
        "native": "He took a loan from the bank."
        "bases":
          "తీసుకున్నాడు":
            "meaning": "to take; to receive"
          "నుంచి":
            "meaning": "from; since"
      "అప్పు ఎంత ఉంది?":
        "native": "How much is the debt?"
        "bases":
          "ఉంది":
            "meaning": "to be; to have"
    "notes":
      "n1": "Money that is borrowed and must be paid back, with interest."
    "synonyms":
      "aruvu": "A loan in grains"
      "rnamu": "loan, debt"
    "wiktionary": true
  "te-3913":
    "native": "interest"
    "examples":
      "ఈ ఖాతాకు వడ్డీ ఎంత?":
        "native": "What is the interest on this account?"
        "bases":
          "ఖాతాకు":
            "meaning": "on the account"
      "వడ్డీ నెలకు ఒకసారి ఇస్తారు.":
        "native": "They pay the interest once a month."
        "bases":
          "నెలకు":
            "meaning": "per month"
          "ఇస్తారు":
            "meaning": "to give"
          "ఒకసారి":
            "meaning": "once"
    "notes":
      "n1": "The extra money paid on a loan, or earned on savings."
  "te-3914":
    "native": "credit card"
    "examples":
      "క్రెడిట్ కార్డు ఉందా?":
        "native": "Do you have a credit card?"
        "bases":
          "ఉందా":
            "meaning": "to be; to have"
          "క్రెడిట్":
            "meaning": "credit"
      "క్రెడిట్ కార్డుతో చెల్లించవచ్చా?":
        "native": "Can I pay with a credit card?"
        "bases":
          "కార్డుతో":
            "meaning": "with the card"
          "చెల్లించవచ్చా":
            "meaning": "to pay"
          "క్రెడిట్":
            "meaning": "credit"
    "notes":
      "n1": "A card that lets you pay now and borrow to pay later. The English words are written in Telugu letters."
    "bases":
      "క్రెడిట్":
        "meaning": "credit"
  "te-3915":
    "native": "debit card"
    "examples":
      "డెబిట్ కార్డు ఇక్కడ పెట్టండి.":
        "native": "Put the debit card in here."
        "bases":
          "పెట్టండి":
            "meaning": "to put"
          "డెబిట్":
            "meaning": "debit"
      "డెబిట్ కార్డు పాడైపోయింది.":
        "native": "The debit card is broken."
        "bases":
          "పాడైపోయింది":
            "meaning": "to be spoiled; to be broken"
          "డెబిట్":
            "meaning": "debit"
    "notes":
      "n1": "A card that takes money straight from your bank account."
    "bases":
      "డెబిట్":
        "meaning": "debit"
  "te-3916":
    "native": "cost; expense"
    "examples":
      "ఈ మరమ్మతుకు ఖర్చు ఎంత?":
        "native": "What is the cost of this repair?"
        "bases":
          "మరమ్మతుకు":
            "meaning": "for the repair"
      "ఖర్చు యాభై రూపాయలు.":
        "native": "The cost is fifty rupees."
        "bases":
          "రూపాయలు":
            "meaning": "rupees"
    "notes":
      "n1": "The money that something costs or takes to do. In రూపాయలు (rūpāyalu, rupees), the stem of రూపాయి (rūpāyi) changes to రూపాయ- (rūpāya-) before the plural ending."
  "te-3917":
    "native": "customer; consumer"
    "examples":
      "వినియోగదారుడు ఫారం నింపాడు.":
        "native": "The customer filled in the form."
        "bases":
          "నింపాడు":
            "meaning": "to fill"
      "వినియోగదారులకు మంచి సేవ ఇవ్వాలి.":
        "native": "Good service must be given to customers."
        "bases":
          "వినియోగదారులకు":
            "meaning": "to customers"
          "ఇవ్వాలి":
            "meaning": "to give; must give"
    "notes":
      "n1": "A person who buys or uses a service. The gender is mahat, because the word is for a person. In వినియోగదారులకు (viniyōgadārulaku, to customers), the stem changes to వినియోగదారుల- (viniyōgadārula-) in the plural."
    "wiktionary": true
  "te-3919":
    "native": "registration"
    "examples":
      "రిజిస్ట్రేషన్ ఎక్కడ చేయాలి?":
        "native": "Where should I register?"
        "bases":
          "చేయాలి":
            "meaning": "to do; must do"
      "రిజిస్ట్రేషన్ రుసుము ఎంత?":
        "native": "What is the registration fee?"
    "notes":
      "n1": "The act of putting your name and details on an official list."
  "te-3920":
    "native": "ID card"
    "examples":
      "గుర్తింపు కార్డు చూపించండి.":
        "native": "Show your ID card."
        "bases":
          "చూపించండి":
            "meaning": "to show"
          "గుర్తింపు":
            "meaning": "identification"
      "గుర్తింపు కార్డు మర్చిపోయాను.":
        "native": "I forgot my ID card."
        "bases":
          "మర్చిపోయాను":
            "meaning": "to forget"
          "గుర్తింపు":
            "meaning": "identification"
    "notes":
      "n1": "A card that shows who you are, such as a national or office ID."
    "bases":
      "గుర్తింపు":
        "meaning": "identification"
  "te-3921":
    "native": "certificate"
    "examples":
      "దయచేసి సర్టిఫికెట్ ఇవ్వండి.":
        "native": "Please give me the certificate."
        "bases":
          "ఇవ్వండి":
            "meaning": "to give"
      "సర్టిఫికెట్ ఎప్పుడు వస్తుంది?":
        "native": "When will the certificate come?"
        "bases":
          "వస్తుంది":
            "meaning": "to come"
    "notes":
      "n1": "An official paper that proves a fact, such as a birth or a course."
  "te-3922":
    "native": "licence; permit"
    "examples":
      "డ్రైవింగ్ లైసెన్సు పోయింది.":
        "native": "My driving licence is lost."
        "bases":
          "పోయింది":
            "meaning": "to go; to be lost"
          "డ్రైవింగ్":
            "meaning": "driving"
      "లైసెన్సు ఫీజు ఎంత?":
        "native": "What is the licence fee?"
    "notes":
      "n1": "An official permission, such as to drive or to run a shop. The English word is written in Telugu letters."
  "te-3923":
    "native": "courier service"
    "examples":
      "కొరియర్ ఈ రోజు వస్తుంది.":
        "native": "The courier will come today."
        "bases":
          "వస్తుంది":
            "meaning": "to come"
      "కొరియర్ ద్వారా పంపవచ్చా?":
        "native": "Can I send it by courier?"
        "bases":
          "పంపవచ్చా":
            "meaning": "to send"
          "ద్వారా":
            "meaning": "through; by means of"
    "notes":
      "n1": "A company that carries letters and parcels quickly. The English word is written in Telugu letters."
  "te-3924":
    "native": "money"
    "examples":
      "నా దగ్గర డబ్బు లేదు.":
        "native": "I have no money on me."
        "bases":
          "నా":
            "meaning": "my"
          "లేదు":
            "meaning": "is not; there is not"
      "డబ్బు ఎక్కడ పెట్టాను?":
        "native": "Where did I put the money?"
        "bases":
          "పెట్టాను":
            "meaning": "to put"
    "notes":
      "n1": "Notes and coins used to pay for things."
    "wiktionary": true
  "te-3925":
    "native": "PIN (personal identification number)"
    "examples":
      "పిన్ నంబరు మర్చిపోయాను.":
        "native": "I forgot the PIN number."
        "bases":
          "మర్చిపోయాను":
            "meaning": "to forget"
          "నంబరు":
            "meaning": "number"
      "పిన్ ఎవరికీ చెప్పకండి.":
        "native": "Do not tell the PIN to anyone."
        "bases":
          "ఎవరికీ":
            "meaning": "to anyone"
          "చెప్పకండి":
            "meaning": "to say; to tell"
    "notes":
      "n1": "A secret number that you enter to use a card or an account. In ఎవరికీ (evarikī, to anyone), the stem of ఎవరు (evaru, who) changes to ఎవరి- (evari-) before the ending."
  "te-3926":
    "native": "fingerprint"
    "examples":
      "ఇక్కడ వేలిముద్ర వేయండి.":
        "native": "Put your fingerprint here."
        "bases":
          "వేయండి":
            "meaning": "to put; to press"
      "వేలిముద్ర తీసుకున్నారు.":
        "native": "They took my fingerprint."
        "bases":
          "తీసుకున్నారు":
            "meaning": "to take; to receive"
    "notes":
      "n1": "The mark made by a finger, used to check identity."
  "te-3927":
    "native": "bill; invoice"
    "examples":
      "బిల్లు ఎంత అయింది?":
        "native": "How much is the bill?"
        "bases":
          "అయింది":
            "meaning": "to become; to be done"
      "బిల్లు కట్టండి.":
        "native": "Pay the bill."
        "bases":
          "కట్టండి":
            "meaning": "to pay"
    "notes":
      "n1": "A paper that lists what you must pay for goods or a service."
    "wiktionary": true
  "te-3928":
    "native": "cheque"
    "examples":
      "ఈ చెక్కు బ్యాంకులో ఇవ్వండి.":
        "native": "Give this cheque at the bank."
        "bases":
          "బ్యాంకులో":
            "meaning": "at the bank"
          "ఇవ్వండి":
            "meaning": "to give"
      "చెక్కు మీద పేరు రాయండి.":
        "native": "Write the name on the cheque."
        "bases":
