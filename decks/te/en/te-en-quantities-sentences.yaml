schema: 1
id: "te-en-quantities-sentences"
kind: "layer"
core: "te-quantities-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How much and how many: sentences"
description: "Sentences about amounts, with the words of the quantities unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-1051":
    notes:
      "n1": "నాకు (nāku) is the dative of నేను (nēnu), I, so the need is to me."
    native: "I need a little milk."
    alt_native: ["I need a bit of milk"]
  "te-1052":
    notes:
      "n1": "ఉన్నాయి (unnāyi), are, is the plural form used for things; for people the form is ఉన్నారు (unnāru)."
    native: "How many books are there here?"
    alt_native: ["How many books are here?"]
  "te-1053":
    notes:
      "n1": "ఉన్నారు (unnāru), are, is the plural form used for people, as in పిల్లలు (pillalu), children."
    native: "How many children are in the class?"
    alt_native: ["How many kids are in the class?"]
    bases:
      "క్లాసులో": "class (from English)"
  "te-1054":
    notes:
      "n1": "ఉన్నాయి (unnāyi), are, is the plural form used for things, not people."
    native: "All the shops are closed."
    alt_native: ["All of the shops are closed"]
  "te-1055":
    notes:
      "n1": "ఇంట్లో (iṇṭlō) is ఇల్లు (illu), house, with the locative ending -లో (lō) meaning 'at' or 'in'."
    native: "There is nobody at home."
    alt_native: ["Nobody is at home"]
  "te-1056":
    notes:
      "n1": "నా (nā) దగ్గర (daggara) means 'with me': the genitive నా (nā), my, comes before దగ్గర (daggara), near."
    native: "I have nothing with me."
    alt_native: ["I have nothing on me"]
  "te-1057":
    notes:
      "n1": "ఆగండి (āgaṇḍi) is the polite form of the command 'wait', said to one person."
    native: "Please wait just a minute."
    alt_native: ["Please wait one minute"]
    bases:
      "నిమిషం": "minute"
  "te-1058":
    notes:
      "n1": "కావాలా (kāvālā) is the question form of కావాలి (kāvāli), want, with the question ending -ā."
    native: "Do you want a little more?"
    alt_native: ["Would you like a bit more?"]
  "te-1059":
    native: "That's enough, no more."
  "te-1060":
    notes:
      "n1": "The first-person present ending -ānu is here on నేర్చుకుంటాను (nērcukuṇṭānu), I learn, as in తాగుతాను (tāgutānu), I drink."
    native: "I learn Telugu every day."
    alt_native: ["I study Telugu every day"]
    bases:
      "తెలుగు": "Telugu (the language)"
  "te-1061":
    native: "When does the first bus come?"
    alt_native: ["When is the first bus?"]
    notes:
      "n1": "{1} changes its stem in the present and future: {2}."
  "te-1062":
    native: "The last bus comes at eleven at night."
    alt_native: ["The last bus comes at 11 at night"]
    notes:
      "n1": "{1} changes its stem in the present and future: {2}."
