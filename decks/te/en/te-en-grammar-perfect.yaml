  entries:
    "cheeyadam": "to do"
    "velladam": "to go"
    "raavadam": "to come"
    "tinadam": "to eat"
  notes: "The perfect takes the -ి (-i) form of the verb, which says that one action is done, then the present of ఉండు (uṇḍu, to be): నేను తిని ఉన్నాను (nēnu tini unnānu), I have eaten. The ending of ఉండు agrees with the doer as in the present: ఉన్నాను (unnānu) for నేను (nēnu), ఉన్నావు (unnāvu) for నువ్వు (nuvvu), ఉన్నాడు (unnāḍu) for he, ఉంది (undi) for she and it, and ఉన్నారు (unnāru) for మీరు (mīru), plural or respectful, and for వాళ్ళు (vāḷḷu), they. The -ి form changes the stem of చేయడం (cēyaḍaṁ) to చేసి (cēsi) and of రావడం (rāvaḍaṁ) to వచ్చి (vacci); వెళ్ళడం (veḷḷaḍaṁ) keeps its stem in వెళ్ళి (veḷḷi), and తినడం (tinaḍaṁ) in తిని (tini). The past, చేశాను (cēśānu), I did it, says only that the action happened; the perfect says that its result is still here."
