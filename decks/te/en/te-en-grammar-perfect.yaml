schema: 1
id: "te-en-grammar-perfect"
kind: "layer"
core: "te-grammar-perfect"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Have done: the -ి (-i) form and ఉన్నాను (unnānu)"
description: "A verb's -ి (-i) form with the verb to be, as ఉన్నాను (unnānu), says that something is done and its result still holds: I have eaten, I have gone. The last word takes the person's ending. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "person"
  slots:
    "nenu": "I (have done it)"
    "memu": "we, not including you (have done it)"
    "manam": "we, including you (have done it)"
    "nuvvu": "you, to a friend or child (have done it)"
    "miru": "you, respectful or plural (have done it)"
    "atanu": "he (has done it)"
    "ame-adi": "she; it (has done it)"
    "vallu": "they (people) (have done it)"
rules:
  "te-rule-perfect":
    name: "-ి (-i) ఉన్నాను (unnānu): have done"
    explanation: "{1} joins a verb's -ి (-i) form to the verb to be, and the ending says who did it. {2} means I have eaten, {3} means we have eaten without you, and {4} means we have eaten with you. {5} means you have eaten, to a friend or child, and {6} means you have eaten, respectful or plural, or they have eaten. {7} means she or it has eaten, and {8} means he has eaten."
