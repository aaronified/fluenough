id: "te-en-grammar-indefinites"
kind: "layer"
core: "te-grammar-indefinites"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Someone, something, anyone and nobody"
description: "Words built from question words: someone with -ఓ (-ō), anyone with -ఐనా (-ainā), and no one or nothing with a negative verb. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "te-5600":
    native: "someone, somebody"
    notes:
      "n1": "ఎవరో (evarō) is ఎవరు (evaru), who, with -ఓ (-ō) added: 'someone'. ఎవరైనా (evarainā) is 'anyone'."
    examples:
      "ఎవరో తలుపు తట్టారు.": "Someone knocked on the door."
      "నా పుస్తకం ఎవరో తీసుకెళ్ళారు.": "Someone took my book away."
  "te-5601":
    native: "something; some"
    notes:
      "n1": "ఏదో (ēdō) is ఏది (ēdi), which one, with -ఓ (-ō): 'something'. Before a noun it means 'some'."
    examples:
      "అతను ఏదో చెప్పాలనుకున్నాడు.": "He wanted to say something."
      "గదిలో ఏదో శబ్దం వినిపించింది.": "A sound was heard in the room."
  "te-5602":
    native: "anything; any; whatever"
    notes:
      "n1": "ఏదైనా (ēdainā) is ఏది (ēdi) with -ఐనా (-ainā): 'anything' or 'whatever'. It is the same ending as ఎవరైనా (evarainā), anyone."
    examples:
      "నీకు ఏదైనా కావాలా?": "Do you want anything?"
      "ఏదైనా తినడానికి ఇవ్వండి.": "Give me something to eat, anything at all."
  "te-5604":
    native: "nothing; none"
    notes:
      "n1": "ఏదీ (ēdī) is ఏది (ēdi) with -ఈ (-ī). With a negative verb such as లేదు (lēdu) or కాదు (kādu), it means 'nothing' or 'none'."
    examples:
      "ఈ పెట్టెలో ఏదీ లేదు.": "There is nothing in this box."
      "అతని మాటల్లో ఏదీ నిజం కాదు.": "None of what he said is true."
