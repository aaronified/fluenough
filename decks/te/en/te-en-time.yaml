schema: 1
id: "te-en-time"
kind: "layer"
core: "te-time"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Time and days"
description: "Today and tomorrow, telling the time, and the days of the week. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0306":
    native: "today"
  "te-0307":
    native: "tomorrow"
    notes:
      "n1": "Unlike Hindi and Bengali, Telugu has a separate word for yesterday: నిన్న (ninna)."
  "te-0308":
    native: "yesterday"
  "te-0309":
    native: "now"
    alt_native: ["right now"]
  "te-0310":
    native: "morning"
    notes:
      "n1": "Formally ఉదయం (udayam)."
  "te-0311":
    native: "evening"
  "te-0312":
    native: "night"
  "te-0313":
    native: "o'clock; hours"
    notes:
      "n1": "నాలుగు గంటలు (nālugu gaṇṭalu), four o'clock."
  "te-0314":
    native: "half past four; 4½"
    alt_native: ["four thirty", "4:30"]
    notes:
      "n1": "-న్నర (-nnara) adds a half to any number."
  "te-0315":
    native: "What time is it?"
    alt_native: ["What is the time?"]
    notes:
      "n1": "Also ఎన్ని గంటలు? (enni gantalu?)."
    bases:
      "టైం": "time (by the clock)"
  "te-0316":
    native: "day"
  "te-0317":
    native: "week"
  "te-0318":
    native: "Monday"
    notes:
      "n1": "Each day ends in వారం (vāram), and most names match Hindi's."
  "te-0319":
    native: "Tuesday"
  "te-0320":
    native: "Wednesday"
  "te-0321":
    native: "Thursday"
  "te-0322":
    native: "Friday"
  "te-0323":
    native: "Saturday"
  "te-0324":
    native: "Sunday"

  "te-6507":
    native: "The seven days of the week"
    explanation: "The days from sōmavāraṁ (Monday) to ādivāraṁ (Sunday). Each ends in vāraṁ, the word for a day of the week."
