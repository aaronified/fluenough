schema: 1
id: "te-en-time"
kind: "layer"
core: "te-time"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Time and days"
description: "Today and tomorrow, telling the time, and the days of the week. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0306":
    native: "today"
    "examples": {
      "ఈరోజు చాలా వేడిగా ఉంది.": {"native": "It's very hot today.", "bases": {}},
      "ఈరోజు జాతీయ వార్తలు ఏమిటి?": {"native": "What is the national news today?", "bases": {}}
    }
  "te-0307":
    native: "tomorrow"
    notes:
      "n1": "Unlike Hindi and Bengali, Telugu has a separate word for yesterday: నిన్న (ninna)."
    "examples": {
      "టోర్నమెంట్ రేపు మొదలవుతుంది.": {"native": "The tournament starts tomorrow.", "bases": {}},
      "మనం రేపు కలుస్తాం.": {"native": "We will meet tomorrow. (you and I)", "bases": {}}
    }
  "te-0308":
    native: "yesterday"
    "examples": {
      "నిన్న రాత్రి ఒక పెద్ద అగ్నిప్రమాదం జరిగింది.": {"native": "There was a big fire last night.", "bases": {}}
    }
  "te-0309":
    native: "now"
    alt_native: ["right now"]
    "examples": {
      "ఇప్పుడు వెళ్ళు.": {"native": "Go now.", "bases": {"ఇప్పుడు": "now"}},
      "ఆమె ఇప్పుడు దువ్వుకుంటుంది.": {"native": "She is combing her hair now.", "bases": {}}
    }
  "te-0310":
    native: "morning"
    notes:
      "n1": "Formally ఉదయం (udayam)."
    "examples": {
      "నేను పొద్దున ఇడ్లీ తింటాను.": {"native": "I eat idli in the morning.", "bases": {}}
    }
  "te-0311":
    native: "evening"
  "te-0312":
    native: "night"
    "examples": {
      "రాత్రి చీకటిగా ఉంది.": {"native": "The night is dark.", "bases": {}},
      "రాత్రి ఛార్జ్ చేస్తాను.": {"native": "I will charge it at night.", "bases": {}}
    }
  "te-0313":
    native: "o'clock; hours"
    notes:
      "n1": "నాలుగు గంటలు (nālugu gaṇṭalu), four o'clock."
    "examples": {
      "ప్రయాణ సమయం రెండు గంటలు.": {"native": "The travel time is two hours.", "bases": {"గంటలు": "o'clock; hours"}},
      "రోజుకు ఎన్ని గంటలు పని?": {"native": "How many hours of work a day?", "bases": {}}
    }
  "te-0314":
    native: "half past four; 4½"
    alt_native: ["four thirty", "4:30"]
    notes:
      "n1": "-న్నర (-nnara) adds a half to any number."
  "te-0315":
    native: "What time is it?"
    alt_native: ["What is the time?"]
    notes:
      "n1": "Also ఎన్ని గంటలు? (enni gantalu?)."
    bases:
      "టైం": "time (by the clock)"
  "te-0316":
    native: "day"
  "te-0317":
    native: "week"
    "examples": {
      "ఈ వారం రీఛార్జ్ చేశావా?": {"native": "Did you recharge this week?", "bases": {}},
      "ప్రతి వారం బ్యాకప్ ఉండాలి.": {"native": "There should be a backup every week.", "bases": {}}
    }
  "te-0318":
    native: "Monday"
    notes:
      "n1": "Each day ends in వారం (vāram), and most names match Hindi's."
    "examples": {
      "మ్యూజియం సోమవారం మూసి ఉంటుంది.": {"native": "The museum is closed on Mondays.", "bases": {}}
    }
  "te-0319":
    native: "Tuesday"
  "te-0320":
    native: "Wednesday"
  "te-0321":
    native: "Thursday"
  "te-0322":
    native: "Friday"
    "examples": {
      "ప్రెజెంటేషన్ శుక్రవారం ఉంది.": {"native": "The presentation is on Friday.", "bases": {}},
      "ఈ సినిమా విడుదల శుక్రవారం.": {"native": "This film's release is on Friday.", "bases": {}}
    }
  "te-0323":
    native: "Saturday"
    "examples": {
      "మేము శనివారం గ్యాలరీకి వెళ్తాము.": {"native": "We are going to the gallery on Saturday.", "bases": {}},
      "శనివారం నేను పార్కుకి వెళ్తాను.": {"native": "On Saturday I go to the park.", "bases": {}}
    }
  "te-0324":
    native: "Sunday"
    "examples": {
      "నేను ఆదివారం సినిమా చూస్తాను.": {"native": "I watch a film on Sunday.", "bases": {}},
      "నేను ప్రతి ఆదివారం ఈత కొడతాను.": {"native": "I go swimming every Sunday.", "bases": {}}
    }

  "te-6507":
    native: "The seven days of the week"
    explanation: "The days from sōmavāraṁ (Monday) to ādivāraṁ (Sunday). Each ends in vāraṁ, the word for a day of the week."
