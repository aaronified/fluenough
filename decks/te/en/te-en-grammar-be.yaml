name: "To be: ఉండు (uṇḍu) and కాదు (kādu)"
description: "Is, was, isn't, will be: ఉండు (uṇḍu) for where and how things are, no verb at all for what someone is, and కాదు (kādu) for what someone is not. Not yet checked by a Telugu speaker: please report any mistake."
