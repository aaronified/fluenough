"cards":
  "te-5200":
    "native": "wedding; marriage"
    "wiktionary": true
    "notes":
      "n1": "Colloquial, and also the wedding itself. The formal word is వివాహం (vivāhaṁ)."
    "examples":
      "పెళ్ళి చాలా బాగా జరిగింది.":
        "native": "The wedding went very well."
        "bases":
          "జరిగింది":
            "meaning": "to happen; to take place"
      "పెళ్ళికి అందరూ వచ్చారు.":
        "native": "Everyone came to the wedding."
        "bases":
          "పెళ్ళికి":
            "meaning": "wedding; marriage"
          "వచ్చారు":
            "meaning": "to come"
  "te-5201":
    "native": "marriage; wedding (formal)"
    "wiktionary": true
    "notes":
      "n1": "The formal word for marriage. In speech say పెళ్ళి (peḷḷi)."
    "examples":
      "వివాహం రెండు కుటుంబాలను కలుపుతుంది.":
        "native": "Marriage joins two families."
        "bases":
          "కుటుంబాలను":
            "meaning": "family"
          "కలుపుతుంది":
            "meaning": "to join; to unite"
      "వివాహానికి ముందు మేము పూజ చేస్తాము.":
        "native": "Before the marriage we hold a prayer ritual."
        "bases":
          "వివాహానికి":
            "meaning": "marriage; wedding"
          "చేస్తాము":
            "meaning": "to do"
  "te-5202":
    "native": "bride"
    "wiktionary": true
    "notes":
      "n1": "The formal word for the bride. In speech say పెళ్ళికూతురు (peḷḷikūturu)."
    "examples":
      "వధువు ఎరుపు చీర కట్టుకుంది.":
        "native": "The bride wore a red sari."
        "bases":
          "కట్టుకుంది":
            "meaning": "to wear (clothes)"
      "వధువు చాలా అందంగా ఉంది.":
        "native": "The bride looks very beautiful."
        "bases":
          "అందంగా":
            "meaning": "beauty"
          "ఉంది":
            "meaning": "to be"
    "synonyms":
      "pendlikuturu": "bride"
  "te-5203":
    "native": "groom"
    "wiktionary": true
    "notes":
      "n1": "The formal word for the groom. The stem changes to వరుడి (varuḍi) before case endings: వరుడికి (varuḍiki), వరుడిని (varuḍini). In speech say పెళ్ళికొడుకు (peḷḷikoḍuku)."
    "examples":
      "వరుడు గుర్రం మీద వచ్చాడు.":
        "native": "The groom came on a horse."
        "bases":
          "వచ్చాడు":
            "meaning": "to come"
      "వరుడి తల్లి ఇక్కడ ఉంది.":
        "native": "The groom's mother is here."
        "bases":
          "వరుడి":
            "meaning": "groom"
          "ఉంది":
            "meaning": "to be"
          "తల్లి":
            "meaning": "mother"
    "senses":
      "bridegroom":
        "native": "bridegroom"
  "te-5204":
    "native": "auspicious time"
    "wiktionary": true
    "notes":
      "n1": "A time chosen as lucky, fixed by a priest or an almanac."
    "examples":
      "పెళ్ళి ముహూర్తం ఉదయం ఆరు గంటలకు.":
        "native": "The wedding's auspicious time is at six in the morning."
        "bases":
          "గంటలకు":
            "meaning": "hour"
      "పండితుడు ముహూర్తం చెప్పాడు.":
        "native": "The learned man fixed the auspicious time."
        "bases":
          "చెప్పాడు":
            "meaning": "to tell; to say"
          "పండితుడు":
            "meaning": "scholar; priest"
  "te-5205":
    "native": "wedding invitation card"
    "notes":
      "n1": "Built from పెళ్ళి (peḷḷi), wedding, and పత్రిక (patrika), a card or a letter."
    "examples":
      "నాకు పెళ్ళిపత్రిక వచ్చింది.":
        "native": "I received a wedding invitation card."
        "bases":
          "నాకు":
            "meaning": "I"
          "వచ్చింది":
            "meaning": "to come; to arrive"
      "పెళ్ళిపత్రికలో తేదీ, సమయం ఉన్నాయి.":
        "native": "The date and time are on the wedding card."
        "bases":
          "పెళ్ళిపత్రికలో":
            "meaning": "wedding invitation card"
          "ఉన్నాయి":
            "meaning": "to be"
  "te-5207":
    "native": "wedding pavilion; hall"
    "wiktionary": true
    "notes":
      "n1": "A covered pavilion or hall set up for a wedding or a festival."
    "examples":
      "పెళ్ళి మండపం పూలతో అలంకరించారు.":
        "native": "They decorated the wedding pavilion with flowers."
        "bases":
          "పూలతో":
            "meaning": "flower"
          "అలంకరించారు":
            "meaning": "to decorate"
      "మండపంలో చాలా మంది కూర్చున్నారు.":
        "native": "Many people sat in the pavilion."
        "bases":
          "మండపంలో":
            "meaning": "pavilion; hall"
          "కూర్చున్నారు":
            "meaning": "to sit"
          "మంది":
            "meaning": "people (counter for persons)"
  "te-5208":
    "native": "mangalsutra; wedding pendant"
    "notes":
      "n1": "Built from మంగళ (maṅgaḷa), auspicious, and సూత్రం (sūtraṁ), thread. A married woman wears it."
    "examples":
      "వధువు మెడలో మంగళసూత్రం ఉంది.":
        "native": "The bride has a mangalsutra around her neck."
        "bases":
          "మెడలో":
            "meaning": "neck"
          "ఉంది":
            "meaning": "to be; to have"
      "వరుడు మంగళసూత్రం కట్టాడు.":
        "native": "The groom tied the mangalsutra."
        "bases":
          "కట్టాడు":
            "meaning": "to tie"
  "te-5209":
    "native": "rice grains for blessing"
    "wiktionary": true
    "notes":
      "n1": "Plural only. Raw rice, often mixed with turmeric, thrown on a person as a blessing."
    "examples":
      "పెద్దలు అక్షింతలు వేసి ఆశీర్వదించారు.":
        "native": "The elders blessed the couple by throwing rice grains."
        "bases":
          "వేసి":
            "meaning": "to throw; to put"
          "ఆశీర్వదించారు":
            "meaning": "to bless"
      "అందరూ వధూవరుల మీద అక్షింతలు చల్లారు.":
        "native": "Everyone sprinkled rice grains on the bride and groom."
        "bases":
          "వధూవరుల":
            "meaning": "bride and groom"
          "చల్లారు":
            "meaning": "to sprinkle"
  "te-5210":
    "native": "coloured rice for the wedding"
    "wiktionary": true
    "notes":
      "n1": "Plural only. Coloured rice that the couple pour over each other during the wedding."
    "examples":
      "వధూవరులు తలంబ్రాలు పోసుకున్నారు.":
        "native": "The couple poured coloured rice over each other."
        "bases":
          "పోసుకున్నారు":
            "meaning": "to pour over oneself"
          "వధూవరులు":
            "meaning": "bride and groom"
      "తలంబ్రాలు పసుపు రంగులో ఉన్నాయి.":
        "native": "The coloured rice is yellow."
        "bases":
          "రంగులో":
            "meaning": "colour"
          "ఉన్నాయి":
            "meaning": "to be"
  "te-5211":
    "native": "flower garland"
    "notes":
      "n1": "Built from పూలు (pūlu), flowers, and దండ (daṇḍa), garland."
    "examples":
      "వరుడు వధువుకు పూలదండ వేశాడు.":
        "native": "The groom put a flower garland on the bride."
        "bases":
          "వధువుకు":
            "meaning": "bride"
          "వేశాడు":
            "meaning": "to put on; to place"
      "పూలదండ చాలా సువాసనగా ఉంది.":
        "native": "The flower garland smells very sweet."
        "bases":
          "సువాసనగా":
            "meaning": "fragrance; smell"
          "ఉంది":
            "meaning": "to be"
  "te-5212":
    "native": "procession"
    "wiktionary": true
    "notes":
      "n1": "A procession through the streets, for a god, a wedding or a leader."
    "examples":
      "వరుడి ఊరేగింపు ఊరంతా తిరిగింది.":
        "native": "The groom's procession went all around the village."
        "bases":
          "వరుడి":
            "meaning": "groom"
          "ఊరంతా":
            "meaning": "village"
          "తిరిగింది":
            "meaning": "to go around; to roam"
      "ఊరేగింపులో అందరూ పాటలు పాడారు.":
        "native": "Everyone sang songs in the procession."
        "bases":
          "ఊరేగింపులో":
            "meaning": "procession"
          "పాటలు":
            "meaning": "song"
          "పాడారు":
            "meaning": "to sing"
  "te-5213":
    "native": "priest"
    "wiktionary": true
    "notes":
      "n1": "The priest who leads the rites. The stem changes to పురోహితుడి (purōhituḍi) before case endings."
    "examples":
      "పురోహితుడు మంత్రాలు చదివారు.":
        "native": "The priest recited the mantras."
        "bases":
          "మంత్రాలు":
            "meaning": "mantra"
          "చదివారు":
            "meaning": "to read; to recite"
      "పురోహితుడు ఇంకా రాలేదు.":
        "native": "The priest has not come yet."
        "bases":
          "రాలేదు":
            "meaning": "to come"
  "te-5214":
    "native": "mantra; sacred verse"
    "notes":
      "n1": "A sacred verse or chant, said in worship."
    "examples":
      "మంత్రం వినగానే అందరూ లేచారు.":
        "native": "As soon as the mantra was heard, everyone stood up."
        "bases":
          "వినగానే":
            "meaning": "to hear"
          "లేచారు":
            "meaning": "to rise; to stand up"
      "అమ్మ రోజూ ఒక మంత్రం చదువుతుంది.":
        "native": "Mother recites a mantra every day."
        "bases":
          "చదువుతుంది":
            "meaning": "to read; to recite"
  "te-5215":
    "native": "fire ritual"
    "notes":
      "n1": "A fire ritual in which offerings are put into the fire."
    "examples":
      "పెళ్ళిలో హోమం చేశారు.":
        "native": "They held a fire ritual at the wedding."
        "bases":
          "పెళ్ళిలో":
            "meaning": "wedding; marriage"
          "చేశారు":
            "meaning": "to do"
      "హోమం ముందు అందరూ కూర్చున్నారు.":
        "native": "Everyone sat down before the fire ritual."
        "bases":
          "కూర్చున్నారు":
            "meaning": "to sit"
  "te-5219":
    "native": "best wishes"
    "notes":
      "n1": "Plural only. Best wishes for a birthday, a wedding or a festival."
    "examples":
      "మీకు శుభాకాంక్షలు!":
        "native": "Best wishes to you!"
        "bases":
          "మీకు":
            "meaning": "you"
      "అందరూ వధూవరులకు శుభాకాంక్షలు చెప్పారు.":
        "native": "Everyone sent their best wishes to the bride and groom."
        "bases":
          "వధూవరులకు":
            "meaning": "bride and groom"
          "చెప్పారు":
            "meaning": "to tell; to say"
  "te-5220":
    "native": "congratulations"
    "notes":
      "n1": "Plural only. Congratulations for good news or a success."
    "examples":
      "కొత్త జంటకు అభినందనలు!":
        "native": "Congratulations to the new couple!"
        "bases":
          "జంటకు":
            "meaning": "couple"
      "మీ పెళ్ళికి అభినందనలు తెలిపాను.":
        "native": "I sent my congratulations on your wedding."
        "bases":
          "మీ":
            "meaning": "you"
          "పెళ్ళికి":
            "meaning": "wedding; marriage"
          "తెలిపాను":
            "meaning": "to express; to convey"
  "te-5222":
    "native": "son-in-law"
    "synonyms":
