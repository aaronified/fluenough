        "native": "The band's instruments sounded."
        "bases":
          "వాయిద్యాలు":
            "meaning": "instrument"
          "మోగాయి":
            "meaning": "to sound; to ring"
      "మేళం ఇంటి ముందు ఆగింది.":
        "native": "The band stopped in front of the house."
