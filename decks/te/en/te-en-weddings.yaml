            "meaning": "we"
          "చెప్పాడు":
            "meaning": "to say; to tell"
          "స్వాగతం":
            "meaning": "welcome"
      "వియ్యంకులు ఇద్దరూ నవ్వుకున్నారు.":
        "native": "The two co-in-laws laughed together."
        "bases":
          "వియ్యంకులు":
            "meaning": "co-in-law"
          "నవ్వుకున్నారు":
            "meaning": "to laugh together"
          "ఇద్దరూ":
            "meaning": "two (people)"
