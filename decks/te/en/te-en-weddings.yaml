      "అత్తగారు అల్లుడికి పాయసం పెట్టారు.":
        "native": "The mother-in-law served payasam to the son-in-law."
        "bases":
          "అల్లుడికి":
            "meaning": "son-in-law"
          "పెట్టారు":
            "meaning": "to put; to serve"
  "te-5223":
    "native": "daughter-in-law"
    "wiktionary": true
    "notes":
      "n1": "A son's wife. The stem changes to కోడలి (kōḍali) before case endings: కోడలికి (kōḍaliki), కోడలిని (kōḍalini)."
    "examples":
      "కోడలు పాయసం వడ్డించింది.":
        "native": "The daughter-in-law served the payasam."
        "bases":
          "వడ్డించింది":
            "meaning": "to serve (food)"
      "మా కోడలు చాలా మంచిది.":
        "native": "Our daughter-in-law is very kind."
        "bases":
          "మా":
            "meaning": "we"
  "te-5224":
    "native": "blessing"
    "notes":
      "n1": "A blessing from an elder or from a god."
    "examples":
      "పెద్దల ఆశీర్వాదం తీసుకున్నారు.":
