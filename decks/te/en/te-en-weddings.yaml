        "bases":
          "మీ":
            "meaning": "you"
          "ఆశీర్వాదంతో":
            "meaning": "blessing"
          "జరిగాయి":
            "meaning": "to happen; to go"
  "te-5225":
    "native": "ring"
    "wiktionary": true
    "notes":
      "n1": "A ring, worn on the finger."
    "examples":
      "వరుడు వధువుకు ఉంగరం తొడిగాడు.":
