schema: 1
id: "te-en-dishes"
kind: "layer"
core: "te-dishes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Dishes of Andhra, Telangana and Hyderabad"
description: "Curries, rice, breads, snacks and sweets of Andhra, Telangana and Hyderabad, with where each comes from. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-6441":
    native: "chicken curry"
    notes:
      "n1": "The everyday chicken curry of Andhra, Telangana and Hyderabad: a thick, spiced gravy eaten with rice, roti or biryani."
    examples:
      "నాకు కోడి కూర కావాలి.": "I'd like chicken curry."
      "కోడి కూర చాలా బాగుంది.": { "native": "The chicken curry is very good.", "bases": { "బాగుంది": "is good; tastes good" } }
  "te-6442":
    native: "chicken pulusu"
    notes:
      "n1": "Pulusu is a tamarind-based stew (పులుసు, pulusu). Kodi pulusu is a thin, sour and hot chicken stew, eaten with rice. Common in coastal Andhra."
    examples:
      "కోడి పులుసు కారంగా ఉంది.": { "native": "The chicken pulusu is hot.", "bases": { "పులుసు": "tamarind stew; sour gravy", "ఉంది": "is; there is" } }
      "నాకు కోడి పులుసు కావాలి.": { "native": "I'd like chicken pulusu.", "bases": { "పులుసు": "tamarind stew; sour gravy" } }
    bases:
      "పులుసు": "tamarind stew; sour gravy"
  "te-6443":
    native: "fish pulusu"
    notes:
      "n1": "Fish cooked in a tamarind and chilli gravy, a Godavari and coastal Andhra favourite. Korameenu (కొరమీను, korameenu) is the classic fish for it."
    examples:
      "చేపల పులుసు చాలా బాగుంది.": { "native": "The fish pulusu is very good.", "bases": { "పులుసు": "tamarind stew; sour gravy", "బాగుంది": "is good; tastes good" } }
      "నాకు చేపల పులుసు కావాలి.": { "native": "I'd like fish pulusu.", "bases": { "పులుసు": "tamarind stew; sour gravy" } }
    bases:
      "పులుసు": "tamarind stew; sour gravy"
  "te-6444":
    native: "tamarind stew; sour gravy"
    notes:
      "n1": "A tamarind-based stew, sour and spiced, eaten with rice. Many dishes take the name: కోడి పులుసు (kōḍi pulusu), చేపల పులుసు (cēpala pulusu). The sourness is పులుపు (pulupu)."
    examples:
      "ఈ పులుసు పులుపుగా ఉంది.": { "native": "This pulusu is sour.", "bases": { "ఈ": "this", "పులుసు": "tamarind stew; sour gravy", "ఉంది": "is; there is" } }
      "పులుసు అన్నంతో బాగుంటుంది.": { "native": "Pulusu is good with rice.", "bases": { "పులుసు": "tamarind stew; sour gravy", "బాగుంటుంది": "is good; tastes good" } }
  "te-6445":
    native: "rasam; thin broth"
    notes:
      "n1": "The Telugu name of rasam (రసం, rasaṁ): a thin soup of tamarind, tomato and pepper, taken with rice. A pepper charu is often served first at a meal."
    examples:
      "చారు అన్నంలో కలుపుకోండి.": { "native": "Mix the charu into the rice.", "bases": { "చారు": "rasam; thin broth", "కలుపుకోండి": "mix in" } }
      "చారు చాలా కారంగా ఉంది.": { "native": "The charu is very hot.", "bases": { "చారు": "rasam; thin broth", "ఉంది": "is; there is" } }
  "te-6446":
    native: "dal soup; lentil rasam"
    notes:
      "n1": "Lentils cooked with tamarind and spices, eaten with rice and ghee. In a village meal it often comes early in the meal."
    examples:
      "పప్పుచారు నెయ్యితో బాగుంటుంది.": { "native": "Dal soup is good with ghee.", "bases": { "పప్పుచారు": "dal soup; lentil rasam", "బాగుంటుంది": "is good; tastes good" } }
      "నాకు పప్పుచారు కావాలి.": { "native": "I'd like dal soup.", "bases": { "పప్పుచారు": "dal soup; lentil rasam" } }
  "te-6447":
    native: "horse-gram soup"
    notes:
      "n1": "A soup of horse gram (ఉలవలు, ulavalu), an Andhra village food, thin and spicy, eaten with rice."
    examples:
      "ఉలవచారు అన్నంలో కలుపుకోండి.": { "native": "Mix the horse-gram soup into the rice.", "bases": { "ఉలవచారు": "horse-gram soup", "కలుపుకోండి": "mix in" } }
      "ఉలవచారు చాలా బాగుంది.": { "native": "The horse-gram soup is very good.", "bases": { "ఉలవచారు": "horse-gram soup", "బాగుంది": "is good; tastes good" } }
  "te-6448":
    native: "bagara rice; spiced rice"
    notes:
      "n1": "Rice cooked in ghee or oil with green chillies, cumin and onion, served at Hyderabadi meals with mirchi ka salan or kurma."
    examples:
      "బగారా అన్నం కారంగా ఉంటుంది.": { "native": "Bagara rice is spicy.", "bases": { "బగారా": "bagara (spiced)", "ఉంటుంది": "is; tastes" } }
      "నాకు బగారా అన్నం కావాలి.": { "native": "I'd like bagara rice.", "bases": { "బగారా": "bagara (spiced)" } }
    bases:
      "బగారా": "bagara (spiced)"
  "te-6449":
    native: "mutton curry"
    notes:
      "n1": "A Telangana and Hyderabad restaurant staple, cooked with ginger, garlic and garam masala."
    examples:
      "మటన్ కూర ఘాటుగా ఉంది.": { "native": "The mutton curry is hot.", "bases": { "ఘాటుగా": "strong; hot", "ఉంది": "is; there is" } }
      "నాకు మటన్ కూర కావాలి.": "I'd like mutton curry."
  "te-6450":
    native: "gongura chutney"
    notes:
      "n1": "A sour-hot chutney of gongura leaves (గోంగూర, gōṅgūra) ground with red chillies and garlic. The Andhra favourite with rice and ghee."
    examples:
      "గోంగూర పచ్చడి చాలా కారంగా ఉంది.": { "native": "The gongura chutney is very hot.", "bases": { "ఉంది": "is; there is" } }
      "గోంగూర పచ్చడి నెయ్యితో బాగుంటుంది.": { "native": "Gongura chutney is good with ghee.", "bases": { "బాగుంటుంది": "is good; tastes good" } }
  "te-6451":
    native: "mutton with gongura"
    notes:
      "n1": "Mutton cooked with gongura leaves, a sour Andhra dish, also called gongura mamsam."
    examples:
      "గోంగూర మాంసం అన్నంతో బాగుంటుంది.": { "native": "Mutton with gongura is good with rice.", "bases": { "బాగుంటుంది": "is good; tastes good" } }
      "నాకు గోంగూర మాంసం కావాలి.": "I'd like mutton with gongura."
  "te-6452":
    native: "mango pickle"
    notes:
      "n1": "Raw mango pickle with red chilli powder, mustard, salt and oil. The Andhra pickle eaten with rice and ghee; every family has its own recipe."
    examples:
      "ఆవకాయ అన్నంతో చాలా బాగుంది.": { "native": "The mango pickle with rice is very good.", "bases": { "ఆవకాయ": "mango pickle", "బాగుంది": "is good; tastes good" } }
      "ఇంకొంచెం ఆవకాయ ఇవ్వండి.": { "native": "Please give a little more mango pickle.", "bases": { "ఇంకొంచెం": "a little more", "ఆవకాయ": "mango pickle" } }
  "te-6453":
    native: "mashed dal"
    notes:
      "n1": "Dal mashed with ghee and green chillies, the first course of an Andhra meal, eaten with hot rice."
    examples:
      "ముద్దపప్పు అన్నంతో బాగుంటుంది.": { "native": "Mashed dal is good with rice.", "bases": { "ముద్దపప్పు": "mashed dal", "బాగుంటుంది": "is good; tastes good" } }
      "నాకు ముద్దపప్పు కావాలి.": { "native": "I'd like mashed dal.", "bases": { "ముద్దపప్పు": "mashed dal" } }
  "te-6454":
    native: "green-gram dosa"
    notes:
      "n1": "A crisp dosa of whole green gram (పెసర, pesara), made in Andhra and Telangana, often with ginger and green chilli."
    examples:
      "పెసరట్టు పొద్దున్నే బాగుంటుంది.": { "native": "Pesarattu is good in the morning.", "bases": { "పెసరట్టు": "green-gram dosa", "బాగుంటుంది": "is good; tastes good" } }
      "నాకు పెసరట్టు కావాలి.": { "native": "I'd like pesarattu.", "bases": { "పెసరట్టు": "green-gram dosa" } }
  "te-6455":
    native: "pesarattu with upma"
    notes:
      "n1": "Pesarattu topped with a layer of upma, an Andhra favourite, often served with ginger chutney."
    examples:
      "ఉప్మా పెసరట్టు చాలా బాగుంది.": { "native": "Upma pesarattu is very good.", "bases": { "పెసరట్టు": "green-gram dosa", "బాగుంది": "is good; tastes good" } }
      "ఉప్మా పెసరట్టు పొద్దున తింటారు.": { "native": "They eat upma pesarattu in the morning.", "bases": { "పెసరట్టు": "green-gram dosa", "తింటారు": "they eat" } }
    bases:
      "పెసరట్టు": "green-gram dosa"
  "te-6456":
    native: "chilli fritters"
    notes:
      "n1": "Long green chillies dipped in gram-flour batter and fried, a tea-time snack in Hyderabad and the Andhra towns."
    examples:
      "మిర్చి బజ్జీ వేడిగా ఉంది.": { "native": "The chilli fritters are hot.", "bases": { "మిర్చి": "chilli", "బజ్జీ": "fritter", "ఉంది": "is; there is" } }
      "నాకు మిర్చి బజ్జీ కావాలి.": { "native": "I'd like chilli fritters.", "bases": { "మిర్చి": "chilli", "బజ్జీ": "fritter" } }
    bases:
      "మిర్చి": "chilli"
      "బజ్జీ": "fritter"
  "te-6457":
    native: "puffed lentil fritters"
    notes:
      "n1": "Balls of rice and lentil batter, fried until puffed. A snack of Andhra and Telangana, eaten with chutney."
    examples:
      "పునుగులు వేడిగా ఉన్నాయి.": { "native": "The puffed fritters are hot.", "bases": { "పునుగులు": "puffed lentil fritters", "ఉన్నాయి": "are" } }
      "నాకు పునుగులు కావాలి.": { "native": "I'd like puffed fritters.", "bases": { "పునుగులు": "puffed lentil fritters" } }
  "te-6458":
    native: "haleem; slow-cooked meat and wheat"
    notes:
      "n1": "Hyderabadi haleem: wheat, lentils and meat cooked for hours until smooth. A Ramzan dish sold across the city."
    examples:
      "హలీం వేడిగా ఉంది.": { "native": "The haleem is hot.", "bases": { "హలీం": "haleem; slow-cooked meat and wheat", "ఉంది": "is; there is" } }
      "నాకు హలీం కావాలి.": { "native": "I'd like haleem.", "bases": { "హలీం": "haleem; slow-cooked meat and wheat" } }
  "te-6459":
    native: "bread pudding in sweet milk"
    notes:
      "n1": "A Hyderabadi dessert: fried bread soaked in sweet milk with nuts, saffron and cardamom. కా (kā) means 'of', and మీఠా (mīṭhā) means 'sweet' in Urdu."
    examples:
      "డబల్ కా మీఠా చాలా తీపిగా ఉంది.": { "native": "The double ka meetha is very sweet.", "bases": { "డబల్": "double (bread)", "కా": "of (Urdu)", "మీఠా": "sweet (Urdu)", "ఉంది": "is; there is" } }
      "నాకు డబల్ కా మీఠా కావాలి.": { "native": "I'd like double ka meetha.", "bases": { "డబల్": "double (bread)", "కా": "of (Urdu)", "మీఠా": "sweet (Urdu)" } }
    bases:
      "డబల్": "double (bread)"
      "కా": "of (Urdu)"
      "మీఠా": "sweet (Urdu)"
  "te-6460":
    native: "korma; mild creamy curry"
    notes:
      "n1": "A mild, creamy curry of meat or vegetables with coconut, cashew or yogurt. In Hyderabad it is served with biryani and bagara rice."
    examples:
      "బగారా అన్నంతో కుర్మా ఇవ్వండి.": { "native": "Please give korma with the bagara rice.", "bases": { "బగారా": "bagara (spiced)", "కుర్మా": "korma; mild creamy curry" } }
      "కుర్మా చాలా బాగుంది.": { "native": "The korma is very good.", "bases": { "కుర్మా": "korma; mild creamy curry", "బాగుంది": "is good; tastes good" } }
  "te-6461":
    native: "savoury lentil doughnuts"
    notes:
      "n1": "Urad-dal fritters, also called వడ (vaḍa, te-0683), fried and eaten with sambar or chutney. A tiffin snack."
    examples:
      "గారెలు సాంబారులో వేసుకోండి.": { "native": "Put the fritters into the sambar.", "bases": { "గారెలు": "savoury lentil doughnuts", "వేసుకోండి": "put in for yourself" } }
      "గారెలు వేడిగా ఉన్నాయి.": { "native": "The fritters are hot.", "bases": { "గారెలు": "savoury lentil doughnuts", "ఉన్నాయి": "are" } }
  "te-6462":
    native: "dry gravy"
    notes:
      "n1": "A dry-cooked curry in which the sauce thickens and coats the meat or vegetable, as in కోడి ఇగురు (kōḍi iguru), a chicken dry curry."
    examples:
      "కోడి ఇగురు చాలా ఘాటుగా ఉంది.": { "native": "The chicken dry curry is very hot.", "bases": { "ఇగురు": "dry gravy", "ఘాటుగా": "strong; hot", "ఉంది": "is; there is" } }
      "ఇగురు అన్నంతో బాగుంటుంది.": { "native": "The dry gravy is good with rice.", "bases": { "ఇగురు": "dry gravy", "బాగుంటుంది": "is good; tastes good" } }
  "te-6463":
    native: "dry fry; fried dish"
    notes:
      "n1": "Meat, fish or vegetables fried with spices, dry, without much gravy: కోడి వేపుడు (kōḍi vēpuḍu), chicken dry fry. From వేపు (vēpu), to fry."
    examples:
      "కోడి వేపుడు కారంగా ఉంది.": { "native": "The chicken dry fry is hot.", "bases": { "వేపుడు": "dry fry; fried dish", "ఉంది": "is; there is" } }
      "వేపుడు పులుసుతో బాగుంటుంది.": { "native": "The dry fry is good with pulusu.", "bases": { "వేపుడు": "dry fry; fried dish", "పులుసుతో": "with pulusu", "బాగుంటుంది": "is good; tastes good" } }
  "te-6464":
    native: "pulao; spiced rice"
    notes:
      "n1": "Rice cooked in stock with whole spices, meat or vegetables. Lighter than biryani; a party dish in Hyderabad and the Andhra towns."
    examples:
      "పులావ్ బాగుంది.": { "native": "The pulao is good.", "bases": { "పులావ్": "pulao; spiced rice", "బాగుంది": "is good; tastes good" } }
      "నాకు పులావ్ కావాలి.": { "native": "I'd like pulao.", "bases": { "పులావ్": "pulao; spiced rice" } }
  "te-6465":
    native: "phulka; soft wheat bread"
    notes:
      "n1": "A soft, thin wheat bread puffed over a flame and eaten with curry. Also called చపాతీ (capātī) in Telugu."
    examples:
      "పుల్కా వేడిగా ఉంది.": { "native": "The phulka is hot.", "bases": { "పుల్కా": "phulka; soft wheat bread", "ఉంది": "is; there is" } }
      "నాకు పుల్కా కావాలి.": { "native": "I'd like phulka.", "bases": { "పుల్కా": "phulka; soft wheat bread" } }
  "te-6466":
    native: "chapati; flat wheat bread"
    notes:
      "n1": "A flat wheat bread cooked on a griddle. Hyderabad restaurants serve it with kurma and curries. Also called పుల్కా (pulkā) in Telugu."
    examples:
      "చపాతీ కుర్మాతో బాగుంటుంది.": { "native": "Chapati is good with korma.", "bases": { "చపాతీ": "chapati; flat wheat bread", "కుర్మాతో": "with korma", "బాగుంటుంది": "is good; tastes good" } }
      "నాకు చపాతీ కావాలి.": { "native": "I'd like chapati.", "bases": { "చపాతీ": "chapati; flat wheat bread" } }
  "te-6467":
    native: "sweet flatbread with dal and jaggery"
    notes:
      "n1": "A sweet flatbread of chana dal and jaggery (బెల్లం, bellaṁ), a festival sweet for Ugadi and Sankranti in Andhra and Telangana. Eaten with ghee."
    examples:
      "బొబ్బట్లు తీపిగా ఉన్నాయి.": { "native": "The bobbatlu are sweet.", "bases": { "బొబ్బట్లు": "sweet flatbread with dal and jaggery", "ఉన్నాయి": "are" } }
      "నాకు బొబ్బట్లు కావాలి.": { "native": "I'd like bobbatlu.", "bases": { "బొబ్బట్లు": "sweet flatbread with dal and jaggery" } }
  "te-6468":
    native: "jaggery junnu; milk pudding"
    notes:
      "n1": "Junnu is the first milk after a calving: a thick, custard-like milk pudding sweetened with jaggery, a village sweet of coastal Andhra."
    examples:
      "బెల్లం జున్ను చాలా తీపిగా ఉంది.": { "native": "The jaggery junnu is very sweet.", "bases": { "జున్ను": "milk pudding", "ఉంది": "is; there is" } }
      "నాకు బెల్లం జున్ను కావాలి.": { "native": "I'd like jaggery junnu.", "bases": { "జున్ను": "milk pudding" } }
    bases:
      "జున్ను": "milk pudding"
  "te-6469":
    native: "ragi mudda; finger-millet ball"
    notes:
