schema: 1
id: "te-en-dishes"
kind: "layer"
core: "te-dishes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Dishes of Andhra, Telangana and Hyderabad"
description: "Curries, rice, breads, snacks and sweets of Andhra, Telangana and Hyderabad, with where each comes from. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-6441":
    native: "chicken curry"
    notes:
      "n1": "The everyday chicken curry: a spiced gravy eaten with rice, roti or biryani."
    examples:
      "నాకు కోడి కూర కావాలి.": "I'd like chicken curry."
      "కోడి కూర చాలా బాగుంది.": { "native": "The chicken curry is very good.", "bases": { "బాగుంది": "to be good; to taste good" } }
  "te-6442":
    native: "chicken pulusu"
    notes:
      "n1": "పులుసు (pulusu) is a tamarind stew. Kodi pulusu is a thin, sour and hot chicken stew, eaten with rice."
    examples:
      "కోడి పులుసు కారంగా ఉంది.": "The chicken pulusu is hot and spicy."
      "నాకు కోడి పులుసు కావాలి.": "I'd like chicken pulusu."
  "te-6443":
    native: "fish pulusu"
    notes:
      "n1": "Fish cooked in a sour tamarind and chilli gravy, an Andhra favourite. Korameenu, కొరమీను (koramīnu), murrel, is a classic fish for it. చేప (cēpa), fish, becomes చేపల (cēpala) before another noun."
    examples:
      "చేపల పులుసు చాలా బాగుంది.": { "native": "The fish pulusu is very good.", "bases": { "బాగుంది": "to be good; to taste good" } }
      "నాకు చేపల పులుసు కావాలి.": "I'd like fish pulusu."
  "te-6444":
    native: "tamarind stew; sour gravy"
    notes:
      "n1": "A tamarind-based stew, sour and spiced, eaten with rice. Many dishes take the name: కోడి పులుసు (kōḍi pulusu), చేపల పులుసు (cēpala pulusu). The sourness is పులుపు (pulupu)."
    examples:
      "ఈ పులుసు పులుపుగా ఉంది.": "This pulusu is sour."
      "పులుసు అన్నంతో బాగుంటుంది.": { "native": "Pulusu is good with rice.", "bases": { "బాగుంటుంది": "to be good; to taste good" } }
  "te-6446":
    native: "dal charu; lentil rasam"
    notes:
      "n1": "A thin rasam made from cooked dal and tamarind, eaten with rice. పప్పు (pappu) is dal and చారు (cāru) is rasam."
    examples:
      "పప్పుచారు నెయ్యితో బాగుంటుంది.": { "native": "Dal charu is good with ghee.", "bases": { "బాగుంటుంది": "to be good; to taste good" } }
      "నాకు పప్పుచారు కావాలి.": "I'd like dal charu."
  "te-6447":
    native: "horse-gram soup"
    notes:
      "n1": "A thin, spicy soup of horse gram, ఉలవలు (ulavalu), an Andhra favourite, eaten with rice."
    examples:
      "ఉలవచారు అన్నంలో కలుపుకోండి.": { "native": "Mix the horse-gram soup into your rice.", "bases": { "కలుపుకోండి": "to mix into one's own food" } }
      "ఉలవచారు చాలా బాగుంది.": { "native": "The horse-gram soup is very good.", "bases": { "బాగుంది": "to be good; to taste good" } }
  "te-6448":
    native: "bagara rice; Hyderabadi spiced rice"
    notes:
      "n1": "Hyderabadi spiced rice: rice cooked with whole spices in oil or ghee. It is usually served with a spicy curry, such as mirchi ka salan or korma."
    examples:
      "బగారా అన్నం కుర్మాతో బాగుంటుంది.": { "native": "Bagara rice is good with korma.", "bases": { "బగారా": "bagara (spiced and tempered, Hyderabadi style)", "బాగుంటుంది": "to be good; to taste good" } }
      "నాకు బగారా అన్నం కావాలి.": { "native": "I'd like bagara rice.", "bases": { "బగారా": "bagara (spiced and tempered, Hyderabadi style)" } }
    bases:
      "బగారా": "bagara (spiced and tempered, Hyderabadi style)"
  "te-6449":
    native: "mutton curry"
    notes:
      "n1": "A restaurant staple in Hyderabad and across Andhra and Telangana: mutton, which here means goat meat, cooked with onion, ginger, garlic and spices."
    examples:
      "మటన్ కూర ఘాటుగా ఉంది.": { "native": "The mutton curry is hot and spicy.", "bases": { "ఘాటుగా": "pungent; sharp-tasting" } }
      "నాకు మటన్ కూర కావాలి.": "I'd like mutton curry."
  "te-6450":
    native: "gongura chutney"
    notes:
      "n1": "A sour, hot chutney of gongura leaves, గోంగూర (gōṅgūra), ground with red chillies and garlic. An Andhra and Telangana favourite with rice and ghee."
    examples:
      "గోంగూర పచ్చడి చాలా కారంగా ఉంది.": "The gongura chutney is very hot and spicy."
      "గోంగూర పచ్చడి నెయ్యితో బాగుంటుంది.": { "native": "Gongura chutney is good with ghee.", "bases": { "బాగుంటుంది": "to be good; to taste good" } }
  "te-6451":
    native: "mutton with gongura"
    notes:
      "n1": "Goat meat (mutton) cooked with sour gongura leaves, a favourite of Andhra and Telangana. Menus also write గోంగూర మటన్ (gōṅgūra maṭan)."
    examples:
      "గోంగూర మాంసం అన్నంతో బాగుంటుంది.": { "native": "Mutton with gongura is good with rice.", "bases": { "బాగుంటుంది": "to be good; to taste good" } }
      "నాకు గోంగూర మాంసం కావాలి.": "I'd like mutton with gongura."
  "te-6452":
    native: "mango pickle"
    notes:
      "n1": "Raw mango pickle with mustard, red chilli powder, salt and oil, eaten with rice and ghee. Every family has its own recipe. ఇంకొంచెం (iṅkoñceṁ) is ఇంకా (iṅkā), more, with కొంచెం (koñceṁ), a little."
    examples:
      "ఆవకాయ అన్నంతో చాలా బాగుంది.": { "native": "The mango pickle is very good with rice.", "bases": { "బాగుంది": "to be good; to taste good" } }
      "ఇంకొంచెం ఆవకాయ ఇవ్వండి.": "Please give a little more mango pickle."
  "te-6453":
    native: "mashed dal"
    notes:
      "n1": "Toor dal cooked soft and mashed, eaten with hot rice, ghee and pickle, often as the first course of a meal."
    examples:
      "ముద్దపప్పు అన్నంతో బాగుంటుంది.": { "native": "Mashed dal is good with rice.", "bases": { "బాగుంటుంది": "to be good; to taste good" } }
      "నాకు ముద్దపప్పు కావాలి.": "I'd like mashed dal."
  "te-6454":
    native: "green-gram dosa"
    notes:
      "n1": "A crisp dosa of whole green gram, పెసలు (pesalu), made in Andhra and Telangana, often with ginger and green chilli."
    examples:
      "పెసరట్టు పొద్దున్నే బాగుంటుంది.": { "native": "Pesarattu is good first thing in the morning.", "bases": { "బాగుంటుంది": "to be good; to taste good" } }
      "నాకు పెసరట్టు కావాలి.": "I'd like pesarattu."
  "te-6455":
    native: "pesarattu with upma"
    notes:
      "n1": "Pesarattu with a layer of upma inside, an Andhra favourite, often served with ginger chutney."
    examples:
      "ఉప్మా పెసరట్టు చాలా బాగుంది.": { "native": "The upma pesarattu is very good.", "bases": { "బాగుంది": "to be good; to taste good" } }
      "ఉప్మా పెసరట్టు పొద్దున తింటారు.": "They eat upma pesarattu in the morning."
  "te-6456":
    native: "chilli fritters"
    notes:
      "n1": "Long green chillies dipped in gram-flour batter and fried, a tea-time snack in Hyderabad and the Andhra towns."
    examples:
      "మిర్చి బజ్జీ వేడిగా ఉంది.": { "native": "The chilli fritters are hot.", "bases": { "మిర్చి": "chilli", "బజ్జీ": "fritter" } }
      "నాకు మిర్చి బజ్జీ కావాలి.": { "native": "I'd like chilli fritters.", "bases": { "మిర్చి": "chilli", "బజ్జీ": "fritter" } }
    bases:
      "మిర్చి": "chilli"
      "బజ్జీ": "fritter"
  "te-6457":
    native: "punugulu; fried batter balls"
    notes:
      "n1": "Balls of rice and lentil batter, fried until puffed. A snack of Andhra and Telangana, eaten with chutney."
    examples:
      "పునుగులు వేడిగా ఉన్నాయి.": "The punugulu are hot."
      "నాకు పునుగులు కావాలి.": "I'd like punugulu."
  "te-6458":
    native: "haleem; slow-cooked meat and wheat"
    notes:
      "n1": "Hyderabadi haleem: wheat, lentils and meat cooked for hours until smooth. A Ramzan dish sold across the city."
    examples:
      "హలీం వేడిగా ఉంది.": "The haleem is hot."
      "నాకు హలీం కావాలి.": "I'd like haleem."
  "te-6459":
    native: "double ka meetha; bread pudding"
    notes:
      "n1": "A Hyderabadi dessert: fried bread soaked in sweet milk with nuts and cardamom. కా (kā) means 'of' and మీఠా (mīṭhā) means 'sweet' in Urdu and Hindi."
    examples:
      "డబల్ కా మీఠా చాలా తీపిగా ఉంది.": { "native": "The double ka meetha is very sweet.", "bases": { "డబల్": "double (bread)", "కా": "of (in Urdu and Hindi)", "మీఠా": "sweet (in Urdu and Hindi)" } }
      "నాకు డబల్ కా మీఠా కావాలి.": { "native": "I'd like double ka meetha.", "bases": { "డబల్": "double (bread)", "కా": "of (in Urdu and Hindi)", "మీఠా": "sweet (in Urdu and Hindi)" } }
    bases:
      "డబల్": "double (bread)"
      "కా": "of (in Urdu and Hindi)"
      "మీఠా": "sweet (in Urdu and Hindi)"
  "te-6460":
    native: "korma; mild creamy curry"
    notes:
      "n1": "A mild, creamy curry of meat or vegetables with coconut, cashew or yogurt. In Hyderabad it is often served with biryani and bagara rice."
    examples:
      "బగారా అన్నంతో కుర్మా ఇవ్వండి.": { "native": "Please give korma with the bagara rice.", "bases": { "బగారా": "bagara (spiced and tempered, Hyderabadi style)" } }
      "కుర్మా చాలా బాగుంది.": { "native": "The korma is very good.", "bases": { "బాగుంది": "to be good; to taste good" } }
  "te-6461":
    native: "savoury lentil doughnuts"
    notes:
      "n1": "Urad-dal fritters, fried and eaten with sambar or chutney as a tiffin snack. In the same family as వడ (vaḍa)."
    examples:
      "గారెలు సాంబారులో వేసుకోండి.": "Put the fritters into the sambar."
      "గారెలు వేడిగా ఉన్నాయి.": "The fritters are hot."
  "te-6462":
    native: "thick, dry-ish gravy; a curry cooked down"
    notes:
      "n1": "A curry cooked down until the gravy is thick and clings to the meat or vegetable: కోడి ఇగురు (kōḍi iguru), chicken iguru. Thicker than a పులుసు (pulusu), and not as dry as a వేపుడు (vēpuḍu)."
    examples:
      "కోడి ఇగురు చాలా ఘాటుగా ఉంది.": { "native": "The chicken iguru is very hot and spicy.", "bases": { "ఘాటుగా": "pungent; sharp-tasting" } }
      "ఇగురు అన్నంతో బాగుంటుంది.": { "native": "Iguru is good with rice.", "bases": { "బాగుంటుంది": "to be good; to taste good" } }
  "te-6463":
    native: "dry stir-fry; fried dish"
    notes:
      "n1": "Meat, fish or vegetables fried with spices until dry, with little gravy: కోడి వేపుడు (kōḍi vēpuḍu), chicken dry fry. From వేపు (vēpu), to fry."
    examples:
      "కోడి వేపుడు కారంగా ఉంది.": "The chicken dry fry is hot and spicy."
      "వేపుడు అన్నంతో బాగుంటుంది.": { "native": "The dry fry is good with rice.", "bases": { "బాగుంటుంది": "to be good; to taste good" } }
  "te-6464":
    native: "pulao; spiced rice"
    notes:
      "n1": "Rice cooked in stock with whole spices, meat or vegetables. Milder than biryani; a party dish in Hyderabad and the Andhra towns."
    examples:
      "పులావ్ బాగుంది.": { "native": "The pulao is good.", "bases": { "బాగుంది": "to be good; to taste good" } }
      "నాకు పులావ్ కావాలి.": "I'd like pulao."
  "te-6465":
    native: "phulka; soft wheat bread"
    notes:
      "n1": "A thin, soft wheat bread puffed over a flame and eaten with curry. Like a చపాతీ (capātī), but cooked partly over the flame."
    examples:
      "పుల్కా వేడిగా ఉంది.": "The phulka is hot."
      "నాకు పుల్కా కావాలి.": "I'd like phulka."
  "te-6466":
    native: "chapati; flat wheat bread"
    notes:
      "n1": "A flat wheat bread cooked on a griddle. Restaurants serve it with korma and other curries. Close to a పుల్కా (pulkā), which is puffed over the flame."
    examples:
      "చపాతీ కుర్మాతో బాగుంటుంది.": { "native": "Chapati is good with korma.", "bases": { "బాగుంటుంది": "to be good; to taste good" } }
      "నాకు చపాతీ కావాలి.": "I'd like chapati."
  "te-6467":
    native: "bobbatlu; sweet flatbread stuffed with dal and jaggery"
    notes:
      "n1": "A sweet flatbread stuffed with chana dal and jaggery, బెల్లం (bellaṁ), made for festivals in Andhra and Telangana and eaten with ghee."
    examples:
      "బొబ్బట్లు తీపిగా ఉన్నాయి.": "The bobbatlu are sweet."
      "నాకు బొబ్బట్లు కావాలి.": "I'd like bobbatlu."
  "te-6468":
    native: "jaggery junnu; colostrum pudding"
    notes:
      "n1": "Junnu is a milk pudding made from the first milk after a cow calves, steamed until set like custard. This one is sweetened with jaggery, బెల్లం (bellaṁ)."
    examples:
      "బెల్లం జున్ను చాలా తీపిగా ఉంది.": { "native": "The jaggery junnu is very sweet.", "bases": { "జున్ను": "junnu; colostrum pudding" } }
      "నాకు బెల్లం జున్ను కావాలి.": { "native": "I'd like jaggery junnu.", "bases": { "జున్ను": "junnu; colostrum pudding" } }
    bases:
      "జున్ను": "junnu; colostrum pudding"
  "te-6469":
    native: "ragi mudda; finger-millet ball"
    notes:
      "n1": "A ball of finger-millet flour, రాగి (rāgi), cooked in water, swallowed with a dal or curry. A staple of Rayalaseema and Telangana villages."
    examples:
      "రాగి ముద్ద పప్పుతో బాగుంటుంది.": { "native": "Ragi mudda is good with dal.", "bases": { "ముద్ద": "ball; lump", "బాగుంటుంది": "to be good; to taste good" } }
      "నాకు రాగి ముద్ద కావాలి.": { "native": "I'd like ragi mudda.", "bases": { "ముద్ద": "ball; lump" } }
    bases:
      "ముద్ద": "ball; lump"
  "te-6470":
    native: "groundnut powder"
    notes:
      "n1": "Roasted groundnut, పల్లీ (pallī), powder with chilli and salt, eaten with rice and ghee, or with idli and dosa."
    examples:
      "పల్లీపొడి అన్నంతో బాగుంటుంది.": { "native": "Groundnut powder is good with rice.", "bases": { "బాగుంటుంది": "to be good; to taste good" } }
      "నాకు పల్లీపొడి కావాలి.": "I'd like groundnut powder."
  "te-6471":
    native: "ghee rice"
    notes:
      "n1": "Rice cooked with ghee and mild spices, served with dal, curry or pickle."
    examples:
      "నెయ్యి అన్నం పప్పుతో బాగుంటుంది.": { "native": "Ghee rice is good with dal.", "bases": { "బాగుంటుంది": "to be good; to taste good" } }
      "నాకు నెయ్యి అన్నం కావాలి.": "I'd like ghee rice."
  "te-6472":
    native: "curd rice"
    notes:
      "n1": "Rice mixed with curd, పెరుగు (perugu), then tempered with mustard, cumin and curry leaves. పెరుగు (perugu) and అన్నం (annaṁ) join as పెరుగన్నం (perugannaṁ): the last -u drops. Often the last course of a meal."
    examples:
      "పెరుగన్నం చాలా బాగుంది.": { "native": "The curd rice is very good.", "bases": { "బాగుంది": "to be good; to taste good" } }
      "చివర పెరుగన్నం తింటారు.": { "native": "They eat curd rice at the end.", "bases": { "చివర": "end" } }
  "te-6473":
    native: "fried rice"
    notes:
      "n1": "Indo-Chinese fried rice, sold in Chinese restaurants in Hyderabad, usually with a chicken or vegetable gravy."
    examples:
      "ఫ్రైడ్ రైస్ కూరతో బాగుంటుంది.": { "native": "Fried rice is good with a curry.", "bases": { "ఫ్రైడ్": "fried", "రైస్": "rice", "బాగుంటుంది": "to be good; to taste good" } }
      "నాకు ఫ్రైడ్ రైస్ కావాలి.": { "native": "I'd like fried rice.", "bases": { "ఫ్రైడ్": "fried", "రైస్": "rice" } }
    bases:
      "ఫ్రైడ్": "fried"
      "రైస్": "rice"
  "te-6474":
    native: "chilli chicken"
    notes:
      "n1": "Indo-Chinese chicken, fried and tossed with green chillies, soy sauce and garlic. A favourite in Hyderabad, often ordered with fried rice."
    examples:
