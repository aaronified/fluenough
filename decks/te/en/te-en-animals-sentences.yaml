id: "te-en-animals-sentences"
kind: "layer"
core: "te-animals-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Animals: sentences"
description: "Sentences about animals and what they do, with the words of the animals unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-1014":
    notes:
      "n1": "ఇంటి (iṇṭi) is the genitive form of ఇల్లు (illu), house, and comes before బయట (bayaṭa), outside."
    native: "The dog is outside the house."
    alt_native: ["The dog is out of the house."]
  "te-1015":
    notes:
      "n1": "తాగుతుంది (tāgutundi), it drinks, has the third-person singular present-future ending -tundi, as in నడుస్తుంది (naḍustundi), she walks."
    native: "The cat drinks milk."
  "te-1016":
    notes:
      "n1": "తింటుంది (tiṇṭundi), it eats, has the third-person singular present-future ending -tundi, as in తాగుతుంది (tāgutundi), it drinks."
    native: "The cow eats grass."
    bases:
      "గడ్డి": "grass; straw"
  "te-1017":
    notes:
      "n1": "ఎడ్లను (eḍlanu) is ఎడ్లు (eḍlu), oxen, with the object ending -nu, the thing the verb acts on."
    native: "The farmer uses oxen in the field."
    alt_native: ["The farmer uses bullocks in the field."]
    bases:
      "ఉపయోగిస్తాడు": "to use"
  "te-1018":
    notes:
      "n1": "ఉన్నాయి (unnāyi), are, is the plural form used for things and animals, not people."
    native: "The birds are on the tree."
    bases:
      "చెట్టు": "tree"
  "te-1019":
    notes:
      "n1": "చాలా (cālā), very, goes before the adjective, and పెద్దది (peddadi) already says it is, with no separate word for is."
    native: "The elephant is very big."
    alt_native: ["The elephant is very large."]
  "te-1020":
    notes:
      "n1": "పొడవుగా (poḍavugā), long, has the ending -gā and goes with ఉంది (undi) to describe the snake."
    native: "This snake is very long."
  "te-1021":
    notes:
      "n1": "ఎక్కుతాయి (ekkutāyi), they climb, has the non-human plural ending -tāyi, used for animals and things."
    native: "Monkeys climb trees."
    bases:
      "చెట్టు": "tree"
  "te-1022":
    notes:
      "n1": "నాకు (nāku) is the dative of నేను (nēnu), I, so the liking is to me."
    native: "I like cats."
  "te-1023":
    notes:
      "n1": "తాగుతాను (tāgutānu), I drink, has the first-person present-future ending -ānu, as in తోముకుంటాను (tōmukuṇṭānu), I brush."
    native: "I drink cow's milk."
    alt_native: ["I drink milk from cows."]
