"cards":
  "te-1914":
    "native": "to play (an instrument)"
    "notes":
      "n1": "To play the veena, a stringed instrument: {1}."
      "n2": "The stem changes in the present: 'I play' is {1}."
    "examples":
      "ఆమె వీణ వాయిస్తుంది.":
        "native": "She plays the veena."
        "bases":
          "వాయిస్తుంది":
            "meaning": "to play (an instrument)"
      "అన్నయ్య పియానో వాయిస్తాడు.":
        "native": "My elder brother plays the piano."
        "bases":
          "వాయిస్తాడు":
            "meaning": "to play (an instrument)"
  "te-1915":
    "native": "to draw; to paint"
    "notes":
      "n1": "To draw a picture: {1}. The word బొమ్మ alone can also mean a doll."
      "n2": "The stem changes in the present: 'I draw' is {1}."
    "examples":
      "నేను బొమ్మ గీస్తాను.":
        "native": "I draw a picture."
        "bases":
          "గీస్తాను":
            "meaning": "to draw; to paint"
      "ఈ బొమ్మ ఎవరు గీశారు?":
        "native": "Who drew this picture?"
        "bases":
          "గీశారు":
            "meaning": "to draw; to paint"
  "te-1923":
    "native": "to win"
    "notes":
      "n1": "To win a game: {1}."
      "n2": "The stem changes in the present: 'I win' is {1}."
    "examples":
      "మా జట్టు ఈ రోజు గెలుస్తుంది.":
        "native": "Our team will win today."
        "bases":
          "గెలుస్తుంది":
            "meaning": "to win"
      "ఈసారి మీరు గెలుస్తారా?":
        "native": "Will you win this time?"
        "bases":
          "గెలుస్తారా":
            "meaning": "to win"
  "te-1922":
    "native": "swimming"
    "notes":
      "n1": "'To swim' is {1}: the noun ఈత goes with the verb కొట్టడం."
    "examples":
      "నేను ప్రతి ఆదివారం ఈత కొడతాను.":
        "native": "I go swimming every Sunday."
        "bases":
          "కొడతాను":
            "meaning": "to hit; in ఈత కొట్టడం, to swim"
      "నాన్నకు ఈత బాగా వచ్చు.":
        "native": "Dad is good at swimming."
        "bases":
          "నాన్నకు":
            "meaning": "dad; father"
          "వచ్చు":
            "meaning": "to come; here, to know how to"
    "synonyms":
      "iduta": "swimming"
    "wiktionary": true
  "te-1900":
    "native": "film; movie"
    "notes":
      "n1": "'To watch a film' is {1}; films in the plural are {2}."
    "examples":
      "నేను ఆదివారం సినిమా చూస్తాను.":
        "native": "I watch a film on Sunday."
        "bases":
          "చూస్తాను":
            "meaning": "to watch; to see"
      "ఈ సినిమా చాలా బాగుంది.":
        "native": "This film is very good."
        "bases":
          "బాగుంది":
            "meaning": "to be good; to be fine"
    "synonyms":
      "citramu": "picture; (older) film"
    "senses":
      "film":
        "native": "film"
      "cinema":
        "native": "cinema"
    "wiktionary": true
  "te-1901":
    "native": "picture; painting"
    "notes":
      "n1": "Pictures in the plural: {1}."
    "examples":
      "ఈ చిత్రం చాలా అందంగా ఉంది.":
        "native": "This picture is very beautiful."
        "bases":
          "అందంగా":
            "meaning": "beauty; here, beautifully"
          "ఉంది":
            "meaning": "to be; to have"
      "ఆమె ఒక చిత్రం గీస్తోంది.":
        "native": "She is drawing a picture."
        "bases":
          "గీస్తోంది":
            "meaning": "to draw; to paint"
    "wiktionary": true
  "te-1902":
    "native": "poem"
    "notes":
      "n1": "Reading poems: {1}."
    "examples":
      "ఆమె ఒక కవిత రాస్తోంది.":
        "native": "She is writing a poem."
        "bases":
          "రాస్తోంది":
            "meaning": "to write"
      "ఈ కవిత నాకు ఇష్టం.":
        "native": "I like this poem."
    "synonyms":
      "kavitvamu": "poetry, the art rather than one poem"
    "wiktionary": true
  "te-1917":
    "native": "play; drama on stage"
    "notes":
      "n1": "Watching a play: {1}."
    "examples":
      "మా స్కూల్లో ఒక నాటకం జరుగుతుంది.":
        "native": "A play is being held at our school."
        "bases":
          "స్కూల్లో":
            "meaning": "school"
          "జరుగుతుంది":
            "meaning": "to happen; to be held"
      "నాకు నాటకాలు చూడడం ఇష్టం.":
        "native": "I like watching plays."
        "bases":
          "నాటకాలు":
            "meaning": "play; drama"
    "wiktionary": true
  "te-1918":
    "native": "performance; show"
    "notes":
      "n1": "To give a performance: {1}."
    "examples":
      "ఈ ప్రదర్శన చాలా బాగుంది.":
        "native": "This performance is very good."
        "bases":
          "బాగుంది":
            "meaning": "to be good; to be fine"
      "రేపు సంగీత ప్రదర్శన ఉంది.":
        "native": "There is a music show tomorrow."
        "bases":
          "సంగీత":
            "meaning": "music"
          "ఉంది":
            "meaning": "to be; to have"
  "te-1912":
    "native": "radio"
    "notes":
      "n1": "To switch on the radio: {1}."
    "examples":
      "నేను రేడియోలో పాటలు వింటాను.":
        "native": "I listen to songs on the radio."
        "bases":
          "రేడియోలో":
            "meaning": "radio"
          "పాటలు":
            "meaning": "song"
          "వింటాను":
            "meaning": "to listen; to hear"
      "రేడియో పెట్టండి.":
        "native": "Please switch on the radio."
        "bases":
          "పెట్టండి":
            "meaning": "to put; to switch on"
    "wiktionary": true
  "te-1904":
    "native": "cooking; the food made at home"
    "notes":
      "n1": "'To cook' is {1}."
    "examples":
      "నాకు వంట చేయడం ఇష్టం.":
        "native": "I like cooking."
      "అమ్మ వంట బాగా చేస్తుంది.":
        "native": "Mom cooks well."
        "bases":
          "చేస్తుంది":
            "meaning": "to do; to make; to cook"
    "wiktionary": true
  "te-1903":
    "native": "plant"
    "notes":
      "n1": "To water plants: {1}."
    "examples":
      "తోటలో ఒక మొక్క ఉంది.":
        "native": "There is a plant in the garden."
        "bases":
          "తోటలో":
            "meaning": "garden"
          "ఉంది":
            "meaning": "to be; to have"
      "నేను మొక్కలకు నీళ్ళు పోస్తాను.":
        "native": "I water the plants."
        "bases":
          "మొక్కలకు":
            "meaning": "plant"
          "నీళ్ళు":
            "meaning": "water"
          "పోస్తాను":
            "meaning": "to pour"
    "synonyms":
      "molaka": "sprout"
      "naru": "seedling"
    "senses":
      "germ":
        "native": "germ; sprouting seed"
    "wiktionary": true
  "te-1906":
    "native": "club"
    "notes":
      "n1": "Club members: {1}."
    "examples":
