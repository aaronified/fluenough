native: { code: "en", iso639_3: "eng", name: "English" }
name: "Daily life: sentences"
description: "Ten sentences about a day's routine: meals, waking, sleeping and work, with the words of the daily life unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-7140":
    notes:
      "n1": "రోజూ (rōjū), every day, is a separate word that comes before the verb, and వండుతుంది (vaṇḍutundi) is the form for she or it of వండడం (vaṇḍaḍaṁ), to cook."
    native: "Mum cooks every day."
    confusables:
      "c1": { why: "తినడం (tinaḍaṁ) 'to eat', is eating, not cooking." }
      "c2": { why: "తాగడం (tāgaḍaṁ) 'to drink', is drinking, not cooking." }
  "te-7141":
    notes:
      "n1": "టిఫిన్ (ṭiphin), breakfast, usually takes no ending for the thing acted on, since it is not a particular thing, and తింటాడు (tiṇṭāḍu) is the 'he' form of తినడం (tinaḍaṁ), to eat."
    native: "Dad eats breakfast."
    confusables:
      "c1": { why: "కొడుకు (koḍuku) 'son', is a person, not a meal." }
      "c2": { why: "కూతురు (kūturu) 'daughter', is a person, not a meal." }
  "te-7142":
    notes:
      "n1": "పడుకుంటారు (paḍukuṇṭāru) is the -ారు (-āru) form for మీరు (mīru), you as respectful or plural, the form the grammar deck gives for someone you respect, and ఎప్పుడు (eppuḍu), when, is the question word."
    native: "When do you go to bed?"
    confusables:
      "c1": { why: "ఎక్కడ (ekkaḍa) 'where', asks for a place, not a time." }
      "c2": { why: "ఎందుకు (enduku) 'why', asks for a reason." }
  "te-7143":
    notes:
      "n1": "గంటలకు (gaṇṭalaku) takes the 'to' form for a clock time, as in ఆరు (āru) గంటలకు (gaṇṭalaku) in the verbs unit, and లేస్తాను (lēstānu) is the 'I' form of లేవడం (lēvaḍaṁ), to get up."
    native: "I get up at six o'clock every day."
    bases:
      "గంటలకు": "o'clock"
    confusables:
      "c1": { why: "ఏడు (ēḍu) '7, seven', is a different hour." }
      "c2": { why: "ఎనిమిది (enimidi) '8, eight', is a different hour." }
  "te-7144":
    notes:
      "n1": "మీరు (mīru) takes the form for a respectful or plural you, so తాగుతారా (tāgutārā) is that form asked as a question; ఎప్పుడూ (eppuḍū), always, comes before the verb, as రోజూ (rōjū) does."
    native: "Do you always drink milk?"
    confusables:
      "c1": { why: "గుడ్డు (guḍḍu) 'egg', is not a drink." }
      "c2": { why: "చేప (cēpa) 'fish', is not a drink." }
  "te-7145":
    native: "Then he comes home."
    notes:
      "n1": "The stem is వస్త- (vast-) of రావడం (rāvaḍaṁ), 'to come', in the present."
    confusables:
      "c1": { why: "కుటుంబం (kuṭumbaṁ) 'family', names people, not a home." }
      "c2": { why: "ఊరు (ūru) 'town', is a town, not a home." }
  "te-7146":
    notes:
      "n1": "పడుకోండి (paḍukōṇḍi) is the polite request form of పడుకోవడం (paḍukōvaḍaṁ), to go to bed."
    native: "Please go to bed now."
    confusables:
      "c1": { why: "రేపు (rēpu) 'tomorrow', asks for a day, not now." }
      "c2": { why: "నిన్న (ninna) 'yesterday', is a past day." }
  "te-7147":
    notes:
      "n1": "అప్పుడప్పుడు (appuḍappuḍu), sometimes, doubles అప్పుడు (appuḍu), the word the when unit uses to build its forms."
    native: "I sometimes cook."
    confusables:
      "c1": { why: "ఎప్పుడూ (eppuḍū) 'always', is every time, not sometimes." }
      "c2": { why: "తినడం (tinaḍaṁ) 'to eat', is eating, not cooking." }
  "te-7148":
    native: "Does Mum usually come in the evening?"
    notes:
      "n1": "The stem is వస్త- (vast-) of రావడం (rāvaḍaṁ), 'to come', in the present."
    confusables:
      "c1": { why: "పొద్దున (podduna) 'morning', is a different time of day." }
      "c2": { why: "రాత్రి (rātri) 'night', is a different time." }
  "te-7149":
    notes:
      "n1": "తర్వాత (tarvāta), after, comes after the noun it follows, as in టిఫిన్ (ṭiphin) తర్వాత (tarvāta)."
    native: "After breakfast I read."
    confusables:
      "c1": { why: "చూడడం (cūḍaḍaṁ) 'to see; to watch', is watching, not reading." }
      "c2": { why: "రాయడం (rāyaḍaṁ) 'to write', is writing, not reading." }
