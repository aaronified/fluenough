schema: 1
id: "te-en-script-conjuncts"
kind: "layer"
core: "te-script-conjuncts"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Telugu conjuncts"
description: "Two consonants with no vowel between them are joined: the second is written below the first, as a small form (vattu). Doubled consonants are very common in Telugu."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "te-0086":
    native: "kk (double k)"
    notes:
      "n1": "క (ka) with its vattu below: the k is held longer. కుక్క (kukka, dog). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "ఇక్కడ ఉండు.": {"native": "Stay here.", "bases": {}},
      "ఇక్కడ కూర్చో.": {"native": "Sit here.", "bases": {}}
    }
  "te-0087":
    native: "gg (double g)"
    notes:
      "n1": "గ (ga) doubled: ముగ్గు (muggu, rangoli). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "ఉష్ణోగ్రత తగ్గింది.": {"native": "The temperature has fallen.", "bases": {}},
      "రద్దీ తగ్గింది.": {"native": "The crowd has reduced.", "bases": {}}
    }
  "te-0088":
    native: "chch (double ch)"
    notes:
      "n1": "చ (ca) doubled: వచ్చాను (vaccānu, I came). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "అబ్బాయి వచ్చాడు.": {"native": "The boy came.", "bases": {"అబ్బాయి": "boy; young man"}},
      "ఆలస్యంగా వచ్చాను.": {"native": "I came late.", "bases": {}}
    }
  "te-0089":
    native: "tt, curled back (double t)"
    notes:
      "n1": "ట (ṭa) doubled: పట్టు (paṭṭu, silk). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "చెత్తబుట్ట నిండింది.": {"native": "The dustbin is full.", "bases": {}},
      "పుట్టినరోజు శుభాకాంక్షలు!": {"native": "Happy birthday!", "bases": {"పుట్టినరోజు": "birthday", "శుభాకాంక్షలు": "good wish; greeting"}}
    }
  "te-0090":
    native: "dd, curled back (double d)"
    notes:
      "n1": "డ (ḍa) doubled: అడ్డం (aḍḍam, across; in the way). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "వడగళ్ళు పడ్డాయి.": {"native": "Hail fell.", "bases": {}},
      "తొక్కిసలాటలో కొంతమంది గాయపడ్డారు.": {"native": "Some people were injured in the stampede.", "bases": {}}
    }
  "te-0091":
    native: "tt, on the teeth (double t)"
    notes:
      "n1": "త (ta) doubled: అత్త (atta, aunt). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "అతని ఎత్తు ఎంత?": {"native": "How tall is he?", "bases": {}}
    }
  "te-0092":
    native: "dd, on the teeth (double d)"
    notes:
      "n1": "ద (da) doubled: పెద్ద (pedda, big). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "రద్దు చేయండి.": {"native": "Please cancel.", "bases": {}},
      "రద్దు చేయడం": {"native": "to cancel", "bases": {}}
    }
  "te-0093":
    native: "nn (double n)"
    notes:
      "n1": "న (na) doubled: అన్న (anna, elder brother). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "te-0094":
    native: "pp (double p)"
    notes:
      "n1": "ప (pa) doubled: పప్పు (pappu, lentils). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "te-0095":
    native: "mm (double m)"
    notes:
      "n1": "మ (ma) doubled: అమ్మ (amma, mother). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "నెమ్మదిగా నడువు.": {"native": "Walk slowly.", "bases": {}}
    }
  "te-0096":
    native: "ll (double l)"
    notes:
      "n1": "ల (la) doubled: ఇల్లు (illu, house). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "te-0097":
    native: "ll, curled back (double l)"
    notes:
      "n1": "ళ (ḷa) doubled: నీళ్ళు (nīḷḷu, water). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "te-0098":
    native: "yy (double y)"
    notes:
      "n1": "య (ya) doubled: చెయ్యి (ceyyi, hand). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "అన్నయ్య పియానో వాయిస్తాడు.": {"native": "My elder brother plays the piano.", "bases": {}},
      "వియ్యంకులు ఇద్దరూ నవ్వుకున్నారు.": {"native": "The two co-in-laws laughed together.", "bases": {}}
    }
  "te-0099":
    native: "vv (double v)"
    notes:
      "n1": "వ (va) doubled: ఇవ్వండి (ivvaṇḍi, please give). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "టిప్ ఇవ్వనా?": {"native": "Shall I leave a tip?", "bases": {}},
      "నాకు ఇవ్వు.": {"native": "Give me.", "bases": {}}
    }
  "te-0100":
    native: "k + the r-vattu"
    notes:
      "n1": "ర (ra) after a consonant is written below it as the r-vattu: క్రీడ (krīḍa, sport)."
    "examples": {
      "గడువు శుక్రవారం.": {"native": "The deadline is Friday.", "bases": {}},
      "ప్రిస్క్రిప్షన్ ఉంది.": {"native": "I have a prescription.", "bases": {}}
    }
  "te-0101":
    native: "p + the r-vattu"
    notes:
      "n1": "The r-vattu below ప (pa): ప్రేమ (prēma, love)."
    "examples": {
      "ప్రయత్నం చేయడం": {"native": "to try", "bases": {"ప్రయత్నం": "attempt; effort"}},
      "ప్రయాణం చేయడం": {"native": "to travel", "bases": {"ప్రయాణం": "journey; travel"}}
    }
  "te-0102":
    native: "t + the r-vattu"
    notes:
      "n1": "The r-vattu below త (ta): రాత్రి (rātri, night)."
    "examples": {
      "శుభ రాత్రి!": {"native": "Good night!", "bases": {"శుభ": "good; auspicious"}},
      "ఆమె మంచి చిత్రకారిణి.": {"native": "She is a good painter.", "bases": {}}
    }
  "te-0103":
    native: "sh + the r-vattu"
    notes:
      "n1": "The r-vattu below శ (śa): శ్రమ (śrama, labour)."
    "examples": {
      "విమానాశ్రయంలో విమానం ఎక్కాను.": {"native": "I boarded the plane at the airport.", "bases": {}},
      "విమానాశ్రయం నగరానికి దూరంగా ఉంది.": {"native": "The airport is far from the city.", "bases": {}}
    }
  "te-0104":
    native: "v + the y-vattu"
    notes:
      "n1": "య (ya) after a consonant is written below and to the right of it as the y-vattu: వ్యాపారం (vyāpāram, business)."
    "examples": {
      "సినిమా రివ్యూ చదివావా?": {"native": "Did you read the film review?", "bases": {}},
      "ఉదయం వ్యాయామం ఆరోగ్యానికి మంచిది.": {"native": "Morning exercise is good for your health.", "bases": {}}
    }
  "te-0105":
    native: "d + the y-vattu"
    notes:
      "n1": "The y-vattu below ద (da): విద్యార్థి (vidyārthi, student)."
    "examples": {
      "నేను విద్యార్థిని.": {"native": "I am a student.", "bases": {}},
      "ఆమె ఉద్యోగం వదులుతుంది.": {"native": "She leaves the job.", "bases": {}}
    }
  "te-0106":
    native: "k + sh"
    notes:
      "n1": "క (ka) and ష (ṣa) joined: లక్ష (lakṣa, a hundred thousand)."
    "examples": {
      "అక్షరాలు నేర్చుకుంటున్నాను.": {"native": "I am learning the letters.", "bases": {}}
    }
  "te-0107":
    native: "s + t"
    notes:
      "n1": "స (sa) and త (ta) joined: పుస్తకం (pustakam, book)."
    "examples": {
      "అప్పు తీరుస్తాను.": {"native": "I pay off the debt.", "bases": {}},
      "కాస్త ఆగండి.": {"native": "Wait a little.", "bases": {}}
    }
  "te-0108":
    native: "s + th"
    notes:
      "n1": "స (sa) and థ (tha) joined: స్థలం (sthalam, place)."
    "examples": {
      "ఇది అత్యవసర పరిస్థితి.": {"native": "This is an emergency.", "bases": {"ఇది": "this", "అత్యవసర": "emergency", "పరిస్థితి": "situation"}},
      "పిల్లలు ఆటస్థలంలో ఆడుతున్నారు.": {"native": "The children are playing on the playground.", "bases": {}}
    }
  "te-0109":
    native: "sh + curled-back t"
    notes:
      "n1": "ష (ṣa) and ట (ṭa) joined: ఇష్టం (iṣṭam, liking)."
    "examples": {
      "కష్టంలో ఆప్తులే ఉంటారు.": {"native": "In hard times, it is close friends who are there for you.", "bases": {}},
      "నాకు తెలుగు ఇష్టం.": {"native": "I like Telugu.", "bases": {"తెలుగు": "Telugu (the language)"}}
    }
