native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing a room"
description: "Words for how a room, a house and its rent feel: spacious, bright, quiet, furnished, and the rules and price of a rent. Not yet checked by a Telugu speaker: please report any mistake."
