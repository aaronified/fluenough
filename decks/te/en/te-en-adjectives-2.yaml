  "te-2835":
    native: "damaged; spoiled"
    bases:
      "పాడైన": { meaning: "to get spoiled" }
    notes:
      "n1": "Its opposite is పనిచేసే (panicēsē)."
    examples:
      "పాడైన తలుపు ఉంది.":
        native: "There is a damaged door."
      "పాడైన గోడ ఇంకా ఉంది.":
        native: "The damaged wall is still there."
