schema: 1
id: "te-en-grammar-emphasis"
kind: "layer"
core: "te-grammar-emphasis"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Emphasis: only, even, actually, definitely"
description: "Small words that add emphasis: మాత్రం (mātraṁ, only; for one), అయినా (ayinā, even so; even though), అసలు (asalu, at all; actually), ఇదే (idē, exactly this), కదా (kadā, isn't it?), ఎంతో (ento, very), ఇప్పుడే (ippuḍē, right now) and తప్పకుండా (tappakuṇḍā, for sure). Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "te-5900":
    native: "only; just; (but) for one"
    alt_native: ["merely", "solely"]
    examples:
      "అందరూ వచ్చారు, నేను మాత్రం రాలేదు.":
        native: "Everyone came, but I alone did not come."
        bases:
          "వచ్చారు":
            meaning: "to come (they came)"
          "రాలేదు":
            meaning: "to come (did not come)"
      "ఒక్క మాట మాత్రం చెప్పు.":
        native: "Just tell me one word."
        bases:
          "మాట":
            meaning: "word; speech"
          "చెప్పు":
            meaning: "to tell; to say"
    notes:
      "n1": "Put it after the word it limits: నేను మాత్రం (nēnu mātraṁ), I alone. Use it to set one thing against others."
  "te-5901":
    native: "even so; still; even though"
    alt_native: ["nevertheless", "all the same"]
    examples:
      "అతను ధనవంతుడు అయినా సంతోషంగా లేడు.":
        native: "He is rich, yet he is not happy."
        bases:
          "ధనవంతుడు":
            meaning: "rich man"
      "చాలా ఆలస్యమైంది, అయినా వెళ్దాం.":
        native: "It is very late, but let's go anyway."
        bases:
          "వెళ్దాం":
            meaning: "let us go"
    notes:
      "n1": "It comes after the first clause and says 'in spite of that': చాలా ఆలస్యమైంది (cālā ālasyamaindi), అయినా (ayinā) వెళ్దాం (veḷdāṁ), it is very late, but let's go."
  "te-5903":
    native: "exactly this; this very one"
    alt_native: ["this exact one"]
    examples:
      "నాకు కావాల్సింది ఇదే.":
        native: "This is exactly what I need."
      "ఇదే మంచి సమయం.":
        native: "This is the right time."
    notes:
      "n1": "The -ే (-ē) at the end of ఇది (idi, this) makes it 'this very one'. The same -ే (-ē) works after other words: అతనే (atanē), he himself."
  "te-5904":
    native: "isn't it?; right?; don't you think?"
    alt_native: ["isn't that so?"]
    examples:
      "ఈ రోజు చల్లగా ఉంది కదా?":
        native: "It is cold today, isn't it?"
        bases:
          "ఉంది":
            meaning: "to be; to have"
      "నువ్వు రేపు వస్తావు కదా?":
        native: "You'll come tomorrow, right?"
        bases:
          "వస్తావు":
            meaning: "to come (you will come)"
    notes:
      "n1": "A tag at the end of a sentence to ask for agreement. It is not used to answer a question: it asks the listener to confirm."