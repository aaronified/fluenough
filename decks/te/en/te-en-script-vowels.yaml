schema: 1
id: "te-en-script-vowels"
kind: "layer"
core: "te-script-vowels"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Telugu vowels"
description: "The vowels as they are written on their own, at the start of a word. In Telugu a short and a long vowel are different sounds."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "te-0001":
    native: "a, short (the vowel every consonant carries)"
    notes:
      "n1": "Like the 'u' of 'but'. Every consonant carries it unless a sign changes it: క (ka) is 'ka'. అమ్మ (amma, mother)."
    "examples": {
      "అర్జీని స్వీకరించారా?": {"native": "Did they accept the application?", "bases": {}},
      "పెట్రోల్ అయిపోయింది!": {"native": "The petrol has run out!", "bases": {}}
    }
  "te-0002":
    native: "aa, long"
    notes:
      "n1": "The 'a' of 'father', held about twice as long as అ (a). Short and long change the word in Telugu: ఆవు (āvu, cow)."
    "examples": {
      "ఆన్ చేయడం": {"native": "to switch on", "bases": {}},
      "ఆఫ్ చేయడం": {"native": "to switch off", "bases": {}}
    }
  "te-0003":
    native: "i, short"
    notes:
      "n1": "Like the 'i' of 'sit': ఇల్లు (illu, house)."
    "examples": {
      "ఇంజిన్ ఆగిపోయింది.": {"native": "The engine has stopped.", "bases": {}},
      "ఇప్పుడు లేపండి.": {"native": "Please wake them up now.", "bases": {}}
    }
  "te-0004":
    native: "ii, long"
    notes:
      "n1": "The 'ee' of 'see', held longer than ఇ (i): ఈగ (īga, housefly)."
    "examples": {
      "ఈ చిరునామాకు వెళ్ళండి.": {"native": "Please go to this address.", "bases": {}},
      "ఈ చెత్త పారేయండి.": {"native": "Throw this rubbish away.", "bases": {}}
    }
  "te-0005":
    native: "u, short"
    notes:
      "n1": "Like the 'u' of 'put': ఉడుత (uḍuta, squirrel)."
    "examples": {
      "జీపే ఉందా?": {"native": "Do you have GPay?", "bases": {}},
      "బీమా ఉందా?": {"native": "Do you have insurance?", "bases": {}}
    }
  "te-0006":
    native: "uu, long"
    notes:
      "n1": "The 'oo' of 'food', held longer than ఉ (u): ఊరు (ūru, town; village)."
    "examples": {
      "నేల ఊడ్చండి.": {"native": "Sweep the floor.", "bases": {}},
      "అతని ఊహ నిజమైంది.": {"native": "His guess came true.", "bases": {}}
    }
  "te-0007":
    native: "ru (a vowel letter)"
    notes:
      "n1": "Said 'ru', though it is written as one vowel, in words from Sanskrit: ఋషి (ruṣi, sage). A recogniser writes 'ru' as రు (ru), so it is drilled by reading and writing only."
  "te-0008":
    native: "e, short"
    notes:
      "n1": "Like the 'e' of 'pet', short. English has no short and long e; Telugu does: ఎలుక (eluka, rat)."
    "examples": {
      "ఎక్కడ చెల్లించాలి?": {"native": "Where should I pay?", "bases": {}},
      "ఎస్‌ఎంఎస్ వచ్చిందా?": {"native": "Did an SMS come?", "bases": {}}
    }
  "te-0009":
    native: "ee, long"
    notes:
      "n1": "The 'ay' of 'say' held long, without the glide English adds: ఏనుగు (ēnugu, elephant)."
    "examples": {
      "ఏమైనా తినండి.": {"native": "Please eat something.", "bases": {}},
      "ఏమైనా పర్వాలేదు.": {"native": "It doesn't matter anyway.", "bases": {}}
    }
  "te-0010":
    native: "ai (as in 'kite')"
    notes:
      "n1": "A glide from a to i, like the 'i' of 'kite': ఐదు (aidu, five)."
    "examples": {
      "యూపీఐ ఉందా?": {"native": "Do you have UPI?", "bases": {}},
      "యూపీఐతో చెల్లించవచ్చా?": {"native": "Can I pay by UPI?", "bases": {}}
    }
  "te-0011":
    native: "o, short"
    notes:
      "n1": "Like a short 'o' of 'go', with no glide. Telugu has short and long o: ఒంటె (oṇṭe, camel)."
    "examples": {
      "అతడు నేరం ఒప్పుకోలేదు.": {"native": "He did not admit the crime.", "bases": {}},
      "అతను దొంగతనం ఒప్పుకున్నాడు.": {"native": "He admitted to the theft.", "bases": {}}
    }
  "te-0012":
    native: "oo, long"
    notes:
      "n1": "The 'o' of 'go' held long, without the glide English adds: ఓడ (ōḍa, ship)."
    "examples": {
      "ఓటీపీ చెప్పండి.": {"native": "Please tell me the OTP.", "bases": {}}
    }
  "te-0013":
    native: "au (as in 'cow')"
    notes:
      "n1": "A glide from a to u, like the 'ow' of 'cow', mostly in words from Sanskrit: ఔషధం (auṣadham, medicine)."
