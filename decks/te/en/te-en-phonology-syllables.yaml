kind: "layer"
core: "te-phonology-syllables"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Telugu word shapes (IPA)"
description: "What the sources used say about how Telugu words begin and end and what clusters they hold: one card each. They give no full syllable template, and the deck says so. For learners who know the IPA or want to learn it. Variety taught: standard (Coastal Andhra) colloquial Telugu. This is a proposal, not yet confirmed by the owner, a Telugu speaker or a phonetician. Where a source describes another dialect, the card says so."
license: "CC-BY-SA-4.0"
authors:
  - { name: "Fluenough contributors" }
  - { name: "Wikipedia contributors (Telugu language; Help:IPA/Telugu)", url: "https://en.wikipedia.org/wiki/Telugu_language" }
source: "Bhaskararao and Ray (2017), 'Illustrations of the IPA: Telugu', Journal of the International Phonetic Association 47(2): 231-241, doi 10.1017/S0025100316000207 (named in Wikipedia's references; the article itself was not read); Krishnamurti (2003), The Dravidian Languages, Cambridge University Press, and Lisker and Krishnamurti (1991), Proceedings of the XIIth International Congress of Phonetic Sciences 2: 90-93 (both as cited by Wikipedia). Text adapted from Wikipedia, 'Telugu language' (section Phonology) and 'Help:IPA/Telugu', CC BY-SA 4.0, https://en.wikipedia.org/wiki/Telugu_language"
tags: ["ipa", "phonology", "unreviewed"]
cards:
  "te-6621":
    native: "how a word ends: usually in a vowel"
    notes:
      "n1": "Telugu words generally end in vowels. In Classical Telugu this was absolute; in the modern language m, n, y and w may also end a word. The source gives no fuller syllable template, so this deck does not claim one."
      "n2": "An emphatic u may be added to loanwords that end in a consonant, such as English 'school', said iskūlu (the source's example). A few loans of this course keep the consonant ending, such as ఫోన్ (fōn, phone)."
    examples:
      "పండు": "fruit; ripe"
      "వారం": "week"
      "బస్సు": "bus"
      "ఫోన్": "phone"
  "te-6622":
    native: "how a word begins: restrictions on the first consonant"
    notes:
      "n1": "Except ɳ and ɭ, all the curled-back consonants occur at the start of a few words, such as ṭakku 'pretence', ṭhīvi 'grandeur', ḍippā 'half of a spherical object' and ṣōku 'fashionable appearance' (the source's examples). The approximant j begins a word only in borrowed words."
    examples:
      "టీ": "tea"
      "ఢిల్లీ": "Delhi"
  "te-6623":
    native: "two consonants together: doubled consonants and curled-back clusters"
    notes:
      "n1": "Curled-back consonants occur between vowels and next to another curled-back consonant, as in kaṭṇam 'dowry' and paṇḍu 'fruit' (the source's examples). Most consonants can also be doubled between vowels."
      "n2": "In colloquial speech some clusters are simplified, but the source gives its examples only in a transliteration with narrow symbols, so this deck does not copy them."
    examples:
      "పండు": "fruit; ripe"
      "కష్టం": "difficult; hard"
      "ఖండం": "continent"
