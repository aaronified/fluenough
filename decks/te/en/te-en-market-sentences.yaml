schema: 1
id: "te-en-market-sentences"
kind: "layer"
core: "te-market-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Market: sentences"
description: "Eight sentences about buying at a market and paying, with the words of the market unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-7078":
    native: "I need a kilo of tomatoes."
    confusables:
      "c1": { why: "మిరపకాయ (mirapakāya) 'chilli', is a chilli, a different vegetable." }
      "c2": { why: "బంగాళాదుంప (baṅgāḷādumpa) 'potato', is a potato, another vegetable." }
  "te-7079":
    native: "Mum buys onions by the kilo."
    confusables:
      "c1": { why: "టమాటా (ṭamāṭā) 'tomato', is a tomato, another vegetable." }
      "c2": { why: "వెల్లుల్లి (vellulli) 'garlic', is garlic, a different vegetable." }
  "te-7080":
    native: "What is the price of tomatoes?"
    confusables:
      "c1": { why: "రూపాయి (rūpāyi) 'rupee', is a rupee, a unit of money and not a price." }
      "c2": { why: "ఎప్పుడు (eppuḍu) 'when', asks for a time, not a price." }
  "te-7081":
    native: "This is ten rupees."
    confusables:
      "c1": { why: "ధర (dhara) 'price', is a price, not the money." }
      "c2": { why: "డబ్బులు (ḍabbulu) 'money', is money, a general word." }
  "te-7082":
    native: "There is change at the shop."
    confusables:
      "c1": { why: "డబ్బులు (ḍabbulu) 'money', is money, not the change." }
      "c2": { why: "రూపాయి (rūpāyi) 'rupee', is a rupee, one unit of money." }
  "te-7083":
    native: "Is the price very high?"
    confusables:
      "c1": { why: "తక్కువ (takkuva) 'less', is less, the opposite." }
      "c2": { why: "కొంచెం (koñceṁ) 'a little', is a little, not too much." }
  "te-7084":
    native: "I don't want change."
    confusables:
      "c1": { why: "డబ్బులు (ḍabbulu) 'money', is money, not change." }
      "c2": { why: "కావాలి (kāvāli) 'is needed', is needed, the opposite of not wanted." }
  "te-7085":
    native: "I'll give the money."
    confusables:
      "c1": { why: "రూపాయి (rūpāyi) 'rupee', is one rupee, a unit of money." }
      "c2": { why: "ధర (dhara) 'price', is a price, not the money given." }
