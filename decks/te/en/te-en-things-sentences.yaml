schema: 1
id: "te-en-things-sentences"
kind: "layer"
core: "te-things-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Things around you: sentences"
description: "Sentences about the things you own and carry, with the words of the things unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0903":
    notes:
      "n1": "నా (nā) is the genitive of నేను (nēnu), I, and means 'my' before a noun."
    native: "This is my book."
  "te-0904":
    notes:
      "n1": "మీ (mī) is the genitive of మీరు (mīru), you, and means 'your' before a noun."
    native: "That is not your bag."
  "te-0905":
    notes:
      "n1": "నాకు (nāku) is the dative of నేను (nēnu), I, so the need is to me."
    native: "I need a new phone."
    alt_native: ["I need a new mobile phone"]
  "te-0906":
    notes:
      "n1": "నా (nā) is the genitive of నేను (nēnu), I, and means 'my' before a noun."
    native: "Where is my umbrella?"
  "te-0907":
    native: "The key is on the table."
  "te-0908":
    notes:
      "n1": "పుస్తకాలు (pustakālu) is the plural of పుస్తకం (pustakaṁ), book: the ending -ṁ changes to -ālu in the plural."
    native: "She reads books every day."
    alt_native: ["She reads books daily"]
  "te-0909":
    notes:
      "n1": "స్కూలుకు (skūluku) is స్కూలు (skūlu), school, with the -ku ending that means 'to' a place."
    native: "I go to school by bicycle."
    alt_native: ["I go to school on a bicycle"]
    bases:
      "స్కూలుకు": "school (from English)"
  "te-0910":
    notes:
      "n1": "ఇవ్వండి (ivvaṇḍi) is the polite form of the command 'give', said to a person you address politely, or to several people."
    native: "Please give me a towel."
    alt_native: ["Please hand me a towel"]
  "te-0619":
    notes:
      "n1": "కుర్చీలు (kurcīlu) is the plural of కుర్చీ (kurcī), chair, with the ending -lu added."
    native: "Whose chairs are those?"
