  notes: "-లు (-lu) makes a plural. Before an ending, many nouns take an oblique stem: ఇల్లు (illu) becomes ఇంటి- (iṇṭi-) (ఇంటికి (iṇṭiki), to the house), and a noun in -ం (am) takes -ఆని- (-āni-) (పుస్తకానికి (pustakāniki))."
