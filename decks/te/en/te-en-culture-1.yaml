      "నుండితిని": { meaning: "I remained" }
      "భక్తితాత్పర్యమునన్": { meaning: "with devotion and eagerness" }
  "te-8762":
    native: "Having heard Hari's words, this is good for both sides and rooted in dharma, and in this way it is possible for us to settle these men."
    notes:
      "n1": "Spoken on page 176 of the 1915 edition of the Udyoga Parvam, after the prose line that says Balarama spoke to the assembly. The verse calls the speech the words of Hari, as the page's text has it."
    bases:
      "హరివాక్యము": { meaning: "the words of Hari" }
      "వింటిరె": { meaning: "to hear" }
      "యిది": { meaning: "this" }
      "యిరుదెఱఁగులజనములకును": { meaning: "for people on both sides" }
      "హితమును": { meaning: "benefit, good" }
