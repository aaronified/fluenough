  "te-8765":
    native: "Drona and Bhishma follow him for the sake of food, and Dhritarashtra and the base men, including Radheya, who are consumed by greed for his son, all speak of his good sense."
    notes:
      "n1": "From the Udyoga Parvam, page 177 of the 1915 edition, a verse that describes the men who follow the Kaurava side. The lines before it on the page that I read do not name the speaker, and the sense of two words is uncertain, so the translation is a tentative reading."
    bases:
