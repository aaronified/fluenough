  "te-8764":
    native: "What would become of Bhima and Arjuna in battle, and if these men and I march with our armies, can the kings who face us survive and go away?"
    notes:
      "n1": "From the Udyoga Parvam, page 177 of the 1915 edition, in a speech about the coming war. The lines before it on the page that I read do not name the speaker."
