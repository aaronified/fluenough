      "నెగడఁగఁ": { meaning: "to prosper" }
      "జూతున్": { meaning: "I look on" }
  "te-8763":
    native: "Did Dharmaja play dice out of a wish to gamble, and is it proper that they gathered together, called him, and won by force through trickery?"
