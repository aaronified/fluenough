      "గఱపి": { meaning: "teaching" }
      "సంప్రీతిమెయిన్": { meaning: "with goodwill" }
  "te-8760":
    native: "With joy and wonder fixed in my heart, I kept thinking of it, as if I had seen it in a dream, with devotion and eagerness."
    notes:
      "n1": "From the prologue to the Virata Parvam, on page 11 of the 1915 edition, in which the poet recalls the god's favour. The prose just before the verse says that he woke up, which explains the image of a dream."
    bases:
      "ఎలమియు": { meaning: "gladness, joy" }
      "నచ్చెరువును": { meaning: "wonder" }
      "సరి": { meaning: "together, along with" }
      "నెలసి": { meaning: "having settled, dwelling" }
      "పొదలుమానసమున": { meaning: "in the heart that swells" }
      "నెంతయుఁ": { meaning: "very much, greatly" }
