  "te-8767":
    native: "For the Kauravas and the Pandavas, I look at them as one form, so that both they and these, each by their own strength, may rule the earth and prosper."
    notes:
      "n1": "Vasudeva speaks this verse on page 178 of the 1915 edition of the Udyoga Parvam, as the prose just before it says. The verse presents the two sides as equal, each to rule by its own strength."
    bases:
