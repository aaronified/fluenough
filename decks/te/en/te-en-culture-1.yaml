# Layer for te-culture-1: each passage's English rendering and a note on it.
schema: 1
id: "te-en-culture-1"
kind: "layer"
core: "te-culture-1"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: classical verse"
description: "Eighteen short passages of classical Telugu verse, from Tikkana, Errapragada and Pothana, from the thirteenth to the fifteenth centuries, each with its English rendering and a note. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "te-8750":
    native: "Treating himself and all beings alike, with equal goodwill, he conducts himself."
    notes:
      "n1": "The first two lines of a seesa verse (verse 115) in book 7 of Pothana's Telugu Bhagavatam, a list of the virtues of Prahlada, the devotee of Vishnu."
    bases:
      "తన": { meaning: "self, oneself" }
      "యందు": { meaning: "in, toward, regarding" }
      "నఖిల": { meaning: "all, entire" }
      "భూతము": { meaning: "beings, creatures" }
      "లందు": { meaning: "among, in" }
      "నొకభంగి": { meaning: "in one and the same way, alike" }
      "సమహితత్వంబున": { meaning: "with equal goodwill and an even mind" }
      "జరుగువాఁడు": { meaning: "one who conducts himself, who behaves" }
  "te-8751":
    native: "He sets no desire on what he has seen or heard in the world, looking at things only as objects."
    notes:
      "n1": "The first two lines of the closing ata veladi of verse 117 of book 7 of Pothana's Telugu Bhagavatam, the same list of Prahlada's virtues."
    bases:
      "విశ్వమందుఁ": { meaning: "in the world" }
      "గన్న": { meaning: "seen, looked at" }
      "విన్న": { meaning: "heard" }
      "యర్థము": { meaning: "things, objects of desire, wealth" }
      "లందు": { meaning: "among, in" }
      "వస్తుదృష్టిఁ": { meaning: "looking at things as mere objects" }
      "జేసి": { meaning: "having done, by means of" }
      "వాంఛ": { meaning: "desire, longing" }
      "యిడఁడు": { meaning: "does not put, does not set" }
  "te-8752":
    native: "In the holy place where, in the Kali age, sages and gods shine with the exalted merit of giving all beings freedom from fear, they never leave that place, gladly."
    notes:
      "n1": "The second verse of the first canto of Errapragada's Narasimha Purana, in kanda metre, spoken by the sages at Naimisharanya."
    bases:
      "ఏతీర్థము": { meaning: "which holy place (relative)" }
      "కలియుగమున": { meaning: "in the Kali age" }
      "భూతాభయదానచతురపుణ్యోన్నతి": { meaning: "the greatness of merit that gives all beings freedom from fear" }
      "నుద్యోతించు": { meaning: "shining, radiant" }
      "మునులు": { meaning: "sages" }
      "దివిజులు": { meaning: "gods, the celestial ones" }
      "నేతీర్థమునంకుఁ": { meaning: "from that same holy place" }
      "బాయ": { meaning: "to leave, to part from" }
      "రెన్నఁడు": { meaning: "ever, at any time" }
      "నెలమిన్": { meaning: "gladly, firmly" }
  "te-8753":
    native: "He treats his friends as brothers, thinks of his teachers as gods, never tells a lie even in play, and is Prahlada, the man of graceful dignity."
    notes:
      "n1": "The closing tetagiti of verse 115 of book 7 of Pothana's Telugu Bhagavatam; it ends the list of Prahlada's virtues with his name."
    bases:
      "సఖుల": { meaning: "of friends" }
      "యెడ": { meaning: "toward, with" }
      "సోదరస్థితి": { meaning: "the place of a brother" }
      "జరుపువాఁడు": { meaning: "one who conducts himself, who behaves" }
      "దైవతము": { meaning: "god, deity" }
      "లంచు": { meaning: "saying, thinking of as" }
      "గురువులఁ": { meaning: "teachers" }
      "దలఁచువాఁడు": { meaning: "one who thinks of, regards" }
      "లీలలందును": { meaning: "even in play, even in sport" }
      "బొంకులు": { meaning: "lies, falsehoods" }
      "లేనివాఁడు": { meaning: "one who has none, who never" }
      "లలితమర్యాదుఁడైన": { meaning: "graceful and dignified, of charming honour" }
      "ప్రహ్లాదుఁడు": { meaning: "Prahlada, the devotee of Vishnu" }
  "te-8754":
    native: "Like the sacred Ganga and the Yamuna meeting, the Lord of all, whose form is peace, shining with radiance, gladly came near and filled my mind with joy."
    notes:
      "n1": "Lines from the prologue of Tikkana's Virata Parvam, in which the poet describes his dream vision of Hari-Hara, with the image of two holy rivers joining."
    bases:
      "సురనదియును": { meaning: "the celestial river, the Ganga, also" }
      "గాళిందియు": { meaning: "the Yamuna river, also" }
      "బెరసినట్టు": { meaning: "as if joined or mixed" }
      "కాంతిపూరంబుశోభిల్ల": { meaning: "shining with a flood of radiance" }
      "శాంతమూర్తి": { meaning: "one whose form is peace" }
      "నామనంబు": { meaning: "my mind" }
      "నానందమగ్నముఁగఁ": { meaning: "made fully immersed in joy" }
      "జేయ": { meaning: "to make" }
      "నెలమి": { meaning: "gladly, firmly" }
      "సన్నిధి": { meaning: "presence, nearness" }
      "సేసె": { meaning: "made, did" }
      "సర్వేశ్వరుండు": { meaning: "the lord of all" }
  "te-8755":
    native: "Hereafter it is hard to get through these thirteen years: when dangers come upon them, not knowing what lies ahead of them, is there any way of enduring them and living like this?"
    notes:
      "n1": "Lines from the first ashvasa of Tikkana's Udyoga Parvam, on how hard the thirteen years of exile will be and how dangers must be endured."
    bases:
      "పదపడి": { meaning: "afterwards" }
      "దుస్తర": { meaning: "hard to get across" }
      "మగునీ": { meaning: "being" }
      "పదమూఁడగునేఁడు": { meaning: "the thirteen years" }
      "గడవఁ": { meaning: "to pass, to get through" }
      "బడుట": { meaning: "being (passed): passive of passing" }
      "యరిది": { meaning: "hard, difficult" }
      "తమ్మెదు": { meaning: "in front of them (reading uncertain)" }
      "రెఱుఁగమికై": { meaning: "because of not knowing, from ఎఱుగమి (eṟugami)" }
      "యాపద": { meaning: "that danger" }
      "లొదవిన": { meaning: "that have come upon" }
      "సైరించి": { meaning: "having endured" }
      "రిట్టియునికియుఁ": { meaning: "such existence (reading uncertain)" }
      "గలదే": { meaning: "is there?" }
  "te-8756":
    native: "With eagerness to write, the thought came to my mind: which man should I name as the lord of this circle of prabandha verse (this work)?"
    notes:
      "n1": "Lines from the prologue of Tikkana's Virata Parvam, in which the poet wonders which patron to name for his work."
    bases:
      "అని": { meaning: "thus, saying" }
      "రచనాకౌతుకమున": { meaning: "with eagerness for composing" }
      "మన": { meaning: "mind, from మనము (manamu)" }
      "మలరఁగ": { meaning: "to bloom, to be delighted" }
      "నీప్రబంధమండలి": { meaning: "this circle of prabandha compositions, written in full as ఈ (ī) ప్రబంధమండలి (prabandhamaṇḍali)" }
      "కధినాథునిగా": { meaning: "as the lord of this work" }
      "నేపురుషునిఁ": { meaning: "which man" }
      "బేర్కొనువాఁడనొ": { meaning: "should I name" }
      "యనుతలంపు": { meaning: "such a thought" }
      "గూరినమదితోన్": { meaning: "with a mind in which it arose" }
  "te-8757":
    native: "Why praise the strength of arm that takes the goddess of victory in many terrible battles, of the king of the Kali age?"
    notes:
      "n1": "The closing lines of verse 35 of the first ashvasa of Tikkana's Nirvachanottara Ramayanam, praising a king of the Kali age; te.wikisource and te.wikipedia both name Tikkana as its author."
    bases:
      "బ్రచురముగ": { meaning: "abundantly, in plenty" }
      "ఘోరబహుసంగరముల": { meaning: "in many terrible battles" }
      "విజయ": { meaning: "of victory" }
      "లక్ష్మిఁ": { meaning: "the goddess Lakshmi, fortune" }
      "జేకొను": { meaning: "takes up, takes" }
      "బాహుబలంబుసొంపు": { meaning: "the beauty of arm-strength" }
      "పొగడ": { meaning: "to praise" }
      "నేటికిఁ": { meaning: "why, for what purpose" }
      "గలికాలభూవిభునకు": { meaning: "for the king of the Kali age" }
  "te-8761":
    native: "O Harihara, remover of fear for those who seek your refuge, whose feet shine with the gleam of the gods' jewelled crowns, adorned with a forest garland and a serpent."
    notes:
      "n1": "A kanda from the prologue to the Virata Parvam, on page 12 of the 1915 edition, made of a string of forms of address to the god. The same page addresses the god as Harihara, which is the name the translation uses."
    bases:
      "శరణాగతసంశ్రితభయ": { meaning: "remover of fear for those who come for refuge" }
      "హరణా": { meaning: "O remover" }
      "సురనికర": { meaning: "host of gods" }
      "శేఖరానర్ఘమణి": { meaning: "priceless jewel of a crown" }
      "స్ఫురణాపరిచయరంజిత": { meaning: "made bright by the glow of contact" }
      "చరణా": { meaning: "O you whose feet" }
      "వనమాలికాభుజంగాభరణా": { meaning: "adorned with a forest garland and a serpent" }
  "te-8759":
    native: "Its great walls and gateways, and the statues of women carved with many jewels, shine like a crowd of celestial women who have come there, bent on pleasure."
    notes:
      "n1": "From Tikkana's description of a city in the Nirvachanottara Ramayanam, on page 19 of the Wikisource transcription. The verse is a simile that compares the walls and statues with a crowd of celestial women, and the page marks it as a kanda."
    bases:
      "మహనీయవప్రగోపుర": { meaning: "great walls and gateways" }
      "బహురత్నోత్కీర్ణసాలభంజిక": { meaning: "statues of women carved with many jewels" }
      "లొప్పున్": { meaning: "shine" }
      "విహరణతత్పరనిర్జర": { meaning: "celestial women intent on pleasure" }
      "మహిళాతతి": { meaning: "crowd of women" }
      "వచ్చి": { meaning: "having come" }
      "యున్నమాడ్కి": { meaning: "manner, way" }
      "బెడంగై": { meaning: "as, in the manner of" }
  "te-8758":
    native: "O lord of all the worlds, by your great compassion you set a vast greatness in my small mind, as an ocean of milk, and is that not a wonder?"
    notes:
      "n1": "From the prologue to Tikkana's Virata Parvam, on page 10 of the 1915 edition, where the poet addresses the god as lord of all the worlds. The page marks the verse as a kanda, and its last line is a rhetorical question, which the translation renders as 'is it not a wonder'."
    bases:
      "భూరిభవత్కారుణ్య": { meaning: "your great compassion" }
      "క్షీరాంబుధి": { meaning: "ocean of milk" }
      "నాదుతుచ్ఛచిత్తంబున": { meaning: "in my small mind" }
      "విస్తార": { meaning: "vast, expansive" }
      "మహితముగ": { meaning: "greatly, with honour" }
      "నునిచితి": { meaning: "placed, set down" }
      "వారయ": { meaning: "on consideration" }
      "నచ్చెరువు": { meaning: "wonder, amazement" }
      "గాదె": { meaning: "is it not" }
      "యఖిలాండపతీ": { meaning: "lord of all the worlds" }
  "te-8766":
    native: "This man is my chief priest, and after making all the business known to him, send him to Dhritarashtra, teaching him with clever speech and goodwill."
    notes:
      "n1": "From the Udyoga Parvam, page 178 of the 1915 edition, in a speech about sending a priest as an envoy. The prose after the verse on the same page names Drupada, the king of Panchala."
    bases:
      "ఇతఁడు": { meaning: "this man" }
      "మదీయాగ్రపురోహితుఁ": { meaning: "my chief priest" }
