id: "te-en-grammar-when"
kind: "layer"
core: "te-grammar-when"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "When: saying when things happen"
description: "A clause with 'when' ends in -ప్పుడు (-ppuḍu), after a verb's past form, its habitual form or its ongoing form, or after a noun. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "te-2700":
    native: "When I was small, I used to go to school."
    alt_native: ["When I was a child, I used to go to school.", "When I was young, I would go to school."]
    notes:
      "n1": "-ప్పుడు (-ppuḍu) makes 'when': after a verb's past form, వెళ్ళిన (veḷḷina) + అప్పుడు (appuḍu) = వెళ్ళినప్పుడు (veḷḷinappuḍu), or after a noun, చిన్న (cinna, small) + అప్పుడు (appuḍu) = చిన్నప్పుడు (cinnappuḍu). Here వెళ్ళేవాడిని (veḷḷēvāḍini) is 'I used to go', said by a man; a woman says వెళ్ళేదాన్ని (veḷḷēdānni)."
  "te-2701":
    native: "When you come, call me."
    alt_native: ["When you arrive, call me.", "Call me when you come."]
    notes:
      "n1": "Telugu uses the past form for a future 'when' too: వచ్చినప్పుడు (vaccinappuḍu) is 'when (you) come', not 'when (you) came'."
  "te-2702":
    native: "When the bell rings, do this work."
    alt_native: ["When the bell rings, do this job."]
    notes:
      "n1": "గంట (gaṇṭa) here is a bell; it also means an hour, as in ఒంటిగంట (oṇṭigaṇṭa), one o'clock."
  "te-2703":
    native: "Mum came while I was eating."
    alt_native: ["Mom came while I was eating."]
    notes:
      "n1": "-తున్నప్పుడు (-tunnappuḍu), 'while', is for an action going on at that time: తింటున్నప్పుడు (tiṇṭunnappuḍu), while (I) was eating."
  "te-2704":
    native: "I drink tea while I work."
    alt_native: ["I have tea while I work."]
    notes:
      "n1": "-ేటప్పుడు (-ēṭappuḍu), 'when, whenever', comes from the habitual form: చేసేటప్పుడు (cēsēṭappuḍu), when (I) work or whenever (I) work."
  "te-2705":
    notes:
      "n1": "వచ్చేటప్పుడు (vaccēṭappuḍu), when (she) comes, uses the same form as చేసేటప్పుడు (cēsēṭappuḍu), when or whenever, in the when unit."
    native: "I will be at home when Mum comes."
    alt_native: ["I will be home when Mom comes."]
  "te-2706":
    notes:
      "n1": "బడికి (baḍiki), to school, takes the 'to' form for a place, and మూయండి (mūyaṇḍi) is the polite request form of మూయడం (mūyaḍaṁ), to close."
    native: "When you go to school, close the door."
    alt_native: ["When you leave for school, close the door."]
  "te-2707":
    notes:
      "n1": "పడినప్పుడు (paḍinappuḍu), when (it) rains, is the past form పడిన (paḍina) plus అప్పుడు (appuḍu), as the when unit builds it, and ఉండండి (uṇḍaṇḍi) is the polite request form of ఉండడం (uṇḍaḍaṁ), to stay."
    native: "When it rains, stay at home."
    alt_native: ["When it rains, stay home."]
  "te-2708":
    notes:
      "n1": "తినేటప్పుడు (tinēṭappuḍu), while (I) eat, uses the habitual form, which the when unit gives as whenever."
    native: "I don't watch TV while I eat."
    alt_native: ["I do not watch TV while eating."]
  "te-2709":
    notes:
      "n1": "వెళ్ళినప్పుడు (veḷḷinappuḍu), when (she) left, is the past form వెళ్ళిన (veḷḷina) plus అప్పుడు (appuḍu), as the when unit builds it after a past verb."
    native: "When she left, she closed the door."
    alt_native: ["When she left, she shut the door."]
  "te-2710":
    notes:
      "n1": "కొట్టినప్పుడు (koṭṭinappuḍu), when (it) rings, is the past form of కొట్టడం (koṭṭaḍaṁ), to hit, plus అప్పుడు (appuḍu); గంట (gaṇṭa) here is a bell, as the when unit notes."
    native: "When the bell rings at school, he goes home."
    alt_native: ["When the school bell rings, he goes home."]
