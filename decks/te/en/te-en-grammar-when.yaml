id: "te-en-grammar-when"
kind: "layer"
core: "te-grammar-when"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "When: saying when things happen"
description: "A clause with 'when' ends in -ప్పుడు (-ppuḍu), after a verb's past form, its habitual form or its ongoing form, or after a noun. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "te-2700":
    native: "When I was small, I used to go to school."
    notes:
      "n1": "-ప్పుడు (-ppuḍu) makes 'when': after a verb's past form, వెళ్ళిన (veḷḷina) + అప్పుడు = వెళ్ళినప్పుడు, or after a noun, చిన్న (cinna, small) + అప్పుడు = చిన్నప్పుడు. Here వెళ్ళేవాడిని (veḷḷēvāḍini) is 'I used to go', said by a man; a woman says వెళ్ళేదాన్ని (veḷḷēdānni)."
  "te-2701":
    native: "When you come, call me."
    notes:
      "n1": "Telugu uses the past form for a future 'when' too: వచ్చినప్పుడు (vaccinappuḍu) is 'when (you) come', not 'when (you) came'."
  "te-2702":
    native: "When the bell rings, do this work."
    notes:
      "n1": "గంట (gaṇṭa) here is a bell; it also means an hour, as in ఒంటిగంట (oṇṭigaṇṭa), one o'clock."
  "te-2703":
    native: "Mum came while I was eating."
    notes:
      "n1": "-తున్నప్పుడు (-tunnappuḍu), 'while', is for an action going on at that time: తింటున్నప్పుడు (tiṇṭunnappuḍu), while (I) was eating."
  "te-2704":
    native: "I drink tea while I work."
    notes:
      "n1": "-ేటప్పుడు (-ēṭappuḍu), 'when, whenever', comes from the habitual form: చేసేటప్పుడు (cēsēṭappuḍu), when (I) work or whenever (I) work."
  "te-2705":
    native: "I will be at home when Mum comes."
  "te-2706":
    native: "When you go to school, close the door."
  "te-2707":
    native: "When it rains, stay at home."
  "te-2708":
    native: "I don't watch TV while I eat."
  "te-2709":
    native: "When she left, she closed the door."
  "te-2710":
    native: "When the bell rings at school, he goes home."
