schema: 1
id: "te-en-script-reading"
kind: "layer"
core: "te-script-reading"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words to read"
description: "Short everyday words written with letters alone, no vowel signs: the tick, the vowel you do not see, the circle and doubled letters, at work."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "te-0048":
    native: "wave"
    notes:
      "n1": "అ (a) is the vowel a itself, and ల (la) carries its short a, which is said at the end: a-la."
  "te-0049":
    native: "head"
    notes:
      "n1": "త (ta) has the tick on top; ల (la) doesn't. Both carry a."
    "examples": {
      "ఆ పొగడ్తకు ఆమె సిగ్గుగా తల వంచుకుంది.": {"native": "She lowered her head shyly at the praise.", "bases": {}},
      "ఆ మాటలు విని ఆమె అవమానంతో తల దించుకుంది.": {"native": "Hearing those words, she lowered her head in humiliation.", "bases": {}}
    }
  "te-0050":
    native: "dream"
    notes:
      "n1": "క (ka) and ల (la), each with its a. With the curled-back ళ (ḷa) it would be కళ (kaḷa), art."
  "te-0051":
    native: "net (for fishing)"
    alt_native: ["fishing net"]
    notes:
      "n1": "వ (va) is between v and w."
  "te-0052":
    native: "jewel"
    notes:
      "n1": "న (na) and గ (ga) both wear the tick on top."
    "examples": {
      "బంగారు నగలు కొన్నారు.": {"native": "They bought gold jewellery.", "bases": {}}
    }
  "te-0053":
    native: "pen"
    notes:
      "n1": "The circle ం (am) at the end is an m: kalam."
      "pair": "Not to be confused with కాలం (kālam), time; season."
  "te-0054":
    native: "people; a crowd"
    notes:
      "n1": "జ (ja), న (na) and the circle for m."
    "examples": {
      "జనం ఎక్కువై తొక్కిసలాట జరిగింది.": {"native": "The crowd grew large and a stampede happened.", "bases": {}},
      "జనం అంతా చౌరస్తాలో కూడుతారు.": {"native": "Everyone gathers at the crossroads.", "bases": {}}
    }
  "te-0055":
    native: "word"
    notes:
      "n1": "ప (pa) and ద (da), then the circle for m."
    "examples": {
      "ఈ పదానికి అర్థం ఏమిటి?": {"native": "What is the meaning of this word?", "bases": {}},
      "వాక్యంలో పదాలు సరైన క్రమంలో ఉండాలి.": {"native": "The words in a sentence must be in the right order.", "bases": {}}
    }
  "te-0056":
    native: "chariot"
    notes:
      "n1": "థ (tha) is the t on the teeth with a breath after it."
  "te-0057":
    native: "time (the moment); an occasion"
    notes:
      "n1": "స (sa) is s, never sh; the circle at the end is m."
    "examples": {
      "ఇదే మంచి సమయం.": {"native": "This is the right time.", "bases": {}},
      "ప్రయాణ సమయం తగ్గింది.": {"native": "The travel time has gone down.", "bases": {}}
    }
  "te-0058":
    native: "city"
    notes:
      "n1": "Three letters with their a, and the circle for m."
    "examples": {
      "రాజధాని పెద్ద నగరం.": {"native": "The capital is a big city.", "bases": {}},
      "ఈ నగరం అక్షాంశం ఎంత?": {"native": "What is this city's latitude?", "bases": {}}
    }
  "te-0059":
    native: "mother"
    alt_native: ["mum", "mom"]
    notes:
      "n1": "A doubled m, held longer. The second మ (ma) is its vattu, a small hook at the lower right that looks little like మ (ma)."
    "examples": {
      "అమ్మ నన్ను క్షమిస్తుంది.": {"native": "Mum forgives me.", "bases": {}},
      "అమ్మ పిల్లలను ప్రేమిస్తుంది.": {"native": "Mum loves the children.", "bases": {}}
    }
  "te-0060":
    native: "elder sister"
    alt_native: ["older sister"]
    notes:
      "n1": "A doubled k: the second క (ka) sits below the first as its vattu. Calling to her, you say అక్కా (akkā, with a long final a)."
    "examples": {
      "ఆమె నా అక్క.": {"native": "She is my elder sister.", "bases": {}},
      "ఆ అందగత్తె మా అక్క.": {"native": "That beautiful woman is my elder sister.", "bases": {}}
    }
  "te-0061":
    native: "elder brother"
    alt_native: ["older brother"]
    notes:
      "n1": "A doubled n, held longer: a-nna. Calling to him, you say అన్నా (annā, with a long final a)."
  "te-0062":
    native: "aunt (father's sister, or mother's brother's wife); mother-in-law"
    alt_native: ["auntie"]
    notes:
      "n1": "A doubled t on the teeth."
