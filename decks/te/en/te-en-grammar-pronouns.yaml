pattern:
  name: "Personal pronouns"
  slot_name: "form"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "neenu": "I"
    "nuvvu": "you, familiar"
    "miiru": "you, respectful or plural"
    "atanu": "he"
    "aame": "she"
    "adi": "it"
    "meemu": "we, not you"
    "manam": "we, you and I"
    "vaallu": "they"
  notes: "Telugu has two 'we': మనం (manam) includes the listener, మేము (mēmu) leaves them out. మీరు (mīru) is 'you' for one person you respect and for more than one."
