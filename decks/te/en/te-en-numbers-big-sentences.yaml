schema: 1
id: "te-en-numbers-big-sentences"
kind: "layer"
core: "te-numbers-big-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Tens and big numbers: sentences"
description: "Eight sentences with the tens, a hundred, a thousand, a lakh and the halves, with the words and rules of the units before it. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-7060":
    native: "I work forty hours a week."
    confusables:
      "c1": { why: "ముప్పై (muppai) '30, thirty', is thirty, one ten below forty." }
      "c2": { why: "నెలకు (nelaku) 'per month', names a month, not a week." }
  "te-7062":
    native: "A hundred languages are spoken in this country."
    confusables:
      "c1": { why: "రెండు వందలు (reṇḍu vandalu) '200, two hundred', is two hundred, not one hundred." }
      "c2": { why: "ఊరు (ūru) 'town', names a town, not a country." }
  "te-7061":
    native: "Is your salary one lakh?"
    confusables:
      "c1": { why: "వెయ్యి (veyyi) '1,000, a thousand', is a thousand, a smaller sum." }
      "c2": { why: "కోటి (kōṭi) '1,00,00,000, a crore (ten million)', is ten million, far larger." }
  "te-7063":
    native: "I study two and a half hours a day."
    confusables:
      "c1": { why: "ఒకటిన్నర (okaṭinnara) '1½, one and a half', is one and a half, not two and a half." }
      "c2": { why: "నాలుగున్నర (nālugunnara) 'half past four', is four and a half, a different half." }
  "te-7064":
    native: "My salary is not a thousand."
    confusables:
      "c1": { why: "లక్ష (lakṣa) '1,00,000, a lakh (a hundred thousand)', is a hundred thousand, a lakh." }
      "c2": { why: "వంద (vanda) '100, a hundred', is a hundred, a smaller number." }
  "te-7066":
    native: "Is that one and a half dozen?"
    confusables:
      "c1": { why: "రెండున్నర (reṇḍunnara) '2½, two and a half', is two and a half, not one and a half." }
      "c2": { why: "యాభై (yābhai) '50, fifty', is fifty, not a count of dozens." }
  "te-7065":
    native: "Dad will stay in the village for ninety days."
    bases:
      "ఊరిలో": "in the town"
    confusables:
      "c1": { why: "డెబ్బై (ḍebbai) '70, seventy', is seventy, not ninety." }
      "c2": { why: "వారం (vāraṁ) 'week', names a week, a unit of time rather than a count of days." }
  "te-7067":
    native: "He takes sixty days of leave a year."
    confusables:
      "c1": { why: "యాభై (yābhai) '50, fifty', is fifty, not sixty." }
      "c2": { why: "వ్యాపారం (vyāpāraṁ) 'business', names a business, a different kind of work." }
