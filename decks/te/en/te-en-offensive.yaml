schema: 1
id: "te-en-offensive"
kind: "layer"
core: "te-offensive"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Offensive words: insults, swears and slurs"
description: "Rude and offensive Telugu words, for adults only. Learn to recognise them, not to use them. Each level is provisional until several native speakers have rated the word. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["offensive", "unreviewed"]
cards:
  "te-6557":
    native: "idiot; fool"
    notes:
      "n1": "Mild. Friends call each other this jokingly; said to a stranger, it is a plain insult."
  "te-6558":
    native: "dolt; a useless, weak person"
    notes:
      "n1": "Mild. Calls a man weak or hopeless. Often teasing between friends."
  "te-6559":
    native: "donkey; fool"
    notes:
      "n1": "Mild. Literally 'donkey'. Used as a mild insult, or in jest among friends."
  "te-6560":
    native: "madman; crazy (as an insult)"
    notes:
      "n1": "Mild. Literally 'a mad man'. It hurts someone with a mental illness, so keep it for jokes between friends."
  "te-6561":
    native: "blockhead; dullard"
    notes:
      "n1": "Mild. Calls someone dull or slow. Often said jokingly between friends."
  "te-6562":
    native: "thief; cheat"
    notes:
      "n1": "Mild. Literally 'thief'. Said to someone who cheats; between friends, a joke."
  "te-6564":
    native: "scoundrel; sleazy, dishonest man"
    notes:
      "n1": "Medium. Calls a man a cheat or a sleazy one. Not used between friends."
  "te-6565":
    native: "whore (a very rude insult)"
    notes:
      "n1": "Strong. A very rude insult, said in anger. Never in polite company."
  "te-6566":
    native: "whore (a very rude insult)"
    notes:
      "n1": "Strong. A very rude insult, said in anger. Never in polite company."
      "sound": "Sounds like కుండ (kuṇḍa), a clay pot: say the m clearly."
      "look": "Only the first letter differs from కుండ (kuṇḍa), a pot."
  "te-6567":
    native: "son of a whore (a very rude family insult)"
    notes:
      "n1": "Strong. A family insult that calls the listener's mother a whore. Very rude; said in anger."
  "te-6568":
    native: "outcaste (a caste slur)"
    notes:
      "n1": "Strongest. A caste slur, from a historical name for the lowest, untouchable castes. Never use it to or about a person."
  "te-6569":
    native: "hijra; a slur for a transgender or effeminate man"
    notes:
      "n1": "Strongest. The word names a community of transgender people. As an insult it is a slur and hurtful; never use it that way."
