  "te-0283":
    native: "at home; in the house"
    notes:
      "n1": "-లో (-lō) is 'in'. ఇల్లు (illu) takes its stem ఇంటి- (iṇṭi-) first."
  "te-0284":
    native: "from Hyderabad"
    bases:
      "హైదరాబాద్": "Hyderabad"
      "నుంచి": "from (after a noun)"
  "te-0285":
    native: "Give it to Ramu, please."
    notes:
      "n1": "-కి (-ki) or -కు (-ku) is 'to' the person something is given or said to."
    bases:
      "రాముకి": "Ramu (a man's name)"
  "te-0286":
    native: "with me"
    notes:
      "n1": "-తో (-tō) is 'with': మీతో (mītō), with you."
