  "te-6509":
    native: "Postpositions: from, with, on, under, near, for, after, before"
    explanation: "Telugu puts its place and time words after the noun, not before. These phrases show them: nuñci (from), rāmuki (to Rāmu), nātō (with me), mīda (on), kinda (under), daggara (near), kōsaṁ (for), tarvāta (after) and mundu (before)."
  "te-6510":
    native: "The case ending -lō: in, on, at"
    explanation: "The ending lō, added to a noun, means in, on or at. Here: tammuḍilō (in the younger brother), vāramlō (in the week) and sōmavāramlō (on Monday)."
  "te-6511":
    native: "The case ending -ki: to, for"
    explanation: "The ending ki, added to a noun, means to or for. Here: tammuḍiki (to the younger brother), vārāniki (for the week) and sōmavārāniki (for Monday)."
  "te-6512":
    native: "The case ending -tō: with"
    explanation: "The ending tō, added to a noun, means with. Here: tammuḍitō (with the younger brother), vārantō (with the week) and sōmavārantō (with Monday)."
  "te-6513":
    native: "The case ending nuñci: from"
    explanation: "The word nuñci, after a noun, means from. Here: tammuḍi nuñci (from the younger brother), vāraṁ nuñci (from the week) and sōmavāraṁ nuñci (from Monday)."
  "te-6514":
    native: "The object ending -ni"
    explanation: "The ending ni marks the thing a verb acts on. Here: tammuḍini (the younger brother), vārānni (the week) and sōmavārānni (Monday)."
