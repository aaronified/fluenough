native: { code: "en", iso639_3: "eng", name: "English" }
name: "Telugu stress, length and tone (IPA)"
description: "How Telugu uses stress and length, and what the sources used say about tone: one card each. For learners who know the IPA or want to learn it. Variety taught: standard (Coastal Andhra) colloquial Telugu. This is a proposal, not yet confirmed by the owner, a Telugu speaker or a phonetician. Where a source describes another dialect, the card says so."
license: "CC-BY-SA-4.0"
authors:
  - { name: "Fluenough contributors" }
  - { name: "Wikipedia contributors (Telugu language; Help:IPA/Telugu)", url: "https://en.wikipedia.org/wiki/Telugu_language" }
source: "Bhaskararao and Ray (2017), 'Illustrations of the IPA: Telugu', Journal of the International Phonetic Association 47(2): 231-241, doi 10.1017/S0025100316000207 (named in Wikipedia's references; the article itself was not read); Krishnamurti (2003), The Dravidian Languages, Cambridge University Press, and Lisker and Krishnamurti (1991), Proceedings of the XIIth International Congress of Phonetic Sciences 2: 90-93 (both as cited by Wikipedia). Text adapted from Wikipedia, 'Telugu language' (section Phonology) and 'Help:IPA/Telugu', CC BY-SA 4.0, https://en.wikipedia.org/wiki/Telugu_language"
tags: ["ipa", "phonology", "unreviewed"]
cards:
  "te-6618":
    native: "stress: Telugu has no contrastive stress"
    notes:
      "n1": "Telugu does not have contrastive stress, and speakers vary on where they perceive stress. Most place it on the penultimate or final syllable, depending on the word and on vowel length. This course does not mark stress in its IPA."
      "n2": "Wikipedia's IPA help page marks stress with ˈ before the stressed syllable. None of the sources used describes lexical tone in Telugu."
  "te-6619":
    native: "vowel length: a long vowel against a short one"
    notes:
      "n1": "Telugu vowels contrast in length: every vowel has a short and a long form except æː, which is only long. Long vowels can occur in any position of a word, but the source says native words do not end in a long vowel."
      "n2": "Minimal pair among this course's words: {1}, many; several, and {2}, milk, differ only in the length of the vowel, a against aː."
      "n3": "Minimal pair among this course's words: {1}, pen, and {2}, time; season, differ only in the length of the first vowel, a against aː."
    examples:
      "పాలు": "milk"
      "కాలం": "time; season"
  "te-6620":
    native: "consonant length: a long (doubled) consonant against a short one"
    notes:
      "n1": "Most consonants contrast in length between vowels: a long consonant is a doubled (geminate) one. The source's pairs: aṭu 'that side' and aṭṭu 'pancake'; moga 'male' and mogga 'bud'; namakamu 'a vedic hymn' and nammakamu 'belief'; kanu 'to give birth to' and kannu 'eye'; kala 'dream' and kalla 'falsehood'; mari 'again' and marri 'banyan tree'."
      "n2": "Minimal pair among this course's words: {1}, dream, and {2}, lie; falsehood, differ only in the length of the l, l against lː. This course's readings write a long consonant as a doubled letter (kalla); its IPA sometimes doubles the letter and sometimes uses ː, and both mean the same."
      "n3": "Wikipedia's IPA help page uses ː for a doubled consonant, placed after it."
    examples:
      "కల్ల": "lie; falsehood"
      "కన్ను": "eye"
