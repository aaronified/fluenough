id: "te-en-multiword-compound-verbs"
kind: "layer"
core: "te-multiword-compound-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: compound verbs"
description: "Eleven verb phrases of a verbal participle and an auxiliary, written as one word: go away, fall down, fly away, be finished, fetch and keep ready, stop, eat up, tell it all, buy for oneself, do for oneself and look after. Only compounds the course already teaches in its grammar decks are included; others were not checked. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "te-9150":
    native: "to go away; to leave"
    notes:
      "u1": "వెళ్ళిపోవడం (veḷḷipōvaḍaṁ) means to go away and leave a place. The course's te-grammar-compound-verbs deck has వెళ్ళిపోయాడు (veḷḷipōyāḍu), he went away."
    bases:
      "పోవడం": { meaning: "to go; to go away" }
  "te-9151":
    native: "to fall down; to collapse"
    notes:
      "u1": "పడిపోవడం (paḍipōvaḍaṁ) means to fall down, as a person does when they fall to the ground. The course's te-grammar-compound-verbs deck has పడిపోయాడు (paḍipōyāḍu), he fell down."
    bases:
      "పోవడం": { meaning: "to go; to go away" }
  "te-9152":
    native: "to fly away"
    notes:
      "u1": "ఎగిరిపోవడం (egiripōvaḍaṁ) means to fly off and away, as a bird does. The verb ఎగరడం (egaraḍaṁ) alone means to fly or to jump up."
    bases:
      "పోవడం": { meaning: "to go; to go away" }
  "te-9153":
    native: "to be finished; to run out"
    notes:
      "u1": "అయిపోవడం (ayipōvaḍaṁ) is said of something that runs out or comes to an end, such as stock or fuel. కావడం (kāvaḍaṁ) means to become; its participle is అయి (ayi)."
    bases:
      "పోవడం": { meaning: "to go; to go away" }
  "te-9154":
    native: "to fetch and keep ready (for someone)"
    notes:
      "u1": "తెచ్చిపెట్టడం (teccipeṭṭaḍaṁ) means to fetch something and put it aside or keep it ready, often for another person. The course's te-grammar-compound-verbs deck has తెచ్చిపెట్టండి (teccipeṭṭaṇḍi), please fetch it. తెచ్చి (tecci) comes from the irregular stem of తేవడం (tēvaḍaṁ): tē- becomes tecc-."
  "te-9155":
    native: "to stop; to come to a halt"
    notes:
      "u1": "ఆగిపోవడం (āgipōvaḍaṁ) means to stop or come to a halt, of something that was moving or running, such as rain or a machine. The course's before-after, purpose and concessive decks use ఆగిపోవడానికి (āgipōvaḍāniki) and ఆగిపోయినా (āgipōyinā)."
    bases:
      "పోవడం": { meaning: "to go; to go away" }
  "te-9156":
    native: "to eat up"
    notes:
      "u1": "తినేయడం (tinēyaḍaṁ) means to eat up, to finish all of something. The course's te-grammar-compound-verbs deck has తినేశాను (tinēśānu), I've eaten it all up."
  "te-9157":
    native: "to tell it all"
    notes:
      "u1": "చెప్పేయడం (ceppēyaḍaṁ) means to say all of something to someone, to tell it in full. The course's te-grammar-compound-verbs deck has చెప్పేశాను (ceppēśānu), I've gone and told them."
  "te-9158":
    native: "to buy for oneself"
    notes:
      "u1": "కొనుక్కోవడం (konukkōvaḍaṁ) means to buy something for oneself. The course's te-grammar-compound-verbs deck has కొనుక్కున్నాను (konukkunnānu), I bought it for myself. The verb కొనడం (konaḍaṁ) alone means to buy."
  "te-9159":
    native: "to do for oneself"
    notes:
      "u1": "చేసుకోవడం (cēsukōvaḍaṁ) means to do something for oneself or for one's own benefit. The course's te-grammar-compound-verbs deck has చేసుకున్నాను (cēsukunnānu), I did it for myself."
  "te-9160":
    native: "to look after; to take a look"
    notes:
      "u1": "చూసుకోవడం (cūsukōvaḍaṁ) means to look after someone or something, or to take a look at it yourself. The course's te-grammar-compound-verbs deck has చూసుకోండి (cūsukōṇḍi), please look after it; take a look."
