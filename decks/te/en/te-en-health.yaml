"schema": 1
"id": "te-en-health"
"kind": "layer"
"core": "te-health"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Health: doctors, medicines, exercise and habits"
"description": "Doctors, dentists, the hospital and emergency calls; treatments, medicines and bandages; food, exercise, sleep and habits such as smoking and drinking; and how to say where it hurts. Not yet checked by a Telugu speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "te-3200":
    "native": "doctor"
    "notes":
      "n1": "వస్తారు (vastāru), will come, is the polite form of రావడం (rāvaḍaṁ), to come: its stem changes to వస్- (vas-)."
    "examples":
      "వైద్యుడు ఇప్పుడు వస్తారు.":
        "native": "The doctor will come now."
        "bases":
          "ఇప్పుడు":
            "meaning": "now"
          "వస్తారు":
            "meaning": "to come (polite)"
      "మా వైద్యుడు చాలా మంచివారు.":
        "native": "Our doctor is very good."
        "bases":
          "మా":
            "meaning": "our"
          "చాలా":
            "meaning": "very"
          "మంచివారు":
            "meaning": "good (of people)"
    synonyms: { "cikitsakudu": "a physician, doctor", "vejja": "a physician or doctor," }
    antonyms: { "vaidyuralu": "a female doctor" }
    wiktionary: true
  "te-3201":
    "native": "dentist"
    "notes":
      "n1": "A dentist works on the teeth: పన్ను (pannu), tooth, becomes పంటి- (paṇṭi-) before an ending."
    "examples":
      "దంతవైద్యుడు నా పంటిని చూశారు.":
        "native": "The dentist looked at my tooth."
        "bases":
          "నా":
            "meaning": "my"
          "చూశారు":
            "meaning": "looked (polite)"
      "ప్రతి ఆరు నెలలకు దంతవైద్యుడిని కలవండి.":
        "native": "See the dentist every six months."
        "bases":
          "ప్రతి":
            "meaning": "every"
          "ఆరు":
            "meaning": "six"
          "నెలలకు":
            "meaning": "for months (every six months)"
          "దంతవైద్యుడిని":
            "meaning": "dentist"
          "కలవండి":
            "meaning": "see; meet (polite)"
    wiktionary: true
  "te-3202":
    "native": "ambulance"
    "notes":
      "n1": "The past of రావడం (rāvaḍaṁ), to come, is వచ్చింది (vaccindi): its stem changes to వచ్చ- (vacc-)."
    "examples":
      "అంబులెన్స్ వచ్చింది.":
        "native": "The ambulance has come."
        "bases":
          "వచ్చింది":
            "meaning": "came"
      "అంబులెన్స్ ఎక్కడ ఉంది?":
        "native": "Where is the ambulance?"
        "bases":
          "ఎక్కడ":
            "meaning": "where"
          "ఉంది":
            "meaning": "is"
  "te-3203":
    "native": "emergency"
    "notes":
      "n1": "Before a noun it is అత్యవసర (atyavasara), emergency, as in అత్యవసర గది (atyavasara gadi), the emergency room."
    "examples":
      "ఏదైనా అత్యవసరం అయితే ఫోన్ చేయండి.":
        "native": "In any emergency, phone."
        "bases":
          "ఏదైనా":
            "meaning": "any"
          "అయితే":
            "meaning": "if (it is)"
          "ఫోన్":
            "meaning": "phone"
          "చేయండి":
            "meaning": "do (polite); here, call"
      "అత్యవసర గదిలో చాలా సేపు ఎదురుచూశాను.":
        "native": "I waited a long time in the emergency room."
        "bases":
          "అత్యవసర":
            "meaning": "emergency (before a noun)"
          "గదిలో":
            "meaning": "in the room"
          "చాలా":
            "meaning": "very"
          "సేపు":
            "meaning": "while; time"
          "ఎదురుచూశాను":
            "meaning": "waited"
  "te-3204":
    "native": "vaccine; shot"
    "notes":
      "n1": "A vaccine is given by a shot. For an injection in general, see ఇంజెక్షన్ (iñjeksan)."
    "examples":
      "నాకు టీకా ఇచ్చారు.":
        "native": "They gave me a shot."
        "bases":
          "నాకు":
            "meaning": "to me"
          "ఇచ్చారు":
            "meaning": "gave (polite)"
      "టీకా తీసుకోవడం మంచిది.":
        "native": "It is good to get the vaccine."
        "bases":
          "మంచిది":
            "meaning": "good"
    wiktionary: true
  "te-3205":
    "native": "insurance"
    "notes":
      "n1": "On its own, బీమా (bīmā) is the general word. Health insurance is ఆరోగ్య బీమా (ārōgya bīmā)."
    "examples":
      "నా బీమా ఈ ఆసుపత్రిలో పనిచేస్తుందా?":
        "native": "Does my insurance work at this hospital?"
        "bases":
          "నా":
            "meaning": "my"
          "ఈ":
            "meaning": "this"
          "పనిచేస్తుందా":
            "meaning": "work; is valid"
      "బీమా కార్డు ఇంట్లో మర్చిపోయాను.":
        "native": "I left my insurance card at home."
        "bases":
          "కార్డు":
            "meaning": "card"
          "ఇంట్లో":
            "meaning": "at home"
          "మర్చిపోయాను":
            "meaning": "forgot; left behind"
    wiktionary: true
  "te-3206":
    "native": "food; diet"
    "notes":
      "n1": "Food in general, and also what a person eats as a diet. A diet set by a doctor is ఆహార నియమం (āhāra niyamaṁ)."
    "examples":
      "సమతుల్య ఆహారం శరీరానికి మేలు చేస్తుంది.":
        "native": "A balanced diet does the body good."
        "bases":
          "సమతుల్య":
            "meaning": "balanced"
          "మేలు":
            "meaning": "good; benefit"
          "చేస్తుంది":
            "meaning": "does; makes"
      "ఎక్కువ కూరగాయలు తినండి.":
        "native": "Eat plenty of vegetables."
        "bases":
          "ఎక్కువ":
            "meaning": "much; plenty"
          "కూరగాయలు":
            "meaning": "vegetables"
    wiktionary: true
  "te-3207":
    "native": "vitamin"
    "notes":
      "n1": "The plural adds -లు (-lu): విటమిన్లు (viṭaminlu), vitamins."
    "examples":
      "రోజూ విటమిన్ మాత్ర తీసుకుంటాను.":
        "native": "I take a vitamin tablet every day."
        "bases":
          "రోజూ":
            "meaning": "every day"
      "ఈ విటమిన్లు పిల్లలకు మంచివి.":
        "native": "These vitamins are good for children."
        "bases":
          "ఈ":
            "meaning": "these"
          "విటమిన్లు":
            "meaning": "vitamins"
          "పిల్లలకు":
            "meaning": "for children"
          "మంచివి":
            "meaning": "good"
  "te-3208":
    "native": "smoking"
    "notes":
      "n1": "The habit of smoking. A single cigarette is సిగరెట్ (sigareṭ)."
    "examples":
      "ధూమపానం ఆరోగ్యానికి హానికరం.":
        "native": "Smoking is harmful to health."
        "bases":
          "హానికరం":
            "meaning": "harmful"
      "అతను ధూమపానం మానేశాడు.":
        "native": "He has quit smoking."
        "bases":
          "అతను":
            "meaning": "he"
  "te-3209":
    "native": "cigarette"
    "notes":
      "n1": "The cigarette itself. For smoking as a habit, use ధూమపానం (dhūmapānaṁ)."
    "examples":
      "ఈ సిగరెట్ చాలా ఖరీదు.":
        "native": "This cigarette is very expensive."
        "bases":
          "ఈ":
            "meaning": "this"
          "చాలా":
            "meaning": "very"
          "ఖరీదు":
            "meaning": "expensive"
      "సిగరెట్ తాగడం ఆపేయాలి.":
        "native": "You should stop smoking cigarettes."
  "te-3210":
    "native": "alcohol"
    "notes":
      "n1": "Alcohol as a drink. Doctors and forms use this word."
    "examples":
      "డాక్టర్ మద్యం తాగవద్దని చెప్పారు.":
        "native": "The doctor said not to drink alcohol."
        "bases":
          "డాక్టర్":
            "meaning": "doctor"
          "చెప్పారు":
            "meaning": "said (polite)"
      "రాత్రిపూట మద్యం తాగితే నిద్ర సరిగా పట్టదు.":
        "native": "If you drink alcohol at night, you do not sleep well."
        "bases":
          "రాత్రిపూట":
            "meaning": "at night"
          "సరిగా":
            "meaning": "properly; well"
          "పట్టదు":
            "meaning": "does not come (of sleep)"
  "te-3211":
    "native": "blood pressure"
    "notes":
      "n1": "Made of రక్తం (raktaṁ), blood, and పోటు (pōṭu), a beat or pressure."
    "examples":
      "నా రక్తపోటు ఈ రోజు ఎక్కువగా ఉంది.":
        "native": "My blood pressure is high today."
        "bases":
          "నా":
            "meaning": "my"
          "ఈ":
            "meaning": "this"
          "రోజు":
            "meaning": "day"
          "ఎక్కువగా":
            "meaning": "high; a lot"
          "ఉంది":
            "meaning": "is"
      "రక్తపోటు తగ్గించడానికి ఉప్పు తక్కువ తినండి.":
        "native": "To lower blood pressure, eat less salt."
        "bases":
          "తక్కువ":
            "meaning": "less"
    wiktionary: true
  "te-3212":
    "native": "diabetes"
    "notes":
      "n1": "The word for the illness. Sugar itself is చక్కెర (cakkera)."
    "examples":
      "అమ్మకు మధుమేహం ఉంది.":
        "native": "My mother has diabetes."
        "bases":
          "అమ్మకు":
            "meaning": "to mother"
          "ఉంది":
            "meaning": "has"
      "మధుమేహం ఉన్నవారు చక్కెర తక్కువ తినాలి.":
        "native": "People with diabetes should eat less sugar."
        "bases":
          "ఉన్నవారు":
            "meaning": "people who have"
          "తక్కువ":
            "meaning": "less"
          "తినాలి":
            "meaning": "should eat"
    wiktionary: true
  "te-3213":
    "native": "allergy"
    "notes":
      "n1": "The thing you are allergic to comes first, with -అంటే (-aṇṭē), as for: పాలంటే (pālaṇṭē), as for milk, then అలెర్జీ (alerjī)."
    "examples":
      "నాకు పాలంటే అలెర్జీ.":
        "native": "I am allergic to milk."
        "bases":
          "నాకు":
            "meaning": "to me"
          "పాలంటే":
            "meaning": "as for milk"
      "ఈ మందుకు అలెర్జీ ఉందా?":
        "native": "Are you allergic to this medicine?"
        "bases":
          "ఈ":
            "meaning": "this"
          "ఉందా":
            "meaning": "is there (a question)"
  "te-3214":
    "native": "bandage; dressing"
    "notes":
      "n1": "A wrap that is tied. The verb is కట్టడం (kaṭṭaḍaṁ), to tie or bind."
    "examples":
      "గాయానికి కట్టు కట్టండి.":
        "native": "Put a bandage on the wound."
        "bases":
          "కట్టండి":
            "meaning": "tie (polite)"
      "మందుల దుకాణంలో కట్టు దొరుకుతుందా?":
        "native": "Can I get a bandage at the chemist's?"
        "bases":
          "దుకాణంలో":
            "meaning": "at the shop"
          "దొరుకుతుందా":
            "meaning": "is available?"
    synonyms: { "bandhamu": "a binding, tie, or fetter" }
    senses:
      "tie": { native: "tie, bond, band, bandage, knot" }
      "water": { native: "the water in which any kind of pulse is boiled except rice" }
    wiktionary: true
  "te-3215":
    "native": "plaster; sticking plaster"
    "notes":
      "n1": "A sticking plaster or a plaster cast, not the plaster on a wall."
    "examples":
      "కాలికి ప్లాస్టర్ వేశారు.":
        "native": "They put a plaster on my foot."
        "bases":
          "వేశారు":
            "meaning": "put on (polite)"
      "ప్లాస్టర్ ఎన్ని రోజులు ఉంచాలి?":
        "native": "How many days should the plaster stay on?"
        "bases":
          "ఎన్ని":
            "meaning": "how many"
          "రోజులు":
            "meaning": "days"
          "ఉంచాలి":
            "meaning": "keep; leave on"
  "te-3216":
    "native": "ointment"
    "notes":
      "n1": "A cream or paste for the skin, put on with the hand. A tablet is మాత్ర (mātra)."
    "examples":
      "రోజుకు రెండుసార్లు ఈ లేపనం రాయండి.":
        "native": "Apply this ointment twice a day."
        "bases":
          "రోజుకు":
            "meaning": "per day"
          "రెండుసార్లు":
            "meaning": "twice"
          "ఈ":
            "meaning": "this"
          "రాయండి":
            "meaning": "apply (polite)"
      "లేపనం చర్మంపై మాత్రమే రాయాలి.":
        "native": "Put the ointment only on the skin."
        "bases":
          "మాత్రమే":
            "meaning": "only"
          "రాయాలి":
            "meaning": "should apply"
    wiktionary: true
  "te-3217":
    "native": "thermometer"
    "notes":
      "n1": "It measures the body's heat. For fever itself, the word is జ్వరం (jvaraṁ)."
    "examples":
      "థర్మామీటర్ పెట్టి జ్వరం చూడండి.":
        "native": "Put the thermometer in and check the fever."
        "bases":
          "పెట్టి":
            "meaning": "having put"
          "చూడండి":
            "meaning": "check (polite)"
      "థర్మామీటర్ ఎంత వేడి చూపిస్తోంది?":
        "native": "What does the thermometer show?"
        "bases":
          "ఎంత":
            "meaning": "how much"
          "వేడి":
            "meaning": "heat; temperature"
          "చూపిస్తోంది":
            "meaning": "shows"
  "te-3218":
    "native": "surgery; operation"
    "notes":
      "n1": "The operation itself, done on the body in a hospital."
    "examples":
      "ఆయనకు శస్త్రచికిత్స జరిగింది.":
        "native": "He had an operation."
        "bases":
          "ఆయనకు":
            "meaning": "to him"
          "జరిగింది":
            "meaning": "took place"
      "శస్త్రచికిత్స తర్వాత కొన్ని రోజులు విశ్రాంతి తీసుకోవాలి.":
        "native": "After an operation, rest for a few days."
        "bases":
          "తర్వాత":
            "meaning": "after"
          "కొన్ని":
            "meaning": "some; a few"
          "రోజులు":
            "meaning": "days"
    synonyms: { "astracikitsa": "surgery" }
    wiktionary: true
  "te-3219":
    "native": "yoga"
    "notes":
      "n1": "The practice itself. To do it, use చేయడం (cēyaḍaṁ), to do."
    "examples":
      "ఉదయం యోగా చేస్తాను.":
        "native": "I do yoga in the morning."
        "bases":
          "ఉదయం":
            "meaning": "in the morning"
          "చేస్తాను":
            "meaning": "do (I)"
      "యోగా వల్ల నా ఒత్తిడి తగ్గింది.":
        "native": "Yoga reduced my stress."
        "bases":
          "వల్ల":
            "meaning": "because of; thanks to"
          "నా":
            "meaning": "my"
    wiktionary: true
  "te-3220":
    "native": "breath"
    "notes":
      "n1": "Breath itself. Breathing in is ఊపిరి తీసుకోవడం (ūpiri tīsukōvaḍaṁ)."
    "examples":
      "పొగ వల్ల ఊపిరి తీసుకోవడం కష్టమైంది.":
        "native": "Because of the smoke, breathing was hard."
        "bases":
          "పొగ":
            "meaning": "smoke"
          "వల్ల":
            "meaning": "because of"
          "కష్టమైంది":
            "meaning": "was hard"
      "నాకు ఊపిరి ఆడటం లేదు.":
        "native": "I cannot breathe."
        "bases":
          "నాకు":
            "meaning": "to me"
          "ఆడటం":
            "meaning": "being able (of breath)"
          "లేదు":
            "meaning": "is not"
    synonyms: { "usuru": "life", "pranamu": "life, vitality" }
    wiktionary: true
  "te-3221":
    "native": "sweat"
    "notes":
      "n1": "The liquid itself. To sweat is చెమట పట్టడం (cemaṭa paṭṭaḍaṁ)."
    "examples":
      "ఎండలో నడిస్తే ముఖమంతా చెమట.":
        "native": "Walk in the sun and your whole face gets sweaty."
        "bases":
          "ఎండలో":
            "meaning": "in the sun"
      "అతని నుదురు చెమటతో తడిసింది.":
        "native": "His forehead was wet with sweat."
        "bases":
          "అతని":
            "meaning": "his"
          "చెమటతో":
            "meaning": "with sweat"
          "తడిసింది":
            "meaning": "got wet"
    synonyms: { "sramajalamu": "perspiration, sweat", "svedamu": "sweat, perspiration" }
    wiktionary: true
  "te-3222":
    "native": "stress; pressure"
    "notes":
      "n1": "Pressure in the sense of stress or strain. For blood pressure, use రక్తపోటు (raktapōṭu)."
    "examples":
      "పని ఒత్తిడి ఎక్కువగా ఉంది.":
