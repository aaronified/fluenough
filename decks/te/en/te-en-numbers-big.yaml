schema: 1
id: "te-en-numbers-big"
kind: "layer"
core: "te-numbers-big"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Tens and big numbers"
description: "The tens, a hundred, a thousand, lakh and crore, and the halves every market uses. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0221":
    native: "30, thirty"
    notes:
      "n1": "Unlike Hindi and Bengali, Telugu builds 21 to 99 from parts: 26 is ఇరవై ఆరు (iravai āru), 'twenty six'."
  "te-0222":
    native: "40, forty"
  "te-0223":
    native: "50, fifty"
  "te-0224":
    native: "60, sixty"
  "te-0225":
    native: "70, seventy"
  "te-0226":
    native: "80, eighty"
  "te-0227":
    native: "90, ninety"
  "te-0228":
    native: "100, a hundred"
    alt_native: ["one hundred"]
    notes:
      "n1": "Two hundred is రెండు వందలు (reṇḍu vandalu). With more after it, వందల (vandala): రెండు వందల యాభై (reṇḍu vandala yābhai), 250. Also నూరు (nūru)."
  "te-0229":
    native: "1,000, a thousand"
    alt_native: ["one thousand"]
    notes:
      "n1": "Two thousand is రెండు వేలు (reṇḍu vēlu); with more after it, వేల (vēla): రెండు వేల ఇరవై (reṇḍu vēla iravai), 2020."
  "te-0230":
    native: "1,00,000, a lakh (a hundred thousand)"
    alt_native: ["one lakh"]
    notes:
      "n1": "Indian numbering counts in lakhs and crores, and places its commas to match: 1,00,000."
  "te-0231":
    native: "1,00,00,000, a crore (ten million)"
    alt_native: ["one crore"]
    notes:
      "n1": "A hundred lakh."
  "te-0232":
    native: "1½, one and a half"
    notes:
      "n1": "-న్నర (-nnara) adds a half: రెండున్నర (reṇḍunnara), 2½; నాలుగున్నర (nālugunnara), 4½."
  "te-0233":
    native: "2½, two and a half"
  "te-0234":
    native: "200, two hundred"
    notes:
      "n1": "From 200 to 900, hundred is వందలు (vandalu) when nothing follows it."
  "te-0235":
    native: "250, two hundred and fifty"
    notes:
      "n1": "With more after it, వందలు (vandalu) becomes వందల (vandala)."
  "te-0236":
    native: "150, a hundred and fifty"
    alt_native: ["one hundred and fifty"]
    notes:
      "n1": "With more after it, one hundred is నూట (nūṭa)."
  "te-0237":
    native: "2,000, two thousand"
    notes:
      "n1": "From 2,000 to 9,000, thousand is వేలు (vēlu) when nothing follows it."
  "te-0238":
    native: "2020, two thousand and twenty"
    alt_native: ["twenty twenty"]
    notes:
      "n1": "With more after it, వేలు (vēlu) becomes వేల (vēla)."
