schema: 1
id: "te-en-script-digits"
kind: "layer"
core: "te-script-digits"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Telugu digits"
description: "The ten digits, 0 to 9, that Telugu uses on old signs and in some books. Everyday writing mostly uses the Latin 0 to 9. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "te-6415":
    native: "0 (zero)"
    notes:
      "n1": "A plain round circle with no stroke. Do not confuse it with the anusvara ం (ṁ), a circle written after a letter, as in పుస్తకం (pustakam, book). A digit stands alone in a number; ం is part of a word."
  "te-6416":
    native: "1 (one)"
    notes:
      "n1": "The Telugu form of 1, not the Latin 1. Its word is ఒకటి (okaṭi)."
  "te-6417":
    native: "2 (two)"
    notes:
      "n1": "The Telugu form of 2, not the Latin 2. Its word is రెండు (reṇḍu)."
  "te-6418":
    native: "3 (three)"
    notes:
      "n1": "The Telugu form of 3, not the Latin 3. Its word is మూడు (mūḍu)."
  "te-6419":
    native: "4 (four)"
    notes:
      "n1": "The Telugu form of 4, not the Latin 4. Its word is నాలుగు (nālugu)."
  "te-6420":
    native: "5 (five)"
    notes:
      "n1": "The Telugu form of 5, not the Latin 5. Its word is ఐదు (aidu); the older spelling అయిదు (ayidu) is also used."
  "te-6421":
    native: "6 (six)"
    notes:
      "n1": "The Telugu form of 6, not the Latin 6. Its word is ఆరు (āru)."
  "te-6422":
    native: "7 (seven)"
    notes:
      "n1": "The Telugu form of 7, not the Latin 7. Its word is ఏడు (ēḍu)."
  "te-6423":
    native: "8 (eight)"
    notes:
      "n1": "The Telugu form of 8, not the Latin 8. Its word is ఎనిమిది (enimidi)."
  "te-6424":
    native: "9 (nine)"
    notes:
      "n1": "The Telugu form of 9, not the Latin 9. Its word is తొమ్మిది (tommidi)."
