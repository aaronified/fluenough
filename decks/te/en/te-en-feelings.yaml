schema: 1
id: "te-en-feelings"
kind: "layer"
core: "te-feelings"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Feelings and moods"
description: "Words for feelings and moods: love, hope, joy, sadness, worry, shame, pride, courage, trust and loneliness; how you feel (happy, sad, angry, scared, shy, bored); and verbs such as to cry, to laugh and to be proud. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-3300":
    native: "love; affection"
    alt_native: ["fondness"]
    wiktionary: true
    notes:
      "n1": "{1} is 'with love'."
    examples:
      "అమ్మ పిల్లలపై ఎంతో ప్రేమ చూపిస్తుంది.":
        native: "Mother shows her children a lot of love."
        bases:
          "పిల్లలపై": { meaning: "children" }
          "చూపిస్తుంది": { meaning: "to show" }
      "ఈ ఊరి మీద నాకు ప్రేమ పెరిగింది.":
        native: "My love for this town has grown."
        bases:
          "ఊరి": { meaning: "town; village" }
          "పెరిగింది": { meaning: "to grow; to increase" }
    synonyms: { "kurimi": "love", "gadili": "love, affection" }
  "te-3301":
    native: "hope"
    wiktionary: true
    notes:
      "n1": "{1} is 'with hope'."
    examples:
      "రేపు వర్షం పడుతుందని ఆశ ఉంది.":
        native: "There is hope that it will rain tomorrow."
        bases:
          "పడుతుందని": { meaning: "to fall; to rain" }
      "మా అమ్మ ఆశలు నెరవేరాయి.":
        native: "My mother's hopes came true."
        bases:
          "ఆశలు": { meaning: "hope" }
          "నెరవేరాయి": { meaning: "to come true; to be fulfilled" }
    senses:
      "love": { native: "love" }
      "desire": { native: "desire" }
      "hope": { native: "hope" }
  "te-3303":
    native: "sadness; sorrow"
    wiktionary: true
    notes:
      "n1": "{1} is 'sadly'."
      "n2": "In the plural and before case endings the stem changes: విచారాలు (vicārālu) and విచారాన్ని (vicārānni)."
    examples:
      "ఆ వార్త వినగానే అతనికి విచారం వచ్చింది.":
        native: "When he heard the news, sadness came over him."
        bases:
          "వినగానే": { meaning: "to hear" }
          "అతనికి": { meaning: "he" }
          "వచ్చింది": { meaning: "to come" }
      "ఆ సినిమా ముగింపు చూసి విచారంతో బయటకు వచ్చాం.":
        native: "We walked out of the film sad after seeing the ending."
        bases:
          "చూసి": { meaning: "to see" }
          "విచారంతో": { meaning: "sadness" }
          "బయటకు": { meaning: "outside" }
          "వచ్చాం": { meaning: "to come" }
  "te-3304":
    native: "worry; anxiety"
    notes:
      "n1": "{1} is 'with worry'."
    examples:
      "పరీక్ష ఫలితాల గురించి ఆందోళనగా ఉంది.":
        "native": "I am worried about the exam results."
        "bases":
          "ఫలితాల":
            "meaning": "result"
          "గురించి":
            "meaning": "about; concerning"
      "ఆమె ఆందోళనను దాచలేకపోయింది.":
        native: "She could not hide her worry."
        bases:
          "ఆందోళనను": { meaning: "worry; anxiety" }
          "దాచలేకపోయింది": { meaning: "to hide" }
  "te-3305":
    native: "surprise; wonder"
    alt_native: ["amazement"]
    wiktionary: true
    notes:
      "n1": "{1} is 'in surprise'."
      "n2": "In the plural and before case endings the stem changes: ఆశ్చర్యాలు (āścaryālu) and ఆశ్చర్యాన్ని (āścaryānni)."
    examples:
      "అతను అంత త్వరగా రావడం నాకు ఆశ్చర్యం.":
        native: "It surprises me that he came so soon."
        bases:
          "అంత": { meaning: "that much" }
          "త్వరగా": { meaning: "quickly; early" }
          "రావడం": { meaning: "to come" }
      "ఆయన ఆశ్చర్యంతో కళ్ళు పెద్దవి చేశారు.":
        native: "He opened his eyes wide in surprise."
        bases:
          "ఆశ్చర్యంతో": { meaning: "surprise" }
          "కళ్ళు": { meaning: "eye" }
          "పెద్దవి": { meaning: "big" }
          "చేశారు": { meaning: "to do" }
  "te-3306":
    native: "shame; shyness"
    alt_native: ["embarrassment"]
    wiktionary: true
    notes:
      "n1": "{1} is 'with shame'."
    examples:
      "అతనికి అందరి ముందు మాట్లాడాలంటే సిగ్గు.":
        native: "He is shy about speaking in front of everyone."
        bases:
          "అందరి": { meaning: "everyone" }
          "మాట్లాడాలంటే": { meaning: "to speak" }
      "ఆ పొగడ్తకు నేను సిగ్గుతో నవ్వేశాను.":
        "native": "I laughed shyly at that compliment."
        "bases":
          "పొగడ్తకు":
            "meaning": "praise; compliment"
          "నవ్వేశాను":
            "meaning": "to laugh; to smile"
          "సిగ్గుతో":
            "meaning": "shyness; shame"
    synonyms: { "lajja": "shame" }
  "te-3307":
    native: "courage"
    alt_native: ["bravery"]
    wiktionary: true
    notes:
      "n1": "{1} is 'with courage'."
      "n2": "In the plural and before case endings the stem changes: ధైర్యాలు (dhairyālu) and ధైర్యాన్ని (dhairyānni)."
    examples:
      "అతనికి ఆ పని చేసేంత ధైర్యం ఉంది.":
        native: "He has the courage to do that job."
        bases:
          "చేసేంత": { meaning: "to do" }
      "ధైర్యంగా ముందుకు వెళ్ళు.":
        native: "Go forward bravely."
        bases:
          "ధైర్యంగా": { meaning: "courage" }
          "ముందుకు": { meaning: "front; forward" }
          "వెళ్ళు": { meaning: "to go" }
  "te-3308":
    native: "trust; belief; confidence"
    wiktionary: true
    notes:
      "n1": "{1} is 'confidently'."
      "n2": "In the plural and before case endings the stem changes: నమ్మకాలు (nammakālu) and నమ్మకాన్ని (nammakānni)."
    examples:
      "నాకు నీ మీద నమ్మకం ఉంది.":
        native: "I trust you."
        bases:
          "నీ": { meaning: "you" }
      "ఆ వైద్యుడిపై ప్రజలకు చాలా నమ్మకం.":
        native: "People have great trust in that doctor."
        bases:
          "వైద్యుడిపై": { meaning: "doctor" }
          "ప్రజలకు": { meaning: "people" }
  "te-3309":
    native: "pride"
    wiktionary: true
    notes:
      "n1": "{1} is 'proudly'."
      "n2": "In the plural and before case endings the stem changes: గర్వాలు (garvālu) and గర్వాన్ని (garvānni)."
    examples:
      "తన పిల్లల విజయంపై ఆయనకు గర్వం.":
        "native": "He is proud of his children's success."
        "bases":
          "పిల్లల":
            "meaning": "children"
          "విజయంపై":
            "meaning": "success"
          "ఆయనకు":
            "meaning": "he"
          "తన":
            "meaning": "oneself; one's own"
      "ఆ వేడుకలో అమ్మ గర్వంగా నవ్వింది.":
        native: "At the celebration, Mother smiled with pride."
        bases:
          "వేడుకలో": { meaning: "celebration" }
          "గర్వంగా": { meaning: "pride" }
          "నవ్వింది": { meaning: "to laugh; to smile" }
  "te-3310":
    native: "jealousy; envy"
    wiktionary: true
    notes:
      "n1": "{1} is 'out of envy'."
    examples:
      "స్నేహితుడి విజయం చూసి అతనికి అసూయ కలిగింది.":
        native: "Seeing his friend's success, he felt envy."
        bases:
          "స్నేహితుడి": { meaning: "friend" }
          "చూసి": { meaning: "to see" }
          "కలిగింది": { meaning: "to arise; to be felt" }
      "అసూయతో ఆమె అతని గురించి మాట్లాడింది.":
        "native": "Out of jealousy, she talked about him."
        "bases":
          "అసూయతో":
            "meaning": "jealousy; envy"
          "అతని":
            "meaning": "he"
          "మాట్లాడింది":
            "meaning": "to speak"
          "గురించి":
            "meaning": "about; concerning"
    senses:
      "envy": { native: "envy" }
      "jealousy": { native: "jealousy" }
  "te-3311":
    native: "boredom; annoyance"
    alt_native: ["irritation"]
    wiktionary: true
    notes:
      "n1": "{1} is 'with boredom or annoyance'."
    examples:
      "ఒకే పని రోజూ చేసి నాకు విసుగు వచ్చింది.":
        native: "I got bored doing the same job every day."
        bases:
          "చేసి": { meaning: "to do" }
          "వచ్చింది": { meaning: "to come" }
      "ఈ సినిమా చూసి చూసి విసుగ్గా ఉంది.":
        native: "I am bored of watching this film over and over."
        bases:
          "చూసి": { meaning: "to see" }
          "విసుగ్గా": { meaning: "boredom; annoyance" }
    senses:
      "disgust": { native: "disgust, dislike, vexation" }
      "boredom": { native: "boredom, tedium, tediousness" }
      "weariness": { native: "weariness, tiredness" }
  "te-3313":
    native: "gratitude; thankfulness"
    wiktionary: true
    notes:
      "n1": "{1} is 'gratefully'."
    examples:
      "నీ సహాయానికి కృతజ్ఞతలు.":
        "native": "Thank you for your help."
        "bases":
          "నీ":
            "meaning": "you"
          "సహాయానికి":
            "meaning": "help"
          "కృతజ్ఞతలు":
            "meaning": "gratitude; thanks"
      "ఆయన మాటల్లో కృతజ్ఞత కనిపించింది.":
        native: "Gratitude showed in his words."
        bases:
          "మాటల్లో": { meaning: "word" }
          "కనిపించింది": { meaning: "to appear" }
    antonyms: { "krtaghnata": "a lack or absence of gratitude; ingratitude" }
  "te-3314":
    native: "calm; peace of mind"
    alt_native: ["serenity"]
    notes:
      "n1": "{1} is 'calmly'."
    examples:
      "ఉదయం గుడిలో ఎంతో ప్రశాంతత ఉంటుంది.":
        native: "The temple is very peaceful in the morning."
        bases:
          "గుడిలో": { meaning: "temple" }
          "ఉంటుంది": { meaning: "to be" }
      "ఈ ఊరు వచ్చాక నాకు మనసులో ప్రశాంతత వచ్చింది.":
        native: "Since coming to this town, I have found peace of mind."
        bases:
          "వచ్చాక": { meaning: "to come" }
          "మనసులో": { meaning: "mind; heart" }
          "వచ్చింది": { meaning: "to come" }
  "te-3316":
    native: "grief; deep sorrow"
    wiktionary: true
    notes:
      "n1": "{1} is 'with grief'."
      "n2": "In the plural and before case endings the stem changes: దుఃఖాలు (duḥkhālu) and దుఃఖాన్ని (duḥkhānni)."
    examples:
      "ఆమె తల్లి మరణంతో దుఃఖంలో ఉంది.":
        "native": "She is in grief over her mother's death."
        "bases":
          "మరణంతో":
            "meaning": "death"
          "దుఃఖంలో":
            "meaning": "grief"
          "తల్లి":
            "meaning": "mother"
      "ఆ వార్త విని దుఃఖం ఆపుకోలేకపోయాను.":
        native: "On hearing that news, I could not hold back my grief."
        bases:
          "విని": { meaning: "to hear" }
          "ఆపుకోలేకపోయాను": { meaning: "to hold back" }
  "te-3317":
    native: "loneliness"
    notes:
      "n1": "{1} is 'in loneliness'."
      "n2": "In the plural and before case endings the stem changes: ఒంటరితనాలు (oṇṭaritanālu) and ఒంటరితనాన్ని (oṇṭaritanānni)."
    examples:
      "ఊరు మారాక ఆమెకు ఒంటరితనం అనిపించింది.":
        native: "After she moved to another town, she felt lonely."
        bases:
          "మారాక": { meaning: "to change; to move" }
          "ఆమెకు": { meaning: "she" }
          "అనిపించింది": { meaning: "to feel" }
      "ఒంటరితనాన్ని పోగొట్టడానికి ఆమె పుస్తకాలు చదువుతుంది.":
        native: "To get rid of loneliness, she reads books."
        bases:
          "ఒంటరితనాన్ని": { meaning: "loneliness" }
          "పోగొట్టడానికి": { meaning: "to get rid of" }
          "పుస్తకాలు": { meaning: "book" }
          "చదువుతుంది": { meaning: "to read" }
  "te-3318":
    native: "curiosity"
    notes:
      "n1": "{1} is 'curiously'."
      "n2": "In the plural and before case endings the stem changes: కుతూహలాలు (kutūhalālu) and కుతూహలాన్ని (kutūhalānni)."
    examples:
      "పిల్లలకు కొత్త విషయాల మీద కుతూహలం ఎక్కువ.":
        native: "Children are very curious about new things."
        bases:
          "పిల్లలకు": { meaning: "children" }
          "విషయాల": { meaning: "matter; thing" }
      "కుతూహలంతో ఆ పెట్టె తెరిచి చూశాను.":
        native: "Out of curiosity, I opened that box and looked."
        bases:
          "కుతూహలంతో": { meaning: "curiosity" }
          "తెరిచి": { meaning: "to open" }
          "చూశాను": { meaning: "to see" }
  "te-3319":
    native: "tears"
    wiktionary: true
    notes:
      "n1": "{1} is 'with tears'."
    examples:
      "ఆమె కళ్ళలో కన్నీళ్లు వచ్చాయి.":
        native: "Tears came to her eyes."
        bases:
          "కళ్ళలో": { meaning: "eye" }
          "వచ్చాయి": { meaning: "to come" }
      "అమ్మ కన్నీళ్లు తుడుచుకుని నవ్వింది.":
        native: "Mother wiped her tears and smiled."
        bases:
          "తుడుచుకుని": { meaning: "to wipe" }
          "నవ్వింది": { meaning: "to laugh; to smile" }
  "te-3320":
    native: "friendship"
    wiktionary: true
    notes:
      "n1": "{1} is 'in a friendly way'."
      "n2": "In the plural and before case endings the stem changes: స్నేహాలు (snēhālu) and స్నేహాన్ని (snēhānni)."
    examples:
      "వాళ్ళ మధ్య మంచి స్నేహం ఉంది.":
        native: "There is a good friendship between them."
        bases:
          "వాళ్ళ": { meaning: "they" }
      "మా స్నేహాన్ని అతను ఎప్పుడూ కాపాడుకున్నాడు.":
        native: "He always kept up our friendship."
        bases:
          "మా": { meaning: "our" }
          "స్నేహాన్ని": { meaning: "friendship" }
          "కాపాడుకున్నాడు": { meaning: "to keep; to protect" }
  "te-3321":
    native: "humiliation; insult"
    wiktionary: true
    notes:
      "n1": "{1} is 'humiliatingly'."
      "n2": "In the plural and before case endings the stem changes: అవమానాలు (avamānālu) and అవమానాన్ని (avamānānni)."
    examples:
      "అందరి ముందు తిట్టడం అతనికి అవమానం అనిపించింది.":
        native: "Being scolded in front of everyone felt humiliating to him."
        bases:
          "అందరి": { meaning: "everyone" }
          "తిట్టడం": { meaning: "to scold" }
          "అతనికి": { meaning: "he" }
          "అనిపించింది": { meaning: "to feel" }
      "ఆ మాటలు విని ఆమె అవమానంతో తల దించుకుంది.":
        native: "Hearing those words, she lowered her head in humiliation."
        bases:
          "మాటలు": { meaning: "word" }
          "విని": { meaning: "to hear" }
          "అవమానంతో": { meaning: "humiliation" }
          "దించుకుంది": { meaning: "to lower" }
  "te-3322":
    native: "homesickness; longing; worry"
    notes:
      "n1": "{1} is 'with homesickness'."
    examples:
      "ఊరు గుర్తుకొస్తే నాకు బెంగగా ఉంటుంది.":
        native: "When I think of my village, I feel homesick."
        bases:
          "గుర్తుకొస్తే": { meaning: "to come to mind" }
          "బెంగగా": { meaning: "homesickness" }
          "ఉంటుంది": { meaning: "to be" }
      "ఇంటికి దూరంగా ఉంటూ ఆమెకు బెంగ ఎక్కువైంది.":
        native: "Living far from home, her homesickness has grown."
        bases:
          "ఇంటికి": { meaning: "house; home" }
          "దూరంగా": { meaning: "distance" }
          "ఉంటూ": { meaning: "to be" }
          "ఆమెకు": { meaning: "she" }
          "ఎక్కువైంది": { meaning: "more; many" }
  "te-3323":
    native: "disappointment; despair"
    wiktionary: true
    notes:
