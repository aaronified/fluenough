schema: 1
id: "te-en-body"
kind: "layer"
core: "te-body"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The body"
description: "The parts of the body, from head to foot: face, eye, ear, nose, mouth, tooth, hand, finger, stomach, heart, leg and more. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0728":
    native: "body"
    wiktionary: true
    notes:
      "n1": "A word from Sanskrit. The everyday word is {1}."
  "te-0729":
    native: "head"
    wiktionary: true
    notes:
      "n1": "{1} is a headache."
    "examples": {
      "నాకు తల నొప్పిగా ఉంది.": {"native": "I have a headache.", "bases": {}}
    }
  "te-0730":
    native: "hair (on the head)"
    wiktionary: true
    notes:
      "n1": "One word for all the hair; it is not counted as many hairs."
    "examples": {
      "అమ్మాయి జుట్టు నల్లగా ఉంది.": {"native": "The girl's hair is black.", "bases": {}},
      "ఆమె జుట్టు పొడవుగా ఉంది.": {"native": "Her hair is long.", "bases": {"పొడవుగా": "length; long"}}
    }
  "te-0731":
    native: "face"
    wiktionary: true
    notes:
      "n1": "In speech also {1}."
    "examples": {
      "తాత ముఖంలో ముడతలు ఎక్కువ.": {"native": "Grandfather has many wrinkles on his face.", "bases": {}}
    }
  "te-0732":
    native: "eye"
    wiktionary: true
    notes:
      "n1": "The plural is irregular: {1}. Before an ending the stem is {2}: {3}, to the eye."
    "examples": {
      "కళ్ళు మూయండి.": {"native": "Please close your eyes.", "bases": {"కళ్ళు": "eye"}}
    }
  "te-0733":
    native: "ear"
    wiktionary: true
    notes:
      "n1": "The plural is {1}. {2} is a key: literally 'the lock's ear'."
    "examples": {
      "నేను తాళం చెవి దాస్తాను.": {"native": "I hide the key.", "bases": {}}
    }
  "te-0734":
    native: "nose"
    wiktionary: true
    notes:
      "n1": "Not {1}, a piece: only the last vowel differs."
  "te-0735":
    native: "mouth"
    wiktionary: true
    notes:
      "n1": "The plural is irregular: {1}. Before an ending the stem is {2}: {3}, in the mouth."
    "examples": {
      "నోరు తెరవండి.": {"native": "Please open your mouth.", "bases": {}}
    }
  "te-0736":
    native: "tooth"
    wiktionary: true
    notes:
      "n1": "The plural is {1}, which also means 'fruits'. {2} also means 'tax'."
    "examples": {
      "పళ్ళు తోముకోవడం": {"native": "to brush one's teeth", "bases": {"తోముకోవడం": "to scrub; to brush (oneself)", "పళ్ళు": "tooth"}},
      "నేను పళ్ళు తోముకుంటాను.": {"native": "I brush my teeth.", "bases": {"తోముకుంటాను": "to scrub; to brush (oneself)", "పళ్ళు": "tooth"}}
    }
  "te-0737":
    native: "tongue"
    wiktionary: true
    notes:
      "n1": "The tongue of the mouth; 'a language' is {1}."
  "te-0738":
    native: "lip"
    wiktionary: true
    notes:
      "n1": "The plural is {1}."
  "te-0739":
    native: "neck"
    wiktionary: true
    notes:
      "n1": "Also the neck of a bottle."
      "pair": "Vowel length: {1} (meḍa, neck) has the short e where {2} (mēḍa, upper floor) has the long ē."
    "examples": {
      "వధువు మెడలో మంగళసూత్రం ఉంది.": {"native": "The bride has a mangalsutra around her neck.", "bases": {}},
      "ఆమె మెడలో ముత్యాల హారం ఉంది.": {"native": "She wears a pearl necklace around her neck.", "bases": {}}
    }
  "te-0740":
    native: "shoulder"
    wiktionary: true
    notes:
      "n1": "Used in the plural for both shoulders: {1}."
  "te-0741":
    native: "hand; arm"
    wiktionary: true
    notes:
      "n1": "The plural is irregular: {1}. Also written {2}."
    "examples": {
      "చేతులు కడగండి.": {"native": "Please wash your hands.", "bases": {"చేతులు": "hand; arm"}},
      "ఇంటర్నెట్‌లో సెర్చ్ చేయి.": {"native": "Search on the internet.", "bases": {}}
    }
  "te-0742":
    native: "finger"
    wiktionary: true
    notes:
      "n1": "The same sound as {1} in {2}, two thousand: a different word."
    "examples": {
      "స్క్రీన్ మీద వేలు పెట్టండి.": {"native": "Put your finger on the screen.", "bases": {}}
    }
  "te-0743":
    native: "nail (of a finger or toe)"
    wiktionary: true
    notes:
      "n1": "The plural is {1}."
  "te-0744":
    native: "stomach; belly"
    alt_native: ["tummy"]
    wiktionary: true
    notes:
      "n1": "{1} is a stomach ache."
    "examples": {
      "నాకు కడుపు నొప్పిగా ఉంది.": {"native": "I have a stomach ache.", "bases": {}}
    }
  "te-0745":
    native: "back (of the body)"
    wiktionary: true
    notes:
      "n1": "Not {1}, 'behind', which is a place word."
  "te-0746":
    native: "heart; chest"
    wiktionary: true
    notes:
      "n1": "{1} is chest pain."
  "te-0747":
    native: "leg; foot"
    wiktionary: true
    notes:
      "n1": "It means both leg and foot. The plural is {1}, and before an ending the stem is {2}: {3}."
    "examples": {
      "నా కాలు నొప్పిగా ఉంది.": {"native": "My leg hurts.", "bases": {}}
    }
  "te-0748":
    native: "knee"
    wiktionary: true
    notes:
      "n1": "The plural is {1}."
    "examples": {
      "ఆమె మోకాళ్ళను వంచుతుంది.": {"native": "She bends her knees.", "bases": {}}
    }
  "te-0749":
    native: "throat; voice"
    wiktionary: true
    notes:
      "n1": "It means both the throat and the voice."
    "examples": {
      "అతని గొంతు బాగుంది.": {"native": "His voice is good.", "bases": {"బాగుంది": "good; well"}},
      "నేను మీ గొంతు గుర్తిస్తాను.": {"native": "I recognise your voice.", "bases": {}}
    }
  "te-0750":
    native: "skin"
    wiktionary: true
    notes:
      "n1": "A word from Sanskrit."
  "te-0751":
    native: "bone"
    wiktionary: true
    notes:
      "n1": "The plural is {1}."
  "te-0752":
    native: "blood"
    wiktionary: true
    notes:
      "n1": "A word from Sanskrit."
  "te-0753":
    native: "chin; beard"
    wiktionary: true
    notes:
      "n1": "It means both the chin and the beard."
  "te-0754":
    native: "forehead"
    wiktionary: true
    notes:
      "n1": "{1} is the mark worn on it."
