# Layer for te-proverbs-1: each proverb's literal English rendering and its meaning.
schema: 1
id: "te-en-proverbs-1"
kind: "layer"
core: "te-proverbs-1"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs 1"
description: "Twenty Telugu proverbs from M. W. Carr's 1868 supplement to A Collection of Telugu Proverbs, each with a literal English rendering and its meaning. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "te-8950":
    native: "Made of food, made of life."
    notes:
      "literal": "Said of the body, which lives on what it eats."
    bases:
      "అన్నమయం": { meaning: "made of food" }
      "ప్రాణమయం": { meaning: "made of life" }
  "te-8951":
    native: "Like a donkey carrying sandalwood powder."
    notes:
      "literal": "Said of someone who carries something precious and gains nothing from it."
    bases:
      "గంధపొడి": { meaning: "sandalwood powder" }
      "మోశే": { meaning: "carrying (if)" }
      "గాడిదవలె": { meaning: "like a donkey" }
  "te-8952":
    native: "A donkey is a donkey, a horse is a horse."
    notes:
      "literal": "Said that each creature keeps its own nature, and cannot be made into another. Printed spelling గుర్రము (gurramu) for the card's గుర్రం (gurraṁ); గుర్రమే (gurramē) and గాడిదే (gāḍidē) add the emphatic ending."
    bases:
      "గాడిద": { meaning: "donkey" }
      "గాడిదే": { meaning: "a donkey, emphatically" }
      "గుర్రము": { meaning: "horse" }
      "గుర్రమే": { meaning: "a horse, emphatically" }
  "te-8953":
    native: "If you shake the stick, the monkey will dance."
    notes:
      "literal": "Said that people do what they are made to do, and only under pressure."
    bases:
      "కోల": { meaning: "stick" }
      "ఆడితే": { meaning: "if (one) shakes" }
      "ఆడును": { meaning: "will dance" }
  "te-8954":
    native: "When the tank fills, the frogs gather."
    notes:
      "literal": "Said that people and creatures gather wherever there is plenty."
    bases:
      "నిండితే": { meaning: "if (it) fills" }
      "కప్పలు": { meaning: "frogs" }
      "చేరుతవి": { meaning: "gather" }
  "te-8955":
    native: "The kite snatched the hen and carried it off."
    notes:
      "literal": "Said when the stronger takes what belonged to the weaker."
    bases:
      "కోడిని": { meaning: "the hen" }
      "గద్ద": { meaning: "kite, a bird of prey" }
      "తన్నుకొని": { meaning: "snatching (away)" }
      "పోయినది": { meaning: "went away" }
  "te-8956":
    native: "Can you get new-moon food every day?"
    notes:
      "literal": "Said that a special treat cannot be had every day."
    bases:
      "అమావాస్య": { meaning: "new-moon day" }
      "కూడు": { meaning: "cooked food; a meal" }
      "దొరుకునా": { meaning: "can (one) get" }
  "te-8957":
    native: "If you scatter grains, will there be any shortage of crows?"
    notes:
      "literal": "Said that where something is free, there is never a shortage of takers."
    bases:
      "మెతుకులు": { meaning: "grains of cooked rice" }
      "చల్లితే": { meaning: "if (you) scatter" }
      "కాకులకు": { meaning: "to crows" }
      "తక్కువా": { meaning: "any shortage" }
  "te-8958":
    native: "May you make a hole in the house of the one who fed you?"
    notes:
      "literal": "Said to warn against betraying someone who has helped you. Printed spelling అన్నము (annamu) for the card's అన్నం (annaṁ). పెట్టినవారిల్లు (peṭṭinavārillu) is పెట్టినవారి (peṭṭinavāri) with ఇల్లు (illu); its base is ఇల్లు (illu)."
    bases:
      "అన్నము": { meaning: "food; cooked rice" }
      "పెట్టినవారిల్లు": { meaning: "the house of the one who fed (you)" }
      "కన్నము": { meaning: "hole dug in a wall by a thief" }
      "పెట్టవచ్చునా": { meaning: "may (you) make (a hole)" }
  "te-8959":
    native: "The Brahman is fond of dal, and the mother-in-law is fond of her son-in-law."
    notes:
      "literal": "Said that each person has a craving of their own. పప్పాశ (pappāśa) and అల్లుడాశ (alluḍāśa) end in ఆశ (āśa), which is their base."
    bases:
      "బాపడికి": { meaning: "to a Brahman" }
      "పప్పాశ": { meaning: "craving for dal" }
      "అత్తకు": { meaning: "to the mother-in-law" }
      "అల్లుడాశ": { meaning: "desire for a son-in-law" }
  "te-8960":
    native: "Work like a buffalo and eat like a lord."
    notes:
      "literal": "Said that one should work hard and then eat well."
    bases:
      "దున్నలాగున": { meaning: "like a buffalo" }
      "కష్టపడి": { meaning: "by working hard" }
      "దొరలాగున": { meaning: "like a lord" }
      "తినవలెను": { meaning: "must eat" }
  "te-8961":
    native: "I will not give a coin, and I will not give the dust on a coin."
    notes:
      "literal": "Said of a stingy person who refuses even the smallest sum. The printed spelling యివ్వను (yivvanu) is a form of ఇవ్వడం (ivvaḍaṁ), which the card spells with ఇ (i)."
    bases:
      "డబ్బూయివ్వను": { meaning: "I will not give even a coin" }
      "డబ్బుమీది": { meaning: "on a coin" }
      "దుమ్మూ": { meaning: "even the dust" }
      "యివ్వను": { meaning: "will give" }
  "te-8962":
    native: "Like honey raining down in a sugar pavilion."
    notes:
      "literal": "Said of sweet abundance and good fortune arriving all at once. తేనెవాన (tēnevāna) is తేనె (tēne) with వాన (vāna); its base is వాన (vāna)."
    bases:
      "పందిట్లో": { meaning: "in the pavilion" }
      "తేనెవాన": { meaning: "honey rain" }
      "కురిశినట్టు": { meaning: "as if pouring" }
  "te-8963":
    native: "Though the she-buffalo eats filth, will her milk be spoiled?"
    notes:
      "literal": "Said that a good person's nature is not spoiled by what surrounds them."
    bases:
      "బర్రె": { meaning: "she-buffalo" }
      "అమేధ్యము": { meaning: "filth" }
      "తింటే": { meaning: "if (she) eats" }
      "చెడుతున్నవా": { meaning: "is (it) spoiling" }
  "te-8964":
    native: "If the elder sister is ours, is her husband ours too?"
    notes:
      "literal": "Said that in-laws are not as close as one's own family."
    bases:
      "మనది": { meaning: "is ours" }
      "బావ": { meaning: "brother-in-law (sister's husband)" }
      "మనవాడా": { meaning: "is (he) one of ours?" }
  "te-8965":
    native: "If the daughter-in-law is dark, the whole family is dark."
    notes:
      "literal": "Said that one member's disgrace reflects on the whole family."
    bases:
      "కులమంతా": { meaning: "the whole family" }
  "te-8966":
    native: "He who grieves over a finished task is a man of little sense."
    notes:
      "literal": "Said that regretting what is already done and cannot be changed is foolish. అయిన (ayina) is a form of అవడం (avaḍaṁ) (to become); this course's card for 'to become' is కావడం (kāvaḍaṁ) (te-0646). గలవాడు (galavāḍu) is the printed spelling of కలవాడు (kalavāḍu)."
    bases:
      "అయిన": { meaning: "(that has) become; done" }
      "పనికి": { meaning: "for the work" }
      "చింతించేవాడు": { meaning: "the one who grieves" }
      "అల్పబుద్ధి": { meaning: "small sense; foolishness" }
      "గలవాడు": { meaning: "the one who has" }
  "te-8967":
    native: "The hand that comes to money will come to a pagoda."
    notes:
      "literal": "Said that money attracts more money, so small gains lead to larger ones. వచ్చిన (vaccina) and వస్తుంది (vastundi) are forms of రావడం (rāvaḍaṁ) (to come), whose stem changes."
    bases:
      "డబ్బుకు": { meaning: "to money" }
      "వచ్చిన": { meaning: "that came" }
      "చెయ్యే": { meaning: "hand" }
      "వరహాకు": { meaning: "to a pagoda, a gold coin" }
      "వస్తుంది": { meaning: "will come" }
  "te-8968":
    native: "A relative and rain that come in the morning do not stay."
    notes:
      "literal": "Said that a morning visitor, like morning rain, does not stay long. బందువూ (banduvū) is the printed spelling of బంధువు (bandhuvu); వచ్చిన (vaccina) is a form of రావడం (rāvaḍaṁ) (to come)."
    bases:
      "వచ్చిన": { meaning: "that came" }
      "బందువూ": { meaning: "relative" }
      "వానా": { meaning: "rain" }
      "నిలవవు": { meaning: "do not stay" }
  "te-8969":
    native: "If the ploughman checks his accounts, even the plough is not left over."
    notes:
      "literal": "Said that farming seldom makes a profit once all its costs are counted."
    bases:
      "దున్నేవాడు": { meaning: "the ploughman" }
      "లెక్క": { meaning: "account; reckoning" }
      "చూస్తే": { meaning: "if (he) looks" }
      "మిగలదు": { meaning: "is left over" }
