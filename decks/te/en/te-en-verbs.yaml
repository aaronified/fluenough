schema: 1
id: "te-en-verbs"
kind: "layer"
core: "te-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Everyday verbs"
description: "The verbs of a first day: go, come, eat, drink, see, say, give, take, sit, read, buy and more, each with its form for 'I' and its polite request. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0621":
    native: "to do; to make"
    notes:
      "n1": "'I do' and 'I will do' are one form, {1}. Please do is {2}."
      "n2": "It makes verbs from nouns: {1}, to phone; {2}, to help."
    "examples": {
      "కట్ చేయడం": {"native": "to hang up (a call)", "bases": {"చేయడం": "to do; to make"}}
    }
  "te-0622":
    native: "to go"
    notes:
      "n1": "'I go' and 'I will go' are one form, {1}. Please go is {2}."
      "n2": "The place you go to takes {1}: {2}, I go home."
    "examples": {
      "నేను వెళ్ళనక్కర్లేదు.": {"native": "I don't have to go.", "bases": {"వెళ్ళనక్కర్లేదు": "to go"}},
      "నేను వెళ్ళాలి.": {"native": "I have to go.", "bases": {"వెళ్ళాలి": "to go"}}
    }
  "te-0623":
    native: "to come"
    wiktionary: true
    notes:
      "n1": "'I come' and 'I will come' are one form, {1}. Please come is {2}."
      "n2": "The stem changes from {1} to {2} in {3}, and the polite request drops the {4}: {5}, not {6}."
      "n3": "With {1} it can mean 'know' a skill or a language: {2}."
  "te-0624":
    native: "to eat"
    notes:
      "n1": "'I eat' and 'I will eat' are one form, {1}. Please eat is {2}."
      "n2": "Also 'to take' a bribe or a beating, but you meet it first for food."
    "examples": {
      "ఏదైనా తినడానికి ఇవ్వండి.": {"native": "Give me something to eat, anything at all.", "bases": {}}
    }
  "te-0625":
    native: "to drink"
    notes:
      "n1": "'I drink' and 'I will drink' are one form, {1}. Please drink is {2}."
      "n2": "On its own, {1} can mean drinking alcohol; with a drink, as in {2}, it just means to drink."
    "examples": {
      "టీ తాగుతారా?": {"native": "Will you have tea?", "bases": {"తాగుతారా": "to drink"}},
      "నేను టీ తాగుతాను.": {"native": "I drink tea.", "bases": {"తాగుతాను": "to drink"}}
    }
  "te-0626":
    native: "to see; to look; to watch"
    notes:
      "n1": "'I see' and 'I will see' are one form, {1}. Please see is {2}."
    "examples": {
      "ట్రైలర్ చూశావా?": {"native": "Have you seen the trailer?", "bases": {}}
    }
  "te-0627":
    native: "to hear; to listen"
    alt_native: ["to listen to"]
    notes:
      "n1": "'I hear' and 'I will hear' are one form, {1}. Please hear is {2}."
      "n2": "Also 'to obey': {1}."
    "examples": {
      "జాతీయ గీతం వింటున్నాం.": {"native": "We are listening to the national anthem.", "bases": {}}
    }
  "te-0628":
    native: "to say; to tell"
    notes:
      "n1": "'I say' and 'I will say' are one form, {1}. Please say is {2}."
      "n2": "In speech you also hear {1}."
    "examples": {
      "తప్పకుండా చెప్తాను.": {"native": "I will surely tell you.", "bases": {}},
      "నాకు చెప్పు.": {"native": "Tell me.", "bases": {"చెప్పు": "to say; to tell"}}
    }
  "te-0629":
    native: "to ask"
    notes:
      "n1": "'I ask' and 'I will ask' are one form, {1}. Please ask is {2}."
    "examples": {
      "టీచర్ ప్రశ్న అడిగారు.": {"native": "The teacher asked a question.", "bases": {}},
      "అలా అడగడానికి నేను సిగ్గుపడతాను.": {"native": "I feel shy about asking like that.", "bases": {}}
    }
  "te-0630":
    native: "to give"
    notes:
      "n1": "'I give' and 'I will give' are one form, {1}. Please give is {2}."
      "n2": "The stem changes in the middle: {1} becomes {2}."
    "examples": {
      "రిప్లై ఇవ్వడం": {"native": "to reply", "bases": {"ఇవ్వడం": "to give"}},
      "అతను రాజీనామా ఇచ్చాడు.": {"native": "He handed in his resignation.", "bases": {"ఇచ్చాడు": "to give"}}
    }
  "te-0631":
    native: "to take; to receive"
    alt_native: ["to get"]
    notes:
      "n1": "'I take' and 'I will take' are one form, {1}. Please take is {2}."
    "examples": {
      "కూలీ ఎంత తీసుకుంటాడు?": {"native": "How much does the porter charge?", "bases": {}},
      "పెద్దల ఆశీర్వాదం తీసుకున్నారు.": {"native": "They received the elders' blessing.", "bases": {}}
    }
  "te-0632":
    native: "to bring"
    notes:
      "n1": "'I bring' and 'I will bring' are one form, {1}. Please bring is {2}."
      "n2": "In speech more often {1}, 'take and come'."
    "examples": {
      "ఫోన్ తీసుకురా.": {"native": "Bring the phone.", "bases": {"తీసుకురా": "to bring"}}
    }
  "te-0633":
    native: "to be; to stay; to live"
    alt_native: ["to remain"]
    notes:
      "n1": "'I stay' and 'I will stay' are one form, {1}. Please stay is {2}."
      "n2": "Telugu says who or what something is without a verb. {1} is for being somewhere, staying or having: {2}, there is."
    "examples": {
      "రిజర్వేషన్ ఉందా?": {"native": "Is there a reservation?", "bases": {"ఉందా": "to be; to stay; to live"}},
      "అతనికి మీసం ఉంది.": {"native": "He has a moustache.", "bases": {}}
    }
  "te-0634":
    native: "to sit"
    alt_native: ["to take a seat"]
    notes:
      "n1": "'I sit' and 'I will sit' are one form, {1}. Please sit is {2}."
    "examples": {
      "మీరు కూర్చోండి.": {"native": "Please sit down.", "bases": {"కూర్చోండి": "to sit"}},
      "మేము బాల్కనీలో కూర్చున్నాం.": {"native": "We sat in the balcony.", "bases": {}}
    }
  "te-0635":
    native: "to stand"
    notes:
      "n1": "'I stand' and 'I will stand' are one form, {1}. Please stand is {2}."
    "examples": {
      "క్యూలో నిలబడండి.": {"native": "Stand in the queue.", "bases": {}},
      "దూరంగా నిలబడండి.": {"native": "Stand far away.", "bases": {}}
    }
  "te-0636":
    native: "to walk"
    notes:
      "n1": "'I walk' and 'I will walk' are one form, {1}. Please walk is {2}."
    "examples": {
      "రైలు ఆలస్యంగా నడుస్తోంది.": {"native": "The train is running late.", "bases": {}},
      "మేము తీరం వెంట నడిచాము.": {"native": "We walked along the coast.", "bases": {}}
    }
  "te-0637":
    native: "to play"
    notes:
      "n1": "'I play' and 'I will play' are one form, {1}. Please play is {2}."
      "n2": "Used for games and sport, and for playing with someone."
    "examples": {
      "నేను క్లబ్‌లో ఆడతాను.": {"native": "I play at the club.", "bases": {}},
      "ఆయన ఈ జట్టులో ఆడతాడు.": {"native": "He plays on this team.", "bases": {}}
    }
  "te-0638":
    native: "to read; to study"
    notes:
      "n1": "'I read' and 'I will read' are one form, {1}. Please read is {2}."
      "n2": "One verb for both 'to read' and 'to study'."
    "examples": {
      "మెసేజ్ చదివాను.": {"native": "I read the message.", "bases": {}},
      "ఆ నోటీసు చదివారా?": {"native": "Did you read that notice?", "bases": {}}
    }
  "te-0639":
    native: "to write"
    notes:
      "n1": "'I write' and 'I will write' are one form, {1}. Please write is {2}."
    "examples": {
      "చక్కగా రాయండి.": {"native": "Write neatly.", "bases": {}},
      "నేను జవాబు రాశాను.": {"native": "I wrote the answer.", "bases": {}}
    }
  "te-0640":
    native: "to sleep; to fall asleep"
    alt_native: ["to go to sleep"]
    notes:
      "n1": "'I sleep' and 'I will sleep' are one form, {1}. Please sleep is {2}."
      "n2": "It means falling asleep. {1} is lying down."
  "te-0641":
    native: "to buy"
    alt_native: ["to purchase"]
    notes:
      "n1": "'I buy' and 'I will buy' are one form, {1}. Please buy is {2}."
    "examples": {
      "యూపీఐతో టికెట్ కొనవచ్చా?": {"native": "Can I buy a ticket by UPI?", "bases": {"కొనవచ్చా": "to buy"}},
      "అతను కొత్త బ్యాట్ కొన్నాడు.": {"native": "He bought a new bat.", "bases": {}}
    }
  "te-0642":
    native: "to sell"
    notes:
      "n1": "'I sell' and 'I will sell' are one form, {1}. Please sell is {2}."
    "examples": {
      "ఆమె చేతిపని వస్తువులు అమ్ముతుంది.": {"native": "She sells handicraft goods.", "bases": {}}
    }
  "te-0643":
    native: "to cook"
    notes:
      "n1": "'I cook' and 'I will cook' are one form, {1}. Please cook is {2}."
      "n2": "The other way to say it is {1}."
    "examples": {
      "కొన్నిసార్లు నేను ఇంట్లో వండుతాను.": {"native": "Sometimes I cook at home.", "bases": {}},
      "అమ్మ కూర వండుతుంది.": {"native": "Mother cooks the curry.", "bases": {"వండుతుంది": "to cook"}}
    }
  "te-0644":
    native: "to speak; to talk"
    notes:
      "n1": "'I speak' and 'I will speak' are one form, {1}. Please speak is {2}."
      "n2": "Built from {1}, a word, and {2}, to play: to play with words."
    "examples": {
      "అతను చిరునవ్వుతో మాట్లాడాడు.": {"native": "He spoke with a smile.", "bases": {}},
      "అతను నిజాయితీగా మాట్లాడాడు.": {"native": "He spoke honestly.", "bases": {}}
    }
  "te-0645":
    native: "to learn"
    notes:
      "n1": "'I learn' and 'I will learn' are one form, {1}. Please learn is {2}."
    "examples": {
      "అమ్మ వాట్సాప్ నేర్చుకుంది.": {"native": "Mother learned WhatsApp.", "bases": {}},
      "ఆమె తెలుగు నేర్చుకుంటోంది.": {"native": "She is learning Telugu.", "bases": {"తెలుగు": "Telugu (the language)", "నేర్చుకుంటోంది": "to learn"}}
    }
  "te-0646":
    native: "to become; to happen"
    notes:
      "n1": "'I become' and 'I will become' are one form, {1}."
      "n2": "The stem has two forms: {1} in {2}, did not happen, and {3} in {4}, I will become."
    "examples": {
      "నాకు అర్థం కాలేదు.": {"native": "I didn't understand.", "bases": {"అర్థం": "meaning; understanding", "కాలేదు": "to become; to happen"}},
      "ఆలస్యం కావడానికి కారణం ఏమిటి?": {"native": "What is the reason for the delay?", "bases": {}}
    }
  "te-0647":
    native: "to find out; to get to know"
    alt_native: ["to discover"]
    notes:
      "n1": "'I find out' and 'I will find out' are one form, {1}. Please find out is {2}."
    "examples": {
      "నియమాలు తెలుసుకోవడం ముఖ్యం.": {"native": "It is important to know the rules.", "bases": {}},
      "మరిన్ని వివరాలు తెలుసుకోవచ్చు.": {"native": "You can find out more details.", "bases": {}}
    }
  "te-0648":
    native: "to stop; to wait"
    alt_native: ["to halt"]
    notes:
      "n1": "'I stop' and 'I will stop' are one form, {1}. Please stop is {2}."
      "n2": "{1} is 'Wait!' or 'Stop!'"
    "examples": {
      "చివరికి వర్షం ఆగింది.": {"native": "In the end the rain stopped.", "bases": {}},
      "పావు గంట ఆగండి.": {"native": "Wait for a quarter of an hour.", "bases": {"ఆగండి": "to stop; to wait"}}
    }
  "te-0649":
    native: "to meet"
    notes:
      "n1": "'I meet' and 'I will meet' are one form, {1}. Please meet is {2}."
    "examples": {
      "మనం ఎప్పుడో కలుద్దాం.": {"native": "Let's meet some time.", "bases": {}},
      "రాజకుమారుడు ప్రజలను కలిశాడు.": {"native": "The prince met the people.", "bases": {}}
    }
  "te-0650":
    native: "to send"
    notes:
      "n1": "'I send' and 'I will send' are one form, {1}. Please send is {2}."
    "examples": {
      "వీడియో పంపాను.": {"native": "I sent a video.", "bases": {}},
      "నీకు ఇమెయిల్ పంపాను.": {"native": "I sent you an email.", "bases": {}}
    }
  "te-0651":
    native: "to know (a fact or a person)"
    notes:
      "n1": "Always with {1}: {2}, I know. The negative is {3}."
    "examples": {
      "నాకు తెలియదు.": {"native": "I don't know.", "bases": {"తెలియదు": "to know (a fact or a person)"}},
      "నాకు తెలియలేదు.": {"native": "I did not know.", "bases": {"తెలియలేదు": "to know (a fact or a person)"}}
    }

  "te-6516":
    native: "I: the present tense"
    explanation: "The I form of the present tense, shown with lēstānu (I get up), paḍukuṇṭānu (I go to bed) and cēstānu (I do)."
  "te-6517":
    native: "We (not you): the present tense"
    explanation: "The we form that leaves out the listener, shown with lēstāmu (we get up), paḍukuṇṭāmu (we go to bed) and cēstāmu (we do)."
  "te-6518":
    native: "We (with you): the present tense"
    explanation: "The we form that includes the listener, shown with lēstāṁ (we get up), paḍukuṇṭāṁ (we go to bed) and cēstāṁ (we do)."
  "te-6519":
    native: "You (to a friend): the present tense"
    explanation: "The you form for a friend, a child or someone younger, shown with lēstāvu (you get up), paḍukuṇṭāvu (you go to bed) and cēstāvu (you do)."
  "te-6520":
    native: "You (formal or plural): the present tense"
    explanation: "The you form for one respected person or for more than one, shown with lēstāru (you get up), paḍukuṇṭāru (you go to bed) and cēstāru (you do)."
  "te-6521":
    native: "He: the present tense"
    explanation: "The he form, shown with lēstāḍu (he gets up), paḍukuṇṭāḍu (he goes to bed) and cēstāḍu (he does)."
  "te-6522":
    native: "She or it: the present tense"
    explanation: "The she and it form, shown with lēstundi (she gets up), paḍukuṇṭundi (she goes to bed) and cēstundi (she does)."
  "te-6523":
    native: "They: the present tense"
    explanation: "The they form, shown with lēstāru (they get up), paḍukuṇṭāru (they go to bed) and cēstāru (they do)."
  "te-6524":
    native: "Please: the polite request"
    explanation: "The polite request, shown with lēvaṇḍi (please get up), paḍukōṇḍi (please go to bed) and cēyaṇḍi (please do)."
