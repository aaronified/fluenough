  "te-5823":
    "native": "danger to life"
    "notes":
      "n1": "Made of ప్రాణం (prāṇaṁ), life, and ఆపాయం (āpāyaṁ), danger. Its stem is ప్రాణాపాయ- (prāṇāpāya-) before endings: ప్రాణాపాయంలో (prāṇāpāyaṁlō). The plural is ప్రాణాపాయాలు (prāṇāpāyālu)."
    "examples":
      "అతని పరిస్థితి ప్రాణాపాయంలో ఉంది.":
        "native": "His condition is life-threatening."
        "bases":
          "ప్రాణాపాయంలో": { "meaning": "in danger to life" }
      "ఈ మందులు తీసుకోకపోతే ప్రాణాపాయం కలగవచ్చు.":
        "native": "Danger to life may arise if you don't take these medicines."
        "bases":
          "ఈ": { "meaning": "these" }
          "మందులు": { "meaning": "medicines" }
          "తీసుకోకపోతే": { "meaning": "if not taken" }
          "ప్రాణాపాయం": { "meaning": "danger to life" }
          "కలగవచ్చు": { "meaning": "to arise" }
  "te-5824":
    "native": "fire engine"
    "notes":
      "n1": "A loanword for a vehicle, so amahat. The plural is ఫైరింజన్‌లు (phairiñjanlu)."
      "n2": "రావడం (rāvaḍam), to come, changes its stem: వచ్చాయి (vaccāyi), they came, and వచ్చే (vaccē), which comes, are forms of it."
    "examples":
      "మంటలు ఆర్పడానికి రెండు ఫైరింజన్‌లు వచ్చాయి.":
        "native": "Two fire engines came to put out the flames."
