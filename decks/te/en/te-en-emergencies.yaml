"schema": 1
"id": "te-en-emergencies"
"kind": "layer"
"core": "te-emergencies"
"native": { "code": "en", "iso639_3": "eng", "name": "English" }
"name": "Emergencies: accidents, fire, help and safety"
"description": "Calling for help, accidents, fire, danger, the ambulance and the doctor, and staying safe. Not yet checked by a Telugu speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "te-5801":
    "native": "Call the police!"
    "notes":
      "n1": "Dial 112 for the emergency number in India."
    "bases":
      "పోలీసులకు": "police"
      "ఫోన్": "phone"
      "చేయండి": "to do; to make"
  "te-5802":
    "native": "This is an emergency."
    "notes":
      "n1": "An emergency is అత్యవసరం (atyavasaraṁ). The situation is పరిస్థితి (paristhiti)."
    "bases":
      "ఇది": "this"
      "అత్యవసర": "emergency"
      "పరిస్థితి": "situation"
  "te-5803":
    "native": "situation; condition"
    "notes":
      "n1": "The plural is పరిస్థితులు (paristhitulu)."
    "examples":
      "ఇది చాలా ప్రమాదకరమైన పరిస్థితి.":
        "native": "This is a very dangerous situation."
        "bases":
          "ఇది": { "meaning": "this" }
          "చాలా": { "meaning": "very; a lot" }
          "ప్రమాదకరమైన": { "meaning": "dangerous" }
      "ఈ పరిస్థితిలో ఏం చేయాలో తెలియడం లేదు.":
        "native": "I don't know what to do in this situation."
        "bases":
          "ఈ": { "meaning": "this" }
          "పరిస్థితిలో": { "meaning": "situation" }
          "ఏం": { "meaning": "what" }
          "చేయాలో": { "meaning": "to do" }
          "తెలియడం": { "meaning": "to know" }
    wiktionary: true
  "te-5804":
    "native": "heart attack"
    "notes":
      "n1": "Ends in -ు (-u), but it is an event, not a person, so it is amahat. The plural is గుండెపోట్లు (guṇḍepōṭlu)."
    "examples":
      "ఆయనకు గుండెపోటు వచ్చింది.":
        "native": "He had a heart attack."
        "bases":
          "ఆయనకు": { "meaning": "he; him (polite)" }
          "వచ్చింది": { "meaning": "to come; to happen" }
      "గుండెపోటు వచ్చినప్పుడు వెంటనే అంబులెన్స్ పిలవండి.":
        "native": "When someone has a heart attack, call an ambulance at once."
        "bases":
          "వచ్చినప్పుడు": { "meaning": "to come; to happen" }
          "వెంటనే": { "meaning": "at once" }
          "అంబులెన్స్": { "meaning": "ambulance" }
          "పిలవండి": { "meaning": "to call" }
    wiktionary: true
  "te-5805":
    "native": "bleeding"
    "notes":
      "n1": "Made of రక్తం (raktaṁ), blood, and స్రావం (srāvaṁ), a flow. Its stem is రక్తస్రావ- (raktasrāva-) before endings."
    "examples":
      "గాయం నుంచి రక్తస్రావం అవుతోంది.":
        "native": "The wound is bleeding."
        "bases":
          "గాయం": { "meaning": "wound" }
          "నుంచి": { "meaning": "from" }
          "అవుతోంది": { "meaning": "to become; to happen" }
      "రక్తస్రావం ఆపడానికి ఈ గుడ్డను వాడండి.":
        "native": "Use this cloth to stop the bleeding."
        "bases":
          "ఆపడానికి": { "meaning": "to stop" }
          "ఈ": { "meaning": "this" }
          "గుడ్డను": { "meaning": "cloth" }
          "వాడండి": { "meaning": "to use" }
  "te-5806":
    "native": "I am injured."
    "notes":
      "n1": "గాయం (gāyaṁ), wound or injury. The ending -ఐంది (-aindi) is the past of అవడం (avaḍaṁ), to become."
    "bases":
      "నాకు": "I; me"
      "గాయమైంది": "wound; injury"
  "te-5807":
    "native": "I can't breathe."
    "notes":
      "n1": "Literally, breath is not coming easily. ఊపిరి (ūpiri) is breath."
    "bases":
      "నాకు": "I; me"
      "ఊపిరి": "breath"
      "ఆడటం": "to be possible; to come easily"
  "te-5808":
    "native": "fire accident; a fire"
    "notes":
      "n1": "Made of అగ్ని (agni), fire, and ప్రమాదం (pramādaṁ), accident. Its stem is అగ్నిప్రమాద- (agnipramāda-) before endings."
    "examples":
      "నిన్న రాత్రి ఒక పెద్ద అగ్నిప్రమాదం జరిగింది.":
        "native": "There was a big fire last night."
        "bases":
          "నిన్న": { "meaning": "yesterday" }
          "రాత్రి": { "meaning": "night" }
          "ఒక": { "meaning": "a; one" }
          "పెద్ద": { "meaning": "big" }
          "జరిగింది": { "meaning": "to happen" }
      "అగ్నిప్రమాదం జరిగితే మెట్ల ద్వారా బయటకు వెళ్ళండి.":
        "native": "If there is a fire, go out by the stairs."
        "bases":
          "జరిగితే": { "meaning": "to happen" }
          "మెట్ల": { "meaning": "step; stair" }
          "ద్వారా": { "meaning": "through; by way of" }
          "బయటకు": { "meaning": "outside" }
          "వెళ్ళండి": { "meaning": "to go" }
  "te-5809":
    "native": "danger"
    "notes":
      "n1": "A danger that can hurt you. Its stem is అపాయ- (apāya-) before endings."
    "examples":
      "ఆ కొండ అంచు చాలా అపాయం.":
        "native": "That cliff edge is very dangerous."
        "bases":
          "ఆ": { "meaning": "that" }
          "కొండ": { "meaning": "hill; cliff" }
          "అంచు": { "meaning": "edge" }
          "చాలా": { "meaning": "very; a lot" }
          "అపాయం": { "meaning": "danger" }
      "రాత్రిపూట ఒంటరిగా నడవడం అపాయం.":
        "native": "Walking alone at night is dangerous."
        "bases":
          "రాత్రిపూట": { "meaning": "at night" }
          "ఒంటరిగా": { "meaning": "alone" }
          "నడవడం": { "meaning": "to walk" }
          "అపాయం": { "meaning": "danger" }
  "te-5810":
    "native": "dangerous"
    "notes":
      "n1": "Its adverb is ప్రమాదకరంగా (pramādakaraṅgā), dangerously."
    "examples":
      "ఈ రోడ్డు చాలా ప్రమాదకరంగా ఉంది.":
        "native": "This road is very dangerous."
        "bases":
          "ఈ": { "meaning": "this" }
          "రోడ్డు": { "meaning": "road" }
          "చాలా": { "meaning": "very; a lot" }
          "ప్రమాదకరంగా": { "meaning": "dangerous" }
          "ఉంది": { "meaning": "to be" }
      "పిల్లలకు ప్రమాదకరమైన వస్తువులను దూరంగా ఉంచండి.":
        "native": "Keep dangerous things away from children."
        "bases":
          "పిల్లలకు": { "meaning": "child" }
          "ప్రమాదకరమైన": { "meaning": "dangerous" }
          "వస్తువులను": { "meaning": "thing; object" }
          "దూరంగా": { "meaning": "far; away" }
          "ఉంచండి": { "meaning": "to keep" }
    "bases":
      "ప్రమాదకరమైన": "dangerous; a danger"
  "te-5811":
    "native": "Run away!"
    "notes":
      "n1": "The polite imperative of పారిపోవడం (pāripōvaḍaṁ), to run away."
    "bases":
      "పారిపోండి": "to run away"
  "te-5812":
    "native": "I am trapped."
    "notes":
      "n1": "చిక్కుకుపోవడం (cikkukupōvaḍaṁ), to get stuck or trapped."
    "bases":
      "నేను": "I"
      "చిక్కుకుపోయాను": "to get stuck; to be trapped"
  "te-5813":
    "native": "earthquake"
    "notes":
      "n1": "Its stem is భూకంప- (bhūkampa-) before endings: భూకంపాలు (bhūkampālu), earthquakes."
    "examples":
      "భూకంపం వల్ల చాలా ఇళ్ళు పడిపోయాయి.":
        "native": "Many houses fell down because of the earthquake."
        "bases":
          "వల్ల": { "meaning": "because of" }
          "చాలా": { "meaning": "very; a lot" }
          "ఇళ్ళు": { "meaning": "house" }
          "పడిపోయాయి": { "meaning": "to fall down" }
      "నేను ఎప్పుడూ భూకంపాన్ని చూడలేదు.":
        "native": "I have never been through an earthquake."
        "bases":
          "నేను": { "meaning": "I" }
          "ఎప్పుడూ": { "meaning": "ever; always" }
          "భూకంపాన్ని": { "meaning": "earthquake" }
          "చూడలేదు": { "meaning": "to see; to experience" }
  "te-5814":
    "native": "at once; immediately"
    "notes":
      "n1": "A stronger word than వెంటనే (veṇṭanē), straight away."
    "examples":
      "తక్షణమే అంబులెన్స్ రావాలి.":
        "native": "An ambulance must come at once."
        "bases":
          "అంబులెన్స్": { "meaning": "ambulance" }
          "రావాలి": { "meaning": "to come" }
      "అతను తక్షణమే పరుగెత్తాడు.":
        "native": "He ran at once."
        "bases":
          "అతను": { "meaning": "he" }
          "పరుగెత్తాడు": { "meaning": "to run" }
    "bases":
      "తక్షణమే": "at once; immediately"
  "te-5815":
    "native": "calamity; sudden danger"
    "notes":
      "n1": "A sudden danger or calamity. Its forms add to the whole word: ఆపదలు (āpadalu), ఆపదలో (āpadalō)."
    "examples":
      "ఆపదలో ఉన్నవారికి సహాయం చేయండి.":
        "native": "Help those who are in danger."
        "bases":
          "ఆపదలో": { "meaning": "danger; calamity" }
          "ఉన్నవారికి": { "meaning": "to be" }
          "సహాయం": { "meaning": "help" }
          "చేయండి": { "meaning": "to do" }
      "ఎవరైనా ఆపదలో ఉంటే ఫోన్ చేయండి.":
        "native": "If anyone is in danger, call."
        "bases":
          "ఎవరైనా": { "meaning": "anyone" }
          "ఆపదలో": { "meaning": "danger; calamity" }
          "ఉంటే": { "meaning": "to be" }
          "ఫోన్": { "meaning": "phone" }
          "చేయండి": { "meaning": "to do" }
    synonyms: { "apattu": "calamity, misfortune, adversity", "vipattu": "disaster; calamity" }
    wiktionary: true
  "te-5816":
    "native": "safety; security"
    "notes":
      "n1": "A thing you keep, so amahat. Its forms add to the whole word: భద్రతలో (bhadratalō), in safety."
    "examples":
      "మీ భద్రత కోసం తలుపు మూసి ఉంచండి.":
        "native": "Keep the door shut for your safety."
        "bases":
          "మీ": { "meaning": "you" }
          "కోసం": { "meaning": "for" }
          "తలుపు": { "meaning": "door" }
          "మూసి": { "meaning": "to close; to shut" }
          "ఉంచండి": { "meaning": "to keep" }
      "పిల్లల భద్రత చాలా ముఖ్యం.":
        "native": "The safety of children is very important."
        "bases":
          "పిల్లల": { "meaning": "child" }
          "చాలా": { "meaning": "very; a lot" }
          "ముఖ్యం": { "meaning": "important" }
    wiktionary: true
  "te-5817":
    "native": "safely"
    "notes":
      "n1": "From సురక్షితం (surakṣitaṁ), safe."
    "examples":
      "ప్రయాణికులందరూ సురక్షితంగా ఉన్నారు.":
        "native": "All the passengers are safe."
        "bases":
          "ప్రయాణికులందరూ": { "meaning": "passenger; traveller" }
          "ఉన్నారు": { "meaning": "to be" }
      "మంటలు ఆరిన తర్వాత సురక్షితంగా ఇంట్లోకి వెళ్ళండి.":
        "native": "After the flames have gone out, go back into the house safely."
        "bases":
          "మంటలు": { "meaning": "flame" }
          "ఆరిన": { "meaning": "to go out; to cool" }
          "తర్వాత": { "meaning": "after" }
          "ఇంట్లోకి": { "meaning": "house" }
          "వెళ్ళండి": { "meaning": "to go" }
    "bases":
      "సురక్షితంగా": "safe"
  "te-5818":
    "native": "poison"
    "notes":
      "n1": "Its stem is విష- (viṣa-) before endings: విషంలో (viṣaṁlō), in poison."
    "examples":
      "ఇది విషం, తాగకండి!":
        "native": "This is poison, don't drink it!"
        "bases":
          "ఇది": { "meaning": "this" }
          "తాగకండి": { "meaning": "to drink" }
      "పిల్లలకు విషం అందకుండా చూసుకోండి.":
        "native": "Keep poison away from children."
        "bases":
          "పిల్లలకు": { "meaning": "child" }
          "అందకుండా": { "meaning": "to reach; to be within reach" }
          "చూసుకోండి": { "meaning": "to take care" }
    wiktionary: true
  "te-5821":
    "native": "life"
    "notes":
      "n1": "Its stem is ప్రాణ- (prāṇa-) before endings: ప్రాణాలు (prāṇālu), lives."
    "examples":
      "ఆ ప్రమాదంలో ఆయన ప్రాణం పోయింది.":
        "native": "In that accident he lost his life."
        "bases":
          "ఆ": { "meaning": "that" }
          "ప్రమాదంలో": { "meaning": "accident" }
          "ఆయన": { "meaning": "he; him (polite)" }
          "పోయింది": { "meaning": "to go; to be lost" }
      "అతని ప్రాణాలు కాపాడారు.":
        "native": "They saved his life."
        "bases":
          "అతని": { "meaning": "he; his" }
          "ప్రాణాలు": { "meaning": "life" }
          "కాపాడారు": { "meaning": "to save" }
    wiktionary: true