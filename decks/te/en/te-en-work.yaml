schema: 1
id: "te-en-work"
kind: "layer"
core: "te-work"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Work"
description: "Jobs, the workplace, and how to ask and say what someone does. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0400":
    native: "job (employment)"
    notes:
      "n1": "పని (pani) is work of any kind; ఉద్యోగం (udyōgam) is a job."
    "examples": {
      "ఆమె ఉద్యోగాన్ని పోగొడుతుంది.": {"native": "She loses her job.", "bases": {}},
      "అనుభవం ఉంటే ఉద్యోగం వస్తుంది.": {"native": "If you have experience, you will get the job.", "bases": {}}
    }
  "te-0401":
    native: "office"
    notes:
      "n1": "Formally కార్యాలయం (kāryālayam)."
    "examples": {
      "అతను ఆఫీసులో పని చేస్తాడు.": {"native": "He works in an office.", "bases": {"ఆఫీసులో": "office"}},
      "క్లయింట్ రేపు ఆఫీసుకు వస్తారు.": {"native": "The client is coming to the office tomorrow.", "bases": {"ఆఫీసుకు": "office"}}
    }
  "te-0402":
    native: "teacher"
    notes:
      "n1": "A woman teacher is ఉపాధ్యాయురాలు (upādhyāyurālu). In speech, often టీచర్ (ṭīcar)."
    "examples": {
      "ఉపాధ్యాయుడు పాఠం వివరిస్తాడు.": {"native": "The teacher explains the lesson.", "bases": {}},
      "ఉపాధ్యాయుడు విద్యార్థిని మెచ్చుకుంటాడు.": {"native": "The teacher praises the student.", "bases": {}}
    }
  "te-0403":
    native: "shopkeeper"
    alt_native: ["storekeeper", "shop owner"]
  "te-0404":
    native: "driver"
  "te-0405":
    native: "engineer"
  "te-0406":
    native: "lawyer"
    alt_native: ["attorney"]
    notes:
      "n1": "Formally న్యాయవాది (nyāyavādi)."
  "te-0407":
    native: "nurse"
  "te-0408":
    native: "farmer"
    "examples": {
      "ముఖ్యమంత్రి రైతులతో మాట్లాడారు.": {"native": "The chief minister spoke with the farmers.", "bases": {}},
      "రైతు పొలంలో ఎరువు చల్లుతాడు.": {"native": "The farmer spreads manure on the field.", "bases": {}}
    }
  "te-0409":
    native: "cook"
    notes:
      "n1": "A cook in a home is often వంటమనిషి (vaṇṭamaniṣi)."
  "te-0410":
    native: "writer"
    alt_native: ["author"]
    notes:
      "n1": "A woman writer is రచయిత్రి (racayitri)."
    "examples": {
      "ఈ పాటకు ఆయనే పాటల రచయిత.": {"native": "He is the lyricist of this song.", "bases": {}},
      "ఆ నవల ఒక ప్రసిద్ధ రచయిత రాశారు.": {"native": "A famous writer wrote that novel.", "bases": {}}
    }
  "te-0411":
    native: "journalist; reporter"
  "te-0412":
    native: "student"
    notes:
      "n1": "A woman student is విద్యార్థిని (vidyārthini). నేను విద్యార్థిని (nēnu vidyārthini), from anyone, is 'I'm a student'."
    "examples": {
      "విద్యార్థులు తరగతి గదిలోకి వెళ్తున్నారు.": {"native": "The students are going into the classroom.", "bases": {}},
      "విద్యార్థులు పరీక్షా పత్రాలను సమర్పిస్తారు.": {"native": "The students submit the exam papers.", "bases": {"విద్యార్థులు": "student"}}
    }
  "te-0413":
    native: "day off; holiday; leave"
    alt_native: ["vacation"]
    notes:
      "n1": "ఈరోజు నాకు సెలవు (īrōju nāku selavu), I have the day off today."
    "examples": {
      "వేసవి సెలవుల్లో ఊరికి వెళ్తాను.": {"native": "In the summer holidays I go to the village.", "bases": {}},
      "నా సహోద్యోగి రేపు సెలవులో ఉంటారు.": {"native": "My colleague will be on leave tomorrow.", "bases": {"సెలవులో": "day off; holiday; leave"}}
    }
  "te-0414":
    native: "salary; pay"
    alt_native: ["wages"]
    "examples": {
      "ఏడాదికి ఎంత జీతం?": {"native": "What is the salary per year?", "bases": {}},
      "ఒప్పందంలో జీతం రాసి ఉంది.": {"native": "The salary is written in the contract.", "bases": {}}
    }
  "te-0415":
    native: "business; trade"
  "te-0416":
    native: "What do you do (for a living)?"
    alt_native: ["What is your job?", "What work do you do?"]
    notes:
      "n1": "చేయడం (cēyaḍam) changes its stem in the present and future: చేస్- (cēs-)."
  "te-0417":
    native: "I'm a teacher."
    notes:
      "n1": "With నేను (nēnu) a noun takes -ని (-ni), and no verb is needed."
    bases:
      "టీచర్‌ని": "teacher"
  "te-0418":
    native: "Where do you work?"
    alt_native: ["Where are you employed?"]
    notes:
      "n1": "చేయడం (cēyaḍam) changes its stem in the present and future: చేస్- (cēs-)."
  "te-0419":
    native: "I work in an office."
    alt_native: ["I work at an office"]
    notes:
      "n1": "A man and a woman say the same. In the third person, he has -డు (-ḍu), and she and it share -ది (-di). చేయడం (cēyaḍam) changes its stem in the present and future: చేస్- (cēs-)."
