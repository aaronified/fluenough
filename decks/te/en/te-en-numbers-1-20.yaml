schema: 1
id: "te-en-numbers-1-20"
kind: "layer"
core: "te-numbers-1-20"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Numbers 1–20"
description: "One to twenty, the building blocks of every Telugu number. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0201":
    native: "1, one"
    notes:
      "n1": "Before a noun, one is ఒక (oka): ఒక టీ (oka ṭī), one tea. Telugu has its own digits, ౧ ౨ ౩ (1 2 3), but prices and bus numbers use 1 2 3."
    "examples": {
      "కేవలం ఒక్కటి చాలు.": {"native": "Just one is enough.", "bases": {}}
    }
  "te-0202":
    native: "2, two"
    "examples": {
      "అతను రెండు సెట్లు కొన్నాడు.": {"native": "He bought two sets.", "bases": {}},
      "నాకు రెండు లీటర్లు కావాలి.": {"native": "I need two litres.", "bases": {}}
    }
  "te-0203":
    native: "3, three"
    "examples": {
      "మూడు పుస్తకాలు": {"native": "three books", "bases": {}},
      "మూడు వికెట్లు పడ్డాయి.": {"native": "Three wickets have fallen.", "bases": {}}
    }
  "te-0204":
    native: "4, four"
    "examples": {
      "నాలుగు దిక్కులు ఉన్నాయి.": {"native": "There are four directions.", "bases": {}},
      "ఈ కోడ్ నాలుగు అంకెలు.": {"native": "This code has four digits.", "bases": {}}
    }
  "te-0205":
    native: "5, five"
    "examples": {
      "గేటు నంబర్ ఐదు.": {"native": "Gate number five.", "bases": {}}
    }
  "te-0206":
    native: "6, six"
    "examples": {
      "నేను ఆరు గంటలకు మేల్కొంటాను.": {"native": "I wake up at six o'clock.", "bases": {}},
      "ఆ కేసు ఆరు నెలలుగా నడుస్తోంది.": {"native": "That case has been going on for six months.", "bases": {}}
    }
  "te-0207":
    native: "7, seven"
    "examples": {
      "ఏడు ఖండాలు ఉన్నాయి.": {"native": "There are seven continents.", "bases": {}},
      "అతను రోజూ ఏడు గంటలకు మేల్కొంటాడు.": {"native": "He wakes up at seven every day.", "bases": {}}
    }
  "te-0208":
    native: "8, eight"
    "examples": {
      "ఉదయం షిఫ్ట్ ఎనిమిదికి ఉంటుంది.": {"native": "The morning shift is at eight.", "bases": {}},
      "ఎనిమిది గంటలకు ఇంటికి చేరుతాను.": {"native": "I reach home at eight o'clock.", "bases": {}}
    }
  "te-0209":
    native: "9, nine"
  "te-0210":
    native: "10, ten"
    "examples": {
      "ఇంటర్‌సిటీలో పది గంటల్లో చేరుకుంటాం.": {"native": "We will reach in ten hours by intercity train.", "bases": {}},
      "దాదాపు పది గంటలు అయింది.": {"native": "It is nearly ten o'clock.", "bases": {}}
    }
  "te-0211":
    native: "11, eleven"
    notes:
      "n1": "11 to 19 are built on పది (padi), ten."
    "examples": {
      "నేను రాత్రి పదకొండు గంటలకు పడుకుంటాను.": {"native": "I go to bed at eleven at night.", "bases": {}},
      "చివరి బస్సు రాత్రి పదకొండు గంటలకు వస్తుంది.": {"native": "The last bus comes at eleven at night.", "bases": {}}
    }
  "te-0212":
    native: "12, twelve"
    "examples": {
      "చెక్‌అవుట్ మధ్యాహ్నం పన్నెండు గంటలకు.": {"native": "Checkout is at twelve noon.", "bases": {}}
    }
  "te-0213":
    native: "13, thirteen"
  "te-0214":
    native: "14, fourteen"
  "te-0215":
    native: "15, fifteen"
  "te-0216":
    native: "16, sixteen"
  "te-0217":
    native: "17, seventeen"
  "te-0218":
    native: "18, eighteen"
  "te-0219":
    native: "19, nineteen"
  "te-0220":
    native: "20, twenty"
    "examples": {
      "బ్యాగ్ బరువు ఇరవై కిలోలు.": {"native": "The bag weighs twenty kilos.", "bases": {}}
    }

  "te-6505":
    native: "Numbers one to ten"
    explanation: "The first ten numbers, from okaṭi (one) to padi (ten). The numbers from eleven on are a separate set."
