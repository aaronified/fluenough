schema: 1
id: "te-en-location"
kind: "layer"
core: "te-location"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Where things are"
description: "Words for where something is: above, below, inside, outside, beside, between, opposite and around. They come after the noun. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0798":
    native: "above; on top; upstairs"
    alt_native: ["overhead"]
    wiktionary: true
    notes:
      "n1": "Follows the noun: {1}, on the table. Close to {2}."
    "examples": {
      "నాకు పైన బెర్త్ ఇవ్వండి.": {"native": "Please give me an upper berth.", "bases": {}}
    }
  "te-0799":
    native: "under; below"
    alt_native: ["beneath"]
    wiktionary: true
    notes:
      "n1": "Follows the noun: {1}, under the table."
    "examples": {
      "వంతెన కింద నది ఉంది.": {"native": "There is a river under the bridge.", "bases": {}},
      "ఓవర్‌బ్రిడ్జ్ ఎక్కండి, తర్వాత కిందకి దిగండి.": {"native": "Go up the foot overbridge, then come down.", "bases": {"కిందకి": "under; below"}}
    }
  "te-0800":
    native: "inside"
    alt_native: ["within"]
    wiktionary: true
    notes:
      "n1": "{1} is inside the house; {2} is 'into'."
    "examples": {
      "మీరు లోపలికి రావచ్చు.": {"native": "You may come in.", "bases": {"లోపలికి": "inside"}},
      "దయచేసి నన్ను లోపలికి అనుమతించండి.": {"native": "Please let me in.", "bases": {}}
    }
  "te-0801":
    native: "outside"
    wiktionary: true
    notes:
      "n1": "{1} is outside the house; the opposite of {2}."
    "examples": {
      "పిల్లలు బయట ఆడుకుంటారు.": {"native": "The children play outside.", "bases": {}}
    }
  "te-0802":
    native: "between; middle"
    alt_native: ["in between"]
    wiktionary: true
    notes:
      "n1": "{1} means between two houses."
    "examples": {
      "వాళ్ళిద్దరి మధ్య వాదన జరిగింది.": {"native": "An argument broke out between the two of them.", "bases": {}},
      "ఈ దేవాలయం ఊరి మధ్యలో ఉంది.": {"native": "This temple is in the middle of the town.", "bases": {}}
    }
  "te-0803":
    native: "beside; next to"
    alt_native: ["alongside"]
    notes:
      "n1": "{1} is next to the bank."
    "examples": {
      "ఆంధ్రప్రదేశ్ తెలంగాణ పక్కన ఉంది.": {"native": "Andhra Pradesh is next to Telangana.", "bases": {}},
      "ఆమె విసుగ్గా ఫోన్ పక్కన పెట్టింది.": {"native": "She put the phone aside, fed up.", "bases": {}}
    }
  "te-0804":
    native: "opposite; facing"
    alt_native: ["across from"]
    notes:
      "n1": "It takes -కి (-ki): {1}, opposite the temple."
  "te-0805":
    native: "on; over; about"
    alt_native: ["upon"]
    wiktionary: true
    notes:
      "n1": "Follows the noun: {1}, on the table."
    "examples": {
      "ఒడ్డు మీద కూర్చున్నాను.": {"native": "I sat on the bank.", "bases": {}},
      "బెంచీ మీద కూర్చోండి.": {"native": "Sit on the bench.", "bases": {}}
    }
  "te-0806":
    native: "around"
    alt_native: ["round"]
    wiktionary: true
    notes:
      "n1": "{1} is around the house."
    "examples": {
      "పట్నం చుట్టూ పచ్చదనం పుష్కలంగా ఉంది.": {"native": "There is plenty of greenery around the town.", "bases": {}}
    }
  "te-0807":
    native: "side; towards"
    alt_native: ["toward"]
    wiktionary: true
    notes:
      "n1": "{1} means that way."
    "examples": {
      "ఉత్తరం ఏ వైపు?": {"native": "Which way is north?", "bases": {}},
      "బస్సు పడమర వైపు వెళ్తోంది.": {"native": "The bus is going west.", "bases": {}}
    }
  "te-0808":
    native: "on the far side; beyond"
    alt_native: ["on the other side"]
    wiktionary: true
    notes:
      "n1": "It takes -కి (-ki): {1}, across the river."
