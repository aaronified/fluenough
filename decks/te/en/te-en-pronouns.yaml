schema: 1
id: "te-en-pronouns"
kind: "layer"
core: "te-pronouns"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Pronouns and people words"
description: "I, you, he, she, it and they, this and that, which and whose, each with the respectful forms Telugu keeps for people. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0593":
    native: "I"
    wiktionary: true
    notes:
      "n1": "The verb's ending already says who is acting, so {1} is often left out: {2} alone means 'I eat'."
  "te-0594":
    native: "you (to a friend, a child or someone younger)"
    wiktionary: true
    notes:
      "n1": "For a stranger or an elder, use {1} instead. In writing you may see {2}."
  "te-0595":
    native: "he"
    wiktionary: true
    notes:
      "n1": "Used for a man of your own age or younger, and about a man who is not there. {1} adds respect."
    "examples": {
      "అతను అందగాడు.": {"native": "He is a handsome man.", "bases": {}},
      "అతను వచ్చాడు.": {"native": "He came.", "bases": {"అతను": "he"}}
    }
  "te-0596":
    native: "she"
    wiktionary: true
    notes:
      "n1": "The standard word for 'she'. In speech {1} is common and a little more respectful."
    "examples": {
      "ఆమె అందగత్తె.": {"native": "She is a beautiful woman.", "bases": {}},
      "ఆమె బక్కచిక్కింది.": {"native": "She has become very thin.", "bases": {}}
    }
  "te-0597":
    native: "he (respectful)"
    wiktionary: true
    notes:
      "n1": "A respectful 'he', for an elder, a teacher or a stranger. The verb takes the plural ending: {1}."
    "examples": {
      "ఆయన ఎవరు?": {"native": "Who is he?", "bases": {"ఆయన": "he (respectful)"}},
      "ఆయన ఇప్పటికే వెళ్ళిపోయాడు.": {"native": "He has already left.", "bases": {}}
    }
  "te-0598":
    native: "she (respectful)"
    wiktionary: true
    notes:
      "n1": "Respect shows in the verb too: {1} is more respectful than {2}."
  "te-0599":
    native: "that; it (a thing or an animal)"
    wiktionary: true
    notes:
      "n1": "Telugu has no separate word for 'it': {1} is 'that', and also 'it' for things and animals."
      "pair": "Only the first vowel differs: {1} is that, {2} is this."
    "examples": {
      "అది వచ్చింది.": {"native": "It came.", "bases": {"అది": "that; it (a thing or an animal)"}},
      "అది అతని బలహీనత.": {"native": "That is his weakness.", "bases": {}}
    }
  "te-0600":
    native: "this; it (a thing close by)"
    wiktionary: true
    notes:
      "n1": "{1}? asks 'What is this?'"
      "pair": "Only the first vowel differs: {1} is this, {2} is that."
    "examples": {
      "ఇది ఏమిటి?": {"native": "What is this?", "bases": {"ఇది": "this; it (a thing close by)"}},
      "ఇది తిను.": {"native": "Eat this.", "bases": {"ఇది": "this; it (a thing close by)"}}
    }
  "te-0601":
    native: "they (people)"
    notes:
      "n1": "In writing and in the news, {1} is the usual word."
      "pair": "Only the first vowel differs: {1} is they, over there; {2} is these people, close by."
    "examples": {
      "వాళ్ళు వచ్చారు.": {"native": "They came.", "bases": {"వాళ్ళు": "they (people)"}},
      "వాళ్ళు ఇల్లు కడతారు.": {"native": "They build a house.", "bases": {}}
    }
  "te-0602":
    native: "these people"
    alt_native: ["these folks"]
    notes:
      "n1": "The people close by; {1} is the people over there."
      "pair": "Only the first vowel differs: {1} is these people, {2} is those."
    "examples": {
      "వీళ్ళు మా పిల్లలు.": {"native": "These are our children.", "bases": {}}
    }
  "te-0603":
    native: "they; he or she (formal, respectful)"
    wiktionary: true
    notes:
      "n1": "In writing, {1} is 'they', and it can also be a respectful 'he' or 'she' for one person."
  "te-0604":
    native: "those (things)"
    alt_native: ["those ones"]
    wiktionary: true
    notes:
      "n1": "For things and animals, not people: {1}, those are books."
      "pair": "Only the first vowel differs: {1} is those, {2} is these."
    "examples": {
      "అవి ఎవరి కుర్చీలు?": {"native": "Whose chairs are those?", "bases": {}}
    }
  "te-0605":
    native: "these (things)"
    alt_native: ["these ones"]
    wiktionary: true
    notes:
      "n1": "For things and animals, not people."
      "pair": "Only the first vowel differs: {1} is these, {2} is those."
    "examples": {
      "ఇవి ఒకే పుస్తకాలు.": {"native": "These are the same books.", "bases": {}}
    }
  "te-0606":
    native: "everyone; all of you; all of them"
    alt_native: ["everybody"]
    notes:
      "n1": "Takes the plural verb: {1}, everyone came."
    "examples": {
      "అందరూ క్షేమంగా బయటపడతారు.": {"native": "Everyone comes out safely.", "bases": {}},
      "పెళ్ళికి అందరూ వచ్చారు.": {"native": "Everyone came to the wedding.", "bases": {}}
    }
  "te-0607":
    native: "this (before a noun)"
    wiktionary: true
    notes:
      "n1": "Before a noun, {1} never changes: {2}, this house."
    "examples": {
      "ఈ ఉంగరం వెండిది.": {"native": "This ring is silver.", "bases": {}},
      "ఈ ఎంట్రన్స్ మూసేశారు.": {"native": "They have closed this entrance.", "bases": {}}
    }
  "te-0608":
    native: "that (before a noun)"
    wiktionary: true
    notes:
      "n1": "Before a noun, {1} never changes: {2}, that house."
  "te-0609":
    native: "which (before a noun)"
    wiktionary: true
    notes:
      "n1": "{1}? is 'which house?'. For 'which one' on its own, use {2}."
    "examples": {
      "ఏ ప్లాట్‌ఫామ్?": {"native": "Which platform?", "bases": {}},
      "ఏంటి సంగతి?": {"native": "What's up?", "bases": {"సంగతి": "matter; news"}}
    }
  "te-0610":
    native: "whose"
    notes:
      "n1": "Comes before a noun, as {1} and {2} do: {3}? 'whose house?'"
    "examples": {
      "అది ఎవరి ఇల్లు?": {"native": "Whose house is that?", "bases": {}},
      "ఈ అడవి సంరక్షణ ఎవరి బాధ్యత?": {"native": "Whose responsibility is the conservation of this forest?", "bases": {}}
    }
  "te-0611":
    native: "anyone; someone"
    alt_native: ["anybody", "somebody"]
    notes:
      "n1": "{1}, who, with -ఐనా (-ainā) added: {2}? 'has anyone come?'"
    "examples": {
      "ఈ సీటులో ఎవరైనా ఉన్నారా?": {"native": "Is anyone in this seat?", "bases": {}},
      "ఎవరైనా ఆపదలో ఉంటే ఫోన్ చేయండి.": {"native": "If anyone is in danger, call.", "bases": {}}
    }

  "te-6503":
    native: "I, you, he, she, they: the people words"
    explanation: "Telugu has a word for each person. For he and she there are respectful forms, āyana and āviḍa. They has three forms: vāḷḷu (those people), vīḷḷu (these people) and the respectful vāru. Nuvvu is for a friend, a child or someone younger."
  "te-6504":
    native: "This, that, these and those"
    explanation: "Near and far: idi (this) and adi (that) for one thing, ivi (these) and avi (those) for things. Before a noun, ī (this) and ā (that) come first, and ē (which) asks which."
