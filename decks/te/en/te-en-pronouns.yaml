schema: 1
id: "te-en-pronouns"
kind: "layer"
core: "te-pronouns"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Pronouns and people words"
description: "I, you, he, she, it and they, this and that, which and whose, each with the respectful forms Telugu keeps for people. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC0-1.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0593":
    native: "I"
    wiktionary: true
    notes:
      "n1": "The verb's ending already says who is acting, so {1} is often left out: {2} alone means 'I eat'."
  "te-0594":
    native: "you (to a friend, a child or someone younger)"
    wiktionary: true
    notes:
      "n1": "For a stranger or an elder, use {1} instead. In writing you may see {2}."
  "te-0595":
    native: "he"
    wiktionary: true
    notes:
      "n1": "Used for a man of your own age or younger, and about a man who is not there. {1} adds respect."
  "te-0596":
    native: "she"
    wiktionary: true
    notes:
      "n1": "The standard word for 'she'. In speech {1} is common and a little more respectful."
  "te-0597":
    native: "he (respectful)"
    wiktionary: true
    notes:
      "n1": "A respectful 'he', for an elder, a teacher or a stranger. The verb takes the plural ending: {1}."
  "te-0598":
    native: "she (respectful)"
    wiktionary: true
    notes:
      "n1": "Respect shows in the verb too: {1} is more respectful than {2}."
  "te-0599":
    native: "that; it (a thing or an animal)"
    wiktionary: true
    notes:
      "n1": "Telugu has no separate word for 'it': {1} is 'that', and also 'it' for things and animals."
      "pair": "Only the first vowel differs: {1} is that, {2} is this."
  "te-0600":
    native: "this; it (a thing close by)"
    wiktionary: true
    notes:
      "n1": "{1}? asks 'What is this?'"
      "pair": "Only the first vowel differs: {1} is this, {2} is that."
  "te-0601":
    native: "they (people)"
    notes:
      "n1": "In writing and in the news, {1} is the usual word."
      "pair": "Only the first vowel differs: {1} is they, over there; {2} is these people, close by."
  "te-0602":
    native: "these people"
    notes:
      "n1": "The people close by; {1} is the people over there."
      "pair": "Only the first vowel differs: {1} is these people, {2} is those."
  "te-0603":
    native: "they; he or she (formal, respectful)"
    wiktionary: true
    notes:
      "n1": "In writing, {1} is 'they', and it can also be a respectful 'he' or 'she' for one person."
  "te-0604":
    native: "those (things)"
    wiktionary: true
    notes:
      "n1": "For things and animals, not people: {1}, those are books."
      "pair": "Only the first vowel differs: {1} is those, {2} is these."
  "te-0605":
    native: "these (things)"
    wiktionary: true
    notes:
      "n1": "For things and animals, not people."
      "pair": "Only the first vowel differs: {1} is these, {2} is those."
  "te-0606":
    native: "everyone; all of you; all of them"
    notes:
      "n1": "Takes the plural verb: {1}, everyone came."
  "te-0607":
    native: "this (before a noun)"
    wiktionary: true
    notes:
      "n1": "Before a noun, {1} never changes: {2}, this house."
  "te-0608":
    native: "that (before a noun)"
    wiktionary: true
    notes:
      "n1": "Before a noun, {1} never changes: {2}, that house."
  "te-0609":
    native: "which (before a noun)"
    wiktionary: true
    notes:
      "n1": "{1}? is 'which house?'. For 'which one' on its own, use {2}."
  "te-0610":
    native: "whose"
    notes:
      "n1": "Comes before a noun, as {1} and {2} do: {3}? 'whose house?'"
  "te-0611":
    native: "anyone; someone"
    notes:
      "n1": "{1}, who, with -ఐనా (-ainā) added: {2}? 'has anyone come?'"
