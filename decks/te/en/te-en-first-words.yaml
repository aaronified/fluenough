schema: 1
id: "te-en-first-words"
kind: "layer"
core: "te-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
description: "Greetings, the respect Telugu builds into them, and how to say you are still learning. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0135":
    native: "hello; goodbye"
    notes:
      "n1": "Said with palms pressed together, to anyone. In a family, younger people often greet elders by touching their feet; a visitor is not expected to."
  "te-0136":
    native: "you (respectful); you (plural)"
    notes:
      "n1": "Telugu has two words for 'you': మీరు (mīru) for strangers, elders and anyone you respect, and నువ్వు (nuvvu) for friends, children and the very close. The verb changes with each. A learner is always safe with మీరు (mīru)."
  "te-0137":
    native: "excuse me; hello (politely)"
    notes:
      "n1": "A polite way to get someone's attention."
  "te-0138":
    native: "How are you? (respectful)"
    notes:
      "n1": "Literally 'are you well?'. To a friend: బాగున్నావా? (bagunnava?)."
  "te-0139":
    native: "I'm fine."
    notes:
      "n1": "బాగు (bāgu) is 'good, well'."
  "te-0140":
    native: "thank you"
    notes:
      "n1": "Formal. Many people simply say 'thanks' in English, and among family thanks are often left out."
  "te-0141":
    native: "OK; all right"
  "te-0142":
    native: "goodbye (said by the one leaving)"
    notes:
      "n1": "Literally 'I'll go and come back'. A plain 'I'm going' can sound final."
  "te-0143":
    native: "I don't know Telugu."
    notes:
      "n1": "Literally 'Telugu does not come to me'."
    bases:
      "తెలుగు": "Telugu (the language)"
  "te-0144":
    native: "I'm still learning Telugu."
    bases:
      "తెలుగు": "Telugu (the language)"
  "te-0145":
    native: "Please speak slowly."
    notes:
      "n1": "The ending -అండి (-aṇḍi) makes a polite request: కూర్చోండి (kūrcōṇḍi), please sit."
    bases:
      "నెమ్మదిగా": "slow; calm"
  "te-0146":
    native: "Please say that again."
