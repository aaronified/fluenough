"schema": 1
"id": "te-en-technology"
"kind": "layer"
"core": "te-technology"
"native": { "code": "en", "iso639_3": "eng", "name": "English" }
"name": "Technology: computers, apps and the internet"
"description": "Words for devices and the internet: laptops, keyboards, screens, files, folders, software, updates, downloads, websites, links, accounts, passwords and codes, and the words for search, backup, errors and repairs. Telugu often keeps the English word. Not yet checked by a Telugu speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags": ["beginner", "unreviewed"]
"cards":
  "te-4200":
    "native": "laptop"
    "notes":
      "n1": "Telugu speakers use the English word; say ల్యాప్‌టాప్ (lyāptāp) for the device."
    "examples":
      "నా ల్యాప్‌టాప్ చాలా బరువు.":
        "native": "My laptop is very heavy."
      "ల్యాప్‌టాప్‌లో ఫోటోలు ఉన్నాయి.":
        "native": "There are photos on the laptop."
        "bases":
          "ల్యాప్‌టాప్‌లో": { "meaning": "laptop" }
          "ఫోటోలు": { "meaning": "photo" }
          "ఉన్నాయి": { "meaning": "to be; to exist" }
  "te-4201":
    "native": "keyboard"
    "notes":
      "n1": "The keys on a keyboard are కీలు (kīlu); the whole device is కీబోర్డ్ (kībōrḍ)."
    "examples":
      "కీబోర్డ్ మీద ఒక అక్షరం నొక్కు.":
        "native": "Press one letter on the keyboard."
        "bases":
          "నొక్కు": { "meaning": "to press" }
      "నేను ఒక కీబోర్డ్ కొన్నాను.":
        "native": "I bought a keyboard."
        "bases":
          "కొన్నాను": { "meaning": "to buy" }
  "te-4202":
    "native": "computer mouse"
    "notes":
      "n1": "The animal is ఎలుక (eluka); for the computer device say మౌస్ (mauṣ)."
    "examples":
      "మౌస్ ఎక్కడ పెట్టావు?":
        "native": "Where did you put the mouse?"
        "bases":
          "పెట్టావు": { "meaning": "to put" }
      "ఈ మౌస్ బాగా పని చేస్తుంది.":
        "native": "This mouse works well."
        "bases":
          "చేస్తుంది": { "meaning": "to do; to make" }
  "te-4203":
    "native": "tablet (device)"
    "notes":
      "n1": "The same word also means a medicine tablet, టాబ్లెట్ (ṭābleṭ)."
    "examples":
      "నాకు కొత్త టాబ్లెట్ కావాలి.":
        "native": "I need a new tablet."
        "bases":
          "కావాలి": { "meaning": "to be needed; to want" }
      "ఈ టాబ్లెట్ బ్యాటరీ చాలా బాగుంది.":
        "native": "This tablet's battery is very good."
        "bases":
          "బాగుంది": { "meaning": "to be good" }
  "te-4204":
    "native": "monitor; computer screen"
    "notes":
      "n1": "For a computer screen say మానిటర్ (māniṭar); a phone's screen is స్క్రీన్ (skrīn)."
    "examples":
      "మానిటర్ పెద్దగా ఉంది.":
        "native": "The monitor is big."
        "bases":
          "ఉంది": { "meaning": "to be; to have" }
      "మానిటర్ ఆఫ్ చేయండి.":
        "native": "Switch off the monitor."
        "bases":
          "చేయండి": { "meaning": "to do; to make" }
  "te-4205":
    "native": "wire; cable"
    "notes":
      "n1": "The Telugu word తీగ (tīga) means a thin wire or a vine."
    "examples":
      "వైర్ తెగిపోయింది.":
        "native": "The wire has broken."
        "bases":
          "తెగిపోయింది": { "meaning": "to break off" }
      "ఛార్జర్ వైర్ ఎక్కడ ఉంది?":
        "native": "Where is the charger cable?"
        "bases":
          "ఉంది": { "meaning": "to be; to have" }
  "te-4206":
    "native": "plug (electric)"
    "notes":
      "n1": "A socket on the wall is సాకెట్ (sākeṭ)."
    "examples":
      "ప్లగ్ సాకెట్‌లో పెట్టు.":
        "native": "Put the plug in the socket."
        "bases":
          "సాకెట్‌లో": { "meaning": "socket" }
          "పెట్టు": { "meaning": "to put" }
      "ప్లగ్ వదులుగా ఉంది.":
        "native": "The plug is loose."
        "bases":
          "ఉంది": { "meaning": "to be; to have" }
  "te-4207":
    "native": "memory (of a device)"
    "notes":
      "n1": "For a person's memory say గుర్తు (gurtu); for a device, మెమరీ (memarī) is the usual word."
    "examples":
      "ఫోన్‌లో మెమరీ నిండిపోయింది.":
        "native": "The phone's memory is full."
        "bases":
          "ఫోన్‌లో": { "meaning": "phone" }
          "నిండిపోయింది": { "meaning": "to become full" }
      "ఈ కెమెరాలో మెమరీ చాలా ఉంది.":
        "native": "This camera has a lot of memory."
        "bases":
          "కెమెరాలో": { "meaning": "camera" }
          "ఉంది": { "meaning": "to be; to have" }
  "te-4208":
    "native": "storage space"
    "notes":
      "n1": "Storage is used for files and apps; the phone's own memory is the same space."
    "examples":
      "ఫోన్ స్టోరేజ్ చాలా తక్కువ ఉంది.":
        "native": "The phone's storage is very low."
        "bases":
          "ఉంది": { "meaning": "to be; to have" }
      "ఈ ఫైల్ చాలా స్టోరేజ్ తీసుకుంటుంది.":
        "native": "This file takes up a lot of storage."
        "bases":
          "తీసుకుంటుంది": { "meaning": "to take" }
  "te-4209":
    "native": "software; programs"
    "notes":
      "n1": "For a single program or phone app say ప్రోగ్రామ్ (prōgrām) or యాప్ (yāp)."
    "examples":
      "ఈ సాఫ్ట్‌వేర్ ఉచితం.":
        "native": "This software is free."
      "సాఫ్ట్‌వేర్ అప్‌డేట్ చేశాను.":
        "native": "I updated the software."
        "bases":
          "చేశాను": { "meaning": "to do; to make" }
  "te-4210":
    "native": "program; app on a computer"
    "notes":
      "n1": "On a phone say యాప్ (yāp); on a computer, ప్రోగ్రామ్ (prōgrām)."
    "examples":
      "ఈ ప్రోగ్రామ్ ఎలా పని చేస్తుంది?":
        "native": "How does this program work?"
        "bases":
          "చేస్తుంది": { "meaning": "to do; to make" }
      "నేను ఒక కొత్త ప్రోగ్రామ్ నేర్చుకుంటున్నాను.":
        "native": "I am learning a new program."
        "bases":
          "నేర్చుకుంటున్నాను": { "meaning": "to learn" }
  "te-4211":
    "native": "update (of software)"
    "notes":
      "n1": "The verb is అప్‌డేట్ చేయడం (apḍēṭ cēyaḍaṁ), to update."
    "examples":
      "ఫోన్‌కి కొత్త అప్‌డేట్ వచ్చింది.":
        "native": "A new update has come for the phone."
        "bases":
          "ఫోన్‌కి": { "meaning": "phone" }
          "వచ్చింది": { "meaning": "to come" }
      "అప్‌డేట్ పూర్తయ్యే వరకు ఆగండి.":
        "native": "Wait until the update is finished."
        "bases":
          "పూర్తయ్యే": { "meaning": "to be finished" }
          "ఆగండి": { "meaning": "to wait; to stop" }
  "te-4212":
    "native": "download"
    "notes":
      "n1": "The verb is డౌన్‌లోడ్ చేయడం (ḍaunlōḍ cēyaḍaṁ), to download."
    "examples":
      "ఈ పాట డౌన్‌లోడ్ చేయగలవా?":
        "native": "Can you download this song?"
        "bases":
          "చేయగలవా": { "meaning": "to do; to make" }
      "డౌన్‌లోడ్ చాలా నెమ్మదిగా ఉంది.":
        "native": "The download is very slow."
        "bases":
          "ఉంది": { "meaning": "to be; to have" }
  "te-4213":
    "native": "file"
    "notes":
      "n1": "The plural is ఫైళ్లు (phaiḷḷu). Saving a file is ఫైల్ సేవ్ చేయడం (phail sēv cēyaḍaṁ)."
    "examples":
      "ఫైల్ సేవ్ చేయండి.":
        "native": "Save the file."
        "bases":
          "చేయండి": { "meaning": "to do; to make" }
      "ఆ ఫైల్ నా ఇమెయిల్‌లో ఉంది.":
        "native": "That file is in my email."
        "bases":
          "ఇమెయిల్‌లో": { "meaning": "email" }
          "ఉంది": { "meaning": "to be; to have" }
  "te-4214":
    "native": "folder"
    "notes":
      "n1": "The plural is ఫోల్డర్‌లు (phōlḍarlu). A folder on a computer is also a folder for papers."
    "examples":
      "ఫోటోలన్నీ ఒక ఫోల్డర్‌లో పెట్టాను.":
        "native": "I put all the photos in one folder."
        "bases":
          "ఫోటోలన్నీ": { "meaning": "photo" }
          "ఫోల్డర్‌లో": { "meaning": "folder" }
          "పెట్టాను": { "meaning": "to put" }
      "ఈ ఫోల్డర్ ఖాళీగా ఉంది.":
        "native": "This folder is empty."
        "bases":
          "ఉంది": { "meaning": "to be; to have" }
  "te-4215":
    "native": "copy"
    "notes":
      "n1": "The verb is కాపీ చేయడం (kāpī cēyaḍaṁ), to copy; to paste is పేస్ట్ చేయడం (pēsṭ cēyaḍaṁ)."
    "examples":
      "ఈ ఫైల్ కాపీ నాకు పంపు.":
        "native": "Send me a copy of this file."
        "bases":
          "నాకు": { "meaning": "me" }
          "పంపు": { "meaning": "to send" }
      "కాపీ పేస్ట్ చేయండి.":
        "native": "Copy and paste it."
        "bases":
          "చేయండి": { "meaning": "to do; to make" }
  "te-4216":
    "native": "website"
    "notes":
      "n1": "A single page of a website is పేజీ (pēji)."
    "examples":
      "ఈ వెబ్‌సైట్‌లో టికెట్లు కొనవచ్చు.":
        "native": "You can buy tickets on this website."
        "bases":
          "వెబ్‌సైట్‌లో": { "meaning": "website" }
          "టికెట్లు": { "meaning": "ticket" }
          "కొనవచ్చు": { "meaning": "to buy" }
      "వెబ్‌సైట్ తెరవడం లేదు.":
        "native": "The website is not opening."
  "te-4217":
    "native": "page"
    "notes":
      "n1": "The plural is పేజీలు (pējīlu). A web page is also పేజీ (pēji)."
    "examples":
      "ఈ పేజీలో ఫారం ఉంది.":
        "native": "There is a form on this page."
        "bases":
          "పేజీలో": { "meaning": "page" }
          "ఉంది": { "meaning": "to be; to have" }
      "నేను తర్వాత పేజీకి వెళ్తాను.":
        "native": "I will go to the next page."
        "bases":
          "పేజీకి": { "meaning": "page" }
          "వెళ్తాను": { "meaning": "to go" }
  "te-4218":
    "native": "link"
    "notes":
      "n1": "To click a link say లింక్ మీద క్లిక్ చేయండి (liṅk mīda klik cēyaṇḍi)."
    "examples":
      "ఆ లింక్ నాకు పంపు.":
        "native": "Send me that link."
        "bases":
          "నాకు": { "meaning": "me" }
          "పంపు": { "meaning": "to send" }
      "లింక్ తెరిస్తే ఫోటో కనిపిస్తుంది.":
        "native": "If you open the link, the photo will appear."
        "bases":
          "తెరిస్తే": { "meaning": "to open" }
          "కనిపిస్తుంది": { "meaning": "to appear; to be seen" }
  "te-4219":
    "native": "offline"
    "notes":
      "n1": "The opposite is ఆన్‌లైన్ (ānlain), online."
    "examples":
      "ఈ యాప్ ఆఫ్‌లైన్‌లో కూడా పని చేస్తుంది.":
        "native": "This app also works offline."
        "bases":
          "ఆఫ్‌లైన్‌లో": { "meaning": "offline" }
          "చేస్తుంది": { "meaning": "to do; to make" }
      "ఇప్పుడు నేను ఆఫ్‌లైన్‌లో ఉన్నాను.":
        "native": "I am offline now."
        "bases":
          "ఆఫ్‌లైన్‌లో": { "meaning": "offline" }
          "ఉన్నాను": { "meaning": "to be; to have" }
  "te-4220":
    "native": "digital"
    "notes":
      "n1": "Digital books are పుస్తకాలు (pustakālu) in an electronic form; say డిజిటల్ పుస్తకం (ḍijiṭal pustakaṁ) for one book."
    "examples":
      "ఈ బిల్లు డిజిటల్‌గా పంపారు.":
        "native": "They sent this bill digitally."
        "bases":
          "డిజిటల్‌గా": { "meaning": "digital" }
          "పంపారు": { "meaning": "to send" }
      "నాకు డిజిటల్ పుస్తకాలు ఇష్టం.":
        "native": "I like digital books."
        "bases":
          "పుస్తకాలు": { "meaning": "book" }
  "te-4221":
    "native": "electronic"
    "notes":
      "n1": "Electronic goods are వస్తువులు (vastuvulu), goods or things."
    "examples":
      "ఎలక్ట్రానిక్ వస్తువులు ఖరీదు ఎక్కువ.":
        "native": "Electronic goods are expensive."
        "bases":
          "వస్తువులు": { "meaning": "thing; goods" }
      "ఈ ఎలక్ట్రానిక్ గడియారం పాడైపోయింది.":
        "native": "This electronic clock has broken."
        "bases":
          "పాడైపోయింది": { "meaning": "to be spoilt" }
  "te-4222":
    "native": "technology"
    "notes":
      "n1": "In everyday talk the English word టెక్నాలజీ (teknālajī) is also common."
    "examples":
      "సాంకేతికత చాలా వేగంగా మారుతోంది.":
        "native": "Technology is changing very fast."
        "bases":
          "మారుతోంది": { "meaning": "to change" }
      "ఈ సాంకేతికత ఇప్పుడు అందరికీ అందుబాటులో ఉంది.":
        "native": "This technology is now available to everyone."
        "bases":
          "అందరికీ": { "meaning": "everyone" }
          "అందుబాటులో": { "meaning": "availability" }
          "ఉంది": { "meaning": "to be; to have" }
  "te-4223":
    "native": "data; mobile data"
    "notes":
      "n1": "Mobile data, the internet on a phone, is మొబైల్ డేటా (mobail ḍēṭā)."
    "examples":
      "నా డేటా అయిపోయింది.":
        "native": "My data has run out."
        "bases":
          "అయిపోయింది": { "meaning": "to be over; to run out" }
      "డేటా ఎక్కువ ఖర్చు అవుతుంది.":
        "native": "Data costs a lot."
        "bases":
          "అవుతుంది": { "meaning": "to become" }
  "te-4224":
    "native": "server"
    "notes":
      "n1": "A server is a computer that gives data to other computers."
    "examples":
      "సర్వర్ డౌన్ అయింది.":
        "native": "The server is down."
        "bases":
          "అయింది": { "meaning": "to become" }
      "సర్వర్ ఎప్పుడు బాగవుతుంది?":
        "native": "When will the server be fixed?"
        "bases":
          "బాగవుతుంది": { "meaning": "to become good" }
  "te-4225":
    "native": "account"
    "notes":
      "n1": "A bank account is బ్యాంక్ అకౌంట్ (byāṅk akauṇṭ)."
    "examples":
      "నా అకౌంట్ తెరిచాను.":
        "native": "I opened my account."
        "bases":
          "తెరిచాను": { "meaning": "to open" }
      "అకౌంట్ పాస్‌వర్డ్ మర్చిపోయాను.":
        "native": "I forgot the account password."
        "bases":
          "మర్చిపోయాను": { "meaning": "to forget" }
  "te-4226":
    "native": "username"
    "notes":
      "n1": "The password is పాస్‌వర్డ్ (pāsvārḍ), and the one-time code is ఓటీపీ (ōṭīpī)."
    "examples":
      "మీ యూజర్‌నేమ్ ఏంటి?":
        "native": "What is your username?"
      "యూజర్‌నేమ్ మర్చిపోయాను.":
        "native": "I have forgotten my username."
        "bases":
          "మర్చిపోయాను": { "meaning": "to forget" }
  "te-4227":
    "native": "log in; login"
    "notes":
      "n1": "The verb is లాగిన్ చేయడం (lāgin cēyaḍaṁ), to log in."
    "examples":
      "లాగిన్ అవ్వడానికి ఓటీపీ కావాలి.":
        "native": "You need an OTP to log in."
        "bases":
          "అవ్వడానికి": { "meaning": "to become" }
          "కావాలి": { "meaning": "to be needed; to want" }
