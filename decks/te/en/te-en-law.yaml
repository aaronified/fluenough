schema: 1
id: "te-en-law"
kind: "layer"
core: "te-law"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Law: police, courts and rights"
description: "Police, courts, rights and the words of a case: a complaint, a verdict, a fine, bail. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-6003":
    native: "lawyer"
    wiktionary: true
    notes:
      "n1": "A person, so mahat. The loanword లాయర్ (lāyar) is also common in speech."
    examples:
      "నా న్యాయవాది కేసు గురించి వివరంగా చెప్పారు.":
        native: "My lawyer explained the case in detail."
        bases:
          "వివరంగా": { meaning: "in detail" }
          "చెప్పారు": { meaning: "to say; to tell" }
      "మంచి న్యాయవాదిని పెట్టుకోవాలి.":
        native: "You should hire a good lawyer."
        bases:
          "న్యాయవాదిని": { meaning: "lawyer" }
          "పెట్టుకోవాలి": { meaning: "to hire; to keep" }
  "te-6005":
    native: "crime; offence"
    wiktionary: true
    notes:
      "n1": "The word for the act. For the person who did it, use నేరస్థుడు (nērasthuḍu)."
    examples:
      "ఇది చిన్న నేరం కాదు.":
        native: "This is not a small crime."
      "అతడు నేరం ఒప్పుకోలేదు.":
        native: "He did not admit the crime."
        bases:
          "ఒప్పుకోలేదు": { meaning: "to admit" }
  "te-6006":
    native: "punishment; sentence"
    wiktionary: true
    notes:
      "n1": "The penalty a court gives. It is also used for a punishment at home or at school."
    examples:
      "ఈ నేరానికి కఠిన శిక్ష ఉంటుంది.":
        native: "This crime carries a strict punishment."
        bases:
          "నేరానికి": { meaning: "crime" }
          "ఉంటుంది": { meaning: "to be; to exist" }
      "అతడు శిక్షను తప్పించుకున్నాడు.":
        native: "He escaped the punishment."
        bases:
          "శిక్షను": { meaning: "punishment" }
          "తప్పించుకున్నాడు": { meaning: "to escape; to avoid" }
    senses:
      "punishment": { native: "punishment, sentence" }
  "te-6007":
    native: "prison; jail"
    notes:
      "n1": "The place where a person is held. A prisoner is ఖైదీ (khaidī)."
    examples:
      "అతడు మూడు సంవత్సరాలు జైలులో ఉన్నాడు.":
        native: "He was in prison for three years."
        bases:
          "సంవత్సరాలు": { meaning: "year" }
          "జైలులో": { meaning: "in prison" }
          "ఉన్నాడు": { meaning: "to be; to exist" }
      "జైలు నుంచి విడుదల అయ్యాడు.":
        native: "He was released from prison."
        bases:
          "అయ్యాడు": { meaning: "to become" }
  "te-6008":
    native: "bail"
    notes:
      "n1": "The money or promise that lets an accused person wait outside prison until the trial."
    examples:
      "కోర్టు బెయిల్ మంజూరు చేసింది.":
        native: "The court granted bail."
        bases:
          "చేసింది": { meaning: "to do" }
      "బెయిల్ కోసం డబ్బు కట్టాలి.":
        native: "You must pay money for bail."
        bases:
          "కట్టాలి": { meaning: "to pay" }
  "te-6009":
    native: "witness"
    wiktionary: true
    notes:
      "n1": "A person, so mahat. The plural drops the -i of the base: సాక్షులు (sākṣulu), not సాక్షిలు (sākṣilu)."
    examples:
      "సాక్షి కోర్టులో నిజం చెప్పాలి.":
        native: "A witness must tell the truth in court."
        bases:
          "కోర్టులో": { meaning: "court" }
          "చెప్పాలి": { meaning: "to say; to tell" }
      "ఆ సంఘటనకు ఇద్దరు సాక్షులు ఉన్నారు.":
        native: "There were two witnesses to the incident."
        bases:
          "సాక్షులు": { meaning: "witness" }
          "ఉన్నారు": { meaning: "to be; to exist" }
  "te-6010":
    native: "right (legal or moral)"
    wiktionary: true
    notes:
      "n1": "An entitlement, such as the right to vote. It is the opposite of a duty, which is బాధ్యత (bādhyata)."
    examples:
      "ప్రతి పౌరుడికి ఓటు హక్కు ఉంటుంది.":
        native: "Every citizen has the right to vote."
        bases:
          "పౌరుడికి": { meaning: "citizen" }
          "ఉంటుంది": { meaning: "to be; to exist" }
      "మీకు మాట్లాడే హక్కు ఉంది.":
        native: "You have the right to speak."
        bases:
          "మాట్లాడే": { meaning: "to speak" }
          "ఉంది": { meaning: "to be; to exist" }
  "te-6011":
    native: "case (legal)"
    wiktionary: true
    notes:
      "n1": "A legal matter brought to a court or to the police."
    examples:
      "ఆ కేసు ఆరు నెలలుగా నడుస్తోంది.":
        native: "That case has been going on for six months."
        bases:
          "నెలలుగా": { meaning: "month" }
          "నడుస్తోంది": { meaning: "to go on; to run" }
      "పోలీసులు కొత్త కేసు నమోదు చేశారు.":
        native: "The police registered a new case."
        bases:
          "పోలీసులు": { meaning: "police" }
          "చేశారు": { meaning: "to do" }
  "te-6012":
    native: "verdict; judgement"
    wiktionary: true
    notes:
      "n1": "The decision a court gives at the end of a case."
    examples:
      "తీర్పు వినడానికి అందరూ వచ్చారు.":
        native: "Everyone came to hear the verdict."
        bases:
          "వినడానికి": { meaning: "to hear" }
          "వచ్చారు": { meaning: "to come" }
      "కోర్టు తీర్పు అందరికీ నచ్చలేదు.":
        native: "The court's verdict did not please everyone."
        bases:
          "నచ్చలేదు": { meaning: "to like; to please" }
  "te-6013":
    native: "criminal; offender"
    wiktionary: true
    notes:
      "n1": "A person, so mahat. Before -ని (-ni), the final -u becomes -i: నేరస్థుడిని (nērasthuḍini)."
    examples:
      "పోలీసులు నేరస్థుడిని పట్టుకున్నారు.":
        native: "The police caught the criminal."
        bases:
          "పోలీసులు": { meaning: "police" }
          "నేరస్థుడిని": { meaning: "criminal" }
          "పట్టుకున్నారు": { meaning: "to catch" }
      "అతడు పెద్ద నేరస్థుడు కాదు.":
        native: "He is not a big criminal."
  "te-6014":
    native: "victim"
    wiktionary: true
    notes:
      "n1": "A person, so mahat. It is used for the person harmed by a crime or an accident."
    examples:
      "బాధితుడు పోలీస్ స్టేషన్‌కు వెళ్ళాడు.":
        native: "The victim went to the police station."
        bases:
          "వెళ్ళాడు": { meaning: "to go" }
      "బాధితుడికి న్యాయం జరగాలి.":
        native: "Justice must be done for the victim."
        bases:
          "బాధితుడికి": { meaning: "victim" }
          "జరగాలి": { meaning: "to happen" }
  "te-6015":
    native: "evidence; testimony"
    wiktionary: true
    notes:
      "n1": "Proof used in a case, such as a document, a statement or an object."
    examples:
      "మా దగ్గర బలమైన సాక్ష్యం ఉంది.":
        native: "We have strong evidence."
        bases:
          "ఉంది": { meaning: "to be; to exist" }
      "ఈ సాక్ష్యం సరిపోదు.":
        native: "This evidence is not enough."
        bases:
          "సరిపోదు": { meaning: "to be enough" }
  "te-6016":
    native: "lawsuit; claim"
    wiktionary: true
    notes:
      "n1": "A case one person brings against another in a civil court."
    examples:
      "ఆయన యజమానిపై దావా వేశారు.":
        native: "He filed a lawsuit against the owner."
        bases:
          "యజమానిపై": { meaning: "owner; landlord" }
          "వేశారు": { meaning: "to put; to file" }
      "దావా ఖర్చు చాలా ఎక్కువ.":
        native: "The lawsuit costs a lot."
    senses:
      "lawsuit": { native: "lawsuit" }
      "claim": { native: "claim" }
  "te-6017":
    native: "fine (penalty)"
    wiktionary: true
    notes:
      "n1": "Money paid as a penalty. It is not the bail money."
    examples:
      "ట్రాఫిక్ నియమాలు ఉల్లంఘిస్తే జరిమానా ఉంటుంది.":
        native: "If you break the traffic rules there is a fine."
        bases:
          "నియమాలు": { meaning: "rule" }
          "ఉల్లంఘిస్తే": { meaning: "to break; to violate" }
          "ఉంటుంది": { meaning: "to be; to exist" }
      "అతడు వెయ్యి రూపాయలు జరిమానా కట్టాడు.":
        native: "He paid a fine of a thousand rupees."
        bases:
          "రూపాయలు": { meaning: "rupee" }
          "కట్టాడు": { meaning: "to pay" }
    senses:
      "fine": { native: "fine" }
      "penalty": { native: "penalty" }
  "te-6018":
    native: "arrest"
    notes:
      "n1": "The police taking a person into custody. To arrest is అరెస్టు చేయడం (aresṭu cēyaḍaṁ). In ఇంటికి (iṇṭiki), the base ఇల్లు (illu) changes its stem."
    examples:
      "పోలీసులు అతడిని అరెస్టు చేశారు.":
        native: "The police arrested him."
        bases:
          "పోలీసులు": { meaning: "police" }
          "అతడిని": { meaning: "he; him" }
          "చేశారు": { meaning: "to do" }
      "అరెస్టు వారెంట్ ఇంటికి వచ్చింది.":
        native: "The arrest warrant came to the house."
        bases:
          "ఇంటికి": { meaning: "house" }
          "వచ్చింది": { meaning: "to come" }
  "te-6019":
    native: "violation; breach"
    wiktionary: true
    notes:
      "n1": "The noun. The verb is ఉల్లంఘించడం (ullaṅghiñcaḍaṁ), to break a rule."
    examples:
      "ఇది చట్టం ఉల్లంఘన.":
        native: "This is a violation of the law."
      "మీ హక్కుల ఉల్లంఘన జరిగింది.":
        native: "A violation of your rights happened."
        bases:
          "హక్కుల": { meaning: "right" }
          "జరిగింది": { meaning: "to happen" }
  "te-6020":
    native: "inquiry; trial; hearing"
    wiktionary: true
    notes:
      "n1": "Used for a police inquiry and for a court trial."
    examples:
      "విచారణ రెండు గంటలు సాగింది.":
        native: "The inquiry went on for two hours."
        bases:
          "గంటలు": { meaning: "hour" }
          "సాగింది": { meaning: "to go on" }
      "పోలీసులు విచారణ మొదలుపెట్టారు.":
        native: "The police began the inquiry."
        bases:
          "పోలీసులు": { meaning: "police" }
          "మొదలుపెట్టారు": { meaning: "to begin" }
  "te-6021":
    native: "petition"
    notes:
      "n1": "A written request to a court or an office."
    examples:
      "మేము కోర్టులో పిటిషన్ దాఖలు చేశాము.":
        native: "We filed a petition in court."
        bases:
          "కోర్టులో": { meaning: "court" }
          "చేశాము": { meaning: "to do" }
      "పిటిషన్‌పై నిర్ణయం ఇంకా రాలేదు.":
        native: "No decision on the petition has come yet."
        bases:
          "రాలేదు": { meaning: "to come" }
  "te-6022":
    native: "freedom; liberty"
    wiktionary: true
    notes:
      "n1": "The state of being free to act or speak."
    examples:
      "ప్రతి మనిషికి స్వేచ్ఛ ఉండాలి.":
        native: "Every person should have freedom."
        bases:
          "ఉండాలి": { meaning: "to be; to exist" }
      "పత్రికా స్వేచ్ఛ చాలా ముఖ్యం.":
        native: "Freedom of the press is very important."
  "te-6023":
    native: "equality"
    notes:
      "n1": "The noun. The adjective 'equal' is సమానం (samānaṁ)."
    examples:
      "చట్టం ముందు అందరూ సమానమే.":
        native: "Everyone is equal before the law."
        bases:
          "సమానమే": { meaning: "equal" }
      "స్త్రీ పురుష సమానత్వం ముఖ్యమైన విషయం.":
        native: "Equality between women and men is an important matter."
        bases:
          "ముఖ్యమైన": { meaning: "important" }
  "te-6024":
    native: "proof"
    wiktionary: true
    notes:
      "n1": "Evidence that shows something is true."
    examples:
      "నీ దగ్గర రుజువు ఉందా?":
        native: "Do you have proof?"
        bases:
          "ఉందా": { meaning: "to be; to exist" }
      "ఈ పత్రం ఆయన నిజాయితీకి రుజువు.":
        native: "This document is proof of his honesty."
        bases:
          "నిజాయితీకి": { meaning: "honesty" }
  "te-6025":
    native: "suspect"
    notes:
      "n1": "A person, so mahat. The plural is అనుమానితులు (anumānitulu); with the object ending it is అనుమానితులను (anumānitulanu), where the stem changes before the ending."
    examples:
      "పోలీసులు ముగ్గురు అనుమానితులను ప్రశ్నించారు.":
        native: "The police questioned three suspects."
        bases:
          "పోలీసులు": { meaning: "police" }
          "అనుమానితులను": { meaning: "suspect" }
          "ప్రశ్నించారు": { meaning: "to question" }
      "ఆ అనుమానితుడు పారిపోయాడు.":
        native: "That suspect ran away."
        bases:
          "పారిపోయాడు": { meaning: "to run away" }
  "te-6027":
    native: "prisoner"
    wiktionary: true
    notes:
      "n1": "A person, so mahat. The plural is ఖైదీలు (khaidīlu)."
    examples:
      "ఖైదీ జైలు గదిలో ఒంటరిగా ఉన్నాడు.":
        native: "The prisoner was alone in the prison cell."
        bases:
          "గదిలో": { meaning: "room; cell" }
          "ఒంటరిగా": { meaning: "alone" }
          "ఉన్నాడు": { meaning: "to be; to exist" }
      "ఖైదీలకు ఉదయం ఆహారం ఇస్తారు.":
        native: "Prisoners are given food in the morning."
        bases:
          "ఖైదీలకు": { meaning: "prisoner" }
          "ఇస్తారు": { meaning: "to give" }
