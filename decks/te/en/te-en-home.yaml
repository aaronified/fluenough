schema: 1
id: "te-en-home"
kind: "layer"
core: "te-home"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Home and neighbourhood"
description: "The rooms of a home, what is in them, and the people next door. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0420":
    native: "room"
    notes:
      "n1": "గదిలో (gadilō), in the room."
    "examples": {
      "నేను గది సర్దుతాను.": {"native": "I tidy up the room.", "bases": {}}
    }
  "te-0421":
    native: "kitchen"
    notes:
      "n1": "Also వంటగది (vaṇṭagadi)."
  "te-0422":
    native: "bedroom"
  "te-0423":
    native: "sitting room; hall"
    alt_native: ["living room", "drawing room"]
  "te-0424":
    native: "bathroom"
    alt_native: ["washroom"]
    notes:
      "n1": "Also స్నానాల గది (snānāla gadi)."
    "examples": {
      "బాత్‌రూమ్ ఎక్కడ?": {"native": "Where is the toilet?", "bases": {}}
    }
  "te-0425":
    native: "door"
    "examples": {
      "తలుపు తెరవండి.": {"native": "Please open the door.", "bases": {}}
    }
  "te-0426":
    native: "window"
    "examples": {
      "కిటికీ మూయండి.": {"native": "Please close the window.", "bases": {}},
      "కిటికీ సీటు కావాలి.": {"native": "I want a window seat.", "bases": {}}
    }
  "te-0427":
    native: "stairs"
    alt_native: ["staircase"]
  "te-0428":
    native: "floor; storey"
    alt_native: ["story"]
    "examples": {
      "ఏడో అంతస్తుకి లిఫ్ట్‌లో వెళ్దాం.": {"native": "Let's take the lift to the seventh floor.", "bases": {}},
      "రిసెప్షన్ మూడో అంతస్తులో ఉంది.": {"native": "The reception is on the third floor.", "bases": {}}
    }
  "te-0429":
    native: "key"
    alt_native: ["keys"]
    notes:
      "n1": "Literally 'the lock's ear'. తాళం (tāḷam) alone is the lock."
  "te-0430":
    native: "bed; cot"
  "te-0431":
    native: "chair"
    "examples": {
      "అవి ఎవరి కుర్చీలు?": {"native": "Whose chairs are those?", "bases": {"కుర్చీలు": "chair"}},
      "వరండాలో కుర్చీలు ఉన్నాయి.": {"native": "There are chairs on the verandah.", "bases": {}}
    }
  "te-0432":
    native: "table"
    notes:
      "n1": "Also టేబుల్ (ṭēbul)."
    "examples": {
      "బల్ల కింద": {"native": "under the table", "bases": {}},
      "బల్ల మీద": {"native": "on the table", "bases": {}}
    }
  "te-0433":
    native: "fan"
    "examples": {
      "ఫ్యాన్ ఆఫ్ చేయండి.": {"native": "Switch off the fan.", "bases": {}},
      "దుమ్ము తుడిచి ఫ్యాన్ కూడా శుభ్రం చెయ్యి.": {"native": "Wipe off the dust and clean the fan too.", "bases": {}}
    }
  "te-0434":
    native: "light"
    notes:
      "n1": "లైటు వేయండి (laiṭu vēyaṇḍi), please switch on the light."
    "examples": {
      "నేను లైటు ఆర్పుతాను.": {"native": "I put out the light.", "bases": {}}
    }
  "te-0435":
    native: "the neighbours"
    alt_native: ["the neighbors"]
    notes:
      "n1": "Also పొరుగువాళ్ళు (poruguvāḷḷu), the people next door."
  "te-0436":
    native: "rent"
    notes:
      "n1": "అద్దె ఇల్లు (adde illu), a rented house."
    "examples": {
      "నెలకు ఎంత అద్దె?": {"native": "How much rent per month?", "bases": {}},
      "అద్దెదారు నెల ప్రారంభంలో అద్దె చెల్లించాలి.": {"native": "The tenant must pay the rent at the start of the month.", "bases": {}}
    }
  "te-0437":
    native: "flat; apartment"
  "te-0438":
    native: "street"
    "examples": {
      "మా వీధి చాలా ప్రశాంతంగా ఉంటుంది.": {"native": "Our street is very quiet.", "bases": {"ప్రశాంతంగా": "peaceful; quiet"}}
    }
  "te-0439":
    native: "There's a park in front of the house."
    alt_native: ["There is a park before the house."]
  "te-0440":
    native: "Our street is very quiet."
    alt_native: ["Our street is very calm."]
    bases:
      "ప్రశాంతంగా": "peaceful; quiet"
