    "causative": "to make someone do it (verbal noun)"
rules:
  "te-rule-causative":
    name: "-ించడం (-iñcaḍaṁ): to make someone do it"
    explanation: "{1} is added to a verb's stem to say that someone else does the action: {2} is 'to make (someone) study', and {3} is 'to have (something) done'. Many verbs change their stem, or take another causative, so the table gives each verb's own form. A few verbs have no causative of their own and use a phrase with చేయడం (to do) instead. The rows marked 'unsure' in the deck are not yet checked by a Telugu speaker."
