name: "To make someone do it: -ించడం (-iñcaḍaṁ)"
description: "The causative: a verb's -ించు (-iñcu) form makes someone else do the action, as 'to eat' becomes 'to feed'. Many verbs have their own causative, some use -బెట్టు (-beṭṭu) or -పజేయు (-pajēyu), and a few are said with a phrase. Not yet checked by a Telugu speaker: please report any mistake."
