"schema": 1
"id": "te-en-adverbs"
"kind": "layer"
"core": "te-adverbs"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Adverbs: how often, how well, when"
"description": "Common adverbs and function words: how often (always, often, sometimes, never), how well, when (now, already, then, finally), where, and how much or to what degree. Not yet checked by a Telugu speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "te-1063":
    "native": "well; fine"
    "examples":
      "నేను బాగా తెలుగు మాట్లాడతాను.":
        "native": "I speak Telugu well."
        "bases":
          "తెలుగు":
            "meaning": "Telugu"
          "మాట్లాడతాను":
            "meaning": "to speak; to talk"
      "మీరు ఎలా ఉన్నారు? బాగున్నాను.":
        "native": "How are you? I am fine."
        "bases":
          "ఉన్నారు":
            "meaning": "to be; to have"
    "notes":
      "n1": "After a verb it means 'well': {1}. On its own it answers 'How are you?': {2}."
  "te-1064":
    "native": "nicely; neatly; properly"
    "examples":
      "చక్కగా రాయండి.":
        "native": "Write neatly."
        "bases":
          "రాయండి":
            "meaning": "to write"
      "ఇల్లు చక్కగా ఉంది.":
        "native": "The house is neat and nice."
        "bases":
          "ఉంది":
            "meaning": "to be; to have"
    "notes":
      "n1": "A thing done neatly or nicely: {1}."
  "te-1065":
    "native": "properly; correctly; right"
    "bases":
      "సరిగా":
        "meaning": "right; even; correct"
    "examples":
      "నేను సరిగా చెప్పాను.":
        "native": "I said it correctly."
        "bases":
          "చెప్పాను":
            "meaning": "to say; to tell"
      "ఇది సరిగా లేదు.": "This is not right."
    "notes":
      "n1": "With a verb it means 'correctly': {1}. With a negative it means 'not right': {2}."
  "te-1066":
    "native": "slowly; gently; softly"
    "bases":
      "మెల్లగా":
        "meaning": "soft; gentle"
    "examples":
      "మెల్లగా నడవండి.":
        "native": "Walk slowly."
        "bases":
          "నడవండి":
            "meaning": "to walk"
      "ఆమె తలుపు మెల్లగా మూసింది.":
        "native": "She closed the door gently."
        "bases":
          "మూసింది":
            "meaning": "to close"
    "notes":
      "n1": "Softer than {1} ('slowly'): {2}, speak gently."
  "te-1067":
    "native": "quickly; early; soon"
    "bases":
      "తొందరగా":
        "meaning": "hurry"
    "examples":
      "తొందరగా రండి.":
        "native": "Come quickly."
        "bases":
          "రండి":
            "meaning": "to come"
      "ఈ రోజు తొందరగా లేచాను.":
        "native": "I got up early today."
        "bases":
          "లేచాను":
            "meaning": "to get up"
    "notes":
      "n1": "Also 'early' for a time: {1}, come early."
  "te-1068":
    "native": "late"
    "bases":
      "ఆలస్యంగా":
        "meaning": "delay"
    "examples":
      "ఆలస్యంగా వచ్చాను.":
        "native": "I came late."
        "bases":
          "వచ్చాను":
            "meaning": "to come"
      "రైలు ఆలస్యంగా నడుస్తోంది.":
        "native": "The train is running late."
        "bases":
          "రైలు":
            "meaning": "train"
          "నడుస్తోంది":
            "meaning": "to walk; to run"
    "notes":
      "n1": "{1} is 'late' for a time, as in {2}."
  "te-1069":
    "native": "sometimes"
    "examples":
      "కొన్నిసార్లు నేను ఇంట్లో వండుతాను.":
        "native": "Sometimes I cook at home."
        "bases":
          "వండుతాను":
            "meaning": "to cook"
      "కొన్నిసార్లు వర్షం పడుతుంది.":
        "native": "Sometimes it rains."
        "bases":
          "వర్షం":
            "meaning": "rain"
          "పడుతుంది":
            "meaning": "to fall"
    "notes":
      "n1": "Less often than {1}: {2} is 'sometimes'."
  "te-1070":
    "native": "often; frequently"
    "bases":
      "తరచుగా":
        "meaning": "frequent"
    "examples":
      "అతను తరచుగా ఇక్కడికి వస్తాడు.":
        "native": "He comes here often."
        "bases":
          "వస్తాడు":
            "meaning": "to come"
      "నేను తరచుగా కాఫీ తాగుతాను.":
        "native": "I often drink coffee."
        "bases":
          "తాగుతాను":
            "meaning": "to drink"
    "notes":
      "n1": "{1} is 'often'. With a verb: {2}."
  "te-1071":
    "native": "always"
    "examples":
      "ఆమె ఎల్లప్పుడూ నవ్వుతూ ఉంటుంది.":
        "native": "She is always smiling."
        "bases":
          "నవ్వుతూ":
            "meaning": "to smile; to laugh"
          "ఉంటుంది":
            "meaning": "to stay; to be"
      "మా ఇల్లు ఎల్లప్పుడూ శుభ్రంగా ఉంటుంది.":
        "native": "Our house is always clean."
        "bases":
          "శుభ్రంగా":
            "meaning": "clean"
          "ఉంటుంది":
            "meaning": "to stay; to be"
    "notes":
      "n1": "For 'always' in every sentence, {1}."
  "te-1072":
    "native": "daily; every day; always"
    "examples":
      "నేను నిత్యం వ్యాయామం చేస్తాను.":
        "native": "I exercise every day."
        "bases":
          "వ్యాయామం":
            "meaning": "exercise"
          "చేస్తాను":
            "meaning": "to do; to make"
      "ఆయన నిత్యం పని చేస్తారు.":
        "native": "He works every day."
        "bases":
          "చేస్తారు":
            "meaning": "to do; to make"
    "notes":
      "n1": "Mostly in writing or formal speech, as in {1}, every day."
  "te-1073":
    "native": "forever; ever; for good"
    "bases":
      "ఎప్పటికీ":
        "meaning": "of what time"
    "examples":
      "నేను నిన్ను ఎప్పటికీ మర్చిపోను.":
        "native": "I will never forget you."
        "bases":
          "నిన్ను":
            "meaning": "you (informal)"
          "మర్చిపోను":
            "meaning": "to forget"
      "ఈ జ్ఞాపకం ఎప్పటికీ ఉంటుంది.":
        "native": "This memory will last forever."
        "bases":
          "జ్ఞాపకం":
            "meaning": "memory"
          "ఉంటుంది":
            "meaning": "to stay; to be"
    "notes":
      "n1": "{1} is 'forever'; with a negative verb it means 'never': {2}."
  "te-1074":
    "native": "never again"
    "examples":
      "ఇంకెప్పుడూ ఇలా చేయకండి.":
        "native": "Don't do this again."
        "bases":
          "ఇలా":
            "meaning": "like this; this way"
          "చేయకండి":
            "meaning": "to do; to make"
      "ఆమె ఇంకెప్పుడూ తిరిగి రాలేదు.":
        "native": "She never came back."
        "bases":
          "తిరిగి":
            "meaning": "back; again"
          "రాలేదు":
            "meaning": "to come"
    "notes":
      "n1": "{1}, with a negative verb: {2}."
  "te-1075":
    "native": "sometime; once; some day"
    "bases":
      "ఎప్పుడో":
        "meaning": "when"
    "examples":
      "నేను ఆ సినిమాను ఎప్పుడో చూశాను.":
        "native": "I saw that movie once, a long time ago."
        "bases":
          "సినిమాను":
            "meaning": "movie"
          "చూశాను":
            "meaning": "to see; to watch"
      "మనం ఎప్పుడో కలుద్దాం.":
        "native": "Let's meet some time."
        "bases":
          "కలుద్దాం":
            "meaning": "to meet"
    "notes":
      "n1": "{1} is 'at some time'; with a past verb it means 'once, a long time ago': {2}."
  "te-1076":
    "native": "ever; any time; whenever"
    "bases":
      "ఎప్పుడైనా":
        "meaning": "when"
    "examples":
      "మీరు ఎప్పుడైనా రావచ్చు.":
        "native": "You may come any time."
        "bases":
          "రావచ్చు":
            "meaning": "to come"
      "ఎప్పుడైనా నాకు ఫోన్ చేయండి.":
        "native": "Call me any time."
        "bases":
          "నాకు":
            "meaning": "I; to me"
          "చేయండి":
            "meaning": "to do; to make"
    "notes":
      "n1": "{1} is 'any time' or 'whenever': {2}."
      "n2": "The base {1} loses its last vowel before the ending -ఐనా (-ainā): {2} is {3}."
  "te-1077":
    "native": "already"
    "bases":
      "ఇప్పటికే":
        "meaning": "present; now"
    "examples":
      "నేను ఇప్పటికే తిన్నాను.":
        "native": "I have already eaten."
        "bases":
          "తిన్నాను":
            "meaning": "to eat"
      "ఆయన ఇప్పటికే వెళ్ళిపోయాడు.": "He has already left."
    "notes":
      "n1": "{1} is 'already': {2}, I have already eaten."
  "te-1078":
    "native": "just now; right now"
    "bases":
      "ఇప్పుడే":
        "meaning": "now"
    "examples":
      "నేను ఇప్పుడే వస్తాను.": "I'll be right back."
      "ఇప్పుడే వచ్చాను.":
        "native": "I just came."
        "bases":
          "వచ్చాను":
            "meaning": "to come"
    "notes":
      "n1": "{1} is 'just now' with a past verb and 'right away' with a future one: {2}."
  "te-1079":
    "native": "before; earlier"
    "examples":
      "ఇంతకుముందు ఇక్కడ ఒక పార్కు ఉండేది.":
        "native": "There used to be a park here before."
        "bases":
          "ఉండేది":
            "meaning": "to stay; to be"
      "ఇంతకుముందు చెప్పాను కదా.":
        "native": "I told you earlier, didn't I?"
        "bases":
          "చెప్పాను":
            "meaning": "to say; to tell"
          "కదా":
            "meaning": "isn't it? (a tag question)"
    "notes":
      "n1": "{1} is 'earlier' or 'before', about a time in the past: {2}."
  "te-1080":
    "native": "first; in advance; beforehand"
    "bases":
      "ముందుగా":
        "meaning": "before; front"
    "examples":
      "ముందుగా తినండి.":
        "native": "Eat first."
        "bases":
          "తినండి":
            "meaning": "to eat"
      "దయచేసి ముందుగా చెప్పండి.":
        "native": "Please tell me in advance."
        "bases":
          "చెప్పండి":
            "meaning": "to say; to tell"
    "notes":
      "n1": "{1} is 'first' in a list, or 'in advance': {2}."
  "te-1081":
    "native": "first; at first; at the start"
    "examples":
      "మొదట నీళ్ళు తాగండి.":
        "native": "First drink some water."
        "bases":
          "తాగండి":
            "meaning": "to drink"
      "మొదట నాకు అర్థం కాలేదు.":
        "native": "At first I did not understand."
        "bases":
          "నాకు":
            "meaning": "I; to me"
          "అర్థం":
            "meaning": "meaning; understanding"
          "కాలేదు":
            "meaning": "to become; to be"
    "notes":
      "n1": "{1} starts a sequence, or means 'at first': {2}."
  "te-1082":
    "native": "in the end; finally"
    "bases":
      "చివరికి":
        "meaning": "end"
    "examples":
      "చివరికి వర్షం ఆగింది.":
        "native": "In the end the rain stopped."
        "bases":
          "వర్షం":
            "meaning": "rain"
          "ఆగింది":
            "meaning": "to stop"
      "చివరికి అతను వచ్చాడు.":
        "native": "He finally came."
        "bases":
          "వచ్చాడు":
            "meaning": "to come"
    "notes":
      "n1": "{1} is 'in the end' or 'finally': {2}."
  "te-1083":
    "native": "immediately; at once"
    "examples":
      "వెంటనే రండి.":
        "native": "Come at once."
        "bases":
          "రండి":
            "meaning": "to come"
      "ఆమె వెంటనే సమాధానం చెప్పింది.":
        "native": "She answered immediately."
        "bases":
          "సమాధానం":
            "meaning": "answer"
          "చెప్పింది":
            "meaning": "to say; to tell"
    "notes":
      "n1": "{1} is 'at once': {2}."
  "te-1084":
    "native": "then; at that time"
    "examples":
      "అప్పుడు నేను ఇంట్లో ఉన్నాను.":
        "native": "Then I was at home."
        "bases":
          "ఉన్నాను":
            "meaning": "to be; to have"
      "అప్పుడు ఏం జరిగింది?":
        "native": "What happened then?"
        "bases":
          "ఏం":
            "meaning": "what"
          "జరిగింది":
            "meaning": "to happen"
    "notes":
      "n1": "{1} is 'then', for a time already mentioned: {2}."
  "te-1085":
    "native": "so far; until now"
    "bases":
      "ఇప్పటివరకు":
        "meaning": "present; now"
    "examples":
      "ఇప్పటివరకు ఎవరూ రాలేదు.":
        "native": "No one has come so far."
        "bases":
          "రాలేదు":
            "meaning": "to come"
      "ఇప్పటివరకు బాగానే ఉంది.":
        "native": "So far it's fine."
        "bases":
          "బాగానే":
            "meaning": "well; fine"
          "ఉంది":
            "meaning": "to be; to have"
    "notes":
      "n1": "{1} is 'so far': {2}, so far it is fine."
  "te-1086":
    "native": "per week; weekly"
    "bases":
      "వారానికి":
        "meaning": "week"
    "examples":
      "వారానికి రెండుసార్లు సినిమాకు వెళ్తాను.":
        "native": "I go to the movies twice a week."
        "bases":
          "రెండుసార్లు":
            "meaning": "two"
          "సినిమాకు":
            "meaning": "movie"
          "వెళ్తాను":
            "meaning": "to go"
      "వారానికి ఒకసారి స్నానం చేస్తాడు.":
        "native": "He bathes once a week."
        "bases":
          "ఒకసారి":
            "meaning": "once; one time"
          "స్నానం":
            "meaning": "bath"
          "చేస్తాడు":
            "meaning": "to do; to make"
    "notes":
      "n1": "{1} is 'per week': {2}, twice a week."
      "n2": "The base {1} changes its stem to {2} before the ending -కి (-ki): {3}."
  "te-1087":
    "native": "per month; monthly"
    "bases":
      "నెలకు":
        "meaning": "month"
    "examples":
      "నెలకు ఒకసారి ఇంటికి వెళ్తాను.":
        "native": "I go home once a month."
        "bases":
          "ఒకసారి":
            "meaning": "once; one time"
          "ఇంటికి":
            "meaning": "house; home"
          "వెళ్తాను":
            "meaning": "to go"
      "నెలకు ఎంత అద్దె?": "How much rent per month?"
    "notes":
      "n1": "{1} is 'per month': {2}, once a month."
  "te-1088":
    "native": "per year; yearly"
    "bases":
      "ఏడాదికి":
        "meaning": "year"
    "examples":
      "ఏడాదికి ఒకసారి పండుగ చేసుకుంటాం.":
        "native": "We celebrate the festival once a year."
        "bases":
          "ఒకసారి":
            "meaning": "once; one time"
          "పండుగ":
            "meaning": "festival"
          "చేసుకుంటాం":
            "meaning": "to do for oneself"
      "ఏడాదికి ఎంత జీతం?": "What is the salary per year?"
    "notes":
      "n1": "{1} is 'per year': {2}, once a year."
  "te-1089":
    "native": "per day; a day"
    "bases":
      "రోజుకు":
        "meaning": "day"
    "examples":
      "రోజుకు మూడుసార్లు తింటాను.":
        "native": "I eat three times a day."
        "bases":
          "మూడుసార్లు":
            "meaning": "three"
          "తింటాను":
            "meaning": "to eat"
      "రోజుకు ఎన్ని గంటలు పని?": "How many hours of work a day?"
    "notes":
      "n1": "{1} is 'per day': {2}, three times a day."
  "te-1090":
    "native": "definitely; certainly; exactly"
    "bases":
      "ఖచ్చితంగా":
        "meaning": "certainty"
    "examples":
      "నేను ఖచ్చితంగా వస్తాను.": "I will definitely come."
      "ఇది ఖచ్చితంగా నిజం.":
        "native": "This is definitely true."
        "bases":
          "నిజం":
            "meaning": "truth"
    "notes":
      "n1": "{1} is 'for sure'; as an answer, {2} means 'Yes, definitely'."
  "te-1091":
    "native": "surely; without fail"
    "examples":
      "తప్పకుండా చెప్తాను.":
        "native": "I will surely tell you."
        "bases":
          "చెప్తాను":
            "meaning": "to say; to tell"
