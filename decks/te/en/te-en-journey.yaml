schema: 1
id: "te-en-journey"
kind: "layer"
core: "te-journey"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Journey: trains, tickets and travel"
description: "Trains, ships, planes and the words for tickets, platforms, delays, luggage and the road, with the verbs to book, cancel, show and come back. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-2500":
    native: "train"
    wiktionary: true
    notes:
      "n1": "A train is రైలు; 'by train' is రైలులో (railulō)."
    examples:
      "నేను రైలులో వెళ్తాను.":
        native: "I go by train."
        bases:
          "రైలులో": { meaning: "by train" }
      "రైలు ఇప్పుడే వస్తుంది.":
        native: "The train is coming right now."
    senses:
      "rail": { native: "rail" }
      "railway": { native: "railway train" }
    synonyms: { "syn1": "a steam train" }
  "te-2501":
    native: "platform"
    notes:
      "n1": "'What is the platform number?' is ప్లాట్‌ఫామ్ నంబర్ ఎంత? (plāṭphām nambar enta?)."
    examples:
      "రైలు ప్లాట్‌ఫామ్ నుంచి కదిలింది.":
        native: "The train pulled out of the platform."
        bases:
          "కదిలింది": { meaning: "pulled out; moved" }
      "ప్లాట్‌ఫామ్ మీద చాలా మంది ఉన్నారు.":
        native: "Many people are on the platform."
        bases:
          "ఉన్నారు": { meaning: "are (there)" }
  "te-2502":
    native: "timetable"
    notes:
      "n1": "'Look at the timetable' is టైమ్‌టేబుల్ చూడండి (ṭaimṭēbul cūḍaṇḍi)."
    examples:
      "టైమ్‌టేబుల్ చూడండి.":
        native: "Look at the timetable."
        bases:
          "చూడండి": { meaning: "look (polite)" }
      "రైలు సమయం టైమ్‌టేబుల్‌లో చూశాను.":
        native: "I saw the train time in the timetable."
        bases:
          "టైమ్‌టేబుల్‌లో": { meaning: "in the timetable" }
          "చూశాను": { meaning: "saw" }
  "te-2503":
    native: "journey; trip"
    wiktionary: true
    notes:
      "n1": "'Have a good trip!' is మంచి ప్రయాణం! (manci prayāṇaṁ!). For the verb 'to travel', see ప్రయాణం చేయడం."
    examples:
      "ప్రయాణం చాలా పొడవుగా ఉంది.":
        native: "The journey is very long."
        bases:
          "పొడవుగా": { meaning: "long" }
          "ఉంది": { meaning: "is" }
      "ప్రయాణంలో నేను పుస్తకం చదివాను.":
        native: "On the journey I read a book."
        bases:
          "ప్రయాణంలో": { meaning: "on the journey" }
          "చదివాను": { meaning: "read" }
  "te-2504":
    native: "passenger; traveller"
    wiktionary: true
    notes:
      "n1": "A woman traveller is ప్రయాణికురాలు (prayāṇikurālu). Both are for people, so both are mahat."
    examples:
      "ప్రయాణికులు రైలు ఎక్కుతున్నారు.":
        native: "The passengers are boarding the train."
        bases:
          "ప్రయాణికులు": { meaning: "passengers" }
      "ఆ ప్రయాణికుడు టికెట్ చూపించాడు.":
        native: "That passenger showed the ticket."
  "te-2505":
    native: "passport"
    notes:
      "n1": "'Show your passport' is పాస్‌పోర్ట్ చూపించండి (pāspōrṭ cūpiñcaṇḍi)."
    examples:
      "మీ పాస్‌పోర్ట్ ఇవ్వండి.":
        native: "Please give your passport."
        bases:
          "ఇవ్వండి": { meaning: "give (polite)" }
      "నా బ్యాగ్‌లో పాస్‌పోర్ట్ పెట్టాను.":
        native: "I put the passport in my bag."
        bases:
          "బ్యాగ్‌లో": { meaning: "in the bag" }
          "పెట్టాను": { meaning: "put" }
  "te-2506":
    native: "bag"
    notes:
      "n1": "A hand bag is చేతి బ్యాగ్ (cēti byāg)."
    examples:
      "నా బ్యాగ్ ఎక్కడ ఉంది?":
        native: "Where is my bag?"
        bases:
          "ఉంది": { meaning: "is (there)" }
      "నా బ్యాగ్ ఎక్కడ పెట్టాను?":
        native: "Where did I put my bag?"
        bases:
          "పెట్టాను": { meaning: "put" }
  "te-2507":
    native: "ship"
    wiktionary: true
    notes:
      "n1": "'Journey by sea' is ఓడ ప్రయాణం (ōḍa prayāṇaṁ)."
    examples:
      "మేము ఓడలో వెళ్తాము.":
        native: "We go by ship."
        bases:
          "ఓడలో": { meaning: "by ship" }
      "ఓడ ఎప్పుడు బయలుదేరుతుంది?":
        native: "When does the ship leave?"
  "te-2508":
    native: "boat"
    wiktionary: true
    notes:
      "n1": "'Boat journey' is పడవ ప్రయాణం (paḍava prayāṇaṁ)."
    examples:
      "ఆ పడవ చాలా చిన్నది.":
        native: "That boat is very small."
        bases:
          "చిన్నది": { meaning: "small" }
      "మేము పడవలో నది దాటాము.":
        native: "We crossed the river by boat."
        bases:
          "పడవలో": { meaning: "by boat" }
          "దాటాము": { meaning: "crossed" }
    synonyms: { "botu": "boat" }
  "te-2509":
    native: "aeroplane"
    wiktionary: true
    notes:
      "n1": "'Get on the plane' is విమానం ఎక్కండి (vimānaṁ ekkaṇḍi)."
    examples:
      "విమానం రేపు బయలుదేరుతుంది.":
        native: "The plane leaves tomorrow."
      "విమానాశ్రయంలో విమానం ఎక్కాను.":
        native: "I boarded the plane at the airport."
  "te-2510":
    native: "reservation; booking"
    notes:
      "n1": "'Make a reservation' is రిజర్వేషన్ చేయండి (rijarvēṣan cēyaṇḍi)."
    examples:
      "ఈ రైలులో రిజర్వేషన్ దొరికిందా?":
        native: "Did you get a reservation on this train?"
        bases:
          "రైలులో": { meaning: "on this train" }
          "దొరికిందా": { meaning: "did (you) get it?" }
      "రిజర్వేషన్ ఎప్పుడు చేయాలి?":
        native: "When should I make a reservation?"
        bases:
          "చేయాలి": { meaning: "should do" }
  "te-2511":
    native: "map"
    notes:
      "n1": "'Look at the map' is మ్యాప్ చూడండి (myāp cūḍaṇḍi)."
    examples:
      "ఈ మ్యాప్‌లో స్టేషన్ ఎక్కడ?":
        native: "Where is the station on this map?"
        bases:
          "మ్యాప్‌లో": { meaning: "on the map" }
      "నాకు ఒక మ్యాప్ కావాలి.":
        native: "I need a map."
        bases:
          "కావాలి": { meaning: "is needed; want" }
  "te-2512":
    native: "petrol; fuel"
    notes:
      "n1": "'Petrol pump' is పెట్రోల్ బంకు (peṭrōl baṅku)."
    examples:
      "పెట్రోల్ అయిపోయింది!":
        native: "The petrol has run out!"
        bases:
          "అయిపోయింది": { meaning: "has run out" }
      "పెట్రోల్ బంకు ఎక్కడ ఉంది?":
        native: "Where is the petrol pump?"
        bases:
          "ఉంది": { meaning: "is (there)" }
  "te-2513":
    native: "exit"
    notes:
      "n1": "For a train's departure, use బయలుదేరడం. నిష్క్రమణ is the way out of a building or station."
    examples:
      "నిష్క్రమణ ఎటు ఉంది?":
        native: "Which way is the exit?"
        bases:
          "ఉంది": { meaning: "is (there)" }
      "ఈ తలుపు నిష్క్రమణ కాదు.":
        native: "This door is not the exit."
        bases:
          "తలుపు": { meaning: "door" }
          "కాదు": { meaning: "is not" }
  "te-2514":
    native: "metro"
    notes:
      "n1": "'Metro station' is మెట్రో స్టేషన్ (meṭrō sṭēṣan)."
    examples:
      "మెట్రో త్వరగా వెళ్తుంది.":
        native: "The metro goes quickly."
      "మెట్రో ఎక్కడ ఆగుతుంది?":
        native: "Where does the metro stop?"
  "te-2515":
    native: "conductor"
    notes:
      "n1": "A conductor is a person, so the word is mahat (men and people)."
    examples:
      "కండక్టర్ టికెట్ ఇచ్చాడు.":
        native: "The conductor gave the ticket."
        bases:
          "ఇచ్చాడు": { meaning: "gave" }
      "కండక్టర్‌ని ఒక ప్రశ్న అడిగాను.":
        native: "I asked the conductor a question."
        bases:
          "కండక్టర్‌ని": { meaning: "the conductor" }
          "అడిగాను": { meaning: "asked" }
  "te-2516":
    native: "coach; carriage"
    notes:
      "n1": "'Coach number' is బోగీ నంబర్ (bōgī nambar)."
    examples:
      "ఈ బోగీలో ఖాళీ సీట్లు లేవు.":
        native: "There are no empty seats in this coach."
        bases:
          "బోగీలో": { meaning: "in this coach" }
          "సీట్లు": { meaning: "seats" }
          "లేవు": { meaning: "there are none" }
      "రైలు బోగీలు చాలా పొడవుగా ఉన్నాయి.":
        native: "The train coaches are very long."
        bases:
          "బోగీలు": { meaning: "coaches" }
          "పొడవుగా": { meaning: "long" }
          "ఉన్నాయి": { meaning: "are" }
  "te-2517":
    native: "berth (sleeping bed on a train)"
    notes:
      "n1": "'Lower berth' is లోయర్ బెర్త్ (lōyar bert)."
    examples:
      "నాకు పైన బెర్త్ ఇవ్వండి.":
        native: "Please give me an upper berth."
        bases:
          "ఇవ్వండి": { meaning: "give (polite)" }
      "రాత్రి బెర్త్‌లో పడుకున్నాను.":
        native: "At night I slept in the berth."
        bases:
          "బెర్త్‌లో": { meaning: "in the berth" }
          "పడుకున్నాను": { meaning: "slept" }
  "te-2518":
    native: "destination"
    notes:
      "n1": "'To the destination' is గమ్యానికి (gamyāniki). 'I reached the destination' is గమ్యం చేరాము (gamyaṁ cērāmu)."
    examples:
      "మా గమ్యం హైదరాబాద్.":
        native: "Our destination is Hyderabad."
      "గమ్యానికి ఎంత సేపు పడుతుంది?":
        native: "How long does it take to reach the destination?"
        bases:
          "గమ్యానికి": { meaning: "to the destination" }
  "te-2519":
    native: "route; way"
    wiktionary: true
    notes:
      "n1": "'This route' is ఈ మార్గం (ī mārgaṁ)."
    examples:
      "ఈ మార్గంలో బస్సులు వెళ్తాయి.":
        native: "Buses go on this route."
        bases:
          "మార్గంలో": { meaning: "on the route" }
      "ఈ మార్గం నాకు తెలియదు.":
        native: "I do not know this route."
        bases:
          "తెలియదు": { meaning: "do not know" }
  "te-2520":
    native: "tunnel"
    notes:
      "n1": "'Inside the tunnel' is సొరంగం లోపల (sorangaṁ lōpala)."
    examples:
      "రైలు సొరంగంలోకి వెళ్ళింది.":
        native: "The train went into the tunnel."
        bases:
          "సొరంగంలోకి": { meaning: "into the tunnel" }
      "సొరంగం చీకటిగా ఉంది.":
        native: "The tunnel is dark."
        bases:
          "చీకటిగా": { meaning: "dark" }
          "ఉంది": { meaning: "is" }
  "te-2521":
    native: "road; highway"
    wiktionary: true
    notes:
      "n1": "'National highway' is జాతీయ రహదారి (jātīya rahadāri)."
    examples:
      "ఈ రహదారి హైదరాబాద్‌కి వెళ్తుందా?":
        native: "Does this road go to Hyderabad?"
        bases:
          "హైదరాబాద్‌కి": { meaning: "to Hyderabad" }
      "ఈ రహదారిపై వాహనాలు వేగంగా వెళ్తాయి.":
        native: "Vehicles go fast on this road."
        bases:
          "రహదారిపై": { meaning: "on this road" }
          "వాహనాలు": { meaning: "vehicles" }
    synonyms: { "dari": "a way, road, path", "trova": "a path, way, road", "bata": "a road, way", "roddu": "road" }
    senses:
      "road": { native: "road, roadway" }
      "highway": { native: "highway" }
  "te-2522":
    native: "traffic"
    notes:
      "n1": "'Traffic jam' is ట్రాఫిక్ జామ్ (ṭrāphik jām)."
    examples:
      "ట్రాఫిక్ వల్ల బస్సు ఆలస్యమైంది.":
        native: "The bus was late because of the traffic."
        bases:
          "ఆలస్యమైంది": { meaning: "was late" }
      "ట్రాఫిక్‌లో ఆలస్యం అయింది.":
        native: "There was a delay because of the traffic."
        bases:
          "ట్రాఫిక్‌లో": { meaning: "in the traffic" }
          "అయింది": { meaning: "became; happened" }
  "te-2523":
    native: "signal"
    notes:
      "n1": "'Red signal' is ఎరుపు సిగ్నల్ (erupu signal)."
    examples:
      "సిగ్నల్ ఎరుపు రంగులో ఉంది.":
        native: "The signal is red."
        bases:
          "రంగులో": { meaning: "in colour" }
          "ఉంది": { meaning: "is" }
      "సిగ్నల్ పచ్చగా మారింది.":
        native: "The signal turned green."
        bases:
          "పచ్చగా": { meaning: "green" }
          "మారింది": { meaning: "turned; changed" }
  "te-2524":
    native: "check-in"
    notes:
      "n1": "'Check in' is చెక్‌ఇన్ చేయండి (cekin cēyaṇḍi)."
    examples:
      "చెక్‌ఇన్ ఎప్పుడు మొదలవుతుంది?":
        native: "When does check-in start?"
        bases:
          "మొదలవుతుంది": { meaning: "starts" }
      "చెక్‌ఇన్ కౌంటర్ ఎక్కడ ఉంది?":
        native: "Where is the check-in counter?"
        bases:
          "ఉంది": { meaning: "is (there)" }
  "te-2525":
    native: "delay"
    wiktionary: true
    notes:
      "n1": "'Sorry for the delay' is ఆలస్యానికి క్షమించండి (ālasyāniki kṣamiñcaṇḍi)."
    examples:
      "ఎందుకు ఈ ఆలస్యం?":
        native: "Why this delay?"
      "ఆలస్యానికి క్షమించండి.":
        native: "Sorry for the delay."
        bases:
          "ఆలస్యానికి": { meaning: "for the delay" }
          "క్షమించండి": { meaning: "forgive (polite)" }
  "te-2526":
    native: "wallet; purse"
    notes:
      "n1": "'My purse' is నా పర్సు (nā parsu)."
    examples:
      "పర్సు పోయింది!":
        native: "My purse is lost!"
        bases:
          "పోయింది": { meaning: "is lost" }
      "పర్సులో డబ్బులు ఉన్నాయి.":
        native: "There is money in the purse."
        bases:
          "పర్సులో": { meaning: "in the purse" }
          "ఉన్నాయి": { meaning: "are (there)" }
  "te-2527":
    native: "gate"
    wiktionary: true
    notes:
      "n1": "'Gate number' is గేటు నంబర్ (gēṭu nambar)."
    examples:
      "గేటు నంబర్ ఐదు.":
        native: "Gate number five."
      "గేటు ఎప్పుడు తెరుస్తారు?":
        native: "When do they open the gate?"
        bases:
          "తెరుస్తారు": { meaning: "open (they)" }
  "te-2528":
    native: "bus stop"
    notes:
      "n1": "'The next bus stop' is తర్వాతి బస్ స్టాప్ (tarvāti bas sṭāp)."
    examples:
      "ఇది బస్ స్టాప్ కాదు.":
        native: "This is not the bus stop."
        bases:
          "కాదు": { meaning: "is not" }
      "బస్ స్టాప్ దగ్గర ఆగండి.":
        native: "Stop near the bus stop."
  "te-2529":
    native: "crowd; rush"
    notes:
      "n1": "'Rush hour' is రద్దీ సమయం (raddī samayaṁ)."
    examples:
      "ఉదయం రద్దీ ఎలా ఉంటుంది?":
        native: "What is the morning crowd like?"
        bases:
          "ఉంటుంది": { meaning: "is (like)" }
      "రద్దీ తగ్గింది.":
        native: "The crowd has reduced."
        bases:
          "తగ్గింది": { meaning: "reduced" }
  "te-2530":
    native: "counter; ticket window"
    notes:
      "n1": "'Ticket counter' is టికెట్ కౌంటర్ (ṭikeṭ kauṇṭar)."
    examples:
      "టికెట్ కౌంటర్ ఎక్కడ?":
        native: "Where is the ticket counter?"
      "కౌంటర్ మూసేశారు.":
        native: "They have closed the counter."
        bases:
          "మూసేశారు": { meaning: "closed" }
  "te-2531":
    native: "queue; line"
    notes:
      "n1": "'Stand in the queue' is క్యూలో నిలబడండి (kyūlō nilabaṇḍi)."
    examples:
      "క్యూలో నిలబడండి.":
        native: "Stand in the queue."
        bases:
          "క్యూలో": { meaning: "in the queue" }
          "నిలబడండి": { meaning: "stand (polite)" }
      "క్యూ కదులుతోంది.":
        native: "The queue is moving."
        bases:
          "కదులుతోంది": { meaning: "is moving" }
  "te-2532":
    native: "porter"
    wiktionary: true
    notes:
      "n1": "A porter is a person, so the word is mahat (men and people)."
    synonyms: { "syn1": "a labourer (a man)", "syn2": "a hired worker" }
    examples:
      "కూలీ బ్యాగ్ మోశాడు.":
        native: "The porter carried the bag."
        bases:
          "మోశాడు": { meaning: "carried" }
      "కూలీ ఎంత తీసుకుంటాడు?":
        native: "How much does the porter charge?"
        bases:
          "తీసుకుంటాడు": { meaning: "takes" }
  "te-2533":
    native: "engine"
    notes:
      "n1": "'Engine driver' is ఇంజిన్ డ్రైవర్ (iñjin ḍraivar)."
    examples:
      "ఇంజిన్ పెద్ద శబ్దం చేసింది.":
        native: "The engine made a loud noise."
        bases:
          "చేసింది": { meaning: "made" }
      "ఇంజిన్ ఆగిపోయింది.":
        native: "The engine has stopped."
        bases:
          "ఆగిపోయింది": { meaning: "has stopped" }
  "te-2534":
    native: "return journey"
    notes:
      "n1": "'When is the return journey?' is తిరుగు ప్రయాణం ఎప్పుడు? (tirugu prayāṇaṁ eppuḍu?)."
    examples:
      "మేము ఆదివారం తిరుగు ప్రయాణం అవుతాము.":
        native: "We will be making the return journey on Sunday."
        bases:
          "అవుతాము": { meaning: "will be" }
      "తిరుగు ప్రయాణంలో వర్షం పడింది.":
        native: "It rained on the return journey."
        bases:
          "తిరుగు ప్రయాణంలో": { meaning: "on the return journey" }
  "te-2535":
    native: "to book"
    notes:
      "n1": "Use it for tickets and rooms: 'I booked' is బుక్ చేశాను (buk cēśānu)."
    examples:
      "నేను టికెట్ బుక్ చేశాను.":
        native: "I booked a ticket."
      "హోటల్ గది బుక్ చేయండి.":
        native: "Book a hotel room."
  "te-2537":
    native: "to come back; to return"
    notes:
      "n1": "'Come back' is తిరిగి రావడం. 'The train goes back' is తిరిగి వెళ్తుంది."
    examples:
      "నేను రేపు తిరిగి వస్తాను.":
        native: "I will come back tomorrow."
      "రైలు ఎప్పుడు తిరిగి వెళ్తుంది?":
        native: "When does the train go back?"
  "te-2538":
    native: "to cancel"
    notes:
      "n1": "'Cancel' with a ticket is టికెట్ రద్దు చేయండి (ṭikeṭ raddu cēyaṇḍi)."
    examples:
      "రైలు రద్దు చేశారు.":
        native: "They cancelled the train."
      "నా టికెట్ రద్దు చేయాలి.":
        native: "I have to cancel my ticket."
        bases:
          "చేయాలి": { meaning: "must do" }
  "te-2539":
    native: "quickly; early"
    wiktionary: true
    notes:
      "n1": "'Come quickly' is త్వరగా రండి (tvaragā raṇḍi)."
    examples:
      "త్వరగా రండి.":
        native: "Come quickly."
      "మేము త్వరగా బయలుదేరాము.":
        native: "We left early."
  "te-2540":
    native: "late"
    notes:
      "n1": "'Came late' is ఆలస్యంగా వచ్చాను (ālasyaṅgā vaccānu)."
    examples:
      "రైలు ఆలస్యంగా వస్తోంది.":
        native: "The train is coming late."
      "మీరు ఆలస్యంగా వచ్చారు.":
        native: "You came late."
  "te-2541":
    native: "near"
    notes:
      "n1": "'Near here' is ఇక్కడ సమీపంలో (ikkaḍa samīpanlō)."
    examples:
      "బస్టాండ్ సమీపంలో హోటల్ ఉంది.":
        native: "There is a hotel near the bus stand."
        bases:
          "ఉంది": { meaning: "is (there)" }
      "ఇల్లు స్టేషన్ సమీపంలో ఉంది.":
        native: "The house is near the station."
        bases:
          "ఉంది": { meaning: "is (there)" }
  "te-2543":
    native: "Give me one ticket."
    notes:
      "n1": "Used at a ticket counter. For more than one, say రెండు టికెట్లు ఇవ్వండి (reṇḍu ṭikeṭlu ivvaṇḍi)."
    bases:
      "ఇవ్వండి": "give (polite)"
  "te-2544":
    native: "Which platform?"
    notes:
      "n1": "Ask this at a station, and listen for the number in the answer."
  "te-2545":
    native: "When does the train come?"
    notes:
      "n1": "Use the question in the same way for buses, with బస్సు in place of రైలు."
  "te-2546":
    native: "Where does this train go?"
    notes:
      "n1": "Ask this before boarding to check the destination."
  "te-2547":
    native: "Please show your ticket."
    notes:
      "n1": "Polite form of the command. Use it when a conductor or guard asks."
    bases:
      "చూపించండి": "show (polite)"
  "te-2548":
    native: "The train is coming late."
    notes:
      "n1": "A useful line to say when the timetable is out of date."
  "te-2549":
    native: "Is this seat free?"
    notes:
      "n1": "Ask before you sit down. 'Free' is ఖాళీ (khāḷī)."
    bases:
      "ఉందా": "is (there)?"
  "te-2550":
    native: "How long does the train stop?"
    notes:
      "n1": "బండి is a common word for a vehicle, here the train."
    bases:
      "సేపు": "a length of time"
  "te-2551":
    native: "Does this bus go to Hyderabad?"
    notes:
      "n1": "Check the bus before you get on."
  "te-2552":
    native: "I cannot find my purse."
    notes:
      "n1": "Literally 'my purse is not visible'. కనిపించడం means 'to be seen'."
    bases:
      "కనిపించడం": "to be seen; to be visible"
  "te-2553":
    native: "weight"
    wiktionary: true
    notes:
      "n1": "'How heavy?' is ఎంత బరువు? (enta baruvu?)."
    examples:
      "సామాను బరువు ఎంత?":
        native: "How heavy is the luggage?"
      "బ్యాగ్ బరువు ఇరవై కిలోలు.":
        native: "The bag weighs twenty kilos."
    senses:
      "weight": { native: "weight, heaviness" }
      "load": { native: "a load or burden" }
      "responsibility": { native: "responsibility, obligatory duty" }
  "te-2554":
    native: "return ticket"
    notes:
      "n1": "'I need a return ticket' is నాకు తిరుగు టికెట్ కావాలి (nāku tirugu ṭikeṭ kāvāli)."
    examples:
      "నాకు తిరుగు టికెట్ కావాలి.":
        native: "I need a return ticket."
        bases:
          "కావాలి": { meaning: "is needed; want" }
      "తిరుగు టికెట్ ఎంత?":
        native: "How much is the return ticket?"
  "te-2555":
    native: "footover-bridge"
    notes:
      "n1": "A bridge over the tracks or the road. The older word is వంతెన (vantena)."
    examples:
      "ఓవర్‌బ్రిడ్జ్ మీదుగా వెళ్ళండి.":
        native: "Go across the footover-bridge."
      "ఓవర్‌బ్రిడ్జ్ ఎక్కండి, తర్వాత కిందకి దిగండి.":
        native: "Climb the footover-bridge, then come back down."
  "te-2556":
    native: "track; line"
    notes:
      "n1": "A railway track. Stay away from the track: లైన్ దాటకండి (lain dāṭakaṇḍi)."
    examples:
      "లైన్ దాటకండి.":
        native: "Do not cross the track."
        bases:
          "దాటకండి": { meaning: "do not cross (polite)" }
      "రైలు లైన్ పక్కన ఆడుకోకండి.":
        native: "Do not play next to the railway line."
        bases:
          "ఆడుకోకండి": { meaning: "do not play (polite)" }
  "te-2557":
    native: "travel time"
    notes:
      "n1": "'How long is the journey?' is ప్రయాణ సమయం ఎంత? (prayāṇa samayaṁ enta?)."
    examples:
      "ప్రయాణ సమయం రెండు గంటలు.":
        native: "The travel time is two hours."
      "ప్రయాణ సమయం తగ్గింది.":
        native: "The travel time has gone down."
        bases:
          "తగ్గింది": { meaning: "reduced; went down" }
  "te-2558":
    native: "extra fare"
    notes:
      "n1": "'Is there an extra fare?' is అదనపు చార్జీ ఉందా? (adanapu cārjī undā?)."
    examples:
      "ఈ టికెట్‌కి అదనపు చార్జీ చెల్లించాలా?":
        native: "Must I pay an extra fare for this ticket?"
        bases:
          "చెల్లించాలా": { meaning: "must I pay?" }
      "అదనపు చార్జీ ఎందుకు?":
        native: "Why the extra fare?"
