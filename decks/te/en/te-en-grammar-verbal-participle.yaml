schema: 1
id: "te-en-grammar-verbal-participle"
kind: "layer"
core: "te-grammar-verbal-participle"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Having done, without doing: -ి and -కుండా"
description: "A verb's -ి form chains two actions: having done the first, then the next. -కుండా (-kuṇḍā) means without doing. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "having": "having done it, then the next action"
    "without": "without doing it"
rules:
  "te-rule-verbal-participle":
    name: "-ి (-i): having done"
    explanation: "{1} joins a verb's past stem and says that one action is done before the next: {2} means 'having eaten, I went home', and {3} means 'having asked, find out'. Only the last verb of the chain takes the tense or command ending."
  "te-rule-verbal-participle-without":
    name: "-కుండా (-kuṇḍā): without doing"
    explanation: "{1} joins the verb's negative stem: {2} is 'without eating', {3} is 'without doing' and {4} is 'without coming'. {5} means 'he went out without eating anything'."
