id: "te-en-work-sentences"
kind: "layer"
core: "te-work-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Work: sentences"
description: "Eight sentences about jobs and work, with the words of the work unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-7026":
    notes:
      "n1": "ఆఫీసులో (āphīsulō), in the office, takes the 'in' form; పని (pani) with చేస్తుంది (cēstundi) is a light verb, the noun plus చేయడం (cēyaḍaṁ), to do, which makes the verb to work."
    native: "She works in an office."
    confusables:
      "c1": { why: "ఉపాధ్యాయుడు (upādhyāyuḍu) 'teacher', names a job, not the place of work." }
      "c2": { why: "వ్యాపారం (vyāpāraṁ) 'business', names trade, not a place." }
  "te-7027":
    notes:
      "n1": "నాన్నకు (nānnaku), to Dad, marks the person who has something, the same 'to' form as నాకు (nāku) in the grammar deck's pattern for having."
    native: "Dad has a job."
    confusables:
      "c1": { why: "సెలవు (selavu) 'day off', is leave from work, not a job." }
      "c2": { why: "జీతం (jītaṁ) 'salary', is the pay for a job, not the job." }
  "te-7028":
    notes:
      "n1": "ఆ (ā), that, goes before the noun it points to, and చదువుతాడు (caduvutāḍu) is the 'he' form of చదవడం (cadavaḍaṁ), to read."
    native: "That student studies."
    confusables:
      "c1": { why: "ఉపాధ్యాయుడు (upādhyāyuḍu) 'teacher', is the one who teaches, not the one who studies." }
      "c2": { why: "రచయిత (racayita) 'writer', is the one who writes books." }
  "te-7029":
    notes:
      "n1": "ఉద్యోగం (udyōgaṁ) and చేస్తావు (cēstāvu) go together: the noun plus చేయడం (cēyaḍaṁ), to do, makes the phrase for doing a job, and ఈ (ī), this, goes before the noun."
    native: "Why do you do this job?"
    confusables:
      "c1": { why: "ఎప్పుడు (eppuḍu) 'when', asks for a time." }
      "c2": { why: "ఎక్కడ (ekkaḍa) 'where', asks for a place." }
  "te-7030":
    notes:
      "n1": "కాదు (kādu), not, comes after the noun it negates, as in రైతు (raitu) కాదు (kādu), and no separate word for is appears."
    native: "Mum is not a farmer."
    confusables:
      "c1": { why: "అవును (avunu) 'yes', agrees; it does not deny." }
      "c2": { why: "లేదు (lēdu) 'there isn't', is used for things that are not there, not for a job." }
  "te-7031":
    notes:
      "n1": "అన్నకు (annaku), to the elder brother, marks him as the one who has the salary, as నాన్నకు (nānnaku) does for having a job; ఎంత (enta), how much, comes after the noun."
    native: "How much is the elder brother's salary?"
    confusables:
      "c1": { why: "ఎప్పుడు (eppuḍu) 'when', asks for a time, not an amount." }
      "c2": { why: "ఎందుకు (enduku) 'why', asks for a reason." }
  "te-7032":
    notes:
      "n1": "సమయానికి (samayāniki), on time, is సమయం (samayaṁ), time, with the 'to' form, and వస్తాడు (vastāḍu) is the 'he' form of రావడం (rāvaḍaṁ), to come."
    native: "The driver comes on time."
    confusables:
      "c1": { why: "ఇంజనీర్ (iñjanīr) 'engineer', is a job, not a driver." }
      "c2": { why: "ఆఫీసు (āphīsu) 'office', is a place, not a time." }
  "te-7033":
    notes:
      "n1": "సెలవు (selavu), leave, comes before the verb తీసుకుంటాను (tīsukuṇṭānu), the 'I' form of తీసుకోవడం (tīsukōvaḍaṁ), to take, in this set phrase."
    native: "I take a day off."
    confusables:
      "c1": { why: "ఉద్యోగం (udyōgaṁ) 'job', is the work itself, not a day off." }
      "c2": { why: "జీతం (jītaṁ) 'salary', is pay, not leave." }
