schema: 1
id: "te-en-work-sentences"
kind: "layer"
core: "te-work-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Work: sentences"
description: "Eight sentences about jobs and work, with the words of the work unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-7026":
    native: "She works in an office."
    confusables:
      "c1": { why: "ఉపాధ్యాయుడు (upādhyāyuḍu) 'teacher', names a job, not the place of work." }
      "c2": { why: "వ్యాపారం (vyāpāraṁ) 'business', names trade, not a place." }
  "te-7027":
    native: "Dad has a job."
    confusables:
      "c1": { why: "సెలవు (selavu) 'day off', is leave from work, not a job." }
      "c2": { why: "జీతం (jītaṁ) 'salary', is the pay for a job, not the job." }
  "te-7028":
    native: "That student studies."
    confusables:
      "c1": { why: "ఉపాధ్యాయుడు (upādhyāyuḍu) 'teacher', is the one who teaches, not the one who studies." }
      "c2": { why: "రచయిత (racayita) 'writer', is the one who writes books." }
  "te-7029":
    native: "Why do you do this job?"
    confusables:
      "c1": { why: "ఎప్పుడు (eppuḍu) 'when', asks for a time." }
      "c2": { why: "ఎక్కడ (ekkaḍa) 'where', asks for a place." }
  "te-7030":
    native: "Mum is not a farmer."
    confusables:
      "c1": { why: "అవును (avunu) 'yes', agrees; it does not deny." }
      "c2": { why: "లేదు (lēdu) 'there isn't', is used for things that are not there, not for a job." }
  "te-7031":
    native: "How much is the elder brother's salary?"
    confusables:
      "c1": { why: "ఎప్పుడు (eppuḍu) 'when', asks for a time, not an amount." }
      "c2": { why: "ఎందుకు (enduku) 'why', asks for a reason." }
  "te-7032":
    native: "The driver comes on time."
    confusables:
      "c1": { why: "ఇంజనీర్ (iñjanīr) 'engineer', is a job, not a driver." }
      "c2": { why: "ఆఫీసు (āfīsu) 'office', is a place, not a time." }
  "te-7033":
    native: "I take a day off."
    confusables:
      "c1": { why: "ఉద్యోగం (udyōgaṁ) 'job', is the work itself, not a day off." }
      "c2": { why: "జీతం (jītaṁ) 'salary', is pay, not leave." }
