"schema": 1
"id": "te-en-travel"
"kind": "layer"
"core": "te-travel"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Travel: hotels, bookings and trips"
"description": "Words for planning and making a trip: hotel bookings, checking out, luggage, parking, visas, budgets, tips and insurance. Not yet checked by a Telugu speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "te-3800":
    "native": "booking (a reservation)"
    "examples":
      "నేను హోటల్ బుకింగ్ చేశాను.":
        "native": "I booked a hotel."
        "bases":
          "చేశాను":
            "meaning": "to do"
      "బుకింగ్ నిర్ధారణ ఇంకా రాలేదు.":
        "native": "The booking confirmation has not come yet."
        "bases":
          "రాలేదు":
            "meaning": "to come"
    "notes":
      "n1": "{1} is a hotel booking. The word itself is a loan from English."
  "te-3801":
    "native": "checkout (leaving a hotel)"
    "examples":
      "చెక్‌అవుట్ మధ్యాహ్నం పన్నెండు గంటలకు.":
        "native": "Checkout is at twelve noon."
        "bases":
          "గంటలకు":
            "meaning": "at (the) hour"
      "మేము రేపు ఉదయం చెక్‌అవుట్ చేస్తాము.":
        "native": "We check out tomorrow morning."
        "bases":
          "చేస్తాము":
            "meaning": "to do"
    "notes":
      "n1": "{1} is the time you leave a hotel. It is a loan word from English."
  "te-3802":
    "native": "suitcase"
    "examples":
      "నా సూట్‌కేస్ చాలా బరువుగా ఉంది.":
        "native": "My suitcase is very heavy."
        "bases":
          "బరువుగా":
            "meaning": "heavy"
          "ఉంది":
            "meaning": "to be"
      "నా సూట్‌కేస్ ఎక్కడ?":
        "native": "Where is my suitcase?"
    "notes":
      "n1": "{1} is a suitcase. {2} is a bag, for smaller things."
  "te-3803":
    "native": "trip; tour (a formal word)"
    "examples":
      "మా పర్యటన వచ్చే వారం మొదలవుతుంది.":
        "native": "Our trip starts next week."
        "bases":
          "వచ్చే":
            "meaning": "to come (next)"
          "మొదలవుతుంది":
            "meaning": "to start"
      "ఈ పర్యటనలో మేము మూడు నగరాలు చూస్తాము.":
        "native": "On this trip we will see three cities."
        "bases":
          "పర్యటనలో":
            "meaning": "trip"
          "నగరాలు":
            "meaning": "city"
          "చూస్తాము":
            "meaning": "to see"
    "notes":
      "n1": "{1} is a trip or tour, in a formal way. {2} is a journey, for everyday use."
  "te-3804":
    "native": "holidays; time off"
    "examples":
      "పిల్లలకు వచ్చే నెలలో సెలవులు ఇస్తారు.":
        "native": "They will give the children holidays next month."
        "bases":
          "పిల్లలకు":
            "meaning": "to the children"
          "వచ్చే":
            "meaning": "to come (next)"
          "ఇస్తారు":
            "meaning": "to give"
      "ఈ సెలవులలో మేము ఊరికి వెళ్తాము.":
        "native": "During these holidays we go to our hometown."
        "bases":
          "సెలవులలో":
            "meaning": "holidays"
          "ఊరికి":
            "meaning": "to the town"
          "వెళ్తాము":
            "meaning": "to go"
    "notes":
      "n1": "{1} is one day off or one leave. {2} is the plural: holidays."
    wiktionary: true
  "te-3805":
    "native": "visa"
    "examples":
      "వీసా ఇంకా రాలేదు.":
        "native": "The visa has not come yet."
        "bases":
          "రాలేదు":
            "meaning": "to come"
      "వీసా కోసం ఫోటో ఇవ్వాలి.":
        "native": "For the visa, you must give a photo."
        "bases":
          "ఇవ్వాలి":
            "meaning": "to give"
    "notes":
      "n1": "{1} is a visa form."
    wiktionary: true
  "te-3806":
    "native": "parking"
    "examples":
      "హోటల్ దగ్గర పార్కింగ్ ఉంది.":
        "native": "There is parking near the hotel."
        "bases":
          "ఉంది":
            "meaning": "to be"
      "కారు పార్కింగ్‌లో పెట్టాను.":
        "native": "I parked the car in the parking lot."
        "bases":
          "పార్కింగ్‌లో":
            "meaning": "parking"
          "పెట్టాను":
            "meaning": "to put"
    "notes":
      "n1": "{1} is a parking space."
  "te-3807":
    "native": "museum"
    "examples":
      "మ్యూజియం సోమవారం మూసి ఉంటుంది.":
        "native": "The museum is closed on Mondays."
        "bases":
          "మూసి":
            "meaning": "closed"
          "ఉంటుంది":
            "meaning": "to be"
      "మేము పాత మ్యూజియానికి వెళ్ళాము.":
        "native": "We went to the old museum."
        "bases":
          "మ్యూజియానికి":
            "meaning": "to the museum"
          "వెళ్ళాము":
            "meaning": "to go"
    "notes":
      "n1": "{1} is a museum. The word is a loan from English."
  "te-3808":
    "native": "tip (extra money for a service)"
    "examples":
      "వెయిటర్‌కు టిప్ ఇచ్చాను.":
        "native": "I gave the waiter a tip."
        "bases":
          "ఇచ్చాను":
            "meaning": "to give"
      "టిప్ ఎంత ఇవ్వాలి?":
        "native": "How much tip should I give?"
        "bases":
          "ఇవ్వాలి":
            "meaning": "to give"
    "notes":
      "n1": "{1} is the extra money you give for good service."
  "te-3809":
    "native": "budget"
    "examples":
      "మా బడ్జెట్ తక్కువ.":
        "native": "Our budget is low."
      "బడ్జెట్‌లో ఉండే హోటల్ కావాలి.":
        "native": "We want a hotel that fits our budget."
        "bases":
          "బడ్జెట్‌లో":
            "meaning": "in the budget"
          "ఉండే":
            "meaning": "to be (that is)"
    "notes":
      "n1": "{1} is a budget hotel: one that costs little."
  "te-3810":
    "native": "breakfast"
    "examples":
      "హోటల్ అల్పాహారం ఉదయం ఏడు గంటలకు మొదలవుతుంది.":
        "native": "Hotel breakfast starts at seven in the morning."
        "bases":
          "గంటలకు":
            "meaning": "at (the) hour"
          "మొదలవుతుంది":
            "meaning": "to start"
      "అల్పాహారం చేశారా?":
        "native": "Have you had breakfast?"
        "bases":
          "చేశారా":
            "meaning": "to do"
    "notes":
      "n1": "{1} is breakfast. {2} is a main meal, such as lunch or dinner."
  "te-3812":
    "native": "plan (what you intend to do)"
    "examples":
      "మా ప్రణాళిక మారింది.":
        "native": "Our plan has changed."
        "bases":
          "మారింది":
            "meaning": "to change"
      "ఈ ప్రణాళిక ఎవరు తయారు చేశారు?":
        "native": "Who made this plan?"
        "bases":
          "చేశారు":
            "meaning": "to do"
    "notes":
      "n1": "{1} is a travel plan: what you intend to do on a trip."
  "te-3813":
    "native": "schedule (timetable)"
    "examples":
      "రైలు షెడ్యూల్ ఎక్కడ చూడాలి?":
        "native": "Where should I look at the train timetable?"
        "bases":
          "చూడాలి":
            "meaning": "to see"
      "షెడ్యూల్ ప్రకారం మేము ఎనిమిది గంటలకు బయలుదేరుతాము.":
        "native": "According to the schedule, we leave at eight o'clock."
        "bases":
          "గంటలకు":
            "meaning": "at (the) hour"
          "బయలుదేరుతాము":
            "meaning": "to leave"
    "notes":
      "n1": "{1} is the timetable of a trip, such as the times of trains."
  "te-3814":
    "native": "air conditioner"
    "examples":
      "గదిలో ఎయిర్ కండిషనర్ పని చేయడం లేదు.":
        "native": "The air conditioner in the room is not working."
        "bases":
          "గదిలో":
            "meaning": "in the room"
          "చేయడం":
            "meaning": "to do"
      "ఎయిర్ కండిషనర్ చాలా చల్లగా ఉంది.":
        "native": "The air conditioner is very cold."
        "bases":
          "చల్లగా":
            "meaning": "cold"
          "ఉంది":
            "meaning": "to be"
    "notes":
      "n1": "{1} is an air conditioner. {2} is a fan, a cheaper way to cool a room."
  "te-3815":
    "native": "place; spot"
    "examples":
      "ఈ స్థలం చాలా అందంగా ఉంది.":
        "native": "This place is very beautiful."
        "bases":
          "అందంగా":
            "meaning": "beautiful"
          "ఉంది":
            "meaning": "to be"
      "మేము కొత్త స్థలానికి వెళ్తున్నాము.":
        "native": "We are going to a new place."
        "bases":
          "స్థలానికి":
            "meaning": "to the place"
          "వెళ్తున్నాము":
            "meaning": "to go"
    "notes":
      "n1": "{1} and {2} both mean a place. {2} is used more for a spot or a site."
    wiktionary: true
  "te-3816":
    "native": "stay (a time spent in a place, such as a hotel)"
    "examples":
      "మా బస రెండు రాత్రులు.":
        "native": "Our stay is two nights."
        "bases":
          "రాత్రులు":
            "meaning": "nights"
      "బసకు ఎంత ఖర్చు అవుతుంది?":
        "native": "How much does the stay cost?"
        "bases":
          "బసకు":
            "meaning": "for the stay"
          "అవుతుంది":
            "meaning": "to become (to cost)"
    "notes":
      "n1": "{1} is a stay: to be in a place for a time, such as a hotel."
  "te-3817":
    "native": "a foreign country; abroad"
    "examples":
      "అతను ఏడాది విదేశంలో ఉన్నాడు.":
        "native": "He was abroad for a year."
        "bases":
          "విదేశంలో":
            "meaning": "abroad"
          "ఉన్నాడు":
            "meaning": "to be"
      "మేము విదేశాలకు వెళ్లాలని అనుకుంటున్నాము.":
        "native": "We are thinking of going abroad."
        "bases":
          "విదేశాలకు":
            "meaning": "abroad"
          "వెళ్లాలని":
            "meaning": "to go"
          "అనుకుంటున్నాము":
            "meaning": "to think"
    "notes":
      "n1": "{1} is the adjective: foreign, from another country."
  "te-3818":
    "native": "comfort; facility"
    "examples":
      "ఈ హోటల్‌లో అన్ని సౌకర్యాలు ఉన్నాయి.":
        "native": "This hotel has all the facilities."
        "bases":
          "సౌకర్యాలు":
            "meaning": "facilities"
          "ఉన్నాయి":
            "meaning": "to be"
      "రైలులో సౌకర్యం బాగుంది.":
        "native": "The comfort on the train is good."
        "bases":
          "బాగుంది":
            "meaning": "good"
    "notes":
      "n1": "{1} is a comfort or a facility, in the plural form."
    wiktionary: true
  "te-3819":
    "native": "offer; deal"
    "examples":
      "ఈ వారం హోటల్‌లో ప్రత్యేక ఆఫర్ ఉంది.":
        "native": "There is a special offer at the hotel this week."
        "bases":
          "హోటల్‌లో":
            "meaning": "at the hotel"
          "ఉంది":
            "meaning": "to be"
      "ఆఫర్ ఎంత కాలం ఉంటుంది?":
        "native": "How long does the offer last?"
        "bases":
          "ఉంటుంది":
            "meaning": "to be"
    "notes":
      "n1": "{1} is a special offer, such as a lower price for a short time."
  "te-3820":
    "native": "excursion; leisure trip"
    "examples":
      "వేసవిలో మేము కొండ ప్రాంతానికి విహారయాత్రకు వెళ్తాము.":
        "native": "In summer we go on a leisure trip to the hills."
        "bases":
          "వేసవిలో":
            "meaning": "in summer"
          "ప్రాంతానికి":
            "meaning": "to the area"
          "విహారయాత్రకు":
            "meaning": "for the excursion"
          "వెళ్తాము":
            "meaning": "to go"
      "ఈ విహారయాత్ర చాలా సరదాగా ఉంది.":
        "native": "This trip is a lot of fun."
        "bases":
          "సరదాగా":
            "meaning": "fun"
          "ఉంది":
            "meaning": "to be"
    "notes":
      "n1": "{1} is leisure or pleasure, and {2} is a journey. Together they mean a leisure trip."
  "te-3821":
    "native": "journey; pilgrimage"
    "examples":
      "మేము తిరుపతికి యాత్రకు వెళ్లాము.":
        "native": "We went to Tirupati on a pilgrimage."
        "bases":
          "తిరుపతికి":
            "meaning": "to Tirupati"
          "యాత్రకు":
            "meaning": "for the pilgrimage"
          "వెళ్లాము":
            "meaning": "to go"
      "యాత్ర ఎంత దూరం?":
        "native": "How far is the journey?"
        "bases":
          "దూరం":
            "meaning": "distance"
    "notes":
      "n1": "{1} is a pilgrimage: a journey to a holy place."
    wiktionary: true
  "te-3822":
    "native": "vehicle"
    "examples":
      "ఈ వాహనంలో ఏడుగురు కూర్చోవచ్చు.":
        "native": "Seven people can sit in this vehicle."
        "bases":
          "వాహనంలో":
            "meaning": "in the vehicle"
          "కూర్చోవచ్చు":
            "meaning": "to sit"
      "మా వాహనం రేపు ఉదయం వస్తుంది.":
        "native": "Our vehicle will come tomorrow morning."
        "bases":
          "వస్తుంది":
            "meaning": "to come"
    "notes":
      "n1": "{1} is a vehicle. {2} is a car, one kind of vehicle."
    wiktionary: true
  "te-3823":
    "native": "travel insurance"
    "examples":
      "ప్రయాణ బీమా తీసుకున్నారా?":
        "native": "Did you take travel insurance?"
        "bases":
          "తీసుకున్నారా":
            "meaning": "to take"
      "ఈ బీమాలో ఆసుపత్రి ఖర్చు కూడా ఉంది.":
        "native": "This insurance also covers hospital costs."
        "bases":
          "బీమాలో":
            "meaning": "in the insurance"
          "ఉంది":
            "meaning": "to be"
    "notes":
      "n1": "{1} is travel (a journey). {2} is insurance. Together they mean travel insurance."
