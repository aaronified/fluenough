id: "te-en-registers"
kind: "layer"
core: "te-registers"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bookish Telugu and spoken Telugu"
description: "For centuries Telugu was written in a bookish style, గ్రాంథికం (grānthikam), far from the spoken వ్యావహారికం (vyāvahārikam). Gidugu Ramamurthy and Gurajada Apparao fought for writing as people speak, and today almost all writing does. Older books, the reading deck among them, are full of the bookish forms: here they are beside today's, with the formal words still seen on signs. Recognition only. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["reading", "unreviewed"]
cards:
  "te-0352":
    notes:
      "n1": "On paper and in speeches. In speech Telugu joins with -ఊ (-ū) (నేనూ నువ్వూ (nēnū nuvvū), you and I) or simply lists."
  "te-0140":
    notes:
      "n1": "Formal. Between friends, often థాంక్స్ (thāṅks)."
  "te-0534":
    native: "book; today పుస్తకం (pustakam)"
    notes:
      "n1": "The bookish ending -ము (-mu) is -ం (am) today: గడియారము (gaḍiyāramu), గడియారం (gaḍiyāram), clock."
  "te-0535":
    native: "did; today చేశాడు (cēśāḍu), చేసింది (cēsindi)"
    notes:
      "n1": "The bookish past ends in -ఎను (-enu) for he, she and it alike."
  "te-0536":
    native: "came; today వచ్చాడు (vaccāḍu), వచ్చింది (vaccindi)"
  "te-0537":
    native: "said; today అన్నాడు (annāḍu), అంది (andi)"
  "te-0538":
    native: "they came; today వచ్చారు (vaccāru)"
    notes:
      "n1": "The bookish past for they ends in -ఇరి (-iri)."
  "te-0539":
    native: "struck; today కొట్టింది (koṭṭindi)"
    notes:
      "n1": "The bookish -ఇనది (-inadi) is -ఇంది (-indi) today."
  "te-0540":
    native: "is doing; today చేస్తున్నాడు (cēstunnāḍu)"
  "te-0541":
    native: "while doing; today చేస్తూ (cēstū)"
  "te-0542":
    native: "there is; today ఉంది (undi)"
    notes:
      "n1": "Still seen on notices and old signs."
  "te-0543":
    native: "of (bookish)"
    notes:
      "n1": "Today the ending alone does it: రాముని యొక్క పుస్తకము (rāmuni yokka pustakamu) is రాముని పుస్తకం (rāmuni pustakam), Rama's book."
  "te-0544":
    native: "tell! (bookish); today చెప్పు (ceppu)"
  "te-0545":
    native: "water (bookish); today నీళ్ళు (nīḷḷu)"
    notes:
      "n1": "Books also have నీరు (nīru); people say నీళ్ళు (nīḷḷu)."
  "te-0546":
    native: "please (formal, written)"
    notes:
      "n1": "On signs and in letters. In speech the polite verb in -ండి (-aṇḍi) is enough: కూర్చోండి (kūrcōṇḍi)."
  "te-0547":
    native: "entry (on signs)"
    notes:
      "n1": "On doors and gates: ప్రవేశం (pravēśam), entry; నిష్క్రమణ (niṣkramaṇa), exit."
  "te-0548":
    native: "no smoking (on signs)"
    bases:
      "ధూమపానం": "smoking"
      "నిషేధం": "ban; prohibition"
  "te-0549":
    native: "toilet (formal)"
    notes:
      "n1": "Speakers say బాత్‌రూమ్ (bātrūm) or టాయిలెట్ (ṭāyileṭ)."
