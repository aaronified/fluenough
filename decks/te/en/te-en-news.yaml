"schema": 1
"id": "te-en-news"
"kind": "layer"
"core": "te-news"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "News: papers, reporters, elections and warnings"
"description": "Words for the news: papers and channels, reporters and editors, elections and votes, accidents and floods, and the words used to describe the news. Not yet checked by a Telugu speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "te-3500":
    "native": "news item; a piece of news"
    "examples":
      "ఈ వార్త నిజమేనా?":
        "native": "Is this news true?"
        "bases":
          "నిజమేనా":
            "meaning": "true; truth"
      "ఈరోజు ఒక మంచి వార్త విన్నాను.":
        "native": "Today I heard some good news."
        "bases":
          "విన్నాను":
            "meaning": "to hear; to listen"
    "notes":
      "n1": "{1} is one piece of news; the plural {2} means 'the news' as a programme on radio or TV."
  "te-3501":
    "native": "magazine; journal"
    "examples":
      "ఆయన రోజూ ఒక పత్రిక చదువుతారు.":
        "native": "He reads a magazine every day."
        "bases":
          "చదువుతారు":
            "meaning": "to read"
      "ఈ పత్రికలో కొత్త కథలు ఉన్నాయి.":
        "native": "This magazine has new stories."
        "bases":
          "పత్రికలో":
            "meaning": "magazine"
          "కథలు":
            "meaning": "story"
          "ఉన్నాయి":
            "meaning": "to be; to have"
    "notes":
      "n1": "{1} is any printed magazine or journal; a daily newspaper is {2}."
  "te-3502":
    "native": "TV channel"
    "examples":
      "ఏ ఛానల్ చూస్తున్నారు?":
        "native": "Which channel are you watching?"
        "bases":
          "చూస్తున్నారు":
            "meaning": "to watch; to see"
      "ఈ ఛానల్ వార్తలు బాగా చెబుతుంది.":
        "native": "This channel reports the news well."
        "bases":
          "వార్తలు":
            "meaning": "news item; a piece of news"
          "చెబుతుంది":
            "meaning": "to say; to tell"
    "notes":
      "n1": "{1} is a channel on television; the set itself is {2}."
  "te-3503":
    "native": "headline; heading; title"
    "examples":
      "పత్రికలో మొదటి శీర్షిక చాలా పెద్దది.":
        "native": "The first headline in the paper is very big."
        "bases":
          "పత్రికలో":
            "meaning": "magazine; paper"
          "పెద్దది":
            "meaning": "big; large"
      "ఈ శీర్షిక చదివి నేను ఆశ్చర్యపోయాను.":
        "native": "I was surprised after reading this headline."
        "bases":
          "చదివి":
            "meaning": "to read"
          "ఆశ్చర్యపోయాను":
            "meaning": "to be surprised"
    "notes":
      "n1": "{1} is the heading above a story, or the title of a section of a paper."
  "te-3504":
    "native": "reporter; journalist"
    "examples":
      "విలేఖరి ఈరోజు ఎన్నికల గురించి రాశాడు.":
        "native": "The reporter wrote about the elections today."
        "bases":
          "ఎన్నికల":
            "meaning": "elections"
          "రాశాడు":
            "meaning": "to write"
      "ఆ విలేఖరి పోలీసులతో మాట్లాడారు.":
        "native": "That reporter spoke with the police."
        "bases":
          "పోలీసులతో":
            "meaning": "police officer"
          "మాట్లాడారు":
            "meaning": "to speak; to talk"
    "notes":
      "n1": "{1} is a person who gathers and writes the news; the chief of a paper is {2}."
  "te-3505":
    "native": "editor"
    "examples":
      "సంపాదకుడు ఆ వార్తను మార్చమన్నాడు.":
        "native": "The editor asked for that news to be changed."
        "bases":
          "వార్తను":
            "meaning": "news item; a piece of news"
          "మార్చమన్నాడు":
            "meaning": "to change"
      "మా ఊరి సంపాదకుడు మంచి మనిషి.":
        "native": "The editor of our town's paper is a good man."
        "bases":
          "ఊరి":
            "meaning": "village; town"
    "notes":
      "n1": "{1} is the person who decides what goes into a paper or magazine."
  "te-3506":
    "native": "prime minister"
    "examples":
      "ప్రధానమంత్రి ఈరోజు ప్రసంగం ఇచ్చారు.":
        "native": "The prime minister gave a speech today."
        "bases":
          "ఇచ్చారు":
            "meaning": "to give"
      "ప్రధానమంత్రి ఢిల్లీలో ఉన్నారు.":
        "native": "The prime minister is in Delhi."
        "bases":
          "ఢిల్లీలో":
            "meaning": "Delhi"
          "ఉన్నారు":
            "meaning": "to be; to have"
    "notes":
      "n1": "{1} leads the national government; a state's head is {2}."
  "te-3507":
    "native": "chief minister (of a state)"
    "examples":
      "ముఖ్యమంత్రి రైతులతో మాట్లాడారు.":
        "native": "The chief minister spoke with the farmers."
        "bases":
          "రైతులతో":
            "meaning": "farmer"
          "మాట్లాడారు":
            "meaning": "to speak; to talk"
      "ఈ రాష్ట్రానికి కొత్త ముఖ్యమంత్రి వచ్చారు.":
        "native": "A new chief minister has come to this state."
        "bases":
          "రాష్ట్రానికి":
            "meaning": "state"
          "వచ్చారు":
            "meaning": "to come"
    "notes":
      "n1": "{1} heads a state's government; the head of the national government is {2}."
  "te-3508":
    "native": "elections"
    "examples":
      "ఈ నెలలో ఎన్నికలు ఉన్నాయి.":
        "native": "There are elections this month."
        "bases":
          "నెలలో":
            "meaning": "month"
          "ఉన్నాయి":
            "meaning": "to be; to have"
      "ఎన్నికలు శాంతియుతంగా జరిగాయి.":
        "native": "The elections were held peacefully."
        "bases":
          "శాంతియుతంగా":
            "meaning": "peaceful"
          "జరిగాయి":
            "meaning": "to happen; to take place"
    "notes":
      "n1": "{1} is the plural form; it means the elections, the whole process of voting."
  "te-3509":
    "native": "vote"
    "examples":
      "ప్రతి పౌరుడు ఓటు వేయాలి.":
        "native": "Every citizen should cast a vote."
        "bases":
          "వేయాలి":
            "meaning": "to put; to cast"
      "అందరికీ ఓటు హక్కు ఉంది.":
        "native": "Everyone has the right to vote."
        "bases":
          "అందరికీ":
            "meaning": "everyone"
          "ఉంది":
            "meaning": "to be; to have"
    "notes":
      "n1": "{1} is a single vote; the right to vote is {2}."
  "te-3510":
    "native": "incident; event"
    "examples":
      "ఆ సంఘటన గురించి అందరూ మాట్లాడుతున్నారు.":
        "native": "Everyone is talking about that incident."
        "bases":
          "అందరూ":
            "meaning": "everyone"
          "మాట్లాడుతున్నారు":
            "meaning": "to speak; to talk"
      "ఈ సంఘటనలో ఎవరికీ గాయం కాలేదు.":
        "native": "No one was hurt in this incident."
        "bases":
          "సంఘటనలో":
            "meaning": "incident"
          "ఎవరికీ":
            "meaning": "who; anyone"
          "కాలేదు":
            "meaning": "to become; to happen"
    "notes":
      "n1": "{1} is something that happened, often a sudden event such as a crime or an accident."
  "te-3511":
    "native": "accident; danger"
    "examples":
      "రోడ్డు ప్రమాదంలో ఇద్దరు గాయపడ్డారు.":
        "native": "Two people were injured in a road accident."
        "bases":
          "ప్రమాదంలో":
            "meaning": "accident; danger"
          "గాయపడ్డారు":
            "meaning": "to be injured"
      "ప్రమాదం జరిగిన చోట ఎవరూ లేరు.":
        "native": "There was no one at the place where the accident happened."
        "bases":
          "జరిగిన":
            "meaning": "to happen; to take place"
          "ఎవరూ":
            "meaning": "who; anyone"
          "లేరు":
            "meaning": "to be absent; to not be"
    "notes":
      "n1": "{1} is an accident; with a verb it can also mean 'danger', as in {2}."
  "te-3512":
    "native": "flood"
    "examples":
      "వరద వల్ల చాలా ఊళ్ళు మునిగిపోయాయి.":
        "native": "Many villages were submerged because of the flood."
        "bases":
          "ఊళ్ళు":
            "meaning": "village; town"
          "మునిగిపోయాయి":
            "meaning": "to sink; to be submerged"
      "నదిలో వరద పెరుగుతోంది.":
        "native": "The flood is rising in the river."
        "bases":
          "నదిలో":
            "meaning": "river"
          "పెరుగుతోంది":
            "meaning": "to increase; to rise"
    "notes":
      "n1": "{1} is the water that covers the land after heavy rain or when a river rises."
  "te-3513":
    "native": "theft; stealing"
    "examples":
      "ఈ బస్సులో దొంగతనం జరిగింది.":
        "native": "A theft happened on this bus."
        "bases":
          "బస్సులో":
            "meaning": "bus"
          "జరిగింది":
            "meaning": "to happen; to take place"
      "అతను దొంగతనం ఒప్పుకున్నాడు.":
        "native": "He admitted to the theft."
        "bases":
          "ఒప్పుకున్నాడు":
            "meaning": "to admit; to confess"
    "notes":
      "n1": "{1} is the act of stealing; a thief is {2}."
  "te-3514":
    "native": "official; officer"
    "examples":
      "అధికారి ఈ వివరాలు చెప్పారు.":
        "native": "The official gave these details."
        "bases":
          "వివరాలు":
            "meaning": "detail"
          "చెప్పారు":
            "meaning": "to say; to tell"
      "ప్రభుత్వ అధికారులు సమావేశంలో ఉన్నారు.":
        "native": "Government officials are in the meeting."
        "bases":
          "ప్రభుత్వ":
            "meaning": "government"
          "అధికారులు":
            "meaning": "official; officer"
          "సమావేశంలో":
            "meaning": "meeting"
          "ఉన్నారు":
            "meaning": "to be; to have"
    "notes":
      "n1": "{1} is a person who holds a post in an office or in the government."
  "te-3515":
    "native": "people; the public"
    "examples":
      "ప్రజలు ఈ నిర్ణయాన్ని స్వాగతించారు.":
        "native": "The people welcomed this decision."
        "bases":
          "నిర్ణయాన్ని":
            "meaning": "decision"
          "స్వాగతించారు":
            "meaning": "to welcome"
      "ఇక్కడి ప్రజలు చాలా దయగలవారు.":
        "native": "The people here are very kind."
        "bases":
          "ఇక్కడి":
            "meaning": "here"
          "దయగలవారు":
            "meaning": "kind"
    "notes":
      "n1": "{1} is a group of people, so it is mahat: the public, or the people of a place."
  "te-3516":
    "native": "sport"
    "examples":
      "క్రికెట్ నా ఇష్టమైన క్రీడ.":
        "native": "Cricket is my favourite sport."
        "bases":
          "ఇష్టమైన":
            "meaning": "liking; wish"
          "నా":
            "meaning": "I; me"
      "ఈ క్రీడలో ఎవరు గెలుస్తారు?":
        "native": "Who will win in this sport?"
        "bases":
          "క్రీడలో":
            "meaning": "sport"
          "గెలుస్తారు":
            "meaning": "to win"
    "notes":
      "n1": "{1} means sport as a whole; a single game being played is {2}."
  "te-3517":
    "native": "victory; success"
    "examples":
      "ఆ ఆటలో మనం విజయం సాధించాం.":
        "native": "We won that game."
        "bases":
          "ఆటలో":
            "meaning": "game"
          "సాధించాం":
            "meaning": "to achieve"
      "ప్రజలు విజయాన్ని జరుపుకున్నారు.":
        "native": "The people celebrated the victory."
        "bases":
          "విజయాన్ని":
            "meaning": "victory"
          "జరుపుకున్నారు":
            "meaning": "to celebrate"
    "notes":
      "n1": "{1} is a victory or a success; it often goes with {2}, to achieve."
  "te-3518":
    "native": "defeat; loss"
    "examples":
      "ఈసారి మా జట్టుకు ఓటమి ఎదురైంది.":
        "native": "This time our team faced defeat."
        "bases":
          "మా":
            "meaning": "we; us"
          "జట్టుకు":
            "meaning": "team"
          "ఎదురైంది":
            "meaning": "to face; to encounter"
      "ఓటమిని అంగీకరించడం కష్టం.":
        "native": "Accepting defeat is hard."
        "bases":
          "ఓటమిని":
            "meaning": "defeat"
    "notes":
      "n1": "{1} is the opposite of {2}."
  "te-3519":
    "native": "information"
    "examples":
      "ఈ పత్రికలో సమాచారం ఉంది.":
        "native": "There is information in this magazine."
        "bases":
          "పత్రికలో":
            "meaning": "magazine"
          "ఉంది":
            "meaning": "to be; to have"
      "మీకు ఏమైనా సమాచారం కావాలా?":
        "native": "Do you want any information?"
        "bases":
          "మీకు":
            "meaning": "you"
          "కావాలా":
            "meaning": "to want; to need"
    "notes":
      "n1": "{1} means information as a whole, and is usually not used in the plural."
  "te-3520":
    "native": "announcement; advertisement"
    "examples":
      "ప్రభుత్వం కొత్త ప్రకటన చేసింది.":
        "native": "The government made a new announcement."
        "bases":
          "చేసింది":
            "meaning": "to do; to make"
      "పత్రికలో ఒక ప్రకటన చూశాను.":
        "native": "I saw an advertisement in the paper."
        "bases":
          "పత్రికలో":
            "meaning": "magazine; paper"
          "చూశాను":
            "meaning": "to see; to watch"
    "notes":
      "n1": "{1} is an official statement or notice, and also an advertisement."
  "te-3521":
    "native": "opinion; view"
    "examples":
      "ఈ విషయంలో మీ అభిప్రాయం ఏమిటి?":
        "native": "What is your opinion on this matter?"
        "bases":
          "విషయంలో":
            "meaning": "matter; subject"
          "మీ":
            "meaning": "you"
      "నాకు ఆ అభిప్రాయం నచ్చలేదు.":
        "native": "I did not like that opinion."
        "bases":
          "నాకు":
            "meaning": "I; me"
          "నచ్చలేదు":
            "meaning": "to like"
    "notes":
      "n1": "{1} is a view that someone holds about a matter."
  "te-3522":
    "native": "programme; event; show"
    "examples":
      "రాత్రి ఎనిమిది గంటలకు ఒక కార్యక్రమం వస్తుంది.":
        "native": "A programme comes on at eight in the evening."
        "bases":
          "గంటలకు":
            "meaning": "hour"
          "వస్తుంది":
            "meaning": "to come"
      "పాఠశాలలో ఒక కార్యక్రమం ఉంది.":
        "native": "There is an event at the school."
        "bases":
          "పాఠశాలలో":
            "meaning": "school"
          "ఉంది":
            "meaning": "to be; to have"
    "notes":
      "n1": "{1} is a programme on TV or radio, or an organised event."
  "te-3523":
    "native": "discussion; debate"
    "examples":
      "ఈ అంశంపై చర్చ జరుగుతోంది.":
        "native": "A discussion is going on about this topic."
        "bases":
          "అంశంపై":
            "meaning": "topic; point"
          "జరుగుతోంది":
            "meaning": "to happen; to take place"
      "ఆ చర్చలో అందరూ పాల్గొన్నారు.":
        "native": "Everyone took part in that discussion."
        "bases":
          "చర్చలో":
            "meaning": "discussion; debate"
          "అందరూ":
            "meaning": "everyone"
          "పాల్గొన్నారు":
            "meaning": "to take part"
    "notes":
      "n1": "{1} is a discussion or debate on a subject, often in a meeting or on TV."
  "te-3524":
    "native": "problem"
    "examples":
      "ఈ సమస్య నాకు అర్థం కాలేదు.":
        "native": "I did not understand this problem."
        "bases":
          "నాకు":
            "meaning": "I; me"
          "కాలేదు":
            "meaning": "to become; to happen"
      "రైతుల సమస్యలు ఇంకా పరిష్కారం కాలేదు.":
        "native": "The farmers' problems have not been solved yet."
        "bases":
          "రైతుల":
            "meaning": "farmer"
          "సమస్యలు":
            "meaning": "problem"
          "కాలేదు":
            "meaning": "to become; to happen"
    "notes":
      "n1": "{1} is a problem or a difficulty; its answer is {2}."
  "te-3525":
    "native": "solution"
    "examples":
      "ఈ సమస్యకు పరిష్కారం దొరికింది.":
