# Layer for te-proverbs-2: each proverb's literal English rendering and its meaning.
schema: 1
id: "te-en-proverbs-2"
kind: "layer"
core: "te-proverbs-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs 2"
description: "Twenty Telugu proverbs from M. W. Carr's 1868 supplement to A Collection of Telugu Proverbs, each with a literal English rendering and its meaning. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "te-9000":
    native: "The neighbour's cat is the house cat's partner in mischief."
    notes:
      "literal": "Said of two people who join together to make trouble, as neighbours' cats do."
    bases:
      "ఇంటి": { meaning: "house's" }
      "పిల్లికి": { meaning: "to the cat" }
      "పొరుగింటి": { meaning: "neighbour's" }
      "తోడు": { meaning: "companion; ally" }
  "te-9001":
    native: "Everyone is a relative to the wealthy man."
    notes:
      "literal": "Said that the rich never lack relatives and friends, who appear only when there is money."
    bases:
      "కలిగిన": { meaning: "having (wealth)" }
      "వారికి": { meaning: "to them" }
      "చుట్టాలే": { meaning: "relatives (emphatic)" }
  "te-9002":
    native: "Neighbour ladies, look at my husband's trouble!"
    notes:
      "literal": "Said by a wife who calls on the women next door for sympathy, though they cannot change her husband. Printed spelling యింటి (yiṇṭi); the base is ఇల్లు (illu)."
    bases:
      "ఇరుగింటమ్మా": { meaning: "O lady from the house on one side" }
      "పొరుగింటమ్మా": { meaning: "O lady from the house on the other side" }
      "మా": { meaning: "our" }
      "యింటి": { meaning: "house's; printed spelling of ఇంటి (iṇṭi), genitive of ఇల్లు (illu)" }
      "ఆయన": { meaning: "he (respectful); here, the man of the house, my husband" }
      "గోడు": { meaning: "complaint; lament" }
      "చూడండి": { meaning: "look (polite plural)" }
  "te-9003":
    native: "There is no one who knows everything, and no one who knows nothing."
    notes:
      "literal": "Said that nobody knows all things, and nobody is completely ignorant. Printed spelling అన్నీ (annī) of card అన్ని (anni); printed యేమీ (yēmī) is the card ఏమీ (ēmī)."
    bases:
      "అన్నీ": { meaning: "all" }
      "తెలిశినవాడూ": { meaning: "one who knows" }
      "లేడు": { meaning: "there is none (he)" }
      "యేమీ": { meaning: "anything" }
      "తెలియనివాడూ": { meaning: "one who does not know" }
  "te-9004":
    native: "A word learnt on the day of the sacred thread is never forgotten."
    notes:
      "literal": "Said that what is taught in boyhood, at initiation, stays with a person for life."
    bases:
      "ఉపనయనమునాటి": { meaning: "of the day of the sacred-thread ceremony" }
      "మాట": { meaning: "word; teaching" }
      "వుండక": { meaning: "without remaining" }
      "పోదు": { meaning: "will not go" }
  "te-9005":
    native: "No learning, no evening prayers, but plenty of children."
    notes:
      "literal": "Said of an ignorant man who has many children but no learning or religious duty."
    bases:
      "చదువూ": { meaning: "learning (emphatic)" }
      "సంధ్యా": { meaning: "evening prayer" }
      "సంతానం": { meaning: "children" }
      "మెండు": { meaning: "plenty" }
  "te-9006":
    native: "Anthills built by ants become the homes of snakes."
    notes:
      "literal": "Said that one often enjoys what another person has built with effort."
    bases:
      "చీమలు": { meaning: "ants" }
      "పెట్టిన": { meaning: "built" }
      "పుట్టలు": { meaning: "anthills" }
      "పాములకు": { meaning: "to snakes" }
      "యిరవు": { meaning: "dwelling" }
      "అవుతున్నవి": { meaning: "become" }
  "te-9007":
    native: "Even if the head spins, the morsel must still reach the mouth."
    notes:
      "literal": "Said that what is due to a person will reach him in the end, however confused things seem."
    bases:
      "తిరిగి": { meaning: "turning" }
      "కబళము": { meaning: "morsel" }
      "నోటికి": { meaning: "to the mouth" }
      "రావలెను": { meaning: "must come" }
  "te-9008":
    native: "In a bad time, birds carried off even the cloth from his back."
    notes:
      "literal": "Said of someone whose misfortunes keep piling up until he loses even the little he has. Printed spelling యెత్తుకొనె (yettukone); the base is ఎత్తుకొను (ettukonu)."
    bases:
      "కాని": { meaning: "bad; unfavourable" }
      "కాలమునకు": { meaning: "in (a) time" }
      "పయిబట్ట": { meaning: "upper cloth" }
      "పక్షులు": { meaning: "birds" }
      "యెత్తుకొనె": { meaning: "carried off" }
      "పోయినవి": { meaning: "went away" }
  "te-9009":
    native: "Religious rites have no end, and their proper times can never be fixed."
    notes:
      "literal": "Said that ceremonies are endless, and the right times for them are never certain."
    bases:
      "కర్మకు": { meaning: "to the rite" }
      "అంతమూ": { meaning: "end (emphatic)" }
      "కాలమునకు": { meaning: "for time" }
      "నిశ్చయమూ": { meaning: "certainty (emphatic)" }
  "te-9010":
    native: "If not Sunday, then Monday."
    notes:
      "literal": "Said that if one day is not convenient, the next will do."
    bases:
      "కాకుంటే": { meaning: "if not" }
  "te-9011":
    native: "Darkness lasts a few days, and moonlight a few days."
    notes:
      "literal": "Said that good and bad times each pass in turn, so one should neither despair nor grow proud."
    bases:
      "కొన్నాళ్ళు": { meaning: "for some days" }
      "వెన్నెల": { meaning: "moonlight" }
  "te-9012":
    native: "Time passes, but the words remain."
    notes:
      "literal": "Said that an accusation or harsh word is remembered long after the time has gone. Printed spelling కాలము (kālamu) of card కాలం (kālaṁ)."
    bases:
      "కాలము": { meaning: "time" }
      "పోను": { meaning: "as (it) passes" }
      "మాట": { meaning: "word; accusation" }
      "నిలుచును": { meaning: "remains" }
  "te-9013":
    native: "A boneless tongue turns however you twist it."
    notes:
      "literal": "Said of a liar who can bend his words any way he likes. Printed spelling యెట్లా (yeṭlā); the base is ఎట్లా (eṭlā)."
    bases:
      "ఎముకలేని": { meaning: "boneless" }
      "యెట్లా": { meaning: "however" }
      "తిప్పినా": { meaning: "even if (one) turns" }
      "తిరుగుతుంది": { meaning: "turns" }
  "te-9014":
    native: "To cover up one lie, a thousand more lies are needed."
    notes:
      "literal": "Said that one lie always needs many more lies to hide it. Printed అబద్ధము (abaddhamu) is the card అబద్ధం (abaddhaṁ); అపద్ధాలు (apaddhālu) is a misprint of అబద్ధాలు (abaddhālu), plural of అబద్ధం (abaddhaṁ)."
    bases:
      "అబద్ధము": { meaning: "lie" }
      "కమ్మడానకు": { meaning: "to cover" }
      "అపద్ధాలు": { meaning: "lies (printed misprint of అబద్ధాలు (abaddhālu))" }
      "కావలెను": { meaning: "are needed" }
  "te-9015":
    native: "An abusive mouth will not stay quiet even if you sew it shut."
    notes:
      "literal": "Said of a person who keeps on swearing whatever is done to him."
    bases:
      "తిట్టేనోరు": { meaning: "abusive mouth" }
      "కుట్టినా": { meaning: "even if (one) sews" }
      "వూరకుండదు": { meaning: "will not stay quiet" }
  "te-9016":
    native: "If you say 'alas!', six months of sin will come to you."
    notes:
      "literal": "Said when pity is shown to a wicked person who does not deserve it."
    bases:
      "అయ్యో": { meaning: "alas" }
      "అంటే": { meaning: "if (one) says" }
      "నెలల": { meaning: "months" }
      "పాపం": { meaning: "sin" }
      "వస్తున్నది": { meaning: "will come" }
  "te-9017":
    native: "You should winnow only when the wind blows."
    notes:
      "literal": "Said that one should act while the chance is there, since winnowing needs the wind."
    bases:
      "వచ్చినప్పుడుగదా": { meaning: "only when (it) comes" }
      "తూర్పార": { meaning: "winnowing" }
      "పట్టుకోవలెను": { meaning: "must do" }
  "te-9018":
    native: "As much as the ox can carry, as much as the sack can hold."
    notes:
      "literal": "Said that one can take only as much as one's capacity allows."
    bases:
      "మోశినంత": { meaning: "as much as (it) carried" }
      "గోనె": { meaning: "sack" }
      "పట్టినంత": { meaning: "as much as (it) holds" }
  "te-9019":
    native: "Must you ask the ox before tying on the pack saddle?"
    notes:
      "literal": "Said of a thing so obvious that asking for permission is pointless."
    bases:
      "ఎద్దును": { meaning: "the ox" }
      "అడిగా": { meaning: "having asked" }
      "గంత": { meaning: "pack saddle" }
      "కట్టడము": { meaning: "tying" }
