        "bases":
          "బ్లూటూత్": { "meaning": "Bluetooth" }
          "చేయి": { "meaning": "to do; to make" }
      "బ్లూటూత్ పని చేయడం లేదు.":
        "native": "Bluetooth is not working."
        "bases":
          "బ్లూటూత్": { "meaning": "Bluetooth" }
          "చేయడం": { "meaning": "to do; to make" }
