    "native": "speaker"
    "notes":
      "n1": "The part that makes the sound of a phone or device."
    "examples":
      "స్పీకర్ చాలా నెమ్మదిగా ఉంది.":
        "native": "The speaker is very quiet."
        "bases":
          "స్పీకర్": { "meaning": "speaker" }
          "నెమ్మదిగా": { "meaning": "slowly; quietly" }
          "ఉంది": { "meaning": "to be; to stay; to live" }
      "స్పీకర్ పెంచు.":
        "native": "Turn up the speaker."
        "bases":
          "స్పీకర్": { "meaning": "speaker" }
          "పెంచు": { "meaning": "to increase; to raise" }
  "te-2425":
    "native": "SMS (text message)"
    "notes":
      "n1": "Said as in English. The same as మెసేజ్ (mesej)."
    "examples":
      "ఎస్‌ఎంఎస్ వచ్చిందా?":
