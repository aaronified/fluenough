        "bases":
          "వీడియో": { "meaning": "video" }
          "చూడండి": { "meaning": "to see; to look; to watch" }
      "వీడియో పంపాను.":
        "native": "I sent a video."
        "bases":
          "వీడియో": { "meaning": "video" }
          "పంపాను": { "meaning": "to send" }
  "te-2419":
    "native": "button"
    "notes":
      "n1": "To press it, say నొక్కడం (nokkaḍam), 'to press'."
    "examples":
      "ఈ బటన్ నొక్కండి.":
        "native": "Press this button."
        "bases":
          "బటన్": { "meaning": "button" }
          "నొక్కండి": { "meaning": "to press" }
          "ఈ": { "meaning": "this" }
      "ఫోన్‌లో పవర్ బటన్ ఎక్కడ ఉంది?":
        "native": "Where is the power button on the phone?"
        "bases":
          "ఫోన్‌లో": { "meaning": "phone" }
          "పవర్": { "meaning": "power" }
          "బటన్": { "meaning": "button" }
          "ఉంది": { "meaning": "to be; to stay; to live" }
  "te-2420":
    "native": "line (a phone line)"
    "notes":
      "n1": "On the phone, the line is the connection for a call."
    "examples":
      "లైన్ బిజీగా ఉంది.":
        "native": "The line is busy."
        "bases":
          "లైన్": { "meaning": "line" }
          "బిజీగా": { "meaning": "busy" }
          "ఉంది": { "meaning": "to be; to stay; to live" }
      "ఒక్క నిమిషం లైన్‌లో ఉండండి.":
        "native": "Stay on the line for a minute."
        "bases":
          "ఒక్క": { "meaning": "one" }
          "నిమిషం": { "meaning": "minute" }
          "లైన్‌లో": { "meaning": "line" }
          "ఉండండి": { "meaning": "to be; to stay; to live" }
