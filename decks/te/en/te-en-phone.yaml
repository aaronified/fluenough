"schema": 1
"id": "te-en-phone"
"kind": "layer"
"core": "te-phone"
"native": { "code": "en", "iso639_3": "eng", "name": "English" }
"name": "Phone: calls, messages and apps"
"description": "Words for phones and phone calls: calls, messages, numbers, the screen, battery, charger, internet and apps, and the verbs for switching on, calling, saving and sending. Not yet checked by a Telugu speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags": ["beginner", "unreviewed"]
"cards":
  "te-2400":
    "native": "call (on the phone)"
    "notes":
      "n1": "For the verb 'to phone' say ఫోన్ చేయడం (fōn cēyaḍam), as in te-0480."
    "examples":
      "రేపు నీకు కాల్ చేస్తాను.":
        "native": "I will call you tomorrow."
        "bases":
          "కాల్": { "meaning": "call" }
          "చేస్తాను": { "meaning": "to do; to make" }
          "నీకు": { "meaning": "you" }
      "ఆ కాల్ చాలా ఆలస్యంగా వచ్చింది.":
        "native": "That call came very late."
        "bases":
          "కాల్": { "meaning": "call" }
          "ఆలస్యంగా": { "meaning": "delay; late" }
          "వచ్చింది": { "meaning": "to come" }
  "te-2401":
    "native": "text message"
    "notes":
      "n1": "A text message; the same word is used for an SMS. A voice message is వాయిస్ మెసేజ్ (vāyis mesej)."
    "examples":
      "నాకు ఒక మెసేజ్ పంపు.":
        "native": "Send me a message."
        "bases":
          "మెసేజ్": { "meaning": "message" }
          "పంపు": { "meaning": "to send" }
      "మెసేజ్ చదివాను.":
        "native": "I read the message."
        "bases":
          "మెసేజ్": { "meaning": "message" }
          "చదివాను": { "meaning": "to read" }
  "te-2402":
    "native": "number"
    "notes":
      "n1": "Also used for a phone number, as in ఫోన్ నంబర్ (fōn nambar)."
    "examples":
      "నీ నంబర్ ఏంటి?":
        "native": "What is your number?"
        "bases":
          "నంబర్": { "meaning": "number" }
          "నీ": { "meaning": "you" }
          "ఏంటి": { "meaning": "what" }
      "ఆ నంబర్ నాకు గుర్తుంది.":
        "native": "I remember that number."
        "bases":
          "నంబర్": { "meaning": "number" }
          "నాకు": { "meaning": "I" }
          "గుర్తుంది": { "meaning": "to be remembered" }
  "te-2403":
    "native": "charger"
    "notes":
      "n1": "The plug and cable that charge a phone. The verb is ఛార్జ్ చేయడం (chārj cēyaḍam)."
    "examples":
      "ఛార్జర్ ఎక్కడ ఉంది?":
        "native": "Where is the charger?"
        "bases":
          "ఛార్జర్": { "meaning": "charger" }
          "ఉంది": { "meaning": "to be; to stay; to live" }
          "ఎక్కడ": { "meaning": "where" }
      "ఛార్జర్ పని చేయడం లేదు.":
        "native": "The charger is not working."
        "bases":
          "ఛార్జర్": { "meaning": "charger" }
          "చేయడం": { "meaning": "to do; to make" }
  "te-2404":
    "native": "battery"
    "notes":
      "n1": "The battery of a phone or any device. Said as in English."
    "examples":
      "బ్యాటరీ చాలా తక్కువ ఉంది.":
        "native": "The battery is very low."
        "bases":
          "బ్యాటరీ": { "meaning": "battery" }
          "ఉంది": { "meaning": "to be; to stay; to live" }
      "బ్యాటరీ ఛార్జ్ అయిపోయింది.":
        "native": "The battery has run out."
        "bases":
          "బ్యాటరీ": { "meaning": "battery" }
          "అయిపోయింది": { "meaning": "to finish; to run out" }
  "te-2405":
    "native": "screen"
    "notes":
      "n1": "The screen of a phone, computer or TV."
    "examples":
      "స్క్రీన్ పగిలిపోయింది.":
        "native": "The screen has cracked."
        "bases":
          "స్క్రీన్": { "meaning": "screen" }
          "పగిలిపోయింది": { "meaning": "to break; to crack" }
      "స్క్రీన్ మీద వేలు పెట్టండి.":
        "native": "Put your finger on the screen."
        "bases":
          "స్క్రీన్": { "meaning": "screen" }
          "మీద": { "meaning": "on" }
          "పెట్టండి": { "meaning": "to put; to place; to serve" }
  "te-2406":
    "native": "internet"
    "notes":
      "n1": "Said as in English."
    "examples":
      "ఇంటర్నెట్ పని చేయడం లేదు.":
        "native": "The internet is not working."
        "bases":
          "ఇంటర్నెట్": { "meaning": "internet" }
          "చేయడం": { "meaning": "to do; to make" }
      "ఇక్కడ ఇంటర్నెట్ ఉందా?":
        "native": "Is there internet here?"
        "bases":
          "ఇంటర్నెట్": { "meaning": "internet" }
          "ఉందా": { "meaning": "to be; to stay; to live" }
          "ఇక్కడ": { "meaning": "here" }
  "te-2407":
    "native": "network; signal coverage"
    "notes":
      "n1": "The mobile network. For the strength of the signal, say సిగ్నల్ (signal)."
    "examples":
      "నెట్‌వర్క్ బాగా లేదు.":
        "native": "The network is not good."
        "bases":
          "నెట్‌వర్క్": { "meaning": "network" }
          "బాగా": { "meaning": "well; fine" }
          "లేదు": { "meaning": "not (there is no)" }
      "ఇక్కడ నెట్‌వర్క్ ఎప్పుడూ బాగానే ఉంటుంది.":
        "native": "The network is always fine here."
        "bases":
          "నెట్‌వర్క్": { "meaning": "network" }
          "ఉంటుంది": { "meaning": "to be; to stay; to live" }
          "ఇక్కడ": { "meaning": "here" }
  "te-2408":
    "native": "password"
    "notes":
      "n1": "Said as in English."
    "examples":
      "పాస్‌వర్డ్ మర్చిపోయాను.":
        "native": "I forgot the password."
        "bases":
          "పాస్‌వర్డ్": { "meaning": "password" }
          "మర్చిపోయాను": { "meaning": "to forget" }
      "పాస్‌వర్డ్ చెప్పకండి.":
        "native": "Do not tell the password."
        "bases":
          "పాస్‌వర్డ్": { "meaning": "password" }
          "చెప్పకండి": { "meaning": "to say; to tell" }
  "te-2409":
    "native": "email"
    "notes":
      "n1": "Said as in English, for a message sent over the internet."
    "examples":
      "నీకు ఇమెయిల్ పంపాను.":
        "native": "I sent you an email."
        "bases":
          "ఇమెయిల్": { "meaning": "email" }
          "నీకు": { "meaning": "you" }
          "పంపాను": { "meaning": "to send" }
      "ఇమెయిల్ చూశారా?":
        "native": "Did you look at the email?"
        "bases":
          "ఇమెయిల్": { "meaning": "email" }
          "చూశారా": { "meaning": "to see; to look; to watch" }
  "te-2410":
    "native": "app"
    "notes":
      "n1": "Short for application; a phone app."
    "examples":
      "ఈ యాప్ ఉచితం.":
        "native": "This app is free."
        "bases":
          "యాప్": { "meaning": "app" }
          "ఉచితం": { "meaning": "free of charge" }
      "నేను ఒక కొత్త యాప్ డౌన్‌లోడ్ చేశాను.":
        "native": "I downloaded a new app."
        "bases":
          "యాప్": { "meaning": "app" }
          "కొత్త": { "meaning": "new" }
          "చేశాను": { "meaning": "to download" }
  "te-2411":
    "native": "WhatsApp"
    "notes":
      "n1": "A brand name, said as in English."
    "examples":
      "వాట్సాప్‌లో మెసేజ్ పంపు.":
        "native": "Send a message on WhatsApp."
        "bases":
          "వాట్సాప్‌లో": { "meaning": "WhatsApp" }
          "మెసేజ్": { "meaning": "message" }
          "పంపు": { "meaning": "to send" }
      "అమ్మ వాట్సాప్ నేర్చుకుంది.":
        "native": "Mother learned WhatsApp."
        "bases":
          "అమ్మ": { "meaning": "mother" }
          "వాట్సాప్": { "meaning": "WhatsApp" }
          "నేర్చుకుంది": { "meaning": "to learn" }
  "te-2412":
    "native": "ring; ringtone"
    "notes":
      "n1": "For a phone ringing or its ringtone. The verb 'to ring' is మోగడం (mōgaḍam)."
    "examples":
      "ఫోన్ రింగ్ అవుతోంది.":
        "native": "The phone is ringing."
        "bases":
          "రింగ్": { "meaning": "ring" }
          "అవుతోంది": { "meaning": "to become" }
      "రింగ్ చాలా గట్టిగా ఉంది.":
        "native": "The ringtone is very loud."
        "bases":
          "రింగ్": { "meaning": "ring" }
          "గట్టిగా": { "meaning": "loudly; firmly" }
          "ఉంది": { "meaning": "to be; to stay; to live" }
  "te-2413":
    "native": "signal"
    "notes":
      "n1": "The bars of signal on a phone."
    "examples":
      "ఇక్కడ సిగ్నల్ లేదు.":
        "native": "There is no signal here."
        "bases":
          "సిగ్నల్": { "meaning": "signal" }
          "ఇక్కడ": { "meaning": "here" }
          "లేదు": { "meaning": "not (there is no)" }
      "బాల్కనీలో సిగ్నల్ బాగుంది.":
        "native": "The signal is good on the balcony."
        "bases":
          "సిగ్నల్": { "meaning": "signal" }
          "బాగుంది": { "meaning": "to be good" }
  "te-2414":
    "native": "contact (a saved name and number)"
    "notes":
      "n1": "A name saved with a number in the phone."
    "examples":
      "ఆ నంబర్ కాంటాక్ట్‌లో ఉంది.":
        "native": "That number is in my contacts."
        "bases":
          "కాంటాక్ట్‌లో": { "meaning": "contact" }
          "ఉంది": { "meaning": "to be; to stay; to live" }
          "నంబర్": { "meaning": "number" }
      "కాంటాక్ట్ సేవ్ చేయండి.":
        "native": "Save the contact."
        "bases":
          "కాంటాక్ట్": { "meaning": "contact" }
          "చేయండి": { "meaning": "to do; to make" }
  "te-2415":
    "native": "SIM card"
    "notes":
      "n1": "The small card inside a phone that holds the number."
    "examples":
      "ఫోన్‌లో కొత్త సిమ్ పెట్టాను.":
        "native": "I put a new SIM in the phone."
        "bases":
          "ఫోన్‌లో": { "meaning": "phone" }
          "సిమ్": { "meaning": "SIM card" }
          "పెట్టాను": { "meaning": "to put; to place; to serve" }
      "సిమ్ కార్డ్ ఎక్కడ కొనాలి?":
        "native": "Where should I buy a SIM card?"
        "bases":
          "సిమ్": { "meaning": "SIM card" }
          "కొనాలి": { "meaning": "to buy" }
          "ఎక్కడ": { "meaning": "where" }
  "te-2416":
    "native": "Wi-Fi"
    "notes":
      "n1": "A wireless internet connection, said as in English."
    "examples":
      "వైఫై పాస్‌వర్డ్ ఏంటి?":
        "native": "What is the Wi-Fi password?"
        "bases":
          "వైఫై": { "meaning": "Wi-Fi" }
          "పాస్‌వర్డ్": { "meaning": "password" }
          "ఏంటి": { "meaning": "what" }
      "వైఫై ఆన్ చేయండి.":
        "native": "Switch on the Wi-Fi."
        "bases":
          "వైఫై": { "meaning": "Wi-Fi" }
          "చేయండి": { "meaning": "to do; to make" }
  "te-2417":
    "native": "camera"
    "notes":
      "n1": "A phone camera is ఫోన్ కెమెరా (fōn kemerā)."
    "examples":
      "కెమెరా బాగుంది.":
        "native": "The camera is good."
        "bases":
          "కెమెరా": { "meaning": "camera" }
          "బాగుంది": { "meaning": "to be good" }
      "ఫోటో తీయడానికి కెమెరా ఉపయోగించు.":
        "native": "Use the camera to take a photo."
        "bases":
          "ఫోటో": { "meaning": "photo" }
          "తీయడానికి": { "meaning": "to take out; to pull; to remove" }
          "కెమెరా": { "meaning": "camera" }
          "ఉపయోగించు": { "meaning": "to use" }
  "te-2418":
    "native": "video"
    "notes":
      "n1": "A video call is వీడియో కాల్ (vīḍiyō kāl)."
