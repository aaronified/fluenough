        "bases":
          "ఇంట్లో": { "meaning": "house; home" }
          "ల్యాండ్‌లైన్": { "meaning": "landline" }
          "ఉందా": { "meaning": "to be; to stay; to live" }
      "ల్యాండ్‌లైన్ నంబర్ ఇవ్వండి.":
        "native": "Give me the landline number."
        "bases":
          "ల్యాండ్‌లైన్": { "meaning": "landline" }
          "నంబర్": { "meaning": "number" }
          "ఇవ్వండి": { "meaning": "to give" }
  "te-2422":
    "native": "headphones"
    "notes":
      "n1": "Also used for earphones."
