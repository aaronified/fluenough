        "bases":
          "నా": { "meaning": "I; my" }
          "హెడ్‌ఫోన్": { "meaning": "headphones" }
          "ఎక్కడ": { "meaning": "where" }
          "పెట్టావు": { "meaning": "to put; to place; to serve" }
  "te-2423":
    "native": "Bluetooth"
    "notes":
      "n1": "A wireless link between two devices, said as in English."
    "examples":
      "బ్లూటూత్ ఆన్ చేయి.":
