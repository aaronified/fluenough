schema: 1
id: "te-en-grammar-compound-verbs"
kind: "layer"
core: "te-grammar-compound-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs that add a shade"
description: "A second verb after the first adds a shade: done for good, done for oneself, done for someone. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "te-0512":
    native: "He went away; he's gone."
    alt_native: ["He has left."]
    notes:
      "n1": "పోవు (pōvu), go, after a verb: the action is done and gone. వెళ్ళాడు (veḷḷāḍu), he went; వెళ్ళిపోయాడు (veḷḷipōyāḍu), he left."
  "te-0513":
    native: "I forgot."
  "te-0514":
    native: "He fell down."
    alt_native: ["He fell over."]
  "te-0515":
    native: "I've eaten it all up."
    alt_native: ["I ate it all up.", "I finished eating it all."]
    notes:
      "n1": "వేయు (vēyu), throw, after a verb: done completely, and at once."
  "te-0516":
    native: "I've gone and told them."
    alt_native: ["I went and told them."]
  "te-0517":
    native: "I bought it for myself."
    alt_native: ["I bought it for me.", "I purchased it for myself."]
    notes:
      "n1": "-కొను (-konu) after a verb: for oneself. కొన్నాను (konnānu), I bought; కొనుక్కున్నాను (konukkunnānu), I bought it for myself."
  "te-0518":
    native: "I did it for myself."
    alt_native: ["I did it for me."]
  "te-0519":
    native: "Please take care of it; have a look."
    alt_native: ["Please look after it; take a look."]
  "te-0520":
    native: "Please fetch it (for me)."
    alt_native: ["Please get it for me."]
    notes:
      "n1": "పెట్టు (peṭṭu), put, after a verb: done for someone."
