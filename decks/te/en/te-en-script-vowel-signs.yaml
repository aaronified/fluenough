schema: 1
id: "te-en-script-vowel-signs"
kind: "layer"
core: "te-script-vowel-signs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Telugu vowel signs"
description: "After a consonant a vowel is written as a sign (gunintam) on it: on top, on the right, or in two parts, never before it. Here on క (ka) and on మ (ma)."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "te-0063":
    native: "kaa (k + the aa sign)"
    notes:
      "n1": "The aa sign ా (ā) is at the top, where the tick (talakattu) becomes a hook to the right: కాకి (kāki, crow). Compare క (ka) on its own, which is 'ka' with a short a."
    "examples": {
      "కాలం మారుతుంది.": {"native": "Times change.", "bases": {}},
      "స్కానర్ వెలుగుతోంది.": {"native": "The scanner light is on.", "bases": {}}
    }
  "te-0064":
    native: "ki (k + the i sign)"
    notes:
      "n1": "The i sign ి (i) sits on top, in place of the tick (talakattu) many consonants carry: కిటికీ (kiṭikī, window)."
    "examples": {
      "ఇక్కడికి రండి.": {"native": "Come here.", "bases": {}},
      "పనికి వెళ్ళడం": {"native": "to go to work", "bases": {}}
    }
  "te-0065":
    native: "kii (k + the ii sign)"
    notes:
      "n1": "The ii sign ీ (ī) also sits on top, with a stroke for the length. Short and long change the word, so look for the stroke."
    "examples": {
      "ఓటీపీ ఎవరికీ చెప్పకండి.": {"native": "Do not tell the OTP to anyone.", "bases": {}},
      "సత్యం ఎప్పటికీ గెలుస్తుంది.": {"native": "The truth always wins.", "bases": {}}
    }
  "te-0066":
    native: "ku (k + the u sign)"
    notes:
      "n1": "The u sign ు (u) is joined on the right: కుక్క (kukka, dog)."
    "examples": {
      "ఇప్పుడు వెళ్ళకు.": {"native": "Don't go now.", "bases": {}},
      "ఎండలో నడవకు.": {"native": "Don't walk in the sun.", "bases": {}}
    }
  "te-0067":
    native: "kuu (k + the uu sign)"
    notes:
      "n1": "The uu sign ూ (ū) is joined on the right, with a longer curl: కూర (kūra, curry)."
    "examples": {
      "ఇక్కడ కూర్చోండి.": {"native": "Please sit here.", "bases": {}},
      "ఎక్కడైనా కూర్చోండి.": {"native": "Sit anywhere.", "bases": {}}
    }
  "te-0068":
    native: "kru (k + the ru sign)"
    notes:
      "n1": "The ru sign ృ (ru) is joined on the right, like the u signs, in words from Sanskrit. A recogniser writes 'kru' as క్రు (kru), so it is drilled by reading and writing only."
    "examples": {
      "కవి ప్రకృతిని వర్ణిస్తాడు.": {"native": "The poet describes nature.", "bases": {}},
      "ప్రకృతి సౌందర్యాన్ని ఆస్వాదించాం.": {"native": "We enjoyed the beauty of nature.", "bases": {}}
    }
  "te-0069":
    native: "ke (k + the e sign)"
    notes:
      "n1": "The e sign ె (e) sits on top, in place of the tick: కెరటం (keraṭam, wave)."
    "examples": {
      "కెమెరా బాగుంది.": {"native": "The camera is good.", "bases": {}},
      "ఇంకెప్పుడూ ఇలా చేయకండి.": {"native": "Don't do this again.", "bases": {}}
    }
  "te-0070":
    native: "kee (k + the ee sign)"
    notes:
      "n1": "The ee sign ే (ē) sits on top, with a stroke for the length: కేక (kēka, shout)."
    "examples": {
      "ఇది ఒకే పుస్తకం.": {"native": "This is the same book.", "bases": {}},
      "కేబుల్ ఎక్కడ దొరుకుతుంది?": {"native": "Where can you find a cable?", "bases": {}}
    }
  "te-0071":
    native: "kai (k + the ai sign)"
    notes:
      "n1": "The ai sign ై (ai) comes in two parts: on top, and below the consonant."
    "examples": {
      "ఆమె కళ్ళు చురుకైనవి.": {"native": "Her eyes are lively.", "bases": {}},
      "ఎవరికైనా ఇది సాధ్యమే.": {"native": "It is possible for anyone.", "bases": {}}
    }
  "te-0072":
    native: "ko (k + the o sign)"
    notes:
      "n1": "The o sign ొ (o) sits on top and curls to the right: కొడుకు (koḍuku, son)."
    "examples": {
      "ఆయన చదువు కొనసాగిస్తాడు.": {"native": "He continues his studies.", "bases": {}},
      "ఇంకొక గాడ్జెట్ కొనాలా?": {"native": "Should I buy another gadget?", "bases": {}}
    }
  "te-0073":
    native: "koo (k + the oo sign)"
    notes:
      "n1": "The oo sign ో (ō) is the o sign with a stroke for the length: కోడి (kōḍi, hen)."
    "examples": {
      "కోడ్ రాయండి.": {"native": "Write the code.", "bases": {}},
      "తప్పు ఒప్పుకోవాలి.": {"native": "One must admit a mistake.", "bases": {}}
    }
  "te-0074":
    native: "kau (k + the au sign)"
    notes:
      "n1": "The au sign ౌ (au) sits on top and to the right: కౌగిలి (kaugili, hug)."
    "examples": {
      "కౌంటర్ మూసేశారు.": {"native": "They have closed the counter.", "bases": {}},
      "అకౌంట్ పాస్‌వర్డ్ మర్చిపోయాను.": {"native": "I forgot the account password.", "bases": {}}
    }
  "te-0075":
    native: "kam (k + the sunna)"
    notes:
      "n1": "The circle ం (am) after a letter, the sunna (anusvaram), is an m or an n: m at the end of a word, and before another consonant the nasal that suits it: కంచం (kañcam, plate). A mark rather than a sound of its own, so it is drilled by reading and writing only."
    "examples": {
      "పాస్‌వర్డ్ చెప్పకండి.": {"native": "Do not tell the password.", "bases": {}},
      "పుస్తకం చదువు.": {"native": "Read the book.", "bases": {}}
    }
  "te-0076":
    native: "k (with the pollu: no vowel)"
    notes:
      "n1": "The pollu ్ takes the vowel away: క్ (k) is 'k' alone. Two consonants usually join instead, the second written below; the pollu ends English words such as డాక్టర్ (ḍākṭar, doctor). A mark rather than a sound of its own, so it is drilled by reading and writing only."
    "examples": {
      "ఇక్కడ రా.": {"native": "Come here.", "bases": {}},
      "ఇక్కడ రాయి.": {"native": "Write here.", "bases": {}}
    }
  "te-0077":
    native: "maa (m + the aa sign)"
    notes:
      "n1": "The same aa sign on another consonant: each sign keeps much the same place on most consonants, though its shape joins each a little differently. మా (mā, our)."
    "examples": {
      "జరిమానా ఎంత?": {"native": "How much is the fine?", "bases": {}},
      "నెమ్మదిగా మాట్లాడండి.": {"native": "Please speak slowly.", "bases": {"నెమ్మదిగా": "slow; calm"}}
    }
  "te-0078":
    native: "mi (m + the i sign)"
    notes:
      "n1": "The i sign on top of మ (ma): మిరపకాయ (mirapakāya, chilli)."
    "examples": {
      "ఒక్క నిమిషం ఆగండి.": {"native": "Please wait just a minute.", "bases": {"నిమిషం": "minute"}},
      "టెర్మినల్ ఎక్కడ ఉంది?": {"native": "Where is the terminal?", "bases": {}}
    }
  "te-0079":
    native: "mii (m + the ii sign)"
    notes:
      "n1": "The ii sign on top of మ (ma), with its stroke: మీ (mī, your)."
    "examples": {
      "మీ కోసం": {"native": "for you", "bases": {"కోసం": "for"}},
      "మీటర్ వేయండి.": {"native": "Please put the meter on.", "bases": {"మీటర్": "meter"}}
    }
  "te-0080":
    native: "mu (m + the u sign)"
    notes:
      "n1": "The u sign on the right of మ (ma): ముక్కు (mukku, nose)."
    "examples": {
      "ముందుగా తినండి.": {"native": "Eat first.", "bases": {}},
      "రాముకి ఇవ్వండి.": {"native": "Give it to Ramu, please.", "bases": {"రాముకి": "Ramu (a man's name)"}}
    }
  "te-0081":
    native: "muu (m + the uu sign)"
    notes:
      "n1": "The uu sign on the right of మ (ma): మూడు (mūḍu, three)."
    "examples": {
      "ఆయన మంచి న్యాయమూర్తి.": {"native": "He is a good judge.", "bases": {}},
      "న్యాయమూర్తి ఎప్పుడు వస్తారు?": {"native": "When will the judge come?", "bases": {}}
    }
  "te-0082":
    native: "me (m + the e sign)"
    notes:
      "n1": "The e sign on top of మ (ma): మెడ (meḍa, neck)."
    "examples": {
      "అపాయింట్‌మెంట్ ఉందా?": {"native": "Do you have an appointment?", "bases": {}},
      "మెల్లగా నడవండి.": {"native": "Walk slowly.", "bases": {}}
    }
  "te-0083":
    native: "mee (m + the ee sign)"
    notes:
      "n1": "The ee sign on top of మ (ma), with its stroke: మేక (mēka, goat)."
    "examples": {
      "ఇది నిజమేనా?": {"native": "Is this true?", "bases": {}},
      "మేఘం కదులుతోంది.": {"native": "The cloud is moving.", "bases": {}}
    }
  "te-0084":
    native: "mo (m + the o sign)"
    notes:
      "n1": "The o sign on top of మ (ma), curling right: మొక్క (mokka, plant)."
    "examples": {
      "చలికాలం ఇప్పుడే మొదలైంది.": {"native": "Winter has just started.", "bases": {}},
      "చెక్‌ఇన్ ఎప్పుడు మొదలవుతుంది?": {"native": "When does check-in start?", "bases": {}}
    }
  "te-0085":
    native: "moo (m + the oo sign)"
    notes:
      "n1": "The oo sign on మ (ma): మోకాలు (mōkālu, knee)."
    "examples": {
      "గంట మోగింది.": {"native": "The bell rang.", "bases": {}},
      "రాజీనామా ఆమోదించారు.": {"native": "They accepted the resignation.", "bases": {}}
    }
