schema: 1
id: "te-en-directions"
kind: "layer"
core: "te-directions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Directions"
description: "Left, right, straight on, and asking where something is. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0293":
    native: "Where is …?"
    notes:
      "n1": "Put the place first: స్టేషన్ ఎక్కడ (sṭēṣan ekkaḍa)? Where's the station?"
  "te-0294":
    native: "right (side)"
    notes:
      "n1": "కుడి వైపు (kuḍi vaipu), to the right."
  "te-0295":
    native: "left (side)"
    notes:
      "n1": "ఎడమ వైపు (eḍama vaipu), to the left."
  "te-0296":
    native: "straight on"
  "te-0297":
    native: "please turn"
    notes:
      "n1": "కుడి వైపు తిరగండి (kuḍi vaipu tiragaṇḍi), turn right."
  "te-0298":
    native: "ahead; in front"
    "examples": {
      "భోజనానికి ముందు": {"native": "before the meal", "bases": {}},
      "ధైర్యంగా ముందుకు వెళ్ళు.": {"native": "Go forward bravely.", "bases": {}}
    }
  "te-0299":
    native: "behind"
  "te-0300":
    native: "near"
    alt_native: ["close by"]
    notes:
      "n1": "స్టేషన్ దగ్గర (sṭēṣan daggara), near the station."
    "examples": {
      "స్టేషన్ దగ్గర": {"native": "near the station", "bases": {}},
      "కూడలి దగ్గర ఆగండి.": {"native": "Please stop near the junction.", "bases": {}}
    }
  "te-0301":
    native: "far; distance"
    alt_native: ["far away"]
    notes:
      "n1": "ఎంత దూరం (enta dūram)? How far is it?"
    "examples": {
      "దూరంగా ఉరుముతోంది.": {"native": "It is thundering far away.", "bases": {}},
      "దూరంగా ఉరుము వినిపిస్తోంది.": {"native": "Thunder is heard in the distance.", "bases": {}}
    }
  "te-0302":
    native: "here"
    "examples": {
      "ఇక్కడ ఆడకండి.": {"native": "Please don't play here.", "bases": {"ఇక్కడ": "here"}}
    }
  "te-0303":
    native: "there"
  "te-0304":
    native: "way; route"
    notes:
      "n1": "దారి చెప్పండి (dāri ceppaṇḍi), please tell me the way."
    "examples": {
      "నేను దారి తప్పిపోయాను.": {"native": "I'm lost.", "bases": {"తప్పిపోయాను": "to get lost; to go astray"}}
    }
  "te-0305":
    native: "road"
    "examples": {
      "జాగ్రత్తగా రోడ్డు దాటుతాను.": {"native": "I cross the road carefully.", "bases": {}},
      "ఈ రోడ్డు వెడల్పు ఎంత?": {"native": "How wide is this road?", "bases": {}}
    }
