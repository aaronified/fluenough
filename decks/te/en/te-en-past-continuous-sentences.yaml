schema: 1
id: "te-en-past-continuous-sentences"
kind: "layer"
core: "te-past-continuous-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Was doing: sentences"
description: "Sentences of the past continuous, with a time such as then, each with the simple past or the present it is confused with. They unlock once their words and the rule are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "te-6525":
    native: "I was singing then."
    alt_native: ["I was singing at that time."]
    confusables:
      present: { why: "పాడుతున్నాను (pāḍutunnānu) is the same verb in the present, 'I am singing'. The past continuous puts -తూ (-tū) on the stem, then ఉన్నాను (unnānu) after it." }
      past: { why: "పాడాను (pāḍānu), 'I sang', is one finished act. The past continuous is an action going on at that time." }
  "te-6526":
    native: "She was washing the window then."
    alt_native: ["She was cleaning the window at that time."]
    confusables:
      present: { why: "కడుగుతోంది (kaḍugutōndi) is the present, 'she is washing'." }
      past: { why: "కడిగింది (kaḍigindi), 'she washed', is a finished act, with the verb's stem changed." }
  "te-6527":
    native: "The children were singing a song then."
    alt_native: ["The kids were singing a song at that time."]
    confusables:
      present: { why: "పాడుతున్నారు (pāḍutunnāru), 'they are singing', is the present." }
      past: { why: "పాడారు (pāḍāru), 'they sang', is a finished act with no 'going on'." }
  "te-6528":
    native: "We were walking around outside."
    alt_native: ["We were wandering outside."]
    confusables:
      present: { why: "తిరుగుతున్నాము (tirugutunnāmu), 'we are walking around', is the present." }
      past: { why: "తిరిగాము (tirigāmu), 'we walked around', is a finished trip." }
  "te-6529":
    native: "You were thinking then."
    alt_native: ["You were thinking at that time."]
    confusables:
      present: { why: "ఆలోచిస్తున్నావు (ālōcistunnāvu), 'you are thinking', is the present, said to a friend or child." }
      past: { why: "ఆలోచించావు (ālōciñcāvu), 'you thought', is a finished act." }
  "te-6530":
    native: "You were running then."
    alt_native: ["You were running at that time."]
    confusables:
      present: { why: "పరిగెత్తుతున్నారు (parigettutunnāru), 'you are running', is the present, said to someone you respect." }
      past: { why: "పరిగెత్తారు (parigettāru), 'you ran', is a finished act." }
  "te-6531":
    native: "He was catching the bus then."
    alt_native: ["He was getting on the bus at that time."]
    confusables:
      present: { why: "పట్టుకుంటున్నాడు (paṭṭukuṇṭunnāḍu), 'he is catching', is the present." }
      past: { why: "పట్టుకున్నాడు (paṭṭukunnāḍu), 'he caught', is one finished act." }
  "te-6532":
    native: "Mother was mixing the milk then."
    alt_native: ["Mum was mixing the milk at that time."]
    confusables:
      present: { why: "కలుపుతోంది (kaluputōndi) is the present, 'she is mixing'." }
      past: { why: "కలిపింది (kalipindi), 'she mixed', is a finished act." }
