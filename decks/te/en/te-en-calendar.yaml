cards:
  "te-0325":
    native: "month"
    notes:
      "n1": "The Telugu calendar's months mark festivals such as ఉగాది (ugādi), the new year; daily life uses the Gregorian months."
  "te-0326":
    native: "year"
    notes:
      "n1": "A year is read as a number: 2020 is రెండు వేల ఇరవై (reṇḍu vēla iravai)."
