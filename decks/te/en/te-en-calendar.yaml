id: "te-en-calendar"
kind: "layer"
core: "te-calendar"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Months and years"
description: "The months as Telugu says them, and how to read a year. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0325":
    native: "month"
    notes:
      "n1": "The Telugu calendar's months mark festivals such as ఉగాది (ugādi), the new year; daily life uses the Gregorian months."
    "examples": {
      "నెల వేతనం ఎంత?": {"native": "What is the monthly salary?", "bases": {}},
      "ఈ నెల ఫీజు కట్టాలి.": {"native": "This month's fee must be paid.", "bases": {}}
    }
  "te-0326":
    native: "year"
    notes:
      "n1": "A year is read as a number: 2020 is రెండు వేల ఇరవై (reṇḍu vēla iravai)."
  "te-0327":
    native: "date"
    "examples": {
      "పెళ్ళిపత్రికలో తేదీ, సమయం ఉన్నాయి.": {"native": "The date and time are on the wedding card.", "bases": {}}
    }
  "te-0328":
    notes:
      "n1": "జనవరి (janavari), January, is the English month name written in Telugu letters, so it sounds close to the English."
    native: "January"
  "te-0329":
    notes:
      "n1": "ఫిబ్రవరి (phibravari), February, is the English month name written in Telugu letters, so it sounds close to the English."
    native: "February"
