schema: 1
id: "te-en-grammar-imperatives"
kind: "layer"
core: "te-grammar-imperatives"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Commands"
description: "Telling someone what to do: the short form for one person (నువ్వు, nuvvu), the polite form for someone you call మీరు (mīru), and the negative with -కు (-ku) and -కండి (-kaṇḍi). Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "te-2000":
    native: "Come."
    notes:
      "n1": "Short form to one person (నువ్వు, nuvvu): the command is రా (rā), the short form of రావడం (rāvaḍam), come."
  "te-2001":
    native: "Come here."
    notes:
      "n1": "ఇక్కడ (ikkaḍa), here, comes before the verb. Short form to one person."
  "te-2002":
    native: "Go."
    notes:
      "n1": "Short form to one person of వెళ్ళడం (veḷḷaḍam), go."
  "te-2003":
    native: "Go now."
    notes:
      "n1": "ఇప్పుడు (ippuḍu), now, comes before the verb."
  "te-2004":
    native: "Sit."
    notes:
      "n1": "Short form to one person of కూర్చోవడం (kūrcōvaḍam), sit."
  "te-2005":
    native: "Sit here."
    notes:
      "n1": "ఇక్కడ (ikkaḍa), here, comes before the verb."
  "te-2006":
    native: "Eat."
    notes:
      "n1": "Short form to one person of తినడం (tinaḍam), eat."
  "te-2007":
    native: "Eat this."
    notes:
      "n1": "ఇది (idi), this, is the thing eaten, so it comes before the verb."
  "te-2008":
    native: "Drink water."
    notes:
      "n1": "Short form to one person of తాగడం (tāgaḍam), drink. The thing drunk comes first: నీళ్ళు (nīḷḷu), water."
  "te-2009":
    native: "Drink tea."
    notes:
      "n1": "Short form to one person of తాగడం (tāgaḍam), drink. టీ (ṭī), tea, comes first."
  "te-2010":
    native: "Look."
    notes:
      "n1": "Short form to one person of చూడడం (cūḍaḍam), look or see."
  "te-2011":
    native: "Listen."
    notes:
      "n1": "Short form to one person of వినడం (vinaḍam), listen."
  "te-2012":
    native: "Say it slowly."
    notes:
      "n1": "నెమ్మదిగా (nemmadigā), slowly, comes before the verb. Short form of చెప్పడం (ceppaḍam), tell or say."
  "te-2013":
    native: "Tell me."
    notes:
      "n1": "నాకు (nāku), to me: the one who receives takes -కు (-ku). Short form of చెప్పడం (ceppaḍam), tell."
  "te-2014":
    native: "Give me."
    notes:
      "n1": "నాకు (nāku), to me, comes before the verb. Short form of ఇవ్వడం (ivvaḍam), give."
  "te-2015":
    native: "Take the book."
    notes:
      "n1": "Short form of తీసుకోవడం (tīsukōvaḍam), take. The thing taken comes first: పుస్తకం (pustakaṁ), book."
  "te-2016":
    native: "Bring the phone."
    notes:
      "n1": "ఫోన్ (fōn), phone, comes first. తీసుకురా (tīsukurā) is the short form of తేవడం (tēvaḍam), bring, with తీసుకు (tīsuku), take, before it."
  "te-2017":
    native: "Stay."
    notes:
      "n1": "Short form to one person of ఉండడం (uṇḍaḍam), stay."
  "te-2018":
    native: "Stay here."
    notes:
      "n1": "ఇక్కడ (ikkaḍa), here, comes before the verb."
  "te-2019":
    native: "Sleep."
    notes:
      "n1": "Short form to one person of నిద్రపోవడం (nidrapōvaḍam), sleep."
  "te-2020":
    native: "Play."
    notes:
      "n1": "Short form to one person of ఆడడం (āḍaḍam), play."
  "te-2021":
    native: "Read the book."
    notes:
      "n1": "Short form of చదవడం (cadavaḍam), read. The thing read comes first: పుస్తకం (pustakaṁ), book."
  "te-2022":
    native: "Write here."
    notes:
      "n1": "ఇక్కడ (ikkaḍa), here, comes before the verb. Short form of రాయడం (rāyaḍam), write."
  "te-2023":
    native: "Stand up."
    notes:
      "n1": "Short form to one person of నిలబడడం (nilabaḍaḍam), stand."
  "te-2024":
    native: "Walk slowly."
    notes:
      "n1": "నెమ్మదిగా (nemmadigā), slowly, comes before the verb. Short form of నడవడం (naḍavaḍam), walk."
  "te-2025":
    native: "Don't go."
    notes:
      "n1": "Negative to one person: the verb takes -కు (-ku). Compare the polite negative in te-2036."
  "te-2026":
    native: "Don't eat."
    notes:
      "n1": "Negative to one person: the verb takes -కు (-ku)."
  "te-2027":
    native: "Don't go now."
    notes:
      "n1": "ఇప్పుడు (ippuḍu), now, comes before the verb. Negative to one person: -కు (-ku)."
  "te-2028":
    native: "Don't play."
    notes:
      "n1": "Negative to one person: the verb takes -కు (-ku)."
  "te-2029":
    native: "Don't tell."
    notes:
      "n1": "Negative to one person: the verb takes -కు (-ku)."
  "te-2030":
    native: "Come (polite)."
    notes:
      "n1": "Polite form, to someone you call మీరు (mīru), or to a group: the verb takes -ండి (-ṇḍi). This is the 'please' form in the verb table."
  "te-2031":
    native: "Sit here (polite)."
    notes:
      "n1": "ఇక్కడ (ikkaḍa), here, comes before the verb. Polite form, -ండి (-ṇḍi)."
  "te-2032":
    native: "Please go."
    notes:
      "n1": "దయచేసి (dayacēsi), please, comes first. Polite form of వెళ్ళడం (veḷḷaḍam), go."
  "te-2033":
    native: "Please tell me."
    notes:
      "n1": "దయచేసి (dayacēsi), please, comes first. Polite form of చెప్పడం (ceppaḍam), tell."
  "te-2034":
    native: "Drink some water."
    notes:
      "n1": "Polite form of తాగడం (tāgaḍam), drink. The thing drunk comes first: నీళ్ళు (nīḷḷu), water."
  "te-2035":
    native: "Please eat."
    notes:
      "n1": "Polite form of తినడం (tinaḍam), eat."
  "te-2036":
    native: "Please don't eat."
    notes:
      "n1": "Polite negative: the verb takes -కండి (-kaṇḍi)."
  "te-2037":
    native: "Please don't play here."
    notes:
      "n1": "ఇక్కడ (ikkaḍa), here, comes before the verb. Polite negative: -కండి (-kaṇḍi)."
  "te-2038":
    native: "Please don't take photos."
    notes:
      "n1": "ఫోటోలు (fōṭōlu), photos, comes first. Polite negative of తీయడం (tīyaḍaṁ), take. The sign form is in te-0497: ఫోటోలు తీయకూడదు (fōṭōlu tīyakūḍadu)."
