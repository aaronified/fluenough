        "bases":
          "గోడపై":
            "meaning": "wall"
          "వేసింది":
            "meaning": "to put; to paint"
    "notes":
      "n1": "The woman form of చిత్రకారుడు (citrakāruḍu). Working as a painter: {1}."
  "te-4902":
