  "te-4901":
    "native": "woman painter; female artist who paints"
    "examples":
      "ఆమె మంచి చిత్రకారిణి.":
        "native": "She is a good painter."
      "ఆ చిత్రకారిణి గోడపై పెద్ద చిత్రం వేసింది.":
