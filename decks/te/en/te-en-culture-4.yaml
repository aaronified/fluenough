# Layer for te-culture-4: each verse with a literal English rendering, its meaning and each word's gloss.
schema: 1
id: "te-en-culture-4"
kind: "layer"
core: "te-culture-4"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: verse of moral teaching (Vemana)"
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
description: "Eighteen short verses of moral teaching attributed to Yogi Vemana, from a Telugu Wikisource transcription. Each shows the Telugu verse, a literal English rendering and its meaning. Not yet checked by a Telugu speaker: please report any mistake."

cards:
  "te-8900":
    native: "Of all gifts, the gift of food is the greatest; there are no greater people than parents; counted up, none is higher than the guru."
    notes:
      "n1": "The poet ranks the giving of food above every other gift, and puts parents and the teacher above everyone else. Each verse ends with the same signature line."
    bases:
      "దానములను": { meaning: "gifts" }
      "నన్నదానమె": { meaning: "the gift of food, emphatically" }
      "గొప్ప": { meaning: "great; greatest" }
      "కన్నవారికంటె": { meaning: "parents, those who gave one birth; than parents" }
      "ఘనులు": { meaning: "great people" }
      "లేరు": { meaning: "there are none; there is no one" }
      "ఎన్న": { meaning: "to count; when counted" }
      "గురునికన్న": { meaning: "teacher, guru; than the guru" }
      "నెక్కువలేదయా": { meaning: "more; there is nothing more" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినురవేమ": { meaning: "listen, Vema, the poet's signature" }
  "te-8901":
    native: "Though there are many faiths and any mantra, whoever lacks this much truth lets them slip; whoever has truth becomes twice-born in the world."
    notes:
      "n1": "The poet says that truth matters more than any faith or mantra. Twice-born is a word for the upper castes, and here the verse uses it for a person who is truly worthy."
    bases:
      "ఎన్నిమతములైన": { meaning: "religion; even if there are many religions" }
      "ఏమంత్రమైనను": { meaning: "mantra, spell; whatever mantra" }
      "సత్యమింతలేక": { meaning: "truth; without this much truth" }
      "జారవిడచు": { meaning: "to let slip; to let go of" }
      "సత్యముకలిగున్న": { meaning: "truth; one who has truth" }
      "జగతిలో": { meaning: "world; in the world" }
      "ద్విజుడగున్": { meaning: "twice-born; will become twice-born" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినురవేమ": { meaning: "listen, Vema, the poet's signature" }
  "te-8902":
    native: "A lowly man, however much learning he takes up in this world, does not become great; only a base person stays base; can perfume become great when a donkey carries it?"
    notes:
      "n1": "The verse uses a donkey carrying perfume as an image. A base person gains no worth from learning."
    bases:
      "హీనుఁ": { meaning: "a lowly, base man" }
      "డెన్నివిద్య": { meaning: "however many kinds of learning" }
      "లిల": { meaning: "on earth; in this world" }
      "నభ్యసించిన": { meaning: "to learn; having learned, even if" }
      "ఘనుఁడు": { meaning: "great person" }
      "గాఁడు": { meaning: "is not" }
      "హీనజనుఁడె": { meaning: "lowly person; only a lowly person" }
      "కాని": { meaning: "except; but" }
      "పరిమళమ్ము": { meaning: "fragrance, perfume" }
      "గర్దభము": { meaning: "donkey" }
      "మోయ": { meaning: "to carry; when carried" }
      "ఘనమౌనె": { meaning: "greatness; will it become great?" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినర": { meaning: "listen" }
      "వేమ": { meaning: "Vema, the poet's name" }
  "te-8903":
    native: "Hiding wealth in the house, thinking it his treasure, the stubborn creature buries it in the earth; he will not take even a cowry shell along with him."
    notes:
      "n1": "A miser keeps his money hidden and believes it is his own. At death nothing goes with him, not even a small cowry shell, which was once used as money."
    bases:
      "ఇంటిలోనిధనము": { meaning: "wealth kept in the house" }
      "నిదినాది": { meaning: "this is mine" }
      "యనుచును": { meaning: "saying; thinking" }
      "మంటిలోనఁదాచు": { meaning: "to hide; to bury in the earth" }
      "మంకుజీవి": { meaning: "stubborn creature, a miser" }
      "కొంచఁబోడు": { meaning: "to take along; here 'will not take along'" }
      "వెంట": { meaning: "along; after him" }
      "గుల్లకాసును": { meaning: "cowry shell, a coin of little worth" }
      "రాదు": { meaning: "to come; will not come" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినర": { meaning: "listen" }
      "వేమ": { meaning: "Vema, the poet's name" }
  "te-8904":
    native: "A petty man always speaks with show, and a good man speaks calmly; does gold ring the way bronze rings?"
    notes:
      "n1": "The poet compares the petty man to bronze, which rings loudly and hollow, and the good man to gold, which is quiet. The question expects the answer no."
    bases:
      "అల్పుఁ": { meaning: "a petty, small man" }
      "డెపుడు": { meaning: "always, at all times" }
      "బల్కు": { meaning: "speaks" }
      "నాడంబరము": { meaning: "show, pomp, ostentation" }
      "గాను": { meaning: "in the manner of, as" }
      "సజ్జనుండు": { meaning: "good man" }
      "బలుకుఁ": { meaning: "speaks" }
      "జల్లగాను": { meaning: "calmly, softly" }
      "కంచు": { meaning: "bronze" }
      "మ్రోగునట్లు": { meaning: "to ring; as it rings" }
      "కనకంబు": { meaning: "gold" }
      "మ్రోగునా": { meaning: "does it ring?" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినర": { meaning: "listen" }
      "వేమ": { meaning: "Vema, the poet's name" }
  "te-8905":
    native: "Tall and broad, with a long beard, but without the quality of giving, is he a giver? Can a big buffalo ever be like an elephant?"
    notes:
      "n1": "Vemana mocks outward size and appearance: a man is judged a giver by what he gives, not by his looks. The verse closes with the poet's signature line."
    bases:
      "ఒడ్డుపొడుగుగల్గి": { meaning: "tall and broad in build" }
      "గడ్డంబునిడుపైన": { meaning: "with a long beard" }
      "దానగుణములేక": { meaning: "the quality of giving" }
      "దాతయౌనె": { meaning: "a giver; is he a giver?" }
      "యెనుము": { meaning: "buffalo" }
      "గొప్పదైన": { meaning: "big, great" }
      "యేనుగున్": { meaning: "elephant" }
      "బోలునా": { meaning: "to be like, to equal" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినురవేమ": { meaning: "listen, Vema, the poet's signature" }
  "te-8906":
    native: "Because one lacks fortune, to blame others, saying 'the giver did not give', is all a foolish mind; through having or not having wealth, hardship seems to arise."
    notes:
      "n1": "The verse mocks people who blame others for not giving to them because they lack fortune. The poet's signature closes it. One word in the second line of the verse is tentative and is in the review queue."
    bases:
      "తనకు": { meaning: "to oneself" }
      "ప్రాప్తిలేక": { meaning: "good fortune; without it" }
      "దాత": { meaning: "the giver" }
      "ఈలేదంచు": { meaning: "did not give" }
      "ఒరులదూరుటెల్ల": { meaning: "others; blaming them, all of it" }
      "ఓగుబుద్ధి": { meaning: "a foolish mind (tentative)" }
      "కలిమిలేమికతన": { meaning: "having wealth; and its lack" }
      "కష్టమ్ముతోచురా": { meaning: "hardship; seems to arise" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినురవేమ": { meaning: "listen, Vema, the poet's signature" }
  "te-8907":
    native: "Whether the wealth is a father's, a cousin's or another's, gained by any means, the one who gives gifts to the poor out of compassion is a person of great merit."
    notes:
      "n1": "The verse says that whatever the source of the wealth, giving to the poor out of compassion is meritorious. The verse closes with the signature."
    bases:
      "తండ్రిసొమ్మునైన": { meaning: "wealth; even a father's wealth" }
      "దాయాదిసొమ్మైనఁ": { meaning: "wealth; or a cousin's wealth" }
      "బరులసొమ్మునయినఁ": { meaning: "others; others' wealth" }
      "బ్రాప్తధనము": { meaning: "wealth, gained" }
      "దయను": { meaning: "compassion" }
      "దీనులకును": { meaning: "the poor" }
      "దాన": { meaning: "gift" }
      "మిచ్చినవాఁడె": { meaning: "to give; the one who gave" }
      "బహుళపుణ్యజనుఁడు": { meaning: "a person of great merit" }
      "పరఁగ": { meaning: "is famous as, is truly" }
      "వేమ": { meaning: "Vema, the poet's name" }
  "te-8908":
    native: "One who begs for gifts is lowly on earth; one who does not beg is godlike; one who gives no gift is not blessed."
    notes:
      "n1": "The verse sets the one who asks for gifts against the one who does not ask, then says the one who does not give is not blessed. The poet ends with his signature."
    bases:
      "దానమడుగువాఁడు": { meaning: "the one who asks for a gift" }
      "ధరలోన": { meaning: "the earth" }
      "నధముండు": { meaning: "a lowly person" }
      "దానమడుగఁడేని": { meaning: "if one does not ask" }
      "దైవసముఁడు": { meaning: "godlike" }
      "దానమీనివాఁడు": { meaning: "the one who gives no gift" }
      "ధన్యుండు": { meaning: "blessed" }
      "కాఁడయా": { meaning: "is not (emphatic)" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినర": { meaning: "listen" }
      "వేమ": { meaning: "Vema, the poet's name" }
  "te-8909":
    native: "For all the people of the earth there are many penances and prayers, yet there is a likeness for seeing Shiva: keep the mind undisturbed and look within the heart."
    notes:
      "n1": "The poet says that outward penance and prayer are many, but the way to see Shiva is inward stillness. The verse ends with the signature line."
    bases:
      "తపముజపములెన్నొ": { meaning: "penance; prayers, however many" }
      "ధాత్రిజనుల": { meaning: "people; of the people of the earth" }
      "కెల్ల": { meaning: "for all" }
      "నొనర": { meaning: "well, truly" }
      "శివునిఁజూడ": { meaning: "to see (Shiva)" }
      "నుపమగలదు": { meaning: "a likeness" }
      "మనసుఁజెదరనీక": { meaning: "the mind; not letting it be disturbed" }
      "మదిలోనఁజూడరో": { meaning: "look within the heart" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినర": { meaning: "listen" }
      "వేమ": { meaning: "Vema, the poet's name" }
  "te-8910":
    native: "Having cast off everything, quenched the fire, tied the loincloth tight and subdued anger, the man who gives up desire is a yogi."
    notes:
      "n1": "The verse describes an ascetic who gives up desire and subdues anger, and calls him a yogi. The word read here as 'everything' is tentative and is in the review queue."
    bases:
      "అన్నిగోసివేసి": { meaning: "having cast off all (tentative)" }
      "యనలంబు": { meaning: "fire" }
      "చల్లార్చి": { meaning: "having quenched, cooled" }
      "గోచిబిగియఁగట్టి": { meaning: "having tied the loincloth tight" }
      "కోప": { meaning: "anger" }
      "మడచి": { meaning: "having subdued" }
      "యాసవిడిచెనేని": { meaning: "if one gives up desire" }
      "యతఁడు": { meaning: "he, that man" }
      "తా": { meaning: "himself" }
      "యోగిరా": { meaning: "is a yogi" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినర": { meaning: "listen" }
      "వేమ": { meaning: "Vema, the poet's name" }
  "te-8911":
    native: "Whose property is the body that one tends as one's own? Whose wealth is what one hoards? Whose property is life, which one keeps from departing?"
    notes:
      "n1": "The poet asks whose the body, wealth and life really are, a question about ownership and impermanence. The verse ends with the signature line."
    bases:
      "తనువ": { meaning: "the body, as property" }
      "దెవరిసొమ్ము": { meaning: "whose property?" }
      "తనదని": { meaning: "one's own, as one thinks" }
      "పోషింప": { meaning: "to tend, to nourish" }
      "ధనమదెవరిసొమ్ము": { meaning: "wealth; whose property is it?" }
      "దాచుకొనఁగ": { meaning: "to hoard" }
      "ప్రాణ": { meaning: "life" }
      "మెవరిసొమ్ము": { meaning: "whose property?" }
      "పాయకుండఁగ": { meaning: "to depart" }
      "నిల్ప": { meaning: "to keep, to hold" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినర": { meaning: "listen" }
      "వేమ": { meaning: "Vema, the poet's name" }
  "te-8912":
    native: "A man who does not use his hands to give gifts gathers much wealth and buries it, and in the end wastes it, losing even the capital he gathered."
    notes:
      "n1": "The poet describes a miser who buries his wealth instead of giving it away, and who loses even his capital in the end. The reading of the last line is tentative and is in the review queue."
    bases:
      "దానములను": { meaning: "gifts" }
      "జేయఁ": { meaning: "to give" }
      "దన": { meaning: "his own" }
      "చేతులాడక": { meaning: "not moving his hands (not giving)" }
      "బహుధనంబుఁగూర్చి": { meaning: "much wealth, gathered" }
      "పాతిపెట్టు": { meaning: "buries" }
