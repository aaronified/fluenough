# Layer for te-culture-4: each verse with a literal English rendering, its meaning and each word's gloss.
schema: 1
id: "te-en-culture-4"
kind: "layer"
core: "te-culture-4"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: verse of moral teaching (Vemana)"
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
description: "Five short verses of moral teaching attributed to Yogi Vemana, from a Telugu Wikisource transcription. Each shows the Telugu verse, a literal English rendering and its meaning. Not yet checked by a Telugu speaker: please report any mistake."

cards:
  "te-8900":
    native: "Of all gifts, the gift of food is the greatest; there are no greater people than parents; counted up, none is higher than the guru."
    notes:
      "n1": "The poet ranks the giving of food above every other gift, and puts parents and the teacher above everyone else. Each verse ends with the same signature line."
    bases:
      "దానములను": { meaning: "gifts" }
      "నన్నదానమె": { meaning: "the gift of food, emphatically" }
      "గొప్ప": { meaning: "great; greatest" }
      "కన్నవారికంటె": { meaning: "parents, those who gave one birth; than parents" }
      "ఘనులు": { meaning: "great people" }
      "లేరు": { meaning: "there are none; there is no one" }
      "ఎన్న": { meaning: "to count; when counted" }
      "గురునికన్న": { meaning: "teacher, guru; than the guru" }
      "నెక్కువలేదయా": { meaning: "more; there is nothing more" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినురవేమ": { meaning: "listen, Vema, the poet's signature" }
  "te-8901":
    native: "Though there are many faiths and any mantra, whoever lacks this much truth lets them slip; whoever has truth becomes twice-born in the world."
    notes:
      "n1": "The poet says that truth matters more than any faith or mantra. Twice-born is a word for the upper castes, and here the verse uses it for a person who is truly worthy."
    bases:
      "ఎన్నిమతములైన": { meaning: "religion; even if there are many religions" }
      "ఏమంత్రమైనను": { meaning: "mantra, spell; whatever mantra" }
      "సత్యమింతలేక": { meaning: "truth; without this much truth" }
      "జారవిడచు": { meaning: "to let slip; to let go of" }
      "సత్యముకలిగున్న": { meaning: "truth; one who has truth" }
      "జగతిలో": { meaning: "world; in the world" }
      "ద్విజుడగున్": { meaning: "twice-born; will become twice-born" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినురవేమ": { meaning: "listen, Vema, the poet's signature" }
  "te-8902":
    native: "A lowly man, however much learning he takes up in this world, does not become great; only a base person stays base. Can perfume become great when a donkey carries it?"
    notes:
      "n1": "The verse uses a donkey carrying perfume: the donkey does not know the value of what it carries. A base person gains no worth from learning."
    bases:
      "హీనుఁ": { meaning: "a lowly, base man" }
      "డెన్నివిద్య": { meaning: "learning; however many kinds of learning" }
      "లిల": { meaning: "on earth; in this world" }
      "నభ్యసించిన": { meaning: "to learn; having learned, even if" }
      "ఘనుఁడు": { meaning: "great person" }
      "గాఁడు": { meaning: "is not" }
      "హీనజనుఁడె": { meaning: "lowly person; only a lowly person" }
      "కాని": { meaning: "except; but" }
      "పరిమళమ్ము": { meaning: "fragrance, perfume" }
      "గర్దభము": { meaning: "donkey" }
      "మోయ": { meaning: "to carry; when carried" }
      "ఘనమౌనె": { meaning: "greatness; will it become great?" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినర": { meaning: "listen" }
      "వేమ": { meaning: "Vema, the poet's name" }
  "te-8903":
    native: "Hiding wealth in the house, thinking it his treasure, the stubborn creature buries it in the earth; not even a little comes along after him, not even a cowry shell."
    notes:
      "n1": "A miser keeps his money hidden and believes it is his own. At death nothing goes with him, not even a small cowry shell, which was once used as money."
    bases:
      "ఇంటిలోనిధనము": { meaning: "wealth kept in the house" }
      "నిదినాది": { meaning: "treasure; my treasure" }
      "యనుచును": { meaning: "saying; thinking" }
      "మంటిలోనఁదాచు": { meaning: "to hide; to bury in the earth" }
      "మంకుజీవి": { meaning: "stubborn creature, a miser" }
      "కొంచఁబోడు": { meaning: "a little; not even a little" }
      "వెంట": { meaning: "along; after him" }
      "గుల్లకాసును": { meaning: "cowry shell, a coin of little worth" }
      "రాదు": { meaning: "to come; will not come" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినర": { meaning: "listen" }
      "వేమ": { meaning: "Vema, the poet's name" }
  "te-8904":
    native: "A petty man always speaks with show, and a good man speaks calmly. Does gold ring the way bronze rings?"
    notes:
      "n1": "The poet compares the petty man to bronze, which rings loudly and hollow, and the good man to gold, which is quiet. The question expects the answer no."
    bases:
      "అల్పుఁ": { meaning: "a petty, small man" }
      "డెపుడు": { meaning: "always, at all times" }
      "బల్కు": { meaning: "speaks" }
      "నాడంబరము": { meaning: "show, pomp, ostentation" }
      "గాను": { meaning: "in the manner of, as" }
      "సజ్జనుండు": { meaning: "good man" }
      "బలుకుఁ": { meaning: "speaks" }
      "జల్లగాను": { meaning: "calmly, softly" }
      "కంచు": { meaning: "bronze" }
      "మ్రోగునట్లు": { meaning: "to ring; as it rings" }
      "కనకంబు": { meaning: "gold" }
      "మ్రోగునా": { meaning: "does it ring?" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినర": { meaning: "listen" }
      "వేమ": { meaning: "Vema, the poet's name" }
