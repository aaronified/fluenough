      "దండుగ": { meaning: "waste" }
      "నిడు": { meaning: "gives, pays" }
      "మొదలు": { meaning: "the capital, the principal (tentative)" }
      "చేర్చునరుండు": { meaning: "the one who gathers" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినర": { meaning: "listen" }
      "వేమ": { meaning: "Vema, the poet's name" }
  "te-8913":
    native: "Reading again and again yields only logic-chopping, and divine knowledge does not become clear; like a worm in an unripe fruit, one is ruined."
    notes:
      "n1": "The poet warns that repeated reading produces only argument and not clear divine knowledge. He compares such a learner to a worm in an unripe fruit. The verse closes with the signature."
    bases:
      "తఱచు": { meaning: "often, repeatedly" }
      "చదువు": { meaning: "reading, study" }
      "చదువఁ": { meaning: "to read" }
      "దర్కవాదమె": { meaning: "argument, logic-chopping" }
      "కాని": { meaning: "but, only" }
      "దివ్యజ్ఞాన": { meaning: "divine knowledge" }
      "మన్న": { meaning: "what is called" }
      "తేటపడదు": { meaning: "to become clear" }
      "పసిరికాయపురుగు": { meaning: "a worm in an unripe fruit" }
      "పగిదిని": { meaning: "like, in the manner of" }
      "చెడిపోవు": { meaning: "to be ruined" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినర": { meaning: "listen" }
      "వేమ": { meaning: "Vema, the poet's name" }
  "te-8914":
    native: "Giving, dharma, compassion, truth, morality, humility, courage, valour and generosity are, for a king, the royal yogas."
    notes:
      "n1": "The poet lists the virtues a king should keep, among them humility and generosity. The verse is a list of virtues rather than a single argument."
    bases:
      "దానధర్మములును": { meaning: "giving and dharma" }
      "దయయు": { meaning: "compassion" }
      "సత్యము": { meaning: "truth" }
      "నీతి": { meaning: "morality" }
      "వినయ": { meaning: "humility" }
      "ధైర్య": { meaning: "courage" }
      "శౌర్య": { meaning: "valour" }
      "వితరణములు": { meaning: "generosity, lavish giving" }
      "రాజుపాలిటి": { meaning: "for a king" }
      "కివి": { meaning: "these" }
      "రాజయోగంబులు": { meaning: "royal yoga" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినర": { meaning: "listen" }
      "వేమ": { meaning: "Vema, the poet's name" }
  "te-8915":
    native: "The whole universe dwells within an atom, and the atom is humbled within itself; a person who holds the mind steady reaches liberation."
    notes:
      "n1": "The poet says that the whole universe is held within the smallest thing, and that a steady mind leads to liberation. The verse ends with the signature line."
    bases:
      "అణువులోన": { meaning: "in an atom" }
      "నుండు": { meaning: "dwells, is" }
      "నఖిలజగంబులు": { meaning: "the whole universe" }
      "నణువు": { meaning: "the atom" }
      "తనదులోన": { meaning: "within its own" }
      "నణఁగియుండు": { meaning: "is humbled, subdued" }
      "మనసు": { meaning: "the mind" }
      "నిల్ప": { meaning: "to hold steady" }
      "నరుఁడు": { meaning: "a person" }
      "మఱిముక్తిఁ": { meaning: "then liberation" }
      "జేరురా": { meaning: "reaches" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినర": { meaning: "listen" }
      "వేమ": { meaning: "Vema, the poet's name" }
  "te-8916":
    native: "If one asks only rarely, one is not a beggar; if one seldom gives, one is not a giver; the giver and the asker differ by exactly this much."
    notes:
      "n1": "The poet compares the giver with the one who asks, and says that how often each acts decides which is which. The verse ends with the signature line."
    bases:
      "అరుదుగా": { meaning: "rarely" }
      "నడిగిన": { meaning: "if one asks" }
      "యతఁడర్థిగాఁబోడు": { meaning: "does not become a beggar" }
      "తఱచుగా": { meaning: "often" }
      "నొసగక": { meaning: "not giving" }
      "దాతగాఁడు": { meaning: "is not a giver" }
      "దాత": { meaning: "a giver" }
      "కర్థి": { meaning: "the one who asks" }
      "కింత": { meaning: "this much" }
      "తారతమ్యము": { meaning: "difference" }
      "సుమా": { meaning: "indeed" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినర": { meaning: "listen" }
      "వేమ": { meaning: "Vema, the poet's name" }
  "te-8917":
    native: "One who makes the body and the form of the self plainly clear and shows what lies beyond is the guru, as a beetle gives its own form to worms."
    notes:
      "n1": "The poet describes a guru as one who makes the body and the self plain and shows the far shore. He compares this to a beetle that turns worms into its own kind. The verse ends with the signature."
    bases:
      "దేహ": { meaning: "body" }
      "యాత్మరూపు": { meaning: "the self, as its form" }
      "తేట": { meaning: "clear" }
      "తెల్లము": { meaning: "plainly" }
      "జేసి": { meaning: "having made" }
      "ఆవలి": { meaning: "the far shore" }
      "చూపుచూచు": { meaning: "shows, and looks on (a compound of show and see)" }
      "నతడె": { meaning: "he" }
      "గురువు": { meaning: "guru" }
      "భ్రమరము": { meaning: "beetle" }
      "తనరూపు": { meaning: "its own" }
      "క్రిముల": { meaning: "worms" }
      "కిచ్చినరీతి": { meaning: "as it gives" }
      "విశ్వదాభిరామ": { meaning: "beloved of Viswada, the poet's signature" }
      "వినురవేమ": { meaning: "listen, Vema, the poet's signature" }
