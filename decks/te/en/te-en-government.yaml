        "bases":
          "పత్రాలు":
            "meaning": "document"
          "కోసం":
            "meaning": "for; for the sake of"
    "notes":
      "n1": "{1} is citizenship; {2} is a citizen."
    wiktionary: true
  "te-4029":
    "native": "condition; regulation"
    "examples":
      "ఈ నిబంధన ఎవరికి వర్తిస్తుంది?":
        "native": "Who does this condition apply to?"
        "bases":
          "ఎవరికి":
            "meaning": "who"
          "వర్తిస్తుంది":
            "meaning": "to apply"
