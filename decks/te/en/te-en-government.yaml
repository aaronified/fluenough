        "bases":
          "నిబంధనలు":
            "meaning": "condition"
          "చదివారా":
            "meaning": "to read"
    "notes":
      "n1": "{1} is a condition or regulation; the plural {2} takes -లు (-lu)."
  "te-4030":
    "native": "department; division"
    "notes":
      "n1": "Ends in -ం (-aṁ), but it is an office, a thing, so amahat. The plural is విభాగాలు (vibhāgālu)."
    "examples":
      "ఆరోగ్య విభాగం కొత్త నియమాలు ప్రకటించింది.":
        "native": "The health department announced new rules."
        "bases":
          "ఆరోగ్య": { "meaning": "health" }
          "విభాగం": { "meaning": "department" }
          "కొత్త": { "meaning": "new" }
          "నియమాలు": { "meaning": "rules" }
          "ప్రకటించింది": { "meaning": "to announce" }
      "ఈ పని కోసం సంబంధిత విభాగాన్ని సంప్రదించండి.":
        "native": "Contact the relevant department for this work."
        "bases":
          "ఈ": { "meaning": "this" }
          "పని": { "meaning": "work" }
          "కోసం": { "meaning": "for" }
          "సంబంధిత": { "meaning": "relevant" }
          "విభాగాన్ని": { "meaning": "department" }
          "సంప్రదించండి": { "meaning": "to contact" }
    wiktionary: true
