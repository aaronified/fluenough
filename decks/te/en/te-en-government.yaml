"schema": 1
"id": "te-en-government"
"kind": "layer"
"core": "te-government"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Government: offices, forms, laws and elections"
"description": "Words for dealing with the government: offices and officers, forms and certificates, laws, elections and voting, and the people who run them. Not yet checked by a Telugu speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "te-4000":
    "native": "government"
    "examples":
      "ప్రభుత్వం కొత్త పథకం ప్రకటించింది.":
        "native": "The government announced a new scheme."
        "bases":
          "ప్రకటించింది":
            "meaning": "to announce"
      "ప్రభుత్వ కార్యాలయం ఎక్కడ ఉంది?":
        "native": "Where is the government office?"
        "bases":
          "ప్రభుత్వ":
            "meaning": "government"
          "ఉంది":
            "meaning": "to be"
    "notes":
      "n1": "{1} is the government as a whole; {2} is a government job."
    wiktionary: true
  "te-4004":
    "native": "law; act"
    "examples":
      "ఈ చట్టం అందరికీ వర్తిస్తుంది.":
        "native": "This law applies to everyone."
        "bases":
          "అందరికీ":
            "meaning": "everyone"
          "వర్తిస్తుంది":
            "meaning": "to apply"
      "చట్టం ముందు అందరూ సమానమే.":
        "native": "Everyone is equal before the law."
        "bases":
          "సమానమే":
            "meaning": "equal"
    "notes":
      "n1": "{1} is a law; the plural {2} changes the stem: the final -ం (-ṁ) becomes -ా (-ā) before -లు (-lu)."
    wiktionary: true
  "te-4005":
    "native": "election; the act of choosing"
    "examples":
      "ఎన్నికలు వచ్చే నెలలో జరుగుతాయి.":
        "native": "The elections will be held next month."
        "bases":
          "ఎన్నికలు":
            "meaning": "election"
          "వచ్చే":
            "meaning": "to come"
          "నెలలో":
            "meaning": "month"
          "జరుగుతాయి":
            "meaning": "to happen"
      "ఈ ఎన్నికలో ఎవరు గెలిచారు?":
        "native": "Who won this election?"
        "bases":
          "ఎన్నికలో":
            "meaning": "election"
          "గెలిచారు":
            "meaning": "to win"
    "notes":
      "n1": "{1} is one election or the act of choosing; {2} is elections, more than one."
    senses:
      "election": { native: "election" }
    wiktionary: true
  "te-4006":
    "native": "citizen (a man)"
    "examples":
      "అతను ఈ దేశపు పౌరుడు.":
        "native": "He is a citizen of this country."
        "bases":
          "దేశపు":
            "meaning": "country"
      "ప్రతి పౌరుడూ ఓటు వేయవచ్చు.":
        "native": "Every citizen can vote."
        "bases":
          "వేయవచ్చు":
            "meaning": "to cast; to put"
          "పౌరుడూ":
            "meaning": "citizen"
    "notes":
      "n1": "{1} is a citizen. The plural {2} changes the ending: -డు (-ḍu) becomes -లు (-lu)."
    wiktionary: true
  "te-4007":
    "native": "minister"
    "examples":
      "మంత్రి ఈరోజు మా ఊరికి వస్తున్నారు.":
        "native": "The minister is coming to our town today."
        "bases":
          "మా":
            "meaning": "we"
          "ఊరికి":
            "meaning": "town"
          "వస్తున్నారు":
            "meaning": "to come"
      "మంత్రులు ప్రజల కోసం పని చేయాలి.":
        "native": "Ministers must work for the people."
        "bases":
          "మంత్రులు":
            "meaning": "minister"
          "ప్రజల":
            "meaning": "people"
          "చేయాలి":
            "meaning": "to do"
          "కోసం":
            "meaning": "for; for the sake of"
    "notes":
      "n1": "{1} is a minister. The plural {2} changes the stem: the final -ి (-i) becomes -ు (-u)."
    synonyms: { "preggada": "a minister", "amatyudu": "a king's minister", "sacivudu": "a minister or counsellor" }
    senses:
      "minister": { native: "minister (a politician who heads a ministry)" }
    wiktionary: true
  "te-4008":
    "native": "judge"
    "synonyms":
      "nyayadhipati": "a judge"
    "examples":
      "న్యాయమూర్తి ఎప్పుడు వస్తారు?":
        "native": "When will the judge come?"
        "bases":
          "వస్తారు":
            "meaning": "to come"
      "ఆయన మంచి న్యాయమూర్తి.":
        "native": "He is a good judge."
    "notes":
      "n1": "{1} is a judge; the plural {2} takes -లు (-lu)."
    wiktionary: true
  "te-4009":
    "native": "court of law"
    "examples":
      "కేసు కోర్టులో ఉంది.":
        "native": "The case is in court."
        "bases":
          "కోర్టులో":
            "meaning": "court"
          "ఉంది":
            "meaning": "to be"
      "నేను రేపు కోర్టుకు వెళ్తాను.":
        "native": "I am going to court tomorrow."
        "bases":
          "కోర్టుకు":
            "meaning": "court"
          "వెళ్తాను":
            "meaning": "to go"
    "notes":
      "n1": "{1} is a court of law; {2} means 'in court'."
    wiktionary: true
  "te-4010":
    "native": "registration; recording a name or case"
    "examples":
      "పేరు నమోదు చేయడానికి ఎంత సమయం పడుతుంది?":
        "native": "How long does it take to register the name?"
        "bases":
          "చేయడానికి":
            "meaning": "to do"
          "పడుతుంది":
            "meaning": "to take (time)"
      "నమోదు రుసుము ఎంత?":
        "native": "What is the registration fee?"
    "notes":
      "n1": "{1} is registration, the act of recording a name or a case; {2} means 'to register'."
  "te-4011":
    "native": "copy (a duplicate)"
    "examples":
      "దయచేసి ఈ పత్రానికి ఒక నకలు ఇవ్వండి.":
        "native": "Please give me one copy of this document."
        "bases":
          "పత్రానికి":
            "meaning": "document"
          "ఇవ్వండి":
            "meaning": "to give"
      "నకలు తీసి ఇస్తారా?":
        "native": "Will you make a copy and give it?"
        "bases":
          "తీసి":
            "meaning": "to take out; to make"
          "ఇస్తారా":
            "meaning": "to give"
    "notes":
      "n1": "{1} is a copy of a document; {2} means 'to make a copy'."
    wiktionary: true
  "te-4014":
    "native": "rule"
    "examples":
      "ఈ నియమం అందరికీ ఒకటే.":
        "native": "This rule is the same for everyone."
        "bases":
          "అందరికీ":
            "meaning": "everyone"
          "ఒకటే":
            "meaning": "one; the same"
      "నియమాలు తెలుసుకోవడం ముఖ్యం.":
        "native": "It is important to know the rules."
        "bases":
          "నియమాలు":
            "meaning": "rule"
    "notes":
      "n1": "{1} is a rule. The plural {2} changes the stem: the final -ం (-ṁ) becomes -ా (-ā)."
  "te-4016":
    "native": "scheme; plan"
    "examples":
      "ఈ పథకం పేద ప్రజలకు ఉపయోగపడుతుంది.":
        "native": "This scheme is useful for poor people."
        "bases":
          "ప్రజలకు":
            "meaning": "people"
          "ఉపయోగపడుతుంది":
            "meaning": "to be useful"
          "పేద":
            "meaning": "poor"
      "ఈ పథకంలో నమోదు చేసుకున్నారా?":
        "native": "Did you register for this scheme?"
        "bases":
          "పథకంలో":
            "meaning": "scheme"
          "చేసుకున్నారా":
            "meaning": "to do for oneself"
    "notes":
      "n1": "{1} is a government scheme or plan; the plural {2} changes the stem: -ం (-ṁ) becomes -ా (-ā)."
    wiktionary: true
  "te-4017":
    "native": "ration card"
    "bases": {"రేషన్": {"meaning": "ration"}}
    "examples":
      "మా ఇంట్లో రేషన్ కార్డు ఉంది.":
        "native": "We have a ration card at home."
        "bases":
          "మా":
            "meaning": "we"
          "ఇంట్లో":
            "meaning": "house"
          "ఉంది":
            "meaning": "to be"
          "రేషన్":
            "meaning": "ration"
      "రేషన్ కార్డు కోసం ఎక్కడికి వెళ్లాలి?":
        "native": "Where should I go for a ration card?"
        "bases":
          "ఎక్కడికి":
            "meaning": "where"
          "వెళ్లాలి":
            "meaning": "to go"
          "రేషన్":
            "meaning": "ration"
          "కోసం":
            "meaning": "for; for the sake of"
    "notes":
      "n1": "{1} is the card for buying subsidised food; {2} on its own means 'card'."
  "te-4020":
    "native": "birth certificate"
    "bases": {"జనన": {"meaning": "birth"}, "ధ్రువీకరణ": {"meaning": "certification; proof"}}
    "examples":
      "జనన ధ్రువీకరణ పత్రం ఎక్కడ తీసుకోవాలి?":
        "native": "Where should I get a birth certificate?"
        "bases":
          "తీసుకోవాలి":
            "meaning": "to take; to get"
          "జనన":
            "meaning": "birth"
          "ధ్రువీకరణ":
            "meaning": "certification; proof"
      "నా కొడుకు జనన ధ్రువీకరణ పత్రం పోయింది.":
        "native": "My son's birth certificate is lost."
        "bases":
          "నా":
            "meaning": "I"
          "పోయింది":
            "meaning": "to go; to be lost"
          "జనన":
            "meaning": "birth"
          "ధ్రువీకరణ":
            "meaning": "certification; proof"
    "notes":
      "n1": "{1} is a birth certificate; {2} on its own means 'birth'."
  "te-4021":
    "native": "details; information"
    "examples":
      "వివరాలు ఈ ఫారంలో రాయండి.":
        "native": "Write the details on this form."
        "bases":
          "ఫారంలో":
            "meaning": "form"
          "రాయండి":
            "meaning": "to write"
      "మరిన్ని వివరాలు తెలుసుకోవచ్చు.":
        "native": "You can find out more details."
        "bases":
          "తెలుసుకోవచ్చు":
            "meaning": "to learn; to find out"
          "మరిన్ని":
            "meaning": "more"
    "notes":
      "n1": "{1} is details or information about something. It is used in the plural."
  "te-4024":
    "native": "written request or application"
    "examples":
      "ఆయనకు ఒక అర్జీ రాశాను.":
        "native": "I wrote an application to him."
        "bases":
          "ఆయనకు":
            "meaning": "he (respectful)"
          "రాశాను":
            "meaning": "to write"
      "అర్జీని స్వీకరించారా?":
        "native": "Did they accept the application?"
        "bases":
          "అర్జీని":
            "meaning": "application"
          "స్వీకరించారా":
            "meaning": "to accept"
    "notes":
      "n1": "{1} is a written request or petition; {2} is a formal application."
  "te-4025":
    "native": "complaint"
    "examples":
      "ఫిర్యాదు ఎక్కడ చేయాలి?":
        "native": "Where should I make a complaint?"
        "bases":
          "చేయాలి":
            "meaning": "to do"
      "నేను ఫిర్యాదు రాసి ఇచ్చాను.":
        "native": "I wrote a complaint and gave it in."
        "bases":
          "రాసి":
            "meaning": "to write"
          "ఇచ్చాను":
            "meaning": "to give"
    "notes":
      "n1": "{1} is a complaint; {2} means 'to make a complaint'."
    synonyms: { "mora": "a cry, scream, lamentation" }
    wiktionary: true
  "te-4027":
    "native": "voter"
    "examples":
      "ఓటరు జాబితాలో మీ పేరు ఉందా?":
        "native": "Is your name in the voter list?"
        "bases":
          "జాబితాలో":
            "meaning": "list"
          "మీ":
            "meaning": "you"
          "ఉందా":
            "meaning": "to be"
      "ప్రతి ఓటరూ తన ఓటు వేయాలి.":
        "native": "Every voter must cast their vote."
        "bases":
          "తన":
            "meaning": "oneself"
          "వేయాలి":
            "meaning": "to put; to cast"
          "ఓటరూ":
            "meaning": "voter"
    "notes":
      "n1": "{1} is a voter. The plural {2} drops the final -ు (-u) of the stem before -లు (-lu)."
  "te-4028":
    "native": "citizenship"
    "examples":
      "ఆయనకు భారత పౌరసత్వం ఉంది.":
        "native": "He has Indian citizenship."
        "bases":
          "ఆయనకు":
            "meaning": "he (respectful)"
          "ఉంది":
            "meaning": "to be"
      "పౌరసత్వం కోసం ఏ పత్రాలు అవసరం?":
        "native": "Which documents are needed for citizenship?"
        "bases":
          "పత్రాలు":
            "meaning": "document"
          "కోసం":
            "meaning": "for; for the sake of"
    "notes":
      "n1": "{1} is citizenship; {2} is a citizen."
    wiktionary: true
  "te-4029":
    "native": "condition; regulation"
    "examples":
      "ఈ నిబంధన ఎవరికి వర్తిస్తుంది?":
        "native": "Who does this condition apply to?"
        "bases":
          "ఎవరికి":
            "meaning": "who"
          "వర్తిస్తుంది":
            "meaning": "to apply"
      "నిబంధనలు చదివారా?":
        "native": "Did you read the conditions?"
        "bases":
          "నిబంధనలు":
            "meaning": "condition"
          "చదివారా":
            "meaning": "to read"
    "notes":
      "n1": "{1} is a condition or regulation; the plural {2} takes -లు (-lu)."
