  - "unreviewed"
"cards":
  "te-1300":
    "native": "festival"
    "notes":
      "n1": "The general word. Each festival below has its own word."
    "examples":
      "ఈరోజు పెద్ద పండుగ.":
        "native": "Today is a big festival."
      "పండుగకు అందరూ వస్తారు.":
        "native": "Everyone comes for the festival."
        "bases":
          "పండుగకు":
            "meaning": "festival"
          "వస్తారు":
            "meaning": "to come"
  "te-1301":
    "native": "Diwali, the festival of lights"
    "notes":
      "n1": "The festival of lights, in autumn. Its name is used with the word for lamp."
    "examples":
      "దీపావళికి దీపాలు పెడతాం.":
        "native": "We light lamps for Diwali."
        "bases":
          "దీపావళికి":
            "meaning": "Diwali"
          "పెడతాం":
            "meaning": "to put; to place; to light (a lamp)"
      "దీపావళి రాత్రి బాణసంచా కాలుస్తారు.":
        "native": "On Diwali night they set off fireworks."
        "bases":
          "కాలుస్తారు":
            "meaning": "to burn; to set off (fireworks)"
  "te-1302":
    "native": "Sankranti, the harvest festival"
    "notes":
      "n1": "A harvest festival in January. Families often travel to their village for it."
    "examples":
      "సంక్రాంతికి ఊరికి వెళ్తాం.":
        "native": "We go to the village for Sankranti."
        "bases":
          "సంక్రాంతికి":
            "meaning": "Sankranti"
          "ఊరికి":
            "meaning": "village; town"
          "వెళ్తాం":
            "meaning": "to go"
      "సంక్రాంతి పంటల పండుగ.":
        "native": "Sankranti is a harvest festival."
        "bases":
          "పంటల":
            "meaning": "crop; harvest"
  "te-1303":
    "native": "Ugadi, the Telugu New Year"
    "notes":
      "n1": "The Telugu New Year, in spring. Its special dish is called pachadi."
    "examples":
      "ఉగాది తెలుగు కొత్త సంవత్సరం.":
        "native": "Ugadi is the Telugu New Year."
        "bases":
          "తెలుగు":
            "meaning": "Telugu"
      "ఉగాదికి పచ్చడి చేస్తారు.":
        "native": "On Ugadi they make pachadi."
        "bases":
          "ఉగాదికి":
            "meaning": "Ugadi"
          "చేస్తారు":
            "meaning": "to do; to make"
  "te-1304":
    "native": "Dasara, a long autumn festival"
    "notes":
      "n1": "A long autumn festival. Children and families celebrate it together."
    "examples":
      "దసరాకి మా ఊర్లో పెద్ద వేడుక ఉంటుంది.":
        "native": "In our village there is a big celebration for Dasara."
        "bases":
          "దసరాకి":
            "meaning": "Dasara"
          "ఊర్లో":
            "meaning": "village; town"
          "ఉంటుంది":
            "meaning": "to be; to stay; to have"
      "దసరా రోజు పిల్లలు ఆడతారు.":
        "native": "On Dasara day children play."
        "bases":
          "పిల్లలు":
            "meaning": "child"
          "ఆడతారు":
            "meaning": "to play"
  "te-1305":
    "native": "lamp"
    "notes":
      "n1": "A single lamp with an oil or wick flame. The plural is a separate card."
    "examples":
      "దీపం వెలిగించాం.":
        "native": "We lit a lamp."
        "bases":
          "వెలిగించాం":
            "meaning": "to light (a lamp)"
      "ఇంట్లో ఒక దీపం ఉంది.":
        "native": "There is a lamp in the house."
        "bases":
          "ఇంట్లో":
            "meaning": "house; home"
          "ఉంది":
            "meaning": "to be; to stay; to have"
  "te-1306":
    "native": "lamps"
    "notes":
      "n1": "The plural of lamp, used for rows of festival lights."
    "examples":
      "ఇంటి ముందు దీపాలు పెట్టాం.":
        "native": "We put lamps in front of the house."
        "bases":
          "ఇంటి":
            "meaning": "house; home"
          "పెట్టాం":
            "meaning": "to put; to place"
      "దీపాలు ఇంటి అందం.":
        "native": "The lamps are the beauty of the house."
        "bases":
          "ఇంటి":
            "meaning": "house; home"
          "అందం":
            "meaning": "beauty"
    "bases":
      "దీపాలు":
        "meaning": "lamp"
  "te-1307":
    "native": "fireworks"
    "notes":
      "n1": "Fireworks, used at Diwali and other festivals."
    "examples":
      "బాణసంచా పెద్ద శబ్దం చేస్తుంది.":
