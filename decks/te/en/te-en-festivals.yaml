  "name": "English"
"name": "Festivals and celebrations"
"description": "The words of a festival: Diwali, Sankranti, Ugadi and Dasara, the lamps, the decorations, the food, the prayers and the visits. Not yet checked by a Telugu speaker: please report any mistake."
