schema: 1
id: "te-en-script-conjuncts-2"
kind: "layer"
core: "te-script-conjuncts-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Telugu conjuncts, part 2"
description: "The second consonant of a conjunct is written below the first as its small form (vattu). These nine are second consonants that the first conjunct deck does not show: dh, j, b, bh, ś, h, ṭh, s and ñ."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "te-8600":
    native: "ddh (double d, aspirated)"
    notes:
      "n1": "ద (da) with ధ (dha) written below it: the second d is breathed. సిద్ధము (siddhamu, ready) has it; the meaning is from the en.wiktionary entry."
    "examples": {
      "సిద్ధము": {"native": "ready, prepared", "bases": {}}
    }
  "te-8601":
    native: "jj (double j)"
    notes:
      "n1": "జ (ja) doubled, with జ (ja) written below it: లజ్జ (lajja, shame). The meaning is from the en.wiktionary entry."
    "examples": {
      "లజ్జ": {"native": "shame", "bases": {}}
    }
  "te-8602":
    native: "bb (double b)"
    notes:
      "n1": "బ (ba) doubled, with బ (ba) written below it: అబ్బాయి (abbāyi, boy). The meaning is from the en.wiktionary entry."
    "examples": {
      "అబ్బాయి": {"native": "a boy", "bases": {}}
    }
  "te-8603":
    native: "r, then bh (rbh)"
    notes:
      "n1": "ర (ra) is the first letter and భ (bha) is written below it: గర్భం (garbhaṁ, womb). The meaning is from the en.wiktionary entry for గర్భము (garbhamu)."
    "examples": {
      "గర్భం": {"native": "the womb", "bases": {}}
    }
  "te-8604":
    native: "r, then ś (rś)"
    notes:
      "n1": "ర (ra) is the first letter and శ (śa) is written below it: దర్శనం (darśanaṁ, sight). The meaning is from the en.wiktionary entry for దర్శనము (darśanamu)."
    "examples": {
      "దర్శనం": {"native": "sight, seeing", "bases": {}}
    }
  "te-8605":
    native: "r, then h (rh)"
    notes:
      "n1": "ర (ra) is the first letter and హ (ha) is written below it: అర్హత (arhata, worthiness). The meaning is from the en.wiktionary entry."
    "examples": {
      "అర్హత": {"native": "worthiness, fitness", "bases": {}}
    }
  "te-8606":
    native: "ṣ, then ṭh (ṣṭh)"
    notes:
      "n1": "ష (ṣa) is the first letter and ఠ (ṭha) is written below it: నిష్ఠ (niṣṭha, devotion). The meaning is from the en.wiktionary entry."
    "examples": {
      "నిష్ఠ": {"native": "devotion; attention", "bases": {}}
    }
  "te-8607":
    native: "ss (double s)"
    notes:
      "n1": "స (sa) doubled, with స (sa) written below it: బస్సు (bassu, bus). The meaning is from the en.wiktionary entry."
    "examples": {
      "బస్సు": {"native": "bus", "bases": {}}
    }
  "te-8608":
    native: "j, then ñ (jñ)"
    notes:
      "n1": "జ (ja) is the first letter and ఞ (ña) is written below it: యజ్ఞం (yajñaṁ, an act of worship). The meaning is from the te.wiktionary translation line for యజ్ఞము (yajñamu)."
    "examples": {
      "యజ్ఞం": {"native": "an act of worship", "bases": {}}
    }
