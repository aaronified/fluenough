schema: 1
id: "te-en-grammar-likes"
kind: "layer"
core: "te-grammar-likes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Likes"
description: "ఇష్టం (iṣṭaṁ) and నచ్చు (naccu): what you like, and what you liked. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "te-0469":
    native: "liking; dear to someone"
    notes:
      "n1": "The one who likes takes -కు (-ku): నాకు ఇష్టం (nāku iṣṭaṁ), I like it, 'to me it is dear'."
    "examples": {
      "నాకు టీ ఇష్టం.": {"native": "I like tea.", "bases": {}}
    }
  "te-0470":
    notes:
      "n1": "The one who likes something is in the dative: నాకు (nāku), 'to me'; the thing liked, టీ (ṭī), stays plain."
    native: "I like tea."
    alt_native: ["I am fond of tea."]
  "te-0471":
    notes:
      "n1": "The one who dislikes takes the -ku ending: నాకు (nāku), to me; ఇష్టం (iṣṭaṁ), liking, is made negative with లేదు (lēdu), there is not."
    native: "I don't like coffee."
    alt_native: ["I dislike coffee."]
  "te-0472":
    notes:
      "n1": "The one who likes is in the dative: మీకు (mīku), to you; ఏం (ēṁ), what, takes the place of the thing liked."
    native: "What do you like?"
  "te-0473":
    native: "I like watching films."
    alt_native: ["I like watching movies.", "I enjoy watching films."]
    notes:
      "n1": "An action you like takes the -డం (-ḍam) form: చూడడం (cūḍaḍaṁ), watching."
    bases:
      "సినిమాలు": "film; cinema"
  "te-0474":
    native: "to be liked; to please"
    notes:
      "n1": "For a thing tried or seen: నాకు నచ్చింది (nāku naccindi), I liked it. ఇష్టం (iṣṭaṁ) is a lasting liking."
  "te-0475":
    notes:
      "n1": "The one who liked it takes the -ku ending: నాకు (nāku), to me; నచ్చింది (naccindi), liked, tells what you thought of something you tried or saw, where ఇష్టం (iṣṭaṁ) is a liking in general."
    native: "I liked it."
    alt_native: ["I enjoyed it."]
  "te-0476":
    notes:
      "n1": "The negative of నచ్చింది (naccindi) is నచ్చలేదు (naccalēdu), with the same నాకు (nāku) for the one who did not like it."
    native: "I didn't like it."
    alt_native: ["I disliked it."]
  "te-0477":
    notes:
      "n1": "The -ā question ending on నచ్చింది (naccindi) makes it a yes or no question, with the one who liked it in the dative: మీకు (mīku)."
    native: "Did you like it?"
    alt_native: ["Did you enjoy it?"]
  "te-0478":
    notes:
      "n1": "The object form of నువ్వు (nuvvu), you, is నిన్ను (ninnu), used before the verb."
    native: "I love you."
    bases:
      "ప్రేమిస్తున్నాను": "to love"
