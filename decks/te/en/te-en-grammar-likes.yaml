kind: "layer"
core: "te-grammar-likes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Likes"
description: "ఇష్టం (iṣṭam) and నచ్చు (naccu): what you like, and what you liked. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "te-0469":
    native: "liking; dear to someone"
    notes:
      "n1": "The one who likes takes -కు (-ku): నాకు ఇష్టం (nāku iṣṭam), I like it, 'to me it is dear'."
  "te-0470":
    native: "I like tea."
  "te-0471":
    native: "I don't like coffee."
  "te-0472":
    native: "What do you like?"
  "te-0473":
    native: "I like watching films."
    notes:
      "n1": "An action you like takes the -డం (-ḍam) form: చూడడం (cūḍaḍam), watching."
    bases:
      "సినిమాలు": "film; cinema"
  "te-0474":
    native: "to be liked; to please"
    notes:
      "n1": "For a thing tried or seen: నాకు నచ్చింది (nāku naccindi), I liked it. ఇష్టం (iṣṭam) is a lasting liking."
  "te-0475":
    native: "I liked it."
  "te-0476":
    native: "I didn't like it."
  "te-0477":
    native: "Did you like it?"
  "te-0478":
    native: "I love you."
    bases:
      "ప్రేమిస్తున్నాను": "to love"
