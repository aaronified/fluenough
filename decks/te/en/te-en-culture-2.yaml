# Layer for te-culture-2: each song's English rendering and a note on it.
schema: 1
id: "te-en-culture-2"
kind: "layer"
core: "te-culture-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: devotional songs"
description: "Eighteen lines of devotional songs and verse from the Telugu tradition, from the fifteenth to the nineteenth century, each with its English rendering and a note. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "te-8800":
    native: "The darling pearl on Yashoda's doorstep is this one, Devaki's son, whose glories cannot be fully grasped."
    notes:
      "n1": "The opening line of an Annamacharya song about the child Krishna. The song compares his childhood deeds with the nine gems, and the poet calls him a pearl that cannot be measured."
    bases:
      "ముద్దుగారే": { meaning: "darling, from a verb meaning to overflow with charm; said to the child" }
      "యశోద": { meaning: "Yashoda, the foster mother of Krishna" }
      "ముంగిటి": { meaning: "at the doorstep, in the courtyard" }
      "ముత్యము": { meaning: "pearl" }
      "వీఁడు": { meaning: "this one" }
      "తిద్దరాని": { meaning: "that cannot be set right, beyond reproach" }
      "మహిమల": { meaning: "of the glories, of the wonders" }
      "దేవకిసుతుఁడు": { meaning: "son of Devaki (Krishna)" }
  "te-8801":
    native: "This one came to Yashoda as her child, and this one is the father of Brahma, who made the earth."
    notes:
      "n1": "The opening lines of an Annamacharya song about Krishna as a child. The song turns a paradox into play: the child is also the father of Brahma, the creator of the world."
    bases:
      "చేరి": { meaning: "came near, approached" }
      "యశోదకు": { meaning: "to Yashoda" }
      "శిశు": { meaning: "child (the infant)" }
      "వితఁడు": { meaning: "this one" }
      "ధారుణి": { meaning: "of the earth" }
      "బ్రహ్మకు": { meaning: "to Brahma, the creator" }
      "దండ్రియు": { meaning: "and the father" }
      "నితఁడు": { meaning: "this one" }
  "te-8802":
    native: "Greetings to all the great souls."
    notes:
      "n1": "The opening line of a famous song by Tyagaraja, a greeting to all the great souls of the devotional tradition."
    bases:
      "ఎందరో": { meaning: "many" }
      "మహానుభావు": { meaning: "great soul (plural form)" }
      "లందరికి": { meaning: "to all of them" }
      "వందనము": { meaning: "salutation, homage" }
  "te-8803":
    native: "Has your word turned to gold, Kodandapani?"
    notes:
      "n1": "The opening line of a song by Bhadrachala Ramadasu, who asks Rama why his answer does not come. The poet says the god's word has become as rare as gold."
    bases:
      "పలుకే": { meaning: "speech, word (here: your word)" }
      "బంగారమాయెనా": { meaning: "gold (here: has it turned into gold?)" }
      "కోదండపాణి": { meaning: "Kodandapani, Rama who holds the bow" }
  "te-8804":
    native: "The king of lovers, who went about so joyfully!"
    notes:
      "n1": "The opening line of a song by Kshetrayya about Krishna as a lover. It is a short devotional love song."
    bases:
      "వేడుకతో": { meaning: "with delight, playfully" }
      "నడచుకొన్న": { meaning: "who walked, who went about" }
      "విటరాయడే": { meaning: "the king of lovers" }
  "te-8805":
    native: "Wherever you look, these boys are at every doorstep, up to many pranks; call them in, won't you?"
    notes:
      "n1": "The opening lines of an Annamacharya song in Desalam raga. The page marks its theme as Krishna. The archaic form సేసేరు (sēsēru) is an older spelling of చేసారు (cēsāru), 'they did'."
    bases:
      "ఎక్కడ": { meaning: "where" }
      "చూచిన": { meaning: "looked at, seen (here: wherever you look)" }
      "వీరే": { meaning: "these ones (emphatic)" }
      "యింటింటి": { meaning: "of every house, at every house" }
      "ముంగిటను": { meaning: "in the courtyard, at the doorstep" }
      "పెక్కుచేఁతలు": { meaning: "many deeds, many pranks" }
      "సేసేరు": { meaning: "they did (an older form)" }
      "పిలువరే": { meaning: "won't you call" }
      "బాలుల": { meaning: "the boys" }
  "te-8806":
    native: "Would karma bind the servants of one who has such might? Let all of it be blown away."
    notes:
      "n1": "The opening couplet of an Annamacharya song in Malavi raga. The page marks its theme as surrender (saranagati). The idiom గాలిఁ (gāli) బోవుఁ (bōvu) means to be blown away, to come to nothing."
    bases:
      "ఇట్టి": { meaning: "such" }
      "ప్రతాపము": { meaning: "might, power" }
      "గల": { meaning: "having" }
      "యీతని": { meaning: "of this one" }
      "దాసుల": { meaning: "servants, devotees" }
      "నెల్ల": { meaning: "all" }
      "కట్టునా": { meaning: "would bind" }
      "కర్మములెల్ల": { meaning: "all karmas" }
      "గాలిఁ": { meaning: "to the wind" }
      "బోవుఁ": { meaning: "will go, will be lost" }
      "గాక": { meaning: "let it be" }
  "te-8807":
    native: "With how many have I wrestled, and where have I not rolled about; O father of Kandarpa, except you there is no refuge for us."
    notes:
      "n1": "The opening couplet of an Annamacharya song in Samantam raga. The page marks its theme as spirituality (adhyatma), and the poet addresses God as the father of Kandarpa."
    bases:
      "ఎందరితోఁ": { meaning: "with how many" }
      "బెనఁగేను": { meaning: "I have wrestled, I have struggled" }
      "యెక్కడని": { meaning: "where, anywhere" }
      "పొరలేను": { meaning: "I have rolled about, I have wandered" }
      "కందర్పజనక": { meaning: "father of Kandarpa (a vocative)" }
      "నీవే": { meaning: "you alone" }
      "గతిఁ": { meaning: "way, refuge" }
      "గాక": { meaning: "except, apart from" }
      "మాకు": { meaning: "for us" }
  "te-8808":
    native: "How was I deceived, taking all this to be true, and I never learned to trust Hari firmly."
    notes:
      "n1": "The opening couplet of an Annamacharya song in Sankarabharanam raga. The page marks its theme as dispassion (vairagya cinta). The verb మోసపోతి (mōsapōti) is 'I was deceived', in the first person."
    bases:
      "ఎట్టు": { meaning: "how" }
      "మోసపోతి": { meaning: "I was deceived" }
      "నేను": { meaning: "I" }
      "యివియెల్ల": { meaning: "all these things" }
      "నిజమని": { meaning: "as true, as real" }
      "నెట్టన": { meaning: "firmly" }
      "హరినే": { meaning: "Hari himself" }
      "నమ్మ": { meaning: "to trust" }
      "నేరనయితిఁగా": { meaning: "I did not manage to, I did not learn to" }
  "te-8809":
    native: "The demons never think of the mind that says 'I am your servant'; they struggle over petty things, and some still do so now."
    notes:
      "n1": "The opening couplet of an Annamacharya song in Nata raga. The page marks its theme as Vaishnava devotion. దాసోహము (dāsōhamu) is the formal words of a devotee's submission, 'I am your servant'."
    bases:
      "దాసోహమను": { meaning: "say 'I am your servant'" }
      "బుద్ధిఁ": { meaning: "mind, thought" }
      "దలచరు": { meaning: "they do not think of" }
      "దానవులు": { meaning: "demons" }
      "యీసులకే": { meaning: "for petty things (tentative)" }
      "పెనఁగేరు": { meaning: "they struggle, they wrestle" }
      "యిప్పుడూఁ": { meaning: "even now, still" }
      "గొందరు": { meaning: "some" }
  "te-8810":
    native: "Is praise of mortals, bound by attachment, a happiness, and is the song of him praised by the wise Tyagaraja a happiness?"
    notes:
      "n1": "A couplet from a charanam (verse) of Tyagaraja's song Nidhi chala sukhama in Kalyani raga, as the page marks. The page says the king of Thanjavur sent Tyagaraja wealth and invited him to court, and that he sang this song then. The two lines end in the question forms సుఖమా (sukhamā) and సుఖమో (sukhamō)."
    bases:
      "మమత": { meaning: "attachment, possessiveness" }
      "బంధనయుత": { meaning: "bound, tied" }
      "నరస్తుతి": { meaning: "praise of men" }
      "సుఖమా": { meaning: "is it happiness?" }
      "సుమతి": { meaning: "the wise one" }
      "త్యాగరాజ": { meaning: "Tyagaraja" }
      "నుతుని": { meaning: "of the one praised" }
      "కీర్తన": { meaning: "song of praise" }
      "సుఖమో": { meaning: "is it happiness? (the second question)" }
  "te-8811":
    native: "Having drunk the nectar of music, shine on, O mind!"
    notes:
      "n1": "The pallavi of a Tyagaraja song in Andolika raga and Desadi tala, as the page marks. It speaks to the mind and asks it to drink the nectar of music and shine. జేసి (jēsi) is the verb form that links 'having done' to the main verb."
    bases:
      "రాగసుధారస": { meaning: "nectar of music" }
      "పానము": { meaning: "drinking" }
      "జేసి": { meaning: "having drunk" }
      "రాజిల్లవే": { meaning: "shine on, you will shine" }
      "ఓ": { meaning: "O (address)" }
      "మనసా": { meaning: "O mind" }
  "te-8812":
    native: "Day after day, I recite you in my mind."
    notes:
      "n1": "A charanam line of Tyagaraja's song in Varali raga and Adi tala, as the page marks. After each line of this song the page repeats the refrain కనకన (kanakana). The word చదువు (caduvu) means both to read and to recite."
    bases:
      "దినదినమును": { meaning: "every single day" }
      "మనసున": { meaning: "in the mind" }
      "చదువున": { meaning: "I recite (tentative)" }
      "నిన్ను": { meaning: "you" }
  "te-8813":
    native: "Was not the noble one, the best of sages, the great Vasishtha, a well-wisher?"
    notes:
      "n1": "A charanam line of Tyagaraja's song Entarani in Harikambhoji raga and Desadi tala, as the page marks. It is a question that names the sage Vasishtha as a well-wisher. గాలేదా (gālēdā) is a question form: 'was it not?'"
    bases:
      "శిష్టుఁడు": { meaning: "the noble one" }
      "మౌనివరిష్టుఁడు": { meaning: "the best of sages" }
      "గొప్ప": { meaning: "great" }
      "వశిష్టుడు": { meaning: "Vasishtha, the sage" }
      "హితుఁడు": { meaning: "well-wisher" }
      "గాలేదా": { meaning: "was it not? (question form)" }
  "te-8814":
    native: "The moon and the sun, the gods and the stars, those great oceans, and all the worlds."
    notes:
      "n1": "A charanam line of a Ramadasu song in Varali raga and Adi tala, as the page marks. Its refrain, అంతా (antā) రామమయం (rāmamayaṁ), says that everything is full of Rama, and this line lists what is full of him. సురలు (suralu) is the plural of సుర (sura), a god."
    bases:
      "సోమ": { meaning: "the moon" }
      "సూర్యులును": { meaning: "and the sun" }
      "సురలు": { meaning: "gods" }
      "తారలును": { meaning: "and the stars" }
      "ఆ": { meaning: "those" }
      "మహాంబుధులు": { meaning: "great oceans" }
      "నఖిల": { meaning: "all, entire" }
      "జగంబులు": { meaning: "worlds" }
  "te-8815":
    native: "Jewel of the Ikshvaku line, will you at last speak to me, Ramachandra?"
    notes:
      "n1": "The opening line of a Ramadasu song in Kambhoji raga and Triputa tala, as the page marks. రామచంద్రా (rāmacandrā) is the form used to call Rama: the ending -ా (ā) makes it a form of address."
    bases:
      "ఇక్ష్వాకు": { meaning: "of the Ikshvaku line (Rama's dynasty)" }
      "కుల": { meaning: "line, family" }
      "తిలక": { meaning: "jewel, ornament" }
      "యికనైన": { meaning: "at last, now at least" }
      "పలుకవె": { meaning: "will you speak" }
      "రామచంద్రా": { meaning: "Ramachandra (address)" }
      "నన్ను": { meaning: "me" }
  "te-8816":
    native: "Knowing so much, why this behaviour; is it stubbornness, Muvva Gopala, my lord?"
    notes:
      "n1": "The opening lines of a Kshetrayya padam, which the page lists among his padalu. The stanzas that follow describe the lover coming home after sulking."
    bases:
      "ఇంత": { meaning: "so much" }
      "తెలిసియుండి": { meaning: "knowing" }
      "యీ": { meaning: "this" }
      "గుణమేలరా": { meaning: "this behaviour, why this conduct" }
      "పంతమా": { meaning: "is it stubbornness?" }
      "మువ్వగోపాలా": { meaning: "Muvva Gopala (address, Krishna)" }
      "నాసామీ": { meaning: "my lord" }
  "te-8817":
    native: "Such a Muvva Gopala has always made my heart glad."
    notes:
      "n1": "The second line of the pallavi of a Kshetrayya padam, whose first line is 'How handsome is my lord'. The creator's entry describes his songs as love songs about Krishna."
    bases:
      "ఇంతి": { meaning: "such a (tentative)" }
      "మువ్వ": { meaning: "Muvva (part of the name)" }
      "గోపాలుడు": { meaning: "Gopala" }
      "సంతతము": { meaning: "always" }
      "నా": { meaning: "my" }
      "మదికి": { meaning: "to the mind, to my heart" }
      "సంతోషము": { meaning: "joy, gladness" }
      "చేసెనే": { meaning: "has made" }
