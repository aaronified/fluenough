schema: 1
id: "te-en-sound-differences"
kind: "layer"
core: "te-sound-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sounds to tell apart"
description: "Pairs of everyday words that differ in one sound: a short or long vowel, the tongue on the teeth or curled back, the two l's, a single or double l, a closing m or none, and a breath after an aspirated consonant."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0110":
    native: "many; several"
    notes:
      "n1": "Vowel length: పాలు (pālu, milk) holds the a twice as long as పలు (palu, many). Shorten it and you've said 'many'."
  "te-0265":
    notes:
      "n1": "Vowel length: పాలు (pālu, milk) holds the a twice as long as పలు (palu, many). Shorten it and you've said 'many'."
    "examples": {
      "పాలు తాగండి.": {"native": "Please drink the milk.", "bases": {}}
    }
  "te-0053":
    notes:
      "n1": "Vowel length: కాలం (kālam, time) has the long a where కలం (kalam, pen) has the short a."
      "n2": "A closing m: కలం (kalaṁ), 'pen', ends in the sign ం (ṁ), a closing m; కల (kala), 'dream', does not."
  "te-0111":
    native: "time; season"
    notes:
      "n1": "Vowel length: కాలం (kālam, time) has the long a where కలం (kalam, pen) has the short a."
    "examples": {
      "ఆఫర్ ఎంత కాలం ఉంటుంది?": {"native": "How long does the offer last?", "bases": {}},
      "యుద్ధం చాలా కాలం జరిగింది.": {"native": "The war went on for a long time.", "bases": {}}
    }
  "te-0112":
    native: "old"
    notes:
      "n1": "Dental against curled back: పాత (pāta, old) has the tongue on the teeth for t; పాట (pāṭa, song) has it curled back."
    "examples": {
      "ఆ బ్యాట్ పాతది.": {"native": "That bat is old.", "bases": {}},
      "ఇది పాత ఆచారం.": {"native": "This is an old custom.", "bases": {}}
    }
  "te-0113":
    native: "song"
    notes:
      "n1": "Dental against curled back: పాత (pāta, old) has the tongue on the teeth for t; పాట (pāṭa, song) has it curled back."
    "examples": {
      "పాట డౌన్‌లోడ్ చేయి.": {"native": "Download the song.", "bases": {}},
      "పాటల పోటీ ఎప్పుడు?": {"native": "When is the song competition?", "bases": {}}
    }
  "te-0114":
    native: "harvest; a cut"
    notes:
      "n1": "Dental against curled back: కోత (kōta, harvest) has the tongue on the teeth; కోట (kōṭa, fort) has it curled back."
  "te-0115":
    native: "fort"
    notes:
      "n1": "Dental against curled back: కోత (kōta, harvest) has the tongue on the teeth; కోట (kōṭa, fort) has it curled back."
    "examples": {
      "ఆ రాజకుమారుడు కోటలో పెరిగాడు.": {"native": "That prince grew up in the fort.", "bases": {"కోటలో": "fort"}},
      "ఈ కోట సౌందర్యం చూడదగినది.": {"native": "The beauty of this fort is worth seeing.", "bases": {}}
    }
  "te-0050":
    notes:
      "n1": "The two l's: కల (kala), 'dream', has the l on the teeth; కళ (kaḷa), 'art', has it curled back."
      "n2": "One l or two: కల (kala), 'dream', has one l; కల్ల (kalla), 'lie', holds it twice as long. English says the double l in 'ball' once, so the length is new."
      "n3": "A closing m: కల (kala), 'dream', against కలం (kalaṁ), 'pen'. The sign ం (ṁ) adds a closing m, which English also has, but Telugu writes it on many nouns."
    "examples": {
      "అవార్డు అందుకోవడం ఆయన కల.": {"native": "Receiving the award is his dream.", "bases": {}}
    }
  "te-0116":
    native: "art"
    notes:
      "n1": "The two l's: కల (kala), 'dream', has the l on the teeth; కళ (kaḷa), 'art', has it curled back."
    "examples": {
      "ఆమెకు కళ అంటే ఇష్టం.": {"native": "She loves art.", "bases": {}},
      "ఈ బడిలో కళలు నేర్పిస్తారు.": {"native": "This school teaches the arts.", "bases": {}}
    }
  "te-6555":
    native: "thought; idea; feeling"
    notes:
      "n1": "Aspirated against plain: భ (bh) is a b with a breath after it, as in భావం (bhāvaṁ), 'thought'. English has no such contrast, so it is new. Telugu బ (ba) is the same sound as English b."
    "examples": {
      "ఈ పాటలో గొప్ప భావం ఉంది.": {"native": "There is a deep feeling in this song.", "bases": {}},
      "ఆ మాటకు అసలు భావం ఏమిటో చెప్పండి.": {"native": "Tell me what that word really means.", "bases": {}}
    }
  "te-6556":
    native: "lie; falsehood"
    notes:
      "n1": "One l or two: కల్ల (kalla), 'lie', holds the l twice as long as కల (kala), 'dream'. English says the double l in 'ball' once, so the length is new."
      "n2": "Its partner: కల (kala), 'dream', has one l where కల్ల (kalla), 'lie', has two. Say the first l once and the word becomes 'dream'."
