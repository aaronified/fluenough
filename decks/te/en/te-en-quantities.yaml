schema: 1
id: "te-en-quantities"
kind: "layer"
core: "te-quantities"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How much and how many"
description: "A little, some, a lot, all, half, more, less, enough; one and just one; nobody, nothing and nowhere; first and last. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-1024":
    native: "a little; a bit"
    alt_native: ["a little bit"]
    notes:
      "n1": "Also spelled {1}."
    "examples": {
      "కొంచెం ఆగండి.": {"native": "Please wait a little.", "bases": {}},
      "కొంచెం తగ్గించండి.": {"native": "Please lower it a little.", "bases": {"తగ్గించండి": "to lower; to reduce", "కొంచెం": "little; a bit"}}
    }
  "te-1025":
    native: "some (things)"
    wiktionary: true
    notes:
      "n1": "For a few people say {1}."
    "examples": {
      "ప్రతి మనిషికీ కొన్ని పరిమితులు ఉంటాయి.": {"native": "Every person has some limits.", "bases": {}}
    }
  "te-1026":
    native: "very; a lot"
    alt_native: ["lots"]
    wiktionary: true
    notes:
      "n1": "Before an adjective it means 'very': {1}. On its own it means 'a lot'."
    "examples": {
      "చాలా ఎక్కువ!": {"native": "That's too much!", "bases": {"చాలా": "very; a lot"}},
      "చాలా బాగుంది.": {"native": "It's very good.", "bases": {"బాగుంది": "good; well", "చాలా": "very; a lot"}}
    }
  "te-1027":
    native: "all (of the things)"
    wiktionary: true
    notes:
      "n1": "For things and animals; for people, {1}."
      "pair": "A single or a double consonant: {1} (anni, all) has a double n where {2} (ani, that) has a single one."
    "examples": {
      "ఈ హోటల్‌లో అన్ని సౌకర్యాలు ఉన్నాయి.": {"native": "This hotel has all the facilities.", "bases": {}}
    }
  "te-1028":
    native: "everything; all of it"
    wiktionary: true
    notes:
      "n1": "Said of the whole of something."
    "examples": {
      "జనం అంతా చౌరస్తాలో కూడుతారు.": {"native": "Everyone gathers at the crossroads.", "bases": {}}
    }
  "te-1029":
    native: "more; too much"
    wiktionary: true
    notes:
      "n1": "{1} is 'That's too much!'"
    "examples": {
      "అతని వయసు ఎక్కువ.": {"native": "He is old.", "bases": {}},
      "ఆఫ్రికాలో ఎండ ఎక్కువ.": {"native": "It is very sunny in Africa.", "bases": {}}
    }
  "te-1030":
    native: "less; too little"
    wiktionary: true
    notes:
      "n1": "The opposite of {1}."
    "examples": {
      "కొంచెం తక్కువ ఇవ్వండి.": {"native": "Please give a little less.", "bases": {}},
      "మా బడ్జెట్ తక్కువ.": {"native": "Our budget is low.", "bases": {}}
    }
  "te-1031":
    native: "half"
    alt_native: ["one half"]
    wiktionary: true
    notes:
      "n1": "One and a half is {1}."
  "te-1032":
    native: "whole; full; complete"
    alt_native: ["entire"]
    wiktionary: true
    notes:
      "n1": "{1} is to finish."
    "examples": {
      "ఎలాగో పని పూర్తి చేశాను.": {"native": "I somehow finished the work.", "bases": {}},
      "నేను ఇంటిపని పూర్తి చేశాను.": {"native": "I finished my homework.", "bases": {}}
    }
  "te-1033":
    native: "only; just"
    notes:
      "n1": "Built from {1} and the emphasis {2}."
    "examples": {
      "నా దగ్గర నగదు మాత్రమే ఉంది.": {"native": "I only have cash.", "bases": {}}
    }
  "te-1034":
    native: "a; one (before a noun)"
    wiktionary: true
    notes:
      "n1": "Before a noun: {1}, a book. The number on its own is {2}."
      "pair": "A single or a double consonant: {1} (oka, a) has a single k where {2} (okka, just one) has a double one."
    "examples": {
      "అతను ఒక యువకుడు.": {"native": "He is a young man.", "bases": {}},
      "ఆమె ఒక యువతి.": {"native": "She is a young woman.", "bases": {}}
    }
  "te-1035":
    native: "just one; a single"
    notes:
      "n1": "{1} is 'just a minute'."
      "pair": "A single or a double consonant: {1} (okka, just one) has a double k where {2} (oka, a) has a single one."
    "examples": {
      "ఒక్క నిమిషం.": {"native": "Just a minute.", "bases": {"నిమిషం": "minute", "ఒక్క": "just one; a single"}}
    }
  "te-1036":
    native: "every; each"
    wiktionary: true
    notes:
      "n1": "{1} is every day."
    "examples": {
      "ప్రతి ఉద్యోగికి బాధ్యతలు ఉంటాయి.": {"native": "Every employee has responsibilities.", "bases": {}},
      "ప్రతి పౌరుడు ఓటు వేయాలి.": {"native": "Every citizen should cast a vote.", "bases": {}}
    }
  "te-1037":
    native: "nothing; anything"
    notes:
      "n1": "With a negative verb it means 'nothing': {1}, there is nothing."
    "examples": {
      "ఊహలతో ఏమీ జరగదు.": {"native": "Nothing happens with mere imagination.", "bases": {}},
      "నా దగ్గర ఏమీ లేదు.": {"native": "I have nothing with me.", "bases": {}}
    }
  "te-1038":
    native: "nobody; anybody"
    alt_native: ["no one"]
    notes:
      "n1": "With a negative verb it means 'nobody'."
    "examples": {
      "ఇప్పటివరకు ఎవరూ రాలేదు.": {"native": "No one has come so far.", "bases": {}},
      "ఆ నివేదిక ఇంకా ఎవరూ చదవలేదు.": {"native": "No one has read that report yet.", "bases": {}}
    }
  "te-1039":
    native: "nowhere; anywhere"
    notes:
      "n1": "With a negative verb it means 'nowhere'."
  "te-1040":
    native: "this much; so much"
    wiktionary: true
    notes:
      "n1": "{1} is 'this big'."
    "examples": {
      "ఇంత చలిలో వాళ్ళు ఇబ్బందిపడతారు.": {"native": "They feel uneasy in this cold.", "bases": {}}
    }
  "te-1041":
    native: "that much; so much"
    wiktionary: true
    notes:
      "n1": "{1} is 'that big'."
    "examples": {
      "ఇది అంత పెద్దది కాదు.": {"native": "This is not that big.", "bases": {"అంత": "that much; so much"}},
      "గెలుపు అంత సులభం కాదు.": {"native": "Winning is not that easy.", "bases": {}}
    }
  "te-1042":
    native: "how many (things)"
    notes:
      "n1": "For people, use {1}."
    "examples": {
      "రోజుకు ఎన్ని సార్లు?": {"native": "How many times a day?", "bases": {"సార్లు": "time (occasion)"}},
      "ఇక్కడ ఎన్ని పుస్తకాలు ఉన్నాయి?": {"native": "How many books are there here?", "bases": {}}
    }
  "te-1043":
    native: "how many (people)"
    wiktionary: true
    notes:
      "n1": "{1} counts people."
    "examples": {
      "క్లాసులో ఎంతమంది పిల్లలు ఉన్నారు?": {"native": "How many children are in the class?", "bases": {"క్లాసులో": "class (from English)"}}
    }
  "te-1044":
    native: "total; whole"
    wiktionary: true
    notes:
      "n1": "{1}? is 'How much in all?'"
  "te-1045":
    native: "pair; couple"
    wiktionary: true
    notes:
      "n1": "A pair of anything, and a married couple."
    "examples": {
      "కొత్త జంటకు అభినందనలు!": {"native": "Congratulations to the new couple!", "bases": {}}
    }
  "te-1046":
    native: "dozen"
    alt_native: ["a dozen"]
    wiktionary: true
    notes:
      "n1": "A word from English."
  "te-1047":
    native: "is enough; enough!"
    wiktionary: true
    notes:
      "n1": "Said alone, {1} means 'That's enough!'"
    "examples": {
      "కేవలం ఒక్కటి చాలు.": {"native": "Just one is enough.", "bases": {}},
      "చాలు, ఇంకా వద్దు.": {"native": "That's enough, no more.", "bases": {}}
    }
  "te-1048":
    native: "again"
    alt_native: ["once more", "once again"]
    wiktionary: true
    notes:
      "n1": "Also spelled {1}."
  "te-1049":
    native: "first"
    wiktionary: true
    notes:
      "n1": "{1} is the first day."
    "examples": {
      "మొదటి చినుకు నేలను తాకింది.": {"native": "The first drop touched the ground.", "bases": {}},
      "మొదటి బస్సు ఎప్పుడు వస్తుంది?": {"native": "When does the first bus come?", "bases": {}}
    }
  "te-1050":
    native: "last"
    wiktionary: true
    notes:
      "n1": "{1} is the last bus."
    "examples": {
      "చివరి బంతికి సిక్సర్ కొట్టాడు.": {"native": "He hit a six off the last ball.", "bases": {}},
      "చివరి సన్నివేశంలో అందరూ ఏడ్చారు.": {"native": "In the last scene everyone cried.", "bases": {}}
    }
