schema: 1
id: "te-en-grammar-differences"
kind: "layer"
core: "te-grammar-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How Telugu grammar differs from English"
description: "Before any theme: the verb last, no is, endings for in, to and with, a verb for he against one shared by she and it, two yous, two wes, no articles, and how Telugu says have, not and questions."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "te-0117":
    native: "I eat rice."
    notes:
      "n1": "The verb comes last: subject, object, verb. Word for word, 'I rice eat'."
  "te-0118":
    native: "He is a doctor."
    alt_native: ["He is a physician."]
    notes:
      "n1": "No 'is' when you say what someone is: 'he doctor'."
  "te-0119":
    native: "in the room"
    alt_native: ["inside the room"]
    notes:
      "n1": "Telugu puts 'in' after the noun, as an ending: గది (gadi, room) + -లో (-lō)."
  "te-0120":
    native: "to school"
    notes:
      "n1": "'To' is the ending -కి (-ki) or -కు (-ku): బడి (baḍi, school) + -కి (-ki)."
  "te-0121":
    native: "with mother"
    alt_native: ["with my mother"]
    notes:
      "n1": "'With' is the ending -తో (-tō): అమ్మ (amma) + -తో (-tō)."
  "te-0122":
    native: "He came."
    alt_native: ["He arrived."]
    notes:
      "n1": "The verb shows whether 'he' is a man: -డు (-ḍu). రావడం (rāvaḍam) changes its stem in the past: వచ్చ- (vacc-)."
  "te-0123":
    native: "She came."
    alt_native: ["She arrived."]
    notes:
      "n1": "She and it share the verb ending -ది (-di); he has -డు (-ḍu). For respect: ఆవిడ వచ్చారు (āviḍa vaccāru), she came, just as ఆయన వచ్చారు (āyana vaccāru) for a man. రావడం (rāvaḍam) changes its stem in the past: వచ్చ- (vacc-)."
  "te-0124":
    native: "It came."
    alt_native: ["It arrived."]
    notes:
      "n1": "A thing or an animal takes -ది (-di), the ending 'she' shares: ఆమె వచ్చింది (āme vaccindi). రావడం (rāvaḍam) changes its stem in the past: వచ్చ- (vacc-)."
  "te-0125":
    native: "Come! (to a friend)"
    notes:
      "n1": "Two words for 'you': నువ్వు (nuvvu) to a friend, a child or a younger person."
  "te-0126":
    native: "Please come."
    alt_native: ["Kindly come."]
    notes:
      "n1": "మీరు (mīru) is the respectful 'you', and the plural, and its verb ends in -ండి (-aṇḍi)."
  "te-0127":
    native: "we (you and I)"
    alt_native: ["you and me"]
    notes:
      "n1": "Two words for 'we': మనం (manam) includes the person you're talking to."
  "te-0128":
    native: "we (not you)"
    alt_native: ["we, excluding you"]
    notes:
      "n1": "మేము (mēmu) leaves the person you're talking to out."
  "te-0129":
    native: "I'll come."
    notes:
      "n1": "The ending -ను (-nu) says 'I', so నేను (nēnu) can be left out."
  "te-0130":
    native: "a book; one book"
    alt_native: ["a single book"]
    notes:
      "n1": "No word for 'the', and ఒక (oka), 'one', serves for 'a'."
  "te-0131":
    native: "I have a book."
    alt_native: ["I have got a book."]
    notes:
      "n1": "No verb 'have': 'near me a book is'."
  "te-0132":
    native: "I won't come."
    notes:
      "n1": "'Not' is built into the verb: రాను (rānu) is 'won't come', వస్తాను (vastānu) 'will come'."
  "te-0133":
    native: "There's no time."
    notes:
      "n1": "లేదు (lēdu) is 'there is not', the opposite of ఉంది (undi)."
  "te-0134":
    native: "Will you come?"
    notes:
      "n1": "A yes-or-no question ends in -ఆ (-ā): మీరు వస్తారు (you will come) becomes మీరు వస్తారా (mīru vastārā), the last u turned into a long a. రావడం (rāvaḍam) changes its stem in the present and future: వస్- (vas-)."
