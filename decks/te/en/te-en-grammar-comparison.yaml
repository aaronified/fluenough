schema: 1
id: "te-en-grammar-comparison"
kind: "layer"
core: "te-grammar-comparison"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Comparing: bigger than, the most, even more"
description: "This is bigger than that, the biggest of all, even better: Telugu compares with కంటే (kaṇṭē), 'than', and no change to the adjective. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "te-1700":
    native: "than"
    notes:
      "n1": "Comes after the thing it is compared with: ఇది దాని కంటే పెద్దది (idi dāni kaṇṭē peddadi), this is bigger than that. With a pronoun, the stem changes: నా కంటే (nā kaṇṭē), than me; అతని కంటే (atani kaṇṭē), than him; దాని కంటే (dāni kaṇṭē), than that."
    examples:
      "ఇది దాని కంటే పెద్దది.": "This is bigger than that."
      "అతను ఆమె కంటే చిన్నవాడు.": "He is younger than her."
  "te-1701":
    native: "than (more informal)"
    notes:
      "n1": "Means the same as కంటే (kaṇṭē), and is more common in speech: ఇది దాని కన్నా చిన్నది (idi dāni kannā cinnadi), this is smaller than that. Use either one."
    examples:
      "ఇది దాని కన్నా చిన్నది.": "This is smaller than that."
      "అది దీని కన్నా ఎక్కువ.": "That is more than this."
  "te-1702":
    native: "the most; more than all"
    notes:
      "n1": "Made of అన్నిటి (anniṭi), of all, and కంటే (kaṇṭē): the most, the best or the biggest of a group, as in అన్నిటికంటే పెద్దది (anniṭikaṇṭē peddadi), the biggest of all."
    examples:
      "ఇది అన్నిటికంటే పెద్దది.": "This is the biggest of all."
      "ఇది అన్నిటికంటే మంచిది.": "This is the best of all."
  "te-1703":
    native: "even more; even"
    notes:
      "n1": "Goes before an adjective to say 'more': మరింత మంచిది (marinta mañcidi), even better. The adjective itself does not change."
    examples:
      "ఇది మరింత పెద్దది.": "This is even bigger."
      "ఇది మరింత మంచిది.": "This is even better."
  "te-1704":
    native: "same"
    notes:
      "n1": "Goes before a noun: ఒకే పుస్తకం (oke pustakam), the same book. The noun takes the plural, not ఒకే (oke): ఒకే పుస్తకాలు (oke pustakālu), the same books."
    examples:
      "ఇది ఒకే పుస్తకం.": "This is the same book."
      "ఇవి ఒకే పుస్తకాలు.": "These are the same books."
  "te-1705":
    native: "equally"
    bases:
      "సమానంగా": "equal"
    wiktionary: true
    notes:
      "n1": "From the adjective సమాన (samāna), equal, with the adverb ending -ంగా (-ṅgā): సమానంగా మంచివి (samānaṅgā mañcivi), equally good."
    examples:
      "ఈ రెండు పుస్తకాలు సమానంగా మంచివి.": "These two books are equally good."
      "ఇద్దరూ సమానంగా మంచివారు.":
        native: "The two of them are equally good."
        bases:
          "ఇద్దరూ":
            meaning: "two people; both"
  "te-1706":
    native: "This is bigger than that."
    alt_native: ["This is larger than that.", "This one is bigger than that."]
    notes:
      "n1": "No word for 'is': the ending -ది (-di) on పెద్దది (peddadi) says 'it is'. Word for word: 'this that-of than big-it'. Before కంటే (kaṇṭē) అది (adi), that, becomes దాని (dāni)."
    confusables:
      "small": { why: "చిన్నది (cinnadi) is the opposite: smaller, not bigger." }
      "more": { why: "ఎక్కువ (ekkuva) means 'more', but does not compare sizes here." }
  "te-1707":
    native: "This book is better than that one."
    alt_native: ["This book is better than that."]
    notes:
      "n1": "Word for word: 'this book, that book than, good-it'. The thing compared comes first, then కంటే (kaṇṭē), then the adjective."
    confusables:
      "worse": { why: "చెడ్డది (ceḍḍadi), 'bad', is the opposite of better." }
      "less": { why: "తక్కువ (takkuva) means 'less', not 'better'." }
  "te-1708":
    native: "This is not that big."
    alt_native: ["This is not so big.", "This is not that large."]
    notes:
      "n1": "Put అంత (anta), 'that much', before the adjective, and కాదు (kādu), 'not', at the end."
  "te-1709":
    native: "He eats more than me."
    alt_native: ["He eats more than I do."]
    notes:
      "n1": "With నేను (nēnu), the stem is నా (nā), not నేను (nēnu), before కంటే (kaṇṭē). With అతను (atanu), it is అతని (atani)."
    confusables:
      "less": { why: "తక్కువ (takkuva), 'less', would reverse the meaning." }
      "stem": { why: "నేను (nēnu) is the word for 'I', but before కంటే (kaṇṭē) the stem is నా (nā)." }
  "te-1710":
    native: "This is the best of all."
    alt_native: ["This is the best of them all."]
  "te-1711":
    native: "This is less than that."
  "te-1712":
    native: "This is even better."
    alt_native: ["This is better still."]
  "te-1713":
    native: "This is even bigger."
    alt_native: ["This is bigger still."]
  "te-1714":
    native: "These two books are equally good."
    alt_native: ["These two books are equally fine.", "These two books are just as good."]
    notes:
      "n1": "The noun takes its plural in -ఆలు (-ālu): పుస్తకం (pustakam) becomes పుస్తకాలు (pustakālu). The adjective agrees: మంచివి (mañcivi), good, for things."
    confusables:
      "unequal": { why: "తక్కువ (takkuva), 'less', is not 'equally'." }
      "more": { why: "ఎక్కువ (ekkuva), 'more', does not say 'equal'." }
  "te-1715":
    native: "He is younger than her."
    alt_native: ["He is younger than she is."]
  "te-1716":
    native: "I am older than him."
    alt_native: ["I am older than he is."]
