schema: 1
id: "te-en-history"
kind: "layer"
core: "te-history"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "History: kings, forts, wars and heritage"
description: "Words for history: rulers and kingdoms, forts and palaces, wars and freedom, and heritage. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-5100":
    native: "history"
    wiktionary: true
    notes:
      "n1": "Used in 'history book'."
    examples:
      "నాకు భారత చరిత్ర ఇష్టం.":
        native: "I like Indian history."
        bases:
          "నాకు": { meaning: "I" }
          "భారత": { meaning: "Indian" }
          "ఇష్టం": { meaning: "liking" }
      "ఈ పుస్తకం చరిత్ర గురించి ఉంది.":
        native: "This book is about history."
        bases:
          "ఈ": { meaning: "this" }
          "పుస్తకం": { meaning: "book" }
          "గురించి": { meaning: "about" }
          "ఉంది": { meaning: "to be; to exist" }
    senses:
      "history": { native: "history, tale, story, account, narrative" }
      "behavior": { native: "behavior, conduct" }
  "te-5101":
    native: "king"
    wiktionary: true
    notes:
      "n1": "Used in 'royal family'."
    examples:
      "ఆ రాజు చాలా ధైర్యవంతుడు.":
        native: "That king is very brave."
        bases:
          "ఆ": { meaning: "that" }
          "చాలా": { meaning: "very; many" }
          "ధైర్యవంతుడు": { meaning: "brave man" }
      "రాజు ఎక్కడ ఉన్నాడు?":
        native: "Where is the king?"
        bases:
          "ఎక్కడ": { meaning: "where" }
          "ఉన్నాడు": { meaning: "to be; to exist" }
    synonyms: { "redu": "king, ruler", "elika": "ruler, king, prince", "dora": "a chief, baron, lord, master, owner", "rayadu": "king" }
  "te-5102":
    native: "queen"
    wiktionary: true
    notes:
      "n1": "Used in 'queen's story'."
    examples:
      "రాణి ప్రజలకు మంచి పాలన ఇచ్చింది.":
        native: "The queen gave the people good rule."
        bases:
          "మంచి": { meaning: "good" }
          "ఇచ్చింది": { meaning: "to give" }
      "నాకు రాణి కథ చెప్పారు.":
        native: "They told me the queen's story."
        bases:
          "నాకు": { meaning: "I" }
          "కథ": { meaning: "story" }
          "చెప్పారు": { meaning: "to tell" }
  "te-5103":
    native: "kingdom"
    wiktionary: true
    notes:
      "n1": "Used in 'a small kingdom'."
    examples:
      "ఈ రాజ్యం చాలా పెద్దది.":
        native: "This kingdom is very big."
        bases:
          "ఈ": { meaning: "this" }
          "చాలా": { meaning: "very; many" }
          "పెద్దది": { meaning: "big" }
      "రాజ్యం మీద ఎవరు పాలించారు?":
        native: "Who ruled over the kingdom?"
        bases:
          "మీద": { meaning: "on; over" }
          "ఎవరు": { meaning: "who" }
          "పాలించారు": { meaning: "to rule" }
  "te-5104":
    native: "empire"
    notes:
      "n1": "Used in 'Maurya empire'."
    examples:
      "మౌర్య సామ్రాజ్యం భారతదేశంలో ఉండేది.":
        native: "The Maurya Empire was in India."
        bases:
          "మౌర్య": { meaning: "Maurya" }
          "భారతదేశంలో": { meaning: "India" }
          "ఉండేది": { meaning: "to be; to exist" }
      "అశోకుడు ఒక గొప్ప చక్రవర్తి.":
        native: "Ashoka was a great emperor."
        bases:
          "అశోకుడు": { meaning: "Ashoka" }
          "ఒక": { meaning: "one; a" }
          "గొప్ప": { meaning: "great" }
  "te-5105":
    native: "emperor"
    wiktionary: true
    notes:
      "n1": "Used in 'emperor's palace'."
    examples:
      "చక్రవర్తి రాజభవనంలో ఉన్నాడు.":
        native: "The emperor is in the palace."
        bases:
          "ఉన్నాడు": { meaning: "to be; to exist" }
      "ఆ చక్రవర్తి పేరు ఏమిటి?":
        native: "What is that emperor's name?"
        bases:
          "ఆ": { meaning: "that" }
          "పేరు": { meaning: "name" }
          "ఏమిటి": { meaning: "what" }
  "te-5106":
    native: "fort"
    wiktionary: true
    notes:
      "n1": "Used in 'fort wall'."
    examples:
      "ఈ కోట చాలా పాతది.":
        native: "This fort is very old."
        bases:
          "ఈ": { meaning: "this" }
          "చాలా": { meaning: "very; many" }
          "పాతది": { meaning: "old" }
      "మేము కోటను చూశాం.":
        native: "We saw the fort."
        bases:
          "మేము": { meaning: "we" }
          "కోటను": { meaning: "fort" }
          "చూశాం": { meaning: "to see" }
  "te-5107":
    native: "palace"
    notes:
      "n1": "Used in 'big palace'."
    examples:
      "రాజభవనం పెద్ద తోటలో ఉంది.":
        native: "The palace is in a big garden."
        bases:
          "పెద్ద": { meaning: "big" }
          "తోటలో": { meaning: "garden" }
          "ఉంది": { meaning: "to be; to exist" }
      "ఆ రాజభవనాన్ని ఎప్పుడు కట్టారు?":
        native: "When was that palace built?"
        bases:
          "ఆ": { meaning: "that" }
          "రాజభవనాన్ని": { meaning: "palace" }
          "ఎప్పుడు": { meaning: "when" }
          "కట్టారు": { meaning: "to build" }
  "te-5108":
    native: "war; battle"
    wiktionary: true
    notes:
      "n1": "Used in 'after the war'."
    examples:
      "యుద్ధం చాలా కాలం జరిగింది.":
        native: "The war went on for a long time."
        bases:
          "చాలా": { meaning: "very; many" }
          "జరిగింది": { meaning: "to happen" }
      "ఆ యుద్ధంలో సైనికులు ధైర్యంగా పోరాడారు.":
        native: "In that war, the soldiers fought bravely."
        bases:
          "ఆ": { meaning: "that" }
          "యుద్ధంలో": { meaning: "war" }
          "ధైర్యంగా": { meaning: "courage" }
          "పోరాడారు": { meaning: "to fight" }
  "te-5109":
    native: "soldier"
    wiktionary: true
    notes:
      "n1": "The plural is 'soldiers'."
    examples:
      "సైనికుడు కోట గోడ మీద నిలబడ్డాడు.":
        native: "The soldier stood on the fort wall."
        bases:
          "గోడ": { meaning: "wall" }
          "మీద": { meaning: "on; over" }
          "నిలబడ్డాడు": { meaning: "to stand" }
      "నేను ఒక సైనికుడితో మాట్లాడాను.":
        native: "I talked with a soldier."
        bases:
          "నేను": { meaning: "I" }
          "ఒక": { meaning: "one; a" }
          "సైనికుడితో": { meaning: "soldier" }
          "మాట్లాడాను": { meaning: "to talk" }
    synonyms: { "bantu": "a servant" }
  "te-5110":
    native: "century"
    wiktionary: true
    notes:
      "n1": "Used in 'last century'."
    examples:
      "ఈ కోట రెండు శతాబ్దాల క్రితం కట్టారు.":
        native: "This fort was built two centuries ago."
        bases:
          "ఈ": { meaning: "this" }
          "రెండు": { meaning: "two" }
          "శతాబ్దాల": { meaning: "century" }
          "క్రితం": { meaning: "ago" }
          "కట్టారు": { meaning: "to build" }
      "గత శతాబ్దంలో ఈ ఊరు చాలా మారింది.":
        native: "This town changed a lot in the last century."
        bases:
          "గత": { meaning: "last; past" }
          "శతాబ్దంలో": { meaning: "century" }
          "ఈ": { meaning: "this" }
          "ఊరు": { meaning: "town; village" }
          "చాలా": { meaning: "very; many" }
          "మారింది": { meaning: "to change" }
  "te-5111":
    native: "year"
    wiktionary: true
    notes:
      "n1": "Used in 'last year'."
    examples:
      "ఈ మ్యూజియం గత సంవత్సరం తెరిచారు.":
        native: "This museum was opened last year."
        bases:
          "ఈ": { meaning: "this" }
          "గత": { meaning: "last; past" }
          "తెరిచారు": { meaning: "to open" }
      "ఒక సంవత్సరంలో మేము రెండు పుస్తకాలు చదివాం.":
        native: "In one year we read two books."
        bases:
          "ఒక": { meaning: "one; a" }
          "సంవత్సరంలో": { meaning: "year" }
          "మేము": { meaning: "we" }
          "రెండు": { meaning: "two" }
          "పుస్తకాలు": { meaning: "book" }
          "చదివాం": { meaning: "to read; to study" }
  "te-5112":
    native: "ancient"
    notes:
      "n1": "An adjective; it does not change for gender."
    examples:
      "ఇది ప్రాచీన దేవాలయం.":
        native: "This is an ancient temple."
        bases:
          "ఇది": { meaning: "this; it" }
      "ప్రాచీన చరిత్ర చాలా ఆసక్తికరం.":
        native: "Ancient history is very interesting."
        bases:
          "చాలా": { meaning: "very; many" }
          "ఆసక్తికరం": { meaning: "interesting" }
  "te-5113":
    native: "ancient; old"
    notes:
      "n1": "An adjective; the same in both sentences."
    examples:
      "ఈ పురాతన నగరం నదికి దగ్గర ఉంది.":
        native: "This ancient city is near the river."
        bases:
          "ఈ": { meaning: "this" }
          "నగరం": { meaning: "city" }
          "నదికి": { meaning: "river" }
          "దగ్గర": { meaning: "near" }
          "ఉంది": { meaning: "to be; to exist" }
      "పురాతన పుస్తకాలు మ్యూజియంలో ఉన్నాయి.":
        native: "Ancient books are in the museum."
        bases:
          "పుస్తకాలు": { meaning: "book" }
          "ఉన్నాయి": { meaning: "to be; to exist" }
  "te-5114":
    native: "historical"
    wiktionary: true
    notes:
      "n1": "An adjective made from the word for history."
    examples:
      "ఇది చారిత్రక ప్రదేశం.":
        native: "This is a historical place."
        bases:
          "ఇది": { meaning: "this; it" }
          "ప్రదేశం": { meaning: "place" }
      "చారిత్రక సంఘటనలు మనకు చాలా నేర్పుతాయి.":
        native: "Historical events teach us a lot."
        bases:
          "సంఘటనలు": { meaning: "event" }
          "మనకు": { meaning: "we (including you)" }
          "చాలా": { meaning: "very; many" }
          "నేర్పుతాయి": { meaning: "to teach" }
  "te-5115":
    native: "monument; memorial"
    wiktionary: true
    notes:
      "n1": "Used for memorials to people."
    examples:
      "ఈ స్మారకం మన వీరుల గుర్తుగా ఉంది.":
        native: "This monument is a memorial to our heroes."
        bases:
          "ఈ": { meaning: "this" }
          "మన": { meaning: "our" }
          "గుర్తుగా": { meaning: "sign; memory" }
          "ఉంది": { meaning: "to be; to exist" }
      "ఆ స్మారకాన్ని ప్రజలు ప్రతి ఏడాది చూస్తారు.":
        native: "People see that monument every year."
        bases:
          "ఆ": { meaning: "that" }
          "స్మారకాన్ని": { meaning: "monument" }
          "ప్రతి": { meaning: "every" }
          "ఏడాది": { meaning: "year" }
          "చూస్తారు": { meaning: "to see" }
  "te-5116":
    native: "temple"
    wiktionary: true
    notes:
      "n1": "Used for a temple in a town."
    examples:
      "ఈ దేవాలయం ఊరి మధ్యలో ఉంది.":
        native: "This temple is in the middle of the town."
        bases:
          "ఈ": { meaning: "this" }
          "ఊరి": { meaning: "town; village" }
          "మధ్యలో": { meaning: "middle" }
          "ఉంది": { meaning: "to be; to exist" }
      "పండుగ రోజున దేవాలయాన్ని అలంకరించారు.":
        native: "On the festival day they decorated the temple."
        bases:
          "పండుగ": { meaning: "festival" }
          "రోజున": { meaning: "day" }
          "దేవాలయాన్ని": { meaning: "temple" }
          "అలంకరించారు": { meaning: "to decorate" }
  "te-5117":
    native: "country"
    wiktionary: true
    notes:
      "n1": "Often said with 'our'."
    examples:
      "మన దేశం చాలా పురాతనమైనది.":
        native: "Our country is very ancient."
        bases:
          "మన": { meaning: "our" }
          "చాలా": { meaning: "very; many" }
          "పురాతనమైనది": { meaning: "ancient" }
      "ఈ దేశంలో అనేక రాజవంశాలు పాలించాయి.":
        native: "Many dynasties ruled in this country."
        bases:
          "ఈ": { meaning: "this" }
          "దేశంలో": { meaning: "country" }
          "అనేక": { meaning: "many" }
          "పాలించాయి": { meaning: "to rule" }
  "te-5118":
    native: "leader"
    wiktionary: true
    notes:
      "n1": "The plural is 'leaders'."
    examples:
      "అతను ప్రజల నాయకుడు.":
        native: "He is the leader of the people."
        bases:
          "అతను": { meaning: "he" }
      "ఆ యుద్ధంలో నాయకుడు కోటను కాపాడారు.":
        native: "In that war the leader protected the fort."
        bases:
          "ఆ": { meaning: "that" }
          "కాపాడారు": { meaning: "to protect" }
  "te-5119":
    native: "hero"
    wiktionary: true
    notes:
      "n1": "Used for heroes in stories and history."
    examples:
      "అతను మా ఊరి వీరుడు.":
        native: "He is our town's hero."
        bases:
          "అతను": { meaning: "he" }
          "మా": { meaning: "our" }
          "ఊరి": { meaning: "town; village" }
      "ఈ కథలో ఒక వీరుడు ఉంటాడు.":
        native: "In this story there is a hero."
        bases:
          "ఈ": { meaning: "this" }
          "కథలో": { meaning: "story" }
          "ఒక": { meaning: "one; a" }
          "ఉంటాడు": { meaning: "to be; to exist" }
    synonyms: { "surudu": "a brave or valiant man, a hero, champion" }
  "te-5120":
    native: "dynasty"
    notes:
      "n1": "Used with the history of a line of rulers."
    examples:
      "ఈ రాజవంశం వెయ్యి సంవత్సరాలు పాలించింది.":
        native: "This dynasty ruled for a thousand years."
        bases:
          "ఈ": { meaning: "this" }
          "వెయ్యి": { meaning: "thousand" }
          "పాలించింది": { meaning: "to rule" }
      "రాజవంశాల చరిత్ర మనకు తెలియాలి.":
        native: "We should know the history of dynasties."
        bases:
          "రాజవంశాల": { meaning: "dynasty" }
          "మనకు": { meaning: "we (including you)" }
          "తెలియాలి": { meaning: "to be known" }
  "te-5121":
    native: "capital"
    wiktionary: true
    notes:
      "n1": "The capital city of a country."
    examples:
      "ఢిల్లీ భారతదేశ రాజధాని.":
        native: "Delhi is the capital of India."
        bases:
          "ఢిల్లీ": { meaning: "Delhi" }
          "భారతదేశ": { meaning: "India" }
      "రాజధానికి ఈ రోడ్డు నుంచి వెళ్లవచ్చు.":
        native: "You can go to the capital by this road."
        bases:
          "రాజధానికి": { meaning: "capital" }
          "ఈ": { meaning: "this" }
          "రోడ్డు": { meaning: "road" }
          "నుంచి": { meaning: "from" }
          "వెళ్లవచ్చు": { meaning: "to go" }
  "te-5122":
    native: "rule; administration"
    notes:
      "n1": "Also used for a period of rule."
    examples:
      "ఆ రాజు పాలన ప్రజలకు మంచిది.":
        native: "That king's rule was good for the people."
        bases:
          "ఆ": { meaning: "that" }
          "మంచిది": { meaning: "good" }
      "బ్రిటిష్ పాలనలో ఎన్నో మార్పులు జరిగాయి.":
        native: "Many changes happened under British rule."
        bases:
          "బ్రిటిష్": { meaning: "British" }
          "పాలనలో": { meaning: "rule" }
          "ఎన్నో": { meaning: "many" }
          "మార్పులు": { meaning: "change" }
          "జరిగాయి": { meaning: "to happen" }
  "te-5123":
    native: "ruler"
    notes:
      "n1": "The plural is 'rulers'."
    examples:
      "ఆ పాలకుడు ఒక గొప్ప రాజు.":
        native: "That ruler was a great king."
        bases:
          "ఆ": { meaning: "that" }
          "ఒక": { meaning: "one; a" }
          "గొప్ప": { meaning: "great" }
      "ప్రజలు తమ పాలకుడిని గౌరవించారు.":
        native: "The people respected their ruler."
