schema: 1
id: "te-en-transport"
kind: "layer"
core: "te-transport"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bus, auto, cab"
description: "Getting a ride, agreeing the fare and getting off where you want. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0271":
    native: "bus"
  "te-0272":
    native: "auto-rickshaw"
    alt_native: ["auto", "tuk-tuk"]
  "te-0273":
    native: "taxi"
    alt_native: ["cab"]
  "te-0274":
    native: "fare"
    alt_native: ["ticket price"]
    notes:
      "n1": "ఎంత చార్జీ (enta cārjī)? How much is the fare?"
  "te-0275":
    native: "Please put the meter on."
    alt_native: ["Please turn on the meter"]
    notes:
      "n1": "Ask before you get in. If the driver refuses, agree the fare first."
    bases:
      "మీటర్": "meter"
  "te-0276":
    native: "I need to go to the station."
    alt_native: ["I have to go to the station"]
    notes:
      "n1": "-కి (ki), 'to', joins the end of the place: ఎయిర్‌పోర్ట్‌కి వెళ్ళాలి (eyirpōrṭki veḷḷāli)."
  "te-0277":
    native: "How long will it take?"
    alt_native: ["How long does it take?"]
    bases:
      "సేపు": "a length of time"
  "te-0278":
    native: "Stop here, please."
    alt_native: ["Please stop here"]
  "te-0279":
    native: "station"
  "te-0280":
    native: "ticket"
  "te-0281":
    native: "seat"
  "te-0282":
    native: "let's go; please go"
  "te-6646":
    "native": "AC; air conditioning"
    "notes":
      "n1": "Short for air conditioner. Said with the English letters: ఏసీ (ēsī)."
    "examples":
      "ఏసీ వేయండి.":
        "native": "Please switch the AC on."
      "ఏసీ ఆఫ్ చేయండి.":
        "native": "Please switch the AC off."
  "te-6647":
    "native": "helmet"
    "notes":
      "n1": "Said with the English word, as in everyday Telugu."
    "examples":
      "హెల్మెట్ ఎక్కడ?":
        "native": "Where is the helmet?"
      "నాకు హెల్మెట్ ఇవ్వండి.":
        "native": "Please give me a helmet."
  "te-6648":
    "native": "e-challan; traffic fine notice"
    "notes":
      "n1": "The notice for a traffic fine, often sent online or by text. Said with the English word. In the second example, వచ్చింది (vaccindi) is from రావడం (rāvaḍaṁ), and its stem changes."
    "examples":
      "చలాన్ ఎంత?":
        "native": "How much is the e-challan?"
      "నాకు చలాన్ వచ్చింది.":
        "native": "I got an e-challan."
  "te-6656":
    "native": "Where are you?"
    "notes":
      "n1": "ఉన్నారు (unnāru) is from ఉండడం (uṇḍaḍaṁ), and its stem changes."
  "te-6657":
    "native": "I am at …."
    "notes":
      "n1": "The … stands for the place. ఉన్నాను (unnānu) is from ఉండడం (uṇḍaḍaṁ), and its stem changes."
  "te-6658":
    "native": "Please wait a little."
    "notes":
      "n1": "Use it when the driver is ready to go but you are not yet at the car."
  "te-6659":
    "native": "Please cancel."
    "notes":
      "n1": "Use it to cancel a booking that has not started."
  "te-6660":
    "native": "Please go to this address."
    "notes":
      "n1": "చిరునామాకు (cirunāmāku) is చిరునామా (cirunāmā), address, with the -కు (-ku), to, at its end."
  "te-6661":
    "native": "Please book it on the app."
    "notes":
      "n1": "యాప్‌లో (yāplō) is on the app; the booking is బుక్ చేయడం (buk cēyaḍaṁ)."
  "te-6662":
    "native": "The pickup point is here."
    "notes":
      "n1": "ఉంది (undi) is from ఉండడం (uṇḍaḍaṁ), and its stem changes."
    "bases":
      "పికప్": "pickup"
      "పాయింట్": "point"
  "te-6663":
    "native": "What is your number?"
    "notes":
      "n1": "మీ (mī) is the possessive form of మీరు (mīru), you."
  "te-6664":
    "native": "I only have cash."
    "notes":
      "n1": "ఉంది (undi) is from ఉండడం (uṇḍaḍaṁ), and its stem changes."
  "te-6665":
    "native": "Please tell me the OTP."
    "notes":
      "n1": "The OTP is the code the app sends you; the driver asks for it before the ride starts."
  "te-6666":
    "native": "The OTP is four, eight, two, one."
    "notes":
      "n1": "Say an OTP as separate digits, one after another."
  "te-6667":
    "native": "Please show your licence."
    "notes":
      "n1": "Say it when the officer asks for the licence."
  "te-6668":
    "native": "Please show your papers."
    "notes":
      "n1": "పత్రాలు (patrālu) is the plural of పత్రం (patraṁ), paper or document."
  "te-6669":
    "native": "Please show the insurance paper."
    "notes":
      "n1": "బీమా (bīmā) is insurance; పత్రం (patraṁ) is the paper."
  "te-6670":
    "native": "I did not know."
    "notes":
      "n1": "తెలియలేదు (teliyalēdu) is the past negative of the verb to know, from తెలుసు (telusu)."
  "te-6671":
    "native": "How much is the fine?"
    "notes":
      "n1": "జరిమానా (jarimānā) is a fine, a penalty paid to the police or the court."
  "te-6672":
    "native": "Where should I pay?"
    "notes":
      "n1": "చెల్లించాలి (celliñcāli) is from చెల్లించడం (celliñcaḍaṁ), to pay."
  "te-6673":
    "native": "Can I pay the fine by UPI?"
    "notes":
      "n1": "యూపీఐతో (yūpīaitō) is UPI with -తో (-tō), by."
