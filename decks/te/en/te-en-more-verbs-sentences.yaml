id: "te-en-more-verbs-sentences"
kind: "layer"
core: "te-more-verbs-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs: sentences"
description: "Sentences with the new verbs and the words of the earlier units: what to open, close, wash, put and sing. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-0853":
    notes:
      "n1": "తెరవండి (teravaṇḍi) is the polite form of the command 'open', said to a person you address politely, or to several people."
    native: "Please open the door."
    alt_native: ["Please open up the door."]
  "te-0854":
    notes:
      "n1": "మూయండి (mūyaṇḍi) is the polite form of the command 'close', said to a person you address politely, or to several people."
    native: "Please close the window."
    alt_native: ["Please shut the window."]
  "te-0855":
    notes:
      "n1": "ఎక్కండి (ekkaṇḍi) is the polite form of the command 'get on', said to a person you address politely, or to several people."
    native: "Please get on the bus."
    alt_native: ["Please board the bus."]
  "te-0856":
    notes:
      "n1": "దిగండి (digaṇḍi) is the polite form of the command 'get off', said to a person you address politely, or to several people."
    native: "Please get off here."
    alt_native: ["Please alight here."]
  "te-0857":
    notes:
      "n1": "The first-person present-future ending -ānu is here on కడుగుతాను (kaḍugutānu), I wash, as in తాగుతాను (tāgutānu), I drink."
    native: "I wash the dishes."
    alt_native: ["I clean the dishes.", "I do the dishes."]
  "te-0858":
    notes:
      "n1": "పాడతారు (pāḍatāru), they sing, has the third-person plural present-future ending -tāru, as in నవ్వుతారు (navvutāru), they laugh."
    native: "The children sing a song."
    alt_native: ["The kids sing a song."]
  "te-0860":
    native: "I will look for the key."
    notes:
      "n1": "తాళం (tāḷaṁ) చెవి (tāḷaṁ cevi), key, is two nouns side by side for one thing; the first has no case ending."
    alt_native: ["I will search for the key."]
  "te-0861":
    notes:
      "n1": "నడుస్తుంది (naḍustundi), she walks, has the present-future ending -tundi that goes with ఆమె (āme), she."
    native: "She walks near the river every day."
    alt_native: ["She walks by the river every day."]
  "te-0862":
    notes:
      "n1": "నవ్వుతారు (navvutāru), they laugh, has the third-person plural present-future ending -tāru that goes with పిల్లలు (pillalu), children."
    native: "The children laugh."
    alt_native: ["The kids laugh."]
  "te-0863":
    notes:
      "n1": "కొంటారు (koṇṭāru), you buy, has the second-person present-future ending -tāru that goes with మీరు (mīru), you."
    native: "What do you buy in that shop?"
    alt_native: ["What do you buy at that store?"]
  "te-0864":
    notes:
      "n1": "పోయండి (pōyaṇḍi) is the polite form of the command 'pour', said to a person you address politely, or to several people."
    native: "Please pour the milk into the bowl."
    alt_native: ["Please pour the milk in the bowl."]
    bases:
      "పోయండి": "to pour"
