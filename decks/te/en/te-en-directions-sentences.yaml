schema: 1
id: "te-en-directions-sentences"
kind: "layer"
core: "te-directions-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Directions: sentences"
description: "Eight sentences about where things are and how to get there, with the words of the directions unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-7086":
    native: "Where is the way to the office?"
    bases:
      "ఆఫీసుకి": "to the office"
      "దారి": "way"
      "ఎక్కడ": "where?"
    confusables:
      "c1": { why: "ఎప్పుడు (eppuḍu) 'when', asks for a time, not a place." }
      "c2": { why: "ఎవరు (evaru) 'who', asks for a person, not a place." }
  "te-7087":
    native: "Go straight on that road."
    bases:
      "ఆ": "that"
      "రోడ్డులో": "on the road"
      "నేరుగా": "straight on"
      "వెళ్ళండి": "please go"
    confusables:
      "c1": { why: "దారి (dāri) 'way', is a way or route, not a road." }
      "c2": { why: "రావడం (rāvaḍaṁ) 'to come', is to come, the opposite of going." }
  "te-7088":
    native: "Turn right."
    bases:
      "కుడి": "right"
      "వైపు": "side"
      "తిరగండి": "please turn"
    confusables:
      "c1": { why: "ఎడమ (eḍama) 'left (side)', is left, the opposite side." }
      "c2": { why: "ముందు (mundu) 'ahead', is in front, not a side." }
  "te-7089":
    native: "The way is on the left."
    bases:
      "దారి": "way"
      "ఎడమ": "left"
      "వైపు": "side"
    confusables:
      "c1": { why: "కుడి (kuḍi) 'right (side)', is right, the opposite side." }
      "c2": { why: "వెనక (venaka) 'behind', is behind, a place and not a side." }
  "te-7090":
    native: "I'll stop here."
    bases:
      "నేను": "I"
      "ఇక్కడ": "here"
      "ఆగుతాను": "I stop"
    confusables:
      "c1": { why: "అక్కడ (akkaḍa) 'there', is there, the far place." }
      "c2": { why: "దగ్గర (daggara) 'near', is near, a distance and not a place." }
  "te-7091":
    native: "Is there a road here?"
    bases:
      "ఇక్కడ": "here"
      "రోడ్డు": "road"
      "ఉందా": "is there?"
    confusables:
      "c1": { why: "అక్కడ (akkaḍa) 'there', is there, a place and not here." }
      "c2": { why: "దారి (dāri) 'way', is a way or route, not a road." }
  "te-7092":
    native: "Mum is standing there."
    bases:
      "అమ్మ": "Mum"
      "అక్కడ": "there"
      "నిలబడుతుంది": "she stands"
    confusables:
      "c1": { why: "ఇక్కడ (ikkaḍa) 'here', is here, the near place." }
      "c2": { why: "ఆగడం (āgaḍaṁ) 'to stop', is to stop or wait, not to stand." }
  "te-7093":
    native: "It's behind the house."
    bases:
      "అది": "it"
      "ఇంటి": "house"
      "వెనక": "behind"
      "ఉంది": "is"
    confusables:
      "c1": { why: "ముందు (mundu) 'ahead', is in front, the opposite side." }
      "c2": { why: "దగ్గర (daggara) 'near', is near, not behind." }
