tags: ["beginner", "unreviewed"]
cards:
  "te-6100":
    native: "to jump"
    examples:
      "పిల్లవాడు నీటిలోకి దూకుతాడు.":
        native: "The boy jumps into the water."
        bases:
          "నీటిలోకి":
            meaning: "water"
          "దూకుతాడు":
            meaning: "to jump"
      "ఆ కుక్క ఒక్కసారిగా దూకుతుంది.":
        native: "That dog jumps up all at once."
        bases:
          "దూకుతుంది":
            meaning: "to jump"
    notes:
      "n1": "'I jump' and 'I will jump' are one form, {1}. The polite request is {2}."
