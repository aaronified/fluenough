native: { code: "en", iso639_3: "eng", name: "English" }
name: "Story actions"
description: "Sixty verbs for telling a story: climbing, falling, catching, choosing, deciding and finishing. Each has its form for 'I' and its polite request. Not yet checked by a Telugu speaker: please report any mistake."
