"schema": 1
"id": "te-en-illness"
"kind": "layer"
"core": "te-illness"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Illness and the doctor"
"description": "Feeling ill, the symptoms, the medicine and a visit to the doctor. Not yet checked by a Telugu speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "te-1500":
    "native": "fever"
    "notes":
      "n1": "The fever itself, the symptom. A temperature reading is a different word: ఉష్ణోగ్రత (uṣṇōgrata)."
    "examples":
      "నాకు జ్వరం వచ్చింది.":
        "native": "I've got a fever."
        "bases":
          "నాకు":
            "meaning": "to me"
          "వచ్చింది":
            "meaning": "came"
      "జ్వరం తగ్గిందా?":
        "native": "Has the fever gone down?"
        "bases":
          "తగ్గిందా":
            "meaning": "gone down"
    wiktionary: true
  "te-1501":
    "native": "cough"
    "notes":
      "n1": "The verb is దగ్గడం (daggaḍaṁ), to cough."
    "examples":
      "నాకు దగ్గు ఉంది.":
        "native": "I have a cough."
        "bases":
          "నాకు":
            "meaning": "to me"
          "ఉంది":
            "meaning": "there is"
      "రాత్రి దగ్గు ఎక్కువ.":
        "native": "The cough is worse at night."
    synonyms: { "kasamu": "cough" }
    wiktionary: true
  "te-1502":
    "native": "cold (the illness)"
    "notes":
      "n1": "The common cold. Cold weather is చలి (cali)."
    "examples":
      "నాకు జలుబు చేసింది.":
        "native": "I've caught a cold."
        "bases":
          "నాకు":
            "meaning": "to me"
          "చేసింది":
            "meaning": "has come about"
      "ముక్కు కారుతోంది, జలుబు ఉంది.":
        "native": "My nose is running; I have a cold."
        "bases":
          "కారుతోంది":
            "meaning": "is running"
          "ఉంది":
            "meaning": "there is"
    synonyms: { "saityamu": "a cold, catarrh" }
    wiktionary: true
  "te-1503":
    "native": "sneeze"
    "notes":
      "n1": "The verb is తుమ్మడం (tummaḍaṁ), to sneeze."
    "examples":
      "తుమ్ము వచ్చింది.":
        "native": "I sneezed."
        "bases":
          "వచ్చింది":
            "meaning": "came"
      "ఎక్కువగా తుమ్ముతున్నాను.":
        "native": "I'm sneezing a lot."
        "bases":
          "తుమ్ముతున్నాను":
            "meaning": "am sneezing"
    wiktionary: true
  "te-1504":
    "native": "vomit; being sick"
    "notes":
      "n1": "To be sick, say వాంతి చేసుకోవడం (vānti cēsukōvaḍaṁ). Here the word is used with అవడం (avaḍaṁ), to happen."
    "examples":
      "నాకు వాంతి అవుతోంది.":
        "native": "I'm being sick."
        "bases":
          "నాకు":
            "meaning": "to me"
          "అవుతోంది":
            "meaning": "is happening"
      "ఈ మందు తర్వాత వాంతి వచ్చింది.":
        "native": "I was sick after this medicine."
        "bases":
          "వచ్చింది":
            "meaning": "came"
    synonyms: { "kakkuta": "vomiting", "dokuta": "vomiting", "vamanamu": "vomiting" }
    wiktionary: true
  "te-1505":
    "native": "tiredness"
    "notes":
      "n1": "Being worn out. For weakness after an illness, see నీరసం (nīrasaṁ)."
    "examples":
      "నాకు చాలా అలసటగా ఉంది.":
        "native": "I feel very tired."
        "bases":
          "నాకు":
            "meaning": "to me"
          "అలసటగా":
            "meaning": "tired"
          "ఉంది":
            "meaning": "is"
      "ఈ జ్వరం వల్ల అలసట వచ్చింది.":
        "native": "The fever has left me exhausted."
        "bases":
          "వచ్చింది":
            "meaning": "came"
  "te-1506":
    "native": "illness; disease"
    "notes":
      "n1": "The general word. A patient is రోగి (rōgi)."
    "examples":
      "ఇది ఏ రోగం?":
        "native": "What illness is this?"
      "ఆమెకు పెద్ద రోగం ఉంది.":
        "native": "She has a serious illness."
        "bases":
          "ఆమెకు":
            "meaning": "to her"
          "ఉంది":
            "meaning": "there is"
    wiktionary: true
  "te-1507":
    "native": "disease"
    "notes":
      "n1": "A more formal word than రోగం (rōgaṁ)."
    "examples":
      "ఇది ఒక వ్యాధి.":
        "native": "This is a disease."
      "ఈ వ్యాధి నయమవుతుంది.":
        "native": "This disease can be cured."
        "bases":
          "నయమవుతుంది":
            "meaning": "will be cured"
    synonyms: { "rogamu": "disease" }
    senses:
      "quality": { native: "the quality or state of being sick - sickness" }
      "physical": { native: "a physical or psychical malfunction - disorder" }
    wiktionary: true
  "te-1508":
    "native": "health"
    "notes":
      "n1": "Being well. Its opposite is అనారోగ్యం (anārōgyaṁ)."
    "examples":
      "మీ ఆరోగ్యం ఎలా ఉంది?":
        "native": "How is your health?"
        "bases":
          "ఉంది":
            "meaning": "is"
      "ఆరోగ్యం బాగానే ఉంది.":
        "native": "My health is fine."
        "bases":
          "బాగానే":
            "meaning": "quite well"
          "ఉంది":
            "meaning": "is"
    wiktionary: true
  "te-1509":
    "native": "being unwell; ill health"
    "notes":
      "n1": "The opposite of ఆరోగ్యం (ārōgyaṁ), health."
    "examples":
      "అతను అనారోగ్యంతో ఉన్నాడు.":
        "native": "He is unwell."
        "bases":
          "అనారోగ్యంతో":
            "meaning": "with being unwell"
          "ఉన్నాడు":
            "meaning": "is"
      "అనారోగ్యం వల్ల పని చేయలేదు.":
        "native": "I couldn't work because I was unwell."
        "bases":
          "అనారోగ్యం":
            "meaning": "being unwell"
          "చేయలేదు":
            "meaning": "did not do"
    wiktionary: true
  "te-1510":
    "native": "weakness"
    "notes":
      "n1": "Feeling weak, often after an illness. For tiredness, see అలసట (alasaṭa)."
    "examples":
      "జ్వరం తర్వాత నీరసంగా ఉంది.":
        "native": "I feel weak after the fever."
        "bases":
          "నీరసంగా":
            "meaning": "weak"
          "ఉంది":
            "meaning": "is"
      "కొద్దిగా నీరసం తగ్గింది.":
        "native": "The weakness has eased a little."
        "bases":
          "తగ్గింది":
            "meaning": "has eased"
  "te-1511":
    "native": "tablet; pill"
    "notes":
      "n1": "A tablet or pill. A liquid medicine is సిరప్ (sirap), syrup."
    "examples":
      "రోజుకు ఒక మాత్ర తీసుకోండి.":
        "native": "Take one tablet a day."
        "bases":
          "రోజుకు":
            "meaning": "a day"
          "తీసుకోండి":
            "meaning": "take"
      "ఈ మాత్ర చేదుగా ఉంది.":
        "native": "This tablet tastes bitter."
        "bases":
          "చేదుగా":
            "meaning": "bitter"
          "ఉంది":
            "meaning": "is"
    senses:
      "measure": { native: "measure, extent" }
      "short": { native: "a short time, a moment" }
      "pill": { native: "pill" }
    wiktionary: true
  "te-1512":
    "native": "syrup"
    "notes":
      "n1": "A liquid medicine, often for a cough or a cold. From the English word."
    "examples":
      "దగ్గుకు సిరప్ ఇవ్వండి.":
        "native": "Please give me a cough syrup."
        "bases":
          "దగ్గుకు":
            "meaning": "for the cough"
          "ఇవ్వండి":
            "meaning": "give"
      "సిరప్ రోజుకు మూడు సార్లు తీసుకోండి.":
        "native": "Take the syrup three times a day."
        "bases":
          "రోజుకు":
            "meaning": "a day"
          "తీసుకోండి":
            "meaning": "take"
  "te-1513":
    "native": "injection; jab"
    "notes":
      "n1": "A common word in everyday speech, borrowed from English."
    "examples":
      "డాక్టర్ ఇంజెక్షన్ ఇచ్చారు.":
        "native": "The doctor gave an injection."
        "bases":
          "ఇచ్చారు":
            "meaning": "gave"
      "ఇంజెక్షన్ బాధగా ఉంటుందా?":
        "native": "Will the injection hurt?"
        "bases":
          "బాధగా":
            "meaning": "painfully"
          "ఉంటుందా":
            "meaning": "will it be"
  "te-1514":
    "native": "herbal decoction; herbal drink"
    "notes":
      "n1": "A drink made by boiling leaves or roots, often for a cold or a cough."
    "examples":
      "జలుబుకు కషాయం తాగండి.":
        "native": "Drink a herbal decoction for the cold."
        "bases":
          "జలుబుకు":
            "meaning": "for the cold"
          "తాగండి":
            "meaning": "drink"
      "మా అమ్మ కషాయం చేసింది.":
        "native": "My mum made a herbal drink."
        "bases":
          "చేసింది":
            "meaning": "made"
    wiktionary: true
  "te-1515":
    "native": "blood test"
    "notes":
      "n1": "Two words: రక్తం (raktaṁ), blood, and పరీక్ష (parīkṣa), a test."
    "examples":
      "డాక్టర్ రక్త పరీక్ష చేయమన్నారు.":
        "native": "The doctor asked for a blood test."
        "bases":
          "చేయమన్నారు":
            "meaning": "asked to do"
      "రక్త పరీక్ష ఫలితం రేపు వస్తుంది.":
        "native": "The blood test result comes tomorrow."
        "bases":
          "వస్తుంది":
            "meaning": "comes"
  "te-1516":
    "native": "clinic"
    "notes":
      "n1": "A small doctor's office. The hospital is ఆసుపత్రి (āsupatri)."
    "examples":
      "క్లినిక్ ఎక్కడ ఉంది?":
        "native": "Where is the clinic?"
        "bases":
          "ఉంది":
            "meaning": "is"
      "ఈ క్లినిక్ ఉదయం తెరుస్తారు.":
        "native": "This clinic opens in the morning."
        "bases":
          "తెరుస్తారు":
            "meaning": "open"
  "te-1517":
    "native": "pharmacy; medicine shop"
    "notes":
      "n1": "Two words: మందుల (mandula), of medicines, and దుకాణం (dukāṇaṁ), a shop."
    "examples":
      "మందుల దుకాణం ఎక్కడ ఉంది?":
        "native": "Where is the pharmacy?"
        "bases":
          "మందుల":
            "meaning": "of medicines"
          "ఉంది":
            "meaning": "is"
      "నేను మందుల దుకాణానికి వెళ్తాను.":
        "native": "I'll go to the pharmacy."
        "bases":
          "మందుల":
            "meaning": "of medicines"
          "వెళ్తాను":
            "meaning": "go"
  "te-1518":
    "native": "rest"
    "notes":
      "n1": "The verb is విశ్రాంతి తీసుకోవడం (viśrāṁti tīsukōvaḍaṁ), to rest."
    "examples":
      "మీరు కొంచెం విశ్రాంతి తీసుకోండి.":
        "native": "Please rest a little."
        "bases":
          "తీసుకోండి":
            "meaning": "take"
      "ఇంట్లో విశ్రాంతి అవసరం.":
        "native": "You need rest at home."
        "bases":
          "ఇంట్లో":
            "meaning": "at home"
    synonyms: { "ubusu": "rest, repose, unemployed time", "syn3": "relief; comfort" }
    wiktionary: true
  "te-1519":
    "native": "blanket"
    "notes":
      "n1": "Use it when you have a fever or feel cold."
    "examples":
      "దుప్పటి కప్పుకోండి.":
        "native": "Cover yourself with a blanket."
        "bases":
          "కప్పుకోండి":
            "meaning": "cover yourself"
      "నాకు చలిగా ఉంది, ఇంకో దుప్పటి ఇవ్వండి.":
        "native": "I'm cold; please give me another blanket."
        "bases":
          "నాకు":
            "meaning": "to me"
          "చలిగా":
            "meaning": "cold"
          "ఉంది":
            "meaning": "am"
          "ఇవ్వండి":
            "meaning": "give"
    senses:
      "garment": { native: "garment" }
      "bedspread": { native: "bedspread" }
    wiktionary: true
  "te-1520":
    "native": "temperature"
    "notes":
      "n1": "The reading on a thermometer. For the fever itself, see జ్వరం (jvaraṁ)."
    "examples":
      "ఉష్ణోగ్రత ఎంత?":
        "native": "What is the temperature?"
      "ఉష్ణోగ్రత చూడండి.":
        "native": "Check the temperature."
        "bases":
          "చూడండి":
            "meaning": "look; check"
    wiktionary: true
  "te-1521":
    "native": "treatment"
    "notes":
      "n1": "The medical care for an illness."
    "examples":
      "ఈ చికిత్స ఎంతకాలం?":
        "native": "How long is this treatment?"
      "డాక్టర్ చికిత్స మొదలుపెట్టారు.":
        "native": "The doctor has started the treatment."
        "bases":
          "మొదలుపెట్టారు":
            "meaning": "started"
    senses:
      "treatment": { native: "treatment" }
      "medical": { native: "the medical treatment" }
    wiktionary: true
  "te-1522":
    "native": "nurse"
    "notes":
      "n1": "A person, so the word takes the person's gender, mahat."
    "examples":
      "నర్సు నాకు ఇంజెక్షన్ ఇచ్చారు.":
        "native": "The nurse gave me an injection."
        "bases":
          "నాకు":
            "meaning": "to me"
          "ఇచ్చారు":
            "meaning": "gave"
      "నర్సు ఎప్పుడు వస్తారు?":
        "native": "When does the nurse come?"
        "bases":
          "వస్తారు":
            "meaning": "come"
  "te-1523":
    "native": "pharmacist"
    "notes":
      "n1": "A person, so the word takes the person's gender, mahat."
    "examples":
      "ఫార్మసిస్ట్ మాత్రలు ఇచ్చారు.":
        "native": "The pharmacist gave the tablets."
        "bases":
          "ఇచ్చారు":
            "meaning": "gave"
      "ఫార్మసిస్ట్ ఈ మందు గురించి చెప్పారు.":
        "native": "The pharmacist explained about this medicine."
        "bases":
          "చెప్పారు":
            "meaning": "said; explained"
  "te-1524":
    "native": "patient"
    "notes":
      "n1": "A person who is ill, so the word takes the person's gender, mahat."
    "examples":
      "రోగి ఇప్పుడు బాగానే ఉన్నాడు.":
        "native": "The patient is fine now."
        "bases":
          "బాగానే":
            "meaning": "quite well"
          "ఉన్నాడు":
            "meaning": "is"
      "డాక్టర్ రోగిని చూశారు.":
        "native": "The doctor saw the patient."
        "bases":
          "రోగిని":
            "meaning": "the patient"
          "చూశారు":
            "meaning": "saw"
    synonyms: { "vyadhigrastudu": "a sick person, a patient" }
    wiktionary: true
  "te-1525":
    "native": "prescription"
    "notes":
      "n1": "The doctor's paper that names the medicines."
    "examples":
      "డాక్టర్ ప్రిస్క్రిప్షన్ ఇచ్చారు.":
        "native": "The doctor gave a prescription."
        "bases":
          "ఇచ్చారు":
            "meaning": "gave"
      "ఈ ప్రిస్క్రిప్షన్ మందుల దుకాణంలో ఇవ్వండి.":
        "native": "Give this prescription at the pharmacy."
        "bases":
          "మందుల":
            "meaning": "of medicines"
          "ఇవ్వండి":
            "meaning": "give"
  "te-1526":
    "native": "medical treatment; medical care"
    "notes":
      "n1": "The care a doctor gives."
    "examples":
      "నాకు ఇంట్లోనే వైద్యం చేశారు.":
        "native": "They treated me at home."
        "bases":
          "నాకు":
            "meaning": "to me"
          "ఇంట్లోనే":
            "meaning": "at home"
          "చేశారు":
            "meaning": "did"
      "మంచి వైద్యం దొరికింది.":
        "native": "Good medical care was available."
        "bases":
          "దొరికింది":
            "meaning": "was found"
    wiktionary: true
  "te-1527":
    "native": "X-ray"
    "notes":
      "n1": "A picture of the bones, from the English word."
    "examples":
      "డాక్టర్ ఎక్స్‌రే తీయమన్నారు.":
        "native": "The doctor asked for an X-ray."
        "bases":
          "తీయమన్నారు":
            "meaning": "asked to take"
      "ఎక్స్‌రే రిపోర్ట్ రేపు వస్తుంది.":
        "native": "The X-ray report comes tomorrow."
        "bases":
          "వస్తుంది":
            "meaning": "comes"
  "te-1528":
    "native": "appointment"
    "notes":
      "n1": "A booked time to see a doctor."
    "examples":
      "నాకు డాక్టర్ అపాయింట్‌మెంట్ ఉంది.":
        "native": "I have a doctor's appointment."
