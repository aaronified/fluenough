id: "te-en-grammar-before-after"
kind: "layer"
core: "te-grammar-before-after"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Before and after: ముందు (mundu) and తర్వాత (tarvāta)"
description: "Telugu says 'before doing' with the -డానికి (-ḍāniki) form of the verb and ముందు (mundu, before), and 'after doing' with the -ిన (-ina) form of the verb and తర్వాత (tarvāta, after). Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "before": "before doing it"
    "after": "after doing it"
rules:
  "te-rule-before":
    name: "Before: -డానికి ముందు (-ḍāniki mundu)"
    explanation: "The verb's -డానికి (-ḍāniki) form is followed by ముందు (mundu, before) to say 'before doing it': {1} is the pattern, {2} is 'before eating' and {3} is 'before going'. The form is the same for every person: the rest of the sentence shows who does it."
  "te-rule-after":
    name: "After: -ిన తర్వాత (-ina tarvāta)"
    explanation: "The verb's past -ిన (-ina) form is followed by తర్వాత (tarvāta, after) to say 'after doing it': {1} is the pattern, {2} is 'after eating' and {3} is 'after going'. The same form works for every person."
