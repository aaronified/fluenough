schema: 1
id: "te-en-grammar-perfect-sentences"
kind: "layer"
core: "te-grammar-perfect-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Have done: sentences"
description: "Sentences with the -ి (-i) ఉన్నాను (unnānu) form and the verbs of the earlier units: what someone has already done. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
cards:
  "te-6525":
    native: "I have had my meal."
    alt_native: ["I have eaten my meal."]
    confusables:
      "c1": { why: "ఉన్నావు (unnāvu) is for you, and this sentence is about I." }
      "c2": { why: "చేశాను (cēśānu) is the plain past, I did it; it does not say the result still holds." }
  "te-6526":
    native: "We have already seen the film."
    alt_native: ["We have seen the movie already."]
    confusables:
      "c1": { why: "ఉన్నాం (unnāṁ) is we with you; this we does not include you." }
      "c2": { why: "చూస్తాము (cūstāmu) is we see or we will see, not a finished action." }
  "te-6527":
    native: "You have bought a book."
    alt_native: ["You have bought the book."]
    confusables:
      "c1": { why: "ఉన్నాను (unnānu) is I, but the sentence is about you." }
      "c2": { why: "కొన్నావు (konnāvu) is you bought it, the plain past with no sense of a result that still holds." }
  "te-6528":
    native: "You have opened the door."
    alt_native: ["You have opened up the door."]
    confusables:
      "c1": { why: "ఉన్నావు (unnāvu) is you to a friend; this sentence uses the respectful you." }
      "c2": { why: "తెరిచారు (tericāru) is you opened, the plain past; the door is still open here." }
  "te-6529":
    native: "He has read the book."
    alt_native: ["He has read a book."]
    confusables:
      "c1": { why: "ఉన్నారు (unnāru) is they or the respectful you, not he." }
      "c2": { why: "చదువుతాడు (caduvutāḍu) is he reads or he will read, not a finished action." }
  "te-6530":
    native: "She has drunk tea."
    alt_native: ["She has had some tea."]
    confusables:
      "c1": { why: "తాగుతుంది (tāgutundi) is she drinks or she will drink, not a finished action." }
      "c2": { why: "తాగింది (tāgindi) is she drank, the plain past." }
  "te-6531":
    native: "Mother has cooked the rice."
    alt_native: ["Mum has cooked the rice."]
    confusables:
      "c1": { why: "ఉన్నారు (unnāru) is they, and the sentence is about one person." }
      "c2": { why: "వండింది (vaṇḍindi) is she cooked, the plain past." }
  "te-6532":
    native: "They have bought vegetables."
    alt_native: ["They have bought some vegetables."]
    confusables:
      "c1": { why: "ఉన్నాము (unnāmu) is we, and the sentence is about they." }
      "c2": { why: "కొన్నారు (konnāru) is they bought, the plain past." }
  "te-6533":
    native: "I have got on the bus today."
    alt_native: ["I got on the bus today, and I am on it."]
    confusables:
      "c1": { why: "ఉన్నావు (unnāvu) is you, but the sentence is about I." }
      "c2": { why: "ఎక్కుతాను (ekkutānu) is I get on or I will get on, not a finished action." }
