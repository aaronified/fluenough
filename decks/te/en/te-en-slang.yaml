schema: 1
id: "te-en-slang"
kind: "layer"
core: "te-slang"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Slang"
description: "Everyday slang: what friends say that a textbook doesn't. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["slang", "unreviewed"]
cards:
  "te-0521":
    native: "mate; dude"
    alt_native: ["bro", "buddy"]
    notes:
      "n1": "Literally 'uncle' (a mother's brother), but between friends any man: ఏంటి మామా (ēṇṭi māmā)? Also బావా (bāvā), literally 'brother-in-law'."
  "te-0522":
    native: "What's up?"
    alt_native: ["What's happening?"]
    bases:
      "సంగతి": "matter; news"
  "te-0523":
    native: "great"
    alt_native: ["awesome", "cool"]
    notes:
      "n1": "సూపర్ సినిమా (sūpar sinimā), a great film."
  "te-0524":
    native: "it's brilliant"
    alt_native: ["That's brilliant"]
    notes:
      "n1": "Literally 'it shook': సినిమా అదిరింది (sinimā adirindi), the film was brilliant."
  "te-0525":
    native: "fantastic"
    alt_native: ["fabulous"]
    notes:
      "n1": "Literally 'a shout': కేక సినిమా (kēka sinimā), a fantastic film."
  "te-0526":
    native: "I'm bored"
    notes:
      "n1": "Literally 'boredom is hitting': నాకు బోర్ కొడుతోంది (nāku bōr koḍutōndi)."
    bases:
      "బోర్": "boredom"
  "te-0527":
    native: "don't stress"
    alt_native: ["don't worry"]
    notes:
      "n1": "To a friend; with respect, టెన్షన్ పడకండి (ṭenṣan paḍakaṇḍi)."
    bases:
      "టెన్షన్": "tension; stress"
      "పడకు": "to fall; to suffer"
  "te-0528":
    native: "showing off"
    alt_native: ["bragging", "boasting"]
    notes:
      "n1": "బిల్డప్ ఇవ్వకు (bilḍap ivvaku), stop showing off."
  "te-0529":
    native: "totally"
    alt_native: ["completely", "absolutely"]
    notes:
      "n1": "From English full: ఫుల్లు హ్యాపీ (fullu hyāpī), totally happy."
  "te-0530":
    native: "slipping away"
    notes:
      "n1": "వాడు జంప్ అయ్యాడు (vāḍu jamp ayyāḍu), he gave us the slip."
  "te-0531":
    native: "rubbish; worthless"
    alt_native: ["useless", "trash"]
    notes:
      "n1": "తొక్కలో సినిమా (tokkalō sinimā), a rubbish film. Rude: not for strangers."
  "te-0532":
    native: "to drink alcohol (said on its own)"
    notes:
      "n1": "With a drink named, తాగడం (tāgaḍam) is any drink: టీ తాగడం (ṭī tāgaḍam). On its own it means alcohol: అతను తాగుతాడు (atanu tāgutāḍu), he drinks."
  "te-0367":
    native: "booze (slang); medicine"
    notes:
      "n1": "Literally 'medicine'. Among friends it means alcohol: మందు కొట్టడం (mandu koṭṭaḍam), to drink."
  "te-0533":
    native: "to smoke a cigarette"
    notes:
      "n1": "Literally 'to drink a cigarette'. Smoking is ధూమపానం (dhūmapānam) on signs."
    bases:
      "సిగరెట్": "cigarette"
