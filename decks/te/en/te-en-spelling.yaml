id: "te-en-spelling"
kind: "layer"
core: "te-spelling"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Telugu spellings, old and new"
description: "Letters and spellings you will meet in older print, and how they are written today. Recognition only. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["advanced", "unreviewed"]
cards:
  "te-0550":
    native: "he; today అతడు (ataḍu) or అతను (atanu)"
    notes:
      "n1": "The half circle ఁ (arasunna) marked a light nasal. It is no longer said, and today's spelling leaves it out."
  "te-0551":
    native: "and; today మరియు (mariyu)"
    notes:
      "n1": "Older print has a second r, ఱ (shakata repha), in words like ఱెక్క (rekka), wing. It sounds like ర (ra), and today's spelling writes ర (ra)."
  "te-0552":
    native: "house; today ఇల్లు (illu)"
    notes:
      "n1": "Older print, Gurajada's among it, often writes a y before i and e at the start of a word, as many say it: యిల్లు (yillu), యెక్కడ (yekkaḍa). Today: ఇల్లు (illu), ఎక్కడ (ekkaḍa)."
  "te-0553":
    native: "is; today ఉంది (undi)"
    notes:
      "n1": "The same before u and o: a v, as many say it: వుంది (vundi), వొక (voka). Today: ఉంది (undi), ఒక (oka)."
  "te-0554":
    native: "go; also వెళ్ళు (veḷḷu)"
    notes:
      "n1": "The double curled-back l is written ళ్ళ (ḷḷa) or ళ్ల (ḷla): వెళ్ళు (veḷḷu), వెళ్లు (veḷlu). Both are everywhere."
  "te-0555":
    native: "leave; a holiday; today సెలవు (selavu)"
    alt_native: ["vacation"]
    notes:
      "n1": "An older spelling: today సెలవు (selavu)."
  "te-0556":
    native: "under; today కింద (kinda)"
    alt_native: ["beneath"]
    notes:
      "n1": "The older spelling, still in print; most write and say కింద (kinda)."
  "te-0557":
    native: "wedding; today పెళ్ళి (peḷḷi)"
    alt_native: ["wedding ceremony"]
    notes:
      "n1": "The older form, still on formal invitations."
  "te-0558":
    native: "morning; today పొద్దున (podduna)"
    notes:
      "n1": "The older spelling; today పొద్దున (podduna)."
