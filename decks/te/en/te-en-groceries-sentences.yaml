cards:
  "te-7068":
    native: "I drink milk every day."
    bases:
      "నేను": "I"
      "రోజుకు": "a day"
      "పాలు": "milk"
      "తాగుతాను": "I drink"
    confusables:
      "c1": { why: "బియ్యం (biyyaṁ) 'rice (uncooked)', is a grain, not a drink." }
      "c2": { why: "గుడ్డు (guḍḍu) 'egg', is an egg, a different food." }
  "te-7069":
    native: "Mum buys rice."
    bases:
      "అమ్మ": "Mum"
      "బియ్యం": "rice"
      "కొంటుంది": "she buys"
    confusables:
      "c1": { why: "పాలు (pālu) 'milk', is a drink, not a grain." }
      "c2": { why: "పప్పు (pappu) 'lentils', is a pulse, a different food." }
  "te-7070":
    native: "Do you eat fish?"
    bases:
      "నువ్వు": "you"
      "చేప": "fish"
      "తింటావా": "do you eat?"
    confusables:
      "c1": { why: "మటన్ (maṭan) 'mutton (goat meat)', is goat meat, not fish." }
      "c2": { why: "కోడి (kōḍi) 'chicken', is chicken, a different meat." }
  "te-7071":
    native: "She cooks the chicken."
    bases:
      "ఆమె": "she"
      "కోడిని": "the chicken"
      "వండుతుంది": "she cooks"
    confusables:
      "c1": { why: "చేప (cēpa) 'fish', is a fish, a different food." }
      "c2": { why: "మటన్ (maṭan) 'mutton (goat meat)', is goat meat, another meat." }
  "te-7072":
    native: "There is rice at home."
    alt_native: ["I have rice at home."]
    bases:
      "నా": "my"
      "ఇంట్లో": "at home"
      "బియ్యం": "rice"
      "ఉంది": "there is"
    confusables:
      "c1": { why: "పప్పు (pappu) 'lentils', is a pulse, another food." }
      "c2": { why: "కుటుంబం (kuṭumbaṁ) 'family', names a family, not a place." }
  "te-7073":
    native: "Please take this dal."
    bases:
      "ఈ": "this"
      "పప్పు": "dal"
      "తీసుకోండి": "please take"
    confusables:
      "c1": { why: "పాలు (pālu) 'milk', is a drink, not a pulse." }
      "c2": { why: "ఇవ్వడం (ivvaḍaṁ) 'to give', is to give, a different verb." }
  "te-7074":
    native: "I cook fish together with Mum."
    bases:
      "నేను": "I"
      "అమ్మతో": "with Mum"
      "కలిసి": "together"
      "చేపలు": "fish"
      "వండుతాను": "I cook"
    confusables:
      "c1": { why: "కూరగాయలు (kūragāyalu) 'vegetables', is a vegetable, not a fish." }
      "c2": { why: "నాన్న (nānna) 'father', is a father, not a mother." }
  "te-7075":
    native: "I take milk from the farmer."
    bases:
      "రైతు": "farmer"
      "నుంచి": "from"
      "పాలు": "milk"
      "తీసుకుంటాను": "I take"
    confusables:
      "c1": { why: "దుకాణదారు (dukāṇadāru) 'shopkeeper', names a shopkeeper, who sells and does not farm." }
      "c2": { why: "వంటవాడు (vaṇṭavāḍu) 'cook', names a cook, who cooks food." }
  "te-7076":
    native: "Will you give me two eggs?"
    bases:
      "నాకు": "to me"
      "రెండు": "two"
      "గుడ్లు": "eggs"
      "ఇస్తావా": "will you give?"
    confusables:
      "c1": { why: "కోడి (kōḍi) 'chicken', is chicken, a different food." }
      "c2": { why: "మూడు (mūḍu) '3, three', is three, not two." }
  "te-7077":
    native: "He eats only lentils."
    bases:
      "ఆయన": "he"
      "పప్పు": "lentils"
      "మాత్రమే": "only"
      "తింటాడు": "he eats"
    confusables:
      "c1": { why: "చేప (cēpa) 'fish', is a fish, a different food." }
      "c2": { why: "పాలు (pālu) 'milk', is a drink, not a pulse." }
