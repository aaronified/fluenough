native: { code: "en", iso639_3: "eng", name: "English" }
name: "Groceries: sentences"
description: "Ten sentences about buying and cooking food, with the words of the groceries unit and the units before it. They unlock once their words and rules are known. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "te-7068":
    notes:
      "n1": "తాగుతాను (tāgutānu) is the 'I' form of తాగడం (tāgaḍaṁ), to drink, and this one form covers both a habit and a future action."
    native: "I drink milk every day."
    confusables:
      "c1": { why: "బియ్యం (biyyaṁ) 'rice (uncooked)', is a grain, not a drink." }
      "c2": { why: "గుడ్డు (guḍḍu) 'egg', is an egg, a different food." }
  "te-7069":
    notes:
      "n1": "కొంటుంది (koṇṭundi) is the form for she or it, and అమ్మ (amma), mum, takes that form."
    native: "Mum buys rice."
    confusables:
      "c1": { why: "పాలు (pālu) 'milk', is a drink, not a grain." }
      "c2": { why: "పప్పు (pappu) 'lentils', is a pulse, a different food." }
  "te-7070":
    notes:
      "n1": "నువ్వు (nuvvu), you, is the form for a friend, a child or someone younger, and తింటావా (tiṇṭāvā) is its question form of తినడం (tinaḍaṁ), to eat."
    native: "Do you eat fish?"
    confusables:
      "c1": { why: "మటన్ (maṭan) 'mutton (goat meat)', is goat meat, not fish." }
      "c2": { why: "కోడి (kōḍi) 'chicken', is chicken, a different meat." }
  "te-7071":
    notes:
      "n1": "కోడిని (kōḍini) marks the chicken as a particular thing being acted on, and వండుతారు (vaṇḍutāru) is the form for they, of వండడం (vaṇḍaḍaṁ), to cook."
    native: "They cook the chicken at night."
    confusables:
      "c1": { why: "చేప (cēpa) 'fish', is a fish, a different food." }
      "c2": { why: "మటన్ (maṭan) 'mutton (goat meat)', is goat meat, another meat." }
  "te-7072":
    notes:
      "n1": "ఉంది (undi) is the form that says there is, so బియ్యం (biyyaṁ) needs no change; the house takes the stem ఇంటి (iṇṭi) before its ending in ఇంట్లో (iṇṭlō), from ఇల్లు (illu)."
    native: "There is rice in my house."
    alt_native: ["I have rice at home."]
    confusables:
      "c1": { why: "పప్పు (pappu) 'lentils', is a pulse, another food." }
      "c2": { why: "కుటుంబం (kuṭumbaṁ) 'family', names a family, not a place." }
  "te-7073":
    notes:
      "n1": "తీసుకోండి (tīsukōṇḍi) is the polite request form of తీసుకోవడం (tīsukōvaḍaṁ), to take, and ఈ (ī), this, goes before the noun it points to."
    native: "Please take this dal."
    confusables:
      "c1": { why: "పాలు (pālu) 'milk', is a drink, not a pulse." }
      "c2": { why: "ఇవ్వడం (ivvaḍaṁ) 'to give', is to give, a different verb." }
  "te-7074":
    notes:
      "n1": "అమ్మతో (ammatō), with mum, has the 'with' form on the person, as the with form of the grammar deck shows, and కలిసి (kalisi), together, is a word of its own."
    native: "I cook fish together with Mum."
    confusables:
      "c1": { why: "కూరగాయలు (kūragāyalu) 'vegetables', is a vegetable, not a fish." }
      "c2": { why: "నాన్న (nānna) 'father', is a father, not a mother." }
  "te-7075":
    notes:
      "n1": "నుంచి (nuñci), from, stands after the noun as a separate word, as in రైతు (raitu) నుంచి (nuñci)."
    native: "I take milk from the farmer."
    bases:
      "నుంచి": "from"
    confusables:
      "c1": { why: "దుకాణదారు (dukāṇadāru) 'shopkeeper', names a shopkeeper, who sells and does not farm." }
      "c2": { why: "వంటవాడు (vaṇṭavāḍu) 'cook', names a cook, who cooks food." }
  "te-7076":
    notes:
      "n1": "నాకు (nāku) is the 'to me' form of నేను (nēnu), I, which Telugu uses for what is given to someone, and ఇస్తావా (istāvā) is the 'you' question form of ఇవ్వడం (ivvaḍaṁ), to give."
    native: "Will you give me two eggs?"
    confusables:
      "c1": { why: "కోడి (kōḍi) 'chicken', is chicken, a different food." }
      "c2": { why: "మూడు (mūḍu) '3, three', is three, not two." }
  "te-7077":
    notes:
      "n1": "మాత్రమే (mātramē), only, comes right after the word it limits, here పప్పు (pappu)."
    native: "He eats only lentils."
    confusables:
      "c1": { why: "చేప (cēpa) 'fish', is a fish, a different food." }
      "c2": { why: "పాలు (pālu) 'milk', is a drink, not a pulse." }
