schema: 1
id: te-en-spelling
name: "Telugu spellings, old and new"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Letters and spellings you will meet in older print, and how they are written today. Recognition only. Not yet checked by a Telugu speaker: please report any mistake."
tags: [advanced, unreviewed]
cards:
  - id: te-0550
    target: "అతఁడు"
    native: "he; today అతడు or అతను"
    reading: "atadu"
    pos: "other"
    modes: [recognition]
    notes: "The half circle ఁ (arasunna) marked a light nasal. It is no longer said, and today's spelling leaves it out."
  - id: te-0551
    target: "మఱియు"
    native: "and; today మరియు"
    reading: "mariyu"
    pos: "other"
    modes: [recognition]
    notes: "Older print has a second r, ఱ (shakata repha), in words like ఱెక్క, wing. It sounds like ర, and today's spelling writes ర."
  - id: te-0552
    target: "యిల్లు"
    native: "house; today ఇల్లు"
    reading: "yillu"
    pos: "other"
    modes: [recognition]
    notes: "Older print, Gurajada's among it, often writes a y before i and e at the start of a word, as many say it: యిల్లు, యెక్కడ. Today: ఇల్లు, ఎక్కడ."
  - id: te-0553
    target: "వుంది"
    native: "is; today ఉంది"
    reading: "vundi"
    pos: "other"
    modes: [recognition]
    notes: "The same before u and o: a v, as many say it: వుంది, వొక. Today: ఉంది, ఒక."
  - id: te-0554
    target: "వెళ్లు"
    native: "go; also వెళ్ళు"
    reading: "vellu"
    pos: "other"
    modes: [recognition]
    notes: "The double curled-back l is written ళ్ళ or ళ్ల: వెళ్ళు, వెళ్లు. Both are everywhere."
  - id: te-0555
    target: "శలవు"
    native: "leave; a holiday; today సెలవు"
    reading: "shalavu"
    pos: "other"
    modes: [recognition]
    notes: "An older spelling: today సెలవు."
  - id: te-0556
    target: "క్రింద"
    native: "under; today కింద"
    reading: "krinda"
    pos: "other"
    modes: [recognition]
    notes: "The older spelling, still in print; most write and say కింద."
  - id: te-0557
    target: "పెండ్లి"
    native: "wedding; today పెళ్ళి"
    reading: "pendli"
    pos: "other"
    modes: [recognition]
    notes: "The older form, still on formal invitations."
  - id: te-0558
    target: "ప్రొద్దున"
    native: "morning; today పొద్దున"
    reading: "prodduna"
    pos: "other"
    modes: [recognition]
    notes: "The older spelling; today పొద్దున."
