schema: 1
id: te-en-spelling
name: "Telugu spellings, old and new"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Letters and spellings you will meet in older print, and how they are written today. Recognition only. Not yet checked by a Telugu speaker: please report any mistake."
tags: [advanced, unreviewed]
cards:
  - id: te-0550
    target: "అతఁడు"
    native: "he; today అతడు (ataḍu) or అతను (atanu)"
    reading: "ataḍu"
    ipa: "at̪aɖu"
    pos: "other"
    modes: [recognition]
    notes: "The half circle ఁ (arasunna) marked a light nasal. It is no longer said, and today's spelling leaves it out."
  - id: te-0551
    target: "మఱియు"
    native: "and; today మరియు (mariyu)"
    reading: "mariyu"
    ipa: "mariju"
    pos: "other"
    modes: [recognition]
    notes: "Older print has a second r, ఱ (shakata repha), in words like ఱెక్క (rekka), wing. It sounds like ర (ra), and today's spelling writes ర (ra)."
  - id: te-0552
    target: "యిల్లు"
    native: "house; today ఇల్లు (illu)"
    reading: "yillu"
    ipa: "jillu"
    pos: "other"
    modes: [recognition]
    notes: "Older print, Gurajada's among it, often writes a y before i and e at the start of a word, as many say it: యిల్లు (yillu), యెక్కడ (yekkaḍa). Today: ఇల్లు (illu), ఎక్కడ (ekkaḍa)."
  - id: te-0553
    target: "వుంది"
    native: "is; today ఉంది (undi)"
    reading: "vundi"
    ipa: "ʋund̪i"
    pos: "other"
    modes: [recognition]
    notes: "The same before u and o: a v, as many say it: వుంది (vundi), వొక (voka). Today: ఉంది (undi), ఒక (oka)."
  - id: te-0554
    target: "వెళ్లు"
    native: "go; also వెళ్ళు (veḷḷu)"
    reading: "veḷlu"
    ipa: "ʋeɭlu"
    pos: "other"
    modes: [recognition]
    notes: "The double curled-back l is written ళ్ళ (ḷḷa) or ళ్ల (ḷla): వెళ్ళు (veḷḷu), వెళ్లు (veḷlu). Both are everywhere."
  - id: te-0555
    target: "శలవు"
    native: "leave; a holiday; today సెలవు (selavu)"
    reading: "śalavu"
    ipa: "ʃalaʋu"
    pos: "other"
    modes: [recognition]
    notes: "An older spelling: today సెలవు (selavu)."
  - id: te-0556
    target: "క్రింద"
    native: "under; today కింద (kinda)"
    reading: "krinda"
    ipa: "krind̪a"
    pos: "other"
    modes: [recognition]
    notes: "The older spelling, still in print; most write and say కింద (kinda)."
  - id: te-0557
    target: "పెండ్లి"
    native: "wedding; today పెళ్ళి (peḷḷi)"
    reading: "peṇḍli"
    ipa: "peɳɖli"
    pos: "other"
    modes: [recognition]
    notes: "The older form, still on formal invitations."
  - id: te-0558
    target: "ప్రొద్దున"
    native: "morning; today పొద్దున (podduna)"
    reading: "prodduna"
    ipa: "prod̪d̪una"
    pos: "other"
    modes: [recognition]
    notes: "The older spelling; today పొద్దున (podduna)."
