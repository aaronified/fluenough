    reading: "śukravāram"
    ipa: "ʃukraʋaːram"
    pos: "noun"
  - id: te-0323
    target: "శనివారం"
    native: "Saturday"
    reading: "śanivāram"
    ipa: "ʃaniʋaːram"
    pos: "noun"
  - id: te-0324
    target: "ఆదివారం"
    native: "Sunday"
    reading: "ādivāram"
    ipa: "aːd̪iʋaːram"
    pos: "noun"
