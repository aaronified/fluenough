schema: 1
id: te-en-time
name: "Time and days"
kind: vocab
theme: time
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Today and tomorrow, telling the time, and the days of the week. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: te-0306
    target: "ఈరోజు"
    native: "today"
    reading: "iroju"
    alt_target: ["ఈ రోజు"]
    pos: "adv"
  - id: te-0307
    target: "రేపు"
    native: "tomorrow"
    reading: "repu"
    pos: "adv"
    notes: "Unlike Hindi and Bengali, Telugu has a separate word for yesterday: నిన్న."
  - id: te-0308
    target: "నిన్న"
    native: "yesterday"
    reading: "ninna"
    pos: "adv"
  - id: te-0309
    target: "ఇప్పుడు"
    native: "now"
    reading: "ippudu"
    pos: "adv"
  - id: te-0310
    target: "పొద్దున"
    native: "morning"
    reading: "podduna"
    alt_target: ["ఉదయం"]
    pos: "noun"
    notes: "Formally ఉదయం (udayam)."
  - id: te-0311
    target: "సాయంత్రం"
    native: "evening"
    reading: "sayantram"
    pos: "noun"
  - id: te-0312
    target: "రాత్రి"
    native: "night"
    reading: "ratri"
    pos: "noun"
  - id: te-0313
    target: "గంటలు"
    native: "o'clock; hours"
    reading: "gantalu"
    pos: "noun"
    notes: "నాలుగు గంటలు (nalugu gantalu), four o'clock."
  - id: te-0314
    target: "నాలుగున్నర"
    native: "half past four; 4½"
    reading: "nalugunnara"
    pos: "other"
    notes: "-న్నర adds a half to any number."
  - id: te-0315
    target: "టైం ఎంత?"
    native: "What time is it?"
    reading: "taim enta?"
    pos: "phrase"
    notes: "Also ఎన్ని గంటలు? (enni gantalu?)."
