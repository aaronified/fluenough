    target: "వారం"
    native: "week"
    reading: "vāram"
    ipa: "ʋaːram"
    pos: "noun"
  - id: te-0318
    target: "సోమవారం"
    native: "Monday"
    reading: "sōmavāram"
    ipa: "soːmaʋaːram"
    pos: "noun"
    notes: "Each day ends in వారం (vāram), and most names match Hindi's."
  - id: te-0319
    target: "మంగళవారం"
