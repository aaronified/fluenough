  - id: te-0191
    target: "నా పేరు …"
    native: "My name is …"
    reading: "nā pēru..."
    ipa: "naː peːru"
    pos: "phrase"
    notes: "There is no 'is': 'my name …'."
  - id: te-0192
    target: "మీ పేరు ఏమిటి?"
    native: "What is your name?"
    reading: "mī pēru ēmiṭi?"
    ipa: "miː peːru eːmiʈi"
    pos: "phrase"
    tags: ["polite"]
  - id: te-0193
    target: "నేను … నుంచి వచ్చాను."
    native: "I'm from …"
    reading: "nēnu... nuñci vaccānu."
    ipa: "neːnu nuɲtʃi ʋatʃtʃaːnu"
    pos: "phrase"
    notes: "Literally 'I came from …'. నుంచి (nuñci), 'from', comes after the place."
  - id: te-0194
    target: "నేను …లో ఉంటాను."
    native: "I live in …"
    reading: "nēnu...lō uṇṭānu."
    ipa: "neːnu loː uɳʈaːnu"
    pos: "phrase"
    notes: "-లో (lō), 'in', joins the end of the place: హైదరాబాద్‌లో, in Hyderabad."
