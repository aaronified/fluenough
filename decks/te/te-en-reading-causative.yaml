  "sentences":
  - "text": "నా పేరు ఇక్కడ రాశాను."
    "reading": "nā pēru ikkaḍa rāśānu."
    "ipa": "naː peːru ikkaɖa raːʃaːnu"
  - "text": "నా కెమెరా పని చేయడం లేదు."
    "reading": "nā kemerā pani cēyaḍaṁ lēdu."
    "ipa": "naː kemeraː pani tʃeːjaɖam leːd̪u"
  - "text": "దయచేసి దీన్ని పని చేయించండి."
    "reading": "dayacēsi dīnni pani cēyiñcaṇḍi."
    "ipa": "d̪ajatʃeːsi d̪iːnni pani tʃeːjiɲtʃaɳɖi"
  - "text": "పని తర్వాత నాకు తెలియజేయండి."
    "reading": "pani tarvāta nāku teliyajēyaṇḍi."
    "ipa": "pani t̪arʋaːt̪a naːku t̪elijadʒeːjaɳɖi"
