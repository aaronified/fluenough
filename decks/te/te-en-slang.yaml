schema: 1
id: te-en-slang
name: "Slang"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Everyday slang: what friends say that a textbook doesn't. Not yet checked by a Telugu speaker: please report any mistake."
tags: [slang, unreviewed]
cards:
  - id: te-0521
    target: "మామా"
    native: "mate; dude"
    reading: "maamaa"
    pos: "noun"
    notes: "Literally 'uncle' (a mother's brother), but between friends any man: ఏంటి మామా? Also బావా (baavaa), literally 'brother-in-law'."
  - id: te-0522
    target: "ఏంటి సంగతి?"
    native: "What's up?"
    reading: "eenti sangati?"
    pos: "phrase"
  - id: te-0523
    target: "సూపర్"
    native: "great"
    reading: "suupar"
    pos: "adj"
    notes: "సూపర్ సినిమా, a great film."
  - id: te-0524
    target: "అదిరింది"
    native: "it's brilliant"
    reading: "adirindi"
    pos: "noun"
    notes: "Literally 'it shook': సినిమా అదిరింది, the film was brilliant."
  - id: te-0525
    target: "కేక"
    native: "fantastic"
    reading: "keeka"
    pos: "noun"
    notes: "Literally 'a shout': కేక సినిమా, a fantastic film."
  - id: te-0526
    target: "బోర్ కొడుతోంది"
    native: "I'm bored"
    reading: "boor kodutoondi"
    pos: "phrase"
    notes: "Literally 'boredom is hitting': నాకు బోర్ కొడుతోంది."
  - id: te-0527
    target: "టెన్షన్ పడకు"
    native: "don't stress"
    reading: "tenshan padaku"
    pos: "phrase"
    notes: "To a friend; with respect, టెన్షన్ పడకండి."
  - id: te-0528
    target: "బిల్డప్"
    native: "showing off"
    reading: "bildap"
    pos: "noun"
    notes: "బిల్డప్ ఇవ్వకు, stop showing off."
  - id: te-0529
    target: "ఫుల్లు"
    native: "totally"
    reading: "fullu"
    pos: "noun"
    notes: "From English full: ఫుల్లు హ్యాపీ, totally happy."
  - id: te-0530
    target: "జంప్"
    native: "slipping away"
    reading: "jamp"
    pos: "noun"
    notes: "వాడు జంప్ అయ్యాడు, he gave us the slip."
  - id: te-0531
    target: "తొక్కలో"
    native: "rubbish; worthless"
    reading: "tokkaloo"
    pos: "noun"
    notes: "తొక్కలో సినిమా, a rubbish film. Rude: not for strangers."
  - id: te-0532
    target: "తాగడం"
    native: "to drink alcohol (said on its own)"
    reading: "taagadam"
    pos: "verb"
    notes: "With a drink named, తాగడం is any drink: టీ తాగడం. On its own it means alcohol: అతను తాగుతాడు, he drinks."
  - ref: te-0367
    native: "booze (slang); medicine"
    notes: "Literally 'medicine'. Among friends it means alcohol: మందు కొట్టడం, to drink."
  - id: te-0533
    target: "సిగరెట్ తాగడం"
    native: "to smoke a cigarette"
    reading: "sigaret taagadam"
    pos: "phrase"
    notes: "Literally 'to drink a cigarette'. Smoking is ధూమపానం (dhuumapaanam) on signs."
