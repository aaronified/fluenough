id: te-en-slang
name: "Slang"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Everyday slang: what friends say that a textbook doesn't. Not yet checked by a Telugu speaker: please report any mistake."
tags: [slang, unreviewed]
cards:
  - id: te-0521
    target: "మామా"
    native: "mate; dude"
    reading: "māmā"
    ipa: "maːmaː"
    pos: "noun"
    notes: "Literally 'uncle' (a mother's brother), but between friends any man: ఏంటి మామా (ēṇṭi māmā)? Also బావా (bāvā), literally 'brother-in-law'."
  - id: te-0522
    target: "ఏంటి సంగతి?"
    native: "What's up?"
    reading: "ēṇṭi saṅgati?"
    ipa: "eːɳʈi saŋɡat̪i"
    pos: "phrase"
    bases:
      - { word: "సంగతి", base: "సంగతి", reading: "saṅgati", meaning: "matter; news" }
  - id: te-0523
    target: "సూపర్"
    native: "great"
    reading: "sūpar"
    ipa: "suːpar"
    pos: "adj"
    notes: "సూపర్ సినిమా (sūpar sinimā), a great film."
  - id: te-0524
    target: "అదిరింది"
    native: "it's brilliant"
    reading: "adirindi"
    ipa: "ad̪irind̪i"
    pos: "noun"
    notes: "Literally 'it shook': సినిమా అదిరింది (sinimā adirindi), the film was brilliant."
  - id: te-0525
    target: "కేక"
    native: "fantastic"
    reading: "kēka"
    ipa: "keːka"
    pos: "noun"
    notes: "Literally 'a shout': కేక సినిమా (kēka sinimā), a fantastic film."
  - id: te-0526
    target: "బోర్ కొడుతోంది"
    native: "I'm bored"
    reading: "bōr koḍutōndi"
    ipa: "boːr koɖut̪oːnd̪i"
    pos: "phrase"
    notes: "Literally 'boredom is hitting': నాకు బోర్ కొడుతోంది (nāku bōr koḍutōndi)."
    bases:
      - { word: "బోర్", base: "బోర్", reading: "bōr", meaning: "boredom" }
      - { word: "కొడుతోంది", base: "కొట్టడం", reading: "koṭṭaḍam", meaning: "to hit; to strike" }
  - id: te-0527
    target: "టెన్షన్ పడకు"
    native: "don't stress"
    reading: "ṭenṣan paḍaku"
    ipa: "ʈenʂan paɖaku"
    pos: "phrase"
    notes: "To a friend; with respect, టెన్షన్ పడకండి (ṭenṣan paḍakaṇḍi)."
    bases:
      - { word: "టెన్షన్", base: "టెన్షన్", reading: "ṭenṣan", meaning: "tension; stress" }
      - { word: "పడకు", base: "పడడం", reading: "paḍaḍam", meaning: "to fall; to suffer" }
  - id: te-0528
    target: "బిల్డప్"
    native: "showing off"
    reading: "bilḍap"
    ipa: "bilɖap"
    pos: "noun"
    notes: "బిల్డప్ ఇవ్వకు (bilḍap ivvaku), stop showing off."
  - id: te-0529
    target: "ఫుల్లు"
    native: "totally"
    reading: "fullu"
    ipa: "fullu"
    pos: "noun"
    notes: "From English full: ఫుల్లు హ్యాపీ (fullu hyāpī), totally happy."
  - id: te-0530
    target: "జంప్"
    native: "slipping away"
    reading: "jamp"
    ipa: "dʒamp"
    pos: "noun"
    notes: "వాడు జంప్ అయ్యాడు (vāḍu jamp ayyāḍu), he gave us the slip."
  - id: te-0531
    target: "తొక్కలో"
    native: "rubbish; worthless"
    reading: "tokkalō"
    ipa: "t̪okkaloː"
    pos: "noun"
    notes: "తొక్కలో సినిమా (tokkalō sinimā), a rubbish film. Rude: not for strangers."
  - id: te-0532
    target: "తాగడం"
    native: "to drink alcohol (said on its own)"
    reading: "tāgaḍam"
    ipa: "t̪aːɡaɖam"
    pos: "verb"
    notes: "With a drink named, తాగడం (tāgaḍam) is any drink: టీ తాగడం (ṭī tāgaḍam). On its own it means alcohol: అతను తాగుతాడు (atanu tāgutāḍu), he drinks."
  - ref: te-0367
    native: "booze (slang); medicine"
    notes: "Literally 'medicine'. Among friends it means alcohol: మందు కొట్టడం (mandu koṭṭaḍam), to drink."
  - id: te-0533
    target: "సిగరెట్ తాగడం"
    native: "to smoke a cigarette"
    reading: "sigareṭ tāgaḍam"
    ipa: "siɡareʈ t̪aːɡaɖam"
    pos: "phrase"
    notes: "Literally 'to drink a cigarette'. Smoking is ధూమపానం (dhūmapānam) on signs."
    bases:
      - { word: "సిగరెట్", base: "సిగరెట్", reading: "sigareṭ", meaning: "cigarette" }
