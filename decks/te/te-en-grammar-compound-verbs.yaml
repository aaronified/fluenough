schema: 1
id: te-en-grammar-compound-verbs
name: "Verbs that add a shade"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "A second verb after the first adds a shade: done for good, done for oneself, done for someone. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: te-0512
    target: "వెళ్ళిపోయాడు."
    native: "He went away; he's gone."
    reading: "veḷḷipōyāḍu."
    ipa: "ʋeɭɭipoːjaːɖu"
    pos: "noun"
    notes: "పోవు, go, after a verb: the action is done and gone. వెళ్ళాడు, he went; వెళ్ళిపోయాడు, he left."
  - id: te-0513
    target: "మర్చిపోయాను."
    native: "I forgot."
    reading: "marcipōyānu."
    ipa: "martʃipoːjaːnu"
    pos: "noun"
  - id: te-0514
    target: "పడిపోయాడు."
    native: "He fell down."
    reading: "paḍipōyāḍu."
    ipa: "paɖipoːjaːɖu"
    pos: "noun"
  - id: te-0515
    target: "తినేశాను."
    native: "I've eaten it all up."
    reading: "tinēśānu."
    ipa: "t̪ineːʃaːnu"
    pos: "noun"
    notes: "వేయు, throw, after a verb: done completely, and at once."
  - id: te-0516
    target: "చెప్పేశాను."
    native: "I've gone and told them."
    reading: "ceppēśānu."
    ipa: "tʃeppeːʃaːnu"
    pos: "noun"
  - id: te-0517
    target: "కొనుక్కున్నాను."
    native: "I bought it for myself."
    reading: "konukkunnānu."
    ipa: "konukkunnaːnu"
    pos: "noun"
    notes: "-కొను after a verb: for oneself. కొన్నాను, I bought; కొనుక్కున్నాను, I bought it for myself."
  - id: te-0518
    target: "చేసుకున్నాను."
    native: "I did it for myself."
    reading: "cēsukunnānu."
    ipa: "tʃeːsukunnaːnu"
    pos: "noun"
  - id: te-0519
    target: "చూసుకోండి."
    native: "Please take care of it; have a look."
    reading: "cūsukōṇḍi."
    ipa: "tʃuːsukoːɳɖi"
    pos: "noun"
  - id: te-0520
    target: "తెచ్చిపెట్టండి."
    native: "Please fetch it (for me)."
    reading: "teccipeṭṭaṇḍi."
    ipa: "t̪etʃtʃipeʈʈaɳɖi"
    pos: "noun"
    notes: "పెట్టు, put, after a verb: done for someone."
