  - id: "te-0383"
    target: "కొడుకు"
    reading: "koḍuku"
    ipa: "koɖuku"
    pos: "noun"
    "examples": [
      {"target": "నా కొడుకు జనన ధ్రువీకరణ పత్రం పోయింది.", "reading": "nā koḍuku janana dhruvīkaraṇa patraṁ pōyindi.", "ipa": "naː koɖuku dʒanana d̪ʱruʋiːkarana pat̪ram poːjind̪i", "bases": [{"word": "నా", "base": "నేను", "reading": "nēnu"}, {"word": "పోయింది", "base": "పోవడం", "reading": "pōvaḍaṁ"}, {"word": "జనన", "base": "జననం", "reading": "jananam"}, {"word": "ధ్రువీకరణ", "base": "ధ్రువీకరణ", "reading": "dhruvīkaraṇa"}]},
      {"target": "ఆమె కొడుకు ఇంకా రాలేదని అమ్మ ఆందోళనగా చూస్తోంది.", "reading": "āme koḍuku iṅkā rālēdani amma āndōḷanagā cūstōndi.", "ipa": "aːme koɖuku iŋkaː raːleːd̪ani amma aːnd̪oːɭanaɡaː tʃuːst̪oːnd̪i", "bases": [{"word": "రాలేదని", "base": "రావడం", "reading": "rāvaḍam"}, {"word": "చూస్తోంది", "base": "చూడడం", "reading": "cūḍaḍam"}]}
    ]
