      {"target": "తాత ప్రతి ఆదివారం చదరంగం ఆడతారు.", "reading": "tāta prati ādivāraṁ cadaraṅgaṁ āḍatāru.", "ipa": "t̪aːt̪a prat̪i aːd̪iʋaːram tʃad̪araŋɡam aːɖat̪aːru", "bases": [{"word": "ఆడతారు", "base": "ఆడడం", "reading": "āḍaḍaṁ"}]}
