  - id: "te-0380"
    target: "తల్లిదండ్రులు"
    reading: "tallidaṇḍrulu"
    ipa: "t̪allid̪aɳɖrulu"
    alt_target: ["అమ్మానాన్నలు"]
    pos: "noun"
    notes:
      - { id: "n1", kind: "note" }
    "examples": [
      {"target": "పిల్లల భవిష్యత్తు గురించి తల్లిదండ్రులు ఆలోచిస్తారు.", "reading": "pillala bhaviṣyattu guriñci tallidaṇḍrulu ālōcistāru.", "ipa": "pillala bʱaʋiʂjat̪t̪u ɡuriɲtʃi t̪allid̪aɳɖrulu aːloːtʃist̪aːru.", "bases": [{"word": "పిల్లల", "base": "పిల్ల", "reading": "pilla"}, {"word": "ఆలోచిస్తారు", "base": "ఆలోచించడం", "reading": "ālōciñcaḍam"}, {"word": "గురించి", "base": "గురించి", "reading": "guriñci"}]},
      {"target": "తల్లిదండ్రులు కూతురి విజయం గురించి గర్వంగా చెప్పారు.", "reading": "tallidaṇḍrulu kūturi vijayaṁ guriñci garvaṅgā ceppāru.", "ipa": "t̪allid̪aɳɖrulu kuːt̪uri ʋidʒajam ɡuriɲtʃi ɡarʋaŋɡaː tʃeppaːru", "bases": [{"word": "కూతురి", "base": "కూతురు", "reading": "kūturu"}, {"word": "విజయం", "base": "విజయం", "reading": "vijayaṁ"}, {"word": "గురించి", "base": "గురించి", "reading": "guriñci"}, {"word": "చెప్పారు", "base": "చెప్పడం", "reading": "ceppaḍam"}]}
    ]
  - id: "te-0381"
