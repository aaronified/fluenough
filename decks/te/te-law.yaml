  - id: "te-6003"
    target: "న్యాయవాది"
    reading: "nyāyavādi"
    ipa: "njaːjaʋaːd̪i"
    pos: "noun"
    gender: "mahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "నా న్యాయవాది కేసు గురించి వివరంగా చెప్పారు.", reading: "nā nyāyavādi kēsu gurinci vivaraṅgā ceppāru.", ipa: "naː njaːjaʋaːd̪i keːsu gurint͡ʃi ʋiʋaraŋɡaː tʃeppaːru", bases: [{ word: "వివరంగా", base: "వివరం", reading: "vivaraṁ" }, { word: "చెప్పారు", base: "చెప్పడం", reading: "ceppaḍaṁ" }] }
      - { target: "మంచి న్యాయవాదిని పెట్టుకోవాలి.", reading: "manci nyāyavādini peṭṭukōvāli.", ipa: "mant͡ʃi njaːjaʋaːd̪ini peʈʈukoːʋaːli", bases: [{ word: "న్యాయవాదిని", base: "న్యాయవాది", reading: "nyāyavādi" }, { word: "పెట్టుకోవాలి", base: "పెట్టుకోవడం", reading: "peṭṭukōvaḍaṁ" }] }
  - ref: "te-4025"
  - id: "te-6005"
    target: "నేరం"
    reading: "nēraṁ"
    ipa: "neːram"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "ఇది చిన్న నేరం కాదు.", reading: "idi cinna nēraṁ kādu.", ipa: "id̪i t͡ʃinna neːram kaːd̪u" }
      - { target: "అతడు నేరం ఒప్పుకోలేదు.", reading: "ataḍu nēraṁ oppukōlēdu.", ipa: "at̪aɖu neːram opːukoːleːd̪u", bases: [{ word: "ఒప్పుకోలేదు", base: "ఒప్పుకోవడం", reading: "oppukōvaḍaṁ" }] }
  - id: "te-6006"
    target: "శిక్ష"
    reading: "śikṣa"
    ipa: "ʃikʂa"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "ఈ నేరానికి కఠిన శిక్ష ఉంటుంది.", reading: "ī nērāniki kaṭhina śikṣa uṇṭundi.", ipa: "iː neːraːniki kaʈʰina ʃikʂa uɳʈund̪i", bases: [{ word: "నేరానికి", base: "నేరం", reading: "nēraṁ" }, { word: "ఉంటుంది", base: "ఉండడం", reading: "uṇḍaḍaṁ" }] }
      - { target: "అతడు శిక్షను తప్పించుకున్నాడు.", reading: "ataḍu śikṣanu tappiñcukunnāḍu.", ipa: "at̪aɖu ʃikʂanu t̪appint͡ʃukun̪n̪aːɖu", bases: [{ word: "శిక్షను", base: "శిక్ష", reading: "śikṣa" }, { word: "తప్పించుకున్నాడు", base: "తప్పించుకోవడం", reading: "tappiñcukōvaḍaṁ" }] }
    senses:
      - { id: "punishment", pos: "noun", source: "https://en.wiktionary.org/wiki/శిక్ష" }
  - id: "te-6007"
    target: "జైలు"
    reading: "jailu"
    ipa: "d͡ʒailu"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "అతడు మూడు సంవత్సరాలు జైలులో ఉన్నాడు.", reading: "ataḍu mūḍu saṁvatsarālu jailulō unnāḍu.", ipa: "at̪aɖu muːɖu samʋat̪saraːlu d͡ʒailuloː unnaːɖu", bases: [{ word: "సంవత్సరాలు", base: "సంవత్సరం", reading: "saṁvatsaraṁ" }, { word: "జైలులో", base: "జైలు", reading: "jailu" }, { word: "ఉన్నాడు", base: "ఉండడం", reading: "uṇḍaḍaṁ" }] }
      - { target: "జైలు నుంచి విడుదల అయ్యాడు.", reading: "jailu nuñci viḍudala ayyāḍu.", ipa: "d͡ʒailu nuɲt͡ʃi ʋiɖud̪alaː ajːaːɖu", bases: [{ word: "అయ్యాడు", base: "అవ్వడం", reading: "avvaḍaṁ" }] }
  - id: "te-6008"
    target: "బెయిల్"
    reading: "beyil"
    ipa: "bejil"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "కోర్టు బెయిల్ మంజూరు చేసింది.", reading: "kōrṭu beyil mañjūru cēsindi.", ipa: "koːrʈu bejil mand͡ʒuːru tʃeːsind̪i", bases: [{ word: "చేసింది", base: "చేయడం", reading: "cēyaḍaṁ" }] }
      - { target: "బెయిల్ కోసం డబ్బు కట్టాలి.", reading: "beyil kōsaṁ ḍabbu kaṭṭāli.", ipa: "bejil koːsam d̪abːu kaʈʈaːli", bases: [{ word: "కట్టాలి", base: "కట్టడం", reading: "kaṭṭaḍaṁ" }] }
  - id: "te-6009"
    target: "సాక్షి"
    reading: "sākṣi"
    ipa: "saːkʂi"
    pos: "noun"
    gender: "mahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "సాక్షి కోర్టులో నిజం చెప్పాలి.", reading: "sākṣi kōrṭulō nijaṁ ceppāli.", ipa: "saːkʂi koːrʈuloː nid͡ʒam t͡ʃeppaːli", bases: [{ word: "కోర్టులో", base: "కోర్టు", reading: "kōrṭu" }, { word: "చెప్పాలి", base: "చెప్పడం", reading: "ceppaḍaṁ" }] }
      - { target: "ఆ సంఘటనకు ఇద్దరు సాక్షులు ఉన్నారు.", reading: "ā saṅghaṭanaku iddaru sākṣulu unnāru.", ipa: "aː sanɡʱaʈanaku iddaru saːkʂulu unnaːru", bases: [{ word: "సాక్షులు", base: "సాక్షి", reading: "sākṣi" }, { word: "ఉన్నారు", base: "ఉండడం", reading: "uṇḍaḍaṁ" }] }
  - id: "te-6010"
    target: "హక్కు"
    reading: "hakku"
    ipa: "hakku"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "ప్రతి పౌరుడికి ఓటు హక్కు ఉంటుంది.", reading: "prati pauruḍiki ōṭu hakku uṇṭundi.", ipa: "prat̪i pauruɖiki oːʈu hakku uɳʈund̪i", bases: [{ word: "పౌరుడికి", base: "పౌరుడు", reading: "pauruḍu" }, { word: "ఉంటుంది", base: "ఉండడం", reading: "uṇḍaḍaṁ" }] }
      - { target: "మీకు మాట్లాడే హక్కు ఉంది.", reading: "mīku māṭlāḍē hakku undi.", ipa: "miːku maːʈlaːɖeː hakku und̪i", bases: [{ word: "మాట్లాడే", base: "మాట్లాడడం", reading: "māṭlāḍaḍaṁ" }, { word: "ఉంది", base: "ఉండడం", reading: "uṇḍaḍaṁ" }] }
  - id: "te-6011"
    target: "కేసు"
    reading: "kēsu"
    ipa: "keːsu"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "ఆ కేసు ఆరు నెలలుగా నడుస్తోంది.", reading: "ā kēsu āru nelalugā naḍustōndi.", ipa: "aː keːsu aːru nelaluɡaː naɖust̪oːnd̪i", bases: [{ word: "నెలలుగా", base: "నెల", reading: "nela" }, { word: "నడుస్తోంది", base: "నడవడం", reading: "naḍavaḍaṁ" }] }
      - { target: "పోలీసులు కొత్త కేసు నమోదు చేశారు.", reading: "pōlīsulu kotta kēsu namōdu cēśāru.", ipa: "poːliːsulu kot̪t̪a keːsu namoːd̪u tʃeːʃaːru", bases: [{ word: "పోలీసులు", base: "పోలీసు", reading: "pōlīsu" }, { word: "చేశారు", base: "చేయడం", reading: "cēyaḍaṁ" }] }
  - id: "te-6012"
    target: "తీర్పు"
    reading: "tīrpu"
    ipa: "t̪iːrpu"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "తీర్పు వినడానికి అందరూ వచ్చారు.", reading: "tīrpu vinaḍāniki andarū vaccāru.", ipa: "t̪iːrpu ʋinaɖaːniki and̪aruː ʋatʃtʃaːru", bases: [{ word: "వినడానికి", base: "వినడం", reading: "vinaḍaṁ" }, { word: "వచ్చారు", base: "రావడం", reading: "rāvaḍaṁ" }] }
      - { target: "కోర్టు తీర్పు అందరికీ నచ్చలేదు.", reading: "kōrṭu tīrpu andarikī nacchalēdu.", ipa: "koːrʈu t̪iːrpu and̪arikiː natʃtʃaleːd̪u", bases: [{ word: "నచ్చలేదు", base: "నచ్చడం", reading: "naccaḍaṁ" }] }
  - id: "te-6013"
    target: "నేరస్థుడు"
    reading: "nērasthuḍu"
    ipa: "neːrast̪ʰuɖu"
    pos: "noun"
    gender: "mahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "పోలీసులు నేరస్థుడిని పట్టుకున్నారు.", reading: "pōlīsulu nērasthuḍini paṭṭukunnāru.", ipa: "poːliːsulu neːrast̪ʰuɖini paʈʈukun̪n̪aːru", bases: [{ word: "పోలీసులు", base: "పోలీసు", reading: "pōlīsu" }, { word: "నేరస్థుడిని", base: "నేరస్థుడు", reading: "nērasthuḍu" }, { word: "పట్టుకున్నారు", base: "పట్టుకోవడం", reading: "paṭṭukōvaḍaṁ" }] }
      - { target: "అతడు పెద్ద నేరస్థుడు కాదు.", reading: "ataḍu pedda nērasthuḍu kādu.", ipa: "at̪aɖu peddə neːrast̪ʰuɖu kaːd̪u" }
  - id: "te-6014"
    target: "బాధితుడు"
    reading: "bādhituḍu"
    ipa: "baːd̪ʱit̪uɖu"
    pos: "noun"
    gender: "mahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "బాధితుడు పోలీస్ స్టేషన్‌కు వెళ్ళాడు.", reading: "bādhituḍu pōlīs sṭēṣanku veḷlāḍu.", ipa: "baːd̪ʱit̪uɖu poːliːs sʈeːʂanku ʋeɭlaːɖu", bases: [{ word: "వెళ్ళాడు", base: "వెళ్ళడం", reading: "veḷḷaḍaṁ" }] }
      - { target: "బాధితుడికి న్యాయం జరగాలి.", reading: "bādhituḍiki nyāyaṁ jaragāli.", ipa: "baːd̪ʱit̪uɖiki njaːjam d͡ʒarɡaːli", bases: [{ word: "బాధితుడికి", base: "బాధితుడు", reading: "bādhituḍu" }, { word: "జరగాలి", base: "జరగడం", reading: "jaragaḍaṁ" }] }
  - id: "te-6015"
    target: "సాక్ష్యం"
    reading: "sākṣyaṁ"
    ipa: "saːkʂjam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "మా దగ్గర బలమైన సాక్ష్యం ఉంది.", reading: "mā daggara balamaina sākṣyaṁ undi.", ipa: "maː d̪aggaɾa balamaina saːkʂjam und̪i", bases: [{ word: "ఉంది", base: "ఉండడం", reading: "uṇḍaḍaṁ" }] }
      - { target: "ఈ సాక్ష్యం సరిపోదు.", reading: "ī sākṣyaṁ saripōdu.", ipa: "iː saːkʂjam saripoːd̪u", bases: [{ word: "సరిపోదు", base: "సరిపోవడం", reading: "saripōvaḍaṁ" }] }
  - id: "te-6016"
    target: "దావా"
    reading: "dāvā"
    ipa: "d̪aːʋaː"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "ఆయన యజమానిపై దావా వేశారు.", reading: "āyana yajamānipai dāvā vēśāru.", ipa: "aːjan̪a jad͡ʒamaːnipai d̪aːʋaː ʋeːʃaːru", bases: [{ word: "యజమానిపై", base: "యజమాని", reading: "yajamāni" }, { word: "వేశారు", base: "వేయడం", reading: "vēyaḍaṁ" }] }
      - { target: "దావా ఖర్చు చాలా ఎక్కువ.", reading: "dāvā kharcu cālā ekkuva.", ipa: "d̪aːʋaː kʰart͡ʃu t͡ʃaːlaː ekːuʋa" }
    senses:
      - { id: "lawsuit", pos: "noun", source: "https://en.wiktionary.org/wiki/దావా" }
      - { id: "claim", pos: "noun", source: "https://en.wiktionary.org/wiki/దావా" }
  - id: "te-6017"
    target: "జరిమానా"
    reading: "jarimānā"
    ipa: "d͡ʒarimaːnaː"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "ట్రాఫిక్ నియమాలు ఉల్లంఘిస్తే జరిమానా ఉంటుంది.", reading: "ṭrāphik niyamālu ullaṅghistē jarimānā uṇṭundi.", ipa: "ʈraːpʰik nijamaːlu ullaŋɡʱisteː d͡ʒarimaːnaː uɳʈund̪i", bases: [{ word: "నియమాలు", base: "నియమం", reading: "niyamaṁ" }, { word: "ఉల్లంఘిస్తే", base: "ఉల్లంఘించడం", reading: "ullaṅghiñcaḍaṁ" }, { word: "ఉంటుంది", base: "ఉండడం", reading: "uṇḍaḍaṁ" }] }
      - { target: "అతడు వెయ్యి రూపాయలు జరిమానా కట్టాడు.", reading: "ataḍu veyyi rūpāyalu jarimānā kaṭṭāḍu.", ipa: "at̪aɖu ʋejːi ruːpaːjalu d͡ʒarimaːnaː kaʈʈaːɖu", bases: [{ word: "రూపాయలు", base: "రూపాయి", reading: "rūpāyi" }, { word: "కట్టాడు", base: "కట్టడం", reading: "kaṭṭaḍaṁ" }] }
    senses:
      - { id: "fine", pos: "noun", source: "https://en.wiktionary.org/wiki/జరిమానా" }
      - { id: "penalty", pos: "noun", source: "https://en.wiktionary.org/wiki/జరిమానా" }
  - id: "te-6018"
    target: "అరెస్టు"
    reading: "aresṭu"
    ipa: "aɾesʈu"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "పోలీసులు అతడిని అరెస్టు చేశారు.", reading: "pōlīsulu ataḍini aresṭu cēśāru.", ipa: "poːliːsulu at̪aɖini aɾesʈu tʃeːʃaːru", bases: [{ word: "పోలీసులు", base: "పోలీసు", reading: "pōlīsu" }, { word: "అతడిని", base: "అతడు", reading: "ataḍu" }, { word: "చేశారు", base: "చేయడం", reading: "cēyaḍaṁ" }] }
      - { target: "అరెస్టు వారెంట్ ఇంటికి వచ్చింది.", reading: "aresṭu vārenṭ iṇṭiki vaccindi.", ipa: "aɾesʈu ʋaːɾent iɳʈiki ʋatʃtʃind̪i", bases: [{ word: "ఇంటికి", base: "ఇల్లు", reading: "illu" }, { word: "వచ్చింది", base: "రావడం", reading: "rāvaḍaṁ" }] }
  - id: "te-6019"
    target: "ఉల్లంఘన"
    reading: "ullaṅghana"
    ipa: "ullaŋɡʱana"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "ఇది చట్టం ఉల్లంఘన.", reading: "idi caṭṭaṁ ullaṅghana.", ipa: "id̪i t͡ʃaʈʈam ullaŋɡʱana" }
      - { target: "మీ హక్కుల ఉల్లంఘన జరిగింది.", reading: "mī hakkula ullaṅghana jarigindi.", ipa: "miː hakːula ullaŋɡʱana d͡ʒarigind̪i", bases: [{ word: "హక్కుల", base: "హక్కు", reading: "hakku" }, { word: "జరిగింది", base: "జరగడం", reading: "jaragaḍaṁ" }] }
  - id: "te-6020"
