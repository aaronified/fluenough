# How Telugu readings are written, and the spellings a learner may type for
# the same sound (#47). See "Romanisation" in docs/DECK-FORMAT.md.
schema: 1
kind: romanisation
id: te-romanisation
language: te
scheme: "Popular, as Telugu is texted: lowercase ASCII, no length marks (miru, nenu, emi), spelled as said; t and d for retroflex and dental alike, n for ణ and ఞ, l for ళ, sh for శ and ష, ch for చ and cch for చ్చ, j for జ, r for ఱ, ru for ఋ, aspirates with h, the sunna ం as m or n as said, and a final u kept (unnaru)."
equivalents:
  - ["a", "aa"]
  - ["i", "ee", "ii"]
  - ["u", "oo", "uu"]
  - ["e", "ae"]
  - ["v", "w"]
  - ["sh", "s"]
  - ["t", "th"]
  - ["d", "dh"]
  - ["cch", "chch"]
