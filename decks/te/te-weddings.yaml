    reading: "vivāham"
    ipa: "ʋiʋaːham"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - target: "వివాహం రెండు కుటుంబాలను కలుపుతుంది."
        reading: "vivāham reṇḍu kuṭumbālanu kaluputundi."
        ipa: "ʋiʋaːham reɳɖu kuʈumbaːlanu kaluput̪und̪i"
        bases:
          - { word: "కుటుంబాలను", base: "కుటుంబం", reading: "kuṭumbam" }
          - { word: "కలుపుతుంది", base: "కలపడం", reading: "kalapaḍam" }
      - target: "వివాహానికి ముందు మేము పూజ చేస్తాము."
        reading: "vivāhāniki mundu mēmu pūja cēstāmu."
        ipa: "ʋiʋaːhaːniki mund̪u meːmu puːdʒa tʃeːst̪aːmu"
