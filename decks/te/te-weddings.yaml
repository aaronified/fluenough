cards:
  - id: "te-5200"
    target: "పెళ్లి"
    reading: "peḷli"
    ipa: "peɭli"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - target: "పెళ్లి చాలా బాగా జరిగింది."
        reading: "peḷli cālā bāgā jarigindi."
        ipa: "peɭli tʃaːlaː baːɡaː dʒariɡind̪i"
        bases:
          - { word: "జరిగింది", base: "జరగడం", reading: "jaragaḍam" }
      - target: "పెళ్లికి అందరూ వచ్చారు."
        reading: "peḷliki andarū vaccāru."
        ipa: "peɭliki and̪aruː ʋatʃtʃaːru"
        bases:
          - { word: "పెళ్లికి", base: "పెళ్లి", reading: "peḷli" }
          - { word: "వచ్చారు", base: "రావడం", reading: "rāvaḍam" }
