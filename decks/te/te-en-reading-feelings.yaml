  "sentences":
      - "text": "నాకు ఇప్పుడు ఆందోళనగా ఉంది."
        "reading": "nāku ippuḍu āndōḷanagā undi."
        "ipa": "naːku ippuɖu aːnd̪oːɭanaɡaː und̪i"
      - "text": "కానీ నాకు ఆశ ఉంది."
        "reading": "kānī nāku āśa undi."
        "ipa": "kaːniː naːku aːʃa und̪i"
      - "text": "నీ సహాయానికి కృతజ్ఞతలు."
        "reading": "nī sahāyāniki krutajñatalu."
        "ipa": "niː sahaːjaːniki krut̪adʒɲat̪alu"
      - "text": "నాకు నీ మీద నమ్మకం ఉంది."
        "reading": "nāku nī mīda nammakaṁ undi."
        "ipa": "naːku niː miːd̪a nammakam und̪i"
