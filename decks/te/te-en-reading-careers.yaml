  "sentences":
  - "text": "కొత్త ఉద్యోగుల నియామకం ఈ నెలలో జరుగుతుంది."
    "reading": "kotta udyōgula niyāmakaṁ ī nelalō jarugutundi."
    "ipa": "kot̪t̪a ud̪joːɡula nijaːmakam iː nelaloː dʒaruɡut̪und̪i"
  - "text": "ఈ ఉద్యోగానికి డిగ్రీ విద్యార్హత అవసరం."
    "reading": "ī udyōgāniki ḍigrī vidyārhata avasaraṁ."
    "ipa": "iː ud̪joːɡaːniki ɖiɡriː ʋid̪jaːrhat̪a aʋasaram"
  - "text": "కొత్త ఉద్యోగులకు మూడు రోజుల శిక్షణ ఉంటుంది."
    "reading": "kotta udyōgulaku mūḍu rōjula śikṣaṇa uṇṭundi."
    "ipa": "kot̪t̪a ud̪joːɡulaku muːɖu roːdʒula ʃikʂaɳa uɳʈund̪i"
  - "text": "అనుభవం ఉంటే ఉద్యోగం వస్తుంది."
    "reading": "anubhavaṁ uṇṭē udyōgaṁ vastundi."
    "ipa": "anubʱaʋam uɳʈeː ud̪joːɡam ʋast̪und̪i"
