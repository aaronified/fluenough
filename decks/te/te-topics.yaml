# Topics a learner of Telugu would search for: what each one is, and the decks that teach it (wiki/Plan-Deck-Kinds-And-Topics.md, D6).
# A script topic lists its characters; a topic holds no card text of its own.
schema: 1
kind: "topics"
id: "te-topics"
language: "te"
license: "CC-BY-SA-4.0"
topics:
  - id: "te-vowels-script"
    name: { en: "Telugu vowels" }
    summary: { en: "The Telugu vowel letters, written on their own, from the short a to the long vowels and the diphthongs ai and au." }
    kind: "script"
    level: "A1"
    decks: ["te-script-vowels"]
    chars: ["అ", "ఆ", "ఇ", "ఈ", "ఉ", "ఊ", "ఋ", "ఎ", "ఏ", "ఐ", "ఒ", "ఓ", "ఔ"]
  - id: "te-consonants-script"
    name: { en: "Telugu consonants" }
    summary: { en: "The Telugu consonant letters, each written with the a vowel built in, in their groups from ka to ha, including the retroflex and sibilant letters." }
    kind: "script"
    level: "A1"
    decks: ["te-script-consonants"]
    chars: ["క", "ఖ", "గ", "ఘ", "ఙ", "చ", "ఛ", "జ", "ఝ", "ఞ", "ట", "ఠ", "డ", "ఢ", "ణ", "త", "థ", "ద", "ధ", "న", "ప", "ఫ", "బ", "భ", "మ", "య", "ర", "ల", "వ", "శ", "ష", "స", "హ", "ళ"]
  - id: "te-vowel-signs-script"
    name: { en: "Telugu vowel signs" }
    summary: { en: "The vowel signs, the marks written around a consonant to change its vowel, such as the sign for a long a in kā, and the bare consonant that has no vowel." }
    kind: "script"
    level: "A1"
    decks: ["te-script-vowel-signs"]
    chars: ["కా", "కి", "కీ", "కు", "కూ", "కృ", "కె", "కే", "కై", "కొ", "కో", "కౌ", "కం", "క్", "మా", "మి", "మీ", "ము", "మూ", "మె", "మే", "మొ", "మో"]
  - id: "te-conjuncts-script"
    name: { en: "Conjunct consonants (ottulu)" }
    summary: { en: "Two consonants written together as one shape, called ottulu, such as the doubled k in kka and clusters such as kra and sta." }
    kind: "script"
    level: "A1"
    decks: ["te-script-conjuncts"]
    chars: ["క్క", "గ్గ", "చ్చ", "ట్ట", "డ్డ", "త్త", "ద్ద", "న్న", "ప్ప", "మ్మ", "ల్ల", "ళ్ళ", "య్య", "వ్వ", "క్ర", "ప్ర", "త్ర", "శ్ర", "వ్య", "ద్య", "క్ష", "స్త", "స్థ", "ష్ట"]
  - id: "te-digits-script"
    name: { en: "Telugu digits" }
    summary: { en: "The ten Telugu digits, 0 to 9, with the spoken number word for each, such as okaṭi for one." }
    kind: "script"
    level: "A1"
    decks: ["te-script-digits"]
    chars: ["౦", "౧", "౨", "౩", "౪", "౫", "౬", "౭", "౮", "౯"]
  - id: "te-kinship"
    name: { en: "Kinship terms" }
    summary: { en: "The Telugu words for family members, such as parents and siblings, as the family deck teaches them." }
    kind: "words"
    level: "A1"
    decks: ["te-family"]
  - id: "te-food-dishes"
    name: { en: "Food and dishes" }
    summary: { en: "Common Telugu words for food and the names of dishes, with short sentences about food." }
    kind: "words"
    level: "A1"
    decks: ["te-food", "te-food-sentences", "te-dishes"]
  - id: "te-numbers-counting"
    name: { en: "Numbers and counting" }
    summary: { en: "Counting from one to twenty and on to bigger numbers, with short sentences that use them." }
    kind: "words"
    level: "A1"
    decks: ["te-numbers-1-20", "te-numbers-big", "te-numbers-big-sentences"]
  - id: "te-conjunct-verbs"
    name: { en: "Conjunct verbs" }
    summary: { en: "Verb phrases made from a noun and a light verb such as do, become, fall, hit or give, which together act as one verb." }
    kind: "verbs"
    level: "A1"
    decks: ["te-multiword-conjunct-verbs", "te-grammar-conjunct-verbs"]
  - id: "te-aspectual-compounds"
    name: { en: "Compound verbs" }
    summary: { en: "Two verbs joined into one, where the second verb is an auxiliary that adds completion, departure or preparation to the action." }
    kind: "verbs"
    level: "A2"
    decks: ["te-multiword-compound-verbs", "te-grammar-compound-verbs"]
  - id: "te-proverbs"
    name: { en: "Proverbs (samethalu)" }
    summary: { en: "Short sayings from a printed 1868 collection of Telugu proverbs, each with its literal meaning and what it is taken to mean." }
    kind: "other"
    level: "A2"
    decks: ["te-proverbs-1", "te-proverbs-2", "te-proverbs-3"]
  - id: "te-dative-subject"
    name: { en: "Verbs with a dative subject" }
    summary: { en: "Phrases where the person who likes, needs, knows or feels something is put in the dative case, as in 'to me' sentences, rather than as the subject." }
    kind: "verbs"
    level: "A1"
    decks: ["te-multiword-dative-subject"]
  - id: "te-classical-poetry"
    name: { en: "Classical verse" }
    summary: { en: "Four short passages of classical Telugu verse by Bammera Pothana and Errapragada, each with an English rendering." }
    kind: "other"
    level: "A2"
    decks: ["te-culture-1"]
    cards: ["te-8750", "te-8751", "te-8752", "te-8753"]
  - id: "te-devotional-songs"
    name: { en: "Devotional songs and verse" }
    summary: { en: "Opening lines of devotional songs and verse by Annamacharya, Tyagaraja, Bhadrachala Ramadasu and Kshetrayya, each with an English rendering." }
    kind: "other"
    level: "A2"
    decks: ["te-culture-2"]
    cards: ["te-8800", "te-8801", "te-8802", "te-8803", "te-8804"]
  - id: "te-modern-prose"
    name: { en: "Modern prose and verse" }
    summary: { en: "Short passages from Telugu poems, a play and a novel by Gurajada Apparao, Basavaraju Apparao and Chilakamarti Lakshmi Narasimham, each with its author and source." }
    kind: "other"
    level: "A2"
    decks: ["te-culture-3"]
    cards: ["te-8850", "te-8851", "te-8852", "te-8853"]
  - id: "te-vemana-verses"
    name: { en: "Vemana's verses" }
    summary: { en: "Five short verses of moral teaching attributed to Yogi Vemana, each with a literal English rendering. The attribution is traditional." }
    kind: "other"
    level: "B1"
    decks: ["te-culture-4"]
    cards: ["te-8900", "te-8901", "te-8902", "te-8903", "te-8904"]
