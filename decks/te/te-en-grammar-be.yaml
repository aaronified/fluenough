schema: 1
id: te-en-grammar-be
name: "To be: ఉండు (uṇḍu) and కాదు (kādu)"
kind: grammar
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Is, was, isn't, will be: ఉండు (uṇḍu) for where and how things are, no verb at all for what someone is, and కాదు (kādu) for what someone is not. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "ఉండు (uṇḍu) by tense"
  slot_name: "person"
  slots: ["నేను", "మేము", "నువ్వు", "మీరు", "అతను", "ఆమె / అది", "వాళ్ళు"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "ఉండు (uṇḍu) says where or how someone is: నేను ఇంట్లో ఉన్నాను (nēnu iṇṭlō unnānu), I'm at home. To say what someone is, Telugu needs no verb: ఆయన డాక్టర్ (āyana ḍākṭar), he's a doctor. With నేను (nēnu), మేము (mēmu) and నువ్వు (nuvvu) the noun takes an ending instead: నేను విద్యార్థిని (nēnu vidyārthini), మేము విద్యార్థులం (mēmu vidyārthulam), నువ్వు విద్యార్థివి (nuvvu vidyārthivi). ఉన్నాను (unnānu) is also the past: నిన్న నేను ఇంట్లో ఉన్నాను (ninna nēnu iṇṭlō unnānu), I was at home yesterday. 'Is not somewhere' is a verb of its own, లేను (lēnu), లేదు (lēdu) …: నేను ఇంట్లో లేను (nēnu iṇṭlō lēnu), I'm not at home. 'Is not something' is కాను (kānu), కాదు (kādu) …: ఇది నీళ్ళు కాదు (idi nīḷḷu kādu), this isn't water. The verb agrees with the doer's person and number. In the third person a man has a form of his own; a woman takes the same form as a thing. మీరు (mīru), plural or respectful, takes the plural."
  entries:
    - lemma: "ఉండు (uṇḍu), now or then"
      key: unnaanu
      reading: "uṇḍu, now or then"
      ipa: "uɳɖu"
      gloss: "to be (somewhere), now or then"
      forms:
        "నేను": "ఉన్నాను"
        "మేము": ["ఉన్నాము", "ఉన్నాం"]
        "నువ్వు": "ఉన్నావు"
        "మీరు": "ఉన్నారు"
        "అతను": "ఉన్నాడు"
        "ఆమె / అది": ["ఉంది", "ఉన్నది"]
        "వాళ్ళు": "ఉన్నారు"
      readings:
        "నేను": "unnānu"
        "మేము": ["unnāmu", "unnām"]
        "నువ్వు": "unnāvu"
        "మీరు": "unnāru"
        "అతను": "unnāḍu"
        "ఆమె / అది": ["undi", "unnadi"]
        "వాళ్ళు": "unnāru"
      ipas:
        "నేను": "unnaːnu"
        "మేము": "unnaːmu"
        "నువ్వు": "unnaːʋu"
        "మీరు": "unnaːru"
        "అతను": "unnaːɖu"
        "ఆమె / అది": "und̪i"
        "వాళ్ళు": "unnaːru"
    - lemma: "ఉండు (uṇḍu), not"
      key: leenu
      reading: "uṇḍu, not"
      ipa: "uɳɖu"
      gloss: "not to be (somewhere)"
      forms:
        "నేను": "లేను"
        "మేము": ["లేము", "లేం"]
        "నువ్వు": "లేవు"
        "మీరు": "లేరు"
        "అతను": "లేడు"
        "ఆమె / అది": "లేదు"
        "వాళ్ళు": "లేరు"
      readings:
        "నేను": "lēnu"
        "మేము": ["lēmu", "lēm"]
        "నువ్వు": "lēvu"
        "మీరు": "lēru"
        "అతను": "lēḍu"
        "ఆమె / అది": "lēdu"
        "వాళ్ళు": "lēru"
      ipas:
        "నేను": "leːnu"
        "మేము": "leːmu"
        "నువ్వు": "leːʋu"
        "మీరు": "leːru"
        "అతను": "leːɖu"
        "ఆమె / అది": "leːd̪u"
        "వాళ్ళు": "leːru"
