schema: 1
id: te-en-grammar-past
name: "Past tense"
kind: grammar
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I did, she went: the past, by person, number and gender. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Past"
  slot_name: "person"
  slots: ["నేను", "మేము", "నువ్వు", "మీరు", "అతను", "ఆమె / అది", "వాళ్ళు"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The verb agrees with the doer's person and number. In the third person a man has a form of his own; a woman takes the same form as a thing: ఆమె వచ్చింది, అది వచ్చింది. మీరు, plural or respectful, takes the plural. Everyday speech often drops the last -u: చేశాను becomes చేశా."
  entries:
    - lemma: "చేయడం"
      key: cheeyadam
      reading: "cēyaḍam"
      ipa: "tʃeːjaɖam"
      gloss: "to do"
      forms:
        "నేను": "చేశాను"
        "మేము": "చేశాము"
        "నువ్వు": "చేశావు"
        "మీరు": "చేశారు"
        "అతను": "చేశాడు"
        "ఆమె / అది": "చేసింది"
        "వాళ్ళు": "చేశారు"
      readings:
        "నేను": "cēśānu"
        "మేము": "cēśāmu"
        "నువ్వు": "cēśāvu"
        "మీరు": "cēśāru"
        "అతను": "cēśāḍu"
        "ఆమె / అది": "cēsindi"
        "వాళ్ళు": "cēśāru"
      ipas:
        "నేను": "tʃeːʃaːnu"
        "మేము": "tʃeːʃaːmu"
        "నువ్వు": "tʃeːʃaːʋu"
        "మీరు": "tʃeːʃaːru"
        "అతను": "tʃeːʃaːɖu"
        "ఆమె / అది": "tʃeːsind̪i"
        "వాళ్ళు": "tʃeːʃaːru"
    - lemma: "వెళ్ళడం"
      key: velladam
      reading: "veḷḷaḍam"
      ipa: "ʋeɭɭaɖam"
      gloss: "to go"
      forms:
        "నేను": "వెళ్ళాను"
        "మేము": "వెళ్ళాము"
        "నువ్వు": "వెళ్ళావు"
        "మీరు": "వెళ్ళారు"
        "అతను": "వెళ్ళాడు"
        "ఆమె / అది": "వెళ్ళింది"
        "వాళ్ళు": "వెళ్ళారు"
      readings:
        "నేను": "veḷḷānu"
        "మేము": "veḷḷāmu"
        "నువ్వు": "veḷḷāvu"
        "మీరు": "veḷḷāru"
        "అతను": "veḷḷāḍu"
        "ఆమె / అది": "veḷḷindi"
        "వాళ్ళు": "veḷḷāru"
      ipas:
        "నేను": "ʋeɭɭaːnu"
        "మేము": "ʋeɭɭaːmu"
        "నువ్వు": "ʋeɭɭaːʋu"
        "మీరు": "ʋeɭɭaːru"
        "అతను": "ʋeɭɭaːɖu"
        "ఆమె / అది": "ʋeɭɭind̪i"
        "వాళ్ళు": "ʋeɭɭaːru"
    - lemma: "రావడం"
      key: raavadam
      reading: "rāvaḍam"
      ipa: "raːʋaɖam"
      gloss: "to come"
      forms:
        "నేను": "వచ్చాను"
        "మేము": "వచ్చాము"
        "నువ్వు": "వచ్చావు"
        "మీరు": "వచ్చారు"
        "అతను": "వచ్చాడు"
        "ఆమె / అది": "వచ్చింది"
        "వాళ్ళు": "వచ్చారు"
      readings:
        "నేను": "vaccānu"
        "మేము": "vaccāmu"
        "నువ్వు": "vaccāvu"
        "మీరు": "vaccāru"
        "అతను": "vaccāḍu"
        "ఆమె / అది": "vaccindi"
        "వాళ్ళు": "vaccāru"
      ipas:
        "నేను": "ʋatʃtʃaːnu"
        "మేము": "ʋatʃtʃaːmu"
        "నువ్వు": "ʋatʃtʃaːʋu"
        "మీరు": "ʋatʃtʃaːru"
        "అతను": "ʋatʃtʃaːɖu"
        "ఆమె / అది": "ʋatʃtʃind̪i"
        "వాళ్ళు": "ʋatʃtʃaːru"
