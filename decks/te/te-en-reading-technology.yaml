"passages":
- "id": "te-app-instructions"
  "title": "App instructions"
  "sentences":
  - "text": "ఈ యాప్ ఆఫ్‌లైన్‌లో కూడా పని చేస్తుంది."
    "reading": "ī yāp āphlainlō kūḍā pani cēstundi."
    "ipa": "iː jaːp aːpʰlainloː kuːɖaː pani tʃeːst̪und̪i"
  - "text": "నోటిఫికేషన్ ఆఫ్ చేయండి."
    "reading": "nōṭiphikēṣan āph cēyaṇḍi."
    "ipa": "noːʈipʰikeːʂan aːpʰ tʃeːjaɳɖi"
  - "text": "లాగిన్ అవ్వడానికి ఓటీపీ కావాలి."
    "reading": "lāgin avvaḍāniki ōṭīpī kāvāli."
    "ipa": "laːɡin aʋʋaɖaːniki oːʈiːpiː kaːʋaːli"
  - "text": "ఓటీపీ ఎవరికీ చెప్పకండి."
    "reading": "ōṭīpī evarikī ceppakaṇḍi."
    "ipa": "oːʈiːpiː eʋarikiː tʃeppakaɳɖi"
