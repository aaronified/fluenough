  "sentences":
  - "text": "అప్పుడు నేను వెళ్తూ ఉన్నాను."
    "reading": "appuḍu nēnu veḷtū unnānu."
    "ipa": "appuɖu neːnu ʋeɭt̪uː unnaːnu"
  - "text": "అప్పుడు వీధిలో వాళ్ళు తింటూ ఉన్నారు."
    "reading": "appuḍu vīdhilō vāḷḷu tiṇṭū unnāru."
    "ipa": "appuɖu ʋiːd̪ʱiloː ʋaːɭɭu t̪iɳʈuː unnaːru"
  - "text": "అప్పుడు ఒక బస్సు వస్తూ ఉంది."
    "reading": "appuḍu oka bassu vastū undi."
    "ipa": "appuɖu oka bassu ʋast̪uː und̪i"
  - "text": "అప్పుడు అతను పని చేస్తూ ఉన్నాడు."
    "reading": "appuḍu atanu pani cēstū unnāḍu."
    "ipa": "appuɖu at̪anu pani tʃeːst̪uː unnaːɖu"
