  - "text": "ఇక్కడ తెలుగు మాట్లాడడానికి నేర్పిస్తారు."
    "reading": "ikkaḍa telugu māṭlāḍaḍāniki nērpistāru."
    "ipa": "ikkaɖa t̪eluɡu maːʈlaːɖaɖaːniki neːrpist̪aːru"
  - "text": "ప్రతి రోజు తెలుగు చదువుకోండి."
    "reading": "prati rōju telugu caduvukōṇḍi."
    "ipa": "prat̪i roːdʒu t̪eluɡu tʃad̪uʋukoːɳɖi"
