  "title": "A short match report"
  "sentences":
  - "text": "నిన్న మా జట్టు క్రికెట్ మ్యాచ్ గెలిచింది."
    "reading": "ninna mā jaṭṭu krikeṭ myāc gelicindi."
    "ipa": "ninna maː dʒaʈʈu krikeʈ mjaːtʃ ɡelitʃind̪i"
  - "text": "మా ఆటగాడు మూడు సిక్సర్లు కొట్టాడు."
    "reading": "mā āṭagāḍu mūḍu siksarlu koṭṭāḍu."
    "ipa": "maː aːʈaɡaːɖu muːɖu siksarlu koʈʈaːɖu"
  - "text": "ప్రేక్షకులు స్టేడియంలో చాలా సంతోషంగా ఉన్నారు."
    "reading": "prēkṣakulu sṭēḍiyamlō cālā santōṣaṅgā unnāru."
    "ipa": "preːkʂakulu sʈeːɖijamloː tʃaːlaː sant̪oːʂaŋɡaː unnaːru"
  - "text": "మ్యాచ్ తర్వాత మా ఆటగాడికి ట్రోఫీ ఇచ్చారు."
    "reading": "myāc tarvāta mā āṭagāḍiki ṭrōphī iccāru."
    "ipa": "mjaːtʃ t̪arʋaːt̪a maː aːʈaɡaːɖiki ʈroːpʰiː itʃtʃaːru"
