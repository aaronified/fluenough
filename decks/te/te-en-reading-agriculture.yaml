  "sentences":
  - "text": "మార్కెట్లో ధాన్యం ధర పెరిగింది."
    "reading": "mārkeṭlō dhānyaṁ dhara perigindi."
    "ipa": "maːrkeʈloː d̪ʱaːnjam d̪ʱara periɡind̪i"
  - "text": "పత్తి పంటకు ఈ ఏడాది మంచి ధర ఉంది."
    "reading": "patti paṇṭaku ī ēḍādi mañci dhara undi."
    "ipa": "pat̪t̪i paɳʈaku iː eːɖaːd̪i maɲtʃi d̪ʱara und̪i"
  - "text": "వ్యాపారులు రైతులకు మంచి ధర ఇవ్వాలి."
    "reading": "vyāpārulu raitulaku mañci dhara ivvāli."
    "ipa": "ʋjaːpaːrulu rait̪ulaku maɲtʃi d̪ʱara iʋʋaːli"
  - "text": "ఒక బస్తా బియ్యం ఎంత?"
    "reading": "oka bastā biyyaṁ enta?"
    "ipa": "oka bast̪aː bijjam ent̪a"
