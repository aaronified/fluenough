  - "text": "అద్దె నెలకు మూడు వేల రూపాయలు."
    "reading": "adde nelaku mūḍu vēla rūpāyalu."
    "ipa": "ad̪d̪e nelaku muːɖu ʋeːla ruːpaːjalu"
  - "text": "అడ్వాన్స్ డబ్బు ముందుగానే ఇవ్వాలి."
    "reading": "aḍvāns ḍabbu mundugānē ivvāli."
    "ipa": "aɖʋaːns ɖabbu mund̪uɡaːneː iʋʋaːli"
  - "text": "లీజు ఒప్పందం ఒక సంవత్సరానికి."
    "reading": "līju oppandaṁ oka saṁvatsarāniki."
    "ipa": "liːdʒu oppand̪am oka samʋat̪saraːniki"
