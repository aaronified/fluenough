  "title": "Signs in a park"
  "sentences":
  - "text": "పచ్చిక మీద నడవకండి."
    "reading": "paccika mīda naḍavakaṇḍi."
    "ipa": "patʃtʃika miːd̪a naɖaʋakaɳɖi"
  - "text": "ప్రకృతి అందాన్ని చూడండి."
    "reading": "prakṛti andānni cūḍaṇḍi."
    "ipa": "prakrut̪i and̪aːnni tʃuːɖaɳɖi"
  - "text": "ఈ చెరువు చాలా లోతుగా ఉంది."
    "reading": "ī ceruvu cālā lōtugā undi."
    "ipa": "iː tʃeruʋu tʃaːlaː loːt̪uɡaː und̪i"
  - "text": "ఈ చెట్టు మీద చాలా పక్షులు ఉన్నాయి."
    "reading": "ī ceṭṭu mīda cālā pakṣulu unnāyi."
    "ipa": "iː tʃeʈʈu miːd̪a tʃaːlaː pakʂulu unnaːji"
