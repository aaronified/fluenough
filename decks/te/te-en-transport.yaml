description: "Getting a ride, agreeing the fare and getting off where you want. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: te-en-transport-0001
    target: "బస్సు"
    native: "bus"
    reading: "bassu"
    pos: "noun"
  - id: te-en-transport-0002
    target: "ఆటో"
    native: "auto-rickshaw"
    reading: "aatoo"
    pos: "noun"
  - id: te-en-transport-0003
    target: "టాక్సీ"
    native: "taxi"
    reading: "taaksii"
    pos: "noun"
  - id: te-en-transport-0004
    target: "చార్జీ"
    native: "fare"
    reading: "chaarjii"
    pos: "noun"
    notes: "ఎంత చార్జీ? How much is the fare?"
  - id: te-en-transport-0005
    target: "మీటర్ వేయండి."
    native: "Please put the meter on."
    reading: "miitar veeyandi."
    pos: "phrase"
    tags: ["polite"]
    notes: "Ask before you get in. If the driver refuses, agree the fare first."
  - id: te-en-transport-0006
    target: "స్టేషన్‌కి వెళ్ళాలి."
    native: "I need to go to the station."
    reading: "steeshanki vellaali."
    pos: "phrase"
    notes: "-కి (ki), 'to', joins the end of the place: ఎయిర్‌పోర్ట్‌కి వెళ్ళాలి."
  - id: te-en-transport-0007
    target: "ఎంత సేపు పడుతుంది?"
    native: "How long will it take?"
    reading: "enta seepu padutundi?"
    pos: "phrase"
  - id: te-en-transport-0008
    target: "ఇక్కడ ఆపండి."
    native: "Stop here, please."
    reading: "ikkada aapandi."
    pos: "phrase"
    tags: ["polite"]
  - id: te-en-transport-0009
    target: "స్టేషన్"
    native: "station"
    reading: "steeshan"
    pos: "noun"
  - id: te-en-transport-0010
    target: "టికెట్"
    native: "ticket"
    reading: "tiket"
    pos: "noun"
  - id: te-en-transport-0011
    target: "సీటు"
    native: "seat"
    reading: "siitu"
    pos: "noun"
  - id: te-en-transport-0012
    target: "పదండి"
    native: "let's go; please go"
    reading: "padandi"
    pos: "verb"
    tags: ["polite"]
