schema: 1
id: te-en-grammar-needs
name: "Need and want"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "కావాలి, వద్దు and అవసరం: what you need, what you want, and what you don't. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - ref: te-0345
  - id: te-0460
    target: "కావాలి"
    native: "is needed; is wanted"
    reading: "kaavaali"
    pos: "verb"
    notes: "It stays the same whoever needs it, and the one who needs takes -కు: నాకు, మీకు, అతనికి … కావాలి, 'to me it is needed'."
  - id: te-0461
    target: "మీకు ఏం కావాలి?"
    native: "What would you like? (what a shopkeeper asks)"
    reading: "miiku eem kaavaali?"
    pos: "phrase"
  - id: te-0462
    target: "నాకు నీళ్ళు కావాలి."
    native: "I'd like some water."
    reading: "naaku niillu kaavaali."
    pos: "phrase"
  - id: te-0463
    target: "వద్దు"
    native: "is not wanted; no, thank you"
    reading: "vaddu"
    pos: "verb"
    notes: "The opposite of కావాలి: నాకు వద్దు, I don't want it. On its own, a polite no."
  - id: te-0464
    target: "నాకు ఇది వద్దు."
    native: "I don't want this."
    reading: "naaku idi vaddu."
    pos: "phrase"
  - ref: te-0249
  - id: te-0465
    target: "అవసరం"
    native: "need; necessary"
    reading: "avasaram"
    pos: "noun"
    notes: "నాకు డబ్బు అవసరం, I need money: a firmer need than కావాలి."
  - id: te-0466
    target: "అవసరం లేదు."
    native: "There's no need."
    reading: "avasaram leedu."
    pos: "phrase"
  - id: te-0467
    target: "నాకు సహాయం కావాలి."
    native: "I need some help."
    reading: "naaku sahaayam kaavaali."
    pos: "phrase"
  - id: te-0468
    target: "నాకు ఇంటికి వెళ్ళాలని ఉంది."
    native: "I want to go home."
    reading: "naaku intiki vellaalani undi."
    pos: "phrase"
    notes: "To want to do something: the verb in -ఆలని, then ఉంది, 'to me there is a wish to go'."
