schema: 1
id: te-en-grammar-needs
name: "Need and want"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "కావాలి (kāvāli), వద్దు (vaddu) and అవసరం (avasaram): what you need, what you want, and what you don't. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - ref: te-0345
  - id: te-0460
    target: "కావాలి"
    native: "is needed; is wanted"
    reading: "kāvāli"
    ipa: "kaːʋaːli"
    pos: "verb"
    notes: "It stays the same whoever needs it, and the one who needs takes -కు (-ku): నాకు (nāku), మీకు (mīku), అతనికి (ataniki) … కావాలి (kāvāli), 'to me it is needed'."
  - id: te-0461
    target: "మీకు ఏం కావాలి?"
    native: "What would you like? (what a shopkeeper asks)"
    reading: "mīku ēm kāvāli?"
    ipa: "miːku eːm kaːʋaːli"
    pos: "phrase"
    bases:
      - { word: "మీకు", ref: "te-0136" }
      - { word: "ఏం", ref: "te-0160" }
  - id: te-0462
    target: "నాకు నీళ్ళు కావాలి."
    native: "I'd like some water."
    reading: "nāku nīḷḷu kāvāli."
    ipa: "naːku niːɭɭu kaːʋaːli"
    pos: "phrase"
    bases:
      - { word: "నాకు", ref: "te-0593" }
  - id: te-0463
    target: "వద్దు"
    native: "is not wanted; no, thank you"
    reading: "vaddu"
    ipa: "ʋad̪d̪u"
    pos: "verb"
    notes: "The opposite of కావాలి (kāvāli): నాకు వద్దు (nāku vaddu), I don't want it. On its own, a polite no."
  - id: te-0464
    target: "నాకు ఇది వద్దు."
    native: "I don't want this."
    reading: "nāku idi vaddu."
    ipa: "naːku id̪i ʋad̪d̪u"
    pos: "phrase"
    bases:
      - { word: "నాకు", ref: "te-0593" }
      - { word: "ఇది", ref: "te-0600" }
  - ref: te-0249
  - id: te-0465
    target: "అవసరం"
    native: "need; necessary"
    reading: "avasaram"
    ipa: "aʋasaram"
    pos: "noun"
    notes: "నాకు డబ్బు అవసరం (nāku ḍabbu avasaram), I need money: a firmer need than కావాలి (kāvāli)."
  - id: te-0466
    target: "అవసరం లేదు."
    native: "There's no need."
    reading: "avasaram lēdu."
    ipa: "aʋasaram leːd̪u"
    pos: "phrase"
  - id: te-0467
    target: "నాకు సహాయం కావాలి."
    native: "I need some help."
    reading: "nāku sahāyam kāvāli."
    ipa: "naːku sahaːjam kaːʋaːli"
    pos: "phrase"
    bases:
      - { word: "నాకు", ref: "te-0593" }
  - id: te-0468
    target: "నాకు ఇంటికి వెళ్ళాలని ఉంది."
    native: "I want to go home."
    reading: "nāku iṇṭiki veḷḷālani undi."
    ipa: "naːku iɳʈiki ʋeɭɭaːlani und̪i"
    pos: "phrase"
    notes: "To want to do something: the verb in -ఆలని (-ālani), then ఉంది (undi), 'to me there is a wish to go'."
    bases:
      - { word: "నాకు", ref: "te-0593" }
      - { word: "ఇంటికి", ref: "te-0195" }
      - { word: "వెళ్ళాలని", ref: "te-0622" }
      - { word: "ఉంది", ref: "te-0633" }
