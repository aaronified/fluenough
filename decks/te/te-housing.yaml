      - { target: "స్విచ్ ఆఫ్ చేయి.", reading: "svic āph cēyi.", ipa: "sʋitʃ aːpʰ tʃeːji", bases: [{ word: "చేయి", base: "చేయడం", reading: "cēyaḍaṁ" }] }
  - id: "te-5712"
