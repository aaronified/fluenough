      - { target: "ఏడో అంతస్తుకి లిఫ్ట్‌లో వెళ్దాం.", reading: "ēḍō antastuki liphṭlō veḷdāṁ.", ipa: "eːɖoː ant̪ast̪uki lipʰʈloː ʋeɭd̪aːm", bases: [{ word: "అంతస్తుకి", base: "అంతస్తు", reading: "antastu" }, { word: "లిఫ్ట్‌లో", base: "లిఫ్ట్", reading: "liphṭ" }, { word: "వెళ్దాం", base: "వెళ్ళడం", reading: "veḷḷaḍaṁ" }] }
