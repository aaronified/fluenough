    ipa: "paikappu"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "పైకప్పు నుంచి నీరు కారుతోంది.", reading: "paikappu nuñci nīru kārutōndi.", ipa: "paikappu nuɲtʃi niːru kaːrut̪oːnd̪i", bases: [{ word: "కారుతోంది", base: "కారడం", reading: "kāraḍaṁ" }] }
      - { target: "గది పైకప్పు చాలా ఎత్తుగా ఉంది.", reading: "gadi paikappu cālā ettugā undi.", ipa: "ɡad̪i paikappu tʃaːlaː et̪t̪uɡaː und̪i", bases: [{ word: "ఎత్తుగా", base: "ఎత్తు", reading: "ettu" }, { word: "ఉంది", base: "ఉండడం", reading: "uṇḍaḍaṁ" }] }
    senses:
      - { id: "roof", pos: "noun", source: "https://en.wiktionary.org/wiki/పైకప్పు" }
      - { id: "ceiling", pos: "noun", source: "https://en.wiktionary.org/wiki/పైకప్పు" }
