  - id: "te-5708"
    target: "వరండా"
    reading: "varaṇḍā"
    ipa: "ʋaraɳɖaː"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "వరండాలో కుర్చీలు ఉన్నాయి.", reading: "varaṇḍālō kurcīlu unnāyi.", ipa: "ʋaraɳɖaːloː kurtʃiːlu unnaːji", bases: [{ word: "వరండాలో", base: "వరండా", reading: "varaṇḍā" }, { word: "కుర్చీలు", base: "కుర్చీ", reading: "kurcī" }, { word: "ఉన్నాయి", base: "ఉండడం", reading: "uṇḍaḍaṁ" }] }
      - { target: "వర్షం వస్తే వరండాలో కూర్చోవచ్చు.", reading: "varṣaṁ vastē varaṇḍālō kūrcōvaccu.", ipa: "ʋarʂam ʋast̪eː ʋaraɳɖaːloː kuːrtʃoːʋatʃtʃu", bases: [{ word: "వస్తే", base: "రావడం", reading: "rāvaḍaṁ" }, { word: "వరండాలో", base: "వరండా", reading: "varaṇḍā" }, { word: "కూర్చోవచ్చు", base: "కూర్చోవడం", reading: "kūrcōvaḍaṁ" }] }
  - id: "te-5709"
