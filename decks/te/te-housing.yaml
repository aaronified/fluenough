      - { target: "ఈ బల్బు చాలా ప్రకాశంగా ఉంది.", reading: "ī balbu cālā prakāśaṅgā undi.", ipa: "iː balbu tʃaːlaː prakaːʃaŋɡaː und̪i", bases: [{ word: "ప్రకాశంగా", base: "ప్రకాశం", reading: "prakāśaṁ" }, { word: "ఉంది", base: "ఉండడం", reading: "uṇḍaḍaṁ" }] }
