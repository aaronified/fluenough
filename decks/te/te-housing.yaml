  - id: "te-5700"
    target: "అపార్ట్‌మెంట్"
    reading: "apārṭmeṇṭ"
    ipa: "apaːrʈmeɳʈ"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "ఈ అపార్ట్‌మెంట్‌లో మూడు గదులు ఉన్నాయి.", reading: "ī apārṭmeṇṭlō mūḍu gadulu unnāyi.", ipa: "iː apaːrʈmeɳʈloː muːɖu ɡad̪ulu unnaːji", bases: [{ word: "అపార్ట్‌మెంట్‌లో", base: "అపార్ట్‌మెంట్", reading: "apārṭmeṇṭ" }, { word: "గదులు", base: "గది", reading: "gadi" }, { word: "ఉన్నాయి", base: "ఉండడం", reading: "uṇḍaḍaṁ" }] }
      - { target: "నా స్నేహితుడు కొత్త అపార్ట్‌మెంట్ కొన్నాడు.", reading: "nā snēhituḍu kotta apārṭmeṇṭ konnāḍu.", ipa: "naː sneːhit̪uɖu kot̪t̪a apaːrʈmeɳʈ konnaːɖu", bases: [{ word: "కొన్నాడు", base: "కొనడం", reading: "konaḍaṁ" }] }
