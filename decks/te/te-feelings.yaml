  - id: "te-3300"
    target: "ప్రేమ"
    reading: "prēma"
    ipa: "preːma"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "ప్రేమతో", reading: "prēmatō" }] }
    examples:
      - target: "అమ్మ పిల్లలపై ఎంతో ప్రేమ చూపిస్తుంది."
        reading: "amma pillalapai entō prēma cūpistundi."
        ipa: "amma pillalapai ent̪oː preːma tʃuːpist̪und̪i"
        bases:
          - { word: "పిల్లలపై", base: "పిల్లలు", reading: "pillalu" }
          - { word: "చూపిస్తుంది", base: "చూపించడం", reading: "cūpiñcaḍam" }
      - "target": "ఈ ఊరి మీద నాకు ప్రేమ పెరిగింది."
        "reading": "ī ūri mīda nāku prēma perigindi."
        "ipa": "iː uːri miːd̪a naːku preːma periɡind̪i"
        "bases":
          - "word": "ఊరి"
            "base": "ఊరు"
            "reading": "ūru"
          - "word": "పెరిగింది"
