- "id": "te-safety-notice"
  "title": "A safety notice in a building"
  "sentences":
  - "text": "అగ్నిప్రమాదం జరిగితే మెట్ల ద్వారా బయటకు వెళ్ళండి."
    "reading": "agnipramādaṁ jarigitē meṭla dvārā bayaṭaku veḷḷaṇḍi."
    "ipa": "aɡnipramaːd̪am dʒariɡit̪eː meʈla d̪ʋaːraː bajaʈaku ʋeɭɭaɳɖi"
  - "text": "అగ్నిప్రమాదం జరిగితే లిఫ్ట్‌లో వెళ్ళకండి."
    "reading": "agnipramādaṁ jarigitē liphṭlō veḷḷakaṇḍi."
    "ipa": "aɡnipramaːd̪am dʒariɡit̪eː lipʰʈloː ʋeɭɭakaɳɖi"
  - "text": "సైరన్ వినిపిస్తే వెంటనే సురక్షిత స్థలానికి వెళ్ళండి."
    "reading": "sairan vinipistē veṇṭanē surakṣita sthalāniki veḷḷaṇḍi."
    "ipa": "sairan ʋinipist̪eː ʋeɳʈaneː surakʂit̪a st̪ʰalaːniki ʋeɭɭaɳɖi"
  - "text": "ఎవరైనా ఆపదలో ఉంటే ఫోన్ చేయండి."
    "reading": "evarainā āpadalō uṇṭē phōn cēyaṇḍi."
    "ipa": "eʋarainaː aːpad̪aloː uɳʈeː pʰoːn tʃeːjaɳɖi"
