  "sentences":
  - "text": "ఇక్కడ ఈరోజు చాలా చలిగా ఉంది."
    "reading": "ikkaḍa īrōju cālā caligā undi."
    "ipa": "ikkaɖa iːroːdʒu tʃaːlaː tʃaliɡaː und̪i"
  - "text": "నాకు చాలా దాహంగా ఉంది."
    "reading": "nāku cālā dāhaṅgā undi."
    "ipa": "naːku tʃaːlaː d̪aːhaŋɡaː und̪i"
  - "text": "నేను ఇడ్లీ తింటాను."
    "reading": "nēnu iḍlī tiṇṭānu."
    "ipa": "neːnu iɖliː t̪iɳʈaːnu"
  - "text": "ఈ పండు ఖరీదైనది."
    "reading": "ī paṇḍu kharīdainadi."
    "ipa": "iː paɳɖu kʰariːd̪ainad̪i"
