  "title": "Travel diary"
  "sentences":
  - "text": "ఉదయం లేచి, బస్సు ఎక్కి స్టేషన్‌కి వెళ్ళాను."
    "reading": "udayaṁ lēci, bassu ekki sṭēṣanki veḷḷānu."
    "ipa": "ud̪ajam leːtʃi bassu ekki sʈeːʂanki ʋeɭɭaːnu"
  - "text": "టికెట్ కొని రైలు ఎక్కాను."
    "reading": "ṭikeṭ koni railu ekkānu."
    "ipa": "ʈikeʈ koni railu ekkaːnu"
  - "text": "రైలు దిగి, ఒక టీ తాగి, పనికి వెళ్ళాను."
    "reading": "railu digi, oka ṭī tāgi, paniki veḷḷānu."
    "ipa": "railu d̪iɡi oka ʈiː t̪aːɡi paniki ʋeɭɭaːnu"
  - "text": "సాయంత్రం ఇంటికి తిరిగి వచ్చి, భోజనం చేసి పడుకున్నాను."
    "reading": "sāyantraṁ iṇṭiki tirigi vacci, bhōjanaṁ cēsi paḍukunnānu."
    "ipa": "saːjant̪ram iɳʈiki t̪iriɡi ʋatʃtʃi bʱoːdʒanam tʃeːsi paɖukunnaːnu"
