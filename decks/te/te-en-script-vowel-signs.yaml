schema: 1
id: te-en-script-vowel-signs
name: "Telugu vowel signs"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "After a consonant a vowel is written as a sign (gunintam) on it: on top, on the right, or in two parts, never before it. Here on క and on మ."
tags: [beginner, unreviewed, script]
cards:
  - id: te-en-script-vowel-signs-0001
    target: "కా"
    native: "kaa (k + the aa sign)"
    reading: "kaa"
    notes: "The aa sign ా is at the top, where the tick (talakattu) becomes a hook to the right: కాకి (kaaki, crow). Compare క on its own, which is 'ka'."
  - id: te-en-script-vowel-signs-0002
    target: "కి"
    native: "ki (k + the i sign)"
    reading: "ki"
    notes: "The i sign ి sits on top, in place of the tick (talakattu) many consonants carry: కిటికీ (kitikii, window)."
  - id: te-en-script-vowel-signs-0003
    target: "కీ"
    native: "kii (k + the ii sign)"
    reading: "kii"
    notes: "The ii sign ీ also sits on top, with a stroke for the length. Short and long change the word, so look for the stroke."
  - id: te-en-script-vowel-signs-0004
    target: "కు"
    native: "ku (k + the u sign)"
    reading: "ku"
    notes: "The u sign ు is joined on the right: కుక్క (kukka, dog)."
  - id: te-en-script-vowel-signs-0005
    target: "కూ"
    native: "kuu (k + the uu sign)"
    reading: "kuu"
    notes: "The uu sign ూ is joined on the right, with a longer curl: కూర (kuura, curry)."
  - id: te-en-script-vowel-signs-0006
    target: "కృ"
    native: "kru (k + the ru sign)"
    reading: "kru"
    modes: [recognition, production]
    notes: "The ru sign ృ is joined on the right, like the u signs, in words from Sanskrit. A recogniser writes 'kru' as క్రు, so it is drilled by reading and writing only."
  - id: te-en-script-vowel-signs-0007
    target: "కె"
    native: "ke (k + the e sign)"
    reading: "ke"
    notes: "The e sign ె sits on top, in place of the tick: కెరటం (keratam, wave)."
  - id: te-en-script-vowel-signs-0008
    target: "కే"
    native: "kee (k + the ee sign)"
    reading: "kee"
    notes: "The ee sign ే sits on top, with a stroke for the length: కేక (keeka, shout)."
  - id: te-en-script-vowel-signs-0009
    target: "కై"
    native: "kai (k + the ai sign)"
    reading: "kai"
    notes: "The ai sign ై comes in two parts: on top, and below the consonant."
  - id: te-en-script-vowel-signs-0010
    target: "కొ"
    native: "ko (k + the o sign)"
    reading: "ko"
    notes: "The o sign ొ sits on top and curls to the right: కొడుకు (koduku, son)."
  - id: te-en-script-vowel-signs-0011
    target: "కో"
    native: "koo (k + the oo sign)"
    reading: "koo"
    notes: "The oo sign ో is the o sign with a stroke for the length: కోడి (koodi, hen)."
  - id: te-en-script-vowel-signs-0012
    target: "కౌ"
    native: "kau (k + the au sign)"
    reading: "kau"
    notes: "The au sign ౌ sits on top and to the right: కౌగిలి (kaugili, hug)."
  - id: te-en-script-vowel-signs-0013
    target: "కం"
    native: "kam (k + the sunna)"
    reading: "kam"
    modes: [recognition, production]
    notes: "The circle ం after a letter, the sunna (anusvaram), is an m or an n: m at the end of a word, and before another consonant the nasal that suits it: కంచం (kancham, plate). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: te-en-script-vowel-signs-0014
    target: "క్"
    native: "k (with the pollu: no vowel)"
    reading: "k"
    modes: [recognition, production]
    notes: "The pollu ్ takes the vowel away: క్ is 'k' alone. Two consonants usually join instead, the second written below; the pollu ends English words such as డాక్టర్ (daaktar, doctor). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: te-en-script-vowel-signs-0015
    target: "మా"
    native: "maa (m + the aa sign)"
    reading: "maa"
    notes: "The same aa sign on another consonant: each sign keeps its place whatever the consonant. మా (maa, our)."
  - id: te-en-script-vowel-signs-0016
    target: "మి"
    native: "mi (m + the i sign)"
    reading: "mi"
    notes: "The i sign on top of మ: మిరపకాయ (mirapakaaya, chilli)."
  - id: te-en-script-vowel-signs-0017
    target: "మీ"
    native: "mii (m + the ii sign)"
    reading: "mii"
    notes: "The ii sign on top of మ, with its stroke: మీ (mii, your)."
  - id: te-en-script-vowel-signs-0018
    target: "ము"
    native: "mu (m + the u sign)"
    reading: "mu"
    notes: "The u sign on the right of మ: ముక్కు (mukku, nose)."
  - id: te-en-script-vowel-signs-0019
    target: "మూ"
    native: "muu (m + the uu sign)"
    reading: "muu"
    notes: "The uu sign on the right of మ: మూడు (muudu, three)."
  - id: te-en-script-vowel-signs-0020
    target: "మె"
    native: "me (m + the e sign)"
    reading: "me"
    notes: "The e sign on top of మ: మెడ (meda, neck)."
  - id: te-en-script-vowel-signs-0021
    target: "మే"
    native: "mee (m + the ee sign)"
    reading: "mee"
    notes: "The ee sign on top of మ, with its stroke: మేక (meeka, goat)."
  - id: te-en-script-vowel-signs-0022
    target: "మొ"
    native: "mo (m + the o sign)"
    reading: "mo"
    notes: "The o sign on top of మ, curling right: మొక్క (mokka, plant)."
  - id: te-en-script-vowel-signs-0023
    target: "మో"
    native: "moo (m + the oo sign)"
    reading: "moo"
    notes: "The oo sign on మ: మోకాలు (mookaalu, knee)."
