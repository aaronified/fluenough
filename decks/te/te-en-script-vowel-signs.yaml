schema: 1
id: te-en-script-vowel-signs
name: "Telugu vowel signs"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "After a consonant a vowel is written as a sign (gunintam) on it: on top, on the right, or in two parts, never before it. Here on క (ka) and on మ (ma)."
tags: [beginner, unreviewed, script]
cards:
  - id: te-0063
    target: "కా"
    native: "kaa (k + the aa sign)"
    reading: "kā"
    ipa: "kaː"
    notes: "The aa sign ా (ā) is at the top, where the tick (talakattu) becomes a hook to the right: కాకి (kāki, crow). Compare క (ka) on its own, which is 'ka' with a short a."
  - id: te-0064
    target: "కి"
    native: "ki (k + the i sign)"
    reading: "ki"
    ipa: "ki"
    notes: "The i sign ి (i) sits on top, in place of the tick (talakattu) many consonants carry: కిటికీ (kiṭikī, window)."
  - id: te-0065
    target: "కీ"
    native: "kii (k + the ii sign)"
    reading: "kī"
    ipa: "kiː"
    notes: "The ii sign ీ (ī) also sits on top, with a stroke for the length. Short and long change the word, so look for the stroke."
  - id: te-0066
    target: "కు"
    native: "ku (k + the u sign)"
    reading: "ku"
    ipa: "ku"
    notes: "The u sign ు (u) is joined on the right: కుక్క (kukka, dog)."
  - id: te-0067
    target: "కూ"
    native: "kuu (k + the uu sign)"
    reading: "kū"
    ipa: "kuː"
    notes: "The uu sign ూ (ū) is joined on the right, with a longer curl: కూర (kūra, curry)."
  - id: te-0068
    target: "కృ"
    native: "kru (k + the ru sign)"
    reading: "kru"
    ipa: "kru"
    modes: [recognition, production]
    notes: "The ru sign ృ (ru) is joined on the right, like the u signs, in words from Sanskrit. A recogniser writes 'kru' as క్రు (kru), so it is drilled by reading and writing only."
  - id: te-0069
    target: "కె"
    native: "ke (k + the e sign)"
    reading: "ke"
    ipa: "ke"
    notes: "The e sign ె (e) sits on top, in place of the tick: కెరటం (keraṭam, wave)."
  - id: te-0070
    target: "కే"
    native: "kee (k + the ee sign)"
    reading: "kē"
    ipa: "keː"
    notes: "The ee sign ే (ē) sits on top, with a stroke for the length: కేక (kēka, shout)."
  - id: te-0071
    target: "కై"
    native: "kai (k + the ai sign)"
    reading: "kai"
    ipa: "kai"
    notes: "The ai sign ై (ai) comes in two parts: on top, and below the consonant."
  - id: te-0072
    target: "కొ"
    native: "ko (k + the o sign)"
    reading: "ko"
    ipa: "ko"
    notes: "The o sign ొ (o) sits on top and curls to the right: కొడుకు (koḍuku, son)."
  - id: te-0073
    target: "కో"
    native: "koo (k + the oo sign)"
    reading: "kō"
    ipa: "koː"
    notes: "The oo sign ో (ō) is the o sign with a stroke for the length: కోడి (kōḍi, hen)."
  - id: te-0074
    target: "కౌ"
    native: "kau (k + the au sign)"
    reading: "kau"
    ipa: "kau"
    notes: "The au sign ౌ (au) sits on top and to the right: కౌగిలి (kaugili, hug)."
  - id: te-0075
    target: "కం"
    native: "kam (k + the sunna)"
    reading: "kam"
    ipa: "kam"
    modes: [recognition, production]
    notes: "The circle ం (am) after a letter, the sunna (anusvaram), is an m or an n: m at the end of a word, and before another consonant the nasal that suits it: కంచం (kañcam, plate). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: te-0076
    target: "క్"
    native: "k (with the pollu: no vowel)"
    reading: "k"
    ipa: "k"
    modes: [recognition, production]
    notes: "The pollu ్ takes the vowel away: క్ (k) is 'k' alone. Two consonants usually join instead, the second written below; the pollu ends English words such as డాక్టర్ (ḍākṭar, doctor). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: te-0077
    target: "మా"
    native: "maa (m + the aa sign)"
    reading: "mā"
    ipa: "maː"
    notes: "The same aa sign on another consonant: each sign keeps much the same place on most consonants, though its shape joins each a little differently. మా (mā, our)."
  - id: te-0078
    target: "మి"
    native: "mi (m + the i sign)"
    reading: "mi"
    ipa: "mi"
    notes: "The i sign on top of మ (ma): మిరపకాయ (mirapakāya, chilli)."
  - id: te-0079
    target: "మీ"
    native: "mii (m + the ii sign)"
    reading: "mī"
    ipa: "miː"
    notes: "The ii sign on top of మ (ma), with its stroke: మీ (mī, your)."
  - id: te-0080
    target: "ము"
    native: "mu (m + the u sign)"
    reading: "mu"
    ipa: "mu"
    notes: "The u sign on the right of మ (ma): ముక్కు (mukku, nose)."
  - id: te-0081
    target: "మూ"
    native: "muu (m + the uu sign)"
    reading: "mū"
    ipa: "muː"
    notes: "The uu sign on the right of మ (ma): మూడు (mūḍu, three)."
  - id: te-0082
    target: "మె"
    native: "me (m + the e sign)"
    reading: "me"
    ipa: "me"
    notes: "The e sign on top of మ (ma): మెడ (meḍa, neck)."
  - id: te-0083
    target: "మే"
    native: "mee (m + the ee sign)"
    reading: "mē"
    ipa: "meː"
    notes: "The ee sign on top of మ (ma), with its stroke: మేక (mēka, goat)."
  - id: te-0084
    target: "మొ"
    native: "mo (m + the o sign)"
    reading: "mo"
    ipa: "mo"
    notes: "The o sign on top of మ (ma), curling right: మొక్క (mokka, plant)."
  - id: te-0085
    target: "మో"
    native: "moo (m + the oo sign)"
    reading: "mō"
    ipa: "moː"
    notes: "The oo sign on మ (ma): మోకాలు (mōkālu, knee)."
