          - { word: "తలుపు", base: "తలుపు", reading: "talupu" }
          - { word: "తట్టారు", base: "తట్టడం", reading: "taṭṭaḍaṁ" }
      - target: "నా పుస్తకం ఎవరో తీసుకెళ్ళారు."
        reading: "nā pustakaṁ evarō tīsukeḷḷāru."
        ipa: "naː pust̪akam eʋaroː t̪iːsukeɭɭaːru"
        bases:
          - { word: "నా", base: "నేను", reading: "nēnu" }
