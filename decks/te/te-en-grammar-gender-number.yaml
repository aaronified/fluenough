name: "Gender and number"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "He, she and it in the third person, and the plural. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - ref: te-0122
    tags: []
  - ref: te-0123
    tags: []
    notes: "Telugu's third person has a masculine ending, -డు (-ḍu), and a non-masculine one, -ది (-di), shared by 'she' and 'it': ఆమె వచ్చింది (āme vaccindi), అది వచ్చింది (adi vaccindi). It is a grammar class, not a statement about people. For respect, ఆవిడ వచ్చారు (āviḍa vaccāru), she came, just as ఆయన వచ్చారు (āyana vaccāru) for a man."
  - ref: te-0124
    tags: []
  - id: te-0268
    target: "వాళ్ళు వచ్చారు."
    native: "They came."
    reading: "vāḷḷu vaccāru."
    ipa: "ʋaːɭɭu ʋatʃtʃaːru"
    pos: "phrase"
    bases:
      - { word: "వాళ్ళు", ref: "te-0601" }
      - { word: "వచ్చారు", ref: "te-0623" }
  - id: te-0269
    target: "పిల్లలు ఆడుతున్నారు."
    native: "The children are playing."
    reading: "pillalu āḍutunnāru."
    ipa: "pillalu aːɖut̪unnaːru"
    pos: "phrase"
    notes: "-లు (-lu) makes a plural: పిల్ల (pilla) → పిల్లలు (pillalu)."
    bases:
      - { word: "ఆడుతున్నారు", ref: "te-0637" }
  - id: te-0270
    target: "మూడు పుస్తకాలు"
    native: "three books"
    reading: "mūḍu pustakālu"
    ipa: "muːɖu pust̪akaːlu"
    pos: "phrase"
    notes: "After a number, the noun is plural."
    bases:
      - { word: "పుస్తకాలు", ref: "te-0865" }
