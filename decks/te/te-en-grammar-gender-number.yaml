cards:
  - ref: te-0122
    tags: []
  - ref: te-0123
    tags: []
    notes: "In the third person a woman takes the same verb form as a thing: ఆమె వచ్చింది, అది వచ్చింది. Only men have a form of their own."
  - ref: te-0124
    tags: []
  - id: te-0268
    target: "వాళ్ళు వచ్చారు."
    native: "They came."
    reading: "vallu vaccharu."
    pos: "phrase"
  - id: te-0269
    target: "పిల్లలు ఆడుతున్నారు."
    native: "The children are playing."
    reading: "pillalu adutunnaru."
    pos: "phrase"
    notes: "-లు makes a plural: పిల్ల → పిల్లలు."
  - id: te-0270
    target: "మూడు పుస్తకాలు"
    native: "three books"
    reading: "mudu pustakalu"
    pos: "phrase"
    notes: "After a number, the noun is plural."
