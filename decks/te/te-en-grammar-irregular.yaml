schema: 1
id: te-en-grammar-irregular
name: "Irregular verbs"
kind: grammar
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The common verbs whose stem changes from tense to tense. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Irregular verbs"
  slot_name: "form"
  slots: ["past, నేను", "future, నేను", "polite request, మీరు"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "These change their stem: రావడం (to come) gives వచ్చాను, వస్తాను and రండి; ఇవ్వడం (to give) gives ఇచ్చాను, ఇస్తాను."
  entries:
    - lemma: "రావడం"
      key: raavadam
      reading: "ravadam"
      gloss: "to come"
      forms:
        "past, నేను": "వచ్చాను"
        "future, నేను": "వస్తాను"
        "polite request, మీరు": "రండి"
      readings:
        "past, నేను": "vacchanu"
        "future, నేను": "vastanu"
        "polite request, మీరు": "randi"
    - lemma: "ఇవ్వడం"
      key: ivvadam
      reading: "ivvadam"
      gloss: "to give"
      forms:
        "past, నేను": "ఇచ్చాను"
        "future, నేను": "ఇస్తాను"
        "polite request, మీరు": "ఇవ్వండి"
      readings:
        "past, నేను": "icchanu"
        "future, నేను": "istanu"
        "polite request, మీరు": "ivvandi"
    - lemma: "తినడం"
      key: tinadam
      reading: "tinadam"
      gloss: "to eat"
      forms:
        "past, నేను": "తిన్నాను"
        "future, నేను": "తింటాను"
        "polite request, మీరు": "తినండి"
      readings:
        "past, నేను": "tinnanu"
        "future, నేను": "tintanu"
        "polite request, మీరు": "tinandi"
    - lemma: "తీసుకోవడం"
      key: tiisukoovadam
      reading: "tisukovadam"
      gloss: "to take"
      forms:
        "past, నేను": "తీసుకున్నాను"
        "future, నేను": "తీసుకుంటాను"
        "polite request, మీరు": "తీసుకోండి"
      readings:
        "past, నేను": "tisukunnanu"
        "future, నేను": "tisukuntanu"
        "polite request, మీరు": "tisukondi"
    - lemma: "చూడడం"
      key: chuudadam
      reading: "chudadam"
      gloss: "to see"
      forms:
        "past, నేను": "చూశాను"
        "future, నేను": "చూస్తాను"
        "polite request, మీరు": "చూడండి"
      readings:
        "past, నేను": "chushanu"
        "future, నేను": "chustanu"
        "polite request, మీరు": "chudandi"
    - lemma: "వెళ్ళడం"
      key: velladam
      reading: "velladam"
      gloss: "to go"
      forms:
        "past, నేను": "వెళ్ళాను"
        "future, నేను": "వెళ్తాను"
        "polite request, మీరు": "వెళ్ళండి"
      readings:
        "past, నేను": "vellanu"
        "future, నేను": "veltanu"
        "polite request, మీరు": "vellandi"
