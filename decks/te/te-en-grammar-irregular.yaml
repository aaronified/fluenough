schema: 1
id: te-en-grammar-irregular
name: "Irregular verbs"
kind: grammar
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The common verbs whose stem changes from tense to tense. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Irregular verbs"
  slot_name: "form"
  slots: ["past, నేను (nēnu)", "future, నేను (nēnu)", "polite request, మీరు (mīru)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "These change their stem: రావడం (to come) gives వచ్చాను (vaccānu), వస్తాను (vastānu) and రండి (raṇḍi); ఇవ్వడం (to give) gives ఇచ్చాను (iccānu), ఇస్తాను (istānu)."
  entries:
    - lemma: "రావడం"
      key: raavadam
      reading: "rāvaḍam"
      ipa: "raːʋaɖam"
      gloss: "to come"
      forms:
        "past, నేను (nēnu)": "వచ్చాను"
        "future, నేను (nēnu)": "వస్తాను"
        "polite request, మీరు (mīru)": "రండి"
      readings:
        "past, నేను (nēnu)": "vaccānu"
        "future, నేను (nēnu)": "vastānu"
        "polite request, మీరు (mīru)": "raṇḍi"
      ipas:
        "past, నేను (nēnu)": "ʋatʃtʃaːnu"
        "future, నేను (nēnu)": "ʋast̪aːnu"
        "polite request, మీరు (mīru)": "raɳɖi"
    - lemma: "ఇవ్వడం"
      key: ivvadam
      reading: "ivvaḍam"
      ipa: "iʋʋaɖam"
      gloss: "to give"
      forms:
        "past, నేను (nēnu)": "ఇచ్చాను"
        "future, నేను (nēnu)": "ఇస్తాను"
        "polite request, మీరు (mīru)": "ఇవ్వండి"
      readings:
        "past, నేను (nēnu)": "iccānu"
        "future, నేను (nēnu)": "istānu"
        "polite request, మీరు (mīru)": "ivvaṇḍi"
      ipas:
        "past, నేను (nēnu)": "itʃtʃaːnu"
        "future, నేను (nēnu)": "ist̪aːnu"
        "polite request, మీరు (mīru)": "iʋʋaɳɖi"
    - lemma: "తినడం"
      key: tinadam
      reading: "tinaḍam"
      ipa: "t̪inaɖam"
      gloss: "to eat"
      forms:
        "past, నేను (nēnu)": "తిన్నాను"
        "future, నేను (nēnu)": "తింటాను"
        "polite request, మీరు (mīru)": "తినండి"
      readings:
        "past, నేను (nēnu)": "tinnānu"
        "future, నేను (nēnu)": "tiṇṭānu"
        "polite request, మీరు (mīru)": "tinaṇḍi"
      ipas:
        "past, నేను (nēnu)": "t̪innaːnu"
        "future, నేను (nēnu)": "t̪iɳʈaːnu"
        "polite request, మీరు (mīru)": "t̪inaɳɖi"
    - lemma: "తీసుకోవడం"
      key: tiisukoovadam
      reading: "tīsukōvaḍam"
      ipa: "t̪iːsukoːʋaɖam"
      gloss: "to take"
      forms:
        "past, నేను (nēnu)": "తీసుకున్నాను"
        "future, నేను (nēnu)": "తీసుకుంటాను"
        "polite request, మీరు (mīru)": "తీసుకోండి"
      readings:
        "past, నేను (nēnu)": "tīsukunnānu"
        "future, నేను (nēnu)": "tīsukuṇṭānu"
        "polite request, మీరు (mīru)": "tīsukōṇḍi"
      ipas:
        "past, నేను (nēnu)": "t̪iːsukunnaːnu"
        "future, నేను (nēnu)": "t̪iːsukuɳʈaːnu"
        "polite request, మీరు (mīru)": "t̪iːsukoːɳɖi"
    - lemma: "చూడడం"
      key: chuudadam
      reading: "cūḍaḍam"
      ipa: "tʃuːɖaɖam"
      gloss: "to see"
      forms:
        "past, నేను (nēnu)": "చూశాను"
        "future, నేను (nēnu)": "చూస్తాను"
        "polite request, మీరు (mīru)": "చూడండి"
      readings:
        "past, నేను (nēnu)": "cūśānu"
        "future, నేను (nēnu)": "cūstānu"
        "polite request, మీరు (mīru)": "cūḍaṇḍi"
      ipas:
        "past, నేను (nēnu)": "tʃuːʃaːnu"
        "future, నేను (nēnu)": "tʃuːst̪aːnu"
        "polite request, మీరు (mīru)": "tʃuːɖaɳɖi"
    - lemma: "వెళ్ళడం"
      key: velladam
      reading: "veḷḷaḍam"
      ipa: "ʋeɭɭaɖam"
      gloss: "to go"
      forms:
        "past, నేను (nēnu)": "వెళ్ళాను"
        "future, నేను (nēnu)": "వెళ్తాను"
        "polite request, మీరు (mīru)": "వెళ్ళండి"
      readings:
        "past, నేను (nēnu)": "veḷḷānu"
        "future, నేను (nēnu)": "veḷtānu"
        "polite request, మీరు (mīru)": "veḷḷaṇḍi"
      ipas:
        "past, నేను (nēnu)": "ʋeɭɭaːnu"
        "future, నేను (nēnu)": "ʋeɭt̪aːnu"
        "polite request, మీరు (mīru)": "ʋeɭɭaɳɖi"
