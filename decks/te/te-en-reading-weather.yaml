    "reading": "ippuḍu varṣaṁ vastōndi."
    "ipa": "ippuɖu ʋarʂam ʋast̪oːnd̪i"
  - "text": "వర్షాకాలం రేపు వస్తుంది."
    "reading": "varṣākālaṁ rēpu vastundi."
    "ipa": "ʋarʂaːkaːlam reːpu ʋast̪und̪i"
  - "text": "నువ్వు రేపు వస్తావా?"
    "reading": "nuvvu rēpu vastāvā?"
    "ipa": "nuʋʋu reːpu ʋast̪aːʋaː"
