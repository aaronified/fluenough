  - id: "te-0221"
    target: "ముప్పై"
    reading: "muppai"
    ipa: "muppai"
    pos: "other"
    notes:
      - { id: "n1", kind: "note" }
    "examples": [
      {"target": "పాఠ్యపుస్తకంలో ముప్పై పాఠాలు ఉన్నాయి.", "reading": "pāṭhyapustakamlō muppai pāṭhālu unnāyi.", "ipa": "paːʈʰjapust̪akamloː muppai paːʈʰaːlu unnaːji", "bases": [{"word": "పాఠ్యపుస్తకంలో", "base": "పాఠ్యపుస్తకం", "reading": "pāṭhyapustakam"}, {"word": "పాఠాలు", "base": "పాఠం", "reading": "pāṭham"}, {"word": "ఉన్నాయి", "base": "ఉండడం", "reading": "uṇḍaḍam"}]},
      {"target": "మా తరగతిలో ముప్పై మంది ఉన్నారు.", "reading": "mā taragatilō muppai mandi unnāru.", "ipa": "maː t̪araɡat̪iloː muppai mand̪i unnaːru", "bases": [{"word": "మా", "base": "మేము", "reading": "mēmu"}, {"word": "తరగతిలో", "base": "తరగతి", "reading": "taragati"}, {"word": "ఉన్నారు", "base": "ఉండడం", "reading": "uṇḍaḍam"}, {"word": "మంది", "base": "మంది", "reading": "mandi"}]}
    ]
