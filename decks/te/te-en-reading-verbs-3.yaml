  "sentences":
  - "text": "నేను ఉదయం ముఖం కడుక్కుంటాను."
    "reading": "nēnu udayaṁ mukhaṁ kaḍukkuṇṭānu."
    "ipa": "neːnu ud̪ajam mukʰam kaɖukkuɳʈaːnu"
  - "text": "నేను ఆరు గంటలకు మేల్కొంటాను."
    "reading": "nēnu āru gaṇṭalaku mēlkoṇṭānu."
    "ipa": "neːnu aːru ɡaɳʈalaku meːlkoɳʈaːnu"
  - "text": "నేను ఈ రోజు పని ముగిస్తాను."
    "reading": "nēnu ī rōju pani mugistānu."
    "ipa": "neːnu iː roːdʒu pani muɡist̪aːnu"
  - "text": "నేను ప్రతిరోజూ ఒక గంట చదువుకుంటాను."
    "reading": "nēnu pratirōjū oka gaṇṭa caduvukuṇṭānu."
    "ipa": "neːnu prat̪iroːdʒuː oka ɡaɳʈa tʃad̪uʋukuɳʈaːnu"
