    modes: [recognition]
    notes: "On doors and gates: ప్రవేశం (pravēśam), entry; నిష్క్రమణ (niṣkramaṇa), exit."
  - id: te-0548
    target: "ధూమపానం నిషేధం"
    native: "no smoking (on signs)"
    reading: "dhūmapānam niṣēdham"
    ipa: "d̪ʱuːmapaːnam niʂeːd̪ʱam"
    pos: "other"
    modes: [recognition]
  - id: te-0549
    target: "మరుగుదొడ్డి"
    native: "toilet (formal)"
    picture: "🚽"
    reading: "marugudoḍḍi"
    ipa: "maruɡud̪oɖɖi"
    pos: "other"
    modes: [recognition]
    notes: "Speakers say బాత్‌రూమ్ (bātrūm) or టాయిలెట్ (ṭāyileṭ)."
