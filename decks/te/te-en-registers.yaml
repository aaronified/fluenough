schema: 1
id: te-en-registers
name: "Bookish Telugu and spoken Telugu"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "For centuries Telugu was written in a bookish style, గ్రాంథికం (grānthikam), far from the spoken వ్యావహారికం (vyāvahārikam). Gidugu Ramamurthy and Gurajada Apparao fought for writing as people speak, and today almost all writing does. Older books, the reading deck among them, are full of the bookish forms: here they are beside today's, with the formal words still seen on signs. Recognition only. Not yet checked by a Telugu speaker: please report any mistake."
tags: [reading, unreviewed]
cards:
  - ref: te-0352
    notes: "On paper and in speeches. In speech Telugu joins with -ఊ (-ū) (నేనూ నువ్వూ (nēnū nuvvū), you and I) or simply lists."
    modes: [recognition]
  - ref: te-0140
    notes: "Formal. Between friends, often థాంక్స్ (thāṅks)."
    modes: [recognition]
  - id: te-0534
    target: "పుస్తకము"
    native: "book; today పుస్తకం (pustakam)"
    reading: "pustakamu"
    ipa: "pust̪akamu"
    pos: "other"
    modes: [recognition]
    notes: "The bookish ending -ము (-mu) is -ం (am) today: గడియారము (gaḍiyāramu), గడియారం (gaḍiyāram), clock."
  - id: te-0535
    target: "చేసెను"
    native: "did; today చేశాడు (cēśāḍu), చేసింది (cēsindi)"
    reading: "cēsenu"
    ipa: "tʃeːsenu"
    pos: "other"
    modes: [recognition]
    notes: "The bookish past ends in -ఎను (-enu) for he, she and it alike."
  - id: te-0536
    target: "వచ్చెను"
    native: "came; today వచ్చాడు (vaccāḍu), వచ్చింది (vaccindi)"
    reading: "vaccenu"
    ipa: "ʋatʃtʃenu"
    pos: "other"
    modes: [recognition]
  - id: te-0537
    target: "అనెను"
    native: "said; today అన్నాడు (annāḍu), అంది (andi)"
    reading: "anenu"
    ipa: "anenu"
    pos: "other"
    modes: [recognition]
  - id: te-0538
    target: "వచ్చిరి"
    native: "they came; today వచ్చారు (vaccāru)"
    reading: "vacciri"
    ipa: "ʋatʃtʃiri"
    pos: "other"
    modes: [recognition]
    notes: "The bookish past for they ends in -ఇరి (-iri)."
  - id: te-0539
    target: "కొట్టినది"
    native: "struck; today కొట్టింది (koṭṭindi)"
    reading: "koṭṭinadi"
    ipa: "koʈʈinad̪i"
    pos: "other"
    modes: [recognition]
    notes: "The bookish -ఇనది (-inadi) is -ఇంది (-indi) today."
  - id: te-0540
    target: "చేయుచున్నాడు"
    native: "is doing; today చేస్తున్నాడు (cēstunnāḍu)"
    reading: "cēyucunnāḍu"
    ipa: "tʃeːjutʃunnaːɖu"
    pos: "other"
    modes: [recognition]
  - id: te-0541
    target: "చేయుచు"
    native: "while doing; today చేస్తూ (cēstū)"
    reading: "cēyucu"
    ipa: "tʃeːjutʃu"
    pos: "other"
    modes: [recognition]
  - id: te-0542
    target: "కలదు"
    native: "there is; today ఉంది (undi)"
    reading: "kaladu"
    ipa: "kalad̪u"
    pos: "other"
    modes: [recognition]
    notes: "Still seen on notices and old signs."
  - id: te-0543
    target: "యొక్క"
    native: "of (bookish)"
    reading: "yokka"
    ipa: "jokka"
    pos: "other"
    modes: [recognition]
    notes: "Today the ending alone does it: రాముని యొక్క పుస్తకము (rāmuni yokka pustakamu) is రాముని పుస్తకం (rāmuni pustakam), Rama's book."
  - id: te-0544
    target: "చెప్పుము"
    native: "tell! (bookish); today చెప్పు (ceppu)"
    reading: "ceppumu"
    ipa: "tʃeppumu"
    pos: "other"
    modes: [recognition]
  - id: te-0545
    target: "జలము"
    native: "water (bookish); today నీళ్ళు (nīḷḷu)"
    picture: "💧"
    reading: "jalamu"
    ipa: "dʒalamu"
    pos: "other"
    modes: [recognition]
    notes: "Books also have నీరు (nīru); people say నీళ్ళు (nīḷḷu)."
  - id: te-0546
    target: "దయచేసి"
    native: "please (formal, written)"
    reading: "dayacēsi"
    ipa: "d̪ajatʃeːsi"
    pos: "other"
    modes: [recognition]
    notes: "On signs and in letters. In speech the polite verb in -ండి (-aṇḍi) is enough: కూర్చోండి (kūrcōṇḍi)."
  - id: te-0547
    target: "ప్రవేశం"
    native: "entry (on signs)"
