schema: 1
id: te-en-registers
name: "Bookish Telugu and spoken Telugu"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "For centuries Telugu was written in a bookish style, గ్రాంథికం (granthikam), far from the spoken వ్యావహారికం (vyavaharikam). Gidugu Ramamurthy and Gurajada Apparao fought for writing as people speak, and today almost all writing does. Older books, the reading deck among them, are full of the bookish forms: here they are beside today's, with the formal words still seen on signs. Recognition only. Not yet checked by a Telugu speaker: please report any mistake."
tags: [reading, unreviewed]
cards:
  - ref: te-0352
    notes: "On paper and in speeches. In speech Telugu joins with -ఊ (నేనూ నువ్వూ, you and I) or simply lists."
    modes: [recognition]
  - ref: te-0140
    notes: "Formal. Between friends, often థాంక్స్ (thanks)."
    modes: [recognition]
  - id: te-0534
    target: "పుస్తకము"
    native: "book; today పుస్తకం"
    reading: "pustakamu"
    pos: "other"
    modes: [recognition]
    notes: "The bookish ending -ము is -ం today: గడియారము, గడియారం, clock."
  - id: te-0535
    target: "చేసెను"
    native: "did; today చేశాడు, చేసింది"
    reading: "chesenu"
    pos: "other"
    modes: [recognition]
    notes: "The bookish past ends in -ఎను for he, she and it alike."
  - id: te-0536
    target: "వచ్చెను"
    native: "came; today వచ్చాడు, వచ్చింది"
    reading: "vacchenu"
    pos: "other"
    modes: [recognition]
  - id: te-0537
    target: "అనెను"
    native: "said; today అన్నాడు, అంది"
    reading: "anenu"
    pos: "other"
    modes: [recognition]
  - id: te-0538
    target: "వచ్చిరి"
    native: "they came; today వచ్చారు"
    reading: "vacchiri"
    pos: "other"
    modes: [recognition]
    notes: "The bookish past for they ends in -ఇరి."
  - id: te-0539
    target: "కొట్టినది"
    native: "struck; today కొట్టింది"
    reading: "kottinadi"
    pos: "other"
    modes: [recognition]
    notes: "The bookish -ఇనది is -ఇంది today."
  - id: te-0540
    target: "చేయుచున్నాడు"
    native: "is doing; today చేస్తున్నాడు"
    reading: "cheyuchunnadu"
    pos: "other"
    modes: [recognition]
  - id: te-0541
    target: "చేయుచు"
    native: "while doing; today చేస్తూ"
    reading: "cheyuchu"
    pos: "other"
    modes: [recognition]
  - id: te-0542
    target: "కలదు"
    native: "there is; today ఉంది"
    reading: "kaladu"
    pos: "other"
    modes: [recognition]
    notes: "Still seen on notices and old signs."
  - id: te-0543
    target: "యొక్క"
    native: "of (bookish)"
    reading: "yokka"
    pos: "other"
    modes: [recognition]
    notes: "Today the ending alone does it: రాముని యొక్క పుస్తకము is రాముని పుస్తకం, Rama's book."
  - id: te-0544
    target: "చెప్పుము"
    native: "tell! (bookish); today చెప్పు"
    reading: "cheppumu"
    pos: "other"
    modes: [recognition]
  - id: te-0545
    target: "జలము"
    native: "water (bookish); today నీళ్ళు"
    reading: "jalamu"
    pos: "other"
    modes: [recognition]
    notes: "Books also have నీరు (niru); people say నీళ్ళు."
  - id: te-0546
    target: "దయచేసి"
    native: "please (formal, written)"
    reading: "dayachesi"
    pos: "other"
    modes: [recognition]
    notes: "On signs and in letters. In speech the polite verb in -ండి is enough: కూర్చోండి."
  - id: te-0547
    target: "ప్రవేశం"
    native: "entry (on signs)"
    reading: "pravesham"
    pos: "other"
    modes: [recognition]
    notes: "On doors and gates: ప్రవేశం, entry; నిష్క్రమణ (nishkramana), exit."
  - id: te-0548
    target: "ధూమపానం నిషేధం"
    native: "no smoking (on signs)"
    reading: "dhumapanam nishedham"
    pos: "other"
    modes: [recognition]
  - id: te-0549
    target: "మరుగుదొడ్డి"
    native: "toilet (formal)"
    reading: "marugudoddi"
    pos: "other"
    modes: [recognition]
    notes: "Speakers say బాత్‌రూమ్ or టాయిలెట్."
