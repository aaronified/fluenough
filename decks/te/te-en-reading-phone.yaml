  "title": "Text messages"
  "sentences":
  - "text": "ఇప్పుడు బిజీగా ఉన్నాను."
    "reading": "ippuḍu bijīgā unnānu."
    "ipa": "ippuɖu bidʒiːɡaː unnaːnu"
  - "text": "బ్యాటరీ చాలా తక్కువ ఉంది."
    "reading": "byāṭarī cālā takkuva undi."
    "ipa": "bjaːʈariː tʃaːlaː t̪akkuʋa und̪i"
  - "text": "రేపు నీకు కాల్ చేస్తాను."
    "reading": "rēpu nīku kāl cēstānu."
    "ipa": "reːpu niːku kaːl tʃeːst̪aːnu"
  - "text": "మెసేజ్ చదివాను."
    "reading": "mesēj cadivānu."
    "ipa": "meseːdʒ tʃad̪iʋaːnu"
