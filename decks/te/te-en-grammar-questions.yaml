schema: 1
id: te-en-grammar-questions
name: "Basic questions"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Yes/no questions with -ఆ, and question words. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: te-0169
    target: "మీరు తెలుగు మాట్లాడతారా?"
    native: "Do you speak Telugu?"
    reading: "miru telugu matladatara?"
    pos: "phrase"
    notes: "-ఆ at the end of the verb makes a yes/no question."
  - id: te-0170
    target: "టీ తాగుతారా?"
    native: "Will you have tea?"
    reading: "ti tagutara?"
    pos: "phrase"
  - id: te-0171
    target: "ఇది ఏమిటి?"
    native: "What is this?"
    reading: "idi emiti?"
    pos: "phrase"
    notes: "The question word goes where the answer would."
  - id: te-0172
    target: "మీరు ఎక్కడికి వెళ్తున్నారు?"
    native: "Where are you going?"
    reading: "miru ekkadiki veltunnaru?"
    pos: "phrase"
    notes: "ఎక్కడికి, 'to where', from ఎక్కడ, 'where'."
  - id: te-0173
    target: "ఆయన ఎవరు?"
    native: "Who is he?"
    reading: "ayana evaru?"
    pos: "phrase"
    notes: "ఆయన is a respectful 'he'; ఆవిడ (avida), a respectful 'she'."
  - id: te-0174
    target: "మీరు ఎప్పుడు వస్తారు?"
    native: "When will you come?"
    reading: "miru eppudu vastaru?"
    pos: "phrase"
  - id: te-0175
    target: "మీరు తెలుగు ఎందుకు నేర్చుకుంటున్నారు?"
    native: "Why are you learning Telugu?"
    reading: "miru telugu enduku nerchukuntunnaru?"
    pos: "phrase"
  - id: te-0176
    target: "మీకు ఎంత మంది పిల్లలు?"
    native: "How many children do you have?"
    reading: "miku enta mandi pillalu?"
    pos: "phrase"
    notes: "ఎంత మంది, 'how many people'."
  - id: te-0177
    target: "ఎలా ఉంది?"
    native: "How is it?"
    reading: "ela undi?"
    pos: "phrase"
  - id: te-0178
    target: "బాగుంది కదా?"
    native: "It's good, isn't it?"
    reading: "bagundi kada?"
    pos: "phrase"
    notes: "కదా at the end asks for agreement."
