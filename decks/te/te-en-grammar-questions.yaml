schema: 1
id: te-en-grammar-questions
name: "Basic questions"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Yes/no questions with -ఆ (-ā), and question words. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: te-0169
    target: "మీరు తెలుగు మాట్లాడతారా?"
    native: "Do you speak Telugu?"
    reading: "mīru telugu māṭlāḍatārā?"
    ipa: "miːru t̪eluɡu maːʈlaːɖat̪aːraː"
    pos: "phrase"
    notes: "-ఆ (-ā) at the end of the verb makes a yes/no question."
  - id: te-0170
    target: "టీ తాగుతారా?"
    native: "Will you have tea?"
    reading: "ṭī tāgutārā?"
    ipa: "ʈiː t̪aːɡut̪aːraː"
    pos: "phrase"
  - id: te-0171
    target: "ఇది ఏమిటి?"
    native: "What is this?"
    reading: "idi ēmiṭi?"
    ipa: "id̪i eːmiʈi"
    pos: "phrase"
    notes: "The question word goes where the answer would."
  - id: te-0172
    target: "మీరు ఎక్కడికి వెళ్తున్నారు?"
    native: "Where are you going?"
    reading: "mīru ekkaḍiki veḷtunnāru?"
    ipa: "miːru ekkaɖiki ʋeɭt̪unnaːru"
    pos: "phrase"
    notes: "ఎక్కడికి (ekkaḍiki), 'to where', from ఎక్కడ (ekkaḍa), 'where'."
  - id: te-0173
    target: "ఆయన ఎవరు?"
    native: "Who is he?"
    reading: "āyana evaru?"
    ipa: "aːjana eʋaru"
    pos: "phrase"
    notes: "ఆయన (āyana) is a respectful 'he'; ఆవిడ (āviḍa), a respectful 'she'."
  - id: te-0174
    target: "మీరు ఎప్పుడు వస్తారు?"
    native: "When will you come?"
    reading: "mīru eppuḍu vastāru?"
    ipa: "miːru eppuɖu ʋast̪aːru"
    pos: "phrase"
  - id: te-0175
    target: "మీరు తెలుగు ఎందుకు నేర్చుకుంటున్నారు?"
    native: "Why are you learning Telugu?"
    reading: "mīru telugu enduku nērcukuṇṭunnāru?"
    ipa: "miːru t̪eluɡu end̪uku neːrtʃukuɳʈunnaːru"
    pos: "phrase"
  - id: te-0176
    target: "మీకు ఎంత మంది పిల్లలు?"
    native: "How many children do you have?"
    reading: "mīku enta mandi pillalu?"
    ipa: "miːku ent̪a mand̪i pillalu"
    pos: "phrase"
    notes: "ఎంత మంది (enta mandi), 'how many people'."
  - id: te-0177
    target: "ఎలా ఉంది?"
    native: "How is it?"
    reading: "elā undi?"
    ipa: "elaː und̪i"
    pos: "phrase"
  - id: te-0178
    target: "బాగుంది కదా?"
    native: "It's good, isn't it?"
    reading: "bāgundi kadā?"
    ipa: "baːɡund̪i kad̪aː"
    pos: "phrase"
    notes: "కదా (kadā) at the end asks for agreement."
