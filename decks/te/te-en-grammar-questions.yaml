schema: 1
id: te-en-grammar-questions
name: "Basic questions"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Yes/no questions with -ఆ, and question words. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: te-en-grammar-questions-0001
    target: "మీరు తెలుగు మాట్లాడతారా?"
    native: "Do you speak Telugu?"
    reading: "miiru telugu maatlaadataaraa?"
    pos: "phrase"
    notes: "-ఆ at the end of the verb makes a yes/no question."
  - id: te-en-grammar-questions-0002
    target: "టీ తాగుతారా?"
    native: "Will you have tea?"
    reading: "tii taagutaaraa?"
    pos: "phrase"
  - id: te-en-grammar-questions-0003
    target: "ఇది ఏమిటి?"
    native: "What is this?"
    reading: "idi eemiti?"
    pos: "phrase"
    notes: "The question word goes where the answer would."
  - id: te-en-grammar-questions-0004
    target: "మీరు ఎక్కడికి వెళ్తున్నారు?"
    native: "Where are you going?"
    reading: "miiru ekkadiki veltunnaaru?"
    pos: "phrase"
    notes: "ఎక్కడికి, 'to where', from ఎక్కడ, 'where'."
  - id: te-en-grammar-questions-0005
    target: "ఆయన ఎవరు?"
    native: "Who is he?"
    reading: "aayana evaru?"
    pos: "phrase"
    notes: "ఆయన is a respectful 'he'; ఆవిడ (aavida), a respectful 'she'."
  - id: te-en-grammar-questions-0006
    target: "మీరు ఎప్పుడు వస్తారు?"
    native: "When will you come?"
    reading: "miiru eppudu vastaaru?"
    pos: "phrase"
  - id: te-en-grammar-questions-0007
    target: "మీరు తెలుగు ఎందుకు నేర్చుకుంటున్నారు?"
    native: "Why are you learning Telugu?"
    reading: "miiru telugu enduku neerchukuntunnaaru?"
    pos: "phrase"
  - id: te-en-grammar-questions-0008
    target: "మీకు ఎంత మంది పిల్లలు?"
    native: "How many children do you have?"
    reading: "miiku enta mandi pillalu?"
    pos: "phrase"
    notes: "ఎంత మంది, 'how many people'."
  - id: te-en-grammar-questions-0009
    target: "ఎలా ఉంది?"
    native: "How is it?"
    reading: "elaa undi?"
    pos: "phrase"
  - id: te-en-grammar-questions-0010
    target: "బాగుంది కదా?"
    native: "It's good, isn't it?"
    reading: "baagundi kadaa?"
    pos: "phrase"
    notes: "కదా at the end asks for agreement."
