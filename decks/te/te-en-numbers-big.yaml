schema: 1
id: te-en-numbers-big
name: "Tens and big numbers"
kind: vocab
theme: numbers-big
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The tens, a hundred, a thousand, lakh and crore, and the halves every market uses. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: te-0221
    target: "ముప్పై"
    native: "30, thirty"
    reading: "muppai"
    ipa: "muppai"
    pos: "other"
    notes: "Unlike Hindi and Bengali, Telugu builds 21 to 99 from parts: 26 is ఇరవై ఆరు (iravai āru), 'twenty six'."
  - id: te-0222
    target: "నలభై"
    native: "40, forty"
    reading: "nalabhai"
    ipa: "nalabʱai"
    pos: "other"
  - id: te-0223
    target: "యాభై"
    native: "50, fifty"
    reading: "yābhai"
    ipa: "jaːbʱai"
    pos: "other"
  - id: te-0224
    target: "అరవై"
    native: "60, sixty"
    reading: "aravai"
    ipa: "araʋai"
    pos: "other"
  - id: te-0225
    target: "డెబ్బై"
    native: "70, seventy"
    reading: "ḍebbai"
    ipa: "ɖebbai"
    pos: "other"
  - id: te-0226
    target: "ఎనభై"
    native: "80, eighty"
    reading: "enabhai"
    ipa: "enabʱai"
    pos: "other"
  - id: te-0227
    target: "తొంభై"
    native: "90, ninety"
    reading: "tombhai"
    ipa: "t̪ombʱai"
    pos: "other"
  - id: te-0228
    target: "వంద"
    native: "100, a hundred"
    reading: "vanda"
    ipa: "ʋand̪a"
    alt_target: ["నూరు"]
    pos: "other"
    notes: "Two hundred is రెండు వందలు (reṇḍu vandalu). With more after it, వందల (vandala): రెండు వందల యాభై (reṇḍu vandala yābhai), 250. Also నూరు (nūru)."
  - id: te-0229
    target: "వెయ్యి"
    native: "1,000, a thousand"
    reading: "veyyi"
    ipa: "ʋejji"
    pos: "other"
    notes: "Two thousand is రెండు వేలు (reṇḍu vēlu); with more after it, వేల (vēla): రెండు వేల ఇరవై (reṇḍu vēla iravai), 2020."
  - id: te-0230
    target: "లక్ష"
    native: "1,00,000, a lakh (a hundred thousand)"
    reading: "lakṣa"
    ipa: "lakʂa"
    pos: "other"
    notes: "Indian numbering counts in lakhs and crores, and places its commas to match: 1,00,000."
  - id: te-0231
    target: "కోటి"
    native: "1,00,00,000, a crore (ten million)"
    reading: "kōṭi"
    ipa: "koːʈi"
    pos: "other"
    notes: "A hundred lakh."
  - id: te-0232
    target: "ఒకటిన్నర"
    native: "1½, one and a half"
    reading: "okaṭinnara"
    ipa: "okaʈinnara"
    pos: "other"
    notes: "-న్నర (-nnara) adds a half: రెండున్నర (reṇḍunnara), 2½; నాలుగున్నర (nālugunnara), 4½."
  - id: te-0233
    target: "రెండున్నర"
    native: "2½, two and a half"
    reading: "reṇḍunnara"
    ipa: "reɳɖunnara"
    pos: "other"
  - id: te-0234
    target: "రెండు వందలు"
    native: "200, two hundred"
    reading: "reṇḍu vandalu"
    ipa: "reɳɖu ʋand̪alu"
    pos: "other"
    notes: "From 200 to 900, hundred is వందలు (vandalu) when nothing follows it."
  - id: te-0235
    target: "రెండు వందల యాభై"
    native: "250, two hundred and fifty"
    reading: "reṇḍu vandala yābhai"
    ipa: "reɳɖu ʋand̪ala jaːbʱai"
    pos: "other"
    notes: "With more after it, వందలు (vandalu) becomes వందల (vandala)."
  - id: te-0236
    target: "నూట యాభై"
    native: "150, a hundred and fifty"
    reading: "nūṭa yābhai"
    ipa: "nuːʈa jaːbʱai"
    pos: "other"
    notes: "With more after it, one hundred is నూట (nūṭa)."
  - id: te-0237
    target: "రెండు వేలు"
    native: "2,000, two thousand"
    reading: "reṇḍu vēlu"
    ipa: "reɳɖu ʋeːlu"
    pos: "other"
    notes: "From 2,000 to 9,000, thousand is వేలు (vēlu) when nothing follows it."
  - id: te-0238
    target: "రెండు వేల ఇరవై"
    native: "2020, two thousand and twenty"
    reading: "reṇḍu vēla iravai"
    ipa: "reɳɖu ʋeːla iraʋai"
    pos: "other"
    notes: "With more after it, వేలు (vēlu) becomes వేల (vēla)."
