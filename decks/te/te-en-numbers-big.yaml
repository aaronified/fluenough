schema: 1
id: te-en-numbers-big
name: "Tens and big numbers"
kind: vocab
theme: numbers-big
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The tens, a hundred, a thousand, lakh and crore, and the halves every market uses. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: te-en-numbers-big-0001
    target: "ముప్పై"
    native: "30, thirty"
    reading: "muppai"
    pos: "other"
    notes: "Unlike Hindi and Bengali, Telugu builds 21 to 99 from parts: 26 is ఇరవై ఆరు (iravai aaru), 'twenty six'."
  - id: te-en-numbers-big-0002
    target: "నలభై"
    native: "40, forty"
    reading: "nalabhai"
    pos: "other"
  - id: te-en-numbers-big-0003
    target: "యాభై"
    native: "50, fifty"
    reading: "yaabhai"
    pos: "other"
  - id: te-en-numbers-big-0004
    target: "అరవై"
    native: "60, sixty"
    reading: "aravai"
    pos: "other"
  - id: te-en-numbers-big-0005
    target: "డెబ్బై"
    native: "70, seventy"
    reading: "debbai"
    pos: "other"
  - id: te-en-numbers-big-0006
    target: "ఎనభై"
    native: "80, eighty"
    reading: "enabhai"
    pos: "other"
  - id: te-en-numbers-big-0007
    target: "తొంభై"
    native: "90, ninety"
    reading: "tombhai"
    pos: "other"
  - id: te-en-numbers-big-0008
    target: "వంద"
    native: "100, a hundred"
    reading: "vanda"
    alt_target: ["నూరు"]
    pos: "other"
    notes: "Two hundred is రెండు వందలు (rendu vandalu). With more after it, వందల: రెండు వందల యాభై, 250. Also నూరు (nuuru)."
  - id: te-en-numbers-big-0009
    target: "వెయ్యి"
    native: "1,000, a thousand"
    reading: "veyyi"
    pos: "other"
    notes: "Two thousand is రెండు వేలు (rendu veelu); with more after it, వేల: రెండు వేల ఇరవై, 2020."
  - id: te-en-numbers-big-0010
    target: "లక్ష"
    native: "1,00,000, a lakh (a hundred thousand)"
    reading: "laksha"
    pos: "other"
    notes: "Indian numbering counts in lakhs and crores, and places its commas to match: 1,00,000."
  - id: te-en-numbers-big-0011
    target: "కోటి"
    native: "1,00,00,000, a crore (ten million)"
    reading: "kooti"
    pos: "other"
    notes: "A hundred lakh."
  - id: te-en-numbers-big-0012
    target: "ఒకటిన్నర"
    native: "1½, one and a half"
    reading: "okatinnara"
    pos: "other"
    notes: "-న్నర adds a half: రెండున్నర (rendunnara), 2½; నాలుగున్నర, 4½."
  - id: te-en-numbers-big-0013
    target: "రెండున్నర"
    native: "2½, two and a half"
    reading: "rendunnara"
    pos: "other"
  - id: te-en-numbers-big-0014
    target: "రెండు వందలు"
    native: "200, two hundred"
    reading: "rendu vandalu"
    pos: "other"
    notes: "From 200 to 900, hundred is వందలు when nothing follows it."
  - id: te-en-numbers-big-0015
    target: "రెండు వందల యాభై"
    native: "250, two hundred and fifty"
    reading: "rendu vandala yaabhai"
    pos: "other"
    notes: "With more after it, వందలు becomes వందల."
  - id: te-en-numbers-big-0016
    target: "నూట యాభై"
    native: "150, a hundred and fifty"
    reading: "nuuta yaabhai"
    pos: "other"
    notes: "With more after it, one hundred is నూట."
  - id: te-en-numbers-big-0017
    target: "రెండు వేలు"
    native: "2,000, two thousand"
    reading: "rendu veelu"
    pos: "other"
    notes: "From 2,000 to 9,000, thousand is వేలు when nothing follows it."
  - id: te-en-numbers-big-0018
    target: "రెండు వేల ఇరవై"
    native: "2020, two thousand and twenty"
    reading: "rendu veela iravai"
    pos: "other"
    notes: "With more after it, వేలు becomes వేల."
