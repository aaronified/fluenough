  - id: "te-0202"
    target: "రెండు"
    reading: "reṇḍu"
    ipa: "reɳɖu"
    pos: "other"
    "examples": [
      {"target": "అతను రెండు సెట్లు కొన్నాడు.", "reading": "atanu reṇḍu seṭlu konnāḍu.", "ipa": "at̪anu reɳɖu seʈlu konnaːɖu", "bases": [{"word": "సెట్లు", "base": "సెట్", "reading": "seṭ"}, {"word": "కొన్నాడు", "ref": "te-0641"}]},
      {"target": "నాకు రెండు లీటర్లు కావాలి.", "reading": "nāku reṇḍu līṭarlu kāvāli.", "ipa": "naːku reɳɖu liːʈarlu kaːʋaːli", "bases": [{"word": "లీటర్లు", "base": "లీటరు", "reading": "līṭaru"}, {"word": "కావాలి", "ref": "te-0646"}, {"word": "నాకు", "ref": "te-0593"}]}
    ]
  - id: "te-0203"
