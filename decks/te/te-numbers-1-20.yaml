      {"target": "ఈ కోడ్ నాలుగు అంకెలు.", "reading": "ī kōḍ nālugu aṅkelu.", "ipa": "iː koːɖ naːluɡu aŋkelu", "bases": [{"word": "అంకెలు", "base": "అంకె", "reading": "aṅke"}]}
    ]
