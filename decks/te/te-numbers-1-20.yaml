    ipa: "eːɖu"
    pos: "other"
    "examples": [
      {"target": "ఏడు ఖండాలు ఉన్నాయి.", "reading": "ēḍu khaṇḍālu unnāyi.", "ipa": "eːɖu kʰaɳɖaːlu unnaːji", "bases": [{"word": "ఖండాలు", "base": "ఖండం", "reading": "khaṇḍam"}, {"word": "ఉన్నాయి", "base": "ఉండడం", "reading": "uṇḍaḍam"}]},
      {"target": "అతను రోజూ ఏడు గంటలకు మేల్కొంటాడు.", "reading": "atanu rōjū ēḍu gaṇṭalaku mēlkoṇṭāḍu.", "ipa": "at̪anu roːdʒuː eːɖu ɡaɳʈalaku meːlkoɳʈaːɖu", "bases": [{"word": "గంటలకు", "base": "గంట", "reading": "gaṇṭa"}, {"word": "మేల్కొంటాడు", "base": "మేల్కొనడం", "reading": "mēlkonaḍam"}]}
    ]
