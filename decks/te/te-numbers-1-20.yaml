  - id: "te-0206"
    target: "ఆరు"
    reading: "āru"
    ipa: "aːru"
    pos: "other"
    "examples": [
      {"target": "నేను ఆరు గంటలకు మేల్కొంటాను.", "reading": "nēnu āru gaṇṭalaku mēlkoṇṭānu.", "ipa": "neːnu aːru ɡaɳʈalaku meːlkoɳʈaːnu", "bases": [{"word": "గంటలకు", "base": "గంట", "reading": "gaṇṭa"}, {"word": "మేల్కొంటాను", "base": "మేల్కొనడం", "reading": "mēlkonaḍam"}]},
      {"target": "ఆ కేసు ఆరు నెలలుగా నడుస్తోంది.", "reading": "ā kēsu āru nelalugā naḍustōndi.", "ipa": "aː keːsu aːru nelaluɡaː naɖust̪oːnd̪i", "bases": [{"word": "నెలలుగా", "base": "నెల", "reading": "nela"}, {"word": "నడుస్తోంది", "base": "నడవడం", "reading": "naḍavaḍaṁ"}]}
    ]
  - id: "te-0207"
