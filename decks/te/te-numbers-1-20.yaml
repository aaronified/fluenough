      {"target": "చివరి బస్సు రాత్రి పదకొండు గంటలకు వస్తుంది.", "reading": "civari bassu rātri padakoṇḍu gaṇṭalaku vastundi.", "ipa": "tʃiʋari bassu raːt̪ri pad̪akoɳɖu ɡaɳʈalaku ʋast̪und̪i", "bases": [{"word": "గంటలకు", "ref": "te-0313"}, {"word": "వస్తుంది", "ref": "te-0623"}]}
