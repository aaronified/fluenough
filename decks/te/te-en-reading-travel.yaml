  "title": "Trip plan"
  "sentences":
  - "text": "మా పర్యటన వచ్చే వారం మొదలవుతుంది."
    "reading": "mā paryaṭana vaccē vāraṁ modalavutundi."
    "ipa": "maː parjaʈana ʋatʃtʃeː ʋaːram mod̪alaʋut̪und̪i"
  - "text": "మా బస రెండు రాత్రులు."
    "reading": "mā basa reṇḍu rātrulu."
    "ipa": "maː basa reɳɖu raːt̪rulu"
  - "text": "షెడ్యూల్ ప్రకారం మేము ఎనిమిది గంటలకు బయలుదేరుతాము."
    "reading": "ṣeḍyūl prakāraṁ mēmu enimidi gaṇṭalaku bayaludērutāmu."
    "ipa": "ʂeɖjuːl prakaːram meːmu enimid̪i ɡaɳʈalaku bajalud̪eːrut̪aːmu"
  - "text": "ఈ పర్యటనలో మేము మూడు నగరాలు చూస్తాము."
    "reading": "ī paryaṭanalō mēmu mūḍu nagarālu cūstāmu."
    "ipa": "iː parjaʈanaloː meːmu muːɖu naɡaraːlu tʃuːst̪aːmu"
