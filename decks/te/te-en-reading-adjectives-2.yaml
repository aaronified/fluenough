  "sentences":
  - "text": "ఇది విశాలమైన గది."
    "reading": "idi viśālamaina gadi."
    "ipa": "id̪i ʋiʃaːlamaina ɡad̪i"
  - "text": "ఈ గది చాలా ప్రకాశవంతంగా ఉంది."
    "reading": "ī gadi cālā prakāśavantaṅgā undi."
    "ipa": "iː ɡad̪i tʃaːlaː prakaːʃaʋant̪aŋɡaː und̪i"
  - "text": "నెలవారీ అద్దె ఎంత?"
    "reading": "nelavārī adde enta?"
    "ipa": "nelaʋaːriː ad̪d̪e ent̪a"
  - "text": "ముందస్తు చెల్లింపు ఉంది."
    "reading": "mundastu cellimpu undi."
    "ipa": "mund̪ast̪u tʃellimpu und̪i"
