  "title": "Rule sheet"
  "sentences":
  - "text": "గంట కొట్టినప్పుడు ఈ పని చేయండి."
    "reading": "gaṇṭa koṭṭinappuḍu ī pani cēyaṇḍi."
    "ipa": "ɡaɳʈa koʈʈinappuɖu iː pani tʃeːjaɳɖi"
  - "text": "బడికి వెళ్ళేటప్పుడు తలుపు మూయండి."
    "reading": "baḍiki veḷḷēṭappuḍu talupu mūyaṇḍi."
    "ipa": "baɖiki ʋeɭɭeːʈappuɖu t̪alupu muːjaɳɖi"
  - "text": "వర్షం పడినప్పుడు ఇంట్లో ఉండండి."
    "reading": "varṣaṁ paḍinappuḍu iṇṭlō uṇḍaṇḍi."
    "ipa": "ʋarʂam paɖinappuɖu iɳʈloː uɳɖaɳɖi"
  - "text": "నేను తినేటప్పుడు టీవీ చూడను."
    "reading": "nēnu tinēṭappuḍu ṭīvī cūḍanu."
    "ipa": "neːnu t̪ineːʈappuɖu ʈiːʋiː tʃuːɖanu"
