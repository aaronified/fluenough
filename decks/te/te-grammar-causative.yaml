    - word: "te-2107"
      forms: { "causative": "పారేయించడం" }
      readings: { "causative": "pārēyiñcaḍaṁ" }
    - word: "te-2108"
      forms: { "causative": "ఎత్తించడం" }
      readings: { "causative": "ettiñcaḍaṁ" }
    # Causative of an intransitive verb: 'to cool (something)'.
    - word: "te-1151"
      forms: { "causative": "చల్లబరచడం" }
      readings: { "causative": "callabaraccaḍaṁ" }
    # Sense: to stop (something). Not a -ించు form.
    - word: "te-1152"
      forms: { "causative": "ఆపివేయడం" }
      readings: { "causative": "āpivēyaḍaṁ" }
    # Same as te-0824, with the sense 'to have (someone) wash'.
    - word: "te-2300"
      forms: { "causative": "కడిగించడం" }
