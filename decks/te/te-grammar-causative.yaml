schema: 1
id: "te-grammar-causative"
part: "core"
kind: "rules"
language: { code: "te", iso639_3: "tel", name: "Telugu", script: "telugu", tts: "te-IN", icon: "తె" }
license: "CC-BY-SA-4.0"
authors:
  - { name: "Fluenough contributors" }
tags: ["grammar", "unreviewed"]
table:
  applies_to:
    pos: ["verb"]
    except: ["te-0646", "te-0831", "te-0842", "te-1401", "te-1402", "te-1529", "te-1622", "te-2105", "te-2355", "te-0247", "te-0282", "te-0297", "te-0460", "te-0463", "te-0474", "te-0532", "te-0651", "te-1047", "te-1146", "te-1147", "te-1148", "te-1149", "te-1150"]
  slots: ["causative"]
  rows:
    # Suppletive: the causative of లేచు is లేపు (wake up, lift). Not a -ించు form.
    - word: "te-0441"
      forms: { "causative": "లేపడం" }
      readings: { "causative": "lēpaḍaṁ" }
    # Uses -బెట్టు (-beṭṭu), not -ించు: to put (someone) to bed.
    - word: "te-0450"
      forms: { "causative": "పడుకోబెట్టడం" }
      readings: { "causative": "paḍukōbeṭṭaḍaṁ" }
    - word: "te-0621"
      forms: { "causative": "చేయించడం" }
      readings: { "causative": "cēyiñcaḍaṁ" }
    # To make (someone) go, as a sending: the usual causative is పంపు (send).
    - word: "te-0622"
      forms: { "causative": "పంపించడం" }
      readings: { "causative": "pampiñcaḍaṁ" }
    # Irregular: the causative of రావు is రప్పించు, not a regular -ించు form.
    - word: "te-0623"
      forms: { "causative": "రప్పించడం" }
      readings: { "causative": "rappiñcaḍaṁ" }
    - word: "te-0624"
      forms: { "causative": "తినిపించడం" }
      readings: { "causative": "tinipiñcaḍaṁ" }
    - word: "te-0625"
      forms: { "causative": "తాగించడం" }
      readings: { "causative": "tāgiñcaḍaṁ" }
    # The causative of 'see' is 'show'.
    - word: "te-0626"
      forms: { "causative": "చూపించడం" }
      readings: { "causative": "cūpiñcaḍaṁ" }
    # Also: to make (something) audible, or to play for someone.
    - word: "te-0627"
      forms: { "causative": "వినిపించడం" }
      readings: { "causative": "vinipiñcaḍaṁ" }
    - word: "te-0628"
      forms: { "causative": "చెప్పించడం" }
      readings: { "causative": "ceppiñcaḍaṁ" }
    # Vowel change: అడుగు becomes అడిగించు.
    - word: "te-0629"
      forms: { "causative": "అడిగించడం" }
      readings: { "causative": "aḍigiñcaḍaṁ" }
    # Irregular: ఇవ్వు becomes ఇప్పించు.
    - word: "te-0630"
      forms: { "causative": "ఇప్పించడం" }
      readings: { "causative": "ippiñcaḍaṁ" }
    # Periphrastic: to make (someone) take (something).
    - word: "te-0631"
      forms: { "causative": "తీసుకునేలా చేయడం" }
      readings: { "causative": "tīsukunēlā cēyaḍaṁ" }
    # Irregular: తేవు becomes తెప్పించు.
    - word: "te-0632"
      forms: { "causative": "తెప్పించడం" }
      readings: { "causative": "teppiñcaḍaṁ" }
    # The causative of 'be' is 'keep' (also the verb of te-0831).
    - word: "te-0633"
      forms: { "causative": "ఉంచడం" }
      readings: { "causative": "uñcaḍaṁ" }
    # Uses -బెట్టు: to seat (someone).
    - word: "te-0634"
      forms: { "causative": "కూర్చోబెట్టడం" }
      readings: { "causative": "kūrcōbeṭṭaḍaṁ" }
    # Uses -బెట్టు: to make (someone) stand.
    - word: "te-0635"
      forms: { "causative": "నిలబెట్టడం" }
      readings: { "causative": "nilabeṭṭaḍaṁ" }
    # Also: to lead or to drive (a vehicle).
    - word: "te-0636"
      forms: { "causative": "నడిపించడం" }
      readings: { "causative": "naḍipiñcaḍaṁ" }
    - word: "te-0637"
      forms: { "causative": "ఆడించడం" }
      readings: { "causative": "āḍiñcaḍaṁ" }
    # Vowel change: చదువు becomes చదివించు.
    - word: "te-0638"
      forms: { "causative": "చదివించడం" }
      readings: { "causative": "cadiviñcaḍaṁ" }
    - word: "te-0639"
      forms: { "causative": "రాయించడం" }
      readings: { "causative": "rāyiñcaḍaṁ" }
    # Irregular: to put (someone) to sleep. Not a -ించు form.
    - word: "te-0640"
      forms: { "causative": "నిద్రపుచ్చడం" }
      readings: { "causative": "nidrapuccaḍaṁ" }
    - word: "te-0641"
      forms: { "causative": "కొనిపించడం" }
      readings: { "causative": "konipiñcaḍaṁ" }
    - word: "te-0642"
      forms: { "causative": "అమ్మించడం" }
      readings: { "causative": "ammiñcaḍaṁ" }
    - word: "te-0643"
      forms: { "causative": "వండించడం" }
      readings: { "causative": "vaṇḍiñcaḍaṁ" }
    - word: "te-0644"
      forms: { "causative": "మాట్లాడించడం" }
      readings: { "causative": "māṭlāḍiñcaḍaṁ" }
    # Irregular: 'to teach' is నేర్పు, the causative of నేర్చు (to learn).
    - word: "te-0645"
      forms: { "causative": "నేర్పించడం" }
      readings: { "causative": "nērpiñcaḍaṁ" }
    # Sense: to let (someone) know. The causative of తెలియు.
    - word: "te-0647"
      forms: { "causative": "తెలియజేయడం" }
      readings: { "causative": "teliyajēyaḍaṁ" }
    # Irregular: ఆగు becomes ఆపు (to stop something).
    - word: "te-0648"
      forms: { "causative": "ఆపడం" }
      readings: { "causative": "āpaḍaṁ" }
    # Periphrastic: to make (people) meet, as in introducing them.
    - word: "te-0649"
      forms: { "causative": "కలిసేలా చేయడం" }
      readings: { "causative": "kalisēlā cēyaḍaṁ" }
    # To have (something) sent.
    - word: "te-0650"
      forms: { "causative": "పంపించడం" }
      readings: { "causative": "pampiñcaḍaṁ" }
    - word: "te-0821"
      forms: { "causative": "పాడించడం" }
      readings: { "causative": "pāḍiñcaḍaṁ" }
    # To make (someone) laugh.
    - word: "te-0822"
      forms: { "causative": "నవ్వించడం" }
      readings: { "causative": "navviñcaḍaṁ" }
    # Irregular: ఏడ్చు becomes ఏడిపించు (to make cry).
    - word: "te-0823"
      forms: { "causative": "ఏడిపించడం" }
      readings: { "causative": "ēḍipiñcaḍaṁ" }
    # Vowel change: కడుగు becomes కడిగించు.
    - word: "te-0824"
      forms: { "causative": "కడిగించడం" }
      readings: { "causative": "kaḍigiñcaḍaṁ" }
    # Unsure: check with a Telugu speaker.
    - word: "te-0825"
      forms: { "causative": "తెరిపించడం" }
      readings: { "causative": "teripiñcaḍaṁ" }
    - word: "te-0826"
      forms: { "causative": "మూయించడం" }
      readings: { "causative": "mūyiñcaḍaṁ" }
    # To put (someone) on, or to load (something).
    - word: "te-0827"
      forms: { "causative": "ఎక్కించడం" }
      readings: { "causative": "ekkiñcaḍaṁ" }
    # Irregular: దిగు becomes దింపు (to get someone down, drop off).
    - word: "te-0828"
      forms: { "causative": "దింపడం" }
      readings: { "causative": "dimpaḍaṁ" }
    # Periphrastic: to make (someone) hold (something).
    - word: "te-0829"
      forms: { "causative": "పట్టుకునేలా చేయడం" }
      readings: { "causative": "paṭṭukunēlā cēyaḍaṁ" }
    - word: "te-0830"
      forms: { "causative": "పెట్టించడం" }
      readings: { "causative": "peṭṭiñcaḍaṁ" }
    # To have (someone) taught.
    - word: "te-0832"
      forms: { "causative": "నేర్పించడం" }
      readings: { "causative": "nērpiñcaḍaṁ" }
    # Unsure: to make (someone) forget. Check with a Telugu speaker.
    - word: "te-0833"
      forms: { "causative": "మరిపించడం" }
      readings: { "causative": "maripiñcaḍaṁ" }
    # Uses -పజేయు (-pajēyu) for 'make (someone) think'.
    - word: "te-0834"
      forms: { "causative": "ఆలోచింపజేయడం" }
      readings: { "causative": "ālōcimpajēyaḍaṁ" }
    - word: "te-0835"
      forms: { "causative": "వెతికించడం" }
      readings: { "causative": "vetikiñcaḍaṁ" }
    - word: "te-0836"
      forms: { "causative": "తీయించడం" }
      readings: { "causative": "tīyiñcaḍaṁ" }
    # Same spelling as 'to fry' (te-1622 is excepted); the sense comes from the sentence.
    - word: "te-0837"
      forms: { "causative": "వేయించడం" }
      readings: { "causative": "vēyiñcaḍaṁ" }
    - word: "te-0838"
      forms: { "causative": "కొట్టించడం" }
      readings: { "causative": "koṭṭiñcaḍaṁ" }
    # Irregular: 'to knock (something) down'. Not a -ించు form.
    - word: "te-0839"
      forms: { "causative": "పడగొట్టడం" }
      readings: { "causative": "paḍagoṭṭaḍaṁ" }
    # Unsure: 'to make (someone) stop'. Check with a Telugu speaker.
    - word: "te-0840"
      forms: { "causative": "ఆపించడం" }
      readings: { "causative": "āpiñcaḍaṁ" }
    # Irregular: తిరుగు becomes తిప్పు (to turn something).
    - word: "te-0841"
      forms: { "causative": "తిప్పడం" }
      readings: { "causative": "tippaḍaṁ" }
    # Also heard: పరుగెత్తించడం.
    - word: "te-0843"
      forms: { "causative": "పరిగెత్తించడం" }
      readings: { "causative": "parigettiñcaḍaṁ" }
    # To convince (someone).
    - word: "te-0844"
      forms: { "causative": "నమ్మించడం" }
      readings: { "causative": "nammiñcaḍaṁ" }
    # Irregular: 'to make (something) fly', as a kite.
    - word: "te-0845"
      forms: { "causative": "ఎగరేయడం" }
      readings: { "causative": "egarēyaḍaṁ" }
    # Unsure: check with a Telugu speaker.
    - word: "te-0846"
      forms: { "causative": "ఈదించడం" }
      readings: { "causative": "īdiñcaḍaṁ" }
    - word: "te-0847"
      forms: { "causative": "కోయించడం" }
      readings: { "causative": "kōyiñcaḍaṁ" }
    - word: "te-0848"
      forms: { "causative": "లాగించడం" }
      readings: { "causative": "lāgiñcaḍaṁ" }
    # To have (someone) called or sent for.
    - word: "te-0849"
      forms: { "causative": "పిలిపించడం" }
      readings: { "causative": "pilipiñcaḍaṁ" }
    # Causative of కలుపు (to mix something).
    - word: "te-0850"
      forms: { "causative": "కలిపించడం" }
      readings: { "causative": "kalipiñcaḍaṁ" }
    - word: "te-0851"
      forms: { "causative": "నింపించడం" }
      readings: { "causative": "nimpiñcaḍaṁ" }
    - word: "te-0852"
      forms: { "causative": "తుడిపించడం" }
      readings: { "causative": "tuḍipiñcaḍaṁ" }
    # Periphrastic: to make (someone) share (something).
    - word: "te-1339"
      forms: { "causative": "పంచుకునేలా చేయడం" }
      readings: { "causative": "pañcukunēlā cēyaḍaṁ" }
    - word: "te-1400"
      forms: { "causative": "బేరమాడించడం" }
      readings: { "causative": "bēramāḍiñcaḍaṁ" }
    # Periphrastic: to make (someone) choose.
    - word: "te-1403"
      forms: { "causative": "ఎంచుకునేలా చేయడం" }
      readings: { "causative": "eñcukunēlā cēyaḍaṁ" }
    # Irregular: ఇవ్వు becomes ఇప్పించు: to have (something) given back.
    - word: "te-1404"
      forms: { "causative": "తిరిగి ఇప్పించడం" }
      readings: { "causative": "tirigi ippiñcaḍaṁ" }
    # Uses -పజేయు: to make (someone) try.
    - word: "te-1405"
      forms: { "causative": "ప్రయత్నింపజేయడం" }
      readings: { "causative": "prayatnimpajēyaḍaṁ" }
    # Sense: to take (someone) to a doctor.
    - word: "te-1530"
      forms: { "causative": "చూపించడం" }
      readings: { "causative": "cūpiñcaḍaṁ" }
    # Sense: to bring (a fever or an illness) down.
    - word: "te-1531"
      forms: { "causative": "తగ్గించడం" }
      readings: { "causative": "taggiñcaḍaṁ" }
    # Periphrastic: to let (someone) rest.
    - word: "te-1532"
      forms: { "causative": "విశ్రాంతి తీసుకునేలా చేయడం" }
      readings: { "causative": "viśrāṁti tīsukunēlā cēyaḍaṁ" }
    # Periphrastic: to make (someone) cough.
    - word: "te-1534"
      forms: { "causative": "దగ్గేలా చేయడం" }
      readings: { "causative": "daggēlā cēyaḍaṁ" }
    # Periphrastic: to make (someone) sneeze.
    - word: "te-1535"
      forms: { "causative": "తుమ్మేలా చేయడం" }
      readings: { "causative": "tummēlā cēyaḍaṁ" }
    # Periphrastic: to help (someone) recover.
    - word: "te-1536"
      forms: { "causative": "కోలుకునేలా చేయడం" }
      readings: { "causative": "kōlukunēlā cēyaḍaṁ" }
    # Irregular: కారు becomes కార్చు (to let something drip).
    - word: "te-1537"
      forms: { "causative": "కార్చడం" }
      readings: { "causative": "kārcaḍaṁ" }
    # To have (someone) admitted, to school or to hospital.
    - word: "te-1538"
      forms: { "causative": "చేర్పించడం" }
      readings: { "causative": "cērpiñcaḍaṁ" }
    # Sense shift: 'to hurt (someone)'.
    - word: "te-1539"
      forms: { "causative": "బాధించడం" }
      readings: { "causative": "bādhiñcaḍaṁ" }
    # Causative of ఉడకబెట్టు (to boil): to have (something) boiled.
    - word: "te-1621"
      forms: { "causative": "ఉడకబెట్టించడం" }
      readings: { "causative": "uḍakabeṭṭiñcaḍaṁ" }
    # Uses -పజేయు: to make (someone) play an instrument.
    - word: "te-1914"
      forms: { "causative": "వాయింపజేయడం" }
      readings: { "causative": "vāyimpajēyaḍaṁ" }
    - word: "te-1915"
      forms: { "causative": "గీయించడం" }
      readings: { "causative": "gīyiñcaḍaṁ" }
    # To help (someone) win.
    - word: "te-1923"
      forms: { "causative": "గెలిపించడం" }
      readings: { "causative": "gelipiñcaḍaṁ" }
    # Unsure: check with a Telugu speaker.
    - word: "te-2100"
      forms: { "causative": "ఊడ్పించడం" }
      readings: { "causative": "ūḍpiñcaḍaṁ" }
    # Vowel change: ఉతకడం becomes ఉతికించు.
    - word: "te-2101"
