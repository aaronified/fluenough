    ipa: "upaːd̪ʱjaːjuɖu"
    alt_target: ["టీచర్"]
    pos: "noun"
    notes: "A woman teacher is ఉపాధ్యాయురాలు (upādhyāyurālu). In speech, often టీచర్ (ṭīcar)."
  - id: te-0403
    target: "దుకాణదారు"
