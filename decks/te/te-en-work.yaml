description: "Jobs, the workplace, and how to ask and say what someone does. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: te-0400
    target: "ఉద్యోగం"
    native: "job (employment)"
    reading: "udyogam"
    pos: "noun"
    notes: "పని (pani) is work of any kind; ఉద్యోగం is a job."
  - ref: te-0197
  - id: te-0401
    target: "ఆఫీసు"
    native: "office"
    reading: "afisu"
    alt_target: ["ఆఫీస్", "కార్యాలయం"]
    pos: "noun"
    notes: "Formally కార్యాలయం (karyalayam)."
  - id: te-0402
    target: "ఉపాధ్యాయుడు"
    native: "teacher"
    reading: "upadhyayudu"
    alt_target: ["టీచర్"]
    pos: "noun"
    notes: "A woman teacher is ఉపాధ్యాయురాలు (upadhyayuralu). In speech, often టీచర్ (tichar)."
  - id: te-0403
    target: "దుకాణదారు"
    native: "shopkeeper"
    reading: "dukanadaru"
    pos: "noun"
  - id: te-0404
    target: "డ్రైవర్"
    native: "driver"
    reading: "draivar"
    pos: "noun"
  - id: te-0405
    target: "ఇంజనీర్"
    native: "engineer"
    reading: "injanir"
    alt_target: ["ఇంజినీర్"]
    pos: "noun"
  - id: te-0406
    target: "లాయర్"
    native: "lawyer"
    reading: "layar"
    alt_target: ["న్యాయవాది"]
    pos: "noun"
    notes: "Formally న్యాయవాది (nyayavadi)."
  - id: te-0407
    target: "నర్సు"
    native: "nurse"
    reading: "narsu"
    alt_target: ["నర్స్"]
    pos: "noun"
  - id: te-0408
    target: "రైతు"
    native: "farmer"
    reading: "raitu"
    pos: "noun"
  - id: te-0409
    target: "వంటవాడు"
    native: "cook"
    reading: "vantavadu"
    pos: "noun"
    notes: "A cook in a home is often వంటమనిషి (vantamanishi)."
  - id: te-0410
    target: "రచయిత"
    native: "writer"
    reading: "rachayita"
    pos: "noun"
    notes: "A woman writer is రచయిత్రి (rachayitri)."
  - id: te-0411
    target: "విలేకరి"
    native: "journalist; reporter"
    reading: "vilekari"
    pos: "noun"
  - ref: te-0365
  - ref: te-0364
  - id: te-0412
    target: "విద్యార్థి"
    native: "student"
    reading: "vidyarthi"
    pos: "noun"
    notes: "A woman student is విద్యార్థిని (vidyarthini). నేను విద్యార్థిని, from anyone, is 'I'm a student'."
  - id: te-0413
    target: "సెలవు"
    native: "day off; holiday; leave"
    reading: "selavu"
    pos: "noun"
    notes: "ఈరోజు నాకు సెలవు, I have the day off today."
  - id: te-0414
    target: "జీతం"
    native: "salary; pay"
    reading: "jitam"
    pos: "noun"
  - id: te-0415
    target: "వ్యాపారం"
    native: "business; trade"
    reading: "vyaparam"
    pos: "noun"
  - id: te-0416
    target: "మీరు ఏం పని చేస్తారు?"
    native: "What do you do (for a living)?"
    reading: "miru em pani chestaru?"
    pos: "phrase"
  - id: te-0417
    target: "నేను టీచర్‌ని."
    native: "I'm a teacher."
    reading: "nenu ticharni."
    pos: "phrase"
    notes: "With నేను a noun takes -ని, and no verb is needed."
  - id: te-0418
    target: "మీరు ఎక్కడ పని చేస్తారు?"
    native: "Where do you work?"
    reading: "miru ekkada pani chestaru?"
    pos: "phrase"
  - id: te-0419
    target: "నేను ఒక ఆఫీసులో పని చేస్తాను."
    native: "I work in an office."
    reading: "nenu oka afisulo pani chestanu."
    pos: "phrase"
    notes: "A man and a woman say the same: only he has a form of his own, and she and it share one."
