    reading: "raitu"
    ipa: "rait̪u"
    pos: "noun"
  - id: te-0409
    target: "వంటవాడు"
    native: "cook"
    picture: "🧑‍🍳"
    reading: "vaṇṭavāḍu"
    ipa: "ʋaɳʈaʋaːɖu"
    pos: "noun"
    notes: "A cook in a home is often వంటమనిషి (vaṇṭamaniṣi)."
  - id: te-0410
    target: "రచయిత"
