cards:
  - id: te-0400
    target: "ఉద్యోగం"
    native: "job (employment)"
    reading: "udyōgam"
    ipa: "ud̪joːɡam"
    pos: "noun"
    notes: "పని (pani) is work of any kind; ఉద్యోగం (udyōgam) is a job."
  - ref: te-0197
  - id: te-0401
    target: "ఆఫీసు"
    native: "office"
    picture: "🏢"
    reading: "āfīsu"
    ipa: "aːfiːsu"
    alt_target: ["ఆఫీస్", "కార్యాలయం"]
    pos: "noun"
    notes: "Formally కార్యాలయం (kāryālayam)."
  - id: te-0402
    target: "ఉపాధ్యాయుడు"
    native: "teacher"
