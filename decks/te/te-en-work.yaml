  - ref: te-0365
  - ref: te-0364
  - id: te-0412
    target: "విద్యార్థి"
    native: "student"
    picture: "🧑‍🎓"
    reading: "vidyārthi"
    ipa: "ʋid̪jaːrt̪ʰi"
    pos: "noun"
    notes: "A woman student is విద్యార్థిని (vidyārthini). నేను విద్యార్థిని (nēnu vidyārthini), from anyone, is 'I'm a student'."
  - id: te-0413
    target: "సెలవు"
    native: "day off; holiday; leave"
    reading: "selavu"
    ipa: "selaʋu"
    pos: "noun"
    notes: "ఈరోజు నాకు సెలవు (īrōju nāku selavu), I have the day off today."
  - id: te-0414
    target: "జీతం"
    native: "salary; pay"
    reading: "jītam"
    ipa: "dʒiːt̪am"
    pos: "noun"
  - id: te-0415
    target: "వ్యాపారం"
    native: "business; trade"
    reading: "vyāpāram"
    ipa: "ʋjaːpaːram"
    pos: "noun"
  - id: te-0416
    target: "మీరు ఏం పని చేస్తారు?"
    native: "What do you do (for a living)?"
    reading: "mīru ēm pani cēstāru?"
    ipa: "miːru eːm pani tʃeːst̪aːru"
    pos: "phrase"
  - id: te-0417
    target: "నేను టీచర్‌ని."
    native: "I'm a teacher."
    reading: "nēnu ṭīcarni."
    ipa: "neːnu ʈiːtʃarni"
    pos: "phrase"
    notes: "With నేను (nēnu) a noun takes -ని (-ni), and no verb is needed."
  - id: te-0418
    target: "మీరు ఎక్కడ పని చేస్తారు?"
    native: "Where do you work?"
    reading: "mīru ekkaḍa pani cēstāru?"
    ipa: "miːru ekkaɖa pani tʃeːst̪aːru"
    pos: "phrase"
  - id: te-0419
    target: "నేను ఒక ఆఫీసులో పని చేస్తాను."
    native: "I work in an office."
    reading: "nēnu oka āfīsulō pani cēstānu."
    ipa: "neːnu oka aːfiːsuloː pani tʃeːst̪aːnu"
    pos: "phrase"
    notes: "A man and a woman say the same: only he has a form of his own, and she and it share one."
