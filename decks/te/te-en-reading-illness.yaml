  "sentences":
  - "text": "ఈ మాత్ర రోజుకు రెండు తీసుకోండి."
    "reading": "ī mātra rōjuku reṇḍu tīsukōṇḍi."
    "ipa": "iː maːt̪ra roːdʒuku reɳɖu t̪iːsukoːɳɖi"
  - "text": "సిరప్ రోజుకు మూడు సార్లు తీసుకోండి."
    "reading": "sirap rōjuku mūḍu sārlu tīsukōṇḍi."
    "ipa": "sirap roːdʒuku muːɖu saːrlu t̪iːsukoːɳɖi"
  - "text": "ఎక్కువ విశ్రాంతి తీసుకోండి."
    "reading": "ekkuva viśrāṁti tīsukōṇḍi."
    "ipa": "ekkuʋa ʋiʃraːnt̪i t̪iːsukoːɳɖi"
  - "text": "పిల్లలకు దూరంగా ఉంచండి."
    "reading": "pillalaku dūraṅgā uñcaṇḍi."
    "ipa": "pillalaku d̪uːraŋɡaː uɲtʃaɳɖi"
