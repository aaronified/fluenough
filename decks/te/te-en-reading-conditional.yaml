"passages":
- "id": "te-late-train"
  "title": "Late-train message"
  "sentences":
  - "text": "రైలు ఆలస్యం అయితే నాకు కాల్ చేయండి."
    "reading": "railu ālasyaṁ ayitē nāku kāl cēyaṇḍi."
    "ipa": "railu aːlasjam ajit̪eː naːku kaːl tʃeːjaɳɖi"
  - "text": "రైలు ఆలస్యంగా వస్తోంది."
    "reading": "railu ālasyaṅgā vastōndi."
    "ipa": "railu aːlasjaŋɡaː ʋast̪oːnd̪i"
  - "text": "ఎక్స్‌ప్రెస్‌లో వెళ్తే త్వరగా చేరుకుంటాం."
    "reading": "ekspreslō veḷtē tvaragā cērukuṇṭāṁ."
    "ipa": "ekspresloː ʋeɭt̪eː t̪ʋaraɡaː tʃeːrukuɳʈaːm"
  - "text": "డిస్‌ప్లే మీద రైలు ఆలస్యం అని ఉంది."
    "reading": "ḍisplē mīda railu ālasyaṁ ani undi."
    "ipa": "ɖispleː miːd̪a railu aːlasjam ani und̪i"
  "questions":
  - "id": "te-8320"
    "prompt":
      "en": "What should the reader do if the train is late?"
    "options":
    - "en": "Call the writer"
    - "en": "Wait at the station"
    - "en": "Cancel the trip"
    "answer": 1
  - "id": "te-8321"
    "prompt":
      "en": "The train is coming late."
    "answer": true
  - "id": "te-8322"
    "prompt":
      "en": "What does the message say about going by express?"
    "options":
    - "en": "It is slow"
    - "en": "It gets you there quickly"
    - "en": "It is cancelled"
    "answer": 2
