schema: 1
id: te-en-script-conjuncts
name: "Telugu conjuncts"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Two consonants with no vowel between them are joined: the second is written below the first, as a small form (vattu). Doubled consonants are very common in Telugu."
tags: [beginner, unreviewed, script]
cards:
  - id: te-en-script-conjuncts-0001
    target: "క్క"
    native: "kk (double k)"
    reading: "kka"
    notes: "క with its vattu below: the k is held longer. కుక్క (kukka, dog)."
  - id: te-en-script-conjuncts-0002
    target: "గ్గ"
    native: "gg (double g)"
    reading: "gga"
    notes: "గ doubled: ముగ్గు (muggu, rangoli)."
  - id: te-en-script-conjuncts-0003
    target: "చ్చ"
    native: "chch (double ch)"
    reading: "chcha"
    notes: "చ doubled: వచ్చాను (vachchaanu, I came)."
  - id: te-en-script-conjuncts-0004
    target: "ట్ట"
    native: "tt, curled back (double t)"
    reading: "tta"
    notes: "ట doubled: పట్టు (pattu, silk)."
  - id: te-en-script-conjuncts-0005
    target: "డ్డ"
    native: "dd, curled back (double d)"
    reading: "dda"
    notes: "డ doubled: అడ్డం (addam, across; in the way)."
  - id: te-en-script-conjuncts-0006
    target: "త్త"
    native: "tt, on the teeth (double t)"
    reading: "tta"
    notes: "త doubled: అత్త (atta, aunt)."
  - id: te-en-script-conjuncts-0007
    target: "ద్ద"
    native: "dd, on the teeth (double d)"
    reading: "dda"
    notes: "ద doubled: పెద్ద (pedda, big)."
  - id: te-en-script-conjuncts-0008
    target: "న్న"
    native: "nn (double n)"
    reading: "nna"
    notes: "న doubled: అన్న (anna, elder brother)."
  - id: te-en-script-conjuncts-0009
    target: "ప్ప"
    native: "pp (double p)"
    reading: "ppa"
    notes: "ప doubled: పప్పు (pappu, lentils)."
  - id: te-en-script-conjuncts-0010
    target: "మ్మ"
    native: "mm (double m)"
    reading: "mma"
    notes: "మ doubled: అమ్మ (amma, mother)."
  - id: te-en-script-conjuncts-0011
    target: "ల్ల"
    native: "ll (double l)"
    reading: "lla"
    notes: "ల doubled: ఇల్లు (illu, house)."
  - id: te-en-script-conjuncts-0012
    target: "ళ్ళ"
    native: "ll, curled back (double l)"
    reading: "lla"
    notes: "ళ doubled: నీళ్ళు (niillu, water)."
  - id: te-en-script-conjuncts-0013
    target: "య్య"
    native: "yy (double y)"
    reading: "yya"
    notes: "య doubled: చెయ్యి (cheyyi, hand)."
  - id: te-en-script-conjuncts-0014
    target: "వ్వ"
    native: "vv (double v)"
    reading: "vva"
    notes: "వ doubled: ఇవ్వండి (ivvandi, please give)."
  - id: te-en-script-conjuncts-0015
    target: "క్ర"
    native: "k + the r-vattu"
    reading: "kra"
    notes: "ర after a consonant is written below it as the r-vattu: క్రీడ (kriida, sport)."
  - id: te-en-script-conjuncts-0016
    target: "ప్ర"
    native: "p + the r-vattu"
    reading: "pra"
    notes: "The r-vattu below ప: ప్రేమ (preema, love)."
  - id: te-en-script-conjuncts-0017
    target: "త్ర"
    native: "t + the r-vattu"
    reading: "tra"
    notes: "The r-vattu below త: రాత్రి (raatri, night)."
  - id: te-en-script-conjuncts-0018
    target: "శ్ర"
    native: "sh + the r-vattu"
    reading: "shra"
    notes: "The r-vattu below శ: శ్రమ (shrama, labour)."
  - id: te-en-script-conjuncts-0019
    target: "వ్య"
    native: "v + the y-vattu"
    reading: "vya"
    notes: "య after a consonant is written below and to the right of it as the y-vattu: వ్యాపారం (vyaapaaram, business)."
  - id: te-en-script-conjuncts-0020
    target: "ద్య"
    native: "d + the y-vattu"
    reading: "dya"
    notes: "The y-vattu below ద: విద్యార్థి (vidyaarthi, student)."
  - id: te-en-script-conjuncts-0021
    target: "క్ష"
    native: "k + sh"
    reading: "ksha"
    notes: "క and ష joined: లక్ష (laksha, a hundred thousand)."
  - id: te-en-script-conjuncts-0022
    target: "స్త"
    native: "s + t"
    reading: "sta"
    notes: "స and త joined: పుస్తకం (pustakam, book)."
  - id: te-en-script-conjuncts-0023
    target: "స్థ"
    native: "s + th"
    reading: "stha"
    notes: "స and థ joined: స్థలం (sthalam, place)."
  - id: te-en-script-conjuncts-0024
    target: "ష్ట"
    native: "sh + curled-back t"
    reading: "shta"
    notes: "ష and ట joined: ఇష్టం (ishtam, liking)."
