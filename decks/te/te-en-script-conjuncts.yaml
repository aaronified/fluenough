schema: 1
id: te-en-script-conjuncts
name: "Telugu conjuncts"
kind: vocab
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Two consonants with no vowel between them are joined: the second is written below the first, as a small form (vattu). Doubled consonants are very common in Telugu."
tags: [beginner, unreviewed, script]
cards:
  - id: te-0086
    target: "క్క"
    native: "kk (double k)"
    reading: "kka"
    modes: [recognition, production]
    notes: "క with its vattu below: the k is held longer. కుక్క (kukka, dog). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  - id: te-0087
    target: "గ్గ"
    native: "gg (double g)"
    reading: "gga"
    modes: [recognition, production]
    notes: "గ doubled: ముగ్గు (muggu, rangoli). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
