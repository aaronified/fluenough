- id: "te-recipe-card"
  title: "Recipe card"
  sentences:
  - text: "పొయ్యి మీద గిన్నె పెట్టండి."
    reading: "poyyi mīda ginne peṭṭaṇḍi."
    ipa: "pojji miːd̪a ɡinne peʈʈaɳɖi"
  - text: "నూనె వేయండి."
    reading: "nūne vēyaṇḍi."
    ipa: "nuːne ʋeːjaɳɖi"
  - text: "ఉల్లిపాయ, వెల్లుల్లి కోయండి."
    reading: "ullipāya, vellulli kōyaṇḍi."
    ipa: "ullipaːja ʋellulli koːjaɳɖi"
  - text: "బాగా కలపండి."
    reading: "bāgā kalapaṇḍi."
    ipa: "baːɡaː kalapaɳɖi"
