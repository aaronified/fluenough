cards:
  - id: "te-4500"
    target: "పర్యావరణం"
    reading: "paryāvaraṇam"
    ipa: "parjaːʋaraɳam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "బడిలో పర్యావరణం గురించి చదువుతారు.", reading: "baḍilō paryāvaraṇam guriñci caduvutāru.", ipa: "baɖiloː parjaːʋaraɳam ɡuriɲtʃi tʃad̪uʋut̪aːru", bases: [{ word: "బడిలో", ref: "te-0764" }, { word: "చదువుతారు", ref: "te-0638" }] }
      - { target: "ఈ రోజు పర్యావరణ దినోత్సవం.", reading: "ī rōju paryāvaraṇa dinōtsavam.", ipa: "iː roːdʒu parjaːʋaraɳa d̪inoːt̪saʋam" }
  - ref: "te-2629"
  - ref: "te-1113"
  - ref: "te-1118"
  - id: "te-4525"
    target: "వాయువు"
    reading: "vāyuvu"
    ipa: "ʋaːjuʋu"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "వాయువులు", reading: "vāyuvulu" }] }
    examples:
      - { target: "మొక్కలకు కర్బన వాయువు అవసరం.", reading: "mokkalaku karbana vāyuvu avasaram.", ipa: "mokkalaku karbana ʋaːjuʋu aʋasaram", bases: [{ word: "మొక్కలకు", ref: "te-1903" }] }
      - { target: "కర్మాగారం నుంచి విష వాయువులు వస్తున్నాయి.", reading: "karmāgāram nuñci viṣa vāyuvulu vastunnāyi.", ipa: "karmaːɡaːram nuɲtʃi ʋiʂa ʋaːjuʋulu ʋast̪unnaːji", bases: [{ word: "వాయువులు", ref: "te-4525" }, { word: "వస్తున్నాయి", ref: "te-0623" }] }
  - id: "te-4526"
    target: "ఆక్సిజన్"
    reading: "āksijan"
    ipa: "aːksidʒan"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "చెట్లు ఆక్సిజన్ ఇస్తాయి.", reading: "ceṭlu āksijan istāyi.", ipa: "tʃeʈlu aːksidʒan ist̪aːji", bases: [{ word: "చెట్లు", ref: "te-2600" }, { word: "ఇస్తాయి", ref: "te-0630" }] }
      - { target: "ఎత్తైన ప్రాంతాల్లో ఆక్సిజన్ తక్కువగా ఉంటుంది.", reading: "ettaina prāntāllō āksijan takkuvagā uṇṭundi.", ipa: "et̪t̪aina praːnt̪aːlloː aːksidʒan t̪akkuʋaɡaː uɳʈund̪i", bases: [{ word: "ప్రాంతాల్లో", ref: "te-3012" }, { word: "ఉంటుంది", ref: "te-0633" }] }
