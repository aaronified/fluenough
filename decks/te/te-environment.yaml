    examples:
      - { target: "సాయంత్రం మేము ఉద్యానవనానికి వెళ్తాము.", reading: "sāyantram mēmu udyānavanāniki veḷtāmu.", ipa: "saːjant̪ram meːmu ud̪jaːnaʋanaːniki ʋeɭt̪aːmu", bases: [{ word: "ఉద్యానవనానికి", ref: "te-4509" }, { word: "వెళ్తాము", ref: "te-0622" }] }
      - { target: "ఈ ఉద్యానవనంలో వందల మొక్కలు ఉన్నాయి.", reading: "ī udyānavanamlō vandala mokkalu unnāyi.", ipa: "iː ud̪jaːnaʋanamloː ʋand̪ala mokkalu unnaːji", bases: [{ word: "ఉద్యానవనంలో", ref: "te-4509" }, { word: "మొక్కలు", ref: "te-1903" }, { word: "ఉన్నాయి", ref: "te-0633" }] }
