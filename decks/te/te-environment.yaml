  - id: "te-4501"
    target: "కాలుష్యం"
    reading: "kāluṣyam"
    ipa: "kaːluʂjam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ఈ పట్నంలో కాలుష్యం ఎక్కువగా ఉంది.", reading: "ī paṭnamlō kāluṣyam ekkuvagā undi.", ipa: "iː paʈnamloː kaːluʂjam ekkuʋaɡaː und̪i", bases: [{ word: "పట్నంలో", ref: "te-0778" }, { word: "ఉంది", ref: "te-0633" }] }
      - { target: "కాలుష్యం వల్ల దగ్గు వస్తుంది.", reading: "kāluṣyam valla daggu vastundi.", ipa: "kaːluʂjam ʋalla d̪aɡɡu ʋast̪und̪i", bases: [{ word: "వస్తుంది", ref: "te-0623" }] }
  - id: "te-4514"
    target: "భూతాపం"
    reading: "bhūtāpam"
    ipa: "bʱuːt̪aːpam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "భూతాపం వల్ల వాతావరణం మారుతోంది.", reading: "bhūtāpam valla vātāvaraṇam mārutōndi.", ipa: "bʱuːt̪aːpam ʋalla ʋaːt̪aːʋaraɳam maːrut̪oːnd̪i", bases: [{ word: "మారుతోంది", ref: "te-2348" }] }
      - { target: "భూతాపం గురించి టీవీలో వింటారు.", reading: "bhūtāpam guriñci ṭīvīlō viṇṭāru.", ipa: "bʱuːt̪aːpam ɡuriɲtʃi ʈiːʋiːloː ʋiɳʈaːru", bases: [{ word: "టీవీలో", ref: "te-0875" }, { word: "వింటారు", ref: "te-0627" }] }
  - id: "te-4506"
    target: "పునర్వినియోగం"
    reading: "punarviniyōgam"
    ipa: "punarʋinijoːɡam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ఈ పునర్వినియోగం వల్ల డబ్బు ఆదా అవుతుంది.", reading: "ī punarviniyōgam valla ḍabbu ādā avutundi.", ipa: "iː punarʋinijoːɡam ʋalla ɖabbu aːd̪aː aʋut̪und̪i", bases: [{ word: "అవుతుంది", ref: "te-0646" }] }
      - { target: "పునర్వినియోగం అంటే వస్తువులను మళ్ళీ వాడటం.", reading: "punarviniyōgam aṇṭē vastuvulanu maḷḷī vāḍaṭam.", ipa: "punarʋinijoːɡam aɳʈeː ʋast̪uʋulanu maɭɭiː ʋaːɖaʈam", bases: [{ word: "వస్తువులను", ref: "te-0890" }, { word: "వాడటం", ref: "te-2327" }] }
  - id: "te-4520"
    target: "రీసైక్లింగ్"
    reading: "rīsaikliṅg"
    ipa: "riːsaikliŋɡ"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ఈ కంపెనీ ప్లాస్టిక్ రీసైక్లింగ్ చేస్తుంది.", reading: "ī kampenī plāsṭik rīsaikliṅg cēstundi.", ipa: "iː kampeniː plaːsʈik riːsaikliŋɡ tʃeːst̪und̪i", bases: [{ word: "చేస్తుంది", ref: "te-0621" }] }
      - { target: "పాత కాగితాల రీసైక్లింగ్ గురించి పాఠం చదివాం.", reading: "pāta kāgitāla rīsaikliṅg guriñci pāṭham cadivām.", ipa: "paːt̪a kaːɡit̪aːla riːsaikliŋɡ ɡuriɲtʃi paːʈʰam tʃad̪iʋaːm", bases: [{ word: "కాగితాల", ref: "te-0867" }, { word: "చదివాం", ref: "te-0638" }] }
  - ref: "te-0902"
  - id: "te-4521"
    target: "చెత్తకుండీ"
    reading: "cettakuṇḍī"
    ipa: "tʃet̪t̪akuɳɖiː"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "చెత్తకుండీలు", reading: "cettakuṇḍīlu" }] }
    examples:
      - { target: "ఇంటి బయట చెత్తకుండీ ఉంది.", reading: "iṇṭi bayaṭa cettakuṇḍī undi.", ipa: "iɳʈi bajaʈa tʃet̪t̪akuɳɖiː und̪i", bases: [{ word: "ఇంటి", ref: "te-0195" }, { word: "ఉంది", ref: "te-0633" }] }
      - { target: "చెత్తకుండీ ఖాళీ చేయండి.", reading: "cettakuṇḍī khāḷī cēyaṇḍi.", ipa: "tʃet̪t̪akuɳɖiː kʰaːɭiː tʃeːjaɳɖi", bases: [{ word: "చేయండి", ref: "te-0621" }] }
  - id: "te-4503"
    target: "వ్యర్థం"
    reading: "vyartham"
    ipa: "ʋjart̪ʰam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "వ్యర్థాలు", reading: "vyarthālu" }] }
    examples:
      - { target: "ఇంటి వ్యర్థాలను రోజూ బయట పారేస్తారు.", reading: "iṇṭi vyarthālanu rōjū bayaṭa pārēstāru.", ipa: "iɳʈi ʋjart̪ʰaːlanu roːdʒuː bajaʈa paːreːst̪aːru", bases: [{ word: "ఇంటి", ref: "te-0195" }, { word: "వ్యర్థాలను", ref: "te-4503" }, { word: "పారేస్తారు", ref: "te-2107" }] }
      - { target: "వ్యర్థం ఎక్కడ వేయాలో మీకు తెలుసా?", reading: "vyartham ekkaḍa vēyālō mīku telusā?", ipa: "ʋjart̪ʰam ekkaɖa ʋeːjaːloː miːku t̪elusaː", bases: [{ word: "వేయాలో", ref: "te-0837" }, { word: "తెలుసా", ref: "te-0651" }] }
  - id: "te-4504"
    target: "ప్లాస్టిక్"
    reading: "plāsṭik"
    ipa: "plaːsʈik"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "ప్లాస్టిక్‌లు", reading: "plāsṭiklu" }] }
    examples:
      - { target: "బజారులో ప్లాస్టిక్ సంచులు ఇస్తారు.", reading: "bajārulō plāsṭik sañculu istāru.", ipa: "badʒaːruloː plaːsʈik saɲtʃulu ist̪aːru", bases: [{ word: "బజారులో", ref: "te-0773" }, { word: "సంచులు", ref: "te-0868" }, { word: "ఇస్తారు", ref: "te-0630" }] }
      - { target: "నేలపై ప్లాస్టిక్ బాటిల్ పడి ఉంది.", reading: "nēlapai plāsṭik bāṭil paḍi undi.", ipa: "neːlapai plaːsʈik baːʈil paɖi und̪i", bases: [{ word: "నేలపై", ref: "te-2610" }, { word: "పడి", ref: "te-0839" }, { word: "ఉంది", ref: "te-0633" }] }
  - id: "te-4505"
    target: "పొగ"
    reading: "poga"
    ipa: "poɡa"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "పొగలు", reading: "pogalu" }] }
    examples:
      - { target: "పొగ ఆకాశంలోకి వెళ్తుంది.", reading: "poga ākāśamlōki veḷtundi.", ipa: "poɡa aːkaːʃamloːki ʋeɭt̪und̪i", bases: [{ word: "ఆకాశంలోకి", ref: "te-1114" }, { word: "వెళ్తుంది", ref: "te-0622" }] }
      - { target: "ఫ్యాక్టరీ నుంచి దట్టమైన పొగలు వస్తున్నాయి.", reading: "phyākṭarī nuñci daṭṭamaina pogalu vastunnāyi.", ipa: "pʰjaːkʈariː nuɲtʃi d̪aʈʈamaina poɡalu ʋast̪unnaːji", bases: [{ word: "పొగలు", ref: "te-4505" }, { word: "వస్తున్నాయి", ref: "te-0623" }] }
  - id: "te-4502"
    target: "శుభ్రత"
    reading: "śubhrata"
    ipa: "ʃubʱrat̪a"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ఈ పట్నంలో వీధుల శుభ్రత బాగా ఉంది.", reading: "ī paṭnamlō vīdhula śubhrata bāgā undi.", ipa: "iː paʈnamloː ʋiːd̪ʱula ʃubʱrat̪a baːɡaː und̪i", bases: [{ word: "పట్నంలో", ref: "te-0778" }, { word: "వీధుల", ref: "te-0438" }, { word: "ఉంది", ref: "te-0633" }] }
      - { target: "శుభ్రత కోసం చెత్తను చెత్తకుండీలో వేయండి.", reading: "śubhrata kōsam cettanu cettakuṇḍīlō vēyaṇḍi.", ipa: "ʃubʱrat̪a koːsam tʃet̪t̪anu tʃet̪t̪akuɳɖiːloː ʋeːjaɳɖi", bases: [{ word: "చెత్తను", ref: "te-0902" }, { word: "చెత్తకుండీలో", ref: "te-4521" }, { word: "వేయండి", ref: "te-0837" }] }
  - ref: "te-0962"
  - id: "te-4516"
    target: "రక్షణ"
    reading: "rakṣaṇa"
    ipa: "rakʂaɳa"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "అడవుల రక్షణ మన బాధ్యత.", reading: "aḍavula rakṣaṇa mana bādhyata.", ipa: "aɖaʋula rakʂaɳa mana baːd̪ʱjat̪a", bases: [{ word: "అడవుల", ref: "te-0786" }] }
      - { target: "ఈ చెరువుకు రక్షణ గోడ ఉంది.", reading: "ī ceruvuku rakṣaṇa gōḍa undi.", ipa: "iː tʃeruʋuku rakʂaɳa ɡoːɖa und̪i", bases: [{ word: "చెరువుకు", ref: "te-2612" }, { word: "గోడ", ref: "te-2112" }, { word: "ఉంది", ref: "te-0633" }] }
  - id: "te-4517"
    target: "సంరక్షణ"
    reading: "samrakṣaṇa"
    ipa: "samrakʂaɳa"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "జంతువుల సంరక్షణ కోసం ఈ అడవిని చూస్తున్నారు.", reading: "jantuvula samrakṣaṇa kōsam ī aḍavini cūstunnāru.", ipa: "dʒant̪uʋula samrakʂaɳa koːsam iː aɖaʋini tʃuːst̪unnaːru", bases: [{ word: "జంతువుల", ref: "te-4511" }, { word: "అడవిని", ref: "te-0786" }, { word: "చూస్తున్నారు", ref: "te-0626" }] }
      - { target: "ఈ అడవి సంరక్షణ ఎవరి బాధ్యత?", reading: "ī aḍavi samrakṣaṇa evari bādhyata?", ipa: "iː aɖaʋi samrakʂaɳa eʋari baːd̪ʱjat̪a" }
  - id: "te-4518"
    target: "అవగాహన"
    reading: "avagāhana"
    ipa: "aʋaɡaːhana"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ప్రజల్లో ఇప్పుడు మంచి అవగాహన ఉంది.", reading: "prajallō ippuḍu mañci avagāhana undi.", ipa: "pradʒalloː ippuɖu maɲtʃi aʋaɡaːhana und̪i", bases: [{ word: "ప్రజల్లో", ref: "te-3515" }, { word: "ఉంది", ref: "te-0633" }] }
      - { target: "పిల్లలకు అవగాహన ఇవ్వడానికి బొమ్మల పుస్తకం చదివారు.", reading: "pillalaku avagāhana ivvaḍāniki bommala pustakam cadivāru.", ipa: "pillalaku aʋaɡaːhana iʋʋaɖaːniki bommala pust̪akam tʃad̪iʋaːru", bases: [{ word: "ఇవ్వడానికి", ref: "te-0630" }, { word: "బొమ్మల", ref: "te-0898" }, { word: "చదివారు", ref: "te-0638" }] }
  - id: "te-4519"
    target: "ఇంధనం"
    reading: "indhanam"
    ipa: "ind̪ʱanam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "ఇంధనాలు", reading: "indhanālu" }] }
    examples:
      - { target: "కారులో ఇంధనం ఉంది.", reading: "kārulō indhanam undi.", ipa: "kaːruloː ind̪ʱanam und̪i", bases: [{ word: "కారులో", ref: "te-0879" }, { word: "ఉంది", ref: "te-0633" }] }
      - { target: "ఇంధనం ఆదా చేయడం మంచిది.", reading: "indhanam ādā cēyaḍam mañcidi.", ipa: "ind̪ʱanam aːd̪aː tʃeːjaɖam maɲtʃid̪i", bases: [{ word: "చేయడం", ref: "te-0621" }] }
  - id: "te-4527"
    target: "విద్యుత్తు"
    reading: "vidyuttu"
