      - { target: "పచ్చదనం కళ్ళకు హాయిగా ఉంటుంది.", reading: "paccadanam kaḷḷaku hāyigā uṇṭundi.", ipa: "patʃtʃad̪anam kaɭɭaku haːjiɡaː uɳʈund̪i", bases: [{ word: "ఉంటుంది", ref: "te-0633" }] }
