      - { target: "మంచి పంట కోసం సమయానికి నీళ్ళు పెట్టాలి.", reading: "mañci paṇṭa kōsam samayāniki nīḷḷu peṭṭāli.", ipa: "maɲtʃi paɳʈa koːsam samajaːniki niːɭɭu peʈʈaːli", bases: [{ word: "పెట్టాలి", ref: "te-0830" }] }
