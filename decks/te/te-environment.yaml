    examples:
      - { target: "రైతు పొలంలో ఎరువు వేస్తాడు.", reading: "raitu polamlō eruvu vēstāḍu.", ipa: "rait̪u polamloː eruʋu ʋeːst̪aːɖu", bases: [{ word: "పొలంలో", ref: "te-0781" }, { word: "వేస్తాడు", ref: "te-0837" }] }
      - { target: "ఎరువు వేసిన చెట్లు పెద్దగా ఉన్నాయి.", reading: "eruvu vēsina ceṭlu peddagā unnāyi.", ipa: "eruʋu ʋeːsina tʃeʈlu ped̪d̪aɡaː unnaːji", bases: [{ word: "చెట్లు", ref: "te-2600" }, { word: "వేసిన", ref: "te-0837" }, { word: "ఉన్నాయి", ref: "te-0633" }] }
