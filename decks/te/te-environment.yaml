      - { target: "కాలువలో చెత్త వేయకండి.", reading: "kāluvalō cetta vēyakaṇḍi.", ipa: "kaːluʋaloː tʃet̪t̪a ʋeːjakaɳɖi", bases: [{ word: "కాలువలో", ref: "te-4508" }, { word: "వేయకండి", ref: "te-0837" }] }
      - { target: "వర్షం పడితే కాలువ నీరు రోడ్డు మీదకు వస్తుంది.", reading: "varṣam paḍitē kāluva nīru rōḍḍu mīdaku vastundi.", ipa: "ʋarʂam paɖit̪eː kaːluʋa niːru roːɖɖu miːd̪aku ʋast̪und̪i", bases: [{ word: "పడితే", ref: "te-0839" }, { word: "వస్తుంది", ref: "te-0623" }] }
  - id: "te-4509"
