  "sentences":
  - "text": "మా కూతురు పెళ్ళి ఆదివారం జరుగుతుంది."
    "reading": "mā kūturu peḷḷi ādivāraṁ jarugutundi."
    "ipa": "maː kuːt̪uru peɭɭi aːd̪iʋaːram dʒaruɡut̪und̪i"
  - "text": "మీరు అందరూ వచ్చి ఆశీర్వాదం ఇవ్వండి."
    "reading": "mīru andarū vacci āśīrvādaṁ ivvaṇḍi."
    "ipa": "miːru and̪aruː ʋatʃtʃi aːʃiːrʋaːd̪am iʋʋaɳɖi"
  - "text": "వివాహం ఉదయం ఎనిమిది గంటలకు మండపంలో జరుగుతుంది."
    "reading": "vivāhaṁ udayaṁ enimidi gaṇṭalaku maṇḍapamlō jarugutundi."
    "ipa": "ʋiʋaːham ud̪ajam enimid̪i ɡaɳʈalaku maɳɖapamloː dʒaruɡut̪und̪i"
  - "text": "పెళ్ళి తర్వాత విందు ఉంటుంది."
    "reading": "peḷḷi tarvāta vindu uṇṭundi."
    "ipa": "peɭɭi t̪arʋaːt̪a ʋind̪u uɳʈund̪i"
