schema: 1
id: te-en-market
name: "Market"
kind: vocab
theme: market
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Asking the price, bargaining, paying: what a market stall needs. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: te-0239
    target: "ఎంత?"
    native: "How much is it?"
    reading: "enta?"
    pos: "phrase"
    notes: "Also ఇది ఎంత? (idi enta?), how much is this?"
  - id: te-0240
    target: "ధర"
    native: "price"
    reading: "dhara"
    pos: "noun"
  - id: te-0241
    target: "రూపాయి"
    native: "rupee"
    reading: "ruupaayi"
    pos: "noun"
    notes: "More than one: రూపాయలు (ruupaayalu). వంద రూపాయలు, a hundred rupees."
  - id: te-0242
    target: "డబ్బులు"
    native: "money"
    reading: "dabbulu"
    pos: "noun"
  - id: te-0243
    target: "చిల్లర"
    native: "change; small notes and coins"
    reading: "chillara"
    pos: "noun"
    notes: "చిల్లర ఉందా? Do you have change?"
  - id: te-0244
    target: "చాలా ఎక్కువ!"
    native: "That's too much!"
    reading: "chaalaa ekkuva!"
    pos: "phrase"
    notes: "ఎక్కువ (ekkuva) is 'more, too much'; its opposite is తక్కువ (takkuva), 'less'."
  - id: te-0245
    target: "కొంచెం తగ్గించండి."
    native: "Please lower it a little."
    reading: "konchem tagginchandi."
    pos: "phrase"
    tags: ["polite"]
    notes: "The polite way to bargain. Bargaining is expected at markets, not in shops with fixed prices."
  - id: te-0246
    target: "దుకాణం"
    native: "shop"
    reading: "dukaanam"
    pos: "noun"
    notes: "In speech also షాపు (shaapu)."
  - id: te-0247
    target: "ఇవ్వండి"
    native: "please give (me)"
    reading: "ivvandi"
    pos: "verb"
    tags: ["polite"]
    notes: "ఒక కిలో ఇవ్వండి, a kilo, please."
  - id: te-0248
    target: "కిలో"
    native: "kilo"
    reading: "kiloo"
    pos: "noun"
    notes: "అర కిలో (ara kiloo), half a kilo."
  - id: te-0249
    target: "ఇంకేమీ వద్దు."
    native: "Nothing else."
    reading: "inkeemii vaddu."
    pos: "phrase"
    notes: "వద్దు (vaddu) is 'don't want, no need'."
