cards:
  - id: "te-2600"
    target: "చెట్టు"
    reading: "ceṭṭu"
    ipa: "t͡ɕeʈːu"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "చెట్లు", reading: "ceṭlu" }] }
    examples:
      - { target: "మా ఇంటి ముందు పెద్ద చెట్టు ఉంది.", reading: "mā iṇṭi mundu pedda ceṭṭu undi.", bases: [{ word: "ఉంది", ref: "te-0633" }] }
      - { target: "ఈ చెట్టు మీద చాలా పక్షులు ఉన్నాయి.", reading: "ī ceṭṭu mīda cālā pakṣulu unnāyi.", bases: [{ word: "ఉన్నాయి", ref: "te-0633" }] }
    synonyms:
      - { id: "mranu", word: "మ్రాను", reading: "mrānu", source: "https://en.wiktionary.org/wiki/చెట్టు" }
      - { id: "padapamu", word: "పాదపము", reading: "pādapamu", source: "https://en.wiktionary.org/wiki/చెట్టు" }
      - { id: "vrksamu", word: "వృక్షము", reading: "vṛkṣamu", source: "https://en.wiktionary.org/wiki/చెట్టు" }
      - { id: "sakhi", word: "శాఖి", reading: "śākhi", source: "https://en.wiktionary.org/wiki/చెట్టు" }
  - id: "te-2601"
    target: "ఆకు"
    reading: "āku"
    ipa: "aːku"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "ఆకులు", reading: "ākulu" }] }
    examples:
      - { target: "ఈ ఆకు ఆకుపచ్చగా ఉంది.", reading: "ī āku ākupaccagā undi.", bases: [{ word: "ఉంది", ref: "te-0633" }] }
      - { target: "అరటి ఆకులో భోజనం పెడతారు.", reading: "araṭi ākulō bhōjanam peḍatāru.", bases: [{ word: "పెడతారు", ref: "te-0830" }] }
    synonyms:
      - { id: "patramu", word: "పత్రము", reading: "patramu", source: "https://en.wiktionary.org/wiki/ఆకు" }
    senses:
      - { id: "leaf", pos: "noun", source: "https://en.wiktionary.org/wiki/ఆకు" }
      - { id: "paper", pos: "noun", source: "https://en.wiktionary.org/wiki/ఆకు" }
  - id: "te-2602"
    target: "కొమ్మ"
    reading: "komma"
    ipa: "komːa"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "కొమ్మలు", reading: "kommalu" }] }
    examples:
      - { target: "ఈ కొమ్మ చాలా పొడవుగా ఉంది.", reading: "ī komma cālā poḍavugā undi.", bases: [{ word: "ఉంది", ref: "te-0633" }] }
      - { target: "పక్షి చెట్టు కొమ్మ మీద కూర్చుంది.", reading: "pakṣi ceṭṭu komma mīda kūrcundi." }
    synonyms:
      - { id: "sakha", word: "శాఖ", reading: "śākha", source: "https://en.wiktionary.org/wiki/కొమ్మ" }
  - id: "te-2603"
    target: "వేరు"
    reading: "vēru"
    ipa: "ʋeːɾu"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "వేర్లు", reading: "vērlu" }] }
    examples:
      - { target: "చెట్టు వేర్లు నేలలోకి లోతుగా వెళ్తాయి.", reading: "ceṭṭu vērlu nēlalōki lōtugā veḷtāyi.", bases: [{ word: "వెళ్తాయి", ref: "te-0622" }] }
      - { target: "ఈ మొక్క వేరు చాలా చిన్నది.", reading: "ī mokka vēru cālā cinnadi." }
    synonyms:
      - { id: "modalu", word: "మొదలు", reading: "modalu", source: "https://en.wiktionary.org/wiki/వేరు" }
      - { id: "mulamu", word: "మూలము", reading: "mūlamu", source: "https://en.wiktionary.org/wiki/వేరు" }
  - id: "te-2604"
    target: "విత్తనం"
    reading: "vittanam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "విత్తనాలు", reading: "vittanālu" }] }
    examples:
      - { target: "రైతు పొలంలో విత్తనాలు వేస్తాడు.", reading: "raitu polamlō vittanālu vēstāḍu.", bases: [{ word: "వేస్తాడు", ref: "te-0837" }] }
      - { target: "ఈ విత్తనం నుంచి మొక్క వస్తుంది.", reading: "ī vittanam nuñci mokka vastundi.", bases: [{ word: "వస్తుంది", ref: "te-0623" }] }
  - id: "te-2605"
    target: "రాయి"
    reading: "rāyi"
    ipa: "ɾaːji"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "రాళ్ళు", reading: "rāḷḷu" }] }
    examples:
      - { target: "దారిలో పెద్ద రాయి ఉంది.", reading: "dārilō pedda rāyi undi.", bases: [{ word: "ఉంది", ref: "te-0633" }] }
      - { target: "పిల్లవాడు రాయి విసిరాడు.", reading: "pillavāḍu rāyi visirāḍu.", bases: [{ word: "విసిరాడు", ref: "te-2319" }] }
  - id: "te-2606"
    target: "బండ"
    reading: "baṇḍa"
    ipa: "baɳɖa"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "బండలు", reading: "baṇḍalu" }] }
    examples:
      - { target: "కొండ మీద పెద్ద బండ ఉంది.", reading: "koṇḍa mīda pedda baṇḍa undi.", bases: [{ word: "ఉంది", ref: "te-0633" }] }
      - { target: "ఆ బండ చాలా బరువుగా ఉంది.", reading: "ā baṇḍa cālā baruvugā undi.", bases: [{ word: "ఉంది", ref: "te-0633" }] }
    senses:
      - { id: "rock", pos: "noun", source: "https://en.wiktionary.org/wiki/బండ" }
  - id: "te-2607"
    target: "ఇసుక"
    reading: "isuka"
    ipa: "isuka"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "సముద్రం ఒడ్డున తెల్లని ఇసుక ఉంది.", reading: "samudram oḍḍuna tellani isuka undi.", bases: [{ word: "ఉంది", ref: "te-0633" }] }
      - { target: "పిల్లలు ఇసుకలో ఆడుకుంటారు.", reading: "pillalu isukalō āḍukuṇṭāru.", bases: [{ word: "ఆడుకుంటారు", ref: "te-2311" }] }
  - id: "te-2608"
    target: "మట్టి"
    reading: "maṭṭi"
    ipa: "maʈːi"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "వర్షం తర్వాత మట్టి తడిగా ఉంటుంది.", reading: "varṣam tarvāta maṭṭi taḍigā uṇṭundi.", bases: [{ word: "ఉంటుంది", ref: "te-0633" }] }
      - { target: "కుమ్మరి మట్టితో కుండ చేస్తాడు.", reading: "kummari maṭṭitō kuṇḍa cēstāḍu.", bases: [{ word: "చేస్తాడు", ref: "te-0621" }] }
    synonyms:
      - { id: "mannu", word: "మన్ను", reading: "mannu", source: "https://en.wiktionary.org/wiki/మట్టి" }
      - { id: "nela", ref: "te-2610", source: "https://en.wiktionary.org/wiki/మట్టి" }
  - id: "te-2609"
    target: "భూమి"
    reading: "bhūmi"
    ipa: "bʱuːmi"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "భూమి సూర్యుని చుట్టూ తిరుగుతుంది.", reading: "bhūmi sūryuni cuṭṭū tirugutundi.", bases: [{ word: "తిరుగుతుంది", ref: "te-0841" }] }
      - { target: "మా భూమి గ్రామం బయట ఉంది.", reading: "mā bhūmi grāmam bayaṭa undi.", bases: [{ word: "ఉంది", ref: "te-0633" }] }
    synonyms:
      - { id: "nela", ref: "te-2610", source: "https://en.wiktionary.org/wiki/భూమి" }
      - { id: "acala", word: "అచల", reading: "acala", source: "https://en.wiktionary.org/wiki/భూమి" }
      - { id: "avani", word: "అవని", reading: "avani", source: "https://en.wiktionary.org/wiki/భూమి" }
      - { id: "urvi", word: "ఉర్వి", reading: "urvi", source: "https://en.wiktionary.org/wiki/భూమి" }
  - id: "te-2610"
    target: "నేల"
    reading: "nēla"
    ipa: "neːla"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "వర్షానికి నేల తడిసింది.", reading: "varṣāniki nēla taḍisindi.", bases: [{ word: "తడిసింది", ref: "te-2321" }] }
      - { target: "ఈ నేల చాలా గట్టిగా ఉంది.", reading: "ī nēla cālā gaṭṭigā undi.", bases: [{ word: "ఉంది", ref: "te-0633" }] }
    synonyms:
      - { id: "pudami", word: "పుడమి", reading: "puḍami", source: "https://en.wiktionary.org/wiki/నేల" }
      - { id: "bhumi", ref: "te-2609", source: "https://en.wiktionary.org/wiki/నేల" }
      - { id: "mannu", word: "మన్ను", reading: "mannu", source: "https://en.wiktionary.org/wiki/నేల" }
      - { id: "matti", ref: "te-2608", source: "https://en.wiktionary.org/wiki/నేల" }
    senses:
      - { id: "land", pos: "noun", source: "https://en.wiktionary.org/wiki/నేల" }
      - { id: "earth", pos: "noun", source: "https://en.wiktionary.org/wiki/నేల" }
      - { id: "soil", pos: "noun", source: "https://en.wiktionary.org/wiki/నేల" }
  - id: "te-2611"
    target: "నీడ"
    reading: "nīḍa"
    ipa: "niːɖa"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "ఎండలో కంటే నీడలో చల్లగా ఉంటుంది.", reading: "eṇḍalō kaṇṭē nīḍalō callagā uṇṭundi.", bases: [{ word: "ఉంటుంది", ref: "te-0633" }] }
      - { target: "చెట్టు నీడలో కాసేపు కూర్చుందాం.", reading: "ceṭṭu nīḍalō kāsēpu kūrcundām.", bases: [{ word: "కూర్చుందాం", ref: "te-0634" }] }
    synonyms:
      - { id: "chaya", word: "ఛాయ", reading: "chāya", source: "https://en.wiktionary.org/wiki/నీడ" }
    senses:
      - { id: "shade", pos: "noun", source: "https://en.wiktionary.org/wiki/నీడ" }
      - { id: "image", pos: "noun", source: "https://en.wiktionary.org/wiki/నీడ" }
  - id: "te-2612"
    target: "చెరువు"
    reading: "ceruvu"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "చెరువులు", reading: "ceruvulu" }] }
    examples:
      - { target: "మా ఊరి చెరువులో చేపలు ఉన్నాయి.", reading: "mā ūri ceruvulō cēpalu unnāyi.", bases: [{ word: "ఉన్నాయి", ref: "te-0633" }] }
      - { target: "ఈ చెరువు చాలా లోతుగా ఉంది.", reading: "ī ceruvu cālā lōtugā undi.", bases: [{ word: "ఉంది", ref: "te-0633" }] }
    synonyms:
      - { id: "kolanu", ref: "te-2613", source: "https://en.wiktionary.org/wiki/చెరువు" }
  - id: "te-2613"
    target: "కొలను"
    reading: "kolanu"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "కొలనులు", reading: "kolanulu" }] }
    examples:
      - { target: "కొలనులో తామర పువ్వులు ఉన్నాయి.", reading: "kolanulō tāmara puvvulu unnāyi.", bases: [{ word: "ఉన్నాయి", ref: "te-0633" }] }
      - { target: "ఈ హోటల్‌లో పెద్ద ఈత కొలను ఉంది.", reading: "ī hōṭallō pedda īta kolanu undi.", bases: [{ word: "ఉంది", ref: "te-0633" }] }
  - id: "te-2614"
    target: "బావి"
    reading: "bāvi"
    ipa: "baːʋi"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "బావులు", reading: "bāvulu" }] }
    examples:
      - { target: "ఊరి బావిలో నీళ్లు చల్లగా ఉంటాయి.", reading: "ūri bāvilō nīḷḷu callagā uṇṭāyi.", bases: [{ word: "ఉంటాయి", ref: "te-0633" }] }
      - { target: "ఈ బావి చాలా పాతది.", reading: "ī bāvi cālā pātadi." }
    synonyms:
      - { id: "nuyyi", word: "నుయ్యి", reading: "nuyyi", source: "https://en.wiktionary.org/wiki/బావి" }
      - { id: "kupamu", word: "కూపము", reading: "kūpamu", source: "https://en.wiktionary.org/wiki/బావి" }
    senses:
      - { id: "well", pos: "noun", source: "https://en.wiktionary.org/wiki/బావి" }
      - { id: "tank", pos: "noun", source: "https://en.wiktionary.org/wiki/బావి" }
      - { id: "spring", pos: "noun", source: "https://en.wiktionary.org/wiki/బావి" }
      - { id: "pit", pos: "noun", source: "https://en.wiktionary.org/wiki/బావి" }
  - id: "te-2615"
    target: "జలపాతం"
    reading: "jalapātam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "జలపాతాలు", reading: "jalapātālu" }] }
    examples:
      - { target: "ఈ జలపాతం చాలా ఎత్తు నుంచి పడుతుంది.", reading: "ī jalapātam cālā ettu nuñci paḍutundi.", bases: [{ word: "పడుతుంది", ref: "te-0839" }] }
      - { target: "మేము ఆదివారం జలపాతం చూశాం.", reading: "mēmu ādivāram jalapātam cūśām.", bases: [{ word: "చూశాం", ref: "te-0626" }] }
  - id: "te-2616"
    target: "లోయ"
    reading: "lōya"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "లోయలు", reading: "lōyalu" }] }
    examples:
      - { target: "కొండల మధ్య ఒక అందమైన లోయ ఉంది.", reading: "koṇḍala madhya oka andamaina lōya undi.", bases: [{ word: "ఉంది", ref: "te-0633" }] }
      - { target: "ఈ లోయ చాలా లోతుగా ఉంది.", reading: "ī lōya cālā lōtugā undi.", bases: [{ word: "ఉంది", ref: "te-0633" }] }
    senses:
      - { id: "valley", pos: "noun", source: "https://en.wiktionary.org/wiki/లోయ" }
      - { id: "pit", pos: "noun", source: "https://en.wiktionary.org/wiki/లోయ" }
  - id: "te-2617"
    target: "ద్వీపం"
    reading: "dvīpam"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "ద్వీపాలు", reading: "dvīpālu" }] }
    examples:
      - { target: "ఈ ద్వీపం సముద్రం మధ్యలో ఉంది.", reading: "ī dvīpam samudram madhyalō undi.", bases: [{ word: "ఉంది", ref: "te-0633" }] }
      - { target: "మేము పడవలో ద్వీపానికి వెళ్ళాం.", reading: "mēmu paḍavalō dvīpāniki veḷḷām.", bases: [{ word: "వెళ్ళాం", ref: "te-0622" }] }
  - id: "te-2618"
    target: "పర్వతం"
    reading: "parvatam"
    ipa: "paɾʋat̪am̃"
    pos: "noun"
    gender: "amahat"
    bases: "self"
    notes:
      - { id: "n1", kind: "behaviour", words: [{ word: "పర్వతాలు", reading: "parvatālu" }] }
    examples:
      - { target: "ఎవరెస్ట్ ప్రపంచంలో ఎత్తైన పర్వతం.", reading: "evareṣṭ prapañcamlō ettaina parvatam." }
      - { target: "మేము ఈ పర్వతం ఎక్కాం.", reading: "mēmu ī parvatam ekkām.", bases: [{ word: "ఎక్కాం", ref: "te-0827" }] }
  - id: "te-2619"
    target: "అగ్నిపర్వతం"
    reading: "agniparvatam"
    pos: "noun"
    gender: "amahat"
