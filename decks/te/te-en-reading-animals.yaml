  "sentences":
  - "text": "కోతి అరటిపండు తింటుంది."
    "reading": "kōti araṭipaṇḍu tiṇṭundi."
    "ipa": "koːt̪i araʈipaɳɖu t̪iɳʈund̪i"
  - "text": "పిల్లి చేప తింటుంది."
    "reading": "pilli cēpa tiṇṭundi."
    "ipa": "pilli tʃeːpa t̪iɳʈund̪i"
  - "text": "పులి మాంసం తింటుంది."
    "reading": "puli māṁsaṁ tiṇṭundi."
    "ipa": "puli maːmsam t̪iɳʈund̪i"
  - "text": "చిలుక పండు తింటుంది."
    "reading": "ciluka paṇḍu tiṇṭundi."
    "ipa": "tʃiluka paɳɖu t̪iɳʈund̪i"
