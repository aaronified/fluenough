schema: 1
id: te-en-grammar-nouns
name: "Nouns: plural and case"
kind: grammar
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN, icon: "తె" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The plural, and the endings for 'in', 'to' and 'from', often on a changed stem. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Noun forms"
  slot_name: "form"
  slots: ["plural", "in: -లో (-lō)", "to: -కి (-ki) or -కు (-ku)", "from: నుంచి (nuñci)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "-లు (-lu) makes a plural. Before an ending, many nouns take an oblique stem: ఇల్లు (illu) becomes ఇంటి- (iṇṭi-) (ఇంటికి (iṇṭiki), to the house), and a noun in -ం (am) takes -ఆని- (-āni-) (పుస్తకానికి (pustakāniki))."
  entries:
    - lemma: "ఇల్లు"
      key: illu
      reading: "illu"
      ipa: "illu"
      gloss: "house"
      forms:
        "plural": "ఇళ్ళు"
        "in: -లో (-lō)": "ఇంట్లో"
        "to: -కి (-ki) or -కు (-ku)": "ఇంటికి"
        "from: నుంచి (nuñci)": "ఇంటి నుంచి"
      readings:
        "plural": "iḷḷu"
        "in: -లో (-lō)": "iṇṭlō"
        "to: -కి (-ki) or -కు (-ku)": "iṇṭiki"
        "from: నుంచి (nuñci)": "iṇṭi nuñci"
      ipas:
        "plural": "iɭɭu"
        "in: -లో (-lō)": "iɳʈloː"
        "to: -కి (-ki) or -కు (-ku)": "iɳʈiki"
        "from: నుంచి (nuñci)": "iɳʈi nuɲtʃi"
    - lemma: "పుస్తకం"
      key: pustakam
      reading: "pustakam"
      ipa: "pust̪akam"
      gloss: "book"
      forms:
        "plural": "పుస్తకాలు"
        "in: -లో (-lō)": "పుస్తకంలో"
        "to: -కి (-ki) or -కు (-ku)": "పుస్తకానికి"
        "from: నుంచి (nuñci)": "పుస్తకం నుంచి"
      readings:
        "plural": "pustakālu"
        "in: -లో (-lō)": "pustakamlō"
        "to: -కి (-ki) or -కు (-ku)": "pustakāniki"
        "from: నుంచి (nuñci)": "pustakam nuñci"
      ipas:
        "plural": "pust̪akaːlu"
        "in: -లో (-lō)": "pust̪akamloː"
        "to: -కి (-ki) or -కు (-ku)": "pust̪akaːniki"
        "from: నుంచి (nuñci)": "pust̪akam nuɲtʃi"
    - lemma: "దుకాణం"
      key: dukaanam
      reading: "dukāṇam"
      ipa: "d̪ukaːɳam"
      gloss: "shop"
      forms:
        "plural": "దుకాణాలు"
        "in: -లో (-lō)": "దుకాణంలో"
        "to: -కి (-ki) or -కు (-ku)": "దుకాణానికి"
        "from: నుంచి (nuñci)": "దుకాణం నుంచి"
      readings:
        "plural": "dukāṇālu"
        "in: -లో (-lō)": "dukāṇamlō"
        "to: -కి (-ki) or -కు (-ku)": "dukāṇāniki"
        "from: నుంచి (nuñci)": "dukāṇam nuñci"
      ipas:
        "plural": "d̪ukaːɳaːlu"
        "in: -లో (-lō)": "d̪ukaːɳamloː"
        "to: -కి (-ki) or -కు (-ku)": "d̪ukaːɳaːniki"
        "from: నుంచి (nuñci)": "d̪ukaːɳam nuɲtʃi"
    - lemma: "గది"
      key: gadi
      reading: "gadi"
      ipa: "ɡad̪i"
      gloss: "room"
      forms:
        "plural": "గదులు"
        "in: -లో (-lō)": "గదిలో"
        "to: -కి (-ki) or -కు (-ku)": "గదికి"
        "from: నుంచి (nuñci)": "గది నుంచి"
      readings:
        "plural": "gadulu"
        "in: -లో (-lō)": "gadilō"
        "to: -కి (-ki) or -కు (-ku)": "gadiki"
        "from: నుంచి (nuñci)": "gadi nuñci"
      ipas:
        "plural": "ɡad̪ulu"
        "in: -లో (-lō)": "ɡad̪iloː"
        "to: -కి (-ki) or -కు (-ku)": "ɡad̪iki"
        "from: నుంచి (nuñci)": "ɡad̪i nuɲtʃi"
    - lemma: "బస్సు"
      key: bassu
      reading: "bassu"
      ipa: "bassu"
      gloss: "bus"
      forms:
        "plural": "బస్సులు"
        "in: -లో (-lō)": "బస్సులో"
        "to: -కి (-ki) or -కు (-ku)": "బస్సుకి"
        "from: నుంచి (nuñci)": "బస్సు నుంచి"
      readings:
        "plural": "bassulu"
        "in: -లో (-lō)": "bassulō"
        "to: -కి (-ki) or -కు (-ku)": "bassuki"
        "from: నుంచి (nuñci)": "bassu nuñci"
      ipas:
        "plural": "bassulu"
        "in: -లో (-lō)": "bassuloː"
        "to: -కి (-ki) or -కు (-ku)": "bassuki"
        "from: నుంచి (nuñci)": "bassu nuɲtʃi"
