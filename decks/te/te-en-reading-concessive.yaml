  "sentences":
  - "text": "నాకు రెండు ఉద్యోగాలు వచ్చాయి."
    "reading": "nāku reṇḍu udyōgālu vaccāyi."
    "ipa": "naːku reɳɖu ud̪joːɡaːlu ʋatʃtʃaːji"
  - "text": "పట్నంలో జీతం ఎక్కువ ఉన్నా, అక్కడ నాకు ఎవరూ లేరు."
    "reading": "paṭnamlō jītaṁ ekkuva unnā, akkaḍa nāku evarū lēru."
    "ipa": "paʈnamloː dʒiːt̪am ekkuʋa unnaː akkaɖa naːku eʋaruː leːru"
  - "text": "ఊరిలో జీతం తక్కువ అయినా, నాకు ఊరు ఇష్టం."
    "reading": "ūrilō jītaṁ takkuva ayinā, nāku ūru iṣṭaṁ."
    "ipa": "uːriloː dʒiːt̪am t̪akkuʋa ajinaː naːku uːru iʂʈam"
  - "text": "చివరికి నేను ఊరికి వెళ్ళాను."
    "reading": "civariki nēnu ūriki veḷḷānu."
    "ipa": "tʃiʋariki neːnu uːriki ʋeɭɭaːnu"
