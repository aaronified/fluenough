  "title": "Event day"
  "sentences":
  - "text": "ఉదయం తొమ్మిది గంటలకు సమావేశం మొదలవుతుంది."
    "reading": "udayaṁ tommidi gaṇṭalaku samāvēśaṁ modalavutundi."
    "ipa": "ud̪ajam t̪ommid̪i ɡaɳʈalaku samaːʋeːʃam mod̪alaʋut̪und̪i"
  - "text": "భోజనం తిన్న తర్వాత ఆట ఉంటుంది."
    "reading": "bhōjanaṁ tinna tarvāta āṭa uṇṭundi."
    "ipa": "bʱoːdʒanam t̪inna t̪arʋaːt̪a aːʈa uɳʈund̪i"
  - "text": "ఆట చూసిన తర్వాత పాట వింటాము."
    "reading": "āṭa cūsina tarvāta pāṭa viṇṭāmu."
    "ipa": "aːʈa tʃuːsina t̪arʋaːt̪a paːʈa ʋiɳʈaːmu"
  - "text": "వెళ్ళడానికి ముందు టీ తాగండి."
    "reading": "veḷḷaḍāniki mundu ṭī tāgaṇḍi."
    "ipa": "ʋeɭɭaɖaːniki mund̪u ʈiː t̪aːɡaɳɖi"
