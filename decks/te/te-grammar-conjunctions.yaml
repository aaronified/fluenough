  - id: "te-0353"
    target: "కానీ"
    reading: "kānī"
    ipa: "kaːniː"
    pos: "other"
    "examples": [
      {"target": "అతని ఉద్దేశం మంచిదే, కానీ పద్ధతి సరికాదు.", "reading": "atani uddēśaṁ mañcidē, kānī paddhati sarikādu.", "ipa": "at̪ani ud̪d̪eːʃam maɲtʃid̪eː kaːniː pad̪d̪ʱat̪i sarikaːd̪u", "bases": [{"word": "అతని", "base": "అతడు", "reading": "ataḍu"}, {"word": "మంచిదే", "ref": "te-0500"}, {"word": "సరికాదు", "base": "సరి", "reading": "sari"}]},
      {"target": "పట్టణం చిన్నది కానీ చాలా శుభ్రంగా ఉంది.", "reading": "paṭṭaṇaṁ cinnadi kānī cālā śubhraṅgā undi.", "ipa": "paʈʈaɳam tʃinnad̪i kaːniː tʃaːlaː ʃubʱraŋɡaː und̪i", "bases": [{"word": "ఉంది", "ref": "te-0633"}, {"word": "చిన్నది", "ref": "te-0503"}, {"word": "శుభ్రంగా", "ref": "te-5721"}]}
    ]
  - id: "te-0354"
    target: "లేదా"
    reading: "lēdā"
    ipa: "leːd̪aː"
    pos: "other"
    "examples": [
      {"target": "జీపే లేదా యూపీఐ ఉందా?", "reading": "jīpē lēdā yūpīai undā?", "ipa": "dʒiːpeː leːd̪aː juːpiːai und̪aː", "bases": [{"word": "ఉందా", "ref": "te-0633"}]}
    ]
  - id: "te-0355"
    target: "ఎందుకంటే"
    reading: "endukaṇṭē"
    ipa: "end̪ukaɳʈeː"
    pos: "other"
  - id: "te-0356"
    target: "అందుకే"
    reading: "andukē"
    ipa: "and̪ukeː"
    pos: "other"
    "examples": [
      {"target": "ఉద్యోగి పనితీరు బాగుంది, అందుకే పదోన్నతి వచ్చింది.", "reading": "udyōgi panitīru bāgundi, andukē padōnnati vaccindi.", "ipa": "ud̪joːɡi panit̪iːru baːɡund̪i and̪ukeː pad̪oːnnat̪i ʋatʃtʃind̪i", "bases": [{"word": "ఉద్యోగి", "base": "ఉద్యోగి", "reading": "udyōgi"}, {"word": "పనితీరు", "base": "పనితీరు", "reading": "panitīru"}, {"word": "బాగుంది", "base": "బాగుండడం", "reading": "bāgundi"}, {"word": "అందుకే", "base": "అందుకే", "reading": "andukē"}, {"word": "పదోన్నతి", "base": "పదోన్నతి", "reading": "padōnnati"}, {"word": "వచ్చింది", "base": "రావడం", "reading": "vaccindi"}]}
    ]
  - id: "te-0357"
    target: "అని"
    reading: "ani"
    ipa: "ani"
    pos: "other"
    notes:
      - { id: "n1", kind: "note" }
    "examples": [
      {"target": "అతను ఇప్పుడు వస్తాడు అని అనుకుంటాడు.", "reading": "atanu ippuḍu vastāḍu ani anukuṇṭāḍu.", "ipa": "at̪anu ippuɖu ʋast̪aːɖu ani anukuɳʈaːɖu", "bases": [{"word": "వస్తాడు", "base": "రావడం", "reading": "rāvaḍam"}, {"word": "అనుకుంటాడు", "base": "అనుకోవడం", "reading": "anukōvaḍam"}]},
      {"target": "అన్నీ అసాధ్యం అని ఎందుకు అనుకుంటావు?", "reading": "annī asādhyaṁ ani enduku anukuṇṭāvu?", "ipa": "anːiː asaːd̪ʰjam ani end̪uku anukuɳʈaːʋu", "bases": [{"word": "అన్నీ", "base": "అన్ని", "reading": "anni"}, {"word": "అనుకుంటావు", "base": "అనుకోవడం", "reading": "anukōvaḍaṁ"}]}
    ]
  - id: "te-0358"
    target: "అయితే"
    reading: "ayitē"
    ipa: "ajit̪eː"
    pos: "other"
    notes:
      - { id: "n1", kind: "note" }
    "examples": [
      {"target": "బ్యాండేజ్ తడిగా అయితే మార్చండి.", "reading": "byāṇḍēj taḍigā ayitē mārcaṇḍi.", "ipa": "bjaːɳɖeːdʒ t̪aɖiɡaː ajit̪eː maːrtʃaɳɖi", "bases": [{"word": "బ్యాండేజ్", "base": "బ్యాండేజ్", "reading": "byāṇḍēj"}, {"word": "తడిగా", "base": "తడి", "reading": "taḍigā"}, {"word": "అయితే", "base": "అవడం", "reading": "ayitē"}, {"word": "మార్చండి", "base": "మార్చడం", "reading": "mārcaṇḍi"}]}
    ]
  - id: "te-0359"
    target: "కూడా"
    reading: "kūḍā"
    ipa: "kuːɖaː"
    pos: "other"
    notes:
      - { id: "n1", kind: "note" }
    "examples": [
      {"target": "ఈ బీమాలో ఆసుపత్రి ఖర్చు కూడా ఉంది.", "reading": "ī bīmālō āsupatri kharcu kūḍā undi.", "ipa": "iː biːmaːloː aːsupatri kʰartʃu kuːɖaː und̪i", "bases": [{"word": "బీమాలో", "base": "బీమా", "reading": "bīmā"}, {"word": "ఉంది", "base": "ఉండడం", "reading": "uṇḍaḍaṁ"}]},
      {"target": "ఈ యాప్ ఆఫ్‌లైన్‌లో కూడా పని చేస్తుంది.", "reading": "ī yāp āphlainlō kūḍā pani cēstundi.", "ipa": "iː jaːp aːflainloː kuːɖaː pani tʃeːst̪und̪i", "bases": [{"word": "ఆఫ్‌లైన్‌లో", "base": "ఆఫ్‌లైన్", "reading": "āphlain"}, {"word": "చేస్తుంది", "base": "చేయడం", "reading": "cēyaḍaṁ"}]}
    ]

