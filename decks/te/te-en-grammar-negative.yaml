schema: 1
id: te-en-grammar-negative
name: "Won't and don't"
kind: grammar
language: { code: te, iso639_3: tel, name: Telugu, script: telugu, tts: te-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I don't go, she won't come: the negative of the future and the habit is a tense of its own. Not yet checked by a Telugu speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Negative"
  slot_name: "person"
  slots: ["నేను", "మేము", "నువ్వు", "మీరు", "అతను", "ఆమె / అది", "వాళ్ళు"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The negative of the future and the habit needs no word for not: రాను, I won't come, I don't come. In the past one form serves everyone, the verb with -లేదు: నేను రాలేదు, ఆమె రాలేదు, I didn't come, she didn't come. The verb agrees with the doer's person and number. In the third person a man has a form of his own; a woman takes the same form as a thing. మీరు, plural or respectful, takes the plural."
  entries:
    - lemma: "చేయడం"
      key: cheeyadam
      reading: "cēyaḍam"
      ipa: "tʃeːjaɖam"
      gloss: "to do"
      forms:
        "నేను": "చేయను"
        "మేము": ["చేయము", "చేయం"]
        "నువ్వు": "చేయవు"
        "మీరు": "చేయరు"
        "అతను": "చేయడు"
        "ఆమె / అది": "చేయదు"
        "వాళ్ళు": "చేయరు"
      readings:
        "నేను": "cēyanu"
        "మేము": ["cēyamu", "cēyam"]
        "నువ్వు": "cēyavu"
        "మీరు": "cēyaru"
        "అతను": "cēyaḍu"
        "ఆమె / అది": "cēyadu"
        "వాళ్ళు": "cēyaru"
      ipas:
        "నేను": "tʃeːjanu"
        "మేము": "tʃeːjamu"
        "నువ్వు": "tʃeːjaʋu"
        "మీరు": "tʃeːjaru"
        "అతను": "tʃeːjaɖu"
        "ఆమె / అది": "tʃeːjad̪u"
        "వాళ్ళు": "tʃeːjaru"
    - lemma: "వెళ్ళడం"
      key: velladam
      reading: "veḷḷaḍam"
      ipa: "ʋeɭɭaɖam"
      gloss: "to go"
      forms:
        "నేను": "వెళ్ళను"
