"cards":
  "sux-0001":
    "native": "king"
    "notes":
      "n1": "Lugal, king: the most common title of royal inscriptions. Its sign is the one the path cites for the king."
  "sux-0002":
    "native": "child; son"
    "notes":
      "n1": "Dumu, child or son, as in dumu-ni, his child. Written in transliteration here; its sign is not yet checked."
  "sux-0003":
    "native": "house; temple"
    "notes":
      "n1": "E₂, house, the sign the path cites for house. A house is a non-human noun, so its possessive is -bi, its, not -a-ni."
  "sux-0004":
    "native": "god"
    "notes":
      "n1": "Dingir, god. The sign \U0001202D is also the determinative for a god's name, written before it."
  "sux-0005":
    "native": "man; person"
    "notes":
      "n1": "Lu₂, man or person: a human noun, written with its own sign, the one for lu₂."
  "sux-0006":
    "native": "water"
    "notes":
      "n1": "A, water: the sign is the one for water, which is also the syllable a. A non-human noun."
  "sux-0007":
    "native": "lady; queen"
    "notes":
      "n1": "Nin, lady or queen. Written in transliteration here; its sign is not yet checked."
  "sux-0008":
    "native": "mother"
    "notes":
      "n1": "Ama, mother. Written in transliteration here; its sign is not yet checked."
  "sux-0009":
    "native": "father"
    "notes":
      "n1": "Ad-da, father. Written in transliteration here; its sign is not yet checked."
  "sux-0010":
    "native": "silver"
    "notes":
      "n1": "Ku₃-babbar, silver: the pure white metal. A non-human noun. Written in transliteration here."
