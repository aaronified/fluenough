"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "First words"
"description": "Thirty-four words of Sumerian, the language of the cuneiform tablets of southern Mesopotamia, about 3000 to 2000 BCE. Each target is the sign or signs of the word's entry in Wiktionary, and the reading is the transliteration given there (sign indices as subscripts, ĝ for the velar nasal; Wiktionary writes it g̃). The IPA is Wiktionary's pronunciation of the entry, a reconstruction and a reading aid. Words in the Sumerian Swadesh list say so in their notes. Not yet checked by a Sumerologist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "sux-0001":
    "native": "water; seed"
    "notes":
      "n1": "A, water, fluid; also semen, seed, offspring, a watercourse. Wiktionary (a); the Sumerian Swadesh list gives a for water."
  "sux-0002":
    "native": "father"
    "notes":
      "n1": "A-a (said aya), father. Wiktionary. The Sumerian Swadesh list writes the word as ada (and gives pab); a-a is the transliteration of Wiktionary's entry."
  "sux-0003":
    "native": "mother"
    "notes":
      "n1": "Ama, mother. Wiktionary (the sign also writes a different word, ĝal, breadth); the Swadesh list gives ama."
  "sux-0004":
    "native": "man; person"
    "notes":
      "n1": "Lu₂, man, person, someone; also the one who (a relative pronoun). Wiktionary (written lú with an accent in some books)."
  "sux-0005":
    "native": "woman"
    "notes":
      "n1": "Munus, woman, female; the sign is also put before women's names. Wiktionary."
  "sux-0006":
    "native": "name"
    "notes":
      "n1": "Mu, name, fame, a line of text; another word mu is year. Wiktionary (also the Swadesh list: mu₁₀ for name)."
  "sux-0007":
    "native": "to be good; good"
    "notes":
      "n1": "Dug₃, to be good, pleasing, sweet. Wiktionary. Sumerian has no separate adjectives of this kind: the word is a verb root used after its noun. The same sign also writes ḫi, to mix, and dub, knee."
  "sux-0008":
    "native": "big; great"
    "notes":
      "n1": "Gal, big, great (the adjective; plural gal-gal); also a verb, to be big. Wiktionary; the Swadesh list gives gal."
  "sux-0009":
    "native": "small; young"
    "notes":
      "n1": "Tur, small, young, brief; also a verb, to be small. Wiktionary. The same sign also writes dumu, child, and banda₃, small."
  "sux-0010":
    "native": "one"
    "notes":
      "n1": "Diš, one (the numeral). Wiktionary (also the determinative before men's names). The Swadesh list gives aš, diš and did for one; aš is the reading of another sign, which means to be one."
  "sux-0011":
    "native": "two"
    "notes":
      "n1": "Min, two. Wiktionary (numeral); the Swadesh list gives min."
  "sux-0012":
    "native": "three"
    "notes":
      "n1": "Eš₅, three. Wiktionary (numeral, transliterated eš₅, said eš); the Swadesh list gives eš."
  "sux-0013":
    "native": "four"
    "notes":
      "n1": "Limmu₅, four. Wiktionary (numeral, said limmu); the Swadesh list gives limmu."
  "sux-0014":
    "native": "five"
    "notes":
      "n1": "Ia₂, five. Wiktionary (numeral, said ya); the Swadesh list gives ya."
  "sux-0015":
    "native": "I"
    "notes":
      "n1": "Ĝe₂₆, I (the independent pronoun, before the genitive, dative and comitative; Wiktionary writes the g with a tilde, g̃). Wiktionary; the Swadesh list gives ĝae and ĝe."
  "sux-0016":
    "native": "you (singular)"
    "notes":
      "n1": "Ze₂, you, the independent personal pronoun. Wiktionary (also written za-e); the Swadesh list gives zae and ze."
  "sux-0017":
    "native": "fire"
    "notes":
      "n1": "Izi, fire, a brazier. Wiktionary (the sign also writes ne and gibil₄). The Sumerian Swadesh list gives izi."
  "sux-0018":
    "native": "house; temple"
    "notes":
      "n1": "E₂, house, household, estate, also a temple. Wiktionary."
  "sux-0019":
    "native": "king; lord"
    "notes":
      "n1": "Lugal, king, lord, master, owner. Wiktionary; the word is also written with the two signs lu₂ and gal."
  "sux-0020":
    "native": "god"
    "notes":
      "n1": "Dingir, deity, god or goddess; the sign is also the determinative before gods' names. Wiktionary (the sign also writes an, sky)."
  "sux-0021":
    "native": "sky; heaven"
    "notes":
      "n1": "An, sky, heaven; also the sky god An (said Ān). Wiktionary. The same sign as dingir, god."
  "sux-0022":
    "native": "lady; queen"
    "notes":
      "n1": "Nin, lady, queen, mistress; before a male god's name, lord. Wiktionary."
  "sux-0023":
    "native": "place; earth"
    "notes":
      "n1": "Ki, place, ground, earth, the netherworld; the sign is also the determinative after place names. Wiktionary."
  "sux-0024":
    "native": "not; no"
    "notes":
      "n1": "Nu, not, no: a prefix before a verb (nu-), and also a verb, to be not. Wiktionary; the Swadesh list gives nu."
  "sux-0025":
    "native": "who"
    "notes":
      "n1": "A-ba (said aba), who; also whoever. Wiktionary (interrogative and relative); the Swadesh list gives aba."
  "sux-0026":
    "native": "what"
    "notes":
      "n1": "A-na (said ana), what; also whatever. Wiktionary (interrogative and relative); the Swadesh list gives ana."
  "sux-0027":
    "native": "tree; wood"
    "notes":
      "n1": "Ĝeš, tree, wood, timber, a yoke; the sign is also the determinative before names of trees and wooden things. Wiktionary (written g̃eš there)."
  "sux-0028":
    "native": "mouth"
    "notes":
      "n1": "Ka, mouth, opening, beginning. Wiktionary, entry 3 (the sign also writes inim, word, du₁₁, to say, zu₂, tooth, and others)."
  "sux-0029":
    "native": "sun; day"
    "notes":
      "n1": "Ud (also u₄), the sun, day, heat, summer. Wiktionary (the sign also writes babbar, to be white)."
  "sux-0030":
    "native": "hand"
    "notes":
      "n1": "Šu, hand, handwriting, responsibility. Wiktionary."
  "sux-0031":
    "native": "eye; face"
    "notes":
      "n1": "Igi, eye, sight, face, front. Wiktionary; as an adjective igi means first."
  "sux-0032":
    "native": "mountain; foreign land"
    "notes":
      "n1": "Kur, mountain, a foreign land, the east, the netherworld. Wiktionary."
  "sux-0033":
    "native": "city"
    "notes":
      "n1": "Iri (also read uru), city, town. Wiktionary."
  "sux-0034":
    "native": "lord"
    "notes":
      "n1": "En, lord. Wiktionary (as a conjunction, en-na, until)."
