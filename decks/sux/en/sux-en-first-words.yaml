"name": "First words"
"description": "Ten words of Sumerian, the language of the cuneiform tablets. The target is the cuneiform sign where it is certain, otherwise the standard transliteration; the reading is the standard transliteration (not ISO 15919). There is no pronunciation and no speaker, so no IPA is given. The cards have no example sentences yet: a scholar supplies them. Not yet checked by an Assyriologist: please report any mistake."
