"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "First words"
"description": "Twenty-six words of Sumerian, the language of the cuneiform tablets of southern Mesopotamia, about 3000 to 2000 BCE. The target is in cuneiform and the reading is the standard transliteration (lugal, e₂). Words are taken from the Sumerian Swadesh list and from the grammar notes of the Wikipedia article; the rest are marked doubtful. The IPA is broad and reconstructed, a reading aid for a reading course. Not yet checked by a Sumerologist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "sux-0001":
    "native": "water"
    "notes":
      "n1": "A, water. Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
  "sux-0002":
    "native": "father"
    "notes":
      "n1": "Ada, father; also pab in the list. Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
  "sux-0003":
    "native": "mother"
    "notes":
      "n1": "Ama, mother (the ergative is ama-a). Source: Wiktionary, Sumerian Swadesh list (List I and List II); Wikipedia, Sumerian language (ama-a)."
  "sux-0004":
    "native": "man (adult male)"
    "notes":
      "n1": "Lú, man; in the list also human being. Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
  "sux-0005":
    "native": "woman"
    "notes":
      "n1": "Munus, woman (also géme and mu₁₀ in the list). Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
  "sux-0006":
    "native": "name"
    "notes":
      "n1": "Mu, name. Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
  "sux-0007":
    "native": "good"
    "notes":
      "n1": "Dùg, good. Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
  "sux-0008":
    "native": "big; great"
    "notes":
      "n1": "Gal, big, great (gal-gal, great, in the gods' epithets). Source: Wiktionary, Sumerian Swadesh list (List I and List II); Wikipedia, Sumerian language (dingir gal-gal)."
  "sux-0009":
    "native": "small"
    "notes":
      "n1": "Tur, small (also a word for child in the list). Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
  "sux-0010":
    "native": "one"
    "notes":
      "n1": "Aš, one (also diš, did in the list). Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
  "sux-0011":
    "native": "two"
    "notes":
      "n1": "Min, two. Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
  "sux-0012":
    "native": "three"
    "notes":
      "n1": "Eš, three (also peš). Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
  "sux-0013":
    "native": "four"
    "notes":
      "n1": "Limmu, four (spelled with the subscript index in standard transcription). Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
  "sux-0014":
    "native": "five"
    "notes":
      "n1": "Ya, five, as the list gives it. Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
  "sux-0015":
    "native": "I"
    "notes":
      "n1": "Ĝe₂₆, I (ĝae in the list, a variant spelling). Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
  "sux-0016":
    "native": "you (singular)"
    "notes":
      "n1": "Ze₂, you (singular). Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
  "sux-0017":
    "native": "fire"
    "notes":
      "n1": "Izi, fire. Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
  "sux-0018":
    "native": "house; household"
    "notes":
      "n1": "E₂, house, household. Source: Wikipedia, Sumerian language (Grammar, noun phrases); the list does not give house."
  "sux-0019":
    "native": "king; lord"
    "notes":
      "n1": "Lugal, king. Source: Wikipedia, Sumerian language (e₂ lugal-la, the king's house)."
  "sux-0020":
    "native": "god"
    "notes":
      "n1": "Dingir, god (written with the AN sign; dig̃ir in the source). Source: Wikipedia, Sumerian language (dig̃ir gal-gal-g̃u₁₀-ne-ra, for my great gods)."
  "sux-0021":
    "native": "sky; heaven; the god An"
    "notes":
      "n1": "An, sky, heaven, and the god An (the AN sign that also writes dingir). The gloss is not in the sources read; doubtful until checked."
  "sux-0022":
    "native": "lady"
    "notes":
      "n1": "Nin, lady (Wikipedia, Sumerian language, noun phrases: nin, lady). Source: Wikipedia, Sumerian language."
  "sux-0023":
    "native": "earth; place"
    "notes":
      "n1": "Ki, earth, place. Not in the sources read; doubtful until checked."
  "sux-0024":
    "native": "not"
    "notes":
      "n1": "Nu, not. Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
  "sux-0025":
    "native": "who"
    "notes":
      "n1": "Aba, who. Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
  "sux-0026":
    "native": "what"
    "notes":
      "n1": "Ana, what. Source: Wiktionary, Sumerian Swadesh list (List I and List II)."
