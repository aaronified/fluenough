"name": "Phrasebook: the formulae of royal inscriptions"
"description": "Five formulae of royal inscriptions and hymns, read in transliteration. This is a reading course, not a speaking one, so the phrases are formulae, not survival phrases; fewer than fifteen defensible formulae were found here. Not yet checked by an Assyriologist: please report any mistake."
