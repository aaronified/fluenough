"cards":
  "sux-0011":
    "native": "mighty king"
    "notes":
      "n1": "A formula of royal inscriptions and hymns. Kalag-ga is mighty, with the particle -ga; read in transliteration."
  "sux-0012":
    "native": "for his life"
    "notes":
      "n1": "A dedication formula: for his life, with -še₃ marking purpose. Read in transliteration."
  "sux-0013":
    "native": "he built it for him"
    "notes":
      "n1": "A verbal chain of the dedications: he built it for him or her. Read in transliteration."
  "sux-0014":
    "native": "mighty hero"
    "notes":
      "n1": "A formula of royal praise: a mighty hero. Read in transliteration."
  "sux-0015":
    "native": "my king"
    "notes":
      "n1": "King with -ĝu₁₀, my: a form of address in letters and hymns. Read in transliteration."
