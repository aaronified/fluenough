name: "Phrasebook: first phrases"
license: "CC-BY-SA-4.0"
description: "Twenty things to say from the first day, in Thai, before their words are taught: greetings, goodbyes, thanks and sorry, please, the way to say you do not understand or know, to ask a price or a place, to ask for help, and how to say your name. Polite particles are not added here: men add ครับ (khráp), women add ค่ะ (khâ). Not yet checked by a Thai speaker: please report any mistake."
