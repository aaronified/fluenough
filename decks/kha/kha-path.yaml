# The order this language is taught in, one unit per line (ADR-0013). Only
# the first words are written, and the language has no phrasebook yet, so
# the path has no B1 plan: a path with a plan must have a phrasebook of 15
# to 25 cards, which cannot be written from the sources reached so far. The
# plan (tools/gen_planned_paths.py) is added once the phrasebook exists.
schema: 1
kind: "path"
id: "kha-path"
language: "kha"
units:
  - ["kha-first-words", "*"]
