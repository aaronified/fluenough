schema: 1
id: "kha-en-first-words"
kind: "layer"
core: "kha-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "The pronouns I, you, he or she, we and they, the numbers one to ten, the family words mother, father, child, man and woman, water and rice, and a few words for asking and answering. Not yet checked by a Khasi speaker: please report any mistake."
cards:
  "kha-0101":
    native: "I"
    notes:
      "n1": "Nga is 'I'. Wikipedia's Khasi article gives ŋa for the first person singular; the\
  \ older grammars give nga."
  "kha-0102":
    native: "you (polite; also plural)"
    notes:
      "n1": "Phi is 'you'. Roberts's Grammar of the Khassi Language (1891) lists phi as the plural 'you' and ma-phi as 'you' to one person; me (to a man) and pha (to a woman) are the close, informal singular forms."
  "kha-0103":
    native: "he"
    notes:
      "n1": "U is the third person 'he' (masculine). The same word is used for 'it'."
  "kha-0104":
    native: "she"
    notes:
      "n1": "Ka is the third person 'she' (feminine). Wiktionary's Khasi entry for u lists ka as its feminine form, and Singh's Khasi-English dictionary gives ka as the feminine sign."
  "kha-0105":
    native: "we"
    notes:
      "n1": "Ngi is 'we'. Ma ngi is also given for 'we' in an older grammar."
  "kha-0106":
    native: "they"
    notes:
      "n1": "Ki is 'they'. Singh's Khasi-English dictionary lists ki as the plural 'they', and Wiktionary gives ki as the plural of u."
  "kha-0107":
    native: "one"
    notes:
      "n1": "Wei is 'one'. An older grammar also gives shi."
  "kha-0108":
    native: "two"
    notes:
      "n1": "Ar is 'two'. Wiktionary's Khasi entry lists ar as the numeral two."
  "kha-0109":
    native: "three"
    notes:
      "n1": "Lai is 'three'."
  "kha-0110":
    native: "four"
    notes:
      "n1": "Saw is 'four'."
  "kha-0111":
    native: "five"
    notes:
      "n1": "San is 'five'."
  "kha-0112":
    native: "six"
    notes:
      "n1": "Hynriew is 'six'."
  "kha-0113":
    native: "seven"
    notes:
      "n1": "Hynniew is 'seven'."
  "kha-0114":
    native: "eight"
    notes:
      "n1": "Phra is 'eight'."
  "kha-0115":
    native: "nine"
    notes:
      "n1": "Khyndai is 'nine'."
  "kha-0116":
    native: "ten"
    notes:
      "n1": "Shiphew is 'ten'."
  "kha-0117":
    native: "mother"
    notes:
      "n1": "Kmie is 'mother'. The phrase ka kmie means 'a mother'."
  "kha-0118":
    native: "father"
    notes:
      "n1": "Kpa is 'father'. The phrase u kpa means 'a father'."
  "kha-0119":
    native: "child"
    notes:
      "n1": "Khynnah is 'child'. Singh's Khasi-English dictionary lists khynnah as 'a child, a boy or girl'."
  "kha-0120":
    native: "man"
    notes:
      "n1": "Hriw is 'man'. Roberts's grammar (1891) gives u hriw as 'a man' and ka hriw as 'a woman'; a male is also called shynrang in Singh's dictionary."
  "kha-0121":
    native: "woman"
    notes:
      "n1": "Kynthei is 'woman'. Singh's Khasi-English dictionary lists kynthei as 'female'; Roberts's grammar (1891) spells it hynthei."
  "kha-0122":
    native: "water"
    notes:
      "n1": "Um is 'water'. The same word also marks a negation, so the meaning is clear only\
  \ in context."
  "kha-0123":
    native: "rice"
    notes:
      "n1": "Ja is 'rice'. Singh's Khasi-English dictionary lists ja as 'boiled rice'; uncooked rice has its own word."
  "kha-0124":
    native: "thank you"
    notes:
      "n1": "Khublei is 'thank you'. Say it to a person who has helped you."
  "kha-0125":
    native: "no"
    notes:
      "n1": "Em is 'no'. Singh's Khasi-English dictionary lists em as the adverb 'no'."
  "kha-0126":
    native: "what"
    notes:
      "n1": "Aiuh is 'what?'. Roberts's grammar (1891) lists aiuh among the interrogative pronouns as 'what?'."
  "kha-0127":
    native: "who"
    notes:
      "n1": "Ei is 'who?'. Roberts's grammar (1891) lists ei as 'who?' for either gender."
  "kha-0128":
    native: "there"
    notes:
      "n1": "Hangta is 'there', out of sight. Singh's Khasi-English dictionary lists hangta as 'there (out of sight)'."
  "kha-0129":
    native: "here"
    notes:
      "n1": "Hangne is 'here'. Singh's Khasi-English dictionary lists hangne as 'here'."
