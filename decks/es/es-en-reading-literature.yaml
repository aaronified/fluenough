    title: "Notes on a poem"
    theme: "literature"
    sentences:
      - text: "Este poema tiene tres estrofas y cada verso rima."
      - text: "El poeta describe el mar al atardecer."
      - text: "Al final, analiza el sentido de la vida."
      - text: "La traducción es muy fiel al original."
