  # --- Verbs --------------------------------------------------------------
  - id: es-0022
    target: ser
    native: to be
    ipa: "seɾ"
    pos: verb
    notes: >-
      Permanent or essential qualities: identity, origin, profession.
      Contrast with estar.
    tags: [verb, irregular]
    examples:
      - target: Ella es médica.
        native: She is a doctor.
        ipa: "ˈeʝa es ˈmedika"
  - id: es-0023
    target: estar
    native: to be
    ipa: "esˈtaɾ"
    pos: verb
    notes: >-
      Temporary states and location. Contrast with ser.
    tags: [verb, irregular]
    examples:
      - target: Estoy cansado.
        native: I am tired.
        ipa: "esˈtoj kanˈsado"
  - id: es-0024
    target: tener
    native: to have
    ipa: "teˈneɾ"
    pos: verb
    tags: [verb, irregular]
  - id: es-0025
    target: hacer
    native: to do
    ipa: "aˈθeɾ"
    alt_native: [to make]
    pos: verb
    tags: [verb, irregular]
  - id: es-0026
