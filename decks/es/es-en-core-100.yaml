schema: 1
id: es-en-core-100
name: Spanish Core
kind: vocab
description: >-
  High-frequency Spanish nouns, verbs, adjectives and courtesy phrases.
  A starting point rather than a complete course.
language: { code: es, iso639_3: spa, name: Spanish, script: latin, tts: es-ES, icon: "Es" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
tags: [beginner, core]

cards:
  # --- People -------------------------------------------------------------
  - id: es-0001
    target: el hombre
    native: the man
    ipa: "el ˈombɾe"
    pos: noun
    gender: m
    tags: [people]
  - id: es-0002
    target: la mujer
    native: the woman
    ipa: "la muˈxeɾ"
    pos: noun
    gender: f
    tags: [people]
  - id: es-0003
    target: el niño
    native: the boy
    ipa: "el ˈniɲo"
    alt_native: [the child]
    pos: noun
    gender: m
    tags: [people]
  - id: es-0004
    target: la niña
