facts:
  - id: "es-fact-001"
    tags: ["pronunciation"]
    source: "https://en.wikipedia.org/wiki/Ye%C3%ADsmo"
    text:
      en: "Over 90% of Spanish speakers pronounce ll and y the same way, so the two letters stand for one sound. This merger is called yeísmo, after the name of the letter y, ye."
      bn: "স্প্যানিশ ভাষাভাষীদের ৯০%-এরও বেশি ll আর y একইভাবে উচ্চারণ করেন, তাই দুটি বর্ণ একটিই ধ্বনি বোঝায়। এই মিশে যাওয়াকে বলা হয় yeísmo, যার নাম এসেছে বর্ণ y-এর নাম ye থেকে।"
      hi: "स्पेनिश बोलने वालों में 90% से अधिक लोग ll और y को एक ही तरह बोलते हैं, इसलिए दोनों अक्षर एक ही ध्वनि दर्शाते हैं। इस मेल को yeísmo कहते हैं, जिसका नाम अक्षर y के नाम 'ye' से आया है।"
  - id: "es-fact-002"
    tags: ["pronunciation", "varieties"]
    source: "https://en.wikipedia.org/wiki/Seseo"
    text:
      en: "Across Latin America, c before e or i and z are usually said like s, a pattern called seseo. In most of Spain they keep a th-like sound, called distinción."
      bn: "ল্যাটিন আমেরিকায় e বা i-এর আগের c এবং z সাধারণত s-এর মতো উচ্চারিত হয়; একে বলে seseo। স্পেনের বেশিরভাগ অঞ্চলে এগুলো th-এর মতো একটি ধ্বনি রাখে, যাকে বলে distinción।"
      hi: "लैटिन अमेरिका में e या i से पहले आने वाला c और z आम तौर पर s जैसे बोले जाते हैं; इसे seseo कहते हैं। स्पेन के ज़्यादातर हिस्सों में इनके लिए th जैसी ध्वनि बनी रहती है, जिसे distinción कहते हैं।"
  - id: "es-fact-003"
    tags: ["pronunciation", "history"]
    source: "https://en.wikipedia.org/wiki/Seseo"
    text:
      en: "A popular story says Spain's th sound came from a king who lisped, but scholars have discredited it. The difference grew out of historical changes in the 15th century."
      bn: "একটি জনপ্রিয় গল্প বলে, স্পেনের th-জাতীয় ধ্বনি এসেছে জিভ-জড়ানো এক রাজার কাছ থেকে; পণ্ডিতরা এই গল্প খারিজ করেছেন। আসল কারণ ছিল পঞ্চদশ শতকের ঐতিহাসিক পরিবর্তন।"
      hi: "एक लोकप्रिय कहानी के अनुसार स्पेनिश का th जैसा उच्चारण एक तुतलाने वाले राजा से आया, पर विद्वानों ने इस कहानी को ग़लत बताया है। असल वजह 15वीं सदी के ऐतिहासिक बदलाव हैं।"
  - id: "es-fact-004"
    tags: ["script"]
    source: "https://en.wikipedia.org/wiki/Spanish_orthography"
    text:
      en: "The Spanish alphabet is the Latin alphabet with one extra letter, ñ, so it has 27 letters. The ñ has a tilde over the n."
      bn: "স্প্যানিশ বর্ণমালায় ল্যাটিনের সঙ্গে আরও একটি বর্ণ যোগ হয়েছে, ñ; তাই মোট ২৭টি অক্ষর। ñ-এর n-এর উপরে একটি tilde বা ~ চিহ্ন থাকে।"
      hi: "स्पेनिश वर्णमाला में लैटिन के अक्षरों के साथ एक और अक्षर ñ जुड़ता है, इसलिए कुल 27 अक्षर होते हैं। ñ के n पर tilde (~) का चिह्न रहता है।"
  - id: "es-fact-005"
    tags: ["script"]
    source: "https://en.wikipedia.org/wiki/Spanish_orthography"
    text:
      en: "In Spanish dictionaries ñ is a letter of its own, and it is placed after n."
      bn: "স্প্যানিশ অভিধানে ñ একটি আলাদা বর্ণ, এবং এটি n-এর পরে বসে।"
      hi: "स्पेनिश शब्दकोशों में ñ एक अलग अक्षर है, और यह n के बाद आता है।"
  - id: "es-fact-006"
    tags: ["script"]
    source: "https://en.wikipedia.org/wiki/Spanish_orthography"
    text:
      en: "Spanish puts an upside-down question mark (¿) at the start of a question and an upside-down exclamation mark (¡) at the start of an exclamation, so a reader knows what kind of sentence is coming."
      bn: "স্প্যানিশে প্রশ্নের শুরুতে উল্টো প্রশ্নচিহ্ন ¿ এবং বিস্ময়ের শুরুতে উল্টো বিস্ময়চিহ্ন ¡ বসে, যাতে পাঠক শেষে পৌঁছানোর আগেই বুঝতে পারেন বাক্যটি কী ধরনের।"
      hi: "स्पेनिश में प्रश्न की शुरुआत में उल्टा प्रश्नचिह्न ¿ और विस्मयादिबोधक की शुरुआत में उल्टा विस्मयादिबोधक चिह्न ¡ लगता है, ताकि पाठक को वाक्य के अंत से पहले पता चल जाए कि कैसा वाक्य आ रहा है।"
  - id: "es-fact-007"
    tags: ["script"]
    source: "https://en.wikipedia.org/wiki/Spanish_orthography"
    text:
      en: "Until 1994, ch and ll counted as single letters in Spanish alphabets. Since then they are sorted as ordinary pairs of letters, so chico comes after centro and before ciudad."
      bn: "১৯৯৪ সালের আগে স্প্যানিশ বর্ণমালায় ch আর ll-কে আলাদা একটি করে বর্ণ ধরা হতো। এরপর থেকে এগুলো সাধারণ দুটি বর্ণ হিসেবে সাজানো হয়, তাই chico আসে centro-র পরে আর ciudad-এর আগে।"
      hi: "1994 से पहले स्पेनिश वर्णमाला में ch और ll को एक-एक अक्षर माना जाता था। 1994 के बाद इन्हें साधारण दो-अक्षर के रूप में क्रमबद्ध किया जाता है, इसलिए chico, centro के बाद और ciudad से पहले आता है।"
  - id: "es-fact-008"
    tags: ["script", "loanwords"]
    source: "https://en.wikipedia.org/wiki/Spanish_orthography"
    text:
      en: "The letters k and w belong to the Spanish alphabet but appear mainly in loanwords, such as karate, kilo, waterpolo and wolframio."
      bn: "k আর w স্প্যানিশ বর্ণমালায় থাকলেও প্রধানত বিদেশি শব্দে দেখা যায়, যেমন karate, kilo, waterpolo আর wolframio।"
      hi: "k और w स्पेनिश वर्णमाला में हैं, पर ये ज़्यादातर विदेशी शब्दों में आते हैं, जैसे karate, kilo, waterpolo और wolframio।"
  - id: "es-fact-009"
    tags: ["script"]
    source: "https://en.wikipedia.org/wiki/Spanish_orthography"
    text:
      en: "A written accent does two jobs in Spanish: it marks a stress that breaks the usual pattern, and it tells apart words that sound the same, such as tú (you) and tu (your), or sí (yes) and si (if)."
      bn: "স্প্যানিশে লেখা accent-চিহ্নের দুটি কাজ: স্বরের উপর জোর কোথায় তা দেখানো, এবং একই রকম শোনা শব্দ আলাদা করা, যেমন tú (তুমি) ও tu (তোমার), sí (হ্যাঁ) ও si (যদি)।"
      hi: "स्पेनिश में लिखा गया accent चिह्न दो काम करता है: जहाँ सामान्य नियम से अलग ज़ोर हो, वहाँ बताता है; और एक-सी आवाज़ वाले शब्दों में फ़र्क़ करता है, जैसे tú (तुम) और tu (तुम्हारा), sí (हाँ) और si (अगर)।"
  - id: "es-fact-010"
    tags: ["script"]
    source: "https://en.wikipedia.org/wiki/Spanish_orthography"
    text:
      en: "The two dots over the u in güe and güi (the diaeresis) show that the u is pronounced, as in bilingüe (bilingual), where it sounds like w."
      bn: "güe আর güi-এর u-র উপরের দুটি বিন্দু (diaeresis) দেখায় যে u উচ্চারিত হয়; bilingüe (দ্বিভাষিক) শব্দে সেটি w-এর মতো শোনায়।"
      hi: "güe और güi में u के ऊपर के दो बिंदु (diaeresis) बताते हैं कि u बोला जाता है; bilingüe (द्विभाषी) में वह w जैसा सुनाई देता है।"
  - id: "es-fact-011"
    tags: ["grammar"]
    source: "https://en.wikipedia.org/wiki/Spanish_grammar"
    text:
      en: "Every Spanish noun is either masculine or feminine, and many adjectives change their form to agree with the noun. For most nouns that name people, grammatical gender matches the person's sex."
      bn: "স্প্যানিশের প্রতিটি বিশেষ্য পুংলিঙ্গ বা স্ত্রীলিঙ্গ, এবং অনেক বিশেষণ বিশেষ্যের লিঙ্গ অনুযায়ী রূপ বদলায়। মানুষবাচক বেশিরভাগ বিশেষ্যের ক্ষেত্রে ব্যাকরণগত লিঙ্গ প্রকৃত লিঙ্গের সঙ্গে মেলে।"
      hi: "स्पेनिश की हर संज्ञा पुल्लिंग या स्त्रीलिंग होती है, और कई विशेषण संज्ञा के लिंग के हिसाब से अपना रूप बदलते हैं। व्यक्तियों को दर्शाने वाली ज़्यादातर संज्ञाओं में व्याकरणिक लिंग वास्तविक लिंग से मेल खाता है।"
  - id: "es-fact-012"
    tags: ["script", "grammar"]
    source: "https://en.wikipedia.org/wiki/Spanish_orthography"
    text:
      en: "The ordinal signs º and ª match the gender of the noun: 1.º (primero) is masculine and 1.ª (primera) is feminine."
      bn: "ক্রমবাচক সংখ্যার চিহ্ন º আর ª বিশেষ্যের লিঙ্গ অনুযায়ী বসে: 1.º (primero) পুংলিঙ্গ, 1.ª (primera) স্ত্রীলিঙ্গ।"
      hi: "क्रमवाचक संख्याओं के चिह्न º और ª संज्ञा के लिंग के अनुसार लगते हैं: 1.º (primero) पुल्लिंग है और 1.ª (primera) स्त्रीलिंग।"
  - id: "es-fact-013"
    tags: ["script"]
    source: "https://en.wikipedia.org/wiki/Spanish_orthography"
    text:
      en: "Spanish spelling shows where the stress falls: words ending in a vowel, n or s are stressed on the second-last syllable, words ending in other consonants on the last, and a written accent marks a stress that breaks this pattern."
      bn: "স্প্যানিশ বানানে জোর কোথায় পড়ে তা বোঝা যায়: স্বরবর্ণ, n বা s দিয়ে শেষ শব্দে জোর শেষের আগের অক্ষরে, অন্য ব্যঞ্জনে শেষ শব্দে শেষ অক্ষরে; এর ব্যতিক্রমে একটি accent চিহ্ন বসে।"
      hi: "स्पेनिश वर्तनी से अक्सर पता चल जाता है कि ज़ोर कहाँ पड़ेगा: स्वर, n या s पर खत्म होने वाले शब्दों में ज़ोर उपांत्य अक्षर पर, और दूसरे व्यंजनों पर खत्म होने वाले शब्दों में अंतिम अक्षर पर पड़ता है; जो शब्द इस नियम से हटते हैं, उन पर accent चिह्न लगता है।"
  - id: "es-fact-014"
    tags: ["history", "script"]
    source: "https://en.wikipedia.org/wiki/Spanish_orthography"
    text:
      en: "Spain's Royal Spanish Academy (Real Academia Española) sets the official rules of Spanish spelling, and its current spelling guide, the Ortografía, was published in 2010."
      bn: "স্পেনের Real Academia Española (রয়্যাল স্প্যানিশ একাডেমি) স্প্যানিশ বানানের সরকারি নিয়ম ঠিক করে; এর বর্তমান বানান-নির্দেশিকা Ortografía প্রকাশিত হয় ২০১০ সালে।"
      hi: "स्पेन की Real Academia Española (रॉयल स्पेनिश अकादमी) स्पेनिश वर्तनी के आधिकारिक नियम तय करती है; इसकी मौजूदा वर्तनी-पुस्तक Ortografía 2010 में छपी।"
  - id: "es-fact-015"
    tags: ["pronunciation"]
    source: "https://en.wikipedia.org/wiki/Spanish_orthography"
    text:
      en: "In modern Spanish b and v are pronounced the same, so spelling decides which letter a word gets, and that choice is mostly based on the word's history."
      bn: "আধুনিক স্প্যানিশে b আর v একইভাবে উচ্চারিত হয়, তাই কোন শব্দে কোনটি লেখা হবে তা মূলত শব্দের ইতিহাস বা etymology দেখে ঠিক হয়।"
      hi: "आधुनिक स्पेनिश में b और v एक जैसे बोले जाते हैं, इसलिए किस शब्द में कौन-सा अक्षर लिखा जाएगा, यह मुख्य रूप से शब्द के इतिहास (etymology) से तय होता है।"
  - id: "es-fact-016"
    tags: ["pronunciation", "script"]
    source: "https://en.wikipedia.org/wiki/Spanish_orthography"
    text:
      en: "In Spanish the letter x usually stands for ks or gs, but in names such as México it is pronounced like the Spanish j."
      bn: "স্প্যানিশে x সাধারণত ks বা gs ধ্বনি দেয়, কিন্তু México-র মতো নামে x-এর উচ্চারণ স্প্যানিশ j-এর মতো।"
      hi: "स्पेनिश में x आम तौर पर ks या gs ध्वनि देता है, पर México जैसे नामों में इसका उच्चारण स्पेनिश j जैसा होता है।"
  - id: "es-fact-017"
    tags: ["pronunciation"]
    source: "https://en.wikipedia.org/wiki/Spanish_orthography"
    text:
      en: "Spanish spelling is fairly phonemic: a word's pronunciation can largely be predicted from its spelling, much more easily than in English."
      bn: "স্প্যানিশ বানান মোটামুটি ধ্বনিনির্ভর: বানান দেখে শব্দের উচ্চারণ অনেকটাই আন্দাজ করা যায়, ইংরেজির চেয়ে অনেক সহজে।"
      hi: "स्पेनिश वर्तनी काफ़ी हद तक ध्वनि के अनुरूप है: वर्तनी देखकर शब्द का उच्चारण बहुत हद तक पता चल जाता है, अंग्रेज़ी से कहीं आसानी से।"
  - id: "es-fact-018"
    tags: ["grammar"]
    source: "https://en.wikipedia.org/wiki/Romance_copula"
    text:
      en: "Spanish has two verbs for 'to be', ser and estar, where English has one. Ser mostly comes from a Latin verb meaning 'to be', while estar comes from the Latin stare, 'to stand'."
      bn: "ইংরেজির 'to be'-এর জায়গায় স্প্যানিশে দুটি ক্রিয়া আছে: ser আর estar। ser মূলত ল্যাটিন 'to be' ক্রিয়া থেকে এসেছে, আর estar এসেছে ল্যাটিন stare থেকে, যার মানে 'দাঁড়ানো'।"
      hi: "अंग्रेज़ी के 'to be' के लिए स्पेनिश में दो क्रियाएँ हैं: ser और estar। ser मुख्य रूप से लैटिन के 'to be' वाले क्रिया-रूप से आया है, जबकि estar लैटिन stare से आया है, जिसका अर्थ है 'खड़ा होना'।"
  - id: "es-fact-019"
    tags: ["grammar"]
    source: "https://en.wikipedia.org/wiki/Romance_copula"
    text:
      en: "Spanish uses estar for where something is, even when the place seems permanent: Madrid está en España (Madrid is in Spain), because location counts as a state."
      bn: "স্প্যানিশে কোনো জায়গায় অবস্থান বোঝাতে estar ব্যবহার হয়, যদিও জায়গাটি স্থায়ী মনে হয়: Madrid está en España (ম্যাড্রিড স্পেনে আছে), কারণ অবস্থানকে এখানে একটি অবস্থা হিসেবে ধরা হয়।"
      hi: "स्पेनिश में किसी जगह पर होना बताने के लिए estar आता है, भले ही वह जगह स्थायी लगे: Madrid está en España (मैड्रिड स्पेन में है), क्योंकि स्पेनिश में स्थिति को एक अवस्था माना जाता है।"
  - id: "es-fact-020"
    tags: ["grammar", "varieties"]
    source: "https://en.wikipedia.org/wiki/Spanish_language"
    text:
      en: "Almost every Spanish dialect separates formal and familiar 'you': usted is the formal form and tú the familiar one, and in some places vos is a familiar form too."
      bn: "প্রায় প্রতিটি স্প্যানিশ উপভাষায় আনুষ্ঠানিক ও পরিচিত 'আপনি-তুমি'র ভেদ থাকে: usted আনুষ্ঠানিক, tú পরিচিত, আর কোনো কোনো জায়গায় পরিচিত রূপ হিসেবে vos-ও ব্যবহৃত হয়।"
      hi: "लगभग हर स्पेनिश बोली में औपचारिक और परिचित 'आप'/'तुम' का भेद होता है: usted औपचारिक है, tú परिचित है, और कुछ जगहों पर परिचित रूप के लिए vos भी आता है।"
  - id: "es-fact-021"
    tags: ["loanwords", "history"]
    source: "https://en.wikipedia.org/wiki/Spanish_language"
    text:
      en: "About 4,000 words of Arabic origin make up roughly 8% of Spanish today, much of that influence coming indirectly, through the Romance dialects of Iberia called Mozarabic."
      bn: "আজ প্রায় ৪,০০০ আরবি-উৎস শব্দ স্প্যানিশ শব্দভান্ডারের প্রায় ৮%। এর অনেকটাই এসেছে পরোক্ষে, মোজারাবিক নামের রোমানস উপভাষাগুলোর মাধ্যমে।"
      hi: "आज लगभग 4,000 अरबी-मूल के शब्द स्पेनिश का क़रीब 8% हैं। इस प्रभाव का बड़ा हिस्सा परोक्ष रूप से आया, इबेरिया की मोज़ारेबिक नाम की रोमांस बोलियों के ज़रिए।"
  - id: "es-fact-022"
    tags: ["loanwords", "history"]
    source: "https://en.wikipedia.org/wiki/Spanish_language"
    text:
      en: "Spanish took only a few words from Basque, but many from its Romance neighbours, such as Catalan, Portuguese, Galician and Occitan."
      bn: "স্প্যানিশ বাস্কে ভাষা থেকে হাতে গোনা কয়েকটি শব্দ নিয়েছে, কিন্তু প্রতিবেশী রোমানস ভাষাগুলো থেকে নিয়েছে অনেক শব্দ, যেমন ক্যাটালান, পর্তুগিজ, গালিশীয় ও অক্সিতান।"
      hi: "स्पेनिश ने बास्क भाषा से बस कुछ शब्द लिए, पर अपने रोमांस पड़ोसियों से कई शब्द लिए, जैसे कैटलन, पुर्तगाली, गालिशियन और ऑक्सिटन।"
  - id: "es-fact-023"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Spanish_language"
    text:
      en: "Spanish, also called Castilian, grew out of the Romance speech of the Kingdom of Castile, in what is now north-central Spain."
      bn: "স্প্যানিশ, যাকে Castilian-ও বলা হয়, কাস্তিয়া রাজ্যের রোমানস ভাষা থেকে বেড়ে উঠেছে; সেই রাজ্য ছিল আজকের উত্তর-মধ্য স্পেনে।"
      hi: "स्पेनिश, जिसे Castilian भी कहते हैं, कास्तिया राज्य की रोमांस बोली से विकसित हुई; यह राज्य आज के उत्तर-मध्य स्पेन में था।"
  - id: "es-fact-024"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Reconquista"
    text:
      en: "The Reconquista, the Christian campaigns against Muslim-ruled al-Andalus, ended in 1492, when the Catholic Monarchs took Granada."
      bn: "রেকনকিস্তা, অর্থাৎ আল-আন্দালুসের মুসলিম শাসনের বিরুদ্ধে খ্রিস্টান রাজ্যগুলোর অভিযান, ১৪৯২ সালে শেষ হয়, যখন ক্যাথলিক শাসকেরা গ্রানাদা দখল করেন।"
      hi: "Reconquista, यानी अल-अंदलुस पर मुस्लिम शासन के ख़िलाफ़ ईसाई राज्यों के अभियान, 1492 में ख़त्म हुए, जब कैथोलिक शासकों ने ग्रानादा पर कब्ज़ा किया।"
  - id: "es-fact-025"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Spanish_language"
    text:
      en: "The Royal Spanish Academy's own guide says that español and castellano are synonyms and equally valid names for the same language."
      bn: "রয়্যাল স্প্যানিশ একাডেমির নিজের নির্দেশিকা বলে, español আর castellano একই ভাষার দুটি সমান গ্রহণযোগ্য নাম।"
      hi: "रॉयल स्पेनिश अकादमी की अपनी मार्गदर्शिका कहती है कि español और castellano एक ही भाषा के दो बराबर मान्य नाम हैं।"
  - id: "es-fact-026"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Spanish_language"
    text:
      en: "Spanish is the official language of 21 countries and one of the six official languages of the United Nations."
      bn: "স্প্যানিশ ২১টি দেশের সরকারি ভাষা, এবং জাতিসংঘের ছয়টি সরকারি ভাষার একটি।"
      hi: "स्पेनिश 21 देशों की आधिकारिक भाषा है, और संयुक्त राष्ट्र की छह आधिकारिक भाषाओं में से एक है।"
  - id: "es-fact-027"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Spanish_language"
    text:
      en: "About 519 million people speak Spanish as their first language, the second most spoken native language in the world after Mandarin Chinese."
      bn: "প্রায় ৫১ কোটি ৯০ লাখ মানুষ স্প্যানিশকে প্রথম ভাষা হিসেবে বলেন; মাতৃভাষা হিসেবে এটি বিশ্বের দ্বিতীয় সর্বাধিক প্রচলিত ভাষা, মান্দারিনের পরেই।"
      hi: "लगभग 51.9 करोड़ लोग स्पेनिश को अपनी पहली भाषा के रूप में बोलते हैं, जिससे यह मातृभाषा के रूप में दुनिया की दूसरी सबसे ज़्यादा बोली जाने वाली भाषा है, मैंडरिन चीनी के बाद।"
  - id: "es-fact-028"
    tags: ["varieties"]
    source: "https://en.wikipedia.org/wiki/Spanish_language"
    text:
      en: "Vos, the familiar 'you', is not used in Spain, but it is the main familiar pronoun in many Spanish-speaking regions of the Americas."
      bn: "vos নামের পরিচিত 'তুমি' রূপটি স্পেনে ব্যবহার হয় না, কিন্তু আমেরিকার অনেক স্প্যানিশভাষী অঞ্চলে এটিই মূল পরিচিত রূপ।"
      hi: "vos नाम का परिचित 'तुम' रूप स्पेन में नहीं बोला जाता, पर अमेरिका के कई स्पेनिश-भाषी इलाकों में यही मुख्य परिचित रूप है।"
  - id: "es-fact-029"
    tags: ["varieties"]
    source: "https://en.wikipedia.org/wiki/Spanish_language"
    text:
      en: "In Argentina, Uruguay and Paraguay, voseo is in general use: speakers say vos where most other Spanish speakers say tú."
      bn: "আর্জেন্টিনা, উরুগুয়ে ও প্যারাগুয়েতে সাধারণভাবে vos ব্যবহৃত হয়; যেখানে অন্য স্প্যানিশভাষীরা tú বলেন, সেখানে এখানকার মানুষ vos বলেন।"
      hi: "अर्जेंटीना, उरुग्वे और पैराग्वे में vos आम तौर पर बोला जाता है; जहाँ दूसरे स्पेनिश बोलने वाले tú कहते हैं, वहाँ ये लोग vos कहते हैं।"
  - id: "es-fact-030"
    tags: ["varieties", "history"]
    source: "https://en.wikipedia.org/wiki/Seseo"
    text:
      en: "In the Canary Islands Spanish is exclusively seseante: c and z are always said like s, a pattern carried to the Americas by emigrants from Canarian and Andalusian ports."
      bn: "কানারি দ্বীপপুঞ্জের স্প্যানিশে সবসময় seseo চলে: c ও z s-এর মতো উচ্চারিত হয়; এই ধরন আন্দালুসীয় ও কানারি বন্দর থেকে যাওয়া অভিবাসীদের সঙ্গে আমেরিকায় পৌঁছায়।"
      hi: "कैनरी द्वीपों की स्पेनिश में हमेशा seseo चलता है: c और z s जैसे बोले जाते हैं; यही ढंग कैनरी और अंदालूसी बंदरगाहों से गए प्रवासियों के साथ अमेरिका पहुँचा।"
