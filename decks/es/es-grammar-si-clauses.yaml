pattern:
  slots: ["si + present → future", "si + present → present (habit)", "si + preterite → preterite"]
  entries:
    - lemma: "tener"
      ipa: "teˈneɾ"
      forms: { "si + present → future": "Si tengo dinero, compraré un coche.", "si + present → present (habit)": "Si tengo hambre, como pan.", "si + preterite → preterite": "Si tuvo tiempo, fue al cine." }
      ipas: { "si + present → future": "si ˈtenɡo diˈneɾo kompɾaˈɾe un ˈkotʃe", "si + present → present (habit)": "si ˈtenɡo ˈambɾe ˈkomo pan", "si + preterite → preterite": "si ˈtubo ˈtjempo fwe al ˈθine" }
    - lemma: "ir"
      ipa: "iɾ"
      forms: { "si + present → future": "Si voy al mercado, compraré pan.", "si + present → present (habit)": "Si voy al mercado, siempre compro pan.", "si + preterite → preterite": "Si fue al mercado, compró pan." }
      ipas: { "si + present → future": "si boj al meɾˈkado kompɾaˈɾe pan", "si + present → present (habit)": "si boj al meɾˈkado ˈsjempɾe ˈkompɾo pan", "si + preterite → preterite": "si fwe al meɾˈkado komˈpɾo pan" }
    - lemma: "estar"
      ipa: "esˈtaɾ"
      forms: { "si + present → future": "Si estoy cansado, dormiré mucho.", "si + present → present (habit)": "Si estoy cansado, descanso.", "si + preterite → preterite": "Si estuvo enfermo, fue al médico." }
      ipas: { "si + present → future": "si esˈtoj kanˈsado doɾmiˈɾe ˈmutʃo", "si + present → present (habit)": "si esˈtoj kanˈsado desˈkanso", "si + preterite → preterite": "si esˈtubo enˈfeɾmo fwe al ˈmediko" }
    - lemma: "llamar"
      ipa: "ʝaˈmaɾ"
      forms: { "si + present → future": "Si me llamas, responderé.", "si + present → present (habit)": "Si me llamas, siempre contesto.", "si + preterite → preterite": "Si me llamaste, no te oí." }
      ipas: { "si + present → future": "si me ˈʝamas respondeˈɾe", "si + present → present (habit)": "si me ˈʝamas ˈsjempɾe konˈtesto", "si + preterite → preterite": "si me ʝaˈmaste no te oˈi" }
    - lemma: "venir"
      ipa: "beˈniɾ"
      forms: { "si + present → future": "Si vienes, cenaremos juntos.", "si + present → present (habit)": "Si vienes, hay una fiesta.", "si + preterite → preterite": "Si viniste, no te vi." }
      ipas: { "si + present → future": "si ˈbjenes θenaˈɾemos ˈxuntos", "si + present → present (habit)": "si ˈbjenes aj ˈuna ˈfjesta", "si + preterite → preterite": "si biˈniste no te bi" }
    - lemma: "comer"
      ipa: "koˈmeɾ"
      forms: { "si + present → future": "Si como mucho, engordaré.", "si + present → present (habit)": "Si como pan, me lleno.", "si + preterite → preterite": "Si comió mucho, le dolió el estómago." }
      ipas: { "si + present → future": "si ˈkomo ˈmutʃo enɡoɾdaˈɾe", "si + present → present (habit)": "si ˈkomo pan me ˈʝeno", "si + preterite → preterite": "si koˈmjo ˈmutʃo le doˈljo el esˈtomaɡo" }
    - lemma: "poder"
      ipa: "poˈdeɾ"
      forms: { "si + present → future": "Si puedo, vendré.", "si + present → present (habit)": "Si puedo, camino al trabajo.", "si + preterite → preterite": "Si pudo, fue a la reunión." }
      ipas: { "si + present → future": "si ˈpwedo benˈdɾe", "si + present → present (habit)": "si ˈpwedo kaˈmino al tɾaˈbaxo", "si + preterite → preterite": "si ˈpudo fwe a la rewˈnjon" }
    - lemma: "hacer"
      ipa: "aˈθeɾ"
      forms: { "si + present → future": "Si hago la cena, comeremos temprano.", "si + present → present (habit)": "Si hago deporte, duermo mejor.", "si + preterite → preterite": "Si hizo la tarea, jugó." }
      ipas: { "si + present → future": "si ˈaɡo la ˈθena komeˈɾemos temˈpɾano", "si + present → present (habit)": "si ˈaɡo deˈpoɾte ˈdweɾmo meˈxoɾ", "si + preterite → preterite": "si ˈiθo la taˈɾea xuˈɡo" }
    - lemma: "hablar"
      ipa: "aˈblaɾ"
      forms: { "si + present → future": "Si hablo con él, te digo.", "si + present → present (habit)": "Si hablo mucho, me canso.", "si + preterite → preterite": "Si habló con el jefe, ya lo sabe." }
      ipas: { "si + present → future": "si ˈablo kon el te ˈdiɡo", "si + present → present (habit)": "si ˈablo ˈmutʃo me ˈkanso", "si + preterite → preterite": "si aˈblo kon el ˈxefe ʝa lo ˈsabe" }
