          - { en: "A kilo" }
          - { en: "A hundred grams" }
        answer: 1
      - id: "es-0400"
        prompt: { en: "How much is the shopping?" }
        options:
          - { en: "Two euros" }
          - { en: "Ten euros" }
          - { en: "Half a euro" }
        answer: 1
