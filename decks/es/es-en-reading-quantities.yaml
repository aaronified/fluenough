    title: "A recipe card"
    theme: "quantities"
    sentences:
      - text: "Pastel de manzana para cuatro personas."
      - text: "Necesitas una taza de leche, medio kilo de manzanas y tres huevos."
      - text: "Pesa la mantequilla: doscientos gramos."
      - text: "Añade un poco de azúcar."
      - text: "Cocina el pastel una hora."
