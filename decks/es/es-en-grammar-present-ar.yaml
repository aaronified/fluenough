schema: 1
id: es-en-grammar-present-ar
name: Spanish present tense, regular -ar verbs
kind: grammar
description: >-
  The single most productive pattern in Spanish. Roughly three quarters of
  Spanish verbs are regular -ar verbs, so these six endings unlock most of
  them at once.
language: { code: es, iso639_3: spa, name: Spanish, script: latin, tts: es-ES }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
tags: [beginner, grammar, verbs]

pattern:
  name: Present tense, regular -ar verbs
  slot_name: person
  slots: [yo, tú, él/ella, nosotros, vosotros, ellos]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: >-
    Drop -ar from the infinitive and add -o, -as, -a, -amos, -áis, -an.
    The vosotros form is used in Spain; Latin American Spanish uses ustedes
    with the ellos form.
  entries:
    - lemma: hablar
      ipa: "aˈblaɾ"
      gloss: to speak
      forms:
        yo: hablo
        tú: hablas
        él/ella: habla
        nosotros: hablamos
        vosotros: habláis
        ellos: hablan
      ipas:
        "yo": "ˈablo"
        "tú": "ˈablas"
        "él/ella": "ˈabla"
        "nosotros": "aˈblamos"
        "vosotros": "aˈblajs"
        "ellos": "ˈablan"
    - lemma: trabajar
      ipa: "tɾabaˈxaɾ"
      gloss: to work
      forms:
        yo: trabajo
        tú: trabajas
        él/ella: trabaja
        nosotros: trabajamos
        vosotros: trabajáis
        ellos: trabajan
      ipas:
        "yo": "tɾaˈbaxo"
        "tú": "tɾaˈbaxas"
        "él/ella": "tɾaˈbaxa"
        "nosotros": "tɾabaˈxamos"
        "vosotros": "tɾabaˈxajs"
        "ellos": "tɾaˈbaxan"
    - lemma: estudiar
      ipa: "estuˈdjaɾ"
      gloss: to study
      forms:
        yo: estudio
        tú: estudias
        él/ella: estudia
        nosotros: estudiamos
        vosotros: estudiáis
        ellos: estudian
      ipas:
        "yo": "esˈtudjo"
        "tú": "esˈtudjas"
        "él/ella": "esˈtudja"
        "nosotros": "estuˈdjamos"
        "vosotros": "estuˈdjajs"
        "ellos": "esˈtudjan"
    - lemma: comprar
      ipa: "komˈpɾaɾ"
      gloss: to buy
      forms:
        yo: compro
        tú: compras
        él/ella: compra
        nosotros: compramos
        vosotros: compráis
        ellos: compran
      ipas:
        "yo": "ˈkompɾo"
        "tú": "ˈkompɾas"
        "él/ella": "ˈkompɾa"
        "nosotros": "komˈpɾamos"
        "vosotros": "komˈpɾajs"
        "ellos": "ˈkompɾan"
    - lemma: caminar
      ipa: "kamiˈnaɾ"
      gloss: to walk
      forms:
        yo: camino
        tú: caminas
        él/ella: camina
        nosotros: caminamos
        vosotros: camináis
        ellos: caminan
      ipas:
        "yo": "kaˈmino"
        "tú": "kaˈminas"
        "él/ella": "kaˈmina"
        "nosotros": "kamiˈnamos"
        "vosotros": "kamiˈnajs"
        "ellos": "kaˈminan"
