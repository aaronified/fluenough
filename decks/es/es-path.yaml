# The order Spanish is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner
# from English is taught es-en-core-100 for es-core-100 (ADR-0013, ADR-0036).
#
# This is also Spanish's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"): every
# unit from the first words to B1, written or planned, with its size in
# words, its grammar topics, the three milestones, and for each planned unit
# its listening and reading passages, described in English. A unit with no
# deck yet is planned: the course teaches it as "Coming" until a deck is
# written. Sizes follow the plan's levels (about 700, 900 and 1,200 words;
# low confidence) and are one number for every native language. A written
# unit's size is what its decks hold today, and is raised as they grow. A
# theme named here that decks/themes.yaml does not list yet is added to it
# with its first deck.
#
# The order is the Romance order of docs/plans/language-paths-scheme.md:
# sounds, greetings, numbers, articles and gender, the two verbs "to be",
# the regular present, the irregular present, prepositions, object
# pronouns, reflexives, the past (perfective and imperfective), the future
# and the conditional, the subjunctive, and the compound tenses. Spanish
# has two decks today, the core vocabulary and the regular -ar present; the
# rest is planned. Which Spanish to teach (Latin American or Spain) is
# still open (docs/plans/language-paths.md); the plan names nothing that
# differs between them. Every deck of Spanish is listed exactly once.
schema: 1
kind: "path"
id: "es-path"
language: "es"
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
