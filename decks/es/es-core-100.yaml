  # --- Verbs --------------------------------------------------------------
  - id: es-core-0040
    target: ser
    native: to be
    pos: verb
    notes: >-
      Permanent or essential qualities: identity, origin, profession.
      Contrast with estar.
    tags: [verb, irregular]
    examples:
      - target: Ella es médica.
        native: She is a doctor.
  - id: es-core-0041
    target: estar
    native: to be
    pos: verb
    notes: >-
      Temporary states and location. Contrast with ser.
    tags: [verb, irregular]
    examples:
      - target: Estoy cansado.
        native: I am tired.
  - id: es-core-0042
    target: tener
    native: to have
    pos: verb
    tags: [verb, irregular]
  - id: es-core-0043
    target: hacer
    native: to do
