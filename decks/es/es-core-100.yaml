    pos: verb
    tags: [verb, regular-ar]
  - id: es-core-0046
    target: comer
    native: to eat
    pos: verb
    tags: [verb, regular-er]
  - id: es-core-0047
    target: beber
    native: to drink
    pos: verb
    tags: [verb, regular-er]
  - id: es-core-0048
    target: vivir
    native: to live
    pos: verb
    tags: [verb, regular-ir]

