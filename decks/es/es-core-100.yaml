schema: 1
id: es-core-100
name: Spanish Core
kind: vocab
description: >-
  High-frequency Spanish nouns, verbs, adjectives and courtesy phrases.
  A starting point rather than a complete course.
language: { code: es, name: Spanish, script: latin, tts: es-ES }
native:   { code: en, name: English }
license: CC0-1.0
tags: [beginner, core]

cards:
  # --- People -------------------------------------------------------------
  - id: es-core-0001
    target: el hombre
    native: the man
    pos: noun
    gender: m
    tags: [people]
  - id: es-core-0002
    target: la mujer
    native: the woman
    pos: noun
    gender: f
    tags: [people]
  - id: es-core-0003
