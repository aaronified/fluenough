id: "es-en-health-sentences"
kind: "layer"
core: "es-health-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences: health and fitness"
license: "CC-BY-SA-4.0"
description: "Thirty-one sentences about health, food and exercise, with the words each is often mixed up with. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-1972":
    native: "The nurse calls the doctor."
    bases: { "El": "the", "al": "to the" }
    confusables: { "doctor": { why: "Doctor is the person who treats, the one called." }, "clinica": { why: "Clínica is the place where the nurse works." } }
  "es-1973":
    native: "I exercise and eat fruit every day."
    bases: { "los": "the" }
    confusables: { "entrenar": { why: "Entrenar is to train for a sport, a longer practice." }, "alimento": { why: "Alimento is one food, not the habit." } }
  "es-1974":
    native: "I have a lot of stress and little energy."
    confusables: { "cansancio": { why: "Cansancio is tiredness, a related feeling." }, "fatiga": { why: "Fatiga is a deep tiredness, stronger than tiredness." } }
  "es-1975":
    native: "I relax at the massage."
    bases: { "Me": "to me", "en": "in", "el": "the" }
    confusables: { "bienestar": { why: "Bienestar is well-being, the result." }, "sano": { why: "Sano is healthy, a different quality." } }
  "es-1976":
    native: "The lungs need clean air."
    bases: { "Los": "the", "aire": "air" }
    confusables: { "respiracion": { why: "Respiración is breathing, the action." }, "hueso": { why: "Hueso is bone, a different part of the body." } }
  "es-1977":
    native: "I want to lose weight and not gain weight."
    confusables: { "peso": { why: "Peso is weight, the number on the scale." }, "grasa": { why: "Grasa is fat, in food or the body." } }
  "es-3440":
    native: "My father is very sedentary."
    confusables: { "deporte": { why: "Deporte is sport, which a sedentary person does not do." }, "fuerte": { why: "Fuerte is strong, not inactive." } }
  "es-3441":
    native: "Walking every morning gives me well-being."
    bases: { "me": "to me" }
    confusables: { "sano": { why: "Sano is healthy, a quality rather than a feeling of well-being." }, "masaje": { why: "Masaje is a massage, a treatment done by someone else." } }
  "es-3442":
    native: "Where is the clinic?"
    bases: { "la": "the" }
    confusables: { "hospital": { why: "Hospital is a larger place, with beds for patients." }, "farmacia": { why: "Farmacia is where you buy medicine, not a clinic." } }
  "es-3443":
    native: "I don't eat much fat, but I drink water."
    confusables: { "alimento": { why: "Alimento is food in general, not fat." }, "caloría": { why: "Caloría is a unit of energy in food, not a kind of fat." } }
  "es-3444":
    native: "My leg muscle hurts."
    bases: { "Me": "to me", "el": "the", "de": "of", "la": "the" }
    confusables: { "hueso": { why: "Hueso is bone, not the soft muscle." }, "brazo": { why: "Brazo is the arm, a different part of the body." } }
  "es-3445":
    native: "My lungs breathe well in the countryside."
    bases: { "en": "in", "el": "the" }
    confusables: { "estómago": { why: "Estómago is the stomach, a different organ." }, "bosque": { why: "Bosque is a forest, not open countryside." } }
  "es-3446":
    native: "After work I relax at home."
    bases: { "de": "after", "me": "myself", "en": "at" }
    confusables: { "relajado": { why: "Relajado is the adjective relaxed, a state, not the act of relaxing." }, "descansar": { why: "Descansar is to rest, a more general verb." } }
  "es-3447":
    native: "Do you train at the gym?"
    bases: { "en": "at", "el": "the" }
    confusables: { "entrenador": { why: "Entrenador is the coach, the person, not the act of training." }, "deporte": { why: "Deporte is the sport itself, not the place where you train." } }
  "es-3448":
    native: "I sleep eight hours every night to have energy."
    bases: { "para": "to" }
    confusables: { "sueño": { why: "Sueño is sleepiness, the wish to sleep, not energy." }, "estrés": { why: "Estrés is stress, the opposite of calm." } }
  "es-3449":
    native: "The nurse looks at my posture every day."
    bases: { "El": "the" }
    confusables: { "doctor": { why: "Doctor is a physician, a different job from a nurse." }, "respiración": { why: "Respiración is breathing, not the way the body is held." } }
  "es-3450":
    native: "I am tired after training."
    bases: { "de": "after" }
    confusables: { "cansarse": { why: "Cansarse is the verb to get tired; cansado is the state." }, "relajado": { why: "Relajado is relaxed, the opposite of tired." } }
  "es-3451":
    native: "I always have fruit rich in vitamins and protein for breakfast."
    bases: { "en": "in" }
    confusables: { "nutrición": { why: "Nutrición is the science of food, not a meal." }, "caloría": { why: "Caloría is a unit of energy, not a nutrient." } }
  "es-3452":
    native: "My sister has a lot of energy in the morning."
    bases: { "por": "in", "la": "the" }
    confusables: { "cansancio": { why: "Cansancio is tiredness, the opposite of energy." }, "fatiga": { why: "Fatiga is a deep tiredness, not energy." } }
  "es-3453":
    native: "How many calories do you eat a day?"
    bases: { "al": "per" }
    confusables: { "vitamina": { why: "Vitamina is a nutrient, not a unit of energy." }, "nutrición": { why: "Nutrición is the process of feeding the body, not a number." } }
  "es-3454":
    native: "I never get tired at the beach."
    bases: { "me": "myself", "en": "at", "la": "the" }
    confusables: { "montaña": { why: "Montaña is a mountain, not a beach." }, "cansado": { why: "Cansado is the state of being tired, an adjective." } }
  "es-3455":
    native: "I swim every week to take care of my lungs."
    bases: { "para": "to" }
    confusables: { "músculo": { why: "Músculo is muscle, not the organ used for breathing." }, "bienestar": { why: "Bienestar is well-being, the result, not the act of caring." } }
  "es-3456":
    native: "I want to improve my posture."
    confusables: { "cuerpo": { why: "Cuerpo is the whole body, not how you hold it." }, "respiración": { why: "Respiración is breathing, not posture." } }
  "es-3457":
    native: "What foods do you buy at the supermarket?"
    bases: { "en": "at", "el": "the" }
    confusables: { "tienda": { why: "Tienda is a shop in general, not a supermarket." }, "mercado": { why: "Mercado is a market, often outdoors, not a supermarket." } }
  "es-3458":
    native: "My trainer changes the pace of the exercises."
    bases: { "el": "the", "de": "of", "los": "the" }
    confusables: { "entrenar": { why: "Entrenar is the verb to train, not the person who trains." }, "entrenamiento": { why: "Entrenamiento is the training itself, not the pace." } }
  "es-3459":
    native: "Yesterday I got very tired at the gym."
    bases: { "me": "myself", "en": "at", "el": "the" }
    confusables: { "fatiga": { why: "Fatiga is a deep tiredness, a noun, not the act of getting tired." }, "piscina": { why: "Piscina is a swimming pool, not a gym." } }
  "es-3460":
    native: "I am going to relax in the park today."
    bases: { "a": "to", "en": "in", "el": "the" }
    confusables: { "descansar": { why: "Descansar is to rest, a more general verb for a break." }, "jardín": { why: "Jardín is a garden, usually private, not a public park." } }
  "es-3461":
    native: "The muscles need rest and a lot of water."
    bases: { "Los": "the" }
    confusables: { "pulmón": { why: "Pulmón is a lung, an organ, not a muscle." }, "cansancio": { why: "Cansancio is tiredness, a feeling, not the need for rest." } }
  "es-3462":
    native: "Who is the trainer?"
    bases: { "el": "the" }
    confusables: { "médico": { why: "Médico is a doctor, not a trainer." }, "enfermero": { why: "Enfermero is a nurse, who cares for patients, not a coach." } }
  "es-3463":
    native: "My mother does yoga to improve her well-being."
    bases: { "para": "to" }
    confusables: { "pasatiempo": { why: "Pasatiempo is a hobby, not a health practice." }, "masaje": { why: "Masaje is a massage, a treatment done by someone else." } }
  "es-3464":
    native: "The pace of my work changes a lot."
    bases: { "El": "the", "de": "of" }
    confusables: { "cambio": { why: "Cambio is a change, the noun, not the verb." }, "empresa": { why: "Empresa is the company, not the pace of work." } }
