schema: 1
id: "es-en-health-sentences"
kind: "layer"
core: "es-health-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences: health and fitness"
license: "CC-BY-SA-4.0"
description: "Thirty-one sentences about health, food and exercise, with the words each is often mixed up with. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-1972":
    notes:
      "n1": "A and el join into al, as in llama al médico, calls the doctor."
    native: "The nurse calls the doctor."
    bases: { "El": "the", "al": "to the" }
    confusables: { "doctor": { why: "Doctor is the person who treats, the one called." }, "clinica": { why: "Clínica is the place where the nurse works." } }
  "es-1973":
    notes:
      "n1": "Hacer is irregular in the first person: hago, I do or make."
    native: "I exercise and eat fruit every day."
    bases: { "los": "the" }
    confusables: { "entrenar": { why: "Entrenar is to train for a sport, a longer practice." }, "alimento": { why: "Alimento is one food, not the habit." } }
  "es-1974":
    notes:
      "n1": "Mucho agrees with estrés, which is masculine, and poca agrees with energía, which is feminine."
    native: "I have a lot of stress and little energy."
    confusables: { "cansancio": { why: "Cansancio is tiredness, a related feeling." }, "fatiga": { why: "Fatiga is a deep tiredness, stronger than tiredness." } }
  "es-1975":
    notes:
      "n1": "Relajarse is a reflexive verb, so it takes me before the verb, as in me relajo, I relax."
    native: "I relax at the massage."
    bases: { "Me": "to me", "en": "in", "el": "the" }
    confusables: { "bienestar": { why: "Bienestar is well-being, the result." }, "sano": { why: "Sano is healthy, a different quality." } }
  "es-1976":
    notes:
      "n1": "Los pulmones is the lungs in general: a plural masculine noun with los."
    native: "The lungs need clean air."
    bases: { "Los": "the", "aire": "air" }
    confusables: { "respiracion": { why: "Respiración is breathing, the action." }, "hueso": { why: "Hueso is bone, a different part of the body." } }
  "es-1977":
    notes:
      "n1": "Querer changes its stem e to ie in most forms: quiero, but queremos keeps the e."
    native: "I want to lose weight and not gain weight."
    confusables: { "peso": { why: "Peso is weight, the number on the scale." }, "grasa": { why: "Grasa is fat, in food or the body." } }
  "es-3440":
    notes:
      "n1": "Ser describes a lasting trait: es sedentario, he is sedentary."
    native: "My father is very sedentary."
    confusables: { "deporte": { why: "Deporte is sport, which a sedentary person does not do." }, "fuerte": { why: "Fuerte is strong, not inactive." } }
  "es-3441":
    notes:
      "n1": "An infinitive used as the subject takes a singular verb, as in caminar me da, walking gives me."
    native: "Walking every morning gives me well-being."
    bases: { "me": "to me" }
    confusables: { "sano": { why: "Sano is healthy, a quality rather than a feeling of well-being." }, "masaje": { why: "Masaje is a massage, a treatment done by someone else." } }
  "es-3442":
    notes:
      "n1": "Estar is used for where something is located: ¿Dónde está la clínica?, where is the clinic?"
    native: "Where is the clinic?"
    bases: { "la": "the" }
    confusables: { "hospital": { why: "Hospital is a larger place, with beds for patients." }, "farmacia": { why: "Farmacia is where you buy medicine, not a clinic." } }
  "es-3443":
    notes:
      "n1": "Mucha agrees with grasa, which is feminine, so it ends in -a."
    native: "I don't eat much fat, but I drink water."
    confusables: { "alimento": { why: "Alimento is food in general, not fat." }, "es-1947": { why: "Caloría is a unit of energy in food, not a kind of fat." } }
  "es-3444":
    notes:
      "n1": "Doler works like gustar: the body part that hurts is the subject, so me duele el músculo means my muscle hurts."
    native: "My leg muscle hurts."
    bases: { "Me": "to me", "el": "the", "de": "of", "la": "the" }
    confusables: { "hueso": { why: "Hueso is bone, not the soft muscle." }, "brazo": { why: "Brazo is the arm, a different part of the body." } }
  "es-3445":
    notes:
      "n1": "Mis is plural to agree with pulmones, the thing owned, whoever owns them."
    native: "My lungs breathe well in the countryside."
    bases: { "en": "in", "el": "the" }
    confusables: { "es-0745": { why: "Estómago is the stomach, a different organ." }, "bosque": { why: "Bosque is a forest, not open countryside." } }
  "es-3446":
    notes:
      "n1": "After después de the verb is an infinitive, as in después de trabajar, after working."
    native: "After work I relax at home."
    bases: { "de": "after", "me": "myself", "en": "at" }
    confusables: { "relajado": { why: "Relajado is the adjective relaxed, a state, not the act of relaxing." }, "descansar": { why: "Descansar is to rest, a more general verb." } }
  "es-3447":
    notes:
      "n1": "Tú with an accent means you, while tu without one means your, and the accent is the only difference."
    native: "Do you train at the gym?"
    bases: { "en": "at", "el": "the" }
    confusables: { "entrenador": { why: "Entrenador is the coach, the person, not the act of training." }, "deporte": { why: "Deporte is the sport itself, not the place where you train." } }
  "es-3448":
    notes:
      "n1": "Dormir is an o-to-ue stem-changing verb: duermo, I sleep, but dormimos keeps the o."
    native: "I sleep eight hours every night to have energy."
    bases: { "para": "to" }
    confusables: { "es-0902": { why: "Sueño is sleepiness, the wish to sleep, not energy." }, "es-1942": { why: "Estrés is stress, the opposite of calm." } }
  "es-3449":
    notes:
      "n1": "Mirar takes no preposition before what is looked at, as in mira mi postura, looks at my posture."
    native: "The nurse looks at my posture every day."
    bases: { "El": "the" }
    confusables: { "doctor": { why: "Doctor is a physician, a different job from a nurse." }, "es-1967": { why: "Respiración is breathing, not the way the body is held." } }
  "es-3450":
    notes:
      "n1": "Estar describes a temporary state: estoy cansado, I am tired."
    native: "I am tired after training."
    bases: { "de": "after" }
    confusables: { "cansarse": { why: "Cansarse is the verb to get tired; cansado is the state." }, "relajado": { why: "Relajado is relaxed, the opposite of tired." } }
  "es-3451":
    notes:
      "n1": "Desayuno is the verb to have breakfast here, and the same word is also the noun for breakfast."
    native: "I always have fruit rich in vitamins and protein for breakfast."
    bases: { "en": "in" }
    confusables: { "es-1945": { why: "Nutrición is the science of food, not a meal." }, "es-1947": { why: "Caloría is a unit of energy, not a nutrient." } }
  "es-3452":
    notes:
      "n1": "Por marks a time of day: por la mañana, in the morning."
    native: "My sister has a lot of energy in the morning."
    bases: { "por": "in", "la": "the" }
    confusables: { "cansancio": { why: "Cansancio is tiredness, the opposite of energy." }, "fatiga": { why: "Fatiga is a deep tiredness, not energy." } }
  "es-3453":
    notes:
      "n1": "Usted is the formal you, so the verb takes the third-person form: come usted, you eat."
    native: "How many calories do you eat a day?"
    bases: { "al": "per" }
    confusables: { "vitamina": { why: "Vitamina is a nutrient, not a unit of energy." }, "es-1945": { why: "Nutrición is the process of feeding the body, not a number." } }
  "es-3454":
    notes:
      "n1": "When nunca comes before the verb, no second no is added, as in nunca me canso."
    native: "I never get tired at the beach."
    bases: { "me": "myself", "en": "at", "la": "the" }
    confusables: { "es-1750": { why: "Montaña is a mountain, not a beach." }, "cansado": { why: "Cansado is the state of being tired, an adjective." } }
  "es-3455":
    notes:
      "n1": "Para marks the purpose: para cuidar mis pulmones, in order to look after my lungs."
    native: "I swim every week to take care of my lungs."
    bases: { "para": "to" }
    confusables: { "es-1958": { why: "Músculo is muscle, not the organ used for breathing." }, "bienestar": { why: "Bienestar is well-being, the result, not the act of caring." } }
  "es-3456":
    notes:
      "n1": "Querer takes an infinitive directly, with no a or de, as in quiero mejorar, I want to improve."
    native: "I want to improve my posture."
    confusables: { "cuerpo": { why: "Cuerpo is the whole body, not how you hold it." }, "es-1967": { why: "Respiración is breathing, not posture." } }
  "es-3457":
    notes:
      "n1": "Qué comes before a noun, as in qué alimentos, which foods."
    native: "What foods do you buy at the supermarket?"
    bases: { "en": "at", "el": "the" }
    confusables: { "tienda": { why: "Tienda is a shop in general, not a supermarket." }, "mercado": { why: "Mercado is a market, often outdoors, not a supermarket." } }
  "es-3458":
    notes:
      "n1": "De los stays two words, since only de with el becomes del."
    native: "My trainer changes the pace of the exercises."
    bases: { "el": "the", "de": "of", "los": "the" }
    confusables: { "entrenar": { why: "Entrenar is the verb to train, not the person who trains." }, "entrenamiento": { why: "Entrenamiento is the training itself, not the pace." } }
  "es-3459":
    notes:
      "n1": "Me cansé is the preterite, the past tense for a finished action (ayer)."
    native: "Yesterday I got very tired at the gym."
    bases: { "me": "myself", "en": "at", "el": "the" }
    confusables: { "fatiga": { why: "Fatiga is a deep tiredness, a noun, not the act of getting tired." }, "piscina": { why: "Piscina is a swimming pool, not a gym." } }
  "es-3460":
    notes:
      "n1": "Ir a with an infinitive is the near future: voy a relajarme, I am going to relax."
    native: "I am going to relax in the park today."
    bases: { "a": "to", "en": "in", "el": "the" }
    confusables: { "descansar": { why: "Descansar is to rest, a more general verb for a break." }, "es-0810": { why: "Jardín is a garden, usually private, not a public park." } }
  "es-3461":
    notes:
      "n1": "Agua is feminine, so the adjective is mucha, although it takes el in the singular."
    native: "The muscles need rest and a lot of water."
    bases: { "Los": "the" }
    confusables: { "es-1956": { why: "Pulmón is a lung, an organ, not a muscle." }, "cansancio": { why: "Cansancio is tiredness, a feeling, not the need for rest." } }
  "es-3462":
    notes:
      "n1": "Ser is used for who someone is, a role such as trainer."
    native: "Who is the trainer?"
    bases: { "el": "the" }
    confusables: { "es-0506": { why: "Médico is a doctor, not a trainer." }, "enfermero": { why: "Enfermero is a nurse, who cares for patients, not a coach." } }
  "es-3463":
    notes:
      "n1": "Para with an infinitive means in order to, as in para mejorar, to improve."
    native: "My mother does yoga to improve her well-being."
    bases: { "para": "to" }
    confusables: { "pasatiempo": { why: "Pasatiempo is a hobby, not a health practice." }, "masaje": { why: "Masaje is a massage, a treatment done by someone else." } }
  "es-3464":
    notes:
      "n1": "De links two nouns, as in el ritmo de mi trabajo, the pace of my work."
    native: "The pace of my work changes a lot."
    bases: { "El": "the", "de": "of" }
    confusables: { "cambio": { why: "Cambio is a change, the noun, not the verb." }, "empresa": { why: "Empresa is the company, not the pace of work." } }
