schema: 1
id: "es-en-grammar-adjective-agreement"
kind: "layer"
core: "es-grammar-adjective-agreement"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Spanish adjectives agree with their nouns"
license: "CC-BY-SA-4.0"
description: "An adjective matches its noun in gender and number. Not yet checked by a Spanish speaker: please report any mistake."
pattern:
  name: "Adjective agreement"
  slot_name: "gender and number"
  slots:
    "ms": "masculine singular"
    "fs": "feminine singular"
    "mp": "masculine plural"
    "fp": "feminine plural"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "bueno": "good"
    "malo": "bad"
    "nuevo": "new"
    "grande": "big; large"
    "pequeno": "small"
    "alto": "tall; high"
    "bajo": "short; low"
    "bonito": "pretty; nice"
    "feo": "ugly"
    "caliente": "hot"
    "frio": "cold"
    "barato": "cheap"
    "dificil": "difficult"
    "limpio": "clean"
    "contento": "happy; pleased"
    "triste": "sad"
    "cansado": "tired"
    "lleno": "full"
    "largo": "long"
    "viejo": "old"
  notes: "An adjective ending in -o changes to -a for a feminine noun and adds -s in the plural (bueno, buena, buenos, buenas). One ending in -e or a consonant adds only -s in the plural (grande, grandes; difícil, difíciles), and it does not change for gender. Put the adjective after the noun for most descriptions: una casa grande."
