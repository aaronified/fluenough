        bases:
          La: The
          escoba: broom
          detrás: behind
          de: of
  es-1188:
    native: to keep, to store
    notes:
      n1: 'Guardar is to keep, to store or to put away: guardar las cosas means to put things away.'
    examples:
      Guardo las cosas en la caja.:
        native: I put the things away in the box.
        bases:
          Guardo: I put away
          las: the
          cosas: things
          en: in
          la: the
      Guardar el dinero es importante.:
        native: Saving the money is important.
        bases:
          Guardar: to keep
          el: the
  es-1189:
    native: to break
    notes:
      n1: 'Romper is to break. Roto is the word for broken: la pantalla está rota.'
    examples:
      Rompí la taza.:
        native: I broke the cup.
        bases:
          Rompí: I broke
          la: the
      No rompas el plato.:
        native: Do not break the plate.
        bases:
          rompas: break
          el: the
  es-1190:
    native: to leave, to put down
    notes:
      n1: Dejar is to leave something behind, or to put it down. Dejar también means to let someone do something.
    examples:
      Dejo el paraguas en casa.:
        native: I leave the umbrella at home.
        bases:
          Dejo: I leave
          el: the
          en: at
      Deja la maleta aquí.:
        native: Leave the suitcase here.
        bases:
          Deja: Leave
          la: the
  es-1191:
    native: to pick up, to tidy
    notes:
      n1: Recoger is to pick things up from the floor, or to tidy a room.
    examples:
      Recojo las cosas del suelo.:
        native: I pick up the things from the floor.
        bases:
          Recojo: I pick up
          las: the
          cosas: things
          del: from the
      Tengo que recoger el cuarto.:
        native: I have to tidy the room.
        bases:
          que: to
          recoger: tidy
          el: the
  es-1192:
    native: to charge, to load
    notes:
      n1: Cargar is to charge a battery or a phone, and also to load or to carry a thing.
    examples:
      Cargo el móvil por la noche.:
        native: I charge the phone at night.
        bases:
          Cargo: I charge
          el: the
          por: at
          la: the
      ¿Cargas el ordenador?:
        native: Are you charging the computer?
        bases:
          Cargas: Are you charging
          el: the
  es-1193:
    native: to lend
    notes:
      n1: Prestar is to lend something to someone. To borrow is pedir prestado.
    examples:
      ¿Me prestas el lápiz?:
        native: Can you lend me the pencil?
        bases:
          Me: me
          prestas: lend
          el: the
      Te presto mi bolígrafo.:
        native: I lend you my pen.
        bases:
          Te: you
          presto: lend
  es-1194:
    native: heavy
    notes:
      n1: Pesado is heavy, the weight of a thing. It is also used of a person who is a bore, so use it with care.
    bases:
      pesado: heavy
    examples:
      Esta maleta es muy pesada.:
        native: This suitcase is very heavy.
        bases:
          Esta: This
          pesada: heavy
      El paquete es pesado.:
        native: The parcel is heavy.
        bases:
          El: The
          pesado: heavy
  es-1195:
    native: light
    notes:
      n1: Ligero is light in weight. Its opposite is pesado.
    bases:
      ligero: light
    antonyms:
      heavy: pesado
    examples:
      Mi mochila es ligera.:
        native: My backpack is light.
        bases:
          ligera: light
      Un bolso ligero es mejor.:
        native: A light handbag is better.
        bases:
          Un: A
          ligero: light
          mejor: better
  es-1196:
    native: broken
    notes:
      n1: Roto is broken, the state of a thing that is no longer whole. Its verb is romper.
    bases:
      roto: broken
    examples:
      La pantalla está rota.:
        native: The screen is broken.
        bases:
          La: The
          rota: broken
      El reloj está roto.:
        native: The watch is broken.
        bases:
          El: The
          roto: broken
  es-1197:
    native: useful
    notes:
      n1: Útil is useful. Its opposite is inútil, not useful.
    bases:
      útil: useful
    examples:
      Un cargador es muy útil.:
        native: A charger is very useful.
        bases:
          Un: A
          útil: useful
      Es útil tener una cámara.:
        native: It is useful to have a camera.
        bases:
          útil: useful
          una: a
