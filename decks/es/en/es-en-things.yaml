      n1: 'Foto is short for fotografía and is feminine: la foto. Hacer una foto means to take a photo.'
    bases:
      la: the
      foto: photo
    examples:
      Esta foto es bonita.:
        native: This photo is pretty.
        bases:
          Esta: This
          foto: photo
      Quiero ver tus fotos.:
        native: I want to see your photos.
        bases:
          ver: see
          tus: your
          fotos: photos
  es-1185:
    native: screen
