schema: 1
id: es-en-things
kind: layer
core: es-things
native:
  code: en
  iso639_3: eng
  name: English
name: Things
license: CC-BY-SA-4.0
description: 'Everyday things to carry, use and keep at home, and words to say what state they are in. Not yet checked by a Spanish speaker: please report any mistake.'
cards:
  es-1165:
    native: object
    notes:
      n1: 'Objeto is an object or a thing, a little more formal than cosa. It is masculine: el objeto.'
    bases:
      el: the
      objeto: object
    examples:
      Este objeto es muy útil.:
        native: This object is very useful.
        bases:
          Este: This
          objeto: object
      ¿Qué es este objeto?:
        native: What is this object?
        bases:
          este: this
          objeto: object
  es-1166:
    native: thing
    notes:
      n1: 'Cosa is a thing in everyday talk, and it is feminine: la cosa. Muchas cosas means many things.'
    bases:
      la: the
      cosa: thing
    examples:
      Tengo muchas cosas en la maleta.:
        native: I have many things in the suitcase.
        bases:
          cosas: things
          en: in
          la: the
      Es una cosa pequeña.:
        native: It is a small thing.
        bases:
          una: a
          cosa: thing
  es-1167:
    native: suitcase
    notes:
      n1: 'Maleta is a suitcase, feminine: la maleta. A bag for a short trip is a bolsa or a mochila.'
    bases:
      la: the
      maleta: suitcase
    examples:
      Mi maleta es grande.:
        native: My suitcase is big.
        bases:
          maleta: suitcase
      Necesito una maleta más grande.:
        native: I need a bigger suitcase.
        bases:
          una: a
          maleta: suitcase
  es-1168:
    native: wallet
    notes:
      n1: Cartera is a wallet for cards and money. In some countries it also means a handbag, so check the context.
    bases:
      la: the
      cartera: wallet
    examples:
      Tengo la cartera en el bolso.:
        native: I have the wallet in the handbag.
        bases:
          la: the
          cartera: wallet
          en: in
          el: the
      ¿Dónde está mi cartera?:
        native: Where is my wallet?
        bases:
          cartera: wallet
  es-1169:
    native: notebook
    notes:
      n1: 'Cuaderno is an exercise book or a notebook, masculine: el cuaderno. Libro is a book.'
    bases:
      el: the
      cuaderno: notebook
    examples:
      Escribo en el cuaderno.:
        native: I write in the notebook.
        bases:
          en: in
          el: the
          cuaderno: notebook
      El cuaderno es azul.:
        native: The notebook is blue.
        bases:
          El: The
          cuaderno: notebook
  es-1170:
    native: pencil
    notes:
      n1: 'Lápiz is a pencil, masculine: el lápiz. Its plural is lápices.'
    bases:
      el: the
      lápiz: pencil
    examples:
      Necesito un lápiz.:
        native: I need a pencil.
        bases:
          un: a
          lápiz: pencil
      El lápiz está en la mesa.:
        native: The pencil is on the table.
        bases:
          El: The
          lápiz: pencil
          en: 'on'
          la: the
  es-1171:
    native: pen
    notes:
      n1: 'Bolígrafo is a ballpoint pen, masculine: el bolígrafo. Pluma is a fountain pen.'
    bases:
      el: the
      bolígrafo: pen
    examples:
      Este bolígrafo no escribe.:
        native: This pen does not write.
        bases:
          Este: This
          bolígrafo: pen
      ¿Tienes un bolígrafo?:
        native: Do you have a pen?
        bases:
          un: a
          bolígrafo: pen
  es-1172:
    native: camera
    notes:
      n1: 'Cámara is a camera, feminine: la cámara. A phone with a camera is called el móvil, not la cámara.'
    bases:
      la: the
      cámara: camera
    examples:
      Mi cámara es nueva.:
        native: My camera is new.
        bases:
          cámara: camera
      Tomo una foto con la cámara.:
        native: I take a photo with the camera.
        bases:
          una: a
          con: with
          la: the
          cámara: camera
  es-1173:
    native: computer
    notes:
      n1: 'Ordenador is a computer, masculine: el ordenador. In Latin America it is the computadora. Both are understood.'
    bases:
      el: the
      ordenador: computer
    examples:
      El ordenador está en la mesa.:
        native: The computer is on the table.
        bases:
          El: The
          ordenador: computer
          en: 'on'
          la: the
      Trabajo con el ordenador.:
        native: I work on the computer.
        bases:
          con: 'on'
          el: the
          ordenador: computer
  es-1174:
    native: charger
    notes:
      n1: 'Cargador is a charger, masculine: el cargador. The verb is cargar, to charge.'
    bases:
      el: the
      cargador: charger
    examples:
      ¿Dónde está el cargador?:
        native: Where is the charger?
        bases:
          el: the
          cargador: charger
      Necesito el cargador del móvil.:
        native: I need the phone charger.
        bases:
          el: the
          cargador: charger
          del: for the
  es-1175:
    native: comb
    notes:
      n1: 'Peine is a comb, masculine: el peine. The brush is el cepillo.'
    bases:
      el: the
      peine: comb
    examples:
      Uso el peine por la mañana.:
        native: I use the comb in the morning.
        bases:
          el: the
          peine: comb
          por: in
          la: the
      El peine es de plástico.:
        native: The comb is made of plastic.
        bases:
          El: The
          peine: comb
          de: of
          plástico: plastic
  es-1176:
    native: towel
    notes:
      n1: 'Toalla is a towel, feminine: la toalla. Use it after the shower or the bath.'
    bases:
      la: the
      toalla: towel
    examples:
      La toalla está húmeda.:
        native: The towel is damp.
        bases:
          La: The
          toalla: towel
      Necesito una toalla limpia.:
        native: I need a clean towel.
        bases:
          una: a
          toalla: towel
  es-1177:
    native: soap
    notes:
      n1: 'Jabón is soap, masculine: el jabón. It is used with water to wash the hands.'
    bases:
      el: the
      jabón: soap
    examples:
      Me lavo las manos con jabón.:
        native: I wash my hands with soap.
        bases:
          Me: myself
          las: the
          con: with
          jabón: soap
      El jabón está en la ducha.:
        native: The soap is in the shower.
        bases:
          El: The
          jabón: soap
          en: in
          la: the
  es-1178:
    native: light bulb
    notes:
      n1: 'Bombilla is a light bulb, feminine: la bombilla. A lamp is a lámpara.'
    bases:
      la: the
      bombilla: light bulb
    examples:
      La bombilla no funciona.:
        native: The light bulb does not work.
        bases:
          La: The
          bombilla: light bulb
          funciona: works
      Cambia la bombilla, por favor.:
        native: Change the light bulb, please.
        bases:
          la: the
          bombilla: light bulb
          por: please
          favor: please
  es-1179:
    native: spoon
