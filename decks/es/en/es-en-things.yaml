          bolsillo: pocket
      Esta moneda es de un euro.:
        native: This coin is one euro.
        bases:
          Esta: This
          moneda: coin
          de: of
          un: a
  es-1187:
    native: broom
    notes:
      n1: 'Escoba is a broom, feminine: la escoba. It is used to sweep the floor.'
    bases:
      la: the
      escoba: broom
    examples:
      Barro el suelo con la escoba.:
        native: I sweep the floor with the broom.
        bases:
          Barro: I sweep
          el: the
          con: with
          la: the
          escoba: broom
      La escoba está detrás de la puerta.:
