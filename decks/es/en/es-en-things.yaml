      n1: 'Pantalla is a screen, feminine: la pantalla. It is on a phone, a computer or a TV.'
    bases:
      la: the
      pantalla: screen
    examples:
      La pantalla del móvil es grande.:
        native: The phone screen is big.
        bases:
          La: The
          pantalla: screen
          del: of the
      Mira la pantalla.:
        native: Look at the screen.
        bases:
          la: the
          pantalla: screen
  es-1186:
    native: coin
    notes:
      n1: 'Moneda is a coin, feminine: la moneda. Paper money is a billete.'
    bases:
      la: the
      moneda: coin
    examples:
      Tengo una moneda en el bolsillo.:
        native: I have a coin in my pocket.
        bases:
          una: a
          moneda: coin
          en: in
