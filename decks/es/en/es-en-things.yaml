    bases:
      la: the
      cuchara: spoon
    examples:
      Como la sopa con una cuchara.:
        native: I eat the soup with a spoon.
        bases:
          la: the
          con: with
          una: a
          cuchara: spoon
      La cuchara está sucia.:
        native: The spoon is dirty.
        bases:
          La: The
          cuchara: spoon
  es-1180:
    native: fork
    notes:
      n1: 'Tenedor is a fork, masculine: el tenedor. Use it with a knife and a spoon.'
    bases:
      el: the
      tenedor: fork
    examples:
      Necesito un tenedor.:
        native: I need a fork.
        bases:
          un: a
          tenedor: fork
      El tenedor está a la izquierda.:
        native: The fork is on the left.
        bases:
          El: The
          tenedor: fork
          a: 'on'
          la: the
  es-1181:
    native: knife
    notes:
      n1: 'Cuchillo is a knife, masculine: el cuchillo. Use it to cut the bread and the meat.'
    bases:
      el: the
      cuchillo: knife
    examples:
      Corta el pan con el cuchillo.:
        native: Cut the bread with the knife.
        bases:
          el: the
          con: with
          cuchillo: knife
          Corta: cut
      El cuchillo está en la mesa.:
        native: The knife is on the table.
        bases:
          El: The
          cuchillo: knife
          en: 'on'
          la: the
  es-1182:
    native: battery
    notes:
      n1: 'Pila is a battery, feminine: la pila. Pila also means a pile, so check the sentence.'
    bases:
      la: the
      pila: battery
    examples:
      Esta pila está vacía.:
        native: This battery is flat.
        bases:
          Esta: This
          pila: battery
      Necesito una pila nueva.:
        native: I need a new battery.
        bases:
          una: a
          pila: battery
  es-1183:
    native: remote control
    notes:
      n1: 'Mando is a remote control, masculine: el mando. It is used for the TV.'
    bases:
      el: the
      mando: remote control
    examples:
      ¿Dónde está el mando?:
        native: Where is the remote control?
        bases:
          el: the
          mando: remote control
      Dame el mando, por favor.:
        native: Give me the remote control, please.
        bases:
          Dame: give me
          el: the
          mando: remote control
          por: please
          favor: please
  es-1184:
    native: photo
