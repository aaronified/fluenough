schema: 1
id: "es-en-verbs-3"
kind: "layer"
core: "es-verbs-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More daily actions"
license: "CC-BY-SA-4.0"
description: "Verbs for a day: waking and getting ready, sitting and staying, thinking and saying, seeing and hearing, giving and lending, and the irregular verbs of everyday life. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-1607":
    native: "to wake (someone)"
    notes: { n1: "Despertar is to wake someone up. Despertarse is to wake up yourself. Its stem changes: despierto." }
    bases: { "despertar": "to wake (someone)" }
    examples:
      "Me despierto a las siete.": { native: "I wake up at seven.", bases: { "Me": "to me", "despierto": "to wake (someone)", "a": "to", "las": "the" } }
      "El ruido despierta al bebé.": { native: "The noise wakes the baby.", bases: { "El": "the", "ruido": "noise", "despierta": "to wake (someone)", "al": "to the" } }
  "es-1608":
    native: "to lift; to raise"
    notes: { n1: "Levantar is to lift or raise something. Levantarse is to get up." }
    bases: { "levantar": "to lift; to raise" }
    examples:
      "Levanto la mano.": { native: "I raise my hand.", bases: { "Levanto": "to lift; to raise", "la": "the" } }
      "Levanto la caja del suelo.": { native: "I lift the box from the floor.", bases: { "Levanto": "to lift; to raise", "la": "the", "del": "of" } }
  "es-1609":
    native: "to comb one's hair"
    notes: { n1: "Peinarse is to comb your own hair. Peinar is to comb someone else's." }
    bases: { "peinarse": "to comb one's hair" }
    examples:
      "Me peino cada mañana.": { native: "I comb my hair every morning.", bases: { "Me": "to me", "peino": "to comb one's hair" } }
      "Ella se peina el pelo largo.": { native: "She combs her long hair.", bases: { "se": "yourself", "peina": "to comb one's hair", "el": "the" } }
  "es-1610":
    native: "to shave"
    notes: { n1: "Afeitarse is to shave yourself." }
    bases: { "afeitarse": "to shave" }
    examples:
      "Me afeito con agua fría.": { native: "I shave with cold water.", bases: { "Me": "to me", "afeito": "to shave", "con": "with" } }
      "Mi padre se afeita los domingos.": { native: "My father shaves on Sundays.", bases: { "se": "yourself", "afeita": "to shave", "los": "the" } }
  "es-1611":
    native: "to brush (one's teeth or hair)"
    notes: { n1: "Cepillarse is to brush your own teeth or hair: cepillarse los dientes." }
    bases: { "cepillarse": "to brush (one's teeth or hair)" }
    examples:
      "Me cepillo los dientes dos veces.": { native: "I brush my teeth twice.", bases: { "Me": "to me", "cepillo": "to brush (one's teeth or hair)", "los": "the" } }
      "Él se cepilla el pelo.": { native: "He brushes his hair.", bases: { "se": "yourself", "cepilla": "to brush (one's teeth or hair)", "el": "the" } }
  "es-1612":
    native: "to count; to tell"
    notes: { n1: "Contar is to count numbers, or to tell a story. Its stem changes: cuento, cuentas." }
    bases: { "contar": "to count; to tell" }
    examples:
      "Cuento hasta diez.": { native: "I count to ten.", bases: { "Cuento": "to count; to tell", "hasta": "until" } }
      "Cuenta una historia.": { native: "She tells a story.", bases: { "Cuenta": "to count; to tell", "una": "a", "historia": "history" } }
  "es-1613":
    native: "to hear"
    notes: { n1: "Oír is to hear, without trying. Its yo form is oigo. Escuchar is to listen." }
    bases: { "oír": "to hear" }
    examples:
      "Oigo un ruido.": { native: "I hear a noise.", bases: { "Oigo": "to hear", "un": "a", "ruido": "noise" } }
      "¿Oyes la música?": { native: "Do you hear the music?", bases: { "Oyes": "to hear", "la": "the", "música": "music" } }
  "es-1614":
    native: "to walk"
    notes: { n1: "Andar is to walk, or to go on foot. Its yo form is ando." }
    bases: { "andar": "to walk" }
    examples:
      "Ando tres kilómetros al día.": { native: "I walk three kilometres a day.", bases: { "Ando": "to walk", "kilómetros": "kilometre", "al": "to the" } }
      "El niño anda bien.": { native: "The child walks well.", bases: { "El": "the", "anda": "to walk" } }
  "es-1615":
    native: "to sit down"
    notes: { n1: "Sentarse is to sit down. Its stem changes: me siento." }
    bases: { "sentarse": "to sit down" }
    examples:
      "Me siento en el sofá.": { native: "I sit down on the sofa.", bases: { "Me": "to me", "siento": "to sit down", "en": "in", "el": "the" } }
      "Nos sentamos a comer.": { native: "We sit down to eat.", bases: { "Nos": "us", "sentamos": "to sit down", "a": "to" } }
  "es-1616":
    native: "to stay"
    notes: { n1: "Quedarse is to stay in a place, or to remain with someone." }
    bases: { "quedarse": "to stay" }
    examples:
      "Me quedo en casa.": { native: "I stay at home.", bases: { "Me": "to me", "quedo": "to stay", "en": "in" } }
      "Se queda con los niños.": { native: "She stays with the children.", bases: { "Se": "yourself", "queda": "to stay", "con": "with", "los": "the" } }
  "es-1617":
    native: "to think"
    notes: { n1: "Pensar is to think. Its stem changes: pienso, piensas. Pensar en is to think about." }
    bases: { "pensar": "to think" }
    examples:
      "Pienso en mis amigos.": { native: "I think about my friends.", bases: { "Pienso": "to think", "en": "in" } }
      "No pienso ir hoy.": { native: "I do not plan to go today.", bases: { "pienso": "to think" } }
  "es-1618":
    native: "to believe; to think"
    notes: { n1: "Creer is to believe, or to think that something is so. Creer en is to believe in." }
    bases: { "creer": "to believe; to think" }
    examples:
      "Creo que llueve.": { native: "I think it is raining.", bases: { "Creo": "to believe; to think", "que": "that" } }
      "¿Crees en mí?": { native: "Do you believe in me?", bases: { "Crees": "to believe; to think", "en": "in", "mí": "me" } }
  "es-1619":
    native: "to feel; to be sorry"
    notes: { n1: "Sentir is to feel something, or to be sorry. Its stem changes: siento, sientes." }
    bases: { "sentir": "to feel; to be sorry" }
    examples:
      "Siento frío.": { native: "I feel cold.", bases: { "Siento": "to feel; to be sorry" } }
      "Lo siento mucho.": { native: "I am very sorry.", bases: { "Lo": "it", "siento": "to feel; to be sorry" } }
  "es-1620":
    native: "to happen"
    notes: { n1: "Ocurrir is to happen. It is used with things, not people. Also suceder." }
    bases: { "ocurrir": "to happen" }
    examples:
      "Ocurre algo raro.": { native: "Something strange happens.", bases: { "Ocurre": "to happen", "raro": "strange; odd" } }
      "¿Qué ocurrió ayer?": { native: "What happened yesterday?", bases: { "ocurrió": "to happen" } }
  "es-1621":
    native: "to fall asleep"
    notes: { n1: "Dormirse is to fall asleep. Its stem changes: me duermo, te duermes." }
    bases: { "dormirse": "to fall asleep" }
    examples:
      "Me duermo temprano.": { native: "I fall asleep early.", bases: { "Me": "to me", "duermo": "to fall asleep" } }
      "El bebé se duerme en el coche.": { native: "The baby falls asleep in the car.", bases: { "El": "the", "se": "yourself", "duerme": "to fall asleep", "en": "in" } }
  "es-1622":
    native: "to put on make-up"
    notes: { n1: "Maquillarse is to put on make-up. Its noun is maquillaje." }
    bases: { "maquillarse": "to put on make-up" }
    examples:
      "Me maquillo para la fiesta.": { native: "I put on make-up for the party.", bases: { "Me": "to me", "maquillo": "to put on make-up", "para": "for", "la": "the" } }
      "Ella se maquilla cada día.": { native: "She puts on make-up every day.", bases: { "se": "yourself", "maquilla": "to put on make-up" } }
  "es-1623":
    native: "to take out; to get"
    notes: { n1: "Sacar is to take something out, to get a grade, or to take a photo." }
    bases: { "sacar": "to take out; to get" }
    examples:
      "Saco el dinero del banco.": { native: "I take the money out of the bank.", bases: { "Saco": "to take out; to get", "el": "the", "del": "of" } }
      "Saco fotos en la playa.": { native: "I take photos at the beach.", bases: { "Saco": "to take out; to get", "en": "in", "la": "the" } }
  "es-1624":
    native: "to put in"
    notes: { n1: "Meter is to put something inside. It is the opposite of sacar." }
    bases: { "meter": "to put in" }
    examples:
      "Meto la ropa en la maleta.": { native: "I put the clothes in the suitcase.", bases: { "Meto": "to put in", "la": "the", "en": "in" } }
      "Mete la llave en la puerta.": { native: "Put the key in the door.", bases: { "Mete": "to put in", "la": "the", "en": "in" } }
  "es-1625":
    native: "to see; to watch"
    notes: { n1: "Ver is to see, or to watch a programme. Its yo form is veo." }
    bases: { "ver": "to see; to watch" }
    examples:
      "Veo la televisión.": { native: "I watch television.", bases: { "Veo": "to see; to watch", "la": "the", "televisión": "television" } }
      "¿Ves el mar?": { native: "Can you see the sea?", bases: { "Ves": "to see; to watch", "el": "the", "mar": "sea" } }
  "es-1626":
    native: "to dream"
    notes: { n1: "Soñar is to dream, when asleep or about a hope. Its stem changes: sueño, sueñas." }
    bases: { "soñar": "to dream" }
    examples:
      "Sueño con el mar.": { native: "I dream about the sea.", bases: { "Sueño": "to dream", "con": "with", "el": "the", "mar": "sea" } }
      "Sueña con viajar.": { native: "She dreams of travelling.", bases: { "Sueña": "to dream", "con": "with", "viajar": "to travel" } }
  "es-1627":
    native: "to say; to tell"
    notes: { n1: "Decir is to say or to tell. Its yo form is digo, and its past is dije." }
    bases: { "decir": "to say; to tell" }
    examples:
      "Digo la verdad.": { native: "I tell the truth.", bases: { "Digo": "to say; to tell", "la": "the", "verdad": "truth" } }
      "¿Qué dices": { native: "What do you say?", bases: { "dices": "to say; to tell" } }
  "es-1628":
    native: "to put; to set; to turn on"
    notes: { n1: "Poner is to put something down, to set a table, or to turn something on. Its yo form is pongo." }
    bases: { "poner": "to put; to set; to turn on" }
    examples:
      "Pongo la mesa.": { native: "I set the table.", bases: { "Pongo": "to put; to set; to turn on", "la": "the" } }
      "Pongo la radio.": { native: "I turn on the radio.", bases: { "Pongo": "to put; to set; to turn on", "la": "the", "radio": "radio" } }
  "es-1629":
    native: "to give"
    notes: { n1: "Dar is to give. Its yo form is doy. Dar un paseo is to go for a walk." }
    bases: { "dar": "to give" }
    examples:
      "Doy un paseo por la tarde.": { native: "I go for a walk in the afternoon.", bases: { "Doy": "to give", "un": "a", "por": "for", "la": "the" } }
      "Te doy las gracias.": { native: "I thank you.", bases: { "Te": "you", "doy": "to give", "las": "the", "gracias": "thank you" } }
  "es-1630":
    native: "to know (a fact)"
    notes: { n1: "Saber is to know a fact or how to do something. Its yo form is sé. Conocer is to know a person or a place." }
    bases: { "saber": "to know (a fact)" }
    examples:
      "Sé la respuesta.": { native: "I know the answer.", bases: { "Sé": "to know (a fact)", "la": "the", "respuesta": "answer" } }
      "¿Sabes dónde está?": { native: "Do you know where it is?", bases: { "Sabes": "to know (a fact)" } }
  "es-1631":
    native: "to know (a person or place)"
    notes: { n1: "Conocer is to know a person, a place or a book. Its yo form is conozco." }
    bases: { "conocer": "to know (a person or place)" }
    examples:
      "Conozco a tus padres.": { native: "I know your parents.", bases: { "Conozco": "to know (a person or place)", "a": "to", "tus": "your" } }
      "Conozco un buen restaurante.": { native: "I know a good restaurant.", bases: { "Conozco": "to know (a person or place)", "un": "a" } }
  "es-1632":
    native: "to come"
    notes: { n1: "Venir is to come towards the speaker. Its yo form is vengo." }
    bases: { "venir": "to come" }
    examples:
      "Vengo a clase en autobús.": { native: "I come/comer to class by bus.", bases: { "Vengo": "to come", "a": "to", "en": "in" } }
      "¿Vienes con nosotros?": { native: "Are you coming with us?", bases: { "Vienes": "to come", "con": "with" } }
  "es-1633":
    native: "to be able to; can"
    notes: { n1: "Poder is to be able to, or to be allowed. Its stem changes: puedo, puedes." }
    bases: { "poder": "to be able to; can" }
    examples:
      "Puedo hablar contigo.": { native: "I can talk to you.", bases: { "Puedo": "to be able to; can", "contigo": "with you" } }
      "No puedo dormir.": { native: "I cannot sleep.", bases: { "puedo": "to be able to; can" } }
  "es-1634":
    native: "to hand in; to deliver"
    notes: { n1: "Entregar is to hand something over, or to deliver it." }
    bases: { "entregar": "to hand in; to deliver" }
    examples:
      "Entrego el trabajo el lunes.": { native: "I hand in the work on Monday.", bases: { "Entrego": "to hand in; to deliver", "el": "the" } }
      "Entregan los paquetes en casa.": { native: "They deliver the parcels at home.", bases: { "Entregan": "to hand in; to deliver", "los": "the", "en": "in" } }
  "es-1635":
    native: "to show"
    notes: { n1: "Mostrar is to show something to someone. Its stem changes: muestro, muestras." }
    bases: { "mostrar": "to show" }
    examples:
      "Muestro mis fotos.": { native: "I show my photos.", bases: { "Muestro": "to show" } }
      "¿Me muestras el mapa?": { native: "Can you show me the map?", bases: { "Me": "to me", "muestras": "to show", "el": "the" } }
  "es-1636":
    native: "to drive"
    notes: { n1: "Conducir is to drive a car. Its yo form is conduzco." }
    bases: { "conducir": "to drive" }
    examples:
      "Conduzco un coche.": { native: "I drive a car.", bases: { "Conduzco": "to drive", "un": "a" } }
      "Conduce despacio.": { native: "She drives slowly.", bases: { "Conduce": "to drive" } }
  "es-1637":
    native: "to grow"
    notes: { n1: "Crecer is to grow, as a child or a plant. Its yo form is crezco." }
    bases: { "crecer": "to grow" }
    examples:
      "Crezco cada día.": { native: "I grow every day.", bases: { "Crezco": "to grow" } }
      "Mi hijo crece rápido.": { native: "My son/ser grows fast.", bases: { "crece": "to grow" } }
