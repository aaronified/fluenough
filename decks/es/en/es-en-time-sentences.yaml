description: "Thirteen sentences about the time of day, appointments and daily routines, with the words each is often mixed up with. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-0853":
    native: "The meeting starts at nine."
    bases: {"La": "the", "a": "to", "las": "the"}
    confusables: {"cita": { why: "Cita is an appointment, a set time with someone." }, "durar": { why: "Durar is to last, how long something takes." }}
  "es-0854":
    native: "I have an appointment at three."
    bases: {"una": "a", "a": "to", "las": "the"}
    confusables: {"hora": { why: "Hora is an hour, the time of day." }, "minuto": { why: "Minuto is a minute, a smaller time." }}
  "es-0855":
    native: "The bank is closed today."
    bases: {"El": "the"}
    confusables: {"abierto": { why: "Abierto is open, the opposite of cerrado." }, "cerrar": { why: "Cerrar is to close, the verb." }}
  "es-0856":
    native: "I arrive on time at midday."
    bases: {"al": "to the"}
    confusables: {"medianoche": { why: "Medianoche is midnight, not midday." }, "temprano": { why: "Temprano is early, not on time." }}
  "es-0857":
    native: "Lunch lasts an hour."
    bases: {"El": "the", "una": "a"}
    confusables: {"reloj": { why: "Reloj is a clock or a watch, an object." }, "minuto": { why: "Minuto is a minute, a shorter time." }}
  "es-0858":
    native: "We have dinner before midnight."
    bases: {"de": "of", "la": "the"}
    confusables: {"manana": { why: "Mañana is a morning, not night." }, "noche": { why: "Noche is the night, close to midnight." }}
  "es-3520":
    native: "My name is Carmen and I have an appointment."
    bases: {"nombre": "name", "Carmen": "Carmen", "una": "an"}
    confusables: {"hora": { why: "Hora is an hour, or the time of day, not an appointment." }, "minuto": { why: "Minuto is a minute, a short time." }}
  "es-3521":
    native: "I have breakfast early every day."
    bases: {"los": "the"}
    confusables: {"comer": { why: "Comer is to eat; breakfast is desayunar." }, "cena": { why: "La cena is dinner, the evening meal, not breakfast." }}
  "es-3522":
    native: "At what time does today's meeting start?"
    bases: {"A": "At", "la": "the", "de": "of"}
    confusables: {"minuto": { why: "Minuto is a minute, a short time, not the moment something starts." }, "reloj": { why: "Reloj is a clock or a watch, an object." }}
  "es-3523":
    native: "I drink coffee in the morning."
    bases: {"por": "in", "la": "the"}
    confusables: {"tomar": { why: "Tomar is to take or have, as in having a drink; beber is to drink." }, "comer": { why: "Comer is to eat, not to drink." }}
  "es-3524":
    native: "I do not work in the morning."
    bases: {"por": "in", "la": "the"}
    confusables: {"estudiar": { why: "Estudiar is to study, not to work." }, "noche": { why: "La noche is the night, not the morning." }}
  "es-3525":
    native: "What time do you have dinner?"
    bases: {"A": "At"}
    confusables: {"comer": { why: "Comer is to eat, a general verb; the verb for dinner is cenar." }, "desayunar": { why: "Desayunar is to have breakfast, not dinner." }}
  "es-3527":
    native: "I am Tomás and I eat at midday."
    bases: {"Tomás": "Tomás", "al": "at"}
    confusables: {"desayunar": { why: "Desayunar is to have breakfast, not lunch at midday." }, "medianoche": { why: "La medianoche is midnight, not midday." }}
