schema: 1
id: "es-en-relationships-sentences"
kind: "layer"
core: "es-relationships-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences: relationships"
license: "CC-BY-SA-4.0"
description: "Six sentences about friends and neighbours, with the words each is often mixed up with. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-2758":
    notes:
      "n1": "Lo is an object pronoun placed before the verb: lo saludo, I greet him."
    native: "I trust my neighbour and greet him every day."
    bases: { "en": "in", "lo": "it" }
    confusables: { "confianza": { why: "Confianza is trust, the feeling itself." }, "apoyo": { why: "Apoyo is support, the help given." } }
  "es-2759":
    notes:
      "n1": "Pedir disculpas literally means to ask for apologies, and it is how Spanish says to apologise."
    native: "I apologise to you for the fight."
    bases: { "Te": "you", "por": "for", "la": "the" }
    confusables: { "perdonar": { why: "Perdonar is to forgive, the reply." }, "reconciliarse": { why: "Reconciliarse is to make up, the goal." } }
  "es-2760":
    notes:
      "n1": "Ser describes a lasting quality: es sincera y leal, she is sincere and loyal."
    native: "My friend is sincere and loyal."
    bases: { "amiga": "friend" }
    confusables: { "amable": { why: "Amable is kind, a pleasant manner." }, "generoso": { why: "Generoso is generous, with things and time." } }
  "es-2761":
    notes:
      "n1": "Estar says where people or things are: están en el vecindario, they are in the neighbourhood."
    native: "The enemy and the acquaintance are in the neighbourhood."
    bases: { "El": "the", "en": "in" }
    confusables: { "colega": { why: "Colega is a colleague, a person at work." }, "amigo": { why: "Amigo is a friend, someone close." } }
  "es-2762":
    notes:
      "n1": "Le is the pronoun for to her, placed before the verb, and a mi madre names the mother as well."
    native: "I give my mother a hug and a kiss."
    bases: { "Le": "him; her; to him", "un": "a", "a": "to" }
    confusables: { "saludo": { why: "Saludo is a greeting, a word or a gesture." }, "agradecimiento": { why: "Agradecimiento is thanks, a feeling of gratitude." } }
  "es-2763":
    notes:
      "n1": "Llevarse bien con means to get on well with someone: con gives the person."
    native: "I get on well with my neighbours."
    bases: { "Me": "to me", "con": "with" }
    confusables: { "amistad": { why: "Amistad is friendship, a bond with someone close." }, "respeto": { why: "Respeto is respect, a good opinion of others." } }
  "es-4657":
    native: "Excuse me."
    notes:
      "n1": "Disculpe is the formal form, with usted, for a stranger; perdón is the everyday word for a small slip."
    bases: { "Disculpe": "excuse me" }
