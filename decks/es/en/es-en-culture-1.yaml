description: "Six short items from Spanish literature, from the Middle Ages to the Golden Age, in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by a Spanish speaker: please report any mistake."

cards:
  "es-4000":
    native: "Let the sleeping soul remember, and let the mind wake up."
    notes:
      "n1": "The first stanza of Jorge Manrique's lament for his father. Avivar means to revive or wake up, so the poet tells his own mind to come alive again."
    bases:
      "Recuerde": "remember (here: let it remember)"
      "el": "the"
      "alma": "soul"
      "dormida": "asleep (agrees with alma)"
      "avive": "let it revive"
      "seso": "mind, wits"
      "y": "and"
      "despierte": "let it wake up"
  "es-4001":
    native: "In a village in La Mancha, whose name I do not want to remember."
    notes:
      "n1": "The first line of the novel. The narrator will not say which village it was, so the place stays unnamed."
    bases:
      "En": "in"
      "un": "a"
      "lugar": "place, village"
      "de": "of"
      "la": "the"
      "Mancha": "La Mancha, a region of central Spain"
      "cuyo": "whose"
      "nombre": "name"
      "no": "not"
      "quiero": "I want"
      "acordarme": "to remember"
  "es-4002":
    native: "On a dark night, burning with longing and love, oh happy fortune!"
    notes:
      "n1": "The first stanza of a mystical poem by John of the Cross. The soul leaves its house by night in secret, and it calls this escape a happy chance. The love in the poem is the soul's love for God."
    bases:
      "En": "on, in"
      "una": "a"
      "noche": "night"
      "oscura": "dark"
      "con": "with"
      "ansias": "longing"
      "amores": "love"
      "inflamada": "burning"
      "oh": "oh"
      "dichosa": "happy"
      "ventura": "fortune, chance"
  "es-4003":
    native: "What is life? A frenzy; an illusion, a shadow, a fiction."
    notes:
      "n1": "Segismundo, the prince of the play, asks this in his long speech about life and dreams. Frenesí is a word for madness or a wild frenzy."
    bases:
      "Qué": "what"
      "es": "is"
      "la": "the"
      "vida": "life"
      "Un": "a"
      "frenesí": "frenzy"
      "Una": "an"
      "ilusión": "illusion"
      "sombra": "shadow"
      "ficción": "fiction"
  "es-4004":
    native: "Weeping so hard from his eyes."
    notes:
      "n1": "The first verse of the Cantar de mio Cid. The 1779 print has older spelling (sos, oios, mientre, lorando); the card shows it in modern spelling."
    bases:
      "De": "from"
      "los": "the"
      "sus": "his"
      "ojos": "eyes"
      "tan": "so"
      "fuertemente": "hard, strongly"
      "llorando": "weeping"
  "es-4005":
    native: "Duke Octavio, this way you can leave more safely."
    notes:
      "n1": "Isabela, a duchess, speaks this line in the first act of Tirso de Molina's play, in the royal palace in Naples. She thinks she is speaking to Duke Octavio, but the man is Don Juan, who is pretending to be him. She tells him that this way he can leave more safely."
    bases:
      "Duque": "duke"
      "Octavio": "Octavio, the duke's name"
      "por": "this way, through"
      "aquí": "here"
      "podrás": "you can"
      "salir": "to leave"
      "más": "more"
      "seguro": "safely"
