  "es-4008":
    native: "I know who I am, answered Don Quijote, and I know that I could be not only those I have named, but all the twelve peers of France."
    notes:
      "n1": "Don Quijote says this in chapter V. He goes on to say that he could be not only those he has named, but all the Twelve Peers of France, the heroes of the old stories."
