  "es-4018":
    native: "He came to call her Dulcinea del Toboso, because she was a native of El Toboso."
    notes:
      "n1": "From chapter I of Don Quijote. The knight gives a village girl, Aldonza Lorenzo, the title of lady of his thoughts, and he names her Dulcinea del Toboso, a grand name for a woman from El Toboso."
