      "ilusión": "illusion"
      "sombra": "shadow"
      "ficción": "fiction"
  "es-4004":
    native: "Weeping so hard from his eyes."
    notes:
      "n1": "The first verse of the Cantar de mio Cid. The 1779 print has older spelling (sos, oios, mientre, lorando); the card shows it in modern spelling."
    bases:
      "De": "from"
      "los": "the"
      "sus": "his"
      "ojos": "eyes"
      "tan": "so"
      "fuertemente": "hard, strongly"
      "llorando": "weeping"
  "es-4005":
    native: "Duke Octavio, this way you can leave more safely."
    notes:
      "n1": "Isabela, a duchess, speaks this line in the first act of Tirso de Molina's play, in the royal palace in Naples. She thinks she is speaking to Duke Octavio, but the man is Don Juan, who is pretending to be him. She tells him that this way he can leave more safely."
    bases:
      "Duque": "duke"
      "Octavio": "Octavio, the duke's name"
      "por": "this way, through"
      "aquí": "here"
      "podrás": "you can"
      "salir": "to leave"
      "más": "more"
      "seguro": "safely"
  "es-4006":
    native: "The last shadow, which will take the white day from me, will be able to close my eyes."
    notes:
      "n1": "The first two lines of the sonnet Amor constante más allá de la muerte (Constant love beyond death) by Francisco de Quevedo, printed in El Parnaso español in 1648, three years after the poet died. The speaker says that death will close his eyes, but his love will go on; llevare is a future subjunctive form of llevar, to carry. In this line me means from me, and it is the day that is taken."
    bases:
      "Cerrar": "to close"
      "podrá": "will be able"
      "mis": "my"
      "ojos": "eyes"
      "la": "the"
      "postrera": "last"
      "sombra": "shadow"
