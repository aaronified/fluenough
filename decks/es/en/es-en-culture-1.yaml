      "me": "me"
      "llevare": "will take (away)"
      "el": "the"
      "blanco": "white"
      "día": "day"
  "es-4007":
    native: "Not long ago there lived a country gentleman, with a lance in a rack, an old shield, a thin nag and a greyhound."
    notes:
      "n1": "A hidalgo is a man of minor noble rank. A lanza en astillero is a lance kept on a rack at home, not used in battle. The list of his worn-out things (a lance in a rack, an old shield, a thin nag, a greyhound) shows that he is poor, although he is not a knight."
