description: "Four short items from Spanish literature, from the Middle Ages to the Golden Age, in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by a Spanish speaker: please report any mistake."

cards:
  "es-4000":
    native: "Let the sleeping soul remember, and let the mind wake up."
    notes:
      "n1": "The first stanza of Jorge Manrique's lament for his father. Avivar means to revive or wake up, so the poet tells his own mind to come alive again."
    bases:
      "Recuerde": "remember (here: let it remember)"
      "el": "the"
      "alma": "soul"
      "dormida": "asleep (agrees with alma)"
      "avive": "let it revive"
      "seso": "mind, wits"
      "y": "and"
      "despierte": "let it wake up"
  "es-4001":
    native: "In a village in La Mancha, whose name I do not want to remember."
    notes:
      "n1": "The first line of the novel. The narrator will not say which village it was, so the place stays unnamed."
    bases:
      "En": "in"
      "un": "a"
      "lugar": "place, village"
      "de": "of"
      "la": "the"
      "Mancha": "La Mancha, a region of central Spain"
      "cuyo": "whose"
      "nombre": "name"
      "no": "not"
      "quiero": "I want"
      "acordarme": "to remember"
  "es-4002":
    native: "On a dark night, burning with longing and love, oh happy fortune!"
    notes:
      "n1": "The first stanza of a mystical poem by John of the Cross. The soul leaves its house by night in secret, and it calls this escape a happy chance. The love in the poem is the soul's love for God."
    bases:
      "En": "on"
      "una": "a"
      "noche": "night"
      "oscura": "dark"
      "con": "with"
      "ansias": "longing"
      "en": "in"
      "amores": "love"
      "inflamada": "burning"
      "oh": "oh"
      "dichosa": "happy"
      "ventura": "fortune, chance"
  "es-4003":
    native: "What is life? A frenzy. What is life? An illusion, a shadow, a fiction."
    notes:
      "n1": "Segismundo, the prince of the play, asks this in his long speech about life and dreams. Frenesí is a word for madness or a wild frenzy."
    bases:
      "Qué": "what"
      "es": "is"
      "la": "the"
      "vida": "life"
      "Un": "a"
      "frenesí": "frenzy"
      "Una": "an"
      "ilusión": "illusion"
      "una": "a"
      "sombra": "shadow"
      "ficción": "fiction"
