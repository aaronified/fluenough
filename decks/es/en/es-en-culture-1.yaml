  "es-4014":
    native: "How restful is the life of the one who flees the noise of the world"
    notes:
      "n1": "The first lines of Vida retirada, a poem by Fray Luis that praises a quiet life away from the world. Mundanal ruido means the noise of the world, a phrase that is often quoted."
