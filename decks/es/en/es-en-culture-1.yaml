  "es-4010":
    native: "Happy was that age and those happy centuries, to which the ancients gave the name of golden."
    notes:
      "n1": "The speech praises the Golden Age (edad de oro), a time before greed. Dorados is the word for golden, and siglos dichosos means happy centuries."
