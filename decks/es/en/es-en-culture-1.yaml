      "otra": "another"
      "abre": "opens"
  "es-4012":
    native: "Everyone is the son of his own works, and being a man, I could become a pope."
    notes:
      "n1": "Sancho says this in chapter XLVII, when he talks about wanting an island to govern. Each one is the son of his works means that a person's worth comes from what he does."
    bases:
