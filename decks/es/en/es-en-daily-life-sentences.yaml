kind: layer
core: es-daily-life-sentences
native:
  code: en
  iso639_3: eng
  name: English
name: 'Sentences: a day'
license: CC-BY-SA-4.0
description: 'Nine sentences about a day, with the words each is often mixed up with. Not yet checked by a Spanish speaker: please report any mistake.'
cards:
  es-0942:
    notes:
      "n1": "The reflexive pronoun goes before the conjugated verb: me levanto, I get up."
    native: I get up, shower and have breakfast.
    bases:
      Me: myself
    confusables:
      wake-up:
        why: Despertarse is to wake up; levantarse is to get up out of bed.
      go-to-bed:
        why: Acostarse is to go to bed, the opposite end of the day.
  es-0943:
    notes:
      "n1": "Después takes de before a noun, as in después de la cena, after dinner."
    native: Ana rests after dinner.
    bases:
      Ana: Ana
      de: (linking word)
      la: the
    confusables:
      sleep:
        why: Dormir is to sleep; descansar is to rest, which is not the same.
      walk:
        why: Pasear is to go for a walk; descansar is to rest.
  es-0944:
    notes:
      "n1": "Por marks the time of day: por la mañana, in the morning."
    native: In the morning I have a coffee in the kitchen.
    bases:
      Por: In
      la: the
      un: a
      en: in
    confusables:
      afternoon:
        why: La tarde is the afternoon, a different part of the day.
      breakfast:
        why: El desayuno is breakfast, the meal itself.
  es-0945:
    notes:
      "n1": "Al is a plus el, used before a masculine noun: al gimnasio, to the gym."
    native: I arrive late at the gym today.
    bases:
      al: to the
    confusables:
      return:
        why: Volver is to return, to go back somewhere.
      wait:
        why: Esperar is to wait; the sentence says you arrive late.
  es-0946:
    notes:
      "n1": "Vuelve is volver, which changes its stem o to ue: vuelve, returns."
    native: My sister returns home at six.
    bases:
      hermana: sister
      a: to
      las: (at)
    confusables:
      take:
        why: Tomar is to take or have something, not to come back.
      rest:
        why: Descansar is to rest; here she comes back home.
  es-0947:
    notes:
      "n1": "Acuesto is acostarse, which changes its stem o to ue: me acuesto, I go to bed."
    native: I am sleepy, so I go to bed early.
    bases:
      así: so
      que: that
      me: myself
    confusables:
      bed:
        why: La cama is the bed itself; the sentence is about going to bed.
      sleep-verb:
        why: Dormir is to sleep, not to go to bed.
  es-0948:
    notes:
      "n1": "The plural article with a day means every week: los domingos, on Sundays."
    native: We walk in the park on Sundays.
    bases:
      en: in
      el: the
      los: 'on'
      domingos: Sundays
    confusables:
      walk-noun:
        why: Un paseo is a walk, the noun; this sentence uses the verb.
      rest:
        why: Descansar is to rest, not to walk.
  es-0949:
    notes:
      "n1": "Comida can mean food or the main meal, depending on the context."
    native: I buy food at the supermarket.
    bases:
      la: the
      en: at
      el: the
    confusables:
      shopping:
        why: 'La compra is the shopping: what you buy, not food.'
      kitchen:
        why: La cocina is the kitchen, a room in the house.
  es-0950:
    notes:
      "n1": "Grande usually follows its noun, as in un sofá grande, while gran goes before one: un gran sofá."
    native: The living room has a big sofa.
    bases:
      El: The
      un: a
    confusables:
      bed:
        why: La cama is a bed, not a sofa.
      kitchen:
        why: La cocina is the kitchen, another room of the house.
