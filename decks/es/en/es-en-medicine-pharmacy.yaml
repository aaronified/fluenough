schema: 1
id: "es-en-medicine-pharmacy"
kind: "layer"
core: "es-medicine-pharmacy"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Medicine: at the pharmacy"
license: "CC-BY-SA-4.0"
description: "Words and phrases for buying medicine: asking for something for a symptom, the prescription, and how and when to take it."
cards:
  "es-4671":
    native: "I need something for a headache."
    notes: { n1: "Para introduces a purpose: something for the headache." }
  "es-4672":
    native: "Do you have something for a cough?"
    notes: { n1: "Tiene is the usted form: you ask a pharmacist with usted." }
  "es-4673":
    native: "Do you have a prescription?"
    notes: { n1: "After tener, a noun often has no article, as in tiene receta, which asks whether one exists." }
  "es-4674":
    native: "How often do I have to take it?"
    notes: { n1: "Lo is attached to the verb: tomarlo means to take it." }
  "es-4675":
    native: "Take it with food."
    notes: { n1: "Tómelo is the usted command; lo means the medicine." }
  "es-4676":
    native: "Are there any side effects?"
    notes: { n1: "Algún is the short form of alguno, used before a masculine singular noun." }
  "es-4677":
    native: "I cannot take ibuprofen."
    notes: { n1: "Poder plus an infinitive means can or be able to: puedo tomar, I can take." }
  "es-4678":
    native: "It is for the allergy."
    notes: { n1: "Alergia is feminine, so it takes la." }
  "es-4679":
    native: "dose"
    notes: { n1: "Dosis is feminine, so it takes la." }
    bases: { "la": "the", "dosis": "dose" }
    examples:
      "La dosis es de dos pastillas diarias.": { native: "The dose is two tablets a day.", bases: { "La": "the", "dosis": "dose", "es": "is", "de": "of", "dos": "two", "pastillas": "tablets", "diarias": "daily" } }
      "¿Cuál es la dosis para un niño?": { native: "What is the dose for a child?", bases: { "Cuál": "which", "es": "is", "la": "the", "dosis": "dose", "para": "for", "un": "a", "niño": "child" } }
  "es-4680":
    native: "antibiotic"
    notes: { n1: "Antibiótico is masculine, so it takes el." }
    bases: { "el": "the", "antibiótico": "antibiotic" }
    examples:
      "El médico me recetó un antibiótico.": { native: "The doctor prescribed me an antibiotic.", bases: { "El": "the", "médico": "doctor", "me": "me", "recetó": "prescribed", "un": "a", "antibiótico": "antibiotic" } }
      "El antibiótico es para la infección.": { native: "The antibiotic is for the infection.", bases: { "El": "the", "antibiótico": "antibiotic", "es": "is", "para": "for", "la": "the", "infección": "infection" } }
