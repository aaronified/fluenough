schema: 1
id: "es-en-hospitality-restaurant"
kind: "layer"
core: "es-hospitality-restaurant"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hospitality: restaurant service"
license: "CC-BY-SA-4.0"
description: "Words and phrases for eating out: booking a table, ordering, asking for the bill and asking for things at the table."
cards:
  "es-4690":
    native: "A table for two, please."
    notes: { n1: "Para with a number of people means for that many, as in para dos." }
  "es-4691":
    native: "What do you recommend?"
    notes: { n1: "Recomienda is the usted form, used with a waiter." }
  "es-4692":
    native: "Do you have anything gluten-free?"
    notes: { n1: "Tiene is the usted form of tener, the polite way to speak to a waiter." }
  "es-4693":
    native: "The chicken for me, please."
    notes: { n1: "Mí, with an accent, is the pronoun after para; mi without an accent means my." }
  "es-4694":
    native: "Could you bring us the bill, please?"
    notes: { n1: "The indirect pronoun nos goes before the verb: nos trae, brings us." }
  "es-4695":
    native: "Do you take cards?"
    notes: { n1: "Aceptan is the ustedes form, so no pronoun is needed." }
  "es-4696":
    native: "Sorry, there is no chicken left."
    notes: { n1: "Quedar means to be left over, so queda pollo means no chicken remains." }
  "es-4697":
    native: "Could you bring me another napkin, please?"
    notes: { n1: "The indirect pronoun me goes before the verb: me trae, brings me." }
  "es-4698":
    native: "It is very tasty."
    notes: { n1: "Estar describes a state, here how the food tastes at the moment." }
