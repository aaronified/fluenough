schema: 1
id: "es-en-hobbies-sentences"
kind: "layer"
core: "es-hobbies-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences: hobbies"
license: "CC-BY-SA-4.0"
description: "Thirty-one sentences about free time and clubs, with the words each is often mixed up with. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-1438":
    notes:
      "n1": "Gustar works backwards: the thing liked is the subject, so the verb agrees with it, and the person is a pronoun (me, te, le)."
    native: "I like playing football with my friends."
    bases: { "Me": "to me", "al": "to the", "con": "with" }
    confusables: { "equipo": { why: "Equipo is the team you play with, not the game." }, "club": { why: "Club is the group you join to play together." } }
  "es-1439":
    notes:
      "n1": "Tocar is used for playing an instrument, while sports take jugar, as in toco la guitarra."
    native: "I play the guitar at the concert."
    bases: { "la": "the", "en": "in", "el": "the" }
    confusables: { "cantar": { why: "Cantar is to sing, not to play an instrument." }, "baile": { why: "Baile is dancing, not music." } }
  "es-1440":
    notes:
      "n1": "Lo is an object pronoun, and it comes before the conjugated verb: lo pongo, I put it."
    native: "I paint a picture and put it on the wall."
    bases: { "un": "a", "cuadro": "picture", "lo": "it", "pongo": "to put", "en": "in", "la": "the" }
    confusables: { "dibujo": { why: "Dibujo is a drawing with a pencil, not paint." }, "fotografia": { why: "Fotografía is a photograph, made with a camera." } }
  "es-1441":
    notes:
      "n1": "Para marks the purpose or benefit: good for health, para la salud."
    native: "Swimming is good for health."
    bases: { "La": "the", "para": "for", "salud": "health" }
    confusables: { "piscina": { why: "Piscina is the pool, the place to swim." }, "escalar": { why: "Escalar is to climb, not to swim." } }
  "es-1442":
    notes:
      "n1": "Spanish joins one noun to another with de, so revista de cine is a film magazine."
    native: "I read a film magazine every week."
    bases: { "una": "a", "de": "of" }
    confusables: { "serie": { why: "Serie is a TV series, not a magazine." }, "libro": { why: "Libro is a book, a longer text." } }
  "es-1443":
    notes:
      "n1": "Divertirse is reflexive, so the pronoun me comes before the verb: me divierto, I have fun."
    native: "I have a lot of fun in the chess club."
    bases: { "Me": "to me", "en": "in", "el": "the", "de": "of" }
    confusables: { "aburrido": { why: "Aburrido is bored, the opposite of having fun." }, "tiempo": { why: "Tiempo is time or weather, not fun." } }
  "es-3360":
    notes:
      "n1": "Yo is added for emphasis, since toco already shows that the subject is I."
    native: "I play the guitar at my house."
    bases: { "la": "the", "en": "in" }
    confusables: { "es-1409": { why: "Violín is a different instrument, not the guitar." }, "es-1425": { why: "Canción is a song, not an instrument you play." } }
  "es-3361":
    notes:
      "n1": "A yes or no question keeps the word order of a statement and opens with ¿, as in ¿Tocas el piano, do you play the piano."
    native: "Do you play the piano at school?"
    bases: { "el": "the", "en": "at", "la": "the" }
    confusables: { "es-1409": { why: "Violín is a different instrument, not the piano." }, "concierto": { why: "Concierto is a concert, not an instrument you play." } }
  "es-3362":
    notes:
      "n1": "When nunca comes before the verb, no second no is added, as in nunca compro."
    native: "I never buy football magazines."
    bases: { "de": "of" }
    confusables: { "libro": { why: "Libro is a book, a longer text, not a magazine." }, "tienda": { why: "Tienda is a shop, where you buy, not what you buy." } }
  "es-3363":
    notes:
      "n1": "The a before mis hermanos marks the people being taught, the indirect object."
    native: "My father teaches chess to my brothers."
    bases: { "el": "the", "a": "to" }
    confusables: { "deporte": { why: "Deporte is a sport; chess is a game, not a sport." }, "videojuego": { why: "Videojuego is a video game, not chess." } }
  "es-3364":
    notes:
      "n1": "Gustar works backwards: the thing liked is the subject, so the verb agrees with it, and the person is a pronoun (me, te, le)."
    native: "What sport do you like best?"
    bases: { "te": "to you" }
    confusables: { "es-1400": { why: "Afición is a hobby or interest, not a sport." }, "club": { why: "Club is a group you join, not a sport." } }
  "es-3365":
    notes:
      "n1": "Estar with the -ando or -iendo form shows an action in progress: estoy leyendo, I am reading."
    native: "I am reading a magazine."
    bases: { "una": "a" }
    confusables: { "es-1410": { why: "Fotografía is a photograph, not a magazine." }, "libro": { why: "Libro is a book, not a magazine." } }
  "es-3366":
    notes:
      "n1": "Ser describes a lasting quality, so it takes es with bueno: es muy bueno, it is very good."
    native: "My team is very good."
    bases: {  }
    confusables: { "club": { why: "Club is the place you join, not a team." }, "amigo": { why: "Amigo is a friend, not a team." } }
  "es-3367":
    notes:
      "n1": "Quién takes an accent as a question word, while quien without one is a relative word, who."
    native: "Who sings at the concert?"
    bases: { "en": "at", "el": "the" }
    confusables: { "escuchar": { why: "Escuchar is to listen, not to sing." }, "bailar": { why: "Bailar is to dance, not to sing." } }
  "es-3368":
    notes:
      "n1": "Bailé is the preterite, the past tense for a finished action at a stated time (ayer)."
    native: "Yesterday I danced with my friends at the concert."
    bases: { "con": "with", "en": "at", "el": "the" }
    confusables: { "es-1425": { why: "Canción is a song, not a dance." }, "baile": { why: "Baile is a dance, not a concert." } }
  "es-3369":
    notes:
      "n1": "Costar works like gustar: the thing that is hard is the subject, so me cuesta means it is hard for me."
    native: "I learn yoga at the gym, but it is very hard for me."
    bases: { "en": "at", "el": "the", "me": "for me" }
    confusables: { "piscina": { why: "Piscina is a swimming pool, not yoga." }, "es-1434": { why: "Natación is swimming, not yoga." } }
  "es-3370":
    notes:
      "n1": "A and el join into al, as in al club, to the club."
    native: "When do you go to the club?"
    bases: { "al": "to the" }
    confusables: { "equipo": { why: "Equipo is the team, not the club you go to." }, "escuela": { why: "Escuela is a school, not a club." } }
  "es-3371":
    notes:
      "n1": "Jugar takes a before a sport, and a with el is al, as in juega al tenis."
    native: "She plays tennis on Sundays."
    bases: { "al": "to the", "los": "on" }
    confusables: { "es-1433": { why: "Fútbol is football, a different sport." }, "baloncesto": { why: "Baloncesto is basketball, a different sport." } }
  "es-3372":
    notes:
      "n1": "A descriptive adjective usually comes after its noun and agrees with it, as in guitarra nueva."
    native: "My sister bought a new guitar at the market."
    bases: { "una": "a", "en": "at", "el": "the" }
    confusables: { "tienda": { why: "Tienda is a shop, not an open market." }, "supermercado": { why: "Supermercado is a supermarket, not an open market." } }
  "es-3373":
    notes:
      "n1": "Divertirse is reflexive, so it takes nos, we, before the verb."
    native: "We have fun at the pool."
    bases: { "Nos": "us", "en": "at", "la": "the" }
    confusables: { "playa": { why: "Playa is the beach, not the pool." }, "parque": { why: "Parque is a park, not a pool." } }
  "es-3374":
    notes:
      "n1": "Estar describes a state or feeling that can change: estoy cansado, I am tired."
    native: "I am very tired after skiing."
    bases: { "de": "after" }
    confusables: { "nadar": { why: "Nadar is to swim, not to ski." }, "escalar": { why: "Escalar is to climb, not to ski." } }
  "es-3375":
    notes:
      "n1": "Hermanos can mean brothers or siblings of both sexes, since the masculine plural covers mixed groups."
    native: "My brothers go fishing every afternoon."
    bases: {  }
    confusables: { "pescado": { why: "Pescado is fish as food, not the activity of fishing." }, "montar": { why: "Montar is to ride, not to fish." } }
  "es-3376":
    notes:
      "n1": "Ser with an adjective names the nature of an activity: es divertido, it is fun."
    native: "It is fun to play basketball."
    bases: { "al": "to the" }
    confusables: { "tenis": { why: "Tenis is tennis, a different sport." }, "es-1433": { why: "Fútbol is football, a different sport." } }
  "es-3377":
    notes:
      "n1": "Gustar works backwards: the thing liked is the subject, so the verb agrees with it, and the person is a pronoun (me, te, le)."
    native: "I do not like swimming in winter."
    bases: { "me": "to me", "en": "in" }
    confusables: { "piscina": { why: "Piscina is a swimming pool, the place, not the act." }, "escalar": { why: "Escalar is to climb, not to swim." } }
  "es-3378":
    notes:
      "n1": "Ir a with an infinitive is the usual near future: voy a pintar, I am going to paint."
    native: "I am going to paint in the park tomorrow."
    bases: { "a": "to", "en": "in", "el": "the" }
    confusables: { "dibujo": { why: "Dibujo is a drawing made with a pencil, not paint." }, "jugar": { why: "Jugar is to play a game or sport, not to paint." } }
  "es-3379":
    notes:
      "n1": "Cuánto agrees with dinero, which is masculine, so it is cuánto."
    native: "How much money do you spend on your hobbies each month?"
    bases: { "en": "on" }
    confusables: { "precio": { why: "Precio is the price of one thing, not the money you spend." }, "descuento": { why: "Descuento is a discount, a lower price." } }
  "es-3380":
    notes:
      "n1": "Tener is irregular in the first person, so tengo is I have."
    native: "I have a collection of books."
    bases: { "una": "a", "de": "of" }
    confusables: { "revista": { why: "Revista is one magazine, not a collection." }, "es-1410": { why: "Fotografía is a photograph, not a collection of books." } }
  "es-3381":
    notes:
      "n1": "A and el join into al, as in al club, to the club."
    native: "I go out with my friends to the club on Fridays."
    bases: { "con": "with", "al": "to the", "los": "on" }
    confusables: { "cine": { why: "Cine is the cinema, a place to watch films." }, "teatro": { why: "Teatro is the theatre, a place for plays." } }
  "es-3382":
    notes:
      "n1": "Aprender takes a before an infinitive, as in aprender a cantar, to learn to sing."
    native: "I want to learn to sing songs."
    bases: { "a": "to" }
    confusables: { "tocar": { why: "Tocar is to play an instrument, not to sing." }, "baile": { why: "Baile is dancing, not singing." } }
  "es-3383":
    notes:
      "n1": "The time is given with a las and the hour, as in a las ocho, at eight."
    native: "I arrive at the pool at eight."
    bases: { "a": "at", "la": "the", "las": "at" }
    confusables: { "es-0684": { why: "Estación is a station, not a pool." }, "parada": { why: "Parada is a bus stop, not a pool." } }
  "es-3384":
    notes:
      "n1": "Mirar means to watch when the thing watched is a programme, as in miro la serie."
    native: "I watch the TV series with my mother every night."
    bases: { "la": "the", "con": "with" }
    confusables: { "es-1425": { why: "Canción is a song, not a TV series." }, "concierto": { why: "Concierto is a concert, live music, not a TV series." } }
