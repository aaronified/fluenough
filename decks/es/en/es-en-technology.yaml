schema: 1
id: "es-en-technology"
kind: "layer"
core: "es-technology"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Technology: computers, apps and the internet"
license: "CC-BY-SA-4.0"
description: "Words for computers and the internet: the file and the folder, the device and the memory, the link and the click, the error and the fault, and the verbs to install, update, restart, connect, share and browse. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-2315":
    native: "technology"
    notes: { n1: "La tecnología is technology, the science and tools that make life easier." }
    bases: { "la": "the", "tecnología": "technology" }
    examples:
      "La tecnología cambia rápido.": { native: "Technology changes fast.", bases: { "La": "the", "tecnología": "technology" } }
      "Me interesa la tecnología.": { native: "I am interested in technology.", bases: { "Me": "to me", "interesa": "to interest", "la": "the", "tecnología": "technology" } }
  "es-2316":
    native: "software"
    notes: { n1: "El software is software, the programs that run on a computer." }
    bases: { "el": "the", "software": "software" }
    examples:
      "Este software es gratis.": { native: "This software is free.", bases: { "software": "software" } }
      "Instalo un software nuevo.": { native: "I install new software.", bases: { "un": "a", "software": "software" } }
  "es-2317":
