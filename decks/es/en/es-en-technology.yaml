      "Guardo el archivo en la carpeta.": { native: "I save the file in the folder.", bases: { "el": "the", "archivo": "file", "en": "in", "la": "the" } }
      "El archivo es muy grande.": { native: "The file is very big.", bases: { "El": "the", "archivo": "file" } }
