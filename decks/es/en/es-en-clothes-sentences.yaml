core: es-clothes-sentences
native:
  code: en
  iso639_3: eng
  name: English
name: 'Sentences: clothes'
license: CC-BY-SA-4.0
description: 'Eight sentences about clothes, shopping and colours, with the words each is often mixed up with. Not yet checked by a Spanish speaker: please report any mistake.'
cards:
  es-1051:
    native: Ana wears a white shirt and a blue skirt.
    bases:
      Ana: Ana
      una: a
    confusables:
      dress:
        why: Un vestido is a dress, one piece, not a shirt and a skirt.
      blouse:
        why: Una blusa is a blouse, a top, not a shirt.
  es-1052:
    native: I need a coat for the winter.
    bases:
      un: a
      para: for
      el: the
    confusables:
      jacket:
        why: Una chaqueta is a lighter jacket, not a warm coat.
      jumper:
        why: Un jersey is a jumper, worn over a shirt.
  es-1053:
    native: These shoes are very tight.
    bases:
      Estos: These
    confusables:
      boot:
        why: Una bota is a boot, which covers the ankle.
      sock:
        why: Un calcetín is a sock, worn inside a shoe.
  es-1054:
    native: I put on the scarf and the hat.
    bases:
      Me: I
      la: the
      el: the
    confusables:
      tie:
        why: La corbata is a tie, worn at the neck, not on the head.
      belt:
        why: El cinturón is a belt, worn around the waist.
  es-1055:
    native: What size is this dress?
    bases:
      este: this
    confusables:
      suit:
        why: El traje is a suit, a jacket and trousers together.
      fitting:
        why: El probador is the fitting room, where you try clothes on.
  es-1056:
    native: The fitting room is at the back.
    bases:
      El: The
      al: at the
      fondo: back
    confusables:
      size:
        why: La talla is the size of clothes, not a room.
      fashion:
        why: La moda is fashion, not a place to try clothes.
  es-1057:
    native: This jacket fits me well.
    bases:
      Esta: This
      me: to me
    confusables:
      coat:
        why: El abrigo is a coat, heavier than a jacket.
      jumper:
        why: El jersey is a jumper, knitted, not a jacket.
  es-1058:
    native: My favourite colour is green.
    bases:
      favorito: favourite
      el: the
    confusables:
      red:
        why: Rojo is red, another colour in the same set.
      black:
        why: Negro is black, another colour.
  es-1059:
    native: Fashionable clothes are elegant.
    bases:
      La: The
      de: of
    confusables:
      wide:
        why: Ancho is wide or loose, a shape, not a style.
      suit:
        why: El traje is one suit; la ropa is clothes in general.
