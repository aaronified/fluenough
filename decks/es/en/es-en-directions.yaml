        native: "I go straight ahead."
        bases: {"recto": "straight ahead"}
      "Vamos recto.":
        native: "We go straight ahead."
        bases: {"recto": "straight ahead"}
  "es-0717":
    native: "near"
    notes: { n1: "Cerca is near. The opposite is lejos." }
