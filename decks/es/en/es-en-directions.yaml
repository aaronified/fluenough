        bases: {"Hay": "there is", "un": "a", "cruce": "crossing"}
      "El cruce está en la calle grande.":
        native: "The crossing is on the big street."
        bases: {"El": "the", "cruce": "crossing", "en": "in", "la": "the"}
  "es-0710":
    native: "map"
    notes: { n1: "Mapa is a map. It is masculine, el mapa, though it ends in -a." }
    bases: {"el": "the", "mapa": "map"}
    examples:
      "Tengo un mapa.":
        native: "I have a map."
