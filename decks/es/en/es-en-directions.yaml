description: "Finding the way: the corner, the traffic light, the bridge, the map, north, south and west, left and right, near and far, with the verbs to turn, to cross, to follow and to find. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-0706":
    native: "corner"
    notes: { n1: "Esquina is a corner, where two streets meet." }
    bases: {"la": "the", "esquina": "corner"}
    examples:
      "Hay una tienda en la esquina.":
        native: "There is a shop on the corner."
        bases: {"Hay": "there is", "una": "a", "en": "in", "la": "the", "esquina": "corner"}
      "La esquina está aquí.":
        native: "The corner is here."
        bases: {"La": "the", "esquina": "corner"}
  "es-0707":
    native: "traffic light"
    notes: { n1: "Semáforo is a traffic light." }
    bases: {"el": "the", "semáforo": "traffic light"}
    examples:
      "El semáforo está lejos.":
        native: "The traffic light is far."
        bases: {"El": "the", "semáforo": "traffic light"}
      "El semáforo está cerca.":
        native: "The traffic light is near."
        bases: {"El": "the", "semáforo": "traffic light"}
  "es-0708":
    native: "bridge"
    notes: { n1: "Puente is a bridge." }
