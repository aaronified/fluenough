schema: 1
id: "es-en-verbs-4"
kind: "layer"
core: "es-verbs-4"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Story actions"
license: "CC-BY-SA-4.0"
description: "Verbs for telling a story: discovering and hiding, escaping and chasing, shouting and whispering, falling and pushing, and the nouns of a tale: the secret, the treasure, the dragon, the princess and the fright. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-2891":
    native: "story; tale"
    notes: { n1: "El cuento is a short story or a tale, often for children. Contar un cuento is to tell a story." }
    bases: { "cuento": "story; tale" }
    examples:
      "Leo un cuento a mis hijos.": { native: "I read a story to my children.", bases: { "un": "a", "a": "to" } }
      "El cuento es muy triste.": { native: "The story is very sad.", bases: { "El": "the" } }
  "es-2892":
    native: "adventure"
    notes: { n1: "La aventura is an adventure, an exciting experience full of risk." }
    bases: { "aventura": "adventure" }
    examples:
      "Viven una gran aventura.": { native: "They live a great adventure.", bases: { "una": "a", "aventura": "adventure" } }
      "La aventura empieza en el bosque.": { native: "The adventure starts in the forest.", bases: { "La": "the", "aventura": "adventure", "en": "in", "el": "the" } }
  "es-2893":
    native: "mystery"
    notes: { n1: "El misterio is a mystery, something hard to explain or find out. Its adjective is misterioso." }
    bases: { "misterio": "mystery" }
    examples:
      "El misterio es grande.": { native: "The mystery is great.", bases: { "El": "the", "misterio": "mystery" } }
      "Hay un misterio en el castillo.": { native: "There is a mystery in the castle.", bases: { "Hay": "there is; there are", "un": "a", "misterio": "mystery", "en": "in", "el": "the" } }
  "es-2894":
    native: "secret"
    notes: { n1: "El secreto is a secret, something not to be told to others." }
    bases: { "secreto": "secret" }
    examples:
      "Es un secreto.": { native: "It is a secret.", bases: { "un": "a", "secreto": "secret" } }
      "Descubro el secreto del bosque.": { native: "I discover the secret of the forest.", bases: { "el": "the", "secreto": "secret", "del": "of" } }
  "es-2895":
    native: "end; ending"
    notes: { n1: "El final is the end of a story, a film or a period of time." }
    bases: { "final": "end; ending" }
    examples:
      "El final es triste.": { native: "The ending is sad.", bases: { "El": "the", "final": "end; ending" } }
      "Al final, todos están felices.": { native: "In the end, everyone is happy.", bases: { "Al": "to the", "final": "end; ending" } }
  "es-2896":
    native: "princess"
    notes: { n1: "La princesa is a princess, the daughter of a king and queen." }
    bases: { "princesa": "princess" }
    examples:
      "La princesa vive en el castillo.": { native: "The princess lives in the castle.", bases: { "La": "the", "princesa": "princess", "en": "in", "el": "the" } }
      "La princesa escapa de noche.": { native: "The princess escapes at night.", bases: { "La": "the", "princesa": "princess", "de": "of" } }
  "es-2897":
    native: "witch"
    notes: { n1: "La bruja is a witch, a woman who does magic in a story." }
    bases: { "bruja": "witch" }
    examples:
      "La bruja vive en el bosque.": { native: "The witch lives in the forest.", bases: { "La": "the", "bruja": "witch", "en": "in", "el": "the" } }
      "La bruja tiene un gato negro.": { native: "The witch has a black cat.", bases: { "La": "the", "bruja": "witch", "un": "a" } }
  "es-2898":
    native: "dragon"
    notes: { n1: "El dragón is a dragon, a large winged creature of stories." }
    bases: { "dragón": "dragon" }
    examples:
      "El dragón vuela sobre el río.": { native: "The dragon flies over the river.", bases: { "El": "the", "dragón": "dragon" } }
      "Un dragón guarda el tesoro.": { native: "A dragon guards the treasure.", bases: { "Un": "a", "dragón": "dragon", "el": "the" } }
  "es-2899":
    native: "fright; scare"
    notes: { n1: "El susto is a fright, a sudden feeling of fear. Dar un susto is to give someone a fright." }
    bases: { "susto": "fright; scare" }
    examples:
      "Me diste un susto.": { native: "You gave me a fright.", bases: { "Me": "to me", "un": "a", "susto": "fright; scare" } }
      "El susto pasa rápido.": { native: "The fright passes quickly.", bases: { "El": "the", "susto": "fright; scare" } }
  "es-2900":
    native: "footprint; trace"
    notes: { n1: "La huella is a footprint, or a mark left by something that has passed." }
    bases: { "huella": "footprint; trace" }
    examples:
      "Veo una huella en la arena.": { native: "I see a footprint in the sand.", bases: { "una": "a", "huella": "footprint; trace", "en": "in", "la": "the" } }
      "Dejan huellas en el barro.": { native: "They leave tracks in the mud.", bases: { "huellas": "footprint; trace", "en": "in", "el": "the" } }
  "es-2901":
    native: "fox"
    notes: { n1: "El zorro is a fox, a wild animal with a red coat and a bushy tail. The feminine is la zorra." }
    bases: { "zorro": "fox" }
    examples:
      "El zorro corre por el campo.": { native: "The fox runs across the field.", bases: { "El": "the", "zorro": "fox", "por": "for" } }
      "El zorro es muy listo.": { native: "The fox is very clever.", bases: { "El": "the", "zorro": "fox" } }
  "es-2902":
    native: "treasure"
    notes: { n1: "El tesoro is a treasure, a store of gold, jewels or valuable things." }
    bases: { "tesoro": "treasure" }
    examples:
      "El tesoro está en la cueva.": { native: "The treasure is in the cave.", bases: { "El": "the", "tesoro": "treasure", "en": "in", "la": "the" } }
      "Encuentran el tesoro.": { native: "They find the treasure.", bases: { "el": "the", "tesoro": "treasure" } }
  "es-2903":
    native: "path; way"
    notes: { n1: "El camino is a path, a road or the way to get somewhere." }
    bases: { "camino": "path; way" }
    examples:
      "El camino es largo.": { native: "The path is long.", bases: { "El": "the" } }
      "Seguimos el camino del río.": { native: "We follow the path of the river.", bases: { "el": "the", "del": "of" } }
  "es-2904":
    native: "silence"
    notes: { n1: "El silencio is silence, the absence of sound." }
    bases: { "silencio": "silence" }
    examples:
      "Hay silencio en el bosque.": { native: "There is silence in the forest.", bases: { "Hay": "there is; there are", "silencio": "silence", "en": "in", "el": "the" } }
      "Pido silencio, por favor.": { native: "I ask for silence, please.", bases: { "silencio": "silence", "por": "for", "favor": "please" } }
  "es-2905":
    native: "step; passage"
    notes: { n1: "El paso is a step, a movement of the foot, or a passage through a place." }
    bases: { "paso": "step; passage" }
    examples:
      "Doy un paso hacia la puerta.": { native: "I take a step towards the door.", bases: { "un": "a", "hacia": "towards", "la": "the" } }
      "El paso del río es peligroso.": { native: "The river crossing is dangerous.", bases: { "El": "the", "del": "of" } }
  "es-2906":
    native: "mysterious"
    notes: { n1: "Misterioso is mysterious, hard to explain. It agrees with the noun: misteriosa." }
    bases: { "misterioso": "mysterious" }
    examples:
      "Es un hombre misterioso.": { native: "He is a mysterious man.", bases: { "un": "a", "misterioso": "mysterious" } }
      "La casa está en silencio y es misteriosa.": { native: "The house is silent and mysterious.", bases: { "La": "the", "en": "in", "misteriosa": "mysterious" } }
  "es-2907":
    native: "hidden"
    notes: { n1: "Escondido is hidden, out of sight. It agrees with the noun: escondida." }
    bases: { "escondido": "hidden" }
    examples:
      "El tesoro está escondido.": { native: "The treasure is hidden.", bases: { "El": "the", "escondido": "hidden" } }
      "La niña está escondida detrás de la puerta.": { native: "The girl is hidden behind the door.", bases: { "La": "the", "escondida": "hidden", "detrás": "behind", "de": "of" } }
  "es-2908":
    native: "to discover"
    notes: { n1: "Descubrir is to find out something that was hidden or unknown." }
    bases: { "descubrir": "to discover" }
    examples:
      "Descubro un secreto.": { native: "I discover a secret.", bases: { "Descubro": "to discover", "un": "a" } }
      "Descubren el tesoro en la cueva.": { native: "They discover the treasure in the cave.", bases: { "Descubren": "to discover", "el": "the", "en": "in", "la": "the" } }
  "es-2909":
    native: "to escape"
    notes: { n1: "Escapar is to get away from a place or a danger." }
    bases: { "escapar": "to escape" }
    examples:
      "Escapo del castillo.": { native: "I escape from the castle.", bases: { "Escapo": "to escape", "del": "of" } }
      "Escaparon por la ventana.": { native: "They escaped through the window.", bases: { "Escaparon": "to escape", "por": "for", "la": "the" } }
  "es-2910":
    native: "to chase"
    notes: { n1: "Perseguir is to chase someone or something to catch them. Its stem changes: persigo, persigues." }
    bases: { "perseguir": "to chase" }
    examples:
      "El dragón persigue al príncipe.": { native: "The dragon chases the prince.", bases: { "El": "the", "persigue": "to chase", "al": "to the" } }
      "Perseguimos al zorro.": { native: "We chase the fox.", bases: { "Perseguimos": "to chase", "al": "to the" } }
  "es-2911":
    native: "to hide"
    notes: { n1: "Esconder is to put something where it cannot be seen. Esconderse is to hide oneself." }
    bases: { "esconder": "to hide" }
    examples:
      "Escondo la llave.": { native: "I hide the key.", bases: { "Escondo": "to hide", "la": "the" } }
      "Ella se esconde detrás del árbol.": { native: "She hides behind the tree.", bases: { "se": "(reflexive) oneself", "esconde": "to hide oneself", "detrás": "behind", "del": "of" } }
  "es-2912":
    native: "to hug"
    notes: { n1: "Abrazar is to put the arms around someone, to hug them." }
    bases: { "abrazar": "to hug" }
    examples:
      "Abrazo a mi madre.": { native: "I hug my mother.", bases: { "Abrazo": "to hug", "a": "to" } }
      "Se abrazan al final.": { native: "They hug at the end.", bases: { "Se": "(reflexive) oneself", "abrazan": "to hug", "al": "to the" } }
  "es-2913":
    native: "to shout"
    notes: { n1: "Gritar is to shout or cry out loud." }
    bases: { "gritar": "to shout" }
    examples:
      "Grito de miedo.": { native: "I shout with fear.", bases: { "Grito": "to shout", "de": "of" } }
      "Gritan desde la ventana.": { native: "They shout from the window.", bases: { "Gritan": "to shout", "desde": "from", "la": "the" } }
  "es-2914":
    native: "to whisper"
    notes: { n1: "Susurrar is to whisper, to speak very softly." }
    bases: { "susurrar": "to whisper" }
    examples:
      "Susurro un secreto.": { native: "I whisper a secret.", bases: { "Susurro": "to whisper", "un": "a" } }
      "Susurran en la noche.": { native: "They whisper at night.", bases: { "Susurran": "to whisper", "en": "in", "la": "the" } }
  "es-2915":
    native: "to fall"
    notes: { n1: "Caer is to fall down, or to drop. Its yo form is caigo." }
    bases: { "caer": "to fall" }
    examples:
      "La hoja cae del árbol.": { native: "The leaf falls from the tree.", bases: { "La": "the", "cae": "to fall", "del": "of" } }
      "Caigo al suelo.": { native: "I fall to the ground.", bases: { "Caigo": "to fall", "al": "to the" } }
  "es-2916":
    native: "to hit; to stick"
    notes: { n1: "Pegar is to hit someone, or to stick one thing to another." }
    bases: { "pegar": "to hit; to stick" }
    examples:
      "No pegues al perro.": { native: "Do not hit the dog.", bases: { "pegues": "to hit; to stick", "al": "to the" } }
      "Pego el sello en la carta.": { native: "I stick the stamp on the letter.", bases: { "Pego": "to hit; to stick", "el": "the", "en": "in", "la": "the" } }
  "es-2917":
    native: "to push"
    notes: { n1: "Empujar is to push something or someone away." }
    bases: { "empujar": "to push" }
    examples:
      "Empujo la puerta.": { native: "I push the door.", bases: { "Empujo": "to push", "la": "the" } }
      "Empujan el coche.": { native: "They push the car.", bases: { "Empujan": "to push", "el": "the" } }
  "es-2918":
    native: "to observe; to watch"
    notes: { n1: "Observar is to watch carefully, to observe." }
    bases: { "observar": "to observe; to watch" }
    examples:
      "Observo las estrellas.": { native: "I observe the stars.", bases: { "Observo": "to observe; to watch", "las": "the" } }
      "Observan el bosque desde la colina.": { native: "They watch the forest from the hill.", bases: { "Observan": "to observe; to watch", "el": "the", "desde": "from", "la": "the" } }
  "es-2919":
    native: "to promise"
    notes: { n1: "Prometer is to promise, to give one's word to do something." }
    bases: { "prometer": "to promise" }
    examples:
      "Prometo volver mañana.": { native: "I promise to come/comer back tomorrow.", bases: { "Prometo": "to promise" } }
      "Te prometo la verdad.": { native: "I promise you the truth.", bases: { "Te": "you", "prometo": "to promise", "la": "the" } }
  "es-2920":
    native: "to hide; to conceal"
    notes: { n1: "Ocultar is to keep something out of sight, or to hide the truth." }
    bases: { "ocultar": "to hide; to conceal" }
    examples:
      "Oculto la verdad.": { native: "I hide the truth.", bases: { "Oculto": "to hide; to conceal", "la": "the" } }
      "Ocultan el tesoro.": { native: "They hide the treasure.", bases: { "Ocultan": "to hide; to conceal", "el": "the" } }
  "es-2921":
    native: "to flee; to run away"
    notes: { n1: "Huir is to run away from danger. Its yo form is huyo." }
    bases: { "huir": "to flee; to run away" }
    examples:
      "Huyo del peligro.": { native: "I flee from danger.", bases: { "Huyo": "to flee; to run away", "del": "of" } }
      "Huyen por el bosque.": { native: "They flee through the forest.", bases: { "Huyen": "to flee; to run away", "por": "for", "el": "the" } }
  "es-2922":
    native: "to cross; to go through"
    notes: { n1: "Atravesar is to cross a place or go through something. Its stem changes: atravieso." }
    bases: { "atravesar": "to cross; to go through" }
    examples:
      "Atravieso el río.": { native: "I cross the river.", bases: { "Atravieso": "to cross; to go through", "el": "the" } }
      "Atraviesan el campo.": { native: "They cross the field.", bases: { "Atraviesan": "to cross; to go through", "el": "the" } }
  "es-2923":
    native: "to get dark"
    notes: { n1: "Oscurecer is to become dark, usually at dusk. Its yo form is oscurezco." }
    bases: { "oscurecer": "to get dark" }
    examples:
      "Oscurece a las ocho.": { native: "It gets dark at eight.", bases: { "Oscurece": "to get dark", "a": "to", "las": "the" } }
      "Oscurece pronto en invierno.": { native: "It gets dark early in winter.", bases: { "Oscurece": "to get dark", "en": "in" } }
  "es-2924":
    native: "to dawn"
    notes: { n1: "Amanecer is to dawn, to get light in the morning. The noun is el amanecer." }
    bases: { "amanecer": "to dawn" }
    examples:
      "Amanece a las siete.": { native: "It dawns at seven.", bases: { "Amanece": "to dawn", "a": "to", "las": "the" } }
      "Amanece sobre el mar.": { native: "Dawn breaks over the sea.", bases: { "Amanece": "to dawn", "el": "the" } }
  "es-2925":
    native: "to get dark (evening)"
    notes: { n1: "Anochecer is to become night, at the end of the day. The noun is el anochecer." }
    bases: { "anochecer": "to get dark (evening)" }
    examples:
      "Anochece a las nueve.": { native: "It gets dark at nine.", bases: { "Anochece": "to get dark (evening)", "a": "to", "las": "the" } }
      "Anochece y todo queda en silencio.": { native: "It gets dark and everything is silent.", bases: { "Anochece": "to get dark (evening)", "todo": "all", "en": "in" } }
  "es-2926":
    native: "to sound; to ring"
    notes: { n1: "Sonar is to make a sound, to ring. Its stem changes: suena." }
    bases: { "sonar": "to sound; to ring" }
    examples:
      "Suena el timbre.": { native: "The bell rings.", bases: { "Suena": "to sound; to ring", "el": "the", "timbre": "bell" } }
      "Suena una canción en la radio.": { native: "A song sounds on the radio.", bases: { "Suena": "to sound; to ring", "una": "a", "en": "in", "la": "the" } }
