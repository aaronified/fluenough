schema: 1
id: "es-en-geography"
kind: "layer"
core: "es-geography"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Geography: the world, maps and places"
license: "CC-BY-SA-4.0"
description: "Words for the world and the map: the continents and the countries where Spanish is spoken, the capitals and the cities, the borders, the regions and the words for places that are rural or urban. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-1895":
    native: "capital city"
    notes: { n1: "La capital is the capital city of a country, where the government sits." }
    bases: { "la": "the", "capital": "capital city" }
    examples:
      "La capital de España es Madrid.": { native: "The capital of Spain is Madrid.", bases: { "La": "the", "capital": "capital city", "de": "of" } }
      "Lima es la capital de Perú.": { native: "Lima is the capital of Peru.", bases: { "Lima": "Lima", "la": "the", "capital": "capital city", "de": "of" } }
  "es-1896":
    native: "continent"
    notes: { n1: "El continente is one of the large land masses of the world." }
    bases: { "el": "the", "continente": "continent" }
    examples:
      "Europa es un continente.": { native: "Europe is a continent.", bases: { "un": "a", "continente": "continent" } }
      "El continente tiene muchos países.": { native: "The continent has many countries.", bases: { "El": "the", "continente": "continent" } }
