description: 'The days of the week, the months, the seasons and words for dates and appointments. Not yet checked by a Spanish speaker: please report any mistake.'
cards:
  es-0957:
    native: Days of the week
    explanation: 'The seven days of the week. Each is masculine, with el, and is written in lower case: el lunes, el martes. Practise them together.'
  es-0965:
    native: Months of the year
    explanation: 'The twelve months. Each is masculine and written in lower case, with no article after en: en enero means in January.'
  es-0958:
    native: Monday
    notes:
      n1: Lunes is Monday, the first day of the working week in most of the Spanish-speaking world.
    bases:
      el: the
      lunes: Monday
    examples:
      El lunes tengo clase de inglés.:
        native: On Monday I have an English class.
        bases:
          El: The
          lunes: Monday
          clase: class
          de: (linking word)
          inglés: English
      Llego a casa el lunes por la noche.:
        native: I get home on Monday night.
        bases:
          a: to
          el: 'on'
          lunes: Monday
          por: at
          la: the
  es-0959:
    native: Tuesday
    notes:
      n1: Martes is Tuesday. It is written in lower case, as all days are.
    bases:
