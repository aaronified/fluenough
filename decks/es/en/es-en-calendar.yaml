  es-0986:
    native: the day before yesterday
    notes:
      n1: Anteayer is the day before yesterday. Ayer is yesterday.
    examples:
      Hoy es jueves. Ayer, miércoles, y anteayer, martes.:
        native: Today is Thursday. Yesterday was Wednesday, and the day before yesterday, Tuesday.
        bases:
          anteayer: the day before yesterday
      ¿Qué día es anteayer?:
        native: What day was the day before yesterday?
        bases:
          anteayer: the day before yesterday
  es-0978:
    native: tomorrow
    notes:
      n1: Mañana alone is tomorrow. La mañana is the morning, and pasado mañana is the day after tomorrow.
      h1: Spelled like la mañana, the morning. This one means tomorrow.
    examples:
      Mañana tengo una cita.:
        native: Tomorrow I have an appointment.
        bases:
          Mañana: tomorrow
          una: an
      Hasta mañana, Ana.:
        native: See you tomorrow, Ana.
        bases:
          Hasta: Until
          mañana: tomorrow
          Ana: Ana
  es-0987:
    native: past; last
    notes:
      n1: Pasado means past or last, as in el año pasado, last year. Pasado mañana is the day after tomorrow.
    examples:
      Pasado mañana tengo una reunión.:
        native: The day after tomorrow I have a meeting.
        bases:
          Pasado: after
          una: a
      Pasado mañana es sábado.:
        native: The day after tomorrow is Saturday.
        bases:
          Pasado: after
  es-0988:
    native: next
    notes:
