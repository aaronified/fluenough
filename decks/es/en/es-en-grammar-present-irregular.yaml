schema: 1
id: "es-en-grammar-present-irregular"
kind: "layer"
core: "es-grammar-present-irregular"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Spanish present tense, irregular verbs"
license: "CC-BY-SA-4.0"
description: "Some of the most used verbs change their whole form or the vowel of their stem in the present: tener (to have), ir (to go), hacer (to do, to make), and stem-changing verbs such as querer, pedir and cerrar. Learn each one whole. Not yet checked by a Spanish speaker: please report any mistake."
pattern:
  name: "Present tense, irregular verbs"
  slot_name: "person"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "tener": "to have"
    "ir": "to go"
    "hacer": "to do; to make"
    "costar": "to cost"
    "pedir": "to order; to ask for"
    "almorzar": "to have lunch"
    "querer": "to want; to love"
    "salir": "to leave; to go out"
    "seguir": "to follow; to continue"
    "encontrar": "to find"
    "doler": "to hurt; to ache"
    "cerrar": "to close"
    "empezar": "to start; to begin"
    "perder": "to lose"
    "entender": "to understand"
    "repetir": "to repeat"
