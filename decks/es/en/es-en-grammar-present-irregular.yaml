  name: "Present tense, irregular verbs"
  slot_name: "person"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "tener": "to have"
    "ir": "to go"
    "hacer": "to do; to make"
    "costar": "to cost"
