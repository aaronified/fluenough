schema: 1
id: "es-en-questions-sentences"
kind: "layer"
core: "es-questions-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences: asking questions"
license: "CC-BY-SA-4.0"
description: "Ten sentences that ask questions with the words of Questions, each with the words it is often mixed up with. Not yet checked by a Spanish speaker: please report any mistake."

cards:
  "es-0070":
    notes:
      "n1": "Estar gives where something is, so the question is ¿Dónde está...? and not ser."
    native: "Where is the station?"
    bases:
      "Dónde": "where"
      "la": "the"
    confusables:
      "when": { why: "Cuándo asks when, not where." }
      "how": { why: "Cómo asks how, not where." }
  "es-0071":
    native: "When does the train arrive?"
    bases:
      "Cuándo": "when"
      "llega": "arrive"
      "el": "the"
    confusables:
      "where": { why: "Dónde asks where the train is, not when." }
      "how-much": { why: "Cuánto asks how much, not when." }
  "es-0072":
    notes:
      "n1": "Estás is the tú form of estar, used here for how someone is today; ser would be wrong."
    native: "How are you today?"
    bases:
      "hoy": "today"
    confusables:
      "who": { why: "Quién asks who, not how." }
      "which": { why: "Cuál asks which one, not how." }
  "es-0073":
    notes:
      "n1": "Llamar a la puerta is a set phrase meaning to knock on the door; the a belongs to it."
    native: "Who is knocking at the door?"
    bases:
      "llama": "knock"
      "a": "at"
      "la": "the"
    confusables:
      "what": { why: "Qué asks what, not who." }
      "where": { why: "Dónde asks where, not who." }
  "es-0074":
    notes:
      "n1": "Por qué is two words in a question and asks why; porque is one word and means because, in the answer."
    native: "Why aren't you eating?"
    bases:
      "Por": "for"
    confusables:
      "when": { why: "Cuándo asks when, not why." }
      "how": { why: "Cómo asks how, not why." }
  "es-0075":
    notes:
      "n1": "Tu here is the possessive your, not the pronoun you, which is tú."
    native: "What is your name?"
    confusables:
      "what": { why: "Qué asks what, not which one." }
      "who": { why: "Quién asks who, not which name." }
  "es-0076":
    notes:
      "n1": "Costar changes its stem o to ue, so it is cuesta here and cuestan for things in the plural."
    native: "How much is the bread?"
    bases:
      "el": "the"
    confusables:
      "when": { why: "Cuándo asks when, not how much." }
      "how": { why: "Cómo asks how, not how much." }
  "es-0077":
    notes:
      "n1": "A and el join into al, as in vas al cine: you go to the cinema."
    native: "Who are you going to the cinema with?"
    bases:
      "Con": "with"
      "al": "to the"
    confusables:
      "what": { why: "Qué asks what, not who." }
      "where": { why: "Dónde asks where, not who." }
  "es-0078":
    notes:
      "n1": "Poder changes its stem o to ue in the tú form, puedes, but not in the nosotros form: podemos."
    native: "Can you repeat, please?"
    bases:
      "Puedes": "can"
      "por": "for"
      "favor": "favour"
    confusables:
      "sorry": { why: "Perdón asks pardon; it does not ask for a repeat." }
      "thanks": { why: "Gracias thanks someone; it does not ask for a repeat." }
  "es-0079":
    notes:
      "n1": "Spanish uses tener for hunger and thirst: tener hambre or tener sed, to have hunger, not to be hungry."
    native: "Are you hungry or thirsty?"
    bases:
      "hambre": "hunger"
      "sed": "thirst"
    confusables:
      "which": { why: "Cuál asks which one, not what you have." }
      "what": { why: "Qué asks what, not whether." }
