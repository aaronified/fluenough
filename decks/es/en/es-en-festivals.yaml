schema: 1
id: "es-en-festivals"
kind: "layer"
core: "es-festivals"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Festivals and celebrations"
license: "CC-BY-SA-4.0"
description: "Words for the celebrations of a year: the carnival and the parade, the fireworks and the balloons, the costume and the mask, the lanterns and the decorations, the saint's day and the religious festivals, and the verbs to celebrate and parade. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-2611":
    native: "celebration"
    notes: { n1: "La celebración is a celebration, a party or a ceremony for a special day. The verb is celebrar." }
    bases: { "la": "the", "celebración": "celebration" }
    examples:
      "La celebración dura todo el día.": { native: "The celebration lasts all day.", bases: { "La": "the", "celebración": "celebration", "todo": "all", "el": "the" } }
      "Hay una celebración en la plaza.": { native: "There is a celebration in the square.", bases: { "Hay": "there is; there are", "una": "a", "celebración": "celebration", "en": "in", "la": "the" } }
  "es-2612":
    native: "carnival"
    notes: { n1: "El carnaval is a carnival, a festival before Lent with costumes and parades." }
    bases: { "el": "the", "carnaval": "carnival" }
    examples:
      "El carnaval es en febrero.": { native: "The carnival is in February.", bases: { "El": "the", "carnaval": "carnival", "en": "in" } }
      "Vamos al carnaval con disfraces.": { native: "We go to the carnival in costumes.", bases: { "al": "to the", "carnaval": "carnival", "con": "with" } }
  "es-2613":
    native: "procession"
    notes: { n1: "La procesión is a procession, a group of people walking together in a ceremony." }
    bases: { "la": "the", "procesión": "procession" }
    examples:
      "La procesión pasa por la calle.": { native: "The procession goes through the street.", bases: { "La": "the", "procesión": "procession", "por": "for", "la": "the" } }
      "Vemos una procesión en el pueblo.": { native: "We see a procession in the village.", bases: { "una": "a", "procesión": "procession", "en": "in", "el": "the" } }
  "es-2614":
    native: "parade"
    notes: { n1: "El desfile is a parade, people or floats moving through the street." }
    bases: { "el": "the", "desfile": "parade" }
    examples:
      "El desfile empieza a las diez.": { native: "The parade starts at ten.", bases: { "El": "the", "desfile": "parade", "a": "to", "las": "the" } }
      "Hay un desfile de niños.": { native: "There is a parade of children.", bases: { "Hay": "there is; there are", "un": "a", "desfile": "parade", "de": "of" } }
  "es-2615":
    native: "costume"
    notes: { n1: "El disfraz is a costume, clothes worn to look like someone else." }
    bases: { "el": "the", "disfraz": "costume" }
    examples:
      "Me pongo un disfraz de payaso.": { native: "I put on a clown costume.", bases: { "Me": "to me", "un": "a", "disfraz": "costume", "de": "of", "payaso": "clown" } }
      "El disfraz es muy bonito.": { native: "The costume is very pretty.", bases: { "El": "the", "disfraz": "costume" } }
  "es-2616":
    native: "rocket; firework"
    notes: { n1: "El cohete is a rocket or a firework that goes up and bursts in the sky." }
    bases: { "el": "the", "cohete": "rocket; firework" }
    examples:
      "Lanzan un cohete al cielo.": { native: "They launch a firework into the sky.", bases: { "Lanzan": "to launch", "un": "a", "cohete": "rocket; firework", "al": "to the" } }
      "Los cohetes hacen mucho ruido.": { native: "The fireworks make a lot of noise.", bases: { "Los": "the", "cohetes": "rocket; firework" } }
  "es-2617":
    native: "balloon"
    notes: { n1: "El globo is a balloon, a bag of air or gas, often for a party." }
    bases: { "el": "the", "globo": "balloon" }
    examples:
      "Hay globos en la fiesta.": { native: "There are balloons at the party.", bases: { "Hay": "there is; there are", "globos": "balloon", "en": "in", "la": "the" } }
      "El globo es rojo.": { native: "The balloon is red.", bases: { "El": "the", "globo": "balloon" } }
  "es-2618":
    native: "Christmas"
    notes: { n1: "La navidad is Christmas, the festival in December. Feliz Navidad is Merry Christmas." }
    bases: { "la": "the", "navidad": "Christmas" }
    examples:
      "La navidad es en diciembre.": { native: "Christmas is in December.", bases: { "La": "the", "navidad": "Christmas", "en": "in" } }
      "Cenamos juntos en Navidad.": { native: "We have dinner together at Christmas.", bases: { "juntos": "together", "en": "in", "Navidad": "Christmas" } }
  "es-2619":
    native: "New Year's Eve"
    notes: { n1: "La nochevieja is New Year's Eve, the last night of the year." }
    bases: { "la": "the", "nochevieja": "New Year's Eve" }
    examples:
      "La nochevieja es fiesta.": { native: "New Year's Eve is a festival.", bases: { "La": "the", "nochevieja": "New Year's Eve" } }
      "Comemos las uvas en nochevieja.": { native: "We eat the grapes on New Year's Eve.", bases: { "las": "the", "uvas": "grape", "en": "in", "nochevieja": "New Year's Eve" } }
  "es-2620":
    native: "band"
    notes: { n1: "La banda is a band of musicians who play together, or a strip." }
    bases: { "la": "the", "banda": "band" }
    examples:
      "La banda toca en la calle.": { native: "The band plays in the street.", bases: { "La": "the", "banda": "band", "en": "in", "la": "the" } }
      "La banda de música es famosa.": { native: "The music band is famous.", bases: { "La": "the", "banda": "band", "de": "of", "famosa": "famous" } }
  "es-2621":
    native: "guest"
    notes: { n1: "El invitado is a guest, a person invited to a party. The feminine is la invitada." }
    bases: { "el": "the", "invitado": "guest" }
    examples:
      "Hay cien invitados.": { native: "There are a hundred guests.", bases: { "Hay": "there is; there are", "invitados": "guest" } }
      "El invitado trae un regalo.": { native: "The guest brings a gift.", bases: { "El": "the", "invitado": "guest", "un": "a" } }
  "es-2622":
    native: "decoration"
    notes: { n1: "La decoración is decoration, the things put up to make a place look nice." }
    bases: { "la": "the", "decoración": "decoration" }
    examples:
      "La decoración es bonita.": { native: "The decoration is pretty.", bases: { "La": "the", "decoración": "decoration" } }
      "Hacemos la decoración de la sala.": { native: "We make the decoration of the room.", bases: { "la": "the", "decoración": "decoration", "de": "of" } }
  "es-2623":
    native: "ornament; decoration"
    notes: { n1: "El adorno is an ornament, a small object that decorates." }
    bases: { "el": "the", "adorno": "ornament; decoration" }
    examples:
      "El adorno es de papel.": { native: "The ornament is paper.", bases: { "El": "the", "adorno": "ornament; decoration", "de": "of" } }
      "Pongo los adornos en el árbol.": { native: "I put the ornaments on the tree.", bases: { "los": "the", "adornos": "ornament; decoration", "en": "in", "el": "the" } }
  "es-2624":
    native: "candle"
    notes: { n1: "La vela is a candle, a stick of wax with a flame on top." }
    bases: { "la": "the", "vela": "candle" }
    examples:
      "Enciendo una vela.": { native: "I light a candle.", bases: { "una": "a", "vela": "candle" } }
      "La vela es blanca.": { native: "The candle is white.", bases: { "La": "the", "vela": "candle" } }
  "es-2625":
    native: "toast"
    notes: { n1: "El brindis is a toast, when people raise glasses and wish for something." }
    bases: { "el": "the", "brindis": "toast" }
    examples:
      "Hacemos un brindis por la familia.": { native: "We make a toast for the family.", bases: { "un": "a", "brindis": "toast", "por": "for", "la": "the" } }
      "El brindis es a las doce.": { native: "The toast is at midnight.", bases: { "El": "the", "brindis": "toast", "a": "to", "las": "the" } }
  "es-2626":
    native: "mask"
    notes: { n1: "La máscara is a mask, worn over the face at a party or carnival." }
    bases: { "la": "the", "máscara": "mask" }
    examples:
      "Llevo una máscara en el carnaval.": { native: "I wear a mask at the carnival.", bases: { "una": "a", "máscara": "mask", "en": "in", "el": "the" } }
      "La máscara es de plumas.": { native: "The mask is made of feathers.", bases: { "La": "the", "máscara": "mask", "de": "of", "plumas": "feather" } }
  "es-2627":
    native: "crowd"
    notes: { n1: "La multitud is a crowd of people in one place." }
    bases: { "la": "the", "multitud": "crowd" }
    examples:
      "Hay una multitud en la calle.": { native: "There is a crowd in the street.", bases: { "Hay": "there is; there are", "una": "a", "multitud": "crowd", "en": "in", "la": "the" } }
      "La multitud aplaude.": { native: "The crowd applauds.", bases: { "La": "the", "multitud": "crowd", "aplaude": "to applaud" } }
  "es-2628":
    native: "fair"
    notes: { n1: "La feria is a fair, a market or a festival with rides and stalls." }
    bases: { "la": "the", "feria": "fair" }
    examples:
      "La feria tiene atracciones.": { native: "The fair has rides.", bases: { "La": "the", "feria": "fair", "atracciones": "attraction" } }
      "Vamos a la feria del pueblo.": { native: "We go to the village fair.", bases: { "a": "to", "la": "the", "feria": "fair", "del": "of" } }
  "es-2629":
    native: "traditional"
    notes: { n1: "Tradicional is traditional, of an old custom. It does not change for gender." }
    bases: { "tradicional": "traditional" }
    examples:
      "Es una comida tradicional.": { native: "It is a traditional meal.", bases: { "una": "a", "tradicional": "traditional" } }
      "La fiesta es tradicional.": { native: "The festival is traditional.", bases: { "La": "the", "tradicional": "traditional" } }
  "es-2630":
    native: "religious"
    notes: { n1: "Religioso is religious, of religion. It agrees with the noun: religiosa." }
    bases: { "religioso": "religious" }
    examples:
      "Es una fiesta religiosa.": { native: "It is a religious festival.", bases: { "una": "a", "religiosa": "religious" } }
      "La procesión es religiosa.": { native: "The procession is religious.", bases: { "La": "the", "religiosa": "religious" } }
  "es-2631":
    native: "religion"
    notes: { n1: "La religión is a religion, a set of beliefs about God or the spirit." }
    bases: { "la": "the", "religión": "religion" }
    examples:
      "La religión es importante para mí.": { native: "Religion is important to me.", bases: { "La": "the", "religión": "religion", "para": "for", "mí": "me" } }
      "Respeto todas las religiones.": { native: "I respect all religions.", bases: { "Respeto": "to respect", "todas": "all", "las": "the", "religiones": "religion" } }
  "es-2632":
    native: "saint; saint's day"
    notes: { n1: "El santo is a saint, or the saint's day, celebrated by people with that name. The feminine is la santa." }
    bases: { "el": "the", "santo": "saint; saint's day" }
    examples:
      "Hoy es el día del santo.": { native: "Today is the saint's day.", bases: { "el": "the", "del": "of", "santo": "saint; saint's day" } }
      "El santo del pueblo es Pedro.": { native: "The village's saint is Peter.", bases: { "El": "the", "santo": "saint; saint's day", "del": "of", "Pedro": "Pedro" } }
  "es-2633":
    native: "female saint"
    notes: { n1: "La santa is a female saint, or the day of a female saint." }
    bases: { "la": "the", "santa": "female saint" }
    examples:
      "La santa es la patrona.": { native: "The saint is the patron.", bases: { "La": "the", "santa": "female saint", "la": "the", "patrona": "patron" } }
      "Celebramos la fiesta de la santa.": { native: "We celebrate the feast of the saint.", bases: { "la": "the", "de": "of", "santa": "female saint" } }
  "es-2634":
    native: "sweet (a treat)"
    notes: { n1: "El dulce is a sweet, a treat made with sugar." }
    bases: { "el": "the", "dulce": "sweet (a treat)" }
    examples:
      "Compro dulces para la fiesta.": { native: "I buy sweets for the party.", bases: { "dulces": "sweet (a treat)", "para": "for", "la": "the" } }
      "El dulce es de chocolate.": { native: "The sweet is chocolate.", bases: { "El": "the", "dulce": "sweet (a treat)", "de": "of" } }
  "es-2635":
    native: "lantern; street lamp"
    notes: { n1: "El farol is a lantern, or a street lamp that gives light." }
    bases: { "el": "the", "farol": "lantern; street lamp" }
    examples:
      "Hay faroles de colores.": { native: "There are coloured lanterns.", bases: { "Hay": "there is; there are", "faroles": "lantern; street lamp", "de": "of" } }
      "El farol de la calle es antiguo.": { native: "The street lamp is old.", bases: { "El": "the", "farol": "lantern; street lamp", "de": "of", "la": "the" } }
  "es-2636":
    native: "to celebrate"
    notes: { n1: "Celebrar is to mark a special day with a party or a ceremony." }
    bases: { "celebrar": "to celebrate" }
    examples:
      "Celebramos el cumpleaños.": { native: "We celebrate the birthday.", bases: { "Celebramos": "to celebrate", "el": "the" } }
      "Celebran la fiesta en la plaza.": { native: "They celebrate the festival in the square.", bases: { "Celebran": "to celebrate", "la": "the", "en": "in" } }
  "es-2637":
    native: "to parade"
    notes: { n1: "Desfilar is to walk in a parade, in a line, in front of people." }
    bases: { "desfilar": "to parade" }
    examples:
      "Desfilan por la calle.": { native: "They parade along the street.", bases: { "Desfilan": "to parade", "por": "for", "la": "the" } }
      "Desfilo con la banda.": { native: "I parade with the band.", bases: { "Desfilo": "to parade", "con": "with", "la": "the" } }
  "es-2638":
    native: "to celebrate; to feast"
    notes: { n1: "Festejar is to celebrate a happy event, often with food and music." }
    bases: { "festejar": "to celebrate; to feast" }
    examples:
      "Festejamos el año nuevo.": { native: "We celebrate the new year.", bases: { "Festejamos": "to celebrate; to feast", "el": "the" } }
      "Festejan la boda en casa.": { native: "They celebrate the wedding at home.", bases: { "Festejan": "to celebrate; to feast", "la": "the", "boda": "wedding", "en": "in" } }
