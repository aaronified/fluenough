cards:
  "es-2718":
    native: "The goalkeeper stops the rival's goal."
    bases: { "El": "the", "para": "for", "el": "the", "del": "of" }
    confusables: { "arbitro": { why: "Árbitro is the referee, who watches the game, not the goal." }, "jugador": { why: "Jugador is a player, one of the team." } }
  "es-2719":
    native: "We win the victory in the league."
    bases: { "la": "the", "en": "in" }
    confusables: { "campeonato": { why: "Campeonato is a championship, a set of games." }, "derrota": { why: "Derrota is a defeat, the opposite result." } }
  "es-2720":
    native: "The scoreboard says a two-two draw."
    bases: { "El": "the", "un": "a", "a": "to" }
    confusables: { "marcador": { why: "Marcador is the scoreboard itself." }, "empate": { why: "Empate is the draw, the result." } }
  "es-2721":
    native: "The athlete breaks the record on the track."
    bases: { "La": "the", "el": "the", "en": "in", "la": "the" }
    confusables: { "cancha": { why: "Cancha is a court or pitch, not a running track." }, "pista": { why: "Pista is the track, the right word here." } }
  "es-2722":
    native: "The champion receives the gold medal."
    bases: { "El": "the", "la": "the", "de": "of", "oro": "gold" }
    confusables: { "ganador": { why: "Ganador is the winner, the general word." }, "competicion": { why: "Competición is the contest, the event itself." } }
  "es-2723":
    native: "I throw the ball and jump to catch it."
    bases: { "la": "the", "para": "for", "cogerla": "to take; to catch" }
    confusables: { "raqueta": { why: "Raqueta is a racket, for hitting, not throwing." }, "estadio": { why: "Estadio is a stadium, the place for the match." } }
