schema: 1
id: "es-en-describing"
kind: "layer"
core: "es-describing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing things and feelings"
license: "CC-BY-SA-4.0"
description: "Adjectives for looks, taste, price, difficulty, feelings and the state of things, each with its opposite. Not yet checked by a Spanish speaker: please report any mistake."

cards:
  "es-0404":
    native: "ugly"
    notes:
      "n1": "Feo is ugly. Its opposite is bonito (pretty)."
    examples:
      "El edificio es feo.":
        native: "The building is ugly."
        bases:
          "El": "the"
          "edificio": "building"
          "feo": "ugly"
      "Ana tiene un perro feo.":
        native: "Ana has an ugly dog."
        bases:
          "Ana": "Ana"
          "un": "a"
          "perro": "dog"
          "feo": "ugly"
  "es-0405":
    native: "pretty; nice"
    notes:
      "n1": "Bonito is pretty, and it describes things and places more often than people."
    examples:
      "La casa es bonita.":
        native: "The house is pretty."
        bases:
          "La": "the"
          "bonita": "pretty"
      "Qué bonito es el parque.":
        native: "How pretty the park is."
        bases:
          "bonito": "pretty"
          "el": "the"
          "parque": "park"
  "es-0406":
    native: "handsome; good-looking"
    notes:
      "n1": "Guapo is handsome or good-looking. It is used for people."
