          "Quiero": "I want"
          "usar": "to use"
          "el": "the"
          "libro": "book"
          "para": "for"
  "es-0288":
    native: "to need"
    notes:
      "n1": "Necesitar is to need. It takes a thing directly: necesito dinero (I need money)."
    examples:
      "Voy a necesitar ayuda.":
        native: "I am going to need help."
        bases:
          "a": "to"
          "necesitar": "to need"
      "Es normal necesitar ayuda a veces.":
        native: "It is normal to need help sometimes."
        bases:
          "normal": "normal"
          "necesitar": "to need"
          "a": "to"
          "veces": "times"
  "es-0289":
    native: "to look for"
    notes:
      "n1": "Buscar is to look for. It is a regular -ar verb: busco, buscas, busca."
    examples:
      "Voy a buscar las llaves.":
