schema: 1
id: "es-en-everyday-verbs"
kind: "layer"
core: "es-everyday-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Everyday verbs"
license: "CC-BY-SA-4.0"
description: "Verbs of an ordinary day: eating and cooking, cleaning, shopping, going out, reading and writing, and learning. Regular -ar, -er and -ir verbs, each with its infinitive. Not yet checked by a Spanish speaker: please report any mistake."

cards:
  "es-0280":
    native: "to buy"
    notes:
      "n1": "Comprar is to buy. It is a regular -ar verb: compro, compras, compra."
    examples:
      "Quiero comprar pan.":
        native: "I want to buy bread."
        bases:
          "Quiero": "I want"
          "comprar": "to buy"
          "pan": "bread"
      "Voy a comprar leche.":
        native: "I am going to buy milk."
        bases:
          "a": "to"
          "comprar": "to buy"
          "leche": "milk"
  "es-0281":
    native: "to walk"
    notes:
      "n1": "Caminar is to walk. It is a regular -ar verb: camino, caminas, camina."
    examples:
      "Me gusta caminar por el parque.":
        native: "I like to walk through the park."
        bases:
          "Me": "me"
          "gusta": "likes"
          "caminar": "to walk"
          "por": "through"
          "el": "the"
          "parque": "park"
      "Quiero caminar a casa.":
        native: "I want to walk home."
        bases:
          "Quiero": "I want"
          "caminar": "to walk"
          "a": "to"
          "casa": "house"
  "es-0282":
    native: "to have breakfast"
    notes:
      "n1": "Desayunar is to have breakfast. Desayuno is the noun for breakfast too."
    examples:
      "Quiero desayunar a las siete.":
        native: "I want to have breakfast at seven."
        bases:
          "Quiero": "I want"
          "desayunar": "to have breakfast"
          "a": "to"
          "las": "the"
      "Antes de salir, quiero desayunar.":
        native: "Before leaving, I want to have breakfast."
        bases:
          "Antes": "before"
          "de": "of"
          "salir": "to leave"
          "quiero": "I want"
          "desayunar": "to have breakfast"
  "es-0283":
    native: "to have dinner"
    notes:
      "n1": "Cenar is to have dinner: the main meal of the evening, or a light supper."
    examples:
      "Vamos a cenar juntos.":
        native: "We are going to have dinner together."
        bases:
          "a": "to"
          "cenar": "to have dinner"
          "juntos": "together"
      "Me gusta cenar temprano.":
        native: "I like to have dinner early."
        bases:
          "Me": "me"
          "gusta": "likes"
          "cenar": "to have dinner"
          "temprano": "early"
  "es-0284":
    native: "to cook"
    notes:
      "n1": "Cocinar is to cook. Cocina, the kitchen, is a different noun with the same spelling."
    examples:
      "Me gusta cocinar para mi familia.":
        native: "I like to cook for my family."
        bases:
          "Me": "me"
          "gusta": "likes"
          "cocinar": "to cook"
          "para": "for"
          "familia": "family"
      "Mi abuelo sabe cocinar muy bien.":
        native: "My grandfather knows how to cook very well."
        bases:
          "abuelo": "grandfather"
          "sabe": "knows"
          "cocinar": "to cook"
          "muy": "very"
          "bien": "well"
  "es-0285":
    native: "to clean"
    notes:
      "n1": "Limpiar is to clean. Limpio is clean, as an adjective."
    examples:
      "Hay que limpiar la mesa.":
        native: "The table has to be cleaned."
        bases:
          "Hay": "there is"
          "que": "that"
          "limpiar": "to clean"
          "la": "the"
          "mesa": "table"
