          "mensaje": "message"
  "es-0292":
    native: "to look at; to watch"
    notes:
      "n1": "Mirar is to look at something, or to watch it. Ver is to see."
    examples:
      "Me gusta mirar la televisión.":
        native: "I like to watch television."
