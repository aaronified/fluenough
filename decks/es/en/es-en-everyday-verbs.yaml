  "es-0290":
    native: "to arrive"
    notes:
      "n1": "Llegar is to arrive. It is the opposite of salir, to leave."
    examples:
      "Quiero llegar a tiempo.":
        native: "I want to arrive on time."
        bases:
          "Quiero": "I want"
          "llegar": "to arrive"
