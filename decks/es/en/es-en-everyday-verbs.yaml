          "limpiar": "to clean"
          "el": "the"
          "baño": "bathroom"
  "es-0286":
    native: "to wash"
    notes:
      "n1": "Lavar is to wash. It is used for clothes, dishes and hands."
    examples:
      "Hay que lavar los platos.":
        native: "The dishes have to be washed."
        bases:
          "Hay": "there is"
          "que": "that"
          "lavar": "to wash"
          "los": "the"
          "platos": "dishes"
      "Quiero lavar la ropa.":
        native: "I want to wash the clothes."
        bases:
          "Quiero": "I want"
          "lavar": "to wash"
          "la": "the"
          "ropa": "clothes"
  "es-0287":
    native: "to use"
    notes:
      "n1": "Usar is to use. It is a regular -ar verb: uso, usas, usa."
    examples:
      "¿Puedo usar tu teléfono?":
        native: "May I use your phone?"
        bases:
          "Puedo": "I can"
          "usar": "to use"
          "teléfono": "phone"
      "Quiero usar el libro para estudiar.":
        native: "I want to use the book to study."
