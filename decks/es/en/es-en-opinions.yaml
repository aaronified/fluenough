      "Llegamos a un acuerdo.": { native: "We reached an agreement.", bases: { "a": "to", "un": "a", "acuerdo": "agreement" } }
      "Estoy de acuerdo contigo.": { native: "I agree with you.", bases: { "de": "of", "acuerdo": "agreement", "contigo": "with you" } }
  "es-2105":
