schema: 1
id: "es-en-opinions"
kind: "layer"
core: "es-opinions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Opinions: agree, disagree, praise and criticize"
license: "CC-BY-SA-4.0"
description: "Words for giving your view: agreeing and disagreeing, the reason and the argument, praise and criticism, what is true and false, and the verbs to support, reject, suggest and prefer. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-2104":
    native: "agreement"
    notes: { n1: "El acuerdo is an agreement, a shared view or a deal. Estar de acuerdo is to agree." }
    bases: { "el": "the", "acuerdo": "agreement" }
