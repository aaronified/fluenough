schema: 1
id: "es-en-grammar-plural"
kind: "layer"
core: "es-grammar-plural"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Spanish plural nouns"
license: "CC-BY-SA-4.0"
description: "Most Spanish nouns form the plural with -s or -es, and the article changes with it. Not yet checked by a Spanish speaker: please report any mistake."
pattern:
  name: "The plural of nouns"
  slot_name: "number"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "libro": "book"
    "casa": "house"
    "mesa": "table"
    "flor": "flower"
    "papel": "paper"
    "problema": "problem"
    "mano": "hand"
    "mapa": "map"
    "pared": "wall"
    "plato": "plate"
    "cama": "bed"
    "ciudad": "city"
    "dia": "day"
    "pais": "country"
    "profesion": "job; profession"
    "bebe": "baby"
    "vaso": "glass"
    "kilo": "kilo"
    "gramo": "gram"
    "litro": "litre"
    "paquete": "packet"
    "botella": "bottle"
    "bolsa": "bag"
    "lata": "tin; can"
    "caja": "box"
    "taza": "cup"
    "trozo": "piece"
    "par": "pair"
    "docena": "dozen"
    "mitad": "half"
    "cantidad": "amount"
    "monton": "heap; lot"
    "resto": "rest"
  notes: "Add -s to a noun that ends in a vowel (libro, libros; casa, casas) and -es to one that ends in a consonant (papel, papeles; flor, flores). A noun ending in -ón loses its accent in the plural: montón, montones. Nouns ending in -ción or -sión take -es (profesión, profesiones)."
