name: "Phrasebook: first phrases"
description: "Fifteen things to say from the first day, before their words are taught: six courtesy phrases (hello, thank you, please, good morning, good night, sorry), then the first nouns (water, food, the street) and the verbs to be, to have, to go, to speak and to eat, as single words. Not yet checked by a Spanish speaker: please report any mistake."
