schema: 1
id: "es-en-food-sentences"
kind: "layer"
core: "es-food-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences: food and drink"
license: "CC-BY-SA-4.0"
description: "Thirty sentences about meals and ordering food, with the words each is often mixed up with. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-0662":
    notes:
      "n1": "De names what a dish holds: un plato de sopa."
    native: "I want a salad and a bowl of soup."
    bases: {"una": "a", "un": "a", "de": "of"}
    confusables: {"pedir": { why: "Pedir is to order, the action in a restaurant." }, "postre": { why: "Postre is dessert, not the main dish." }}
  "es-0663":
    notes:
      "n1": "In a restaurant cuenta means the bill; the same word also means account or count."
    native: "The waiter has the bill."
    bases: {"El": "the", "la": "the"}
    confusables: {"propina": { why: "Propina is a tip, the money left extra." }, "menu": { why: "Menú is the menu, not the bill." }}
  "es-0664":
    notes:
      "n1": "Tortilla is an omelette in Spain but a thin corn flatbread in Mexico and Central America."
    native: "The omelette is tasty, but the chicken is not spicy."
    bases: {"La": "the", "el": "the"}
    confusables: {"dulce": { why: "Dulce is sweet, the opposite of spicy." }, "salado": { why: "Salado is salty, another taste." }}
  "es-0665":
    notes:
      "n1": "A la una is the one hour with a singular article; the other hours take las."
    native: "We have lunch at one and have chicken for dinner."
    bases: {"a": "to", "la": "the", "una": "a"}
    confusables: {"desayuno": { why: "Desayuno is breakfast, the first meal." }, "postre": { why: "Postre is dessert, the last part of a meal." }}
  "es-0666":
    native: "I have an ice cream after dinner."
    bases: {"un": "a", "de": "of", "la": "the"}
    confusables: {"tarta": { why: "Tarta is a cake, not an ice cream." }, "bebida": { why: "Bebida is a drink, not food." }}
  "es-0667":
    notes:
      "n1": "Simpático means nice, not simple; the word for simple is sencillo."
    native: "The waitress is friendly."
    bases: {"La": "the"}
    confusables: {"camarero": { why: "Camarero is a waiter, the masculine form." }, "cliente": { why: "Cliente is a customer, not the server." }}
  "es-3240":
    native: "How much does the cheese cost?"
    bases: {"el": "the"}
    confusables: {"precio": { why: "Precio is the price of one item, a noun, not a question of amount." }, "barato": { why: "Barato is cheap, a description, not a price question." }}
  "es-3241":
    native: "My drink is water."
    confusables: {"zumo": { why: "Zumo is juice, another drink." }, "es-0611": { why: "Café is coffee, a hot drink." }}
  "es-3242":
    native: "Where do you buy the milk?"
    bases: {"la": "the"}
    confusables: {"tienda": { why: "Tienda is a shop, where you buy things." }, "supermercado": { why: "Supermercado is a supermarket, the big shop." }}
  "es-3243":
    notes:
      "n1": "Querer changes e to ie in the yo form: quiero, I want."
    native: "I do not want coffee with sugar."
    bases: {"con": "with"}
    confusables: {"es-0612": { why: "Té is tea, a hot drink without coffee." }, "zumo": { why: "Zumo is juice, a cold drink." }}
  "es-3244":
    native: "The beer is cold, but the soup is hot."
    bases: {"La": "the"}
    confusables: {"vino": { why: "Vino is wine, another alcoholic drink." }, "bebida": { why: "Bebida is any drink, the general word." }}
  "es-3245":
    notes:
      "n1": "Para names who a thing is for: una propina para el camarero."
    native: "I have a tip for the waiter."
    bases: {"una": "a", "para": "for", "el": "the"}
    confusables: {"cuenta": { why: "Cuenta is the bill, the money for the meal, not the tip." }, "es-0640": { why: "Menú is the menu, the list of dishes." }}
  "es-3246":
    notes:
      "n1": "Ir a plus an infinitive is the near future: voy a almorzar."
    native: "I am going to have lunch with my sister."
    bases: {"a": "to", "con": "with"}
    confusables: {"desayunar": { why: "Desayunar is to have breakfast, the first meal." }, "cenar": { why: "Cenar is to have dinner, the last meal." }}
  "es-3247":
    notes:
      "n1": "Querer takes the infinitive with no preposition: quiero comer."
    native: "I want to eat bread and cheese."
    confusables: {"mantequilla": { why: "Mantequilla is butter, not cheese." }, "arroz": { why: "Arroz is rice, another food to eat." }}
  "es-3248":
    native: "Who pays the bill?"
    bases: {"la": "the"}
    confusables: {"propina": { why: "Propina is a tip, the extra money left." }, "dinero": { why: "Dinero is money in general, not the bill." }}
  "es-3249":
    native: "We drink wine with the dessert."
    bases: {"con": "with", "el": "the"}
    confusables: {"cerveza": { why: "Cerveza is beer, a different drink." }, "agua": { why: "Agua is water, the drink without alcohol." }}
  "es-3250":
    native: "Now I need the menu."
    bases: {"el": "the"}
    confusables: {"plato": { why: "Plato is a dish, one food on the menu." }, "postre": { why: "Postre is dessert, one course, not the list." }}
  "es-3251":
    notes:
      "n1": "Plato means a dish or a plate; lavar los platos means washing up."
    native: "I wash the dishes after dinner."
    bases: {"los": "the", "de": "of", "la": "the"}
    confusables: {"limpiar": { why: "Limpiar is to clean, a different chore." }, "helado": { why: "Helado is ice cream, a dessert, not a dish to wash." }}
  "es-3252":
    native: "What do you have for lunch?"
    bases: {"para": "for", "el": "the"}
    confusables: {"desayuno": { why: "Desayuno is breakfast, the first meal." }, "cena": { why: "Cena is dinner, the evening meal." }}
  "es-3253":
    notes:
      "n1": "Rico here means tasty, as food is; the same word also means rich."
    native: "The ice cream is very tasty."
    bases: {"El": "the"}
    confusables: {"tarta": { why: "Tarta is a cake, not an ice cream." }, "postre": { why: "Postre is dessert in general." }}
  "es-3254":
    native: "They have omelette and tea for breakfast."
    confusables: {"pizza": { why: "Pizza is a different dish, with cheese." }, "ensalada": { why: "Ensalada is salad, a vegetable dish." }}
  "es-3255":
    notes:
      "n1": "Pedir changes e to i in the stem: piden, they order."
    native: "They do not order dessert."
    confusables: {"helado": { why: "Helado is ice cream, a dessert but not the course." }, "tarta": { why: "Tarta is a cake, another dessert." }}
  "es-3256":
    notes:
      "n1": "Pedir keeps its e in the nosotros form: pedimos, we order."
    native: "My father and I order the soup and the bread."
    bases: {"la": "the", "el": "the"}
    confusables: {"ensalada": { why: "Ensalada is salad, another first course." }, "tortilla": { why: "Tortilla is an omelette, a dish of egg." }}
  "es-3257":
    notes:
      "n1": "Nunca before the verb needs no no: nunca cocino, not no nunca cocino."
    native: "I never cook pizza with my cousin and my aunt."
    bases: {"con": "with"}
    confusables: {"bocadillo": { why: "Bocadillo is a sandwich, a different quick meal." }, "hamburguesa": { why: "Hamburguesa is a burger, another fast food." }}
  "es-3258":
    notes:
      "n1": "Tu without an accent is your; tú with one is you."
    native: "Are you having dinner with your aunt?"
    bases: {"con": "with"}
    confusables: {"almuerzo": { why: "Almuerzo is lunch, the midday meal." }, "desayuno": { why: "Desayuno is breakfast, the morning meal." }}
  "es-3259":
    native: "The sandwich costs five euros."
    bases: {"El": "the"}
    confusables: {"hamburguesa": { why: "Hamburguesa is a burger, not a sandwich." }, "pizza": { why: "Pizza is a flat dish with cheese, not a sandwich." }}
  "es-3260":
    native: "I take a burger home."
    bases: {"una": "a", "a": "to"}
    confusables: {"bocadillo": { why: "Bocadillo is a sandwich, not a burger." }, "pizza": { why: "Pizza is a different dish." }}
  "es-3261":
    native: "Are you having a cake or an ice cream today?"
    bases: {"una": "a", "un": "a"}
    confusables: {"postre": { why: "Postre is dessert in general." }, "bebida": { why: "Bebida is a drink, not a cake." }}
  "es-3262":
    native: "They prepare the salad."
    bases: {"la": "the"}
    confusables: {"sopa": { why: "Sopa is soup, a hot first course." }, "verdura": { why: "Verdura is vegetables in general." }}
  "es-3263":
    notes:
      "n1": "Tener is irregular in the yo form: tengo, not teno."
    native: "I eat a sandwich today, but I have a cake."
    bases: {"un": "a", "una": "a"}
    confusables: {"hamburguesa": { why: "Hamburguesa is a burger, a different snack." }, "helado": { why: "Helado is ice cream, not a cake." }}
