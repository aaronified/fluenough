schema: 1
id: "es-en-services-sentences"
kind: "layer"
core: "es-services-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences: services"
license: "CC-BY-SA-4.0"
description: "Six sentences about banks, the post and repairs, with the words each is often mixed up with. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-2248":
    notes:
      "n1": "Del joins de and el into one word: del cajero, from the cash machine."
    native: "I take money out of the cash machine and pay the loan."
    bases: { "del": "of", "el": "the" }
    confusables: { "ingreso": { why: "Ingreso is money paid in, the opposite of taking out." }, "comision": { why: "Comisión is a fee, not the loan itself." } }
  "es-2249":
    notes:
      "n1": "Para marks the purpose: para la reparación, for the repair."
    native: "I take the car to the mechanic for the repair."
    bases: { "el": "the", "al": "to the", "para": "for", "la": "the" }
    confusables: { "fontanero": { why: "Fontanero is a plumber, for water pipes." }, "electricista": { why: "Electricista is an electrician, for power." } }
  "es-2250":
    notes:
      "n1": "Dirección means address here, the place written on an envelope, and it also means direction."
    native: "I write the address on the envelope."
    bases: { "la": "the", "en": "in", "el": "the" }
    confusables: { "remitente": { why: "Remitente is the sender, who writes their own name." }, "destinatario": { why: "Destinatario is the recipient, the one who receives." } }
  "es-2251":
    notes:
      "n1": "An infinitive on its own gives an instruction, as on a form: rellenar means fill in and firmar means sign."
    native: "Fill in the form and sign."
    bases: { "Rellenar": "to fill in", "el": "the" }
    confusables: { "solicitud": { why: "Solicitud is an application, a request for something." }, "firma": { why: "Firma is the signature, the name you write." } }
  "es-2252":
    notes:
      "n1": "Spanish uses the article el, not a possessive, with hair and body parts: el pelo, the hair."
    native: "The hairdresser cuts the hair in the hairdresser's."
    bases: { "El": "the", "en": "in", "la": "the" }
    confusables: { "sastre": { why: "Sastre is a tailor, who sews clothes." }, "zapatero": { why: "Zapatero is a shoe repairer." } }
  "es-2253":
    notes:
      "n1": "A goes before la when you go to a place: a la tintorería, to the dry cleaner's."
    native: "I take the coat to the dry cleaner's and the laundry."
    bases: { "el": "the", "a": "to", "la": "the" }
    confusables: { "servicio": { why: "Servicio is a service, the general word." }, "arreglo": { why: "Arreglo is a repair, a fix of something broken." } }
  "es-4653":
    notes:
      "n1": "Querer changes its stem e to ie in most forms: quiero, but queremos keeps the e."
    native: "I want to send a parcel."
    bases: { "un": "a" }
    confusables: { "correo": { why: "Correo is the post as a whole, not the parcel you send." }, "sobre": { why: "Sobre is an envelope, not the parcel you send." } }
  "es-4654":
    notes:
      "n1": "Sello means a postage stamp here, and it can also mean a seal or a rubber stamp."
    native: "I need a stamp, please."
    bases: { "un": "a", "por": "for", "favor": "please" }
    confusables: { "sobre": { why: "Sobre is the envelope, not the stamp you stick on it." }, "correo": { why: "Correo is the post as a whole, not the stamp." } }
  "es-4655":
    notes:
      "n1": "Querer changes its stem e to ie in quiero, and not in queremos."
    native: "I want to take out money."
    confusables: { "cambiar": { why: "Cambiar is to change money into another currency, not to take it out." }, "cajero": { why: "Cajero is the cash machine you take the money from, not the action." } }
  "es-4656":
    notes:
      "n1": "Con has no article before tarjeta: con tarjeta means by card."
    native: "Can I pay by card?"
    bases: { "con": "by" }
    confusables: { "efectivo": { why: "Efectivo is cash, the other way to pay." }, "dinero": { why: "Dinero is money, a noun, not a way to pay." } }
