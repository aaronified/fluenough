description: 'Eight sentences about things to carry, use and keep, with the words each is often mixed up with. Not yet checked by a Spanish speaker: please report any mistake.'
cards:
  es-1198:
    native: I put the wallet and the keys in the suitcase.
    bases:
      Pongo: I put
      la: the
      las: the
      en: in
    confusables:
      bag:
        why: Bolsa is a bag for shopping or carrying, not a case for a trip.
      backpack:
        why: Mochila is a backpack, worn on the back, not a suitcase.
  es-1199:
    native: The phone charger is on the table.
    bases:
      El: The
      del: of the
      en: 'on'
      la: the
    confusables:
      battery:
        why: Pila is a battery, not a charger.
      remote:
        why: Mando is a remote control, not a charger.
  es-1200:
    native: Look at the photo on the computer screen.
    bases:
      la: the
      en: 'on'
      del: of the
    confusables:
      camera:
        why: Cámara is the camera that takes the photo, not the screen.
      remote:
        why: Mando is a remote control, not a screen.
  es-1201:
    native: I leave the spoon and the fork on the table.
    bases:
      Dejo: I leave
      la: the
      el: the
      en: 'on'
    confusables:
      knife:
        why: Cuchillo is a knife, one of the cutlery, but this sentence has a spoon and a fork.
      plate:
        why: Plato is a plate, where the food goes, not cutlery.
  es-1202:
    native: The light bulb does not work and the battery is flat.
    bases:
      La: The
      funciona: works
    confusables:
      towel:
        why: Toalla is a towel; this sentence is about a light and a battery.
      soap:
        why: Jabón is soap, not a light or a battery.
  es-1203:
    native: I keep the pen in the handbag.
    bases:
      Guardo: I keep
      el: the
      en: in
    confusables:
      pencil:
        why: Lápiz is a pencil, the other writing tool, not a pen.
      notebook:
        why: Cuaderno is a notebook, where you write, not a pen.
  es-1204:
    native: Can you lend me the coin for the coffee?
    bases:
      Me: me
      prestas: lend
      la: the
      para: for
      el: the
    confusables:
      euro:
        why: Euro is the currency, not a coin you hold.
      bill:
        why: Billete is a banknote of paper money, not a coin.
  es-1205:
    native: The parcel is heavy and the backpack is light.
    bases:
      El: The
      la: the
    confusables:
      box:
        why: Caja is a box; this sentence is about a parcel and a bag.
      bag:
        why: Bolsa is a bag for shopping, not a backpack.
