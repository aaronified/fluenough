schema: 1
id: "es-en-business-email"
kind: "layer"
core: "es-business-email"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Business: writing and answering email"
license: "CC-BY-SA-4.0"
description: "Words and phrases for writing and answering work email: the subject, the attachment, the reply and the polite closing lines."
cards:
  "es-4710":
    native: "I am writing to confirm the meeting."
    notes: { n1: "Le is the usted form, used in a formal email." }
  "es-4711":
    native: "I attach the document."
    notes: { n1: "Adjunto is the I form of adjuntar, so no subject pronoun is needed." }
  "es-4712":
    native: "I look forward to your reply."
    notes: { n1: "Quedar a la espera de is a fixed formal phrase for waiting for someone's reply." }
  "es-4713":
    native: "Thank you for your prompt reply."
    notes: { n1: "Su is the formal your, used for a person you address as usted." }
  "es-4714":
    native: "Sorry for the delay in replying."
    notes: { n1: "Disculpe is the usted form of disculpar, used to apologise politely." }
  "es-4715":
    native: "Could you send me the invoice?"
    notes: { n1: "Podría is the polite usted form; to a colleague you would say ¿Podrías enviarme la factura?" }
  "es-4716":
    native: "Sorry, I got the recipient wrong."
    notes: { n1: "Equivocarse de plus a noun means to get the wrong one, here the recipient." }
  "es-4717":
    native: "Kind regards."
    notes: { n1: "A common closing line for a formal email." }
  "es-4718":
    native: "subject (of an email); matter"
    notes: { n1: "Asunto is masculine, so it takes el, not la." }
    bases: { "el": "the", "asunto": "subject" }
    examples:
      "Escriba un asunto claro.": { native: "Write a clear subject.", bases: { "Escriba": "write", "un": "a", "asunto": "subject", "claro": "clear" } }
      "El asunto es urgente.": { native: "The matter is urgent.", bases: { "El": "the", "asunto": "matter", "es": "is", "urgente": "urgent" } }
  "es-4719":
    native: "attachment"
    notes: { n1: "Adjunto is also an adjective meaning attached; as a noun it means the attachment." }
    bases: { "el": "the", "adjunto": "attachment" }
    examples:
      "Le envío el adjunto con este correo.": { native: "I am sending you the attachment with this email.", bases: { "Le": "to you", "envío": "I send", "el": "the", "adjunto": "attachment", "con": "with", "este": "this", "correo": "email" } }
      "Revise el adjunto antes de responder.": { native: "Check the attachment before replying.", bases: { "Revise": "check", "el": "the", "adjunto": "attachment", "antes": "before", "de": "of", "responder": "replying" } }
  "es-4720":
    native: "reply"
    notes: { n1: "Respuesta is feminine, so it takes la." }
    bases: { "la": "the", "respuesta": "reply" }
    examples:
      "Espero su respuesta pronto.": { native: "I hope to get your reply soon.", bases: { "Espero": "I hope", "su": "your", "respuesta": "reply", "pronto": "soon" } }
      "La respuesta llegó ayer.": { native: "The reply arrived yesterday.", bases: { "La": "the", "respuesta": "reply", "llegó": "arrived", "ayer": "yesterday" } }
