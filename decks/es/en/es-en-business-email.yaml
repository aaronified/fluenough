cards:
  "es-4710":
    native: "I am writing to confirm the meeting."
    notes: { n1: "Le is the usted form, used in a formal email." }
  "es-4711":
    native: "I attach the document."
  "es-4712":
    native: "I look forward to your reply."
  "es-4713":
    native: "Thank you for your prompt reply."
  "es-4714":
    native: "Sorry for the delay in replying."
    notes: { n1: "Disculpe is the usted form of disculpar, used to apologise politely." }
  "es-4715":
    native: "Could you send me the invoice?"
  "es-4716":
    native: "Sorry, I got the recipient wrong."
  "es-4717":
    native: "Kind regards."
    notes: { n1: "A common closing line for a formal email." }
  "es-4718":
    native: "subject"
    examples:
      "Escriba un asunto claro.": { native: "Write a clear subject." }
      "El asunto es urgente.": { native: "The subject is urgent." }
  "es-4719":
    native: "attachment"
    examples:
      "Le envío el adjunto por correo.": { native: "I am sending you the attachment by email." }
      "Revise el adjunto antes de responder.": { native: "Check the attachment before replying." }
  "es-4720":
    native: "reply"
    examples:
      "Espero su respuesta pronto.": { native: "I look forward to your reply soon." }
      "La respuesta llegó ayer.": { native: "The reply arrived yesterday." }
