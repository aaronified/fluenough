description: "Six sentences about the courts, crime and rules, with the words each is often mixed up with. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-2879":
    native: "The judge gives the sentence in the court."
    bases: { "El": "the", "dicta": "to dictate; to deliver (a judgement)", "la": "the", "en": "in", "el": "the" }
    confusables: { "juicio": { why: "Juicio is the trial, the process before the sentence." }, "condena": { why: "Condena is the conviction, the punishment itself." } }
  "es-2880":
    native: "Stealing is an offence and a serious crime."
    bases: { "un": "a" }
    confusables: { "delincuente": { why: "Delincuente is the criminal, the person." }, "abuso": { why: "Abuso is abuse, a different harm." } }
  "es-2881":
    native: "I make a complaint at the police station."
    bases: { "una": "a", "en": "in", "la": "the" }
    confusables: { "demanda": { why: "Demanda is a lawsuit, a civil case." }, "arresto": { why: "Arresto is an arrest, a police action." } }
  "es-2882":
    native: "The victim testifies before the judge."
    bases: { "La": "the", "ante": "before (a court)", "el": "the" }
    confusables: { "acusado": { why: "Acusado is the accused, the other party." }, "testigo": { why: "Testigo is a witness, who sees the event." } }
  "es-2883":
    native: "It is a fraud and it is forbidden."
    bases: { "un": "a" }
    confusables: { "norma": { why: "Norma is a rule, the general standard." }, "culpable": { why: "Culpable is guilty, a judgement about a person." } }
  "es-2884":
    native: "The accused is innocent and has freedom."
    bases: { "El": "the" }
    confusables: { "prision": { why: "Prisión is prison, the place of punishment." }, "carcel": { why: "Cárcel is jail, another place of punishment." } }
