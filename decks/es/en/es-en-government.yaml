      "Mi residencia es en Madrid.": { native: "My residence is in Madrid.", bases: { "residencia": "residence", "en": "in" } }
      "Pido la residencia.": { native: "I apply for residence.", bases: { "la": "the", "residencia": "residence" } }
  "es-2287":
    native: "town hall; council"
    notes: { n1: "El ayuntamiento is the town hall, where the local government works." }
    bases: { "el": "the", "ayuntamiento": "town hall; council" }
    examples:
      "El ayuntamiento está en la plaza.": { native: "The town hall is in the square.", bases: { "El": "the", "ayuntamiento": "town hall; council", "en": "in", "la": "the" } }
      "Voy al ayuntamiento hoy.": { native: "I go to the town hall today.", bases: { "al": "to the", "ayuntamiento": "town hall; council" } }
  "es-2288":
    native: "municipality"
    notes: { n1: "El municipio is a municipality, a town with its own council." }
    bases: { "el": "the", "municipio": "municipality" }
    examples:
      "Vivo en un municipio pequeño.": { native: "I live in a small municipality.", bases: { "en": "in", "un": "a", "municipio": "municipality" } }
      "El municipio tiene mil habitantes.": { native: "The municipality has a thousand inhabitants.", bases: { "El": "the", "municipio": "municipality" } }
  "es-2289":
    native: "province"
    notes: { n1: "La provincia is a province, a region of a country with its own capital." }
    bases: { "la": "the", "provincia": "province" }
    examples:
      "Vivo en la provincia de Sevilla.": { native: "I live in the province of Seville.", bases: { "en": "in", "la": "the", "provincia": "province", "de": "of" } }
      "La provincia es grande.": { native: "The province is big.", bases: { "La": "the", "provincia": "province" } }
  "es-2290":
    native: "nation"
    notes: { n1: "La nación is a nation, a people with a shared country and history." }
    bases: { "la": "the", "nación": "nation" }
    examples:
      "La nación celebra su día.": { native: "The nation celebrates its day.", bases: { "La": "the", "nación": "nation", "celebra": "to celebrate" } }
      "Es una nación grande.": { native: "It is a large nation.", bases: { "una": "a", "nación": "nation" } }
  "es-2291":
    native: "governor"
    notes: { n1: "El gobernador is the governor of a province or state. The feminine is la gobernadora." }
    bases: { "el": "the", "gobernador": "governor" }
    examples:
      "El gobernador visita la provincia.": { native: "The governor visits the province.", bases: { "El": "the", "gobernador": "governor", "la": "the" } }
      "La gobernadora habla en la radio.": { native: "The governor speaks on the radio.", bases: { "La": "the", "gobernadora": "governor", "en": "in" } }
  "es-2292":
    native: "vote; voting"
    notes: { n1: "La votación is the act of voting, or the count of votes." }
    bases: { "la": "the", "votación": "vote; voting" }
    examples:
