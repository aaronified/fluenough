      "Gestionan los documentos.": { native: "They process the documents.", bases: { "Gestionan": "to manage; to process", "los": "the" } }
  "es-2296":
    native: "to apply for; to request"
    notes: { n1: "Solicitar is to apply for something official, such as a permit or a job." }
    bases: { "solicitar": "to apply for; to request" }
    examples:
      "Solicito una licencia.": { native: "I apply for a licence.", bases: { "Solicito": "to apply for; to request", "una": "a" } }
      "Solicitan el certificado.": { native: "They apply for the certificate.", bases: { "Solicitan": "to apply for; to request", "el": "the" } }
