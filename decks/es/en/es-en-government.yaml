    bases: { "votar": "to vote" }
    examples:
      "Voto por el candidato.": { native: "I vote for the candidate.", bases: { "Voto": "to vote", "por": "for", "el": "the" } }
      "Votamos el martes.": { native: "We vote on Tuesday.", bases: { "Votamos": "to vote", "el": "the" } }
  "es-2294":
    native: "to govern"
    notes: { n1: "Gobernar is to govern, to run a country or a region. Its stem changes: gobierno, gobiernas." }
    bases: { "gobernar": "to govern" }
    examples:
      "El partido gobierna la ciudad.": { native: "The party governs the city.", bases: { "El": "the", "gobierna": "to govern", "la": "the" } }
      "Gobiernan con una mayoría.": { native: "They govern with a majority.", bases: { "Gobiernan": "to govern", "con": "with", "una": "a", "mayoría": "majority" } }
  "es-2295":
