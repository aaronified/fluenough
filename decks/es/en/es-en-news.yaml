    notes: { n1: "Transmitir is to send out a signal, or to pass a message on." }
    bases: { "transmitir": "to transmit; to broadcast" }
    examples:
      "Transmiten el partido en directo.": { native: "They broadcast the match live.", bases: { "Transmiten": "to transmit; to broadcast", "el": "the", "partido": "match", "en": "in", "directo": "direct" } }
      "Transmito el mensaje.": { native: "I pass on the message.", bases: { "Transmito": "to transmit; to broadcast", "el": "the" } }
