  "es-0592":
    native: "There is an offer today at the shop."
    bases: {"Hay": "there is", "una": "a", "en": "in", "la": "the"}
    confusables: {"precio": { why: "Precio is the price, not an offer." }, "cambio": { why: "Cambio is change, the money given back." }}
  "es-0593":
    native: "The potato is cheap."
    bases: {"La": "the"}
    confusables: {"caro": { why: "Caro is expensive, the opposite of barato." }, "pequeno": { why: "Pequeño is small, not cheap." }}
