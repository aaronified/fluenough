schema: 1
id: "es-en-history"
kind: "layer"
core: "es-history"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "History: kings, forts, wars and heritage"
license: "CC-BY-SA-4.0"
description: "Words for the past: the kings and queens, the castle and the fortress, the war and the battle, the empire and the century, the ruins and the heritage, and the verbs to conquer, found, win and die. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-2554":
    native: "history; story"
    notes: { n1: "La historia is history, the study and account of the past, and also a story." }
    bases: { "la": "the", "historia": "history; story" }
    examples:
      "La historia de España es larga.": { native: "The history of Spain is long.", bases: { "La": "the", "historia": "history; story", "de": "of" } }
      "Leo la historia de la ciudad.": { native: "I read the history of the city.", bases: { "la": "the", "historia": "history; story", "de": "of" } }
  "es-2555":
    native: "king"
    notes: { n1: "El rey is a king. The feminine is la reina." }
    bases: { "el": "the", "rey": "king" }
    examples:
      "El rey vive en el palacio.": { native: "The king lives in the palace.", bases: { "El": "the", "rey": "king", "en": "in" } }
      "Hay un rey en la historia.": { native: "There is a king in the history.", bases: { "Hay": "there is; there are", "un": "a", "rey": "king", "en": "in", "la": "the" } }
  "es-2556":
    native: "queen"
    notes: { n1: "La reina is a queen, the wife of a king or a ruler herself." }
    bases: { "la": "the", "reina": "queen" }
    examples:
      "La reina llega en un coche.": { native: "The queen arrives in a car.", bases: { "La": "the", "reina": "queen", "en": "in", "un": "a" } }
      "La reina gobierna el país.": { native: "The queen rules the country.", bases: { "La": "the", "reina": "queen", "el": "the" } }
  "es-2557":
    native: "emperor"
    notes: { n1: "El emperador is an emperor, the ruler of an empire. The feminine is la emperatriz." }
    bases: { "el": "the", "emperador": "emperor" }
    examples:
      "El emperador manda en el imperio.": { native: "The emperor rules the empire.", bases: { "El": "the", "emperador": "emperor", "manda": "to rule; to command", "en": "in" } }
      "Un emperador vivió aquí.": { native: "An emperor lived here.", bases: { "Un": "a", "emperador": "emperor" } }
  "es-2558":
    native: "prince"
    notes: { n1: "El príncipe is a prince, the son of a king. The feminine is la princesa." }
    bases: { "el": "the", "príncipe": "prince" }
    examples:
      "El príncipe es muy joven.": { native: "The prince is very young.", bases: { "El": "the", "príncipe": "prince" } }
      "El príncipe va al castillo.": { native: "The prince goes to the castle.", bases: { "El": "the", "príncipe": "prince", "al": "to the" } }
  "es-2559":
    native: "war"
    notes: { n1: "La guerra is a war between countries or groups. The opposite of peace is la paz." }
    bases: { "la": "the", "guerra": "war" }
    examples:
      "La guerra duró mucho tiempo.": { native: "The war lasted a long time.", bases: { "La": "the", "guerra": "war", "tiempo": "time" } }
      "Muchas personas sufren la guerra.": { native: "Many people suffer from war.", bases: { "sufren": "to suffer", "la": "the", "guerra": "war" } }
  "es-2560":
    native: "battle"
    notes: { n1: "La batalla is a battle, a fight between armies in a war." }
    bases: { "la": "the", "batalla": "battle" }
    examples:
      "La batalla fue en el valle.": { native: "The battle was in the valley.", bases: { "La": "the", "batalla": "battle", "fue": "was; went", "en": "in", "el": "the" } }
      "Ganaron la batalla.": { native: "They won the battle.", bases: { "la": "the", "batalla": "battle" } }
  "es-2561":
    native: "castle"
    notes: { n1: "El castillo is a castle, a fortified building with walls and towers." }
    bases: { "el": "the", "castillo": "castle" }
    examples:
      "El castillo está en la colina.": { native: "The castle is on the hill.", bases: { "El": "the", "castillo": "castle", "en": "in", "la": "the" } }
      "Visitamos un castillo antiguo.": { native: "We visit an old castle.", bases: { "un": "a", "castillo": "castle" } }
  "es-2562":
    native: "fortress"
    notes: { n1: "La fortaleza is a fortress, a strong building made to defend a place." }
    bases: { "la": "the", "fortaleza": "fortress" }
    examples:
      "La fortaleza tiene muros altos.": { native: "The fortress has high walls.", bases: { "La": "the", "fortaleza": "fortress", "muros": "wall", "altos": "high" } }
      "Los soldados viven en la fortaleza.": { native: "The soldiers live in the fortress.", bases: { "Los": "the", "en": "in", "la": "the", "fortaleza": "fortress" } }
  "es-2563":
    native: "army"
    notes: { n1: "El ejército is an army, the armed force of a country." }
    bases: { "el": "the", "ejército": "army" }
    examples:
      "El ejército llega a la ciudad.": { native: "The army arrives in the city.", bases: { "El": "the", "ejército": "army", "a": "to", "la": "the" } }
      "Hay un ejército grande.": { native: "There is a large army.", bases: { "Hay": "there is; there are", "un": "a", "ejército": "army" } }
  "es-2564":
    native: "soldier"
    notes: { n1: "El soldado is a soldier, a person who fights in an army. The feminine is la soldado or la soldada." }
    bases: { "el": "the", "soldado": "soldier" }
    examples:
      "El soldado lucha en la guerra.": { native: "The soldier fights in the war.", bases: { "El": "the", "soldado": "soldier", "en": "in", "la": "the" } }
      "Los soldados descansan.": { native: "The soldiers rest.", bases: { "Los": "the", "soldados": "soldier" } }
  "es-2565":
    native: "conquest"
    notes: { n1: "La conquista is a conquest, when a land is taken by force." }
    bases: { "la": "the", "conquista": "conquest" }
    examples:
      "La conquista cambió el país.": { native: "The conquest changed the country.", bases: { "La": "the", "el": "the" } }
      "Recuerdan la conquista.": { native: "They remember the conquest.", bases: { "la": "the" } }
  "es-2566":
    native: "empire"
    notes: { n1: "El imperio is an empire, many lands ruled by one emperor or power." }
    bases: { "el": "the", "imperio": "empire" }
    examples:
      "El imperio es muy grande.": { native: "The empire is very big.", bases: { "El": "the", "imperio": "empire" } }
      "El imperio cae después de años.": { native: "The empire falls after years.", bases: { "El": "the", "imperio": "empire", "cae": "to fall", "de": "of" } }
  "es-2567":
    native: "century"
    notes: { n1: "El siglo is a century, a period of one hundred years." }
    bases: { "el": "the", "siglo": "century" }
    examples:
      "Vivimos en el siglo veintiuno.": { native: "We live in the twenty-first century.", bases: { "en": "in", "el": "the", "siglo": "century" } }
      "El castillo es del siglo doce.": { native: "The castle is from the twelfth century.", bases: { "El": "the", "del": "of", "siglo": "century" } }
  "es-2568":
    native: "era; period"
    notes: { n1: "La época is an era or a period of time in history." }
    bases: { "la": "the", "época": "era; period" }
    examples:
      "Es una época difícil.": { native: "It is a difficult period.", bases: { "una": "a", "época": "era; period" } }
      "La época romana fue larga.": { native: "The Roman era was long.", bases: { "La": "the", "época": "era; period", "romana": "Roman", "fue": "was; went" } }
  "es-2569":
    native: "civilisation"
    notes: { n1: "La civilización is a civilisation, a people with their own culture and society." }
    bases: { "la": "the", "civilización": "civilisation" }
    examples:
      "La civilización romana es famosa.": { native: "The Roman civilisation is famous.", bases: { "La": "the", "civilización": "civilisation", "romana": "Roman", "famosa": "famous" } }
      "Estudio una civilización antigua.": { native: "I study an ancient civilisation.", bases: { "una": "a", "civilización": "civilisation" } }
  "es-2570":
    native: "ruin"
    notes: { n1: "La ruina is a ruin, what is left of an old building. The plural is ruinas." }
    bases: { "la": "the", "ruina": "ruin" }
    examples:
      "Las ruinas son muy bonitas.": { native: "The ruins are very pretty.", bases: { "Las": "the", "ruinas": "ruin" } }
      "Visitamos las ruinas romanas.": { native: "We visit the Roman ruins.", bases: { "las": "the", "ruinas": "ruin", "romanas": "Roman" } }
  "es-2571":
    native: "tomb"
    notes: { n1: "La tumba is a tomb, a place where a dead person is buried." }
    bases: { "la": "the", "tumba": "tomb" }
    examples:
      "La tumba está en la iglesia.": { native: "The tomb is in the church.", bases: { "La": "the", "tumba": "tomb", "en": "in" } }
      "Visito la tumba del rey.": { native: "I visit the king's tomb.", bases: { "la": "the", "tumba": "tomb", "del": "of" } }
  "es-2572":
    native: "hero"
    notes: { n1: "El héroe is a hero, a person admired for brave deeds. The feminine is la heroína." }
    bases: { "el": "the", "héroe": "hero" }
    examples:
      "El héroe salva la ciudad.": { native: "The hero saves the city.", bases: { "El": "the", "héroe": "hero", "salva": "to save", "la": "the" } }
      "Es un héroe nacional.": { native: "He is a national hero.", bases: { "un": "a", "héroe": "hero", "nacional": "national" } }
  "es-2573":
    native: "revolution"
    notes: { n1: "La revolución is a revolution, a sudden change of government or society." }
    bases: { "la": "the", "revolución": "revolution" }
    examples:
      "La revolución cambia el país.": { native: "The revolution changes the country.", bases: { "La": "the", "revolución": "revolution", "el": "the" } }
      "Estudio la revolución francesa.": { native: "I study the French revolution.", bases: { "la": "the", "revolución": "revolution", "francesa": "French" } }
  "es-2574":
    native: "independence"
    notes: { n1: "La independencia is independence, a country free from another's rule." }
    bases: { "la": "the", "independencia": "independence" }
    examples:
      "La independencia es un día de fiesta.": { native: "Independence is a holiday.", bases: { "La": "the", "independencia": "independence", "un": "a", "de": "of" } }
      "Celebran la independencia del país.": { native: "They celebrate the country's independence.", bases: { "Celebran": "to celebrate", "la": "the", "independencia": "independence", "del": "of" } }
  "es-2575":
    native: "colony"
    notes: { n1: "La colonia is a colony, a land ruled by another country." }
    bases: { "la": "the", "colonia": "colony" }
    examples:
      "La colonia tiene su propio gobierno.": { native: "The colony has its own government.", bases: { "La": "the", "colonia": "colony", "propio": "own" } }
      "Vivían en una colonia.": { native: "They lived in a colony.", bases: { "en": "in", "una": "a", "colonia": "colony" } }
  "es-2576":
    native: "colonial"
    notes: { n1: "Colonial is of a colony or colonies. It does not change for gender." }
    bases: { "colonial": "colonial" }
    examples:
      "La arquitectura colonial es bonita.": { native: "Colonial architecture is pretty.", bases: { "La": "the", "colonial": "colonial" } }
      "Es un período colonial.": { native: "It is a colonial period.", bases: { "un": "a", "período": "period", "colonial": "colonial" } }
  "es-2577":
    native: "dynasty"
    notes: { n1: "La dinastía is a dynasty, a family of rulers who follow each other." }
    bases: { "la": "the", "dinastía": "dynasty" }
    examples:
      "La dinastía gobernó mucho tiempo.": { native: "The dynasty ruled for a long time.", bases: { "La": "the", "dinastía": "dynasty", "tiempo": "time" } }
      "Es de una dinastía antigua.": { native: "He is from an ancient dynasty.", bases: { "de": "of", "una": "a", "dinastía": "dynasty" } }
  "es-2578":
    native: "palace"
    notes: { n1: "El palacio is a palace, the home of a king or queen." }
    bases: { "el": "the", "palacio": "palace" }
    examples:
      "El palacio es muy grande.": { native: "The palace is very big.", bases: { "El": "the", "palacio": "palace" } }
      "Visito el palacio en verano.": { native: "I visit the palace in summer.", bases: { "el": "the", "palacio": "palace", "en": "in" } }
  "es-2579":
    native: "temple"
    notes: { n1: "El templo is a temple, a building for worship, in many religions." }
    bases: { "el": "the", "templo": "temple" }
    examples:
      "El templo es muy antiguo.": { native: "The temple is very old.", bases: { "El": "the", "templo": "temple" } }
      "Visitamos un templo romano.": { native: "We visit a Roman temple.", bases: { "un": "a", "templo": "temple", "romano": "Roman" } }
  "es-2580":
    native: "heritage"
    notes: { n1: "El patrimonio is heritage, the things a people inherit from the past." }
    bases: { "el": "the", "patrimonio": "heritage" }
    examples:
      "El patrimonio es importante.": { native: "Heritage is important.", bases: { "El": "the", "patrimonio": "heritage" } }
      "Cuidamos el patrimonio de la ciudad.": { native: "We look after the city's heritage.", bases: { "el": "the", "patrimonio": "heritage", "de": "of", "la": "the" } }
  "es-2581":
    native: "tradition"
    notes: { n1: "La tradición is a tradition, a custom kept over many years." }
    bases: { "la": "the", "tradición": "tradition" }
    examples:
      "La tradición es muy antigua.": { native: "The tradition is very old.", bases: { "La": "the", "tradición": "tradition" } }
      "Es una tradición familiar.": { native: "It is a family tradition.", bases: { "una": "a", "tradición": "tradition", "familiar": "family; familiar" } }
  "es-2582":
    native: "discovery"
    notes: { n1: "El descubrimiento is a discovery, finding something new or unknown." }
    bases: { "el": "the", "descubrimiento": "discovery" }
    examples:
      "El descubrimiento fue en el mar.": { native: "The discovery was at sea.", bases: { "El": "the", "descubrimiento": "discovery", "fue": "was; went", "en": "in" } }
      "Es un gran descubrimiento.": { native: "It is a great discovery.", bases: { "un": "a", "descubrimiento": "discovery" } }
  "es-2583":
    native: "explorer"
    notes: { n1: "El explorador is an explorer, a person who travels to discover new lands. The feminine is la exploradora." }
    bases: { "el": "the", "explorador": "explorer" }
    examples:
      "El explorador viaja al sur.": { native: "The explorer travels to the south.", bases: { "El": "the", "explorador": "explorer", "al": "to the" } }
      "La exploradora descubre una isla.": { native: "The explorer discovers an island.", bases: { "La": "the", "exploradora": "explorer", "descubre": "to discover", "una": "a" } }
  "es-2584":
    native: "to conquer"
    notes: { n1: "Conquistar is to take a land or a people by force, or to win someone's heart." }
    bases: { "conquistar": "to conquer" }
    examples:
      "Conquistan la ciudad.": { native: "They conquer the city.", bases: { "Conquistan": "to conquer", "la": "the" } }
      "Conquistó a todos con su música.": { native: "He won everyone over with his music.", bases: { "Conquistó": "to conquer", "a": "to", "con": "with" } }
  "es-2585":
    native: "to fight"
    notes: { n1: "Luchar is to fight, in a war, a battle or a struggle." }
    bases: { "luchar": "to fight" }
    examples:
      "Luchamos por la libertad.": { native: "We fight for freedom.", bases: { "Luchamos": "to fight", "por": "for", "la": "the", "libertad": "freedom" } }
      "Luchan en la guerra.": { native: "They fight in the war.", bases: { "Luchan": "to fight", "en": "in", "la": "the" } }
  "es-2586":
    native: "to defeat; to win"
    notes: { n1: "Vencer is to win over an enemy or an obstacle. Its yo form is venzo." }
    bases: { "vencer": "to defeat; to win" }
    examples:
      "Vencemos al enemigo.": { native: "We defeat the enemy.", bases: { "Vencemos": "to defeat; to win", "al": "to the", "enemigo": "enemy" } }
      "Venzo el miedo.": { native: "I overcome my fear.", bases: { "Venzo": "to defeat; to win", "el": "the" } }
  "es-2587":
    native: "to defeat"
    notes: { n1: "Derrotar is to beat an enemy or a team in a fight or a game." }
    bases: { "derrotar": "to defeat" }
    examples:
      "Derrotan al ejército.": { native: "They defeat the army.", bases: { "Derrotan": "to defeat", "al": "to the" } }
      "Derroto al equipo rival.": { native: "I defeat the rival/rival team.", bases: { "Derroto": "to defeat", "al": "to the", "rival": "rival" } }
  "es-2588":
    native: "to die"
    notes: { n1: "Morir is to die. Its stem changes: muero, mueres. Its past is murió." }
    bases: { "morir": "to die" }
    examples:
      "El rey muere en el palacio.": { native: "The king dies in the palace.", bases: { "El": "the", "muere": "to die", "en": "in" } }
      "Muchos soldados murieron.": { native: "Many soldiers died.", bases: { "murieron": "to die" } }
  "es-2589":
    native: "to be born"
    notes: { n1: "Nacer is to be born. Its yo form is nazco." }
    bases: { "nacer": "to be born" }
    examples:
      "Nací en Sevilla.": { native: "I was born in Seville.", bases: { "Nací": "to be born", "en": "in" } }
      "El príncipe nace en primavera.": { native: "The prince is born in spring.", bases: { "El": "the", "nace": "to be born", "en": "in" } }
  "es-2590":
    native: "to found"
    notes: { n1: "Fundar is to found a city, a company or a school. Its stem changes: fundo, fundas." }
    bases: { "fundar": "to found" }
    examples:
      "Fundaron la ciudad en el siglo doce.": { native: "They founded the city in the twelfth century.", bases: { "Fundaron": "to found", "la": "the", "en": "in", "el": "the" } }
      "Fundo una empresa nueva.": { native: "I found a new company.", bases: { "Fundo": "to found", "una": "a" } }
  "es-2591":
    native: "to build"
    notes: { n1: "Construir is to build a building, a bridge or a road. Its yo form is construyo." }
    bases: { "construir": "to build" }
    examples:
      "Construyeron el castillo.": { native: "They built the castle.", bases: { "Construyeron": "to build", "el": "the" } }
      "Construyo la casa con piedra.": { native: "I build the house with stone.", bases: { "Construyo": "to build", "la": "the", "con": "with" } }
  "es-2592":
    native: "to inherit"
    notes: { n1: "Heredar is to inherit property, a title or a tradition from a parent." }
    bases: { "heredar": "to inherit" }
    examples:
      "Hereda el trono de su padre.": { native: "He inherits the throne from his father.", bases: { "Hereda": "to inherit", "el": "the", "trono": "throne", "de": "of" } }
      "Heredamos la casa de la abuela.": { native: "We inherit grandmother's house.", bases: { "Heredamos": "to inherit", "la": "the", "de": "of" } }
