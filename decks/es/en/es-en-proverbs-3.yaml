native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs: refranes 3"
description: "Twenty Spanish refranes from an 1815 printing of a traditional collection, none of them in proverbs 1 or 2, each with its plain English meaning and the collection's own explanation or a short explanation. Not yet checked by a Spanish speaker: please report any mistake."
