cards:
  "es-4300":
    native: "Whoever loves truly forgets late."
    notes:
      "literal": "Said that giving up loving shows the love was never true."
    bases:
      "Quien": { meaning: "who" }
      "ama": { meaning: "loves" }
  "es-4301":
    native: "Bread with love is better than a hen with sorrow."
    notes:
      "literal": "Said that poverty is easier to bear when there is love and peace; riches count for little without them."
    bases:
      "vale": { meaning: "is worth" }
      "con": { meaning: "with" }
      "que": { meaning: "than" }
  "es-4302":
    native: "Nothing is stronger than love and death."
    notes:
      "literal": "Said of the power of love and of death, which nothing can resist."
    bases:
      "Para": { meaning: "for" }
      "el": { meaning: "the" }
      "muerte": { meaning: "death" }
      "hay": { meaning: "there is" }
  "es-4303":
    native: "Even if you are very wise and old, do not disdain advice."
    notes:
      "literal": "Said that however experienced one is, taking advice can always help."
    bases:
      "Aunque": { meaning: "although" }
      "sabio": { meaning: "wise" }
      "desdeñes": { meaning: "disdain" }
      "consejo": { meaning: "advice" }
  "es-4304":
    native: "Whoever puts on weight in old age enjoys two youths."
    notes:
      "literal": "Said that an old man who keeps his weight on hides his years and enjoys the health of a young man."
    bases:
      "Quien": { meaning: "who" }
      "mocedades": { meaning: "youths" }
      "goza": { meaning: "enjoys" }
  "es-4305":
    native: "Respected grey hairs find no closed doors."
    notes:
      "literal": "Said of the respect and attention owed to the elderly."
    bases:
      "A": { meaning: "to" }
      "canas": { meaning: "grey hairs" }
      "honradas": { meaning: "honoured" }
      "hay": { meaning: "there are" }
  "es-4306":
    native: "Whoever has a glass roof should not throw stones at a neighbour's."
    notes:
      "literal": "Said of people who criticise others for faults they share."
    bases:
      "Quien": { meaning: "who" }
      "tejado": { meaning: "roof" }
      "de": { meaning: "of" }
      "tire": { meaning: "throw" }
      "al": { meaning: "to the" }
  "es-4307":
    native: "Whoever wants to taste a neighbour's pot should keep theirs without a lid."
    notes:
      "literal": "Said against those who take all the enjoyment they can and do no good to others in return."
    bases:
      "Quien": { meaning: "who" }
      "la": { meaning: "the" }
      "de": { meaning: "of" }
      "suya": { meaning: "theirs" }
      "sin": { meaning: "without" }
      "cobertera": { meaning: "lid" }
  "es-4308":
    native: "Everyone wants to bring the water to their own mill and leave their neighbour's dry."
    notes:
      "literal": "Said of people who look only after their own interests."
    bases:
      "el": { meaning: "the" }
      "a": { meaning: "to" }
      "molino": { meaning: "mill" }
      "en": { meaning: "in" }
      "del": { meaning: "of the" }
  "es-4309":
    native: "On the road to Santiago, the lame walk as far as the healthy."
    notes:
      "literal": "Said of people who travel together to a shrine: they wait for one another and arrive at the same time, though they are not equally strong."
    bases:
      "de": { meaning: "of" }
      "Santiago": { meaning: "Saint James" }
      "tanto": { meaning: "as far" }
      "el": { meaning: "the" }
      "cojo": { meaning: "lame" }
      "como": { meaning: "as" }
  "es-4310":
    native: "Do not set out for Rome with a lame mule or an empty purse."
    notes:
      "literal": "Advises not to take on hard undertakings without the means to match them."
    bases:
      "de": { meaning: "of" }
      "Roma": { meaning: "Rome" }
      "ni": { meaning: "nor" }
      "mula": { meaning: "mule" }
      "coja": { meaning: "lame" }
      "bolsa": { meaning: "purse" }
      "floja": { meaning: "loose" }
  "es-4311":
    native: "We are muleteers, and on the road we will meet again."
    notes:
      "literal": "Said as a threat: a favour refused will be repaid on another occasion, when the refuser needs something."
    bases:
      "Arrieros": { meaning: "muleteers" }
      "en": { meaning: "on" }
      "el": { meaning: "the" }
      "nos": { meaning: "us" }
      "encontraremos": { meaning: "will meet" }
  "es-4312":
    native: "The truth may wear thin, but it does not break."
    notes:
      "literal": "Said to urge always speaking the truth: however one tries to disguise it with cunning or a lie, it stays bright and wins."
    bases:
      "La": { meaning: "the" }
      "adelgaza": { meaning: "wears thin" }
      "quiebra": { meaning: "breaks" }
  "es-4313":
    native: "My female friends dislike me because I tell them the truths."
    notes:
      "literal": "Said of someone who speaks plainly and is disliked for it."
    bases:
      "me": { meaning: "me" }
      "comadres": { meaning: "female friends" }
      "porque": { meaning: "because" }
      "les": { meaning: "them" }
      "las": { meaning: "the" }
  "es-4314":
    native: "Wealth won with effort often ends in the hands of a quick spender."
    notes:
      "literal": "Literally, to a good earner, a good spender; the saying warns that hard-won money often passes to someone who wastes it."
    bases:
      "A": { meaning: "to" }
      "adquiridor": { meaning: "earner" }
      "expendedor": { meaning: "spender" }
  "es-4315":
    native: "Toil, toil, and never get ahead."
    notes:
      "literal": "Said of those who never prosper, however hard they work."
    bases:
      "Afanar": { meaning: "toiling" }
      "medrar": { meaning: "prosper" }
  "es-4316":
    native: "Whoever loves someone ugly finds them beautiful."
    notes:
      "literal": "Said that desire and affection make the one we love look beautiful, whatever they look like."
    bases:
      "Quien": { meaning: "who" }
      "ama": { meaning: "loves" }
      "hermoso": { meaning: "beautiful" }
      "le": { meaning: "to him or her" }
  "es-4317":
    native: "Dress up a tree stump and it will look like a young man."
    notes:
      "literal": "Said of how much dress and adornment help someone look good."
    bases:
      "Afeita": { meaning: "dresses up" }
      "un": { meaning: "a" }
      "cepo": { meaning: "tree stump" }
      "mancebo": { meaning: "young man" }
  "es-4318":
    native: "Every pig has its St Martin's Day: everyone's turn comes."
    notes:
      "literal": "Said that what happens to someone else will come to you in its time, so no one should boast of being spared."
    bases:
      "A": { meaning: "to" }
      "puerco": { meaning: "pig" }
      "le": { meaning: "to it" }
      "San": { meaning: "Saint" }
      "Martín": { meaning: "Martin" }
  "es-4319":
    native: "It is fine for St Peter to stay in Rome."
    notes:
      "literal": "Said against any change proposed to someone who does not see how it suits them: things are fine where they are."
    bases:
      "San": { meaning: "Saint" }
      "Pedro": { meaning: "Peter" }
      "en": { meaning: "in" }
      "Roma": { meaning: "Rome" }
