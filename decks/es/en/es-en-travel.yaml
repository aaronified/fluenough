schema: 1
id: "es-en-travel"
kind: "layer"
core: "es-travel"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Travel: hotels, bookings and trips"
license: "CC-BY-SA-4.0"
description: "Words for a holiday: the hotel desk and the key, the visa and the insurance, the tourist and the sights, the trip out and the monument, the embassy and the theft, and the verbs to confirm, stay and steal. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-2171":
    native: "reception desk"
    notes: { n1: "La recepción is the reception desk of a hotel, where you check in." }
    bases: { "la": "the", "recepción": "reception desk" }
    examples:
      "La recepción abre a las siete.": { native: "The reception desk opens at seven.", bases: { "La": "the", "recepción": "reception desk", "a": "to", "las": "the" } }
      "Dejo la llave en la recepción.": { native: "I leave the key at reception.", bases: { "la": "the", "en": "in", "recepción": "reception desk" } }
  "es-2172":
    native: "tourist"
    notes: { n1: "El turista is a tourist who visits a place for fun. The feminine is la turista." }
    bases: { "el": "the", "turista": "tourist" }
    examples:
      "Hay muchos turistas en el centro.": { native: "There are many tourists in the centre.", bases: { "Hay": "there is; there are", "turistas": "tourist", "en": "in", "el": "the", "centro": "centre" } }
      "El turista pide un mapa.": { native: "The tourist asks for a map.", bases: { "El": "the", "turista": "tourist", "un": "a" } }
  "es-2173":
    native: "tourism"
    notes: { n1: "El turismo is tourism, the business of travel and visits." }
    bases: { "el": "the", "turismo": "tourism" }
    examples:
      "El turismo es importante en esta isla.": { native: "Tourism is important on this island.", bases: { "El": "the", "turismo": "tourism", "en": "in", "esta": "This" } }
      "Trabajo en el turismo.": { native: "I work in tourism.", bases: { "en": "in", "el": "the", "turismo": "tourism" } }
  "es-2174":
    native: "visit"
    notes: { n1: "La visita is a visit, a trip to see a person or a place." }
    bases: { "la": "the", "visita": "visit" }
    examples:
      "Hacemos una visita al museo.": { native: "We make a visit to the museum.", bases: { "una": "a", "al": "to the" } }
      "La visita dura dos horas.": { native: "The visit lasts two hours.", bases: { "La": "the" } }
  "es-2175":
    native: "monument"
    notes: { n1: "El monumento is a monument, a building or statue that is famous." }
    bases: { "el": "the", "monumento": "monument" }
    examples:
      "El monumento está en la plaza.": { native: "The monument is in the square.", bases: { "El": "the", "monumento": "monument", "en": "in", "la": "the" } }
      "Visitamos muchos monumentos.": { native: "We visit many monuments.", bases: { "monumentos": "monument" } }
  "es-2176":
    native: "souvenir; memory"
    notes: { n1: "El recuerdo is a souvenir bought on a trip, or a memory of something past." }
    bases: { "el": "the", "recuerdo": "souvenir; memory" }
    examples:
      "Compro un recuerdo para mi madre.": { native: "I buy a souvenir for my mother.", bases: { "un": "a", "para": "for" } }
      "Tengo un buen recuerdo del viaje.": { native: "I have a good memory of the trip.", bases: { "un": "a", "del": "of" } }
  "es-2177":
    native: "visa"
    notes: { n1: "El visado is a visa, the permit to enter a country for a time." }
    bases: { "el": "the", "visado": "visa" }
    examples:
      "Necesito un visado para entrar.": { native: "I need a visa to enter.", bases: { "un": "a", "visado": "visa", "para": "for" } }
      "El visado es caro.": { native: "The visa is expensive.", bases: { "El": "the", "visado": "visa" } }
  "es-2178":
    native: "day trip; excursion"
    notes: { n1: "La excursión is a trip for a day, to see a place out of the city." }
    bases: { "la": "the", "excursión": "day trip; excursion" }
    examples:
      "Hacemos una excursión a la montaña.": { native: "We go on a trip to the mountains.", bases: { "una": "a", "excursión": "day trip; excursion", "a": "to", "la": "the" } }
      "La excursión sale a las ocho.": { native: "The trip leaves at eight.", bases: { "La": "the", "excursión": "day trip; excursion", "a": "to", "las": "the" } }
  "es-2179":
    native: "accommodation"
    notes: { n1: "El alojamiento is a place to stay, such as a hotel, a hostel or a flat." }
    bases: { "el": "the", "alojamiento": "accommodation" }
    examples:
      "El alojamiento está cerca del centro.": { native: "The accommodation is near the centre.", bases: { "El": "the", "alojamiento": "accommodation", "del": "of", "centro": "centre" } }
      "Busco un alojamiento barato.": { native: "I look for cheap accommodation.", bases: { "un": "a", "alojamiento": "accommodation" } }
  "es-2180":
    native: "agency"
    notes: { n1: "La agencia is an agency, a business that arranges trips or services." }
    bases: { "la": "the", "agencia": "agency" }
    examples:
      "Compro el viaje en una agencia.": { native: "I buy the trip at an agency.", bases: { "el": "the", "en": "in", "una": "a", "agencia": "agency" } }
      "La agencia tiene buenas ofertas.": { native: "The agency has good offers.", bases: { "La": "the", "agencia": "agency" } }
  "es-2181":
    native: "entry; admission ticket"
    notes: { n1: "La entrada is the entry to a place, or the ticket that lets you in." }
    bases: { "la": "the", "entrada": "entry; admission ticket" }
    examples:
      "La entrada al museo es gratis.": { native: "Entry to the museum is free.", bases: { "La": "the", "entrada": "entry; admission ticket", "al": "to the" } }
      "Compro dos entradas para el teatro.": { native: "I buy two tickets for the theatre.", bases: { "entradas": "entry; admission ticket", "para": "for", "el": "the" } }
  "es-2182":
    native: "theft; robbery"
    notes: { n1: "El robo is a theft, when something is taken without permission." }
    bases: { "el": "the", "robo": "theft; robbery" }
    examples:
      "Hubo un robo en el hotel.": { native: "There was a theft at the hotel.", bases: { "Hubo": "there is; there are", "un": "a", "robo": "theft; robbery", "en": "in", "el": "the" } }
      "Denuncio el robo a la policía.": { native: "I report the theft to the police.", bases: { "Denuncio": "to report", "el": "the", "robo": "theft; robbery", "a": "to", "la": "the" } }
  "es-2183":
    native: "thief"
    notes: { n1: "El ladrón is a thief, a person who steals. The feminine is la ladrona." }
    bases: { "el": "the", "ladrón": "thief" }
    examples:
      "El ladrón se llevó la mochila.": { native: "The thief took the bag.", bases: { "El": "the", "ladrón": "thief", "se": "yourself", "la": "the" } }
      "Hay ladrones en la estación.": { native: "There are thieves at the station.", bases: { "Hay": "there is; there are", "ladrones": "thief", "en": "in", "la": "the" } }
  "es-2184":
    native: "embassy"
    notes: { n1: "La embajada is an embassy, the office of a country in another country." }
    bases: { "la": "the", "embajada": "embassy" }
    examples:
      "La embajada está en el centro.": { native: "The embassy is in the centre.", bases: { "La": "the", "embajada": "embassy", "en": "in", "el": "the", "centro": "centre" } }
      "Voy a la embajada con el pasaporte.": { native: "I go to the embassy with my passport.", bases: { "a": "to", "la": "the", "embajada": "embassy", "con": "with", "el": "the" } }
  "es-2185":
    native: "consulate"
    notes: { n1: "El consulado is a consulate, a smaller office of a country in another city." }
    bases: { "el": "the", "consulado": "consulate" }
    examples:
      "El consulado está cerca del hotel.": { native: "The consulate is near the hotel.", bases: { "El": "the", "consulado": "consulate", "del": "of" } }
      "Pido ayuda en el consulado.": { native: "I ask for help at the consulate.", bases: { "en": "in", "el": "the", "consulado": "consulate" } }
  "es-2186":
    native: "cream; sun cream"
    notes: { n1: "La crema is a cream, such as sun cream for the skin." }
    bases: { "la": "the", "crema": "cream; sun cream" }
    examples:
      "Uso crema para el sol.": { native: "I use sun cream.", bases: { "crema": "cream; sun cream", "para": "for", "el": "the" } }
      "La crema es buena para la piel.": { native: "The cream is good for the skin.", bases: { "La": "the", "crema": "cream; sun cream", "para": "for", "la": "the" } }
  "es-2187":
    native: "charge; fee"
    notes: { n1: "El cargo is a charge, a fee to be paid for a service." }
    bases: { "el": "the", "cargo": "charge; fee" }
    examples:
      "No hay cargo por la reserva.": { native: "There is no charge for the booking.", bases: { "hay": "there is; there are", "por": "for", "la": "the" } }
      "El cargo es de diez euros.": { native: "The fee is ten euros./euro", bases: { "El": "the", "de": "of" } }
  "es-2188":
    native: "insurance"
    notes: { n1: "El seguro is insurance, a payment that covers risk. Also a safe, a lock." }
    bases: { "el": "the", "seguro": "insurance" }
    examples:
      "Tengo un seguro de viaje.": { native: "I have travel insurance.", bases: { "un": "a", "seguro": "insurance", "de": "of" } }
      "El seguro cubre el robo.": { native: "The insurance covers theft.", bases: { "El": "the", "seguro": "insurance", "cubre": "to cover", "el": "the" } }
  "es-2189":
    native: "season"
    notes: { n1: "La temporada is a season of the year, or a time of the year for an activity." }
    bases: { "la": "the", "temporada": "season" }
    examples:
      "Viajamos en temporada baja.": { native: "We travel in the low season.", bases: { "en": "in", "temporada": "season" } }
      "La temporada de verano es larga.": { native: "The summer season is long.", bases: { "La": "the", "temporada": "season", "de": "of" } }
  "es-2190":
    native: "guide (person)"
    notes: { n1: "El guía is a guide, a person who shows a place to visitors. The feminine is la guía." }
    bases: { "el": "the", "guía": "guide (person)" }
    examples:
      "El guía habla tres idiomas.": { native: "The guide speaks three languages.", bases: { "El": "the", "guía": "guide (person)" } }
      "Vamos con un guía al museo.": { native: "We go to the museum with a guide.", bases: { "con": "with", "un": "a", "guía": "guide (person)", "al": "to the" } }
  "es-2191":
    native: "to confirm"
    notes: { n1: "Confirmar is to confirm a booking or a plan, to say it is certain." }
    bases: { "confirmar": "to confirm" }
    examples:
      "Confirmo la reserva.": { native: "I confirm the booking.", bases: { "Confirmo": "to confirm", "la": "the" } }
      "Confirman el vuelo por correo.": { native: "They confirm the flight by email.", bases: { "Confirman": "to confirm", "el": "the", "por": "for" } }
  "es-2192":
    native: "to stay (in a hotel)"
    notes: { n1: "Hospedarse is to stay in a hotel or an inn. Its yo form is me hospedo." }
    bases: { "hospedarse": "to stay (in a hotel)" }
    examples:
      "Me hospedo en un hostal.": { native: "I stay in a hostel.", bases: { "Me": "to me", "hospedo": "to stay (in a hotel)", "en": "in", "un": "a" } }
      "Se hospeda en el centro.": { native: "He stays in the centre.", bases: { "Se": "yourself", "hospeda": "to stay (in a hotel)", "en": "in", "el": "the", "centro": "centre" } }
  "es-2193":
    native: "to steal; to rob"
    notes: { n1: "Robar is to steal something from someone." }
    bases: { "robar": "to steal; to rob" }
    examples:
      "Me roban la cartera.": { native: "They steal my wallet.", bases: { "Me": "to me", "roban": "to steal; to rob", "la": "the" } }
      "Roban en el metro.": { native: "People steal on the metro.", bases: { "Roban": "to steal; to rob", "en": "in", "el": "the" } }
  "es-2194":
    native: "tourist (adj)"
    notes: { n1: "Turístico is of tourism or tourists. It agrees with the noun: turística." }
    bases: { "turístico": "tourist (adj)" }
    examples:
      "Es un lugar turístico.": { native: "It is a tourist place.", bases: { "un": "a", "lugar": "place", "turístico": "tourist (adj)" } }
      "La zona turística está llena.": { native: "The tourist area is full.", bases: { "La": "the", "turística": "tourist (adj)" } }
  "es-2195":
    native: "foreign"
    notes: { n1: "Extranjero is foreign, from another country. It agrees with the noun: extranjera." }
    bases: { "extranjero": "foreign" }
    examples:
      "Es un turista extranjero.": { native: "He is a foreign tourist.", bases: { "un": "a", "extranjero": "foreign" } }
      "Hay muchos extranjeros en la playa.": { native: "There are many foreigners on the beach.", bases: { "Hay": "there is; there are", "extranjeros": "foreign", "en": "in", "la": "the" } }
