        native: "Ana is sixteen years old."
        bases:
          "Ana": "Ana"
          "dieciséis": "sixteen"
          "años": "years"
      "Dieciséis más cuatro son veinte.":
        native: "Sixteen plus four is twenty."
        bases:
          "Dieciséis": "sixteen"
          "más": "plus"
