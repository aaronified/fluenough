id: "es-en-numbers-1-20"
kind: "layer"
core: "es-numbers-1-20"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Numbers 0 to 20"
license: "CC-BY-SA-4.0"
description: "The numbers from zero to twenty, how each is said and written, with the numbers one to ten as a set. Not yet checked by a Spanish speaker: please report any mistake."

cards:
  "es-0204":
    native: "zero"
    notes:
      "n1": "Cero is zero. It is written as a single word, and it is a number of its own."
    examples:
      "El resultado es cero.":
        native: "The result is zero."
        bases:
          "El": "the"
          "resultado": "result"
          "cero": "zero"
      "Cero es un número.":
        native: "Zero is a number."
        bases:
          "Cero": "zero"
          "un": "a"
          "número": "number"
  "es-0205":
    native: "one"
    notes:
      "n1": "Uno becomes un before a masculine noun (un libro) and una before a feminine one (una casa)."
    examples:
      "Uno más uno son dos.":
        native: "One plus one is two."
        bases:
          "Uno": "one"
          "más": "plus"
      "Tengo solo uno.":
        native: "I have only one."
        bases:
          "solo": "only"
          "uno": "one"
  "es-0206":
    native: "two"
    notes:
      "n1": "Dos is two. It does not change for gender."
    examples:
      "Dos y dos son cuatro.":
        native: "Two and two are four."
        bases:
          "Dos": "two"
      "Tengo dos hermanos.":
        native: "I have two brothers."
        bases:
          "dos": "two"
          "hermanos": "brothers"
  "es-0207":
    native: "three"
    notes:
      "n1": "Tres is three. It does not change for gender."
    examples:
      "Mi hijo tiene tres años.":
        native: "My son is three years old."
        bases:
          "hijo": "son"
          "tres": "three"
          "años": "years"
      "Tres es un número impar.":
        native: "Three is an odd number."
        bases:
          "Tres": "three"
          "un": "a"
          "número": "number"
          "impar": "odd"
  "es-0208":
    native: "four"
    notes:
      "n1": "Cuatro is four. It does not change for gender."
    examples:
      "Dos y dos son cuatro.":
        native: "Two and two are four."
        bases:
          "cuatro": "four"
      "Hay cuatro sillas en la cocina.":
        native: "There are four chairs in the kitchen."
        bases:
          "Hay": "there is"
          "cuatro": "four"
          "sillas": "chairs"
          "en": "in"
          "la": "the"
  "es-0209":
    native: "five"
    notes:
      "n1": "Cinco is five. It is written with a c, and said like th in thin in Spain."
    examples:
      "Son cinco minutos.":
        native: "It is five minutes."
        bases:
          "cinco": "five"
          "minutos": "minutes"
      "Mi sobrina tiene cinco años.":
        native: "My niece is five years old."
        bases:
          "sobrina": "niece"
          "cinco": "five"
          "años": "years"
  "es-0210":
    native: "six"
    notes:
      "n1": "Seis is six. Its sound is close to the English 's'."
    examples:
      "Hay seis personas en la mesa.":
        native: "There are six people at the table."
        bases:
          "Hay": "there is"
          "seis": "six"
          "personas": "people"
          "en": "in"
          "la": "the"
          "mesa": "table"
      "Seis más cuatro son diez.":
        native: "Six plus four is ten."
        bases:
          "Seis": "six"
          "más": "plus"
  "es-0211":
