schema: 1
id: "es-en-grammar-imperatives"
kind: "layer"
core: "es-grammar-imperatives"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Spanish commands"
license: "CC-BY-SA-4.0"
description: "A command to a friend (tú) has the same form as the él/ella present: habla, come, vive. To tell someone not to do it, use no and the tú form with the opposite vowel: no hables, no comas. Usted commands take the subjunctive form: hable, coma. Not yet checked by a Spanish speaker: please report any mistake."
pattern:
  name: "Commands: tú, not tú, and usted"
  slot_name: "command"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "hablar": "to speak"
    "mirar": "to look"
    "escuchar": "to listen"
    "comer": "to eat"
    "beber": "to drink"
    "leer": "to read"
    "vivir": "to live"
    "escribir": "to write"
    "abrir": "to open"
