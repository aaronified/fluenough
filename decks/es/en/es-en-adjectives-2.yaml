schema: 1
id: "es-en-adjectives-2"
kind: "layer"
core: "es-adjectives-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing a room"
license: "CC-BY-SA-4.0"
description: "Adjectives for a home and its rooms: big or narrow, bright or dark, new or old, quiet or noisy, and the materials things are made of, from wood to linen. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-1798":
    native: "spacious; wide"
    notes: { n1: "Amplio is spacious or wide. It agrees with the noun: amplia." }
    bases: { "amplio": "spacious; wide" }
    examples:
      "El salón es muy amplio.": { native: "The living room is very spacious.", bases: { "El": "the", "amplio": "spacious; wide" } }
      "Tiene una cocina amplia.": { native: "It has a spacious kitchen.", bases: { "una": "a", "amplia": "spacious; wide" } }
  "es-1799":
    native: "bright; full of light"
    notes: { n1: "Luminoso is bright, with a lot of light. It agrees with the noun: luminosa." }
    bases: { "luminoso": "bright; full of light" }
    examples:
      "La habitación es luminosa.": { native: "The room is bright.", bases: { "La": "the", "luminosa": "bright; full of light" } }
      "Hay muchas ventanas luminosas.": { native: "There are many bright windows.", bases: { "Hay": "there is; there are", "luminosas": "bright; full of light" } }
  "es-1800":
    native: "narrow"
    notes: { n1: "Estrecho is narrow, not wide. It agrees with the noun: estrecha." }
    bases: { "estrecho": "narrow" }
    examples:
      "El pasillo es muy estrecho.": { native: "The corridor is very narrow.", bases: { "El": "the", "estrecho": "narrow" } }
      "La escalera es estrecha.": { native: "The staircase is narrow.", bases: { "La": "the", "estrecha": "narrow" } }
  "es-1801":
    native: "noisy"
    notes: { n1: "Ruidoso is noisy. The opposite is silencioso." }
    bases: { "ruidoso": "noisy" }
    examples:
      "La calle es ruidosa.": { native: "The street is noisy.", bases: { "La": "the", "ruidosa": "noisy" } }
      "El vecino es muy ruidoso.": { native: "The neighbour is very noisy.", bases: { "El": "the", "vecino": "neighbour", "ruidoso": "noisy" } }
  "es-1802":
    native: "uncomfortable"
    notes: { n1: "Incómodo is uncomfortable, not cómodo. It agrees with the noun: incómoda." }
    bases: { "incómodo": "uncomfortable" }
    examples:
      "El sofá es incómodo.": { native: "The sofa is uncomfortable.", bases: { "El": "the", "incómodo": "uncomfortable" } }
      "La silla es incómoda.": { native: "The chair is uncomfortable.", bases: { "La": "the", "incómoda": "uncomfortable" } }
  "es-1803":
    native: "modern"
    notes: { n1: "Moderno is modern. The opposite is antiguo." }
    bases: { "moderno": "modern" }
    examples:
      "El piso es moderno.": { native: "The flat is modern.", bases: { "El": "the", "moderno": "modern" } }
      "Los muebles son modernos.": { native: "The furniture is modern.", bases: { "Los": "the", "modernos": "modern" } }
  "es-1804":
    native: "old; ancient"
    notes: { n1: "Antiguo is old, from long ago. It agrees with the noun: antigua." }
    bases: { "antiguo": "old; ancient" }
    examples:
      "La casa es antigua.": { native: "The house is old.", bases: { "La": "the", "antigua": "old; ancient" } }
      "El armario es antiguo.": { native: "The wardrobe is old.", bases: { "El": "the", "antiguo": "old; ancient" } }
  "es-1805":
    native: "tidy"
    notes: { n1: "Ordenado is tidy, in order. It agrees with the noun: ordenada." }
    bases: { "ordenado": "tidy" }
    examples:
      "Mi cuarto está ordenado.": { native: "My room is tidy.", bases: { "ordenado": "tidy" } }
      "La cocina está ordenada.": { native: "The kitchen is tidy.", bases: { "La": "the", "ordenada": "tidy" } }
  "es-1806":
    native: "quiet; silent"
    notes: { n1: "Silencioso is quiet, without noise. It agrees with the noun: silenciosa." }
    bases: { "silencioso": "quiet; silent" }
    examples:
      "El barrio es silencioso.": { native: "The neighbourhood is quiet.", bases: { "El": "the", "silencioso": "quiet; silent" } }
      "Es un lugar silencioso.": { native: "It is a quiet place.", bases: { "un": "a", "lugar": "place", "silencioso": "quiet; silent" } }
  "es-1807":
    native: "warm"
    notes: { n1: "Cálido is warm, a soft heat. It agrees with the noun: cálida." }
    bases: { "cálido": "warm" }
    examples:
      "El clima es cálido.": { native: "The climate is warm.", bases: { "El": "the", "cálido": "warm" } }
      "El salón tiene un color cálido.": { native: "The living room has a warm colour.", bases: { "El": "the", "un": "a", "cálido": "warm" } }
  "es-1808":
    native: "furnished"
    notes: { n1: "Amueblado is furnished, with furniture inside. It agrees with the noun: amueblada." }
    bases: { "amueblado": "furnished" }
    examples:
      "El piso está amueblado.": { native: "The flat is furnished.", bases: { "El": "the", "amueblado": "furnished" } }
      "Alquilo un piso amueblado.": { native: "I rent a furnished flat.", bases: { "un": "a", "amueblado": "furnished" } }
  "es-1809":
    native: "piece of furniture"
    notes: { n1: "El mueble is a piece of furniture, such as a table or a bed." }
    bases: { "el": "the", "mueble": "piece of furniture" }
    examples:
      "El mueble es de madera.": { native: "The piece of furniture is made of wood.", bases: { "El": "the", "mueble": "piece of furniture", "de": "of" } }
      "Hay pocos muebles en la sala.": { native: "There is little furniture in the room.", bases: { "Hay": "there is; there are", "muebles": "piece of furniture", "en": "in", "la": "the", "sala": "living room" } }
  "es-1810":
    native: "shelf; bookcase"
    notes: { n1: "La estantería is a set of shelves, for books or things." }
    bases: { "la": "the", "estantería": "shelf; bookcase" }
    examples:
      "La estantería está llena de libros.": { native: "The bookcase is full of books.", bases: { "La": "the", "estantería": "shelf; bookcase", "de": "of" } }
      "Pongo los libros en la estantería.": { native: "I put the books on the shelf.", bases: { "los": "the", "en": "in", "la": "the", "estantería": "shelf; bookcase" } }
  "es-1811":
    native: "balcony"
    notes: { n1: "El balcón is a balcony, outside a window, with room for a chair." }
    bases: { "el": "the", "balcón": "balcony" }
    examples:
      "Salimos al balcón.": { native: "We go out onto the balcony.", bases: { "al": "to the", "balcón": "balcony" } }
      "El balcón tiene flores.": { native: "The balcony has flowers.", bases: { "El": "the", "balcón": "balcony" } }
  "es-1812":
    native: "staircase; ladder"
    notes: { n1: "La escalera is a staircase, the steps inside a house, or a ladder." }
    bases: { "la": "the", "escalera": "staircase; ladder" }
    examples:
      "La escalera es muy estrecha.": { native: "The staircase is very narrow.", bases: { "La": "the", "escalera": "staircase; ladder" } }
      "Subo la escalera.": { native: "I go up the stairs.", bases: { "la": "the", "escalera": "staircase; ladder" } }
  "es-1813":
    native: "basement"
    notes: { n1: "El sótano is the basement, below the ground floor of a house." }
    bases: { "el": "the", "sótano": "basement" }
    examples:
      "El sótano es oscuro.": { native: "The basement is dark.", bases: { "El": "the", "sótano": "basement" } }
      "Guardo las cajas en el sótano.": { native: "I keep the boxes in the basement.", bases: { "las": "the", "en": "in", "el": "the", "sótano": "basement" } }
  "es-1814":
    native: "attic; top-floor flat"
    notes: { n1: "El ático is the attic, the top floor of a building." }
    bases: { "el": "the", "ático": "attic; top-floor flat" }
    examples:
      "Vivimos en el ático.": { native: "We live in the top-floor flat.", bases: { "en": "in", "el": "the", "ático": "attic; top-floor flat" } }
      "El ático tiene vistas.": { native: "The top-floor flat has views.", bases: { "El": "the", "ático": "attic; top-floor flat", "vistas": "view" } }
  "es-1815":
    native: "garage"
    notes: { n1: "El garaje is a garage, a room for a car." }
    bases: { "el": "the", "garaje": "garage" }
    examples:
      "El coche está en el garaje.": { native: "The car is in the garage.", bases: { "El": "the", "en": "in", "el": "the", "garaje": "garage" } }
      "El garaje es grande.": { native: "The garage is big.", bases: { "El": "the", "garaje": "garage" } }
  "es-1816":
    native: "tap"
    notes: { n1: "El grifo is the tap that gives water." }
    bases: { "el": "the", "grifo": "tap" }
    examples:
      "Abro el grifo.": { native: "I turn on the tap.", bases: { "el": "the", "grifo": "tap" } }
      "El grifo del baño gotea.": { native: "The bathroom tap drips.", bases: { "El": "the", "grifo": "tap", "del": "of", "gotea": "to drip" } }
  "es-1817":
    native: "bath"
    notes: { n1: "La bañera is a bath, a long tub to lie in." }
    bases: { "la": "the", "bañera": "bath" }
    examples:
      "La bañera es blanca.": { native: "The bath is white.", bases: { "La": "the", "bañera": "bath" } }
      "Me baño en la bañera.": { native: "I bathe in the bath.", bases: { "Me": "to me", "en": "in", "la": "the", "bañera": "bath" } }
  "es-1818":
    native: "washbasin"
    notes: { n1: "El lavabo is the washbasin, where you wash your hands." }
    bases: { "el": "the", "lavabo": "washbasin" }
    examples:
      "El lavabo está en el baño.": { native: "The washbasin is in the bathroom.", bases: { "El": "the", "lavabo": "washbasin", "en": "in", "el": "the" } }
      "El lavabo está limpio.": { native: "The washbasin is clean.", bases: { "El": "the", "lavabo": "washbasin" } }
  "es-1819":
    native: "toilet"
    notes: { n1: "El inodoro is the toilet, the bowl in a bathroom." }
    bases: { "el": "the", "inodoro": "toilet" }
    examples:
      "El inodoro está limpio.": { native: "The toilet is clean.", bases: { "El": "the", "inodoro": "toilet" } }
      "El inodoro no funciona.": { native: "The toilet does not work.", bases: { "El": "the", "inodoro": "toilet", "funciona": "to work" } }
  "es-1820":
    native: "plug; socket"
    notes: { n1: "El enchufe is a plug or a socket, for electricity." }
    bases: { "el": "the", "enchufe": "plug; socket" }
    examples:
      "El enchufe está detrás de la mesa.": { native: "The socket is behind the table.", bases: { "El": "the", "enchufe": "plug; socket", "detrás": "behind", "de": "of", "la": "the" } }
      "Conecto el cargador al enchufe.": { native: "I plug the charger into the socket.", bases: { "Conecto": "to connect", "el": "the", "al": "to the", "enchufe": "plug; socket" } }
  "es-1821":
    native: "tile"
    notes: { n1: "El azulejo is a tile, on a wall or floor, often in a kitchen or bathroom." }
    bases: { "el": "the", "azulejo": "tile" }
    examples:
      "Los azulejos son azules.": { native: "The tiles are blue.", bases: { "Los": "the", "azulejos": "tile" } }
      "El azulejo está roto.": { native: "The tile is broken.", bases: { "El": "the", "azulejo": "tile" } }
  "es-1822":
    native: "wood"
    notes: { n1: "La madera is wood, the material of trees, used for furniture." }
    bases: { "la": "the", "madera": "wood" }
    examples:
      "La mesa es de madera.": { native: "The table is made of wood.", bases: { "La": "the", "de": "of", "madera": "wood" } }
      "La madera es fuerte.": { native: "Wood is strong.", bases: { "La": "the", "madera": "wood" } }
  "es-1823":
    native: "metal"
    notes: { n1: "El metal is metal, a hard material such as iron or steel." }
    bases: { "el": "the", "metal": "metal" }
    examples:
      "La silla es de metal.": { native: "The chair is made of metal.", bases: { "La": "the", "de": "of", "metal": "metal" } }
      "El metal es frío.": { native: "Metal is cold.", bases: { "El": "the", "metal": "metal" } }
  "es-1824":
    native: "glass (material)"
