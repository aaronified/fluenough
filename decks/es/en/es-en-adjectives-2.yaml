    examples:
      "El mantel es de lino.": { native: "The tablecloth is made of linen.", bases: { "El": "the", "de": "of", "lino": "linen" } }
      "Las sábanas de lino son frescas.": { native: "Linen sheets are cool.", bases: { "Las": "the", "sábanas": "sheet", "de": "of", "lino": "linen" } }
