    bases: { "el": "the", "vidrio": "glass (material)" }
    examples:
      "La ventana es de vidrio.": { native: "The window is made of glass.", bases: { "La": "the", "de": "of", "vidrio": "glass (material)" } }
      "El vidrio es transparente.": { native: "Glass is transparent.", bases: { "El": "the", "vidrio": "glass (material)", "transparente": "transparent" } }
  "es-1825":
    native: "glass; crystal"
    notes: { n1: "El cristal is glass, or crystal, a clear and bright material." }
    bases: { "el": "the", "cristal": "glass; crystal" }
    examples:
