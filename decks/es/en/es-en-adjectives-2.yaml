    notes: { n1: "El cuero is leather, the skin of an animal, made into shoes or furniture." }
    bases: { "el": "the", "cuero": "leather" }
    examples:
      "El sofá es de cuero.": { native: "The sofa is made of leather.", bases: { "El": "the", "de": "of", "cuero": "leather" } }
      "Los zapatos son de cuero.": { native: "The shoes are made of leather.", bases: { "Los": "the", "de": "of", "cuero": "leather" } }
