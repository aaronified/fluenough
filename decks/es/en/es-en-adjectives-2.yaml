    bases: { "la": "the", "lana": "wool" }
    examples:
      "La manta es de lana.": { native: "The blanket is made of wool.", bases: { "La": "the", "manta": "blanket", "de": "of", "lana": "wool" } }
      "Mi abrigo es de lana.": { native: "My coat is made of wool.", bases: { "de": "of", "lana": "wool" } }
