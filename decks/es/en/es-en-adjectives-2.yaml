    examples:
      "El vestido es de seda.": { native: "The dress is made of silk.", bases: { "El": "the", "de": "of", "seda": "silk" } }
      "La seda es muy suave.": { native: "Silk is very soft.", bases: { "La": "the", "seda": "silk", "suave": "soft" } }
  "es-1831":
