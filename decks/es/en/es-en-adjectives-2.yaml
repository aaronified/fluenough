    bases: { "el": "the", "plástico": "plastic" }
    examples:
      "La caja es de plástico.": { native: "The box is made of plastic.", bases: { "La": "the", "de": "of", "plástico": "plastic" } }
      "El plástico no es bueno para la naturaleza.": { native: "Plastic is not good for nature.", bases: { "El": "the", "plástico": "plastic", "para": "for", "la": "the" } }
  "es-1827":
