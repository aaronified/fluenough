    notes: { n1: "El algodón is cotton, a soft plant fibre for clothes." }
    bases: { "el": "the", "algodón": "cotton" }
    examples:
      "Las cortinas son de algodón.": { native: "The curtains are made of cotton.", bases: { "Las": "the", "de": "of", "algodón": "cotton" } }
      "La camisa es de algodón.": { native: "The shirt is made of cotton.", bases: { "La": "the", "de": "of", "algodón": "cotton" } }
  "es-1829":
