      "Reformamos la cocina.": { native: "We renovate the kitchen.", bases: { "Reformamos": "to renovate", "la": "the" } }
      "Reforman el piso el año que viene.": { native: "They renovate the flat next year.", bases: { "Reforman": "to renovate", "el": "the", "que": "that" } }
