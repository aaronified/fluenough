schema: 1
id: "es-en-quantities"
kind: "layer"
core: "es-quantities"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Quantities: how much, how many, weights and containers"
license: "CC-BY-SA-4.0"
description: "Amounts, weights and containers, and the words for a little, a lot and each. Not yet checked by a Spanish speaker: please report any mistake."

cards:
  "es-0358":
    native: "little; few"
    notes:
      "n1": "Poco means little or few. Un poco de means a little of something."
    examples:
      "Tengo poco tiempo hoy.":
        native: "I have little time today."
        bases:
          "poco": "little"
          "tiempo": "time"
      "Hay poco pan en la mesa.":
        native: "There is little bread on the table."
        bases:
          "Hay": "there is; there are"
          "poco": "little"
          "en": "in"
          "la": "the"
  "es-0359":
    native: "something"
    notes:
      "n1": "Algo is something. Its opposite is nada (nothing)."
    examples:
      "¿Quieres algo de beber?":
        native: "Do you want something to drink?"
        bases:
          "algo": "something"
          "de": "of"
      "Tengo algo para ti.":
        native: "I have something for you."
        bases:
          "algo": "something"
          "para": "for"
          "ti": "you"
  "es-0360":
    native: "nothing"
    notes:
      "n1": "Nada is nothing. With no before the verb, nada goes after it: no tengo nada (I have nothing)."
    examples:
      "No tengo nada.":
        native: "I have nothing."
        bases:
          "nada": "nothing"
      "Ana no come nada.":
        native: "Ana eats nothing."
        bases:
          "Ana": "Ana"
          "nada": "nothing"
  "es-0361":
    native: "quite; enough"
    notes:
      "n1": "Bastante is quite before an adjective, and enough before a noun."
    examples:
      "La comida es bastante buena.":
        native: "The food is quite good."
        bases:
          "La": "the"
          "bastante": "quite"
      "Hay bastante agua para todos.":
        native: "There is enough water for everyone."
        bases:
          "Hay": "there is; there are"
          "bastante": "quite"
          "para": "for"
  "es-0362":
    native: "too much; too"
    notes:
      "n1": "Demasiado is too much or too many. It is the opposite of poco."
    examples:
      "Hablas demasiado rápido.":
        native: "You speak too fast."
        bases:
          "demasiado": "too much"
      "Comemos demasiado pan.":
        native: "We eat too much bread."
        bases:
          "demasiado": "too much"
  "es-0363":
    native: "more"
    notes:
      "n1": "Más is more. It also means plus in sums, and the most with el or la."
    examples:
      "Quiero más agua.":
        native: "I want more water."
        bases:
          "más": "more"
      "Ana come más que yo.":
        native: "Ana eats more than I do."
        bases:
          "Ana": "Ana"
          "más": "more"
          "que": "that"
  "es-0364":
    native: "less; fewer"
    notes:
      "n1": "Menos is less or fewer, the opposite of más."
    examples:
      "Trabajo menos los sábados.":
        native: "I work less on Saturdays."
        bases:
          "menos": "less"
          "los": "the"
          "sábados": "Saturdays"
      "Bebo menos café que antes.":
        native: "I drink less coffee than before."
        bases:
          "menos": "less"
          "que": "that"
  "es-0365":
    native: "enough; sufficient"
    notes:
      "n1": "Suficiente is enough. Its plural is suficientes."
    examples:
      "Tengo suficiente dinero para el viaje.":
        native: "I have enough money for the trip."
        bases:
          "suficiente": "enough"
          "dinero": "money"
          "para": "for"
          "el": "the"
          "viaje": "trip"
      "¿Es suficiente para cuatro?":
        native: "Is it enough for four?"
        bases:
          "suficiente": "enough"
          "para": "for"
  "es-0366":
    native: "each; every"
    notes:
      "n1": "Cada is each or every, and it takes a singular noun: cada día."
    examples:
      "Como pan cada día.":
        native: "I eat bread every day."
        bases:
          "cada": "each"
      "Cada persona tiene un nombre.":
        native: "Each person has a name."
        bases:
          "Cada": "each"
          "un": "a"
  "es-0367":
    native: "several"
    notes:
      "n1": "Varios is several, and it is always plural: varios libros, varias casas."
    examples:
      "Compré varios libros.":
        native: "I bought several books."
        bases:
          "varios": "several"
          "libros": "books"
      "Hay varias personas en la calle.":
        native: "There are several people in the street."
        bases:
          "Hay": "there is; there are"
          "varias": "several"
          "en": "in"
          "la": "the"
  "es-0368":
    native: "half"
    notes:
      "n1": "Medio means half and agrees with its noun: medio kilo, media manzana."
    examples:
      "Quiero medio kilo de queso.":
        native: "I want half a kilo of cheese."
        bases:
          "medio": "half"
          "de": "of"
      "Comí media manzana.":
        native: "I ate half an apple."
        bases:
          "media": "half"
  "es-0369":
    native: "half (a noun)"
    notes:
      "n1": "La mitad is the half, a noun: la mitad de la pizza."
    bases:
      "la": "the"
      "mitad": "half"
    examples:
      "Comí la mitad del pan.":
        native: "I ate half of the bread."
        bases:
          "la": "the"
          "mitad": "half"
          "del": "of the"
      "Ana bebe la mitad del agua.":
        native: "Ana drinks half of the water."
        bases:
          "Ana": "Ana"
          "la": "the"
          "mitad": "half"
          "del": "of the"
  "es-0370":
    native: "double"
    notes:
      "n1": "Doble means double, two times as much: el doble de."
    examples:
      "Un café cuesta el doble.":
        native: "A coffee costs double."
        bases:
          "Un": "a"
          "el": "the"
          "doble": "double"
      "Ahora gano el doble que antes.":
        native: "Now I earn double what I earned before."
        bases:
          "gano": "earn"
          "el": "the"
          "doble": "double"
          "que": "that"
  "es-0371":
    native: "whole; entire"
    notes:
      "n1": "Entero means whole: una manzana entera is a whole apple."
    examples:
      "Comí una manzana entera.":
        native: "I ate a whole apple."
        bases:
          "una": "a"
          "entera": "whole"
      "Ana leyó el libro entero.":
        native: "Ana read the whole book."
        bases:
          "Ana": "Ana"
          "el": "the"
          "entero": "whole"
  "es-0372":
    native: "amount; quantity"
    notes:
      "n1": "La cantidad is the amount or quantity of something."
    bases:
      "la": "the"
      "cantidad": "amount"
    examples:
      "Hay una cantidad grande de arroz.":
        native: "There is a large amount of rice."
        bases:
          "Hay": "there is; there are"
          "una": "a"
          "cantidad": "amount"
          "de": "of"
      "La cantidad de sal es pequeña.":
        native: "The amount of salt is small."
        bases:
          "La": "the"
          "cantidad": "amount"
          "de": "of"
  "es-0373":
    native: "pair; couple"
    notes:
      "n1": "El par is a pair. Un par de means a couple of, two of something."
    bases:
      "el": "the"
      "par": "pair"
    examples:
      "Necesito un par de huevos.":
        native: "I need a couple of eggs."
        bases:
          "un": "a"
          "par": "pair"
          "de": "of"
          "huevos": "eggs"
      "Ana compró un par de zapatos.":
        native: "Ana bought a pair of shoes."
        bases:
          "Ana": "Ana"
          "un": "a"
          "par": "pair"
          "de": "of"
          "zapatos": "shoes"
  "es-0374":
    native: "dozen"
    notes:
      "n1": "La docena is a dozen: una docena de huevos."
    bases:
      "la": "the"
      "docena": "dozen"
    examples:
      "Compré una docena de huevos.":
        native: "I bought a dozen eggs."
        bases:
          "una": "a"
          "docena": "dozen"
          "de": "of"
          "huevos": "eggs"
      "Hay una docena de rosas en el jarrón.":
        native: "There is a dozen roses in the vase."
        bases:
          "Hay": "there is; there are"
          "una": "a"
          "docena": "dozen"
          "de": "of"
          "rosas": "roses"
          "en": "in"
          "el": "the"
          "jarrón": "vase"
  "es-0375":
    native: "kilo; kilogram"
    notes:
      "n1": "El kilo is the kilo: un kilo de manzanas is a kilo of apples."
    bases:
      "el": "the"
      "kilo": "kilo"
    examples:
      "Quiero un kilo de manzanas.":
        native: "I want a kilo of apples."
        bases:
          "un": "a"
          "kilo": "kilo"
          "de": "of"
          "manzanas": "apples"
      "El kilo de pan cuesta dos euros.":
        native: "A kilo of bread costs two euros."
        bases:
          "El": "the"
          "kilo": "kilo"
          "de": "of"
          "euros": "euros"
  "es-0376":
    native: "gram"
    notes:
      "n1": "El gramo is the gram. A thousand gramos make a kilo."
    bases:
      "el": "the"
      "gramo": "gram"
    examples:
      "Necesito cien gramos de queso.":
