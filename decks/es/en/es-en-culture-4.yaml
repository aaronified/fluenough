name: "Culture: ballads, lullabies and medieval texts"
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
description: "Eighteen short items from Spanish medieval and early literature, in the public domain: lines of anonymous works from the twelfth to the sixteenth century (a Toledan play, a dream poem, and ballads printed in 1511, 1550 and the 1500s), six lullabies from one 1882 collection (Rodríguez Marín, Cantos populares españoles), and two of Gonzalo de Berceo's miracle stories, printed in 1780. Each shows who wrote it, when, and where it comes from. Not yet checked by a Spanish speaker: please report any mistake."

cards:
  "es-4150":
    native: "That I do not know when it is day, nor even when it is night."
    notes:
      "n1": "Lines of a prisoner from the Romance del prisionero. He cannot see daylight or dark, so he cannot tell day from night."
    bases:
      "que": "that"
      "ni": "nor"
      "sé": "I know"
      "cuándo": "when"
      "es": "it is"
      "de": "of, in"
      "día": "day"
      "menos": "less, here: not even"
      "noche": "night"
  "es-4151":
    native: "Except for a little bird that sang to me at dawn; a crossbowman killed it for me."
    notes:
      "n1": "The prisoner's only comfort was a little bird that sang at dawn. A crossbowman killed it, and the prisoner curses him. The verse is in the 1511 printing of the Romance del prisionero."
    bases:
      "sino": "except, but"
      "por": "for"
      "una": "a"
      "avecilla": "little bird"
      "que": "that"
      "me": "to me"
      "cantaba": "was singing, used to sing"
      "al": "at the"
      "albor": "dawn"
      "matómela": "killed it for me"
      "un": "a"
      "ballestero": "crossbowman"
  "es-4152":
    native: "He was a poor man who lived on daily rations."
    notes:
      "n1": "The first stanza of the story of the poor almsgiver in Berceo's Milagros de Nuestra Señora. The 1780 print has older spelling (omne, vivie, raçiones); the card shows it in modern spelling."
    bases:
      "Era": "was"
      "un": "a"
      "hombre": "man"
      "pobre": "poor"
      "que": "who"
      "vivía": "lived"
      "de": "on"
      "raciones": "daily rations, food allowance"
  "es-4153":
    native: "He loved her son, and he loved her too."
    notes:
      "n1": "From the story of the cleric who loves the Virgin Mary and her son (Jesus) in Berceo's Milagros de Nuestra Señora. The 1780 print has older spelling (al so fijo, a ella); the card shows it in modern spelling."
    bases:
      "Amaba": "loved"
      "a": "(marks the one loved)"
      "su": "her"
      "hijo": "son"
      "y": "and"
      "ella": "her"
  "es-4154":
    native: "Going out to look for game, to feed his falcon for the hunt,"
    notes:
      "n1": "The count is out hunting when a voice from the sea calls him in the romance. Cebar means to feed a hunting bird so that it is keen to hunt."
    bases:
      "Andando": "going, walking"
      "a": "to"
      "buscar": "look for"
      "la": "the"
      "caza": "game, hunt"
      "para": "for"
      "su": "his"
      "falcón": "falcon"
      "cebar": "feed (a hunting bird)"
  "es-4155":
    native: "It is not true, I do not know what I am saying; all this is not worth a fig."
    notes:
      "n1": "Caspar, one of the three kings, doubts what he has seen in the sky. Figo is a fig, and no vale un figo is an idiom meaning worth nothing."
    bases:
      "Non": "not (old form of no)"
      "es": "is"
      "verdad": "truth"
      "no": "not"
      "sé": "know"
      "qué": "what"
      "digo": "say"
      "todo": "all"
      "esto": "this"
      "vale": "is worth"
      "un": "a"
      "figo": "fig"
  "es-4156":
    native: "I saw a great vision in my bed, while sleeping:"
    notes:
      "n1": "The Disputa is a dream vision: the poet sees a dead body on a new sheet, and its soul leaving it. Ui is the old form of vi, I saw."
    bases:
      "ui": "saw (old form of vi)"
      "una": "a"
      "grant": "great (old form)"
      "uision": "vision"
      "en": "in"
      "mio": "my (old form)"
      "leio": "bed"
      "dormient": "sleeping"
  "es-4157":
    native: "I was a Moorish woman, Moraima, a dark girl with a fair look."
    notes:
      "n1": "The speaker is a Moorish woman who was deceived by a Christian man. Morilla is a diminutive of mora, a dark Moorish girl."
    bases:
      "Yo": "I"
      "me": "me"
      "era": "was"
      "mora": "Moorish"
      "Moraima": "Moraima, the name of the speaker"
      "morilla": "a dark girl (diminutive of mora)"
      "de": "with"
      "un": "a"
      "bel": "fair (old form of bello)"
      "catar": "look, appearance"
  "es-4158":
    native: "How treacherous you are, Marquillos!"
    notes:
      "n1": "Marquillos has slept with his lord's wife and then killed the lord. Cuán is an old exclamation, like cómo, how."
    bases:
      "Cuán": "how"
      "traidor": "treacherous"
      "eres": "are"
      "Marquillos": "Marquillos, a name"
  "es-4159":
    native: "Gerineldo got up, leaving the king asleep,"
    notes:
      "n1": "Levantóse is the reflexive past of levantarse, to get up. The -se shows that the action is done by the subject to himself."
    bases:
      "Levantóse": "got up"
      "Gerineldo": "Gerineldo, a name"
      "que": "who"
      "al": "to the"
      "rey": "king"
      "dejara": "left"
      "dormido": "asleep"
  "es-4160":
    native: "The knight goes out hunting, hunting as he used to,"
    notes:
      "n1": "Va a cazar is ir a plus an infinitive: it means goes to hunt. Solía is the past of soler, to be in the habit of."
    bases:
      "A": "to"
      "cazar": "hunt"
      "va": "goes"
      "el": "the"
      "caballero": "knight"
      "como": "as"
      "solía": "used to"
  "es-4161":
    native: "Cold fountain, cold fountain, cold fountain, and with love, where all the little birds go to find comfort,"
    notes:
      "n1": "The turtledove that is a widow sits by this fountain, and the other birds come to it for comfort. Frida is an old form of fría, cold."
    bases:
      "Fontefrida": "Fontefrida (cold fountain)"
