      "tomar": "take"
      "consolación": "comfort"
  "es-4162":
    native: "Lullaby, little lullaby, I lost my fortune; lullaby, little lullaby, I won it back."
    notes:
      "n1": "Nana means lullaby, and nanita is the diminutive, a little lullaby. The verses play on perder (lose) and ganar (win)."
    bases:
      "A": "to"
      "la": "the"
      "nana": "lullaby"
