      "mañana": "morning"
  "es-4164":
    native: "Go to sleep, baby, in the arms, and you will sleep with rest;"
    notes:
      "n1": "Duérmete is the imperative of dormirse, to go to sleep, with the pronoun -te attached. Dormirás is the future: you will sleep."
    bases:
