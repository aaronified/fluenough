  "es-4163":
    native: "Hey, lullaby, hey, lullaby: go to sleep, little morning star of the morning."
    notes:
      "n1": "Lucero is the morning star, the bright planet seen before dawn. Ea is a call that starts the lullaby."
    bases:
      "Ea": "hey (a call to begin)"
      "la": "the"
      "nana": "lullaby"
      "Duérmete": "go to sleep"
