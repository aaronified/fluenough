native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: anonymous ballads and a medieval poet"
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
description: "Eighteen short items from Spanish medieval and early literature, in the public domain: lines of two anonymous ballads, printed in 1511 and 1550, and lines of Gonzalo de Berceo's miracle stories, printed in 1780. Each shows who wrote it, when, and where it comes from. Not yet checked by a Spanish speaker: please report any mistake."

cards:
  "es-4150":
    native: "That I do not know when it is day, nor even when it is night."
    notes:
      "n1": "Lines of a prisoner from the Romance del prisionero. He cannot see daylight or dark, so he cannot tell day from night."
    bases:
      "que": "that"
      "ni": "nor"
      "sé": "I know"
      "cuándo": "when"
      "es": "it is"
      "de": "of, in"
      "día": "day"
      "menos": "less, here: not even"
      "noche": "night"
  "es-4151":
    native: "Except for a little bird that sang to me at dawn; a crossbowman killed it for me."
    notes:
      "n1": "The prisoner's only comfort was a little bird that sang at dawn. A crossbowman killed it, and the prisoner curses him. The verse is in the 1511 printing of the Romance del prisionero."
    bases:
      "sino": "except, but"
      "por": "for"
      "una": "a"
      "avecilla": "little bird"
      "que": "that"
      "me": "to me"
      "cantaba": "was singing, used to sing"
      "al": "at the"
      "albor": "dawn"
      "matómela": "killed it for me"
      "un": "a"
      "ballestero": "crossbowman"
  "es-4152":
    native: "He was a poor man who lived on daily rations."
    notes:
      "n1": "The first stanza of the story of the poor almsgiver in Berceo's Milagros de Nuestra Señora. The 1780 print has older spelling (omne, vivie, raçiones); the card shows it in modern spelling."
    bases:
      "Era": "was"
      "un": "a"
      "hombre": "man"
      "pobre": "poor"
      "que": "who"
      "vivía": "lived"
      "de": "on"
      "raciones": "daily rations, food allowance"
  "es-4153":
    native: "He loved her son, and he loved her too."
    notes:
      "n1": "From the story of the cleric who prays to the Virgin Mary in Berceo's Milagros de Nuestra Señora. The 1780 print has older spelling (al so fijo, a ella); the card shows it in modern spelling."
    bases:
      "Amaba": "loved"
      "a": "(marks the one loved)"
      "su": "her"
      "hijo": "son"
      "y": "and"
      "ella": "her"
  "es-4154":
    native: "Going out to look for game, to feed his falcon for the hunt,"
    notes:
      "n1": "The count is out hunting when a voice from the sea calls him in the romance. Cebar means to feed a hunting bird so that it is keen to hunt."
    bases:
      "Andando": "going, walking"
      "a": "to"
      "buscar": "look for"
      "la": "the"
      "caza": "game, hunt"
      "para": "for"
      "su": "his"
      "falcón": "falcon"
      "cebar": "feed (a hunting bird)"
  "es-4155":
    native: "In Toledo the good, that royal town,"
    notes:
      "n1": "The first line of the Milagros de Nuestra Señora, set in Toledo. Essa is the old form of esa, that, and the card keeps the spelling of the 1780 print."
    bases:
      "En": "in"
      "Toledo": "Toledo"
      "la": "the"
      "buena": "good"
      "essa": "that (old form of esa)"
      "villa": "town"
      "real": "royal"
  "es-4156":
    native: "There was an archbishop, crowned and loyal,"
    notes:
      "n1": "Ovo is the old form of hubo, there was."
    bases:
      "Ovo": "there was (old form of hubo)"
      "un": "an"
      "arzobispo": "archbishop"
      "coronado": "crowned"
      "leal": "loyal"
  "es-4157":
    native: "He always kept his close bond with the Glorious One,"
    notes:
      "n1": "La Gloriosa is the Virgin Mary. Atenençia is an old word for close attention or bond."
    bases:
      "Siempre": "always"
      "con": "with"
      "la": "the"
      "Gloriosa": "Glorious One (the Virgin Mary)"
      "ovo": "had (old form of hubo)"
      "su": "his"
      "atenençia": "close bond, care"
  "es-4158":
    native: "No man ever put greater love in a lady,"
    notes:
      "n1": "Duenna is the old word for a lady; the modern Spanish is dueña. Maior is the old form of mayor, greater."
    bases:
      "Nunca": "never"
      "varon": "man"
      "en": "to"
      "duenna": "lady"
      "metió": "put"
      "maior": "greater (old form of mayor)"
      "querençia": "love, affection"
  "es-4159":
    native: "Friends, if you would wait a little,"
    notes:
      "n1": "Quissiessedes is an old form of quisiéseis, you would want. Berceo speaks to his listeners directly, as a storyteller."
    bases:
      "Amigos": "friends"
      "si": "if"
      "quissiessedes": "you would want (old form)"
      "un": "a"
      "poco": "little"
      "esperar": "wait"
  "es-4160":
    native: "I would like to tell you yet another miracle."
    notes:
      "n1": "Miraclo is an old form of milagro, miracle. Querria is an old form of quisiera, would like."
    bases:
      "Aun": "yet"
      "otro": "another"
      "miraclo": "miracle (old form of milagro)"
      "vos": "to you"
      "querria": "would like"
      "contar": "tell"
  "es-4161":
    native: "A Benedictine monk was in a monastery,"
    notes:
      "n1": "Beneito is an old form of benito, Benedictine. Mongia is an old word for a monastery."
    bases:
      "Un": "a"
      "monge": "monk"
      "beneito": "Benedictine (old form of benito)"
      "fue": "was"
      "en": "in"
      "una": "a"
      "mongia": "monastery"
  "es-4162":
    native: "He loved Holy Mary with all his heart,"
    notes:
      "n1": "Querie is an old form of quería, he loved. Sancta is an old form of santa, holy."
    bases:
      "Querie": "loved (old form of quería)"
      "de": "with"
      "corazon": "heart"
      "bien": "well"
      "a": "to"
      "Sancta": "holy (old form of santa)"
      "Maria": "Mary"
  "es-4163":
    native: "But he was mad, yet he had good sense,"
    notes:
      "n1": "Locco is an old spelling of loco, mad. Avie is an old form of había, he had."
    bases:
      "Pero": "but"
      "que": "though"
      "era": "was"
      "locco": "mad (old spelling)"
      "avie": "had (old form of había)"
      "un": "a"
      "buen": "good"
      "sentido": "sense"
  "es-4164":
    native: "He loved the Glorious One with a full heart."
    notes:
      "n1": "Complido is an old form of cumplido, full or complete. La Gloriosa is the Virgin Mary."
    bases:
      "Amaba": "loved"
      "la": "the"
      "Gloriosa": "Glorious One (the Virgin Mary)"
      "de": "with"
      "corazon": "heart"
      "complido": "full, complete"
  "es-4165":
    native: "Enemies attacked this man,"
    notes:
      "n1": "Dar salto a means to attack someone suddenly. Dieronli joins dieron (they gave) and li (to him)."
    bases:
      "Dieronli": "attacked him (dieron le, old form)"
      "enemigos": "enemies"
      "salto": "attack, assault"
      "a": "on"
      "est": "this (old form of este)"
      "varon": "man"
  "es-4166":
    native: "For he held him to be sensible, and free of folly."
    notes:
      "n1": "Ca is an old word meaning for or because. Quito means free or clear of, and follia is folly."
    bases:
      "Ca": "for"
      "tenielo": "held him (old form of tenía lo)"
      "por": "as"
      "cuerdo": "sensible"
      "e": "and"
      "quito": "free (of)"
      "de": "of"
      "follia": "folly"
  "es-4167":
    native: "Who always was, and is, the enemy of good people,"
    notes:
      "n1": "The subject is the evil enemy named in the line before, the vicar of Beelzebub. Eslo is an old form of es lo, is it."
    bases:
      "Que": "who"
      "siempre": "always"
      "fue": "was"
      "e": "and"
      "eslo": "is it (old form of es lo)"
      "de": "of"
      "los": "the"
      "buenos": "good"
      "contrario": "enemy, opposite"
