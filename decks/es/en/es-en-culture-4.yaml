  "es-4165":
    native: "Go to sleep, my dear life, sleep without worry, because at the foot of the cradle your mother keeps watch."
    notes:
      "n1": "Vela is the present of velar, to keep watch over someone. The lullaby tells the baby that the mother stays awake nearby."
    bases:
