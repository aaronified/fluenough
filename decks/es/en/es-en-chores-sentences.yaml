cards:
  "es-1536":
    native: "I wash the dishes and sweep the floor."
    bases: { "los": "the", "el": "the" }
    confusables: { "fregona": { why: "Fregona is a mop for the floor, not for dishes." }, "esponja": { why: "Esponja is for washing dishes, not for sweeping." } }
  "es-1537":
    native: "I put the clothes in the washing machine."
    bases: { "Pongo": "to put", "la": "the", "en": "in" }
    confusables: { "secadora": { why: "Secadora dries clothes; the washer washes them." }, "tender": { why: "Tender is to hang clothes outside to dry." } }
  "es-1538":
    native: "I take out the rubbish and recycle the paper."
    bases: { "Saco": "to get; to take out", "la": "the", "el": "the" }
    confusables: { "reciclaje": { why: "Reciclaje is the recycling itself, the noun." }, "tirar": { why: "Tirar is to throw away, without sorting." } }
  "es-1539":
    native: "I iron the shirt on the table."
    bases: { "la": "the", "en": "in" }
    confusables: { "plancha": { why: "Plancha is the iron, the machine, not the action." }, "limpiar": { why: "Limpiar is to clean, not to iron." } }
  "es-1540":
    native: "The house is untidy and has a lot of dust."
    bases: { "La": "the" }
    confusables: { "ordenar": { why: "Ordenar is to tidy, the action to do." }, "limpio": { why: "Limpio is clean, the opposite of dusty." } }
  "es-1541":
    native: "I fix the lamp and put the clothes away."
    bases: { "la": "the" }
    confusables: { "preparar": { why: "Preparar is to prepare food, not to fix." }, "recoger": { why: "Recoger is to pick up things from the floor." } }
