schema: 1
id: "es-en-everyday-verbs-sentences"
kind: "layer"
core: "es-everyday-verbs-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences: everyday verbs"
license: "CC-BY-SA-4.0"
description: "Ten sentences about an ordinary day, with the verbs of Everyday verbs and the words each is often mixed up with. Not yet checked by a Spanish speaker: please report any mistake."

cards:
  "es-0304":
    notes:
      "n1": "Clock times take a: a las siete, at seven o'clock."
    native: "Ana has breakfast at seven and then works."
    bases:
      "Ana": "Ana"
      "a": "to"
      "las": "the"
      "luego": "then"
    confusables:
      "eat": { why: "Comer is to eat, not to have breakfast." }
      "drink": { why: "Beber is to drink." }
  "es-0305":
    notes:
      "n1": "En casa means at home, with no article."
    native: "I eat at home and drink water."
    bases:
      "en": "in"
      "casa": "house"
      "agua": "water"
    confusables:
      "have-dinner": { why: "Cenar is to have dinner: the meal in the evening." }
      "cook": { why: "Cocinar is to cook, not to eat." }
  "es-0306":
    native: "The children read a book at night."
    bases:
      "Los": "the"
      "niños": "children"
      "un": "a"
      "libro": "book"
      "por": "through"
      "la": "the"
      "noche": "night"
    confusables:
      "write": { why: "Escribir is to write, not to read." }
      "learn": { why: "Aprender is to learn." }
  "es-0307":
    notes:
      "n1": "Escribir takes a before the person written to: escribe a sus amigos, writes to her friends."
    native: "My sister writes letters to her friends."
    bases:
      "hermana": "sister"
      "cartas": "letters"
      "a": "to"
      "sus": "their"
      "amigos": "friends"
    confusables:
      "read": { why: "Leer is to read, not to write." }
      "receive": { why: "Recibir is to receive, not to write." }
  "es-0308":
    notes:
      "n1": "Poder changes its stem vowel o to ue in the present: puedo, I can."
    native: "May I use your phone?"
    bases:
      "Puedo": "I can"
      "teléfono": "phone"
    confusables:
      "call": { why: "Llamar is to call: a phone call, not using the phone." }
      "arrive": { why: "Llegar is to arrive." }
  "es-0309":
    notes:
      "n1": "Para plus an infinitive gives the purpose: para limpiar, in order to clean."
    native: "I need help to clean the house."
    bases:
      "para": "for"
      "la": "the"
      "casa": "house"
    confusables:
      "wash": { why: "Lavar is to wash, not to clean a house." }
      "buy": { why: "Comprar is to buy." }
  "es-0310":
    notes:
      "n1": "Cada takes no plural: cada mañana, every morning, with the noun in the singular."
    native: "My mother buys bread every morning."
    bases:
      "madre": "mother"
      "pan": "bread"
      "cada": "every"
    confusables:
      "pay": { why: "Pagar is to pay, not to buy." }
      "look-for": { why: "Buscar is to look for." }
  "es-0311":
    notes:
      "n1": "A weekday in the plural, with los, means on that day each week: los domingos, on Sundays."
    native: "My uncle cooks on Sundays."
    bases:
      "tío": "uncle"
      "los": "the"
      "domingos": "Sundays"
    confusables:
      "have-dinner": { why: "Cenar is to have dinner, not to cook." }
      "prepare": { why: "Preparar is to prepare, close to cook but more general." }
  "es-0312":
    notes:
      "n1": "Ir a plus an infinitive is the near future: voy a llegar, I am going to arrive."
    native: "I am going to arrive late for class."
    bases:
      "a": "to"
      "tarde": "late"
      "clase": "class"
    confusables:
      "look-at": { why: "Mirar is to look at, not to arrive." }
      "listen": { why: "Escuchar is to listen." }
  "es-0313":
    notes:
      "n1": "Gustar works backwards: me gusta bailar, dancing pleases me, so it takes the singular gusta."
    native: "I like to dance and sing with my friends."
    bases:
      "Me": "me"
      "gusta": "likes"
      "cantar": "to sing"
      "con": "with"
      "mis": "my"
      "amigos": "friends"
    confusables:
      "learn": { why: "Aprender is to learn, not to dance." }
      "pay": { why: "Pagar is to pay." }
