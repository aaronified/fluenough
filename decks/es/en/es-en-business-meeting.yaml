description: "Words and phrases for running and joining a work meeting: agreeing, disagreeing, asking for a repeat and closing."
cards:
  "es-4699":
    native: "Good morning, everyone."
  "es-4700":
    native: "Let's start the meeting."
  "es-4701":
    native: "I agree with you."
    notes: { n1: "Usted is the formal you; with a colleague you know well, tú is more usual." }
  "es-4702":
    native: "I am not sure about that."
  "es-4703":
    native: "Could you repeat the last part?"
    notes: { n1: "Podría is the polite usted form; to a colleague you would say ¿Podrías repetir la última parte?" }
  "es-4704":
    native: "I will check it and let you know."
  "es-4705":
    native: "We have to make a decision."
  "es-4706":
    native: "Let's agree on that."
  "es-4707":
    native: "Thank you for your time."
    notes: { n1: "Su is your when speaking formally (to usted); it can also mean his, her or their." }
  "es-4708":
    native: "proposal"
    bases: { "la": "the", "propuesta": "proposal" }
    examples:
      "Tengo una propuesta para el proyecto.": { native: "I have a proposal for the project.", bases: { "Tengo": "I have", "una": "a", "propuesta": "proposal", "para": "for", "el": "the", "proyecto": "project" } }
      "Esta propuesta es buena para nuestra empresa.": { native: "This proposal is good for our company.", bases: { "Esta": "this", "propuesta": "proposal", "es": "is", "buena": "good", "para": "for", "nuestra": "our", "empresa": "company" } }
  "es-4709":
