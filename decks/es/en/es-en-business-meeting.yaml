      "Hago una presentación sobre el nuevo producto.": { native: "I am giving a presentation on the new product.", bases: { "Hago": "I give", "una": "a", "presentación": "presentation", "sobre": "on", "el": "the", "nuevo": "new", "producto": "product" } }
