id: "es-en-hospitality-reception"
kind: "layer"
core: "es-hospitality-reception"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hospitality: hotel reception"
license: "CC-BY-SA-4.0"
description: "Words and phrases for checking in and out of a hotel: the booking, the room, the key and breakfast."
cards:
  "es-4681":
    native: "I have a booking under the name García."
    notes: { n1: "A nombre de means under the name of, the way to give a booking." }
  "es-4682":
    native: "Do you have a free room for two nights?"
    notes: { n1: "Tiene is the usted form, used at the hotel desk." }
  "es-4683":
    native: "I would like a room with a sea view."
    notes: { n1: "Quisiera is a softer, more polite form of quiero, I want.", n2: "Al is the contraction of a and el, used before a masculine noun." }
  "es-4684":
    native: "What time is breakfast?"
    notes: { n1: "Es, from ser, gives the time an event happens, so estar is not used." }
  "es-4685":
    native: "Is there wifi in the room?"
    notes: { n1: "Hay means there is or there are, and it does not change for a plural." }
  "es-4686":
    native: "The room is on the third floor."
    notes: { n1: "Estar is used for where something is, so está, not es." }
  "es-4687":
    native: "Check-out is at twelve."
    notes: { n1: "Clock times take a las with the hour, as in a las doce, but one o'clock is a la una." }
  "es-4688":
    native: "Can I leave the suitcases here?"
    notes: { n1: "Dejar means to leave something somewhere, while salir means to leave a place." }
  "es-4689":
    native: "Can you call a taxi for me, please?"
    notes: { n1: "Puede is the usted form; to a friend you would say ¿Me puedes pedir un taxi?" }
