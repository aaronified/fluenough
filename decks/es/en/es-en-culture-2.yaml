native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: poems and prose of the nineteenth century"
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
description: "Eighteen short openings of Spanish-language poems and prose from the nineteenth century, in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by a Spanish speaker: please report any mistake."

cards:
  "es-4050":
    native: "I am an honest man, from where the palm tree grows."
    notes:
      "n1": "The opening of Versos sencillos (Simple verses), a book of poems by José Martí published in 1891. The poet says he is an honest man, and that he comes from a place where the palm tree grows."
    bases:
      "Yo": "I"
      "soy": "am"
      "un": "a"
      "hombre": "man"
      "sincero": "sincere, honest"
      "de": "from"
      "donde": "where"
      "crece": "grows"
      "la": "the"
      "palma": "palm tree"
  "es-4051":
    native: "Here I begin to sing, to the rhythm of the vihuela."
    notes:
      "n1": "The opening of El gaucho Martín Fierro, a long poem by José Hernández in two parts (1872 and 1879). The singer is a gaucho, a herdsman of the plains. The vihuela is a plucked string instrument; the printed copy spells it vigüela."
    bases:
      "Aquí": "here"
      "me": "myself"
      "pongo": "I place, I begin"
      "a": "to"
      "cantar": "to sing"
      "al": "to the"
      "compás": "rhythm, beat"
      "de": "of"
      "la": "the"
      "vihuela": "vihuela, a plucked string instrument"
  "es-4052":
    native: "You ask what poetry is, while you fix your blue eyes on mine."
    notes:
      "n1": "The opening of Rima XXI of the Rimas (Rhymes) by Gustavo Adolfo Bécquer, which his friends published after his death, in the 1871 edition of his Obras. Someone asks the question while looking into the speaker's eyes, and the poem answers it."
    bases:
      "Qué": "what"
      "es": "is"
      "poesía": "poetry"
      "dices": "you say"
      "mientras": "while"
      "clavas": "you fix"
      "en": "on"
      "mi": "my"
      "pupila": "pupil, eye"
      "tu": "your"
      "azul": "blue"
  "es-4053":
    native: "A great person must have been the first to call laziness a deadly sin."
    notes:
      "n1": "The first clause of Vuelva usted mañana (Come back tomorrow), an article by Larra. The line is ironic: the writer says a great person must have been the first to call laziness a deadly sin, and then declines to go into the history of that sin."
    bases:
      "Gran": "great (before a noun)"
      "persona": "person"
      "debió": "must have"
      "de": "of, to"
      "ser": "to be"
      "el": "the"
      "primero": "first"
      "que": "who, that"
      "llamó": "called"
      "pecado": "sin"
      "mortal": "deadly"
      "a": "to"
      "la": "the"
      "pereza": "laziness"
  "es-4054":
    native: "With ten cannons along each side, the wind astern and every sail set."
    notes:
      "n1": "The first line of the Canción del pirata (Song of the pirate) by José de Espronceda. Por banda means on each side of the ship, and en popa means with the wind coming from behind."
    bases:
      "Con": "with"
      "diez": "ten"
      "cañones": "cannons"
      "por": "along"
      "banda": "side"
      "viento": "wind"
      "en": "in, at"
      "popa": "stern (back of a ship)"
      "a": "at"
      "toda": "all"
      "vela": "sail"
  "es-4055":
    native: "The princess is sad... What can be the matter with the princess?"
    notes:
      "n1": "The first lines of Sonatina by Rubén Darío. The princess has lost her laughter and her colour, and the poem asks what is wrong with her."
    bases:
      "La": "the"
      "princesa": "princess"
      "está": "is"
      "triste": "sad"
      "qué": "what"
      "tendrá": "can have"
  "es-4056":
    native: "Youth, divine treasure, you are leaving and will not come back!"
    notes:
      "n1": "The first two lines of the Canción de otoño en primavera (Autumn song in spring) by Rubén Darío, from Cantos de vida y esperanza. The poet speaks to youth as it leaves him."
    bases:
      "Juventud": "youth"
      "divino": "divine"
      "tesoro": "treasure"
      "ya": "now, already"
      "te": "you (to you)"
      "vas": "you go"
      "para": "in order to"
      "no": "not"
      "volver": "to come back"
  "es-4057":
    native: "Although mine is history, I will not begin it with Noah's ark."
    notes:
      "n1": "The start of the opening sentence of El matadero (The slaughterhouse) by Esteban Echeverría. The narrator refuses to begin the way the old Spanish historians of America did, with Noah's ark and the genealogy of his ancestors. The story was written around 1838 to 1840 and first published in 1871."
    bases:
      "A": "in spite of"
      "pesar": "grief, regret (in a pesar de)"
      "de": "of"
      "que": "that"
      "la": "the"
      "mía": "mine"
      "es": "is"
      "historia": "history, story"
      "no": "not"
      "empezaré": "I will begin"
      "por": "with"
      "el": "the"
      "arca": "ark"
      "Noé": "Noah"
  "es-4058":
    native: "Hail, fertile zone, that encloses within your bounds the wandering path of the lovesick sun."
    notes:
      "n1": "The first lines of Silva a la agricultura de la zona tórrida (Ode to farming in the tropical zone) by Andrés Bello, published in 1826. The poem praises the fertile land of the tropics and the sun that shines on it."
    bases:
      "Salve": "hail"
      "fecunda": "fertile"
      "zona": "zone"
      "que": "that, which"
      "al": "to the"
      "sol": "sun"
      "enamorado": "in love"
      "circunscribes": "you enclose, you encircle"
      "el": "the"
      "vago": "wandering"
      "curso": "course, path"
  "es-4059":
    native: "The heroic city was dozing through the afternoon siesta."
    notes:
      "n1": "The first sentence of La Regenta by Leopoldo Alas (Clarín), set in the provincial city of Vetusta. The word heroica is ironic: the city is quiet and sleepy, not heroic."
    bases:
      "La": "the"
      "heroica": "heroic"
      "ciudad": "city"
      "dormía": "was sleeping"
      "siesta": "afternoon nap"
  "es-4060":
    native: "Do not say that its treasure is used up, that it lacks subjects, and that the lyre has fallen silent."
    notes:
      "n1": "The opening of Rima IV of the Rimas by Gustavo Adolfo Bécquer. The poem says that poetry will never end while the world still has light, feeling and mystery."
    bases:
      "No": "not"
      "digáis": "say"
      "que": "that"
      "agotado": "used up"
      "su": "its"
      "tesoro": "treasure"
      "de": "of"
      "asuntos": "subjects, topics"
      "falta": "is lacking"
      "enmudeció": "fell silent"
      "la": "the"
      "lira": "lyre"
  "es-4061":
    native: "The dark swallows will return to hang their nests on your balcony."
    notes:
      "n1": "The first two lines of Rima LIII by Gustavo Adolfo Bécquer. The swallows come back, but the ones that learned our names do not, so the poem sets what returns against what is lost for good."
    bases:
      "Volverán": "will return"
      "las": "the"
      "oscuras": "dark"
      "golondrinas": "swallows"
      "en": "on"
      "tu": "your"
      "balcón": "balcony"
      "sus": "their"
      "nidos": "nests"
      "a": "to"
      "colgar": "to hang"
  "es-4062":
    native: "I am ardent, I am dark, I am the symbol of passion."
    notes:
      "n1": "The opening of Rima XI by Gustavo Adolfo Bécquer. The voice calls itself passion, and when a lover asks whether it is him that it seeks, the answer is no."
    bases:
      "Yo": "I"
      "soy": "am"
      "ardiente": "ardent"
      "morena": "dark"
      "el": "the"
      "símbolo": "symbol"
      "de": "of"
      "la": "the"
      "pasión": "passion"
  "es-4063":
    native: "I grow a white rose, in July as in January, for the sincere friend who offers me his frank hand."
    notes:
      "n1": "The first four lines of poem XXXIX of Versos sencillos (Simple verses) by José Martí, from the book of 1891. The speaker grows a white rose for a friend who is sincere."
    bases:
      "Cultivo": "I grow"
      "una": "a"
      "rosa": "rose"
      "blanca": "white"
      "en": "in"
      "julio": "July"
      "como": "as, like"
