  "es-4064":
    native: "I was still a child when they sent me away from my father's house."
    notes:
      "n1": "The opening of María, the novel by Jorge Isaacs. The narrator, Efraín, recalls that as a boy he was sent away to school in Bogotá."
    bases:
      "Era": "was"
      "yo": "I"
      "niño": "child, boy"
