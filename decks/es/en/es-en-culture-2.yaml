  "es-4066":
    native: "But it is freezing cold here, as cold as three thousand devils!"
    notes:
      "n1": "A line from chapter I of Doña Perfecta by Benito Pérez Galdós, said by a traveller who arrives in a village at dawn. The phrase de tres mil demonios, of three thousand devils, makes the noun before it very strong."
    bases:
      "Pero": "but"
      "hace": "it is (with cold)"
      "aquí": "here"
      "un": "a"
      "frío": "cold"
      "de": "of"
      "tres": "three"
      "mil": "thousand"
      "demonios": "devils"
  "es-4067":
    native: "Pearl of the sea! Star of the West! Lovely Cuba, your bright sky!"
    notes:
      "n1": "The first two lines of Al partir, a sonnet by Gertrudis Gómez de Avellaneda, written on the voyage in 1836 when her family left Cuba for Europe. The poem is a farewell to the island."
    bases:
