  "es-4065":
    native: "The label on the bundle of papers is the Latin saying that serves as its epigraph."
    notes:
      "n1": "The preface of Pepita Jiménez by Juan Valera, a novel of 1874. The narrator says the bundle of papers is labelled with a Latin saying, and he leaves out the woman's name that he would otherwise use as the title."
    bases:
