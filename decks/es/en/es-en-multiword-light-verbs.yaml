id: "es-en-multiword-light-verbs"
kind: "layer"
core: "es-multiword-light-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: light verbs"
description: "Twenty idioms built on a light verb and a noun: pay attention, be needed, queue, go for a walk, thank, shake hands, feel like, be right, be afraid, be in a hurry, tease, miss, be liked, carry out, set the table, change one's mind, shout, get by, and keep. Not yet checked by a Spanish speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "es-4500":
    native: "to pay attention; to heed"
    notes:
      "u1": "Hacer caso a someone means to pay attention to them or follow their advice: no me hace caso, he does not listen to me. The a introduces the person."
    bases:
      "caso": { meaning: "attention; notice, in hacer caso to pay attention" }
  "es-4501":
    native: "to be needed; to be missing"
    notes:
      "u1": "Hacer falta takes the thing needed as its subject: me hace falta tiempo, I need time. The verb agrees with that thing: me hacen falta dos sillas, I need two chairs."
    bases:
      "falta": { meaning: "lack; need, in hacer falta something that is needed" }
  "es-4502":
    native: "to queue; to stand in line"
    notes:
      "u1": "Hacer cola means to stand in a line and wait for your turn: hay mucha gente haciendo cola, there are many people queuing."
  "es-4503":
    native: "to go for a walk"
    notes:
      "u1": "Dar un paseo means to go for a short walk, for pleasure or exercise: damos un paseo después de cenar, we go for a walk after dinner."
  "es-4504":
    native: "to thank; to say thank you"
    notes:
      "u1": "Dar las gracias a someone means to thank them: les doy las gracias, I thank them. Gracias alone means thanks."
  "es-4505":
    native: "to shake hands"
    notes:
      "u1": "Dar la mano a someone means to shake hands with them as a greeting: le di la mano, I shook his hand. The a introduces the person."
  "es-4506":
    native: "to feel like; to want to"
    notes:
      "u1": "Tener ganas de and an infinitive say someone wants to do something: tengo ganas de salir, I feel like going out. Tener takes the tense; ganas does not change."
    bases:
      "ganas": { meaning: "desire; wish, in tener ganas de a wish to do something" }
  "es-4507":
    native: "to be right"
    notes:
      "u1": "Tener razón means to be right: tienes razón, you are right. Razón does not mean reason here; the opposite is estar equivocado, to be wrong."
    bases:
      "razón": { meaning: "being right; correctness, in tener razón to be right" }
  "es-4508":
    native: "to be afraid"
    notes:
      "u1": "Tener miedo means to be afraid: tengo miedo a la oscuridad, I am afraid of the dark. Add de before a clause: tengo miedo de que llueva, I am afraid it will rain."
  "es-4509":
    native: "to be in a hurry"
    notes:
      "u1": "Tener prisa means to be in a hurry: tengo prisa, tengo que irme, I am in a hurry, I have to go. Prisa is a noun, so it takes no article."
    bases:
      "prisa": { meaning: "haste; hurry, in tener prisa to be in a hurry" }
  "es-4510":
    native: "to tease; to pull someone's leg"
    notes:
      "u1": "Tomar el pelo a someone means to tease them or joke at their expense: no me tomes el pelo, do not pull my leg. It is informal and is not about hair."
  "es-4511":
    native: "to miss someone or something"
    notes:
      "u1": "Echar de menos means to miss someone or something that is absent: te echo de menos, I miss you. It is used for people and things alike."
    bases:
      "echar": { meaning: "to throw; to cast, in echar de menos to feel the loss of" }
      "menos": { meaning: "less; lacking, in echar de menos absence" }
  "es-4512":
    native: "to be liked; to make a good impression"
    notes:
      "u1": "Caer bien means the subject is liked by someone: me cae bien tu hermano, I like your brother. Caer mal is the opposite: me cae mal, I do not like him."
    bases:
      "caer": { meaning: "to fall, in caer bien to strike someone as nice" }
  "es-4513":
    native: "to carry out; to accomplish"
    notes:
      "u1": "Llevar a cabo something means to carry it out or complete it: llevaron a cabo el proyecto, they carried out the project. It is formal and used for plans, tasks and decisions."
    bases:
      "cabo": { meaning: "end; completion, in llevar a cabo to finish something" }
  "es-4514":
    native: "to set the table"
    notes:
      "u1": "Poner la mesa means to set the table for a meal: pongo la mesa antes de comer, I set the table before we eat. Its opposite is quitar la mesa, to clear the table."
  "es-4515":
    native: "to pay attention"
    notes:
      "u1": "Prestar atención (a something) means to focus on it: presta atención a la explicación, pay attention to the explanation. The noun takes no article."
    bases:
      "prestar": { meaning: "to lend; to give, in prestar atención to give" }
      "atención": { meaning: "attention" }
  "es-4516":
    native: "to change one's mind"
    notes:
      "u1": "Cambiar de idea means to change one's opinion or decision: he cambiado de idea, I have changed my mind. The de is needed; cambiar alone means to change something."
  "es-4517":
    native: "to let out a shout"
    notes:
      "u1": "Pegar un grito means to let out a sudden shout: pegó un grito al ver el coche, she let out a shout when she saw the car. The noun takes un, as a single event."
    bases:
      "pegar": { meaning: "to hit; to stick, in pegar un grito to let out" }
      "grito": { meaning: "shout; cry" }
  "es-4518":
    native: "to get by; to get through hard times"
    notes:
      "u1": "Salir adelante means to manage despite hardship: salimos adelante con poco dinero, we got by with little money. Salir alone means to leave or go out."
    bases:
      "salir": { meaning: "to leave; to go out, here to get through" }
      "adelante": { meaning: "forward; ahead, here onward despite difficulty" }
  "es-4519":
    native: "to keep; to take for oneself"
    notes:
      "u1": "Quedarse con something means to keep it or choose it: me quedo con este, I will take this one. Quedarse alone means to stay."
    bases:
      "quedarse": { meaning: "to stay, in quedarse con to keep or choose" }
