schema: 1
id: "es-en-medicine-clinic"
kind: "layer"
core: "es-medicine-clinic"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Medicine: a clinic appointment"
license: "CC-BY-SA-4.0"
description: "Words and phrases for a visit to the doctor: the appointment, the symptoms, and the instructions the doctor gives."
cards:
  "es-4662":
    native: "What is wrong?"
    notes: { n1: "Le is the usted form, the one a doctor uses with an adult patient." }
  "es-4663":
    native: "I have had a fever since yesterday."
    notes: { n1: "With desde, the present tense shows the fever is still going on." }
  "es-4664":
    native: "My head hurts."
    notes: { n1: "Duele agrees with the thing that hurts: Me duelen los ojos means My eyes hurt." }
  "es-4665":
    native: "Since when have you had these symptoms?"
    notes: { n1: "Tiene is the usted form, used by a doctor to an adult patient." }
  "es-4666":
    native: "Breathe deeply."
    notes: { n1: "Respire is the usted command, the form a doctor uses with an adult patient." }
  "es-4667":
    native: "Take one tablet every eight hours."
    notes: { n1: "Tome is the usted command form of tomar, used for a formal instruction." }
  "es-4668":
    native: "Do you have health insurance?"
    notes: { n1: "Tiene is the usted form; to a friend you would say ¿Tienes seguro médico?" }
  "es-4669":
    native: "Come back in a week."
    notes: { n1: "Vuelva is the usted command form of volver, to come back." }
  "es-4670":
    native: "blood pressure"
    notes: { n1: "Tensión arterial is the usual medical term for blood pressure." }
    bases: { "la": "the", "tensión": "pressure", "arterial": "arterial" }
    examples:
      "Me toman la tensión.": { native: "They take my blood pressure.", bases: { "Me": "me", "toman": "take", "la": "the", "tensión": "pressure" } }
      "La tensión está alta.": { native: "My blood pressure is high.", bases: { "La": "the", "tensión": "pressure", "está": "is", "alta": "high" } }
  "es-4721":
    native: "prescription"
    notes: { n1: "Receta alone can mean a recipe; receta médica is the prescription." }
    bases: { "la": "the", "receta": "prescription", "médica": "medical" }
    examples:
      "Necesito una receta médica para este antibiótico.": { native: "I need a prescription for this antibiotic.", bases: { "Necesito": "I need", "una": "a", "receta": "prescription", "médica": "medical", "para": "for", "este": "this", "antibiótico": "antibiotic" } }
      "El médico me escribió una receta médica.": { native: "The doctor wrote me a prescription.", bases: { "El": "the", "médico": "doctor", "me": "me", "escribió": "wrote", "una": "a", "receta": "prescription", "médica": "medical" } }
