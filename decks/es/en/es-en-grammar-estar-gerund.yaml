schema: 1
id: "es-en-grammar-estar-gerund"
kind: "layer"
core: "es-grammar-estar-gerund"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Saying what is happening now: estar and the gerund"
license: "CC-BY-SA-4.0"
description: "To say what is going on right now, use estar with a gerund: estoy hablando, I am speaking. Only estar changes for the person. Not yet checked by a Spanish speaker: please report any mistake."
pattern:
  name: "Estar and the gerund"
  slot_name: "person"
  entries:
    "hablar": "to speak"
    "comer": "to eat"
    "vivir": "to live"
    "leer": "to read"
    "escribir": "to write"
    "dormir": "to sleep"
    "pedir": "to ask for, to order"
    "hacer": "to do, to make"
    "ir": "to go"
  notes: "Estar, in the right person, and then the gerund. The gerund ends in -ando for -ar verbs (hablando, speaking) and in -iendo for -er and -ir verbs (comiendo, eating). It does not change for the person. Three verbs change their stem: leer becomes leyendo, dormir becomes durmiendo and pedir becomes pidiendo. Ir is irregular: yendo. Use estar with the gerund for an action in progress now, not for a habit: como pan every day, but estoy comiendo now."
