native: { code: "en", iso639_3: "eng", name: "English" }
name: "Spanish present tense, regular -ar verbs"
license: "CC-BY-SA-4.0"
description: "The single most productive pattern in Spanish. Roughly three quarters of Spanish verbs are regular -ar verbs, so these six endings unlock most of them at once."
pattern:
  name: "Present tense, regular -ar verbs"
  slot_name: "person"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "hablar": "to speak"
    "trabajar": "to work"
    "estudiar": "to study"
    "comprar": "to buy"
    "caminar": "to walk"
    "desayunar": "to have breakfast"
    "cenar": "to have dinner"
    "cocinar": "to cook"
    "limpiar": "to clean"
    "lavar": "to wash"
    "usar": "to use"
    "necesitar": "to need"
    "buscar": "to look for"
    "llegar": "to arrive"
    "escuchar": "to listen"
    "mirar": "to look at; to watch"
    "preparar": "to prepare"
    "bailar": "to dance"
    "pagar": "to pay"
    "llamar": "to call"
    "ayudar": "to help"
    "pesar": "to weigh"
    "ganar": "to earn; to win"
    "terminar": "to finish"
    "contestar": "to answer"
    "cambiar": "to change"
    "llevar": "to carry; to take"
    "tomar": "to take; to have (a drink)"
    "bajar": "to go down; to get off"
    "esperar": "to wait (for)"
  notes: "Drop -ar from the infinitive and add -o, -as, -a, -amos, -áis, -an. The vosotros form is used in Spain; Latin American Spanish uses ustedes with the ellos form."
