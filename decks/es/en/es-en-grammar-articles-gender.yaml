name: "Spanish articles and gender"
license: "CC-BY-SA-4.0"
description: "Every Spanish noun is masculine or feminine, and the word for the goes with it: el or la, los or las. Learn each noun with its article."
pattern:
  name: "The definite article and noun gender"
  slot_name: "article"
