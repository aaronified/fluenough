schema: 1
id: "es-en-grammar-articles-gender"
kind: "layer"
core: "es-grammar-articles-gender"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Spanish articles and gender"
license: "CC0-1.0"
description: "Every Spanish noun is masculine or feminine, and the word for the goes with it: el or la, los or las. Learn each noun with its article."
pattern:
  name: "The definite article and noun gender"
  slot_name: "article"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "libro": "book"
    "mesa": "table"
    "casa": "house"
    "cama": "bed"
    "puerta": "door"
    "plato": "plate"
    "vaso": "glass"
    "pared": "wall"
    "flor": "flower"
    "mano": "hand"
    "problema": "problem"
    "mapa": "map"
    "papel": "paper"
    "leche": "milk"
    "nombre": "name"
    "noche": "night"
  notes: "A noun is masculine (el, los) or feminine (la, las), and the article shows which. Most nouns ending in -o are masculine and most ending in -a are feminine, but not all: la mano is feminine, and el problema and el mapa are masculine. The plural adds -s after a vowel and -es after a consonant."
