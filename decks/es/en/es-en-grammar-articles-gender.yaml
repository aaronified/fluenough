  notes: "A noun is masculine (el, los) or feminine (la, las), and the article shows which. Most nouns ending in -o are masculine and most ending in -a are feminine, but not all: la mano is feminine, and el problema and el mapa are masculine. The plural adds -s after a vowel and -es after a consonant."
