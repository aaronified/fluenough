schema: 1
id: "es-en-questions"
kind: "layer"
core: "es-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Questions: who, what, where, when and how much"
license: "CC-BY-SA-4.0"
description: "The question words, who, what, where, when, how, which and how much, with the phrases built on them such as a qué hora (at what time). Not yet checked by a Spanish speaker: please report any mistake."

cards:
  "es-0054":
    native: "what"
    notes:
      "n1": "Written with an accent in a question: ¿Qué? (What?). Without it, que means 'that' and joins two clauses."
    examples:
      "¿Qué es esto?":
        native: "What is this?"
        bases:
          "Qué": "what"
      "¿Qué dices?":
        native: "What are you saying?"
        bases:
          "Qué": "what"
          "dices": "say"
  "es-0055":
    native: "who"
    notes:
      "n1": "Plural quiénes (who, for more than one person): ¿Quiénes son? (Who are they?)."
    examples:
      "¿Quién es ella?":
        native: "Who is she?"
        bases:
          "Quién": "who"
      "¿Quién tiene el libro?":
        native: "Who has the book?"
        bases:
          "Quién": "who"
          "el": "the"
  "es-0056":
    native: "where"
    notes:
      "n1": "Written with an accent in a question: ¿Dónde? Without it, donde joins a clause: la casa donde vivo (the house where I live)."
    examples:
      "¿Dónde está el baño?":
        native: "Where is the bathroom?"
        bases:
          "Dónde": "where"
          "el": "the"
      "No sé dónde estoy.":
        native: "I don't know where I am."
        bases:
          "sé": "know"
          "dónde": "where"
  "es-0057":
    native: "when"
    notes:
      "n1": "Written with an accent in a question: ¿Cuándo? Without it, cuando means 'when' inside a sentence: cuando llego (when I arrive)."
    examples:
      "¿Cuándo es la cita?":
        native: "When is the appointment?"
        bases:
          "Cuándo": "when"
          "la": "the"
      "¿Cuándo llegas a casa?":
        native: "When do you get home?"
        bases:
          "Cuándo": "when"
          "llegas": "get"
          "a": "to"
  "es-0058":
    native: "how"
    notes:
      "n1": "Written with an accent in a question: ¿Cómo? Como without it means 'as' or 'like', or 'I eat': como un libro (like a book)."
    examples:
      "¿Cómo estás?":
        native: "How are you?"
        bases:
          "Cómo": "how"
      "¿Cómo va el trabajo?":
        native: "How is work going?"
        bases:
          "Cómo": "how"
          "el": "the"
          "trabajo": "work"
  "es-0059":
    native: "which (one)"
    notes:
      "n1": "Plural cuáles (which ones). Use it when choosing from a set: ¿Cuál prefieres? (Which one do you prefer?). Spanish also uses it for a name or a number: ¿Cuál es tu nombre? (What is your name?)."
    examples:
      "¿Cuál es tu nombre?":
        native: "What is your name?"
        bases:
          "Cuál": "which"
      "¿Cuál prefieres?":
        native: "Which one do you prefer?"
        bases:
          "Cuál": "which"
          "prefieres": "prefer"
  "es-0060":
    native: "how much; how many"
    notes:
      "n1": "It agrees with its noun: cuánta (f.), cuántos (m. plural), cuántas (f. plural). ¿Cuántos años tienes? is 'how old are you?', literally 'how many years do you have?'."
    examples:
      "¿Cuánto cuesta?":
        native: "How much does it cost?"
        bases:
          "Cuánto": "how much"
      "¿Cuántos años tienes?":
        native: "How old are you?"
        bases:
          "Cuántos": "how many"
  "es-0061":
    native: "why"
    notes:
      "n1": "Two words, written apart: por qué. The answer begins with porque (because), written as one word."
    examples:
      "¿Por qué estás triste?":
        native: "Why are you sad?"
        bases:
          "Por": "for"
          "triste": "sad"
      "No sé por qué llora.":
        native: "I don't know why she is crying."
        bases:
          "sé": "know"
          "por": "for"
          "llora": "cry"
    bases:
      "por": "for"
  "es-0062":
    native: "right?; isn't it?"
    notes:
      "n1": "Added to a statement to ask for agreement: Hace calor, ¿verdad? (It is hot, isn't it?)."
    examples:
      "Es muy bonito, ¿verdad?":
        native: "It is very pretty, isn't it?"
        bases:
          "muy": "very"
          "bonito": "pretty"
          "verdad": "truth"
      "Hoy llueve, ¿verdad?":
        native: "It is raining today, isn't it?"
        bases:
          "Hoy": "today"
          "llueve": "rain"
          "verdad": "truth"
    bases:
      "verdad": "truth"
  "es-0063":
    native: "how are things?; how was it?"
    notes:
      "n1": "A greeting question: ¿Qué tal? asks how things are. Answer with bien (well) or regular (so-so)."
    examples:
      "Hola, ¿qué tal?":
        native: "Hi, how's it going?"
        bases:
          "tal": "so"
      "¿Qué tal el viaje?":
        native: "How was the trip?"
        bases:
          "tal": "so"
          "el": "the"
          "viaje": "trip"
    bases:
      "tal": "so"
  "es-0064":
    native: "from where"
    notes:
      "n1": "Where someone comes from: ¿De dónde eres? (Where are you from?)."
    examples:
      "¿De dónde eres?":
        native: "Where are you from?"
        bases:
          "De": "from"
      "No sé de dónde es.":
        native: "I don't know where he is from."
        bases:
          "sé": "know"
          "de": "from"
    bases:
      "de": "from"
  "es-0065":
    native: "at what time"
    notes:
      "n1": "Asks for a time: ¿A qué hora abre? (At what time does it open?)."
    examples:
      "¿A qué hora empieza la película?":
        native: "What time does the film start?"
        bases:
          "A": "at"
          "la": "the"
          "película": "film"
      "¿A qué hora cenamos?":
        native: "What time do we have dinner?"
        bases:
          "A": "at"
          "cenamos": "have dinner"
    bases:
      "a": "at"
  "es-0066":
    native: "with whom"
    notes:
      "n1": "With whom: ¿Con quién hablas? (Who are you talking to?). Quién is the question word; con is 'with'."
    examples:
      "¿Con quién hablas?":
        native: "Who are you talking to?"
        bases:
          "Con": "with"
      "¿Con quién vas al cine?":
        native: "Who are you going to the cinema with?"
        bases:
          "Con": "with"
          "al": "to the"
    bases:
      "con": "with"
  "es-0067":
    native: "what for"
    notes:
      "n1": "What something is for: ¿Para qué sirve? (What is it for?)."
    examples:
      "¿Para qué sirve esto?":
        native: "What is this for?"
        bases:
          "Para": "for"
          "sirve": "serve"
      "¿Para qué es el papel?":
        native: "What is the paper for?"
        bases:
          "Para": "for"
          "el": "the"
          "papel": "paper"
    bases:
      "para": "for"
  "es-0068":
    native: "what time is it?"
    notes:
      "n1": "Asked for the time. Answer with Son las ... (It is ... o'clock) or Es la ... (It is one o'clock)."
    examples:
      "Perdón, ¿qué hora es ahora?":
        native: "Excuse me, what time is it now?"
        bases:
          "ahora": "now"
      "¿Sabes qué hora es?":
        native: "Do you know what time it is?"
        bases:
          "Sabes": "know"
  "es-0069":
    native: "Question words: who, what, where, when, how, which, how many"
    explanation: "Most questions begin with one of these. Learn them as a set, since each one answers a different question: who, what, where, when, how, which one, and how much or how many."
  "es-4722":
    native: "how many"
    notes:
      n1: "The plural of cuánto for masculine plural nouns: ¿Cuántos libros tienes? (How many books do you have?)."
    examples:
      "No sé cuántos hay.":
        native: "I don't know how many there are."
        bases:
          "sé": "know"
          "cuántos": "how many"
          "hay": "there are"
      "¿Cuántos libros tienes?":
        native: "How many books do you have?"
        bases:
          "Cuántos": "how many"
  "es-4723":
    native: "how many"
    notes:
      n1: "The feminine plural of cuánto, for feminine plural nouns: ¿Cuántas horas duermes? (How many hours do you sleep?)."
    examples:
      "¿Cuántas personas hay aquí?":
        native: "How many people are here?"
        bases:
          "Cuántas": "how many"
          "hay": "there are"
      "¿Cuántas horas duermes?":
        native: "How many hours do you sleep?"
        bases:
          "Cuántas": "how many"
  "es-4724":
    native: "which ones"
    notes:
      n1: "The plural of cuál (which one), with an accent: ¿Cuáles prefieres? (Which ones do you prefer?)."
    examples:
      "No sé cuáles son.":
        native: "I don't know which ones they are."
        bases:
          "sé": "know"
          "cuáles": "which ones"
      "¿Cuáles son tus zapatos?":
        native: "Which ones are your shoes?"
        bases:
          "Cuáles": "which ones"
          "tus": "your"
          "zapatos": "shoes"
  "es-4725":
    native: "who"
    notes:
      n1: "The plural of quién, for more than one person, with an accent: ¿Quiénes son? (Who are they?)."
    examples:
      "¿Quiénes son ellos?":
        native: "Who are they?"
        bases:
          "Quiénes": "who"
      "¿Quiénes vienen a la fiesta?":
        native: "Who is coming to the party?"
        bases:
          "Quiénes": "who"
          "a": "to"
          "la": "the"
          "fiesta": "party"
  "es-4726":
    native: "to where"
    notes:
      n1: "Adónde means to where, with a verb of movement: ¿Adónde vas? (Where are you going?). For where something is, use dónde."
    examples:
      "¿Adónde vas?":
        native: "Where are you going?"
        bases:
          "Adónde": "to where"
      "No sé adónde va el tren.":
        native: "I don't know where the train is going."
        bases:
          "sé": "know"
          "adónde": "to where"
          "el": "the"
          "tren": "train"
  "es-4727":
    native: "which way; through where"
    notes:
      n1: "Asks which way, or through which place: ¿Por dónde pasamos? (Which way shall we go?). For where in general, use dónde."
    bases:
      "por": "through"
    examples:
      "¿Por dónde se va al centro?":
        native: "Which way is it to the centre?"
        bases:
          "Por": "through"
          "se": "one"
          "al": "to the"
          "centro": "centre"
      "No sé por dónde empezar.":
        native: "I don't know where to start."
        bases:
          "sé": "know"
          "por": "through"
  "es-4728":
    native: "until when"
    notes:
      n1: "Asks until when. Hasta means until and cuándo means when; the answer often gives a day or time after hasta, such as hasta el lunes (until Monday)."
    bases:
      "hasta": "until"
    examples:
      "¿Hasta cuándo te quedas?":
        native: "Until when are you staying?"
        bases:
          "Hasta": "until"
          "te": "yourself"
      "¿Hasta cuándo está abierto el museo?":
        native: "Until when is the museum open?"
        bases:
          "Hasta": "until"
          "el": "the"
          "museo": "museum"
  "es-4729":
    native: "since when"
    notes:
      n1: "Asks since when, for something that started earlier. Answer with desde and a time: desde 2020 (since 2020)."
    bases:
      "desde": "since"
    examples:
      "¿Desde cuándo vives aquí?":
        native: "Since when have you lived here?"
        bases:
          "Desde": "since"
      "¿Desde cuándo estudias español?":
        native: "Since when have you been studying Spanish?"
        bases:
          "Desde": "since"
          "español": "Spanish"
  "es-4744":
    native: "how much"
    notes:
      n1: "The feminine singular of cuánto, for a feminine singular noun: ¿Cuánta sal necesitas? (How much salt do you need?)."
    examples:
      "¿Cuánta sal necesitas?":
        native: "How much salt do you need?"
        bases:
          "Cuánta": "how much"
          "sal": "salt"
      "No sé cuánta leche hay.":
        native: "I don't know how much milk there is."
        bases:
          "sé": "know"
          "cuánta": "how much"
          "leche": "milk"
          "hay": "there is"
  "es-4745":
    native: "question"
    notes:
      n1: "Feminine: la pregunta, the question you ask someone; the verb for asking it is preguntar."
    bases:
      "la": "the"
      "pregunta": "question"
    examples:
      "Tengo una pregunta.":
        native: "I have a question."
        bases:
          "una": "a"
          "pregunta": "question"
      "La pregunta es muy fácil.":
        native: "The question is very easy."
        bases:
          "La": "the"
          "pregunta": "question"
          "fácil": "easy"
  "es-4746":
    native: "issue; matter"
    notes:
      n1: "Feminine: la cuestión is a matter or issue to settle, not a question you ask; for a question, use la pregunta."
    bases:
      "la": "the"
      "cuestión": "issue"
    examples:
      "Es una cuestión importante.":
        native: "It is an important matter."
        bases:
          "una": "a"
          "cuestión": "matter"
          "importante": "important"
      "La cuestión es el precio.":
        native: "The issue is the price."
        bases:
          "La": "the"
          "cuestión": "issue"
          "el": "the"
          "precio": "price"
