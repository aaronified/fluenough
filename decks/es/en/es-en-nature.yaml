schema: 1
id: "es-en-nature"
kind: "layer"
core: "es-nature"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Nature: trees, land and water"
license: "CC-BY-SA-4.0"
description: "Words for the outdoors: trees and flowers, the forest and the mountain, the river, lake and sea, the sky and its weather, the land and the stones, and the verbs to sow and harvest. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-1748":
    native: "tree"
    notes: { n1: "Árbol is a tree. Its branches are ramas and its leaves are hojas." }
    bases: { "el": "the", "árbol": "tree" }
    examples:
      "Hay un árbol grande en el parque.": { native: "There is a big tree in the park.", bases: { "Hay": "there is; there are", "un": "a", "árbol": "tree", "en": "in", "el": "the" } }
      "Las hojas del árbol son verdes.": { native: "The leaves of the tree are green.", bases: { "Las": "the", "del": "of", "árbol": "tree", "hojas": "leaf" } }
  "es-1749":
    native: "forest; wood"
    notes: { n1: "Bosque is a forest, larger and wilder than a park." }
    bases: { "el": "the", "bosque": "forest; wood" }
    examples:
      "Paseamos por el bosque.": { native: "We walk in the forest.", bases: { "por": "for", "el": "the", "bosque": "forest; wood" } }
      "En el bosque hay muchos pájaros.": { native: "There are many birds in the forest.", bases: { "En": "in", "el": "the", "bosque": "forest; wood", "hay": "there is; there are" } }
