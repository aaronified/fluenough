tags: ["unreviewed"]
description: "Eighteen short items from Spanish-language literature of the early twentieth century, from Spain and Latin America, in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by a Spanish speaker: please report any mistake."

cards:
  "es-4100":
    native: "Traveller, there is no road: a road is made by walking."
    notes:
      "n1": "Proverb XXIX of Antonio Machado's Proverbios y cantares, in Campos de Castilla (1912). A road is made by walking it: it does not exist before someone walks it."
    bases:
      "Caminante": "traveller, walker"
      "no": "there is not"
      "hay": "there is"
      "camino": "road, path"
      "se": "(passive) is made"
      "hace": "makes"
      "al": "by, when (with the infinitive)"
      "andar": "walking, to walk"
  "es-4101":
    native: "Run away, moon, moon, moon."
    notes:
      "n1": "The refrain of the Romance de la luna, luna in Lorca's Romancero gitano (1928). The moon comes to a forge where a boy is watching, and the refrain tells it to run before the gypsies arrive."
    bases:
      "Huye": "run away (said to the moon)"
      "luna": "moon"
  "es-4102":
    native: "Green, how I love you, green."
    notes:
      "n1": "The refrain of the Romance sonámbulo in Lorca's Romancero gitano (1928). A girl dreams on a balcony, and the colour green comes back again and again through the poem."
    bases:
      "Verde": "green"
      "que": "how"
      "te": "you"
      "quiero": "I love"
  "es-4103":
    native: "Augusto was not a walker, but a stroller through life."
    notes:
      "n1": "Chapter I of Unamuno's novel Niebla (1914). The hero is a stroller rather than a traveller with a goal: caminante (walker) and paseante (stroller) are two words that set the tone."
    bases:
      "Augusto": "Augusto, the hero's name"
      "no": "not"
      "era": "was"
      "un": "a"
      "caminante": "walker, traveller"
      "sino": "but rather"
      "paseante": "stroller"
      "de": "of"
      "la": "the"
      "vida": "life"
  "es-4104":
    native: "They are few, but they are... They open dark trenches"
    notes:
      "n1": "From the poem Los heraldos negros, the title poem of César Vallejo's first book (Lima, 1919; dated 1918). The blows of fate are like heralds that open dark trenches in a man's face and back."
    bases:
      "Son": "they are"
      "pocos": "few"
      "pero": "but"
      "Abren": "they open"
      "zanjas": "ditches, trenches"
      "oscuras": "dark"
  "es-4105":
    native: "The man stepped on something soft, and at once felt the bite on his foot."
    notes:
      "n1": "The opening sentence of the story A la deriva in Horacio Quiroga's Cuentos de amor de locura y de muerte (1917). A snake bites a man, and the story follows what happens next."
    bases:
      "El": "the"
      "hombre": "man"
      "pisó": "stepped on"
      "algo": "something"
      "blanduzco": "soft, squashy"
      "y": "and"
      "enseguida": "at once"
      "sintió": "felt"
      "la": "the"
      "mordedura": "bite"
      "en": "on"
      "pie": "foot"
  "es-4106":
    native: "Death does not frighten me; but we have a daughter, Max!"
    notes:
      "n1": "Madama Collet speaks in the first scene of Valle-Inclán's Luces de bohemia (1920). Max, her blind partner, has just joked about a joint suicide; she says death does not scare her, but they have a daughter."
    bases:
      "A": "as for"
      "mí": "me"
      "la": "the"
      "muerte": "death"
      "no": "not"
      "me": "me"
      "asusta": "frightens"
      "Pero": "but"
      "tenemos": "we have"
      "una": "a"
      "hija": "daughter"
      "Max": "Max, her partner"
  "es-4107":
    native: "I was thinking about my fourteen years as an abandoned boy."
    notes:
      "n1": "A sentence from chapter I of Ricardo Güiraldes's Don Segundo Sombra (1926). The narrator, a boy of fourteen, remembers how he was taken away from the woman he called 'mama' and sent to live in a small town."
    bases:
      "Pensaba": "was thinking"
      "en": "about"
      "mis": "my"
      "catorce": "fourteen"
      "años": "years"
      "de": "of"
      "chico": "boy, lad"
      "abandonado": "abandoned"
  "es-4108":
    native: "The orchard was waking up, and its yawns grew louder and louder."
    notes:
      "n1": "A sentence from the opening pages of chapter I of Vicente Blasco Ibáñez's La barraca (1898), at dawn in the Valencian huerta (irrigated market garden). The birds and the farm animals wake with the sun."
    bases:
      "Despertaba": "was waking up"
      "la": "the"
      "huerta": "irrigated market garden"
      "y": "and"
      "sus": "its"
      "bostezos": "yawns"
      "eran": "were"
      "cada": "each"
      "vez": "time"
      "más": "more"
      "ruidosos": "noisy"
  "es-4109":
    native: "My childhood is made of memories of a courtyard in Seville."
    notes:
      "n1": "The first line of Retrato (Portrait), a poem by Antonio Machado in Campos de Castilla, published in 1912. The poet remembers his childhood in Seville, the city where he was born."
    bases:
      "Mi": "my"
      "infancia": "childhood"
      "son": "are"
      "recuerdos": "memories"
      "de": "of"
      "un": "a"
      "patio": "courtyard"
      "Sevilla": "Seville"
  "es-4110":
    native: "To the old elm, split by lightning and rotten in its middle,"
    notes:
      "n1": "Hendido means split or cracked, here by lightning. Podrido is the past participle of podrir, rotten, and it works like an adjective."
    bases:
      "Al": "to the"
      "olmo": "elm"
      "viejo": "old"
      "hendido": "split, cracked"
      "por": "by"
      "el": "the"
      "rayo": "lightning"
      "y": "and"
      "en": "in"
      "su": "its"
      "mitad": "middle"
      "podrido": "rotten"
  "es-4111":
    native: "Flesh of the yoke, he is born more humbled than beautiful,"
    notes:
      "n1": "A yuntero is a boy who drives the oxen that pull the plough. Carne de yugo, flesh of the yoke, says he is born to work like a beast of burden."
    bases:
      "Carne": "flesh"
      "de": "of"
      "yugo": "yoke"
      "ha": "has (as in ha nacido, is born)"
      "nacido": "born"
      "más": "more"
      "humillado": "humbled"
      "que": "than"
      "bello": "beautiful"
  "es-4112":
    native: "You want me snow-white, you want me white, you want me dawn-pale."
    notes:
      "n1": "The speaker answers a man who wants her to be pure and white. The word quieres (you want) comes three times, and each time it names his wish."
    bases:
      "Tú": "you"
      "me": "me"
      "quieres": "you want"
      "nívea": "snow-white"
      "blanca": "white"
      "alba": "dawn-pale, white as dawn"
  "es-4113":
    native: "From the third day on, this sinking never left her again."
    notes:
      "n1": "In the story Alicia is the young wife in a cold, silent house, and hundimiento means a sinking or a dip."
    bases:
      "Desde": "from"
      "el": "the"
      "tercer": "third"
      "día": "day"
      "este": "this"
      "hundimiento": "sinking, dip"
      "no": "not"
      "la": "her"
      "abandonó": "left"
      "más": "any more"
  "es-4114":
    native: "Preciosa comes along playing, by an amphibious path of crystals and laurels."
    notes:
      "n1": "Tocando is the gerund of tocar. Here it means playing music while walking, and viene tocando means comes playing."
    bases:
      "Preciosa": "Preciosa, the girl's name"
      "tocando": "playing (music)"
      "viene": "comes"
      "por": "along"
      "un": "an"
      "anfibio": "amphibious"
      "sendero": "path"
      "de": "of"
      "cristales": "crystals"
      "y": "and"
      "laureles": "laurels"
  "es-4115":
    native: "The knives of Albacete, beautiful with the blood of the other side, gleam like fish."
    notes:
      "n1": "Reyerta is a fight with knives. The knives shine like fish, a sudden image of metal in the light."
    bases:
      "Las": "the"
      "navajas": "knives"
      "de": "of"
      "Albacete": "Albacete, a town known for its knives"
      "bellas": "beautiful"
      "sangre": "blood"
      "contraria": "of the other side"
      "relucen": "gleam"
      "como": "like"
      "los": "the"
      "peces": "fish"
  "es-4116":
    native: "The river goes running between shady orchards and grey olive groves,"
    notes:
      "n1": "Corriendo is a gerund, the -ndo form, and va corriendo means is running. It shows an action in progress."
    bases:
      "El": "the"
      "río": "river"
      "va": "goes, is"
      "corriendo": "running, flowing"
      "entre": "between"
      "sombrías": "shady"
      "huertas": "orchards"
      "y": "and"
      "grises": "grey"
      "olivares": "olive groves"
  "es-4117":
    native: "There are blows in life, so strong... I do not know!"
    notes:
      "n1": "Hay is the impersonal form of haber, and means there are. The poet cannot say what these blows are, and Yo no sé repeats that he does not know."
    bases:
      "Hay": "there are"
      "golpes": "blows"
      "en": "in"
      "la": "the"
      "vida": "life"
      "tan": "so"
      "fuertes": "strong"
      "Yo": "I"
      "no": "not"
      "sé": "know"
