schema: 1
id: "es-en-directions-sentences"
kind: "layer"
core: "es-directions-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences: directions"
license: "CC-BY-SA-4.0"
description: "Thirty-two sentences about directions and getting around, with the words each is often mixed up with. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-0724":
    notes:
      "n1": "A la derecha means to the right, with a before the article la."
    native: "I turn right at the crossing."
    bases: {"a": "to", "la": "the", "en": "in", "el": "the"}
    confusables: {"izquierda": { why: "Izquierda is left, the other way." }, "recto": { why: "Recto is straight ahead, with no turn." }}
  "es-0725":
    notes:
      "n1": "Recto is an adverb that never changes: seguimos recto, we keep going straight."
    native: "We cross the bridge and go straight on."
    bases: {"el": "the"}
    confusables: {"esquina": { why: "Esquina is a corner, where two streets meet." }, "girar": { why: "Girar is to turn, not to cross." }}
  "es-0726":
    notes:
      "n1": "Estar, not ser, for where a thing is: está cerca, is near."
    native: "The traffic light is near the corner."
    bases: {"El": "the", "de": "of", "la": "the"}
    confusables: {"lejos": { why: "Lejos is far, the opposite of cerca." }, "entre": { why: "Entre is between two things, a position." }}
  "es-0727":
    notes:
      "n1": "Location takes estar, not ser: el mercado está entre dos calles."
    native: "The market is between two streets."
    bases: {"El": "the"}
    confusables: {"norte": { why: "Norte is north, a direction on a map." }, "oeste": { why: "Oeste is west, a direction." }}
  "es-0728":
    notes:
      "n1": "Encuentro is encontrar, which changes its stem o to ue: encuentro, I find."
    native: "I find the map on the table."
    bases: {"el": "the", "en": "in", "la": "the"}
    confusables: {"cruce": { why: "Cruce is a crossing, a place in the street." }, "esquina": { why: "Esquina is a corner, not a table." }}
  "es-0729":
    notes:
      "n1": "Estar, not ser, for where a thing is: está a la izquierda, is on the left."
    native: "The bridge is on the left."
    bases: {"El": "the", "a": "to", "la": "the"}
    confusables: {"derecha": { why: "Derecha is right, the other side." }, "sur": { why: "Sur is south, a direction, not a side." }}
  "es-3280":
    notes:
      "n1": "Sigo is the first person of seguir, which is irregular: yo sigo, I keep on."
    native: "I keep straight on in the street."
    bases: {"en": "in", "la": "the"}
    confusables: {"esquina": { why: "Esquina is a corner, where two streets meet." }, "girar": { why: "Girar is to turn, not to keep going straight." }}
  "es-3289":
    notes:
      "n1": "Ustedes is you all; Spain uses vosotros for the informal plural."
    native: "You all live far from the station."
    bases: {"de": "from", "la": "the"}
    confusables: {"cerca": { why: "Cerca is near, the opposite of far." }, "parada": { why: "Parada is a stop, a place where a bus waits." }}
  "es-3287":
    notes:
      "n1": "Cerca takes de before what it is near, as in cerca de la esquina, near the corner."
    native: "My mother buys fruit near the corner."
    bases: {"de": "of", "la": "the"}
    confusables: {"lejos": { why: "Lejos is far, the opposite of near." }, "verdura": { why: "Verdura is vegetables, a different food." }}
  "es-3288":
    notes:
      "n1": "Llegar takes a before a place: llegamos a la esquina, we arrive at the corner."
    native: "Today we arrive at the corner."
    bases: {"a": "at", "la": "the"}
    confusables: {"llegada": { why: "Llegada is an arrival, a noun, not the act of arriving." }, "salida": { why: "Salida is a departure, the opposite." }}
  "es-3300":
    notes:
      "n1": "Question words take an accent, so dónde is written with one here, while donde without an accent does not ask a question."
    native: "Where do I buy a ticket near here?"
    bases: {"un": "a", "de": "of"}
    confusables: {"metro": { why: "Metro is the underground, another way to travel." }, "es-0674": { why: "Autobús is a bus, another way to travel." }}
  "es-3282":
    notes:
      "n1": "Norte is masculine, so it takes el: en el norte, in the north."
    native: "I live in the north."
    bases: {"en": "in", "el": "the"}
    confusables: {"sur": { why: "Sur is south, the opposite direction." }, "oeste": { why: "Oeste is west, another direction." }}
  "es-3295":
    notes:
      "n1": "Tomar el autobús works everywhere, while coger el autobús is common in Spain but rude in much of Latin America."
    native: "I take the bus in the south of the city."
    bases: {"el": "the", "en": "in", "de": "of", "la": "the"}
    confusables: {"norte": { why: "Norte is north, another direction." }, "oeste": { why: "Oeste is west, another direction." }}
  "es-3291":
    notes:
      "n1": "Location takes estar, not ser: el puente está lejos de la ciudad."
    native: "The bridge is far from the city."
    bases: {"El": "the", "de": "from", "la": "the"}
    confusables: {"es-0018": { why: "País is a country, a bigger place than a city." }, "es-0717": { why: "Cerca is near, the opposite of lejos, far." }}
  "es-3290":
    notes:
      "n1": "Siempre usually comes before its verb, as in siempre miro, I always look."
    native: "I always look at the traffic light."
    bases: {"el": "the"}
    confusables: {"cruce": { why: "Cruce is a crossing, a place where roads meet." }, "esquina": { why: "Esquina is a corner, where two streets meet." }}
  "es-3301":
    notes:
      "n1": "Quién asks who, about people, and takes a singular verb: quién espera."
    native: "Who is waiting for the bus at the stop?"
    bases: {"el": "the", "en": "at", "la": "the"}
    confusables: {"norte": { why: "Norte is north, a direction, not a place to wait." }, "es-0684": { why: "Estación is a station, a larger place for trains, not a bus stop." }}
  "es-3285":
    notes:
      "n1": "Ser says what a thing is like in general: es fácil, it is easy."
    native: "Turning to the right is easy."
    bases: {"a": "to", "la": "the"}
    confusables: {"izquierda": { why: "Izquierda is left, the other side." }, "entre": { why: "Entre is between two things, a position." }}
  "es-3297":
    notes:
      "n1": "Buscar means to look for and takes its object with no preposition: buscan la tienda."
    native: "They look for the shop near the office."
    bases: {"la": "the", "de": "of"}
    confusables: {"supermercado": { why: "Supermercado is a supermarket, a larger shop." }, "mercado": { why: "Mercado is a market with stalls, not a single shop." }}
  "es-3298":
    notes:
      "n1": "Trabajar takes en before a place, as in trabaja en el oeste, works in the west."
    native: "My brother works in the west."
    bases: {"en": "in", "el": "the"}
    confusables: {"norte": { why: "Norte is north, a direction, not a job." }, "trabajo": { why: "Trabajo is the job itself, a noun; trabaja is works, the verb." }}
  "es-3292":
    notes:
      "n1": "Mucho after a verb is an adverb that never changes its form: bailamos mucho."
    native: "We dance a lot near the stop."
    bases: {"de": "of", "la": "the"}
    confusables: {"cenar": { why: "Cenar is to have dinner, not to dance." }, "caminar": { why: "Caminar is to walk, a way of moving." }}
  "es-3302":
    notes:
      "n1": "Cuesta is costar, which changes its stem o to ue: cuesta, it costs."
    native: "How much does the taxi near the station cost?"
    bases: {"el": "the", "de": "of", "la": "the"}
    confusables: {"precio": { why: "Precio is a price, the amount asked for something." }, "cambio": { why: "Cambio is change, the money handed back." }}
  "es-3284":
    notes:
      "n1": "A la izquierda means to the left, with a before the article la, just as a la derecha does."
    native: "We take the street to the left."
    bases: {"la": "the", "a": "to"}
    confusables: {"derecha": { why: "Derecha is right, the other side." }, "recto": { why: "Recto is straight ahead, with no turn." }}
  "es-3293":
    notes:
      "n1": "Lea is the usted command of leer, to read: lea, read (to a stranger). To a friend say lee."
    native: "Read the map, please."
    bases: {"el": "the", "por": "for", "favor": "favour"}
    confusables: {"libro": { why: "Libro is a book, not a map." }, "escribir": { why: "Escribir is to write, the opposite of read." }}
  "es-3286":
    notes:
      "n1": "No goes before the verb to make it negative: no busco, I am not looking for."
    native: "I am not looking for the crossing."
    bases: {"el": "the"}
    confusables: {"mapa": { why: "Mapa is a map, a paper for finding the way." }, "esquina": { why: "Esquina is a corner, where two streets meet." }}
  "es-3296":
    notes:
      "n1": "A la derecha de means to the right of, with de before the thing it is measured from."
    native: "We have the table to the right of the window."
    bases: {"la": "the", "a": "to", "de": "of"}
    confusables: {"izquierda": { why: "Izquierda is left, the other side of the table." }, "entre": { why: "Entre is between two things, a position." }}
  "es-3303":
    notes:
      "n1": "Por qué written as two words asks why; porque, one word, means because."
    native: "Why don't you look at the traffic light?"
    bases: {"Por": "for", "el": "the"}
    confusables: {"mapa": { why: "Mapa is a map, not a light." }, "cruce": { why: "Cruce is a crossing, a place where roads meet." }}
  "es-3281":
    notes:
      "n1": "Cada is invariable and takes a singular noun, as in cada día, every day."
    native: "I cross the bridge every day."
    bases: {"el": "the"}
    confusables: {"cruce": { why: "Cruce is a crossing, the place, not the act of crossing." }, "esquina": { why: "Esquina is a corner, where two streets meet." }}
  "es-3294":
    notes:
      "n1": "Usted takes the third-person verb form: usted cocina, you cook (the formal you)."
    native: "You cook at home, but I eat nearby."
    bases: {"en": "at"}
    confusables: {"beber": { why: "Beber is to drink, not to eat." }, "desayunar": { why: "Desayunar is to have breakfast, a meal in the morning." }}
  "es-3283":
    notes:
      "n1": "Usar takes its object with no preposition: usamos el mapa, we use the map."
    native: "We use the map at the crossing."
    bases: {"el": "the", "en": "at"}
    confusables: {"es-0707": { why: "Semáforo is a traffic light, a signal on the road." }, "puente": { why: "Puente is a bridge, a structure over a road or river." }}
  "es-3299":
    notes:
      "n1": "Pedir changes e to i in most forms, but not in the we form: pedimos."
    native: "We order coffee and tea near the shop."
    bases: {"de": "of", "la": "the"}
    confusables: {"zumo": { why: "Zumo is juice, a cold drink, not a hot one." }, "bebida": { why: "Bebida is a drink, a general word." }}
  "es-3304":
    notes:
      "n1": "Usted takes the third-person verb form: ¿trabaja usted?, do you work? (the formal you)."
    native: "Do you work in the north?"
    bases: {"en": "in", "el": "the"}
    confusables: {"sur": { why: "Sur is south, a direction, the opposite." }, "oeste": { why: "Oeste is west, another direction." }}
  "es-4603":
    notes:
      "n1": "Siga is the usted command of seguir, to go on; the tu form is sigue."
    native: "Keep going straight, please."
    bases: {"por": "for", "favor": "please"}
    confusables: {"girar": { why: "Girar is to turn, a change of direction." }, "cruzar": { why: "Cruzar is to cross, to get to the other side." }}
