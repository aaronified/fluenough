description: "Six sentences about work and the office, with the words each is often mixed up with. Not yet checked by a Spanish speaker: please report any mistake."
cards:
  "es-1883":
    native: "I sign the contract and start on Monday."
    bases: { "el": "the" }
    confusables: { "nomina": { why: "Nómina is the payslip, the pay each month." }, "puesto": { why: "Puesto is the job position, the role you have." } }
  "es-1884":
    native: "The director presents the report at the meeting."
    bases: { "El": "the", "en": "in", "la": "the" }
    confusables: { "organizar": { why: "Organizar is to set up the meeting, before it." }, "discutir": { why: "Discutir is to discuss the report, a later step." } }
  "es-1885":
    native: "I work part time in the factory."
    bases: { "a": "to", "en": "in", "la": "the", "tiempo": "time" }
    confusables: { "completo": { why: "Completo is full, the opposite of parcial." }, "taller": { why: "Taller is a workshop, a smaller place of work." } }
  "es-1886":
    native: "My boss hires two workers."
    bases: { "jefa": "boss (f)", "a": "to" }
    confusables: { "despedir": { why: "Despedir is to fire, the opposite of hiring." }, "empresario": { why: "Empresario is a businessman who owns a company." } }
  "es-1887":
    native: "The business closes at six."
    bases: { "El": "the", "a": "to", "las": "the" }
    confusables: { "almacen": { why: "Almacén is a warehouse, a store for goods." }, "compania": { why: "Compañía is a company, a larger firm." } }
  "es-1888":
    native: "I retire at sixty."
    bases: { "Me": "to me", "a": "to", "los": "the" }
    confusables: { "dimitir": { why: "Dimitir is to resign, earlier than retiring." }, "permiso": { why: "Permiso is leave or permission, a short break." } }
