description: "Words for sport: the goal and the goalkeeper, the referee and the players, the score and the win, the defeat and the draw, the stadium and the track, the medal and the record, and the verbs to jump, throw and compete. Not yet checked by a Spanish speaker: please report any mistake."
cards:
