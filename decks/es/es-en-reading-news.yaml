    title: "A list of newspaper headlines"
    theme: "news"
    sentences:
      - text: "Titular: la ciudad tiene un puente nuevo."
      - text: "Huelga de trenes el martes."
      - text: "Encuesta: la mayoría prefiere el tren."
      - text: "Elecciones en mayo: los candidatos hablan."
    questions:
      - id: "es-2098"
        prompt: { en: "What is the headline about the bridge?" }
