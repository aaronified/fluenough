      - id: "es-2099"
        prompt: { en: "When is the train strike?" }
        options:
          - { en: "Monday" }
          - { en: "Tuesday" }
          - { en: "Wednesday" }
        answer: 2
      - id: "es-2100"
        prompt: { en: "What does the poll show?" }
        options:
          - { en: "Most prefer the train" }
          - { en: "Most prefer the car" }
          - { en: "Nobody votes" }
        answer: 1
  - id: "es-radio-bulletin"
    title: "A radio bulletin"
    theme: "news"
    sentences:
      - text: "Buenas noches, esta es la noticia de hoy."
      - text: "Un incendio en el bosque obliga a salir a los vecinos."
      - text: "El presidente anuncia una nueva ley."
      - text: "Mañana habrá una manifestación en el centro."
    questions:
      - id: "es-2101"
        prompt: { en: "What happened in the forest?" }
