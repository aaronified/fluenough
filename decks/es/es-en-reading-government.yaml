          - { en: "A photo of the house" }
          - { en: "A receipt" }
        answer: 1
      - id: "es-2305"
        prompt: { en: "Where is the form handed in?" }
        options:
          - { en: "At the last page" }
          - { en: "At the counter" }
          - { en: "By email" }
        answer: 2
