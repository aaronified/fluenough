    "reading": "nava paścātātsthivimanta āyandaśa prāksānu vi tirantyaśnaḥ"
    "ipa": "nəʋə pəʃtʃaːt̪aːt̪st̪ʰiʋimənt̪ə aːjənd̪əʃə praːksaːnu ʋi t̪irənt̪jəʃnəh"
