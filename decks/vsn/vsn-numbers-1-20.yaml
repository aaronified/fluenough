    "kind": "behaviour"
  "bases": "self"
  "examples":
  - "target": "नि गव्यवोऽनवो द्रुह्यवश्च षष्टिः शता सुषुपुः षट् सहस्रा"
    "reading": "ni gavyavo'navo druhyavaśca ṣaṣṭiḥ śatā suṣupuḥ ṣaṭ sahasrā"
    "ipa": "ni ɡəʋjəʋoːnəʋoː d̪ruɦjəʋəʃtʃə ʂəʂʈih ʃət̪aː suʂupuh ʂəʈ səɦəsraː"
    "source": "RV 7.18.14, sa.wikisource hymn 7.18; Griffith 7.18"
    "bases":
    - "word": "षट्"
      "base": "षष्"
      "reading": "ṣaṣ"
