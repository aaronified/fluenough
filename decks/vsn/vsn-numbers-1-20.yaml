  "examples":
  - "target": "त्रयः कोशास श्चोतन्ति तिस्रश्चम्वः सुपूर्णाः"
    "reading": "trayaḥ kośāsa ścotanti tisraścamvaḥ supūrṇāḥ"
    "ipa": "t̪rəjəh koːʃaːsə ʃtʃoːt̪ənt̪i t̪isrəʃtʃəmʋəh supuːrɳaːh"
    "source": "RV 8.2.8, sa.wikisource hymn 8.2; Griffith 8.2"
- "id": "vsn-1034"
