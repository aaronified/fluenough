    "reading": "catvāro mā paijavanasya dānāḥ smaddiṣṭayaḥ kṛśanino nireke"
    "ipa": "tʃət̪ʋaːroː maː paːidʒəʋənəsjə d̪aːnaːh sməd̪d̪iʂʈəjəh kr̩ʃəninoː nireːkeː"
    "source": "RV 7.18.23, sa.wikisource hymn 7.18; Griffith 7.18"
