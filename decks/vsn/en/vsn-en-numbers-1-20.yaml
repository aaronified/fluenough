name: "Numbers three to twelve"
description: "Ten number words from three to twelve, each with a line from the Rigveda. One and two are in the first words. Vedic Sanskrit in Devanagari; each reading is based on ISO 15919 and the pronunciation is reconstructed. Not yet checked by a Vedicist: please report any mistake."
license: "CC-BY-SA-4.0"
tags:
- "unreviewed"
cards:
  "vsn-1033":
    "native": "three"
    "notes":
      "n1": "Only the first four numerals show gender (Whitney, section 482). This verse has त्रयः (trayaḥ), the masculine form."
    "examples":
      "त्रयः कोशास श्चोतन्ति तिस्रश्चम्वः सुपूर्णाः":
        "native": "Three reservoirs let their drops run; three beakers are filled to the brim."
  "vsn-1034":
    "native": "four"
    "notes":
      "n1": "This verse writes चत्वारो (catvāro) for चत्वारः (catvāraḥ). Its stem is चतुर् (catur). Only the first four numerals show gender (Whitney, section 482)."
    "examples":
      "चत्वारो मा पैजवनस्य दानाः स्मद्दिष्टयः कृशनिनो निरेके":
        "native": "Four horses, a gift from Paijavana, bear me to the front."
        "bases":
          "चत्वारो": "four"
  "vsn-1035":
    "native": "five"
    "notes":
      "n1": "Numbers from five to nineteen have no gender and show their bare stem in the nominative and accusative (Whitney, section 483). The stem here is पञ्चन् (pañcan)."
    "examples":
      "अधि पञ्च प्रधीँरिव":
        "native": "Over five, like the rims of a chariot."
        "bases":
          "पञ्च": "five"
  "vsn-1036":
    "native": "six"
    "notes":
      "n1": "Numbers from five to nineteen show their bare stem (Whitney, section 483). The stem here is षष् (ṣaṣ)."
    "examples":
      "नि गव्यवोऽनवो द्रुह्यवश्च षष्टिः शता सुषुपुः षट् सहस्रा":
        "native": "Sixty hundred, yes, six thousand, have fallen asleep."
        "bases":
          "षट्": "six"
  "vsn-1037":
    "native": "seven"
    "notes":
      "n1": "Numbers from five to nineteen show their bare stem (Whitney, section 483). The stem here is सप्तन् (saptan)."
    "examples":
      "ऋषीणां सप्त धीतिभिः":
        "native": "With the holy songs of the seven seers."
        "bases":
          "सप्त": "seven"
  "vsn-1038":
    "native": "eight"
    "notes":
      "n1": "Numbers from five to nineteen show a bare stem, and aṣṭá has an older longer form अष्टा (aṣṭā) (Whitney, section 483). This verse has अष्टौ (aṣṭau); its stem is अष्टन् (aṣṭan)."
    "examples":
      "अष्टौ पुत्रासो अदितेर्ये जातास्तन्वस्परि":
        "native": "Eight sons of Aditi, who were born from her body."
        "bases":
          "अष्टौ": "eight"
  "vsn-1039":
    "native": "nine"
    "notes":
      "n1": "Numbers from five to nineteen show their bare stem (Whitney, section 483). The stem here is नवन् (navan)."
    "examples":
      "नव पश्चातात्स्थिविमन्त आयन्दश प्राक्सानु वि तिरन्त्यश्नः":
        "native": "Nine came from behind, ten from in front, over the ridges of the rock."
        "bases":
          "नव": "nine"
  "vsn-1040":
    "native": "ten"
    "notes":
      "n1": "Numbers from five to nineteen show their bare stem (Whitney, section 483). The stem here is दशन् (daśan)."
    "examples":
      "दश ते कलशानां हिरण्यानामधीमहि":
        "native": "We have obtained, as your gift, ten water-jars of gold."
        "bases":
          "दश": "ten"
  "vsn-1041":
    "native": "twelve"
    "notes":
      "n1": "Numbers from five to nineteen show their bare stem (Whitney, section 483). The stem here is द्वादशन् (dvādaśan)."
    "examples":
      "द्वादश द्यून्यदगोह्यस्यातिथ्ये रणन्नृभवः ससन्तः":
        "native": "For twelve days the Rbhus rejoiced as guests of him who cannot be hidden."
        "bases":
          "द्वादश": "twelve"
  "vsn-1042":
    "native": "eleven (the Thrice-Eleven)"
    "notes":
      "n1": "Eleven is attested only in this verse, as the Vedic nominative plural एकादशासः (ekādaśāsaḥ), 'the Thrice-Eleven' (Rigveda 9.92.4). The form is taught as the verse has it."
    "bases":
      "एकादशासः": "eleven (plural)"
    "examples":
      "तव त्ये सोम पवमान निण्ये विश्वे देवास्त्रय एकादशासः":
        "native": "In your secret place, O Soma, are all the gods, three times eleven."
        "bases":
          "एकादशासः": "eleven"
