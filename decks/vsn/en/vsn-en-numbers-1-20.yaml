cards:
  "vsn-1033":
    "native": "three"
    "notes":
      "n1": "Only the first four numerals show gender (Whitney, section 482). This verse has त्रयः (trayaḥ), the masculine form."
      "attested": "Attested: त्रयः कोशास श्चोतन्ति तिस्रश्चम्वः सुपूर्णाः (trayaḥ kośāsa ścotanti tisraścamvaḥ supūrṇāḥ), RV 8.2.8. Three reservoirs let their drops run; three beakers are filled to the brim."
  "vsn-1034":
    "native": "four"
    "notes":
      "n1": "This verse writes चत्वारो (catvāro) for चत्वारः (catvāraḥ). Its stem is चतुर् (catur). Only the first four numerals show gender (Whitney, section 482)."
      "attested": "Attested: चत्वारो मा पैजवनस्य दानाः स्मद्दिष्टयः कृशनिनो निरेके (catvāro mā paijavanasya dānāḥ smaddiṣṭayaḥ kṛśanino nireke), RV 7.18.23. Four horses, a gift from Paijavana, bear me to the front."
  "vsn-1035":
    "native": "five"
    "notes":
      "n1": "Numbers from five to nineteen have no gender and show their bare stem in the nominative and accusative (Whitney, section 483). The stem here is पञ्चन् (pañcan)."
      "attested": "Attested: अधि पञ्च प्रधीँरिव (adhi pañca pradhīm̐riva), RV 4.30.15. Over five, like the rims of a chariot."
  "vsn-1036":
    "native": "six"
    "notes":
      "n1": "Numbers from five to nineteen show their bare stem (Whitney, section 483). The stem here is षष् (ṣaṣ)."
      "attested": "Attested: नि गव्यवोऽनवो द्रुह्यवश्च षष्टिः शता सुषुपुः षट् सहस्रा (ni gavyavo'navo druhyavaśca ṣaṣṭiḥ śatā suṣupuḥ ṣaṭ sahasrā), RV 7.18.14. Sixty hundred, yes, six thousand, have fallen asleep."
  "vsn-1037":
    "native": "seven"
    "notes":
      "n1": "Numbers from five to nineteen show their bare stem (Whitney, section 483). The stem here is सप्तन् (saptan)."
      "attested": "Attested: ऋषीणां सप्त धीतिभिः (ṛṣīṇāṃ sapta dhītibhiḥ), RV 9.62.17. With the holy songs of the seven seers."
  "vsn-1038":
    "native": "eight"
    "notes":
      "n1": "Numbers from five to nineteen show a bare stem, and aṣṭá has an older longer form अष्टा (aṣṭā) (Whitney, section 483). This verse has अष्टौ (aṣṭau); its stem is अष्टन् (aṣṭan)."
      "attested": "Attested: अष्टौ पुत्रासो अदितेर्ये जातास्तन्वस्परि (aṣṭau putrāso aditerye jātāstanvaspari), RV 10.72.8. Eight sons of Aditi, who were born from her body."
  "vsn-1039":
    "native": "nine"
    "notes":
      "n1": "Numbers from five to nineteen show their bare stem (Whitney, section 483). The stem here is नवन् (navan)."
      "attested": "Attested: नव पश्चातात्स्थिविमन्त आयन्दश प्राक्सानु वि तिरन्त्यश्नः (nava paścātātsthivimanta āyandaśa prāksānu vi tirantyaśnaḥ), RV 10.27.15. Nine came from behind, ten from in front, over the ridges of the rock."
  "vsn-1040":
    "native": "ten"
    "notes":
      "n1": "Numbers from five to nineteen show their bare stem (Whitney, section 483). The stem here is दशन् (daśan)."
      "attested": "Attested: दश ते कलशानां हिरण्यानामधीमहि (daśa te kalaśānāṃ hiraṇyānāmadhīmahi), RV 4.32.19. We have obtained, as your gift, ten water-jars of gold."
  "vsn-1041":
    "native": "twelve"
    "notes":
      "n1": "Numbers from five to nineteen show their bare stem (Whitney, section 483). The stem here is द्वादशन् (dvādaśan)."
      "attested": "Attested: द्वादश द्यून्यदगोह्यस्यातिथ्ये रणन्नृभवः ससन्तः (dvādaśa dyūnyadagohyasyātithye raṇannṛbhavaḥ sasantaḥ), RV 4.33.7. For twelve days the Rbhus rejoiced as guests of him who cannot be hidden."
  "vsn-1042":
    "native": "eleven (the Thrice-Eleven)"
    "notes":
      "n1": "Eleven is attested only in this verse, as the Vedic nominative plural एकादशासः (ekādaśāsaḥ), 'the Thrice-Eleven' (Rigveda 9.92.4). The form is taught as the verse has it."
      "attested": "Attested: तव त्ये सोम पवमान निण्ये विश्वे देवास्त्रय एकादशासः (tava tye soma pavamāna niṇye viśve devāstraya ekādaśāsaḥ), RV 9.92.4. In your secret place, O Soma, are all the gods, three times eleven."
    "bases":
      "एकादशासः": "eleven (plural)"
