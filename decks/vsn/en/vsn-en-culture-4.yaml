"name": "Culture: the four Vedas"
"description": "The four Vedas, named in Vedic Sanskrit: the Rigveda, the Samaveda, the Yajurveda and the Atharvaveda, each with its size and date. Not yet checked by a Vedicist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "vsn-6200":
    "native": "The Rigveda, the oldest of the four Vedas, has 1,028 hymns in ten books."
    "notes":
      "n1": "The Rigveda has ten books (mandalas), 1,028 hymns and about 10,600 verses. Books 2 to 7 are the oldest; books 1 and 10 are the youngest and have 191 hymns each. The Veda's name is ऋग्वेदः (ṛgvedaḥ) and its verses are called ऋक् (ṛk)."
    "bases":
      "ऋग्वेदः": { "meaning": "the Rigveda" }
  "vsn-6201":
    "native": "The Samaveda is a liturgical text of 1,875 verses."
    "notes":
      "n1": "Its verses are the liturgical text of the Samaveda, 1,875 verses in all. With its Samhita layer come Brahmana texts, and a last layer of philosophical speculation, the Upanishads."
    "bases":
      "सामवेदः": { "meaning": "the Samaveda" }
  "vsn-6202":
    "native": "The Yajurveda is a compilation of ritual-offering formulas said by a priest."
    "notes":
      "n1": "Its formulas were said by the priest during the offering ritual. Michael Witzel estimates its composition at 1200 to 800 BCE; the exact date is unknown."
    "bases":
      "यजुर्वेदः": { "meaning": "the Yajurveda" }
  "vsn-6203":
    "native": "The Atharvaveda has 730 hymns and about 6,000 mantras in 20 books."
    "notes":
      "n1": "It is called a late addition to the Vedic scriptures. It was compiled about the same time as the Samaveda and the Yajurveda, around 1200 to 1000 BCE."
    "bases":
      "अथर्ववेदः": { "meaning": "the Atharvaveda" }
