native:
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
name: "Pronouns and people words"
description: "Sixteen words for this and that, we and you, and people: each with a line from the Rigveda. Vedic Sanskrit in Devanagari; each reading is based on ISO 15919 and the pronunciation is reconstructed. Not yet checked by a Vedicist: please report any mistake."
license: "CC-BY-SA-4.0"
tags:
- "unreviewed"
cards:
  "vsn-1005":
    "native": "we"
    "notes":
      "n1": "First and second person pronouns have no gender (Whitney, section 491). The stem is अस्मद् (asmad). This verse writes वयं (vayaṃ), with the anusvara for final m, for the headword वयम् (vayam)."
      "n2": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove."
      "attested": "Attested: वयं गीर्भिर्विपन्यवः (vayaṃ gīrbhirvipanyavaḥ), RV 8.22.11. We, who praise with songs, invoke the Asvins."
  "vsn-1006":
    "native": "you (plural)"
    "notes":
      "n1": "The second person plural pronoun has no gender (Whitney, section 491). Its stem is युष्मद् (yuṣmad). This verse writes यूयं (yūyaṃ) for the headword यूयम् (yūyam)."
      "n2": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove."
      "attested": "Attested: यूयं सखायः सप्तयः (yūyaṃ sakhāyaḥ saptayaḥ), RV 8.20.23. You, friends, swift steeds."
  "vsn-1007":
    "native": "he, that"
    "notes":
      "n1": "Masculine of the demonstrative ta-, stem तद् (tad). The s is lost before a consonant, as in स (sa) ददर्श (dadarśa) (Whitney, section 495 a); this verse writes स (sa) for सः (saḥ)."
      "n2": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove."
      "attested": "Attested: स देवान्विश्वान्बिभर्ति (sa devānviśvānbibharti), RV 3.59.8. He sustains all the gods."
  "vsn-1008":
    "native": "she, that"
    "notes":
      "n1": "Feminine of the demonstrative ta-, stem तद् (tad), with nominative सा (sā) (Whitney, section 495 a)."
      "n2": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove."
      "attested": "Attested: ऋतस्य सा पयसापिन्वतेळा महद्देवानामसुरत्वमेकम् (ṛtasya sā payasāpinvateḷā mahaddevānāmasuratvamekam), RV 3.55.13. This Ila streams with the milk of Order."
  "vsn-1009":
    "native": "that, it"
    "notes":
      "n1": "Neuter of the demonstrative ta-, with nominative and accusative तत् (tat) (Whitney, section 495 a)."
      "n2": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove."
      "attested": "Attested: दधन्वे वा यदीमनु वोचद्ब्रह्माणि वेरु तत् (dadhanve vā yadīmanu vocadbrahmāṇi veru tat), RV 2.5.3. He holds all that knowledge in his grasp."
  "vsn-1010":
    "native": "this"
    "notes":
      "n1": "Masculine of the demonstrative eta-, stem एतद् (etad). Like सः (saḥ), its s is lost before a consonant, as in एषः (eṣaḥ) (Whitney, section 495 a); this verse writes एष (eṣa) for एषः (eṣaḥ)."
      "n2": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove."
      "attested": "Attested: एष वृषा कनिक्रदद्दशभिर्जामिभिर्यतः (eṣa vṛṣā kanikradaddaśabhirjāmibhiryataḥ), RV 9.28.4. This bull, bellowing, is driven by the ten sisters."
  "vsn-1011":
    "native": "this"
    "notes":
      "n1": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove. This verse writes अयं (ayaṃ) for अयम् (ayam)."
      "attested": "Attested: अयं विदच्चित्रदृशीकमर्णः शुक्रसद्मनामुषसामनीके (ayaṃ vidaccitradṛśīkamarṇaḥ śukrasadmanāmuṣasāmanīke), RV 6.47.5. He found the wavy sea of bright colours, before the dawns."
  "vsn-1012":
    "native": "this"
    "notes":
      "n1": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove. This verse writes इदं (idaṃ) for इदम् (idam)."
      "attested": "Attested: इदं नो बर्हिरासदे (idaṃ no barhirāsade), RV 1.13.7. Here, to sit on this holy grass of ours."
  "vsn-1013":
    "native": "who, which"
    "notes":
      "n1": "The stem ya- is a relative only: यः (yaḥ), यत् (yat), या (yā) (Whitney, sections 508 to 509). This verse writes यो (yo) for यः (yaḥ)."
      "n2": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove."
      "attested": "Attested: यो अस्मभ्यमरावा (yo asmabhyamarāvā), RV 9.21.5. The one who is ungenerous to us."
  "vsn-1014":
    "native": "which, that which"
    "notes":
      "n1": "Neuter of the relative ya-, which is a relative only (Whitney, sections 508 to 509)."
      "n2": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove."
      "attested": "Attested: स्पार्हा भवन्ति रन्तयो जुषन्त यत् (spārhā bhavanti rantayo juṣanta yat), RV 9.102.5. They are worth envying, and they enjoy what pleases them."
  "vsn-1015":
    "native": "other"
    "notes":
      "n1": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove. This verse writes अन्यो (anyo) for अन्यः (anyaḥ), as the Rigveda does before a sonant."
      "attested": "Attested: अन्यो नेत्सूरिरोहते भूरिदावत्तरो जनः (anyo netsūrirohate bhūridāvattaro janaḥ), RV 8.5.39. No other patron climbs up, and no people is more generous."
  "vsn-1016":
    "native": "oneself"
    "notes":
      "n1": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove. This verse writes स्वयं (svayaṃ) for स्वयम् (svayam)."
      "attested": "Attested: स्वयं कविर्विधर्तरि विप्राय रत्नमिच्छति (svayaṃ kavirvidhartari viprāya ratnamicchati), RV 9.47.4. The poet himself desires treasure for the sage."
  "vsn-1017":
    "native": "person, people"
    "notes":
      "n1": "This verse writes जनो (jano) for जनः (janaḥ), as the Rigveda writes -o for -aḥ before a sonant."
      "attested": "Attested: यो न इन्द्राभितो जनो वृकायुरादिदेशति (yo na indrābhito jano vṛkāyurādideśati), RV 10.133.4. The wolf-minded people round about us point us out, Indra."
  "vsn-1018":
    "native": "man"
    "notes":
      "n1": "This verse writes नरो (naro) for नरः (naraḥ), as the Rigveda writes -o for -aḥ before a sonant."
      "attested": "Attested: सजोषस्त्वा दिवो नरो यज्ञस्य केतुमिन्धते (sajoṣastvā divo naro yajñasya ketumindhate), RV 6.2.3. Together the men of heaven kindle you, the sign of the sacrifice."
  "vsn-1019":
    "native": "mortal"
    "notes":
      "attested": "Attested: सदा देवस्य मर्त्यः (sadā devasya martyaḥ), RV 8.19.28. A mortal, always with a god to help."
  "vsn-1020":
    "native": "man, human"
    "notes":
      "n1": "In this verse the word describes a chariot, friendly to mankind, not a person (Griffith's English of this verse, RV 2.18.1)."
      "attested": "Attested: दशारित्रो मनुष्यः स्वर्षाः स इष्टिभिर्मतिभी रंह्यो भूत् (daśāritro manuṣyaḥ svarṣāḥ sa iṣṭibhirmatibhī raṃhyo bhūt), RV 2.18.1. Ten-sided, friendly to mankind, light-winning, it must be urged on with prayers."
