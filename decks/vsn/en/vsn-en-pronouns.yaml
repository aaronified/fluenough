native:
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
name: "Pronouns and people words"
description: "Sixteen words for this and that, we and you, and people: each with a line from the Rigveda. Vedic Sanskrit in Devanagari; each reading is based on ISO 15919 and the pronunciation is reconstructed. Not yet checked by a Vedicist: please report any mistake."
license: "CC-BY-SA-4.0"
tags:
- "unreviewed"
cards:
  "vsn-1005":
    "native": "we"
    "notes":
      "n1": "First and second person pronouns have no gender (Whitney, section 491). The stem is अस्मद् (asmad). This verse writes वयं (vayaṃ), with the anusvara for final m, for the headword वयम् (vayam)."
      "n2": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove."
    "examples":
      "वयं गीर्भिर्विपन्यवः":
        "native": "We, who praise with songs, invoke the Asvins."
        "bases":
          "वयं": "we"
  "vsn-1006":
    "native": "you (plural)"
    "notes":
      "n1": "The second person plural pronoun has no gender (Whitney, section 491). Its stem is युष्मद् (yuṣmad). This verse writes यूयं (yūyaṃ) for the headword यूयम् (yūyam)."
      "n2": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove."
    "examples":
      "यूयं सखायः सप्तयः":
        "native": "You, friends, swift steeds."
        "bases":
          "यूयं": "you (plural)"
  "vsn-1007":
    "native": "he, that"
    "notes":
      "n1": "Masculine of the demonstrative ta-, stem तद् (tad). The s is lost before a consonant, as in sa dadarça (Whitney, section 495 a); this verse writes स (sa) for सः (saḥ)."
      "n2": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove."
    "examples":
      "स देवान्विश्वान्बिभर्ति":
        "native": "He sustains all the gods."
        "bases":
          "स": "he"
  "vsn-1008":
    "native": "she, that"
    "notes":
      "n1": "Feminine of the demonstrative ta-, stem तद् (tad), with nominative सा (sā) (Whitney, section 495 a)."
      "n2": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove."
    "examples":
      "ऋतस्य सा पयसापिन्वतेळा महद्देवानामसुरत्वमेकम्":
        "native": "This Ila streams with the milk of Order."
        "bases":
          "सा": "she"
  "vsn-1009":
    "native": "that, it"
    "notes":
      "n1": "Neuter of the demonstrative ta-, with nominative and accusative तत् (tat) (Whitney, section 495 a)."
      "n2": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove."
    "examples":
      "दधन्वे वा यदीमनु वोचद्ब्रह्माणि वेरु तत्":
        "native": "He holds all that knowledge in his grasp."
  "vsn-1010":
    "native": "this"
    "notes":
      "n1": "Masculine of the demonstrative eta-, stem एतद् (etad). Like sás, its s is lost before a consonant, as in eṣás (Whitney, section 495 a); this verse writes एष (eṣa) for एषः (eṣaḥ)."
      "n2": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove."
    "examples":
      "एष वृषा कनिक्रदद्दशभिर्जामिभिर्यतः":
        "native": "This bull, bellowing, is driven by the ten sisters."
        "bases":
          "एष": "this"
  "vsn-1011":
    "native": "this"
    "notes":
      "n1": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove. This verse writes अयं (ayaṃ) for अयम् (ayam)."
    "examples":
      "अयं विदच्चित्रदृशीकमर्णः शुक्रसद्मनामुषसामनीके":
        "native": "He found the wavy sea of bright colours, before the dawns."
        "bases":
          "अयं": "this"
  "vsn-1012":
    "native": "this"
    "notes":
      "n1": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove. This verse writes इदं (idaṃ) for इदम् (idam)."
    "examples":
      "इदं नो बर्हिरासदे":
        "native": "Here, to sit on this holy grass of ours."
        "bases":
          "इदं": "this"
  "vsn-1013":
    "native": "who, which"
    "notes":
      "n1": "The stem ya- is a relative only: यः (yaḥ), यत् (yat), या (yā) (Whitney, sections 508 to 509). This verse writes यो (yo) for यः (yaḥ)."
      "n2": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove."
    "examples":
      "यो अस्मभ्यमरावा":
        "native": "The one who is ungenerous to us."
        "bases":
          "यो": "who"
  "vsn-1014":
    "native": "which, that which"
    "notes":
      "n1": "Neuter of the relative ya-, which is a relative only (Whitney, sections 508 to 509)."
      "n2": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove."
    "examples":
      "स्पार्हा भवन्ति रन्तयो जुषन्त यत्":
        "native": "They are worth envying, and they enjoy what pleases them."
  "vsn-1015":
    "native": "other"
    "notes":
      "n1": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove. This verse writes अन्यो (anyo) for अन्यः (anyaḥ), as the Rigveda does before a sonant."
    "examples":
      "अन्यो नेत्सूरिरोहते भूरिदावत्तरो जनः":
        "native": "No other patron climbs up, and no people is more generous."
        "bases":
          "अन्यो": "other"
  "vsn-1016":
    "native": "oneself"
    "notes":
      "n1": "The verse attests this word, but its meaning is the word's ordinary sense, which the verse does not prove. This verse writes स्वयं (svayaṃ) for स्वयम् (svayam)."
    "examples":
      "स्वयं कविर्विधर्तरि विप्राय रत्नमिच्छति":
        "native": "The poet himself desires treasure for the sage."
  "vsn-1017":
    "native": "person, people"
    "notes":
      "n1": "This verse writes जनो (jano) for जनः (janaḥ), as the Rigveda writes -o for -aḥ before a sonant."
    "examples":
      "यो न इन्द्राभितो जनो वृकायुरादिदेशति":
        "native": "The wolf-minded people round about us point us out, Indra."
        "bases":
          "यो": "who"
          "जनो": "people"
  "vsn-1018":
    "native": "man"
    "notes":
      "n1": "This verse writes नरो (naro) for नरः (naraḥ), as the Rigveda writes -o for -aḥ before a sonant."
    "examples":
      "सजोषस्त्वा दिवो नरो यज्ञस्य केतुमिन्धते":
        "native": "Together the men of heaven kindle you, the sign of the sacrifice."
        "bases":
          "नरो": "men"
  "vsn-1019":
    "native": "mortal"
    "examples":
      "सदा देवस्य मर्त्यः":
        "native": "A mortal, always with a god to help."
        "bases":
          "देवस्य": "of a god"
  "vsn-1020":
    "native": "man, human"
    "notes":
      "n1": "In this verse the word describes a chariot, friendly to mankind, not a person (Griffith's English of this verse, RV 2.18.1)."
    "examples":
      "दशारित्रो मनुष्यः स्वर्षाः स इष्टिभिर्मतिभी रंह्यो भूत्":
        "native": "Ten-sided, friendly to mankind, light-winning, it must be urged on with prayers."
        "bases":
          "स": "it"
