"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Gods"
"description": "Eighteen gods of the Rigveda, each with its Griffith-based English line from the hymn. Not yet checked by a Vedicist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "vsn-1316":
    "native": "Indra"
    "notes":
      "n1": "The line writes इन्द्रो (indro) (indro) for इन्द्रः (indraḥ) before a sonant: a final -as becomes -o before a sonant (Whitney §175a). In this verse Indra cleaves Vala, as Griffith has it."
    "examples":
      "इन्द्रो यदभिनद्वलम्":
        "native": "Indra cleft Vala apart."
        "bases":
          "इन्द्रो": "Indra"
  "vsn-1317":
    "native": "Varuna"
    "notes":
      "n1": "In this verse Varuna is named beside Indra, and Griffith calls both 'Powers who merit highest laud'."
    "examples":
      "इन्द्रः सहस्रदाव्नां वरुणः शंस्यानाम्":
        "native": "Indra and Varuna, givers of thousands, deserve praise."
        "bases":
          "इन्द्रः": "Indra"
          "सहस्रदाव्नां": "of the givers of thousands"
          "वरुणः": "Varuna"
          "शंस्यानाम्": "of those to be praised"
  "vsn-1318":
    "native": "Vayu, the wind-god"
    "notes":
      "n1": "In this verse Griffith calls Vayu 'Soma's guardian God'. The line's मास (māsa) (māsa) is the moon, which Griffith says shapes the years."
    "examples":
      "वायुः सोमस्य रक्षिता समानां मास आकृतिः":
        "native": "Vayu is Soma's guardian, and the moon is what shapes the years."
        "bases":
          "वायुः": "Vayu"
          "सोमस्य": "of Soma"
          "रक्षिता": "guardian"
          "समानां": "of the years"
          "आकृतिः": "shape"
  "vsn-1319":
    "native": "Vishnu"
    "notes":
      "n1": "In this verse Vishnu unbars the stable of the kine with his friend, as Griffith has it. The form is the nominative singular of the stem विष्णु (viṣṇu) (viṣṇu)."
    "examples":
      "दाधार दक्षमुत्तममहर्विदं व्रजं च विष्णुः सखिवाँ अपोर्णुते":
        "native": "Vishnu holds the highest might and opens the cattle-stall."
        "bases":
          "दाधार": "holds fast (has held)"
          "व्रजं": "stable"
          "च": "and"
  "vsn-1320":
    "native": "Rudra"
    "notes":
      "n1": "The line writes रुद्रो (rudro) (rudro) for रुद्रः (rudraḥ) before a sonant (Whitney §175a)."
    "examples":
      "आदित्या विष्णुर्मरुतः स्वर्बृहत्सोमो रुद्रो अदितिर्ब्रह्मणस्पतिः":
        "native": "The Adityas, Vishnu, the Maruts, Rudra, Aditi and Brahmanaspati are named."
        "bases":
          "आदित्या": "the Adityas"
          "रुद्रो": "Rudra"
  "vsn-1321":
    "native": "the Maruts"
    "notes":
      "n1": "The card teaches the attested nominative plural मरुतः (marutaḥ) (marutaḥ) of the stem मरुत् (marut) (marut), the group of gods; the stem is the base."
    "bases":
      "मरुतः":
        "meaning": "the Maruts (nominative plural)"
    "examples":
      "पवमानस्य मरुतः":
        "native": "The Maruts drink of Pavamana's juice."
        "bases":
          "पवमानस्य": "of Pavamana"
          "मरुतः": "the Maruts"
  "vsn-1322":
    "native": "the Ashvins"
    "notes":
      "n1": "The card teaches the dual अश्विनौ (aśvinau) (aśvinau), 'the two', of the stem अश्विन् (aśvin) (aśvin); the Ashvins are a pair of gods."
    "bases":
      "अश्विनौ":
        "meaning": "the Ashvins (dual)"
    "examples":
      "गर्भं ते अश्विनौ देवावा धत्तां पुष्करस्रजा":
        "native": "May the two gods, the Ashvins crowned with lotuses, bestow the germ."
        "bases":
          "गर्भं": "germ"
          "ते": "your"
          "अश्विनौ": "the Ashvins"
          "धत्तां": "let them place (bestow)"
          "पुष्करस्रजा": "crowned with lotuses"
  "vsn-1323":
    "native": "Savitar"
    "notes":
      "n1": "The nominative सविता (savitā) (savitā) is from the stem सवितृ (savitṛ) (savitṛ), so the base is the stem."
    "bases":
      "सविता":
        "meaning": "Savitar"
    "examples":
      "स्वाधीर्देवः सविता":
        "native": "Savitar is the thoughtful god."
        "bases":
          "सविता": "Savitar"
  "vsn-1324":
    "native": "Pushan"
    "notes":
      "n1": "The nominative पूषा (pūṣā) (pūṣā) is from the stem पूषन् (pūṣan) (pūṣan), so the base is the stem."
    "bases":
      "पूषा":
        "meaning": "Pushan"
    "examples":
      "पूषा भगो वन्द्यासः":
        "native": "Pushan and Bhaga, the gods to be adored."
        "bases":
          "पूषा": "Pushan"
          "भगो": "Bhaga"
          "वन्द्यासः": "to be adored"
  "vsn-1325":
    "native": "Brihaspati"
    "notes":
      "n1": "In this verse Griffith identifies Brihaspati with Matarishvan at the sacrifice; the line names him मातरिश्वा (mātariśvā) (mātariśvā)."
    "examples":
      "बृहस्पतिः स ह्यञ्जो वरांसि विभ्वाभवत्समृते मातरिश्वा":
        "native": "Brihaspati, who spread out the wide spaces, was Matarishvan at the rite."
        "bases":
          "बृहस्पतिः": "Brihaspati"
          "स": "he"
          "मातरिश्वा": "Matarishvan"
  "vsn-1326":
    "native": "Tvashtar"
    "notes":
      "n1": "The nominative त्वष्टा (tvaṣṭā) (tvaṣṭā) is from the stem त्वष्टृ (tvaṣṭṛ) (tvaṣṭṛ), so the base is the stem."
    "bases":
      "त्वष्टा":
        "meaning": "Tvashtar"
    "examples":
      "त्वष्टा रूपाणि हि प्रभुः पशून्विश्वान्समानजे":
        "native": "Tvashtar, the lord, made all forms."
        "bases":
          "त्वष्टा": "Tvashtar"
          "रूपाणि": "forms"
          "हि": "(particle)"
          "प्रभुः": "lord"
  "vsn-1327":
    "native": "Yama"
    "notes":
      "n1": "The line writes यमो (yamo) (yamo) for यमः (yamaḥ) before a sonant (Whitney §175a)."
    "examples":
      "अहोभिरद्भिरक्तुभिर्व्यक्तं यमो ददात्यवसानमस्मै":
        "native": "Yama gives him a place to rest."
        "bases":
          "यमो": "Yama"
  "vsn-1328":
    "native": "Aditi"
    "notes":
      "n1": "In this verse Griffith has Aditi guard the herd by day and by night, and asks her to save us from grief."
    "examples":
      "अदितिः पात्वंहसः सदावृधा":
        "native": "Aditi, ever strengthening, save us from grief."
        "bases":
          "अदितिः": "Aditi"
          "सदावृधा": "ever strengthening"
  "vsn-1329":
    "native": "Sarasvati"
    "notes":
      "n1": "In this verse Sarasvati is asked to guard us from hate, as Griffith has it."
    "examples":
      "सरस्वती निदस्पातु":
        "native": "May Sarasvati guard us from hate."
        "bases":
          "सरस्वती": "Sarasvati"
  "vsn-1330":
    "native": "Parjanya"
    "notes":
      "n1": "In this verse Griffith has Parjanya form kine, mares, plants and womankind. The line writes पर्जन्यः (parjanyaḥ) in its headword form."
    "examples":
      "पर्जन्यः पुरुषीणाम्":
        "native": "Parjanya is the god who forms womankind."
        "bases":
          "पुरुषीणाम्": "of womankind"
  "vsn-1331":
    "native": "Aryaman"
    "notes":
      "n1": "The nominative अर्यमा (aryamā) (aryamā) is from the stem अर्यमन् (aryaman) (aryaman), so the base is the stem."
    "bases":
      "अर्यमा":
        "meaning": "Aryaman"
    "examples":
      "स्तोत्रमिन्द्रो मरुद्गणस्त्वष्टृमान्मित्रो अर्यमा":
        "native": "May Indra, with the Maruts, Tvastar, Mitra and Aryaman, accept the praise."
        "bases":
          "अर्यमा": "Aryaman"
  "vsn-1332":
    "native": "Bhaga"
    "notes":
      "n1": "In this verse Griffith asks that Bhaga send us forth with Mitra, Aryaman and Savitar."
    "examples":
      "सुवाति सविता भगः":
        "native": "May Savitar and Bhaga send us forth."
        "bases":
          "सुवाति": "to send forth (he sends)"
          "सविता": "Savitar"
          "भगः": "Bhaga"
  "vsn-1333":
    "native": "Aditya"
    "notes":
      "n1": "The line writes आदित्यो (ādityo) (ādityo) for आदित्यः (ādityaḥ) before a sonant (Whitney §175a)."
    "examples":
      "महाँ आदित्यो नमसोपसद्यो यातयज्जनो गृणते सुशेवः":
        "native": "The great Aditya, to be served with worship, is gracious to the singer."
        "bases":
          "महाँ": "great"
          "आदित्यो": "Aditya"
          "गृणते": "to praise (he praises)"
          "सुशेवः": "gracious"
