# English layer of vsn-culture-2: the meaning of each line and its notes.
schema: 1
id: "vsn-en-culture-2"
kind: "layer"
core: "vsn-culture-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: gods and nature"
description: "Eight first lines from Rigveda hymns to Agni, Indra, Parjanya, Varuna and the rivers, from the Devanagari of sa.wikisource. Each card gives one line; the note gives the hymn's seer as the sa.wikisource header names him, and what the hymn is about. Not yet checked by a Vedic scholar: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "vsn-6010":
    native: "I laud Agni, the chosen priest, god and minister of the sacrifice."
    notes:
      "n1": "The first hymn of the Rigveda, to Agni, the fire. The header names Madhuchchhandas Vaishvamitra as the seer, and Griffith's note says the first two hymns of the book are his."
  "vsn-6011":
    native: "I will declare the manly deeds of Indra, the first he did, the thunder-wielder."
    notes:
      "n1": "Indra kills the dragon Vritra and releases the waters. Griffith's note reads Vritra as the cloud that holds back the rain. The header names Hiranyastupa Angirasa as the seer."
  "vsn-6012":
    native: "Your well-known quick deeds needed no spur from your faithful servant."
    notes:
      "n1": "A hymn to several gods: the header gives Indra and Varuna for verses 1 to 3, and Savitri for verses 10 to 12. Verse 10 is the Gayatri verse to Savitr, which is not this line (en.wikipedia, Gayatri Mantra)."
  "vsn-6013":
    native: "Sing your welcome to the mighty one with songs, and praise Parjanya with reverence."
    notes:
      "n1": "A hymn to Parjanya, the rain god. The second line of the first verse says he places seed in the plants. The header names Bhauma Atri as the seer."
  "vsn-6014":
    native: "Through his greatness the creatures are wise, he who held the wide heaven and earth apart."
    notes:
      "n1": "A hymn to Varuna, the god who guards the order of the world. The header names Vasishtha Maitravaruni as the seer, and the poet asks to be freed from sin."
  "vsn-6015":
    native: "The Brahmins who keep their vows lie still for a year, like sleepers."
    notes:
      "n1": "The frog hymn: the priests who keep silent for a year are set beside frogs, which sing when the rain comes. The header names the frogs as the deity, with Parjanya in brackets, and Vasishtha Maitravaruni as the seer."
  "vsn-6016":
    native: "With the lord of the field we win, as one wins through a friend's help."
    notes:
      "n1": "A farmer's hymn to the Lord of the Field, with the furrow named in verses 6 and 7. The header names Vamadeva Gautama as the seer."
  "vsn-6017":
    native: "Forth from the lap of the mountains, eager like two mares let loose, they run laughing."
    notes:
      "n1": "A hymn to the rivers. The header names Vishvamitra Gathina as the seer, and it gives the rivers themselves as the seers of verses 4, 6, 8 and 10."
