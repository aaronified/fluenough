"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Adverbs: how often, how well, when"
"description": "16 words from the Rigveda, each with one attested line. Vedic Sanskrit in Devanagari; each reading is tool-written (based on ISO 15919) and the IPA is reconstructed. Not yet checked by a Vedicist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "vsn-1600":
    "native": "today"
    "examples":
      "अव स्य शूराध्वनो नान्तेऽस्मिन्नो अद्य सवने मन्दध्यै":
        "native": "Unyoke, O hero, so that you may be glad today at this pressing."
        "bases":
          "सवने": "pressing"
          "मन्दध्यै": "to gladden"
  "vsn-1601":
    "native": "here"
    "notes":
      "n1": "The verse does not prove this sense plainly: 'here' is the word's usual sense, not one the line shows."
    "examples":
      "स्तोतारस्त इह स्मसि":
        "native": "We who sing your praise are here."
  "vsn-1602":
    "native": "now; truly"
    "notes":
      "n1": "In the line it is written नूनं (nūnaṃ), with the anusvara for final m."
    "examples":
      "अद्या नूनं च यष्टवे":
        "native": "For sacrifice, this very day and now."
        "bases":
          "यष्टवे": "to sacrifice"
  "vsn-1603":
    "native": "again"
    "notes":
      "n1": "The stem is पुनर् (punar)."
    "bases":
      "पुनः":
        "meaning": "again"
    "examples":
      "असूयन्नभ्यचाकशं तस्मा अस्पृहयं पुनः":
        "native": "I looked on him unwillingly, and then I longed for him again."
        "bases":
          "तस्मा": "that"
          "अस्पृहयं": "to desire"
  "vsn-1604":
    "native": "at dawn; early"
    "notes":
      "n1": "The stem is प्रातर् (prātar)."
    "bases":
      "प्रातः":
        "meaning": "at dawn; early"
    "examples":
      "प्रातर्भगं पूषणं ब्रह्मणस्पतिं प्रातः सोममुत रुद्रं हुवेम":
        "native": "At dawn we call on Bhaga, Pusan, Brahmanaspati, Soma and Rudra."
        "bases":
          "पूषणं": "Pusan"
          "रुद्रं": "Rudra"
  "vsn-1605":
    "native": "together; with"
    "notes":
      "n1": "The verse does not prove this sense plainly: 'together' is the word's usual sense, not one the line shows."
    "examples":
      "जामिभिः सूर्यं सह":
        "native": "He made the sun shine together with his sisters."
        "bases":
          "जामिभिः": "sister"
          "सूर्यं": "sun"
  "vsn-1606":
    "native": "here"
    "notes":
      "n1": "Adverbs in -tra come from pronominal stems: atra, tatra, yatra, kutra (Whitney, section 1099)."
      "n2": "The verse does not prove this sense plainly: 'here' is the word's usual sense, not one the line shows."
    "examples":
      "अत्र श्रवांसि दधिरे":
        "native": "They have won high glories here."
        "bases":
          "श्रवांसि": "glory"
          "दधिरे": "to place; to win"
  "vsn-1607":
    "native": "there"
    "notes":
      "n1": "Adverbs in -tra come from pronominal stems: atra, tatra, yatra, kutra (Whitney, section 1099)."
      "n2": "The verse does not prove this sense plainly: 'there' is the word's usual sense, not one the line shows."
    "examples":
      "अस्मान्सु तत्र चोदयेन्द्र राये रभस्वतः":
        "native": "Urge us on there, O Indra, eager for wealth."
        "bases":
          "राये": "wealth"
  "vsn-1608":
    "native": "where"
    "notes":
      "n1": "Adverbs in -tra come from pronominal stems: atra, tatra, yatra, kutra (Whitney, section 1099)."
    "examples":
      "यत्र देवा इति ब्रवन्":
        "native": "Saying so, I go where the gods dwell."
        "bases":
          "देवा": "god"
          "ब्रवन्": "to say"
  "vsn-1609":
    "native": "thus"
    "notes":
      "n1": "Adverbs in -tha come from pronominal stems: tatha, yatha, katha, ittha (Whitney, section 1101)."
      "n2": "The verse does not prove this sense plainly: 'thus' is the word's usual sense, not one the line shows."
    "examples":
      "इत्था सृजाना अनपावृदर्थं दिवेदिवे विविषुरप्रमृष्यम्":
        "native": "Thus set free, the rivers flow daily toward their goal."
        "bases":
          "सृजाना": "to release"
  "vsn-1610":
    "native": "day by day"
    "examples":
      "मर्मृज्यन्ते दिवेदिवे":
        "native": "They cleanse him day after day."
        "bases":
          "मर्मृज्यन्ते": "to clean"
  "vsn-1611":
    "native": "never; no one"
    "notes":
      "n1": "The stem is नकिस् (nakis)."
      "n2": "The verse does not prove this sense plainly: 'no one' is the word's usual sense, not one the line shows."
    "bases":
      "नकिः":
        "meaning": "never; no one"
    "examples":
      "नकिष्ट्वानु मज्मना नकिः स्वश्व आनशे":
        "native": "In might none has overtaken you, and no one with good steeds has reached you."
        "bases":
          "मज्मना": "might"
          "आनशे": "to reach"
  "vsn-1612":
    "native": "when"
    "examples":
      "यदा ते मारुतीर्विशस्तुभ्यमिन्द्र नियेमिरे":
        "native": "When the Marut folk submitted to you, O Indra."
        "bases":
          "ते": "you"
          "नियेमिरे": "to restrain; to submit"
  "vsn-1613":
    "native": "thence"
    "notes":
      "n1": "The stem is ततस् (tatas)."
      "n2": "The line writes ततो (tato), with -o for -aḥ before a sonant."
    "bases":
      "ततः":
        "meaning": "thence"
    "examples":
      "ततो विष्वङ्व्यक्रामत्साशनानशने अभि":
        "native": "Thence he strode out to every side, over what eats and what does not eat."
  "vsn-1614":
    "native": "on high"
    "notes":
      "n1": "The verse does not prove this sense plainly: 'on high' is the word's usual sense, not one the line shows."
    "examples":
      "उच्चा व्यख्यद्युवतिः पुनर्भूरोषा अगन्प्रथमा पूर्वहूतौ":
        "native": "The young woman looked out on high; Dawn has come first to the morning call."
  "vsn-1615":
    "native": "near"
    "notes":
      "n1": "The stem is अभीक (abhīka)."
    "bases":
      "अभीके":
        "meaning": "near"
    "examples":
      "परि वामश्वा वपुषः पतंगा वयो वहन्त्वरुषा अभीके":
        "native": "Let your swift birds and horses carry you near us."
        "bases":
          "पतंगा": "bird"
