"tags":
- "unreviewed"
"cards":
  "vsn-1600":
    "native": "today"
    "notes":
      "attested": "Attested: अव स्य शूराध्वनो नान्तेऽस्मिन्नो अद्य सवने मन्दध्यै (ava sya śūrādhvano nānte'sminno adya savane mandadhyai), RV 4.16.2. Unyoke, O hero, so that you may be glad today at this pressing."
  "vsn-1601":
    "native": "here"
    "notes":
      "n1": "The verse does not prove this sense plainly: 'here' is the word's usual sense, not one the line shows."
      "attested": "Attested: स्तोतारस्त इह स्मसि (stotārasta iha smasi), RV 6.54.9. We who sing your praise are here."
  "vsn-1602":
    "native": "now; truly"
    "notes":
      "n1": "In the line it is written नूनं (nūnaṃ), with the anusvara for final m."
      "attested": "Attested: अद्या नूनं च यष्टवे (adyā nūnaṃ ca yaṣṭave), RV 1.13.6. For sacrifice, this very day and now."
  "vsn-1603":
    "native": "again"
    "notes":
      "n1": "The stem is पुनर् (punar)."
      "attested": "Attested: असूयन्नभ्यचाकशं तस्मा अस्पृहयं पुनः (asūyannabhyacākaśaṃ tasmā aspṛhayaṃ punaḥ), RV 10.135.2. I looked on him unwillingly, and then I longed for him again."
    "bases":
      "पुनः":
        "meaning": "again"
  "vsn-1604":
    "native": "at dawn; early"
    "notes":
      "n1": "The stem is प्रातर् (prātar)."
      "attested": "Attested: प्रातर्भगं पूषणं ब्रह्मणस्पतिं प्रातः सोममुत रुद्रं हुवेम (prātarbhagaṃ pūṣaṇaṃ brahmaṇaspatiṃ prātaḥ somamuta rudraṃ huvema), RV 7.41.1. At dawn we call on Bhaga, Pusan, Brahmanaspati, Soma and Rudra."
    "bases":
      "प्रातः":
        "meaning": "at dawn; early"
  "vsn-1605":
    "native": "together; with"
    "notes":
      "n1": "The verse does not prove this sense plainly: 'together' is the word's usual sense, not one the line shows."
    "examples":
      "जामिभिः सूर्यं सह":
        "native": "He made the sun shine together with his sisters."
        "bases":
          "जामिभिः": "sister"
          "सूर्यं": "sun"
  "vsn-1606":
    "native": "here"
    "notes":
      "n1": "Adverbs in -tra come from pronominal stems: atra, tatra, yatra, kutra (Whitney, section 1099)."
      "n2": "The verse does not prove this sense plainly: 'here' is the word's usual sense, not one the line shows."
    "examples":
      "अत्र श्रवांसि दधिरे":
        "native": "They have won high glories here."
        "bases":
          "श्रवांसि": "glory"
          "दधिरे": "to place; to win"
  "vsn-1607":
    "native": "there"
    "notes":
      "n1": "Adverbs in -tra come from pronominal stems: atra, tatra, yatra, kutra (Whitney, section 1099)."
      "n2": "The verse does not prove this sense plainly: 'there' is the word's usual sense, not one the line shows."
      "attested": "Attested: अस्मान्सु तत्र चोदयेन्द्र राये रभस्वतः (asmānsu tatra codayendra rāye rabhasvataḥ), RV 1.9.6. Urge us on there, O Indra, eager for wealth."
  "vsn-1608":
    "native": "where"
    "notes":
      "n1": "Adverbs in -tra come from pronominal stems: atra, tatra, yatra, kutra (Whitney, section 1099)."
      "attested": "Attested: यत्र देवा इति ब्रवन् (yatra devā iti bravan), RV 9.39.1. Saying so, I go where the gods dwell."
  "vsn-1609":
    "native": "thus"
    "notes":
      "n1": "Adverbs in -tha come from pronominal stems: tatha, yatha, katha, ittha (Whitney, section 1101)."
      "n2": "The verse does not prove this sense plainly: 'thus' is the word's usual sense, not one the line shows."
      "attested": "Attested: इत्था सृजाना अनपावृदर्थं दिवेदिवे विविषुरप्रमृष्यम् (itthā sṛjānā anapāvṛdarthaṃ divedive viviṣurapramṛṣyam), RV 6.32.5. Thus set free, the rivers flow daily toward their goal."
  "vsn-1610":
    "native": "day by day"
    "examples":
      "मर्मृज्यन्ते दिवेदिवे":
        "native": "They cleanse him day after day."
        "bases":
          "मर्मृज्यन्ते": "to clean"
  "vsn-1611":
    "native": "never; no one"
    "notes":
      "n1": "The stem is नकिस् (nakis)."
      "n2": "The verse does not prove this sense plainly: 'no one' is the word's usual sense, not one the line shows."
      "attested": "Attested: नकिष्ट्वानु मज्मना नकिः स्वश्व आनशे (nakiṣṭvānu majmanā nakiḥ svaśva ānaśe), RV 1.84.6. In might none has overtaken you, and no one with good steeds has reached you."
    "bases":
      "नकिः":
        "meaning": "never; no one"
  "vsn-1612":
    "native": "when"
    "notes":
      "attested": "Attested: यदा ते मारुतीर्विशस्तुभ्यमिन्द्र नियेमिरे (yadā te mārutīrviśastubhyamindra niyemire), RV 8.12.29. When the Marut folk submitted to you, O Indra."
  "vsn-1613":
    "native": "thence"
    "notes":
      "n1": "The stem is ततस् (tatas)."
      "n2": "The line writes ततो (tato), with -o for -aḥ before a sonant."
      "attested": "Attested: ततो विष्वङ्व्यक्रामत्साशनानशने अभि (tato viṣvaṅvyakrāmatsāśanānaśane abhi), RV 10.90.4. Thence he strode out to every side, over what eats and what does not eat."
    "bases":
      "ततः":
        "meaning": "thence"
  "vsn-1614":
    "native": "on high"
    "notes":
      "n1": "The verse does not prove this sense plainly: 'on high' is the word's usual sense, not one the line shows."
      "attested": "Attested: उच्चा व्यख्यद्युवतिः पुनर्भूरोषा अगन्प्रथमा पूर्वहूतौ (uccā vyakhyadyuvatiḥ punarbhūroṣā aganprathamā pūrvahūtau), RV 1.123.2. The young woman looked out on high; Dawn has come first to the morning call."
  "vsn-1615":
    "native": "near"
    "notes":
      "n1": "The stem is अभीक (abhīka)."
      "attested": "Attested: परि वामश्वा वपुषः पतंगा वयो वहन्त्वरुषा अभीके (pari vāmaśvā vapuṣaḥ pataṃgā vayo vahantvaruṣā abhīke), RV 1.118.5. Let your swift birds and horses carry you near us."
    "bases":
      "अभीके":
        "meaning": "near"
