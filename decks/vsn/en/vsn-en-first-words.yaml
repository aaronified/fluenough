"name": "First words"
"description": "Ten words to start with, from the Rigveda: I and you, water, fire, god, not, one, two, cow and horse. Vedic Sanskrit in Devanagari; each reading is based on ISO 15919 and the pronunciation is reconstructed. Vedic accent marks are not shown. Not yet checked by a Vedicist: please report any mistake."
