"tags":
- "unreviewed"
"cards":
  "vsn-0001":
    "native": "I speak."
    "notes":
      "n1": "Aham is I, the first person singular. The verb ending in Vedic also says I, but aham is used for emphasis."
    "examples":
      "अहं जानामि":
        "native": "I know."
        "bases":
          "अहं": "I"
          "जानामि": "to know (I know)"
      "अहं वदामि":
        "native": "I speak."
        "bases":
          "अहं": "I"
          "वदामि": "to speak (I speak)"
  "vsn-0002":
    "native": "You are a god."
    "notes":
      "n1": "Tvam is you to one person. The plural is yuyam, which is not in this deck."
    "examples":
      "त्वं जानासि":
        "native": "You know."
        "bases":
          "त्वं": "you"
          "जानासि": "to know (you know)"
      "त्वं देवः असि":
        "native": "You are a god."
        "bases":
          "त्वं": "you"
          "देवः": "god"
          "असि": "to be (you are)"
  "vsn-0003":
    "native": "Waters and fire."
    "notes":
      "n1": "Āpaḥ is water in the plural, the waters, a feminine noun in the Vedic hymns. It is the usual word for water in them."
    "examples":
      "आपः सन्ति":
        "native": "There are waters."
        "bases":
          "आपः": "waters"
          "सन्ति": "to be (they are)"
      "आपः अग्निश्च":
        "native": "Waters and fire."
        "bases":
          "आपः": "waters"
          "अग्निः": "fire"
          "च": "and"
  "vsn-0004":
    "native": "Look at the fire."
    "notes":
      "n1": "Agniḥ is fire, and the god of fire in the hymns. The nominative singular ends in visarga (ḥ)."
    "examples":
      "अग्निः देवः अस्ति":
        "native": "Fire is a god."
        "bases":
          "अग्निः": "fire"
          "देवः": "god"
          "अस्ति": "to be (is)"
      "अग्निं पश्य":
        "native": "Look at the fire."
        "bases":
          "अग्निं": "fire"
          "पश्य": "to see (look!)"
  "vsn-0005":
    "native": "There are gods."
    "notes":
      "n1": "Devaḥ is god, a masculine noun. The plural devāḥ is god and gods."
    "examples":
      "देवाय नमः":
        "native": "Homage to the god."
        "bases":
          "देवाय": "to a god"
          "नमः": "homage"
      "देवाः सन्ति":
        "native": "There are gods."
        "bases":
          "देवाः": "gods"
          "सन्ति": "to be (they are)"
  "vsn-0006":
    "native": "Not a god."
    "notes":
      "n1": "Na is not, the negation before a verb in the indicative: na jānāmi, I do not know."
    "examples":
      "न पश्यामि":
        "native": "I do not see."
        "bases":
          "न": "not"
          "पश्यामि": "to see (I see)"
      "न देवः":
        "native": "Not a god."
        "bases":
          "न": "not"
          "देवः": "god"
  "vsn-0007":
    "native": "One horse."
    "notes":
      "n1": "Ekaḥ is one. Its masculine singular ends in visarga; the feminine is ekā."
    "examples":
      "एकः देवः":
        "native": "One god."
        "bases":
          "एकः": "one"
          "देवः": "god"
      "एकः अश्वः":
        "native": "One horse."
        "bases":
          "एकः": "one"
          "अश्वः": "horse"
  "vsn-0008":
    "native": "Two gods."
    "notes":
      "n1": "Dvau is two, in the dual: a pair of things, which is how Vedic counts two."
    "examples":
      "द्वौ अश्वौ":
        "native": "Two horses."
        "bases":
          "द्वौ": "two"
          "अश्वौ": "horses (a pair)"
      "द्वौ देवौ":
        "native": "Two gods."
        "bases":
          "द्वौ": "two"
          "देवौ": "gods (a pair)"
  "vsn-0009":
    "native": "Cow and horse."
    "notes":
      "n1": "Gauḥ is cow, a feminine noun. It is one of the commonest animal words in the hymns."
    "examples":
      "गौः पिबति":
        "native": "The cow drinks."
        "bases":
          "गौः": "cow"
          "पिबति": "to drink (it drinks)"
      "गौः च अश्वः च":
        "native": "Cow and horse."
        "bases":
          "गौः": "cow"
          "च": "and"
          "अश्वः": "horse"
  "vsn-0010":
    "native": "Look at the horse."
    "notes":
      "n1": "Aśvaḥ is horse, a masculine noun. It is a common word for a horse in the hymns."
    "examples":
      "अश्वः धावति":
        "native": "The horse runs."
        "bases":
          "अश्वः": "horse"
          "धावति": "to run (it runs)"
      "अश्वं पश्य":
        "native": "Look at the horse."
        "bases":
          "अश्वं": "horse"
          "पश्य": "to see (look!)"
