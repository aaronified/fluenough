"cards":
  "vsn-1300":
    "native": "to see"
    "notes":
      "n1": "The root is पश् (paś) (paś). The form is from the present system, which in Whitney's account also holds the subjunctive, optative, imperative, participle and imperfect (Whitney §599)."
    "bases":
      "पश्यति":
        "meaning": "to see (he sees)"
    "examples":
      "सूरः पश्यति चक्षसा":
        "native": "The sun watches with its dear eye."
        "bases":
          "सूरः": "sun"
          "पश्यति": "to see (he sees)"
          "चक्षसा": "with the eye"
  "vsn-1301":
    "native": "to hear"
    "notes":
      "n1": "The root is श्रु (śru) (śru). The form is from the present system (Whitney §599)."
      "attested": "Attested: शृणोति कश्चिदेषाम् (śṛṇoti kaścideṣām), RV 1.37.13. Does anyone hear them?"
    "bases":
      "शृणोति":
        "meaning": "to hear (he hears)"
  "vsn-1302":
    "native": "to give"
    "notes":
      "n1": "The root is दा (dā) (dā), a verb of the reduplicating class, which prefixes a shortened reduplication, as dadā- from dā (Whitney §643). The form is from the present system (Whitney §599)."
      "attested": "Attested: अग्निरप्सामृतीषहं वीरं ददाति सत्पतिम् (agnirapsāmṛtīṣahaṃ vīraṃ dadāti satpatim), RV 6.14.4. Agni gives a hero, a true chief."
    "bases":
      "ददाति":
        "meaning": "to give (he gives)"
  "vsn-1303":
    "native": "to go"
    "notes":
      "n1": "The root is गम् (gam) (gam). The form is from the present system (Whitney §599)."
      "attested": "Attested: होत्रा देवेषु गच्छति (hotrā deveṣu gacchati), RV 1.18.8. Our hymn of praise goes to the gods."
    "bases":
      "गच्छति":
        "meaning": "to go (he goes)"
  "vsn-1304":
    "native": "to go; to come"
    "notes":
      "n1": "The root is इ (i) (i). In this verse Griffith translates the form as 'comes', so the card gives both 'go' and 'come' (the layer). The form is from the present system (Whitney §599)."
      "attested": "Attested: दक्षिणावान्प्रथमो हूत एति दक्षिणावान्ग्रामणीरग्रमेति (dakṣiṇāvānprathamo hūta eti dakṣiṇāvāngrāmaṇīragrameti), RV 10.107.5. The giver of gifts comes first when called."
    "bases":
      "एति":
        "meaning": "to go (he goes)"
  "vsn-1305":
    "native": "to speak"
    "notes":
      "n1": "The root is वद् (vad) (vad). The form is from the present system (Whitney §599)."
      "attested": "Attested: अयं नाभा वदति वल्गु वो गृहे देवपुत्रा ऋषयस्तच्छृणोतन (ayaṃ nābhā vadati valgu vo gṛhe devaputrā ṛṣayastacchṛṇotana), RV 10.62.4. This kinsman speaks sweet words in your house."
    "bases":
      "वदति":
        "meaning": "to speak (he speaks)"
  "vsn-1306":
    "native": "to make; to do"
    "notes":
      "n1": "The root is कृ (kṛ) (kṛ). In this verse the line says the dove makes a place (पदम् (padam)) by the fire, which Griffith renders as 'settled'. The form is from the present system (Whitney §599)."
      "attested": "Attested: यदुलूको वदति मोघमेतद्यत्कपोतः पदमग्नौ कृणोति (yadulūko vadati moghametadyatkapotaḥ padamagnau kṛṇoti), RV 10.165.4. The owl's hooting is vain, but the dove has settled by the fire."
    "bases":
      "कृणोति":
        "meaning": "to make (he makes)"
  "vsn-1307":
    "native": "to become; to be"
    "notes":
      "n1": "The root is भू (bhū) (bhū). The form is from the present system (Whitney §599). In this verse Griffith translates the form as 'is'."
      "attested": "Attested: नीललोहितं भवति कृत्यासक्तिर्व्यज्यते (nīlalohitaṃ bhavati kṛtyāsaktirvyajyate), RV 10.85.28. Her hue is blue and red."
    "bases":
      "भवति":
        "meaning": "to become (he becomes); to be"
  "vsn-1308":
    "native": "to stand"
    "notes":
      "n1": "The root is स्था (sthā) (sthā), so the form does not show the root's first letter. The form is from the present system (Whitney §599)."
    "bases":
      "तिष्ठति":
        "meaning": "to stand (he stands)"
    "examples":
      "शूरो न गोषु तिष्ठति":
        "native": "He stands like a hero among the cows."
        "bases":
          "शूरो": "hero"
          "न": "like"
          "गोषु": "among the cows"
          "तिष्ठति": "to stand (he stands)"
  "vsn-1309":
    "native": "to drink"
    "notes":
      "n1": "The root is पा (pā) (pā). The form is from the present system (Whitney §599)."
      "attested": "Attested: न स राजा व्यथते यस्मिन्निन्द्रस्तीव्रं सोमं पिबति गोसखायम् (na sa rājā vyathate yasminnindrastīvraṃ somaṃ pibati gosakhāyam), RV 5.37.4. No harm reaches that king in whose house Indra drinks the sharp soma."
    "bases":
      "पिबति":
        "meaning": "to drink (he drinks)"
  "vsn-1310":
    "native": "to eat"
    "notes":
      "n1": "The root is अद् (ad) (ad). Griffith renders the same verb in this verse as 'devours'. The form is from the present system (Whitney §599)."
      "attested": "Attested: तद्वामृतं रोदसी प्र ब्रवीमि जायमानो मातरा गर्भो अत्ति (tadvāmṛtaṃ rodasī pra bravīmi jāyamāno mātarā garbho atti), RV 10.79.4. I tell you this truth, heaven and earth: the infant devours its parents at birth."
    "bases":
      "अत्ति":
        "meaning": "to eat (he eats)"
  "vsn-1311":
    "native": "to carry; to bring"
    "notes":
      "n1": "The root is भृ (bhṛ) (bhṛ). The reduplicating class makes a shortened reduplication, as bibhṛ- from bhṛ (Whitney §643). This present form is not reduplicated (Whitney §599)."
      "attested": "Attested: आ मातरा भरति शुष्म्या गोर्नृवत्परिज्मन्नोनुवन्त वाताः (ā mātarā bharati śuṣmyā gornṛvatparijmannonuvanta vātāḥ), RV 4.22.4. The strong one brings the bull's two parents near."
    "bases":
      "भरति":
        "meaning": "to carry (he carries); to bring"
  "vsn-1312":
    "native": "to go; to drive"
    "notes":
      "n1": "The root is या (yā) (yā). In this verse Griffith translates the form as 'travels on'. The form is from the present system (Whitney §599)."
    "bases":
      "याति":
        "meaning": "to go (he goes); to drive"
    "examples":
      "सोमो याति विचर्षणिः":
        "native": "Soma, the most active one, travels on."
        "bases":
          "सोमो": "Soma"
          "याति": "to go (he goes)"
          "विचर्षणिः": "watchful"
  "vsn-1313":
    "native": "to know"
    "notes":
      "n1": "The root is ज्ञा (jñā) (jñā), the root of जानामि (jānāmi) (jānāmi), 'I know', on the first-words card. The form is from the present system (Whitney §599)."
      "attested": "Attested: स ते जानाति सुमतिं यविष्ठ य ईवते ब्रह्मणे गातुमैरत् (sa te jānāti sumatiṃ yaviṣṭha ya īvate brahmaṇe gātumairat), RV 4.4.6. Most youthful god, he knows well your favour."
    "bases":
      "जानाति":
        "meaning": "to know (he knows)"
  "vsn-1314":
    "native": "to strike; to kill"
    "notes":
      "n1": "The root is हन् (han) (han). Whitney (§637) says han's forms differ from the root's shape, so check the form against the root."
      "attested": "Attested: हन्ति रक्षो हन्त्यासद्वदन्तमुभाविन्द्रस्य प्रसितौ शयाते (hanti rakṣo hantyāsadvadantamubhāvindrasya prasitau śayāte), RV 7.104.13. He slays the fiend."
    "bases":
      "हन्ति":
        "meaning": "to strike (he strikes); to kill"
  "vsn-1315":
    "native": "to grow"
    "notes":
      "n1": "The root is वृध् (vṛdh) (vṛdh). The form ends in -te, the middle ending, and is from the present system (Whitney §599)."
      "attested": "Attested: उक्थैर्यज्ञेषु वर्धते (ukthairyajñeṣu vardhate), RV 9.17.4. It grows strong at the sacrifices, through the hymns of praise."
    "bases":
      "वर्धते":
        "meaning": "to grow (it grows)"
