"cards":
  "vsn-1900":
    "native": "all"
    "notes":
      "n1": "The verse writes विश्वो (viśvo), with -o for the -aḥ of the nominative before a voiced sound: the same word. Declined like a pronominal adjective, as सर्वः (sarvaḥ) and एकः (ekaḥ) are (Whitney, § 524)."
      "attested": "Attested: विश्वो देवस्य नेतुर्मर्तो वुरीत सख्यम् (viśvo devasya neturmarto vurīta sakhyam), RV 5.50.1. Every mortal should choose the friendship of the guiding god."
  "vsn-1901":
    "native": "much; abundant"
    "notes":
      "n1": "Whitney lists bhū́ri among the words in -ri (§ 1191)."
      "attested": "Attested: अश्वावतीर्गोमतीर्विश्वसुविदो भूरि च्यवन्त वस्तवे (aśvāvatīrgomatīrviśvasuvido bhūri cyavanta vastave), RV 1.48.2. Bringing horses and cows, they have often hurried forth to bring us much."
  "vsn-1902":
    "native": "more"
    "notes":
      "n1": "The verse writes भूयो (bhūyo), with -o for the -aḥ of the nominative before a voiced sound. The stem is भूयस् (bhūyas)."
      "attested": "Attested: एतावद्वेदुषस्त्वं भूयो वा दातुमर्हसि (etāvadveduṣastvaṃ bhūyo vā dātumarhasi), RV 5.79.10. So much, and even more, is what you should give, O dawn."
  "vsn-1903":
    "native": "all"
    "notes":
      "n1": "The verse writes सर्वं (sarvaṃ), with anusvara for the final m. Declined like a pronominal adjective, as विश्व (viśva) and एक (eka) are (Whitney, § 524)."
      "attested": "Attested: पुरुष एवेदं सर्वं यद्भूतं यच्च भव्यम् (puruṣa evedaṃ sarvaṃ yadbhūtaṃ yacca bhavyam), RV 10.90.2. This Purusha is all that has been and all that is yet to be."
  "vsn-1904":
    "native": "both"
    "bases":
      "उभौ": "both"
    "notes":
      "n1": "An inflected form of the stem उभ (both), masculine, as attested here. The card teaches the form as the verse has it."
      "attested": "Attested: उभौ समुद्रावा क्षेति यश्च पूर्व उतापरः (ubhau samudrāvā kṣeti yaśca pūrva utāparaḥ), RV 10.136.5. He has his home in both oceans, the eastern and the western."
  "vsn-1905":
    "native": "many"
    "bases":
      "बहवः": "many"
    "notes":
      "n1": "An inflected form of the stem बहु (many), as attested here. The card teaches the form as the verse has it."
      "attested": "Attested: बहवः सूरचक्षसोऽग्निजिह्वा ऋतावृधः (bahavaḥ sūracakṣaso'gnijihvā ṛtāvṛdhaḥ), RV 7.66.10. Many are those who strengthen the Law, sun-eyed, with Agni for their tongue."
  "vsn-1906":
    "native": "thrice"
    "notes":
      "n1": "A multiplicative adverb made from a numeral: Whitney lists trís among them (§ 1105)."
      "attested": "Attested: त्रिः सप्त यद्गुह्यानि त्वे इत्पदाविदन्निहिता यज्ञियासः (triḥ sapta yadguhyāni tve itpadāvidannihitā yajñiyāsaḥ), RV 1.72.6. The holy beings found the thrice-seven secret things set within you."
  "vsn-1907":
    "native": "both"
    "notes":
      "n1": "The verse writes उभयं (ubhayaṃ), with anusvara for the final m. It goes with उभौ (ubhau), the form of the stem उभ (both)."
      "attested": "Attested: अस्माकमिन्द्र उभयं जुजोषति यत्सोम्यस्यान्धसो बुबोधति (asmākamindra ubhayaṃ jujoṣati yatsomyasyāndhaso bubodhati), RV 10.32.1. May Indra accept both of our gifts, when he knows the Soma juice."
  "vsn-1908":
    "native": "full"
    "notes":
      "n1": "The verse writes पूर्णं (pūrṇaṃ), with anusvara for the final m."
      "attested": "Attested: आ मध्वो अस्मा असिचन्नमत्रमिन्द्राय पूर्णं स हि सत्यराधाः (ā madhvo asmā asicannamatramindrāya pūrṇaṃ sa hi satyarādhāḥ), RV 10.29.7. They poured out a full bowl of sweet juice for Indra."
  "vsn-1909":
    "native": "much"
    "notes":
      "attested": "Attested: त्वमिमा वार्या पुरु दिवोदासाय सुन्वते (tvamimā vāryā puru divodāsāya sunvate), RV 6.16.5. You give these many boons to Divodasa, who pours forth the juice."
