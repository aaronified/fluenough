  "name": "English"
"name": "Quantities"
"description": "All, many, much, both, full and thrice, from the Rigveda. Vedic Sanskrit in Devanagari; each reading is based on ISO 15919 and the pronunciation is reconstructed. Not yet checked by a Vedicist: please report any mistake."
"license": "CC-BY-SA-4.0"
"source": "Rigveda: Sanskrit text from sa.wikisource.org, hymn pages (read 2026-11-16); English from Griffith's translation of The Hymns of the Rigveda (1896), en.wikisource.org; grammar from Whitney's Sanskrit Grammar, en.wikisource.org (sections cited in the notes). Readings and IPA are written by the tool, not by hand."
"tags":
  - "unreviewed"
"cards":
  "vsn-1900":
    "native": "all"
    "notes":
      "n1": "The verse writes विश्वो (viśvo), with -o for the -aḥ of the nominative before a voiced sound: the same word. Declined like a pronominal adjective, as सर्वः (sarvaḥ) and एकः (ekaḥ) are (Whitney, § 524)."
    "examples":
      "विश्वो देवस्य नेतुर्मर्तो वुरीत सख्यम्":
        "native": "Every mortal should choose the friendship of the guiding god."
        "bases":
          "विश्वो": "all"
  "vsn-1901":
    "native": "much; abundant"
    "notes":
      "n1": "Whitney lists bhū́ri among the words in -ri (§ 1191)."
    "examples":
      "अश्वावतीर्गोमतीर्विश्वसुविदो भूरि च्यवन्त वस्तवे": "Bringing horses and cows, they have often hurried forth to bring us much."
  "vsn-1902":
    "native": "more"
    "notes":
      "n1": "The verse writes भूयो (bhūyo), with -o for the -aḥ of the nominative before a voiced sound. The stem is भूयस् (bhūyas)."
    "examples":
      "एतावद्वेदुषस्त्वं भूयो वा दातुमर्हसि":
        "native": "So much, and even more, is what you should give, O dawn."
        "bases":
          "भूयो": "more"
  "vsn-1903":
    "native": "all"
    "notes":
      "n1": "The verse writes सर्वं (sarvaṃ), with anusvara for the final m. Declined like a pronominal adjective, as विश्व (viśva) and एक (eka) are (Whitney, § 524)."
    "examples":
      "पुरुष एवेदं सर्वं यद्भूतं यच्च भव्यम्":
        "native": "This Purusha is all that has been and all that is yet to be."
        "bases":
          "सर्वं": "all"
  "vsn-1904":
    "native": "both"
    "bases":
      "उभौ": "both"
    "notes":
      "n1": "An inflected form of the stem उभ (both), masculine, as attested here. The card teaches the form as the verse has it."
    "examples":
      "उभौ समुद्रावा क्षेति यश्च पूर्व उतापरः":
        "native": "He has his home in both oceans, the eastern and the western."
        "bases":
          "उभौ": "both"
  "vsn-1905":
    "native": "many"
    "bases":
      "बहवः": "many"
    "notes":
      "n1": "An inflected form of the stem बहु (many), as attested here. The card teaches the form as the verse has it."
    "examples":
      "बहवः सूरचक्षसोऽग्निजिह्वा ऋतावृधः":
        "native": "Many are those who strengthen the Law, sun-eyed, with Agni for their tongue."
        "bases":
          "बहवः": "many"
  "vsn-1906":
    "native": "thrice"
    "notes":
      "n1": "A multiplicative adverb made from a numeral: Whitney lists trís among them (§ 1105)."
    "examples":
      "त्रिः सप्त यद्गुह्यानि त्वे इत्पदाविदन्निहिता यज्ञियासः":
        "native": "The holy beings found the thrice-seven secret things set within you."
        "bases":
          "त्रिः": "thrice"
  "vsn-1907":
    "native": "both"
    "notes":
      "n1": "The verse writes उभयं (ubhayaṃ), with anusvara for the final m. It goes with उभौ (ubhau), the form of the stem उभ (both)."
    "examples":
      "अस्माकमिन्द्र उभयं जुजोषति यत्सोम्यस्यान्धसो बुबोधति":
        "native": "May Indra accept both of our gifts, when he knows the Soma juice."
        "bases":
          "उभयं": "both"
  "vsn-1908":
    "native": "full"
    "notes":
      "n1": "The verse writes पूर्णं (pūrṇaṃ), with anusvara for the final m."
    "examples":
      "आ मध्वो अस्मा असिचन्नमत्रमिन्द्राय पूर्णं स हि सत्यराधाः":
        "native": "They poured out a full bowl of sweet juice for Indra."
        "bases":
          "पूर्णं": "full"
  "vsn-1909":
    "native": "much"
    "examples":
      "त्वमिमा वार्या पुरु दिवोदासाय सुन्वते": "You give these many boons to Divodasa, who pours forth the juice."
