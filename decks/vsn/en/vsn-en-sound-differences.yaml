"name": "Sounds and pitch accent"
"description": "Words you already know, each with what Whitney's Sanskrit Grammar says about one of its sounds, and how Vedic accent works. Whitney describes a pronunciation from the nineteenth century and the Indian grammarians, so these are descriptions, not recordings. Not yet checked by a Vedicist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "vsn-1340":
    "notes":
      "sd1": "Short a: Whitney §21 says the short a is not pronounced in India with the full openness of आ (ā), but usually as the neutral vowel (the English short u of but, son, blood). He adds that Pāṇini and two of the Prātiśākhyas already acknowledge this, and that Western scholars tend to ignore it. The a-vowels are the commonest vowels of the language, about twice as frequent as all the others together (Whitney §22)."
  "vsn-2206":
    "notes":
      "sd1": "Length: Whitney §77 says the Indian grammarians define a long (dīrgha) vowel or diphthong as twice the quantity of a short (hrasva) vowel, and §76 a consonant as half the quantity of a short vowel. क्षीरम् (kṣīram) has the long ई (ī); say it twice as long as the short इ (i)."
  "vsn-1949":
    "notes":
      "sd1": "The vowel ऋ (ṛ): Whitney §24 calls it 'simply a smooth or untrilled r-sound, assuming a vocalic office in syllable-making'. The short ṛ is found in every variety of word and is about as frequent as the long ऊ (ū) (Whitney §26). In ऋषिः (ṛṣiḥ) it is the first syllable."
  "vsn-1648":
    "notes":
      "sd1": "ळ (ḷ) is a consonant, not a vowel. Whitney §54: some Vedic texts have another l-sound, written with a slightly different character, put in place of a lingual ड (ḍ) between two vowels; it is 'doubtless a lingual l', made by breach, at the side of the tongue, of the lingual instead of the dental closure. Whitney writes this letter ḻ; the reading used in this course is ḷ. His own ḷ (§23) is a different thing, the vowel ऌ (ḷ)."
  "vsn-1930":
    "notes":
      "sd1": "Whitney §54a gives this very word as his example: ईळे (īḷe) stands for ईडे (īḍe), 'but ईड्य (īḍya)': the ळ (ḷ) replaces ड (ḍ) only between two vowels. He adds that the substitution is usual especially in the Rigveda and its auxiliary literature."
  "vsn-1344":
    "notes":
      "sd1": "ए (e): Whitney §28 says ए (e) and ओ (o) are, in India and in Europe, usually pronounced as they are transliterated, as long e- and o-sounds (the English long a, or the e of they) without diphthongal character. He still counts them among the four diphthongs (§27), the guṇa-diphthongs of इ (i) and उ (u)."
      "sd2": "घ (gh) is the sonant aspirate beside the sonant ग (g) (Whitney §37). Sonant aspirates are more than twice as common as surd aspirates (§38). European scholars pronounce both kinds of aspirate as the plain mute with a following h, dh for example as in madhouse (§37e); Whitney warns that this is strictly accurate only for the surd aspirates, and that the true character of the sonant aspirates is much disputed (§37c)."
  "vsn-0009":
    "notes":
      "sd1": "औ (au) is one of the four diphthongs; Whitney writes it āu, and ऐ (ai) as āi. He says (§27) that these two are held to be of peculiar Sanskrit growth, being in general results of a higher increment, the vṛddhi, of इ (i) and उ (u). A diphthong is as long as a long vowel, twice a short vowel, and the grammarians make no distinction between the guṇa- and the vṛddhi-diphthongs in this respect (Whitney §77). Whitney does not say in these sections how ai and au are pronounced; this course's readings write them ai and au."
  "vsn-1004":
    "notes":
      "sd1": "ऐ (ai) is the other vṛddhi-diphthong; Whitney writes it āi (§27). It is the higher increment, the vṛddhi, of इ (i) (Whitney §27), and a diphthong is twice the quantity of a short vowel (§77). In कस्मै (kasmai) it ends the word."
  "vsn-1336":
    "notes":
      "sd1": "भ (bh) is the sonant aspirate beside the sonant ब (b) (Whitney §37). Whitney §50: because b was almost absent in Indo-European, b is greatly exceeded in frequency by bh, the commonest of all the sonant aspirates. Whitney §37e compares the European way of saying it with the bh of abhor."
  "vsn-2207":
    "notes":
      "sd1": "थ (th) is the surd aspirate beside the unaspirated त (t). Whitney §37b: it differs from t by the slipping out of an audible bit of breath between the breach of the closure and the sound that follows, and the th written for it is accurate enough; §37a says all aspirates are real mutes, not fricatives like the English th. Whitney §37e compares it with the th of boathook, not with the th of thin or this."
  "vsn-2219":
    "notes":
      "sd1": "ख (kh) is the surd aspirate beside the surd mute क (k), as in Whitney §37: क (k) with an audible bit of breath. Whitney §39 says क (k) and ग (g) are the ordinary European k and g-sounds with their aspirates. Whitney §37b says the th, kh and the like with which we write the aspirates represent them accurately enough. मुखम् (mukham) has ख (kh) in its second syllable."
  "vsn-2218":
    "notes":
      "sd1": "च (c) is a palatal mute. Whitney §44: European scholars, like the modern Hindus, pronounce the palatal mutes with the compound sounds of the English ch and j, as in church and judge. Whitney writes it c, as here."
  "vsn-2224":
    "notes":
      "sd1": "ण (ṇ) is the nasal of the lingual series. Whitney §45: the lingual mutes are defined by all the native authorities as uttered with the tip of the tongue turned up and drawn back into the dome of the palate, somewhat like the usual English r. In practice, he adds, European Sanskritists make no attempt to tell them from the dentals, and pronounce ट (ṭ) like त (t) and ड (ḍ) like द (d)."
  "vsn-1339":
    "notes":
      "sd1": "ष (ṣ) is the lingual sibilant. Whitney §61: it is produced in the lingual position, with the tip of the tongue turned back into the dome of the palate, a kind of sh-sound; European Sanskritists pronounce it as an ordinary sh (French ch, German sch), with no attempt to give it its lingual quality."
  "vsn-2216":
    "notes":
      "sd1": "श (ś) is the palatal sibilant, which Whitney writes ç. Whitney §63: all the native authorities class and describe it as palatal, made with the flat of the tongue against the forward part of the palatal arch, the usual and normal sh-sound; European scholars pronounce it variously, more often perhaps as s than as sh."
  "vsn-1605":
    "notes":
      "sd1": "स (s): Whitney §60 calls it the one of the three sibilants of plainest and least questioned character, the ordinary European s, a hiss expelled between the tongue and the roof of the mouth directly behind the upper front teeth. Keep it apart from श (ś) and ष (ṣ)."
  "vsn-0008":
    "notes":
      "sd1": "व (v): Whitney §57 says the modern Hindus pronounce it as the English or French v (German w), except when a consonant comes before it in the same syllable, when it sounds rather like the English w; European scholars do the same. In द्वौ (dvau) the व (v) follows द (d) in the same syllable."
  "vsn-2217":
    "notes":
      "sd1": "ह (h): Whitney §65 says it is ordinarily pronounced like the usual European surd aspiration h, as in English hand."
  "vsn-0004":
    "notes":
      "sd1": "ः (ḥ), the visarga: Whitney §67 calls it merely a surd breathing, a final h-sound uttered in the articulating position of the preceding vowel. §68: it is 'not original, but always only a substitute for final s or r'. Whitney §170a: s becomes visarga before a pause. So the ः (ḥ) ending अग्निः (agniḥ) stands for a final s; Whitney §307a gives s as the usual masculine nominative ending."
      "sd2": "Accent: Whitney's own example of the Rigveda way of marking accent is अग्निम् (agním) (Whitney §87a). The acute syllable is left unmarked, and the grave syllable before an acute has a short horizontal stroke below, so the first syllable of agním takes the stroke. The A1 words of this course are written without accent marks."
  "vsn-1913":
    "notes":
      "sd1": "ं (ṃ), the anusvāra: Whitney §70 calls it a nasal sound lacking the closure of the organs that a nasal mute needs, with nasal resonance and some degree of openness of the mouth. Whitney §71: the Indian phoneticians and modern scholars disagree about its real character (a nasalized vowel, a nasal semivowel, or an independent after-tone), so no exact sound is claimed here. Whitney writes ṁ for an assimilated m and ṅ for an anusvāra of more independent origin (§73c); this course's readings write ṃ for it."
  "vsn-1316":
    "notes":
      "sd1": "Pitch accent: Whitney §80 says the Indian grammarians of all ages describe accent as a variation of tone or pitch, and make no account of any difference of stress. An accented syllable is therefore higher in pitch, not louder. Whitney prints इन्द्रः (índraḥ) with the accent on the first syllable (§87b); in Rigveda manuscripts an unmarked syllable at the beginning of a word is to be understood as acute."
  "vsn-0005":
    "notes":
      "sd1": "The tones: Whitney §81 names two primary tones, a higher one, udātta, 'raised', the acute, and a lower one, anudātta, 'not raised', the grave. A third, svarita, is always of secondary origin: the fusion of an acute vowel and a following grave vowel into one syllable, or the syllable after an acute (§85). In his paradigm of देव (deva) 'god' the accent falls on the last syllable, devá (§330), but the vocative is déva, on the first: 'as a rule without exception, the vocative, if accented at all, is accented on the first syllable' (§314a)."
