"name": "Multi-word verbs: preverb before its verb"
"description": "Seven preverb-and-verb pairs of the Rigveda in which the preverb stands right before its verb as its own word. Not yet checked by a Vedicist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "vsn-6211":
    "native": "to declare, make known"
    "notes":
      "u1": "The preverb stands before the verb as its own word: RV 1.32.1 opens इन्द्रस्य नु वीर्याणि प्र वोचं (indrasya nu vīryāṇi pra vocaṃ), and RV 1.154.1 begins the same way."
    "bases":
      "प्र": { "meaning": "forth" }
      "वोचं": { "meaning": "declare" }
  "vsn-6212":
    "native": "to declare, tell"
    "notes":
      "u1": "The preverb stands before the verb in RV 10.129.6, which asks who can declare it here: को अद्धा वेद क इह प्र वोचत् (ko addhā veda ka iha pra vocat). The verb runs into the next word by sandhi, so read the form as written."
    "bases":
      "प्र": { "meaning": "forth" }
      "वोचत्": { "meaning": "tell, declare" }
  "vsn-6213":
    "native": "to talk something over with oneself"
    "notes":
      "u1": "The preverb stands right before the verb in RV 7.86.2: उत स्वया तन्वा सं वदे (uta svayā tanvā saṃ vade), 'I talk it over with myself'."
    "bases":
      "सं": { "meaning": "together, with" }
      "वदे": { "meaning": "speak" }
  "vsn-6214":
    "native": "to look on kindly"
    "notes":
      "u1": "The preverb stands right before the verb in RV 7.86.2: सुमना अभि ख्यम् (sumanā abhi khyam), 'may I look on him kindly'."
    "bases":
      "अभि": { "meaning": "toward, upon" }
      "ख्यम्": { "meaning": "look" }
  "vsn-6215":
    "native": "to enter"
    "notes":
      "u1": "The preverb stands right before the verb in RV 10.125.6: द्यावापृथिवी आ विवेश (dyāvāpṛthivī ā viveśa), 'I have entered heaven and earth'."
    "bases":
      "आ": { "meaning": "into, to" }
      "विवेश": { "meaning": "entered" }
  "vsn-6216":
    "native": "to pour down"
    "notes":
      "u1": "The preverb stands right before the verb in RV 5.83.8: महान्तं कोशमुदचा नि षिञ्च (mahāntaṃ kośamudacā ni ṣiñca)."
    "bases":
      "नि": { "meaning": "down" }
      "षिञ्च": { "meaning": "pour" }
  "vsn-6217":
    "native": "to roar at"
    "notes":
      "u1": "The preverb stands right before the verb in RV 5.83.7: अभि क्रन्द स्तनय गर्भमा धा (abhi kranda stanaya garbhamā dhā), 'roar, thunder, set the womb'."
    "bases":
      "अभि": { "meaning": "toward" }
      "क्रन्द": { "meaning": "roar" }
