"cards":
  "vsn-2518":
    "native": "Eastward, the east."
    "notes":
      "n1": "Its stem is {1}; {2} is its feminine form."
      "attested": "Attested: एति प्राची विश्ववारा नमोभिर्देवाँ ईळाना हविषा घृताची (eti prācī viśvavārā namobhirdevām̐ īḷānā haviṣā ghṛtācī), RV 5.28.1. Eastward the ladle goes that brings all blessing, praising the gods with homage and oblation."
  "vsn-2519":
    "native": "On the right, southward."
    "notes":
      "n1": "The card teaches the attested form {1}, a form of the stem {2}; in this line it is written {3}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
      "attested": "Attested: आच्या जानु दक्षिणतो निषद्येमं यज्ञमभि गृणीत विश्वे (ācyā jānu dakṣiṇato niṣadyemaṃ yajñamabhi gṛṇīta viśve), RV 10.15.6. Bowing your bended knees and seated southward, accept this sacrifice of ours with favour."
    "bases":
      "दक्षिणतः": "southward"
  "vsn-2520":
    "native": "In front, before."
    "notes":
      "n1": "One of the adverbs in -tāt, like {1}; the others are adhástāt, avástāt and parástāt (Whitney §1100)."
      "attested": "Attested: आ ते शुष्मो वृषभ एतु पश्चादोत्तरादधरादा पुरस्तात् (ā te śuṣmo vṛṣabha etu paścādottarādadharādā purastāt), RV 6.19.9. Let thine heroic strength come from behind us, before us, from above us or below us."
  "vsn-2521":
    "native": "Eastward, forward."
    "notes":
      "n1": "The card teaches the attested form {1}, a form of the stem {2}."
      "n2": "In this line it is written {1}: the corpus writes final -m as anusvara (ṃ)."
      "attested": "Attested: प्राचीनं बर्हिरोजसा सहस्रवीरमस्तृणन् (prācīnaṃ barhirojasā sahasravīramastṛṇan), RV 1.188.4. To seat a thousand heroes they have strewn the grass eastward, with might."
    "bases":
      "प्राचीनम्": "eastward, forward"
  "vsn-2522":
    "native": "Regions, directions."
    "notes":
      "n1": "The card teaches the attested form {1}, a form of the stem {2}; in this line it is written {3}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
      "attested": "Attested: सप्त दिशो नानासूर्याः सप्त होतार ऋत्विजः (sapta diśo nānāsūryāḥ sapta hotāra ṛtvijaḥ), RV 9.114.3. Seven regions have their several suns; the ministering priests are seven."
    "bases":
      "दिशः": "regions, directions"
