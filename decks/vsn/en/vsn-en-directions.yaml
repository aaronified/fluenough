"cards":
  "vsn-2518":
    "native": "Eastward, the east."
    "notes":
      "n1": "Its stem is {1}; {2} is its feminine form."
    "examples":
      "एति प्राची विश्ववारा नमोभिर्देवाँ ईळाना हविषा घृताची":
        "native": "Eastward the ladle goes that brings all blessing, praising the gods with homage and oblation."
        "bases":
          "प्राची": "eastward"
  "vsn-2519":
    "native": "On the right, southward."
    "notes":
      "n1": "The card teaches the attested form {1}, a form of the stem {2}; in this line it is written {3}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
    "bases":
      "दक्षिणतः": "southward"
    "examples":
      "आच्या जानु दक्षिणतो निषद्येमं यज्ञमभि गृणीत विश्वे":
        "native": "Bowing your bended knees and seated southward, accept this sacrifice of ours with favour."
        "bases":
          "दक्षिणतो": "southward"
  "vsn-2520":
    "native": "In front, before."
    "notes":
      "n1": "One of the adverbs in -tāt, like {1}; the others are adhástāt, avástāt and parástāt (Whitney §1100)."
    "examples":
      "आ ते शुष्मो वृषभ एतु पश्चादोत्तरादधरादा पुरस्तात्": "Let thine heroic strength come from behind us, before us, from above us or below us."
  "vsn-2521":
    "native": "Eastward, forward."
    "notes":
      "n1": "The card teaches the attested form {1}, a form of the stem {2}."
      "n2": "In this line it is written {1}: the corpus writes final -m as anusvara (ṃ)."
    "bases":
      "प्राचीनम्": "eastward, forward"
    "examples":
      "प्राचीनं बर्हिरोजसा सहस्रवीरमस्तृणन्":
        "native": "To seat a thousand heroes they have strewn the grass eastward, with might."
        "bases":
          "प्राचीनं": "eastward"
  "vsn-2522":
    "native": "Regions, directions."
    "notes":
      "n1": "The card teaches the attested form {1}, a form of the stem {2}; in this line it is written {3}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
    "bases":
      "दिशः": "regions, directions"
    "examples":
      "सप्त दिशो नानासूर्याः सप्त होतार ऋत्विजः":
        "native": "Seven regions have their several suns; the ministering priests are seven."
        "bases":
          "दिशो": "regions"
