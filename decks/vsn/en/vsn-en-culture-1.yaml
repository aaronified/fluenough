# English layer of vsn-culture-1: the meaning of each line and its notes.
schema: 1
id: "vsn-en-culture-1"
kind: "layer"
core: "vsn-culture-1"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: creation and cosmos"
description: "Ten first lines from Rigveda hymns on creation, the cosmos, the gods and the world's order, from the Devanagari of sa.wikisource. Each card gives one line; the note gives the hymn's seer as the sa.wikisource header names him, and what the hymn is about. Not yet checked by a Vedic scholar: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "vsn-6000":
    native: "Then there was neither what is nor what is not: no air, and no sky beyond it."
    notes:
      "n1": "The Nasadiya Sukta, the hymn of creation. It asks what existed before the world began, and it ends by doubting whether even the highest seer knows. The header names Prajapati Parameshthin as the seer."
  "vsn-6001":
    native: "The Person has a thousand heads, a thousand eyes and a thousand feet."
    notes:
      "n1": "The Purusha Sukta, on the Cosmic Person from whom the world is made. The header names Narayana as the seer and gives verse 16 a different metre."
  "vsn-6002":
    native: "In the beginning the golden womb arose, born as the one lord of all that is born."
    notes:
      "n1": "The golden womb, Hiranyagarbha. The second line of the first verse asks which god we should worship with the offering. The header names Hiranyagarbha Prajapatya as the seer and Prajapati as the deity."
  "vsn-6003":
    native: "I travel with the Rudras and the Vasus, with the Adityas and all the gods."
    notes:
      "n1": "A goddess speaks in the first person, and the hymn is a list of what she is and does. The header names Vak Ambhrini as the seer."
  "vsn-6004":
    native: "Brihaspati, when men gave names to things, sent out the first utterances of speech."
    notes:
      "n1": "A hymn on the origin of speech and of names. The header names Brihaspati Angirasa as the seer and marks the subject as knowledge."
  "vsn-6005":
    native: "Of this benign, grey-haired priest, the middle one of his three brothers is lightning."
    notes:
      "n1": "A riddle hymn of 52 verses, a long one. The header names Dirghatamas Auchathya as the seer and the All-Gods as the deities of most of its verses."
  "vsn-6006":
    native: "I will tell the mighty deeds of Vishnu, who measured out the regions of the earth."
    notes:
      "n1": "Vishnu's three strides across the world. The header names Dirghatamas Auchathya as the seer and Vishnu as the deity."
  "vsn-6007":
    native: "By faith the fire is kindled, and by faith the offering is poured."
    notes:
      "n1": "A hymn to Faith (Shraddha), who is the speaker. The header names Shraddha Kamayani as the seer. Faith is the one who kindles the fire."
  "vsn-6008":
    native: "Night looks out with her many eyes, approaching many places."
    notes:
      "n1": "A hymn to Night, the goddess. The header names Kushika Saubhara, or else Ratri Bharadvaji, as the seer; it gives both."
  "vsn-6009":
    native: "Truth holds up the earth, and the sun holds up the sky."
    notes:
      "n1": "The wedding of Surya: the header marks verses 6 to 16 as her marriage, and this is the hymn's first verse. The header names Savitri Surya as the seer."
