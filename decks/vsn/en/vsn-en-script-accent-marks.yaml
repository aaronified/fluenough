native:
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
name: "Vedic accent marks"
description: "The two marks of the Rigveda: the stroke below (anudātta, the grave) and the stroke above (svarita, the circumflex), with the acute left unmarked. Here and in the reading deck are the only places a target carries them. Examples are Whitney's own, section 87. Not yet checked by a Vedicist: please report any mistake."
license: "CC-BY-SA-4.0"
tags:
- "unreviewed"
cards:
  "vsn-0580":
    "native": "the anudātta sign, the grave"
    "notes":
      "n1": "The anudātta ('not raised'), the grave tone, is marked by a short horizontal stroke under the syllable: here under अ (a). It is written on the grave syllable next before an acute (Whitney, section 87 a). Accent in the Sanskrit grammarians' account is a matter of pitch, not stress (Whitney, section 80)."
      "n2": "The reading and the IPA of a card leave the accent out: the mark is learned from the target. If you type the answer, the plain spelling अ (a) is accepted too."
  "vsn-0581":
    "native": "the svarita sign, the circumflex"
    "notes":
      "n1": "The svarita, the circumflex, is marked by a short upright stroke above the syllable: here above अ (a). It is used for the circumflex of either kind, independent or following an acute (Whitney, section 87 a). The svarita is a union of a higher and a lower tone within one syllable (Whitney, section 81)."
      "n2": "The two signs are never a letter or a sound of their own; they mark a pitch. If you type the answer, the plain spelling अ (a) is accepted too."
  "vsn-0582":
    "native": "té, the acute, which has no sign"
    "notes":
      "n1": "The udātta ('raised'), the acute, is left unmarked in the Rigveda manuscripts' method (Whitney, section 87 a). So an unmarked syllable at the start of a word is to be understood as acute (Whitney, section 87 b): Whitney's example is ते (te), which he writes té."
  "vsn-0583":
    "native": "agním, the grave before an acute"
    "notes":
      "n1": "The sign under अ॒ (a) marks the grave; the acute, on ग्नि (gni), has no sign. This is Whitney's first example of the Rigveda method, written अ॒ग्निम् (agnim) agním."
  "vsn-0584":
    "native": "juhóti, a grave, an acute and a svarita"
    "notes":
      "n1": "Whitney's example of all three tones, written जु॒होति॑ (juhoti) juhóti: the grave on जु॒ (ju) has its stroke below, the acute on हो (ho) is unmarked, and the syllable after the acute is circumflex, marked above ति॑ (ti)."
  "vsn-0585":
    "native": "kvà, a svarita on one syllable"
    "notes":
      "n1": "The circumflex stands on a syllable in which a vowel is preceded by y or v standing for an originally acute i or u (Whitney, sections 83 and 84 b). Whitney's example, written क्व॑ (kva) kvà, comes from kúa (Whitney, section 84 b)."
  "vsn-0586":
    "native": "tanvā̀, a grave and a svarita"
    "notes":
      "n1": "A grave under त॒ (ta) and a circumflex above न्वा॑ (nvā). Whitney writes it त॒न्वा॑ (tanvā) tanvā̀; the circumflex comes from tanū́-ā (Whitney, section 84 b)."
  "vsn-0587":
    "native": "índraḥ, an acute at the start of a word"
    "notes":
      "n1": "The word begins with an unmarked syllable, which is acute (Whitney, section 87 b). The syllable after the acute is circumflex and has the sign above, here after न्द्रः (ndraḥ). Whitney writes it इन्द्रः॑ (indraḥ) índraḥ."
  "vsn-0588":
    "native": "kariṣyási, graves before an acute"
    "notes":
      "n1": "When several grave syllables stand before an acute at the beginning of a sentence, each one takes the stroke below: here under क॒ (ka) and रि॒ (ri) (Whitney, section 87 b). Whitney writes it क॒रि॒ष्यसि॑ (kariṣyasi) kariṣyási."
  "vsn-0589":
    "native": "tuvijātā́, three graves before an acute"
    "notes":
      "n1": "Three grave syllables, each with the stroke below, come before the acute, which stands on the last syllable and is unmarked (Whitney, section 87 b). Whitney writes it तु॒वि॒जा॒ता (tuvijātā) tuvijātā́."
  "vsn-0590":
    "native": "sudṛ́çīkasaṁdṛk, the graves after a svarita"
    "notes":
      "n1": "The grave syllables that follow a marked circumflex are left unmarked until another accent comes (Whitney, section 87 c). Here the stroke under सु॒ (su) is the only grave mark, the svarita sign is above शी॑ (śī), and the rest of the word is unmarked. Whitney writes it सु॒दृशी॑कसंदृक् (sudṛśīkasaṃdṛk) sudṛ́çīkasaṁdṛk."
