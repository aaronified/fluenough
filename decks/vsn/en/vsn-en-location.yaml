"name": "Location"
"description": "Within, before, behind, far, in the middle and beyond, from the Rigveda. Vedic Sanskrit in Devanagari; each reading is based on ISO 15919 and the pronunciation is reconstructed. Not yet checked by a Vedicist: please report any mistake."
"license": "CC-BY-SA-4.0"
"source": "Rigveda: Sanskrit text from sa.wikisource.org, hymn pages (read 2026-11-16); English from Griffith's translation of The Hymns of the Rigveda (1896), en.wikisource.org; grammar from Whitney's Sanskrit Grammar, en.wikisource.org (sections cited in the notes). Readings and IPA are written by the tool, not by hand."
"tags":
  - "unreviewed"
"cards":
  "vsn-1918":
    "native": "within"
    "notes":
      "attested": "Attested: यः सोमः कलशेष्वाँ अन्तः पवित्र आहितः (yaḥ somaḥ kalaśeṣvām̐ antaḥ pavitra āhitaḥ), RV 9.12.5. The Soma that is poured inside the jars and placed on the purifying sieve."
  "vsn-1919":
    "native": "before; in front"
    "notes":
      "n1": "Whitney, § 1078: पुरस् (puras) 'in front, forward' is used as a prefix with a few roots, especially कृ (kṛ), धा (dhā) and इ (i). Both पुरा (purā) and पुरस् (puras) mean 'forward from' and so 'before' (§ 293 b)."
      "attested": "Attested: भद्रं भवाति नः पुरः (bhadraṃ bhavāti naḥ puraḥ), RV 2.41.11. Let good things be before us still, and let Indra be gracious to us."
  "vsn-1920":
    "native": "behind; afterwards"
    "notes":
      "n1": "An ablative used adverbially, like दूरात् (dūrāt) and नीचात् (nīcāt), as Whitney notes (§ 1114). In this verse it is written fused into one word with पुरस्तात् (purastāt), अधरात् (adharāt) and उदक्तात् (udaktāt), so the example gives no base for it."
      "attested": "Attested: पश्चात्पुरस्तादधरादुदक्तात्कविः काव्येन परि पाहि राजन् (paścātpurastādadharādudaktātkaviḥ kāvyena pari pāhi rājan), RV 10.87.21. From behind, from in front, from below and from above, protect us, O king, as a sage."
  "vsn-1921":
    "native": "far"
    "bases":
      "दूरे": "far"
    "notes":
      "n1": "An inflected form of the stem दूर (far). The ablative दूरात् (dūrāt) is used in the same way as an adverb (Whitney, § 1114)."
      "attested": "Attested: दूरे चत्ताय च्छन्त्सद्गहनं यदिनक्षत् (dūre cattāya cchantsadgahanaṃ yadinakṣat), RV 1.132.6. Drive him far from us, and let him find his hiding place afar."
  "vsn-1922":
    "native": "in the middle"
    "bases":
      "मध्ये": "in the middle"
    "notes":
      "n1": "An inflected form of the stem मध्य (middle), as attested here: 'in the middle of the fountain'."
      "attested": "Attested: सिषक्त्यूधर्निण्योरुपस्थ उत्सस्य मध्ये निहितं पदं वेः (siṣaktyūdharniṇyorupastha utsasya madhye nihitaṃ padaṃ veḥ), RV 10.5.1. The bird has its place set in the middle of the fountain."
  "vsn-1923":
    "native": "far; beyond"
    "notes":
      "n1": "The verse writes परो (paro), with -o for the -aḥ of the nominative before a voiced sound."
      "attested": "Attested: तं नाकं चित्रशोचिषं मन्द्रं परो मनीषया (taṃ nākaṃ citraśociṣaṃ mandraṃ paro manīṣayā), RV 5.17.2. Set apart that vault of heaven, lovely beyond the thought of man."
