"rules":
  "vsn-rule-nominative":
    "name": "The nominative: the subject (prathamā, 'first')"
    "explanation": "The nominative is the case of the subject of the sentence, and of any word that qualifies the subject, whether attributively, in apposition or as predicate (Whitney §267). The Indian grammarians call it prathamā, 'first' (§266a). For 'god': {1} for one, {2} for two, {3} for many. Whitney writes the endings with a final s; before a pause a final s becomes visarga (Whitney §170a), so the forms with s are accepted too."
  "vsn-rule-accusative":
    "name": "The accusative: the object and the goal (dvitīyā, 'second')"
    "explanation": "The accusative is especially the case of the direct object of a transitive verb (Whitney §269): agním īḍe, 'I praise Agni' (§270). It is also the goal of motion, with verbs of going, bringing and sending (§274a). The grammarians call it dvitīyā, 'second' (§266a). For 'god': {1}, {2}, {3}. In the dual one form serves for the nominative, accusative and vocative (§308a)."
  "vsn-rule-instrumental":
    "name": "The instrumental: with, by"
    "explanation": "The instrumental is originally the with-case: it denotes adjacency, accompaniment and association, and passes into means and instrument as the English with passes into by (Whitney §278). Accompaniment: agnír devébhir ā́ gamat, 'may Agni come hither along with the gods' (§279). Means: bhadráṁ kárṇebhiḥ çṛṇuyāma, 'may we hear with our ears what is propitious' (§280). For 'god': {1}, {2}, {3}. One dual form serves for the instrumental, dative and ablative (§308a)."
  "vsn-rule-dative":
    "name": "The dative: to, for"
    "explanation": "The dative is the case of the indirect object, or of that toward or in the direction of or in order to or for which anything is or is done (Whitney §285). It goes with words meaning give, show, bow and the like (§286): yó ná dádāti sákhye, 'who gives not to a friend' (§286a). For 'god': {1}, {2}, {3}. In the plural the dative and the ablative are one form (§309e)."
  "vsn-rule-ablative":
    "name": "The ablative: from"
    "explanation": "The ablative is the from-case, in the various senses of that preposition: removal, separation, distinction, issue and the like (Whitney §289). pātáṁ no vṛ́kāt, 'save us from the wolf' (§290); çukrā́ kṛṣṇā́d ajaniṣṭa, 'the bright one has been born from the black one' (§291). For 'god': {1}, {2}, {3}. The special singular ending t (or d) belongs to a-stems only; everywhere else the ablative is identical with the genitive (§307f)."
  "vsn-rule-genitive":
    "name": "The genitive: of"
    "explanation": "The proper value of the genitive is adjectival: it belongs to a noun and qualifies it (Whitney §294a). Possession is the commonest use (§295): índrasya vájraḥ, 'Indra's thunderbolt'; pitā putrāṇām, 'father of sons'. For 'god': {1}, {2}, {3}. The genitive and the locative share one dual form (§308a)."
  "vsn-rule-locative":
    "name": "The locative: in, on, at"
    "explanation": "The locative is properly the in-case, the case of situation or location (Whitney §301a): párvatasya pṛṣṭhé, 'on the ridge of the mountain'; vidáthe santu devā́ḥ, 'may the gods be at the assembly' (§302a). For 'god': {1}, {2}, {3}."
  "vsn-rule-vocative":
    "name": "The vocative: addressing someone"
    "explanation": "The vocative is the case of address. Whitney counts eight cases with it (§266), and notes that the Indian grammarians do not name it as a case like the rest (§266a). It differs from the nominative in form only in the singular, and elsewhere only by accent (§308a, §309h). For 'god': {1} for one, {2} for two, {3} for many. Whitney §314: the vocative, if accented at all, is accented on the first syllable, and only at the beginning of a sentence or of a pāda (a quarter of a verse): ágne yáṁ yajñám paribhū́r ási, 'O Agni! whatever offering thou protectest' (§314c)."
