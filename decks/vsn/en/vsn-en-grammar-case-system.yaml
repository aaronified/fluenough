"name": "The eight cases and three numbers"
"description": "Vedic Sanskrit nouns have eight cases (nominative, accusative, instrumental, dative, ablative, genitive, locative, vocative) and three numbers: one, two and many (Whitney §264, §266). All 24 cells are shown on one word, देवः (devaḥ), 'god', in the forms of Whitney's paradigm (§330). The dual has only three different forms, and the plural vocative is the nominative. Not yet checked by a Vedicist: please report any mistake."
