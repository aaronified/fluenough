"name": "Multi-word verbs: preverb apart (tmesis)"
"description": "Seven preverb-and-verb pairs of the Rigveda in which the preverb stands apart from its verb, with the word that comes between them. Not yet checked by a Vedicist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "vsn-6204":
    "native": "to bring here"
    "notes":
      "u1": "The preverb आ (ā) and the verb वक्षति (vakṣati) are apart in RV 1.1.2: स देवाँ एह वक्षति (sa devām̐ eha vakṣati), where एह (eha), here comes between them."
    "bases":
      "आ": { "meaning": "hither, to" }
      "वक्षति": { "meaning": "brings" }
  "vsn-6205":
    "native": "to come to"
    "notes":
      "u1": "In RV 1.1.7 the preverb उप (upa) opens the verse and the verb ends the line: नमो भरन्त एमसि (namo bharanta emasi). Several words, the verse's second half, stand between them."
    "bases":
      "उप": { "meaning": "to, towards" }
      "एमसि": { "meaning": "we come" }
  "vsn-6206":
    "native": "to prop apart"
    "notes":
      "u1": "In RV 7.86.1 the word यः (yaḥ), who stands between the preverb and the verb: वि यस्तस्तम्भ रोदसी (vi yastastambha rodasī)."
    "bases":
      "वि": { "meaning": "apart, asunder" }
      "तस्तम्भ": { "meaning": "propped" }
  "vsn-6207":
    "native": "to push forth"
    "notes":
      "u1": "In RV 7.86.1 the object stands between the preverb and the verb: प्र नाकमृष्वं नुनुदे (pra nākamṛṣvaṃ nunude), where नाकमृष्वम् (nākamṛṣvam) (nākam ṛṣvam, the high sky) comes between them."
    "bases":
      "प्र": { "meaning": "forth, forward" }
      "नुनुदे": { "meaning": "pushed" }
  "vsn-6208":
    "native": "to set free"
    "notes":
      "u1": "In RV 7.86.5 the objects stand between the preverb and the verb: अव द्रुग्धानि पित्र्या सृजा (ava drugdhāni pitryā sṛjā), where द्रुग्धानि पित्र्या (drugdhāni pitryā), the wrongs of our fathers comes between them."
    "bases":
      "अव": { "meaning": "away, off" }
      "सृजा": { "meaning": "release" }
  "vsn-6209":
    "native": "to surround, embrace"
    "notes":
      "u1": "In RV 10.121.10 the word ता (tā), these stands between the preverb and the verb: विश्वा जातानि परि ता बभूव (viśvā jātāni pari tā babhūva)."
    "bases":
      "परि": { "meaning": "around, over" }
      "बभूव": { "meaning": "was" }
  "vsn-6210":
    "native": "to blow forth"
    "notes":
      "u1": "In RV 5.83.4 the subject stands between the preverb and the verb: प्र वाता वान्ति (pra vātā vānti), where वाता (vātā), the winds comes between them."
    "bases":
      "प्र": { "meaning": "forth" }
      "वान्ति": { "meaning": "blow" }
