"cards":
  "vsn-2523":
    "native": "A wolf."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
      "attested": "Attested: यो नः पूषन्नघो वृको दुःशेव आदिदेशति (yo naḥ pūṣannagho vṛko duḥśeva ādideśati), RV 1.42.2. Drive, Pusan, from our road the wolf, the wicked inauspicious wolf, who lies in wait to injure us."
  "vsn-2524":
    "native": "A hawk."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
      "attested": "Attested: श्येनो न योनिमासदत् (śyeno na yonimāsadat), RV 9.62.4. Hawk-like he settles in his home."
  "vsn-2525":
    "native": "A lion."
    "notes":
      "n1": "Its stem is {1}, an a-stem noun; the a-stems have no irregularities (Whitney §330, 331)."
      "attested": "Attested: स जिन्वते जठरेषु प्रजज्ञिवान्वृषा चित्रेषु नानदन्न सिंहः (sa jinvate jaṭhareṣu prajajñivānvṛṣā citreṣu nānadanna siṃhaḥ), RV 3.2.11. Born as a lion or a loudly-bellowing bull, he stirs with life in wombs dissimilar in kind."
  "vsn-2526":
    "native": "A wild beast, a deer."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
      "attested": "Attested: मा वो मृगो न यवसे जरिता भूदजोष्यः (mā vo mṛgo na yavase jaritā bhūdajoṣyaḥ), RV 1.38.5. Then never were your praisers loathed like a wild beast in pasture-land."
  "vsn-2527":
    "native": "A swan or a goose."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
      "attested": "Attested: आदीं हंसो यथा गणं विश्वस्यावीवशन्मतिम् (ādīṃ haṃso yathā gaṇaṃ viśvasyāvīvaśanmatim), RV 9.32.3. Now, like a swan, he makes all the company sing each his hymn."
  "vsn-2528":
    "native": "A frog."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
      "attested": "Attested: मण्डूको यदभिवृष्टः कनिष्कन्पृश्निः सम्पृङ्क्ते हरितेन वाचम् (maṇḍūko yadabhivṛṣṭaḥ kaniṣkanpṛśniḥ sampṛṅkte haritena vācam), RV 7.103.4. When the frog, moistened by the rain, springs forward, and Green and Spotty combine their voices."
