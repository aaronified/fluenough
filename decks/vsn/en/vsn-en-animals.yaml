"cards":
  "vsn-2523":
    "native": "A wolf."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
    "examples":
      "यो नः पूषन्नघो वृको दुःशेव आदिदेशति":
        "native": "Drive, Pusan, from our road the wolf, the wicked inauspicious wolf, who lies in wait to injure us."
        "bases":
          "वृको": "wolf"
  "vsn-2524":
    "native": "A hawk."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
    "examples":
      "श्येनो न योनिमासदत्":
        "native": "Hawk-like he settles in his home."
        "bases":
          "श्येनो": "hawk"
  "vsn-2525":
    "native": "A lion."
    "notes":
      "n1": "Its stem is {1}, an a-stem noun; the a-stems have no irregularities (Whitney §330, 331)."
    "examples":
      "स जिन्वते जठरेषु प्रजज्ञिवान्वृषा चित्रेषु नानदन्न सिंहः":
        "native": "Born as a lion or a loudly-bellowing bull, he stirs with life in wombs dissimilar in kind."
        "bases":
          "सिंहः": "lion"
  "vsn-2526":
    "native": "A wild beast, a deer."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
    "examples":
      "मा वो मृगो न यवसे जरिता भूदजोष्यः":
        "native": "Then never were your praisers loathed like a wild beast in pasture-land."
        "bases":
          "मृगो": "wild beast"
  "vsn-2527":
    "native": "A swan or a goose."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
    "examples":
      "आदीं हंसो यथा गणं विश्वस्यावीवशन्मतिम्":
        "native": "Now, like a swan, he makes all the company sing each his hymn."
        "bases":
          "हंसो": "swan"
  "vsn-2528":
    "native": "A frog."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
    "examples":
      "मण्डूको यदभिवृष्टः कनिष्कन्पृश्निः सम्पृङ्क्ते हरितेन वाचम्":
        "native": "When the frog, moistened by the rain, springs forward, and Green and Spotty combine their voices."
        "bases":
          "मण्डूको": "frog"
