schema: 1
id: "vsn-en-script-reading"
kind: "layer"
core: "vsn-script-reading"
native:
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
name: "Reading whole words"
description: "Reading the first words of the course in Devanagari: each word is first plain, then (for twenty-nine of them) with the accent marks of the Rigveda. The plain word is the one used everywhere else in the course; the marked word is the same word with its accent. Not yet checked by a Vedicist: please report any mistake."
license: "CC-BY-SA-4.0"
tags:
- "unreviewed"
cards:
  "vsn-0600":
    "native": "when?"
    "notes":
      "n1": "Read it syllable by syllable: क (ka) + दा (dā). A consonant with no sign carries the short a (Whitney, section 10 a)."
      "n2": "In this word: the vowel आ (ā) is written as a sign on the consonant before it, not as a letter (Whitney, section 10 b)."
