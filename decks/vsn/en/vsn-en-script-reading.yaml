  "vsn-0643":
    "native": "when?"
    "notes":
      "n1": "The accent marks are as the commentary on the sa.wikisource page for Rigveda hymn 1.25 quotes the line; the page names no edition. The mark on a word's last syllable can depend on the word after it (Whitney, sections 85 and 87 a)."
      "n2": "Here the grave sign is under क (ka); the acute, which has no sign, is on दा (dā). Whitney's rules: the grave sign comes on the syllable before an acute, and the acute is unmarked (Whitney, section 87 a)."
  "vsn-0644":
