      "n2": "Here the svarita sign is above ह (ha); the acute, which has no sign, is on कु (ku). Whitney's rules: an unmarked syllable at the start of a word is acute (Whitney, section 87 b); the syllable after an acute is circumflex and carries the svarita sign (Whitney, sections 85 and 87 a)."
