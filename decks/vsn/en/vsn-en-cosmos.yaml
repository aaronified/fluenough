"id": "vsn-en-cosmos"
"kind": "layer"
"core": "vsn-cosmos"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Cosmos"
"description": "Twenty-two words for the sky, earth, sun, dawn, waters and wind, each with its Griffith-based English line from the hymn. Not yet checked by a Vedicist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "vsn-1334":
    "native": "sky; heaven"
    "notes":
      "n1": "The plan records this noun as both masculine and feminine, so no gender is given. The nominative द्यौः (dyauḥ) (dyauḥ) is from the stem द्यु (dyu) (dyu); Whitney (§361) gives the other cases as divā (instrumental), diví (locative) and divás (genitive)."
    "bases":
      "द्यौः":
        "meaning": "sky, heaven"
    "examples":
      "सत्येनोत्तभिता भूमिः सूर्येणोत्तभिता द्यौः":
        "native": "The earth is held up by truth, and the heaven by the sun."
        "bases":
          "भूमिः": "earth"
          "द्यौः": "heaven"
  "vsn-1335":
    "native": "earth"
    "notes":
      "n1": "In this verse Griffith compares the earth holding fast the monarchs of the wood with holding a spirit fast."
    "examples":
      "यथेयं पृथिवी मही दाधारेमान्वनस्पतीन्":
        "native": "As this great earth holds fast the lords of the forest."
        "bases":
          "पृथिवी": "earth"
  "vsn-1336":
    "native": "earth; ground"
    "notes":
      "n1": "This word and द्यौः (dyauḥ) (dyauḥ) are in the same line of the verse, where truth holds the earth up and the sun holds the heaven up."
    "bases":
      "भूमिः":
        "meaning": "earth, ground"
    "examples":
      "सत्येनोत्तभिता भूमिः सूर्येणोत्तभिता द्यौः":
        "native": "Truth holds up the earth, and the sun holds up the heavens."
        "bases":
          "भूमिः": "earth"
          "द्यौः": "heaven"
  "vsn-1337":
    "native": "heaven and earth"
    "notes":
      "n1": "रोदसी (rodasī) (rodasī) is a dual: the two, heaven and earth, written as one word."
    "examples":
      "इन्द्रश्चर्मेव रोदसी":
        "native": "Indra drew heaven and earth together like a skin."
        "bases":
          "रोदसी": "heaven and earth"
  "vsn-1338":
    "native": "sun"
    "notes":
      "n1": "The line writes सूर्यो (sūryo) (sūryo) for सूर्यः (sūryaḥ) before a sonant (Whitney §175a). In this verse Griffith has Soma flow like the sun for us to see."
    "examples":
      "पवस्व सूर्यो दृशे":
        "native": "Flow like the sun, so that we may see."
        "bases":
          "पवस्व": "to flow; purify (you flow)"
          "सूर्यो": "sun"
          "दृशे": "for seeing"
  "vsn-1339":
    "native": "dawn"
    "notes":
      "n1": "The stem is उषस् (uṣas) (uṣas), and the nominative is उषाः (uṣāḥ) (uṣāḥ). Whitney (§415) says the stem has a long ā in the strong cases, as in the accusative usasam."
    "bases":
      "उषाः":
        "meaning": "dawn"
    "examples":
      "उषाः सूर्यो न रश्मिभिः":
        "native": "Like the dawn, like the sun with its beams."
        "bases":
          "उषाः": "dawn"
          "सूर्यो": "sun"
          "न": "like"
          "रश्मिभिः": "with rays"
  "vsn-1340":
    "native": "star"
    "notes":
      "n1": "The line writes नक्षत्रं (nakṣatraṃ) with an anusvara for the final -m, the usual spelling of the headword नक्षत्रम् (nakṣatram). In this verse Griffith calls it the ancient star that wanders on for ever."
    "examples":
      "नक्षत्रं प्रत्नममिनच्चरिष्णु यक्षस्याध्यक्षं तविषं बृहन्तम्":
        "native": "The ancient star wanders on for ever."
        "bases":
          "नक्षत्रं": "star"
  "vsn-1341":
    "native": "wind"
    "notes":
      "n1": "The line writes वातो (vāto) (vāto) for वातः (vātaḥ) before a sonant (Whitney §175a). Weak attestation: the verse's English does not name the wind, so 'wind' is the word's ordinary sense (see the review queue)."
    "examples":
      "शं वातो वात्वरपा अप स्रिधः":
        "native": "May the wind blow gently and drive our foes away."
        "bases":
          "शं": "well; gently"
          "वातो": "wind"
          "अप": "away"
  "vsn-1342":
    "native": "light"
    "notes":
      "n1": "Weak attestation: the verse speaks of the light that lay in darkness, so 'light' is the word's ordinary sense (see the review queue). The stem is ज्योतिस् (jyotis) (jyotis)."
    "bases":
      "ज्योतिः":
        "meaning": "light"
    "examples":
      "गूळ्हं ज्योतिः पितरो अन्वविन्दन्सत्यमन्त्रा अजनयन्नुषासम्":
        "native": "The fathers found the light that lay hidden in darkness."
        "bases":
          "गूळ्हं": "hidden"
          "पितरो": "fathers"
  "vsn-1343":
    "native": "darkness"
    "notes":
      "n1": "The stem is तमस् (tamas) (tamas), and the card teaches the nominative तमः (tamaḥ) (tamaḥ)."
    "bases":
      "तमः":
        "meaning": "darkness"
    "examples":
      "अपेदु हासते तमः":
        "native": "Then the darkness vanishes."
        "bases":
          "हासते": "to leave (it vanishes)"
          "तमः": "darkness"
  "vsn-1344":
    "native": "cloud"
    "notes":
      "n1": "The line writes मेघो (megho) (megho) for मेघः (meghaḥ) before a sonant (Whitney §175a)."
    "examples":
      "वृषा वां मेघो वृषणा पीपाय गोर्न सेके मनुषो दशस्यन्":
        "native": "Your strong rain-cloud, O mighty ones, has swollen."
        "bases":
          "वृषा": "strong"
          "वां": "you (two)"
          "मेघो": "cloud"
  "vsn-1345":
    "native": "sea"
    "notes":
      "n1": "In this verse Griffith compares Soma to a sea: 'thou swellest like a sea'."
    "examples":
      "समुद्रः सोम पिन्वसे":
        "native": "Soma, you swell like a sea."
        "bases":
          "समुद्रः": "sea"
          "सोम": "Soma"
          "पिन्वसे": "to swell (you swell)"
  "vsn-1346":
    "native": "mountain"
    "notes":
      "n1": "The line writes पर्वतो (parvato) (parvato) for पर्वतः (parvataḥ) before a sonant (Whitney §175a). In this verse Griffith's 'rugged-jointed mountain' yields."
    "examples":
      "जिहीत पर्वतो गिरिः":
        "native": "The rugged-jointed mountain yields."
        "bases":
          "जिहीत": "to yield (it yields)"
          "पर्वतो": "mountain"
  "vsn-1347":
    "native": "stone; mountain"
    "notes":
      "n1": "Weak attestation: in this verse Griffith's English is the pressing-stone, grasped like a hand-guided steed, so 'stone, mountain' is the word's ordinary sense (see the review queue)."
    "examples":
      "तदु श्रेष्ठं सवनं सुनोतनात्यो न हस्तयतो अद्रिः सोतरि":
        "native": "Press out the libation, the best of all; the pressing-stone is held like a steed."
        "bases":
          "श्रेष्ठं": "best"
          "सवनं": "libation"
          "न": "like"
          "अद्रिः": "stone"
  "vsn-1348":
    "native": "heaven; sunlight"
    "notes":
      "n1": "Weak attestation: in this verse Griffith has the Sun, not heaven, so 'heaven, sun-light' is the word's ordinary sense (see the review queue). The stem is स्वर् (svar) (svar)."
    "bases":
      "स्वः":
        "meaning": "heaven; sunlight"
    "examples":
      "अविन्दद्गा अपः स्वः":
        "native": "He found the cows, the waters and the sun."
        "bases":
          "अपः": "waters"
          "स्वः": "sun"
  "vsn-1349":
    "native": "lightning"
    "notes":
      "n1": "The line writes the word विद्युत्स्तनयन्त्यभ्रैः (vidyutstanayantyabhraiḥ) as one fused word with the next word; the card is its first part. In this verse Griffith has Soma's stream like lightning thundering through the clouds."
    "examples":
      "दिवो न विद्युत्स्तनयन्त्यभ्रैः सोमस्य ते पवत इन्द्र धारा":
        "native": "Like lightning through the sky, Soma's stream flows for you, Indra."
        "bases":
          "दिवो": "of the sky"
          "न": "like"
          "सोमस्य": "of Soma"
          "ते": "your"
          "पवत": "flows (it flows)"
          "इन्द्र": "Indra"
          "धारा": "stream"
  "vsn-1350":
    "native": "rivers"
    "notes":
      "n1": "The card teaches the nominative plural सिन्धवः (sindhavaḥ) (sindhavaḥ) of the stem सिन्धु (sindhu) (sindhu)."
    "bases":
      "सिन्धवः":
        "meaning": "rivers"
    "examples":
      "समुद्रायेव सिन्धवः":
        "native": "As rivers bow to the sea."
        "bases":
          "सिन्धवः": "rivers"
  "vsn-1351":
    "native": "rivers"
    "notes":
      "n1": "The card teaches the nominative plural नद्यः (nadyaḥ) (nadyaḥ) of the stem नदी (nadī) (nadī). Its sense is the same as सिन्धवः (sindhavaḥ) (sindhavaḥ) in the card before."
    "bases":
      "नद्यः":
        "meaning": "rivers"
    "examples":
      "स सप्त धीतिभिर्हितो नद्यो अजिन्वदद्रुहः":
        "native": "Urged by seven devotions, he stirred the guileless rivers."
        "bases":
          "स": "he"
          "सप्त": "seven"
          "नद्यो": "rivers"
  "vsn-1352":
    "native": "tree"
    "notes":
      "n1": "The line writes वृक्ष (vṛkṣa) without its final -ḥ, the stem form; the headword वृक्षः (vṛkṣaḥ) is its nominative. In this verse Griffith asks what the tree was from which the earth and heaven were fashioned."
    "examples":
      "किं स्विद्वनं क उ स वृक्ष आस यतो द्यावापृथिवी निष्टतक्षुः":
        "native": "What was the tree, and what wood was it, from which they shaped heaven and earth?"
        "bases":
          "किं": "what"
          "क": "who"
          "उ": "(particle)"
          "स": "he"
          "वृक्ष": "tree"
          "आस": "was"
  "vsn-1353":
    "native": "tree; lord of the forest"
    "notes":
      "n1": "In this verse Griffith renders the word as 'the forest trees', named with the mountains as shaking at the approach of the gods."
    "examples":
      "अच्युता चिद्वो अज्मन्ना नानदति पर्वतासो वनस्पतिः":
        "native": "Even unmoving things shake: the mountains and the forest trees reel."
        "bases":
          "अच्युता": "unshaken"
          "पर्वतासो": "mountains"
          "वनस्पतिः": "forest tree"
  "vsn-1354":
    "native": "of the moon"
    "notes":
      "n1": "The card teaches the genitive singular चन्द्रमसः (candramasaḥ) (candramasaḥ), 'of the moon', of the stem चन्द्रमस् (candramas) (candramas). The line writes चन्द्रमसो (candramaso) (candramaso) before a sonant."
    "bases":
      "चन्द्रमसः":
        "meaning": "of the moon"
    "examples":
      "इत्था चन्द्रमसो गृहे":
        "native": "Here, in the moon's house, they recognised it."
        "bases":
          "इत्था": "thus"
          "चन्द्रमसो": "of the moon"
          "गृहे": "in the house"
  "vsn-1355":
    "native": "flood"
    "notes":
      "n1": "In this verse Griffith calls it 'the billowy flood of sea', which arose with the night."
    "examples":
      "ततो रात्र्यजायत ततः समुद्रो अर्णवः":
        "native": "Thence the night was born, and thence the sea, the billowy flood."
        "bases":
          "ततः": "thence"
          "समुद्रो": "sea"
          "अर्णवः": "flood"
