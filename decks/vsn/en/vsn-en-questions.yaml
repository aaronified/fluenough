name: "Questions"
description: "Five words for asking: when, how, where, how many, and for whom. Vedic Sanskrit in Devanagari; each reading is based on ISO 15919 and the pronunciation is reconstructed. Not yet checked by a Vedicist: please report any mistake."
license: "CC-BY-SA-4.0"
tags:
- "unreviewed"
cards:
  "vsn-1000":
    "native": "when?"
    "notes":
      "n1": "Made from the interrogative root ka-, like कथा (kathā) and कुह (kuha) (Whitney, section 505). Adding ca, cid or api turns it into an indefinite, any one (Whitney, section 507)."
    "examples":
      "कदा क्षत्रश्रियं नरमा वरुणं करामहे":
        "native": "When shall we bring Varuna, lord of warrior might, to be appeased?"
  "vsn-1001":
    "native": "how?"
    "notes":
      "n1": "Made from the interrogative root ka-, like कदा (kadā) (Whitney, section 505)."
    "examples":
      "कथा विधात्यप्रचेताः":
        "native": "How does the one without understanding perform it?"
  "vsn-1002":
    "native": "where?"
    "notes":
      "n1": "Made from the interrogative root ku-, like कुत्र (kutra) (Whitney, section 505)."
    "examples":
      "स्वं वव्रिं कुह धित्सथः":
        "native": "Where will you show your form?"
  "vsn-1003":
    "native": "how many?"
    "notes":
      "n1": "Made from the interrogative root ka-, like कथा (kathā) and कदा (kadā) (Whitney, section 505)."
    "examples":
      "कत्यग्नयः कति सूर्यासः कत्युषासः कत्यु स्विदापः":
        "native": "How many fires and suns are there, and how many dawns and waters?"
  "vsn-1004":
    "native": "for whom?"
    "notes":
      "n1": "The form is built on the interrogative stem ka-; its nominative masculine is कः (kaḥ) (Whitney, section 504 a). The plan's gloss is 'for whom'; this is the attested form, not the nominative."
    "bases":
      "कस्मै": "for whom"
    "examples":
      "कस्मै सस्रुः सुदासे अन्वापय इळाभिर्वृष्टयः सह":
        "native": "For whom did the rains flow down, with the food of sacrifice, for bountiful Sudas?"
        "bases":
          "कस्मै": "for whom"
