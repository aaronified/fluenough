"name": "More verbs"
"description": "Fourteen verbs of the Rigveda: sacrifice, call, guard, win, milk, praise, place, lead, follow, think, go and diminish. Vedic Sanskrit in Devanagari; each reading is based on ISO 15919 and the pronunciation is reconstructed. Not yet checked by a Vedicist: please report any mistake."
"license": "CC-BY-SA-4.0"
"source": "Rigveda: Sanskrit text from sa.wikisource.org, hymn pages (read 2026-11-16); English from Griffith's translation of The Hymns of the Rigveda (1896), en.wikisource.org; grammar from Whitney's Sanskrit Grammar, en.wikisource.org (sections cited in the notes). Readings and IPA are written by the tool, not by hand."
"tags":
  - "unreviewed"
"cards":
  "vsn-1924":
    "native": "sacrifices"
    "bases":
      "यजति": "to sacrifice"
    "notes":
      "attested": "Attested: द्यौश्च यं पृथिवी वावृधाते आ यं होता यजति विश्ववारम् (dyauśca yaṃ pṛthivī vāvṛdhāte ā yaṃ hotā yajati viśvavāram), RV 7.7.5. The Hotar worships him, the giver of every boon."
  "vsn-1925":
    "native": "calls"
    "bases":
      "हवते": "to call"
    "notes":
      "attested": "Attested: अग्निमुषसमश्विना दधिक्रां व्युष्टिषु हवते वह्निरुक्थैः (agnimuṣasamaśvinā dadhikrāṃ vyuṣṭiṣu havate vahnirukthaiḥ), RV 3.20.1. At the break of day the priest calls on Agni, Dawn, Dadhikras and the Asvins."
  "vsn-1926":
    "native": "I call"
    "bases":
      "हुवे": "to call"
    "notes":
      "n1": "The attested form is first person, 'I call', so the card is not the third singular of the root ह्वे (hve). The plan keeps the form as attested; the third singular is not written here."
      "attested": "Attested: हुवे सुशिप्रमूतये (huve suśipramūtaye), RV 8.32.4. I call the fair-visored god to help, as bold Soma does."
  "vsn-1927":
    "native": "guards"
    "bases":
      "रक्षति": "to guard"
    "notes":
      "attested": "Attested: विश्वामित्रस्य रक्षति ब्रह्मेदं भारतं जनम् (viśvāmitrasya rakṣati brahmedaṃ bhārataṃ janam), RV 3.53.12. This prayer of Vishvamitra keeps the race of the Bharatas safe."
  "vsn-1928":
    "native": "wins"
    "bases":
      "जयति": "to win"
    "notes":
      "attested": "Attested: इषुधिः सङ्काः पृतनाश्च सर्वाः पृष्ठे निनद्धो जयति प्रसूतः (iṣudhiḥ saṅkāḥ pṛtanāśca sarvāḥ pṛṣṭhe ninaddho jayati prasūtaḥ), RV 6.75.5. The quiver, slung on the back, vanquishes all opposing bands and armies."
  "vsn-1929":
    "native": "milks"
    "bases":
      "दुहे": "to milk"
    "notes":
      "n1": "The attested form is first person, 'I milk', as in the plan. The root दुह् (duh) has special irregularities in the older language (Whitney, § 635)."
      "attested": "Attested: इळा धेनुमती दुहे (iḷā dhenumatī duhe), RV 8.31.4. Each day his libation flows in his house, rich in milk."
  "vsn-1930":
    "native": "I praise"
    "bases":
      "ईळे": "to praise"
    "notes":
      "n1": "The attested form is first person, 'I praise', as in the plan. The root īḍ inserts a union-vowel i before some endings (Whitney, § 630)."
      "attested": "Attested: ईळे अग्निं विपश्चितं गिरा यज्ञस्य साधनम् (īḷe agniṃ vipaścitaṃ girā yajñasya sādhanam), RV 3.27.2. I praise Agni, the wise sage, who accomplishes the sacrifice through song."
  "vsn-1931":
    "native": "diminishes"
    "bases":
      "मिनाति": "to diminish"
    "notes":
      "attested": "Attested: दिशः सूर्यो न मिनाति प्रदिष्टा दिवेदिवे हर्यश्वप्रसूताः (diśaḥ sūryo na mināti pradiṣṭā divedive haryaśvaprasūtāḥ), RV 3.30.12. The sun does not transgress the ordered limits of the quarters."
  "vsn-1932":
    "native": "places"
    "bases":
      "दधाति": "to place"
    "notes":
      "attested": "Attested: दधाति रत्नं विधते सुवीर्यमग्निर्जनाय दाशुषे (dadhāti ratnaṃ vidhate suvīryamagnirjanāya dāśuṣe), RV 7.16.12. Agni gives treasure and strong valour to the worshipper who brings gifts."
  "vsn-1933":
    "native": "leads"
    "bases":
      "नयति": "to lead"
    "notes":
      "attested": "Attested: यो अस्मै हव्यैर्घृतवद्भिरविधत्प्र तं प्राचा नयति ब्रह्मणस्पतिः (yo asmai havyairghṛtavadbhiravidhatpra taṃ prācā nayati brahmaṇaspatiḥ), RV 2.26.4. Brahmanaspati leads forward on his way the one who honours him with offerings rich in oil."
  "vsn-1934":
    "native": "follows"
    "bases":
      "सचते": "to follow"
    "notes":
      "n1": "The attested form is third person middle, as in the plan; the active third singular is not written here. In the verse it reads 'goes girt as with a thousand men of war'."
      "attested": "Attested: सहस्रेणेव सचते यवीयुधा यस्त आनळुपस्तुतिम् (sahasreṇeva sacate yavīyudhā yasta ānaḷupastutim), RV 8.4.6. Whoever gains your aid goes forth as if with a thousand fighting men."
  "vsn-1935":
    "native": "thinks"
    "bases":
      "मन्यते": "to think"
    "notes":
      "n1": "The attested form is third person middle, as in the plan; the active third singular is not written here."
      "attested": "Attested: सोमं मन्यते पपिवान्यत्सम्पिंषन्त्योषधिम् (somaṃ manyate papivānyatsampiṃṣantyoṣadhim), RV 10.85.3. One thinks, when they have crushed the plant, that he has drunk the Soma."
  "vsn-1936":
    "native": "goes"
    "bases":
      "जिगाति": "to go"
    "notes":
      "attested": "Attested: वायो तव प्रपृञ्चती धेना जिगाति दाशुषे (vāyo tava prapṛñcatī dhenā jigāti dāśuṣe), RV 1.2.3. Vayu, your far-spreading stream goes forth to the worshipper."
  "vsn-1937":
    "native": "wins"
    "bases":
      "वनोति": "to win"
    "notes":
      "attested": "Attested: वनोति हि सुन्वन्क्षयं परीणसः सुन्वानो हि ष्मा यजत्यव द्विषो देवानामव द्विषः (vanoti hi sunvankṣayaṃ parīṇasaḥ sunvāno hi ṣmā yajatyava dviṣo devānāmava dviṣaḥ), RV 1.133.7. The one who pours libations wins a home of wealth and turns away enmity, even that of the gods."
