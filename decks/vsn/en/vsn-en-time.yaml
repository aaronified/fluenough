  "name": "English"
"name": "Time"
"description": "Day, night, year, month, autumn, age and spring, from the Rigveda. Vedic Sanskrit in Devanagari; each reading is based on ISO 15919 and the pronunciation is reconstructed. Not yet checked by a Vedicist: please report any mistake."
"license": "CC-BY-SA-4.0"
"source": "Rigveda: Sanskrit text from sa.wikisource.org, hymn pages (read 2026-11-16); English from Griffith's translation of The Hymns of the Rigveda (1896), en.wikisource.org; grammar from Whitney's Sanskrit Grammar, en.wikisource.org (sections cited in the notes). Readings and IPA are written by the tool, not by hand."
"tags":
  - "unreviewed"
"cards":
  "vsn-1910":
    "native": "day"
    "notes":
      "n1": "The stem is अहन् (ahan). Whitney says the noun अहन् (ahan), 'day', takes अहर् (ahar) or अहस् (ahas) in the middle cases and the nominative, with अह्ना (ahnā) and अह्नि (ahni) as the weak forms (§ 430 a). Weak: the gloss rests on the word's ordinary sense; the reviewer checks it against the verse."
      "attested": "Attested: चक्रुर्दिवो बृहतो गातुमस्मे अहः स्वर्विविदुः केतुमुस्राः (cakrurdivo bṛhato gātumasme ahaḥ svarvividuḥ ketumusrāḥ), RV 1.71.2. They made a way for us and found the day, the light, and the sign of morning."
  "vsn-1911":
    "native": "by day"
    "notes":
      "n1": "Whitney gives the instrumental of दिव् (div), 'sky, day', as दिवा (divā) (§ 361); the adverb has the same form."
      "attested": "Attested: दिवा नक्तमदाभ्य (divā naktamadābhya), RV 7.15.15. Keep us safe by day and by night, you who cannot be deceived."
  "vsn-1912":
    "native": "by night"
    "notes":
      "n1": "Whitney lists नक्तम् (naktam), 'by night', among the adverbs in -am (§ 1111)."
      "attested": "Attested: शचीभिर्नः शचीवसू दिवा नक्तं दशस्यतम् (śacībhirnaḥ śacīvasū divā naktaṃ daśasyatam), RV 1.139.5. Rich in strength, give us blessings by day and by night."
  "vsn-1913":
    "native": "year"
    "bases":
      "संवत्सरम्": "year"
    "notes":
      "n1": "The verse writes संवत्सरं (saṃvatsaraṃ), with anusvara for the final m. The stem is संवत्सर (saṃvatsara)."
      "attested": "Attested: संवत्सरं शशयाना ब्राह्मणा व्रतचारिणः (saṃvatsaraṃ śaśayānā brāhmaṇā vratacāriṇaḥ), RV 7.103.1. Brahmans who keep their vows lay quiet for a whole year."
  "vsn-1914":
    "native": "month"
    "notes":
      "n1": "The verse writes मासो (māso), with -o for the -aḥ of the nominative before a voiced sound. Weak: the gloss rests on the word's ordinary sense; the verse says 'ten months'."
      "attested": "Attested: अनूनोदत्र हस्तयतो अद्रिरार्चन्येन दश मासो नवग्वाः (anūnodatra hastayato adrirārcanyena daśa māso navagvāḥ), RV 5.45.7. The Navagvas sang praise for ten months with the pressing stone."
  "vsn-1915":
    "native": "autumn; year"
    "bases":
      "शरदः": "autumn; year"
    "notes":
      "n1": "An inflected form of the stem शरद् (feminine), as attested in 'a hundred autumns'. Weak: the gloss 'autumn, year' rests on the word's ordinary sense."
      "attested": "Attested: दीर्घायुरस्या यः पतिर्जीवाति शरदः शतम् (dīrghāyurasyā yaḥ patirjīvāti śaradaḥ śatam), RV 10.85.39. Let her husband live long, a hundred autumns."
  "vsn-1916":
    "native": "age"
    "bases":
      "युगे": "age"
    "notes":
      "n1": "An inflected form of the stem युग (age), as attested here. Weak: the gloss rests on the word's ordinary sense; the verse speaks of the earliest age of the gods."
      "attested": "Attested: देवानां युगे प्रथमेऽसतः सदजायत (devānāṃ yuge prathame'sataḥ sadajāyata), RV 10.72.3. In the earliest age of the gods, being was born from non-being."
  "vsn-1917":
    "native": "spring"
    "notes":
      "n1": "The verse writes वसन्तो (vasanto), with -o for the -aḥ of the nominative before a voiced sound."
      "attested": "Attested: वसन्तो अस्यासीदाज्यं ग्रीष्म इध्मः शरद्धविः (vasanto asyāsīdājyaṃ grīṣma idhmaḥ śaraddhaviḥ), RV 10.90.6. Spring was its butter, summer its fuel, and autumn its offering."
