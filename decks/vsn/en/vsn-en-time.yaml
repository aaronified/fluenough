  "name": "English"
"name": "Time"
"description": "Day, night, year, month, autumn, age and spring, from the Rigveda. Vedic Sanskrit in Devanagari; each reading is based on ISO 15919 and the pronunciation is reconstructed. Not yet checked by a Vedicist: please report any mistake."
"license": "CC-BY-SA-4.0"
"source": "Rigveda: Sanskrit text from sa.wikisource.org, hymn pages (read 2026-11-16); English from Griffith's translation of The Hymns of the Rigveda (1896), en.wikisource.org; grammar from Whitney's Sanskrit Grammar, en.wikisource.org (sections cited in the notes). Readings and IPA are written by the tool, not by hand."
"tags":
  - "unreviewed"
"cards":
  "vsn-1910":
    "native": "day"
    "notes":
      "n1": "The stem is अहन् (ahan). Whitney says the noun áhan, 'day', takes áhar or áhas in the middle cases and the nominative, with अह्ना (ahnā) and अह्नि (ahni) as the weak forms (§ 430 a). Weak: the gloss rests on the word's ordinary sense; the reviewer checks it against the verse."
    "examples":
      "चक्रुर्दिवो बृहतो गातुमस्मे अहः स्वर्विविदुः केतुमुस्राः":
        "native": "They made a way for us and found the day, the light, and the sign of morning."
        "bases":
          "अहः": "day"
  "vsn-1911":
    "native": "by day"
    "notes":
      "n1": "Whitney gives the instrumental of दिव् (div), 'sky, day', as divā́ (§ 361); the adverb has the same form."
    "examples":
      "दिवा नक्तमदाभ्य": "Keep us safe by day and by night, you who cannot be deceived."
  "vsn-1912":
    "native": "by night"
    "notes":
      "n1": "Whitney lists náktam, 'by night', among the adverbs in -am (§ 1111)."
    "examples":
      "शचीभिर्नः शचीवसू दिवा नक्तं दशस्यतम्":
        "native": "Rich in strength, give us blessings by day and by night."
        "bases":
          "नक्तं": "by night"
  "vsn-1913":
    "native": "year"
    "bases":
      "संवत्सरम्": "year"
    "notes":
      "n1": "The verse writes संवत्सरं (saṃvatsaraṃ), with anusvara for the final m. The stem is संवत्सर (saṃvatsara)."
    "examples":
      "संवत्सरं शशयाना ब्राह्मणा व्रतचारिणः":
        "native": "Brahmans who keep their vows lay quiet for a whole year."
        "bases":
          "संवत्सरं": "year"
  "vsn-1914":
    "native": "month"
    "notes":
      "n1": "The verse writes मासो (māso), with -o for the -aḥ of the nominative before a voiced sound. Weak: the gloss rests on the word's ordinary sense; the verse says 'ten months'."
    "examples":
      "अनूनोदत्र हस्तयतो अद्रिरार्चन्येन दश मासो नवग्वाः":
        "native": "The Navagvas sang praise for ten months with the pressing stone."
        "bases":
          "मासो": "month"
  "vsn-1915":
    "native": "autumn; year"
    "bases":
      "शरदः": "autumn; year"
    "notes":
      "n1": "An inflected form of the stem शरद् (feminine), as attested in 'a hundred autumns'. Weak: the gloss 'autumn, year' rests on the word's ordinary sense."
    "examples":
      "दीर्घायुरस्या यः पतिर्जीवाति शरदः शतम्":
        "native": "Let her husband live long, a hundred autumns."
        "bases":
          "शरदः": "autumn; year"
  "vsn-1916":
    "native": "age"
    "bases":
      "युगे": "age"
    "notes":
      "n1": "An inflected form of the stem युग (age), as attested here. Weak: the gloss rests on the word's ordinary sense; the verse speaks of the earliest age of the gods."
    "examples":
      "देवानां युगे प्रथमेऽसतः सदजायत":
        "native": "In the earliest age of the gods, being was born from non-being."
        "bases":
          "युगे": "age"
  "vsn-1917":
    "native": "spring"
    "notes":
      "n1": "The verse writes वसन्तो (vasanto), with -o for the -aḥ of the nominative before a voiced sound."
    "examples":
      "वसन्तो अस्यासीदाज्यं ग्रीष्म इध्मः शरद्धविः":
        "native": "Spring was its butter, summer its fuel, and autumn its offering."
        "bases":
          "वसन्तो": "spring"
