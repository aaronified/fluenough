"tags":
- "unreviewed"
"cards":
  "vsn-1632":
    "native": "invoking priest"
    "notes":
      "n1": "The stem is होतृ (hotṛ)."
      "attested": "Attested: असि होता मनुर्हितः (asi hotā manurhitaḥ), RV 1.13.4. You are the invoking priest, appointed by Manu."
    "bases":
      "होता":
        "meaning": "invoking priest"
  "vsn-1633":
    "native": "family priest"
    "notes":
      "attested": "Attested: अग्निर्ऋषिः पवमानः पाञ्चजन्यः पुरोहितः (agnirṛṣiḥ pavamānaḥ pāñcajanyaḥ purohitaḥ), RV 9.66.20. Agni is the sage, the purifier, the chief priest of the five peoples."
  "vsn-1634":
    "native": "Soma"
    "notes":
      "n1": "In the line it is written सोमो (somo), with -o for -aḥ before a sonant."
      "attested": "Attested: सोमो वाजमिवासरत् (somo vājamivāsarat), RV 9.37.5. Soma has flowed on, as it were to win the prize."
  "vsn-1635":
    "native": "oblation"
    "notes":
      "n1": "The stem is हविस् (havis). Havis is a model of the neuter s-stems: nominative-accusative havis, instrumental havisa (Whitney, section 414)."
    "bases":
      "हविः":
        "meaning": "oblation"
    "examples":
      "स्वाहा देवेभ्यो हविः":
        "native": "The oblation, with svaha, is brought to the gods."
        "bases":
          "देवेभ्यो": "god"
  "vsn-1636":
    "native": "sacrificial grass"
    "notes":
      "n1": "The stem is बर्हिस् (barhis)."
      "attested": "Attested: बर्हिः सीदन्त्वस्रिधः (barhiḥ sīdantvasridhaḥ), RV 5.5.8. Let them sit harmless on the grass."
    "bases":
      "बर्हिः":
        "meaning": "sacrificial grass"
  "vsn-1637":
    "native": "altar"
    "notes":
      "attested": "Attested: इयं वेदिः परो अन्तः पृथिव्या अयं यज्ञो भुवनस्य नाभिः (iyaṃ vediḥ paro antaḥ pṛthivyā ayaṃ yajño bhuvanasya nābhiḥ), RV 1.164.35. This altar is the farthest end of the earth; this sacrifice is the navel of the world."
  "vsn-1638":
    "native": "sacrificial gift"
    "notes":
      "attested": "Attested: ज्योतिर्न विश्वमभ्यस्ति दक्षिणा (jyotirna viśvamabhyasti dakṣiṇā), RV 8.24.21. Bounty, like light, reaches over all."
  "vsn-1639":
    "native": "svaha (offering call)"
    "notes":
      "n1": "Exclamations used at the sacrifice, mostly ending in -a, include svaha, svadha and vashat (Whitney, section 1091)."
    "examples":
      "स्वाहा देवेभ्यो हविः":
        "native": "The oblation, with svaha, is brought to the gods."
        "bases":
          "देवेभ्यो": "god"
  "vsn-1640":
    "native": "offered; poured on the fire"
    "notes":
      "n1": "The stem is आहुत (āhuta)."
      "n2": "The verse does not prove this sense plainly: 'offered' is the word's usual sense, not one the line shows."
      "attested": "Attested: उदग्ने तव तद्घृतादर्ची रोचत आहुतम् (udagne tava tadghṛtādarcī rocata āhutam), RV 8.43.10. Your flame, offered to, shines from the holy ghee."
    "bases":
      "आहुतम्":
        "meaning": "offered"
  "vsn-1641":
    "native": "pressed (Soma)"
    "notes":
      "n1": "Said of Soma when it has been pressed."
    "examples":
      "धारया पवते सुतः":
        "native": "The pressed Soma flows on in its stream."
        "bases":
          "धारया": "stream"
          "पवते": "to purify; to flow"
  "vsn-1642":
    "native": "pressing; Soma-pressing"
    "notes":
      "n1": "In the line it is written सवनं (savanaṃ), with the anusvara for final m; the stem is सवन (savana)."
      "attested": "Attested: अथा सुनुध्वं सवनं मदाय पात ऋभवो मधुनः सोम्यस्य (athā sunudhvaṃ savanaṃ madāya pāta ṛbhavo madhunaḥ somyasya), RV 4.35.4. Now press the liquor for gladness, and drink, O Rbhus, of Soma's mead."
  "vsn-1643":
    "native": "strainer"
    "notes":
      "n1": "In the line it is written पवित्रं (pavitraṃ), with the anusvara for final m; the stem is पवित्र (pavitra)."
      "attested": "Attested: तिरः पवित्रं ससृवांस आशवो मन्दन्तु तुग्र्यावृधः (tiraḥ pavitraṃ sasṛvāṃsa āśavo mandantu tugryāvṛdhaḥ), RV 8.1.15. Let the swift drops that have flowed through the strainer rejoice and gladden."
  "vsn-1644":
    "native": "adhvaryu priests"
    "notes":
      "n1": "A plural; the stem is अध्वर्यु (adhvaryu), and the line writes अध्वर्यवो (adhvaryavo), with -o for -aḥ before a sonant."
      "attested": "Attested: अध्वर्यवो हविष्मन्तो हि भूताच्छाप इतोशतीरुशन्तः (adhvaryavo haviṣmanto hi bhūtācchāpa itośatīruśantaḥ), RV 10.30.2. Adhvaryus, you who bring oblations, come with longing to the waters."
    "bases":
      "अध्वर्यवः":
        "meaning": "adhvaryu priest"
  "vsn-1645":
    "native": "oblation"
    "notes":
      "n1": "In the line it is written हव्यं (havyaṃ), with the anusvara for final m."
      "attested": "Attested: यमाय मधुमत्तमं राज्ञे हव्यं जुहोतन (yamāya madhumattamaṃ rājñe havyaṃ juhotana), RV 10.14.15. Offer to Yama, to the king, an oblation very rich in mead."
  "vsn-1646":
    "native": "for the sacrificer"
    "notes":
      "n1": "The word is inflected; its stem is यजमान (yajamāna)."
      "attested": "Attested: अहं दधामि द्रविणं हविष्मते सुप्राव्ये यजमानाय सुन्वते (ahaṃ dadhāmi draviṇaṃ haviṣmate suprāvye yajamānāya sunvate), RV 10.125.2. I place wealth with the oblation-bringer, for the sacrificer who presses."
    "bases":
      "यजमानाय":
        "meaning": "sacrificer"
  "vsn-1647":
    "native": "with fuel"
    "notes":
      "n1": "The word is inflected; its stem is समिध् (samidh)."
    "bases":
      "समिधा":
        "meaning": "fuel"
    "examples":
      "समिधा जातवेदसे देवाय देवहूतिभिः":
        "native": "With fuel, serve the god Jatavedas with invocations of the gods."
        "bases":
          "जातवेदसे": "Jatavedas"
          "देवाय": "god"
          "देवहूतिभिः": "invocation of the gods"
  "vsn-1648":
    "native": "Ila; refreshment; offering"
    "notes":
      "n1": "Ila is also the name of one of the three goddesses in this same verse, with Sarasvati and Mahi."
      "attested": "Attested: इळा सरस्वती मही तिस्रो देवीर्मयोभुवः (iḷā sarasvatī mahī tisro devīrmayobhuvaḥ), RV 5.5.8. Ila, Sarasvati, Mahi, three goddesses who bring us weal."
  "vsn-1649":
    "native": "vashat (offering call)"
    "notes":
      "n1": "Exclamations used at the sacrifice, mostly ending in -a, include svaha, svadha and vashat (Whitney, section 1091)."
      "attested": "Attested: वषट् ते विष्णवास आ कृणोमि तन्मे जुषस्व शिपिविष्ट हव्यम् (vaṣaṭ te viṣṇavāsa ā kṛṇomi tanme juṣasva śipiviṣṭa havyam), RV 7.99.7. Vashat! To you, Vishnu, I cry; enjoy this offering, O Shipivishta."
  "vsn-1650":
    "native": "oblation"
    "notes":
      "n1": "The stem is आहुति (āhuti); the line writes आहुतिं (āhutiṃ), with the anusvara for final m."
      "attested": "Attested: अग्नीषोमा य आहुतिं यो वां दाशाद्धविष्कृतिम् (agnīṣomā ya āhutiṃ yo vāṃ dāśāddhaviṣkṛtim), RV 1.93.3. The one who offers you, Agni and Soma, holy oil and burnt oblations."
    "bases":
      "आहुतिम्":
        "meaning": "oblation"
  "vsn-1651":
    "native": "to the presser of Soma (participle of su)"
    "notes":
      "n1": "The stem is सु (su), to press. From it the present participle is sunvant (active) and sunvana (middle) (Whitney, section 705)."
      "attested": "Attested: प्राची वाशीव सुन्वते मिमीत इत् (prācī vāśīva sunvate mimīta it), RV 8.12.12. Like a worshipper's praise, he spreads and measures out for the presser of Soma."
    "bases":
      "सुन्वते":
        "meaning": "to press"
