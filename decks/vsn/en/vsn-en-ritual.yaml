"tags":
- "unreviewed"
"cards":
  "vsn-1632":
    "native": "invoking priest"
    "notes":
      "n1": "The stem is होतृ (hotṛ)."
    "bases":
      "होता":
        "meaning": "invoking priest"
    "examples":
      "असि होता मनुर्हितः":
        "native": "You are the invoking priest, appointed by Manu."
        "bases":
          "असि": "to be"
  "vsn-1633":
    "native": "family priest"
    "examples":
      "अग्निर्ऋषिः पवमानः पाञ्चजन्यः पुरोहितः":
        "native": "Agni is the sage, the purifier, the chief priest of the five peoples."
  "vsn-1634":
    "native": "Soma"
    "notes":
      "n1": "In the line it is written सोमो (somo), with -o for -aḥ before a sonant."
    "examples":
      "सोमो वाजमिवासरत्":
        "native": "Soma has flowed on, as it were to win the prize."
  "vsn-1635":
    "native": "oblation"
    "notes":
      "n1": "The stem is हविस् (havis). Havis is a model of the neuter s-stems: nominative-accusative havis, instrumental havisa (Whitney, section 414)."
    "bases":
      "हविः":
        "meaning": "oblation"
    "examples":
      "स्वाहा देवेभ्यो हविः":
        "native": "The oblation, with svaha, is brought to the gods."
        "bases":
          "देवेभ्यो": "god"
  "vsn-1636":
    "native": "sacrificial grass"
    "notes":
      "n1": "The stem is बर्हिस् (barhis)."
    "bases":
      "बर्हिः":
        "meaning": "sacrificial grass"
    "examples":
      "बर्हिः सीदन्त्वस्रिधः":
        "native": "Let them sit harmless on the grass."
  "vsn-1637":
    "native": "altar"
    "examples":
      "इयं वेदिः परो अन्तः पृथिव्या अयं यज्ञो भुवनस्य नाभिः":
        "native": "This altar is the farthest end of the earth; this sacrifice is the navel of the world."
        "bases":
          "इयं": "this"
          "पृथिव्या": "earth"
          "अयं": "this"
          "भुवनस्य": "world"
  "vsn-1638":
    "native": "sacrificial gift"
    "examples":
      "ज्योतिर्न विश्वमभ्यस्ति दक्षिणा":
        "native": "Bounty, like light, reaches over all."
  "vsn-1639":
    "native": "svaha (offering call)"
    "notes":
      "n1": "Exclamations used at the sacrifice, mostly ending in -a, include svaha, svadha and vashat (Whitney, section 1091)."
    "examples":
      "स्वाहा देवेभ्यो हविः":
        "native": "The oblation, with svaha, is brought to the gods."
        "bases":
          "देवेभ्यो": "god"
  "vsn-1640":
    "native": "offered; poured on the fire"
    "notes":
      "n1": "The stem is आहुत (āhuta)."
      "n2": "The verse does not prove this sense plainly: 'offered' is the word's usual sense, not one the line shows."
    "bases":
      "आहुतम्":
        "meaning": "offered"
    "examples":
      "उदग्ने तव तद्घृतादर्ची रोचत आहुतम्":
        "native": "Your flame, offered to, shines from the holy ghee."
        "bases":
          "तव": "you"
          "रोचत": "to shine"
  "vsn-1641":
    "native": "pressed (Soma)"
    "notes":
      "n1": "Said of Soma when it has been pressed."
    "examples":
      "धारया पवते सुतः":
        "native": "The pressed Soma flows on in its stream."
        "bases":
          "धारया": "stream"
          "पवते": "to purify; to flow"
  "vsn-1642":
    "native": "pressing; Soma-pressing"
    "notes":
      "n1": "In the line it is written सवनं (savanaṃ), with the anusvara for final m; the stem is सवन (savana)."
    "examples":
      "अथा सुनुध्वं सवनं मदाय पात ऋभवो मधुनः सोम्यस्य":
        "native": "Now press the liquor for gladness, and drink, O Rbhus, of Soma's mead."
        "bases":
          "सुनुध्वं": "to press"
          "मदाय": "delight"
          "पात": "to drink"
          "मधुनः": "mead"
  "vsn-1643":
    "native": "strainer"
    "notes":
      "n1": "In the line it is written पवित्रं (pavitraṃ), with the anusvara for final m; the stem is पवित्र (pavitra)."
    "examples":
      "तिरः पवित्रं ससृवांस आशवो मन्दन्तु तुग्र्यावृधः":
        "native": "Let the swift drops that have flowed through the strainer rejoice and gladden."
        "bases":
          "ससृवांस": "to flow"
          "मन्दन्तु": "to gladden"
  "vsn-1644":
    "native": "adhvaryu priests"
    "notes":
      "n1": "A plural; the stem is अध्वर्यु (adhvaryu), and the line writes अध्वर्यवो (adhvaryavo), with -o for -aḥ before a sonant."
    "bases":
      "अध्वर्यवः":
        "meaning": "adhvaryu priest"
    "examples":
      "अध्वर्यवो हविष्मन्तो हि भूताच्छाप इतोशतीरुशन्तः":
        "native": "Adhvaryus, you who bring oblations, come with longing to the waters."
        "bases":
          "हविष्मन्तो": "with oblations"
  "vsn-1645":
    "native": "oblation"
    "notes":
      "n1": "In the line it is written हव्यं (havyaṃ), with the anusvara for final m."
    "examples":
      "यमाय मधुमत्तमं राज्ञे हव्यं जुहोतन":
        "native": "Offer to Yama, to the king, an oblation very rich in mead."
        "bases":
          "यमाय": "Yama"
          "राज्ञे": "king"
          "जुहोतन": "to offer"
  "vsn-1646":
    "native": "for the sacrificer"
    "notes":
      "n1": "The word is inflected; its stem is यजमान (yajamāna)."
    "bases":
      "यजमानाय":
        "meaning": "sacrificer"
    "examples":
      "अहं दधामि द्रविणं हविष्मते सुप्राव्ये यजमानाय सुन्वते":
        "native": "I place wealth with the oblation-bringer, for the sacrificer who presses."
        "bases":
          "दधामि": "to place"
          "हविष्मते": "with oblations"
          "सुन्वते": "to press"
  "vsn-1647":
    "native": "with fuel"
    "notes":
      "n1": "The word is inflected; its stem is समिध् (samidh)."
    "bases":
      "समिधा":
        "meaning": "fuel"
    "examples":
      "समिधा जातवेदसे देवाय देवहूतिभिः":
        "native": "With fuel, serve the god Jatavedas with invocations of the gods."
        "bases":
          "जातवेदसे": "Jatavedas"
          "देवाय": "god"
          "देवहूतिभिः": "invocation of the gods"
  "vsn-1648":
    "native": "Ila; refreshment; offering"
    "notes":
      "n1": "Ila is also the name of one of the three goddesses in this same verse, with Sarasvati and Mahi."
    "examples":
      "इळा सरस्वती मही तिस्रो देवीर्मयोभुवः":
        "native": "Ila, Sarasvati, Mahi, three goddesses who bring us weal."
  "vsn-1649":
    "native": "vashat (offering call)"
    "notes":
      "n1": "Exclamations used at the sacrifice, mostly ending in -a, include svaha, svadha and vashat (Whitney, section 1091)."
    "examples":
      "वषट् ते विष्णवास आ कृणोमि तन्मे जुषस्व शिपिविष्ट हव्यम्":
        "native": "Vashat! To you, Vishnu, I cry; enjoy this offering, O Shipivishta."
        "bases":
          "ते": "you"
          "कृणोमि": "to make"
          "जुषस्व": "to enjoy"
  "vsn-1650":
    "native": "oblation"
    "notes":
      "n1": "The stem is आहुति (āhuti); the line writes आहुतिं (āhutiṃ), with the anusvara for final m."
    "bases":
      "आहुतिम्":
        "meaning": "oblation"
    "examples":
      "अग्नीषोमा य आहुतिं यो वां दाशाद्धविष्कृतिम्":
        "native": "The one who offers you, Agni and Soma, holy oil and burnt oblations."
        "bases":
          "य": "who"
          "यो": "who"
          "वां": "you two"
  "vsn-1651":
    "native": "to the presser of Soma (participle of su)"
    "notes":
      "n1": "The stem is सु (su), to press. From it the present participle is sunvant (active) and sunvana (middle) (Whitney, section 705)."
    "bases":
      "सुन्वते":
        "meaning": "to press"
    "examples":
      "प्राची वाशीव सुन्वते मिमीत इत्":
        "native": "Like a worshipper's praise, he spreads and measures out for the presser of Soma."
        "bases":
          "मिमीत": "to measure"
