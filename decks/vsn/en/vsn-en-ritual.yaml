"name": "Ritual: fire, offering and priest"
"description": "20 words from the Rigveda, each with one attested line. Vedic Sanskrit in Devanagari; each reading is tool-written (based on ISO 15919) and the IPA is reconstructed. Not yet checked by a Vedicist: please report any mistake."
