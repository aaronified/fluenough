"cards":
  "vsn-1938":
    "native": "hymn"
    "notes":
      "n1": "The verse writes स्तोमो (stomo), with -o for the -aḥ of the nominative before a voiced sound."
      "attested": "Attested: अस्माकमद्य वामयं स्तोमो वाहिष्ठो अन्तमः (asmākamadya vāmayaṃ stomo vāhiṣṭho antamaḥ), RV 8.5.18. May this hymn of ours, the most powerful, be near your hearts, O Asvins, today."
  "vsn-1939":
    "native": "sacred word"
    "notes":
      "n1": "The verse writes मन्त्रो (mantro), with -o for the -aḥ of the nominative before a voiced sound."
      "attested": "Attested: भुवो नॄँश्च्यौत्नो विश्वस्मिन्भरे ज्येष्ठश्च मन्त्रो विश्वचर्षणे (bhuvo nṝm̐ścyautno viśvasminbhare jyeṣṭhaśca mantro viśvacarṣaṇe), RV 10.50.4. You are mighty through the holy word, and the noblest song, lord of all peoples."
  "vsn-1940":
    "native": "song; praise"
    "notes":
      "n1": "The stem is गिर् (gir), a monosyllabic root noun, like ऋच् (ṛc) 'verse' (Whitney, §§ 383, 392)."
      "attested": "Attested: इयमेषाममृतानां गीः सर्वताता ये कृपणन्त रत्नम् (iyameṣāmamṛtānāṃ gīḥ sarvatātā ye kṛpaṇanta ratnam), RV 10.74.3. This is the song of the immortal beings who long for treasure."
  "vsn-1941":
    "native": "word"
    "notes":
      "n1": "The stem is वचस् (vacas), a neuter s-stem. Whitney lists वचस् (vacas), मनस् (manas) and चक्षस् (cakṣas) as neuter s-stems derived with -as (§ 1151)."
      "attested": "Attested: अग्ने दिवित्मता वचः (agne divitmatā vacaḥ), RV 1.26.2. O Agni, be our priest, through our hymns and through this heavenly word."
  "vsn-1942":
    "native": "hymn"
    "notes":
      "n1": "The verse writes सूक्तं (sūktaṃ), with anusvara for the final m."
      "attested": "Attested: प्र सा वाचि सुष्टुतिर्मघोनामिदं सूक्तं मरुतो जुषन्त (pra sā vāci suṣṭutirmaghonāmidaṃ sūktaṃ maruto juṣanta), RV 7.58.6. Accept, O Maruts, this hymn of praise to the bounteous ones."
  "vsn-1943":
    "native": "chant"
    "notes":
      "attested": "Attested: साम कृण्वन्सामन्यो विपश्चित्क्रन्दन्नेत्यभि सख्युर्न जामिम् (sāma kṛṇvansāmanyo vipaścitkrandannetyabhi sakhyurna jāmim), RV 9.96.22. Singing his chant, the skilled singer comes roaring, as to a friend's sister."
  "vsn-1944":
    "native": "thought; prayer"
    "notes":
      "n1": "Whitney uses धी (dhī), 'thought', as the model of the monosyllabic ī-stems (§ 351)."
      "attested": "Attested: प्र वो रयिं युक्ताश्वं भरध्वं राय एषेऽवसे दधीत धीः (pra vo rayiṃ yuktāśvaṃ bharadhvaṃ rāya eṣe'vase dadhīta dhīḥ), RV 5.41.5. Let thought be framed for help and for the gain of treasure."
  "vsn-1945":
    "native": "thought; prayer"
    "notes":
      "attested": "Attested: तत्सु वामेषते मतिरत्रिभ्य एषते मतिः (tatsu vāmeṣate matiratribhya eṣate matiḥ), RV 5.67.5. Therefore our thought is turned to you, and the Atris' thought is turned to you."
  "vsn-1946":
    "native": "praise"
    "notes":
      "n1": "The verse writes पूर्व्यस्तुतिः (pūrvyastutiḥ), fused into one word with पूर्व्य (pūrvya). The word स्तुति (stuti) is not written on its own in this line, so the example gives no base for it."
      "attested": "Attested: इयं वामस्य मन्मन इन्द्राग्नी पूर्व्यस्तुतिः (iyaṃ vāmasya manmana indrāgnī pūrvyastutiḥ), RV 7.94.1. This noblest praise has been produced for you, Indra and Agni, from my heart."
  "vsn-1947":
    "native": "prayer"
    "notes":
      "attested": "Attested: वोचेम ब्रह्म सानसि (vocema brahma sānasi), RV 1.75.2. We will say to you, Agni, our precious, much-availing prayer."
  "vsn-1948":
    "native": "poet; seer"
    "notes":
      "attested": "Attested: सोमो यः सुक्रतुः कविः (somo yaḥ sukratuḥ kaviḥ), RV 9.12.4. Far-sighted Soma, the sage and seer, is worshipped in the central point."
  "vsn-1949":
    "native": "seer"
    "notes":
      "attested": "Attested: अग्निरिद्धि प्रचेता अग्निर्वेधस्तम ऋषिः (agniriddhi pracetā agnirvedhastama ṛṣiḥ), RV 6.14.2. Agni is passing wise and most skilled in ordering, a seer."
  "vsn-1950":
    "native": "call"
    "notes":
      "attested": "Attested: वृषा त्वं शतक्रतो वृषा हवः (vṛṣā tvaṃ śatakrato vṛṣā havaḥ), RV 8.13.31. O Indra, you are strong, and strong is our call."
  "vsn-1951":
    "native": "prayer"
    "notes":
      "attested": "Attested: इयं मनीषा इयमश्विना गीरिमां सुवृक्तिं वृषणा जुषेथाम् (iyaṃ manīṣā iyamaśvinā gīrimāṃ suvṛktiṃ vṛṣaṇā juṣethām), RV 7.70.7. This is the thought, this is the song, O Asvins; accept this hymn of ours."
  "vsn-1952":
    "native": "voice"
    "notes":
      "attested": "Attested: युवोरश्विना वपुषे युवायुजं रथं वाणी येमतुरस्य शर्ध्यम् (yuvoraśvinā vapuṣe yuvāyujaṃ rathaṃ vāṇī yematurasya śardhyam), RV 1.119.5. Asvins, your two voices urged the car you had yoked toward its goal."
  "vsn-1953":
    "native": "song"
    "notes":
      "n1": "The verse writes अर्को (arko), with -o for the -aḥ of the nominative before a voiced sound."
      "attested": "Attested: अर्को यद्वो मरुतो हविष्मान्गायद्गाथं सुतसोमो दुवस्यन् (arko yadvo maruto haviṣmāngāyadgāthaṃ sutasomo duvasyan), RV 1.167.6. When your song rose, Maruts, the soma-pourer sang his hymn with an offering."
