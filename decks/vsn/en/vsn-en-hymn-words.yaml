"name": "Hymn words"
"description": "Hymn, sacred word, song, word, chant, thought, prayer, poet, seer, call and voice, from the Rigveda. Vedic Sanskrit in Devanagari; each reading is based on ISO 15919 and the pronunciation is reconstructed. Not yet checked by a Vedicist: please report any mistake."
"license": "CC-BY-SA-4.0"
"source": "Rigveda: Sanskrit text from sa.wikisource.org, hymn pages (read 2026-11-16); English from Griffith's translation of The Hymns of the Rigveda (1896), en.wikisource.org; grammar from Whitney's Sanskrit Grammar, en.wikisource.org (sections cited in the notes). Readings and IPA are written by the tool, not by hand."
"tags":
