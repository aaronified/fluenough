"rules":
  "vsn-rule-a-singular-nom-acc":
    "name": "-aḥ and -am: nominative and accusative singular"
    "explanation": "The masculine nominative of an a-stem has the normal ending s, which before a pause is written as visarga: {1} (Whitney §327a, §170a). The accusative, masculine and neuter, adds m (not am): {2}; this form also does the work of the neuter nominative, as in Whitney's neuter example {3}, 'mouth' (§327b, §330), whose nominative is आस्यम् (āsyam)."
  "vsn-rule-a-singular-instrumental":
    "name": "-ena: instrumental singular"
    "explanation": "The instrumental changes a to ena uniformly in the later language, and even in the oldest Vedic this is the predominant ending, in eight ninths of all cases in the Rigveda: {1} (Whitney §327c). Its final is frequently made long in Vedic verse (enā), and the normal ending ā, as in yajñā́, is also not rare in the Veda (Whitney §327c)."
  "vsn-rule-a-singular-dative":
    "name": "-āya: dative singular"
    "explanation": "The dative has āya, as if aya had been added to a, alike in all ages of the language: {1} (Whitney §327d)."
  "vsn-rule-a-singular-ablative":
    "name": "-āt: ablative singular"
    "explanation": "The ablative has t (perhaps d: the Sanskrit does not show which is the original ending), before which the a is made long: {1}. This ending is found in no other noun declension, and elsewhere only in the personal pronouns (Whitney §327e)."
  "vsn-rule-a-singular-genitive":
    "name": "-asya: genitive singular"
    "explanation": "The genitive has sya added to the final a: {1}. This ending is limited to a-stems, with the single exception of the pronoun amúṣya. In the Veda its final a is made long in only three cases, and its y is vocalised (asia) almost as rarely (Whitney §327f)."
  "vsn-rule-a-singular-locative-vocative":
    "name": "-e and the bare stem: locative and vocative singular"
    "explanation": "The locative ends in e, as if the normal ending i combined with the final of the stem, without exception: {1}. The vocative is the bare stem: {2} (Whitney §327g, h)."
  "vsn-rule-a-dual":
    "name": "The dual: -āu or -ā, -ābhyām, -ayoḥ"
    "explanation": "The dual endings are in general the normal ones (Whitney §328a). The nominative, accusative and vocative masculine end in āu in the later language: {1}. In the Veda the usual ending is simple ā, in seven eighths of the Rigveda occurrences: {2}. The same cases in the neuter end in e: {3} (§328b). The instrumental, dative and ablative have bhyām, with the stem-final made long: {4}; in one or two Vedic instances it is resolved into bhiām (§328c). The genitive and locative insert a y after the stem-final before os: {5} (§328d)."
  "vsn-rule-a-plural-nominative-accusative":
    "name": "The plural nominative and accusative: -āḥ, -āsaḥ, -ān, -āni"
    "explanation": "In the later language the masculine nominative combines the normal ending as with the final a to ās: {1}. In the Veda the ending āsas is also frequent, in one third of the Rigveda occurrences: {2} (Whitney §329a). The masculine accusative ends in ān, for an earlier āns: {3} (§329b). The neuter nominative and accusative end in āni in the later language: {4}; in the Veda this alternates with a simple ā (§329c). The vocative plural is the nominative (§309h)."
  "vsn-rule-a-plural-instrumental":
    "name": "The plural instrumental: -aiḥ and Vedic -ebhiḥ"
    "explanation": "The instrumental ends later always in āis: {1}. In the Veda the more regular form ebhis is found abundantly: {2}; in the Rigveda it is nearly as frequent as āis, in the Atharvaveda only one fifth as frequent (Whitney §329d). Both endings stand side by side in the first line of Rigveda 10.125, {3}, 'I travel with the Rudras and the Vasus, with the Adityas and all the gods': rudrebhir is the instrumental plural in -ebhis of rudra, with the final s written r before the voiced sound that follows (compare Whitney §174), and ādityair is the one in -ais of āditya, written the same way."
  "vsn-rule-a-plural-dative-ablative":
    "name": "-ebhyaḥ: dative and ablative plural"
    "explanation": "The dative and the ablative have the same form in the plural, with the ending bhyas and an e in place of the final a: {1}. The resolution into ebhias is not infrequent in the Veda (Whitney §329e, §309e)."
  "vsn-rule-a-plural-genitive":
    "name": "-ānām: genitive plural"
    "explanation": "The genitive ends in ānām: the final a is made long and an n is inserted before the normal ending ām: {1}. The ā of the ending is not seldom, in less than half the instances, to be read as two syllables, a-am (Whitney §329f)."
  "vsn-rule-a-plural-locative":
    "name": "-eṣu: locative plural"
    "explanation": "The locative ends in eṣu: the normal ending su, with the stem-final changed to e, and the s then becoming ṣ: {1} (Whitney §329g). Whitney adds (§329h) that in this declension the syllable accented in the stem keeps its own accent through the whole inflection; the vocative is the exception (§314)."
