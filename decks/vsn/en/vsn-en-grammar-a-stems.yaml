"name": "Nouns in -a: the endings"
"description": "The endings of the a-stem nouns, which Whitney says are the majority of all the declined stems of the language and the most irregular in their endings (§326), shown on देवः (devaḥ), 'god', with the Vedic forms Whitney lists beside the later ones (§329, §330). The neuter forms are explained in the rules but not yet drilled, since Whitney's neuter paradigm is of a word not taught in this course. Not yet checked by a Vedicist: please report any mistake."
