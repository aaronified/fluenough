"cards":
  "vsn-2242":
    "native": "A thunderbolt, a bolt-weapon."
    "notes":
      "n1": "One of the nouns in -ra, like {1} (śūra) (Whitney §1188)."
    "examples":
      "आत्सोम इन्द्रियो रसो वज्रः सहस्रसा भुवत्":
        "native": "Soma, Indra's juice, became a thunderbolt that wins a thousand."
        "bases":
          "वज्रः": "thunderbolt, mace"
  "vsn-2243":
    "native": "A hero, a warrior."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a); it is also one of the nouns in -ra (Whitney §1188)."
    "examples":
      "शूरो न गोषु तिष्ठति":
        "native": "He stands like a hero among the cows."
        "bases":
          "शूरो": "hero"
  "vsn-2244":
    "native": "An army, a host."
    "examples":
      "यदुद्वतो निवतो यासि बप्सत्पृथगेषि प्रगर्धिनीव सेना": "You divide like an army eager for booty."
  "vsn-2245":
    "native": "A bow."
    "examples":
      "धनुः शत्रोरपकामं कृणोति धन्वना सर्वाः प्रदिशो जयेम":
        "native": "The bow makes the foe give way; with it we may conquer all the regions."
        "bases":
          "धनुः": "bow"
  "vsn-2246":
    "native": "A weapon."
    "examples":
      "तिग्ममेको बिभर्ति हस्त आयुधं शुचिरुग्रो जलाषभेषजः":
        "native": "Another holds a sharp weapon in his hand."
        "bases":
          "आयुधं": "weapon"
  "vsn-2247":
    "native": "A battle, a fight."
    "examples":
      "रणं कृधि रणकृत्सत्यशुष्माभक्ते चिदा भजा राये अस्मान्":
        "native": "Fight the battle, you who are strong in truth, and give us our share of riches."
        "bases":
          "रणं": "battle"
  "vsn-2248":
    "native": "A host of men, or a battle."
    "notes":
      "n1": "Weak: the gloss \"host, battle\" rests on Griffith's \"combat\" in this verse; flagged for review."
    "examples":
      "मह्यं नमन्तां प्रदिशश्चतस्रस्त्वयाध्यक्षेण पृतना जयेम": "With you as our overseer we may win the battles, and the four regions may bow to me."
  "vsn-2249":
    "native": "In battles."
    "notes":
      "n1": "Attested here as {1}, a form of the stem {2} (samad), in battles; the card teaches the attested form. Weak: the gloss rests on Griffith's wording in this verse."
    "bases":
      "समत्सु": "in battles"
    "examples":
      "समत्सु त्वा हवामहे":
        "native": "In battles we call upon your aid."
        "bases":
          "समत्सु": "in battles"
  "vsn-2250":
    "native": "Enemies, foes."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
    "examples":
      "पुनानो अक्रमीदभि विश्वा मृधो विचर्षणिः":
        "native": "The Very Active one attacked all the enemies while he was purified."
        "bases":
          "मृधो": "enemies"
  "vsn-2251":
    "native": "A deadly weapon, a bolt meant to kill."
    "notes":
      "n1": "Weak: the gloss \"deadly weapon\" rests on Griffith's \"deadly bolt\" in this verse; flagged for review."
    "examples":
      "वर्तयत तपुषा चक्रियाभि तमव रुद्रा अशसो हन्तना वधः":
        "native": "Rudras, throw away the enemy's deadly missile."
        "bases":
          "वधः": "deadly weapon"
  "vsn-2252":
    "native": "In battles, in the contests."
    "notes":
      "n1": "Attested here as {1}, a form of the stem {2}, in battles; the card teaches the attested form. Weak: the gloss rests on Griffith's \"battle\" in this verse."
    "bases":
      "पृत्सु": "in battles"
    "examples":
      "स मत्सरः पृत्सु वन्वन्नवातः सहस्ररेता अभि वाजमर्ष":
        "native": "The gladdener, never harmed in battle, pours out strength."
        "bases":
          "पृत्सु": "in battles"
  "vsn-2253":
    "native": "A missile, a thrown weapon."
    "notes":
      "n1": "Weak: the gloss \"missile\" rests on Griffith's \"Missile borne on wings\" in this verse; flagged for review."
    "examples":
      "अग्निर्हि विप्रो जुषतां हविर्नः परि हेतिः पक्षिणी नो वृणक्तु":
        "native": "May the winged missile turn away from us."
        "bases":
          "हेतिः": "missile"
  "vsn-2254":
    "native": "Demons, evil beings."
    "notes":
      "n1": "Attested here as {1}, a form of the stem {2} (rakṣas); the card teaches the attested form."
    "bases":
      "रक्षसः": "demons"
    "examples":
      "प्राक्तादपाक्तादधरादुदक्तादभि जहि रक्षसः पर्वतेन":
        "native": "Smite the demons from every side with your rocky weapon."
        "bases":
          "रक्षसः": "demons"
  "vsn-2255":
    "native": "Armour, a protective covering."
    "notes":
      "n1": "Weak: the gloss \"armour\" rests on the word's ordinary sense, as Griffith's \"Armour\" also gives; flagged for review."
    "examples":
      "रथवाहनं हविरस्य नाम यत्रायुधं निहितमस्य वर्म":
        "native": "Here, on his offering, lie his weapons and his armour."
        "bases":
          "वर्म": "armour"
