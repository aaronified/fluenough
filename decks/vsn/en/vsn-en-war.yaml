"cards":
  "vsn-2242":
    "native": "A thunderbolt, a bolt-weapon."
    "notes":
      "n1": "One of the nouns in -ra, like {1} (śūra) (Whitney §1188)."
      "attested": "Attested: आत्सोम इन्द्रियो रसो वज्रः सहस्रसा भुवत् (ātsoma indriyo raso vajraḥ sahasrasā bhuvat), RV 9.47.3. Soma, Indra's juice, became a thunderbolt that wins a thousand."
  "vsn-2243":
    "native": "A hero, a warrior."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a); it is also one of the nouns in -ra (Whitney §1188)."
      "attested": "Attested: शूरो न गोषु तिष्ठति (śūro na goṣu tiṣṭhati), RV 9.16.6. He stands like a hero among the cows."
  "vsn-2244":
    "native": "An army, a host."
    "notes":
      "attested": "Attested: यदुद्वतो निवतो यासि बप्सत्पृथगेषि प्रगर्धिनीव सेना (yadudvato nivato yāsi bapsatpṛthageṣi pragardhinīva senā), RV 10.142.4. You divide like an army eager for booty."
  "vsn-2245":
    "native": "A bow."
    "notes":
      "attested": "Attested: धनुः शत्रोरपकामं कृणोति धन्वना सर्वाः प्रदिशो जयेम (dhanuḥ śatrorapakāmaṃ kṛṇoti dhanvanā sarvāḥ pradiśo jayema), RV 6.75.2. The bow makes the foe give way; with it we may conquer all the regions."
  "vsn-2246":
    "native": "A weapon."
    "notes":
      "attested": "Attested: तिग्ममेको बिभर्ति हस्त आयुधं शुचिरुग्रो जलाषभेषजः (tigmameko bibharti hasta āyudhaṃ śucirugro jalāṣabheṣajaḥ), RV 8.29.5. Another holds a sharp weapon in his hand."
  "vsn-2247":
    "native": "A battle, a fight."
    "notes":
      "attested": "Attested: रणं कृधि रणकृत्सत्यशुष्माभक्ते चिदा भजा राये अस्मान् (raṇaṃ kṛdhi raṇakṛtsatyaśuṣmābhakte cidā bhajā rāye asmān), RV 10.112.10. Fight the battle, you who are strong in truth, and give us our share of riches."
  "vsn-2248":
    "native": "A host of men, or a battle."
    "notes":
      "n1": "Weak: the gloss \"host, battle\" rests on Griffith's \"combat\" in this verse; flagged for review."
      "attested": "Attested: मह्यं नमन्तां प्रदिशश्चतस्रस्त्वयाध्यक्षेण पृतना जयेम (mahyaṃ namantāṃ pradiśaścatasrastvayādhyakṣeṇa pṛtanā jayema), RV 10.128.1. With you as our overseer we may win the battles, and the four regions may bow to me."
  "vsn-2249":
    "native": "In battles."
    "notes":
      "n1": "Attested here as {1}, a form of the stem {2} (samad), in battles; the card teaches the attested form. Weak: the gloss rests on Griffith's wording in this verse."
      "attested": "Attested: समत्सु त्वा हवामहे (samatsu tvā havāmahe), RV 8.43.21. In battles we call upon your aid."
    "bases":
      "समत्सु": "in battles"
  "vsn-2250":
    "native": "Enemies, foes."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
      "attested": "Attested: पुनानो अक्रमीदभि विश्वा मृधो विचर्षणिः (punāno akramīdabhi viśvā mṛdho vicarṣaṇiḥ), RV 9.40.1. The Very Active one attacked all the enemies while he was purified."
  "vsn-2251":
    "native": "A deadly weapon, a bolt meant to kill."
    "notes":
      "n1": "Weak: the gloss \"deadly weapon\" rests on Griffith's \"deadly bolt\" in this verse; flagged for review."
      "attested": "Attested: वर्तयत तपुषा चक्रियाभि तमव रुद्रा अशसो हन्तना वधः (vartayata tapuṣā cakriyābhi tamava rudrā aśaso hantanā vadhaḥ), RV 2.34.9. Rudras, throw away the enemy's deadly missile."
  "vsn-2252":
    "native": "In battles, in the contests."
    "notes":
      "n1": "Attested here as {1}, a form of the stem {2}, in battles; the card teaches the attested form. Weak: the gloss rests on Griffith's \"battle\" in this verse."
      "attested": "Attested: स मत्सरः पृत्सु वन्वन्नवातः सहस्ररेता अभि वाजमर्ष (sa matsaraḥ pṛtsu vanvannavātaḥ sahasraretā abhi vājamarṣa), RV 9.96.8. The gladdener, never harmed in battle, pours out strength."
    "bases":
      "पृत्सु": "in battles"
  "vsn-2253":
    "native": "A missile, a thrown weapon."
    "notes":
      "n1": "Weak: the gloss \"missile\" rests on Griffith's \"Missile borne on wings\" in this verse; flagged for review."
      "attested": "Attested: अग्निर्हि विप्रो जुषतां हविर्नः परि हेतिः पक्षिणी नो वृणक्तु (agnirhi vipro juṣatāṃ havirnaḥ pari hetiḥ pakṣiṇī no vṛṇaktu), RV 10.165.2. May the winged missile turn away from us."
  "vsn-2254":
    "native": "Demons, evil beings."
    "notes":
      "n1": "Attested here as {1}, a form of the stem {2} (rakṣas); the card teaches the attested form."
      "attested": "Attested: प्राक्तादपाक्तादधरादुदक्तादभि जहि रक्षसः पर्वतेन (prāktādapāktādadharādudaktādabhi jahi rakṣasaḥ parvatena), RV 7.104.19. Smite the demons from every side with your rocky weapon."
    "bases":
      "रक्षसः": "demons"
  "vsn-2255":
    "native": "Armour, a protective covering."
    "notes":
      "n1": "Weak: the gloss \"armour\" rests on the word's ordinary sense, as Griffith's \"Armour\" also gives; flagged for review."
      "attested": "Attested: रथवाहनं हविरस्य नाम यत्रायुधं निहितमस्य वर्म (rathavāhanaṃ havirasya nāma yatrāyudhaṃ nihitamasya varma), RV 6.75.8. Here, on his offering, lie his weapons and his armour."
