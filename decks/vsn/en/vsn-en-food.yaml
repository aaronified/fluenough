"cards":
  "vsn-2228":
    "native": "Food."
    "notes":
      "attested": "Attested: यस्त्वामग्न इनधते यतस्रुक्त्रिस्ते अन्नं कृणवत्सस्मिन्नहन् (yastvāmagna inadhate yatasruktriste annaṃ kṛṇavatsasminnahan), RV 4.12.1. Whoever kindles you, Agni, and makes food for you three times a day."
  "vsn-2229":
    "native": "Milk, or a milky liquid."
    "notes":
      "n1": "Here it is poured out with butter, so it is the milk offered, not water."
      "attested": "Attested: वरिवोविद्घृतं पयः (varivovidghṛtaṃ payaḥ), RV 9.62.9. Pour out butter and milk, Indu, for the Angirases."
  "vsn-2230":
    "native": "Barley, a grain."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
      "attested": "Attested: तासामध्वर्युरागतौ यवो वृष्टीव मोदते (tāsāmadhvaryurāgatau yavo vṛṣṭīva modate), RV 2.5.6. The priest rejoices at their coming, as barley rejoices in the rain."
  "vsn-2231":
    "native": "Parched grain."
    "notes":
      "n1": "Weak: the gloss rests on Griffith's \"fries the grains\" in this verse; flagged for review."
      "attested": "Attested: य इन्द्राय सुनवत्सोममद्य पचात्पक्तीरुत भृज्जाति धानाः (ya indrāya sunavatsomamadya pacātpaktīruta bhṛjjāti dhānāḥ), RV 4.24.7. He who presses Soma for Indra today cooks the brews and parches the grains."
  "vsn-2232":
    "native": "Refreshment, nourishment."
    "notes":
      "n1": "Weak: the gloss \"refreshment\" rests on Griffith's wording in this verse; its stem is {1}."
      "attested": "Attested: इषं वहन्तीः सुकृते सुदानवे विश्वेदह यजमानाय सुन्वते (iṣaṃ vahantīḥ sukṛte sudānave viśvedaha yajamānāya sunvate), RV 1.92.3. Bringing refreshment to the liberal devotee who does good."
  "vsn-2233":
    "native": "Strength, or nourishment."
    "notes":
      "n1": "Weak: the gloss \"strength\" rests on Griffith's wording in this verse; its stem is {1}."
      "attested": "Attested: आ न ऊर्जं वहतमश्विना युवम् (ā na ūrjaṃ vahatamaśvinā yuvam), RV 1.92.17. Bring us strength, you two Ashvins."
  "vsn-2234":
    "native": "Joy, or the exhilaration of the draught."
    "notes":
      "n1": "Weak: \"joy, intoxication\" rests on Griffith's \"draught\" in this verse; flagged for review."
      "attested": "Attested: मरुद्भ्यो वायवे मदः (marudbhyo vāyave madaḥ), RV 9.25.1. A draught of joy for the Maruts and for Vayu."
  "vsn-2235":
    "native": "Honey; sweet mead."
    "notes":
      "n1": "A neuter u-stem: the model neuter u-stem noun (Whitney §341)."
      "attested": "Attested: मधावा धावता मधु (madhāvā dhāvatā madhu), RV 9.11.5. Flow swiftly, and pour the sweet mead."
  "vsn-2236":
    "native": "Something that comes from cows; milk."
    "notes":
      "n1": "Weak: the gloss \"milk\" rests on the word's sense of what comes from cows; Griffith's verse speaks of cattle and kine. Its stem is {1}."
      "attested": "Attested: सनत्साश्व्यं पशुमुत गव्यं शतावयम् (sanatsāśvyaṃ paśumuta gavyaṃ śatāvayam), RV 5.61.5. May she win cattle, hundreds of sheep, steeds, and kine, as her reward."
  "vsn-2237":
    "native": "Cooked, or ripe."
    "notes":
      "n1": "Weak: the gloss \"cooked\" rests on Griffith's \"ripe\" in this verse; flagged for review."
      "attested": "Attested: यो गोषु पक्वं धारयत् (yo goṣu pakvaṃ dhārayat), RV 8.32.25. He set the ripe milk among the kine."
  "vsn-2238":
    "native": "Food, or a meal to be enjoyed."
    "notes":
      "n1": "Weak: the gloss rests on Griffith's \"much to be enjoyed\" in this verse; flagged for review."
      "attested": "Attested: तत्सवितुर्वृणीमहे वयं देवस्य भोजनम् (tatsaviturvṛṇīmahe vayaṃ devasya bhojanam), RV 5.82.1. We ask of the god Savitar that treasure, much to be enjoyed."
  "vsn-2239":
    "native": "A portion, a share of food or drink."
    "notes":
      "n1": "Weak: the gloss rests on Griffith's rendering of the cows as a share of Soma in this verse; flagged for review."
      "attested": "Attested: गावो भगो गाव इन्द्रो मे अच्छान्गावः सोमस्य प्रथमस्य भक्षः (gāvo bhago gāva indro me acchāngāvaḥ somasya prathamasya bhakṣaḥ), RV 6.28.5. The cows seem to me like Bhaga, like Indra, and like a share of the first Soma."
  "vsn-2240":
    "native": "A porridge, or a meal-cake of grain."
    "notes":
      "n1": "In this verse it is a meal-cake, eaten with the Maruts and drunk with Soma."
      "attested": "Attested: पूषण्वते ते चकृमा करम्भं हरिवते हर्यश्वाय धानाः (pūṣaṇvate te cakṛmā karambhaṃ harivate haryaśvāya dhānāḥ), RV 3.52.7. We have prepared the groats for you, with Pusan."
  "vsn-2241":
    "native": "Grain, corn."
    "notes":
      "n1": "Weak: the gloss \"grain\" rests on Griffith's \"corn\" in this verse; flagged for review."
      "attested": "Attested: येन तोकाय तनयाय धान्यं बीजं वहध्वे अक्षितम् (yena tokāya tanayāya dhānyaṃ bījaṃ vahadhve akṣitam), RV 5.53.13. Through it you bring seed of grain that does not waste away, for child and offspring."
