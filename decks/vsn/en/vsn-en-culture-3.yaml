native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: people, speech and life"
description: "Seven first lines from Rigveda hymns about a dialogue, death, a gambler, a wife, a messenger and giving, from the Devanagari of sa.wikisource. Each card gives one line; the note gives the hymn's seer as the sa.wikisource header names him, and what the hymn is about. Not yet checked by a Vedic scholar: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "vsn-6018":
    native: "I would win my friend to friendship, having gone far across the wide ocean."
    notes:
      "n1": "A dialogue: Yami, daughter of Vivasvat, speaks to Yama. The header names Yami as the seer and Yama as the deity."
  "vsn-6019":
    native: "To him who went before across the wide lands, who found a path for many."
    notes:
      "n1": "A hymn to King Yama, son of Vivasvat, who gathers men together. The header names Yama Vaivasvata as the seer and Yama as the deity."
  "vsn-6020":
    native: "Go away, O Death, by your own path, apart from the path the gods travel."
    notes:
      "n1": "A funeral hymn, addressed to Death. The header names Death as the deity for verses 1 to 4 and the funeral rite for verses 7 to 14. The seer is Samkusuka Yamayana."
  "vsn-6021":
    native: "The dice, born of the wind, shake me and make me giddy as they roll on the board."
    notes:
      "n1": "The gambler's lament. The header names Kavasha Ailusha as the seer, and the dice as the deity of the first verses. Verse 13, by the header, is about farming (krishi)."
  "vsn-6022":
    native: "Stay, my wife, fierce one, and let us now mix our words together."
    notes:
      "n1": "A dialogue of King Pururavas and the nymph Urvashi. The header names both as speakers in turn."
  "vsn-6023":
    native: "What does Sarama want, that she has come here? The way is long, to far-off places."
    notes:
      "n1": "Sarama, the divine hound who serves Indra as messenger, goes to the Panis. The header names Sarama as the seer of some verses and the Panis as the deity of others."
  "vsn-6024":
    native: "The gods did not make hunger our death; death comes even to the well-fed, in many shapes."
    notes:
      "n1": "On giving food to the needy. The header names Bhikshu Angirasa as the seer and the gift of food and wealth as the subject."
