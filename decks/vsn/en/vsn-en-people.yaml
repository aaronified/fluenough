"name": "Priests, singers, kings and tribes"
"description": "Words for priests, singers, kings and tribes, from the Rigveda; each gloss is from Griffith's translation of the same verse. Each reading is based on ISO 15919 and the pronunciation is reconstructed. Vedic accent marks are not shown. Not yet checked by a Vedicist: please report any mistake."
