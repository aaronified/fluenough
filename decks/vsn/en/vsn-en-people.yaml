"cards":
  "vsn-2500":
    "native": "A king."
    "notes":
      "n1": "Its stem is {1}, a model n-stem; its nominative is {2} (Whitney §424)."
    "examples":
      "राजा मेधाभिरीयते पवमानो मनावधि":
        "native": "King Pavamana is implored with holy songs, on man's behalf, to travel through the firmament."
        "bases":
          "राजा": "king"
  "vsn-2501":
    "native": "An inspired singer."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
    "examples":
      "विप्रो यज्ञस्य साधनः":
        "native": "The inspired singer completes the rite of the sacrifice."
        "bases":
          "विप्रो": "inspired singer"
  "vsn-2502":
    "native": "Clans."
    "notes":
      "n1": "The card teaches the attested form {1}, a form of the stem {2}."
    "bases":
      "विशः": "clans"
    "examples":
      "विशः पूर्वीः प्र चरा चर्षणिप्राः":
        "native": "To many clans he goes, man's controller."
        "bases":
          "विशः": "clans"
  "vsn-2503":
    "native": "An Arya, one of the people set against the Dasa."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
    "examples":
      "यो नो दास आर्यो वा पुरुष्टुतादेव इन्द्र युधये चिकेतति":
        "native": "The godless man, whether he be Dasa or be Arya, who would war with us, O Indra."
        "bases":
          "आर्यो": "Arya"
  "vsn-2504":
    "native": "A Dasa, one of the enemies the hymns name."
    "examples":
      "शिरो यदस्य त्रैतनो वितक्षत्स्वयं दास उरो अंसावपि ग्ध": "When Traitana would cleave my head, the Dasa wounded his own breast and shoulders."
  "vsn-2505":
    "native": "The master of the house."
    "examples":
      "स रासते शुरुधो विश्वधायसोऽग्निर्होता गृहपतिः सुवीर्यम्":
        "native": "Agni, the priest and master of the household, gives heroic strength and all-sustaining riches."
        "bases":
          "गृहपतिः": "master of the house"
  "vsn-2506":
    "native": "A singer, one who praises."
    "examples":
      "तत्तदिदश्विनोरवो जरिता प्रति भूषति":
        "native": "The singer of their praise awaits whatever grace the Asvins give."
        "bases":
          "जरिता": "singer"
  "vsn-2507":
    "native": "A guest."
    "examples":
      "अमूरः कविरदितिर्विवस्वान्सुसंसन्मित्रो अतिथिः शिवो नः":
        "native": "Our gracious guest, a friend with good attendants, shines forth before the Mornings."
        "bases":
          "अतिथिः": "guest"
  "vsn-2508":
    "native": "A praiser."
    "examples":
      "रेवाँ इद्रेवत स्तोता स्यात्त्वावतो मघोनः":
        "native": "Rich be the praiser of one rich, munificent and famed like thee."
        "bases":
          "स्तोता": "praiser"
  "vsn-2509":
    "native": "The lord of the clan."
    "examples":
      "येषामज्मेषु पृथिवी जुजुर्वाँ इव विश्पतिः":
        "native": "At whose racings forth the earth trembles, like an age-weakened lord of men."
        "bases":
          "विश्पतिः": "lord of the clan"
  "vsn-2510":
    "native": "Dominion, rule."
    "notes":
      "n1": "In this line it is written {1}: the corpus writes final -m as anusvara (ṃ)."
    "examples":
      "अनाप्यं वरुणो मित्रो अर्यमा क्षत्रं राजान आशत":
        "native": "Varuna, Mitra, Aryaman and the Kings have won dominion, which none else may gain."
        "bases":
          "क्षत्रं": "dominion"
  "vsn-2511":
    "native": "Dasyus, the enemies, in the plural."
    "notes":
      "n1": "The card teaches the attested form {1}, a form of the stem {2}; in this line it is written {3}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
    "bases":
      "दस्यवः": "Dasyus"
    "examples":
      "वि जानीह्यार्यान्ये च दस्यवो बर्हिष्मते रन्धया शासदव्रतान्":
        "native": "Discern thou well Aryas and Dasyus; punishing the lawless, give them up to him whose grass is strewn."
        "bases":
          "दस्यवो": "Dasyus"
