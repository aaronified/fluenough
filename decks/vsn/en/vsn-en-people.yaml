"cards":
  "vsn-2500":
    "native": "A king."
    "notes":
      "n1": "Its stem is {1}, a model n-stem; its nominative is {2} (Whitney §424)."
      "attested": "Attested: राजा मेधाभिरीयते पवमानो मनावधि (rājā medhābhirīyate pavamāno manāvadhi), RV 9.65.16. King Pavamana is implored with holy songs, on man's behalf, to travel through the firmament."
  "vsn-2501":
    "native": "An inspired singer."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
      "attested": "Attested: विप्रो यज्ञस्य साधनः (vipro yajñasya sādhanaḥ), RV 3.27.8. The inspired singer completes the rite of the sacrifice."
  "vsn-2502":
    "native": "Clans."
    "notes":
      "n1": "The card teaches the attested form {1}, a form of the stem {2}."
      "attested": "Attested: विशः पूर्वीः प्र चरा चर्षणिप्राः (viśaḥ pūrvīḥ pra carā carṣaṇiprāḥ), RV 7.31.10. To many clans he goes, man's controller."
    "bases":
      "विशः": "clans"
  "vsn-2503":
    "native": "An Arya, one of the people set against the Dasa."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
      "attested": "Attested: यो नो दास आर्यो वा पुरुष्टुतादेव इन्द्र युधये चिकेतति (yo no dāsa āryo vā puruṣṭutādeva indra yudhaye ciketati), RV 10.38.3. The godless man, whether he be Dasa or be Arya, who would war with us, O Indra."
  "vsn-2504":
    "native": "A Dasa, one of the enemies the hymns name."
    "notes":
      "attested": "Attested: शिरो यदस्य त्रैतनो वितक्षत्स्वयं दास उरो अंसावपि ग्ध (śiro yadasya traitano vitakṣatsvayaṃ dāsa uro aṃsāvapi gdha), RV 1.158.5. When Traitana would cleave my head, the Dasa wounded his own breast and shoulders."
  "vsn-2505":
    "native": "The master of the house."
    "notes":
      "attested": "Attested: स रासते शुरुधो विश्वधायसोऽग्निर्होता गृहपतिः सुवीर्यम् (sa rāsate śurudho viśvadhāyaso'gnirhotā gṛhapatiḥ suvīryam), RV 10.122.1. Agni, the priest and master of the household, gives heroic strength and all-sustaining riches."
  "vsn-2506":
    "native": "A singer, one who praises."
    "notes":
      "attested": "Attested: तत्तदिदश्विनोरवो जरिता प्रति भूषति (tattadidaśvinoravo jaritā prati bhūṣati), RV 1.46.12. The singer of their praise awaits whatever grace the Asvins give."
  "vsn-2507":
    "native": "A guest."
    "notes":
      "attested": "Attested: अमूरः कविरदितिर्विवस्वान्सुसंसन्मित्रो अतिथिः शिवो नः (amūraḥ kaviraditirvivasvānsusaṃsanmitro atithiḥ śivo naḥ), RV 7.9.3. Our gracious guest, a friend with good attendants, shines forth before the Mornings."
  "vsn-2508":
    "native": "A praiser."
    "notes":
      "attested": "Attested: रेवाँ इद्रेवत स्तोता स्यात्त्वावतो मघोनः (revām̐ idrevata stotā syāttvāvato maghonaḥ), RV 8.2.13. Rich be the praiser of one rich, munificent and famed like thee."
  "vsn-2509":
    "native": "The lord of the clan."
    "notes":
      "attested": "Attested: येषामज्मेषु पृथिवी जुजुर्वाँ इव विश्पतिः (yeṣāmajmeṣu pṛthivī jujurvām̐ iva viśpatiḥ), RV 1.37.8. At whose racings forth the earth trembles, like an age-weakened lord of men."
  "vsn-2510":
    "native": "Dominion, rule."
    "notes":
      "n1": "In this line it is written {1}: the corpus writes final -m as anusvara (ṃ)."
      "attested": "Attested: अनाप्यं वरुणो मित्रो अर्यमा क्षत्रं राजान आशत (anāpyaṃ varuṇo mitro aryamā kṣatraṃ rājāna āśata), RV 7.66.11. Varuna, Mitra, Aryaman and the Kings have won dominion, which none else may gain."
  "vsn-2511":
    "native": "Dasyus, the enemies, in the plural."
    "notes":
      "n1": "The card teaches the attested form {1}, a form of the stem {2}; in this line it is written {3}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
      "attested": "Attested: वि जानीह्यार्यान्ये च दस्यवो बर्हिष्मते रन्धया शासदव्रतान् (vi jānīhyāryānye ca dasyavo barhiṣmate randhayā śāsadavratān), RV 1.51.8. Discern thou well Aryas and Dasyus; punishing the lawless, give them up to him whose grass is strewn."
    "bases":
      "दस्यवः": "Dasyus"
