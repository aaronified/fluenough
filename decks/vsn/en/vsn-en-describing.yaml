"cards":
  "vsn-1616":
    "native": "great"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "The stem is महत् (mahat)."
      "attested": "Attested: पवमान स्वर्विदो जायमानोऽभवो महान् (pavamāna svarvido jāyamāno'bhavo mahān), RV 9.59.4. Purifier, you found the light, and at your birth you became great."
    "bases":
      "महान्":
        "meaning": "great"
  "vsn-1617":
    "native": "new"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "attested": "Attested: तूर्णी रथः सदा नवः (tūrṇī rathaḥ sadā navaḥ), RV 3.11.5. A swift chariot, always new."
  "vsn-1618":
    "native": "former; first"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "In the line it is written पूर्वो (pūrvo), with -o for -aḥ before a sonant."
      "attested": "Attested: असूत पूर्वो वृषभो ज्यायानिमा अस्य शुरुधः सन्ति पूर्वीः (asūta pūrvo vṛṣabho jyāyānimā asya śurudhaḥ santi pūrvīḥ), RV 3.38.5. The older bull first begot offspring; these are his many draughts."
  "vsn-1619":
    "native": "bright; pure"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "attested": "Attested: शुचिः पावक ईड्यः (śuciḥ pāvaka īḍyaḥ), RV 7.15.10. Bright, purifier, worthy of praise."
  "vsn-1620":
    "native": "true"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "In the line it is written सत्यो (satyo), with -o for -aḥ before a sonant."
      "attested": "Attested: स हि सत्यो यं पूर्वे चिद्देवासश्चिद्यमीधिरे (sa hi satyo yaṃ pūrve ciddevāsaścidyamīdhire), RV 5.25.2. For he is true, whom the men of old kindled."
  "vsn-1621":
    "native": "best"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "Comparatives and superlatives can be made with -iyas and -istha, as in sreyas and sresṭha, or with -tara and -tama (Whitney, sections 470 c and 471)."
      "n3": "In the line it is written श्रेष्ठो (śreṣṭho), with -o for -aḥ before a sonant."
      "attested": "Attested: श्रेष्ठो देवानां वसुः (śreṣṭho devānāṃ vasuḥ), RV 1.43.5. The best, the good one among the gods."
  "vsn-1622":
    "native": "young"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "The stem is युवन् (yuvan)."
      "attested": "Attested: येषामिन्द्रो युवा सखा (yeṣāmindro yuvā sakhā), RV 8.45.3. Whose friend is Indra, ever young."
    "bases":
      "युवा":
        "meaning": "young"
  "vsn-1623":
    "native": "long"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "In the line it is written दीर्घो (dīrgho), with -o for -aḥ before a sonant."
      "attested": "Attested: तीर्थे नाच्छा तातृषाणमोको दीर्घो न सिध्रमा कृणोत्यध्वा (tīrthe nācchā tātṛṣāṇamoko dīrgho na sidhramā kṛṇotyadhvā), RV 1.173.11. As a ford draws the thirsty, so the long road brings the one who gains his goal."
  "vsn-1624":
    "native": "heavenly"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "In the line it is written दिव्यो (divyo), with -o for -aḥ before a sonant."
      "attested": "Attested: ईशानासो नरो अमर्त्येनास्तावि जनो दिव्यो गयेन (īśānāso naro amartyenāstāvi jano divyo gayena), RV 10.64.17. The lords and men were praised, and the heavenly folk by Gaya."
  "vsn-1625":
    "native": "bright"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "In the line it is written शुक्रो (śukro), with -o for -aḥ before a sonant."
      "attested": "Attested: कनिक्रददनु पन्थामृतस्य शुक्रो वि भास्यमृतस्य धाम (kanikradadanu panthāmṛtasya śukro vi bhāsyamṛtasya dhāma), RV 9.97.32. Bright and bellowing along the path of Order, you shine as the form of life eternal."
  "vsn-1626":
    "native": "grown; great"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "In the line it is written वृद्धो (vṛddho), with -o for -aḥ before a sonant."
      "attested": "Attested: साकं जातः क्रतुना साकमोजसा ववक्षिथ साकं वृद्धो वीर्यैः सासहिर्मृधो विचर्षणिः (sākaṃ jātaḥ kratunā sākamojasā vavakṣitha sākaṃ vṛddho vīryaiḥ sāsahirmṛdho vicarṣaṇiḥ), RV 2.22.3. Born with wisdom, you grew great with heroic deeds."
  "vsn-1627":
    "native": "sharp; strong"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "In the line it is written तीव्रो (tīvro), with -o for -aḥ before a sonant."
      "attested": "Attested: तीव्रो वो मधुमाँ अयं शुनहोत्रेषु मत्सरः (tīvro vo madhumām̐ ayaṃ śunahotreṣu matsaraḥ), RV 2.41.14. Among the Gunahotras, this sweet, gladdening draught is strong for you."
  "vsn-1628":
    "native": "golden"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "The stem is हिरण्मय (hiraṇmaya)."
      "attested": "Attested: हिरण्ययी वां रभिरीषा अक्षो हिरण्ययः (hiraṇyayī vāṃ rabhirīṣā akṣo hiraṇyayaḥ), RV 8.5.29. Golden is your shaft, and the axle is of gold."
    "bases":
      "हिरण्ययः":
        "meaning": "golden"
  "vsn-1629":
    "native": "fortunate"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "attested": "Attested: सुभगः स प्रयज्यवो मरुतो अस्तु मर्त्यः (subhagaḥ sa prayajyavo maruto astu martyaḥ), RV 1.86.7. That mortal shall be fortunate, O Maruts."
  "vsn-1630":
    "native": "immortal"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "In the line it is written अमर्त्यो (amartyo), with -o for -aḥ before a sonant."
      "attested": "Attested: पृथुपाजा अमर्त्यो घृतनिर्णिक्स्वाहुतः (pṛthupājā amartyo ghṛtanirṇiksvāhutaḥ), RV 3.27.5. Immortal, broad in strength, clothed in ghee and well offered to."
  "vsn-1631":
    "native": "hero"
    "notes":
      "n1": "A masculine noun in -a. The line writes वीरो (vīro), with -o for -aḥ before a sonant."
      "attested": "Attested: शृण्वे वीरो विन्दमानो वसूनि महद्देवानामसुरत्वमेकम् (śṛṇve vīro vindamāno vasūni mahaddevānāmasuratvamekam), RV 3.55.20. The hero is renowned for finding treasures; great is the gods' one supreme dominion."
