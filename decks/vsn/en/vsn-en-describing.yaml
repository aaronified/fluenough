"cards":
  "vsn-1616":
    "native": "great"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "The stem is महत् (mahat)."
    "bases":
      "महान्":
        "meaning": "great"
    "examples":
      "पवमान स्वर्विदो जायमानोऽभवो महान्":
        "native": "Purifier, you found the light, and at your birth you became great."
  "vsn-1617":
    "native": "new"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
    "examples":
      "तूर्णी रथः सदा नवः":
        "native": "A swift chariot, always new."
  "vsn-1618":
    "native": "former; first"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "In the line it is written पूर्वो (pūrvo), with -o for -aḥ before a sonant."
    "examples":
      "असूत पूर्वो वृषभो ज्यायानिमा अस्य शुरुधः सन्ति पूर्वीः":
        "native": "The older bull first begot offspring; these are his many draughts."
        "bases":
          "सन्ति": "to be"
          "पूर्वीः": "former"
  "vsn-1619":
    "native": "bright; pure"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
    "examples":
      "शुचिः पावक ईड्यः":
        "native": "Bright, purifier, worthy of praise."
        "bases":
          "ईड्यः": "to praise"
  "vsn-1620":
    "native": "true"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "In the line it is written सत्यो (satyo), with -o for -aḥ before a sonant."
    "examples":
      "स हि सत्यो यं पूर्वे चिद्देवासश्चिद्यमीधिरे":
        "native": "For he is true, whom the men of old kindled."
        "bases":
          "यं": "who"
          "पूर्वे": "former"
  "vsn-1621":
    "native": "best"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "Comparatives and superlatives can be made with -iyas and -istha, as in sreyas and sresṭha, or with -tara and -tama (Whitney, sections 470 c and 471)."
      "n3": "In the line it is written श्रेष्ठो (śreṣṭho), with -o for -aḥ before a sonant."
    "examples":
      "श्रेष्ठो देवानां वसुः":
        "native": "The best, the good one among the gods."
        "bases":
          "देवानां": "god"
  "vsn-1622":
    "native": "young"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "The stem is युवन् (yuvan)."
    "bases":
      "युवा":
        "meaning": "young"
    "examples":
      "येषामिन्द्रो युवा सखा":
        "native": "Whose friend is Indra, ever young."
  "vsn-1623":
    "native": "long"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "In the line it is written दीर्घो (dīrgho), with -o for -aḥ before a sonant."
    "examples":
      "तीर्थे नाच्छा तातृषाणमोको दीर्घो न सिध्रमा कृणोत्यध्वा":
        "native": "As a ford draws the thirsty, so the long road brings the one who gains his goal."
        "bases":
          "तीर्थे": "ford"
  "vsn-1624":
    "native": "heavenly"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "In the line it is written दिव्यो (divyo), with -o for -aḥ before a sonant."
    "examples":
      "ईशानासो नरो अमर्त्येनास्तावि जनो दिव्यो गयेन":
        "native": "The lords and men were praised, and the heavenly folk by Gaya."
        "bases":
          "ईशानासो": "lord"
          "गयेन": "Gaya"
  "vsn-1625":
    "native": "bright"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "In the line it is written शुक्रो (śukro), with -o for -aḥ before a sonant."
    "examples":
      "कनिक्रददनु पन्थामृतस्य शुक्रो वि भास्यमृतस्य धाम":
        "native": "Bright and bellowing along the path of Order, you shine as the form of life eternal."
  "vsn-1626":
    "native": "grown; great"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "In the line it is written वृद्धो (vṛddho), with -o for -aḥ before a sonant."
    "examples":
      "साकं जातः क्रतुना साकमोजसा ववक्षिथ साकं वृद्धो वीर्यैः सासहिर्मृधो विचर्षणिः":
        "native": "Born with wisdom, you grew great with heroic deeds."
        "bases":
          "जातः": "to be born"
          "क्रतुना": "wisdom"
          "वीर्यैः": "deed; power"
  "vsn-1627":
    "native": "sharp; strong"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "In the line it is written तीव्रो (tīvro), with -o for -aḥ before a sonant."
    "examples":
      "तीव्रो वो मधुमाँ अयं शुनहोत्रेषु मत्सरः":
        "native": "Among the Gunahotras, this sweet, gladdening draught is strong for you."
        "bases":
          "वो": "you"
          "अयं": "this"
          "शुनहोत्रेषु": "Gunahotra (a priestly family)"
  "vsn-1628":
    "native": "golden"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "The stem is हिरण्मय (hiraṇmaya)."
    "bases":
      "हिरण्ययः":
        "meaning": "golden"
    "examples":
      "हिरण्ययी वां रभिरीषा अक्षो हिरण्ययः":
        "native": "Golden is your shaft, and the axle is of gold."
        "bases":
          "हिरण्ययी": "golden"
          "वां": "you two"
  "vsn-1629":
    "native": "fortunate"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
    "examples":
      "सुभगः स प्रयज्यवो मरुतो अस्तु मर्त्यः":
        "native": "That mortal shall be fortunate, O Maruts."
        "bases":
          "मरुतो": "Marut"
          "अस्तु": "to be"
  "vsn-1630":
    "native": "immortal"
    "notes":
      "n1": "Adjectives are inflected exactly like nouns of the same final (Whitney, section 322)."
      "n2": "In the line it is written अमर्त्यो (amartyo), with -o for -aḥ before a sonant."
    "examples":
      "पृथुपाजा अमर्त्यो घृतनिर्णिक्स्वाहुतः":
        "native": "Immortal, broad in strength, clothed in ghee and well offered to."
  "vsn-1631":
    "native": "hero"
    "notes":
      "n1": "A masculine noun in -a. The line writes वीरो (vīro), with -o for -aḥ before a sonant."
    "examples":
      "शृण्वे वीरो विन्दमानो वसूनि महद्देवानामसुरत्वमेकम्":
        "native": "The hero is renowned for finding treasures; great is the gods' one supreme dominion."
        "bases":
          "शृण्वे": "to hear"
          "विन्दमानो": "to find"
          "वसूनि": "treasure"
