"cards":
  "vsn-2216":
    "native": "The head."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
    "examples":
      "शिरो बिभेद वृष्णिना":
        "native": "He cleft the head of the fierce-moving Vrtra with his mighty bolt."
        "bases":
          "शिरो": "head"
  "vsn-2217":
    "native": "A hand."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
    "examples":
      "अयं मे हस्तो भगवानयं मे भगवत्तरः":
        "native": "This hand of mine is blessed, and this other one is even more blessed."
        "bases":
          "हस्तो": "hand"
  "vsn-2218":
    "native": "An eye."
    "notes":
      "n1": "Declined like {1} (manas), with the instrumental cakṣuṣā (Whitney §414)."
    "examples":
      "युवं कण्वायापिरिप्ताय चक्षुः प्रत्यधत्तं सुष्टुतिं जुजुषाणा":
        "native": "You gave back the eyes to Kanva, who had been blinded."
        "bases":
          "चक्षुः": "eye"
  "vsn-2219":
    "native": "The mouth, or the face."
    "examples":
      "आलाक्ता या रुरुशीर्ष्ण्यथो यस्या अयो मुखम्":
        "native": "The shaft, smeared with poison and tipped with deer-horn, has an iron mouth."
        "bases":
          "मुखम्": "mouth, face"
  "vsn-2220":
    "native": "The heart."
    "examples":
      "बतो बतासि यम नैव ते मनो हृदयं चाविदाम":
        "native": "Alas, Yama, you are weak; we find in you neither mind nor heart."
        "bases":
          "हृदयं": "heart"
  "vsn-2221":
    "native": "A tooth."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
    "examples":
      "सुपर्णं वस्ते मृगो अस्या दन्तो गोभिः संनद्धा पतति प्रसूता":
        "native": "Her tooth is a deer, clothed in eagle's feathers."
        "bases":
          "दन्तो": "tooth"
  "vsn-2222":
    "native": "The tongue."
    "notes":
      "n1": "Here the tongue is a simile: the fire consumes as a tongue takes what the teeth have grasped."
    "examples":
      "दद्भिर्न जिह्वा परिविष्टमाददाविर्निधीँरकृणोदुस्रियाणाम्": "He consumed them as a tongue takes in what the teeth have gripped."
  "vsn-2223":
    "native": "The self, or soul."
    "notes":
      "n1": "Its stem is {1}, a model n-stem; its nominative is {2} (Whitney §424)."
    "examples":
      "आत्मा यज्ञस्य पूर्व्यः":
        "native": "Indu, you are the first soul of the sacrifice."
        "bases":
          "आत्मा": "self, soul"
  "vsn-2224":
    "native": "Breath, the vital breath."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
    "examples":
      "यो नो द्वेष्ट्यधरः सस्पदीष्ट यमु द्विष्मस्तमु प्राणो जहातु":
        "native": "Let the vital breath leave him whom we hate."
        "bases":
          "प्राणो": "breath"
  "vsn-2225":
    "native": "The back."
    "examples":
      "समुद्रादूर्मिमुदियर्ति वेनो नभोजाः पृष्ठं हर्यतस्य दर्शि":
        "native": "The back of the fair one has been made visible."
        "bases":
          "पृष्ठं": "back"
  "vsn-2226":
    "native": "The mind."
    "notes":
      "n1": "Its stem is {1}, the model that the word for eye is declined like (Whitney §414)."
    "examples":
      "देवत्रा कृणुते मनः":
        "native": "She sets her mind upon the gods."
        "bases":
          "मनः": "mind"
  "vsn-2227":
    "native": "The neck."
    "examples":
      "मोत सूरो अह एवा चन ग्रीवा आदधते वेः": "Let them not snare the neck of that celestial bird, the Sun, by day."
