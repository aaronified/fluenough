"cards":
  "vsn-2216":
    "native": "The head."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
      "attested": "Attested: शिरो बिभेद वृष्णिना (śiro bibheda vṛṣṇinā), RV 8.6.6. He cleft the head of the fierce-moving Vrtra with his mighty bolt."
  "vsn-2217":
    "native": "A hand."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
      "attested": "Attested: अयं मे हस्तो भगवानयं मे भगवत्तरः (ayaṃ me hasto bhagavānayaṃ me bhagavattaraḥ), RV 10.60.12. This hand of mine is blessed, and this other one is even more blessed."
  "vsn-2218":
    "native": "An eye."
    "notes":
      "n1": "Declined like {1} (manas), with the instrumental cakṣuṣā (Whitney §414)."
      "attested": "Attested: युवं कण्वायापिरिप्ताय चक्षुः प्रत्यधत्तं सुष्टुतिं जुजुषाणा (yuvaṃ kaṇvāyāpiriptāya cakṣuḥ pratyadhattaṃ suṣṭutiṃ jujuṣāṇā), RV 1.118.7. You gave back the eyes to Kanva, who had been blinded."
  "vsn-2219":
    "native": "The mouth, or the face."
    "notes":
      "attested": "Attested: आलाक्ता या रुरुशीर्ष्ण्यथो यस्या अयो मुखम् (ālāktā yā ruruśīrṣṇyatho yasyā ayo mukham), RV 6.75.15. The shaft, smeared with poison and tipped with deer-horn, has an iron mouth."
  "vsn-2220":
    "native": "The heart."
    "notes":
      "attested": "Attested: बतो बतासि यम नैव ते मनो हृदयं चाविदाम (bato batāsi yama naiva te mano hṛdayaṃ cāvidāma), RV 10.10.13. Alas, Yama, you are weak; we find in you neither mind nor heart."
  "vsn-2221":
    "native": "A tooth."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
      "attested": "Attested: सुपर्णं वस्ते मृगो अस्या दन्तो गोभिः संनद्धा पतति प्रसूता (suparṇaṃ vaste mṛgo asyā danto gobhiḥ saṃnaddhā patati prasūtā), RV 6.75.11. Her tooth is a deer, clothed in eagle's feathers."
  "vsn-2222":
    "native": "The tongue."
    "notes":
      "n1": "Here the tongue is a simile: the fire consumes as a tongue takes what the teeth have grasped."
      "attested": "Attested: दद्भिर्न जिह्वा परिविष्टमाददाविर्निधीँरकृणोदुस्रियाणाम् (dadbhirna jihvā pariviṣṭamādadāvirnidhīm̐rakṛṇodusriyāṇām), RV 10.68.6. He consumed them as a tongue takes in what the teeth have gripped."
  "vsn-2223":
    "native": "The self, or soul."
    "notes":
      "n1": "Its stem is {1}, a model n-stem; its nominative is {2} (Whitney §424)."
      "attested": "Attested: आत्मा यज्ञस्य पूर्व्यः (ātmā yajñasya pūrvyaḥ), RV 9.2.10. Indu, you are the first soul of the sacrifice."
  "vsn-2224":
    "native": "Breath, the vital breath."
    "notes":
      "n1": "In this line it is written {1}: the final -aḥ before a sounded consonant is written -o (Whitney §175 a)."
      "attested": "Attested: यो नो द्वेष्ट्यधरः सस्पदीष्ट यमु द्विष्मस्तमु प्राणो जहातु (yo no dveṣṭyadharaḥ saspadīṣṭa yamu dviṣmastamu prāṇo jahātu), RV 3.53.21. Let the vital breath leave him whom we hate."
  "vsn-2225":
    "native": "The back."
    "notes":
      "attested": "Attested: समुद्रादूर्मिमुदियर्ति वेनो नभोजाः पृष्ठं हर्यतस्य दर्शि (samudrādūrmimudiyarti veno nabhojāḥ pṛṣṭhaṃ haryatasya darśi), RV 10.123.2. The back of the fair one has been made visible."
  "vsn-2226":
    "native": "The mind."
    "notes":
      "n1": "Its stem is {1}, the model that the word for eye is declined like (Whitney §414)."
      "attested": "Attested: देवत्रा कृणुते मनः (devatrā kṛṇute manaḥ), RV 5.61.7. She sets her mind upon the gods."
  "vsn-2227":
    "native": "The neck."
    "notes":
      "attested": "Attested: मोत सूरो अह एवा चन ग्रीवा आदधते वेः (mota sūro aha evā cana grīvā ādadhate veḥ), RV 6.48.17. Let them not snare the neck of that celestial bird, the Sun, by day."
