"name": "The present tense of the a-class verbs"
"description": "The present indicative of a verb of the a-class, in the active and the middle, as Whitney prints it for भू (bhū), 'be' (§735a): three persons in three numbers. The present system is the most prominent part of the verb: in the Veda its personal forms are about three times as frequent as those of all other systems together (Whitney §600a). The other tenses and the moods are taught later. Not yet checked by a Vedicist: please report any mistake."
