schema: 1
id: "vsn-en-script-letters"
kind: "layer"
core: "vsn-script-letters"
native:
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
name: "Vedic letters, vowel signs and signs"
description: "The Devanagari letters of the Rigveda: the vowels, the consonants by row, the semivowels, sibilants and h, the Vedic letter ळ (ḷa), the signs that go with them, and the vowel signs on क (ka). Each note gives the section of Whitney's Sanskrit Grammar it comes from. Not yet checked by a Vedicist: please report any mistake."
license: "CC-BY-SA-4.0"
tags:
- "unreviewed"
cards:
  "vsn-0400":
    "native": "a, the short vowel that every consonant carries"
    "notes":
      "n1": "The short a. Every consonant sign carries it unless another vowel sign or the virama replaces it: क (ka) is 'ka' (Whitney, section 10 a). In India it is said as the neutral vowel of English 'but', not as open as आ (ā) (Whitney, section 21). Seen in अहः (ahaḥ), 'day'."
  "vsn-0401":
    "native": "aa, the long a"
    "notes":
      "n1": "The long a, as in 'far' (Whitney, section 19). A long vowel is twice as long as a short one (Whitney, section 77). Seen in आदित्यः (ādityaḥ), 'Aditya'."
  "vsn-0402":
    "native": "i, short"
    "notes":
      "n1": "Short i, as in 'pin' (Whitney, section 19). It is a palatal vowel (Whitney, section 20). Seen in इह (iha), 'here'."
  "vsn-0403":
    "native": "ii, long"
    "notes":
      "n1": "Long ī, as in 'pique' (Whitney, section 19), twice as long as इ (i). Seen in ईळे (īḷe), 'I praise'."
  "vsn-0404":
    "native": "u, short"
    "notes":
      "n1": "Short u, as in 'pull' (Whitney, section 19). It is a labial vowel (Whitney, section 20). Seen in उभौ (ubhau), 'both'."
  "vsn-0405":
    "native": "uu, long"
    "notes":
      "n1": "Long ū, as in 'rule' (Whitney, section 19), twice as long as उ (u)."
  "vsn-0406":
    "native": "the r-vowel, short"
    "notes":
      "n1": "A smooth, untrilled r-sound that does the work of a vowel in its syllable (Whitney, section 24). It comes almost always from अर् (ar) or र (ra) (Whitney, section 23). It is common: about as frequent as long ऊ (ū) (Whitney, section 26). Whitney calls the later 'ri' pronunciation a distortion (Whitney, section 24 a). Seen in ऋषिः (ṛṣiḥ), 'seer'."
  "vsn-0407":
    "native": "the r-vowel, long"
    "notes":
      "n1": "The long form of ऋ (ṛ). It is unusual: it occurs only in certain plural cases of noun-stems in ऋ (ṛ) (Whitney, section 26)."
  "vsn-0408":
    "native": "the l-vowel"
    "notes":
      "n1": "An l-sound that does the work of a vowel, like the l of English 'able' (Whitney, section 24). It occurs only in some forms and derivatives of one root, kḷp (Whitney, section 26). Some grammarians add a long ॡ (ḹ), but no real word has it (Whitney, section 23 a), so the course has no card for it. Do not mix it up with ळ (ḷa), a consonant."
  "vsn-0409":
    "native": "e, written as one vowel"
    "notes":
      "n1": "Said as a long e, like the long a of English 'late' or the e of 'they', and not as a diphthong (Whitney, section 28). Whitney still counts it a diphthong, since in origin it was ai (a + i) (Whitney, section 28 a). Seen in एषः (eṣaḥ), 'this'."
  "vsn-0410":
    "native": "ai, a diphthong"
    "notes":
      "n1": "A diphthong, a long ā followed by i: Whitney writes it āi (Whitney, sections 27 and 28 a). It is the stronger (vṛddhi) partner of ए (e) (Whitney, section 27)."
  "vsn-0411":
    "native": "o, written as one vowel"
    "notes":
      "n1": "Said as a long o, not as a diphthong (Whitney, section 28). Whitney still counts it a diphthong, since in origin it was au (a + u) (Whitney, section 28 a)."
  "vsn-0412":
    "native": "au, a diphthong"
    "notes":
      "n1": "A diphthong, a long ā followed by u: Whitney writes it āu (Whitney, sections 27 and 28 a). It is the stronger (vṛddhi) partner of ओ (o) (Whitney, section 27)."
  "vsn-0413":
    "native": "ka, a guttural"
    "notes":
      "n1": "The first guttural, an ordinary European k (Whitney, section 39). It is by far the commonest of its row (Whitney, section 40). The five letters of a row run: surd, surd aspirate, sonant, sonant aspirate, nasal (Whitney, sections 5 and 34). Seen in कदा (kadā), 'when?'."
  "vsn-0414":
    "native": "kha, k with breath"
    "notes":
      "n1": "The aspirate of क (ka): a real stop, k followed by an audible bit of breath before the next sound, and not a fricative (Whitney, sections 37, 37 a, 37 b)."
  "vsn-0415":
    "native": "ga, a guttural"
    "notes":
      "n1": "An ordinary European g (Whitney, section 39). Seen in गच्छति (gacchati), 'to go'."
  "vsn-0416":
    "native": "gha, g with breath"
    "notes":
      "n1": "The sonant aspirate of ग (ga). It is usually understood as g with a perceptible h-sound after it, though scholars disagree about how it was made (Whitney, section 37 c); European scholars say g followed by h (Whitney, section 37 e)."
  "vsn-0417":
    "native": "nga, the guttural nasal"
    "notes":
      "n1": "The nasal of the guttural row, like the ng of English 'singing' (Whitney, section 39). Apart from a few words, it occurs only before another letter of its own row (Whitney, section 40)."
  "vsn-0418":
    "native": "ca, a palatal"
    "notes":
      "n1": "Said as the ch of English 'church' (Whitney, section 44). Seen in चत्वारः (catvāraḥ), 'four'."
  "vsn-0419":
    "native": "cha, c with breath"
    "notes":
      "n1": "The aspirate of च (ca), c followed by h, and not the English 'ch'. It is much rarer, about a tenth as common as च (ca) (Whitney, sections 37 e and 42)."
  "vsn-0420":
    "native": "ja, a palatal"
    "notes":
      "n1": "Said as the j of English 'judge' (Whitney, section 44). Seen in जनः (janaḥ), 'person, people'."
  "vsn-0421":
    "native": "jha, j with breath"
    "notes":
      "n1": "The sonant aspirate of ज (ja). It is excessively rare: once in the Rigveda and not once in the Atharvaveda (Whitney, section 42)."
  "vsn-0422":
    "native": "nya, the palatal nasal"
    "notes":
      "n1": "The nasal of the palatal row. It occurs only immediately before (in a few words also after) another letter of its own row (Whitney, section 42)."
  "vsn-0423":
    "native": "ṭa, a lingual"
    "notes":
      "n1": "The first of the lingual row, said with the tip of the tongue turned up and drawn back into the palate, somewhat as the English r is said (Whitney, section 45). Many European scholars say it like त (ta) (Whitney, section 45)."
  "vsn-0424":
    "native": "ṭha, ṭ with breath"
    "notes":
      "n1": "The aspirate of ट (ṭa). It is a rare letter, as the lingual row is the rarest of the mutes (Whitney, section 46 b)."
  "vsn-0425":
    "native": "ḍa, a lingual"
    "notes":
      "n1": "The sonant lingual. In some Vedic texts it is replaced by ळ (ḷa) between two vowels (Whitney, section 54)."
  "vsn-0426":
    "native": "ḍha, ḍ with breath"
    "notes":
      "n1": "The sonant aspirate of ड (ḍa). It is very rare (Whitney, section 46). Between two vowels some Vedic texts write ळ्ह (ḷha) instead (Whitney, section 54)."
  "vsn-0427":
    "native": "ṇa, the lingual nasal"
    "notes":
      "n1": "The nasal of the lingual row. The dental n is often changed to it after a lingual vowel, semivowel or sibilant in the same word (Whitney, section 46)."
  "vsn-0428":
    "native": "ta, a dental"
    "notes":
      "n1": "The first dental, said with the tip of the tongue at the teeth, much like European t (Whitney, section 47). Seen in तत् (tat), 'that, it'."
  "vsn-0429":
    "native": "tha, t with breath"
    "notes":
      "n1": "The aspirate of त (ta), said as in English 'boathook' (Whitney, section 37 e)."
  "vsn-0430":
    "native": "da, a dental"
    "notes":
      "n1": "The sonant dental, much like European d (Whitney, section 47). Seen in दश (daśa), 'ten'."
  "vsn-0431":
    "native": "dha, d with breath"
    "notes":
      "n1": "The sonant aspirate of द (da), said as in English 'madhouse' (Whitney, section 37 e)."
  "vsn-0432":
    "native": "na, the dental nasal"
    "notes":
      "n1": "The nasal of the dental row, like European n (Whitney, section 47). The dental row is as frequent as the other four rows together (Whitney, section 48). Seen in नव (nava), 'nine'."
  "vsn-0433":
    "native": "pa, a labial"
    "notes":
      "n1": "The first labial, the same as European p (Whitney, section 49). Seen in पिता (pitā), 'father'."
  "vsn-0434":
    "native": "pha, p with breath"
    "notes":
      "n1": "The aspirate of प (pa), said as in English 'haphazard' (Whitney, section 37 e). It is the rarest of the surd aspirates (Whitney, section 50)."
  "vsn-0435":
    "native": "ba, a labial"
    "notes":
      "n1": "The sonant labial, the same as European b (Whitney, section 49). It is much less frequent than भ (bha) (Whitney, section 50). Seen in बहवः (bahavaḥ), 'many'."
  "vsn-0436":
    "native": "bha, b with breath"
    "notes":
      "n1": "The sonant aspirate of ब (ba), said as in English 'abhor' (Whitney, section 37 e). It is the commonest of the sonant aspirates (Whitney, section 50). Seen in भगः (bhagaḥ), 'Bhaga'."
  "vsn-0437":
    "native": "ma, the labial nasal"
    "notes":
      "n1": "The nasal of the labial row, like European m (Whitney, section 49). Seen in माता (mātā), 'mother'."
  "vsn-0438":
    "native": "ya, a semivowel"
    "notes":
      "n1": "The palatal semivowel (Whitney, sections 51 and 56), the consonant closest to the vowel इ (i). In the Veda the metre often shows that an i is to be read where later spelling writes y (Whitney, section 55 a). Seen in यः (yaḥ), 'who, which'."
  "vsn-0439":
    "native": "ra, a semivowel"
    "notes":
      "n1": "A lingual semivowel, said with the tongue tip turned up, like the smooth English r, and not trilled (Whitney, section 52). It stands very high in frequency among the consonants (Whitney, section 52 b). Seen in रोदसी (rodasī), 'heaven and earth'."
  "vsn-0440":
    "native": "la, a semivowel"
    "notes":
      "n1": "A dental semivowel, the l-sound (Whitney, section 53). It interchanges widely with र (ra) (Whitney, section 53 b)."
  "vsn-0441":
    "native": "va, a semivowel"
    "notes":
      "n1": "Said as English v by the modern Hindus, but as English w after a consonant in the same syllable (Whitney, section 57). In the Veda it is often to be read as the vowel उ (u) (Whitney, section 58 a). Seen in वचः (vacaḥ), 'word'."
  "vsn-0442":
    "native": "sha, the palatal sibilant"
    "notes":
      "n1": "The palatal sibilant, the usual sh-sound (Whitney, section 63). Whitney writes it ç; European scholars often say it as s (Whitney, section 63). Seen in शृणोति (śṛṇoti), 'to hear'."
  "vsn-0443":
    "native": "ṣa, the lingual sibilant"
    "notes":
      "n1": "The lingual sibilant, an sh-sound said with the tongue tip turned back (Whitney, section 61). European scholars say it as an ordinary sh (Whitney, section 61). Seen in षट् (ṣaṭ), 'six'."
  "vsn-0444":
    "native": "sa, the dental sibilant"
    "notes":
      "n1": "The plain s, the ordinary European s: a hiss between the tongue and the ridge behind the upper front teeth (Whitney, section 60). Seen in सः (saḥ), 'he, that'."
  "vsn-0445":
    "native": "ha, the breath h"
    "notes":
      "n1": "Ordinarily said like the European h (Whitney, section 65). The native authorities class it as a sonant, and its exact value is hard to say (Whitney, section 65 a). Seen in हवः (havaḥ), 'call'."
  "vsn-0446":
    "native": "the Vedic l, a lingual"
    "notes":
      "n1": "A lingual l-sound written with a slightly different sign. In some Vedic texts it replaces ड (ḍa) between two vowels (Whitney, section 54): ईळे (īḷe) for ईडे (īḍe), but ईड्य (īḍya) where the d is not between vowels. The change is usual in the Rigveda (Whitney, section 54 a). Seen in ईळे (īḷe), 'I praise'."
      "n2": "It is a letter of its own, given beside the alphabet's end (Whitney, section 5 a). Do not mix it up with ऌ (ḷ), the l-vowel."
  "vsn-0447":
    "native": "ka with the anusvara dot"
    "notes":
      "n1": "The anusvāra, a dot above the syllable (Whitney, section 73 a). It is a nasal sound without the closure of a nasal consonant: nasal resonance with the mouth somewhat open (Whitney, section 70). Manuscripts write it for any nasal that follows a vowel before a consonant or at a word's end (Whitney, section 73 b). Seen in संवत्सरम् (saṃvatsaram), 'year'."
  "vsn-0448":
    "native": "ka with the visarga"
    "notes":
      "n1": "The visarga, two dots after the syllable (Whitney, section 67). It is a surd breath, a final h-sound said in the mouth-position of the vowel before it (Whitney, section 67). It is always a substitute for a final s or r (Whitney, section 68). Seen in सः (saḥ), 'he, that'."
  "vsn-0449":
    "native": "ka with the candrabindu"
    "notes":
      "n1": "The candrabindu, 'moon dot': a dot in a half-circle above the syllable (en.wikipedia, Chandrabindu). In many printed texts it is the sign for a nasalised vowel, while कं (kaṃ) is kept for other nasals; Whitney says the two signs are originally and properly equivalent (Whitney, section 73 a)."
  "vsn-0450":
    "native": "the avagraha"
    "notes":
      "n1": "The avagraha, 'separator' (Whitney, section 16 a). European printed texts use it for one thing only: the lost initial अ (a) after a final ए (e) or ओ (o), as in ते ऽब्रुवन् (te 'bruvan) for te abruvan (Whitney, section 16 a). It has no sound of its own. Manuscripts also use it as a hyphen or to mark a hiatus (Whitney, section 16 a)."
  "vsn-0451":
    "native": "k with the virama, no vowel"
    "notes":
      "n1": "The virāma ('rest, stop'), a stroke under a consonant: the consonant is then said alone, without a vowel (Whitney, section 11). It is needed mostly for a final consonant before a pause, and it may also be used to avoid an awkward conjunct (Whitney, section 11 a)."
  "vsn-0452":
    "native": "kaa, k with the aa sign"
    "notes":
      "n1": "The long ā is written as a perpendicular stroke after the consonant (Whitney, section 10 b). Seen in सा (sā), 'she, that'."
  "vsn-0453":
    "native": "ki, k with the i sign"
    "notes":
      "n1": "The short i is written as a stroke placed before the consonant, joined to it by a hook above the line (Whitney, section 10 c). Seen in कति (kati), 'how many?'."
  "vsn-0454":
    "native": "kii, k with the ii sign"
    "notes":
      "n1": "The long ī is written as the same stroke placed after the consonant, joined by a hook above (Whitney, section 10 c). Seen in वीरः (vīraḥ), 'hero'."
  "vsn-0455":
    "native": "ku, k with the u sign"
    "notes":
      "n1": "The u-sounds are written as hooks at the lower end of the consonant sign (Whitney, section 10 d). With र (ra) and ह (ha) the forms are irregular: रु (ru), हु (hu) (Whitney, section 10 d). Seen in कुह (kuha), 'where?'."
  "vsn-0456":
    "native": "kuu, k with the uu sign"
    "notes":
      "n1": "The long ū, a hook at the lower end of the consonant, in its long form (Whitney, section 10 d). Seen in पूषा (pūṣā), 'Pushan'."
  "vsn-0457":
    "native": "kṛ, k with the r-vowel sign"
    "notes":
      "n1": "The r-vowel is written as a hook under the consonant, single for the short vowel and double for the long, opening to the right (Whitney, section 10 e). Seen in शृणोति (śṛṇoti), 'to hear'."
  "vsn-0458":
    "native": "kṝ, k with the long r-vowel sign"
    "notes":
      "n1": "The double hook under the consonant for the long r-vowel (Whitney, section 10 e)."
  "vsn-0459":
    "native": "kḷ, k with the l-vowel sign"
    "notes":
      "n1": "The l-vowel is written with a reduced form of its full initial character (Whitney, section 10 f). The long l-vowel has no real occurrence (Whitney, section 23 a)."
  "vsn-0460":
    "native": "ke, k with the e sign"
    "notes":
      "n1": "The diphthongs are written as strokes above the upper line, one for ए (e) (Whitney, section 10 g). Seen in ईळे (īḷe), 'I praise'."
  "vsn-0461":
    "native": "kai, k with the ai sign"
    "notes":
      "n1": "Two strokes above the upper line for ऐ (ai) (Whitney, section 10 g). Seen in कस्मै (kasmai), 'for whom?'."
  "vsn-0462":
    "native": "ko, k with the o sign"
    "notes":
      "n1": "ओ (o) is written with the ā-sign after the consonant and a stroke above the line (Whitney, section 10 g). Seen in होता (hotā), 'invoking priest'."
  "vsn-0463":
    "native": "kau, k with the au sign"
    "notes":
      "n1": "औ (au) is written with the ā-sign after the consonant and two strokes above the line (Whitney, section 10 g). Seen in उभौ (ubhau), 'both'."
