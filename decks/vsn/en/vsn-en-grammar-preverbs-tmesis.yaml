"name": "Preverbs and the verb apart (tmesis)"
"description": "The nineteen verbal prefixes of Whitney's section 1077, the words of direction that stand with a verb, in the order of their frequency in the older language. In classical Sanskrit the prefix stands immediately before the verb; in the Veda its position is quite free, it may be separated from the verb by other words, and may even come after the verb (Whitney §1081a, §1081). Lines of the Rigveda from the word decks show both orders. Not yet checked by a Vedicist: please report any mistake."
"license": "CC-BY-SA-4.0"
