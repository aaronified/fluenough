"cards":
  "vsn-0700":
    "native": "forward, onward, forth, fore"
    "notes":
      "p1": "Whitney §1077 lists प्र (pra) among the verbal prefixes, the words of direction that stand with a verb (§1076), with the fundamental meaning 'forward, onward, forth, fore'. In the older language it ranks 1 of the 19 in frequency, by the number of roots it is used with in the Rigveda and the Atharvaveda (§1077a). The meanings given are only the leading ones: with a root they change, literally and figuratively (§1077b)."
      "u1": "The line तद्वामृतं रोदसी प्र ब्रवीमि जायमानो मातरा गर्भो अत्ति (tadvāmṛtaṃ rodasī pra bravīmi jāyamāno mātarā garbho atti), 'I tell you this truth, heaven and earth: the infant devours its parents at birth.', shows it. In this line प्र (pra) stands directly before its verb ब्रवीमि (bravīmi), 'I tell': the order of the later language, in which the prefix stands immediately before the verb (Whitney §1081)."
  "vsn-0701":
    "native": "to, unto, at"
    "notes":
      "p1": "Whitney §1077 lists आ (ā) among the verbal prefixes, the words of direction that stand with a verb (§1076), with the fundamental meaning 'to, unto, at'. In the older language it ranks 2 of the 19 in frequency, by the number of roots it is used with in the Rigveda and the Atharvaveda (§1077a). The meanings given are only the leading ones: with a root they change, literally and figuratively (§1077b). Whitney §1080: when more than one prefix stands before a root, आ (ā) is almost never allowed to come in front of any of the others."
      "u1": "The line आ न ऊर्जं वहतमश्विना युवम् (ā na ūrjaṃ vahatamaśvinā yuvam), 'Bring us strength, you two Ashvins.', shows it. In this line आ (ā) opens the line and its verb वहतम् (vahatam), 'bring', comes after two other words, न (na) and ऊर्जं (ūrjaṃ): in the Veda a prefix may be separated from its verb by other words (Whitney §1081a). This separation is what the course calls tmesis."
      "u2": "The line आ मातरा भरति शुष्म्या गोर्नृवत्परिज्मन्नोनुवन्त वाताः (ā mātarā bharati śuṣmyā gornṛvatparijmannonuvanta vātāḥ), 'The strong one brings the bull's two parents near.', shows it. In this line आ (ā) and its verb भरति (bharati), 'brings', have one word, मातरा (mātarā), between them: the separation Whitney describes for the Veda (§1081a), called tmesis."
  "vsn-0702":
    "native": "apart, asunder, away, out"
    "notes":
      "p1": "Whitney §1077 lists वि (vi) among the verbal prefixes, the words of direction that stand with a verb (§1076), with the fundamental meaning 'apart, asunder, away, out'. In the older language it ranks 3 of the 19 in frequency, by the number of roots it is used with in the Rigveda and the Atharvaveda (§1077a). The meanings given are only the leading ones: with a root they change, literally and figuratively (§1077b). Whitney §1077b: an intensive force is not infrequently given by परि (pari), वि (vi) and सम् (sam)."
      "u1": "The line कनिक्रददनु पन्थामृतस्य शुक्रो वि भास्यमृतस्य धाम (kanikradadanu panthāmṛtasya śukro vi bhāsyamṛtasya dhāma), 'Bright and bellowing along the path of Order, you shine as the form of life eternal.', shows it. In this line वि (vi) stands before its verb, 'you shine'; the line writes the verb together with the next word, as भास्यमृतस्य (bhāsyamṛtasya). Directly before the verb is the order of the later language (Whitney §1081)."
  "vsn-0703":
    "native": "along, with, together"
    "notes":
      "p1": "Whitney §1077 lists सम् (sam) among the verbal prefixes, the words of direction that stand with a verb (§1076), with the fundamental meaning 'along, with, together'. In the older language it ranks 4 of the 19 in frequency, by the number of roots it is used with in the Rigveda and the Atharvaveda (§1077a). The meanings given are only the leading ones: with a root they change, literally and figuratively (§1077b). Whitney §1077b: an intensive force is not infrequently given by परि (pari), वि (vi) and सम् (sam)."
  "vsn-0704":
    "native": "to, unto, against (often with implied violence)"
    "notes":
      "p1": "Whitney §1077 lists अभि (abhi) among the verbal prefixes, the words of direction that stand with a verb (§1076), with the fundamental meaning 'to, unto, against (often with implied violence)'. In the older language it ranks 5 of the 19 in frequency, by the number of roots it is used with in the Rigveda and the Atharvaveda (§1077a). The meanings given are only the leading ones: with a root they change, literally and figuratively (§1077b)."
      "u1": "The line कन्या इव वहतुमेतवा उ अञ्ज्यञ्जाना अभि चाकशीमि (kanyā iva vahatumetavā u añjyañjānā abhi cākaśīmi), 'Like maidens adorning themselves for the bridal procession, I now behold them.', shows it. In this line अभि (abhi) stands directly before its verb चाकशीमि (cākaśīmi), 'I behold' (Whitney §1081)."
  "vsn-0705":
    "native": "down; in, into"
    "notes":
      "p1": "Whitney §1077 lists नि (ni) among the verbal prefixes, the words of direction that stand with a verb (§1076), with the fundamental meaning 'down; in, into'. In the older language it ranks 6 of the 19 in frequency, by the number of roots it is used with in the Rigveda and the Atharvaveda (§1077a). The meanings given are only the leading ones: with a root they change, literally and figuratively (§1077b)."
      "u1": "The line नि गव्यवोऽनवो द्रुह्यवश्च षष्टिः शता सुषुपुः षट् सहस्रा (ni gavyavo'navo druhyavaśca ṣaṣṭiḥ śatā suṣupuḥ ṣaṭ sahasrā), 'Sixty hundred, yes, six thousand, have fallen asleep.', shows it. In this line नि (ni) opens the line and its verb सुषुपुः (suṣupuḥ), 'have fallen asleep', comes after four other words: in the Veda a prefix may be separated from its verb by other words (Whitney §1081a), called tmesis."
  "vsn-0706":
    "native": "up, up forth or out"
    "notes":
      "p1": "Whitney §1077 lists उद् (ud) among the verbal prefixes, the words of direction that stand with a verb (§1076), with the fundamental meaning 'up, up forth or out'. In the older language it ranks 7 of the 19 in frequency, by the number of roots it is used with in the Rigveda and the Atharvaveda (§1077a). The meanings given are only the leading ones: with a root they change, literally and figuratively (§1077b)."
  "vsn-0707":
