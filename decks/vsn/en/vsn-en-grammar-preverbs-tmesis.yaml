      "u1": "The line पश्चात्पुरस्तादधरादुदक्तात्कविः काव्येन परि पाहि राजन् (paścātpurastādadharādudaktātkaviḥ kāvyena pari pāhi rājan), 'From behind, from in front, from below and from above, protect us, O king, as a sage.', shows it. In this line परि (pari) stands directly before its verb पाहि (pāhi), 'protect' (Whitney §1081)."
