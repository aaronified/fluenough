"name": "Multi-word verbs: Whitney's examples"
"description": "Two of the Atharvaveda lines that Whitney quotes for the preverb apart from its verb; the other two of his examples are not on sa.wikisource and are not included. Not yet checked by a Vedicist: please report any mistake."
