"tags":
- "unreviewed"
"cards":
  "vsn-6218":
    "native": "may he lengthen out (our lives)"
    "notes":
      "u1": "AV 2.4.6: अथो सहस्वान् जङ्गिडः प्र ण आयुंषि तारिषत् (atho sahasvān jaṅgiḍaḥ pra ṇa āyuṃṣi tāriṣat). The preverb is apart from its verb: ण आयुंषि (ṇa āyuṃṣi), our lives comes between them. Whitney, section 1081 b, quotes this kind of line."
    "bases":
      "प्र": { "meaning": "forth" }
      "तारिषत्": { "meaning": "lengthen (out)" }
  "vsn-6219":
    "native": "to protect (us all round)"
    "notes":
      "u1": "AV 2.7.4: परि मां परि मे प्रजां परि णः पाहि यद्धनम् (pari māṃ pari me prajāṃ pari ṇaḥ pāhi yaddhanam). The preverb is apart from its verb: णः (ṇaḥ), us comes between them in परि णः पाहि (pari ṇaḥ pāhi). Whitney, section 1081 b, quotes this kind of line."
    "bases":
      "परि": { "meaning": "around, over" }
      "पाहि": { "meaning": "protect" }
