tags:
- "unreviewed"
cards:
  "vsn-1021":
    "native": "father"
    "notes":
      "n1": "A noun of relationship in -ṛ: the stem पितृ (pitṛ) gives the nominative पिता (pitā) (Whitney, section 369)."
    "examples":
      "मधु द्यौरस्तु नः पिता":
        "native": "May Heaven, our father, be sweet to us."
        "bases":
          "पिता": "father"
  "vsn-1022":
    "native": "mother"
    "notes":
      "n1": "A noun of relationship in -ṛ: the stem मातृ (mātṛ) gives the nominative माता (mātā), as पितृ (pitṛ) gives पिता (pitā) (Whitney, section 369)."
    "examples":
      "अश्वेव चित्रारुषी माता गवामृतावरी":
        "native": "Like a bright red mare, the mother rich in cows."
        "bases":
          "माता": "mother"
  "vsn-1023":
    "native": "son"
    "examples":
      "पुत्रः कण्वस्य वामृषिर्गीर्भिर्वत्सो अवीवृधत्":
        "native": "Kanva's son, the seer Vatsa, has magnified you two with songs."
  "vsn-1024":
    "native": "son"
    "notes":
      "n1": "A u-stem noun: its nominative ends in -uḥ, from -us, as in the grammar's models शत्रु (śatru) and धेनु (dhenu) (Whitney, section 341)."
    "examples":
      "अवोचाम निवचनान्यस्मिन्मानस्य सूनुः सहसाने अग्नौ":
        "native": "I, son of Mana, have spoken my devout words to him, Agni the victor."
        "bases":
          "अग्नौ": "to Agni"
  "vsn-1025":
    "native": "daughter"
    "notes":
      "n1": "A noun of relationship in -ṛ: the stem दुहितृ (duhitṛ) has the same -tṛ ending as पितृ (pitṛ) and मातृ (mātṛ) (Whitney, section 369)."
    "examples":
      "दिवो अदर्शि दुहिता":
        "native": "The daughter of heaven has shown herself."
        "bases":
          "दुहिता": "daughter"
  "vsn-1026":
    "native": "brother"
    "notes":
      "n1": "A noun of relationship in -ṛ: the stem भ्रातृ (bhrātṛ) gives the nominative भ्राता (bhrātā) (Whitney, section 369)."
    "examples":
      "यस्त्वा भ्राता पतिर्भूत्वा जारो भूत्वा निपद्यते":
        "native": "Whoever lies in wait for you, as brother, husband or lover."
        "bases":
          "भ्राता": "brother"
  "vsn-1027":
    "native": "sister"
    "notes":
      "n1": "Its stem स्वसृ (svasṛ) gives the nominative स्वसा (svasā), as पितृ (pitṛ) gives पिता (pitā) (Whitney, section 369)."
    "examples":
      "सिनीवालि पृथुष्टुके या देवानामसि स्वसा":
        "native": "Sinivali, broad-tressed one, you who are the sister of the gods."
        "bases":
          "स्वसा": "sister"
          "या": "who"
  "vsn-1028":
    "native": "husband, lord"
    "notes":
      "n1": "Means husband and also lord or master. In this verse the wife speaks of her lord (Griffith's English of this verse, RV 10.159.2)."
    "examples":
      "ममेदनु क्रतुं पतिः सेहानाया उपाचरेत्":
        "native": "My lord shall follow my will, I who am victorious."
  "vsn-1029":
    "native": "wife"
    "notes":
      "n1": "The pair is wife and husband: जाया (jāyā) is the wife and पति (pati) the husband in this line (Griffith's English of this verse, RV 10.85.29)."
    "examples":
      "कृत्यैषा पद्वती भूत्व्या जाया विशते पतिम्":
        "native": "This she-fiend, now with feet, enters her husband as a wife."
        "bases":
          "पतिम्": "husband"
  "vsn-1030":
    "native": "friend"
    "notes":
      "n1": "Its stem सखि (sakhi) differs from the nominative सखा (sakhā), which the card teaches."
    "examples":
      "धीवतोधीवतः सखा":
        "native": "The friend of every devout man."
        "bases":
          "सखा": "friend"
  "vsn-1031":
    "native": "begetter, father"
    "notes":
      "n1": "An agent noun in -tṛ: the stem जनितृ (janitṛ) gives the nominative जनिता (janitā). Agent nouns are mostly in -tṛ (Whitney, section 369)."
    "examples":
      "समानो वां जनिता भ्रातरा युवं यमाविहेहमातरा":
        "native": "You two, brothers and twins, have one common father."
        "bases":
          "जनिता": "begetter"
          "भ्रातरा": "brothers"
  "vsn-1032":
    "native": "girl, maiden"
    "examples":
      "कन्या इव वहतुमेतवा उ अञ्ज्यञ्जाना अभि चाकशीमि":
        "native": "Like maidens adorning themselves for the bridal procession, I now behold them."
