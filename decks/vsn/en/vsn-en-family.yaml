tags:
- "unreviewed"
cards:
  "vsn-1021":
    "native": "father"
    "notes":
      "n1": "A noun of relationship in -ṛ: the stem पितृ (pitṛ) gives the nominative पिता (pitā) (Whitney, section 369)."
      "attested": "Attested: मधु द्यौरस्तु नः पिता (madhu dyaurastu naḥ pitā), RV 1.90.7. May Heaven, our father, be sweet to us."
  "vsn-1022":
    "native": "mother"
    "notes":
      "n1": "A noun of relationship in -ṛ: the stem मातृ (mātṛ) gives the nominative माता (mātā), as पितृ (pitṛ) gives पिता (pitā) (Whitney, section 369)."
      "attested": "Attested: अश्वेव चित्रारुषी माता गवामृतावरी (aśveva citrāruṣī mātā gavāmṛtāvarī), RV 4.52.2. Like a bright red mare, the mother rich in cows."
  "vsn-1023":
    "native": "son"
    "notes":
      "attested": "Attested: पुत्रः कण्वस्य वामृषिर्गीर्भिर्वत्सो अवीवृधत् (putraḥ kaṇvasya vāmṛṣirgīrbhirvatso avīvṛdhat), RV 8.8.8. Kanva's son, the seer Vatsa, has magnified you two with songs."
  "vsn-1024":
    "native": "son"
    "notes":
      "n1": "A u-stem noun: its nominative ends in -uḥ, from -us, as in the grammar's models शत्रु (śatru) and धेनु (dhenu) (Whitney, section 341)."
      "attested": "Attested: अवोचाम निवचनान्यस्मिन्मानस्य सूनुः सहसाने अग्नौ (avocāma nivacanānyasminmānasya sūnuḥ sahasāne agnau), RV 1.189.8. I, son of Mana, have spoken my devout words to him, Agni the victor."
  "vsn-1025":
    "native": "daughter"
    "notes":
      "n1": "A noun of relationship in -ṛ: the stem दुहितृ (duhitṛ) has the same -tṛ ending as पितृ (pitṛ) and मातृ (mātṛ) (Whitney, section 369)."
      "attested": "Attested: दिवो अदर्शि दुहिता (divo adarśi duhitā), RV 4.52.1. The daughter of heaven has shown herself."
  "vsn-1026":
    "native": "brother"
    "notes":
      "n1": "A noun of relationship in -ṛ: the stem भ्रातृ (bhrātṛ) gives the nominative भ्राता (bhrātā) (Whitney, section 369)."
      "attested": "Attested: यस्त्वा भ्राता पतिर्भूत्वा जारो भूत्वा निपद्यते (yastvā bhrātā patirbhūtvā jāro bhūtvā nipadyate), RV 10.162.5. Whoever lies in wait for you, as brother, husband or lover."
  "vsn-1027":
    "native": "sister"
    "notes":
      "n1": "Its stem स्वसृ (svasṛ) gives the nominative स्वसा (svasā), as पितृ (pitṛ) gives पिता (pitā) (Whitney, section 369)."
      "attested": "Attested: सिनीवालि पृथुष्टुके या देवानामसि स्वसा (sinīvāli pṛthuṣṭuke yā devānāmasi svasā), RV 2.32.6. Sinivali, broad-tressed one, you who are the sister of the gods."
  "vsn-1028":
    "native": "husband, lord"
    "notes":
      "n1": "Means husband and also lord or master. In this verse the wife speaks of her lord (Griffith's English of this verse, RV 10.159.2)."
      "attested": "Attested: ममेदनु क्रतुं पतिः सेहानाया उपाचरेत् (mamedanu kratuṃ patiḥ sehānāyā upācaret), RV 10.159.2. My lord shall follow my will, I who am victorious."
  "vsn-1029":
    "native": "wife"
    "notes":
      "n1": "The pair is wife and husband: जाया (jāyā) is the wife and पति (pati) the husband in this line (Griffith's English of this verse, RV 10.85.29)."
      "attested": "Attested: कृत्यैषा पद्वती भूत्व्या जाया विशते पतिम् (kṛtyaiṣā padvatī bhūtvyā jāyā viśate patim), RV 10.85.29. This she-fiend, now with feet, enters her husband as a wife."
  "vsn-1030":
    "native": "friend"
    "notes":
      "n1": "Its stem सखि (sakhi) differs from the nominative सखा (sakhā), which the card teaches."
      "attested": "Attested: धीवतोधीवतः सखा (dhīvatodhīvataḥ sakhā), RV 6.55.3. The friend of every devout man."
  "vsn-1031":
    "native": "begetter, father"
    "notes":
      "n1": "An agent noun in -tṛ: the stem जनितृ (janitṛ) gives the nominative जनिता (janitā). Agent nouns are mostly in -tṛ (Whitney, section 369)."
      "attested": "Attested: समानो वां जनिता भ्रातरा युवं यमाविहेहमातरा (samāno vāṃ janitā bhrātarā yuvaṃ yamāvihehamātarā), RV 6.59.2. You two, brothers and twins, have one common father."
  "vsn-1032":
    "native": "girl, maiden"
    "notes":
      "attested": "Attested: कन्या इव वहतुमेतवा उ अञ्ज्यञ्जाना अभि चाकशीमि (kanyā iva vahatumetavā u añjyañjānā abhi cākaśīmi), RV 4.58.9. Like maidens adorning themselves for the bridal procession, I now behold them."
