  "name": "English"
name: "Family"
description: "Twelve words for family: father, mother, son, daughter, brother, sister, husband, wife, friend and girl, each with a line from the Rigveda. Vedic Sanskrit in Devanagari; each reading is based on ISO 15919 and the pronunciation is reconstructed. Not yet checked by a Vedicist: please report any mistake."
