"cards":
  "vsn-2200":
    "native": "A milch cow, a cow that gives milk."
    "notes":
      "n1": "Its stem is {1}, a u-stem feminine: the model u-stem feminine noun in Whitney's grammar (Whitney §341)."
    "examples":
      "त्वे धेनुः सुदुघा जातवेदोऽसश्चतेव समना सबर्धुक्":
        "native": "The teeming cow is yours, O Jatavedas, pouring her ceaseless flow."
        "bases":
          "धेनुः": "milch cow"
  "vsn-2201":
    "native": "A bull."
    "notes":
      "n1": "Its stem is {1}, an n-stem: the Veda has this word for bull as an n-stem (Whitney §426)."
    "examples":
      "उक्षा ह यत्र परि धानमक्तोरनु स्वं धाम जरितुर्ववक्ष":
        "native": "The singer's bull, who drives off the night, grew stronger by his own law."
        "bases":
          "उक्षा": "bull"
  "vsn-2202":
    "native": "A bull."
    "notes":
      "n1": "In this line the final -aḥ before a sounded consonant is written -o: {1} (Whitney §175 a)."
    "examples":
      "सहस्रशृङ्गो वृषभो यः समुद्रादुदाचरत्":
        "native": "The bull who has a thousand horns rose up out of the sea."
        "bases":
          "वृषभो": "bull"
  "vsn-2203":
    "native": "A calf, a young animal of the herd."
    "examples":
      "सं वत्स इव मातृभिरिन्दुर्हिन्वानो अज्यते": "Just as a calf is urged on among its mother cows, so Indu is pressed out and sent forward."
  "vsn-2204":
    "native": "Cattle; a beast of the herd."
    "notes":
      "n1": "In this verse it is the sacrificial victim, the beast offered at the fire, not the herd in general."
    "examples":
      "यत्र वह्निरभिहितो दुद्रवद्द्रोण्यः पशुः":
        "native": "Where the fire is set, the victim runs swiftly in the trough."
        "bases":
          "पशुः": "cattle"
  "vsn-2205":
    "native": "Pasture, or fodder: the grass that cattle eat."
    "examples":
      "परा गावो यवसं कच्चिदाघृणे नित्यं रेक्णो अमर्त्य":
        "native": "My kine seek their pasture wherever they will, O Radiant God."
        "bases":
          "यवसं": "pasture, fodder"
  "vsn-2206":
    "native": "Milk."
    "notes":
      "n1": "Its stem is {1}, one of the nouns in -ra (Whitney §1188)."
    "examples":
      "तस्मै सरस्वती दुहे क्षीरं सर्पिर्मधूदकम्":
        "native": "For that man Sarasvati draws forth milk, butter, and sweet water."
        "bases":
          "क्षीरं": "milk"
  "vsn-2207":
    "native": "A chariot, a car."
    "examples":
      "सोमपेयं सुखो रथः":
        "native": "The light chariot carries the singer on to the Soma draught."
        "bases":
          "रथः": "chariot"
  "vsn-2208":
    "native": "A steed, a strong horse."
    "notes":
      "n1": "In this verse the steed is the Soma juice itself, becoming sovereign of the streams."
    "examples":
      "एष रुक्मिभिरीयते वाजी शुभ्रेभिरंशुभिः":
        "native": "He moves, a vigorous steed adorned with shining golden rays."
        "bases":
          "वाजी": "steed"
  "vsn-2209":
    "native": "A goat."
    "notes":
      "n1": "In this verse the goat is led before the sacrificial steed, as its kin."
    "examples":
      "अजः पुरो नीयते नाभिरस्यानु पश्चात्कवयो यन्ति रेभाः":
        "native": "A goat is led forward before him, and the sages and singers follow behind."
        "bases":
          "अजः": "goat"
  "vsn-2210":
    "native": "Herdsmen, keepers of cattle; the plural of herdsman."
    "notes":
      "n1": "The attested plural form is taught here; its stem is {1}, herdsman."
    "bases":
      "गोपाः": "herdsmen"
    "examples":
      "अग्ने तोकस्य नस्तने तनूनामप्रयुच्छन्दीद्यद्बोधि गोपाः":
        "native": "Agni, be an ever-watchful keeper for our children and our offspring."
        "bases":
          "गोपाः": "herdsmen"
  "vsn-2211":
    "native": "A bull, or a stallion; a male animal in its strength."
    "notes":
      "n1": "Its stem is {1}; the Veda has this word for bull as an n-stem (Whitney §426)."
    "examples":
      "इन्द्रमिन्दो वृषा विश":
        "native": "Soma, pass into Indra as a bull."
        "bases":
          "वृषा": "bull, stallion"
  "vsn-2212":
    "native": "Rich in horses."
    "notes":
      "n1": "Fused in the verse with the next word, {1}, so the line writes the two as one; the card teaches the first part."
    "examples":
      "नू नो गोमद्वीरवद्धेहि रत्नमुषो अश्वावत्पुरुभोजो अस्मे": "Now, Dawn, give us wealth with kine, with heroes, and rich in horses."
  "vsn-2213":
    "native": "The two bay horses, the pair of horses in the hymns."
    "notes":
      "n1": "Attested here as {1}, a form of the stem {2} (hari), and the card teaches the attested form."
    "bases":
      "हरी": "the two bay horses (of Indra)"
    "examples":
      "हरी इवान्धांसि बप्सता":
        "native": "Best strength-givers, you stretch wide jaws, like two bay horses champing the herbs."
        "bases":
          "हरी": "the two bay horses (of Indra)"
  "vsn-2214":
    "native": "A cow, here a barren cow."
    "notes":
      "n1": "In this list of sacrificial animals it is a barren cow; Griffith's English gives barren cows."
    "examples":
      "यस्मिन्नश्वास ऋषभास उक्षणो वशा मेषा अवसृष्टास आहुताः": "Horses, bulls, oxen, barren cows and rams are offered up to Agni."
  "vsn-2215":
    "native": "Lord of cattle; the master of the herds."
    "notes":
      "n1": "In this verse the wish is to be lord of herds of kine, so as to strengthen and enrich the sage."
    "examples":
      "यदहं गोपतिः स्याम्":
        "native": "If only I were the lord of cattle, to enrich the sage."
        "bases":
          "गोपतिः": "lord of cattle"
