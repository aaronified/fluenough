"name": "Cattle and horse"
"description": "Words for cattle, horses, herds and pasture, from the Rigveda; each gloss is from Griffith's translation of the same verse. Vedic Sanskrit in Devanagari; each reading is based on ISO 15919 and the pronunciation is reconstructed. Vedic accent marks are not shown. Not yet checked by a Vedicist: please report any mistake."
