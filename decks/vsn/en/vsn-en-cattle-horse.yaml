"cards":
  "vsn-2200":
    "native": "A milch cow, a cow that gives milk."
    "notes":
      "n1": "Its stem is {1}, a u-stem feminine: the model u-stem feminine noun in Whitney's grammar (Whitney §341)."
      "attested": "Attested: त्वे धेनुः सुदुघा जातवेदोऽसश्चतेव समना सबर्धुक् (tve dhenuḥ sudughā jātavedo'saścateva samanā sabardhuk), RV 10.69.8. The teeming cow is yours, O Jatavedas, pouring her ceaseless flow."
  "vsn-2201":
    "native": "A bull."
    "notes":
      "n1": "Its stem is {1}, an n-stem: the Veda has this word for bull as an n-stem (Whitney §426)."
      "attested": "Attested: उक्षा ह यत्र परि धानमक्तोरनु स्वं धाम जरितुर्ववक्ष (ukṣā ha yatra pari dhānamaktoranu svaṃ dhāma jariturvavakṣa), RV 3.7.6. The singer's bull, who drives off the night, grew stronger by his own law."
  "vsn-2202":
    "native": "A bull."
    "notes":
      "n1": "In this line the final -aḥ before a sounded consonant is written -o: {1} (Whitney §175 a)."
      "attested": "Attested: सहस्रशृङ्गो वृषभो यः समुद्रादुदाचरत् (sahasraśṛṅgo vṛṣabho yaḥ samudrādudācarat), RV 7.55.7. The bull who has a thousand horns rose up out of the sea."
  "vsn-2203":
    "native": "A calf, a young animal of the herd."
    "notes":
      "attested": "Attested: सं वत्स इव मातृभिरिन्दुर्हिन्वानो अज्यते (saṃ vatsa iva mātṛbhirindurhinvāno ajyate), RV 9.105.2. Just as a calf is urged on among its mother cows, so Indu is pressed out and sent forward."
  "vsn-2204":
    "native": "Cattle; a beast of the herd."
    "notes":
      "n1": "In this verse it is the sacrificial victim, the beast offered at the fire, not the herd in general."
      "attested": "Attested: यत्र वह्निरभिहितो दुद्रवद्द्रोण्यः पशुः (yatra vahnirabhihito dudravaddroṇyaḥ paśuḥ), RV 5.50.4. Where the fire is set, the victim runs swiftly in the trough."
  "vsn-2205":
    "native": "Pasture, or fodder: the grass that cattle eat."
    "notes":
      "attested": "Attested: परा गावो यवसं कच्चिदाघृणे नित्यं रेक्णो अमर्त्य (parā gāvo yavasaṃ kaccidāghṛṇe nityaṃ rekṇo amartya), RV 8.4.18. My kine seek their pasture wherever they will, O Radiant God."
  "vsn-2206":
    "native": "Milk."
    "notes":
      "n1": "Its stem is {1}, one of the nouns in -ra (Whitney §1188)."
      "attested": "Attested: तस्मै सरस्वती दुहे क्षीरं सर्पिर्मधूदकम् (tasmai sarasvatī duhe kṣīraṃ sarpirmadhūdakam), RV 9.67.32. For that man Sarasvati draws forth milk, butter, and sweet water."
  "vsn-2207":
    "native": "A chariot, a car."
    "notes":
      "attested": "Attested: सोमपेयं सुखो रथः (somapeyaṃ sukho rathaḥ), RV 1.120.11. The light chariot carries the singer on to the Soma draught."
  "vsn-2208":
    "native": "A steed, a strong horse."
    "notes":
      "n1": "In this verse the steed is the Soma juice itself, becoming sovereign of the streams."
      "attested": "Attested: एष रुक्मिभिरीयते वाजी शुभ्रेभिरंशुभिः (eṣa rukmibhirīyate vājī śubhrebhiraṃśubhiḥ), RV 9.15.5. He moves, a vigorous steed adorned with shining golden rays."
  "vsn-2209":
    "native": "A goat."
    "notes":
      "n1": "In this verse the goat is led before the sacrificial steed, as its kin."
      "attested": "Attested: अजः पुरो नीयते नाभिरस्यानु पश्चात्कवयो यन्ति रेभाः (ajaḥ puro nīyate nābhirasyānu paścātkavayo yanti rebhāḥ), RV 1.163.12. A goat is led forward before him, and the sages and singers follow behind."
  "vsn-2210":
    "native": "Herdsmen, keepers of cattle; the plural of herdsman."
    "notes":
      "n1": "The attested plural form is taught here; its stem is {1}, herdsman."
      "attested": "Attested: अग्ने तोकस्य नस्तने तनूनामप्रयुच्छन्दीद्यद्बोधि गोपाः (agne tokasya nastane tanūnāmaprayucchandīdyadbodhi gopāḥ), RV 2.9.2. Agni, be an ever-watchful keeper for our children and our offspring."
    "bases":
      "गोपाः": "herdsmen"
  "vsn-2211":
    "native": "A bull, or a stallion; a male animal in its strength."
    "notes":
      "n1": "Its stem is {1}; the Veda has this word for bull as an n-stem (Whitney §426)."
      "attested": "Attested: इन्द्रमिन्दो वृषा विश (indramindo vṛṣā viśa), RV 9.2.1. Soma, pass into Indra as a bull."
  "vsn-2212":
    "native": "Rich in horses."
    "notes":
      "n1": "Fused in the verse with the next word, {1}, so the line writes the two as one; the card teaches the first part."
      "attested": "Attested: नू नो गोमद्वीरवद्धेहि रत्नमुषो अश्वावत्पुरुभोजो अस्मे (nū no gomadvīravaddhehi ratnamuṣo aśvāvatpurubhojo asme), RV 7.75.8. Now, Dawn, give us wealth with kine, with heroes, and rich in horses."
  "vsn-2213":
    "native": "The two bay horses, the pair of horses in the hymns."
    "notes":
      "n1": "Attested here as {1}, a form of the stem {2} (hari), and the card teaches the attested form."
      "attested": "Attested: हरी इवान्धांसि बप्सता (harī ivāndhāṃsi bapsatā), RV 1.28.7. Best strength-givers, you stretch wide jaws, like two bay horses champing the herbs."
    "bases":
      "हरी": "the two bay horses (of Indra)"
  "vsn-2214":
    "native": "A cow, here a barren cow."
    "notes":
      "n1": "In this list of sacrificial animals it is a barren cow; Griffith's English gives barren cows."
      "attested": "Attested: यस्मिन्नश्वास ऋषभास उक्षणो वशा मेषा अवसृष्टास आहुताः (yasminnaśvāsa ṛṣabhāsa ukṣaṇo vaśā meṣā avasṛṣṭāsa āhutāḥ), RV 10.91.14. Horses, bulls, oxen, barren cows and rams are offered up to Agni."
  "vsn-2215":
    "native": "Lord of cattle; the master of the herds."
    "notes":
      "n1": "In this verse the wish is to be lord of herds of kine, so as to strengthen and enrich the sage."
      "attested": "Attested: यदहं गोपतिः स्याम् (yadahaṃ gopatiḥ syām), RV 8.14.2. If only I were the lord of cattle, to enrich the sage."
