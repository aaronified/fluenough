"tags":
  - "unreviewed"
"cards":
  "vsn-2512":
    "native": "Twenty."
    "notes":
      "n1": "Whitney lists it among the tens, as viṅçatí (§475)."
    "examples":
      "सहस्रं साकमर्चत परि ष्टोभत विंशतिः":
        "native": "Laud him a thousand all at once, shout twenty forth the hymn of praise."
        "bases":
          "विंशतिः": "twenty"
  "vsn-2513":
    "native": "A hundred."
    "notes":
      "n1": "In this line it is written {1}: the corpus writes final -m as anusvara (ṃ)."
    "examples":
      "शतं भवास्यूतिभिः":
        "native": "Protector of us, approach us with a hundred aids."
        "bases":
          "शतं": "hundred"
  "vsn-2514":
    "native": "A thousand."
    "notes":
      "n1": "In this line it is written {1}: the corpus writes final -m as anusvara (ṃ)."
      "n2": "Multiples are made by putting the multiplied number in the plural, as in 'five hundreds' (Whitney §480)."
    "examples":
      "सहस्रं व्यतीनां युक्तानामिन्द्रमीमहे":
        "native": "To Indra we pray for a thousand steeds, well-trained and fleet of foot, and a hundred jars of Soma juice."
        "bases":
          "सहस्रं": "thousand"
  "vsn-2515":
    "native": "Ten thousand."
    "notes":
      "n1": "In this line it is written {1}: the corpus writes final -m as anusvara (ṃ)."
    "examples":
      "आदाय श्येनो अभरत्सोमं सहस्रं सवाँ अयुतं च साकम्":
        "native": "The falcon took the Soma, bearing a thousand libations with him, and ten thousand."
        "bases":
          "अयुतं": "ten thousand"
  "vsn-2516":
    "native": "Sixty."
    "notes":
      "n1": "Whitney lists it among the tens, as ṣaṣṭí (§475)."
    "examples":
      "षष्टिः सहस्रमनु गव्यमागात्सनत्कक्षीवाँ अभिपित्वे अह्नाम्":
        "native": "Kine numbering sixty thousand followed after."
        "bases":
          "षष्टिः": "sixty"
  "vsn-2517":
    "native": "Fifty."
    "notes":
      "n1": "In this line the numeral is fused into one written word with the word after it, {1}; the card teaches the numeral on its own."
    "examples":
      "पञ्चाशत्कृष्णा नि वपः सहस्रात्कं न पुरो जरिमा वि दर्दः":
        "native": "You smote down the swarthy fifty thousand, and rent forts as age consumes a garment."
        "bases":
          "पञ्चाशत्कृष्णा": "fifty swarthy ones"
