"tags":
  - "unreviewed"
"cards":
  "vsn-2512":
    "native": "Twenty."
    "notes":
      "n1": "Whitney lists it among the tens, as विङ्शति (viṅśati) (§475)."
      "attested": "Attested: सहस्रं साकमर्चत परि ष्टोभत विंशतिः (sahasraṃ sākamarcata pari ṣṭobhata viṃśatiḥ), RV 1.80.9. Laud him a thousand all at once, shout twenty forth the hymn of praise."
  "vsn-2513":
    "native": "A hundred."
    "notes":
      "n1": "In this line it is written {1}: the corpus writes final -m as anusvara (ṃ)."
      "attested": "Attested: शतं भवास्यूतिभिः (śataṃ bhavāsyūtibhiḥ), RV 4.31.3. Protector of us, approach us with a hundred aids."
  "vsn-2514":
    "native": "A thousand."
    "notes":
      "n1": "In this line it is written {1}: the corpus writes final -m as anusvara (ṃ)."
      "n2": "Multiples are made by putting the multiplied number in the plural, as in 'five hundreds' (Whitney §480)."
      "attested": "Attested: सहस्रं व्यतीनां युक्तानामिन्द्रमीमहे (sahasraṃ vyatīnāṃ yuktānāmindramīmahe), RV 4.32.17. To Indra we pray for a thousand steeds, well-trained and fleet of foot, and a hundred jars of Soma juice."
  "vsn-2515":
    "native": "Ten thousand."
    "notes":
      "n1": "In this line it is written {1}: the corpus writes final -m as anusvara (ṃ)."
      "attested": "Attested: आदाय श्येनो अभरत्सोमं सहस्रं सवाँ अयुतं च साकम् (ādāya śyeno abharatsomaṃ sahasraṃ savām̐ ayutaṃ ca sākam), RV 4.26.7. The falcon took the Soma, bearing a thousand libations with him, and ten thousand."
  "vsn-2516":
    "native": "Sixty."
    "notes":
      "n1": "Whitney lists it among the tens, as षष्टि (ṣaṣṭi) (§475)."
      "attested": "Attested: षष्टिः सहस्रमनु गव्यमागात्सनत्कक्षीवाँ अभिपित्वे अह्नाम् (ṣaṣṭiḥ sahasramanu gavyamāgātsanatkakṣīvām̐ abhipitve ahnām), RV 1.126.3. Kine numbering sixty thousand followed after."
  "vsn-2517":
    "native": "Fifty."
    "notes":
      "n1": "In this line the numeral is fused into one written word with the word after it, {1}; the card teaches the numeral on its own."
      "attested": "Attested: पञ्चाशत्कृष्णा नि वपः सहस्रात्कं न पुरो जरिमा वि दर्दः (pañcāśatkṛṣṇā ni vapaḥ sahasrātkaṃ na puro jarimā vi dardaḥ), RV 4.16.13. You smote down the swarthy fifty thousand, and rent forts as age consumes a garment."
