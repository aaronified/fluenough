"name": "The tens and big numbers"
"description": "Tens and big numbers from the Rigveda; each gloss is from Griffith's translation of the same verse. Each reading is based on ISO 15919 and the pronunciation is reconstructed. Vedic accent marks are not shown. Not yet checked by a Vedicist: please report any mistake."
