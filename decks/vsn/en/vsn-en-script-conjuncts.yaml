name: "Vedic conjunct letters"
description: "How Devanagari joins consonants that have no vowel between them: side by side, one above the other, abbreviated, or with र (ra) in its special forms; the conjuncts ज्ञ (jña) and क्ष (kṣa) and the Vedic ळ्ह (ḷha). Each note gives the section of Whitney's Sanskrit Grammar it comes from. Not yet checked by a Vedicist: please report any mistake."
license: "CC-BY-SA-4.0"
tags:
- "unreviewed"
cards:
  "vsn-0500":
    "native": "gga, the letters joined"
    "notes":
      "n1": "ग (ga) and ग (ga) joined side by side, the consonant said first written first (Whitney, section 12 a). Only the characteristic part of the second letter is taken, without its framing line (Whitney, section 12)."
  "vsn-0501":
    "native": "jja, the letters joined"
    "notes":
      "n1": "ज (ja) and ज (ja) joined side by side, the consonant said first written first (Whitney, section 12 a). Only the characteristic part of the second letter is taken, without its framing line (Whitney, section 12)."
  "vsn-0502":
    "native": "pya, the letters joined"
    "notes":
      "n1": "प (pa) and य (ya) joined side by side, the consonant said first written first (Whitney, section 12 a). Only the characteristic part of the second letter is taken, without its framing line (Whitney, section 12)."
  "vsn-0503":
    "native": "nma, the letters joined"
    "notes":
      "n1": "न (na) and म (ma) joined side by side, the consonant said first written first (Whitney, section 12 a). Only the characteristic part of the second letter is taken, without its framing line (Whitney, section 12)."
  "vsn-0504":
    "native": "ttha, the letters joined"
    "notes":
      "n1": "त (ta) and थ (tha) joined side by side, the consonant said first written first (Whitney, section 12 a). Only the characteristic part of the second letter is taken, without its framing line (Whitney, section 12). Seen in इत्था (itthā), 'thus'."
  "vsn-0505":
    "native": "bhya, the letters joined"
    "notes":
      "n1": "भ (bha) and य (ya) joined side by side, the consonant said first written first (Whitney, section 12 a). Only the characteristic part of the second letter is taken, without its framing line (Whitney, section 12)."
  "vsn-0506":
    "native": "ska, the letters joined"
    "notes":
      "n1": "स (sa) and क (ka) joined side by side, the consonant said first written first (Whitney, section 12 a). Only the characteristic part of the second letter is taken, without its framing line (Whitney, section 12)."
  "vsn-0507":
    "native": "ṣṇa, the letters joined"
    "notes":
      "n1": "ष (ṣa) and ण (ṇa) joined side by side, the consonant said first written first (Whitney, section 12 a). Only the characteristic part of the second letter is taken, without its framing line (Whitney, section 12). Seen in विष्णुः (viṣṇuḥ), 'Vishnu'."
  "vsn-0508":
    "native": "tka, the letters joined"
    "notes":
      "n1": "त (ta) and क (ka) joined side by side, the consonant said first written first (Whitney, section 12 a). Only the characteristic part of the second letter is taken, without its framing line (Whitney, section 12)."
  "vsn-0509":
    "native": "kka, the letters joined"
    "notes":
      "n1": "क (ka) and क (ka) joined one above the other, the consonant said first on top (Whitney, section 12 b). Only the characteristic part of the lower letter is taken, without its framing line (Whitney, section 12)."
  "vsn-0510":
    "native": "kva, the letters joined"
    "notes":
      "n1": "क (ka) and व (va) joined one above the other, the consonant said first on top (Whitney, section 12 b). Only the characteristic part of the lower letter is taken, without its framing line (Whitney, section 12)."
  "vsn-0511":
    "native": "cca, the letters joined"
    "notes":
      "n1": "च (ca) and च (ca) joined one above the other, the consonant said first on top (Whitney, section 12 b). Only the characteristic part of the lower letter is taken, without its framing line (Whitney, section 12). Seen in उच्चा (uccā), 'on high'."
  "vsn-0512":
    "native": "ñja, the letters joined"
    "notes":
      "n1": "ञ (ña) and ज (ja) joined one above the other, the consonant said first on top (Whitney, section 12 b). Only the characteristic part of the lower letter is taken, without its framing line (Whitney, section 12)."
  "vsn-0513":
    "native": "dda, the letters joined"
    "notes":
      "n1": "द (da) and द (da) joined one above the other, the consonant said first on top (Whitney, section 12 b). Only the characteristic part of the lower letter is taken, without its framing line (Whitney, section 12)."
  "vsn-0514":
    "native": "pta, the letters joined"
    "notes":
      "n1": "प (pa) and त (ta) joined one above the other, the consonant said first on top (Whitney, section 12 b). Only the characteristic part of the lower letter is taken, without its framing line (Whitney, section 12). Seen in सप्त (sapta), 'seven'."
  "vsn-0515":
    "native": "tna, the letters joined"
    "notes":
      "n1": "त (ta) and न (na) joined one above the other, the consonant said first on top (Whitney, section 12 b). Only the characteristic part of the lower letter is taken, without its framing line (Whitney, section 12)."
  "vsn-0516":
    "native": "tva, the letters joined"
    "notes":
      "n1": "त (ta) and व (va) joined one above the other, the consonant said first on top (Whitney, section 12 b). Only the characteristic part of the lower letter is taken, without its framing line (Whitney, section 12). Seen in चत्वारः (catvāraḥ), 'four'."
  "vsn-0517":
    "native": "kta, the letters joined"
    "notes":
      "n1": "The first letter क (ka) is abbreviated in this conjunct (Whitney, section 13 a). Made of क (ka) and त (ta). Seen in नक्तम् (naktam), 'by night'."
  "vsn-0518":
    "native": "kla, the letters joined"
    "notes":
      "n1": "The first letter क (ka) is abbreviated in this conjunct (Whitney, section 13 a). Made of क (ka) and ल (la)."
  "vsn-0519":
    "native": "kṇa, the letters joined"
    "notes":
      "n1": "The first letter क (ka) is abbreviated in this conjunct (Whitney, section 13 a). Made of क (ka) and ण (ṇa)."
  "vsn-0520":
    "native": "tta, the letters joined"
    "notes":
      "n1": "The letter त (ta) is abbreviated in this conjunct (Whitney, section 13 b). Made of त (ta) and त (ta). Seen in अत्ति (atti), 'to eat'."
  "vsn-0521":
    "native": "dga, the letters joined"
    "notes":
      "n1": "The first letter द (da) is abbreviated in this conjunct (Whitney, section 13 c). Made of द (da) and ग (ga)."
  "vsn-0522":
    "native": "dna, the letters joined"
    "notes":
      "n1": "The first letter द (da) is abbreviated in this conjunct (Whitney, section 13 c). Made of द (da) and न (na)."
  "vsn-0523":
    "native": "kya, the letters joined"
    "notes":
      "n1": "म (ma) and य (ya) are abbreviated when they follow another consonant (Whitney, section 13 d). Made of क (ka) and य (ya)."
  "vsn-0524":
    "native": "kma, the letters joined"
    "notes":
      "n1": "म (ma) and य (ya) are abbreviated when they follow another consonant (Whitney, section 13 d). Made of क (ka) and म (ma)."
  "vsn-0525":
    "native": "ṅma, the letters joined"
    "notes":
      "n1": "म (ma) and य (ya) are abbreviated when they follow another consonant (Whitney, section 13 d). Made of ङ (ṅa) and म (ma)."
  "vsn-0526":
    "native": "ṅya, the letters joined"
    "notes":
      "n1": "म (ma) and य (ya) are abbreviated when they follow another consonant (Whitney, section 13 d). Made of ङ (ṅa) and य (ya)."
  "vsn-0527":
    "native": "dma, the letters joined"
    "notes":
      "n1": "म (ma) and य (ya) are abbreviated when they follow another consonant (Whitney, section 13 d). Made of द (da) and म (ma)."
  "vsn-0528":
    "native": "dya, the letters joined"
    "notes":
      "n1": "म (ma) and य (ya) are abbreviated when they follow another consonant (Whitney, section 13 d). Made of द (da) and य (ya). Seen in अद्य (adya), 'today'."
  "vsn-0529":
    "native": "hma, the letters joined"
    "notes":
      "n1": "म (ma) and य (ya) are abbreviated when they follow another consonant (Whitney, section 13 d). Made of ह (ha) and म (ma). Seen in ब्रह्म (brahma), 'prayer'."
  "vsn-0530":
    "native": "hya, the letters joined"
    "notes":
      "n1": "म (ma) and य (ya) are abbreviated when they follow another consonant (Whitney, section 13 d). Made of ह (ha) and य (ya)."
  "vsn-0531":
    "native": "chya, the letters joined"
    "notes":
      "n1": "म (ma) and य (ya) are abbreviated when they follow another consonant (Whitney, section 13 d). Made of छ (cha) and य (ya)."
  "vsn-0532":
    "native": "ḍhya, the letters joined"
    "notes":
      "n1": "म (ma) and य (ya) are abbreviated when they follow another consonant (Whitney, section 13 d). Made of ढ (ḍha) and य (ya)."
  "vsn-0533":
    "native": "śca, the letters joined"
    "notes":
      "n1": "The letter श (śa) takes a changed form before a consonant (Whitney, section 13 e). Made of श (śa) and च (ca)."
  "vsn-0534":
    "native": "śna, the letters joined"
    "notes":
      "n1": "The letter श (śa) takes a changed form before a consonant (Whitney, section 13 e). Made of श (śa) and न (na)."
  "vsn-0535":
    "native": "śva, the letters joined"
    "notes":
      "n1": "The letter श (śa) takes a changed form before a consonant (Whitney, section 13 e). Made of श (śa) and व (va). Seen in विश्वः (viśvaḥ), 'all'."
  "vsn-0536":
    "native": "ṇṇa, the letters joined"
    "notes":
      "n1": "A conjunct of not quite obvious value, to be learned as it stands (Whitney, section 13 f). Made of ण (ṇa) and ण (ṇa)."
  "vsn-0537":
    "native": "lla, the letters joined"
    "notes":
      "n1": "A conjunct of not quite obvious value, to be learned as it stands (Whitney, section 13 f). Made of ल (la) and ल (la)."
  "vsn-0538":
    "native": "ddha, the letters joined"
    "notes":
      "n1": "A conjunct of not quite obvious value, to be learned as it stands (Whitney, section 13 f). Made of द (da) and ध (dha)."
  "vsn-0539":
    "native": "dbha, the letters joined"
    "notes":
      "n1": "A conjunct of not quite obvious value, to be learned as it stands (Whitney, section 13 f). Made of द (da) and भ (bha)."
  "vsn-0540":
    "native": "ṣṭa, the letters joined"
    "notes":
      "n1": "A conjunct of not quite obvious value, to be learned as it stands (Whitney, section 13 f). Made of ष (ṣa) and ट (ṭa). Seen in अष्टौ (aṣṭau), 'eight'."
  "vsn-0541":
    "native": "ṣṭha, the letters joined"
    "notes":
      "n1": "A conjunct of not quite obvious value, to be learned as it stands (Whitney, section 13 f). Made of ष (ṣa) and ठ (ṭha). Seen in तिष्ठति (tiṣṭhati), 'to stand'."
  "vsn-0542":
    "native": "hṇa, the letters joined"
    "notes":
      "n1": "A conjunct of not quite obvious value, to be learned as it stands (Whitney, section 13 f). Made of ह (ha) and ण (ṇa). The conjuncts of ह (ha) are of this kind (Whitney, section 13 f)."
  "vsn-0543":
    "native": "hna, the letters joined"
    "notes":
      "n1": "A conjunct of not quite obvious value, to be learned as it stands (Whitney, section 13 f). Made of ह (ha) and न (na). The conjuncts of ह (ha) are of this kind (Whitney, section 13 f)."
  "vsn-0544":
    "native": "kṣa, the letters joined"
    "notes":
      "n1": "In this conjunct no trace of its letters क (ka) and ष (ṣa) can be recognised (Whitney, section 13 g). Whitney writes it kṣa. Seen in वृक्षः (vṛkṣaḥ), 'tree'."
  "vsn-0545":
    "native": "jña, the letters joined"
    "notes":
      "n1": "In this conjunct no trace of its letters ज (ja) and ञ (ña) can be recognised (Whitney, section 13 g). Whitney writes it jña."
  "vsn-0546":
    "native": "rka, the letters joined"
    "notes":
      "n1": "र (ra) said before the other consonants is written above them, with a hook opening to the right (Whitney, section 14 a). Made of र (ra) and क (ka). Seen in अर्कः (arkaḥ), 'song'."
  "vsn-0547":
    "native": "rṣa, the letters joined"
    "notes":
      "n1": "र (ra) said before the other consonants is written above them, with a hook opening to the right (Whitney, section 14 a). Made of र (ra) and ष (ṣa)."
  "vsn-0548":
    "native": "rtva, the letters joined"
    "notes":
      "n1": "र (ra) said before the other consonants is written above them, with a hook opening to the right (Whitney, section 14 a). Made of र (ra), त (ta) and व (va)."
  "vsn-0549":
    "native": "rmya, the letters joined"
    "notes":
      "n1": "र (ra) said before the other consonants is written above them, with a hook opening to the right (Whitney, section 14 a). Made of र (ra), म (ma) and य (ya)."
  "vsn-0550":
    "native": "pra, the letters joined"
    "notes":
      "n1": "र (ra) said after another consonant is written as a straight stroke below, slanting to the left (Whitney, section 14 c). Made of प (pa) and र (ra)."
  "vsn-0551":
    "native": "dhra, the letters joined"
    "notes":
      "n1": "र (ra) said after another consonant is written as a straight stroke below, slanting to the left (Whitney, section 14 c). Made of ध (dha) and र (ra)."
  "vsn-0552":
    "native": "gra, the letters joined"
    "notes":
      "n1": "र (ra) said after another consonant is written as a straight stroke below, slanting to the left (Whitney, section 14 c). Made of ग (ga) and र (ra)."
  "vsn-0553":
    "native": "sra, the letters joined"
    "notes":
      "n1": "र (ra) said after another consonant is written as a straight stroke below, slanting to the left (Whitney, section 14 c). Made of स (sa) and र (ra)."
  "vsn-0554":
    "native": "tra, the letters joined"
    "notes":
      "n1": "र (ra) said after another consonant is the straight stroke below, slanting to the left, and the first letter is changed as in section 13 (Whitney, section 14 c). Made of त (ta) and र (ra). Seen in अत्र (atra), 'here'."
  "vsn-0555":
    "native": "dra, the letters joined"
    "notes":
      "n1": "र (ra) said after another consonant is the straight stroke below, slanting to the left, and the first letter is changed as in section 13 (Whitney, section 14 c). Made of द (da) and र (ra). Seen in रुद्रः (rudraḥ), 'Rudra'."
  "vsn-0556":
    "native": "śra, the letters joined"
    "notes":
      "n1": "र (ra) said after another consonant is the straight stroke below, slanting to the left, and the first letter is changed as in section 13 (Whitney, section 14 c). Made of श (śa) and र (ra). Seen in श्रेष्ठः (śreṣṭhaḥ), 'best'."
  "vsn-0557":
    "native": "hra, the letters joined"
    "notes":
      "n1": "र (ra) said after another consonant is the straight stroke below, slanting to the left, and the first letter is changed as in section 13 (Whitney, section 14 c). Made of ह (ha) and र (ra)."
  "vsn-0558":
    "native": "ttva, the letters joined"
    "notes":
      "n1": "Three consonants joined by the same rules (Whitney, section 15). Made of त (ta), त (ta) and व (va)."
  "vsn-0559":
    "native": "ddhya, the letters joined"
    "notes":
      "n1": "Three consonants joined by the same rules (Whitney, section 15). Made of द (da), ध (dha) and य (ya)."
  "vsn-0560":
    "native": "dvya, the letters joined"
    "notes":
      "n1": "Three consonants joined by the same rules (Whitney, section 15). Made of द (da), व (va) and य (ya)."
  "vsn-0561":
    "native": "drya, the letters joined"
    "notes":
      "n1": "Three consonants joined by the same rules (Whitney, section 15). Made of द (da), र (ra) and य (ya)."
  "vsn-0562":
    "native": "dhrya, the letters joined"
    "notes":
      "n1": "Three consonants joined by the same rules (Whitney, section 15). Made of ध (dha), र (ra) and य (ya)."
  "vsn-0563":
    "native": "psva, the letters joined"
    "notes":
      "n1": "Three consonants joined by the same rules (Whitney, section 15). Made of प (pa), स (sa) and व (va)."
  "vsn-0564":
    "native": "ścya, the letters joined"
    "notes":
      "n1": "Three consonants joined by the same rules (Whitney, section 15). Made of श (śa), च (ca) and य (ya)."
  "vsn-0565":
    "native": "ṣṭhya, the letters joined"
    "notes":
      "n1": "Three consonants joined by the same rules (Whitney, section 15). Made of ष (ṣa), ठ (ṭha) and य (ya)."
  "vsn-0566":
    "native": "hvya, the letters joined"
    "notes":
      "n1": "Three consonants joined by the same rules (Whitney, section 15). Made of ह (ha), व (va) and य (ya)."
  "vsn-0567":
    "native": "ktrya, the letters joined"
    "notes":
      "n1": "Four consonants joined by the same rules (Whitney, section 15). Made of क (ka), त (ta), र (ra) and य (ya)."
  "vsn-0568":
    "native": "ṅkṣya, the letters joined"
    "notes":
      "n1": "Four consonants joined by the same rules (Whitney, section 15). Made of ङ (ṅa), क (ka), ष (ṣa) and य (ya)."
  "vsn-0569":
    "native": "ṣṭrya, the letters joined"
    "notes":
      "n1": "Four consonants joined by the same rules (Whitney, section 15). Made of ष (ṣa), ट (ṭa), र (ra) and य (ya)."
  "vsn-0570":
    "native": "tsmya, the letters joined"
    "notes":
      "n1": "Four consonants joined by the same rules (Whitney, section 15). Made of त (ta), स (sa), म (ma) and य (ya)."
  "vsn-0571":
    "native": "rtsnya, the letters joined"
    "notes":
      "n1": "Five consonants joined by the same rules (Whitney, section 15). Made of र (ra), त (ta), स (sa), न (na) and य (ya)."
  "vsn-0572":
    "native": "ḷh, the Vedic l with breath"
    "notes":
      "n1": "Two letters, ळ (ḷa) and ह (ha), but one sound: the Vedic l that stands for ढ (ḍha) between two vowels (Whitney, section 54). Example: मीळ्हुषे (mīḷhuṣe) for मीढुषे (mīḍhuṣe) (Whitney, section 54 a)."
      "n2": "Some native phoneticians identify the h with the breath of the sonant aspirates; that ḷ and h stand together for ढ (ḍha) supports the view (Whitney, section 65)."
