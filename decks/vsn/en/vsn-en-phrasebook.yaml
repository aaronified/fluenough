"cards":
  "vsn-0011":
    "native": "Homage."
    "notes":
      "n1": "Namaḥ, homage: the word of worship in the hymns."
  "vsn-0012":
    "native": "Homage to you."
    "notes":
      "n1": "Namas te, homage to you. Written as one word in later Sanskrit; the Vedic form is namas te."
  "vsn-0013":
    "native": "Well-being; hail."
    "notes":
      "n1": "Svasti, well-being, used as a greeting and blessing in the hymns."
  "vsn-0014":
    "native": "May Indra be well for us."
    "notes":
      "n1": "May Indra be well for us: a verse of the hymns, Rigveda 1.89.6."
  "vsn-0015":
    "native": "Who?"
    "notes":
      "n1": "Kaḥ, who? The question word, masculine singular."
  "vsn-0016":
    "native": "What?"
    "notes":
      "n1": "Kim, what? The question word, neuter."
  "vsn-0017":
    "native": "Where?"
    "notes":
      "n1": "Kva, where? The question word for place."
  "vsn-0018":
    "native": "How much?"
    "notes":
      "n1": "Kiyat, how much? The question word for quantity."
  "vsn-0019":
    "native": "There is; it is."
    "notes":
      "n1": "Asti, there is; he is. The third person of to be."
  "vsn-0020":
    "native": "There is not."
    "notes":
      "n1": "Nasti, there is not. The negative of asti."
  "vsn-0021":
    "native": "Listen!"
    "notes":
      "n1": "Śṛṇu, listen! The imperative of śru, to hear."
  "vsn-0022":
    "native": "Come!"
    "notes":
      "n1": "Ehi, come! The imperative of i, to go, with the prefix ā."
  "vsn-0023":
    "native": "Drink (to several)."
    "notes":
      "n1": "Pibata, drink! The plural imperative of pā, to drink."
  "vsn-0024":
    "native": "Do not fear."
    "notes":
      "n1": "Mā bhaiḥ, do not fear. Later Vedic and classical form; the phrase is attested in later texts."
  "vsn-0025":
    "native": "Truth; right order."
    "notes":
      "n1": "Ṛtam, truth and right order: a central word of the hymns."
  "vsn-0026":
    "native": "Sacrifice."
    "notes":
      "n1": "Yajñaḥ, sacrifice: the central rite of the hymns."
  "vsn-0027":
    "native": "Friend."
    "notes":
      "n1": "Mitraḥ, friend; also the god Mitra in the hymns."
  "vsn-0028":
    "native": "Well; rightly."
    "notes":
      "n1": "Suṣṭhu, well, rightly: an adverb of the hymns."
  "vsn-0029":
    "native": "Be pleased."
    "notes":
      "n1": "Prasīda, be pleased; be favourable. The imperative of prasīd, attested in the hymns."
  "vsn-0030":
    "native": "I do not know."
    "notes":
      "n1": "Na jānāmi, I do not know. The words are attested; the phrase is conventional."
