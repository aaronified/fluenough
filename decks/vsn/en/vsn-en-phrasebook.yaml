"name": "Phrasebook: first phrases"
"description": "Twenty things to say from the first day, in the language of the hymns: greetings, questions, asking for help, and saying you do not know. Readings are based on ISO 15919. Several phrases are conventional or later forms, not checked in a text (marked in their notes). Not yet checked by a Vedicist: please report any mistake."
