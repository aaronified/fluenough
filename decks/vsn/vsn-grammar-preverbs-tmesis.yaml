- "id": "vsn-0704"
  "target": "अभि"
  "reading": "abhi"
  "ipa": "əbʱi"
  "pos": "particle"
  "tags":
  - "preverb"
  "notes":
  - "id": "p1"
    "kind": "note"
  - "id": "u1"
    "kind": "usage"
  "bases": "self"
  "examples":
  - "target": "कन्या इव वहतुमेतवा उ अञ्ज्यञ्जाना अभि चाकशीमि"
    "reading": "kanyā iva vahatumetavā u añjyañjānā abhi cākaśīmi"
    "ipa": "kənjaː iʋə ʋəɦət̪umeːt̪əʋaː u əɲdʒjəɲdʒaːnaː əbʱi tʃaːkəʃiːmi"
    "source": "RV 4.58.9, sa.wikisource hymn 4.58; Griffith 4.58"
- "id": "vsn-0705"
  "target": "नि"
  "reading": "ni"
  "ipa": "ni"
  "pos": "particle"
  "tags":
  - "preverb"
  "notes":
  - "id": "p1"
    "kind": "note"
  - "id": "u1"
    "kind": "usage"
  "bases": "self"
  "examples":
  - "target": "नि गव्यवोऽनवो द्रुह्यवश्च षष्टिः शता सुषुपुः षट् सहस्रा"
    "reading": "ni gavyavo'navo druhyavaśca ṣaṣṭiḥ śatā suṣupuḥ ṣaṭ sahasrā"
    "ipa": "ni ɡəʋjəʋoːnəʋoː d̪ruɦjəʋəʃtʃə ʂəʂʈih ʃət̪aː suʂupuh ʂəʈ səɦəsraː"
    "source": "RV 7.18.14, sa.wikisource hymn 7.18; Griffith 7.18"
    "bases":
    - "word": "षट्"
      "base": "षष्"
      "reading": "ṣaṣ"
