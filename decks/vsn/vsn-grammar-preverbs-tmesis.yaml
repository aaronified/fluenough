  "examples":
  - "target": "तद्वामृतं रोदसी प्र ब्रवीमि जायमानो मातरा गर्भो अत्ति"
    "reading": "tadvāmṛtaṃ rodasī pra bravīmi jāyamāno mātarā garbho atti"
    "ipa": "t̪əd̪ʋaːmr̩t̪əm roːd̪əsiː prə brəʋiːmi dʒaːjəmaːnoː maːt̪əraː ɡərbʱoː ət̪t̪i"
    "bases":
    - "word": "रोदसी"
      "base": "रोदसी"
      "reading": "rodasī"
    - "word": "ब्रवीमि"
      "base": "ब्रू"
      "reading": "brū"
