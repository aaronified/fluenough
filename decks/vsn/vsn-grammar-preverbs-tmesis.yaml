  "examples":
  - "target": "कनिक्रददनु पन्थामृतस्य शुक्रो वि भास्यमृतस्य धाम"
    "reading": "kanikradadanu panthāmṛtasya śukro vi bhāsyamṛtasya dhāma"
    "ipa": "kənikrəd̪əd̪ənu pənt̪ʰaːmr̩t̪əsjə ʃukroː ʋi bʱaːsjəmr̩t̪əsjə d̪ʱaːmə"
    "source": "https://sa.wikisource.org/wiki/%E0%A4%8B%E0%A4%97%E0%A5%8D%E0%A4%B5%E0%A5%87%E0%A4%A6%E0%A4%83_%E0%A4%B8%E0%A5%82%E0%A4%95%E0%A5%8D%E0%A4%A4%E0%A4%82_%E0%A5%AF.%E0%A5%AF%E0%A5%AD"
