  "examples":
  - "target": "आ न ऊर्जं वहतमश्विना युवम्"
    "reading": "ā na ūrjaṃ vahatamaśvinā yuvam"
    "ipa": "aː nə uːrdʒəm ʋəɦət̪əməʃʋinaː juʋəm"
    "bases":
    - "word": "ऊर्जं"
      "base": "ऊर्ज्"
      "reading": "ūrj"
  - "target": "आ मातरा भरति शुष्म्या गोर्नृवत्परिज्मन्नोनुवन्त वाताः"
    "reading": "ā mātarā bharati śuṣmyā gornṛvatparijmannonuvanta vātāḥ"
    "ipa": "aː maːt̪əraː bʱərət̪i ʃuʂmjaː ɡoːrnr̩ʋət̪pəridʒmənnoːnuʋənt̪ə ʋaːt̪aːh"
    "bases":
    - "word": "आ"
      "base": "आ"
      "reading": "ā"
    - "word": "मातरा"
      "base": "मातृ"
      "reading": "mātṛ"
    - "word": "भरति"
      "base": "भृ"
      "reading": "bhṛ"
- "id": "vsn-0702"
  "target": "वि"
