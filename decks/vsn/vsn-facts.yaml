description: "One true, surprising thing about Vedic Sanskrit a day, in English, Bengali and Hindi. The Vedic pronunciation is reconstructed, and the Bengali and Hindi texts are not yet checked by a native speaker: please report any mistake."
facts:
  - id: "vsn-fact-001"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Rigveda"
    text:
      en: "ऋग्वेद (ṛgveda), the Rigveda, has 10 books, called mandalas, with 1,028 hymns and about 10,600 verses."
      bn: "Rigveda-তে 10টি বই বা mandala, 1,028টি hymn এবং প্রায় 10,600টি verse আছে।"
      hi: "ऋग्वेद (ṛgveda) में 10 mandala हैं, यानी 10 खंड; इनमें 1,028 hymn और लगभग 10,600 verse हैं।"
  - id: "vsn-fact-002"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Rigveda"
    text:
      en: "The first and tenth books of the Rigveda are the youngest and also the longest, with 191 hymns each."
      bn: "Rigveda-র প্রথম ও দশম বই সবচেয়ে নতুন এবং সবচেয়ে বড়; প্রতিটিতে 191টি hymn আছে।"
      hi: "ऋग्वेद (ṛgveda) की पहली और दसवीं पुस्तक सबसे नई और सबसे लंबी हैं; हर एक में 191 hymn हैं।"
  - id: "vsn-fact-003"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Rigveda"
    text:
      en: "Books 2 to 7, the 'family books', are the oldest part of the Rigveda and make up 38% of its text."
      bn: "2 থেকে 7 নম্বর বই, যাদের 'family books' বলা হয়, Rigveda-র সবচেয়ে পুরনো অংশ; এগুলো মোট লেখার 38% জুড়ে আছে।"
      hi: "दूसरी से सातवीं पुस्तक, जिन्हें 'family books' कहते हैं, ऋग्वेद (ṛgveda) का सबसे पुराना हिस्सा हैं और पूरे पाठ का 38% हैं।"
  - id: "vsn-fact-004"
    tags: ["history"]
    source: "https://en.wikisource.org/wiki/The_Hymns_of_the_Rigveda/Preface"
    text:
      en: "The hymns are grouped by the rishi family that made them, and inside each group they follow the order of the gods. अग्नि (agni) and इन्द्र (indra) are the gods invoked most often."
      bn: "Hymn গুলো যে rishi-পরিবার রচনা করেছে তার ভিত্তিতে সাজানো; প্রতিটি দলের ভেতরে দেবতার ক্রম মেনে চলা হয়। Agni আর Indra সবচেয়ে বেশি আহ্বান করা হয়।"
      hi: "हर वर्ग के भीतर सूक्त (sūkta) देवताओं के क्रम में हैं; अग्नि (agni) और इन्द्र (indra) सबसे ज़्यादा पुकारे जाते हैं।"
  - id: "vsn-fact-005"
    tags: ["history"]
    source: "https://en.wikisource.org/wiki/A_History_of_Sanskrit_Literature/Chapter_4"
    text:
      en: "अग्नि (agni), the god of fire, is praised in more than 200 hymns, next only to इन्द्र (indra)."
      bn: "আগুনের দেবতা Agni 200টিরও বেশি hymn-এ প্রশংসিত; Indra-র পরে তিনিই সবচেয়ে বেশি।"
      hi: "आग के देवता अग्नि (agni) 200 से अधिक hymn में स्तुत हैं, और इन्द्र (indra) के बाद सबसे प्रमुख हैं।"
  - id: "vsn-fact-006"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Rigveda"
    text:
      en: "Philological estimates date the bulk of the Rigveda to the second half of the second millennium BCE, and its composition is usually given as roughly 1500 to 1000 BCE."
      bn: "ভাষাতাত্ত্বিক হিসাবে Rigveda-র বেশির ভাগ দ্বিতীয় সহস্রাব্দের দ্বিতীয়ার্ধে ধরা হয়; সাধারণত রচনাকাল আনুমানিক 1500 থেকে 1000 খ্রিস্টপূর্বাব্দ।"
      hi: "भाषावैज्ञानिक अनुमानों के अनुसार ऋग्वेद (ṛgveda) का अधिकांश भाग दूसरी सहस्राब्दी ईसा पूर्व के उत्तरार्ध का है; आम तौर पर इसका काल लगभग 1500 से 1000 ईसा पूर्व माना जाता है।"
  - id: "vsn-fact-007"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Rigveda"
    text:
      en: "The pada-pāṭha, the Rigveda text with each word set apart, was fixed in the later Brahmana period, in roughly the 6th century BCE."
      bn: "Rigveda-র padapatha, যেখানে প্রতিটি শব্দ আলাদা করে লেখা, আনুমানিক খ্রিস্টপূর্ব ষষ্ঠ শতকে স্থির হয়।"
      hi: "ऋग्वेद (ṛgveda) का padapatha, जिसमें हर शब्द अलग करके लिखा जाता है, लगभग छठी सदी ईसा पूर्व में तय हुआ।"
  - id: "vsn-fact-008"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Vedic_period"
    text:
      en: "The Vedic period lasted from about 1500 to about 500 BCE, and the Vedas themselves were composed from about 1500 to 900 BCE."
      bn: "Vedic period আনুমানিক 1500 থেকে 500 খ্রিস্টপূর্বাব্দ পর্যন্ত চলে; Vedas রচিত হয় প্রায় 1500 থেকে 900 খ্রিস্টপূর্বাব্দের মধ্যে।"
      hi: "Vedic period लगभग 1500 से 500 ईसा पूर्व तक चला, और Vedas लगभग 1500 से 900 ईसा पूर्व के बीच रचे गए।"
  - id: "vsn-fact-009"
    tags: ["texts"]
    source: "https://sa.wikisource.org/wiki/ऋग्वेदः_सूक्तं_१०.१२९"
    text:
      en: "The creation hymn, Rigveda 10.129, has seven verses; the Sanskrit Wikisource header names Prajāpati Parameṣṭhin as its rishi."
      bn: "Creation hymn, Rigveda 10.129, এর সাতটি verse; Sanskrit Wikisource-এর শীর্ষকে Prajapati Parameshthin-কে এর rishi বলা হয়েছে।"
      hi: "Creation hymn, Rigveda 10.129, में सात verse हैं; Sanskrit Wikisource के शीर्षक में इसके ऋषि Prajapati Parameshthin बताए गए हैं।"
  - id: "vsn-fact-010"
    tags: ["texts"]
    source: "https://sa.wikisource.org/wiki/ऋग्वेदः_सूक्तं_१०.९०"
    text:
      en: "The Purusha hymn, Rigveda 10.90, has 16 verses: the sixteenth is in the tristubh metre, the other fifteen in the anushtubh metre."
      bn: "Purusha hymn, 10.90, এ 16টি verse আছে; শেষটি tristubh metre-এ, বাকি পনেরোটি anushtubh-এ।"
      hi: "Purusha hymn (10.90) में 16 verse हैं; आखिरी verse tristubh छंद में है, बाकी पंद्रह anushtubh में।"
  - id: "vsn-fact-011"
    tags: ["texts"]
    source: "https://en.wikisource.org/wiki/The_Hymns_of_the_Rigveda/Book_10/Hymn_121"
    text:
      en: "Rigveda 10.121 has 10 verses, and a refrain, 'What God shall we adore with our oblation?', comes back through the hymn."
      bn: "Rigveda 10.121-এ 10টি verse আছে; একটি refrain, 'What God shall we adore with our oblation?', পুরো hymn জুড়ে ফিরে আসে।"
      hi: "Rigveda 10.121 में 10 verse हैं, और एक refrain, 'What God shall we adore with our oblation?', पूरे सूक्त (sūkta) में लौटता है।"
  - id: "vsn-fact-012"
    tags: ["texts"]
    source: "https://en.wikipedia.org/wiki/Gayatri_Mantra"
    text:
      en: "The गायत्री (gāyatrī) mantra is Rigveda 3.62.10, a verse addressed to the deity Savitr."
      bn: "Gāyatrī mantra হল Rigveda 3.62.10; এটি দেবতা Savitr-এর উদ্দেশে রচিত।"
      hi: "Gāyatrī mantra ऋग्वेद (ṛgveda) 3.62.10 है, जो देवता Savitr को संबोधित है।"
  - id: "vsn-fact-013"
    tags: ["texts"]
    source: "https://sa.wikisource.org/wiki/ऋग्वेदः_सूक्तं_१.१"
    text:
      en: "Rigveda 1.1 has nine verses, is addressed to अग्नि (agni) and is in the गायत्री (gāyatrī) metre."
      bn: "Rigveda 1.1-এ নয়টি verse আছে; এটি Agni-কে উদ্দেশ্য করে এবং Gayatri metre-এ।"
      hi: "Rigveda 1.1 में नौ verse हैं; यह Agni को संबोधित है और gāyatrī छंद में है।"
  - id: "vsn-fact-014"
    tags: ["texts"]
    source: "https://sa.wikisource.org/wiki/ऋग्वेदः_सूक्तं_१.१६४"
    text:
      en: "Rigveda 1.164 has 52 verses."
      bn: "Rigveda 1.164-এ 52টি verse আছে।"
      hi: "Rigveda 1.164 में 52 verse हैं।"
  - id: "vsn-fact-015"
    tags: ["texts", "religion"]
    source: "https://en.wikisource.org/wiki/The_Hymns_of_the_Rigveda/Book_1/Hymn_164"
    text:
      en: "Rigveda 1.164.46 says the wise call the One by many names; Griffith's translation names Indra, Mitra, Varuna and Agni."
      bn: "Rigveda 1.164.46 বলে, জ্ঞানীরা সেই এককে নানা নামে ডাকেন; Griffith-এর অনুবাদে নামগুলো Indra, Mitra, Varuna ও Agni।"
      hi: "ऋग्वेद (ṛgveda) 1.164.46 कहता है कि विद्वान उस एक को अनेक नामों से पुकारते हैं; Griffith के अनुवाद में नाम Indra, Mitra, Varuna और Agni हैं।"
  - id: "vsn-fact-016"
    tags: ["texts"]
    source: "https://sa.wikisource.org/wiki/ऋग्वेदः_सूक्तं_१०.८५"
    text:
      en: "Rigveda 10.85 has 47 verses, and verses 6 to 16 tell of the wedding of Sūryā."
      bn: "Rigveda 10.85-এ 47টি verse; 6 থেকে 16 নম্বর verse-এ Sūryā-র বিয়ের বর্ণনা।"
      hi: "Rigveda 10.85 में 47 verse हैं; 6 से 16 तक के verse में Sūryā के विवाह का वर्णन है।"
  - id: "vsn-fact-017"
    tags: ["texts"]
    source: "https://en.wikisource.org/wiki/The_Hymns_of_the_Rigveda/Book_10/Hymn_34"
    text:
      en: "The gambling hymn, Rigveda 10.34, has 14 verses, in which a gambler laments what the dice have cost him."
      bn: "Gambling hymn, Rigveda 10.34, এর 14টি verse; এতে এক জুয়াড়ি পাশার খেলায় নিজের সর্বনাশের জন্য বিলাপ করে।"
      hi: "जुए वाला hymn, ऋग्वेद (ṛgveda) 10.34, में 14 verse हैं; इसमें एक जुआरी पासों से हुए अपने नुकसान पर विलाप करता है।"
  - id: "vsn-fact-018"
    tags: ["texts"]
    source: "https://sa.wikisource.org/wiki/ऋग्वेदः_सूक्तं_१०.९५"
    text:
      en: "The dialogue of Pururavas and Urvashi, Rigveda 10.95, has 18 verses."
      bn: "Pururavas ও Urvashi-র কথোপকথন, Rigveda 10.95, 18টি verse।"
      hi: "Pururavas और Urvashi का संवाद, Rigveda 10.95, में 18 verse हैं।"
  - id: "vsn-fact-019"
    tags: ["texts"]
    source: "https://en.wikisource.org/wiki/The_Hymns_of_the_Rigveda/Book_7/Hymn_103"
    text:
      en: "Rigveda 7.103, the frog hymn, has 10 verses, and its frogs 'lift up their voice'."
      bn: "Rigveda 7.103, 'frog hymn', এ 10টি verse; সেখানে ব্যাঙেরা গলা তোলে।"
      hi: "Rigveda 7.103, 'frog hymn', में 10 verse हैं; इसमें मेंढक अपनी आवाज़ उठाते हैं।"
  - id: "vsn-fact-020"
    tags: ["texts"]
    source: "https://sa.wikisource.org/wiki/ऋग्वेदः_सूक्तं_५.८३"
    text:
      en: "Rigveda 5.83, addressed to Parjanya, the god of rain, has 10 verses; its header names Bhauma Atri as the rishi."
      bn: "Rigveda 5.83, Parjanya-র উদ্দেশে, 10টি verse; header-এ rishi হিসেবে Bhauma Atri-র নাম।"
      hi: "Rigveda 5.83, वर्षा के देवता Parjanya को संबोधित, में 10 verse हैं; शीर्षक में ऋषि Bhauma Atri बताए गए हैं।"
  - id: "vsn-fact-021"
    tags: ["texts"]
    source: "https://sa.wikisource.org/wiki/ऋग्वेदः_सूक्तं_१०.१८"
    text:
      en: "The funeral hymn, Rigveda 10.18, has 14 verses; its header marks verses 7 to 14 as a funeral rite (pitṛmedha)."
      bn: "Funeral hymn, Rigveda 10.18, এর 14টি verse; header অনুসারে 7 থেকে 14 নম্বর verse একটি অন্ত্যেষ্টি-রীতির।"
      hi: "Funeral hymn, Rigveda 10.18, में 14 verse हैं; शीर्षक के अनुसार 7 से 14 तक के verse अंत्येष्टि (pitṛmedha) के हैं।"
  - id: "vsn-fact-022"
    tags: ["texts"]
    source: "https://en.wikisource.org/wiki/The_Hymns_of_the_Rigveda/Book_3/Hymn_33"
    text:
      en: "The first verse of Rigveda 3.33 names two rivers, Vipas and Sutudri, which speed down like two cows licking their young."
      bn: "Rigveda 3.33-এর প্রথম verse-এ দুটি নদীর নাম: Vipas ও Sutudri; তারা যেন দুটি গরু, যারা বাছুর চাটছে।"
      hi: "Rigveda 3.33 के पहले verse में दो नदियों Vipas और Sutudri का नाम है, जो दो गायों की तरह बहती हैं जो अपने बछड़े को चाटती हैं।"
  - id: "vsn-fact-023"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Samaveda"
    text:
      en: "The सामवेद (sāmaveda) has 1,875 verses, and all but 75 of them come from the Rigveda."
      bn: "Samaveda-য় 1,875টি verse আছে; তার মধ্যে 75টি বাদে বাকি সবই Rigveda থেকে।"
      hi: "Samaveda में 1,875 verse हैं, जिनमें 75 के अलावा सब Rigveda से लिए गए हैं।"
  - id: "vsn-fact-024"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Atharvaveda"
    text:
      en: "The अथर्ववेद (atharvaveda) has 730 hymns, about 6,000 mantras, in 20 books."
      bn: "Atharvaveda-য় 730টি hymn, প্রায় 6,000টি mantra, এবং 20টি বই।"
      hi: "Atharvaveda में 730 hymn, लगभग 6,000 mantra, और 20 पुस्तकें हैं।"
  - id: "vsn-fact-025"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Yajurveda"
    text:
      en: "Michael Witzel estimates that the यजुर्वेद (yajurveda) was composed between 1200 and 800 BCE; its exact century is not known."
      bn: "Michael Witzel-এর হিসাবে Yajurveda রচিত হয় আনুমানিক 1200 থেকে 800 খ্রিস্টপূর্বাব্দের মধ্যে; ঠিক শতক জানা নেই।"
      hi: "Michael Witzel के अनुमान के अनुसार Yajurveda 1200 से 800 ईसा पूर्व के बीच रचा गया; ठीक सदी ज्ञात नहीं है।"
  - id: "vsn-fact-026"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Sayana"
    text:
      en: "Sāyaṇa, a 14th-century scholar from the Vijayanagara Empire, died in 1387."
      bn: "Sāyaṇa, Vijayanagara সাম্রাজ্যের 14 শতকের পণ্ডিত, 1387 সালে মারা যান।"
      hi: "Sāyaṇa, विजयनगर साम्राज्य के 14वीं सदी के विद्वान, 1387 में चल बसे।"
  - id: "vsn-fact-027"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Max_M%C3%BCller"
    text:
      en: "Friedrich Max Müller edited the Rigveda with Sāyaṇa's commentary in six volumes, published between 1849 and 1873."
      bn: "Friedrich Max Müller Rigveda ও Sāyaṇa-র ভাষ্য ছয় খণ্ডে সম্পাদনা করেন; প্রকাশ 1849 থেকে 1873 সালের মধ্যে।"
      hi: "Friedrich Max Müller ने Sāyaṇa की टीका के साथ ऋग्वेद (ṛgveda) का संपादन छह खंडों में किया, जो 1849 से 1873 के बीच छपे।"
  - id: "vsn-fact-028"
    tags: ["history"]
    source: "https://en.wikisource.org/wiki/Dictionary_of_National_Biography,_1912_supplement/Griffith,_Ralph_Thomas_Hotchkin"
    text:
      en: "Ralph T. H. Griffith's verse translation of the Rigveda was printed at Benares in 1889 to 1892, and a second edition followed in 1896 to 1897."
      bn: "Ralph T. H. Griffith-এর Rigveda-র পদ্যানুবাদ বারাণসীতে 1889 থেকে 1892 সালে ছাপা হয়; দ্বিতীয় সংস্করণ 1896 থেকে 1897।"
      hi: "Ralph T. H. Griffith का ऋग्वेद (ṛgveda) का पद्यानुवाद 1889 से 1892 के बीच बनारस में छपा; दूसरा संस्करण 1896–1897 में आया।"
  - id: "vsn-fact-029"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Atri"
    text:
      en: "The fifth book of the Rigveda is called the Atri Mandala, after the rishi Atri."
      bn: "Rigveda-র পঞ্চম বই-কে ঋষি Atri-র নামে Atri Mandala বলা হয়।"
      hi: "ऋग्वेद (ṛgveda) की पाँचवीं पुस्तक को ऋषि Atri के नाम पर Atri Mandala कहते हैं।"
  - id: "vsn-fact-030"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Vasishtha"
    text:
      en: "Vasishtha is the chief author of the seventh book of the Rigveda; Vishvamitra wrote most of the third, and Vamadeva is credited with the fourth."
      bn: "Vasishtha সপ্তম বই-এর প্রধান রচয়িতা; Vishvamitra তৃতীয় বইয়ের বেশির ভাগ, আর Vamadeva চতুর্থ বইয়ের রচয়িতা বলে গণ্য।"
      hi: "Vasishtha सातवीं पुस्तक के मुख्य रचयिता हैं; Vishvamitra ने तीसरी पुस्तक का अधिकांश लिखा, और Vamadeva को चौथी पुस्तक का श्रेय है।"
  - id: "vsn-fact-031"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Gritsamada"
    text:
      en: "Most of the second book of the Rigveda is attributed to the seer Gṛtsamada."
      bn: "Rigveda-র দ্বিতীয় বইয়ের বেশির ভাগ seer Gṛtsamada-র রচনা বলে ধরা হয়।"
      hi: "ऋग्वेद (ṛgveda) की दूसरी पुस्तक का अधिकांश भाग ऋषि Gṛtsamada को श्रेय है।"
  - id: "vsn-fact-032"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Dirghatamas"
    text:
      en: "Dīrghatamas is the author of hymns 140 to 164 of the first book of the Rigveda."
      bn: "Rigveda-র প্রথম বইয়ের 140 থেকে 164 নম্বর hymn-এর রচয়িতা Dīrghatamas।"
      hi: "ऋग्वेद (ṛgveda) की पहली पुस्तक के 140 से 164 तक के सूक्त (sūkta) के रचयिता Dīrghatamas हैं।"
  - id: "vsn-fact-033"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Agastya"
    text:
      en: "Agastya and his wife Lopāmudrā are the authors of Rigveda 1.165 to 1.191."
      bn: "Agastya ও তাঁর স্ত্রী Lopamudra Rigveda 1.165 থেকে 1.191-এর রচয়িতা।"
      hi: "Agastya और उनकी पत्नी Lopāmudrā Rigveda 1.165 से 1.191 के रचयिता हैं।"
  - id: "vsn-fact-034"
    tags: ["sounds", "accent"]
    source: "https://en.wikipedia.org/wiki/Vedic_accent"
    text:
      en: "Vedic pitch accent has three qualities: उदात्त (udātta), raised; अनुदात्त (anudātta), not raised; and स्वरित (svarita)."
      bn: "Vedic pitch accent-এর তিনটি রূপ: udātta (raised), anudātta (not raised) ও svarita।"
      hi: "Vedic pitch accent के तीन प्रकार हैं: udātta (raised), anudātta (not raised) और svarita।"
  - id: "vsn-fact-035"
    tags: ["sounds", "accent"]
    source: "https://en.wikisource.org/wiki/Sanskrit_Grammar_(Whitney)/Chapter_II"
    text:
      en: "In older Vedic manuscripts, the grave before an acute has a short horizontal stroke below it, and the circumflex has a short upright stroke above."
      bn: "পুরনো Vedic পাণ্ডুলিপিতে acute-এর আগের grave-এর নিচে একটি ছোট আনুভূমিক দাগ, আর circumflex-এর উপরে একটি ছোট উল্লম্ব দাগ থাকে।"
      hi: "पुरानी Vedic पांडुलिपियों में acute से पहले के grave स्वर के नीचे एक छोटी क्षैतिज रेखा होती है, और circumflex के ऊपर एक छोटी खड़ी रेखा।"
  - id: "vsn-fact-036"
    tags: ["accent", "script"]
    source: "https://sa.wikisource.org/wiki/ऋग्वेदः_सूक्तं_१०.१२९"
    text:
      en: "The Sanskrit Wikisource page for Rigveda 10.129 marks accent with two combining signs about 330 times in its commentary, while the verses on that page have none."
      bn: "Sanskrit Wikisource-এর 10.129 পাতার ভাষ্যে দুটি combining চিহ্নে স্বর প্রায় 330 বার চিহ্নিত; মূল verse-গুলোতে নেই।"
      hi: "Sanskrit Wikisource पर 10.129 के भाष्य में दो combining चिह्नों से स्वर लगभग 330 बार अंकित हैं; उसी पृष्ठ के मूल verse में ये नहीं हैं।"
  - id: "vsn-fact-037"
    tags: ["grammar"]
    source: "https://en.wikisource.org/wiki/Sanskrit_Grammar_(Whitney)/Chapter_VIII"
    text:
      en: "In the Rigveda the subjunctive mood is three or four times as common as the optative."
      bn: "Rigveda-য় subjunctive, optative-এর তিন-চার গুণ বেশি ব্যবহৃত।"
      hi: "Rigveda में subjunctive, optative से तीन-चार गुना अधिक आम है।"
  - id: "vsn-fact-038"
    tags: ["grammar"]
    source: "https://en.wikisource.org/wiki/Sanskrit_Grammar_(Whitney)/Chapter_VIII"
    text:
      en: "Past forms without the augment are common in the Rigveda, and after the prohibitive mā they forbid an action."
      bn: "Rigveda-য় augment ছাড়া অতীত রূপ খুব সাধারণ; mā-র পরে সেগুলো নিষেধ বোঝায়।"
      hi: "Rigveda में augment के बिना अतीत रूप बहुत आम हैं; mā के बाद वे निषेध बताते हैं।"
  - id: "vsn-fact-039"
    tags: ["grammar"]
    source: "https://en.wikisource.org/wiki/Sanskrit_Grammar_(Whitney)/Chapter_XIII"
    text:
      en: "The later language has one infinitive, ending in -tum; the Veda also has infinitives in -dhyai."
      bn: "পরের ভাষায় infinitive মাত্র একটি, -tum; Veda-য় -dhyai-তেও infinitive আছে।"
      hi: "बाद की भाषा में infinitive केवल एक है, -tum; Veda में -dhyai वाले infinitive भी हैं।"
  - id: "vsn-fact-040"
    tags: ["grammar"]
    source: "https://en.wikisource.org/wiki/Sanskrit_Grammar_(Whitney)/Chapter_XV"
    text:
      en: "In the earlier language, especially the Veda, a preverb can be separated from its verb by other words, and can even come after it."
      bn: "পুরনো ভাষায়, বিশেষ করে Veda-য়, preverb ক্রিয়া থেকে আলাদা থাকতে পারে, এমনকি ক্রিয়ার পরেও আসতে পারে।"
      hi: "पुरानी भाषा में, खासकर Veda में, preverb क्रिया से दूर हो सकता है, और क्रिया के बाद भी आ सकता है।"
  - id: "vsn-fact-041"
    tags: ["grammar"]
    source: "https://en.wikisource.org/wiki/Sanskrit_Grammar_(Whitney)/Chapter_XV"
    text:
      en: "In the older language the commonest preverbs, counted by the roots they join in the Rigveda and Atharvaveda, are pra, ā, vi and sam."
      bn: "পুরনো ভাষায় সবচেয়ে বেশি ব্যবহৃত preverb: pra, ā, vi, sam।"
      hi: "पुरानी भाषा में सबसे ज़्यादा प्रयुक्त preverb हैं: pra, ā, vi, sam।"
  - id: "vsn-fact-042"
    tags: ["nouns"]
    source: "https://en.wikisource.org/wiki/Sanskrit_Grammar_(Whitney)/Chapter_V"
    text:
      en: "The Rigveda's instrumental plural often ends in -ebhis, nearly as often as -āis, the only ending of the later language."
      bn: "Rigveda-র instrumental plural প্রায়ই -ebhis-এ শেষ হয়, প্রায় -āis-এর সমান হারে; পরের ভাষায় শুধু -āis।"
      hi: "Rigveda में instrumental plural अक्सर -ebhis में खत्म होता है, लगभग -āis जितना ही; बाद की भाषा में केवल -āis।"
  - id: "vsn-fact-043"
    tags: ["sounds"]
    source: "https://en.wikisource.org/wiki/Sanskrit_Grammar_(Whitney)/Chapter_II"
    text:
      en: "Some Vedic texts have a special l-sound, ḷ, that replaces ḍ between two vowels."
      bn: "কিছু Vedic রচনায় একটি বিশেষ l-ধ্বনি, ḷ, দুই স্বরের মাঝে ḍ-এর জায়গায় বসে।"
      hi: "कुछ Vedic ग्रंथों में एक विशेष l-ध्वनि, ḷ, दो स्वरों के बीच ḍ की जगह आती है।"
  - id: "vsn-fact-044"
    tags: ["history", "religion"]
    source: "https://en.wikisource.org/wiki/Page:Vedic_Mythology.djvu/30"
    text:
      en: "Two gods tower above the rest in the Rigveda and are about equal in power: इन्द्र (indra), the mighty warrior, and वरुण (varuṇa), the supreme moral ruler."
      bn: "Rigveda-য় দুই দেবতা প্রায় সমান ক্ষমতায় শীর্ষে: Indra যোদ্ধা, আর Varuna নৈতিক শাসক।"
      hi: "ऋग्वेद (ṛgveda) में दो देवता लगभग बराबर शक्ति के साथ सबसे ऊपर हैं: Indra योद्धा के रूप में और Varuna परम नैतिक शासक के रूप में।"
  - id: "vsn-fact-045"
    tags: ["history", "religion"]
    source: "https://en.wikisource.org/wiki/A_History_of_Sanskrit_Literature/Chapter_4"
    text:
      en: "उषस् (uṣas), the dawn, is the bright sister of dark Night, and is almost the only goddess to whom whole hymns are addressed."
      bn: "Ushas, ভোর, অন্ধকার Night-এর উজ্জ্বল বোন; প্রায় একমাত্র দেবী যাঁর উদ্দেশে পূর্ণ hymn রচিত।"
      hi: "Ushas, भोर, अँधेरी Night की उज्ज्वल बहन है; लगभग अकेली देवी है जिनके लिए पूरे सूक्त (sūkta) रचे गए।"
