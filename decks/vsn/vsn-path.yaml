# The order Vedic Sanskrit is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner from
# English is taught vsn-en-<name> for vsn-<name> (ADR-0013, ADR-0036).
#
# This is also Vedic Sanskrit's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"): every
# unit from the first words to B1, with its size in words, its grammar
# topics, the three milestones, and for each planned unit its listening
# and reading passages. The file was first written by tools/gen_planned_paths.py
# and has been edited by hand since 2026-11-16 (wiki/Plan-Vedic-Path.md): the
# generator's themes of modern life are replaced by reading themes, and a unit
# is taken over by hand once its deck is written.
#
# Written now: the whole of A1, units 1 to 33 (the phrasebook and the first
# words, the sound differences, the script decks, 23 word units and the grammar
# units for the case system, a-stems, the present system, and preverbs and
# tmesis). The units after the A1 mark are still the generator's planned
# units, so the course teaches each as "Coming" until its deck is written; the
# plan's A2 and B1 outline (section 4 of the plan page) is not applied to them
# yet. The passages of a planned unit are placeholders: each describes its
# unit's theme or grammar and is reworded when the passage is written.
#
# A word unit's size is what its deck holds. The two grammar units that are
# vocab decks carry their cards as words (vsn-sound-differences: 22 cards that
# refer to words of other decks; vsn-grammar-preverbs-tmesis: 19 preverbs), so
# A1 holds 341 words, not the plan's 300; the plan's 300 are the 23 word units
# and unit 1. A rules deck's topics are its rules (vsn-rule-<topic>).
#
# Genre decks (vsn-culture-1 to 4, vsn-multiword-*) are on no path: they are
# found by section or by search, as the validator has it.
#
# A reading course (owner, 2026-10-31): Vedic Sanskrit has no living speakers, so
# the milestones A1, A2 and B1 mean three reading levels, and the sizes
# are `levels` (300, 400 and 600 words, a judgement,
# low confidence) in place of the plan's 700, 900 and 1,200. Themes of
# modern life are left out.
#
# `alphabet` lists the four script decks, all written. The script is taught in
# the units 7 to 10, after the first six units, as the scheme has it.
schema: 1
kind: "path"
id: "vsn-path"
language: "vsn"
description: "Vedic Sanskrit: the path to B1, a reading course. All of A1 is written (units 1 to 33: the phrasebook and first words, the sound and script decks, 23 word units and the grammar units for the case system, a-stems, the present system, and preverbs and tmesis); the units after it are planned."
genders: ["m", "f", "n"]
levels: { A1: 300, A2: 400, B1: 600 }
alphabet:
  - "vsn-script-letters"
  - "vsn-script-conjuncts"
  - "vsn-script-accent-marks"
  - "vsn-script-reading"
units:
