    "reading": "putraḥ kaṇvasya vāmṛṣirgīrbhirvatso avīvṛdhat"
    "ipa": "put̪rəh kəɳʋəsjə ʋaːmr̩ʂirɡiːrbʱirʋət̪soː əʋiːʋr̩d̪ʱət̪"
