schema: 1
kind: "phonetics"
id: "ru-phonetics"
language: "ru"
variety: "Standard Russian (Moscow norm), as the course's broad ipa writes it (tools/transcribe.py russian_ipa(): stress marked, ʲ for soft consonants, ɐ ə ɪ ʊ for unstressed vowels, tɕ ts as letter pairs), not a regional accent"
description: "Rules that turn a card's broad ipa into its narrow [ ] form, in order. Written for tools/derive_phonetic.py, never read by the app. Each rule applies the regular expression to the whole ipa string and replaces every match; the next rule works on the result. Only attested standard Russian allophony is here: the allophones of stressed a i o u between or after soft consonants (æ, i̝, ɵ, ʉ, and ʉ̞ for unstressed ʊ), a retracted before a hard l, the dental t d n s z and affricate ts, the postalveolar hard r and dental soft rʲ, and the velarised hard ɫ. Already in the broad ipa, so not repeated: palatalisation ʲ, the retracted ʂ and ʐ, final devoicing and voicing assimilation within a word, vowel reduction (ɐ ə ɪ ʊ), ɨ after a hard consonant, long consonants and the glide j. Left out, on purpose, because the sources read give no clear rule for the course's broad forms: velarisation or labialisation of hard consonants (a tendency, disputed), the affrication of soft tʲ dʲ (written in the source as a laminal alveolar affricate, not a symbol the broad layer can use), the retraction of e to ɛ̠ (the source's wording does not say which neighbour causes it), the near-close ɨ̞ after a hard consonant (needs the stress, which the rules do not see), the voiced allophones of tɕ ts x before a voiced obstruent (no word of the course has them inside one word, and the broad ipa writes no voicing across a word boundary), the dropping of j between vowels and the ʝ before a stressed vowel (optional or emphatic; the sources themselves write the glide as j), and the weak labialisation of ʂ ʐ. The broad ipa is russian_ipa() of tools/transcribe.py: ɡ not g, a stress mark before the stressed syllable, tɕ and ts as letter pairs, ʂ ʐ for ш ж, ɕː for щ. Sources are Wikipedia, Russian phonology and Wiktionary, Appendix:Russian pronunciation, both read 2026-11-28; the narrow forms follow Wikipedia's description of Standard Russian, with the course's broad ɐ kept (Wikipedia writes ʌ). Not verified by a Russian phonetician, so the rules ship unreviewed."
rules:
- id: "ru-a-front-between-soft"
  pattern: "(?:(?<=ʲ)|(?<=tɕ)|(?<=ɕː))a(?=(?:[bpvfɡkdtzsmnlrxʂʐj]ʲ|tɕ|ɕː))"
  replace: "æ"
  source: "Wikipedia, \"Russian phonology\", read 2026-11-28 (CC BY-SA 4.0), Vowels, Back vowels: \"Between soft consonants, /a/ becomes æ\", пять [pʲætʲ]; en.wiktionary.org, \"Appendix:Russian pronunciation\", read 2026-11-28 (CC BY-SA 4.0), vowels table: stressed я is [ʲæ] when a palatalised consonant follows, [ʲa] otherwise. Soft here means a consonant with ʲ, or tɕ or ɕː (always soft); the glide j is not counted. Only the stressed a is left as a in the broad ipa, since unstressed а and я are already ɐ ə ɪ there."
- id: "ru-a-back-before-hard-l"
  pattern: "(?<!ʲ)(?<!tɕ)(?<!ɕː)(?<!j)a(?=l(?!ʲ))"
  replace: "ɑ̟"
  source: "Wikipedia, \"Russian phonology\", read 2026-11-28 (CC BY-SA 4.0), Vowels, Back vowels: \"When not following a soft consonant, /a/ is retracted to ɑ̟ before /ɫ/\", палка [ˈpɑ̟ɫkə]. Runs before the hard-l rule below, while the l is still plain."
- id: "ru-i-raised-between-soft"
  pattern: "(?:(?<=ʲ)|(?<=tɕ)|(?<=ɕː))i(?=(?:[bpvfɡkdtzsmnlrxʂʐj]ʲ|tɕ|ɕː))"
  replace: "i̝"
  source: "Wikipedia, \"Russian phonology\", read 2026-11-28 (CC BY-SA 4.0), Vowels, Front vowels: \"Between soft consonants, stressed /i/ is raised\", пить [pʲi̝tʲ]. Only a stressed i is written i in the broad ipa (unstressed и is ɪ, and ɨ after a hard consonant)."
- id: "ru-o-centralised-after-soft"
  pattern: "(?:(?<=ʲ)|(?<=tɕ)|(?<=ɕː))o"
  replace: "ɵ"
  source: "Wikipedia, \"Russian phonology\", read 2026-11-28 (CC BY-SA 4.0), Vowels, Back vowels: \"Following a soft consonant, /o/ is centralized and raised to ɵ\", тётя [ˈtʲɵtʲə], щётка [ˈɕːɵtkə]; en.wiktionary.org, \"Appendix:Russian pronunciation\", read 2026-11-28 (CC BY-SA 4.0), vowels table: stressed ё is [ʲɵ]. Not after j (ёж is [ˈjoʂ]) and not after a hard consonant."
- id: "ru-u-centralised-between-soft"
  pattern: "(?:(?<=ʲ)|(?<=tɕ)|(?<=ɕː))u(?=(?:[bpvfɡkdtzsmnlrxʂʐj]ʲ|tɕ|ɕː))"
  replace: "ʉ"
  source: "Wikipedia, \"Russian phonology\", read 2026-11-28 (CC BY-SA 4.0), Vowels, Back vowels: \"/u/ is centralized to ʉ between soft consonants\", чуть [tɕʉtʲ]; en.wiktionary.org, \"Appendix:Russian pronunciation\", read 2026-11-28 (CC BY-SA 4.0), vowels table: stressed ю is [ʲʉ] when a palatalised consonant follows."
- id: "ru-near-close-u-between-soft"
  pattern: "(?:(?<=ʲ)|(?<=tɕ)|(?<=ɕː))ʊ(?=(?:[bpvfɡkdtzsmnlrxʂʐj]ʲ|tɕ|ɕː))"
  replace: "ʉ̞"
  source: "Wikipedia, \"Russian phonology\", read 2026-11-28 (CC BY-SA 4.0), Vowels, Back vowels: \"When unstressed, /u/ becomes near-close; central ʉ̞ between soft consonants, centralized back ʊ in other positions\"."
- id: "ru-r-soft-dental"
  pattern: "rʲ"
  replace: "r̪ʲ"
  source: "Wikipedia, \"Russian phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: \"Soft /rʲ/ is an apical dental trill [r̪ʲ], usually with only a single contact.\""
- id: "ru-r-hard-postalveolar"
  pattern: "r(?![ʲ̪̠])"
  replace: "r̠"
  source: "Wikipedia, \"Russian phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: \"Hard /r/ is postalveolar, typically a trill [r̠].\""
- id: "ru-ts-dental"
  pattern: "ts"
  replace: "t̪s̪"
  source: "Wikipedia, \"Russian phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: \"/ts, s, sʲ, z, zʲ/ are dental [t̪s̪, s̪, s̪ʲ, z̪, z̪ʲ]\", that is dentalised laminal alveolar. Runs before the s rule, which then skips this s."
- id: "ru-s-dental"
  pattern: "s(?!̪)"
  replace: "s̪"
  source: "Wikipedia, \"Russian phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: \"/ts, s, sʲ, z, zʲ/ are dental [t̪s̪, s̪, s̪ʲ, z̪, z̪ʲ]\"; soft sʲ is s̪ʲ."
- id: "ru-z-dental"
  pattern: "z(?!̪)"
  replace: "z̪"
  source: "Wikipedia, \"Russian phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: \"/ts, s, sʲ, z, zʲ/ are dental [t̪s̪, s̪, s̪ʲ, z̪, z̪ʲ]\"; soft zʲ is z̪ʲ."
- id: "ru-t-hard-dental"
  pattern: "t(?![ʲɕ̪])"
  replace: "t̪"
  source: "Wikipedia, \"Russian phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: \"Hard /t, d, n/ are laminal denti-alveolar [t̪, d̪, n̪]\". Soft tʲ is not changed (the source gives it as a laminal alveolar affricate [t̻͡s̻ʲ], not written here), and tɕ is left alone."
- id: "ru-d-hard-dental"
  pattern: "d(?!ʲ)"
  replace: "d̪"
  source: "Wikipedia, \"Russian phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: \"Hard /t, d, n/ are laminal denti-alveolar [t̪, d̪, n̪]\". Soft dʲ is not changed."
- id: "ru-n-hard-dental"
  pattern: "n(?!ʲ)"
  replace: "n̪"
  source: "Wikipedia, \"Russian phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: \"Hard /t, d, n/ are laminal denti-alveolar [t̪, d̪, n̪]; unlike in many other languages, /n/ does not become velar ŋ before velar consonants\", so no ŋ rule is written. Soft nʲ is not changed."
- id: "ru-l-hard-velarised"
  pattern: "l(?!ʲ)"
  replace: "ɫ"
  source: "Wikipedia, \"Russian phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: hard /ɫ/ is \"velarized laminal denti-alveolar [l̪ˠ]\" or pharyngealized, written ɫ throughout the article (облако [ˈobɫəkə], палка [ˈpɑ̟ɫkə]); en.wiktionary.org, \"Appendix:Russian pronunciation\", read 2026-11-28 (CC BY-SA 4.0), Palatalisation: hard л is the hard member of the pair lʲ. Soft lʲ is not changed."
