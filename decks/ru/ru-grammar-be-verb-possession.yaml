# Unit 29 grammar, the possession frame. Sources read: en.wikipedia.org 'Russian grammar' (the personal pronouns' genitive меня́, тебя́, его́, её, нас, вас, их; the н- before a third-person pronoun after a preposition, у него; the present of быть is есть; the genitive of nouns in -а is -ы or -и) and the en.wiktionary.org entry нет (there is no, with the genitive). The genitive of книга is the only genitive noun in these tables.
