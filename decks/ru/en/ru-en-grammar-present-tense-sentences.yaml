native: { code: "en", iso639_3: "eng", name: "English" }
name: "The present tense in sentences"
license: "CC-BY-SA-4.0"
description: "14 short sentences in the present tense, written from the table. Not yet checked by a Russian speaker: please report any mistake."
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "ru-4050":
    native: "I know."
    notes:
      "n1": "знаю (znayu) is the я (ya) form of знать (znat'), first conjugation: the ending is ю (yu)."
  "ru-4051":
    native: "You know."
    notes:
      "n1": "знаешь (znayesh') is the ты (ty) form of знать (znat'): the ending is ешь (yesh')."
    bases:
      "Ты": "you (one person)"
  "ru-4052":
    native: "He understands."
    notes:
      "n1": "понимает (ponimayet) is the он (on) form of понимать (ponimat'): the ending is ет (yet)."
    bases:
      "Он": "he; it"
  "ru-4053":
    native: "We work."
    notes:
      "n1": "работаем (rabotayem) is the мы (my) form of работать (rabotat'): the ending is ем (yem)."
    bases:
      "Мы": "we"
  "ru-4054":
    native: "You read."
    notes:
      "n1": "читаете (chitayete) is the вы (vy) form of читать (chitat'): the ending is ете (yete)."
  "ru-4055":
    native: "They speak."
    notes:
      "n1": "говорят (govoryat) is the они (oni) form of говорить (govorit'), second conjugation: the ending is ят (yat), and the stress is on it."
    bases:
      "Они": "they"
  "ru-4056":
    native: "I like tea."
    notes:
      "n1": "люблю (lyublyu) is the я (ya) form of любить (lyubit'): the verb adds an л (l) to its stem in this form."
  "ru-4057":
    native: "We like bread."
    notes:
      "n1": "любим (lyubim) is the мы (my) form of любить (lyubit'), second conjugation: the ending is им (im)."
    bases:
      "Мы": "we"
  "ru-4058":
    native: "I want tea."
    notes:
      "n1": "хочу (khochu) is the я (ya) form of хотеть (khotet'): the stem changes from хот (khot) to хоч (khoch)."
  "ru-4059":
    native: "They want bread."
    notes:
      "n1": "хотят (khotyat) is the они (oni) form of хотеть (khotet'): the plural takes second-conjugation endings."
    bases:
      "Они": "they"
  "ru-4060":
    native: "You can read."
    notes:
      "n1": "можешь (mozhesh') is the ты (ty) form of мочь (moch'). After it a second verb stays in the infinitive: читать (chitat')."
    bases:
      "Ты": "you (one person)"
  "ru-4061":
    native: "I live here."
    notes:
      "n1": "живу (zhivu) is the я (ya) form of жить (zhit'), and the stress is on the ending."
    bases:
      "здесь": "here"
  "ru-4062":
    native: "We live here."
    notes:
      "n1": "живём (zhivyom) is the мы (my) form of жить (zhit'): a stressed е (ye) of the ending becomes ё (yo)."
    bases:
      "Мы": "we"
      "здесь": "here"
  "ru-4063":
    native: "What are you doing?"
    notes:
      "n1": "делаешь (delayesh') is the ты (ty) form of делать (delat'): the ending is ешь (yesh')."
    bases:
      "Что": "what"
      "ты": "you (one person)"
