id: "ru-en-grammar-grammatical-gender-sentences"
kind: "layer"
core: "ru-grammar-grammatical-gender-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Gender in sentences"
license: "CC-BY-SA-4.0"
description: "14 short sentences with this, my and your, written from the table: the pronoun takes the gender of the noun. Not yet checked by a Russian speaker: please report any mistake."
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "ru-4000":
    native: "This is my brother."
    notes:
      "n1": "брат (brat) is masculine, so it takes the masculine мой (moy)."
    bases:
      "Это": "this; it; this is"
      "мой": "my; mine"
  "ru-4001":
    native: "This is my sister."
    notes:
      "n1": "сестра (sestra) is feminine, so it takes the feminine моя (moya)."
    bases:
      "Это": "this; it; this is"
      "моя": "my (feminine)"
  "ru-4002":
    native: "This is my window."
    notes:
      "n1": "окно (okno) is neuter, so it takes the neuter моё (moyo)."
    bases:
      "Это": "this; it; this is"
      "моё": "my (neuter)"
  "ru-4003":
    native: "This is your house."
    notes:
      "n1": "дом (dom) is masculine, so it takes the masculine твой (tvoy)."
    bases:
      "Это": "this; it; this is"
      "твой": "your; yours (one person)"
  "ru-4004":
    native: "This is your family."
    notes:
      "n1": "семья (sem'ya) is feminine, so it takes the feminine твоя (tvoya)."
    bases:
      "Это": "this; it; this is"
      "твоя": "your (feminine)"
  "ru-4005":
    native: "This is your milk."
    notes:
      "n1": "молоко (moloko) is neuter, so it takes the neuter твоё (tvoyo)."
    bases:
      "Это": "this; it; this is"
      "твоё": "your (neuter)"
  "ru-4006":
    native: "This table is mine."
    notes:
      "n1": "стол (stol) is masculine, so it takes the masculine этот (etot) and мой (moy)."
    bases:
      "Этот": "this (masculine)"
      "мой": "my; mine"
  "ru-4007":
    native: "This water is yours."
    notes:
      "n1": "вода (voda) is feminine, so it takes the feminine эта (eta) and твоя (tvoya)."
    bases:
      "Эта": "this (feminine)"
      "твоя": "your (feminine)"
  "ru-4008":
    native: "This window is yours."
    notes:
      "n1": "окно (okno) is neuter, so it takes the neuter это (eto) and твоё (tvoyo)."
    bases:
      "Это": "this; it; this is"
      "твоё": "your (neuter)"
  "ru-4009":
    native: "My dad is here."
    notes:
      "n1": "папа (papa) ends in а (a) but names a man, so it takes the masculine мой (moy)."
    bases:
      "Мой": "my; mine"
      "здесь": "here"
  "ru-4010":
    native: "Your uncle is here."
    notes:
      "n1": "дядя (dyadya) ends in я (ya) but names a man, so it takes the masculine твой (tvoy)."
    bases:
      "Твой": "your; yours (one person)"
      "здесь": "here"
  "ru-4011":
    native: "Your mother is here."
    notes:
      "n1": "мать (mat') ends in ь (soft sign) and is feminine, so it takes the feminine твоя (tvoya)."
    bases:
      "Твоя": "your (feminine)"
      "здесь": "here"
  "ru-4012":
    native: "This is your day."
    notes:
      "n1": "день (den') ends in ь (soft sign) and is masculine, so it takes the masculine твой (tvoy)."
    bases:
      "Это": "this; it; this is"
      "твой": "your; yours (one person)"
  "ru-4013":
    native: "This night is mine."
    notes:
      "n1": "ночь (noch') ends in ь (soft sign) and is feminine, so it takes the feminine эта (eta) and моя (moya)."
    bases:
      "Эта": "this (feminine)"
      "моя": "my (feminine)"
