schema: 1
id: "ru-en-cyrillic-consonants"
kind: "layer"
core: "ru-cyrillic-consonants"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Cyrillic consonants"
license: "CC-BY-SA-4.0"
description: "The 21 consonant letters of Russian. Most can be hard or soft, depending on the vowel letter or ь (soft sign) after them. ж (zh), ш (sh) and ц (ts) are always hard, and й (y), ч (ch) and щ (shch) are always soft. Some letters look like Latin letters and say something else: в (v), н (n), р (r), с (s), х (kh). Taken from Wikipedia's page on the Russian alphabet. Not yet checked by a Russian speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "ru-0310":
    native: "b, as in 'boy'"
    notes:
      "n1": "The letter б (b) is 'b', as in большое (bolshoye), big, great. At the end of a word it is said like a 'p': voiced consonants are devoiced there, and the spelling does not show it."
  "ru-0311":
    native: "v, as in 'very'"
    notes:
      "n1": "The letter в (v) is 'v', as in вода (voda), water. At the end of a word, or before a voiceless consonant, it is said like an 'f'."
      "latin": "Looks like the Latin letter B, but в (v) says V: вода (voda) is 'vada', not 'boda'."
  "ru-0312":
    native: "g, as in 'go'"
    notes:
      "n1": "The letter г (g) is the hard 'g' of 'go', never an 'h' or a soft 'j', as in где (gde), where. At the end of a word it is said like a 'k'."
  "ru-0313":
    native: "d, as in 'do'"
    notes:
      "n1": "The letter д (d) is 'd', as in да (da), yes. At the end of a word it is said like a 't'. Its shape is a small house with feet."
  "ru-0314":
    native: "zh, as in 'measure'"
    notes:
      "n1": "The letter ж (zh) is the 'zh' of 'measure' or 'vision', said with the tongue curled back, as in пожалуйста (pozhaluysta), please. It is always hard. At the end of a word it is said like ш (sh): нож (nozh), knife."
  "ru-0315":
    native: "z, as in 'zoo'"
    notes:
      "n1": "The letter з (z) is 'z', as in зовут (zovut), they call. It looks like the numeral 3. At the end of a word it is said like an 's'."
  "ru-0316":
    native: "y, a short 'ee' after a vowel"
    notes:
      "n1": "The letter й (y) is a quick 'y' that follows a vowel, as in чай (chay), tea, 'chai'. It is a consonant, always soft, and it is never stressed. It sounds like the 'y' of 'boy'."
      "look-i": "й (y) is и (i) with a small curve (a breve) over it. Without the curve the letter is the vowel 'ee'."
  "ru-0317":
    native: "k, as in 'sky'"
    notes:
      "n1": "The letter к (k) is 'k', said without the puff of air of English 'kite', as in как (kak), how."
  "ru-0318":
    native: "l, as in 'lamp'"
    notes:
      "n1": "The letter л (l) is 'l'. Before a hard vowel it is a darker l, with the back of the tongue raised, as in большое (bolshoye), big. Before a soft vowel or ь (soft sign) it is a lighter, softer l."
  "ru-0319":
    native: "m, as in 'mother'"
    notes:
      "n1": "The letter м (m) is 'm', as in меня (menya), me."
  "ru-0320":
    native: "n, as in 'no'"
    notes:
      "n1": "The letter н (n) is 'n', as in нет (net), no."
      "latin": "Looks like the Latin letter H, but н (n) says N: нет (net) is 'nyet', not 'het'."
  "ru-0321":
    native: "p, as in 'spin'"
    notes:
      "n1": "The letter п (p) is 'p', said without the puff of air of English 'pin', as in спасибо (spasibo), thank you. It looks like a Greek pi."
  "ru-0322":
    native: "r, a rolled or tapped 'r'"
    notes:
      "n1": "The letter р (r) is a rolled or tapped r, made with a quick flick of the tip of the tongue, as in хорошо (khorosho), good. It is not the English r."
      "latin": "Looks like the Latin letter P, but р (r) says R: хорошо (khorosho) has an r, not a p."
  "ru-0323":
    native: "s, as in 'see'"
    notes:
      "n1": "The letter с (s) is always the sound 's', never a 'k', as in спасибо (spasibo), thank you."
      "latin": "Looks like the Latin letter C, but с (s) says S: it is never a K sound, as C is in 'cat'."
  "ru-0324":
    native: "t, as in 'stop'"
    notes:
      "n1": "The letter т (t) is 't', said without the puff of air of English 'top', as in туалет (tualet), toilet."
  "ru-0325":
    native: "f, as in 'fun'"
    notes:
      "n1": "The letter ф (f) is 'f', as in кофе (kofe), coffee. It is found mostly in words that came from other languages."
  "ru-0326":
    native: "kh, as in Scottish 'loch'"
    notes:
      "n1": "The letter х (kh) is a rough 'kh', like the 'ch' of Scottish 'loch' or German 'Bach', as in хорошо (khorosho), good."
      "latin": "Looks like the Latin letter X, but х (kh) says KH: хорошо (khorosho) is 'khorosho', not 'xorosho'."
  "ru-0327":
    native: "ts, as in 'cats'"
    notes:
      "n1": "The letter ц (ts) is 'ts', as in цена (tsena), price. It is always hard, and it has a small tail at the bottom right."
      "look-shch": "ц (ts) and щ (shch) both have a tail at the bottom right. ц (ts) is 'ts', a short hard sound, and щ (shch) is a long soft 'sh'."
  "ru-0328":
    native: "ch, as in 'church'"
    notes:
      "n1": "The letter ч (ch) is 'ch', a little lighter than in 'church', as in очень (ochen'), very. It is always soft, whatever letter follows it."
  "ru-0329":
    native: "sh, as in 'shut'"
    notes:
      "n1": "The letter ш (sh) is 'sh', said with the tongue curled back a little, as in хорошо (khorosho), good. It is always hard."
      "look-shch": "ш (sh) has no tail. щ (shch) is ш (sh) with a tail at the bottom right, and it is a longer, softer sound."
  "ru-0330":
    native: "shch, a long soft 'sh'"
    notes:
      "n1": "The letter щ (shch) is a long soft 'sh', said as in 'fresh sheep' run together, as in ещё (yeshchyo), more. It is always soft."
      "look-sh": "щ (shch) is ш (sh) with a tail at the bottom right. ш (sh) is a short hard 'sh'."
