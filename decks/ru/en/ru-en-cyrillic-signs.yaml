name: "Cyrillic signs"
license: "CC-BY-SA-4.0"
description: "The two signs that have no sound: the hard sign ъ (hard sign) and the soft sign ь (soft sign). They stand beside a consonant and change how it is said. Taken from Wikipedia's page on the Russian alphabet. Not yet checked by a Russian speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "ru-0331":
    native: "the hard sign: no sound"
    notes:
      "n1": "The hard sign ъ (hard sign) is silent and rare. It stands between a prefix that ends in a consonant and a soft vowel letter (е (ye), ё (yo), ю (yu), я (ya)), and says that the consonant stays hard and the vowel keeps its 'y': подъезд (pod'yezd), entrance of a block of flats. It never begins a word."
      "look-soft": "ъ (hard sign) is ь (soft sign) with a bar to the left. They are both silent. The soft sign softens the consonant before it, and the hard sign keeps it hard."
  "ru-0332":
    native: "the soft sign: no sound"
    notes:
      "n1": "The soft sign ь (soft sign) is silent. It says that the consonant before it is soft, as if a quick 'y' followed: брат (brat), brother against брать (brat'), to take, and сколько (skolko), how much. After ж (zh), ш (sh), ч (ch) and щ (shch) it changes no sound, and only marks grammar: тушь (tush'), India ink is feminine, and туш (tush) is masculine."
      "look-hard": "ь (soft sign) is ъ (hard sign) without the bar on its left. The soft sign softens the consonant before it, and the hard sign keeps it hard."
