native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
license: "CC-BY-SA-4.0"
description: "Twenty things to say from the first day, before their words are taught: greetings and farewells, thank you and please, sorry, the way to ask for slower speech and for help, and how to say your name. Written in Cyrillic; readings are based on a scholarly romanisation in the BGN/PCGN style, with the soft sign written as an apostrophe. Not yet checked by a Russian speaker: please report any mistake."
