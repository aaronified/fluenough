description: "The question words: who, what, where, when, why, how, how much, which, and whose. Readings are based on a scholarly romanisation. Not yet checked by a Russian speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "ru-1300":
    native: "who"
    notes:
      "n1": "кто́ (kto) is 'who', and asks about a person."
  "ru-1301":
    native: "what"
    notes:
      "n1": "что́ (chto) is 'what', and asks about a thing or an idea."
  "ru-1302":
    native: "where"
    notes:
      "n1": "где (gde) is 'where', for asking about a place."
  "ru-1303":
    native: "when"
    notes:
      "n1": "когда́ (kogda) is 'when', for asking about a time."
  "ru-1304":
    native: "why"
    notes:
      "n1": "почему́ (pochemu) is 'why'."
  "ru-1305":
    native: "how"
    notes:
      "n1": "как (kak) is 'how'."
  "ru-1306":
    native: "which; what kind of"
    notes:
      "n1": "како́й (kakoy) is 'which' or 'what kind of', a question word that goes with a noun."
  "ru-1307":
    native: "how much; how many"
    notes:
      "n1": "ско́лько (skolko) is 'how much' or 'how many'."
  "ru-1308":
    native: "where to"
    notes:
      "n1": "куда́ (kuda) is 'where to', for asking about a direction."
  "ru-1309":
    native: "where from"
    notes:
      "n1": "отку́да (otkuda) is 'where from'."
  "ru-1310":
    native: "which one (of a set)"
    notes:
      "n1": "кото́рый (kotory) is 'which', for choosing one from a known set."
  "ru-1311":
    native: "whose"
    notes:
      "n1": "че́й (chey) is 'whose'."
  "ru-1312":
    native: "why; what for"
    notes:
      "n1": "заче́м (zachem) is 'what for', asking the purpose."
  "ru-1313":
    native: "what is it like"
    notes:
      "n1": "како́в (kakov) asks what a thing is like, what kind of thing it is."
  "ru-1314":
    native: "why"
    notes:
      "n1": "отчего́ (otchego) is another way to ask 'why'."
