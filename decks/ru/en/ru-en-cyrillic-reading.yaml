schema: 1
id: "ru-en-cyrillic-reading"
kind: "layer"
core: "ru-cyrillic-reading"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Reading and spelling syllables"
license: "CC-BY-SA-4.0"
description: "27 syllables that show how Russian is read: a hard vowel letter against a soft one after т (t), the soft sign ь (soft sign), the glide й (y) after a vowel, and the always-hard and always-soft letters ж (zh), ш (sh), ц (ts), ч (ch) and щ (shch). Taken from Wikipedia's page on the Russian alphabet. Not yet checked by a Russian speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "ru-0340":
    native: "ta, a hard t and the vowel 'a'"
    notes:
      "n1": "The hard vowel letter а (a) leaves the consonant before it hard: та (ta) is said with a plain t. The hard vowel letters are а (a), э (e), о (o), у (u) and ы (y)."
      "pair": "Not тя (tya): the soft vowel letter я (ya) softens the т (t) and adds a quick 'y'. The two are said /ta/ and /tʲa/."
  "ru-0341":
    native: "tya, a soft t and the vowel 'a'"
    notes:
      "n1": "The soft vowel letter я (ya) softens the consonant before it: тя (tya) is said with the middle of the tongue raised, as 'tya'. The soft vowel letters are я (ya), е (ye), ё (yo), ю (yu) and и (i)."
      "pair": "Not та (ta): there the hard vowel letter а (a) leaves the т (t) plain. The two are said /tʲa/ and /ta/."
  "ru-0342":
    native: "te, a hard t and the vowel 'e'"
    notes:
      "n1": "The hard vowel letter э (e) leaves the consonant hard. It is rare after a consonant: it is used mostly in loanwords and in names, as in Сэм (Sem), Sam."
      "pair": "Not те (te): the soft vowel letter е (ye) softens the т (t). The two are said /tɛ/ and /tʲe/."
  "ru-0343":
    native: "te, a soft t and the vowel 'e'"
    notes:
      "n1": "The soft vowel letter е (ye) softens the consonant before it, and it is the usual way to write 'e' after a consonant in Russian words: нет (net), no."
      "pair": "Not тэ (te): the hard vowel letter э (e) leaves the т (t) plain. The two are said /tʲe/ and /tɛ/."
  "ru-0344":
    native: "to, a hard t and the vowel 'o'"
    notes:
      "n1": "The hard vowel letter о (o) leaves the consonant hard: то (to) is said with a plain t and an 'o' with no glide, as in но (no), but."
      "pair": "Not тё (tyo): the soft vowel letter ё (yo) softens the т (t). The two are said /to/ and /tʲo/."
  "ru-0345":
    native: "tyo, a soft t and the vowel 'o'"
    notes:
      "n1": "The soft vowel letter ё (yo) softens the consonant before it and says 'o': тё (tyo) is 'tyo'. The letter ё (yo) is always stressed, and it is usually printed without its two dots, as е (ye)."
      "pair": "Not то (to): the hard vowel letter о (o) leaves the т (t) plain. The two are said /tʲo/ and /to/."
  "ru-0346":
    native: "tu, a hard t and the vowel 'oo'"
    notes:
      "n1": "The hard vowel letter у (u) leaves the consonant hard: ту (tu) is said with a plain t, as in туалет (tualet), toilet."
      "pair": "Not тю (tyu): the soft vowel letter ю (yu) softens the т (t). The two are said /tu/ and /tʲu/."
  "ru-0347":
    native: "tyu, a soft t and the vowel 'oo'"
    notes:
      "n1": "The soft vowel letter ю (yu) softens the consonant before it and says 'oo': тю (tyu) is 'tyu'."
      "pair": "Not ту (tu): the hard vowel letter у (u) leaves the т (t) plain. The two are said /tʲu/ and /tu/."
  "ru-0348":
    native: "ty, a hard t and the back vowel 'ɨ'"
    notes:
      "n1": "The hard vowel letter ы (y) leaves the consonant hard and says the back vowel /ɨ/: ты (ty), you, said to one friend. The word вы (vy), you is spelled the same way."
      "pair": "Not ти (ti): the soft vowel letter и (i) softens the т (t) and says a clear 'ee'. The two are said /tɨ/ and /tʲi/."
  "ru-0349":
    native: "ti, a soft t and the vowel 'ee'"
    notes:
      "n1": "The soft vowel letter и (i) softens the consonant before it and says 'ee': ти (ti) is 'tee', with the middle of the tongue raised."
      "pair": "Not ты (ty): the hard vowel letter ы (y) leaves the т (t) plain and says the back vowel. The two are said /tʲi/ and /tɨ/."
  "ru-0350":
    native: "t', a soft t with no vowel"
    notes:
      "n1": "The soft sign ь (soft sign) after a consonant says that the consonant is soft, and adds no vowel: ть (t') is a soft t, as at the end of брать (brat'), to take. In the readings it is written with an apostrophe: t'."
  "ru-0351":
    native: "l', a soft l with no vowel"
    notes:
      "n1": "The soft sign ь (soft sign) makes the л (l) soft: ль (l') is a light l with the middle of the tongue raised, as at the end of уголь (ugol'), coal."
  "ru-0352":
    native: "n', a soft n with no vowel"
    notes:
      "n1": "The soft sign ь (soft sign) makes the н (n) soft: нь (n') is a soft n, as at the end of день (den'), day."
  "ru-0353":
    native: "ai, as the 'i' of 'tie'"
    notes:
      "n1": "A consonant letter й (y) after a vowel is a quick 'y' that closes the syllable: ай (ay) is said /aj/, as at the end of чай (chay), tea. It is never stressed on its own, and it follows a vowel."
  "ru-0354":
    native: "oi, as the 'oy' of 'boy'"
    notes:
      "n1": "ой (oy) is an 'o' that ends in a quick 'y', as in большой (bolshoy), big, where the stress is on ой (oy): /bɐlʲˈʂoj/."
  "ru-0355":
    native: "ooi, as the 'ui' of 'gooey'"
    notes:
      "n1": "уй (uy) is an 'oo' that ends in a quick 'y', as in пожалуйста (pozhaluysta), please: /pəʐɐˈlustə/."
  "ru-0356":
    native: "yi, the back vowel with a quick 'y'"
    notes:
      "n1": "ый (y) is the ending of many adjectives, as in новый (novy), new. In the readings of this course it is written y, as the engine's reading of новый (novy) shows: the 'y' of the sound is part of the letter. The vowel ы (y) is the back 'ɨ'."
  "ru-0357":
    native: "ii, the vowel 'ee' with a quick 'y'"
    notes:
      "n1": "ий (iy) is the ending of adjectives such as русский (russkiy), Russian, and it is said /ˈruskʲɪj/: the sound of ий (iy) is a soft 'ee' ending in a quick 'y'."
  "ru-0358":
    native: "zhy, said with the back vowel"
    notes:
      "n1": "The letters ж (zh), ш (sh) and ц (ts) are always hard, so the letter и (i) after them is said as the back vowel /ɨ/, not as a clear 'ee': жи (zhi) is said /ʐɨ/. The spelling keeps и (i) after ж (zh) and ш (sh), as in жить (zhit'), to live."
  "ru-0359":
    native: "shy, said with the back vowel"
    notes:
      "n1": "ш (sh) is always hard, so и (i) after it is said as the back vowel /ɨ/: ши (shi) is said /ʂɨ/, as in шить (shit'), to sew."
  "ru-0360":
    native: "tsy, said with the back vowel"
    notes:
      "n1": "ц (ts) is always hard, so и (i) after it is said as the back vowel /ɨ/: ци (tsi) is said /tsɨ/, as in цирк (tsirk), circus."
  "ru-0361":
    native: "cha, a soft ch and the vowel 'a'"
    notes:
      "n1": "ч (ch) is always soft, so after it the vowel is written а (a), not я (ya): ча (cha), as in чай (chay), tea. The spelling rule for ч (ch) and щ (shch) is to write а (a) and у (u), not я (ya) and ю (yu)."
  "ru-0362":
    native: "shcha, a long soft sh and the vowel 'a'"
    notes:
      "n1": "щ (shch) is always soft, so after it the vowel is written а (a), not я (ya): ща (shcha), as in пища (pishcha), food."
  "ru-0363":
    native: "chu, a soft ch and the vowel 'oo'"
    notes:
      "n1": "ч (ch) is always soft, so after it the vowel is written у (u), not ю (yu): чу (chu), as in чудо (chudo), miracle."
  "ru-0364":
    native: "shchu, a long soft sh and the vowel 'oo'"
    notes:
      "n1": "щ (shch) is always soft, so after it the vowel is written у (u), not ю (yu): щу (shchu), as in ищу (ishchu), I look for."
  "ru-0365":
    native: "zhe, a hard zh and the vowel 'e'"
    notes:
      "n1": "ж (zh) is always hard, so a stressed е (ye) after it is said /ɛ/, with no softening: же (zhe), as in жест (zhest), gesture. Unstressed, the same letters are said with the back vowel: жена (zhena), wife is said /ʐɨˈna/."
  "ru-0366":
    native: "she, a hard sh and the vowel 'e'"
    notes:
      "n1": "ш (sh) is always hard, so a stressed е (ye) after it is said /ɛ/, with no softening: ше (she), as in шесть (shest'), six."
