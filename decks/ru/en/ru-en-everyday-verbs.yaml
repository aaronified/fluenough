description: "Common verbs for daily life: eating, drinking, going, seeing, speaking, buying and learning. Each entry gives its aspect partner where it has one. Not yet checked by a Russian speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "ru-1650":
    native: "to eat"
    notes:
      "n1": "есть (yest') is to eat. It is imperfective. Its perfective partners are съесть (s'yest') and пое́сть (poyest')."
  "ru-1651":
    native: "to drink"
    notes:
      "n1": "пить (pit') is to drink. It is imperfective. Its perfective partners are вы́пить (vypit') and попи́ть (popit')."
  "ru-1652":
    native: "to sleep"
    notes:
      "n1": "спать (spat') is to sleep. It is imperfective. Its perfective partner is поспа́ть (pospat')."
  "ru-1653":
    native: "to go"
    notes:
      "n1": "идти́ (idti) is to go. It is imperfective. Its perfective partner is пойти́ (poyti)."
  "ru-1654":
    native: "to go, to walk"
    notes:
      "n1": "ходи́ть (khodit') is to go, to walk. It is imperfective. Its perfective partner is сходи́ть (skhodit')."
  "ru-1655":
    native: "to go by vehicle, to drive"
    notes:
      "n1": "е́хать (yekhat') is to go by vehicle, to drive. It is imperfective. Its perfective partner is пое́хать (poyekhat')."
  "ru-1656":
    native: "to write"
    notes:
      "n1": "писа́ть (pisat') is to write. It is imperfective. Its perfective partner is написа́ть (napisat')."
  "ru-1657":
    native: "to hear"
    notes:
      "n1": "слы́шать (slyshat') is to hear. It is imperfective. Its perfective partner is услы́шать (uslyshat')."
  "ru-1658":
    native: "to see"
    notes:
      "n1": "ви́деть (videt') is to see. It is imperfective. Its perfective partners are зави́деть (zavidet') and уви́деть (uvidet')."
  "ru-1659":
    native: "to look, to gaze"
    notes:
      "n1": "смотре́ть (smotret') is to look, to gaze. It is imperfective. Its perfective partner is посмотре́ть (posmotret')."
  "ru-1660":
    native: "to think"
    notes:
      "n1": "ду́мать (dumat') is to think. It is imperfective. Its perfective partner is поду́мать (podumat')."
  "ru-1661":
    native: "to stand"
    notes:
      "n1": "стоя́ть (stoyat') is to stand. It is imperfective. Its perfective partner is постоя́ть (postoyat')."
  "ru-1662":
    native: "to sit"
    notes:
      "n1": "сиде́ть (sidet') is to sit. It is imperfective. Its perfective partners are сесть (sest') and посиде́ть (posidet')."
  "ru-1663":
    native: "to lie"
    notes:
      "n1": "лежа́ть (lezhat') is to lie. It is imperfective. Its perfective partners are лечь (lech') and полежа́ть (polezhat')."
  "ru-1664":
    native: "to walk, to stroll"
    notes:
      "n1": "гуля́ть (gulyat') is to walk, to stroll. It is imperfective. Its perfective partners are погуля́ть (pogulyat') and гульну́ть (gulnut')."
  "ru-1665":
    native: "to buy, to purchase"
    notes:
      "n1": "покупа́ть (pokupat') is to buy, to purchase. It is imperfective. Its perfective partner is купи́ть (kupit')."
  "ru-1666":
    native: "to give"
    notes:
      "n1": "дать (dat') is to give. It is perfective. Its imperfective partner is дава́ть (davat')."
  "ru-1667":
    native: "to take"
    notes:
      "n1": "взять (vzyat') is to take. It is perfective. Its imperfective partner is брать (brat')."
  "ru-1668":
    native: "to open"
    notes:
      "n1": "откры́ть (otkryt') is to open. It is perfective. Its imperfective partner is открыва́ть (otkryvat')."
  "ru-1669":
    native: "to cover, to hide"
    notes:
      "n1": "закры́ть (zakryt') is to cover, to hide. It is perfective. Its imperfective partner is закрыва́ть (zakryvat')."
  "ru-1670":
    native: "to begin, to start"
    notes:
      "n1": "начина́ть (nachinat') is to begin, to start. It is imperfective. Its perfective partner is нача́ть (nachat')."
  "ru-1671":
    native: "to teach, to instruct"
    notes:
      "n1": "учи́ть (uchit') is to teach, to instruct. It is imperfective. Its perfective partners are вы́учить (vyuchit'), научи́ть (nauchit') and обучи́ть (obuchit')."
  "ru-1672":
    native: "to learn"
    notes:
      "n1": "учи́ться (uchitsya) is to learn. It is imperfective. Its perfective partners are вы́учиться (vyuchitsya) and научи́ться (nauchitsya)."
  "ru-1673":
    native: "to prepare, to make ready"
    notes:
      "n1": "гото́вить (gotovit') is to prepare, to make ready. It is imperfective. Its perfective partners are пригото́вить (prigotovit'), подгото́вить (podgotovit') and загото́вить (zagotovit')."
  "ru-1674":
    native: "to call"
    notes:
      "n1": "звони́ть (zvonit') is to call. It is imperfective. Its perfective partner is позвони́ть (pozvonit')."
  "ru-1675":
    native: "to answer, to reply"
    notes:
      "n1": "отвеча́ть (otvechat') is to answer, to reply. It is imperfective. Its perfective partner is отве́тить (otvetit')."
  "ru-1676":
    native: "to have, to possess"
    notes:
      "n1": "име́ть (imet') is to have, to possess. It is imperfective."
