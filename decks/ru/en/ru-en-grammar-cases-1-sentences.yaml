schema: 1
id: "ru-en-grammar-cases-1-sentences"
kind: "layer"
core: "ru-grammar-cases-1-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The first cases in sentences"
license: "CC-BY-SA-4.0"
description: "16 short sentences with the nominative, the accusative and the prepositional, written from the tables. Not yet checked by a Russian speaker: please report any mistake."
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "ru-4100":
    native: "This is a book."
    notes:
      "n1": "книга (kniga) is the nominative: the form of the subject, with no ending added."
    bases:
      "Это": "this; it; this is"
  "ru-4101":
    native: "These are books."
    notes:
      "n1": "книги (knigi) is the nominative plural of книга (kniga): the а (a) changes to и (i)."
    bases:
      "Это": "this; it; this is"
  "ru-4102":
    native: "These are houses."
    notes:
      "n1": "дома (doma) is the nominative plural of дом (dom), an irregular plural with the stress on the ending."
    bases:
      "Это": "this; it; this is"
  "ru-4103":
    native: "These are friends."
    notes:
      "n1": "друзья (druz'ya) is the nominative plural of друг (drug): an irregular plural that has to be learnt."
    bases:
      "Это": "this; it; this is"
  "ru-4104":
    native: "I am reading a book."
    notes:
      "n1": "книгу (knigu) is the accusative of книга (kniga): the object of the verb, with а (a) changed to у (u)."
  "ru-4105":
    native: "I know the brother."
    notes:
      "n1": "брата (brata) is the accusative of брат (brat): a masculine person takes the ending а (a), the same as the genitive."
  "ru-4106":
    native: "I love my sister."
    notes:
      "n1": "сестру (sestru) is the accusative of сестра (sestra): а (a) changes to у (u)."
  "ru-4107":
    native: "I know the friend."
    notes:
      "n1": "друга (druga) is the accusative of друг (drug): a masculine person takes the ending а (a)."
  "ru-4108":
    native: "I want water."
    notes:
      "n1": "воду (vodu) is the accusative of вода (voda): а (a) changes to у (u), and the stress moves to the stem."
  "ru-4109":
    native: "I want bread."
    notes:
      "n1": "хлеб (khleb) is a masculine thing, so its accusative is the same as its nominative."
  "ru-4110":
    native: "My brother is in the house."
    notes:
      "n1": "в доме (v dome) is the prepositional of дом (dom) after в (v): the ending is е (ye)."
    bases:
      "в": "in; into"
  "ru-4111":
    native: "The book is on the table."
    notes:
      "n1": "на столе (na stole) is the prepositional of стол (stol) after на (na): the ending is е (ye), and the stress is on it."
    bases:
      "на": "on; at"
  "ru-4112":
    native: "My friend is in the garden."
    notes:
      "n1": "в саду (v sadu) is the locative of сад (sad): a stressed у (u) in place of е (ye) after в (v)."
    bases:
      "в": "in; into"
  "ru-4113":
    native: "We are in the city."
    notes:
      "n1": "в городе (v gorode) is the prepositional of город (gorod) after в (v): the ending is е (ye)."
    bases:
      "Мы": "we"
      "в": "in; into"
  "ru-4114":
    native: "My sister is at school."
    notes:
      "n1": "в школе (v shkole) is the prepositional of школа (shkola) after в (v): а (a) changes to е (ye)."
    bases:
      "в": "in; into"
  "ru-4115":
    native: "We are in the street."
    notes:
      "n1": "на улице (na ulitse) is the prepositional of улица (ulitsa) after на (na): а (a) changes to е (ye); улица (ulitsa) is used with на (na)."
    bases:
      "Мы": "we"
      "на": "on; at"
