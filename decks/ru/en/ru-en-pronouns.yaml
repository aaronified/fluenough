name: "Pronouns and everyday determiners"
license: "CC-BY-SA-4.0"
description: "The personal pronouns (I, you, he, she, it, we, they), the possessives (my, your, his, her, our, their), the reflexive word, and the words for all, every, some, other and such. Readings are based on a scholarly romanisation. Not yet checked by a Russian speaker: please report any mistake."
tags: ["unreviewed"]

