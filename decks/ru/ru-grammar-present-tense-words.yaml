# Unit 19 (ru-grammar-present-tense). Verbs the present-tense table needs that no earlier unit teaches. Sources read: en.wikipedia.org 'Russian grammar' (present-future endings of the first and second conjugations, чита́ть as the model verb, жить among the first-conjugation verbs, the past of сде́лать, the future of the perfective of чита́ть) and each verb's en.wiktionary.org entry.
