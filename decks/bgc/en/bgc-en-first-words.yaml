          "अरै": "here"
          "सै": "is"
  "bgc-0107":
    native: "they"
    notes:
      "n1": "The Survey's specimen has 'wai' for 'they' ('wai rajji hon lagge', they began to rejoice). Source: Grierson, Linguistic Survey of India, vol. IX part 1 (1916), the Bangaru section and its specimens (Karnal, Rohtak, Jind)."
    examples:
      "वै अरै सै।":
        native: "They are here."
        bases:
          "वै": "they"
          "अरै": "here"
          "सै": "is"
      "वै कौण सै?":
