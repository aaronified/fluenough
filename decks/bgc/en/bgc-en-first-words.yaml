description: "The first words of Haryanvi: the pronouns, yes and no, the numbers 1 to 10, the family, and the everyday words for food, house, name and time. Not yet checked by a Haryanvi speaker: please report any mistake."
cards:
  "bgc-0101":
    native: "yes"
    notes:
      "n1": "The usual 'yes'."
    examples:
      "हाँ, यो पाणी सै।":
        native: "Yes, this is water."
        bases:
          "हाँ": "yes"
          "यो": "this"
          "पाणी": "water"
          "सै": "is"
  "bgc-0102":
    native: "no; not"
    notes:
      "n1": "The Survey gives nahi as the usual negative, and ni with a verb in the first person ('mai ni janu', I do not know). Its text has 'is jogga nahi sai', I am not worthy of this. कोनी (konī) is not attested there. Source: Grierson, Linguistic Survey of India, vol. IX part 1 (1916), the Bangaru section and its specimens (Karnal, Rohtak, Jind)."
    examples:
      "यो घर नहीं सै।":
        native: "This is not a house."
        bases:
          "यो": "this"
          "घर": "home"
          "नहीं": "not"
          "सै": "is"
      "वो अरै नहीं सै।":
        native: "He is not here."
        bases:
          "वो": "he"
          "अरै": "here"
          "नहीं": "not"
          "सै": "is"
  "bgc-0103":
    native: "I"
    notes:
      "n1": "The Survey gives mai for 'I', merā for 'my', and 'sū' for 'I am' ('mai ... karu-su'). Source: Grierson, Linguistic Survey of India, vol. IX part 1 (1916), the Bangaru section and its specimens (Karnal, Rohtak, Jind)."
    examples:
      "मैं घर में सूं।":
        native: "I am at home."
        bases:
          "मैं": "I"
          "घर": "home"
          "में": "in"
          "सूं": "am"
      "यो मेरा घर सै।":
        native: "This is my house."
        bases:
          "यो": "this"
          "मेरा": "my"
          "घर": "home"
          "सै": "is"
  "bgc-0104":
    native: "you (respectful)"
    notes:
      "n1": "The Survey gives tham (or tamhe) for 'you' (plural), and tu or tau for one person. Source: Grierson, Linguistic Survey of India, vol. IX part 1 (1916), the Bangaru section and its specimens (Karnal, Rohtak, Jind)."
    examples:
      "थम अर मैं।":
        native: "You and I."
        bases:
          "थम": "you"
          "अर": "and"
          "मैं": "I"
      "थम कौण सै?":
        native: "Who are you?"
        bases:
          "थम": "you"
          "कौण": "who"
          "सै": "is"
  "bgc-0105":
    native: "he; she"
    notes:
      "n1": "Not yet checked: the Survey gives oh or ou for 'that, he'. Source: Grierson, Linguistic Survey of India, vol. IX part 1 (1916), the Bangaru section and its specimens (Karnal, Rohtak, Jind)."
    examples:
      "वो घर में सै।":
        native: "He is at home."
        bases:
          "वो": "he"
          "घर": "home"
          "में": "at"
          "सै": "is"
      "वो डॉक्टर सै।":
