          "डॉक्टर": "doctor"
          "सै": "is"
  "bgc-0106":
    native: "we"
    notes:
      "n1": "The Survey gives ham (or hame) for 'we'; mhārā is 'our'. म्हे (mhe) is not attested there. Source: Grierson, Linguistic Survey of India, vol. IX part 1 (1916), the Bangaru section and its specimens (Karnal, Rohtak, Jind)."
    examples:
      "हम अर थम।":
        native: "We and you."
        bases:
          "हम": "we"
          "अर": "and"
          "थम": "you"
      "हम अरै सै।":
        native: "We are here."
        bases:
