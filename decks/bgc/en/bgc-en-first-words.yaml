  "bgc-0136":
    native: "who"
    notes:
      "n1": "The Survey gives kauṇ for 'who'. कुण (kuṇ) is Rajasthani. Source: Grierson, Linguistic Survey of India, vol. IX part 1 (1916), the Bangaru section and its specimens (Karnal, Rohtak, Jind)."
    examples:
      "यो कौण सै?":
        native: "Who is this?"
        bases:
          "यो": "this"
          "कौण": "who"
          "सै": "is"
      "तेरा भाई कौण सै?":
        native: "Who is your brother?"
        bases:
          "तेरा": "your"
          "भाई": "brother"
          "कौण": "who"
          "सै": "is"
  "bgc-0137":
    native: "where"
    notes:
      "n1": "The Survey's vocabulary has a form for 'where' (karai or kare, the reading is not clear). कित (kit) is not attested there. Source: Grierson, Linguistic Survey of India, vol. IX part 1 (1916), the Bangaru section and its specimens (Karnal, Rohtak, Jind)."
    examples:
      "थम कित सो?":
        native: "Where are you?"
        bases:
          "थम": "you"
          "कित": "where"
          "सो": "are"
      "घर कित सै?":
        native: "Where is the house?"
        bases:
          "घर": "house"
          "कित": "where"
          "सै": "is"
  "bgc-0138":
    native: "and"
    notes:
      "n1": "The Survey's text has ar for 'and'. Source: Grierson, Linguistic Survey of India, vol. IX part 1 (1916), the Bangaru section and its specimens (Karnal, Rohtak, Jind)."
    examples:
      "मैं अर थम।":
        native: "You and I."
        bases:
          "मैं": "I"
          "अर": "and"
          "थम": "you"
      "घर अर पाणी।":
        native: "A house and water."
        bases:
          "घर": "home"
          "अर": "and"
          "पाणी": "water"
  "bgc-0139":
    native: "today"
    notes:
      "n1": "The day you are in now."
    examples:
      "आज घाम निकल्या।":
        native: "The sun came out today."
        bases:
          "आज": "today"
          "घाम": "sun"
          "निकल्या": "come out"
      "आज पाणी बरसेगा।":
        native: "It will rain today."
        bases:
          "आज": "today"
          "पाणी": "water"
          "बरसेगा": "rain"
