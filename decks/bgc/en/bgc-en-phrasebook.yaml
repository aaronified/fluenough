schema: 1
id: "bgc-en-phrasebook"
kind: "layer"
core: "bgc-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty phrases to say whole from the first day, before their words are taught: greetings and goodbye, thanks and sorry, asking for slower speech, asking for help and where the toilet is. Not yet checked by a Haryanvi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
cards:
  "bgc-0001":
    native: "hello"
    notes:
      "n1": "The usual greeting in Haryana."
    bases:
      "राम": "hello"
  "bgc-0002":
    native: "good morning"
    notes:
      "n1": "Said in the morning."
    bases:
      "सुप्रभात": "good morning"
  "bgc-0003":
    native: "good evening"
    notes:
      "n1": "Said in the evening."
    bases:
      "शुभ": "auspicious; good"
      "संध्या": "evening"
  "bgc-0004":
    native: "good night"
    notes:
      "n1": "Said at bedtime. रात (rāt) is 'night'."
    bases:
      "शुभ": "auspicious; good"
      "रात": "night"
  "bgc-0005":
    native: "see you again"
    notes:
      "n1": "Literally 'we will meet again'. Said when leaving."
    bases:
      "फेर": "again"
      "मिलांगे": "we will meet"
  "bgc-0006":
    native: "please"
    notes:
      "n1": "Put before a request."
    bases:
      "किरपा": "kindness"
      "करके": "having done"
  "bgc-0007":
    native: "thank you"
    notes:
      "n1": "Polite and common."
    bases:
      "धन्यवाद": "thank you"
  "bgc-0008":
    native: "you're welcome; no problem"
    notes:
      "n1": "Literally 'there is no matter'. Said in reply to thanks."
    bases:
      "कोई": "any"
      "बात": "matter"
  "bgc-0009":
    native: "sorry"
    notes:
      "n1": "Said to say sorry."
    bases:
      "माफ": "forgiveness"
      "करियो": "please do"
  "bgc-0010":
    native: "excuse me"
    notes:
      "n1": "Literally 'please listen'. Said to get someone's attention."
    bases:
      "सुणियो": "excuse me"
  "bgc-0011":
    native: "I don't understand"
    notes:
      "n1": "Literally 'understanding has not come to me'."
    bases:
      "मन्नै": "to me"
      "समझ": "understanding"
      "आई": "came"
  "bgc-0012":
    native: "I don't know Haryanvi"
    notes:
      "n1": "Put another language's name in place of हरियाणवी (hariyāṇvī)."
    bases:
      "मन्नै": "to me"
      "हरियाणवी": "Haryanvi"
      "आवै": "comes"
  "bgc-0013":
    native: "please speak slowly"
    notes:
      "n1": "धीरे (dhīre) is 'slowly'."
    bases:
      "धीरे": "slowly"
      "बोल्यो": "please speak"
  "bgc-0014":
    native: "do you speak English?"
    notes:
      "n1": "Respectful."
    bases:
      "अंग्रेजी": "English"
      "बोल": "speak"
      "सको": "can"
  "bgc-0015":
    native: "how are you?"
    notes:
      "n1": "Respectful."
    bases:
      "कैसे": "how"
      "सो": "are"
  "bgc-0016":
    native: "I'm fine"
    notes:
      "n1": "The answer to how are you. ठीक (ṭhīk) is 'fine'."
    bases:
      "ठीक": "fine"
      "सूं": "am"
  "bgc-0017":
    native: "what is your name?"
    notes:
      "n1": "Respectful. The answer is म्हारा (mhārā) नाम (nām) ... सै (sai)."
    bases:
      "थारा": "your"
      "सै": "is"
  "bgc-0018":
    native: "my name is ..."
    notes:
      "n1": "Put your name where the dots are."
    bases:
      "म्हारा": "my"
      "सै": "is"
  "bgc-0019":
    native: "where is the toilet?"
    notes:
      "n1": "शौचालय (śauchālay) is 'toilet'."
    bases:
      "शौचालय": "toilet"
      "सै": "is"
  "bgc-0020":
    native: "help!"
    notes:
      "n1": "Shouted in an emergency."

    bases:
      "बचाओ": "help!"