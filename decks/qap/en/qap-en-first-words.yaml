  "name": "English"
"name": "First words"
"description": "Ten words from the edicts of King Ashoka: Dhamma, good, king, Beloved of the Gods, Piyadasi, thus, said, people, my and here. The target is in Devanagari for now: the edicts were cut in Brahmi (and, in the north-west, Kharoshthi), and a Brahmi font is to be added later, so no Brahmi form is given. The reading is a Roman transliteration in ISO 15919 style (ṁ for the anusvāra, ṭ ḍ ṇ ḷ retroflex). The IPA is broad and reconstructed, on the same lines as for Pali. The edicts differ by region; this course takes the eastern, Magadhi-like standard of the Pillar Edicts, the Kalinga edicts and the Dhauli and Jaugada rock edicts (lājā for king, hida for here, hevaṁ for thus, nominatives in -e), not the north-western (Gandhari-like) or the western (Girnar, Sauraseni-like) versions. Not yet checked by an Indologist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "qap-0001":
    "native": "Dhamma; duty"
    "notes":
      "n1": "Dhaṁme is Dhamma, the moral law and duty that Ashoka teaches, in the nominative as the edicts write it in the east (Pillar Edict II: dhaṁme sādhū). Attested. Example 1 is quoted from a text (the Pillar Edicts and the Kalinga edicts); example 2 is composed from attested words."
    "examples":
      "धंमे साधू.":
        "native": "Dhamma is good."
        "bases":
          "धंमे": "Dhamma (nominative)"
          "साधू": "good"
      "हिद धंमे.":
        "native": "Dhamma is here."
        "bases":
          "हिद": "here"
          "धंमे": "Dhamma (nominative)"
  "qap-0002":
    "native": "good"
    "notes":
      "n1": "Sādhū is good, as in dhaṁme sādhū, Dhamma is good (Pillar Edict II). Attested; the Pali sādhu is the same word. Example 1 is quoted from a text (the Pillar Edicts and the Kalinga edicts); example 2 is composed from attested words."
    "examples":
      "धंमे साधू.":
        "native": "Dhamma is good."
        "bases":
          "धंमे": "Dhamma (nominative)"
          "साधू": "good"
      "हिद साधू.":
        "native": "It is good here."
        "bases":
          "हिद": "here"
          "साधू": "good"
  "qap-0003":
    "native": "king"
    "notes":
      "n1": "Lājā is king: the eastern form of the edicts says l where Sanskrit and the western edicts say r (rājā). Attested in the Pillar Edicts (devānaṁpiye piyadasi lājā). Example 1 is quoted from a text (the Pillar Edicts and the Kalinga edicts); example 2 is composed from attested words."
    "examples":
      "देवानंपिये पियदसि लाजा हेवं आहा.":
        "native": "The Beloved of the Gods, King Piyadasi, speaks thus."
        "bases":
          "देवानंपिये": "beloved of the gods (a title)"
          "पियदसि": "Piyadasi, he of the kind look (a name)"
          "लाजा": "king"
          "हेवं": "thus"
          "आहा": "said"
      "लाजा हिद.":
        "native": "The king is here."
        "bases":
          "लाजा": "king"
          "हिद": "here"
  "qap-0004":
    "native": "Beloved of the Gods"
    "notes":
      "n1": "Devānaṁpiye is the king's title, in the eastern nominative in -e: beloved of the gods. Attested at the start of nearly every edict. Example 1 is quoted from a text (the Pillar Edicts and the Kalinga edicts); example 2 is composed from attested words."
    "examples":
      "देवानंपिये पियदसि.":
        "native": "The Beloved of the Gods, Piyadasi."
        "bases":
          "देवानंपिये": "beloved of the gods (a title)"
          "पियदसि": "Piyadasi, he of the kind look (a name)"
      "हिद देवानंपिये.":
        "native": "The Beloved of the Gods is here."
        "bases":
          "हिद": "here"
          "देवानंपिये": "beloved of the gods (a title)"
  "qap-0005":
    "native": "Piyadasi"
    "notes":
      "n1": "Piyadasi, he who looks kindly, is the name Ashoka uses of himself in the edicts. Attested; it is a name, not a common noun. Both examples are quoted from a text (the Pillar Edicts and the Kalinga edicts)."
    "examples":
      "पियदसि लाजा.":
        "native": "King Piyadasi."
        "bases":
          "पियदसि": "Piyadasi, he of the kind look (a name)"
          "लाजा": "king"
      "पियदसि हेवं आहा.":
        "native": "Piyadasi speaks thus."
        "bases":
          "पियदसि": "Piyadasi, he of the kind look (a name)"
          "हेवं": "thus"
          "आहा": "said"
  "qap-0006":
    "native": "thus"
    "notes":
      "n1": "Hevaṁ is thus, in the eastern form; the western edicts write evaṁ. Attested in the formula hevaṁ āhā. Both examples are quoted from a text (the Pillar Edicts and the Kalinga edicts)."
    "examples":
      "हेवं आहा.":
        "native": "He speaks thus."
        "bases":
          "हेवं": "thus"
          "आहा": "said"
      "देवानंपिये हेवं आहा.":
        "native": "The Beloved of the Gods speaks thus."
        "bases":
          "देवानंपिये": "beloved of the gods (a title)"
          "हेवं": "thus"
          "आहा": "said"
  "qap-0007":
    "native": "said; speaks"
    "notes":
      "n1": "Āhā is he said, he speaks, the verb that introduces the king's words (hevaṁ āhā). Attested. Example 1 is quoted from a text (the Pillar Edicts and the Kalinga edicts); example 2 is composed from attested words."
    "examples":
      "लाजा हेवं आहा.":
        "native": "The king speaks thus."
        "bases":
          "लाजा": "king"
          "हेवं": "thus"
          "आहा": "said"
      "पियदसि आहा.":
        "native": "Piyadasi spoke."
        "bases":
          "पियदसि": "Piyadasi, he of the kind look (a name)"
          "आहा": "said"
  "qap-0008":
    "native": "people; subjects"
    "notes":
      "n1": "Pajā is people, the king's subjects and children (Kalinga edict: pajā mamā, my children). Attested. Example 1 is quoted from a text (the Pillar Edicts and the Kalinga edicts); example 2 is composed from attested words."
    "examples":
      "मम पजा.":
        "native": "My people."
        "bases":
          "मम": "my"
          "पजा": "people, subjects"
      "लाजा पजा.":
        "native": "The king's people."
        "bases":
          "लाजा": "king"
          "पजा": "people, subjects"
  "qap-0009":
    "native": "my"
    "notes":
      "n1": "Mama is my, of me. Attested; the eastern edicts also write mamā. Example 1 is quoted from a text (the Pillar Edicts and the Kalinga edicts); example 2 is composed from attested words."
    "examples":
      "मम पजा.":
        "native": "My people."
        "bases":
          "मम": "my"
          "पजा": "people, subjects"
      "मम लाजा.":
        "native": "My king."
        "bases":
          "मम": "my"
          "लाजा": "king"
  "qap-0010":
    "native": "here"
    "notes":
      "n1": "Hida is here, the eastern form that the western edicts write idha. Attested (hidatapālate, here and in the next world). The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "लाजा हिद.":
        "native": "The king is here."
        "bases":
          "लाजा": "king"
          "हिद": "here"
      "हिद पजा.":
        "native": "The people are here."
        "bases":
          "हिद": "here"
          "पजा": "people, subjects"
