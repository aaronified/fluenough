"tags":
- "unreviewed"
"cards":
  "qap-0011":
    "native": "The Beloved of the Gods, King Piyadasi, speaks thus."
    "notes":
      "n1": "The opening formula of the Pillar Edicts in the Delhi-Topra form. Attested."
  "qap-0012":
    "native": "Thus he speaks."
    "notes":
      "n1": "The formula that follows the king's titles and introduces his words. Attested."
  "qap-0013":
    "native": "Dhamma is good."
    "notes":
      "n1": "Pillar Edict II (the Delhi-Topra version), which goes on to ask what Dhamma is. Attested."
  "qap-0014":
    "native": "This is a writing of the Dhamma."
    "notes":
      "n1": "The edicts call themselves a dhaṁmalipi, a writing of the Dhamma (Rock Edict XIV). Attested; the eastern spelling of each letter is for a scholar to confirm."
  "qap-0015":
    "native": "All human beings are my children."
    "notes":
      "n1": "From the Kalinga edicts, where the king speaks of his people as his children. Attested in this sense; the exact eastern spelling is to be confirmed."
  "qap-0016":
    "native": "Here and in the other world."
    "notes":
      "n1": "One word of the Pillar Edicts, for the benefit of this world and the next. Attested; spelling to be confirmed."
  "qap-0017":
    "native": "Little sin, much good, compassion, giving, truth, purity."
    "notes":
      "n1": "Pillar Edict II's answer to what Dhamma is. Attested; the spelling follows the Delhi-Topra text as remembered and is to be confirmed."
  "qap-0018":
    "native": "Instruction in the Dhamma."
    "notes":
      "n1": "The king's term for his teaching, in the Pillar Edicts. Attested; spelling to be confirmed."
  "qap-0019":
    "native": "Victory by the Dhamma."
    "notes":
      "n1": "Rock Edict XIII's term for conquest by moral means. Attested; the eastern form is to be confirmed."
  "qap-0020":
    "native": "Not harming living beings."
    "notes":
      "n1": "A recurring phrase of the Rock Edicts. Attested; the eastern spelling is to be confirmed."
  "qap-0021":
    "native": "It is good to obey mother and father."
    "notes":
      "n1": "Rock Edict III, on obedience to parents. Attested; the eastern spelling is to be confirmed."
  "qap-0022":
    "native": "The gift of the Dhamma."
    "notes":
      "n1": "Rock Edict XI. Attested; spelling to be confirmed."
  "qap-0023":
    "native": "King Piyadasi."
    "notes":
      "n1": "The king's name and title as the edicts write them in the east. Attested."
  "qap-0024":
    "native": "My Dhamma is good."
    "notes":
      "n1": "Not a quoted line: composed from attested words and therefore conventional."
  "qap-0025":
    "native": "It is good here."
    "notes":
      "n1": "Not a quoted line: composed from attested words and therefore conventional."
