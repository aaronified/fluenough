"name": "Phrasebook: first phrases"
"description": "Fifteen phrases of the edicts: the king's opening formula, Dhamma is good, the Dhamma writing, the king's people as his children and the virtues he lists. The edicts have no everyday speech, so these are lines of royal proclamation; the last three are conventional, composed from attested words. Devanagari with the same reading and IPA as the first-words deck. Not yet checked by an Indologist: please report any mistake."
