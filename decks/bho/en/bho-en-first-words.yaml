native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "The first words of Bhojpuri: the pronouns, yes and no, the numbers 1 to 10, the family, and the everyday words for food, house, name and time. Not yet checked by a Bhojpuri speaker: please report any mistake."
cards:
  "bho-0101":
    native: "yes"
    notes:
      "n1": "The usual 'yes'."
    examples:
      "हँ, इ पानी ह।":
        native: "Yes, this is water."
        bases:
          "हँ": "yes"
          "इ": "this"
          "पानी": "water"
          "ह": "is"
  "bho-0102":
    native: "no; not"
    notes:
      "n1": "The negative. Before a verb it means 'not'."
    examples:
      "ना, हम आवत बानी।":
        native: "No, I am not coming."
        bases:
          "हम": "I"
          "आवत": "come"
  "bho-0103":
    native: "I"
    notes:
      "n1": "The first person."
    examples:
      "हम डाक्टर बानी।":
        native: "I am a doctor."
        bases:
          "हम": "I"
          "डाक्टर": "doctor"
          "बानी": "am"
      "हम ठीक बानी।":
        native: "I am fine."
        bases:
          "हम": "I"
          "ठीक": "fine"
          "बानी": "am"
  "bho-0104":
    native: "you (respectful)"
    notes:
      "n1": "The respectful 'you'. ते (te) is 'you' for a friend or a child."
    examples:
      "रउआ कइसे बानी?":
        native: "How are you?"
        bases:
          "रउआ": "you"
          "कइसे": "how"
          "बानी": "are"
      "रउआ घरे बानी।":
        native: "You are at home."
        bases:
          "रउआ": "you"
          "घरे": "at home"
          "बानी": "are"
  "bho-0105":
    native: "he; she"
    notes:
      "n1": "Bhojpuri uses one word for both. इह (ih) is 'this', and उहाँ (uhām̐) is 'there'."
    examples:
      "उह घरे बा।":
        native: "He is at home."
        bases:
          "उह": "he"
          "घरे": "at home"
          "बा": "is"
      "उह डाक्टर ह।":
        native: "She is a doctor."
        bases:
          "उह": "she"
          "डाक्टर": "doctor"
          "ह": "is"
  "bho-0106":
    native: "we"
    notes:
      "n1": "Means 'we' for a group that includes you or not."
    examples:
      "हमनी घरे जाइब जा।":
        native: "We are going home."
        bases:
          "हमनी": "we"
          "घरे": "home"
          "जाइब": "go"
          "जा": "a particle of emphasis"
      "हमनी बिहारी बानी जा।":
