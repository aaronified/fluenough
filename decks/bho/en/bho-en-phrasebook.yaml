schema: 1
id: "bho-en-phrasebook"
kind: "layer"
core: "bho-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty phrases to say whole from the first day, before their words are taught: greetings and goodbye, thanks and sorry, asking for slower speech, asking for help and where the toilet is. Not yet checked by a Bhojpuri speaker: please report any mistake."
license: "CC-BY-SA-4.0"
cards:
  "bho-0001":
    native: "hello"
    notes:
      "n1": "The usual greeting, said with the hands pressed together."
    bases:
      "प्रणाम": "hello"
  "bho-0002":
    native: "good morning"
    notes:
      "n1": "Said in the morning."
    bases:
      "सुप्रभात": "good morning"
  "bho-0003":
    native: "good evening"
    notes:
      "n1": "Said in the evening."
    bases:
      "शुभ संध्या": "good evening"
  "bho-0004":
    native: "good night"
    notes:
      "n1": "Said at bedtime."
    bases:
      "शुभ रात्रि": "good night"
  "bho-0005":
    native: "see you again"
    notes:
      "n1": "Literally 'there will be a meeting again'. Said when leaving."
    bases:
      "फेर भेंट होई": "see you again"
  "bho-0006":
    native: "please"
    notes:
      "n1": "Put before a request."
    bases:
      "कृपया": "please"
  "bho-0007":
    native: "thank you"
    notes:
      "n1": "Polite and common."
    bases:
      "धन्यवाद": "thank you"
  "bho-0008":
    native: "you're welcome; no problem"
    notes:
      "n1": "Literally 'there is no matter'. Said in reply to thanks."
    bases:
      "कवनो बात नइखे": "you're welcome; no problem"
  "bho-0009":
    native: "sorry"
    notes:
      "n1": "Said to say sorry."
    bases:
      "माफ करीं": "sorry"
  "bho-0010":
    native: "excuse me"
    notes:
      "n1": "Literally 'please listen'. Said to get someone's attention."
    bases:
      "सुनीं": "excuse me"
  "bho-0011":
    native: "I don't understand"
    notes:
      "n1": "Literally 'it does not come into my understanding'."
    bases:
      "हमरा समझ में ना आवत": "I don't understand"
  "bho-0012":
    native: "I don't know Bhojpuri"
    notes:
      "n1": "Put another language's name in place of भोजपुरी (bhojpurī)."
    bases:
      "हमरा भोजपुरी नइखे आवत": "I don't know Bhojpuri"
  "bho-0013":
    native: "please speak slowly"
    notes:
      "n1": "धीरे (dhīre) is 'slowly'."
    bases:
      "धीरे बोलीं": "please speak slowly"
  "bho-0014":
    native: "do you speak English?"
    notes:
      "n1": "Respectful."
    bases:
      "रउआ अंग्रेजी बोल सकिलें?": "do you speak English?"
  "bho-0015":
    native: "how are you?"
    notes:
      "n1": "Respectful."
    bases:
      "रउआ कइसे बानी?": "how are you?"
  "bho-0016":
    native: "I'm fine"
    notes:
      "n1": "The answer to how are you. ठीक (ṭhīk) is 'fine'."
    bases:
      "हम ठीक बानी": "I'm fine"
  "bho-0017":
    native: "what is your name?"
    notes:
      "n1": "Respectful. The answer is हमार (hamār) नाव (nāv) ... ह (ha)."
    bases:
      "रउआ के नाम का ह?": "what is your name?"
  "bho-0018":
    native: "my name is ..."
    notes:
      "n1": "Put your name where the dots are."
    bases:
      "हमार नाम ... ह": "my name is ..."
  "bho-0019":
    native: "where is the toilet?"
    notes:
      "n1": "शौचालय (śauchālay) is 'toilet'."
    bases:
      "शौचालय कहाँ बा?": "where is the toilet?"
  "bho-0020":
    native: "help!"
    notes:
      "n1": "Shouted in an emergency."
    bases:
      "बचाव!": "help!"
