schema: 1
id: "qbe-en-contractions-strong"
kind: "layer"
core: "qbe-contractions-strong"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Braille: strong contractions"
description: "The strong contractions and, for, of, the and with, which stand for whole words alone; and the strong wordsigns child, shall, this, which, out and still, whose cells are also groupsigns inside words."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "qbe-0052":
    native: "and"
    notes:
      "n1": "Dots 1-2-3-4-6: the strong contraction for the word and. It stands for the whole word alone, never inside a longer word."
    examples:
      "⠽⠑⠎ ⠯ ⠝⠕": "yes and no"
  "qbe-0053":
    native: "for"
    notes:
      "n1": "Dots 1-2-3-4-5-6: the strong contraction for the word for. It stands for the whole word alone, never inside a longer word."
    examples:
      "⠿ ⠁⠇⠇": "for all"
  "qbe-0054":
    native: "of"
    notes:
      "n1": "Dots 1-2-3-5-6: the strong contraction for the word of. It stands for the whole word alone, never inside a longer word."
    examples:
      "⠷ ⠉⠳⠗⠎⠑": "of course"
  "qbe-0055":
    native: "the"
    notes:
      "n1": "Dots 2-3-4-6: the strong contraction for the word the. It stands for the whole word alone, never inside a longer word."
    examples:
      "⠮ ⠉⠁⠞": "the cat"
  "qbe-0056":
    native: "with"
    notes:
      "n1": "Dots 2-3-4-5-6: the strong contraction for the word with. It stands for the whole word alone, never inside a longer word."
    examples:
      "⠾ ⠮⠍": "with them"
  "qbe-0057":
    native: "child; ch inside a word"
    notes:
      "n1": "Dots 1-6: the strong wordsign for child, used alone. Inside a word the same cell is the groupsign ch, as in chat."
    examples:
      "⠡⠁⠞": "chat"
  "qbe-0058":
    native: "shall; sh inside a word"
    notes:
      "n1": "Dots 1-4-6: the strong wordsign for shall, used alone. Inside a word the same cell is the groupsign sh, as in shop."
    examples:
      "⠩⠕⠏": "shop"
  "qbe-0059":
    native: "this; th inside a word"
    notes:
      "n1": "Dots 1-4-5-6: the strong wordsign for this, used alone. Inside a word the same cell is the groupsign th, as in thin."
    examples:
      "⠹⠔": "thin"
  "qbe-0060":
    native: "which; wh inside a word"
    notes:
      "n1": "Dots 1-5-6: the strong wordsign for which, used alone. Inside a word the same cell is the groupsign wh, as in wheel."
    examples:
      "⠱⠑⠑⠇": "wheel"
  "qbe-0061":
    native: "out; ou inside a word"
    notes:
      "n1": "Dots 1-2-5-6: the strong wordsign for out, used alone. Inside a word the same cell is the groupsign ou, as in our."
    examples:
      "⠳⠗": "our"
  "qbe-0062":
    native: "still; st inside a word"
    notes:
      "n1": "Dots 3-4: the strong wordsign for still, used alone. Inside a word the same cell is the groupsign st, as in stop."
    examples:
      "⠌⠕⠏": "stop"
