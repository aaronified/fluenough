schema: 1
id: "qbe-en-punctuation"
kind: "layer"
core: "qbe-punctuation"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Braille: punctuation"
description: "The common punctuation of uncontracted braille: full stop, comma, question and exclamation marks, apostrophe, hyphen, quotation marks and brackets. Some of the lower cells are also contractions: dis, ea, his, ff and was."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "qbe-0043":
    native: "full stop (period); dis at the start of a word"
    notes:
      "n1": "Dots 2-5-6: ⠙ (d) moved down a row. Punctuation sits low in the cell, where no letter does. In a number it is the decimal point: ⠼⠉⠲⠑ is 3.5. At the start of a word it is the lower groupsign dis, as in dismiss."
    examples:
      "⠠⠛⠕⠲": "Go."
      "⠲⠍⠊⠎⠎": "dismiss"
  "qbe-0044":
    native: "comma; ea inside a word"
    notes:
      "n1": "Dot 2: ⠁ (a) moved down a row. In a number it groups the thousands: ⠼⠁⠂⠚⠚⠚ is 1,000. Inside a word it is the lower groupsign ea, as in beat, but never at the start or the end of a word, as in sea."
    examples:
      "⠽⠑⠎⠂ ⠎⠊⠗": "yes, sir"
      "⠃⠂⠞": "beat"
  "qbe-0045":
    native: "question mark ?, or an opening quotation mark “; his alone"
    notes:
      "n1": "Dots 2-3-6: ⠓ (h) moved down a row. The same cell opens a quotation and ends a question: where it stands tells which. Standing alone as a word, it is also the lower wordsign his."
    examples:
      "⠠⠺⠓⠕⠦": "Who?"
      "⠦⠓⠊⠴": "“hi”"
  "qbe-0046":
    native: "exclamation mark !; ff inside a word"
    notes:
      "n1": "Dots 2-3-5: ⠋ (f) moved down a row. Inside a word it is the lower groupsign ff, as in coffee, never at its start or end. UEB has no contraction for the word to: it is spelled ⠞ (t) ⠕ (o)."
    examples:
      "⠠⠓⠊⠖": "Hi!"
      "⠉⠕⠖⠑⠑": "coffee"
  "qbe-0047":
    native: "apostrophe '"
    notes:
      "n1": "Dot 3 alone, low in the cell."
    examples:
      "⠊⠞⠄⠎": "it's"
      "⠙⠕⠝⠄⠞": "don't"
  "qbe-0048":
    native: "hyphen -"
    notes:
      "n1": "Dots 3-6: the bottom row."
    examples:
      "⠑⠤⠍⠁⠊⠇": "e-mail"
  "qbe-0049":
    native: "closing quotation mark ”; was as a word"
    notes:
      "n1": "Dots 3-5-6: the opening mark, ⠦, mirrored, so a quotation opens and closes like a pair of brackets. As a whole word it is also the lower wordsign was. UEB has no contraction for by: it is spelled ⠃ (b) ⠽ (y)."
    examples:
      "⠦⠓⠊⠴": "“hi”"
  "qbe-0050":
    native: "opening bracket (parenthesis) ("
    notes:
      "n1": "Two cells: dot 5, then dots 1-2-6. The ⠐ in front says the cell after it is a sign, not a letter."
    examples:
      "⠐⠣⠁⠐⠜": "(a)"
  "qbe-0051":
    native: "closing bracket (parenthesis) )"
    notes:
      "n1": "Two cells: dot 5, then dots 3-4-5, the opening bracket's ⠣ mirrored, as the brackets mirror each other in print."
    examples:
      "⠐⠣⠁⠐⠜": "(a)"
