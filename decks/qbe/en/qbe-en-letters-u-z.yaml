schema: 1
id: "qbe-en-letters-u-z"
kind: "layer"
core: "qbe-letters-u-z"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Braille: u to z"
description: "The letters u, v, x, y and z, a to e with dots 3 and 6; and w, added later, which breaks the pattern. Standing alone, u, v, w, x, y and z are also the wordsigns us, very, will, it, you and as."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "qbe-0021":
    native: "u; alone: us"
    notes:
      "n1": "Dots 1-3-6: ⠁ (a) with dots 3 and 6, or ⠅ (k) with dot 6. From u, the letters a to e come round a third time, with dots 3 and 6: u, v, x, y, z. w is not among them. Standing alone as a word, it is also the alphabetic wordsign for us."
  "qbe-0022":
    native: "v; alone: very"
    notes:
      "n1": "Dots 1-2-3-6: ⠃ (b) with dots 3 and 6, or ⠇ (l) with dot 6. Standing alone as a word, it is also the alphabetic wordsign for very."
  "qbe-0023":
    native: "x; alone: it"
    notes:
      "n1": "Dots 1-3-4-6: ⠉ (c) with dots 3 and 6, or ⠍ (m) with dot 6. Standing alone as a word, it is also the alphabetic wordsign for it."
  "qbe-0024":
    native: "y; alone: you"
    notes:
      "n1": "Dots 1-3-4-5-6: ⠙ (d) with dots 3 and 6, or ⠝ (n) with dot 6. Standing alone as a word, it is also the alphabetic wordsign for you."
  "qbe-0025":
    native: "z; alone: as"
    notes:
      "n1": "Dots 1-3-5-6: ⠑ (e) with dots 3 and 6, or ⠕ (o) with dot 6. Standing alone as a word, it is also the alphabetic wordsign for as."
  "qbe-0026":
    native: "w; alone: will"
    notes:
      "n1": "Dots 2-4-5-6: ⠚ (j) with dot 6. Louis Braille made the alphabet for French, which then had no w, so w was added later and breaks the pattern: x, y and z follow v. Standing alone as a word, it is also the alphabetic wordsign for will."
