schema: 1
id: "qbe-en-letters-a-j"
kind: "layer"
core: "qbe-letters-a-j"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Braille: a to j"
description: "The first ten letters, a to j, made from the top four dots of the cell: the pattern every other letter repeats. Standing alone, b, c, d, e, f, g, h and j are also the wordsigns but, can, do, every, from, go, have and just."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "qbe-0001":
    native: "a"
    notes:
      "n1": "Dot 1. The first letter, and the cell the whole top row is built from."
  "qbe-0002":
    native: "b; alone: but"
    notes:
      "n1": "Dots 1-2. ⠁ (a) with dot 2 below it: a short line down the left. Standing alone as a word, it is also the alphabetic wordsign for but."
  "qbe-0003":
    native: "c; alone: can"
    notes:
      "n1": "Dots 1-4. ⠁ (a) with dot 4 beside it: a short line across the top. Standing alone as a word, it is also the alphabetic wordsign for can."
  "qbe-0004":
    native: "d; alone: do"
    notes:
      "n1": "Dots 1-4-5. ⠉ (c) with dot 5 under dot 4. Its mirror image is ⠋ (f). Standing alone as a word, it is also the alphabetic wordsign for do."
  "qbe-0005":
    native: "e; alone: every"
    notes:
      "n1": "Dots 1-5. ⠁ (a) with dot 5: a slant down to the right. Its mirror image is ⠊ (i). Standing alone as a word, it is also the alphabetic wordsign for every."
  "qbe-0006":
    native: "f; alone: from"
    notes:
      "n1": "Dots 1-2-4. ⠃ (b) with dot 4. Its mirror image is ⠙ (d). Standing alone as a word, it is also the alphabetic wordsign for from."
  "qbe-0007":
    native: "g; alone: go"
    notes:
      "n1": "Dots 1-2-4-5. All four dots of the top two rows: a square. Standing alone as a word, it is also the alphabetic wordsign for go."
  "qbe-0008":
    native: "h; alone: have"
    notes:
      "n1": "Dots 1-2-5. ⠃ (b) with dot 5. Its mirror image is ⠚ (j). Standing alone as a word, it is also the alphabetic wordsign for have."
  "qbe-0009":
    native: "i"
    notes:
      "n1": "Dots 2-4. A slant up to the right: ⠑ (e) mirrored. Like ⠚ (j), it has no dot 1."
  "qbe-0010":
    native: "j; alone: just"
    notes:
      "n1": "Dots 2-4-5. ⠊ (i) with dot 5, and ⠓ (h) mirrored. The last letter of the top row: after it the pattern starts again, with dot 3 added. Standing alone as a word, it is also the alphabetic wordsign for just."
