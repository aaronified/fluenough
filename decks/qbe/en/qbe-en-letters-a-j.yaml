tags: ["beginner", "unreviewed", "script"]
cards:
  "qbe-0001":
    native: "a"
    notes:
      "n1": "Dot 1. The first letter, and the cell the whole top row is built from."
  "qbe-0002":
    native: "b"
    notes:
      "n1": "Dots 1-2. ⠁ (a) with dot 2 below it: a short line down the left."
  "qbe-0003":
    native: "c"
    notes:
      "n1": "Dots 1-4. ⠁ (a) with dot 4 beside it: a short line across the top."
  "qbe-0004":
    native: "d"
    notes:
      "n1": "Dots 1-4-5. ⠉ (c) with dot 5 under dot 4. Its mirror image is ⠋ (f)."
  "qbe-0005":
    native: "e"
    notes:
      "n1": "Dots 1-5. ⠁ (a) with dot 5: a slant down to the right. Its mirror image is ⠊ (i)."
  "qbe-0006":
    native: "f"
    notes:
      "n1": "Dots 1-2-4. ⠃ (b) with dot 4. Its mirror image is ⠙ (d)."
  "qbe-0007":
    native: "g"
    notes:
      "n1": "Dots 1-2-4-5. All four dots of the top two rows: a square."
  "qbe-0008":
    native: "h"
    notes:
      "n1": "Dots 1-2-5. ⠃ (b) with dot 5. Its mirror image is ⠚ (j)."
  "qbe-0009":
    native: "i"
    notes:
      "n1": "Dots 2-4. A slant up to the right: ⠑ (e) mirrored. Like ⠚ (j), it has no dot 1."
  "qbe-0010":
    native: "j"
    notes:
      "n1": "Dots 2-4-5. ⠊ (i) with dot 5, and ⠓ (h) mirrored. The last letter of the top row: after it the pattern starts again, with dot 3 added."
