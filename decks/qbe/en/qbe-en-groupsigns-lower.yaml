kind: "layer"
core: "qbe-groupsigns-lower"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Braille: lower groupsigns"
description: "The lower groupsigns bb, cc, en, gg and in, which use the lower dots, and the lower wordsigns be, enough, were and in that share their cells."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "qbe-0069":
    native: "bb inside a word; be alone"
    notes:
      "n1": "Dots 2-3: the lower groupsign bb, used inside a word, as in rubber. Alone, the same cell is the lower wordsign be."
    examples:
      "⠗⠥⠆⠑⠗": "rubber"
  "qbe-0070":
    native: "cc"
    notes:
      "n1": "Dots 2-5: the lower groupsign cc, used inside a word, as in occur."
    examples:
      "⠕⠒⠥⠗": "occur"
  "qbe-0071":
    native: "en inside a word; enough alone"
    notes:
      "n1": "Dots 2-6: the lower groupsign en, used inside a word, as in ten. Alone, the same cell is the lower wordsign enough."
    examples:
      "⠞⠢": "ten"
  "qbe-0072":
    native: "gg inside a word; were alone"
    notes:
      "n1": "Dots 2-3-5-6: the lower groupsign gg, used inside a word, as in eggs. Alone, the same cell is the lower wordsign were."
    examples:
      "⠑⠶⠎": "eggs"
  "qbe-0073":
    native: "in"
    notes:
      "n1": "Dots 3-5: the lower groupsign in, used inside a word, as in pin. Alone, the same cell is the lower wordsign in."
    examples:
      "⠏⠔": "pin"
