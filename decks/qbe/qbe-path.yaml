# The order English Braille is taught in: Unified English Braille,
# uncontracted (grade 1), one unit per deck (ADR-0043). First the ten
# letters of the top row, a to j; then k to t, which add dot 3; then u to
# z, which add dots 3 and 6, and w; then the capital indicators, the
# numbers, which are a to j after the numeric indicator, and the
# punctuation.
#
# Then the contractions of grade 2 (Unified English Braille), as units after
# the punctuation, one group at a time: the strong contractions and the
# strong and lower groupsigns, shared where a cell is both a wordsign and a
# groupsign (ADR-0043, owner, 2026-10-20: "Uncontracted now, contractions
# later"). Braille is taught to no level, so the path has no B1 plan.
#
# Every qbe deck is listed, by its core id, exactly once. See ADR-0013 and
# docs/DECK-FORMAT.md.
schema: 1
kind: "path"
id: "qbe-path"
language: "qbe"
# No theme decks here, so no unit but the last can end in "*": a deck a
# learner adds goes in the last unit.
units:
  - ["qbe-letters-a-j"]
  - ["qbe-letters-k-t"]
  - ["qbe-letters-u-z"]
  - ["qbe-capitals"]
  - ["qbe-digits"]
  - ["qbe-punctuation"]
  - ["qbe-contractions-strong"]
  - ["qbe-groupsigns-strong"]
  - ["qbe-groupsigns-lower"]
  - ["*"]
