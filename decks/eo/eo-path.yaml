# The order Esperanto is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner
# from English is taught eo-en-home for eo-home (ADR-0013, ADR-0036).
#
# This is also Esperanto's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"):
# every unit from the first words to B1, with its size in words, its
# grammar topics, the three milestones, and for each planned unit its
# listening and reading passages. No Esperanto deck is written yet, so
# every unit is planned: the course teaches each as "Coming" until its deck
# is written. Sizes follow the plan's levels (about 700, 900 and 1,200
# words; low confidence) and are one number for every native language.
# Esperanto is tier I in docs/plans/language-paths-scheme.md (x1.0, among
# the easiest; tier inferred, not on the FSI list), so the sizes are kept
# as they are. A unit's words are its roots: a word the learner builds
# from a known root by a rule (malbona from bona, lernejo from lerni) is
# practised in that rule's table and counts no word. A theme named here
# that decks/themes.yaml does not list yet is added to it with its first
# deck.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"):
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units, the sounds unit first;
# 3. no script units: Esperanto is written in Latin letters. Its six
#    letters with marks, ĉ ĝ ĥ ĵ ŝ and ŭ, and the x-system and h-system
#    used to type them without the marks (cx, gx; ch, gh), are taught in
#    the script guide (eo-script.yaml) and the sounds unit, not in
#    alphabet decks, so the path has no `alphabet`;
# 4. a core of about 200 common words in themed units, before the large
#    tables ("Yes, smaller (~200)");
# 5. rules as forms, practised on the words already known: the word-class
#    endings, the article and the plural, the present, the accusative,
#    then the first affixes;
# 6. sentences, each after its words and rules; then the other themes,
#    each its words, then its rules, then its sentences.
#
# Esperanto's grammar keeps the order of docs/plans/language-paths-scheme.md
# (2.15, Constructed: Esperanto): alphabet, phonetic spelling and fixed
# penultimate stress, greetings, numbers, pronouns, the word-class endings
# (-o noun, -a adjective, -e adverb, -i infinitive), the plural -j, the
# accusative -n, the tenses -as, -is and -os, the correlatives table, the
# affixes, the conditional -us and the volitive -u, the participles, then
# word building. Its spine is the regular affix system: each affix is a
# rule whose table is filled from the roots the learner knows, mal- over
# known adjectives and verbs, -in- over known people words, -ej- over known
# verbs, and so on, so word building is taught as rules over known roots
# from A1 to B1. The correlatives table comes in two halves: ki- and ti-
# in A1, i-, ĉi- and neni- in A2.
#
# Where the Fundamento's 16 rules are taught (each a grammar topic below):
#  1 the article la: article-plural (A1)
#  2 nouns in -o, plural -j, accusative -n: article-plural, accusative (A1)
#  3 adjectives in -a, agreement, comparison: word-endings, article-plural
#    (A1), comparison (A2)
#  4 numbers, ordinals and the number suffixes: numbers (A1), affixes-number
#    (A2)
#  5 personal pronouns and possessives in -a: pronouns theme, possessives
#    (A1)
#  6 the verb endings -as -is -os -us -u -i and the participles: present,
#    past-future (A1), volitive, conditional (A2), the participle units (B1)
#  7 adverbs in -e: word-endings (A1)
#  8 prepositions take the nominative: prepositions (A1)
#  9 every word is read as written: sound-differences (A1)
# 10 stress on the next-to-last syllable: sound-differences (A1)
# 11 compound words: word-building (B1)
# 12 one negative in a clause: negation-questions (A1)
# 13 the accusative of direction: direction-accusative (A2)
# 14 the preposition je: je-elision (B1)
# 15 foreign words take Esperanto spelling and endings: foreign-words (B1)
# 16 the elided -a of la and -o of nouns: je-elision (B1)
#
# Esperanto has no grammatical gender, so `genders` is empty. Feminine
# -in- (patro, patrino) and ge- (gepatroj) are affixes of word building,
# taught as rules, not gender classes.
#
# Esperanto has no regional dialects: one standard, from the Fundamento
# (1905), spoken the same way by speakers in every country. What differs
# between speakers is the accent of their first language, not the region
# they live in, so a region question ("Where you speak Esperanto") would
# not group raters by anything their answers share. The path lists no
# `regions`, and the app asks no region question. To confirm with the
# owner (#388).
#
# The core's order is by judgement, most common first: about me, everyday
# verbs, the common adverbs and function words, how much and how many,
# describing words, where things are, more verbs. It was meant to come from
# Wikipedia's counts (tools/wikipedia_frequency.py, #516); no Esperanto
# Wikipedia dump was fetched here (2026-10-18): order the core again from
# the counts once they are written.
#
# A planned unit holds one core id. Where a written unit will hold more
# than one deck, as Telugu's do, the others are named in a comment over
# the unit they join; a theme's sentence deck, eo-<theme>-sentences, joins
# its theme's unit once written.
#
# Every deck of Esperanto is listed exactly once.
schema: 1
kind: "path"
id: "eo-path"
language: "eo"
# The gender classes a noun's gender is one of (#512; DECK-FORMAT.md, Card
# data): none, since Esperanto nouns have no grammatical gender.
genders: []
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  # 1. The phrasebook, taught whole from the first lesson.
  # eo-first-words joins it when written.
  - planned: { id: "eo-phrasebook", theme: "first-words", words: 10 }
    listening_passages:
      - { id: "first-saluton", text: { "en": "Saluton, dankon and ĝis: greeting someone at a club meeting and leaving" } }
    reading_passages:
      - { id: "door-signs", text: { "en": "Signs on doors: open, closed, push, pull, welcome" } }
  # 2. The first word units. The sounds first: ĉ ĝ ĥ ĵ ŝ ŭ, c said ts and
  # j said y, the tapped or rolled r, the five pure vowels, every letter
  # read as written (rule 9) and the stress always on the next-to-last
  # syllable (rule 10).
  - planned: { id: "eo-sound-differences", grammar: ["sound-differences", "penultimate-stress"], words: 12 }
    listening_passages:
      - { id: "sounds-alike", text: { "en": "Pairs said one after the other: ĉu and ŝu, ĝi and ĵi, haro and ĥoro" } }
    reading_passages:
      - { id: "six-letters", text: { "en": "A short list of everyday words spelled with ĉ, ĝ, ĥ, ĵ, ŝ and ŭ, and the same words typed in the x-system" } }
  - planned: { id: "eo-questions", theme: "questions", words: 15 }
    listening_passages:
      - { id: "asking-around", text: { "en": "Asking who, what, where and when at a station" } }
    reading_passages:
      - { id: "tourist-leaflet", text: { "en": "A leaflet answering the questions a visitor asks" } }
  - planned: { id: "eo-addressing", theme: "addressing", words: 15 }
    listening_passages:
      - { id: "meeting-a-neighbour", text: { "en": "Greeting a neighbour and an older stranger with vi, sinjoro and sinjorino" } }
    reading_passages:
      - { id: "name-badges", text: { "en": "Name badges at a meeting, with first names and countries" } }
  - planned: { id: "eo-pronouns", theme: "pronouns", words: 20 }
    listening_passages:
      - { id: "who-is-who", text: { "en": "Pointing out who is who at a family gathering: li, ŝi, ili" } }
    reading_passages:
      - { id: "seating-chart", text: { "en": "A seating chart for a party, with names and who sits where" } }
  # The family's roots: patro, frato, filo, avo. The female words (patrino,
  # fratino) are built by -in- in A1's rules, and counted there as forms.
  - planned: { id: "eo-family", theme: "family", words: 30 }
    listening_passages:
      - { id: "my-family", text: { "en": "Someone describes the people in a family photo" } }
    reading_passages:
      - { id: "family-tree", text: { "en": "A small family tree with names and relations" } }
  # Ten roots and nul, then numbers built from them: dek unu, dudek.
  - planned: { id: "eo-numbers-1-20", theme: "numbers-1-20", words: 15 }
    listening_passages:
      - { id: "counting-aloud", text: { "en": "Counting objects aloud, from one to twenty" } }
    reading_passages:
      - { id: "room-numbers", text: { "en": "Room numbers on a row of doors" } }
  # 3. No script units: Esperanto is written in Latin letters.
  # 4. The core: about 200 common words, most common first (by judgement
  # until the Wikipedia counts are written, #516).
  - planned: { id: "eo-about-me", theme: "about-me", words: 25 }
    listening_passages:
      - { id: "introducing-yourself", text: { "en": "Introducing yourself to a new member of a language club" } }
    reading_passages:
      - { id: "registration-form", text: { "en": "A simple registration form: name, age, country, languages" } }
  - planned: { id: "eo-everyday-verbs", theme: "everyday-verbs", words: 40 }
    listening_passages:
      - { id: "morning-routine", text: { "en": "A mother says what each person in the house does in the morning" } }
    reading_passages:
      - { id: "fridge-note", text: { "en": "A note on the fridge: what to eat, what to drink and where things are" } }
  - planned: { id: "eo-adverbs", theme: "adverbs", words: 30 }
    listening_passages:
      - { id: "how-often", text: { "en": "Saying how often and how well things are done: jam, ankoraŭ, ofte, tre" } }
    reading_passages:
      - { id: "habit-survey", text: { "en": "A short survey about everyday habits" } }
  - planned: { id: "eo-quantities", theme: "quantities", words: 25 }
    listening_passages:
      - { id: "at-the-grocers", text: { "en": "Asking how much and how many at a grocer's" } }
    reading_passages:
      - { id: "recipe-amounts", text: { "en": "A recipe card with amounts" } }
  - planned: { id: "eo-describing", theme: "describing", words: 35 }
    listening_passages:
      - { id: "how-are-you-feeling", text: { "en": "A friend asks how you feel today, and you answer" } }
    reading_passages:
      - { id: "postcard-from-the-coast", text: { "en": "A short postcard: the weather and the food" } }
  - planned: { id: "eo-location", theme: "location", words: 15 }
    listening_passages:
      - { id: "where-are-my-keys", text: { "en": "Looking for keys: here, there, in, on, under, beside" } }
    reading_passages:
      - { id: "room-description", text: { "en": "A short description of a room and where its furniture is" } }
  - planned: { id: "eo-more-verbs", theme: "more-verbs", words: 25 }
    listening_passages:
      - { id: "after-work", text: { "en": "Two friends say what they do after work" } }
    reading_passages:
      - { id: "weekly-plan", text: { "en": "A weekly plan for a household: who goes where and does what" } }
  # 5. Rules as forms, practised on the words known: the word-class
  # endings over every known root, the article and the plural, the
  # present, negation and questions, the accusative, the possessives,
  # then the first affixes.
  - planned: { id: "eo-grammar-word-endings", grammar: ["noun-o", "adjective-a", "adverb-e", "infinitive-i"] }
    listening_passages:
      - { id: "one-root-four-words", text: { "en": "A teacher turns one root into a noun, an adjective, an adverb and a verb: bel-o, bel-a, bel-e, bel-i" } }
    reading_passages:
      - { id: "word-family-chart", text: { "en": "A chart of known roots, each with its -o, -a, -e and -i word" } }
  - planned: { id: "eo-grammar-article-plural", grammar: ["article-la", "plural-j", "adjective-agreement"] }
    listening_passages:
      - { id: "the-red-apples", text: { "en": "A child counts the apples on a table: la ruĝa pomo, la ruĝaj pomoj" } }
    reading_passages:
      - { id: "fruit-labels", text: { "en": "Labels on boxes of fruit, one and many" } }
  - planned: { id: "eo-grammar-present", grammar: ["present-as", "esti"] }
    listening_passages:
      - { id: "what-we-do-now", text: { "en": "Friends say what they do and where they are now, every verb in -as" } }
    reading_passages:
      - { id: "status-messages", text: { "en": "Short status messages: who is where, doing what" } }
  # Rule 12: one negative in a clause.
  - planned: { id: "eo-grammar-negation-questions", grammar: ["negation-ne", "chu-questions"] }
    listening_passages:
      - { id: "yes-or-no", text: { "en": "Asking ĉu questions and answering jes and ne" } }
    reading_passages:
      - { id: "quiz-card", text: { "en": "A short yes-or-no quiz on a café table" } }
  - planned: { id: "eo-grammar-accusative", grammar: ["accusative-n"] }
    listening_passages:
      - { id: "who-sees-whom", text: { "en": "Saying who sees, eats and buys what, where the -n shows the object" } }
    reading_passages:
      - { id: "word-order-notes", text: { "en": "The same short sentences in three word orders, all meaning the same" } }
  - planned: { id: "eo-grammar-possessives", grammar: ["possessive-a"] }
    listening_passages:
      - { id: "whose-is-it", text: { "en": "Sorting out whose bag, whose book and whose keys are on a table" } }
    reading_passages:
      - { id: "lost-property-tags", text: { "en": "Name tags on lost things: mia, via, lia, ŝia" } }
  # The first affixes, each a table over the roots known: mal- over
  # adjectives and verbs (bona, malbona; fermi, malfermi), -in- over people
  # words (patro, patrino).
  - planned: { id: "eo-grammar-affixes-mal-in", grammar: ["prefix-mal", "suffix-in"] }
    listening_passages:
      - { id: "opposites-game", text: { "en": "A game of opposites: one player says a word, the other adds mal-" } }
    reading_passages:
      - { id: "opposites-chart", text: { "en": "A chart of known words and their mal- opposites, and family words with -in-" } }
  # 6. Then the other A1 themes, each its words, its rules, then its
  # sentences.
  - planned: { id: "eo-work", theme: "work", words: 35 }
    listening_passages:
      - { id: "what-do-you-do", text: { "en": "Two people ask each other what they do for a living" } }
    reading_passages:
      - { id: "business-card", text: { "en": "A business card and a short job description" } }
  # Few roots (cent, mil, miliono); the rest is built: dudek, tricent.
  - planned: { id: "eo-numbers-big", theme: "numbers-big", words: 20 }
    listening_passages:
      - { id: "big-numbers", text: { "en": "Hearing prices, years and phone numbers" } }
    reading_passages:
      - { id: "price-tags", text: { "en": "Price tags and a bus-route number board" } }
  - planned: { id: "eo-grammar-numbers", grammar: ["number-compounds", "ordinal-a"] }
    listening_passages:
      - { id: "first-second-third", text: { "en": "A race is announced: who came first, second and third" } }
    reading_passages:
      - { id: "floor-guide", text: { "en": "A floor guide in a building: the first floor, the second floor" } }
  - planned: { id: "eo-market", theme: "market", words: 40 }
    listening_passages:
      - { id: "at-the-market", text: { "en": "Buying fruit and vegetables at a market stall" } }
    reading_passages:
      - { id: "market-price-board", text: { "en": "A price board at a market" } }
  - planned: { id: "eo-groceries", theme: "groceries", words: 40 }
    listening_passages:
      - { id: "shopping-list-aloud", text: { "en": "Two people go through a shopping list" } }
    reading_passages:
      - { id: "shopping-list", text: { "en": "A handwritten shopping list" } }
  - planned: { id: "eo-food", theme: "food", words: 55 }
    listening_passages:
      - { id: "ordering-a-meal", text: { "en": "Choosing dishes from a menu" } }
    reading_passages:
      - { id: "menu-card", text: { "en": "A restaurant menu card with dishes and prices" } }
  # The two other tenses, as regular as the present: -is and -os.
  - planned: { id: "eo-grammar-past-future", grammar: ["past-is", "future-os"] }
    listening_passages:
      - { id: "yesterday-and-tomorrow", text: { "en": "Saying what you did yesterday and what you will do tomorrow" } }
    reading_passages:
      - { id: "diary-and-plan", text: { "en": "A diary line for yesterday and a plan for tomorrow" } }
  - planned: { id: "eo-transport", theme: "transport", words: 35 }
    listening_passages:
      - { id: "bus-stop", text: { "en": "Asking which bus goes to the centre" } }
    reading_passages:
      - { id: "timetable", text: { "en": "A bus and tram timetable" } }
  - planned: { id: "eo-directions", theme: "directions", words: 30 }
    listening_passages:
      - { id: "asking-the-way", text: { "en": "Asking the way to the station and being told" } }
    reading_passages:
      - { id: "simple-map", text: { "en": "A simple map with a route in words" } }
  # Rule 8: a preposition takes the nominative.
  - planned: { id: "eo-grammar-prepositions", grammar: ["prepositions"] }
    listening_passages:
      - { id: "where-it-is", text: { "en": "Saying where things are: en, sur, sub, apud, antaŭ, malantaŭ" } }
    reading_passages:
      - { id: "museum-plan", text: { "en": "A museum plan: what is beside, above and behind what" } }
  - planned: { id: "eo-body", theme: "body", words: 30 }
    listening_passages:
      - { id: "at-the-doctors", text: { "en": "Telling a doctor where it hurts" } }
    reading_passages:
      - { id: "stretching-chart", text: { "en": "A chart of simple morning stretches" } }
  - planned: { id: "eo-places", theme: "places", words: 40 }
    listening_passages:
      - { id: "walk-to-the-market", text: { "en": "A neighbour names the places you pass on the way to the market" } }
    reading_passages:
      - { id: "street-signs", text: { "en": "Signs along a street: pharmacy, school, bank, post office" } }
  # The correlatives' first half: the ki- (what, which, where) and ti-
  # (that, there, then) columns, each row of the table a rule cell.
  - planned: { id: "eo-grammar-correlatives-ki-ti", grammar: ["correlatives-ki", "correlatives-ti"] }
    listening_passages:
      - { id: "kie-tie", text: { "en": "Questions with kio, kie, kiam and kiu answered with tio, tie, tiam and tiu" } }
    reading_passages:
      - { id: "correlatives-half-table", text: { "en": "The ki- and ti- columns of the correlatives table, with an example for each" } }
  - planned: { id: "eo-home", theme: "home", words: 40 }
    listening_passages:
      - { id: "a-flat-tour", text: { "en": "A tour of a flat, room by room" } }
    reading_passages:
      - { id: "flat-advert", text: { "en": "A short advert for a flat to rent" } }
  # -et- and -eg- over known nouns and adjectives: domo, dometo, domego.
  - planned: { id: "eo-grammar-affixes-et-eg", grammar: ["suffix-et", "suffix-eg"] }
    listening_passages:
      - { id: "little-and-huge", text: { "en": "A child describes a tiny house and a huge dog: dometo, hundego" } }
    reading_passages:
      - { id: "toy-shop-sign", text: { "en": "A toy shop's sign: small, smaller and giant things" } }
  - planned: { id: "eo-time", theme: "time", words: 30 }
    listening_passages:
      - { id: "what-time-is-it", text: { "en": "Asking and telling the time" } }
    reading_passages:
      - { id: "opening-hours", text: { "en": "The opening hours on a shop door" } }
  # povi, voli and devi with an infinitive.
  - planned: { id: "eo-grammar-modal-verbs", grammar: ["modal-infinitive"] }
    listening_passages:
      - { id: "can-want-must", text: { "en": "Saying what you can, want and must do this weekend" } }
    reading_passages:
      - { id: "invitation-note", text: { "en": "A note inviting a friend, with what each can bring" } }
  - planned: { id: "eo-help", theme: "help", words: 20 }
    listening_passages:
      - { id: "lost-in-the-city", text: { "en": "Asking for help when lost" } }
    reading_passages:
      - { id: "emergency-numbers", text: { "en": "A card of emergency numbers and what to say" } }
    milestone: "A1"
  # A2: the themes and grammar of the CEFR's A2, each its words, its rules,
  # then its sentences.
  - planned: { id: "eo-daily-life", theme: "daily-life", words: 45 }
    listening_passages:
      - { id: "a-normal-day", text: { "en": "Someone talks through an ordinary day" } }
    reading_passages:
      - { id: "daily-timetable", text: { "en": "A timetable for a day: wake, work, eat, sleep" } }
  # The volitive -u: commands, wishes and ke with -u.
  - planned: { id: "eo-grammar-volitive", grammar: ["volitive-u"] }
    listening_passages:
      - { id: "class-instructions", text: { "en": "A teacher gives short instructions in class: sidu, aŭskultu, skribu" } }
    reading_passages:
      - { id: "signs-and-rules", text: { "en": "Signs saying what to do and what not to do" } }
  - planned: { id: "eo-calendar", theme: "calendar", words: 35 }
    listening_passages:
      - { id: "making-a-date", text: { "en": "Fixing a day and a time with a friend" } }
    reading_passages:
      - { id: "wall-calendar", text: { "en": "A wall calendar with appointments" } }
  # The correlatives' other three columns: i- (some), ĉi- (every) and
  # neni- (no), completing the table.
  - planned: { id: "eo-grammar-correlatives-full", grammar: ["correlatives-i", "correlatives-chi", "correlatives-neni"] }
    listening_passages:
      - { id: "someone-everyone-no-one", text: { "en": "Looking for a lost cat: iu saw it somewhere, nobody saw it, everyone looked everywhere" } }
    reading_passages:
      - { id: "correlatives-table", text: { "en": "The whole correlatives table, five columns by nine rows" } }
  - planned: { id: "eo-clothes", theme: "clothes", words: 40 }
    listening_passages:
      - { id: "choosing-a-shirt", text: { "en": "Choosing a colour and a size in a clothes shop" } }
    reading_passages:
      - { id: "shop-offer-sign", text: { "en": "A clothes shop's sign with its offers" } }
  # Places and people from known roots: lerni, lernejo; vendi, vendisto;
  # juna, junulo; Kanado, kanadano.
  - planned: { id: "eo-grammar-affixes-place-person", grammar: ["suffix-ej", "suffix-ist", "suffix-ul", "suffix-an"] }
    listening_passages:
      - { id: "who-works-where", text: { "en": "Children guess who works where: the baker in the bakery, the teacher in the school" } }
    reading_passages:
      - { id: "town-directory", text: { "en": "A small town directory of shops, workplaces and the people in them" } }
  - planned: { id: "eo-animals", theme: "animals", words: 35 }
    listening_passages:
      - { id: "a-farm-visit", text: { "en": "A child names the animals seen on a visit to a farm" } }
    reading_passages:
      - { id: "zoo-board", text: { "en": "A zoo board with each animal and what it eats" } }
