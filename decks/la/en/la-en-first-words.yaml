"schema": 1
"id": "la-en-first-words"
"kind": "layer"
"core": "la-first-words"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "First words"
"description": "Ten words to start with: yes and no, I and you, water, good, one, two, here and and. Classical Latin, with macrons in the reading column marking long vowels. Not yet checked by a Latinist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "la-0001":
    "native": "Yes indeed."
    "notes":
      "n1": "Ita is yes, the usual answer in Latin texts. The no is non, on the next card."
    "examples":
      "Ita, ego intellego.":
        "native": "Yes, I understand."
        "bases":
          "Ita": "yes"
          "ego": "I"
          "intellego": "to understand (I understand)"
      "Ita vero.":
        "native": "Yes indeed."
        "bases":
          "Ita": "yes"
          "vero": "indeed"
  "la-0002":
    "native": "It is not good."
    "notes":
      "n1": "Non is the usual negative in Latin statements, and the answer no. The word for not before a verb is also non."
    "examples":
      "Non intellego.":
        "native": "I do not understand."
        "bases":
          "Non": "not"
          "intellego": "to understand (I understand)"
      "Non est bonus.":
        "native": "It is not good."
        "bases":
          "Non": "not"
          "est": "to be (is)"
          "bonus": "good"
  "la-0003":
    "native": "I drink water."
    "notes":
      "n1": "Ego is I. The verb ending already says I (intellego, I understand), so ego is used for emphasis or contrast."
    "examples":
      "Ego sum discipulus.":
        "native": "I am a student."
        "bases":
          "Ego": "I"
          "sum": "to be (am)"
          "discipulus": "student"
      "Ego aquam bibo.":
        "native": "I drink water."
        "bases":
          "Ego": "I"
          "aquam": "water"
          "bibo": "to drink (I drink)"
  "la-0004":
    "native": "What are you doing? How are you?"
    "notes":
      "n1": "Tu is you to one person. To more than one person, the form is vos."
    "examples":
      "Tu es bonus.":
        "native": "You are good."
        "bases":
          "Tu": "you"
          "es": "to be (are)"
          "bonus": "good"
      "Tu quid agis?":
        "native": "What are you doing? How are you?"
        "bases":
          "Tu": "you"
          "quid": "what"
          "agis": "to do (you do)"
  "la-0005":
    "native": "Give me water."
    "notes":
      "n1": "Aqua is water, a feminine noun. Its object form, as in I drink water, is aquam."
    "examples":
      "Aqua est frigida.":
        "native": "The water is cold."
        "bases":
          "Aqua": "water"
          "est": "to be (is)"
          "frigida": "cold"
      "Da mihi aquam.":
        "native": "Give me water."
        "bases":
          "Da": "to give (give!)"
          "mihi": "to me"
          "aquam": "water"
  "la-0006":
    "native": "The water is good."
    "notes":
      "n1": "Bonus is the masculine form of good. It agrees with its noun: bona aqua, good water; bonum, good (neuter)."
    "examples":
      "Bonus homo.":
        "native": "A good man."
        "bases":
          "Bonus": "good"
          "homo": "man; person"
      "Aqua bona est.":
        "native": "The water is good."
        "bases":
          "Aqua": "water"
          "bona": "good"
          "est": "to be (is)"
  "la-0007":
    "native": "There is one book."
    "notes":
      "n1": "Unus is one. Duo is two, on the next card."
    "examples":
      "Unus, duo, tres.":
        "native": "One, two, three."
        "bases":
          "Unus": "one"
          "duo": "two"
          "tres": "three"
      "Unus liber est.":
        "native": "There is one book."
        "bases":
          "Unus": "one"
          "liber": "book"
          "est": "to be (is)"
  "la-0008":
    "native": "There are two friends."
    "notes":
      "n1": "Duo is two for masculine and neuter nouns; the feminine is duae."
    "examples":
      "Duo libri sunt.":
        "native": "There are two books."
        "bases":
          "Duo": "two"
          "libri": "book"
          "sunt": "to be (are)"
      "Duo amici sunt.":
        "native": "There are two friends."
        "bases":
          "Duo": "two"
          "amici": "friend"
          "sunt": "to be (are)"
  "la-0009":
    "native": "I am here."
    "notes":
      "n1": "Hic is here, in this place: hic est, here is. For there, ibi."
    "examples":
      "Hic est liber.":
        "native": "Here is the book."
        "bases":
          "Hic": "here"
          "est": "to be (is)"
          "liber": "book"
      "Ego hic sum.":
        "native": "I am here."
        "bases":
          "Ego": "I"
          "hic": "here"
          "sum": "to be (am)"
  "la-0010":
    "native": "I and you."
    "notes":
      "n1": "Et is and between words and clauses. The ending -que, attached to the second word, also means and: senatus populusque, the senate and the people."
    "examples":
      "Panis et aqua.":
        "native": "Bread and water."
        "bases":
          "Panis": "bread"
          "et": "and"
          "aqua": "water"
      "Ego et tu.":
        "native": "I and you."
        "bases":
          "Ego": "I"
          "et": "and"
          "tu": "you"
