"tags":
- "unreviewed"
"cards":
  "la-0011":
    "native": "Hello."
    "notes":
      "n1": "Salve is hello to one person; salvete is the form for more. Attested in Latin texts."
  "la-0012":
    "native": "Goodbye."
    "notes":
      "n1": "Vale is goodbye to one person; valete is the form for more. Attested in Latin letters."
  "la-0013":
    "native": "Thanks."
    "notes":
      "n1": "Grātiās is thanks; the word is plural in form. Attested."
  "la-0014":
    "native": "Thank you."
    "notes":
      "n1": "Tibi is to you and ago is I do: grātiās agere, to give thanks, is the usual Latin for thank you."
  "la-0015":
    "native": "Sorry; forgive me."
    "notes":
      "n1": "Ignosce is the imperative of ignoscere, to forgive: forgive me. Its use for sorry is attested."
  "la-0016":
    "native": "Please."
    "notes":
      "n1": "Literally if it pleases (you). The usual Latin for please, in letters and speech."
  "la-0017":
    "native": "I do not understand."
    "notes":
      "n1": "The standard way to say you do not understand."
  "la-0018":
    "native": "Do you understand?"
    "notes":
      "n1": "Do you understand? -ne makes a question; the answer yes is ita."
  "la-0019":
    "native": "Do you speak Latin?"
    "notes":
      "n1": "Not found in this form in an ancient author: built by the rules of Latin, so a conventional textbook phrase."
  "la-0020":
    "native": "How much does it cost?"
    "notes":
      "n1": "Quanti is a genitive of price: at what price does it stand? Attested."
  "la-0021":
    "native": "Where is it?"
    "notes":
      "n1": "Ubi is where; ubi est is where is. Attested and common."
  "la-0022":
    "native": "Help me!"
    "notes":
      "n1": "Adiuva is the imperative of adiuvare, to help: help me."
  "la-0023":
    "native": "What is your name?"
    "notes":
      "n1": "Latin says a name is to you: nomen tibi est. This form of the question is conventional, built from attested words."
  "la-0024":
    "native": "My name is Anna."
    "notes":
      "n1": "Latin says a name is to me: nōmen mihi est. Anna is an example name. Conventional phrasing."
  "la-0025":
    "native": "Good day!"
    "notes":
      "n1": "Bonum diem, a good day: the usual greeting. Latin had no single word for good morning. Conventional form."
  "la-0026":
    "native": "Speak more slowly, please."
    "notes":
      "n1": "Lentē is slowly and loquere the imperative of loquor, to speak. The words are attested; the sentence is conventional."
  "la-0027":
    "native": "Where are you going?"
    "notes":
      "n1": "Quō vādis is where are you going, from vādere, to go. Attested in Latin texts."
  "la-0028":
    "native": "No, thank you."
    "notes":
      "n1": "Non is no and grātiās is thanks: the polite way to refuse an offer."
  "la-0029":
    "native": "Goodbye (to several)."
    "notes":
      "n1": "Valete, goodbye to more than one person. Attested in Latin letters."
  "la-0030":
    "native": "Hello (to several)."
    "notes":
      "n1": "Salvete, hello to more than one person. Attested in Latin texts."
