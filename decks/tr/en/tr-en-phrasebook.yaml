schema: 1
id: "tr-en-phrasebook"
kind: "layer"
core: "tr-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty survival phrases to say whole from the first lesson, before their words are taught: greetings and goodbyes, sorry, not understanding, asking the way and the price, and asking for help. Not yet checked by a Turkish speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tr-0011":
    native: "Good morning."
    notes:
      "n1": "Said in the morning, until about noon."
    bases:
      "Günaydın": "good morning"
  "tr-0012":
    native: "Good evening."
    notes:
      "n1": "Said from the afternoon into the night."
    bases:
      "akşamlar": "evening"
  "tr-0013":
    native: "Good night."
    notes:
      "n1": "Said at bedtime, or on leaving at night."
    bases:
      "geceler": "night"
  "tr-0014":
    native: "Goodbye (to someone staying)."
    notes:
      "n1": "Said to someone who stays where they are. To someone who goes, say Hoşça kal."
    bases:
      "Hoşça": "well; as you wish"
      "kalın": "to stay (polite you)"
  "tr-0015":
    native: "See you."
    notes:
      "n1": "Literally: we see each other."
    bases:
      "Görüşürüz": "to see each other (we)"
  "tr-0016":
    native: "I'm sorry."
    notes:
      "n1": "Literally: I ask for an apology."
    bases:
      "Özür": "apology"
      "dilerim": "to wish; to ask (I form)"
  "tr-0017":
    native: "Excuse me."
    notes:
      "n1": "Used to get past someone, or to get attention."
    bases:
      "Affedersiniz": "to forgive; to excuse (polite you)"
  "tr-0018":
    native: "I don't understand."
    notes:
      "n1": "The negative form. Anlıyorum is I understand."
    bases:
      "Anlamıyorum": "to understand"
  "tr-0019":
    native: "I don't speak Turkish."
    notes:
      "n1": "Türkçe is Turkish, the language."
    bases:
      "Türkçe": "Turkish (the language)"
      "konuşmuyorum": "to speak"
  "tr-0020":
    native: "Do you speak Turkish? (polite)"
    notes:
      "n1": "The polite form, to a stranger or to several people."
    bases:
      "Türkçe": "Turkish (the language)"
      "konuşuyor": "to speak"
      "musunuz": "question particle (polite you)"
  "tr-0021":
    native: "Please speak slowly."
    notes:
      "n1": "Yavaş is slow, and also slowly."
    bases:
      "Yavaş": "slow; slowly"
      "konuşun": "to speak (polite you)"
  "tr-0022":
    native: "Once more, please."
    notes:
      "n1": "Literally: one more time, please."
    bases:
      "Bir": "one; once"
      "daha": "again; more"
  "tr-0023":
    native: "How much?"
    notes:
      "n1": "Ne kadar is how much. Add the price after it."
    bases:
      "Ne": "what; how"
      "kadar": "as much as"
  "tr-0024":
    native: "The bill, please."
    notes:
      "n1": "Hesap is the bill, in a café or a restaurant."
    bases:
      "Hesap": "bill; account"
  "tr-0025":
    native: "Help!"
    notes:
      "n1": "A cry for help, as in an emergency."
    bases:
      "İmdat": "help; emergency"
  "tr-0026":
    native: "Where is the toilet?"
    notes:
      "n1": "Nerede is where. Put another place in for tuvalet."
    bases:
      "Tuvalet": "toilet"
      "nerede": "where"
  "tr-0027":
    native: "What does this mean?"
    notes:
      "n1": "Literally: what meaning does this come to."
    bases:
      "Bu": "this"
      "ne": "what"
      "anlama": "meaning"
      "geliyor": "to come; to mean (of words)"
  "tr-0028":
    native: "My name is Anna."
    notes:
      "n1": "Literally: my name, Anna."
    bases:
      "Adım": "name"
      "Anna": "Anna (a first name)"
  "tr-0029":
    native: "Pleased to meet you."
    notes:
      "n1": "Literally: I am pleased. Say it when you meet someone."
    bases:
      "Memnun": "glad; pleased"
      "oldum": "to be; to become (I form)"
  "tr-0030":
    native: "Enjoy your meal!"
    notes:
      "n1": "Literally: may it be good for your health."
    bases:
      "Afiyet": "appetite; health"
      "olsun": "may it be"
