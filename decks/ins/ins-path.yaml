# The order Indian Sign Language is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner from
# English is taught ins-en-<name> for ins-<name> (ADR-0013, ADR-0036).
#
# This is also Indian Sign Language's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"): every
# unit from the first words to B1, with its size in words, its grammar
# topics, the three milestones, and for each planned unit its listening
# and reading passages. The file is written by tools/gen_planned_paths.py
# from the unit template of the language-paths scheme
# (wiki/Plan-Language-Paths-Scheme.md) and the grammar of the language's
# family; edit the generator's data, or take a unit over by hand once its
# deck is written (#959).
#
# Unit 1 is written: the SignWriting explainer (ADR-0056), which teaches the
# symbols a sign is drawn with before the first sign. Every other unit is
# planned, so the course teaches each as "Coming" until its deck is written;
# the first signs are the first planned theme. The passages are placeholders:
# each describes its unit's theme or grammar and is reworded when it is written.
#
# From the scheme, for this language: Signs, not words: the SignWriting guide first; handshape, location, movement and the face; fingerspelling; classifiers; role shift.
#
# `alphabet` lists the SignWriting explainer's decks: a learner who does not
# read SignWriting skips them (ADR-0056).
schema: 1
kind: "path"
id: "ins-path"
language: "ins"
description: "Indian Sign Language: the planned path to B1. Only the SignWriting explainer is written."
genders: []
alphabet: ["ins-script-hands", "ins-script-orientation", "ins-script-contact-movement", "ins-script-face-body"]
units:
  - ["ins-script-hands", "ins-script-orientation", "ins-script-contact-movement", "ins-script-face-body"]
