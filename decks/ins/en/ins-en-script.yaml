schema: 1
id: "ins-en-script"
kind: "layer"
core: "ins-script"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How SignWriting works"
intro: "SignWriting writes a sign language down by drawing what the hands, the face and the body do, symbol by symbol. It is the way this app writes signs. A few ideas come back in every sign: learn them here, before the first sign."
features:
  "drawn":
    name: "A sign is a drawing"
    text: "SignWriting was invented by Valerie Sutton in 1974. It does not spell English words: each sign is drawn as it is made, with symbols for the hands, how they move and what the face does, read from top to bottom, the way the signer sees it. A sign is a small picture, not a line of letters."
  "handshape":
    name: "The hand: a square, a circle, lines"
    text: "A fist is a square and an extended finger a line. A flat hand has a pointed top, a curved hand is drawn from the side, and the circle is a hand with the fingers and thumb curled round. Learn a few core handshapes first: the rest are variations."
  "facing":
    name: "White, half, black"
    text: "The fill says how the hand faces you, as you see your own hand: white is the palm, black is the back of the hand, and half is the edge. The fingers out are the same in all three. Look at the fill before the shape."
  "turning":
    name: "Turning the hand"
    text: "A symbol turns the way the hand turns, in steps of an eighth of a turn. Each turn has a mirror image for the other hand, so one handshape is sixteen symbols turned and mirrored."
  "movement":
    name: "Arrows: where the hand goes"
    text: "Movement is an arrow. An upright arrow moves in the plane in front of you, a flat arrow along the floor plane, a curved arrow along an arc. The shaft is the path and the head is the direction."
  "contact":
    name: "Touching"
    text: "A small mark beside a handshape says how it makes contact: touch, grasp, strike, brush, rub. These are placed against the symbol they belong to."
  "face":
    name: "The face"
    text: "The face is part of the sign. A head is a circle, and the eyebrows, eyes, cheeks and mouth are drawn inside it. A raised eyebrow can turn a statement into a question."
  "layout":
    name: "Two dimensions"
    text: "Symbols are placed where they are on the body: the head at the top, the shoulders below it, hands against the shoulders. A sign is read top to bottom, and since a font cannot place symbols in two dimensions, the app draws each whole sign as a picture. The symbols in these decks are drawn one at a time."
