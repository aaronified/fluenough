name: "First words"
license: "CC-BY-SA-4.0"
description: "The pronouns, the numbers one to five, the family words mother, father and child, man and woman, and the words water, name, big and small. Written in the Perso-Arabic script, read from right to left. Only words that a source could give are taught here, so the deck is short. Not yet checked by a Kashmiri speaker: please report any mistake."
cards:
  "ks-0001":
    native: "I"
    notes:
      "n1": "بہٕ (bụ) is 'I'. Wade's 1870 grammar gives bo, which agrees."
  "ks-0002":
    native: "you (singular)"
    notes:
      "n1": "ژٕ (ċụ) is 'you'. Wade's grammar gives tsa, a different form, so check it with a\
  \ speaker."
  "ks-0003":
    native: "he"
    notes:
      "n1": "ہُہ (huh) is 'he'. Wade's grammar gives su, a different form, so check it with a\
  \ speaker."
  "ks-0004":
    native: "she"
    notes:
      "n1": "سُہ (suh) is 'she'. Wade's grammar gives so, a different form, so check it with a\
  \ speaker."
  "ks-0005":
    native: "we"
    notes:
      "n1": "أسؠ (as') is 'we'. Wade's grammar gives as, which agrees, but the line is damaged,\
  \ so check it with a speaker."
  "ks-0006":
    native: "they"
    notes:
      "n1": "تِم (tim) is 'they' (masculine). Wade's grammar gives the same form."
  "ks-0007":
    native: "one"
    notes:
      "n1": "اَکھ (akh) is 'one'. Wade's grammar gives aka, a different form, so check it with\
  \ a speaker."
  "ks-0008":
    native: "two"
    notes:
      "n1": "زٕ (zụ) is 'two'. It comes from one word list only, so check it with a speaker."
  "ks-0009":
    native: "three"
    notes:
      "n1": "ترٛےٚ (tre) is 'three'. It comes from one word list only, so check it with a speaker."
  "ks-0010":
    native: "four"
    notes:
      "n1": "ژور (ċōr) is 'four'."
  "ks-0011":
    native: "five"
    notes:
      "n1": "پانٛژھ (pānċh) is 'five'."
  "ks-0012":
    native: "mother"
    notes:
      "n1": "مٲی (mạ̄ī) is 'mother'. Wade's grammar gives moj, a different form, so check it with\
  \ a speaker."
  "ks-0013":
    native: "father"
    notes:
      "n1": "مول (mōl) is 'father'. Wade's grammar gives the same form."
  "ks-0014":
    native: "child"
    notes:
      "n1": "شُر (śur) is 'child'. Wade's grammar gives the same form."
  "ks-0015":
    native: "man"
    notes:
      "n1": "مرٕد (mrụd) is 'man', an adult male. Wade's grammar gives mahaniu, a different form,\
  \ so check it with a speaker."
  "ks-0016":
    native: "woman"
    notes:
      "n1": "زَنان (zanān) is 'woman'. Wade's grammar gives zandna, which agrees."
  "ks-0017":
    native: "water"
    notes:
      "n1": "آب (āb) is 'water'. Wade's grammar gives db, which is probably the same word with\
  \ a dropped mark."
  "ks-0018":
    native: "name"
    notes:
      "n1": "ناو (nāv) is 'name'."
  "ks-0019":
    native: "big"
    notes:
      "n1": "بۆڈ (boḍ) is 'big'. Wade's grammar gives bod, which agrees."
  "ks-0020":
    native: "small"
    notes:
      "n1": "لۄکُٹ (lọkuṭ) is 'small'. Wade's grammar gives lokut, which agrees."
