schema: 1
id: "ks-en-first-words"
kind: "layer"
core: "ks-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "The pronouns, the numbers one to five, the family words mother, father and child, man and woman, and the words water, name, big and small. Written in the Perso-Arabic script, read from right to left. Only words that a source could give are taught here, so the deck is short. Not yet checked by a Kashmiri speaker: please report any mistake."
cards:
  "ks-0001":
    native: "I"
    notes:
      "n1": "بہٕ (bụ) is 'I'. Wade's 1870 grammar gives bo, which agrees."
  "ks-0002":
    native: "you (singular)"
    notes:
      "n1": "ژٕ (ċụ) is 'you' for one person. Wiktionary's Kashmiri entry lists it as the second person singular pronoun. Wade's 1870 grammar writes it tsa."
  "ks-0003":
    native: "he"
    notes:
      "n1": "ہُہ (huh) is 'he' for a person who is far but in sight. Wiktionary's Kashmiri pronoun table lists it as the distant masculine form; Wade's 1870 grammar writes the other form su for 'he'."
  "ks-0004":
    native: "she"
    notes:
      "n1": "ہۄ (họ) is 'she' for a person who is far but in sight. Wiktionary's Kashmiri pronoun table lists it as the distant feminine form, the pair of ہُہ (huh); سۄ (sọ) is the feminine for someone out of sight."
  "ks-0005":
    native: "we"
    notes:
      "n1": "أسؠ (as') is 'we'. Wiktionary's Kashmiri entry lists it as the plural of بہٕ (bụ, I)."
  "ks-0006":
    native: "they"
    notes:
      "n1": "تِم (tim) is 'they' for people out of sight. Wiktionary's Kashmiri pronoun table lists it as the plural of سُہ (suh); Wade's 1870 grammar gives the same form."
  "ks-0007":
    native: "one"
    notes:
      "n1": "اَکھ (akh) is 'one'. Wiktionary's Kashmiri entry lists it as the cardinal number one; Wade's 1870 grammar writes it aka."
  "ks-0008":
    native: "two"
    notes:
      "n1": "زٕ (zụ) is 'two'. Wiktionary's Kashmiri entry lists it as the cardinal number two."
  "ks-0009":
    native: "three"
    notes:
      "n1": "ترٛےٚ (tre) is 'three'. Wiktionary's Kashmiri entry lists it as the cardinal number three."
  "ks-0010":
    native: "four"
    notes:
      "n1": "ژور (ċōr) is 'four'."
  "ks-0011":
    native: "five"
    notes:
      "n1": "پانٛژھ (pānċh) is 'five'."
  "ks-0012":
    native: "mother"
    notes:
      "n1": "مٲج (mạ̄j) is 'mother'. Wiktionary's Kashmiri entry lists it as a feminine noun, 'mother'. Wade's 1870 grammar writes it moj."
  "ks-0013":
    native: "father"
    notes:
      "n1": "مول (mōl) is 'father'. Wade's grammar gives the same form."
  "ks-0014":
    native: "child"
    notes:
      "n1": "شُر (śur) is 'child'. Wade's grammar gives the same form."
  "ks-0015":
    native: "man"
    notes:
      "n1": "مرٕد (mrụd) is 'man', an adult male. Wade's grammar gives mahaniu, a different form,\
  \ so check it with a speaker."
  "ks-0016":
    native: "woman"
    notes:
      "n1": "زَنان (zanān) is 'woman'. Wade's grammar gives zandna, which agrees."
  "ks-0017":
    native: "water"
    notes:
      "n1": "آب (āb) is 'water'. Wade's grammar gives db, which is probably the same word with\
  \ a dropped mark."
  "ks-0018":
    native: "name"
    notes:
      "n1": "ناو (nāv) is 'name'."
  "ks-0019":
    native: "big"
    notes:
      "n1": "بۆڈ (boḍ) is 'big'. Wade's grammar gives bod, which agrees."
  "ks-0020":
    native: "small"
    notes:
      "n1": "لۄکُٹ (lọkuṭ) is 'small'. Wade's grammar gives lokut, which agrees."
