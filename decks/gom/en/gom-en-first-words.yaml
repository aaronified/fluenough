schema: 1
id: "gom-en-first-words"
kind: "layer"
core: "gom-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "The pronouns I, you, he or she, we and they, the numbers one to five, the family words mother, father, child, man and woman, and a few everyday words such as good, big, small and here. Not yet checked by a Konkani speaker: please report any mistake."
cards:
  "gom-0101":
    native: "I"
    notes:
      "n1": "Hanv is 'I'. Wiktionary's Konkani entry हांव (hanv) gives it as the first person pronoun. An older grammar writes it Aun, as in Aun Kodial vetan (I go to Mangalore)."
  "gom-0102":
    native: "you (singular)"
    notes:
      "n1": "Tu is 'you' for one person. Wiktionary's Konkani entry तू (tu) gives it as the second person singular pronoun."
  "gom-0103":
    native: "he"
    notes:
      "n1": "To is 'he' (the far one). Wiktionary's Konkani entry तो (to) lists it as 'he', distal."
  "gom-0104":
    native: "she"
    notes:
      "n1": "Ti is 'she' (the far one). Wiktionary's Konkani entry ती (ti) lists it as 'she', distal."
  "gom-0105":
    native: "we"
    notes:
      "n1": "Ami is 'we'. Wiktionary's Konkani entry आमि (ami) gives it as 'we'."
  "gom-0106":
    native: "they"
    notes:
      "n1": "Tanhi is 'they' in the builder's source, but no dictionary entry was reached to confirm the spelling, so check it with a speaker."
  "gom-0107":
    native: "one"
    notes:
      "n1": "Ek is 'one'. Wiktionary's Konkani entry एक (ek) lists it as the numeral one. An older grammar spells it yek."
  "gom-0108":
    native: "two"
    notes:
      "n1": "Don is 'two'. Wiktionary's Konkani entry दोन (don) lists it as the numeral two."
  "gom-0109":
    native: "three"
    notes:
      "n1": "Tin is 'three'. Wiktionary's Konkani entry तीन (tin) lists it as the numeral three."
  "gom-0110":
    native: "four"
    notes:
      "n1": "Char is 'four'. Wiktionary's Konkani entry चार (char) lists it as the numeral four."
  "gom-0111":
    native: "five"
    notes:
      "n1": "Pach is 'five'. Wiktionary's Konkani entry पाच (pach) lists it as the numeral five."
  "gom-0112":
    native: "mother"
    notes:
      "n1": "Avoi is 'mother'. Wiktionary's Konkani entry आवय (avoi) lists it as 'mother'; it pairs with bapui (father)."
  "gom-0113":
    native: "father"
    notes:
      "n1": "Bapui is 'father'. Wiktionary's Konkani entry बापूय (bapui) lists it as 'father'."
  "gom-0114":
    native: "child"
    notes:
      "n1": "Bhurgem is 'child'. Wiktionary's Konkani entry भुरगें (bhurgem) lists it as 'child'. An older grammar spells it burgen."
  "gom-0115":
    native: "man; person"
    notes:
      "n1": "Monis is 'man' or 'human being'. Wiktionary's Konkani entry मनीस (monis) lists it as 'a man'."
  "gom-0116":
    native: "woman"
    notes:
      "n1": "Bail is 'woman'. Wiktionary's Konkani entry बायल (bail) lists it as 'woman' and also 'wife'."
  "gom-0117":
    native: "water"
    notes:
      "n1": "Udok is 'water'. Wiktionary's Konkani entry उदक (udok) lists it as 'water'."
  "gom-0118":
    native: "name"
    notes:
      "n1": "Nav is 'name'. Wiktionary's Konkani entry नाव (nav) lists it as 'name'."
  "gom-0119":
    native: "good"
    notes:
      "n1": "Borem is 'good'. Wiktionary's Konkani entry बरें (borem) lists it as 'good'. An older grammar spells it boro."
  "gom-0120":
    native: "big"
    notes:
      "n1": "Vhodd is 'big'. Wiktionary's Konkani entry व्हड (vhodd) lists it as 'big' or 'large'. An older grammar spells it vod."
  "gom-0121":
    native: "small"
    notes:
      "n1": "Lhan is 'small'. Wiktionary's Konkani entry ल्हान (lhan) lists it as 'small' or 'little'. An older grammar spells it lan."
  "gom-0122":
    native: "here"
    notes:
      "n1": "Hanga is 'here'. Wiktionary's Konkani entry हांगा gives it as 'here' in the Goud Saraswat Brahmin speech; the Bardez Catholic form is said ingá, so the word varies by community."
  "gom-0123":
    native: "there"
    notes:
      "n1": "Thai is 'there' in an older grammar, but the modern Devanagari form थंय has no romanisation to check it against, so check it with a speaker."
  "gom-0124":
    native: "what"
    notes:
      "n1": "Kiten is 'what', in an older grammar's question Tujen kam kiten? (What is your work?). No modern dictionary entry was reached to confirm the spelling, so check it with a speaker."
  "gom-0125":
    native: "who"
    notes:
      "n1": "Konn is 'who'. Wiktionary's Konkani entry कोण (konn) lists it as 'who'."
  "gom-0126":
    native: "where"
    notes:
      "n1": "Khõy is 'where'. Wiktionary's Konkani entry खंय (khõy) lists it as an interrogative adverb, 'where?'."
  "gom-0127":
    native: "yes"
    notes:
      "n1": "Hoi is 'yes'. Wiktionary's Konkani entry हय (hoi) lists it as the affirmative answer. An older grammar writes it ui."
