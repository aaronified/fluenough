id: "gom-en-first-words"
kind: "layer"
core: "gom-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "The pronouns I, you, he or she, we and they, the numbers one to five, the family words mother, father, child, man and woman, and a few everyday words such as good, big, small and here. Not yet checked by a Konkani speaker: please report any mistake."
cards:
  "gom-0101":
    native: "I"
    notes:
      "n1": "Aun is 'I' in an older grammar's example Aun Kodial vetan (I go to Mangalore). The\
  \ spelling is the grammar's own; the modern Romi form may differ."
  "gom-0102":
    native: "you (singular)"
    notes:
      "n1": "Tu is 'you' for one person. Romanised from the Devanagari form in Wiktionary, so\
  \ check it with a speaker."
  "gom-0103":
    native: "he"
    notes:
      "n1": "To is 'he'. Romanised from the Devanagari form in Wiktionary, so check it with a\
  \ speaker."
  "gom-0104":
    native: "she"
    notes:
      "n1": "Ti is 'she'. Romanised from the Devanagari form in Wiktionary, so check it with a\
  \ speaker."
  "gom-0105":
    native: "we"
    notes:
      "n1": "Amhi is 'we'. Romanised from the Devanagari form in Wiktionary, so check it with\
  \ a speaker."
  "gom-0106":
    native: "they"
    notes:
      "n1": "Tanhi is 'they'. Romanised from the Devanagari form in Wiktionary, which has no entry\
  \ for it, so check it with a speaker."
  "gom-0107":
    native: "one"
    notes:
      "n1": "Yek is 'one'. An older grammar gives it as one, with the sense 'a' or 'an'."
  "gom-0108":
    native: "two"
    notes:
      "n1": "Don is 'two'. Romanised from the Devanagari form in Wiktionary, so check it with\
  \ a speaker."
  "gom-0109":
    native: "three"
    notes:
      "n1": "Tin is 'three'."
  "gom-0110":
    native: "four"
    notes:
      "n1": "Char is 'four'. Romanised from the Devanagari form in Wiktionary, so check it with\
  \ a speaker."
  "gom-0111":
    native: "five"
    notes:
      "n1": "Pach is 'five'. Romanised from the Devanagari form in Wiktionary, so check it with\
  \ a speaker."
  "gom-0112":
    native: "mother"
    notes:
      "n1": "Avoi is 'mother', in an older grammar's exercises."
  "gom-0113":
    native: "father"
    notes:
      "n1": "Bapui is 'father', in an older grammar."
  "gom-0114":
    native: "child"
    notes:
      "n1": "Burgen is 'child', in an older grammar. The word has no modern dictionary entry,\
  \ so check it with a speaker."
  "gom-0115":
    native: "man; person"
    notes:
      "n1": "Monis is 'man' or 'human being', as in an older grammar."
  "gom-0116":
    native: "woman"
    notes:
      "n1": "Bail is 'woman', in an older grammar."
  "gom-0117":
    native: "water"
    notes:
      "n1": "Udok is 'water'. Romanised from the Devanagari form in Wiktionary, so check it with\
  \ a speaker."
  "gom-0118":
    native: "name"
    notes:
      "n1": "Nav is 'name'. An older grammar gives navin in a sentence. Check it with a speaker."
  "gom-0119":
    native: "good"
    notes:
      "n1": "Boro is 'good', in an older grammar."
  "gom-0120":
    native: "big"
    notes:
      "n1": "Vod is 'big'."
  "gom-0121":
    native: "small"
    notes:
      "n1": "Lan is 'small'."
  "gom-0122":
    native: "here"
    notes:
      "n1": "Hanga is 'here'. Romanised from the Devanagari form in Wiktionary, so check it with\
  \ a speaker."
  "gom-0123":
    native: "there"
    notes:
      "n1": "Thai is 'there', in an older grammar. Check it with a speaker."
  "gom-0124":
    native: "what"
    notes:
      "n1": "Kiten is 'what', in an older grammar's question Tujen kam kiten? (What is your work?)."
  "gom-0125":
    native: "who"
    notes:
      "n1": "Kon is 'who'. Romanised from the Devanagari form in Wiktionary, so check it with\
  \ a speaker."
  "gom-0126":
    native: "where"
    notes:
      "n1": "Khain is 'where', in an older grammar's question Moji may khain assa? (Where is my\
  \ mother?)."
  "gom-0127":
    native: "yes"
    notes:
      "n1": "Ui is 'yes', in an older grammar. Check it with a speaker."
