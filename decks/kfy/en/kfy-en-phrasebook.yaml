schema: 1
id: "kfy-en-phrasebook"
kind: "layer"
core: "kfy-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty phrases to say whole from the first day, before their words are taught: greetings and goodbye, thanks and sorry, asking for slower speech, asking for help and where the toilet is. Not yet checked by a Kumaoni speaker: please report any mistake."
license: "CC-BY-SA-4.0"
cards:
  "kfy-0001":
    native: "hello; goodbye"
    notes:
      "n1": "The usual greeting, said with the palms pressed together."
    bases:
      "नमस्कार": "hello; goodbye"
  "kfy-0002":
    native: "good morning"
    notes:
      "n1": "Said in the morning."
    bases:
      "सुप्रभात": "good morning"
  "kfy-0003":
    native: "good evening"
    notes:
      "n1": "Said in the evening. सांझ (sānjh) is 'evening'."
    bases:
      "शुभ सांझ": "good evening"
  "kfy-0004":
    native: "good night"
    notes:
      "n1": "Said at bedtime. रात (rāt) is 'night'."
    bases:
      "शुभ रात": "good night"
  "kfy-0005":
    native: "see you again"
    notes:
      "n1": "Literally 'we will meet again'. Said when leaving."
    bases:
      "फेर भेटूंल": "see you again"
  "kfy-0006":
    native: "please"
    notes:
      "n1": "Put before a request."
    bases:
      "कृपा करि": "please"
  "kfy-0007":
    native: "thank you"
    notes:
      "n1": "Polite and common."
    bases:
      "धन्यवाद": "thank you"
  "kfy-0008":
    native: "you're welcome; no problem"
    notes:
      "n1": "Literally 'there is no matter'. Said in reply to thanks."
    bases:
      "कै बात नि छ": "you're welcome; no problem"
  "kfy-0009":
    native: "sorry"
    notes:
      "n1": "Said to say sorry."
    bases:
      "माफ करिया": "sorry"
  "kfy-0010":
    native: "excuse me"
    notes:
      "n1": "Literally 'please listen'. Said to get someone's attention."
    bases:
      "सुणिया": "excuse me"
  "kfy-0011":
    native: "I don't understand"
    notes:
      "n1": "Literally 'understanding has not come to me'."
    bases:
      "मैकें समझ में नि आ": "I don't understand"
  "kfy-0012":
    native: "I don't know Kumaoni"
    notes:
      "n1": "Put another language's name in place of कुमाऊँनी (kumāūnī)."
    bases:
      "मैकें कुमाऊँनी नि आन": "I don't know Kumaoni"
  "kfy-0013":
    native: "please speak slowly"
    notes:
      "n1": "Literally 'speak well'. Said to ask for slower speech."
    bases:
      "भल बलो": "please speak slowly"
  "kfy-0014":
    native: "do you speak English?"
    notes:
      "n1": "Respectful."
    bases:
      "तुम अंग्रेजी बलै सकछा?": "do you speak English?"
  "kfy-0015":
    native: "how are you?"
    notes:
      "n1": "Respectful."
    bases:
      "तुम कसिक छा?": "how are you?"
  "kfy-0016":
    native: "I'm fine"
    notes:
      "n1": "The answer to how are you. ठीक (ṭhīk) is 'fine'."
    bases:
      "मैं ठीक छूं": "I'm fine"
  "kfy-0017":
    native: "what is your name?"
    notes:
      "n1": "Respectful. The answer is मेरो (mero) नाम (nām) ... छ (cha)."
    bases:
      "तुमर नाम के छ?": "what is your name?"
  "kfy-0018":
    native: "my name is ..."
    notes:
      "n1": "Put your name where the dots are."
    bases:
      "मेरो नाम ... छ": "my name is ..."
  "kfy-0019":
    native: "where is the toilet?"
    notes:
      "n1": "शौचालय (śauchālay) is 'toilet'."
    bases:
      "शौचालय कां छ?": "where is the toilet?"
  "kfy-0020":
    native: "help!"
    notes:
      "n1": "Shouted in an emergency."
    bases:
      "बचाओ!": "help!"
