          "उ": "he"
          "को": "who"
          "छ": "is"
  "kfy-0106":
    native: "we"
    notes:
      "n1": "The Survey's text has 'ham ... chhu' for 'we are'. Source: Grierson, Linguistic Survey of India, vol. IX part 4 (1916), the Kumauni section."
    examples:
      "हम घर में छूं।":
        native: "We are at home."
