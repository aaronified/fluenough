description: "The first words of Kumaoni: the pronouns, yes and no, the numbers 1 to 10, the family, and the everyday words for food, house, name and time. Not yet checked by a Kumaoni speaker: please report any mistake."
cards:
  "kfy-0101":
    native: "yes"
    notes:
      "n1": "The usual 'yes'."
    examples:
      "हाँ, यो पाणी छ।":
        native: "Yes, this is water."
        bases:
          "हाँ": "yes"
          "यो": "this"
          "पाणी": "water"
          "छ": "is"
  "kfy-0102":
    native: "no; not"
    notes:
      "n1": "The negative. Before a verb it means 'not'. The Survey's text has 'ni' before verbs (as in 'ni mila', did not find); the verb 'to be' has its own negative, nhātu. Source: Grierson, Linguistic Survey of India, vol. IX part 4 (1916), the Kumauni section."
    examples:
      "नि, मैं नि औंल।":
        native: "No, I am not coming."
        bases:
          "नि": "not"
          "मैं": "I"
          "औंल": "come"
  "kfy-0103":
    native: "I"
    notes:
      "n1": "The first person. Source: Grierson, Linguistic Survey of India, vol. IX part 4 (1916), the Kumauni section."
    examples:
      "मैं घर में छूं।":
        native: "I am at home."
        bases:
          "मैं": "I"
          "घर": "house"
          "में": "in"
          "छूं": "am"
      "यो मेरो घर छ।":
        native: "This is my house."
        bases:
          "यो": "this"
          "मेरो": "my"
          "घर": "house"
          "छ": "is"
  "kfy-0104":
    native: "you"
    notes:
      "n1": "The plural 'you', used as the polite 'you' too. For one person the Survey gives तू (tū). Source: Grierson, Linguistic Survey of India, vol. IX part 4 (1916), the Kumauni section."
    examples:
      "तुम को छा?":
        native: "Who are you?"
        bases:
          "तुम": "you"
          "को": "who"
          "छा": "are"
      "तुम घर में छा।":
        native: "You are at home."
        bases:
          "तुम": "you"
          "घर": "house"
          "में": "in"
          "छा": "are"
  "kfy-0105":
    native: "he; she"
    notes:
      "n1": "One word for he, she and that; the Survey's demonstratives have no gender. Source: Grierson, Linguistic Survey of India, vol. IX part 4 (1916), the Kumauni section."
    examples:
      "उ घर में छ।":
        native: "He is at home."
        bases:
          "उ": "he"
          "घर": "house"
          "में": "in"
          "छ": "is"
      "उ को छ?":
