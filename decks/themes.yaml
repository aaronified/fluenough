# The shared themes (ADR-0010): their ids and names. Each course teaches
# them in its own path's order (decks/<lang>/<lang>-path.yaml), each with its
# own words, though it need not have every theme yet. A theme deck names its
# theme by id, and ids are permanent, like card ids. A theme may list `tags`,
# words the Decks search finds its decks by (#527), such as `travel` on
# transport.
