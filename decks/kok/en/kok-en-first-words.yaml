description: "The first words of Konkani: the pronouns, yes and no, the numbers 1 to 10, the family, and the everyday words for food, house, name and time. Not yet checked by a Konkani speaker: please report any mistake."
cards:
  "kok-0101":
    native: "yes"
    notes:
      "n1": "The usual 'yes'."
    examples:
      "हय, हांव येतां।":
        native: "Yes, I am coming."
        bases:
          "हांव": "I"
          "येतां": "come"
  "kok-0102":
    native: "no; not"
    notes:
      "n1": "The negative. Put before a verb to say 'not'."
    examples:
      "ना, हांव येना।":
        native: "No, I am not coming."
        bases:
          "हांव": "I"
          "येना": "come"
