schema: 1
id: "kok-en-phrasebook"
kind: "layer"
core: "kok-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty phrases to say whole from the first day, before their words are taught: greetings and goodbye, thanks and sorry, asking for slower speech, asking for help and where the toilet is. Not yet checked by a Konkani speaker: please report any mistake."
license: "CC-BY-SA-4.0"
cards:
  "kok-0001":
    native: "hello; goodbye"
    notes:
      "n1": "The usual greeting, said with the palms pressed together."
    bases:
      "नमस्कार": "hello; goodbye"
  "kok-0002":
    native: "good morning"
    notes:
      "n1": "Said in the morning."
    bases:
      "सुप्रभात": "good morning"
  "kok-0003":
    native: "good evening"
    notes:
      "n1": "Said in the evening. संध्या (sandhyā) is 'evening'."
    bases:
      "शुभ": "auspicious; good"
      "संध्या": "evening"
  "kok-0004":
    native: "good night"
    notes:
      "n1": "Said at bedtime."
    bases:
      "शुभ": "auspicious; good"
      "रात्र": "night"
  "kok-0005":
    native: "goodbye; I'll be going"
    notes:
      "n1": "Literally 'I am coming'. Said by the one leaving."
    bases:
      "येतां": "goodbye; I'll be going"
  "kok-0006":
    native: "please"
    notes:
      "n1": "Put before a request."
    bases:
      "कृपया": "please"
  "kok-0007":
    native: "thank you"
    notes:
      "n1": "Polite and common."
    bases:
      "धन्यवाद": "thank you"
  "kok-0008":
    native: "you're welcome"
    notes:
      "n1": "Literally 'your welcome'. Said in reply to thanks."
    bases:
      "आपलें": "your"
      "स्वागत": "welcome"
  "kok-0009":
    native: "sorry"
    notes:
      "n1": "Said to say sorry."
    bases:
      "माफ": "forgiveness"
      "कर": "do"
  "kok-0010":
    native: "excuse me"
    notes:
      "n1": "Said to get someone's attention, or to ask pardon."
    bases:
      "हांवाक": "to me"
      "माफ": "forgiveness"
      "करात": "please do"
  "kok-0011":
    native: "I don't understand"
    notes:
      "n1": "Literally 'it is not known to me'."
    bases:
      "म्हाका": "to me"
      "कळना": "do not understand"
  "kok-0012":
    native: "I don't know Konkani"
    notes:
      "n1": "Literally 'Konkani does not come to me'."
    bases:
      "म्हाका": "to me"
      "कोंकणी": "Konkani"
      "येना": "am not coming"
  "kok-0013":
    native: "please speak slowly"
    notes:
      "n1": "हळू (haḷū) is 'slowly'."
    bases:
      "हळू": "slowly"
      "उलोवचें": "speak"
  "kok-0014":
    native: "do you speak English?"
    notes:
      "n1": "Asked politely."
    bases:
      "तुमकां": "to you"
      "इंग्लीश": "English"
      "येता": "comes"
  "kok-0015":
    native: "how are you?"
    notes:
      "n1": "Respectful form."
    bases:
      "तुमी": "you (respectful)"
      "कसे": "how"
      "आसा": "is; am; are"
  "kok-0016":
    native: "I'm fine"
    notes:
      "n1": "The answer to how are you. बरो (baro) is 'well'."
    bases:
      "बरो": "well"
      "आसा": "is; am; are"
  "kok-0017":
    native: "what is your name?"
    notes:
      "n1": "Respectful. The answer is म्हजें (mhajẽ) नांव (nāṁv) ..."
    bases:
      "तुमचें": "your"
      "कितें": "what"
  "kok-0018":
    native: "my name is ..."
    notes:
      "n1": "Put your name where the dots are."
    bases:
      "म्हजें": "my name is ..."
  "kok-0019":
    native: "where is the toilet?"
    notes:
      "n1": "संडास (saṇḍās) is 'toilet'."
    bases:
      "संडास": "toilet"
      "खंय": "where"
      "आसा": "is; am; are"
  "kok-0020":
    native: "help!"
    notes:
      "n1": "Shouted in an emergency."

    bases:
      "वाचवा": "help!"