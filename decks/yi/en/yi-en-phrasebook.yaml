description: "Twenty things to say from the first day, before their words are taught: greetings and farewells, please and thank you, sorry, the way to ask for slower speech and for help, and how to say your name. Written in the Hebrew alphabet; readings are based on the YIVO transliteration. Not yet checked by a Yiddish speaker: please report any mistake."
