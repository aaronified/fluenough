"name": "Phrasebook: first phrases"
"description": "Fifteen things to say from the first day, from the New Testament and the papyri: greetings, peace to you, thanks, asking someone's name, come and listen, do not be afraid. Polytonic spelling. The reading and the IPA are as in the first-words deck (a transliteration in ISO 843 style; broad reconstructed IPA for about the first century AD). Each card's note says whether it is quoted or conventional. Not yet checked by a Hellenist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "qgk-0011":
    "native": "Hello; rejoice."
    "notes":
      "n1": "Chaîre is the greeting to one person (for example Matthew 27:29) and the opening of many papyrus letters."
  "qgk-0012":
    "native": "Hello, all of you."
    "notes":
      "n1": "Chaírete is chaîre to more than one person (Matthew 28:9). Attested."
  "qgk-0013":
    "native": "Peace to you."
    "notes":
      "n1": "Eirḗnē hymîn, peace to you (Luke 24:36 and John 20:19), the greeting of the risen Jesus. Attested in the New Testament; this is a Jewish greeting in Greek dress."
  "qgk-0014":
    "native": "Peace to you (one person)."
    "notes":
      "n1": "Eirḗnē soi (3 John 15), peace to you, one person. Attested."
  "qgk-0015":
    "native": "Goodbye; farewell."
    "notes":
      "n1": "Érrhōso, be strong, closes letters in the papyri; the plural érrhōsthe is in Acts 15:29. Attested."
  "qgk-0016":
    "native": "Thank you."
    "notes":
      "n1": "Eucharistô, I give thanks, as in Romans 1:8, where it takes a name (to my God). Used alone as thank you it is conventional."
  "qgk-0017":
    "native": "Lord, have mercy on me."
    "notes":
      "n1": "Kýrie, eléēson me: the plea of Luke 18:38 (eléēson me), with the address of Matthew 15:22 (eléēson me, kýrie). Attested; the extra accent on the imperative is the rule for a word before an enclitic."
  "qgk-0018":
    "native": "What is your name?"
    "notes":
      "n1": "Quoted from Luke 8:30, where Jesus asks the man his name. Attested."
  "qgk-0019":
    "native": "What are you looking for?"
    "notes":
      "n1": "Quoted from John 1:38. Attested."
  "qgk-0020":
    "native": "What are you saying?"
    "notes":
      "n1": "Not a quoted sentence: built from attested words, as in John 9:17 (sy tí légeis, what do you say). Conventional."
  "qgk-0021":
    "native": "Come!"
    "notes":
      "n1": "Deûte, come, said to more than one person (Matthew 4:19 and 28:6). Attested."
  "qgk-0022":
    "native": "Listen."
    "notes":
      "n1": "Akoúete, listen, as in Mark 4:3 (akoúete). Attested."
  "qgk-0023":
    "native": "Do not be afraid."
    "notes":
      "n1": "Quoted from Matthew 28:10. Attested."
  "qgk-0024":
    "native": "Truly; amen."
    "notes":
      "n1": "Amḗn, truly, so be it, a Hebrew word kept in Greek. Attested throughout the New Testament."
  "qgk-0025":
    "native": "I do not know."
    "notes":
      "n1": "Quoted from Matthew 26:72, where Peter denies knowing the man. Attested."
