"name": "First words"
"description": "Ten words to start with: yes and no, I and you, water, good, one, two, here and and. The Koine Greek of the New Testament and the papyri, in polytonic spelling. The reading is a Latin transliteration in the style of ISO 843 and the SBL: th, ph, ch, ps and x for theta, phi, chi, psi and xi; ē and ō for eta and omega; y for upsilon (u in the diphthongs au, eu, ou); h for a rough breathing (rh for rho with a rough breathing); ng for two gammas in a row; an iota subscript is written i; alpha, iota and upsilon are not marked for length and accents are not shown. The IPA is broad and reconstructed, for about the first century AD, a cautious compromise because the sound changes of Koine were gradual and differed by region: phi, theta and chi are still stops (pʰ tʰ kʰ), eta is e, ei is i, oi and upsilon are y, ai is ɛ, ou is u, omega and omicron are o, zeta is z, eu is ɛu, vowel length is no longer shown, and the rough breathing is not pronounced. The accents of the composed sentences follow the usual rules for enclitics and need a Hellenist's check. Not yet checked by a Hellenist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "qgk-0001":
    "native": "yes"
    "notes":
      "n1": "Naí is yes. Attested in the New Testament (naí, kýrie, yes, Lord) and in papyri. Example 1 is quoted from a text (the New Testament); example 2 is composed from attested words."
    "examples":
      "ναί, κύριε.":
        "native": "Yes, Lord."
        "bases":
          "ναί": "yes"
          "κύριε": "lord (addressed)"
      "ναί, οἶδα.":
        "native": "Yes, I know."
        "bases":
          "ναί": "yes"
          "οἶδα": "to know (I know)"
  "qgk-0002":
    "native": "not; no"
    "notes":
      "n1": "Ou is not and no; it is written ouk before a vowel with a smooth breathing and ouch before one with a rough breathing. Attested. Both examples are quoted from a text (the New Testament)."
    "examples":
      "οὐκ οἶδα.":
        "native": "I do not know."
        "bases":
          "οὐκ": "not"
          "οἶδα": "to know (I know)"
      "οὐκ ἔστιν ὧδε.":
        "native": "He is not here."
        "bases":
          "οὐκ": "not"
          "ἔστιν": "to be (is)"
          "ὧδε": "here"
  "qgk-0003":
    "native": "I"
    "notes":
      "n1": "Egṓ is I. The verb ending already says I, so egṓ is used for emphasis, as in egṓ eimi, it is I. Attested. Example 1 is quoted from a text (the New Testament); example 2 is composed from attested words."
    "examples":
      "ἐγώ εἰμι.":
        "native": "It is I."
        "bases":
          "ἐγώ": "I"
          "εἰμι": "to be (I am)"
      "ἐγὼ ὕδωρ πίνω.":
        "native": "I drink water."
        "bases":
          "ἐγὼ": "I"
          "ὕδωρ": "water"
          "πίνω": "to drink (I drink)"
  "qgk-0004":
    "native": "you"
    "notes":
      "n1": "Sý is you, one person, as the subject. Attested. Example 1 is quoted from a text (the New Testament); example 2 is composed from attested words."
    "examples":
      "σὺ εἶ.":
        "native": "You are."
        "bases":
          "σὺ": "you"
          "εἶ": "to be (you are)"
      "σὺ οὐκ οἶδας.":
        "native": "You do not know."
        "bases":
          "σὺ": "you"
          "οὐκ": "not"
          "οἶδας": "to know (you know)"
  "qgk-0005":
    "native": "water"
    "notes":
      "n1": "Hýdōr is water. Attested; its genitive is hýdatos. Example 1 is quoted from a text (the New Testament); example 2 is composed from attested words."
    "examples":
      "ὕδωρ ζῶν.":
        "native": "Living water."
        "bases":
          "ὕδωρ": "water"
          "ζῶν": "living"
      "ὕδωρ ἐστίν.":
        "native": "There is water."
        "bases":
          "ὕδωρ": "water"
          "ἐστίν": "to be (is)"
  "qgk-0006":
    "native": "good"
    "notes":
      "n1": "Agathós is good. Attested; the neuter is agathón, and one addresses a man as agathé. Example 1 is quoted from a text (the New Testament); example 2 is composed from attested words."
    "examples":
      "διδάσκαλε ἀγαθέ.":
        "native": "Good teacher."
        "bases":
          "διδάσκαλε": "teacher (addressed)"
          "ἀγαθέ": "good (addressed to one man)"
      "ἀγαθός ἐστιν.":
        "native": "He is good."
        "bases":
          "ἀγαθός": "good"
          "ἐστιν": "to be (is)"
  "qgk-0007":
    "native": "one"
    "notes":
      "n1": "Heîs is one, masculine; the feminine is mía and the neuter hén. Attested. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "εἷς ἐστιν.":
        "native": "There is one."
        "bases":
          "εἷς": "one"
          "ἐστιν": "to be (is)"
      "εἷς καὶ δύο.":
        "native": "One and two."
        "bases":
          "εἷς": "one"
          "καὶ": "and"
          "δύο": "two"
  "qgk-0008":
    "native": "two"
    "notes":
      "n1": "Dýo is two. Attested. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "ὧδε δύο εἰσίν.":
        "native": "There are two here."
        "bases":
          "ὧδε": "here"
          "δύο": "two"
          "εἰσίν": "to be (they are)"
      "δύο ἀγαθοί.":
        "native": "Two good men."
        "bases":
          "δύο": "two"
          "ἀγαθοί": "good (plural)"
  "qgk-0009":
    "native": "here"
    "notes":
      "n1": "Hôde is here, or to this place. Attested in the New Testament and papyri; later Greek prefers it to the classical entháde. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "ὧδε εἰμί.":
        "native": "I am here."
        "bases":
          "ὧδε": "here"
          "εἰμί": "to be (I am)"
      "ὧδε ὕδωρ ἐστίν.":
        "native": "There is water here."
        "bases":
          "ὧδε": "here"
          "ὕδωρ": "water"
          "ἐστίν": "to be (is)"
  "qgk-0010":
    "native": "and"
    "notes":
      "n1": "Kaí is and, also, even. Attested; in the New Testament it links nearly every clause. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "ἐγὼ καὶ σύ.":
        "native": "You and I."
        "bases":
          "ἐγὼ": "I"
          "καὶ": "and"
          "σύ": "you"
      "ὕδωρ καὶ οἶνος.":
        "native": "Water and wine."
        "bases":
          "ὕδωρ": "water"
          "καὶ": "and"
          "οἶνος": "wine"
