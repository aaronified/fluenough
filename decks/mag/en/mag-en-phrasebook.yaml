schema: 1
id: "mag-en-phrasebook"
kind: "layer"
core: "mag-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty phrases to say whole from the first day, before their words are taught: greetings and goodbye, thanks and sorry, asking for slower speech, asking for help and where the toilet is. Not yet checked by a Magahi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
cards:
  "mag-0001":
    native: "hello"
    notes:
      "n1": "The usual greeting, said with the hands pressed together."
    bases:
      "प्रणाम": "hello"
  "mag-0002":
    native: "good morning"
    notes:
      "n1": "Said in the morning."
    bases:
      "सुप्रभात": "good morning"
  "mag-0003":
    native: "good evening"
    notes:
      "n1": "Said in the evening."
    bases:
      "शुभ": "auspicious; good"
      "संध्या": "evening"
  "mag-0004":
    native: "good night"
    notes:
      "n1": "Said at bedtime. रात (rāt) is 'night'."
    bases:
      "शुभ": "auspicious; good"
      "रात": "night"
  "mag-0005":
    native: "see you again"
    notes:
      "n1": "Literally 'there will be a meeting again'. Said when leaving."
    bases:
      "फेर": "again"
      "भेंट": "meeting"
      "होई": "will happen"
  "mag-0006":
    native: "please"
    notes:
      "n1": "Put before a request."
    bases:
      "कृपया": "please"
  "mag-0007":
    native: "thank you"
    notes:
      "n1": "Polite and common."
    bases:
      "धन्यवाद": "thank you"
  "mag-0008":
    native: "you're welcome; no problem"
    notes:
      "n1": "Literally 'there is no matter'. Said in reply to thanks."
    bases:
      "कौनो": "any"
      "बात": "matter"
      "नञ": "not"
  "mag-0009":
    native: "sorry"
    notes:
      "n1": "Said to say sorry."
    bases:
      "माफ": "forgiveness"
      "करू": "please do"
  "mag-0010":
    native: "excuse me"
    notes:
      "n1": "Literally 'please listen'. Said to get someone's attention."
    bases:
      "सुनीं": "excuse me"
  "mag-0011":
    native: "I don't understand"
    notes:
      "n1": "Literally 'it does not come into my understanding'."
    bases:
      "हमरा": "to me"
      "बुझ": "understanding"
      "में": "in"
      "नञ": "not"
      "आव": "come"
      "ह": "is"
  "mag-0012":
    native: "I don't know Magahi"
    notes:
      "n1": "Put another language's name in place of मगही (magahī)."
    bases:
      "हमरा": "to me"
      "मगही": "Magahi"
      "नञ": "not"
      "आवै": "comes"
      "ह": "is"
  "mag-0013":
    native: "please speak slowly"
    notes:
      "n1": "धीरे (dhīre) is 'slowly'."
    bases:
      "धीरे": "slowly"
      "बोलू": "speak"
  "mag-0014":
    native: "do you speak English?"
    notes:
      "n1": "Respectful."
    bases:
      "रउआ": "you (respectful)"
      "अंग्रेजी": "English"
      "बोल": "speak"
      "सकै": "can"
      "छी": "am; are"
  "mag-0015":
    native: "how are you?"
    notes:
      "n1": "Respectful."
    bases:
      "रउआ": "you (respectful)"
      "कइसे": "how"
      "छी": "am; are"
  "mag-0016":
    native: "I'm fine"
    notes:
      "n1": "The answer to how are you. ठीक (ṭhīk) is 'fine'."
    bases:
      "ठीक": "fine"
      "छी": "am; are"
  "mag-0017":
    native: "what is your name?"
    notes:
      "n1": "Respectful. The answer is हमार (hamār) नाम (nām) ... ह (ha)."
    bases:
      "रउआ": "you (respectful)"
      "के": "what; of"
      "की": "what"
      "ह": "is"
  "mag-0018":
    native: "my name is ..."
    notes:
      "n1": "Put your name where the dots are."
    bases:
      "हमार": "my"
      "ह": "is"
  "mag-0019":
    native: "where is the toilet?"
    notes:
      "n1": "शौचालय (śauchālay) is 'toilet'."
    bases:
      "शौचालय": "toilet"
      "ह": "is"
  "mag-0020":
    native: "help!"
    notes:
      "n1": "Shouted in an emergency."

    bases:
      "बचाबऽ": "help!"