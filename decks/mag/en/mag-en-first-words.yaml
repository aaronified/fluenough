schema: 1
id: "mag-en-first-words"
kind: "layer"
core: "mag-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "The first words of Magahi: the pronouns, yes and no, the numbers 1 to 10, the family, and the everyday words for food, house, name and time. Not yet checked by a Magahi speaker: please report any mistake."
cards:
  "mag-0101":
    native: "yes"
    notes:
      "n1": "The usual 'yes'."
    examples:
      "हँ, इ पानी हइ।":
        native: "Yes, this is water."
        bases:
          "हँ": "yes"
          "इ": "this"
          "पानी": "water"
          "हइ": "is"
  "mag-0102":
    native: "no; not"
    notes:
      "n1": "The negative. The Survey's text has 'na' before verbs (as in 'ok-ra na de-balai', no one gave him) and 'nahi' (as in 'ghar-me nahi jaibo', I will not go home). The verb 'to be' has its own negative, nahikhi. Source: Grierson, Linguistic Survey of India, vol. V part 2 (1903), the Magahi section and the list of words."
    examples:
      "ना, हम घर में नहीं जैबो।":
        native: "No, I will not go home."
        bases:
          "ना": "no"
          "हम": "I"
          "घर": "house"
          "में": "at"
          "नहीं": "not"
          "जैबो": "will go"
  "mag-0103":
    native: "I"
    notes:
      "n1": "The first person. The Survey has 'ham bhukhe mara-hi' for 'I am dying of hunger', so 'I am' is hi. Source: Grierson, Linguistic Survey of India, vol. V part 2 (1903), the Magahi section and the list of words."
    examples:
      "हम घर में ही।":
        native: "I am at home."
        bases:
          "हम": "I"
          "घर": "home"
          "में": "at"
          "ही": "am"
      "ई हमार घर हइ।":
        native: "This is my house."
        bases:
          "ई": "this"
          "हमार": "my"
          "घर": "home"
          "हइ": "is"
  "mag-0104":
    native: "you (to a friend or child)"
    notes:
      "n1": "The Survey gives tu or to for 'you' to one person, and tohar for 'your'. Source: Grierson, Linguistic Survey of India, vol. V part 2 (1903), the Magahi section and the list of words."
    examples:
      "तोहर घर।":
        native: "Your house."
        bases:
          "तोहर": "your"
          "घर": "home"
      "तू अउ हम।":
        native: "You and I."
        bases:
          "तू": "you"
          "अउ": "and"
          "हम": "I"
  "mag-0105":
    native: "he; she"
    notes:
      "n1": "One word for he, she and that. The Survey's text has 'u' for 'he'. Source: Grierson, Linguistic Survey of India, vol. V part 2 (1903), the Magahi section and the list of words."
    examples:
      "ऊ घर में हइ।":
        native: "He is at home."
        bases:
          "ऊ": "he"
          "घर": "home"
          "में": "at"
          "हइ": "is"
      "ऊ के हइ?":
        native: "Who is he?"
        bases:
          "ऊ": "he"
          "के": "who"
          "हइ": "is"
