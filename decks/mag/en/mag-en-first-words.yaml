      "n1": "The Survey gives hamnī (or ham sab) for 'we'. Source: Grierson, Linguistic Survey of India, vol. V part 2 (1903), the Magahi section and the list of words."
    examples:
      "हमनी अउ ऊ।":
        native: "We and he."
