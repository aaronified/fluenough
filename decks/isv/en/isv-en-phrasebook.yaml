schema: 1
id: isv-en-phrasebook
kind: layer
core: isv-phrasebook
native:
  code: en
  iso639_3: eng
  name: English
name: 'Phrasebook: first phrases'
description: 'Twenty phrases to say whole from the first day: greetings and goodbye, thanks and sorry, please, saying you are still learning Interslavic, and asking for the toilet. Not yet checked by an Interslavic speaker: please report any mistake.'
license: CC-BY-SA-4.0
tags:
- unreviewed
cards:
  isv-0011:
    native: hello
    notes:
      n1: The common greeting, said at any time of day.
    bases:
      Zdravo: hello
  isv-0012:
    native: good day
    notes:
      n1: Said in the daytime, to greet someone or to start a talk.
    bases:
      den: day
  isv-0013:
    native: goodbye
    notes:
      n1: Literally 'until seeing'.
    bases:
      Do: until
      vidženja: seeing
  isv-0014:
    native: thank you; thanks
    notes:
      n1: Common and polite. Among close friends, thanks is often left out.
    bases:
      Hvala: thanks
  isv-0015:
    native: excuse me; sorry
    notes:
      n1: The polite form, for an elder or a stranger. To a friend, say Izvin.
    bases:
      Izvinite: to excuse
  isv-0016:
    native: please
    notes:
      n1: Said before a request, or to ask for something.
    bases:
      Prošu: to ask; please
  isv-0017:
    native: I don't understand.
    notes:
      n1: 'The negative is ne before the verb: ne razumim, I do not understand.'
    bases:
      razumim: to understand
  isv-0018:
    native: Please speak slowly.
    notes:
      n1: The polite form of govoriti, to speak. medlenno is 'slowly'.
    bases:
      Govorite: to speak
      medlenno: slowly
      prošu: please
  isv-0019:
    native: I speak a little.
    notes:
      n1: malo is 'a little'. govorim is 'I speak', from govoriti.
    bases:
      govorim: to speak
      malo: a little
  isv-0020:
    native: Please help me.
    notes:
      n1: Literally 'help me, please'. mi is 'me'.
    bases:
      Pomožite: to help
      prošu: please
  isv-0021:
    native: Where is the toilet?
    notes:
      n1: kde is 'where'. je is 'is'.
    bases:
      Kde: where
      je: to be
      toalet: toilet
  isv-0022:
    native: How much is it?
    notes:
      n1: koliko asks how much. stoji is 'costs'.
    bases:
      Koliko: how much
      to: it
      stoji: to cost
  isv-0023:
    native: I don't know.
    notes:
      n1: znam is 'I know', from znati.
    bases:
      znam: to know
  isv-0024:
    native: I know a little Interslavic.
    notes:
      n1: Medžuslovjansky is the name of Interslavic in Interslavic.
    bases:
      malo: a little
      znam: to know
      medžuslovjansky: Interslavic
  isv-0025:
    native: good; well; OK
    notes:
      n1: The adverb of dobry. Said to say that something is fine.
    bases:
      Dobro: well; good
  isv-0026:
    native: OK; fine
    notes:
      n1: Said to agree, or to say that something is acceptable.
    bases:
      Ladno: OK; fine
  isv-0027:
    native: one moment
    notes:
      n1: Used to ask someone to wait.
    bases:
      moment: moment
  isv-0028:
    native: One coffee, please.
    notes:
      n1: jedna is 'one' with a feminine noun. Say it when you order.
    bases:
      kava: coffee
      prošu: please
  isv-0029:
    native: Please repeat it.
    notes:
      n1: Said when you did not catch what was said. povtoriti is 'to repeat'.
    bases:
      Povtorite: to repeat
      prošu: please
  isv-0030:
    native: Thanks for the help.
    notes:
      n1: Literally 'thanks for help'. za is 'for'.
    bases:
      Hvala: thanks
      za: for
      pomoč: help
