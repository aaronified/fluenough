# The order Interslavic is taught in, one unit per line, from every
# language it is taught from: each deck is named by its core id, and a
# learner from English is taught isv-en-home for isv-home (ADR-0013,
# ADR-0036).
#
# This is also Interslavic's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"):
# every unit from the first words to B1, with its size in words, its
# grammar topics, the three milestones, and for each planned unit its
# listening and reading passages. No Interslavic deck is written yet, so
# every unit is planned: the course teaches each as "Coming" until its deck
# is written. Sizes follow the plan's levels (about 700, 900 and 1,200
# words; low confidence) and are one number for every native language.
#
# The language's code is isv, its ISO 639-3 code, used for the folder and
# every id: Interslavic has no two-letter ISO 639-1 code, and isv is the
# code Wiktionary and the community use (#580; to confirm in the ISO 639-3
# register before the first deck).
#
# Interslavic is placed in tier II of docs/plans/language-paths-scheme.md
# (inferred; it is not on the FSI list). It is designed to be understood by
# Slavic speakers, and its grammar is regular, which puts it far below the
# natural Slavic languages' tier IV; but an English speaker still meets
# seven cases, three genders and verbal aspect, which puts it above
# Esperanto's tier I. As for German, the tier sets how many days a level
# takes, not how many words it holds, so the sizes stay near the plan's.
# A unit's words are its words to learn: a perfective made from a known
# imperfective by a prefix (pisati, napisati) is practised in the aspect
# rule's table and counts no word; a pair of two stems counts both.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"):
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units, the sounds unit first, all in the standard
#    Latin alphabet: a b c č d dž e ě f g h i j k l lj m n nj o p r s š t u
#    v y z ž. The course is written in Latin: every card's target is Latin,
#    and the háček letters are taught in the sounds unit and the script
#    guide (isv-script.yaml), not in alphabet decks;
# 3. the Cyrillic alphabet, Interslavic's second standard script, after
#    the first six word units ("After units 4-6"): the letters that look
#    and sound like Latin ones with the look-alikes that do not, then the
#    letters with no Latin twin (Є for ě, Ы for y, Ј, Љ, Њ and Џ for j,
#    lj, nj and dž), then reading words already known in Cyrillic. A
#    learner who learns without the alphabet skips them (#554);
# 4. a core of about 200 common words in themed units, before the large
#    tables ("Yes, smaller (~200)");
# 5. rules as forms, practised on the words already known: gender and
#    agreement, the plural, byti, the present, then the cases one by one;
# 6. sentences, each after its words and rules; then the other themes,
#    each its words, then its rules, then its sentences.
#
# Interslavic's grammar keeps the Slavic order of
# docs/plans/language-paths-scheme.md (2.6): sounds, script, greetings,
# numbers, gender, the present, then the cases: nominative, accusative,
# locative, genitive, dative, instrumental (and the vocative, the seventh),
# then the past, aspect pairs, verbs of motion, numerals with cases and the
# participles. Its own: the present in the simplified conjugation (each
# verb's present built from its infinitive by a few regular patterns,
# dělati: dělaju, dělaješ; govoriti: govorim, govoriš), the past as the
# l-form with or without byti, the future with budu, the conditional with
# by, and a B1 unit on the variant forms a reader meets in texts written
# by speakers of different Slavic languages.
#
# Interslavic is written with the standard orthography: the Latin above
# and its Cyrillic. The etymological alphabet (å ę ų ȯ ė ŕ ĺ ľ ń ť ď ś ź
# and so on, which shows each word's Proto-Slavic sounds) is not taught:
# whether a later unit teaches reading it is an open question (#580).
#
# The core's order is by judgement, most common first: about me, everyday
# verbs, the common adverbs and function words, how much and how many,
# describing words, where things are, more verbs. It was meant to come from
# Wikipedia's counts (tools/wikipedia_frequency.py, #516); Interslavic has
# no Wikipedia, so it is to come from a corpus of Interslavic texts, or
# stays by judgement.
#
# A planned unit holds one core id. Where a written unit will hold more
# than one deck, the others are named in a comment over the unit they
# join; a theme's sentence deck, isv-<theme>-sentences, joins its theme's
# unit once written.
#
# Script units not written yet. The format has no planned form for an
# alphabet unit, which counts neither words nor grammar: a planned unit is
# a theme, which counts words, or a grammar topic. So each planned
# Cyrillic unit is planned as a grammar unit of 0 words with a topic named
# script-..., and when its deck is written it becomes a plain list unit,
# its deck goes into alphabet, and its topic leaves the grammar count.
# The path has no alphabet list until then: alphabet names only decks the
# path lists, and a planned unit is none.
#
# Every deck of Interslavic is listed exactly once.
schema: 1
kind: "path"
id: "isv-path"
language: "isv"
# The gender classes a noun's gender is one of (#512; DECK-FORMAT.md, Card
# data): masculine, feminine and neuter. The masculine animate is no class
# of its own: it is a masculine noun whose accusative is its genitive
# (brata, but dom), taught as a row of the accusative's rule, and said in
# the notes of each animate masculine noun's card.
genders: ["m", "f", "n"]
# Where a rater's Interslavic comes from, for a rater's region and a card's
# region note (ADR-0036): the Slavic branch of the rater's own language.
# Interslavic has no dialect regions, but it is built to be understood
# across the Slavic languages, and how natural or clear a word is differs
# by the branch the reader speaks (a word clear to a Pole may be rare to a
# Bulgarian). The app's Languages you know lists no Slavic language, so it
# cannot tell; the branch can. South Slavic is split in two, since
# Bulgarian and Macedonian, which have lost most cases, read Interslavic
# differently from Slovene and the Serbo-Croatian standards. The ids are
# permanent, as card ids are; rename a name, never an id. The app adds
# "Elsewhere" after them, for a rater who speaks no Slavic language.
regions:
  - id: "east-slavic"
    name: { "en": "East Slavic (Russian, Ukrainian, Belarusian, Rusyn)" }
  - id: "west-slavic"
    name: { "en": "West Slavic (Polish, Czech, Slovak, Sorbian, Kashubian)" }
  - id: "western-south-slavic"
    name: { "en": "Western South Slavic (Slovene, Croatian, Serbian, Bosnian, Montenegrin)" }
  - id: "eastern-south-slavic"
    name: { "en": "Eastern South Slavic (Bulgarian, Macedonian)" }
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  # 1. The phrasebook, taught whole from the first lesson.
  # isv-first-words joins it when written.
  # The first words are written: isv-first-words is taught with the
  # phrasebook (10 words).
  - decks: ["isv-phrasebook", "isv-first-words", "*"]
    words: 10
  # 2. The first word units, in the Latin alphabet. The sounds first: č š
  # ž and dž, c said ts, h, j said y, lj and nj, y and i, ě (said e or je,
  # as the reader's own language has it), and a stress that is not fixed.
  - planned: { id: "isv-sound-differences", grammar: ["sound-differences", "hacek-letters"], words: 12 }
    listening_passages:
      - { id: "sounds-alike", text: { "en": "Pairs said one after the other: c and č, s and š, z and ž, l and lj" } }
    reading_passages:
      - { id: "hacek-words", text: { "en": "A short list of everyday words spelled with č, š, ž and ě" } }
  - planned: { id: "isv-questions", theme: "questions", words: 15 }
    listening_passages:
      - { id: "asking-around", text: { "en": "Asking kto, čto, kde and kogda at a station" } }
    reading_passages:
      - { id: "tourist-leaflet", text: { "en": "A leaflet answering the questions a visitor asks" } }
  - planned: { id: "isv-addressing", theme: "addressing", words: 15 }
    listening_passages:
      - { id: "meeting-a-neighbour", text: { "en": "Greeting a neighbour with ty and an older stranger with vy, gospodin and gospoža" } }
    reading_passages:
      - { id: "name-badges", text: { "en": "Name badges at a meeting, with first names and countries" } }
  - planned: { id: "isv-pronouns", theme: "pronouns", words: 20 }
    listening_passages:
      - { id: "who-is-who", text: { "en": "Pointing out who is who at a family gathering: on, ona, oni" } }
    reading_passages:
      - { id: "seating-chart", text: { "en": "A seating chart for a party, with names and who sits where" } }
  - planned: { id: "isv-family", theme: "family", words: 30 }
    listening_passages:
      - { id: "my-family", text: { "en": "Someone describes the people in a family photo" } }
    reading_passages:
      - { id: "family-tree", text: { "en": "A small family tree with names and relations" } }
  - planned: { id: "isv-numbers-1-20", theme: "numbers-1-20", words: 20 }
    listening_passages:
      - { id: "counting-aloud", text: { "en": "Counting objects aloud, from one to twenty" } }
    reading_passages:
      - { id: "room-numbers", text: { "en": "Room numbers on a row of doors" } }
  # 3. The Cyrillic alphabet, after the first six word units (#554:
  # skipped by a learner who learns without it). Planned as grammar units
  # of 0 words until written (see the header).
  - planned: { id: "isv-cyrillic-shared", grammar: "script-cyrillic-shared", words: 0 }
    listening_passages:
      - { id: "same-and-false-letters", text: { "en": "Letters that look and sound as in Latin, А (a), Е (e), К (k), М (m), О (o), Т (t), and the look-alikes that do not: В (v), Н (n), Р (r), С (s), У (u), Х (h)" } }
    reading_passages:
      - { id: "first-cyrillic-signs", text: { "en": "Short signs written in Cyrillic with these letters only: a metro sign, a taxi, a café" } }
  - planned: { id: "isv-cyrillic-own", grammar: "script-cyrillic-own", words: 0 }
    listening_passages:
      - { id: "cyrillic-own-letters", text: { "en": "The letters with no Latin look-alike, each said with a known word: Б (b), Г (g), Д (d), Ж (ž), З (z), И (i), Л (l), П (p), Ф (f), Ц (c), Ч (č), Ш (š), and Є (ě), Ы (y), Ј (j), Љ (lj), Њ (nj), Џ (dž)" } }
    reading_passages:
      - { id: "letter-pairs-chart", text: { "en": "A chart of the Latin and Cyrillic alphabets side by side, one letter for one letter" } }
  - planned: { id: "isv-cyrillic-reading", grammar: "script-cyrillic-reading", words: 0 }
    listening_passages:
      - { id: "known-words-in-cyrillic", text: { "en": "Known words heard, then found on a list written in Cyrillic: the family, the numbers, the questions" } }
    reading_passages:
      - { id: "two-script-notice", text: { "en": "A short notice printed twice, in Latin and in Cyrillic, as Interslavic sites often do" } }
  # 4. The core: about 200 common words, most common first (by judgement
  # until a corpus count is written).
  - planned: { id: "isv-about-me", theme: "about-me", words: 25 }
    listening_passages:
      - { id: "introducing-yourself", text: { "en": "Introducing yourself to a new member of an online language group" } }
    reading_passages:
      - { id: "registration-form", text: { "en": "A simple registration form: name, age, country, languages" } }
  - planned: { id: "isv-everyday-verbs", theme: "everyday-verbs", words: 40 }
    listening_passages:
      - { id: "morning-routine", text: { "en": "A mother says what each person in the house does in the morning" } }
    reading_passages:
      - { id: "fridge-note", text: { "en": "A note on the fridge: what to eat, what to drink and where things are" } }
  - planned: { id: "isv-adverbs", theme: "adverbs", words: 30 }
    listening_passages:
      - { id: "how-often", text: { "en": "Saying how often and how well things are done: uže, ješče, često, dobro" } }
    reading_passages:
      - { id: "habit-survey", text: { "en": "A short survey about everyday habits" } }
  - planned: { id: "isv-quantities", theme: "quantities", words: 25 }
    listening_passages:
      - { id: "at-the-grocers", text: { "en": "Asking how much and how many at a grocer's: koliko, mnogo, malo" } }
    reading_passages:
      - { id: "recipe-amounts", text: { "en": "A recipe card with amounts" } }
  - planned: { id: "isv-describing", theme: "describing", words: 35 }
    listening_passages:
      - { id: "how-are-you-feeling", text: { "en": "A friend asks how you feel today, and you answer" } }
    reading_passages:
      - { id: "postcard-from-the-coast", text: { "en": "A short postcard: the weather and the food" } }
  - planned: { id: "isv-location", theme: "location", words: 15 }
    listening_passages:
      - { id: "where-are-my-keys", text: { "en": "Looking for keys: here, there, in, on, under, beside" } }
    reading_passages:
      - { id: "room-description", text: { "en": "A short description of a room and where its furniture is" } }
  - planned: { id: "isv-more-verbs", theme: "more-verbs", words: 25 }
    listening_passages:
      - { id: "after-work", text: { "en": "Two friends say what they do after work" } }
    reading_passages:
      - { id: "weekly-plan", text: { "en": "A weekly plan for a household: who goes where and does what" } }
  # 5. Rules as forms, practised on the words known: gender by a noun's
  # ending and the adjective that agrees with it (novy dom, nova kniga,
  # novo selo), the plural, byti, the present, negation and questions, the
  # accusative with its animate row, then the possessives.
  - planned: { id: "isv-grammar-gender", grammar: ["noun-gender", "adjective-agreement"] }
    listening_passages:
      - { id: "a-new-house", text: { "en": "Someone shows a new house, a new car and a new garden, each adjective agreeing with its noun" } }
    reading_passages:
      - { id: "gender-chart", text: { "en": "A chart of known nouns sorted by their endings: a consonant, -a, -o or -e" } }
  - planned: { id: "isv-grammar-plural", grammar: ["nominative-plural"] }
    listening_passages:
      - { id: "one-and-many", text: { "en": "A child counts what is on a table: one and many of each" } }
    reading_passages:
      - { id: "fruit-labels", text: { "en": "Labels on boxes of fruit, one and many" } }
  - planned: { id: "isv-grammar-byti", grammar: ["byti-present"] }
    listening_passages:
      - { id: "who-and-where", text: { "en": "Saying who someone is and where they are: jesm, jesi, jest, sut" } }
    reading_passages:
      - { id: "status-messages", text: { "en": "Short status messages: who is where" } }
  # The simplified conjugation: the present built from the infinitive by
  # a few regular patterns, the -e- verbs (dělati, piti) and the -i- verbs
  # (govoriti, viděti).
  - planned: { id: "isv-grammar-present", grammar: ["present-e-verbs", "present-i-verbs"] }
    listening_passages:
      - { id: "what-we-do-now", text: { "en": "Friends say what they do now: each verb in the six persons" } }
    reading_passages:
      - { id: "conjugation-card", text: { "en": "A card showing how a known verb's present is built from its infinitive" } }
  - planned: { id: "isv-grammar-negation-questions", grammar: ["negation-ne", "yes-no-questions"] }
    listening_passages:
      - { id: "yes-or-no", text: { "en": "Asking yes-or-no questions and answering da and ne" } }
    reading_passages:
      - { id: "quiz-card", text: { "en": "A short yes-or-no quiz on a café table" } }
  # The accusative, with its masculine animate row: vidim dom, but vidim
  # brata.
  - planned: { id: "isv-grammar-accusative", grammar: ["accusative-singular", "accusative-animate"] }
    listening_passages:
      - { id: "who-sees-what", text: { "en": "Saying who sees, eats and buys what, the ending showing the object" } }
    reading_passages:
      - { id: "brother-and-house", text: { "en": "Short sentences in pairs: seeing a house and seeing a brother, where only the animate noun changes" } }
  - planned: { id: "isv-grammar-possessives", grammar: ["possessive-pronouns"] }
    listening_passages:
      - { id: "whose-is-it", text: { "en": "Sorting out whose bag, whose book and whose keys are on a table: moj, tvoj, naš, vaš" } }
    reading_passages:
      - { id: "lost-property-tags", text: { "en": "Name tags on lost things, each with its owner" } }
  # 6. Then the other A1 themes, each its words, its rules, then its
  # sentences.
  - planned: { id: "isv-work", theme: "work", words: 35 }
    listening_passages:
      - { id: "what-do-you-do", text: { "en": "Two people ask each other what they do for a living" } }
    reading_passages:
      - { id: "business-card", text: { "en": "A business card and a short job description" } }
  - planned: { id: "isv-numbers-big", theme: "numbers-big", words: 20 }
    listening_passages:
      - { id: "big-numbers", text: { "en": "Hearing prices, years and phone numbers" } }
    reading_passages:
      - { id: "price-tags", text: { "en": "Price tags and a bus-route number board" } }
  - planned: { id: "isv-market", theme: "market", words: 40 }
    listening_passages:
      - { id: "at-the-market", text: { "en": "Buying fruit and vegetables at a market stall" } }
    reading_passages:
      - { id: "market-price-board", text: { "en": "A price board at a market" } }
  - planned: { id: "isv-groceries", theme: "groceries", words: 35 }
    listening_passages:
      - { id: "shopping-list-aloud", text: { "en": "Two people go through a shopping list" } }
    reading_passages:
      - { id: "shopping-list", text: { "en": "A handwritten shopping list" } }
  - planned: { id: "isv-food", theme: "food", words: 50 }
    listening_passages:
      - { id: "ordering-a-meal", text: { "en": "Choosing dishes from a menu" } }
    reading_passages:
      - { id: "menu-card", text: { "en": "A restaurant menu card with dishes and prices" } }
  # The locative, after v and na: v domu, na stolu.
  - planned: { id: "isv-grammar-locative", grammar: ["locative-singular", "prepositions-v-na"] }
    listening_passages:
      - { id: "where-it-is", text: { "en": "Saying where things and people are: in the house, on the table, at work" } }
    reading_passages:
      - { id: "museum-plan", text: { "en": "A museum plan: what is in which room and on which floor" } }
  - planned: { id: "isv-transport", theme: "transport", words: 35 }
    listening_passages:
      - { id: "bus-stop", text: { "en": "Asking which bus goes to the centre" } }
    reading_passages:
      - { id: "timetable", text: { "en": "A bus and tram timetable" } }
  - planned: { id: "isv-directions", theme: "directions", words: 30 }
    listening_passages:
      - { id: "asking-the-way", text: { "en": "Asking the way to the station and being told" } }
    reading_passages:
      - { id: "simple-map", text: { "en": "A simple map with a route in words" } }
  # The past: the l-form, by gender and number (dělal, dělala, dělali),
  # with byti or without it (ja jesm dělal, ja dělal).
  - planned: { id: "isv-grammar-past", grammar: ["past-l-form"] }
    listening_passages:
      - { id: "yesterday", text: { "en": "Saying what each person did yesterday, a man's and a woman's past apart" } }
    reading_passages:
      - { id: "diary-line", text: { "en": "A diary line for yesterday" } }
  - planned: { id: "isv-body", theme: "body", words: 30 }
    listening_passages:
      - { id: "at-the-doctors", text: { "en": "Telling a doctor where it hurts" } }
    reading_passages:
      - { id: "stretching-chart", text: { "en": "A chart of simple morning stretches" } }
  - planned: { id: "isv-places", theme: "places", words: 40 }
    listening_passages:
      - { id: "walk-to-the-market", text: { "en": "A neighbour names the places you pass on the way to the market" } }
    reading_passages:
      - { id: "street-signs", text: { "en": "Signs along a street: pharmacy, school, bank, post office" } }
  # The genitive: of, from, without, and after a quantity (šalka kavy,
  # mnogo vody).
  - planned: { id: "isv-grammar-genitive", grammar: ["genitive-singular", "genitive-of-quantity"] }
    listening_passages:
      - { id: "a-cup-of-coffee", text: { "en": "Ordering a cup of coffee, a glass of water and a piece of cake" } }
    reading_passages:
      - { id: "whose-and-how-much", text: { "en": "A short list of whose things are where, and how much of each is left" } }
  - planned: { id: "isv-home", theme: "home", words: 40 }
    listening_passages:
      - { id: "a-flat-tour", text: { "en": "A tour of a flat, room by room" } }
    reading_passages:
      - { id: "flat-advert", text: { "en": "A short advert for a flat to rent" } }
  - planned: { id: "isv-time", theme: "time", words: 30 }
    listening_passages:
      - { id: "what-time-is-it", text: { "en": "Asking and telling the time" } }
    reading_passages:
      - { id: "opening-hours", text: { "en": "The opening hours on a shop door" } }
  # mogti, hotěti and musiti with an infinitive.
  - planned: { id: "isv-grammar-modal-verbs", grammar: ["modal-infinitive"] }
    listening_passages:
      - { id: "can-want-must", text: { "en": "Saying what you can, want and must do this weekend" } }
    reading_passages:
      - { id: "invitation-note", text: { "en": "A note inviting a friend, with what each can bring" } }
  - planned: { id: "isv-help", theme: "help", words: 20 }
    listening_passages:
      - { id: "lost-in-the-city", text: { "en": "Asking for help when lost" } }
    reading_passages:
      - { id: "emergency-numbers", text: { "en": "A card of emergency numbers and what to say" } }
    milestone: "A1"
  # A2: the themes and grammar of the CEFR's A2, each its words, its rules,
  # then its sentences.
  - planned: { id: "isv-daily-life", theme: "daily-life", words: 45 }
    listening_passages:
      - { id: "a-normal-day", text: { "en": "Someone talks through an ordinary day" } }
    reading_passages:
      - { id: "daily-timetable", text: { "en": "A timetable for a day: wake, work, eat, sleep" } }
  # The dative: giving and telling to someone (dati bratu, pisati sestrě).
  - planned: { id: "isv-grammar-dative", grammar: ["dative-singular"] }
    listening_passages:
      - { id: "presents-for-everyone", text: { "en": "A family decides which present to give to whom" } }
    reading_passages:
      - { id: "gift-tags", text: { "en": "Gift tags: to mother, to brother, to a friend" } }
  - planned: { id: "isv-calendar", theme: "calendar", words: 35 }
    listening_passages:
      - { id: "making-a-date", text: { "en": "Fixing a day and a time with a friend" } }
    reading_passages:
      - { id: "wall-calendar", text: { "en": "A wall calendar with appointments" } }
  # The instrumental: with, by means of, and after s, pod, nad, pred, za.
  - planned: { id: "isv-grammar-instrumental", grammar: ["instrumental-singular", "prepositions-instrumental"] }
    listening_passages:
      - { id: "with-whom", text: { "en": "Saying who you go with, and what you write and travel with" } }
    reading_passages:
