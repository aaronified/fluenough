passages:
  - id: "ta-park-signs"
    title: "Signs in a park"
    sentences:
      - text: "பூவைத் தொடாதே."
        reading: "pūvait toṭātē."
        ipa: "puːʋait̪ t̪oʈaːt̪eː"
      - text: "புல்லில் நடக்காதே."
        reading: "pullil naṭakkātē."
        ipa: "pullil naʈakkaːt̪eː"
      - text: "குப்பை போடாதே."
        reading: "kuppai pōṭātē."
        ipa: "kuppai poːʈaːt̪eː"
      - text: "குளத்தில் இறங்காதே."
        reading: "kuḷattil iṟaṅkātē."
        ipa: "kuɭat̪t̪il iraŋkaːt̪eː"
    questions:
      - id: "ta-9947"
        prompt: { en: "What must you not touch?" }
        options:
          - { en: "The flowers" }
          - { en: "The trees" }
          - { en: "The bench" }
        answer: 1
      - id: "ta-9948"
        prompt: { en: "Where must you not walk?" }
