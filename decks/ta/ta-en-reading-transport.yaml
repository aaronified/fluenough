  - id: "ta-bus-board"
    title: "A bus board"
    sentences:
      - text: "பேருந்து காலை மணி ஆறு."
        reading: "pēruntu kālai maṇi āṟu."
        ipa: "peːɾunt̪u kaːlai maɳi aːru"
      - text: "ரயில் மாலை மணி எட்டு."
        reading: "rayil mālai maṇi eṭṭu."
        ipa: "ɾajil maːlai maɳi eʈʈu"
      - text: "ஆட்டோ இருக்கிறது."
        reading: "āṭṭō irukkiṟatu."
        ipa: "aːʈʈoː iɾukkirat̪u"
      - text: "டாக்சி இல்லை."
        reading: "ṭākci illai."
        ipa: "ʈaːktʃi illai"
    questions:
      - id: "ta-9753"
        prompt: { en: "When does the bus go?" }
        options:
          - { en: "At six in the morning" }
          - { en: "At six in the evening" }
          - { en: "At eight at night" }
        answer: 1
      - id: "ta-9754"
        prompt: { en: "Which one is not there?" }
        options:
          - { en: "The auto" }
          - { en: "The taxi" }
          - { en: "The train" }
        answer: 2
      - id: "ta-9755"
        prompt: { en: "The train goes in the evening." }
