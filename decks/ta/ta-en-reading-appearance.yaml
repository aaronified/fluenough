passages:
  - id: "ta-lost-and-found"
    title: "Lost and found"
    sentences:
      - text: "இங்கே ஒரு கருப்பு பெல்ட் இருக்கிறது."
        reading: "iṅkē oru karuppu pelṭ irukkiṟatu."
        ipa: "iŋkeː oɾu kaɾuppu pelʈ iɾukkirat̪u"
      - text: "ஒரு சிவப்பு கைக்குட்டை இருக்கிறது."
        reading: "oru civappu kaikkuṭṭai irukkiṟatu."
        ipa: "oɾu siʋappu kaikkuʈʈai iɾukkirat̪u"
      - text: "ஒரு தங்க மோதிரம் இருக்கிறது."
        reading: "oru taṅka mōtiram irukkiṟatu."
        ipa: "oɾu t̪aŋka moːt̪iɾam iɾukkirat̪u"
      - text: "உங்கள் பொருள் இங்கே இருக்கிறதா?"
        reading: "uṅkaḷ poruḷ iṅkē irukkiṟatā?"
        ipa: "uŋkaɭ poɾuɭ iŋkeː iɾukkirat̪aː"
    questions:
