  - id: "ta-itinerary"
    title: "Our travel plan"
    sentences:
      - text: "காலை ஏழு மணிக்கு ரயில்நிலையம் வருகிறோம்."
        reading: "kālai ēḻu maṇikku rayilnilaiyam varukiṟōm."
        ipa: "kaːlai eːɻu maɳikku ɾajilnilaijam ʋaɾukiroːm"
      - text: "எட்டு மணிக்கு தங்குமிடத்துக்குப் போகிறோம்."
        reading: "eṭṭu maṇikku taṅkumiṭattukkup pōkiṟōm."
        ipa: "eʈʈu maɳikku t̪aŋkumiʈat̪t̪ukkup poːkiroːm"
      - text: "மதியம் சுற்றுலாத்தலத்தைப் பார்வையிடுகிறோம்."
        reading: "matiyam cuṟṟulāttalattaip pārvaiyiṭukiṟōm."
        ipa: "mat̪ijam surrulaːt̪t̪alat̪t̪aip paːɾʋaijiʈukiroːm"
      - text: "இரவு வாடகைவண்டியில் திரும்புகிறோம்."
        reading: "iravu vāṭakaivaṇṭiyil tirumpukiṟōm."
        ipa: "iɾaʋu ʋaːʈakaiʋaɳʈijil t̪iɾumpukiroːm"
      - text: "நாளை படகுச்சவாரி இருக்கிறது."
        reading: "nāḷai paṭakuccavāri irukkiṟatu."
        ipa: "naːɭai paʈakutʃtʃaʋaːɾi iɾukkirat̪u"
