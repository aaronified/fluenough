# Tamil culture 3: didactic verse and the first novel, each a short passage of the Tamil text as printed on the cited Wikisource page (wiki/Plan-Culture-Tamil.md, TA-012). The sayings attributed to Avvaiyar are anonymous sources (the page gives only a century); the novel has a named author who died in 1889. The two later novels of the plan were dropped because the Wikisource pages read are a critic's modern summary, not the novels' text.
