    title: "A school timetable"
    sentences:
      - text: "திங்கள் தமிழ் வகுப்பு."
        reading: "tiṅkaḷ tamiḻ vakuppu."
        ipa: "t̪iŋkaɭ t̪amiɻ ʋakuppu"
      - text: "செவ்வாய் கணக்கு வகுப்பு."
        reading: "cevvāy kaṇakku vakuppu."
        ipa: "seʋʋaːj kaɳakku ʋakuppu"
      - text: "புதன் அறிவியல் வகுப்பு."
        reading: "putaṉ aṟiviyal vakuppu."
        ipa: "put̪an ariʋijal ʋakuppu"
      - text: "வியாழன் ஆங்கிலம்."
        reading: "viyāḻaṉ āṅkilam."
        ipa: "ʋijaːɻan aːŋkilam"
      - text: "வெள்ளி நூலகம்."
        reading: "veḷḷi nūlakam."
        ipa: "ʋeɭɭi nuːlakam"
