passages:
  - id: "ta-help-desk-sign"
    title: "A help desk sign"
    sentences:
      - text: "உதவிக்கு இங்கே வாருங்கள்."
        reading: "utavikku iṅkē vāruṅkaḷ."
        ipa: "ut̪aʋikku iŋkeː ʋaːɾuŋkaɭ"
      - text: "பிரச்சினை இருக்கிறதா? இங்கே சொல்லுங்கள்."
        reading: "piracciṉai irukkiṟatā? iṅkē colluṅkaḷ."
        ipa: "piɾatʃtʃinai iɾukkirat̪aː iŋkeː solluŋkaɭ"
      - text: "போலீஸ் அருகில் இருக்கிறது."
        reading: "pōlīs arukil irukkiṟatu."
        ipa: "poːliːs aɾukil iɾukkirat̪u"
    questions:
      - id: "ta-9924"
        prompt: { en: "What does the sign ask you to do if you have a problem?" }
        options:
          - { en: "Tell them here" }
          - { en: "Go home" }
          - { en: "Wait outside" }
        answer: 1
      - id: "ta-9925"
        prompt: { en: "The police are far away." }
        answer: false
