id: ta-facts
name: "Tamil facts"
kind: facts
language: { code: ta, iso639_3: tam, name: Tamil, script: tamil, tts: ta-IN, icon: "த" }
license: "CC-BY-SA-4.0"
description: "One true, surprising thing about Tamil a day, in English. Not yet checked by a Tamil speaker: please report any mistake."
facts:
  - id: ta-fact-001
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Tamil_language"
    text:
      en: "Tamil has been attested since about 300 BCE, which makes it one of the oldest languages still spoken every day. Scholars call 300 BCE to 700 CE Old Tamil, 700 to 1600 Middle Tamil and 1600 onward Modern Tamil."
  - id: ta-fact-002
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Tolk%C4%81ppiyam"
    text:
      en: "The Tolkāppiyam is the oldest surviving Tamil grammar and the oldest surviving long work of Tamil literature. It has three books of nine chapters each and 1,610 verses in all, and tradition credits one author, Tolkāppiyar."
  - id: ta-fact-003
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Tolk%C4%81ppiyam"
    text:
      en: "Scholars do not agree on when the Tolkāppiyam was written. Kamil Zvelebil puts its core no earlier than 150 BCE, while Herman Tieken dates it to the 9th century CE at the earliest."
  - id: ta-fact-004
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Sangam_literature"
    text:
      en: "The Sangam corpus holds 2,381 poems by 473 poets, and about 102 of the poems have no known author. At least 27 of the poets were women."
  - id: ta-fact-005
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Sangam_literature"
    text:
      en: "About three quarters of Sangam poetry is akam, poems of inner life such as love, and about one quarter is puram, poems of the outer world such as war and public life."
  - id: ta-fact-006
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Sangam_literature"
    text:
      en: "Sangam poems set each mood in a landscape called a tinai: kurinji for mountains, mullai for forest pasture, marutam for farmland, neytal for the coast and palai for dry land."
  - id: ta-fact-007
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Sangam_literature"
    text:
      en: "Kapilar is the most prolific Sangam poet, with just under a tenth of the whole corpus. Sixteen poets together account for about half of it."
  - id: ta-fact-008
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Sangam_literature"
    text:
      en: "The Sangam poems were lost for much of the second millennium. U. V. Swaminatha Iyer found major collections in 1883 at the Thiruvavaduthurai monastery and first printed the Ten Idylls in 1889."
  - id: ta-fact-009
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Tirukku%E1%B9%9Ba%E1%B8%B7"
    text:
      en: "The Tirukkuṟaḷ has 1,330 couplets, each of seven words, grouped into 133 chapters of ten couplets. Every couplet is in the same metre, the kural venba."
  - id: ta-fact-010
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Tirukku%E1%B9%9Ba%E1%B8%B7"
    text:
      en: "The Tirukkuṟaḷ has three books: Aṟam (virtue) with 38 chapters, Poruḷ (wealth and polity) with 70 chapters, and Inbam (love) with 25 chapters."
  - id: ta-fact-011
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Tirukku%E1%B9%9Ba%E1%B8%B7"
    text:
      en: "The Tirukkuṟaḷ has been translated into at least 57 languages, Indian and non-Indian."
  - id: ta-fact-012
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Thiruvalluvar_Statue"
    text:
      en: "The Thiruvalluvar Statue at Kanniyakumari is 133 feet tall with its pedestal, one foot for each of the 133 chapters of the Tirukkuṟaḷ. Its 38-foot pedestal stands for the 38 chapters on virtue."
  - id: ta-fact-013
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Thiruvalluvar_Statue"
    text:
      en: "The Thiruvalluvar Statue was unveiled on 1 January 2000. The Indian Ocean tsunami hit the monument on 26 December 2004, and it stood unaffected."
  - id: ta-fact-014
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Silappatikaram"
    text:
      en: "The Silappatikaram, the story of an anklet, follows Kannaki and her husband Kovalan through three cities: Puhar, Madurai and Vanci. English Wikipedia calls it the earliest Tamil epic and says its traditional author, Ilango Adigal, described as a Jain monk and former prince, is a doubtful attribution."
  - id: ta-fact-015
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Classical_languages_of_India"
    text:
      en: "Tamil was the first language India declared classical, on 12 October 2004. Sanskrit followed in 2005, and Telugu and Kannada in 2008."
  - id: ta-fact-016
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Classical_languages_of_India"
    text:
      en: "For classical status, India asks that a language's early texts be 1,500 to 2,000 years old. In 2004 the age asked for was only 1,000 years."
  - id: ta-fact-017
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Tamil_language"
    text:
      en: "Tamil is official in the Indian state of Tamil Nadu and the union territory of Puducherry, and it is an official language of Singapore and of Sri Lanka."
  - id: ta-fact-018
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Tamil_language"
    text:
      en: "By the Ethnologue's figures for 2011 to 2019, about 79 million people speak Tamil as a first language, and about 86 million speak it in all."
  - id: ta-fact-019
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Tamil_language"
    text:
      en: "About 60,000 of the roughly 100,000 inscriptions that the Archaeological Survey of India has found in India are in Tamil Nadu."
  - id: ta-fact-020
    tags: [script]
    source: "https://en.wikipedia.org/wiki/Tamil_language"
    text:
      en: "The Tamil script has 12 vowels, 18 consonants and one special letter, the āytam, written ஃ (ḵ). With 216 compound characters, English Wikipedia counts 247 characters in all."
  - id: ta-fact-021
    tags: [script]
    source: "https://en.wikipedia.org/wiki/Tamil_script"
    text:
      en: "A Tamil consonant carries a vowel unless a dot, the pulli, புள்ளி (puḷḷi), is written over it to cancel the vowel. Tamil is written from left to right."
  - id: ta-fact-022
    tags: [script]
    source: "https://en.wikipedia.org/wiki/Tamil_script"
    text:
      en: "Tamil rarely joins consonants into ligatures. English Wikipedia gives க்ஷ (kṣa) and ஶ்ரீ (śrī) as the exceptions."
  - id: ta-fact-023
    tags: [script]
    source: "https://en.wikipedia.org/wiki/Tamil_script"
    text:
      en: "Six letters taken from the Grantha script, ஜ (ja), ஶ (śa), ஷ (ṣa), ஸ (sa), ஹ (ha) and க்ஷ (kṣa), are used for sounds that are not native to Tamil."
  - id: ta-fact-024
    tags: [script]
    source: "https://en.wikipedia.org/wiki/Tamil_language"
    text:
      en: "Tamil spelling does not tell apart voiced and unvoiced stops: one letter stands for both, and which one is said depends on where it falls in the word."
  - id: ta-fact-025
    tags: [script]
    source: "https://en.wikipedia.org/wiki/Tamil_script"
    text:
      en: "The Tamil block of Unicode, U+0B80 to U+0BFF, was added in October 1991 with Unicode 1.0.0."
  - id: ta-fact-026
    tags: [script]
    source: "https://en.wikipedia.org/wiki/Tamil_Brahmi"
    text:
      en: "Tamil-Brahmi, the script of the earliest Tamil records, is dated roughly between the 3rd century BCE and the 1st century CE. It was written on cave entrances and stone beds, pottery, coins, seals and rings."
  - id: ta-fact-027
    tags: [script]
    source: "https://en.wikipedia.org/wiki/Tamil_Brahmi"
    text:
      en: "Tamil-Brahmi added signs for sounds that Prakrit does not have. Iravatham Mahadevan showed in the late 1960s that its inscriptions are mostly in Tamil words."
  - id: ta-fact-028
    tags: [pronunciation]
    source: "https://en.wikipedia.org/wiki/Tamil_language"
    text:
      en: "Tamil has a voiced retroflex approximant, written ழ் (ḻ), as one of its consonants. The Tamil script gives it a letter of its own."
  - id: ta-fact-029
    tags: [grammar]
    source: "https://en.wikipedia.org/wiki/Tamil_language"
    text:
      en: "Tamil is agglutinative: endings are added to a word one after another to build long forms. It has no consonant clusters at the beginning of words."
  - id: ta-fact-030
    tags: [grammar]
    source: "https://en.wikipedia.org/wiki/Tamil_language"
    text:
      en: "Tamil has a written and a spoken register, a situation called diglossia. English Wikipedia names three forms: sankattamiḻ (classical), centamiḻ (modern literary) and koṭuntamiḻ (colloquial)."
  - id: ta-fact-031
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Tamil_Nadu"
    text:
      en: "Tamil Nadu had 72,147,030 people in the 2011 census and has 38 districts, and its capital is Chennai. Its motto is 'Vāymaiyē Vellum', 'truth alone triumphs'."
  - id: ta-fact-032
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Tamil_Nadu"
    text:
      en: "Madras State was renamed Tamil Nadu on 14 January 1969. Tamil is its official language, with English as an additional one."
  - id: ta-fact-033
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Tamil_Nadu"
    text:
      en: "Tamil Nadu's state animal is the Nilgiri tahr, its bird the emerald dove, its flower the gloriosa lily, its tree the palmyra palm and its fruit the jackfruit."
  - id: ta-fact-034
    tags: [culture]
    source: "https://en.wikipedia.org/wiki/Pongal_(festival)"
    text:
      en: "In Tamil, Pongal means 'boiling over'. The harvest festival is dedicated to the sun, and its dish is rice boiled with milk and jaggery."
  - id: ta-fact-035
    tags: [culture]
    source: "https://en.wikipedia.org/wiki/Pongal_(festival)"
    text:
      en: "Thai Pongal usually falls on 14 or 15 January, in Thai, the tenth month of the Tamil calendar. The festival lasts three or four days, and its named days are Bhogi, Thai Pongal, Mattu Pongal and Kaanum Pongal."
  - id: ta-fact-036
    tags: [culture]
    source: "https://en.wikipedia.org/wiki/Tamil_calendar"
    text:
      en: "The Tamil New Year usually falls on 13 or 14 April. The Tamil year has twelve months, from Chittirai to Panguni, and a 60-year cycle that starts with Prabhava."
  - id: ta-fact-037
    tags: [culture]
    source: "https://en.wikipedia.org/wiki/Tamil_calendar"
    text:
      en: "In Tamil, weekday names end in -kiḻamai: the page gives Nyayitru-kiḻamai for Sunday and Tingat-kiḻamai for Monday."
