  - id: "ta-market-board"
    title: "A market board"
    sentences:
      - text: "சந்தை பெரியது."
        reading: "cantai periyatu."
        ipa: "sant̪ai peɾijat̪u"
      - text: "விலை நூறு ரூபாய்."
        reading: "vilai nūṟu rūpāy."
        ipa: "ʋilai nuːru ɾuːpaːj"
      - text: "தள்ளுபடி இருக்கிறது."
        reading: "taḷḷupaṭi irukkiṟatu."
        ipa: "t̪aɭɭupaʈi iɾukkirat̪u"
      - text: "பத்து ரூபாய் தள்ளுபடி."
        reading: "pattu rūpāy taḷḷupaṭi."
        ipa: "pat̪t̪u ɾuːpaːj t̪aɭɭupaʈi"
    questions:
      - id: "ta-9747"
        prompt: { en: "How big is the discount?" }
