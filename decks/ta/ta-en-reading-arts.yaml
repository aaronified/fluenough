passages:
  - id: "ta-exhibition-notice"
    title: "An exhibition notice"
    sentences:
      - text: "அருங்காட்சியகத்தில் ஓவியக் கண்காட்சி உண்டு."
        reading: "aruṅkāṭciyakattil ōviyak kaṇkāṭci uṇṭu."
        ipa: "aɾuŋkaːʈtʃijakat̪t̪il oːʋijak kaɳkaːʈtʃi uɳʈu"
      - text: "ஓவியர்கள் படைப்புகளைக் காட்டுகிறார்கள்."
        reading: "ōviyarkaḷ paṭaippukaḷaik kāṭṭukiṟārkaḷ."
        ipa: "oːʋijaɾkaɭ paʈaippukaɭaik kaːʈʈukiraːɾkaɭ"
      - text: "காலை பத்து மணிக்கு திறக்கிறார்கள்."
        reading: "kālai pattu maṇikku tiṟakkiṟārkaḷ."
        ipa: "kaːlai pat̪t̪u maɳikku t̪irakkiraːɾkaɭ"
      - text: "மாலையில் இசைக் கச்சேரி இருக்கிறது."
        reading: "mālaiyil icaik kaccēri irukkiṟatu."
        ipa: "maːlaijil isaik katʃtʃeːɾi iɾukkirat̪u"
      - text: "நுழைவுக்கட்டணம் இல்லை."
        reading: "nuḻaivukkaṭṭaṇam illai."
        ipa: "nuɻaiʋukkaʈʈaɳam illai"
