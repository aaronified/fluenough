passages:
  - id: "ta-medicine-label"
    title: "A medicine label"
    sentences:
      - text: "இது காய்ச்சலுக்கு மருந்து."
        reading: "itu kāyccalukku maruntu."
        ipa: "it̪u kaːjtʃtʃalukku maɾunt̪u"
      - text: "காலையில் ஒரு மாத்திரை சாப்பிடுங்கள்."
        reading: "kālaiyil oru māttirai cāppiṭuṅkaḷ."
        ipa: "kaːlaijil oɾu maːt̪t̪iɾai saːppiʈuŋkaɭ"
      - text: "இரவில் ஒரு மாத்திரை சாப்பிடுங்கள்."
        reading: "iravil oru māttirai cāppiṭuṅkaḷ."
        ipa: "iɾaʋil oɾu maːt̪t̪iɾai saːppiʈuŋkaɭ"
      - text: "நிறைய தண்ணீர் குடியுங்கள்."
        reading: "niṟaiya taṇṇīr kuṭiyuṅkaḷ."
        ipa: "niraija t̪aɳɳiːɾ kuʈijuŋkaɭ"
      - text: "மூன்று நாள் சாப்பிடுங்கள்."
        reading: "mūṉṟu nāḷ cāppiṭuṅkaḷ."
        ipa: "muːnru naːɭ saːppiʈuŋkaɭ"
    questions:
      - id: "ta-9915"
        prompt: { en: "What is the medicine for?" }
        options:
          - { en: "A fever" }
          - { en: "A cough" }
          - { en: "A toothache" }
        answer: 1
      - id: "ta-9916"
        prompt: { en: "How many tablets are taken in the morning?" }
        options:
          - { en: "One" }
          - { en: "Two" }
          - { en: "Three" }
        answer: 1
      - id: "ta-9917"
        prompt: { en: "For how long should the tablets be taken?" }
        options:
          - { en: "Three days" }
          - { en: "One week" }
          - { en: "Ten days" }
        answer: 1
