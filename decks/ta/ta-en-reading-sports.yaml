    sentences:
      - text: "நேற்று கபடி இறுதிப்போட்டி இருந்தது."
        reading: "nēṟṟu kapaṭi iṟutippōṭṭi iruntatu."
        ipa: "neːrru kapaʈi irut̪ippoːʈʈi iɾunt̪at̪u"
      - text: "எங்கள் ஆட்டக்காரர் பத்து புள்ளி எடுத்தார்."
        reading: "eṅkaḷ āṭṭakkārar pattu puḷḷi eṭuttār."
        ipa: "eŋkaɭ aːʈʈakkaːɾaɾ pat̪t̪u puɭɭi eʈut̪t̪aːɾ"
      - text: "நடுவர் நன்றாக இருந்தார்."
        reading: "naṭuvar naṉṟāka iruntār."
        ipa: "naʈuʋaɾ nanraːka iɾunt̪aːɾ"
      - text: "ஆட்டம் சமன்."
        reading: "āṭṭam camaṉ."
        ipa: "aːʈʈam saman"
      - text: "நாளை கோப்பை கொடுக்கிறார்கள்."
        reading: "nāḷai kōppai koṭukkiṟārkaḷ."
        ipa: "naːɭai koːppai koʈukkiraːɾkaɭ"
