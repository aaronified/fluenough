cards:
  - id: "ta-0450"
    target: "விடு"
    reading: "viṭu"
    ipa: "ʋiʈu"
    pos: "verb"
    notes:
      - { id: "n1", kind: "usage" }
    bases: "self"
    examples:
      - target: "நான் சாப்பிட்டுவிட்டேன்."
        reading: "nāṉ cāppiṭṭuviṭṭēṉ."
        ipa: "naːn saːppiʈʈuʋiʈʈeːn"
        bases: [{ word: "நான்", ref: "ta-0003" }, { word: "சாப்பிட்டுவிட்டேன்", base: "சாப்பிடு", reading: "cāppiṭu" }]
      - target: "என்னை விடுங்கள்."
        reading: "eṉṉai viṭuṅkaḷ."
        ipa: "ennai ʋiʈuŋkaɭ"
        bases: [{ word: "என்னை", base: "நான்", reading: "nāṉ" }, { word: "விடுங்கள்", base: "விடு", reading: "viṭu" }]
  - id: "ta-0451"
    target: "கொள்"
    reading: "koḷ"
    ipa: "koɭ"
    pos: "verb"
    notes:
      - { id: "n1", kind: "usage" }
    bases: "self"
    examples:
      - target: "இதை எடுத்துக்கொள்ளுங்கள்."
        reading: "itai eṭuttukkoḷḷuṅkaḷ."
        ipa: "it̪ai eʈut̪t̪ukkoɭɭuŋkaɭ"
        bases: [{ word: "இதை", base: "இது", reading: "itu" }, { word: "எடுத்துக்கொள்ளுங்கள்", base: "எடு", reading: "eṭu" }]
      - target: "நான் இதை வைத்துக்கொள்கிறேன்."
        reading: "nāṉ itai vaittukkoḷkiṟēṉ."
        ipa: "naːn it̪ai ʋait̪t̪ukkoɭkireːn"
        bases: [{ word: "நான்", ref: "ta-0003" }, { word: "இதை", base: "இது", reading: "itu" }, { word: "வைத்துக்கொள்கிறேன்", base: "வை", reading: "vai" }]
  - id: "ta-0452"
    target: "போடு"
    reading: "pōṭu"
    ipa: "poːʈu"
    pos: "verb"
    notes:
      - { id: "n1", kind: "usage" }
    bases: "self"
    examples:
      - target: "அம்மா காபியில் சர்க்கரை போடுகிறார்."
        reading: "ammā kāpiyil carkkarai pōṭukiṟār."
        ipa: "ammaː kaːpijil saɾkkaɾai poːʈukiraːɾ"
        bases: [{ word: "அம்மா", ref: "ta-0072" }, { word: "காபியில்", base: "காபி", reading: "kāpi" }, { word: "சர்க்கரை", ref: "ta-0218" }, { word: "போடுகிறார்", base: "போடு", reading: "pōṭu" }]
