    bases: "self"
    examples:
      - target: "நான் பேருந்தைப் பிடிக்கிறேன்."
        reading: "nāṉ pēruntaip piṭikkiṟēṉ."
        ipa: "naːn peːɾunt̪aip piʈikkireːn"
        bases: [{ word: "நான்", ref: "ta-0003" }, { word: "பேருந்தைப்", base: "பேருந்து", reading: "pēruntu" }, { word: "பிடிக்கிறேன்", base: "பிடி", reading: "piṭi" }]
      - target: "குழந்தை என் கையைப் பிடிக்கிறது."
        reading: "kuḻantai eṉ kaiyaip piṭikkiṟatu."
        ipa: "kuɻant̪ai en kaijaip piʈikkirat̪u"
        bases: [{ word: "குழந்தை", ref: "ta-0084" }, { word: "என்", base: "நான்", reading: "nāṉ" }, { word: "கையைப்", base: "கை", reading: "kai" }, { word: "பிடிக்கிறது", base: "பிடி", reading: "piṭi" }]
  - id: "ta-0457"
