        ipa: "iŋkeː nirut̪t̪uŋkaɭ"
        bases: [{ word: "இங்கே", ref: "ta-0112" }, { word: "நிறுத்துங்கள்", base: "நிறுத்து", reading: "niṟuttu" }]
      - target: "அவர் காரை நிறுத்தினார்."
        reading: "avar kārai niṟuttiṉār."
        ipa: "aʋaɾ kaːɾai nirut̪t̪inaːɾ"
