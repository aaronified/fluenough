        ipa: "kuɻant̪ai pant̪ai ʋiːsukirat̪u"
        bases: [{ word: "குழந்தை", ref: "ta-0084" }, { word: "பந்தை", base: "பந்து", reading: "pantu" }, { word: "வீசுகிறது", base: "வீசு", reading: "vīcu" }]
      - target: "காற்று வீசுகிறது."
        reading: "kāṟṟu vīcukiṟatu."
        ipa: "kaːrru ʋiːsukirat̪u"
        bases: [{ word: "காற்று", base: "காற்று", reading: "kāṟṟu" }, { word: "வீசுகிறது", base: "வீசு", reading: "vīcu" }]
