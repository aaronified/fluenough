    reading: "tā"
    ipa: "t̪aː"
    pos: "verb"
    notes:
      - { id: "n1", kind: "usage" }
    bases: "self"
    examples:
      - target: "எனக்குத் தண்ணீர் தாருங்கள்."
        reading: "eṉakkut taṇṇīr tāruṅkaḷ."
        ipa: "enakkut̪ t̪aɳɳiːɾ t̪aːɾuŋkaɭ"
        bases: [{ word: "எனக்குத்", base: "நான்", reading: "nāṉ" }, { word: "தண்ணீர்", ref: "ta-0005" }, { word: "தாருங்கள்", base: "தா", reading: "tā" }]
      - target: "அவன் எனக்குப் பணம் தந்தான்."
        reading: "avaṉ eṉakkup paṇam tantāṉ."
        ipa: "aʋan enakkup paɳam t̪ant̪aːn"
        bases: [{ word: "அவன்", ref: "ta-0058" }, { word: "எனக்குப்", base: "நான்", reading: "nāṉ" }, { word: "பணம்", ref: "ta-0197" }, { word: "தந்தான்", base: "தா", reading: "tā" }]
  - id: "ta-0454"
    target: "நிறுத்து"
    reading: "niṟuttu"
    ipa: "nirut̪t̪u"
    pos: "verb"
    notes:
      - { id: "n1", kind: "behaviour" }
    bases: "self"
    examples:
      - target: "இங்கே நிறுத்துங்கள்."
