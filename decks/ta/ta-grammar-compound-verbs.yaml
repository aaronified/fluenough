        ipa: "kat̪aʋait̪ t̪aɭɭuŋkaɭ"
        bases: [{ word: "கதவைத்", base: "கதவு", reading: "katavu" }, { word: "தள்ளுங்கள்", base: "தள்ளு", reading: "taḷḷu" }]
      - target: "குழந்தை பந்தைத் தள்ளுகிறது."
        reading: "kuḻantai pantait taḷḷukiṟatu."
        ipa: "kuɻant̪ai pant̪ait̪ t̪aɭɭukirat̪u"
        bases: [{ word: "குழந்தை", ref: "ta-0084" }, { word: "பந்தைத்", base: "பந்து", reading: "pantu" }, { word: "தள்ளுகிறது", base: "தள்ளு", reading: "taḷḷu" }]
  - id: "ta-0456"
