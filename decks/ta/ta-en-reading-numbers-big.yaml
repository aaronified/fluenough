passages:
  - id: "ta-bill"
    title: "A shop bill"
    sentences:
      - text: "தண்ணீர் முப்பது."
        reading: "taṇṇīr muppatu."
        ipa: "t̪aɳɳiːɾ muppat̪u"
      - text: "தேநீர் நாற்பது."
        reading: "tēnīr nāṟpatu."
        ipa: "t̪eːniːɾ naːrpat̪u"
      - text: "எல்லாம் எழுபது."
        reading: "ellām eḻupatu."
        ipa: "ellaːm eɻupat̪u"
      - text: "பணம் கொடு."
        reading: "paṇam koṭu."
        ipa: "paɳam koʈu"
    questions:
      - id: "ta-9738"
        prompt: { en: "How much is the total?" }
        options:
          - { en: "Sixty" }
          - { en: "Seventy" }
          - { en: "Eighty" }
        answer: 2
      - id: "ta-9739"
        prompt: { en: "Which costs more?" }
        options:
          - { en: "The water" }
          - { en: "The tea" }
          - { en: "They cost the same" }
        answer: 2
      - id: "ta-9740"
        prompt: { en: "What does the bill ask you to do?" }
        options:
          - { en: "Give the money" }
          - { en: "Buy more" }
          - { en: "Come back tomorrow" }
        answer: 1
