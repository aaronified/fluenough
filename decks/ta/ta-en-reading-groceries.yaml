        reading: "eṇṇey vāṅku."
        ipa: "eɳɳej ʋaːŋku"
      - text: "உப்பு இல்லை."
        reading: "uppu illai."
        ipa: "uppu illai"
      - text: "பழம் கொஞ்சம் வேண்டும்."
        reading: "paḻam koñcam vēṇṭum."
        ipa: "paɻam koɲtʃam ʋeːɳʈum"
