    sentences:
      - text: "ஆப்பைப் பதிவிறக்கம் செய்யுங்கள்."
        reading: "āppaip pativiṟakkam ceyyuṅkaḷ."
        ipa: "aːppaip pat̪iʋirakkam sejjuŋkaɭ"
      - text: "உங்கள் பெயருடன் உள்நுழையுங்கள்."
        reading: "uṅkaḷ peyaruṭaṉ uḷnuḻaiyuṅkaḷ."
        ipa: "uŋkaɭ pejaɾuʈan uɭnuɻaijuŋkaɭ"
      - text: "பிழை வந்தால் மறுதொடக்கம் செய்யுங்கள்."
        reading: "piḻai vantāl maṟutoṭakkam ceyyuṅkaḷ."
        ipa: "piɻai ʋant̪aːl marut̪oʈakkam sejjuŋkaɭ"
      - text: "புதுப்பிப்பு வந்தால் சொடுக்குங்கள்."
        reading: "putuppippu vantāl coṭukkuṅkaḷ."
        ipa: "put̪uppippu ʋant̪aːl soʈukkuŋkaɭ"
      - text: "தனியுரிமை முக்கியம்."
        reading: "taṉiyurimai mukkiyam."
        ipa: "t̪anijuɾimai mukkijam"
