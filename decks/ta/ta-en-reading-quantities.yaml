passages:
  - id: "ta-shopping-amounts"
    title: "Shopping amounts"
    sentences:
      - text: "தண்ணீர் நிறைய வேண்டும்."
        reading: "taṇṇīr niṟaiya vēṇṭum."
        ipa: "t̪aɳɳiːɾ niraija ʋeːɳʈum"
      - text: "தேநீர் கொஞ்சம் வேண்டும்."
        reading: "tēnīr koñcam vēṇṭum."
        ipa: "t̪eːniːɾ koɲtʃam ʋeːɳʈum"
      - text: "இது எல்லாம் போதும்."
        reading: "itu ellām pōtum."
        ipa: "it̪u ellaːm poːt̪um"
    questions:
      - id: "ta-9721"
        prompt: { en: "Which does the note ask for more of?" }
        options:
          - { en: "Water" }
          - { en: "Tea" }
          - { en: "Both the same" }
        answer: 1
      - id: "ta-9722"
        prompt: { en: "How much tea is wanted?" }
        options:
          - { en: "A lot" }
          - { en: "A little" }
          - { en: "Half" }
        answer: 2
      - id: "ta-9723"
        prompt: { en: "The note says all of this is enough." }
        answer: true
