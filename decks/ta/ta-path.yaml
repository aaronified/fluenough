# The order Tamil is taught in, one unit per line, from every language it
# is taught from: each deck is named by its core id, and a learner from
# English is taught ta-en-home for ta-home (ADR-0013, ADR-0036).
#
# This is Tamil's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"; issue #354),
# written before any Tamil deck: every unit from the first words to B1 is
# planned, with its size in words, its grammar topics, the three milestones
# and its listening and reading passages. The course teaches every unit as
# "Coming" until its first deck is written; the unit's `planned` then turns
# into `decks` in the same change. Sizes follow the plan's levels (about
# 700, 900 and 1,200 words; low confidence) and are one number for every
# native language. Tamil is FSI tier IV (1,100 hours, on the FSI list:
# docs/plans/language-paths.md); the tier sets the pacing, in days, not the
# words a level needs, so the sizes are Telugu's. A theme named here that
# decks/themes.yaml does not list yet is added to it with its first deck.
#
# A planned unit names one core id. Where a unit will hold more than one
# deck, as Telugu's do, the comment above it names the others: they join
# the unit when they are written. Sentence decks have no theme, so they are
# not planned units of their own: each joins the unit named in its comment,
# after its words and rules.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"), Telugu's path as the closest
# model, and the Dravidian order of docs/plans/language-paths-scheme.md
# (retroflex sounds, script, greetings, numbers, pronouns, SOV, suffixes,
# cases, present, past and future, negatives, verbal participles, relative
# participles, conditionals, honorifics):
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units;
# 3. the script, after the first six units ("After units 4-6"); a learner
#    who already reads it skips it (#554);
# 4. a core of about 200 common words in themed units ("Yes, smaller
#    (~200)"), by judgement, most common first, until Tamil Wikipedia's
#    counts are written (tools/wikipedia_frequency.py, #516);
# 5. rules as forms: noun endings (the plural, the oblique stem, the case
#    suffixes), then pronoun and verb forms, practised on known words;
# 6. sentences, each after its words and rules; then the other themes, each
#    its words, its rules, then its sentences.
#
# What is Tamil's own, against Telugu's model:
# - Spoken first, written later (the scheme: "Strong diglossia: spoken
#   first, written later"). The course teaches common spoken Tamil, such as
#   போறேன் (pōṟēṉ, "I go"), and the written forms, போகிறேன் (pōkiṟēṉ),
#   come in the B1 unit ta-registers.
# - The sounds unit drills ழ (ḻ), the retroflex and the dental, ற (ṟ)
#   against ர (r), and ன (ṉ), ந (n) and ண (ṇ).
# - The script has no conjunct ligatures: a dead consonant takes the pulli
#   (்). Its second script unit teaches the vowel signs, the pulli and the
#   Grantha letters ஜ (ja), ஷ (ṣa), ஸ (sa) and ஹ (ha) instead.
# - The case suffixes: plural -கள் (-kaḷ), the oblique stem (வீடு (vīṭu) →
#   வீட்டு- (vīṭṭu-)), accusative -ஐ (-ai), dative -உக்கு (-ukku),
#   locative -இல் (-il) for things and -இடம் (-iṭam) for people, ablative
#   -இலிருந்து (-iliruntu), sociative -ஓடு (-ōṭu), genitive -உடைய
#   (-uṭaiya), and the instrumental -ஆல் (-āl) with the postpositions.
# - We, inclusive and exclusive: நாம் (nām) and நாங்கள் (nāṅkaḷ).
# - The verbal participle comes in A2, before the compound verbs, since
#   Tamil's aspect verbs, விடு (viṭu) and கொள் (koḷ), are built on it; the
#   verb classes (weak and strong, by their past stem) come with the past.
# - Reported speech is the quotative என்று (eṉṟu), spoken -னு (-ṉu).
#
# The script decks are being written: `alphabet` lists the written ones
# (ta-script-vowels first), in Telugu's order. When they are all written,
# `alphabet` lists ta-script-vowels,
# ta-script-consonants, ta-script-reading, ta-script-vowel-signs,
# ta-script-grantha, ta-spelling and the first reader, and the two script
# units become lists of them, as Telugu's are. Until then each script unit
# is planned with a grammar topic, since a planned unit names a theme or a
# grammar topic. Spelling and the first reader come after B1, as Telugu's
# do; they are added to the path when written, since nothing is planned
# after B1.
schema: 1
kind: "path"
id: "ta-path"
language: "ta"
# The gender classes a noun's gender is one of (#512; DECK-FORMAT.md, Card
# data): Tamil's three, the rational masculine and feminine (உயர்திணை
# (uyartiṇai): ஆண்பால் (āṇpāl) and பெண்பால் (peṇpāl)) and the irrational
# (அஃறிணை (aḵṟiṇai)), written "m", "f" and "n" as Kannada's are. A
# noun's class decides its verb's third-person ending: -ஆன் (-āṉ), -ஆள்
# (-āḷ) or -அது (-atu). The plural's rational and irrational split
# (-ஆர்கள் (-ārkaḷ) against -அன (-aṉa)) follows from it and needs no
# class of its own.
genders: ["m", "f", "n"]
# Where Tamil is spoken, for a rater's region and a card's region note
# (ADR-0036): Tamil Nadu's four dialect regions, each named with example
# districts, then Sri Lanka, Malaysia and Singapore. The ids are permanent,
# as card ids are; rename a name, never an id. The app adds "Elsewhere"
# after them.
regions:
  - id: "northern"
    name: { "en": "Northern Tamil Nadu (Chennai, Vellore, Puducherry)" }
  - id: "central"
    name: { "en": "Central Tamil Nadu (Thanjavur, Tiruchirappalli)" }
  - id: "kongu"
    name: { "en": "Kongu, western Tamil Nadu (Coimbatore, Erode, Salem)" }
  - id: "southern"
    name: { "en": "Southern Tamil Nadu (Madurai, Tirunelveli, Kanyakumari)" }
  - id: "sri-lanka"
    name: { "en": "Sri Lanka (Jaffna, Batticaloa)" }
  - id: "malaysia"
    name: { "en": "Malaysia" }
  - id: "singapore"
    name: { "en": "Singapore" }
# The decks that need the alphabet: a learner who learns without it
# skips them.
alphabet:
  - "ta-script-vowels"
  - "ta-script-consonants"
  - "ta-script-reading"
  - "ta-script-vowel-signs"
  - "ta-script-grantha"
  - "ta-script-digits"
units:
  # 1. The phrasebook, taught whole from the first lesson. ta-first-words
  # joins this unit.
  # The first words are written: ta-first-words is taught with the
  # phrasebook (10 words).
  - decks: ["ta-phrasebook", "ta-first-words", "ta-first-words-sentences", "*"]
    words: 10
  # 2. The first word units.
  - decks: ["ta-sound-differences", "*"]
    words: 10
    listening_passages:
      - { id: "sound-pairs", text: { "en": "Pairs of words that differ in one sound, said slowly" } }
    reading_passages:
      - { id: "sound-pairs-list", text: { "en": "A list of word pairs with their readings" } }
  - decks: ["ta-questions", "ta-questions-sentences", "ta-reading-questions", "*"]
    words: 11
    listening_passages:
      - { id: "yes-or-no", text: { "en": "Short questions answered with yes and no" } }
    reading_passages:
      - { id: "question-cards", text: { "en": "Cards with who, what, where and when" } }
  # ta-addressing joins this unit.
  - decks: ["ta-pronouns", "ta-pronouns-sentences", "ta-reading-pronouns", "*"]
    words: 11
    listening_passages:
      - { id: "polite-or-not", text: { "en": "Speaking to a friend, an elder and a shopkeeper" } }
    reading_passages:
      - { id: "who-is-who", text: { "en": "A short list of people and how to address them" } }
  - decks: ["ta-family", "ta-family-sentences", "ta-reading-family", "*"]
    words: 14
    listening_passages:
      - { id: "family-photo", text: { "en": "Someone names the people in a family photo" } }
    reading_passages:
      - { id: "family-tree", text: { "en": "A family tree with its labels" } }
  - decks: ["ta-numbers-1-20", "ta-numbers-sentences", "ta-reading-numbers-1-20", "*"]
    words: 19
    listening_passages:
      - { id: "phone-number", text: { "en": "Someone reads out a phone number" } }
    reading_passages:
      - { id: "price-tags", text: { "en": "Price tags on small things" } }
  # 3. The script, after the first six units (#554: skipped by a learner
  # who already reads it). ta-script-consonants and ta-script-reading join
  # the first; ta-script-grantha joins the second.
  - decks: ["ta-script-vowels", "ta-script-consonants", "ta-script-reading"]
    words: 0
    listening_passages:
      - { id: "letter-names", text: { "en": "The vowels and consonants said in order" } }
    reading_passages:
      - { id: "first-signs", text: { "en": "Short words on shop signs, letter by letter" } }
  - decks: ["ta-script-vowel-signs", "ta-script-grantha", "ta-script-digits"]
    words: 0
    listening_passages:
      - { id: "syllable-rows", text: { "en": "One consonant with each vowel sign, said in a row" } }
    reading_passages:
      - { id: "name-boards", text: { "en": "Name boards with borrowed sounds and dead consonants" } }
  # 4. The core: about 200 common words, most common first (by judgement
  # until the Wikipedia counts are written, #516).
  - decks: ["ta-about-me", "ta-about-me-sentences", "ta-reading-about-me", "*"]
    words: 6
    listening_passages:
      - { id: "introducing-myself", text: { "en": "Someone says their name, home town and work" } }
    reading_passages:
      - { id: "profile-card", text: { "en": "A short profile card" } }
  - decks: ["ta-verbs", "ta-verbs-sentences", "ta-reading-verbs", "*"]
    words: 12
    listening_passages:
      - { id: "what-i-do", text: { "en": "Someone lists what they do each day" } }
    reading_passages:
      - { id: "to-do-list", text: { "en": "A short to-do list" } }
  - decks: ["ta-adverbs", "ta-adverbs-sentences", "ta-reading-adverbs", "*"]
    words: 10
    listening_passages:
      - { id: "how-often", text: { "en": "Saying how often and how well things are done" } }
    reading_passages:
      - { id: "habit-survey", text: { "en": "A short survey about everyday habits" } }
  - decks: ["ta-quantities", "ta-quantities-sentences", "ta-reading-quantities", "*"]
    words: 9
    listening_passages:
      - { id: "a-little-more", text: { "en": "Asking for a little more and a little less" } }
    reading_passages:
      - { id: "shopping-amounts", text: { "en": "A shopping list with amounts" } }
  - decks: ["ta-describing", "ta-describing-sentences", "ta-reading-describing", "*"]
    words: 9
    listening_passages:
      - { id: "big-and-small", text: { "en": "Describing things: big, small, hot and cold" } }
    reading_passages:
      - { id: "for-sale-note", text: { "en": "A note describing something for sale" } }
  - decks: ["ta-time", "ta-time-sentences", "ta-reading-time", "*"]
    words: 14
    listening_passages:
      - { id: "what-time", text: { "en": "Asking and telling the time" } }
    reading_passages:
      - { id: "opening-hours", text: { "en": "A shop's opening hours" } }
  - decks: ["ta-location", "ta-location-sentences", "ta-reading-location", "*"]
    words: 8
    listening_passages:
      - { id: "where-is-it", text: { "en": "Saying where things are in a room" } }
    reading_passages:
      - { id: "room-labels", text: { "en": "Labels: on, under, inside and near" } }
  - decks: ["ta-more-verbs", "ta-more-verbs-sentences", "ta-reading-more-verbs", "*"]
    words: 8
    listening_passages:
      - { id: "helping-out", text: { "en": "Asking someone to bring, give and keep things" } }
    reading_passages:
      - { id: "house-rules", text: { "en": "A short list of house rules" } }
  # 5. Rules as forms, practised on the words known: noun endings and
  # conjunctions first, then pronoun and verb forms.
  - decks: ["ta-grammar-noun-forms"]
    words: 0
    grammar: ["plural", "oblique", "ai", "ukku", "il", "itam", "iliruntu", "otu", "utaiya"]
    listening_passages:
      - { id: "which-way-home", text: { "en": "Two people say where they go, with whom, and where from" } }
    reading_passages:
      - { id: "class-notice", text: { "en": "A class notice: where, with whom and when" } }
  - decks: ["ta-grammar-conjunctions"]
    words: 8
    grammar: ["conjunctions"]
    listening_passages:
      - { id: "this-and-that", text: { "en": "Choosing this or that, and saying but and so" } }
    reading_passages:
      - { id: "two-plans", text: { "en": "A note with two plans joined by and, or and but" } }
  # ta-grammar-pronouns joins this unit.
  - decks: ["ta-grammar-pronouns", "ta-grammar-pronoun-forms", "ta-grammar-inclusive-we"]
    words: 0
    grammar: ["pronouns", "inclusive-we", "pronoun-gen", "pronoun-dat", "pronoun-acc", "pronoun-with"]
    listening_passages:
      - { id: "whose-is-it", text: { "en": "Asking whose things are whose" } }
    reading_passages:
      - { id: "we-and-you", text: { "en": "A message to a group: we, all of us, and you" } }
  - decks: ["ta-grammar-be"]
    words: 0
    grammar: ["be"]
    listening_passages:
      - { id: "who-and-where", text: { "en": "Saying who someone is and where they are" } }
    reading_passages:
      - { id: "is-there", text: { "en": "A note: what there is at home and what there is not" } }
  - decks: ["ta-grammar-verb-present"]
    words: 0
    grammar: ["present-first", "present-second", "present-third"]
    listening_passages:
      - { id: "morning-at-home", text: { "en": "A family member says what she does every morning" } }
    reading_passages:
      - { id: "note-on-the-fridge", text: { "en": "A short note: what to eat and drink" } }
  - decks: ["ta-grammar-demonstratives"]
    words: 0
    grammar: ["demonstratives"]
    listening_passages:
      - { id: "this-one-that-one", text: { "en": "Pointing at things: this one, that one, which one" } }
    reading_passages:
      - { id: "shop-labels", text: { "en": "Labels in a shop: this here, that there" } }
  # 6. Sentences, each after its words and rules; then the other A1
  # themes, each its words, its rules, then its sentences.
  - decks: ["ta-work", "ta-work-sentences", "ta-reading-work", "*"]
    words: 10
    listening_passages:
      - { id: "what-do-you-do", text: { "en": "People say what work they do" } }
    reading_passages:
      - { id: "name-tags", text: { "en": "Name tags at a meeting: who is who and what they do" } }
  - decks: ["ta-numbers-big", "ta-numbers-big-sentences", "ta-reading-numbers-big", "*"]
    words: 13
    listening_passages:
      - { id: "how-much-is-it", text: { "en": "Prices said aloud at a stall" } }
    reading_passages:
      - { id: "bill", text: { "en": "A shop bill with its total" } }
  # ta-food-sentences joins this unit.
  - decks: ["ta-food", "ta-food-sentences", "ta-reading-food", "*"]
    words: 8
    listening_passages:
      - { id: "at-the-tiffin-stall", text: { "en": "Ordering breakfast at a tiffin stall" } }
    reading_passages:
      - { id: "menu-board", text: { "en": "A menu board with dishes and prices" } }
  # ta-grammar-needs follows this unit.
  - decks: ["ta-groceries", "ta-groceries-sentences", "ta-reading-groceries", "*"]
    words: 9
    listening_passages:
      - { id: "what-we-need", text: { "en": "Two people say what they need from the shop" } }
    reading_passages:
      - { id: "grocery-list", text: { "en": "A grocery list" } }
  - decks: ["ta-grammar-needs"]
    words: 3
    grammar: ["needs"]
    listening_passages:
      - { id: "needs-heard", text: { "en": "A short exchange that uses needs, after the groceries unit" } }
    reading_passages:
      - { id: "needs-read", text: { "en": "A short text that uses needs, after the groceries unit" } }
  # ta-grammar-nouns follows this unit.
  - decks: ["ta-market", "ta-market-sentences", "ta-reading-market", "*"]
    words: 6
    listening_passages:
      - { id: "at-the-market", text: { "en": "Buying vegetables at a market" } }
    reading_passages:
      - { id: "market-board", text: { "en": "A market stall's board" } }
  - decks: ["ta-grammar-nouns"]
    words: 0
    grammar: ["nouns"]
    listening_passages:
      - { id: "noun-classes-heard", text: { "en": "A short exchange that uses noun-classes, after the market unit" } }
    reading_passages:
      - { id: "noun-classes-read", text: { "en": "A short text that uses noun-classes, after the market unit" } }
  - decks: ["ta-grammar-questions"]
    words: 0
    grammar: ["questions"]
    listening_passages:
      - { id: "asking-the-way", text: { "en": "Asking a stranger short questions" } }
    reading_passages:
      - { id: "a-form-to-fill", text: { "en": "A short form: name, age and where you live" } }
  - decks: ["ta-grammar-likes"]
    words: 2
    grammar: ["likes"]
    listening_passages:
      - { id: "what-do-you-like", text: { "en": "Friends say what they like and do not like" } }
    reading_passages:
      - { id: "likes-poll", text: { "en": "A poll of favourite foods" } }
  # ta-pronouns-sentences, ta-verbs-sentences and ta-noun-forms-sentences
  # join this unit.
  - decks: ["ta-grammar-sentences"]
    words: 0
    grammar: ["sentences"]
    listening_passages:
      - { id: "introducing-friends", text: { "en": "Introducing two friends: who is who, he and she" } }
    reading_passages:
      - { id: "a-short-diary", text: { "en": "A few lines about a day: who did what, and where" } }
  # ta-grammar-continuous follows this unit.
  - decks: ["ta-directions", "ta-directions-sentences", "ta-reading-directions", "*"]
    words: 8
    listening_passages:
      - { id: "turn-left", text: { "en": "Directions to a temple: left, right and straight on" } }
    reading_passages:
      - { id: "street-signs", text: { "en": "Street signs and an arrow board" } }
  - decks: ["ta-grammar-continuous"]
    words: 0
    grammar: ["continuous"]
    listening_passages:
      - { id: "continuous-heard", text: { "en": "A short exchange that uses continuous, after the directions unit" } }
    reading_passages:
      - { id: "continuous-read", text: { "en": "A short text that uses continuous, after the directions unit" } }
  - decks: ["ta-transport", "ta-transport-sentences", "ta-reading-transport", "*"]
    words: 6
    listening_passages:
      - { id: "auto-fare", text: { "en": "Agreeing a fare with an auto driver" } }
    reading_passages:
      - { id: "bus-board", text: { "en": "The destination board on a bus" } }
  # ta-body-sentences joins this unit.
  - decks: ["ta-body", "ta-body-sentences", "ta-reading-body", "*"]
    words: 8
    listening_passages:
      - { id: "where-it-hurts", text: { "en": "Pointing to where it hurts" } }
    reading_passages:
      - { id: "exercise-poster", text: { "en": "A poster of simple exercises" } }
  # ta-places-sentences joins this unit.
  - decks: ["ta-places", "ta-places-sentences", "ta-reading-places", "*"]
    words: 8
    listening_passages:
      - { id: "town-walk", text: { "en": "A guide names the places on a short walk through town" } }
    reading_passages:
      - { id: "map-labels", text: { "en": "Labels on a simple town map" } }
  - decks: ["ta-things", "ta-things-sentences", "ta-reading-things", "*"]
    words: 8
    listening_passages:
      - { id: "packing-a-bag", text: { "en": "Two people pack a bag for a trip" } }
    reading_passages:
      - { id: "lost-property-list", text: { "en": "A lost-property list at a bus station" } }
  # ta-things-sentences and ta-more-verbs-sentences join this unit.
  - decks: ["ta-home", "ta-home-sentences", "ta-reading-home", "*"]
    words: 8
    listening_passages:
      - { id: "kitchen-instructions", text: { "en": "Someone tells a helper what to do in the kitchen" } }
    reading_passages:
      - { id: "how-to-card", text: { "en": "A short how-to card for making filter coffee" } }
  # ta-quantities-sentences joins this unit.
  - decks: ["ta-grammar-differences"]
    words: 6
    grammar: ["differences"]
    listening_passages:
      - { id: "how-much-how-many", text: { "en": "Asking how much and how many at a stall" } }
    reading_passages:
      - { id: "recipe-amounts", text: { "en": "A recipe card with amounts" } }
  - decks: ["ta-grammar-postpositions", "ta-grammar-al"]
    words: 2
    grammar: ["postpositions", "al"]
    listening_passages:
      - { id: "by-bus-by-hand", text: { "en": "Saying how things are done: by bus, by hand, for whom" } }
    reading_passages:
      - { id: "route-note", text: { "en": "A note on how to reach a house: past, behind and near" } }
  # ta-grammar-adjectives and ta-grammar-articles join this unit.
  - decks: ["ta-grammar-gender-number", "ta-grammar-adjectives", "ta-grammar-articles"]
    words: 10
    grammar: ["articles", "gender-number", "adjectives"]
    listening_passages:
      - { id: "he-she-it", text: { "en": "Talking about a man, a woman and a thing: how the verb changes" } }
    reading_passages:
      - { id: "class-photo", text: { "en": "A caption under a class photo" } }
  # ta-clothes-sentences and ta-describing-sentences join this unit.
  - decks: ["ta-clothes", "ta-clothes-sentences", "ta-reading-clothes", "*"]
    words: 12
    listening_passages:
      - { id: "choosing-a-shirt", text: { "en": "Choosing a shirt's colour and size in a shop" } }
    reading_passages:
