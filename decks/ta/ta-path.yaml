  # ta-animals-sentences joins this unit.
  - decks: ["ta-animals", "ta-animals-sentences", "ta-reading-animals", "*"]
    words: 10
    listening_passages:
      - { id: "animals-on-the-farm", text: { "en": "A child names the animals on a farm" } }
    reading_passages:
      - { id: "zoo-board", text: { "en": "A zoo board with each animal and what it eats" } }
  - decks: ["ta-grammar-future"]
    words: 0
    grammar: ["future"]
    listening_passages:
      - { id: "tomorrows-plans", text: { "en": "Friends say what they will do tomorrow" } }
    reading_passages:
      - { id: "weekend-plan", text: { "en": "A plan for the weekend" } }
    milestone: "A1"
  # A2: the themes and grammar of the CEFR's A2, each its words, its rules,
  # then its sentences. ta-grammar-negative follows the first unit.
