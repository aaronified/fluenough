  - planned: { id: "ta-work", theme: "work", words: 19 }
    listening_passages:
      - { id: "what-do-you-do", text: { "en": "People say what work they do" } }
    reading_passages:
      - { id: "name-tags", text: { "en": "Name tags at a meeting: who is who and what they do" } }
  - planned: { id: "ta-numbers-big", theme: "numbers-big", words: 13 }
