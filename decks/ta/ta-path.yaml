  # ta-grammar-needs joins this unit.
  - planned: { id: "ta-groceries", theme: "groceries", words: 16 }
    grammar: ["needs"]
    listening_passages:
      - { id: "what-we-need", text: { "en": "Two people say what they need from the shop" } }
