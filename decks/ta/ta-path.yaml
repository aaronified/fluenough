  # conjunctions first, then pronoun and verb forms.
  - planned: { id: "ta-grammar-noun-forms", grammar: ["plural", "oblique", "ai", "ukku", "il", "itam", "iliruntu", "otu", "utaiya"], words: 0 }
    listening_passages:
      - { id: "which-way-home", text: { "en": "Two people say where they go, with whom, and where from" } }
    reading_passages:
      - { id: "class-notice", text: { "en": "A class notice: where, with whom and when" } }
  - planned: { id: "ta-grammar-conjunctions", grammar: "conjunctions", words: 8 }
    listening_passages:
      - { id: "this-and-that", text: { "en": "Choosing this or that, and saying but and so" } }
    reading_passages:
      - { id: "two-plans", text: { "en": "A note with two plans joined by and, or and but" } }
  # ta-grammar-pronouns joins this unit.
  - planned: { id: "ta-grammar-pronoun-forms", grammar: ["pronouns", "inclusive-we", "pronoun-gen", "pronoun-dat", "pronoun-acc", "pronoun-with"], words: 0 }
    listening_passages:
      - { id: "whose-is-it", text: { "en": "Asking whose things are whose" } }
    reading_passages:
      - { id: "we-and-you", text: { "en": "A message to a group: we, all of us, and you" } }
  - planned: { id: "ta-grammar-be", grammar: "be", words: 0 }
    listening_passages:
      - { id: "who-and-where", text: { "en": "Saying who someone is and where they are" } }
    reading_passages:
      - { id: "is-there", text: { "en": "A note: what there is at home and what there is not" } }
  - planned: { id: "ta-grammar-verb-present", grammar: ["present-first", "present-second", "present-third"], words: 0 }
    listening_passages:
      - { id: "morning-at-home", text: { "en": "A family member says what she does every morning" } }
    reading_passages:
      - { id: "note-on-the-fridge", text: { "en": "A short note: what to eat and drink" } }
  - planned: { id: "ta-grammar-demonstratives", grammar: "demonstratives", words: 0 }
    listening_passages:
      - { id: "this-one-that-one", text: { "en": "Pointing at things: this one, that one, which one" } }
    reading_passages:
      - { id: "shop-labels", text: { "en": "Labels in a shop: this here, that there" } }
  # 6. Sentences, each after its words and rules; then the other A1
