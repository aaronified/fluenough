# The order Tamil is taught in, one unit per line, from every language it
# is taught from: each deck is named by its core id, and a learner from
# English is taught ta-en-home for ta-home (ADR-0013, ADR-0036).
#
# This is Tamil's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"; issue #354),
# written before any Tamil deck: every unit from the first words to B1 is
# planned, with its size in words, its grammar topics, the three milestones
# and its listening and reading passages. The course teaches every unit as
# "Coming" until its first deck is written; the unit's `planned` then turns
# into `decks` in the same change. Sizes follow the plan's levels (about
# 700, 900 and 1,200 words; low confidence) and are one number for every
# native language. Tamil is FSI tier IV (1,100 hours, on the FSI list:
# docs/plans/language-paths.md); the tier sets the pacing, in days, not the
# words a level needs, so the sizes are Telugu's. A theme named here that
# decks/themes.yaml does not list yet is added to it with its first deck.
#
# A planned unit names one core id. Where a unit will hold more than one
# deck, as Telugu's do, the comment above it names the others: they join
# the unit when they are written. Sentence decks have no theme, so they are
# not planned units of their own: each joins the unit named in its comment,
# after its words and rules.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"), Telugu's path as the closest
# model, and the Dravidian order of docs/plans/language-paths-scheme.md
# (retroflex sounds, script, greetings, numbers, pronouns, SOV, suffixes,
# cases, present, past and future, negatives, verbal participles, relative
# participles, conditionals, honorifics):
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units;
# 3. the script, after the first six units ("After units 4-6"); a learner
#    who already reads it skips it (#554);
# 4. a core of about 200 common words in themed units ("Yes, smaller
#    (~200)"), by judgement, most common first, until Tamil Wikipedia's
#    counts are written (tools/wikipedia_frequency.py, #516);
# 5. rules as forms: noun endings (the plural, the oblique stem, the case
#    suffixes), then pronoun and verb forms, practised on known words;
# 6. sentences, each after its words and rules; then the other themes, each
#    its words, its rules, then its sentences.
#
# What is Tamil's own, against Telugu's model:
# - Spoken first, written later (the scheme: "Strong diglossia: spoken
#   first, written later"). The course teaches common spoken Tamil, such as
#   போறேன் (pōṟēṉ, "I go"), and the written forms, போகிறேன் (pōkiṟēṉ),
#   come in the B1 unit ta-registers.
# - The sounds unit drills ழ (ḻ), the retroflex and the dental, ற (ṟ)
#   against ர (r), and ன (ṉ), ந (n) and ண (ṇ).
# - The script has no conjunct ligatures: a dead consonant takes the pulli
#   (்). Its second script unit teaches the vowel signs, the pulli and the
#   Grantha letters ஜ (ja), ஷ (ṣa), ஸ (sa) and ஹ (ha) instead.
# - The case suffixes: plural -கள் (-kaḷ), the oblique stem (வீடு (vīṭu) →
#   வீட்டு- (vīṭṭu-)), accusative -ஐ (-ai), dative -உக்கு (-ukku),
#   locative -இல் (-il) for things and -இடம் (-iṭam) for people, ablative
#   -இலிருந்து (-iliruntu), sociative -ஓடு (-ōṭu), genitive -உடைய
#   (-uṭaiya), and the instrumental -ஆல் (-āl) with the postpositions.
# - We, inclusive and exclusive: நாம் (nām) and நாங்கள் (nāṅkaḷ).
# - The verbal participle comes in A2, before the compound verbs, since
#   Tamil's aspect verbs, விடு (viṭu) and கொள் (koḷ), are built on it; the
#   verb classes (weak and strong, by their past stem) come with the past.
# - Reported speech is the quotative என்று (eṉṟu), spoken -னு (-ṉu).
#
# No Tamil deck is written yet, so the path lists no deck and `alphabet` is
# empty: the validator takes only written decks there. When the script
# decks are written, `alphabet` lists ta-script-vowels,
# ta-script-consonants, ta-script-reading, ta-script-vowel-signs,
# ta-script-grantha, ta-spelling and the first reader, and the two script
# units become lists of them, as Telugu's are. Until then each script unit
# is planned with a grammar topic, since a planned unit names a theme or a
# grammar topic. Spelling and the first reader come after B1, as Telugu's
# do; they are added to the path when written, since nothing is planned
# after B1.
schema: 1
kind: "path"
id: "ta-path"
language: "ta"
# The gender classes a noun's gender is one of (#512; DECK-FORMAT.md, Card
# data): Tamil's three, the rational masculine and feminine (உயர்திணை
# (uyartiṇai): ஆண்பால் (āṇpāl) and பெண்பால் (peṇpāl)) and the irrational
# (அஃறிணை (aḵṟiṇai)), written "m", "f" and "n" as Kannada's are. A
# noun's class decides its verb's third-person ending: -ஆன் (-āṉ), -ஆள்
# (-āḷ) or -அது (-atu). The plural's rational and irrational split
# (-ஆர்கள் (-ārkaḷ) against -அன (-aṉa)) follows from it and needs no
# class of its own.
genders: ["m", "f", "n"]
# Where Tamil is spoken, for a rater's region and a card's region note
# (ADR-0036): Tamil Nadu's four dialect regions, each named with example
# districts, then Sri Lanka, Malaysia and Singapore. The ids are permanent,
# as card ids are; rename a name, never an id. The app adds "Elsewhere"
# after them.
regions:
  - id: "northern"
    name: { "en": "Northern Tamil Nadu (Chennai, Vellore, Puducherry)" }
  - id: "central"
    name: { "en": "Central Tamil Nadu (Thanjavur, Tiruchirappalli)" }
  - id: "kongu"
    name: { "en": "Kongu, western Tamil Nadu (Coimbatore, Erode, Salem)" }
  - id: "southern"
    name: { "en": "Southern Tamil Nadu (Madurai, Tirunelveli, Kanyakumari)" }
  - id: "sri-lanka"
    name: { "en": "Sri Lanka (Jaffna, Batticaloa)" }
  - id: "malaysia"
    name: { "en": "Malaysia" }
  - id: "singapore"
    name: { "en": "Singapore" }
# The decks that need the alphabet: empty until the script decks are
# written (see above).
alphabet: []
units:
  # 1. The phrasebook, taught whole from the first lesson. ta-first-words
  # joins this unit.
  - planned: { id: "ta-phrasebook", theme: "first-words", words: 8 }
    listening_passages:
      - { id: "first-meeting", text: { "en": "Two people greet each other and say their names" } }
    reading_passages:
      - { id: "welcome-card", text: { "en": "A welcome card: hello, thank you and please" } }
  # 2. The first word units.
  - planned: { id: "ta-sound-differences", grammar: "sound-differences", words: 10 }
    listening_passages:
      - { id: "sound-pairs", text: { "en": "Pairs of words that differ in one sound, said slowly" } }
    reading_passages:
      - { id: "sound-pairs-list", text: { "en": "A list of word pairs with their readings" } }
  - planned: { id: "ta-questions", theme: "questions", words: 11 }
    listening_passages:
      - { id: "yes-or-no", text: { "en": "Short questions answered with yes and no" } }
    reading_passages:
      - { id: "question-cards", text: { "en": "Cards with who, what, where and when" } }
  # ta-addressing joins this unit.
  - planned: { id: "ta-pronouns", theme: "pronouns", words: 33 }
    listening_passages:
      - { id: "polite-or-not", text: { "en": "Speaking to a friend, an elder and a shopkeeper" } }
    reading_passages:
      - { id: "who-is-who", text: { "en": "A short list of people and how to address them" } }
  - planned: { id: "ta-family", theme: "family", words: 25 }
    listening_passages:
      - { id: "family-photo", text: { "en": "Someone names the people in a family photo" } }
    reading_passages:
      - { id: "family-tree", text: { "en": "A family tree with its labels" } }
  - planned: { id: "ta-numbers-1-20", theme: "numbers-1-20", words: 20 }
    listening_passages:
      - { id: "phone-number", text: { "en": "Someone reads out a phone number" } }
    reading_passages:
      - { id: "price-tags", text: { "en": "Price tags on small things" } }
  # 3. The script, after the first six units (#554: skipped by a learner
  # who already reads it). ta-script-consonants and ta-script-reading join
  # the first; ta-script-grantha joins the second.
  - planned: { id: "ta-script-vowels", grammar: "script-letters", words: 0 }
    listening_passages:
      - { id: "letter-names", text: { "en": "The vowels and consonants said in order" } }
    reading_passages:
      - { id: "first-signs", text: { "en": "Short words on shop signs, letter by letter" } }
  - planned: { id: "ta-script-vowel-signs", grammar: "script-vowel-signs", words: 0 }
    listening_passages:
      - { id: "syllable-rows", text: { "en": "One consonant with each vowel sign, said in a row" } }
    reading_passages:
      - { id: "name-boards", text: { "en": "Name boards with borrowed sounds and dead consonants" } }
  # 4. The core: about 200 common words, most common first (by judgement
  # until the Wikipedia counts are written, #516).
  - planned: { id: "ta-about-me", theme: "about-me", words: 7 }
    listening_passages:
      - { id: "introducing-myself", text: { "en": "Someone says their name, home town and work" } }
    reading_passages:
      - { id: "profile-card", text: { "en": "A short profile card" } }
  - planned: { id: "ta-verbs", theme: "everyday-verbs", words: 33 }
    listening_passages:
      - { id: "what-i-do", text: { "en": "Someone lists what they do each day" } }
    reading_passages:
      - { id: "to-do-list", text: { "en": "A short to-do list" } }
  - planned: { id: "ta-adverbs", theme: "adverbs", words: 50 }
    listening_passages:
      - { id: "how-often", text: { "en": "Saying how often and how well things are done" } }
    reading_passages:
      - { id: "habit-survey", text: { "en": "A short survey about everyday habits" } }
  - planned: { id: "ta-quantities", theme: "quantities", words: 30 }
    listening_passages:
      - { id: "a-little-more", text: { "en": "Asking for a little more and a little less" } }
    reading_passages:
      - { id: "shopping-amounts", text: { "en": "A shopping list with amounts" } }
  - planned: { id: "ta-describing", theme: "describing", words: 40 }
    listening_passages:
      - { id: "big-and-small", text: { "en": "Describing things: big, small, hot and cold" } }
    reading_passages:
      - { id: "for-sale-note", text: { "en": "A note describing something for sale" } }
  - planned: { id: "ta-time", theme: "time", words: 18 }
    listening_passages:
      - { id: "what-time", text: { "en": "Asking and telling the time" } }
    reading_passages:
      - { id: "opening-hours", text: { "en": "A shop's opening hours" } }
  - planned: { id: "ta-location", theme: "location", words: 14 }
    listening_passages:
      - { id: "where-is-it", text: { "en": "Saying where things are in a room" } }
    reading_passages:
      - { id: "room-labels", text: { "en": "Labels: on, under, inside and near" } }
  - planned: { id: "ta-more-verbs", theme: "more-verbs", words: 32 }
    listening_passages:
      - { id: "helping-out", text: { "en": "Asking someone to bring, give and keep things" } }
    reading_passages:
