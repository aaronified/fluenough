    sentences:
      - text: "தமிழ்நாடு இந்தியாவில் இருக்கிறது."
        reading: "tamiḻnāṭu intiyāvil irukkiṟatu."
        ipa: "t̪amiɻnaːʈu int̪ijaːʋil iɾukkirat̪u"
      - text: "சென்னை தமிழ்நாட்டின் தலைநகரம்."
        reading: "ceṉṉai tamiḻnāṭṭiṉ talainakaram."
        ipa: "sennai t̪amiɻnaːʈʈin t̪alainakaɾam"
      - text: "மதுரையில் வைகை நதி இருக்கிறது."
        reading: "maturaiyil vaikai nati irukkiṟatu."
        ipa: "mat̪uɾaijil ʋaikai nat̪i iɾukkirat̪u"
      - text: "நீலகிரி மலை தமிழ்நாட்டில் இருக்கிறது."
        reading: "nīlakiri malai tamiḻnāṭṭil irukkiṟatu."
        ipa: "niːlakiɾi malai t̪amiɻnaːʈʈil iɾukkirat̪u"
