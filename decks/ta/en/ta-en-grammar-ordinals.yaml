native: { code: "en", iso639_3: "eng", name: "English" }
name: "Ordinals: first, second, third"
description: "First to tenth, alone, before a noun and in a date, spoken forms before the written ones. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
pattern:
  name: "Ordinals"
  slot_name: "form"
  entries:
    "onru": "one; first"
    "irandu": "two; second"
    "moonru": "three; third"
    "naanku": "four; fourth"
    "ainthu": "five; fifth"
    "aaru": "six; sixth"
    "ezhu": "seven; seventh"
    "ettu": "eight; eighth"
    "onpathu": "nine; ninth"
    "pathu": "ten; tenth"
  notes: "To say first, second, third, add -ஆவது (-āvatu) to the number and drop its last -உ (-u): இரண்டு (iraṇṭu), two, gives இரண்டாவது (iraṇṭāvatu), second, and மூன்று (mūṉṟu), three, gives மூன்றாவது (mūṉṟāvatu), third. Before a noun the ending is -ஆம் (-ām): இரண்டாம் வகுப்பு (iraṇṭām vakuppu) is second class, that is class two, and the date uses it too: இரண்டாம் தேதி (iraṇṭām tēti), the second of the month. First is its own word, முதல் (mutal) before a noun and முதலாவது (mutalāvatu) on its own. In speech the numbers shorten, as in ரெண்டாவது (reṇṭāvatu) for second and மூணாவது (mūṇāvatu) for third, and the first form in a cell is the spoken one. Not yet checked by a Tamil speaker: the shortened forms and the date forms need a check."
