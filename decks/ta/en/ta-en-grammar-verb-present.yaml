core: "ta-grammar-verb-present"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs now: I, you, he, she, we, they"
description: "Every verb the course teaches, in the present, for each person, with the common spoken form before the written one where it is regular. The written endings follow English Wikipedia, Tamil grammar. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "person"
  slots:
    "naan": "I (do it now)"
    "naankal": "we, not including you"
    "naam": "we, including you"
    "nee": "you, to a friend or child"
    "neenkal": "you, polite or more than one"
    "avan": "he"
    "aval": "she"
    "avar": "he or she, polite"
    "atu": "it"
    "avarkal": "they"
rules:
  "ta-rule-present-first":
    name: "-கிறேன் (-kiṟēṉ), -கிறோம் (-kiṟōm): I and we"
    explanation: "These endings follow the verb's stem. {1} is I and {2} is we: {3}, to go, gives {4}, and speech shortens it to {5}. {6} and {7}, the two words for we, take the same ending. A few verbs change their stem first: {8}, to come, uses the stem வரு (varu), so I come is {9}. The present means what happens now and what happens as a habit. In a cell with two forms the first is the common spoken form and the second the written one. Source for the written endings: English Wikipedia, Tamil grammar, verb terminations."
  "ta-rule-present-second":
    name: "-கிறாய் (-kiṟāy), -கிறீர்கள் (-kiṟīrkaḷ): you"
    explanation: "{1} is for {3}, a friend or a child, and {2} is for {4}, someone you respect, or more than one person: {5} and {6}. In speech the second is often {7}. Source: English Wikipedia, Tamil grammar, verb terminations."
  "ta-rule-present-third":
    name: "-கிறான் (-kiṟāṉ), -கிறாள் (-kiṟāḷ), -கிறார் (-kiṟār), -கிறது (-kiṟatu): he, she, it, they"
    explanation: "{1} is for he, {2} for she, {3} for a respected person of either sex, {4} for it and {5} for they. In speech, {6}, it goes, is the usual form for {7}. Source: English Wikipedia, Tamil grammar, verb terminations."
