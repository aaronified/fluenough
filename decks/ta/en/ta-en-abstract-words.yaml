tags: ["unreviewed"]
cards:
  "ta-8510":
    native: "conscience"
    notes:
      n1: "Built from மனம் (maṉam), mind and சாட்சி (cāṭci), witness: the witness inside the mind."
    examples:
      "என் மனசாட்சி சொல்கிறது.":
        native: "My conscience says so."
        bases:
          "என்": "my; from நான் (nāṉ), I"
          "மனசாட்சி": "conscience"
          "சொல்கிறது": "is saying; from சொல் (col), to say; to tell"
      "அவனுக்கு மனசாட்சி இல்லை.":
        native: "He has no conscience."
        bases:
          "அவனுக்கு": "to him; for him; from அவன் (avaṉ), he; him"
          "மனசாட்சி": "conscience"
  "ta-8511":
    native: "discipline; good conduct"
    notes:
      n1: "Orderly and decent behaviour."
    examples:
      "பள்ளியில் ஒழுக்கம் முக்கியம்.":
        native: "Discipline is important in school."
        bases:
          "பள்ளியில்": "at the school; from பள்ளி (paḷḷi), school"
          "ஒழுக்கம்": "discipline; good conduct"
          "முக்கியம்": "important"
      "அவனிடம் ஒழுக்கம் இருக்கிறது.":
        native: "He has good conduct."
        bases:
          "அவனிடம்": "with him; from அவன் (avaṉ), he"
          "ஒழுக்கம்": "discipline; good conduct"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-8512":
    native: "quality; good character; culture"
    notes:
      n1: "A good trait of a person; also a grammatical quality word."
    examples:
      "அவளுக்கு நல்ல பண்பு இருக்கிறது.":
        native: "She has good character."
        bases:
          "அவளுக்கு": "to her; for her; from அவள் (avaḷ), she"
          "பண்பு": "quality; good character; culture"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "இது நல்ல பண்பு.":
        native: "This is a good quality."
        bases:
          "பண்பு": "quality; good character; culture"
  "ta-8513":
    native: "self-respect; honour"
    notes:
      n1: "A person's sense of pride that he will not lose."
    examples:
      "மானம் முக்கியம்.":
        native: "Self-respect is important."
        bases:
          "மானம்": "self-respect; honour"
          "முக்கியம்": "important"
      "அவன் மானம் பெரியது.":
        native: "His self-respect is great."
        bases:
          "மானம்": "self-respect; honour"
          "பெரியது": "big; from பெரிய (periya), big"
  "ta-8514":
    native: "dignity; prestige"
    notes:
      n1: "A respected standing among people; a loanword from Sanskrit."
    examples:
      "குடும்பக் கௌரவம் முக்கியம்.":
        native: "The family's prestige is important."
        bases:
          "குடும்பக்": "family (before a word starting with k); from குடும்பம் (kuṭumpam), family"
          "கௌரவம்": "dignity; prestige"
          "முக்கியம்": "important"
      "அவருக்குக் கௌரவம் இருக்கிறது.":
        native: "He has dignity."
        bases:
          "அவருக்குக்": "to him or her (polite); for him or her (polite); from அவர் (avar), he or she (polite)"
          "கௌரவம்": "dignity; prestige"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-8515":
    native: "boldness; daring"
    notes:
      n1: "The noun of துணிச்சலான (tuṇiccalāṉa), brave, a word taught earlier."
    examples:
      "அவனுக்குத் துணிச்சல் இருக்கிறது.":
        native: "He has boldness."
        bases:
          "அவனுக்குத்": "to him; for him; from அவன் (avaṉ), he; him"
          "துணிச்சல்": "boldness; daring"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "துணிச்சல் முக்கியம்.":
        native: "Boldness is important."
        bases:
          "துணிச்சல்": "boldness; daring"
          "முக்கியம்": "important"
  "ta-8516":
    native: "ambition; ideal; aim"
    notes:
      n1: "A big aim in life; the spelling இலட்சியம் (ilaṭciyam) is also written."
    examples:
      "அவனுக்குப் பெரிய லட்சியம் இருக்கிறது.":
        native: "He has a big ambition."
        bases:
          "அவனுக்குப்": "to him; for him; from அவன் (avaṉ), he; him"
          "லட்சியம்": "ambition; ideal; aim"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "என் லட்சியம் மருத்துவர் ஆவது.":
        native: "My ambition is to become a doctor."
        bases:
          "என்": "my; from நான் (nāṉ), I"
          "லட்சியம்": "ambition; ideal; aim"
          "ஆவது": "becoming (as a noun); from ஆகு (āku), to become"
  "ta-8517":
    native: "purpose; aim; intention"
    notes:
      n1: "The reason for doing something."
    examples:
      "இதன் நோக்கம் என்ன?":
        native: "What is the purpose of this?"
        bases:
          "இதன்": "its; from இது (itu), this; it"
          "நோக்கம்": "purpose; aim; intention"
      "அவன் நோக்கம் நல்லது.":
        native: "His intention is good."
        bases:
          "நோக்கம்": "purpose; aim; intention"
  "ta-8518":
    native: "thought; thinking"
    notes:
      n1: "Quiet thinking; the verb is சிந்தி (cinti), to think."
    examples:
      "இது நல்ல சிந்தனை.":
        native: "This is a good thought."
        bases:
          "சிந்தனை": "thought; thinking"
      "அவன் சிந்தனையில் இருக்கிறான்.":
        native: "He is lost in thought."
        bases:
          "சிந்தனையில்": "in thought; from சிந்தனை (cintaṉai), thought"
          "இருக்கிறான்": "is; from இரு (iru), to be"
  "ta-8519":
    native: "knowledge; intelligence"
    notes:
      n1: "What a person knows and how clearly he thinks."
    examples:
      "அவனுக்கு நிறைய அறிவு இருக்கிறது.":
        native: "He has a lot of knowledge."
        bases:
          "அவனுக்கு": "to him; for him; from அவன் (avaṉ), he; him"
          "அறிவு": "knowledge; intelligence"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "அறிவு முக்கியம்.":
        native: "Knowledge is important."
        bases:
          "அறிவு": "knowledge; intelligence"
          "முக்கியம்": "important"
  "ta-8520":
    native: "intellect; mind; sense"
    notes:
      n1: "A person's mind or common sense; also a warning: புத்தி சொல் (putti col), to advise."
    examples:
      "அவனுக்கு நல்ல புத்தி இருக்கிறது.":
        native: "He has good sense."
        bases:
          "அவனுக்கு": "to him; for him; from அவன் (avaṉ), he; him"
          "புத்தி": "intellect; mind; sense"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "புத்தி கூர்மையானது.":
        native: "The mind is sharp."
        bases:
          "புத்தி": "intellect; mind; sense"
          "கூர்மையானது": "is sharp; from கூர்மையான (kūrmaiyāṉa), sharp"
  "ta-8521":
    native: "wisdom; deep knowledge"
    notes:
      n1: "Knowledge gained from life; a loanword from Sanskrit."
    examples:
      "அவரிடம் ஞானம் இருக்கிறது.":
        native: "He has wisdom."
        bases:
          "அவரிடம்": "with him; from அவர் (avar), he; she (polite)"
          "ஞானம்": "wisdom; deep knowledge"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "ஞானம் முக்கியம்.":
        native: "Wisdom is important."
        bases:
          "ஞானம்": "wisdom; deep knowledge"
          "முக்கியம்": "important"
  "ta-8522":
    native: "effort; attempt"
    notes:
      n1: "Trying hard for something; முயற்சி செய் (muyaṟci cey), to make an effort."
    examples:
      "உன் முயற்சி நல்லது.":
        native: "Your effort is good."
        bases:
          "உன்": "your; from நீ (nī), you (to a friend or child)"
          "முயற்சி": "effort; attempt"
      "முயற்சி வெற்றி தருகிறது.":
        native: "Effort brings success."
        bases:
          "முயற்சி": "effort; attempt"
          "தருகிறது": "gives; from தா (tā), to give"
  "ta-8523":
    native: "equality"
    notes:
      n1: "Built from சமம் (camam), equal and -த்துவம் (-ttuvam), the state."
    examples:
      "எல்லோருக்கும் சமத்துவம் வேண்டும்.":
        native: "Everyone needs equality."
        bases:
          "எல்லோருக்கும்": "to everyone; for everyone; from எல்லோர் (ellōr), everyone"
          "சமத்துவம்": "equality"
      "சமத்துவம் முக்கியம்.":
        native: "Equality is important."
        bases:
          "சமத்துவம்": "equality"
          "முக்கியம்": "important"
  "ta-8524":
    native: "brotherhood; fellow feeling"
    notes:
      n1: "Built from சகோதரன் (cakōtaraṉ), brother and -த்துவம் (-ttuvam), the state."
    examples:
      "நமக்குள் சகோதரத்துவம் இருக்கிறது.":
        native: "There is brotherhood among us."
        bases:
          "நமக்குள்": "among us; from நாம் (nām), we (including you)"
          "சகோதரத்துவம்": "brotherhood; fellow feeling"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "சகோதரத்துவம் முக்கியம்.":
        native: "Brotherhood is important."
        bases:
          "சகோதரத்துவம்": "brotherhood; fellow feeling"
          "முக்கியம்": "important"
  "ta-8525":
    native: "pity; mercy"
    notes:
      n1: "A feeling for someone who suffers; கருணை (karuṇai), compassion is a word taught earlier."
    examples:
      "அவனுக்கு இரக்கம் இருக்கிறது.":
        native: "He has pity."
        bases:
          "அவனுக்கு": "to him; for him; from அவன் (avaṉ), he; him"
          "இரக்கம்": "pity; mercy"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "இரக்கம் வேண்டும்.":
        native: "Mercy is needed."
        bases:
          "இரக்கம்": "pity; mercy"
  "ta-8526":
    native: "suffering; hardship"
    notes:
      n1: "Pain of the body or the mind; the pair of இன்பம் (iṉpam), pleasure."
    examples:
      "வாழ்க்கையில் துன்பம் இருக்கிறது.":
        native: "There is suffering in life."
        bases:
          "வாழ்க்கையில்": "in life; from வாழ்க்கை (vāḻkkai), life"
          "துன்பம்": "suffering; hardship"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "துன்பம் தணிகிறது.":
        native: "The suffering eases."
        bases:
          "துன்பம்": "suffering; hardship"
          "தணிகிறது": "present, it; from தணி (taṇi), to subside"
  "ta-8527":
    native: "pleasure; delight"
    notes:
      n1: "Joy that is felt deeply; a literary word."
    examples:
      "வாழ்க்கையில் இன்பம் இருக்கிறது.":
        native: "There is pleasure in life."
        bases:
          "வாழ்க்கையில்": "in life; from வாழ்க்கை (vāḻkkai), life"
          "இன்பம்": "pleasure; delight"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "இன்பம் துன்பம் இரண்டும் இருக்கிறது.":
        native: "Both pleasure and suffering are there."
        bases:
          "இன்பம்": "pleasure; delight"
          "இரண்டும்": "both; from இரண்டு (iraṇṭu), two"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-8528":
    native: "pain; anguish"
    notes:
      n1: "Sharp pain or grief."
    examples:
      "அவனுக்கு வேதனை.":
        native: "He is in anguish."
        bases:
          "அவனுக்கு": "to him; for him; from அவன் (avaṉ), he; him"
          "வேதனை": "pain; anguish"
      "வேதனை பெரியது.":
        native: "The anguish is big."
        bases:
          "வேதனை": "pain; anguish"
          "பெரியது": "big; from பெரிய (periya), big"
  "ta-8529":
    native: "pride; dignified joy"
    notes:
      n1: "A quiet, deep pride in something done well."
    examples:
      "எனக்குப் பெருமிதம்.":
        native: "I feel proud."
        bases:
          "எனக்குப்": "to me; from நான் (nāṉ), I"
          "பெருமிதம்": "pride; dignified joy"
      "அவன் முகத்தில் பெருமிதம் இருக்கிறது.":
        native: "There is pride on his face."
        bases:
          "முகத்தில்": "on the face; from முகம் (mukam), face"
          "பெருமிதம்": "pride; dignified joy"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-8530":
    native: "laziness"
    notes:
      n1: "Not wanting to work."
    examples:
      "அவனுக்குச் சோம்பல் அதிகம்.":
        native: "He has a lot of laziness."
        bases:
          "அவனுக்குச்": "to him; for him; from அவன் (avaṉ), he"
          "சோம்பல்": "laziness"
      "சோம்பல் நல்லது இல்லை.":
        native: "Laziness is not good."
        bases:
          "சோம்பல்": "laziness"
  "ta-8531":
    native: "greed"
    notes:
      n1: "Built from பெரு (peru), big and ஆசை (ācai), desire, a word taught earlier."
    examples:
      "பேராசை நல்லது இல்லை.":
        native: "Greed is not good."
        bases:
          "பேராசை": "greed"
      "அவனுக்குப் பேராசை இருக்கிறது.":
        native: "He has greed."
        bases:
          "அவனுக்குப்": "to him; for him; from அவன் (avaṉ), he; him"
          "பேராசை": "greed"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-8532":
    native: "arrogance; ego"
    notes:
      n1: "A proud feeling of being above others."
    examples:
      "ஆணவம் நல்லது இல்லை.":
        native: "Arrogance is not good."
        bases:
          "ஆணவம்": "arrogance; ego"
      "அவனிடம் ஆணவம் இருக்கிறது.":
        native: "He has arrogance."
        bases:
          "அவனிடம்": "with him; from அவன் (avaṉ), he"
          "ஆணவம்": "arrogance; ego"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-8533":
    native: "ego; haughtiness"
    notes:
      n1: "A stronger Sanskrit-origin word close to ஆணவம் (āṇavam), arrogance."
    examples:
      "அகங்காரம் வேண்டாம்.":
        native: "No arrogance, please."
        bases:
          "அகங்காரம்": "ego; haughtiness"
      "அவனிடம் அகங்காரம் இருக்கிறது.":
        native: "He has haughtiness."
        bases:
          "அவனிடம்": "with him; from அவன் (avaṉ), he"
          "அகங்காரம்": "ego; haughtiness"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-8534":
    native: "humility; politeness"
    notes:
      n1: "Behaving modestly towards others."
    examples:
      "பணிவு முக்கியம்.":
        native: "Humility is important."
        bases:
          "பணிவு": "humility; politeness"
          "முக்கியம்": "important"
      "அவனிடம் பணிவு இருக்கிறது.":
        native: "He has humility."
        bases:
          "அவனிடம்": "with him; from அவன் (avaṉ), he"
          "பணிவு": "humility; politeness"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-8535":
    native: "fall; decline; collapse"
    notes:
      n1: "The noun of வீழ் (vīḻ), to fall; a drop in price or power."
    examples:
      "விலையில் வீழ்ச்சி இருக்கிறது.":
        native: "There is a fall in the price."
        bases:
          "விலையில்": "in the price; from விலை (vilai), price"
          "வீழ்ச்சி": "fall; decline; collapse"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "இது பெரிய வீழ்ச்சி.":
        native: "This is a big decline."
        bases:
          "வீழ்ச்சி": "fall; decline; collapse"
  "ta-8536":
    native: "result; fruit; benefit"
    notes:
      n1: "What comes out of work done."
    examples:
      "உன் உழைப்புக்குப் பலன் கிடைக்கும்.":
