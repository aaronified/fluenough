name: "Abstract words: ideas, values, feelings and duty"
description: "Abstract words: values, character, thought, hopes and fears, society and belief, with the verbs of thinking, judging and deciding and adjectives for ideas. Not yet checked by a Tamil speaker: please report any mistake."
