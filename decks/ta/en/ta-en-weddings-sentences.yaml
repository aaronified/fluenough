core: "ta-weddings-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Weddings: the invitation, the rites and the guests in sentences"
description: "Sentences about a wedding invitation, the hall, the rites and the family. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-9530":
    native: "I give an invitation to everyone."
    bases:
      "எல்லோருக்கும்": "to everyone; from எல்லோர் (ellōr), everyone"
      "கொடுக்கிறேன்": "I give; from கொடு (koṭu), to give"
    confusables:
      w1: { why: "பரிசுப்பொருள் (paricupporuḷ), gift item, is a different word." }
      w2: { why: "மொய் (moy), gift of money, is a different word." }
      w3: { why: "ஏற்பாடு (ēṟpāṭu), arrangement; preparation, is a different word." }
  "ta-9531":
    native: "The bride puts on a new silk sari."
    bases:
      "பட்டுப்புடவை": "silk sari"
      "அணிகிறாள்": "she wears; from அணி (aṇi), to wear"
    notes:
      n1: "பட்டு (paṭṭu), silk and புடவை (puṭavai), sari are joined, with ப் (p) added: பட்டுப்புடவை (paṭṭuppuṭavai)."
    confusables:
      w1: { why: "தாலி (tāli), thali; marriage necklace, is a different word." }
      w2: { why: "நகை (nakai), jewellery, is a different word." }
      w3: { why: "சந்தனம் (cantaṉam), sandalwood paste, is a different word." }
  "ta-9532":
    native: "The bridegroom comes to the hall."
    bases:
      "மண்டபத்துக்கு": "to the hall; from மண்டபம் (maṇṭapam), hall"
      "வருகிறார்": "he comes; from வா (vā), to come"
    notes:
      n1: "The -ம் (-m) of மண்டபம் (maṇṭapam), hall becomes -த்து (-ttu) before -க்கு (-kku): மண்டபத்துக்கு (maṇṭapattukku)."
    confusables:
      w1: { why: "மணமகன் (maṇamakaṉ), bridegroom, is a different word." }
      w2: { why: "புரோகிதர் (purōkitar), priest, is a different word." }
      w3: { why: "நண்பர் (naṇpar), friend (respectful), is a different word." }
  "ta-9533":
    native: "The guests eat on banana leaves."
    bases:
      "விருந்தினர்கள்": "guests; from விருந்தினர் (viruntiṉar), guest"
      "வாழையிலையில்": "on a banana leaf; from வாழையிலை (vāḻaiyilai), banana leaf"
      "சாப்பிடுகிறார்கள்": "are eating; from சாப்பிடு (cāppiṭu), to eat"
    confusables:
      w1: { why: "சாப்பாடு (cāppāṭu), food; meal, is a different word." }
      w2: { why: "பந்தல் (pantal), pavilion; canopy, is a different word." }
      w3: { why: "மண்டபம் (maṇṭapam), hall; wedding hall, is a different word." }
  "ta-9534":
    native: "The auspicious time is at seven in the morning."
    bases:
      "மணிக்கு": "at the hour; from மணி (maṇi), hour; bell"
    confusables:
      w1: { why: "தேதி (tēti), date (of the month), is a different word." }
      w2: { why: "நேரம் (nēram), time, is a different word." }
      w3: { why: "ஏற்பாடு (ēṟpāṭu), arrangement; preparation, is a different word." }
  "ta-9535":
    native: "My mother-in-law's house is nearby."
    bases:
      "என்": "my; from நான் (nāṉ), I"
      "இருக்கிறது": "is; from இரு (iru), to be"
    confusables:
      w1: { why: "மாமனார் (māmaṉār), father-in-law, is a different word." }
      w2: { why: "மருமகள் (marumakaḷ), daughter-in-law, is a different word." }
      w3: { why: "மருமகன் (marumakaṉ), son-in-law, is a different word." }
  "ta-9536":
    native: "They stand on the stage as a couple."
    bases:
      "ஜோடியாக": "as a pair; from ஜோடி (jōṭi), pair"
      "மேடையில்": "on the stage; from மேடை (mēṭai), stage"
      "நிற்கிறார்கள்": "they stand; from நில் (nil), to stand"
    notes:
      n1: "-ஆக (-āka) makes an adverb: ஜோடியாக (jōṭiyāka), as a pair."
    confusables:
      w1: { why: "தம்பதி (tampati), married couple, is a different word." }
      w2: { why: "மணமகன் (maṇamakaṉ), bridegroom, is a different word." }
      w3: { why: "மணமகள் (maṇamakaḷ), bride, is a different word." }
  "ta-9537":
    native: "Everyone wishes them well."
    bases:
      "அவர்களை": "them (object); from அவர்கள் (avarkaḷ), they"
      "வாழ்த்துகிறார்கள்": "they wish well; from வாழ்த்து (vāḻttu), to wish well"
    notes:
      n1: "வாழ்த்து (vāḻttu) is both a noun (greeting) and a verb (to wish well); this sentence uses the verb."
    confusables:
      w1: { why: "ஆசீர்வாதம் (ācīrvātam), blessing, is a different word." }
      w2: { why: "பரிசுப்பொருள் (paricupporuḷ), gift item, is a different word." }
      w3: { why: "மொய் (moy), gift of money, is a different word." }
  "ta-9538":
    native: "They have the engagement tomorrow."
    bases:
      "அவர்களுக்கு": "to them; for them; from அவர்கள் (avarkaḷ), they"
    notes:
      n1: "Tamil says அவர்களுக்கு (avarkaḷukku), to them for an event that belongs to them, as எனக்கு (eṉakku), to me in எனக்கு வேலை (eṉakku vēlai), I have work."
    confusables:
      w1: { why: "திருமணம் (tirumaṇam), wedding; marriage, is a different word." }
      w2: { why: "ஜாதகம் (jātakam), horoscope, is a different word." }
      w3: { why: "பொருத்தம் (poruttam), match; suitability, is a different word." }
