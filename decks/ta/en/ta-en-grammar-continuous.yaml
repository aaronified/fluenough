    "vaanku": "to buy"
    "kel": "to listen"
  notes: "The present continuous says what is happening now. It is the verbal participle of the verb, with கொண்டு (koṇṭu) added, and then the verb இரு (iru), to be, in the present: போய்க் கொண்டிருக்கிறேன் (pōyk koṇṭirukkiṟēṉ), I am going. The first part is the same for every person and the ending -கிறேன் (-kiṟēṉ) and the rest follow the person, as in the present tense. The plain present, as in நாங்கள் சாப்பிடுகிறோம் (nāṅkaḷ cāppiṭukiṟōm), is often used for what is happening now as well. The forms are the written ones. Source: English Wikipedia, Tamil grammar (the verb endings and the verbal participle); the pattern of the compound is unreviewed."
