          "சரியாக": "rightly; correctly; from சரி (cari), right"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-8069":
    native: "sculpture; carving"
    notes:
      n1: "A figure carved in stone, wood or metal."
    examples:
      "இது அழகான சிற்பம்.":
