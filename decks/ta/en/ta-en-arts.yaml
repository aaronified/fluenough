tags: ["unreviewed"]
cards:
  "ta-8060":
    native: "debut performance; first stage show"
    notes:
      n1: "The first public performance of a dancer or musician after years of training."
    examples:
      "அவள் அரங்கேற்றம் இன்று.":
        native: "Her debut performance is today."
        bases:
          "அரங்கேற்றம்": "debut performance; first stage show"
      "அரங்கேற்றம் எங்கே?":
        native: "Where is the debut performance?"
        bases:
          "அரங்கேற்றம்": "debut performance; first stage show"
  "ta-8061":
    native: "concert; music recital"
    notes:
      n1: "A concert of music; used for a classical concert and also for a film-music show."
    examples:
      "இன்று கச்சேரி இருக்கிறது.":
        native: "There is a concert today."
        bases:
          "கச்சேரி": "concert; music recital"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "கச்சேரி எப்போது?":
        native: "When is the concert?"
        bases:
          "கச்சேரி": "concert; music recital"
  "ta-8062":
    native: "musical instrument"
    notes:
      n1: "The older word for an instrument; the modern word is இசைக்கருவி (icaikkaruvi), musical instrument."
    examples:
      "இது என் வாத்தியம்.":
        native: "This is my instrument."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "வாத்தியம்": "musical instrument"
      "வாத்தியம் எங்கே?":
        native: "Where is the instrument?"
        bases:
          "வாத்தியம்": "musical instrument"
  "ta-8063":
    native: "mridangam; two-headed drum"
    notes:
      n1: "A drum that accompanies a classical concert."
    examples:
      "எனக்கு மிருதங்கம் பிடிக்கும்.":
        native: "I like the mridangam."
        bases:
          "எனக்கு": "to me; for me; from நான் (nāṉ), I; me"
          "மிருதங்கம்": "mridangam; two-headed drum"
      "மிருதங்கம் கேட்கிறது.":
        native: "The mridangam is heard."
        bases:
          "மிருதங்கம்": "mridangam; two-headed drum"
          "கேட்கிறது": "is heard; from கேள் (kēḷ), to hear; to ask"
  "ta-8064":
    native: "tabla; pair of drums"
    notes:
      n1: "A pair of hand drums."
