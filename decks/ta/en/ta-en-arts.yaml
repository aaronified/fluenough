        bases:
          "தாளம்": "rhythm; beat"
          "போடுகிறான்": "he puts; he keeps (a beat); from போடு (pōṭu), to put; to throw"
  "ta-8067":
    native: "raga; melody pattern"
    notes:
      n1: "The tune pattern of a song in Indian music; the vowel in the first syllable is long."
    examples:
      "இது என்ன ராகம்?":
        native: "Which raga is this?"
        bases:
          "ராகம்": "raga; melody pattern"
      "எனக்கு இந்த ராகம் பிடிக்கும்.":
        native: "I like this raga."
        bases:
          "எனக்கு": "to me; for me; from நான் (nāṉ), I; me"
          "இந்த": "this (before a noun)"
          "ராகம்": "raga; melody pattern"
  "ta-8068":
    native: "pitch; drone note"
    notes:
      n1: "The note a singer holds as a base."
    examples:
      "சுருதி நல்லது.":
        native: "The pitch is good."
        bases:
          "சுருதி": "pitch; drone note"
      "அவள் சுருதி சரியாக இருக்கிறது.":
