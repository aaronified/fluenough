          "வாசிக்கிறாள்": "she plays; from வாசி (vāci), to play an instrument"
  "ta-8066":
    native: "rhythm; beat"
    notes:
      n1: "The beat of a song; you keep it by clapping."
    examples:
      "தாளம் நல்லது.":
        native: "The rhythm is good."
        bases:
          "தாளம்": "rhythm; beat"
      "அவன் தாளம் போடுகிறான்.":
