native: { code: "en", iso639_3: "eng", name: "English" }
name: "Arts: music, dance, painting and the stage"
description: "The arts: instruments, rhythm, dance, painting, sculpture, the stage and the artists, with the verbs of playing, carving and performing. Not yet checked by a Tamil speaker: please report any mistake."
