kind: "layer"
core: "ta-grammar-pitfalls"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Pairs that learners mix up"
description: "Seven pairs that English speakers often confuse: give, not, like and want, come and go, will not and did not, one and a, and listen and ask. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
pattern:
  name: "Pairs"
  slot_name: "word"
  entries:
    "give": "give: to someone else (first), to me or us (second)"
    "not": "is not (first), there is not or does not have (second)"
    "likewant": "is liked (first), is wanted or needed (second)"
    "comego": "come towards the speaker (first), go away from the speaker (second)"
    "willdid": "will not come (first), did not come (second)"
    "one": "one on its own (first), a or one before a noun (second)"
    "listenask": "listen (first), ask (second): one verb, two meanings"
  notes: "Each row sets two words that learners mix up. The gloss of the row says what the first and the second are. கொடு (koṭu) gives to someone else and தா (tā) gives to me or to us. அல்ல (alla) says that a thing is not what it is said to be, and இல்லை (illai) says that a thing is not there. பிடிக்கும் (piṭikkum) is liking and வேண்டும் (vēṇṭum) is wanting. வா (vā) comes towards the speaker and போ (pō) goes away. வரமாட்டேன் (varamāṭṭēṉ) looks ahead, and வரவில்லை (varavillai) looks back. ஒன்று (oṉṟu) is a number on its own and ஒரு (oru) stands before a noun. கேள் (kēḷ) is both to listen and to ask, and the object tells which: இதை (itai) for what is listened to, அவரிடம் (avariṭam) for the person asked. Not yet checked by a Tamil speaker: please report any mistake."
