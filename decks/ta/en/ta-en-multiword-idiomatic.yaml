# Layer for ta-multiword-idiomatic.
schema: 1
id: "ta-en-multiword-idiomatic"
kind: "layer"
core: "ta-multiword-idiomatic"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: idioms"
description: "20 Tamil verb phrases: to pester someone, to pester or persecute someone, to make a determined effort to win, to rub one's eyes, to go to prison, to let someone down, to muddle things up, to miss or lose something through a silly mistake, to brag about something, to suffer a humiliating defeat, to ruin something, to climb a mountain, to poke one's nose into something, to breathe, to hesitate to say something, to win, to cut down, to hit someone, to beg for money or help, and to listen. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "ta-6340":
    native: "to pester someone; to give someone great trouble"
    notes:
      "u1": "An idiom; the spoken form is உசுரெடு (ucureṭu), and it means the same as உயிரைவாங்கு (uyiraivāṅku)."
      "l1": "Literally to take life."
    bases:
      "உயிரெடு": { meaning: "to pester; from உயிர் (uyir) (life) and எடு (eṭu) (to take)" }
  "ta-6341":
    native: "to pester or persecute someone"
    notes:
      "u1": "An idiom, also written with a space as உயிரை வாங்கு (uyirai vāṅku), with the same meaning as உயிரெடு (uyireṭu); its plain sense is to take a toll of life."
      "l1": "Literally to take life."
    bases:
      "உயிரைவாங்கு": { meaning: "to pester; from உயிரை (uyirai) (life, object) and வாங்கு (vāṅku) (to take)" }
  "ta-6342":
    native: "to make a determined effort to win; to take on a challenge"
    notes:
      "u1": "An idiom, written in three ways (ஒருகைபார் (orukaipār), ஒரு கை பார் (oru kai pār), ஒருகை பார் (orukai pār)); it does not take an object."
      "l1": "Literally to try a hand."
    bases:
      "ஒருகைபார்": { meaning: "to try one's hand; from ஒரு (oru) (one), கை (kai) (hand), பார் (pār) (to see)" }
  "ta-6343":
    native: "to rub one's eyes; to be in tears"
    notes:
      "u1": "The plain sense is rubbing the eyes on waking up; as an idiom it means to be sad or to weep."
      "l1": "Literally to rub the eye."
    bases:
      "கண்ணைக்கசக்கு": { meaning: "to rub the eyes; from கண்ணை (kaṇṇai) (eye, object) and கசக்கு (kacakku)" }
  "ta-6344":
    native: "to go to prison; to do time"
    notes:
      "u1": "An idiom, also written as two words, கம்பி எண்ணு (kampi eṇṇu); it is said of someone in jail."
      "l1": "Literally to count the bars."
    bases:
      "கம்பியெண்ணு": { meaning: "to be in prison; from கம்பி (kampi) (bar) and எண்ணு (eṇṇu) (to count)" }
  "ta-6345":
    native: "to let someone down; to be a pain in the neck"
    notes:
      "u1": "An idiom, also written as கழுத்தை அறு (kaḻuttai aṟu); the plain sense is to cut the throat, and the idioms are to annoy someone and to leave them in the lurch."
      "l1": "Literally to cut the throat."
    bases:
      "கழுத்தறு": { meaning: "to cut the throat; from கழுத்து (kaḻuttu) (throat) and அறு (aṟu) (to cut)" }
  "ta-6346":
    native: "to muddle things up; to make things worse"
    notes:
      "u1": "An idiom, also written as குட்டையைக் குழப்பு (kuṭṭaiyaik kuḻappu); it is said of someone who adds to the confusion."
      "l1": "Literally to stir the pool."
    bases:
      "குட்டையைக்குழப்பு": { meaning: "to muddle things; from குட்டையை (kuṭṭaiyai) (pool, object) and குழப்பு (kuḻappu) (to stir)" }
  "ta-6347":
    native: "to miss or lose something through a silly mistake; to fail"
    notes:
      "u1": "An idiom for missing a chance carelessly; en.wiktionary is not sure whether the first part is கோட்டை (kōṭṭai) (fort) or the object form of கோடு (kōṭu) (line), so no literal sense is given."
    bases:
      "கோட்டைவிடு": { meaning: "to miss, to fail; from கோட்டை (kōṭṭai) and விடு (viṭu) (to leave)" }
  "ta-6348":
    native: "to brag about something"
    notes:
      "u1": "An idiom, written as two words; the plain sense is to beat a tom-tom, so it is to brag."
      "l1": "Literally to beat a tom-tom."
    bases:
      "தம்பட்டம்": { meaning: "tom-tom, a drum used to announce" }
      "அடி": { meaning: "to beat" }
  "ta-6349":
    native: "to suffer a humiliating defeat"
    notes:
      "u1": "An idiom, also written as மண்ணைக் கவ்வு (maṇṇaik kavvu); it is said of a heavy defeat."
      "l1": "Literally to bite the soil."
    bases:
      "மண்ணைக்கவ்வு": { meaning: "to be badly beaten; from மண்ணை (maṇṇai) (soil, object) and கவ்வு (kavvu) (to bite)" }
  "ta-6350":
    native: "to ruin something; to shatter someone's hopes"
    notes:
      "u1": "An idiom; it has the variants மண்ணை அள்ளிப்போடு (maṇṇai aḷḷippōṭu) and மண்ணை வாரிப்போடு (maṇṇai vārippōṭu), and it is said of spoiling someone's plan or luck."
      "l1": "Literally to drop soil."
    bases:
      "மண்ணைப்போடு": { meaning: "to ruin; from மண்ணை (maṇṇai) (soil, object) and போடு (pōṭu) (to drop)" }
  "ta-6351":
    native: "to climb a mountain; as an idiom, to come to an end"
    notes:
      "u1": "The plain sense is climbing a mountain; as an idiom it means to leave, as a deity leaves a place, or to come to an end and become a thing of the past."
      "l1": "Literally to climb a mountain."
    bases:
      "மலையேறு": { meaning: "to climb a mountain; from மலை (malai) (mountain) and ஏறு (ēṟu) (to climb)" }
  "ta-6352":
    native: "to poke one's nose into something"
    notes:
      "u1": "An idiom, also written as மூக்கை நுழை (mūkkai nuḻai); it is said of interfering in other people's business."
      "l1": "Literally to put the nose in."
    bases:
      "மூக்கைநுழை": { meaning: "to interfere; from மூக்கை (mūkkai) (nose, object) and நுழை (nuḻai) (to enter)" }
  "ta-6353":
    native: "to breathe; to take a breather"
    notes:
      "u1": "The plain sense is to breathe; in a negative or conditional sentence it is an idiom meaning to breathe a word, as in saying nothing about a secret."
      "l1": "Literally to let out breath."
    bases:
      "மூச்சுவிடு": { meaning: "to breathe; from மூச்சு (mūccu) (breath) and விடு (viṭu) (to let out)" }
  "ta-6354":
    native: "to hesitate to say something"
    notes:
      "u1": "An idiom, with the spoken form மென்னுமுழுங்கு (meṉṉumuḻuṅku); it describes someone who cannot bring himself to say something plainly."
      "l1": "Literally to chew and swallow."
    bases:
      "மென்றுவிழுங்கு": { meaning: "to hesitate; from மென்று (meṉṟu) (chewing) and விழுங்கு (viḻuṅku) (to swallow)" }
  "ta-6355":
    native: "to win; to triumph"
    notes:
      "u1": "A formal idiom, also written as வாகை சூடு (vākai cūṭu); the older warriors of the Sangam age wore garlands of lebbek flowers to show victory."
      "l1": "Literally to wear the lebbek garland."
    bases:
      "வாகைசூடு": { meaning: "to triumph; from வாகை (vākai) (lebbek tree) and சூடு (cūṭu) (to wear)" }
  "ta-6356":
    native: "to cut down; to kill; ironically, to achieve great things"
    notes:
      "u1": "The participle வெட்டி (veṭṭi) (cutting) plus முறி (muṟi); the ironic sense is to 'accomplish' great things."
      "l1": "Literally to cut and break."
    bases:
      "வெட்டிமுறி": { meaning: "to cut down; from வெட்டி (veṭṭi) and முறி (muṟi) (to break)" }
  "ta-6357":
    native: "to hit someone; to beg; to take a bribe"
    notes:
      "u1": "The plain sense is to hold out a hand, and the idioms are to strike another person, to beg, and to take bribes; for example உன் தம்பி மேல் கைநீட்டாதே (uṉ tampi mēl kainīṭṭātē) (do not hit your brother)."
      "l1": "Literally to stretch out a hand."
    bases:
      "கைநீட்டு": { meaning: "to hold out a hand; from கை (kai) (hand) and நீட்டு (nīṭṭu) (to stretch)" }
  "ta-6358":
    native: "to beg for money or help"
    notes:
      "u1": "An idiom with the sense of asking for monetary help; கைநீட்டு (kainīṭṭu) and பிச்சையெடு (piccaiyeṭu) have the same sense."
      "l1": "Literally to hold out the hands."
    bases:
      "கையேந்து": { meaning: "to beg; from கை (kai) (hand) and ஏந்து (ēntu) (to hold up)" }
  "ta-6359":
    native: "to listen; to heed"
    notes:
      "u1": "A noun and a verb that mean to pay attention and to heed advice; காதுகொடு (kātukoṭu) is a synonym."
      "l1": "Literally to give an ear."
    bases:
      "செவிகொடு": { meaning: "to listen, to heed; from செவி (cevi) (ear) and கொடு (koṭu) (to give)" }
