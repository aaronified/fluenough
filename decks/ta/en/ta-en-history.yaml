        bases:
          "தளபதி": "commander; general"
          "இருக்கிறார்": "is; from இரு (iru), to be"
  "ta-8118":
    native: "empire"
    notes:
      n1: "Built from பெரு (peru), big and அரசு (aracu), state."
    examples:
      "இது பெரிய பேரரசு.":
        native: "This is a big empire."
