id: "ta-en-history"
kind: "layer"
core: "ta-history"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "History: kings, forts, wars and heritage"
description: "History and heritage: kings and queens, forts and palaces, wars and weapons, inscriptions and coins, and the freedom struggle, with the verbs of ruling and fighting. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-8110":
    native: "king; raja"
    notes:
      n1: "The everyday word for a king; அரசர் (aracar), king is the more formal word."
    examples:
      "அவர் ராஜா.":
        native: "He is a king."
        bases:
          "ராஜா": "king; raja"
      "ராஜா எங்கே இருக்கிறார்?":
        native: "Where is the king?"
        bases:
          "ராஜா": "king; raja"
          "இருக்கிறார்": "is; from இரு (iru), to be"
  "ta-8111":
    native: "queen"
    notes:
      n1: "The wife of a king, or a woman who rules."
    examples:
      "அவள் ராணி.":
        native: "She is a queen."
        bases:
          "ராணி": "queen"
      "ராணி அரண்மனையில் இருக்கிறாள்.":
        native: "The queen is in the palace."
        bases:
          "ராணி": "queen"
          "அரண்மனையில்": "in the palace; from அரண்மனை (araṇmaṉai), palace"
          "இருக்கிறாள்": "is; from இரு (iru), to be"
  "ta-8112":
    native: "king; ruler"
    notes:
      n1: "The formal word for a ruler; the woman is அரசி (araci), queen."
    examples:
      "அரசர் நல்லவர்.":
        native: "The king is a good man."
        bases:
          "அரசர்": "king; ruler"
          "நல்லவர்": "good man (polite); from நல்ல (nalla), good"
      "இவர் அரசர்.":
        native: "This is a king."
        bases:
          "அரசர்": "king; ruler"
  "ta-8113":
    native: "queen; woman ruler"
    notes:
      n1: "The pair of அரசர் (aracar), king."
    examples:
      "அரசி இங்கே இருக்கிறாள்.":
        native: "The queen is here."
        bases:
          "அரசி": "queen; woman ruler"
          "இருக்கிறாள்": "is; from இரு (iru), to be"
      "அவள் அரசி.":
        native: "She is a queen."
        bases:
          "அரசி": "queen; woman ruler"
  "ta-8114":
    native: "fort; fortress"
    notes:
      n1: "A fort with strong walls."
    examples:
      "இது பழைய கோட்டை.":
        native: "This is an old fort."
        bases:
          "கோட்டை": "fort; fortress"
      "கோட்டை பெரியது.":
        native: "The fort is big."
        bases:
          "கோட்டை": "fort; fortress"
          "பெரியது": "big; from பெரிய (periya), big"
  "ta-8115":
    native: "palace"
    notes:
      n1: "The home of a king."
    examples:
      "இது பெரிய அரண்மனை.":
        native: "This is a big palace."
        bases:
          "அரண்மனை": "palace"
      "அரண்மனை எங்கே இருக்கிறது?":
        native: "Where is the palace?"
        bases:
          "அரண்மனை": "palace"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-8116":
    native: "war; battle"
    notes:
      n1: "A war between kings or countries; it is a short word with a final ர் (r)."
    examples:
      "போர் பெரியது.":
        native: "The war is big."
        bases:
          "போர்": "war; battle"
          "பெரியது": "big; from பெரிய (periya), big"
      "போரில் வீரர்கள் இருக்கிறார்கள்.":
        native: "There are soldiers in the war."
        bases:
          "போரில்": "in the war; from போர் (pōr), war"
          "வீரர்கள்": "soldiers; players; from வீரர் (vīrar), soldier; player"
          "இருக்கிறார்கள்": "are; from இரு (iru), to be"
  "ta-8117":
    native: "commander; general"
    notes:
      n1: "The head of an army."
    examples:
      "அவர் தளபதி.":
        native: "He is a commander."
