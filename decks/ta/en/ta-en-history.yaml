          "அருங்காட்சியகத்தில்": "in the museum; from அருங்காட்சியகம் (aruṅkāṭciyakam), museum"
          "ஓலைச்சுவடி": "palm-leaf manuscript"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-8124":
    native: "coin; honesty"
    notes:
      n1: "A metal coin; in speech நாணயம் (nāṇayam) also means a person's honesty."
