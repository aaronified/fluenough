      "அவன் வம்சம் பெரியது.":
        native: "His lineage is big."
        bases:
          "வம்சம்": "dynasty; lineage"
          "பெரியது": "big; from பெரிய (periya), big"
  "ta-8121":
    native: "century"
    notes:
      n1: "Built from நூறு (nūṟu), hundred and ஆண்டு (āṇṭu), year."
    examples:
      "இது பழைய நூற்றாண்டு.":
        native: "This is an old century."
