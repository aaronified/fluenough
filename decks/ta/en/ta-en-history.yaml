          "கல்வெட்டு": "stone inscription"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "இது பழைய கல்வெட்டு.":
        native: "This is an old stone inscription."
        bases:
          "கல்வெட்டு": "stone inscription"
  "ta-8123":
