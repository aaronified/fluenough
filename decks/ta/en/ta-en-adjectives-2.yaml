cards:
  "ta-2247":
    native: "heavy"
    notes:
      n1: "The -ஆன (-āṉa) ending joins before a noun: கனமான பெட்டி (kaṉamāṉa peṭṭi). The opposite is லேசான (lēcāṉa)."
    examples:
      "கனமான பெட்டி.":
        native: "A heavy box."
        bases:
          "கனமான": "heavy"
      "இது கனமான பை.":
        native: "This is a heavy bag."
        bases:
          "கனமான": "heavy"
  "ta-2248":
    native: "light (in weight)"
    notes:
      n1: "The opposite of கனமான (kaṉamāṉa); it also means mild, as in a light meal."
    examples:
      "லேசான பை.":
        native: "A light bag."
        bases:
          "லேசான": "light (in weight)"
      "லேசான சாப்பாடு.":
