schema: 1
id: "ta-en-festivals"
kind: "layer"
core: "ta-festivals"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Festivals and celebrations"
description: "Pongal, Deepavali, Navaratri and other festivals, with the words for lamps, kolam, sweets, gifts, guests and celebrating. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-1168":
    native: "festival"
    notes:
      n1: "பண்டிகை (paṇṭikai) is a festival that families mark at home; a temple festival is a திருவிழா (tiruviḻā)."
    examples:
      "இன்று பண்டிகை.":
        native: "Today is a festival."
        bases:
          "பண்டிகை": "festival"
      "பண்டிகைக்கு புது துணி வாங்கு.":
        native: "Buy new clothes for the festival."
        bases:
          "பண்டிகைக்கு": "for the festival; from பண்டிகை (paṇṭikai), festival"
  "ta-1169":
    native: "Pongal (the harvest festival; the rice dish)"
    notes:
      n1: "பொங்கல் (poṅkal) is the harvest festival on the first day of the Tamil month of தை (tai), about 14 or 15 January; it is also the dish of rice boiled with milk and jaggery."
    examples:
      "நாளை பொங்கல்.":
        native: "Tomorrow is Pongal."
        bases:
          "பொங்கல்": "Pongal (the harvest festival; the rice dish)"
      "பொங்கலுக்கு புது துணி.":
        native: "New clothes for Pongal."
        bases:
          "பொங்கலுக்கு": "for Pongal; from பொங்கல் (poṅkal), Pongal"
  "ta-1170":
    native: "Deepavali (the festival of lights)"
    notes:
      n1: "தீபாவளி (tīpāvaḷi) is the festival of lights; fireworks and sweets are part of it, and many Hindus take a ritual oil bath at dawn."
    examples:
      "இன்று தீபாவளி.":
        native: "Today is Deepavali."
        bases:
          "தீபாவளி": "Deepavali (the festival of lights)"
      "தீபாவளிக்கு பட்டாசு வாங்கு.":
        native: "Buy firecrackers for Deepavali."
        bases:
          "தீபாவளிக்கு": "for Deepavali; from தீபாவளி (tīpāvaḷi), Deepavali"
  "ta-1171":
    native: "New Year"
    notes:
      n1: "The Tamil New Year falls on about 14 April, the first day of the month of சித்திரை (cittirai); people say புத்தாண்டு வாழ்த்துகள் (puttāṇṭu vāḻttukaḷ), happy new year."
    examples:
      "இன்று புத்தாண்டு.":
        native: "Today is New Year's Day."
        bases:
          "புத்தாண்டு": "New Year"
      "புத்தாண்டுக்கு புது துணி.":
        native: "New clothes for the New Year."
        bases:
          "புத்தாண்டுக்கு": "for the New Year; from புத்தாண்டு (puttāṇṭu), New Year"
  "ta-1172":
    native: "Navaratri (the nine-night festival)"
    notes:
      n1: "நவராத்திரி (navarāttiri) is a festival of nine nights in the autumn; in Tamil Nadu homes set up a கொலு (kolu) during it."
    examples:
      "நவராத்திரி ஒன்பது இரவு.":
        native: "Navaratri is nine nights."
        bases:
          "நவராத்திரி": "Navaratri (the nine-night festival)"
      "நவராத்திரியில் கொலு இருக்கிறது.":
        native: "There is a golu during Navaratri."
        bases:
          "நவராத்திரியில்": "during Navaratri; from நவராத்திரி (navarāttiri), Navaratri"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-1173":
    native: "golu (a display of dolls on steps)"
    notes:
      n1: "கொலு (kolu) is a display of dolls on steps, shown during Navaratri; family, neighbours and friends visit to see it and share gifts and sweets."
    examples:
      "வீட்டில் கொலு இருக்கிறது.":
        native: "There is a golu at home."
        bases:
          "கொலு": "golu (a display of dolls on steps)"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "கொலுவுக்கு வா.":
        native: "Come to the golu."
        bases:
          "கொலுவுக்கு": "to the golu; from கொலு (kolu), golu"
  "ta-1174":
    native: "puja; worship"
    notes:
      n1: "பூஜை (pūjai) is worship with flowers, a lamp and offerings; it goes with the verb செய் (cey), do: பூஜை செய் (pūjai cey)."
    examples:
      "வீட்டில் பூஜை.":
        native: "There is a puja at home."
        bases:
          "பூஜை": "puja; worship"
      "நான் காலையில் பூஜை செய்கிறேன்.":
        native: "I do puja in the morning."
        bases:
          "காலையில்": "in the morning; from காலை (kālai), morning"
          "பூஜை": "puja; worship"
          "செய்கிறேன்": "do; from செய் (cey), to do"
  "ta-1175":
    native: "lamp (of worship)"
    notes:
      n1: "கார்த்திகை தீபம் (kārttikai tīpam) is the festival of lamps on the full moon of the month of Karthigai, usually in November or December; a great lamp is lit on the Arunachala hill at Tiruvannamalai."
    examples:
      "தீபம் வை.":
        native: "Put the lamp."
        bases:
          "தீபம்": "lamp (of worship)"
      "கோயிலில் தீபம் இருக்கிறது.":
        native: "There is a lamp in the temple."
        bases:
          "கோயிலில்": "in the temple; from கோயில் (kōyil), temple"
          "தீபம்": "lamp (of worship)"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-1176":
    native: "candle"
    notes:
      n1: "மெழுகுவர்த்தி (meḻukuvartti) is a wax candle; an oil lamp is a விளக்கு (viḷakku)."
    examples:
      "மேசையில் மெழுகுவர்த்தி இருக்கிறது.":
        native: "There is a candle on the table."
        bases:
          "மேசையில்": "on the table; from மேசை (mēcai), table"
          "மெழுகுவர்த்தி": "candle"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "மெழுகுவர்த்தி வேண்டும்.":
        native: "A candle is needed."
        bases:
          "மெழுகுவர்த்தி": "candle"
  "ta-1177":
    native: "firecracker"
    notes:
      n1: "You burst them with வெடி (veṭi): பட்டாசு வெடிக்கிறோம் (paṭṭācu veṭikkiṟōm), we burst firecrackers."
    examples:
      "பட்டாசு வேண்டாம்.":
        native: "No firecrackers, please."
        bases:
          "பட்டாசு": "firecracker"
      "இங்கே பட்டாசு இல்லை.":
        native: "There are no firecrackers here."
        bases:
          "பட்டாசு": "firecracker"
  "ta-1178":
    native: "sweet; sweet dish"
    notes:
      n1: "இனிப்பு (iṉippu) is both a sweet dish and the taste sweet."
    examples:
      "இது இனிப்பு.":
        native: "This is sweet."
        bases:
          "இனிப்பு": "sweet; sweet dish"
      "இனிப்பு கொடு.":
        native: "Give some sweets."
        bases:
          "இனிப்பு": "sweet; sweet dish"
  "ta-1179":
    native: "payasam (a sweet milk dessert)"
    notes:
      n1: "பாயசம் (pāyacam) is a semi-liquid dessert of milk cooked with rice or sago and sweetened with sugar or jaggery; பாயாசம் (pāyācam) is the spoken form."
    examples:
      "பாயசம் குடி.":
        native: "Drink the payasam."
        bases:
          "பாயசம்": "payasam (a sweet milk dessert)"
      "பாயசம் இனிப்பு.":
        native: "Payasam is sweet."
        bases:
          "பாயசம்": "payasam (a sweet milk dessert)"
  "ta-1180":
    native: "kumkum (red powder)"
    notes:
      n1: "குங்குமம் (kuṅkumam) is the red powder used in worship and for the mark on the forehead."
    examples:
      "குங்குமம் வேண்டும்.":
        native: "Kumkum is needed."
        bases:
          "குங்குமம்": "kumkum (red powder)"
      "பூ, குங்குமம் வாங்கு.":
        native: "Buy flowers and kumkum."
        bases:
          "குங்குமம்": "kumkum (red powder)"
  "ta-1181":
    native: "sugarcane"
    notes:
      n1: "At பொங்கல் (poṅkal) stalks of கரும்பு (karumpu) are set in the sun beside the decorated pot."
    examples:
      "கரும்பு இனிப்பு.":
        native: "Sugarcane is sweet."
        bases:
          "கரும்பு": "sugarcane"
      "பொங்கலுக்கு கரும்பு வேண்டும்.":
        native: "Sugarcane is needed for Pongal."
        bases:
          "பொங்கலுக்கு": "for Pongal; from பொங்கல் (poṅkal), Pongal"
          "கரும்பு": "sugarcane"
  "ta-1182":
    native: "pot"
    notes:
      n1: "At பொங்கல் (poṅkal) rice is boiled with milk and jaggery in a decorated பானை (pāṉai)."
    examples:
      "பானையில் பால் இருக்கிறது.":
        native: "There is milk in the pot."
        bases:
          "பானையில்": "in the pot; from பானை (pāṉai), pot"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "புதிய பானை வேண்டும்.":
        native: "A new pot is needed."
        bases:
          "பானை": "pot"
  "ta-1183":
    native: "to boil over; to overflow"
    notes:
      n1: "பொங்கு (poṅku) is to well up and spill over; the festival பொங்கல் (poṅkal) is named from it."
    examples:
      "பால் பொங்குகிறது.":
        native: "The milk is boiling over."
        bases:
          "பொங்குகிறது": "boils over; from பொங்கு (poṅku), to boil over"
      "பானை பொங்குகிறது.":
        native: "The pot is overflowing."
        bases:
          "பொங்குகிறது": "boils over; from பொங்கு (poṅku), to boil over"
  "ta-1184":
    native: "greeting; good wish"
    notes:
      n1: "People say புத்தாண்டு வாழ்த்துகள் (puttāṇṭu vāḻttukaḷ) for happy new year; வாழ்த்துகள் (vāḻttukaḷ) is the plural."
    examples:
      "பிறந்தநாள் வாழ்த்து.":
        native: "Birthday wishes."
        bases:
          "வாழ்த்து": "greeting; good wish"
      "புத்தாண்டு வாழ்த்து.":
        native: "New Year wishes."
        bases:
          "வாழ்த்து": "greeting; good wish"
  "ta-1185":
    native: "temple festival"
    notes:
      n1: "திருவிழா (tiruviḻā) is a festival with processions at a temple; விழா (viḻā) alone is a function or celebration."
    examples:
      "ஊரில் திருவிழா.":
        native: "There is a festival in the town."
        bases:
          "ஊரில்": "in the town; from ஊர் (ūr), town"
          "திருவிழா": "temple festival"
      "கோயில் திருவிழா நாளை.":
        native: "The temple festival is tomorrow."
        bases:
          "திருவிழா": "temple festival"
  "ta-1186":
    native: "temple chariot"
    notes:
      n1: "தேர் (tēr) is the temple chariot that is pulled through the streets at a திருவிழா (tiruviḻā)."
    examples:
      "தேர் வருகிறது.":
        native: "The chariot is coming."
        bases:
          "தேர்": "temple chariot"
          "வருகிறது": "comes; from வா (vā), to come"
      "கோயிலில் தேர் இருக்கிறது.":
        native: "There is a chariot at the temple."
        bases:
          "கோயிலில்": "in the temple; from கோயில் (kōyil), temple"
          "தேர்": "temple chariot"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-1187":
    native: "God; god"
    notes:
      n1: "கடவுள் (kaṭavuḷ) is God in general; the verb is respectful: கடவுள் இருக்கிறார் (kaṭavuḷ irukkiṟār)."
    examples:
      "கடவுள் இருக்கிறார்.":
        native: "God is there."
        bases:
          "கடவுள்": "God; god"
          "இருக்கிறார்": "is (respectful); from இரு (iru), to be"
      "கடவுளுக்கு நன்றி.":
        native: "Thanks be to God."
        bases:
          "கடவுளுக்கு": "to God; from கடவுள் (kaṭavuḷ), God"
  "ta-1188":
    native: "god; deity"
    notes:
      n1: "சாமி (cāmi) is the everyday word for a god or a picture of a god; கடவுள் (kaṭavuḷ) is God in general."
    examples:
      "சாமிக்கு பூ கொடு.":
        native: "Give flowers to the god."
        bases:
          "சாமிக்கு": "to the god; from சாமி (cāmi), god"
      "நான் சாமியை வணங்குகிறேன்.":
        native: "I worship God."
        bases:
          "சாமியை": "the god (object); from சாமி (cāmi), god"
          "வணங்குகிறேன்": "worship; from வணங்கு (vaṇaṅku), to worship"
  "ta-1189":
    native: "flower"
    notes:
      n1: "The plural is பூக்கள் (pūkkaḷ)."
    examples:
      "இது பூ.":
        native: "This is a flower."
        bases:
          "பூ": "flower"
      "கோயிலுக்கு பூ வாங்கு.":
        native: "Buy flowers for the temple."
        bases:
          "கோயிலுக்கு": "to the temple; from கோயில் (kōyil), temple"
          "பூ": "flower"
  "ta-1190":
    native: "procession"
    notes:
      n1: "The final letter changes before an ending: ஊர்வலம் (ūrvalam) becomes ஊர்வலத்தில் (ūrvalattil), in the procession."
    examples:
      "தெருவில் ஊர்வலம் இருக்கிறது.":
        native: "There is a procession in the street."
        bases:
          "தெருவில்": "in the street; from தெரு (teru), street"
          "ஊர்வலம்": "procession"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "ஊர்வலம் வருகிறது.":
        native: "The procession is coming."
        bases:
          "ஊர்வலம்": "procession"
          "வருகிறது": "comes; from வா (vā), to come"
  "ta-1191":
    native: "decoration"
    notes:
      n1: "The final letter changes before an ending: அலங்காரம் (alaṅkāram) becomes அலங்காரத்தில் (alaṅkārattil)."
    examples:
      "வீட்டில் நிறைய அலங்காரம்.":
        native: "There are many decorations at home."
        bases:
          "அலங்காரம்": "decoration"
      "தேருக்கு அலங்காரம் வேண்டும்.":
        native: "The chariot needs decorating."
        bases:
          "தேருக்கு": "for the chariot; from தேர் (tēr), chariot"
          "அலங்காரம்": "decoration"
  "ta-1192":
    native: "to celebrate"
    notes:
      n1: "The festival comes before the verb: பொங்கல் கொண்டாடு (poṅkal koṇṭāṭu), celebrate Pongal."
    examples:
      "நாம் பண்டிகை கொண்டாடுகிறோம்.":
        native: "We celebrate the festival."
        bases:
          "கொண்டாடுகிறோம்": "celebrate; from கொண்டாடு (koṇṭāṭu), to celebrate"
      "பொங்கல் கொண்டாடலாம்.":
        native: "We can celebrate Pongal."
        bases:
          "கொண்டாடலாம்": "can celebrate; from கொண்டாடு (koṇṭāṭu), to celebrate"
  "ta-1193":
    native: "fireworks display"
    notes:
      n1: "வாணவேடிக்கை (vāṇavēṭikkai) is a show of fireworks; one cracker is a பட்டாசு (paṭṭācu)."
    examples:
      "வாணவேடிக்கை பார்.":
        native: "Watch the fireworks."
        bases:
          "வாணவேடிக்கை": "fireworks display"
      "விழாவில் வாணவேடிக்கை இருக்கிறது.":
        native: "There are fireworks at the function."
        bases:
          "விழாவில்": "at the function; from விழா (viḻā), function"
          "வாணவேடிக்கை": "fireworks display"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-1194":
    native: "coconut"
    notes:
      n1: "People bring a தேங்காய் (tēṅkāy) to a temple as an offering."
    examples:
      "தேங்காய் வேண்டும்.":
        native: "A coconut is needed."
        bases:
          "தேங்காய்": "coconut"
      "கோயிலுக்கு தேங்காய் வாங்கு.":
        native: "Buy a coconut for the temple."
        bases:
          "கோயிலுக்கு": "to the temple; from கோயில் (kōyil), temple"
          "தேங்காய்": "coconut"
  "ta-1195":
    native: "feast; meal for guests"
    notes:
      n1: "விருந்து (viruntu) is a meal for guests, as at a festival or a wedding."
    examples:
      "வீட்டில் விருந்து.":
        native: "There is a feast at home."
        bases:
          "விருந்து": "feast; meal for guests"
      "விருந்து தயார்.":
        native: "The feast is ready."
        bases:
          "விருந்து": "feast; meal for guests"
          "தயார்": "ready"
  "ta-1196":
    native: "guest"
    notes:
