# Layer for ta-culture-1: each passage's English rendering and a note on it.
schema: 1
id: "ta-en-culture-1"
kind: "layer"
core: "ta-culture-1"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: Sangam anthologies and early classics"
description: "Eighteen short passages from the early Tamil anthologies and classics, from the Sangam poems to the epics, each with its English rendering and a note. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-6000":
    native: "Greater than the earth, higher than the sky, and deeper than the water is this friendship."
    notes:
      "n1": "The opening of a love poem of the Kuruntokai, which the page gives to the poet it spells Devakulathar and which compares love with earth, sky and water. The spaces follow the printed metre, not the words: the final m of each comparison (than the earth, than the sky, than water) is written on the next word, so the first letter of the following word looks like a separate sound."
    bases:
      "நிலத்தினும்": { meaning: "earth, land; here 'than the earth'" }
      "பெரிதே": { meaning: "great, vast; the last vowel adds emphasis" }
      "வானினு": { meaning: "sky; here 'than the sky'" }
      "முயர்ந்தன்று": { meaning: "to be high; 'also' joined on, with the old past ending for a thing" }
      "நீரினு": { meaning: "water; here 'than water'" }
      "மாரள": { meaning: "depth, great measure; the first letter belongs to the word before" }
      "வின்றே": { meaning: "the old word for 'is' used with a thing; the first letter belongs to the word before" }
  "ta-6001":
    native: "My heart aches, my heart aches, bearing tears that scorch the eyelids."
    notes:
      "n1": "The first lines of a Kuruntokai poem, which the page gives to the poet it spells Kamanjer Kulathar. The repeated cry is the poet's way of stressing the ache. The word for 'heart' is printed with an older sandhi spelling that doubles the sound n after the word for 'my'."
    bases:
      "நோமென்": { meaning: "to ache, to hurt; 'it aches' joined to 'my'" }
      "னெஞ்சே": { meaning: "heart, chest; the older sandhi spelling after the word for 'my'" }
      "இமைதீய்ப்": { meaning: "eyelid; joined with the word for 'scorching'" }
      "பன்ன": { meaning: "like, as if; the first letter joined on from the word before" }
      "கண்ணீர்": { meaning: "tears, from 'eye' and 'water'" }
      "தாங்கி": { meaning: "to bear, to carry; here 'having borne'" }
  "ta-6002":
    native: "The earth packed with soil, the sky that bears the earth, and the wind that sweeps the sky."
    notes:
      "n1": "The first three lines of a long poem that the page gives to the poet Murinjiyur Mudinagarayar, in praise of a Chera king. The poem goes on to name fire and water, so that these lines open a list of the five great elements. The page prints the text with the words already split, which is easier for a learner than the joined older spelling."
    bases:
      "மண்": { meaning: "soil, earth" }
      "திணிந்த": { meaning: "to be packed, dense; here 'that is packed'" }
      "நிலனும்": { meaning: "land, earth; with 'and'" }
      "நிலம்": { meaning: "land, earth" }
      "ஏந்திய": { meaning: "to hold up, to bear; here 'that bears'" }
      "விசும்பும்": { meaning: "sky, the open space above; with 'and'" }
      "விசும்பு": { meaning: "sky, the open space above" }
      "தைவரு": { meaning: "to stroke, to sweep over; here 'that sweeps'" }
      "வளியும்": { meaning: "wind, air; with 'and'" }
  "ta-6003":
    native: "Even if the earth should move, let not your word move."
    notes:
      "n1": "A line from a poem that the page gives to the poet Irumpidarthalaiyar, addressed to the Pandya king Perumperu Vazhuthi. It tells him to keep his word even if the world shifts. The ending in the second word is a conditional, 'even if it should move'."
    bases:
      "நிலம்": { meaning: "land, earth" }
      "பெயரினும்": { meaning: "to move, to shift; here 'even if it moves'" }
      "நின்சொற்": { meaning: "your word, from 'your' and 'word'" }
      "பெயரல்": { meaning: "to move; here the old 'do not move'" }
  "ta-6004":
    native: "Has he forgotten the word he gave, 'we shall not part, firm as a rock', my friend?"
    notes:
      "n1": "Two lines of the first poem of the Akananuru, spoken by a woman to her friend about the man who has gone away. The word for 'perhaps' makes it a doubting question, and the last word is how a woman addresses her close friend. The page names no poet for this poem."
    bases:
      "கல்போற்": { meaning: "stone, rock; joined with 'like'" }
      "பிரியலம்": { meaning: "to part; here 'we shall not part'" }
      "என்ற": { meaning: "to say; here 'that said'" }
      "சொல்தாம்": { meaning: "word, promise; the second part is a respectful 'he'" }
      "மறந்தனர்": { meaning: "to forget; here 'he forgot', in the respectful form" }
      "கொல்லோ": { meaning: "a particle that makes a question doubtful, 'perhaps'" }
      "தோழி": { meaning: "female friend, confidante" }
  "ta-6005":
    native: "Is the wealth you planned to win by crossing the mountains truly wealth?"
    notes:
      "n1": "A line from the second poem of the Kalittokai, where the page names Perunkadungon as the poet; the passage is a plea to a man who has decided to leave his beloved and cross the wilderness to earn money. The word for wealth is said twice: the first is the thing, the second is 'real value'. The last word is a question, 'can it be?'."
    bases:
      "மலை": { meaning: "hill, mountain" }
      "இறந்து": { meaning: "to cross, to pass beyond; here 'having crossed'" }
      "செயல்": { meaning: "deed, action, the thing to be done" }
      "சூழ்ந்த": { meaning: "to plan, to think over; here 'that was planned'" }
      "பொருள்": { meaning: "wealth, money; also 'meaning, thing, value'" }
      "ஆகுமோ": { meaning: "to become, to be; here 'will it be?', a question" }
  "ta-6006":
    native: "She of steadfast chastity will not live if you leave her."
    notes:
      "n1": "A line of the same Kalittokai poem, spoken to the man who thinks of leaving. The first word is a lengthened poetic form of the word for 'steadfast', and the last is 'one who will not live'. Both the second and fourth words contain the sound of the word for 'you' or 'leave'."
    bases:
      "நிலைஇய": { meaning: "to stand, to be firm; the lengthened poetic form 'steadfast'" }
      "கற்பினாள்": { meaning: "chastity, faithfulness; here 'she who has it'" }
      "நீ": { meaning: "you (singular, familiar)" }
      "நீப்பின்": { meaning: "to leave, to part from; here 'if you leave'" }
      "வாழாதாள்": { meaning: "to live; here 'she who will not live'" }
  "ta-6007":
    native: "The Kaveri, whose source is in the mountain and which ends in the sea, does not fail even if the sky fails."
    notes:
      "n1": "Lines from the long poem about the Chola port Kaveripattinam, in praise of the river Kaveri. The page prints each line twice, as it was written and with the words split, and the split text is used here. The key idea is 'sky fails' for a failed monsoon, and the river that does not."
    bases:
      "வான்": { meaning: "sky, here also the rain from the sky" }
      "பொய்ப்பினும்": { meaning: "to fail, to prove false; here 'even if it fails'" }
      "தான்": { meaning: "itself; here the river" }
      "பொய்யா": { meaning: "to fail; here 'that does not fail'" }
      "மலை": { meaning: "hill, mountain" }
      "தலைய": { meaning: "head, beginning; here 'having its head at'" }
      "கடல்": { meaning: "sea" }
      "காவிரி": { meaning: "the river Kaveri" }
  "ta-6008":
    native: "The flood spreads out and washes up gold, over wide fields whose harvest never fails."
    notes:
      "n1": "The next lines of the poem on Kaveripattinam, still about the Kaveri. 'Gold' is a picture for the rich silt and grain the flood leaves, not a literal claim. The word for 'fields' is a poetic word for rice fields."
    bases:
      "புனல்": { meaning: "water, flood, river water" }
      "பரந்து": { meaning: "to spread out; here 'having spread'" }
      "பொன்": { meaning: "gold" }
      "கொழிக்கும்": { meaning: "to wash up, to bring up; here 'washes up'" }
      "விளைவு": { meaning: "yield, harvest" }
      "அறா": { meaning: "to break off, to fail; here 'that does not stop'" }
      "வியல்": { meaning: "wide, broad" }
      "கழனி": { meaning: "field, paddy field" }
  "ta-6009":
    native: "As the first letter is the origin of all letters, so the world has the Primal Lord as its origin."
    notes:
      "n1": "The first couplet of the Tirukkural, in the page's split version (the page also prints the joined older spelling). A couplet has seven feet, and the first of the work's 1,330 couplets compares the letter that begins the alphabet with the first being of the world. Valluvar is the traditional author; the text itself does not name him."
    bases:
      "அகர": { meaning: "the letter a, the first letter" }
      "முதல": { meaning: "origin, first; here 'having as the first'" }
      "எழுத்து": { meaning: "letter, writing" }
      "எல்லாம்": { meaning: "all, everything" }
      "ஆதி": { meaning: "the first, the beginning" }
      "பகவன்": { meaning: "the Lord, the one with fortune" }
      "முதற்றே": { meaning: "origin; here 'has as its origin', with emphasis" }
      "உலகு": { meaning: "world" }
  "ta-6010":
    native: "What good has learning done, if one does not bow at the feet of the pure-minded one?"
    notes:
      "n1": "The second couplet of the Tirukkural, in the page's split version. The word for 'one who does not bow' has a lengthened poetic vowel, and 'if' is the ending on the last word. The first word is 'by what has been learned'."
    bases:
      "கற்றதனால்": { meaning: "to learn; here 'by what was learned'" }
      "ஆய": { meaning: "to become; here 'that came about'" }
      "பயன்": { meaning: "use, benefit" }
      "என்கொல்": { meaning: "what; with a particle that makes it a question" }
      "வால்": { meaning: "pure, white" }
      "அறிவன்": { meaning: "the knowing one, the wise one" }
      "நல்": { meaning: "good" }
      "தாள்": { meaning: "foot" }
      "தொழாஅர்": { meaning: "to worship, to bow; here the lengthened form of 'those who do not bow'" }
      "எனின்": { meaning: "to say; here 'if it is said', the ending of 'if'" }
  "ta-6011":
    native: "Wealth stays with no one; it comes like the wheel of a cart."
    notes:
      "n1": "Part of a verse on the instability of wealth in the Naladiyar, a work of Jain teaching. The page prints each line twice, as written and with the words split, and the split text is used here; the commentary of the 1940 edition on the page is not used. A wheel turns, so what is up comes down."
    bases:
      "யார்": { meaning: "who, anyone" }
      "மாட்டும்": { meaning: "at, with; here 'with anyone' by the ending that means 'also'" }
      "நில்லாது": { meaning: "to stay, to stand; here 'does not stay'" }
      "செல்வம்": { meaning: "wealth, fortune" }
      "சகடக்": { meaning: "cart, wheel; here 'of the cart'" }
      "கால்": { meaning: "wheel; the word also means 'foot' and 'wind'" }
      "போல": { meaning: "like, as" }
      "வரும்": { meaning: "to come; here 'will come'" }
  "ta-6012":
    native: "Eat the food won by the work of the plough oxen together with many people."
    notes:
      "n1": "A line from the same verse, advising that earned food be shared. The word for the plough ox is an older word, and 'many' is joined to the ending 'together with'. The last word is the old command, 'eat'."
    bases:
      "பகடு": { meaning: "ox, bullock for the plough" }
      "நடந்த": { meaning: "to walk, to go on; here 'that went on', so 'won by the walking of'" }
      "கூழ்": { meaning: "food, porridge, boiled grain" }
      "பல்லாரோடு": { meaning: "many people; here 'together with many'" }
      "உண்க": { meaning: "to eat; here the old command 'let one eat'" }
  "ta-6013":
    native: "The sceptre and the white umbrella will fall, overturned, onto the solid ground."
    notes:
      "n1": "Lines of the canto in which, on the page, the Pandya queen tells of her bad dream; the page marks this passage with the heading karuppam. The sceptre and the white umbrella are the signs of a king's rule, so their fall is a bad omen."
    bases:
      "செங்கோலும்": { meaning: "sceptre, just rule; with 'and'" }
      "வெண்குடையும்": { meaning: "white umbrella, the sign of a king; with 'and'" }
      "செறிநிலத்து": { meaning: "firm, packed ground; here 'onto the ground'" }
      "மறிந்துவீழ்தரும்": { meaning: "to turn over; here 'will turn over and fall'" }
  "ta-6014":
    native: "Tell him that a woman who has lost her husband, a pair of anklets in her hand, is at the gate."
    notes:
      "n1": "The words with which Kannaki asks the gatekeeper to announce her to the Pandya king, in the canto of pleading the case.  The first word describes a pair of anklets, and the page's spaces follow the verse metre, so some words begin with a letter that belongs to the one before."
    bases:
      "இணையரிச்": { meaning: "a pair of rattling things, here the anklet pair" }
      "சிலம்பொன்": { meaning: "anklet; joined with the word for 'one'" }
      "றேந்திய": { meaning: "to hold up, to carry; here 'that carried'" }
      "கையள்": { meaning: "hand; here 'she who has it in her hand'" }
      "கணவனை": { meaning: "husband; with the ending for the object" }
      "இழந்தாள்": { meaning: "to lose; here 'she lost'" }
      "கடையகத்": { meaning: "gate, entrance; here 'she who is at the gate'" }
      "தாளென்று": { meaning: "saying that; the first letters are the end of the word 'she who is'" }
      "அறிவிப்": { meaning: "to make known, to announce; the first half of the word" }
      "பாயே": { meaning: "the second half of 'you will announce', with a final vowel that adds emphasis" }
  "ta-6015":
    native: "For all who live in this dense world, those who gave them food gave them life."
    notes:
      "n1": "Two lines from canto 11, the canto of receiving the bowl, in a passage about giving food. The line is one of the best known of Tamil: food given is life given. The last word has a final vowel that adds emphasis, so 'they are the very ones who gave life'."
    bases:
      "மண்": { meaning: "soil, earth" }
      "திணி": { meaning: "to be dense, packed" }
      "ஞாலத்து": { meaning: "world; here 'in the world'" }
      "வாழ்வோர்க்கு": { meaning: "to live; here 'for those who live'" }
      "எல்லாம்": { meaning: "all" }
      "உண்டி": { meaning: "food, meal" }
      "கொடுத்தோர்": { meaning: "to give; here 'those who gave'" }
      "உயிர்": { meaning: "life, breath" }
      "கொடுத்தோரே": { meaning: "to give; here 'the very ones who gave'" }
  "ta-6016":
    native: "Those who end the great hunger of the helpless: on them rests the true way of life in the world."
    notes:
      "n1": "The lines just before the best-known couplet of the same canto. It speaks of those who take away the hunger of people who cannot bear it. The reading of the last two words as 'the true path of living' is the builder's."
    bases:
      "ஆற்றா": { meaning: "to bear, to be able; here 'who cannot bear'" }
      "மாக்கள்": { meaning: "people, living beings" }
      "அரும்": { meaning: "hard, rare, great" }
      "பசி": { meaning: "hunger" }
      "களைவோர்": { meaning: "to remove; here 'those who remove'" }
      "மேற்றே": { meaning: "above, upon; here 'rests upon them'" }
      "உலகின்": { meaning: "world; here 'of the world'" }
      "மெய்ந்நெறி": { meaning: "the true path, from 'truth' and 'way'" }
      "வாழ்க்கை": { meaning: "life, way of living" }
  "ta-6017":
    native: "Those who reach the glorious feet of him who went upon the flower will live long upon the earth."
    notes:
      "n1": "The third couplet of the Tirukkural, in the page's split version. The word for 'upon' is used twice, once for the flower and once for the earth, and the last word is 'those who will live'. The page also prints the joined older spelling, where the two words 'upon the flower' are written as one."
    bases:
      "மலர்": { meaning: "flower, blossom" }
      "மிசை": { meaning: "on, upon, above" }
      "ஏகினான்": { meaning: "to go, to move along; here 'he who went'" }
      "மாண்": { meaning: "glorious, excellent" }
      "அடி": { meaning: "foot" }
      "சேர்ந்தார்": { meaning: "to join, to reach; here 'those who reached'" }
      "நிலம்": { meaning: "land, earth" }
      "நீடு": { meaning: "long, for a long time" }
      "வாழ்வார்": { meaning: "to live; here 'those who will live'" }
