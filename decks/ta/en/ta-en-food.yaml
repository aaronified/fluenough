cards:
  "ta-0244":
    native: "food; meal"
    notes:
      n1: "Food, or a meal: சாப்பாடு தயார் (cāppāṭu tayār, the food is ready)."
    examples:
      "சாப்பாடு தயார்.":
        native: "The food is ready."
        bases:
          "சாப்பாடு": "food; meal"
          "தயார்": "ready"
      "சாப்பாடு நல்லது.":
        native: "The food is good."
        bases:
          "சாப்பாடு": "food; meal"
  "ta-0245":
    native: "coffee"
    notes:
      n1: "Coffee."
    examples:
      "காபி குடி.":
        native: "Drink coffee."
        bases:
          "காபி": "coffee"
      "காபி வேண்டும்.":
        native: "Coffee is wanted."
        bases:
          "காபி": "coffee"
          "வேண்டும்": "is needed"
  "ta-0246":
    native: "tea"
    notes:
      n1: "Tea, as drunk in Tamil homes."
    examples:
      "தேநீர் குடி.":
        native: "Drink tea."
        bases:
          "தேநீர்": "tea"
      "இது தேநீர்.":
        native: "This is tea."
        bases:
          "தேநீர்": "tea"
  "ta-0247":
    native: "cooked rice"
    notes:
      n1: "Cooked rice, eaten with a curry."
    examples:
      "சாதம் சாப்பிடு.":
        native: "Eat rice."
        bases:
          "சாதம்": "cooked rice"
      "சாதம் போதும்.":
        native: "Rice is enough."
        bases:
          "சாதம்": "cooked rice"
  "ta-0248":
    native: "dosa"
    notes:
      n1: "A thin crisp pancake of fermented rice and lentil batter."
    examples:
      "தோசை சாப்பிடு.":
        native: "Eat a dosa."
        bases:
          "தோசை": "dosa"
