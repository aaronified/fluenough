        native: "This is a dosa."
        bases:
          "தோசை": "dosa"
  "ta-0249":
    native: "idli"
    notes:
      n1: "A steamed rice cake."
    examples:
      "இட்லி சாப்பிடு.":
        native: "Eat an idli."
        bases:
          "இட்லி": "idli"
