schema: 1
id: ta-en-questions
kind: layer
core: ta-questions
native:
  code: en
  iso639_3: eng
  name: English
name: Yes, no and questions
description: 'Nine question words: who, what, where, when, how, why, which, how many and how much, each standing where its answer will stand; and ''isn''t it?'', asked at the end of a statement. Not yet checked by a Tamil speaker: please report any mistake.'
