schema: 1
id: "ta-en-grammar-imperatives"
kind: "layer"
core: "ta-grammar-imperatives"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Commands, do not, and let us"
description: "Every verb the course teaches as a command to a friend and to a respected person, as do not, and as let us, with the common spoken form before the written one. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "friend": "a command to a friend or child"
    "polite": "a command, polite or to several people"
    "not-friend": "do not, to a friend or child"
    "not-polite": "do not, polite or to several people"
    "lets": "let us; you may"
rules:
  "ta-rule-imperative-positive":
    name: "Commands: the bare verb, and -உங்கள் (-uṅkaḷ) for respect"
    explanation: "A command to a friend or a child is the bare verb: {1}, come, and {2}, eat. To a person you respect, or to several people, the ending -உங்கள் (-uṅkaḷ) is added: {3}. Verbs that end in -இ (-i) or -ஐ (-ai) add -யுங்கள் (-yuṅkaḷ) instead: {6} gives {7}. {4} takes -ங்கள் (-ṅkaḷ) directly: {5}. {1} is irregular: {8}. Speech shortens the polite ending to -ங்க (-ṅka), and {9} and {10} are the usual polite come and go."
  "ta-rule-imperative-negative":
    name: "Do not: -ஆதே (-ātē), -ஆதீர்கள் (-ātīrkaḷ) after the infinitive"
    explanation: "Do not is the infinitive with {1} to a friend or a child and {2} to a person you respect or to several people: {3} and {4} are do not come, and speech says {5} for the second. {6} and {7} are do not go, to a friend and politely, as said in speech."
  "ta-rule-imperative-lets":
    name: "Let us, and may: -லாம் (-lām) after the infinitive"
    explanation: "Let us do it, and also you may or may I, is the infinitive with {1}: {2} is let us go, or you may go, and {3} is let us come. Who says it, and to whom, tells which meaning is meant."
