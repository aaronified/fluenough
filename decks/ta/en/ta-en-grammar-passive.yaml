pattern:
  name: "Being done: the passive"
  slot_name: "form"
  prompt: "{lemma} ({gloss}), {slot}"
  slots:
    "present": "it is being done"
    "past": "it was done"
    "future": "it will be done"
  entries:
    "cey": "to do; to make"
    "elutu": "to write"
    "tira": "to open"
    "mutu": "to close; to shut"
    "camai": "to cook"
    "kattu": "to tie; to wear"
    "anuppu": "to send"
    "kontatu": "to celebrate"
    "terntetu": "to choose"
    "kel": "to listen; to ask"
    "payanpatuttu": "to use"
  notes: "The passive says what is done to a thing, without saying who did it. It is made by putting the infinitive in front of படு (paṭu), to be affected, joined with -ப் (-p): செய்யப்படுகிறது (ceyyappaṭukiṟatu), it is being done, செய்யப்பட்டது (ceyyappaṭṭatu), it was done, செய்யப்படும் (ceyyappaṭum), it will be done. Tamil keeps this for written Tamil, in news, notices and rules; in speech people use the active verb or another word, such as கிடைக்கிறது (kiṭaikkiṟatu) for it is available. The doer, when named, takes ஆல் (āl): என்னால் செய்யப்பட்டது (eṉṉāl ceyyappaṭṭatu), it was done by me. Source: English Wikipedia, Tamil grammar (the example அடிக்கப்பட்டான் (aṭikkappaṭṭāṉ), he was beaten)."
