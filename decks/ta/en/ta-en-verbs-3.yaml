native: { code: "en", iso639_3: "eng", name: "English" }
name: "More everyday verbs"
description: "Seventy more verbs for daily life: saying and knowing, giving and taking, meeting and waiting, feeling, moving and changing. Not yet checked by a Tamil speaker: please report any mistake."
