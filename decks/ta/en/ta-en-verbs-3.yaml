tags: ["unreviewed"]
cards:
  "ta-2017":
    native: "to say; to tell"
    notes:
      n1: "The written dictionary form. Spoken Tamil says சொல்லு (collu) for the command and சொல்றேன் (colṟēṉ) for I say."
    examples:
      "பெயர் சொல்.":
        native: "Say your name."
        bases:
          "சொல்": "to say; to tell"
      "நான் சொல்கிறேன்.":
        native: "I will tell you."
        bases:
          "சொல்கிறேன்": "will say; from சொல் (col), to say; to tell"
  "ta-2018":
    native: "to be; to stay"
    notes:
      n1: "It says where something is or that it exists: வீட்டில் இருக்கிறேன் (vīṭṭil irukkiṟēṉ), I am at home. It also means to stay: இங்கே இரு (iṅkē iru)."
    examples:
      "இங்கே இரு.":
        native: "Stay here."
        bases:
          "இரு": "to be; to stay"
      "நான் வீட்டில் இருக்கிறேன்.":
        native: "I am at home."
        bases:
          "இருக்கிறேன்": "am; from இரு (iru), to be; to stay"
  "ta-2019":
    native: "to be known; to be seen"
    notes:
      n1: "Tamil says it with the dative: எனக்குத் தெரியும் (eṉakkut teriyum) is to me it is known, I know. The negative is தெரியாது (teriyātu)."
    examples:
      "எனக்குத் தெரியும்.":
        native: "I know."
        bases:
          "எனக்குத்": "to me; from நான் (nāṉ), I; me"
          "தெரியும்": "is known; from தெரி (teri), to be known; to be seen"
      "எனக்குத் தெரியாது.":
        native: "I do not know."
        bases:
          "எனக்குத்": "to me; from நான் (nāṉ), I; me"
          "தெரியாது": "is not known; from தெரி (teri), to be known; to be seen"
  "ta-2020":
    native: "to stay; to lodge"
    notes:
      n1: "To stay somewhere for a while, as in a hotel."
    examples:
      "விடுதியில் தங்கு.":
        native: "Stay at the hostel."
        bases:
          "விடுதியில்": "at the hostel; from விடுதி (viṭuti), hostel; guest house"
          "தங்கு": "to stay; to lodge"
      "நான் இங்கே தங்குகிறேன்.":
        native: "I am staying here."
        bases:
          "தங்குகிறேன்": "am staying; from தங்கு (taṅku), to stay; to lodge"
  "ta-2021":
    native: "to live"
    notes:
      n1: "To live a life, or to live in a place."
    examples:
      "நான் இங்கே வாழ்கிறேன்.":
        native: "I live here."
        bases:
          "வாழ்கிறேன்": "live; from வாழ் (vāḻ), to live"
      "அவர்கள் கிராமத்தில் வாழ்கிறார்கள்.":
        native: "They live in a village."
        bases:
          "கிராமத்தில்": "in a village; from கிராமம் (kirāmam), village"
          "வாழ்கிறார்கள்": "live; from வாழ் (vāḻ), to live"
  "ta-2022":
    native: "to get down; to descend"
    notes:
      n1: "To get off a bus or train, or to go down."
    examples:
      "பேருந்திலிருந்து இறங்கு.":
        native: "Get off the bus."
        bases:
          "பேருந்திலிருந்து": "from the bus; from பேருந்து (pēruntu), bus"
          "இறங்கு": "to get down; to descend"
      "நான் இங்கே இறங்குகிறேன்.":
        native: "I am getting off here."
        bases:
          "இறங்குகிறேன்": "am getting off; from இறங்கு (iṟaṅku), to get down; to descend"
  "ta-2023":
    native: "to give (to me)"
    notes:
      n1: "தா (tā) asks for something to be given to me or us; கொடு (koṭu) (koṭu) gives to someone else. Its present is irregular: தருகிறேன் (tarukiṟēṉ) is I give."
    examples:
      "தண்ணீர் தா.":
        native: "Give me water."
        bases:
          "தா": "to give (to me)"
      "நான் தருகிறேன்.":
        native: "I will give it."
        bases:
          "தருகிறேன்": "give; from தா (tā), to give (to me)"
  "ta-2024":
    native: "to get; to receive"
    notes:
      n1: "The written verb for receiving or getting."
    examples:
      "பரிசு பெறு.":
        native: "Receive the prize."
        bases:
          "பெறு": "to get; to receive"
      "நான் பரிசு பெறுகிறேன்.":
        native: "I am receiving a prize."
        bases:
          "பெறுகிறேன்": "am receiving; from பெறு (peṟu), to get; to receive"
  "ta-2025":
    native: "to be available; to be obtained"
    notes:
      n1: "Something is got without the speaker acting: தண்ணீர் கிடைக்கும் (taṇṇīr kiṭaikkum) is water will be available."
    examples:
      "பேருந்து கிடைக்கும்.":
        native: "A bus will be available."
        bases:
          "கிடைக்கும்": "will be available; from கிடை (kiṭai), to be available; to be obtained"
      "இங்கே தண்ணீர் கிடைக்கும்.":
        native: "Water is available here."
        bases:
          "கிடைக்கும்": "will be available; from கிடை (kiṭai), to be available; to be obtained"
  "ta-2026":
    native: "to lift; to carry"
    notes:
      n1: "To lift something up."
    examples:
      "பெட்டி தூக்கு.":
        native: "Lift the box."
        bases:
          "தூக்கு": "to lift; to carry"
      "நான் பையைத் தூக்குகிறேன்.":
        native: "I am lifting the bag."
        bases:
          "பையைத்": "the bag (as object); from பை (pai), bag"
          "தூக்குகிறேன்": "am lifting; from தூக்கு (tūkku), to lift; to carry"
  "ta-2027":
    native: "to let go; to leave; to let"
    notes:
      n1: "To let someone go or to leave a thing. It is also a helper that shows an action is done."
    examples:
      "என்னை விடு.":
        native: "Let me go."
        bases:
          "என்னை": "me; from நான் (nāṉ), I; me"
          "விடு": "to let go; to leave; to let"
      "விடுங்கள்.":
        native: "Please let go."
        bases:
          "விடுங்கள்": "please let go; from விடு (viṭu), to let go; to leave; to let"
  "ta-2028":
    native: "to hold; to catch"
    notes:
      n1: "To hold or catch. It is a different word from பிடிக்கும் (piṭikkum) (piṭikkum), like."
    examples:
      "பந்து பிடி.":
        native: "Catch the ball."
        bases:
          "பிடி": "to hold; to catch"
      "நான் பந்து பிடிக்கிறேன்.":
        native: "I am catching the ball."
        bases:
          "பிடிக்கிறேன்": "am catching; from பிடி (piṭi), to hold; to catch"
  "ta-2029":
    native: "to send"
    notes:
      n1: "To send a letter, message or person."
    examples:
      "செய்தி அனுப்பு.":
        native: "Send a message."
        bases:
          "அனுப்பு": "to send"
      "நான் புத்தகம் அனுப்புகிறேன்.":
        native: "I am sending a book."
        bases:
          "அனுப்புகிறேன்": "am sending; from அனுப்பு (aṉuppu), to send"
  "ta-2030":
    native: "to call"
    notes:
      n1: "The spoken word for calling someone."
    examples:
      "அம்மாவைக் கூப்பிடு.":
        native: "Call mother."
        bases:
          "அம்மாவைக்": "mother (as object); from அம்மா (ammā), mother"
          "கூப்பிடு": "to call"
      "நான் கூப்பிடுகிறேன்.":
        native: "I am calling."
        bases:
          "கூப்பிடுகிறேன்": "am calling; from கூப்பிடு (kūppiṭu), to call"
  "ta-2031":
    native: "to call; to invite"
    notes:
      n1: "The written word for calling or inviting."
    examples:
      "நண்பனை அழை.":
        native: "Invite the friend."
        bases:
          "நண்பனை": "friend (as object); from நண்பன் (naṇpaṉ), male friend"
          "அழை": "to call; to invite"
      "நான் அழைக்கிறேன்.":
        native: "I am inviting."
        bases:
          "அழைக்கிறேன்": "am inviting; from அழை (aḻai), to call; to invite"
  "ta-2032":
    native: "to wait"
    notes:
      n1: "Made of காத்து (kāttu) (waiting) and இரு (iru) (to be): one word."
    examples:
      "இங்கே காத்திரு.":
        native: "Wait here."
        bases:
          "காத்திரு": "to wait"
      "நான் காத்திருக்கிறேன்.":
        native: "I am waiting."
        bases:
          "காத்திருக்கிறேன்": "am waiting; from காத்திரு (kāttiru), to wait"
  "ta-2033":
    native: "to meet"
    notes:
      n1: "To meet someone, often by plan."
    examples:
      "நாளை சந்திக்கலாம்.":
        native: "Let's meet tomorrow."
        bases:
          "சந்திக்கலாம்": "let's meet; from சந்தி (canti), to meet"
      "நான் நண்பனைச் சந்திக்கிறேன்.":
        native: "I am meeting a friend."
        bases:
          "நண்பனைச்": "friend (as object); from நண்பன் (naṇpaṉ), male friend"
          "சந்திக்கிறேன்": "am meeting; from சந்தி (canti), to meet"
  "ta-2034":
    native: "to join; to add"
    notes:
      n1: "To join a school or group, or to add something to a mix."
    examples:
      "சர்க்கரை சேர்.":
        native: "Add sugar."
        bases:
          "சேர்": "to join; to add"
      "நான் பள்ளியில் சேர்கிறேன்.":
        native: "I am joining school."
        bases:
          "பள்ளியில்": "at school; from பள்ளி (paḷḷi), school"
          "சேர்கிறேன்": "am joining; from சேர் (cēr), to join; to add"
  "ta-2035":
    native: "to part; to divide"
    notes:
      n1: "To part from someone, or to divide a thing."
    examples:
      "பாதியாகப் பிரி.":
        native: "Divide it in half."
        bases:
          "பாதியாகப்": "in half; from பாதி (pāti), half"
          "பிரி": "to part; to divide"
      "நாம் பிரிகிறோம்.":
        native: "We are parting."
        bases:
          "பிரிகிறோம்": "we part; from பிரி (piri), to part; to divide"
  "ta-2036":
    native: "to believe; to trust"
    notes:
      n1: "To trust a person or believe a statement."
    examples:
      "என்னை நம்பு.":
        native: "Trust me."
        bases:
          "என்னை": "me; from நான் (nāṉ), I; me"
          "நம்பு": "to believe; to trust"
      "நான் நம்புகிறேன்.":
        native: "I believe it."
        bases:
          "நம்புகிறேன்": "believe; from நம்பு (nampu), to believe; to trust"
  "ta-2037":
    native: "to agree; to admit"
    notes:
      n1: "To agree or to admit a fault."
    examples:
      "நான் ஒப்புக்கொள்கிறேன்.":
        native: "I agree."
        bases:
          "ஒப்புக்கொள்கிறேன்": "agree; from ஒப்புக்கொள் (oppukkoḷ), to agree; to admit"
      "அவன் ஒப்புக்கொள்கிறான்.":
        native: "He agrees."
        bases:
          "ஒப்புக்கொள்கிறான்": "agrees; from ஒப்புக்கொள் (oppukkoḷ), to agree; to admit"
  "ta-2038":
    native: "to share"
    notes:
      n1: "To share food or things."
    examples:
      "சாப்பாடு பகிர்.":
        native: "Share the food."
        bases:
          "பகிர்": "to share"
      "நாம் பகிர்கிறோம்.":
        native: "We are sharing."
        bases:
          "பகிர்கிறோம்": "we share; from பகிர் (pakir), to share"
  "ta-2039":
    native: "to stick; to paste"
    notes:
      n1: "To stick paper or paste a picture."
    examples:
      "காகிதம் ஒட்டு.":
        native: "Stick the paper."
        bases:
          "ஒட்டு": "to stick; to paste"
      "நான் படம் ஒட்டுகிறேன்.":
        native: "I am sticking a picture."
        bases:
          "ஒட்டுகிறேன்": "am sticking; from ஒட்டு (oṭṭu), to stick; to paste"
  "ta-2040":
    native: "to spill; to pour out"
    notes:
      n1: "To spill a liquid, or to pour out a heap."
    examples:
      "பால் கொட்டாதே.":
        native: "Do not spill the milk."
        bases:
          "கொட்டாதே": "do not spill; from கொட்டு (koṭṭu), to spill; to pour out"
      "தண்ணீர் கொட்டுகிறது.":
        native: "The water is spilling."
        bases:
          "கொட்டுகிறது": "is spilling; from கொட்டு (koṭṭu), to spill; to pour out"
  "ta-2041":
    native: "to burn"
    notes:
      n1: "To burn, as a flame or lamp does."
    examples:
      "விளக்கு எரிகிறது.":
        native: "The lamp is burning."
        bases:
          "எரிகிறது": "is burning; from எரி (eri), to burn"
      "அடுப்பு எரிகிறது.":
        native: "The stove is burning."
        bases:
          "எரிகிறது": "is burning; from எரி (eri), to burn"
  "ta-2042":
    native: "to create; to make"
    notes:
      n1: "To create or form something new."
    examples:
      "படம் உருவாக்கு.":
        native: "Create a picture."
        bases:
          "உருவாக்கு": "to create; to make"
      "நான் புதிய குழு உருவாக்குகிறேன்.":
        native: "I am forming a new team."
        bases:
          "உருவாக்குகிறேன்": "am forming; from உருவாக்கு (uruvākku), to create; to make"
  "ta-2043":
    native: "to steal"
    notes:
      n1: "To steal. The command not to is திருடாதே (tiruṭātē)."
    examples:
      "திருடாதே.":
        native: "Do not steal."
        bases:
          "திருடாதே": "do not steal; from திருடு (tiruṭu), to steal"
      "அவன் திருடுகிறான்.":
        native: "He steals."
        bases:
          "திருடுகிறான்": "steals; from திருடு (tiruṭu), to steal"
  "ta-2044":
    native: "to think; to consider"
    notes:
      n1: "The everyday spoken word for thinking something over."
    examples:
      "கொஞ்சம் யோசி.":
        native: "Think a little."
        bases:
          "யோசி": "to think; to consider"
      "நான் யோசிக்கிறேன்.":
        native: "I am thinking."
        bases:
          "யோசிக்கிறேன்": "am thinking; from யோசி (yōci), to think; to consider"
  "ta-2045":
    native: "to like; to want"
    notes:
      n1: "The written verb for liking or wanting; spoken Tamil prefers பிடிக்கும் (piṭikkum) (piṭikkum)."
    examples:
      "நான் தேநீர் விரும்புகிறேன்.":
        native: "I like tea."
        bases:
          "விரும்புகிறேன்": "like; from விரும்பு (virumpu), to like; to want"
      "அவள் இசை விரும்புகிறாள்.":
        native: "She likes music."
        bases:
          "விரும்புகிறாள்": "likes; from விரும்பு (virumpu), to like; to want"
  "ta-2046":
    native: "to be afraid"
    notes:
      n1: "Made of பயம் (payam) (fear) and படு (paṭu) (to suffer). The command not to is பயப்படாதே (payappaṭātē)."
    examples:
      "பயப்படாதே.":
        native: "Do not be afraid."
        bases:
          "பயப்படாதே": "do not be afraid; from பயப்படு (payappaṭu), to be afraid"
      "நான் பயப்படுகிறேன்.":
        native: "I am afraid."
        bases:
          "பயப்படுகிறேன்": "am afraid; from பயப்படு (payappaṭu), to be afraid"
  "ta-2047":
    native: "to worry"
    notes:
      n1: "Made of கவலை (kavalai) (worry) and படு (paṭu). The command not to is கவலைப்படாதே (kavalaippaṭātē)."
    examples:
      "கவலைப்படாதே.":
        native: "Do not worry."
        bases:
          "கவலைப்படாதே": "do not worry; from கவலைப்படு (kavalaippaṭu), to worry"
      "நான் கவலைப்படுகிறேன்.":
        native: "I am worried."
        bases:
          "கவலைப்படுகிறேன்": "am worried; from கவலைப்படு (kavalaippaṭu), to worry"
  "ta-2048":
    native: "to get angry"
    notes:
      n1: "Made of கோபம் (kōpam) (anger) and படு (paṭu)."
    examples:
      "கோபப்படாதே.":
        native: "Do not get angry."
        bases:
          "கோபப்படாதே": "do not get angry; from கோபப்படு (kōpappaṭu), to get angry"
      "அவன் கோபப்படுகிறான்.":
        native: "He is angry."
