native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs before: I did, you did, he did"
description: "Every verb the course teaches, in the past, for each person, with the common spoken form before the written one. Not yet checked by a Tamil speaker: please report any mistake."
