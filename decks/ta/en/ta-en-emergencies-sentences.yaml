schema: 1
id: "ta-en-emergencies-sentences"
kind: "layer"
core: "ta-emergencies-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Emergencies: accidents, fire, help and safety in sentences"
description: "Sentences for an emergency: calling for help, a fire, an accident and an injury. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-9570":
    native: "Call an ambulance at once."
    bases:
      "உடனே": "at once; immediately"
      "ஆம்புலன்ஸை": "the ambulance (object); from ஆம்புலன்ஸ் (āmpulaṉs), ambulance"
    confusables:
      w1: { why: "மீட்புக்குழு (mīṭpukkuḻu), rescue team, is a different word." }
      w2: { why: "தீயணைப்பு (tīyaṇaippu), fire-fighting; fire service, is a different word." }
      w3: { why: "காவல் (kāval), guard; custody; watch, is a different word." }
  "ta-9571":
    native: "Two vehicles are crashing on the road."
    bases:
      "சாலையில்": "on the road; from சாலை (cālai), road"
      "வண்டிகள்": "vehicles; from வண்டி (vaṇṭi), vehicle"
      "மோதுகின்றன": "crash; from மோது (mōtu), to crash"
    notes:
      n1: "A plural thing (not a person) takes the verb ending -ன (-ṉa): மோதுகின்றன (mōtukiṉṟaṉa), they crash."
    confusables:
      w1: { why: "விபத்து (vipattu), accident, is a different word." }
      w2: { why: "சேதம் (cētam), damage; loss, is a different word." }
      w3: { why: "இழப்பு (iḻappu), loss, is a different word." }
  "ta-9572":
    native: "The house is on fire; everyone run out."
    bases:
      "பிடிக்கிறது": "catches; from பிடி (piṭi), to hold; to catch"
      "ஓடுங்கள்": "please run; from ஓடு (ōṭu), to run"
    notes:
      n1: "A polite or plural command adds -உங்கள் (-uṅkaḷ): ஓடுங்கள் (ōṭuṅkaḷ), please run."
    confusables:
      w1: { why: "புகை (pukai), smoke, is a different word." }
      w2: { why: "நெருப்பு (neruppu), fire, is a different word." }
      w3: { why: "தீயணைப்பான் (tīyaṇaippāṉ), fire extinguisher, is a different word." }
  "ta-9573":
    native: "The thief gets caught by the police."
    bases:
      "போலீஸிடம்": "by the police; from போலீஸ் (pōlīs), police"
      "சிக்குகிறான்": "he gets caught; from சிக்கு (cikku), to get caught"
    notes:
      n1: "The one who catches is marked with -இடம் (-iṭam): போலீஸிடம் (pōlīsiṭam), by the police."
    confusables:
      w1: { why: "கொள்ளை (koḷḷai), robbery; looting, is a different word." }
      w2: { why: "புகார் (pukār), complaint, is a different word." }
      w3: { why: "காவலர் (kāvalar), guard; constable, is a different word." }
  "ta-9574":
    native: "He has a fracture in his leg."
    bases:
      "அவனுக்குக்": "to him; for him; from அவன் (avaṉ), he"
      "காலில்": "in the leg; from கால் (kāl), leg; foot"
    notes:
      n1: "Pain and injury are said with -க்கு (-kku): அவனுக்கு (avaṉukku), to him for he has."
    confusables:
      w1: { why: "தீக்காயம் (tīkkāyam), burn injury, is a different word." }
      w2: { why: "மூச்சுத்திணறல் (mūccuttiṇaṟal), breathlessness; difficulty in breathing, is a different word." }
      w3: { why: "மயக்கம் (mayakkam), dizziness; fainting, is a different word." }
  "ta-9575":
    native: "A storm is coming with thunder; be careful."
    bases:
      "இடியுடன்": "with thunder; from இடி (iṭi), thunder"
      "வருகிறது": "is coming; from வா (vā), to come"
      "கவனமாக": "carefully; from கவனம் (kavaṉam), attention; care"
    notes:
      n1: "கவனமாக இரு (kavaṉamāka iru), be careful puts the adverb கவனமாக (kavaṉamāka), carefully before the verb இரு (iru), be."
    confusables:
      w1: { why: "வெள்ளம் (veḷḷam), flood, is a different word." }
      w2: { why: "பேரிடர் (pēriṭar), disaster; calamity, is a different word." }
      w3: { why: "எச்சரிக்கை (eccarikkai), warning, is a different word." }
  "ta-9576":
    native: "Do not be afraid; I will save you."
    bases:
      "பயப்படாதே": "do not be afraid; from பயப்படு (payappaṭu), to be afraid"
      "உன்னைக்": "you (object); from நீ (nī), you (to a friend or child)"
      "காப்பாற்றுகிறேன்": "I save; from காப்பாற்று (kāppāṟṟu), to save"
    notes:
      n1: "The present form காப்பாற்றுகிறேன் (kāppāṟṟukiṟēṉ), I save is used for a promise made right now."
    confusables:
      w1: { why: "பதற்றம் (pataṟṟam), nervousness; panic, is a different word." }
      w2: { why: "அமைதி (amaiti), calm; quiet; peace, is a different word." }
      w3: { why: "மீட்பு (mīṭpu), rescue; recovery, is a different word." }
  "ta-9577":
    native: "Let us go to a safe place."
    bases:
      "இடத்துக்குப்": "to the place; from இடம் (iṭam), place"
      "போவோம்": "let us go; from போ (pō), to go"
    notes:
      n1: "The ending -ஓம் (-ōm) means let us: போவோம் (pōvōm), let us go."
    confusables:
      w1: { why: "முன்னெச்சரிக்கை (muṉṉeccarikkai), precaution; advance warning, is a different word." }
      w2: { why: "பாதுகாப்பு (pātukāppu), safety; security; protection, is a different word." }
      w3: { why: "தடுப்பு (taṭuppu), prevention; barrier, is a different word." }
