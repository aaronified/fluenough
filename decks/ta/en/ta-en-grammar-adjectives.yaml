pattern:
  name: "Adjective forms"
  slot_name: "form"
  entries:
    "nalla": "good"
    "periya": "big"
    "cinna": "small"
    "ketta": "bad"
    "putiya": "new"
    "palaiya": "old"
    "alakana": "beautiful"
    "cutana": "hot"
    "kulirana": "cold"
  notes: "A Tamil adjective comes before the noun and never changes for gender or number: பெரிய வீடு (periya vīṭu), a big house, and பெரிய வீடுகள் (periya vīṭukaḷ), big houses. To say a thing is that way, add -து (-tu): பெரியது (periyatu), the big one; for several things, -வை (-vai): பெரியவை (periyavai). For a person the endings are the person's own: நல்லவன் (nallavaṉ), a good man, நல்லவள் (nallavaḷ), a good woman, and நல்லவர் (nallavar), a good, respected person. Source: English Wikipedia, Tamil grammar (adjectives come before the noun); the forms ending in -து (-tu) and -வை (-vai) follow the verb endings of things."
