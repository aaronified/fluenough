schema: 1
id: "ta-en-appearance"
kind: "layer"
core: "ta-appearance"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Appearance"
description: "Face and body, height and age, colours, jewellery and clothing extras, and words to describe how someone looks. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-1962":
    native: "eye"
    notes:
      n1: "The plural is கண்கள் (kaṇkaḷ). The ending -ஐ (-ai) doubles the last sound: கண்ணை (kaṇṇai)."
    examples:
      "அவள் கண் அழகு.":
        native: "Her eyes are beautiful."
        bases:
          "கண்": "eye"
      "கண் மூடு.":
        native: "Close your eyes."
        bases:
          "கண்": "eye"
  "ta-1963":
    native: "mouth"
    notes:
      n1: "The mouth."
    examples:
      "வாய் திற.":
        native: "Open your mouth."
        bases:
          "வாய்": "mouth"
      "வாய் மூடு.":
        native: "Close your mouth."
        bases:
          "வாய்": "mouth"
  "ta-1964":
    native: "cheek"
    notes:
      n1: "The cheek of the face."
    examples:
      "கன்னம் சிவப்பு.":
        native: "The cheek is red."
        bases:
          "கன்னம்": "cheek"
      "இது என் கன்னம்.":
        native: "This is my cheek."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "கன்னம்": "cheek"
  "ta-1965":
    native: "forehead"
    notes:
      n1: "The forehead, where a பொட்டு (poṭṭu) (bindi) is worn. The ending -இல் (-il) gives நெற்றியில் (neṟṟiyil)."
    examples:
      "நெற்றியில் பொட்டு.":
        native: "A bindi on the forehead."
        bases:
          "நெற்றியில்": "on the forehead; from நெற்றி (neṟṟi), forehead"
      "இது என் நெற்றி.":
        native: "This is my forehead."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "நெற்றி": "forehead"
  "ta-1966":
    native: "eyebrow"
    notes:
      n1: "The eyebrow."
    examples:
      "இது என் புருவம்.":
        native: "This is my eyebrow."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "புருவம்": "eyebrow"
      "புருவம் கருப்பு.":
        native: "The eyebrow is black."
        bases:
          "புருவம்": "eyebrow"
  "ta-1967":
    native: "beard"
    notes:
      n1: "A beard."
    examples:
      "அவன் தாடி கருப்பு.":
        native: "His beard is black."
        bases:
          "தாடி": "beard"
      "தாடி வெட்டு.":
        native: "Trim the beard."
        bases:
          "தாடி": "beard"
  "ta-1968":
    native: "moustache"
    notes:
      n1: "A moustache."
    examples:
      "அவர் மீசை கருப்பு.":
        native: "His moustache is black."
        bases:
          "மீசை": "moustache"
      "இது அவன் மீசை.":
        native: "This is his moustache."
        bases:
          "மீசை": "moustache"
  "ta-1969":
    native: "lip"
    notes:
      n1: "The lip."
    examples:
      "உதடு சிவப்பு.":
        native: "The lip is red."
        bases:
          "உதடு": "lip"
      "இது என் உதடு.":
        native: "This is my lip."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "உதடு": "lip"
  "ta-1970":
    native: "tongue"
    notes:
      n1: "The tongue. In some uses it also means language or speech."
    examples:
      "நாக்கு சிவப்பு.":
        native: "The tongue is red."
        bases:
          "நாக்கு": "tongue"
      "இது என் நாக்கு.":
        native: "This is my tongue."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "நாக்கு": "tongue"
  "ta-1971":
    native: "shoulder"
    notes:
      n1: "The shoulder. The ending -இல் (-il) gives தோளில் (tōḷil)."
    examples:
      "தோளில் பை.":
        native: "A bag on the shoulder."
        bases:
          "தோளில்": "on the shoulder; from தோள் (tōḷ), shoulder"
      "இது என் தோள்.":
        native: "This is my shoulder."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "தோள்": "shoulder"
  "ta-1972":
    native: "back (of the body)"
    notes:
      n1: "The back. The ending -இல் (-il) gives முதுகில் (mutukil)."
    examples:
      "முதுகில் பை.":
        native: "A bag on the back."
        bases:
          "முதுகில்": "on the back; from முதுகு (mutuku), back (of the body)"
      "முதுகு எங்கே?":
        native: "Where is the back?"
        bases:
          "முதுகு": "back (of the body)"
  "ta-1973":
    native: "chest"
    notes:
      n1: "The chest."
    examples:
      "இது என் மார்பு.":
        native: "This is my chest."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "மார்பு": "chest"
      "மார்பு எங்கே?":
        native: "Where is the chest?"
        bases:
          "மார்பு": "chest"
  "ta-1974":
    native: "knee"
    notes:
      n1: "The knee; கால் (kāl) (leg) with the joint."
    examples:
      "முழங்கால் எங்கே?":
        native: "Where is the knee?"
        bases:
          "முழங்கால்": "knee"
      "இது என் முழங்கால்.":
        native: "This is my knee."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "முழங்கால்": "knee"
  "ta-1975":
    native: "nail"
    notes:
      n1: "A fingernail or toenail. The last sound changes before an ending: நகத்தை (nakattai) is the nail, as object."
    examples:
      "நகம் வெட்டு.":
        native: "Cut the nails."
        bases:
          "நகம்": "nail"
      "இது என் நகம்.":
        native: "This is my nail."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "நகம்": "nail"
  "ta-1976":
    native: "skin; leather"
    notes:
      n1: "Skin, and also leather."
    examples:
      "இது தோல் பை.":
        native: "This is a leather bag."
        bases:
          "தோல்": "skin; leather"
      "என் தோல் நல்லது.":
        native: "My skin is fine."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "தோல்": "skin; leather"
  "ta-1977":
    native: "mole (on the skin)"
    notes:
      n1: "A mole on the skin."
    examples:
      "முகத்தில் மச்சம்.":
        native: "A mole on the face."
        bases:
          "முகத்தில்": "on the face; from முகம் (mukam), face"
          "மச்சம்": "mole (on the skin)"
      "இது என் மச்சம்.":
        native: "This is my mole."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "மச்சம்": "mole (on the skin)"
  "ta-1978":
    native: "height"
    notes:
      n1: "How tall a person or thing is."
    examples:
      "உன் உயரம் என்ன?":
        native: "What is your height?"
        bases:
          "உன்": "your; from நீ (nī), you (to a friend or child)"
          "உயரம்": "height"
      "உயரம் எவ்வளவு?":
        native: "How tall is it?"
        bases:
          "உயரம்": "height"
  "ta-1979":
    native: "age"
    notes:
      n1: "A person's age: உன் வயது என்ன (uṉ vayatu eṉṉa) is how old are you."
    examples:
      "உன் வயது என்ன?":
        native: "How old are you?"
        bases:
          "உன்": "your; from நீ (nī), you (to a friend or child)"
          "வயது": "age"
      "என் வயது இருபது.":
        native: "I am twenty."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "வயது": "age"
  "ta-1980":
    native: "beauty; pretty"
    notes:
      n1: "Beauty; used alone it says something is pretty: இது அழகு (itu aḻaku)."
    examples:
      "இது அழகு.":
        native: "This is pretty."
        bases:
          "அழகு": "beauty; pretty"
      "அவள் கண் அழகு.":
        native: "Her eyes are beautiful."
        bases:
          "அழகு": "beauty; pretty"
  "ta-1981":
    native: "appearance; look"
    notes:
      n1: "How someone or something looks."
    examples:
      "நல்ல தோற்றம்.":
        native: "A good look."
        bases:
          "தோற்றம்": "appearance; look"
      "புதிய தோற்றம்.":
        native: "A new look."
        bases:
          "தோற்றம்": "appearance; look"
  "ta-1982":
    native: "black"
    notes:
      n1: "The colour black."
    examples:
      "இது கருப்பு.":
        native: "This is black."
        bases:
          "கருப்பு": "black"
      "கருப்பு சட்டை.":
        native: "A black shirt."
        bases:
          "கருப்பு": "black"
  "ta-1983":
    native: "brown"
    notes:
      n1: "The colour brown."
    examples:
      "இது பழுப்பு.":
        native: "This is brown."
        bases:
          "பழுப்பு": "brown"
      "பழுப்பு பை.":
        native: "A brown bag."
        bases:
          "பழுப்பு": "brown"
  "ta-1984":
    native: "orange (colour)"
    notes:
      n1: "The colour orange; it is also the fruit."
    examples:
      "இது ஆரஞ்சு.":
        native: "This is orange."
        bases:
          "ஆரஞ்சு": "orange (colour)"
      "ஆரஞ்சு சட்டை.":
        native: "An orange shirt."
        bases:
          "ஆரஞ்சு": "orange (colour)"
  "ta-1985":
    native: "purple"
    notes:
      n1: "The colour purple."
    examples:
      "இது ஊதா.":
        native: "This is purple."
        bases:
          "ஊதா": "purple"
      "ஊதா சட்டை.":
        native: "A purple shirt."
        bases:
          "ஊதா": "purple"
  "ta-1986":
    native: "pink"
    notes:
      n1: "Made of இள (iḷa) (light) and சிவப்பு (civappu) (red)."
    examples:
      "இது இளஞ்சிவப்பு.":
        native: "This is pink."
        bases:
          "இளஞ்சிவப்பு": "pink"
      "இளஞ்சிவப்பு புடவை.":
        native: "A pink sari."
        bases:
          "இளஞ்சிவப்பு": "pink"
  "ta-1987":
    native: "grey; ash"
    notes:
      n1: "The colour grey, and also ash."
    examples:
      "சாம்பல் நிறம்.":
        native: "Grey colour."
        bases:
          "சாம்பல்": "grey; ash"
      "சாம்பல் தொப்பி.":
        native: "A grey cap."
        bases:
          "சாம்பல்": "grey; ash"
  "ta-1988":
    native: "gold"
    notes:
      n1: "Gold, the metal. Used before a noun it becomes தங்க (taṅka), as in தங்கச் சங்கிலி (taṅkac caṅkili), a gold chain."
    examples:
      "இது தங்கம்.":
        native: "This is gold."
        bases:
          "தங்கம்": "gold"
      "தங்கம் விலை என்ன?":
        native: "What is the price of gold?"
        bases:
          "தங்கம்": "gold"
  "ta-1989":
    native: "ring"
    notes:
      n1: "A finger ring."
    examples:
      "மோதிரம் எங்கே?":
        native: "Where is the ring?"
        bases:
          "மோதிரம்": "ring"
      "இது தங்க மோதிரம்.":
        native: "This is a gold ring."
        bases:
          "தங்க": "gold (before a noun); from தங்கம் (taṅkam), gold"
          "மோதிரம்": "ring"
  "ta-1990":
    native: "bangle"
    notes:
      n1: "A bangle, worn on the wrist."
    examples:
      "வளையல் எங்கே?":
        native: "Where is the bangle?"
        bases:
          "வளையல்": "bangle"
      "இது புதிய வளையல்.":
        native: "This is a new bangle."
        bases:
          "வளையல்": "bangle"
  "ta-1991":
    native: "earring"
    notes:
      n1: "An earring."
    examples:
      "கம்மல் எங்கே?":
        native: "Where is the earring?"
        bases:
          "கம்மல்": "earring"
      "இது அவள் கம்மல்.":
        native: "This is her earring."
        bases:
          "கம்மல்": "earring"
  "ta-1992":
    native: "nose stud"
    notes:
      n1: "A stud worn on the nose."
    examples:
      "இது மூக்குத்தி.":
        native: "This is a nose stud."
        bases:
          "மூக்குத்தி": "nose stud"
      "மூக்குத்தி எங்கே?":
        native: "Where is the nose stud?"
        bases:
          "மூக்குத்தி": "nose stud"
  "ta-1993":
    native: "jewellery"
    notes:
      n1: "Jewellery in general."
    examples:
      "நகை வாங்கு.":
        native: "Buy jewellery."
        bases:
          "நகை": "jewellery"
      "நகை எங்கே?":
        native: "Where is the jewellery?"
        bases:
          "நகை": "jewellery"
  "ta-1994":
    native: "chain"
    notes:
      n1: "A chain, such as a necklace chain."
    examples:
      "இது தங்கச் சங்கிலி.":
        native: "This is a gold chain."
        bases:
          "தங்கச்": "gold (before a noun); from தங்கம் (taṅkam), gold"
          "சங்கிலி": "chain"
      "சங்கிலி எங்கே?":
        native: "Where is the chain?"
        bases:
          "சங்கிலி": "chain"
  "ta-1995":
    native: "bindi"
    notes:
      n1: "A dot worn on the forehead as decoration, by many Tamil women."
    examples:
      "பொட்டு வை.":
        native: "Put on a bindi."
        bases:
          "பொட்டு": "bindi"
      "இது சிவப்பு பொட்டு.":
        native: "This is a red bindi."
        bases:
          "பொட்டு": "bindi"
  "ta-1996":
    native: "comb"
    notes:
      n1: "A comb."
    examples:
      "சீப்பு கொடு.":
        native: "Give me the comb."
        bases:
          "சீப்பு": "comb"
      "சீப்பு எங்கே?":
        native: "Where is the comb?"
        bases:
          "சீப்பு": "comb"
  "ta-1997":
    native: "belt"
    notes:
      n1: "The English loan."
    examples:
      "பெல்ட் கொடு.":
        native: "Give me the belt."
        bases:
          "பெல்ட்": "belt"
      "இது கருப்பு பெல்ட்.":
        native: "This is a black belt."
        bases:
          "பெல்ட்": "belt"
  "ta-1998":
    native: "shoe"
    notes:
      n1: "The English loan; the plural is ஷூக்கள் (ṣūkkaḷ)."
    examples:
      "ஷூ எங்கே?":
        native: "Where is the shoe?"
        bases:
          "ஷூ": "shoe"
      "புதிய ஷூ.":
        native: "A new shoe."
        bases:
          "ஷூ": "shoe"
  "ta-1999":
    native: "socks"
    notes:
      n1: "The English loan."
    examples:
      "சாக்ஸ் போடு.":
        native: "Put on socks."
        bases:
          "சாக்ஸ்": "socks"
      "சாக்ஸ் எங்கே?":
        native: "Where are the socks?"
        bases:
          "சாக்ஸ்": "socks"
  "ta-2000":
    native: "skirt"
    notes:
      n1: "A skirt, worn by girls and women."
    examples:
      "இது நீல பாவாடை.":
        native: "This is a blue skirt."
        bases:
          "நீல": "blue; from நீலம் (nīlam), blue"
          "பாவாடை": "skirt"
      "பாவாடை எங்கே?":
        native: "Where is the skirt?"
        bases:
          "பாவாடை": "skirt"
  "ta-2001":
    native: "churidar"
    notes:
      n1: "A women's outfit of a tunic and trousers."
    examples:
      "இது புதிய சுடிதார்.":
        native: "This is a new churidar."
        bases:
          "சுடிதார்": "churidar"
      "சுடிதார் எங்கே?":
        native: "Where is the churidar?"
        bases:
          "சுடிதார்": "churidar"
  "ta-2002":
    native: "handkerchief"
    notes:
      n1: "Made of கை (kai) (hand) and குட்டை (kuṭṭai) (a short piece of cloth)."
    examples:
      "கைக்குட்டை கொடு.":
        native: "Give me the handkerchief."
        bases:
          "கைக்குட்டை": "handkerchief"
      "கைக்குட்டை எங்கே?":
        native: "Where is the handkerchief?"
        bases:
          "கைக்குட்டை": "handkerchief"
  "ta-2003":
    native: "to dress; to wear"
    notes:
      n1: "The formal verb for putting on clothes; spoken Tamil often uses போடு (pōṭu) (pōṭu) for put on."
    examples:
      "நான் புடவை உடுத்துகிறேன்.":
        native: "I am wearing a sari."
        bases:
          "உடுத்துகிறேன்": "am wearing; from உடுத்து (uṭuttu), to dress; to wear"
      "நீ வேட்டி உடுத்து.":
        native: "Wear a veshti."
        bases:
          "உடுத்து": "to dress; to wear"
