    native: "to take off"
    notes:
      n1: "To take off clothes, shoes or a ring."
    examples:
      "செருப்பு கழற்று.":
        native: "Take off the sandals."
        bases:
          "கழற்று": "to take off"
      "நான் தொப்பி கழற்றுகிறேன்.":
