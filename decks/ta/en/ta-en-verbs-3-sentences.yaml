cards:
  "ta-4548":
    native: "I know."
    bases:
      "எனக்குத்": "to me; from நான் (nāṉ), I; me"
      "தெரியும்": "is known; from தெரி (teri), to be known; to be seen"
    confusables:
      w1: { why: "புரி (puri), to understand, is a different word." }
      w2: { why: "நினை (niṉai), to think; to remember, is a different word." }
  "ta-4549":
    native: "I do not know."
    bases:
      "எனக்குத்": "to me; from நான் (nāṉ), I; me"
      "தெரியாது": "is not known; from தெரி (teri), to be known; to be seen"
    confusables:
      w1: { why: "புரி (puri), to understand, is a different word." }
      w2: { why: "மற (maṟa), to forget, is a different word." }
  "ta-4550":
    native: "Call mother."
    bases:
      "அம்மாவைக்": "mother (as object); from அம்மா (ammā), mother"
    confusables:
      w1: { why: "அழை (aḻai), to call; to invite, is a different word." }
      w2: { why: "அனுப்பு (aṉuppu), to send, is a different word." }
  "ta-4551":
    native: "Wait here."
    confusables:
      w1: { why: "தங்கு (taṅku), to stay; to lodge, is a different word." }
      w2: { why: "இரு (iru), to be; to stay, is a different word." }
  "ta-4552":
    native: "I am at home."
    bases:
      "இருக்கிறேன்": "am; from இரு (iru), to be; to stay"
    confusables:
      w1: { why: "தங்கு (taṅku), to stay; to lodge, is a different word." }
      w2: { why: "வாழ் (vāḻ), to live, is a different word." }
  "ta-4553":
    native: "Let's meet tomorrow."
    bases:
      "சந்திக்கலாம்": "let's meet; from சந்தி (canti), to meet"
    confusables:
      w1: { why: "சேர் (cēr), to join; to add, is a different word." }
      w2: { why: "பிரி (piri), to part; to divide, is a different word." }
  "ta-4554":
    native: "Trust me."
    bases:
      "என்னை": "me; from நான் (nāṉ), I; me"
    confusables:
      w1: { why: "மன்னி (maṉṉi), to forgive, is a different word." }
      w2: { why: "விரும்பு (virumpu), to like; to want, is a different word." }
  "ta-4555":
    native: "Do not be afraid."
    bases:
      "பயப்படாதே": "do not be afraid; from பயப்படு (payappaṭu), to be afraid"
    confusables:
      w1: { why: "கவலைப்படு (kavalaippaṭu), to worry, is a different word." }
      w2: { why: "கோபப்படு (kōpappaṭu), to get angry, is a different word." }
  "ta-4556":
    native: "Give me water."
    confusables:
      w1: { why: "பெறு (peṟu), to get; to receive, is a different word." }
      w2: { why: "கிடை (kiṭai), to be available; to be obtained, is a different word." }
  "ta-4557":
    native: "I am saving money."
    bases:
      "சேமிக்கிறேன்": "am saving; from சேமி (cēmi), to save"
    confusables:
      w1: { why: "செலவழி (celavaḻi), to spend, is a different word." }
      w2: { why: "சம்பாதி (campāti), to earn, is a different word." }
