id: "ta-en-festivals-sentences"
kind: "layer"
core: "ta-festivals-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Festivals in sentences"
description: "Nine short sentences about Pongal, Deepavali, Navaratri, kolam, guests and temple festivals. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-4025":
    native: "Tomorrow is the Pongal festival."
    confusables:
      w1: { why: "தீபாவளி (tīpāvaḷi), Deepavali (the festival of lights), is a different word." }
      w2: { why: "போகி (pōki), Bhogi (the day before Pongal), is a different word." }
  "ta-4026":
    native: "The milk is boiling over in the pot."
    bases:
      "பானையில்": "in the pot; from பானை (pāṉai), pot"
      "பொங்குகிறது": "boils over; from பொங்கு (poṅku), to boil over"
    confusables:
      w1: { why: "கரும்பு (karumpu), sugarcane, is a different word." }
      w2: { why: "மெழுகுவர்த்தி (meḻukuvartti), candle, is a different word." }
  "ta-4027":
    native: "We burst firecrackers for Deepavali."
    bases:
      "தீபாவளிக்கு": "for Deepavali; from தீபாவளி (tīpāvaḷi), Deepavali"
      "வெடிக்கிறோம்": "burst; from வெடி (veṭi), to burst"
    confusables:
      w1: { why: "இனிப்பு (iṉippu), sweet; sweet dish, is a different word." }
      w2: { why: "தீபம் (tīpam), lamp (of worship), is a different word." }
  "ta-4028":
    native: "Mother draws a kolam in front of the house."
    notes:
      n1: "கோலம் போடு (kōlam pōṭu) means to draw a kolam; the verb is போடு (pōṭu), put."
    bases:
      "வீட்டின்": "of the house; from வீடு (vīṭu), house"
      "போடுகிறார்": "puts, draws (respectful); from போடு (pōṭu), to put"
    confusables:
      w1: { why: "பூ (pū), flower, is a different word." }
      w2: { why: "குங்குமம் (kuṅkumam), kumkum (red powder), is a different word." }
  "ta-4029":
    native: "There is a golu at home during Navaratri."
    bases:
      "நவராத்திரியில்": "during Navaratri; from நவராத்திரி (navarāttiri), Navaratri"
      "இருக்கிறது": "is; from இரு (iru), to be"
    confusables:
      w1: { why: "பூஜை (pūjai), puja; worship, is a different word." }
      w2: { why: "பண்டிகை (paṇṭikai), festival, is a different word." }
  "ta-4030":
    native: "Everyone buys new clothes for the festival."
    bases:
      "பண்டிகைக்கு": "for the festival; from பண்டிகை (paṇṭikai), festival"
      "வாங்குகிறார்கள்": "buy (respectful plural); from வாங்கு (vāṅku), to buy"
    confusables:
      w1: { why: "விருந்து (viruntu), feast; meal for guests, is a different word." }
      w2: { why: "இனிப்பு (iṉippu), sweet; sweet dish, is a different word." }
  "ta-4031":
    native: "The relatives are coming and the feast is ready."
    bases:
      "வருகிறார்கள்": "come (respectful plural); from வா (vā), to come"
      "தயார்": "ready"
    confusables:
      w1: { why: "விருந்தினர் (viruntiṉar), guest, is a different word." }
      w2: { why: "மகிழ்ச்சி (makiḻcci), happiness; joy, is a different word." }
  "ta-4032":
    native: "The chariot comes at the temple festival."
    bases:
      "திருவிழாவில்": "at the temple festival; from திருவிழா (tiruviḻā), temple festival"
      "வருகிறது": "comes; from வா (vā), to come"
    confusables:
      w1: { why: "ஊர்வலம் (ūrvalam), procession, is a different word." }
      w2: { why: "விழா (viḻā), function; celebration, is a different word." }
  "ta-4033":
    native: "New Year wishes to you."
    bases:
      "உங்களுக்கு": "to you; from நீங்கள் (nīṅkaḷ), you"
    confusables:
      w1: { why: "பிறந்தநாள் (piṟantanāḷ), birthday, is a different word." }
      w2: { why: "பொங்கல் (poṅkal), Pongal (the harvest festival; the rice dish), is a different word." }
