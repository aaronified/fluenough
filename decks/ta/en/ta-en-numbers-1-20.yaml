schema: 1
id: "ta-en-numbers-1-20"
kind: "layer"
core: "ta-numbers-1-20"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Numbers 1–20"
description: "The numbers one to twenty, with the words for hour, people and years of age they go with. The number one is taught in First words and seven in Sounds. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-0089":
    native: "two"
    notes:
      n1: "Counts two. Before a noun it stays as it is: இரண்டு பேர் (iraṇṭu pēr), two people."
    examples:
      "இரண்டு மணி.":
        native: "Two o'clock."
        bases: { "மணி": "hour; o'clock" }
      "இரண்டு பேர்.":
        native: "Two people."
        bases: { "பேர்": "people; names" }
  "ta-0090":
    native: "three"
    notes:
      n1: "Counts three. Used with a noun in the same way as இரண்டு (iraṇṭu)."
    examples:
      "மூன்று மணி.":
        native: "Three o'clock."
        bases: { "மணி": "hour; o'clock" }
      "மூன்று பேர்.":
        native: "Three people."
