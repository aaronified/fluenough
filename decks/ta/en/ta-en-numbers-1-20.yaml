  "ta-0107":
    native: "Numbers 1–10: ten words"
    explanation: "One ஒன்று (oṉṟu), two இரண்டு (iraṇṭu), three மூன்று (mūṉṟu), four நான்கு (nāṉku), five ஐந்து (aintu), six ஆறு (āṟu), seven ஏழு (ēḻu), eight எட்டு (eṭṭu), nine ஒன்பது (oṉpatu), ten பத்து (pattu)."
