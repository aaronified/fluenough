schema: 1
id: "ta-en-transport"
kind: "layer"
core: "ta-transport"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bus, auto, cab"
description: "The bus, the auto rickshaw, the taxi, the train, the bicycle and the car. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-0238":
    native: "bus"
    notes:
      n1: "A bus. By bus is பேருந்தில் (pēruntil)."
    examples:
      "பேருந்து வருகிறது.":
        native: "The bus is coming."
        bases:
          "பேருந்து": "bus"
          "வருகிறது": "is coming; from வா (vā), come"
      "நான் பேருந்தில் போகிறேன்.":
        native: "I am going by bus."
        bases:
          "பேருந்தில்": "by bus; from பேருந்து (pēruntu), bus"
          "போகிறேன்": "am going; from போ (pō), to go"
  "ta-0239":
    native: "auto rickshaw"
    notes:
      n1: "A three-wheeled auto rickshaw."
    examples:
      "ஆட்டோ அருகில் இருக்கிறது.":
        native: "The auto is near."
        bases:
          "ஆட்டோ": "auto rickshaw"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "இது ஆட்டோ.":
        native: "This is an auto."
        bases:
          "ஆட்டோ": "auto rickshaw"
  "ta-0240":
    native: "taxi"
    notes:
      n1: "A taxi or a cab."
    examples:
      "டாக்சி வருகிறது.":
        native: "The taxi is coming."
        bases:
          "டாக்சி": "taxi"
          "வருகிறது": "is coming; from வா (vā), come"
      "இது டாக்சி.":
        native: "This is a taxi."
        bases:
          "டாக்சி": "taxi"
  "ta-0241":
    native: "train"
    notes:
      n1: "A train."
    examples:
      "ரயில் நாளை வருகிறது.":
        native: "The train is coming tomorrow."
        bases:
          "ரயில்": "train"
          "வருகிறது": "is coming; from வா (vā), come"
      "இது ரயில்.":
        native: "This is a train."
        bases:
          "ரயில்": "train"
  "ta-0242":
    native: "bicycle"
    notes:
      n1: "A bicycle. To ride one is ஓட்டு (ōṭṭu)."
    examples:
      "நான் சைக்கிள் ஓட்டுகிறேன்.":
        native: "I ride a bicycle."
        bases:
          "சைக்கிள்": "bicycle"
          "ஓட்டுகிறேன்": "I ride (drive); from ஓட்டு (ōṭṭu), to ride; to drive"
      "இது சைக்கிள்.":
        native: "This is a bicycle."
        bases:
          "சைக்கிள்": "bicycle"
  "ta-0243":
    native: "car"
    notes:
      n1: "A car. By car is காரில் (kāril)."
    examples:
      "கார் அருகில் இருக்கிறது.":
        native: "The car is near."
        bases:
          "கார்": "car"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "நான் காரில் போகிறேன்.":
        native: "I am going by car."
        bases:
          "காரில்": "by car; from கார் (kār), car"
          "போகிறேன்": "am going; from போ (pō), to go"
  "ta-6400":
    native: "I need a taxi."
    notes:
      "n1": "வேண்டும் (vēṇṭum) is 'is needed'; the thing needed takes no ending, and the person who needs it can be left out."
    bases:
      "ஒரு": "a; one"
  "ta-6401":
    native: "I need to go to this address."
    notes:
      "n1": "போகணும் (pōkaṇum) is the spoken form of போக வேண்டும் (pōka vēṇṭum); in writing you would say போக வேண்டும் (pōka vēṇṭum). The ending -க்கு (kku) on முகவரிக்கு (mukavarikku) means 'to'."
    bases:
      "இந்த": "this"
      "முகவரிக்குப்": "address"
      "போகணும்": "to go"
  "ta-6402":
    native: "How much to the airport?"
    notes:
      "n1": "விமானநிலையம் (vimāṉanilaiyam) changes its stem before an ending: விமானநிலையத்துக்கு (vimāṉanilaiyattukku) has -த்து (ttu) added before -க்கு (kku), 'to'. ஆகும் (ākum) means 'will it come to'."
    bases:
      "விமானநிலையத்துக்கு": "airport"
      "ஆகும்": "to become; to cost"
  "ta-6403":
    native: "Please put the meter on."
    notes:
      "n1": "போடுங்கள் (pōṭuṅkaḷ) is the polite request form of போடு (pōṭu), 'to put'. Spoken Tamil often shortens it to போடுங்க (pōṭuṅka)."
    bases:
      "மீட்டர்": "taxi meter"
      "போடுங்கள்": "to put"
  "ta-6404":
    native: "Please stop here."
    notes:
      "n1": "நிறுத்துங்கள் (niṟuttuṅkaḷ) is the polite request form of நிறுத்து (niṟuttu), 'to stop'."
    bases:
      "நிறுத்துங்கள்": "to stop"
  "ta-6405":
    native: "Please turn to the right."
    notes:
      "n1": "பக்கம் (pakkam) means 'side'; the direction word comes before it. திரும்புங்கள் (tirumpuṅkaḷ) is the polite request form of திரும்பு (tirumpu), 'to turn'."
    bases:
      "பக்கம்": "side"
      "திரும்புங்கள்": "to turn"
  "ta-6406":
    native: "Please turn to the left."
    notes:
      "n1": "The same pattern as the turn to the right: the direction word இடது (iṭatu) comes before பக்கம் (pakkam), 'side'."
    bases:
      "பக்கம்": "side"
      "திரும்புங்கள்": "to turn"
  "ta-6407":
    native: "Do you have change?"
    notes:
      "n1": "The ending -ஆ (ā) on இருக்கிறதா (irukkiṟatā) turns a statement into a yes-or-no question."
    bases:
      "சில்லறை": "small change"
      "இருக்கிறதா": "to be; to have"
