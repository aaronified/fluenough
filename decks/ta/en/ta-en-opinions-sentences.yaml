schema: 1
id: "ta-en-opinions-sentences"
kind: "layer"
core: "ta-opinions-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Opinions in sentences"
description: "Sentences for saying what you think, agreeing, disagreeing, praising and criticising politely. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-9030":
    native: "What is your opinion?"
    bases:
      "உன்": "your; from நீ (nī), you (to a friend or child)"
    confusables:
      w1: { why: "எண்ணம் (eṇṇam), thought; idea; intention, is a different word." }
      w2: { why: "பார்வை (pārvai), view; outlook; sight, is a different word." }
      w3: { why: "ஆலோசனை (ālōcaṉai), advice; consultation, is a different word." }
  "ta-9031":
    native: "I do not agree."
    bases:
      "எனக்கு": "to me; for me; from நான் (nāṉ), I; me"
    confusables:
      w1: { why: "ஒப்புதல் (opputal), approval; consent, is a different word." }
      w2: { why: "மறுப்பு (maṟuppu), denial; refusal; objection, is a different word." }
      w3: { why: "எதிர்ப்பு (etirppu), opposition; resistance, is a different word." }
  "ta-9032":
    native: "What you say is right."
    bases:
      "சொல்வது": "what is said; saying; from சொல் (col), to say"
    confusables:
      w1: { why: "சம்மதம் (cammatam), consent; agreement, is a different word." }
      w2: { why: "உண்மை (uṇmai), truth; fact, is a different word." }
  "ta-9033":
    native: "I support you."
    bases:
      "உன்னை": "you (object); from நீ (nī), you (to a friend or child)"
      "ஆதரிக்கிறேன்": "am supporting; from ஆதரி (ātari), to support; to back"
    confusables:
      w1: { why: "எதிர் (etir), to oppose; to face, is a different word." }
      w2: { why: "ஏற்றுக்கொள் (ēṟṟukkoḷ), to accept, is a different word." }
      w3: { why: "சம்மதி (cammati), to consent, is a different word." }
  "ta-9034":
    native: "This is an excellent plan."
    confusables:
      w1: { why: "அற்புதமான (aṟputamāṉa), wonderful; marvellous, is a different word." }
      w2: { why: "சிறப்பான (ciṟappāṉa), special; excellent, is a different word." }
      w3: { why: "பயனுள்ள (payaṉuḷḷa), useful, is a different word." }
  "ta-9035":
    native: "This work is useless."
    bases:
      "இந்த": "this"
      "பயனற்றது": "is useless; from பயனற்ற (payaṉaṟṟa), useless"
    confusables:
      w1: { why: "தேவையற்ற (tēvaiyaṟṟa), unnecessary, is a different word." }
      w2: { why: "பயனுள்ள (payaṉuḷḷa), useful, is a different word." }
  "ta-9036":
    native: "This price is fair."
    bases:
      "இந்த": "this"
      "நியாயமானது": "is fair; from நியாயமான (niyāyamāṉa), fair; reasonable"
    confusables:
      w1: { why: "நியாயம் (niyāyam), fairness; justice; reason, is a different word." }
      w2: { why: "அநியாயம் (aniyāyam), injustice; unfairness, is a different word." }
  "ta-9037":
    native: "I will certainly come tomorrow."
    bases:
      "வருகிறேன்": "am coming; from வா (vā), to come"
    confusables:
      w1: { why: "கண்டிப்பாக (kaṇṭippāka), definitely; strictly, is a different word." }
      w2: { why: "ஒருவேளை (oruvēḷai), perhaps; maybe, is a different word." }
      w3: { why: "கட்டாயம் (kaṭṭāyam), surely; compulsorily, is a different word." }
  "ta-9038":
    native: "This film is a disappointment."
    bases:
      "இந்தப்": "this (before a word starting with p); from இந்த (inta), this"
    confusables:
      w1: { why: "வேடிக்கையான (vēṭikkaiyāṉa), funny; amusing, is a different word." }
      w2: { why: "அற்புதம் (aṟputam), wonder; marvel, is a different word." }
      w3: { why: "பிரமாதம் (piramātam), splendour; excellence, is a different word." }
  "ta-9039":
    native: "Honestly, I do not like this."
    bases:
      "எனக்கு": "to me; for me; from நான் (nāṉ), I; me"
      "பிடிக்கவில்லை": "does not like; from பிடி (piṭi), to hold; to like"
    confusables:
      w1: { why: "உண்மையாகவே (uṇmaiyākavē), truly; really, is a different word." }
      w2: { why: "மாறாக (māṟāka), on the contrary; instead, is a different word." }
