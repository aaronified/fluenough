pattern:
  name: "Personal pronouns"
  slot_name: "number"
  entries:
    "naan": "I"
    "nee": "you, to a friend or a child"
    "neengal": "you, polite"
    "avan": "he"
    "aval": "she"
    "avar": "he or she, polite"
  notes: "Tamil has two plural forms of நான் (nāṉ): நாம் (nām) includes the person you speak to and நாங்கள் (nāṅkaḷ) leaves them out. நீங்கள் (nīṅkaḷ) is you for several people and also for one person you respect; நீ (nī) is for a friend or a child. அவன் (avaṉ) is a man and அவள் (avaḷ) a woman; அவர் (avar) is a respected person of either sex, and அவர்கள் (avarkaḷ) is all of them in the plural. Source: English Wikipedia, Tamil grammar, Pronouns."
