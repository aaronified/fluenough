# Layer for ta-proverbs-2: each proverb's literal English rendering and its meaning.
schema: 1
id: "ta-en-proverbs-2"
kind: "layer"
core: "ta-proverbs-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs 2"
description: "Twenty Tamil proverbs from Rev. P. Percival's 1874 collection, not in proverbs 1, short first: friends, learning, time, speech and caution. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-6220":
    native: "Said that a debt is best paid at once, and that delay does harm."
    notes:
      "literal": "Word for word: It can be paid on the day; it must not be paid after waiting."
    bases:
      "அன்றிறுக்கலாம்": { meaning: "may be paid on the day, as printed" }
      "நின்றிறுக்கலாகாது": { meaning: "may not be paid after waiting, as printed" }
  "ta-6221":
    native: "Said as a warning against taking advice from someone without sense."
    notes:
      "literal": "Word for word: Do not ask a fool for advice."
    bases:
      "அறிவீனனிடத்தில்": { meaning: "from a fool" }
      "புத்தி": { meaning: "advice, sense" }
      "கேளாதே": { meaning: "do not ask" }
  "ta-6222":
    native: "Said that careful work done without rushing does not go wrong."
    notes:
      "literal": "Word for word: A task done without haste will not scatter."
    bases:
      "பதறாத": { meaning: "unhurried, not in haste" }
      "காரியம்": { meaning: "task, deed" }
      "சிதறாது": { meaning: "will not scatter, will not go to waste" }
  "ta-6223":
    native: "Said that every task must be done at the right time."
    notes:
      "literal": "Word for word: Do the planting in its season."
    bases:
      "பருவத்தே": { meaning: "in season" }
      "பயிர்": { meaning: "crop" }
      "செய்": { meaning: "do" }
  "ta-6224":
    native: "Said that silence and patience can overcome even great difficulties."
    notes:
      "literal": "Word for word: Silence can win over a mountain."
    bases:
      "மவுனம்": { meaning: "silence" }
      "மலையைச்": { meaning: "the mountain" }
      "சாதிக்கும்": { meaning: "will accomplish, will win over" }
  "ta-6225":
    native: "Said that a true friend is found out when you are in trouble."
    notes:
      "literal": "Word for word: Know a loving friend in times of danger."
    bases:
      "அன்பான": { meaning: "loving" }
      "சிநேகிதனை": { meaning: "friend, in the object form" }
      "ஆபத்திலே": { meaning: "in danger" }
      "அறி": { meaning: "know" }
  "ta-6226":
    native: "Said that friendship with mean people ends in serious harm."
    notes:
      "literal": "Word for word: Friendship with petty people is a cutting-off of life."
    bases:
      "அற்பர்": { meaning: "petty people" }
      "சிநேகிதம்": { meaning: "friendship" }
      "பிராண": { meaning: "life, breath" }
      "கண்டிதம்": { meaning: "cutting off" }
  "ta-6227":
    native: "Said that a doctor's concern for a sick person ends when the visit is over."
    notes:
      "literal": "Word for word: The doctor's friendship goes only as far as the street door."
    bases:
      "பரிகாரி": { meaning: "healer, doctor" }
      "உறவு": { meaning: "relationship, friendship" }
      "தெருவாசல்": { meaning: "street door" }
      "மட்டும்": { meaning: "only as far as" }
  "ta-6228":
    native: "Said of someone who speaks kindly while holding a grudge."
    notes:
      "literal": "Word for word: Enmity in the mind, friendship on the lips."
    bases:
      "மனதிலே": { meaning: "in the mind" }
      "பகை": { meaning: "enmity" }
      "உதட்டிலே": { meaning: "on the lips" }
      "உறவு": { meaning: "friendship" }
  "ta-6229":
    native: "Said that a skill that has been thoroughly practised is never lost."
    notes:
      "literal": "Word for word: Skill gained by practice has no ruin."
    bases:
      "அப்பியாச": { meaning: "practice" }
      "வித்தைக்கு": { meaning: "for skill, art" }
      "அழிவு": { meaning: "ruin" }
      "இல்லை": { meaning: "there is not" }
  "ta-6230":
    native: "Said that half-learned or flawed knowledge is worse than none."
    notes:
      "literal": "Word for word: No learning is better than faulty learning."
    bases:
      "கசடான": { meaning: "faulty" }
      "கல்வியினும்": { meaning: "than learning" }
      "கல்வியீனம்": { meaning: "lack of learning" }
      "நலம்": { meaning: "better, good" }
  "ta-6231":
    native: "Said that the learned do not keep company with the worthless."
    notes:
      "literal": "Word for word: The faulty have no friendship with the learned."
    bases:
      "கசடருக்கு": { meaning: "to the faulty" }
      "இல்லைக்": { meaning: "there is not" }
      "கற்றோர்": { meaning: "the learned" }
      "உறவு": { meaning: "friendship" }
  "ta-6232":
    native: "Said that what has come to maturity will not stay where it is."
    notes:
      "literal": "Word for word: A ripe fruit will not stay on the branch."
    bases:
      "பழுத்த": { meaning: "ripe" }
      "பழம்": { meaning: "fruit" }
      "கொம்பில்": { meaning: "on the branch" }
      "இராது": { meaning: "will not stay" }
  "ta-6233":
    native: "Said that one should not speak in public with only half the knowledge of a matter."
    notes:
      "literal": "Word for word: Can one climb into the assembly with only half a word?"
    bases:
      "அரைச்சொற்": { meaning: "half a word" }
      "கொண்டு": { meaning: "with, having taken" }
      "அம்பலம்": { meaning: "village assembly, public hall" }
      "ஏறலாமோ": { meaning: "may one climb?" }
  "ta-6234":
    native: "Said that a silly question deserves no answer."
    notes:
      "literal": "Word for word: A foolish question has no reply."
    bases:
      "மடக்": { meaning: "foolish" }
      "கேழ்விக்கு": { meaning: "to a question, as printed (modern spelling கேள்வி (kēḷvi))" }
      "மாறுத்தரம்": { meaning: "reply" }
      "இல்லை": { meaning: "there is not" }
  "ta-6235":
    native: "Said that an enemy's show of friendship hides a danger that will flare up."
    notes:
      "literal": "Word for word: The friendship of enemies is a fire with smoke rising from it."
    bases:
      "பகைவர்": { meaning: "enemies" }
      "உறவு": { meaning: "relationship, friendship" }
      "புகை": { meaning: "smoke" }
      "எழு": { meaning: "rising" }
      "நெருப்பு": { meaning: "fire" }
  "ta-6236":
    native: "Said that fame does not come to those whose learning is not thorough."
    notes:
      "literal": "Word for word: For those who have not learned without fault there is no attaining of fame."
    bases:
      "கசடறக்": { meaning: "without fault" }
      "கல்லார்க்கு": { meaning: "to those who have not learned" }
      "இசை": { meaning: "fame" }
      "உறல்": { meaning: "attaining" }
      "இல்லை": { meaning: "there is not" }
  "ta-6237":
    native: "Said to urge determination in finishing what one has begun."
    notes:
      "literal": "Word for word: A task must be finished, even if you have to fill up the sea."
    bases:
      "கடலைத்": { meaning: "the sea" }
      "தூர்த்தும்": { meaning: "even by filling up" }
      "காரியம்": { meaning: "task" }
      "முடிக்க": { meaning: "to finish" }
      "வேண்டும்": { meaning: "must" }
  "ta-6238":
    native: "Said that a secret cannot be kept in the mind for long."
    notes:
      "literal": "Word for word: A straw may lie in the sea, but a word will not lie in the mind."
    bases:
      "கடலிலே": { meaning: "in the sea" }
      "துரும்பு": { meaning: "straw" }
      "கிடந்தாலும்": { meaning: "even if it lies" }
      "மனதிலே": { meaning: "in the mind" }
      "ஒரு": { meaning: "one, a" }
      "சொல்": { meaning: "word" }
      "கிடவாது": { meaning: "will not lie, will not stay" }
  "ta-6239":
    native: "Said of someone with big ambitions who lacks the strength even for small things."
    notes:
      "literal": "Word for word: There is a wish to cross the sea, but no legs to cross a drain."
    bases:
      "கடல்": { meaning: "sea" }
      "தாண்ட": { meaning: "to cross" }
      "தாண்டக்": { meaning: "to cross" }
      "ஆசை": { meaning: "wish, desire" }
      "உண்டு": { meaning: "there is" }
      "கால்வாய்": { meaning: "channel, drain" }
      "கால்": { meaning: "leg" }
      "இல்லை": { meaning: "there is not" }
