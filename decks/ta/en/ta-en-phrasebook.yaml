native:
  code: en
  iso639_3: eng
  name: English
name: 'Phrasebook: first phrases'
description: 'Twenty phrases to say whole from the first day: greetings and goodbye, thanks and sorry, asking for help, asking where the toilet is, and saying you are still learning Tamil. Not yet checked by a Tamil speaker: please report any mistake.'
license: CC-BY-SA-4.0
tags:
- unreviewed
cards:
  ta-0011:
    native: hello
    notes:
      n1: Said to anyone, at any time of day, often with the palms pressed together.
    bases:
      வணக்கம்: hello
  ta-0012:
    native: goodbye (said by the one leaving)
    notes:
      n1: Literally 'I will go and come back'. The one staying says போய் வாருங்கள் (pōy vāruṅkaḷ), go and come back.
    bases:
      போய்: to go (and then)
  ta-0013:
    native: thank you; thanks
    notes:
      n1: Common and polite. Among close friends, thanks is often left out.
    bases:
      நன்றி: thanks
  ta-0014:
    native: excuse me; sorry
    notes:
      n1: Said to get past someone, to get attention, or to apologise.
    bases:
      மன்னிக்கவும்: excuse me; sorry
  ta-0015:
    native: I don't understand.
    notes:
      n1: 'எனக்கு (eṉakku) is ''to me'', from நான் (nāṉ), I. The negative is in the verb: புரியவில்லை (puriyavillai).'
    bases:
      புரியவில்லை: to understand
  ta-0016:
    native: Please speak slowly.
    notes:
      n1: The polite form. To a friend, say பேசு (pēcu), speak.
    bases:
      மெதுவாகப்: slowly
      பேசுங்கள்: to speak
  ta-0017:
    native: please
    notes:
      n1: A polite request. It comes before the thing you ask for.
    bases:
      தயவுசெய்து: please
  ta-0018:
    native: Please help!
    notes:
      n1: Literally 'do help'. In an emergency, say it loudly.
    bases:
      உதவி: help
      செய்யுங்கள்: to do
  ta-0019:
    native: Where is the toilet?
    notes:
      n1: Literally 'toilet, where?'. The word for 'where' is எங்கே (eṅkē).
    bases:
      கழிவறை: toilet
      எங்கே: where
  ta-0020:
    native: How much is this?
    notes:
      n1: Literally 'this, how much?'. எவ்வளவு (evvaḷavu) asks for a price or an amount.
    bases:
      இது: this
      எவ்வளவு: how much
  ta-0021:
    native: I don't know Tamil.
    notes:
      n1: The negative of தெரி (teri), to know, is தெரியாது (teriyātu). Say the language with தமிழ் (tamiḻ).
    bases:
      தமிழ்: Tamil
      தெரியாது: to know
  ta-0022:
    native: I speak a little Tamil.
    notes:
      n1: கொஞ்சம் (koñcam) is 'a little'. பேசுவேன் (pēcuvēṉ) is 'I will speak', from பேசு (pēcu).
    bases:
      கொஞ்சம்: a little
      தமிழ்: Tamil
      பேசுவேன்: to speak
  ta-0023:
    native: OK; all right
    notes:
      n1: Also 'right' or 'correct'. Said to agree, or to close a topic.
    bases:
      சரி: OK; right
  ta-0024:
    native: one moment
    notes:
      n1: Literally 'one minute'. Used to ask someone to wait.
    bases:
      ஒரு: one (before a noun)
      நிமிடம்: minute
  ta-0025:
    native: it's all right; never mind
    notes:
      n1: Said to someone who apologises, or to refuse something politely.
    bases:
      பரவாயில்லை: it's all right
  ta-0026:
    native: I want tea.
    notes:
      n1: Literally 'tea is needed'. வேண்டும் (vēṇṭum) is the usual way to say what you want.
    bases:
      தேநீர்: tea
      வேண்டும்: to want; to need
  ta-0027:
    native: Please say it again.
    notes:
      n1: Said when you did not catch something. மீண்டும் (mīṇṭum) means 'again'.
    bases:
      மீண்டும்: again
      சொல்லுங்கள்: to say
  ta-0028:
    native: Thanks for the help.
    notes:
      n1: Literally 'thanks for the help'.
    bases:
      உதவிக்கு: help
      நன்றி: thanks
  ta-0029:
    native: Good, thanks.
    notes:
      n1: A quick way to say that something is fine and to thank someone.
    bases:
      நன்றி: thanks
  ta-0030:
    native: OK, let's go.
    notes:
      n1: போகலாம் (pōkalām) is 'let's go', from போ (pō), to go.
    bases:
      சரி: OK; right
      போகலாம்: to go
