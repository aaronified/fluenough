cards:
  "ta-0260":
    native: "school"
    notes:
      n1: "A school for children."
    examples:
      "நான் பள்ளி போகிறேன்.":
        native: "I am going to school."
        bases:
          "பள்ளி": "school"
          "போகிறேன்": "am going; from போ (pō), to go"
      "பள்ளி அருகில் இருக்கிறது.":
        native: "The school is near."
        bases:
          "பள்ளி": "school"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-0261":
    native: "hospital"
    notes:
      n1: "A hospital, where the doctor is."
    examples:
      "மருத்துவமனை அருகில் இருக்கிறது.":
        native: "The hospital is near."
        bases:
          "மருத்துவமனை": "hospital"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "நான் மருத்துவமனை போகிறேன்.":
        native: "I am going to the hospital."
        bases:
          "மருத்துவமனை": "hospital"
          "போகிறேன்": "am going; from போ (pō), to go"
  "ta-0262":
    native: "temple"
    notes:
      n1: "A Hindu temple."
    examples:
      "அது பெரிய கோயில்.":
        native: "That is a big temple."
        bases:
          "கோயில்": "temple"
      "நாங்கள் கோயில் போகிறோம்.":
        native: "We are going to the temple."
        bases:
          "கோயில்": "temple"
          "போகிறோம்": "are going; from போ (pō), to go"
  "ta-0263":
    native: "bank"
    notes:
