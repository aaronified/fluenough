core: "ta-careers"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Careers: jobs, work and interviews"
description: "Careers and jobs: finding work, applying and interviews, pay and leave, skills and qualifications, kinds of workers, and the verbs of working, earning and getting ahead. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-7436":
    native: "job opening; employment"
    notes:
      n1: "Built from வேலை (vēlai) (work) and வாய்ப்பு (vāyppu) (chance); written as one word."
    examples:
      "வேலைவாய்ப்பு இருக்கிறது.":
        native: "There is a job opening."
        bases:
          "வேலைவாய்ப்பு": "job opening; employment"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "இங்கே வேலைவாய்ப்பு குறைவு.":
        native: "There are few jobs here."
        bases:
          "வேலைவாய்ப்பு": "job opening; employment"
  "ta-7437":
    native: "applicant"
    notes:
      n1: "விண்ணப்பம் (viṇṇappam) (application) plus -தாரர் (-tārar), 'the holder'; used for men and women alike."
    examples:
      "அவர் விண்ணப்பதாரர்.":
        native: "He is an applicant."
        bases:
          "அவர்": "he or she (polite)"
          "விண்ணப்பதாரர்": "applicant"
      "விண்ணப்பதாரர் வருகிறார்.":
        native: "The applicant is coming."
        bases:
          "விண்ணப்பதாரர்": "applicant"
          "வருகிறார்": "comes (respectful); from வா (vā), to come"
  "ta-7438":
    native: "profile; résumé"
    notes:
      n1: "சுய (cuya) (own) plus விவரம் (vivaram) (detail); in speech people say பயோடேட்டா (payōṭēṭṭā) (biodata)."
    examples:
      "என் சுயவிவரம் இங்கே.":
        native: "My résumé is here."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "சுயவிவரம்": "profile; résumé"
      "சுயவிவரம் அனுப்பு.":
        native: "Send the résumé."
        bases:
          "சுயவிவரம்": "profile; résumé"
  "ta-7439":
    native: "biodata; CV"
    notes:
      n1: "The everyday spoken word for a résumé or CV, from English."
    examples:
      "பயோடேட்டா வேண்டும்.":
        native: "A CV is needed."
        bases:
          "பயோடேட்டா": "biodata; CV"
      "என் பயோடேட்டா எழுதுகிறேன்.":
        native: "I am writing my CV."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "பயோடேட்டா": "biodata; CV"
          "எழுதுகிறேன்": "am writing; from எழுது (eḻutu), to write"
  "ta-7440":
    native: "skill; ability"
    notes:
      n1: "A written word for a skill; the everyday word is திறமை (tiṟamai), already in the course."
    examples:
      "அவனுக்குத் திறன் இருக்கிறது.":
        native: "He has skill."
        bases:
          "அவனுக்குத்": "to him; for him; from அவன் (avaṉ), he; him"
          "திறன்": "skill; ability"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "என் திறன் குறைவு.":
        native: "My skill is little."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "திறன்": "skill; ability"
  "ta-7441":
    native: "pay; wages"
    notes:
      n1: "A formal word for pay; in speech people say சம்பளம் (campaḷam), which is already in the course."
    examples:
      "ஊதியம் எவ்வளவு?":
        native: "How much is the pay?"
        bases:
          "ஊதியம்": "pay; wages"
      "ஊதியம் மாதம் ஒருமுறை கிடைக்கிறது.":
        native: "The pay comes once a month."
        bases:
          "ஊதியம்": "pay; wages"
          "ஒருமுறை": "once"
          "கிடைக்கிறது": "is received; is available; from கிடை (kiṭai), to be obtained"
  "ta-7442":
    native: "promotion"
    notes:
      n1: "பதவி (patavi) (post) plus உயர்வு (uyarvu) (rise); written as one word."
    examples:
      "எனக்குப் பதவிஉயர்வு கிடைக்கிறது.":
        native: "I am getting a promotion."
        bases:
          "எனக்குப்": "to me; for me; from நான் (nāṉ), I; me"
          "பதவிஉயர்வு": "promotion"
          "கிடைக்கிறது": "is received; is available; from கிடை (kiṭai), to be obtained"
      "பதவிஉயர்வு நல்லது.":
        native: "A promotion is good."
        bases:
          "பதவிஉயர்வு": "promotion"
  "ta-7443":
    native: "staff member; employee"
    notes:
      n1: "A formal word for an employee; in speech people say ஊழியர் (ūḻiyar)."
    examples:
      "அவர் பணியாளர்.":
        native: "He is a staff member."
        bases:
          "அவர்": "he or she (polite)"
          "பணியாளர்": "staff member; employee"
      "பணியாளர் வருகிறார்.":
        native: "The staff member is coming."
        bases:
          "பணியாளர்": "staff member; employee"
          "வருகிறார்": "comes (respectful); from வா (vā), to come"
  "ta-7444":
    native: "entrepreneur"
    notes:
      n1: "தொழில் (toḻil) (business) plus முனைவோர் (muṉaivōr) (those who venture); used for men and women alike."
    examples:
      "அவர் தொழில்முனைவோர்.":
        native: "He is an entrepreneur."
        bases:
          "அவர்": "he or she (polite)"
          "தொழில்முனைவோர்": "entrepreneur"
      "தொழில்முனைவோர் புதிய கடை திறக்கிறார்.":
        native: "The entrepreneur opens a new shop."
        bases:
          "தொழில்முனைவோர்": "entrepreneur"
          "திறக்கிறார்": "is opening (respectful); from திற (tiṟa), to open"
  "ta-7445":
    native: "working hours"
    notes:
      n1: "வேலை (vēlai) (work) plus நேரம் (nēram) (time)."
    examples:
      "வேலைநேரம் எப்போது?":
        native: "When are the working hours?"
        bases:
          "வேலைநேரம்": "working hours"
      "வேலைநேரம் காலை ஒன்பது மணி.":
        native: "Working hours are nine in the morning."
        bases:
          "வேலைநேரம்": "working hours"
  "ta-7446":
    native: "leave; time off"
    notes:
      n1: "Time off from work; in speech people say லீவு (līvu) (leave)."
    examples:
      "எனக்கு விடுப்பு வேண்டும்.":
        native: "I need leave."
        bases:
          "எனக்கு": "to me; for me; from நான் (nāṉ), I; me"
          "விடுப்பு": "leave; time off"
      "நாளை விடுப்பு.":
        native: "Leave tomorrow."
        bases:
          "விடுப்பு": "leave; time off"
  "ta-7447":
    native: "part-time"
    notes:
      n1: "பகுதி (pakuti) (part) plus நேரம் (nēram) (time); the opposite is முழுநேரம் (muḻunēram)."
    examples:
      "இது பகுதிநேரம் வேலை.":
        native: "This is part-time work."
        bases:
          "பகுதிநேரம்": "part-time"
      "பகுதிநேரம் வேலை வேண்டும்.":
        native: "I want part-time work."
        bases:
          "பகுதிநேரம்": "part-time"
  "ta-7448":
    native: "full-time"
    notes:
      n1: "முழு (muḻu) (whole) plus நேரம் (nēram) (time); the opposite is பகுதிநேரம் (pakutinēram)."
    examples:
      "இது முழுநேரம் வேலை.":
        native: "This is full-time work."
        bases:
          "முழுநேரம்": "full-time"
      "முழுநேரம் வேலை வேண்டும்.":
        native: "I want full-time work."
        bases:
          "முழுநேரம்": "full-time"
  "ta-7449":
    native: "resignation"
    notes:
      n1: "You do (செய் (cey)) a resignation; the word is of Persian-Arabic origin and common in speech."
    examples:
      "நான் ராஜினாமா செய்கிறேன்.":
        native: "I am resigning."
        bases:
          "ராஜினாமா": "resignation"
          "செய்கிறேன்": "do; from செய் (cey), to do"
      "ராஜினாமா கடிதம் எழுது.":
        native: "Write a resignation letter."
        bases:
          "ராஜினாமா": "resignation"
  "ta-7450":
    native: "dismissal; termination"
    notes:
      n1: "பணி (paṇi) (job) plus நீக்கம் (nīkkam) (removal)."
    examples:
      "அவருக்குப் பணிநீக்கம்.":
        native: "He is dismissed."
        bases:
          "அவருக்குப்": "to him or her (polite); for him or her (polite); from அவர் (avar), he or she (polite)"
          "பணிநீக்கம்": "dismissal; termination"
      "பணிநீக்கம் நடந்தது.":
        native: "A dismissal took place."
        bases:
          "பணிநீக்கம்": "dismissal; termination"
          "நடந்தது": "happened; took place; from நட (naṭa), to walk; to happen"
  "ta-7451":
    native: "retirement"
    notes:
      n1: "Literally job completion; used in notices of retirement."
    examples:
      "அவருக்குப் பணிநிறைவு.":
        native: "He is retiring."
        bases:
          "அவருக்குப்": "to him or her (polite); for him or her (polite); from அவர் (avar), he or she (polite)"
          "பணிநிறைவு": "retirement"
      "பணிநிறைவு விழா நாளை.":
        native: "The retirement function is tomorrow."
        bases:
          "பணிநிறைவு": "retirement"
  "ta-7452":
    native: "workplace"
    notes:
      n1: "பணி (paṇi) (job) plus இடம் (iṭam) (place)."
    examples:
      "பணியிடம் எங்கே?":
        native: "Where is the workplace?"
        bases:
          "பணியிடம்": "workplace"
      "பணியிடம் சுத்தமாக இருக்கிறது.":
        native: "The workplace is clean."
        bases:
          "பணியிடம்": "workplace"
          "சுத்தமாக": "clean; from சுத்தம் (cuttam), cleanliness; clean"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7453":
    native: "achievement; record"
    notes:
      n1: "Used for an achievement, a feat and a record."
    examples:
      "இது பெரிய சாதனை.":
        native: "This is a great achievement."
        bases:
          "சாதனை": "achievement; record"
      "அவன் சாதனை நல்லது.":
        native: "His achievement is good."
        bases:
          "அவன்": "his"
          "சாதனை": "achievement; record"
  "ta-7454":
    native: "opportunity; chance"
    notes:
      n1: "A chance or opening; it also means likelihood."
    examples:
      "இது நல்ல வாய்ப்பு.":
        native: "This is a good opportunity."
        bases:
          "வாய்ப்பு": "opportunity; chance"
      "எனக்கு வாய்ப்பு வேண்டும்.":
        native: "I want a chance."
        bases:
          "எனக்கு": "to me; for me; from நான் (nāṉ), I; me"
          "வாய்ப்பு": "opportunity; chance"
  "ta-7455":
    native: "degree; title"
    notes:
      n1: "The same word means a degree or title and a kite; the sentence tells which."
    examples:
      "அவருக்குப் பட்டம் இருக்கிறது.":
        native: "He has a degree."
        bases:
          "அவருக்குப்": "to him or her (polite); for him or her (polite); from அவர் (avar), he or she (polite)"
          "பட்டம்": "degree; title"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "பட்டம் வாங்குகிறேன்.":
        native: "I am getting a degree."
        bases:
          "பட்டம்": "degree; title"
          "வாங்குகிறேன்": "am buying; from வாங்கு (vāṅku), to buy"
  "ta-7456":
    native: "graduate"
    notes:
      n1: "பட்டம் (paṭṭam) (degree) plus -தாரி (-tāri), 'the holder'; used for men and women alike."
    examples:
      "அவர் பட்டதாரி.":
        native: "He is a graduate."
        bases:
          "அவர்": "he or she (polite)"
          "பட்டதாரி": "graduate"
      "பட்டதாரி வேலை தேடுகிறார்.":
        native: "The graduate is looking for a job."
        bases:
          "பட்டதாரி": "graduate"
          "தேடுகிறார்": "is searching (respectful); from தேடு (tēṭu), to search; to look for"
  "ta-7457":
    native: "pass; proficiency"
    notes:
      n1: "Passing an exam, and also being skilled in a subject."
    examples:
      "தேர்ச்சி கிடைத்தது.":
        native: "A pass was received."
        bases:
          "தேர்ச்சி": "pass; proficiency"
          "கிடைத்தது": "was received; from கிடை (kiṭai), to be obtained"
      "அவனுக்குத் தமிழ் தேர்ச்சி.":
        native: "He is proficient in Tamil."
        bases:
          "அவனுக்குத்": "to him; for him; from அவன் (avaṉ), he; him"
          "தேர்ச்சி": "pass; proficiency"
  "ta-7458":
    native: "wage; labour charge"
    notes:
      n1: "Pay for daily or manual work, rather than a monthly salary."
    examples:
      "கூலி எவ்வளவு?":
        native: "How much is the wage?"
        bases:
          "கூலி": "wage; labour charge"
      "கூலி கொடு.":
        native: "Pay the wage."
        bases:
          "கூலி": "wage; labour charge"
  "ta-7459":
    native: "daily wage"
    notes:
      n1: "தினம் (tiṉam) (day) plus கூலி (kūli) (wage); the word names both the wage and the worker."
    examples:
      "அவர் தினக்கூலி.":
        native: "He is a daily-wage worker."
        bases:
          "அவர்": "he or she (polite)"
          "தினக்கூலி": "daily wage"
      "தினக்கூலி குறைவு.":
        native: "The daily wage is low."
        bases:
          "தினக்கூலி": "daily wage"
  "ta-7460":
    native: "bonus"
    notes:
      n1: "A loanword from English, said as it is."
    examples:
      "போனஸ் கிடைக்கிறது.":
        native: "The bonus is received."
        bases:
          "போனஸ்": "bonus"
          "கிடைக்கிறது": "is received; is available; from கிடை (kiṭai), to be obtained"
      "தீபாவளி போனஸ் வருகிறது.":
        native: "The Diwali bonus is coming."
        bases:
          "போனஸ்": "bonus"
          "வருகிறது": "is coming; from வா (vā), come"
  "ta-7461":
    native: "income"
    notes:
      n1: "The money that comes in; வா (vā) (come) is behind the word."
    examples:
      "என் வருமானம் குறைவு.":
        native: "My income is low."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "வருமானம்": "income"
      "வருமானம் அதிகம்.":
        native: "The income is high."
        bases:
          "வருமானம்": "income"
  "ta-7462":
    native: "businessman; industrialist"
    notes:
      n1: "தொழில் (toḻil) (business) plus அதிபர் (atipar) (head); used for men and women alike."
    examples:
      "அவர் தொழிலதிபர்.":
        native: "He is a businessman."
        bases:
          "அவர்": "he or she (polite)"
          "தொழிலதிபர்": "businessman; industrialist"
      "தொழிலதிபர் பேசுகிறார்.":
        native: "The businessman is speaking."
        bases:
          "தொழிலதிபர்": "businessman; industrialist"
          "பேசுகிறார்": "is speaking; from பேசு (pēcu), to speak"
  "ta-7463":
    native: "transfer (of a job)"
    notes:
      n1: "The noun of இடமாற்று (iṭamāṟṟu) (to transfer), used for a job posting."
    examples:
      "எனக்கு இடமாற்றம்.":
        native: "I have a transfer."
        bases:
          "எனக்கு": "to me; for me; from நான் (nāṉ), I; me"
          "இடமாற்றம்": "transfer (of a job)"
      "இடமாற்றம் வந்தது.":
        native: "A transfer order came."
        bases:
          "இடமாற்றம்": "transfer (of a job)"
          "வந்தது": "came; from வா (vā), to come"
  "ta-7464":
    native: "workload"
    notes:
      n1: "வேலை (vēlai) (work) plus பளு (paḷu) (load)."
    examples:
      "வேலைபளு அதிகம்.":
        native: "The workload is heavy."
        bases:
          "வேலைபளு": "workload"
      "வேலைபளு குறைகிறது.":
        native: "The workload is going down."
        bases:
          "வேலைபளு": "workload"
          "குறைகிறது": "goes down; from குறை (kuṟai), to decrease; to lessen"
  "ta-7465":
    native: "challenge"
    notes:
      n1: "Used for a challenge to meet and for a dare."
