cards:
  "ta-0052":
    native: "What is your name?"
    confusables:
      w1: { why: "யார் (yār) asks who, not what the name is." }
      w2: { why: "எங்கே (eṅkē) asks where, not what." }
  "ta-0053":
    native: "Where is he?"
    confusables:
      w1: { why: "எப்போது (eppōtu) asks when, not where." }
      w2: { why: "ஏன் (ēṉ) asks why, not where." }
  "ta-0054":
    native: "When will you come?"
    confusables:
      w1: { why: "எங்கே (eṅkē) asks where, not when." }
      w2: { why: "ஏன் (ēṉ) asks why, not when." }
  "ta-0055":
    native: "Where is the shop?"
    confusables:
      w1: { why: "யார் (yār) asks who, not where." }
      w2: { why: "என்ன (enna) asks what, not where." }
  "ta-0056":
    native: "Are you coming?"
    confusables:
      w1: { why: "ஏன் (ēṉ) asks why, and this question has no question word." }
      w2: { why: "எப்போது (eppōtu) asks when, and this question has no question word." }
