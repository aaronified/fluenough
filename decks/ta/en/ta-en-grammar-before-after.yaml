rules:
  "ta-rule-before":
    name: "Before: the verb as a noun and முன் (muṉ)"
    explanation: "For before doing, put the purpose form, the verb as a noun in the dative, in front of முன் (muṉ), before, or முன்னாடி (muṉṉāṭi) in speech: {1}, to come, gives {2} in speech and {3} in writing, before coming. The verb that follows tells the tense."
  "ta-rule-after":
    name: "After: the past participle and பிறகு (piṟaku)"
    explanation: "For after doing, put the relative past form, taught earlier, in front of பிறகு (piṟaku), after: {1}, to come, gives {2}, after coming. Add -தும் (-tum) to the same form for as soon as: {3}. English Wiktionary lists அப்புறம் (appuṟam) and பின் (piṉ) as other words for after. Source: English Wiktionary (the entry for piṟaku)."
