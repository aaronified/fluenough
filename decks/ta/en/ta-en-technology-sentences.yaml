schema: 1
id: "ta-en-technology-sentences"
kind: "layer"
core: "ta-technology-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Technology in sentences"
description: "Sentences about apps, updates, passwords, downloads, security and social media. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-9070":
    native: "Download this app."
    bases:
      "இந்தச்": "this; from இந்த (inta), this (before a noun)"
      "செயலியைப்": "the app; from செயலி (ceyali), app"
    confusables:
      w1: { why: "பதிவிறக்கம் (pativiṟakkam), download, is a different word." }
      w2: { why: "பதிவேற்றம் (pativēṟṟam), upload, is a different word." }
      w3: { why: "புதுப்பிப்பு (putuppippu), update, is a different word." }
  "ta-9071":
    native: "I got a new update."
    bases:
      "எனக்குப்": "to me; for me; from நான் (nāṉ), I; me"
      "வந்தது": "came; from வா (vā), to come"
    confusables:
      w1: { why: "சரிபார்ப்பு (caripārppu), verification; checking, is a different word." }
      w2: { why: "மறுதொடக்கம் (maṟutoṭakkam), restart; reboot, is a different word." }
  "ta-9072":
    native: "Log in to the account and see."
    bases:
      "கணக்கில்": "in the maths; from கணக்கு (kaṇakku), maths; sum; account"
      "உள்நுழைந்து": "having logged in; from உள்நுழை (uḷnuḻai), to log in; to enter"
      "பாருங்கள்": "please look; from பார் (pār), to see; to look"
    confusables:
      w1: { why: "பின் (piṉ), PIN, is a different word." }
      w2: { why: "குறியீடு (kuṟiyīṭu), code; symbol, is a different word." }
      w3: { why: "அணுகல் (aṇukal), access, is a different word." }
  "ta-9073":
    native: "There is an error on this website."
    bases:
      "இந்த": "this"
      "இணையதளத்தில்": "in the website; from இணையதளம் (iṇaiyataḷam), website"
      "இருக்கிறது": "is; from இரு (iru), to be"
    confusables:
      w1: { why: "சிக்கல் (cikkal), problem; tangle, is a different word." }
      w2: { why: "தீர்வு (tīrvu), solution, is a different word." }
  "ta-9074":
    native: "I watch videos on the smartphone."
    bases:
      "திறன்பேசியில்": "in the smartphone; from திறன்பேசி (tiṟaṉpēci), smartphone"
      "பார்க்கிறேன்": "am watching; from பார் (pār), to see; to look"
    confusables:
      w1: { why: "டேப்லெட் (ṭēpleṭ), tablet, is a different word." }
      w2: { why: "தொடுதிரை (toṭutirai), touchscreen, is a different word." }
  "ta-9075":
    native: "Keep your privacy safe."
    bases:
      "உன்": "your; from நீ (nī), you (to a friend or child)"
      "தனியுரிமையைப்": "the privacy; from தனியுரிமை (taṉiyurimai), privacy"
      "பாதுகாப்பாக": "safely; from பாதுகாப்பு (pātukāppu), safety; protection"
    confusables:
      w1: { why: "மோசடி (mōcaṭi), fraud; scam, is a different word." }
      w2: { why: "ஹேக்கர் (hēkkar), hacker, is a different word." }
  "ta-9076":
    native: "I am sharing this photo."
    bases:
      "இந்தப்": "this; from இந்த (inta), this (before a noun)"
      "படத்தைப்": "the picture; from படம் (paṭam), picture; film"
      "பகிர்கிறேன்": "am sharing; from பகிர் (pakir), to share"
    confusables:
      w1: { why: "கருத்துரை (karutturai), comment (online), is a different word." }
      w2: { why: "வலைப்பதிவு (valaippativu), blog, is a different word." }
  "ta-9077":
    native: "My phone's memory is full."
    bases:
      "என்": "my; from நான் (nāṉ), I; me"
      "போனில்": "in the last; from போன (pōṉa), last; previous"
      "நிரம்பியிருக்கிறது": "is full; from நிரம்பு (nirampu), to fill up"
    confusables:
      w1: { why: "சேமிப்பகம் (cēmippakam), storage; drive, is a different word." }
      w2: { why: "கோப்புறை (kōppuṟai), folder, is a different word." }
  "ta-9078":
    native: "There is no network, restart it."
    confusables:
      w1: { why: "ஸ்கிரீன் (skirīṉ), screen (spoken), is a different word." }
      w2: { why: "தொடுதிரை (toṭutirai), touchscreen, is a different word." }
  "ta-9079":
    native: "I follow him online."
    bases:
      "அவரை": "him or her (polite; object); from அவர் (avar), he or she (polite)"
      "இணையத்தில்": "in the internet; from இணையம் (iṇaiyam), internet"
      "பின்தொடர்கிறேன்": "am following (a person or an account); from பின்தொடர் (piṉtoṭar), to follow (a person or an account)"
    confusables:
      w1: { why: "முடக்கு (muṭakku), to freeze; to block; to disable, is a different word." }
      w2: { why: "வடிவமை (vaṭivamai), to design, is a different word." }
