schema: 1
id: "ta-en-work"
kind: "layer"
core: "ta-work"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Work"
description: "Work, the office, salary, meetings, computers, money, teachers and doctors. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-0192":
    native: "work; job"
    notes:
      n1: "Work or a job: நான் வேலை செய்கிறேன் (nāṉ vēlai ceykiṟēṉ, I work)."
    examples:
      "நான் வேலை செய்கிறேன்.":
        native: "I work."
        bases:
          "வேலை": "work; job"
          "செய்கிறேன்": "I do; from செய் (cey), to do; to make"
      "இன்று வேலை இல்லை.":
        native: "There is no work today."
        bases:
          "வேலை": "work; job"
  "ta-0193":
    native: "office"
    notes:
      n1: "The place of work. Used with போ (pō, to go) for going to work."
    examples:
      "நான் அலுவலகம் போகிறேன்.":
        native: "I am going to the office."
        bases:
          "அலுவலகம்": "office"
          "போகிறேன்": "am going; from போ (pō), to go"
      "அலுவலகம் அருகில் இருக்கிறது.":
        native: "The office is near."
        bases:
          "அலுவலகம்": "office"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-0194":
    native: "salary; pay"
    notes:
      n1: "Money paid for work each month."
    examples:
      "சம்பளம் போதும்.":
        native: "The salary is enough."
        bases:
          "சம்பளம்": "salary; pay"
      "இது பெரிய சம்பளம்.":
        native: "This is a big salary."
        bases:
          "சம்பளம்": "salary; pay"
  "ta-0195":
    native: "meeting; crowd"
    notes:
      n1: "A meeting of people for work, or a crowd of people."
    examples:
      "இன்று கூட்டம் இருக்கிறது.":
        native: "There is a meeting today."
        bases:
          "கூட்டம்": "meeting; crowd"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "கூட்டம் நாளை.":
        native: "The meeting is tomorrow."
        bases:
          "கூட்டம்": "meeting; crowd"
  "ta-0196":
    native: "computer"
    notes:
      n1: "A computer. Buying one is வாங்கு (vāṅku, buy) with the thing bought."
    examples:
      "இது கணினி.":
        native: "This is a computer."
        bases:
          "கணினி": "computer"
      "நான் கணினி வாங்குகிறேன்.":
        native: "I am buying a computer."
        bases:
          "கணினி": "computer"
          "வாங்குகிறேன்": "am buying; from வாங்கு (vāṅku), to buy"
  "ta-0197":
    native: "money"
    notes:
      n1: "Money in general. A price is விலை (vilai)."
    examples:
      "பணம் இல்லை.":
        native: "There is no money."
        bases:
          "பணம்": "money"
      "பணம் வேண்டும்.":
        native: "Money is needed."
        bases:
          "பணம்": "money"
          "வேண்டும்": "is needed"
  "ta-0198":
    native: "teacher"
    notes:
      n1: "A teacher, said with respect for a man or a woman. Gender m is set for the word; see the review queue."
    examples:
      "அவர் ஆசிரியர்.":
        native: "He is a teacher."
        bases:
          "ஆசிரியர்": "teacher"
      "ஆசிரியர் வருகிறார்.":
        native: "The teacher is coming."
        bases:
          "ஆசிரியர்": "teacher"
          "வருகிறார்": "is coming; from வா (vā), come"
  "ta-0199":
    native: "doctor"
    notes:
      n1: "A doctor, said with respect."
    examples:
      "அவர் மருத்துவர்.":
        native: "He is a doctor."
        bases:
          "மருத்துவர்": "doctor"
      "மருத்துவர் அருகில் இருக்கிறார்.":
        native: "The doctor is near."
        bases:
          "மருத்துவர்": "doctor"
          "இருக்கிறார்": "is; from இரு (iru), to be"
  "ta-0200":
    native: "rest"
    notes:
      n1: "A rest from work, or a free day."
    examples:
      "இன்று ஓய்வு.":
        native: "Today is a rest day."
        bases:
          "ஓய்வு": "rest"
      "கொஞ்சம் ஓய்வு வேண்டும்.":
        native: "A little rest is needed."
        bases:
          "ஓய்வு": "rest"
          "வேண்டும்": "is needed"
  "ta-0201":
    native: "worker"
    notes:
      n1: "A person who works with the hands, a labourer or a worker."
    examples:
      "அவன் தொழிலாளி.":
        native: "He is a worker."
        bases:
          "தொழிலாளி": "worker"
      "தொழிலாளி வேலை செய்கிறான்.":
        native: "The worker is working."
        bases:
          "தொழிலாளி": "worker"
          "செய்கிறான்": "is doing; from செய் (cey), to do; to make"
