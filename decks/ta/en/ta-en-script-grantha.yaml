"cards":
  "ta-1025":
    "native": "ja (a Grantha letter)"
    "notes":
      "n1": "A Grantha letter, supplementary to the Tamil alphabet, for the 'j' sound of 'jar'. It starts ஜன்னல் (jaṉṉal, window)."
    "examples":
      "ஜன்னல்": "window"
  "ta-1026":
    "native": "ṣa (a Grantha letter)"
    "notes":
      "n1": "A Grantha letter, supplementary to the Tamil alphabet, for a retroflex 'sh' sound (ṣa). Grantha letters are taught from elementary school."
  "ta-1027":
    "native": "sa (a Grantha letter)"
    "notes":
      "n1": "A Grantha letter, supplementary to the Tamil alphabet, for the 's' sound."
  "ta-1028":
    "native": "ha (a Grantha letter)"
    "notes":
      "n1": "A Grantha letter, supplementary to the Tamil alphabet, for the 'h' sound."
  "ta-1029":
    "native": "ksha (two letters)"
    "notes":
      "n1": "Written as two letters: க் (k) with the pulli, then ஷ (ṣa), for the sound 'ksh'. It is the one Grantha sound written with two letters."
