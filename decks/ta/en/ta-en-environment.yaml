schema: 1
id: "ta-en-environment"
kind: "layer"
core: "ta-environment"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Environment: air, pollution, waste and care"
description: "The environment: pollution of air, water and sound, waste and recycling, climate and weather change, energy and nature, and the verbs of protecting, planting and cleaning. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-7497":
    native: "environment"
    notes:
      n1: "Literally the surrounding setting; சுற்று (cuṟṟu) (around) plus சூழல் (cūḻal) (setting), written as one word."
    examples:
      "சுற்றுச்சூழல் முக்கியம்.":
        native: "The environment is important."
        bases:
          "சுற்றுச்சூழல்": "environment"
          "முக்கியம்": "important"
      "நாம் சுற்றுச்சூழலைப் பாதுகாக்கிறோம்.":
        native: "We protect the environment."
        bases:
          "சுற்றுச்சூழலைப்": "the environment; from சுற்றுச்சூழல் (cuṟṟuccūḻal), environment"
          "பாதுகாக்கிறோம்": "are protecting (we); from பாதுகா (pātukā), to protect; to guard"
  "ta-7498":
    native: "pollution; dirt"
    notes:
      n1: "The general word for pollution; the kinds are named by putting a word before it, as in காற்றுமாசு (kāṟṟumācu)."
    examples:
      "காற்றில் மாசு அதிகம்.":
        native: "There is a lot of pollution in the air."
        bases:
          "காற்றில்": "in the air; from காற்று (kāṟṟu), wind; air"
          "மாசு": "pollution; dirt"
      "மாசு குறைகிறது.":
        native: "The pollution is decreasing."
        bases:
          "மாசு": "pollution; dirt"
          "குறைகிறது": "goes down; from குறை (kuṟai), to decrease; to lessen"
  "ta-7499":
    native: "air pollution"
    notes:
      n1: "காற்று (kāṟṟu) (air) plus மாசு (mācu) (pollution); written as one word."
    examples:
      "நகரத்தில் காற்றுமாசு அதிகம்.":
        native: "Air pollution is high in the city."
        bases:
          "நகரத்தில்": "in the city; from நகரம் (nakaram), city; town"
          "காற்றுமாசு": "air pollution"
      "காற்றுமாசு நோயை உண்டாக்குகிறது.":
        native: "Air pollution causes illness."
        bases:
          "காற்றுமாசு": "air pollution"
          "நோயை": "the illness; from நோய் (nōy), illness; disease"
          "உண்டாக்குகிறது": "causes; from உண்டாக்கு (uṇṭākku), to cause; to create"
  "ta-7500":
    native: "water pollution"
    notes:
      n1: "நீர் (nīr) (water) plus மாசு (mācu) (pollution); written as one word."
    examples:
      "ஆற்றில் நீர்மாசு.":
        native: "Water pollution in the river."
        bases:
          "ஆற்றில்": "in the six; from ஆறு (āṟu), six"
          "நீர்மாசு": "water pollution"
      "நீர்மாசு ஆபத்து.":
        native: "Water pollution is a danger."
        bases:
          "நீர்மாசு": "water pollution"
  "ta-7501":
    native: "noise pollution"
    notes:
      n1: "ஒலி (oli) (sound) plus மாசு (mācu) (pollution); written as one word."
    examples:
      "சாலையில் ஒலிமாசு அதிகம்.":
        native: "There is a lot of noise pollution on the road."
        bases:
          "சாலையில்": "on the road; from சாலை (cālai), road"
          "ஒலிமாசு": "noise pollution"
      "ஒலிமாசு தொந்தரவு.":
        native: "Noise pollution is a nuisance."
        bases:
          "ஒலிமாசு": "noise pollution"
  "ta-7502":
    native: "waste; discarded matter"
    notes:
      n1: "Waste that is thrown away; the word for household rubbish is குப்பை (kuppai)."
    examples:
      "கழிவு எங்கே போகிறது?":
        native: "Where does the waste go?"
        bases:
          "கழிவு": "waste; discarded matter"
          "போகிறது": "is going; from போ (pō), to go"
      "இது கழிவு.":
        native: "This is waste."
        bases:
          "கழிவு": "waste; discarded matter"
  "ta-7503":
    native: "recycling"
    notes:
      n1: "மறு (maṟu) (again) plus சுழற்சி (cuḻaṟci) (going round); you do (செய் (cey)) recycling."
    examples:
      "மறுசுழற்சி நல்லது.":
        native: "Recycling is good."
        bases:
          "மறுசுழற்சி": "recycling"
      "காகிதம் மறுசுழற்சி செய்கிறோம்.":
        native: "We recycle paper."
        bases:
          "மறுசுழற்சி": "recycling"
          "செய்கிறோம்": "are doing (we); from செய் (cey), to do; to make"
  "ta-7504":
    native: "plastic"
    notes:
      n1: "The Tamil word for plastic, used in notices; in speech people say பிளாஸ்டிக் (piḷāsṭik)."
    examples:
      "நெகிழி ஆபத்து.":
        native: "Plastic is a danger."
        bases:
          "நெகிழி": "plastic"
      "நெகிழி பை வேண்டாம்.":
        native: "No plastic bag, please."
        bases:
          "நெகிழி": "plastic"
  "ta-7505":
    native: "plastic (spoken)"
    notes:
      n1: "The everyday spoken word, from English; the written word is நெகிழி (nekiḻi)."
    examples:
      "பிளாஸ்டிக் குறை.":
        native: "Use less plastic."
        bases:
          "பிளாஸ்டிக்": "plastic (spoken)"
      "இது பிளாஸ்டிக் பை.":
        native: "This is a plastic bag."
        bases:
          "பிளாஸ்டிக்": "plastic (spoken)"
  "ta-7506":
    native: "greenery; green"
    notes:
      n1: "The green of plants and a name for environment-friendly things, as in பசுமை (pacumai) energy."
    examples:
      "இங்கே பசுமை இருக்கிறது.":
        native: "There is greenery here."
        bases:
          "பசுமை": "greenery; green"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "பசுமை நல்லது.":
        native: "Greenery is good."
        bases:
          "பசுமை": "greenery; green"
  "ta-7507":
    native: "earth; the planet"
    notes:
      n1: "A written word for the planet; in speech people say பூமி (pūmi), which is already in the course."
    examples:
      "புவி நம் வீடு.":
        native: "The earth is our home."
        bases:
          "புவி": "earth; the planet"
          "நம்": "our; from நாம் (nām), we (including you)"
      "புவி வெப்பம் அடைகிறது.":
        native: "The earth is warming."
        bases:
          "புவி": "earth; the planet"
          "அடைகிறது": "is reaching; from அடை (aṭai), to reach; to arrive at"
  "ta-7508":
    native: "warming"
    notes:
      n1: "வெப்பம் (veppam) (heat) plus -மயம் (-mayam), 'made of', and ஆதல் (ātal) (becoming); one written word."
    examples:
      "உலக வெப்பமயமாதல் ஆபத்து.":
        native: "Global warming is a danger."
        bases:
          "உலக": "world (before a noun); from உலகம் (ulakam), world"
          "வெப்பமயமாதல்": "warming"
      "வெப்பமயமாதல் அதிகரிக்கிறது.":
        native: "Warming is increasing."
        bases:
          "வெப்பமயமாதல்": "warming"
          "அதிகரிக்கிறது": "is increasing; from அதிகரி (atikari), to increase"
  "ta-7509":
    native: "climate change"
    notes:
      n1: "காலநிலை (kālanilai) (climate) plus மாற்றம் (māṟṟam) (change); written as one word."
    examples:
      "காலநிலைமாற்றம் வருகிறது.":
        native: "Climate change is coming."
        bases:
          "காலநிலைமாற்றம்": "climate change"
          "வருகிறது": "is coming; from வா (vā), come"
      "காலநிலைமாற்றம் பற்றிப் பேசுகிறார்கள்.":
        native: "They are talking about climate change."
        bases:
          "காலநிலைமாற்றம்": "climate change"
          "பற்றிப்": "about; from பற்றி (paṟṟi), None"
          "பேசுகிறார்கள்": "speak; from பேசு (pēcu), to speak"
  "ta-7510":
    native: "rainwater"
    notes:
      n1: "மழை (maḻai) (rain) plus நீர் (nīr) (water); written as one word."
    examples:
      "மழைநீர் சேமிக்கிறோம்.":
        native: "We store rainwater."
        bases:
          "மழைநீர்": "rainwater"
          "சேமிக்கிறோம்": "are saving (we); from சேமி (cēmi), to save"
      "மழைநீர் தூய்மையானது.":
        native: "Rainwater is clean."
        bases:
          "மழைநீர்": "rainwater"
          "தூய்மையானது": "is clean; from தூய்மையான (tūymaiyāṉa), clean; pure"
  "ta-7511":
    native: "drought"
    notes:
      n1: "A long dry spell; it is the opposite of வெள்ளம் (veḷḷam) (flood)."
    examples:
      "இங்கே வறட்சி.":
        native: "There is drought here."
        bases:
          "வறட்சி": "drought"
      "வறட்சி பயிரை அழிக்கிறது.":
        native: "Drought destroys the crop."
        bases:
          "வறட்சி": "drought"
          "பயிரை": "the crop; from பயிர் (payir), crop"
          "அழிக்கிறது": "destroys; from அழி (aḻi), to be destroyed; to destroy"
  "ta-7512":
    native: "groundwater"
    notes:
      n1: "நிலம் (nilam) (ground) plus அடி (aṭi) (under) plus நீர் (nīr) (water); written as one word."
    examples:
      "நிலத்தடிநீர் குறைகிறது.":
        native: "Groundwater is going down."
        bases:
          "நிலத்தடிநீர்": "groundwater"
          "குறைகிறது": "goes down; from குறை (kuṟai), to decrease; to lessen"
      "நிலத்தடிநீர் முக்கியம்.":
        native: "Groundwater is important."
        bases:
          "நிலத்தடிநீர்": "groundwater"
          "முக்கியம்": "important"
  "ta-7513":
    native: "wildlife; wild animal"
    notes:
      n1: "வனம் (vaṉam) (forest) plus விலங்கு (vilaṅku) (animal); written as one word."
    examples:
      "வனவிலங்கு காட்டில் இருக்கிறது.":
        native: "Wild animals are in the forest."
        bases:
          "வனவிலங்கு": "wildlife; wild animal"
          "காட்டில்": "in the forest; from காடு (kāṭu), forest"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "வனவிலங்கு பாதுகாப்பு முக்கியம்.":
        native: "Protecting wildlife is important."
        bases:
          "வனவிலங்கு": "wildlife; wild animal"
          "பாதுகாப்பு": "safety; security; protection"
          "முக்கியம்": "important"
  "ta-7514":
    native: "destruction; ruin"
    notes:
      n1: "The noun of அழி (aḻi) (to be destroyed)."
    examples:
      "காடு அழிவு.":
        native: "The forest is destroyed."
        bases:
          "அழிவு": "destruction; ruin"
      "அழிவு வேண்டாம்.":
        native: "No destruction, please."
        bases:
          "அழிவு": "destruction; ruin"
  "ta-7515":
    native: "sunlight"
    notes:
      n1: "சூரியன் (cūriyaṉ) (sun) plus ஒளி (oḷi) (light); the first word becomes சூரிய (cūriya) before it."
    examples:
      "சூரியஒளி நல்லது.":
        native: "Sunlight is good."
        bases:
          "சூரியஒளி": "sunlight"
      "அறையில் சூரியஒளி வருகிறது.":
        native: "Sunlight comes into the room."
        bases:
          "அறையில்": "in the room; from அறை (aṟai), room"
          "சூரியஒளி": "sunlight"
          "வருகிறது": "is coming; from வா (vā), come"
  "ta-7516":
    native: "solar energy"
    notes:
      n1: "சூரியன் (cūriyaṉ) (sun) plus சக்தி (cakti) (energy); the first word becomes சூரிய (cūriya) before it."
    examples:
      "சூரியசக்தி இலவசம்.":
        native: "Solar energy is free."
        bases:
          "சூரியசக்தி": "solar energy"
      "வீட்டில் சூரியசக்தி இருக்கிறது.":
        native: "The house has solar power."
        bases:
          "சூரியசக்தி": "solar energy"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7517":
    native: "windmill; wind turbine"
    notes:
      n1: "காற்று (kāṟṟu) (wind) plus ஆலை (ālai) (mill); written as one word."
    examples:
      "காற்றாலை சுழல்கிறது.":
        native: "The windmill is turning."
        bases:
          "காற்றாலை": "windmill; wind turbine"
          "சுழல்கிறது": "is turning; from சுழல் (cuḻal), to spin; to turn"
      "காற்றாலை மின்சாரம் தருகிறது.":
        native: "The windmill gives electricity."
        bases:
          "காற்றாலை": "windmill; wind turbine"
          "தருகிறது": "gives; from தா (tā), to give"
  "ta-7518":
    native: "fuel energy; energy"
    notes:
      n1: "எரி (eri) (burn) plus சக்தி (cakti) (energy); used for fuel and energy."
    examples:
      "எரிசக்தி விலை அதிகம்.":
        native: "The energy cost is high."
        bases:
          "எரிசக்தி": "fuel energy; energy"
      "எரிசக்தி சேமிக்க வேண்டும்.":
        native: "Energy must be saved."
        bases:
          "எரிசக்தி": "fuel energy; energy"
          "சேமிக்க": "to save; from சேமி (cēmi), to save"
  "ta-7519":
    native: "energy; power; strength"
    notes:
      n1: "Bodily energy and the energy of nature; the word is also a girl's name."
    examples:
      "எனக்குச் சக்தி இல்லை.":
        native: "I have no energy."
        bases:
          "எனக்குச்": "to me; for me; from நான் (nāṉ), I; me"
          "சக்தி": "energy; power; strength"
      "சக்தி வேண்டும்.":
        native: "Energy is needed."
        bases:
          "சக்தி": "energy; power; strength"
  "ta-7520":
    native: "coal"
    notes:
      n1: "நிலம் (nilam) (earth) plus கரி (kari) (charcoal); coal from the ground."
    examples:
      "நிலக்கரி கருப்பு.":
        native: "Coal is black."
        bases:
          "நிலக்கரி": "coal"
      "நிலக்கரி எரிகிறது.":
        native: "The coal is burning."
        bases:
          "நிலக்கரி": "coal"
          "எரிகிறது": "is burning; from எரி (eri), to burn"
  "ta-7521":
    native: "cleanliness; purity"
    notes:
      n1: "A written word for purity and public cleanliness; சுத்தம் (cuttam) is the everyday word."
    examples:
      "தூய்மை முக்கியம்.":
        native: "Cleanliness is important."
        bases:
          "தூய்மை": "cleanliness; purity"
          "முக்கியம்": "important"
      "இங்கே தூய்மை இருக்கிறது.":
        native: "There is cleanliness here."
        bases:
          "தூய்மை": "cleanliness; purity"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7522":
    native: "dirt; impurity"
    notes:
      n1: "சுத்தம் (cuttam) (clean) with a negative prefix added; the opposite of தூய்மை (tūymai)."
    examples:
      "இங்கே அசுத்தம் அதிகம்.":
        native: "There is a lot of dirt here."
        bases:
          "அசுத்தம்": "dirt; impurity"
      "அசுத்தம் வேண்டாம்.":
        native: "No dirt, please."
        bases:
          "அசுத்தம்": "dirt; impurity"
  "ta-7523":
    native: "poison; toxin"
    notes:
      n1: "Poison and toxic matter; as a describing word it also means toxic."
    examples:
      "இது நச்சு.":
        native: "This is poison."
        bases:
          "நச்சு": "poison; toxin"
      "நச்சு ஆபத்து.":
        native: "Poison is a danger."
        bases:
          "நச்சு": "poison; toxin"
  "ta-7524":
    native: "natural resource"
    notes:
      n1: "இயற்கை (iyaṟkai) (nature) plus வளம் (vaḷam) (wealth); written as one word."
    examples:
      "இயற்கைவளம் முக்கியம்.":
        native: "Natural resources are important."
        bases:
          "இயற்கைவளம்": "natural resource"
          "முக்கியம்": "important"
      "இயற்கைவளம் குறைகிறது.":
        native: "Natural resources are decreasing."
        bases:
          "இயற்கைவளம்": "natural resource"
          "குறைகிறது": "goes down; from குறை (kuṟai), to decrease; to lessen"
  "ta-7525":
    native: "wealth; richness; fertility"
    notes:
      n1: "Used for wealth, fertile soil and plenty."
    examples:
      "இந்த நிலத்தில் வளம் இருக்கிறது.":
        native: "This land is fertile."
        bases:
          "இந்த": "this"
