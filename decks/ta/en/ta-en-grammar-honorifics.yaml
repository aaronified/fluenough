  notes: "Tamil marks respect in the verb. To a friend or a child say வா (vā) and the present with the plain you, நீ (nī); to anyone older or unknown, use the polite you, நீங்கள் (nīṅkaḷ), with வாங்க (vāṅka) in speech and வாருங்கள் (vāruṅkaḷ) in writing. About a third person, அவன் (avaṉ), he, is plain, while அவர் (avar), he or she with respect, takes -ஆர் (-ār) on the verb: வருகிறார் (varukiṟār). Use the respectful form for teachers, parents, elders and strangers. தாங்கள் (tāṅkaḷ) is a very formal you, and some verbs have a respectful word of their own, as the registers unit shows: சாப்பிடு (cāppiṭu) and உண் (uṇ). Source: English Wikipedia, Tamil grammar (the verb endings for respected persons)."
