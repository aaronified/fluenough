native: { code: "en", iso639_3: "eng", name: "English" }
name: "Story actions"
description: "Verbs for telling a story: starting, hiding, moving, fighting, falling and escaping, feelings in the body, and deciding and discussing. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-8440":
    native: "to begin; to start"
    notes:
      n1: "A common verb for to start; தொடங்கு (toṭaṅku), to begin, taught earlier, means the same."
    examples:
      "வேலையை ஆரம்பி.":
        native: "Start the work."
        bases:
          "வேலையை": "the work (object); from வேலை (vēlai), work"
          "ஆரம்பி": "to begin; to start"
      "படம் ஆரம்பிக்கிறது.":
        native: "The film starts."
        bases:
          "ஆரம்பிக்கிறது": "present, it; from ஆரம்பி (ārampi), to begin"
  "ta-8441":
    native: "to hide (oneself)"
    notes:
      n1: "The learner hides himself; ஒளி (oḷi), to hide plus கொள் (koḷ), to take for oneself."
    examples:
      "இங்கே ஒளிந்துகொள்.":
        native: "Hide here."
        bases:
          "ஒளிந்துகொள்": "to hide (oneself)"
      "குழந்தை மேசைக்குக் கீழே ஒளிந்துகொள்கிறது.":
        native: "The child hides under the table."
        bases:
          "மேசைக்குக்": "to the table; from மேசை (mēcai), table"
          "ஒளிந்துகொள்கிறது": "present, it; from ஒளிந்துகொள் (oḷintukoḷ), to hide (oneself)"
  "ta-8442":
    native: "to move aside; to move away"
    notes:
      n1: "To step out of the way; also to quit."
    examples:
      "வழியிலிருந்து விலகு.":
        native: "Move out of the way."
        bases:
          "வழியிலிருந்து": "from the way; from வழி (vaḻi), way"
          "விலகு": "to move aside; to move away"
      "அவன் விலகுகிறான்.":
        native: "He moves away."
        bases:
          "விலகுகிறான்": "present, he; from விலகு (vilaku), to move aside"
  "ta-8443":
    native: "to come near; to approach"
    notes:
      n1: "To get close to a place or a time."
    examples:
      "கொஞ்சம் நெருங்கு.":
        native: "Come a little closer."
        bases:
          "நெருங்கு": "to come near; to approach"
      "பேருந்து நெருங்குகிறது.":
        native: "The bus is coming near."
        bases:
          "நெருங்குகிறது": "present, it; from நெருங்கு (neruṅku), to come near"
  "ta-8444":
    native: "to bring"
    notes:
      n1: "Built from கொண்டு (koṇṭu), having taken and வா (vā), to come; the present is கொண்டுவருகிறான் (koṇṭuvarukiṟāṉ), he brings."
    examples:
      "தண்ணீர் கொண்டுவா.":
        native: "Bring water."
        bases:
          "கொண்டுவா": "to bring"
      "அவன் புத்தகம் கொண்டுவருகிறான்.":
        native: "He brings a book."
        bases:
          "கொண்டுவருகிறான்": "present, he; from கொண்டுவா (koṇṭuvā), to bring"
  "ta-8445":
    native: "to take along; to carry away"
    notes:
      n1: "Built from கொண்டு (koṇṭu), having taken and போ (pō), to go."
    examples:
      "இதைக் கொண்டுபோ.":
        native: "Take this along."
        bases:
          "இதைக்": "this; from இது (itu), this"
          "கொண்டுபோ": "to take along; to carry away"
      "அவள் பையைக் கொண்டுபோகிறாள்.":
        native: "She takes the bag along."
        bases:
          "பையைக்": "the bag (object); from பை (pai), bag"
          "கொண்டுபோகிறாள்": "present, she; from கொண்டுபோ (koṇṭupō), to take along"
  "ta-8446":
    native: "to dig"
    notes:
      n1: "To dig the ground or a well."
    examples:
      "நிலத்தைத் தோண்டு.":
        native: "Dig the ground."
        bases:
          "நிலத்தைத்": "the ground (object); from நிலம் (nilam), land; ground"
          "தோண்டு": "to dig"
      "அவன் நிலத்தைத் தோண்டுகிறான்.":
        native: "He digs the ground."
        bases:
          "நிலத்தைத்": "the ground (object); from நிலம் (nilam), land; ground"
          "தோண்டுகிறான்": "present, he; from தோண்டு (tōṇṭu), to dig"
  "ta-8447":
    native: "to bury; to be buried"
    notes:
      n1: "To put something into the ground."
    examples:
      "விதையைப் புதை.":
        native: "Bury the seed."
        bases:
          "விதையைப்": "the seed (object); from விதை (vitai), seed"
          "புதை": "to bury; to be buried"
      "அவன் விதையை மண்ணில் புதைக்கிறான்.":
        native: "He buries the seed in the soil."
        bases:
          "விதையை": "the seed (object); from விதை (vitai), seed"
          "மண்ணில்": "in the soil; from மண் (maṇ), soil"
          "புதைக்கிறான்": "present, he; from புதை (putai), to bury"
  "ta-8448":
    native: "to crow; to call (of a bird)"
    notes:
      n1: "Used for a rooster's crow and a cuckoo's call."
    examples:
      "காலையில் சேவல் கூவுகிறது.":
        native: "The rooster crows in the morning."
        bases:
          "காலையில்": "in the morning; from காலை (kālai), morning"
          "சேவல்": "rooster"
          "கூவுகிறது": "present, it; from கூவு (kūvu), to crow"
      "குயில் கூவுகிறது.":
        native: "The cuckoo calls."
        bases:
          "குயில்": "cuckoo"
          "கூவுகிறது": "present, it; from கூவு (kūvu), to crow"
  "ta-8449":
    native: "to mutter; to grumble"
    notes:
      n1: "An echo word: the sound itself names the act."
    examples:
      "அவன் முணுமுணுக்கிறான்.":
        native: "He mutters."
        bases:
          "முணுமுணுக்கிறான்": "present, he; from முணுமுணு (muṇumuṇu), to mutter"
      "முணுமுணுக்காதே.":
        native: "Do not mutter."
        bases:
          "முணுமுணுக்காதே": "do not (command); from முணுமுணு (muṇumuṇu), to mutter"
  "ta-8450":
    native: "to describe; to narrate"
    notes:
      n1: "To tell a thing in detail."
    examples:
      "கதையை விவரி.":
        native: "Narrate the story."
        bases:
          "கதையை": "the story (object); from கதை (katai), story"
          "விவரி": "to describe; to narrate"
      "அவர் காட்சியை விவரிக்கிறார்.":
        native: "He describes the scene."
        bases:
          "காட்சியை": "the scene (object); from காட்சி (kāṭci), scene"
          "விவரிக்கிறார்": "present, he or she (polite); from விவரி (vivari), to describe"
  "ta-8451":
    native: "to describe in rich words"
    notes:
      n1: "A literary verb for painting a picture in words."
    examples:
      "அந்த இடத்தை வருணி.":
        native: "Describe that place."
        bases:
          "அந்த": "that"
          "இடத்தை": "the place (object); from இடம் (iṭam), place"
          "வருணி": "to describe in rich words"
      "கவிஞர் இயற்கையை வருணிக்கிறார்.":
        native: "The poet describes nature."
        bases:
          "இயற்கையை": "nature (object); from இயற்கை (iyaṟkai), nature"
          "வருணிக்கிறார்": "present, he or she (polite); from வருணி (varuṇi), to describe in rich words"
  "ta-8452":
    native: "to happen; to take place"
    notes:
      n1: "A written verb; in speech people say நடக்கிறது (naṭakkiṟatu), it happens."
    examples:
      "இங்கே என்ன நிகழ்கிறது?":
        native: "What is happening here?"
        bases:
          "நிகழ்கிறது": "present, it; from நிகழ் (nikaḻ), to happen"
      "இது அடிக்கடி நிகழ்கிறது.":
        native: "This happens often."
        bases:
          "அடிக்கடி": "often"
          "நிகழ்கிறது": "present, it; from நிகழ் (nikaḻ), to happen"
  "ta-8453":
    native: "to die"
    notes:
      n1: "A formal verb; the everyday verb is சா (cā), to die."
    examples:
      "செடி இறக்கிறது.":
        native: "The plant dies."
        bases:
          "இறக்கிறது": "present, it; from இற (iṟa), to die"
      "மன்னர் இறக்கிறார்.":
        native: "The king dies."
        bases:
          "மன்னர்": "king; monarch"
          "இறக்கிறார்": "present, he or she (polite); from இற (iṟa), to die"
  "ta-8454":
    native: "to be born"
    notes:
      n1: "The noun பிறப்பு (piṟappu), birth comes from it; the person born is the subject."
    examples:
      "குழந்தை பிறக்கிறது.":
        native: "The child is born."
        bases:
          "பிறக்கிறது": "present, it; from பிற (piṟa), to be born"
      "நான் இந்த ஊரில் பிறந்தேன்.":
        native: "I was born in this town."
        bases:
          "இந்த": "this (before a noun)"
          "ஊரில்": "in the town; from ஊர் (ūr), town"
          "பிறந்தேன்": "I was born; from பிற (piṟa), to be born"
  "ta-8455":
    native: "to lose"
    notes:
      n1: "To lose a thing, a person or a chance; தொலை (tolai), to lose, taught earlier, is for a thing misplaced."
    examples:
      "பணத்தை இழக்காதே.":
        native: "Do not lose money."
        bases:
          "பணத்தை": "the money (object); from பணம் (paṇam), money"
          "இழக்காதே": "do not (command); from இழ (iḻa), to lose"
      "அவன் வேலையை இழக்கிறான்.":
        native: "He loses his job."
        bases:
          "வேலையை": "the work (object); from வேலை (vēlai), work"
          "இழக்கிறான்": "present, he; from இழ (iḻa), to lose"
  "ta-8456":
    native: "to find out; to detect"
    notes:
      n1: "Built from கண்டு (kaṇṭu), having seen and அறி (aṟi), to know."
    examples:
      "காரணத்தைக் கண்டறி.":
        native: "Find out the reason."
        bases:
          "காரணத்தைக்": "the reason (object); from காரணம் (kāraṇam), reason"
          "கண்டறி": "to find out; to detect"
      "மருத்துவர் நோயைக் கண்டறிகிறார்.":
        native: "The doctor diagnoses the illness."
        bases:
          "நோயைக்": "the illness; from நோய் (nōy), illness; disease"
          "கண்டறிகிறார்": "present, he or she (polite); from கண்டறி (kaṇṭaṟi), to find out"
  "ta-8457":
    native: "to forget"
    notes:
      n1: "Built from மறந்து (maṟantu), having forgotten and போ (pō), to go; the forgotten thing is the object."
    examples:
      "மறந்துபோகாதே.":
        native: "Do not forget."
        bases:
          "மறந்துபோகாதே": "do not (command); from மறந்துபோ (maṟantupō), to forget"
      "நான் சாவியை மறந்துபோகிறேன்.":
        native: "I forget the key."
        bases:
          "சாவியை": "the key; from சாவி (cāvi), key"
          "மறந்துபோகிறேன்": "present, I; from மறந்துபோ (maṟantupō), to forget"
  "ta-8458":
    native: "to suspect; to doubt"
    notes:
      n1: "To doubt a person or a fact."
    examples:
      "அவனைச் சந்தேகிக்காதே.":
        native: "Do not suspect him."
        bases:
          "அவனைச்": "him (object); from அவன் (avaṉ), he"
          "சந்தேகிக்காதே": "do not (command); from சந்தேகி (cantēki), to suspect"
      "போலீஸ் அவனைச் சந்தேகிக்கிறது.":
        native: "The police suspect him."
        bases:
          "அவனைச்": "him (object); from அவன் (avaṉ), he"
          "சந்தேகிக்கிறது": "present, it; from சந்தேகி (cantēki), to suspect"
  "ta-8459":
    native: "to roll"
    notes:
      n1: "A round thing rolls on its own."
    examples:
      "பந்து உருள்கிறது.":
        native: "The ball rolls."
        bases:
          "உருள்கிறது": "present, it; from உருள் (uruḷ), to roll"
      "கல் உருள்கிறது.":
        native: "The stone rolls."
        bases:
          "உருள்கிறது": "present, it; from உருள் (uruḷ), to roll"
  "ta-8460":
    native: "to slip; to slide"
    notes:
      n1: "To slip on a wet floor."
    examples:
      "மழையில் சறுக்காதே.":
        native: "Do not slip in the rain."
        bases:
          "மழையில்": "in the rain; from மழை (maḻai), rain"
          "சறுக்காதே": "do not (command); from சறுக்கு (caṟukku), to slip"
      "கால் சறுக்குகிறது.":
        native: "The foot slips."
        bases:
          "சறுக்குகிறது": "present, it; from சறுக்கு (caṟukku), to slip"
  "ta-8461":
    native: "to stumble; to falter"
    notes:
      n1: "To lose your footing or your words."
    examples:
      "இருட்டில் தடுமாறாதே.":
        native: "Do not stumble in the dark."
        bases:
          "இருட்டில்": "in the dark; from இருட்டு (iruṭṭu), darkness"
          "தடுமாறாதே": "do not (command); from தடுமாறு (taṭumāṟu), to stumble"
      "அவன் தடுமாறுகிறான்.":
        native: "He stumbles."
        bases:
          "தடுமாறுகிறான்": "present, he; from தடுமாறு (taṭumāṟu), to stumble"
  "ta-8462":
    native: "to straighten up; to stand erect"
    notes:
      n1: "To raise your back or head."
    examples:
      "நிமிர்.":
        native: "Straighten up."
        bases:
          "நிமிர்": "to straighten up; to stand erect"
      "அவன் நிமிர்கிறான்.":
        native: "He straightens up."
        bases:
          "நிமிர்கிறான்": "present, he; from நிமிர் (nimir), to straighten up"
  "ta-8463":
    native: "to hiss; to snarl"
    notes:
      n1: "A snake hisses and a cat snarls."
    examples:
      "பாம்பு சீறுகிறது.":
        native: "The snake hisses."
        bases:
          "சீறுகிறது": "present, it; from சீறு (cīṟu), to hiss"
      "பூனை சீறுகிறது.":
        native: "The cat snarls."
        bases:
          "சீறுகிறது": "present, it; from சீறு (cīṟu), to hiss"
  "ta-8464":
    native: "to subside; to ease"
    notes:
      n1: "Said of anger, pain or heat."
    examples:
      "கோபம் தணிகிறது.":
        native: "Anger subsides."
        bases:
          "தணிகிறது": "present, it; from தணி (taṇi), to subside"
      "வலி தணிகிறது.":
        native: "The pain eases."
        bases:
          "தணிகிறது": "present, it; from தணி (taṇi), to subside"
  "ta-8465":
    native: "to beg; to plead"
    notes:
      n1: "To ask humbly again and again."
    examples:
      "கெஞ்சாதே.":
        native: "Do not beg."
        bases:
          "கெஞ்சாதே": "do not (command); from கெஞ்சு (keñcu), to beg"
      "அவன் கெஞ்சுகிறான்.":
        native: "He begs."
        bases:
          "கெஞ்சுகிறான்": "present, he; from கெஞ்சு (keñcu), to beg"
  "ta-8466":
    native: "to threaten"
    notes:
      n1: "To frighten with words."
    examples:
      "என்னை மிரட்டாதே.":
        native: "Do not threaten me."
        bases:
          "என்னை": "me (object); from நான் (nāṉ), I; me"
          "மிரட்டாதே": "do not (command); from மிரட்டு (miraṭṭu), to threaten"
      "திருடன் மிரட்டுகிறான்.":
        native: "The thief threatens."
        bases:
          "மிரட்டுகிறான்": "present, he; from மிரட்டு (miraṭṭu), to threaten"
  "ta-8467":
    native: "to take revenge"
    notes:
      n1: "Built from பழி (paḻi), blame and வாங்கு (vāṅku), to take."
    examples:
      "பழிவாங்காதே.":
        native: "Do not take revenge."
        bases:
          "பழிவாங்காதே": "do not (command); from பழிவாங்கு (paḻivāṅku), to take revenge"
      "அவன் பழிவாங்குகிறான்.":
        native: "He takes revenge."
        bases:
          "பழிவாங்குகிறான்": "present, he; from பழிவாங்கு (paḻivāṅku), to take revenge"
  "ta-8468":
    native: "to struggle; to fight"
    notes:
      n1: "To struggle for a cause."
    examples:
      "உரிமைக்காகப் போராடு.":
        native: "Struggle for your right."
        bases:
