# Layer for ta-culture-3: each passage's English rendering and a note on it.
schema: 1
id: "ta-en-culture-3"
kind: "layer"
core: "ta-culture-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: didactic verse and the first novel"
description: "Eighteen short passages: sayings of Avvaiyar from the Aathichudi, the Mutharai, the Konrai Vendan and the Nalvazhi, three lines of the Nanneri, and three sentences from the first chapter of Prathapa Mudaliar Charithram, each with its English rendering and a note. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-6100":
    native: "Desire to do good."
    notes:
      "n1": "The first saying of the Aathichudi, a list of short sayings that follow the order of the Tamil letters, each in the command form. The ending of the last word is the plain command 'desire!'; the verb before it is the infinitive 'to do'."
    bases:
      "அறம்": { meaning: "virtue, charity, duty" }
      "செய": { meaning: "to do; here 'to do'" }
      "விரும்பு": { meaning: "to desire, to love; here the command 'desire!'" }
  "ta-6101":
    native: "Never forget a kindness."
    notes:
      "n1": "A saying of the Aathichudi. The ending of the second word is the old way of forbidding, 'do not forget'; the everyday spoken Tamil of today uses another ending for the same command."
    bases:
      "நன்றி": { meaning: "gratitude, a kindness done; also 'thank you'" }
      "மறவேல்": { meaning: "to forget; here the old 'do not forget'" }
  "ta-6102":
    native: "Learn in your youth."
    notes:
      "n1": "A saying of the Aathichudi that is still often quoted. The first word ends in the ending for 'in', and the second word is the bare command 'learn'."
    bases:
      "இளமையில்": { meaning: "youth; here 'in youth'" }
      "கல்": { meaning: "to learn; here the command 'learn!'" }
  "ta-6103":
    native: "When you have done a good deed to someone, do not wonder when that deed will repay you."
    notes:
      "n1": "The first lines of the second Mutharai verse, which goes on to say that a coconut palm returns the water it drinks through its crown. The last word is the old 'do not', and the word for 'when' here starts a question about when it will be repaid."
    bases:
      "நன்றி": { meaning: "a good deed, goodness" }
      "ஒருவற்குச்": { meaning: "one person; here 'to a person'" }
      "செய்தக்கால்": { meaning: "to do; here 'when one has done'" }
      "அந்நன்றி": { meaning: "good; here 'that good deed'" }
      "என்று": { meaning: "when, on what day" }
      "தருங்கொல்": { meaning: "to give; here 'will it give back, I wonder'" }
      "எனவேண்டா": { meaning: "not wanted; here 'do not think so'" }
  "ta-6104":
    native: "A kindness done to a good person will be seen like writing on stone."
    notes:
      "n1": "The first lines of the third Mutharai verse. The next lines say that a kindness to the hard-hearted is like writing on water. The last word ends in a vowel that adds emphasis."
    bases:
      "நல்லார்": { meaning: "good people" }
      "ஒருவர்க்குச்": { meaning: "one person, respectfully; here 'to a person'" }
      "செய்த": { meaning: "to do; here 'that was done'" }
      "உபகாரம்": { meaning: "help, a kindness" }
      "கல்மேல்": { meaning: "stone; here 'on stone'" }
      "எழுத்துப்போல்": { meaning: "writing, letters; joined to 'like'" }
      "காணுமே": { meaning: "to be seen; here 'it will be seen', with emphasis" }
  "ta-6105":
    native: "The water poured out for the rice runs along the channel and seeps to the grass there as well."
    notes:
      "n1": "The first lines of the eleventh Mutharai verse, which goes on to say that for the sake of one good person the rain falls for everyone. 'The water poured out for the rice' is one joined word. The word for 'channel' and the verb 'runs along the way' are joined."
    bases:
      "நெல்லுக்": { meaning: "paddy, rice; here 'for the rice'" }
      "கிறைத்தநீர்": { meaning: "to draw out, to pour; here 'the water that was poured'" }
      "வாய்க்கால்": { meaning: "irrigation channel" }
      "வழியோடிப்": { meaning: "way, path; joined to 'having run'" }
      "புல்லுக்கும்": { meaning: "grass; here 'for the grass too'" }
      "ஆங்கே": { meaning: "there, in that place" }
      "பொசியுமாம்": { meaning: "to seep, to ooze; here 'it is said it seeps'" }
  "ta-6106":
    native: "Mother and father are the gods you know first."
    notes:
      "n1": "The first saying of the Konrai Vendan, whose lines follow the order of the Tamil letters. The word for 'father' is of Sanskrit origin."
    bases:
      "அன்னையும்": { meaning: "mother; with 'and'" }
      "பிதாவும்": { meaning: "father, a Sanskrit loan; with 'and'" }
      "முன்": { meaning: "before, first" }
      "அறி": { meaning: "to know; here 'know' as a command" }
      "தெய்வம்": { meaning: "god, deity" }
  "ta-6107":
    native: "If you quarrel with the village, you perish with your roots."
    notes:
      "n1": "A saying of the Konrai Vendan, in which the village and the roots rhyme in sound. The ending of the second word is 'if' and the whole saying has the shape 'if you do this, that will happen'."
    bases:
      "ஊருடன்": { meaning: "village, town, community; here 'with the village'" }
      "பகைக்கின்": { meaning: "enmity; here 'if one is hostile'" }
      "வேருடன்": { meaning: "root; here 'together with the root'" }
      "கெடும்": { meaning: "to be ruined, to perish; here 'will perish'" }
  "ta-6108":
    native: "Numbers and letters are rightly called the eyes."
    notes:
      "n1": "A saying of the Konrai Vendan. The word for 'number' and the word for 'letter' each take the 'and' ending, and 'eyes' is said once for both."
    bases:
      "எண்ணும்": { meaning: "number; with 'and'" }
      "எழுத்தும்": { meaning: "letter, writing; with 'and'" }
      "கண்": { meaning: "eye" }
      "எனத்": { meaning: "as, so called" }
      "தகும்": { meaning: "to be fitting; here 'it is fitting'" }
  "ta-6109":
    native: "I was born in a town named Sathyapuri, in the clan of the Mudaliars of Tondaimandalam."
    notes:
      "n1": "The end of the first sentence of Prathapa Mudaliar Charithram, which the English Wikipedia calls the first modern Tamil novel. The ending 'in' is written in a way that is common in speech, and the old word for 'Mudaliars' is the plural of a community title."
    bases:
      "சத்தியபுரி": { meaning: "Sathyapuri, the name of the town" }
      "என்னும்": { meaning: "to say; here 'called'" }
      "ஊரிலே": { meaning: "town; here 'in the town', in a spoken-style ending" }
      "தொண்டைமண்டல": { meaning: "Tondaimandalam, the old region around Kanchipuram" }
      "முதலிமார்": { meaning: "Mudali, a title of a community; here the plural 'the Mudalis'" }
      "குலத்திலே": { meaning: "clan, family line; here 'in the clan', in a spoken-style ending" }
      "நான்": { meaning: "I" }
      "பிறந்தேன்": { meaning: "to be born; here 'I was born'" }
  "ta-6110":
    native: "To help someone in a time of distress is a very great merit."
    notes:
      "n1": "A sentence the narrator's grandfather says in the first chapter, when he has helped an injured stranger. The sentence has a Sanskrit-origin word for 'merit'. The word for 'how very' joins 'how much' to a particle that adds wonder."
    bases:
      "ஆபத்துக்": { meaning: "danger, distress" }
      "காலத்தில்": { meaning: "time; here 'in the time of'" }
      "ஒருவருக்கு": { meaning: "one person, respectfully; here 'to a person'" }
      "உதவுவது": { meaning: "to help; here 'helping'" }
      "எவ்வளவோ": { meaning: "how much; here 'how very'" }
      "பெரிய": { meaning: "big, great (the form before a noun)" }
      "சுகிர்தம்": { meaning: "merit, a good deed, a Sanskrit loan" }
  "ta-6111":
    native: "Whoever he may be, one must help in a time of danger."
    notes:
      "n1": "Another sentence of the grandfather in the first chapter. The third word is 'whoever he may be', one word that means 'even if he is anyone'. The ending 'must' is the usual way to say duty in Tamil."
    bases:
      "அவன்": { meaning: "he" }
      "யாராயிருந்தாலும்": { meaning: "who; here 'whoever he may be'" }
      "ஆபத்து": { meaning: "danger, distress" }
      "வேளையில்": { meaning: "time, occasion; here 'at the time of'" }
      "உதவ": { meaning: "to help; here 'to help'" }
      "வேண்டும்": { meaning: "to need, to want; here 'it is needed, one must'" }
  "ta-6112":
    native: "Do good, so that evil ceases."
    notes:
      "n1": "The end of the first verse of the Nalvazhi, a book of verses on right living. The first two words say 'evil ceasing' and the last two 'good doing', and the whole line reads as a short command."
    bases:
      "தீது": { meaning: "evil, harm" }
      "ஒழிய": { meaning: "to cease; here 'so that it ceases'" }
      "நன்மை": { meaning: "good, goodness" }
      "செயல்": { meaning: "to do; here 'doing'" }
  "ta-6113":
    native: "Those who give are the great; those who do not give are the low-born."
    notes:
      "n1": "The third line of the second verse of the Nalvazhi, which says that only two kinds of people exist, by whether they give. The verse sets the two groups apart by giving, and the first lines of the verse say there are only two kinds of people. The same verb for 'give' appears in the first and the third word, with and without a negative."
    bases:
      "இட்டார்": { meaning: "to give, to put; here 'those who gave'" }
      "பெரியோர்": { meaning: "the great ones" }
      "இடாதார்": { meaning: "to give; here 'those who did not give'" }
      "இழிகுலத்தோர்": { meaning: "low birth; here 'those of low birth'" }
  "ta-6114":
    native: "What will not come will not come, however sadly you call it."
    notes:
      "n1": "The first line of the fifth verse of the Nalvazhi, on fate. The negative forms 'vaaraadha' and 'vaaraa' are the old literary negatives of 'come', found in verse rather than in everyday talk."
    bases:
      "வருந்தி": { meaning: "to grieve; here 'having grieved'" }
      "அழைத்தாலும்": { meaning: "to call; here 'even if you call'" }
      "வாராத": { meaning: "to come; here 'what does not come'" }
      "வாரா": { meaning: "to come; here 'will not come'" }
  "ta-6115":
    native: "Even to those who never speak words of courtesy, they go and give wealth."
    notes:
      "n1": "The first line and the start of the second line of the first Nanneri verse, a verse in the venba metre in praise of giving without being asked. The verse goes on to name the good, who do this. The English wording is the builder's and is uncertain."
    bases:
      "என்றும்": { meaning: "always, ever; here 'never' with the negative word after it" }
      "முகமன்": { meaning: "courtesy, flattering words" }
      "இயம்பாதவர்கண்ணும்": { meaning: "to speak; here 'even to those who do not speak'" }
      "சென்று": { meaning: "to go; here 'having gone'" }
      "பொருள்": { meaning: "wealth, thing" }
      "கொடுப்பர்": { meaning: "to give; here 'they give'" }
  "ta-6116":
    native: "The harsh words of those with a heart free of stain are sweet."
    notes:
      "n1": "The start of the second Nanneri verse. The verse says that the sweet words of other people are different from this, comparing them to a bow of sugar cane; the line alone gives only the first half of the idea."
    bases:
      "மாசு": { meaning: "stain, fault" }
      "அற்ற": { meaning: "to be without; here 'that is free of'" }
      "நெஞ்சு": { meaning: "heart, mind" }
      "உடையார்": { meaning: "to have; here 'those who have'" }
      "வன்சொல்": { meaning: "harsh word" }
      "இனிது": { meaning: "sweet, pleasant" }
  "ta-6117":
    native: "Who say, 'In learning we are like the sea'."
    notes:
      "n1": "The first line of the seventh Nanneri verse, which goes on to tell the proud to put such pride aside. The line is only the proud speaker's boast, so the sentence is incomplete by itself."
    bases:
      "கடலே": { meaning: "sea; with the emphasis ending" }
      "அனையம்": { meaning: "to be like; here 'we are like'" }
      "யாம்": { meaning: "we, the old literary 'we'" }
      "கல்வியால்": { meaning: "learning; here 'in learning'" }
      "என்னும்": { meaning: "to say; here 'who say'" }
