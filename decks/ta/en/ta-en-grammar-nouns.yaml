  notes: "Tamil sorts nouns into two classes: உயர்திணை (uyartiṇai), the rational class of people, and அஃறிணை (aḵṟiṇai), the irrational class of animals and things. In the singular a man takes -ஆன் (-āṉ), a woman -ஆள் (-āḷ) and a thing or an animal -அது (-atu); a respected person, such as அம்மா (ammā), takes -ஆர் (-ār). In the plural people take -ஆர்கள் (-ārkaḷ), and the verb of things and animals ends in -அன (-aṉa): இருக்கின்றன (irukkiṉṟaṉa). A man's word in -ன் (-ṉ) changes it to -ர் (-r) before the plural: நண்பன் (naṇpaṉ) becomes நண்பர்கள் (naṇparkaḷ). The verb forms here are the written ones; the spoken forms are in the verb decks. Source: English Wikipedia, Tamil grammar (verb terminations; the neuter plural in -அன); English Wiktionary, நண்பன்."
