cards:
  "ta-8310":
    native: "rent"
    notes:
      n1: "The money you pay each month; வாடகைக்கு (vāṭakaikku), for rent is how a house for rent is advertised."
    examples:
      "வீட்டு வாடகை எவ்வளவு?":
        native: "How much is the house rent?"
        bases:
          "வீட்டு": "house (before a noun); from வீடு (vīṭu), house"
          "வாடகை": "rent"
      "வாடகை அதிகம்.":
        native: "The rent is high."
        bases:
          "வாடகை": "rent"
  "ta-8311":
    native: "owner; landlord"
    notes:
      n1: "The person who owns a house or a shop; the plural is உரிமையாளர்கள் (urimaiyāḷarkaḷ), owners."
    examples:
      "அவர் வீட்டு உரிமையாளர்.":
        native: "He is the house owner."
        bases:
          "வீட்டு": "house (before a noun); from வீடு (vīṭu), house"
