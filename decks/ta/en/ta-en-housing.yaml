schema: 1
id: "ta-en-housing"
kind: "layer"
core: "ta-housing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Housing and renting"
description: "Finding and renting a home: rent, deposit, landlord and tenant, the rooms and parts of a building, repairs, and moving in and out. Not yet checked by a Tamil speaker: please report any mistake."
