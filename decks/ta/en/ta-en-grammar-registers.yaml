schema: 1
id: "ta-en-grammar-registers"
kind: "layer"
core: "ta-grammar-registers"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Formal Tamil: the words of signs, letters and notices"
description: "Twenty-seven formal words found on signs, in letters and in notices, each with the everyday word it stands beside. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
cards:
  "ta-0470":
    native: "to go (formal)"
    notes:
      "n1": "The written, formal verb for to go. Everyday speech and everyday writing use போ (pō) instead, as in போகிறேன் (pōkiṟēṉ). செல் (cel) is the verb of signs, news and formal letters, and its past changes the stem: சென்றான் (ceṉṟāṉ)."
    examples:
      "அவர் அலுவலகத்துக்குச் செல்கிறார்.":
        native: "He goes to the office."
        bases:
          "அலுவலகத்துக்குச்": "to the office; from அலுவலகம் (aluvalakam), office"
          "செல்கிறார்": "goes; from செல் (cel), to go (formal)"
      "மாணவன் பள்ளிக்குச் செல்கிறான்.":
        native: "The student goes to school."
        bases:
          "பள்ளிக்குச்": "to school; from பள்ளி (paḷḷi), school"
          "செல்கிறான்": "goes; from செல் (cel), to go (formal)"
  "ta-0471":
    native: "to eat (formal)"
    notes:
      "n1": "A formal verb for to eat, found in writing and in careful speech; people say சாப்பிடு (cāppiṭu) in everyday talk. Its infinitive doubles the last consonant: உண்ண (uṇṇa)."
    examples:
      "குழந்தை பால் உண்கிறது.":
        native: "The child drinks milk."
        bases:
          "உண்கிறது": "takes; from உண் (uṇ), to eat (formal)"
      "நாங்கள் உணவு உண்கிறோம்.":
        native: "We are eating a meal."
        bases:
          "உணவு": "food"
          "உண்கிறோம்": "are eating; from உண் (uṇ), to eat (formal)"
  "ta-0472":
    native: "to drink (polite)"
    notes:
      "n1": "A polite verb for drinking, said when offering something to a guest: தேநீர் அருந்துங்கள் (tēnīr aruntuṅkaḷ) is Please have some tea. Among friends people say குடி (kuṭi)."
    examples:
      "தேநீர் அருந்துங்கள்.":
        native: "Please have some tea."
        bases:
          "அருந்துங்கள்": "please drink; from அருந்து (aruntu), to drink (polite)"
      "அவர் காபி அருந்துகிறார்.":
        native: "He is drinking coffee."
        bases:
          "அருந்துகிறார்": "is drinking; from அருந்து (aruntu), to drink (polite)"
  "ta-0473":
    native: "to say; to tell (formal)"
    notes:
      "n1": "The formal verb for to say, used in announcements and in writing; in speech people say சொல் (col). It takes the polite ending for a request: கூறுங்கள் (kūṟuṅkaḷ)."
    examples:
      "ஆசிரியர் பதில் கூறுகிறார்.":
        native: "The teacher gives the answer."
        bases:
          "கூறுகிறார்": "says; from கூறு (kūṟu), to say; to tell (formal)"
      "உங்கள் பெயரைக் கூறுங்கள்.":
        native: "Please say your name."
        bases:
          "உங்கள்": "your; from நீங்கள் (nīṅkaḷ), you"
          "பெயரைக்": "the name; from பெயர் (peyar), name"
          "கூறுங்கள்": "please say; from கூறு (kūṟu), to say; to tell (formal)"
  "ta-0474":
    native: "to inform; to let know"
    notes:
      "n1": "It is to let someone know, in a polite or official way: எனக்குத் தெரிவியுங்கள் (eṉakkut teriviyuṅkaḷ) is Please let me know. The stem changes before an ending that starts with -த் (-t): தெரிவித்தார் (terivittār)."
    examples:
      "எனக்குத் தெரிவியுங்கள்.":
        native: "Please let me know."
        bases:
          "எனக்குத்": "to me; from நான் (nāṉ), I"
          "தெரிவியுங்கள்": "please let know; from தெரிவி (terivi), to inform; to let know"
      "அவர் தகவலைத் தெரிவித்தார்.":
        native: "He passed on the information."
        bases:
          "தகவலைத்": "the information; from தகவல் (takaval), information"
          "தெரிவித்தார்": "passed on; from தெரிவி (terivi), to inform; to let know"
  "ta-0475":
    native: "food (formal)"
    notes:
      "n1": "The formal word for food, seen on menus, signs and in writing; at home people say சாப்பாடு (cāppāṭu). It is a thing, so it takes the verbs of things: உணவு நல்லது (uṇavu nallatu)."
    examples:
      "உணவு நல்லது.":
        native: "The food is good."
        bases:
          "உணவு": "food"
      "எனக்கு உணவு வேண்டும்.":
        native: "I want food."
        bases:
          "எனக்கு": "to me; from நான் (nāṉ), I"
          "உணவு": "food"
  "ta-0476":
    native: "water (formal); the water in a compound"
    notes:
      "n1": "The plain word for water, used in writing, in compounds such as தேநீர் (tēnīr) (tea) and in formal speech; everyday talk says தண்ணீர் (taṇṇīr)."
    examples:
      "எனக்கு நீர் வேண்டும்.":
        native: "I need water."
        bases:
          "எனக்கு": "to me; from நான் (nāṉ), I"
          "நீர்": "water"
      "நீர் குடியுங்கள்.":
        native: "Please drink water."
        bases:
          "நீர்": "water"
          "குடியுங்கள்": "please drink; from குடி (kuṭi), to drink"
  "ta-0477":
    native: "home (formal)"
    notes:
      "n1": "A formal word for home, found on signs and in writing, as in the name of a hostel or a charity; everyday talk says வீடு (vīṭu). The place ending is the same: இல்லத்தில் (illattil), at home."
    examples:
      "இது எங்கள் இல்லம்.":
        native: "This is our home."
        bases:
          "எங்கள்": "our; from நாங்கள் (nāṅkaḷ), we"
          "இல்லம்": "home"
      "இல்லத்தில் அம்மா இருக்கிறார்.":
        native: "Mother is at home."
        bases:
          "இல்லத்தில்": "at home; from இல்லம் (illam), home (formal)"
          "இருக்கிறார்": "is; from இரு (iru), to be"
  "ta-0478":
    native: "welcome; reception"
    notes:
      "n1": "It means a welcome, and also the reception desk of a hotel or an office. A thank-you takes the -உக்கு (-ukku) ending: வரவேற்புக்கு நன்றி (varavēṟpukku naṉṟi), thanks for the welcome."
    examples:
      "வரவேற்புக்கு நன்றி.":
        native: "Thank you for the welcome."
        bases:
          "வரவேற்புக்கு": "for the welcome; from வரவேற்பு (varavēṟpu), welcome"
      "வரவேற்பில் அவர் இருக்கிறார்.":
        native: "He is at the reception."
        bases:
          "வரவேற்பில்": "at the reception; from வரவேற்பு (varavēṟpu), reception"
          "இருக்கிறார்": "is; from இரு (iru), to be"
  "ta-0479":
    native: "welcome (written, on signs)"
    notes:
      "n1": "From வா (vā), to come: the written word for welcome, as on banners and at doors. In speech people say வாங்க (vāṅka), which is the polite command to come."
    examples:
      "எல்லோரும் வருக.":
        native: "Welcome, everyone."
        bases:
          "வருக": "welcome"
      "இங்கே வருக.":
        native: "Please come here."
        bases:
          "வருக": "welcome"
  "ta-0480":
    native: "entrance; entry"
    notes:
      "n1": "The word on a sign over a way in. With a noun it makes a compound: நுழைவுக் கட்டணம் (nuḻaivuk kaṭṭaṇam) is an entry fee, and the first word gets a doubled -க் (-k)."
    examples:
      "நுழைவு இங்கே.":
        native: "The entrance is here."
        bases:
          "நுழைவு": "entrance"
      "நுழைவுக் கட்டணம் இல்லை.":
        native: "There is no entry fee."
        bases:
          "நுழைவுக்": "entry; from நுழைவு (nuḻaivu), entrance"
  "ta-0481":
    native: "ban; prohibition"
    notes:
      "n1": "A sign word. It follows what is banned, often with the infinitive: நுழையத் தடை (nuḻaiyat taṭai) is No entry, and the infinitive's last sound is doubled before it."
    examples:
      "இங்கே புகைபிடிக்கத் தடை.":
        native: "Smoking is banned here."
        bases:
          "புகைபிடிக்கத்": "smoking; from புகைபிடி (pukaipiṭi), to smoke"
          "தடை": "ban"
      "நுழையத் தடை.":
        native: "No entry."
        bases:
          "நுழையத்": "to enter; from நுழை (nuḻai), to enter"
          "தடை": "ban"
  "ta-0482":
    native: "permission; admission"
    notes:
      "n1": "It is leave to do something, and the admission to a place: அனுமதி இல்லை (aṉumati illai) is Not allowed, and அனுமதி தா (aṉumati tā) is give permission."
    examples:
      "உள்ளே செல்ல அனுமதி இல்லை.":
        native: "There is no permission to go in."
        bases:
          "செல்ல": "to go; from செல் (cel), to go (formal)"
          "அனுமதி": "permission"
      "அவர் அனுமதி தந்தார்.":
        native: "He gave permission."
        bases:
          "அனுமதி": "permission"
          "தந்தார்": "gave; from தா (tā), to give"
  "ta-0483":
    native: "attention; care"
    notes:
      "n1": "It means attention, and as a sign it means Take care. With -ஆக (-āka) it becomes carefully: கவனமாக (kavaṉamāka). The final -ம் (-m) drops before the ending."
    examples:
      "கவனமாகக் கேளுங்கள்.":
        native: "Please listen carefully."
        bases:
          "கவனமாகக்": "carefully; from கவனம் (kavaṉam), attention"
          "கேளுங்கள்": "please listen; from கேள் (kēḷ), to listen; to ask"
      "கவனம் வேண்டும்.":
        native: "Care is needed."
        bases:
          "கவனம்": "care"
  "ta-0484":
    native: "application; application form"
    notes:
      "n1": "The form you fill in to apply for something, and also the written request itself. The verb with it is எழுது (eḻutu) or செய் (cey): விண்ணப்பம் எழுது (viṇṇappam eḻutu)."
    examples:
      "விண்ணப்பம் இங்கே இருக்கிறது.":
        native: "The application form is here."
        bases:
          "விண்ணப்பம்": "application form"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "நான் விண்ணப்பம் எழுதுகிறேன்.":
        native: "I am writing an application."
        bases:
          "விண்ணப்பம்": "application"
          "எழுதுகிறேன்": "am writing; from எழுது (eḻutu), to write"
  "ta-0485":
    native: "signature; handwriting"
    notes:
      "n1": "It is one's own writing by hand, and so also a signature. To sign, Tamil puts it: கையெழுத்துப் போடு (kaiyeḻuttup pōṭu), literally put a signature."
    examples:
      "இங்கே கையெழுத்துப் போடுங்கள்.":
        native: "Please sign here."
        bases:
          "கையெழுத்துப்": "signature; from கையெழுத்து (kaiyeḻuttu), signature"
          "போடுங்கள்": "please put; from போடு (pōṭu), to put; to throw"
      "என் கையெழுத்து நல்லது.":
        native: "My handwriting is good."
        bases:
          "என்": "my; from நான் (nāṉ), I"
          "கையெழுத்து": "handwriting"
  "ta-0486":
    native: "certificate"
    notes:
      "n1": "The formal word for an official paper that proves something, such as a school or birth certificate. It ends in -ழ் (-ḻ), so an ending follows it directly: சான்றிதழைக் காட்டுங்கள் (cāṉṟitaḻaik kāṭṭuṅkaḷ), please show the certificate."
    examples:
      "சான்றிதழ் இங்கே இருக்கிறது.":
        native: "The certificate is here."
        bases:
          "சான்றிதழ்": "certificate"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "எனக்குச் சான்றிதழ் வேண்டும்.":
        native: "I need a certificate."
        bases:
          "எனக்குச்": "to me; from நான் (nāṉ), I"
          "சான்றிதழ்": "certificate"
  "ta-0487":
    native: "letter"
    notes:
      "n1": "A letter on paper, which one writes and sends: கடிதம் எழுது (kaṭitam eḻutu). It ends in -ம் (-m), which turns to -த்த் (-tt) before an ending: கடிதத்தில் (kaṭitattil), in the letter."
    examples:
      "நான் கடிதம் எழுதுகிறேன்.":
        native: "I am writing a letter."
        bases:
          "கடிதம்": "letter"
          "எழுதுகிறேன்": "am writing; from எழுது (eḻutu), to write"
      "அம்மாவுக்குக் கடிதம் வந்தது.":
        native: "A letter came for mother."
        bases:
          "அம்மாவுக்குக்": "for mother; from அம்மா (ammā), mother"
          "கடிதம்": "letter"
          "வந்தது": "came; from வா (vā), to come"
  "ta-0488":
    native: "stop; a place where a bus stops"
    notes:
      "n1": "It is a stopping place, and in பேருந்து நிறுத்தம் (pēruntu niṟuttam) it is the bus stop. It comes from the verb நிறுத்து (niṟuttu), to stop something."
    examples:
      "பேருந்து நிறுத்தம் இங்கே.":
        native: "The bus stop is here."
        bases:
          "நிறுத்தம்": "stop"
      "நிறுத்தம் அருகில் இருக்கிறது.":
        native: "The stop is nearby."
        bases:
          "நிறுத்தம்": "stop"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-0489":
    native: "the public; people in general"
    notes:
      "n1": "It is already plural, with -கள் (-kaḷ), and means the public as against officials: பொதுமக்களுக்கு அறிவிப்பு (potumakkaḷukku aṟivippu) is A notice for the public. It takes the verb ending for people, as in செல்கிறார்கள் (celkiṟārkaḷ)."
    examples:
      "பொதுமக்கள் உள்ளே செல்லலாம்.":
        native: "The public may go in."
        bases:
          "பொதுமக்கள்": "the public"
          "செல்லலாம்": "may go; from செல் (cel), to go (formal)"
      "பொதுமக்களுக்கு அறிவிப்பு.":
        native: "A notice for the public."
        bases:
          "பொதுமக்களுக்கு": "for the public; from பொதுமக்கள் (potumakkaḷ), the public"
  "ta-0490":
    native: "officer; official"
    notes:
      "n1": "The person who works in an office or serves the public, with the ending -அர் (-ar) that marks a respected person. One asks such a person with -இடம் (-iṭam): அலுவலரிடம் கேளுங்கள் (aluvalariṭam kēḷuṅkaḷ)."
    examples:
      "அலுவலர் இங்கே இருக்கிறார்.":
        native: "The officer is here."
        bases:
          "அலுவலர்": "officer"
          "இருக்கிறார்": "is; from இரு (iru), to be"
      "அலுவலரிடம் கேளுங்கள்.":
        native: "Please ask the officer."
        bases:
          "அலுவலரிடம்": "from the officer; from அலுவலர் (aluvalar), officer"
          "கேளுங்கள்": "please ask; from கேள் (kēḷ), to listen; to ask"
  "ta-0491":
    native: "way; path; route"
    notes:
      "n1": "It is the way to a place, or a way of doing something. A sign for the exit says வெளியே செல்லும் வழி (veḷiyē cellum vaḻi), where செல்லும் (cellum) is the verb before a noun, taught in a later unit."
    examples:
      "வழி எங்கே?":
        native: "Where is the way?"
        bases:
          "வழி": "way"
      "வெளியே செல்ல வழி இல்லை.":
        native: "There is no way out."
        bases:
          "செல்ல": "to go; from செல் (cel), to go (formal)"
          "வழி": "way"
  "ta-0492":
    native: "advance booking"
    notes:
      "n1": "A booking made before one arrives, for a seat, a room or a ticket. The verb is செய் (cey): முன்பதிவு செய் (muṉpativu cey), to book ahead."
    examples:
      "முன்பதிவு வேண்டும்.":
        native: "A booking is needed."
        bases:
          "முன்பதிவு": "booking"
      "நான் முன்பதிவு செய்கிறேன்.":
        native: "I am booking ahead."
        bases:
          "முன்பதிவு": "booking"
          "செய்கிறேன்": "am doing; from செய் (cey), to do; to make"
  "ta-0493":
    native: "you (very polite; formal)"
    notes:
      "n1": "A very respectful you, used for an elder or a guest in formal speech and in letters, a step above நீங்கள் (nīṅkaḷ). The verb takes the same ending as for நீங்கள் (nīṅkaḷ): தாங்கள் வருகிறீர்கள் (tāṅkaḷ varukiṟīrkaḷ)."
    examples:
      "தாங்கள் எங்கே போகிறீர்கள்?":
        native: "Where are you going?"
        bases:
          "தாங்கள்": "you (formal)"
