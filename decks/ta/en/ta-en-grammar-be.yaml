name: "To be: இரு (iru) and இல்லை (illai)"
description: "Is, was, will be and is not: இரு (iru) for where and how someone is, no verb between two nouns, and இல்லை (illai) for not. Not yet checked by a Tamil speaker: please report any mistake."
