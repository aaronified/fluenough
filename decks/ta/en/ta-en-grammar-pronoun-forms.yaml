native: { code: "en", iso639_3: "eng", name: "English" }
name: "Pronouns: my, to, with"
description: "How I, you, he, she, it, we and they change before a noun, and with to, the thing acted on and with. Checked against the declension tables of English Wiktionary. Not yet checked by a Tamil speaker: please report any mistake."
