tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "gen": "{meaning}: of, the form before a noun"
    "dat": "{meaning}: to, for"
    "acc": "{meaning}: the one acted on"
    "with": "{meaning}: with"
rules:
  "ta-rule-pronoun-gen":
    name: "Of: my, your, his (before a noun)"
    explanation: "Before a noun the pronoun changes: {1}, I, becomes {2}, {3}, you, becomes {4}, and {5}, he, becomes {6}. {7} is a longer form of {2}, and {8} is the form of அது (atu), it. Examples: என் குடும்பம் (eṉ kuṭumpam), my family; உங்கள் பெயர் (uṅkaḷ peyar), your name. Source: the declension tables of English Wiktionary."
  "ta-rule-pronoun-dat":
    name: "-உக்கு (-ukku): to, for"
    explanation: "{1}, I, becomes {2}, to me, {3} becomes {4}, and {5}, who, becomes {6}. Tamil uses this form for what someone knows or understands: எனக்குப் புரியவில்லை (eṉakkup puriyavillai), I do not understand. Source: the declension tables of English Wiktionary."
  "ta-rule-pronoun-acc":
    name: "-ஐ (-ai): the one acted on"
    explanation: "{1}, I, becomes {2}, {3}, you, becomes {4} and {5}, he or she in polite speech, becomes {6}: the person or thing the verb acts on. The ending is -ஐ (-ai). Source: the declension tables of English Wiktionary."
  "ta-rule-pronoun-with":
    name: "-ஓடு (-ōṭu): with"
    explanation: "{1}, I, becomes {2}, with me, {3} becomes {4}, and {5}, we including you, becomes {6}, with us. Source: the declension tables of English Wiktionary."
