schema: 1
id: "ta-en-environment-sentences"
kind: "layer"
core: "ta-environment-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Environment in sentences"
description: "Sentences about pollution, waste, recycling, planting trees and looking after nature. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-9090":
    native: "Air pollution is high in the city."
    bases:
      "நகரத்தில்": "in the city; from நகரம் (nakaram), city; town"
    confusables:
      w1: { why: "நீர்மாசு (nīrmācu), water pollution, is a different word." }
      w2: { why: "ஒலிமாசு (olimācu), noise pollution, is a different word." }
      w3: { why: "நச்சு (naccu), poison; toxin, is a different word." }
  "ta-9091":
    native: "We recycle the rubbish."
    bases:
      "குப்பையை": "the rubbish; from குப்பை (kuppai), rubbish; waste"
      "செய்கிறோம்": "are doing (we); from செய் (cey), to do; to make"
    confusables:
      w1: { why: "கழிவு (kaḻivu), waste; discarded matter, is a different word." }
      w2: { why: "மறுபயன்பாடு (maṟupayaṉpāṭu), reuse, is a different word." }
      w3: { why: "துணிப்பை (tuṇippai), cloth bag, is a different word." }
  "ta-9092":
    native: "No plastic bag, please."
    bases:
      "நெகிழிப்": "plastic (before a noun); from நெகிழி (nekiḻi), plastic"
    confusables:
      w1: { why: "பிளாஸ்டிக் (piḷāsṭik), plastic (spoken), is a different word." }
      w2: { why: "துணிப்பை (tuṇippai), cloth bag, is a different word." }
  "ta-9093":
    native: "Do not waste water."
    bases:
      "தண்ணீரை": "the water; from தண்ணீர் (taṇṇīr), water"
      "வீணாக்காதே": "do not waste; from வீணாக்கு (vīṇākku), to waste"
    confusables:
      w1: { why: "வீண் (vīṇ), waste; vain, is a different word." }
      w2: { why: "பாதுகா (pātukā), to protect; to guard, is a different word." }
      w3: { why: "மழைநீர் (maḻainīr), rainwater, is a different word." }
  "ta-9094":
    native: "I am planting a tree."
    bases:
      "நடுகிறேன்": "am planting (a tree); from நடு (naṭu), to plant (a tree); to fix in place"
    confusables:
      w1: { why: "பசுமை (pacumai), greenery; green, is a different word." }
      w2: { why: "பூச்சி (pūcci), insect; bug, is a different word." }
      w3: { why: "புழு (puḻu), worm; grub, is a different word." }
  "ta-9095":
    native: "The earth is warming up."
    bases:
      "அடைகிறது": "is reaching; from அடை (aṭai), to reach; to arrive at"
    confusables:
      w1: { why: "காலநிலைமாற்றம் (kālanilaimāṟṟam), climate change, is a different word." }
      w2: { why: "பருவநிலை (paruvanilai), seasonal conditions; climate, is a different word." }
      w3: { why: "பருவமழை (paruvamaḻai), monsoon; seasonal rain, is a different word." }
  "ta-9096":
    native: "There is drought here, the groundwater is going down."
    bases:
      "குறைகிறது": "goes down; from குறை (kuṟai), to decrease; to lessen"
    confusables:
      w1: { why: "மழைநீர் (maḻainīr), rainwater, is a different word." }
      w2: { why: "கடல்மட்டம் (kaṭalmaṭṭam), sea level, is a different word." }
  "ta-9097":
    native: "Solar energy is free."
    confusables:
      w1: { why: "காற்றாலை (kāṟṟālai), windmill; wind turbine, is a different word." }
      w2: { why: "எரிசக்தி (ericakti), fuel energy; energy, is a different word." }
      w3: { why: "நிலக்கரி (nilakkari), coal, is a different word." }
  "ta-9098":
    native: "We must protect nature."
    bases:
      "இயற்கையைப்": "the nature; from இயற்கை (iyaṟkai), nature"
      "பாதுகாக்க": "to protect; from பாதுகா (pātukā), to protect"
    confusables:
      w1: { why: "வளம் (vaḷam), wealth; richness; fertility, is a different word." }
      w2: { why: "உயிரினம் (uyiriṉam), living thing; species, is a different word." }
      w3: { why: "வனவிலங்கு (vaṉavilaṅku), wildlife; wild animal, is a different word." }
  "ta-9099":
    native: "The river is becoming polluted."
    bases:
      "மாசுபடுகிறது": "is becoming polluted; from மாசுபடு (mācupaṭu), to become polluted"
    confusables:
      w1: { why: "தூய்மைப்படுத்து (tūymaippaṭuttu), to clean up; to purify, is a different word." }
      w2: { why: "கட்டுப்படுத்து (kaṭṭuppaṭuttu), to control; to restrain, is a different word." }
      w3: { why: "அழிவு (aḻivu), destruction; ruin, is a different word." }
