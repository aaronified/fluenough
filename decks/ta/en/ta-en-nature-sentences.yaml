  "ta-4579":
    native: "Let's go to the beach."
    bases:
      "போகலாம்": "let's go; from போ (pō), to go"
    confusables:
      w1: { why: "தீவு (tīvu), island, is a different word." }
      w2: { why: "அருவி (aruvi), waterfall, is a different word." }
  "ta-4580":
    native: "The lotus is beautiful."
    confusables:
      w1: { why: "ரோஜா (rōjā), rose, is a different word." }
      w2: { why: "மல்லிகை (mallikai), jasmine, is a different word." }
  "ta-4581":
    native: "The peacock is beautiful."
