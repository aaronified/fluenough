id: "ta-en-verbs-4-sentences"
kind: "layer"
core: "ta-verbs-4-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Story actions in sentences"
description: "Sentences that use story verbs: hiding, bringing, digging, crying out, escaping and deciding. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-9590":
    native: "The thief lurks in the dark."
    bases:
      "இருட்டில்": "in the dark; from இருட்டு (iruṭṭu), darkness"
      "பதுங்குகிறான்": "he lurks; from பதுங்கு (patuṅku), to crouch"
    confusables:
      w1: { why: "ஒளிந்துகொள் (oḷintukoḷ), to hide (oneself), is a different word." }
      w2: { why: "தப்பிச்செல் (tappiccel), to run away; to escape, is a different word." }
      w3: { why: "விலகு (vilaku), to move aside; to move away, is a different word." }
  "ta-9591":
    native: "My elder brother brings me a book."
    bases:
      "எனக்குப்": "to me; from நான் (nāṉ), I"
      "கொண்டுவருகிறான்": "he brings; from கொண்டுவா (koṇṭuvā), to bring"
    notes:
      n1: "The compound கொண்டுவா (koṇṭuvā), bring changes its second part in the present: கொண்டுவருகிறான் (koṇṭuvarukiṟāṉ), he brings."
    confusables:
      w1: { why: "கொண்டுபோ (koṇṭupō), to take along; to carry away, is a different word." }
      w2: { why: "சுமக்கு (cumakku), to carry on the head or shoulder, is a different word." }
      w3: { why: "திருப்பிக்கொடு (tiruppikkoṭu), to give back; to return, is a different word." }
  "ta-9592":
    native: "It is pouring, but we set out."
    bases:
      "பொழிகிறது": "pours; from பொழி (poḻi), to pour"
      "புறப்படுகிறோம்": "we set out; from புறப்படு (puṟappaṭu), to set out"
    confusables:
      w1: { why: "தணி (taṇi), to subside; to ease, is a different word." }
      w2: { why: "உருள் (uruḷ), to roll, is a different word." }
      w3: { why: "தேய் (tēy), to wane; to wear out, is a different word." }
  "ta-9593":
    native: "We can all discuss it together."
    bases:
      "சேர்ந்து": "together; having joined; from சேர் (cēr), to join"
      "ஆலோசிக்கலாம்": "can discuss; from ஆலோசி (ālōci), to discuss"
    notes:
      n1: "-லாம் (-lām) after the stem means can or let us: ஆலோசிக்கலாம் (ālōcikkalām)."
    confusables:
      w1: { why: "முடிவுசெய் (muṭivucey), to decide, is a different word." }
      w2: { why: "முறையிடு (muṟaiyiṭu), to appeal; to complain, is a different word." }
      w3: { why: "விவரி (vivari), to describe; to narrate, is a different word." }
  "ta-9594":
    native: "This child was born yesterday."
    bases:
      "இந்தக்": "this (before a word starting with k); from இந்த (inta), this"
      "பிறந்தது": "was born; from பிற (piṟa), to be born"
    notes:
      n1: "The past adds -ந்த (-nta) to the stem: பிறந்தது (piṟantatu), it was born."
    confusables:
      w1: { why: "இற (iṟa), to die, is a different word." }
      w2: { why: "வளர் (vaḷar), to grow, is a different word." }
      w3: { why: "தூங்கு (tūṅku), to sleep, is a different word." }
  "ta-9595":
    native: "The snake hisses; do not be afraid."
    bases:
      "சீறுகிறது": "present, it; from சீறு (cīṟu), to hiss"
      "பயப்படாதே": "do not be afraid; from பயப்படு (payappaṭu), to be afraid"
    confusables:
      w1: { why: "முணுமுணு (muṇumuṇu), to mutter; to grumble, is a different word." }
      w2: { why: "கூவு (kūvu), to crow; to call (of a bird), is a different word." }
      w3: { why: "அலறு (alaṟu), to scream; to cry out, is a different word." }
  "ta-9596":
    native: "He stumbles, but he does not fall."
    bases:
      "தடுமாறுகிறான்": "present, he; from தடுமாறு (taṭumāṟu), to stumble"
      "விழவில்லை": "did not fall; from விழு (viḻu), to fall"
    notes:
      n1: "The past negative adds -வில்லை (-villai) to the stem: விழவில்லை (viḻavillai), did not fall."
    confusables:
      w1: { why: "சறுக்கு (caṟukku), to slip; to slide, is a different word." }
      w2: { why: "தள்ளாடு (taḷḷāṭu), to stagger; to rock, is a different word." }
      w3: { why: "உருள் (uruḷ), to roll, is a different word." }
  "ta-9597":
    native: "The lamp hangs on the wall."
    bases:
      "சுவரில்": "on the wall; from சுவர் (cuvar), wall"
      "தொங்குகிறது": "present, it; from தொங்கு (toṅku), to hang"
    confusables:
      w1: { why: "குவி (kuvi), to pile up; to heap, is a different word." }
      w2: { why: "சாய்ந்துகொள் (cāyntukoḷ), to lean back; to lean on, is a different word." }
      w3: { why: "விரி (viri), to spread out; to open out, is a different word." }
  "ta-9598":
    native: "Why are you surprised?"
    bases:
      "ஆச்சரியப்படுகிறாய்": "you are surprised; from ஆச்சரியப்படு (āccariyappaṭu), to be surprised"
    notes:
      n1: "The present ending for you (to a friend) is -கிறாய் (-kiṟāy)."
    confusables:
      w1: { why: "வியப்படை (viyappaṭai), to be amazed, is a different word." }
      w2: { why: "திடுக்கிடு (tiṭukkiṭu), to be startled, is a different word." }
      w3: { why: "ஏங்கு (ēṅku), to long for; to yearn, is a different word." }
  "ta-9599":
    native: "I rest today."
    bases:
      "ஓய்வெடுக்கிறேன்": "present, I; from ஓய்வெடு (ōyveṭu), to take rest"
    confusables:
      w1: { why: "தங்கு (taṅku), to stay; to lodge, is a different word." }
      w2: { why: "நடந்துபோ (naṭantupō), to go on foot; to walk away, is a different word." }
      w3: { why: "அலைந்துதிரி (alaintutiri), to wander about, is a different word." }
