  notes: "-ஆல் (-āl) says by what means or tool something is done: பேனாவால் (pēṉāvāl), with a pen. It joins the noun as the other endings do: after ஆ (ā) with a glide, after இ (i) and ஐ (ai) with -யால் (-yāl), and after a consonant directly, with கல் (kal) doubling its last consonant. For a vehicle Tamil says in, with -இல் (-il), as in பேருந்தில் (pēruntil), by bus. Source: English Wikipedia, Tamil grammar (the instrumental -āl); English Wiktionary's declension tables."
