          "வாக்குறுதி": "promise"
      "அவன் வாக்குறுதி கொடுக்கிறான்.":
        native: "He gives a promise."
        bases:
          "வாக்குறுதி": "promise"
          "கொடுக்கிறான்": "he gives; from கொடு (koṭu), to give"
  "ta-8267":
    native: "talk; speech; way of speaking"
