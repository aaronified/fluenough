native: { code: "en", iso639_3: "eng", name: "English" }
name: "Relationships: neighbours, friends and thank-you notes"
description: "Neighbours, friends and acquaintances: trust, quarrels and making up, saying thanks and sorry, and the words for how people get on. Not yet checked by a Tamil speaker: please report any mistake."
