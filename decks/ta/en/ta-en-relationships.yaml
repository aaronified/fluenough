tags: ["unreviewed"]
cards:
  "ta-8260":
    native: "neighbour"
    notes:
      n1: "The spoken word for the person next door; it is long, so people also say பக்கத்து வீடு (pakkattu vīṭu), the next house."
    examples:
      "அவர் என் பக்கத்துவீட்டுக்காரர்.":
        native: "He is my neighbour."
        bases:
          "என்": "my; from நான் (nāṉ), I"
          "பக்கத்துவீட்டுக்காரர்": "neighbour"
      "பக்கத்துவீட்டுக்காரர் நல்லவர்.":
        native: "The neighbour is a good man."
        bases:
          "பக்கத்துவீட்டுக்காரர்": "neighbour"
          "நல்லவர்": "good man (polite); from நல்ல (nalla), good"
  "ta-8261":
    native: "female friend"
    notes:
      n1: "A woman's close friend; the man's pair is தோழன் (tōḻaṉ), male friend."
    examples:
      "அவள் என் தோழி.":
        native: "She is my friend."
        bases:
          "என்": "my; from நான் (nāṉ), I"
          "தோழி": "female friend"
      "என் தோழி இங்கே இருக்கிறாள்.":
        native: "My friend is here."
        bases:
          "என்": "my; from நான் (nāṉ), I"
          "தோழி": "female friend"
          "இருக்கிறாள்": "is; from இரு (iru), to be"
  "ta-8262":
    native: "male friend; comrade"
    notes:
      n1: "A man's close friend; நண்பன் (naṇpaṉ), friend, a word taught earlier, is the everyday word."
    examples:
      "அவன் என் தோழன்.":
        native: "He is my friend."
        bases:
          "என்": "my; from நான் (nāṉ), I"
          "தோழன்": "male friend; comrade"
      "என் தோழன் வீட்டில் இருக்கிறான்.":
        native: "My friend is at home."
        bases:
          "என்": "my; from நான் (nāṉ), I"
          "தோழன்": "male friend; comrade"
          "இருக்கிறான்": "is; from இரு (iru), to be"
  "ta-8263":
    native: "relationship; relation"
    notes:
      n1: "A tie of blood or of friendship; the noun உறவினர் (uṟaviṉar), relative is made from it."
