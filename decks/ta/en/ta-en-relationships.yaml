          "எங்கள்": "our; from நாங்கள் (nāṅkaḷ), we"
          "உறவு": "relationship; relation"
      "அவர்களுக்குள் உறவு இருக்கிறது.":
        native: "There is a relationship between them."
        bases:
          "அவர்களுக்குள்": "among them; between them; from அவர்கள் (avarkaḷ), they"
          "உறவு": "relationship; relation"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-8264":
    native: "peace; reconciliation"
    notes:
      n1: "Peace after a quarrel; also a comforting answer."
    examples:
      "இங்கே சமாதானம் இருக்கிறது.":
        native: "There is peace here."
        bases:
          "சமாதானம்": "peace; reconciliation"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "அவர்களுக்குள் சமாதானம்.":
        native: "There is peace between them."
