pattern:
  name: "Helper verbs"
  slot_name: "form"
  entries:
    "cappitu": "to eat"
    "padi": "to study"
    "edu": "to take"
    "ezhutu": "to write"
    "vaanku": "to buy"
    "mudu": "to close"
    "kazhuvu": "to wash"
    "cey": "to do"
  notes: "A helper verb follows the verbal participle and adds a shade of meaning to the action: விடு (viṭu) says it is finished, கொள் (koḷ) says it is for oneself, கொடு (koṭu) says it is done for someone, and பார் (pār) says try it. The table shows each with I and the past: சாப்பிட்டுவிட்டேன் (cāppiṭṭuviṭṭēṉ), I have eaten up, and எடுத்துக்கொண்டேன் (eṭuttukkoṇṭēṉ), I took it for myself. After the participle a helper that starts with -க் (-k) or -ப் (-p) doubles that sound, so the participle and the helper may be written as two words or one. The shades are those taught on the helper-verb cards of this unit. Not yet checked by a Tamil speaker: please report any mistake."
