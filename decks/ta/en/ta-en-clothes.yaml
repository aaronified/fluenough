schema: 1
id: "ta-en-clothes"
kind: "layer"
core: "ta-clothes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Clothes and colours"
description: "Shirt, trousers, sari, dhoti, sandals, hat, and the colours red, blue, green, yellow and white. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-0284":
    native: "shirt"
    notes:
      n1: "A shirt."
    examples:
      "இது சட்டை.":
        native: "This is a shirt."
        bases:
          "சட்டை": "shirt"
      "அது பெரிய சட்டை.":
        native: "That is a big shirt."
        bases:
          "சட்டை": "shirt"
  "ta-0285":
    native: "trousers"
    notes:
      n1: "Trousers, a loan word."
    examples:
      "இது பேண்ட்.":
        native: "These are trousers."
        bases:
          "பேண்ட்": "trousers"
      "அது பழைய பேண்ட்.":
        native: "Those are old trousers."
        bases:
          "பேண்ட்": "trousers"
  "ta-0286":
    native: "sari"
    notes:
      n1: "A sari, worn by women."
    examples:
      "இது புடவை.":
        native: "This is a sari."
        bases:
          "புடவை": "sari"
      "அவள் புடவை அழகு.":
        native: "Her sari is beautiful."
        bases:
          "புடவை": "sari"
          "அழகு": "beauty; beautiful"
  "ta-0287":
    native: "dhoti"
    notes:
      n1: "A dhoti, worn by men."
    examples:
      "இது வேட்டி.":
        native: "This is a dhoti."
        bases:
          "வேட்டி": "dhoti"
      "அவர் வெள்ளை வேட்டி.":
        native: "He has a white dhoti."
        bases:
          "வேட்டி": "dhoti"
  "ta-0288":
    native: "sandal"
    notes:
      n1: "A pair of sandals."
    examples:
      "இது செருப்பு.":
        native: "These are sandals."
        bases:
          "செருப்பு": "sandal"
      "செருப்பு எங்கே?":
        native: "Where are the sandals?"
        bases:
          "செருப்பு": "sandal"
  "ta-0289":
    native: "hat"
    notes:
      n1: "A hat, for sun or for a ceremony."
    examples:
      "இது தொப்பி.":
        native: "This is a hat."
        bases:
          "தொப்பி": "hat"
      "தொப்பி மேலே இருக்கிறது.":
        native: "The hat is on top."
        bases:
          "தொப்பி": "hat"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-0290":
    native: "colour"
    notes:
      n1: "The colour of a thing."
    examples:
      "இது என்ன நிறம்?":
        native: "What colour is this?"
        bases:
          "நிறம்": "colour"
      "நிறம் நல்லது.":
        native: "The colour is good."
        bases:
          "நிறம்": "colour"
  "ta-0291":
    native: "red"
    notes:
      n1: "Red. Before a noun, the same word: சிவப்பு சட்டை (civappu caṭṭai, a red shirt)."
    examples:
      "இது சிவப்பு.":
        native: "This is red."
        bases:
          "சிவப்பு": "red"
      "அது சிவப்பு சட்டை.":
        native: "That is a red shirt."
        bases:
          "சிவப்பு": "red"
  "ta-0292":
    native: "blue"
    notes:
      n1: "Blue."
    examples:
      "இது நீலம்.":
        native: "This is blue."
        bases:
          "நீலம்": "blue"
      "இது நீலம் நிறம்.":
        native: "This is the colour blue."
        bases:
          "நீலம்": "blue"
  "ta-0293":
    native: "green"
    notes:
      n1: "Green."
    examples:
      "இது பச்சை.":
        native: "This is green."
        bases:
          "பச்சை": "green"
      "இது பச்சை நிறம்.":
        native: "This is the colour green."
        bases:
          "பச்சை": "green"
  "ta-0294":
    native: "yellow; turmeric"
    notes:
      n1: "Yellow. Turmeric is the same word."
    examples:
      "இது மஞ்சள்.":
        native: "This is yellow."
        bases:
          "மஞ்சள்": "yellow; turmeric"
      "இது மஞ்சள் நிறம்.":
        native: "This is the colour yellow."
        bases:
          "மஞ்சள்": "yellow; turmeric"
  "ta-0295":
    native: "white"
    notes:
      n1: "White. Before a noun, the same word: வெள்ளை சட்டை (veḷḷai caṭṭai, a white shirt)."
    examples:
      "இது வெள்ளை.":
        native: "This is white."
        bases:
          "வெள்ளை": "white"
      "வெள்ளை சட்டை வேண்டும்.":
        native: "A white shirt is needed."
        bases:
          "வெள்ளை": "white"
          "வேண்டும்": "is needed"
