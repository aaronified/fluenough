schema: 1
id: "ta-en-phone"
kind: "layer"
core: "ta-phone"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phone and technology"
description: "Phones, messages and the internet: calls, apps, passwords and chargers, and the verbs of using a phone and a computer. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-2087":
    native: "telephone"
    notes:
      n1: "The formal word for a telephone, also used for a phone call."
    examples:
      "தொலைபேசி எண் என்ன?":
        native: "What is the telephone number?"
        bases:
          "தொலைபேசி": "telephone"
      "தொலைபேசி எங்கே?":
        native: "Where is the telephone?"
        bases:
          "தொலைபேசி": "telephone"
  "ta-2088":
    native: "mobile phone"
    notes:
      n1: "The formal word; spoken Tamil says மொபைல் (mopail) or போன் (pōṉ)."
    examples:
      "என் கைபேசி எங்கே?":
        native: "Where is my mobile phone?"
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "கைபேசி": "mobile phone"
      "கைபேசி வேண்டும்.":
        native: "A mobile phone is wanted."
        bases:
          "கைபேசி": "mobile phone"
  "ta-2089":
    native: "mobile"
    notes:
      n1: "The everyday English loan for a mobile phone."
    examples:
      "இது என் மொபைல்.":
        native: "This is my mobile."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "மொபைல்": "mobile"
      "மொபைல் கொடு.":
        native: "Give me the mobile."
        bases:
          "மொபைல்": "mobile"
  "ta-2090":
    native: "phone"
    notes:
      n1: "The spoken English loan. With verbs: போன் எடு (pōṉ eṭu) is pick up the phone, and போன் வை (pōṉ vai) is hang up."
    examples:
      "போன் எடு.":
        native: "Pick up the phone."
        bases:
          "போன்": "phone"
      "போன் வை.":
        native: "Hang up."
        bases:
          "போன்": "phone"
  "ta-2091":
    native: "call; invitation"
    notes:
      n1: "A phone call, and also an invitation, as for a wedding."
    examples:
      "அவசர அழைப்பு.":
        native: "An emergency call."
        bases:
          "அவசர": "urgent; emergency; from அவசரம் (avacaram), urgency; hurry"
          "அழைப்பு": "call; invitation"
      "அழைப்பு வருகிறது.":
        native: "A call is coming in."
        bases:
          "அழைப்பு": "call; invitation"
          "வருகிறது": "is coming; from வா (vā), come"
  "ta-2092":
    native: "text message"
    notes:
      n1: "A short message (SMS), literally a short news."
    examples:
      "குறுஞ்செய்தி அனுப்பு.":
        native: "Send a text message."
        bases:
          "குறுஞ்செய்தி": "text message"
      "குறுஞ்செய்தி வருகிறது.":
        native: "A text message is coming in."
        bases:
          "குறுஞ்செய்தி": "text message"
          "வருகிறது": "is coming; from வா (vā), come"
  "ta-2093":
    native: "message"
    notes:
      n1: "The spoken English loan for a chat or text message."
    examples:
      "மெசேஜ் அனுப்பு.":
        native: "Send a message."
        bases:
          "மெசேஜ்": "message"
      "மெசேஜ் பார்.":
        native: "Look at the message."
        bases:
          "மெசேஜ்": "message"
  "ta-2094":
    native: "email"
    notes:
      n1: "Made of மின் (miṉ) (electric) and அஞ்சல் (añcal) (post)."
    examples:
      "மின்னஞ்சல் அனுப்பு.":
        native: "Send an email."
        bases:
          "மின்னஞ்சல்": "email"
      "மின்னஞ்சல் முகவரி என்ன?":
        native: "What is the email address?"
        bases:
          "மின்னஞ்சல்": "email"
  "ta-2095":
    native: "internet"
    notes:
      n1: "The internet."
    examples:
      "இணையம் இல்லை.":
        native: "There is no internet."
        bases:
          "இணையம்": "internet"
      "இணையம் வேண்டும்.":
        native: "The internet is needed."
        bases:
          "இணையம்": "internet"
  "ta-2096":
    native: "website"
    notes:
      n1: "Literally a web site."
    examples:
      "வலைத்தளம் திற.":
        native: "Open the website."
        bases:
          "வலைத்தளம்": "website"
      "இது புதிய வலைத்தளம்.":
        native: "This is a new website."
        bases:
          "வலைத்தளம்": "website"
  "ta-2097":
    native: "app"
    notes:
      n1: "The word for an app; spoken Tamil often says the English ஆப் (āp)."
    examples:
      "செயலி நிறுவு.":
        native: "Install the app."
        bases:
          "செயலி": "app"
      "இது நல்ல செயலி.":
        native: "This is a good app."
        bases:
          "செயலி": "app"
  "ta-2098":
    native: "password"
    notes:
      n1: "Literally a pass word."
    examples:
      "கடவுச்சொல் என்ன?":
        native: "What is the password?"
        bases:
          "கடவுச்சொல்": "password"
      "கடவுச்சொல் மறக்காதே.":
        native: "Do not forget the password."
        bases:
          "கடவுச்சொல்": "password"
          "மறக்காதே": "do not forget; from மற (maṟa), to forget"
  "ta-2099":
    native: "charger"
    notes:
      n1: "The English loan for a phone charger."
    examples:
      "சார்ஜர் எங்கே?":
        native: "Where is the charger?"
        bases:
          "சார்ஜர்": "charger"
      "சார்ஜர் கொடு.":
        native: "Give me the charger."
        bases:
          "சார்ஜர்": "charger"
  "ta-2100":
    native: "battery"
    notes:
      n1: "The English loan for a battery."
    examples:
      "பேட்டரி இல்லை.":
        native: "There is no battery."
        bases:
          "பேட்டரி": "battery"
      "பேட்டரி குறைவு.":
        native: "The battery is low."
        bases:
          "பேட்டரி": "battery"
  "ta-2101":
    native: "screen; curtain"
    notes:
      n1: "A screen, and also a curtain or the cinema screen."
    examples:
      "திரை பார்.":
        native: "Look at the screen."
        bases:
          "திரை": "screen; curtain"
      "இது பெரிய திரை.":
        native: "This is a big screen."
        bases:
          "திரை": "screen; curtain"
  "ta-2102":
    native: "button"
    notes:
      n1: "A button on a phone or a shirt."
    examples:
      "பொத்தான் அழுத்து.":
        native: "Press the button."
        bases:
          "பொத்தான்": "button"
      "பொத்தான் எங்கே?":
        native: "Where is the button?"
        bases:
          "பொத்தான்": "button"
  "ta-2103":
    native: "sound; volume"
    notes:
      n1: "Sound, and so the volume of a device."
    examples:
      "ஒலி குறை.":
        native: "Turn the volume down."
        bases:
          "ஒலி": "sound; volume"
      "ஒலி அதிகம்.":
        native: "The sound is too loud."
        bases:
          "ஒலி": "sound; volume"
  "ta-2104":
    native: "signal"
    notes:
      n1: "The English loan for a phone signal."
    examples:
      "சிக்னல் இல்லை.":
        native: "There is no signal."
        bases:
          "சிக்னல்": "signal"
      "இங்கே சிக்னல் இல்லை.":
        native: "There is no signal here."
        bases:
          "சிக்னல்": "signal"
  "ta-2105":
    native: "recharge"
    notes:
      n1: "Topping up the phone's credit."
    examples:
      "ரீசார்ஜ் செய்.":
        native: "Recharge it."
        bases:
          "ரீசார்ஜ்": "recharge"
      "ரீசார்ஜ் எப்போது?":
        native: "When is the recharge?"
        bases:
          "ரீசார்ஜ்": "recharge"
  "ta-2106":
    native: "video"
    notes:
      n1: "The English loan for a video."
    examples:
      "வீடியோ பார்.":
        native: "Watch the video."
        bases:
          "வீடியோ": "video"
      "இது நல்ல வீடியோ.":
        native: "This is a good video."
        bases:
          "வீடியோ": "video"
  "ta-2107":
    native: "voice"
    notes:
      n1: "A person's voice."
    examples:
      "உன் குரல் நல்லது.":
        native: "Your voice is good."
        bases:
          "உன்": "your; from நீ (nī), you (to a friend or child)"
          "குரல்": "voice"
      "குரல் கேள்.":
        native: "Listen to the voice."
        bases:
          "குரல்": "voice"
  "ta-2108":
    native: "contact; connection"
    notes:
      n1: "A link with someone, as in a contact number."
    examples:
      "தொடர்பு இல்லை.":
        native: "There is no contact."
        bases:
          "தொடர்பு": "contact; connection"
      "அவர் தொடர்பு எண் என்ன?":
        native: "What is his contact number?"
        bases:
          "தொடர்பு": "contact; connection"
  "ta-2109":
    native: "address"
    notes:
      n1: "A postal or email address."
    examples:
      "முகவரி என்ன?":
        native: "What is the address?"
        bases:
          "முகவரி": "address"
      "முகவரி எழுது.":
        native: "Write the address."
        bases:
          "முகவரி": "address"
  "ta-2110":
    native: "laptop"
    notes:
      n1: "The English loan for a laptop; a computer is கணினி (kaṇiṉi)."
    examples:
      "லேப்டாப் எங்கே?":
        native: "Where is the laptop?"
        bases:
          "லேப்டாப்": "laptop"
      "இது புதிய லேப்டாப்.":
        native: "This is a new laptop."
        bases:
          "லேப்டாப்": "laptop"
  "ta-2111":
    native: "keyboard"
    notes:
      n1: "Made of விசை (vicai) (key) and பலகை (palakai) (board)."
    examples:
      "விசைப்பலகை எங்கே?":
        native: "Where is the keyboard?"
        bases:
          "விசைப்பலகை": "keyboard"
      "இது புதிய விசைப்பலகை.":
        native: "This is a new keyboard."
        bases:
          "விசைப்பலகை": "keyboard"
  "ta-2112":
    native: "file"
    notes:
      n1: "A computer file or a paper file."
    examples:
      "கோப்பு திற.":
        native: "Open the file."
        bases:
          "கோப்பு": "file"
      "கோப்பு எங்கே?":
        native: "Where is the file?"
        bases:
          "கோப்பு": "file"
  "ta-2113":
    native: "hello (on the phone)"
    notes:
      n1: "What people say on picking up a phone call; to greet face to face they say வணக்கம் (vaṇakkam)."
    examples:
      "ஹலோ, யார் பேசுகிறீர்கள்?":
        native: "Hello, who is speaking?"
        bases:
          "ஹலோ": "hello (on the phone)"
          "பேசுகிறீர்கள்": "are speaking; from பேசு (pēcu), to speak"
      "ஹலோ, கேட்கிறதா?":
        native: "Hello, can you hear me?"
        bases:
          "ஹலோ": "hello (on the phone)"
          "கேட்கிறதா": "is it audible; from கேள் (kēḷ), to listen; to ask"
  "ta-2114":
    native: "connection; link"
    notes:
      n1: "A connection, a link or an attachment."
    examples:
      "இணைப்பு இல்லை.":
        native: "There is no connection."
        bases:
          "இணைப்பு": "connection; link"
      "இணைப்பு நல்லது.":
        native: "The connection is good."
        bases:
          "இணைப்பு": "connection; link"
  "ta-2115":
    native: "information"
    notes:
      n1: "Information or a piece of news."
    examples:
      "தகவல் வேண்டும்.":
        native: "Information is wanted."
        bases:
          "தகவல்": "information"
      "தகவல் அனுப்பு.":
        native: "Send the information."
        bases:
          "தகவல்": "information"
  "ta-2116":
    native: "warning"
    notes:
      n1: "A warning or an alert."
    examples:
      "இது எச்சரிக்கை.":
        native: "This is a warning."
        bases:
          "எச்சரிக்கை": "warning"
      "எச்சரிக்கை பார்.":
        native: "Look at the warning."
        bases:
          "எச்சரிக்கை": "warning"
  "ta-2117":
    native: "notification; announcement"
    notes:
      n1: "A phone notification or a public announcement."
    examples:
      "அறிவிப்பு பார்.":
        native: "Look at the notification."
        bases:
          "அறிவிப்பு": "notification; announcement"
      "புதிய அறிவிப்பு.":
        native: "A new notification."
        bases:
          "அறிவிப்பு": "notification; announcement"
  "ta-2118":
    native: "speaker; loudspeaker"
    notes:
      n1: "A loudspeaker; made of ஒலி (oli) (sound) and a word for amplifying."
    examples:
      "ஒலிபெருக்கி எங்கே?":
        native: "Where is the speaker?"
        bases:
          "ஒலிபெருக்கி": "speaker; loudspeaker"
      "இது ஒலிபெருக்கி.":
        native: "This is a speaker."
        bases:
          "ஒலிபெருக்கி": "speaker; loudspeaker"
  "ta-2119":
    native: "headphones"
    notes:
      n1: "The English loan."
    examples:
      "ஹெட்போன் கொடு.":
        native: "Give me the headphones."
        bases:
          "ஹெட்போன்": "headphones"
      "ஹெட்போன் எங்கே?":
        native: "Where are the headphones?"
        bases:
          "ஹெட்போன்": "headphones"
  "ta-2120":
    native: "typing"
    notes:
      n1: "Typing on a keyboard; தட்டச்சு செய் (taṭṭaccu cey) is to type."
    examples:
      "தட்டச்சு பயிற்சி.":
        native: "Typing practice."
        bases:
          "தட்டச்சு": "typing"
      "நான் தட்டச்சு செய்கிறேன்.":
        native: "I am typing."
        bases:
          "தட்டச்சு": "typing"
          "செய்கிறேன்": "am doing; from செய் (cey), to do; to make"
  "ta-2121":
    native: "to download"
    notes:
      n1: "The verb for downloading a file or app."
    examples:
      "செயலி பதிவிறக்கு.":
        native: "Download the app."
        bases:
          "பதிவிறக்கு": "to download"
      "நான் பதிவிறக்குகிறேன்.":
        native: "I am downloading."
        bases:
          "பதிவிறக்குகிறேன்": "am downloading; from பதிவிறக்கு (pativiṟakku), to download"
  "ta-2122":
    native: "to connect; to attach"
    notes:
      n1: "To connect devices or attach a file."
    examples:
      "கோப்பு இணை.":
        native: "Attach the file."
        bases:
          "இணை": "to connect; to attach"
      "நான் இணைக்கிறேன்.":
        native: "I am connecting."
        bases:
          "இணைக்கிறேன்": "am connecting; from இணை (iṇai), to connect; to attach"
  "ta-2123":
    native: "to disconnect; to cut off"
    notes:
      n1: "To cut a line or end a connection."
    examples:
      "இணைப்பு துண்டி.":
        native: "Disconnect the link."
        bases:
          "துண்டி": "to disconnect; to cut off"
      "நான் துண்டிக்கிறேன்.":
        native: "I am disconnecting."
        bases:
          "துண்டிக்கிறேன்": "am disconnecting; from துண்டி (tuṇṭi), to disconnect; to cut off"
  "ta-2124":
    native: "to remove; to delete"
    notes:
      n1: "To remove or delete something."
    examples:
      "கோப்பு நீக்கு.":
        native: "Delete the file."
        bases:
          "நீக்கு": "to remove; to delete"
      "நான் நீக்குகிறேன்.":
        native: "I am deleting."
        bases:
          "நீக்குகிறேன்": "am deleting; from நீக்கு (nīkku), to remove; to delete"
  "ta-2125":
    native: "to update; to renew"
    notes:
      n1: "To update an app or renew a thing."
    examples:
      "செயலி புதுப்பி.":
        native: "Update the app."
        bases:
          "புதுப்பி": "to update; to renew"
      "நான் புதுப்பிக்கிறேன்.":
        native: "I am updating."
        bases:
          "புதுப்பிக்கிறேன்": "am updating; from புதுப்பி (putuppi), to update; to renew"
  "ta-2126":
    native: "to install; to set up"
    notes:
      n1: "To install software or to set something up."
    examples:
      "இங்கே நிறுவு.":
        native: "Install it here."
        bases:
          "நிறுவு": "to install; to set up"
      "நான் புதிய செயலி நிறுவுகிறேன்.":
        native: "I am installing a new app."
        bases:
          "நிறுவுகிறேன்": "am installing; from நிறுவு (niṟuvu), to install; to set up"
  "ta-2127":
    native: "to contact"
    notes:
      n1: "To get in touch with someone; made of தொடர்பு (toṭarpu) (contact) and கொள் (koḷ) (to take)."
    examples:
      "என்னைத் தொடர்புகொள்.":
        native: "Contact me."
        bases:
          "என்னைத்": "me; from நான் (nāṉ), I; me"
          "தொடர்புகொள்": "to contact"
      "நான் தொடர்புகொள்கிறேன்.":
        native: "I am getting in touch."
        bases:
