name: "A and the: ஒரு (oru)"
description: "Tamil has no the and uses ஒரு (oru) for a. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
pattern:
  name: "No articles"
  slot_name: "form"
  entries:
    "veedu": "house"
    "kaar": "car"
    "pena": "pen"
    "naay": "dog"
    "arai": "room"
    "aasiriyar": "teacher"
  notes: "Tamil has no word for the. A noun on its own means the one you both know, or the thing in general: கார் (kār). ஒரு (oru), one, is used as a: ஒரு கார் (oru kār). Before a word that starts with a vowel it is ஓர் (ōr): ஓர் அறை (ōr aṟai), a room. Source: English Wikipedia, Tamil grammar; English Wiktionary, ஓர் (the form of ஒரு before a vowel)."
