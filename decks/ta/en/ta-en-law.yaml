          "கிடைக்கிறது": "is received; is available; from கிடை (kiṭai), to be obtained"
      "விடுதலை நல்லது.":
        native: "Release is good."
        bases:
          "விடுதலை": "release; freedom"
  "ta-8422":
    native: "filing; submission"
    notes:
      n1: "Handing in a paper to a court or an office; the verb phrase is தாக்கல் செய் (tākkal cey), to file."
    examples:
      "அவர் மனு தாக்கல் செய்கிறார்.":
