          "கொடுக்கிறான்": "he gives; from கொடு (koṭu), to give"
      "வாக்குமூலம் எங்கே?":
        native: "Where is the statement?"
        bases:
          "வாக்குமூலம்": "statement; confession"
  "ta-8425":
    native: "summons"
