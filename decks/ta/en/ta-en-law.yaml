          "உறுதிமொழி": "oath; pledge"
  "ta-8418":
    native: "authority; power"
    notes:
      n1: "The power to decide; also a chapter of a book."
    examples:
      "அவருக்கு அதிகாரம் இருக்கிறது.":
        native: "He has authority."
        bases:
          "அவருக்கு": "to him or her (polite); for him or her (polite); from அவர் (avar), he or she (polite)"
          "அதிகாரம்": "authority; power"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "அதிகாரம் முக்கியம்.":
        native: "Authority is important."
        bases:
          "அதிகாரம்": "authority; power"
          "முக்கியம்": "important"
  "ta-8419":
    native: "order; command"
    notes:
      n1: "A formal order from a ruler or an office."
