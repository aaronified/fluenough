schema: 1
id: "ta-en-law"
kind: "layer"
core: "ta-law"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Law: police, courts, rights and the rules"
description: "Law and order: the law, courts, judges and verdicts, rights and rules, fines and prison, and the verbs for arresting, punishing and following the rules. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-8400":
    native: "law; act"
    notes:
      n1: "The law of a country, or a single act of the law."
    examples:
      "சட்டம் எல்லோருக்கும் ஒன்று.":
        native: "The law is the same for everyone."
        bases:
          "சட்டம்": "law; act"
          "எல்லோருக்கும்": "to everyone; for everyone; from எல்லோர் (ellōr), everyone"
      "நாம் சட்டத்தைப் பின்பற்றுகிறோம்.":
        native: "We follow the law."
        bases:
          "சட்டத்தைப்": "the law (object); from சட்டம் (caṭṭam), law"
          "பின்பற்றுகிறோம்": "we follow; from பின்பற்று (piṉpaṟṟu), to follow"
  "ta-8401":
    native: "judge"
    notes:
      n1: "The person who gives a verdict in court."
    examples:
      "நீதிபதி நீதிமன்றத்தில் இருக்கிறார்.":
        native: "The judge is in the court."
        bases:
          "நீதிபதி": "judge"
          "நீதிமன்றத்தில்": "in the court; from நீதிமன்றம் (nītimaṉṟam), court of law"
          "இருக்கிறார்": "is; from இரு (iru), to be"
      "நீதிபதி நல்லவர்.":
        native: "The judge is a good man."
        bases:
          "நீதிபதி": "judge"
          "நல்லவர்": "good man (polite); from நல்ல (nalla), good"
  "ta-8402":
    native: "punishment; sentence"
    notes:
      n1: "What a court gives to the guilty."
    examples:
      "அவனுக்குத் தண்டனை கிடைக்கிறது.":
        native: "He gets a punishment."
        bases:
          "அவனுக்குத்": "to him; for him; from அவன் (avaṉ), he; him"
          "தண்டனை": "punishment; sentence"
          "கிடைக்கிறது": "is received; is available; from கிடை (kiṭai), to be obtained"
      "தண்டனை பெரியது.":
        native: "The punishment is big."
        bases:
          "தண்டனை": "punishment; sentence"
          "பெரியது": "big; from பெரிய (periya), big"
  "ta-8403":
    native: "fine; penalty"
    notes:
      n1: "Money paid as a penalty."
    examples:
      "அவன் அபராதம் கட்டுகிறான்.":
        native: "He pays a fine."
        bases:
          "அபராதம்": "fine; penalty"
          "கட்டுகிறான்": "he pays; from கட்டு (kaṭṭu), to pay; to tie; to build"
      "அபராதம் எவ்வளவு?":
        native: "How much is the fine?"
        bases:
          "அபராதம்": "fine; penalty"
  "ta-8404":
    native: "prison; jail"
    notes:
      n1: "A place where the guilty are kept."
    examples:
      "அவன் சிறையில் இருக்கிறான்.":
        native: "He is in prison."
        bases:
          "சிறையில்": "in prison; from சிறை (ciṟai), prison"
          "இருக்கிறான்": "is; from இரு (iru), to be"
      "சிறை பெரியது.":
        native: "The prison is big."
        bases:
          "சிறை": "prison; jail"
          "பெரியது": "big; from பெரிய (periya), big"
  "ta-8405":
    native: "right; ownership; claim"
    notes:
      n1: "Something a person is allowed to have or do."
    examples:
      "இது என் உரிமை.":
        native: "This is my right."
        bases:
          "என்": "my; from நான் (nāṉ), I"
          "உரிமை": "right; ownership; claim"
      "உனக்கு உரிமை இருக்கிறது.":
        native: "You have a right."
        bases:
          "உனக்கு": "to you; from நீ (nī), you"
          "உரிமை": "right; ownership; claim"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-8406":
    native: "petition; application"
    notes:
      n1: "A written request given to an office or a court."
    examples:
      "நான் மனு கொடுக்கிறேன்.":
        native: "I give a petition."
        bases:
          "மனு": "petition; application"
          "கொடுக்கிறேன்": "I give; from கொடு (koṭu), to give"
      "மனு எங்கே?":
        native: "Where is the petition?"
        bases:
          "மனு": "petition; application"
  "ta-8407":
    native: "order; permission"
    notes:
      n1: "An order given by a court or an officer."
    examples:
      "இது நீதிமன்ற உத்தரவு.":
        native: "This is a court order."
        bases:
          "நீதிமன்ற": "court (before a noun); from நீதிமன்றம் (nītimaṉṟam), court of law"
          "உத்தரவு": "order; permission"
      "உத்தரவு எங்கே?":
        native: "Where is the order?"
        bases:
          "உத்தரவு": "order; permission"
  "ta-8408":
    native: "rule; regulation"
    notes:
      n1: "Built from விதி (viti), rule and முறை (muṟai), method; the written rules of an office."
    examples:
      "இது விதிமுறை.":
        native: "This is a rule."
        bases:
          "விதிமுறை": "rule; regulation"
      "விதிமுறை முக்கியம்.":
        native: "The rule is important."
        bases:
          "விதிமுறை": "rule; regulation"
          "முக்கியம்": "important"
  "ta-8409":
    native: "citizen"
    notes:
      n1: "A man who belongs to a country; the woman is குடிமகள் (kuṭimakaḷ), woman citizen."
    examples:
      "அவன் இந்த நாட்டின் குடிமகன்.":
        native: "He is a citizen of this country."
        bases:
          "இந்த": "this (before a noun)"
          "நாட்டின்": "of the country; from நாடு (nāṭu), country"
          "குடிமகன்": "citizen"
      "குடிமகன் வாக்கு அளிக்கிறான்.":
        native: "The citizen casts a vote."
        bases:
          "குடிமகன்": "citizen"
          "அளிக்கிறான்": "he gives; from அளி (aḷi), to give"
  "ta-8410":
    native: "citizenship"
    notes:
      n1: "Built from குடி (kuṭi), people and உரிமை (urimai), right."
    examples:
      "எனக்குக் குடியுரிமை இருக்கிறது.":
        native: "I have citizenship."
        bases:
          "எனக்குக்": "to me; for me; from நான் (nāṉ), I; me"
          "குடியுரிமை": "citizenship"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "குடியுரிமை முக்கியம்.":
        native: "Citizenship is important."
        bases:
          "குடியுரிமை": "citizenship"
          "முக்கியம்": "important"
  "ta-8411":
    native: "constitution"
    notes:
      n1: "The basic law of a country."
    examples:
      "இது அரசியலமைப்பு.":
        native: "This is the constitution."
        bases:
          "அரசியலமைப்பு": "constitution"
      "அரசியலமைப்பு முக்கியம்.":
        native: "The constitution is important."
        bases:
          "அரசியலமைப்பு": "constitution"
          "முக்கியம்": "important"
  "ta-8412":
    native: "justice; fairness"
    notes:
      n1: "A fair judgement; நீதி (nīti) is also a short moral saying."
    examples:
      "எல்லோருக்கும் நீதி வேண்டும்.":
        native: "Everyone needs justice."
        bases:
          "எல்லோருக்கும்": "to everyone; for everyone; from எல்லோர் (ellōr), everyone"
          "நீதி": "justice; fairness"
      "நீதி முக்கியம்.":
        native: "Justice is important."
        bases:
          "நீதி": "justice; fairness"
          "முக்கியம்": "important"
  "ta-8413":
    native: "bail; surety"
    notes:
      n1: "Money or a promise given so that an arrested person can go free for now."
    examples:
      "அவனுக்குப் பிணை கிடைக்கிறது.":
        native: "He gets bail."
        bases:
          "அவனுக்குப்": "to him; for him; from அவன் (avaṉ), he; him"
          "பிணை": "bail; surety"
          "கிடைக்கிறது": "is received; is available; from கிடை (kiṭai), to be obtained"
      "பிணை எவ்வளவு?":
        native: "How much is the bail?"
        bases:
          "பிணை": "bail; surety"
  "ta-8414":
    native: "inquiry; trial; hearing"
    notes:
      n1: "The questioning in a court or by the police; from விசாரி (vicāri), to enquire."
    examples:
      "இன்று விசாரணை இருக்கிறது.":
        native: "There is a hearing today."
        bases:
          "விசாரணை": "inquiry; trial; hearing"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "விசாரணை எப்போது?":
        native: "When is the hearing?"
        bases:
          "விசாரணை": "inquiry; trial; hearing"
  "ta-8415":
    native: "accusation; charge"
    notes:
      n1: "Built from குற்றம் (kuṟṟam), crime and சாட்டு (cāṭṭu), to lay on."
    examples:
      "அவன் மேல் குற்றச்சாட்டு இருக்கிறது.":
        native: "There is a charge against him."
        bases:
