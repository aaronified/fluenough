      "இது அரசு ஆணை.":
        native: "This is a government order."
        bases:
          "ஆணை": "order; command"
      "ஆணை எங்கே?":
        native: "Where is the order?"
        bases:
          "ஆணை": "order; command"
  "ta-8420":
    native: "innocent person"
    notes:
      n1: "Built from நிர (nira), without and அபராதி (aparāti), offender."
    examples:
      "அவன் நிரபராதி.":
        native: "He is innocent."
        bases:
          "நிரபராதி": "innocent person"
      "நிரபராதி விடுதலை ஆகிறான்.":
        native: "The innocent man is released."
        bases:
          "நிரபராதி": "innocent person"
