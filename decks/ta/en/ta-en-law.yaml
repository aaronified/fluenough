          "குற்றச்சாட்டு": "accusation; charge"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "குற்றச்சாட்டு பெரியது.":
        native: "The charge is serious."
        bases:
          "குற்றச்சாட்டு": "accusation; charge"
          "பெரியது": "big; from பெரிய (periya), big"
  "ta-8416":
    native: "appeal"
    notes:
      n1: "Built from மேல் (mēl), upper and முறையீடு (muṟaiyīṭu), complaint: an appeal to a higher court."
    examples:
      "அவன் மேல்முறையீடு செய்கிறான்.":
        native: "He makes an appeal."
        bases:
          "மேல்முறையீடு": "appeal"
          "செய்கிறான்": "is doing; from செய் (cey), to do; to make"
      "மேல்முறையீடு எப்போது?":
        native: "When is the appeal?"
        bases:
          "மேல்முறையீடு": "appeal"
  "ta-8417":
    native: "oath; pledge"
    notes:
      n1: "Built from உறுதி (uṟuti), firm and மொழி (moḻi), word."
    examples:
      "அவன் உறுதிமொழி எடுக்கிறான்.":
        native: "He takes an oath."
        bases:
          "உறுதிமொழி": "oath; pledge"
          "எடுக்கிறான்": "he takes; from எடு (eṭu), to take"
      "இது என் உறுதிமொழி.":
