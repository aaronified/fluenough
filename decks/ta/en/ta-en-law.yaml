schema: 1
id: "ta-en-law"
kind: "layer"
core: "ta-law"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Law: police, courts, rights and the rules"
description: "Law and order: the law, courts, judges and verdicts, rights and rules, fines and prison, and the verbs for arresting, punishing and following the rules. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-8400":
    native: "criminal law; criminology"
    notes:
      n1: "The branch of law that deals with crime."
    examples:
      "இது குற்றவியல் வழக்கு.":
        native: "This is a criminal case."
        bases:
          "குற்றவியல்": "criminal law; criminology"
      "அவர் குற்றவியல் படிக்கிறார்.":
        native: "He studies criminal law."
        bases:
          "குற்றவியல்": "criminal law; criminology"
          "படிக்கிறார்": "studies; from படி (paṭi), to study"
  "ta-8401":
    native: "guardian; protector"
    notes:
      n1: "A person who legally looks after another."
    examples:
      "அவர் குழந்தையின் பாதுகாவலர்.":
        native: "He is the child's guardian."
        bases:
          "குழந்தையின்": "of the child; from குழந்தை (kuḻantai), child"
          "பாதுகாவலர்": "guardian; protector"
      "பாதுகாவலர் இங்கே இருக்கிறார்.":
        native: "The guardian is here."
        bases:
          "பாதுகாவலர்": "guardian; protector"
          "இருக்கிறார்": "is; from இரு (iru), to be"
  "ta-8402":
    native: "government order"
    notes:
      n1: "Built from அரசு (aracu), government and ஆணை (āṇai), order."
    examples:
      "இது அரசாணை.":
        native: "This is a government order."
        bases:
          "அரசாணை": "government order"
      "அரசாணை எங்கே?":
        native: "Where is the government order?"
        bases:
          "அரசாணை": "government order"
  "ta-8403":
    native: "stay order; injunction"
    notes:
      n1: "A court order that stops something."
    examples:
      "நீதிமன்றம் தடையாணை கொடுக்கிறது.":
        native: "The court gives a stay order."
        bases:
          "தடையாணை": "stay order; injunction"
          "கொடுக்கிறது": "is giving; from கொடு (koṭu), to give"
      "தடையாணை எப்போது?":
        native: "When is the stay order?"
        bases:
          "தடையாணை": "stay order; injunction"
  "ta-8404":
    native: "section of a law; clause"
    notes:
      n1: "Built from சட்டம் (caṭṭam), law and பிரிவு (pirivu), section, a word taught earlier."
    examples:
      "இது சட்டப்பிரிவு.":
        native: "This is a section of the law."
        bases:
          "சட்டப்பிரிவு": "section of a law; clause"
      "சட்டப்பிரிவு எங்கே?":
        native: "Where is the section?"
        bases:
          "சட்டப்பிரிவு": "section of a law; clause"
  "ta-8405":
    native: "heir; descendant"
    notes:
      n1: "The person who inherits; it also means an offspring."
    examples:
      "அவர் வாரிசு.":
        native: "He is an heir."
        bases:
          "வாரிசு": "heir; descendant"
      "வாரிசு இங்கே இருக்கிறார்.":
        native: "The heir is here."
        bases:
          "வாரிசு": "heir; descendant"
          "இருக்கிறார்": "is; from இரு (iru), to be"
  "ta-8406":
    native: "property; wealth"
    notes:
      n1: "What a person owns: land, a house or money."
    examples:
      "இது என் சொத்து.":
        native: "This is my property."
        bases:
          "என்": "my; from நான் (nāṉ), I"
          "சொத்து": "property; wealth"
      "சொத்து பெரியது.":
        native: "The property is big."
        bases:
          "சொத்து": "property; wealth"
          "பெரியது": "big; from பெரிய (periya), big"
  "ta-8407":
    native: "will; testament"
    notes:
      n1: "A paper in which a person says who gets the property after death."
    examples:
      "இது அவர் உயில்.":
        native: "This is his will."
        bases:
          "உயில்": "will; testament"
      "உயில் எங்கே?":
        native: "Where is the will?"
        bases:
          "உயில்": "will; testament"
  "ta-8408":
    native: "rule; regulation"
    notes:
      n1: "Built from விதி (viti), rule and முறை (muṟai), method; the written rules of an office."
    examples:
      "இது விதிமுறை.":
        native: "This is a rule."
        bases:
          "விதிமுறை": "rule; regulation"
      "விதிமுறை முக்கியம்.":
        native: "The rule is important."
        bases:
          "விதிமுறை": "rule; regulation"
          "முக்கியம்": "important"
  "ta-8409":
    native: "divorce"
    notes:
      n1: "A legal end to a marriage; a loanword from Sanskrit."
    examples:
      "அவர்களுக்கு விவாகரத்து நடக்கிறது.":
        native: "They are getting a divorce."
        bases:
          "அவர்களுக்கு": "to them; for them; from அவர்கள் (avarkaḷ), they"
          "விவாகரத்து": "divorce"
          "நடக்கிறது": "happens; from நட (naṭa), to walk; to happen"
      "விவாகரத்து எளிது இல்லை.":
        native: "Divorce is not easy."
        bases:
          "விவாகரத்து": "divorce"
          "எளிது": "easy; simple"
  "ta-8410":
    native: "lease; contract farming"
    notes:
      n1: "Land or a house held for a fixed time for a payment."
    examples:
      "இது குத்தகை நிலம்.":
        native: "This is leased land."
        bases:
          "குத்தகை": "lease; contract farming"
      "குத்தகை எப்போது முடிகிறது?":
        native: "When does the lease end?"
        bases:
          "குத்தகை": "lease; contract farming"
          "முடிகிறது": "ends; finishes; from முடி (muṭi), to end; to finish"
  "ta-8411":
    native: "witness box"
    notes:
      n1: "Built from சாட்சி (cāṭci), witness and கூண்டு (kūṇṭu), cage."
    examples:
      "சாட்சி சாட்சிக்கூண்டில் இருக்கிறார்.":
        native: "The witness is in the witness box."
        bases:
          "சாட்சிக்கூண்டில்": "in the witness box; from சாட்சிக்கூண்டு (cāṭcikkūṇṭu), witness box"
          "இருக்கிறார்": "is; from இரு (iru), to be"
      "சாட்சிக்கூண்டு எங்கே?":
        native: "Where is the witness box?"
        bases:
          "சாட்சிக்கூண்டு": "witness box"
  "ta-8412":
    native: "justice; fairness"
    notes:
      n1: "A fair judgement; நீதி (nīti) is also a short moral saying."
    examples:
      "எல்லோருக்கும் நீதி வேண்டும்.":
        native: "Everyone needs justice."
        bases:
          "எல்லோருக்கும்": "to everyone; for everyone; from எல்லோர் (ellōr), everyone"
          "நீதி": "justice; fairness"
      "நீதி முக்கியம்.":
        native: "Justice is important."
        bases:
          "நீதி": "justice; fairness"
          "முக்கியம்": "important"
  "ta-8413":
    native: "bail; surety"
    notes:
      n1: "Money or a promise given so that an arrested person can go free for now."
    examples:
      "அவனுக்குப் பிணை கிடைக்கிறது.":
        native: "He gets bail."
        bases:
          "அவனுக்குப்": "to him; for him; from அவன் (avaṉ), he; him"
          "பிணை": "bail; surety"
          "கிடைக்கிறது": "is received; is available; from கிடை (kiṭai), to be obtained"
      "பிணை எவ்வளவு?":
        native: "How much is the bail?"
        bases:
          "பிணை": "bail; surety"
  "ta-8414":
    native: "inquiry; trial; hearing"
    notes:
      n1: "The questioning in a court or by the police; from விசாரி (vicāri), to enquire."
    examples:
      "இன்று விசாரணை இருக்கிறது.":
        native: "There is a hearing today."
        bases:
          "விசாரணை": "inquiry; trial; hearing"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "விசாரணை எப்போது?":
        native: "When is the hearing?"
        bases:
          "விசாரணை": "inquiry; trial; hearing"
  "ta-8415":
    native: "accusation; charge"
    notes:
      n1: "Built from குற்றம் (kuṟṟam), crime and சாட்டு (cāṭṭu), to lay on."
    examples:
      "அவன் மேல் குற்றச்சாட்டு இருக்கிறது.":
        native: "There is a charge against him."
        bases:
          "மேல்": "on; over; about"
          "குற்றச்சாட்டு": "accusation; charge"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "குற்றச்சாட்டு பெரியது.":
        native: "The charge is serious."
        bases:
          "குற்றச்சாட்டு": "accusation; charge"
          "பெரியது": "big; from பெரிய (periya), big"
  "ta-8416":
    native: "appeal"
    notes:
      n1: "Built from மேல் (mēl), upper and முறையீடு (muṟaiyīṭu), complaint: an appeal to a higher court."
    examples:
      "அவன் மேல்முறையீடு செய்கிறான்.":
        native: "He makes an appeal."
        bases:
          "மேல்முறையீடு": "appeal"
          "செய்கிறான்": "is doing; from செய் (cey), to do; to make"
      "மேல்முறையீடு எப்போது?":
        native: "When is the appeal?"
        bases:
          "மேல்முறையீடு": "appeal"
  "ta-8417":
    native: "life sentence"
    notes:
      n1: "Built from ஆயுள் (āyuḷ), lifetime and தண்டனை (taṇṭaṉai), punishment."
    examples:
      "அவனுக்கு ஆயுள்தண்டனை கிடைக்கிறது.":
        native: "He gets a life sentence."
        bases:
          "அவனுக்கு": "to him; for him; from அவன் (avaṉ), he; him"
          "ஆயுள்தண்டனை": "life sentence"
          "கிடைக்கிறது": "is received; is available; from கிடை (kiṭai), to be obtained"
      "ஆயுள்தண்டனை பெரியது.":
        native: "A life sentence is serious."
        bases:
          "ஆயுள்தண்டனை": "life sentence"
          "பெரியது": "big; from பெரிய (periya), big"
  "ta-8418":
    native: "authority; power"
    notes:
      n1: "The power to decide; also a chapter of a book."
    examples:
      "அவருக்கு அதிகாரம் இருக்கிறது.":
        native: "He has authority."
        bases:
          "அவருக்கு": "to him or her (polite); for him or her (polite); from அவர் (avar), he or she (polite)"
          "அதிகாரம்": "authority; power"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "அதிகாரம் முக்கியம்.":
        native: "Authority is important."
        bases:
          "அதிகாரம்": "authority; power"
          "முக்கியம்": "important"
  "ta-8419":
    native: "order; command"
    notes:
      n1: "A formal order from a ruler or an office."
    examples:
      "இது அரசு ஆணை.":
        native: "This is a government order."
        bases:
          "ஆணை": "order; command"
      "ஆணை எங்கே?":
        native: "Where is the order?"
        bases:
          "ஆணை": "order; command"
  "ta-8420":
    native: "innocent person"
    notes:
      n1: "Built from நிர (nira), without and அபராதி (aparāti), offender."
    examples:
      "அவன் நிரபராதி.":
        native: "He is innocent."
        bases:
          "நிரபராதி": "innocent person"
      "நிரபராதி விடுதலை ஆகிறான்.":
        native: "The innocent man is released."
        bases:
          "நிரபராதி": "innocent person"
          "ஆகிறான்": "he becomes; from ஆகு (āku), to become"
  "ta-8421":
    native: "release; freedom"
    notes:
      n1: "Being set free from prison or from a bond."
    examples:
      "அவனுக்கு விடுதலை கிடைக்கிறது.":
        native: "He gets release."
        bases:
          "அவனுக்கு": "to him; for him; from அவன் (avaṉ), he; him"
          "விடுதலை": "release; freedom"
          "கிடைக்கிறது": "is received; is available; from கிடை (kiṭai), to be obtained"
      "விடுதலை நல்லது.":
        native: "Release is good."
        bases:
          "விடுதலை": "release; freedom"
  "ta-8422":
    native: "filing; submission"
    notes:
      n1: "Handing in a paper to a court or an office; the verb phrase is தாக்கல் செய் (tākkal cey), to file."
    examples:
      "அவர் மனு தாக்கல் செய்கிறார்.":
        native: "He files a petition."
        bases:
          "தாக்கல்": "filing; submission"
          "செய்கிறார்": "he does; from செய் (cey), to do"
      "தாக்கல் எப்போது?":
        native: "When is the filing?"
        bases:
          "தாக்கல்": "filing; submission"
  "ta-8423":
    native: "testimony; evidence given"
    notes:
      n1: "What a witness says in court."
    examples:
      "சாட்சியம் முக்கியம்.":
        native: "Testimony is important."
        bases:
          "சாட்சியம்": "testimony; evidence given"
          "முக்கியம்": "important"
      "அவர் சாட்சியம் சொல்கிறார்.":
        native: "He gives testimony."
        bases:
          "சாட்சியம்": "testimony; evidence given"
          "சொல்கிறார்": "he says; from சொல் (col), to say; to tell"
  "ta-8424":
    native: "statement; confession"
    notes:
      n1: "A statement given to the police or a court."
    examples:
      "அவன் வாக்குமூலம் கொடுக்கிறான்.":
        native: "He gives a statement."
        bases:
          "வாக்குமூலம்": "statement; confession"
          "கொடுக்கிறான்": "he gives; from கொடு (koṭu), to give"
      "வாக்குமூலம் எங்கே?":
        native: "Where is the statement?"
        bases:
          "வாக்குமூலம்": "statement; confession"
  "ta-8425":
    native: "summons"
    notes:
      n1: "A loanword from English summons: a paper that calls a person to court."
    examples:
      "எனக்குச் சம்மன் வந்தது.":
        native: "A summons came to me."
        bases:
          "எனக்குச்": "to me; from நான் (nāṉ), I"
          "சம்மன்": "summons"
          "வந்தது": "came; from வா (vā), to come"
      "சம்மன் எங்கே?":
        native: "Where is the summons?"
        bases:
          "சம்மன்": "summons"
  "ta-8426":
    native: "criminals; the guilty"
    notes:
      n1: "The plural of குற்றவாளி (kuṟṟavāḷi), criminal, a word taught earlier, which takes -கள் (-kaḷ)."
    examples:
      "குற்றவாளிகள் சிறையில் இருக்கிறார்கள்.":
        native: "The criminals are in prison."
        bases:
          "குற்றவாளிகள்": "criminals; the guilty"
          "சிறையில்": "in prison; from சிறை (ciṟai), prison"
          "இருக்கிறார்கள்": "are; from இரு (iru), to be"
      "குற்றவாளிகள் இங்கே இல்லை.":
        native: "The criminals are not here."
        bases:
          "குற்றவாளிகள்": "criminals; the guilty"
  "ta-8427":
    native: "prison; jail"
    notes:
      n1: "Built from சிறை (ciṟai), prison and சாலை (cālai), hall; a more formal word for prison."
    examples:
      "சிறைச்சாலை எங்கே இருக்கிறது?":
        native: "Where is the prison?"
        bases:
          "சிறைச்சாலை": "prison; jail"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "சிறைச்சாலை பெரியது.":
        native: "The prison is big."
        bases:
          "சிறைச்சாலை": "prison; jail"
          "பெரியது": "big; from பெரிய (periya), big"
  "ta-8428":
    native: "judiciary; the courts"
    notes:
      n1: "Built from நீதி (nīti), justice and துறை (tuṟai), department."
    examples:
      "இது நீதித்துறை.":
        native: "This is the judiciary."
        bases:
          "நீதித்துறை": "judiciary; the courts"
      "நீதித்துறை முக்கியம்.":
        native: "The judiciary is important."
        bases:
          "நீதித்துறை": "judiciary; the courts"
          "முக்கியம்": "important"
  "ta-8429":
    native: "to arrest"
    notes:
      n1: "Built from கைது (kaitu), arrest, a word taught earlier, and செய் (cey), to do."
    examples:
      "திருடனைக் கைதுசெய்.":
        native: "Arrest the thief."
        bases:
          "திருடனைக்": "the thief (object); from திருடன் (tiruṭaṉ), thief"
          "கைதுசெய்": "to arrest"
      "போலீஸ் அவனைக் கைதுசெய்கிறது.":
