schema: 1
id: "ta-en-technology"
kind: "layer"
core: "ta-technology"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Technology: computers, apps and the internet"
description: "Computers, phones and the internet beyond the basics: software and data, downloads and updates, settings and security, social media, and the verbs of clicking, logging in and following. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-7384":
    native: "technology"
    notes:
      n1: "Built from தொழில் (toḻil) (craft or trade) and நுட்பம் (nuṭpam) (fine skill); written as one word."
    examples:
      "தொழில்நுட்பம் வளர்கிறது.":
        native: "Technology is growing."
        bases:
          "தொழில்நுட்பம்": "technology"
          "வளர்கிறது": "is growing; from வளர் (vaḷar), to grow"
      "எனக்குத் தொழில்நுட்பம் பிடிக்கும்.":
        native: "I like technology."
        bases:
          "எனக்குத்": "to me; for me; from நான் (nāṉ), I; me"
          "தொழில்நுட்பம்": "technology"
  "ta-7385":
    native: "software"
    notes:
      n1: "Literally soft thing; மென் (meṉ) (soft) plus பொருள் (poruḷ) (thing), the pair of வன்பொருள் (vaṉporuḷ) (hardware)."
    examples:
      "இந்த மென்பொருள் இலவசம்.":
        native: "This software is free."
        bases:
          "இந்த": "this"
          "மென்பொருள்": "software"
      "மென்பொருள் வேலை செய்யவில்லை.":
        native: "The software is not working."
        bases:
          "மென்பொருள்": "software"
          "செய்யவில்லை": "did not do; is not working; from செய் (cey), to do"
  "ta-7386":
    native: "hardware"
    notes:
      n1: "Literally hard thing; வன் (vaṉ) (hard) plus பொருள் (poruḷ) (thing), the pair of மென்பொருள் (meṉporuḷ) (software)."
    examples:
      "இது கணினி வன்பொருள்.":
        native: "This is computer hardware."
        bases:
          "வன்பொருள்": "hardware"
      "வன்பொருள் விலை அதிகம்.":
        native: "The hardware is expensive."
        bases:
          "வன்பொருள்": "hardware"
  "ta-7387":
    native: "data"
    notes:
      n1: "The written word for data; in speech people say டேட்டா (ṭēṭṭā) (the English word)."
    examples:
      "தரவு எங்கே?":
        native: "Where is the data?"
        bases:
          "தரவு": "data"
      "தரவு சேமிக்கிறேன்.":
        native: "I am saving the data."
        bases:
          "தரவு": "data"
          "சேமிக்கிறேன்": "am saving; from சேமி (cēmi), to save"
  "ta-7388":
    native: "website"
    notes:
      n1: "Written as one word; people also say வலைத்தளம் (valaittaḷam) (web site) and வெப்சைட் (vepcaiṭ) (website)."
    examples:
      "இது அரசு இணையதளம்.":
        native: "This is a government website."
        bases:
          "அரசு": "government; state; kingdom"
          "இணையதளம்": "website"
      "இணையதளம் திறக்கிறது.":
        native: "The website is opening."
        bases:
          "இணையதளம்": "website"
          "திறக்கிறது": "is opening; from திற (tiṟa), to open"
  "ta-7389":
    native: "download"
    notes:
      n1: "Literally record coming down; பதிவு (pativu) (record) plus இறக்கம் (iṟakkam) (coming down); the opposite is பதிவேற்றம் (pativēṟṟam)."
    examples:
      "பதிவிறக்கம் முடிந்தது.":
        native: "The download is finished."
        bases:
          "பதிவிறக்கம்": "download"
          "முடிந்தது": "finished; ended; from முடி (muṭi), to end; to finish"
      "பதிவிறக்கம் மெதுவாக இருக்கிறது.":
        native: "The download is slow."
        bases:
          "பதிவிறக்கம்": "download"
          "மெதுவாக": "slowly"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7390":
    native: "upload"
    notes:
      n1: "Literally record going up; பதிவு (pativu) (record) plus ஏற்றம் (ēṟṟam) (going up); the opposite is பதிவிறக்கம் (pativiṟakkam)."
    examples:
      "பதிவேற்றம் நடக்கிறது.":
        native: "The upload is going on."
        bases:
          "பதிவேற்றம்": "upload"
          "நடக்கிறது": "happens; from நட (naṭa), to walk; to happen"
      "படத்தின் பதிவேற்றம் முடிந்தது.":
        native: "The upload of the photo is finished."
        bases:
          "படத்தின்": "of the film; from படம் (paṭam), film"
          "பதிவேற்றம்": "upload"
          "முடிந்தது": "finished; ended; from முடி (muṭi), to end; to finish"
  "ta-7391":
    native: "search engine"
    notes:
      n1: "Literally search machine; தேடு (tēṭu) (search) plus பொறி (poṟi) (machine)."
    examples:
      "தேடுபொறியில் தேடு.":
        native: "Search on the search engine."
        bases:
          "தேடுபொறியில்": "in the search engine; from தேடுபொறி (tēṭupoṟi), search engine"
      "இது நல்ல தேடுபொறி.":
        native: "This is a good search engine."
        bases:
          "தேடுபொறி": "search engine"
  "ta-7392":
    native: "screenshot"
    notes:
      n1: "You 'take' (எடு (eṭu)) a screenshot; in speech people say ஸ்கிரீன்ஷாட் (skirīṉṣāṭ) (screenshot)."
    examples:
      "திரைப்பிடிப்பு எடு.":
        native: "Take a screenshot."
        bases:
          "திரைப்பிடிப்பு": "screenshot"
      "என் திரைப்பிடிப்பு இங்கே இருக்கிறது.":
        native: "My screenshot is here."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "திரைப்பிடிப்பு": "screenshot"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7393":
    native: "settings"
    notes:
      n1: "A plural noun by form; the phone menu 'Settings' is written this way."
    examples:
      "அமைப்புகள் எங்கே?":
        native: "Where are the settings?"
        bases:
          "அமைப்புகள்": "settings"
      "அமைப்புகளைப் பார்.":
        native: "Look at the settings."
        bases:
          "அமைப்புகளைப்": "the settings; from அமைப்புகள் (amaippukaḷ), settings"
  "ta-7394":
    native: "update"
    notes:
      n1: "The noun of புதுப்பி (putuppi) (to renew), the verb that is already in the course."
    examples:
      "புதிய புதுப்பிப்பு இருக்கிறது.":
        native: "There is a new update."
        bases:
          "புதுப்பிப்பு": "update"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "புதுப்பிப்பு வேண்டும்.":
        native: "An update is needed."
        bases:
          "புதுப்பிப்பு": "update"
  "ta-7395":
    native: "user"
    notes:
      n1: "A user of an app or a service, used for men and women alike."
    examples:
      "அவர் புதிய பயனர்.":
        native: "He is a new user."
        bases:
          "அவர்": "he or she (polite)"
          "பயனர்": "user"
      "பயனர் பெயர் என்ன?":
        native: "What is the username?"
        bases:
          "பயனர்": "user"
  "ta-7396":
    native: "smartphone"
    notes:
      n1: "Literally skill phone; திறன் (tiṟaṉ) (skill) plus பேசி (pēci) (phone); in speech people say ஸ்மார்ட்போன் (smārṭpōṉ)."
    examples:
      "என் திறன்பேசி புதியது.":
        native: "My smartphone is new."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "திறன்பேசி": "smartphone"
          "புதியது": "is new; from புதிய (putiya), new"
      "திறன்பேசி எங்கே?":
        native: "Where is the smartphone?"
        bases:
          "திறன்பேசி": "smartphone"
  "ta-7397":
    native: "smartphone (spoken)"
    notes:
      n1: "The everyday spoken word, said as in English; the written word is திறன்பேசி (tiṟaṉpēci)."
    examples:
      "என் ஸ்மார்ட்போன் இங்கே.":
        native: "My smartphone is here."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "ஸ்மார்ட்போன்": "smartphone (spoken)"
      "ஸ்மார்ட்போன் விலை அதிகம்.":
        native: "The smartphone is expensive."
        bases:
          "ஸ்மார்ட்போன்": "smartphone (spoken)"
  "ta-7398":
    native: "tablet"
    notes:
      n1: "A loanword from English, said as it is."
    examples:
      "டேப்லெட் எங்கே?":
        native: "Where is the tablet?"
        bases:
          "டேப்லெட்": "tablet"
      "இது புதிய டேப்லெட்.":
        native: "This is a new tablet."
        bases:
          "டேப்லெட்": "tablet"
  "ta-7399":
    native: "touchscreen"
    notes:
      n1: "தொடு (toṭu) (touch) plus திரை (tirai) (screen); written as one word."
    examples:
      "தொடுதிரை உடைந்தது.":
        native: "The touchscreen broke."
        bases:
          "தொடுதிரை": "touchscreen"
          "உடைந்தது": "broke; from உடை (uṭai), to break"
      "இது தொடுதிரை தொலைபேசி.":
        native: "This is a touchscreen phone."
        bases:
          "தொடுதிரை": "touchscreen"
  "ta-7400":
    native: "screen (spoken)"
    notes:
      n1: "The spoken word for a phone or computer screen; the written word is திரை (tirai)."
    examples:
      "ஸ்கிரீன் பெரிது.":
        native: "The screen is big."
        bases:
          "ஸ்கிரீன்": "screen (spoken)"
          "பெரிது": "big"
      "ஸ்கிரீன் சுத்தம் செய்.":
        native: "Clean the screen."
        bases:
          "ஸ்கிரீன்": "screen (spoken)"
  "ta-7401":
    native: "earphones; headphones"
    notes:
      n1: "காது (kātu) (ear) plus ஒலிப்பான் (olippāṉ) (sound maker); in speech people say ஹெட்போன் (heṭpōṉ) (headphone)."
    examples:
      "காதொலிப்பான் வேண்டும்.":
        native: "I need earphones."
        bases:
          "காதொலிப்பான்": "earphones; headphones"
      "என் காதொலிப்பான் எங்கே?":
        native: "Where are my earphones?"
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "காதொலிப்பான்": "earphones; headphones"
  "ta-7402":
    native: "network"
    notes:
      n1: "வலை (valai) (net) plus அமைப்பு (amaippu) (system); the signal-and-network sense used for phones and the internet."
    examples:
      "வலையமைப்பு இல்லை.":
        native: "There is no network."
        bases:
          "வலையமைப்பு": "network"
      "வலையமைப்பு வேகமாக இருக்கிறது.":
        native: "The network is fast."
        bases:
          "வலையமைப்பு": "network"
          "வேகமாக": "fast; from வேகம் (vēkam), speed"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7403":
    native: "app (spoken)"
    notes:
      n1: "The everyday spoken word; the written word is செயலி (ceyali), already in the course."
    examples:
      "இது நல்ல ஆப்.":
        native: "This is a good app."
        bases:
          "ஆப்": "app (spoken)"
      "புதிய ஆப் பதிவிறக்கு.":
        native: "Download a new app."
        bases:
          "ஆப்": "app (spoken)"
  "ta-7404":
    native: "share; sharing"
    notes:
      n1: "The noun of பகிர் (pakir) (to share); the 'Share' button on a phone says this."
    examples:
      "பகிர்வு வேண்டாம்.":
        native: "No sharing, please."
        bases:
          "பகிர்வு": "share; sharing"
      "இந்தப் பகிர்வு நல்லது.":
        native: "This share is good."
        bases:
          "இந்தப்": "this; from இந்த (inta), this (before a noun)"
          "பகிர்வு": "share; sharing"
  "ta-7405":
    native: "comment (online)"
    notes:
      n1: "கருத்து (karuttu) (view) plus உரை (urai) (statement); the word for an online comment."
    examples:
      "நான் கருத்துரை எழுதுகிறேன்.":
        native: "I am writing a comment."
        bases:
          "கருத்துரை": "comment (online)"
          "எழுதுகிறேன்": "am writing; from எழுது (eḻutu), to write"
      "இந்தக் கருத்துரை நல்லது.":
        native: "This comment is good."
        bases:
          "இந்தக்": "this (before a word starting with k); from இந்த (inta), this"
          "கருத்துரை": "comment (online)"
  "ta-7406":
    native: "privacy"
    notes:
      n1: "தனி (taṉi) (alone) plus உரிமை (urimai) (right); the right to be left alone."
    examples:
      "தனியுரிமை முக்கியம்.":
        native: "Privacy is important."
        bases:
          "தனியுரிமை": "privacy"
          "முக்கியம்": "important"
      "தனியுரிமை பாதுகாக்கப்படுகிறது.":
        native: "Privacy is protected."
        bases:
          "தனியுரிமை": "privacy"
          "பாதுகாக்கப்படுகிறது": "is protected; from பாதுகாப்பு (pātukāppu), safety; protection"
  "ta-7407":
    native: "hacker"
    notes:
      n1: "A loanword from English, said as it is."
    examples:
      "அவன் ஹேக்கர்.":
        native: "He is a hacker."
        bases:
          "அவன்": "his"
          "ஹேக்கர்": "hacker"
      "ஹேக்கர் கடவுச்சொல் திருடுகிறான்.":
        native: "The hacker steals a password."
        bases:
          "ஹேக்கர்": "hacker"
          "திருடுகிறான்": "steals; from திருடு (tiruṭu), to steal"
  "ta-7408":
    native: "fraud; scam"
    notes:
      n1: "Used for online fraud and for cheating; a warning to be careful of மோசடி (mōcaṭi)."
    examples:
      "இது மோசடி.":
        native: "This is a scam."
        bases:
          "மோசடி": "fraud; scam"
      "மோசடி செய்தி வருகிறது.":
        native: "A scam message is coming."
        bases:
          "மோசடி": "fraud; scam"
          "வருகிறது": "is coming; from வா (vā), come"
  "ta-7409":
    native: "restart; reboot"
    notes:
      n1: "மறு (maṟu) (again) plus தொடக்கம் (toṭakkam) (start); you do (செய் (cey)) a restart."
    examples:
      "மறுதொடக்கம் செய்.":
        native: "Restart it."
        bases:
          "மறுதொடக்கம்": "restart; reboot"
      "மறுதொடக்கம் வேண்டும்.":
        native: "A restart is needed."
        bases:
          "மறுதொடக்கம்": "restart; reboot"
  "ta-7410":
    native: "memory; storage"
    notes:
      n1: "The storage space of a phone or computer; the ordinary 'memory' of a person is ஞாபகம் (ñāpakam)."
    examples:
      "நினைவகம் நிரம்பியிருக்கிறது.":
        native: "The memory is full."
        bases:
          "நினைவகம்": "memory; storage"
          "நிரம்பியிருக்கிறது": "is full; from நிரம்பு (nirampu), to fill up"
      "போனில் நினைவகம் குறைவு.":
        native: "The phone has little memory."
        bases:
          "போனில்": "in the last; from போன (pōṉa), last; previous"
          "நினைவகம்": "memory; storage"
  "ta-7411":
    native: "storage; drive"
    notes:
      n1: "சேமிப்பு (cēmippu) (saving) plus அகம் (akam) (place); where files are kept."
    examples:
      "சேமிப்பகம் தேவை.":
        native: "Storage is needed."
        bases:
          "சேமிப்பகம்": "storage; drive"
      "இது புதிய சேமிப்பகம்.":
        native: "This is a new storage drive."
        bases:
          "சேமிப்பகம்": "storage; drive"
  "ta-7412":
    native: "folder"
    notes:
      n1: "கோப்பு (kōppu) (file) plus உறை (uṟai) (cover); written as one word."
    examples:
      "கோப்புறை எங்கே?":
        native: "Where is the folder?"
        bases:
          "கோப்புறை": "folder"
      "கோப்புறை திற.":
        native: "Open the folder."
        bases:
          "கோப்புறை": "folder"
  "ta-7413":
    native: "program; code"
    notes:
      n1: "A computer program or a line of code; the person who writes it is a நிரலாளர் (niralāḷar)."
    examples:
      "இது எளிய நிரல்.":
