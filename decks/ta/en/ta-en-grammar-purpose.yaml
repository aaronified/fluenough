rules:
  "ta-rule-purpose":
    name: "In order to: -துக்கு (-tukku) and -தற்கு (-taṟku)"
    explanation: "To say what something is for, turn the verb into a noun and put it in the dative: {1}, to come, gives {2} in speech and {3} in writing, in order to come. Speech takes the present stem and -துக்கு (-tukku); writing takes the future stem and -தற்கு (-taṟku). With a verb of going the plain infinitive also says the purpose: {4}, I go to eat, as the infinitive is taught earlier."
  "ta-rule-purpose-sake":
    name: "For the sake of: -துக்காக (-tukkāka)"
    explanation: "Add -ஆக (-āka) after the dative to say for the sake of or because of the aim: {1}, to come, gives {2} in speech and {3} in writing. It gives the reason behind a plan, where {4} only gives the plain purpose."
