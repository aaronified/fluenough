  iso639_3: eng
  name: English
name: Pronouns and people words
description: 'Ten more pronouns, from the ones already taught: you (informal), he, she, this person (polite), he or she (polite), it, this, we (with you), we (without you) and they. Not yet checked by a Tamil speaker: please report any mistake.'
