cards:
  "ta-4528":
    native: "Clean the house."
    bases:
      "வீட்டைச்": "the house (as object); from வீடு (vīṭu), house; home"
    confusables:
      w1: { why: "பாத்திரம் (pāttiram), vessel; dish; utensil, is a different word." }
      w2: { why: "தரை (tarai), floor; ground, is a different word." }
  "ta-4529":
    native: "I am washing the dishes."
    bases:
      "கழுவுகிறேன்": "am washing; from கழுவு (kaḻuvu), to wash"
    confusables:
      w1: { why: "துணி (tuṇi), cloth, is a different word." }
      w2: { why: "தட்டு (taṭṭu), plate, is a different word." }
  "ta-4530":
    native: "Mother is sweeping the floor."
    bases:
      "பெருக்குகிறார்": "is sweeping; from பெருக்கு (perukku), to sweep"
    confusables:
      w1: { why: "துடைப்பம் (tuṭaippam), broom, is a different word." }
      w2: { why: "குப்பை (kuppai), rubbish; waste, is a different word." }
