    "kulirana": "cold"
  notes: "Tamil has no ending like -er. To compare, put the thing you compare with, with -ஐ (-ai), before விட (viṭa), than: இதை விட (itai viṭa) is than this, and அவனை விட (avaṉai viṭa) is than him. The whole sentence is இது அதை விடப் பெரியது (itu atai viṭap periyatu), this is bigger than that. Very is மிக (mika), as in மிகப் பெரியது (mikap periyatu). Most is bigger than all: எல்லாவற்றையும் விட (ellāvaṟṟaiyum viṭa) put before the adjective, as in எல்லாவற்றையும் விடப் பெரியது (ellāvaṟṟaiyum viṭap periyatu). After விட (viṭa) and மிக (mika) a word that starts with க (ka), ச (ca), த (ta) or ப (pa) gets that first sound doubled in careful writing, so the two words are written விடப் பெரியது (viṭap periyatu); speech often leaves the doubling out. The adjectives are shown with the ending -து (-tu) for a thing, as in the adjectives unit. Not yet checked by a Tamil speaker: please report any mistake."
