schema: 1
id: "ta-en-government"
kind: "layer"
core: "ta-government"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Government: offices, forms and laws"
description: "Government and civic life: offices and officials, laws and rights, licences and certificates, local bodies and elections, courts and fines, and the verbs of carrying out and appointing. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-7337":
    native: "government"
    notes:
      n1: "The government as a body; அரசு (aracu) (state; government) is the shorter word and the two are often interchanged."
    examples:
      "அரசாங்கம் புதிய திட்டம் அறிவிக்கிறது.":
        native: "The government announces a new scheme."
        bases:
          "அரசாங்கம்": "government"
          "அறிவிக்கிறது": "is announcing; from அறிவி (aṟivi), to announce; to declare"
      "இது அரசாங்கம் வேலை.":
        native: "This is government work."
        bases:
          "அரசாங்கம்": "government"
  "ta-7338":
    native: "department; field"
    notes:
      n1: "A government department, and also a field of study or work."
    examples:
      "இது எந்தத் துறை?":
        native: "Which department is this?"
        bases:
          "எந்தத்": "which; from எந்த (enta), which (before a noun)"
          "துறை": "department; field"
      "அவர் கல்வித் துறையில் வேலை செய்கிறார்.":
        native: "He works in the education department."
        bases:
          "அவர்": "he or she (polite)"
          "கல்வித்": "education (before a noun); from கல்வி (kalvi), education"
          "துறையில்": "in the department; from துறை (tuṟai), department; field"
          "செய்கிறார்": "he does; from செய் (cey), to do"
  "ta-7339":
    native: "law; rule"
    notes:
      n1: "Before an ending the last letter changes, as in சட்டத்தை (caṭṭattai) (the law)."
    examples:
      "இது சட்டம்.":
        native: "This is the law."
        bases:
          "சட்டம்": "law; rule"
      "சட்டம் எல்லோருக்கும் ஒன்று.":
        native: "The law is the same for everyone."
        bases:
          "சட்டம்": "law; rule"
          "எல்லோருக்கும்": "to everyone; from எல்லோர் (ellōr), everyone"
  "ta-7340":
    native: "right; ownership"
    notes:
      n1: "Used for a legal right and for a claim of ownership."
    examples:
      "எனக்கு உரிமை இருக்கிறது.":
        native: "I have a right."
        bases:
          "எனக்கு": "to me; for me; from நான் (nāṉ), I; me"
          "உரிமை": "right; ownership"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "இது உன் உரிமை.":
        native: "This is your right."
        bases:
          "உன்": "your; from நீ (nī), you (to a friend or child)"
          "உரிமை": "right; ownership"
  "ta-7341":
    native: "duty"
    notes:
      n1: "The word for duty; Tamil 'does' (செய் (cey)) a duty."
    examples:
      "இது என் கடமை.":
        native: "This is my duty."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "கடமை": "duty"
      "கடமை செய்.":
        native: "Do your duty."
        bases:
          "கடமை": "duty"
  "ta-7342":
    native: "citizen"
    notes:
      n1: "Literally son of the town; குடி (kuṭi) (people) plus மகன் (makaṉ) (son)."
    examples:
      "அவன் இந்தியக் குடிமகன்.":
        native: "He is a citizen of India."
        bases:
          "அவன்": "his"
          "இந்தியக்": "Indian (before a noun); from இந்தியா (intiyā), India"
          "குடிமகன்": "citizen"
      "ஒவ்வொரு குடிமகனுக்கும் உரிமை உண்டு.":
        native: "Every citizen has rights."
        bases:
          "குடிமகனுக்கும்": "to each citizen; for each citizen; from குடிமகன் (kuṭimakaṉ), citizen"
          "உண்டு": "there is; has"
  "ta-7343":
    native: "citizenship"
    notes:
      n1: "குடி (kuṭi) (people) plus உரிமை (urimai) (right); the rights of being a citizen."
    examples:
      "எனக்குக் குடியுரிமை வேண்டும்.":
        native: "I want citizenship."
        bases:
          "எனக்குக்": "to me; for me; from நான் (nāṉ), I; me"
          "குடியுரிமை": "citizenship"
      "குடியுரிமை சான்றிதழ் இருக்கிறது.":
        native: "I have a citizenship certificate."
        bases:
          "குடியுரிமை": "citizenship"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7344":
    native: "voter"
    notes:
      n1: "வாக்கு (vākku) (vote) plus -ஆளர் (-āḷar), 'the one who'; used for men and women alike."
    examples:
      "அவர் வாக்காளர்.":
        native: "He is a voter."
        bases:
          "அவர்": "he or she (polite)"
          "வாக்காளர்": "voter"
      "வாக்காளர் பட்டியல் எங்கே?":
        native: "Where is the voters' list?"
        bases:
          "வாக்காளர்": "voter"
  "ta-7345":
    native: "income tax"
    notes:
      n1: "வருமானம் (varumāṉam) (income) plus வரி (vari) (tax); written as one word."
    examples:
      "வருமானவரி கட்ட வேண்டும்.":
        native: "Income tax must be paid."
        bases:
          "வருமானவரி": "income tax"
          "கட்ட": "to pay; from கட்டு (kaṭṭu), to tie; to pay; to build"
      "வருமானவரி படிவம் எங்கே?":
        native: "Where is the income tax form?"
        bases:
          "வருமானவரி": "income tax"
  "ta-7346":
    native: "birth certificate"
    notes:
      n1: "பிறப்பு (piṟappu) (birth) plus சான்றிதழ் (cāṉṟitaḻ) (certificate); written as one word."
    examples:
      "பிறப்புச்சான்றிதழ் வேண்டும்.":
        native: "A birth certificate is needed."
        bases:
          "பிறப்புச்சான்றிதழ்": "birth certificate"
      "பிறப்புச்சான்றிதழ் இங்கே இருக்கிறது.":
        native: "The birth certificate is here."
        bases:
          "பிறப்புச்சான்றிதழ்": "birth certificate"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7347":
    native: "licence; permit"
    notes:
      n1: "Used for a licence to drive, to run a shop and so on."
    examples:
      "இதற்கு உரிமம் வேண்டும்.":
        native: "This needs a licence."
        bases:
          "இதற்கு": "to this; for this; from இது (itu), this; it"
          "உரிமம்": "licence; permit"
      "உரிமம் எங்கே?":
        native: "Where is the licence?"
        bases:
          "உரிமம்": "licence; permit"
  "ta-7348":
    native: "police station"
    notes:
      n1: "காவல் (kāval) (guard) plus நிலையம் (nilaiyam) (station); in speech people say போலீஸ் (pōlīs) ஸ்டேஷன் (sṭēṣaṉ) (police station)."
    examples:
      "காவல்நிலையம் எங்கே?":
        native: "Where is the police station?"
        bases:
          "காவல்நிலையம்": "police station"
      "நான் காவல்நிலையத்துக்குப் போகிறேன்.":
        native: "I am going to the police station."
        bases:
          "காவல்நிலையத்துக்குப்": "to the police station; for the police station; from காவல்நிலையம் (kāvalnilaiyam), police station"
          "போகிறேன்": "am going; from போ (pō), to go"
  "ta-7349":
    native: "judge"
    notes:
      n1: "நீதி (nīti) (justice) plus பதி (pati) (lord); used for men and women alike."
    examples:
      "நீதிபதி வருகிறார்.":
        native: "The judge is coming."
        bases:
          "நீதிபதி": "judge"
          "வருகிறார்": "comes (respectful); from வா (vā), to come"
      "நீதிபதி தீர்ப்பு சொல்கிறார்.":
        native: "The judge gives the verdict."
        bases:
          "நீதிபதி": "judge"
          "சொல்கிறார்": "is saying (respectful); from சொல் (col), to say; to tell"
  "ta-7350":
    native: "district collector"
    notes:
      n1: "The chief official of a district in the state government, used for men and women alike."
    examples:
      "ஆட்சியர் அலுவலகம் எங்கே?":
        native: "Where is the collector's office?"
        bases:
          "ஆட்சியர்": "district collector"
      "ஆட்சியர் வருகிறார்.":
        native: "The collector is coming."
        bases:
          "ஆட்சியர்": "district collector"
          "வருகிறார்": "comes (respectful); from வா (vā), to come"
  "ta-7351":
    native: "parliament"
    notes:
      n1: "நாடு (nāṭu) (nation) plus மன்றம் (maṉṟam) (assembly); the national parliament."
    examples:
      "நாடாளுமன்றம் பெரியது.":
        native: "Parliament is big."
        bases:
          "நாடாளுமன்றம்": "parliament"
          "பெரியது": "big; from பெரிய (periya), big"
      "நாடாளுமன்றம் கூடுகிறது.":
        native: "Parliament is meeting."
        bases:
          "நாடாளுமன்றம்": "parliament"
          "கூடுகிறது": "is meeting; is gathering; from கூடு (kūṭu), to gather; to meet"
  "ta-7352":
    native: "state assembly"
    notes:
      n1: "சட்டம் (caṭṭam) (law) plus மன்றம் (maṉṟam) (assembly); the body of a state."
    examples:
      "சட்டமன்றம் கூடுகிறது.":
        native: "The state assembly is meeting."
        bases:
          "சட்டமன்றம்": "state assembly"
          "கூடுகிறது": "is meeting; is gathering; from கூடு (kūṭu), to gather; to meet"
      "சட்டமன்றம் எங்கே?":
        native: "Where is the state assembly?"
        bases:
          "சட்டமன்றம்": "state assembly"
  "ta-7353":
    native: "member"
    notes:
      n1: "A member of a party, a club or a house; used for men and women alike."
    examples:
      "அவர் உறுப்பினர்.":
        native: "He is a member."
        bases:
          "அவர்": "he or she (polite)"
          "உறுப்பினர்": "member"
      "உறுப்பினர் அட்டை வேண்டும்.":
        native: "A membership card is needed."
        bases:
          "உறுப்பினர்": "member"
  "ta-7354":
    native: "chief minister; head; principal"
    notes:
      n1: "Used for the chief minister of a state and for the head of a college; the context tells which."
    examples:
      "முதல்வர் பேசுகிறார்.":
        native: "The chief minister is speaking."
        bases:
          "முதல்வர்": "chief minister; head; principal"
          "பேசுகிறார்": "is speaking; from பேசு (pēcu), to speak"
      "முதல்வர் எங்கே?":
        native: "Where is the principal?"
        bases:
          "முதல்வர்": "chief minister; head; principal"
  "ta-7355":
    native: "village council; panchayat"
    notes:
      n1: "The elected council of a village."
    examples:
      "ஊராட்சி அலுவலகம் எங்கே?":
        native: "Where is the village council office?"
        bases:
          "ஊராட்சி": "village council; panchayat"
      "ஊராட்சி தலைவர் வருகிறார்.":
        native: "The council head is coming."
        bases:
          "ஊராட்சி": "village council; panchayat"
          "வருகிறார்": "comes (respectful); from வா (vā), to come"
  "ta-7356":
    native: "municipality; town council"
    notes:
      n1: "The council of a town; a bigger city has a மாநகராட்சி (mānakarāṭci)."
    examples:
      "நகராட்சி அலுவலகம் அங்கே.":
        native: "The municipality office is there."
        bases:
          "நகராட்சி": "municipality; town council"
          "அங்கே": "there"
      "நகராட்சி குப்பை எடுக்கிறது.":
        native: "The municipality collects the rubbish."
        bases:
          "நகராட்சி": "municipality; town council"
          "எடுக்கிறது": "is taking; from எடு (eṭu), to take; to pick up"
  "ta-7357":
    native: "city corporation"
    notes:
      n1: "The council of a large city, bigger than a நகராட்சி (nakarāṭci)."
    examples:
      "மாநகராட்சி அலுவலகம் எங்கே?":
        native: "Where is the corporation office?"
        bases:
          "மாநகராட்சி": "city corporation"
      "மாநகராட்சி வரி கேட்கிறது.":
        native: "The corporation asks for tax."
        bases:
          "மாநகராட்சி": "city corporation"
          "கேட்கிறது": "is heard; from கேள் (kēḷ), to hear; to ask"
  "ta-7358":
    native: "subsidy; grant"
    notes:
      n1: "Money the government gives to lower a price, as on fuel or seeds."
    examples:
      "அரசு மானியம் கொடுக்கிறது.":
        native: "The government gives a subsidy."
        bases:
          "அரசு": "government; state; kingdom"
          "மானியம்": "subsidy; grant"
          "கொடுக்கிறது": "is giving; from கொடு (koṭu), to give"
      "மானியம் கிடைக்கிறது.":
        native: "The subsidy is received."
        bases:
          "மானியம்": "subsidy; grant"
          "கிடைக்கிறது": "is received; is available; from கிடை (kiṭai), to be obtained"
  "ta-7359":
    native: "fund; finance"
    notes:
      n1: "Used for public funds and for the finance of a project."
    examples:
      "அரசு நிதி கொடுக்கிறது.":
        native: "The government gives funds."
        bases:
          "அரசு": "government; state; kingdom"
          "நிதி": "fund; finance"
          "கொடுக்கிறது": "is giving; from கொடு (koṭu), to give"
      "நிதி இல்லை.":
        native: "There are no funds."
        bases:
          "நிதி": "fund; finance"
  "ta-7360":
    native: "pension"
    notes:
      n1: "ஓய்வு (ōyvu) (rest) plus ஊதியம் (ūtiyam) (pay), so literally retirement pay."
    examples:
      "அவருக்கு ஓய்வூதியம் கிடைக்கிறது.":
        native: "He gets a pension."
        bases:
          "அவருக்கு": "to him or her (polite); for him or her (polite); from அவர் (avar), he or she (polite)"
          "ஓய்வூதியம்": "pension"
          "கிடைக்கிறது": "is received; is available; from கிடை (kiṭai), to be obtained"
      "ஓய்வூதியம் மாதம் ஒருமுறை.":
        native: "The pension comes once a month."
        bases:
          "ஓய்வூதியம்": "pension"
          "ஒருமுறை": "once"
  "ta-7361":
    native: "polling booth"
    notes:
      n1: "வாக்கு (vākku) (vote) plus சாவடி (cāvaṭi) (booth); written as one word."
    examples:
      "வாக்குச்சாவடி எங்கே?":
        native: "Where is the polling booth?"
        bases:
          "வாக்குச்சாவடி": "polling booth"
      "வாக்குச்சாவடி பள்ளியில் இருக்கிறது.":
        native: "The polling booth is in the school."
        bases:
          "வாக்குச்சாவடி": "polling booth"
          "பள்ளியில்": "at the school; from பள்ளி (paḷḷi), school"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7362":
    native: "polling; voting record"
    notes:
      n1: "வாக்கு (vākku) (vote) plus பதிவு (pativu) (record); the act of casting votes."
    examples:
      "இன்று வாக்குப்பதிவு.":
        native: "Polling is today."
        bases:
          "வாக்குப்பதிவு": "polling; voting record"
      "வாக்குப்பதிவு நடக்கிறது.":
        native: "Polling is going on."
        bases:
          "வாக்குப்பதிவு": "polling; voting record"
          "நடக்கிறது": "happens; from நட (naṭa), to walk; to happen"
  "ta-7363":
    native: "identity; mark; sign"
    notes:
      n1: "An identity or a mark that identifies; an ID card is அடையாள (aṭaiyāḷa) அட்டை (aṭṭai)."
    examples:
      "உன் அடையாளம் என்ன?":
        native: "What is your identity?"
        bases:
          "உன்": "your; from நீ (nī), you (to a friend or child)"
          "அடையாளம்": "identity; mark; sign"
      "அடையாளம் வேண்டும்.":
        native: "Identification is needed."
        bases:
          "அடையாளம்": "identity; mark; sign"
  "ta-7364":
    native: "secretary"
    notes:
      n1: "The secretary of an office or an association, used for men and women alike."
    examples:
      "செயலாளர் இங்கே இருக்கிறார்.":
        native: "The secretary is here."
        bases:
          "செயலாளர்": "secretary"
          "இருக்கிறார்": "is; from இரு (iru), to be"
      "செயலாளர் கையொப்பம் போடுகிறார்.":
