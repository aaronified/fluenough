id: "ta-en-appearance-sentences"
kind: "layer"
core: "ta-appearance-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Appearance in sentences"
description: "Sentences describing people: height, age, hair, clothes and jewellery. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-4538":
    native: "She is a tall woman."
    confusables:
      w1: { why: "இளமையான (iḷamaiyāṉa), young; youthful, is a different word." }
      w2: { why: "குண்டான (kuṇṭāṉa), plump; fat, is a different word." }
  "ta-4539":
    native: "How old are you?"
    bases:
      "உன்": "your; from நீ (nī), you (to a friend or child)"
    confusables:
      w1: { why: "உயரம் (uyaram), height, is a different word." }
      w2: { why: "தோற்றம் (tōṟṟam), appearance; look, is a different word." }
  "ta-4540":
    native: "Long hair."
    confusables:
      w1: { why: "குட்டையான (kuṭṭaiyāṉa), short, is a different word." }
      w2: { why: "கருப்பு (karuppu), black, is a different word." }
  "ta-4541":
    native: "I am tying on a veshti."
    bases:
      "கட்டுகிறேன்": "am tying on; from கட்டு (kaṭṭu), to tie; to wear (a sari or veshti)"
    confusables:
      w1: { why: "உடுத்து (uṭuttu), to dress; to wear, is a different word." }
      w2: { why: "கழற்று (kaḻaṟṟu), to take off, is a different word." }
  "ta-4542":
    native: "Comb your hair."
    confusables:
      w1: { why: "சீப்பு (cīppu), comb, is a different word." }
      w2: { why: "பொட்டு (poṭṭu), bindi, is a different word." }
  "ta-4543":
    native: "She puts a bindi on her forehead."
    bases:
      "நெற்றியில்": "on the forehead; from நெற்றி (neṟṟi), forehead"
      "வைக்கிறாள்": "puts; from வை (vai), to put; to place"
    confusables:
      w1: { why: "கம்மல் (kammal), earring, is a different word." }
      w2: { why: "மோதிரம் (mōtiram), ring, is a different word." }
  "ta-4544":
    native: "This is a gold chain."
    bases:
      "தங்கச்": "gold (before a noun); from தங்கம் (taṅkam), gold"
    confusables:
      w1: { why: "மோதிரம் (mōtiram), ring, is a different word." }
      w2: { why: "வளையல் (vaḷaiyal), bangle, is a different word." }
  "ta-4545":
    native: "He is a thin boy."
    confusables:
      w1: { why: "குண்டான (kuṇṭāṉa), plump; fat, is a different word." }
      w2: { why: "இளமையான (iḷamaiyāṉa), young; youthful, is a different word." }
  "ta-4546":
    native: "I bathe in the morning."
    bases:
      "குளிக்கிறேன்": "bathe; from குளி (kuḷi), to bathe"
    confusables:
      w1: { why: "உடுத்து (uṭuttu), to dress; to wear, is a different word." }
      w2: { why: "கழற்று (kaḻaṟṟu), to take off, is a different word." }
  "ta-4547":
    native: "Her eyes are beautiful."
    confusables:
      w1: { why: "உதடு (utaṭu), lip, is a different word." }
      w2: { why: "கன்னம் (kaṉṉam), cheek, is a different word." }
