schema: 1
id: "ta-en-journey"
kind: "layer"
core: "ta-journey"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Travel and journeys"
description: "Tickets, stations and vehicles, roads and routes, luggage and documents, and the verbs of setting out, driving and arriving. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-2132":
    native: "journey; trip"
    notes:
      n1: "A journey of any length."
    examples:
      "பயணம் எப்போது?":
        native: "When is the journey?"
        bases:
          "பயணம்": "journey; trip"
      "நாளை பயணம்.":
        native: "The journey is tomorrow."
        bases:
          "பயணம்": "journey; trip"
  "ta-2133":
    native: "ticket"
    notes:
      n1: "The formal word, literally a journey slip; spoken Tamil says டிக்கெட் (ṭikkeṭ)."
    examples:
      "பயணச்சீட்டு எங்கே?":
        native: "Where is the ticket?"
        bases:
          "பயணச்சீட்டு": "ticket"
      "பயணச்சீட்டு வாங்கு.":
        native: "Buy a ticket."
        bases:
          "பயணச்சீட்டு": "ticket"
  "ta-2134":
    native: "ticket"
    notes:
      n1: "The everyday English loan for a ticket."
    examples:
      "டிக்கெட் எவ்வளவு?":
        native: "How much is the ticket?"
        bases:
          "டிக்கெட்": "ticket"
      "இரண்டு டிக்கெட்.":
        native: "Two tickets."
