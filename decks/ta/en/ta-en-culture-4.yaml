# Layer for ta-culture-4: each passage's English rendering and a note on it.
schema: 1
id: "ta-en-culture-4"
kind: "layer"
core: "ta-culture-4"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: Subramania Bharati"
description: "16 short passages from the poems and prose of Subramania Bharati (Bharathiyar), each with its English rendering and a note. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-6150":
    native: "Love, love, love; if love goes, if love goes: death, death, death."
    notes:
      "n1": "The opening lines of the cuckoo's song in Kuyil Pattu, the long poem of the cuckoo. The word for 'if it goes' ends in the old form of the conditional, written with a final letter that modern writing leaves out. The repeated sound of 'love' and 'death' (two words that rhyme in the last syllable) is the poet's play."
    bases:
      "காதல்": { meaning: "love" }
      "போயிற்": { meaning: "to go; here 'if it goes', in an old conditional" }
      "சாதல்": { meaning: "dying, death" }
  "ta-6151":
    native: "Joy, joy, joy; but if joy is found to have a limit, then sorrow, sorrow, sorrow."
    notes:
      "n1": "A verse of the cuckoo's song, in the same shape as the first: three words, an 'if' line, three words. The 'if' ending on the verb 'see' means 'if one sees'. The printed spacing cuts 'a limit to joy' into three pieces, so the ending of 'to joy' stands apart and the word for 'limit' begins with a letter that belongs to the word before."
    bases:
      "இன்பம்": { meaning: "joy, pleasure" }
      "இன்பத்": { meaning: "joy; the first half of 'to joy'" }
      "திற்கோ": { meaning: "one, a; joined to the ending 'to' of the word before" }
      "ரெல்லை": { meaning: "limit, boundary; the first letter belongs to the word before" }
      "காணில்": { meaning: "to see, to find; here 'if one sees'" }
      "துன்பம்": { meaning: "sorrow, suffering" }
  "ta-6152":
    native: "Grace is the good light; if the light goes, if the light goes, then darkness, darkness, darkness."
    notes:
      "n1": "A verse of the cuckoo's song. The word for 'goes' ends in the old conditional (the same form as in the first verse), and the first half of the line joins 'it is' to 'good'. The page repeats the same shape for love, joy, sound and rhythm."
    bases:
      "அருளே": { meaning: "grace, kindness; here with a vowel that adds emphasis" }
      "யாநல்": { meaning: "to be; here 'it is', joined to 'good'" }
      "லொளியே": { meaning: "light; the first letter belongs to the word before" }
      "ஒளிபோ": { meaning: "light; joined to the first half of 'goes'" }
      "மாயின்": { meaning: "to go; here the second half of 'if it goes'" }
      "இருளே": { meaning: "darkness; here with a vowel that adds emphasis" }
  "ta-6153":
    native: "Run and play, little one; you must not sit idle."
    notes:
      "n1": "The first stanza of Pappa Pattu, the poem Bharati wrote for children. The word for 'little one' is a pet name for a child. 'Laakaadhu' is 'aakaadhu' (it must not be) with the ending of the word before moved onto it, which is how the old print spells it."
    bases:
      "ஓடி": { meaning: "to run; here 'having run'" }
      "விளையாடு": { meaning: "to play; here the command 'play'" }
      "பாப்பா": { meaning: "little one, a pet name for a small child" }
      "நீ": { meaning: "you (singular, familiar)" }
      "ஓய்ந்திருக்க": { meaning: "to sit idle, to remain still; the ending of 'sitting idle' is carried to the next word" }
      "லாகாது": { meaning: "it must not be; the first letter belongs to the word before" }
  "ta-6154":
    native: "You must not tell lies, little one; you must never speak ill behind a person's back."
    notes:
      "n1": "A stanza of Pappa Pattu on what a child must not do. It uses two ways of saying 'must not': 'koodaadhu' and 'aakaadhu', the second joined to the verb as 'laakaadhu'."
    bases:
      "பொய்சொல்லக்": { meaning: "lie, falsehood; joined to 'to tell'" }
      "கூடாது": { meaning: "to be allowed; here 'it must not be done'" }
      "பாப்பா": { meaning: "little one, a pet name for a small child" }
      "என்றும்": { meaning: "always, ever" }
      "புறஞ்சொல்ல": { meaning: "backbiting, speaking behind someone's back; here 'to speak ill behind'" }
      "லாகாது": { meaning: "it must not be; the first letter belongs to the word before" }
  "ta-6155":
    native: "Even when sorrow comes close, we must not lose heart, little one."
    notes:
      "n1": "A stanza of Pappa Pattu on courage. The word for 'when' joins to the word for 'even', and the end of the line repeats the 'must not' of the earlier stanzas. The second verb joins 'lose heart' and a helper 'letting go', so 'lose heart completely'."
    bases:
      "துன்பம்": { meaning: "sorrow, suffering" }
      "நெருங்கிவந்த": { meaning: "to come close; here 'that has come close'" }
      "போதும்": { meaning: "time, when; here 'even when'" }
      "நாம்": { meaning: "we, including the listener" }
      "சோர்ந்துவிட": { meaning: "to grow weary, to lose heart; joined to a helper meaning 'completely'" }
      "லாகாது": { meaning: "it must not be; the first letter is the ending of the word before" }
      "பாப்பா": { meaning: "little one, a pet name for a small child" }
  "ta-6156":
    native: "Having made a fine veena, would one throw it in the dust and spoil its beauty?"
    notes:
      "n1": "The opening of Nalladhor Veenai, a prayer to the goddess in which the poet calls himself a veena. The last word is a question: 'is there throwing?'. The first word joins 'good' and the number 'one' so that it means 'a fine one'."
    bases:
      "நல்லதோர்": { meaning: "a good one; joined to 'one'" }
      "வீணை": { meaning: "veena, a stringed instrument" }
      "செய்தே": { meaning: "to make; here 'having made', with emphasis" }
      "அதை": { meaning: "it; with the object ending" }
      "நலங்கெடப்": { meaning: "beauty, goodness; joined to 'to be spoiled'" }
      "புழுதியில்": { meaning: "dust; here 'in the dust'" }
      "எறிவதுண்டோ": { meaning: "to throw; here 'is there throwing', a question" }
  "ta-6157":
    native: "I asked for a body that goes as the mind wishes, like a ball struck hard."
    notes:
      "n1": "The opening lines of the second stanza, a list of what the poet asks of the goddess. Each request ends in 'I asked for', so the stanza is a list of five wishes. The first compound word joins 'force', 'ball' and 'like'."
    bases:
      "விசையுறு": { meaning: "force, speed; joined to 'that has'" }
      "பந்தினைப்போல்": { meaning: "ball; joined to 'like'" }
      "உள்ளம்": { meaning: "mind, heart" }
      "வேண்டிய": { meaning: "to wish, to need; here 'that is wished'" }
      "படிசெலும்": { meaning: "way, manner; joined to 'goes'" }
      "உடல்கேட்டேன்": { meaning: "body; joined to 'I asked for'" }
  "ta-6158":
    native: "It seems to me that where there is no worry there will be no happiness either."
    notes:
      "n1": "A sentence of the mind's reply in Gnanaratham, the prose fantasy in which the narrator travels in a chariot of knowledge. The ending of the last word is the usual spoken-style present, 'it seems'. The first word takes an emphasis vowel."
    bases:
      "கவலையே": { meaning: "worry, care; with emphasis" }
      "இல்லாத": { meaning: "not to be; here 'that does not exist'" }
      "இடத்தில்": { meaning: "place; here 'in the place'" }
      "சுகமும்": { meaning: "happiness, comfort; with 'also'" }
      "இராது": { meaning: "to be; here 'will not be'" }
      "என்று": { meaning: "that, saying" }
      "எனக்குத்": { meaning: "I; here 'to me'" }
      "தோன்றுகிறது": { meaning: "to appear, to seem; here 'it seems'" }
  "ta-6159":
    native: "I have a great love for this enchantress called the mind."
    notes:
      "n1": "Another sentence from the same section, where the narrator speaks of his mind as a charmer he loves. The word 'enchantress' is of Sanskrit origin and takes the ending 'with'."
    bases:
      "எனக்கு": { meaning: "I; here 'to me'" }
      "இந்த": { meaning: "this" }
      "மனம்": { meaning: "mind" }
      "என்ற": { meaning: "to say; here 'called'" }
      "மோகினியிடத்தில்": { meaning: "an enchantress; here 'in, for the enchantress'" }
      "காதல்": { meaning: "love" }
      "அதிக": { meaning: "much, more; here the first half of 'there is much'" }
      "முண்டு": { meaning: "there is; the first letter belongs to the word before" }
  "ta-6160":
    native: "Avoid fear."
    notes:
      "n1": "The first line of Puthiya Aathichudi, Bharati's 'new Aathichudi', which copies the old form of short commands arranged by the Tamil letters (the old Aathichudi is in the third deck) and fills it with a modern message. The verb is the plain command, 'give up' or 'avoid'."
    bases:
      "அச்சம்": { meaning: "fear" }
      "தவிர்": { meaning: "to avoid, to give up; here the command 'avoid!'" }
  "ta-6161":
    native: "Unity is strength."
    notes:
      "n1": "Line 10 of Puthiya Aathichudi. The last word joins 'strength' to the verb 'is' in its old form, written as one word, so the saying has no separate verb."
    bases:
      "ஒற்றுமை": { meaning: "unity, oneness" }
      "வலிமையாம்": { meaning: "strength; joined to the old 'it is'" }
  "ta-6162":
    native: "Practise fierce anger."
    notes:
      "n1": "Line 96 of Puthiya Aathichudi. The first word is a Sanskrit loan for fury, and the poet's saying is often read as a call for righteous anger; that reading is not on the page. The second word is the plain command 'practise, train in'."
    bases:
      "ரௌத்திரம்": { meaning: "fury, fierce anger, a Sanskrit loan" }
      "பழகு": { meaning: "to practise, to get used to; here the command 'practise!'" }
  "ta-6163":
    native: "Even on the days of wandering in the forest, he keeps the heart free from disturbance."
    notes:
      "n1": "A stanza of the first poem of Kannan Pattu, in which Krishna is the poet's friend. The ending of the last word ('he will do') belongs to the 'he' of the whole stanza, and the printed spacing cuts the verb in two."
    bases:
      "கானகத்தே": { meaning: "forest; here 'in the forest'" }
      "சுற்று": { meaning: "to wander, to go round" }
      "நாளிலும்": { meaning: "day; here 'even on the day when'" }
      "நெஞ்சிற்": { meaning: "heart; here 'in the heart'" }
      "கலக்க": { meaning: "disturbance, confusion" }
      "மிலாதுசெய்": { meaning: "not to be; here 'without', joined to 'doing'" }
      "வான்": { meaning: "to do; the ending 'he will' of the verb split by the printed spacing" }
  "ta-6164":
    native: "When he is called, he does not make excuses; he comes within half a moment."
    notes:
      "n1": "Lines from the same poem about what a good friend does. 'Half a moment' is a very short span. The first word is 'when one calls' and the last joins 'within' to 'he will come'."
    bases:
      "அழைக்கும்": { meaning: "to call; here 'when one calls'" }
      "பொழுதினிற்": { meaning: "time; here 'at the time'" }
      "போக்குச்": { meaning: "excuse, pretext" }
      "சொல்லாமல்": { meaning: "to say; here 'without saying'" }
      "அரைநொடிக்": { meaning: "half a moment, a very short time" }
      "குள்வருவான்": { meaning: "to come; here 'within (the time) he will come'" }
  "ta-6165":
    native: "He gives money when he is asked, and he bears the teasing one says to him."
    notes:
      "n1": "Lines from the same poem. Each verb ends in 'he will', so the two halves read as a pair. The printed spacing cuts the last verb in two."
    bases:
      "கேட்டபொழுதில்": { meaning: "to ask; here 'at the time when he is asked'" }
      "பொருள்": { meaning: "money, wealth, a thing" }
      "கொடுப்பான்": { meaning: "to give; here 'he will give'" }
      "சொல்லுங்": { meaning: "to say; here 'that one says'" }
      "கேலி": { meaning: "teasing, mockery" }
      "பொறுத்திடு": { meaning: "to bear, to put up with" }
      "வான்": { meaning: "the ending 'he will' of the verb split by the printed spacing" }
