"core": "ta-script-vowel-signs"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Vowel signs"
"description": "The vowel signs, written with a consonant, the pulli that takes away its vowel, and the aytam. Not yet checked by a Tamil speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
  - "beginner"
  - "unreviewed"
  - "script"
"cards":
  "ta-1012":
    "native": "கா (kā): the sign ா (ā) on க (ka), a long 'aa'"
    "notes":
      "n1": "The sign ா (ā) makes the consonant a long 'aa': கா (kā). கார் (kār, car) has it."
    "examples":
      "நான் காபி குடிக்கிறேன்.":
        "native": "I drink coffee."
        "bases":
          "குடிக்கிறேன்": "drink; from குடி (kuṭi), to drink"
  "ta-1013":
    "native": "கி (ki): the sign ி (i) on க (ka), a short 'i'"
    "notes":
      "n1": "The sign ி (i) makes the consonant a short 'i': கி (ki). It starts கிழக்கு (kiḻakku, east)."
    "examples":
      "கிராமம்": "village"
      "கிழக்கு": "east"
  "ta-1014":
    "native": "கீ (kī): the sign ீ (ī) on க (ka), a long 'ee'"
    "notes":
      "n1": "The sign ீ (ī) makes the consonant a long 'ee': கீ (kī). கீழே (kīḻē, down) has it."
    "examples":
      "பாம்பு கீழே போகிறது.":
        "native": "The snake is going down."
        "bases":
          "போகிறது": "is going; from போ (pō), to go"
  "ta-1015":
    "native": "கு (ku): the sign ு (u) on க (ka), a short 'u'"
    "notes":
      "n1": "The sign ு (u) makes the consonant a short 'u': கு (ku). It starts குடை (kuṭai, umbrella)."
    "examples":
      "குதிரை": "horse"
      "குடை": "umbrella"
  "ta-1016":
    "native": "கூ (kū): the sign ூ (ū) on க (ka), a long 'oo'"
    "notes":
      "n1": "The sign ூ (ū) makes the consonant a long 'oo': கூ (kū). It starts கூட (kūṭa, also; even)."
    "examples":
      "கூட்டம்": "meeting; crowd"
      "கூட": "also; even"
  "ta-1017":
    "native": "கெ (ke): the sign ெ (e) on க (ka), a short 'e'"
    "notes":
      "n1": "The sign ெ (e) makes the consonant a short 'e': கெ (ke). It starts கெட்ட (keṭṭa, bad)."
    "examples":
      "கெட்ட": "bad"
  "ta-1018":
    "native": "கே (kē): the sign ே (ē) on க (ka), a long 'ay'"
    "notes":
      "n1": "The sign ே (ē) makes the consonant a long 'ay': கே (kē). It starts கேள் (kēḷ, to listen; to ask)."
    "examples":
      "கேள்": "to listen; to ask"
  "ta-1019":
    "native": "கை (kai): the sign ை (ai) on க (ka), the 'ai' glide"
    "notes":
      "n1": "The sign ை (ai) makes the consonant the glide 'ai': கை (kai). கை (kai) is also a word of its own, meaning hand."
    "examples":
      "அவன் கை கழுவுகிறான்.":
        "native": "He is washing his hands."
        "bases":
          "கை": "hand"
          "கழுவுகிறான்": "is washing; from கழுவு (kaḻuvu), to wash"
  "ta-1020":
    "native": "கொ (ko): the sign ொ (o) on க (ka), a short 'o'"
    "notes":
      "n1": "The sign ொ (o) makes the consonant a short 'o', with no glide: கொ (ko). It starts கொடு (koṭu, to give)."
    "examples":
      "கொஞ்சம்": "a little"
      "கொடு": "to give"
  "ta-1021":
    "native": "கோ (kō): the sign ோ (ō) on க (ka), a long 'o'"
    "notes":
      "n1": "The sign ோ (ō) makes the consonant a long 'o', with no glide: கோ (kō). கோழி (kōḻi, chicken; hen) has it."
    "examples":
      "கோழி": "chicken; hen"
      "கோயில்": "temple"
  "ta-1022":
    "native": "கௌ (kau): the sign ௌ (au) on க (ka), the 'au' glide"
    "notes":
      "n1": "The sign ௌ (au) makes the consonant the glide 'au': கௌ (kau). No word in this course uses it yet."
  "ta-1023":
    "native": "க் (k): the bare consonant; the pulli sign takes away the inherent vowel"
    "notes":
      "n1": "The pulli sign takes away the inherent vowel, so க் (k) is the bare consonant. Tamil writes no ligature for two consonants together: the first takes the pulli, as in கல் (kal, stone)."
    "examples":
      "கல்": "stone"
      "கால்": "leg; foot"
  "ta-1024":
    "native": "ஃ (ḵ): the aytam, a sign of its own, listed with the vowels"
    "notes":
      "n1": "The aytam ஃ (ḵ) is written as three dots. Traditionally it is neither a vowel nor a consonant, though it is listed with the vowels. In modern use it marks a foreign sound, such as f. It has no single phone, so this card has no IPA."
