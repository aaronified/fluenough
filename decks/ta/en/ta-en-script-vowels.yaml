"schema": 1
"id": "ta-en-script-vowels"
"kind": "layer"
"core": "ta-script-vowels"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Tamil vowels"
"description": "The vowels as they are written on their own, at the start of a word. In Tamil a short and a long vowel are different sounds. Not yet checked by a Tamil speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
  - "beginner"
  - "unreviewed"
  - "script"
"cards":
  "ta-1000":
    "native": "a, short"
    "notes":
      "n1": "The short 'a', as in 'but'. Every consonant sounds with this vowel unless a sign or the pulli changes it, so க (ka) is 'ka'."
    "examples":
      "அவன் எங்கே போகிறான்?":
        "native": "Where is he going?"
        "bases":
          "போகிறான்": "is going; from போ (pō), to go"
      "அது நல்லது இல்லையா?": "That is good, isn't it?"
  "ta-1001":
    "native": "aa, long"
    "notes":
      "n1": "The long 'aa', held about twice as long as அ (a). Length changes the word: கல் (kal, stone) and கால் (kāl, leg; foot) differ only in it."
    "examples":
      "ஆயிரம்": "a thousand"
      "ஆட்டோ": "auto rickshaw"
  "ta-1002":
    "native": "i, short"
    "notes":
      "n1": "The short 'i', as in 'sit'. It starts இது (itu, this)."
    "examples":
      "இது மட்டும் போதும்.": "Only this is enough."
      "நீ எங்கே இருக்கிறாய்?":
        "native": "Where are you?"
        "bases":
          "இருக்கிறாய்": "are; from இரு (iru), to be"
  "ta-1003":
    "native": "ii, long"
    "notes":
      "n1": "The long 'ee', as in 'see', held longer than இ (i). No word in this course uses it yet."
  "ta-1004":
    "native": "u, short"
    "notes":
      "n1": "The short 'u', as in 'put'. It starts உப்பு (uppu, salt)."
    "examples":
      "உதவி செய்யுங்கள்!":
        "native": "Please help!"
        "bases":
          "உதவி": "help"
          "செய்யுங்கள்": "to do"
      "உப்பு": "salt"
  "ta-1005":
    "native": "uu, long"
    "notes":
      "n1": "The long 'oo', as in 'food', held longer than உ (u). ஊர் (ūr, town; village) has it."
    "examples":
      "ஊர்": "town; village"
  "ta-1006":
    "native": "e, short"
    "notes":
      "n1": "The short 'e', as in 'pet'. Length changes the word: எழு (eḻu, to get up) is short, and ஏழு (ēḻu, seven) is long."
    "examples":
      "பேனா எங்கே?": "Where is the pen?"
      "அவள் குடை எடுக்கிறாள்.":
        "native": "She is taking an umbrella."
        "bases":
          "எடுக்கிறாள்": "is taking; from எடு (eṭu), to take; to pick up"
  "ta-1007":
    "native": "ee, long"
    "notes":
      "n1": "The long 'ay' of 'say', held long, without the glide English adds. ஏழு (ēḻu, seven) starts with it."
    "examples":
      "ஏழு": "seven"
      "ஏன்": "why"
  "ta-1008":
    "native": "ai"
    "notes":
      "n1": "A glide from a to i, like the 'i' of 'kite'. It starts ஐந்து (aintu, five)."
    "examples":
      "ஐந்து": "five"
      "ஐம்பது": "fifty"
  "ta-1009":
    "native": "o, short"
    "notes":
      "n1": "The short 'o', with no glide. It starts ஒன்று (oṉṟu, one)."
    "examples":
      "ஒன்று": "one"
      "ஒவ்வொரு": "each; every"
  "ta-1010":
    "native": "oo, long"
    "notes":
      "n1": "The long 'o', held longer than ஒ (o), with no glide. It starts ஓய்வு (ōyvu, rest)."
    "examples":
      "ஓய்வு": "rest"
  "ta-1011":
    "native": "au"
    "notes":
      "n1": "A glide from a to u, like the 'ow' of 'cow'. No word in this course uses it yet."
