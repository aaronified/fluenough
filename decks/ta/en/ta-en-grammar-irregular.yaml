name: "Verbs that change their stem"
description: "Seven common verbs whose stem changes: come, go, do, give, stand, sit and listen, with I now, I did, I will, the command and I will not. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
