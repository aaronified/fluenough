        bases:
          "தோட்டம்": "garden"
      "நான் தோட்டத்துக்குப் போகிறேன்.":
        native: "I am going to the garden."
        bases:
          "தோட்டத்துக்குப்": "garden"
          "போகிறேன்": "am going; from போ (pō), to go"
  "ta-0283":
    native: "toilet; bathroom"
    notes:
      n1: "A toilet, or a bathroom with a toilet."
    examples:
      "கழிவறை எங்கே?":
        native: "Where is the toilet?"
        bases:
          "கழிவறை": "toilet; bathroom"
      "இது கழிவறை.":
