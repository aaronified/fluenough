tags: ["grammar", "unreviewed"]
pattern:
  name: "Noun plus verb"
  slot_name: "form"
  entries:
    "utavi": "help"
    "velai": "work"
  notes: "A noun with a verb after it makes a new verb, and the course shows the three verbs that do this. With செய் (cey) in writing and பண்ணு (paṇṇu) in speech the result is to do that thing: உதவி செய்கிறேன் (utavi ceykiṟēṉ) and உதவி பண்றேன் (utavi paṇṟēṉ) both say I help. With ஆகு (āku) the result is to become, and with படு (paṭu) it is to feel. The noun comes first and does not change. Not yet checked by a Tamil speaker: please report any mistake."
