schema: 1
id: "ta-en-news"
kind: "layer"
core: "ta-news"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "News and the media"
description: "Newspapers, radio and television news: reporters and reports, accidents and disasters, elections and parties, courts and crime, and the verbs of announcing and warning. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-7120":
    native: "reporter"
    notes:
      n1: "A reporter for a paper or channel; used for men and women alike."
    examples:
      "நிருபர் வருகிறார்.":
        native: "The reporter is coming."
        bases:
          "நிருபர்": "reporter"
          "வருகிறார்": "comes (respectful); from வா (vā), to come"
      "நிருபர் கேள்வி கேட்கிறார்.":
        native: "The reporter asks a question."
        bases:
          "நிருபர்": "reporter"
          "கேட்கிறார்": "asks (respectful); from கேள் (kēḷ), to ask"
  "ta-7121":
    native: "journalist; news reporter"
    notes:
      n1: "A longer, more formal word than நிருபர் (nirupar); it is built from செய்தி (ceyti) (news)."
    examples:
      "அவர் செய்தியாளர்.":
        native: "He is a journalist."
        bases:
          "அவர்": "he or she (polite)"
          "செய்தியாளர்": "journalist; news reporter"
      "செய்தியாளர் செய்தி சொல்கிறார்.":
        native: "The journalist gives the news."
        bases:
          "செய்தியாளர்": "journalist; news reporter"
          "சொல்கிறார்": "is saying (respectful); from சொல் (col), to say; to tell"
  "ta-7122":
    native: "media"
    notes:
      n1: "The media in general, as in 'the media says'."
    examples:
      "ஊடகம் முக்கியம்.":
        native: "The media is important."
        bases:
          "ஊடகம்": "media"
          "முக்கியம்": "important"
      "ஊடகத்தில் செய்தி வருகிறது.":
        native: "The news comes in the media."
        bases:
          "ஊடகத்தில்": "in the media; from ஊடகம் (ūṭakam), media"
          "வருகிறது": "is coming; from வா (vā), come"
  "ta-7123":
    native: "article; essay"
    notes:
      n1: "Used for a newspaper article and for a school essay."
    examples:
      "இது நல்ல கட்டுரை.":
        native: "This is a good article."
        bases:
          "கட்டுரை": "article; essay"
      "நான் கட்டுரை படிக்கிறேன்.":
        native: "I am reading an article."
        bases:
          "கட்டுரை": "article; essay"
          "படிக்கிறேன்": "am studying; from படி (paṭi), to study"
  "ta-7124":
    native: "editorial"
    notes:
      n1: "Literally head-part, the lead piece of a paper; இன்றைய (iṉṟaiya) (today's) is the form of இன்று (iṉṟu) (today) used before a noun."
    examples:
      "இன்றைய தலையங்கம் நல்லது.":
        native: "Today's editorial is good."
        bases:
          "இன்றைய": "today's; from இன்று (iṉṟu), today"
          "தலையங்கம்": "editorial"
      "தலையங்கம் படி.":
        native: "Read the editorial."
        bases:
          "தலையங்கம்": "editorial"
  "ta-7125":
    native: "interview (in the media)"
    notes:
      n1: "Tamil 'takes' (எடு (eṭu)) an interview; a job interview is நேர்காணல் (nērkāṇal)."
    examples:
      "நிருபர் பேட்டி எடுக்கிறார்.":
        native: "The reporter is taking an interview."
        bases:
          "பேட்டி": "interview (in the media)"
          "எடுக்கிறார்": "he takes; he makes (a film); from எடு (eṭu), to take"
      "இன்று பேட்டி இருக்கிறது.":
        native: "There is an interview today."
        bases:
          "பேட்டி": "interview (in the media)"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7126":
    native: "live broadcast"
    notes:
      n1: "Literally direct line; used for live coverage on television and online."
    examples:
      "இது நேரலை.":
        native: "This is live."
        bases:
          "நேரலை": "live broadcast"
      "நேரலை பார்க்கிறேன்.":
        native: "I am watching the live broadcast."
        bases:
          "நேரலை": "live broadcast"
          "பார்க்கிறேன்": "am watching; from பார் (pār), to see; to look"
  "ta-7127":
    native: "announcer"
    notes:
      n1: "The person who gives the அறிவிப்பு (aṟivippu) (announcement)."
    examples:
      "அறிவிப்பாளர் பேசுகிறார்.":
        native: "The announcer is speaking."
        bases:
          "அறிவிப்பாளர்": "announcer"
          "பேசுகிறார்": "is speaking; from பேசு (pēcu), to speak"
      "அவர் வானொலி அறிவிப்பாளர்.":
        native: "He is a radio announcer."
        bases:
          "அவர்": "he or she (polite)"
          "அறிவிப்பாளர்": "announcer"
  "ta-7128":
    native: "rumour"
    notes:
      n1: "Used for gossip that may not be true; people warn 'do not believe rumours'."
    examples:
      "இது வதந்தி.":
        native: "This is a rumour."
        bases:
          "வதந்தி": "rumour"
      "வதந்தி பரவுகிறது.":
        native: "The rumour is spreading."
        bases:
          "வதந்தி": "rumour"
          "பரவுகிறது": "spreads; from பரவு (paravu), to spread"
  "ta-7129":
    native: "truth; fact"
    notes:
      n1: "Also used as an adjective phrase: உண்மை (uṇmai) alone is 'true' or 'really'."
    examples:
      "இது உண்மை.":
        native: "This is true."
        bases:
          "உண்மை": "truth; fact"
      "உண்மை சொல்.":
        native: "Tell the truth."
        bases:
          "உண்மை": "truth; fact"
  "ta-7130":
    native: "lie; falsehood"
    notes:
      n1: "Tamil 'says' (சொல் (col)) a lie; the same word means 'false'."
    examples:
      "இது பொய்.":
        native: "This is false."
        bases:
          "பொய்": "lie; falsehood"
      "அவன் பொய் சொல்கிறான்.":
        native: "He is lying."
        bases:
          "அவன்": "his"
          "பொய்": "lie; falsehood"
          "சொல்கிறான்": "is saying (he); from சொல் (col), to say; to tell"
  "ta-7131":
    native: "explanation"
    notes:
      n1: "Tamil 'gives' (கொடு (koṭu)) an explanation, and 'asks' for it."
    examples:
      "எனக்கு விளக்கம் வேண்டும்.":
        native: "I need an explanation."
        bases:
          "எனக்கு": "to me; for me; from நான் (nāṉ), I; me"
          "விளக்கம்": "explanation"
      "அமைச்சர் விளக்கம் கொடுக்கிறார்.":
        native: "The minister is giving an explanation."
        bases:
          "அமைச்சர்": "minister"
          "விளக்கம்": "explanation"
          "கொடுக்கிறார்": "is giving; from கொடு (koṭu), to give"
  "ta-7132":
    native: "fire"
    notes:
      n1: "The word for a blaze or flame; for the fire used in cooking, people also say நெருப்பு (neruppu)."
    examples:
      "தீ பரவுகிறது.":
        native: "The fire is spreading."
        bases:
          "தீ": "fire"
          "பரவுகிறது": "spreads; from பரவு (paravu), to spread"
      "அங்கே தீ.":
        native: "There is a fire there."
        bases:
          "அங்கே": "there"
          "தீ": "fire"
  "ta-7133":
    native: "earthquake"
    notes:
      n1: "Literally land shaking; it 'comes' (வந்தது (vantatu)), like other sudden events."
    examples:
      "நிலநடுக்கம் வந்தது.":
        native: "An earthquake came."
        bases:
          "நிலநடுக்கம்": "earthquake"
          "வந்தது": "came; from வா (vā), to come"
      "நிலநடுக்கம் பெரிய ஆபத்து.":
        native: "An earthquake is a big danger."
        bases:
          "நிலநடுக்கம்": "earthquake"
  "ta-7134":
    native: "riot; unrest"
    notes:
      n1: "Used in news for riots and violent unrest."
    examples:
      "நகரத்தில் கலவரம்.":
        native: "Unrest in the city."
        bases:
          "நகரத்தில்": "in the city; from நகரம் (nakaram), city; town"
          "கலவரம்": "riot; unrest"
      "கலவரம் குறைகிறது.":
        native: "The unrest is dying down."
        bases:
          "கலவரம்": "riot; unrest"
          "குறைகிறது": "goes down; from குறை (kuṟai), to decrease; to lessen"
  "ta-7135":
    native: "attack"
    notes:
      n1: "In news it 'happens' (நடந்தது (naṭantatu), took place), as events do."
    examples:
      "தாக்குதல் நடந்தது.":
        native: "An attack took place."
        bases:
          "தாக்குதல்": "attack"
          "நடந்தது": "happened; took place; from நட (naṭa), to walk; to happen"
      "நேற்று தாக்குதல்.":
        native: "An attack yesterday."
        bases:
          "தாக்குதல்": "attack"
  "ta-7136":
    native: "incident; event"
    notes:
      n1: "A news word for something that happened, often unpleasant."
    examples:
      "இது ஒரு சம்பவம்.":
        native: "This is an incident."
        bases:
          "சம்பவம்": "incident; event"
      "சம்பவம் நேற்று நடந்தது.":
        native: "The incident happened yesterday."
        bases:
          "சம்பவம்": "incident; event"
          "நடந்தது": "happened; took place; from நட (naṭa), to walk; to happen"
  "ta-7137":
    native: "impact; damage; effect"
    notes:
      n1: "Used for the harm a flood, storm or illness does to people."
    examples:
      "வெள்ளத்தால் பாதிப்பு.":
        native: "Damage from the flood."
        bases:
          "வெள்ளத்தால்": "by the flood; with the flood; from வெள்ளம் (veḷḷam), flood"
          "பாதிப்பு": "impact; damage; effect"
      "பாதிப்பு அதிகம்.":
        native: "The damage is great."
        bases:
          "பாதிப்பு": "impact; damage; effect"
  "ta-7138":
    native: "life; breath"
    notes:
      n1: "The word for life in the sense of staying alive; உயிர் (uyir) பிழை (piḻai) means 'to survive'."
    examples:
      "உயிர் முக்கியம்.":
        native: "Life is important."
        bases:
          "உயிர்": "life; breath"
          "முக்கியம்": "important"
      "அவர் உயிர் பிழைத்தார்.":
        native: "He survived."
        bases:
          "அவர்": "he or she (polite)"
          "உயிர்": "life; breath"
          "பிழைத்தார்": "survived (respectful); from பிழை (piḻai), to survive"
  "ta-7139":
    native: "death"
    notes:
      n1: "The written, polite word for death; used in news and condolences."
    examples:
      "மரணம் வருகிறது.":
        native: "Death comes."
        bases:
          "மரணம்": "death"
          "வருகிறது": "is coming; from வா (vā), come"
      "அவர் மரணம் துக்கம்.":
        native: "His death is a sorrow."
        bases:
          "அவர்": "he or she (polite)"
          "மரணம்": "death"
  "ta-7140":
    native: "election"
    notes:
      n1: "An election 'happens' (நடக்கிறது (naṭakkiṟatu)), so it takes the verb of events."
    examples:
      "தேர்தல் நடக்கிறது.":
        native: "The election is taking place."
        bases:
          "தேர்தல்": "election"
          "நடக்கிறது": "happens; from நட (naṭa), to walk; to happen"
      "தேர்தல் அடுத்த மாதம்.":
        native: "The election is next month."
        bases:
          "தேர்தல்": "election"
  "ta-7141":
    native: "vote"
    notes:
      n1: "Tamil 'puts' (போடு (pōṭu)) a vote; the same word also means a word or a promise."
    examples:
      "உன் வாக்கு முக்கியம்.":
        native: "Your vote is important."
        bases:
          "உன்": "your; from நீ (nī), you (to a friend or child)"
          "வாக்கு": "vote"
          "முக்கியம்": "important"
      "நான் வாக்கு போடுகிறேன்.":
        native: "I cast my vote."
        bases:
          "வாக்கு": "vote"
          "போடுகிறேன்": "put on; from போடு (pōṭu), to put; to throw"
  "ta-7142":
    native: "candidate"
    notes:
      n1: "A candidate for an election; used for men and women alike."
    examples:
      "அவர் வேட்பாளர்.":
        native: "He is a candidate."
        bases:
          "அவர்": "he or she (polite)"
          "வேட்பாளர்": "candidate"
      "வேட்பாளர் பேசுகிறார்.":
        native: "The candidate is speaking."
        bases:
          "வேட்பாளர்": "candidate"
          "பேசுகிறார்": "is speaking; from பேசு (pēcu), to speak"
  "ta-7143":
    native: "campaign; propaganda"
    notes:
      n1: "Used for election campaigns and for awareness campaigns."
    examples:
      "பிரச்சாரம் நடக்கிறது.":
        native: "The campaign is going on."
        bases:
          "பிரச்சாரம்": "campaign; propaganda"
          "நடக்கிறது": "happens; from நட (naṭa), to walk; to happen"
      "இன்று பிரச்சாரம் இருக்கிறது.":
        native: "There is a campaign event today."
        bases:
          "பிரச்சாரம்": "campaign; propaganda"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7144":
    native: "debate; discussion"
    notes:
      n1: "Used for a formal debate on television or in a hall; for a chat people say பேச்சு (pēccu)."
    examples:
      "விவாதம் நடக்கிறது.":
        native: "A debate is going on."
        bases:
          "விவாதம்": "debate; discussion"
          "நடக்கிறது": "happens; from நட (naṭa), to walk; to happen"
      "நாளை விவாதம் இருக்கிறது.":
        native: "There is a debate tomorrow."
        bases:
          "விவாதம்": "debate; discussion"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7145":
    native: "political party"
    notes:
      n1: "A political party; the word also means a side in a dispute."
    examples:
      "இது என் கட்சி.":
        native: "This is my party."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "கட்சி": "political party"
      "கட்சி தலைவர் பேசுகிறார்.":
        native: "The party leader is speaking."
        bases:
          "கட்சி": "political party"
          "பேசுகிறார்": "is speaking; from பேசு (pēcu), to speak"
  "ta-7146":
    native: "chief minister"
    notes:
      n1: "The head of a state's government; built from முதல் (mutal) (first) and அமைச்சர் (amaiccar) (minister)."
    examples:
      "முதலமைச்சர் வருகிறார்.":
        native: "The chief minister is coming."
        bases:
          "முதலமைச்சர்": "chief minister"
          "வருகிறார்": "comes (respectful); from வா (vā), to come"
      "முதலமைச்சர் பேசுகிறார்.":
        native: "The chief minister is speaking."
        bases:
          "முதலமைச்சர்": "chief minister"
          "பேசுகிறார்": "is speaking; from பேசு (pēcu), to speak"
  "ta-7147":
    native: "prime minister"
    notes:
      n1: "The head of the national government; the -ர் (-r) ending is the respectful form."
    examples:
      "பிரதமர் பேசுகிறார்.":
        native: "The prime minister is speaking."
        bases:
          "பிரதமர்": "prime minister"
          "பேசுகிறார்": "is speaking; from பேசு (pēcu), to speak"
      "பிரதமர் இங்கே வருகிறார்.":
        native: "The prime minister is coming here."
        bases:
          "பிரதமர்": "prime minister"
          "வருகிறார்": "comes (respectful); from வா (vā), to come"
  "ta-7148":
    native: "politics"
    notes:
      n1: "Politics in general; அரசியல் (araciyal) செய்தி (ceyti) is political news."
    examples:
      "எனக்கு அரசியல் பிடிக்காது.":
        native: "I do not like politics."
        bases:
          "எனக்கு": "to me; for me; from நான் (nāṉ), I; me"
          "அரசியல்": "politics"
      "அரசியல் செய்தி படிக்கிறேன்.":
        native: "I read political news."
        bases:
          "அரசியல்": "politics"
          "படிக்கிறேன்": "am studying; from படி (paṭi), to study"
  "ta-7149":
    native: "conference; convention"
    notes:
      n1: "A large public gathering or convention, such as a party or trade conference."
    examples:
      "நாளை மாநாடு.":
        native: "A conference tomorrow."
        bases:
          "மாநாடு": "conference; convention"
      "மாநாடு நகரத்தில் நடக்கிறது.":
        native: "The conference is taking place in the city."
        bases:
          "மாநாடு": "conference; convention"
          "நகரத்தில்": "in the city; from நகரம் (nakaram), city; town"
          "நடக்கிறது": "happens; from நட (naṭa), to walk; to happen"
  "ta-7150":
    native: "court case; lawsuit"
    notes:
      n1: "The word also means custom or usage in speech; in news it is a legal case."
    examples:
