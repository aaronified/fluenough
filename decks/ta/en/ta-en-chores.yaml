schema: 1
id: "ta-en-chores"
kind: "layer"
core: "ta-chores"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Household chores"
description: "Cleaning and household work: tools and things around the house, and the verbs of sweeping, washing, folding and pouring. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-1917":
    native: "cleanliness; clean"
    notes:
      n1: "சுத்தம் செய் (cuttam cey) is to clean: the noun with செய் (cey) (to do). Spoken Tamil often says சுத்தம் பண்ணு (cuttam paṇṇu)."
    examples:
      "வீடு சுத்தம்.":
        native: "The house is clean."
        bases:
          "சுத்தம்": "cleanliness; clean"
      "வீட்டைச் சுத்தம் செய்.":
        native: "Clean the house."
        bases:
          "வீட்டைச்": "the house (as object); from வீடு (vīṭu), house; home"
          "சுத்தம்": "cleanliness; clean"
  "ta-1918":
    native: "vessel; dish; utensil"
    notes:
      n1: "Any cooking or serving vessel; பாத்திரம் கழுவு (pāttiram kaḻuvu) is wash the dishes."
    examples:
      "பாத்திரம் கழுவு.":
        native: "Wash the dishes."
        bases:
          "பாத்திரம்": "vessel; dish; utensil"
      "பாத்திரம் எங்கே?":
        native: "Where is the vessel?"
        bases:
          "பாத்திரம்": "vessel; dish; utensil"
  "ta-1919":
    native: "broom"
    notes:
      n1: "The broom used to sweep the floor."
    examples:
      "துடைப்பம் எங்கே?":
        native: "Where is the broom?"
        bases:
          "துடைப்பம்": "broom"
      "துடைப்பம் கொடு.":
        native: "Give me the broom."
        bases:
          "துடைப்பம்": "broom"
  "ta-1920":
    native: "rubbish; waste"
    notes:
      n1: "Household waste."
    examples:
      "குப்பை எங்கே?":
        native: "Where is the rubbish?"
        bases:
          "குப்பை": "rubbish; waste"
      "இங்கே குப்பை இல்லை.":
        native: "There is no rubbish here."
        bases:
          "குப்பை": "rubbish; waste"
  "ta-1921":
    native: "dustbin"
    notes:
      n1: "Made of குப்பை (kuppai) (rubbish) and தொட்டி (toṭṭi) (tub)."
    examples:
      "இது குப்பைத்தொட்டி.":
        native: "This is the dustbin."
        bases:
          "குப்பைத்தொட்டி": "dustbin"
      "குப்பைத்தொட்டி எங்கே?":
        native: "Where is the dustbin?"
        bases:
          "குப்பைத்தொட்டி": "dustbin"
  "ta-1922":
    native: "floor; ground"
    notes:
      n1: "The floor of a room. With -ஐ (-ai) the object form is தரையை (taraiyai)."
    examples:
      "தரை சுத்தம்.":
        native: "The floor is clean."
        bases:
          "தரை": "floor; ground"
      "தரையைப் பெருக்கு.":
        native: "Sweep the floor."
        bases:
          "தரையைப்": "the floor (as object); from தரை (tarai), floor; ground"
  "ta-1923":
    native: "wall"
    notes:
      n1: "A wall of a house. The ending -இல் (-il) gives சுவரில் (cuvaril), on the wall."
    examples:
      "சுவர் வெள்ளை.":
        native: "The wall is white."
        bases:
          "சுவர்": "wall"
      "சுவரில் படம்.":
        native: "A picture on the wall."
        bases:
          "சுவரில்": "on the wall; from சுவர் (cuvar), wall"
  "ta-1924":
    native: "door"
    notes:
      n1: "A door; கதவு திற (katavu tiṟa) is open the door."
    examples:
      "கதவு திற.":
        native: "Open the door."
        bases:
          "கதவு": "door"
      "கதவு மூடு.":
        native: "Close the door."
        bases:
          "கதவு": "door"
  "ta-1925":
    native: "ceiling fan"
    notes:
      n1: "Made of மின் (miṉ) (electric) and விசிறி (viciṟi) (fan)."
    examples:
      "மின்விசிறி போடு.":
        native: "Switch on the fan."
        bases:
          "மின்விசிறி": "ceiling fan"
      "மின்விசிறி எங்கே?":
        native: "Where is the fan?"
        bases:
          "மின்விசிறி": "ceiling fan"
  "ta-1926":
    native: "lamp; light"
    notes:
      n1: "A lamp or a light. A lit lamp is part of many prayers and festivals."
    examples:
      "விளக்கு ஏற்று.":
        native: "Light the lamp."
        bases:
          "விளக்கு": "lamp; light"
      "விளக்கு எங்கே?":
        native: "Where is the lamp?"
        bases:
          "விளக்கு": "lamp; light"
  "ta-1927":
    native: "electricity"
    notes:
      n1: "Electric power; மின்சாரம் இல்லை (miṉcāram illai) says the power is out."
    examples:
      "மின்சாரம் இல்லை.":
        native: "There is no electricity."
        bases:
          "மின்சாரம்": "electricity"
      "மின்சாரம் வேண்டும்.":
        native: "Electricity is needed."
        bases:
          "மின்சாரம்": "electricity"
  "ta-1928":
    native: "soap"
    notes:
      n1: "The English loan for soap."
    examples:
      "சோப்பு கொடு.":
        native: "Give me the soap."
        bases:
