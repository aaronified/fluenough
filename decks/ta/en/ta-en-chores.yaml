        bases:
          "இஸ்திரி": "ironing"
      "இஸ்திரி போடு.":
        native: "Iron the clothes."
        bases:
          "இஸ்திரி": "ironing"
  "ta-1931":
    native: "box; suitcase"
    notes:
      n1: "A box or a suitcase."
    examples:
      "பெட்டி திற.":
        native: "Open the box."
        bases:
          "பெட்டி": "box; suitcase"
      "இது பெரிய பெட்டி.":
        native: "This is a big box."
        bases:
          "பெட்டி": "box; suitcase"
  "ta-1932":
    native: "mat"
    notes:
      n1: "A mat to sleep or sit on."
    examples:
      "பாய் போடு.":
        native: "Spread the mat."
        bases:
          "பாய்": "mat"
      "பாய் எங்கே?":
        native: "Where is the mat?"
        bases:
          "பாய்": "mat"
