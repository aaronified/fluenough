      "சோப்பு இல்லை.":
        native: "There is no soap."
        bases:
          "சோப்பு": "soap"
  "ta-1929":
    native: "bucket"
    notes:
      n1: "A bucket for water. The ending -இல் (-il) gives வாளியில் (vāḷiyil), in the bucket."
    examples:
      "வாளி எங்கே?":
        native: "Where is the bucket?"
        bases:
          "வாளி": "bucket"
      "வாளியில் தண்ணீர்.":
        native: "Water in the bucket."
        bases:
          "வாளியில்": "in the bucket; from வாளி (vāḷi), bucket"
  "ta-1930":
    native: "ironing"
    notes:
      n1: "இஸ்திரி போடு (istiri pōṭu) is to iron clothes; the verb is போடு (pōṭu), to put."
    examples:
      "துணி இஸ்திரி.":
