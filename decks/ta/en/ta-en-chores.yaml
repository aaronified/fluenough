      "பூட்டு எங்கே?":
        native: "Where is the lock?"
        bases:
          "பூட்டு": "lock"
  "ta-1945":
    native: "to sweep"
    notes:
      n1: "The spoken word for sweeping the floor; கூட்டு (kūṭṭu) (kūṭṭu) is used in some regions."
