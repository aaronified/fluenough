schema: 1
id: "ta-en-feelings-sentences"
kind: "layer"
core: "ta-feelings-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Feelings in sentences"
description: "Sentences about how people feel: happy, worried, angry, afraid, hopeful and tired. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-9010":
    native: "I am getting angry."
    notes:
      n1: "Feelings come to you, so the person takes the 'to' ending, as in எனக்கு (eṉakku) (to me), and the feeling is what வருகிறது (varukiṟatu) (comes)."
    bases:
      "எனக்குக்": "to me; for me; from நான் (nāṉ), I; me"
      "வருகிறது": "is coming; from வா (vā), come"
    confusables:
      w1: { why: "கவலை (kavalai), worry; concern, is a different word." }
      w2: { why: "வெறுப்பு (veṟuppu), hatred; dislike, is a different word." }
      w3: { why: "எரிச்சல் (ericcal), irritation; annoyance, is a different word." }
  "ta-9011":
    native: "The child feels shy."
    bases:
      "குழந்தைக்கு": "to the child; from குழந்தை (kuḻantai), child"
    confusables:
      w1: { why: "பொறாமை (poṟāmai), jealousy; envy, is a different word." }
      w2: { why: "எரிச்சல் (ericcal), irritation; annoyance, is a different word." }
  "ta-9012":
    native: "I wish for it."
    bases:
      "ஆசைப்படுகிறேன்": "am wishing for; from ஆசைப்படு (ācaippaṭu), to wish for; to want badly"
    confusables:
      w1: { why: "எதிர்பார் (etirpār), to expect; to hope for, is a different word." }
      w2: { why: "உணர் (uṇar), to feel; to realise, is a different word." }
      w3: { why: "வெறு (veṟu), to hate; to dislike, is a different word." }
  "ta-9013":
    native: "Mother is worried."
    bases:
      "அம்மாவுக்குக்": "for mother; from அம்மா (ammā), mother"
    confusables:
      w1: { why: "பதற்றம் (pataṟṟam), nervousness; panic, is a different word." }
      w2: { why: "குழப்பம் (kuḻappam), confusion, is a different word." }
      w3: { why: "நிம்மதி (nimmati), peace of mind; relief, is a different word." }
  "ta-9014":
    native: "This is a surprise."
    confusables:
      w1: { why: "அதிர்ச்சி (atircci), shock, is a different word." }
      w2: { why: "ஏமாற்றம் (ēmāṟṟam), disappointment, is a different word." }
  "ta-9015":
    native: "Say sorry."
    confusables:
      w1: { why: "ஆறுதல் (āṟutal), comfort; consolation, is a different word." }
      w2: { why: "மரியாதை (mariyātai), respect, is a different word." }
  "ta-9016":
    native: "We expect rain."
    bases:
      "மழையை": "the rain; from மழை (maḻai), rain"
      "எதிர்பார்க்கிறோம்": "are expecting (we); from எதிர்பார் (etirpār), to expect; to hope for"
    confusables:
      w1: { why: "ஆசைப்படு (ācaippaṭu), to wish for; to want badly, is a different word." }
      w2: { why: "உணர் (uṇar), to feel; to realise, is a different word." }
  "ta-9017":
    native: "I have hope."
    bases:
      "எனக்கு": "to me; for me; from நான் (nāṉ), I; me"
      "இருக்கிறது": "is; from இரு (iru), to be"
    confusables:
      w1: { why: "தைரியம் (tairiyam), courage, is a different word." }
      w2: { why: "பொறுமை (poṟumai), patience, is a different word." }
      w3: { why: "ஆசை (ācai), wish; desire, is a different word." }
  "ta-9018":
    native: "His mood is not right."
    bases:
      "அவன்": "his"
      "சரியில்லை": "not right; from சரி (cari), okay"
    confusables:
      w1: { why: "உணர்வு (uṇarvu), feeling; sense, is a different word." }
      w2: { why: "வருத்தம் (varuttam), sadness; regret, is a different word." }
  "ta-9019":
    native: "I am missing you."
    notes:
      n1: "The spoken way to say you miss someone is that their memory comes."
    bases:
      "உன்": "your; from நீ (nī), you (to a friend or child)"
      "வருகிறது": "is coming; from வா (vā), come"
    confusables:
      w1: { why: "நினைவு (niṉaivu), memory; thought, is a different word." }
      w2: { why: "ஏக்கம் (ēkkam), longing; yearning, is a different word." }
