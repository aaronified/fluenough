id: "ta-en-abstract-words-sentences"
kind: "layer"
core: "ta-abstract-words-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Abstract words: ideas, values, feelings and duty in sentences"
description: "Sentences that use abstract words: honesty, courage, hard work, meaning and values. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-9600":
    native: "He has both honesty and courage."
    bases:
      "அவனிடம்": "with him; from அவன் (avaṉ), he"
      "நேர்மையும்": "honesty too; from நேர்மை (nērmai), honesty"
      "துணிச்சலும்": "courage too; from துணிச்சல் (tuṇiccal), boldness"
      "இருக்கின்றன": "are; from இரு (iru), to be"
    notes:
      n1: "-உம் (-um) on each noun means and: நேர்மையும் துணிச்சலும் (nērmaiyum tuṇiccalum); two things take the plural verb இருக்கின்றன (irukkiṉṟaṉa)."
    confusables:
      w1: { why: "ஞானம் (ñāṉam), wisdom; deep knowledge, is a different word." }
      w2: { why: "பணிவு (paṇivu), humility; politeness, is a different word." }
      w3: { why: "அறிவு (aṟivu), knowledge; intelligence, is a different word." }
  "ta-9601":
    native: "He achieves through effort."
    bases:
      "முயற்சியால்": "through effort; from முயற்சி (muyaṟci), effort"
      "சாதிக்கிறான்": "he achieves; from சாதி (cāti), to achieve"
    notes:
      n1: "The means takes -ஆல் (-āl): முயற்சியால் (muyaṟciyāl), by effort."
    confusables:
      w1: { why: "உழைப்பு (uḻaippu), labour; hard work, is a different word." }
      w2: { why: "வாய்ப்பு (vāyppu), opportunity; chance, is a different word." }
      w3: { why: "அதிர்ஷ்டம் (atirṣṭam), luck; good fortune, is a different word." }
  "ta-9602":
    native: "I do not understand the meaning of this word."
    bases:
      "இந்த": "this (before a noun)"
      "வார்த்தையின்": "of the word; from வார்த்தை (vārttai), word"
      "எனக்குப்": "to me; from நான் (nāṉ), I"
      "புரியவில்லை": "did not become clear; from புரி (puri), to understand"
    notes:
      n1: "Understanding takes -க்கு (-kku): எனக்குப் புரியவில்லை (eṉakkup puriyavillai), it did not become clear to me."
    confusables:
      w1: { why: "பொருள் (poruḷ), thing; goods; meaning, is a different word." }
      w2: { why: "கருத்து (karuttu), opinion; view; comment, is a different word." }
      w3: { why: "எண்ணம் (eṇṇam), thought; idea; intention, is a different word." }
  "ta-9603":
    native: "There is both pleasure and suffering in life."
    bases:
      "வாழ்க்கையில்": "in life; from வாழ்க்கை (vāḻkkai), life"
      "இன்பமும்": "pleasure too; from இன்பம் (iṉpam), pleasure"
      "துன்பமும்": "hardship too; from துன்பம் (tuṉpam), hardship"
      "உண்டு": "there is"
    notes:
      n1: "உண்டு (uṇṭu), there is is the written form; in speech people say இருக்கிறது (irukkiṟatu), there is."
    confusables:
      w1: { why: "வேதனை (vētaṉai), pain; anguish, is a different word." }
      w2: { why: "மகிழ்ச்சி (makiḻcci), happiness; joy, is a different word." }
      w3: { why: "சோகம் (cōkam), sadness; sorrow, is a different word." }
  "ta-9604":
    native: "Ask your conscience."
    bases:
      "உன்": "your; from நீ (nī), you (to a friend or child)"
      "மனசாட்சியைக்": "the conscience (object); from மனசாட்சி (maṉacāṭci), conscience"
    confusables:
      w1: { why: "புத்தி (putti), intellect; mind; sense, is a different word." }
      w2: { why: "மனம் (maṉam), mind; heart, is a different word." }
      w3: { why: "அறிவு (aṟivu), knowledge; intelligence, is a different word." }
  "ta-9605":
    native: "She reaches her ambition."
    bases:
      "தன்": "one's own; from தான் (tāṉ), oneself"
      "லட்சியத்தை": "the ambition (object); from லட்சியம் (laṭciyam), ambition"
      "அடைகிறாள்": "she reaches; from அடை (aṭai), to reach"
    notes:
      n1: "தன் (taṉ), one's own points back to the subject: தன் லட்சியம் (taṉ laṭciyam) is her own ambition."
    confusables:
      w1: { why: "இலக்கு (ilakku), goal; target, is a different word." }
      w2: { why: "கனவு (kaṉavu), dream, is a different word." }
      w3: { why: "ஆசை (ācai), wish; desire, is a different word." }
  "ta-9606":
    native: "Arrogance is a cause of a fall."
    bases:
      "வீழ்ச்சிக்குக்": "for a fall; from வீழ்ச்சி (vīḻcci), fall"
    confusables:
      w1: { why: "அகங்காரம் (akaṅkāram), ego; haughtiness, is a different word." }
      w2: { why: "பேராசை (pērācai), greed, is a different word." }
      w3: { why: "சோம்பல் (cōmpal), laziness, is a different word." }
  "ta-9607":
    native: "There is no disunity among us."
    bases:
      "நமக்குள்": "among us; from நாம் (nām), we (including you)"
    notes:
      n1: "இல்லை (illai), is not is the negative of இருக்கிறது (irukkiṟatu), is for things."
    confusables:
      w1: { why: "ஒற்றுமை (oṟṟumai), unity; togetherness, is a different word." }
      w2: { why: "சகோதரத்துவம் (cakōtarattuvam), brotherhood; fellow feeling, is a different word." }
      w3: { why: "சமத்துவம் (camattuvam), equality, is a different word." }
  "ta-9608":
    native: "Speak with humility."
    bases:
      "பணிவுடன்": "with humility; from பணிவு (paṇivu), humility"
    notes:
      n1: "-உடன் (-uṭaṉ) means with: பணிவுடன் (paṇivuṭaṉ), with humility."
    confusables:
      w1: { why: "பண்பு (paṇpu), quality; good character; culture, is a different word." }
      w2: { why: "ஒழுக்கம் (oḻukkam), discipline; good conduct, is a different word." }
      w3: { why: "மரியாதை (mariyātai), respect, is a different word." }
