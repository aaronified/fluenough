cards:
  "ta-9040":
    native: "I need a room."
    bases:
      "எனக்கு": "to me; for me; from நான் (nāṉ), I; me"
    confusables:
      w1: { why: "வாடகை (vāṭakai), rent; hire charge, is a different word." }
      w2: { why: "வசதி (vacati), facility; convenience, is a different word." }
      w3: { why: "ரத்து (rattu), cancellation, is a different word." }
  "ta-9041":
    native: "I am going to the airport tomorrow."
    bases:
      "விமானநிலையத்துக்குப்": "to the airport; for the airport; from விமானநிலையம் (vimāṉanilaiyam), airport"
      "போகிறேன்": "am going; from போ (pō), to go"
    confusables:
      w1: { why: "ரயில்நிலையம் (rayilnilaiyam), railway station, is a different word." }
      w2: { why: "பேருந்துநிலையம் (pēruntunilaiyam), bus station, is a different word." }
  "ta-9042":
    native: "The passport is here."
    bases:
      "இருக்கிறது": "is; from இரு (iru), to be"
    confusables:
      w1: { why: "சுங்கம் (cuṅkam), customs; duty, is a different word." }
      w2: { why: "குடியேற்றம் (kuṭiyēṟṟam), immigration, is a different word." }
  "ta-9043":
    native: "The room key is at reception."
    bases:
      "வரவேற்பறையில்": "at reception; from வரவேற்பறை (varavēṟpaṟai), reception room; lobby"
      "இருக்கிறது": "is; from இரு (iru), to be"
    confusables:
      w1: { why: "குளியலறை (kuḷiyalaṟai), bathroom, is a different word." }
      w2: { why: "வெந்நீர் (vennīr), hot water, is a different word." }
  "ta-9044":
    native: "This room has AC."
    bases:
      "இந்த": "this"
      "அறையில்": "in the room; from அறை (aṟai), room"
      "இருக்கிறது": "is; from இரு (iru), to be"
    confusables:
      w1: { why: "மின்தூக்கி (miṉtūkki), lift; elevator, is a different word." }
      w2: { why: "குளிர்சாதனம் (kuḷircātaṉam), air-conditioning, is a different word." }
  "ta-9045":
    native: "We are postponing the trip."
    bases:
      "பயணத்தை": "the journey; from பயணம் (payaṇam), journey; trip"
      "ஒத்திவைக்கிறோம்": "are postponing (we); from ஒத்திவை (ottivai), to postpone; to put off"
    confusables:
      w1: { why: "வந்தடை (vantaṭai), to arrive; to reach, is a different word." }
      w2: { why: "சென்றடை (ceṉṟaṭai), to reach; to get to, is a different word." }
      w3: { why: "இடமாற்று (iṭamāṟṟu), to transfer; to move to another place, is a different word." }
  "ta-9046":
    native: "How much is the entry fee here?"
    confusables:
      w1: { why: "பயணக்கட்டணம் (payaṇakkaṭṭaṇam), fare; travel charge, is a different word." }
      w2: { why: "வாடகை (vāṭakai), rent; hire charge, is a different word." }
  "ta-9047":
    native: "We are going trekking tomorrow."
    bases:
      "போகிறோம்": "go; from போ (pō), to go"
    confusables:
      w1: { why: "படகுச்சவாரி (paṭakuccavāri), boat ride, is a different word." }
      w2: { why: "உல்லாசப்பயணம் (ullācappayaṇam), pleasure trip; excursion, is a different word." }
  "ta-9048":
    native: "There is a good tourist spot here."
    bases:
      "இருக்கிறது": "is; from இரு (iru), to be"
    confusables:
      w1: { why: "நினைவுப்பொருள் (niṉaivupporuḷ), souvenir; keepsake, is a different word." }
      w2: { why: "முகாம் (mukām), camp, is a different word." }
      w3: { why: "கூடாரம் (kūṭāram), tent, is a different word." }
  "ta-9049":
    native: "I am tired from the trip."
    bases:
      "எனக்குப்": "to me; for me; from நான் (nāṉ), I; me"
      "இருக்கிறது": "is; from இரு (iru), to be"
    confusables:
      w1: { why: "நேரவித்தியாசம் (nēravittiyācam), time difference, is a different word." }
      w2: { why: "காலநிலை (kālanilai), climate; weather conditions, is a different word." }
