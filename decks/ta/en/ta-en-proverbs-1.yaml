# Layer for ta-proverbs-1: each proverb's literal English rendering and its meaning.
schema: 1
id: "ta-en-proverbs-1"
kind: "layer"
core: "ta-proverbs-1"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs 1"
description: "Twenty Tamil proverbs from Rev. P. Percival's 1874 collection, short first: animals, food, family and money. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-6200":
    native: "Said that a stubborn animal, or person, learns obedience only through firm discipline."
    notes:
      "literal": "Word for word: A bullock that is not beaten will not obey."
    bases:
      "அடியாத": { meaning: "not beaten" }
      "மாடு": { meaning: "bullock, cattle" }
      "படியாது": { meaning: "will not submit, will not obey" }
  "ta-6201":
    native: "Said that a frightened person is startled by the smallest thing."
    notes:
      "literal": "Word for word: Even a chick will scare the one who is afraid."
    bases:
      "அஞ்சினவனை": { meaning: "the one who is afraid" }
      "குஞ்சும்": { meaning: "even a chick" }
      "வெருட்டும்": { meaning: "will scare" }
  "ta-6202":
    native: "Said bitterly that a person without money is treated as if he were dead."
    notes:
      "literal": "Word for word: A man without money is a corpse."
    bases:
      "பணம்": { meaning: "money" }
      "இல்லாதவன்": { meaning: "one who does not have" }
      "பிணம்": { meaning: "corpse" }
  "ta-6203":
    native: "Said of money's power to ruin people."
    notes:
      "literal": "Word for word: Money's name is man-killer."
    bases:
      "பணத்துக்குப்": { meaning: "for money" }
      "பெயர்": { meaning: "name" }
      "ஆட்கொல்லி": { meaning: "man-killer" }
  "ta-6204":
    native: "Said that an unruly person can be handled only with a firm hand."
    notes:
      "literal": "Word for word: For a snake that will not be tamed, the king is a bamboo stick."
    bases:
      "அடங்காத": { meaning: "unruly, not submitting" }
      "பாம்பிற்கு": { meaning: "for a snake" }
      "ராஜா": { meaning: "king" }
      "மூங்கில்த்தடி": { meaning: "bamboo stick, as printed (modern spelling has a space)" }
  "ta-6205":
    native: "Often taken to mean that harming the one who sustains others brings ruin to those who depend on her."
    notes:
      "literal": "Word for word: If you kill the cow, will the calf survive?"
    bases:
      "பசுவைக்": { meaning: "the cow" }
      "கொன்றால்": { meaning: "if one kills" }
      "கன்று": { meaning: "calf" }
      "பிழைக்குமா": { meaning: "will it survive?" }
  "ta-6206":
    native: "Said that when food is scarce, nothing else can be managed either."
    notes:
      "literal": "Word for word: If food runs short, everything is short."
    bases:
      "அன்னம்": { meaning: "food, cooked rice" }
      "முட்டானால்": { meaning: "if it falls short" }
      "எல்லாம்": { meaning: "everything" }
      "முட்டு": { meaning: "shortage" }
  "ta-6207":
    native: "Said that even a small portion of food should be shared with guests before one eats it."
    notes:
      "literal": "Word for word: Even if it is only medicine, eat it together with guests."
    bases:
      "மருந்தே": { meaning: "medicine, with the emphatic ending" }
      "ஆயினும்": { meaning: "even if it is" }
      "விருந்தோடு": { meaning: "with guests, with a feast" }
      "உண்": { meaning: "eat" }
  "ta-6208":
    native: "Said that a man who neglects his own mother cannot be counted on to help anyone."
    notes:
      "literal": "Word for word: Whom will he help, who does not help his mother?"
    bases:
      "அன்னைக்கு": { meaning: "to mother" }
      "உதவாதான்": { meaning: "one who does not help" }
      "ஆருக்கு": { meaning: "to whom, an older form of யார் (yār)" }
      "உதவுவான்": { meaning: "will help" }
  "ta-6209":
    native: "Said of how dear one's own child is, however plain or poor."
    notes:
      "literal": "Word for word: Even if it is a clay child, it is one's own child."
    bases:
      "மண்பிள்ளை": { meaning: "clay child" }
      "ஆனாலும்": { meaning: "even if it is" }
      "தன்": { meaning: "one's own" }
      "பிள்ளை": { meaning: "child" }
  "ta-6210":
    native: "Said that coaxing words alone will not make someone hand over what they have."
    notes:
      "literal": "Word for word: If you call out 'Peacock, peacock', will it give you a feather?"
    bases:
      "மயிலே": { meaning: "peacock, in the calling form" }
      "என்றால்": { meaning: "if one says" }
      "இறகு": { meaning: "feather" }
      "கொடுக்குமா": { meaning: "will it give?" }
  "ta-6211":
    native: "Said that the main thing must come first, and the extras are useless without it."
    notes:
      "literal": "Word for word: What use is salt for a pot on the fire in which the rice was forgotten?"
    bases:
      "அரிசி": { meaning: "rice" }
      "மறந்த": { meaning: "forgotten" }
      "உலைக்கு": { meaning: "for the pot on the fire" }
      "உப்பு": { meaning: "salt" }
      "என்ன": { meaning: "what" }
  "ta-6212":
    native: "Said that a person carrying valuables is anxious on the way."
    notes:
      "literal": "Word for word: If there is weight in your waist-fold, there is fear on the road."
    bases:
      "மடியிலே": { meaning: "in the fold of the waist-cloth" }
      "கனம்": { meaning: "weight" }
      "இருந்தால்": { meaning: "if there is" }
      "வழியிலே": { meaning: "on the road" }
      "பயம்": { meaning: "fear" }
  "ta-6213":
    native: "Often taken to mean a comparison between a grazing animal, which has to walk to feed, and a household that eats up wealth while standing still."
    notes:
      "literal": "Word for word: The cow eats by moving about; the house eats without moving."
    bases:
      "அசைந்து": { meaning: "moving" }
      "தின்கிறது": { meaning: "eats" }
      "மாடு": { meaning: "cow, cattle" }
      "அசையாமல்": { meaning: "without moving" }
      "வீடு": { meaning: "house" }
  "ta-6214":
    native: "Often taken to mean that what counts is whether a thing does its job, not what it looks like or is made of."
    notes:
      "literal": "Word for word: Even if it is a clay cat, it is fine if it catches rats."
    bases:
      "மண்": { meaning: "clay" }
      "பூனை": { meaning: "cat" }
      "ஆனாலும்": { meaning: "even if it is" }
      "எலிப்": { meaning: "rat" }
      "பிடித்தால்": { meaning: "if it catches" }
      "சரி": { meaning: "fine, enough" }
  "ta-6215":
    native: "Often taken to mean that quality counts for more than numbers: a lion's single cub is worth more than a pig's many."
    notes:
      "literal": "Word for word: The pig has many young; the lion has one."
    bases:
      "பன்றி": { meaning: "pig" }
      "பல": { meaning: "many" }
      "குட்டி": { meaning: "young one, cub" }
      "சிங்கம்": { meaning: "lion" }
      "ஒரு": { meaning: "one" }
  "ta-6216":
    native: "Said that a truly hungry or tired person needs no comforts."
    notes:
      "literal": "Word for word: For hunger no curry is needed; for sleep no mat is needed."
    bases:
      "பசிக்குக்": { meaning: "for hunger" }
      "கறி": { meaning: "curry, side dish" }
      "வேண்டாம்": { meaning: "is not needed" }
      "தூக்கத்துக்குப்": { meaning: "for sleep" }
      "பாய்": { meaning: "mat" }
  "ta-6217":
    native: "Said that a hungry person does not mind how the food tastes, nor a sleepy one where he lies down."
    notes:
      "literal": "Word for word: Hunger does not know taste; sleep does not know comfort."
    bases:
      "பசி": { meaning: "hunger" }
      "ருசி": { meaning: "taste" }
      "அறியாது": { meaning: "does not know" }
      "நித்திரை": { meaning: "sleep" }
      "சுகம்": { meaning: "comfort" }
  "ta-6218":
    native: "Said that a small-minded person does not know how to handle sudden wealth."
    notes:
      "literal": "Word for word: If a petty person gets money, he does not know how to keep it."
    bases:
      "அற்பன்": { meaning: "petty, mean person" }
      "பணம்": { meaning: "money" }
      "படைத்தால்": { meaning: "if he acquires" }
      "வைக்க": { meaning: "to keep" }
      "வகை": { meaning: "way, manner" }
      "அறியான்": { meaning: "does not know" }
  "ta-6219":
    native: "Said that a little saved is worth more than a large sum spent as soon as it is earned."
    notes:
      "literal": "Word for word: One coin that is kept is worth more than a thousand gold pieces spent on the day."
    bases:
      "அன்றற": { meaning: "spent on the day, as printed" }
      "ஆயிரம்": { meaning: "thousand" }
      "பொன்னிலும்": { meaning: "than gold" }
      "நின்றற": { meaning: "kept, left over, as printed" }
      "ஒரு": { meaning: "one" }
      "காசு": { meaning: "coin, cash" }
      "பெரிது": { meaning: "great, big" }
