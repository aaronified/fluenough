schema: 1
id: "ta-en-describing"
kind: "layer"
core: "ta-describing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing things"
description: "Big and small, good and bad, new and old, hot and cold, beautiful. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-0167":
    native: "big"
    notes:
      n1: "Before a noun: பெரிய வீடு (periya vīṭu, a big house). The verb it comes from is பெரு (peru, to be big)."
    examples:
      "இது பெரிய வீடு.":
        native: "This is a big house."
        bases:
          "பெரிய": "big"
      "அது பெரிய காடு.":
        native: "That is a big forest."
        bases:
          "பெரிய": "big"
  "ta-0168":
    native: "small"
    notes:
      n1: "Before a noun: சின்ன வீடு (ciṉṉa vīṭu, a small house)."
    examples:
      "இது சின்ன வீடு.":
        native: "This is a small house."
        bases:
          "சின்ன": "small"
      "அவள் சின்ன குழந்தை.":
        native: "She is a small child."
        bases:
          "சின்ன": "small"
  "ta-0169":
    native: "good"
    notes:
      n1: "Before a noun: நல்ல பால் (nalla pāl, good milk). Alone, the word is நல்லது (nallatu, a good thing)."
    examples:
      "இது நல்ல பால்.":
        native: "This is good milk."
        bases:
          "நல்ல": "good"
      "அவர் நல்ல நண்பன்.":
        native: "He is a good friend."
        bases:
          "நல்ல": "good"
  "ta-0170":
    native: "bad"
    notes:
      n1: "Before a noun: கெட்ட கறி (keṭṭa kaṟi, bad curry); கெட்ட பெயர் (keṭṭa peyar, a bad name)."
    examples:
      "இது கெட்ட கறி.":
        native: "This is bad curry."
        bases:
          "கெட்ட": "bad"
      "அது கெட்ட பெயர்.":
        native: "That is a bad name."
        bases:
          "கெட்ட": "bad"
  "ta-0171":
    native: "new"
    notes:
      n1: "Before a noun: புதிய வீடு (putiya vīṭu, a new house)."
    examples:
      "இது புதிய வீடு.":
        native: "This is a new house."
        bases:
          "புதிய": "new"
      "அவள் புதிய நண்பி.":
        native: "She is a new friend."
        bases:
          "புதிய": "new"
  "ta-0172":
    native: "old"
    notes:
      n1: "Before a noun: பழைய பால் (paḻaiya pāl, old milk). The word is also used for old people and old friends."
    examples:
      "அது பழைய பால்.":
        native: "That is old milk."
        bases:
          "பழைய": "old"
      "அவன் பழைய நண்பன்.":
        native: "He is an old friend."
        bases:
          "பழைய": "old"
  "ta-0173":
    native: "hot"
    notes:
      n1: "Before a noun: சூடான பால் (cūṭāṉa pāl, hot milk). With இரு (iru, to be) it says something is hot."
    examples:
      "இது சூடான கறி.":
        native: "This is hot curry."
        bases:
          "சூடான": "hot"
      "இது சூடான பால்.":
        native: "This is hot milk."
        bases:
          "சூடான": "hot"
  "ta-0174":
    native: "cold"
    notes:
      n1: "Before a noun: குளிரான காற்று (kuḷirāṉa kāṟṟu, cold wind); குளிரான மாலை (kuḷirāṉa mālai, a cold evening)."
    examples:
      "இது குளிரான காற்று.":
        native: "This is cold wind."
        bases:
          "குளிரான": "cold"
          "காற்று": "wind"
      "இன்று குளிரான மாலை.":
        native: "This evening is cold."
        bases:
          "குளிரான": "cold"
  "ta-0175":
    native: "beautiful; handsome; pretty"
    notes:
      n1: "Before a noun, for a person or a thing: அழகான குழந்தை (aḻakāṉa kuḻantai, a pretty child)."
    examples:
      "அவர் அழகான மகன்.":
        native: "He is a handsome son."
        bases:
          "அழகான": "beautiful; handsome; pretty"
      "அவள் அழகான குழந்தை.":
        native: "She is a pretty child."
        bases:
          "அழகான": "beautiful; handsome; pretty"
