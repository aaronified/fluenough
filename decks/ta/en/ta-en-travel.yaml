schema: 1
id: "ta-en-travel"
kind: "layer"
core: "ta-travel"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Travel and tourism"
description: "Trips and tourism: booking, hotels and rooms, airports and customs, tourist places and sightseeing, and the verbs of arriving, leaving and putting off a trip. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-7233":
    native: "tourist"
    notes:
      n1: "A person on a சுற்றுலா (cuṟṟulā) (tour); used for men and women alike."
    examples:
      "அவர் சுற்றுலாப்பயணி.":
        native: "He is a tourist."
        bases:
          "அவர்": "he or she (polite)"
          "சுற்றுலாப்பயணி": "tourist"
      "சுற்றுலாப்பயணி வருகிறார்.":
        native: "The tourist is coming."
        bases:
          "சுற்றுலாப்பயணி": "tourist"
          "வருகிறார்": "comes (respectful); from வா (vā), to come"
  "ta-7234":
    native: "traveller; passenger"
    notes:
      n1: "Used for anyone on a journey, on a train, bus or flight."
    examples:
      "பயணி உள்ளே வருகிறார்.":
        native: "The passenger is coming in."
        bases:
          "பயணி": "traveller; passenger"
          "வருகிறார்": "comes (respectful); from வா (vā), to come"
      "இவர் எங்கள் பயணி.":
        native: "This is our passenger."
        bases:
          "எங்கள்": "our; from நாங்கள் (nāṅkaḷ), we (not including you)"
          "பயணி": "traveller; passenger"
  "ta-7235":
    native: "rent; hire charge"
    notes:
      n1: "The word for rent of a room and hire of a car or an auto; the person who pays it is not named separately."
    examples:
      "வாடகை எவ்வளவு?":
        native: "How much is the rent?"
        bases:
          "வாடகை": "rent; hire charge"
      "அறை வாடகை அதிகம்.":
        native: "The room rent is high."
        bases:
          "வாடகை": "rent; hire charge"
  "ta-7236":
    native: "registration; booking; record"
    notes:
      n1: "In a hotel, பதிவு (pativu) is the check-in or register entry; with முன் (muṉ) (before) it becomes முன்பதிவு (muṉpativu) (advance booking)."
    examples:
      "பதிவு முடிந்தது.":
        native: "The registration is done."
        bases:
          "பதிவு": "registration; booking; record"
          "முடிந்தது": "finished; ended; from முடி (muṭi), to end; to finish"
      "பதிவு வேண்டும்.":
        native: "A booking is needed."
        bases:
          "பதிவு": "registration; booking; record"
  "ta-7237":
    native: "customs; duty"
    notes:
      n1: "The customs desk at an airport or border; you 'pay' (கட்டு (kaṭṭu)) the duty."
    examples:
      "சுங்கம் இங்கே.":
        native: "Customs is here."
        bases:
          "சுங்கம்": "customs; duty"
      "சுங்கம் கட்டு.":
        native: "Pay the duty."
        bases:
          "சுங்கம்": "customs; duty"
  "ta-7238":
    native: "immigration"
    notes:
      n1: "The airport counter where passports are checked on arrival."
    examples:
      "குடியேற்றம் எங்கே?":
        native: "Where is immigration?"
        bases:
          "குடியேற்றம்": "immigration"
      "குடியேற்றம் அங்கே இருக்கிறது.":
        native: "Immigration is over there."
        bases:
          "குடியேற்றம்": "immigration"
          "அங்கே": "there"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7239":
    native: "cancellation"
    notes:
      n1: "A ரத்து (rattu) is a cancellation; to cancel something is ரத்து (rattu) செய் (cey) (do cancellation)."
    examples:
      "பயணம் ரத்து.":
        native: "The trip is cancelled."
        bases:
          "ரத்து": "cancellation"
      "ரத்து செய்தி வந்தது.":
        native: "News of the cancellation came."
        bases:
          "ரத்து": "cancellation"
          "வந்தது": "came; from வா (vā), to come"
  "ta-7240":
    native: "tourist place"
    notes:
      n1: "Built from சுற்றுலா (cuṟṟulā) (tour) and தலம் (talam) (place); it names a place people visit."
    examples:
      "இது சுற்றுலாத்தலம்.":
        native: "This is a tourist place."
        bases:
          "சுற்றுலாத்தலம்": "tourist place"
      "இங்கே சுற்றுலாத்தலம் இருக்கிறது.":
        native: "There is a tourist spot here."
        bases:
          "சுற்றுலாத்தலம்": "tourist place"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7241":
    native: "souvenir; keepsake"
    notes:
      n1: "Literally memory thing; நினைவு (niṉaivu) (memory) plus பொருள் (poruḷ) (thing)."
    examples:
      "இது நினைவுப்பொருள்.":
        native: "This is a souvenir."
        bases:
          "நினைவுப்பொருள்": "souvenir; keepsake"
      "நினைவுப்பொருள் வாங்கு.":
        native: "Buy a souvenir."
        bases:
          "நினைவுப்பொருள்": "souvenir; keepsake"
  "ta-7242":
    native: "facility; convenience"
    notes:
      n1: "A word for amenities of a hotel, house or town; the adjective is வசதியான (vacatiyāṉa) (comfortable)."
    examples:
      "இங்கே வசதி இருக்கிறது.":
        native: "There are facilities here."
        bases:
          "வசதி": "facility; convenience"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "அறையில் வசதி இல்லை.":
        native: "The room has no facilities."
        bases:
          "அறையில்": "in the room; from அறை (aṟai), room"
          "வசதி": "facility; convenience"
  "ta-7243":
    native: "air-conditioning"
    notes:
      n1: "The written word; in speech people say ஏசி (ēci) (AC)."
    examples:
      "அறையில் குளிர்சாதனம் இருக்கிறது.":
        native: "The room has air-conditioning."
        bases:
          "அறையில்": "in the room; from அறை (aṟai), room"
          "குளிர்சாதனம்": "air-conditioning"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "குளிர்சாதனம் வேண்டுமா?":
        native: "Do you want air-conditioning?"
        bases:
          "குளிர்சாதனம்": "air-conditioning"
          "வேண்டுமா": "is it needed?; from வேண்டும் (vēṇṭum), is needed; wanted"
  "ta-7244":
    native: "AC; air conditioner"
    notes:
      n1: "The spoken word for air-conditioning, said as the English letters."
    examples:
      "ஏசி அறை வேண்டும்.":
        native: "I want an AC room."
        bases:
          "ஏசி": "AC; air conditioner"
      "ஏசி வேலை செய்கிறது.":
        native: "The AC is working."
        bases:
          "ஏசி": "AC; air conditioner"
          "செய்கிறது": "does; from செய் (cey), to do"
  "ta-7245":
    native: "lift; elevator"
    notes:
      n1: "Literally power lifter; மின் (miṉ) (electricity) plus தூக்கி (tūkki) (lifter)."
    examples:
      "மின்தூக்கி எங்கே?":
        native: "Where is the lift?"
        bases:
          "மின்தூக்கி": "lift; elevator"
      "மின்தூக்கி வேலை செய்யவில்லை.":
        native: "The lift is not working."
        bases:
          "மின்தூக்கி": "lift; elevator"
          "செய்யவில்லை": "did not do; is not working; from செய் (cey), to do"
  "ta-7246":
    native: "airport"
    notes:
      n1: "விமானம் (vimāṉam) (aircraft) plus நிலையம் (nilaiyam) (station); before an ending it becomes விமானநிலையத்துக்கு (vimāṉanilaiyattukku) (to the airport)."
    examples:
      "விமானநிலையம் எங்கே?":
        native: "Where is the airport?"
        bases:
          "விமானநிலையம்": "airport"
      "நான் விமானநிலையத்துக்குப் போகிறேன்.":
        native: "I am going to the airport."
        bases:
          "விமானநிலையத்துக்குப்": "to the airport; for the airport; from விமானநிலையம் (vimāṉanilaiyam), airport"
          "போகிறேன்": "am going; from போ (pō), to go"
  "ta-7247":
    native: "railway station"
    notes:
      n1: "ரயில் (rayil) (train) plus நிலையம் (nilaiyam) (station); one word in writing."
    examples:
      "ரயில்நிலையம் எங்கே?":
        native: "Where is the railway station?"
        bases:
          "ரயில்நிலையம்": "railway station"
      "ரயில்நிலையம் பக்கத்தில் இருக்கிறது.":
        native: "The railway station is nearby."
        bases:
          "ரயில்நிலையம்": "railway station"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7248":
    native: "bus station"
    notes:
      n1: "The written word; in speech people say பஸ்ஸ்டாண்டு (passṭāṇṭu) (bus stand)."
    examples:
      "பேருந்துநிலையம் எங்கே?":
        native: "Where is the bus station?"
        bases:
          "பேருந்துநிலையம்": "bus station"
      "பேருந்துநிலையம் அருகில் இருக்கிறது.":
        native: "The bus station is close."
        bases:
          "பேருந்துநிலையம்": "bus station"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7249":
    native: "entrance; gate"
    notes:
      n1: "Built from நுழைவு (nuḻaivu) (entry) and வாயில் (vāyil) (door); the opposite is the exit."
    examples:
      "நுழைவாயில் எங்கே?":
        native: "Where is the entrance?"
        bases:
          "நுழைவாயில்": "entrance; gate"
      "நுழைவாயில் அங்கே இருக்கிறது.":
        native: "The entrance is over there."
        bases:
          "நுழைவாயில்": "entrance; gate"
          "அங்கே": "there"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7250":
    native: "passport"
    notes:
      n1: "The written word; பாஸ்போர்ட் (pāspōrṭ) (the English word) is what people say in speech."
    examples:
      "கடவுச்சீட்டு எங்கே?":
        native: "Where is the passport?"
        bases:
          "கடவுச்சீட்டு": "passport"
      "என் கடவுச்சீட்டு இங்கே இருக்கிறது.":
        native: "My passport is here."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "கடவுச்சீட்டு": "passport"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7251":
    native: "itinerary; travel plan"
    notes:
      n1: "பயணம் (payaṇam) (journey) plus திட்டம் (tiṭṭam) (plan); the two parts are written as one word."
    examples:
      "இது என் பயணத்திட்டம்.":
        native: "This is my itinerary."
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "பயணத்திட்டம்": "itinerary; travel plan"
      "பயணத்திட்டம் தயார்.":
        native: "The travel plan is ready."
        bases:
          "பயணத்திட்டம்": "itinerary; travel plan"
          "தயார்": "ready"
  "ta-7252":
    native: "reception room; lobby"
    notes:
      n1: "வரவேற்பு (varavēṟpu) (welcome) plus அறை (aṟai) (room); the front desk of a hotel."
    examples:
      "வரவேற்பறை எங்கே?":
        native: "Where is the reception?"
        bases:
          "வரவேற்பறை": "reception room; lobby"
      "வரவேற்பறையில் காத்திருக்கிறேன்.":
        native: "I am waiting at reception."
        bases:
          "வரவேற்பறையில்": "at reception; from வரவேற்பறை (varavēṟpaṟai), reception room; lobby"
          "காத்திருக்கிறேன்": "am waiting; from காத்திரு (kāttiru), to wait"
  "ta-7253":
    native: "room key"
    notes:
      n1: "அறை (aṟai) (room) plus சாவி (cāvi) (key); the two parts are written as one word."
    examples:
      "அறைச்சாவி இங்கே.":
        native: "The room key is here."
        bases:
          "அறைச்சாவி": "room key"
      "என் அறைச்சாவி எங்கே?":
        native: "Where is my room key?"
        bases:
          "என்": "my; from நான் (nāṉ), I; me"
          "அறைச்சாவி": "room key"
  "ta-7254":
    native: "bathroom"
    notes:
      n1: "Literally bathing room; the room for washing, which in hotels may include the toilet."
    examples:
      "குளியலறை எங்கே?":
        native: "Where is the bathroom?"
        bases:
          "குளியலறை": "bathroom"
      "குளியலறை சுத்தமாக இருக்கிறது.":
        native: "The bathroom is clean."
        bases:
          "குளியலறை": "bathroom"
          "சுத்தமாக": "clean; from சுத்தம் (cuttam), cleanliness; clean"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7255":
    native: "toilet"
    notes:
      n1: "A polite, written word for the toilet; used on signs and when asking the way."
    examples:
      "கழிப்பறை எங்கே?":
        native: "Where is the toilet?"
        bases:
          "கழிப்பறை": "toilet"
      "கழிப்பறை வெளியே இருக்கிறது.":
        native: "The toilet is outside."
        bases:
          "கழிப்பறை": "toilet"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7256":
    native: "hot water"
    notes:
      n1: "Literally boiled water; the two parts are written as one word."
    examples:
      "வெந்நீர் வேண்டும்.":
        native: "I need hot water."
        bases:
          "வெந்நீர்": "hot water"
      "அறையில் வெந்நீர் இருக்கிறது.":
        native: "The room has hot water."
        bases:
          "அறையில்": "in the room; from அறை (aṟai), room"
          "வெந்நீர்": "hot water"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7257":
    native: "camp"
    notes:
      n1: "A camp for tourists or for an event, and also a relief camp."
    examples:
      "இது முகாம்.":
        native: "This is a camp."
        bases:
          "முகாம்": "camp"
      "முகாம் மலையில் இருக்கிறது.":
        native: "The camp is on the hill."
        bases:
          "முகாம்": "camp"
          "மலையில்": "in the hills; from மலை (malai), hill"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7258":
    native: "tent"
    notes:
      n1: "A tent for camping or for an event."
    examples:
      "கூடாரம் எங்கே?":
        native: "Where is the tent?"
        bases:
          "கூடாரம்": "tent"
      "கூடாரம் பெரியது.":
        native: "The tent is big."
        bases:
          "கூடாரம்": "tent"
          "பெரியது": "big; from பெரிய (periya), big"
  "ta-7259":
    native: "trekking; mountain climb"
    notes:
      n1: "Literally climbing a hill; மலை (malai) (hill) plus ஏற்றம் (ēṟṟam) (climbing)."
    examples:
      "மலையேற்றம் எனக்குப் பிடிக்கும்.":
        native: "I like trekking."
        bases:
          "மலையேற்றம்": "trekking; mountain climb"
          "எனக்குப்": "to me; for me; from நான் (nāṉ), I; me"
      "நாளை மலையேற்றம்.":
        native: "Trekking tomorrow."
        bases:
          "மலையேற்றம்": "trekking; mountain climb"
  "ta-7260":
    native: "boat ride"
    notes:
      n1: "படகு (paṭaku) (boat) plus சவாரி (cavāri) (ride); the two parts are written as one word."
    examples:
      "படகுச்சவாரி நன்றாக இருக்கிறது.":
        native: "The boat ride is nice."
        bases:
          "படகுச்சவாரி": "boat ride"
          "நன்றாக": "well; fine"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "இங்கே படகுச்சவாரி இருக்கிறது.":
        native: "There is a boat ride here."
        bases:
          "படகுச்சவாரி": "boat ride"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7261":
    native: "ride; trip"
    notes:
      n1: "A ride on an animal, a boat or a vehicle, and a fare for a driver."
    examples:
      "இது நல்ல சவாரி.":
        native: "This is a good ride."
        bases:
          "சவாரி": "ride; trip"
      "சவாரிக்குப் போகிறேன்.":
