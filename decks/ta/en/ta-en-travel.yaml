  "ta-6431":
    native: "Where does this train go?"
    notes:
      "n1": "போகிறது (pōkiṟatu) is 'goes' for a thing, not a person."
    bases:
      "இந்த": "this"
      "போகிறது": "to go"
  "ta-6432":
    native: "Which platform?"
    notes:
      "n1": "எந்த (enta) means 'which' and comes before the noun."
    bases:
      "எந்த": "which"
  "ta-6433":
    native: "Where can I get a ticket?"
    notes:
      "n1": "கிடைக்கும் (kiṭaikkum) means 'will be available', from கிடை (kiṭai)."
    bases:
      "கிடைக்கும்": "to be available; to get"
  "ta-6434":
    native: "Please give me one ticket."
    notes:
      "n1": "ஒரு (oru) is 'one' before a noun. கொடுங்கள் (koṭuṅkaḷ) is the polite request form of கொடு (koṭu), 'to give'."
    bases:
      "கொடுங்கள்": "to give"
  "ta-6435":
