name: Everyday verbs
description: 'Twelve everyday verbs: to go, to eat, to drink, to see, to listen, to speak, to write, to give, to sleep, to do, to cook and to buy. Each card is the dictionary form; the examples show the present tense. Not yet checked by a Tamil speaker: please report any mistake.'
