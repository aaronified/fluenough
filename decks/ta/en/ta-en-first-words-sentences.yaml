id: "ta-en-first-words-sentences"
kind: "layer"
core: "ta-first-words-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words in sentences"
description: "Ten short sentences with the first words: yes and no, please, big and good, polite and plain orders, and how to say sorry, thanks and OK. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-3074":
    native: "Yes, good."
    notes:
      n1: "ஆம் (ām), yes, and இல்லை (illai), no, answer a yes-or-no question."
    confusables:
      w1: { why: "இல்லை (illai), no, is the opposite." }
      w2: { why: "சரி (cari), OK, is agreement, not a yes to a question." }
  "ta-3075":
    native: "No, thanks."
    notes:
      n1: "நன்றி (naṉṟi), thanks, said after an offer, turns the offer down politely."
    confusables:
      w1: { why: "ஆம் (ām), yes, is the opposite." }
      w2: { why: "மன்னிக்கவும் (maṉṉikkavum), sorry, is an apology, not thanks." }
  "ta-3076":
    native: "Water, please."
    notes:
      n1: "தயவுசெய்து (tayavuceytu), please, comes first in a request, before the thing asked for."
    confusables:
      w1: { why: "இல்லை (illai), no, is not a request." }
      w2: { why: "பெரிய (periya), big, is not a thing to ask for." }
  "ta-3077":
    native: "A big house."
    notes:
      n1: "பெரிய (periya), big, stays the same before a noun: பெரிய வீடு (periya vīṭu), a big house."
    confusables:
      w1: { why: "நல்லது (nallatu), good, does not describe size." }
      w2: { why: "ஒன்று (oṉṟu), one, is a number." }
  "ta-3078":
    native: "The house is big."
    notes:
      n1: "Alone, a thing is described with -அது (-atu): பெரியது (periyatu), it is big, from பெரிய (periya)."
    confusables:
      w1: { why: "தண்ணீர் (taṇṇīr), water, is not a house." }
      w2: { why: "ஒன்று (oṉṟu), one, is a number." }
  "ta-3079":
    native: "Please come."
    notes:
      n1: "வாருங்கள் (vāruṅkaḷ), please come, is the polite order of வா (vā), come; a friend hears வா (vā)."
    confusables:
      w1: { why: "நான் (nāṉ), I, is a different pronoun." }
      w2: { why: "தண்ணீர் (taṇṇīr), water, is a different word." }
  "ta-3080":
    native: "Yes, come."
    confusables:
      w1: { why: "இல்லை (illai), no, is the opposite." }
      w2: { why: "ஒன்று (oṉṟu), one, is a number." }
  "ta-3081":
    native: "OK, good."
    notes:
      n1: "சரி (cari), OK, agrees with a plan; பரவாயில்லை (paravāyillai) means it is all right."
    confusables:
      w1: { why: "இல்லை (illai), no, is the opposite." }
      w2: { why: "தண்ணீர் (taṇṇīr), water, is not an answer." }
  "ta-3082":
    native: "It is all right, thanks."
    notes:
      n1: "பரவாயில்லை (paravāyillai), it is all right, answers an apology."
    confusables:
      w1: { why: "மன்னிக்கவும் (maṉṉikkavum), sorry, is the apology itself." }
      w2: { why: "ஆம் (ām), yes, is a different answer." }
  "ta-3083":
    native: "Sorry, no."
    notes:
      n1: "மன்னிக்கவும் (maṉṉikkavum), sorry, is said before a refusal: இல்லை (illai), no."
    confusables:
      w1: { why: "நன்றி (naṉṟi), thanks, is not an apology." }
      w2: { why: "ஆம் (ām), yes, is the opposite." }
