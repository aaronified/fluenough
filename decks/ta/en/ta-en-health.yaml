schema: 1
id: "ta-en-health"
kind: "layer"
core: "ta-health"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Health and the clinic"
description: "Health, doctors and clinics, symptoms and treatment, diet and exercise, and the verbs of checking, curing and avoiding. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-7000":
    native: "patient"
    notes:
      n1: "Used for a man or a woman; the word has no separate feminine form."
    examples:
      "அவர் ஒரு நோயாளி.":
        native: "He is a patient."
        bases:
          "நோயாளி": "patient"
      "நோயாளி தூங்குகிறார்.":
        native: "The patient is sleeping."
        bases:
          "நோயாளி": "patient"
          "தூங்குகிறார்": "is sleeping (respectful); from தூங்கு (tūṅku), to sleep"
  "ta-7001":
    native: "symptom; sign"
    notes:
      n1: "The word also means any sign or indication; நோயின் (nōyiṉ) is the 'of' form of நோய் (nōy), so நோயின் (nōyiṉ) அறிகுறி (aṟikuṟi) is a sign of the illness."
    examples:
      "இது நோயின் அறிகுறி.":
        native: "This is a sign of the illness."
        bases:
          "நோயின்": "of the illness; from நோய் (nōy), illness; disease"
          "அறிகுறி": "symptom; sign"
      "என்ன அறிகுறி?":
        native: "What is the symptom?"
        bases:
          "அறிகுறி": "symptom; sign"
  "ta-7002":
    native: "health; wellbeing"
    notes:
      n1: "Used to ask politely after someone's health; உங்கள் (uṅkaḷ) is the respectful 'your'."
    examples:
      "உடல்நலம் முக்கியம்.":
        native: "Health is important."
        bases:
          "உடல்நலம்": "health; wellbeing"
          "முக்கியம்": "important"
      "உங்கள் உடல்நலம் எப்படி?":
        native: "How is your health?"
        bases:
          "உங்கள்": "your (polite)"
          "உடல்நலம்": "health; wellbeing"
  "ta-7003":
    native: "state of health; condition"
    notes:
      n1: "Literally the state of the body; உடல்நிலை (uṭalnilai) சரியில்லை (cariyillai) is the polite way to say you are unwell."
    examples:
      "அவர் உடல்நிலை நல்லது.":
        native: "His health is good."
        bases:
          "உடல்நிலை": "state of health; condition"
      "உடல்நிலை சரியில்லை.":
        native: "I am not well."
        bases:
          "உடல்நிலை": "state of health; condition"
          "சரியில்லை": "not right; from சரி (cari), okay"
  "ta-7004":
    native: "first aid"
    notes:
      n1: "Literally first help; joined to பெட்டி (peṭṭi) it is the first-aid box."
    examples:
      "முதலுதவி முக்கியம்.":
        native: "First aid is important."
        bases:
          "முதலுதவி": "first aid"
          "முக்கியம்": "important"
      "முதலுதவிப் பெட்டி எங்கே?":
        native: "Where is the first-aid box?"
        bases:
          "முதலுதவிப்": "first-aid (before a noun); from முதலுதவி (mutalutavi), first aid"
  "ta-7005":
    native: "prescription"
    notes:
      n1: "A compound of மருந்து (maruntu) (medicine) and சீட்டு (cīṭṭu) (slip); the two parts join with a doubled consonant, as in the written word மருந்துச்சீட்டு (maruntuccīṭṭu)."
    examples:
      "மருந்துச்சீட்டு இங்கே இருக்கிறது.":
        native: "The prescription is here."
        bases:
          "மருந்துச்சீட்டு": "prescription"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "மருந்துச்சீட்டு கொடுங்கள்.":
        native: "Please give the prescription."
        bases:
          "மருந்துச்சீட்டு": "prescription"
          "கொடுங்கள்": "please give; from கொடு (koṭu), to give"
  "ta-7006":
    native: "infection"
    notes:
      n1: "Also used for catching or spreading illnesses; it means contagion as well as infection."
    examples:
      "இது தொற்று.":
        native: "This is an infection."
        bases:
          "தொற்று": "infection"
      "தொற்று பரவுகிறது.":
        native: "The infection is spreading."
        bases:
          "தொற்று": "infection"
          "பரவுகிறது": "spreads; from பரவு (paravu), to spread"
  "ta-7007":
    native: "germ"
    notes:
      n1: "The word covers germs and microbes; தெரியாது (teriyātu) is the negative of 'to be visible'."
    examples:
      "கிருமி கண்ணுக்குத் தெரியாது.":
        native: "Germs cannot be seen by the eye."
        bases:
          "கிருமி": "germ"
          "கண்ணுக்குத்": "to the eye; for the eye; from கண் (kaṇ), eye"
          "தெரியாது": "is not known; from தெரி (teri), to be known; to be seen"
      "கையில் கிருமி இருக்கிறது.":
        native: "There are germs on the hand."
        bases:
          "கையில்": "on the hand; from கை (kai), hand"
          "கிருமி": "germ"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7008":
    native: "virus"
    notes:
      n1: "A loanword from English, said as it is in speech."
    examples:
      "இது வைரஸ் காய்ச்சல்.":
        native: "This is a virus fever."
        bases:
          "வைரஸ்": "virus"
      "வைரஸ் பரவுகிறது.":
        native: "The virus is spreading."
        bases:
          "வைரஸ்": "virus"
          "பரவுகிறது": "spreads; from பரவு (paravu), to spread"
  "ta-7009":
    native: "cancer"
    notes:
      n1: "A compound ending in நோய் (nōy) (illness); the stem before it joins with a doubled consonant."
    examples:
      "புற்றுநோய் ஒரு பெரிய நோய்.":
        native: "Cancer is a serious illness."
        bases:
          "புற்றுநோய்": "cancer"
      "அவருக்குப் புற்றுநோய் இருக்கிறது.":
        native: "He has cancer."
        bases:
          "அவருக்குப்": "to him or her (polite); for him or her (polite); from அவர் (avar), he or she (polite)"
          "புற்றுநோய்": "cancer"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7010":
    native: "diabetes"
    notes:
      n1: "The word for the illness; the everyday word is சர்க்கரை (carkkarai) (sugar), as in 'sugar illness'."
    examples:
      "அவருக்கு நீரிழிவு இருக்கிறது.":
        native: "He has diabetes."
        bases:
          "அவருக்கு": "to him (respectful); from அவர் (avar), he, she (respectful)"
          "நீரிழிவு": "diabetes"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "நீரிழிவுக்கு மருந்து சாப்பிடுகிறார்.":
        native: "He takes medicine for diabetes."
        bases:
          "நீரிழிவுக்கு": "for diabetes; from நீரிழிவு (nīriḻivu), diabetes"
          "சாப்பிடுகிறார்": "is eating; is taking (respectful); from சாப்பிடு (cāppiṭu), to eat"
  "ta-7011":
    native: "fit; seizure"
    notes:
      n1: "Tamil says that the fit 'comes' (வந்தது (vantatu), came), like fever and other sudden illnesses."
    examples:
      "அவருக்கு வலிப்பு வந்தது.":
        native: "He had a fit."
        bases:
          "அவருக்கு": "to him (respectful); from அவர் (avar), he, she (respectful)"
          "வலிப்பு": "fit; seizure"
          "வந்தது": "came; from வா (vā), to come"
      "வலிப்பு ஆபத்தானது.":
        native: "A fit is dangerous."
        bases:
          "வலிப்பு": "fit; seizure"
          "ஆபத்தானது": "is dangerous; from ஆபத்து (āpattu), danger"
  "ta-7012":
    native: "to cure; to heal"
    notes:
      n1: "A causative of குணமாகு (kuṇamāku) (to get well); the thing cured takes the -ஐ (-ai) ending."
    examples:
      "மருந்து நோயைக் குணப்படுத்துகிறது.":
        native: "Medicine cures the illness."
        bases:
          "நோயைக்": "the illness; from நோய் (nōy), illness; disease"
          "குணப்படுத்துகிறது": "cures; from குணப்படுத்து (kuṇappaṭuttu), to cure"
      "மருத்துவர் அவரைக் குணப்படுத்துகிறார்.":
        native: "The doctor cures him."
        bases:
          "அவரைக்": "him or her (polite; object); from அவர் (avar), he or she (polite)"
          "குணப்படுத்துகிறார்": "cures (respectful); from குணப்படுத்து (kuṇappaṭuttu), to cure"
  "ta-7013":
    native: "to spread"
    notes:
      n1: "Used for illness, news and rumours alike; the subject spreads on its own."
    examples:
      "காய்ச்சல் பரவுகிறது.":
        native: "Fever is spreading."
        bases:
          "பரவுகிறது": "spreads; from பரவு (paravu), to spread"
      "செய்தி பரவுகிறது.":
        native: "The news is spreading."
        bases:
          "பரவுகிறது": "spreads; from பரவு (paravu), to spread"
  "ta-7014":
    native: "to prevent; to stop"
    notes:
      n1: "Also the verb 'to block'; தடுப்பூசி (taṭuppūci) (vaccine) is built from it, as 'a prevention injection'."
    examples:
      "தடுப்பூசி நோயைத் தடுக்கிறது.":
        native: "The vaccine prevents illness."
        bases:
          "நோயைத்": "the illness; from நோய் (nōy), illness; disease"
          "தடுக்கிறது": "prevents; from தடு (taṭu), to prevent"
      "ஓய்வு நோயைத் தடுக்கிறது.":
        native: "Rest prevents illness."
        bases:
          "நோயைத்": "the illness; from நோய் (nōy), illness; disease"
          "தடுக்கிறது": "prevents; from தடு (taṭu), to prevent"
  "ta-7015":
    native: "to avoid"
    notes:
      n1: "The command is bare தவிர் (tavir); the polite form adds -ங்கள் (-ṅkaḷ); the verb takes the thing avoided with -ஐ (-ai)."
    examples:
      "இனிப்பைத் தவிர்.":
        native: "Avoid sweets."
        bases:
          "இனிப்பைத்": "the sweet; from இனிப்பு (iṉippu), sweet; sweet dish"
          "தவிர்": "to avoid"
      "நான் உப்பைத் தவிர்க்கிறேன்.":
        native: "I avoid salt."
        bases:
          "உப்பைத்": "the salt; from உப்பு (uppu), salt"
          "தவிர்க்கிறேன்": "avoid; from தவிர் (tavir), to avoid"
  "ta-7016":
    native: "to become thin"
    notes:
      n1: "Used when someone loses weight without wanting to; the neutral word is ஒல்லி (olli) (thin)."
    examples:
      "நான் மெலிகிறேன்.":
        native: "I am getting thin."
        bases:
          "மெலிகிறேன்": "am getting thin; from மெலி (meli), to become thin"
      "அவன் மெலிகிறான்.":
        native: "He is getting thin."
        bases:
          "மெலிகிறான்": "is getting thin (he); from மெலி (meli), to become thin"
  "ta-7017":
    native: "thin; slim"
    notes:
      n1: "The describing form before a noun is ஒல்லியான (olliyāṉa); ஒல்லி (olli) alone is a plain statement."
    examples:
      "அவன் ஒல்லி.":
        native: "He is thin."
        bases:
          "ஒல்லி": "thin; slim"
      "ஒல்லியான பையன்.":
        native: "A thin boy."
        bases:
          "ஒல்லியான": "thin (before a noun); from ஒல்லி (olli), thin; slim"
  "ta-7018":
    native: "fat; plump"
    notes:
      n1: "Said of babies and children it is affectionate; said of adults it can sound rude."
    examples:
      "அவன் குண்டு.":
        native: "He is fat."
        bases:
          "குண்டு": "fat; plump"
      "குண்டான குழந்தை.":
        native: "A chubby child."
        bases:
          "குண்டான": "chubby (before a noun); from குண்டு (kuṇṭu), fat; plump"
  "ta-7019":
    native: "strength"
    notes:
      n1: "Strength of body or of mind; the adjective is பலமான (palamāṉa) (strong)."
    examples:
      "உடலுக்குப் பலம் வேண்டும்.":
        native: "The body needs strength."
        bases:
          "உடலுக்குப்": "to the body; for the body; from உடல் (uṭal), body"
          "பலம்": "strength"
      "அவனுக்குப் பலம் இருக்கிறது.":
        native: "He has strength."
        bases:
          "அவனுக்குப்": "to him; for him; from அவன் (avaṉ), he; him"
          "பலம்": "strength"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7020":
    native: "weakness"
    notes:
      n1: "Said as 'weakness is there' for feeling weak, as with other states of the body."
    examples:
      "எனக்குப் பலவீனம் இருக்கிறது.":
        native: "I feel weak."
        bases:
          "எனக்குப்": "to me; from நான் (nāṉ), I"
          "பலவீனம்": "weakness"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "பலவீனம் போகும்.":
        native: "The weakness will go."
        bases:
          "பலவீனம்": "weakness"
          "போகும்": "will go; from போ (pō), to go"
  "ta-7021":
    native: "sleep"
    notes:
      n1: "Tamil says that sleep 'comes' to you, as in 'sleep is coming', for being sleepy."
    examples:
      "எனக்குத் தூக்கம் வருகிறது.":
        native: "I am sleepy."
        bases:
          "எனக்குத்": "to me; from நான் (nāṉ), I"
          "தூக்கம்": "sleep"
          "வருகிறது": "is coming; from வா (vā), come"
      "தூக்கம் முக்கியம்.":
        native: "Sleep is important."
        bases:
          "தூக்கம்": "sleep"
          "முக்கியம்": "important"
  "ta-7022":
    native: "exercise"
    notes:
      n1: "Literally body practice; you do (செய் (cey)) exercise, you do not 'play' it."
    examples:
      "தினமும் உடற்பயிற்சி செய்.":
        native: "Do exercise every day."
        bases:
          "உடற்பயிற்சி": "exercise"
      "உடற்பயிற்சி நல்லது.":
        native: "Exercise is good."
        bases:
          "உடற்பயிற்சி": "exercise"
  "ta-7023":
    native: "yoga"
    notes:
      n1: "A loanword; you do (செய் (cey)) yoga as you do exercise."
    examples:
      "நான் யோகா செய்கிறேன்.":
        native: "I do yoga."
        bases:
          "யோகா": "yoga"
          "செய்கிறேன்": "do; from செய் (cey), to do"
      "காலையில் யோகா செய்.":
        native: "Do yoga in the morning."
        bases:
          "காலையில்": "in the morning; from காலை (kālai), morning"
          "யோகா": "yoga"
  "ta-7024":
    native: "diet; eating habits"
    notes:
      n1: "Literally the way of food; 'on a diet' is said with this word."
    examples:
      "நல்ல உணவுமுறை வேண்டும்.":
        native: "A good diet is needed."
        bases:
          "உணவுமுறை": "diet; eating habits"
      "என் உணவுமுறை மாறுகிறது.":
        native: "My diet is changing."
        bases:
          "என்": "my; from நான் (nāṉ), I"
          "உணவுமுறை": "diet; eating habits"
          "மாறுகிறது": "changes; from மாறு (māṟu), to change"
  "ta-7025":
    native: "nutrition; nutrient"
    examples:
      "இந்த உணவில் ஊட்டச்சத்து இருக்கிறது.":
        native: "This food has nutrition."
        bases:
          "இந்த": "this"
          "உணவில்": "in the food; from உணவு (uṇavu), food"
          "ஊட்டச்சத்து": "nutrition; nutrient"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "குழந்தைக்கு ஊட்டச்சத்து வேண்டும்.":
        native: "A child needs nutrition."
        bases:
          "குழந்தைக்கு": "to the child; from குழந்தை (kuḻantai), child"
          "ஊட்டச்சத்து": "nutrition; nutrient"
  "ta-7026":
    native: "fat; cholesterol"
    notes:
      n1: "Also the word for cholesterol in everyday talk."
    examples:
      "கொழுப்பு அதிகம்.":
        native: "The fat is high."
        bases:
          "கொழுப்பு": "fat; cholesterol"
      "எண்ணெயில் கொழுப்பு இருக்கிறது.":
        native: "There is fat in oil."
        bases:
          "எண்ணெயில்": "in the oil; from எண்ணெய் (eṇṇey), oil"
          "கொழுப்பு": "fat; cholesterol"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-7027":
    native: "protein"
    notes:
      n1: "The -இல் (-il) ending after a noun means 'in'."
    examples:
      "பருப்பில் புரதம் இருக்கிறது.":
        native: "Dal has protein."
        bases:
