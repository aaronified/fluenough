schema: 1
id: "ta-en-directions"
kind: "layer"
core: "ta-directions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Directions"
description: "Left and right, straight on, the four directions and the street. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-0230":
    native: "right (side)"
    notes:
      n1: "The right side. Before a noun: வலது கை (valatu kai, right hand); with பக்கம் (pakkam, side) it means the right side."
    examples:
      "வலது பக்கம் போ.":
        native: "Go right."
        bases:
          "வலது": "right (side)"
          "பக்கம்": "side"
      "இது வலது கை.":
        native: "This is the right hand."
        bases:
          "வலது": "right (side)"
          "கை": "hand"
  "ta-0231":
    native: "left (side)"
    notes:
      n1: "The left side. Before a noun: இடது கை (iṭatu kai, left hand)."
    examples:
      "இடது பக்கம் போ.":
        native: "Go left."
        bases:
          "இடது": "left (side)"
          "பக்கம்": "side"
      "இது இடது கை.":
        native: "This is the left hand."
        bases:
          "இடது": "left (side)"
          "கை": "hand"
  "ta-0232":
    native: "straight"
    notes:
      n1: "Straight on, in the same direction."
    examples:
      "நேராக போ.":
        native: "Go straight."
        bases:
          "நேராக": "straight"
      "நேராக வா.":
        native: "Come straight."
        bases:
          "நேராக": "straight"
  "ta-0233":
    native: "north"
    notes:
      n1: "The north. With பக்கம் (pakkam, side) it means northward."
    examples:
      "வடக்கு பக்கம் போ.":
        native: "Go north."
        bases:
          "வடக்கு": "north"
          "பக்கம்": "side"
      "இது வடக்கு.":
        native: "This is north."
        bases:
          "வடக்கு": "north"
  "ta-0234":
    native: "south"
    notes:
      n1: "The south. With பக்கம் (pakkam, side) it means southward."
    examples:
      "தெற்கு பக்கம் போ.":
        native: "Go south."
        bases:
          "தெற்கு": "south"
          "பக்கம்": "side"
      "இது தெற்கு.":
        native: "This is south."
        bases:
          "தெற்கு": "south"
  "ta-0235":
    native: "east"
    notes:
      n1: "The east. With பக்கம் (pakkam, side) it means eastward."
    examples:
      "கிழக்கு பக்கம் போ.":
        native: "Go east."
        bases:
          "கிழக்கு": "east"
          "பக்கம்": "side"
      "இது கிழக்கு.":
        native: "This is east."
        bases:
          "கிழக்கு": "east"
  "ta-0236":
    native: "west"
    notes:
      n1: "The west. With பக்கம் (pakkam, side) it means westward."
    examples:
      "மேற்கு பக்கம் போ.":
        native: "Go west."
        bases:
          "மேற்கு": "west"
          "பக்கம்": "side"
      "இது மேற்கு.":
        native: "This is west."
        bases:
          "மேற்கு": "west"
  "ta-0237":
    native: "street"
    notes:
      n1: "A street in a town or village."
    examples:
      "தெரு அருகில் இருக்கிறது.":
        native: "The street is near."
        bases:
          "தெரு": "street"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "இது பெரிய தெரு.":
        native: "This is a big street."
        bases:
          "தெரு": "street"
  "ta-6463":
    native: "How far is it from here?"
    notes:
      "n1": "இங்கிருந்து (iṅkiruntu) is இங்கே (iṅkē) with -இருந்து (iruntu), 'from'. தூரம் (tūram) means 'distance'."
    bases:
      "இங்கிருந்து": "from here"
      "தூரம்": "distance"
  "ta-6464":
    native: "How can I get to the temple?"
    notes:
      "n1": "போகலாம் (pōkalām) means 'may go' or 'can go'. கோயிலுக்கு (kōyilukku) is கோயில் (kōyil) with -உக்கு (ukku), 'to'."
    bases:
      "கோயிலுக்கு": "temple"
      "எப்படிப்": "how"
      "போகலாம்": "to go"
  "ta-6465":
    native: "Please go straight."
    notes:
      "n1": "போங்கள் (pōṅkaḷ) is the polite request form of போ (pō), 'to go'."
    bases:
      "நேராகப்": "straight"
      "போங்கள்": "to go"
  "ta-6466":
    native: "Is this the right way?"
    notes:
      "n1": "சரியா (cariyā) is சரி (cari), 'right', with -ஆ (ā) making the question."
    bases:
      "இந்த": "this"
      "வழி": "way; road"
      "சரியா": "right"
  "ta-6467":
    native: "Is there a bus stop nearby?"
    notes:
      "n1": "அருகில் (arukil) means 'nearby' and comes at the start of the sentence."
    bases:
      "பேருந்து": "bus"
      "நிறுத்தம்": "stop; a place where a bus stops"
      "இருக்கிறதா": "to be; to have"
  "ta-6468":
    native: "I have lost my way."
    notes:
      "n1": "வழி தவறு (vaḻi tavaṟu) means 'to go the wrong way'; தவறிவிட்டேன் (tavaṟiviṭṭēṉ) adds the finished-action helper விடு (viṭu)."
    bases:
      "வழி": "way; road"
      "தவறிவிட்டேன்": "to go wrong"
  "ta-6469":
    native: "Please show me on the map."
    notes:
      "n1": "வரைபடத்தில் (varaipaṭattil) is வரைபடம் (varaipaṭam), 'map', with -இல் (il), 'on'. காட்டுங்கள் (kāṭṭuṅkaḷ) is the polite request form of காட்டு (kāṭṭu), 'to show'."
    bases:
      "வரைபடத்தில்": "map"
      "காட்டுங்கள்": "to show"
