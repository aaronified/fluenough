schema: 1
id: "ta-en-cinema"
kind: "layer"
core: "ta-cinema"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Cinema"
description: "The cinema: films, actors, directors, scenes and songs, and the words for reviewing and enjoying a film. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-8000":
    native: "film; movie"
    notes:
      n1: "The formal and written word; in speech people mostly say படம் (paṭam), film, a word taught earlier."
    examples:
      "இது நல்ல திரைப்படம்.":
        native: "This is a good film."
        bases:
          "திரைப்படம்": "film; movie"
      "திரைப்படம் எங்கே?":
        native: "Where is the film?"
        bases:
          "திரைப்படம்": "film; movie"
  "ta-8001":
    native: "actor"
    notes:
      n1: "The ending -ர் (-r) is the respectful form for a man; the woman is நடிகை (naṭikai), actress."
    examples:
      "அவர் நல்ல நடிகர்.":
        native: "He is a good actor."
        bases:
          "நடிகர்": "actor"
      "இவர் என் நடிகர்.":
        native: "This is my actor."
        bases:
          "என்": "my; from நான் (nāṉ), I"
          "நடிகர்": "actor"
  "ta-8002":
    native: "actress"
    notes:
      n1: "Its pair is நடிகர் (naṭikar), actor; both come from the verb நடி (naṭi), to act, taught earlier."
    examples:
      "அவள் பிரபலமான நடிகை.":
        native: "She is a famous actress."
        bases:
          "நடிகை": "actress"
      "அவள் நல்ல நடிகை.":
        native: "She is a good actress."
        bases:
          "நடிகை": "actress"
  "ta-8003":
    native: "acting; performance"
    notes:
      n1: "The noun from நடி (naṭi), to act: the stem plus -ப்பு (-ppu) makes a noun."
    examples:
      "அவன் நடிப்பு நல்லது.":
        native: "His acting is good."
        bases:
          "நடிப்பு": "acting; performance"
      "உன் நடிப்பு அருமை.":
        native: "Your acting is wonderful."
        bases:
          "உன்": "your; from நீ (nī), you (to a friend or child)"
          "நடிப்பு": "acting; performance"
          "அருமை": "wonderful; excellent"
  "ta-8004":
    native: "director"
    notes:
      n1: "The word for a film's director; it also means a company or institute director."
    examples:
      "அவர் படத்தின் இயக்குநர்.":
        native: "He is the director of the film."
        bases:
          "படத்தின்": "of the film; from படம் (paṭam), film"
          "இயக்குநர்": "director"
      "இயக்குநர் எங்கே?":
        native: "Where is the director?"
        bases:
          "இயக்குநர்": "director"
  "ta-8005":
    native: "producer"
    notes:
      n1: "Someone who pays for and organises a film; from தயாரி (tayāri), to produce."
    examples:
      "அவர் படத்தின் தயாரிப்பாளர்.":
        native: "He is the producer of the film."
        bases:
          "படத்தின்": "of the film; from படம் (paṭam), film"
          "தயாரிப்பாளர்": "producer"
      "தயாரிப்பாளர் இங்கே இருக்கிறார்.":
        native: "The producer is here."
        bases:
          "தயாரிப்பாளர்": "producer"
          "இருக்கிறார்": "is; from இரு (iru), to be"
  "ta-8006":
    native: "hero; male lead"
    notes:
      n1: "The male lead of a film; the woman is கதாநாயகி (katānāyaki), heroine."
    examples:
      "அவன் படத்தின் கதாநாயகன்.":
        native: "He is the hero of the film."
        bases:
          "படத்தின்": "of the film; from படம் (paṭam), film"
          "கதாநாயகன்": "hero; male lead"
      "கதாநாயகன் நல்லவன்.":
        native: "The hero is a good man."
        bases:
          "கதாநாயகன்": "hero; male lead"
          "நல்லவன்": "good man; from நல்ல (nalla), good"
  "ta-8007":
    native: "heroine; female lead"
    notes:
      n1: "The female lead of a film."
    examples:
      "அவள் படத்தின் கதாநாயகி.":
        native: "She is the heroine of the film."
        bases:
          "படத்தின்": "of the film; from படம் (paṭam), film"
          "கதாநாயகி": "heroine; female lead"
      "கதாநாயகி அழகானவள்.":
        native: "The heroine is beautiful."
        bases:
          "கதாநாயகி": "heroine; female lead"
          "அழகானவள்": "a beautiful woman; from அழகான (aḻakāṉa), beautiful"
  "ta-8008":
    native: "villain"
    notes:
      n1: "A loanword from English villain; it is also said of a bad man in real life, as a joke."
    examples:
      "படத்தில் ஒரு வில்லன் இருக்கிறான்.":
        native: "There is a villain in the film."
        bases:
          "படத்தில்": "in the film; from படம் (paṭam), film"
          "வில்லன்": "villain"
          "இருக்கிறான்": "is; from இரு (iru), to be"
      "வில்லன் கெட்டவன்.":
        native: "The villain is a bad man."
        bases:
          "வில்லன்": "villain"
          "கெட்டவன்": "a bad man; from கெட்ட (keṭṭa), bad"
  "ta-8009":
    native: "scene; sight"
    notes:
      n1: "A scene of a film; it also means a sight or a show."
    examples:
      "இது நல்ல காட்சி.":
        native: "This is a good scene."
        bases:
          "காட்சி": "scene; sight"
      "படத்தில் ஒரு சண்டை காட்சி இருக்கிறது.":
        native: "There is a fight scene in the film."
        bases:
          "படத்தில்": "in the film; from படம் (paṭam), film"
          "காட்சி": "scene; sight"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-8010":
    native: "dialogue; spoken lines"
    notes:
      n1: "The lines the actors speak; people often praise a film's வசனம் (vacaṉam)."
    examples:
      "படத்தின் வசனம் நல்லது.":
        native: "The film's dialogue is good."
        bases:
          "படத்தின்": "of the film; from படம் (paṭam), film"
          "வசனம்": "dialogue; spoken lines"
      "வசனம் அருமை.":
        native: "The dialogue is wonderful."
        bases:
          "வசனம்": "dialogue; spoken lines"
          "அருமை": "wonderful; excellent"
  "ta-8011":
    native: "song; film song"
    notes:
      n1: "The written word for a song; in speech பாட்டு (pāṭṭu), song is common, a word taught earlier."
    examples:
      "படத்தின் பாடல் நல்லது.":
        native: "The film's song is good."
        bases:
          "படத்தின்": "of the film; from படம் (paṭam), film"
          "பாடல்": "song; film song"
      "எனக்கு இந்தப் பாடல் பிடிக்கும்.":
        native: "I like this song."
        bases:
          "எனக்கு": "to me; from நான் (nāṉ), I"
          "இந்தப்": "this (before a word starting with p); from இந்த (inta), this"
          "பாடல்": "song; film song"
  "ta-8012":
    native: "fight; quarrel"
    notes:
      n1: "Used for a film fight and for a quarrel between people."
    examples:
      "படத்தில் சண்டை இருக்கிறது.":
        native: "There is a fight in the film."
        bases:
          "படத்தில்": "in the film; from படம் (paṭam), film"
          "சண்டை": "fight; quarrel"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "அவர்கள் சண்டை போடுகிறார்கள்.":
        native: "They are quarrelling."
        bases:
          "சண்டை": "fight; quarrel"
          "போடுகிறார்கள்": "they put; from போடு (pōṭu), to put; to throw"
  "ta-8013":
    native: "comedy; humour"
    notes:
      n1: "A comedy scene or a funny film; from நகை (nakai), laughter."
    examples:
      "இது நகைச்சுவை படம்.":
        native: "This is a comedy film."
        bases:
          "நகைச்சுவை": "comedy; humour"
      "எனக்கு நகைச்சுவை பிடிக்கும்.":
        native: "I like comedy."
        bases:
          "எனக்கு": "to me; from நான் (nāṉ), I"
          "நகைச்சுவை": "comedy; humour"
  "ta-8014":
    native: "love; romance"
    notes:
      n1: "Romantic love, the most common theme of a film; not the love of a mother."
    examples:
      "இது காதல் படம்.":
        native: "This is a love film."
        bases:
          "காதல்": "love; romance"
      "படத்தில் காதல் இருக்கிறது.":
        native: "There is love in the film."
        bases:
          "படத்தில்": "in the film; from படம் (paṭam), film"
          "காதல்": "love; romance"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-8015":
    native: "horror; fright"
    notes:
      n1: "A horror film is a திகில் படம் (tikil paṭam); the word means fright."
    examples:
      "இது திகில் படம்.":
        native: "This is a horror film."
        bases:
          "திகில்": "horror; fright"
      "எனக்குத் திகில் பிடிக்காது.":
        native: "I do not like horror."
        bases:
          "எனக்குத்": "to me; from நான் (nāṉ), I"
          "திகில்": "horror; fright"
  "ta-8016":
    native: "cinema hall; theatre"
    notes:
      n1: "Built from திரை (tirai), screen and அரங்கு (araṅku), hall; people also say தியேட்டர் (tiyēṭṭar), theatre in speech."
    examples:
      "திரையரங்கு எங்கே இருக்கிறது?":
        native: "Where is the cinema hall?"
        bases:
          "திரையரங்கு": "cinema hall; theatre"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "திரையரங்கில் கூட்டம் இருக்கிறது.":
        native: "There is a crowd in the cinema hall."
        bases:
          "திரையரங்கில்": "in the cinema hall; from திரையரங்கு (tiraiyaraṅku), cinema hall"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-8017":
    native: "review; criticism"
    notes:
      n1: "A film review in a paper or online; it also means criticism."
    examples:
      "இது படத்தின் விமர்சனம்.":
        native: "This is the film's review."
        bases:
          "படத்தின்": "of the film; from படம் (paṭam), film"
          "விமர்சனம்": "review; criticism"
      "நான் விமர்சனம் படிக்கிறேன்.":
        native: "I read the review."
        bases:
          "விமர்சனம்": "review; criticism"
          "படிக்கிறேன்": "am studying; from படி (paṭi), to study"
  "ta-8018":
    native: "fan; admirer"
    notes:
      n1: "A fan of an actor or a film; from ரசி (raci), to enjoy."
    examples:
      "அவர் என் ரசிகர்.":
        native: "He is my fan."
        bases:
          "என்": "my; from நான் (nāṉ), I"
          "ரசிகர்": "fan; admirer"
      "நான் அவர் ரசிகர்.":
        native: "I am his fan."
        bases:
          "ரசிகர்": "fan; admirer"
  "ta-8019":
    native: "award; prize"
    notes:
      n1: "The prize given for a film or an actor."
    examples:
      "அவளுக்கு விருது கிடைக்கும்.":
        native: "She will get an award."
        bases:
          "அவளுக்கு": "to her; for her; from அவள் (avaḷ), she"
          "விருது": "award; prize"
          "கிடைக்கும்": "will be available; from கிடை (kiṭai), to be available; to be obtained"
      "இது பெரிய விருது.":
        native: "This is a big award."
        bases:
          "விருது": "award; prize"
  "ta-8020":
    native: "release"
    notes:
      n1: "The release of a film; from வெளியிடு (veḷiyiṭu), to release."
    examples:
      "படத்தின் வெளியீடு இன்று.":
        native: "The film's release is today."
        bases:
          "படத்தின்": "of the film; from படம் (paṭam), film"
          "வெளியீடு": "release"
      "வெளியீடு எப்போது?":
        native: "When is the release?"
        bases:
          "வெளியீடு": "release"
  "ta-8021":
    native: "title; heading"
    notes:
      n1: "The title of a film, a book or a news item."
    examples:
      "படத்தின் தலைப்பு என்ன?":
        native: "What is the film's title?"
        bases:
          "படத்தின்": "of the film; from படம் (paṭam), film"
          "தலைப்பு": "title; heading"
      "இது நல்ல தலைப்பு.":
        native: "This is a good title."
        bases:
          "தலைப்பு": "title; heading"
  "ta-8022":
    native: "film shooting"
    notes:
      n1: "Built from படம் (paṭam), film and பிடிப்பு (piṭippu), catching; it is the shoot of a film."
    examples:
      "படப்பிடிப்பு இங்கே நடக்கிறது.":
        native: "The shooting is happening here."
        bases:
          "படப்பிடிப்பு": "film shooting"
          "நடக்கிறது": "happens; from நட (naṭa), to walk; to happen"
      "படப்பிடிப்பு எப்போது?":
        native: "When is the shooting?"
        bases:
          "படப்பிடிப்பு": "film shooting"
  "ta-8023":
    native: "end; decision; result"
    notes:
      n1: "The end of a film, and also a decision or a result."
    examples:
      "படத்தின் முடிவு நல்லது.":
        native: "The film's end is good."
        bases:
          "படத்தின்": "of the film; from படம் (paṭam), film"
          "முடிவு": "end; decision; result"
      "இது என் முடிவு.":
        native: "This is my decision."
        bases:
          "என்": "my; from நான் (nāṉ), I"
          "முடிவு": "end; decision; result"
  "ta-8024":
    native: "beginning; start"
    notes:
      n1: "The opposite of முடிவு (muṭivu), end."
    examples:
      "படத்தின் தொடக்கம் நல்லது.":
        native: "The film's beginning is good."
        bases:
          "படத்தின்": "of the film; from படம் (paṭam), film"
          "தொடக்கம்": "beginning; start"
      "தொடக்கம் எப்போது?":
        native: "When is the start?"
        bases:
          "தொடக்கம்": "beginning; start"
  "ta-8025":
    native: "music director; composer"
    notes:
      n1: "Built from இசை (icai), music, அமை (amai), to arrange and -பாளர் (-pāḷar), the doer."
    examples:
      "அவர் இசையமைப்பாளர்.":
        native: "He is a music director."
        bases:
          "இசையமைப்பாளர்": "music director; composer"
      "இசையமைப்பாளர் எங்கே?":
        native: "Where is the music director?"
        bases:
          "இசையமைப்பாளர்": "music director; composer"
  "ta-8026":
    native: "background; backdrop"
    notes:
      n1: "பின்னணி இசை (piṉṉaṇi icai) is background music in a film; it also means a person's background."
    examples:
      "பின்னணி இசை நல்லது.":
        native: "The background music is good."
        bases:
          "பின்னணி": "background; backdrop"
      "படத்தின் பின்னணி என்ன?":
        native: "What is the film's background?"
        bases:
          "படத்தின்": "of the film; from படம் (paṭam), film"
          "பின்னணி": "background; backdrop"
  "ta-8027":
    native: "trailer; preview"
    notes:
      n1: "The short preview of a film."
    examples:
      "முன்னோட்டம் பார்.":
        native: "Watch the trailer."
        bases:
          "முன்னோட்டம்": "trailer; preview"
      "முன்னோட்டம் நல்லது.":
        native: "The trailer is good."
        bases:
          "முன்னோட்டம்": "trailer; preview"
  "ta-8028":
    native: "short film"
    notes:
      n1: "Built from குறு (kuṟu), short and படம் (paṭam), film."
    examples:
      "இது குறும்படம்.":
        native: "This is a short film."
        bases:
          "குறும்படம்": "short film"
      "நான் குறும்படம் பார்க்கிறேன்.":
        native: "I am watching a short film."
        bases:
          "குறும்படம்": "short film"
          "பார்க்கிறேன்": "am watching; from பார் (pār), to see; to look"
  "ta-8029":
    native: "documentary"
    notes:
      n1: "A film of real events; from ஆவணம் (āvaṇam), document and படம் (paṭam), film."
    examples:
      "இது ஆவணப்படம்.":
        native: "This is a documentary."
        bases:
          "ஆவணப்படம்": "documentary"
      "நான் ஆவணப்படம் பார்க்கிறேன்.":
        native: "I am watching a documentary."
        bases:
          "ஆவணப்படம்": "documentary"
