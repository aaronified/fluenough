name: "This, that, which"
description: "This and that, here and there, now and then, and the question word that goes with each. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
pattern:
  name: "Near, far and question words"
  slot_name: "distance"
  entries:
    "anta": "this, that, which, before a noun"
    "atu": "this, that, which one (a thing)"
    "inkae": "here, there, where"
    "appati": "like this, like that, how"
    "avvalavu": "this much, that much, how much"
    "appotu": "now, then, when"
  notes: "Tamil points with three first sounds: இ- (i-) for what is near, அ- (a-) for what is far, and எ- (e-) to ask. The same three sounds build a whole set of words. Before a noun they are இந்த (inta), அந்த (anta) and எந்த (enta): இந்த வீடு (inta vīṭu), this house. On their own, for a thing, they are இது (itu), அது (atu) and எது (etu). The words for place, way, amount and time follow the same pattern, and the question word is the எ- (e-) one: எங்கே (eṅkē), where; எப்படி (eppaṭi), how; எப்போது (eppōtu), when. Where a stop follows the first sound it doubles, as in இப்போது (ippōtu) and அப்படி (appaṭi). Source: English Wikipedia, Tamil grammar, Demonstratives and interrogatives (i- near, a- far, e- interrogative); the other forms are common words listed in English Wiktionary."
