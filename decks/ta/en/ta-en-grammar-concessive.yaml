rules:
  "ta-rule-concessive":
    name: "Even if: -ஆலும் (-ālum)"
    explanation: "Add -உம் (-um), also, to the conditional form to say even if: {1}, to come, gives {2}, even if he comes. The conditional itself was taught earlier, with -ஆல் (-āl) in writing and -ஆ (-ā) in speech; {3}, to study, gives {4} in speech and {5} in writing."
  "ta-rule-concessive-though":
    name: "Even though: the participle with -உம் (-um)"
    explanation: "Add -உம் (-um) to the verbal participle to say even though it has happened: {1}, to study, gives {2} in speech and {3} in writing, even though he studied. After a participle that ends in -இ (-i) or -ய் (-y) the sound -ய (-ya) joins them: {4}, to go, gives {5}."
