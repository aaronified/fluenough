rules:
  "ta-rule-can-may":
    name: "May and can: -லாம் (-lām)"
    explanation: "Add -லாம் (-lām) to the infinitive to say that something may be done or is allowed: {1}, to come, gives {2}, so {3} is may I come, and with -ஆ (-ā) added it asks permission: {4}. The same form also means let us, as in the imperatives unit."
  "ta-rule-can-must":
    name: "Must: -ணும் (-ṇum) and வேண்டும் (vēṇṭum)"
    explanation: "To say must, put வேண்டும் (vēṇṭum), taught earlier, after the infinitive: {1}, to come, gives {2}, I must come. Speech shortens the two words to one with -ணும் (-ṇum): {3}. Both forms are the same for every person, and the person who must is in the dative: {4}, I must go. Source: English Wiktionary (the entry for vēṇṭum: it is needed; must)."
  "ta-rule-can-not":
    name: "Must not and need not"
    explanation: "Add -க்கூடாது (-kkūṭātu) to the infinitive for must not: {1}, to come, gives {2}. For need not, put வேண்டாம் (vēṇṭām), taught earlier, after the infinitive: {3}. The two are not the same: {2} forbids, while {3} only says it is not needed."
