# Layer for ta-culture-2: each passage's English rendering and a note on it.
schema: 1
id: "ta-en-culture-2"
kind: "layer"
core: "ta-culture-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: devotional verse and the epic"
description: "Eighteen short passages of devotional verse and epic poetry, from Andal, Manikkavacakar, Tirumular, Arunagirinathar and the Kamba Ramayanam, each with its English rendering and a note. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-6050":
    native: "On this good day of the month of Margazhi, when the moon is full, come to bathe, you who wear fine jewels."
    notes:
      "n1": "The opening of the Tiruppavai, thirty verses sung in the month of Margazhi (mid-December to mid-January). The page's own bracketed gloss says the first and second verbs both mean 'come', one as a statement and one as a command. The word for 'those with fine jewels' is how the girls are addressed."
    bases:
      "மார்கழித்": { meaning: "Margazhi, the month from mid-December to mid-January" }
      "திங்கள்": { meaning: "month; also the moon" }
      "மதிநிறைந்த": { meaning: "moon; here 'in which the moon is full'" }
      "நன்னாளால்": { meaning: "a good day; here 'on the good day'" }
      "நீராடப்": { meaning: "to bathe; here 'to bathe'" }
      "போதுவீர்": { meaning: "to come, an old word for 'come'; here 'you who will come'" }
      "போதுமினோ": { meaning: "to come; here the command 'do come'" }
      "நேரிழையீர்": { meaning: "a woman with fine jewels; here 'you with fine jewels'" }
  "ta-6051":
    native: "We shall eat no ghee and drink no milk; we bathe at daybreak."
    notes:
      "n1": "A line from the second verse, where the girls list what they will give up while keeping their vow. The first two words are single words that join the food to 'we shall not eat', so the negative sits inside the verb."
    bases:
      "நெய்யுண்ணோம்": { meaning: "ghee, clarified butter; joined to 'we shall not eat'" }
      "பாலுண்ணோம்": { meaning: "milk; joined to 'we shall not drink'" }
      "நாட்காலே": { meaning: "early morning, daybreak" }
      "நீராடி": { meaning: "to bathe; here 'having bathed'" }
  "ta-6052":
    native: "Singing the name of the Supreme One who grew tall and measured the world."
    notes:
      "n1": "The first line of the third verse, which names Vishnu by the story of his growing to measure the world. The last word joins 'name' and 'having sung'."
    bases:
      "ஓங்கி": { meaning: "to rise, to grow tall; here 'having grown tall'" }
      "உலகளந்த": { meaning: "world; joined to 'that measured'" }
      "உத்தமன்": { meaning: "the best one, the supreme one" }
      "பேர்பாடி": { meaning: "name; joined to 'having sung'" }
  "ta-6053":
    native: "Having cleaned the ground through the whole month of Thai and drawn a cool circle, on the day before Masi."
    notes:
      "n1": "The first line of the Nachiyar Tirumozhi, the verse numbering of the Nalayira Divya Prabandham giving it number 504. Thai and Masi are the months from mid-January to mid-March. The word for 'cool circle' is split across two printed words by the verse metre."
    bases:
      "தையொரு": { meaning: "the month of Thai, from mid-January; joined to 'one'" }
      "திங்களும்": { meaning: "month; here 'the whole month'" }
      "தரைவிளக்கித்": { meaning: "ground, floor; joined to 'having cleaned'" }
      "தண்மண்": { meaning: "a cool circle, a drawn pattern; the first half of the word" }
      "டலமிட்டு": { meaning: "to put, to draw; the second half of the word, 'having drawn'" }
      "மாசிமுன்னாள்": { meaning: "the month of Masi, from mid-February; joined to 'the day before'" }
  "ta-6054":
    native: "With a thousand elephants circling around him."
    notes:
      "n1": "The first line of the dream-wedding decad (verse 556), where the girl sings that she dreamed of her wedding. The printed spacing splits the words by the metre, so 'thousand' loses its first letter to the word before and 'circling' is split in two."
    bases:
      "வாரண": { meaning: "elephant" }
      "மாயிரம்": { meaning: "thousand; the first letter is joined on from the word before" }
      "சூழவ": { meaning: "to surround; here 'around'" }
      "லம்செய்து": { meaning: "going around, circling; joined to 'having done'" }
  "ta-6055":
    native: "Does it smell of camphor, does it smell of the lotus flower?"
    notes:
      "n1": "The first line of a decad in which the girl asks the conch of Krishna what his mouth smells of (verse 567). The same verb for 'smells' is said twice, each time as a question."
    bases:
      "கருப்பூரம்": { meaning: "camphor" }
      "நாறுமோ": { meaning: "to smell, to give off a smell; here 'does it smell'" }
      "கமலப்பூ": { meaning: "lotus; joined to 'flower'" }
  "ta-6056":
    native: "Praise to you, the being who is the root of my life; the dawn has broken."
    notes:
      "n1": "The opening of the dawn hymn that wakes the god, by Manikkavacakar. The word for 'praise' is the opening call of a hymn. The last word is a past form, 'it has dawned'."
    bases:
      "போற்றி": { meaning: "praise! hail!" }
      "என்வாழ்": { meaning: "my; joined to 'life'" }
      "முதல்": { meaning: "root, origin, first" }
      "ஆகிய": { meaning: "to be; here 'that is'" }
      "பொருளே": { meaning: "being, substance; here the call 'O being'" }
      "புலர்ந்தது": { meaning: "to dawn; here 'it has dawned'" }
  "ta-6057":
    native: "The cuckoos of the flowering garden have called, the cocks have called, the birds cry out, and the conch shells sound."
    notes:
      "n1": "A dawn line from the third verse of the same hymn. Each verb ends in the past ending for things that are not people (the same ending in all four), and two of them are repeated. The words for 'cuckoo' and 'flower' are joined as one."
    bases:
      "கூவின": { meaning: "to call, to coo; here 'they called'" }
      "பூங்குயில்": { meaning: "cuckoo; joined to 'flower'" }
      "கோழி": { meaning: "cock, hen" }
      "குருகுகள்": { meaning: "bird, heron; here 'the birds'" }
      "இயம்பின": { meaning: "to sound, to say; here 'they sounded'" }
      "சங்கம்": { meaning: "conch shell" }
  "ta-6058":
    native: "Mark it: the clay is one, and the vessels are of two kinds."
    notes:
      "n1": "The first line of verse 143, which goes on to say that people die as vessels return to the clay. The verb in the second word is the polite plural of 'you have seen', used to call attention to what follows. The word for 'clay' is joined to 'one'."
    bases:
      "மண்ணொன்று": { meaning: "clay, soil; joined to 'one'" }
      "கண்டீர்": { meaning: "to see; here 'you have seen, note it'" }
      "இருவகைப்": { meaning: "two kinds" }
      "பாத்திரம்": { meaning: "vessel, pot" }
  "ta-6059":
    native: "When the roof that held the goods has worn out and fallen, the wives and children who ate from it will not follow."
    notes:
      "n1": "The first two lines of verse 144, a picture of a house falling, used for the body that is given up at death. The translation of the second line as 'the wives and children who ate from it' is the builder's."
    bases:
      "பண்டம்பெய்": { meaning: "goods, things; joined to 'put in'" }
      "கூரை": { meaning: "roof, thatch" }
      "பழகி": { meaning: "to grow worn with use; here 'having grown old'" }
      "விழுந்தக்கால்": { meaning: "to fall; here 'when it has fallen'" }
      "உண்ட": { meaning: "to eat; here 'that ate'" }
      "அப்": { meaning: "that; the pointing word before 'wives'" }
      "பெண்டிரும்": { meaning: "wives, women; with 'and'" }
      "மக்களும்": { meaning: "children, people; with 'and'" }
      "பின்செலார்": { meaning: "to follow; here 'will not follow'" }
  "ta-6060":
    native: "Before favour, kingship, elephants and chariots and wealth all pass into other hands."
    notes:
      "n1": "The first two lines of a verse in the section on the impermanence of wealth. Every noun ends in the same 'and' ending, so the lines read as a list. The builder's translation of the first word as 'favour' is uncertain."
    bases:
      "அருளும்": { meaning: "grace, favour; with 'and'" }
      "அரசனும்": { meaning: "king; with 'and'" }
      "ஆனையம்": { meaning: "elephant; joined to the particle 'and'" }
      "தேரும்": { meaning: "chariot; with 'and'" }
      "பொருளும்": { meaning: "wealth, thing; with 'and'" }
      "பிறர்கொள்ளப்": { meaning: "others; joined to 'so that they take'" }
      "போவதன்": { meaning: "to go; here 'of going'" }
      "முன்னம்": { meaning: "before, earlier" }
  "ta-6061":
    native: "You who dwell in the minds of the devotees who learn of you; like the wishing tree, their deeds will quickly go."
    notes:
      "n1": "Two lines of the first Tiruppugazh song, which praises the elephant-faced god Ganesha before the songs to Murugan. The words for 'deed' and 'quickly goes' are each joined to the word before. The translation of the second line is the builder's and is uncertain."
    bases:
      "கற்றிடும்": { meaning: "to learn; here 'who learn'" }
      "அடியவர்": { meaning: "devotee, one at the feet" }
      "புத்தியில்": { meaning: "mind, understanding; here 'in the mind'" }
      "உறைபவ": { meaning: "to dwell; here 'O one who dwells'" }
      "கற்பகம்": { meaning: "the wishing tree of the gods" }
      "எனவினை": { meaning: "deed, past action; joined to 'as'" }
      "கடிதேகும்": { meaning: "quickly; joined to 'will go'" }
  "ta-6062":
    native: "The son of Hara, who wears the thorn-apple flower and the moon."
    notes:
      "n1": "A line of the first Tiruppugazh song, naming Ganesha by his father, Hara, another name of Shiva. The first two words are each a flower or the moon joined to the 'and' ending."
    bases:
      "மத்தமு": { meaning: "thorn-apple, the datura flower; joined to 'and'" }
      "மதியமும்": { meaning: "moon; with 'and'" }
      "வைத்திடும்": { meaning: "to place, to wear; here 'who wears'" }
      "அரன்மகன்": { meaning: "Hara, a name of Shiva; joined to 'son'" }
  "ta-6063":
    native: "She whose body has no light, like a lamp set out in the sun."
    notes:
      "n1": "A line from the section the page headed with Sita's state of grief, where Sita is held in the grove. The lamp in the sun gives light no one sees, a picture for her dullness."
    bases:
      "வெயிலிடைத்": { meaning: "sunlight, heat; joined to 'in the midst of'" }
      "தந்த": { meaning: "to give, to set; here 'that was set'" }
      "விளக்கு": { meaning: "lamp" }
      "என": { meaning: "like, as" }
      "ஒளி": { meaning: "light, brightness" }
      "இலா": { meaning: "not to be; here 'that has none'" }
      "மெய்யாள்": { meaning: "body; here 'she whose body'" }
  "ta-6064":
    native: "She knew of nothing else to do except weep."
    notes:
      "n1": "The last line of the fifth verse of the same section, after a list of what Sita does in her grief. The first word is a verbal noun, 'weeping'."
    bases:
      "அழுதல்": { meaning: "to weep; here 'weeping'" }
      "அன்றி": { meaning: "except, other than" }
      "மற்று": { meaning: "else, other (a particle)" }
      "அயல்": { meaning: "other, beside" }
      "ஒன்றும்": { meaning: "one, anything; with 'also'" }
      "செய்குவது": { meaning: "to do; here 'what to do'" }
      "அறியாள்": { meaning: "to know; here 'she did not know'" }
  "ta-6065":
    native: "Thinking of him, she whose eyes search all the directions."
    notes:
      "n1": "The last line of the ninth verse, about Sita waiting for Rama. The word for 'direction' is a Sanskrit loan, and the verb 'measure' is used for her eyes sweeping over the horizon."
    bases:
      "கருதி": { meaning: "to think; here 'having thought'" }
      "மாதிரம்": { meaning: "direction, quarter of the sky" }
      "அனைத்தையும்": { meaning: "all, the whole; with the object ending and 'also'" }
      "அளக்கின்ற": { meaning: "to measure, to survey; here 'that measures'" }
      "கண்ணாள்": { meaning: "eye; here 'she whose eyes'" }
  "ta-6066":
    native: "Aruna has come near the quarter of Indra; the darkness has gone and left."
    notes:
      "n1": "The first line of the second verse of the dawn hymn, which keeps waking the god with the signs of morning. The first verb ends in the old masculine past ending; the last word is the plain past 'it went away'. The English wording is the builder's and is uncertain."
    bases:
      "அருணன்": { meaning: "Aruna, the dawn personified" }
      "இந்திரன்": { meaning: "Indra, a god" }
      "திசை": { meaning: "direction, quarter" }
      "அணுகினன்": { meaning: "to approach; here 'he has come near'" }
      "இருள்போய்": { meaning: "darkness; joined to 'having gone'" }
      "அகன்றது": { meaning: "to move away; here 'it has gone away'" }
  "ta-6067":
    native: "At night, by day and at dusk, the cuckoo that stays comes and sings its tune, saying 'thenthana'."
    notes:
      "n1": "Two lines of the third Tiruppugazh song, a song of longing. The word 'thenthana' is a sound word for the cuckoo's song, not a dictionary word. The first three words each carry the 'and' ending or are joined, and the English wording is the builder's and is uncertain."
    bases:
      "இரவும்": { meaning: "night; with 'and'" }
      "பகல்": { meaning: "daytime" }
      "அந்தியு": { meaning: "dusk, twilight; with 'and'" }
      "நின்றிடு": { meaning: "to stand, to stay; here 'that stays'" }
      "குயில்வந்திசை": { meaning: "cuckoo; joined to 'come' and 'music'" }
      "என்றிட": { meaning: "to say; here 'to say'" }
