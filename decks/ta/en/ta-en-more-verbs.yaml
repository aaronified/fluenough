schema: 1
id: "ta-en-more-verbs"
kind: "layer"
core: "ta-more-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs"
description: "Take, put, open, close, sit, stand, wash and play. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-0184":
    native: "to take; to pick up"
    notes:
      n1: "The word for taking or picking something up. In this unit it is used as a command."
    examples:
      "புத்தகத்தை எடு.":
        native: "Take the book."
        bases:
          "புத்தகத்தை": "the book; from புத்தகம் (puttakam), book"
          "எடு": "to take; to pick up"
      "இதை எடு.":
        native: "Take this."
        bases:
          "இதை": "this; from இது (itu), this"
          "எடு": "to take; to pick up"
  "ta-0185":
    native: "to put; to place"
    notes:
      n1: "To put something down somewhere: இங்கே வை (iṅkē vai, put here)."
    examples:
      "இதை இங்கே வை.":
        native: "Put this here."
        bases:
          "இதை": "this; from இது (itu), this"
          "வை": "to put; to place"
      "தண்ணீர் மேலே வை.":
        native: "Put the water on top."
        bases:
          "வை": "to put; to place"
  "ta-0186":
    native: "to open"
    notes:
      n1: "To open a door, a mouth or a box."
    examples:
      "கதவை திற.":
        native: "Open the door."
        bases:
          "கதவை": "the door; from கதவு (katavu), door"
          "திற": "to open"
      "வாயை திற.":
        native: "Open your mouth."
        bases:
          "வாயை": "the mouth; from வாய் (vāy), mouth"
          "திற": "to open"
  "ta-0187":
    native: "to close; to shut"
    notes:
      n1: "To close a door, eyes or a box. The opposite is திற (tiṟa, to open)."
    examples:
      "கதவை மூடு.":
        native: "Close the door."
        bases:
          "கதவை": "the door; from கதவு (katavu), door"
          "மூடு": "to close; to shut"
      "கண்ணை மூடு.":
        native: "Close your eyes."
        bases:
          "கண்ணை": "the eye; from கண் (kaṇ), eye"
          "மூடு": "to close; to shut"
  "ta-0188":
    native: "to sit"
    notes:
      n1: "To sit down."
    examples:
      "இங்கே உட்கார்.":
        native: "Sit here."
        bases:
          "உட்கார்": "to sit"
      "நீ உள்ளே உட்கார்.":
        native: "You, sit inside."
        bases:
          "உட்கார்": "to sit"
  "ta-0189":
    native: "to stand; to stop"
    notes:
      n1: "To stand, or to stop where you are. The opposite of sitting."
    examples:
      "அங்கே நில்.":
        native: "Stand there."
        bases:
          "அங்கே": "there"
          "நில்": "to stand; to stop"
      "பக்கத்தில் நில்.":
        native: "Stand beside it."
        bases:
          "நில்": "to stand; to stop"
  "ta-0190":
    native: "to wash"
    notes:
      n1: "To wash the hands, the body or a vessel."
    examples:
      "கை கழுவு.":
        native: "Wash your hands."
        bases:
          "கை": "hand"
          "கழுவு": "to wash"
      "பாத்திரத்தை கழுவு.":
        native: "Wash the vessel."
        bases:
          "பாத்திரத்தை": "the vessel; from பாத்திரம் (pāttiram), vessel"
          "கழுவு": "to wash"
  "ta-0191":
    native: "to play"
    notes:
      n1: "To play a game, or to play as a child does."
    examples:
      "குழந்தை விளையாடுகிறது.":
        native: "The child is playing."
        bases:
          "விளையாடுகிறது": "is playing; from விளையாடு (viḷaiyāṭu), to play"
      "நீ விளையாடு.":
        native: "You, play."
        bases:
          "விளையாடு": "to play"
