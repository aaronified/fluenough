pattern:
  name: "Someone, anywhere, nobody: the indefinites"
  slot_name: "form"
  prompt: "{lemma} ({gloss}), {slot}"
  slots:
    "o": "some, one does not know which (-o)"
    "avatu": "any, some or other (-avatu)"
    "um": "every; none with a negative (-um)"
  entries:
    "yaar": "who"
    "enna": "what"
    "enge": "where"
    "eppotu": "when"
    "eppati": "how"
  notes: "A question word becomes an indefinite when a small word is joined to it. With -ஓ (-ō) it means some, a speaker does not know which: யாரோ (yārō), someone, எங்கோ (eṅkō), somewhere. With -ஆவது (-āvatu) it means any or some, whichever one: யாராவது (yārāvatu), anyone, எங்காவது (eṅkāvatu), anywhere; it is the form for requests, as in யாராவது உதவுங்கள் (yārāvatu utavuṅkaḷ), someone please help. With -உம் (-um) it means every, and with a negative verb none: யாரும் வரவில்லை (yārum varavillai), nobody came. என்ன (eṉṉa) changes its stem before these endings: ஏதோ (ētō) and ஏதாவது (ētāvatu), but எதுவும் (etuvum). எப்போதும் (eppōtum) means always, not at any time. Not yet confirmed by a Tamil speaker; reviewers check the forms."
