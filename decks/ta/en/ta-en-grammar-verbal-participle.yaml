rules:
  "ta-rule-verbal-participle-and":
    name: "The verbal participle: having done, and then"
    explanation: "The verbal participle means having done, and it links one action to the next. It is the same for every person and tense. {1}, to come, gives {2}, and {3}, to go, gives {4}, with -ய் (-y). {5}, to study, gives {6}, and speech says {7}. Only the last verb of a chain shows the tense and the person: {8} is I got up and bathed. Source: English Wikipedia, Tamil grammar (the adverbial participle is made from the past stem and has no person marking)."
  "ta-rule-verbal-participle-without":
    name: "-ஆமல் (-āmal): without doing"
    explanation: "To say without doing, add {1} to the infinitive: {2}, to come, gives {3}, without coming, and {4} is how it is said in speech. {5}, to go, gives {6}. Source: English Wikipedia, Tamil grammar (the negative adverbial participle in -ஆமல் (-āmal), and -ஆமே (-āmē) in colloquial Tamil)."
