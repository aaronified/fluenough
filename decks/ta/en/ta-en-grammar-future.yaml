    "kudi": "to drink"
    "paar": "to see"
  notes: "The future adds -வ் (-v) or -ப் (-p) to the stem and then the person ending: போவேன் (pōvēṉ), I will go. Verbs like படி (paṭi) and குடி (kuṭi) take -ப் (-p), as in படிப்பேன் (paṭippēṉ). For it, the ending is -உம் (-um) on its own: போகும் (pōkum), வரும் (varum). The person endings are -ஏன் (-ēṉ) for I and -ஓம் (-ōm) for we, as in the present. For example, நான் கொஞ்சம் தமிழ் பேசுவேன் (nāṉ koñcam tamiḻ pēcuvēṉ) is the phrasebook's I speak a little Tamil, and நீங்கள் எப்போது வருவீர்கள் (nīṅkaḷ eppōtu varuvīrkaḷ) is When will you come? Source: English Wikipedia, Tamil grammar (the future in -pp- and -v-; the neuter -um)."
