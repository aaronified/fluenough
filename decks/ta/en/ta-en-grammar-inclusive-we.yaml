pattern:
  name: "Inclusive and exclusive we"
  slot_name: "form"
  entries:
    "naangal": "we, not including you"
    "naam": "we, including you"
  notes: "நாம் (nām) means you and I (and maybe others): use it to invite someone, as in சரி (cari), போகலாம் (pōkalām), OK, let us go. நாங்கள் (nāṅkaḷ) means we without the person you are speaking to: நாங்கள் வீட்டுக்குப் போகிறோம் (nāṅkaḷ vīṭṭukkup pōkiṟōm), we are going home. Both take the same verb ending, -ஓம் (-ōm). Source: English Wikipedia, Tamil grammar (inclusive and exclusive we); English Wiktionary (the entry for we)."
