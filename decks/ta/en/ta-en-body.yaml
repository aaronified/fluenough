schema: 1
id: "ta-en-body"
kind: "layer"
core: "ta-body"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The body"
description: "Head, face, nose, stomach, hair, finger, body and neck, and what hurts. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-0252":
    native: "head"
    notes:
      n1: "The head. Pain is said with வலிக்கிறது (valikkiṟatu, hurts)."
    examples:
      "தலை வலிக்கிறது.":
        native: "My head hurts."
        bases:
          "தலை": "head"
          "வலிக்கிறது": "hurts; from வலி (vali), pain; to hurt"
      "தலை மேலே இருக்கிறது.":
        native: "The head is above."
        bases:
          "தலை": "head"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-0253":
    native: "face"
    notes:
      n1: "The face."
    examples:
      "அவள் முகம் அழகு.":
        native: "Her face is beautiful."
        bases:
          "முகம்": "face"
          "அழகு": "beauty; beautiful"
      "முகம் கழுவு.":
        native: "Wash your face."
        bases:
          "முகம்": "face"
  "ta-0254":
    native: "nose"
    notes:
      n1: "The nose."
    examples:
      "மூக்கு வலிக்கிறது.":
        native: "My nose hurts."
        bases:
          "மூக்கு": "nose"
          "வலிக்கிறது": "hurts; from வலி (vali), pain; to hurt"
      "இது மூக்கு.":
        native: "This is a nose."
        bases:
          "மூக்கு": "nose"
  "ta-0255":
    native: "stomach"
    notes:
      n1: "The stomach, below the chest."
    examples:
      "வயிறு வலிக்கிறது.":
        native: "My stomach hurts."
        bases:
          "வயிறு": "stomach"
          "வலிக்கிறது": "hurts; from வலி (vali), pain; to hurt"
      "வயிறு கீழே இருக்கிறது.":
        native: "The stomach is below."
        bases:
          "வயிறு": "stomach"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-0256":
    native: "hair"
    notes:
      n1: "Hair on the head."
    examples:
      "முடி கருப்பு.":
        native: "The hair is black."
        bases:
          "முடி": "hair"
          "கருப்பு": "black"
      "முடி கழுவு.":
        native: "Wash your hair."
        bases:
          "முடி": "hair"
  "ta-0257":
    native: "finger"
    notes:
      n1: "A finger."
    examples:
      "விரல் வலிக்கிறது.":
        native: "My finger hurts."
        bases:
          "விரல்": "finger"
          "வலிக்கிறது": "hurts; from வலி (vali), pain; to hurt"
      "இது விரல்.":
        native: "This is a finger."
        bases:
          "விரல்": "finger"
  "ta-0258":
    native: "body"
    notes:
      n1: "The body. Said of health: உடம்பு வலிக்கிறது (uṭampu valikkiṟatu, my body hurts)."
    examples:
      "உடம்பு சூடாக இருக்கிறது.":
        native: "My body is hot; I have a fever."
        bases:
          "உடம்பு": "body"
          "சூடாக": "hot; from சூடு (cūṭu), heat"
          "இருக்கிறது": "is; from இரு (iru), to be"
      "உடம்பு வலிக்கிறது.":
        native: "My body hurts."
        bases:
          "உடம்பு": "body"
          "வலிக்கிறது": "hurts; from வலி (vali), pain; to hurt"
  "ta-0259":
    native: "neck"
    notes:
      n1: "The neck."
    examples:
      "கழுத்து வலிக்கிறது.":
        native: "My neck hurts."
        bases:
          "கழுத்து": "neck"
          "வலிக்கிறது": "hurts; from வலி (vali), pain; to hurt"
      "இது கழுத்து.":
        native: "This is a neck."
        bases:
          "கழுத்து": "neck"
