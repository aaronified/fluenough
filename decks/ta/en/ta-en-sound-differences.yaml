schema: 1
id: ta-en-sound-differences
kind: layer
core: ta-sound-differences
native:
  code: en
  iso639_3: eng
  name: English
name: 'Sounds English lacks: five pairs'
description: 'Ten words in five pairs that Tamil tells apart by one sound: a dental and a retroflex t, short and long vowels, a short and a long e, and a plain and a trilled r. Not yet checked by a Tamil speaker: please report any mistake.'
license: CC-BY-SA-4.0
tags:
- unreviewed
cards:
  ta-0031:
    native: ear
    notes:
      n1: The part of the head you hear with. Said with the tongue touching the back of the teeth.
      pair-forest: 'Only the last consonant differs from காடு (kāṭu), forest: த (ta) is said with the tongue on the teeth, ட (ṭa) with the tongue curled back.'
    examples:
      என் காது வலிக்கிறது.:
        native: My ear hurts.
        bases:
          என்: my
          வலிக்கிறது: hurts; from வலி (vali), pain
      இது என் காது.:
        native: This is my ear.
        bases:
          இது: this
          என்: my
  ta-0032:
    native: forest
    notes:
      n1: Wild land with many trees. The last sound is the curled-back ட (ṭa), not the dental த (ta) of காது (kātu), ear.
      pair-ear: 'Only the last consonant differs from காது (kātu), ear: ட (ṭa) is curled back, த (ta) is said on the teeth.'
    examples:
      காட்டில் புலி இருக்கிறது.:
        native: There is a tiger in the forest.
        bases:
          காட்டில்: in the forest; from காடு (kāṭu), forest
          புலி: tiger
          இருக்கிறது: is there; from இரு (iru), to be
      இது பெரிய காடு.:
        native: This is a big forest.
        bases:
          இது: this
          காடு: forest
  ta-0033:
    native: stone
    notes:
      n1: 'A stone or a pebble. The vowel is short: compare கால் (kāl), leg, with the long ā.'
      pair-foot: 'Only the vowel length differs from கால் (kāl), leg or foot: கல் (kal) is short, கால் (kāl) is long.'
    examples:
      இது ஒரு கல்.:
        native: This is a stone.
        bases:
          இது: this
          ஒரு: a, one
      தரையில் கல் இருக்கிறது.:
        native: There is a stone on the floor.
        bases:
          தரையில்: on the floor; from தரை (tarai), floor
          இருக்கிறது: is there; from இரு (iru), to be
  ta-0034:
    native: leg; foot
    notes:
      n1: 'The leg, from the hip to the foot. The vowel is long: compare கல் (kal), stone.'
      pair-stone: 'Only the vowel length differs from கல் (kal), stone: கால் (kāl) is long, கல் (kal) is short.'
    examples:
      என் கால் வலிக்கிறது.:
        native: My leg hurts.
        bases:
          என்: my
          வலிக்கிறது: hurts; from வலி (vali), pain
      நாய்க்கு நான்கு கால்.:
        native: A dog has four legs.
        bases:
          நாய்க்கு: to the dog; from நாய் (nāy), dog
          நான்கு: four
  ta-0035:
    native: tooth
    notes:
      n1: 'A tooth. The vowel is short: compare பால் (pāl), milk, with the long ā.'
      pair-milk: 'Only the vowel length differs from பால் (pāl), milk: பல் (pal) is short, பால் (pāl) is long.'
    examples:
      எனக்கு ஒரு பல் வலிக்கிறது.:
        native: One of my teeth hurts.
        bases:
          எனக்கு: to me; from என் (eṉ), I
          ஒரு: a, one
          வலிக்கிறது: hurts; from வலி (vali), pain
      பல் மருத்துவர் எங்கே?:
        native: Where is the dentist?
        bases:
          மருத்துவர்: doctor
          எங்கே: where
  ta-0036:
    native: milk
    notes:
      n1: 'Milk, from a cow or a goat. The vowel is long: compare பல் (pal), tooth.'
      pair-tooth: 'Only the vowel length differs from பல் (pal), tooth: பால் (pāl) is long, பல் (pal) is short.'
    examples:
      எனக்குப் பால் வேண்டும்.:
        native: I want milk.
        bases:
          எனக்குப்: to me; from என் (eṉ), I
          வேண்டும்: want; from வேண்டு (vēṇṭu), to want
      பால் சூடாக இருக்கிறது.:
        native: The milk is hot.
        bases:
          சூடாக: hot; from சூடு (cūṭu), heat
          இருக்கிறது: is; from இரு (iru), to be
  ta-0037:
    native: seven
    notes:
      n1: 'The number 7. The vowel is long: compare எழு (eḻu), to get up.'
      pair-rise: 'Only the vowel length differs from எழு (eḻu), to get up: ஏழு (ēḻu) is long, எழு (eḻu) is short.'
    examples:
      இன்று ஏழு மணி.:
        native: It is seven o'clock today.
        bases:
          இன்று: today
          மணி: hour; o'clock
      எனக்கு ஏழு வயது.:
        native: I am seven years old.
        bases:
          எனக்கு: to me; from என் (eṉ), I
          வயது: age
  ta-0038:
    native: to get up; to rise
    notes:
      n1: 'A verb: to stand up or get out of bed. The vowel is short: compare ஏழு (ēḻu), seven.'
      pair-seven: 'Only the vowel length differs from ஏழு (ēḻu), seven: எழு (eḻu) is short, ஏழு (ēḻu) is long.'
    examples:
      நான் காலையில் எழுகிறேன்.:
        native: I get up in the morning.
        bases:
          காலையில்: in the morning; from காலை (kālai), morning
          எழுகிறேன்: get up; from எழு (eḻu), to get up
      எழு, போகலாம்.:
        native: Get up, let's go.
        bases:
          எழு: get up
          போகலாம்: let's go; from போ (pō), to go
  ta-0039:
    native: curry; meat dish
    notes:
      n1: A dish cooked with spices, often meat or vegetables. The r is a trilled ṟ, not the plain r of கரி (kari), charcoal.
      pair-charcoal: 'Only the r differs from கரி (kari), charcoal: கறி (kaṟi) has the trilled ṟ, கரி (kari) a plain r.'
    examples:
      இன்று கறி சமைக்கிறேன்.:
        native: I am cooking curry today.
        bases:
          இன்று: today
          சமைக்கிறேன்: cook; from சமை (camai), to cook
      கறி நல்லது.:
        native: The curry is good.
  ta-0040:
    native: charcoal
    notes:
      n1: 'The black fuel burnt in a stove. The r is plain, not trilled: compare கறி (kaṟi), curry.'
      pair-curry: 'Only the r differs from கறி (kaṟi), curry: கரி (kari) has a plain r, கறி (kaṟi) the trilled ṟ.'
    examples:
      அடுப்பில் கரி இருக்கிறது.:
        native: There is charcoal in the stove.
        bases:
          அடுப்பில்: in the stove; from அடுப்பு (aṭuppu), stove
          இருக்கிறது: is there; from இரு (iru), to be
      கரி சூடாக இருக்கிறது.:
        native: The charcoal is hot.
        bases:
          சூடாக: hot; from சூடு (cūṭu), heat
          இருக்கிறது: is; from இரு (iru), to be
