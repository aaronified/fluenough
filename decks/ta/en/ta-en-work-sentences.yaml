id: "ta-en-work-sentences"
kind: "layer"
core: "ta-work-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Work in sentences"
description: "Nine sentences about jobs, offices, meetings, pay and rest. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-3017":
    native: "He or she is a doctor."
    notes:
      n1: "The verb is left out and the noun comes last. அவர் (avar) is the polite he or she; the plain forms are அவன் (avaṉ), he, and அவள் (avaḷ), she."
    confusables:
      w1: { why: "ஆசிரியர் (āciriyar), teacher, is another job." }
      w2: { why: "தொழிலாளி (toḻilāḷi), worker, is another job." }
  "ta-3018":
    native: "I work in an office."
    notes:
      n1: "வேலை செய் (vēlai cey), to work, means to do work: வேலை (vēlai), work, and செய் (cey), to do."
    confusables:
      w1: { why: "கணினி (kaṇiṉi), computer, is a machine, not a place of work." }
      w2: { why: "பணம் (paṇam), money, is not work." }
  "ta-3019":
    native: "There is a meeting today."
    bases:
      "இருக்கிறது": "is; from இரு (iru), to be"
    notes:
      n1: "கூட்டம் (kūṭṭam) means a meeting and also a crowd; the sentence shows which."
    confusables:
      w1: { why: "அலுவலகம் (aluvalakam), office, is a place, not an event." }
      w2: { why: "ஓய்வு (ōyvu), rest, is not a meeting." }
  "ta-3020":
    native: "Now is break time."
    notes:
      n1: "Two nouns side by side make a compound with no link word: ஓய்வு (ōyvu), rest, and நேரம் (nēram), time."
    confusables:
      w1: { why: "கூட்டம் (kūṭṭam), meeting, is a different thing." }
      w2: { why: "சம்பளம் (campaḷam), salary, is not rest." }
  "ta-3021":
    native: "He is a worker."
    notes:
      n1: "தொழிலாளி (toḻilāḷi), worker, is a masculine noun (m) in this course, so the plain அவன் (avaṉ), he, fits it."
    confusables:
      w1: { why: "மருத்துவர் (maruttuvar), doctor, is another job." }
      w2: { why: "ஆசிரியர் (āciriyar), teacher, is another job." }
  "ta-3022":
    native: "Do you work on a computer?"
    notes:
      n1: "நீ (nī) is the informal you for a friend or child; the -ஆ (-ā) ending makes a yes-or-no question."
    confusables:
      w1: { why: "கூட்டம் (kūṭṭam), meeting, is not a computer." }
      w2: { why: "அலுவலகம் (aluvalakam), office, is a place, not a machine." }
  "ta-3023":
    native: "What is the salary?"
    notes:
      n1: "எவ்வளவு (evvaḷavu) asks how much of a thing, such as money; எத்தனை (ettaṉai) counts things."
    confusables:
      w1: { why: "எத்தனை (ettaṉai), how many, counts things, not money." }
      w2: { why: "எப்போது (eppōtu), when, asks a time." }
  "ta-3024":
    native: "There is no meeting tomorrow."
    notes:
      n1: "இல்லை (illai) means no and also there is not, so it needs no verb."
    confusables:
      w1: { why: "ஆம் (ām), yes, is the opposite." }
      w2: { why: "இன்று (iṉṟu), today, is a different day." }
  "ta-3025":
    native: "We take a rest."
    notes:
      n1: "ஓய்வு எடு (ōyvu eṭu), take a rest: எடு (eṭu), to take, is the verb."
    confusables:
      w1: { why: "அலுவலகம் (aluvalakam), office, is a place, not a rest." }
      w2: { why: "பணம் (paṇam), money, is not rest." }
