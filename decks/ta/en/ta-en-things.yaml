cards:
  "ta-0268":
    native: "pen"
    notes:
      n1: "A pen for writing."
    examples:
      "இது பேனா.":
        native: "This is a pen."
        bases:
          "பேனா": "pen"
      "பேனா மேலே வை.":
        native: "Put the pen on top."
        bases:
          "பேனா": "pen"
  "ta-0269":
    native: "pencil"
    notes:
      n1: "A pencil for writing."
    examples:
      "இது பென்சில்.":
        native: "This is a pencil."
        bases:
          "பென்சில்": "pencil"
      "பென்சில் எடு.":
        native: "Take the pencil."
        bases:
          "பென்சில்": "pencil"
  "ta-0270":
    native: "clock; watch"
    notes:
      n1: "A clock or a watch, for the time."
    examples:
      "இது கடிகாரம்.":
        native: "This is a clock."
        bases:
          "கடிகாரம்": "clock; watch"
      "கடிகாரம் மேலே இருக்கிறது.":
        native: "The clock is above."
        bases:
          "கடிகாரம்": "clock; watch"
          "இருக்கிறது": "is; from இரு (iru), to be"
  "ta-0271":
    native: "mirror; glasses"
    notes:
      n1: "A mirror, or glasses for the eyes."
    examples:
      "இது கண்ணாடி.":
        native: "This is a mirror."
        bases:
          "கண்ணாடி": "mirror; glasses"
      "அது பெரிய கண்ணாடி.":
        native: "That is a big mirror."
        bases:
          "கண்ணாடி": "mirror; glasses"
  "ta-0272":
    native: "cloth"
    notes:
      n1: "Cloth, or a piece of cloth; also clothes in general."
    examples:
      "இது துணி.":
        native: "This is cloth."
        bases:
          "துணி": "cloth"
      "துணி வேண்டும்.":
        native: "Cloth is needed."
        bases:
          "துணி": "cloth"
          "வேண்டும்": "is needed"
  "ta-0273":
    native: "key"
    notes:
      n1: "A key for a door or a lock."
    examples:
      "சாவி எங்கே?":
        native: "Where is the key?"
        bases:
          "சாவி": "key"
      "இது சாவி.":
        native: "This is a key."
        bases:
          "சாவி": "key"
  "ta-0274":
    native: "umbrella"
    notes:
      n1: "An umbrella, for sun or rain."
    examples:
      "குடை வேண்டும்.":
        native: "An umbrella is needed."
        bases:
          "குடை": "umbrella"
          "வேண்டும்": "is needed"
      "இது குடை.":
        native: "This is an umbrella."
        bases:
          "குடை": "umbrella"
  "ta-0275":
    native: "ball"
    notes:
      n1: "A ball, for games."
    examples:
      "பந்து எடு.":
        native: "Take the ball."
        bases:
          "பந்து": "ball"
      "நீ பந்து விளையாடு.":
        native: "You, play with the ball."
        bases:
          "பந்து": "ball"
