schema: 1
id: "ta-en-eating-out-sentences"
kind: "layer"
core: "ta-eating-out-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Eating out in sentences"
description: "Eight short sentences for ordering, asking for less spice and taking food away. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-4054":
    native: "Give me the menu, I am hungry."
    bases:
      "எனக்கு": "to me; from நான் (nāṉ), I"
    confusables:
      w1: { why: "டிப்ஸ் (ṭips), tip (money), is a different word." }
      w2: { why: "பில் (pil), bill, is a different word." }
  "ta-4055":
    native: "Two dosas and one coffee."
    confusables:
      w1: { why: "இட்லி (iṭli), idli, is a different word." }
      w2: { why: "தேநீர் (tēnīr), tea, is a different word." }
  "ta-4056":
    native: "The sambar is a little sour."
    confusables:
      w1: { why: "காரம் (kāram), spiciness; hot spice, is a different word." }
      w2: { why: "இனிப்பு (iṉippu), sweet; sweet dish, is a different word." }
  "ta-4057":
    native: "No spice, please."
    notes:
      n1: "வேண்டாம் (vēṇṭām) is the polite way to say you do not want something."
    confusables:
      w1: { why: "புளிப்பு (puḷippu), sourness, is a different word." }
      w2: { why: "உப்பு (uppu), salt, is a different word." }
  "ta-4058":
    native: "The waiter serves the rice."
    bases:
      "பரிமாறுகிறார்": "serves (respectful); from பரிமாறு (parimāṟu), to serve"
    confusables:
      w1: { why: "மீல்ஸ் (mīls), meals (a full rice meal), is a different word." }
      w2: { why: "மெனு (meṉu), menu, is a different word." }
  "ta-4059":
    native: "I want two takeaways."
    confusables:
      w1: { why: "மீல்ஸ் (mīls), meals (a full rice meal), is a different word." }
      w2: { why: "டிப்ஸ் (ṭips), tip (money), is a different word." }
  "ta-4060":
    native: "The meals is ready, sit down."
    bases:
      "தயார்": "ready"
    confusables:
      w1: { why: "டிபன் (ṭipaṉ), tiffin; a light meal such as breakfast, is a different word." }
      w2: { why: "சாப்பாடு (cāppāṭu), food; meal, is a different word." }
  "ta-4061":
    native: "Give me water, it is very spicy."
    confusables:
      w1: { why: "புளிப்பு (puḷippu), sourness, is a different word." }
      w2: { why: "பசி (paci), hunger, is a different word." }
