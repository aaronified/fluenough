cards:
  "ta-8210":
    native: "volleyball"
    notes:
      n1: "Built from கை (kai), hand and பந்து (pantu), ball, a word taught earlier: a ball hit with the hand."
    examples:
      "எனக்குக் கைப்பந்து பிடிக்கும்.":
        native: "I like volleyball."
        bases:
          "எனக்குக்": "to me; for me; from நான் (nāṉ), I; me"
          "கைப்பந்து": "volleyball"
      "நாங்கள் கைப்பந்து விளையாடுகிறோம்.":
        native: "We play volleyball."
        bases:
          "கைப்பந்து": "volleyball"
          "விளையாடுகிறோம்": "we play; from விளையாடு (viḷaiyāṭu), to play"
