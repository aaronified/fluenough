schema: 1
id: "ta-en-grammar-reported-speech"
kind: "layer"
core: "ta-grammar-reported-speech"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Saying what someone said: the quote marker"
description: "Every verb the course teaches inside a quotation (he said that he came, comes, will come), with the spoken quote marker before the written one. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "said-did": "(he said) that he did"
    "said-does": "(he said) that he does"
    "said-will": "(he said) that he will do"
rules:
  "ta-rule-reported-did":
    name: "Said that it happened"
    explanation: "To pass on what someone said, put the speaker's own words before a quote marker and then say, say or ask. The marker is {1} in speech and {2} in writing. {3}, to come, gives {4}, so {5} is he said that he came. The verb keeps the tense and the person of the original words; Tamil does not shift them as English does. Source: English Wiktionary (the quotative marker, with the spoken forms -ṉṉu and -ṉu)."
  "ta-rule-reported-does":
    name: "Said that it happens"
    explanation: "For what happens now, the present verb goes before the marker: {1}, to come, gives {2} in speech and {3} in writing. {4} is he said that he is coming."
  "ta-rule-reported-will":
    name: "Said that it will happen"
    explanation: "For what will happen, the future verb goes before the marker: {1}, to come, gives {2} in speech and {3} in writing. {4} is he said that he will come. The same marker also follows a noun to mean called."
