schema: 1
id: "ta-en-history-sentences"
kind: "layer"
core: "ta-history-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "History: kings, forts, wars and heritage in sentences"
description: "Sentences about forts, kings, old coins and museums and how people talk about the past. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-9520":
    native: "This fort is very old."
    bases:
      "இந்தக்": "this (before a word starting with k); from இந்த (inta), this"
      "பழமையானது": "is ancient; from பழமையான (paḻamaiyāṉa), ancient"
    notes:
      n1: "இந்த (inta), this adds க் (k) before a word that starts with க (ka): இந்தக் கோட்டை (intak kōṭṭai)."
    confusables:
      w1: { why: "அரண்மனை (araṇmaṉai), palace, is a different word." }
      w2: { why: "கோபுரம் (kōpuram), tower; temple gateway tower, is a different word." }
      w3: { why: "நினைவுச்சின்னம் (niṉaivucciṉṉam), monument; memorial, is a different word." }
  "ta-9521":
    native: "There are old coins in the museum."
    bases:
      "அருங்காட்சியகத்தில்": "in the museum; from அருங்காட்சியகம் (aruṅkāṭciyakam), museum"
      "நாணயங்கள்": "coins; from நாணயம் (nāṇayam), coin"
      "இருக்கின்றன": "are; from இரு (iru), to be"
    notes:
      n1: "The plural of a noun in -ம் (-m) changes it to -ங் (-ṅ): நாணயம் (nāṇayam) becomes நாணயங்கள் (nāṇayaṅkaḷ)."
    confusables:
      w1: { why: "கல்வெட்டு (kalveṭṭu), stone inscription, is a different word." }
      w2: { why: "ஓலைச்சுவடி (ōlaiccuvaṭi), palm-leaf manuscript, is a different word." }
      w3: { why: "வாள் (vāḷ), sword, is a different word." }
  "ta-9522":
    native: "The king rules the country well."
    bases:
      "நாட்டை": "the country (object); from நாடு (nāṭu), country"
      "நன்றாக": "well; nicely; from நன்று (naṉṟu), good"
      "ஆளுகிறார்": "he rules; from ஆள் (āḷ), to rule"
    confusables:
      w1: { why: "ஆட்சி (āṭci), rule; reign, is a different word." }
      w2: { why: "அமைச்சர் (amaiccar), minister, is a different word." }
      w3: { why: "அரசவை (aracavai), royal court, is a different word." }
  "ta-9523":
    native: "The soldiers besiege the fort."
    bases:
      "வீரர்கள்": "soldiers; players; from வீரர் (vīrar), soldier; player"
      "கோட்டையை": "the fort (object); from கோட்டை (kōṭṭai), fort"
      "முற்றுகையிடுகிறார்கள்": "present, they; from முற்றுகையிடு (muṟṟukaiyiṭu), to besiege"
    notes:
      n1: "A noun ending in -ஐ (-ai) takes -ய் (-y) before the object ending: கோட்டை (kōṭṭai) becomes கோட்டையை (kōṭṭaiyai)."
    confusables:
      w1: { why: "தளபதி (taḷapati), commander; general, is a different word." }
      w2: { why: "ஆயுதம் (āyutam), weapon, is a different word." }
      w3: { why: "கேடயம் (kēṭayam), shield, is a different word." }
  "ta-9524":
    native: "People were happy under the king's rule."
    bases:
      "ஆட்சியில்": "under the rule; from ஆட்சி (āṭci), rule"
      "மகிழ்ச்சியாக": "happily; from மகிழ்ச்சி (makiḻcci), happiness; joy"
      "இருந்தார்கள்": "they were; from இரு (iru), to be"
    confusables:
      w1: { why: "சுதந்திரம் (cutantiram), freedom; independence, is a different word." }
      w2: { why: "போராட்டம் (pōrāṭṭam), struggle; protest, is a different word." }
      w3: { why: "தியாகம் (tiyākam), sacrifice, is a different word." }
  "ta-9525":
    native: "Our ancestors wrote history."
    bases:
      "நம்": "our (including you); from நாம் (nām), we (including you)"
      "எழுதினார்கள்": "they wrote; from எழுது (eḻutu), to write"
    confusables:
      w1: { why: "புலவர் (pulavar), poet-scholar; learned poet, is a different word." }
      w2: { why: "ஓலைச்சுவடி (ōlaiccuvaṭi), palm-leaf manuscript, is a different word." }
      w3: { why: "கல்வெட்டு (kalveṭṭu), stone inscription, is a different word." }
  "ta-9526":
    native: "We are in this century."
    bases:
      "இந்த": "this (before a noun)"
      "நூற்றாண்டில்": "in the century; from நூற்றாண்டு (nūṟṟāṇṭu), century"
      "இருக்கிறோம்": "we are; from இரு (iru), to be"
    notes:
      n1: "நூற்றாண்டு (nūṟṟāṇṭu), century ends in -ண்டு (-ṇṭu), so its -இல் (-il) form does not double the ட் (ṭ), unlike வீடு (vīṭu), house and வீட்டில் (vīṭṭil), in the house."
    confusables:
      w1: { why: "ஆண்டு (āṇṭu), year, is a different word." }
      w2: { why: "பழங்காலம் (paḻaṅkālam), ancient times; old days, is a different word." }
      w3: { why: "அரசு (aracu), government; state; kingdom, is a different word." }
  "ta-9527":
    native: "There was a poet-scholar in that royal court."
    bases:
      "அந்த": "that"
      "அரசவையில்": "in the royal court; from அரசவை (aracavai), royal court"
      "இருந்தார்": "he was; from இரு (iru), to be"
    confusables:
      w1: { why: "அமைச்சர் (amaiccar), minister, is a different word." }
      w2: { why: "அரசர் (aracar), king; ruler, is a different word." }
      w3: { why: "கவிஞர் (kaviñar), poet, is a different word." }
  "ta-9528":
    native: "The temple tower is very tall."
    bases:
      "மிக": "very"
      "உயரமானது": "is tall; from உயரமான (uyaramāṉa), tall"
    notes:
      n1: "A noun can stand in front of another noun with no ending: கோயில் கோபுரம் (kōyil kōpuram), the temple tower."
    confusables:
      w1: { why: "கோட்டை (kōṭṭai), fort; fortress, is a different word." }
      w2: { why: "சிலை (cilai), statue, is a different word." }
      w3: { why: "கல்வெட்டு (kalveṭṭu), stone inscription, is a different word." }
  "ta-9529":
    native: "Where is the history book?"
    bases:
      "வரலாற்றுப்": "historical (before a word starting with p); from வரலாற்று (varalāṟṟu), historical"
    confusables:
      w1: { why: "சரித்திரம் (carittiram), history; story of the past, is a different word." }
      w2: { why: "ஆதாரம் (ātāram), proof; evidence; source, is a different word." }
      w3: { why: "நினைவு (niṉaivu), memory; thought, is a different word." }
