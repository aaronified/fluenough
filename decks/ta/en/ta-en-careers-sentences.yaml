cards:
  "ta-9080":
    native: "I need a job."
    bases:
      "எனக்கு": "to me; for me; from நான் (nāṉ), I; me"
    confusables:
      w1: { why: "வேலைவாய்ப்பு (vēlaivāyppu), job opening; employment, is a different word." }
      w2: { why: "வாய்ப்பு (vāyppu), opportunity; chance, is a different word." }
      w3: { why: "பகுதிநேரம் (pakutinēram), part-time, is a different word." }
  "ta-9081":
    native: "I have an interview tomorrow."
    bases:
      "எனக்கு": "to me; for me; from நான் (nāṉ), I; me"
      "இருக்கிறது": "is; from இரு (iru), to be"
    confusables:
      w1: { why: "விண்ணப்பதாரர் (viṇṇappatārar), applicant, is a different word." }
      w2: { why: "சுயவிவரம் (cuyavivaram), profile; résumé, is a different word." }
      w3: { why: "பயோடேட்டா (payōṭēṭṭā), biodata; CV, is a different word." }
  "ta-9082":
    native: "I am sending my résumé."
    bases:
      "என்": "my; from நான் (nāṉ), I; me"
      "சுயவிவரத்தை": "the profile; from சுயவிவரம் (cuyavivaram), profile; résumé"
      "அனுப்புகிறேன்": "am sending; from அனுப்பு (aṉuppu), to send"
    confusables:
      w1: { why: "திறன் (tiṟaṉ), skill; ability, is a different word." }
      w2: { why: "தகுதி (takuti), qualification; merit, is a different word." }
      w3: { why: "பட்டம் (paṭṭam), degree; title, is a different word." }
  "ta-9083":
    native: "The pay comes once a month."
    bases:
      "ஒருமுறை": "once"
      "கிடைக்கிறது": "is received; is available; from கிடை (kiṭai), to be obtained"
    confusables:
      w1: { why: "கூலி (kūli), wage; labour charge, is a different word." }
      w2: { why: "போனஸ் (pōṉas), bonus, is a different word." }
      w3: { why: "வருமானம் (varumāṉam), income, is a different word." }
  "ta-9084":
    native: "I need leave tomorrow."
    bases:
      "எனக்கு": "to me; for me; from நான் (nāṉ), I; me"
    confusables:
      w1: { why: "வேலைநேரம் (vēlainēram), working hours, is a different word." }
      w2: { why: "ராஜினாமா (rājiṉāmā), resignation, is a different word." }
      w3: { why: "பணிநிறைவு (paṇiniṟaivu), retirement, is a different word." }
  "ta-9085":
    native: "He works in an office."
    bases:
      "அவர்": "he or she (polite)"
      "அலுவலகத்தில்": "in the office; from அலுவலகம் (aluvalakam), office"
      "பணிபுரிகிறார்": "is working (respectful); from பணிபுரி (paṇipuri), to work; to be employed"
    confusables:
      w1: { why: "பணியாற்று (paṇiyāṟṟu), to work; to serve (formal), is a different word." }
      w2: { why: "உழை (uḻai), to work hard; to toil, is a different word." }
  "ta-9086":
    native: "He is getting ahead in his job."
    bases:
      "அவன்": "his"
      "வேலையில்": "in work; from வேலை (vēlai), work; job"
      "முன்னேறுகிறான்": "is progressing (he); from முன்னேறு (muṉṉēṟu), to progress; to get ahead"
    confusables:
      w1: { why: "முன்னேற்றம் (muṉṉēṟṟam), progress; improvement, is a different word." }
      w2: { why: "பதவிஉயர்வு (pataviuyarvu), promotion, is a different word." }
      w3: { why: "சாதனை (cātaṉai), achievement; record, is a different word." }
  "ta-9087":
    native: "This is a temporary job."
    confusables:
      w1: { why: "நிரந்தர (nirantara), permanent, is a different word." }
      w2: { why: "பகுதிநேரம் (pakutinēram), part-time, is a different word." }
      w3: { why: "முழுநேரம் (muḻunēram), full-time, is a different word." }
  "ta-9088":
    native: "Good teamwork is important."
    bases:
      "முக்கியம்": "important"
    confusables:
      w1: { why: "தலைமை (talaimai), leadership; headship, is a different word." }
      w2: { why: "ஊக்கம் (ūkkam), motivation; encouragement, is a different word." }
      w3: { why: "நிர்வாகம் (nirvākam), management; administration, is a different word." }
  "ta-9089":
    native: "I am interested in this job."
    bases:
      "எனக்கு": "to me; for me; from நான் (nāṉ), I; me"
      "இந்த": "this"
      "வேலையில்": "in work; from வேலை (vēlai), work; job"
      "இருக்கிறது": "is; from இரு (iru), to be"
    confusables:
      w1: { why: "தன்னம்பிக்கை (taṉṉampikkai), self-confidence, is a different word." }
      w2: { why: "சவால் (cavāl), challenge, is a different word." }
      w3: { why: "முன்னுரிமை (muṉṉurimai), priority, is a different word." }
