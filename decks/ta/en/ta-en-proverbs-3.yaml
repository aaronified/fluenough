# Layer for ta-proverbs-3: each proverb's literal English rendering and its meaning.
schema: 1
id: "ta-en-proverbs-3"
kind: "layer"
core: "ta-proverbs-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs 3"
description: "Twenty Tamil proverbs from Rev. P. Percival's 1874 collection, not in proverbs 1 or 2, short first: farming, work, wit and comparisons about the sea and the Ganges. Not yet checked by a Tamil speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ta-6240":
    native: "Do not live by seizing land."
    notes:
      "literal": "Said as a warning against living off what is taken from others."
    bases:
      "மண்": { meaning: "land, earth" }
      "பறித்து": { meaning: "seizing, snatching" }
      "உண்ணேல்": { meaning: "do not eat, do not live on" }
  "ta-6241":
    native: "Like asafoetida put into the sea."
    notes:
      "literal": "Said of something small that is lost without any trace."
    bases:
      "கடலில்": { meaning: "in the sea" }
      "இட்ட": { meaning: "that was put" }
      "பெருங்காயம்போல": { meaning: "like asafoetida" }
  "ta-6242":
    native: "Like tamarind dissolved in the sea."
    notes:
      "literal": "Said of an effort or a gift that is wasted and makes no difference."
    bases:
      "கடலில்": { meaning: "in the sea" }
      "கரைத்த": { meaning: "that was dissolved" }
      "புளிபோல": { meaning: "like tamarind" }
  "ta-6243":
    native: "Merit shows in the crop that was grown."
    notes:
      "literal": "Said that a person's merit, or care, shows in the results of his work."
    bases:
      "பண்ணிய": { meaning: "that was done, that was grown" }
      "பயிரில்": { meaning: "in the crop" }
      "புண்ணியம்": { meaning: "merit" }
      "தெரியும்": { meaning: "shows" }
  "ta-6244":
    native: "The one who drew water for the low field takes his share."
    notes:
      "literal": "Said that whoever did the work gets the reward."
    bases:
      "பள்ளம்": { meaning: "low ground, hollow" }
      "இறைத்தவன்": { meaning: "one who drew water" }
      "பங்கு": { meaning: "share" }
      "கொண்டுபோகிறான்": { meaning: "takes away" }
  "ta-6245":
    native: "The one who planted the tree will pour the water."
    notes:
      "literal": "Said that whoever starts something must see it through."
    bases:
      "மரம்": { meaning: "tree" }
      "வைத்தவன்": { meaning: "one who planted" }
      "தண்ணீர்": { meaning: "water" }
      "வார்ப்பான்": { meaning: "will pour" }
  "ta-6246":
    native: "Even if it grew on a mountain, it must be pounded in a mortar."
    notes:
      "literal": "Said that, however grand its origin, a thing must still be prepared before it can be used."
    bases:
      "மலையில்": { meaning: "on the mountain" }
      "விளைந்தாலும்": { meaning: "even if it grows" }
      "உரலில்": { meaning: "in a mortar" }
      "மசியவேண்டும்": { meaning: "must be mashed, must be pounded" }
  "ta-6247":
    native: "Goods that are plentiful come to the shop."
    notes:
      "literal": "Said that what is abundant is easy to find in the market."
    bases:
      "மலிந்த": { meaning: "abundant" }
      "பண்டம்": { meaning: "goods" }
      "கடையிலே": { meaning: "in the shop" }
      "வரும்": { meaning: "will come" }
  "ta-6248":
    native: "You must take it up and winnow it in the blowing wind."
    notes:
      "literal": "Said that an opportunity must be used while it lasts."
    bases:
      "அடிக்கும்": { meaning: "blowing" }
      "காற்றிலே": { meaning: "in the wind" }
      "எடுத்துத்": { meaning: "taking up" }
      "தூற்றவேண்டும்": { meaning: "must winnow" }
  "ta-6249":
    native: "If the anvil turns out well, the work will turn out well."
    notes:
      "literal": "Said that good tools or a good base make the work go well."
    bases:
      "பட்டடை": { meaning: "anvil, workbench" }
      "வாய்த்தால்": { meaning: "if it turns out well" }
      "பணி": { meaning: "work" }
      "வாய்க்கும்": { meaning: "will turn out well" }
  "ta-6250":
    native: "Even if you fill up the sea, the task cannot be finished."
    notes:
      "literal": "Said of a task that cannot be done however much effort goes into it."
    bases:
      "கடலை": { meaning: "the sea" }
      "தூர்த்தாலும்": { meaning: "even if one fills up" }
      "காரியம்": { meaning: "task" }
      "முடியாது": { meaning: "cannot be finished" }
  "ta-6251":
    native: "If the sea swells, will the shore grow too?"
    notes:
      "literal": "Said that one's means do not grow just because the need or the crowd grows."
    bases:
      "கடல்": { meaning: "sea" }
      "பெருகினால்": { meaning: "if it swells" }
      "கரையும்": { meaning: "the shore also" }
      "பெருகுமா": { meaning: "will it grow?" }
  "ta-6252":
    native: "It is hard to lift a stone to the top of a mountain."
    notes:
      "literal": "Said of a task that takes great effort."
    bases:
      "மலை": { meaning: "mountain" }
      "உச்சியில்": { meaning: "at the top" }
      "கல்": { meaning: "stone" }
      "ஏற்றுதல்": { meaning: "lifting up" }
      "அரிது": { meaning: "rare, hard" }
  "ta-6253":
    native: "Even if it bathes in the Ganges, will a crow become a swan?"
    notes:
      "literal": "Said that a person's nature does not change just through outward acts such as a ritual bath."
    bases:
      "கங்கையில்": { meaning: "in the Ganges" }
      "மூழ்கினாலும்": { meaning: "even if it dips" }
      "காக்கை": { meaning: "crow" }
      "அன்னம்": { meaning: "swan" }
      "ஆகுமா": { meaning: "will it become?" }
  "ta-6254":
    native: "A snail born in the Ganges does not become a Shalagrama stone."
    notes:
      "literal": "Said that birth in a holy place does not make anyone, or anything, holy."
    bases:
      "கங்கையிலே": { meaning: "in the Ganges" }
      "பிறந்த": { meaning: "born" }
      "நத்தை": { meaning: "snail" }
      "சாலக்கிராமம்": { meaning: "Shalagrama, a sacred stone with a fossil shell, worshipped as a form of Vishnu" }
      "ஆகாது": { meaning: "will not become" }
  "ta-6255":
    native: "If the sea boils, where is the water to cool it?"
    notes:
      "literal": "Said that when a great trouble comes, there is nothing to set it right."
    bases:
      "கடல்": { meaning: "sea" }
      "கொதித்தால்": { meaning: "if it boils" }
      "விளாவ": { meaning: "to cool by adding water" }
      "நீர்": { meaning: "water" }
      "எங்கே": { meaning: "where" }
  "ta-6256":
    native: "For the fish of the sea, whatever the fisherman sets is the law."
    notes:
      "literal": "Said that the weak must live by whatever the one with power over them decides."
    bases:
      "கடல்": { meaning: "sea" }
      "மீனுக்கு": { meaning: "for the fish" }
      "நுளையன்": { meaning: "fisherman" }
      "இட்டதே": { meaning: "what he set, with the emphatic ending" }
      "சட்டம்": { meaning: "law, rule" }
  "ta-6257":
    native: "Leaves protect the tree; money protects one's honour."
    notes:
      "literal": "Said that money protects a person's honour and good name, as leaves cover a tree."
    bases:
      "மரத்தை": { meaning: "the tree" }
      "இலை": { meaning: "leaf" }
      "காக்கும்": { meaning: "protects" }
      "மானத்தைப்": { meaning: "honour" }
      "பணம்": { meaning: "money" }
  "ta-6258":
    native: "What will money do; it will do ten kinds of things."
    notes:
      "literal": "Said that money can do all manner of things."
    bases:
      "பணம்": { meaning: "money" }
      "என்ன": { meaning: "what" }
      "செய்யும்": { meaning: "will do" }
      "பத்து": { meaning: "ten" }
      "விதம்": { meaning: "kind" }
  "ta-6259":
    native: "The stork, hoping to eat dried fish once the sea dried up, is said to have wasted away and died."
    notes:
      "literal": "Said of someone who waits for something impossible and loses everything by waiting."
    bases:
      "கடல்": { meaning: "sea" }
      "வற்றிக்": { meaning: "drying up" }
      "கருவாடு": { meaning: "dried fish" }
      "தின்னலாமென்று": { meaning: "thinking one may eat" }
      "உடல்": { meaning: "body" }
      "வற்றிச்": { meaning: "wasting away" }
      "செத்ததாம்": { meaning: "is said to have died" }
      "கொக்கு": { meaning: "stork, crane" }
