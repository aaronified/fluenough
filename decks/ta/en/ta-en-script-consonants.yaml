"cards":
  "ta-1040":
    "native": "ka"
    "notes":
      "n1": "The 'k' sound, written க (ka), at the start of a word. The page on Tamil script says this letter 'can also be pronounced [g] or [x] based on the rules of Tamil phonology' (en.wikipedia 'Tamil script'). It is in கல் (kal, stone)."
    "examples":
      "கல்": "stone"
      "காது": "ear"
  "ta-1041":
    "native": "ṅa, the ng of sing"
    "notes":
      "n1": "The 'ng' of 'sing', written ங (ṅa). It stands inside a word, as in தங்கை (taṅkai, younger sister) and இங்கே (iṅkē, here)."
    "examples":
      "தங்கை": "younger sister"
      "இங்கே": "here"
  "ta-1042":
    "native": "ca, the s sound"
    "notes":
      "n1": "The 's' of 'sun', written ச (ca). The course's broad IPA is /s/. It starts சாப்பிடு (cāppiṭu, to eat)."
    "examples":
      "சாப்பிடு": "to eat"
      "சனி": "Saturday"
  "ta-1043":
    "native": "ña, the ny sound"
    "notes":
      "n1": "A palatal nasal, like the 'ny' of 'canyon', written ஞ (ña). It starts ஞாயிறு (ñāyiṟu, Sunday)."
    "examples":
      "ஞாயிறு": "Sunday"
      "மஞ்சள்": "yellow; turmeric"
  "ta-1044":
    "native": "ṭa, a retroflex t"
    "notes":
      "n1": "A retroflex 't', said with the tongue tip curled back, written ட (ṭa). The dot under the ṭ in its reading marks this. It starts டாக்சி (ṭākci, taxi)."
    "examples":
      "டாக்சி": "taxi"
      "காடு": "forest"
  "ta-1045":
    "native": "ṇa, a retroflex n"
    "notes":
      "n1": "A retroflex nasal, said with the tongue tip curled back, written ண (ṇa). It is in நண்பன் (naṇpaṉ, male friend)."
    "examples":
      "நண்பன்": "male friend"
      "கணவர்": "husband"
  "ta-1046":
    "native": "ta"
    "notes":
      "n1": "A 't' written த (ta), without the dot that marks the retroflex ட (ṭa). It starts தண்ணீர் (taṇṇīr, water)."
    "examples":
      "தண்ணீர்": "water"
      "தம்பி": "younger brother"
  "ta-1047":
    "native": "na, dental"
    "notes":
      "n1": "A dental nasal, written ந (na). The page on Tamil script gives it as a dental nasal (en.wikipedia 'Tamil script'); the course's broad IPA is plain /n/ and does not mark that. It starts நான் (nāṉ, I)."
    "examples":
      "நான்": "I; me"
      "நான்கு": "four"
  "ta-1048":
    "native": "pa"
    "notes":
      "n1": "The 'p' sound, written ப (pa). It starts பெயர் (peyar, name)."
    "examples":
      "பெயர்": "name"
      "பால்": "milk"
  "ta-1049":
    "native": "ma"
    "notes":
      "n1": "The 'm' sound of 'man', written ம (ma). It starts மனைவி (maṉaivi, wife)."
    "examples":
      "மனைவி": "wife"
      "மகன்": "son"
  "ta-1050":
    "native": "ya"
    "notes":
      "n1": "The 'y' sound of 'yes', written ய (ya). It starts யானை (yāṉai, elephant)."
    "examples":
      "யார்": "who"
      "யானை": "elephant"
  "ta-1051":
    "native": "ra, a tap"
    "notes":
      "n1": "A tap of the tongue against the roof of the mouth, written ர (ra). The page on Tamil script gives it as the tap ɾ (en.wikipedia 'Tamil script'). It starts ரயில் (rayil, train)."
    "examples":
      "ரயில்": "train"
      "ரூபாய்": "rupee"
  "ta-1052":
    "native": "la"
    "notes":
      "n1": "The 'l' sound, written ல (la). It is in கால் (kāl, leg; foot)."
    "examples":
      "லட்சம்": "a lakh (one hundred thousand)"
      "கால்": "leg; foot"
  "ta-1053":
    "native": "va, between v and w"
    "notes":
      "n1": "A sound between 'v' and 'w', written வ (va). The course's broad IPA is ʋ. It starts வணக்கம் (vaṇakkam, hello)."
    "examples":
      "வணக்கம்": "hello"
      "வீடு": "house; home"
  "ta-1054":
    "native": "ḻa, a retroflex approximant"
    "notes":
      "n1": "A retroflex approximant, written ழ (ḻa), with a dot under the l in its reading. The page on Tamil script gives it as /ɻ/ (en.wikipedia 'Tamil script'). It is in எழு (eḻu, to get up; to rise)."
    "examples":
      "எழு": "to get up; to rise"
      "குழந்தை": "child"
  "ta-1055":
    "native": "ḷa, a retroflex l"
    "notes":
      "n1": "A retroflex 'l', said with the tongue tip curled back, written ள (ḷa). It is in மகள் (makaḷ, daughter)."
    "examples":
      "மகள்": "daughter"
      "கேள்": "to listen; to ask"
  "ta-1056":
    "native": "ṟa, a trill"
    "notes":
      "n1": "A trilled 'r', written ற (ṟa). The page on Tamil script gives it as /r/ (en.wikipedia 'Tamil script'), not the tap of ர (ra). It is in நேற்று (nēṟṟu, yesterday)."
    "examples":
      "நேற்று": "yesterday"
      "கறி": "curry; meat dish"
  "ta-1057":
    "native": "ṉa"
    "notes":
      "n1": "A nasal written ன (ṉa), a different letter from ந (na) and ண (ṇa). The page on Tamil script gives it as /n/ (en.wikipedia 'Tamil script'); the course's broad IPA is plain /n/ as for ந (na). It is in என்ன (eṉṉa, what)."
    "examples":
      "என்ன": "what"
      "அவன்": "he"
