pattern:
  name: "Spoken and written"
  slot_name: "form"
  entries:
    "nenkal": "you, polite or more than one"
    "nankal": "we, not including you"
    "avarkal": "they"
    "inge": "here"
    "enge": "where"
    "illai": "no; there is not"
    "ventum": "is wanted; is needed"
    "irandu": "two"
    "onru": "one"
    "moonru": "three"
    "naanku": "four"
    "thanneer": "water"
    "vaa-i": "to come: I do it now"
    "vaa-it": "to come: it does it now"
    "po-i": "to go: I do it now"
    "cappitu-i": "to eat: I do it now"
    "pesu-i": "to speak: I do it now"
  notes: "Spoken Tamil and written Tamil differ in sounds, not in grammar. The course has taught the spoken form first, and this table sets each beside its written form. Some spoken forms shorten a long vowel, as இங்க (iṅka) for இங்கே (iṅkē) and எங்க (eṅka) for எங்கே (eṅkē). Some change a vowel or a consonant, as தண்ணி (taṇṇi) for தண்ணீர் (taṇṇīr) and ரெண்டு (reṇṭu) for இரண்டு (iraṇṭu). Verb endings shorten most: வர்றேன் (varṟēṉ) for வருகிறேன் (varukiṟēṉ) and வருது (varutu) for வருகிறது (varukiṟatu). Use the spoken form in talk and the written form in letters, notices and exams. Not yet checked by a Tamil speaker: please report any mistake."
