name: "Weddings: the invitation, the rites and the guests"
description: "A wedding: the bride and groom, the in-laws, the hall, the invitation, the rites and the guests, with the verbs of inviting, welcoming and blessing. Not yet checked by a Tamil speaker: please report any mistake."
