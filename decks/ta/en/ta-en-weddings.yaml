cards:
  "ta-8160":
    native: "wedding; marriage"
    notes:
      n1: "The formal word; in speech கல்யாணம் (kalyāṇam), wedding is just as common."
    examples:
      "நாளை திருமணம்.":
        native: "The wedding is tomorrow."
        bases:
          "திருமணம்": "wedding; marriage"
      "திருமணம் எங்கே?":
        native: "Where is the wedding?"
        bases:
          "திருமணம்": "wedding; marriage"
  "ta-8161":
    native: "wedding; marriage"
    notes:
      n1: "A Sanskrit-origin word used in speech; it also means auspicious."
    examples:
      "இன்று கல்யாணம்.":
        native: "The wedding is today."
        bases:
          "கல்யாணம்": "wedding; marriage"
      "கல்யாணம் மண்டபத்தில் நடக்கிறது.":
