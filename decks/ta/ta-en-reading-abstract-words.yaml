      - text: "சோம்பல் நல்லது இல்லை."
        reading: "cōmpal nallatu illai."
        ipa: "soːmpal nallat̪u illai"
      - text: "பணிவு ஒரு நல்ல பண்பு."
        reading: "paṇivu oru nalla paṇpu."
        ipa: "paɳiʋu oɾu nalla paɳpu"
      - text: "பேராசை துன்பத்தில் முடிகிறது."
        reading: "pērācai tuṉpattil muṭikiṟatu."
        ipa: "peːɾaːsai t̪unpat̪t̪il muʈikirat̪u"
      - text: "அறிவும் வேண்டும், நல்ல மனமும் வேண்டும்."
        reading: "aṟivum vēṇṭum, nalla maṉamum vēṇṭum."
        ipa: "ariʋum ʋeːɳʈum nalla manamum ʋeːɳʈum"
