passages:
  - id: "ta-who-is-who"
    title: "Who is who"
    sentences:
      - text: "அவன் எங்கே போகிறான்?"
        reading: "avaṉ eṅkē pōkiṟāṉ?"
        ipa: "aʋan eŋkeː poːkiraːn"
      - text: "அவன் வீட்டுக்குப் போகிறான்."
        reading: "avaṉ vīṭṭukkup pōkiṟāṉ."
        ipa: "aʋan ʋiːʈʈukkup poːkiraːn"
      - text: "நீ எங்கே போகிறாய்?"
        reading: "nī eṅkē pōkiṟāy?"
        ipa: "niː eŋkeː poːkiraːj"
      - text: "நாங்கள் வீட்டுக்குப் போகிறோம்."
        reading: "nāṅkaḷ vīṭṭukkup pōkiṟōm."
        ipa: "naːŋkaɭ ʋiːʈʈukkup poːkiroːm"
    questions:
      - id: "ta-9703"
        prompt: { en: "Who is going somewhere?" }
        options:
          - { en: "He and the speakers" }
          - { en: "Only she" }
          - { en: "Nobody" }
        answer: 1
      - id: "ta-9704"
        prompt: { en: "Someone is asked a question with the informal word for you." }
        answer: true
      - id: "ta-9705"
        prompt: { en: "Where are the speakers going?" }
        options:
          - { en: "To the market" }
          - { en: "Home" }
          - { en: "To school" }
        answer: 2
