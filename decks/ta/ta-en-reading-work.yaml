    sentences:
      - text: "இவர் அருண். இவர் மருத்துவர்."
        reading: "ivar aruṇ. ivar maruttuvar."
        ipa: "iʋaɾ aɾuɳ iʋaɾ maɾut̪t̪uʋaɾ"
      - text: "இவர் மீனா. இவர் ஆசிரியர்."
        reading: "ivar mīṉā. ivar āciriyar."
        ipa: "iʋaɾ miːnaː iʋaɾ aːsiɾijaɾ"
      - text: "அவன் தொழிலாளி."
        reading: "avaṉ toḻilāḷi."
        ipa: "aʋan t̪oɻilaːɭi"
      - text: "இன்று கூட்டம் இருக்கிறது."
        reading: "iṉṟu kūṭṭam irukkiṟatu."
        ipa: "inru kuːʈʈam iɾukkirat̪u"
