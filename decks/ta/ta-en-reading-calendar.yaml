  - id: "ta-wall-calendar"
    title: "A wall calendar"
    sentences:
      - text: "இது காலண்டர்."
        reading: "itu kālaṇṭar."
        ipa: "it̪u kaːlaɳʈaɾ"
      - text: "இன்று திங்கள்."
        reading: "iṉṟu tiṅkaḷ."
        ipa: "inru t̪iŋkaɭ"
      - text: "வெள்ளி தம்பிக்குப் பிறந்தநாள்."
        reading: "veḷḷi tampikkup piṟantanāḷ."
        ipa: "ʋeɭɭi t̪ampikkup pirant̪anaːɭ"
      - text: "அடுத்த வாரம் விடுமுறை."
        reading: "aṭutta vāram viṭumuṟai."
        ipa: "aʈut̪t̪a ʋaːɾam ʋiʈumurai"
    questions:
      - id: "ta-9906"
        prompt: { en: "On which day is the younger brother's birthday?" }
