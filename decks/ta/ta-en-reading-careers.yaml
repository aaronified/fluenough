    sentences:
      - text: "கடையில் காசாளர் வேண்டும்."
        reading: "kaṭaiyil kācāḷar vēṇṭum."
        ipa: "kaʈaijil kaːsaːɭaɾ ʋeːɳʈum"
      - text: "காலை ஒன்பது மணிக்கு வாருங்கள், மாலை ஐந்து மணி வரை வேலை."
        reading: "kālai oṉpatu maṇikku vāruṅkaḷ, mālai aintu maṇi varai vēlai."
        ipa: "kaːlai onpat̪u maɳikku ʋaːɾuŋkaɭ maːlai aint̪u maɳi ʋaɾai ʋeːlai"
      - text: "இது பகுதிநேர வேலை."
        reading: "itu pakutinēra vēlai."
        ipa: "it̪u pakut̪ineːɾa ʋeːlai"
      - text: "ஆர்வம் உள்ளவர்கள் பயோடேட்டா கொடுங்கள்."
        reading: "ārvam uḷḷavarkaḷ payōṭēṭṭā koṭuṅkaḷ."
        ipa: "aːɾʋam uɭɭaʋaɾkaɭ pajoːʈeːʈʈaː koʈuŋkaɭ"
      - text: "திறன் இருந்தால் வாய்ப்பு உண்டு."
        reading: "tiṟaṉ iruntāl vāyppu uṇṭu."
        ipa: "t̪iran iɾunt̪aːl ʋaːjppu uɳʈu"
