        reading: "teṟkut teru arukil irukkiṟatu."
        ipa: "t̪erkut̪ t̪eɾu aɾukil iɾukkirat̪u"
      - text: "வலது, இடது."
        reading: "valatu, iṭatu."
        ipa: "ʋalat̪u iʈat̪u"
