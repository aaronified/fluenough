    sentences:
      - text: "காலையில் சேவல் கூவுகிறது."
        reading: "kālaiyil cēval kūvukiṟatu."
        ipa: "kaːlaijil seːʋal kuːʋukirat̪u"
      - text: "பையன் தோட்டத்தில் மண்ணைத் தோண்டுகிறான்."
        reading: "paiyaṉ tōṭṭattil maṇṇait tōṇṭukiṟāṉ."
        ipa: "paijan t̪oːʈʈat̪t̪il maɳɳait̪ t̪oːɳʈukiraːn"
      - text: "அவன் பந்தை அங்கே புதைக்கிறான்."
        reading: "avaṉ pantai aṅkē putaikkiṟāṉ."
        ipa: "aʋan pant̪ai aŋkeː put̪aikkiraːn"
      - text: "பிறகு அவன் அதை மறந்துபோகிறான்."
        reading: "piṟaku avaṉ atai maṟantupōkiṟāṉ."
        ipa: "piraku aʋan at̪ai marant̪upoːkiraːn"
      - text: "மாலையில் பந்தைத் தேடுகிறான்."
        reading: "mālaiyil pantait tēṭukiṟāṉ."
        ipa: "maːlaijil pant̪ait̪ t̪eːʈukiraːn"
