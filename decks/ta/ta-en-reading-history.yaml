passages:
  - id: "ta-museum-card"
    title: "A museum card"
    theme: "history"
    sentences:
      - text: "இது ஒரு பழைய நாணயம்."
        reading: "itu oru paḻaiya nāṇayam."
        ipa: "it̪u oɾu paɻaija naːɳajam"
      - text: "இதில் ஒரு ராஜா படம் இருக்கிறது."
        reading: "itil oru rājā paṭam irukkiṟatu."
        ipa: "it̪il oɾu ɾaːdʒaː paʈam iɾukkirat̪u"
      - text: "இங்கே கல்வெட்டும் வாளும் உண்டு."
        reading: "iṅkē kalveṭṭum vāḷum uṇṭu."
        ipa: "iŋkeː kalʋeʈʈum ʋaːɭum uɳʈu"
      - text: "நாணயத்தைத் தொட வேண்டாம்."
        reading: "nāṇayattait toṭa vēṇṭām."
        ipa: "naːɳajat̪t̪ait̪ t̪oʈa ʋeːɳʈaːm"
      - text: "புகைப்படம் எடுக்கலாம்."
        reading: "pukaippaṭam eṭukkalām."
        ipa: "pukaippaʈam eʈukkalaːm"
    questions:
      - id: "ta-5246"
        prompt: { "en": "What is the object described on the card?" }
        options:
          - { "en": "An old coin" }
          - { "en": "A sword" }
          - { "en": "A palm-leaf manuscript" }
        answer: 1
      - id: "ta-5247"
        prompt: { "en": "What is shown on it?" }
        options:
          - { "en": "A picture of a king" }
          - { "en": "A tower" }
          - { "en": "A ship" }
        answer: 1
      - id: "ta-5248"
        prompt: { "en": "May visitors touch the coin?" }
        options:
          - { "en": "No" }
          - { "en": "Yes" }
          - { "en": "Only children may" }
        answer: 1
      - id: "ta-5249"
        prompt: { "en": "Photographs are allowed." }
        answer: true
