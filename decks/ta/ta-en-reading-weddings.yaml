passages:
  - id: "ta-wedding-card"
    title: "A wedding card"
    theme: "weddings"
    sentences:
      - text: "மணமகன் ராஜா, மணமகள் ராணி."
        reading: "maṇamakaṉ rājā, maṇamakaḷ rāṇi."
        ipa: "maɳamakan ɾaːdʒaː maɳamakaɭ ɾaːɳi"
      - text: "திருமணம் ஞாயிறு காலை ஒன்பது மணிக்கு."
        reading: "tirumaṇam ñāyiṟu kālai oṉpatu maṇikku."
        ipa: "t̪iɾumaɳam ɲaːjiru kaːlai onpat̪u maɳikku"
      - text: "மண்டபம் ரயில்நிலையம் பக்கத்தில் இருக்கிறது."
        reading: "maṇṭapam rayilnilaiyam pakkattil irukkiṟatu."
        ipa: "maɳʈapam ɾajilnilaijam pakkat̪t̪il iɾukkirat̪u"
      - text: "எல்லோரும் குடும்பத்துடன் வாருங்கள்."
        reading: "ellōrum kuṭumpattuṭaṉ vāruṅkaḷ."
        ipa: "elloːɾum kuʈumpat̪t̪uʈan ʋaːɾuŋkaɭ"
      - text: "மதியம் விருந்து உண்டு."
        reading: "matiyam viruntu uṇṭu."
        ipa: "mat̪ijam ʋiɾunt̪u uɳʈu"
