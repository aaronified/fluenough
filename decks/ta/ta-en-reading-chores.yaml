passages:
  - id: "ta-chore-list"
    title: "The chore list"
    sentences:
      - text: "திங்கள் தரை பெருக்கு."
        reading: "tiṅkaḷ tarai perukku."
        ipa: "t̪iŋkaɭ t̪aɾai peɾukku"
      - text: "புதன் துணி துவை."
        reading: "putaṉ tuṇi tuvai."
        ipa: "put̪an t̪uɳi t̪uʋai"
      - text: "வெள்ளி பாத்திரம் கழுவு."
        reading: "veḷḷi pāttiram kaḻuvu."
        ipa: "ʋeɭɭi paːt̪t̪iɾam kaɻuʋu"
      - text: "ஞாயிறு அலமாரி அடுக்கு."
        reading: "ñāyiṟu alamāri aṭukku."
        ipa: "ɲaːjiru alamaːɾi aʈukku"
    questions:
      - id: "ta-9932"
        prompt: { en: "What is done on Wednesday?" }
        options:
          - { en: "The clothes are washed" }
          - { en: "The floor is swept" }
          - { en: "The cupboard is tidied" }
        answer: 1
      - id: "ta-9933"
        prompt: { en: "On which day is the floor swept?" }
        options:
          - { en: "Monday" }
          - { en: "Friday" }
          - { en: "Sunday" }
        answer: 1
      - id: "ta-9934"
        prompt: { en: "The dishes are washed on Friday." }
        answer: true
