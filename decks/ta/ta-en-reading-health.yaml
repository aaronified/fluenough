passages:
  - id: "ta-clinic-notice"
    title: "Notice at the clinic"
    theme: "health"
    sentences:
      - text: "மருத்துவர் காலையில் பத்து மணிக்கு வருகிறார்."
        reading: "maruttuvar kālaiyil pattu maṇikku varukiṟār."
        ipa: "maɾut̪t̪uʋaɾ kaːlaijil pat̪t̪u maɳikku ʋaɾukiraːɾ"
      - text: "நோயாளிகள் இங்கே சீட்டு வாங்குங்கள்."
        reading: "nōyāḷikaḷ iṅkē cīṭṭu vāṅkuṅkaḷ."
        ipa: "noːjaːɭikaɭ iŋkeː siːʈʈu ʋaːŋkuŋkaɭ"
      - text: "மருந்தை மருந்தகத்தில் வாங்கலாம்."
        reading: "maruntai maruntakattil vāṅkalām."
        ipa: "maɾunt̪ai maɾunt̪akat̪t̪il ʋaːŋkalaːm"
      - text: "முகக்கவசம் போடுங்கள்."
        reading: "mukakkavacam pōṭuṅkaḷ."
        ipa: "mukakkaʋasam poːʈuŋkaɭ"
      - text: "புகைபிடிக்க வேண்டாம்."
        reading: "pukaipiṭikka vēṇṭām."
        ipa: "pukaipiʈikka ʋeːɳʈaːm"
    questions:
      - id: "ta-5200"
        prompt: { "en": "What time does the doctor come?" }
