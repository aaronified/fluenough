    bases: "self"
    examples:
      - target: "வீடு சின்னது, ஆனாலும் அழகானது."
        reading: "vīṭu ciṉṉatu, āṉālum aḻakāṉatu."
        ipa: "ʋiːʈu sinnat̪u aːnaːlum aɻakaːnat̪u"
        bases: [{ word: "வீடு", ref: "ta-0009" }, { word: "சின்னது", base: "சின்ன", reading: "ciṉṉa" }, { word: "ஆனாலும்", base: "ஆனாலும்", reading: "āṉālum" }, { word: "அழகானது", base: "அழகான", reading: "aḻakāṉa" }]
      - target: "நேரம் இல்லை, ஆனாலும் வருகிறேன்."
        reading: "nēram illai, āṉālum varukiṟēṉ."
        ipa: "neːɾam illai aːnaːlum ʋaɾukireːn"
        bases: [{ word: "நேரம்", ref: "ta-0155" }, { word: "இல்லை", ref: "ta-0002" }, { word: "ஆனாலும்", base: "ஆனாலும்", reading: "āṉālum" }, { word: "வருகிறேன்", base: "வா", reading: "vā" }]

