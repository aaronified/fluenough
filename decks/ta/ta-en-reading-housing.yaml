passages:
  - id: "ta-rental-terms"
    title: "Terms of a rented house"
    sentences:
      - text: "வீடு வாடகைக்கு உண்டு."
        reading: "vīṭu vāṭakaikku uṇṭu."
        ipa: "ʋiːʈu ʋaːʈakaikku uɳʈu"
      - text: "இரண்டு படுக்கையறை இருக்கிறது."
        reading: "iraṇṭu paṭukkaiyaṟai irukkiṟatu."
        ipa: "iɾaɳʈu paʈukkaijarai iɾukkirat̪u"
      - text: "மாதம் வாடகை பத்து ஆயிரம் ரூபாய்."
        reading: "mātam vāṭakai pattu āyiram rūpāy."
        ipa: "maːt̪am ʋaːʈakai pat̪t̪u aːjiɾam ɾuːpaːj"
      - text: "மின்கட்டணம் வாடகைதாரர் கொடுக்கிறார்."
        reading: "miṉkaṭṭaṇam vāṭakaitārar koṭukkiṟār."
        ipa: "minkaʈʈaɳam ʋaːʈakait̪aːɾaɾ koʈukkiraːɾ"
      - text: "நிறுத்துமிடம் இல்லை."
        reading: "niṟuttumiṭam illai."
        ipa: "nirut̪t̪umiʈam illai"
