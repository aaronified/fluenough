# Topics a learner of Tamil would search for: what each one is, and the decks that teach it (wiki/Plan-Deck-Kinds-And-Topics.md, D6).
# A script topic lists its characters, each with its reading as the script deck gives it; a topic holds no card text of its own.
schema: 1
kind: "topics"
id: "ta-topics"
language: "ta"
license: "CC-BY-SA-4.0"
topics:
  - id: "ta-vowels-script"
    name: { en: "Tamil vowels" }
    summary: { en: "The twelve Tamil vowel letters written on their own, five short and long pairs of a, i, u, e and o, with the diphthongs ai and au." }
    kind: "script"
    level: "A1"
    decks: ["ta-script-vowels"]
    chars: [{ text: "அ", reading: "a" }, { text: "ஆ", reading: "ā" }, { text: "இ", reading: "i" }, { text: "ஈ", reading: "ī" }, { text: "உ", reading: "u" }, { text: "ஊ", reading: "ū" }, { text: "எ", reading: "e" }, { text: "ஏ", reading: "ē" }, { text: "ஐ", reading: "ai" }, { text: "ஒ", reading: "o" }, { text: "ஓ", reading: "ō" }, { text: "ஔ", reading: "au" }]
  - id: "ta-consonants-script"
    name: { en: "Tamil consonants" }
    summary: { en: "The eighteen Tamil consonant letters, each written with the a vowel built in, from ka to na, including the retroflex, the ழ (ḻa) and the two r letters ர (ra) and ற (ṟa)." }
    kind: "script"
    level: "A1"
    decks: ["ta-script-consonants"]
    chars: [{ text: "க", reading: "ka" }, { text: "ங", reading: "ṅa" }, { text: "ச", reading: "ca" }, { text: "ஞ", reading: "ña" }, { text: "ட", reading: "ṭa" }, { text: "ண", reading: "ṇa" }, { text: "த", reading: "ta" }, { text: "ந", reading: "na" }, { text: "ப", reading: "pa" }, { text: "ம", reading: "ma" }, { text: "ய", reading: "ya" }, { text: "ர", reading: "ra" }, { text: "ல", reading: "la" }, { text: "வ", reading: "va" }, { text: "ழ", reading: "ḻa" }, { text: "ள", reading: "ḷa" }, { text: "ற", reading: "ṟa" }, { text: "ன", reading: "ṉa" }]
  - id: "ta-vowel-signs-script"
    name: { en: "Vowel signs and the pulli" }
    summary: { en: "The marks written around a consonant to change its vowel, shown on க (ka), and the dot called the pulli that removes the vowel, as in க் (k); the aytam ஃ (ḵ) is taught with them." }
    kind: "script"
    level: "A1"
    decks: ["ta-script-vowel-signs"]
    chars: [{ text: "கா", reading: "kā" }, { text: "கி", reading: "ki" }, { text: "கீ", reading: "kī" }, { text: "கு", reading: "ku" }, { text: "கூ", reading: "kū" }, { text: "கெ", reading: "ke" }, { text: "கே", reading: "kē" }, { text: "கை", reading: "kai" }, { text: "கொ", reading: "ko" }, { text: "கோ", reading: "kō" }, { text: "கௌ", reading: "kau" }, { text: "க்", reading: "k" }, { text: "ஃ", reading: "ḵ" }]
  - id: "ta-grantha-script"
    name: { en: "Grantha letters" }
    summary: { en: "The five extra letters Tamil writes for sounds of Sanskrit and other languages, ஜ (ja), ஷ (ṣa), ஸ (sa), ஹ (ha) and the cluster க்ஷ (kṣa)." }
    kind: "script"
    level: "A1"
    decks: ["ta-script-grantha"]
    chars: [{ text: "ஜ", reading: "ja" }, { text: "ஷ", reading: "ṣa" }, { text: "ஸ", reading: "sa" }, { text: "ஹ", reading: "ha" }, { text: "க்ஷ", reading: "kṣa" }]
  - id: "ta-digits-script"
    name: { en: "Tamil digits" }
    summary: { en: "The ten Tamil digits, 0 to 9, each with the number it stands for." }
    kind: "script"
    level: "A1"
    decks: ["ta-script-digits"]
    chars: [{ text: "௦", reading: "0" }, { text: "௧", reading: "1" }, { text: "௨", reading: "2" }, { text: "௩", reading: "3" }, { text: "௪", reading: "4" }, { text: "௫", reading: "5" }, { text: "௬", reading: "6" }, { text: "௭", reading: "7" }, { text: "௮", reading: "8" }, { text: "௯", reading: "9" }]
  - id: "ta-reading-practice"
    name: { en: "Reading whole words" }
    summary: { en: "Fourteen everyday words to sound out in Tamil script, such as அம்மா (ammā) and வணக்கம் (vaṇakkam), pairing short and long vowels and the doubled consonants." }
    kind: "script"
    level: "A1"
    decks: ["ta-script-reading"]
  - id: "ta-sound-pairs"
    name: { en: "Sounds English lacks" }
    summary: { en: "Five pairs of words that Tamil tells apart by one sound: a dental and a retroflex t, short and long vowels, a short and a long e, and a plain and a trilled r." }
    kind: "other"
    level: "A1"
    decks: ["ta-sound-differences"]
  - id: "ta-word-order"
    name: { en: "Word order and what Tamil leaves out" }
    summary: { en: "The verb comes last, there is no word for the, ஒரு (oru) stands for a, and the doer comes first and the thing next; the first things an English speaker notices." }
    term: { text: "ஒரு", reading: "oru" }
    kind: "grammar"
    level: "A1"
    decks: ["ta-grammar-differences", "ta-grammar-sentences", "ta-grammar-articles"]
  - id: "ta-noun-cases"
    name: { en: "Noun endings and cases" }
    summary: { en: "The plural and the endings that mean to, in, at a person, from, with and of, and the oblique stem that comes before them, taught on every noun of the course, with -ஆல் (-āl) for by and with." }
    kind: "grammar"
    level: "A1"
    decks: ["ta-grammar-noun-forms", "ta-grammar-al", "ta-grammar-postpositions"]
  - id: "ta-gender-number"
    name: { en: "Gender, number and the verb ending" }
    summary: { en: "Which verb ending a man, a woman, a respected person, a thing, an animal or a group takes, and how nouns make their plural." }
    kind: "grammar"
    level: "A1"
    decks: ["ta-grammar-nouns", "ta-grammar-gender-number"]
  - id: "ta-pronouns"
    name: { en: "Pronouns and the two words for we" }
    summary: { en: "I, you, he, she, it, we and they, how they change before a noun, and the two words for we: நாம் (nām) with the listener and நாங்கள் (nāṅkaḷ) without." }
    kind: "grammar"
    level: "A1"
    decks: ["ta-grammar-pronouns", "ta-grammar-pronoun-forms", "ta-grammar-inclusive-we"]
  - id: "ta-demonstratives"
    name: { en: "This, that and which" }
