    kind: "grammar"
    level: "A1"
    decks: ["ta-grammar-demonstratives"]
  - id: "ta-to-be"
    name: { en: "To be and not to be" }
    summary: { en: "Is, was and will be with இரு (iru), no verb at all between two nouns, and இல்லை (illai) for not." }
    term: { text: "இல்லை", reading: "illai" }
    kind: "grammar"
    level: "A1"
    decks: ["ta-grammar-be"]
  - id: "ta-present-tense"
    name: { en: "Present tense and the continuous" }
    summary: { en: "I go, you go, she goes, and I am going, for every verb of the course, with the common spoken form before the written one where the verb is regular." }
    kind: "grammar"
    level: "A1"
    decks: ["ta-grammar-verb-present", "ta-grammar-continuous"]
  - id: "ta-past-tense"
    name: { en: "Past tense and has done" }
    summary: { en: "I did, you did, he did, and has done and had done, for every verb of the course, with the spoken form before the written one." }
    kind: "grammar"
    level: "A2"
    decks: ["ta-grammar-past", "ta-grammar-past-more"]
  - id: "ta-future-tense"
    name: { en: "Future tense" }
    summary: { en: "I will go, she will come: what will happen." }
    kind: "grammar"
    level: "A1"
    decks: ["ta-grammar-future"]
  - id: "ta-negation"
    name: { en: "Saying no to a verb" }
