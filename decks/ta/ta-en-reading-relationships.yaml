passages:
  - id: "ta-thank-you-note"
    title: "A thank-you note"
    theme: "relationships"
    sentences:
      - text: "அன்புள்ள சிநேகிதிக்கு, நன்றி."
        reading: "aṉpuḷḷa cinēkitikku, naṉṟi."
        ipa: "anpuɭɭa sineːkit̪ikku nanri"
      - text: "உன் உதவிக்கு நன்றி."
        reading: "uṉ utavikku naṉṟi."
        ipa: "un ut̪aʋikku nanri"
      - text: "உன் அக்கறை எனக்குத் தெரியும்."
        reading: "uṉ akkaṟai eṉakkut teriyum."
        ipa: "un akkarai enakkut̪ t̪eɾijum"
      - text: "நல்ல நட்பு பெரிய பரிசு."
        reading: "nalla naṭpu periya paricu."
        ipa: "nalla naʈpu peɾija paɾisu"
      - text: "அடுத்த வாரம் வீட்டுக்கு வா, விருந்து உண்டு."
        reading: "aṭutta vāram vīṭṭukku vā, viruntu uṇṭu."
        ipa: "aʈut̪t̪a ʋaːɾam ʋiːʈʈukku ʋaː ʋiɾunt̪u uɳʈu"
    questions:
      - id: "ta-5258"
        prompt: { "en": "Who is the note written to?" }
