    sentences:
      - text: "இது ஒரு நல்ல திரைப்படம்."
        reading: "itu oru nalla tiraippaṭam."
        ipa: "it̪u oɾu nalla t̪iɾaippaʈam"
      - text: "கதாநாயகன் நடிப்பு அருமை."
        reading: "katānāyakaṉ naṭippu arumai."
        ipa: "kat̪aːnaːjakan naʈippu aɾumai"
      - text: "பாடல்கள் நன்றாக இருக்கின்றன."
        reading: "pāṭalkaḷ naṉṟāka irukkiṉṟaṉa."
        ipa: "paːʈalkaɭ nanraːka iɾukkinrana"
      - text: "வேடிக்கையான காட்சிகள் உண்டு."
        reading: "vēṭikkaiyāṉa kāṭcikaḷ uṇṭu."
        ipa: "ʋeːʈikkaijaːna kaːʈtʃikaɭ uɳʈu"
      - text: "ஆனால் முடிவு எனக்குப் பிடிக்கவில்லை."
        reading: "āṉāl muṭivu eṉakkup piṭikkavillai."
        ipa: "aːnaːl muʈiʋu enakkup piʈikkaʋillai"
