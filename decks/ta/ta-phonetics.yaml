schema: 1
kind: "phonetics"
id: "ta-phonetics"
language: "ta"
variety: "Standard Tamil, as the course's broad ipa writes it: the literary standard's regular voicing and allophones, not colloquial or dialectal speech"
description: "Rules that turn a card's broad ipa into its narrow [ ] form, in order. Written for tools/derive_phonetic.py, never read by the app. Each rule applies the regular expression to the whole ipa string and replaces every match; the next rule works on the result. Only rules that are attested are here. The course's broad ipa for Tamil (tools/transcribe.py ta) writes every stop voiceless (k ʈ t̪ p, and ச as s, or tʃ after a stop or nasal and when doubled), ற as r and ர as ɾ, both ந and ன as a plain n, the retroflexes (ʈ ɳ ɭ ɻ), the dental t̪, vowel length (ː) and geminates (doubled letters), and the nasal before a stop by its letter (ங் ŋ, ஞ் ɲ, ண் ɳ, ம் m). So the rules add what it does not say: the dental nasal (ta-n-dental, first), the geminate and post-nasal ற (ta-rr-geminate-trill, ta-nr-post-nasal), the voicing of the stops between vowels (ta-velar, ta-retroflex, ta-dental, ta-labial -voiced-medial) and after a nasal (the five -voiced-post-nasal rules, the palatal one writing dʒ), and the unrounded word-final u (ta-u-final, last). Where a source lists a stop and a fricative or flap variant (ɡ ~ ɣ ~ h, ɖ ~ ɽ, d̪ ~ ð, b ~ β), the stop is written, as the first form both sources list. Sources: Wikipedia, Tamil phonology and Help:IPA/Tamil (CC BY-SA 4.0), both fetched 2026-11-23 (raw wikitext, read in full); Wiktionary's narrow Tamil forms (kaikki.org dump of 2026-10-30) were read as a check, not as a source: see tools/phonetic_languages.yaml, entry ta. Left out, on purpose, and why: (0) the alveolar n that en.wiktionary's narrow forms write at the start of a word (நாடு [näːɖɯ], நான் [näːn]) against the dental that both Wikipedia pages give (ta-n-dental follows Wikipedia, two pages against one); (1) voicing after a liquid or glide (r l ɭ ɻ j ʋ + stop): the page's prose says stops are voiced 'otherwise' but Help:IPA/Tamil writes கற்க with a voiceless k, so the two sources disagree and nothing is written; a cluster of two stops (ʈp, kt) stays voiceless by the same sentence; (2) the voicing of a doubled stop, which stays voiceless, and the geminate ச (tʃtʃ), whose [tːʃ] is tagged citation-needed; (3) ச between vowels, already s in the broad ipa, and the variation of initial ச between tʃ and s, which depends on the speaker and the word; (4) the lenition of intervocalic k, ʈ, t̪, p to ɣ h ɽ ð β, which the sources list as variants; (5) the lowering of i u to e o beside a, the retraction of ii and ee before retroflexes, the rounding of i e after a labial, vowel harmony, nasalised vowels for a final vowel + nasal, the epenthetic u after a final consonant, the deletion of intervocalic k ʋ and of a final glide, and the merger of ழ with ள or ய: all are colloquial or dialect-bound and some are called vulgar by the page; (6) the central [ä] and the offglide of ai and au ([aɪ̯] on one page, [ɐi̯] on another; Help:IPA/Tamil writes plain a): no source agrees on a narrow form of them; (7) the merger of ற்ற and ன்ற with த்த and ன்ன in most spoken Indian dialects (note 4 of the page), and the Sri Lankan variants (aspirated initial stops, ð, [tt nd]); (8) loanword sounds written with the aytam (ஃப f, ஃஜ z, ஃக x), because the broad ipa writes ஃ as x for every use and the engine, not these rules, would have to say which letter follows; and the voiced and aspirated stops of loanwords, said as in the source language. A rule left out is not a claim that it does not exist. The rules ship unreviewed: Tamil's voicing is regular in the Tolkāppiyam's literary standard, but many loanwords and some speakers keep a voiceless stop between vowels, and the word-final u of a few names and words (rāju, karu, puḻu) is a full u that the broad ipa cannot tell apart."
rules:
  - id: "ta-n-dental"
    pattern: '(?<![^\s])n|n(?=t̪)'
    replace: "n̪"
    source: "Wikipedia, Tamil phonology (CC BY-SA 4.0), fetched 2026-11-23: \"[n̪] and [n] are mostly in complementary distribution and are predictable; namely, [n̪] occurs word initially and before /t̪/, while [n] occurs everywhere else\"; Wikipedia, Help:IPA/Tamil (CC BY-SA 4.0), fetched 2026-11-23: dental [n̪] and alveolar [n] are allophones (Help examples: நயம், பந்து, நன்றி for the dental; பன்றி, சின்ன, வந்தான் for the alveolar). The broad ipa (tools/transcribe.py ta) writes both ந and ன as a plain n, and a word-initial n is always ந (no Tamil word starts with ன), so the rule writes the dental n̪ for a word-initial n and for n before t̪. The dental nasal made by compounding or sandhi (annēram) is left alone: the page says speakers may use the alveolar one there. First rule, so the post-nasal rules below can name n̪."
  - id: "ta-rr-geminate-trill"
    pattern: 'rr'
    replace: "ttr"
    source: "Wikipedia, Help:IPA/Tamil (CC BY-SA 4.0), fetched 2026-11-23, footnote on ற: ற் is [tːr] \"when geminated\" (குற்றாலம், the 'tːr' row), the t being a voiceless postalveolar stop; Wikipedia, Tamil phonology (CC BY-SA 4.0), fetched 2026-11-23, \"Tamil stop allophones\" table, Alveolar column: Geminate tːr. The broad ipa writes ற்ற as rr (the engine writes ற as r, and ர as the tap ɾ, so rr is only ற்ற); the narrow form uses the course's doubled letter for length, so tːr is written ttr. The page's note that most Indian dialects merge ற்ற with த்த is a dialect and is not taken."
  - id: "ta-nr-post-nasal"
    pattern: 'nr'
    replace: "ndr"
    source: "Wikipedia, Help:IPA/Tamil (CC BY-SA 4.0), fetched 2026-11-23, footnote on ற: ற is [dr] \"after corresponding nasal consonants\" (பன்றி, in the key's example for r); Wikipedia, Tamil phonology (CC BY-SA 4.0), fetched 2026-11-23, \"Tamil stop allophones\" table, Alveolar column: Post-nasal (d)r. The broad ipa writes ன்ற as nr (ற is r, ர is ɾ), so nr is always ன்ற. The merger of nr with nn or ɳɳ in most spoken Indian dialects (note 4 of the page) is not taken."
  - id: "ta-velar-voiced-medial"
    pattern: '(?<=[aeiouː])k(?=[aeiou])'
    replace: "ɡ"
    source: "Wikipedia, Tamil phonology (CC BY-SA 4.0), fetched 2026-11-23, section \"Consonants\": \"Stops are voiceless when at the start of a word, in a consonant cluster with another stop and when geminated. They are voiced otherwise\", and the \"Tamil stop allophones\" table (Medial and Post-nasal columns); Wikipedia, Help:IPA/Tamil (CC BY-SA 4.0), fetched 2026-11-23, key examples for the voiced sounds. Velar: Medial ɡ ~ x ~ ɣ ~ h, Post-nasal ɡ; Help examples பாகு (between vowels) and அங்கே (after a nasal) are ɡ. The fricative and h variants (\"[ɣ ~ h] by Indian Tamils\") are options and are not taken: the stop is the form both sources list first. Applies only between two vowels (a diphthong counts: it ends in a vowel letter): a geminate (kk, ʈʈ, t̪t̪, pp) and a stop beside another consonant, as in the cluster ʈtʃ of காட்சி, stay voiceless (the page: voiceless 'in a consonant cluster with another stop and when geminated')."
  - id: "ta-velar-voiced-post-nasal"
    pattern: '(?<=[mnɳŋɲ])k(?=[aeiou])'
    replace: "ɡ"
    source: "Wikipedia, Tamil phonology (CC BY-SA 4.0), fetched 2026-11-23, section \"Consonants\": \"Stops are voiceless when at the start of a word, in a consonant cluster with another stop and when geminated. They are voiced otherwise\", and the \"Tamil stop allophones\" table (Medial and Post-nasal columns); Wikipedia, Help:IPA/Tamil (CC BY-SA 4.0), fetched 2026-11-23, key examples for the voiced sounds. Velar: Medial ɡ ~ x ~ ɣ ~ h, Post-nasal ɡ; Help examples பாகு (between vowels) and அங்கே (after a nasal) are ɡ. The fricative and h variants (\"[ɣ ~ h] by Indian Tamils\") are options and are not taken: the stop is the form both sources list first. Applies after a nasal inside a word (m, n, ɳ, ŋ, ɲ, or the dental n̪ written by ta-n-dental) and before a vowel, so a stop that begins a longer cluster is left voiceless."
  - id: "ta-retroflex-voiced-medial"
    pattern: '(?<=[aeiouː])ʈ(?=[aeiou])'
    replace: "ɖ"
    source: "Wikipedia, Tamil phonology (CC BY-SA 4.0), fetched 2026-11-23, section \"Consonants\": \"Stops are voiceless when at the start of a word, in a consonant cluster with another stop and when geminated. They are voiced otherwise\", and the \"Tamil stop allophones\" table (Medial and Post-nasal columns); Wikipedia, Help:IPA/Tamil (CC BY-SA 4.0), fetched 2026-11-23, key examples for the voiced sounds. Retroflex: Medial ɖ ~ ɽ, Post-nasal ɖ; Help examples படி (between vowels) and வண்டி (after a nasal) are ɖ. The flap ɽ is an option and is not taken. Applies only between two vowels (a diphthong counts: it ends in a vowel letter): a geminate (kk, ʈʈ, t̪t̪, pp) and a stop beside another consonant, as in the cluster ʈtʃ of காட்சி, stay voiceless (the page: voiceless 'in a consonant cluster with another stop and when geminated')."
  - id: "ta-retroflex-voiced-post-nasal"
    pattern: '(?<=[mnɳŋɲ])ʈ(?=[aeiou])'
    replace: "ɖ"
    source: "Wikipedia, Tamil phonology (CC BY-SA 4.0), fetched 2026-11-23, section \"Consonants\": \"Stops are voiceless when at the start of a word, in a consonant cluster with another stop and when geminated. They are voiced otherwise\", and the \"Tamil stop allophones\" table (Medial and Post-nasal columns); Wikipedia, Help:IPA/Tamil (CC BY-SA 4.0), fetched 2026-11-23, key examples for the voiced sounds. Retroflex: Medial ɖ ~ ɽ, Post-nasal ɖ; Help examples படி (between vowels) and வண்டி (after a nasal) are ɖ. The flap ɽ is an option and is not taken. Applies after a nasal inside a word (m, n, ɳ, ŋ, ɲ, or the dental n̪ written by ta-n-dental) and before a vowel, so a stop that begins a longer cluster is left voiceless."
  - id: "ta-dental-voiced-medial"
    pattern: '(?<=[aeiouː])t̪(?=[aeiou])'
    replace: "d̪"
    source: "Wikipedia, Tamil phonology (CC BY-SA 4.0), fetched 2026-11-23, section \"Consonants\": \"Stops are voiceless when at the start of a word, in a consonant cluster with another stop and when geminated. They are voiced otherwise\", and the \"Tamil stop allophones\" table (Medial and Post-nasal columns); Wikipedia, Help:IPA/Tamil (CC BY-SA 4.0), fetched 2026-11-23, key examples for the voiced sounds. Dental: Medial d̪ ~ ð, Post-nasal d̪; Help examples பந்து (after a nasal) is d̪. The fricative ð \"can very rarely occur\" and is not taken. Applies only between two vowels (a diphthong counts: it ends in a vowel letter): a geminate (kk, ʈʈ, t̪t̪, pp) and a stop beside another consonant, as in the cluster ʈtʃ of காட்சி, stay voiceless (the page: voiceless 'in a consonant cluster with another stop and when geminated')."
  - id: "ta-dental-voiced-post-nasal"
    pattern: '(?:(?<=[mnɳŋɲ])|(?<=n̪))t̪(?=[aeiou])'
    replace: "d̪"
    source: "Wikipedia, Tamil phonology (CC BY-SA 4.0), fetched 2026-11-23, section \"Consonants\": \"Stops are voiceless when at the start of a word, in a consonant cluster with another stop and when geminated. They are voiced otherwise\", and the \"Tamil stop allophones\" table (Medial and Post-nasal columns); Wikipedia, Help:IPA/Tamil (CC BY-SA 4.0), fetched 2026-11-23, key examples for the voiced sounds. Dental: Medial d̪ ~ ð, Post-nasal d̪; Help examples பந்து (after a nasal) is d̪. The fricative ð \"can very rarely occur\" and is not taken. Applies after a nasal inside a word (m, n, ɳ, ŋ, ɲ, or the dental n̪ written by ta-n-dental) and before a vowel, so a stop that begins a longer cluster is left voiceless."
  - id: "ta-labial-voiced-medial"
    pattern: '(?<=[aeiouː])p(?=[aeiou])'
    replace: "b"
    source: "Wikipedia, Tamil phonology (CC BY-SA 4.0), fetched 2026-11-23, section \"Consonants\": \"Stops are voiceless when at the start of a word, in a consonant cluster with another stop and when geminated. They are voiced otherwise\", and the \"Tamil stop allophones\" table (Medial and Post-nasal columns); Wikipedia, Help:IPA/Tamil (CC BY-SA 4.0), fetched 2026-11-23, key examples for the voiced sounds. Labial: Medial b ~ β, Post-nasal b; Help examples தம்பி, அன்பு (after a nasal) and ஆபத்து are b. The fricative β is an option and is not taken. Applies only between two vowels (a diphthong counts: it ends in a vowel letter): a geminate (kk, ʈʈ, t̪t̪, pp) and a stop beside another consonant, as in the cluster ʈtʃ of காட்சி, stay voiceless (the page: voiceless 'in a consonant cluster with another stop and when geminated')."
  - id: "ta-labial-voiced-post-nasal"
    pattern: '(?<=[mnɳŋɲ])p(?=[aeiou])'
    replace: "b"
    source: "Wikipedia, Tamil phonology (CC BY-SA 4.0), fetched 2026-11-23, section \"Consonants\": \"Stops are voiceless when at the start of a word, in a consonant cluster with another stop and when geminated. They are voiced otherwise\", and the \"Tamil stop allophones\" table (Medial and Post-nasal columns); Wikipedia, Help:IPA/Tamil (CC BY-SA 4.0), fetched 2026-11-23, key examples for the voiced sounds. Labial: Medial b ~ β, Post-nasal b; Help examples தம்பி, அன்பு (after a nasal) and ஆபத்து are b. The fricative β is an option and is not taken. Applies after a nasal inside a word (m, n, ɳ, ŋ, ɲ, or the dental n̪ written by ta-n-dental) and before a vowel, so a stop that begins a longer cluster is left voiceless."
  - id: "ta-palatal-voiced-post-nasal"
    pattern: '(?:(?<=[mnɳŋɲ])|(?<=n̪))tʃ(?=[aeiou])'
    replace: "dʒ"
    source: "Wikipedia, Tamil phonology (CC BY-SA 4.0), fetched 2026-11-23, section \"Consonants\": \"Stops are voiceless when at the start of a word, in a consonant cluster with another stop and when geminated. They are voiced otherwise\", and the \"Tamil stop allophones\" table (Medial and Post-nasal columns); Wikipedia, Help:IPA/Tamil (CC BY-SA 4.0), fetched 2026-11-23, key examples for the voiced sounds. Palatal: Post-nasal dʑ ~ dʒ; Help examples இஞ்சி (after ஞ்) and ஜானகி are dʒ; note 5 of the page: ɲtʃ is always [n̠ʲdʒ]. The broad ipa writes ச as tʃ after a stop or nasal and when doubled, and as s otherwise, so tʃ after a nasal and before a vowel becomes dʒ. The alveolo-palatal ʑ variant is an option and is not taken. The geminate tʃtʃ stays as it is (the page's [tːʃ] carries a citation-needed tag and Help writes tɕ). ச between vowels is already s in the broad ipa (\"the letters ச and ற ... are pronounced medially as [s] and [r]\")."
  - id: "ta-u-final"
    pattern: '(?<=[^aeiouː\sɯ])u(?!ː)(?=\s|$)'
    replace: "ɯ"
    source: "Wikipedia, Tamil phonology (CC BY-SA 4.0), fetched 2026-11-23, section \"Vowels\": \"Word final /u/ is pronounced as [ɯ~ɨ], it is called a குற்றியலுகரம் (kuṟṟiyalukaram) ... and it is unrounded even in literary Tamil\"; and \"Elision\", item 1: kuṟṟiyal ukaram is \"the vowel /u/ turning into the close back unrounded vowel [ɯ] at the end of words (e.g. 'āṟu' ... will be pronounced [aːrɯ])\". Applies to a short u that ends a word after a consonant (so not uː, and not a vowel + u). The page notes that a final full [u] occurs in some names and a few words of the shape (C)VCu (rāju, karu, puḻu); the broad ipa cannot tell those words, so they are narrowed too, and the cards that have such a word are for a reviewer. Runs last: the voicing rules above name u as a vowel."
