  - id: "ta-train-timetable"
    title: "A train timetable"
    sentences:
      - text: "சென்னை ரயில் காலை ஆறு மணிக்கு புறப்படுகிறது."
        reading: "ceṉṉai rayil kālai āṟu maṇikku puṟappaṭukiṟatu."
        ipa: "sennai ɾajil kaːlai aːru maɳikku purappaʈukirat̪u"
      - text: "அடுத்த ரயில் மதியம் ஒரு மணிக்கு புறப்படுகிறது."
        reading: "aṭutta rayil matiyam oru maṇikku puṟappaṭukiṟatu."
        ipa: "aʈut̪t̪a ɾajil mat̪ijam oɾu maɳikku purappaʈukirat̪u"
      - text: "நடைமேடை இரண்டு."
        reading: "naṭaimēṭai iraṇṭu."
        ipa: "naʈaimeːʈai iɾaɳʈu"
      - text: "இன்று ரயில் தாமதம்."
        reading: "iṉṟu rayil tāmatam."
        ipa: "inru ɾajil t̪aːmat̪am"
      - text: "பயணச்சீட்டு வாங்குங்கள்."
        reading: "payaṇaccīṭṭu vāṅkuṅkaḷ."
        ipa: "pajaɳatʃtʃiːʈʈu ʋaːŋkuŋkaɭ"
