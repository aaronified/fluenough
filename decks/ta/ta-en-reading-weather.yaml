passages:
  - id: "ta-weather-message"
    title: "A message about the weather"
    sentences:
      - text: "இன்று மேகமூட்டம்."
        reading: "iṉṟu mēkamūṭṭam."
        ipa: "inru meːkamuːʈʈam"
      - text: "நாளை காலை மழை பெய்யும்."
        reading: "nāḷai kālai maḻai peyyum."
        ipa: "naːɭai kaːlai maɻai pejjum"
      - text: "மாலையில் வெயில்."
        reading: "mālaiyil veyil."
        ipa: "maːlaijil ʋejil"
      - text: "இரவில் ரொம்ப குளிர்."
        reading: "iravil rompa kuḷir."
        ipa: "iɾaʋil ɾompa kuɭiɾ"
      - text: "குடை எடுத்துப் போ."
        reading: "kuṭai eṭuttup pō."
        ipa: "kuʈai eʈut̪t̪up poː"
    questions:
      - id: "ta-9903"
        prompt: { en: "When will it rain?" }
        options:
          - { en: "Tomorrow morning" }
          - { en: "Tomorrow evening" }
          - { en: "Tomorrow night" }
        answer: 1
      - id: "ta-9904"
        prompt: { en: "What should you take with you?" }
        options:
          - { en: "A coat" }
          - { en: "An umbrella" }
          - { en: "A hat" }
        answer: 2
      - id: "ta-9905"
        prompt: { en: "It is very cold at night." }
        answer: true
