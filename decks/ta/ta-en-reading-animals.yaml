passages:
  - id: "ta-zoo-board"
    title: "A zoo board"
    sentences:
      - text: "யானை பெரியது."
        reading: "yāṉai periyatu."
        ipa: "jaːnai peɾijat̪u"
      - text: "குரங்கு மேலே இருக்கிறது."
        reading: "kuraṅku mēlē irukkiṟatu."
        ipa: "kuɾaŋku meːleː iɾukkirat̪u"
      - text: "பாம்பு கீழே போகிறது."
        reading: "pāmpu kīḻē pōkiṟatu."
        ipa: "paːmpu kiːɻeː poːkirat̪u"
      - text: "நாய் இறைச்சி சாப்பிடுகிறது."
        reading: "nāy iṟaicci cāppiṭukiṟatu."
        ipa: "naːj iraitʃtʃi saːppiʈukirat̪u"
    questions:
      - id: "ta-9771"
        prompt: { en: "Which animal is big?" }
        options:
          - { en: "The elephant" }
          - { en: "The dog" }
          - { en: "The snake" }
        answer: 1
      - id: "ta-9772"
        prompt: { en: "Where is the monkey?" }
        options:
          - { en: "Above" }
          - { en: "Below" }
          - { en: "Outside" }
        answer: 1
      - id: "ta-9773"
        prompt: { en: "The snake is going up." }
        answer: false
      - id: "ta-9774"
        prompt: { en: "What does the dog eat?" }
        options:
          - { en: "Fruit" }
          - { en: "Meat" }
          - { en: "Rice" }
        answer: 2
