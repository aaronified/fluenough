passages:
  - id: "ta-habit-survey"
    title: "A habit survey"
    sentences:
      - text: "நான் எப்போதும் தமிழ் படிக்கிறேன்."
        reading: "nāṉ eppōtum tamiḻ paṭikkiṟēṉ."
        ipa: "naːn eppoːt̪um t̪amiɻ paʈikkireːn"
      - text: "நான் சில சமயம் தேநீர் குடிக்கிறேன்."
        reading: "nāṉ cila camayam tēnīr kuṭikkiṟēṉ."
        ipa: "naːn sila samajam t̪eːniːɾ kuʈikkireːn"
      - text: "நான் நிறைய தண்ணீர் குடிக்கிறேன்."
        reading: "nāṉ niṟaiya taṇṇīr kuṭikkiṟēṉ."
        ipa: "naːn niraija t̪aɳɳiːɾ kuʈikkireːn"
      - text: "நாளை நான் வீட்டுக்குப் போகிறேன்."
        reading: "nāḷai nāṉ vīṭṭukkup pōkiṟēṉ."
        ipa: "naːɭai naːn ʋiːʈʈukkup poːkireːn"
    questions:
      - id: "ta-9718"
        prompt: { en: "How often does the speaker study Tamil?" }
        options:
          - { en: "Always" }
          - { en: "Sometimes" }
          - { en: "Never" }
        answer: 1
      - id: "ta-9719"
        prompt: { en: "What does the speaker drink only sometimes?" }
        options:
          - { en: "Water" }
          - { en: "Tea" }
          - { en: "Milk" }
        answer: 2
      - id: "ta-9720"
        prompt: { en: "When does the speaker go home?" }
