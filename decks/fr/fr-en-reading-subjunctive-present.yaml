  - id: "fr-wishes-and-advice"
    title: "Wishes and advice"
    theme: "relationships"
    sentences:
      - text: "Je veux que tu viennes demain."
        ipa: "ʒə vø kə ty vjɛn dəmɛ̃"
      - text: "Il faut que tu sois là à huit heures."
        ipa: "il fo kə ty swa la a ɥit œʁ"
      - text: "Il faut que nous ayons du temps."
        ipa: "il fo kə nu ɛjɔ̃ dy tɑ̃"
      - text: "Je veux que vous parliez français."
        ipa: "ʒə vø kə vu paʁlje fʁɑ̃sɛ"
    questions:
      - id: "fr-3940"
        prompt: { en: "What does the speaker want?" }
