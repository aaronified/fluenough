          - { en: "That you come tomorrow" }
          - { en: "That you leave now" }
          - { en: "That you pay" }
        answer: 1
      - id: "fr-3941"
        prompt: { en: "What is needed at eight o'clock?" }
        options:
          - { en: "Eating" }
          - { en: "Being there" }
          - { en: "Sleeping" }
        answer: 2
      - id: "fr-3942"
        prompt: { en: "What do 'we' need?" }
        options:
          - { en: "Money" }
          - { en: "A car" }
          - { en: "Time" }
        answer: 3
  - id: "fr-friendly-advice"
    title: "A friendly note"
    theme: "daily-life"
    sentences:
      - text: "Je veux que tu fasses attention."
        ipa: "ʒə vø kə ty fas atɑ̃sjɔ̃"
      - text: "Je veux que tu puisses venir."
        ipa: "ʒə vø kə ty pɥis vəniʁ"
      - text: "Il faut que tu ailles au parc."
        ipa: "il fo kə ty aj o paʁk"
      - text: "Je veux qu'il sache où je suis."
        ipa: "ʒə vø kil saʃ u ʒə sɥi"
    questions:
      - id: "fr-3943"
        prompt: { en: "What does the speaker want 'you' to do?" }
