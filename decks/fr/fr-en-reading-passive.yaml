    theme: "daily-life"
    sentences:
      - text: "La porte est fermée par mon frère."
        ipa: "la pɔʁt ɛ fɛʁme paʁ mɔ̃ fʁɛʁ"
      - text: "Le repas est préparé par ma mère."
        ipa: "lə ʁəpa ɛ pʁepaʁe paʁ ma mɛʁ"
      - text: "Ici, on parle français."
        ipa: "isi ɔ̃ paʁl fʁɑ̃sɛ"
      - text: "On prend le train à six heures."
        ipa: "ɔ̃ pʁɑ̃ lə tʁɛ̃ a si zœʁ"
