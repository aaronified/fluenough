# The order French is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner
# from English is taught fr-en-home for fr-home (ADR-0013, ADR-0036).
#
# This is also French's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"): every
# unit from the first words to B1, written or planned, with its size in
# words, its grammar topics, the three milestones, and for each planned unit
# its listening and reading passages. A unit with no deck yet is planned:
# the course teaches it as "Coming" until a deck is written. The first five
# units of A1 (phrasebook to pronouns) are written; the rest are planned. The
# owner (2026-10-30)
# has set French's A1 to be built after Bengali's, Hindustani's and
# Spanish's B1. When a unit is written, it turns into `decks` in the same
# change (the build-deck skill). Sizes follow the plan's levels (about 700,
# 900 and 1,200 words; low confidence): French is tier I
# (docs/plans/language-paths-scheme.md, x1.0), so they are not scaled, and
# the path sets no `levels:` of its own (ADR-0045: it is for languages whose
# vocabulary the fixed sizes do not fit). The units hold about 741 words for
# A1 (41 units), 830 for A2 (31 units) and 1,180 for B1 (40 units), each within half to one and a half times
# the plan's size. They are one number for every native language. A theme
# named here that decks/themes.yaml does not list yet (money, literature
# and verbs-5 today) is added to it with its first deck.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"):
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units, the sound differences first: the scheme asks
#    French for a "heavy pronunciation step (silent letters, liaison)";
# 3. no script units: French is written in Latin letters, so the path has
#    no `alphabet`. Its accents (é è ê à â î ô û ç and ë ï ü) and silent
#    letters go in the script guide (fr-script.yaml), and its sounds
#    (nasal vowels, u and ou, the French r, liaison) in the sounds file
#    (fr-sounds.yaml), when they are written; neither is a path unit, and
#    the numbers file (fr-numbers.yaml) is not one either;
# 4. a core of about 200 common words in themed units, before the large
#    tables ("Yes, smaller (~200)");
# 5. rules as forms: articles and gender (with elision), the plural,
#    adjective agreement, the one verb "to be" and "to have" (with il y a),
#    the regular present, negation and questions, prepositions and their
#    contractions, then the other verb forms, practised on the words
#    already known;
# 6. sentences, each after its words and rules; then the other themes,
#    each its words, then its rules, then its sentences.
# French's grammar keeps the Romance order of
# docs/plans/language-paths-scheme.md within each level, with the
# scheme's French adjustments: a single "to be" (etre, taught with avoir,
# which the compound past needs), and no ser/estar step. So, by the tense,
# number and gender audit of 2026-10-23 (wiki: Audit-Tense-Number-Gender):
# articles and gender, the plural right after them, adjective agreement
# (needed from the first lessons, as Spanish's is), to be and to have, the
# regular present, the irregular present, the imperatives (right after the
# present, before any past), prepositions, object pronouns (with y and
# en), reflexives, the past
# (passe compose and imparfait), the future and the conditional, the
# subjunctive, and the compound tenses. French adds the partitive, the
# near future (aller + infinitive), the two auxiliaries of the passe
# compose, and, for reading, the passe simple at B1.
#
# The core's order is by judgement, most common first: about me, everyday
# verbs, the common adverbs and function words, how much and how many,
# describing words, where things are, more verbs. It was meant to come
# from Wikipedia's counts (tools/wikipedia_frequency.py, #516): order the
# core again from the counts once they are written.
#
# French is the French of France (owner, 2026-10-30): the course and its
# TTS voice follow fr-FR. The language block's `tts: "fr-FR"` is written
# when the first deck is.
# The present progressive (en train de) is taught at A2, as Spanish's
# estar + gerund is, after the present and the near future and before the
# past tenses; the gerondif stays at B1. fr-numbers-big teaches 70 to 99
# with the quatre-vingts system in full (the 70-99 forms plus 100, 1000 and
# the like). The plural unit notes liaison on each card it affects.
#
# Every deck of French is listed exactly once.
schema: 1
kind: "path"
id: "fr-path"
language: "fr"
# The gender classes a noun's gender is one of (#512; DECK-FORMAT.md, Card data).
genders: ["m", "f"]
# Where French is spoken, for a rater's region and a card's region note
# (ADR-0036): the main varieties with their own norms of sound and word,
# each named with example places so that a rater can place themselves.
# France, Belgium, Switzerland and Quebec each have their own dictionaries
# of usage; Acadian French differs enough from Quebec's to stand apart;
# Africa, where most of French's speakers now live, is grouped as West
# Africa, Central Africa and the Maghreb, since usage differs most between
# those. France is one region: whether its south (Midi) stands apart is
# for a native reviewer. Low confidence on the grouping: a native reviewer
# checks this list before any rating names a region. The ids are
# permanent, as card ids are; rename a name, never an id. The app adds
# "Elsewhere" after them (the Caribbean, the Indian Ocean, Louisiana,
# Luxembourg and the rest).
regions:
  - id: "france"
    name: { "en": "France (Paris, Lyon, Marseille, Lille, Toulouse)" }
  - id: "belgium"
    name: { "en": "Belgium (Brussels, Wallonia: Liège, Namur, Charleroi)" }
  - id: "switzerland"
    name: { "en": "Switzerland (Romandy: Geneva, Lausanne, Neuchâtel, Fribourg)" }
  - id: "quebec"
    name: { "en": "Quebec and the rest of Canada's Laurentian French (Montreal, Quebec City, Ottawa)" }
  - id: "acadia"
    name: { "en": "Acadia (New Brunswick, Nova Scotia, Prince Edward Island)" }
  - id: "west-africa"
    name: { "en": "West Africa (Senegal, Côte d'Ivoire, Mali, Burkina Faso, Guinea, Benin, Togo)" }
  - id: "central-africa"
    name: { "en": "Central Africa (Cameroon, DR Congo, Republic of the Congo, Gabon)" }
  - id: "maghreb"
    name: { "en": "The Maghreb (Morocco, Algeria, Tunisia)" }
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  # 1. The phrasebook, taught whole from the first lesson, with the first
  # words beside it: fr-phrasebook (15-25 survival phrases, which count no
  # words) and fr-first-words when written.
  - decks: ["fr-phrasebook", "fr-first-words", "*"]
    words: 10
  # 2. The first word units, the sound differences first.
  - decks: ["fr-sound-differences", "fr-sound-differences-sentences", "fr-reading-sound-differences", "*"]
    words: 16
  - decks: ["fr-questions", "fr-questions-sentences", "fr-reading-questions", "*"]
    words: 15
  - decks: ["fr-addressing", "fr-addressing-sentences", "fr-reading-addressing", "*"]
    words: 15
  - decks: ["fr-pronouns", "fr-pronouns-sentences", "fr-reading-pronouns", "*"]
    words: 20
  - decks: ["fr-family", "fr-family-sentences", "fr-reading-family", "*"]
    words: 30
  - decks: ["fr-numbers-1-20", "fr-numbers-1-20-sentences", "fr-reading-numbers-1-20", "*"]
    words: 20
  # 3. No script units: French is written in Latin letters.
  # 4. The core: about 200 common words, most common first (by judgement
  # until the Wikipedia counts are written, #516).
  - decks: ["fr-about-me", "fr-about-me-sentences", "fr-reading-about-me", "*"]
    words: 25
  - decks: ["fr-everyday-verbs", "fr-everyday-verbs-sentences", "fr-reading-everyday-verbs", "*"]
    words: 30
  - decks: ["fr-adverbs", "fr-adverbs-sentences", "fr-reading-adverbs", "*"]
    words: 33
  - decks: ["fr-quantities", "fr-quantities-sentences", "fr-reading-quantities", "*"]
    words: 25
  - decks: ["fr-describing", "fr-describing-sentences", "fr-reading-describing", "*"]
    words: 41
  - decks: ["fr-location", "fr-location-sentences", "fr-reading-location", "*"]
    words: 23
  - decks: ["fr-more-verbs", "fr-more-verbs-sentences", "fr-reading-more-verbs", "*"]
    words: 30
  # 5. Rules as forms, practised on the words known: articles and gender,
  # the plural and adjective agreement first, then the verbs to be and to
  # have, the present, negation and questions, the prepositions, and the
  # imperatives.
  - decks: ["fr-articles", "fr-grammar-articles-gender", "fr-grammar-elision", "fr-reading-articles"]
    words: 4
    grammar: ["articles-gender", "elision"]
  - decks: ["fr-grammar-plural", "fr-grammar-liaison", "fr-reading-plural"]
    words: 0
    grammar: ["plural", "liaison"]
  - decks: ["fr-grammar-adjective-agreement", "fr-grammar-adjective-position", "fr-reading-adjectives"]
    words: 0
    grammar: ["adjective-agreement", "adjective-position"]
  - decks: ["fr-grammar-etre", "fr-grammar-avoir", "fr-grammar-il-y-a", "fr-reading-etre-avoir"]
    words: 0
    grammar: ["etre", "avoir", "il-y-a"]
  - decks: ["fr-grammar-present-er", "fr-reading-present-er"]
    words: 0
    grammar: ["present-er"]
  - decks: ["fr-grammar-ne-pas", "fr-reading-negation"]
    words: 0
    grammar: ["ne-pas"]
  - decks: ["fr-grammar-est-ce-que", "fr-grammar-inversion", "fr-reading-grammar-questions"]
    words: 0
    grammar: ["est-ce-que", "inversion"]
  - decks: ["fr-prepositions", "fr-grammar-prepositions", "fr-grammar-au-du-contractions", "fr-reading-prepositions"]
    words: 8
    grammar: ["prepositions", "au-du-contractions"]
  - decks: ["fr-grammar-present-ir", "fr-grammar-present-re", "fr-reading-present-ir-re"]
    words: 0
    grammar: ["present-ir", "present-re"]
  - decks: ["fr-grammar-present-irregular", "fr-reading-present-irregular"]
    words: 0
    grammar: ["present-irregular"]
  - decks: ["fr-grammar-imperatives", "fr-reading-imperatives"]
    words: 0
    grammar: ["imperatives"]
  # 6. Then the other A1 themes, each its words, its rules, then its
  # sentences.
  - decks: ["fr-work", "fr-work-sentences", "fr-reading-work", "*"]
    words: 30
  - decks: ["fr-possessives", "fr-grammar-possessives", "fr-reading-possessives"]
