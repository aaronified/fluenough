        "je": "j'avais pris"
        "tu": "tu avais pris"
        "il-elle": "il avait pris"
        "nous": "nous avions pris"
        "vous": "vous aviez pris"
        "ils-elles": "ils avaient pris"
    - lemma: "aller"
      ipa: "ale"
      forms:
        "je": ["j'étais allé", "j'étais allée"]
        "tu": ["tu étais allé", "tu étais allée"]
        "il-elle": ["il était allé", "elle était allée"]
        "nous": ["nous étions allés", "nous étions allées"]
        "vous": ["vous étiez allé", "vous étiez allée", "vous étiez allés", "vous étiez allées"]
        "ils-elles": ["ils étaient allés", "elles étaient allées"]
