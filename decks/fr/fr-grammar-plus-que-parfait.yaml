pattern:
  slots: ["je", "tu", "il-elle", "nous", "vous", "ils-elles"]
  entries:
    - lemma: "manger"
      ipa: "mɑ̃ʒe"
      forms:
        "je": "j'avais mangé"
        "tu": "tu avais mangé"
        "il-elle": "il avait mangé"
        "nous": "nous avions mangé"
        "vous": "vous aviez mangé"
        "ils-elles": "ils avaient mangé"
    - lemma: "finir"
      ipa: "finiʁ"
      forms:
        "je": "j'avais fini"
        "tu": "tu avais fini"
        "il-elle": "il avait fini"
        "nous": "nous avions fini"
        "vous": "vous aviez fini"
        "ils-elles": "ils avaient fini"
    - lemma: "attendre"
      ipa: "atɑ̃dʁ"
      forms:
        "je": "j'avais attendu"
        "tu": "tu avais attendu"
        "il-elle": "il avait attendu"
        "nous": "nous avions attendu"
        "vous": "vous aviez attendu"
        "ils-elles": "ils avaient attendu"
    - lemma: "faire"
      ipa: "fɛʁ"
      forms:
        "je": "j'avais fait"
        "tu": "tu avais fait"
        "il-elle": "il avait fait"
        "nous": "nous avions fait"
        "vous": "vous aviez fait"
        "ils-elles": "ils avaient fait"
    - lemma: "voir"
      ipa: "vwaʁ"
