        "tu": ["tu étais parti", "tu étais partie"]
        "il-elle": ["il était parti", "elle était partie"]
        "nous": ["nous étions partis", "nous étions parties"]
        "vous": ["vous étiez parti", "vous étiez partie", "vous étiez partis", "vous étiez parties"]
        "ils-elles": ["ils étaient partis", "elles étaient parties"]
