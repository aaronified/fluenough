        "vous": ["vous étiez arrivé", "vous étiez arrivée", "vous étiez arrivés", "vous étiez arrivées"]
        "ils-elles": ["ils étaient arrivés", "elles étaient arrivées"]
    - lemma: "partir"
      ipa: "paʁtiʁ"
      forms:
