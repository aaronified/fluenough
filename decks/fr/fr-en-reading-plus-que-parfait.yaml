  - id: "fr-police-report"
    title: "A short report"
    theme: "daily-life"
    sentences:
      - text: "Le client était parti avant la police."
        ipa: "lə klijɑ̃ etɛ paʁti avɑ̃ la pɔlis"
      - text: "J'avais vu la voiture devant la porte."
        ipa: "ʒavɛ vy la vwatyʁ dəvɑ̃ la pɔʁt"
      - text: "Les enfants avaient fait du bruit."
        ipa: "le zɑ̃fɑ̃ avɛ fɛ dy bʁɥi"
