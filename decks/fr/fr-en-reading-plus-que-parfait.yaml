  - id: "fr-it-had-already-happened"
    title: "It had already happened"
    theme: "daily-life"
    sentences:
      - text: "Quand je suis arrivé, il avait déjà mangé."
        ipa: "kɑ̃ ʒə sɥi aʁive il avɛ deʒa mɑ̃ʒe"
      - text: "Nous étions déjà partis."
        ipa: "nu zetjɔ̃ deʒa paʁti"
      - text: "Elle avait fini le travail."
        ipa: "ɛl avɛ fini lə tʁavaj"
      - text: "Ils avaient pris le train."
        ipa: "il zavɛ pʁi lə tʁɛ̃"
