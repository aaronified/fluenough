      key: "etre"
      ipa: "ɛtʁ"
      forms:
        "je": "j'étais"
        "tu": "tu étais"
        "il-elle": "il était"
        "nous": "nous étions"
        "vous": "vous étiez"
        "ils-elles": "ils étaient"
