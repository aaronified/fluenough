    theme: "stories"
    sentences:
      - text: "Il était une fois un homme."
        ipa: "il etɛ ynfwa œ̃ nɔm"
      - text: "Un jour, il partit dans la forêt."
        ipa: "œ̃ ʒuʁ il paʁti dɑ̃ la fɔʁɛ"
      - text: "Il vit une maison."
        ipa: "il vi yn mɛzɔ̃"
      - text: "Il fut content et il alla au parc."
        ipa: "il fy kɔ̃tɑ̃ e il ala o paʁk"
