        ipa: "ɛl aʁiva lə swaʁ"
      - text: "Ils parlèrent longtemps."
        ipa: "il paʁlɛʁ lɔ̃tɑ̃"
      - text: "Il prit la route et il finit son voyage."
        ipa: "il pʁi la ʁut e il fini sɔ̃ vwajaʒ"
