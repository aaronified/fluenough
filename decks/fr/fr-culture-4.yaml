# A culture deck of French-language texts from the eighteenth to the early twentieth century that are in the public domain:
# one opening line each, with its source, its rights basis and its creator (wiki/Plan-Deck-Kinds-And-Topics.md). Built from French
# Wikipedia and French Wikisource pages only, read there. Seventeen items (fr-4250 to fr-4266; fr-4267 to fr-4299 unused). Dropped, with the
# reason read on the page: the traditional songs (Frère Jacques, Au clair de la lune, Sur le pont d'Avignon, Il était un petit navire, À la claire
# fontaine: no first printing before 1900 read on a page; À la claire fontaine is from a 1922 book); Le Temps des cerises (no text on the page);
# Anatole France, Le Crime de Sylvestre Bonnard (chapter I has no text on Wikisource); Colette (no text found); Péguy and Apollinaire and Alain-Fournier
# (died in the First World War; Péguy and Apollinaire are recorded as 'mort pour la France' on their French Wikipedia pages); Jules Renard (index only).
