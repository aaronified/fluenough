# French Wikipedia and French Wikisource pages only, and read there. Partial: three of the plan's eighteen (ids fr-4250 to
# fr-4252; fr-4253 to fr-4299 unused). Dropped, with the reason read on the page: the traditional songs (Frère Jacques, Au
# clair de la lune, Sur le pont d'Avignon, A la claire fontaine, Il était un petit navire, Alouette): the Wikisource pages
# read gave no first-publication date before 1900 for a text of the song itself; La Marseillaise (no text on the page read);
# Le Temps des cerises (no text read on the page); Perrault's Cendrillon and La Belle au bois dormant (the guessed Wikisource
# page titles did not exist); Anatole France, Proust beyond the first sentence, Colette (died 1954, not searched), and
# Apollinaire and Péguy (died in the First World War: reserve items under the plan's rule).
