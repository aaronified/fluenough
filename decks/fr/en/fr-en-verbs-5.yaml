schema: 1
id: "fr-en-verbs-5"
kind: "layer"
core: "fr-verbs-5"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs 5"
license: "CC-BY-SA-4.0"
description: "Forty-five verbs for a long story: going and coming, learning and teaching, saying and answering, and the verbs that carry a story forward. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-2610":
    native: "to leave"
    notes:
      "n1": "Quitter is regular: quitter quelque chose is to leave a place or stop something."
    examples:
      "Je quitte la maison à sept heures.":
        native: "I leave the house at seven."
        bases:
          "quitte": "to leave"
          "à": "to, at"
      "Il quitte son travail en mars.":
        native: "He leaves his job in March."
        bases:
          "quitte": "to leave"
          "en": "in, by, as"
  "fr-2611":
    native: "to return, to go back"
    notes:
      "n1": "Retourner is regular: to go back to a place."
    examples:
      "Nous retournons à Paris demain.":
        native: "We go back to Paris tomorrow."
        bases:
          "retournons": "to return, to go back"
          "à": "to, at"
          "Paris": "Paris"
      "Elle retourne au travail.":
        native: "She returns to work."
        bases:
          "retourne": "to return, to go back"
          "au": "at, to the"
  "fr-2612":
    native: "to come back"
    notes:
      "n1": "Revenir is like venir: il revient, il est revenu."
    examples:
      "Il revient dans une heure.":
        native: "He comes back in an hour."
        bases:
          "revient": "to come back"
      "Elles sont revenues hier.":
        native: "They came back yesterday."
  "fr-2613":
    native: "to become"
    notes:
      "n1": "Devenir is like venir: il devient, il est devenu."
    examples:
      "Il devient professeur.":
        native: "He becomes a teacher."
        bases:
          "devient": "to become"
      "Elle est devenue très forte.":
        native: "She has become very strong."
        bases:
          "devenue": "to become"
  "fr-2614":
    native: "to lead, to take"
    notes:
      "n1": "Mener is regular: mener quelqu’un quelque part is to take someone somewhere."
    examples:
      "Il mène les enfants à l'école.":
        native: "He takes the children to school."
        bases:
          "mène": "to lead, to take"
          "enfants": "children"
          "à": "to, at"
      "Ce chemin mène au village.":
        native: "This path leads to the village."
        bases:
          "mène": "to lead, to take"
          "au": "at, to the"
          "village": "village"
  "fr-2615":
    native: "to translate"
    notes:
      "n1": "Traduire is irregular like conduire."
    examples:
      "Je traduis ce livre en anglais.":
        native: "I translate this book into English."
        bases:
          "traduis": "to translate"
          "en": "in, by, as"
      "Il traduit les lettres.":
        native: "He translates the letters."
        bases:
          "traduit": "to translate"
  "fr-2616":
    native: "to say"
    notes:
      "n1": "Dire is irregular: je dis, nous disons, vous dites."
    examples:
      "Je dis la vérité.":
        native: "I tell the truth."
        bases:
          "dis": "to say"
      "Qu'est-ce que tu dis ?":
        native: "What are you saying?"
        bases:
          "Qu'est": "what"
          "que": "that"
          "dis": "to say"
  "fr-2617":
    native: "to teach"
    notes:
      "n1": "Enseigner is regular: enseigner quelque chose à quelqu’un is to teach someone something."
    examples:
      "Il enseigne l'histoire.":
        native: "He teaches history."
        bases:
          "enseigne": "to teach"
      "Elle enseigne le piano aux enfants.":
        native: "She teaches the piano to the children."
        bases:
          "enseigne": "to teach"
          "aux": "to the"
          "enfants": "children"
  "fr-2618":
    native: "to explain"
    notes:
      "n1": "Expliquer is regular: expliquer quelque chose à quelqu’un."
    examples:
      "Explique-moi ce mot.":
        native: "Explain this word to me."
        bases:
          "Explique": "to explain"
      "Le professeur explique la règle.":
        native: "The teacher explains the rule."
        bases:
          "explique": "to explain"
  "fr-2619":
    native: "to compare"
    notes:
      "n1": "Comparer is regular: comparer à is to compare with."
    examples:
      "Je compare les deux prix.":
        native: "I compare the two prices."
        bases:
          "compare": "to compare"
      "Il compare sa vie à la mienne.":
        native: "He compares his life with mine."
        bases:
          "compare": "to compare"
          "à": "to, at"
          "mienne": "mine"
  "fr-2620":
    native: "to describe"
    notes:
      "n1": "Décrire is like écrire: je décris, nous décrivons."
    examples:
      "Elle décrit la scène.":
        native: "She describes the scene."
        bases:
          "décrit": "to describe"
      "Décrivez votre maison.":
        native: "Describe your house."
        bases:
          "Décrivez": "to describe"
  "fr-2621":
    native: "to suggest, to offer"
    notes:
      "n1": "Proposer is regular: proposer de faire is to suggest doing something."
    examples:
      "Je propose un café.":
        native: "I suggest a coffee."
        bases:
          "propose": "to suggest, to offer"
      "Elle propose de venir demain.":
        native: "She suggests coming tomorrow."
        bases:
          "propose": "to suggest, to offer"
          "de": "of, from, some"
  "fr-2622":
    native: "to stop"
    notes:
      "n1": "Arrêter is regular: arrêter de faire is to stop doing something."
    examples:
      "Arrête de parler !":
        native: "Stop talking!"
        bases:
          "Arrête": "to stop"
          "de": "of, from, some"
      "Le bus s'arrête ici.":
        native: "The bus stops here."
        bases:
          "s'arrête": "to stop"
  "fr-2623":
    native: "to remember"
    notes:
      "n1": "Se souvenir is irregular like venir: je me souviens."
    bases:
      "se": "oneself"
    examples:
      "Je me souviens de ce jour.":
        native: "I remember that day."
        bases:
          "me": "me"
          "souviens": "to remember"
          "de": "of, from, some"
      "Elle se souvient de tout.":
        native: "She remembers everything."
        bases:
          "se": "oneself"
          "souvient": "to remember"
          "de": "of, from, some"
  "fr-2624":
    native: "to guess"
    notes:
      "n1": "Deviner is regular: to guess the answer or a secret."
    examples:
      "Devine qui arrive !":
        native: "Guess who is arriving!"
        bases:
          "Devine": "to guess"
      "Je devine la réponse.":
        native: "I guess the answer."
        bases:
          "devine": "to guess"
  "fr-2625":
    native: "to pick up"
    notes:
      "n1": "Ramasser is regular: to pick something up from the ground."
    examples:
      "Je ramasse les feuilles.":
        native: "I pick up the leaves."
        bases:
          "ramasse": "to pick up"
          "feuilles": "leaves"
      "Ramassez vos affaires.":
        native: "Pick up your things."
        bases:
          "Ramassez": "to pick up"
          "affaires": "things"
  "fr-2626":
    native: "to dare"
    notes:
      "n1": "Oser is regular: oser faire is to dare to do."
    examples:
      "Il ose parler à la directrice.":
        native: "He dares to speak to the headmistress."
        bases:
          "ose": "to dare"
          "à": "to, at"
          "directrice": "headmistress"
      "Je n'ose pas demander.":
        native: "I do not dare to ask."
        bases:
          "n'ose": "to dare"
          "pas": "not"
  "fr-2627":
    native: "to admit, to confess"
    notes:
      "n1": "Avouer is regular: to admit something to someone."
    examples:
      "Il avoue son erreur.":
        native: "He admits his mistake."
        bases:
          "avoue": "to admit, to confess"
          "erreur": "mistake"
      "Elle avoue la vérité.":
        native: "She confesses the truth."
        bases:
          "avoue": "to admit, to confess"
  "fr-2628":
    native: "to come closer"
    notes:
      "n1": "S’approcher is regular: to come closer to something."
    bases:
      "s'approcher": "come closer"
    examples:
      "Il s'approche de la porte.":
        native: "He comes closer to the door."
        bases:
          "s'approche": "to come closer"
          "de": "of, from, some"
      "Approchez-vous.":
        native: "Come closer."
        bases:
          "Approchez": "come closer"
  "fr-2629":
    native: "to move away"
    notes:
      "n1": "S’éloigner is regular: to move away from a place."
    bases:
      "s'éloigner": "move away"
    examples:
      "Elle s'éloigne de la mer.":
        native: "She moves away from the sea."
        bases:
          "s'éloigne": "to move away"
          "de": "of, from, some"
      "Ne vous éloignez pas.":
        native: "Do not go far away."
        bases:
          "Ne": "not"
          "éloignez": "move away"
          "pas": "not"
  "fr-2630":
    native: "success"
    notes:
      "n1": "Une réussite is a success or an achievement."
    examples:
      "C'est une belle réussite.":
        native: "It is a fine success."
        bases:
          "réussite": "success"
      "Sa réussite est méritée.":
        native: "His success is deserved."
        bases:
          "réussite": "success"
          "méritée": "deserved"
  "fr-2631":
    native: "to meet"
    notes:
      "n1": "Rencontrer is regular: to meet someone by chance or by arrangement."
    examples:
      "Je rencontre un ami.":
        native: "I meet a friend."
      "Nous rencontrons nos voisins.":
        native: "We meet our neighbours."
        bases:
          "rencontrons": "to meet"
  "fr-2651":
    native: "to notice"
    notes:
      "n1": "Remarquer is regular: to notice something."
    examples:
      "J'ai remarqué ton nouveau manteau.":
        native: "I noticed your new coat."
        bases:
          "remarqué": "to notice"
      "Personne ne remarque rien.":
        native: "Nobody notices anything."
        bases:
          "Personne": "nobody"
          "ne": "not"
          "remarque": "to notice"
  "fr-2652":
    native: "to observe"
    notes:
      "n1": "Observer is regular: to watch carefully."
    examples:
      "Le scientifique observe les étoiles.":
        native: "The scientist observes the stars."
        bases:
          "scientifique": "scientist"
          "observe": "to observe"
          "étoiles": "stars"
      "Nous observons les oiseaux.":
        native: "We watch the birds."
        bases:
          "observons": "to observe"
  "fr-2653":
    native: "to examine"
    notes:
      "n1": "Examiner is regular: to look at or check closely."
    examples:
      "Le médecin examine le patient.":
        native: "The doctor examines the patient."
        bases:
          "examine": "to examine"
      "Examinez la proposition.":
        native: "Examine the proposal."
        bases:
          "Examinez": "to examine"
          "proposition": "proposal"
  "fr-2654":
    native: "to count"
    notes:
      "n1": "Compter is regular: to count, or to intend to do."
    examples:
      "Il compte jusqu'à dix.":
        native: "He counts up to ten."
        bases:
          "jusqu'à": "until"
      "Je compte partir demain.":
        native: "I intend to leave tomorrow."
  "fr-2655":
    native: "to calculate"
    notes:
      "n1": "Calculer is regular: to work out a number."
    examples:
      "Je calcule le prix total.":
        native: "I calculate the total price."
        bases:
          "calcule": "to calculate"
          "total": "total"
      "Calculez la distance.":
        native: "Calculate the distance."
        bases:
          "Calculez": "to calculate"
          "distance": "distance"
  "fr-2656":
    native: "to gather"
    notes:
      "n1": "Rassembler is regular: to bring people or things together."
    examples:
      "Le maire rassemble les habitants.":
        native: "The mayor gathers the residents."
        bases:
          "rassemble": "to gather"
          "habitants": "residents"
      "Nous rassemblons nos affaires.":
        native: "We gather our things."
        bases:
          "rassemblons": "to gather"
          "affaires": "things"
  "fr-2657":
    native: "to welcome"
    notes:
      "n1": "Accueillir is an -ir verb: to greet someone who arrives."
    examples:
      "Elle accueille les visiteurs.":
        native: "She welcomes the visitors."
        bases:
          "accueille": "to welcome"
          "visiteurs": "visitors"
      "Nous accueillons nos amis.":
        native: "We welcome our friends."
        bases:
          "accueillons": "to welcome"
  "fr-2658":
    native: "to raise, to bring up"
    notes:
      "n1": "Élever is regular: to raise children or animals."
    examples:
      "Elle élève deux enfants seule.":
        native: "She raises two children alone."
        bases:
          "enfants": "children"
      "Les fermiers élèvent des vaches.":
        native: "The farmers raise cows."
        bases:
          "fermiers": "farmers"
          "élèvent": "to raise, to bring up"
