description: "Ten sentences about the weather, each with the words it is often mixed up with. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-1343":
    native: "The weather often changes in spring."
    bases:
      "au": "in"
  "fr-1344":
    native: "This morning, the snow falls on the roofs."
    bases:
      "toits": "roofs"
    confusables:
      "pluie": { why: "Pluie is 'rain', the water that falls as drops, not snow." }
      "brume": { why: "Brume is 'mist', not snow." }
  "fr-1345":
    native: "What is the weather forecast for tomorrow?"
    bases:
      "de": "for"
    confusables:
      "prevision": { why: "Prévision is 'forecast', the word for a prediction of the weather, as in la prévision météo." }
      "pluie": { why: "Pluie is 'rain', not the forecast the question asks for." }
  "fr-1346":
    native: "The wind blows, it is cold."
  "fr-1347":
    native: "The rain and the storm arrive together."
    confusables:
      "tonnerre": { why: "Tonnerre is 'thunder', the sound of a storm, not the storm itself." }
      "neige": { why: "Neige is 'snow', not a storm." }
  "fr-1348":
    native: "A blue sky and a hot sun."
  "fr-1349":
    native: "It is snowing, and the roads are slippery."
    bases:
      "glissantes": "slippery"
  "fr-1350":
    native: "The fog covers the valley."
    bases:
      "couvre": "covers"
      "vallée": "valley"
    confusables:
      "brume": { why: "Brume is 'mist', lighter than brouillard, which is 'fog'." }
      "neige": { why: "Neige is 'snow', not fog." }
  "fr-1351":
    native: "It is ten degrees today."
    bases:
      "y": "there"
  "fr-1352":
    native: "I take my umbrella when it rains."
