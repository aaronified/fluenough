cards:
  "fr-3240":
    native: "to hesitate"
    notes:
      "n1": "Hésiter takes à or de before a verb: hésiter à partir."
    examples:
      "J'hésite beaucoup.":
        native: "I hesitate a lot."
        bases:
          "J'hésite": "hesitate"
      "Il hésite avant de répondre.":
        native: "He hesitates before answering."
        bases:
          "hésite": "hesitates"
          "de": "of"
  "fr-3241":
    native: "to cancel"
    notes:
      "n1": "Annuler is regular: j'annule, nous annulons."
    examples:
      "J'annule le rendez-vous.":
        native: "I am cancelling the appointment."
        bases:
          "J'annule": "cancel"
      "Nous annulons la réunion.":
        native: "We are cancelling the meeting."
        bases:
          "annulons": "cancel"
  "fr-3242":
    native: "to confirm"
    notes:
      "n1": "Confirmer is regular: je confirme, nous confirmons."
    examples:
      "Je confirme la date.":
        native: "I confirm the date."
        bases:
          "confirme": "confirm"
      "Elle confirme le message.":
        native: "She confirms the message."
        bases:
          "confirme": "confirms"
  "fr-3243":
    native: "to live"
    notes:
      "n1": "Vivre is irregular: je vis, il vit, nous vivons; its past participle is vécu."
    examples:
      "Je vis à Paris.":
        native: "I live in Paris."
        bases:
          "vis": "live"
          "à": "in"
          "Paris": "Paris"
      "Il vit à la campagne.":
        native: "He lives in the countryside."
        bases:
          "vit": "lives"
          "à": "at"
          "campagne": "countryside"
  "fr-3244":
    native: "to allow"
    notes:
      "n1": "Permettre is like mettre: je permets, nous permettons; it takes de before a verb."
    examples:
      "Ce livre permet de comprendre.":
        native: "This book lets you understand."
        bases:
          "permet": "allows"
          "de": "of"
      "Il permet de partir.":
        native: "He lets us leave."
        bases:
          "permet": "allows"
          "de": "of"
  "fr-3245":
    native: "to promise"
    notes:
      "n1": "Promettre is like mettre: je promets, il promet."
    examples:
      "Je promets de venir.":
        native: "I promise to come."
        bases:
          "promets": "promise"
          "de": "of"
      "Elle promet un cadeau.":
        native: "She promises a present."
        bases:
          "promet": "promises"
  "fr-3246":
    native: "to keep, to look after"
    notes:
      "n1": "Garder is to keep, or to look after children: je garde, nous gardons."
    examples:
      "Je garde la clé.":
        native: "I keep the key."
        bases:
          "garde": "keep"
      "Elle garde les enfants.":
        native: "She looks after the children."
        bases:
          "garde": "looks after"
          "enfants": "children"
  "fr-3247":
    native: "to watch over"
    notes:
      "n1": "Surveiller is to keep an eye on: je surveille, nous surveillons."
    examples:
      "Il surveille le bébé.":
        native: "He watches the baby."
        bases:
          "surveille": "watches"
      "Nous surveillons la porte.":
        native: "We watch the door."
        bases:
          "surveillons": "watch"
  "fr-3248":
    native: "to warn, to inform"
    notes:
      "n1": "Prévenir is like venir: je préviens, nous prévenons, ils préviennent."
    examples:
      "Je préviens mon frère.":
        native: "I am warning my brother."
        bases:
          "préviens": "warn"
      "Il prévient les voisins.":
        native: "He warns the neighbours."
        bases:
          "prévient": "warns"
          "voisins": "neighbours"
  "fr-3249":
    native: "to warn"
    notes:
      "n1": "Avertir is regular in -ir: j'avertis, nous avertissons."
    examples:
      "J'avertis la police.":
        native: "I warn the police."
        bases:
          "J'avertis": "warn"
      "Il avertit ses amis.":
        native: "He warns his friends."
        bases:
          "avertit": "warns"
          "ses": "his"
          "amis": "friends"
  "fr-3250":
    native: "to make, to manufacture"
    notes:
      "n1": "Fabriquer is to make an object: je fabrique, nous fabriquons."
    examples:
      "Cette usine fabrique des chaises.":
        native: "This factory makes chairs."
        bases:
          "fabrique": "makes"
          "chaises": "chairs"
      "Il fabrique une table.":
        native: "He makes a table."
        bases:
          "fabrique": "makes"
  "fr-3251":
    native: "to produce"
    notes:
      "n1": "Produire is like conduire: je produis, il produit, nous produisons."
    examples:
      "Cette entreprise produit du café.":
        native: "This company produces coffee."
        bases:
          "produit": "produces"
          "du": "some"
      "Les vaches produisent du lait.":
        native: "Cows produce milk."
        bases:
          "vaches": "cows"
          "produisent": "produce"
          "du": "some"
  "fr-3252":
    native: "to show"
    notes:
      "n1": "Montrer takes two objects: montrer quelque chose à quelqu'un."
    examples:
      "Elle me montre la photo.":
        native: "She shows me the photo."
        bases:
          "me": "me"
          "montre": "shows"
      "Je te montre le chemin.":
        native: "I show you the way."
        bases:
          "te": "you"
          "montre": "show"
  "fr-3253":
    native: "to glimpse, to catch sight of"
    notes:
      "n1": "Apercevoir is like recevoir: j'aperçois, nous apercevons."
    examples:
      "J'aperçois la mer.":
        native: "I can see the sea."
        bases:
          "J'aperçois": "glimpse"
          "mer": "sea"
      "Il aperçoit un chat.":
        native: "He catches sight of a cat."
        bases:
          "aperçoit": "catches sight of"
  "fr-3254":
    native: "to recognise"
    notes:
      "n1": "Reconnaître is like connaître, with a circumflex on the i in il reconnaît."
    examples:
      "Je reconnais ta voix.":
        native: "I recognise your voice."
        bases:
          "reconnais": "recognise"
          "voix": "voice"
      "Il reconnaît sa sœur.":
        native: "He recognises his sister."
        bases:
          "reconnaît": "recognises"
  "fr-3255":
    native: "to join, to meet up with"
    notes:
      "n1": "Rejoindre is like joindre: je rejoins, il rejoint, nous rejoignons."
    examples:
      "Je rejoins mes amis au café.":
        native: "I join my friends at the café."
        bases:
          "rejoins": "join"
          "amis": "friends"
          "au": "at the"
      "Elle rejoint sa famille.":
        native: "She joins her family."
        bases:
          "rejoint": "joins"
  "fr-3256":
    native: "to separate"
    notes:
      "n1": "Séparer has è in the stem: je sépare, nous séparons."
    examples:
      "Il sépare les œufs.":
        native: "He separates the eggs."
        bases:
          "sépare": "separates"
          "œufs": "eggs"
      "Nous séparons les déchets.":
        native: "We separate the rubbish."
        bases:
          "séparons": "separate"
          "déchets": "rubbish"
  "fr-3257":
    native: "to gather"
    notes:
      "n1": "Réunir is regular in -ir: je réunis, nous réunissons."
    examples:
      "Elle réunit les documents.":
        native: "She gathers the documents."
        bases:
          "réunit": "gathers"
          "documents": "documents"
      "Nous réunissons la famille.":
        native: "We gather the family."
        bases:
          "réunissons": "gather"
  "fr-3258":
    native: "to replace"
    notes:
      "n1": "Remplacer is like placer: nous remplaçons, with a cedilla before -ons."
    examples:
      "Je remplace la lampe.":
        native: "I replace the lamp."
        bases:
          "remplace": "replace"
      "Nous remplaçons la voiture.":
        native: "We replace the car."
        bases:
          "remplaçons": "replace"
  "fr-3259":
    native: "to remember, to reserve"
    notes:
      "n1": "Retenir is like tenir: je retiens, il retient, nous retenons."
    examples:
      "Je retiens ton nom.":
        native: "I remember your name."
        bases:
          "retiens": "remember"
      "Le restaurant retient une table.":
        native: "The restaurant reserves a table."
        bases:
          "retient": "reserves"
  "fr-3260":
    native: "to phone"
    notes:
      "n1": "Téléphoner takes à before the person: téléphoner à quelqu'un."
    examples:
      "Je téléphone à mon père.":
        native: "I phone my father."
        bases:
          "téléphone": "phone"
          "à": "at"
      "Elle téléphone à sa mère.":
        native: "She phones her mother."
        bases:
          "téléphone": "phones"
          "à": "at"
  "fr-3261":
    native: "to dial, to compose"
    notes:
      "n1": "Composer is to dial a number, or to compose music or a text."
    examples:
      "Je compose le numéro.":
        native: "I dial the number."
        bases:
          "compose": "dial"
      "Il compose une chanson.":
        native: "He composes a song."
        bases:
          "compose": "composes"
  "fr-3262":
    native: "to type, to hit"
    notes:
      "n1": "Taper is to type, or to hit: taper sur quelque chose is to hit or bang it."
    examples:
      "Je tape le message.":
        native: "I type the message."
        bases:
          "tape": "type"
      "Il tape sur la table.":
        native: "He bangs on the table."
        bases:
          "tape": "hits"
