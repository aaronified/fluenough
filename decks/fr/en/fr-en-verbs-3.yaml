          "détache": "unfasten"
  "fr-3266":
    native: "to fix, to stare at"
    notes:
      "n1": "Fixer is to fix or to stare at: nous fixons."
    examples:
      "Il fixe la fenêtre.":
        native: "He stares at the window."
        bases:
          "fixe": "stares at"
      "Nous fixons le rendez-vous.":
        native: "We fix the appointment."
        bases:
          "fixons": "fix"
  "fr-3267":
    native: "to seem"
    notes:
      "n1": "Sembler takes an adjective and no object: il semble fatigué."
    examples:
      "Il semble fatigué.":
        native: "He seems tired."
        bases:
          "semble": "seems"
      "Ça semble facile.":
        native: "It seems easy."
        bases:
          "Ça": "it"
          "semble": "seems"
