      "Nous profitons de la plage.":
        native: "We enjoy the beach."
        bases:
          "profitons": "enjoy"
          "de": "of"
          "plage": "beach"
  "fr-3269":
    native: "to yawn"
    notes:
      "n1": "Bâiller is to yawn: je bâille, nous bâillons."
