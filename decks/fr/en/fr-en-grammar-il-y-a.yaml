  prompt: "{lemma} ({gloss}), {slot}"
  slots: { "statement": "statement", "question": "question", "negative": "negative" }
  entries:
    "il-y-a": "there is; there are"
  notes: "Il y a stays the same for one thing and for many: il y a un ami, il y a des amis. Its question is y a-t-il ?, with -t- added between a and il, and its negative is il n'y a pas. The form is one fixed phrase; the word after it is un, une or des, or de before a negative."
