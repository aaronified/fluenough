  "fr-4117":
    native: "Cicero says that to philosophise is nothing else than to prepare oneself for death."
    notes:
      "n1": "The opening sentence of chapter XIX of Book I of the Essais (Michaud numbering), quoting Cicero. Montaigne starts the chapter on learning to die with this saying. The text is that of the 1595 edition; spelling modernised: aprester to apprêter."
