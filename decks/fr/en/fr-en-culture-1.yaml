description: "Short lines from French works of the Renaissance, in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-4100":
    native: "It is better to write of laughter than of tears, because laughing is what belongs to man alone."
    notes:
      "n1": "The verse at the start of Gargantua (1535) by François Rabelais, before the author's own prologue. The author says he would rather write about laughter than about sorrow, because laughing is what is proper to people. The spelling is modernised here."
    bases:
      "Mieux": "better"
      "est": "is"
      "de": "of"
      "rire": "laughter, laughing"
      "que": "than"
      "larmes": "tears"
      "écrire": "to write"
      "pour": "for"
      "ce": "that"
      "le": "the"
      "propre": "proper, belonging to"
      "l'homme": "man, humankind"
  "fr-4101":
    native: "Do what you wish."
    notes:
      "n1": "The one rule of the Abbey of Thélème, the ideal abbey in Gargantua (1535) by François Rabelais. The rule is only this clause: do what you wish. The spelling is modernised here."
    bases:
      "Fais": "do"
      "ce": "the thing"
      "que": "which"
      "voudras": "you want"
  "fr-4102":
    native: "Happy is the one who, like Ulysses, has made a fine journey."
    notes:
      "n1": "The first line of a sonnet by Joachim du Bellay from Les Regrets (1558). The poet compares a man who has come home after a long journey to Ulysses, the hero who sailed home from the Trojan War."
    bases:
      "Heureux": "happy"
      "qui": "the one who"
      "comme": "like"
      "Ulysse": "Ulysses"
      "a": "has"
      "fait": "made"
      "un": "a"
      "beau": "fine"
      "voyage": "journey"
  "fr-4103":
    native: "I live, I die; I burn and I drown."
    notes:
      "n1": "The first line of Sonnet VIII by Louise Labé, the poet from Lyon, first printed in 1555. The poet describes a love that burns her and drowns her at the same time. The spelling is modernised here."
    bases:
      "Je": "I"
      "vis": "live"
      "meurs": "die"
      "me": "myself"
      "brûle": "burn"
      "et": "and"
      "noie": "drown"
  "fr-4105":
    native: "To philosophise is to learn how to die."
    notes:
      "n1": "The title of chapter XIX of Book I of the Essais by Michel de Montaigne, in the Michaud translation of 1907. The chapter opens with Cicero's view that philosophy is preparing to die. The chapter is numbered 20 in other editions."
    bases:
      "Que": "what it means to"
      "philosopher": "to philosophise"
      "c'est": "is"
      "apprendre": "to learn"
      "à": "how to"
      "mourir": "to die"
  "fr-4106":
    native: "Pick the roses of life from today on, and do not wait until tomorrow."
    notes:
      "n1": "The last line of the sonnet 'Quand vous serez bien vieille' from the Sonnets pour Hélène (1578) by Pierre de Ronsard. The poet tells a woman, when she is old, to enjoy life now and not wait for tomorrow."
    bases:
      "Cueillez": "pick, gather"
      "dès": "from"
      "aujourd'hui": "today"
      "les": "the"
      "roses": "roses"
      "de": "of"
      "la": "the"
      "vie": "life"
  "fr-4107":
    native: "Darling, let us go and see whether the rose has opened."
    notes:
      "n1": "The first line of the ode 'Mignonne, allons voir si la rose' in Les Odes (1550) by Pierre de Ronsard, Book I, ode XVII. The poet tells a young woman that the rose which opened this morning will lose its beauty by evening, so she should enjoy her youth now."
    bases:
      "Mignonne": "darling (to a girl)"
      "allons": "let us go"
      "voir": "to see"
      "si": "whether"
      "la": "the"
      "rose": "rose"
  "fr-4108":
    native: "Kiss me again, kiss me back, and kiss."
    notes:
      "n1": "The first line of a poem by Louise Labé, printed at Lyon in 1555. The poet asks for more kisses. The printed line reads 'Baise m'encor, rebaise moy et baise'; spelling modernised here."
    bases:
      "Baise": "kiss"
      "m'encor": "again"
      "rebaise-moi": "kiss me back"
      "et": "and"
  "fr-4109":
    native: "So, reader, I am myself the subject of my book."
    notes:
      "n1": "From 'Au Lecteur' (To the Reader), the preface of the Essais, first published at Bordeaux in 1580. Montaigne says he is the subject of his own book, and asks the reader not to spend time on so frivolous a subject."
    bases:
      "Ainsi": "thus"
      "lecteur": "reader"
      "je": "I"
      "suis": "am"
      "moi-même": "myself"
      "la": "the"
      "matière": "subject"
      "de": "of"
      "mon": "my"
      "livre": "book"
  "fr-4110":
    native: "France, mother of the arts, of arms and of laws."
    notes:
      "n1": "The first line of sonnet IX of Les Regrets (1558) by Joachim du Bellay. The poet addresses France and calls her the mother of the arts, of war and of law."
    bases:
      "France": "France"
      "mère": "mother"
      "des": "of the"
      "arts": "arts"
      "armes": "arms"
      "et": "and"
      "lois": "laws"
  "fr-4111":
    native: "I do not want to dig into the bosom of nature."
    notes:
      "n1": "The first line of sonnet I of Les Regrets (1558) by Joachim du Bellay. The poet refuses to search the secrets of nature, and the book begins with that refusal."
    bases:
      "Je": "I"
      "ne": "not"
      "veux": "want"
      "point": "at all"
      "fouiller": "to search"
      "au": "in the"
      "sein": "bosom"
      "de": "of"
      "la": "the"
      "nature": "nature"
  "fr-4112":
    native: "Oh, how happy is the one who can spend his life."
    notes:
      "n1": "The first line of sonnet XXXVIII of Les Regrets (1558) by Joachim du Bellay. Far from home, the poet envies the man who can live out his life in his own country."
    bases:
      "Ô": "oh"
      "qu'heureux": "how happy"
      "est": "is"
      "celui": "the one"
      "qui": "who"
