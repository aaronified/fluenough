      "passer": "to spend"
      "son": "his"
      "âge": "life"
  "fr-4113":
    native: "Oh, how happy is he who is not forced to pretend."
    notes:
      "n1": "The first line of sonnet XLVIII of Les Regrets (1558) by Joachim du Bellay. The poet praises the man who does not have to pretend."
    bases:
