  "fr-4118":
    native: "If through effort, sweat and loyalty."
    notes:
      "n1": "The first line of sonnet XLVI of Les Regrets (1558) by Joachim du Bellay. It opens a conditional sentence: the poet first names what he has given, and then what he has received."
