  "fr-4114":
    native: "It is not the Tuscan river on the proud shore."
    notes:
      "n1": "The first line of sonnet X of Les Regrets (1558) by Joachim du Bellay. The poet says he is not on the Tuscan river of Italy, nor in the air of the Latins."
