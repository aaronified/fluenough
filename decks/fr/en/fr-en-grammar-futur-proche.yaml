schema: 1
id: "fr-en-grammar-futur-proche"
kind: "layer"
core: "fr-grammar-futur-proche"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The near future: aller plus an infinitive"
license: "CC-BY-SA-4.0"
description: "Aller in the present, then an infinitive, says what is going to happen. Not yet checked by a French speaker: please report any mistake."
pattern:
  name: "Near future"
  slot_name: "person"
  prompt: "{lemma} ({gloss}), {slot}"
  slots: { "je": "I", "tu": "you (informal)", "il-elle": "he or she", "nous": "we", "vous": "you (formal or plural)", "ils-elles": "they" }
  entries:
    "parler": "to speak"
    "manger": "to eat"
    "finir": "to finish"
    "partir": "to leave"
    "travailler": "to work"
    "dormir": "to sleep"
    "voir": "to see"
  notes: "Aller in the present plus an infinitive is the near future: je vais manger (I am going to eat). Use it for plans and for things that are about to happen. Its negative is je ne vais pas manger, with ne and pas around the form of aller. The infinitive does not change, whoever the subject is."
