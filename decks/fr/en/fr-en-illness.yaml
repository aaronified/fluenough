description: "Forty words for being ill: symptoms, common illnesses, medicines and what a doctor says. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-3000":
    native: "flu"
    notes:
      "n1": "Grippe is feminine: la grippe. It is a stronger illness than a cold."
    examples:
      "J'ai la grippe depuis lundi.":
        native: "I have had the flu since Monday."
        bases:
          "J'ai": "have"
          "grippe": "flu"
          "depuis": "since"
      "Ma sœur a la grippe.":
        native: "My sister has the flu."
        bases:
          "a": "has"
          "grippe": "flu"
  "fr-3001":
    native: "ointment"
    notes:
      "n1": "A pommade is rubbed on the skin, not swallowed: it is feminine."
    examples:
      "Mets de la pommade sur la coupure.":
        native: "Put some ointment on the cut."
        bases:
          "Mets": "put"
          "de": "some"
          "pommade": "ointment"
      "La pommade est dans le tiroir.":
        native: "The ointment is in the drawer."
