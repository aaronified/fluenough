      "sa": "her"
      "proie": "prey"
      "attachée": "bound"
  "fr-4160":
    native: "It is necessary that, by the arrangement of things, power checks power."
    notes:
      "n1": "Book XI, chapter 4 of De l'esprit des lois (1748) by Montesquieu: power must be checked by power, the basis of the separation of powers."
    bases:
      "Il": "it"
      "faut": "is necessary"
