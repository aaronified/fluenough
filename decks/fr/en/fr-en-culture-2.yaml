  "fr-4167":
    native: "Everything has been said, and one comes too late."
    notes:
      "n1": "The first line of the chapter 'Des ouvrages de l'esprit' of Les Caractères (1688) by Jean de La Bruyère: everything has already been said, and a writer arrives too late."
