      "pouvoir": "power"
      "arrête": "checks"
  "fr-4161":
    native: "Cover up that breast, for I could not bear to look at it."
    notes:
      "n1": "Tartuffe speaks to Elmire in Tartuffe (1669) by Molière, act III, scene 2, when her neckline is uncovered."
    bases:
      "Couvrez": "cover"
      "ce": "that"
      "sein": "breast"
      "que": "that"
      "je": "I"
      "ne": "cannot"
      "saurais": "could"
      "voir": "see"
  "fr-4162":
    native: "What one conceives well is expressed clearly."
    notes:
      "n1": "A line of the Art poétique (1674) by Nicolas Boileau, canto I: clear thinking makes clear writing."
    bases:
      "Ce": "what"
      "que": "that"
      "l'on": "one"
