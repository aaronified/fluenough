      "du": "of the"
      "cœur": "heart"
      "d'une": "from a"
      "atteinte": "blow"
      "imprévue": "unexpected"
  "fr-4159":
    native: "It is Venus, wholly bound to her prey."
    notes:
      "n1": "Phèdre speaks of her passion as the goddess Venus, who holds her entirely; the line is in act I of Phèdre (1677) by Jean Racine."
    bases:
      "C'est": "it is"
      "Vénus": "Venus"
      "tout": "wholly"
      "entière": "entirely"
