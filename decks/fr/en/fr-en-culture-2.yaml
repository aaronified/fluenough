description: "Short lines from French works of the seventeenth and eighteenth centuries, in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-4150":
    native: "Mister Crow, perched on a tree."
    notes:
      "n1": "The opening line of the fable 'The Crow and the Fox' by Jean de La Fontaine, from his Fables. The crow holds a piece of cheese in its beak, and the fox wants it. The fable ends with a moral about flattery."
    bases:
      "Maître": "master (the form used for a crow in the fable)"
      "Corbeau": "crow"
      "sur": "on"
      "un": "a"
      "arbre": "tree"
      "perché": "perched"
  "fr-4151":
    native: "Running fast is no use; you have to set off at the right time."
    notes:
      "n1": "The moral of the fable 'The Hare and the Tortoise' by Jean de La Fontaine, from his Fables (1668 to 1694). The saying is still used in French to mean that speed alone does not win; a good start matters."
    bases:
      "Rien": "nothing"
      "ne": "does not"
      "sert": "help, serve"
      "de": "to"
      "courir": "run"
      "il": "one"
      "faut": "must"
      "partir": "leave, set off"
      "à": "at"
      "point": "the right moment"
  "fr-4152":
    native: "For more than forty years I have been speaking prose without knowing it."
    notes:
      "n1": "Monsieur Jourdain's line in Le Bourgeois gentilhomme (1670) by Molière. The rich, self-made Jourdain is pleased to learn that he has been speaking prose all his life, and the joke is that he did not know it."
    bases:
      "Il": "it"
      "y": "there"
      "a": "has"
      "plus": "more"
      "de": "than"
      "quarante": "forty"
      "ans": "years"
      "que": "that"
      "je": "I"
      "dis": "speak"
      "la": "the"
      "prose": "prose"
  "fr-4153":
    native: "We must cultivate our garden."
    notes:
      "n1": "The last words of Candide, or Optimism (1759) by Voltaire. After many trials, the hero and his friends settle on a small farm and decide to work in it rather than argue about philosophy."
    bases:
      "Il": "it"
      "faut": "is necessary"
      "cultiver": "to cultivate, to tend"
      "notre": "our"
      "jardin": "garden"
  "fr-4154":
    native: "Man is born free, and everywhere he is in chains."
    notes:
      "n1": "The first sentence of Book I, chapter 1 of Du contrat social (1762) by Jean-Jacques Rousseau. It is one of the best-known opening sentences of French political writing. The spelling is modernised here."
    bases:
      "L'homme": "man, humankind"
      "est": "is"
      "né": "born"
      "libre": "free"
      "et": "and"
      "partout": "everywhere"
      "il": "he"
      "dans": "in"
      "les": "the"
      "fers": "chains"
  "fr-4155":
    native: "The heart has its reasons, which reason does not know."
    notes:
      "n1": "A famous thought from the Pensées (1670) by Blaise Pascal: feeling has its own reasons, which reason cannot reach."
    bases:
      "Le": "the"
      "cœur": "heart"
      "a": "has"
      "ses": "its"
      "raisons": "reasons"
      "que": "that"
      "la": "the"
      "raison": "reason"
      "ne": "not"
      "connaît": "knows"
      "point": "at all"
  "fr-4156":
    native: "Man is only a reed."
    notes:
      "n1": "A famous fragment of the Pensées (1670) by Blaise Pascal. Man is the weakest reed in nature, but he is a thinking reed."
    bases:
      "L'homme": "man"
      "n'est": "is not"
      "qu'un": "only a"
      "roseau": "reed"
  "fr-4157":
    native: "The eternal silence of these infinite spaces frightens me."
    notes:
      "n1": "A famous line from the Pensées (1670) by Blaise Pascal: the author is frightened by the silence of the universe. Spelling modernised: effraye to effraie."
    bases:
      "Le": "the"
      "silence": "silence"
      "éternel": "eternal"
      "de": "of"
      "ces": "these"
      "espaces": "spaces"
      "infinis": "infinite"
      "m'effraie": "frightens me"
  "fr-4158":
    native: "Pierced right to the bottom of the heart by an unexpected blow."
    notes:
      "n1": "Opening words of the text. Rodrigue's words in Le Cid (1637) by Pierre Corneille, act I, scene 6: the young hero describes a blow he did not expect."
    bases:
      "Percé": "pierced"
