  "fr-4166":
    native: "The young ear of corn ripens, respected by the scythe."
    notes:
      "n1": "The first line of La Jeune Captive (The Young Captive) by André Chénier, dated 1794 on French Wikisource. The poet compares a young woman in prison to a ripening ear of corn that the scythe spares."
