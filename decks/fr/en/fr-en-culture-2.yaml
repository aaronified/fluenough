  "fr-4165":
    native: "We all have enough strength to bear the troubles of others."
    notes:
      "n1": "Maxim XIX of the Réflexions ou sentences et maximes morales by François de La Rochefoucauld, whose first edition is dated 1665: we can easily bear the misfortunes of others."
    bases:
