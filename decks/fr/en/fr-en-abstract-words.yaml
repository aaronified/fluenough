description: "Forty-five words for ideas: meaning and cause, chance and change, limits and balance, and the words we use to talk about what is possible. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-2659":
    native: "meaning, sense, direction"
    notes:
      "n1": "Le sens is the meaning of a word, or the direction of a path."
    examples:
      "Le sens de ce mot est clair.":
        native: "The meaning of this word is clear."
        bases:
          "sens": "meaning, sense, direction"
          "de": "of, from, some"
          "clair": "clear"
      "Dans quel sens va le train ?":
        native: "Which direction is the train going?"
        bases:
          "sens": "meaning, sense, direction"
  "fr-2660":
    native: "truth"
    notes:
      "n1": "La vérité is the truth; the opposite is le mensonge."
    examples:
      "La vérité finit toujours par sortir.":
        native: "The truth always comes out in the end."
        bases:
          "vérité": "truth"
      "Dites-moi la vérité.":
        native: "Tell me the truth."
        bases:
          "Dites": "say"
          "vérité": "truth"
  "fr-2661":
    native: "lie"
