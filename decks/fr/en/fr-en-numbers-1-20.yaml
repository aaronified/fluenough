schema: 1
id: "fr-en-numbers-1-20"
kind: "layer"
core: "fr-numbers-1-20"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Numbers 1 to 20"
license: "CC-BY-SA-4.0"
description: "The numbers from one to twenty, with the time of day, ages and counting in a sentence. The numbers from one to ten are taught as one set. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-0208":
    native: "one; a (before a masculine noun)"
    notes:
      "n1": "Un is 'one', and 'a' before a masculine noun: un frère. The feminine is une."
    examples:
      "Un frère est là.":
        native: "A brother is here."
        bases:
          "Un": "a"
      "J'ai un fils.":
        native: "I have a son."
        bases:
          "J'ai": "I have"
          "un": "a"
  "fr-0209":
    native: "two"
    notes:
      "n1": "Deux is 'two'. Before a word that starts with a vowel, its final s is said: deux amis."
    examples:
      "Deux amis sont là.":
        native: "Two friends are here."
        bases:
          "Deux": "two"
      "Nous avons deux fils.":
        native: "We have two sons."
        bases:
          "avons": "have (we)"
          "deux": "two"
  "fr-0210":
    native: "three"
    notes:
      "n1": "Trois is 'three'. The numbers from one to ten follow in order, as the set below shows."
    examples:
      "Trois chats sont là.":
        native: "Three cats are here."
        bases:
          "Trois": "three"
          "chats": "cats"
      "Il est trois heures.":
        native: "It is three o'clock."
        bases:
          "trois": "three"
  "fr-0211":
    native: "four"
    notes:
      "n1": "Quatre is 'four'. For the time, il est quatre heures is 'it is four o'clock'."
    examples:
      "Mon père a quatre frères.":
        native: "My father has four brothers."
        bases:
          "a": "has"
          "quatre": "four"
      "Il est quatre heures.":
        native: "It is four o'clock."
        bases:
          "quatre": "four"
  "fr-0212":
    native: "five"
    notes:
      "n1": "Cinq is 'five'. The final q is silent."
    examples:
      "Cinq enfants jouent.":
        native: "Five children play."
        bases:
          "Cinq": "five"
          "enfants": "children"
          "jouent": "play"
      "Nous sommes cinq.":
        native: "There are five of us."
        bases:
          "cinq": "five"
  "fr-0213":
    native: "six"
    notes:
      "n1": "Six is 'six'. Before a vowel it is said with a z sound: six amis; and for an age, j'ai six ans."
    examples:
      "Six amis sont ici.":
        native: "Six friends are here."
        bases:
          "Six": "six"
      "J'ai six ans.":
        native: "I am six years old."
        bases:
          "J'ai": "I have"
          "six": "six"
          "ans": "years (of age)"
  "fr-0214":
    native: "seven"
    notes:
      "n1": "Sept is 'seven'. Une semaine a sept jours: a week has seven days."
    examples:
      "Il est sept heures.":
        native: "It is seven o'clock."
        bases:
          "sept": "seven"
      "Une semaine a sept jours.":
        native: "A week has seven days."
        bases:
          "a": "has"
          "sept": "seven"
  "fr-0215":
    native: "eight"
    notes:
      "n1": "Huit is 'eight'. The h is silent: huit enfants."
    examples:
      "Il est huit heures.":
        native: "It is eight o'clock."
        bases:
          "huit": "eight"
      "Huit enfants jouent ici.":
        native: "Eight children play here."
        bases:
          "Huit": "eight"
          "enfants": "children"
          "jouent": "play"
  "fr-0216":
    native: "nine"
    notes:
      "n1": "Neuf is 'nine'. In neuf ans, the f is said as a v: nine years old."
    examples:
      "Il est neuf heures.":
        native: "It is nine o'clock."
        bases:
          "neuf": "nine"
      "Mon fils a neuf ans.":
        native: "My son is nine years old."
        bases:
          "a": "has"
          "neuf": "nine"
          "ans": "years (of age)"
  "fr-0217":
    native: "ten"
    notes:
      "n1": "Dix is 'ten'. Before a vowel the x is said as a z: dix amis."
    examples:
      "Il est dix heures.":
        native: "It is ten o'clock."
        bases:
          "dix": "ten"
      "Dix amis parlent français.":
        native: "Ten friends speak French."
        bases:
          "Dix": "ten"
          "français": "French"
  "fr-0218":
    native: "eleven"
    notes:
      "n1": "Onze is 'eleven'. Its first sound is the nasal vowel of on, not an o."
    examples:
      "Il est onze heures.":
        native: "It is eleven o'clock."
        bases:
          "onze": "eleven"
      "Onze garçons jouent.":
        native: "Eleven boys play."
        bases:
          "Onze": "eleven"
          "jouent": "play"
  "fr-0219":
    native: "twelve"
    notes:
      "n1": "Douze is 'twelve'. Douze, treize, quatorze, quinze and seize all end in -ze, so they are learnt as a group."
    examples:
      "Il est douze heures.":
        native: "It is twelve o'clock."
        bases:
          "douze": "twelve"
      "Douze enfants sont là.":
        native: "Twelve children are here."
        bases:
          "Douze": "twelve"
          "enfants": "children"
  "fr-0220":
    native: "thirteen"
    notes:
      "n1": "Treize is 'thirteen'. Its final z is said before a vowel: treize amis."
    examples:
      "Mon fils a treize ans.":
        native: "My son is thirteen years old."
        bases:
          "a": "has"
          "treize": "thirteen"
          "ans": "years (of age)"
      "Treize amis sont là.":
        native: "Thirteen friends are here."
        bases:
          "Treize": "thirteen"
  "fr-0221":
    native: "fourteen"
    notes:
      "n1": "Quatorze is 'fourteen'. It starts with the sound of quatre."
    examples:
      "Ma sœur a quatorze ans.":
        native: "My sister is fourteen years old."
        bases:
          "a": "has"
          "quatorze": "fourteen"
          "ans": "years (of age)"
      "Quatorze garçons jouent.":
        native: "Fourteen boys play."
        bases:
          "Quatorze": "fourteen"
          "jouent": "play"
  "fr-0222":
    native: "fifteen"
    notes:
      "n1": "Quinze is 'fifteen'."
    examples:
      "Ma fille a quinze ans.":
        native: "My daughter is fifteen years old."
        bases:
          "a": "has"
          "quinze": "fifteen"
          "ans": "years (of age)"
      "Quinze enfants jouent ici.":
        native: "Fifteen children play here."
        bases:
          "Quinze": "fifteen"
          "enfants": "children"
          "jouent": "play"
  "fr-0223":
    native: "sixteen"
    notes:
      "n1": "Seize is 'sixteen'."
    examples:
      "Ma nièce a seize ans.":
        native: "My niece is sixteen years old."
        bases:
          "a": "has"
          "seize": "sixteen"
          "ans": "years (of age)"
      "Seize amis sont là.":
        native: "Sixteen friends are here."
        bases:
          "Seize": "sixteen"
  "fr-0224":
    native: "seventeen"
    notes:
      "n1": "Dix-sept is 'seventeen': ten and seven. Dix-huit and dix-neuf follow the same pattern."
    examples:
      "Mon neveu a dix-sept ans.":
        native: "My nephew is seventeen years old."
        bases:
          "a": "has"
          "ans": "years (of age)"
      "Il est dix-sept heures.":
        native: "It is five o'clock in the afternoon."
  "fr-0225":
    native: "eighteen"
    notes:
      "n1": "Dix-huit is 'eighteen': ten and eight."
    examples:
      "Mon cousin a dix-huit ans.":
        native: "My cousin is eighteen years old."
        bases:
          "a": "has"
          "ans": "years (of age)"
      "Il est dix-huit heures.":
        native: "It is six o'clock in the evening."
  "fr-0226":
    native: "nineteen"
    notes:
      "n1": "Dix-neuf is 'nineteen': ten and nine."
    examples:
      "Ma cousine a dix-neuf ans.":
        native: "My cousin is nineteen years old."
        bases:
          "a": "has"
          "ans": "years (of age)"
      "Il est dix-neuf heures.":
        native: "It is seven o'clock in the evening."
  "fr-0227":
    native: "twenty"
    notes:
      "n1": "Vingt is 'twenty'. The t of vingt is said before a vowel: vingt amis, vingt ans."
    examples:
      "Mon frère a vingt ans.":
        native: "My brother is twenty years old."
        bases:
          "a": "has"
          "vingt": "twenty"
          "ans": "years (of age)"
      "Vingt amis sont là.":
        native: "Twenty friends are here."
        bases:
          "Vingt": "twenty"
  "fr-0228":
    native: "the numbers one to ten"
    explanation: "Un to dix are ten words that are learnt together, in order: un, deux, trois, quatre, cinq, six, sept, huit, neuf, dix. Un is also 'a' before a masculine noun."
