schema: 1
id: "fr-en-phrasebook"
kind: "layer"
core: "fr-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty-four things to say from the first day, before their words are taught: courtesy phrases (hello, thank you, please, good evening, good night, sorry), survival phrases (I don't understand, I don't speak French, where are the toilets, how much is this) and the verbs to be, to have and to speak, with water. Not yet checked by a French speaker: please report any mistake."
license: "CC-BY-SA-4.0"
cards:
  "fr-0001":
    native: "hello; good morning"
    bases:
      "bonjour": "hello"
  "fr-0002":
    native: "thank you"
    bases:
      "merci": "thank you"
  "fr-0003":
    native: "please"
    bases:
      "s'il": "if"
      "plaît": "to please"
  "fr-0004":
    native: "good evening"
    bases:
      "bonsoir": "good evening"
  "fr-0005":
    native: "good night"
    notes:
      "n1": "Bonne is the feminine of bon (good). The feminine says the n that bon hides: bonne is said bɔn, while bon is said bɔ̃, with a nasal vowel. Bonne nuit is said at bedtime, to someone who is going to sleep."
    bases:
      "nuit": "night"
  "fr-0006":
    native: "goodbye"
    bases:
      "au": "to; at"
      "revoir": "to see again"
  "fr-0007":
    native: "excuse me"
    bases:
      "excusez": "to excuse"
      "moi": "me"
  "fr-0008":
    native: "sorry; pardon me"
    bases:
      "pardon": "pardon"
  "fr-0009":
    native: "I don't understand"
    bases:
      "ne": "not"
      "comprends": "to understand"
      "pas": "not"
  "fr-0010":
    native: "I don't speak French"
    bases:
      "ne": "not"
      "pas": "not"
      "français": "French"
  "fr-0011":
    native: "Please speak more slowly."
    bases:
      "plus": "more"
      "lentement": "slowly"
      "s'il": "if"
      "plaît": "to please"
  "fr-0012":
    native: "How do you say this?"
    bases:
      "dit": "to say"
      "on": "one; people"
      "ça": "this; that"
  "fr-0013":
    native: "Where are the toilets?"
    bases:
