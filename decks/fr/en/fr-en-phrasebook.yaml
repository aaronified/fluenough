      "Paul": "Paul (a first name)"
  "fr-0018":
    native: "Do you speak English?"
    bases:
      "anglais": "English"
  "fr-0019":
    native: "I don't know."
    bases:
      "ne": "not"
      "sais": "to know"
      "pas": "not"
  "fr-0020":
    native: "Have a good day."
    bases:
