  "fr-0014":
    native: "How much does this cost?"
    bases:
      "ça": "this; that"
      "coûte": "to cost"
  "fr-0015":
    native: "I would like a coffee, please."
    bases:
      "voudrais": "to want"
      "un": "a; one"
      "café": "coffee"
      "s'il": "if"
      "plaît": "to please"
  "fr-0016":
    native: "I'm sorry."
    bases:
      "désolé": "sorry"
  "fr-0017":
    native: "My name is Paul."
    bases:
