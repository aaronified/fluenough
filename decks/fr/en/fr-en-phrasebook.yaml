schema: 1
id: "fr-en-phrasebook"
kind: "layer"
core: "fr-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty-four things to say from the first day, before their words are taught: courtesy phrases (hello, thank you, please, good evening, good night, sorry), survival phrases (I don't understand, I don't speak French, where are the toilets, how much is this) and the verbs to be, to have and to speak, with water. Not yet checked by a French speaker: please report any mistake."
license: "CC-BY-SA-4.0"
cards:
  "fr-0001":
    native: "hello; good morning"
    bases:
      "bonjour": "hello"
  "fr-0002":
    native: "thank you"
    bases:
      "merci": "thank you"
  "fr-0003":
    native: "please"
    bases:
      "s'il": "if"
      "plaît": "to please"
    notes:
      "elision": "Si loses its i before il, giving s'il: literally 'if it pleases you' (vous is 'you')."
  "fr-0004":
    native: "good evening"
    bases:
      "bonsoir": "good evening"
    notes:
      "evening": "In France bonsoir is used in the evening and bonjour during the day, depending on the time of day."
  "fr-0005":
    native: "good night"
    notes:
      "n1": "Bonne is the feminine of bon (good). The feminine says the n that bon hides: bonne is said bɔn, while bon is said bɔ̃, with a nasal vowel. Bonne nuit is said at bedtime, to someone who is going to sleep."
  "fr-0006":
    native: "goodbye"
    bases:
      "au": "to; at"
      "revoir": "to see again"
  "fr-0007":
    native: "excuse me"
    bases:
      "excusez": "to excuse"
      "moi": "me"
    notes:
      "vous": "Excusez is the vous form of the imperative of excuser (to excuse). With a friend or child, say excuse-moi."
  "fr-0008":
    native: "sorry; pardon me"
  "fr-0009":
    native: "I don't understand"
    bases:
      "ne": "not"
      "comprends": "to understand"
      "pas": "not"
    notes:
      "ne-pas": "Negation wraps the verb: ne goes before comprends and pas after it, so je ne comprends pas is 'I do not understand'."
  "fr-0010":
    native: "I don't speak French"
    bases:
      "ne": "not"
      "pas": "not"
      "français": "French"
    notes:
      "ne-pas": "Negation wraps the verb: ne before parle and pas after it, as in je ne parle pas."
  "fr-0011":
    native: "Please speak more slowly."
    bases:
      "plus": "more"
      "lentement": "slowly"
      "s'il": "if"
      "plaît": "to please"
    notes:
      "adverb": "Lentement, 'slowly', is built from the feminine lente with the ending -ment; plus lentement is 'more slowly'."
  "fr-0012":
    native: "How do you say this?"
    bases:
      "dit": "to say"
      "on": "one; people"
      "ça": "this; that"
    notes:
      "inversion": "In this question the verb and on swap places and are joined with a hyphen: dit-on, 'does one say'. On means 'one', 'we' or 'people'."
  "fr-0013":
    native: "Where are the toilets?"
    notes:
      "plural": "Toilettes is used only in the plural, so it takes les and the plural verb sont."
  "fr-0014":
    native: "How much does this cost?"
    bases:
      "ça": "this; that"
      "coûte": "to cost"
    notes:
      "ca": "Ça is the everyday spoken form of cela, 'that' or 'it'."
  "fr-0015":
    native: "I would like a coffee, please."
    bases:
      "voudrais": "to want"
      "un": "a; one"
      "s'il": "if"
      "plaît": "to please"
    notes:
      "conditional": "Voudrais is the conditional of vouloir (to want). It makes the request polite: 'I would like'."
  "fr-0016":
    native: "I'm sorry."
    bases:
      "désolé": "sorry"
    notes:
      "agreement": "Désolé, 'sorry', agrees with the speaker. A man says désolé; a woman says désolée."
  "fr-0017":
    native: "My name is Paul."
    bases:
      "m'appelle": "to be called"
      "Paul": "Paul (a first name)"
    notes:
      "reflexive": "S'appeler is a reflexive verb (forme réfléchie of appeler), so it takes the pronoun me, which becomes m' before a vowel: je m'appelle, 'my name is'."
  "fr-0018":
    native: "Do you speak English?"
    bases:
      "anglais": "English"
    notes:
      "inversion": "In a question with vous the verb comes first and is joined to vous with a hyphen: parlez-vous, 'do you speak'."
  "fr-0019":
    native: "I don't know."
    bases:
      "ne": "not"
      "sais": "to know"
      "pas": "not"
    notes:
      "ne-dropped": "In speech the ne is often dropped, so people say je sais pas. The written form keeps both parts, ne and pas."
  "fr-0020":
    native: "Have a good day."
    bases:
      "journée": "day"
    notes:
      "agreement": "Bon agrees with journée, which is feminine, so it becomes bonne."
  "fr-0021":
    native: "to be"
    notes:
      "n1": "Être is the verb to be. It is used for what someone is: je suis (I am), il est (he is), nous sommes (we are). Its forms change more than most verbs."
    bases:
      "être": "to be"
    examples:
      "Je suis très bien.":
        native: "I am very well."
        bases:
          "suis": "to be"
      "Il est ici.":
        native: "He is here."
        bases:
          "est": "to be"
  "fr-0022":
    native: "to have"
    notes:
      "n1": "Avoir is to have. Its forms are the auxiliary of the past too: j'ai parlé (I have spoken)."
    bases:
      "avoir": "to have"
    examples:
      "J'ai faim.":
        native: "I am hungry."
        bases:
          "J'ai": "to have"
          "faim": "hunger"
      "Nous avons beaucoup de temps.":
        native: "We have a lot of time."
        bases:
          "avons": "to have"
          "de": "of"
  "fr-0023":
    native: "to speak"
    notes:
      "n1": "Parler is to speak. Its present forms follow the regular -er pattern: je parle, vous parlez."
    bases:
      "parler": "to speak"
    examples:
      "Je parle un peu français.":
        native: "I speak a little French."
        bases:
          "parle": "to speak"
          "un": "a; one"
          "peu": "a little"
          "français": "French"
      "Vous parlez bien.":
        native: "You speak well."
        bases:
          "parlez": "to speak"
  "fr-0024":
    native: "water"
    notes:
      "n1": "Eau is feminine, and before it the article is l' (l'eau). The plural is les eaux."
    bases:
      "l'eau": "water"
    examples:
      "Je voudrais de l'eau.":
        native: "I would like some water."
        bases:
          "voudrais": "to want"
          "de": "some; of"
          "l'eau": "water"
      "L'eau est bonne.":
        native: "The water is good."
        bases:
          "L'eau": "water"
