  "fr-0021":
    native: "to be"
    notes:
      "n1": "Être is the verb to be. It is used for what someone is: je suis (I am), il est (he is), nous sommes (we are). Its forms change more than most verbs."
    bases:
      "être": "to be"
    examples:
      "Je suis très bien.":
        native: "I am very well."
        bases:
          "suis": "to be"
      "Il est ici.":
        native: "He is here."
        bases:
          "est": "to be"
  "fr-0022":
    native: "to have"
    notes:
      "n1": "Avoir is to have. Its forms are the auxiliary of the past too: j'ai parlé (I have spoken)."
    bases:
      "avoir": "to have"
    examples:
      "J'ai faim.":
        native: "I am hungry."
        bases:
          "J'ai": "to have"
          "faim": "hunger"
      "Nous avons beaucoup de temps.":
        native: "We have a lot of time."
        bases:
          "avons": "to have"
          "de": "of"
          "temps": "time"
  "fr-0023":
    native: "to speak"
    notes:
      "n1": "Parler is to speak. Its present forms follow the regular -er pattern: je parle, vous parlez."
    bases:
      "parler": "to speak"
    examples:
      "Je parle un peu français.":
        native: "I speak a little French."
        bases:
          "parle": "to speak"
          "un": "a; one"
          "peu": "a little"
          "français": "French"
      "Vous parlez bien.":
        native: "You speak well."
        bases:
          "parlez": "to speak"
  "fr-0024":
    native: "water"
    notes:
      "n1": "Eau is feminine, and before it the article is l' (l'eau). The plural is les eaux."
    examples:
      "Je voudrais de l'eau.":
        native: "I would like some water."
        bases:
          "voudrais": "to want"
          "de": "some; of"
          "l'eau": "water"
      "L'eau est bonne.":
        native: "The water is good."
        bases:
          "L'eau": "water"
