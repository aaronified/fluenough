  "fr-1290":
    native: "The birds sing in the morning."
    confusables:
      "coq": { why: "Coq is 'rooster', a bird that crows, not the word for birds in general." }
      "chien": { why: "Chien is 'dog', an animal, not a bird." }
  "fr-1291":
    native: "My cat eats some fish."
    bases:
      "du": "some"
    confusables:
      "chien": { why: "Chien is 'dog', not 'cat'." }
      "lait": { why: "Lait is 'milk'; the cat eats fish here." }
  "fr-1292":
