    bases:
      "vivent": "live"
      "en": "in"
      "Afrique": "Africa"
  "fr-1293":
    native: "The tortoise is slow."
  "fr-1294":
    native: "The bee and the butterfly fly in a garden."
    bases:
      "volent": "fly"
    confusables:
      "fourmi": { why: "Fourmi is 'ant', a different insect from the bee or the butterfly." }
