schema: 1
id: "fr-en-describing"
kind: "layer"
core: "fr-describing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing things and feelings"
license: "CC-BY-SA-4.0"
description: "Adjectives for people, things and places: grand, petit, beau, joli, heureux, triste, plein, vide, ouvert and fermé. The feminine form is shown in the examples. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-0410":
    native: "big; tall"
    notes:
      "n1": "Grand is 'big' or 'tall'. Feminine grande is said with a d: grande (ɡʁɑ̃d). It comes before a noun or after être."
    examples:
      "Mon frère est grand.":
        native: "My brother is tall."
        bases:
          "grand": "big; tall"
      "Ma sœur est grande.":
        native: "My sister is tall."
        bases:
          "grande": "big; tall"
  "fr-0411":
    native: "small; short"
    notes:
      "n1": "Petit is 'small' or 'short'. Feminine petite is pronounced with a t: petite (pətit)."
    examples:
      "Mon ami est petit.":
        native: "My friend is short."
        bases:
          "petit": "small; short"
      "La ville est petite.":
        native: "The town is small."
        bases:
          "petite": "small; short"
  "fr-0412":
    native: "beautiful; handsome"
    notes:
      "n1": "Beau is 'beautiful' or 'handsome'. The feminine is belle, and the plural is beaux."
    examples:
      "Il est beau.":
        native: "He is handsome."
        bases:
          "beau": "beautiful; handsome"
      "Elle est belle.":
        native: "She is beautiful."
        bases:
          "belle": "beautiful; handsome"
  "fr-0413":
    native: "new"
    notes:
      "n1": "Nouveau is 'new'. Its feminine is nouvelle (nuvɛl), and it comes before its noun."
    examples:
      "Mon nouveau voisin est gentil.":
        native: "My new neighbour is kind."
        bases:
          "nouveau": "new"
      "Ma nouvelle voisine est jolie.":
        native: "My new neighbour is pretty."
        bases:
          "nouvelle": "new"
  "fr-0414":
    native: "pretty; nice"
    notes:
      "n1": "Joli is 'pretty' or 'nice'. Feminine jolie is said the same way as the masculine: jolie (ʒoli)."
    examples:
      "Elle est jolie.":
        native: "She is pretty."
        bases:
          "jolie": "pretty; nice"
      "Ce est joli.":
        native: "It is pretty."
        bases:
          "joli": "pretty; nice"
  "fr-0415":
    native: "ugly"
    notes:
      "n1": "Laid is 'ugly'. Its feminine is laide (lɛd), and its opposite is beau."
    examples:
      "Ce est laid.":
        native: "It is ugly."
        bases:
          "laid": "ugly"
      "Il n'est pas laid.":
        native: "He is not ugly."
        bases:
          "pas": "not"
          "laid": "ugly"
  "fr-0416":
    native: "bad"
    notes:
      "n1": "Mauvais is 'bad'. Its opposite is bon. The feminine is mauvaise (movɛz)."
    examples:
      "Ce est mauvais.":
        native: "It is bad."
        bases:
          "mauvais": "bad"
      "Ma sœur est mauvaise.":
        native: "My sister is bad."
        bases:
          "mauvaise": "bad"
  "fr-0417":
    native: "easy"
    notes:
      "n1": "Facile is 'easy'. It is the same for masculine and feminine: facile (fasil), facile."
    examples:
      "Ce est facile.":
        native: "It is easy."
        bases:
          "facile": "easy"
      "Le français est facile.":
        native: "French is easy."
        bases:
          "facile": "easy"
  "fr-0418":
    native: "difficult; hard"
    notes:
      "n1": "Difficile is 'difficult' or 'hard'. It is the same for masculine and feminine."
    examples:
      "Ce est difficile.":
        native: "It is difficult."
        bases:
          "difficile": "difficult; hard"
      "Ce n'est pas difficile.":
        native: "It is not difficult."
        bases:
          "pas": "not"
          "difficile": "difficult; hard"
  "fr-0419":
    native: "hot; warm"
    notes:
      "n1": "Chaud is 'hot' or 'warm'. The feminine is chaude (ʃod). Avoir chaud means 'to be hot' (of a person)."
    examples:
      "Il fait chaud.":
        native: "It is hot."
        bases:
          "chaud": "hot; warm"
      "Elle a chaud.":
        native: "She is hot."
        bases:
          "chaud": "hot; warm"
  "fr-0420":
    native: "cold"
    notes:
      "n1": "Froid is 'cold'. Avoir froid means 'to be cold' (of a person), as avoir chaud means 'to be hot'."
    examples:
      "Nous avons froid.":
        native: "We are cold."
        bases:
          "froid": "cold"
      "Ce est froid.":
        native: "It is cold."
        bases:
          "froid": "cold"
  "fr-0421":
    native: "long"
    notes:
      "n1": "Long is 'long'. The feminine is longue, said with a g: longue (lɔ̃g)."
    examples:
      "Ce est long.":
        native: "It is long."
        bases:
          "long": "long"
      "Ma vie est longue.":
        native: "My life is long."
        bases:
          "longue": "long"
  "fr-0422":
    native: "short (in length)"
    notes:
      "n1": "Court is 'short' in length. The feminine is courte (kuʁt). Use petit for short in height."
    examples:
      "Mon nom est court.":
        native: "My name is short."
        bases:
          "court": "short (in length)"
      "Ce est court.":
        native: "It is short."
        bases:
          "court": "short (in length)"
  "fr-0423":
    native: "high; tall"
    notes:
      "n1": "Haut is 'high' or 'tall'. The feminine is haute (ot). Its opposite is bas."
    examples:
      "Ce est haut.":
        native: "It is high."
        bases:
          "haut": "high; tall"
      "Ma tante est haute.":
        native: "My aunt is tall."
        bases:
          "haute": "high; tall"
  "fr-0424":
    native: "low"
    notes:
      "n1": "Bas is 'low'. Its feminine is basse (bas). It is also used for 'quietly' with parler: parler bas."
    examples:
      "Ce est bas.":
        native: "It is low."
        bases:
          "bas": "low"
      "Il parle bas.":
        native: "He speaks softly."
        bases:
          "bas": "low"
  "fr-0425":
    native: "strong; loud"
    notes:
      "n1": "Fort is 'strong' or 'loud'. Its feminine is forte (fɔʁt), said with the t."
    examples:
      "Mon père est fort.":
        native: "My father is strong."
        bases:
          "fort": "strong; loud"
      "Ma mère est forte.":
        native: "My mother is strong."
        bases:
          "forte": "strong; loud"
  "fr-0426":
    native: "weak"
    notes:
      "n1": "Faible is 'weak'. It is the same for masculine and feminine: faible (fɛbl)."
    examples:
      "Il est faible.":
        native: "He is weak."
        bases:
          "faible": "weak"
      "Ma sœur est faible.":
        native: "My sister is weak."
        bases:
          "faible": "weak"
  "fr-0427":
    native: "clean; own"
    notes:
      "n1": "Propre is 'clean', and it also means 'own', as in mon propre livre (my own book). It comes before its noun in that sense."
    examples:
      "Ce est propre.":
        native: "It is clean."
        bases:
          "propre": "clean; own"
      "Mon ami est propre.":
        native: "My friend is clean."
        bases:
          "propre": "clean; own"
  "fr-0428":
    native: "dirty"
    notes:
      "n1": "Sale is 'dirty'. It is the opposite of propre (clean)."
    examples:
      "Ce est sale.":
        native: "It is dirty."
        bases:
          "sale": "dirty"
      "Vous êtes sale.":
        native: "You are dirty."
        bases:
          "sale": "dirty"
  "fr-0429":
    native: "happy"
    notes:
      "n1": "Heureux is 'happy'. The feminine is heureuse (øʁøz), and its opposite is triste."
    examples:
      "Il est heureux.":
        native: "He is happy."
        bases:
          "heureux": "happy"
      "Elle est heureuse.":
        native: "She is happy."
        bases:
          "heureuse": "happy"
  "fr-0430":
    native: "sad"
    notes:
      "n1": "Triste is 'sad'. It is the same for masculine and feminine. Its opposite is heureux."
    examples:
      "Je suis triste.":
        native: "I am sad."
        bases:
          "triste": "sad"
      "Ma mère est triste.":
        native: "My mother is sad."
        bases:
          "triste": "sad"
  "fr-0431":
    native: "tired"
    notes:
      "n1": "Fatigué is 'tired'. The feminine is fatiguée. Verbs in -er give adjectives like this one, with the same spelling."
    examples:
      "Je suis fatigué.":
        native: "I am tired."
        bases:
          "fatigué": "tired"
      "Ma sœur est fatiguée.":
        native: "My sister is tired."
        bases:
          "fatiguée": "tired"
  "fr-0432":
    native: "ill; sick"
    notes:
      "n1": "Malade is 'ill' or 'sick'. It is the same for masculine and feminine. Avoid it as an insult."
    examples:
      "Il est malade.":
        native: "He is ill."
        bases:
          "malade": "ill; sick"
      "Ma mère est malade.":
        native: "My mother is ill."
        bases:
          "malade": "ill; sick"
  "fr-0433":
    native: "calm; quiet"
    notes:
      "n1": "Calme is 'calm' or 'quiet'. It is the same for masculine and feminine."
    examples:
      "Il est calme.":
        native: "He is calm."
        bases:
          "calme": "calm; quiet"
      "Ma sœur est calme.":
        native: "My sister is calm."
        bases:
          "calme": "calm; quiet"
  "fr-0434":
    native: "kind; nice"
    notes:
      "n1": "Gentil is 'kind' or 'nice'. The feminine is gentille (ʒɑ̃tij)."
    examples:
      "Mon voisin est gentil.":
        native: "My neighbour is kind."
        bases:
          "gentil": "kind; nice"
      "Elle est gentille.":
        native: "She is kind."
        bases:
          "gentille": "kind; nice"
  "fr-0435":
    native: "clever; intelligent"
    notes:
      "n1": "Intelligent is 'clever' or 'intelligent'. The feminine is intelligente (ɛ̃teliʒɑ̃t)."
    examples:
      "Il est intelligent.":
        native: "He is clever."
        bases:
          "intelligent": "clever; intelligent"
      "Elle est intelligente.":
        native: "She is clever."
        bases:
          "intelligente": "clever; intelligent"
  "fr-0436":
    native: "funny"
    notes:
      "n1": "Drôle is 'funny' or 'strange'. It is the same for masculine and feminine."
    examples:
      "Ce est drôle.":
        native: "It is funny."
        bases:
          "drôle": "funny"
      "Mon ami est drôle.":
        native: "My friend is funny."
        bases:
          "drôle": "funny"
  "fr-0437":
    native: "open"
    notes:
      "n1": "Ouvert is 'open'. Its feminine is ouverte (uvɛʁt). Its opposite is fermé."
    examples:
      "La gare est ouverte.":
        native: "The station is open."
        bases:
          "ouverte": "open"
      "Le musée est ouvert.":
        native: "The museum is open."
        bases:
          "ouvert": "open"
  "fr-0438":
    native: "closed; shut"
    notes:
      "n1": "Fermé is 'closed' or 'shut'. Its feminine is fermée. Its opposite is ouvert."
    examples:
      "La gare est fermée.":
        native: "The station is closed."
        bases:
          "fermée": "closed; shut"
      "Le musée est fermé.":
        native: "The museum is closed."
        bases:
          "fermé": "closed; shut"
  "fr-0439":
    native: "full"
    notes:
      "n1": "Plein is 'full'. Its feminine is pleine (plɛn). Its opposite is vide."
    examples:
      "Le train est plein.":
        native: "The train is full."
        bases:
          "plein": "full"
      "Ma tasse est pleine.":
        native: "My cup is full."
        bases:
          "pleine": "full"
  "fr-0440":
    native: "empty"
    notes:
      "n1": "Vide is 'empty'. It is the same for masculine and feminine. Its opposite is plein."
    examples:
      "Ce verre est vide.":
        native: "This glass is empty."
        bases:
          "vide": "empty"
      "La tasse est vide.":
        native: "The cup is empty."
        bases:
          "vide": "empty"
  "fr-0441":
    native: "light"
    notes:
      "n1": "Léger is 'light', not heavy. Its feminine is légère (leʒɛʁ). Its opposite is lourd."
    examples:
      "Ce est léger.":
        native: "It is light."
        bases:
          "léger": "light"
      "Elle est légère.":
        native: "She is light."
        bases:
          "légère": "light"
  "fr-0442":
    native: "heavy"
    notes:
      "n1": "Lourd is 'heavy'. Its feminine is lourde (luʁd). Its opposite is léger."
    examples:
      "Ce est lourd.":
        native: "It is heavy."
        bases:
          "lourd": "heavy"
      "Il est lourd.":
        native: "He is heavy."
        bases:
          "lourd": "heavy"
  "fr-0443":
    native: "important"
    notes:
      "n1": "Important is 'important'. The feminine is importante (ɛ̃poʁtɑ̃t)."
    examples:
      "Ce est important.":
        native: "It is important."
        bases:
          "important": "important"
      "Le nom est important.":
        native: "The name is important."
        bases:
          "important": "important"
  "fr-0444":
    native: "free"
    notes:
      "n1": "Libre is 'free', as not busy or not controlled. It is the same for masculine and feminine."
    examples:
      "Je suis libre.":
        native: "I am free."
        bases:
          "libre": "free"
      "Ma sœur est libre.":
        native: "My sister is free."
        bases:
          "libre": "free"
  "fr-0445":
    native: "rich"
    notes:
      "n1": "Riche is 'rich'. It is the same for masculine and feminine. Its opposite is pauvre."
    examples:
      "Il est riche.":
        native: "He is rich."
        bases:
          "riche": "rich"
      "Elle est riche.":
        native: "She is rich."
        bases:
          "riche": "rich"
  "fr-0446":
    native: "poor"
    notes:
      "n1": "Pauvre is 'poor'. It is the same for masculine and feminine. It comes before its noun in some uses."
    examples:
      "Il est pauvre.":
        native: "He is poor."
        bases:
          "pauvre": "poor"
      "Mon voisin est pauvre.":
        native: "My neighbour is poor."
        bases:
          "pauvre": "poor"
  "fr-0447":
    native: "fast; quick"
    notes:
      "n1": "Rapide is 'fast' or 'quick'. It is the same for masculine and feminine. Its opposite is lent."
    examples:
      "Ce est rapide.":
        native: "It is fast."
        bases:
          "rapide": "fast; quick"
      "Le train est rapide.":
        native: "The train is fast."
        bases:
          "rapide": "fast; quick"
  "fr-0448":
    native: "slow"
    notes:
      "n1": "Lent is 'slow'. The feminine is lente (lɑ̃t). Its opposite is rapide."
    examples:
      "Il est lent.":
        native: "He is slow."
        bases:
          "lent": "slow"
      "Elle est lente.":
        native: "She is slow."
        bases:
          "lente": "slow"
  "fr-0449":
    native: "hard"
    notes:
      "n1": "Dur is 'hard' or 'tough'. The feminine is dure (dyʁ) and it means 'harsh' in some uses."
    examples:
      "Ce est dur.":
        native: "It is hard."
        bases:
          "dur": "hard"
      "La vie est dure.":
        native: "Life is hard."
        bases:
          "dure": "hard"
  "fr-0450":
    native: "noisy"
    notes:
      "n1": "Bruyant is 'noisy'. The feminine is bruyante (bʁɥijɑ̃t)."
    examples:
      "Le train est bruyant.":
        native: "The train is noisy."
        bases:
          "bruyant": "noisy"
      "Ma rue est bruyante.":
        native: "My street is noisy."
        bases:
          "bruyante": "noisy"
