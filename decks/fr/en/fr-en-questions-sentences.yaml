schema: 1
id: "fr-en-questions-sentences"
kind: "layer"
core: "fr-questions-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences: asking questions"
license: "CC-BY-SA-4.0"
description: "Eight sentences that ask questions with the words of Questions, each with the question words it is often mixed up with. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-0081":
    native: "Where is the station, please?"
    bases:
      "s'il": "if"
      "plaît": "to please"
    confusables:
      "when": { why: "Quand asks when, not where." }
      "how": { why: "Comment asks how, not where." }
    notes:
      "word-order": "With a noun subject the verb can stay in front of it, as in Où est la gare. A pronoun subject is inverted instead, as in Où est-elle."
  "fr-0082":
    native: "When does the train leave?"
    bases:
      "part": "to leave"
    confusables:
      "where": { why: "Où asks where, not when." }
      "how-much": { why: "Combien asks how much, not when." }
    notes:
      "word-order": "With a noun subject the verb can stay in front of it: Quand part le train? The same question with a pronoun would invert it."
  "fr-0083":
    native: "How are you today? (formal)"
    bases:
      "allez": "to go"
    confusables:
      "why": { why: "Pourquoi asks why, not how." }
      "what": { why: "Quoi asks what; this sentence asks how." }
    notes:
      "inversion": "Allez-vous, 'are you', is inverted with vous and joined with a hyphen; comment allez-vous is the formal 'how are you'."
  "fr-0084":
    native: "Why is the station closed?"
    bases:
      "fermée": "to close"
    confusables:
      "where": { why: "Où asks where the station is, not why it is closed." }
      "how-much": { why: "Combien asks how much, not why." }
    notes:
      "inversion": "With a pronoun subject the verb and pronoun swap and are joined with a hyphen: est-elle, 'is she'."
  "fr-0085":
    native: "How much does this train cost?"
    bases:
      "coûte": "to cost"
    confusables:
      "which": { why: "Quel asks which one; this sentence asks the price." }
      "when": { why: "Quand asks when, not how much." }
    notes:
      "ce": "Ce is the masculine form of 'this' before a consonant. The feminine is cette, and cet is used before a vowel."
  "fr-0086":
    native: "What time is it?"
    confusables:
      "how-much": { why: "Combien asks how much, not what time." }
      "when": { why: "Quand asks when; the sentence asks the time, which is different." }
    notes:
      "inversion": "Quelle heure est-il ? is the usual way to ask the time: est and il are inverted and joined with a hyphen."
  "fr-0087":
    native: "Who is the doctor?"
    confusables:
      "what": { why: "Quoi asks what, not who." }
      "where": { why: "Où asks where, not who." }
  "fr-0088":
    native: "Tomorrow, where is the museum?"
    confusables:
      "when": { why: "Quand asks when; the sentence asks where." }
      "how-much": { why: "Combien asks how much, not where." }
    notes:
      "word-order": "Où with a noun subject keeps the verb before the subject: où est le musée. Demain comes first, as a time phrase."
