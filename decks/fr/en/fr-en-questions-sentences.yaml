cards:
  "fr-0081":
    native: "Where is the station, please?"
    bases:
      "la": "the"
      "s'il": "if"
      "plaît": "to please"
    confusables:
      "when": { why: "Quand asks when, not where." }
      "how": { why: "Comment asks how, not where." }
  "fr-0082":
    native: "When does the train leave?"
    bases:
      "part": "to leave"
      "le": "the"
    confusables:
      "where": { why: "Où asks where, not when." }
      "how-much": { why: "Combien asks how much, not when." }
  "fr-0083":
    native: "How are you today? (formal)"
    bases:
      "allez": "to go"
    confusables:
      "why": { why: "Pourquoi asks why, not how." }
      "what": { why: "Quoi asks what; this sentence asks how." }
  "fr-0084":
    native: "Why is the station closed?"
    bases:
      "la": "the"
      "fermée": "to close"
    confusables:
      "where": { why: "Où asks where the station is, not why it is closed." }
      "how-much": { why: "Combien asks how much, not why." }
  "fr-0085":
    native: "How much does this train cost?"
    bases:
      "coûte": "to cost"
    confusables:
      "which": { why: "Quel asks which one; this sentence asks the price." }
      "when": { why: "Quand asks when, not how much." }
  "fr-0086":
