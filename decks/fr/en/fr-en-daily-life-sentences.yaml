kind: "layer"
core: "fr-daily-life-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences: daily life"
license: "CC-BY-SA-4.0"
description: "Eight sentences about an ordinary day, each with the words it is often mixed up with. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-1138":
    native: "I wake the baby in the morning."
    confusables:
      "réveil": { why: "Réveil is the noun 'alarm clock' or 'waking up'; the verb is réveiller." }
      "déranger": { why: "Déranger is 'to disturb', not 'to wake'." }
  "fr-1139":
    native: "Breakfast is ready."
    confusables:
      "repas": { why: "Repas is 'meal' in general." }
      "dîner": { why: "Dîner is 'dinner', the evening meal." }
  "fr-1140":
    native: "I am in a hurry this morning."
    confusables:
      "tranquille": { why: "Tranquille is 'quiet' or 'calm', the opposite of being in a hurry." }
      "lent": { why: "Lent is 'slow', a speed of a thing, not a mood." }
  "fr-1141":
    native: "The day is long, but I sleep well."
    confusables:
      "fatigue": { why: "Fatigue is the noun 'tiredness', a state." }
      "sommeil": { why: "Sommeil is the noun 'sleep'." }
  "fr-1142":
    native: "The noise disturbs the neighbour."
    confusables:
      "silence": { why: "Silence is 'silence', the opposite of noise." }
      "tranquille": { why: "Tranquille is 'quiet', the state the neighbour loses." }
  "fr-1143":
    native: "I go home in the evening."
    confusables:
      "sortir": { why: "Sortir is 'to go out', the opposite direction." }
      "emmener": { why: "Emmener is 'to take someone along'." }
  "fr-1144":
    native: "You are tired."
    confusables:
      "fatigue": { why: "Fatigue is the noun 'tiredness'; the sentence uses the adjective." }
      "repos": { why: "Repos is 'rest', the noun." }
  "fr-1145":
    native: "The light is in the corridor."
    confusables:
      "fenêtre": { why: "Fenêtre is 'window'." }
      "porte": { why: "Porte is 'door'." }
