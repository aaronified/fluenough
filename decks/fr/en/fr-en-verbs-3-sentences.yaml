schema: 1
id: "fr-en-verbs-3-sentences"
kind: "layer"
core: "fr-verbs-3-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences: more verbs (3)"
license: "CC-BY-SA-4.0"
description: "Ten sentences using the verbs of this unit, each with the words it is often mixed up with. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-3285":
    native: "I do not hesitate to leave."
    confusables:
      "permettre": { why: "to allow, not to hesitate" }
      "tenter": { why: "to try, which is not hesitating" }
    bases:
      "n'hésite": "hesitate"
      "pas": "not"
      "à": "to"
    notes:
      "ne-pas": "Ne and pas wrap the verb: je n'hésite pas, 'I do not hesitate'. See the unit Negation: ne ... pas."
  "fr-3286":
    native: "Do you promise to come tomorrow?"
    confusables:
      "permettre": { why: "to allow, a different promise" }
      "garder": { why: "to keep, not to promise" }
    bases:
      "promets": "promise"
      "de": "of"
    notes:
      "promettre": "Promettre is like mettre: tu promets, 'you promise', is followed by de and a verb."
  "fr-3287":
    native: "We are cancelling the appointment."
    confusables:
      "confirmer": { why: "to confirm, the opposite of cancelling" }
      "remplacer": { why: "to replace, not to cancel" }
    bases:
      "annulons": "cancel"
    notes:
      "annuler": "Annuler is regular: nous annulons, 'we cancel', with the -ons ending."
  "fr-3288":
    native: "He phones his mother."
    confusables:
      "composer": { why: "to dial a number, not to phone" }
      "joindre": { why: "to reach someone, which can be by phone" }
    bases:
      "téléphone": "phones"
      "à": "at"
    notes:
      "telephoner": "Téléphoner takes à before the person called: il téléphone à sa mère."
  "fr-3289":
    native: "Don't touch the window!"
    confusables:
      "fixer": { why: "to stare at, not to touch" }
      "lever": { why: "to lift, not to touch" }
    bases:
      "Ne": "not"
      "touche": "touch"
      "pas": "not"
      "à": "to"
    notes:
      "ne-pas": "Ne and pas wrap the verb in a command: ne touche pas, 'do not touch'. See the unit Negation: ne ... pas."
  "fr-3290":
    native: "She raises her hand to speak."
    confusables:
      "sentir": { why: "to smell or to feel, not to raise" }
      "crier": { why: "to shout, not to raise a hand" }
    bases:
      "lève": "raises"
    notes:
      "lever": "Lever changes its e to è before a silent ending: je lève, 'I raise', but nous levons keeps the e."
  "fr-3291":
    native: "Why are you taking off your shoes?"
    confusables:
      "attacher": { why: "to fasten, not to remove" }
      "detacher": { why: "to unfasten, a different action" }
    bases:
      "enlèves": "takes off"
      "tes": "your"
      "chaussures": "shoes"
    notes:
      "enlever": "Enlever changes its e to è before a silent ending: j'enlève, 'I take off', but nous enlevons keeps the e."
  "fr-3292":
    native: "That seems very easy."
    confusables:
      "sentir": { why: "to smell or to feel, not to seem" }
      "profiter": { why: "to enjoy, not to seem" }
    bases:
      "Ça": "it"
      "semble": "seems"
  "fr-3293":
    native: "We enjoy the sun."
    confusables:
      "bailler": { why: "to yawn, not to enjoy" }
      "preferer": { why: "to prefer, not to enjoy" }
    bases:
      "profitons": "enjoy"
      "du": "of the"
    notes:
      "du": "De and le join to form du: profiter du soleil, 'to enjoy the sun'. See the unit The contractions au, du, aux and des."
  "fr-3294":
    native: "I love music; I prefer jazz."
    confusables:
      "chuchoter": { why: "to whisper, not to love" }
      "crier": { why: "to shout, not to love" }
    bases:
      "J'adore": "love"
      "préfère": "prefer"
      "jazz": "jazz"
    notes:
      "preferer": "Préférer has é in the stem and è before a silent ending: je préfère, 'I prefer'."
