cards:
  "fr-2476":
    native: "housing, accommodation"
    notes:
      "n1": "Un logement is a place to live, such as a flat or house."
    examples:
      "Je cherche un logement.":
        native: "I am looking for accommodation."
        bases:
          "logement": "housing, accommodation"
      "Le logement est très cher.":
        native: "Accommodation is very expensive."
        bases:
          "logement": "housing, accommodation"
  "fr-2477":
    native: "rent"
    notes:
      "n1": "Un loyer is the money paid each month to rent a home."
    examples:
      "Le loyer est de huit cents euros.":
        native: "The rent is eight hundred euros."
        bases:
          "loyer": "rent"
          "de": "of, from, some"
      "Je paie mon loyer le premier.":
        native: "I pay my rent on the first."
        bases:
          "loyer": "rent"
  "fr-2478":
    native: "tenant"
    notes:
      "n1": "Un locataire rents a home; it is used for both genders."
    examples:
      "Le locataire paie le loyer.":
        native: "The tenant pays the rent."
        bases:
          "locataire": "tenant"
      "Ma sœur est locataire.":
        native: "My sister is a tenant."
        bases:
          "locataire": "tenant"
  "fr-2479":
    native: "owner, landlord"
    notes:
      "n1": "Un propriétaire owns a home; it is used for both genders."
    examples:
      "Le propriétaire répare la porte.":
        native: "The landlord repairs the door."
        bases:
          "propriétaire": "owner, landlord"
      "Elle est propriétaire de la maison.":
        native: "She is the owner of the house."
        bases:
          "propriétaire": "owner, landlord"
          "de": "of, from, some"
  "fr-2480":
    native: "lease"
    notes:
      "n1": "Un bail is the rental contract for a home."
    examples:
      "Le bail dure trois ans.":
        native: "The lease lasts three years."
        bases:
          "bail": "lease"
      "Nous signons le bail demain.":
        native: "We sign the lease tomorrow."
        bases:
          "bail": "lease"
  "fr-2481":
    native: "deposit, guarantee"
    notes:
      "n1": "Une caution is a sum paid as a guarantee for a rental."
    examples:
      "La caution est de deux mois de loyer.":
        native: "The deposit is two months’ rent."
        bases:
          "caution": "deposit, guarantee"
          "de": "of, from, some"
      "Je rends la caution à la fin.":
