id: "fr-en-multiword-pronominal"
kind: "layer"
core: "fr-multiword-pronominal"
native:
  code: "en"
  iso639_3: "eng"
  name: "English"
name: "Multi-word verbs: pronominal verbs"
description: "Twenty reflexive verbs: get up, lie down, wash oneself, get dressed, wake up, go for a walk, hurry, go away, remember, get married, rest, get angry, worry, have fun, realise, feel, make\
  \ a mistake, look after, be interested in, and remember someone. Not yet checked by a French speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags:
- "unreviewed"
cards:
  "fr-4450":
    native: "to get up"
    notes:
      u1: "Se lever is the reflexive form of lever (to raise): il se lève tôt, he gets up early."
    bases:
      se: "reflexive pronoun: oneself"
  "fr-4451":
    native: "to lie down; to go to bed"
    notes:
      u1: "Se coucher means to lie down or go to bed. Coucher alone means to put someone to bed."
    bases:
      se: "reflexive pronoun: oneself"
      coucher: "to put to bed; to lay down"
  "fr-4452":
    native: "to wash oneself"
    notes:
      u1: "Se laver means to wash oneself; with a body part the article is les: je me lave les mains."
    bases:
      se: "reflexive pronoun: oneself"
  "fr-4453":
    native: "to get dressed"
    notes:
      u1: "S'habiller means to get dressed. Habiller alone means to dress someone else."
    bases:
      "s'habiller": "to get dressed"
  "fr-4454":
    native: "to wake up"
    notes:
      u1: "Se réveiller means to wake up oneself. Réveiller alone means to wake someone else."
    bases:
      se: "reflexive pronoun: oneself"
  "fr-4455":
    native: "to go for a walk"
    notes:
      u1: "Se promener means to walk for exercise or for pleasure."
    bases:
      se: "reflexive pronoun: oneself"
      promener: "to walk; to take for a walk"
  "fr-4456":
    native: "to hurry"
    notes:
      u1: "Se dépêcher means to hurry: je me dépêche, I am hurrying. Dépêche-toi is the command 'hurry up'."
    bases:
      se: "reflexive pronoun: oneself"
      "dépêcher": "to hurry; to send quickly"
  "fr-4457":
    native: "to go away"
    notes:
      u1: "S'en aller means to leave or go away: il s'en va, he is going away."
    bases:
      "s'en": "of it; from there"
  "fr-4458":
    native: "to remember"
    notes:
      u1: "Se rappeler means to remember and takes its object directly, with no de: je me rappelle quelque chose."
    bases:
      se: "reflexive pronoun: oneself"
  "fr-4459":
    native: "to get married"
    notes:
      u1: "Se marier means to get married. With avec the spouse comes after: il se marie avec elle."
    bases:
      se: "reflexive pronoun: oneself"
  "fr-4460":
    native: "to rest"
    notes:
      u1: "Se reposer means to rest: je me repose, I am resting."
    bases:
      se: "reflexive pronoun: oneself"
      reposer: "to rest; to put down again"
  "fr-4461":
    native: "to get angry"
    notes:
      u1: "Se fâcher means to become angry. With avec it means to fall out with someone."
    bases:
      se: "reflexive pronoun: oneself"
      "fâcher": "to anger"
  "fr-4462":
    native: "to worry"
    notes:
      u1: "S'inquiéter means to worry or be anxious: il s'inquiète, he is worried."
    bases:
      "s'inquiéter": "to worry"
  "fr-4463":
    native: "to have fun"
    notes:
      u1: "S'amuser means to have fun or enjoy oneself. Amuser alone means to amuse someone."
    bases:
      "s'amuser": "to have fun"
  "fr-4464":
    native: "to realise"
    notes:
      u1: "Se rendre compte means to become aware of something: je me rends compte de mon erreur."
    bases:
      se: "reflexive pronoun: oneself"
  "fr-4465":
    native: "to feel"
    notes:
      u1: "Se sentir with an adjective says how one feels: il se sent bien, he feels well."
    bases:
      se: "reflexive pronoun: oneself"
  "fr-4466":
    native: "to make a mistake"
    notes:
      u1: "Se tromper means to make a mistake or be wrong. With de it means to take the wrong one: se tromper de route."
    bases:
      se: "reflexive pronoun: oneself"
      tromper: "to deceive; to make a mistake"
  "fr-4467":
    native: "to look after"
    notes:
      u1: "S'occuper de means to look after or deal with someone or something: je m'occupe des enfants. Occuper alone means to occupy."
    bases:
      "s'occuper": "to look after; to deal with"
      de: "of; from; about"
  "fr-4468":
    native: "to be interested in"
    notes:
      u1: "S'intéresser à means to be interested in something, and à follows the verb."
    bases:
      "s'intéresser": "to be interested"
      "à": "at; to; of"
  "fr-4469":
    native: "to remember (someone or something)"
    notes:
      u1: "Se souvenir de takes de before the thing remembered: je me souviens de lui, I remember him."
    bases:
      se: "reflexive pronoun: oneself"
      souvenir: "a form of se souvenir (to remember); not the noun"
      de: "of; from; about"
