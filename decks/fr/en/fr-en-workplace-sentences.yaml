schema: 1
id: "fr-en-workplace-sentences"
kind: "layer"
core: "fr-workplace-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The workplace sentences"
license: "CC-BY-SA-4.0"
description: "Example sentences about the workplace, each with the words it is often mixed up with. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-3680":
    native: "The person in charge signs the contract."
    bases:
      "responsable": "person in charge"
      "signe": "signs"
    confusables:
      "employeur": { why: "Employeur is the employer; responsable is the person who is in charge." }
      "assistant": { why: "Assistant helps a manager; the one who signs is in charge." }
    notes:
      "contrat": "Un contrat is a written agreement with legal force: le responsable signe le contrat. The word card for contrat gives this."
  "fr-3681":
    native: "I make a photocopy of the report."
    bases:
      "fais": "do"
      "photocopie": "photocopy"
      "du": "of the"
      "rapport": "report"
    confusables:
      "copie": { why: "Copie is a copy in general; photocopie is a copy from a machine." }
      "presentation": { why: "Présentation is a talk for others, not a copy." }
    notes:
      "du": "De and le join to form du: une photocopie du rapport, 'a photocopy of the report'. See the unit The contractions au, du, aux and des."
  "fr-3682":
    native: "The trainee arrives at nine."
    bases:
      "stagiaire": "trainee"
      "arrive": "arrives"
      "à": "to, at"
      "heures": "hours"
    confusables:
      "assistant": { why: "Assistant is a helper with a job; stagiaire is a person who is learning." }
      "employeur": { why: "Employeur is the one who employs; a trainee is not yet hired." }
    notes:
      "arriver": "Arriver is 'to arrive', and il arrive is 'he arrives': le stagiaire arrive à neuf heures. The word card for arriver gives this."
  "fr-3683":
    native: "The meeting starts at ten."
    bases:
      "réunion": "meeting"
      "commence": "starts"
      "à": "to, at"
      "heures": "hours"
    confusables:
      "presentation": { why: "Présentation is a talk; réunion is the meeting itself." }
      "bilan": { why: "Bilan is a review of results, not the meeting." }
    notes:
      "reunion": "Une réunion is a meeting, a feminine noun: la réunion commence à dix heures. The word card for réunion gives this."
  "fr-3684":
    native: "The boss's email arrived this morning."
    bases:
      "mail": "email"
      "du": "of the"
      "est": "is"
      "arrivé": "arrived"
    confusables:
      "courrier": { why: "Courrier is post; mail is an electronic message." }
      "memo": { why: "Mémo is a written note inside the office, not an email." }
    notes:
      "du": "De and le join to form du: le mail du patron, 'the boss's email'. See the unit The contractions au, du, aux and des."
  "fr-3685":
    native: "The pay is paid on the thirtieth of the month."
    bases:
      "paie": "pay"
      "est": "is"
      "versée": "paid"
      "du": "of the"
    confusables:
      "bulletin": { why: "Bulletin is the payslip that comes with the pay." }
      "prime": { why: "Prime is a bonus, extra money, not the regular pay." }
    notes:
      "du": "De and le join to form du: le trente du mois, 'the thirtieth of the month'. See the unit The contractions au, du, aux and des."
  "fr-3686":
    native: "IT has been down since yesterday."
    bases:
      "L'informatique": "IT"
      "est": "is"
      "en": "in"
      "depuis": "since, from"
    confusables:
      "ordinateur": { why: "Ordinateur is a computer; informatique is the whole field of computers." }
      "logiciel": { why: "Logiciel is a program; informatique is the whole field." }
    notes:
      "panne": "Une panne is a breakdown of a machine or vehicle: l'informatique est en panne. The word card for panne gives this."
  "fr-3687":
    native: "The folder is on the director's desk."
    bases:
      "classeur": "folder, binder"
      "est": "is"
      "du": "of the"
    confusables:
      "pochette": { why: "Pochette is a thin folder; classeur is a thicker binder." }
      "copieur": { why: "Copieur is a copying machine, not a place to keep folders." }
    notes:
      "du": "De and le join to form du: le bureau du directeur, 'the manager's desk'. See the unit The contractions au, du, aux and des."
  "fr-3688":
    native: "The monthly review is posted on the wall."
    bases:
      "bilan": "review"
      "du": "of the"
      "est": "is"
      "affiché": "posted"
    confusables:
      "planning": { why: "Planning is a schedule of who works when, not a review." }
      "rapport": { why: "Rapport is a written report, the document a review is based on." }
    notes:
      "du": "De and le join to form du: le bilan du mois, 'the monthly report'. See the unit The contractions au, du, aux and des."
  "fr-3689":
    native: "The client's form is in the binder."
    bases:
      "fiche": "form, record card"
      "du": "of the"
      "est": "is"
      "classeur": "folder, binder"
    confusables:
      "dossier": { why: "Dossier is a file or case folder, not a form." }
      "pochette": { why: "Pochette is a thin folder; classeur is a binder." }
    notes:
      "du": "De and le join to form du: la fiche du client, 'the customer's card'. See the unit The contractions au, du, aux and des."
