schema: 1
id: "fr-en-multiword-verb-preposition"
kind: "layer"
core: "fr-multiword-verb-preposition"
native:
  code: "en"
  iso639_3: "eng"
  name: "English"
name: "Multi-word verbs: verb and preposition"
description: "Eighteen verbs with the preposition they take: think of, talk about, dream of, depend on, need, be afraid of, use, play a game, play an instrument, believe in, count on, manage to, begin\
  \ to, begin with, end up, try to, and learn to. Not yet checked by a French speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags:
- "unreviewed"
cards:
  "fr-4500":
    native: "to think of or about"
    notes:
      u1: "Penser à means to think of or about something or someone: je pense à toi, I am thinking of you. Penser de means to have an opinion of something."
    bases:
      "à": "at; to; of"
  "fr-4501":
    native: "to talk about"
    notes:
      u1: "Parler de means to talk about a subject: nous parlons de la météo, we are talking about the weather. Parler à means to talk to someone."
    bases:
      de: "of; about; from"
  "fr-4502":
    native: "to dream of"
    notes:
      u1: "Rêver de means to dream of something, or to long for it: je rêve de voyager, I dream of travelling."
    bases:
      de: "of; from; about"
  "fr-4503":
    native: "to depend on"
    notes:
      u1: "Dépendre de means to depend on something or someone: ça dépend de toi, it depends on you."
    bases:
      "dépendre": "to depend; to take down"
      de: "of; from; about"
  "fr-4504":
    native: "to need"
    notes:
      u1: "Avoir besoin de takes de before a noun or an infinitive: j'ai besoin d'aide, I need help. Besoin alone is the noun need."
    bases:
      de: "of; from; about"
  "fr-4505":
    native: "to be afraid of"
    notes:
      u1: "Avoir peur de means to be afraid of something or someone, and takes de before a noun or an infinitive."
    bases:
      de: "of; from; about"
  "fr-4506":
    native: "to use"
    notes:
      u1: "Se servir de means to use something: je me sers d'un stylo, I use a pen. Servir alone means to serve."
    bases:
      se: "reflexive pronoun: oneself"
      de: "of; from; about"
  "fr-4507":
    native: "to play a game or a sport"
    notes:
      u1: "Jouer à is used with games and sports: il joue au football, he plays football. Jouer de is used with instruments."
    bases:
      "à": "at; to; of"
  "fr-4508":
    native: "to play an instrument"
    notes:
      u1: "Jouer de is used with musical instruments: il joue du piano, he plays the piano. Jouer à is used with games and sports."
    bases:
      de: "of; from; about"
  "fr-4509":
    native: "to believe in something that exists"
    notes:
      u1: "Croire à means to believe that something exists or works: je crois aux fantômes. Croire en is used for trust and faith."
    bases:
      "à": "at; to; of"
  "fr-4510":
    native: "to believe in, to trust"
    notes:
      u1: "Croire en means to trust someone or have faith in something: je crois en toi, I believe in you."
    bases:
      en: "in; of it"
  "fr-4511":
    native: "to count on"
    notes:
      u1: "Compter sur means to rely on someone or something: je compte sur toi, I am counting on you."
  "fr-4512":
    native: "to succeed in doing"
    notes:
      u1: "Réussir à means to manage to do something: je réussis à finir, I manage to finish. Réussir alone means to succeed."
    bases:
      "à": "at; to; of"
  "fr-4513":
    native: "to begin to"
    notes:
      u1: "Commencer à takes à before an infinitive: il commence à pleuvoir, it is starting to rain."
    bases:
      "à": "at; to; of"
  "fr-4514":
    native: "to begin with"
    notes:
      u1: "Commencer par means to begin with something or by doing something: on commence par le début, we start at the beginning."
  "fr-4515":
    native: "to end up doing"
    notes:
      u1: "Finir par means to end up doing something, often after a delay: il finit par partir, he ends up leaving. Finir de means to finish doing something."
  "fr-4516":
    native: "to try to"
    notes:
      u1: "Essayer de means to try to do something: j'essaie de comprendre, I try to understand. Essayer alone means to try something on or to test it."
    bases:
      de: "of; from; about"
  "fr-4517":
    native: "to learn to"
    notes:
      u1: "Apprendre à means to learn how to do something: j'apprends à nager, I am learning to swim."
    bases:
      "à": "at; to; of"
