schema: 1
id: "fr-en-history"
kind: "layer"
core: "fr-history"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "History"
license: "CC-BY-SA-4.0"
description: "Forty words for history: the past and its periods, rulers and empires, the ruins and objects we study, and the verbs of looking back. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-2288":
    native: "past"
    notes:
      "n1": "Le passé is the past; the past tense is le passé."
    examples:
      "Le passé est important.":
        native: "The past is important."
        bases:
          "passé": "past"
      "Elle parle du passé.":
        native: "She talks about the past."
        bases:
          "du": "some, of the"
          "passé": "past"
  "fr-2289":
    native: "period, era"
    notes:
      "n1": "Une époque is a period of time in history."
    examples:
      "C'était une autre époque.":
        native: "It was another era."
        bases:
          "autre": "other"
          "époque": "period, era"
      "À cette époque, il vivait à Lyon.":
        native: "At that time, he lived in Lyon."
        bases:
          "À": "to, at"
          "époque": "period, era"
          "vivait": "lived"
          "Lyon": "Lyon"
  "fr-2290":
    native: "king"
    notes:
      "n1": "Un roi rules a kingdom; the feminine is reine."
    examples:
      "Le roi habite au château.":
        native: "The king lives in the castle."
        bases:
          "roi": "king"
          "au": "at, to the"
      "Ce roi a régné pendant trente ans.":
        native: "This king reigned for thirty years."
        bases:
          "roi": "king"
  "fr-2291":
    native: "queen"
    notes:
      "n1": "Une reine is a queen, the ruler of a kingdom."
    examples:
      "La reine visite la ville.":
        native: "The queen visits the town."
        bases:
          "reine": "queen"
          "visite": "visit"
      "Cette reine était très puissante.":
        native: "This queen was very powerful."
        bases:
          "reine": "queen"
          "puissante": "powerful"
  "fr-2292":
    native: "empire"
    notes:
      "n1": "Un empire is a large territory ruled by one leader."
    examples:
      "L'empire est très grand.":
        native: "The empire is very large."
        bases:
          "L'empire": "empire"
      "Ce pays faisait partie de l'empire.":
        native: "This country was part of the empire."
        bases:
          "partie": "part"
          "de": "of, from, some"
          "l'empire": "empire"
  "fr-2293":
    native: "revolution"
    notes:
      "n1": "Une révolution is a sudden big change in a country, often violent."
    examples:
      "La révolution a changé le pays.":
        native: "The revolution changed the country."
        bases:
          "révolution": "revolution"
      "Cette révolution a duré dix ans.":
        native: "This revolution lasted ten years."
        bases:
          "révolution": "revolution"
  "fr-2294":
    native: "monument"
    notes:
      "n1": "Un monument is a building or statue kept for its history."
    examples:
      "Ce monument est très ancien.":
        native: "This monument is very old."
        bases:
          "monument": "monument"
      "Le monument est ouvert au public.":
        native: "The monument is open to the public."
        bases:
          "monument": "monument"
          "au": "at, to the"
  "fr-2295":
    native: "castle"
    notes:
      "n1": "Un château is a castle or a large house in the country."
    examples:
      "Le château est sur la colline.":
        native: "The castle is on the hill."
        bases:
          "château": "castle"
          "colline": "hill"
      "Nous visitons un vieux château.":
        native: "We visit an old castle."
        bases:
          "château": "castle"
  "fr-2296":
    native: "ancient, former"
    notes:
      "n1": "Ancien takes the feminine ancienne; it goes before the noun."
    examples:
      "C'est une ancienne église.":
        native: "It is an old church."
        bases:
          "ancienne": "ancient, former"
      "Mon ancien professeur habite ici.":
        native: "My former teacher lives here."
        bases:
          "ancien": "ancient, former"
  "fr-2297":
    native: "medieval"
    notes:
      "n1": "Médiéval takes the feminine médiévale."
    examples:
      "La ville est médiévale.":
        native: "The town is medieval."
        bases:
          "médiévale": "medieval"
      "Ce château est médiéval.":
        native: "This castle is medieval."
        bases:
          "médiéval": "medieval"
  "fr-2298":
    native: "colonial"
    notes:
      "n1": "Colonial takes the same form in both genders."
    examples:
      "Le bâtiment date de l'époque coloniale.":
        native: "The building dates from the colonial period."
        bases:
          "bâtiment": "building"
          "de": "of, from, some"
          "coloniale": "colonial"
      "Ce pays a un passé colonial.":
        native: "This country has a colonial past."
        bases:
          "colonial": "colonial"
  "fr-2299":
    native: "emperor"
    notes:
      "n1": "Un empereur rules an empire; the feminine is impératrice."
    examples:
      "L'empereur arrive à Paris.":
        native: "The emperor arrives in Paris."
        bases:
          "L'empereur": "emperor"
          "à": "to, at"
          "Paris": "Paris"
      "Cet empereur a fait de grands travaux.":
        native: "This emperor carried out great works."
        bases:
          "empereur": "emperor"
          "de": "of, from, some"
  "fr-2300":
    native: "dynasty"
    notes:
      "n1": "Une dynastie is a family of rulers over several generations."
    examples:
      "Cette dynastie a régné longtemps.":
        native: "This dynasty reigned for a long time."
        bases:
          "dynastie": "dynasty"
      "La dynastie a changé au dix-huitième siècle.":
        native: "The dynasty changed in the eighteenth century."
        bases:
          "dynastie": "dynasty"
          "au": "at, to the"
          "huitième": "eighth"
  "fr-2301":
    native: "archaeology"
    notes:
      "n1": "L’archéologie is the study of past societies from what they left behind."
    examples:
      "Elle étudie l'archéologie.":
        native: "She studies archaeology."
        bases:
          "l'archéologie": "archaeology"
      "L'archéologie révèle des trésors.":
        native: "Archaeology reveals treasures."
        bases:
          "L'archéologie": "archaeology"
          "révèle": "reveals"
          "trésors": "treasures"
  "fr-2302":
    native: "excavation"
    notes:
      "n1": "Une fouille is a dig to find old objects."
    examples:
      "La fouille commence demain.":
        native: "The excavation starts tomorrow."
        bases:
          "fouille": "excavation"
      "Les fouilles montrent une vieille ville.":
        native: "The digs show an old town."
        bases:
          "fouilles": "excavation"
          "montrent": "show"
  "fr-2303":
    native: "remnant, relic"
    notes:
      "n1": "Un vestige is a small piece of something from the past."
    examples:
      "Ce vestige date du neuvième siècle.":
        native: "This relic dates from the ninth century."
        bases:
          "vestige": "remnant, relic"
          "du": "some, of the"
          "neuvième": "ninth"
      "Il reste des vestiges du mur.":
        native: "Some remnants of the wall remain."
        bases:
          "vestiges": "remnant, relic"
          "du": "some, of the"
  "fr-2304":
    native: "trace, mark"
    notes:
      "n1": "Une trace is a mark or sign left by something or someone."
    examples:
      "On voit une trace du passé.":
        native: "One can see a trace of the past."
        bases:
          "trace": "trace, mark"
          "du": "some, of the"
      "La trace du roi est encore là.":
        native: "The king’s trace is still there."
        bases:
          "trace": "trace, mark"
          "du": "some, of the"
  "fr-2305":
    native: "ruin"
    notes:
      "n1": "Une ruine is what is left of a building that has fallen down."
    examples:
      "Le château est en ruine.":
        native: "The castle is in ruins."
        bases:
          "en": "in, by, as"
          "ruine": "ruin"
      "Nous visitons les ruines romaines.":
        native: "We visit the Roman ruins."
        bases:
          "ruines": "ruin"
          "romaines": "Roman"
  "fr-2306":
    native: "discovery"
    notes:
      "n1": "Une découverte is something found for the first time."
    examples:
      "C'est une grande découverte.":
        native: "It is a great discovery."
        bases:
          "découverte": "discovery"
      "La découverte date de l'année dernière.":
        native: "The discovery dates from last year."
        bases:
          "découverte": "discovery"
          "de": "of, from, some"
  "fr-2307":
    native: "invasion"
    notes:
      "n1": "Une invasion is the entry of an army into a country."
    examples:
      "L'invasion a changé la région.":
        native: "The invasion changed the region."
        bases:
          "L'invasion": "invasion"
          "région": "region"
      "Cette invasion dure longtemps.":
        native: "This invasion lasted a long time."
        bases:
          "invasion": "invasion"
  "fr-2308":
    native: "treaty"
    notes:
      "n1": "Un traité is a formal agreement between states."
    examples:
      "Le traité est signé en mai.":
        native: "The treaty is signed in May."
        bases:
          "traité": "treaty"
          "en": "in, by, as"
      "Ce traité change les frontières.":
        native: "This treaty changes the borders."
        bases:
          "traité": "treaty"
  "fr-2309":
    native: "archive"
    notes:
      "n1": "Une archive is a stored record of past documents."
    examples:
      "Les archives sont au sous-sol.":
        native: "The archives are in the basement."
        bases:
          "archives": "archive"
          "au": "at, to the"
      "Cette archive date de 1900.":
        native: "This archive dates from 1900."
        bases:
          "archive": "archive"
          "de": "of, from, some"
          "1900": "1900"
  "fr-2310":
    native: "testimony, account"
    notes:
      "n1": "Un témoignage is a personal account of past events."
    examples:
      "Son témoignage est touchant.":
        native: "His account is moving."
        bases:
          "témoignage": "testimony, account"
          "touchant": "moving"
      "Ce témoignage explique la guerre.":
        native: "This account explains the war."
        bases:
          "témoignage": "testimony, account"
          "explique": "explains"
  "fr-2311":
    native: "development, change"
    notes:
      "n1": "Une évolution is a slow change over time."
    examples:
      "L'évolution de la ville est rapide.":
        native: "The development of the town is fast."
        bases:
          "L'évolution": "development, change"
          "de": "of, from, some"
      "Cette évolution prend des siècles.":
        native: "This change takes centuries."
        bases:
          "évolution": "development, change"
  "fr-2312":
    native: "progress"
    notes:
      "n1": "Un progrès is a step forward or an improvement."
    examples:
      "Le progrès est lent.":
        native: "Progress is slow."
        bases:
          "progrès": "progress"
      "Il fait des progrès en histoire.":
        native: "He is making progress in history."
        bases:
          "progrès": "progress"
          "en": "in, by, as"
  "fr-2313":
    native: "tradition"
    notes:
      "n1": "Une tradition is a custom passed on from the past."
    examples:
      "C'est une vieille tradition.":
        native: "It is an old tradition."
        bases:
          "tradition": "tradition"
      "Cette tradition continue aujourd'hui.":
        native: "This tradition continues today."
        bases:
          "tradition": "tradition"
  "fr-2314":
    native: "custom"
    notes:
      "n1": "Une coutume is a habit or custom of a group of people."
    examples:
      "C'est une coutume ancienne.":
        native: "It is an ancient custom."
        bases:
          "coutume": "custom"
      "La coutume est de manger ensemble.":
        native: "The custom is to eat together."
        bases:
          "coutume": "custom"
          "de": "of, from, some"
  "fr-2315":
    native: "warrior"
    notes:
      "n1": "Un guerrier fights in a war; the feminine is guerrière."
    examples:
      "Le guerrier porte une épée.":
        native: "The warrior carries a sword."
        bases:
          "guerrier": "warrior"
          "épée": "sword"
      "Ce guerrier est très célèbre.":
        native: "This warrior is very famous."
        bases:
          "guerrier": "warrior"
  "fr-2316":
    native: "battle"
    notes:
      "n1": "Une bataille is a fight between armies."
    examples:
      "La bataille dure toute la journée.":
        native: "The battle lasts all day."
        bases:
          "bataille": "battle"
      "Cette bataille change l'histoire.":
        native: "This battle changes history."
        bases:
          "bataille": "battle"
  "fr-2317":
    native: "foundation"
    notes:
      "n1": "La fondation is the founding of a town or institution."
    examples:
      "La fondation de la ville date de 1200.":
        native: "The founding of the town dates from 1200."
        bases:
          "fondation": "foundation"
          "de": "of, from, some"
          "1200": "1200"
      "La fondation a eu lieu en mai.":
        native: "The founding took place in May."
        bases:
          "fondation": "foundation"
          "lieu": "place"
          "en": "in, by, as"
  "fr-2318":
    native: "reign"
    notes:
      "n1": "Un règne is the time a ruler is in power."
    examples:
      "Son règne dure vingt ans.":
        native: "His reign lasts twenty years."
        bases:
          "règne": "reign"
      "Pendant son règne, la ville grandit.":
        native: "During his reign, the town grew."
        bases:
          "règne": "reign"
          "grandit": "grows"
  "fr-2319":
    native: "crown"
    notes:
      "n1": "Une couronne is the crown worn by a king or queen."
    examples:
      "La couronne est en or.":
        native: "The crown is made of gold."
        bases:
          "couronne": "crown"
          "en": "in, by, as"
          "or": "gold"
      "Le roi porte une couronne.":
        native: "The king wears a crown."
        bases:
          "couronne": "crown"
  "fr-2320":
    native: "to reign"
    notes:
      "n1": "Régner is regular: a ruler reigns over a country."
    examples:
      "Le roi règne sur le pays.":
        native: "The king reigns over the country."
      "Elle régnait pendant la guerre.":
        native: "She reigned during the war."
        bases:
          "régnait": "to reign"
  "fr-2321":
    native: "to build"
    notes:
      "n1": "Construire is irregular: je construis, nous construisons."
    examples:
      "Ils construisent un château.":
        native: "They build a castle."
        bases:
          "construisent": "to build"
      "On a construit le pont au dix-septième siècle.":
        native: "The bridge was built in the seventeenth century."
        bases:
          "construit": "to build"
          "au": "at, to the"
          "septième": "seventh"
  "fr-2322":
    native: "to conquer"
    notes:
      "n1": "Conquérir is irregular: je conquiers, nous conquérons."
    examples:
      "Le roi veut conquérir la région.":
        native: "The king wants to conquer the region."
        bases:
          "conquérir": "to conquer"
          "région": "region"
      "Ils ont conquis le pays.":
        native: "They conquered the country."
        bases:
          "conquis": "to conquer"
