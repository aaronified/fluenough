description: "The first line of three French texts, in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-4250":
    native: "It is raining, it is raining, shepherdess."
    notes:
      "n1": "The first line of the song 'Il pleut, il pleut, bergère' by Fabre d'Églantine, first printed in his posthumous Œuvres mêlées et posthumes (1802). The song speaks to a shepherdess about the rain."
    bases:
      "Il": "it"
      "pleut": "is raining"
      "bergère": "shepherdess"
  "fr-4251":
    native: "Once upon a time there was a little village girl, the liveliest anyone had ever seen."
    notes:
      "n1": "The opening of Le Petit Chaperon rouge (Little Red Riding Hood) in Contes de ma mère l'Oye, published by Charles Perrault in 1697. The French tale opens with this formula, 'Il était une fois' (once upon a time)."
    bases:
      "Il": "there"
      "était": "was"
      "une": "a"
      "fois": "time"
      "petite": "little"
      "fille": "girl"
      "de": "from"
      "village": "village"
  "fr-4252":
    native: "For a long time I used to go to bed early."
    notes:
      "n1": "The first sentence of Du côté de chez Swann (1913), the first part of À la recherche du temps perdu by Marcel Proust. The narrator remembers going to bed early as a child."
    bases:
      "Longtemps": "for a long time"
      "je": "I"
      "me": "myself"
      "suis": "have"
      "couché": "gone to bed"
      "de": "from"
      "bonne": "good"
      "heure": "hour"
