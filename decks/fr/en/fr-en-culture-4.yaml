  "fr-4266":
    native: "And the conquistador, blessing his madness."
    notes:
      "n1": "Lines from 'Jouvence' in Les Trophées (1893) by José-Maria de Heredia: the conquistador sails to Florida and plants his flag, blessing the folly of his quest."
