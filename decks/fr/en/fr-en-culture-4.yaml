  "fr-4259":
    native: "Let us go, children of the fatherland; the day of glory has arrived."
    notes:
      "n1": "The opening lines of 'La Marseillaise', written in 1792 by Claude Joseph Rouget de Lisle. The song became the national anthem of France in 1879 (French Wikipedia); the text is the official version."
