  "fr-4262":
    native: "Once upon a time there was a queen who gave birth to a son."
    notes:
      "n1": "The opening of Riquet à la houppe in Histoires ou Contes du temps passé (1697), the Perrault collection. The printed text reads 'Il estoit une fois une Reine'; spelling modernised here."
