description: "Opening lines and short passages of French texts from the eighteenth to the early twentieth century, in the public domain: seventeen short items. Each shows who wrote it, when, and where it comes from. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-4250":
    native: "It is raining, it is raining, shepherdess."
    notes:
      "n1": "The first line of the song 'Il pleut, il pleut, bergère' by Fabre d'Églantine, first printed in his posthumous Œuvres mêlées et posthumes (1802). The song speaks to a shepherdess about the rain."
    bases:
      "Il": "it"
      "pleut": "is raining"
      "bergère": "shepherdess"
  "fr-4251":
    native: "Once upon a time there was a little village girl, the liveliest anyone had ever seen."
    notes:
      "n1": "Opening words of the text. The opening of Le Petit Chaperon rouge (Little Red Riding Hood) in Contes de ma mère l'Oye, published by Charles Perrault in 1697. The French tale opens with this formula, 'Il était une fois' (once upon a time)."
    bases:
      "Il": "there"
      "était": "was"
      "une": "a"
      "fois": "time"
      "petite": "little"
      "fille": "girl"
      "de": "from"
      "village": "village"
  "fr-4252":
    native: "For a long time I used to go to bed early."
    notes:
      "n1": "The first sentence of Du côté de chez Swann (1913), the first part of À la recherche du temps perdu by Marcel Proust. The narrator remembers going to bed early as a child."
    bases:
      "Longtemps": "for a long time"
      "je": "I"
      "me": "myself"
      "suis": "have"
      "couché": "gone to bed"
      "de": "from"
      "bonne": "good"
      "heure": "hour"
  "fr-4253":
    native: "On my schoolboy's notebooks."
    notes:
      "n1": "The first line of 'Liberté' in Poésie et vérité 1942 by Paul Éluard: a poem that lists the places where the poet writes the word liberty."
    bases:
      "Sur": "on"
      "mes": "my"
      "cahiers": "notebooks"
      "d'écolier": "of a schoolboy"
  "fr-4254":
    native: "Families, I hate you; closed homes."
    notes:
      "n1": "The opening of Book IV of Les Nourritures terrestres (1897) by André Gide: a voice that rejects family and home in favour of freedom."
    bases:
      "Familles": "families"
      "je": "I"
      "vous": "you"
      "hais": "hate"
      "foyers": "homes"
      "clos": "closed"
  "fr-4255":
    native: "This calm roof, where doves walk."
    notes:
      "n1": "The first line of Le Cimetière marin (The Graveyard by the Sea) by Paul Valéry, printed in Charmes (1922). The poem is set in the cemetery of Sète above the sea."
    bases:
      "Ce": "this"
      "toit": "roof"
      "tranquille": "calm"
      "où": "where"
      "marchent": "walk"
      "des": "some"
      "colombes": "doves"
  "fr-4256":
    native: "Once upon a time there was a gentleman who married, in second wedlock, a woman."
    notes:
      "n1": "Opening words of the text. The opening of Cendrillon in Contes de Perrault (1697): a gentleman marries again, a proud woman who has two daughters."
