  "fr-4257":
    native: "A miller left nothing to his three children, apart from his mill, his donkey and his cat."
    notes:
      "n1": "The opening of Le Maître Chat ou le Chat botté in Contes de Perrault (1697): the youngest son gets only the cat, which becomes the hero of the tale."
