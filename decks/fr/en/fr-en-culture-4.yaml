  "fr-4267":
    native: "We find it hard to picture the state of mind of a man of former times who firmly believed that the earth was the centre of the world…"
    notes:
      "n1": "The beginning of the first sentence of the essay 'Le Jardin d'Épicure' by Anatole France, in the Calmann-Lévy edition: it describes a past view of the universe in which the earth was the centre, and asks the reader to imagine that outlook."
