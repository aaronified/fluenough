  "fr-4264":
    native: "But when nothing of a former past survives, after the death of beings and the destruction of things."
    notes:
      "n1": "Opening words of the text. From the Combray part of Du côté de chez Swann (1913) by Marcel Proust: memory survives only through objects and senses, as in the madeleine episode."
