schema: 1
id: "fr-en-help"
kind: "layer"
core: "fr-help"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Help"
license: "CC-BY-SA-4.0"
description: "Words for asking for help in an emergency: aide, aider, police, urgence, secours, numéro, appeler, pompier, médecin, danger, attention, sécurité, besoin, message and perdre. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-1065":
    native: "help"
    notes:
      "n1": "Aide is 'help', a feminine noun. Avoir besoin d'aide is 'to need help'."
    examples:
      "J'ai besoin d'aide.":
        native: "I need help."
        bases:
          "d'aide": "help"
      "L'aide est là.":
        native: "Help is here."
        bases:
          "L'aide": "help"
  "fr-1066":
    native: "to help"
    notes:
      "n1": "Aider is 'to help' someone. It is a regular verb, like manger."
    examples:
      "Tu aides ma sœur.":
        native: "You help my sister."
        bases:
          "aides": "to help"
      "Nous aidons le voisin.":
        native: "We help the neighbour."
        bases:
          "aidons": "to help"
  "fr-1067":
    native: "police"
    notes:
      "n1": "Police is 'police', a feminine noun. The people in the police are policiers."
    examples:
      "Appelez la police.":
        native: "Call the police."
        bases:
          "police": "police"
      "La police est là.":
        native: "The police are there."
        bases:
          "police": "police"
  "fr-1068":
    native: "emergency"
    notes:
      "n1": "Urgence is 'emergency', a feminine noun. Les urgences is the emergency department of a hospital."
    examples:
      "C'est une urgence.":
        native: "It is an emergency."
        bases:
          "urgence": "emergency"
      "Nous avons une urgence.":
        native: "We have an emergency."
        bases:
          "urgence": "emergency"
  "fr-1069":
    native: "help; rescue"
    notes:
      "n1": "Secours is 'help' in an emergency, or 'rescue'. Au secours ! is 'Help!', shouted when you need it."
    examples:
      "Au secours !":
        native: "Help!"
        bases:
          "Au": "to the (masculine)"
          "secours": "help; rescue"
      "Le secours est rapide.":
        native: "Help is quick."
        bases:
          "secours": "help; rescue"
  "fr-1070":
    native: "number"
    notes:
      "n1": "Numéro is 'number', a masculine noun, as in a phone number: le numéro de téléphone."
    examples:
      "Quel est votre numéro ?":
        native: "What is your number?"
        bases:
          "numéro": "number"
      "Le numéro est important.":
        native: "The number is important."
        bases:
          "numéro": "number"
  "fr-1071":
    native: "to call"
    notes:
      "n1": "Appeler is 'to call' someone, by phone or out loud. Its e changes to è before a silent ending: j'appelle."
    examples:
      "J'appelle le médecin.":
        native: "I call the doctor."
        bases:
          "J'appelle": "to call"
      "Vous appelez souvent ?":
        native: "Do you call often?"
        bases:
          "appelez": "to call"
  "fr-1072":
    native: "firefighter"
    notes:
      "n1": "Pompier is 'firefighter', a masculine noun. The feminine is pompière."
    examples:
      "Le pompier est là.":
        native: "The firefighter is there."
        bases:
          "pompier": "firefighter"
      "Mon ami est pompier.":
        native: "My friend is a firefighter."
        bases:
          "pompier": "firefighter"
  "fr-1073":
    native: "doctor"
    notes:
      "n1": "Médecin is 'doctor', a masculine noun. The feminine is médecin too, or une femme médecin."
    examples:
      "Le médecin est gentil.":
        native: "The doctor is kind."
        bases:
          "médecin": "doctor"
      "Je vais chez le médecin.":
        native: "I go to the doctor's."
        bases:
          "médecin": "doctor"
  "fr-1074":
    native: "danger"
    notes:
      "n1": "Danger is 'danger', a masculine noun. Dangereux is the adjective 'dangerous'."
    examples:
      "C'est un danger.":
        native: "It is a danger."
        bases:
          "danger": "danger"
      "Le danger est près.":
        native: "The danger is near."
        bases:
          "danger": "danger"
  "fr-1075":
    native: "care; attention"
    notes:
      "n1": "Attention is 'care' or 'attention', a feminine noun. Attention ! is 'Careful!' when a warning is given."
    examples:
      "Attention !":
        native: "Careful!"
        bases:
          "Attention": "care; attention"
      "Faites attention !":
        native: "Be careful!"
        bases:
          "attention": "care; attention"
  "fr-1076":
    native: "sorry; pardon"
    notes:
      "n1": "Pardon is 'sorry' or 'pardon', a masculine noun. Pardon ? is 'Sorry?' when you did not hear."
    examples:
      "Pardon !":
        native: "Sorry!"
        bases:
          "Pardon": "sorry; pardon"
      "Je demande pardon.":
        native: "I ask for forgiveness."
        bases:
          "pardon": "sorry; pardon"
  "fr-1077":
    native: "to repeat"
    notes:
      "n1": "Répéter is 'to repeat'. Use it to ask someone to say it again: pouvez-vous répéter ? (can you repeat?)."
    examples:
      "Vous répétez ?":
        native: "Can you repeat?"
        bases:
          "répétez": "to repeat"
      "Je répète le nom.":
        native: "I repeat the name."
        bases:
          "répète": "to repeat"
  "fr-1078":
    native: "safety; security"
    notes:
      "n1": "Sécurité is 'safety' or 'security', a feminine noun. It is what keeps people from harm."
    examples:
      "La sécurité est importante.":
        native: "Safety is important."
        bases:
          "sécurité": "safety; security"
      "C'est pour la sécurité.":
        native: "It is for safety."
        bases:
          "sécurité": "safety; security"
  "fr-1079":
    native: "sure; safe"
    notes:
      "n1": "Sûr is 'sure' or 'safe'. The feminine is sûre, said the same. It is not the same as sur (on)."
      "n2": "Only the accent differs from sur (on): sûr, with a circumflex, means 'sure' or 'safe'."
    examples:
      "Je suis sûr.":
        native: "I am sure."
        bases:
          "sûr": "sure; safe"
      "Elle est sûre.":
        native: "She is sure."
        bases:
          "sûre": "sure; safe"
  "fr-1080":
    native: "need"
    notes:
      "n1": "Besoin is 'need', a masculine noun. Avoir besoin de is 'to need' something."
    examples:
      "J'ai besoin d'eau.":
        native: "I need water."
        bases:
          "besoin": "need"
      "Vous avez besoin d'argent ?":
        native: "Do you need money?"
        bases:
          "besoin": "need"
  "fr-1081":
    native: "information"
    notes:
      "n1": "Information is 'information', a feminine noun. It is the same word as in English, said with a French accent."
    examples:
      "J'ai une information.":
        native: "I have some information."
        bases:
          "information": "information"
      "L'information est importante.":
        native: "The information is important."
        bases:
          "L'information": "information"
  "fr-1082":
    native: "message"
    notes:
      "n1": "Message is 'message', a masculine noun: envoyer un message (to send a message)."
    examples:
      "J'envoie un message.":
        native: "I send a message."
        bases:
          "message": "message"
      "Le message est court.":
        native: "The message is short."
        bases:
          "message": "message"
  "fr-1083":
    native: "accident"
    notes:
      "n1": "Accident is 'accident', a masculine noun. Avoir un accident is 'to have an accident'."
    examples:
      "C'est un accident.":
        native: "It is an accident."
        bases:
          "accident": "accident"
      "Nous avons un accident.":
        native: "We have an accident."
        bases:
          "accident": "accident"
  "fr-1084":
    native: "to lose"
    notes:
      "n1": "Perdre is 'to lose' something. It is a regular verb in -re: je perds, il perd."
    examples:
      "Je perds mon sac.":
        native: "I lose my bag."
        bases:
          "perds": "to lose"
      "Tu perds souvent.":
        native: "You often lose things."
        bases:
          "perds": "to lose"
