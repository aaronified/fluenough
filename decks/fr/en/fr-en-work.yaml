schema: 1
id: "fr-en-work"
kind: "layer"
core: "fr-work"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Work"
license: "CC-BY-SA-4.0"
description: "Words about work: métier, bureau, entreprise, patron, employé, réunion, salaire and the verbs gagner, organiser, envoyer and utiliser. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-0659":
    native: "job; trade; profession"
    notes:
      "n1": "Métier is 'job' or 'trade', as in what you do for a living. Quel est ton métier ? asks 'What is your job?'."
    examples:
      "Quel est ton métier ?":
        native: "What is your job?"
        bases:
          "métier": "job; trade; profession"
      "Mon métier est difficile.":
        native: "My job is difficult."
        bases:
          "métier": "job; trade; profession"
  "fr-0660":
    native: "office; desk"
    notes:
      "n1": "Bureau is 'office' or 'desk'. Dans le bureau means 'in the office'. It is a masculine noun."
    examples:
      "Je travaille dans le bureau.":
        native: "I work in the office."
        bases:
          "bureau": "office; desk"
      "Le bureau est loin.":
        native: "The office is far."
        bases:
          "bureau": "office; desk"
  "fr-0661":
    native: "company; firm"
    notes:
      "n1": "Entreprise is 'company' or 'firm'. It is a feminine noun, and it is said with a z in the middle."
    examples:
      "Mon entreprise est grande.":
        native: "My company is big."
        bases:
          "entreprise": "company; firm"
      "Nous travaillons pour une entreprise.":
        native: "We work for a company."
        bases:
          "entreprise": "company; firm"
  "fr-0662":
    native: "boss; employer"
    notes:
      "n1": "Patron is 'boss' or 'employer'. Its feminine is patronne, for a woman who runs a business."
    examples:
      "Mon patron est gentil.":
        native: "My boss is kind."
        bases:
          "patron": "boss; employer"
      "Le patron parle vite.":
        native: "The boss speaks quickly."
        bases:
          "patron": "boss; employer"
  "fr-0663":
    native: "employee"
    notes:
      "n1": "Employé is 'employee', a masculine noun. The feminine is employée, with an accent on the last e."
    examples:
      "Un employé travaille ici.":
        native: "An employee works here."
        bases:
          "employé": "employee"
      "Les employés sont là.":
        native: "The employees are here."
        bases:
          "employés": "employee"
  "fr-0664":
    native: "meeting"
    notes:
      "n1": "Réunion is 'meeting', a feminine noun. Use avoir une réunion (to have a meeting) or être en réunion (to be in one)."
    examples:
      "La réunion est à dix heures.":
        native: "The meeting is at ten o'clock."
        bases:
          "réunion": "meeting"
          "à": "to; at; in"
      "Nous avons une réunion.":
        native: "We have a meeting."
        bases:
          "réunion": "meeting"
  "fr-0665":
    native: "file; folder"
    notes:
      "n1": "Dossier is 'file' or 'folder', a masculine noun. It is the same word for a school or a job file."
    examples:
      "Je finis le dossier.":
        native: "I finish the file."
        bases:
          "dossier": "file; folder"
      "Le dossier est sur la table.":
        native: "The file is on the table."
        bases:
          "dossier": "file; folder"
  "fr-0666":
    native: "computer"
    notes:
      "n1": "Ordinateur is 'computer', a masculine noun. Its short form is ordi, said in speech."
    examples:
      "Mon ordinateur est vieux.":
        native: "My computer is old."
        bases:
          "ordinateur": "computer"
      "J'utilise l'ordinateur.":
        native: "I use the computer."
        bases:
          "l'ordinateur": "computer"
  "fr-0667":
    native: "salary; pay"
    notes:
      "n1": "Salaire is 'salary' or 'pay', a masculine noun. It is what you are paid for work."
    examples:
      "Le salaire est bon.":
        native: "The salary is good."
        bases:
          "salaire": "salary; pay"
      "Je gagne un bon salaire.":
        native: "I earn a good salary."
        bases:
          "salaire": "salary; pay"
  "fr-0668":
    native: "week"
    notes:
      "n1": "Semaine is 'week', a feminine noun. Toute la semaine is 'all week'."
    examples:
      "Cette semaine est longue.":
        native: "This week is long."
        bases:
          "semaine": "week"
      "Nous travaillons toute la semaine.":
        native: "We work all week."
        bases:
          "semaine": "week"
  "fr-0669":
    native: "factory"
    notes:
      "n1": "Usine is 'factory', a feminine noun. It is a place where things are made."
    examples:
      "Mon père travaille dans une usine.":
        native: "My father works in a factory."
        bases:
          "usine": "factory"
      "L'usine est grande.":
        native: "The factory is big."
        bases:
          "L'usine": "factory"
  "fr-0670":
    native: "to earn; to win"
    notes:
      "n1": "Gagner is 'to earn' money or 'to win' a game. It is the opposite of perdre (to lose), which is not taught yet."
    examples:
      "Je gagne bien.":
        native: "I earn well."
        bases:
          "gagne": "to earn; to win"
      "Elle gagne souvent.":
        native: "She often wins."
        bases:
          "gagne": "to earn; to win"
  "fr-0671":
    native: "to organise"
    notes:
      "n1": "Organiser is 'to organise' or 'to arrange'. The nous form is nous organisons, with the s said."
    examples:
      "Nous organisons la réunion.":
        native: "We organise the meeting."
        bases:
          "organisons": "to organise"
      "Il organise le travail.":
        native: "He organises the work."
        bases:
          "organise": "to organise"
  "fr-0672":
    native: "to send"
    notes:
      "n1": "Envoyer is 'to send'. The e of the stem changes to è before a silent ending: j'envoie (I send)."
    examples:
      "J'envoie un e-mail.":
        native: "I send an email."
        bases:
          "J'envoie": "to send"
      "Vous envoyez le dossier.":
        native: "You send the file."
        bases:
          "envoyez": "to send"
  "fr-0673":
    native: "to use"
    notes:
      "n1": "Utiliser is 'to use'. It is a regular verb, like travailler."
    examples:
      "Tu utilises l'ordinateur.":
        native: "You use the computer."
        bases:
          "utilises": "to use"
      "Nous utilisons le téléphone.":
        native: "We use the phone."
        bases:
          "utilisons": "to use"
  "fr-0674":
    native: "to succeed; to pass"
    notes:
      "n1": "Réussir is 'to succeed' or 'to pass' a test. Its nous form has -iss-: nous réussissons."
    examples:
      "Il réussit souvent.":
        native: "He often succeeds."
        bases:
          "réussit": "to succeed; to pass"
      "Vous réussissez bien.":
        native: "You succeed well."
        bases:
          "réussissez": "to succeed; to pass"
  "fr-0675":
    native: "busy"
    notes:
      "n1": "Occupé is 'busy' or 'taken'. The feminine is occupée (ɔkype), with the same sound."
    examples:
      "Je suis occupé.":
        native: "I am busy."
        bases:
          "occupé": "busy"
      "Elle est occupée.":
        native: "She is busy."
        bases:
          "occupée": "busy"
  "fr-0676":
    native: "boss; head; chef"
    notes:
      "n1": "Chef is 'boss', 'head' or 'chef'. Chef de famille is 'head of the family'."
    examples:
      "Le chef est là.":
        native: "The boss is here."
        bases:
          "chef": "boss; head; chef"
      "Mon chef est content.":
        native: "My boss is happy."
        bases:
          "chef": "boss; head; chef"
  "fr-0677":
    native: "job; employment"
    notes:
      "n1": "Emploi is 'job' or 'employment'. Chercher un emploi is 'to look for a job'."
    examples:
      "Je cherche un emploi.":
        native: "I am looking for a job."
        bases:
          "emploi": "job; employment"
      "Il a un bon emploi.":
        native: "He has a good job."
        bases:
          "emploi": "job; employment"
  "fr-0678":
    native: "worker"
    notes:
      "n1": "Ouvrier is 'worker', a manual worker in a factory or on a site. Its feminine is ouvrière."
    examples:
      "Mon père est ouvrier.":
        native: "My father is a worker."
        bases:
          "ouvrier": "worker"
      "Les ouvriers sont là.":
        native: "The workers are here."
        bases:
          "ouvriers": "worker"
  "fr-0679":
    native: "post; position; job"
    notes:
      "n1": "Poste is 'position' or 'job' in a company, and also 'post' or 'post office'. It is a masculine noun."
    examples:
      "C'est un bon poste.":
        native: "It is a good post."
        bases:
          "poste": "post; position; job"
      "Elle a un nouveau poste.":
        native: "She has a new post."
        bases:
          "poste": "post; position; job"
  "fr-0680":
    native: "day off; leave"
    notes:
      "n1": "Congé is 'day off' or 'leave' from work: un congé (a day off). It is a masculine noun."
    examples:
      "Je prends un congé.":
        native: "I take a day off."
        bases:
          "congé": "day off; leave"
      "Nous avons un congé.":
        native: "We have a holiday."
        bases:
          "congé": "day off; leave"
  "fr-0681":
    native: "break"
    notes:
      "n1": "Pause is 'break', a short rest in the middle of work. It is a feminine noun."
    examples:
      "Je fais une pause.":
        native: "I take a break."
        bases:
          "pause": "break"
      "La pause est courte.":
        native: "The break is short."
        bases:
          "pause": "break"
  "fr-0682":
    native: "project; plan"
    notes:
      "n1": "Projet is 'project' or 'plan'. It is a masculine noun, and the plural is projets."
    examples:
      "Le projet est important.":
        native: "The project is important."
        bases:
          "projet": "project; plan"
      "J'ai un projet.":
        native: "I have a project."
        bases:
          "projet": "project; plan"
  "fr-0683":
    native: "idea"
    notes:
      "n1": "Idée is 'idea', a feminine noun. Avoir une idée is 'to have an idea'."
    examples:
      "J'ai une bonne idée.":
        native: "I have a good idea."
        bases:
          "idée": "idea"
      "C'est une idée.":
        native: "It is an idea."
        bases:
          "idée": "idea"
  "fr-0684":
    native: "problem"
    notes:
      "n1": "Problème is 'problem', a masculine noun. It is spelled with an accent on the first e."
    examples:
      "C'est un problème.":
        native: "It is a problem."
        bases:
          "problème": "problem"
      "Nous avons un problème.":
        native: "We have a problem."
        bases:
          "problème": "problem"
  "fr-0685":
    native: "customer; client"
    notes:
      "n1": "Client is 'customer' or 'client', a masculine noun. The feminine is cliente."
    examples:
      "Le client attend.":
        native: "The customer waits."
        bases:
          "client": "customer; client"
      "Mon client est content.":
        native: "My customer is happy."
        bases:
          "client": "customer; client"
  "fr-0686":
    native: "director; manager"
    notes:
      "n1": "Directeur is 'director' or 'manager', a masculine noun. The feminine is directrice."
    examples:
      "Le directeur est là.":
        native: "The director is here."
        bases:
          "directeur": "director; manager"
      "Mon directeur parle français.":
        native: "My director speaks French."
        bases:
          "directeur": "director; manager"
  "fr-0687":
    native: "ready"
    notes:
      "n1": "Prêt is 'ready'. The feminine is prête (pʁɛt), said with the t."
    examples:
      "Je suis prêt.":
        native: "I am ready."
        bases:
          "prêt": "ready"
      "Elle est prête.":
        native: "She is ready."
        bases:
          "prête": "ready"
  "fr-0688":
    native: "last"
    notes:
      "n1": "Dernier is 'last', as in the last one. The feminine is dernière (dɛʁnjɛʁ)."
    examples:
      "C'est le dernier.":
        native: "It is the last one."
        bases:
          "dernier": "last"
      "La dernière heure est calme.":
        native: "The last hour is calm."
        bases:
          "dernière": "last"
