description: "Forty words for technology: the devices we use, the software and files on them, and the verbs for switching them on and keeping them working. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-2067":
    native: "software"
    notes:
      "n1": "Un logiciel is a program that runs on a computer."
    examples:
      "Ce logiciel est gratuit.":
        native: "This software is free."
        bases:
          "logiciel": "software"
      "Installez le logiciel avant de commencer.":
        native: "Install the software before you start."
        bases:
          "logiciel": "software"
          "de": "of, from, some"
  "fr-2068":
    native: "internet"
    notes:
      "n1": "L’internet is the network; it is masculine in French."
    examples:
      "L'internet est lent ce soir.":
        native: "The internet is slow tonight."
        bases:
          "L'internet": "internet"
      "Je cherche sur internet.":
        native: "I search on the internet."
        bases:
          "internet": "internet"
  "fr-2069":
    native: "battery"
    notes:
      "n1": "Une batterie is the battery of a phone or car."
