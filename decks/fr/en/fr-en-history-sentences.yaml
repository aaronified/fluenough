schema: 1
id: "fr-en-history-sentences"
kind: "layer"
core: "fr-history-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences: history"
license: "CC-BY-SA-4.0"
description: "Sentences about history, each with the words it is often mixed up with. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-2323":
    native: "The emperor reigned over a great empire."
    confusables:
      "roi": { why: "A king is a ruler too, but the sentence names an emperor." }
      "reine": { why: "A queen is a female ruler; the sentence names a man." }
    notes:
      "adjective-position": "Grand comes before the noun, as in un grand empire, 'a great empire'. See the unit Adjective position."
  "fr-2324":
    native: "The revolution changed the era and the dynasty."
    confusables:
      "siecle": { why: "A century is a length of time; the sentence names the era." }
      "regne": { why: "A reign is a ruler’s time; the sentence is about change." }
    notes:
      "passe-compose": "A past action uses the passé composé: a changé is avoir in the present plus the past participle. See the unit The past with avoir: the passé composé."
  "fr-2325":
    native: "The digs show remains of the castle."
    bases:
      "montrent": "show"
      "du": "some, of the"
    confusables:
      "ruine": { why: "A ruin is the castle now, not the remains shown by the digs." }
      "archeologie": { why: "Archaeology is the study; the sentence names the digs and remains." }
    notes:
      "du": "De and le join to form du: des vestiges du château, 'remains of the castle'. See the unit The contractions au, du, aux and des."
  "fr-2326":
    native: "The treaty ends the battle."
    bases:
      "à": "to, at"
    confusables:
      "invasion": { why: "An invasion starts a war; the sentence says the treaty ends the battle." }
      "guerrier": { why: "A warrior fights; the sentence is about a treaty." }
    notes:
      "traite": "Un traité is a formal agreement between states: le traité met fin à la bataille."
  "fr-2327":
    native: "This tradition comes from the Middle Ages."
    bases:
      "du": "some, of the"
      "Moyen": "middle"
    confusables:
      "medieval": { why: "Medieval is an adjective; the sentence has the noun phrase." }
      "coutume": { why: "A custom is a habit; the sentence names a tradition." }
    notes:
      "du": "De and le join to form du: du Moyen Âge, 'of the Middle Ages'. See the unit The contractions au, du, aux and des."
  "fr-2328":
    native: "The account talks about an ancient discovery."
    bases:
      "d'une": "of a"
    confusables:
      "archive": { why: "An archive is a stored record; the sentence names a testimony." }
      "evolution": { why: "An evolution is a slow change; the sentence names a discovery." }
    notes:
      "elision": "De is shortened to d' before a vowel sound, so de une découverte becomes d'une découverte. Other short words, such as de, do the same (d')."
