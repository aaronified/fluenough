cards:
  "fr-2600":
    native: "I manage to repair the bike, but I forget the bread."
    bases:
      "à": "to, at"
    confusables:
      "echouer": { why: "To fail is the opposite of succeeding in the sentence." }
      "rappeler": { why: "To remind is not named; the sentence is about forgetting." }
  "fr-2601":
    native: "The seller sells the bike and lends the helmet."
    bases:
      "casque": "helmet"
    confusables:
      "emprunter": { why: "To borrow is the opposite of lend; the sentence names the lender." }
      "depenser": { why: "To spend is the buyer’s action; the sentence is the seller’s." }
  "fr-2602":
    native: "The garden grows, the children grow."
    bases:
      "enfants": "children"
    confusables:
      "vieillir": { why: "To grow old is close; the sentence is about children growing." }
      "naitre": { why: "To be born is not named; the sentence is about growing." }
  "fr-2603":
    native: "He lies, so I punish him."
    confusables:
      "obeir": { why: "To obey is the opposite of lying in this sentence." }
      "rougir": { why: "To blush is not named; the sentence is about lying and punishment." }
  "fr-2604":
    native: "The film bores me, but my brother likes it."
    bases:
      "à": "to, at"
    confusables:
      "etonner": { why: "To surprise is not in the sentence; the sentence has a feeling of boredom." }
      "aimer": { why: "To like is close to please, but the sentence says the brother likes it." }
  "fr-2605":
    native: "He cooks, I hide the salt and I taste the soup."
    confusables:
      "preparer": { why: "To prepare is close; the sentence has cook and taste." }
      "servir": { why: "To serve is the next step; the sentence has tasting." }
  "fr-2606":
    native: "She looks like her mother and dreams of travelling."
    bases:
      "à": "to, at"
      "de": "of, from, some"
    confusables:
      "naitre": { why: "To be born is not named; the sentence is about looks and dreams." }
      "persuader": { why: "To persuade is not named in the sentence." }
