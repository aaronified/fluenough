schema: 1
id: "fr-en-verbs-4"
kind: "layer"
core: "fr-verbs-4"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs 4"
license: "CC-BY-SA-4.0"
description: "Forty more verbs for everyday life: succeeding and failing, cooking and cleaning, buying and lending, and how things look and change. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-2572":
    native: "to fail"
    notes:
      "n1": "Échouer is regular: to fail, or to run aground."
    examples:
      "Il échoue à l'examen.":
        native: "He fails the exam."
        bases:
          "échoue": "to fail"
          "à": "to, at"
      "Le projet échoue.":
        native: "The project fails."
        bases:
          "échoue": "to fail"
  "fr-2573":
    native: "to remind, to call back"
    notes:
      "n1": "Rappeler is regular: to call again, or to remind someone."
    examples:
      "Rappelle-moi demain.":
        native: "Call me back tomorrow."
        bases:
          "Rappelle-moi": "to remind, to call back"
      "Ce film me rappelle mon enfance.":
        native: "This film reminds me of my childhood."
        bases:
          "me": "me"
          "rappelle": "to remind, to call back"
          "enfance": "childhood"
  "fr-2574":
    native: "to lie"
    notes:
      "n1": "Mentir is an -ir verb: je mens, il ment."
    examples:
      "Il ment à sa mère.":
        native: "He lies to his mother."
        bases:
          "ment": "to lie"
          "à": "to, at"
      "Tu ne mens pas ?":
        native: "You are not lying?"
        bases:
          "ne": "not"
          "mens": "to lie"
          "pas": "not"
  "fr-2575":
    native: "to think"
    notes:
      "n1": "Réfléchir is an -ir verb: to think about something carefully."
    examples:
      "Je réfléchis à ta proposition.":
        native: "I am thinking about your proposal."
        bases:
          "réfléchis": "to think"
          "à": "to, at"
          "proposition": "proposal"
      "Réfléchissez avant de répondre.":
        native: "Think before you answer."
        bases:
          "Réfléchissez": "to think"
          "de": "of, from, some"
  "fr-2576":
    native: "to grow up, to grow"
    notes:
      "n1": "Grandir is an -ir verb: the children grow."
    examples:
      "Les enfants grandissent vite.":
        native: "The children grow up fast."
        bases:
          "enfants": "children"
          "grandissent": "to grow up, to grow"
      "Le jardin a grandi cette année.":
        native: "The garden grew this year."
        bases:
          "grandi": "to grow up, to grow"
  "fr-2577":
    native: "to grow old"
    notes:
      "n1": "Vieillir is an -ir verb: to age."
    examples:
      "Mes parents vieillissent.":
        native: "My parents are growing old."
        bases:
          "vieillissent": "to grow old"
      "Il a vieilli depuis l'an dernier.":
        native: "He has aged since last year."
        bases:
          "vieilli": "to grow old"
          "depuis": "since"
  "fr-2578":
    native: "to obey"
    notes:
      "n1": "Obéir is an -ir verb, followed by à."
    examples:
      "Le chien obéit au maître.":
        native: "The dog obeys its master."
        bases:
          "obéit": "to obey"
          "au": "at, to the"
          "maître": "master"
      "Les élèves obéissent au professeur.":
        native: "The pupils obey the teacher."
        bases:
          "obéissent": "to obey"
          "au": "at, to the"
  "fr-2579":
    native: "to punish"
    notes:
      "n1": "Punir is an -ir verb: to punish someone for a mistake."
    examples:
      "Le juge punit le voleur.":
        native: "The judge punishes the thief."
        bases:
          "punit": "to punish"
          "voleur": "thief"
      "On ne doit pas punir les enfants.":
        native: "We must not punish children."
        bases:
          "ne": "not"
          "pas": "not"
          "punir": "to punish"
          "enfants": "children"
  "fr-2580":
    native: "to lend"
    notes:
      "n1": "Prêter is regular: prêter quelque chose à quelqu’un is to lend something to someone."
    examples:
      "Tu me prêtes ton stylo ?":
        native: "Will you lend me your pen?"
        bases:
          "me": "me"
          "prêtes": "to lend"
      "Elle prête son vélo à son frère.":
        native: "She lends her bike to her brother."
        bases:
          "prête": "to lend"
          "à": "to, at"
  "fr-2581":
    native: "to borrow"
    notes:
      "n1": "Emprunter is regular: to borrow from someone."
    examples:
      "J'emprunte un livre à la bibliothèque.":
        native: "I borrow a book from the library."
        bases:
          "J'emprunte": "to borrow"
          "à": "to, at"
      "Il emprunte de l'argent à son père.":
        native: "He borrows money from his father."
        bases:
          "emprunte": "to borrow"
          "de": "of, from, some"
          "à": "to, at"
  "fr-2582":
    native: "to convince"
    notes:
      "n1": "Convaincre is irregular: je convaincs, nous convainquons."
    examples:
      "Il me convainc facilement.":
        native: "He convinces me easily."
        bases:
          "me": "me"
          "convainc": "to convince"
          "facilement": "easily"
      "Nous les convainquons de venir.":
        native: "We convince them to come."
        bases:
          "convainquons": "to convince"
          "de": "of, from, some"
  "fr-2583":
    native: "to persuade"
    notes:
      "n1": "Persuader is regular: persuader quelqu’un de faire is to persuade someone to do something."
    examples:
      "Elle le persuade de rester.":
        native: "She persuades him to stay."
        bases:
          "persuade": "to persuade"
          "de": "of, from, some"
      "Je te persuade facilement.":
        native: "I persuade you easily."
        bases:
          "te": "you"
          "persuade": "to persuade"
          "facilement": "easily"
  "fr-2584":
    native: "to surprise"
    notes:
      "n1": "Étonner is regular: to surprise someone."
    examples:
      "Ta réponse m'étonne.":
        native: "Your answer surprises me."
        bases:
          "m'étonne": "to surprise"
      "Cela étonne tout le monde.":
        native: "That surprises everyone."
        bases:
          "étonne": "to surprise"
          "monde": "world"
  "fr-2585":
    native: "to bore, to annoy"
    notes:
      "n1": "Ennuyer is regular: s’ennuyer is to be bored."
    examples:
      "Ce film m'ennuie.":
        native: "This film bores me."
        bases:
          "m'ennuie": "to bore, to annoy"
      "Elle s'ennuie pendant le cours.":
        native: "She is bored during the lesson."
        bases:
          "s'ennuie": "to bore, to annoy"
  "fr-2586":
    native: "to please"
    notes:
      "n1": "Plaire is irregular: il me plaît, it pleases me."
    examples:
      "Ce restaurant me plaît.":
        native: "I like this restaurant."
        bases:
          "me": "me"
          "plaît": "to please"
      "Cette idée lui plaît beaucoup.":
        native: "He likes this idea a lot."
        bases:
          "plaît": "to please"
  "fr-2587":
    native: "to disappear"
    notes:
      "n1": "Disparaître is irregular: je disparais, nous disparaissons."
    examples:
      "Le soleil disparaît derrière la colline.":
        native: "The sun disappears behind the hill."
        bases:
          "disparaît": "to disappear"
          "colline": "hill"
      "Les oiseaux disparaissent en hiver.":
        native: "The birds disappear in winter."
        bases:
          "disparaissent": "to disappear"
          "en": "in, by, as"
  "fr-2588":
    native: "to appear"
    notes:
      "n1": "Apparaître is irregular like disparaître."
    examples:
      "Une étoile apparaît.":
        native: "A star appears."
        bases:
          "étoile": "star"
          "apparaît": "to appear"
      "Le problème apparaît demain.":
        native: "The problem appears tomorrow."
        bases:
          "apparaît": "to appear"
  "fr-2589":
    native: "to be born"
    notes:
      "n1": "Naître is irregular: je nais, il est né."
    examples:
      "Il est né en mai.":
        native: "He was born in May."
        bases:
          "né": "to be born"
          "en": "in, by, as"
      "Elle naît dans un petit village.":
        native: "She is born in a small village."
        bases:
          "naît": "to be born"
          "village": "village"
  "fr-2590":
    native: "to die"
    notes:
      "n1": "Mourir is irregular: je meurs, nous mourons; it uses être."
    examples:
      "Le vieil homme est mort hier.":
        native: "The old man died yesterday."
        bases:
          "mort": "to die"
      "Les fleurs meurent en hiver.":
        native: "The flowers die in winter."
        bases:
          "fleurs": "flowers"
          "meurent": "to die"
          "en": "in, by, as"
  "fr-2591":
    native: "to suffer"
    notes:
      "n1": "Souffrir is irregular: je souffre, nous souffrons."
    examples:
      "Il souffre de douleurs.":
        native: "He suffers from pains."
        bases:
          "souffre": "to suffer"
          "de": "of, from, some"
      "Nous souffrons de la chaleur.":
        native: "We suffer from the heat."
        bases:
          "souffrons": "to suffer"
          "de": "of, from, some"
  "fr-2592":
    native: "to look like"
    notes:
      "n1": "Ressembler à is to look like someone."
    examples:
      "Tu ressembles à ton père.":
        native: "You look like your father."
        bases:
          "ressembles": "to look like"
          "à": "to, at"
      "Elle ressemble à sa mère.":
        native: "She looks like her mother."
        bases:
          "ressemble": "to look like"
          "à": "to, at"
  "fr-2593":
    native: "to dream"
    notes:
      "n1": "Rêver is regular: rêver de is to dream of something."
    examples:
      "Je rêve de voyager.":
        native: "I dream of travelling."
        bases:
          "de": "of, from, some"
      "Il rêve souvent la nuit.":
        native: "He often dreams at night."
  "fr-2594":
    native: "to hide"
    notes:
      "n1": "Cacher is regular: to hide something from view."
    examples:
      "Il cache la clé sous le pot.":
        native: "He hides the key under the pot."
        bases:
          "cache": "to hide"
          "pot": "pot"
      "Elle se cache derrière la porte.":
        native: "She hides behind the door."
        bases:
          "se": "oneself"
          "cache": "to hide"
  "fr-2595":
    native: "to pull, to shoot"
    notes:
      "n1": "Tirer is regular: to pull; tirer une photo is to take a photo."
    examples:
      "Tire la porte vers toi.":
        native: "Pull the door towards you."
        bases:
          "Tire": "to pull, to shoot"
      "Il tire une photo du château.":
        native: "He takes a photo of the castle."
        bases:
          "tire": "to pull, to shoot"
          "du": "some, of the"
  "fr-2596":
    native: "to push"
    notes:
      "n1": "Pousser is regular: to push, or to grow."
    examples:
      "Il pousse la porte.":
        native: "He pushes the door."
        bases:
          "pousse": "to push"
      "Les fleurs poussent au printemps.":
        native: "The flowers grow in spring."
        bases:
          "fleurs": "flowers"
          "poussent": "to push"
          "au": "at, to the"
  "fr-2597":
    native: "to jump"
    notes:
      "n1": "Sauter is regular: to jump."
    examples:
      "Le chat saute sur la table.":
        native: "The cat jumps onto the table."
        bases:
          "saute": "to jump"
      "Sautez dans l'eau.":
        native: "Jump into the water."
        bases:
          "Sautez": "to jump"
  "fr-2598":
    native: "to climb"
    notes:
      "n1": "Grimper is regular: to climb up something."
    examples:
      "Les enfants grimpent sur l'arbre.":
        native: "The children climb the tree."
        bases:
          "enfants": "children"
          "grimpent": "to climb"
      "Nous grimpons la colline.":
        native: "We climb the hill."
        bases:
          "grimpons": "to climb"
          "colline": "hill"
  "fr-2599":
    native: "to iron"
    notes:
      "n1": "Repasser is regular: to iron clothes; it also means to go back."
    examples:
      "Je repasse ma chemise.":
        native: "I iron my shirt."
        bases:
          "repasse": "to iron"
      "Je repasse demain.":
        native: "I will come back tomorrow."
        bases:
          "repasse": "to iron"
  "fr-2641":
    native: "to blush, to turn red"
    notes:
      "n1": "Rougir is an -ir verb: je rougis, il rougit."
    examples:
      "Elle rougit quand on la regarde.":
        native: "She blushes when people look at her."
        bases:
          "rougit": "to blush, to turn red"
      "Il rougit de honte.":
        native: "He blushes with shame."
        bases:
          "rougit": "to blush, to turn red"
          "de": "of, from, some"
  "fr-2642":
    native: "to thunder"
    notes:
      "n1": "Tonner is regular and used with il: il tonne."
    examples:
      "Il tonne au loin.":
        native: "It is thundering in the distance."
        bases:
          "tonne": "to thunder"
          "au": "at, to the"
      "Le ciel tonne cette nuit.":
        native: "The sky thunders tonight."
        bases:
          "tonne": "to thunder"
  "fr-2643":
    native: "to smoke"
    notes:
      "n1": "Fumer is regular: to smoke a cigarette."
    examples:
      "Il fume devant la gare.":
        native: "He smokes in front of the station."
        bases:
          "fume": "to smoke"
      "Défense de fumer ici.":
        native: "No smoking here."
        bases:
          "Défense": "prohibition"
          "de": "of, from, some"
          "fumer": "to smoke"
  "fr-2644":
    native: "to throw"
    notes:
      "n1": "Lancer is regular: to throw something."
    examples:
      "Il lance le ballon.":
        native: "He throws the ball."
        bases:
          "lance": "to throw"
      "Lancez la balle !":
        native: "Throw the ball!"
        bases:
          "Lancez": "to throw"
          "balle": "ball"
  "fr-2645":
    native: "to catch"
    notes:
      "n1": "Attraper is regular: to catch, or to catch an illness."
    examples:
      "J'attrape le ballon.":
        native: "I catch the ball."
        bases:
          "J'attrape": "to catch"
      "Il a attrapé un rhume.":
        native: "He caught a cold."
        bases:
          "attrapé": "to catch"
  "fr-2646":
    native: "to avoid"
    notes:
      "n1": "Éviter is regular: éviter de faire is to avoid doing something."
    examples:
      "J'évite le centre-ville aux heures de pointe.":
        native: "I avoid the town centre at rush hour."
        bases:
          "J'évite": "to avoid"
          "centre-ville": "town centre"
          "aux": "to the"
          "de": "of, from, some"
          "pointe": "peak"
      "Il évite de parler.":
        native: "He avoids speaking."
        bases:
          "évite": "to avoid"
          "de": "of, from, some"
  "fr-2647":
    native: "to thank"
    notes:
      "n1": "Remercier is regular: remercier quelqu’un de is to thank someone for."
    examples:
      "Je vous remercie beaucoup.":
        native: "I thank you very much."
        bases:
          "remercie": "to thank"
      "Nous remercions nos amis.":
        native: "We thank our friends."
        bases:
          "remercions": "to thank"
  "fr-2648":
    native: "to congratulate"
    notes:
      "n1": "Féliciter is regular: féliciter quelqu’un de is to congratulate someone on."
    examples:
      "Je te félicite pour ton succès.":
        native: "I congratulate you on your success."
        bases:
          "te": "you"
          "félicite": "to congratulate"
          "succès": "success"
      "Ils félicitent les gagnants.":
        native: "They congratulate the winners."
        bases:
          "félicitent": "to congratulate"
          "gagnants": "winners"
  "fr-2649":
    native: "to cover"
    notes:
      "n1": "Couvrir is an -ir verb like ouvrir: to cover something."
    examples:
      "Couvre le plat, s'il te plaît.":
        native: "Cover the dish, please."
        bases:
          "Couvre": "to cover"
          "te": "you"
      "La neige couvre la montagne.":
        native: "The snow covers the mountain."
        bases:
          "couvre": "to cover"
  "fr-2650":
    native: "to discover"
    notes:
      "n1": "Découvrir is like couvrir: to find out something new."
    examples:
      "Elle découvre une nouvelle ville.":
        native: "She discovers a new town."
        bases:
          "découvre": "to discover"
      "Nous découvrons la vérité.":
        native: "We discover the truth."
        bases:
          "découvrons": "to discover"
          "vérité": "truth"
