schema: 1
id: "fr-en-geography-sentences"
kind: "layer"
core: "fr-geography-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Places in the French-speaking world sentences"
license: "CC-BY-SA-4.0"
description: "Example sentences about places in the french-speaking world, each with the words it is often mixed up with. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-3760":
    native: "Belgium is near France."
    bases:
      "Belgique": "Belgium"
      "est": "is"
      "de": "of, from"
      "France": "France"
    confusables:
      "suisse": { why: "Suisse is another country, south-east of Belgium." }
      "wallonie": { why: "Wallonie is the French-speaking part of Belgium, not a country." }
    notes:
      "belgique": "La Belgique is the country north of France, and country names take an article: la Belgique. The word card for Belgique gives this."
  "fr-3761":
    native: "Canada is very large."
    bases:
      "Canada": "Canada"
      "est": "is"
    confusables:
      "quebec": { why: "Québec is a province of Canada, not the whole country." }
      "montreal": { why: "Montréal is a city in Quebec, not a country." }
    notes:
      "canada": "Le Canada is the country in North America, and it takes le: le Canada est très grand. The word card for Canada gives this."
  "fr-3762":
    native: "Africa is a large continent."
    bases:
      "L'Afrique": "Africa"
      "est": "is"
      "continent": "continent"
    confusables:
      "europe": { why: "Europe is the continent north of Africa." }
      "algerie": { why: "Algérie is a country in North Africa, not a continent." }
    notes:
      "adjective-position": "Grand comes before the noun, as in un grand continent, 'a large continent'. See the unit Adjective position."
  "fr-3763":
    native: "Paris is on the Seine."
    bases:
      "Paris": "Paris"
      "est": "is"
      "Seine": "Seine"
    confusables:
      "lyon": { why: "Lyon is another city, on the Rhône." }
      "marseille": { why: "Marseille is a port on the Mediterranean, not on the Seine." }
    notes:
      "paris": "Paris is the capital of France, and a city name takes no article: Paris est sur la Seine. The word card for Paris gives this."
  "fr-3764":
    native: "Provence is on the Mediterranean."
    bases:
      "Provence": "Provence"
      "est": "is"
      "au": "to the"
      "bord": "edge"
      "de": "of, from"
      "Méditerranée": "Mediterranean"
    confusables:
      "bretagne": { why: "Bretagne is a region in the west, by the Atlantic." }
      "normandie": { why: "Normandie is a region in the north-west." }
    notes:
      "au": "À and le join to form au: au bord de la Méditerranée. See the unit The contractions au, du, aux and des."
  "fr-3765":
    native: "Morocco is near Spain."
    bases:
      "Maroc": "Morocco"
      "est": "is"
      "de": "of, from"
      "l'Espagne": "Spain"
    confusables:
      "algerie": { why: "Algérie is a neighbour of Morocco, further east." }
      "tunisie": { why: "Tunisie is a country east of Algeria." }
    notes:
      "espagne": "L'Espagne is the country south-west of France, and it takes l' before a vowel. The word card for Espagne gives this."
  "fr-3766":
    native: "Lyon is on the bank of the Rhône."
    bases:
      "Lyon": "Lyon"
      "est": "is"
      "au": "to the"
      "bord": "edge"
      "du": "of the"
      "Rhône": "Rhône"
    confusables:
      "loire": { why: "La Loire is another river, further west." }
      "seine": { why: "La Seine is the river of Paris." }
    notes:
      "du": "De and le join to form du: au bord du Rhône, 'on the bank of the Rhône'. See the unit The contractions au, du, aux and des."
  "fr-3767":
    native: "Geneva is in Switzerland."
    bases:
      "Genève": "Geneva"
      "est": "is"
      "en": "in"
      "Suisse": "Switzerland"
    confusables:
      "bruxelles": { why: "Bruxelles is in Belgium, not in Switzerland." }
      "montreal": { why: "Montréal is in Canada, not in Switzerland." }
    notes:
      "geneve": "Genève is a city in Switzerland by a lake, and a city name takes no article. The word card for Genève gives this."
  "fr-3768":
    native: "Senegal is in Africa."
    bases:
      "Sénégal": "Senegal"
      "est": "is"
      "en": "in"
      "Afrique": "Africa"
    confusables:
      "maroc": { why: "Maroc is another country in Africa." }
      "tunisie": { why: "Tunisie is another country in Africa." }
    notes:
      "senegal": "Le Sénégal is the country in West Africa, and it takes le. The word card for Sénégal gives this."
  "fr-3769":
    native: "Brittany is on the Atlantic."
    bases:
      "Bretagne": "Brittany"
      "est": "is"
      "l'Atlantique": "Atlantic"
    confusables:
      "normandie": { why: "Normandie is a region in the north-west." }
      "mediterranee": { why: "La Méditerranée is the sea in the south, not the ocean." }
    notes:
      "atlantique": "L'Atlantique is the ocean west of France, and it takes l' before a vowel. The word card for Atlantique gives this."
