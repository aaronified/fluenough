schema: 1
id: "fr-en-prepositions"
kind: "layer"
core: "fr-prepositions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Prepositions and the contractions au, du and aux"
license: "CC-BY-SA-4.0"
description: "Small words that link a noun to the rest of the sentence: avec, pour, sans, par, vers, après, avant and pendant, and how à and de join with le and les. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-0590":
    native: "with"
    notes:
      "n1": "Avec is 'with'. It is followed by a noun or a pronoun: avec moi (with me). It is not followed by de."
    examples:
      "Je parle avec mon frère.":
        native: "I speak with my brother."
        bases:
          "avec": "with"
      "Il vient avec moi.":
        native: "He comes with me."
        bases:
          "avec": "with"
  "fr-0591":
    native: "for; in order to"
    notes:
      "n1": "Pour is 'for' or 'in order to': pour toi (for you). It is followed by a noun, a pronoun or an infinitive."
    examples:
      "C'est pour toi.":
        native: "It is for you."
        bases:
          "pour": "for; in order to"
      "Je travaille pour mon père.":
        native: "I work for my father."
        bases:
          "pour": "for; in order to"
  "fr-0592":
    native: "without"
    notes:
      "n1": "Sans is 'without': sans moi (without me). It is the opposite of avec."
    examples:
      "Il part sans moi.":
        native: "He leaves without me."
        bases:
          "sans": "without"
      "Elle marche sans parler.":
        native: "She walks without speaking."
        bases:
          "sans": "without"
  "fr-0593":
    native: "through; by; per"
    notes:
      "n1": "Par is 'through' a place, or 'by' a means: passer par la rue (to go through the street)."
    examples:
      "Nous passons par la rue.":
        native: "We pass through the street."
        bases:
          "par": "through; by; per"
      "Ils passent par ici.":
        native: "They pass this way."
        bases:
          "par": "through; by; per"
  "fr-0594":
    native: "towards"
    notes:
      "n1": "Vers is 'towards' a place or a person: vers la gare (towards the station). It can also be 'about' with a time."
    examples:
      "Nous allons vers la gare.":
        native: "We go towards the station."
        bases:
          "vers": "towards"
      "Il marche vers moi.":
        native: "He walks towards me."
        bases:
          "vers": "towards"
  "fr-0595":
    native: "after"
    notes:
      "n1": "Après is 'after'. Its opposite is avant (before). Après moi means 'after me'."
    examples:
      "Ils mangent après nous.":
        native: "They eat after us."
        bases:
          "après": "after"
      "Après, nous partons.":
        native: "Afterwards, we leave."
        bases:
          "Après": "after"
  "fr-0596":
    native: "before"
    notes:
      "n1": "Avant is 'before'. Its opposite is après (after). Avant de is 'before doing' something."
    examples:
      "Nous partons avant toi.":
        native: "We leave before you."
        bases:
          "avant": "before"
      "Il arrive avant nous.":
        native: "He arrives before us."
        bases:
          "avant": "before"
  "fr-0597":
    native: "during; for (a time)"
    notes:
      "n1": "Pendant is 'during', or 'for' a length of time: pendant longtemps (for a long time)."
    examples:
      "Il dort pendant longtemps.":
        native: "He sleeps for a long time."
        bases:
          "pendant": "during; for (a time)"
      "Vous attendez pendant une heure.":
        native: "You wait for an hour."
        bases:
          "pendant": "during; for (a time)"
  "fr-0598":
    native: "prepositions: in, on, under, with, for and the rest"
    explanation: "A preposition is a small word that links a noun or a pronoun to the rest of the sentence. Some show where: dans (in), sur (on), sous (under), entre (between), contre (against), devant (in front of), derrière (behind) and chez (at the home of). Others show how or when: avec (with), sans (without), pour (for), par (through), vers (towards), après (after), avant (before) and pendant (during)."
