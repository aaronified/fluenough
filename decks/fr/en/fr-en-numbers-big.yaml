schema: 1
id: "fr-en-numbers-big"
kind: "layer"
core: "fr-numbers-big"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Tens and big numbers"
license: "CC-BY-SA-4.0"
description: "Numbers from thirty to ninety-nine, with cent, mille and million: trente, soixante-dix, quatre-vingts and quatre-vingt-dix-neuf. Hyphenated numbers are split into their parts. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-0702":
    native: "thirty"
    notes:
      "n1": "Trente is 'thirty'. It does not change. Trente et un is 'thirty-one', with et for 21, 31, 41, 51, 61 and 71, but not from 81 on."
    examples:
      "J'ai trente ans.":
        native: "I am thirty."
        bases:
          "trente": "thirty"
      "Ils sont trente.":
        native: "There are thirty of them."
        bases:
          "trente": "thirty"
  "fr-0703":
    native: "forty"
    notes:
      "n1": "Quarante is 'forty'. It is said like the French for four plus -ante, with the t said before a vowel."
    examples:
      "Mon père a quarante ans.":
        native: "My father is forty."
        bases:
          "quarante": "forty"
      "Nous sommes quarante.":
        native: "There are forty of us."
        bases:
          "quarante": "forty"
  "fr-0704":
    native: "fifty"
    notes:
      "n1": "Cinquante is 'fifty'. It starts with the same sound as cinq (five)."
    examples:
      "Ma tante a cinquante ans.":
        native: "My aunt is fifty."
        bases:
          "cinquante": "fifty"
      "Ils sont cinquante.":
        native: "There are fifty of them."
        bases:
          "cinquante": "fifty"
  "fr-0705":
    native: "sixty"
    notes:
      "n1": "Soixante is 'sixty'. It is the base of the numbers from 60 to 79 in the old way of counting."
    examples:
      "Mon oncle a soixante ans.":
        native: "My uncle is sixty."
        bases:
          "soixante": "sixty"
      "Ils ont soixante ans.":
        native: "They are sixty years old."
        bases:
          "soixante": "sixty"
  "fr-0706":
    native: "seventy"
    notes:
      "n1": "Soixante-dix is 'seventy', which is soixante plus dix (sixty-ten). Its parts are learnt as words already known."
    examples:
      "Ma mère a soixante-dix ans.":
        native: "My mother is seventy."
      "Ils sont soixante-dix.":
        native: "There are seventy of them."
  "fr-0707":
    native: "eighty"
    notes:
      "n1": "Quatre-vingts is 'eighty', literally four twenties. It takes an s, which is dropped before another number."
    examples:
      "Ma tante a quatre-vingts ans.":
        native: "My aunt is eighty."
      "Ils ont quatre-vingts ans.":
        native: "They are eighty years old."
  "fr-0708":
    native: "ninety"
    notes:
      "n1": "Quatre-vingt-dix is 'ninety', which is four twenties and ten. It has no s on vingt."
    examples:
      "Ils sont quatre-vingt-dix.":
        native: "There are ninety of them."
      "Nous sommes quatre-vingt-dix.":
        native: "There are ninety of us."
  "fr-0709":
    native: "a hundred"
    notes:
      "n1": "Cent is 'a hundred' or 'one hundred'. It takes an s only in deux cents (two hundred), and not before another number."
    examples:
      "C'est cent.":
        native: "It is a hundred."
        bases:
          "cent": "a hundred"
      "J'ai cent amis.":
        native: "I have a hundred friends."
        bases:
          "cent": "a hundred"
  "fr-0710":
    native: "a thousand"
    notes:
      "n1": "Mille is 'a thousand'. It never takes an s, even in the plural."
    examples:
      "C'est mille.":
        native: "It is a thousand."
        bases:
          "mille": "a thousand"
      "Il a mille amis.":
        native: "He has a thousand friends."
        bases:
          "mille": "a thousand"
  "fr-0711":
    native: "million"
    notes:
      "n1": "Million is 'million', a masculine noun. It takes de before the noun it counts: un million de (a million)."
    examples:
      "C'est un million.":
        native: "It is a million."
        bases:
          "million": "million"
      "Un million d'amis.":
        native: "A million friends."
        bases:
          "million": "million"
  "fr-0712":
    native: "zero"
    notes:
      "n1": "Zéro is 'zero'. It is a masculine word in speech, and it is used with the same meaning as in English."
    examples:
      "C'est zéro.":
        native: "It is zero."
        bases:
          "zéro": "zero"
      "Nous avons zéro problème.":
        native: "We have zero problems."
        bases:
          "zéro": "zero"
  "fr-0713":
    native: "twenty-one"
    notes:
      "n1": "Vingt-et-un is 'twenty-one'. The et is written and said in vingt-et-un, and in the same way in 31, 41, 51, 61 and 71. From 81 on there is no et."
    examples:
      "J'ai vingt-et-un ans.":
        native: "I am twenty-one."
      "Vingt-et-un amis sont là.":
        native: "Twenty-one friends are here."
  "fr-0714":
    native: "thirty-two"
    notes:
      "n1": "Trente-deux is 'thirty-two': trente plus deux. Each part is a number the learner already knows."
    examples:
      "Ils sont trente-deux.":
        native: "There are thirty-two of them."
      "Il a trente-deux amis.":
        native: "He has thirty-two friends."
  "fr-0715":
    native: "forty-five"
    notes:
      "n1": "Quarante-cinq is 'forty-five': quarante plus cinq. The final q of cinq is said, as it is on its own."
    examples:
      "Mon père a quarante-cinq ans.":
        native: "My father is forty-five."
      "C'est quarante-cinq.":
        native: "It is forty-five."
  "fr-0716":
    native: "seventy-five"
    notes:
      "n1": "Soixante-quinze is 'seventy-five': soixante plus quinze."
    examples:
      "Ils sont soixante-quinze.":
        native: "There are seventy-five of them."
      "Il a soixante-quinze ans.":
        native: "He is seventy-five."
  "fr-0717":
    native: "ninety-nine"
    notes:
      "n1": "Quatre-vingt-dix-neuf is 'ninety-nine', the last of the numbers before cent. It is the longest number of this unit."
    examples:
      "Ils sont quatre-vingt-dix-neuf.":
        native: "There are ninety-nine of them."
      "C'est quatre-vingt-dix-neuf.":
        native: "It is ninety-nine."
  "fr-0718":
    native: "sixty-five"
    notes:
      "n1": "Soixante-cinq is 'sixty-five': soixante plus cinq."
    examples:
      "Mon oncle a soixante-cinq ans.":
        native: "My uncle is sixty-five."
      "C'est soixante-cinq.":
        native: "It is sixty-five."
  "fr-0719":
    native: "fifty-two"
    notes:
      "n1": "Cinquante-deux is 'fifty-two': cinquante plus deux."
    examples:
      "Ma tante a cinquante-deux ans.":
        native: "My aunt is fifty-two."
      "Ils sont cinquante-deux.":
        native: "There are fifty-two of them."
  "fr-0720":
    native: "seventy-one"
    notes:
      "n1": "Soixante-et-onze is 'seventy-one', with et as in vingt-et-un: soixante plus onze."
    examples:
      "Il a soixante-et-onze ans.":
        native: "He is seventy-one."
      "Ils sont soixante-et-onze.":
        native: "There are seventy-one of them."
  "fr-0721":
    native: "eighty-one"
    notes:
      "n1": "Quatre-vingt-un is 'eighty-one'. Un is used here, not une, because the number has no noun of its own."
    examples:
      "Ma tante a quatre-vingt-un ans.":
        native: "My aunt is eighty-one."
      "Ils sont quatre-vingt-un.":
        native: "There are eighty-one of them."
  "fr-4700":
    native: "billion (a thousand million)"
    notes:
      "n1": "Un milliard is a thousand million, what English calls a billion. It is a masculine noun, and a quantity noun is followed by de before the thing counted."
    examples:
      "C'est un milliard.":
        native: "It is a billion."
        bases:
          "C'est": "it is"
          "milliard": "billion"
      "Il y a un milliard de personnes.":
        native: "There are a billion people."
        bases:
          "y": "there"
          "a": "is"
          "milliard": "billion"
          "de": "of"
          "personnes": "people"
  "fr-4701":
    native: "about a thousand"
    notes:
      "n1": "Un millier is about a thousand, and it is a masculine noun. Its plural, des milliers, is used for any large number, and it is followed by de before the thing counted."
    examples:
      "Un millier de gens attendent.":
        native: "About a thousand people are waiting."
        bases:
          "millier": "about a thousand"
          "de": "of"
          "gens": "people"
          "attendent": "are waiting"
      "Nous avons un millier de photos.":
        native: "We have about a thousand photos."
        bases:
          "avons": "have"
          "millier": "about a thousand"
          "de": "of"
          "photos": "photos"
  "fr-4702":
    native: "about ten; a group of ten"
    notes:
      "n1": "Une dizaine is about ten, or a group of ten, and it is a feminine noun. It is followed by de: une dizaine de jours."
    examples:
      "Une dizaine de jours.":
        native: "About ten days."
        bases:
          "dizaine": "about ten"
          "de": "of"
          "jours": "days"
      "J'ai une dizaine de chats.":
        native: "I have about ten cats."
        bases:
          "J'ai": "I have"
          "dizaine": "about ten"
          "de": "of"
          "chats": "cats"
  "fr-4703":
    native: "about a hundred"
    notes:
      "n1": "Une centaine is about a hundred, and it is a feminine noun, built from cent as dizaine is from dix. It is followed by de: une centaine de voitures."
    examples:
      "Une centaine de personnes sont là.":
        native: "About a hundred people are here."
        bases:
          "centaine": "about a hundred"
          "de": "of"
          "personnes": "people"
          "sont": "are"
      "Il vend une centaine de voitures.":
        native: "He sells about a hundred cars."
        bases:
          "vend": "sells"
          "centaine": "about a hundred"
          "de": "of"
          "voitures": "cars"
  "fr-4704":
    native: "comma; decimal comma"
    notes:
      "n1": "La virgule is the comma. In numbers French uses it as the decimal mark: dix virgule cinq is 10.5, where English writes a point."
    examples:
      "Écrivez dix virgule cinq.":
        native: "Write ten point five."
        bases:
          "Écrivez": "write"
          "virgule": "decimal comma"
      "Le prix est deux virgule cinq euros.":
        native: "The price is two point five euros."
        bases:
          "est": "is"
          "virgule": "decimal comma"
          "euros": "euros"
  "fr-4705":
    native: "sum; amount of money"
    notes:
      "n1": "La somme is 'the sum' or 'the amount of money', and it is a feminine noun. Quelle est la somme ? is the usual question at a till or a bank counter."
    examples:
      "La somme est juste.":
        native: "The amount is correct."
        bases:
          "somme": "sum"
          "est": "is"
      "Quelle est la somme ?":
        native: "What is the sum?"
        bases:
          "Quelle": "what"
          "est": "is"
          "somme": "sum"
  "fr-4706":
    native: "total; sum"
    notes:
      "n1": "Le total is 'the total', and it is a masculine noun. Faire le total means 'to add it up'."
    examples:
      "Le total est de cent euros.":
        native: "The total is a hundred euros."
        bases:
          "total": "total"
          "est": "is"
          "de": "of"
          "euros": "euros"
      "Faites le total, s'il vous plaît.":
        native: "Please add up the total."
        bases:
          "Faites": "add up"
          "total": "total"
          "s'il": "if"
          "plaît": "pleases"
  "fr-4707":
    native: "twice as much; the double"
    notes:
      "n1": "Le double is 'twice as much', a masculine noun: le double de dix is twenty. Use de before the number."
    examples:
      "C'est le double de dix.":
        native: "It is twice ten, that is twenty."
        bases:
          "C'est": "it is"
          "double": "double"
          "de": "of"
      "Ce vélo coûte le double.":
        native: "This bike costs twice as much."
        bases:
          "coûte": "costs"
          "double": "double"
  "fr-4708":
    native: "half"
    notes:
      "n1": "Demi is 'half'. Before a noun it is written with a hyphen and does not change (un demi-kilo); after a noun it agrees, as in une heure et demie."
    examples:
      "Il est une heure et demie.":
        native: "It is half past one."
        bases:
          "est": "is"
          "demie": "half"
      "Il faut un demi-kilo.":
        native: "You need half a kilo."
        bases:
          "faut": "you need"
          "demi-kilo": "half a kilo"
  "fr-4709":
    native: "second"
    notes:
      "n1": "Deuxième is 'second', the ordinal of deux. The first is premier, and the third is troisième."
    examples:
      "C'est la deuxième rue.":
        native: "It is the second street."
        bases:
          "C'est": "it is"
          "deuxième": "second"
      "C'est mon deuxième jour ici.":
        native: "It is my second day here."
        bases:
          "C'est": "it is"
          "deuxième": "second"
  "fr-4710":
    native: "third"
    notes:
      "n1": "Troisième is 'third', and it follows the pattern of deuxième. La troisième fois is 'the third time'."
    examples:
      "C'est la troisième fois.":
        native: "It is the third time."
        bases:
          "C'est": "it is"
          "troisième": "third"
      "J'habite au troisième étage.":
        native: "I live on the third floor."
        bases:
          "J'habite": "I live"
          "au": "on the"
          "troisième": "third"
  "fr-4711":
    native: "even (of a number)"
    notes:
      "n1": "Pair is 'even', said of a number; impair is 'odd'. Like most such adjectives it comes after its noun: un nombre pair."
    examples:
      "Douze est un nombre pair.":
        native: "Twelve is an even number."
        bases:
          "est": "is"
          "pair": "even"
      "Quatre est pair.":
        native: "Four is even."
        bases:
          "est": "is"
          "pair": "even"
