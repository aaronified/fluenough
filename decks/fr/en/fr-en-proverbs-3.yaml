  "fr-4401":
    native: "Absence is the enemy of love."
    notes:
      "literal": "Literally, absence is the enemy of love; Quitard links it to the saying 'loin des yeux et loin du cœur', after a line of Propertius: as far as the eyes go, love goes far from the heart."
