      "phénomène": "phenomenon"
      "inexpliqué": "unexplained"
  "fr-4217":
    native: "Every year, at Candlemas, the Provençal poets publish."
    notes:
      "n1": "The opening of 'Le Curé de Cucugnan' in Lettres de mon moulin (1869) by Alphonse Daudet: a tale of Provence, told at the Candlemas poetry feast."
