      "haute": "high"
      "montagne": "mountain"
  "fr-4213":
    native: "She was one of those pretty and charming girls."
    notes:
      "n1": "The opening sentence of 'La Parure' (The Necklace) in Contes du jour et de la nuit (1885) by Guy de Maupassant. The heroine is introduced as one of those girls born by a mistake of fate into a family of clerks."
    bases:
      "C'était": "she was"
      "une": "one"
      "de": "of"
      "ces": "these"
      "jolies": "pretty"
      "et": "and"
      "charmantes": "charming"
      "filles": "girls"
  "fr-4214":
    native: "I accuse Lieutenant Colonel du Paty de Clam of having been the diabolical workman of the judicial error."
    notes:
      "n1": "A sentence from the open letter 'J'accuse…!' by Émile Zola, published in L'Aurore on 13 January 1898 during the Dreyfus affair. The letter names officers it holds responsible for the miscarriage of justice."
    bases:
      "J'accuse": "I accuse"
      "le": "the"
      "lieutenant-colonel": "lieutenant colonel"
      "du": "of the"
      "Paty": "Paty"
      "de": "of"
      "Clam": "Clam"
      "d'avoir": "of having"
      "été": "been"
      "l'ouvrier": "the workman"
      "diabolique": "diabolical"
      "l'erreur": "the error"
      "judiciaire": "judicial"
  "fr-4215":
    native: "All human wisdom will lie in these two words: wait and hope."
    notes:
      "n1": "The closing words of Le Comte de Monte-Cristo (1844-1846) by Alexandre Dumas, chapter 117: the Count sums up his wisdom in two words."
    bases:
      "Toute": "all"
      "la": "the"
      "sagesse": "wisdom"
      "humaine": "human"
      "sera": "will be"
      "dans": "in"
      "ces": "these"
      "deux": "two"
      "mots": "words"
