name: "Culture: French poems of the nineteenth century"
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
description: "The first line of five French poems of the nineteenth century, in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-4200":
    native: "Tomorrow, at dawn, when the countryside turns white, I shall set out."
    notes:
      "n1": "The first line of the poem 'Demain, dès l'aube' in Les Contemplations (1856) by Victor Hugo. The poet, in grief, says he will go to the place of a loved one at first light, by forest and mountain."
    bases:
      "Demain": "tomorrow"
      "dès": "from"
      "l'aube": "dawn"
      "à": "at"
      "l'heure": "the hour"
      "où": "when"
      "blanchit": "turns white, grows pale"
      "la": "the"
      "campagne": "countryside"
  "fr-4201":
    native: "Thus, always driven onward toward new shores."
    notes:
      "n1": "The first line of 'Le Lac' (The Lake), the tenth meditation of the Méditations poétiques (1820) by Alphonse de Lamartine. The poet speaks to a lake, and to the time that passes, as travellers pushed toward new shores."
    bases:
      "Ainsi": "thus"
      "toujours": "always"
      "poussés": "pushed"
      "vers": "toward"
      "de": "of"
      "nouveaux": "new"
      "rivages": "shores"
  "fr-4202":
    native: "Often, for amusement, the sailors catch albatrosses."
    notes:
      "n1": "The first line of 'L'Albatros' in Les Fleurs du mal (1861) by Charles Baudelaire. The albatross, a great sea bird, is caught by sailors for fun, and it becomes awkward on the deck. The poem is about the poet among other people."
    bases:
      "Souvent": "often"
      "pour": "for"
      "s'amuser": "to amuse themselves"
      "les": "the"
      "hommes": "men"
      "d'équipage": "of the crew"
  "fr-4203":
    native: "The flesh is sad, alas, and I have read all the books."
    notes:
      "n1": "The first line of 'Brise marine' (Sea breeze) by Stéphane Mallarmé, dated 1865 on French Wikipedia. The speaker is tired of books and wants to leave, to sail away, and to escape."
    bases:
      "La": "the"
      "chair": "flesh"
      "est": "is"
      "triste": "sad"
      "hélas": "alas"
      "et": "and"
      "j'ai": "I have"
      "lu": "read"
      "tous": "all"
      "les": "the"
      "livres": "books"
  "fr-4204":
    native: "It is a hollow of greenery where a river sings."
    notes:
      "n1": "The first line of 'Le Dormeur du val' (The Sleeper in the Valley) by Arthur Rimbaud. The poem describes a young soldier asleep in a green valley, with a bright river and a hole in his chest. The first printing is dated 1891."
    bases:
      "C'est": "it is"
      "un": "a"
      "trou": "hollow"
      "de": "of"
      "verdure": "greenery"
      "où": "where"
      "chante": "sings"
      "une": "a"
      "rivière": "river"
  "fr-4205":
    native: "To groan, to weep, to pray is equally cowardly."
    notes:
      "n1": "A line from La Mort du loup in Les Destinées (published 1864) by Alfred de Vigny. The dying wolf, who has faced the hunters, says that complaining is weakness."
    bases:
      "Gémir": "to groan"
      "pleurer": "to weep"
      "prier": "to pray"
      "est": "is"
      "également": "equally"
      "lâche": "cowardly"
  "fr-4206":
    native: "I am the dark one, the widower, the inconsolable."
    notes:
      "n1": "The first line of the sonnet 'El Desdichado' by Gérard de Nerval, printed in 1854 with Les Chimères. The poet calls himself the unhappy prince of the poem."
    bases:
      "Je": "I"
      "suis": "am"
      "le": "the"
      "ténébreux": "dark, gloomy"
      "veuf": "widower"
      "l'inconsolé": "the inconsolable"
  "fr-4207":
    native: "Sculpt, file, chisel."
    notes:
      "n1": "The opening of the poem 'L'Art' in Émaux et Camées (1852) by Théophile Gautier. The poet tells the artist to shape hard material, so that the work will outlast bronze."
    bases:
      "Sculpte": "sculpt"
      "lime": "file"
      "cisèle": "chisel"
  "fr-4208":
    native: "Poet, take your lute, and give me a kiss."
    notes:
      "n1": "The Muse's first line in 'La Nuit de mai' by Alfred de Musset, written in 1835. The Muse speaks to the poet and asks him to sing."
    bases:
      "Poète": "poet"
      "prends": "take"
      "ton": "your"
      "luth": "lute"
      "et": "and"
      "me": "me"
      "donne": "give"
      "un": "a"
      "baiser": "kiss"
  "fr-4209":
    native: "The long sobs of the violins of autumn."
    notes:
      "n1": "The first lines of 'Chanson d'automne' in Poèmes saturniens by Paul Verlaine (1866). The poem hears the sad sound of autumn as violins."
    bases:
      "Les": "the"
      "sanglots": "sobs"
      "longs": "long"
      "des": "of the"
      "violons": "violins"
      "de": "of"
      "l'automne": "autumn"
  "fr-4210":
    native: "Boaz had gone to bed, overcome with tiredness."
    notes:
      "n1": "The first line of 'Booz endormi' in La Légende des siècles (1859) by Victor Hugo: the old farmer Boaz sleeps after a day's work, as in the Bible."
    bases:
      "Booz": "Boaz (the character)"
      "s'était": "had been"
      "couché": "gone to bed"
      "de": "from"
      "fatigue": "tiredness"
      "accablé": "overcome"
  "fr-4211":
    native: "Madame Vauquer, born de Conflans, is an old woman."
    notes:
      "n1": "The first sentence of chapter I of Le Père Goriot (1835) by Honoré de Balzac: the keeper of the boarding house of the novel is introduced."
    bases:
      "Madame": "Madam"
      "Vauquer": "Vauquer"
      "née": "born"
      "de": "of"
      "Conflans": "Conflans"
      "est": "is"
      "une": "a"
      "vieille": "old"
      "femme": "woman"
  "fr-4212":
    native: "Verrières is sheltered on the north side by a high mountain."
    notes:
      "n1": "A sentence of chapter I of Le Rouge et le Noir (1830) by Stendhal: the small town of the novel lies in the mountains of Franche-Comté."
    bases:
      "Verrières": "Verrières (the town)"
      "est": "is"
      "abritée": "sheltered"
      "du": "on the"
