      "et": "and"
      "espérer": "to hope"
  "fr-4216":
    native: "A strange event, an unexplained phenomenon."
    notes:
      "n1": "From the opening of chapter 1 of Vingt mille lieues sous les mers (1870) by Jules Verne: a strange sea monster is reported by ships in the year the chapter opens."
    bases:
      "Un": "a"
      "événement": "event"
