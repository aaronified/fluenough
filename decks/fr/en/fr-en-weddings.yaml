schema: 1
id: "fr-en-weddings"
kind: "layer"
core: "fr-weddings"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Weddings"
license: "CC-BY-SA-4.0"
description: "Forty words for weddings: the people who marry, the ceremony and the party, and the words for love and family that come with them. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-2367":
    native: "spouse, husband"
    notes:
      "n1": "Un époux is a husband, the formal word; the plural époux means the couple."
    examples:
      "Les époux sortent de la mairie.":
        native: "The couple leave the town hall."
        bases:
          "époux": "spouse, husband"
          "de": "of, from, some"
      "Mon époux est médecin.":
        native: "My husband is a doctor."
        bases:
          "époux": "spouse, husband"
  "fr-2368":
    native: "ceremony"
    notes:
      "n1": "Une cérémonie is a formal event, such as a wedding."
    examples:
      "La cérémonie commence à quinze heures.":
        native: "The ceremony starts at three."
        bases:
          "cérémonie": "ceremony"
          "à": "to, at"
      "Cette cérémonie est très émouvante.":
        native: "This ceremony is very moving."
        bases:
          "cérémonie": "ceremony"
  "fr-2369":
    native: "wedding ring"
    notes:
      "n1": "Une alliance is the ring given at a wedding."
    examples:
      "Il porte son alliance.":
        native: "He wears his wedding ring."
        bases:
          "alliance": "wedding ring"
      "L'alliance est en or.":
        native: "The wedding ring is gold."
        bases:
          "L'alliance": "wedding ring"
          "en": "in, by, as"
          "or": "gold"
  "fr-2370":
    native: "guest"
    notes:
      "n1": "Un invité is a guest; the feminine is une invitée."
    examples:
      "Les invités arrivent à midi.":
        native: "The guests arrive at noon."
        bases:
          "invités": "guest"
          "à": "to, at"
      "Chaque invité reçoit un cadeau.":
        native: "Each guest receives a present."
        bases:
          "invité": "guest"
  "fr-2371":
    native: "bouquet, bunch"
    notes:
      "n1": "Un bouquet is a bunch of flowers."
    examples:
      "Le bouquet est très joli.":
        native: "The bouquet is very pretty."
        bases:
          "bouquet": "bouquet, bunch"
      "Elle reçoit un bouquet de roses.":
        native: "She receives a bouquet of roses."
        bases:
          "bouquet": "bouquet, bunch"
          "de": "of, from, some"
          "roses": "roses"
  "fr-2372":
    native: "banquet, wedding meal"
    notes:
      "n1": "Un banquet is a large festive meal for many people."
    examples:
      "Le banquet est servi à huit heures.":
        native: "The banquet is served at eight."
        bases:
          "banquet": "banquet, wedding meal"
          "à": "to, at"
      "Nous dansons après le banquet.":
        native: "We dance after the banquet."
        bases:
          "banquet": "banquet, wedding meal"
  "fr-2373":
    native: "bridesmaid"
    notes:
      "n1": "Une demoiselle d’honneur helps the bride at the wedding."
    bases:
      "demoiselle": "young woman"
      "d'honneur": "honour"
    examples:
      "La demoiselle d'honneur porte un bouquet.":
        native: "The bridesmaid carries a bouquet."
        bases:
          "demoiselle": "young woman"
          "d'honneur": "honour"
      "Ma cousine est demoiselle d'honneur.":
        native: "My cousin is a bridesmaid."
        bases:
          "demoiselle": "young woman"
          "d'honneur": "honour"
  "fr-2374":
    native: "to get engaged"
    notes:
      "n1": "Se fiancer is regular: to get engaged."
    examples:
      "Ils se fiancent au printemps.":
        native: "They get engaged in spring."
        bases:
          "se": "themselves"
          "fiancent": "to get engaged"
          "au": "at, to the"
      "Nous nous fiançons demain.":
        native: "We get engaged tomorrow."
        bases:
          "fiançons": "to get engaged"
  "fr-2375":
    native: "to marry"
    notes:
      "n1": "Marier is regular: se marier is to get married."
    examples:
      "Ils se marient en juin.":
        native: "They get married in June."
        bases:
          "se": "themselves"
          "marient": "to marry"
          "en": "in, by, as"
      "Le maire marie le couple.":
        native: "The mayor marries the couple."
        bases:
          "marie": "to marry"
  "fr-2376":
    native: "to kiss"
    notes:
      "n1": "Embrasser is regular: to kiss, or to hug."
    examples:
      "Les mariés s'embrassent.":
        native: "The newlyweds kiss."
        bases:
          "s'embrassent": "to kiss"
      "J'embrasse ma mère.":
        native: "I kiss my mother."
        bases:
          "J'embrasse": "to kiss"
  "fr-2377":
    native: "to invite"
    notes:
      "n1": "Inviter is regular: to invite someone to an event."
    examples:
      "Nous invitons toute la famille.":
        native: "We invite the whole family."
        bases:
          "invitons": "to invite"
      "Je t'invite au mariage.":
        native: "I invite you to the wedding."
        bases:
          "t'invite": "to invite"
          "au": "at, to the"
  "fr-2378":
    native: "widowed"
    notes:
      "n1": "Veuf takes the feminine veuve."
    examples:
      "Mon grand-père est veuf.":
        native: "My grandfather is a widower."
        bases:
          "veuf": "widowed"
      "Elle est veuve depuis cinq ans.":
        native: "She has been a widow for five years."
        bases:
          "veuve": "widow"
          "depuis": "since"
  "fr-2379":
    native: "honeymoon"
    notes:
      "n1": "La lune de miel is the holiday a couple takes after the wedding."
    bases:
      "de": "of, from, some"
    examples:
      "Ils partent en lune de miel.":
        native: "They leave on honeymoon."
        bases:
          "en": "in, by, as"
          "de": "of, from, some"
      "La lune de miel dure une semaine.":
        native: "The honeymoon lasts a week."
        bases:
          "de": "of, from, some"
  "fr-2380":
    native: "wish, vow"
    notes:
      "n1": "Un vœu is a wish; faire un vœu is to make a wish."
    examples:
      "Elle fait un vœu.":
        native: "She makes a wish."
        bases:
          "vœu": "wish, vow"
      "Les vœux du couple sont beaux.":
        native: "The couple’s vows are beautiful."
        bases:
          "vœux": "wish, vow"
          "du": "some, of the"
  "fr-2381":
    native: "speech"
    notes:
      "n1": "Un discours is a formal speech given to an audience."
    examples:
      "Le témoin fait un discours.":
        native: "The best man gives a speech."
        bases:
          "discours": "speech"
      "Ce discours est très drôle.":
        native: "This speech is very funny."
        bases:
          "discours": "speech"
  "fr-2382":
    native: "moving, touching"
    notes:
      "n1": "Émouvant takes the feminine émouvante."
    examples:
      "Ce moment est émouvant.":
        native: "This moment is moving."
        bases:
          "émouvant": "moving, touching"
      "La musique est très émouvante.":
        native: "The music is very moving."
        bases:
          "émouvante": "moving, touching"
  "fr-2383":
    native: "elegant"
    notes:
      "n1": "Élégant takes the feminine élégante."
    examples:
      "Il porte un costume élégant.":
        native: "He wears an elegant suit."
        bases:
          "élégant": "elegant"
      "Elle est très élégante ce soir.":
        native: "She is very elegant tonight."
        bases:
          "élégante": "elegant"
  "fr-2384":
    native: "promise"
    notes:
      "n1": "Une promesse is a promise made to someone."
    examples:
      "Il fait une promesse à sa femme.":
        native: "He makes a promise to his wife."
        bases:
          "promesse": "promise"
          "à": "to, at"
      "Cette promesse est importante.":
        native: "This promise is important."
        bases:
          "promesse": "promise"
  "fr-2385":
    native: "family celebration"
    notes:
      "n1": "Une fête de famille gathers relatives for a celebration."
    bases:
      "de": "of, from, some"
    examples:
      "C'est une fête de famille.":
        native: "It is a family celebration."
        bases:
          "de": "of, from, some"
      "La fête de famille dure toute la journée.":
        native: "The family celebration lasts all day."
        bases:
          "de": "of, from, some"
  "fr-2386":
    native: "moon"
    notes:
      "n1": "La lune is the moon; the honeymoon is la lune de miel."
    examples:
      "La lune est pleine ce soir.":
        native: "The moon is full tonight."
        bases:
          "lune": "moon"
      "Elle regarde la lune.":
        native: "She looks at the moon."
        bases:
          "lune": "moon"
  "fr-2396":
    native: "register"
    notes:
      "n1": "Un registre is the official book where marriages and births are written down."
    examples:
      "Le registre est sur la table.":
        native: "The register is on the table."
        bases:
          "registre": "register"
      "Ils signent le registre de la mairie.":
        native: "They sign the town hall register."
        bases:
          "registre": "register"
          "de": "of, from, some"
  "fr-2397":
    native: "couple"
    notes:
      "n1": "Un couple is two people together, as a pair."
    examples:
      "Ce couple est très heureux.":
        native: "This couple is very happy."
        bases:
          "couple": "couple"
      "Le couple danse ensemble.":
        native: "The couple dances together."
        bases:
          "couple": "couple"
  "fr-2398":
    native: "veil"
    notes:
      "n1": "Un voile is a veil worn over the head or face."
    examples:
      "La mariée porte un long voile.":
        native: "The bride wears a long veil."
        bases:
          "voile": "veil"
      "Le voile est très léger.":
        native: "The veil is very light."
        bases:
          "voile": "veil"
  "fr-2399":
    native: "ring (band)"
    notes:
      "n1": "Un anneau is a ring, a circle of metal."
    examples:
      "L'anneau brille au doigt.":
        native: "The ring shines on the finger."
        bases:
          "L'anneau": "ring (band)"
          "au": "at, to the"
      "Il met un anneau à son doigt.":
        native: "He puts a ring on her finger."
        bases:
          "anneau": "ring (band)"
          "à": "to, at"
  "fr-2400":
    native: "caterer"
    notes:
      "n1": "Un traiteur prepares the food for a party."
    examples:
      "Le traiteur sert le repas.":
        native: "The caterer serves the meal."
        bases:
          "traiteur": "caterer"
      "Nous choisissons un traiteur.":
        native: "We choose a caterer."
        bases:
          "traiteur": "caterer"
  "fr-2401":
    native: "photographer"
    notes:
      "n1": "Un photographe takes photos; it is used for both genders."
    examples:
      "Le photographe prend les photos.":
        native: "The photographer takes the photos."
        bases:
          "photographe": "photographer"
      "Ma sœur est photographe.":
        native: "My sister is a photographer."
        bases:
          "photographe": "photographer"
  "fr-2402":
    native: "wedding night"
    notes:
      "n1": "La nuit de noces is the first night of a married couple."
    bases:
      "de": "of, from, some"
      "noces": "wedding"
    examples:
      "La nuit de noces est douce.":
        native: "The wedding night is sweet."
        bases:
          "de": "of, from, some"
          "noces": "wedding"
      "Ils passent la nuit de noces à Paris.":
        native: "They spend the wedding night in Paris."
        bases:
          "de": "of, from, some"
          "noces": "wedding"
          "à": "to, at"
          "Paris": "Paris"
