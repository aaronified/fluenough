schema: 1
id: "fr-en-calendar-sentences"
kind: "layer"
core: "fr-calendar-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences: months and years"
license: "CC-BY-SA-4.0"
description: "Ten sentences about the calendar, each with the words it is often mixed up with. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-1187":
    native: "The month of January is cold."
    confusables:
      "année": { why: "Année is 'year', not 'month'." }
      "saison": { why: "Saison is 'season', a longer period than a month." }
  "fr-1188":
    native: "My birthday is in June."
    confusables:
      "fête": { why: "Fête is 'party' or 'holiday', not 'birthday'." }
      "vacances": { why: "Vacances is 'holidays', the time off work or school." }
  "fr-1189":
    native: "We celebrate Christmas with friends."
    confusables:
      "fête": { why: "Fête is a party or a feast. The verb for 'to celebrate' is fêter." }
      "année": { why: "Année is 'year', not a celebration." }
  "fr-1190":
    native: "At the weekend, I do not work."
    confusables:
      "semaine": { why: "Semaine is 'week', seven days, not the two days of the weekend." }
      "travail": { why: "Travail is 'work', the noun for the job itself." }
  "fr-1191":
    native: "Spring comes in March."
    confusables:
      "saison": { why: "Saison is 'season', the general word for printemps and the others." }
      "hiver": { why: "Hiver is 'winter', a different season." }
  "fr-1192":
    native: "A year has twelve months."
    confusables:
      "siècle": { why: "Siècle is 'century', a hundred years." }
      "trimestre": { why: "Trimestre is 'term' or 'quarter', three months, not a year." }
  "fr-1193":
    native: "The next day, I put the diary away."
    confusables:
      "calendrier": { why: "Calendrier is 'calendar', the chart or app of the whole year." }
      "veille": { why: "Veille is 'the day before', the opposite of lendemain." }
  "fr-1194":
    native: "This century is very fast."
    confusables:
      "année": { why: "Année is 'year', a shorter time than a siècle." }
      "trimestre": { why: "Trimestre is 'quarter', three months." }
