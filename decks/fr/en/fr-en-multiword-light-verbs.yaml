id: "fr-en-multiword-light-verbs"
kind: "layer"
core: "fr-multiword-light-verbs"
native:
  code: "en"
  iso639_3: "eng"
  name: "English"
name: "Multi-word verbs: light verbs"
description: "Twenty phrases built on a light verb such as faire, avoir, prendre, mettre, tenir or rendre: pay attention, queue, get acquainted, cook, go for a walk, be hungry, be right, be wrong, seem,\
  \ have a bath, decide, take care, set the table, take time, take into account, and visit. Not yet checked by a French speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags:
- "unreviewed"
cards:
  "fr-4600":
    native: "to pay attention"
    notes:
      u1: "Faire attention means to take care or pay attention; it can take à: fais attention à la route, watch the road."
  "fr-4601":
    native: "to queue up"
    notes:
      u1: "Faire la queue means to stand in a line of people waiting: nous faisons la queue, we are queuing."
    bases:
      queue: "tail; queue"
  "fr-4602":
    native: "to get to know each other"
    notes:
      u1: "Faire connaissance means to meet someone for the first time and become acquainted with them."
    bases:
      connaissance: "acquaintance; knowledge"
  "fr-4603":
    native: "to cook"
    notes:
      u1: "Faire la cuisine means to cook or do the cooking; cuisine alone can also mean the kitchen."
  "fr-4604":
    native: "to go for a walk"
    notes:
      u1: "Faire une promenade is the noun form of se promener: a single outing, with une agreeing with the feminine noun."
  "fr-4605":
    native: "to be hungry"
    notes:
      u1: "Avoir faim means to be hungry; the noun faim goes with avoir, not with être: j'ai faim, I am hungry."
    bases:
      faim: "hunger"
  "fr-4606":
    native: "to be right"
    notes:
      u1: "Avoir raison means to be right; its opposite is avoir tort."
  "fr-4607":
    native: "to be wrong"
    notes:
      u1: "Avoir tort means to be wrong; its opposite is avoir raison."
    bases:
      tort: "wrong; fault"
  "fr-4608":
    native: "to seem or look"
    notes:
      u1: "Avoir l'air means to seem or look: il a l'air fatigué, he looks tired. The noun air means air or look."
    bases:
      "l'air": "air; look; appearance"
  "fr-4609":
    native: "to have a bath"
    notes:
      u1: "Prendre un bain means to have a bath, as opposed to prendre une douche, to have a shower."
  "fr-4610":
    native: "to make a decision"
    notes:
      u1: "Prendre une décision means to make a decision; here the verb is prendre, not faire."
    bases:
      "décision": "decision"
  "fr-4611":
    native: "to take care of"
    notes:
      u1: "Prendre soin de means to look after someone or something: elle prend soin de son père, she looks after her father."
    bases:
      soin: "care"
      de: "of; from; about"
  "fr-4612":
    native: "to set the table"
    notes:
      u1: "Mettre la table means to lay the table for a meal."
  "fr-4613":
    native: "to take time"
    notes:
      u1: "Mettre du temps à means to take time to do something, with à before the infinitive: il met du temps à répondre."
    bases:
      du: "of; from; about; the contraction of de and le, used for some"
  "fr-4614":
    native: "to take into account"
    notes:
      u1: "Tenir compte de means to take something into account: il tient compte de ton avis, he takes your opinion into account."
    bases:
      de: "of; from; about"
  "fr-4615":
    native: "to visit someone"
    notes:
      u1: "Rendre visite à means to visit a person, who comes after à: je rends visite à ma mère, I visit my mother."
    bases:
      "à": "at; to; of"
  "fr-4616":
    native: "to go for a stroll"
    notes:
      u1: "Faire un tour means to go for a short walk, drive or ride: on fait un tour, let's go for a stroll."
    bases:
      tour: "turn; trip; stroll"
  "fr-4617":
    native: "to be thirsty"
    notes:
      u1: "Avoir soif means to be thirsty, like avoir faim: j'ai soif, I am thirsty."
    bases:
      soif: "thirst"
  "fr-4618":
    native: "to be hot"
    notes:
      u1: "Avoir chaud means to feel hot. Its opposite is avoir froid: j'ai chaud, I am hot."
  "fr-4619":
    native: "to be cold"
    notes:
      u1: "Avoir froid means to feel cold, the opposite of avoir chaud: j'ai froid, I am cold."
