cards:
  "fr-2498":
    native: "The tenant pays the rent and the deposit."
    confusables:
      "proprietaire": { why: "The owner receives rent; the sentence names the tenant paying." }
      "bail": { why: "A lease is the contract; the sentence names the payments." }
    notes:
      "loyer": "Un loyer is the money paid each month to rent a home: le locataire paie le loyer. The word card for loyer gives this."
  "fr-2499":
    native: "The flat has a large kitchen and a balcony."
    confusables:
      "salon": { why: "A living room is another room; the sentence names the kitchen." }
      "jardin": { why: "A garden is outside; the sentence names a balcony." }
    notes:
      "agreement": "Grand, 'large', takes -e for the feminine noun la cuisine: grande."
  "fr-2500":
    native: "The block has a lift and a staircase."
    confusables:
      "etage": { why: "A floor is a level; the sentence names the lift and stairs." }
      "grenier": { why: "An attic is at the top; the sentence names two ways to go up." }
    notes:
      "ascenseur": "Un ascenseur is a lift in a building: un ascenseur et un escalier. The word card for ascenseur gives this."
  "fr-2501":
    native: "Putting the furniture away in the cellar is hard."
    confusables:
      "armoire": { why: "A wardrobe is a piece of furniture; the sentence names a cellar." }
      "canape": { why: "A sofa is furniture; the sentence is about moving it." }
    notes:
      "ranger": "Ranger is regular, 'to put things in their place': ranger le meuble. The word card for ranger gives this."
  "fr-2502":
    native: "The heating and the hot water are cut off."
    confusables:
      "voisinage": { why: "The neighbourhood is around the home; the sentence is about services." }
      "plafond": { why: "A ceiling is part of a room; the sentence names utilities." }
    notes:
      "chauffage": "Le chauffage is the heating of a home: le chauffage et l'eau chaude. The word card for chauffage gives this."
  "fr-2503":
    native: "We sign the lease and move house in May."
    bases:
      "en": "in, by, as"
    confusables:
      "emmenager": { why: "To move in is what happens after; the sentence names moving house." }
      "louer": { why: "To rent is the same idea; the sentence names signing a lease." }
    notes:
      "en-month": "Months take en, 'in': en mai, 'in May'."
  "fr-2504":
    native: "The flat viewing starts at noon."
    bases:
      "de": "of, from, some"
      "à": "to, at"
    confusables:
      "porte": { why: "A door is part of the flat; the sentence is about a viewing." }
      "fenetre": { why: "A window is part of the flat; the sentence is about a viewing." }
    notes:
      "visite": "Une visite is a viewing of a flat: la visite de l'appartement. The word card for visite gives this."
