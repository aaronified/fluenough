kind: "layer"
core: "fr-adjectives-2-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing a room sentences"
license: "CC-BY-SA-4.0"
description: "Example sentences about describing a room, each with the words it is often mixed up with. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-3600":
    native: "The room is bright and quiet."
    bases:
      "est": "is"
      "lumineuse": "bright"
    confusables:
      "sombre": { why: "Sombre means dark; lumineux is bright." }
      "obscur": { why: "Obscur is dark, a stronger word than sombre." }
  "fr-3601":
    native: "The corridor is narrow, but clean."
    bases:
      "est": "is"
      "étroit": "narrow"
    confusables:
      "large": { why: "Large means wide, the opposite of étroit." }
      "spacieux": { why: "Spacieux means roomy; étroit means narrow." }
  "fr-3602":
    native: "The flat is furnished and comfortable."
    bases:
      "L'appartement": "flat"
      "est": "is"
      "meublé": "furnished"
      "confortable": "comfortable"
    confusables:
      "renove": { why: "Rénové means renovated, not furnished." }
      "equipe": { why: "Équipé means equipped with appliances; meublé means furnished." }
  "fr-3603":
    native: "The kitchen is handy but cluttered."
    bases:
      "est": "is"
      "pratique": "practical, handy"
      "encombrée": "cluttered"
    confusables:
      "desordonne": { why: "Désordonné means messy, a state of a room, not a space that is full." }
      "range": { why: "Rangé means tidy, the opposite of encombré." }
  "fr-3604":
    native: "The living room is light and spacious."
    bases:
      "est": "is"
      "spacieux": "spacious"
    confusables:
      "sombre": { why: "Sombre is dark, the opposite of clair." }
      "vaste": { why: "Vaste means vast, a larger word than spacieux." }
  "fr-3605":
    native: "The staircase is dangerous, be careful."
    bases:
      "L'escalier": "staircase"
      "est": "is"
      "dangereux": "dangerous"
    confusables:
      "fragile": { why: "Fragile means easily broken, not dangerous." }
      "solide": { why: "Solide means strong and sturdy." }
  "fr-3606":
    native: "The door is damaged and worn."
    bases:
      "est": "is"
      "abîmée": "damaged"
      "usée": "worn"
    confusables:
      "casse": { why: "Cassé means broken; abîmé means damaged, not necessarily broken." }
      "solide": { why: "Solide means solid, the opposite of abîmé." }
  "fr-3607":
    native: "The room is cosy and warm."
    bases:
      "est": "is"
      "douillette": "cosy"
      "chaleureuse": "warm"
    confusables:
      "confortable": { why: "Confortable means comfortable to use; douillet describes a warm, cosy feeling." }
      "agreable": { why: "Agréable means pleasant; chaleureux describes warmth." }
  "fr-3608":
    native: "The living room is very well lit in the morning."
    bases:
      "est": "is"
      "éclairé": "lit"
    confusables:
      "eteint": { why: "Éteint means off; éclairé means lit." }
      "allume": { why: "Allumé means switched on; éclairé describes a room full of light." }
  "fr-3609":
    native: "The flat is near the centre."
    bases:
      "L'appartement": "flat"
      "est": "is"
      "proche": "near, close"
      "du": "of the"
    confusables:
      "central": { why: "Central describes a place in the middle of town; proche means near." }
      "gare": { why: "Gare is a station; proche is an adjective meaning near." }
