schema: 1
id: "fr-en-arts"
kind: "layer"
core: "fr-arts"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Arts"
license: "CC-BY-SA-4.0"
description: "Forty words for the arts: painting and music, theatre and books, the people who make them, and the verbs for creating and showing them. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-2254":
    native: "art"
    notes:
      "n1": "L’art is art in general; un art is a single art form, such as music or painting."
    examples:
      "L'art est partout dans la ville.":
        native: "Art is everywhere in the town."
        bases:
          "L'art": "art"
      "Il étudie l'art à Paris.":
        native: "He studies art in Paris."
        bases:
          "l'art": "art"
          "à": "to"
          "Paris": "Paris"
  "fr-2255":
    native: "artist"
    notes:
      "n1": "Un artiste makes art; it is used for both genders."
    examples:
      "L'artiste peint une grande toile.":
        native: "The artist paints a large canvas."
        bases:
          "L'artiste": "artist"
          "toile": "canvas"
      "Ma sœur est artiste.":
        native: "My sister is an artist."
        bases:
          "artiste": "artist"
  "fr-2256":
    native: "sculpture"
    notes:
      "n1": "Une sculpture is a three-dimensional work of art."
    examples:
      "Cette sculpture est en bronze.":
        native: "This sculpture is made of bronze."
        bases:
          "sculpture": "sculpture"
          "en": "in, by, as"
          "bronze": "bronze"
      "La sculpture est dans le jardin.":
        native: "The sculpture is in the garden."
        bases:
          "sculpture": "sculpture"
  "fr-2257":
    native: "exhibition"
    notes:
      "n1": "Une exposition is a display of works of art."
    examples:
      "L'exposition dure tout l'été.":
        native: "The exhibition lasts all summer."
        bases:
          "L'exposition": "exhibition"
      "Cette exposition est gratuite.":
        native: "This exhibition is free."
        bases:
          "exposition": "exhibition"
  "fr-2258":
    native: "to sculpt"
    notes:
      "n1": "Sculpter is regular: to carve or shape a figure."
    examples:
      "Elle sculpte une statue.":
        native: "She sculpts a statue."
        bases:
          "sculpte": "to sculpt"
          "statue": "statue"
      "Il sculpte le bois.":
        native: "He carves wood."
        bases:
          "sculpte": "to sculpt"
          "bois": "wood"
  "fr-2259":
    native: "to create"
    notes:
      "n1": "Créer is regular; the noun is création."
    examples:
      "Elle crée une belle image.":
        native: "She creates a beautiful image."
        bases:
          "crée": "to create"
          "image": "image"
      "Nous créons un nouveau spectacle.":
        native: "We create a new show."
        bases:
          "créons": "to create"
  "fr-2260":
    native: "to exhibit"
    notes:
      "n1": "Exposer is regular; exposer means to show in public."
    examples:
      "Il expose ses tableaux à Lyon.":
        native: "He exhibits his paintings in Lyon."
        bases:
          "expose": "to exhibit"
          "à": "to"
          "Lyon": "Lyon"
      "Le musée expose des sculptures.":
        native: "The museum exhibits sculptures."
        bases:
          "expose": "to exhibit"
  "fr-2261":
    native: "to admire"
    notes:
      "n1": "Admirer is regular; to admire a work of art."
    examples:
      "J'admire ce tableau.":
        native: "I admire this painting."
        bases:
          "J'admire": "to admire"
      "Ils admirent le paysage.":
        native: "They admire the landscape."
        bases:
          "admirent": "to admire"
  "fr-2262":
    native: "dance"
    notes:
      "n1": "La danse is the art of dancing."
    examples:
      "La danse est une belle forme d'art.":
        native: "Dance is a beautiful art form."
        bases:
          "forme": "form"
      "Elle fait de la danse classique.":
        native: "She does classical dance."
        bases:
          "de": "of, from, some"
  "fr-2263":
    native: "concert"
    notes:
      "n1": "Un concert is a live music performance."
    examples:
      "Le concert commence à huit heures.":
        native: "The concert starts at eight."
        bases:
          "concert": "concert"
          "à": "to"
      "Nous allons à un concert demain.":
        native: "We are going to a concert tomorrow."
        bases:
          "à": "to"
          "concert": "concert"
  "fr-2264":
    native: "poetry"
    notes:
      "n1": "La poésie is poetry as an art."
    examples:
      "J'aime la poésie française.":
        native: "I like French poetry."
        bases:
          "poésie": "poetry"
      "La poésie parle de l'amour.":
        native: "Poetry speaks of love."
        bases:
          "poésie": "poetry"
          "de": "of, from, some"
  "fr-2265":
    native: "author"
    notes:
      "n1": "Un auteur writes a book, play or song; the feminine is autrice or auteure."
    examples:
      "L'auteur écrit un nouveau livre.":
        native: "The author writes a new book."
        bases:
          "L'auteur": "author"
      "Cet auteur est très connu.":
        native: "This author is very well known."
        bases:
          "auteur": "author"
  "fr-2266":
    native: "writer"
    notes:
      "n1": "Un écrivain is a professional writer; it is used for both genders."
    examples:
      "Cet écrivain vit à Paris.":
        native: "This writer lives in Paris."
        bases:
          "écrivain": "writer"
          "vit": "lives"
          "à": "to"
          "Paris": "Paris"
      "Elle est écrivain et journaliste.":
        native: "She is a writer and a journalist."
        bases:
          "écrivain": "writer"
  "fr-2267":
    native: "talent"
    notes:
      "n1": "Un talent is a natural gift for doing something well."
    examples:
      "Elle a un grand talent.":
        native: "She has a great talent."
        bases:
          "talent": "talent"
      "Le talent se développe avec le travail.":
        native: "Talent develops with work."
        bases:
          "talent": "talent"
          "se": "oneself"
          "développe": "develops"
  "fr-2268":
    native: "style"
    notes:
      "n1": "Un style is the way someone creates or writes."
    examples:
      "Son style est très clair.":
        native: "His style is very clear."
        bases:
          "style": "style"
          "clair": "clear"
      "J'aime ce style de musique.":
        native: "I like this style of music."
        bases:
          "style": "style"
          "de": "of, from, some"
  "fr-2269":
    native: "work of art"
    notes:
      "n1": "Une œuvre is a work of art, music or literature."
    examples:
      "Cette œuvre est célèbre.":
        native: "This work is famous."
        bases:
          "œuvre": "work of art"
      "Il présente son œuvre au public.":
        native: "He presents his work to the public."
        bases:
          "présente": "presents"
          "œuvre": "work of art"
          "au": "at, to the"
  "fr-2270":
    native: "gallery"
    notes:
      "n1": "Une galerie is a place where art is shown and sold."
    examples:
      "La galerie est ouverte le mardi.":
        native: "The gallery is open on Tuesday."
        bases:
          "galerie": "gallery"
      "Cette galerie montre des peintres modernes.":
        native: "This gallery shows modern painters."
        bases:
          "galerie": "gallery"
          "montre": "shows"
          "peintres": "painters"
  "fr-2271":
    native: "show, performance"
    notes:
      "n1": "Un spectacle is a live show in a theatre or on stage."
    examples:
      "Le spectacle est excellent.":
        native: "The show is excellent."
        bases:
          "spectacle": "show, performance"
          "excellent": "excellent"
      "Nous voyons un spectacle de danse.":
        native: "We see a dance show."
        bases:
          "spectacle": "show, performance"
          "de": "of, from, some"
  "fr-2272":
    native: "original"
    notes:
      "n1": "Original takes the feminine originale."
    examples:
      "C'est une idée originale.":
        native: "It is an original idea."
        bases:
          "originale": "original"
      "Cette peinture est originale.":
        native: "This painting is original."
        bases:
          "originale": "original"
  "fr-2273":
    native: "modern"
    notes:
      "n1": "Moderne takes the same form in both genders."
    examples:
      "Ce musée est très moderne.":
        native: "This museum is very modern."
        bases:
          "moderne": "modern"
      "Il aime la musique moderne.":
        native: "He likes modern music."
        bases:
          "moderne": "modern"
  "fr-2274":
    native: "classical"
    notes:
      "n1": "Classique takes the same form in both genders."
    examples:
      "J'écoute de la musique classique.":
        native: "I listen to classical music."
        bases:
          "de": "of, from, some"
          "classique": "classical"
      "Ce tableau est classique.":
        native: "This painting is classic."
        bases:
          "classique": "classical"
  "fr-2275":
    native: "famous"
    notes:
      "n1": "Célèbre takes the same form in both genders."
    examples:
      "Ce peintre est célèbre.":
        native: "This painter is famous."
        bases:
          "peintre": "painter"
          "célèbre": "famous"
      "La ville est célèbre pour ses musées.":
        native: "The town is famous for its museums."
        bases:
          "célèbre": "famous"
  "fr-2276":
    native: "to inspire"
    notes:
      "n1": "Inspirer is regular: être inspiré par is to be inspired by."
    examples:
      "La nature m'inspire.":
        native: "Nature inspires me."
        bases:
          "nature": "nature"
          "m'inspire": "to inspire"
      "Elle s'inspire de sa grand-mère.":
        native: "She draws inspiration from her grandmother."
        bases:
          "s'inspire": "to inspire"
          "de": "of, from, some"
  "fr-2277":
    native: "aesthetic"
    notes:
      "n1": "Esthétique takes the same form in both genders."
    examples:
      "Ce bâtiment est esthétique.":
        native: "This building is aesthetic."
        bases:
          "bâtiment": "building"
          "esthétique": "aesthetic"
      "L'aspect esthétique compte beaucoup.":
        native: "The aesthetic side counts a lot."
        bases:
          "L'aspect": "aspect"
          "esthétique": "aesthetic"
          "compte": "counts"
  "fr-2278":
    native: "staging, direction"
    notes:
      "n1": "La mise en scène is the way a play or film is staged."
    examples:
      "La mise en scène est originale.":
        native: "The staging is original."
        bases:
          "mise": "put"
          "en": "in, by, as"
      "Il travaille sur la mise en scène.":
        native: "He works on the staging."
        bases:
          "mise": "put"
          "en": "in, by, as"
