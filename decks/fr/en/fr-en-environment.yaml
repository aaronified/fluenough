schema: 1
id: "fr-en-environment"
kind: "layer"
core: "fr-environment"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Environment"
license: "CC-BY-SA-4.0"
description: "Forty words for the environment: pollution and climate, recycling and energy, nature in danger, and the verbs of protecting it. Not yet checked by a French speaker: please report any mistake."

cards:
  "fr-2162":
    native: "environment"
    notes:
      "n1": "L’environnement is the natural world around us; the adjective is environnemental."
    examples:
      "Il faut protéger l'environnement.":
        native: "We must protect the environment."
        bases:
          "faut": "must"
          "l'environnement": "environment"
      "Cet environnement est très calme.":
        native: "This environment is very calm."
        bases:
          "environnement": "environment"
  "fr-2163":
    native: "pollution"
    notes:
      "n1": "La pollution is the damage done by waste, smoke or noise."
    examples:
      "La pollution de l'air est forte.":
        native: "Air pollution is strong."
        bases:
          "pollution": "pollution"
          "de": "of"
      "Cette usine crée beaucoup de pollution.":
        native: "This factory creates a lot of pollution."
        bases:
          "crée": "creates"
          "de": "of"
          "pollution": "pollution"
  "fr-2164":
    native: "climate"
    notes:
      "n1": "Le climat is the typical weather of a region over years."
    examples:
      "Le climat change vite.":
        native: "The climate is changing fast."
        bases:
          "climat": "climate"
      "Ce pays a un climat doux.":
        native: "This country has a mild climate."
        bases:
          "climat": "climate"
  "fr-2165":
    native: "ecology"
    notes:
      "n1": "L’écologie is the study of living things and their homes; a person who cares is écologiste."
    examples:
      "Elle s'intéresse à l'écologie.":
        native: "She is interested in ecology."
        bases:
          "s'intéresse": "is interested"
          "à": "to, at"
          "l'écologie": "ecology"
      "L'écologie est importante pour tous.":
        native: "Ecology is important for everyone."
        bases:
          "L'écologie": "ecology"
  "fr-2166":
    native: "recycling"
    notes:
      "n1": "Le recyclage turns used things into new ones."
    examples:
      "Le recyclage du verre est facile.":
        native: "Glass recycling is easy."
        bases:
          "recyclage": "recycling"
          "du": "some, of the"
      "Faites du recyclage chaque semaine.":
        native: "Do recycling every week."
        bases:
          "du": "some, of the"
          "recyclage": "recycling"
  "fr-2167":
    native: "waste"
    notes:
      "n1": "Un déchet is a thing thrown away; les déchets are rubbish."
    examples:
      "Ce déchet va dans la poubelle jaune.":
        native: "This waste goes in the yellow bin."
        bases:
          "déchet": "waste"
          "jaune": "yellow"
      "Trop de déchets finissent dans la mer.":
        native: "Too much waste ends up in the sea."
        bases:
          "de": "of"
          "déchets": "waste"
  "fr-2168":
    native: "plastic"
    notes:
      "n1": "Le plastique is a material; it is also an adjective, plastic."
    examples:
      "La bouteille est en plastique.":
        native: "The bottle is made of plastic."
        bases:
          "en": "in"
          "plastique": "plastic"
      "Il faut réduire le plastique.":
        native: "We must reduce plastic."
        bases:
          "faut": "must"
          "plastique": "plastic"
  "fr-2169":
    native: "forest"
    notes:
      "n1": "Une forêt is a large area of trees."
    examples:
      "La forêt est très grande.":
        native: "The forest is very large."
        bases:
          "forêt": "forest"
      "Nous marchons dans la forêt.":
        native: "We walk in the forest."
        bases:
          "forêt": "forest"
  "fr-2170":
    native: "tree"
    notes:
      "n1": "Un arbre is a tree; the plural is arbres."
    examples:
      "Cet arbre a cent ans.":
        native: "This tree is a hundred years old."
        bases:
          "arbre": "tree"
      "Nous plantons un arbre demain.":
        native: "We are planting a tree tomorrow."
        bases:
          "plantons": "plant"
          "arbre": "tree"
  "fr-2171":
    native: "energy"
    notes:
      "n1": "Une énergie is a source of power for heat, light or movement."
    examples:
      "L'énergie coûte de plus en plus cher.":
        native: "Energy costs more and more."
        bases:
          "L'énergie": "energy"
          "de": "of"
          "en": "in"
      "Cette énergie est propre.":
        native: "This energy is clean."
        bases:
          "énergie": "energy"
  "fr-2172":
    native: "solar"
    notes:
      "n1": "Solaire takes the same form in both genders."
    examples:
      "Les panneaux solaires chauffent l'eau.":
        native: "Solar panels heat the water."
        bases:
          "panneaux": "panels"
          "solaires": "solar"
          "chauffent": "heat"
      "L'énergie solaire est gratuite.":
        native: "Solar energy is free."
        bases:
          "solaire": "solar"
  "fr-2173":
    native: "wind (adj)"
    notes:
      "n1": "Éolien takes the feminine éolienne; une éolienne is a wind turbine."
    examples:
      "Une éolienne tourne dans le champ.":
        native: "A wind turbine turns in the field."
        bases:
          "éolienne": "wind (adj)"
          "champ": "field"
      "L'énergie éolienne est propre.":
        native: "Wind energy is clean."
        bases:
          "éolienne": "wind (adj)"
  "fr-2174":
    native: "ocean"
    notes:
      "n1": "Un océan is a very large sea."
    examples:
      "L'océan est immense.":
        native: "The ocean is immense."
        bases:
          "L'océan": "ocean"
          "immense": "immense"
      "Les océans se réchauffent.":
        native: "The oceans are warming."
        bases:
          "océans": "ocean"
          "se": "oneself"
          "réchauffent": "warm"
  "fr-2175":
    native: "species"
    notes:
      "n1": "Une espèce is a group of living things of the same kind."
    examples:
      "Cette espèce est menacée.":
        native: "This species is threatened."
        bases:
          "espèce": "species"
          "menacée": "threatened"
      "Beaucoup d'espèces disparaissent.":
        native: "Many species are disappearing."
        bases:
          "disparaissent": "disappear"
  "fr-2176":
    native: "warming"
    notes:
      "n1": "Le réchauffement is the rise in temperature."
    examples:
      "Le réchauffement est rapide.":
        native: "The warming is fast."
        bases:
          "réchauffement": "warming"
      "Le réchauffement menace la côte.":
        native: "Warming threatens the coast."
        bases:
          "réchauffement": "warming"
          "menace": "threatens"
          "côte": "coast"
  "fr-2177":
    native: "carbon"
    notes:
      "n1": "Le carbone is a chemical element; the carbon footprint is l’empreinte carbone."
    examples:
      "Le carbone sort des usines.":
        native: "Carbon comes out of factories."
        bases:
          "carbone": "carbon"
      "Réduisez votre empreinte carbone.":
        native: "Reduce your carbon footprint."
        bases:
          "empreinte": "footprint"
          "carbone": "carbon"
  "fr-2178":
    native: "to protect"
    notes:
      "n1": "Protéger is regular; the accent changes to è in je protège."
    examples:
      "Il faut protéger les animaux.":
        native: "We must protect the animals."
        bases:
          "faut": "must"
          "protéger": "to protect"
      "Je protège la nature.":
        native: "I protect nature."
        bases:
          "protège": "to protect"
          "nature": "nature"
  "fr-2179":
    native: "to pollute"
    notes:
      "n1": "Polluer is regular; it is the opposite of protéger."
    examples:
      "Les usines polluent l'air.":
        native: "Factories pollute the air."
        bases:
          "polluent": "to pollute"
      "Ne polluez pas la rivière.":
        native: "Do not pollute the river."
        bases:
          "Ne": "not"
          "polluez": "to pollute"
          "pas": "not"
          "rivière": "river"
  "fr-2180":
    native: "to recycle"
    notes:
      "n1": "Recycler is regular: to recycle used things."
    examples:
      "Nous recyclons le papier.":
        native: "We recycle paper."
        bases:
          "recyclons": "to recycle"
      "Recyclez les bouteilles en verre.":
        native: "Recycle the glass bottles."
        bases:
          "Recyclez": "to recycle"
          "en": "in"
  "fr-2181":
    native: "to reduce"
    notes:
      "n1": "Réduire is irregular: je réduis, nous réduisons."
    examples:
      "Je réduis ma consommation.":
        native: "I reduce my consumption."
        bases:
          "réduis": "to reduce"
          "consommation": "consumption"
      "Il faut réduire les déchets.":
        native: "We must reduce waste."
        bases:
          "faut": "must"
          "réduire": "to reduce"
  "fr-2183":
    native: "air"
    notes:
      "n1": "L’air is the air we breathe."
    examples:
      "L'air est frais ce matin.":
        native: "The air is fresh this morning."
        bases:
          "L'air": "air"
      "Il y a de l'air pur ici.":
        native: "There is clean air here."
        bases:
          "y": "there"
          "de": "of"
          "l'air": "air"
          "pur": "pure"
  "fr-2186":
    native: "sustainable"
    notes:
      "n1": "Durable takes the same form in both genders."
    examples:
      "C'est un choix durable.":
        native: "It is a sustainable choice."
        bases:
          "choix": "choice"
          "durable": "sustainable"
      "Ce développement est durable.":
        native: "This development is sustainable."
        bases:
          "développement": "development"
          "durable": "sustainable"
  "fr-2187":
    native: "threat"
    notes:
      "n1": "Une menace is a danger that may happen."
    examples:
      "La menace est réelle.":
        native: "The threat is real."
        bases:
          "menace": "threatens"
          "réelle": "real"
      "Le feu est une menace pour la forêt.":
        native: "Fire is a threat to the forest."
        bases:
          "menace": "threatens"
  "fr-2188":
    native: "disaster"
    notes:
      "n1": "Une catastrophe is a sudden, very bad event."
    examples:
      "C'est une vraie catastrophe.":
        native: "It is a real disaster."
        bases:
          "catastrophe": "disaster"
      "La catastrophe a touché le village.":
        native: "The disaster hit the village."
        bases:
          "catastrophe": "disaster"
          "touché": "hit"
          "village": "village"
  "fr-2189":
    native: "flood"
    notes:
      "n1": "Une inondation is the flooding of land by water."
    examples:
      "L'inondation a détruit la route.":
        native: "The flood destroyed the road."
        bases:
          "L'inondation": "flood"
          "détruit": "destroyed"
      "Il y a une inondation dans la ville.":
        native: "There is a flood in the town."
        bases:
          "y": "there"
          "inondation": "flood"
  "fr-2190":
    native: "drought"
    notes:
      "n1": "La sécheresse is a long period with no rain."
    examples:
      "La sécheresse dure depuis un mois.":
        native: "The drought has lasted a month."
        bases:
          "sécheresse": "drought"
          "depuis": "since"
      "Cette sécheresse est très grave.":
        native: "This drought is very serious."
        bases:
          "sécheresse": "drought"
          "grave": "serious"
  "fr-2192":
    native: "deforestation"
    notes:
      "n1": "La déforestation is the loss of forests by cutting them down."
    examples:
      "La déforestation augmente.":
        native: "Deforestation is increasing."
        bases:
          "déforestation": "deforestation"
          "augmente": "increases"
      "La déforestation menace les animaux.":
        native: "Deforestation threatens the animals."
        bases:
          "déforestation": "deforestation"
          "menace": "threatens"
  "fr-2193":
    native: "to waste"
    notes:
      "n1": "Gaspiller is regular: to waste time, water or food."
    examples:
      "Ne gaspillez pas l'eau.":
        native: "Do not waste water."
        bases:
          "Ne": "not"
          "gaspillez": "to waste"
          "pas": "not"
      "Il gaspille beaucoup d'argent.":
        native: "He wastes a lot of money."
        bases:
          "gaspille": "to waste"
  "fr-2194":
    native: "to sort"
    notes:
      "n1": "Trier is regular: to sort rubbish into bins."
    examples:
      "Je trie les déchets.":
        native: "I sort the rubbish."
        bases:
          "trie": "to sort"
      "Triez le papier et le verre.":
        native: "Sort the paper and the glass."
        bases:
          "Triez": "to sort"
  "fr-2195":
    native: "to compost"
    notes:
      "n1": "Composter is regular: to turn food waste into soil."
    examples:
      "Nous compostons les restes.":
        native: "We compost the leftovers."
        bases:
          "compostons": "to compost"
          "restes": "leftovers"
      "Il compose les épluchures.":
        native: "He composts the peelings."
        bases:
          "compose": "to compost"
          "épluchures": "peelings"
