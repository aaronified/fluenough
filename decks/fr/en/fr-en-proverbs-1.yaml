      "printemps": { meaning: "spring" }
  "fr-4301":
    native: "At Candlemas come the great pains, the hard cold."
    notes:
      "literal": "Literally, the great pains are the severe frosts of early February, when Candlemas is kept; plain meaning: the cold often comes hardest at the start of February."
    bases:
