description: "Seventeen French idioms: feeling down, being stood up, a very high price, fainting, green fingers, annoying someone, putting one's foot in it, a frog in the throat, a long lie-in, giving\
  \ up a guess, running away, getting back to the point, calling a spade a spade, being fed up, beating about the bush, overcomplicating, and okay. Not yet checked by a French speaker: please report any\
  \ mistake."
