    notes:
      u1: "Literally, to have the cockroach; it means to feel gloomy for a while."
    bases:
      cafard: "cockroach; here, a low mood"
  "fr-4551":
    native: "to stand someone up"
    notes:
      u1: "Literally, to put down a rabbit; it means not to turn up for an arranged meeting."
  "fr-4552":
    native: "to cost an arm and a leg"
    notes:
