facts:
  - id: fr-fact-001
    tags: [sound, liaison]
    source: "https://en.wikipedia.org/wiki/Liaison_(French)"
    text:
      en: "A final consonant that is silent on its own is often said when the next word starts with a vowel: les amis sounds like 'lez-ami', but les garçons keeps its s silent. This link is called liaison."
      bn: "ফরাসিতে কোনো শব্দের শেষের যে ব্যঞ্জন সাধারণত উচ্চারিত হয় না, পরের শব্দ স্বরবর্ণ দিয়ে শুরু হলে সেটি প্রায়ই উচ্চারিত হয়: les amis-এ s শোনা যায়, কিন্তু les garçons-এ নীরবই থাকে। একে বলে liaison।"
      hi: "फ़्रांसीसी में शब्द के अंत का जो व्यंजन अकेले बोला नहीं जाता, वह अगला शब्द स्वर से शुरू होने पर अक्सर बोला जाता है: les amis में s सुनाई देता है, जबकि les garçons में चुप रहता है। इसे liaison कहते हैं।"
  - id: fr-fact-002
    tags: [spelling]
    source: "https://en.wikipedia.org/wiki/French_orthography"
    text:
      en: "Many French word endings are silent. parle, parles and parlent all sound the same, and only the spelling tells them apart."
      bn: "ফরাসিতে শব্দের শেষের অনেক অক্ষর উচ্চারিত হয় না। parle, parles আর parlent তিনটিরই উচ্চারণ এক; তফাত শুধু বানানে।"
      hi: "फ़्रांसीसी में शब्दों के अंत के कई अक्षर नहीं बोले जाते। parle, parles और parlent का उच्चारण एक ही है; अंतर केवल वर्तनी में दिखता है।"
  - id: fr-fact-003
    tags: [sound]
    source: "https://en.wikipedia.org/wiki/French_phonology"
    text:
      en: "Most French speakers today make the r at the back of the throat, with the body of the tongue, not the tip. The sound is uvular and written [ʁ]."
      bn: "আজকের বেশিরভাগ ফরাসিভাষী r বলেন গলার পেছন দিকে, জিভের পেছনের অংশ দিয়ে; ডগা দিয়ে নয়। এই ধ্বনিকে বলে uvular (আলজিভ-ঘেঁষা), আর লেখা হয় [ʁ]। বাংলার 'র' বলা হয় জিভের ডগা দিয়ে, তাই দুটোর তফাত স্পষ্ট।"
      hi: "आज के ज़्यादातर फ़्रांसीसी भाषी r को गले के पिछले हिस्से में, जीभ के पिछले भाग से बोलते हैं, नोक से नहीं। यह ध्वनि अलिजिह्वीय (uvular) कहलाती है और [ʁ] लिखी जाती है।"
  - id: fr-fact-004
    tags: [sound, nasal]
    source: "https://en.wikipedia.org/wiki/French_phonology"
    text:
      en: "In bon, vin and blanc the n is not said as a consonant. It makes the vowel before it nasal, with air passing through the nose, so the n is written but not heard as a sound of its own."
      bn: "bon, vin আর blanc-এ n আলাদা ব্যঞ্জন হিসেবে উচ্চারিত হয় না; বরং তার আগের স্বরটি নাকি হয়ে যায়, অর্থাৎ বাতাস নাক দিয়ে বেরোয়। তাই n লেখা থাকলেও আলাদা ধ্বনি হিসেবে শোনা যায় না।"
      hi: "bon, vin और blanc में n अलग व्यंजन के रूप में नहीं बोला जाता; उससे पहले का स्वर नासिक्य हो जाता है, यानी हवा नाक से निकलती है। यह हिंदी के अनुनासिक (ँ) जैसा ही है, फ़र्क़ बस इतना कि फ़्रांसीसी में n लिखा जाता है।"
  - id: fr-fact-005
    tags: [spelling, meaning]
    source: "https://en.wikipedia.org/wiki/French_orthography"
    text:
      en: "Accents can change a word's meaning: ou means 'or', but où means 'where'; la means 'the' or 'it', while là means 'there'."
      bn: "ছোট্ট একটি চিহ্ন শব্দের মানে বদলে দেয়: ou মানে 'বা', কিন্তু où মানে 'কোথায়'; la মানে 'the' (স্ত্রীলিঙ্গ) বা 'তাকে', আর là মানে 'সেখানে'।"
      hi: "उच्चारण-चिह्न (accent) अर्थ बदल देते हैं: ou का अर्थ 'या' है, पर où का अर्थ 'कहाँ'; la का अर्थ 'the' या 'उसे' है, जबकि là का 'वहाँ'।"
  - id: fr-fact-006
    tags: [spelling]
    source: "https://en.wikipedia.org/wiki/Cedilla"
    text:
      en: "The cedilla ç is written only before a, o and u, where it makes the c sound like s: garçon (boy), français (French)."
      bn: "সেদিয়া-চিহ্ন ç শুধু a, o ও u-এর আগে বসে এবং c-কে s-এর মতো উচ্চারণ করায়: garçon (ছেলে), français (ফরাসি)।"
      hi: "सेदिय (ç) केवल a, o और u से पहले लिखा जाता है और c का उच्चारण s जैसा कर देता है: garçon (लड़का), français (फ़्रांसीसी)।"
  - id: fr-fact-007
    tags: [spelling]
    source: "https://en.wikipedia.org/wiki/French_orthography"
    text:
      en: "Words that begin with h come in two kinds. l'homme (the man) takes l' like a word starting with a vowel, but le héros (the hero) does not. Neither h is pronounced."
      bn: "h দিয়ে শুরু ফরাসি শব্দ দুই রকমের: l'homme (পুরুষ মানুষ) স্বরবর্ণ দিয়ে শুরু শব্দের মতোই l' নেয়, কিন্তু le héros (নায়ক) নেয় না। দুটির কোনোটিতেই h উচ্চারিত হয় না।"
      hi: "h से शुरू होने वाले शब्द दो तरह के होते हैं: l'homme (आदमी) स्वर से शुरू होने वाले शब्द की तरह l' लेता है, पर le héros (नायक) नहीं लेता। दोनों में h का उच्चारण नहीं होता।"
  - id: fr-fact-008
    tags: [words, loanwords, history]
    source: "https://en.wikipedia.org/wiki/Anglo-Norman_language"
    text:
      en: "After the Norman Conquest of 1066, French was the language of England's court and nobility for centuries. English took in words such as beef (from boeuf) and pork (from porc)."
      bn: "১০৬৬ সালের নর্মান বিজয়ের পর কয়েক শতাব্দী ধরে ইংল্যান্ডের রাজদরবার ও অভিজাতদের ভাষা ছিল ফরাসি। সেই যুগের বহু শব্দ ইংরেজিতে ঢুকে পড়েছে, যেমন beef (boeuf থেকে) আর pork (porc থেকে)।"
      hi: "1066 की नॉर्मन विजय के बाद कई सदियों तक इंग्लैंड के दरबार और कुलीन वर्ग की भाषा फ़्रांसीसी रही। अंग्रेज़ी ने उस दौर के कई शब्द अपना लिए, जैसे beef (boeuf से) और pork (porc से)।"
  - id: fr-fact-009
    tags: [history, language]
    source: "https://en.wikipedia.org/wiki/French_language"
    text:
      en: "French is one of the six official languages of the United Nations, alongside Arabic, Chinese, English, Russian and Spanish."
      bn: "ফরাসি রাষ্ট্রসংঘের ছয়টি সরকারি ভাষার একটি; বাকি পাঁচটি আরবি, চিনা, ইংরেজি, রুশ ও স্প্যানিশ।"
      hi: "फ़्रांसीसी संयुक्त राष्ट्र की छह आधिकारिक भाषाओं में से एक है; बाक़ी पाँच हैं अरबी, चीनी, अंग्रेज़ी, रूसी और स्पेनिश।"
  - id: fr-fact-010
    tags: [history]
    source: "https://en.wikipedia.org/wiki/French_language"
    text:
      en: "French comes from the Latin spoken in Gaul, the region that is now mostly France. It is a Romance language, the name given to the languages that grew out of Latin."
      bn: "ফরাসি ভাষা এসেছে গল অঞ্চলে বলা ল্যাটিন থেকে; সেই অঞ্চলের বেশিরভাগ অংশই এখন ফ্রান্স। তাই ফরাসি একটি রোমান্স ভাষা; ল্যাটিন থেকে জন্ম নেওয়া ভাষাগুলোকে এই নামেই ডাকা হয়।"
      hi: "फ़्रांसीसी उस लैटिन से निकली है जो गॉल में बोली जाती थी, यानी उस इलाक़े में जो आज ज़्यादातर फ़्रांस है। इसीलिए यह एक रोमांस भाषा है; लैटिन से जन्मी भाषाओं को यही नाम दिया जाता है।"
  - id: fr-fact-011
    tags: [history, institutions]
    source: "https://en.wikipedia.org/wiki/French_Academy"
    text:
      en: "The Académie française was founded in 1635 by Cardinal Richelieu to set the standards of the French language. Its forty members are called 'the immortals'."
      bn: "ফরাসি ভাষার মান ঠিক করার জন্য ১৬৩৫ সালে কার্ডিনাল রিশলিউ আকাদেমি ফ্রাঁসেজ প্রতিষ্ঠা করেন। এর চল্লিশ জন সদস্যকে বলা হয় 'অমর' (immortels)।"
      hi: "फ़्रांसीसी भाषा के मानक तय करने के लिए कार्डिनल रिशेल्यू ने 1635 में अकादेमी फ़्रांसेज़ (Académie française) की स्थापना की। इसके चालीस सदस्य 'अमर' (immortels) कहलाते हैं।"
  - id: fr-fact-012
    tags: [politeness, grammar]
    source: "https://en.wikipedia.org/wiki/T%E2%80%93V_distinction"
    text:
      en: "French has two words for 'you'. Tu is for a child, a close friend or a relative; vous is for a stranger, an elder or a boss, and for more than one person."
      bn: "ফরাসিতে 'তুমি' আর 'আপনি'-র জন্য দুটি আলাদা শব্দ আছে: tu শিশু, ঘনিষ্ঠ বন্ধু বা আত্মীয়ের জন্য; vous অপরিচিত, বয়সে বড় বা উপরওয়ালার জন্য, আর একাধিক মানুষকে বলার সময়ও।"
      hi: "फ़्रांसीसी में 'तुम' और 'आप' के लिए अलग-अलग शब्द हैं: tu बच्चे, क़रीबी दोस्त या रिश्तेदार के लिए; vous अजनबी, बड़ों या बॉस के लिए, और एक से ज़्यादा लोगों के लिए भी। हिंदी के तू, तुम और आप में भी ऐसा ही फ़र्क़ है।"
  - id: fr-fact-013
    tags: [politeness, culture]
    source: "https://en.wikipedia.org/wiki/Cheek_kissing"
    text:
      en: "In France, friends and acquaintances often greet each other with la bise, a kiss on each cheek. How many kisses are given changes from one region to another."
      bn: "ফ্রান্সে বন্ধু ও পরিচিতেরা সাধারণত la bise দিয়ে একে অপরকে অভিবাদন জানান, অর্থাৎ দুই গালে চুমু। কতবার চুমু দেওয়া হয়, তা অঞ্চলভেদে আলাদা।"
      hi: "फ़्रांस में दोस्त और जान-पहचान वाले अक्सर la bise से एक-दूसरे का अभिवादन करते हैं, यानी दोनों गालों पर चुंबन। कितनी बार चूमा जाता है, यह इलाक़े के हिसाब से बदलता है।"
  - id: fr-fact-014
    tags: [regions, belgium]
    source: "https://en.wikipedia.org/wiki/Belgium"
    text:
      en: "Belgium has three official languages: Dutch, French and German. French is the main language of Wallonia, and most people in Brussels speak it."
      bn: "বেলজিয়ামের সরকারি ভাষা তিনটি: ডাচ, ফরাসি ও জার্মান। ওয়ালোনিয়ায় ফরাসিই প্রধান ভাষা, আর ব্রাসেলসেও বেশিরভাগ মানুষ ফরাসিতে কথা বলেন।"
      hi: "बेल्जियम की तीन आधिकारिक भाषाएँ हैं: डच, फ़्रांसीसी और जर्मन। वालोनिया (Wallonia) की मुख्य भाषा फ़्रांसीसी है, और ब्रसेल्स में भी ज़्यादातर लोग इसी में बात करते हैं।"
  - id: fr-fact-015
    tags: [regions, switzerland]
    source: "https://en.wikipedia.org/wiki/Languages_of_Switzerland"
    text:
      en: "Switzerland has four national languages: German, French, Italian and Romansh. French is the first language of the western cantons, such as Geneva and Vaud."
      bn: "সুইজারল্যান্ডের জাতীয় ভাষা চারটি: জার্মান, ফরাসি, ইতালীয় ও রোমানশ। জেনেভা আর ভো-র মতো পশ্চিমের ক্যান্টনগুলোতে ফরাসিই প্রথম ভাষা।"
      hi: "स्विट्ज़रलैंड की चार राष्ट्रीय भाषाएँ हैं: जर्मन, फ़्रांसीसी, इतालवी और रोमांश। जिनेवा और वो (Vaud) जैसे पश्चिमी कैंटनों में फ़्रांसीसी ही पहली भाषा है।"
  - id: fr-fact-016
    tags: [regions, words, quebec]
    source: "https://en.wikipedia.org/wiki/Quebec_French"
    text:
      en: "Quebec French has its own words: a car is a char, and to go shopping is magasiner, where France says faire les courses."
      bn: "কুইবেকের ফরাসির নিজস্ব কিছু শব্দ আছে: গাড়িকে বলে char, আর কেনাকাটা করতে যাওয়াকে magasiner; ফ্রান্সে এর জায়গায় বলা হয় voiture আর faire les courses।"
      hi: "क्यूबेक की फ़्रांसीसी के अपने कुछ शब्द हैं: गाड़ी को char कहते हैं और ख़रीदारी करने जाने को magasiner; फ़्रांस में इनकी जगह voiture और faire les courses कहा जाता है।"
  - id: fr-fact-017
    tags: [regions, history, quebec]
    source: "https://en.wikipedia.org/wiki/Charter_of_the_French_Language"
    text:
      en: "Since 1977, Quebec's Charter of the French Language, known as Bill 101, has made French the official language of the province's government, courts and laws."
      bn: "১৯৭৭ সাল থেকে কুইবেকের ফরাসি ভাষা সনদ, যা Bill 101 নামে পরিচিত, ফরাসিকে প্রদেশের সরকার, আদালত ও আইনপ্রণয়নের সরকারি ভাষা করেছে।"
      hi: "1977 से क्यूबेक का फ़्रांसीसी भाषा चार्टर, जो Bill 101 के नाम से जाना जाता है, फ़्रांसीसी को प्रांत की सरकार, अदालतों और क़ानूनों की आधिकारिक भाषा बनाता है।"
  - id: fr-fact-018
    tags: [regions, africa]
    source: "https://en.wikipedia.org/wiki/French_language"
    text:
      en: "French is an official language in Senegal, Côte d'Ivoire and Cameroon, though many people speak a local language at home, such as Wolof in Senegal."
      bn: "সেনেগাল, কোত দিভোয়ার ও ক্যামেরুনে ফরাসি সরকারি ভাষা, তবে অনেকেই ঘরে স্থানীয় ভাষায় কথা বলেন, যেমন সেনেগালে ওলফ।"
      hi: "सेनेगल, कोत दिवुआर और कैमरून में फ़्रांसीसी आधिकारिक भाषा है, फिर भी बहुत-से लोग घर में स्थानीय भाषा बोलते हैं, जैसे सेनेगल में वोलोफ़ (Wolof)।"
  - id: fr-fact-019
    tags: [history, africa]
    source: "https://en.wikipedia.org/wiki/International_Organisation_of_La_Francophonie"
    text:
      en: "The International Organisation of la Francophonie was founded in 1970 to link the countries where French is spoken, from Africa to Asia and the Americas."
      bn: "১৯৭০ সালে প্রতিষ্ঠিত লা ফ্রাঁকোফোনির আন্তর্জাতিক সংস্থা এমন সব দেশকে একসূত্রে বাঁধে যেখানে ফরাসি বলা হয়, আফ্রিকা থেকে এশিয়া ও আমেরিকা পর্যন্ত।"
      hi: "1970 में बना ला फ़्रांकोफ़ोनी का अंतरराष्ट्रीय संगठन उन देशों को आपस में जोड़ता है जहाँ फ़्रांसीसी बोली जाती है, अफ़्रीका से लेकर एशिया और अमेरिका तक।"
  - id: fr-fact-020
    tags: [regions, africa]
    source: "https://en.wikipedia.org/wiki/French_language"
    text:
      en: "Algeria's official languages are Arabic and Tamazight, but French is still widely used there, in business and in education."
      bn: "আলজেরিয়ার সরকারি ভাষা আরবি ও তামাজ়িঘ্ত, তবু সেখানে ব্যবসা-বাণিজ্য ও শিক্ষায় ফরাসির ব্যবহার এখনো ব্যাপক।"
      hi: "अल्जीरिया की आधिकारिक भाषाएँ अरबी और तमाज़िघत (Tamazight) हैं, फिर भी वहाँ व्यापार और शिक्षा में फ़्रांसीसी का इस्तेमाल अब भी बड़े पैमाने पर होता है।"
  - id: fr-fact-021
    tags: [food, words]
    source: "https://en.wikipedia.org/wiki/Croissant"
    text:
      en: "The croissant is named for its shape. The word means 'crescent', and the pastry is curved like one."
      bn: "croissant নামটি এসেছে তার আকার থেকে: শব্দটির অর্থ 'অর্ধচন্দ্র', আর পেস্ট্রিটিও ঠিক তেমনি বাঁকানো।"
      hi: "croissant नाम इसके आकार से पड़ा है: शब्द का अर्थ 'अर्धचंद्र' है, और यह पेस्ट्री भी वैसी ही मुड़ी हुई होती है।"
  - id: fr-fact-022
    tags: [food, words]
    source: "https://en.wikipedia.org/wiki/Baguette"
    text:
      en: "A baguette is named for its shape. The word means 'wand' or 'stick', and the long loaf is shaped like one."
      bn: "baguette নামটিও আকার থেকেই এসেছে: শব্দটির অর্থ 'ছড়ি' বা 'লাঠি', আর লম্বা রুটিটিও দেখতে অনেকটা তেমনই।"
      hi: "baguette नाम भी आकार से आया है: शब्द का अर्थ 'छड़ी' या 'डंडा' है, और यह लंबी ब्रेड भी वैसी ही दिखती है।"
  - id: fr-fact-023
    tags: [food, words]
    source: "https://en.wikipedia.org/wiki/Restaurant"
    text:
      en: "The word restaurant comes from the French verb restaurer, 'to restore'. The first restaurants in Paris served restorative broths."
      bn: "restaurant শব্দটি এসেছে ফরাসি restaurer ক্রিয়া থেকে, যার অর্থ 'সুস্থ করে তোলা, শক্তি ফিরিয়ে দেওয়া'। প্যারিসের প্রথম দিককার রেস্তোরাঁয় শক্তি ফেরানো ঝোল পরিবেশন করা হতো।"
      hi: "restaurant शब्द फ़्रांसीसी क्रिया restaurer से बना है, जिसका अर्थ है 'फिर से ताक़त देना'। पेरिस के शुरुआती रेस्तराँ ताक़त लौटाने वाला शोरबा परोसते थे।"
  - id: fr-fact-024
    tags: [food, protected-names]
    source: "https://en.wikipedia.org/wiki/Roquefort"
    text:
      en: "Roquefort is a protected name: only blue cheese aged in the caves of Roquefort-sur-Soulzon, in southern France, may be sold under it."
      bn: "Roquefort একটি সুরক্ষিত নাম: শুধু দক্ষিণ ফ্রান্সের Roquefort-sur-Soulzon-এর গুহায় মজিয়ে নেওয়া নীল পনিরই এই নামে বিক্রি করা যায়।"
      hi: "Roquefort एक संरक्षित नाम है: केवल दक्षिणी फ़्रांस में Roquefort-sur-Soulzon की गुफ़ाओं में परिपक्व किया गया नीला पनीर ही इस नाम से बेचा जा सकता है।"
  - id: fr-fact-025
    tags: [literature]
    source: "https://en.wikipedia.org/wiki/Les_Mis%C3%A9rables"
    text:
      en: "Victor Hugo's novel Les Misérables was published in 1862, and it has been adapted for the stage and the screen many times."
      bn: "ভিক্টর উগোর উপন্যাস Les Misérables প্রকাশিত হয় ১৮৬২ সালে; মঞ্চে ও পর্দায় এর রূপান্তর হয়েছে বহুবার।"
      hi: "विक्टर ह्यूगो का उपन्यास Les Misérables 1862 में प्रकाशित हुआ था; मंच और पर्दे पर इसके रूपांतरण कई बार हो चुके हैं।"
  - id: fr-fact-026
    tags: [literature, history]
    source: "https://en.wikipedia.org/wiki/The_Little_Prince"
    text:
      en: "The Little Prince, by Antoine de Saint-Exupéry, was first published in 1943 in New York, not in France."
      bn: "আঁতোয়ান দ্য সাঁ-ত্যেক্সুপেরির 'ছোট্ট রাজপুত্র' প্রথম প্রকাশিত হয় ১৯৪৩ সালে নিউ ইয়র্কে, ফ্রান্সে নয়।"
      hi: "आंत्वान द सेंट-एक्ज़ुपेरी की 'छोटा राजकुमार' (Le Petit Prince) 1943 में पहली बार न्यूयॉर्क में छपी थी, फ़्रांस में नहीं।"
  - id: fr-fact-027
    tags: [literature, history]
    source: "https://en.wikipedia.org/wiki/Albert_Camus"
    text:
      en: "Albert Camus was born in French Algeria and won the Nobel Prize in Literature in 1957."
      bn: "আলবেয়ার কামু ফরাসি-শাসিত আলজেরিয়ায় জন্মেছিলেন এবং ১৯৫৭ সালে সাহিত্যে নোবেল পুরস্কার পান।"
      hi: "अल्बेर कामू का जन्म फ़्रांसीसी-शासित अल्जीरिया में हुआ था, और 1957 में उन्हें साहित्य का नोबेल पुरस्कार मिला।"
  - id: fr-fact-028
    tags: [numbers]
    source: "https://en.wikipedia.org/wiki/French_numerals"
    text:
      en: "In French, 70 is soixante-dix, 'sixty-ten', 80 is quatre-vingts, 'four twenties', and 90 is quatre-vingt-dix, 'four twenties ten'."
      bn: "ফরাসিতে ৭০ হলো soixante-dix, আক্ষরিক অর্থে 'ষাট-দশ'; ৮০ হলো quatre-vingts, 'চার কুড়ি'; আর ৯০ হলো quatre-vingt-dix, 'চার কুড়ি দশ'। বাংলায় ৭০ আর ৯০-এর নিজস্ব শব্দ আছে: সত্তর আর নব্বই।"
      hi: "फ़्रांसीसी में 70 soixante-dix है, यानी शाब्दिक अर्थ में 'साठ-दस'; 80 quatre-vingts है, यानी 'चार बीस'; और 90 quatre-vingt-dix, यानी 'चार बीस-दस'। हिंदी में 70 और 90 के अपने अलग शब्द हैं: सत्तर और नब्बे।"
  - id: fr-fact-029
    tags: [numbers, regions]
    source: "https://en.wikipedia.org/wiki/French_numerals"
    text:
      en: "In Belgium and Switzerland, 70 is septante and 90 is nonante, not soixante-dix and quatre-vingt-dix."
      bn: "বেলজিয়াম ও সুইজারল্যান্ডে ৭০-কে বলা হয় septante আর ৯০-কে nonante; ফ্রান্সের soixante-dix ও quatre-vingt-dix সেখানে চলে না।"
      hi: "बेल्जियम और स्विट्ज़रलैंड में 70 को septante और 90 को nonante कहा जाता है, फ़्रांस के soixante-dix और quatre-vingt-dix की जगह।"
  - id: fr-fact-030
    tags: [numbers]
    source: "https://en.wikipedia.org/wiki/French_numerals"
    text:
      en: "French joins 21, 31, 41, 51, 61 and 71 with et: vingt et un, 'twenty and one', soixante et onze, 'sixty and eleven'. 81 and 91 have no et."
      bn: "ফরাসিতে ২১, ৩১, ৪১, ৫১, ৬১ ও ৭১ সংখ্যায় et ('আর') বসে: vingt et un, 'কুড়ি আর এক'; ৮১ ও ৯১-এ et বসে না।"
      hi: "फ़्रांसीसी में 21, 31, 41, 51, 61 और 71 में et ('और') जुड़ता है: vingt et un, यानी 'बीस और एक'; 81 और 91 में et नहीं आता।"
  - id: fr-fact-031
    tags: [grammar, agreement]
    source: "https://en.wikipedia.org/wiki/French_grammar"
    text:
      en: "Many French adjectives add a silent e for the feminine, which can make the last consonant audible: grand (tall, masculine) ends in a silent d, but grande (feminine) says it."
      bn: "অনেক ফরাসি বিশেষণের স্ত্রীলিঙ্গ রূপে শেষে একটি নীরব e যোগ হয়, ফলে আগের ব্যঞ্জনটি শোনা যায়: grand (লম্বা, পুংলিঙ্গ)-এর শেষের d উচ্চারিত হয় না, কিন্তু grande (স্ত্রীলিঙ্গ)-এ হয়। বাংলায় বিশেষণ লিঙ্গ অনুসারে বদলায় না।"
      hi: "फ़्रांसीसी में कई विशेषणों के स्त्रीलिंग रूप में अंत में एक मूक e जुड़ता है, जिससे पिछला व्यंजन सुनाई देने लगता है: grand (लंबा, पुल्लिंग) का d नहीं बोला जाता, पर grande (स्त्रीलिंग) का d बोला जाता है। हिंदी में भी विशेषण लिंग के अनुसार बदलते हैं: लंबा, लंबी।"
  - id: fr-fact-032
    tags: [grammar, gender]
    source: "https://en.wikipedia.org/wiki/French_grammar"
    text:
      en: "Every French noun has a gender, masculine or feminine, that cannot always be guessed from the word: la table is feminine and le livre is masculine, so learners learn each noun with its article."
      bn: "প্রতিটি ফরাসি বিশেষ্যের একটি লিঙ্গ আছে, পুংলিঙ্গ বা স্ত্রীলিঙ্গ, যা শব্দ দেখে সবসময় আন্দাজ করা যায় না: la table (টেবিল) স্ত্রীলিঙ্গ, le livre (বই) পুংলিঙ্গ; তাই শিক্ষার্থীরা প্রতিটি বিশেষ্য le বা la-সহ শেখেন।"
      hi: "फ़्रांसीसी की हर संज्ञा का एक लिंग होता है, पुल्लिंग या स्त्रीलिंग, जिसका शब्द देखकर हमेशा अंदाज़ा नहीं लगता: la table (मेज़) स्त्रीलिंग है और le livre (किताब) पुल्लिंग, इसीलिए सीखने वाले हर संज्ञा को उसके le या la के साथ सीखते हैं।"
  - id: fr-fact-033
    tags: [history, india]
    source: "https://en.wikipedia.org/wiki/Chandernagore"
    text:
      en: "Chandernagore, a town on the Hooghly river near Kolkata, was a French colony until India took it over in the 1950s."
      bn: "কলকাতার কাছে হুগলি নদীর ধারে চন্দননগর একসময় ফরাসি উপনিবেশ ছিল; ১৯৫০-এর দশকে তা ভারতের অধিকারে আসে।"
      hi: "कोलकाता के पास हुगली नदी के किनारे बसा चंदननगर कभी फ़्रांसीसी उपनिवेश था; 1950 के दशक में यह भारत के अधिकार में आ गया।"
  - id: fr-fact-034
    tags: [history, language]
    source: "https://en.wikipedia.org/wiki/French_language"
    text:
      en: "For centuries French was the language of European diplomacy, and the English word diplomacy itself comes from French diplomatie."
      bn: "কয়েক শতক ধরে ইউরোপের কূটনীতির ভাষা ছিল ফরাসি, আর ইংরেজি 'diplomacy' শব্দটিও ফরাসি diplomatie থেকেই এসেছে।"
      hi: "कई सदियों तक यूरोप की कूटनीति की भाषा फ़्रांसीसी रही, और अंग्रेज़ी का शब्द 'diplomacy' भी फ़्रांसीसी diplomatie से ही आया है।"
  - id: fr-fact-035
    tags: [sound]
    source: "https://en.wikipedia.org/wiki/French_phonology"
    text:
      en: "The u in tu (you) is said with the tongue in the position for ee, but with the lips rounded. The ou in vous is said like the oo in food."
      bn: "tu-র u বলতে হয় জিভ 'ই'-এর অবস্থানে রেখে, কিন্তু ঠোঁট গোল করে। আর vous-এর ou অনেকটা 'উ'-এর মতো।"
      hi: "tu का u जीभ को 'इ' की स्थिति में रखकर, पर होंठ गोल करके बोला जाता है। vous का ou 'ऊ' जैसा बोला जाता है।"
  - id: fr-fact-036
    tags: [sound, schwa]
    source: "https://en.wikipedia.org/wiki/French_phonology"
    text:
      en: "In quick speech, the e in words such as le, de and je is often dropped. Its sound is called the schwa, or e muet, 'mute e'."
      bn: "দ্রুত কথায় le, de, je-র মতো শব্দের e প্রায়ই বাদ পড়ে যায়। এই ধ্বনির নাম schwa বা e muet ('নীরব e')।"
      hi: "तेज़ बोलचाल में le, de और je जैसे शब्दों का e अक्सर गिर जाता है। इस ध्वनि को schwa या e muet ('मूक e') कहते हैं। हिंदी में भी शब्द के अंत का छिपा 'अ' अक्सर नहीं बोला जाता: कमल को kamal कहते हैं।"
