        ipa: "ɑ̃ natɑ̃dɑ̃ lə bys ɔ̃ nɛ pʁɛ də laʁɛ"
      - text: "En sachant le chemin, vous allez vite."
        ipa: "ɑ̃ saʃɑ̃ lə ʃəmɛ̃ vu zale vit"
