native: { code: "en", iso639_3: "eng", name: "English" }
name: "Present tense: verbs in -άω (-áo) and -ώ (-ó)"
license: "CC-BY-SA-4.0"
description: "Five verbs in -άω (-áo) (also said -ώ (-ó)) and μπορώ (boró), I can, in the present tense. These verbs of the second class have the stress on the ending: μιλάω (miláo) or μιλώ (miló), μιλάς (milás), μιλάει (miláei) or μιλά (milá), μιλάμε (miláme) or μιλούμε (miloúme), μιλάτε (miláte), μιλάνε (miláne) or μιλούν (miloún). Where a cell has two forms, both are right. Taken from Wikipedia's page on Modern Greek grammar and the Wiktionary entries of the words. Not yet checked by a Greek speaker: please report any mistake."
tags: ["beginner", "grammar", "unreviewed"]
pattern:
  name: "Present tense: verbs in -άω (-áo) and -ώ (-ó)"
  slot_name: "person"
  slots:
    "1sg": "I (εγώ (egó))"
    "2sg": "you, one person (εσύ (esí))"
    "3sg": "he, she, it (αυτός (aftós), αυτή (aftí))"
    "1pl": "we (εμείς (emeís))"
    "2pl": "you, many people or polite (εσείς (eseís))"
    "3pl": "they (αυτοί (aftoí))"
  entries:
    "milao": "to speak; to talk"
    "rotao": "to ask"
    "perpatao": "to walk"
    "xypnao": "to wake up"
    "xechnao": "to forget"
    "boro": "to be able; can"
  notes: "Verbs of the second class end in a stressed vowel. μιλάω (miláo) has two ways to say I speak, the everyday μιλάω (miláo) and the shorter μιλώ (miló), and the same goes for the other persons: μιλάει (miláei) or μιλά (milá), μιλάμε (miláme) or μιλούμε (miloúme), μιλάνε (miláne) or μιλούν (miloún). In this class the stress is on the ending in every person, never on the stem, and the stem stays whole: μιλ- (mil-). μπορώ (boró) is a related verb with the endings -ώ (-ó), -είς (-eís), -εί (-eí), -ούμε (-oúme), -είτε (-eíte), -ούν (-oún). The forms with -άω (-áo) are the everyday ones, and the forms with -ώ (-ó) are used in writing and more formal speech."
