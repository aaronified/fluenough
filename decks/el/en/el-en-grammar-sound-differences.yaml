native: { code: "en", iso639_3: "eng", name: "English" }
name: "Greek spelling: one sound, or two letters for one sound"
license: "CC-BY-SA-4.0"
description: "Five pairs of words that show where Greek spelling surprises an English speaker: the soft ⟦δ⟧ against ⟦ντ⟧, ⟦β⟧ against ⟦μπ⟧, ⟦γ⟧ against ⟦γκ⟧, ⟦ευ⟧ said 'ev' or 'ef', and ⟦σ⟧ said 's' or 'z'."
tags: ["beginner", "grammar", "unreviewed"]
pattern:
  name: "Greek spelling: one sound, or two letters for one sound"
  slot_name: "word"
  slots:
    "first": "the first word"
    "second": "the second word"
  entries:
    "d-nt": "δέντρο (déntro), tree, has δ (d) said as the soft 'th'; ντροπή (dropí), shame, has ντ (d) said 'd'"
    "v-mp": "βιβλίο (vivlío), book, has β (v) said 'v'; μπράβο (brávo), well done, has μπ (b) said 'b'"
    "g-gk": "γράμμα (grámma), letter, has γ (g) said as the soft rasp; γκάζι (gázi), gas, has γκ (g) said as the hard 'g'"
    "ev-ef": "ευρώ (evró), euro, says ευ (ef) as 'ev' before the voiced ρ (r); ευτυχία (eftychía), happiness, says it 'ef' before the voiceless τ (t)"
    "s-z": "ζέστη (zésti), heat, has σ (s) said 's' before τ (t); κόσμος (kósmos), world, has σ (s) said 'z' before the voiced μ (m)"
  notes: "Greek has no letter for the sounds 'b', 'd' and 'g' of English: it writes them with the pairs μπ (b), ντ (d) and γκ (g) and keeps the single letters β (v), δ (d) and γ (g) for 'v', the soft 'th' and the soft rasp. So δέντρο (déntro) starts with a 'th' and ντροπή (dropí) with a 'd'. The pairs αυ (af) and ευ (ef) are said 'av' and 'ev' before a vowel or a voiced sound and 'af' and 'ef' before a voiceless one, as in ευρώ (evró) and ευτυχία (eftychía). The letter σ (s) is said 'z' before a voiced consonant, as in κόσμος (kósmos)."
