schema: 1
id: "el-en-sound-differences"
kind: "layer"
core: "el-sound-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Greek sounds that differ from English"
license: "CC-BY-SA-4.0"
description: "29 words for the sounds Greek spells or says differently from English: the soft 'th' δ (d), the rasped γ (g) and χ (ch), the letter pairs ου (ou), αι (ai), ει (ei), ευ (ef), μπ (b), ντ (d), γκ (g), τσ (ts) and τζ (tz), the double sounds ξ (x) and ψ (ps), and σ (s) before a voiced sound. Taken from the words' own Wiktionary entries and Wikipedia's page on Modern Greek phonology. Not yet checked by a Greek speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "el-0400":
    native: "tree"
    notes:
      "n1": "The letter δ (d) is said as the soft 'th' of 'this', so δέντρο (déntro) starts 'th', not 'd'. The pair ντ (d) inside the word is said 'nd': 'THEN-dro'. δέντρο (déntro) is neuter: το δέντρο (to déntro)."
    examples:
      "Το δέντρο είναι εδώ.":
        native: "The tree is here."
        bases:
          "Το": "the"
          "δέντρο": "tree"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
      "Πού είναι το δέντρο;":
        native: "Where is the tree?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "το": "the"
          "δέντρο": "tree"
  "el-0401":
    native: "letter (of the alphabet or in the post)"
    notes:
      "n1": "The letter γ (g) before ρ (r) is the soft rasp, not a hard 'g': 'GHRA-ma'. The double μμ (mm) is said as one 'm', not held longer. The plural is γράμματα (grámmata): the stem grows by τ (t) and the stress stays on the first syllable. γράμμα (grámma) is neuter: το γράμμα (to grámma)."
    examples:
      "Το γράμμα είναι εδώ.":
        native: "The letter is here."
        bases:
          "Το": "the"
          "γράμμα": "letter"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
      "Πού είναι το γράμμα;":
        native: "Where is the letter?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "το": "the"
          "γράμμα": "letter"
  "el-0402":
    native: "joy; pleasure"
    notes:
      "n1": "The letter χ (ch) before α (a) is the rasp of Scottish 'loch'. The stress falls on the last syllable: 'cha-RA'. χαρά (chará) is feminine: η χαρά (i chará)."
    examples:
      "Τι χαρά!":
        native: "What joy!"
        bases:
          "Τι": "what"
          "χαρά": "joy; pleasure"
      "Με χαρά!":
        native: "With pleasure!"
        bases:
          "Με": "with"
          "χαρά": "joy; pleasure"
  "el-0403":
    native: "snow"
    notes:
      "n1": "The letter χ (ch) before ι (i) is said further forward than before α (a), like the 'h' of 'huge', and the ι (i) then joins the next vowel as a quick 'y': 'CHYO-ni'. χιόνι (chióni) is neuter: το χιόνι (to chióni)."
    examples:
      "Το χιόνι είναι εδώ.":
        native: "The snow is here."
        bases:
          "Το": "the"
          "χιόνι": "snow"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
      "Πού είναι το χιόνι;":
        native: "Where is the snow?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "το": "the"
          "χιόνι": "snow"
  "el-0404":
    native: "sky"
    notes:
      "n1": "The pair ου (ou) is the one sound 'oo', so ουρανός (ouranós) starts 'oo-ra-NOS'. The stress falls on the last syllable. ουρανός (ouranós) is masculine: ο ουρανός (o ouranós)."
    examples:
      "Ο ουρανός είναι εδώ.":
        native: "The sky is here."
        bases:
          "Ο": "the"
          "ουρανός": "sky"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
      "Πού είναι ο ουρανός;":
        native: "Where is the sky?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "ο": "the"
          "ουρανός": "sky"
  "el-0405":
    native: "weather; time"
    notes:
      "n1": "The pair αι (ai) is said like ε (e): 'ke-ROS'. It means the weather, and also time in the sense of a fitting moment. καιρός (kairós) is masculine: ο καιρός (o kairós)."
    examples:
      "Τι καιρός!":
        native: "What weather!"
        bases:
          "Τι": "what"
          "καιρός": "weather; time"
      "Πώς είναι ο καιρός;":
        native: "How is the weather?"
        bases:
          "Πώς": "how"
          "είναι": "to be: am, is, are"
          "ο": "the"
          "καιρός": "weather; time"
  "el-0406":
    native: "hunger"
    notes:
      "n1": "The pair ει (ei) is said 'ee', so the first syllable of πείνα (peína) sounds just like πίνω (píno) (I drink): 'PEE-na'. The two spellings ει (ei) and ι (i) say the same sound. πείνα (peína) is feminine: η πείνα (i peína)."
    examples:
      "Η πείνα είναι εδώ.":
        native: "The hunger is here."
        bases:
          "Η": "the"
          "πείνα": "hunger"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
      "Πού είναι η πείνα;":
        native: "Where is the hunger?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "η": "the"
          "πείνα": "hunger"
  "el-0407":
    native: "gas; accelerator"
    notes:
      "n1": "The pair γκ (g) at the start of a word is the hard 'g' of 'go': 'GA-zi'. It means gas, and also the accelerator pedal of a car. γκάζι (gázi) is neuter: το γκάζι (to gázi)."
    examples:
      "Το γκάζι είναι εδώ.":
        native: "The gas is here."
        bases:
          "Το": "the"
          "γκάζι": "gas"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
      "Πού είναι το γκάζι;":
        native: "Where is the gas?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "το": "the"
          "γκάζι": "gas"
  "el-0408":
    native: "fireplace; hearth"
    notes:
      "n1": "The pair τζ (tz) is said 'dz' as one sound, like the end of 'adze': 'DZA-ki'. τζάκι (tzáki) is neuter: το τζάκι (to tzáki)."
    examples:
      "Το τζάκι είναι εδώ.":
        native: "The fireplace is here."
        bases:
          "Το": "the"
          "τζάκι": "fireplace"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
      "Πού είναι το τζάκι;":
        native: "Where is the fireplace?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "το": "the"
          "τζάκι": "fireplace"
  "el-0409":
    native: "soul; person"
    notes:
      "n1": "The letter ψ (ps) is said 'ps' even at the start of a word: 'psi-CHI'. The υ (y) is said 'ee', and χ (ch) before η (i) is the forward 'h' sound of 'huge'. ψυχή (psychí) is feminine: η ψυχή (i psychí)."
    examples:
      "Καλή ψυχή.":
        native: "A kind soul."
        bases:
          "ψυχή": "soul; person"
      "Η ψυχή μου.":
        native: "My soul."
        bases:
          "Η": "the"
          "ψυχή": "soul; person"
  "el-0410":
    native: "foreigner; stranger"
    notes:
      "n1": "The letter ξ (x) is said 'ks' even at the start of a word: 'KSE-nos'. As an adjective ξένος (xénos) also means 'foreign' or 'strange'. ξένος (xénos) is masculine: ο ξένος (o xénos)."
    examples:
      "Ένας ξένος είναι εδώ.":
        native: "A stranger is here."
        bases:
          "Ένας": "a; one"
          "ξένος": "foreigner; stranger"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
      "Δεν είμαι ξένος.":
        native: "I am not a foreigner."
        bases:
          "Δεν": "not"
          "είμαι": "to be: am, is, are"
          "ξένος": "foreigner; stranger"
  "el-0411":
    native: "heat"
    notes:
      "n1": "The letter ζ (z) is said 'z', and the σ (s) before τ (t) stays 's': 'ZE-sti'. To say it is hot, Greek says Έχει ζέστη (Échei zésti), literally 'it has heat'. ζέστη (zésti) is feminine: η ζέστη (i zésti)."
    examples:
      "Τι ζέστη!":
        native: "What heat!"
        bases:
          "Τι": "what"
          "ζέστη": "heat"
      "Έχει ζέστη.":
        native: "It is hot."
        bases:
          "Έχει": "to have"
          "ζέστη": "heat"
  "el-0412":
    native: "world; people"
    notes:
      "n1": "The letter σ (s) before the voiced μ (m) is said 'z': 'KOZ-mos'. It means the world, and also a crowd of people. κόσμος (kósmos) is masculine: ο κόσμος (o kósmos)."
    examples:
      "Τι κόσμος!":
        native: "What a crowd!"
        bases:
          "Τι": "what"
          "κόσμος": "world; people"
      "Πού είναι ο κόσμος;":
        native: "Where is everyone?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "ο": "the"
          "κόσμος": "world; people"
  "el-0413":
    native: "sun"
    notes:
      "n1": "The letter η (i) is said 'ee' and the stress is on it: 'EE-lios'. ήλιος (ílios) is masculine: ο ήλιος (o ílios)."
    examples:
      "Ο ήλιος είναι εδώ.":
        native: "The sun is here."
        bases:
          "Ο": "the"
          "ήλιος": "sun"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
      "Πού είναι ο ήλιος;":
        native: "Where is the sun?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "ο": "the"
          "ήλιος": "sun"
  "el-0414":
    native: "need; necessity"
    notes:
      "n1": "The pair γκ (g) inside a word is said 'ng' plus a hard 'g': 'a-NANG-gi'. ανάγκη (anágki) is feminine: η ανάγκη (i anágki)."
    examples:
      "Έχω ανάγκη από νερό.":
        native: "I need water."
        bases:
          "Έχω": "to have"
          "ανάγκη": "need; necessity"
          "από": "from; of"
      "Έχω ανάγκη από βοήθεια.":
        native: "I need help."
        bases:
          "Έχω": "to have"
          "ανάγκη": "need; necessity"
          "από": "from; of"
          "βοήθεια": "help"
  "el-0415":
    native: "mistake"
    notes:
      "n1": "The letter θ (th) is the unvoiced 'th' of 'think': 'LA-thos'. Although it ends in ος (os) like many masculine nouns, λάθος (láthos) is neuter. Its plural is λάθη (láthi): the ending changes and the stress stays on the first syllable. λάθος (láthos) is neuter: το λάθος (to láthos)."
    examples:
      "Αυτό είναι λάθος.":
        native: "This is a mistake."
        bases:
          "Αυτό": "this; that"
          "είναι": "to be: am, is, are"
          "λάθος": "mistake"
      "Πού είναι το λάθος;":
        native: "Where is the mistake?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "το": "the"
          "λάθος": "mistake"
  "el-0416":
    native: "pomegranate"
    notes:
      "n1": "The letter ρ (r) is a quick tap and δ (d) the soft 'th' of 'this': 'RO-thi'. ρόδι (ródi) is neuter: το ρόδι (to ródi)."
    examples:
      "Το ρόδι είναι εδώ.":
        native: "The pomegranate is here."
        bases:
          "Το": "the"
          "ρόδι": "pomegranate"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
      "Πού είναι το ρόδι;":
        native: "Where is the pomegranate?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "το": "the"
          "ρόδι": "pomegranate"
  "el-0417":
    native: "boy"
    notes:
      "n1": "The letter γ (g) before ο (o) is the soft rasp: 'a-GHO-ri'. It is neuter, though it names a boy; its plural is αγόρια (agória), the stress staying on the same syllable. αγόρι (agóri) is neuter: το αγόρι (to agóri)."
    examples:
      "Το αγόρι είναι εδώ.":
        native: "The boy is here."
        bases:
          "Το": "the"
          "αγόρι": "boy"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
      "Πού είναι το αγόρι;":
        native: "Where is the boy?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "το": "the"
          "αγόρι": "boy"
  "el-0418":
    native: "girl"
    notes:
      "n1": "The pair τσ (ts) is said 'ts' as one sound: 'ko-RI-tsi'. It is neuter, though it names a girl. κορίτσι (korítsi) is neuter: το κορίτσι (to korítsi)."
    examples:
      "Το κορίτσι είναι εδώ.":
        native: "The girl is here."
        bases:
          "Το": "the"
          "κορίτσι": "girl"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
      "Πού είναι το κορίτσι;":
        native: "Where is the girl?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "το": "the"
          "κορίτσι": "girl"
  "el-0419":
    native: "sir; Mr; gentleman"
    notes:
      "n1": "The letter υ (y) is said 'ee': 'KEE-ree-os'. It is the word for 'Mr', and to address a man as 'sir' Greek changes the ending to κύριε (kýrie), as in Καλημέρα (Kaliméra), κύριε (kýrie). κύριος (kýrios) is masculine: ο κύριος (o kýrios)."
    examples:
      "Καλημέρα, κύριε.":
        native: "Good morning, sir."
        bases:
          "Καλημέρα": "good morning"
          "κύριε": "sir; Mr; gentleman"
      "Ο κύριος είναι εδώ.":
        native: "The gentleman is here."
        bases:
          "Ο": "the"
          "κύριος": "sir; Mr; gentleman"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
  "el-0420":
    native: "well done!; bravo!"
    notes:
      "n1": "The pair μπ (b) at the start of a word is said 'b': 'BRA-vo'. It is what Greeks say to praise someone."
    examples:
      "Μπράβο!":
        native: "Well done!"
        bases:
          "Μπράβο": "well done!"
      "Μπράβο σου!":
        native: "Well done, you!"
        bases:
          "Μπράβο": "well done!"
  "el-0421":
    native: "shame; shyness"
    notes:
      "n1": "The pair ντ (d) at the start of a word is said 'd': 'dro-PI'. It means shame or shyness, and is also an exclamation, 'shame!'. ντροπή (dropí) is feminine: η ντροπή (i dropí)."
    examples:
      "Τι ντροπή!":
        native: "What a shame!"
        bases:
          "Τι": "what"
          "ντροπή": "shame; shyness"
      "Ντροπή σου!":
        native: "Shame on you!"
        bases:
          "Ντροπή": "shame; shyness"
  "el-0422":
    native: "euro"
    notes:
      "n1": "The pair ευ (ef) before the voiced ρ (r) is said 'ev': 'e-VRO'. The word does not change its ending. ευρώ (evró) is neuter: το ευρώ (to evró)."
    examples:
      "Ένα ευρώ.":
        native: "One euro."
        bases:
          "Ένα": "a; one"
          "ευρώ": "euro"
      "Ένα ευρώ, παρακαλώ.":
        native: "One euro, please."
        bases:
          "Ένα": "a; one"
          "ευρώ": "euro"
  "el-0423":
    native: "book"
    notes:
      "n1": "The letter β (v) is said 'v', never 'b': 'vi-VLEE-o'. βιβλίο (vivlío) is neuter: το βιβλίο (to vivlío)."
    examples:
      "Το βιβλίο είναι εδώ.":
        native: "The book is here."
        bases:
          "Το": "the"
          "βιβλίο": "book"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
      "Πού είναι το βιβλίο;":
        native: "Where is the book?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "το": "the"
          "βιβλίο": "book"
  "el-0424":
    native: "happiness"
    notes:
      "n1": "The pair ευ (ef) before the voiceless τ (t) is said 'ef': 'ef-ti-CHEE-a'. Compare ευρώ (evró), where ευ (ef) is said 'ev' before ρ (r). ευτυχία (eftychía) is feminine: η ευτυχία (i eftychía)."
    examples:
      "Τι ευτυχία!":
        native: "What happiness!"
        bases:
          "Τι": "what"
          "ευτυχία": "happiness"
      "Η ευτυχία είναι εδώ.":
        native: "Happiness is here."
        bases:
          "Η": "the"
          "ευτυχία": "happiness"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
  "el-0425":
    native: "law"
    notes:
      "n1": "The stress falls on the first syllable: 'NO-mos', a law. Moved to the last syllable the word is νομός (nomós), a prefecture. νόμος (nómos) is masculine: ο νόμος (o nómos)."
      "pair": "Not νομός (nomós): it is the same letters with the stress on the last syllable, a prefecture."
    examples:
      "Ο νόμος είναι εδώ.":
        native: "The law is here."
        bases:
          "Ο": "the"
          "νόμος": "law"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
      "Πού είναι ο νόμος;":
        native: "Where is the law?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "ο": "the"
          "νόμος": "law"
  "el-0426":
    native: "prefecture; county"
    notes:
      "n1": "The stress falls on the last syllable: 'no-MOS', a prefecture or county, an administrative area. With the stress on the first syllable the word is νόμος (nómos), a law. νομός (nomós) is masculine: ο νομός (o nomós)."
      "pair": "Not νόμος (nómos): it is the same letters with the stress on the first syllable, a law."
    examples:
      "Ο νομός είναι εδώ.":
        native: "The prefecture is here."
        bases:
          "Ο": "the"
          "νομός": "prefecture"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
      "Πού είναι ο νομός;":
        native: "Where is the prefecture?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "ο": "the"
          "νομός": "prefecture"
  "el-0427":
    native: "term; condition"
    notes:
      "n1": "The stress falls on the first syllable: 'O-ros', a term or a condition in a contract. With the stress on the last syllable the word is ορός (orós), serum. (A second, neuter όρος (óros) means a mountain.) όρος (óros) is masculine: ο όρος (o óros)."
      "pair": "Not ορός (orós): it is the same letters with the stress on the last syllable, serum."
    examples:
      "Ο όρος είναι εδώ.":
        native: "The term is here."
        bases:
          "Ο": "the"
          "όρος": "term"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
      "Πού είναι ο όρος;":
        native: "Where is the term?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "ο": "the"
          "όρος": "term"
  "el-0428":
    native: "serum"
    notes:
      "n1": "The stress falls on the last syllable: 'o-ROS', serum, as in a medical drip. With the stress on the first syllable the word is όρος (óros), a term. ορός (orós) is masculine: ο ορός (o orós)."
      "pair": "Not όρος (óros): it is the same letters with the stress on the first syllable, a term."
    examples:
      "Ο ορός είναι εδώ.":
        native: "The serum is here."
        bases:
          "Ο": "the"
          "ορός": "serum"
          "είναι": "to be: am, is, are"
          "εδώ": "here"
      "Πού είναι ο ορός;":
        native: "Where is the serum?"
        bases:
          "Πού": "where"
          "είναι": "to be: am, is, are"
          "ο": "the"
          "ορός": "serum"
