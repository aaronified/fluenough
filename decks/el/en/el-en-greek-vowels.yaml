id: "el-en-greek-vowels"
kind: "layer"
core: "el-greek-vowels"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Greek vowels"
license: "CC-BY-SA-4.0"
description: "The seven vowel letters of Modern Greek: α (a), ε (e), η (i), ι (i), ο (o), υ (y) and ω (o). Greek says only five vowel sounds, so η (i), ι (i) and υ (y) share one sound and ο (o) and ω (o) share another. Taken from Wikipedia's pages on the Greek alphabet and Modern Greek phonology. Not yet checked by a Greek speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "el-0300":
    native: "a, as in \"father\""
    notes:
      "n1": "The letter α (a) is called άλφα (álfa). It is always said /a/, a clear open 'a' like the one in 'father', whether or not it carries the stress: παρακαλώ (parakaló), please."
  "el-0301":
    native: "e, as in \"bet\""
    notes:
      "n1": "The letter ε (e) is called έψιλον (épsilon). It is always said /e/, as in 'bet' but a little closer, as in εσύ (esý), you. It sounds exactly like the pair of letters αι (ai)."
  "el-0302":
    native: "ee, as in \"see\""
    notes:
      "n1": "The letter η (i) is called ήτα (íta). It looks like a Latin H or N, but it is a vowel said /i/, 'ee' as in 'see', as in καλημέρα (kaliméra), good morning. Greek has several spellings for this one sound: η (i), ι (i), υ (y), ει (ei), οι (oi) and υι (yi)."
      "look-n": "Not ν (n): η (i) is a vowel with one leg that dips below the line (it is not an N); ν (n) is the consonant that looks like a Latin v."
  "el-0303":
    native: "ee, as in \"see\""
    notes:
      "n1": "The letter ι (i) is called γιώτα (yióta). It is said /i/, 'ee' as in 'see', as in όχι (óchi), no. It is one of the six spellings of this sound."
  "el-0304":
    native: "o, as in \"more\" (no glide)"
    notes:
      "n1": "The letter ο (o) is called όμικρον (ómikron), 'small o'. It is said /o/, a pure 'o' with no glide to 'oo' as English 'go' has, as in όχι (óchi), no. It sounds exactly like the letter ω (o)."
  "el-0305":
    native: "ee, as in \"see\""
    notes:
      "n1": "The letter υ (y) is called ύψιλον (ýpsilon). On its own it is said /i/, 'ee' as in 'see', as in πολύ (polý), very. It looks like a Latin U or Y but is never said 'u'. After α (a) or ε (e) it changes into an f or v sound (see the letter pairs αυ (af) and ευ (ef))."
      "look-n": "Not ν (n): υ (y) is a vowel and sounds like \"ee\"; ν (n) is the consonant, written with a pointed bottom like a Latin v."
  "el-0306":
    native: "o, as in \"more\" (no glide)"
    notes:
      "n1": "The letter ω (o) is called ωμέγα (oméga), 'big o'. It is said /o/, exactly like ο (o), as in εγώ (egó), I. The two letters differ only in spelling, not in sound."
