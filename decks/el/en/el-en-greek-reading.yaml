id: "el-en-greek-reading"
kind: "layer"
core: "el-greek-reading"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Reading Greek: accents and marks"
license: "CC-BY-SA-4.0"
description: "Nine items that make written Greek readable: the acute accent that marks the stressed syllable, the diaeresis that splits a pair of vowels, the final form of sigma, the Greek question mark and the raised dot, and the quick 'y' sound that ι (i) makes before a vowel. Taken from Wikipedia's pages on Greek orthography and Modern Greek phonology. Not yet checked by a Greek speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "el-0350":
    native: "a, with the stress"
    notes:
      "n1": "The acute accent ά (á), called τόνος (tónos), marks the stressed syllable. Every word of two or more syllables has exactly one, over its stressed vowel, and it changes no sound but the stress: καλημέρα (kaliméra) is said 'kali-ME-ra'. A word of one syllable has no accent, as και (kai), and, and να (na), to, with three exceptions: ή (í), or, and the question words πού (poú), where, and πώς (pós), how."
  "el-0351":
    native: "a, with the stress (capital)"
    notes:
      "n1": "On a capital letter the accent is written before the letter, as in Άννα (Ánna), the name Anna. A word written wholly in capitals takes no accent."
  "el-0352":
    native: "i, split from the vowel before it"
    notes:
      "n1": "The two dots, called διαλυτικά (dialytiká), the diaeresis, show that the vowel does not join the one before it: αϊ (ai) is two sounds, 'a' then 'i', where αι (ai) is the one sound 'e'. So παϊδάκια (paidákia), lamb chops, has αϊ (ai) read 'a-i'. The same mark on ϋ (y) splits αϋ (ay) and οϋ (oy)."
  "el-0353":
    native: "i, with the diaeresis and the stress"
    notes:
      "n1": "A vowel can carry both marks, written ΐ (í): the diaeresis splits it from the vowel before it, and the accent stresses it, as in ταΐζω (taízo), I feed."
  "el-0354":
    native: "s, the form at the end of a word"
    notes:
      "n1": "The letter sigma has two lower-case forms: σ (s) inside a word and ς (s) at the end of it. They say the same /s/: καλός (kalós), good, ends in ς (s). A capital Σ has one form."
  "el-0355":
    native: "the question mark"
    notes:
      "n1": "The Greek question mark looks like the English semicolon: Πού είναι ο σταθμός; (Poú eínai o stathmós;) means 'Where is the station?'. It is the only sign a written question has, besides its word order."
  "el-0356":
    native: "the semicolon (ano teleia)"
    notes:
      "n1": "The Greek semicolon and colon is a raised dot, called άνω τελεία (áno teleía), and it is seen only rarely. It marks a pause longer than a comma."
  "el-0357":
    native: "ya, as in \"yard\""
    notes:
      "n1": "A ι (i) before a vowel that follows it in the same syllable is said as a quick 'y' and joins it, so ια (ya) is said /ja/, one syllable and not two, as in για (ya), for, and μια (mia), a (feminine). The same goes for ιο (yo), ιε (ie) and ιου (iou)."
  "el-0358":
    native: "yo, as in \"yo-yo\""
    notes:
      "n1": "ιο (yo) is said /jo/ in one syllable, as in πιο (pio), more, said 'pyo'. Compare ο (o) alone, said 'o'."
