native: { code: "en", iso639_3: "eng", name: "English" }
name: "The articles: the and a"
license: "CC-BY-SA-4.0"
description: "Fifteen family words, each with its definite article (the) and its indefinite article (a). The article shows the noun's gender: ο (o) and ένας (énas) for masculine, η (i) and μια (mia) for feminine, το (to) and ένα (éna) for neuter."
tags: ["beginner", "grammar", "unreviewed"]
pattern:
  name: "The articles: the and a"
  slot_name: "article"
  slots:
    "definite": "with the definite article (the): ο (o) masculine, η (i) feminine, το (to) neuter"
    "indefinite": "with the indefinite article (a): ένας (énas) masculine, μια (mia) feminine, ένα (éna) neuter"
  entries:
    "pateras": "father (masculine, nominative)"
    "adelfos": "brother (masculine, nominative)"
    "yios": "son (masculine, nominative)"
    "filos": "friend (male) (masculine, nominative)"
    "antras": "man (masculine, nominative)"
    "mitera": "mother (feminine, nominative)"
    "adelfi": "sister (feminine, nominative)"
    "kori": "daughter (feminine, nominative)"
    "yynaika": "woman; wife (feminine, nominative)"
    "yiayia": "grandmother (feminine, nominative)"
    "fili": "friend (female) (feminine, nominative)"
    "oikoyeneia": "family (feminine, nominative)"
    "paidi": "child (neuter, nominative)"
    "moro": "baby (neuter, nominative)"
    "melos": "member (neuter, nominative)"
  notes: "Every Greek noun is masculine, feminine or neuter, and the article shows which. The definite article is ο (o) before a masculine noun, η (i) before a feminine one and το (to) before a neuter one. The indefinite article, a or an, is the number one: ένας (énas), μια (mia), ένα (éna). The ending of the noun often tells the gender: nouns in -ος (-os) and -ας (-as) are mostly masculine, nouns in -α (-a) and -η (-i) are mostly feminine, and nouns in -ο (-o) and -ι (-i), with a few in -ος (-os) such as μέλος (mélos), are neuter, so the article has to be learnt with the noun. Greek uses the definite article more than English does, and no article for a general plural: μωρά (morá) means babies."
