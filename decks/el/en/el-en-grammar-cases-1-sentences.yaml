id: "el-en-grammar-cases-1-sentences"
kind: "layer"
core: "el-grammar-cases-1-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Subject and object in sentences"
license: "CC-BY-SA-4.0"
description: "15 short sentences written from the tables: the subject is in the nominative and the object in the accusative. Not yet checked by a Greek speaker: please report any mistake."
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "el-4940":
    native: "I see the father."
    notes:
      "n1": "πατέρα (patéra) is the object, so it is in the accusative: ο πατέρας (o patéras) becomes τον πατέρα (ton patéra)."
    bases:
      "τον": "the"
  "el-4941":
    native: "I see the mother."
    notes:
      "n1": "The feminine accusative article is την (tin), written τη (ti) before μ (m); the noun does not change."
    bases:
      "τη": "the"
  "el-4942":
    native: "I see the child."
    notes:
      "n1": "A neuter noun and its article look the same in the nominative and the accusative."
    bases:
      "το": "the"
  "el-4943":
    native: "Do you see the brother?"
    notes:
      "n1": "ο αδελφός (o adelfós) becomes τον αδελφό (ton adelfó) in the accusative: the ending -ος (-os) becomes -ο (-o)."
    bases:
      "τον": "the"
  "el-4944":
    native: "I know your sister."
    notes:
      "n1": "The article is την (tin) with its ν (n) before the vowel of αδελφή (adelfí). σου (sou) comes after the noun."
    bases:
      "την": "the"
  "el-4945":
    native: "I see the friends."
    notes:
      "n1": "The plural accusative of a masculine noun in -ος (-os) is -ους (-ous), with the article τους (tous)."
    bases:
      "τους": "the"
  "el-4946":
    native: "I see the daughters."
    notes:
      "n1": "The plural accusative of a feminine noun is the same as its plural nominative: κόρες (kóres), with the article τις (tis)."
    bases:
      "τις": "the"
  "el-4947":
    native: "I have a brother."
    notes:
      "n1": "After έχω (écho) the object is in the accusative, so a is έναν (énan) for a masculine noun."
  "el-4948":
    native: "I have a daughter."
    notes:
      "n1": "A feminine noun and its indefinite article μια (mia) look the same in the nominative and the accusative."
  "el-4949":
    native: "We have a son."
    notes:
      "n1": "ο γιος (o yios) becomes τον γιο (ton yio) and ένας γιος (énas yios) becomes έναν γιο (énan yio) in the accusative."
  "el-4950":
    native: "The doctor sees the father."
    notes:
      "n1": "ο γιατρός (o yiatrós) is the subject, in the nominative; τον πατέρα (ton patéra) is the object, in the accusative."
    bases:
      "Ο": "the"
      "τον": "the"
  "el-4951":
    native: "The teacher asks the children."
    notes:
      "n1": "τα παιδιά (ta paidiá) is the object; for a neuter noun the plural accusative is the same as the plural nominative."
    bases:
      "Η": "the"
      "τα": "the"
  "el-4952":
    native: "The father sees the mother."
    notes:
      "n1": "The subject ο πατέρας (o patéras) is in the nominative and the object τη μητέρα (ti mitéra) in the accusative. Only the article and the ending of the masculine noun show which is which."
    bases:
      "Ο": "the"
      "τη": "the"
  "el-4953":
    native: "I read the book."
    notes:
      "n1": "το βιβλίο (to vivlío) is neuter, so the article and noun do not change in the accusative."
    bases:
      "το": "the"
  "el-4954":
    native: "My friend sees my sister."
    notes:
      "n1": "The article stays before the noun, and μου (mou) follows it. ο φίλος (o fílos) is the subject and την αδελφή (tin adelfí) the object."
    bases:
      "Ο": "the"
      "την": "the"
