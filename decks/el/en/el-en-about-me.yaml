name: "About me"
license: "CC-BY-SA-4.0"
description: "Words for talking about yourself: your name, your age, where you come from, where you live and work, and what you study and speak. Readings are based on ELOT 743 romanisation. Not yet checked by a Greek speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "el-1700":
    native: "name"
    notes:
      "n1": "όνομα (ónoma) is neuter: το όνομα (to ónoma)."
    examples:
      "Αυτό είναι το όνομα.":
        native: "This is the name."
        bases:
          "Αυτό": "this"
          "είναι": "is"
          "το": "the"
          "όνομα": "name"
  "el-1701":
    native: "to be called"
    notes:
      "n1": "λέγομαι (légomai) is a middle verb, with its forms ending in -ομαι (-omai): εγώ λέγομαι (egó légomai) means I am called."
    examples:
      "Εγώ λέγομαι.":
        native: "I am called."
        bases:
          "Εγώ": "I"
          "λέγομαι": "am called"
  "el-1702":
    native: "to live"
    notes:
      "n1": "ζω (zo) is the first person singular form: εγώ ζω (egó zo) means I live.."
    examples:
      "Εγώ ζω.":
        native: "I live."
        bases:
          "Εγώ": "I"
          "ζω": "live"
