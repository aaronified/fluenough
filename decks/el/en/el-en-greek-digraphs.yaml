schema: 1
id: "el-en-greek-digraphs"
kind: "layer"
core: "el-greek-digraphs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Greek letter pairs"
license: "CC-BY-SA-4.0"
description: "Thirteen pairs of letters that Greek reads as one sound: αι (ai), ει (ei), οι (oi), ου (ou), υι (yi), αυ (af), ευ (ef), μπ (b), ντ (d), γκ (g), γγ (ng), τσ (ts) and τζ (tz). Taken from Wikipedia's page on Modern Greek phonology. Not yet checked by a Greek speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "el-0330":
    native: "e, as in \"bet\""
    notes:
      "n1": "The pair αι (ai) is said /e/, exactly like the single letter ε (e), as in και (kai), and, and παιδί (paidí), child. It is a spelling to learn, as English 'ai' is not said 'ai'."
      "pair": "Not the sound of α (a) plus ι (i): αι (ai) is said just like ε (e)."
  "el-0331":
    native: "ee, as in \"see\""
    notes:
      "n1": "The pair ει (ei) is said /i/, 'ee', like η (i), ι (i) and υ (y), as in είναι (eínai), is."
  "el-0332":
    native: "ee, as in \"see\""
    notes:
      "n1": "The pair οι (oi) is said /i/, 'ee', not 'oy', as in οι (oi), the plural 'the', which is said 'ee'."
  "el-0333":
    native: "oo, as in \"boot\""
    notes:
      "n1": "The pair ου (ou) is said /u/, 'oo' as in 'boot', as in σου (sou), your, and πού (poú), where. Greek has no single letter for 'oo'."
  "el-0334":
    native: "ee, as in \"see\""
    notes:
      "n1": "The pair υι (yi) is said /i/, 'ee'. It is rare, found in a few words such as υιός (yiós), a formal word for son."
  "el-0335":
    native: "av or af"
    notes:
      "n1": "The pair αυ (af) is said /av/ before a vowel or a voiced consonant, as in αύριο (ávrio), tomorrow, and /af/ before a voiceless consonant (θ (th), κ (k), ξ (x), π (p), σ (s), τ (t), φ (f), χ (ch), ψ (ps)) or at the end of a word, as in αυτός (aftós), he."
  "el-0336":
    native: "ev or ef"
    notes:
      "n1": "The pair ευ (ef) follows the same rule as αυ (af): /ev/ before a vowel or a voiced consonant, as in ευρώ (evró), euro, and /ef/ before a voiceless consonant, as in ευχαριστώ (efcharistó), thank you."
  "el-0337":
    native: "b at the start of a word; mb inside"
    notes:
      "n1": "The pair μπ (b) is the Greek way to write 'b', which has no letter of its own. At the start of a word it is said /b/, as in μπάλα (bála), ball. Inside a word it is said /mb/, as in κάμπος (kámpos), plain."
      "pair": "Not β (v): the letter β (v) is said v, and the pair μπ (b) is said b."
  "el-0338":
    native: "d at the start of a word; nd inside"
    notes:
      "n1": "The pair ντ (d) is the Greek way to write 'd'. At the start of a word it is said /d/, as in ντομάτα (domáta), tomato. Inside a word it is said /nd/, as in πέντε (pénte), five."
      "pair": "Not δ (d): the letter δ (d) is the soft 'th' of 'this', and the pair ντ (d) is said d."
  "el-0339":
    native: "g, as in \"go\" at the start of a word; ng inside"
    notes:
      "n1": "The pair γκ (g) is the Greek way to write the hard 'g' of 'go'. At the start of a word it is said /g/, as in γκάζι (gázi), gas; inside a word it is said /ng/, as in ανάγκη (anángi), need."
      "pair": "Not γ (g): the letter γ (g) alone is the soft rasp, and the pair γκ (g) is the hard 'g'."
  "el-0340":
    native: "ng, as in \"finger\""
    notes:
      "n1": "The pair γγ (ng) is said /ŋg/, 'ng' as in 'finger', not 'ng' as in 'singer', as in αγγλικά (angliká), English."
  "el-0341":
    native: "ts, as in \"cats\""
    notes:
      "n1": "The pair τσ (ts) is said /ts/, as in τσάι (tsái), tea. It is one sound, said at the start of a word as well."
  "el-0342":
    native: "dz, as in \"adze\""
    notes:
      "n1": "The pair τζ (tz) is said /dz/, a 'd' and a 'z' said together, as in τζάκι (tzáki), fireplace."
