description: "14 short sentences written from the tables: the article takes the gender and the number of the noun. Not yet checked by a Greek speaker: please report any mistake."
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "el-4900":
    native: "The father is here."
    notes:
      "n1": "πατέρας (patéras) is masculine, so it takes the article ο (o)."
    bases:
      "Ο": "the"
  "el-4901":
    native: "The mother is there."
    notes:
      "n1": "μητέρα (mitéra) is feminine, so it takes the article η (i)."
    bases:
      "Η": "the"
  "el-4902":
    native: "The child is here."
    notes:
      "n1": "παιδί (paidí) is neuter, so it takes the article το (to)."
    bases:
      "Το": "the"
  "el-4903":
    native: "The brother is there."
    notes:
      "n1": "αδελφός (adelfós) is masculine, so it takes the article ο (o)."
    bases:
      "Ο": "the"
  "el-4904":
    native: "The sister is here."
    notes:
      "n1": "αδελφή (adelfí) is feminine, so it takes the article η (i)."
    bases:
      "Η": "the"
  "el-4905":
    native: "I have a sister."
    notes:
      "n1": "αδελφή (adelfí) is feminine, so a is μια (mia)."
  "el-4906":
    native: "I have a child."
    notes:
      "n1": "παιδί (paidí) is neuter, so a is ένα (éna)."
  "el-4907":
    native: "A man is there."
    notes:
      "n1": "άντρας (ántras) is masculine, so a is ένας (énas)."
  "el-4908":
    native: "A woman is here."
    notes:
      "n1": "γυναίκα (gynaíka) is feminine, so a is μια (mia)."
  "el-4909":
    native: "A baby is there."
    notes:
      "n1": "μωρό (moró) is neuter, so a is ένα (éna)."
  "el-4910":
    native: "The fathers are here."
    notes:
      "n1": "The plural of πατέρας (patéras) is πατέρες (patéres), with the plural article οι (oi)."
    bases:
      "Οι": "the"
  "el-4911":
    native: "The daughters are there."
    notes:
      "n1": "The plural of κόρη (kóri) is κόρες (kóres), with the plural article οι (oi)."
    bases:
      "Οι": "the"
  "el-4912":
    native: "The children are here."
    notes:
      "n1": "The plural of παιδί (paidí) is παιδιά (paidiá), with the neuter plural article τα (ta)."
    bases:
      "Τα": "the"
  "el-4913":
    native: "The friends are there."
    notes:
      "n1": "The plural of φίλος (fílos) is φίλοι (fíloi), with the plural article οι (oi)."
    bases:
      "Οι": "the"
