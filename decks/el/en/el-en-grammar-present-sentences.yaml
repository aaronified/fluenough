schema: 1
id: "el-en-grammar-present-sentences"
kind: "layer"
core: "el-grammar-present-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The present tense in sentences"
license: "CC-BY-SA-4.0"
description: "16 short sentences written from the tables: every verb shows its person in its ending. Not yet checked by a Greek speaker: please report any mistake."
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "el-4920":
    native: "I write a letter."
    notes:
      "n1": "γράφω (gráfo) is the first person singular of a first-class verb: stem γράφ- (gráf-) and the ending -ω (-o)."
  "el-4921":
    native: "Are you reading a book?"
    notes:
      "n1": "διαβάζεις (diavázeis) is the second person singular: stem διαβάζ- (diaváz-) and the ending -εις (-eis). The present tense also means 'are reading'."
  "el-4922":
    native: "The father is reading."
    notes:
      "n1": "διαβάζει (diavázei) is the third person singular, ending in -ει (-ei)."
    bases:
      "Ο": "the"
  "el-4923":
    native: "I drink water."
    notes:
      "n1": "πίνω (píno) is the first person singular of a first-class verb, with the stress on the stem. There is no word for 'a' before νερό (neró), as English has none before 'water'."
  "el-4924":
    native: "Do you want water?"
    notes:
      "n1": "θέλεις (théleis) is the second person singular, the ending -εις (-eis) on the stem θέλ- (thél-). A question has the same word order as a statement, with a question mark."
  "el-4925":
    native: "The children are playing."
    notes:
      "n1": "παίζουν (paízoun) is the third person plural, the ending -ουν (-oun); a neuter plural subject takes a plural verb."
    bases:
      "Τα": "the"
  "el-4926":
    native: "We work here."
    notes:
      "n1": "δουλεύουμε (doulévoume) is the first person plural, ending in -ουμε (-oume). The pronoun εμείς (emeís) is added for stress and could be left out."
  "el-4927":
    native: "Do you live there?"
    notes:
      "n1": "μένετε (ménete) is the second person plural, ending in -ετε (-ete); it is also the polite form for one person."
  "el-4928":
    native: "My brother runs."
    notes:
      "n1": "τρέχει (tréchei) is the third person singular. μου (mou) follows the noun, with the article before the noun: ο αδελφός μου (o adelfós mou) is my brother."
    bases:
      "Ο": "the"
  "el-4929":
    native: "Do you speak Greek?"
    notes:
      "n1": "μιλάς (milás) is the second person singular of a second-class verb: stem μιλ- (mil-), the stressed ending -άς (-ás)."
    bases:
      "ελληνικά": "Greek (the language)"
  "el-4930":
    native: "The mother is walking."
    notes:
      "n1": "περπατάει (perpatáei) is the third person singular of a second-class verb; the shorter περπατά (perpatá) is also right."
    bases:
      "Η": "the"
  "el-4931":
    native: "We wake up early."
    notes:
      "n1": "ξυπνάμε (xypnáme) is the first person plural of a second-class verb; the formal form is ξυπνούμε (xypnoúme)."
  "el-4932":
    native: "Do you have a sister?"
    notes:
      "n1": "έχεις (écheis) is the second person singular of έχω (écho), which has regular endings in the present."
  "el-4933":
    native: "What are you saying?"
    notes:
      "n1": "λες (les) is the second person singular of λέω (léo), a short form with no vowel before the ending."
  "el-4934":
    native: "We eat here."
    notes:
      "n1": "τρώμε (tróme) is the first person plural of τρώω (tróo), which has the short forms τρως (tros) and τρώμε (tróme)."
  "el-4935":
    native: "Do you know Greek?"
    notes:
      "n1": "ξέρεις (xéreis) is the second person singular of a first-class verb, with the stress on the stem."
    bases:
      "ελληνικά": "Greek (the language)"
