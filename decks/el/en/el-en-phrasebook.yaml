schema: 1
id: "el-en-phrasebook"
kind: "layer"
core: "el-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty survival phrases to say whole from the first lesson, before their words are taught: greetings and goodbyes, sorry, not understanding, asking the way and the price, and asking for help. The readings are based on ELOT 743 romanisation. Not yet checked by a Greek speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "el-0011":
    native: "Good morning; good day."
    notes:
      "n1": "Used from morning until about noon. In the evening say καλησπέρα (kalispéra)."
    bases:
      "Καλημέρα": "good morning"
  "el-0012":
    native: "Good night."
    notes:
      "n1": "Said at bedtime, or when leaving in the evening."
    bases:
      "Καληνύχτα": "good night"
  "el-0013":
    native: "Goodbye."
    notes:
      "n1": "A plain goodbye. For a casual one, say γεια (ya)."
    bases:
      "Αντίο": "goodbye"
  "el-0014":
    native: "Excuse me."
    notes:
      "n1": "Said to get past someone, or to get attention. For a mistake, say συγγνώμη (syngnómi), sorry."
    bases:
      "Με": "me"
      "συγχωρείτε": "to forgive; to excuse"
  "el-0015":
    native: "Sorry."
    notes:
      "n1": "Sorry for a mistake or a bump. A bigger apology is λυπάμαι (lypáme), I am sorry."
    bases:
      "Συγγνώμη": "sorry"
  "el-0016":
    native: "I don't understand."
    notes:
      "n1": "Δεν (den) goes before the verb. Καταλαβαίνω (katalavaíno) means I understand."
    bases:
      "Δεν": "not (before a verb)"
      "καταλαβαίνω": "to understand"
  "el-0017":
    native: "I don't speak Greek."
    notes:
      "n1": "Ελληνικά (elliniká) is the Greek language. Say αγγλικά (aggliká) for English."
    bases:
      "Δεν": "not (before a verb)"
      "μιλάω": "to speak"
      "ελληνικά": "Greek (language)"
  "el-0018":
    native: "Do you speak English?"
    notes:
      "n1": "The polite form, to one person or several."
    bases:
      "Μιλάτε": "to speak (polite you)"
      "αγγλικά": "English (language)"
  "el-0019":
    native: "Please speak more slowly."
    notes:
      "n1": "Πιο (pio) is more. Αργά (argá) is slowly."
    bases:
      "Μιλήστε": "to speak (polite you)"
      "πιο": "more"
      "αργά": "slowly"
  "el-0020":
    native: "Again, please."
    notes:
      "n1": "Πάλι (páli) is again. Say it when you did not hear."
    bases:
      "Πάλι": "again"
  "el-0021":
    native: "How much is it?"
    notes:
      "n1": "Κάνει (káni) is the verb to cost, in this sense."
    bases:
      "Πόσο": "how much"
      "κάνει": "to make; to cost"
  "el-0022":
    native: "The bill, please."
    notes:
      "n1": "Λογαριασμός (logariasmós) is the bill in a café or a restaurant."
    bases:
      "Τον": "the (masculine, accusative)"
      "λογαριασμό": "bill; account"
  "el-0023":
    native: "Help!"
    notes:
      "n1": "A cry for help, or a request for someone to help you."
    bases:
      "Βοήθεια": "help"
  "el-0024":
    native: "Where is the station?"
    notes:
      "n1": "Σταθμός (stathmós) is a station, such as a bus or railway station."
    bases:
      "Πού": "where"
      "είναι": "to be"
      "ο": "the (masculine)"
      "σταθμός": "station"
  "el-0025":
    native: "What does that mean?"
    notes:
      "n1": "Σημαίνει (simaínei) is the verb to mean."
    bases:
      "Τι": "what"
      "σημαίνει": "to mean"
      "αυτό": "this; that"
  "el-0026":
    native: "My name is Anna."
    notes:
      "n1": "Literally: they call me Anna. Put any name after λένε."
    bases:
      "Με": "me"
      "λένε": "to say; to call"
      "Άννα": "Anna (a first name)"
  "el-0027":
    native: "Nice to meet you."
    notes:
      "n1": "Literally: I am very glad."
    bases:
      "Χαίρω": "to be glad"
  "el-0028":
    native: "Where are you from?"
    notes:
      "n1": "Answer with Είμαι από (eímai apó) and a country or a city."
    bases:
      "Από": "from"
      "πού": "where"
      "είσαι": "to be"
  "el-0029":
    native: "It's all right; OK."
    notes:
      "n1": "Εντάξει (entáxei) is an everyday OK."
    bases:
      "Είναι": "to be"
      "εντάξει": "all right; OK"
  "el-0030":
    native: "Enjoy your meal!"
    notes:
      "n1": "Literally: good appetite."
    bases:
      "Καλή": "good"
      "όρεξη": "appetite"
