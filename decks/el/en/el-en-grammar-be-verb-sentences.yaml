schema: 1
id: "el-en-grammar-be-verb-sentences"
kind: "layer"
core: "el-grammar-be-verb-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "To be in sentences"
license: "CC-BY-SA-4.0"
description: "14 short sentences written from the tables: statements, negatives and questions with είμαι (eímai). Not yet checked by a Greek speaker: please report any mistake."
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "el-4960":
    native: "I am a doctor."
    notes:
      "n1": "After είμαι (eímai) a job takes no article: γιατρός (yiatrós) is in the nominative, as the English 'a' is left out."
  "el-4961":
    native: "I am not a teacher."
    notes:
      "n1": "δεν (den) goes before είμαι (eímai)."
    bases:
      "Δεν": "not (before a verb)"
  "el-4962":
    native: "Are you a teacher?"
    notes:
      "n1": "The question has the same words as the statement είσαι δάσκαλος (eísai dáskalos)."
  "el-4963":
    native: "The mother is a teacher."
    notes:
      "n1": "The job δασκάλα (daskála) is feminine, as it names a woman."
    bases:
      "Η": "the"
  "el-4964":
    native: "We are friends."
    notes:
      "n1": "είμαστε (eímaste) is the first person plural, and φίλοι (fíloi) is the plural of φίλος (fílos)."
  "el-4965":
    native: "He is good."
    notes:
      "n1": "With no subject, είναι (eínai) means 'he is', 'she is' or 'it is': καλός (kalós) is masculine, so here it is 'he'."
  "el-4966":
    native: "Where are you?"
    notes:
      "n1": "πού (poú) comes first, then the verb."
  "el-4967":
    native: "Where is the child?"
    notes:
      "n1": "The verb comes before the subject in a question with πού (poú)."
    bases:
      "το": "the"
  "el-4968":
    native: "We are not here."
    notes:
      "n1": "δεν (den) goes before είμαστε (eímaste)."
    bases:
      "Δεν": "not (before a verb)"
  "el-4969":
    native: "Is the teacher here?"
    notes:
      "n1": "A yes or no question keeps the word order of a statement and takes a question mark."
    bases:
      "Η": "the"
  "el-4970":
    native: "The doctor is not here."
    notes:
      "n1": "δεν (den) comes between the subject and the verb."
    bases:
      "Ο": "the"
      "δεν": "not (before a verb)"
  "el-4971":
    native: "Are you well?"
    notes:
      "n1": "είστε (eíste) is the second person plural, used to many people or politely to one person."
  "el-4972":
    native: "He is my brother."
    notes:
      "n1": "ο αδελφός μου (o adelfós mou) is the noun after the verb, in the nominative: μου (mou) follows the noun."
    bases:
      "ο": "the"
  "el-4973":
    native: "The water is here."
    notes:
      "n1": "νερό (neró) is neuter, so the article is το (to)."
    bases:
      "Το": "the"
