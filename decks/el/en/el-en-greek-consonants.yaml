id: "el-en-greek-consonants"
kind: "layer"
core: "el-greek-consonants"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Greek consonants"
license: "CC-BY-SA-4.0"
description: "Seventeen consonant letters of Modern Greek, each with the sound it says: three that English does not have as single letters (δ (d) is a soft 'th', θ (th) is a hard 'th', and γ (g) is a rasp), the tapped ρ (r) and the double sounds ξ (x) and ψ (ps). The final form ς (s) is on the reading deck. Taken from Wikipedia's pages on the Greek alphabet and Modern Greek phonology. Not yet checked by a Greek speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "el-0310":
    native: "v, as in \"very\""
    notes:
      "n1": "The letter β (v) is called βήτα (víta). It looks like a Latin B but is said /v/, as in βοήθεια (voítheia), help. Greek writes the sound 'b' with the two letters μπ (b)."
      "look-b": "Not a b sound: for 'b' Greek writes the pair μπ (b) (see the letter pairs)."
  "el-0311":
    native: "a soft, voiced \"gh\"; \"y\" before e and i"
    notes:
      "n1": "The letter γ (g) is called γάμμα (gámma). Before α (a), ο (o), ου (ou) and a consonant it is said /ɣ/, a voiced rasp made like a 'g' with the tongue not quite touching the roof of the mouth, as in εγώ (egó), I. Before ε (e), ι (i), η (i), υ (y) and αι (ai), ει (ei), οι (oi) it is said like the 'y' of 'yes', as in γεια (ya), hello. It is never the hard 'g' of 'go'; that is γκ (g)."
  "el-0312":
    native: "th, as in \"this\""
    notes:
      "n1": "The letter δ (d) is called δέλτα (délta). It is said /ð/, the soft, voiced 'th' of 'this' and 'the', never a 'd', as in δεν (den), not. Greek writes the sound 'd' with the two letters ντ (d)."
  "el-0313":
    native: "z, as in \"zoo\""
    notes:
      "n1": "The letter ζ (z) is called ζήτα (zíta). It is said /z/, as in ζω (zo), I live."
  "el-0314":
    native: "th, as in \"think\""
    notes:
      "n1": "The letter θ (th) is called θήτα (thíta). It is said as the unvoiced 'th' of 'think', as in θέλω (thélo), I want. Do not confuse it with δ (d), the voiced 'th' of 'this'."
  "el-0315":
    native: "k, as in \"sky\""
    notes:
      "n1": "The letter κ (k) is called κάπα (kápa). It is said /k/, as in καλός (kalós), good, with no puff of air after it."
  "el-0316":
    native: "l, as in \"love\""
    notes:
      "n1": "The letter λ (l) is called λάμδα (lámda). It is said /l/, as in καλός (kalós), good."
  "el-0317":
    native: "m, as in \"me\""
    notes:
      "n1": "The letter μ (m) is called μι (mi). It is said /m/, as in με (me), me."
  "el-0318":
    native: "n, as in \"no\""
    notes:
      "n1": "The letter ν (n) is called νι (ni). It looks like a Latin v, but it is said /n/, as in νερό (neró), water."
  "el-0319":
    native: "x, as in \"box\""
    notes:
      "n1": "The letter ξ (x) is called ξι (xi). It is said /ks/, as in ξέρω (xéro), I know. At the start of a word, as here, it is still said 'ks'."
  "el-0320":
    native: "p, as in \"spy\""
    notes:
      "n1": "The letter π (p) is called πι (pi). It is said /p/, as in πολύ (polý), very, with no puff of air after it."
  "el-0321":
    native: "r, a quick tap"
    notes:
      "n1": "The letter ρ (r) is called ρο (ro). It looks like a Latin P but it is said /ɾ/, a quick tap of the tongue like the middle of the American 'butter', as in νερό (neró), water."
      "look-p": "Not π (p): ρ (r) has a round head over a single stem and is the r sound; π (p) has a flat top and two legs."
  "el-0322":
    native: "s, as in \"sun\""
    notes:
      "n1": "The letter σ (s) is called σίγμα (sígma). It is said /s/, as in σου (sou), your. Before a voiced consonant (β (v), γ (g), δ (d), ζ (z), μ (m), ν (n), ρ (r)) it is said /z/: κόσμος (kósmos), world, is said 'kozmos'. At the end of a word it is written ς (s)."
  "el-0323":
    native: "t, as in \"stop\""
    notes:
      "n1": "The letter τ (t) is called ταυ (taf). It is said /t/, as in τι (ti), what, with no puff of air after it."
  "el-0324":
    native: "f, as in \"fun\""
    notes:
      "n1": "The letter φ (f) is called φι (fi). It is said /f/, as in φίλος (fílos), friend."
  "el-0325":
    native: "a rasped \"h\"; like \"ch\" in Scottish \"loch\""
    notes:
      "n1": "The letter χ (ch) is called χι (chi). It looks like a Latin X but is said /x/, a rasp at the back of the mouth like the 'ch' of Scottish 'loch', as in χάρη (chári). Before ε (e) and ι (i) it is said further forward, like the 'h' of 'huge', as in όχι (óchi), no."
  "el-0326":
    native: "ps, as in \"lapse\""
    notes:
      "n1": "The letter ψ (ps) is called ψι (psi). It is said /ps/, as in ψάχνω (psáchno), I search. At the start of a word it is still said 'ps'."
