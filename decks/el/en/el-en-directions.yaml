    native: "straight"
    notes:
      "n1": "ευθεία (eftheía) means straight on, in the same direction."
  "el-3001":
    native: "crossing"
    notes:
      "n1": "διασταύρωση (diastávrosi) is feminine: η διασταύρωση (i diastávrosi)."
    examples:
      "Αυτή είναι η διασταύρωση.":
        native: "This is the crossing."
        bases:
          "Αυτή": "this"
          "είναι": "is"
          "η": "the"
          "διασταύρωση": "crossing"
