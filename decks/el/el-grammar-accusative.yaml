# Unit 24 grammar topic accusative. Sources read: en.wikipedia.org 'Modern Greek grammar' (the definite article τον τη(ν) το, τους τις τα, the indefinite έναν μια(ν) ένα, and the declension tables of masculine, feminine and neuter nouns) and the en.wiktionary.org entries of the eleven nouns (accusative singular and plural). The final ν of την is kept before a vowel and before κ π τ ξ ψ μπ ντ γκ τσ τζ and dropped before other consonants (the note on the article table).
