# Unit 2 grammar topic stress. Sources read: en.wikipedia.org 'Modern Greek phonology' (variable stress on one of the last three syllables; the monotonic accent marks it) and the en.wiktionary.org entries νόμος, νομός, όρος, ορός (headword stress, senses).
# The forms keep the accent of the written word: without it the two forms of a row would be the same text.
