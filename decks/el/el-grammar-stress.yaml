id: "el-grammar-stress"
part: "core"
kind: "grammar"
language: { code: "el", iso639_3: "ell", name: "Greek (Modern)", script: "greek", tts: "el-GR", icon: "Ε" }
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
pattern:
  slots: ["first", "last"]
  entries:
    - lemma: "νόμος"
      key: "nomos"
      reading: "nómos"
      ipa: "ˈnomos"
      forms:
        "first": "νόμος"
        "last": "νομός"
      readings:
        "first": "nómos"
        "last": "nomós"
      ipas:
        "first": "ˈnomos"
        "last": "noˈmos"
    - lemma: "όρος"
      key: "oros"
      reading: "óros"
      ipa: "ˈoɾos"
