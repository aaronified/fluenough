# Unit 29 grammar topic be-verb. Sources read: en.wikipedia.org 'Modern Greek grammar' (είμαι and έχω, the present είμαι είσαι είναι είμαστε είστε/είσαστε είναι; negation with δεν before the verb) and the en.wiktionary.org entry είμαι (present active indicative). The subject pronoun is left out, as Greek does. Rows use only words of earlier units: εδώ and the pronouns.
