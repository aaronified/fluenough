schema: 1
kind: "phonetics"
id: "el-phonetics"
language: "el"
variety: "Standard Modern Greek, as the course's broad ipa writes it (tools/transcribe.py greek_ipa(): stress marked before the stressed syllable, ʝ for γ before a front vowel, ɣ elsewhere, ŋɡ for γκ and γγ, ɾ for ρ), not a regional accent"
description: "Rules that turn a card's broad ipa into its narrow [ ] form, in order. Written for tools/derive_phonetic.py, never read by the app. Each rule applies the regular expression to the whole ipa string and replaces every match; the next rule works on the result. Only the attested standard Greek allophony is here: the palatal allophones c ɟ ç of k ɡ x before front vowels and before j (the j is absorbed, χιόνι [ˈçoni]), and the assimilation of n to a following velar, palatal, dental fricative or labiodental. Already in the broad ipa, so not repeated: ʝ for γ before a front vowel, the voicing of s to z before a voiced consonant, v and f for υ, and the glide j. Left out, on purpose, because the source gives no clear rule for the course's broad forms: the dental or alveolar place of t d (the source says it ranges), the retracted s z, the postalveolar l̠ in consonant-plus-glide clusters, the trill or approximant r (the broad ɾ is kept), n before p b (an example only across a word boundary), the devoicing and elision of unstressed i u, and the prenasalised mb nd as stops. Sources are Wikipedia, Modern Greek phonology, and Wiktionary, Appendix:Greek pronunciation, both read 2026-11-28. Rules marked as the builder's choice go beyond an example in the source. Not verified by a Greek phonetician, so the rules ship unreviewed."
rules:
- id: "el-kj-to-palatal"
  pattern: "k(ˈ?)j"
  replace: "\\1c"
  source: "Wikipedia, \"Modern Greek phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: before /a o u/ a velar \"merges with a following nonsyllabic /i/ to the corresponding palatal\", χιόνι [ˈçoni]. Here the /j/ is absorbed into the palatal, and a stress mark between them moves before the palatal. The source's example is χ; the builder applies the same sentence to k (and, below, ɡ)."
- id: "el-xj-to-palatal"
  pattern: "x(ˈ?)j"
  replace: "\\1ç"
  source: "Wikipedia, \"Modern Greek phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: χιόνι [ˈçoni]; en.wiktionary.org, \"Appendix:Greek pronunciation\", read 2026-11-28 (CC BY-SA 4.0)."
- id: "el-gj-to-palatal"
  pattern: "ɡ(ˈ?)j"
  replace: "\\1ɟ"
  source: "Wikipedia, \"Modern Greek phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: velar plus nonsyllabic /i/ gives the palatal, as χιόνι [ˈçoni]. The builder applies the same sentence to ɡ; no card of the course has it yet."
- id: "el-k-front"
  pattern: "k(?=ˈ?[ie])"
  replace: "c"
  source: "Wikipedia, \"Modern Greek phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: [c ɟ ç ʝ] are allophones of /k ɡ x ɣ/ \"before the front vowels /e, i/\". The stress mark may sit between."
- id: "el-g-front"
  pattern: "ɡ(?=ˈ?[ie])"
  replace: "ɟ"
  source: "Wikipedia, \"Modern Greek phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: [c ɟ ç ʝ] are allophones of /k ɡ x ɣ/ before /e, i/."
- id: "el-x-front"
  pattern: "x(?=ˈ?[ie])"
  replace: "ç"
  source: "Wikipedia, \"Modern Greek phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: [c ɟ ç ʝ] are allophones of /k ɡ x ɣ/ before /e, i/."
- id: "el-gh-front"
  pattern: "ɣ(?=ˈ?[ie])"
  replace: "ʝ"
  source: "Wikipedia, \"Modern Greek phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: [c ɟ ç ʝ] are allophones of /k ɡ x ɣ/ before /e, i/. The broad ipa already writes ʝ for γ before a front vowel, so this rule changes nothing today; it keeps the file complete."
- id: "el-n-before-palatal"
  pattern: "n(?=ˈ?[cɟçʝ])"
  replace: "ɲ"
  source: "Wikipedia, \"Modern Greek phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: \"The alveolar nasal /n/ is assimilated to following obstruents\", with alveolo-palatal and velar realisations; ɲ is the palatal nasal for the palatal obstruents written by the rules above (the builder's choice of symbol: the source names the place, not the letter), as αγγινάρα [aɲɟiˈnaɾa]. Runs after the palatal rules, which make the following consonant palatal."
- id: "el-ng-before-palatal"
  pattern: "ŋ(?=ˈ?[cɟçʝ])"
  replace: "ɲ"
  source: "Wikipedia, \"Modern Greek phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: /n/ assimilates to the following obstruent. The broad ipa writes the prenasalised γκ γγ as ŋɡ, ŋɣ (and the nasal is ŋ), but before a front vowel the stop has become ɟ, so the nasal is palatal (the builder's application of the same assimilation)."
- id: "el-n-before-velar"
  pattern: "n(?=ˈ?[kɡxɣ])"
  replace: "ŋ"
  source: "Wikipedia, \"Modern Greek phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants, Sandhi: \"/n/ takes the place of the following obstruent\" within words, άγχος [ˈaŋxos]."
- id: "el-n-before-dental-fricative"
  pattern: "n(?=ˈ?[θð])"
  replace: "n̪"
  source: "Wikipedia, \"Modern Greek phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: /n/ is assimilated to a following dental, άνθος [ˈan̪θos]. Only before θ and ð: the source gives the place of t and d as ranging from alveolar to dental, so no dental mark is written for n before t d."
- id: "el-n-before-labiodental"
  pattern: "n(?=ˈ?[fv])"
  replace: "ɱ"
  source: "Wikipedia, \"Modern Greek phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants: /n/ assimilated to following obstruents includes a labiodental realisation. Before p b the source's example is across a word boundary, so no rule is written for them."
