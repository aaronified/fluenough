  "sentences":
  - "text": "प्रिय संपादक, मला वाटते की रस्त्यावर गाड्या खूप आहेत."
    "reading": "priy sampādak, malā vāṭte ki rastyāvar gāḍyā khup āhet."
    "ipa": "prij səmpad̪ək məla ʋaʈt̪e ki rəst̪jaʋər ɡaɖja kʰup aɦet̪"
  - "text": "सकाळी शाळेत जाताना खूप वेळ लागतो."
    "reading": "sakāḷi śāḷet jātānā khup veḷ lāgto."
    "ipa": "səkaɭi ʃaɭet̪ dzat̪ana kʰup ʋeɭ laɡt̪o"
  - "text": "कृपया सार्वजनिक बस वाढवा."
    "reading": "krupyā sārvajnik bas vāḍhvā."
    "ipa": "krupja sarʋədznik bəs ʋaɖʱʋa"
  - "text": "प्रिय संपादक, मला वाटते की उद्यान खूप सुंदर आहे."
    "reading": "priy sampādak, malā vāṭte ki udyān khup sundar āhe."
    "ipa": "prij səmpad̪ək məla ʋaʈt̪e ki ud̪jan kʰup sund̪ər aɦe"
  - "text": "पण तिथे कचरा दिसतो."
    "reading": "paṇ tithe kacrā disto."
    "ipa": "pəɳ t̪it̪ʰe kətsra d̪ist̪o"
  - "text": "कृपया सर्वांनी कचरा कुंडीत टाका."
    "reading": "krupyā sarvānni kacrā kuṇḍit ṭākā."
    "ipa": "krupja sərʋanni kətsra kuɳɖit̪ ʈaka"
