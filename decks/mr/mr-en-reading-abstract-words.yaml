    title: "Opinion column"
    sentences:
      - text: "माझ्या मते, सत्य सांगणं महत्त्वाचं आहे."
        reading: "mājhyā mate, satya sāṅgaṇam̐ mahattvācam̐ āhe."
        ipa: "madʒʱja mət̪e sət̪jə saŋɡəɳə̃ məɦət̪t̪ʋatsə̃ aɦe"
      - text: "असत्य बोलणं सोपं वाटतं, पण त्याने विश्वास तुटतो."
        reading: "asatya bolṇam̐ sopam̐ vāṭtam̐, paṇ tyāne viśvās tuṭto."
        ipa: "əsət̪jə bolɳə̃ sopə̃ ʋaʈt̪ə̃ pəɳ t̪jane ʋiʃʋas t̪uʈt̪o"
      - text: "दया आणि करुणा या दोन्ही चांगल्या गोष्टी आहेत."
        reading: "dayā āṇi karuṇā yā donhi cāṅgalyā goṣṭi āhet."
        ipa: "d̪əja aɳi kəruɳa ja d̪onɦi tsaŋɡəlja ɡoʂʈi aɦet̪"
      - text: "संयम ठेवा, कारण रागाने काही चांगलं होत नाही."
        reading: "saṁyam ṭhevā, kāraṇ rāgāne kāhi cāṅgalam̐ hot nāhi."
        ipa: "sə̃jəm ʈʰeʋa karəɳ raɡane kaɦi tsaŋɡələ̃ ɦot̪ naɦi"
      - text: "नम्रता ठेवणं चांगलं आहे."
        reading: "namratā ṭhevṇam̐ cāṅgalam̐ āhe."
        ipa: "nəmrət̪a ʈʰeʋɳə̃ tsaŋɡələ̃ aɦe"
