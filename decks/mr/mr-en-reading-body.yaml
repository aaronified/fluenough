  "sentences":
  - "text": "पहिला व्यायाम: दोन्ही हात वर करा."
    "reading": "pahilā vyāyām: donhi hāt var karā."
    "ipa": "pəɦila ʋjajam d̪onɦi ɦat̪ ʋər kəra"
  - "text": "दुसरा व्यायाम: मान हळू हलवा."
    "reading": "dusrā vyāyām: mān haḷu halvā."
    "ipa": "d̪usra ʋjajam man ɦəɭu ɦəlʋa"
  - "text": "तिसरा व्यायाम: पाठ सरळ ठेवा."
    "reading": "tisrā vyāyām: pāṭh saraḷ ṭhevā."
    "ipa": "t̪isra ʋjajam paʈʰ sərəɭ ʈʰeʋa"
  - "text": "चौथा व्यायाम: गुडघा वाकवा."
    "reading": "cauthā vyāyām: guḍghā vākvā."
    "ipa": "tsəut̪ʰa ʋjajam ɡuɖɡʱa ʋakʋa"
  - "text": "व्यायाम करताना पाणी प्या."
    "reading": "vyāyām kartānā pāṇi pyā."
    "ipa": "ʋjajam kərt̪ana paɳi pja"
