    sentences:
      - text: "प्रिय मित्रा, इथे पावसाळा सुरू झाला आहे."
        reading: "priy mitrā, ithe pāvsāḷā suru jhālā āhe."
        ipa: "prij mit̪ra it̪ʰe paʋsaɭa suru dzʱala aɦe"
      - text: "आज खूप पाऊस पडत आहे."
        reading: "āj khup pāus paḍat āhe."
        ipa: "adz kʰup paus pəɖət̪ aɦe"
      - text: "रस्त्यावर पाणी साचलं आहे."
        reading: "rastyāvar pāṇi sāclam̐ āhe."
        ipa: "rəst̪jaʋər paɳi satslə̃ aɦe"
      - text: "म्हणून मी घरीच थांबतो."
        reading: "mhaṇun mi gharic thāmbato."
        ipa: "mɦəɳun mi ɡʱərits t̪ʰambət̪o"
      - text: "तू कधी येशील?"
        reading: "tu kadhi yeśil?"
        ipa: "t̪u kəd̪ʱi jeʃil"
