    title: "Fridge note"
    sentences:
      - text: "फ्रिजमध्ये दूध आहे."
        reading: "phrijmadhye dudh āhe."
        ipa: "pʰridzməd̪ʱje d̪ud̪ʱ aɦe"
      - text: "दूध प्या."
        reading: "dudh pyā."
        ipa: "d̪ud̪ʱ pja"
      - text: "भात आणि भाजी खा."
        reading: "bhāt āṇi bhāji khā."
        ipa: "bʱat̪ aɳi bʱadʒi kʰa"
      - text: "फळे फ्रिजमध्ये ठेवा."
        reading: "phaḷe phrijmadhye ṭhevā."
        ipa: "pʰəɭe pʰridzməd̪ʱje ʈʰeʋa"
      - text: "मी उद्या बाजारात जाईन."
        reading: "mi udyā bājārāt jāin."
        ipa: "mi ud̪ja badzarat̪ dzain"
