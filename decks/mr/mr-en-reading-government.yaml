  "title": "Form instructions"
  "sentences":
  - "text": "अर्ज भरताना नाव स्पष्ट लिहा."
    "reading": "arj bhartānā nāv spaṣṭ lihā."
    "ipa": "ərdz bʱərt̪ana naʋ spəʂʈ liɦa"
  - "text": "पत्ता पूर्ण लिहा."
    "reading": "pattā purṇa lihā."
    "ipa": "pət̪t̪a purɳə liɦa"
  - "text": "फोटो अर्जाला जोडा."
    "reading": "phoṭo arjālā joḍā."
    "ipa": "pʰoʈo ərdzala dzoɖa"
  - "text": "भरलेला अर्ज सरकारी कार्यालयात द्या."
    "reading": "bharlelā arj sarkāri kāryālyāt dyā."
    "ipa": "bʱərlela ərdz sərkari karjaljat̪ d̪ja"
