  - id: "mr-1107"
    target: "स्वयंपाक"
    reading: "svayampāk"
    ipa: "sʋəjəmpak"
    pos: "noun"
    gender: "m"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "स्वयंपाक", reading: "svayampāk" }] }
    examples:
      - { target: "आज माझा स्वयंपाक आहे.", reading: "āj mājhā svayampāk āhe.", ipa: "adz madzʱa sʋəjəmpak aɦe", bases: [{ word: "माझा", ref: "mr-0080" }, { word: "आहे", base: "असणे", reading: "asṇe" }] }
