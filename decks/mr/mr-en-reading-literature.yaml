  "sentences":
  - "text": "ही कादंबरी एका मुलीची गोष्ट आहे."
    "reading": "hi kādambari ekā mulici goṣṭ āhe."
    "ipa": "ɦi kad̪əmbəri eka mulitʃi ɡoʂʈ aɦe"
  - "text": "ती एका छोट्या गावात राहते."
    "reading": "ti ekā choṭyā gāvāt rāhte."
    "ipa": "t̪i eka tʃʰoʈja ɡaʋat̪ raɦt̪e"
  - "text": "तिला शाळेत जायचे आहे, पण घरची परिस्थिती चांगली नाही."
    "reading": "tilā śāḷet jāyce āhe, paṇ gharci paristhiti cāṅgali nāhi."
    "ipa": "t̪ila ʃaɭet̪ dzajtʃe aɦe pəɳ ɡʱərtʃi pərist̪ʰit̪i tsaŋɡəli naɦi"
  - "text": "एक दिवस तिला शहरातील एक माणूस भेटतो."
    "reading": "ek divas tilā śahrātil ek māṇus bheṭto."
    "ipa": "ek d̪iʋəs t̪ila ʃəɦrat̪il ek maɳus bʱeʈt̪o"
  - "text": "हे पुस्तक तुम्हाला आवडेल."
    "reading": "he pustak tumhālā āvḍel."
    "ipa": "ɦe pust̪ək t̪umɦala aʋɖel"
