# How Marathi readings are written (#47): popular and unmarked, the way
# Marathi is typed in a chat. Each group lists spellings a learner may type
# for the same sound; the first is the one the decks use. See
# "Romanisation" in docs/DECK-FORMAT.md.
schema: 1
kind: romanisation
id: mr-romanisation
language: mr
scheme: "Based on ISO 15919's letters, spelled as said, and departing from the standard where a learner is better served (ADR-0025; the README lists the departures): ā for आ; i and u for both the short and the long vowel, which Marathi says alike; e, o, ai and au; ṭ ṭh ḍ ḍh ṇ for the retroflex row and t th d dh n for the row on the teeth; c and j for च and ज however said; ś for श and ṣ for ष; ḷ for ळ; ê and ô for ॲ and ऑ. The inherent a is left out where it is not said. The anusvara is written as the nasal said (pandharā, āmbā), or ṁ before y, r, l, v, a sibilant or h (kiṁvā), and a nasal vowel at the end of a word is m̐ (mulam̐). ज्ञ is dny and क्ष kṣ, as said. A typed answer needs none of the marks, nor the final m̐."
standard: "ISO 15919"
# How a reading's letters are typed, read from the left, longest first:
# each reading is spelled so before an answer is compared with it.
typed:
  - ["ṅkh", "nkh"]
  - ["ṅgh", "ngh"]
  - ["ṅk", "nk"]
  - ["ṅg", "ng"]
  - ["ṅ", "ng"]
  - ["ñch", "nchh"]
  - ["ñc", "nch"]
  - ["ñjh", "njh"]
  - ["ñj", "nj"]
  - ["ñ", "ny"]
  - ["cch", "chchh"]
  - ["cc", "chch"]
  - ["ch", "chh"]
  - ["c", "ch"]
  - ["ś", "sh"]
  - ["ṣ", "sh"]
  - ["m̐", ""]
  - ["ṁ", "n"]
  - ["k͟h", "kh"]
  - ["ê", "a"]
equivalents:
  - ["a", "aa"]
  - ["i", "ee", "ii"]
  - ["u", "oo", "uu"]
  - ["v", "w"]
  - ["ph", "f"]
  - ["jh", "z", "zh"]
  - ["ksh", "x"]
  - ["dny", "gy", "gny"]
  - ["au", "ou"]
