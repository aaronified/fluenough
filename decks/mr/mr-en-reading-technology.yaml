  "title": "Instructions in an app"
  "sentences":
  - "text": "मेनू उघडा आणि नवीन बटण दाबा."
    "reading": "menu ughḍā āṇi navin baṭaṇ dābā."
    "ipa": "menu uɡʱɖa aɳi nəʋin bəʈəɳ d̪aba"
  - "text": "तुमचे नाव आणि ईमेल लिहा."
    "reading": "tumce nāv āṇi imel lihā."
    "ipa": "t̪umtʃe naʋ aɳi imel liɦa"
  - "text": "पासवर्ड गुप्त ठेवा."
    "reading": "pāsvarḍ gupt ṭhevā."
    "ipa": "pasʋərɖ ɡupt̪ ʈʰeʋa"
  - "text": "मदत हवी असल्यास या बटणावर दाबा."
    "reading": "madat havi asalyās yā baṭṇāvar dābā."
    "ipa": "məd̪ət̪ ɦəʋi əsəljas ja bəʈɳaʋər d̪aba"
