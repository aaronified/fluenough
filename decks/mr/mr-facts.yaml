facts:
  - id: mr-fact-001
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Marathi_language"
    text:
      en: "Marathi is an Indo-Aryan language, descended from Maharashtri Prakrit. Its close relatives include Konkani, Gujarati and Hindi."
      bn: "মারাঠি একটি ইন্দো-আর্য ভাষা, যার উদ্ভব মহারাষ্ট্রী প্রাকৃত থেকে। কোঙ্কণি, গুজরাটি ও হিন্দি এর নিকট আত্মীয়।"
      hi: "मराठी एक हिंद-आर्य भाषा है, जो महाराष्ट्री प्राकृत से निकली है। कोंकणी, गुजराती और हिंदी इसकी क़रीबी सहोदर भाषाएँ हैं।"
  - id: mr-fact-002
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Marathi_language"
    text:
      en: "Marathi is the official language of Maharashtra, and Goa also allows it for official purposes beside Konkani."
      bn: "মারাঠি মহারাষ্ট্রের সরকারি ভাষা; গোয়াতেও কোঙ্কণির পাশাপাশি সরকারি কাজে এর ব্যবহারের অনুমতি আছে।"
      hi: "मराठी महाराष्ट्र की राजभाषा है, और गोवा में भी कोंकणी के साथ सरकारी कामकाज में इसके प्रयोग की अनुमति है।"
  - id: mr-fact-003
    tags: [history]
    source: "https://en.wikipedia.org/wiki/List_of_languages_by_number_of_native_speakers_in_India"
    text:
      en: "In the 2011 census about 83 million people in India gave Marathi as their mother tongue, the third most after Hindi and Bengali."
      bn: "২০১১ সালের জনগণনায় ভারতে প্রায় ৮ কোটি ৩০ লক্ষ মানুষ মারাঠিকে নিজেদের মাতৃভাষা বলেছেন; সংখ্যার দিক থেকে হিন্দি ও বাংলার পরেই এর স্থান।"
      hi: "2011 की जनगणना में भारत के लगभग 8.3 करोड़ लोगों ने मराठी को अपनी मातृभाषा बताया; संख्या के हिसाब से हिंदी और बांग्ला के बाद इसका तीसरा स्थान है।"
  - id: mr-fact-004
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Classical_languages_of_India"
    text:
      en: "India declared Marathi a classical language in October 2024."
      bn: "২০২৪ সালের অক্টোবরে ভারত মারাঠিকে ধ্রুপদী ভাষার স্বীকৃতি দেয়।"
      hi: "भारत ने अक्टूबर 2024 में मराठी को शास्त्रीय भाषा का दर्जा दिया।"
  - id: mr-fact-005
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Marathi_Language_Day"
    text:
      en: "Marathi Language Day, मराठी भाषा दिन (marāṭhi bhāṣā din), falls on 27 February, the birthday of the poet Kusumagraj (V. V. Shirwadkar)."
      bn: "মারাঠি ভাষা দিবস, मराठी भाषा दिन (marāṭhi bhāṣā din), ২৭ ফেব্রুয়ারি পালিত হয়; এটি কবি কুসুমাগ্রজের (ভি. ভি. শিরওয়াড়কর) জন্মদিন।"
      hi: "मराठी भाषा दिवस, यानी मराठी भाषा दिन, 27 फ़रवरी को मनाया जाता है, जो कवि कुसुमाग्रज (वि. वा. शिरवाडकर) का जन्मदिन है।"
  - id: mr-fact-006
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Maharashtra_Day"
    text:
      en: "The state of Maharashtra was formed on 1 May 1960, when the old Bombay State was divided between its Marathi and Gujarati speakers."
      bn: "১৯৬০ সালের ১ মে মহারাষ্ট্র রাজ্য গঠিত হয়; তখন পুরোনো বোম্বে রাজ্য মারাঠিভাষী ও গুজরাটিভাষী অংশে ভাগ হয়ে যায়।"
      hi: "1 मई 1960 को महाराष्ट्र राज्य बना, जब पुराने बंबई राज्य को मराठी-भाषी और गुजराती-भाषी हिस्सों में बाँट दिया गया।"
  - id: mr-fact-007
    tags: [history, literature]
    source: "https://en.wikipedia.org/wiki/Dnyaneshwari"
    text:
      en: "One of the great early works of Marathi is the ज्ञानेश्वरी (Dnyaneshwari), a commentary in verse on the Bhagavad Gita that the saint Dnyaneshwar completed in 1290."
      bn: "মারাঠির আদি যুগের শ্রেষ্ঠ রচনাগুলির একটি ज्ञानेश्वरी (জ্ঞানেশ্বরী); সন্ত জ্ঞানেশ্বর ১২৯০ সালে ভগবদ্গীতার এই পদ্যে লেখা ভাষ্য শেষ করেন।"
      hi: "मराठी की आरंभिक श्रेष्ठ रचनाओं में से एक ज्ञानेश्वरी है, भगवद्गीता की पद्य में लिखी टीका, जिसे संत ज्ञानेश्वर ने 1290 में पूरा किया।"
  - id: mr-fact-008
    tags: [history, literature]
    source: "https://en.wikipedia.org/wiki/Lilacharitra"
    text:
      en: "लीळाचरित्र (Lilacharitra), written around 1278 by Mhaimbhat about the life of Chakradhar Swami, is often called the first biography in Marathi."
      bn: "আনুমানিক ১২৭৮ সালে মহাইমভট্ট চক্রধর স্বামীর জীবনকথা लीळाचरित्र (লীলাচরিত্র) লেখেন; একে প্রায়ই মারাঠির প্রথম জীবনী বলা হয়।"
      hi: "लगभग 1278 में म्हाइंभट ने चक्रधर स्वामी के जीवन पर लीळाचरित्र लिखा, जिसे अक्सर मराठी की पहली जीवनी माना जाता है।"
  - id: mr-fact-009
    tags: [literature]
    source: "https://en.wikipedia.org/wiki/Tukaram"
    text:
      en: "The abhangs, अभंग (abhaṅg), of the 17th-century saint Tukaram are still sung by the pilgrims who walk to Pandharpur every year on the वारी (vāri)."
      bn: "সতেরো শতকের সন্ত তুকারামের अभंग (abhaṅg) আজও গেয়ে থাকেন সেই তীর্থযাত্রীরা, যাঁরা প্রতি বছর পায়ে হেঁটে পন্ঢরপুর যান; এই পদযাত্রার নাম वारी (vāri)।"
      hi: "17वीं सदी के संत तुकाराम के अभंग आज भी वे तीर्थयात्री गाते हैं जो हर साल पैदल वारी करते हुए पंढरपुर जाते हैं।"
  - id: mr-fact-010
    tags: [script, history]
    source: "https://en.wikipedia.org/wiki/Modi_script"
    text:
      en: "For centuries Marathi letters and records were written in Modi, a fast, flowing script. In the 20th century Devanagari replaced it, and today few people can read it."
      bn: "বহু শতাব্দী ধরে মারাঠি চিঠিপত্র ও নথি লেখা হতো মোডী লিপিতে, যা ছিল দ্রুত লেখার উপযোগী টানা হাতের লিপি। বিশ শতকে দেবনাগরী তার জায়গা নেয়, আর আজ খুব কম মানুষই মোডী পড়তে পারেন।"
      hi: "सदियों तक मराठी के पत्र और दस्तावेज़ मोडी लिपि में लिखे जाते थे, जो तेज़ी से लिखी जाने वाली घुमावदार लिपि थी। 20वीं सदी में देवनागरी ने उसकी जगह ले ली, और आज बहुत कम लोग मोडी पढ़ पाते हैं।"
  - id: mr-fact-011
    tags: [script]
    source: "https://en.wikipedia.org/wiki/Balbodh"
    text:
      en: "The form of Devanagari used for Marathi is called बाळबोध (Balbodh). It has letters Hindi lacks, such as ळ (ḷa), and an eyelash-shaped r, as in दुसऱ्या (dusryā, other)."
      bn: "মারাঠির জন্য ব্যবহৃত দেবনাগরীর রূপটির নাম बाळबोध (বালবোধ)। এতে এমন কিছু অক্ষর আছে যা হিন্দিতে নেই, যেমন ळ (ḷa), আর আছে চোখের পাতার আকারের একটি 'র', যেমন दुसऱ्या (অন্য) শব্দে।"
      hi: "मराठी के लिए प्रयुक्त देवनागरी के रूप को बाळबोध कहते हैं। इसमें कुछ ऐसे अक्षर हैं जो हिंदी में नहीं मिलते, जैसे ळ, और पलक के आकार का एक 'र', जैसे दुसऱ्या (दूसरी) में।"
  - id: mr-fact-012
    tags: [script, pronunciation]
    text:
      en: "ळ (ḷa), an l made with the tongue curled back, appears in many everyday words, such as शाळा (school) and डोळा (eye), and it changes meaning: काल (kāl) is yesterday, काळ (kāḷ) an age."
      bn: "জিভ উল্টে বলা 'ল', ळ (ḷa), রোজকার বহু শব্দে আসে, যেমন शाळा (স্কুল) আর डोळा (চোখ); আর এতে অর্থও বদলে যায়: काल (kāl) মানে গতকাল, काळ (kāḷ) মানে যুগ।"
      hi: "जीभ पीछे मोड़कर बोला जाने वाला ळ रोज़मर्रा के कई शब्दों में आता है, जैसे शाळा (स्कूल) और डोळा (आँख), और इससे अर्थ भी बदल जाता है: काल यानी बीता हुआ कल, काळ यानी युग।"
  - id: mr-fact-013
    tags: [pronunciation, conjuncts]
    text:
      en: "Marathi says the letter ज्ञ (dnya) as 'dny': ज्ञान (dnyān), knowledge, is dnyan, and the saint ज्ञानेश्वर (dnyāneśvar) is Dnyaneshwar."
      bn: "মারাঠিতে ज्ञ (dnya)-র উচ্চারণ 'দ্ন্য': ज्ञान (জ্ঞান) বলা হয় 'দ্ন্যান', আর সন্ত ज्ञानेश्वर (dnyāneśvar)-কে বলা হয় 'দ্ন্যানেশ্বর'।"
      hi: "मराठी में ज्ञ का उच्चारण 'द्न्य' है: ज्ञान को 'द्न्यान' बोला जाता है, और संत ज्ञानेश्वर को 'द्न्यानेश्वर'।"
  - id: mr-fact-014
    tags: [pronunciation]
    text:
      en: "Marathi says the vowel ऋ (ru) as 'ru', where Hindi says 'ri': कृपया (krupayā), please, is krupaya."
      bn: "মারাঠিতে ঋ-এর উচ্চারণ 'রু', আর হিন্দিতে 'রি': कृपया (দয়া করে) মারাঠিতে বলা হয় 'ক্রুপয়া'।"
      hi: "मराठी में ऋ का उच्चारण 'रु' है, जबकि हिंदी में 'रि': कृपया को मराठी में 'क्रुपया' बोला जाता है।"
  - id: mr-fact-015
    tags: [pronunciation]
    text:
      en: "च (ca) and ज (ja) each have two sounds in Marathi: ch and j before i and e, and ts and dz before other vowels in most native words. चहा (cahā), tea, is said tsahaa."
      bn: "মারাঠিতে च (ca) ও ज (ja) দুই রকমে উচ্চারিত হয়: ই ও এ-র আগে 'চ' ও 'জ', আর বেশিরভাগ দেশি শব্দে অন্য স্বরের আগে 'ts' ও 'dz'। যেমন चहा (চা) উচ্চারিত হয় tsahaa।"
      hi: "मराठी में च और ज के दो-दो उच्चारण हैं: इ और ए से पहले 'च' और 'ज', और ज़्यादातर देशी शब्दों में अन्य स्वरों से पहले 'त्स' और 'द्ज़'। चहा (चाय) का उच्चारण 'त्सहा' होता है।"
  - id: mr-fact-016
    tags: [script]
    text:
      en: "Marathi ends a sentence with a full stop, as English does, not with the upright line । that Hindi uses."
      bn: "মারাঠিতে বাক্য শেষ হয় ইংরেজির মতো ফুলস্টপ (.) দিয়ে, হিন্দি বা বাংলার দাঁড়ি । দিয়ে নয়।"
      hi: "मराठी में वाक्य अंग्रेज़ी की तरह पूर्ण विराम बिंदु (.) से समाप्त होता है, हिंदी की खड़ी पाई । से नहीं।"
  - id: mr-fact-017
    tags: [numbers, script]
    text:
      en: "Marathi newspapers and calendars print numbers in Devanagari digits, १ (1), २ (2), ३ (3), far more often than Hindi ones do."
      bn: "মারাঠি সংবাদপত্র ও ক্যালেন্ডারে দেবনাগরী অঙ্কের ব্যবহার, १ (1), २ (2), ३ (3), হিন্দি কাগজের তুলনায় অনেক বেশি।"
      hi: "मराठी अख़बारों और कैलेंडरों में देवनागरी अंक, १, २, ३, हिंदी अख़बारों के मुक़ाबले कहीं ज़्यादा छपते हैं।"
  - id: mr-fact-018
    tags: [grammar]
    text:
      en: "Marathi has three genders, masculine, feminine and neuter. A child, मूल (mul), is neuter, and so is a house, घर (ghar)."
      bn: "মারাঠিতে লিঙ্গ তিনটি: পুংলিঙ্গ, স্ত্রীলিঙ্গ ও ক্লীবলিঙ্গ। শিশু, मूल (mul), ক্লীবলিঙ্গ; বাড়ি, घर (ghar)-ও তাই।"
      hi: "मराठी में तीन लिंग हैं: पुल्लिंग, स्त्रीलिंग और नपुंसकलिंग। बच्चा (मूल) नपुंसकलिंग है, और घर भी।"
  - id: mr-fact-019
    tags: [grammar]
    text:
      en: "Marathi has two words for 'we': आपण (āpaṇ) includes the person you are talking to, and आम्ही (āmhi) leaves them out."
      bn: "'আমরা' বোঝাতে মারাঠিতে দুটি শব্দ: आपण (āpaṇ)-এ শ্রোতাও অন্তর্ভুক্ত, आम्ही (āmhi)-তে নন।"
      hi: "मराठी में 'हम' के लिए दो शब्द हैं: आपण में सुनने वाला भी शामिल होता है, आम्ही में नहीं।"
  - id: mr-fact-020
    tags: [grammar]
    text:
      en: "A Marathi verb can show the speaker's gender even with 'I': a man says मी गेलो (mi gelo), a woman मी गेले (mi gele), both 'I went'."
      bn: "'আমি'-র সঙ্গেও মারাঠি ক্রিয়ায় বক্তার লিঙ্গ ধরা পড়ে: পুরুষ বলেন मी गेलो (mi gelo), নারী বলেন मी गेले (mi gele); দুটোরই অর্থ 'আমি গেলাম'।"
      hi: "मराठी क्रिया 'मैं' के साथ भी बोलने वाले का लिंग दिखाती है: पुरुष कहता है मी गेलो, स्त्री मी गेले; दोनों का अर्थ है 'मैं गया' या 'मैं गई'।"
  - id: mr-fact-021
    tags: [grammar, script]
    text:
      en: "Marathi writes its little words for 'in', 'to' and 'with' joined to the noun: घरात (gharāt) is 'in the house', and आईबरोबर (āibarobar) 'with mother'."
      bn: "মারাঠিতে 'মধ্যে', 'কে' বা 'সঙ্গে'-র মতো ছোট ছোট শব্দ বিশেষ্যের সঙ্গে জুড়ে লেখা হয়: घरात (gharāt) মানে 'বাড়িতে', आईबरोबर (āibarobar) মানে 'মায়ের সঙ্গে'।"
      hi: "मराठी में 'में', 'को' और 'के साथ' जैसे छोटे शब्द संज्ञा के साथ जोड़कर लिखे जाते हैं: घरात यानी 'घर में', आईबरोबर यानी 'माँ के साथ'।"
  - id: mr-fact-022
    tags: [numbers]
    text:
      en: "Every number up to 99 has its own word in Marathi, and the one before each ten starts with एकोण- (ekoṇ-), 'one less': एकोणीस (ekoṇis) is 19, एकोणतीस (ekoṇtis) 29."
      bn: "মারাঠিতে ৯৯ পর্যন্ত প্রতিটি সংখ্যার নিজস্ব শব্দ আছে, আর প্রতিটি দশকের ঠিক আগের সংখ্যা শুরু হয় एकोण- (ekoṇ-) দিয়ে, যার মানে 'এক কম': एकोणीस (ekoṇis) ১৯, एकोणतीस (ekoṇtis) ২৯।"
      hi: "मराठी में 99 तक हर संख्या का अपना शब्द है, और हर दहाई से ठीक पहले की संख्या एकोण- यानी 'एक कम' से शुरू होती है: एकोणीस 19 है, एकोणतीस 29।"
  - id: mr-fact-023
    tags: [numbers]
    text:
      en: "Marathi counts in quarters: सव्वा (savvā) is a quarter more, पावणे (pāvṇe) a quarter less, दीड (diḍ) is 1½ and अडीच (aḍic) 2½. पावणेदोन (pāvṇedon) is 1¾."
      bn: "মারাঠিতে পোয়া ধরে গোনা হয়: सव्वा (savvā) মানে সোয়া, पावणे (pāvṇe) মানে পৌনে, दीड (diḍ) দেড়, अडीच (aḍic) আড়াই। पावणेदोन (pāvṇedon) মানে পৌনে দুই।"
      hi: "मराठी में चौथाई के हिसाब से गिनती होती है: सव्वा यानी सवा, पावणे यानी पौने, दीड यानी डेढ़ और अडीच यानी ढाई। पावणेदोन का अर्थ है पौने दो।"
  - id: mr-fact-024
    tags: [words]
    text:
      en: "Each aunt and uncle has a word of its own: काका (kākā) and आत्या (ātyā) on the father's side, मामा (māmā) and मावशी (māvśi) on the mother's."
      bn: "কাকা, পিসি, মামা, মাসি, প্রত্যেকের জন্য আলাদা শব্দ আছে: বাবার দিকে काका (কাকা) ও आत्या (পিসি), মায়ের দিকে मामा (মামা) ও मावशी (মাসি)।"
      hi: "चाचा, बुआ, मामा और मौसी, हर एक के लिए अलग शब्द है: पिता की ओर से काका (चाचा) और आत्या (बुआ), माँ की ओर से मामा और मावशी (मौसी)।"
  - id: mr-fact-025
    tags: [words]
    text:
      en: "A Marathi full name usually has the father's first name in the middle, or for many married women the husband's: in Sachin Ramesh Tendulkar, Ramesh is his father."
      bn: "মারাঠি পুরো নামের মাঝখানে সাধারণত বাবার নাম থাকে, আর অনেক বিবাহিত মহিলার ক্ষেত্রে স্বামীর নাম: সচিন রমেশ তেন্ডুলকর নামে রমেশ তাঁর বাবার নাম।"
      hi: "मराठी पूरे नाम के बीच में आम तौर पर पिता का नाम आता है, और कई विवाहित स्त्रियों के नाम में पति का: सचिन रमेश तेंदुलकर में रमेश उनके पिता का नाम है।"
  - id: mr-fact-026
    tags: [spelling, history]
    text:
      en: "Older Marathi print wrote many dots it did not say, as in नाहीं (nāhim̐) and तें (tem̐). Spelling rules adopted by the Maharashtra government in the 1960s dropped them: नाही (nāhi), ते (te)."
      bn: "পুরোনো মারাঠি ছাপায় এমন অনেক অনুস্বার লেখা হতো যা উচ্চারিত হতো না, যেমন नाहीं (nāhim̐), तें (tem̐)। ১৯৬০-এর দশকে মহারাষ্ট্র সরকারের গৃহীত বানানবিধি সেগুলো তুলে দেয়: नाही (nāhi), ते (te)।"
      hi: "पुरानी मराठी छपाई में कई ऐसे अनुस्वार लिखे जाते थे जिनका उच्चारण नहीं होता था, जैसे नाहीं, तें। 1960 के दशक में महाराष्ट्र सरकार द्वारा अपनाए गए वर्तनी-नियमों ने उन्हें हटा दिया: नाही, ते।"
  - id: mr-fact-027
    tags: [words, history]
    text:
      en: "Portuguese traders left words in Marathi: पाव (bread) from pão, बटाटा (potato) from batata, and पगार (salary) from pagar, to pay."
      bn: "পর্তুগিজ বণিকেরা মারাঠিতে কয়েকটি শব্দ রেখে গেছেন: पाव (পাউরুটি) এসেছে pão থেকে, बटाटा (আলু) batata থেকে, আর पगार (বেতন) pagar, অর্থাৎ 'দাম মেটানো', থেকে।"
      hi: "पुर्तगाली व्यापारी मराठी में कुछ शब्द छोड़ गए: पाव (ब्रेड) pão से, बटाटा (आलू) batata से, और पगार (तनख़्वाह) pagar यानी 'भुगतान करना' से।"
  - id: mr-fact-028
    tags: [words, history]
    text:
      en: "Centuries of Persian-speaking courts in the Deccan gave Marathi many everyday words, such as कागद (kāgad, paper) and बाजार (bājār, market)."
      bn: "দাক্ষিণাত্যের ফারসিভাষী দরবারগুলির কয়েক শতাব্দীর প্রভাবে মারাঠি রোজকার বহু শব্দ পেয়েছে, যেমন कागद (কাগজ) আর बाजार (বাজার)।"
      hi: "दक्कन के फ़ारसी-भाषी दरबारों की सदियों की छाप से मराठी को रोज़मर्रा के कई शब्द मिले, जैसे कागद (काग़ज़) और बाजार (बाज़ार)।"
  - id: mr-fact-029
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Marathi_theatre"
    text:
      en: "Modern Marathi theatre is usually dated to 1843, when Vishnudas Bhave staged सीता स्वयंवर (Sita Swayamvar) in Sangli."
      bn: "আধুনিক মারাঠি নাটকের সূচনা সাধারণত ১৮৪৩ সাল থেকে ধরা হয়, যখন বিষ্ণুদাস ভাবে সাংলিতে सीता स्वयंवर (সীতা স্বয়ংবর) মঞ্চস্থ করেন।"
      hi: "आधुनिक मराठी रंगमंच की शुरुआत आम तौर पर 1843 से मानी जाती है, जब विष्णुदास भावे ने सांगली में सीता स्वयंवर का मंचन किया।"
  - id: mr-fact-030
    tags: [literature]
    source: "https://en.wikipedia.org/wiki/Jnanpith_Award"
    text:
      en: "Four Marathi writers have won the Jnanpith, India's highest literary award: V. S. Khandekar, Kusumagraj, Vinda Karandikar and Bhalchandra Nemade."
      bn: "ভারতের সর্বোচ্চ সাহিত্য সম্মান জ্ঞানপীঠ পেয়েছেন চারজন মারাঠি লেখক: ভি. এস. খাণ্ডেকর, কুসুমাগ্রজ, বিন্দা করন্দীকর ও ভালচন্দ্র নেমাড়ে।"
      hi: "भारत का सर्वोच्च साहित्य सम्मान ज्ञानपीठ चार मराठी लेखकों को मिला है: वि. स. खांडेकर, कुसुमाग्रज, विंदा करंदीकर और भालचंद्र नेमाडे।"
  - id: mr-fact-031
    tags: [literature, history]
    source: "https://en.wikipedia.org/wiki/Akhil_Bharatiya_Marathi_Sahitya_Sammelan"
    text:
      en: "The Akhil Bharatiya Marathi Sahitya Sammelan, a yearly gathering of Marathi writers and readers, was first held in Pune in 1878."
      bn: "মারাঠি লেখক ও পাঠকদের বার্ষিক মিলনমেলা অখিল ভারতীয় মারাঠি সাহিত্য সম্মেলন প্রথম অনুষ্ঠিত হয় ১৮৭৮ সালে, পুণেতে।"
      hi: "मराठी लेखकों और पाठकों का वार्षिक समागम, अखिल भारतीय मराठी साहित्य सम्मेलन, पहली बार 1878 में पुणे में हुआ।"
  - id: mr-fact-032
    tags: [words]
    text:
      en: "Marathi changes across the state: वऱ्हाडी (Varhadi) in Vidarbha, अहिराणी (Ahirani) in Khandesh and मालवणी (Malvani) on the southern Konkan coast are some of its spoken forms. The written standard is close to the speech of Pune."
      bn: "রাজ্যের নানা অঞ্চলে মারাঠি নানা রূপ নেয়: বিদর্ভে वऱ्हाडी (বরহাডী), খান্দেশে अहिराणी (অহিরাণী), দক্ষিণ কোঙ্কণ উপকূলে मालवणी (মালবণী) তার কয়েকটি কথ্য রূপ। লিখিত মান-ভাষা পুণের কথ্য ভাষার কাছাকাছি।"
      hi: "पूरे राज्य में मराठी के रूप बदलते हैं: विदर्भ में वऱ्हाडी, ख़ानदेश में अहिराणी और दक्षिणी कोंकण तट पर मालवणी उसकी कुछ बोलियाँ हैं। लिखित मानक भाषा पुणे की बोली के क़रीब है।"
  - id: mr-fact-033
    tags: [script, words]
    text:
      en: "Marathi added two vowel letters for English words, ॲ (ê) for the a of 'bat' and ऑ (ô) for the o of 'hot': बॅग (bêg) is a bag, and ऑफिस (ôfis) an office."
      bn: "ইংরেজি শব্দের জন্য মারাঠি দুটি স্বরবর্ণ জুড়েছে: 'bat'-এর a-র জন্য ॲ (ê), আর 'hot'-এর o-র জন্য ऑ (ô): बॅग (bêg) মানে ব্যাগ, ऑफिस (ôfis) মানে অফিস।"
      hi: "अंग्रेज़ी शब्दों के लिए मराठी ने दो स्वर जोड़े हैं: 'bat' के a के लिए ॲ और 'hot' के o के लिए ऑ: बॅग यानी बैग, ऑफिस यानी दफ़्तर।"
  - id: mr-fact-034
    tags: [words, history]
    source: "https://en.wikipedia.org/wiki/Mumbadevi_Temple"
    text:
      en: "Mumbai, मुंबई (mumbai), is named after the goddess Mumbadevi. The city's official English name changed from Bombay in 1995."
      bn: "মুম্বাই, मुंबई (mumbai), নামটি এসেছে দেবী মুম্বাদেবীর নাম থেকে। শহরের সরকারি ইংরেজি নাম বম্বে থেকে বদলে যায় ১৯৯৫ সালে।"
      hi: "मुंबई का नाम देवी मुंबादेवी के नाम पर पड़ा है। शहर का आधिकारिक अंग्रेज़ी नाम 1995 में बॉम्बे से बदला गया।"
  - id: mr-fact-035
    tags: [grammar]
    text:
      en: "Marathi turns 'I like' around: मला चहा आवडतो (malā cahā āvaḍto) is 'to me tea is pleasing', and the verb agrees with the tea."
      bn: "মারাঠি 'আমার ভালো লাগে'-র ধাঁচে বলে: मला चहा आवडतो (malā cahā āvaḍto) মানে 'আমার চা ভালো লাগে', আর ক্রিয়াটি মেলে চায়ের সঙ্গে।"
      hi: "मराठी 'मुझे पसंद है' के ढाँचे में बोलती है: मला चहा आवडतो यानी 'मुझे चाय पसंद है', और क्रिया चाय के अनुसार बदलती है।"
  - id: mr-fact-101
    contrast: en
    tags: [pronunciation]
    text:
      en: "English has one l; Marathi has two. For ळ (ḷa), curl the tongue tip back as for an American r and say l: काळ (kāḷ), an age, against काल (kāl), yesterday."
  - id: mr-fact-102
    contrast: en
    tags: [grammar]
    text:
      en: "English puts 'in', 'to' and 'from' before a noun; Marathi adds them to its end, and writes them joined: घरात (gharāt), 'house-in', is 'in the house'."
  - id: mr-fact-103
    contrast: en
    tags: [grammar, pitfall]
    text:
      en: "English has one 'we'. Marathi has two, so 'shall we go?' to a friend who is coming with you is आपण जाऊया (āpaṇ jāuyā)?, not आम्ही (āmhi)."
  - id: mr-fact-104
    contrast: hi
    tags: [words, pitfall]
    text:
      en: "Hindi कल (kal) is both yesterday and tomorrow; Marathi has काल (kāl) for yesterday and उद्या (udyā) for tomorrow."
      hi: "हिंदी में 'कल' का अर्थ बीता हुआ और आने वाला, दोनों होता है; मराठी में बीता हुआ कल काल है और आने वाला कल उद्या।"
  - id: mr-fact-105
    contrast: hi
    tags: [grammar]
    text:
      en: "Hindi has two genders; Marathi has a third, neuter: घर (ghar), a house, is neuter, and so is मूल (mul), a child."
      hi: "हिंदी में दो लिंग हैं; मराठी में एक तीसरा, नपुंसकलिंग, भी है: घर नपुंसकलिंग है, और मूल (बच्चा) भी।"
  - id: mr-fact-106
    contrast: hi
    tags: [grammar, script]
    text:
      en: "Hindi writes its postpositions apart, घर में (ghar mem̐); Marathi joins them to the noun, घरात (gharāt)."
      hi: "हिंदी परसर्गों को अलग लिखती है, जैसे घर में; मराठी उन्हें संज्ञा से जोड़कर लिखती है, जैसे घरात।"
  - id: mr-fact-107
    contrast: bn
    tags: [grammar]
    text:
      en: "Bengali has no grammatical gender, but Marathi has three, and even 'I' shows it in the verb: a man says मी गेलो (mi gelo), a woman मी गेले (mi gele)."
      bn: "বাংলায় ব্যাকরণগত লিঙ্গ নেই, কিন্তু মারাঠিতে তিনটি, আর 'আমি'-র ক্রিয়াতেও তা ধরা পড়ে: পুরুষ বলেন मी गेलो (mi gelo), নারী বলেন मी गेले (mi gele)।"
  - id: mr-fact-108
    contrast: bn
    tags: [pronunciation]
    text:
      en: "Bengali says its inherent vowel as an o; Marathi says it like the u of 'but', and drops it at the end of most words: कमळ (kamaḷ) is kamal, not komol."
      bn: "বাংলায় অন্তর্নিহিত 'অ' ও-ঘেঁষা উচ্চারিত হয়; মারাঠিতে তা ইংরেজি 'but'-এর u-র মতো, আর বেশিরভাগ শব্দের শেষে বাদ পড়ে যায়: कमळ (kamaḷ) বলা হয় kamal, komol নয়।"
