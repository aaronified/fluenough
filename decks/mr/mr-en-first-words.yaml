schema: 1
id: mr-en-first-words
name: "First words"
kind: vocab
theme: first-words
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Greetings, the respect Marathi builds into them, and how to say you are still learning. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0144
    target: "नमस्कार"
    native: "hello; goodbye"
    reading: "namaskaar"
    pos: "other"
    tags: ["greeting"]
    notes: "Said with palms pressed together, to anyone, at any time of day. Also नमस्ते (namaste)."
  - id: mr-0145
    target: "तुम्ही"
    native: "you (respectful); you (plural)"
    reading: "tumhii"
    pos: "other"
    tags: ["honorific"]
    notes: "Marathi has two words for 'you': तुम्ही for strangers, elders and anyone you respect, and तू (tuu) for friends, children and the very close. The verb changes with each. A learner is always safe with तुम्ही."
  - id: mr-0146
    target: "कसे आहात?"
    native: "How are you? (respectful)"
    reading: "kase aahaat?"
    pos: "phrase"
    tags: ["greeting"]
    notes: "To a friend: कसा आहेस? (kasaa aahes?) to a man, कशी आहेस? (kashii aahes?) to a woman."
  - id: mr-0147
    target: "मी ठीक आहे."
    native: "I'm fine."
    reading: "mii thiik aahe."
    pos: "phrase"
    tags: ["greeting"]
    notes: "Also मी बरा आहे (mii baraa aahe) from a man, मी बरी आहे (mii barii aahe) from a woman."
  - id: mr-0148
    target: "धन्यवाद"
    native: "thank you"
    reading: "dhanyavaad"
    pos: "other"
    tags: ["polite"]
    notes: "Formal. Many people simply say थँक्यू (thaenkyuu), and among family thanks are often left out."
  - id: mr-0149
    target: "आभारी आहे."
    native: "Thank you; I'm grateful."
    reading: "aabhaarii aahe."
    pos: "phrase"
    tags: ["polite"]
    notes: "Warmer than धन्यवाद: मी तुमचा आभारी आहे (mii tumchaa aabhaarii aahe), I'm grateful to you; a woman says आभारी too."
  - id: mr-0150
    target: "ठीक आहे"
    native: "OK; all right"
    reading: "thiik aahe"
    pos: "phrase"
    notes: "In speech also बरं (baran): बरं, येतो (baran, yeto), all right, I'll be off."
  - id: mr-0151
    target: "येतो"
    native: "goodbye (said by a man leaving)"
    reading: "yeto"
    alt_target: ["येते"]
    pos: "other"
    tags: ["greeting"]
    notes: "Literally 'I come': the one leaving says 'I'll come back'. A woman says येते (yete). A plain जातो, 'I go', can sound final."
  - id: mr-0152
    target: "मला मराठी येत नाही."
    native: "I don't know Marathi."
    reading: "malaa maraathii yet naahii."
    pos: "phrase"
    notes: "Literally 'Marathi does not come to me'."
  - id: mr-0153
    target: "मी अजून मराठी शिकत आहे."
    native: "I'm still learning Marathi."
    reading: "mii ajuun maraathii shikat aahe."
    pos: "phrase"
  - id: mr-0154
    target: "जरा हळू बोला."
    native: "Please speak slowly."
    reading: "jaraa haluu bolaa."
    pos: "phrase"
    tags: ["polite"]
    notes: "जरा, 'a little', softens a request, and the ending -आ makes it polite: बसा (basaa), please sit."
  - id: mr-0155
    target: "पुन्हा सांगा."
    native: "Please say that again."
    reading: "punhaa saangaa."
    pos: "phrase"
    tags: ["polite"]
  - id: mr-0156
    target: "माफ करा."
    native: "Sorry; excuse me."
    reading: "maaph karaa."
    pos: "phrase"
    tags: ["polite"]
    notes: "Literally 'please forgive'. Also सॉरी (sorii), from English."
  - id: mr-0157
    target: "कृपया"
    native: "please"
    reading: "krupayaa"
    pos: "other"
    tags: ["polite"]
    notes: "Formal and written, on signs and in letters. In speech the polite ending of the verb does the work: पाणी द्या (paanii dyaa), some water, please."
