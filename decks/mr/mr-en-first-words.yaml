schema: 1
id: mr-en-first-words
name: "First words"
kind: vocab
theme: first-words
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Greetings, the respect Marathi builds into them, and how to say you are still learning. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0144
    target: "नमस्कार"
    native: "hello; goodbye"
    reading: "namaskār"
    ipa: "nəməskar"
    pos: "other"
    tags: ["greeting"]
    notes: "Said with palms pressed together, to anyone, at any time of day. Also नमस्ते (namaste)."
  - id: mr-0145
    target: "तुम्ही"
    native: "you (respectful); you (plural)"
    reading: "tumhi"
    ipa: "t̪umɦi"
    pos: "other"
    tags: ["honorific"]
    notes: "Marathi has two words for 'you': तुम्ही for strangers, elders and anyone you respect, and तू (tu) for friends, children and the very close. The verb changes with each. A learner is always safe with तुम्ही."
  - id: mr-0146
    target: "कसे आहात?"
    native: "How are you? (respectful)"
    reading: "kase āhāt?"
    ipa: "kəse aɦat̪"
    pos: "phrase"
    tags: ["greeting"]
    notes: "To a friend: कसा आहेस? (kasa ahes?) to a man, कशी आहेस? (kashi ahes?) to a woman."
  - id: mr-0147
    target: "मी ठीक आहे."
    native: "I'm fine."
    reading: "mi ṭhik āhe."
    ipa: "mi ʈʰik aɦe"
    pos: "phrase"
    tags: ["greeting"]
    notes: "Also मी बरा आहे (mi barā āhe) from a man, मी बरी आहे (mi bari āhe) from a woman."
  - id: mr-0148
    target: "धन्यवाद"
    native: "thank you"
    reading: "dhanyavād"
    ipa: "d̪ʱənjəʋad̪"
    pos: "other"
    tags: ["polite"]
    notes: "Formal. Many people simply say थँक्यू (tham̐kyu), and among family thanks are often left out."
  - id: mr-0149
    target: "आभारी आहे."
    native: "Thank you; I'm grateful."
    reading: "ābhāri āhe."
    ipa: "abʱari aɦe"
    pos: "phrase"
    tags: ["polite"]
    notes: "Warmer than धन्यवाद: मी तुमचा आभारी आहे (mi tumcā ābhāri āhe), I'm grateful to you; a woman says आभारी too."
  - id: mr-0150
    target: "ठीक आहे"
    native: "OK; all right"
    reading: "ṭhik āhe"
    ipa: "ʈʰik aɦe"
    pos: "phrase"
    notes: "In speech also बरं (baram̐): बरं, येतो (bara, yeto), all right, I'll be off."
  - id: mr-0151
    target: "येतो"
    native: "goodbye (said by a man leaving)"
    reading: "yeto"
    ipa: "jet̪o"
    alt_target: ["येते"]
    pos: "other"
    tags: ["greeting"]
    notes: "Literally 'I come': the one leaving says 'I'll come back'. A woman says येते (yete). A plain जातो, 'I go', can sound final."
  - id: mr-0152
    target: "मला मराठी येत नाही."
    native: "I don't know Marathi."
    reading: "malā marāṭhi yet nāhi."
    ipa: "məla məraʈʰi jet̪ naɦi"
    pos: "phrase"
    notes: "Literally 'Marathi does not come to me'."
  - id: mr-0153
    target: "मी अजून मराठी शिकत आहे."
    native: "I'm still learning Marathi."
    reading: "mi ajun marāṭhi śikat āhe."
    ipa: "mi ədzun məraʈʰi ʃikət̪ aɦe"
    pos: "phrase"
  - id: mr-0154
    target: "जरा हळू बोला."
    native: "Please speak slowly."
    reading: "jarā haḷu bolā."
    ipa: "dzəra ɦəɭu bola"
    pos: "phrase"
    tags: ["polite"]
    notes: "जरा, 'a little', softens a request, and the ending -आ makes it polite: बसा (basā), please sit."
  - id: mr-0155
    target: "पुन्हा सांगा."
    native: "Please say that again."
    reading: "punhā sāṅgā."
    ipa: "punɦa saŋɡa"
    pos: "phrase"
    tags: ["polite"]
  - id: mr-0156
    target: "माफ करा."
    native: "Sorry; excuse me."
    reading: "māf karā."
    ipa: "maf kəra"
    pos: "phrase"
    tags: ["polite"]
    notes: "Literally 'please forgive'. Also सॉरी (sôri), from English."
  - id: mr-0157
    target: "कृपया"
    native: "please"
    reading: "krupayā"
    ipa: "krupəja"
    pos: "other"
    tags: ["polite"]
    notes: "Formal and written, on signs and in letters. In speech the polite ending of the verb does the work: पाणी द्या (pāṇi dyā), some water, please."
