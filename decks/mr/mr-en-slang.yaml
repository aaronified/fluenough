schema: 1
id: mr-en-slang
name: "Slang"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Everyday slang, much of it from Mumbai and Pune: what friends say that a textbook doesn't. Not yet checked by a Marathi speaker: please report any mistake."
tags: [slang, unreviewed]
cards:
  - id: mr-0626
    target: "भारी"
    native: "great; awesome"
    reading: "bhāri"
    ipa: "bʱari"
    pos: "adj"
    notes: "Literally 'heavy': भारी पिक्चर, a great film. लय भारी!, brilliant!"
  - id: mr-0627
    target: "लय"
    native: "very; a lot (slang)"
    reading: "lay"
    ipa: "ləj"
    pos: "adv"
    notes: "Country speech for खूप, now everyone's slang: लय भारी, लय दमलो (lay damlo), I'm dead tired."
  - id: mr-0628
    target: "झक्कास"
    native: "fantastic; superb"
    reading: "jhakkās"
    ipa: "dzʱəkkas"
    pos: "adj"
    notes: "Mumbai slang, known all over India from films."
  - id: mr-0629
    target: "राडा"
    native: "a big fight; a mess"
    reading: "rāḍā"
    ipa: "raɖa"
    pos: "noun"
    gender: "m"
    notes: "तिथे राडा झाला (tithe rāḍā jhālā), there was a huge row there."
  - id: mr-0630
    target: "पोरगा"
    native: "lad; boy (casual)"
    reading: "porgā"
    ipa: "porɡa"
    pos: "noun"
    gender: "m"
    notes: "Casual for मुलगा. A girl is a पोरगी (porgi), and kids are पोरं (poram̐)."
  - id: mr-0631
    target: "यार"
    native: "mate; man"
    reading: "yār"
    ipa: "jar"
    pos: "noun"
    gender: "m"
    notes: "From Persian, shared with Hindi: काय यार!, oh, come on, man!"
  - id: mr-0632
    target: "भावा"
    native: "bro"
    reading: "bhāvā"
    ipa: "bʱaʋa"
    pos: "noun"
    gender: "m"
    notes: "भाऊ, brother, called out: भावा, कुठे आहेस? (bhava, kuthe ahes?), bro, where are you?"
  - id: mr-0633
    target: "काय रे?"
    native: "What's up? (to a guy)"
    reading: "kāy re?"
    ipa: "kaj re"
    pos: "phrase"
    notes: "रे softens a question to a man or a boy you know well; to a woman, गं: काय गं? (kay ga?)."
  - id: mr-0634
    target: "चल, निघतो."
    native: "Right, I'm off. (a man speaking)"
    reading: "cal, nighto."
    ipa: "tsəl niɡʱt̪o"
    alt_target: ["चल, निघते."]
    pos: "phrase"
    notes: "निघणे, to set off. A woman says निघते."
  - id: mr-0635
    target: "खतरनाक"
    native: "amazing (literally 'dangerous')"
    reading: "khatarnāk"
    ipa: "kʰət̪ərnak"
    pos: "adj"
    notes: "Praise, said with a grin: खतरनाक बॅटिंग, amazing batting."
  - id: mr-0636
    target: "टाईमपास"
    native: "killing time; a pastime"
    reading: "ṭāimpās"
    ipa: "ʈaimpas"
    pos: "noun"
    gender: "m"
    notes: "From English 'time pass': नुसता टाईमपास (nustā ṭāimpās), just killing time."
  - id: mr-0637
    target: "बिनधास्त"
    native: "carefree; go ahead, don't worry"
    reading: "bindhāst"
    ipa: "bind̪ʱast̪"
    pos: "adj"
    notes: "'Without fear': बिनधास्त जा, go ahead, no worries. Hindi speakers have borrowed it."
  - id: mr-0638
    target: "वाट लागली."
    native: "We're done for; it's ruined."
    reading: "vāṭ lāgli."
    ipa: "ʋaʈ laɡli"
    pos: "phrase"
    notes: "माझी वाट लागली (mājhi vāṭ lāgli), I'm finished. वाट is 'way'."
