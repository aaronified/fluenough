schema: 1
id: mr-en-slang
name: "Slang"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Everyday slang, much of it from Mumbai and Pune: what friends say that a textbook doesn't. Not yet checked by a Marathi speaker: please report any mistake."
tags: [slang, unreviewed]
cards:
  - id: mr-0626
    target: "भारी"
    native: "great; awesome"
    reading: "bhaarii"
    pos: "adj"
    notes: "Literally 'heavy': भारी पिक्चर, a great film. लय भारी!, brilliant!"
  - id: mr-0627
    target: "लय"
    native: "very; a lot (slang)"
    reading: "lay"
    pos: "adv"
    notes: "Country speech for खूप, now everyone's slang: लय भारी, लय दमलो (lay damlo), I'm dead tired."
  - id: mr-0628
    target: "झक्कास"
    native: "fantastic; superb"
    reading: "jhakkaas"
    pos: "adj"
    notes: "Mumbai slang, known all over India from films."
  - id: mr-0629
    target: "राडा"
    native: "a big fight; a mess"
    reading: "raadaa"
    pos: "noun"
    gender: "m"
    notes: "तिथे राडा झाला (tithe raadaa jhaalaa), there was a huge row there."
  - id: mr-0630
    target: "पोरगा"
    native: "lad; boy (casual)"
    reading: "porgaa"
    pos: "noun"
    gender: "m"
    notes: "Casual for मुलगा. A girl is a पोरगी (porgii), and kids are पोरं (poran)."
  - id: mr-0631
    target: "यार"
    native: "mate; man"
    reading: "yaar"
    pos: "noun"
    gender: "m"
    notes: "From Persian, shared with Hindi: काय यार!, oh, come on, man!"
  - id: mr-0632
    target: "भावा"
    native: "bro"
    reading: "bhaavaa"
    pos: "noun"
    gender: "m"
    notes: "भाऊ, brother, called out: भावा, कुठे आहेस? (bhaavaa, kuthe aahes?), bro, where are you?"
  - id: mr-0633
    target: "काय रे?"
    native: "What's up? (to a guy)"
    reading: "kaay re?"
    pos: "phrase"
    notes: "रे softens a question to a man or a boy you know well; to a woman, गं: काय गं? (kaay gan?)."
  - id: mr-0634
    target: "चल, निघतो."
    native: "Right, I'm off. (a man speaking)"
    reading: "chal, nighto."
    alt_target: ["चल, निघते."]
    pos: "phrase"
    notes: "निघणे, to set off. A woman says निघते."
  - id: mr-0635
    target: "खतरनाक"
    native: "amazing (literally 'dangerous')"
    reading: "khatarnaak"
    pos: "adj"
    notes: "Praise, said with a grin: खतरनाक बॅटिंग, amazing batting."
  - id: mr-0636
    target: "टाईमपास"
    native: "killing time; a pastime"
    reading: "taaiimpaas"
    pos: "noun"
    gender: "m"
    notes: "From English 'time pass': नुसता टाईमपास (nustaa taaiimpaas), just killing time."
  - id: mr-0637
    target: "बिनधास्त"
    native: "carefree; go ahead, don't worry"
    reading: "bindhaast"
    pos: "adj"
    notes: "'Without fear': बिनधास्त जा, go ahead, no worries. Hindi speakers have borrowed it."
  - id: mr-0638
    target: "वाट लागली."
    native: "We're done for; it's ruined."
    reading: "vaat laaglii."
    pos: "phrase"
    notes: "माझी वाट लागली (maajhii vaat laaglii), I'm finished. वाट is 'way'."
