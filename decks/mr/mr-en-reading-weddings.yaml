  "sentences":
  - "text": "आमच्या घरी विवाह समारंभ आहे."
    "reading": "āmacyā ghari vivāh samārambh āhe."
    "ipa": "amətʃja ɡʱəri ʋiʋaɦ səmarəmbʱ aɦe"
  - "text": "समारंभ पुढच्या महिन्यात आहे."
    "reading": "samārambh puḍhacyā mahinyāt āhe."
    "ipa": "səmarəmbʱ puɖʱətʃja məɦinjat̪ aɦe"
  - "text": "समारंभ सायंकाळी सहा वाजता सुरू होईल."
    "reading": "samārambh sāyaṅkāḷi sahā vājtā suru hoil."
    "ipa": "səmarəmbʱ sajəŋkaɭi səɦa ʋadzt̪a suru ɦoil"
  - "text": "कृपया या आणि आशीर्वाद द्या."
    "reading": "krupyā yā āṇi āśirvād dyā."
    "ipa": "krupja ja aɳi aʃirʋad̪ d̪ja"
