schema: 1
id: mr-en-grammar-demonstratives
name: "This and that"
kind: grammar
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "हा and तो, in three genders, and the words built on इ- and ति-: here, this way, like this, so much. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Near and far"
  slot_name: "near or far"
  slots: ["near: हा, इ-", "far: तो, ति-"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "'This' is हा, ही or हे, 'that' is तो, ती or ते, agreeing with the noun: हा मुलगा, this boy; ही मुलगी, this girl; हे घर, this house. They are also 'he', 'she' and 'it'. Most of the other words for near things start with इ-, and for far ones with ति-. The older इथे and तिथे are also written येथे and तेथे."
  entries:
    - lemma: "this, that (masculine)"
      key: masc
      gloss: "a man, or a masculine noun"
      forms:
        "near: हा, इ-": "हा"
        "far: तो, ति-": "तो"
      readings:
        "near: हा, इ-": "ha"
        "far: तो, ति-": "to"
    - lemma: "this, that (feminine)"
      key: fem
      gloss: "a woman, or a feminine noun"
      forms:
        "near: हा, इ-": "ही"
        "far: तो, ति-": "ती"
      readings:
        "near: हा, इ-": "hi"
        "far: तो, ति-": "ti"
    - lemma: "this, that (neuter)"
      key: neut
      gloss: "a neuter noun; these, those (masculine)"
      forms:
        "near: हा, इ-": "हे"
        "far: तो, ति-": "ते"
      readings:
        "near: हा, इ-": "he"
        "far: तो, ति-": "te"
    - lemma: "these, those (feminine)"
      key: fem-pl
      gloss: "women, or feminine nouns"
      forms:
        "near: हा, इ-": ["या", "ह्या"]
        "far: तो, ति-": "त्या"
      readings:
        "near: हा, इ-": ["ya", "hya"]
        "far: तो, ति-": "tya"
    - lemma: "here, there"
      key: place
      gloss: "at a place"
      forms:
        "near: हा, इ-": ["इथे", "येथे"]
        "far: तो, ति-": ["तिथे", "तेथे"]
      readings:
        "near: हा, इ-": ["ithe", "yethe"]
        "far: तो, ति-": ["tithe", "tethe"]
    - lemma: "this way, that way"
      key: way
      gloss: "towards a place"
      forms:
        "near: हा, इ-": "इकडे"
        "far: तो, ति-": "तिकडे"
      readings:
        "near: हा, इ-": "ikde"
        "far: तो, ति-": "tikde"
    - lemma: "like this, like that"
      key: manner
      gloss: "in this way"
      forms:
        "near: हा, इ-": ["असे", "असं"]
        "far: तो, ति-": ["तसे", "तसं"]
      readings:
        "near: हा, इ-": ["ase", "asa"]
        "far: तो, ति-": ["tase", "tasa"]
    - lemma: "this much, that much"
      key: amount
      gloss: "so much"
      forms:
        "near: हा, इ-": ["इतके", "इतका", "इतकी"]
        "far: तो, ति-": ["तितके", "तितका", "तितकी"]
      readings:
        "near: हा, इ-": ["itke", "itka", "itki"]
        "far: तो, ति-": ["titke", "titka", "titki"]
