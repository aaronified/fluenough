schema: 1
id: mr-en-grammar-demonstratives
name: "This and that"
kind: grammar
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "हा (hā) and तो (to), in three genders, and the words built on इ- (i-) and ति- (ti-): here, this way, like this, so much. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Near and far"
  slot_name: "near or far"
  slots: ["near: हा (hā), इ- (i-)", "far: तो (to), ति- (ti-)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "'This' is हा (hā), ही (hi) or हे (he), 'that' is तो (to), ती (ti) or ते (te), agreeing with the noun: हा मुलगा (hā mulgā), this boy; ही मुलगी (hi mulgi), this girl; हे घर (he ghar), this house. They are also 'he', 'she' and 'it'. Most of the other words for near things start with इ- (i-), and for far ones with ति- (ti-). The older इथे (ithe) and तिथे (tithe) are also written येथे (yethe) and तेथे (tethe)."
  entries:
    - lemma: "this, that (masculine)"
      key: masc
      gloss: "a man, or a masculine noun"
      forms:
        "near: हा (hā), इ- (i-)": "हा"
        "far: तो (to), ति- (ti-)": "तो"
      readings:
        "near: हा (hā), इ- (i-)": "hā"
        "far: तो (to), ति- (ti-)": "to"
      ipas:
        "near: हा (hā), इ- (i-)": "ɦa"
        "far: तो (to), ति- (ti-)": "t̪o"
    - lemma: "this, that (feminine)"
      key: fem
      gloss: "a woman, or a feminine noun"
      forms:
        "near: हा (hā), इ- (i-)": "ही"
        "far: तो (to), ति- (ti-)": "ती"
      readings:
        "near: हा (hā), इ- (i-)": "hi"
        "far: तो (to), ति- (ti-)": "ti"
      ipas:
        "near: हा (hā), इ- (i-)": "ɦi"
        "far: तो (to), ति- (ti-)": "t̪i"
    - lemma: "this, that (neuter)"
      key: neut
      gloss: "a neuter noun; these, those (masculine)"
      forms:
        "near: हा (hā), इ- (i-)": "हे"
        "far: तो (to), ति- (ti-)": "ते"
      readings:
        "near: हा (hā), इ- (i-)": "he"
        "far: तो (to), ति- (ti-)": "te"
      ipas:
        "near: हा (hā), इ- (i-)": "ɦe"
        "far: तो (to), ति- (ti-)": "t̪e"
    - lemma: "these, those (feminine)"
      key: fem-pl
      gloss: "women, or feminine nouns"
      forms:
        "near: हा (hā), इ- (i-)": ["या", "ह्या"]
        "far: तो (to), ति- (ti-)": "त्या"
      readings:
        "near: हा (hā), इ- (i-)": ["yā", "hyā"]
        "far: तो (to), ति- (ti-)": "tyā"
      ipas:
        "near: हा (hā), इ- (i-)": "ja"
        "far: तो (to), ति- (ti-)": "t̪ja"
    - lemma: "here, there"
      key: place
      gloss: "at a place"
      forms:
        "near: हा (hā), इ- (i-)": ["इथे", "येथे"]
        "far: तो (to), ति- (ti-)": ["तिथे", "तेथे"]
      readings:
        "near: हा (hā), इ- (i-)": ["ithe", "yethe"]
        "far: तो (to), ति- (ti-)": ["tithe", "tethe"]
      ipas:
        "near: हा (hā), इ- (i-)": "it̪ʰe"
        "far: तो (to), ति- (ti-)": "t̪it̪ʰe"
    - lemma: "this way, that way"
      key: way
      gloss: "towards a place"
      forms:
        "near: हा (hā), इ- (i-)": "इकडे"
        "far: तो (to), ति- (ti-)": "तिकडे"
      readings:
        "near: हा (hā), इ- (i-)": "ikḍe"
        "far: तो (to), ति- (ti-)": "tikḍe"
      ipas:
        "near: हा (hā), इ- (i-)": "ikɖe"
        "far: तो (to), ति- (ti-)": "t̪ikɖe"
    - lemma: "like this, like that"
      key: manner
      gloss: "in this way"
      forms:
        "near: हा (hā), इ- (i-)": ["असे", "असं"]
        "far: तो (to), ति- (ti-)": ["तसे", "तसं"]
      readings:
        "near: हा (hā), इ- (i-)": ["ase", "asam̐"]
        "far: तो (to), ति- (ti-)": ["tase", "tasam̐"]
      ipas:
        "near: हा (hā), इ- (i-)": "əse"
        "far: तो (to), ति- (ti-)": "t̪əse"
    - lemma: "this much, that much"
      key: amount
      gloss: "so much"
      forms:
        "near: हा (hā), इ- (i-)": ["इतके", "इतका", "इतकी"]
        "far: तो (to), ति- (ti-)": ["तितके", "तितका", "तितकी"]
      readings:
        "near: हा (hā), इ- (i-)": ["itke", "itkā", "itki"]
        "far: तो (to), ति- (ti-)": ["titke", "titkā", "titki"]
      ipas:
        "near: हा (hā), इ- (i-)": "it̪ke"
        "far: तो (to), ति- (ti-)": "t̪it̪ke"
