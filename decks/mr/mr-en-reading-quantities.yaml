  "sentences":
  - "text": "ही पाककृती चार माणसांसाठी आहे."
    "reading": "hi pākkruti cār māṇsāṁsāṭhi āhe."
    "ipa": "ɦi pakkrut̪i tsar maɳsãsaʈʰi aɦe"
  - "text": "यासाठी दोन कप तांदूळ घ्या."
    "reading": "yāsāṭhi don kap tānduḷ ghyā."
    "ipa": "jasaʈʰi d̪on kəp t̪and̪uɭ ɡʱja"
  - "text": "एक चमचा मीठ घाला."
    "reading": "ek camcā miṭh ghālā."
    "ipa": "ek tsəmtsa miʈʰ ɡʱala"
  - "text": "पाव किलो साखर आणि अर्धा लिटर दूध घ्या."
    "reading": "pāv kilo sākhar āṇi ardhā liṭar dudh ghyā."
    "ipa": "paʋ kilo sakʰər aɳi ərd̪ʱa liʈər d̪ud̪ʱ ɡʱja"
  - "text": "तीन कांदे बारीक चिरा."
    "reading": "tin kānde bārik cirā."
    "ipa": "t̪in kand̪e barik tʃira"
