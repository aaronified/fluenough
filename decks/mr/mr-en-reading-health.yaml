    "reading": "ravivāri davākhānā band asto."
    "ipa": "rəʋiʋari d̪əʋakʰana bənd̪ əst̪o"
  - "text": "रुग्णांनी रांगेत थांबा."
    "reading": "rugṇānni rāṅget thāmbā."
    "ipa": "ruɡɳanni raŋɡet̪ t̪ʰamba"
  - "text": "डॉक्टर दहा मिनिटांत येतील."
    "reading": "ḍôkṭar dahā miniṭānt yetil."
    "ipa": "ɖɔkʈər d̪əɦa miniʈant̪ jet̪il"
  - "text": "औषध घेण्यासाठी कृपया खिडकीकडे जा."
