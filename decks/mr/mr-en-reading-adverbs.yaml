    "ipa": "mi ənekd̪a tsəɦa pit̪o"
  - "text": "मी क्वचित चित्रपट पाहतो."
    "reading": "mi kvacit citrapaṭ pāhto."
    "ipa": "mi kʋətʃit̪ tʃit̪rəpəʈ paɦt̪o"
  - "text": "मी संध्याकाळी फिरायला जातो."
    "reading": "mi sandhyākāḷi phirāylā jāto."
    "ipa": "mi sənd̪ʱjakaɭi pʰirajla dzat̪o"
  - "text": "मी सहसा घरी जेवतो."
    "reading": "mi sahsā ghari jevto."
    "ipa": "mi səɦsa ɡʱəri dʒeʋt̪o"
