schema: 1
id: mr-en-questions
name: "Yes, no and questions"
kind: vocab
theme: questions
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Yes and no, the question words, and how a sentence becomes a question. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0168
    target: "हो"
    native: "yes"
    reading: "ho"
    alt_target: ["होय"]
    pos: "other"
    notes: "होय (hoy) is a little more formal. Often just a nod, or the head tilted side to side."
  - id: mr-0169
    target: "नाही"
    native: "no; not"
    reading: "naahii"
    pos: "other"
    notes: "Also 'there isn't': पाणी नाही (paanii naahii), there's no water. After a verb it is 'not': मी जात नाही, I don't go."
  - id: mr-0170
    target: "काय?"
    native: "what?"
    reading: "kaay?"
    pos: "other"
    notes: "Also a mild 'what!' of surprise, and at the end of a sentence a question marker: तुम्ही येणार आहात काय?"
  - id: mr-0171
    target: "कोण?"
    native: "who?"
    reading: "kon?"
    pos: "other"
    notes: "ण is curled back: kon."
  - id: mr-0172
    target: "कुठे?"
    native: "where?"
    reading: "kuthe?"
    pos: "other"
    notes: "Where to: कुठे जाता? (kuthe jaataa?), where are you going?"
  - id: mr-0173
    target: "कधी?"
    native: "when?"
    reading: "kadhii?"
    pos: "other"
  - id: mr-0174
    target: "का?"
    native: "why?"
    reading: "kaa?"
    pos: "other"
    notes: "At the end of a sentence का makes a yes-or-no question instead: चहा घेणार का? (chahaa ghenaar kaa?), will you have tea?"
  - id: mr-0175
    target: "कसे?"
    native: "how?"
    reading: "kase?"
    alt_target: ["कसा?", "कशी?"]
    pos: "other"
    notes: "It agrees with what it asks about: कसा (kasaa) for a man, कशी (kashii) for a woman, कसे for a thing or a respectful तुम्ही."
  - id: mr-0176
    target: "किती?"
    native: "how much? how many?"
    reading: "kitii?"
    pos: "other"
    notes: "किती वाजले? (kitii vaajle?), what time is it?"
  - id: mr-0177
    target: "कोणता?"
    native: "which?"
    reading: "kontaa?"
    alt_target: ["कोणती?", "कोणते?"]
    pos: "other"
    notes: "Agrees with its noun: कोणता रस्ता (which road), कोणती बस (which bus), कोणते घर (which house)."
  - id: mr-0178
    target: "हे काय आहे?"
    native: "What is this?"
    reading: "he kaay aahe?"
    pos: "phrase"
  - id: mr-0179
    target: "तुम्हाला माहीत आहे का?"
    native: "Do you know?"
    reading: "tumhaalaa maahiit aahe kaa?"
    pos: "phrase"
    notes: "'Is it known to you?': the one who knows takes -ला."
  - id: mr-0180
    target: "मला माहीत नाही."
    native: "I don't know."
    reading: "malaa maahiit naahii."
    pos: "phrase"
