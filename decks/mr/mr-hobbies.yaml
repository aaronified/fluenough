  - id: "mr-1129"
    target: "छंद"
    reading: "chand"
    ipa: "tʃʰənd̪"
    pos: "noun"
    gender: "m"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "छंद", reading: "chand" }] }
    examples:
      - { target: "माझा छंद काय आहे?", reading: "mājhā chand kāy āhe?", ipa: "madzʱa tʃʰənd̪ kaj aɦe", bases: [{ word: "माझा", ref: "mr-0080" }, { word: "आहे", base: "असणे", reading: "asṇe" }] }
      - { target: "वाचन हा माझा आवडता छंद आहे.", reading: "vācan hā mājhā āvḍtā chand āhe.", ipa: "ʋatsən ɦa madzʱa aʋɖt̪a tʃʰənd̪ aɦe", bases: [{ word: "हा", ref: "mr-0679" }, { word: "माझा", ref: "mr-0080" }, { word: "आहे", base: "असणे", reading: "asṇe" }] }
