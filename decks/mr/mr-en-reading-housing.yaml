  - id: "mr-rental-terms"
    title: "Rental terms"
    sentences:
      - text: "भाडेकरार अकरा महिन्यांचा आहे."
        reading: "bhāḍekrār akrā mahinyāñcā āhe."
        ipa: "bʱaɖekrar əkra məɦinjaɲtsa aɦe"
      - text: "दर महिन्याचं भाडं पाचव्या तारखेला द्या."
        reading: "dar mahinyācam̐ bhāḍam̐ pācavyā tārkhelā dyā."
        ipa: "d̪ər məɦinjatsə̃ bʱaɖə̃ patsəʋja t̪arkʰela d̪ja"
      - text: "दोन महिन्यांची अनामत द्यावी लागेल."
        reading: "don mahinyāñci anāmat dyāvi lāgel."
        ipa: "d̪on məɦinjaɲtʃi ənamət̪ d̪jaʋi laɡel"
      - text: "फ्लॅटमध्ये पार्किंग मोफत आहे."
        reading: "phlêṭmadhye pārkiṅg mophat āhe."
        ipa: "pʰlæʈməd̪ʱje parkiŋɡ mopʰət̪ aɦe"
      - text: "नळ खराब झाला तर घरमालकाला फोन करा."
        reading: "naḷ kharāb jhālā tar gharmālkālā phon karā."
        ipa: "nəɭ kʰərab dzʱala t̪ər ɡʱərmalkala pʰon kəra"
    questions:
