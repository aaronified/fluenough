    "ipa": "ekuɳ rəkkəm d̪onʃe rupje aɦe"
  - "text": "रोख रक्कम दोनशे रुपये दिली."
    "reading": "rokh rakkam donśe rupye dili."
    "ipa": "rokʰ rəkkəm d̪onʃe rupje d̪ili"
  - "text": "बिल भरले आहे."
    "reading": "bil bharle āhe."
    "ipa": "bil bʱərle aɦe"
  - "text": "बाकी शून्य रुपये आहे."
    "reading": "bāki śunya rupye āhe."
    "ipa": "baki ʃunjə rupje aɦe"
  - "text": "ही पावती जपून ठेवा."
    "reading": "hi pāvti japun ṭhevā."
    "ipa": "ɦi paʋt̪i dzəpun ʈʰeʋa"
