  "sentences":
  - "text": "काल क्रिकेटचा सामना झाला."
    "reading": "kāl krikeṭcā sāmnā jhālā."
    "ipa": "kal krikeʈtsa samna dzʱala"
  - "text": "भारतीय संघाने चांगला खेळ केला."
    "reading": "bhārtiy saṅghāne cāṅgalā kheḷ kelā."
    "ipa": "bʱart̪ij səŋɡʱane tsaŋɡəla kʰeɭ kela"
  - "text": "शेवटच्या षटकात संघाने सामना जिंकला."
    "reading": "śevṭacyā ṣaṭkāt saṅghāne sāmnā jiṅkalā."
    "ipa": "ʃeʋʈətʃja ʂəʈkat̪ səŋɡʱane samna dʒiŋkəla"
  - "text": "प्रेक्षकांनी जोरदार टाळ्या वाजवल्या."
    "reading": "prekṣakānni jordār ṭāḷyā vājvalyā."
    "ipa": "prekʂəkanni dzord̪ar ʈaɭja ʋadzʋəlja"
  - "text": "पुढचा सामना उद्या आहे."
    "reading": "puḍhcā sāmnā udyā āhe."
    "ipa": "puɖʱtsa samna ud̪ja aɦe"
