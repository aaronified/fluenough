schema: 1
id: mr-en-grammar-needs
name: "Need and want"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "हवा, पाहिजे, नको and गरज: what you want, what you need, and what you don't. The one who wants takes -ला. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: mr-0411
    target: "हवे"
    native: "wanted; needed"
    reading: "have"
    alt_target: ["हवा", "हवी"]
    pos: "adj"
    notes: "The one who wants takes -ला, and हवा agrees with what is wanted: मला चहा हवा (m), मला कॉफी हवी (f), मला पाणी हवे (n). Often with आहे: मला पाणी हवे आहे."
  - id: mr-0412
    target: "पाहिजे"
    native: "want; need"
    reading: "paahije"
    pos: "verb"
    notes: "Never changes, whatever is wanted: मला चहा पाहिजे (malaa chahaa paahije), I want tea. Very common in speech."
  - id: mr-0413
    target: "नको"
    native: "don't want; no, thanks"
    reading: "nako"
    pos: "other"
    notes: "The opposite of हवा: मला साखर नको (malaa saakhar nako), no sugar for me. On its own, नको is a polite 'no, thanks'."
  - id: mr-0414
    target: "मला पाणी हवे आहे."
    native: "I want some water."
    reading: "malaa paanii have aahe."
    pos: "phrase"
    notes: "'To me water is wanted': पाणी is neuter, so हवे."
  - id: mr-0415
    target: "मला मदत हवी आहे."
    native: "I need help."
    reading: "malaa madat havii aahe."
    pos: "phrase"
    notes: "मदत is feminine, so हवी."
  - id: mr-0416
    target: "मला चहा नको."
    native: "I don't want tea."
    reading: "malaa chahaa nako."
    pos: "phrase"
  - id: mr-0417
    target: "गरज"
    native: "need"
    reading: "garaj"
    pos: "noun"
    gender: "f"
    notes: "A need, more formal: मला डॉक्टरची गरज आहे (malaa doktarchii garaj aahe), I need a doctor."
  - id: mr-0418
    target: "किती वेळ लागेल?"
    native: "How long will it take?"
    reading: "kitii vel laagel?"
    pos: "phrase"
    notes: "लागणे is 'to be needed, to take': दहा मिनिटे लागतील (dahaa minite laagtiil), it'll take ten minutes."
  - id: mr-0419
    target: "मला एक तिकीट पाहिजे."
    native: "I need a ticket."
    reading: "malaa ek tikiit paahije."
    pos: "phrase"
