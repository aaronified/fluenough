schema: 1
id: mr-en-grammar-needs
name: "Need and want"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "हवा (havā), पाहिजे (pāhije), नको (nako) and गरज (garaj): what you want, what you need, and what you don't. The one who wants takes -ला (-lā). Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: mr-0411
    target: "हवे"
    native: "wanted; needed"
    reading: "have"
    ipa: "ɦəʋe"
    alt_target: ["हवा", "हवी"]
    pos: "adj"
    notes: "The one who wants takes -ला (-lā), and हवा (havā) agrees with what is wanted: मला चहा हवा (m), मला कॉफी हवी (f), मला पाणी हवे (n). Often with आहे (āhe): मला पाणी हवे आहे (malā pāṇi have āhe)."
  - id: mr-0412
    target: "पाहिजे"
    native: "want; need"
    reading: "pāhije"
    ipa: "paɦidʒe"
    pos: "verb"
    notes: "Never changes, whatever is wanted: मला चहा पाहिजे (malā cahā pāhije), I want tea. Very common in speech."
  - id: mr-0413
    target: "नको"
    native: "don't want; no, thanks"
    reading: "nako"
    ipa: "nəko"
    pos: "other"
    notes: "The opposite of हवा (havā): मला साखर नको (malā sākhar nako), no sugar for me. On its own, नको (nako) is a polite 'no, thanks'."
  - id: mr-0414
    target: "मला पाणी हवे आहे."
    native: "I want some water."
    reading: "malā pāṇi have āhe."
    ipa: "məla paɳi ɦəʋe aɦe"
    pos: "phrase"
    notes: "'To me water is wanted': पाणी (pāṇi) is neuter, so हवे (have)."
  - id: mr-0415
    target: "मला मदत हवी आहे."
    native: "I need help."
    reading: "malā madat havi āhe."
    ipa: "məla məd̪ət̪ ɦəʋi aɦe"
    pos: "phrase"
    notes: "मदत (madat) is feminine, so हवी (havi)."
  - id: mr-0416
    target: "मला चहा नको."
    native: "I don't want tea."
    reading: "malā cahā nako."
    ipa: "məla tsəɦa nəko"
    pos: "phrase"
  - id: mr-0417
    target: "गरज"
    native: "need"
    reading: "garaj"
    ipa: "ɡərədz"
    pos: "noun"
    gender: "f"
    notes: "A need, more formal: मला डॉक्टरची गरज आहे (malā ḍôkṭarci garaj āhe), I need a doctor."
  - id: mr-0418
    target: "किती वेळ लागेल?"
    native: "How long will it take?"
    reading: "kiti veḷ lāgel?"
    ipa: "kit̪i ʋeɭ laɡel"
    pos: "phrase"
    notes: "लागणे (lāgṇe) is 'to be needed, to take': दहा मिनिटे लागतील (dahā miniṭe lāgtil), it'll take ten minutes."
  - id: mr-0419
    target: "मला एक तिकीट पाहिजे."
    native: "I need a ticket."
    reading: "malā ek tikiṭ pāhije."
    ipa: "məla ek t̪ikiʈ paɦidʒe"
    pos: "phrase"
