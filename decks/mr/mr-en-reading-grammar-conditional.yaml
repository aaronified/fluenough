- "id": "mr-late-train"
  "title": "If the train is late"
  "sentences":
  - "text": "मित्रा, आज मी सात वाजता स्टेशनवर येईन."
    "reading": "mitrā, āj mi sāt vājtā sṭeśnvar yein."
    "ipa": "mit̪ra adz mi sat̪ ʋadzt̪a sʈeʃnʋər jein"
  - "text": "जर गाडी उशिरा असेल, तर मी तुला फोन करीन."
    "reading": "jar gāḍi uśirā asel, tar mi tulā phon karin."
    "ipa": "dzər ɡaɖi uʃira əsel t̪ər mi t̪ula pʰon kərin"
  - "text": "गाडी सात वाजून पाच मिनिटांनी येईल."
    "reading": "gāḍi sāt vājun pāc miniṭānni yeil."
    "ipa": "ɡaɖi sat̪ ʋadzun pats miniʈanni jeil"
  - "text": "काळजी करू नकोस."
    "reading": "kāḷji karu nakos."
    "ipa": "kaɭdʒi kəru nəkos"
