schema: 1
id: mr-en-grammar-likes
name: "Likes"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "आवडणे: what you like, and what you liked. The one who likes takes -ला, and the verb agrees with what is liked. Not yet checked by a Marathi speaker: please report any mistake."
tags: [unreviewed, grammar]
cards:
  - ref: mr-0162
  - id: mr-0585
    target: "आवडणे"
    native: "to like; to be pleasing"
    reading: "āvaḍṇe"
    ipa: "aʋəɖɳe"
    pos: "verb"
    notes: "Turned round from English: what is liked is the subject, and the one who likes takes -ला. मला आवडते, I like it, 'to me it is pleasing'."
  - id: mr-0586
    target: "मला चहा आवडतो."
    native: "I like tea."
    reading: "malā cahā āvaḍto."
    ipa: "məla tsəɦa aʋəɖt̪o"
    pos: "phrase"
    notes: "चहा is masculine, so आवडतो, whoever is speaking."
  - id: mr-0587
    target: "मला कॉफी आवडते."
    native: "I like coffee."
    reading: "malā kôfi āvaḍte."
    ipa: "məla kɔfi aʋəɖt̪e"
    pos: "phrase"
    notes: "कॉफी is feminine, so आवडते."
  - id: mr-0588
    target: "मला आंबे आवडतात."
    native: "I like mangoes."
    reading: "malā āmbe āvaḍtāt."
    ipa: "məla ambe aʋəɖt̪at̪"
    pos: "phrase"
    notes: "आंबे is plural, so आवडतात."
  - id: mr-0589
    target: "मला हा चित्रपट आवडला."
    native: "I liked this film."
    reading: "malā hā citrapaṭ āvaḍlā."
    ipa: "məla ɦa tʃit̪rəpəʈ aʋəɖla"
    pos: "phrase"
    notes: "In the past it agrees too: चित्रपट (citrapaṭ, film) is masculine, so आवडला. Also सिनेमा (sinemā)."
  - id: mr-0590
    target: "मला ते आवडत नाही."
    native: "I don't like it."
    reading: "malā te āvaḍat nāhi."
    ipa: "məla t̪e aʋəɖət̪ naɦi"
    pos: "phrase"
  - id: mr-0591
    target: "तुम्हाला काय आवडते?"
    native: "What do you like?"
    reading: "tumhālā kāy āvaḍte?"
    ipa: "t̪umɦala kaj aʋəɖt̪e"
    pos: "phrase"
  - id: mr-0592
    target: "आवडता"
    native: "favourite"
    reading: "āvaḍtā"
    ipa: "aʋəɖt̪a"
    alt_target: ["आवडती", "आवडते"]
    pos: "adj"
    notes: "Agrees with its noun: माझा आवडता रंग (mājhā āvaḍtā raṅg), my favourite colour; माझी आवडती भाजी, my favourite vegetable."
  - id: mr-0593
    target: "मला वाचायला आवडते."
    native: "I like reading."
    reading: "malā vācāylā āvaḍte."
    ipa: "məla ʋatsajla aʋəɖt̪e"
    pos: "phrase"
    notes: "An action you like takes -आयला: वाचायला, to read; फिरायला (phirāylā), to go out and about."
