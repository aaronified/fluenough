schema: 1
id: mr-en-grammar-articles
name: "No articles: a and the"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Marathi has no 'a' or 'the'. How it says them anyway. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: mr-0384
    target: "पुस्तक"
    native: "book; a book; the book"
    picture: "📖"
    reading: "pustak"
    ipa: "pust̪ək"
    pos: "noun"
    gender: "n"
    notes: "A bare noun is 'a book' or 'the book': context decides. पुस्तक टेबलावर आहे (pustak ṭebalāvar āhe), the book is on the table."
  - ref: mr-0139
    notes: "एक (ek), 'one', serves for 'a' when the 'one' matters, as when something is new to the story: एक पुस्तक घेतले (ek pustak ghetle), I bought a book."
  - id: mr-0385
    target: "हे पुस्तक"
    native: "this book; the book (here)"
    reading: "he pustak"
    ipa: "ɦe pust̪ək"
    pos: "phrase"
    notes: "For 'the', point with this or that: हे पुस्तक (he pustak), this book; ते पुस्तक (te pustak), that book."
  - id: mr-0386
    target: "तो मुलगा"
    native: "that boy; the boy"
    reading: "to mulgā"
    ipa: "t̪o mulɡa"
    pos: "phrase"
    notes: "तो (to), 'that', often does the work of 'the' for someone already mentioned."
  - id: mr-0387
    target: "एक मुलगी"
    native: "a girl; one girl"
    reading: "ek mulgi"
    ipa: "ek mulɡi"
    pos: "phrase"
  - id: mr-0388
    target: "कोणीतरी"
    native: "someone"
    reading: "koṇitari"
    ipa: "koɳit̪əri"
    pos: "other"
    notes: "कोणी (koṇi), who, with -तरी (-tari), 'some': दारावर कोणीतरी आहे (dārāvar koṇitari āhe), there's someone at the door."
  - id: mr-0389
    target: "काहीतरी"
    native: "something"
    reading: "kāhitari"
    ipa: "kaɦit̪əri"
    pos: "other"
    notes: "काही (kāhi), some, with -तरी (-tari): काहीतरी खा (kāhitari khā), eat something."
