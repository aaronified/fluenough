schema: 1
id: mr-en-calendar
name: "Months and years"
kind: vocab
theme: calendar
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The months as Marathi says them, the three seasons, the date, and the year's two great festivals. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0514
    target: "महिना"
    native: "month"
    reading: "mahinā"
    ipa: "məɦina"
    pos: "noun"
    gender: "m"
    notes: "पुढच्या महिन्यात (puḍhcyā mahinyāt), next month."
  - id: mr-0515
    target: "वर्ष"
    native: "year"
    reading: "varṣ"
    ipa: "ʋərʂ"
    pos: "noun"
    gender: "n"
    notes: "A year is read as a number: दोन हजार पंचवीस (don hajār pañcvis), 2025. या वर्षी (yā varṣi), this year."
  - id: mr-0516
    target: "जानेवारी"
    native: "January"
    reading: "jānevāri"
    ipa: "dzaneʋari"
    pos: "noun"
    gender: "m"
    notes: "The months are the English ones, said the Marathi way. The traditional months (चैत्र (caitr), वैशाख (vaiśākh) …) are used for festivals."
  - id: mr-0517
    target: "फेब्रुवारी"
    native: "February"
    reading: "februvāri"
    ipa: "februʋari"
    pos: "noun"
    gender: "m"
  - id: mr-0518
    target: "मार्च"
    native: "March"
    reading: "mārc"
    ipa: "marts"
    pos: "noun"
    gender: "m"
  - id: mr-0519
    target: "एप्रिल"
    native: "April"
    reading: "epril"
    ipa: "epril"
    pos: "noun"
    gender: "m"
  - id: mr-0520
    target: "मे"
    native: "May"
    reading: "me"
    ipa: "me"
    pos: "noun"
    gender: "m"
    notes: "The hottest month, before the monsoon."
  - id: mr-0521
    target: "जून"
    native: "June"
    reading: "jun"
    ipa: "dzun"
    pos: "noun"
    gender: "m"
    notes: "The monsoon usually reaches Maharashtra in June."
  - id: mr-0522
    target: "जुलै"
    native: "July"
    reading: "julai"
    ipa: "dzuləi"
    pos: "noun"
    gender: "m"
  - id: mr-0523
    target: "ऑगस्ट"
    native: "August"
    reading: "ôgasṭ"
    ipa: "ɔɡəsʈ"
    pos: "noun"
    gender: "m"
  - id: mr-0524
    target: "सप्टेंबर"
    native: "September"
    reading: "sapṭembar"
    ipa: "səpʈembər"
    pos: "noun"
    gender: "m"
  - id: mr-0525
    target: "ऑक्टोबर"
    native: "October"
    reading: "ôkṭobar"
    ipa: "ɔkʈobər"
    pos: "noun"
    gender: "m"
  - id: mr-0526
    target: "नोव्हेंबर"
    native: "November"
    reading: "novembar"
    ipa: "noʋembər"
    pos: "noun"
    gender: "m"
    notes: "Marathi writes English v as व्ह (vh), said as a plain v."
  - id: mr-0527
    target: "डिसेंबर"
    native: "December"
    reading: "ḍisembar"
    ipa: "ɖisembər"
    pos: "noun"
    gender: "m"
  - id: mr-0528
    target: "तारीख"
    native: "date"
    reading: "tārikh"
    ipa: "t̪arikʰ"
    pos: "noun"
    gender: "f"
    notes: "आज काय तारीख आहे? (aj kay tarikh ahe?), what's the date today?"
  - id: mr-0529
    target: "उन्हाळा"
    native: "summer; the hot season"
    reading: "unhāḷā"
    ipa: "unɦaɭa"
    pos: "noun"
    gender: "m"
    notes: "Roughly March to May."
  - id: mr-0530
    target: "पावसाळा"
    native: "the rainy season; the monsoon"
    reading: "pāvsāḷā"
    ipa: "paʋsaɭa"
    pos: "noun"
    gender: "m"
    notes: "From पाऊस (pāus), rain: पाऊस पडतोय (pāus paḍtoy), it's raining."
  - id: mr-0531
    target: "हिवाळा"
    native: "winter; the cool season"
    reading: "hivāḷā"
    ipa: "ɦiʋaɭa"
    pos: "noun"
    gender: "m"
  - id: mr-0532
    target: "गुढीपाडवा"
    native: "Gudi Padwa, the Marathi new year"
    reading: "guḍhipāḍvā"
    ipa: "ɡuɖʱipaɖʋa"
    pos: "noun"
    gender: "m"
    notes: "The first day of the month of चैत्र (caitr), in March or April, when a गुढी (guḍhi), a pole dressed with cloth and a pot, is raised outside homes."
  - id: mr-0533
    target: "दिवाळी"
    native: "Diwali"
    reading: "divāḷi"
    ipa: "d̪iʋaɭi"
    pos: "noun"
    gender: "f"
    notes: "With the curled-back ळ (ḷa). दिवाळीच्या शुभेच्छा! (divalichya shubhechchha!), happy Diwali!"
