schema: 1
id: mr-en-calendar
name: "Months and years"
kind: vocab
theme: calendar
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The months as Marathi says them, the three seasons, the date, and the year's two great festivals. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0514
    target: "महिना"
    native: "month"
    reading: "mahina"
    pos: "noun"
    gender: "m"
    notes: "पुढच्या महिन्यात (pudhchya mahinyat), next month."
  - id: mr-0515
    target: "वर्ष"
    native: "year"
    reading: "varsh"
    pos: "noun"
    gender: "n"
    notes: "A year is read as a number: दोन हजार पंचवीस (don hajar panchvis), 2025. या वर्षी (ya varshi), this year."
  - id: mr-0516
    target: "जानेवारी"
    native: "January"
    reading: "janevari"
    pos: "noun"
    gender: "m"
    notes: "The months are the English ones, said the Marathi way. The traditional months (चैत्र, वैशाख …) are used for festivals."
  - id: mr-0517
    target: "फेब्रुवारी"
    native: "February"
    reading: "februvari"
    pos: "noun"
    gender: "m"
  - id: mr-0518
    target: "मार्च"
    native: "March"
    reading: "march"
    pos: "noun"
    gender: "m"
  - id: mr-0519
    target: "एप्रिल"
    native: "April"
    reading: "epril"
    pos: "noun"
    gender: "m"
  - id: mr-0520
    target: "मे"
    native: "May"
    reading: "me"
    pos: "noun"
    gender: "m"
    notes: "The hottest month, before the monsoon."
  - id: mr-0521
    target: "जून"
    native: "June"
    reading: "jun"
    pos: "noun"
    gender: "m"
    notes: "The monsoon usually reaches Maharashtra in June."
  - id: mr-0522
    target: "जुलै"
    native: "July"
    reading: "julai"
    pos: "noun"
    gender: "m"
  - id: mr-0523
    target: "ऑगस्ट"
    native: "August"
    reading: "ogast"
    pos: "noun"
    gender: "m"
  - id: mr-0524
    target: "सप्टेंबर"
    native: "September"
    reading: "saptembar"
    pos: "noun"
    gender: "m"
  - id: mr-0525
    target: "ऑक्टोबर"
    native: "October"
    reading: "oktobar"
    pos: "noun"
    gender: "m"
  - id: mr-0526
    target: "नोव्हेंबर"
    native: "November"
    reading: "novembar"
    pos: "noun"
    gender: "m"
    notes: "Marathi writes English v as व्ह, said as a plain v."
  - id: mr-0527
    target: "डिसेंबर"
    native: "December"
    reading: "disembar"
    pos: "noun"
    gender: "m"
  - id: mr-0528
    target: "तारीख"
    native: "date"
    reading: "tarikh"
    pos: "noun"
    gender: "f"
    notes: "आज काय तारीख आहे? (aj kay tarikh ahe?), what's the date today?"
  - id: mr-0529
    target: "उन्हाळा"
    native: "summer; the hot season"
    reading: "unhala"
    pos: "noun"
    gender: "m"
    notes: "Roughly March to May."
  - id: mr-0530
    target: "पावसाळा"
    native: "the rainy season; the monsoon"
    reading: "pavsala"
    pos: "noun"
    gender: "m"
    notes: "From पाऊस (paus), rain: पाऊस पडतोय (paus padtoy), it's raining."
  - id: mr-0531
    target: "हिवाळा"
    native: "winter; the cool season"
    reading: "hivala"
    pos: "noun"
    gender: "m"
  - id: mr-0532
    target: "गुढीपाडवा"
    native: "Gudi Padwa, the Marathi new year"
    reading: "gudhipadva"
    pos: "noun"
    gender: "m"
    notes: "The first day of the month of चैत्र, in March or April, when a गुढी, a pole dressed with cloth and a pot, is raised outside homes."
  - id: mr-0533
    target: "दिवाळी"
    native: "Diwali"
    reading: "divali"
    pos: "noun"
    gender: "f"
    notes: "With the curled-back ळ. दिवाळीच्या शुभेच्छा! (divalichya shubhechchha!), happy Diwali!"
