  - id: "mr-chore-list"
    title: "Weekly chores"
    sentences:
      - text: "सोमवारी आई कपडे धुते."
        reading: "somvāri āi kapḍe dhute."
        ipa: "somʋari ai kəpɖe d̪ʱut̪e"
      - text: "मंगळवारी मी भांडी घासतो."
        reading: "maṅgaḷvāri mi bhāṇḍi ghāsto."
        ipa: "məŋɡəɭʋari mi bʱaɳɖi ɡʱast̪o"
      - text: "बुधवारी आपण खोली साफ करू."
        reading: "budhvāri āpaṇ kholi sāph karu."
        ipa: "bud̪ʱʋari apəɳ kʰoli sapʰ kəru"
      - text: "शुक्रवारी कचरा बाहेर टाका."
        reading: "śukravāri kacrā bāher ṭākā."
        ipa: "ʃukrəʋari kətsra baɦer ʈaka"
      - text: "रविवारी सगळे घरकाम करतात."
        reading: "ravivāri sagḷe gharkām kartāt."
        ipa: "rəʋiʋari səɡɭe ɡʱərkam kərt̪at̪"
