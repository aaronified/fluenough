schema: 1
id: mr-en-about-me
name: "About me"
kind: vocab
theme: about-me
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Your name, where you are from, where you live, your age and the languages you speak. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0204
    target: "नाव"
    native: "name"
    reading: "naav"
    pos: "noun"
    gender: "n"
    notes: "Neuter: माझे नाव, my name. The same word also means 'boat', and then it is feminine: ती नाव, that boat."
  - id: mr-0205
    target: "माझे नाव अनिता आहे."
    native: "My name is Anita."
    reading: "maajhe naav anitaa aahe."
    pos: "phrase"
    notes: "माझे agrees with नाव, which is neuter. Also simply मी अनिता (mii anitaa), I'm Anita."
  - id: mr-0206
    target: "मी इंग्लंडचा आहे."
    native: "I'm from England. (a man speaking)"
    reading: "mii inglandchaa aahe."
    alt_target: ["मी इंग्लंडची आहे."]
    pos: "phrase"
    notes: "'I am England's': -चा agrees with the speaker, so a woman says इंग्लंडची (inglandchii). Also मी इंग्लंडहून आलो आहे, I've come from England."
  - id: mr-0207
    target: "मी पुण्यात राहतो."
    native: "I live in Pune. (a man speaking)"
    reading: "mii punyaat raahto."
    alt_target: ["मी पुण्यात राहते."]
    pos: "phrase"
    notes: "पुणे (pune) becomes पुण्या- before -त, 'in'. A woman says राहते (raahte)."
  - id: mr-0208
    target: "देश"
    native: "country"
    reading: "desh"
    pos: "noun"
    gender: "m"
    notes: "तुमचा देश कोणता? (tumchaa desh kontaa?), which is your country?"
  - id: mr-0209
    target: "गाव"
    native: "village; home town"
    reading: "gaav"
    pos: "noun"
    gender: "n"
    notes: "Even city people speak of their गाव, the place their family comes from: तुमचे गाव कोणते? (tumche gaav konte?)."
  - ref: mr-0058
    notes: "मी मुंबई शहरात राहतो, I live in the city of Mumbai."
  - id: mr-0210
    target: "वय"
    native: "age"
    reading: "vay"
    pos: "noun"
    gender: "n"
  - id: mr-0211
    target: "तुमचे वय किती आहे?"
    native: "How old are you?"
    reading: "tumche vay kitii aahe?"
    pos: "phrase"
    notes: "'Your age how much is?'. An answer: मी तीस वर्षांचा आहे (mii tiis varshaanchaa aahe), I'm thirty; a woman says वर्षांची."
  - id: mr-0212
    target: "लग्न"
    native: "wedding; marriage"
    reading: "lagna"
    pos: "noun"
    gender: "n"
    notes: "माझे लग्न झाले आहे (maajhe lagna jhaale aahe), I'm married: 'my wedding has happened'. The final a is said after the conjunct."
  - id: mr-0213
    target: "मित्र"
    native: "friend (a man)"
    reading: "mitra"
    pos: "noun"
    gender: "m"
  - id: mr-0214
    target: "मैत्रीण"
    native: "friend (a woman)"
    reading: "maitriin"
    pos: "noun"
    gender: "f"
  - id: mr-0215
    target: "भाषा"
    native: "language"
    reading: "bhaashaa"
    pos: "noun"
    gender: "f"
    notes: "मराठी भाषा, the Marathi language."
  - id: mr-0216
    target: "मी इंग्रजी बोलतो."
    native: "I speak English. (a man speaking)"
    reading: "mii ingrajii bolto."
    alt_target: ["मी इंग्रजी बोलते."]
    pos: "phrase"
    notes: "इंग्रजी (ingrajii) is English. A woman says बोलते (bolte)."
