  - "text": "दुसऱ्या आठवड्यात परीक्षा आहे."
    "reading": "dusaryā āṭhvaḍyāt parikṣā āhe."
    "ipa": "d̪usərja aʈʰʋəɖjat̪ pərikʂa aɦe"
  - "text": "तिसऱ्या आठवड्यात आम्ही घरी जाऊ."
    "reading": "tisaryā āṭhvaḍyāt āmhi ghari jāu."
    "ipa": "t̪isərja aʈʰʋəɖjat̪ amɦi ɡʱəri dzau"
  - "text": "चौथ्या आठवड्यात काहीच नाही."
