schema: 1
id: mr-en-grammar-sentences
name: "Basic sentences"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Word order, आहे at the end, and how Marathi says have and like. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: mr-0158
    target: "मी विद्यार्थी आहे."
    native: "I am a student."
    reading: "mi vidyārthi āhe."
    ipa: "mi ʋid̪jart̪ʰi aɦe"
    alt_target: ["मी विद्यार्थिनी आहे."]
    pos: "phrase"
    notes: "'I student am'. A woman student is a विद्यार्थिनी (vidyārthini)."
  - id: mr-0159
    target: "हे माझे घर आहे."
    native: "This is my house."
    reading: "he mājhe ghar āhe."
    ipa: "ɦe madʒʱe ɡʱər aɦe"
    pos: "phrase"
    notes: "माझे, 'my', agrees with घर, which is neuter."
  - id: mr-0160
    target: "मी चहा पितो."
    native: "I drink tea. (a man speaking)"
    reading: "mi cahā pito."
    ipa: "mi tsəɦa pit̪o"
    alt_target: ["मी चहा पिते."]
    pos: "phrase"
    notes: "Subject, object, verb: the verb comes last. A woman says पिते (pite)."
  - id: mr-0161
    target: "ती मराठी शिकत आहे."
    native: "She is learning Marathi."
    reading: "ti marāṭhi śikat āhe."
    ipa: "t̪i məraʈʰi ʃikət̪ aɦe"
    pos: "phrase"
  - id: mr-0162
    target: "मला मराठी आवडते."
    native: "I like Marathi."
    reading: "malā marāṭhi āvaḍte."
    ipa: "məla məraʈʰi aʋəɖt̪e"
    pos: "phrase"
    notes: "'To me, Marathi is pleasing': the one who likes takes -ला, and the verb agrees with मराठी, which is feminine."
  - id: mr-0163
    target: "माझ्याकडे गाडी आहे."
    native: "I have a car."
    reading: "mājhyākaḍe gāḍi āhe."
    ipa: "madʒʱjakəɖe ɡaɖi aɦe"
    pos: "phrase"
    notes: "'With me there is a car'. For family and body parts, -ला: मला दोन भाऊ आहेत (malā don bhāu āhet), I have two brothers."
  - id: mr-0164
    target: "माझ्याकडे पैसे नाहीत."
    native: "I don't have any money."
    reading: "mājhyākaḍe paise nāhit."
    ipa: "madʒʱjakəɖe pəise naɦit̪"
    pos: "phrase"
    notes: "नाहीत, 'there aren't', agrees with the plural पैसे."
  - id: mr-0165
    target: "हे चांगले नाही."
    native: "This isn't good."
    reading: "he cāṅgle nāhi."
    ipa: "ɦe tsaŋɡle naɦi"
    pos: "phrase"
  - id: mr-0166
    target: "जाऊ नका."
    native: "Please don't go."
    reading: "jāu nakā."
    ipa: "dzau nəka"
    pos: "phrase"
    notes: "The verb in -ऊ with नका makes a polite 'don't'. To a friend: जाऊ नकोस (jāu nakos)."
  - id: mr-0167
    target: "आज खूप उकाडा आहे."
    native: "It's very hot and sticky today."
    reading: "āj khup ukāḍā āhe."
    ipa: "adz kʰup ukaɖa aɦe"
    pos: "phrase"
    notes: "उकाडा is the sticky heat before the monsoon. A dry, sunny heat is ऊन (un): आज खूप ऊन आहे."
