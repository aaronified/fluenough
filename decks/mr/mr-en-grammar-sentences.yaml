id: mr-en-grammar-sentences
name: "Basic sentences"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Word order, आहे at the end, and how Marathi says have and like. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: mr-0158
    target: "मी विद्यार्थी आहे."
    native: "I am a student."
    reading: "mi vidyarthi ahe."
    alt_target: ["मी विद्यार्थिनी आहे."]
    pos: "phrase"
    notes: "'I student am'. A woman student is a विद्यार्थिनी (vidyarthini)."
  - id: mr-0159
    target: "हे माझे घर आहे."
    native: "This is my house."
    reading: "he majhe ghar ahe."
    pos: "phrase"
    notes: "माझे, 'my', agrees with घर, which is neuter."
  - id: mr-0160
    target: "मी चहा पितो."
    native: "I drink tea. (a man speaking)"
    reading: "mi chaha pito."
    alt_target: ["मी चहा पिते."]
    pos: "phrase"
    notes: "Subject, object, verb: the verb comes last. A woman says पिते (pite)."
  - id: mr-0161
    target: "ती मराठी शिकत आहे."
    native: "She is learning Marathi."
    reading: "ti marathi shikat ahe."
    pos: "phrase"
  - id: mr-0162
    target: "मला मराठी आवडते."
    native: "I like Marathi."
    reading: "mala marathi avadte."
    pos: "phrase"
    notes: "'To me, Marathi is pleasing': the one who likes takes -ला, and the verb agrees with मराठी, which is feminine."
  - id: mr-0163
    target: "माझ्याकडे गाडी आहे."
    native: "I have a car."
    reading: "majhyakade gadi ahe."
    pos: "phrase"
    notes: "'With me there is a car'. For family and body parts, -ला: मला दोन भाऊ आहेत (mala don bhau ahet), I have two brothers."
  - id: mr-0164
    target: "माझ्याकडे पैसे नाहीत."
    native: "I don't have any money."
    reading: "majhyakade paise nahit."
    pos: "phrase"
    notes: "नाहीत, 'there aren't', agrees with the plural पैसे."
  - id: mr-0165
    target: "हे चांगले नाही."
    native: "This isn't good."
    reading: "he changle nahi."
    pos: "phrase"
  - id: mr-0166
    target: "जाऊ नका."
    native: "Please don't go."
    reading: "jau naka."
    pos: "phrase"
    notes: "The verb in -ऊ with नका makes a polite 'don't'. To a friend: जाऊ नकोस (jau nakos)."
  - id: mr-0167
    target: "आज खूप उकाडा आहे."
    native: "It's very hot and sticky today."
    reading: "aj khup ukada ahe."
    pos: "phrase"
    notes: "उकाडा is the sticky heat before the monsoon. A dry, sunny heat is ऊन (un): आज खूप ऊन आहे."
