  - id: "mr-1722"
    target: "कल्पना"
    reading: "kalpanā"
    ipa: "kəlpəna"
    pos: "noun"
    gender: "f"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "कल्पना", reading: "kalpanā" }] }
    examples:
      - { target: "तुझी कल्पना खूप मोठी आहे.", reading: "tujhi kalpanā khup moṭhi āhe.", ipa: "t̪udʒʱi kəlpəna kʰup moʈʰi aɦe", bases: [{ word: "तुझी", ref: "mr-0675" }, { word: "मोठी", ref: "mr-0760" }, { word: "आहे", base: "असणे", reading: "asṇe" }] }
      - { target: "ही कल्पना चांगली वाटते.", reading: "hi kalpanā cāṅgali vāṭte.", ipa: "ɦi kəlpəna tsaŋɡəli ʋaʈt̪e", bases: [{ word: "ही", ref: "mr-0679" }, { word: "चांगली", ref: "mr-0759" }, { word: "वाटते", base: "वाटणे", reading: "vāṭṇe" }] }
