      - { target: "नवीन संकल्पना शिकायला हवी.", reading: "navin saṅkalpanā śikāylā havi.", ipa: "nəʋin səŋkəlpəna ʃikajla ɦəʋi", bases: [{ word: "नवीन", base: "नवा", reading: "navā" }, { word: "शिकायला", ref: "mr-0717" }, { word: "हवी", ref: "mr-0412" }] }
