- "id": "mr-thank-you-note"
  "title": "A thank-you note"
  "sentences":
  - "text": "तुम्ही माझ्यासाठी गोड पदार्थ आणलात, त्याबद्दल धन्यवाद."
    "reading": "tumhi mājhyāsāṭhi goḍ padārth āṇlāt, tyābaddal dhanyavād."
    "ipa": "t̪umɦi madʒʱjasaʈʰi ɡoɖ pəd̪art̪ʰ aɳlat̪ t̪jabəd̪d̪əl d̪ʱənjəʋad̪"
  - "text": "तुमचे घर खूप सुंदर आहे."
    "reading": "tumce ghar khup sundar āhe."
    "ipa": "t̪umtʃe ɡʱər kʰup sund̪ər aɦe"
  - "text": "काल तुम्ही माझ्या मुलीला शाळेत सोडलेत."
    "reading": "kāl tumhi mājhyā mulilā śāḷet soḍlet."
    "ipa": "kal t̪umɦi madʒʱja mulila ʃaɭet̪ soɖlet̪"
  - "text": "पुढच्या रविवारी आमच्या घरी जेवायला या."
    "reading": "puḍhacyā ravivāri āmacyā ghari jevāylā yā."
    "ipa": "puɖʱətʃja rəʋiʋari amətʃja ɡʱəri dʒeʋajla ja"
