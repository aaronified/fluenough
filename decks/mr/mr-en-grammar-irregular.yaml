schema: 1
id: mr-en-grammar-irregular
name: "Irregular verbs"
kind: grammar
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The common verbs whose past or polite request does not follow the pattern. Not yet checked by a Marathi speaker: please report any mistake."
tags: [unreviewed, grammar]
pattern:
  name: "Irregular verbs"
  slot_name: "form"
  slots: ["past, masculine", "past, feminine", "please … (तुम्ही)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The past masculine is the form for तो with a verb that takes no object, तो गेला, he went. A verb that takes an object agrees with the object instead: त्याने चहा केला, he made tea (चहा is masculine); त्याने पोळी केली, he made a chapati (पोळी is feminine). The polite request goes with तुम्ही: या, please come; to a friend, the bare stem: ये."
  entries:
    - lemma: "जाणे"
      key: jaane
      reading: "jāṇe"
      ipa: "dzaɳe"
      gloss: "to go"
      forms:
        "past, masculine": "गेला"
        "past, feminine": "गेली"
        "please … (तुम्ही)": "जा"
      readings:
        "past, masculine": "gelā"
        "past, feminine": "geli"
        "please … (तुम्ही)": "jā"
      ipas:
        "past, masculine": "ɡela"
        "past, feminine": "ɡeli"
        "please … (तुम्ही)": "dza"
    - lemma: "येणे"
      key: yene
      reading: "yeṇe"
      ipa: "jeɳe"
      gloss: "to come"
      forms:
        "past, masculine": "आला"
        "past, feminine": "आली"
        "please … (तुम्ही)": "या"
      readings:
        "past, masculine": "ālā"
        "past, feminine": "āli"
        "please … (तुम्ही)": "yā"
      ipas:
        "past, masculine": "ala"
        "past, feminine": "ali"
        "please … (तुम्ही)": "ja"
    - lemma: "करणे"
      key: karne
      reading: "karṇe"
      ipa: "kərɳe"
