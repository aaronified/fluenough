schema: 1
id: mr-en-grammar-irregular
name: "Irregular verbs"
kind: grammar
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The common verbs whose past or polite request does not follow the pattern. Not yet checked by a Marathi speaker: please report any mistake."
tags: [unreviewed, grammar]
pattern:
  name: "Irregular verbs"
  slot_name: "form"
  slots: ["past, masculine", "past, feminine", "please … (तुम्ही (tumhi))"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The past masculine is the form for तो (to) with a verb that takes no object, तो गेला (to gelā), he went. A verb that takes an object agrees with the object instead: त्याने चहा केला (tyāne cahā kelā), he made tea (चहा (cahā) is masculine); त्याने पोळी केली (tyāne poḷi keli), he made a chapati (पोळी (poḷi) is feminine). The polite request goes with तुम्ही (tumhi): या (yā), please come; to a friend, the bare stem: ये (ye)."
  entries:
    - lemma: "जाणे"
      key: jaane
      reading: "jāṇe"
      ipa: "dzaɳe"
      gloss: "to go"
      forms:
        "past, masculine": "गेला"
        "past, feminine": "गेली"
        "please … (तुम्ही (tumhi))": "जा"
      readings:
        "past, masculine": "gelā"
        "past, feminine": "geli"
        "please … (तुम्ही (tumhi))": "jā"
      ipas:
        "past, masculine": "ɡela"
        "past, feminine": "ɡeli"
        "please … (तुम्ही (tumhi))": "dza"
    - lemma: "येणे"
      key: yene
      reading: "yeṇe"
      ipa: "jeɳe"
      gloss: "to come"
      forms:
