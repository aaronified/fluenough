    "ipa": "t̪isri pajri poɭi bʱadza"
  - "text": "शेवटी पोळीवर तूप लावा."
    "reading": "śevṭi poḷivar tup lāvā."
    "ipa": "ʃeʋʈi poɭiʋər t̪up laʋa"
