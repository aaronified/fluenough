  - id: "mr-1212"
    target: "सहल"
    reading: "sahal"
    ipa: "səɦəl"
    pos: "noun"
    gender: "f"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "सहल", reading: "sahal" }] }
    examples:
      - { target: "शाळेची सहल कुठे आहे?", reading: "śāḷeci sahal kuṭhe āhe?", ipa: "ʃaɭetʃi səɦəl kuʈʰe aɦe", bases: [{ word: "शाळेची", ref: "mr-0957" }, { word: "आहे", base: "असणे", reading: "asṇe" }] }
