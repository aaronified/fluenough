      - { target: "आरक्षण नाही मिळालं.", reading: "ārakṣaṇ nāhi miḷālam̐.", ipa: "arəkʂəɳ naɦi miɭalə̃", bases: [{ word: "मिळालं", base: "मिळणे", reading: "miḷṇe" }, { word: "नाही", base: "नसणे", reading: "nasṇe" }] }
  - id: "mr-1214"
