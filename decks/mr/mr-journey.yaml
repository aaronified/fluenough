  - id: "mr-1211"
    target: "प्रवास"
    reading: "pravās"
    ipa: "prəʋas"
    pos: "noun"
    gender: "m"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "प्रवास", reading: "pravās" }] }
    examples:
      - { target: "आमचा प्रवास लांब होता.", reading: "āmcā pravās lāmb hotā.", ipa: "amtsa prəʋas lamb ɦot̪a", bases: [{ word: "आमचा", ref: "mr-0138" }, { word: "होता", base: "होणे", reading: "hoṇe" }] }
