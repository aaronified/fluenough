schema: 1
id: mr-en-grammar-can-must
name: "Can, may and must"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Ability, knowing how, permission, need and duty: शकणे, येणे, हवे and लागणे. Not yet checked by a Marathi speaker: please report any mistake."
tags: [unreviewed, grammar]
cards:
  - id: mr-0639
    target: "मी जाऊ शकतो."
    native: "I can go. (a man speaking)"
    reading: "mii jaauu shakto."
    alt_target: ["मी जाऊ शकते."]
    pos: "phrase"
    notes: "The verb in -ऊ, then शकणे, 'to be able', in its person: तू जाऊ शकतोस, ते जाऊ शकतात. A woman says शकते."
  - id: mr-0640
    target: "मला पोहता येते."
    native: "I can swim; I know how to swim."
    reading: "malaa pohtaa yete."
    pos: "phrase"
    notes: "A skill 'comes to' you: the verb in -ता, then येते. As with a language: मला मराठी येते."
  - id: mr-0641
    target: "मला गाडी चालवता येत नाही."
    native: "I can't drive."
    reading: "malaa gaadii chaalavtaa yet naahii."
    pos: "phrase"
    notes: "चालवणे, to drive; to run (a machine, a business)."
  - id: mr-0642
    target: "मी आत येऊ का?"
    native: "May I come in?"
    reading: "mii aat yeuu kaa?"
    pos: "phrase"
    notes: "Asking leave: the verb in -ऊ with का. मी बसू का?, may I sit down?"
  - id: mr-0643
    target: "मला जायला हवे."
    native: "I must go; I should go."
    reading: "malaa jaaylaa have."
    pos: "phrase"
    notes: "The verb in -आयला with हवे or पाहिजे: मला जायला पाहिजे, the same."
  - id: mr-0644
    target: "मला उद्या कामावर जावे लागेल."
    native: "I'll have to go to work tomorrow."
    reading: "malaa udyaa kaamaavar jaave laagel."
    pos: "phrase"
    notes: "The verb in -आवे with लागणे is 'have to', something you can't avoid: मला जावे लागले, I had to go."
  - id: mr-0645
    target: "तुम्ही इथे बसू शकता."
    native: "You may sit here."
    reading: "tumhii ithe basuu shaktaa."
    pos: "phrase"
    notes: "शकणे gives permission too. Simply बसा, please sit, is warmer."
  - id: mr-0646
    target: "इथे फोटो काढू नये."
    native: "You mustn't take photos here."
    reading: "ithe photo kaadhuu naye."
    pos: "phrase"
    notes: "-ऊ नये, 'one should not', the language of rules and notices. फोटो काढणे, to take a photo."
