  "title": "The train"
  "sentences":
  - "text": "ही गाडी पुण्याहून मुंबईला जाते."
    "reading": "hi gāḍi puṇyāhun mumbailā jāte."
    "ipa": "ɦi ɡaɖi puɳjaɦun mumbəila dzat̪e"
  - "text": "गाडी सकाळी सहा वाजता सुटते."
    "reading": "gāḍi sakāḷi sahā vājtā suṭte."
    "ipa": "ɡaɖi səkaɭi səɦa ʋadzt̪a suʈt̪e"
  - "text": "ती दुपारी बारा वाजता मुंबईला पोहोचते."
    "reading": "ti dupāri bārā vājtā mumbailā pohocte."
    "ipa": "t̪i d̪upari bara ʋadzt̪a mumbəila poɦotst̪e"
  - "text": "गाडी प्लॅटफॉर्म नंबर तीनवर आहे."
    "reading": "gāḍi plêṭphôrma nambar tinvar āhe."
    "ipa": "ɡaɖi plæʈpʰɔrmə nəmbər t̪inʋər aɦe"
  - "text": "गाडी दहा मिनिटे उशिरा आहे."
    "reading": "gāḍi dahā miniṭe uśirā āhe."
    "ipa": "ɡaɖi d̪əɦa miniʈe uʃira aɦe"
