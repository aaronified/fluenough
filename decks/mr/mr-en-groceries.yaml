    ipa: "masa"
    pos: "noun"
    gender: "m"
    notes: "Plural मासे (māse), which is what you buy: मासे आहेत का? (mase ahet ka?). On the coast, pomfret is पापलेट (pāpleṭ) and Bombay duck बोंबील (bombil)."
