cards:
  - id: mr-0390
    target: "भाजी"
    native: "vegetables; a vegetable dish"
    reading: "bhaajii"
    pos: "noun"
    gender: "f"
    notes: "Both the vegetables at the market and the dish made from them: बटाट्याची भाजी (bataatyaachii bhaajii), potato curry. A seller is a भाजीवाला (bhaajiivaalaa)."
  - id: mr-0391
    target: "कांदा"
    native: "onion"
    reading: "kaandaa"
    pos: "noun"
    gender: "m"
    notes: "Plural कांदे (kaande). Maharashtra grows much of India's onions, around Nashik."
  - id: mr-0392
    target: "बटाटा"
    native: "potato"
    reading: "bataataa"
    pos: "noun"
    gender: "m"
    notes: "From Portuguese batata, as in the वडा of वडापाव: बटाटावडा (bataataavadaa)."
  - id: mr-0393
    target: "टोमॅटो"
    native: "tomato"
    reading: "tomaeto"
    pos: "noun"
    gender: "m"
  - id: mr-0394
    target: "मासा"
    native: "fish"
    reading: "maasaa"
    pos: "noun"
    gender: "m"
    notes: "Plural मासे (maase), which is what you buy: मासे आहेत का? (maase aahet kaa?). On the coast, pomfret is पापलेट (paaplet) and Bombay duck बोंबील (bombiil)."
  - id: mr-0395
    target: "चिकन"
    native: "chicken (meat)"
    reading: "chikan"
    pos: "noun"
    gender: "n"
    notes: "Goat meat is मटण (matan)."
  - id: mr-0396
    target: "अंडे"
    native: "egg"
    reading: "ande"
    pos: "noun"
    gender: "n"
    notes: "Plural अंडी (andii): सहा अंडी द्या, six eggs, please. In speech also अंडं (andan)."
  - id: mr-0397
    target: "तांदूळ"
    native: "rice (uncooked)"
    reading: "taanduul"
    pos: "noun"
    gender: "m"
    notes: "Cooked rice is भात (bhaat)."
  - id: mr-0398
    target: "पीठ"
    native: "flour"
    reading: "piith"
    pos: "noun"
    gender: "n"
    notes: "गव्हाचे पीठ (gavhaache piith), wheat flour."
  - id: mr-0399
    target: "डाळ"
    native: "lentils; dal"
    reading: "daal"
    pos: "noun"
    gender: "f"
    notes: "Both the dry lentils and the dish. The everyday cooked dal is वरण (varan), and its spicier cousin आमटी (aamtii)."
  - id: mr-0400
    target: "साखर"
    native: "sugar"
    reading: "saakhar"
    pos: "noun"
    gender: "f"
  - id: mr-0401
    target: "मीठ"
    native: "salt"
    reading: "miith"
    pos: "noun"
    gender: "n"
  - id: mr-0402
    target: "तेल"
    native: "oil"
    reading: "tel"
    pos: "noun"
    gender: "n"
  - id: mr-0403
    target: "दूध"
    native: "milk"
    reading: "duudh"
    pos: "noun"
    gender: "n"
  - ref: mr-0056
    notes: "Fruit in general. A fruit seller is a फळवाला (phalvaalaa)."
  - id: mr-0404
    target: "आंबा"
    native: "mango"
    reading: "aambaa"
    pos: "noun"
    gender: "m"
    notes: "The anusvaar before ब is said m. The famous Alphonso of the Konkan coast is हापूस (haapuus)."
  - id: mr-0405
    target: "केळे"
    native: "banana"
    reading: "kele"
    pos: "noun"
    gender: "n"
    notes: "In speech केळं (kelan). Plural केळी (kelii), and bananas are sold by the dozen, डझन (dajhan)."
  - id: mr-0406
    target: "मिरची"
    native: "chilli"
    reading: "mirchii"
    pos: "noun"
    gender: "f"
    notes: "हिरवी मिरची (hirvii mirchii), green chilli."
