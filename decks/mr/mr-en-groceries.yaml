cards:
  - id: mr-0390
    target: "भाजी"
    native: "vegetables; a vegetable dish"
    reading: "bhaji"
    pos: "noun"
    gender: "f"
    notes: "Both the vegetables at the market and the dish made from them: बटाट्याची भाजी (batatyachi bhaji), potato curry. A seller is a भाजीवाला (bhajivala)."
  - id: mr-0391
    target: "कांदा"
    native: "onion"
    reading: "kanda"
    pos: "noun"
    gender: "m"
    notes: "Plural कांदे (kande). Maharashtra grows much of India's onions, around Nashik."
  - id: mr-0392
    target: "बटाटा"
    native: "potato"
    reading: "batata"
    pos: "noun"
    gender: "m"
    notes: "From Portuguese batata, as in the वडा of वडापाव: बटाटावडा (batatavada)."
  - id: mr-0393
    target: "टोमॅटो"
    native: "tomato"
    reading: "tomato"
    pos: "noun"
    gender: "m"
  - id: mr-0394
    target: "मासा"
    native: "fish"
    reading: "masa"
    pos: "noun"
    gender: "m"
    notes: "Plural मासे (mase), which is what you buy: मासे आहेत का? (mase ahet ka?). On the coast, pomfret is पापलेट (paplet) and Bombay duck बोंबील (bombil)."
  - id: mr-0395
    target: "चिकन"
    native: "chicken (meat)"
    reading: "chikan"
    pos: "noun"
    gender: "n"
    notes: "Goat meat is मटण (matan)."
  - id: mr-0396
    target: "अंडे"
    native: "egg"
    reading: "ande"
    pos: "noun"
    gender: "n"
    notes: "Plural अंडी (andi): सहा अंडी द्या, six eggs, please. In speech also अंडं (anda)."
  - id: mr-0397
    target: "तांदूळ"
    native: "rice (uncooked)"
    reading: "tandul"
    pos: "noun"
    gender: "m"
    notes: "Cooked rice is भात (bhat)."
  - id: mr-0398
    target: "पीठ"
    native: "flour"
    reading: "pith"
    pos: "noun"
    gender: "n"
    notes: "गव्हाचे पीठ (gavhache pith), wheat flour."
  - id: mr-0399
    target: "डाळ"
    native: "lentils; dal"
    reading: "dal"
    pos: "noun"
    gender: "f"
    notes: "Both the dry lentils and the dish. The everyday cooked dal is वरण (varan), and its spicier cousin आमटी (amti)."
  - id: mr-0400
    target: "साखर"
    native: "sugar"
    reading: "sakhar"
    pos: "noun"
    gender: "f"
  - id: mr-0401
    target: "मीठ"
    native: "salt"
    reading: "mith"
    pos: "noun"
    gender: "n"
  - id: mr-0402
    target: "तेल"
    native: "oil"
    reading: "tel"
    pos: "noun"
    gender: "n"
  - id: mr-0403
    target: "दूध"
    native: "milk"
    reading: "dudh"
    pos: "noun"
    gender: "n"
  - ref: mr-0056
    notes: "Fruit in general. A fruit seller is a फळवाला (phalvala)."
  - id: mr-0404
    target: "आंबा"
    native: "mango"
    reading: "amba"
    pos: "noun"
    gender: "m"
    notes: "The anusvar before ब is said m. The famous Alphonso of the Konkan coast is हापूस (hapus)."
  - id: mr-0405
    target: "केळे"
    native: "banana"
    reading: "kele"
    pos: "noun"
    gender: "n"
    notes: "In speech केळं (kela). Plural केळी (keli), and bananas are sold by the dozen, डझन (dajhan)."
  - id: mr-0406
    target: "मिरची"
    native: "chilli"
    reading: "mirchi"
    pos: "noun"
    gender: "f"
    notes: "हिरवी मिरची (hirvi mirchi), green chilli."
