cards:
  - id: mr-0390
    target: "भाजी"
    native: "vegetables; a vegetable dish"
    reading: "bhāji"
    ipa: "bʱadʒi"
    pos: "noun"
    gender: "f"
    notes: "Both the vegetables at the market and the dish made from them: बटाट्याची भाजी (baṭāṭyāci bhāji), potato curry. A seller is a भाजीवाला (bhājivālā)."
