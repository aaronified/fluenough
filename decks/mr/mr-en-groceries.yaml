    native: "onion"
    picture: "🧅"
    reading: "kāndā"
    ipa: "kand̪a"
    pos: "noun"
    gender: "m"
    notes: "Plural कांदे (kānde). Maharashtra grows much of India's onions, around Nashik."
  - id: mr-0392
    target: "बटाटा"
    native: "potato"
    picture: "🥔"
    reading: "baṭāṭā"
    ipa: "bəʈaʈa"
    pos: "noun"
    gender: "m"
    notes: "From Portuguese batata, as in the वडा (vaḍā) of वडापाव (vaḍāpāv): बटाटावडा (baṭāṭāvaḍā)."
