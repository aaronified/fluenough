  "sentences":
  - "text": "मी सकाळी बसने ऑफिसला जातो."
    "reading": "mi sakāḷi basne ôphislā jāto."
    "ipa": "mi səkaɭi bəsne ɔpʰisla dzat̪o"
  - "text": "बस चालत असताना मी पुस्तक वाचतो."
    "reading": "bas cālat astānā mi pustak vācto."
    "ipa": "bəs tsalət̪ əst̪ana mi pust̪ək ʋatst̪o"
  - "text": "रस्त्यावर गर्दी असताना बस हळू चालते."
    "reading": "rastyāvar gardi astānā bas haḷu cālte."
    "ipa": "rəst̪jaʋər ɡərd̪i əst̪ana bəs ɦəɭu tsalt̪e"
  - "text": "एका स्टॉपवर एक आजी चढली."
    "reading": "ekā sṭôpvar ek āji caḍhli."
    "ipa": "eka sʈɔpʋər ek adʒi tsəɖʱli"
  - "text": "मी माझी जागा त्यांना दिली."
    "reading": "mi mājhi jāgā tyānnā dili."
    "ipa": "mi madʒʱi dzaɡa t̪janna d̪ili"
  - "text": "ऑफिस आल्यावर मी उतरतो."
    "reading": "ôphis ālyāvar mi utrto."
    "ipa": "ɔpʰis aljaʋər mi ut̪rt̪o"
