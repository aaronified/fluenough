schema: 1
id: mr-en-grammar-questions
name: "Basic questions"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Yes-or-no questions with का at the end, and question words in the middle, before the verb. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: mr-0181
    target: "तुम्ही मराठी बोलता का?"
    native: "Do you speak Marathi?"
    reading: "tumhii maraathii boltaa kaa?"
    pos: "phrase"
    notes: "A yes-or-no question: the statement with का at the end."
  - id: mr-0182
    target: "तुमचे नाव काय आहे?"
    native: "What is your name?"
    reading: "tumche naav kaay aahe?"
    pos: "phrase"
    notes: "The question word stands where the answer would: माझे नाव अनिता आहे, my name is Anita."
  - id: mr-0183
    target: "तुम्ही कुठे राहता?"
    native: "Where do you live?"
    reading: "tumhii kuthe raahtaa?"
    pos: "phrase"
  - id: mr-0184
    target: "किती वाजले?"
    native: "What time is it?"
    reading: "kitii vaajle?"
    pos: "phrase"
    notes: "Literally 'how many have struck?', of the clock."
  - id: mr-0185
    target: "हा कोण आहे?"
    native: "Who is this? (a man)"
    reading: "haa kon aahe?"
    pos: "phrase"
    notes: "Of a woman: ही कोण आहे? (hii kon aahe?)."
  - id: mr-0186
    target: "बस कधी येईल?"
    native: "When will the bus come?"
    reading: "bas kadhii yeiil?"
    pos: "phrase"
  - id: mr-0187
    target: "तुम्ही का आलात?"
    native: "Why have you come?"
    reading: "tumhii kaa aalaat?"
    pos: "phrase"
    notes: "का in the middle, before the verb, is 'why'; at the end it only makes a question. Said bluntly, this can sound rude: कसं काय येणं केलंत? (kasan kaay yenan kelant?) is the gentle way."
  - id: mr-0188
    target: "याची किंमत किती आहे?"
    native: "How much does this cost?"
    reading: "yaachii kimmat kitii aahe?"
    pos: "phrase"
    notes: "'Its price how much is?'. At a stall, simply हे कितीला? (he kitiilaa?)."
  - id: mr-0189
    target: "चहा घेणार का?"
    native: "Will you have some tea?"
    reading: "chahaa ghenaar kaa?"
    pos: "phrase"
    notes: "Literally 'will you take tea?'. Asked of every guest; saying no once is polite, and it will be offered again."
  - id: mr-0190
    target: "कोणती बस स्टेशनला जाते?"
    native: "Which bus goes to the station?"
    reading: "kontii bas steshanlaa jaate?"
    pos: "phrase"
    notes: "कोणती agrees with बस, which is feminine."
  - id: mr-0191
    target: "जेवण झाले का?"
    native: "Have you eaten?"
    reading: "jevan jhaale kaa?"
    pos: "phrase"
    notes: "Literally 'has the meal happened?', asked as a friendly greeting around mealtimes. In speech, जेवण झालं का? (jevan jhaalan kaa?)."
