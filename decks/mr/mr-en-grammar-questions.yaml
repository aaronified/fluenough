schema: 1
id: mr-en-grammar-questions
name: "Basic questions"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Yes-or-no questions with का at the end, and question words in the middle, before the verb. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: mr-0181
    target: "तुम्ही मराठी बोलता का?"
    native: "Do you speak Marathi?"
    reading: "tumhi marāṭhi boltā kā?"
    ipa: "t̪umɦi məraʈʰi bolt̪a ka"
    pos: "phrase"
    notes: "A yes-or-no question: the statement with का at the end."
  - id: mr-0182
    target: "तुमचे नाव काय आहे?"
    native: "What is your name?"
    reading: "tumce nāv kāy āhe?"
    ipa: "t̪umtʃe naʋ kaj aɦe"
    pos: "phrase"
    notes: "The question word stands where the answer would: माझे नाव अनिता आहे, my name is Anita."
  - id: mr-0183
    target: "तुम्ही कुठे राहता?"
    native: "Where do you live?"
    reading: "tumhi kuṭhe rāhtā?"
    ipa: "t̪umɦi kuʈʰe raɦt̪a"
    pos: "phrase"
  - id: mr-0184
    target: "किती वाजले?"
    native: "What time is it?"
    reading: "kiti vājle?"
    ipa: "kit̪i ʋadzle"
    pos: "phrase"
    notes: "Literally 'how many have struck?', of the clock."
  - id: mr-0185
    target: "हा कोण आहे?"
    native: "Who is this? (a man)"
    reading: "hā koṇ āhe?"
    ipa: "ɦa koɳ aɦe"
    pos: "phrase"
    notes: "Of a woman: ही कोण आहे? (hi kon ahe?)."
  - id: mr-0186
    target: "बस कधी येईल?"
    native: "When will the bus come?"
    reading: "bas kadhi yeil?"
    ipa: "bəs kəd̪ʱi jeil"
    pos: "phrase"
  - id: mr-0187
    target: "तुम्ही का आलात?"
    native: "Why have you come?"
    reading: "tumhi kā ālāt?"
    ipa: "t̪umɦi ka alat̪"
    pos: "phrase"
    notes: "का in the middle, before the verb, is 'why'; at the end it only makes a question. Said bluntly, this can sound rude: कसं काय येणं केलंत? (kasa kay yena kelant?) is the gentle way."
  - id: mr-0188
    target: "याची किंमत किती आहे?"
    native: "How much does this cost?"
    reading: "yāci kimmat kiti āhe?"
    ipa: "jatʃi kimmət̪ kit̪i aɦe"
    pos: "phrase"
    notes: "'Its price how much is?'. At a stall, simply हे कितीला? (he kitila?)."
  - id: mr-0189
    target: "चहा घेणार का?"
    native: "Will you have some tea?"
    reading: "cahā gheṇār kā?"
    ipa: "tsəɦa ɡʱeɳar ka"
    pos: "phrase"
    notes: "Literally 'will you take tea?'. Asked of every guest; saying no once is polite, and it will be offered again."
  - id: mr-0190
    target: "कोणती बस स्टेशनला जाते?"
    native: "Which bus goes to the station?"
    reading: "koṇti bas sṭeśanlā jāte?"
    ipa: "koɳt̪i bəs sʈeʃənla dzat̪e"
    pos: "phrase"
    notes: "कोणती agrees with बस, which is feminine."
  - id: mr-0191
    target: "जेवण झाले का?"
    native: "Have you eaten?"
    reading: "jevaṇ jhāle kā?"
    ipa: "dʒeʋəɳ dzʱale ka"
    pos: "phrase"
    notes: "Literally 'has the meal happened?', asked as a friendly greeting around mealtimes. In speech, जेवण झालं का? (jevan jhala ka?)."
