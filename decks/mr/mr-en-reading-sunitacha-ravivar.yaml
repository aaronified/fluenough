schema: 1
id: mr-en-reading-sunitacha-ravivar
name: "Reading: Sunita's Sunday"
kind: reading
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
source: "Written for this deck and released under CC0"
description: "सुनीताचा रविवार, Sunita's Sunday: a short story in three scenes, written for this deck in everyday Marathi and released under CC0. Sunita goes to the market for her grandmother, bargains for onions, and buys vada pav on the way home. The glossary gives the words the theme decks don't teach. Not yet checked by a Marathi speaker: please report any mistake."
tags: [reading, unreviewed]
passages:
  - id: mr-ravivar-01
    title: "Sunday morning"
    theme: daily-life
    sentences:
      - text: "आज रविवार आहे."
        reading: "āj ravivār āhe."
        ipa: "adz rəʋiʋar aɦe"
      - text: "सुनीता सात वाजता उठते."
        reading: "sunitā sāt vājtā uṭhte."
        ipa: "sunit̪a sat̪ ʋadzt̪a uʈʰt̪e"
      - text: "ती चहा करते आणि आजीला देते."
        reading: "ti cahā karte āṇi ājilā dete."
        ipa: "t̪i tsəɦa kərt̪e aɳi adʒila d̪et̪e"
      - text: "आजी म्हणते, “आज बाजारात जा. घरात भाजी नाही.”"
        reading: "āji mhaṇte, 'āj bājārāt jā. gharāt bhāji nāhi.'"
        ipa: "adʒi mɦəɳt̪e adz badzarat̪ dza ɡʱərat̪ bʱadʒi naɦi"
      - text: "सुनीता पिशवी घेते आणि बाहेर जाते."
        reading: "sunitā piśvi ghete āṇi bāher jāte."
        ipa: "sunit̪a piʃʋi ɡʱet̪e aɳi baɦer dzat̪e"
    glossary:
      - word: "सुनीता"
        modern: "सुनीता"
        reading: "sunitā"
        ipa: "sunit̪a"
        meaning: { en: "Sunita, a woman's name" }
      - word: "बाहेर"
        modern: "बाहेर"
        reading: "bāher"
        ipa: "baɦer"
        meaning: { en: "out; outside" }
    questions:
      - id: mr-0656
        prompt: { en: "What day is it?" }
        options:
          - { en: "Monday" }
          - { en: "Sunday" }
          - { en: "Saturday" }
        answer: 2
      - id: mr-0657
        prompt: { en: "Sunita makes tea for her grandmother." }
        answer: true
      - id: mr-0658
        prompt: { en: "Why does Sunita go to the market?" }
        options:
          - { en: "There are no vegetables at home." }
          - { en: "Her grandmother is ill." }
          - { en: "She wants to see a film." }
        answer: 1
  - id: mr-ravivar-02
    title: "At the market"
    theme: market
    sentences:
      - text: "बाजारात खूप गर्दी आहे."
        reading: "bājārāt khup gardi āhe."
        ipa: "badzarat̪ kʰup ɡərd̪i aɦe"
      - text: "सुनीता भाजीवाल्या काकांना विचारते, “कांदे किती रुपये किलो?”"
        reading: "sunitā bhājivālyā kākānnā vicārte, 'kānde kiti rupaye kilo?'"
        ipa: "sunit̪a bʱadʒiʋalja kakanna ʋitsart̪e kand̪e kit̪i rupəje kilo"
      - text: "काका म्हणतात, “चाळीस रुपये.”"
        reading: "kākā mhaṇtāt, 'cāḷis rupaye.'"
        ipa: "kaka mɦəɳt̪at̪ tsaɭis rupəje"
      - text: "“खूप महाग आहे! थोडे कमी करा.”"
        reading: "'khup mahāg āhe! thoḍe kami karā.'"
        ipa: "kʰup məɦaɡ aɦe t̪ʰoɖe kəmi kəra"
      - text: "काका हसतात आणि पस्तीस रुपये घेतात."
        reading: "kākā hastāt āṇi pastis rupaye ghetāt."
        ipa: "kaka ɦəst̪at̪ aɳi pəst̪is rupəje ɡʱet̪at̪"
      - text: "सुनीता दोन किलो कांदे आणि एक किलो बटाटे घेते."
        reading: "sunitā don kilo kānde āṇi ek kilo baṭāṭe ghete."
        ipa: "sunit̪a d̪on kilo kand̪e aɳi ek kilo bəʈaʈe ɡʱet̪e"
    glossary:
      - word: "गर्दी"
        modern: "गर्दी"
        reading: "gardi"
        ipa: "ɡərd̪i"
        meaning: { en: "a crowd; crowded" }
      - word: "भाजीवाल्या काकांना"
        modern: "भाजीवाले काका"
        reading: "bhājivāle kākā"
        ipa: "bʱadʒiʋale kaka"
        meaning: { en: "(to) the vegetable seller" }
        note: { en: "भाजी, vegetables, with -वाला, the one who sells them. An older man is काका, and spoken of politely in the plural, so -ला becomes -ना: काकांना, to him." }
      - word: "विचारते"
        modern: "विचारते"
        reading: "vicārte"
        ipa: "ʋitsart̪e"
        meaning: { en: "asks" }
        note: { en: "from विचारणे, to ask" }
      - word: "हसतात"
        modern: "हसतात"
        reading: "hastāt"
        ipa: "ɦəst̪at̪"
        meaning: { en: "laughs (said of him in the polite plural)" }
        note: { en: "from हसणे, to laugh" }
    questions:
      - id: mr-0659
        prompt: { en: "What does the seller first ask for a kilo of onions?" }
        options:
          - { en: "35 rupees" }
          - { en: "40 rupees" }
          - { en: "50 rupees" }
        answer: 2
      - id: mr-0660
        prompt: { en: "Sunita bargains with the seller." }
        answer: true
      - id: mr-0661
        prompt: { en: "What does Sunita buy?" }
        options:
          - { en: "Onions and potatoes" }
          - { en: "Onions and mangoes" }
          - { en: "Fish" }
        answer: 1
  - id: mr-ravivar-03
    title: "Vada pav"
    theme: eating-out
    sentences:
      - text: "घरी जाताना सुनीताला भूक लागते."
        reading: "ghari jātānā sunitālā bhuk lāgte."
        ipa: "ɡʱəri dzat̪ana sunit̪ala bʱuk laɡt̪e"
      - text: "रस्त्यावर एक वडापावची गाडी आहे."
        reading: "rastyāvar ek vaḍāpāvci gāḍi āhe."
        ipa: "rəst̪jaʋər ek ʋəɖapaʋtʃi ɡaɖi aɦe"
      - text: "ती दोन वडापाव घेते."
        reading: "ti don vaḍāpāv ghete."
        ipa: "t̪i d̪on ʋəɖapaʋ ɡʱet̪e"
      - text: "एक वडापाव ती खाते आणि एक आजीसाठी घेऊन जाते."
        reading: "ek vaḍāpāv ti khāte āṇi ek ājisāṭhi gheun jāte."
        ipa: "ek ʋəɖapaʋ t̪i kʰat̪e aɳi ek adʒisaʈʰi ɡʱeun dzat̪e"
      - text: "आजी म्हणते, “वा! खूप छान!”"
        reading: "āji mhaṇte, 'vā! khup chān!'"
        ipa: "adʒi mɦəɳt̪e ʋa kʰup tʃʰan"
    glossary:
      - word: "जाताना"
        modern: "जाताना"
        reading: "jātānā"
        ipa: "dzat̪ana"
        meaning: { en: "while going; on the way" }
        note: { en: "the stem with -ताना is 'while doing'" }
      - word: "सुनीताला"
        modern: "सुनीताला"
        reading: "sunitālā"
        ipa: "sunit̪ala"
        meaning: { en: "to Sunita" }
        note: { en: "hunger 'strikes' the one who feels it, who takes -ला: मला भूक लागते, I get hungry" }
      - word: "वा"
        modern: "वा"
        reading: "vā"
        ipa: "ʋa"
        meaning: { en: "wow; how lovely" }
    questions:
      - id: mr-0662
        prompt: { en: "Why does Sunita stop on the way home?" }
        options:
          - { en: "She is hungry." }
          - { en: "It is raining." }
          - { en: "She meets a friend." }
        answer: 1
      - id: mr-0663
        prompt: { en: "How many vada pavs does she buy?" }
        options:
          - { en: "One" }
          - { en: "Two" }
          - { en: "Three" }
        answer: 2
      - id: mr-0664
        prompt: { en: "Grandmother doesn't like the vada pav." }
        answer: false
