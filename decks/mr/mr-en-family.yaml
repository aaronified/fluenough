schema: 1
id: mr-en-family
name: "Family"
kind: vocab
theme: family
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Parents, brothers and sisters, grandparents, and the aunts and uncles on each side, each with its own word. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0217
    target: "आई"
    native: "mother"
    reading: "āi"
    ipa: "ai"
    pos: "noun"
    gender: "f"
    notes: "Most children call their mother आई, and say तू to her."
  - id: mr-0218
    target: "वडील"
    native: "father"
    reading: "vaḍil"
    ipa: "ʋəɖil"
    pos: "noun"
    gender: "m"
    notes: "Respectful, and plural in form: माझे वडील (mājhe vaḍil), my father. Speaking to him, most say बाबा."
  - id: mr-0219
    target: "बाबा"
    native: "dad; father"
    reading: "bābā"
    ipa: "baba"
    pos: "noun"
    gender: "m"
  - id: mr-0220
    target: "भाऊ"
    native: "brother"
    reading: "bhāu"
    ipa: "bʱau"
    pos: "noun"
    gender: "m"
    notes: "An elder brother is called दादा. In many places भाऊ is also any man, and a title after a name."
  - id: mr-0221
    target: "बहीण"
    native: "sister"
    reading: "bahiṇ"
    ipa: "bəɦiɳ"
    pos: "noun"
    gender: "f"
    notes: "An elder sister is called ताई. Plural: बहिणी (bahiṇi)."
  - id: mr-0222
    target: "मुलगा"
    native: "son; boy"
    reading: "mulgā"
    ipa: "mulɡa"
    pos: "noun"
    gender: "m"
    notes: "Plural मुलगे (mulge)."
  - id: mr-0223
    target: "मुलगी"
    native: "daughter; girl"
    reading: "mulgi"
    ipa: "mulɡi"
    pos: "noun"
    gender: "f"
    notes: "Plural मुली (muli)."
  - id: mr-0224
    target: "मूल"
    native: "child"
    reading: "mul"
    ipa: "mul"
    pos: "noun"
    gender: "n"
    notes: "Neuter, boy or girl. Plural मुले (mule), in speech मुलं (mulam̐): तुम्हाला मुले आहेत का? Do you have children?"
  - id: mr-0225
    target: "आई-वडील"
    native: "parents"
    reading: "āi-vaḍil"
    ipa: "aiʋəɖil"
    pos: "noun"
    gender: "m"
    notes: "'Mother-father', plural: माझे आई-वडील पुण्यात राहतात, my parents live in Pune."
  - id: mr-0226
    target: "नवरा"
    native: "husband"
    reading: "navrā"
    ipa: "nəʋra"
    pos: "noun"
    gender: "m"
    notes: "Formally पती (pati)."
  - id: mr-0227
    target: "बायको"
    native: "wife"
    reading: "bāyko"
    ipa: "bajko"
    pos: "noun"
    gender: "f"
    notes: "Formally पत्नी (patni)."
  - ref: mr-0197
    notes: "Grandmother on either side: Marathi does not tell them apart."
  - ref: mr-0198
    notes: "Grandfather on either side."
  - ref: mr-0194
    notes: "Your father's brother. Your mother's brother is मामा."
  - ref: mr-0195
    notes: "काकाची बायको, the wife of your father's brother."
  - id: mr-0228
    target: "आत्या"
    native: "aunt (father's sister)"
    reading: "ātyā"
    ipa: "at̪ja"
    pos: "noun"
    gender: "f"
  - id: mr-0229
    target: "मामा"
    native: "uncle (mother's brother)"
    reading: "māmā"
    ipa: "mama"
    pos: "noun"
    gender: "m"
  - id: mr-0230
    target: "मामी"
    native: "aunt (mother's brother's wife)"
    reading: "māmi"
    ipa: "mami"
    pos: "noun"
    gender: "f"
  - ref: mr-0196
    notes: "Your mother's sister. Her husband is your काका too, or मावसा (māvsā)."
  - id: mr-0231
    target: "कुटुंब"
    native: "family"
    reading: "kuṭumb"
    ipa: "kuʈumb"
    pos: "noun"
    gender: "n"
    notes: "In speech also घरचे (gharce), 'the people of the house'."
  - id: mr-0232
    target: "सासू"
    native: "mother-in-law"
    reading: "sāsu"
    ipa: "sasu"
    pos: "noun"
    gender: "f"
  - id: mr-0233
    target: "सासरे"
    native: "father-in-law"
    reading: "sāsre"
    ipa: "sasre"
    pos: "noun"
    gender: "m"
    notes: "Respectful and plural in form, like वडील."
