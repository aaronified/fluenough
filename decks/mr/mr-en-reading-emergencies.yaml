  "sentences":
  - "text": "सूचना: आपत्कालीन परिस्थितीत शांत राहा."
    "reading": "sucnā: āpatkālin paristhitit śānt rāhā."
    "ipa": "sutsna apət̪kalin pərist̪ʰit̪it̪ ʃant̪ raɦa"
  - "text": "आग लागली तर लिफ्ट वापरू नका."
    "reading": "āg lāgli tar liphṭ vāpru nakā."
    "ipa": "aɡ laɡli t̪ər lipʰʈ ʋapru nəka"
  - "text": "जिना वापरा."
    "reading": "jinā vāprā."
    "ipa": "dʒina ʋapra"
  - "text": "शांतपणे बाहेर पडा."
    "reading": "śāntapṇe bāher paḍā."
    "ipa": "ʃant̪əpɳe baɦer pəɖa"
  - "text": "आपत्कालीन क्रमांक लक्षात ठेवा."
    "reading": "āpatkālin kramāṅk lakṣāt ṭhevā."
    "ipa": "apət̪kalin krəmaŋk ləkʂat̪ ʈʰeʋa"
