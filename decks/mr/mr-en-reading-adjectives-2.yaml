  "sentences":
  - "text": "खोली भाड्याने देणे आहे."
    "reading": "kholi bhāḍyāne deṇe āhe."
    "ipa": "kʰoli bʱaɖjane d̪eɳe aɦe"
  - "text": "खोली मोठी आहे आणि शांत आहे."
    "reading": "kholi moṭhi āhe āṇi śānt āhe."
    "ipa": "kʰoli moʈʰi aɦe aɳi ʃant̪ aɦe"
  - "text": "खोलीत पाण्याची सोय आहे."
    "reading": "kholit pāṇyāci soy āhe."
    "ipa": "kʰolit̪ paɳjatʃi soj aɦe"
  - "text": "भाडे दरमहा पाच हजार रुपये आहे."
    "reading": "bhāḍe darmhā pāc hajār rupye āhe."
    "ipa": "bʱaɖe d̪ərmɦa pats ɦədzar rupje aɦe"
  - "text": "संपर्कासाठी फोन करा."
    "reading": "samparkāsāṭhi phon karā."
    "ipa": "səmpərkasaʈʰi pʰon kəra"
