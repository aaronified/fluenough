kind: "layer"
core: "mr-grammar-gender-number"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Gender and number"
license: "CC0-1.0"
description: "Three genders, masculine, feminine and neuter, and the plural of each. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0222":
    notes:
      "n1": "Masculine. Most nouns in -आ (-ā) are masculine, and their describing words and verbs take -आ (-ā): मोठा मुलगा आला (moṭhā mulgā ālā), the big boy came."
  "mr-0223":
    notes:
      "n1": "Feminine. Most nouns in -ई (-i) are feminine, and take -ई (-i): मोठी मुलगी आली (moṭhi mulgi āli), the big girl came."
  "mr-0224":
    notes:
      "n1": "Neuter. A third gender English and Hindi lack, for a child, a baby (बाळ), and many things: घर (ghar), पुस्तक (pustak), पाणी (pāṇi). It takes -ए (-e): मोठे मूल आले (moṭhe mul āle), the big child came."
  "mr-0407":
    native: "boys; sons"
    notes:
      "n1": "A masculine -आ (-ā) becomes -ए (-e) in the plural: मुलगा (mulgā), मुलगे (mulge); रस्ता (rastā), रस्ते (raste). A masculine noun ending in a consonant does not change: एक देश (ek deś), दोन देश (don deś)."
  "mr-0408":
    native: "girls; daughters"
    notes:
      "n1": "Feminine nouns form plurals several ways: मुलगी (mulgi), मुली (muli); खोली (kholi), खोल्या (kholyā); बहीण (bahiṇ), बहिणी (bahiṇi); शाळा (śāḷā) stays शाळा (śāḷā)."
  "mr-0409":
    native: "children; boys"
    notes:
      "n1": "The plural of मूल (mul), and a mixed group: in speech मुलं (mulam̐). A neuter noun ending in a consonant adds -ए (-e), said as a nasal a in speech: घरे (ghare), घरं (gharam̐), houses."
  "mr-0410":
    native: "books"
    notes:
      "n1": "Neuter plural. A describing word before it takes -ई (-i): नवी पुस्तके (navi pustake), new books."
