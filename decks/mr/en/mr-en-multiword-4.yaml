name: "Multi-word verbs: idiomatic phrases"
description: "Fifteen idiomatic verb phrases, each a word plus a verb whose sense is not the sum of its parts, such as वेड (veḍ) लागणे (lāgṇe), to go mad. Each meaning is the one its dictionary or encyclopaedia page gives. Not yet checked by a Marathi speaker: please report any mistake."
