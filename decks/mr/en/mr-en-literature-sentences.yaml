cards:
  "mr-6038":
    native: "This novel is very good."
    bases: { "ही": "this", "आहे": "is" }
    confusables: { "w1": { why: "This, for a masculine noun: हा (hā) goes with masculine nouns; कादंबरी (kādambari) is feminine." }, "f1": { why: "Plural: आहेत (āhet) is for more than one thing." } }
  "mr-6039":
    native: "The author wrote a new book."
    bases: { "लेखकाने": "the author", "लिहिला": "wrote" }
    confusables: { "w1": { why: "Publisher, not author: प्रकाशक (prakāśak) prints books but does not write them." }, "f1": { why: "Feminine: लिहिली (lihili) agrees with a feminine noun; ग्रंथ (granth) is masculine, so लिहिला (lihilā)." } }
  "mr-6040":
    native: "Read the first page of this book."
    bases: { "या": "this", "ग्रंथाचे": "of this book", "पहिले": "first", "वाचा": "read" }
    confusables: { "w1": { why: "Title, not page: शीर्षक (śirṣak) is the title." }, "f1": { why: "I read: वाचतो (vācto) is a statement; वाचा (vācā) is an order." } }
  "mr-6041":
    native: "The story's ending was bad."
    bases: { "गोष्टीचा": "of the story", "शेवट": "end", "होता": "was" }
    confusables: { "w1": { why: "Collection of stories, not one story: कथासंग्रह (kathāsaṅgrah) is a book of many stories." }, "f1": { why: "Feminine: होती (hoti) agrees with a feminine noun; शेवट (śevaṭ) is masculine, so होता (hotā)." } }
  "mr-6042":
    native: "Where can I get the poetry collection?"
    bases: { "मिळेल": "will get" }
    confusables: { "w1": { why: "Story collection, not poems: कथासंग्रह (kathāsaṅgrah) collects stories." }, "f1": { why: "Past: मिळाला (miḷālā) means got; मिळेल (miḷel) is future." } }
  "mr-6043":
    native: "Who published this book?"
    bases: { "कोणी": "who", "प्रकाशित": "published", "केला": "did" }
    confusables: { "w1": { why: "Where, not who: कुठे (kuṭhe) asks where." }, "f1": { why: "Feminine: केली (keli) agrees with a feminine noun; ग्रंथ (granth) is masculine, so केला (kelā)." } }
  "mr-6044":
    native: "The novel has many characters."
    bases: { "कादंबरीत": "in the novel", "अनेक": "many", "आहेत": "are" }
    confusables: { "w1": { why: "Made up, not character: कल्पित (kalpit) means imagined." }, "f1": { why: "Singular: आहे (āhe) is for one thing; पात्र (pātra) is plural here." } }
  "mr-6045":
    native: "The style of this story is simple."
    bases: { "या": "this", "कथेची": "of this story", "साधी": "simple", "आहे": "is" }
    confusables: { "w1": { why: "Description, not style: वर्णन (varṇan) means description." }, "f1": { why: "Masculine: साधा (sādhā) fits a masculine noun; शैली (śaili) is feminine, so साधी (sādhi)." } }
  "mr-6046":
    native: "The author's next novel will come out soon."
    bases: { "लेखकाची": "of the author", "पुढची": "next", "येईल": "will come" }
    confusables: { "w1": { why: "Publisher, who releases the book: प्रकाशक (prakāśak) is the publisher." }, "f1": { why: "Past: आली (āli) means came; येईल (yeil) is future." } }
  "mr-6047":
    native: "He translated a poem for me."
    bases: { "त्याने": "he", "माझ्यासाठी": "for me", "कवितेचा": "of a poem", "केला": "did" }
    confusables: { "w1": { why: "Translator, the person, not the work: अनुवादक (anuvādak) is the person who translates." }, "f1": { why: "Feminine: केली (keli) agrees with a feminine noun; अनुवाद (anuvād) is masculine, so केला (kelā)." } }
  "mr-6048":
    native: "The author describes the characters."
    bases: { "पात्रांचे": "of the characters", "वर्णन": "description", "करतो": "does" }
    confusables: { "w1": { why: "Idea or imagination, not description: कल्पना (kalpanā) is an idea." }, "f1": { why: "Feminine: करते (karte) fits a feminine subject; लेखक (lekhak) is masculine, so करतो (karto)." } }
  "mr-6049":
    native: "I read this true story."
    bases: { "ही": "this", "वाचली": "read" }
    confusables: { "w1": { why: "Made up, not true: कल्पित (kalpit) means imagined." }, "f1": { why: "Masculine: वाचला (vāclā) fits a masculine noun; सत्यकथा (satyakthā) is feminine, so वाचली (vācli)." } }
  "mr-6050":
    native: "Read the next chapter."
    bases: { "पुढचा": "next", "वाचा": "read" }
    confusables: { "w1": { why: "Page, not chapter: पृष्ठ (pruṣṭh) is one page." }, "f1": { why: "I read: वाचतो (vācto) is a statement; वाचा (vācā) is an order." } }
