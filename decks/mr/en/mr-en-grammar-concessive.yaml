native: { code: "en", iso639_3: "eng", name: "English" }
name: "Even though: even though I went, despite going"
license: "CC-BY-SA-4.0"
description: "Even though it rained I went, despite the tiredness I came: saying that something happened even though it was hard. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "Concessive: the past with तरी (tarī) and the -ऊनही (ūnahī) form"
  slot_name: "form"
  prompt: "{lemma} ({gloss}), {slot}"
  slots: { "तरी": "even though (past + तरी (tarī))", "-ऊनही": "despite doing (-ūnahī)" }
  entries:
    "jaane": "to go"
    "yene": "to come"
    "karne": "to do"
    "khaane": "to eat"
    "pine": "to drink"
    "vachne": "to read"
    "bolne": "to speak"
    "paahne": "to see"
    "dene": "to give"
    "ghene": "to take"
  notes: "Even though something is so, say the past with तरी (tarī): जरी पाऊस पडत होता तरी मी गेलो (jarī pāūs paḍat hotā tarī mī gelo), even though it was raining, I went. The जरी (jarī) and तरी (tarī) pair goes round the clause. The -ऊनही (-ūnahī) form means despite doing it, with the same doer: तो रात्रभर जागून ही शाळेत आला (to rātrabhar jāgūn hī śāḷet ālā), he came to school despite staying awake all night. A plain तरी (tarī) also means still or nevertheless: तरी मी जाईन (tarī mī jāīn), still I will go."
