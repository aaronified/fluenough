schema: 1
id: "mr-en-describing"
kind: "layer"
core: "mr-describing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing things and feelings"
license: "CC-BY-SA-4.0"
description: "How things and people are: their size, their age, how they feel. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-0758":
    native: "nice; fine; good"
    notes:
      "n1": "A short answer, छान (chān), means great."
    examples:
      "हे पुस्तक छान आहे.": { native: "This book is nice.", bases: { "आहे": "to be" } }
      "तुमचे नाव छान आहे.": { native: "Your name is nice.", bases: { "तुमचे": "your", "आहे": "to be" } }
  "mr-0759":
    native: "good"
    notes:
      "n1": "Its neuter form चांगले (cāṅgale) is also the adverb 'well': ती चांगले गाते (ti cāṅgale gāte), she sings well."
    examples:
      "तो चांगला माणूस आहे.": { native: "He is a good man.", bases: { "आहे": "to be" } }
      "ती चांगली मुलगी आहे.": { native: "She is a good girl.", bases: { "चांगली": "good", "आहे": "to be" } }
  "mr-0760":
    native: "big; large; older"
    notes:
      "n1": "Feminine मोठी (moṭhi), neuter मोठे (moṭhe). With a noun: मोठे घर (moṭhe ghar), a big house."
    examples:
      "हे घर मोठे आहे.": { native: "This house is big.", bases: { "घर": "house", "मोठे": "big", "आहे": "to be" } }
      "माझा भाऊ मोठा आहे.": { native: "My brother is older.", bases: { "माझा": "my", "आहे": "to be" } }
  "mr-0761":
    native: "small; young"
    notes:
      "n1": "For a child, लहान मूल (lahān mul), a small child (see मूल, mul)."
    examples:
      "हे पाकीट लहान आहे.": { native: "This packet is small.", bases: { "आहे": "to be" } }
      "माझी बहीण लहान आहे.": { native: "My sister is younger.", bases: { "माझी": "my", "आहे": "to be" } }
  "mr-0762":
    native: "old (of things)"
    notes:
      "n1": "For things. Feminine जुनी (juni), neuter जुने (june)."
    examples:
      "ही खोली जुनी आहे.": { native: "This room is old.", bases: { "जुनी": "old", "आहे": "to be" } }
      "तिचे पुस्तक जुने आहे.": { native: "Her book is old.", bases: { "तिचे": "her", "जुने": "old", "आहे": "to be" } }
  "mr-0763":
    native: "new"
    notes:
      "n1": "Also नवीन काम (navin kām), a new job."
    examples:
      "माझा फोन नवीन आहे.": { native: "My phone is new.", bases: { "माझा": "my", "फोन": "phone", "आहे": "to be" } }
      "त्याला नवीन काम मिळाले.": { native: "He got a new job.", bases: { "मिळाले": "to get" } }
  "mr-0764":
    native: "hot (of things and weather)"
    notes:
      "n1": "Hot tea is गरम चहा (garam cahā); the opposite is थंड (thaṇḍ), cold."
    examples:
      "हा चहा गरम आहे.": { native: "This tea is hot.", bases: { "आहे": "to be" } }
      "मला गरम पाणी हवे आहे.": { native: "I want hot water.", bases: { "मला": "I", "आहे": "to be" } }
  "mr-0765":
    native: "cold (of things and weather)"
    notes:
      "n1": "For weather and drinks: थंड पाणी (thaṇḍ pāṇi), cold water."
    examples:
      "आज खूप थंड आहे.": { native: "It is very cold today.", bases: { "आहे": "to be" } }
      "पाणी थंड आहे.": { native: "The water is cold.", bases: { "आहे": "to be" } }
  "mr-0766":
    native: "clean"
    notes:
      "n1": "Its opposite is घाण (ghāṇ), dirty."
    examples:
      "खोली स्वच्छ आहे.": { native: "The room is clean.", bases: { "आहे": "to be" } }
      "तिने भांडी स्वच्छ केली.": { native: "She cleaned the dishes.", bases: { "भांडी": "dish; utensil", "केली": "to do" } }
  "mr-0767":
    native: "dirty; filthy"
    notes:
      "n1": "Its opposite is स्वच्छ (svacch), clean."
    examples:
      "रस्ता घाण आहे.": { native: "The road is dirty.", bases: { "रस्ता": "road", "आहे": "to be" } }
      "हे कपडे घाण आहेत.": { native: "These clothes are dirty.", bases: { "कपडे": "cloth; clothes", "आहेत": "to be" } }
  "mr-0768":
    native: "easy"
    notes:
      "n1": "Feminine सोपी (sopi), neuter सोपे (sope)."
    examples:
      "हे काम सोपे आहे.": { native: "This work is easy.", bases: { "सोपे": "easy", "आहे": "to be" } }
      "मराठी शिकणे सोपे नाही.": { native: "Learning Marathi is not easy.", bases: { "मराठी": "Marathi", "सोपे": "easy", "नाही": "not" } }
  "mr-0769":
    native: "difficult; hard"
    notes:
      "n1": "Its opposite is सोपे (sope), easy."
    examples:
      "गणित कठीण आहे.": { native: "Maths is difficult.", bases: { "गणित": "mathematics", "आहे": "to be" } }
      "हा प्रश्न कठीण आहे.": { native: "This question is hard.", bases: { "प्रश्न": "question", "आहे": "to be" } }
  "mr-0770":
    native: "beautiful"
    notes:
      "n1": "Also of places: सुंदर गाव (sundar gāv), a beautiful village (see गाव, gāv)."
    examples:
      "ती सुंदर मुलगी आहे.": { native: "She is a beautiful girl.", bases: { "आहे": "to be" } }
      "इथला डोंगर सुंदर आहे.": { native: "The hill here is beautiful.", bases: { "इथला": "here", "डोंगर": "hill", "आहे": "to be" } }
  "mr-0771":
    native: "tall; high"
    notes:
      "n1": "For people and things: उंच माणूस (uñc māṇus), a tall man."
    examples:
      "तो उंच माणूस आहे.": { native: "He is a tall man.", bases: { "आहे": "to be" } }
      "हे झाड उंच आहे.": { native: "This tree is tall.", bases: { "झाड": "tree", "आहे": "to be" } }
  "mr-0772":
    native: "heavy"
    notes:
      "n1": "Its opposite is हलका (halkā), light."
    examples:
      "ही पिशवी जड आहे.": { native: "This bag is heavy.", bases: { "आहे": "to be" } }
      "तो दगड जड आहे.": { native: "That stone is heavy.", bases: { "दगड": "stone", "आहे": "to be" } }
  "mr-0773":
    native: "light (not heavy)"
    notes:
      "n1": "Feminine हलकी (halki), neuter हलके (halke)."
    examples:
      "ही बॅग हलकी आहे.": { native: "This bag is light.", bases: { "बॅग": "bag", "हलकी": "light", "आहे": "to be" } }
      "हा नाश्ता हलका आहे.": { native: "This breakfast is light.", bases: { "आहे": "to be" } }
  "mr-0774":
    native: "happy"
    notes:
      "n1": "Also आनंद (ānand), happiness."
    examples:
      "ती आनंदी आहे.": { native: "She is happy.", bases: { "आहे": "to be" } }
      "मुले आनंदी आहेत.": { native: "The children are happy.", bases: { "आहेत": "to be" } }
  "mr-0775":
    native: "sad"
    notes:
      "n1": "Its opposite is आनंदी (ānandi), happy."
    examples:
      "ती दुःखी आहे.": { native: "She is sad.", bases: { "आहे": "to be" } }
      "तो आज दुःखी आहे.": { native: "He is sad today.", bases: { "आहे": "to be" } }
  "mr-0776":
    native: "tired"
    notes:
      "n1": "Feminine थकलेली (thakleli); the verb is थकणे (thakṇe), to get tired."
    examples:
      "मी खूप थकलो आहे.": { native: "I am very tired.", bases: { "मी": "I", "थकलो": "to get tired", "आहे": "to be" } }
      "ती थकलेली आहे.": { native: "She is tired.", bases: { "थकलेली": "tired", "आहे": "to be" } }
  "mr-0777":
    native: "hungry"
    notes:
      "n1": "Feminine भुकेली (bhukeli); from भूक (bhuk), hunger."
    examples:
      "तो भुकेला आहे.": { native: "He is hungry.", bases: { "आहे": "to be" } }
      "आई भुकेली आहे.": { native: "Mother is hungry.", bases: { "भुकेली": "hungry", "आहे": "to be" } }
  "mr-0778":
    native: "ill; sick"
    notes:
      "n1": "For people: आजारी पडणे (ājāri paḍṇe), to fall ill."
    examples:
      "बाबा आजारी आहेत.": { native: "Dad is ill.", bases: { "बाबा": "dad", "आहेत": "to be" } }
      "ती आजारी आहे.": { native: "She is ill.", bases: { "आहे": "to be" } }
  "mr-0779":
    native: "well; fine (in health)"
    notes:
      "n1": "As in मला बरे वाटत नाही (malā bare vāṭat nāhi), I do not feel well."
    examples:
      "आता मी बरा आहे.": { native: "Now I am fine.", bases: { "मी": "I", "आहे": "to be" } }
      "आजी बरी आहे का?": { native: "Is grandmother well?", bases: { "बरी": "well", "आहे": "to be", "का": "question word" } }
  "mr-0780":
    native: "angry"
    notes:
      "n1": "Feminine रागावलेली (rāgāvleli); the verb is रागावणे (rāgāvṇe), to get angry."
    examples:
      "बाबा रागावले आहेत.": { native: "Dad is angry.", bases: { "बाबा": "dad", "रागावले": "to get angry", "आहेत": "to be" } }
      "ती रागावलेली आहे.": { native: "She is angry.", bases: { "रागावलेली": "angry", "आहे": "to be" } }
  "mr-0781":
    native: "excited; eager"
    notes:
      "n1": "Also उत्साह (utsāh), enthusiasm."
    examples:
      "मुले उत्साही आहेत.": { native: "The children are excited.", bases: { "आहेत": "to be" } }
      "तो नवीन कामासाठी उत्साही आहे.": { native: "He is eager for the new job.", bases: { "कामासाठी": "for work", "आहे": "to be" } }
  "mr-0782":
    native: "boring"
    notes:
      "n1": "Feminine कंटाळवाणी (kaṇṭāḷvāṇi), neuter कंटाळवाणे (kaṇṭāḷvāṇe)."
    examples:
      "हा चित्रपट कंटाळवाणा आहे.": { native: "This film is boring.", bases: { "चित्रपट": "film", "आहे": "to be" } }
      "भाषण कंटाळवाणे आहे.": { native: "The speech is boring.", bases: { "भाषण": "speech", "कंटाळवाणे": "boring", "आहे": "to be" } }
  "mr-0783":
    native: "rich"
    notes:
      "n1": "Its opposite is गरीब (garib), poor."
    examples:
      "तो श्रीमंत माणूस आहे.": { native: "He is a rich man.", bases: { "आहे": "to be" } }
      "ती श्रीमंत आहे.": { native: "She is rich.", bases: { "आहे": "to be" } }
