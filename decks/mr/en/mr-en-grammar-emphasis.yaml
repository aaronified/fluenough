schema: 1
id: "mr-en-grammar-emphasis"
kind: "layer"
core: "mr-grammar-emphasis"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Emphasis: only, also, even"
license: "CC-BY-SA-4.0"
description: "I did it myself, I will come too, not even he came: putting weight on one word with च, ही and सुद्धा. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "Emphasis particles: च (ca), ही (hī) and सुद्धा (suddhā)"
  slot_name: "particle"
  prompt: "{lemma} ({gloss}), {slot}"
  slots: { "+च": "only, just (emphatic)", "+ही": "also, too, even" }
  entries:
    "mi": "I"
    "to": "he; that"
    "ghar": "house"
  notes: "A particle added to a word gives emphasis: च (ca), only or just, as in मीच केलं (mīc kelaṁ), I did it myself; ही (hī), also or even, as in मीही येईन (mīhī yeīn), I will come too. The particle sits directly after the word it stresses. सुद्धा (suddhā), even, is the more formal form: तोसुद्धा आला (tosuddhā ālā), even he came. With नाही (nāhī), not, च and ही give the sense of not even or none at all: घरच नाही (gharc nāhī), there is no house at all."
