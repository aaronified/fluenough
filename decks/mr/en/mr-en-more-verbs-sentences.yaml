cards:
  "mr-6160":
    native: "Mother chops the vegetable."
    bases: { "चिरते": "chops" }
    confusables: { "w1": { why: "Cut in general, not chop: कापणे (kāpṇe) is the general word for cutting." }, "f1": { why: "A man chops: चिरतो (cirto) is masculine, and the subject here is आई (āi), a mother." } }
  "mr-6161":
    native: "She fries the onion."
    bases: { "तळते": "fries" }
    confusables: { "w1": { why: "Boil, not fry: उकळणे (ukaḷṇe) means to boil." }, "f1": { why: "A man fries: तळतो (taḷto) is masculine, and the subject here is ती (ti)." } }
  "mr-6162":
    native: "He boils the milk."
    bases: { "उकळतो": "boils" }
    confusables: { "w1": { why: "Pour, not boil: ओतणे (otṇe) means to pour." }, "f1": { why: "Feminine: उकळते (ukaḷte) is for a feminine subject, and the subject here is तो (to)." } }
  "mr-6163":
    native: "She puts salt into the vegetable."
    bases: { "भाजीत": "into the vegetable", "घालते": "puts" }
    confusables: { "w1": { why: "Wipe, not put in: पुसणे (pusṇe) means to wipe." }, "f1": { why: "Masculine: घालतो (ghālto) is for a man, and the subject here is ती (ti)." } }
    notes: {"n1": "The ending -त (-t) means 'in' or 'into': भाजीत (bhājit), into the vegetable, is भाजी (bhāji) with -त (-t) added and nothing else changed."}
  "mr-6164":
    native: "She wipes the plate."
    bases: { "पुसते": "wipes" }
    confusables: { "w1": { why: "Sweep, not wipe: झाडणे (jhāḍṇe) means to sweep." }, "f1": { why: "Masculine: पुसतो (pusto) is for a man, and the subject here is ती (ti)." } }
  "mr-6165":
    native: "Mother sweeps the room."
    bases: { "झाडते": "sweeps" }
    confusables: { "w1": { why: "Wipe, not sweep: पुसणे (pusṇe) means to wipe." }, "f1": { why: "Masculine: झाडतो (jhāḍto) is for a man, and the subject here is आई (āi)." } }
  "mr-6166":
    native: "I fill water into the bucket."
    bases: { "बादलीत": "into the bucket", "भरतो": "fill" }
    confusables: { "w1": { why: "Take out, not fill: काढणे (kāḍhṇe) means to take out." }, "f1": { why: "Feminine: भरते (bharte) is for a feminine subject, and the verb here is masculine for मी (mi)." } }
    notes: {"n1": "The same ending -त (-t) gives बादलीत (bādlit), into the bucket, with the noun otherwise unchanged."}
  "mr-6167":
    native: "I soak the rice."
    bases: { "भिजवतो": "soak" }
    confusables: { "w1": { why: "Chop, not soak: चिरणे (cirṇe) means to chop." }, "f1": { why: "Feminine: भिजवते (bhijvte) is for a feminine subject, not for the speaker here." } }
  "mr-6168":
    native: "She makes tea."
    bases: { "बनवते": "makes" }
    confusables: { "w1": { why: "Cook, not make: शिजवणे (śijvṇe) means to cook food over heat." }, "f1": { why: "Masculine: बनवतो (banvto) is for a man, and the subject here is ती (ti)." } }
  "mr-6169":
    native: "I bring milk."
    bases: { "आणतो": "bring" }
    confusables: { "w1": { why: "Send, not bring: पाठवणे (pāṭhvṇe) means to send away from the speaker." }, "f1": { why: "Feminine: आणते (āṇte) is for a feminine subject, not for the speaker here." } }
  "mr-6170":
    native: "She chopped the vegetable."
    bases: { "तिने": "she", "चिरली": "chopped" }
    confusables: { "w1": { why: "Fry, not chop: तळणे (taḷṇe) means to fry." }, "f1": { why: "Masculine: चिरला (cirlā) is for a masculine object, and भाजी (bhāji) is feminine." } }
    notes: {"n1": "The doer of a past verb that has an object takes -ने (-ne): ती (tī) becomes तिने (tine), and चिरली (cirli) then agrees with the object भाजी (bhāji), not with the doer."}
  "mr-6171":
    native: "He fried the onion."
    bases: { "त्याने": "he", "तळला": "fried" }
    confusables: { "w1": { why: "Boil, not fry: उकळणे (ukaḷṇe) means to boil." }, "f1": { why: "Feminine: तळली (taḷli) agrees with a feminine object, but कांदा (kāndā) is masculine." } }
    notes: {"n1": "The doer of a past verb with an object takes -ने (-ne): तो (to) becomes त्याने (tyāne), and a masculine object takes -ला (-lā), as कांदा (kāndā), onion, does with तळला (taḷlā)."}
  "mr-6172":
    native: "The girl swims in the sea."
    bases: { "समुद्रात": "in the sea", "पोहते": "swims" }
    confusables: { "w1": { why: "Stop, not swim: थांबणे (thāmbaṇe) means to stop." }, "f1": { why: "A man swims: पोहतो (pohto) is masculine, and the subject here is मुलगी (mulgi), a girl." } }
    notes: {"n1": "A noun ending in a consonant takes -ा- (-ā-) before -त (-t), 'in': समुद्र (samudra), sea, gives समुद्रात (samudrāt), in the sea, as बाजार (bājār) gives बाजारात (bājārāt)."}
  "mr-6173":
    native: "She sends money to the son."
    bases: { "मुलाला": "to the son", "पाठवते": "sends" }
    confusables: { "w1": { why: "Bring, not send: आणणे (āṇṇe) means to bring towards the speaker." }, "f1": { why: "A man sends: पाठवतो (pāṭhvto) is masculine, and the subject here is ती (ti)." } }
    notes: {"n1": "As the course says, -ला (-lā) marks a person who is the receiver, so मुलाला (mulālā), to the son, gets the money पैसे (paise)."}
  "mr-6174":
    native: "The car stops."
    bases: { "थांबते": "stops" }
    confusables: { "w1": { why: "Swim, not stop: पोहणे (pohṇe) means to swim." }, "f1": { why: "A man stops: थांबतो (thāmbato) is masculine, and the subject here is गाडी (gāḍi), which is feminine." } }
