description: "Short sentences that use the help and emergency words of this unit. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-5812":
    native: "I have to go to the clinic."
    bases: { "दवाखान्यात": "at the clinic", "जायचे": "to go", "आहे": "is" }
    confusables: { "w1": { why: "नाही (nāhi) means not, which would give: I do not have to go." }, "w2": { why: "आता (ātā) means now; the sentence is about a need, not a time." } }
  "mr-5813":
    native: "My head aches."
    bases: { "माझे": "my", "दुखते": "aches" }
    confusables: { "w1": { why: "तू (tu) means you; माझे (mājhe) means my." }, "f1": { why: "दुखतो (dukhto) is masculine; डोके (ḍoke) is neuter, so दुखते (dukhte) is used." } }
  "mr-5814":
    native: "I have got a fever."
    bases: { "मला": "to me", "आला": "came", "आहे": "is" }
    confusables: { "w1": { why: "नाही (nāhi) means not, which would say I have no fever." }, "f1": { why: "आली (āli) is feminine; ताप (tāp) is masculine, so आला (ālā) is used." } }
  "mr-5815":
    native: "Take me to the hospital."
    bases: { "मला": "me", "रुग्णालयात": "to the hospital", "न्या": "take (polite)" }
    confusables: { "w1": { why: "इथे (ithe) means here, not to the hospital." }, "f1": { why: "या (yā) means come (polite); न्या (nyā) means take." } }
  "mr-5816":
    native: "Where are the police?"
    bases: { "आहेत": "are" }
    confusables: { "w1": { why: "कधी (kadhi) asks when, not where." }, "f1": { why: "आहे (āhe) is singular; the sentence uses the plural आहेत (āhet)." } }
  "mr-5817":
    native: "I took the medicine."
    bases: { "घेतले": "took" }
    confusables: { "w1": { why: "तो (to) means he, not I." }, "f1": { why: "घेतला (ghetlā) is masculine; औषध (auṣadh) is neuter, so घेतले (ghetle) is used." } }
  "mr-5818":
    native: "Is the doctor here?"
    bases: { "इथे": "here", "आहेत": "are", "का": "a question marker" }
    confusables: { "w1": { why: "नाही (nāhi) means not, which would say the doctor is not here." }, "f1": { why: "आहे (āhe) is singular; the sentence uses आहेत (āhet) for the doctor." } }
  "mr-5819":
    native: "Walk carefully."
    bases: { "सांभाळून": "carefully", "चाला": "walk" }
    confusables: { "w1": { why: "चांगले (cāṅgale) means well or good; सांभाळून (sāmbhāḷun) means carefully." }, "f1": { why: "चालतो (cālto) means I walk; चाला (cālā) is the command." } }
  "mr-5820":
    native: "A fire broke out!"
    bases: { "लागली": "broke out" }
    confusables: { "f1": { why: "लागला (lāglā) is masculine; आग (āg) is feminine, so लागली (lāgli) is used." }, "w1": { why: "विझली (vijhli) means it went out, the opposite of लागली (lāgli)." } }
  "mr-5821":
    native: "He had an accident."
    bases: { "त्याचा": "his", "झाला": "happened" }
    confusables: { "w1": { why: "तू (tu) means you; त्याचा (tyācā) means his." }, "f1": { why: "झाली (jhāli) is feminine; अपघात (apghāt) is masculine, so झाला (jhālā) is used." } }
  "mr-5822":
    native: "Where is the clinic?"
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "कधी (kadhi) asks when, not where." }, "f1": { why: "आहेत (āhet) is plural; the sentence is about one clinic, so आहे (āhe) is used." } }
  "mr-5823":
    native: "Take the medicine."
    bases: { "घ्या": "take (polite)" }
    confusables: { "w1": { why: "तू (tu) means you; the sentence uses the polite form." }, "f1": { why: "घे (ghe) is the command for one person you know well; घ्या (ghyā) is polite." } }
