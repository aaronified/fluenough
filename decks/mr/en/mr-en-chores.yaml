schema: 1
id: "mr-en-chores"
kind: "layer"
core: "mr-chores"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Chores"
description: "Housework: sweeping, washing clothes and dishes, ironing and taking out the rubbish, with the tools for each job. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-1146":
    native: "housework"
    notes:
      "n1": "{1} is housework, the work done at home each day."
    examples:
      "सकाळी घरकाम करतो.": "I do housework in the morning."
      "घरकाम सगळ्यांनी वाटून करा.": { native: "Share the housework among everyone.", bases: { "वाटून": "to share" } }
  "mr-1147":
    native: "broom"
    notes:
      "n1": "{1} is a broom for sweeping the floor."
    examples:
      "झाडू कुठे आहे?": { native: "Where is the broom?", bases: { "आहे": "to be" } }
      "नवीन झाडू आणला.": "I brought a new broom."
  "mr-1148":
    native: "to wash (clothes)"
    notes:
      "n1": "{1} is washing clothes or dishes with water and soap."
    examples:
      "आई कपडे धुते.": { native: "Mother washes clothes.", bases: { "धुते": "to wash (clothes)", "कपडे": "clothes" } }
      "कपडे धुऊन वाळत टाका.": { native: "Wash the clothes and hang them to dry.", bases: { "टाका": "to put", "धुऊन": "to wash (clothes)", "कपडे": "clothes", "वाळत": "to dry" } }
  "mr-1149":
    native: "dishes, pots (plural)"
    notes:
      "n1": "{1} is the dishes or the pots. The single word is भांडं (bhāṇḍaṁ), a pot."
    examples:
      "भांडी धुतली का?": "Did you wash the dishes?"
      "भांड्यांचा ढीग मोठा आहे.": { native: "The pile of dishes is big.", bases: { "भांड्यांचा": "of the dishes", "आहे": "to be", "ढीग": "pile" } }
  "mr-1150":
    native: "to scrub"
    notes:
      "n1": "{1} is scrubbing dishes or a floor with a brush."
    examples:
      "भांडी घासा.": { native: "Scrub the dishes.", bases: { "घासा": "to scrub" } }
      "फरशी घासून स्वच्छ झाली.": { native: "The floor got clean after scrubbing.", bases: { "झाली": "to become", "घासून": "to scrub", "फरशी": "floor" } }
  "mr-1151":
    native: "to clean"
    notes:
      "n1": "{1} is the verb for cleaning a room or a thing."
    bases:
      "साफ": "clean"
    examples:
      "खोली साफ केली.": { native: "I cleaned the room.", bases: { "साफ": "clean" } }
      "मुलांनी घर साफ करायला मदत केली.": { native: "The children helped to clean the house.", bases: { "साफ": "clean" } }
  "mr-1152":
    native: "iron (for clothes)"
    notes:
      "n1": "{1} is an iron for pressing clothes. The verb is इस्त्री करणे (istrī karṇe), to iron."
    examples:
      "इस्त्री कुठे आहे?": { native: "Where is the iron?", bases: { "आहे": "to be" } }
      "शर्ट इस्त्री करून घाला.": { native: "Iron the shirt and wear it.", bases: { "इस्त्री": "iron (for clothes)", "घाला": "to wear" } }
  "mr-1153":
    native: "rubbish, garbage"
    notes:
      "n1": "{1} is rubbish or garbage."
    examples:
      "कचरा बाहेर टाका.": { native: "Put the rubbish outside.", bases: { "बाहेर": "outside", "टाका": "to put" } }
      "कचऱ्याची गाडी सकाळी येते.": { native: "The rubbish van comes in the morning.", bases: { "कचऱ्याची": "rubbish, garbage" } }
  "mr-1154":
    native: "cleanliness"
    notes:
      "n1": "{1} is cleanliness, keeping things clean."
    examples:
      "स्वच्छता महत्त्वाची आहे.": { native: "Cleanliness is important.", bases: { "आहे": "to be", "महत्त्वाची": "important" } }
      "घरात स्वच्छता ठेवा.": "Keep the house clean."
  "mr-1155":
    native: "bucket"
    notes:
      "n1": "{1} is a bucket for water."
    examples:
      "बादलीत पाणी भरा.": { native: "Fill the bucket with water.", bases: { "बादलीत": "bucket" } }
      "बादली रिकामी आहे.": { native: "The bucket is empty.", bases: { "आहे": "to be", "रिकामी": "empty" } }
  "mr-1156":
    native: "cupboard, cabinet"
    notes:
      "n1": "{1} is a cupboard for clothes or things."
    examples:
      "कपाटात कपडे ठेवा.": { native: "Keep the clothes in the cupboard.", bases: { "कपाटात": "cupboard, cabinet", "कपडे": "clothes" } }
      "कपाट बंद करा.": { native: "Close the cupboard.", bases: { "बंद": "closed" } }
  "mr-1157":
    native: "to fetch water"
    notes:
      "n1": "{1} is fetching water, often from a well or a tap."
    examples:
      "सकाळी विहिरीतून पाणी भरलं.": { native: "In the morning I fetched water from the well.", bases: { "विहिरीतून": "from the well" } }
      "रोज पाणी भरावं लागतं.": { native: "Water has to be fetched every day.", bases: { "लागतं": "to need" } }
  "mr-1158":
    native: "to sew"
    notes:
      "n1": "{1} is sewing clothes."
    examples:
      "आजी कपडे शिवते.": { native: "Grandmother sews clothes.", bases: { "शिवते": "to sew", "कपडे": "clothes" } }
      "ब्लाउज शिवला.": { native: "I sewed a blouse.", bases: { "शिवला": "to sew", "ब्लाउज": "blouse" } }
  "mr-1159":
    native: "help"
    notes:
      "n1": "{1} is help. Asking for help is मदत करा (madat karā), help me."
    examples:
      "मला मदत हवी.": "I need help."
      "शेजाऱ्यांनी मदत केली.": { native: "The neighbours helped.", bases: { "शेजाऱ्यांनी": "the neighbours" } }
