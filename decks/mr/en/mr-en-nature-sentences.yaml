cards:
  "mr-6175":
    native: "The sun rises in the morning."
    bases: { "उगवतो": "rises", "सकाळी": "in the morning" }
    confusables: { "w1": { why: "Moon, not sun: चंद्र (candr) is the moon." }, "f1": { why: "Feminine: उगवते (ugavte) is for a feminine subject, and सूर्य (surya) is masculine." } }
  "mr-6176":
    native: "After sunset we go home."
    bases: { "सूर्यास्तानंतर": "after sunset", "जातो": "go" }
    confusables: { "w1": { why: "Come, not go: येणे (yeṇe) means to come." }, "f1": { why: "Feminine: जाते (jāte) is for a feminine subject, not for a group of us." } }
  "mr-6177":
    native: "In the evening the sun sets."
    bases: { "संध्याकाळी": "in the evening", "मावळतो": "sets" }
    confusables: { "w1": { why: "Rise, not set: उगवणे (ugvṇe) means to rise." }, "f1": { why: "Feminine: मावळते (māvḷte) is feminine, and सूर्य (surya) is masculine." } }
  "mr-6178":
    native: "The moon and the stars appear in the sky."
    bases: { "तारे": "stars", "आकाशात": "in the sky", "दिसतात": "appear" }
    confusables: { "w1": { why: "Island, not sky: बेट (beṭ) means island." }, "f1": { why: "Singular: तारा (tārā) is one star; the subject has two parts, so the plural तारे (tāre) is used." } }
  "mr-6179":
    native: "At night the moon gives light."
    bases: { "रात्री": "at night", "प्रकाश": "light", "देतो": "gives" }
    confusables: { "w1": { why: "Take, not give: घेणे (gheṇe) means to take." }, "f1": { why: "Feminine: देते (dete) is feminine, and चंद्र (candr) is masculine." } }
  "mr-6180":
    native: "Trees bloom."
    bases: { "झाडे": "trees", "फुलतात": "bloom" }
    confusables: { "w1": { why: "Star: तारा (tārā) is a star, not a tree." }, "f1": { why: "Feminine: फुलते (phulte) is for a feminine subject, and झाडे (jhāḍe) takes the plural form." } }
  "mr-6181":
    native: "There are trees on the island."
    bases: { "बेटावर": "on the island", "झाडे": "trees", "आहेत": "are" }
    confusables: { "w1": { why: "Meadow, not island: कुरण (kuraṇ) means a meadow." }, "f1": { why: "Singular: आहे (āhe) is for one thing; झाडे (jhāḍe) is plural, so आहेत (āhet) is used." } }
  "mr-6182":
    native: "There is a river in the valley."
    bases: { "दरीत": "in the valley", "आहे": "is" }
    confusables: { "w1": { why: "Cliff: कडा (kaḍā) is a steep edge, not a valley." }, "f1": { why: "Plural: आहेत (āhet) is for two or more; here there is one river, so आहे (āhe) is used." } }
  "mr-6183":
    native: "The soil is wet."
    bases: { "ओली": "wet", "आहे": "is" }
    confusables: { "w1": { why: "Sand, not soil: वाळू (vāḷu) is sand." }, "f1": { why: "Masculine: ओला (olā) is for a masculine noun, and माती (māti) is feminine." } }
  "mr-6184":
    native: "Nature is beautiful."
    bases: { "सुंदर": "beautiful", "आहे": "is" }
    confusables: { "w1": { why: "Soil, not nature: माती (māti) means soil." }, "f1": { why: "Plural: आहेत (āhet) is for two or more, and निसर्ग (nisarg) is one thing." } }
  "mr-6185":
    native: "We watch the sunrise."
    bases: { "पाहतो": "watch" }
    confusables: { "w1": { why: "Sunset, not sunrise: सूर्यास्त (suryāst) is sunset." }, "f1": { why: "Past: पाहिला (pāhilā) means watched in the past, and this sentence is in the present." } }
  "mr-6186":
    native: "There is a meadow near the village."
    bases: { "गावाजवळ": "near the village", "आहे": "is" }
    confusables: { "w1": { why: "Island, not meadow: बेट (beṭ) means island." }, "f1": { why: "Plural: आहेत (āhet) is for two or more; here there is one meadow." } }
  "mr-6187":
    native: "The cliff is very high."
    bases: { "खूप": "very", "उंच": "high", "आहे": "is" }
    confusables: { "w1": { why: "Meadow: कुरण (kuraṇ) is a grassy field, not a cliff." }, "f1": { why: "Plural: कडे (kaḍe) is the plural of cliffs; this sentence has one cliff, so कडा (kaḍā) takes आहे (āhe)." } }
