schema: 1
id: "mr-en-more-verbs"
kind: "layer"
core: "mr-more-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs"
license: "CC-BY-SA-4.0"
description: "Verbs of the kitchen and the house: cutting, frying, mixing, sweeping, sending. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-0784":
    native: "to cut"
    notes:
      "n1": "Finely cut is चिरणे (cirṇe), to chop."
    examples:
      "ती कांदा कापते.": { native: "She cuts the onion.", bases: { "कापते": "to cut" } }
      "तो बटाटा कापतो.": { native: "He cuts the potato.", bases: { "कापतो": "to cut" } }
  "mr-0785":
    native: "to fry"
    notes:
      "n1": "तळलेले (taḷlele), fried, is the past participle used as an adjective."
    examples:
      "ती मासा तळते.": { native: "She fries the fish.", bases: { "तळते": "to fry" } }
      "आई अंडे तळते.": { native: "Mother fries the egg.", bases: { "तळते": "to fry" } }
  "mr-0786":
    native: "to boil"
    notes:
      "n1": "Water उकळते (ukḷte) means the water boils."
    examples:
      "दूध उकळते.": { native: "The milk boils.", bases: { "उकळते": "to boil" } }
      "ती पाणी उकळते.": { native: "She boils the water.", bases: { "उकळते": "to boil" } }
  "mr-0787":
    native: "to mix"
    notes:
      "n1": "मिसळणे (misḷṇe) means to mix two things together, as पीठ आणि पाणी (piṭh āṇi pāṇi), flour and water."
    examples:
      "तो पीठ आणि पाणी मिसळतो.": { native: "He mixes the flour and water.", bases: { "मिसळतो": "to mix" } }
      "ती साखर दुधात मिसळते.": { native: "She mixes the sugar into the milk.", bases: { "दुधात": "in milk", "मिसळते": "to mix" } }
  "mr-0788":
    native: "to pour"
    notes:
      "n1": "The imperative ओत (ot), pour, is used in a recipe."
    examples:
      "चहा कपात ओत.": { native: "Pour the tea into the cup.", bases: { "कपात": "cup", "ओत": "to pour" } }
      "तिने पाणी वाटीत ओतले.": { native: "She poured the water into the bowl.", bases: { "वाटीत": "bowl", "ओतले": "to pour" } }
  "mr-0789":
    native: "to soak"
    notes:
      "n1": "भिजवणे (bhijvṇe) is to soak food in water, as डाळ (ḍāḷ), lentils, is soaked overnight."
    examples:
      "डाळ रात्री भिजवा.": { native: "Soak the lentils at night.", bases: { "रात्री": "night", "भिजवा": "to soak" } }
      "तांदूळ पाण्यात भिजवतो.": { native: "He soaks the rice in water.", bases: { "पाण्यात": "in water", "भिजवतो": "to soak" } }
  "mr-0790":
    native: "to chop"
    notes:
      "n1": "बारीक चिरणे (bārik cirṇe), to chop finely."
    examples:
      "ती भाजी चिरते.": { native: "She chops the vegetables.", bases: { "चिरते": "to chop" } }
      "कांदा बारीक चिरा.": { native: "Chop the onion finely.", bases: { "बारीक": "fine; small", "चिरा": "to chop" } }
  "mr-0791":
    native: "to cook"
    notes:
      "n1": "For food on a fire: भात शिजवणे (bhāt śijvṇe), to cook rice."
    examples:
      "आई भात शिजवते.": { native: "Mother cooks the rice.", bases: { "शिजवते": "to cook" } }
      "तो डाळ शिजवतो.": { native: "He cooks the lentils.", bases: { "शिजवतो": "to cook" } }
  "mr-0792":
    native: "to put in; to add"
    notes:
      "n1": "घालणे (ghālṇe) is to add something to food: मीठ घाला (miṭh ghālā), add salt."
    examples:
      "मीठ घाला.": { native: "Add salt.", bases: { "घाला": "to put in" } }
      "चहात दूध घाल.": { native: "Add milk to the tea.", bases: { "चहात": "in tea", "घाल": "to put in" } }
  "mr-0793":
    native: "to wipe"
    notes:
      "n1": "With a cloth, पुसणे (pusṇe) means to wipe a surface."
    examples:
      "ती टेबल पुसते.": { native: "She wipes the table.", bases: { "पुसते": "to wipe" } }
      "त्याने हात पुसले.": { native: "He wiped his hands.", bases: { "हात": "hand", "पुसले": "to wipe" } }
  "mr-0794":
    native: "to sweep"
    notes:
      "n1": "With a broom, झाडू (jhāḍu), broom, is the tool."
    examples:
      "ती खोली झाडते.": { native: "She sweeps the room.", bases: { "झाडते": "to sweep" } }
      "सकाळी घर झाडा.": { native: "Sweep the house in the morning.", bases: { "घर": "house", "झाडा": "to sweep" } }
  "mr-0795":
    native: "to fill"
    notes:
      "n1": "Its opposite is रिकामे (rikāme), empty, as in रिकामा डबा (rikāmā ḍabā), an empty tin."
    examples:
      "पाणी बाटलीत भर.": { native: "Fill the bottle with water.", bases: { "बाटलीत": "bottle", "भर": "to fill" } }
      "तो पिशवी भरतो.": { native: "He fills the bag.", bases: { "भरतो": "to fill" } }
  "mr-0796":
    native: "to take out"
    notes:
      "n1": "काढणे (kāḍhṇe) also means to take out money: पैसे काढणे (paise kāḍhṇe), to withdraw money."
    examples:
      "त्याने पैसे काढले.": { native: "He took out the money.", bases: { "काढले": "to take out" } }
      "आई पोळी तव्यातून काढते.": { native: "Mother takes the flatbread out of the pan.", bases: { "तव्यातून": "from the pan", "काढते": "to take out" } }
  "mr-0797":
    native: "to stir"
    notes:
      "n1": "To stir with a spoon: चमच्याने ढवळणे (camacyāne ḍhavḷṇe)."
    examples:
      "चमच्याने भाजी ढवळा.": { native: "Stir the vegetables with a spoon.", bases: { "चमच्याने": "with a spoon", "ढवळा": "to stir" } }
      "ती दूध ढवळते.": { native: "She stirs the milk.", bases: { "ढवळते": "to stir" } }
  "mr-0798":
    native: "to use"
    notes:
      "n1": "वापरणे (vāprṇe) is used for things and for gas."
    examples:
      "मी हा चाकू वापरतो.": { native: "I use this knife.", bases: { "मी": "I", "चाकू": "knife", "वापरतो": "to use" } }
      "ती गॅस वापरते.": { native: "She uses gas.", bases: { "गॅस": "gas", "वापरते": "to use" } }
  "mr-0799":
    native: "to send"
    notes:
      "n1": "पाठवणे (pāṭhvṇe) is also used for money: पैसे पाठवणे (paise pāṭhvṇe), to send money."
    examples:
      "मी तुला पत्र पाठवतो.": { native: "I send you a letter.", bases: { "मी": "I", "पत्र": "letter", "पाठवतो": "to send" } }
      "आई मुलाला पैसे पाठवते.": { native: "Mother sends money to her son.", bases: { "पाठवते": "to send" } }
  "mr-0800":
    native: "to bring"
    notes:
      "n1": "The imperative आण (āṇ), bring, as in आणा (āṇā), bring it."
    examples:
      "दुकानातून दूध आण.": { native: "Bring milk from the shop.", bases: { "दुकानातून": "from the shop", "आण": "to bring" } }
      "तो मिठाई आणतो.": { native: "He brings sweets.", bases: { "मिठाई": "sweets", "आणतो": "to bring" } }
  "mr-0801":
    native: "to make"
    notes:
      "n1": "For food and tea: चहा बनवणे (cahā banvṇe), to make tea."
    examples:
      "ती गोड पोळी बनवते.": { native: "She makes a sweet flatbread.", bases: { "बनवते": "to make" } }
      "आई रोज चहा बनवते.": { native: "Mother makes tea every day.", bases: { "बनवते": "to make" } }
  "mr-0802":
    native: "to lift; to pick up"
    notes:
      "n1": "The imperative उचल (ucal), lift."
    examples:
      "तो पिशवी उचलतो.": { native: "He picks up the bag.", bases: { "उचलतो": "to lift" } }
      "कृपया हे उचल.": { native: "Please pick this up.", bases: { "कृपया": "please", "उचल": "to lift" } }
  "mr-0803":
    native: "to stop; to wait"
    notes:
      "n1": "थांबा (thāmbā), wait or stop, as in इथे थांबा (ithe thāmbā), stop here (mr-0426)."
    examples:
      "बस इथे थांबते.": { native: "The bus stops here.", bases: { "बस": "bus", "थांबते": "to stop" } }
      "थोडा वेळ थांबा.": { native: "Wait a little while.", bases: { "थोडा": "a little", "थांबा": "to wait" } }
  "mr-0804":
    native: "to swim"
    notes:
      "n1": "नदीत पोहणे (nadit pohṇe), to swim in a river."
    examples:
      "मुले नदीत पोहतात.": { native: "The children swim in the river.", bases: { "नदीत": "river", "पोहतात": "to swim" } }
      "तो तलावात पोहतो.": { native: "He swims in the lake.", bases: { "तलावात": "lake", "पोहतो": "to swim" } }
