schema: 1
id: "mr-en-home"
kind: "layer"
core: "mr-home"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Home and neighbourhood"
license: "CC-BY-SA-4.0"
description: "The rooms of a home, what is in them, and the building and street around it. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0048":
    notes:
      "n1": "Both the building and home: माझे घर (mājhe ghar), my house. At home is घरी (ghari)."
  "mr-0459":
    native: "room"
    notes:
      "n1": "Plural खोल्या (kholyā). A flat is described by its rooms: वन बीएचके (van biecke), one bedroom, hall and kitchen."
    "examples": {
      "खोली आवरली.": {"native": "I tidied the room.", "bases": {"आवरली": "to tidy up, to control", "खोली": "room"}},
      "खोली बुक करा.": {"native": "Book a room.", "bases": {"बुक": "to book"}}
    }
  "mr-0460":
    native: "kitchen"
    notes:
      "n1": "'Cooking house': स्वयंपाक (svayampāk), cooking."
    "examples": {
      "वहिनी स्वयंपाकघरात आहेत.": {"native": "The sister-in-law is in the kitchen.", "bases": {"आहेत": "to be", "स्वयंपाकघरात": "kitchen"}}
    }
  "mr-0461":
    native: "bathroom"
    notes:
      "n1": "The traditional word is न्हाणीघर (nhāṇighar)."
  "mr-0462":
    native: "toilet"
    notes:
      "n1": "Formal, and on signs. In speech, टॉयलेट (ṭôyaleṭ) or संडास (saṇḍās)."
  "mr-0111":
    notes:
      "n1": "दार उघडा (dār ughḍā), open the door, please; दार बंद करा (dār band karā), close the door."
  "mr-0463":
    native: "window"
    notes:
      "n1": "Plural खिडक्या (khiḍkyā)."
    "examples": {
      "विमानात खिडकीची जागा आवडते.": {"native": "I like a window seat in the plane.", "bases": {"विमानात": "aeroplane", "जागा": "place", "खिडकीची": "window"}}
    }
  "mr-0464":
    native: "bed"
    "examples": {
      "पलंगावर चादर आहे.": {"native": "There is a sheet on the bed.", "bases": {"पलंगावर": "on the bed", "आहे": "to be"}}
    }
  "mr-0465":
    native: "chair"
  "mr-0466":
    native: "table"
    "examples": {
      "ती टेबल पुसते.": {"native": "She wipes the table.", "bases": {"पुसते": "to wipe"}},
      "ती फाईल टेबलावर ठेवते.": {"native": "She puts the file on the table.", "bases": {"टेबलावर": "on the table", "ठेवते": "to keep"}}
    }
  "mr-0467":
    native: "fan"
    notes:
      "n1": "पंखा लावा (paṅkhā lāvā), put the fan on, please."
  "mr-0468":
    native: "lamp; light"
    notes:
      "n1": "दिवा लावा (divā lāvā), turn the light on; दिवा बंद करा (divā band karā), turn it off."
    "examples": {
      "दिवा पेटवा.": {"native": "Light the lamp.", "bases": {"पेटवा": "to light", "दिवा": "lamp; light"}},
      "दिवा विझवून झोप.": {"native": "Put out the lamp and sleep.", "bases": {"विझवून": "to put out"}}
    }
  "mr-0469":
    native: "key"
    notes:
      "n1": "Also चावी (cāvi), from Portuguese chave."
  "mr-0470":
    native: "neighbour; next door"
    notes:
      "n1": "Also 'next to': शाळेच्या शेजारी (śāḷecyā śejāri), next to the school."
    "examples": {
      "तो शेजारी आहे.": {"native": "He is a neighbour.", "bases": {"आहे": "is"}},
      "शेजारी इथे आहेत.": {"native": "The neighbours are here.", "bases": {"इथे": "here", "आहेत": "are"}}
    }
  "mr-0471":
    native: "building"
    notes:
      "n1": "In Mumbai and Pune a block of flats is often a सोसायटी (sosāyṭi), a housing society."
    "examples": {
      "आधुनिक इमारत उंच आहे.": {"native": "The modern building is tall.", "bases": {"आहे": "to be", "इमारत": "building"}},
      "सगळे इमारतीतून बाहेर पडले.": {"native": "Everyone got out of the building.", "bases": {"बाहेर": "outside", "पडले": "to go out", "इमारतीतून": "building"}}
    }
  "mr-0472":
    native: "floor; storey"
    notes:
      "n1": "पहिला मजला (pahilā majlā), the first floor, above the ground floor, as in Britain."
  "mr-0424":
    native: "rent; fare"
    notes:
      "n1": "घरभाडे (gharbhāḍe), the rent of a house."
  "mr-0114":
    notes:
      "n1": "A garden or a park; a public park is also an उद्यान (udyān)."
  "mr-0473":
    native: "lane"
    notes:
      "n1": "A narrow street. Cricket in the lane is गल्ली क्रिकेट (galli krikeṭ)."
