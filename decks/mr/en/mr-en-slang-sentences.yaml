description: "Short informal sentences that use the slang words of this unit. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-6515":
    native: "This film is really cool."
    bases: { "हा": "this", "सिनेमा": "film", "आहे": "is" }
    confusables: { "w1": { why: "Dangerous, not cool: खतरनाक (khatrnāk) means dangerous." }, "f1": { why: "Plural: आहेत (āhet) is for more than one; one film takes आहे (āhe)." } }
    notes: { "n1": "लय (lay), very, and भारी (bhāri), heavy, together mean 'really cool' in slang: लय भारी (lay bhāri) is a casual phrase." }
  "mr-6516":
    native: "Hey, how are you?"
    bases: { "काय": "what", "रे": "hey (familiar)", "कसा": "how", "आहेस": "are (informal)" }
    confusables: { "w1": { why: "You, not how: तू (tu) means you." }, "f1": { why: "Third person: आहे (āhe) is for he, she or it; आहेस (āhes) is for you, informal." } }
    notes: { "n1": "रे (re) is a familiar particle for a friend or someone you know well, and it goes with आहेस (āhes), the informal 'you are'." }
  "mr-6517":
    native: "Dude, this party is awesome."
    bases: { "ही": "this", "पार्टी": "party", "आहे": "is" }
    confusables: { "w1": { why: "Guy, not dude: पोरगा (porgā) means a boy or guy." }, "f1": { why: "Plural: आहेत (āhet) is for more than one; one party takes आहे (āhe)." } }
  "mr-6518":
    native: "There was a big fuss today."
    bases: { "खूप": "a lot", "झाला": "happened" }
    confusables: { "w1": { why: "Tomorrow, not today: उद्या (udyā) means tomorrow." }, "f1": { why: "Present, not past: आहे (āhe) means is; झाला (jhālā) means happened." } }
    notes: { "n1": "राडा (rāḍā), a fight or a big fuss, is a casual slang word." }
  "mr-6519":
    native: "That guy is fearless."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "She, not that: ती (ti) means she." }, "f1": { why: "Plural: आहेत (āhet) is for more than one; one guy takes आहे (āhe)." } }
    notes: { "n1": "पोरगा (porgā), a guy, is a casual word, so तो पोरगा (to porgā), that guy, sounds informal." }
  "mr-6520":
    native: "This game is insane."
    bases: { "हा": "this", "खेळ": "game", "आहे": "is" }
    confusables: { "w1": { why: "Awesome, not dangerous: झक्कास (jhakkās) means awesome." }, "f1": { why: "Plural: आहेत (āhet) is for more than one; one game takes आहे (āhe)." } }
  "mr-6521":
    native: "Let's hang out today."
    confusables: { "w1": { why: "Tomorrow, not today: उद्या (udyā) means tomorrow." }, "f1": { why: "Present, a statement: करतो (karto) means I do; करू (karu) means let's do." } }
    notes: { "n1": "टाईमपास करणे (ṭāimpās karṇe), to pass time, is a noun plus करणे (karṇe), to do, and करू (karu) is 'let's do'." }
  "mr-6522":
    native: "His life fell apart."
    bases: { "त्याची": "his", "वाट": "fate", "लागली": "got" }
    confusables: { "w1": { why: "She, not his: ती (ti) means she." }, "f1": { why: "Masculine: लागला (lāglā) goes with a masculine noun; वाट (vāṭ) is feminine, so लागली (lāgli)." } }
    notes: { "n1": "वाट लागली (vāṭ lāgli), literally 'the path got', is an idiom for things going to ruin." }
  "mr-6523":
    native: "Dude, stay cool today."
    bases: { "राहा": "stay" }
    confusables: { "w1": { why: "Pal, not brother: यार (yār) is a pal." }, "f1": { why: "Present, a statement: राहतो (rāhto) means stays; राहा (rāhā) is a command." } }
  "mr-6524":
    native: "The guy looks really cool."
    bases: { "दिसतो": "looks" }
    confusables: { "w1": { why: "He, not the guy: तो (to) means he." }, "f1": { why: "Feminine: दिसते (diste) is for a feminine subject; पोरगा (porgā) is masculine, so दिसतो (disto)." } }
