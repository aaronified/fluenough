schema: 1
id: "mr-en-multiword-1"
kind: "layer"
core: "mr-multiword-1"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: conjunct verbs"
description: "Ten verb phrases of a noun and a light verb: मदत (madat) करणे (karṇe), to help, and होणे (hoṇe), to become, as in तयार (tayār) होणे (hoṇe), to get ready. Three come from en.wiktionary; the rest are the course's own conjunct-verb deck. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "mr-4350":
    native: "to help"
    notes:
      "u1": "The one helped takes -ला (-lā): मला (malā) मदत (madat) करा (karā), please help me."
  "mr-4351":
    native: "to think"
    notes:
      "u1": "Intransitive, as en.wiktionary marks it. The course's example: याचा (yācā) नीट (niṭ) विचार (vicār) करा (karā), think about this carefully."
  "mr-4352":
    native: "to pay obeisance; to seek blessings by bowing down or touching the feet of God or elders"
    notes:
      "u1": "Per en.wiktionary, the phrase is built from नमस्कार (namaskār), obeisance, and करणे (karṇe), to do."
  "mr-4353":
    native: "to work"
    notes:
      "u1": "'To do work': मी (mi) बँकेत (bam̐ket) काम (kām) करतो (karto), I work in a bank."
  "mr-4354":
    native: "to phone"
    notes:
      "u1": "मी (mi) तुम्हाला (tumhālā) फोन (fon) करीन (karin), I'll phone you."
  "mr-4355":
    native: "to start (something)"
    notes:
      "u1": "With करणे (karṇe) someone starts something; with होणे (hoṇe) it starts by itself: काम (kām) सुरू (suru) झाले (jhāle), the work started."
    bases:
      "सुरू": "begun; started"
  "mr-4356":
    native: "to start; to begin"
    notes:
      "u1": "चित्रपट (citrapaṭ) कधी (kadhi) सुरू (suru) होईल (hoil)?, when will the film start?"
    bases:
      "सुरू": "begun; started"
      "होणे": "to be; to become"
  "mr-4357":
    native: "to close; to switch off"
    notes:
      "u1": "बंद (band) is 'shut, off': दुकान (dukān) बंद (band) आहे (āhe), the shop is closed. Its opposite is उघडणे (ughaḍṇe), to open."
    bases:
      "बंद": "closed; off"
  "mr-4358":
    native: "to marry"
    notes:
      "u1": "'To do a wedding': त्यांनी (tyānni) लग्न (lagna) केले (kele), they got married."
  "mr-4359":
    native: "to get ready"
    notes:
      "u1": "तयार (tayār) is 'ready', and होणे (hoṇe) makes it 'become ready': मी (mi) तयार (tayār) आहे (āhe), I'm ready."
    bases:
      "तयार": "ready"
      "होणे": "to be; to become"
