schema: 1
id: "mr-en-script-vowels"
kind: "layer"
core: "mr-script-vowels"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Marathi vowels"
license: "CC-BY-SA-4.0"
description: "The vowels as they are written on their own, at the start of a word, with the two Marathi adds for English words. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0001":
    native: "a, short (the vowel every consonant carries)"
    notes:
      "n1": "Like the 'u' of 'but'. Every consonant carries it unless a sign changes it, and Marathi drops it at the end of most words: घर (ghar) is ghar, not ghara. On its own: अननस (ananas, pineapple)."
    "examples": {
      "अंधाराची भीती वाटते.": {"native": "I am afraid of the dark.", "bases": {"अंधाराची": "of the dark", "वाटते": "to feel"}},
      "अग्निशमन दल आलं.": {"native": "The fire brigade came.", "bases": {"दल": "brigade"}}
    }
  "mr-0002":
    native: "aa, long"
    notes:
      "n1": "The 'a' of 'father'. It is a different vowel from अ (a), not only a longer one, and it changes the word: आई (āi, mother)."
    "examples": {
      "वादळ आलं.": {"native": "A storm came.", "bases": {}},
      "स्वतःला आवर.": {"native": "Control yourself.", "bases": {"आवर": "to tidy up, to control"}}
    }
  "mr-0003":
    native: "i, short"
    notes:
      "n1": "Like the 'i' of 'sit': इमारत (imārat, building)."
    "examples": {
      "आइस्क्रीम थंड आहे.": {"native": "The ice cream is cold.", "bases": {"थंड": "cold", "आहे": "to be"}},
      "इंजेक्शन दुखतं का?": {"native": "Does the injection hurt?", "bases": {}}
    }
  "mr-0004":
    native: "ii, long"
    notes:
      "n1": "The 'ee' of 'see': ईश्वर (iśvar, God). In everyday Marathi इ (i) and ई (i) sound much alike, and the spelling rules decide which is written: a Marathi word that ends in i ends in ई (i), as मी (mi, I) and पाणी (pāṇi, water) do."
    "examples": {
      "अहंकार वाईट आहे.": {"native": "Arrogance is bad.", "bases": {"आहे": "to be", "वाईट": "bad"}},
      "आई पोहे बनवते.": {"native": "Mother makes poha.", "bases": {"बनवते": "to make"}}
    }
  "mr-0005":
    native: "u, short"
    notes:
      "n1": "Like the 'u' of 'put': उंदीर (undir, mouse; rat)."
    "examples": {
      "तोंड उघडा.": {"native": "Open your mouth.", "bases": {"उघडा": "to open"}},
      "पडदा उघडला.": {"native": "The curtain opened.", "bases": {}}
    }
  "mr-0006":
    native: "uu, long"
    notes:
      "n1": "The 'oo' of 'food': ऊस (us, sugarcane). As with इ (i) and ई (i), speech barely tells उ (u) from ऊ (u), and a Marathi word that ends in u ends in ऊ (u): तू (tu, you)."
    "examples": {
      "पाऊस वाढला.": {"native": "The rain increased.", "bases": {"वाढला": "to rise; to grow"}},
      "मॉलमध्ये जाऊ.": {"native": "Let's go to the mall.", "bases": {"मॉलमध्ये": "to the mall", "जाऊ": "to go"}}
    }
  "mr-0007":
    native: "ru (a vowel letter)"
    notes:
      "n1": "Marathi says it 'ru', where Hindi says 'ri', in words from Sanskrit: ऋषी (ruṣi, sage). A recogniser writes the sound as रु (ru), so it is drilled by reading and writing only."
    "examples": {
      "भारतात सहा ऋतू आहेत.": {"native": "India has six seasons.", "bases": {"आहेत": "to be", "भारतात": "in India"}},
      "माझा आवडता ऋतू पावसाळा आहे.": {"native": "My favourite season is the monsoon.", "bases": {"आहे": "to be"}}
    }
  "mr-0008":
    native: "e (as in 'café')"
    notes:
      "n1": "Like the 'e' of 'café', without the glide of English 'say': एक (ek, one)."
    "examples": {
      "आज एक ऑफर आहे.": {"native": "There is an offer today.", "bases": {"आहे": "to be"}},
      "आजी एक गोष्ट सांगते.": {"native": "Grandmother tells a story.", "bases": {}}
    }
  "mr-0009":
    native: "ai (as in 'kite')"
    notes:
      "n1": "A glide from a to i, like the 'i' of 'kite'. Hindi says this letter as a long open e; Marathi keeps the glide: ऐका (aikā, listen!)."
    "examples": {
      "कान नीट ऐका.": {"native": "Listen carefully.", "bases": {"ऐका": "to listen"}},
      "गाणं ऐकत होतो.": {"native": "I was listening to a song.", "bases": {"होतो": "to be"}}
    }
  "mr-0010":
    native: "o (as in 'go')"
    notes:
      "n1": "Like the 'o' of 'go', without the glide English adds: ओठ (oṭh, lip)."
    "examples": {
      "बेडूक ओरडतो.": {"native": "The frog croaks.", "bases": {"ओरडतो": "to croak"}},
      "व्हिडिओ पाठवा.": {"native": "Send the video.", "bases": {}}
    }
  "mr-0011":
    native: "au (as in 'cow')"
    notes:
      "n1": "A glide from a to u, like the 'ow' of 'cow': औषध (auṣadh, medicine)."
    "examples": {
      "औषधालय सकाळी उघडते.": {"native": "The pharmacy opens in the morning.", "bases": {"सकाळी": "morning", "उघडते": "to open"}},
      "खोकल्याचं औषध घ्या.": {"native": "Take the cough medicine.", "bases": {"खोकल्याचं": "cough"}}
    }
  "mr-0012":
    native: "ae, as in 'bat' (in English words)"
    notes:
      "n1": "Marathi writes the 'a' of English 'bat' with this letter: ॲसिड (êsiḍ, acid). After a consonant it is the sign ॅ (ê): बॅग (bêg) is said as in English. A recogniser may write it as ए (e), so it is drilled by reading and writing only."
    "examples": {
      "ॲप डाउनलोड करा.": {"native": "Download the app.", "bases": {"डाउनलोड": "download"}},
      "ॲप नवीन आहे.": {"native": "The app is new.", "bases": {"आहे": "to be"}}
    }
  "mr-0013":
    native: "o, as in 'hot' (in English words)"
    notes:
      "n1": "The open 'o' of British 'hot', for English words: ऑफिस (ôfis, office). After a consonant it is the sign ॉ (ô): डॉक्टर (ḍôkṭar, doctor)."
    "examples": {
      "अधिकारी ऑफिसमध्ये आहेत.": {"native": "The officer is in the office.", "bases": {"आहेत": "to be"}},
      "ऑनलाईन फसवणूक झाली.": {"native": "There was an online fraud.", "bases": {"झाली": "to become", "ऑनलाईन": "online"}}
    }
