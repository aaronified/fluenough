id: "mr-en-medicine-clinic"
kind: "layer"
core: "mr-medicine-clinic"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Medicine: a clinic appointment"
license: "CC-BY-SA-4.0"
description: "Phrases for a visit to the doctor: the questions the doctor asks, the symptoms and the instructions the doctor gives. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-8000":
    native: "What is troubling you?"
    notes: { n1: "तुम्हाला (tumhālā) is the polite form of you, used with an adult patient; the sentence literally says what trouble is happening to you." }
  "mr-8001":
    native: "I have a fever."
  "mr-8002":
    native: "My stomach hurts."
    notes: { n1: "पोटात (poṭāt) is the stomach with the ending आत (āt), meaning in, so the sentence says the pain is in the stomach." }
  "mr-8003":
    native: "Where does it hurt?"
  "mr-8004":
    native: "Breathe deeply."
  "mr-8005":
    native: "Take this tablet twice a day."
    notes: { n1: "दिवसातून (divsātun) means in a day and वेळा (veḷā) means times, so दोन (don) वेळा (veḷā) is two times." }
  "mr-8006":
    native: "Come back after a week."
    notes: { n1: "या (yā) is the polite command of येणे (yeṇe), to come." }
  "mr-8007":
    native: "Your blood pressure has gone up."
    notes: { n1: "रक्तदाब (raktadāb) is blood pressure, and वाढला (vāḍhlā) आहे (āhe) means has risen." }
  "mr-8008":
    native: "Do you smoke?"
