    "dabaa": "box; tiffin; train carriage (m)"
  notes: "Before an ending a noun takes its oblique form, and Marathi writes the ending joined to it. A masculine noun in -आ (-ā) changes it to -्या (-yā): रस्ता (rastā), रस्त्यावर (rastyāvar). A feminine noun in -आ (-ā) changes it to -े (e): शाळा (śāḷā), शाळेत (śāḷet). Most nouns ending in a consonant add -ा (ā): घर (ghar), घरात (gharāt). The plural: a masculine -आ (-ā) becomes -े (e) (रस्ते (raste)); a neuter noun ending in a consonant adds -े (e) (घरे (ghare), in speech घरं (gharam̐)); a feminine -ई (-i) becomes -्या (-yā) (खोल्या (kholyā)); a feminine -आ (-ā) stays (शाळा). -ला (-lā) is 'to', and also marks a person as the object."
