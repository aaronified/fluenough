native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences with abstract words"
license: "CC-BY-SA-4.0"
description: "Short sentences with words for ideas and values: truth, compassion, patience and equality, built from the words of Abstract words. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-5011":
    native: "It is good to speak the truth."
    bases: { "सत्य": "truth", "बोलणे": "speaking; to speak", "चांगले": "good", "आहे": "is" }
    confusables: { "w1": { why: "Untruth, the opposite: असत्य (asatya) means falsehood, while this sentence says सत्य (satya)." }, "w2": { why: "Bad, not good: वाईट (vāiṭ) means bad, so चांगले (cāṅgale) is needed." } }
    notes: {"n1": "A verb ending in -णे (-ṇe) can name the action, so बोलणे (bolṇe), speaking, is the subject, and चांगले (cāṅgale), good, takes the neuter -े (-e)."}
  "mr-5012":
    native: "He shows compassion to everyone."
    bases: { "तो": "he", "सगळ्यांवर": "on everyone", "दया": "compassion", "करतो": "shows" }
    confusables: { "w1": { why: "Close in meaning: करुणा (karuṇā) is pity, a near synonym that this sentence does not use." }, "f1": { why: "Plural: करतात (kartāt) is for several people; तो (to) is one man, so करतो (karto) is used." } }
    notes: {"n1": "दया करणे (dayā karṇe), to show compassion, is the noun दया (dayā) with करणे (karṇe), to do."}
  "mr-5013":
    native: "The country is making progress."
    bases: { "देशाची": "of the country", "प्रगती": "progress", "होत": "becoming; happening", "आहे": "is" }
    confusables: { "w1": { why: "Development: विकास (vikās) means development or growth, a close word, but this sentence says प्रगती (pragti)." }, "w2": { why: "Finished: झाली (jhāli) means became, but the sentence is ongoing, so होत आहे (hot āhe) is used." } }
    notes: {"n1": "The possessive देशाची (deśāci), of the country, agrees with the feminine प्रगती (pragti), progress, not with देश (deś)."}
  "mr-5014":
    native: "I do not understand its meaning."
    bases: { "त्याचा": "its", "अर्थ": "meaning", "मला": "to me", "समजत": "understanding", "नाही": "not" }
    confusables: { "w1": { why: "Imagination: कल्पना (kalpanā) means imagination or idea, not meaning." }, "w2": { why: "Also understanding: कळत (kaḷat) is a close verb, but this sentence uses समजत (samjat)." } }
    notes: {"n1": "'Don't' is the stem with -त (-t) and नाही (nāhi): समजत नाही (samjat nāhi), I don't understand."}
  "mr-5015":
    native: "My goal is to finish."
    bases: { "माझे": "my", "ध्येय": "goal", "पूर्ण": "complete", "करणे": "to do", "आहे": "is" }
    confusables: { "w1": { why: "Purpose: उद्देश (uddeś) means a purpose or intention, close to ध्येय (dhyey) but not used here." }, "w2": { why: "Start: सुरू (suru) means start, but this sentence is about finishing, पूर्ण (purṇa)." } }
    notes: {"n1": "पूर्ण करणे (purṇa karṇe), to complete, puts the adjective पूर्ण (purṇa), complete, before करणे (karṇe), to do."}
  "mr-5016":
    native: "He has humility."
    bases: { "त्याच्यात": "in him", "नम्रता": "humility", "आहे": "is" }
    confusables: { "w1": { why: "Arrogance, the opposite: अहंकार (ahaṅkār) means ego or arrogance." }, "f1": { why: "Plural: आहेत (āhet) would need several things; humility is one quality, so आहे (āhe) is used." } }
    notes: {"n1": "त्याच्यात (tyācyāt), in him, uses the oblique त्याच्य- (tyācy-) before -त (-t), as त्याच्याशी (tyācyāśi), with him, does in the course."}
  "mr-5017":
    native: "He has no arrogance."
    bases: { "त्याच्यात": "in him", "अहंकार": "arrogance", "नाही": "no; not" }
    confusables: { "w1": { why: "Humility, the opposite: नम्रता (namratā) means humility." }, "w2": { why: "Positive: आहे (āhe) means is; नाही (nāhi) turns the sentence into a negative." } }
  "mr-5018":
    native: "Life is beautiful."
    bases: { "जीवन": "life", "सुंदर": "beautiful", "आहे": "is" }
    confusables: { "w1": { why: "Truth: सत्य (satya) is truth; this sentence is about life, जीवन (jivan)." }, "f1": { why: "Plural: आहेत (āhet) is for several things; life is one thing, so आहे (āhe) is used." } }
  "mr-5019":
    native: "My faith is in God."
    bases: { "माझी": "my", "श्रद्धा": "faith", "देवावर": "in God", "आहे": "is" }
    confusables: { "w1": { why: "Compassion, another quality: दया (dayā) means compassion, not faith." }, "w2": { why: "Masculine: माझा (mājhā) goes with a masculine noun, but श्रद्धा (śraddhā) is feminine, so माझी (mājhi) is used." } }
    notes: {"n1": "A noun takes -ा- (-ā-) before -वर (-var), as देवावर (devāvar), on God, does, the same pattern as the course's टेबलावर (ṭebalāvar), on the table, example."}
  "mr-5020":
    native: "Equality is for everyone."
    bases: { "समानता": "equality", "सगळ्यांसाठी": "for everyone", "आहे": "is" }
    confusables: { "w1": { why: "Humanity: मानवता (mānvtā) means humanity, not equality." }, "f1": { why: "Plural: आहेत (āhet) takes a plural subject; समानता (samāntā) is one idea, so आहे (āhe) is used." } }
    notes: {"n1": "सगळे (sagḷe), all, takes the oblique सगळ्यां- (sagaḷyāṁ-) before -साठी (-sāṭhi), for: सगळ्यांसाठी (sagaḷyāṁsāṭhi), for everyone."}
  "mr-5021":
    native: "Keep self-control."
    bases: { "संयम": "self-control", "ठेवा": "keep" }
    confusables: { "w1": { why: "Courage, a different virtue: धैर्य (dhairya) means courage or patience." }, "w2": { why: "Let go: सोडा (soḍā) means let go, the opposite of keep, ठेवा (ṭhevā)." } }
    notes: {"n1": "For a friend the order is ठेव (ṭhev), the bare stem; ठेवा (ṭhevā) is the polite form."}
