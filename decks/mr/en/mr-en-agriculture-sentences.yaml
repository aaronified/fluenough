description: "Short sentences about crops, water, tools and work on a farm, built from the words of Agriculture. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-5062":
    native: "We grow wheat."
    bases: { "आम्ही": "we", "गहू": "wheat", "पिकवतो": "grow" }
    confusables: { "w1": { why: "Sow: पेरणे (perṇe) means to sow seed, not to grow a crop." }, "w2": { why: "Jowar: ज्वारी (jvāri) is sorghum, a different crop." } }
    notes: { "n1": "आम्ही (āmhi), we, takes the present ending -तो (-to) whoever is speaking, so a woman also says आम्ही पिकवतो (āmhi pikvto)." }
  "mr-5063":
    native: "We sow jowar."
    bases: { "आम्ही": "we", "ज्वारी": "jowar; sorghum", "पेरतो": "sow" }
    confusables: { "w1": { why: "Pearl millet: बाजरी (bājri) is a different millet." }, "w2": { why: "Grow: पिकवतो (pikvto) means grow, while पेरतो (perto) means sow." } }
    notes: { "n1": "The -तो (-to) ending of आम्ही (āmhi), we, stays the same whoever is speaking, so पेरतो (perto), sow, does not change for a woman." }
  "mr-5064":
    native: "There is water in the well."
    bases: { "विहिरीत": "in the well", "पाणी": "water", "आहे": "is" }
    confusables: { "w1": { why: "Canal: कालवा (kālvā) is a canal, not a well." }, "w2": { why: "Dam: धरण (dharaṇ) is a dam." } }
    notes: { "n1": "The noun changes its stem before the ending -त (-t), 'in': विहीर (vihir), well, gives विहिरीत (vihirit), in the well." }
  "mr-5065":
    native: "Water from the dam goes through the canal."
    bases: { "धरणाचे": "from the dam", "पाणी": "water", "कालव्यातून": "through the canal", "जाते": "goes" }
    confusables: { "w1": { why: "Well: विहीर (vihir) is a well, not a canal." }, "f1": { why: "Masculine: जातो (jāto) goes with a masculine noun; पाणी (pāṇi) is neuter, so जाते (jāte) is used." } }
    notes: { "n1": "धरणाचे (dharṇāce), the dam's, ends in -चे (-ce) because it agrees with the neuter पाणी (pāṇi), water, the thing owned, not with the dam." }
  "mr-5066":
    native: "The plough is old."
    bases: { "नांगर": "plough", "जुना": "old", "आहे": "is" }
    confusables: { "w1": { why: "Tractor: ट्रॅक्टर (ṭrêkṭar) is a machine, a different tool." }, "w2": { why: "New, the opposite of old: नवीन (navin) means new." } }
    notes: { "n1": "जुना (junā), old, ends in -ा (-ā) because नांगर (nāṅgar), plough, is masculine; a feminine noun would take -ी (-ī)." }
  "mr-5067":
    native: "The tractor is in the field."
    bases: { "ट्रॅक्टर": "tractor", "शेतात": "in the field", "आहे": "is" }
    confusables: { "w1": { why: "Plough: नांगर (nāṅgar) is a plough." }, "w2": { why: "In the house, not the field: घरात (gharāt) means in the house." } }
    notes: { "n1": "शेतात (śetāt), in the field, is the oblique of शेत (śet), field, with -ात (-āt), 'in', as घरात (gharāt), in the house." }
  "mr-5068":
    native: "Harvest day is a day of joy."
    bases: { "कापणीचा": "of the harvest", "दिवस": "day", "आनंदाचा": "of joy", "असतो": "is" }
    confusables: { "w1": { why: "Sowing: पेरणी (perṇi) is sowing, the season before the harvest." }, "w2": { why: "Night: रात्र (rātra) means night, not day." } }
    notes: { "n1": "कापणीचा (kāpṇicā), of harvest, and आनंदाचा (ānandācā), of joy, both end in -चा (-cā) because they describe दिवस (divas), day, which is masculine; असतो (asto) agrees with it too." }
  "mr-5069":
    native: "Sugarcane is sweet."
    bases: { "ऊस": "sugarcane", "गोड": "sweet", "असतो": "is" }
    confusables: { "w1": { why: "Sour: आंबट (āmbaṭ) means sour, not sweet." }, "f1": { why: "Feminine: असते (aste) goes with a feminine noun; ऊस (us) is masculine, so असतो (asto) is used." } }
  "mr-5070":
    native: "This crop is good."
    bases: { "हे": "this", "पीक": "crop", "चांगले": "good", "आहे": "is" }
    confusables: { "w1": { why: "Seed: बी (bi) is a seed, not a crop." }, "w2": { why: "Fertiliser: खत (khat) is fertiliser, not the crop." } }
  "mr-5071":
    native: "He keeps livestock."
    bases: { "तो": "he", "पशुपालन": "keeping livestock", "करतो": "does" }
    confusables: { "w1": { why: "Farming: शेती (śeti) is farming, not livestock." }, "f1": { why: "Feminine: करते (karte) goes with a woman; तो (to) is a man, so करतो (karto) is used." } }
    notes: { "n1": "पशुपालन करणे (paśupālan karṇe), to keep livestock, is a noun with करणे (karṇe), do, and करतो (karto) agrees with तो (to)." }
  "mr-5072":
    native: "Labourers work in the fields."
    bases: { "मजूर": "labourers", "शेतात": "in the fields", "काम": "work", "करतात": "work" }
    confusables: { "w1": { why: "Farming: शेती (śeti) is farming, not the people who work." }, "f1": { why: "Singular: करतो (karto) is for one man; several labourers take करतात (kartāt)." } }
    notes: { "n1": "काम करणे (kām karṇe), to work, is a noun with करणे (karṇe), do; करतात (kartāt) is the plural for मजूर (majur), labourers." }
  "mr-5073":
    native: "Water is needed for irrigation."
    bases: { "सिंचनासाठी": "for irrigation", "पाणी": "water", "हवे": "needed" }
    confusables: { "w1": { why: "Canal: कालवा (kālvā) is a canal, a way to carry water, not a need." }, "w2": { why: "Not wanted: नको (nako) means not wanted, the opposite of हवे (have)." } }
    notes: { "n1": "हवे (have), needed, agrees with the thing needed, पाणी (pāṇi), which is neuter." }
  "mr-5074":
    native: "Farming is our work."
    bases: { "शेती": "farming", "हे": "this", "आमचे": "our", "काम": "work", "आहे": "is" }
    confusables: { "w1": { why: "Livestock: पशुपालन (paśupālan) is keeping animals, a different job." }, "f1": { why: "Plural: आहेत (āhet) is for several things; farming is one thing, so आहे (āhe) is used." } }
    notes: { "n1": "आमचे (āmce), our, ends in -े (-e) because काम (kām), work, the thing owned, is neuter." }
  "mr-5075":
    native: "I give fertiliser to the crop."
    bases: { "मी": "I", "पिकाला": "to the crop", "खत": "fertiliser", "देतो": "give" }
    confusables: { "w1": { why: "Seed: बी (bi) is a seed, not fertiliser." }, "w2": { why: "Take: घेतो (gheto) means take, the opposite of give." } }
    notes: { "n1": "पिकाला (pikālā), to the crop, is the oblique पिका (pikā) with -ला (-lā), 'to'." }
