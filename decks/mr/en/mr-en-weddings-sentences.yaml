cards:
  "mr-6836":
    native: "I got a wedding invitation."
    bases: { "मला": "me (to me)", "मिळाली": "got (feminine past)" }
    confusables: { "w1": { why: "आहेर (āher) is a gift at a wedding, not an invitation." }, "f1": { why: "मिळाला (miḷālā) is for a masculine thing; पत्रिका (patrikā) is feminine." }, "w2": { why: "साखरपुडा (sākhrpuḍā) is the engagement, a different event." } }
    notes: { "n1": "Getting is said with मला (malā), to me, and मिळाली (miḷāli) agrees with the thing received, the feminine पत्रिका (patrikā), invitation." }
  "mr-6837":
    native: "She puts henna on her hands."
    bases: { "हातांवर": "hands (on the hands)", "लावते": "puts on, applies" }
    confusables: { "w1": { why: "ठेवणे (ṭhevṇe) means to put down, not to apply." }, "f1": { why: "लावतो (lāvto) is said of a man." }, "w2": { why: "पाय (pāy) means foot, not hands." } }
    notes: { "n1": "On the hands is हातांवर (hātāṁvar): the plural हात (hāt) takes its oblique form हातां (hātām̐) before वर (var), 'on'." }
  "mr-6838":
    native: "The wedding procession goes through the village."
    bases: { "गावातून": "village (through the village)" }
    confusables: { "w1": { why: "पंगत (paṅgat) is a row of people eating, not a procession." }, "f1": { why: "जातो (jāto) is said of a man." }, "w2": { why: "गाडी (gāḍi) is a car or vehicle, not a procession." } }
    notes: { "n1": "Through the village is गावातून (gāvātun): the noun takes its oblique form गावा (gāvā) before -तून (-tun), 'through'." }
  "mr-6839":
    native: "Give the bride your blessing."
    confusables: { "w1": { why: "घेणे (gheṇe) means to take; the blessing is given, not taken." }, "f1": { why: "देतो (deto) is a statement: I give; द्या (dyā) is an order." }, "w2": { why: "सांगणे (sāṅgaṇe) means to say, not to give." } }
    notes: { "n1": "To the bride is नवरीला (navrilā): a feminine noun in -ी (-ī) such as नवरी (navri) takes -ला (-lā) directly, while a masculine noun first takes its oblique form." }
  "mr-6840":
    native: "She wears a mangalsutra."
    bases: { "घालते": "puts on, wears" }
    confusables: { "w1": { why: "साडी (sāḍi) is a saree, a garment, not a necklace." }, "f1": { why: "घालतो (ghālto) is said of a man." }, "w2": { why: "विवाह (vivāh) is marriage itself, not the necklace." } }
    notes: { "n1": "Wear is घालणे (ghālṇe), to put on, which is used for a mangalsutra as well as for clothes." }
  "mr-6841":
    native: "Their marriage took place."
    bases: { "त्यांचा": "their (of them)", "झाला": "happened, took place" }
    confusables: { "w1": { why: "विवाहित (vivāhit) is an adjective: married." }, "f1": { why: "झाली (jhāli) is for a feminine subject, such as पत्रिका (patrikā)." }, "w2": { why: "समारंभ (samārambh) is a ceremony, the event." } }
    notes: { "n1": "A marriage happens with होणे (hoṇe), to happen: विवाह (vivāh) झाला (jhālā), the marriage took place, is the usual phrase." }
  "mr-6842":
    native: "The two of them are married."
    bases: { "दोघे": "both", "आहेत": "are" }
    confusables: { "w1": { why: "विवाह (vivāh) is the noun marriage, not the adjective." }, "f1": { why: "आहे (āhe) is for one person; two people take आहेत (āhet)." }, "w2": { why: "अविवाहित (avivāhit) means unmarried." } }
  "mr-6843":
    native: "Sit down in the row for the meal."
    bases: { "बसा": "sit (polite order)" }
    confusables: { "w1": { why: "जेवण (jevaṇ) is a meal, the food." }, "f1": { why: "बसलो (baslo) is past tense: I sat (a man)." }, "w2": { why: "ठरवणे (ṭharvṇe) means to fix or decide, not to sit." } }
    notes: { "n1": "In the row is पंगतीत (paṅgatit): the feminine पंगत (paṅgat) takes its oblique form पंगती (paṅgati) before -त (-t), 'in'." }
  "mr-6844":
    native: "Everyone throws rice grains."
    bases: { "टाकतात": "throw" }
    confusables: { "w1": { why: "आशीर्वाद (āśirvād) is a blessing, the meaning of the custom." }, "f1": { why: "टाकतो (ṭākto) is said of one man." }, "w2": { why: "मेहंदी (mehandi) is henna, a paste, not rice." } }
  "mr-6845":
    native: "There is a ceremony at our home."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "मंगलाष्टक (maṅgalāṣṭak) are the verses sung at a wedding, not the event." }, "f1": { why: "आहेत (āhet) is plural; समारंभ (samārambh) is one ceremony." }, "w2": { why: "लग्न (lagna) is the wedding itself." } }
    notes: { "n1": "Our is आमच्या (āmcyā) before a noun: आमचा (āmcā), our, takes the form आमच्या (āmcyā) in आमच्या (āmcyā) घरी (gharī), at our home." }
  "mr-6846":
    native: "The bridegroom sits on a horse."
    bases: { "घोड्यावर": "horse (on a horse)", "बसतो": "sits" }
    confusables: { "w1": { why: "नवरी (navri) is the bride, not the groom." }, "w2": { why: "नवरा (navrā) is a husband, not the groom at a wedding." }, "f1": { why: "बसते (baste) is said of a woman." } }
    notes: { "n1": "On a horse is घोड्यावर (ghoḍyāvar): घोडा (ghoḍā), horse, takes its oblique form घोड्या (ghoḍyā) before वर (var), 'on'." }
  "mr-6847":
    native: "Give a gift at the wedding."
    confusables: { "w1": { why: "आशीर्वाद (āśirvād) is a blessing, not a gift." }, "f1": { why: "दिली (dili) is past tense: gave." }, "w2": { why: "पत्रिका (patrikā) is the invitation card, not a gift." } }
    notes: { "n1": "Give a gift is आहेर (āher) देणे (deṇe), a noun plus देणे (deṇe), to give; द्या (dyā) is the polite command." }
