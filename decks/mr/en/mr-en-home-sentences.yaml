cards:
  "mr-5848":
    native: "Our house is big."
    bases: { "आमचे": "our", "मोठे": "big", "आहे": "is" }
    confusables: { "w1": { why: "आम्ही (āmhi) means we; आमचे (āmce) means our." }, "f1": { why: "आहेत (āhet) is plural; one house takes आहे (āhe)." } }
    notes: { "n1": "आमचे (āmce), our, ends in -े (-e) because घर (ghar), house, is neuter; the possessive follows the house, not the family." }
  "mr-5849":
    native: "Food is ready in the kitchen."
    bases: { "स्वयंपाकघरात": "in the kitchen", "तयार": "ready", "आहे": "is" }
    confusables: { "w1": { why: "इथे (ithe) means here, not in the kitchen." }, "w2": { why: "बाहेर (bāhera) means outside, the opposite of स्वयंपाकघरात (svayampākgharāt)." } }
    notes: { "n1": "स्वयंपाकघरात (svayampākgharāt), in the kitchen, is the oblique of स्वयंपाकघर (svayampākghar), kitchen, with -ात (-āt), 'in'." }
  "mr-5850":
    native: "My room is on the upper floor."
    bases: { "माझी": "my", "वरच्या": "upper", "मजल्यावर": "on the floor", "आहे": "is" }
    confusables: { "w1": { why: "तू (tu) means you; माझी (mājhi) means my." }, "w2": { why: "खाली (khāli) means below, the opposite of वरच्या (varcyā)." } }
    notes: { "n1": "मजल्यावर (majlyāvar), on the floor, takes मजल्या (majlyā), the oblique of मजला (majlā), before -वर (-var), 'on'." }
  "mr-5851":
    native: "Open the window."
    bases: { "उघडा": "open (polite)" }
    confusables: { "w1": { why: "तू (tu) means you; the sentence is a polite command." }, "w2": { why: "बंद (band) means closed, the opposite of उघडा (ughḍā)." } }
    notes: { "n1": "उघडा (ughḍā) is the polite command; to a friend it is उघड (ughaḍ)." }
  "mr-5852":
    native: "Switch off the fan."
    bases: { "बंद": "off", "करा": "do (polite)" }
    confusables: { "w1": { why: "तू (tu) means you; the sentence is a polite command." }, "w2": { why: "उघडा (ughḍā) means open, the opposite of बंद (band)." } }
    notes: { "n1": "बंद करा (band karā), switch off, is the noun बंद (band) with करा (karā), the polite command of करणे (karṇe), do." }
  "mr-5853":
    native: "Turn on the lamp."
    bases: { "लावा": "switch on (polite)" }
    confusables: { "w1": { why: "तू (tu) means you; the sentence is a polite command." }, "w2": { why: "विझवा (vijhavā) means put out, the opposite of लावा (lāvā)." } }
    notes: { "n1": "लावा (lāvā) is the polite command; to a friend it is लाव (lāv)." }
  "mr-5854":
    native: "There is a book on the table."
    bases: { "टेबलावर": "on the table", "आहे": "is" }
    confusables: { "w1": { why: "खुर्ची (khurci) means chair; टेबलावर (ṭebalāvar) means on the table." }, "f1": { why: "आहेत (āhet) is plural; one book takes आहे (āhe)." } }
    notes: { "n1": "टेबलावर (ṭebalāvar), on the table, adds -ा- (-ā-) to टेबल (ṭebal), table, before -वर (-var), 'on'." }
  "mr-5855":
    native: "Our neighbours are very good."
    bases: { "आमचे": "our", "चांगले": "good", "आहेत": "are" }
    confusables: { "w1": { why: "आम्ही (āmhi) means we; आमचे (āmce) means our." }, "f1": { why: "आहे (āhe) is for one; the neighbours are plural, so आहेत (āhet) is used." } }
  "mr-5856":
    native: "I pay the rent on time."
    bases: { "देतो": "pay", "वेळेवर": "on time" }
    confusables: { "w1": { why: "तो (to) means he; मी (mi) means I." }, "f1": { why: "देते (dete) is the feminine form, for a woman who pays." } }
  "mr-5857":
    native: "There are flowers in the garden."
    bases: { "बागेत": "in the garden", "फुले": "flowers (plural)", "आहेत": "are" }
    confusables: { "w1": { why: "इथे (ithe) means here, not in the garden." }, "f1": { why: "आहे (āhe) is for one thing; फुले (phule) is plural, so आहेत (āhet) is used." } }
    notes: { "n1": "बागेत (bāget), in the garden, follows the feminine pattern: बाग (bāg) becomes बागे- (bāge-) before -त (-t), 'in', as शाळा (śāḷā) gives शाळेत (śāḷet)." }
  "mr-5858":
    native: "Where is my key?"
    bases: { "माझी": "my", "आहे": "is" }
    confusables: { "w1": { why: "कधी (kadhi) asks when, not where." }, "f1": { why: "आहेत (āhet) is plural; a key is one thing, so आहे (āhe) is used." } }
    notes: { "n1": "माझी (mājhi), my, ends in -ी (-ī) because किल्ली (killi), key, is feminine." }
  "mr-5859":
    native: "This building is old."
    bases: { "जुनी": "old", "आहे": "is" }
    confusables: { "w1": { why: "हे (he) is this for a neuter noun; इमारत (imārat) is feminine, so ही (hi) is used." }, "w2": { why: "आधुनिक (ādhunik) means modern, the opposite of old." } }
    notes: { "n1": "ही (hi), this, and जुनी (juni), old, take the feminine ending because इमारत (imārat), building, is feminine." }
