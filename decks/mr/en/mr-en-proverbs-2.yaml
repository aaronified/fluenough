native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs 2"
description: "Twenty Marathi proverbs from the proverbs list on Marathi Wikiquote, each with its English meaning and a literal note. Not yet checked by a Marathi speaker: please report any mistake."
