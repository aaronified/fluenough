tags: ["unreviewed"]
cards:
  "mr-4250":
    native: "Stretch your legs according to the bedding."
    notes:
      "literal": "Said that one should spend only as much as one has, and plan within one's means."
  "mr-4251":
    native: "Where there are leftovers, the ghosts will gather."
    notes:
      "literal": "Said that people gather wherever there is something to be had."
  "mr-4252":
    native: "If there is nothing in the well, how can the bucket bring anything up?"
    notes:
      "literal": "Said that one cannot give or get what is not there to begin with."
  "mr-4253":
    native: "Generous at someone else's expense."
    notes:
      "literal": "Said of a person who is free with what belongs to another."
  "mr-4254":
    native: "A cobra settles into a hole someone else has dug."
    notes:
      "literal": "Said of someone who takes over a place or a benefit that another person made ready."
  "mr-4255":
    native: "Drawing lines on flour that is already ground."
    notes:
      "literal": "Said of someone who adds a little to finished work and claims the credit."
  "mr-4256":
    native: "A stone dropped on one's own foot by one's own hand."
    notes:
      "literal": "Said of someone who harms themselves by their own action."
  "mr-4257":
    native: "A well on this side and another well on that side."
    notes:
      "literal": "Said when every way out leads to trouble, and one is caught between two dangers."
  "mr-4258":
    native: "A shallow stream makes a lot of noise."
    notes:
      "literal": "Said of people who talk loudly but have little depth."
  "mr-4259":
    native: "Herding goats from the back of a camel."
    notes:
      "literal": "Said of someone who gives orders from a lofty position, without doing the work."
  "mr-4260":
    native: "Not one good cloth, but a heap of rags."
    notes:
      "literal": "Said of someone who has many things, none of them of good quality."
  "mr-4261":
    native: "A pot under the arm, and a search all round the village."
    notes:
      "literal": "Said of someone who looks far away for what is already close at hand."
  "mr-4262":
    native: "It came from behind the ear and then became sharp."
    notes:
      "literal": "Said of a newcomer who, after arriving late, claims more authority than those who were there first."
  "mr-4263":
    native: "An uncle while there is work, a grandmother while there is buttermilk."
    notes:
      "literal": "Said of people who are kind only for as long as they need something from you."
  "mr-4264":
    native: "The slices are gone, and only the holes are left."
    notes:
      "literal": "Said when what was valuable is gone and only the empty remains."
  "mr-4265":
    native: "When the need is over, let the healer die."
    notes:
      "literal": "Said of someone who is forgotten once they are no longer needed."
  "mr-4266":
    native: "What does a donkey know of the taste of jaggery?"
    notes:
      "literal": "Said of someone who cannot appreciate what is good or valuable."
  "mr-4267":
    native: "Four days for the mother-in-law, four days for the daughter-in-law."
    notes:
      "literal": "Said that power and turns pass from one person to another, so no one keeps them for good."
  "mr-4268":
    native: "Moonlight in the mind of a thief."
    notes:
      "literal": "Said of a guilty person who is afraid even of what is harmless."
  "mr-4269":
    native: "The lazy person gets twice the work."
    notes:
      "literal": "Said that whoever delays a task will end up with more to do."
