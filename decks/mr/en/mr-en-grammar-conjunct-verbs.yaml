schema: 1
id: "mr-en-grammar-conjunct-verbs"
kind: "layer"
core: "mr-grammar-conjunct-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Noun + करणे (karṇe) and होणे (hoṇe), and feelings that come to you"
license: "CC0-1.0"
description: "Many Marathi verbs are a noun with करणे (karṇe), do, or होणे (hoṇe), become: मदत करणे (madat karṇe), to help. And hunger, sleep and fear are things that come to you: मला भूक लागली (malā bhuk lāgli), I'm hungry. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0534":
    native: "to work"
    notes:
      "n1": "'To do work': मी बँकेत काम करतो (mi bam̐ket kām karto), I work in a bank."
    bases:
      "करणे": "to do; to make"
  "mr-0535":
    native: "to help"
    notes:
      "n1": "The one helped takes -ला (-lā): मला मदत करा (malā madat karā), please help me."
    bases:
      "मदत": "help"
      "करणे": "to do; to make"
  "mr-0536":
    native: "to phone"
    notes:
      "n1": "मी तुम्हाला फोन करीन (mi tumhālā fon karin), I'll phone you."
    bases:
      "फोन": "phone"
      "करणे": "to do; to make"
  "mr-0537":
    native: "to start (something)"
    notes:
      "n1": "With करणे (karṇe) someone starts something; with होणे (hoṇe) it starts by itself: काम सुरू केले, (they) started the work; काम सुरू झाले (kām suru jhāle), the work started."
    bases:
      "सुरू": "begun; started"
      "करणे": "to do; to make"
  "mr-0538":
    native: "to start; to begin"
    notes:
      "n1": "चित्रपट कधी सुरू होईल? (chitrapat kadhi suru hoil?), when will the film start?"
    bases:
      "सुरू": "begun; started"
      "होणे": "to be; to become"
  "mr-0539":
    native: "to close; to switch off"
    notes:
      "n1": "बंद (band) is 'shut, off': दुकान बंद आहे (dukān band āhe), the shop is closed. Its opposite is उघडणे (ughaḍṇe), to open."
    bases:
      "बंद": "closed; off"
      "करणे": "to do; to make"
  "mr-0540":
    native: "to marry"
    notes:
      "n1": "'To do a wedding': त्यांनी लग्न केले (tyānni lagna kele), they got married."
    bases:
      "करणे": "to do; to make"
  "mr-0541":
    native: "to get ready"
    notes:
      "n1": "तयार (tayār) is 'ready': मी तयार आहे (mi tayār āhe), I'm ready."
    bases:
      "तयार": "ready"
      "होणे": "to be; to become"
  "mr-0542":
    native: "I'm hungry."
    notes:
      "n1": "'Hunger has struck me': the one who feels it takes -ला (-lā), and the verb agrees with भूक (bhuk), which is feminine. Often just मला भूक लागली (malā bhuk lāgli)."
    bases:
      "भूक": "hunger"
      "लागली": "to be felt; to take (time); to be necessary"
      "आहे": "to be"
  "mr-0543":
    native: "I'm thirsty."
    notes:
      "n1": "तहान (tahān), thirst, is feminine too."
    bases:
      "तहान": "thirst"
      "लागली": "to be felt; to take (time); to be necessary"
      "आहे": "to be"
  "mr-0544":
    native: "I'm sleepy."
    notes:
      "n1": "'Sleep is coming to me'."
    bases:
      "झोप": "sleep"
      "येत": "to come"
      "आहे": "to be"
  "mr-0545":
    native: "I'm scared."
    notes:
      "n1": "वाटणे (vāṭṇe) is 'to feel, to seem': मला बरे वाटत नाही (malā bare vāṭat nāhi), I don't feel well."
    bases:
      "भीती": "fear"
      "वाटते": "to feel; to seem"
  "mr-0546":
    native: "I miss you."
    notes:
      "n1": "'Your memory comes to me'. To someone you call तुम्ही (tumhi): मला तुमची आठवण येते (malā tumci āṭhvaṇ yete)."
    bases:
      "तुझी": "your (to a friend)"
      "आठवण": "memory; missing someone"
      "येते": "to come"
  "mr-0547":
    native: "I got angry."
    notes:
      "n1": "'Anger came to me': राग (rāg) is masculine, so आला (ālā)."
    bases:
      "राग": "anger"
      "आला": "to come"
  "mr-0548":
    native: "I feel cold."
    notes:
      "n1": "'Cold sounds on me'. थंडी (thaṇḍi) is cold weather."
    bases:
      "थंडी": "cold"
      "वाजते": "to strike (the hour); to be felt (cold)"
