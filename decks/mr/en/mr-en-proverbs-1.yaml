# Layer for mr-proverbs-1: each proverb's meaning and a literal English rendering.
schema: 1
id: "mr-en-proverbs-1"
kind: "layer"
core: "mr-proverbs-1"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs 1"
description: "Twenty short Marathi proverbs from Marathi Wikiquote, each with its meaning and a literal English rendering. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-4200":
    native: "Too much of anything ends in ruin."
    notes:
      "literal": "Literally: where there is excess, there is dirt."
    bases:
      "अती": { meaning: "excess" }
      "तेथे": { meaning: "there" }
      "माती": { meaning: "dirt" }
  "mr-4201":
    native: "When the one in charge does not watch his duty, those under him take advantage."
    notes:
      "literal": "Literally: the blind one grinds, and the dog eats the flour."
    bases:
      "अंधळं": { meaning: "blind" }
      "दळतं": { meaning: "grinds" }
      "आणि": { meaning: "and" }
      "कुत्र": { meaning: "dog" }
      "पीठ": { meaning: "flour" }
      "खातं": { meaning: "eats" }
  "mr-4202":
    native: "With money paid, any job gets done quickly."
    notes:
      "literal": "Literally: if there is money, then the work will get done."
    bases:
      "असेल": { meaning: "is, if there is" }
      "दाम": { meaning: "money" }
      "तर": { meaning: "then" }
      "होईल": { meaning: "will happen" }
      "काम": { meaning: "work" }
  "mr-4203":
    native: "Look after your family's needs first, and then give time to God."
    notes:
      "literal": "Literally: first the belly-god, then Vithoba."
    bases:
      "आधी": { meaning: "first" }
      "पोटोबा": { meaning: "the belly, food" }
      "मग": { meaning: "then" }
      "विठोबा": { meaning: "Vithoba, a god" }
  "mr-4204":
    native: "The faults of those close to us are hard to punish."
    notes:
      "literal": "Literally: one's own teeth and one's own lips."
    bases:
      "आपलेच": { meaning: "one's own" }
      "दात": { meaning: "tooth" }
      "आणि": { meaning: "and" }
      "ओठ": { meaning: "lip" }
  "mr-4205":
    native: "Preparing only after a crisis has already begun is too late."
    notes:
      "literal": "Literally: digging a well when the fire has already started."
    bases:
      "आग": { meaning: "fire" }
      "लागल्यावर": { meaning: "to catch, when it caught" }
      "विहीर": { meaning: "well" }
      "खणणे": { meaning: "to dig" }
  "mr-4206":
    native: "Every problem has a cause behind it."
    notes:
      "literal": "Literally: without fire, smoke is not seen."
    bases:
      "आगीशिवाय": { meaning: "without fire" }
      "धूर": { meaning: "smoke" }
      "दिसत": { meaning: "being seen" }
      "नाही": { meaning: "not" }
  "mr-4207":
    native: "Where there is a will, there is a way."
    notes:
      "literal": "Literally: where there is a wish, there is a way."
    bases:
      "इच्छा": { meaning: "wish" }
      "तेथे": { meaning: "there" }
      "मार्ग": { meaning: "way" }
  "mr-4208":
    native: "Decide at once and state the matter plainly, without hiding anything."
    notes:
      "literal": "Literally: one blow, two pieces."
    bases:
      "एक": { meaning: "one" }
      "घाव": { meaning: "blow" }
      "दोन": { meaning: "two" }
      "तुकडे": { meaning: "pieces" }
  "mr-4209":
    native: "Every quarrel or mistake involves more than one person."
    notes:
      "literal": "Literally: a clap does not sound with one hand."
    bases:
      "एका": { meaning: "one" }
      "हाताने": { meaning: "hand" }
      "टाळी": { meaning: "clap" }
      "वाजत": { meaning: "sounding" }
      "नाही": { meaning: "not" }
  "mr-4210":
    native: "A person who lives alone has no need to adjust to others, and so is at peace."
    notes:
      "literal": "Literally: a lone soul is Sadashiv."
    bases:
      "एकटा": { meaning: "alone" }
      "जीव": { meaning: "life, soul" }
      "सदाशिव": { meaning: "Sadashiv, a name" }
  "mr-4211":
    native: "Hear what everyone says, then decide with your own judgement."
    notes:
      "literal": "Literally: listen to the people, do what the mind says."
    bases:
      "ऐकावे": { meaning: "to listen" }
      "जनाचे": { meaning: "people" }
      "करावे": { meaning: "to do" }
      "मनाचे": { meaning: "mind" }
  "mr-4212":
    native: "Deal with a troublesome person on their own terms."
    notes:
      "literal": "Literally: remove a thorn with a thorn."
    bases:
      "काट्याने": { meaning: "thorn" }
      "काटा": { meaning: "thorn" }
      "काढावा": { meaning: "to remove" }
  "mr-4213":
    native: "Calling what you cannot have worthless hides the wanting."
    notes:
      "literal": "Literally: for the fox, the grapes are sour."
    bases:
      "कोल्ह्याला": { meaning: "fox" }
      "द्राक्षे": { meaning: "grapes" }
      "आंबट": { meaning: "sour" }
  "mr-4214":
    native: "A person's nature never changes, however long you try."
    notes:
      "literal": "Literally: a dog's tail is crooked, and it stays crooked."
    bases:
      "कुत्र्याचे": { meaning: "dog" }
      "शेपूट": { meaning: "tail" }
      "वाकडे": { meaning: "crooked" }
      "ते": { meaning: "that" }
      "वाकडेच": { meaning: "crooked, indeed" }
  "mr-4215":
    native: "Every household has the same troubles."
    notes:
      "literal": "Literally: in every house, clay hearths."
    bases:
      "घरोघरी": { meaning: "in every house" }
      "मातीच्या": { meaning: "clay" }
      "चुली": { meaning: "hearths" }
  "mr-4216":
    native: "The proud are brought low in the end."
    notes:
      "literal": "Literally: the house of pride falls down."
    bases:
      "गर्वाचे": { meaning: "pride" }
      "घर": { meaning: "house" }
      "खाली": { meaning: "down" }
  "mr-4217":
    native: "A guilty person raises a loud outcry to look innocent."
    notes:
      "literal": "Literally: the thief's outcries are reversed."
    bases:
      "चोराच्या": { meaning: "thief" }
      "उलट्या": { meaning: "reversed" }
      "बोंबा": { meaning: "outcry" }
  "mr-4218":
    native: "There is always someone cleverer than you."
    notes:
      "literal": "Literally: a peacock over the thief, and one and a quarter for the lion."
    bases:
      "चोरावर": { meaning: "on the thief" }
      "मोर": { meaning: "peacock" }
      "शेरास": { meaning: "to the lion" }
      "सव्वाशेर": { meaning: "one and a quarter" }
  "mr-4219":
    native: "The one who was meant to protect ended up destroying."
    notes:
      "literal": "Literally: the fence ate the field."
    bases:
      "कुंपणाने": { meaning: "fence" }
      "शेत": { meaning: "field" }
      "खाल्ले": { meaning: "ate" }
