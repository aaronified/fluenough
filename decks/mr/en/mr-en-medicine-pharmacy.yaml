name: "Medicine: at the pharmacy"
license: "CC-BY-SA-4.0"
description: "Phrases for buying and taking medicine: when to take a tablet, where to keep it and what it may do. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-8010":
    native: "Take this tablet after food."
    notes: { n1: "जेवणानंतर (jevṇānantar) means after the meal, and जेवण्यापूर्वी (jevaṇyāpurvi) means before the meal." }
  "mr-8011":
    native: "Take this tablet before food."
  "mr-8012":
    native: "Take it three times a day."
  "mr-8013":
    native: "Take one tablet every morning."
  "mr-8014":
    native: "Take this medicine before sleeping."
  "mr-8015":
    native: "Keep this medicine in a cool place."
  "mr-8016":
    native: "This medicine may make you sleepy."
  "mr-8017":
    native: "What is the price of this medicine?"
  "mr-8018":
    native: "Keep it away from children."
  "mr-8019":
    native: "Finish the full course of the medicine."
