schema: 1
id: "mr-en-adjectives-2"
kind: "layer"
core: "mr-adjectives-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More adjectives"
description: "Describing people and things further: how clever, lazy or kind someone is, heavy or light, old or new, and how food tastes. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-1244":
    native: "clever, bright"
    notes:
      "n1": "{1} describes a clever person."
    examples:
      "ती खूप हुशार आहे.": { native: "She is very clever.", bases: { "आहे": "to be" } }
      "हुशार मुलांना बक्षीस मिळालं.": { native: "The clever children got a prize.", bases: { "मिळालं": "to get" } }
  "mr-1245":
    native: "lazy"
    notes:
      "n1": "{1} describes someone who does not want to work."
    examples:
      "तो फार आळशी आहे.": { native: "He is very lazy.", bases: { "आहे": "to be" } }
      "आळशी माणूस लवकर उठत नाही.": { native: "A lazy person does not get up early.", bases: { "नाही": "not" } }
  "mr-1246":
    native: "calm, quiet"
    notes:
      "n1": "{1} describes calm or quiet, as of a place or a person."
    examples:
      "रात्री गाव शांत असतं.": { native: "At night the village is quiet.", bases: { "असतं": "to be" } }
      "तो शांत बसला.": { native: "He sat quietly.", bases: { "बसला": "to sit" } }
  "mr-1247":
    native: "empty"
    notes:
      "n1": "{1} means empty. Its opposite is भरलेला (bharlelā), full."
    examples:
      "बाटली रिकामी आहे.": { native: "The bottle is empty.", bases: { "आहे": "to be", "रिकामी": "empty" } }
      "रिकामा खोका आणा.": "Bring an empty box."
  "mr-1248":
    native: "dense, thick"
    notes:
      "n1": "{1} describes something close together or thick, such as a forest or a liquid."
    examples:
      "जंगल दाट आहे.": { native: "The forest is dense.", bases: { "आहे": "to be" } }
      "दूध दाट आहे.": { native: "The milk is thick.", bases: { "आहे": "to be" } }
  "mr-1249":
    native: "thin, watery"
    notes:
      "n1": "{1} describes something thin in width or runny, such as soup."
    examples:
      "आमटी पातळ झाली.": { native: "The lentil soup became thin.", bases: { "झाली": "to become" } }
      "पातळ कागद फाटला.": { native: "The thin paper tore.", bases: { "फाटला": "to tear" } }
  "mr-1250":
    native: "young"
    notes:
      "n1": "{1} describes someone young. Its opposite is म्हातारा (mhātārā), old."
    examples:
      "तो तरुण आहे.": { native: "He is young.", bases: { "आहे": "to be" } }
      "तरुण मुलं खेळत होती.": { native: "The young children were playing.", bases: { "होती": "to be" } }
  "mr-1251":
    native: "old (of a person)"
    notes:
      "n1": "{1} describes an old person. The feminine is म्हातारी (mhātārī)."
    examples:
      "म्हातारे आजोबा बसले होते.": { native: "The old grandfather was sitting.", bases: { "बसले": "to sit", "होते": "to be" } }
      "म्हातारी आजी गोष्ट सांगते.": "The old grandmother tells a story."
  "mr-1252":
    native: "fresh"
    notes:
      "n1": "{1} describes fresh food or fresh air."
    examples:
      "ताज्या भाज्या आणल्या.": { native: "I brought fresh vegetables.", bases: { "ताज्या": "fresh" } }
      "सकाळची हवा ताजी असते.": { native: "The morning air is fresh.", bases: { "असते": "to be" } }
  "mr-1253":
    native: "stale, old (of food)"
    notes:
      "n1": "{1} describes food that is no longer fresh."
    examples:
      "ही पोळी शिळी आहे.": { native: "This flatbread is stale.", bases: { "आहे": "to be", "शिळी": "stale, old (of food)" } }
      "शिळं अन्न खाऊ नका.": "Do not eat stale food."
  "mr-1254":
    native: "raw, unripe"
    notes:
      "n1": "{1} describes food that is not cooked or ripe."
    examples:
      "हा आंबा कच्चा आहे.": { native: "This mango is unripe.", bases: { "आहे": "to be" } }
      "कच्चा कांदा खाऊ नका.": "Do not eat raw onion."
  "mr-1255":
    native: "sour"
    notes:
      "n1": "{1} describes a sour taste, such as lemon or tamarind."
    examples:
      "लिंबू आंबट आहे.": { native: "The lemon is sour.", bases: { "आहे": "to be" } }
      "चिंच आंबट लागते.": { native: "Tamarind tastes sour.", bases: { "लागते": "to taste" } }
  "mr-1256":
    native: "bitter"
    notes:
      "n1": "{1} describes a bitter taste, such as neem."
    examples:
      "कारलं कडू असतं.": { native: "Bitter gourd is bitter.", bases: { "कारलं": "bitter gourd", "असतं": "to be" } }
      "औषध कडू आहे.": { native: "The medicine is bitter.", bases: { "आहे": "to be" } }
  "mr-1257":
    native: "honest"
    notes:
      "n1": "{1} describes an honest person."
    examples:
      "तो प्रामाणिक माणूस आहे.": { native: "He is an honest person.", bases: { "आहे": "to be" } }
      "प्रामाणिक असणं चांगलं आहे.": { native: "Being honest is good.", bases: { "असणं": "to be", "आहे": "to be" } }
  "mr-1258":
    native: "hard-working"
    notes:
      "n1": "{1} describes someone who works hard."
    examples:
      "शेतकरी मेहनती असतात.": { native: "Farmers are hard-working.", bases: { "असतात": "to be" } }
      "ती मेहनती मुलगी आहे.": { native: "She is a hard-working girl.", bases: { "आहे": "to be" } }
  "mr-1259":
    native: "kind, compassionate"
    notes:
      "n1": "{1} describes a kind person."
    examples:
      "आजी खूप दयाळू आहे.": { native: "Grandmother is very kind.", bases: { "आहे": "to be" } }
      "दयाळू लोक मदत करतात.": "Kind people help."
  "mr-1260":
    native: "short-tempered"
    notes:
      "n1": "{1} describes someone who gets angry easily."
    examples:
      "तो रागीट आहे.": { native: "He is short-tempered.", bases: { "आहे": "to be" } }
      "रागीट माणसाशी बोलू नका.": "Do not talk to a short-tempered person."
  "mr-1261":
    native: "thirsty"
    notes:
      "n1": "{1} describes someone who needs water. The feminine is तहानलेली (tahānlelī)."
    examples:
      "मी तहानलेला आहे.": { native: "I am thirsty.", bases: { "आहे": "to be" } }
      "तहानलेल्या माणसाला पाणी द्या.": { native: "Give water to the thirsty person.", bases: { "तहानलेल्या": "thirsty" } }
