schema: 1
id: "mr-en-verbs-5"
kind: "layer"
core: "mr-verbs-5"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs 5"
description: "Verbs for explaining, solving, refusing and improving: to understand a thing, to solve a problem, to accept or refuse and to get better or worse. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-1794":
    native: "to explain"
    notes:
      "n1": "{1} is explaining something so that someone understands."
    examples:
      "शिक्षकांनी धडा समजावला.": { native: "The teacher explained the lesson.", bases: { "धडा": "lesson", "समजावला": "to explain" } }
      "मला नीट समजावून सांगा.": { native: "Explain it to me properly.", bases: { "समजावून": "to explain" } }
  "mr-1795":
    native: "to recognise"
    notes:
      "n1": "{1} is knowing someone or something by sight, sound or description."
    examples:
      "मी तुला ओळखलं.": { native: "I recognised you.", bases: { "ओळखलं": "to recognise" } }
      "त्याचा आवाज ओळखता येतो.": { native: "His voice can be recognised.", bases: { "ओळखता": "to recognise", "आवाज": "voice" } }
  "mr-1796":
    native: "to solve"
    notes:
      "n1": "{1} is solving a problem or a question."
    examples:
      "त्याने गणित सोडवलं.": { native: "He solved the maths problem.", bases: { "सोडवलं": "to solve" } }
      "हा प्रश्न कसा सोडवायचा?": { native: "How should this question be solved?", bases: { "प्रश्न": "question", "सोडवायचा": "to solve" } }
  "mr-1797":
    native: "to improve, to correct"
    notes:
      "n1": "{1} is making something better or correcting a fault."
    examples:
      "त्याने आपली चूक सुधारली.": { native: "He corrected his mistake.", bases: { "आपली": "his own", "चूक": "mistake", "सुधारली": "to improve, to correct" } }
      "तिचं इंग्रजी खूप सुधारलं.": { native: "Her English improved a lot.", bases: { "इंग्रजी": "English", "सुधारलं": "to improve, to correct" } }
  "mr-1798":
    native: "to get worse, to spoil"
    notes:
      "n1": "{1} is becoming worse or spoilt."
    examples:
      "त्याची तब्येत बिघडली.": { native: "His health got worse.", bases: { "तब्येत": "health", "बिघडली": "to get worse, to spoil" } }
      "हवा बिघडत चालली आहे.": { native: "The air is getting worse.", bases: { "आहे": "to be", "बिघडत": "to get worse, to spoil" } }
  "mr-1799":
    native: "to refuse, to deny"
    notes:
      "n1": "{1} is refusing a request or an offer."
    examples:
      "त्याने मदत नाकारली.": { native: "He refused the help.", bases: { "नाकारली": "to refuse, to deny" } }
      "त्यांनी आरोप नाकारला.": { native: "They denied the charge.", bases: { "नाकारला": "to refuse, to deny" } }
  "mr-1800":
    native: "to accept"
    notes:
      "n1": "{1} is accepting an offer, a responsibility or a fact."
    examples:
      "मी तुमची ऑफर स्वीकारली.": { native: "I accepted your offer.", bases: { "स्वीकारली": "to accept" } }
      "सत्य स्वीकारा.": { native: "Accept the truth.", bases: { "स्वीकारा": "to accept" } }
  "mr-1801":
    native: "to beg, to plead"
    notes:
      "n1": "{1} is pleading with someone to do something."
    examples:
      "तो मला विनवत होता.": { native: "He was pleading with me.", bases: { "होता": "to be", "विनवत": "to beg, to plead" } }
      "त्याने काहीतरी मिळावं म्हणून विनवलं.": { native: "He pleaded to get something.", bases: { "मिळावं": "to get", "विनवलं": "to beg, to plead" } }
  "mr-1802":
    native: "to match, to arrange"
    notes:
      "n1": "{1} is matching two things or arranging something together."
    examples:
      "सगळे जुळवून घ्या.": { native: "Adjust everything together.", bases: { "जुळवून": "to match, to arrange" } }
      "त्यांनी लग्न जुळवलं.": { native: "They arranged the marriage.", bases: { "जुळवलं": "to match, to arrange" } }
  "mr-1803":
    native: "to break (come apart)"
    notes:
      "n1": "{1} is coming apart or breaking, by itself."
    examples:
      "दोरी तुटली.": { native: "The rope broke.", bases: { "दोरी": "rope", "तुटली": "to break (come apart)" } }
      "त्यांच्यातलं नातं तुटलं.": { native: "Their relationship broke.", bases: { "तुटलं": "to break (come apart)" } }
  "mr-1804":
    native: "to slip, to slide"
    notes:
      "n1": "{1} is slipping or sliding."
    examples:
      "पाय घसरला आणि मी पडलो.": { native: "My foot slipped and I fell.", bases: { "घसरला": "to slip, to slide" } }
      "रस्ता ओला आहे, जपून चाला.": { native: "The road is wet, walk carefully.", bases: { "आहे": "to be" } }
  "mr-1805":
    native: "to get stuck"
    notes:
      "n1": "{1} is becoming stuck or caught."
    examples:
      "गाडी चिखलात अडकली.": { native: "The car got stuck in the mud.", bases: { "चिखलात": "in the mud", "अडकली": "to get stuck" } }
      "लिफ्टमध्ये कोणीतरी अडकलं.": { native: "Someone got stuck in the lift.", bases: { "अडकलं": "to get stuck" } }
  "mr-1806":
    native: "to deliver, to take to"
    notes:
      "n1": "{1} is taking something or someone to a place."
    examples:
      "मी पत्र पोहोचवलं.": { native: "I delivered the letter.", bases: { "पोहोचवलं": "to deliver, to take to" } }
      "तुम्हाला घरी पोहोचवतो.": { native: "I will take you home.", bases: { "पोहोचवतो": "to deliver, to take to" } }
  "mr-1807":
    native: "to collect"
    notes:
      "n1": "{1} is gathering things together."
    bases:
      "गोळा": "gathered"
    examples:
      "मुलांनी फुलं गोळा केली.": { native: "The children collected flowers.", bases: { "फुलं": "flowers", "गोळा": "collected" } }
      "पैसे गोळा करा.": { native: "Collect the money.", bases: { "गोळा": "collect" } }
  "mr-1808":
    native: "to gather, to collect together"
    notes:
      "n1": "{1} is bringing people or things together."
    examples:
      "त्याने सगळ्यांना जमवलं.": { native: "He gathered everyone together.", bases: { "जमवलं": "to gather, to collect together" } }
      "पैसे जमवून मदत केली.": { native: "I collected money and helped.", bases: { "जमवून": "to gather, to collect together" } }
  "mr-1809":
    native: "to be involved, to be engaged"
    notes:
      "n1": "{1} is being busy with or caught up in something."
    examples:
      "ती कामात गुंतली आहे.": { native: "She is engaged in work.", bases: { "आहे": "to be", "गुंतली": "to be involved, to be engaged" } }
      "आम्ही गप्पांमध्ये गुंतलो.": { native: "We got caught up in conversation.", bases: { "गप्पांमध्ये": "in conversation", "गुंतलो": "to be involved, to be engaged" } }
  "mr-1810":
    native: "to recover, to steady oneself"
    notes:
      "n1": "{1} is recovering from a shock or steadying oneself."
    examples:
      "तो धक्क्यातून सावरला.": { native: "He recovered from the shock.", bases: { "धक्क्यातून": "from the shock", "सावरला": "to recover, to steady oneself" } }
      "भिंत धरून स्वतःला सावर.": { native: "Hold the wall and steady yourself.", bases: { "सावर": "to recover, to steady oneself" } }
  "mr-1811":
    native: "to think"
    notes:
      "n1": "{1} is thinking about something."
    examples:
      "याचा नीट विचार करा.": "Think about this carefully."
      "मी तुझ्याबद्दल विचार करत होतो.": { native: "I was thinking about you.", bases: { "होतो": "to be" } }
  "mr-1812":
    native: "to convince"
    notes:
      "n1": "{1} is convincing someone of something."
    examples:
      "त्याला मी पटवलं.": { native: "I convinced him.", bases: { "पटवलं": "to convince" } }
      "तुझं म्हणणं मला पटवून दे.": { native: "Convince me of what you say.", bases: { "म्हणणं": "saying", "पटवून": "to convince" } }
  "mr-1813":
    native: "to pick (one by one)"
    notes:
      "n1": "{1} is picking things one by one, such as grain or flowers."
    examples:
      "आजी तांदूळ वेचते.": { native: "Grandmother picks the rice grains.", bases: { "वेचते": "to pick (one by one)" } }
      "शेतात कापूस वेचला.": { native: "I picked cotton in the field.", bases: { "कापूस": "cotton", "वेचला": "to pick (one by one)" } }
  "mr-1814":
    native: "to immerse, to dissolve"
    notes:
      "n1": "{1} is putting an idol or a thing into water as a ritual."
    bases:
      "विसर्जन": "immersion"
    examples:
      "गणपतीचं विसर्जन केलं.": { native: "We immersed the Ganesh idol.", bases: { "विसर्जन": "immersion" } }
      "विसर्जनाला सगळे आले.": { native: "Everyone came for the immersion.", bases: { "विसर्जनाला": "for the immersion" } }
  "mr-1815":
    native: "teaching, lesson"
    notes:
      "n1": "{1} is a teaching or a lesson that one learns from experience."
    examples:
      "आईची शिकवण मोलाची आहे.": { native: "Mother's teaching is valuable.", bases: { "मोलाची": "valuable", "आहे": "to be" } }
      "या अनुभवातून मोठी शिकवण मिळाली.": { native: "A big lesson was got from this experience.", bases: { "मिळाली": "to get" } }
