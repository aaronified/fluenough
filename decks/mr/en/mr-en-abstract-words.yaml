schema: 1
id: "mr-en-abstract-words"
kind: "layer"
core: "mr-abstract-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Abstract words"
description: "Words for ideas and values: truth and justice, patience and kindness, progress and freedom, and the words to talk about what they mean. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-1722":
    native: "imagination, idea"
    notes:
      "n1": "{1} is imagination, an idea formed in the mind."
    examples:
      "तुझी कल्पना खूप मोठी आहे.": { native: "Your imagination is very big.", bases: { "आहे": "to be" } }
      "ही कल्पना चांगली वाटते.": { native: "This idea seems good.", bases: { "वाटते": "to seem" } }
  "mr-1723":
    native: "concept"
    notes:
      "n1": "{1} is a concept, a general idea behind something."
    examples:
      "ही संकल्पना समजायला कठीण आहे.": { native: "This concept is hard to understand.", bases: { "आहे": "to be" } }
      "नवीन संकल्पना शिकायला हवी.": { native: "One should learn a new concept.", bases: { "नवीन": "new" } }
  "mr-1724":
    native: "truth"
    notes:
      "n1": "{1} is truth, what is real and true."
    examples:
      "सत्य कडू असतं.": { native: "The truth is bitter.", bases: { "असतं": "to be" } }
      "सत्याचा शोध घ्यायला हवा.": { native: "One should search for the truth.", bases: { "शोध": "search" } }
  "mr-1725":
    native: "falsehood, untruth"
    notes:
      "n1": "{1} is falsehood, the opposite of truth."
    examples:
      "असत्यावर टिकून राहता येत नाही.": { native: "You cannot survive on falsehood.", bases: { "टिकून": "to survive", "नाही": "not" } }
      "असत्याचा विजय होत नाही.": { native: "Falsehood does not win.", bases: { "होत": "to become", "नाही": "not" } }
  "mr-1726":
    native: "equality"
    notes:
      "n1": "{1} is equality, being treated the same."
    examples:
      "सगळ्यांना समानता मिळावी.": { native: "Everyone should get equality.", bases: { "मिळावी": "to get" } }
      "समानतेसाठी लढायला हवं.": "One should fight for equality."
  "mr-1727":
    native: "compassion, mercy"
    notes:
      "n1": "{1} is compassion, a feeling of care for someone who suffers."
    examples:
      "त्याच्या मनात दया आहे.": { native: "He has compassion in his heart.", bases: { "आहे": "to be" } }
      "दया दाखवा.": "Show compassion."
  "mr-1728":
    native: "pity, tenderness"
    notes:
      "n1": "{1} is pity or tenderness for someone who is suffering."
    examples:
      "तिच्या डोळ्यांत करुणा होती.": { native: "There was compassion in her eyes.", bases: { "होती": "to be" } }
      "करुणेने मदत केली.": "He helped with compassion."
  "mr-1729":
    native: "patience, tolerance"
    notes:
      "n1": "{1} is patience, the ability to bear difficulties."
    examples:
      "सहनशीलता ठेवा.": "Keep your patience."
      "त्याची सहनशीलता कौतुकास्पद आहे.": { native: "His patience is praiseworthy.", bases: { "कौतुकास्पद": "praiseworthy", "आहे": "to be" } }
  "mr-1730":
    native: "courage, patience"
    notes:
      "n1": "{1} is courage or patience in difficult times."
    examples:
      "धैर्य सोडू नका.": "Do not lose courage."
      "त्याच्यात खूप धैर्य आहे.": { native: "He has a lot of courage.", bases: { "आहे": "to be" } }
  "mr-1731":
    native: "self-restraint, self-control"
    notes:
      "n1": "{1} is self-restraint, controlling oneself."
    examples:
      "संयम ठेवणं गरजेचं आहे.": { native: "It is necessary to keep self-control.", bases: { "आहे": "to be" } }
      "रागावर संयम ठेवा.": "Keep control over your anger."
  "mr-1732":
    native: "humility, politeness"
    notes:
      "n1": "{1} is humility, being modest and polite."
    examples:
      "त्याच्या बोलण्यात नम्रता आहे.": { native: "There is humility in his talk.", bases: { "आहे": "to be" } }
      "नम्रतेने वागा.": { native: "Behave with humility.", bases: { "वागा": "to behave" } }
  "mr-1733":
    native: "ego, arrogance"
    notes:
      "n1": "{1} is ego or arrogance, too much pride in oneself."
    examples:
      "अहंकार वाईट आहे.": { native: "Arrogance is bad.", bases: { "आहे": "to be" } }
      "त्याचा अहंकार कमी झाला.": { native: "His arrogance reduced.", bases: { "कमी": "less", "झाला": "to become" } }
  "mr-1734":
    native: "gratitude"
    notes:
      "n1": "{1} is gratitude, thankfulness for help received."
    examples:
      "मी तुझी कृतज्ञ आहे.": { native: "I am grateful to you.", bases: { "आहे": "to be" } }
      "कृतज्ञता व्यक्त करतो.": { native: "I express my gratitude.", bases: { "व्यक्त": "express" } }
  "mr-1735":
    native: "goal, aim"
    notes:
      "n1": "{1} is a goal or an aim that one works towards."
    examples:
      "आपलं ध्येय स्पष्ट असायला हवं.": { native: "Our goal should be clear.", bases: { "आपलं": "our", "स्पष्ट": "clear", "असायला": "to be" } }
      "ध्येय गाठायला मेहनत करा.": { native: "Work hard to reach the goal.", bases: { "गाठायला": "to reach", "मेहनत": "hard work" } }
  "mr-1736":
    native: "purpose, intention"
    notes:
      "n1": "{1} is a purpose or intention behind an action."
    examples:
      "त्याचा उद्देश चांगला होता.": { native: "His intention was good.", bases: { "होता": "to be" } }
      "या कामाचा उद्देश काय आहे?": { native: "What is the purpose of this work?", bases: { "आहे": "to be" } }
  "mr-1737":
    native: "meaning"
    notes:
      "n1": "{1} is the meaning of a word or an action."
    examples:
      "या शब्दाचा अर्थ काय?": { native: "What is the meaning of this word?", bases: { "शब्दाचा": "of the word", "आहे": "to be" } }
      "त्याच्या बोलण्याला अर्थ आहे.": { native: "What he said has meaning.", bases: { "आहे": "to be" } }
  "mr-1738":
    native: "awareness, consciousness"
    notes:
      "n1": "{1} is awareness of something, knowing it."
    examples:
      "मला त्याची जाणीव झाली.": { native: "I became aware of it.", bases: { "झाली": "to become" } }
      "सामाजिक जाणीव वाढवा.": { native: "Increase social awareness.", bases: { "सामाजिक": "social" } }
  "mr-1739":
    native: "progress"
    notes:
      "n1": "{1} is progress, moving forward and improving."
    examples:
      "गावाची प्रगती होत आहे.": { native: "The village is progressing.", bases: { "होत": "to become", "आहे": "to be" } }
      "कामात चांगली प्रगती केली.": "I made good progress in the work."
  "mr-1740":
    native: "development, growth"
    notes:
      "n1": "{1} is development, growth of a place or a person."
    examples:
      "शहराचा विकास झाला.": { native: "The city developed.", bases: { "शहराचा": "of the city", "झाला": "to become" } }
      "मुलांचा मानसिक विकास महत्त्वाचा आहे.": { native: "The mental development of children is important.", bases: { "मानसिक": "mental", "महत्त्वाचा": "important", "आहे": "to be" } }
  "mr-1741":
    native: "change"
    notes:
      "n1": "{1} is a change, something that becomes different."
    examples:
      "मोठा बदल झाला.": { native: "A big change happened.", bases: { "झाला": "to become" } }
      "बदल स्वीकारा.": { native: "Accept the change.", bases: { "स्वीकारा": "to accept" } }
  "mr-1742":
    native: "continuity, consistency"
    notes:
      "n1": "{1} is continuity, doing something regularly over a long time."
    examples:
      "सातत्य ठेवलं तर यश मिळतं.": { native: "If you keep consistency, you get success.", bases: { "यश": "success", "मिळतं": "to get" } }
      "अभ्यासात सातत्य हवं.": "Studies need consistency."
  "mr-1743":
    native: "discernment, good sense"
    notes:
      "n1": "{1} is discernment, the ability to judge what is right."
    examples:
      "विवेकाने निर्णय घ्या.": { native: "Decide with good sense.", bases: { "निर्णय": "decision" } }
      "त्याच्याकडे चांगला विवेक आहे.": { native: "He has good judgement.", bases: { "आहे": "to be" } }
  "mr-1744":
    native: "humanity, humaneness"
    notes:
      "n1": "{1} is humanity, kindness towards people."
    examples:
      "मानवता सगळ्यात मोठा धर्म आहे.": { native: "Humanity is the greatest religion.", bases: { "सगळ्यात": "of all", "धर्म": "religion", "आहे": "to be" } }
      "मानवतेच्या दृष्टीने विचार करा.": { native: "Think from the view of humanity.", bases: { "दृष्टीने": "from the view" } }
  "mr-1745":
    native: "life"
    notes:
      "n1": "{1} is life, the time one lives."
    examples:
      "जीवन सुंदर आहे.": { native: "Life is beautiful.", bases: { "आहे": "to be" } }
      "जीवनात चढ-उतार असतात.": { native: "There are ups and downs in life.", bases: { "असतात": "to be" } }
  "mr-1746":
    native: "faith, belief"
    notes:
      "n1": "{1} is faith or belief in something sacred."
    examples:
      "त्याची देवावर श्रद्धा आहे.": { native: "He has faith in God.", bases: { "आहे": "to be" } }
      "श्रद्धा आणि विश्वास महत्त्वाचे आहेत.": { native: "Faith and trust are important.", bases: { "महत्त्वाचे": "important", "आहेत": "to be" } }
