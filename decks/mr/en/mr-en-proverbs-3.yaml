native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs 3"
description: "Twenty Marathi proverbs from the Marathi Wikiquote proverbs page, each with a plain English rendering and its meaning. Not yet checked by a Marathi speaker: please report any mistake."
