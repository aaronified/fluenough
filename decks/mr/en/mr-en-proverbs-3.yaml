# Layer for mr-proverbs-3: each proverb's literal English rendering and what it is said of.
schema: 1
id: "mr-en-proverbs-3"
kind: "layer"
core: "mr-proverbs-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs 3"
description: "Twenty Marathi proverbs from the Marathi Wikiquote proverbs page, each with a literal English rendering and a note on what it is said of. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-4300":
    native: "Does a cow in trouble eat?"
    notes:
      "literal": "Said of someone already in trouble, who has no interest in everyday things such as food."
  "mr-4301":
    native: "Oh, the form, and oh, the sound!"
    notes:
      "literal": "Said in praise of a person or an animal whose every quality is worth admiring."
  "mr-4302":
    native: "To turn yellow with half a turmeric root."
    notes:
      "literal": "Said of someone who shows off a little cleverness as if it were great, making a big show of a small skill."
  "mr-4303":
    native: "When it comes from God's mind, no one's will can prevail."
    notes:
      "literal": "Said of a bad event that no one can control, and that only time heals."
  "mr-4304":
    native: "The grains in the boiling water weep, and the grains in the sieve laugh."
    notes:
      "literal": "Said of people who laugh at another's misfortune, forgetting that they too must go into the pot."
  "mr-4305":
    native: "The grandfather died, and then a grandson was born."
    notes:
      "literal": "Said of a grandson born after his grandfather has died, which brings no joy."
  "mr-4306":
    native: "Do it first, then tell."
    notes:
      "literal": "Said of people who promise a great deal: show what you can do first, and only then talk about it."
  "mr-4307":
    native: "We fear our own shadow."
    notes:
      "literal": "Said of a guilty person who suspects everything and is frightened even by his own shadow."
  "mr-4308":
    native: "If we are happy, the world is happy."
    notes:
      "literal": "Said that happiness depends on one's own state of mind: if we are happy, the world looks happy to us."
  "mr-4309":
    native: "We cannot see our own back."
    notes:
      "literal": "Said that we do not notice our own faults, nor hear what is said about us behind our backs."
  "mr-4310":
    native: "Health is the real riches."
    notes:
      "literal": "Said that health is the greatest wealth, since keeping the body strong by exercise and good food matters more than any other saving."
  "mr-4311":
    native: "If it flies it is a crow, and if it sinks it is a frog."
    notes:
      "literal": "Said of someone who changes shape to suit the moment. The source gives no explanation for this saying; the meaning here is the builder's own and is unchecked."
  "mr-4312":
    native: "A kingdom of half an hour."
    notes:
      "literal": "Said of power or glory that lasts only a short while. The source gives no explanation for this saying; the meaning here is the builder's own and is unchecked."
  "mr-4313":
    native: "For one who has done nothing, why fear?"
    notes:
      "literal": "Said that a person who has done nothing wrong has no reason to fear anything."
  "mr-4314":
    native: "Whatever you do, you will be repaid in kind."
    notes:
      "literal": "Said that as you sow, so you reap: good deeds bring good results and bad deeds bring bad ones."
  "mr-4315":
    native: "A fox is content with a cucumber."
    notes:
      "literal": "Said of someone who is easily satisfied, even by a very small thing."
  "mr-4316":
    native: "A throat that sings, a field that is watered."
    notes:
      "literal": "Said that steady practice perfects a singer's voice, and regular water keeps a garden in bloom: skill and growth come with regular practice and care."
  "mr-4317":
    native: "What the village does, the king does not."
    notes:
      "literal": "Said that what a village does together, even a ruler cannot do alone."
  "mr-4318":
    native: "A vow once taken should not be dropped."
    notes:
      "literal": "Said that a task once taken up should be finished, not left half done."
  "mr-4319":
    native: "The one who climbs will fall."
    notes:
      "literal": "Said of a proud person: whoever climbs high will one day fall, since pride leads to a fall in the end."
