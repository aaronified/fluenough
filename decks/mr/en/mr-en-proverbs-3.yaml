tags: ["unreviewed"]
cards:
  "mr-4300":
    native: "A cow in labour does not eat, so someone already in trouble has no interest in everyday things."
    notes:
      "literal": "Does a cow in trouble eat? Said of a person already in trouble, who has no interest in everyday things such as food."
  "mr-4301":
    native: "Everything about a person or an animal is worth admiring."
    notes:
      "literal": "Oh, the form! Oh, the sound! Said in praise of someone whose every quality is admirable."
  "mr-4302":
    native: "To show off a little cleverness as if it were great."
    notes:
      "literal": "To turn yellow with half a turmeric root. Said of someone who is proud of a small skill and makes a big show of it."
  "mr-4303":
    native: "No one can control a bad event, and only time heals it."
    notes:
      "literal": "When it comes from God's mind, no one's will can prevail. Said when something bad has happened that no one could prevent, and time is the only remedy."
  "mr-4304":
    native: "The grains in the boiling water weep and the grains in the sieve laugh, forgetting that they too must go into the pot."
    notes:
      "literal": "The grains in the boiling water weep; the grains in the sieve laugh. Said of people who laugh at another's misfortune without noticing that the same fate waits for them."
  "mr-4305":
    native: "A grandson born after his grandfather has died brings no joy."
    notes:
      "literal": "The grandfather died, and then a grandson was born. Said of an event that comes too late to bring the joy it should."
  "mr-4306":
    native: "Show what you can do first, and only then talk about it."
    notes:
      "literal": "Do it first, then tell. Said of people who promise a great deal; what counts is the work that is done."
  "mr-4307":
    native: "We are afraid of our own shadow, as a guilty person is afraid of everything."
    notes:
      "literal": "We fear our own shadow. Said of a guilty person who suspects everything and is frightened even by his own shadow."
  "mr-4308":
    native: "If we are happy, the world looks happy to us."
    notes:
      "literal": "If we are happy, the world is happy. Said that happiness depends on one's own state of mind."
  "mr-4309":
    native: "We cannot see our own back, so we miss our faults and what people say about us."
    notes:
      "literal": "We cannot see our own back. Said that we do not notice our own faults, nor hear what is said about us behind our backs."
  "mr-4310":
    native: "Health is the greatest wealth."
    notes:
      "literal": "Health is the real riches. Said that keeping the body strong by exercise and good food matters more than any other saving."
  "mr-4311":
    native: "A crow when it flies and a frog when it sinks, so one changes shape to suit the moment."
    notes:
      "literal": "If it flies it is a crow; if it sinks it is a frog. The source gives no explanation for this saying; the meaning here is the builder's own and is unchecked."
  "mr-4312":
    native: "Power or glory that lasts only a short while."
    notes:
      "literal": "A kingdom of half an hour. The source gives no explanation for this saying; the meaning here is the builder's own and is unchecked."
  "mr-4313":
    native: "Why fear anything when you have done nothing wrong?"
    notes:
      "literal": "For one who has done nothing, why fear? Said that a person with a clear conscience has no reason to be afraid."
  "mr-4314":
    native: "As you sow, so you reap."
    notes:
      "literal": "Whatever you do, you will be repaid in kind. Said that good deeds bring good results and bad deeds bring bad ones."
  "mr-4315":
    native: "The fox is satisfied with a cucumber."
    notes:
      "literal": "A fox is content with a cucumber. Said of someone who is easily pleased, even by a very small thing."
  "mr-4316":
    native: "Steady practice perfects a singer's voice, and regular water keeps a garden in bloom."
    notes:
      "literal": "A throat that sings, a field that is watered. Said that skill and growth come with regular practice and care."
  "mr-4317":
    native: "What a village does together, even a ruler cannot do alone."
    notes:
      "literal": "What the village does, the king does not. Said that people working together can achieve what no single person, however capable, can."
  "mr-4318":
    native: "Do not abandon a task once you have taken it up."
    notes:
      "literal": "A vow once taken should not be dropped. Said that a task once undertaken should be finished, not left half done."
  "mr-4319":
    native: "Whoever climbs high will one day fall."
    notes:
      "literal": "The one who climbs will fall. Said of a proud person; pride leads to a fall in the end."
