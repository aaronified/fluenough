schema: 1
id: "mr-en-sound-differences"
kind: "layer"
core: "mr-sound-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sounds to tell apart"
license: "CC-BY-SA-4.0"
description: "Pairs of everyday words that differ in one sound: a or aa, a breath after a consonant, the tongue on the teeth or curled back, the two l's, and a single or double consonant. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0055":
    notes:
      "n1": "a against aa: दार (dār, door) has the long a where दर (dar, rate) has the short a, said like the u of 'but'."
  "mr-0111":
    native: "door"
    notes:
      "n1": "a against aa: दार (dār, door, with the long a) against दर (dar, rate, with the short a). And a breath: धार (dhār, edge) is दार (dār) with a breath after the d."
    "examples": {
      "दार ढकल.": {"native": "Push the door.", "bases": {"ढकल": "to push", "दार": "door"}},
      "त्याने दार उघडले.": {"native": "He opened the door.", "bases": {"उघडले": "to open"}}
    }
  "mr-0049":
    notes:
      "n1": "a against aa: जाग (jāg, waking) has the long a where जग (jag, world) has the short a."
  "mr-0112":
    native: "waking; wakefulness"
    notes:
      "n1": "a against aa: जाग (jāg, with the long a) against जग (jag, world, with the short a). मला जाग आली (malā jāg āli), I woke up."
  "mr-0113":
    native: "sharp edge; a stream (of water)"
    notes:
      "n1": "A breath after the consonant: धार (dhār, edge) is दार (dār, door) with a breath after the d."
  "mr-0114":
    native: "garden"
    notes:
      "n1": "A breath after the consonant: भाग (bhāg, part) is बाग (bāg, garden) with a breath after the b."
    "examples": {
      "बाग छान फुलली.": {"native": "The garden bloomed nicely.", "bases": {"फुलली": "to bloom"}},
      "संध्याकाळी बागेत फिरतो.": {"native": "In the evening I walk about in the garden.", "bases": {"फिरतो": "to walk about, to roam", "बागेत": "garden"}}
    }
  "mr-0115":
    native: "part; share"
    notes:
      "n1": "A breath after the consonant: भाग (bhāg, part) is बाग (bāg, garden) with a breath after the b."
    "examples": {
      "पशुपालन हा शेतीचा भाग आहे.": {"native": "Animal husbandry is part of farming.", "bases": {"आहे": "to be", "भाग": "part; share"}}
    }
  "mr-0116":
    native: "run! (to a friend)"
    notes:
      "n1": "A breath after the consonant: फळ (phaḷ, fruit) is पळ (paḷ, run!) with a breath after the p."
  "mr-0056":
    notes:
      "n1": "A breath after the consonant: फळ (phaḷ, fruit) is पळ (paḷ, run!) with a breath after the p."
  "mr-0117":
    native: "wick (of a lamp)"
    notes:
      "n1": "Dental against curled back: वात (vāt, wick) has the tongue on the teeth for t; वाट (vāṭ, way) has it curled back."
  "mr-0118":
    native: "way; path; waiting"
    notes:
      "n1": "Dental against curled back: वाट (vāṭ, way) has the tongue curled back for t; वात (vāt, wick) has it on the teeth. वाट पाहणे (vāṭ pāhṇe), to wait."
  "mr-0119":
    native: "yesterday"
    notes:
      "n1": "The two l's: काल (kāl, yesterday) has the l on the teeth; काळ (kāḷ, time, an age) has it curled back. Unlike Hindi कल (kal), काल (kāl) is never 'tomorrow'."
    "examples": {
      "काल काय घडलं?": {"native": "What happened yesterday?", "bases": {"घडलं": "to happen"}},
      "काल रात्री भूकंप झाला.": {"native": "There was an earthquake last night.", "bases": {"झाला": "to become"}}
    }
  "mr-0120":
    native: "time; an age; an era"
    notes:
      "n1": "The two l's: काळ (kāḷ, time) has the l curled back; काल (kāl, yesterday) has it on the teeth."
    "examples": {
      "आधुनिक काळात सगळं वेगवान आहे.": {"native": "In modern times everything is fast.", "bases": {"सगळं": "everything", "वेगवान": "fast", "आहे": "to be", "काळात": "time; an age; an era"}},
      "प्राचीन काळी लोक शेती करत.": {"native": "In ancient times people farmed.", "bases": {"काळी": "time; an age; an era"}}
    }
  "mr-0121":
    native: "vine; creeper"
    notes:
      "n1": "The two l's: वेल (vel, vine) has the l on the teeth; वेळ (veḷ, time) has it curled back."
  "mr-0122":
    native: "time; an occasion"
    notes:
      "n1": "The two l's: वेळ (veḷ, time) has the l curled back; वेल (vel, vine) has it on the teeth. वेळ नाही (veḷ nāhi), there's no time."
    "examples": {
      "थोडा वेळ थांबा.": {"native": "Wait a little while.", "bases": {"थोडा": "a little", "थांबा": "to wait"}},
      "रेल्वे वेळेवर येते.": {"native": "The train comes on time.", "bases": {"वेळेवर": "on time", "येते": "to come"}}
    }
  "mr-0123":
    native: "learn! (polite)"
    notes:
      "n1": "Single against double: शिक्का (śikkā, stamp) holds the k longer than शिका (śikā, learn!)."
    "examples": {
      "पैसे बचत करायला शिका.": {"native": "Learn to save money.", "bases": {}},
      "पराभवातून शिका.": {"native": "Learn from defeat.", "bases": {"पराभवातून": "defeat"}}
    }
  "mr-0124":
    native: "stamp; seal"
    notes:
      "n1": "Single against double: शिक्का (śikkā, stamp) holds the k longer than शिका (śikā, learn!)."
