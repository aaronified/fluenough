schema: 1
id: "mr-en-numbers-1-20-sentences"
kind: "layer"
core: "mr-numbers-1-20-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences with the numbers one to twenty"
license: "CC-BY-SA-4.0"
description: "Short sentences that use the numbers of this unit. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-6199":
    native: "I have two children."
    bases: { "माझ्याकडे": "at my place", "दोन": "two", "मुले": "children", "आहेत": "are" }
    confusables: { "w1": { why: "Three: तीन (tin) is three, not two." }, "f1": { why: "Singular: आहे (āhe) is for one thing; two children take आहेत (āhet)." } }
  "mr-6200":
    native: "Give one tea."
    bases: { "एक": "one", "द्या": "give (polite)" }
    confusables: { "w1": { why: "Four: चार (cār) is four." }, "f1": { why: "Take: घ्या (ghyā) means take, not give; to ask for tea use द्या (dyā)." } }
    notes: { "n1": "एक (ek), one, before a noun also serves as 'a' when the one matters: एक चहा (ek cahā), one tea." }
  "mr-6201":
    native: "Give me three rotis."
    bases: { "मला": "to me", "तीन": "three", "पोळ्या": "rotis", "द्या": "give (polite)" }
    confusables: { "w1": { why: "Ten: दहा (dahā) is ten." }, "f1": { why: "Singular: पोळी (poḷi) is one roti; three takes the plural पोळ्या (poḷyā)." } }
  "mr-6202":
    native: "We have six rooms."
    bases: { "आमच्याकडे": "at our place", "सहा": "six", "खोल्या": "rooms", "आहेत": "are" }
    confusables: { "w1": { why: "Eight: आठ (āṭh) is eight." }, "f1": { why: "Singular: खोली (kholi) is one room; six rooms take खोल्या (kholyā)." } }
    notes: { "n1": "आमच्याकडे (āmacyākaḍe), at our place, is how Marathi says we have: -कडे (-kaḍe), 'with, at', follows the pronoun." }
  "mr-6203":
    native: "It is seven o'clock now."
    bases: { "आता": "now", "सात": "seven", "वाजले": "has struck" }
    confusables: { "w1": { why: "Eight: आठ (āṭh) is eight." }, "w2": { why: "Five: पाच (pāc) is five." } }
    notes: { "n1": "सात वाजले (sāt vājle), seven has struck: this is how Marathi says it is seven o'clock." }
  "mr-6204":
    native: "There are nine people in the house."
    bases: { "घरात": "in the house", "नऊ": "nine", "माणसे": "people", "आहेत": "are" }
    confusables: { "w1": { why: "Seven: सात (sāt) is seven." }, "f1": { why: "Singular: माणूस (māṇus) is one person; nine people take माणसे (māṇse)." } }
  "mr-6205":
    native: "He gives ten rupees."
    bases: { "दहा": "ten", "रुपये": "rupees", "देतो": "gives" }
    confusables: { "w1": { why: "Eleven: अकरा (akrā) is eleven." }, "f1": { why: "Feminine: देते (dete) is for a feminine subject, and तो (to) is masculine." } }
  "mr-6206":
    native: "My son is eleven years old."
    bases: { "माझा": "my", "अकरा": "eleven", "वर्षांचा": "of years", "आहे": "is" }
    confusables: { "w1": { why: "Twelve: बारा (bārā) is twelve." }, "f1": { why: "Plural: आहेत (āhet) is for more than one; मुलगा (mulgā) is one boy, so आहे (āhe) is used." } }
    notes: { "n1": "वर्षांचा (varṣāñcā), of years, agrees with मुलगा (mulgā), a masculine noun, so it ends -चा (-cā)." }
  "mr-6207":
    native: "There are fourteen people in the bus."
    bases: { "बसमध्ये": "in the bus", "चौदा": "fourteen", "आहेत": "are" }
    confusables: { "w1": { why: "Thirteen: तेरा (terā) is thirteen." }, "f1": { why: "Singular: आहे (āhe) is for one thing; many people take आहेत (āhet)." } }
  "mr-6208":
    native: "We come home after fifteen days."
    bases: { "पंधरा": "fifteen", "दिवसांनी": "after days", "घरी": "home", "येतो": "come" }
    confusables: { "w1": { why: "Sixteen: सोळा (soḷā) is sixteen." }, "f1": { why: "Feminine: येते (yete) is for a feminine subject, not for a group of us." } }
  "mr-6209":
    native: "Nineteen children play in the field."
    bases: { "मैदानात": "in the field", "एकोणीस": "nineteen", "मुले": "children", "खेळतात": "play" }
    confusables: { "w1": { why: "Twenty: वीस (vis) is twenty." }, "f1": { why: "Singular: खेळतो (kheḷto) is for one boy; many children take खेळतात (kheḷatāt)." } }
    notes: { "n1": "मैदानात (maidānāt), in the field: मैदान (maidān) adds -ा- (-ā-) before -त (-t), 'in'." }
  "mr-6210":
    native: "Give twenty rupees."
    bases: { "वीस": "twenty", "रुपये": "rupees", "द्या": "give (polite)" }
    confusables: { "w1": { why: "Eighteen: अठरा (aṭhrā) is eighteen." }, "f1": { why: "Take: घ्या (ghyā) means take, not give." } }
