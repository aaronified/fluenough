schema: 1
id: "mr-en-grammar-likes"
kind: "layer"
core: "mr-grammar-likes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Likes"
license: "CC0-1.0"
description: "आवडणे (āvaḍṇe): what you like, and what you liked. The one who likes takes -ला (-lā), and the verb agrees with what is liked. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0585":
    native: "to like; to be pleasing"
    notes:
      "n1": "Turned round from English: what is liked is the subject, and the one who likes takes -ला (-lā). मला आवडते (malā āvḍte), I like it, 'to me it is pleasing'."
  "mr-0586":
    native: "I like tea."
    notes:
      "n1": "चहा (cahā) is masculine, so आवडतो (āvḍto), whoever is speaking."
  "mr-0587":
    native: "I like coffee."
    notes:
      "n1": "कॉफी (kôfi) is feminine, so आवडते (āvḍte)."
  "mr-0588":
    native: "I like mangoes."
    notes:
      "n1": "आंबे (āmbe) is plural, so आवडतात (āvḍtāt)."
  "mr-0589":
    native: "I liked this film."
    notes:
      "n1": "In the past it agrees too: चित्रपट (citrapaṭ, film) is masculine, so आवडला (āvḍlā). Also सिनेमा (sinemā)."
  "mr-0590":
    native: "I don't like it."
  "mr-0591":
    native: "What do you like?"
  "mr-0592":
    native: "favourite"
    notes:
      "n1": "Agrees with its noun: माझा आवडता रंग (mājhā āvaḍtā raṅg), my favourite colour; माझी आवडती भाजी (mājhi āvḍti bhāji), my favourite vegetable."
  "mr-0593":
    native: "I like reading."
    notes:
      "n1": "An action you like takes -आयला (-āylā): वाचायला (vācāylā), to read; फिरायला (phirāylā), to go out and about."
