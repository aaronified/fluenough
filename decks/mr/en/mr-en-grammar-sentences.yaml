id: "mr-en-grammar-sentences"
kind: "layer"
core: "mr-grammar-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Basic sentences"
license: "CC0-1.0"
description: "Word order, आहे (āhe) at the end, and how Marathi says have and like. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0158":
    native: "I am a student."
    notes:
      "n1": "'I student am'. A woman student is a विद्यार्थिनी (vidyārthini)."
  "mr-0159":
    native: "This is my house."
    notes:
      "n1": "माझे (mājhe), 'my', agrees with घर (ghar), which is neuter."
  "mr-0160":
    native: "I drink tea. (a man speaking)"
    notes:
      "n1": "Subject, object, verb: the verb comes last. A woman says पिते (pite)."
  "mr-0161":
    native: "She is learning Marathi."
  "mr-0162":
    native: "I like Marathi."
    notes:
      "n1": "'To me, Marathi is pleasing': the one who likes takes -ला (-lā), and the verb agrees with मराठी (marāṭhi), which is feminine."
  "mr-0163":
    native: "I have a car."
    notes:
      "n1": "'With me there is a car'. For family and body parts, -ला (-lā): मला दोन भाऊ आहेत (malā don bhāu āhet), I have two brothers."
  "mr-0164":
    native: "I don't have any money."
    notes:
      "n1": "नाहीत (nāhit), 'there aren't', agrees with the plural पैसे (paise)."
  "mr-0165":
    native: "This isn't good."
  "mr-0166":
    native: "Please don't go."
    notes:
      "n1": "The verb in -ऊ (-u) with नका (nakā) makes a polite 'don't'. To a friend: जाऊ नकोस (jāu nakos)."
  "mr-0167":
    native: "It's very hot and sticky today."
    notes:
      "n1": "उकाडा (ukāḍā) is the sticky heat before the monsoon. A dry, sunny heat is ऊन (un): आज खूप ऊन आहे (āj khup un āhe)."
