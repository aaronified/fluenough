cards:
  "mr-6824":
    native: "The sky is cloudy today."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "हवा (havā) means air, or the weather of the day, not the sky." }, "f1": { why: "आहेत (āhet) is plural; आकाश (ākāś) is one sky, so it takes आहे (āhe)." }, "w2": { why: "पाऊस (pāus) is rain, not the sky." } }
  "mr-6825":
    native: "It rains."
    confusables: { "w1": { why: "सरी (sari) is a short shower, not rain in general." }, "f1": { why: "पडला (paḍlā) is past tense, for one masculine thing that fell." } }
  "mr-6826":
    native: "The wind blows."
    confusables: { "w1": { why: "झुळूक (jhuḷuk) is a light breeze, not the wind." }, "f1": { why: "वाहते (vāhte) is feminine; हवा (havā) (air) is feminine." }, "w2": { why: "पाऊस (pāus) is rain, not wind." } }
  "mr-6827":
    native: "The sun shines."
    confusables: { "w1": { why: "ऊन (un) is sunshine, the warmth itself." }, "f1": { why: "चमकतात (camktāt) is plural: तारे (tāre) (stars) shine." }, "w2": { why: "आकाश (ākāś) is the sky, not the sun." } }
  "mr-6828":
    native: "The rain is getting heavier."
    bases: { "आहे": "is (here, the -ing form)" }
    confusables: { "w1": { why: "पडणे (paḍṇe) means to fall, not to increase." }, "f1": { why: "वाढला (vāḍhlā) is past tense: rose." }, "w2": { why: "पूर (pur) is a flood, a result of too much rain." } }
  "mr-6829":
    native: "It is cold in the early morning."
    bases: { "पहाटे": "early morning (in the early morning)", "असते": "is (usually)" }
    confusables: { "w1": { why: "उकाडा (ukāḍā) is muggy heat, not cold." }, "f1": { why: "असतात (astāt) is plural; थंडी (thaṇḍi) (cold) is one thing." }, "w2": { why: "तापमान (tāpmān) is temperature, a number." } }
  "mr-6830":
    native: "There is fog in the morning."
    bases: { "असतं": "is (there is)" }
    confusables: { "w1": { why: "आकाश (ākāś) is the sky, not fog." }, "f1": { why: "असतो (asto) is for a masculine subject." }, "w2": { why: "पाऊस (pāus) is rain, not fog." } }
  "mr-6831":
    native: "The air is humid today."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "ढगाळ (ḍhagāḷ) means cloudy, not humid." }, "f1": { why: "आहेत (āhet) is plural; हवा (havā) is one air, so it takes आहे (āhe)." }, "w2": { why: "थंडी (thaṇḍi) means cold, not humid." } }
  "mr-6832":
    native: "Sit in the shade."
    bases: { "बसा": "sit (polite order)" }
    confusables: { "w1": { why: "ऊन (un) is sunshine, not shade." }, "f1": { why: "बसते (baste) is a statement: she sits; बसा (basā) is an order." }, "w2": { why: "झुळूक (jhuḷuk) is a breeze, not shade." } }
  "mr-6833":
    native: "Do not sit in the sun."
    bases: { "बसू": "sit (do not sit)" }
    confusables: { "w1": { why: "सावली (sāvli) is shade, the opposite of sun." }, "f1": { why: "बसा (basā) is the positive order: sit." }, "w2": { why: "वारा (vārā) is the wind, not the sun." } }
  "mr-6834":
    native: "A shower is coming."
    bases: { "आहे": "is (is going to)" }
    confusables: { "w1": { why: "गारपीट (gārpiṭ) is hail, not rain." }, "f1": { why: "आहेत (āhet) is plural; सरी (sari) is one shower." }, "w2": { why: "चमकणे (camkṇe) means to shine, not to come." } }
  "mr-6835":
    native: "There is little rain this year."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "दुष्काळ (duṣkāḷ) is a drought, a long time with too little rain." }, "f1": { why: "जास्त (jāst) means more, the opposite of कमी (kami)." }, "w2": { why: "मान्सून (mānsun) is the monsoon season, not the amount of rain." } }
