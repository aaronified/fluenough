schema: 1
id: "mr-en-slang"
kind: "layer"
core: "mr-slang"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Slang"
license: "CC0-1.0"
description: "Everyday slang, much of it from Mumbai and Pune: what friends say that a textbook doesn't. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0626":
    native: "great; awesome"
    notes:
      "n1": "Literally 'heavy': भारी पिक्चर (bhāri pikcar), a great film. लय भारी (lay bhāri)!, brilliant!"
  "mr-0627":
    native: "very; a lot (slang)"
    notes:
      "n1": "Country speech for खूप (khup), now everyone's slang: लय भारी (lay bhāri), लय दमलो (lay damlo), I'm dead tired."
  "mr-0628":
    native: "fantastic; superb"
    notes:
      "n1": "Mumbai slang, known all over India from films."
  "mr-0629":
    native: "a big fight; a mess"
    notes:
      "n1": "तिथे राडा झाला (tithe rāḍā jhālā), there was a huge row there."
  "mr-0630":
    native: "lad; boy (casual)"
    notes:
      "n1": "Casual for मुलगा (mulgā). A girl is a पोरगी (porgi), and kids are पोरं (poram̐)."
  "mr-0631":
    native: "mate; man"
    notes:
      "n1": "From Persian, shared with Hindi: काय यार (kāy yār)!, oh, come on, man!"
  "mr-0632":
    native: "bro"
    notes:
      "n1": "भाऊ (bhāu), brother, called out: भावा (bhāvā), कुठे आहेस? (bhava, kuthe ahes?), bro, where are you?"
  "mr-0633":
    native: "What's up? (to a guy)"
    notes:
      "n1": "रे (re) softens a question to a man or a boy you know well; to a woman, गं (gam̐): काय गं? (kay ga?)."
  "mr-0634":
    native: "Right, I'm off. (a man speaking)"
    notes:
      "n1": "निघणे (nighṇe), to set off. A woman says निघते (nighte)."
  "mr-0635":
    native: "amazing (literally 'dangerous')"
    notes:
      "n1": "Praise, said with a grin: खतरनाक बॅटिंग (khatarnāk bêṭiṅg), amazing batting."
  "mr-0636":
    native: "killing time; a pastime"
    notes:
      "n1": "From English 'time pass': नुसता टाईमपास (nustā ṭāimpās), just killing time."
  "mr-0637":
    native: "carefree; go ahead, don't worry"
    notes:
      "n1": "'Without fear': बिनधास्त जा (bindhāst jā), go ahead, no worries. Hindi speakers have borrowed it."
  "mr-0638":
    native: "We're done for; it's ruined."
    notes:
      "n1": "माझी वाट लागली (mājhi vāṭ lāgli), I'm finished. वाट (vāṭ) is 'way'."
