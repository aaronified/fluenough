schema: 1
id: "mr-en-daily-life"
kind: "layer"
core: "mr-daily-life"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "A day"
license: "CC0-1.0"
description: "The day from waking to sleeping, and how often things happen. Verbs are given in their -णे (-ṇe) form, the one a dictionary lists. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0494":
    native: "to get up; to wake up"
    notes:
      "n1": "सकाळी लवकर उठणे (sakāḷi lavkar uṭhṇe), to get up early in the morning."
  "mr-0495":
    native: "to bathe; to have a shower"
    notes:
      "n1": "अंघोळ (aṅghoḷ) is a bath, and करणे (karṇe) 'to do'."
  "mr-0496":
    native: "to brush one's teeth"
    notes:
      "n1": "'To rub the teeth'."
  "mr-0497":
    native: "breakfast; a snack"
    notes:
      "n1": "Often पोहे (pohe), flattened rice, or उपमा (upmā). नाश्ता केला का? (nashta kela ka?), have you had breakfast?"
  "mr-0498":
    native: "meal; lunch; dinner"
    notes:
      "n1": "दुपारचे जेवण (dupārce jevaṇ), lunch; रात्रीचे जेवण (rātrice jevaṇ), dinner."
  "mr-0499":
    native: "to eat (a meal)"
    notes:
      "n1": "For a meal, not a snack: मी जेवलो (mi jevlo), I've eaten. खाणे (khāṇe) is to eat anything."
  "mr-0500":
    native: "to sleep; to go to bed"
    notes:
      "n1": "झोप (jhop) is sleep."
  "mr-0501":
    native: "to go to work"
    notes:
      "n1": "'To go onto work'."
  "mr-0502":
    native: "to come back home"
    notes:
      "n1": "परत (parat) is 'back, again'."
  "mr-0503":
    native: "to cook"
  "mr-0504":
    native: "to wash clothes"
    notes:
      "n1": "कपडे (kapḍe), clothes, is plural."
  "mr-0505":
    native: "every day"
    notes:
      "n1": "मी रोज चालतो (mi roj cālto), I walk every day."
  "mr-0506":
    native: "always"
  "mr-0507":
    native: "sometimes"
    notes:
      "n1": "'When-when'. Also कधी कधी (kadhi kadhi), written apart."
  "mr-0508":
    native: "never"
    notes:
      "n1": "With a verb, नाही (nāhi) goes after it: मी कधीच दारू पीत नाही (mi kadhic dāru pit nāhi), I never drink alcohol."
  "mr-0509":
    native: "early; soon; quickly"
    notes:
      "n1": "लवकर या (lavkar yā), come soon."
  "mr-0510":
    native: "late"
    notes:
      "n1": "उशीर (uśir) is lateness: मला उशीर झाला (malā uśir jhālā), I'm late."
  "mr-0511":
    native: "I get up at seven. (a man speaking)"
    notes:
      "n1": "A woman says उठते (uṭhte)."
  "mr-0512":
    native: "to walk"
    notes:
      "n1": "Also 'to work, to run' of a machine, and 'it's fine': चालेल (cālel), that'll do."
  "mr-0513":
    native: "to read"
    notes:
      "n1": "पेपर वाचणे (pepar vācṇe), to read the newspaper."
