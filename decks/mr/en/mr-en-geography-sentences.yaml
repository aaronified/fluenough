tags: ["unreviewed"]
cards:
  "mr-5675":
    native: "Maharashtra is a state."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "Capital, not state: राजधानी (rājdhāni) means capital city." }, "f1": { why: "Plural: आहेत (āhet) is for several things; the sentence is about one state." } }
  "mr-5676":
    native: "Delhi is the capital."
    bases: { "ही": "this (feminine)", "आहे": "is" }
    confusables: { "w1": { why: "Masculine: हा (hā) agrees with a masculine noun; दिल्ली (dilli) is feminine." }, "w2": { why: "District, not capital: जिल्हा (jilhā) means district." } }
  "mr-5677":
    native: "Gujarat is to the west."
    bases: { "पश्चिमेला": "to the west", "आहे": "is" }
    confusables: { "w1": { why: "East, not west: पूर्व (purv) means east." }, "w2": { why: "North, not west: उत्तर (uttar) means north." } }
    notes: { "n1": "पश्चिमेला (paścimelā), to the west, takes -ेला (-elā) for a direction, while पश्चिम (paścim) is the bare word for west." }
  "mr-5678":
    native: "Karnataka is to the south."
    bases: { "दक्षिणेला": "to the south", "आहे": "is" }
    confusables: { "w1": { why: "North, not south: उत्तर (uttar) means north." }, "w2": { why: "West, not south: पश्चिम (paścim) means west." } }
    notes: { "n1": "दक्षिणेला (dakṣiṇelā), to the south, takes the direction ending -ेला (-elā), as पश्चिमेला (paścimelā) does." }
  "mr-5679":
    native: "Soldiers are at the border."
    bases: { "सीमेवर": "at the border", "आहेत": "are" }
    confusables: { "w1": { why: "Citizen, not soldier: नागरिक (nāgrik) means citizen." }, "f1": { why: "Singular: आहे (āhe) is for one thing; several soldiers take आहेत (āhet)." } }
    notes: { "n1": "सीमेवर (sīmevar), on the border, changes सीमा (sīmā) to सीमे- (sīme-) before -वर (-var), 'on', as a feminine noun in -आ (-ā) does." }
  "mr-5680":
    native: "Maharashtra's population is large."
    bases: { "महाराष्ट्राची": "of Maharashtra", "मोठी": "large", "आहे": "is" }
    confusables: { "w1": { why: "District, not population: जिल्हा (jilhā) means district." }, "f1": { why: "Masculine: मोठा (moṭhā) agrees with a masculine noun; लोकसंख्या (loksaṅkhyā) is feminine." } }
    notes: { "n1": "महाराष्ट्राची (mahārāṣṭrāci), of Maharashtra, ends in -ची (-cī) because it agrees with the feminine लोकसंख्या (loksaṅkhyā), population." }
  "mr-5681":
    native: "Do you like geography?"
    bases: { "आवडतो": "like" }
    confusables: { "w1": { why: "I, not you: मी (mi) means I." }, "f1": { why: "Feminine: आवडते (āvaḍte) is for a feminine thing; भूगोल (bhugol) is masculine." } }
  "mr-5682":
    native: "Where is the state's capital?"
    bases: { "राज्याची": "of the state", "आहे": "is" }
    confusables: { "w1": { why: "District, not capital: जिल्हा (jilhā) means district." }, "f1": { why: "Plural: आहेत (āhet) is for several things; the capital is one city." } }
    notes: { "n1": "राज्याची (rājyāci), of the state, ends in -ची (-cī) because it agrees with the feminine राजधानी (rājdhāni), capital." }
  "mr-5683":
    native: "Delhi is to the north."
    bases: { "उत्तरेला": "to the north", "आहे": "is" }
    confusables: { "w1": { why: "East, not north: पूर्व (purv) means east." }, "w2": { why: "West, not north: पश्चिम (paścim) means west." } }
    notes: { "n1": "उत्तरेला (uttarelā), to the north, is the direction form with -ेला (-elā), as in दक्षिणेला (dakṣiṇelā)." }
  "mr-5684":
    native: "This district is big."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "Capital, not district: राजधानी (rājdhāni) means capital city." }, "f1": { why: "Feminine: मोठी (moṭhi) agrees with a feminine noun; जिल्हा (jilhā) is masculine." } }
