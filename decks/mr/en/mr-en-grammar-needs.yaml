schema: 1
id: "mr-en-grammar-needs"
kind: "layer"
core: "mr-grammar-needs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Need and want"
license: "CC0-1.0"
description: "हवा (havā), पाहिजे (pāhije), नको (nako) and गरज (garaj): what you want, what you need, and what you don't. The one who wants takes -ला (-lā). Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0411":
    native: "wanted; needed"
    notes:
      "n1": "The one who wants takes -ला (-lā), and हवा (havā) agrees with what is wanted: मला चहा हवा (m), मला कॉफी हवी (f), मला पाणी हवे (n). Often with आहे (āhe): मला पाणी हवे आहे (malā pāṇi have āhe)."
  "mr-0412":
    native: "want; need"
    notes:
      "n1": "Never changes, whatever is wanted: मला चहा पाहिजे (malā cahā pāhije), I want tea. Very common in speech."
  "mr-0413":
    native: "don't want; no, thanks"
    notes:
      "n1": "The opposite of हवा (havā): मला साखर नको (malā sākhar nako), no sugar for me. On its own, नको (nako) is a polite 'no, thanks'."
  "mr-0414":
    native: "I want some water."
    notes:
      "n1": "'To me water is wanted': पाणी (pāṇi) is neuter, so हवे (have). असणे (asṇe) changes its stem in the present: आह- (āh-)."
    bases:
      "आहे": "to be"
  "mr-0415":
    native: "I need help."
    notes:
      "n1": "मदत (madat) is feminine, so हवी (havi). असणे (asṇe) changes its stem in the present: आह- (āh-)."
    bases:
      "मदत": "help"
      "आहे": "to be"
  "mr-0416":
    native: "I don't want tea."
  "mr-0417":
    native: "need"
    notes:
      "n1": "A need, more formal: मला डॉक्टरची गरज आहे (malā ḍôkṭarci garaj āhe), I need a doctor."
  "mr-0418":
    native: "How long will it take?"
    notes:
      "n1": "लागणे (lāgṇe) is 'to be needed, to take': दहा मिनिटे लागतील (dahā miniṭe lāgtil), it'll take ten minutes."
    bases:
      "लागेल": "to be felt; to take (time); to be necessary"
  "mr-0419":
    native: "I need a ticket."
