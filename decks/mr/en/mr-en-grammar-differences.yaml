schema: 1
id: "mr-en-grammar-differences"
kind: "layer"
core: "mr-grammar-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How Marathi grammar differs from English"
license: "CC0-1.0"
description: "Before any theme: the verb last, endings for in, to and with written onto the noun, three genders and a verb that shows the speaker's, two yous, two wes, no articles, and how Marathi says have, not and questions. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0125":
    native: "I eat rice. (a man speaking)"
    notes:
      "n1": "The verb comes last: subject, object, verb. Word for word, 'I rice eat'. A woman says खाते (khāte)."
    bases:
      "खातो": "to eat"
  "mr-0126":
    native: "He is a doctor."
    notes:
      "n1": "आहे (āhe), 'is', comes last too: 'he doctor is'."
    bases:
      "तो": "he; that"
      "आहे": "to be"
  "mr-0127":
    native: "in the house"
    notes:
      "n1": "Marathi puts 'in' after the noun, as an ending, and writes it joined: घर (ghar, house) + -त (-ta), with an -आ- (-ā-) between."
  "mr-0128":
    native: "to Mumbai"
    notes:
      "n1": "'To' is the ending -ला (-lā): मुंबई (mumbai) + -ला (-lā)."
  "mr-0129":
    native: "with mother"
    notes:
      "n1": "'With' is -बरोबर (-barobar), written joined too: आई (āi, mother) + -बरोबर (-barobar). Hindi writes such words apart; Marathi joins them."
  "mr-0130":
    native: "I came. (a man speaking)"
    notes:
      "n1": "The verb shows the speaker's gender, even for 'I': a man says आलो (ālo)."
    bases:
      "आलो": "to come"
  "mr-0131":
    native: "I came. (a woman speaking)"
    notes:
      "n1": "A woman says आले (āle). Learners who are women need these forms from the first day."
    bases:
      "आले": "to come"
  "mr-0132":
    native: "He came."
    bases:
      "तो": "he; that"
      "आला": "to come"
  "mr-0133":
    native: "She came."
    bases:
      "ती": "she"
      "आली": "to come"
  "mr-0134":
    native: "It came."
    notes:
      "n1": "Marathi has a third gender, neuter, for many things and for children: बाळ आले (bāḷ āle), the baby came. ते (te) is also 'they' and a respectful 'he'."
    bases:
      "ते": "he; she; it; they"
      "आले": "to come"
  "mr-0135":
    native: "Come! (to a friend)"
    notes:
      "n1": "Two words for 'you': तू (tu) to a friend, a child or someone younger, and in many families to a mother."
    bases:
      "तू": "you (to a friend)"
      "ये": "to come"
  "mr-0136":
    native: "Please come."
    notes:
      "n1": "तुम्ही (tumhi) is the respectful 'you', and the plural, and its verb takes the plural: या (yā), not ये (ye)."
    bases:
      "या": "to come"
  "mr-0137":
    native: "we (you and I); you (very formal)"
    notes:
      "n1": "Two words for 'we': आपण (āpaṇ) includes the person you're talking to. In formal speech it is also a very polite 'you'."
  "mr-0138":
    native: "we (not you)"
    notes:
      "n1": "आम्ही (āmhi) leaves the person you're talking to out."
  "mr-0139":
    native: "a book; one book"
    notes:
      "n1": "No word for 'the', and एक (ek), 'one', serves for 'a' when it is needed."
  "mr-0140":
    native: "I have a book."
    notes:
      "n1": "No verb 'have': 'with me a book is'. -कडे (-kaḍe) is 'at, towards, with'."
    bases:
      "आहे": "to be"
  "mr-0141":
    native: "I won't come."
    notes:
      "n1": "नाही (nāhi), 'not', comes after the verb: येणार (yeṇār) is 'going to come'."
    bases:
      "येणार": "to come"
  "mr-0142":
    native: "There's no time."
    notes:
      "n1": "नाही (nāhi) is also 'there is not', the opposite of आहे (āhe)."
  "mr-0143":
    native: "Will you come?"
    notes:
      "n1": "A yes-or-no question adds का (kā) at the end, or simply rises in tone: तुम्ही येणार (you will come) becomes तुम्ही येणार का (tumhi yeṇār kā)?"
    bases:
      "येणार": "to come"
