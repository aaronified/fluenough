cards:
  "mr-5172": {"native": "He is short.", "bases": {"आहे": "is"}, "confusables": {"w1": {"why": "She, not he: ती (ti) means she."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one person; one man takes आहे (āhe)."}}}
  "mr-5173": {"native": "She is fair-skinned.", "bases": {"गोरी": "fair-skinned", "आहे": "is"}, "confusables": {"w1": {"why": "He, not she: तो (to) means he."}, "f1": {"why": "Masculine: गोरा (gorā) is for a man; for a woman the form is गोरी (gori)."}}}
  "mr-5174": {"native": "Her hair is curly.", "bases": {"तिचे": "her", "आहेत": "is"}, "confusables": {"w1": {"why": "He, not her: तो (to) means he."}, "f1": {"why": "Singular: कुरळा (kurḷā) agrees with one masculine noun; hair takes the plural कुरळे (kurḷe)."}}}
  "mr-5175": {"native": "He has a beard.", "bases": {"त्याला": "he has", "आहे": "is"}, "confusables": {"w1": {"why": "She, not he: ती (ti) means she."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one thing; one beard takes आहे (āhe)."}}}
  "mr-5176": {"native": "My forehead is big.", "bases": {"माझे": "my", "मोठे": "big", "आहे": "is"}, "confusables": {"w1": {"why": "Masculine: मोठा (moṭhā) goes with a masculine noun; कपाळ (kapāḷ) is neuter, so मोठे (moṭhe) is right."}, "f1": {"why": "Feminine: मोठी (moṭhi) goes with a feminine noun; कपाळ (kapāḷ) is neuter, so मोठे (moṭhe) is right."}}}
  "mr-5177": {"native": "She is dark-complexioned.", "bases": {"सावळी": "dark-complexioned", "आहे": "is"}, "confusables": {"w1": {"why": "He, not she: तो (to) means he."}, "f1": {"why": "Masculine: सावळा (sāvḷā) is for a man; for a woman the form is सावळी (sāvḷi)."}}}
  "mr-5178": {"native": "He is thin.", "bases": {"आहे": "is"}, "confusables": {"w1": {"why": "She, not he: ती (ti) means she."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one man takes आहे (āhe)."}}}
  "mr-5179": {"native": "His beard is thick.", "bases": {"त्याची": "his", "आहे": "is"}, "confusables": {"w1": {"why": "Tall, not thick: उंच (uñc) means tall; a beard is thick."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one beard takes आहे (āhe)."}}}
  "mr-5180": {"native": "Dad is tall.", "bases": {"बाबांची": "Dad's", "जास्त": "great", "आहे": "is"}, "confusables": {"w1": {"why": "Adjective, not the noun: उंच (uñc) means tall; उंची (uñci) means height, which this sentence uses."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one height takes आहे (āhe)."}}}
  "mr-5181": {"native": "She wears clothes.", "bases": {"कपडे": "clothes (plural)", "घालते": "wears"}, "confusables": {"w1": {"why": "They, not she: ते (te) means they."}, "f1": {"why": "Masculine: घालतो (ghālto) is for a man; for a woman the form is घालते (ghālte)."}}}
  "mr-5182": {"native": "He has a moustache.", "bases": {"त्याला": "he has", "आहे": "is"}, "confusables": {"w1": {"why": "She, not he: ती (ti) means she."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one thing; one moustache takes आहे (āhe)."}}}
