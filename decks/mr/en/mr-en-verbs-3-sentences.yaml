id: "mr-en-verbs-3-sentences"
kind: "layer"
core: "mr-verbs-3-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences with more verbs 3"
license: "CC-BY-SA-4.0"
description: "Short sentences that use the verbs of this unit, mostly as polite orders. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-6720":
    native: "Look for the key."
    bases: { "चावी": "key", "शोधा": "look for" }
    confusables: { "w1": { why: "To lose, not to look: हरवणे (harvṇe) means to lose a thing." }, "w2": { why: "To find out, after a search: शोधून (śodhun) काढणे (kāḍhṇe) means to find out." } }
    notes: { "n1": "शोधा (śodhā), look for, is the polite order: the stem plus -ा (-ā), as for a polite you." }
  "mr-6721":
    native: "Ask for the address."
    bases: { "विचारा": "ask" }
    confusables: { "w1": { why: "To show, not to ask: दाखवणे (dākhvṇe) means to show." }, "w2": { why: "To remember, not to ask: आठवणे (āṭhvṇe) means to remember." } }
  "mr-6722":
    native: "Show me the ticket."
    bases: { "मला": "to me", "दाखवा": "show" }
    confusables: { "w1": { why: "To ask, not to show: विचारणे (vicārṇe) means to ask." }, "w2": { why: "To hold, not to show: धरा (dharā) means hold." } }
    notes: { "n1": "मला (malā) marks the person who is shown the ticket: -ला (-lā) is 'to' a person and also marks a person as the object." }
  "mr-6723":
    native: "Hold the bag."
    bases: { "धरा": "hold" }
    confusables: { "w1": { why: "To let go, the opposite: सोडणे (soḍṇe) means to leave or let go." }, "w2": { why: "To take away: नेणे (neṇe) means to take a thing somewhere." } }
  "mr-6724":
    native: "Let go of the hand."
    bases: { "सोडा": "let go" }
    confusables: { "w1": { why: "To hold, the opposite: धरणे (dharṇe) means to hold." }, "w2": { why: "To push away: ढकलणे (ḍhaklṇe) means to push." } }
  "mr-6725":
    native: "Go back home."
    bases: { "घरी": "home", "परता": "return" }
    confusables: { "w1": { why: "To walk about, not to return: फिरणे (phirṇe) means to walk about." }, "w2": { why: "To run away: पळणे (paḷṇe) means to run away." } }
  "mr-6726":
    native: "Where do you live?"
    bases: { "कुठे": "where", "राहता": "live" }
    confusables: { "w1": { why: "To go back, not to live: परतणे (partṇe) means to return." }, "w2": { why: "Who, not where: कोण (koṇ) asks who." } }
    notes: { "n1": "तुम्ही (tumhī), you (polite or plural), takes a verb ending in -ता (-tā), as in राहता (rāhtā), live." }
  "mr-6727":
    native: "The children are crying."
    bases: { "रडतात": "cry" }
    confusables: { "w1": { why: "To forget, not to cry: विसरणे (visrṇe) means to forget." }, "w2": { why: "To laugh, the opposite: हसतात (hastāt) means they laugh." } }
  "mr-6728":
    native: "The thief ran away."
    bases: { "चोर": "thief", "पळाला": "ran away" }
    confusables: { "w1": { why: "To stay, not to run: राहणे (rāhṇe) means to stay." }, "w2": { why: "To come back, not to run away: परतणे (partṇe) means to return." } }
    notes: { "n1": "पळाला (paḷālā), ran away, is masculine: the verb has no object, so it agrees with the doer, चोर (cor), a masculine noun." }
  "mr-6729":
    native: "Push the cart."
    bases: { "ढकला": "push" }
    confusables: { "w1": { why: "To hold: धरणे (dharṇe) means to hold, not to push." }, "w2": { why: "To let go: सोडणे (soḍṇe) means to let go." } }
  "mr-6730":
    native: "Finish the work."
    bases: { "संपवा": "finish" }
    confusables: { "w1": { why: "To search: शोधणे (śodhṇe) means to search." }, "w2": { why: "To take away: नेणे (neṇe) means to take a thing somewhere." } }
  "mr-6731":
    native: "Find out the truth."
    bases: { "शोधून": "after searching", "काढा": "out" }
    confusables: { "w1": { why: "To search, not to find out: शोधणे (śodhṇe) means to search." }, "w2": { why: "To remember: आठवणे (āṭhvṇe) means to remember." } }
    notes: { "n1": "शोधून (śodhun), having searched, joins to काढा (kāḍhā) to make शोधून काढणे (śodhun kāḍhṇe), to find out: the -ून (-un) form links two actions with one doer." }
  "mr-6732":
    native: "Forget this."
    bases: { "विसरा": "forget" }
    confusables: { "w1": { why: "The opposite, to remember: आठवणे (āṭhvṇe) means to remember." }, "w2": { why: "To lose a thing: हरवणे (harvṇe) means to lose." } }
  "mr-6733":
    native: "Remember the name."
    bases: { "आठवा": "remember" }
    confusables: { "w1": { why: "The opposite, to forget: विसरणे (visrṇe) means to forget." }, "w2": { why: "To ask a question: विचारणे (vicārṇe) means to ask." } }
