tags: ["unreviewed"]
cards:
  "mr-4050":
    native: "A cool wind has come from a far country, and the sister is glad to hear it, O brother."
    notes:
      "n1": "An ovi of the Bahinabhau section, sung by a sister who waits for her brother, as printed on mr.wikisource."
  "mr-4051":
    native: "A fragrant breeze comes from a distant country; he must be well, O brother."
    notes:
      "n1": "The second couplet of the same wind-song in the Bahinabhau section, as printed on mr.wikisource."
  "mr-4052":
    native: "Out of love the elders set aside any fault; come running, O brother."
    notes:
      "n1": "An ovi from the Bahinabhau section, as printed on mr.wikisource."
  "mr-4053":
    native: "I want no wealth, no coins and no pearl necklaces; give me a stream of tears of love, O brother."
    notes:
      "n1": "An ovi from the Bahinabhau section, as printed on mr.wikisource."
  "mr-4054":
    native: "Betel leaves, flowers, rice grains and areca nut are enough; I do not want a gold-threaded shawl, O brother."
    notes:
      "n1": "An ovi from the Bahinabhau section, as printed on mr.wikisource."
  "mr-4055":
    native: "Come, come, brother; how much pressure I have felt, and when will I open my heart before you?"
    notes:
      "n1": "An ovi from the Bahinabhau section, as printed on mr.wikisource."
  "mr-4056":
    native: "Come, come, brother; how long must I watch the road, while tears run from my eyes like a stream."
    notes:
      "n1": "A second ovi beginning with the same words, as printed on mr.wikisource."
  "mr-4057":
    native: "O life of my life, ocean of nectar, come at once, brother."
    notes:
      "n1": "An ovi from the Bahinabhau section, as printed on mr.wikisource."
  "mr-4058":
    native: "Will I have to give a great ceremonial gift, and why should such worry be in the mind, O brother?"
    notes:
      "n1": "An ovi from the Bahinabhau section about the ceremonial gift to a sister, as printed on mr.wikisource."
  "mr-4059":
    native: "Why would a brother grow angry with his younger sister, any more than musk would give up its own scent?"
    notes:
      "n1": "An ovi from the Bahinabhau section, as printed on mr.wikisource."
  "mr-4060":
    native: "My neighbour keeps coming to ask me again and again when the cart from my parents' home will come."
    notes:
      "n1": "An ovi from the Bahinabhau section, as printed on mr.wikisource."
  "mr-4061":
    native: "The children ask why uncle has not come, and the mother answers that he is caught up in some work."
    notes:
      "n1": "An ovi from the Bahinabhau section, as printed on mr.wikisource."
  "mr-4062":
    native: "The lips are one's own and the teeth are one's own; the great forget the past, O brother."
    notes:
      "n1": "An ovi from the Bahinabhau section, as printed on mr.wikisource."
  "mr-4063":
    native: "Look, for her chicks she has hung a swing from the tree."
    notes:
      "n1": "The first stanza of the poem Sugarnicha Khopa, as printed on mr.wikisource."
  "mr-4064":
    native: "God gave you two hands and ten fingers."
    notes:
      "n1": "The fourth stanza of the poem Sugarnicha Khopa, as printed on mr.wikisource."
  "mr-4065":
    native: "Life is like a griddle on the stove: first the hands get burned, and then the bread is earned."
    notes:
      "n1": "The first stanza of the poem Are Sansar Sansar, as printed on mr.wikisource."
  "mr-4066":
    native: "The first rain has come and sprinkled the whole earth."
    notes:
      "n1": "The first lines of the poem Ala Pahila Paus, as printed on mr.wikisource."
  "mr-4067":
    native: "He gives the sacred thread to the protector of the peasant folk, and that is the time of the Yavanas."
    notes:
      "n1": "The opening couplet of Phule's powada on Shivaji, as printed on mr.wikisource."
