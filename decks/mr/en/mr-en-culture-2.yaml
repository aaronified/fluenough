kind: "layer"
core: "mr-culture-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: powada, ovi and folk"
description: "Short passages of Marathi ovi songs, a powada on Shivaji, and ovi-metre poems by Bahinabai Chaudhari, each with its English rendering and a note. Not yet checked by a Marathi speaker: please report any mistake."
