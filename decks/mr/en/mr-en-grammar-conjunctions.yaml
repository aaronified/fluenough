schema: 1
id: "mr-en-grammar-conjunctions"
kind: "layer"
core: "mr-grammar-conjunctions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Joining words"
license: "CC-BY-SA-4.0"
description: "And, but, or, because, if: joining words and sentences. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0575":
    native: "and"
    notes:
      "n1": "चहा आणि बिस्किटे (cahā āṇi biskiṭe), tea and biscuits."
    "examples": {
      "काटा आणि चमचा ठेवा.": {"native": "Put out the fork and the spoon.", "bases": {"ठेवा": "to keep", "आणि": "and"}},
      "दही आणि भात खा.": {"native": "Eat curd and rice.", "bases": {"खा": "to eat", "आणि": "and"}}
    }
  "mr-0576":
    native: "but; also, even"
    notes:
      "n1": "Between sentences, 'but'. After a word, 'too, even': मी पण येतो (mi paṇ yeto), I'm coming too."
    "examples": {
      "मी आलो, पण तो घरी नव्हता.": {"native": "I came, but he wasn't at home.", "bases": {"आलो": "to come", "तो": "he; that", "नव्हता": "not to be"}}
    }
  "mr-0577":
    native: "or"
    notes:
      "n1": "चहा किंवा कॉफी (cahā kiṁvā kôfi), tea or coffee. In a question, की (ki): चहा घेणार की कॉफी (cahā gheṇār ki kôfi)?"
  "mr-0578":
    native: "because; a reason"
    notes:
      "n1": "मी आलो नाही (mi ālo nāhi), कारण मी आजारी होतो (kāraṇ mi ājāri hoto), I didn't come, because I was ill."
  "mr-0579":
    native: "so; that's why"
    notes:
      "n1": "Marathi often gives the reason first: पाऊस होता म्हणून मी आलो नाही (pāus hotā mhaṇun mi ālo nāhi), it was raining, so I didn't come."
    "examples": {
    }
  "mr-0580":
    native: "if"
    notes:
      "n1": "With तर (tar), 'then', in the second half: जर पाऊस पडला तर मी येणार नाही (jar pāus paḍlā tar mi yeṇār nāhi), if it rains, I won't come. जर (jar) is often left out; तर (tar) stays."
  "mr-0581":
    native: "then; as for"
    notes:
      "n1": "Also 'well then, as for': मी तर येणार (mi tar yeṇār), I, for one, am coming."
    "examples": {
      "घासाघीस केली तर स्वस्त होईल.": {"native": "If we bargain it will become cheap.", "bases": {"होईल": "to become"}},
      "सातत्य ठेवलं तर यश मिळतं.": {"native": "If you keep consistency, you get success.", "bases": {"यश": "success", "मिळतं": "to get", "तर": "then; as for"}}
    }
  "mr-0582":
    native: "that; or (in a question)"
    notes:
      "n1": "तो म्हणाला की तो येईल (to mhaṇālā ki to yeil), he said that he'd come."
    "examples": {
      "वय वाढलं की टक्कल पडतं.": {"native": "When one grows older, one goes bald.", "bases": {"पडतं": "to fall (hair)"}}
    }
  "mr-0583":
    native: "still; even so"
    notes:
      "n1": "पाऊस होता (pāus hotā), तरी तो आला (tari to ālā), it was raining; still, he came."
    "examples": {
    }
  "mr-0584":
    native: "I came, but he wasn't at home."
    notes:
      "n1": "नव्हता (navhatā), 'was not'. A woman says मी आले (mi āle). येणे (yeṇe) changes its stem in the past: आ- (ā-). नसणे (nasṇe) changes its stem in the past: नव्ह- (navh-)."
    bases:
      "आलो": "to come"
      "तो": "he; that"
      "नव्हता": "not to be"
