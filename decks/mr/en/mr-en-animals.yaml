schema: 1
id: "mr-en-animals"
kind: "layer"
core: "mr-animals"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Animals"
license: "CC-BY-SA-4.0"
description: "Animals on a farm, in a village and in the forest. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-0888":
    native: "dog"
    notes:
      "n1": "A dog is called कुत्रा (kutrā); a puppy is पिल्लू (pillu)."
    examples:
      "माझा कुत्रा मोठा आहे.": { native: "My dog is big.", bases: { "माझा": "my", "आहे": "to be" } }
      "कुत्रा अंगणात खेळतो.": { native: "The dog plays in the yard.", bases: { "अंगणात": "in the yard", "खेळतो": "to play" } }
  "mr-0889":
    native: "cat"
    notes:
      "n1": "A cat is मांजर (māñjar); the word is feminine."
    examples:
      "मांजर दूध पिते.": { native: "The cat drinks milk.", bases: { "पिते": "to drink" } }
      "काळी मांजर झोपते.": { native: "The black cat sleeps.", bases: { "काळी": "black", "झोपते": "to sleep" } }
  "mr-0890":
    native: "cow"
    notes:
      "n1": "A cow gives milk: गाय दूध देते (gāy dudh dete), the cow gives milk."
    examples:
      "गाय गवत खाते.": { native: "The cow eats grass.", bases: { "गवत": "grass", "खाते": "to eat" } }
      "गाय दूध देते.": { native: "The cow gives milk.", bases: { "देते": "to give" } }
  "mr-0891":
    native: "buffalo"
    notes:
      "n1": "A buffalo is a large animal: म्हैस मोठी (mhais moṭhi), a big buffalo."
    examples:
      "म्हैस पाण्यात आहे.": { native: "The buffalo is in the water.", bases: { "पाण्यात": "in the water", "आहे": "to be" } }
      "म्हैस मोठी आहे.": { native: "The buffalo is big.", bases: { "मोठी": "big", "आहे": "to be" } }
  "mr-0892":
    native: "ox"
    notes:
      "n1": "An ox works in the field: शेतात (śetāt), in the field."
    examples:
      "बैल शेतात काम करतो.": { native: "The ox works in the field.", bases: { "शेतात": "in the field", "करतो": "to do" } }
      "बैल मोठा आहे.": { native: "The ox is big.", bases: { "आहे": "to be" } }
  "mr-0893":
    native: "horse"
    notes:
      "n1": "A horse runs: घोडा पळतो (ghoḍā paḷto), the horse runs."
    examples:
      "घोडा पळतो.": { native: "The horse runs.", bases: { "पळतो": "to run" } }
      "मुले घोड्यावर बसतात.": { native: "The children ride the horse.", bases: { "घोड्यावर": "on the horse", "बसतात": "to sit" } }
  "mr-0894":
    native: "goat"
    notes:
      "n1": "A goat eats leaves: पाला (pālā), leaves."
    examples:
      "शेळी पाला खाते.": { native: "The goat eats leaves.", bases: { "पाला": "leaves", "खाते": "to eat" } }
      "शेळी आजारी आहे.": { native: "The goat is ill.", bases: { "आजारी": "ill", "आहे": "to be" } }
  "mr-0895":
    native: "sheep"
    notes:
      "n1": "A sheep is white or black: मेंढी पांढरी (meṇḍhi pāṇḍhari), a white sheep."
    examples:
      "मेंढी पांढरी आहे.": { native: "The sheep is white.", bases: { "पांढरी": "white", "आहे": "to be" } }
      "मेंढी गवत खाते.": { native: "The sheep eats grass.", bases: { "गवत": "grass", "खाते": "to eat" } }
  "mr-0896":
    native: "hen"
    notes:
      "n1": "A hen lays eggs: अंडी (aṇḍi), eggs."
    examples:
      "कोंबडी अंडी देते.": { native: "The hen lays eggs.", bases: { "देते": "to give" } }
      "सकाळी कोंबडी ओरडते.": { native: "In the morning the hen crows.", bases: { "सकाळी": "morning", "ओरडते": "to crow" } }
  "mr-0897":
    native: "duck"
    notes:
      "n1": "A duck swims: पोहते (pohte), it swims."
    examples:
      "बदक पाण्यात पोहते.": { native: "The duck swims in the water.", bases: { "पाण्यात": "in the water", "पोहते": "to swim" } }
      "तलावात बदक आहे.": { native: "There is a duck in the lake.", bases: { "तलावात": "in the lake", "आहे": "to be" } }
  "mr-0898":
    native: "bird"
    notes:
      "n1": "A bird flies: पक्षी उडतो (pakṣi uḍto), the bird flies."
    examples:
      "झाडावर पक्षी आहे.": { native: "There is a bird in the tree.", bases: { "झाडावर": "in the tree", "आहे": "to be" } }
      "पक्षी उडतो.": { native: "The bird flies.", bases: { "उडतो": "to fly" } }
  "mr-0899":
    native: "sparrow"
    notes:
      "n1": "A small bird: चिमणी छोटी (cimṇi choṭi), a small sparrow."
    examples:
      "चिमणी छोटी आहे.": { native: "The sparrow is small.", bases: { "छोटी": "small", "आहे": "to be" } }
      "चिमणी झाडावर बसते.": { native: "The sparrow sits on the tree.", bases: { "झाडावर": "on the tree", "बसते": "to sit" } }
  "mr-0900":
    native: "crow"
    notes:
      "n1": "A crow is black: कावळा काळा (kāvḷā kāḷā), the crow is black."
    examples:
      "कावळा काळा आहे.": { native: "The crow is black.", bases: { "काळा": "black", "आहे": "to be" } }
      "कावळा ओरडतो.": { native: "The crow caws.", bases: { "ओरडतो": "to crow" } }
  "mr-0901":
    native: "snake"
    notes:
      "n1": "A snake is dangerous: सावध रहा (sāvadh rahā), be careful."
    examples:
      "साप जमिनीवर चालतो.": { native: "The snake moves on the ground.", bases: { "जमिनीवर": "on the ground" } }
      "तिथे साप आहे, सावध रहा.": { native: "There is a snake there; be careful.", bases: { "सावध": "careful", "रहा": "to stay", "आहे": "to be" } }
  "mr-0902":
    native: "tiger"
    notes:
      "n1": "A tiger lives in the forest: जंगलात (jaṅgalāt), in the forest."
    examples:
      "वाघ जंगलात राहतो.": { native: "The tiger lives in the forest.", bases: { "जंगलात": "in the forest", "राहतो": "to live" } }
      "वाघ खूप मोठा आहे.": { native: "The tiger is very big.", bases: { "मोठा": "big", "आहे": "to be" } }
  "mr-0903":
    native: "lion"
    notes:
      "n1": "A lion is the king of the forest: जंगलाचा राजा (jaṅgalācā rājā), the king of the forest."
    examples:
      "सिंह जंगलाचा राजा आहे.": { native: "The lion is the king of the forest.", bases: { "जंगलाचा": "of the forest", "राजा": "king", "आहे": "to be" } }
      "सिंह गर्जना करतो.": { native: "The lion roars.", bases: { "गर्जना": "roar", "करतो": "to do" } }
  "mr-0904":
    native: "elephant"
    notes:
      "n1": "An elephant is very large: हत्ती मोठा (hatti moṭhā), a big elephant."
    examples:
      "हत्ती मोठा आहे.": { native: "The elephant is big.", bases: { "मोठा": "big", "आहे": "to be" } }
      "हत्ती पाणी पितो.": { native: "The elephant drinks water.", bases: { "पितो": "to drink" } }
  "mr-0905":
    native: "monkey"
    notes:
      "n1": "A monkey climbs: चढते (caḍhte), it climbs."
    examples:
      "माकड झाडावर चढते.": { native: "The monkey climbs the tree.", bases: { "झाडावर": "on the tree", "चढते": "to climb" } }
      "माकड केळे खाते.": { native: "The monkey eats a banana.", bases: { "खाते": "to eat" } }
  "mr-0906":
    native: "rabbit"
    notes:
      "n1": "A rabbit eats grass and runs: ससा पळतो (sasā paḷto), the rabbit runs."
    examples:
      "ससा गवत खातो.": { native: "The rabbit eats grass.", bases: { "गवत": "grass", "खातो": "to eat" } }
      "ससा पळतो.": { native: "The rabbit runs.", bases: { "पळतो": "to run" } }
  "mr-0907":
    native: "rat; mouse"
    notes:
      "n1": "A cat catches a rat: मांजर उंदीर पकडते (māñjar undir pakḍte), the cat catches the rat."
    examples:
      "उंदीर घरात आहे.": { native: "There is a rat in the house.", bases: { "घरात": "in the house", "आहे": "to be" } }
      "मांजर उंदीर पकडते.": { native: "The cat catches the rat.", bases: { "मांजर": "cat", "पकडते": "to catch" } }
  "mr-0908":
    native: "donkey"
    notes:
      "n1": "A donkey carries loads: ओझे (ojhe), a load."
    examples:
      "गाढव ओझे वाहते.": { native: "The donkey carries a load.", bases: { "ओझे": "load", "वाहते": "to carry" } }
      "गाढव हळू चालते.": { native: "The donkey walks slowly.", bases: { "हळू": "slowly" } }
  "mr-0909":
    native: "frog"
    notes:
      "n1": "A frog jumps: उडी मारतो (uḍi mārto), it jumps."
    examples:
      "बेडूक पाण्यात उडी मारतो.": { native: "The frog jumps into the water.", bases: { "पाण्यात": "into the water", "उडी": "jump", "मारतो": "to jump" } }
      "बेडूक ओरडतो.": { native: "The frog croaks.", bases: { "ओरडतो": "to croak" } }
  "mr-0910":
    native: "bee"
    notes:
      "n1": "A bee gives honey: मध (madh), honey."
    examples:
      "मधमाशी फुलावर बसते.": { native: "The bee sits on the flower.", bases: { "फुलावर": "on the flower", "बसते": "to sit" } }
      "मधमाशी मध देते.": { native: "The bee gives honey.", bases: { "मध": "honey", "देते": "to give" } }
  "mr-0911":
    native: "ant"
    notes:
      "n1": "An ant is small: मुंगी लहान (muṅgi lahān), a small ant."
    examples:
      "मुंगी लहान आहे.": { native: "The ant is small.", bases: { "लहान": "small", "आहे": "to be" } }
      "मुंग्या साखर नेतात.": { native: "The ants carry off sugar.", bases: { "मुंग्या": "ants", "नेतात": "to carry off" } }
