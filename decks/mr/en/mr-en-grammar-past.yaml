pattern:
  name: "Simple past, verbs without an object"
  slot_name: "person and gender"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "jaane": "to go"
    "yene": "to come"
    "basne": "to sit"
    "uthne": "to get up"
  notes: "The stem, then -ल- (-la-), then an ending that agrees with the doer: a man says मी गेलो (mi gelo), a woman मी गेले (mi gele); to a man तू गेलास (tu gelās), to a woman तू गेलीस (tu gelis); तो गेला (to gelā), ती गेली (ti geli), ते (it) गेले (gele). आम्ही (āmhi) takes -लो (-lo), and तुम्ही (tumhi) -लात (-lāt), often shortened to -ला (-lā). जाणे (jāṇe) and येणे (yeṇe) have stems of their own: गेला (gelā), आला (ālā). With an object the rule is different: see Pitfalls."
