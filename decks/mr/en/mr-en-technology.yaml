schema: 1
id: "mr-en-technology"
kind: "layer"
core: "mr-technology"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Technology"
description: "Technology in daily life: machines and robots, software and the internet, data, websites and the words for fixing and making things. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-1441":
    native: "technology"
    notes:
      "n1": "{1} is technology, the use of science in tools and machines."
    examples:
      "तंत्रज्ञान वेगाने बदलतं.": { native: "Technology changes fast.", bases: { "वेगाने": "fast" } }
      "तंत्रज्ञानामुळे काम सोपं झालं.": { native: "Because of technology the work became easy.", bases: { "झालं": "to become" } }
  "mr-1442":
    native: "machine"
    notes:
      "n1": "{1} is a machine or a device that does work."
    examples:
      "हे यंत्र नवीन आहे.": { native: "This machine is new.", bases: { "नवीन": "new", "आहे": "to be" } }
      "यंत्र बंद पडलं.": "The machine stopped."
  "mr-1443":
    native: "system, mechanism"
    notes:
      "n1": "{1} is a system or a mechanism that works together."
    examples:
      "सिग्नलची यंत्रणा बिघडली.": { native: "The signal system broke down.", bases: { "बिघडली": "to break down" } }
      "ही यंत्रणा खूप जटिल आहे.": { native: "This system is very complex.", bases: { "आहे": "to be" } }
  "mr-1444":
    native: "software"
    notes:
      "n1": "{1} is software, a loanword from English."
    examples:
      "नवीन सॉफ्टवेअर आलं.": { native: "New software has come.", bases: { "नवीन": "new" } }
      "सॉफ्टवेअर अपडेट करा.": "Update the software."
  "mr-1445":
    native: "hardware"
    notes:
      "n1": "{1} is hardware, the physical parts of a computer, a loanword from English."
    examples:
      "हार्डवेअर जुनं झालं.": { native: "The hardware has become old.", bases: { "झालं": "to become" } }
      "हार्डवेअर बदलावं लागेल.": { native: "The hardware will have to be changed.", bases: { "लागेल": "to need" } }
  "mr-1446":
    native: "data"
    notes:
      "n1": "{1} is data, information stored and processed by computers, a loanword from English."
    examples:
      "डेटा सुरक्षित ठेवा.": { native: "Keep the data safe.", bases: { "सुरक्षित": "safe" } }
      "डेटा संपला.": { native: "The data has run out.", bases: { "संपला": "to end" } }
  "mr-1447":
    native: "online"
    notes:
      "n1": "{1} describes something on the internet, a loanword from English."
    examples:
      "ऑनलाइन खरेदी करता येते.": "You can buy online."
      "वर्ग ऑनलाइन होता.": { native: "The class was online.", bases: { "वर्ग": "class", "होता": "to be" } }
  "mr-1448":
    native: "website"
    notes:
      "n1": "{1} is a website, a loanword from English."
    examples:
      "वेबसाइट उघडत नाही.": { native: "The website is not opening.", bases: { "नाही": "not" } }
      "त्यांची वेबसाइट नवीन आहे.": { native: "Their website is new.", bases: { "नवीन": "new", "आहे": "to be" } }
  "mr-1449":
    native: "server"
    notes:
      "n1": "{1} is a computer server, a loanword from English."
    examples:
      "सर्व्हर बंद आहे.": { native: "The server is down.", bases: { "बंद": "down", "आहे": "to be" } }
      "सर्व्हर चालू झाला.": { native: "The server came back on.", bases: { "चालू": "on", "झाला": "to become" } }
  "mr-1450":
    native: "code"
    notes:
      "n1": "{1} is computer code, a loanword from English."
    examples:
      "हा कोड कोणी लिहिला?": "Who wrote this code?"
      "कोडमध्ये चूक आहे.": { native: "There is a mistake in the code.", bases: { "चूक": "mistake", "आहे": "to be" } }
  "mr-1451":
    native: "program"
    notes:
      "n1": "{1} is a computer program, a loanword from English."
    examples:
      "प्रोग्राम सुरू केला.": { native: "I started the program.", bases: { "सुरू": "started" } }
      "हा प्रोग्राम वापरायला सोपा आहे.": { native: "This program is easy to use.", bases: { "आहे": "to be" } }
  "mr-1452":
    native: "robot"
    notes:
      "n1": "{1} is a robot, a loanword from English. The formal word is यंत्रमानव (yantramānav)."
    examples:
      "रोबोट काम करतो.": "The robot works."
      "कारखान्यात रोबोट वापरतात.": "They use robots in the factory."
  "mr-1453":
    native: "sensor"
    notes:
      "n1": "{1} is a sensor, a device that detects something, a loanword from English."
    examples:
      "सेन्सर तापमान सांगतो.": "The sensor tells the temperature."
      "सेन्सर खराब झाला.": { native: "The sensor is broken.", bases: { "खराब": "broken", "झाला": "to become" } }
  "mr-1454":
    native: "energy, power"
    notes:
      "n1": "{1} is energy or power."
    examples:
      "सौर ऊर्जा स्वस्त आहे.": { native: "Solar energy is cheap.", bases: { "सौर": "solar", "आहे": "to be" } }
      "शरीराला ऊर्जा लागते.": { native: "The body needs energy.", bases: { "शरीराला": "the body", "लागते": "to need" } }
  "mr-1455":
    native: "artificial intelligence"
    notes:
      "n1": "{1} is artificial intelligence."
    examples:
      "कृत्रिम बुद्धिमत्ता खूप वाढली आहे.": { native: "Artificial intelligence has grown a lot.", bases: { "आहे": "to be" } }
      "कृत्रिम बुद्धिमत्तेचा वापर होतो.": { native: "Artificial intelligence is used.", bases: { "बुद्धिमत्तेचा": "of intelligence", "वापर": "use", "होतो": "to be" } }
  "mr-1456":
    native: "virus (computer)"
    notes:
      "n1": "{1} is a computer virus, a loanword from English."
    examples:
      "संगणकात व्हायरस आला.": "A virus came into the computer."
      "व्हायरस काढून टाका.": { native: "Remove the virus.", bases: { "टाका": "to do" } }
  "mr-1457":
    native: "security, safety"
    notes:
      "n1": "{1} is security or safety."
    examples:
      "पासवर्डने सुरक्षा मिळते.": { native: "A password gives security.", bases: { "मिळते": "to get" } }
      "माहितीची सुरक्षा महत्त्वाची आहे.": { native: "The security of information is important.", bases: { "महत्त्वाची": "important", "आहे": "to be" } }
  "mr-1458":
    native: "to upload"
    notes:
      "n1": "{1} is sending a file to the internet, the opposite of downloading."
    examples:
      "फोटो अपलोड केला.": "I uploaded the photo."
      "व्हिडिओ अपलोड करा.": "Upload the video."
  "mr-1459":
    native: "to repair, to fix"
    notes:
      "n1": "{1} is repairing a machine or a thing that is broken."
    examples:
      "मी फोन दुरुस्त केला.": "I repaired the phone."
      "संगणक दुरुस्त झाला का?": { native: "Was the computer repaired?", bases: { "झाला": "to become" } }
  "mr-1460":
    native: "to make, to prepare"
    notes:
      "n1": "{1} is making or preparing a thing."
    examples:
      "नवीन ॲप तयार केलं.": { native: "I made a new app.", bases: { "नवीन": "new" } }
      "कार्यक्रमाची तयारी झाली.": { native: "The preparation for the programme is done.", bases: { "कार्यक्रमाची": "of the programme", "तयारी": "preparation", "झाली": "to become" } }
  "mr-1461":
    native: "to run, to operate"
    notes:
      "n1": "{1} is running a machine or a business."
    examples:
      "तो संगणक चालवतो.": "He operates the computer."
      "यंत्र कसं चालवायचं?": "How should the machine be run?"
