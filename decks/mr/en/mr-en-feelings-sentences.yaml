cards:
  "mr-5555":
    native: "I feel afraid."
    bases: { "मला": "to me", "वाटते": "feels" }
    confusables: { "w1": { why: "राग (rāg) is anger, not fear." }, "w2": { why: "चिंता (cintā) is worry, a milder kind of fear." } }
  "mr-5556":
    native: "I get angry."
    bases: { "मला": "to me", "येतो": "comes (I get)" }
    confusables: { "w1": { why: "रागावणे (rāgāvṇe) is the verb to get angry; this sentence uses the noun राग (rāg) with येतो (yeto)." }, "w2": { why: "द्वेष (dveṣ) is hatred, a stronger feeling than anger." } }
  "mr-5557":
    native: "He is content."
    bases: { "तो": "he", "आहे": "is" }
    confusables: { "w1": { why: "समाधान (samādhān) is the noun contentment; समाधानी (samādhāni) is the adjective." }, "w2": { why: "धैर्यवान (dhairyavān) means brave, not content." } }
  "mr-5558":
    native: "I hope."
    bases: { "मला": "to me", "आहे": "is" }
    confusables: { "w1": { why: "चिंता (cintā) is worry, the opposite of hope." }, "w2": { why: "लाज (lāj) is shame, not hope." } }
  "mr-5559":
    native: "I am bored."
    bases: { "मला": "to me", "आला": "came" }
    confusables: { "w1": { why: "कंटाळणे (kaṇṭāḷṇe) is the verb to be bored; with the noun कंटाळा (kaṇṭāḷā) this sentence uses आला (ālā)." }, "w2": { why: "उत्साह (utsāh) is enthusiasm, the opposite of boredom." } }
  "mr-5560":
    native: "He is shy."
    bases: { "तो": "he", "आहे": "is" }
    confusables: { "w1": { why: "घाबरट (ghābraṭ) means timid, easily scared; it is not shy." }, "w2": { why: "धैर्यवान (dhairyavān) means brave, not shy." } }
  "mr-5561":
    native: "She was scared."
    bases: { "ती": "she", "घाबरली": "got scared" }
    confusables: { "w1": { why: "घाबरट (ghābraṭ) is the adjective for a timid person, not the verb." }, "w2": { why: "भीती (bhiti) is the noun fear." } }
  "mr-5562":
    native: "Always smile."
    bases: { "हसा": "smile (please)" }
    confusables: { "w1": { why: "चिडणे (ciḍṇe) is to get irritated, the opposite of smiling." }, "w2": { why: "रागावणे (rāgāvṇe) is to get angry." } }
  "mr-5563":
    native: "He is irritable."
    bases: { "तो": "he", "आहे": "is" }
    confusables: { "w1": { why: "समाधानी (samādhāni) is content, the opposite of irritable." }, "w2": { why: "लाजाळू (lājāḷu) means shy, not irritable." } }
  "mr-5564":
    native: "They love."
    bases: { "ते": "they", "करतात": "do" }
    confusables: { "w1": { why: "द्वेष (dveṣ) is hatred, the opposite of love." }, "w2": { why: "दुःख (duḥkh) is sorrow, not love." } }
  "mr-5565":
    native: "The boy smiles."
    bases: { "हसतो": "smiles" }
    confusables: { "w1": { why: "घाबरणे (ghābrṇe) means to be scared, not to smile." }, "f1": { why: "हसते (haste) is for a woman; a boy takes हसतो (hasto)." } }
  "mr-5566":
    native: "I feel lonely."
    bases: { "मला": "to me", "वाटतो": "feels" }
    confusables: { "w1": { why: "कंटाळा (kaṇṭāḷā) is boredom, not loneliness." }, "w2": { why: "चिंता (cintā) is worry, a different feeling." } }
