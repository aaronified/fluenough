schema: 1
id: "mr-en-festivals"
kind: "layer"
core: "mr-festivals"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Festivals"
description: "Diwali, Holi, Ganesh festival, Gudi Padwa and the other days, with the sweets, prayers and words used to celebrate them. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-1038":
    native: "festival"
    notes:
      "n1": "{1} is a festival or a holiday of the year."
    examples:
      "आज आमचा सण आहे.": { native: "Today is our festival.", bases: { "आहे": "to be" } }
      "सणाला सगळे घरी येतात.": { native: "On the festival everyone comes home.", bases: { "सणाला": "festival" } }
  "mr-1039":
    native: "celebration, big festival"
    notes:
      "n1": "{1} is a large celebration, often in a town or village."
    examples:
      "गावात मोठा उत्सव आहे.": { native: "There is a big celebration in the village.", bases: { "आहे": "to be" } }
      "उत्सवात नाच आणि गाणी असतात.": { native: "At the celebration there is dancing and songs.", bases: { "गाणी": "songs", "असतात": "to be", "उत्सवात": "celebration, big festival" } }
  "mr-1040":
    native: "Holi, the festival of colours"
    notes:
      "n1": "{1} is Holi, the spring festival when people throw colours."
    examples:
      "होळीला रंग खेळतात.": { native: "On Holi people play with colours.", bases: { "होळीला": "Holi, the festival of colours" } }
      "होळीत सगळे रंगतात.": { native: "On Holi everyone gets coloured.", bases: { "रंगतात": "to get coloured", "होळीत": "Holi, the festival of colours" } }
  "mr-1041":
    native: "Ganesh; the Ganesh festival"
    notes:
      "n1": "{1} is the elephant-headed god Ganesh, and his festival in the monsoon."
    examples:
      "गणपतीची मूर्ती सुंदर आहे.": { native: "The statue of Ganesh is beautiful.", bases: { "आहे": "to be", "गणपतीची": "Ganesh; the Ganesh festival" } }
      "गणपतीला मोदक आवडतात.": { native: "Ganesh likes modak.", bases: { "गणपतीला": "Ganesh; the Ganesh festival" } }
  "mr-1042":
    native: "Dussehra"
    notes:
      "n1": "{1} is Dussehra, the autumn festival when people wear new clothes."
    examples:
      "दसऱ्याला सगळे नवे कपडे घालतात.": { native: "On Dussehra everyone wears new clothes.", bases: { "नवे": "new", "कपडे": "clothes", "दसऱ्याला": "Dussehra" } }
      "दसरा कधी आहे?": { native: "When is Dussehra?", bases: { "आहे": "to be" } }
  "mr-1043":
    native: "Eid"
    notes:
      "n1": "{1} is Eid, the festival that ends Ramadan."
    examples:
      "ईदच्या दिवशी सगळे भेटतात.": { native: "On Eid day everyone meets.", bases: { "भेटतात": "to meet", "ईदच्या": "Eid" } }
      "ईदला शेवया खातात.": { native: "On Eid they eat vermicelli.", bases: { "शेवया": "vermicelli", "ईदला": "Eid" } }
  "mr-1044":
    native: "Christmas"
    notes:
      "n1": "{1} is Christmas. Marathi speakers say नाताळ (nātāḷ) for the day."
    examples:
      "नाताळला चर्चमध्ये जातात.": { native: "At Christmas they go to church.", bases: { "नाताळला": "Christmas" } }
      "नाताळच्या सुट्टीत गावी जाऊ.": { native: "Let's go to the village in the Christmas holidays.", bases: { "नाताळच्या": "Christmas" } }
  "mr-1045":
    native: "sweets"
    notes:
      "n1": "{1} is sweets, the food that is given at festivals."
    examples:
      "सणाला मिठाई वाटतात.": { native: "On the festival they give out sweets.", bases: { "वाटतात": "to give out" } }
      "ही मिठाई खूप गोड आहे.": { native: "These sweets are very sweet.", bases: { "आहे": "to be" } }
  "mr-1046":
    native: "rangoli, a coloured pattern on the floor"
    notes:
      "n1": "{1} is a rangoli: a coloured pattern drawn on the floor at the door."
    examples:
      "अंगणात सुंदर रांगोळी काढली.": { native: "I drew a beautiful rangoli in the yard.", bases: { "अंगणात": "in the yard" } }
      "रांगोळीचे रंग तेजस्वी आहेत.": { native: "The rangoli's colours are bright.", bases: { "आहेत": "to be", "रांगोळीचे": "rangoli, a coloured pattern on the floor" } }
  "mr-1047":
    native: "firecracker"
    notes:
      "n1": "{1} is a firecracker. The plural फटाके (phaṭāke) is used for fireworks."
    examples:
      "रात्री फटाके वाजतात.": { native: "At night firecrackers go off.", bases: { "वाजतात": "to sound", "फटाके": "firecracker" } }
      "फटाक्यांनी कान दुखतो.": { native: "The firecrackers hurt my ears.", bases: { "दुखतो": "to hurt", "फटाक्यांनी": "firecracker" } }
  "mr-1048":
    native: "worship, prayer ritual"
    notes:
      "n1": "{1} is worship: the ritual prayer at home or in a temple."
    examples:
      "सकाळी देवाची पूजा केली.": "In the morning I did the worship of God."
      "आई रोज पूजा करते.": "Mother does worship every day."
  "mr-1049":
    native: "blessed food from a temple"
    notes:
      "n1": "{1} is food blessed by a god, then shared with everyone."
    examples:
      "देवळात प्रसाद मिळाला.": { native: "I got blessed food at the temple.", bases: { "देवळात": "at the temple", "मिळाला": "to get" } }
      "प्रसाद सगळ्यांना वाटला.": { native: "The blessed food was given to everyone.", bases: { "वाटला": "to give out" } }
  "mr-1050":
    native: "offering of food to a god"
    notes:
      "n1": "{1} is the food offered to a god before it is eaten."
    examples:
      "देवाला नैवेद्य दाखवला.": { native: "I offered food to God.", bases: { "दाखवला": "to offer" } }
      "नैवेद्यानंतर सगळे जेवतात.": { native: "After the offering everyone eats.", bases: { "नैवेद्यानंतर": "offering of food to a god" } }
  "mr-1051":
    native: "gift"
    notes:
      "n1": "{1} is a present given for a festival or a birthday."
    examples:
      "मी मित्राला भेटवस्तू दिली.": "I gave a gift to my friend."
      "भेटवस्तू छान होती.": { native: "The gift was nice.", bases: { "होती": "to be" } }
  "mr-1052":
    native: "procession"
    notes:
      "n1": "{1} is a procession: people walking together through the streets."
    examples:
      "गणपतीची मिरवणूक निघाली.": { native: "The procession of Ganesh set out.", bases: { "निघाली": "to set out" } }
      "मिरवणुकीत लोक नाचत होते.": { native: "In the procession people were dancing.", bases: { "होते": "to be", "मिरवणुकीत": "procession" } }
  "mr-1053":
    native: "dance"
    notes:
      "n1": "{1} is a dance or dancing at a festival."
    examples:
      "लोक नाच करत होते.": { native: "People were dancing.", bases: { "होते": "to be" } }
      "सणाला मोठा नाच होतो.": { native: "At the festival there is a big dance.", bases: { "होतो": "to be" } }
  "mr-1054":
    native: "joy, happiness"
    notes:
      "n1": "{1} is joy. You can say तुम्हाला आनंद (tumhālā ānanda), I wish you joy."
    examples:
      "सणाचा आनंद वेगळा असतो.": { native: "The joy of a festival is special.", bases: { "असतो": "to be" } }
      "सगळ्यांना खूप आनंद झाला.": { native: "Everyone felt great joy.", bases: { "झाला": "to become" } }
  "mr-1055":
    native: "good wishes"
    notes:
      "n1": "{1} is good wishes. They are often said at a festival."
    examples:
      "सगळ्यांना दिवाळीच्या शुभेच्छा!": "Diwali wishes to everyone!"
      "त्यांनी शुभेच्छा दिल्या.": "They gave good wishes."
  "mr-1056":
    native: "festival snacks"
    notes:
      "n1": "{1} is the snacks made for a festival, such as Diwali."
    examples:
      "दिवाळीचा फराळ तयार आहे.": { native: "The Diwali snacks are ready.", bases: { "आहे": "to be" } }
      "फराळ सगळ्यांना आवडतो.": "Everyone likes the snacks."
  "mr-1057":
    native: "karanji, a sweet pastry"
    notes:
      "n1": "{1} is a karanji, a sweet pastry filled with coconut."
    examples:
      "करंजी कुरकुरीत असते.": { native: "A karanji is crisp.", bases: { "असते": "to be" } }
      "दिवाळीत करंजी खाते.": "I eat karanji at Diwali."
  "mr-1058":
    native: "small oil lamp"
    notes:
      "n1": "{1} is a small lamp of clay with oil, lit at Diwali."
    examples:
      "दारात पणत्या लावल्या.": { native: "I lit small lamps at the door.", bases: { "लावल्या": "to light", "पणत्या": "small oil lamp" } }
      "पणत्यांचा प्रकाश सुंदर होता.": { native: "The light of the lamps was beautiful.", bases: { "होता": "to be", "पणत्यांचा": "small oil lamp" } }
  "mr-1059":
    native: "paper lantern"
    notes:
      "n1": "{1} is a paper lantern hung outside the house at Diwali."
    examples:
      "घरावर आकाशकंदील लावला.": { native: "I hung a lantern on the house.", bases: { "लावला": "to hang" } }
      "आकाशकंदील रंगीबेरंगी आहे.": { native: "The lantern is colourful.", bases: { "आहे": "to be" } }
  "mr-1060":
    native: "prayer"
    notes:
      "n1": "{1} is a prayer, the words said to a god."
    examples:
      "सकाळी प्रार्थना म्हणतो.": { native: "I say a prayer in the morning.", bases: { "म्हणतो": "to say" } }
      "प्रार्थनेत देवाला नमस्कार करतात.": { native: "In prayer they greet God.", bases: { "प्रार्थनेत": "prayer" } }
  "mr-1061":
    native: "god"
    notes:
      "n1": "{1} is a god. The feminine देवी (devī) is a goddess."
    examples:
      "देवाला नमस्कार करा.": { native: "Greet God.", bases: { "देवाला": "god" } }
      "देव सगळीकडे आहे.": { native: "God is everywhere.", bases: { "आहे": "to be" } }
  "mr-1062":
    native: "birthday"
    notes:
      "n1": "{1} is a birthday."
    examples:
      "माझा वाढदिवस आहे.": { native: "It is my birthday.", bases: { "आहे": "to be" } }
      "वाढदिवसाला केक कापतो.": { native: "On my birthday I cut a cake.", bases: { "वाढदिवसाला": "birthday" } }
  "mr-1063":
    native: "to celebrate"
    notes:
      "n1": "{1} is used with a festival: दिवाळी साजरी करणे (divāḷī sājrī karṇe), to celebrate Diwali."
    examples:
      "सगळे मिळून दिवाळी साजरी करतात.": { native: "Everyone celebrates Diwali together.", bases: { "साजरी": "to celebrate" } }
      "आम्ही सण साजरा केला.": { native: "We celebrated the festival.", bases: { "साजरा": "to celebrate" } }
  "mr-1064":
    native: "to decorate"
    notes:
      "n1": "{1} is used for decorating a house, a room or a plate."
    examples:
      "घर सजवलं.": { native: "I decorated the house.", bases: { "सजवलं": "to decorate" } }
      "आई घर सजवते.": { native: "Mother decorates the house.", bases: { "सजवते": "to decorate" } }
  "mr-1065":
    native: "to dance"
    notes:
      "n1": "{1} is the verb for dancing."
    examples:
      "मुलं नाचत होती.": { native: "The children were dancing.", bases: { "होती": "to be", "नाचत": "to dance" } }
      "ती छान नाचते.": { native: "She dances nicely.", bases: { "नाचते": "to dance" } }
  "mr-1066":
    native: "traditional"
    notes:
      "n1": "{1} describes things handed down from the past."
    examples:
      "पारंपरिक पोशाख घालतात.": "They wear traditional clothes."
      "हा पारंपरिक सण आहे.": { native: "This is a traditional festival.", bases: { "आहे": "to be" } }
