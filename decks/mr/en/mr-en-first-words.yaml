description: "The respect Marathi builds into 'you': तुम्ही (tumhi) and तू (tu). Greetings and saying you are still learning are in the phrasebook. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0145":
    native: "you (respectful); you (plural)"
    notes:
      "n1": "Marathi has two words for 'you': तुम्ही (tumhi) for strangers, elders and anyone you respect, and तू (tu) for friends, children and the very close. The verb changes with each. A learner is always safe with तुम्ही (tumhi)."
