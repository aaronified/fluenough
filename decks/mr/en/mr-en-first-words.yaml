core: "mr-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC0-1.0"
description: "Greetings, the respect Marathi builds into them, and how to say you are still learning. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0144":
    native: "hello; goodbye"
    notes:
      "n1": "Said with palms pressed together, to anyone, at any time of day. Also नमस्ते (namaste)."
  "mr-0145":
    native: "you (respectful); you (plural)"
    notes:
      "n1": "Marathi has two words for 'you': तुम्ही (tumhi) for strangers, elders and anyone you respect, and तू (tu) for friends, children and the very close. The verb changes with each. A learner is always safe with तुम्ही (tumhi)."
  "mr-0146":
    native: "How are you? (respectful)"
    notes:
      "n1": "To a friend: कसा आहेस? (kasa ahes?) to a man, कशी आहेस? (kashi ahes?) to a woman."
  "mr-0147":
    native: "I'm fine."
    notes:
      "n1": "Also मी बरा आहे (mi barā āhe) from a man, मी बरी आहे (mi bari āhe) from a woman."
  "mr-0148":
    native: "thank you"
    notes:
      "n1": "Formal. Many people simply say थँक्यू (tham̐kyu), and among family thanks are often left out."
  "mr-0149":
    native: "Thank you; I'm grateful."
    notes:
      "n1": "Warmer than धन्यवाद (dhanyavād): मी तुमचा आभारी आहे (mi tumcā ābhāri āhe), I'm grateful to you; a woman says आभारी (ābhāri) too."
  "mr-0150":
    native: "OK; all right"
    notes:
      "n1": "In speech also बरं (baram̐): बरं (baram̐), येतो (bara, yeto), all right, I'll be off."
  "mr-0151":
    native: "goodbye (said by a man leaving)"
    notes:
      "n1": "Literally 'I come': the one leaving says 'I'll come back'. A woman says येते (yete). A plain जातो (jāto), 'I go', can sound final."
  "mr-0152":
    native: "I don't know Marathi."
    notes:
      "n1": "Literally 'Marathi does not come to me'."
  "mr-0153":
    native: "I'm still learning Marathi."
  "mr-0154":
    native: "Please speak slowly."
    notes:
      "n1": "जरा (jarā), 'a little', softens a request, and the ending -आ (-ā) makes it polite: बसा (basā), please sit."
  "mr-0155":
    native: "Please say that again."
  "mr-0156":
    native: "Sorry; excuse me."
    notes:
      "n1": "Literally 'please forgive'. Also सॉरी (sôri), from English."
  "mr-0157":
    native: "please"
    notes:
      "n1": "Formal and written, on signs and in letters. In speech the polite ending of the verb does the work: पाणी द्या (pāṇi dyā), some water, please."
