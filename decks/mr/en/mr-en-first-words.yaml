description: "The respect Marathi builds into 'you': तुम्ही (tumhi) and तू (tu). Greetings and saying you are still learning are in the phrasebook. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0145":
    native: "you (respectful); you (plural)"
    notes:
      "n1": "Marathi has two words for 'you': तुम्ही (tumhi) for strangers, elders and anyone you respect, and तू (tu) for friends, children and the very close. The verb changes with each. A learner is always safe with तुम्ही (tumhi)."
  "mr-1002":
    native: "well; okay"
    notes:
      "n1": "बरं (baram̐) agrees, or starts a reply: 'well', 'okay'. With मग (mag), 'then', it asks what comes next: बरं, मग? (baram̐, mag?), 'Well, then?'."
    examples:
      "बरं, मग?":
        native: "Well, then?"
        bases:
          "बरं": "well"
          "मग": "then"
      "बरं, ठीक आहे.":
        native: "Well, that's fine."
        bases:
          "बरं": "well"
          "ठीक": "fine"
          "आहे": "is"
  "mr-1003":
    native: "fine; right; okay"
    notes:
      "n1": "ठीक (ṭhik) is 'fine', 'right' or 'correct'. Said with आहे (āhe), 'is', it means 'it is all right'."
    examples:
      "सर्व ठीक आहे.":
        native: "Everything is fine."
        bases:
          "सर्व": "everything"
          "ठीक": "fine"
          "आहे": "is"
      "मी ठीक आहे.":
        native: "I am fine."
        bases:
          "मी": "I"
          "ठीक": "fine"
          "आहे": "am"
