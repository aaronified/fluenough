schema: 1
id: "mr-en-sports"
kind: "layer"
core: "mr-sports"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sports"
description: "Sports and games: cricket, kabaddi and kho-kho, the team and the captain, the match, the score and the winning medal. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-1605":
    native: "cricket"
    notes:
      "n1": "{1} is cricket, a loanword from English, the most popular game in India."
    examples:
      "आम्ही रोज क्रिकेट खेळतो.": "We play cricket every day."
      "क्रिकेटचा सामना टीव्हीवर होता.": { native: "The cricket match was on television.", bases: { "होता": "to be", "क्रिकेटचा": "cricket" } }
  "mr-1606":
    native: "football"
    notes:
      "n1": "{1} is football, a loanword from English."
    examples:
      "मुलं मैदानात फुटबॉल खेळत होती.": { native: "The children were playing football in the playground.", bases: { "होती": "to be" } }
      "फुटबॉलचा बॉल हरवला.": { native: "The football was lost.", bases: { "फुटबॉलचा": "football" } }
  "mr-1607":
    native: "kabaddi"
    notes:
      "n1": "{1} is kabaddi, a traditional team game of Maharashtra and India."
    examples:
      "कबड्डी हा आपला पारंपरिक खेळ आहे.": { native: "Kabaddi is our traditional game.", bases: { "आपला": "our", "खेळ": "game", "आहे": "to be" } }
      "कबड्डीचा सामना जिंकला.": { native: "We won the kabaddi match.", bases: { "कबड्डीचा": "kabaddi" } }
  "mr-1608":
    native: "kho-kho"
    notes:
      "n1": "{1} is kho-kho, a fast team game in which players chase and touch."
    bases:
      "खो": "kho"
    examples:
      "खो-खो मध्ये संघ धावतो.": { native: "In kho-kho the team runs.", bases: { "मध्ये": "in", "खो": "kho" } }
      "खो-खोचा खेळ वेगवान आहे.": { native: "The kho-kho game is fast.", bases: { "खेळ": "game", "वेगवान": "fast", "आहे": "to be", "खो": "kho", "खोचा": "of kho-kho" } }
  "mr-1609":
    native: "hockey"
    notes:
      "n1": "{1} is hockey, a loanword from English."
    examples:
      "हॉकी स्टिक कुठे आहे?": { native: "Where is the hockey stick?", bases: { "स्टिक": "stick", "कुठे": "where", "आहे": "to be" } }
      "तो हॉकी खेळतो.": "He plays hockey."
  "mr-1610":
    native: "badminton"
    notes:
      "n1": "{1} is badminton, a loanword from English."
    examples:
      "बॅडमिंटन कोर्ट मोकळं आहे.": { native: "The badminton court is free.", bases: { "मोकळं": "free", "आहे": "to be", "कोर्ट": "court" } }
      "बहिणीने बॅडमिंटनमध्ये पदक जिंकलं.": { native: "My sister won a medal in badminton.", bases: { "बॅडमिंटनमध्ये": "badminton" } }
  "mr-1611":
    native: "tennis"
    notes:
      "n1": "{1} is tennis, a loanword from English."
    examples:
      "टेनिस खेळायला आवडतं.": "I like to play tennis."
      "टेनिसचा बॉल कुठे आहे?": { native: "Where is the tennis ball?", bases: { "आहे": "to be", "टेनिसचा": "tennis" } }
  "mr-1612":
    native: "team"
    notes:
      "n1": "{1} is a team in a sport."
    examples:
      "आमचा संघ जिंकला.": "Our team won."
      "संघात अकरा खेळाडू असतात.": { native: "A team has eleven players.", bases: { "असतात": "to be", "संघात": "team" } }
  "mr-1613":
    native: "captain"
    notes:
      "n1": "{1} is the captain of a team."
    examples:
      "कर्णधार नाणेफेक जिंकला.": { native: "The captain won the toss.", bases: { "नाणेफेक": "toss" } }
      "कर्णधारानं चांगला खेळ केला.": { native: "The captain played well.", bases: { "खेळ": "game", "कर्णधारानं": "captain" } }
  "mr-1614":
    native: "coach"
    notes:
      "n1": "{1} is a coach who trains players."
    examples:
      "प्रशिक्षक खेळाडूंना शिकवतात.": "The coach teaches the players."
      "प्रशिक्षकाचा सल्ला ऐका.": { native: "Listen to the coach's advice.", bases: { "प्रशिक्षकाचा": "coach" } }
  "mr-1615":
    native: "match"
    notes:
      "n1": "{1} is a match or a contest in a sport."
    examples:
      "सामना उद्या आहे.": { native: "The match is tomorrow.", bases: { "आहे": "to be" } }
      "सामना पाहायला गेलो.": "I went to watch the match."
  "mr-1616":
    native: "goal"
    notes:
      "n1": "{1} is a goal scored in football or hockey."
    examples:
      "त्याने दोन गोल केले.": "He scored two goals."
      "शेवटच्या मिनिटाला गोल झाला.": { native: "A goal was scored in the last minute.", bases: { "शेवटच्या": "last", "झाला": "to become" } }
  "mr-1617":
    native: "run (in cricket)"
    notes:
      "n1": "{1} is a run scored in cricket."
    examples:
      "त्याने शंभर धावा केल्या.": { native: "He scored a hundred runs.", bases: { "धावा": "runs" } }
      "चौकाराने चार धावा मिळाल्या.": { native: "A boundary gave four runs.", bases: { "चौकाराने": "by a boundary", "मिळाल्या": "to get", "धावा": "runs" } }
  "mr-1618":
    native: "ball"
    notes:
      "n1": "{1} is a ball, a loanword from English."
    examples:
      "बॉल जोरात मारला.": { native: "I hit the ball hard.", bases: { "जोरात": "hard", "मारला": "to hit" } }
      "बॉल मैदानाबाहेर गेला.": "The ball went out of the ground."
  "mr-1619":
    native: "bat"
    notes:
      "n1": "{1} is a cricket bat, a loanword from English."
    examples:
      "नवीन बॅट आणली.": { native: "I brought a new bat.", bases: { "नवीन": "new" } }
      "बॅट घेऊन ये.": "Bring the bat."
  "mr-1620":
    native: "winner, champion"
    notes:
      "n1": "{1} is a winner or a champion. The feminine is विजेती (vijetī)."
    examples:
      "विजेत्याला पदक मिळालं.": { native: "The winner got a medal.", bases: { "मिळालं": "to get", "विजेत्याला": "winner, champion" } }
      "ती राज्यस्तरावरची विजेती आहे.": { native: "She is the state-level champion.", bases: { "आहे": "to be", "राज्यस्तरावरची": "state-level", "विजेती": "champion" } }
  "mr-1621":
    native: "defeat"
    notes:
      "n1": "{1} is a defeat, losing a match or a war."
    examples:
      "आमचा पराभव झाला.": { native: "We were defeated.", bases: { "झाला": "to become" } }
      "पराभवातून शिका.": { native: "Learn from defeat.", bases: { "पराभवातून": "defeat" } }
  "mr-1622":
    native: "victory"
    notes:
      "n1": "{1} is a victory, the win in a contest."
    examples:
      "हा मोठा विजय आहे.": { native: "This is a great victory.", bases: { "आहे": "to be" } }
      "विजयाचा आनंद साजरा केला.": { native: "We celebrated the joy of victory.", bases: { "विजयाचा": "victory" } }
  "mr-1623":
    native: "medal"
    notes:
      "n1": "{1} is a medal given to a winner."
    examples:
      "सुवर्णपदक मिळालं.": { native: "I got a gold medal.", bases: { "मिळालं": "to get" } }
      "पदक घेण्यासाठी मंचावर गेला.": { native: "He went on the stage to receive the medal.", bases: { "मंचावर": "on the stage" } }
  "mr-1624":
    native: "gold medal"
    notes:
      "n1": "{1} is a gold medal, the highest prize in a competition."
    examples:
      "तिला सुवर्णपदक मिळालं.": { native: "She got a gold medal.", bases: { "मिळालं": "to get" } }
      "सुवर्णपदक जिंकणं सोपं नाही.": { native: "Winning a gold medal is not easy.", bases: { "नाही": "not" } }
  "mr-1625":
    native: "to practise"
    notes:
      "n1": "{1} is practising a sport or a skill again and again."
    examples:
      "रोज सकाळी सराव करतो.": "I practise every morning."
      "पुढच्या सामन्यासाठी सराव करा.": { native: "Practise for the next match.", bases: { "पुढच्या": "next" } }
  "mr-1626":
    native: "to catch (a ball)"
    notes:
      "n1": "{1} is catching a ball."
    examples:
      "त्याने चेंडू झेलला.": { native: "He caught the ball.", bases: { "झेलला": "to catch (a ball)", "चेंडू": "ball" } }
      "कर्णधाराने झेल सोडला.": { native: "The captain dropped the catch.", bases: { "झेल": "catch" } }
  "mr-1627":
    native: "to throw"
    notes:
      "n1": "{1} is throwing something."
    examples:
      "बॉल जोरात फेका.": { native: "Throw the ball hard.", bases: { "जोरात": "hard", "फेका": "to throw" } }
      "त्याने दगड फेकला.": { native: "He threw a stone.", bases: { "दगड": "stone", "फेकला": "to throw" } }
