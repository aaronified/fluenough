tags: ["unreviewed"]
cards:
  "mr-5219": {"native": "My brother is an engineer.", "bases": {"माझा": "my", "आहे": "is"}, "confusables": {"w1": {"why": "Lawyer, not engineer: वकील (vakil) means lawyer."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one brother takes आहे (āhe)."}}}
  "mr-5220": {"native": "He is a pilot.", "bases": {"आहे": "is"}, "confusables": {"w1": {"why": "She, not he: ती (ti) means she."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one person; one pilot takes आहे (āhe)."}}}
  "mr-5221": {"native": "She has experience.", "bases": {"तिला": "she has", "आहे": "is"}, "confusables": {"w1": {"why": "Skill, not experience: कौशल्य (kauśalya) means skill."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one experience takes आहे (āhe)."}}, "notes": {"n1": "Having experience is said with the dative: तिला (tilā), to her, is the one who has it, and अनुभव (anubhav) is the subject of आहे (āhe)."}}
  "mr-5222": {"native": "The lawyer does good work.", "bases": {"चांगले": "good", "करतो": "does"}, "confusables": {"w1": {"why": "Trader, not lawyer: व्यापारी (vyāpāri) means trader."}, "f1": {"why": "Feminine: करते (karte) is for a feminine subject; वकील (vakil) is masculine, so करतो (karto) is right."}}, "notes": {"n1": "Work is done with काम करणे (kām karṇe), a noun plus करणे (karṇe), to do, meaning 'to work'."}}
  "mr-5223": {"native": "The singer sings songs.", "bases": {"गातो": "sings"}, "confusables": {"w1": {"why": "Performer, not singer: कलाकार (kalākār) means performer or artist."}, "f1": {"why": "Feminine: गाते (gāte) is for a feminine subject; गायक (gāyak) is masculine, so गातो (gāto) is right."}}}
  "mr-5224": {"native": "The player plays on the field.", "bases": {"मैदानात": "on the field", "खेळतो": "plays"}, "confusables": {"w1": {"why": "Trader, not player: व्यापारी (vyāpāri) means trader."}, "f1": {"why": "Feminine: खेळते (kheḷte) is for a feminine subject; खेळाडू (kheḷāḍu) is masculine, so खेळतो (kheḷto) is right."}}}
  "mr-5225": {"native": "The trader is in the shop.", "bases": {"दुकानात": "in the shop", "आहे": "is"}, "confusables": {"w1": {"why": "Craftsman, not trader: कारागीर (kārāgir) means craftsman."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one trader takes आहे (āhe)."}}}
  "mr-5226": {"native": "The craftsman makes items.", "bases": {"वस्तू": "items", "बनवतो": "makes"}, "confusables": {"w1": {"why": "Sculpture, not craftsman: शिल्प (śilp) means sculpture."}, "f1": {"why": "Feminine: बनवते (banvte) is for a feminine subject; कारागीर (kārāgir) is masculine, so बनवतो (banvto) is right."}}}
  "mr-5227": {"native": "Skill and experience are important.", "bases": {"आणि": "and", "महत्त्वाचे": "important", "आहेत": "are"}, "confusables": {"w1": {"why": "Good, not important: चांगला (cāṅgalā) means good."}, "f1": {"why": "Singular: आहे (āhe) is for one thing; skill and experience are two, so आहेत (āhet)."}}}
  "mr-5228": {"native": "He has a degree.", "bases": {"त्याला": "he has", "आहे": "is"}, "confusables": {"w1": {"why": "Engineer, not degree: अभियंता (abhiyantā) means engineer."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one degree takes आहे (āhe)."}}, "notes": {"n1": "Having a degree is said like having experience: त्याला (tyālā), to him, is the one who has it, and पदवी (padvi) is the subject of आहे (āhe)."}}
  "mr-5229": {"native": "She is successful.", "bases": {"आहे": "is"}, "confusables": {"w1": {"why": "He, not she: तो (to) means he."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one person; one woman takes आहे (āhe)."}}}
  "mr-5230": {"native": "Choose your profession.", "bases": {"तुमचा": "your", "निवडा": "choose"}, "confusables": {"w1": {"why": "Degree, not profession: पदवी (padvi) means degree."}, "f1": {"why": "Feminine: निवडते (nivḍte) is for a feminine subject; this is a polite order to you, so निवडा (nivḍā) is right."}}, "notes": {"n1": "निवडा (nivḍā) is the polite command: the stem निवड (nivaḍ) takes -ा (-ā), as करा (karā) does."}}
