schema: 1
id: "mr-en-numbers-1-20"
kind: "layer"
core: "mr-numbers-1-20"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Numbers 1–20"
license: "CC-BY-SA-4.0"
description: "One to twenty. From eleven on, each number is a word of its own, to be learned one at a time. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0252":
    native: "1, one"
    notes:
      "n1": "Marathi has its own digits, १ २ ३ (1 2 3), and uses them more than Hindi does: newspapers, calendars and many signs print them. Prices and bus numbers are often in 1 2 3."
    "examples": {
      "एक लाडू घे.": {"native": "Take a laddoo.", "bases": {"एक": "one", "घे": "to take"}},
      "एक समोसा द्या.": {"native": "Give me a samosa.", "bases": {"एक": "one", "द्या": "to give"}}
    }
  "mr-0253":
    native: "2, two"
    "examples": {
      "दोन गोळ्या घ्या.": {"native": "Take two tablets.", "bases": {"गोळ्या": "tablet, pill"}},
      "दोन तुकडे जोडले.": {"native": "I joined the two pieces.", "bases": {"जोडले": "to join, to connect"}}
    }
  "mr-0254":
    native: "3, three"
    "examples": {
      "कादंबरी वाचायला तीन दिवस लागले.": {"native": "It took three days to read the novel.", "bases": {"लागले": "to take", "तीन": "3, three"}},
      "गाडी प्लॅटफॉर्म नंबर तीनवर येईल.": {"native": "The train will come to platform number three.", "bases": {"प्लॅटफॉर्म": "platform", "तीनवर": "3, three"}}
    }
  "mr-0255":
    native: "4, four"
    notes:
      "n1": "च (ca) before aa is said ts: tsaar."
    "examples": {
      "चौकाराने चार धावा मिळाल्या.": {"native": "A boundary gave four runs.", "bases": {"चौकाराने": "by a boundary", "मिळाल्या": "to get", "धावा": "runs"}},
      "पदवी मिळवायला चार वर्षं लागतात.": {"native": "It takes four years to get a degree.", "bases": {"लागतात": "to take"}}
    }
  "mr-0256":
    native: "5, five"
    notes:
      "n1": "No nasal, unlike Hindi पाँच (pām̐c)."
    "examples": {
      "माझी उंची पाच फूट आहे.": {"native": "My height is five feet.", "bases": {"आहे": "to be", "फूट": "foot, feet"}},
      "खटला पाच वर्षं चालला.": {"native": "The case went on for five years.", "bases": {"चालला": "to go on"}}
    }
  "mr-0257":
    native: "6, six"
    "examples": {
      "भारतात सहा ऋतू आहेत.": {"native": "India has six seasons.", "bases": {"आहेत": "to be", "भारतात": "in India"}},
      "तो सहा महिने बेरोजगार होता.": {"native": "He was unemployed for six months.", "bases": {"होता": "to be"}}
    }
  "mr-0258":
    native: "7, seven"
    "examples": {
      "आम्ही सात वाजता पोहोचलो.": {"native": "We arrived at seven o'clock.", "bases": {"वाजता": "at", "पोहोचलो": "to reach, to arrive"}},
      "इंद्रधनुष्यात सात रंग असतात.": {"native": "A rainbow has seven colours.", "bases": {"असतात": "to be", "इंद्रधनुष्यात": "in a rainbow", "रंग": "colours"}}
    }
  "mr-0259":
    native: "8, eight"
    "examples": {
      "रात्री आठ तास झोप घ्या.": {"native": "Sleep eight hours at night.", "bases": {}}
    }
  "mr-0260":
    native: "9, nine"
    "examples": {
      "कार्यालय सकाळी नऊला उघडतं.": {"native": "The office opens at nine in the morning.", "bases": {"नऊला": "9, nine"}},
      "रात्री नऊ वाजता बातमीपत्र असतं.": {"native": "The news bulletin is at nine at night.", "bases": {"वाजता": "at", "असतं": "to be"}}
    }
  "mr-0261":
    native: "10, ten"
    "examples": {
      "दहा अंशांनी तापमान घटलं.": {"native": "The temperature fell by ten degrees.", "bases": {"घटलं": "to fall", "अंशांनी": "degree (of temperature)"}},
      "मधली सुट्टी दहा मिनिटांची आहे.": {"native": "The break is ten minutes long.", "bases": {"आहे": "to be", "मधली": "middle"}}
    }
  "mr-0262":
    native: "11, eleven"
    "examples": {
      "भाडेकरार अकरा महिन्यांचा आहे.": {"native": "The rent agreement is for eleven months.", "bases": {"आहे": "to be", "भाडेकरार": "rent agreement", "अकरा": "11, eleven"}},
      "संघात अकरा खेळाडू असतात.": {"native": "A team has eleven players.", "bases": {"असतात": "to be", "संघात": "team", "अकरा": "11, eleven"}}
    }
  "mr-0263":
    native: "12, twelve"
    notes:
      "n1": "Also noon or midnight on the clock: बारा वाजता (bārā vājtā), at twelve."
    "examples": {
      "माझा टोकन नंबर बारा आहे.": {"native": "My token number is twelve.", "bases": {"आहे": "to be"}}
    }
  "mr-0264":
    native: "13, thirteen"
  "mr-0265":
    native: "14, fourteen"
  "mr-0266":
    native: "15, fifteen"
    "examples": {
      "पंधरा टक्के सवलत आहे.": {"native": "There is a fifteen percent discount.", "bases": {"आहे": "to be", "टक्के": "percent"}}
    }
  "mr-0267":
    native: "16, sixteen"
    notes:
      "n1": "With the curled-back ळ (ḷa)."
  "mr-0268":
    native: "17, seventeen"
  "mr-0269":
    native: "18, eighteen"
  "mr-0270":
    native: "19, nineteen"
    notes:
      "n1": "'One less than twenty': एकोण- (ekoṇ-) comes before 20, 30 and every ten after, up to 90: एकोणतीस (29), एकोणनव्वद (89)."
  "mr-0271":
    native: "20, twenty"
    "examples": {
      "पाण्याचं तापमान वीस अंश आहे.": {"native": "The water's temperature is twenty degrees.", "bases": {"आहे": "to be", "पाण्याचं": "of water"}}
    }
