id: "mr-en-grammar-compound-verbs"
kind: "layer"
core: "mr-grammar-compound-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs that add a shade"
license: "CC0-1.0"
description: "The first verb in -ऊन (-un), 'having done', and a second verb after it that adds a shade: done for good, done for oneself, done for someone, kept for later. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0549":
    native: "Eat it up. (to a friend)"
    notes:
      "n1": "टाकणे (ṭākṇe), 'to throw', after a verb in -ऊन (-un): done completely, done with. To someone you call तुम्ही (tumhi): खाऊन टाका (khāun ṭākā)."
  "mr-0550":
    native: "I clean forgot. (a man speaking)"
    notes:
      "n1": "जाणे (jāṇe), 'to go', after -ऊन (-un): something that happened to you, all the way. A woman says गेले (gele)."
  "mr-0551":
    native: "Write it down (for later)."
    notes:
      "n1": "ठेवणे (ṭhevṇe), 'to keep, to put': done and kept for later."
  "mr-0552":
    native: "Please try to understand."
    notes:
      "n1": "घेणे (gheṇe), 'to take': done for oneself, taken in."
  "mr-0553":
    native: "Please do it for me."
    notes:
      "n1": "देणे (deṇe), 'to give': done for someone else."
  "mr-0554":
    native: "Please bring it."
    notes:
      "n1": "'Take and come': Marathi brings things this way. पाणी घेऊन ये (pāṇi gheun ye), bring some water, to a friend."
  "mr-0555":
    native: "Take it away; take it with you."
    notes:
      "n1": "'Take and go'."
  "mr-0556":
    native: "He fell asleep."
    notes:
      "n1": "'He went to sleep': जाणे (jāṇe) for a change that comes over you."
  "mr-0557":
    native: "He left; he went away."
    notes:
      "n1": "निघणे (nighṇe) is 'to set out'. Leaving, people say चला (calā), निघतो (chala, nighto), right, I'm off."
