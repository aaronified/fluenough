schema: 1
id: "mr-en-work"
kind: "layer"
core: "mr-work"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Work"
license: "CC0-1.0"
description: "Jobs, the workplace, and how to ask and say what someone does. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0234":
    native: "work; a job; a task"
    notes:
      "n1": "मी कामावर जातो (mi kāmāvar jāto), I'm going to work: 'onto work'."
  "mr-0235":
    native: "job; employment"
    notes:
      "n1": "A salaried job: मी नोकरी करतो (mi nokri karto), I have a job."
  "mr-0236":
    native: "office"
    notes:
      "n1": "Formally कार्यालय (kāryālay), as on signs."
  "mr-0237":
    native: "teacher (a man)"
    notes:
      "n1": "A woman teacher is a शिक्षिका (śikṣikā). Pupils call a teacher सर (sar) or मॅडम (mêḍam), or ताई (tāi) and दादा (dādā) in a village school."
  "mr-0238":
    native: "doctor"
    notes:
      "n1": "For a woman too: डॉक्टर आल्या (ḍôkṭar ālyā), the doctor (she) has come, in the respectful plural."
  "mr-0239":
    native: "farmer"
    notes:
      "n1": "From शेत (śet), a field."
  "mr-0240":
    native: "shopkeeper"
  "mr-0241":
    native: "driver"
    notes:
      "n1": "Marathi writes English v as व्ह (vh): ड्रायव्हर (ḍrāyvar). It is said with a plain v."
  "mr-0242":
    native: "engineer"
  "mr-0243":
    native: "salary; wages"
    notes:
      "n1": "From Portuguese pagar, to pay."
  "mr-0244":
    native: "holiday; a day off"
    notes:
      "n1": "आज सुट्टी आहे (āj suṭṭi āhe), it's a holiday today."
  "mr-0245":
    native: "meeting"
    notes:
      "n1": "Formally बैठक (baiṭhak)."
  "mr-0246":
    native: "What do you do?"
    notes:
      "n1": "'What work do you do?'"
  "mr-0247":
    native: "I'm a teacher. (a man speaking)"
    notes:
      "n1": "No 'a': 'I teacher am'."
  "mr-0248":
    native: "student (a man)"
    notes:
      "n1": "A woman student: विद्यार्थिनी (vidyārthini)."
  "mr-0249":
    native: "company; firm"
  "mr-0250":
    native: "business; profession"
    notes:
      "n1": "माझा स्वतःचा व्यवसाय आहे (mājhā svataḥcā vyavsāy āhe), I have my own business."
  "mr-0251":
    native: "owner; boss"
