schema: 1
id: "mr-en-work"
kind: "layer"
core: "mr-work"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Work"
license: "CC-BY-SA-4.0"
description: "Jobs, the workplace, and how to ask and say what someone does. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0234":
    native: "work; a job; a task"
    notes:
      "n1": "मी कामावर जातो (mi kāmāvar jāto), I'm going to work: 'onto work'."
    "examples": {
      "कामाचा ताण वाढला.": {"native": "The stress of work increased.", "bases": {"कामाचा": "work; a job; a task"}},
      "राष्ट्रासाठी काम करा.": {"native": "Work for the nation.", "bases": {"राष्ट्रासाठी": "nation"}}
    }
  "mr-0235":
    native: "job; employment"
    notes:
      "n1": "A salaried job: मी नोकरी करतो (mi nokri karto), I have a job."
    "examples": {
      "नोकरीसाठी अर्ज पाठवला.": {"native": "I sent an application for the job.", "bases": {"नोकरीसाठी": "job; employment"}},
      "मी नोकरीसाठी अर्ज केला.": {"native": "I applied for the job.", "bases": {"नोकरीसाठी": "job; employment"}}
    }
  "mr-0236":
    native: "office"
    notes:
      "n1": "Formally कार्यालय (kāryālay), as on signs."
    "examples": {
      "बॉस ऑफिसमध्ये आहेत.": {"native": "The boss is in the office.", "bases": {"आहेत": "to be", "ऑफिसमध्ये": "office"}},
      "अधिकारी ऑफिसमध्ये आहेत.": {"native": "The officer is in the office.", "bases": {"आहेत": "to be", "ऑफिसमध्ये": "office"}}
    }
  "mr-0237":
    native: "teacher (a man)"
    notes:
      "n1": "A woman teacher is a शिक्षिका (śikṣikā). Pupils call a teacher सर (sar) or मॅडम (mêḍam), or ताई (tāi) and दादा (dādā) in a village school."
    "examples": {
      "मी शिक्षक आहे.": {"native": "I'm a teacher. (a man speaking)", "bases": {"आहे": "to be"}},
      "शिक्षकांना प्रश्न विचारा.": {"native": "Ask the teacher a question.", "bases": {"प्रश्न": "question", "विचारा": "to ask", "शिक्षकांना": "teacher (a man)"}}
    }
  "mr-0238":
    native: "doctor"
    notes:
      "n1": "For a woman too: डॉक्टर आल्या (ḍôkṭar ālyā), the doctor (she) has come, in the respectful plural."
    "examples": {
      "डॉक्टरांनी तपासणी केली.": {"native": "The doctor did an examination.", "bases": {"डॉक्टरांनी": "doctor"}},
      "आजी मुलाला डॉक्टरकडे नेते.": {"native": "Grandmother takes the child to the doctor.", "bases": {"नेते": "to take away", "डॉक्टरकडे": "doctor"}}
    }
  "mr-0239":
    native: "farmer"
    notes:
      "n1": "From शेत (śet), a field."
    "examples": {
      "शेतकरी बी पेरतो.": {"native": "The farmer sows seeds.", "bases": {"पेरतो": "to sow"}},
      "शेतकरी मेहनती असतात.": {"native": "Farmers are hard-working.", "bases": {"असतात": "to be", "शेतकरी": "farmer"}}
    }
  "mr-0240":
    native: "shopkeeper"
  "mr-0241":
    native: "driver"
    notes:
      "n1": "Marathi writes English v as व्ह (vh): ड्रायव्हर (ḍrāyvar). It is said with a plain v."
  "mr-0242":
    native: "engineer"
  "mr-0243":
    native: "salary; wages"
    notes:
      "n1": "From Portuguese pagar, to pay."
    "examples": {
      "कामगारांना पगार दिला.": {"native": "The workers were paid.", "bases": {"कामगारांना": "worker, labourer", "पगार": "salary; wages"}},
      "कुशल कामगारांना जास्त पगार मिळतो.": {"native": "Skilled workers get more salary.", "bases": {"जास्त": "more", "मिळतो": "to get", "पगार": "salary; wages"}}
    }
  "mr-0244":
    native: "holiday; a day off"
    notes:
      "n1": "आज सुट्टी आहे (āj suṭṭi āhe), it's a holiday today."
    "examples": {
      "मधल्या सुट्टीत खेळलो.": {"native": "I played during the break.", "bases": {"मधल्या": "during the", "सुट्टीत": "holiday; a day off"}},
      "नाताळच्या सुट्टीत गावी जाऊ.": {"native": "Let's go to the village in the Christmas holidays.", "bases": {"नाताळच्या": "Christmas", "सुट्टीत": "holiday; a day off"}}
    }
  "mr-0245":
    native: "meeting"
    notes:
      "n1": "Formally बैठक (baiṭhak)."
    "examples": {
      "कार्यालयात मीटिंग आहे.": {"native": "There is a meeting in the office.", "bases": {"आहे": "to be", "कार्यालयात": "office"}}
    }
  "mr-0246":
    native: "What do you do?"
    notes:
      "n1": "'What work do you do?'"
    bases:
      "करता": "to do; to make"
  "mr-0247":
    native: "I'm a teacher. (a man speaking)"
    notes:
      "n1": "No 'a': 'I teacher am'. असणे (asṇe) changes its stem in the present: आह- (āh-)."
    bases:
      "आहे": "to be"
  "mr-0248":
    native: "student (a man)"
    notes:
      "n1": "A woman student: विद्यार्थिनी (vidyārthini)."
    "examples": {
      "मी विद्यार्थी आहे.": {"native": "I am a student.", "bases": {"आहे": "to be"}},
      "सगळे विद्यार्थी उत्तीर्ण झाले.": {"native": "All the students passed.", "bases": {"झाले": "to become", "उत्तीर्ण": "passed", "विद्यार्थी": "student (a man)"}}
    }
  "mr-0249":
    native: "company; firm"
  "mr-0250":
    native: "business; profession"
    notes:
      "n1": "माझा स्वतःचा व्यवसाय आहे (mājhā svataḥcā vyavsāy āhe), I have my own business."
    "examples": {
      "तो व्यवसायात यशस्वी झाला.": {"native": "He succeeded in business.", "bases": {"झाला": "to become", "व्यवसायात": "business; profession"}},
      "या व्यवसायात तोटा झाला.": {"native": "This business made a loss.", "bases": {"झाला": "to become", "व्यवसायात": "business; profession"}}
    }
  "mr-0251":
    native: "owner; boss"
