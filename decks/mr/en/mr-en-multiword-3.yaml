schema: 1
id: "mr-en-multiword-3"
kind: "layer"
core: "mr-multiword-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: compound verbs"
description: "Nine verb phrases in which one verb is joined to a helper verb such as देणे (deṇe), घेणे (gheṇe) or दाखवणे (dākhvṇe), as in सोडून (soḍun) देणे (deṇe), to give up. Six are from Wiktionary and three are proverbs from Wikiquote. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "mr-4385":
    native: "to do for"
    notes:
      "u1": "Example from Wiktionary: माझ्यासाठी (mājhyāsāṭhi) करून (karun) दे (de)."
  "mr-4386":
    native: "to give up, quit"
    notes:
      "u1": "Example from Wiktionary: नितीनने (nitinne) त्याची (tyāci) नोकरी (nokri) सोडून (soḍun) दिली (dili)."
  "mr-4387":
    native: "to leave"
    notes:
      "u1": "Example from Wiktionary: नितीन (nitin) भारत (bhārat) सोडून (soḍun) गेला (gelā)."
  "mr-4388":
    native: "to get acquainted"
    notes:
      "u1": "The noun ओळख (oḷakh) with करून (karun) घेणे (gheṇe). Wiktionary gives no example for this phrase."
  "mr-4389":
    native: "to introduce"
    notes:
      "u1": "The noun ओळख (oḷakh) with करून (karun) देणे (deṇe). Wiktionary gives no example for this phrase."
  "mr-4390":
    native: "to misunderstand"
    notes:
      "u1": "Example from Wiktionary: गोष्टींचा (goṣṭiñcā) गैरसमज (gairsmaj) करून (karun) घेण्याची (gheṇyāci) त्याची (tyāci) प्रवृत्ती (pravrutti) आहे (āhe), which the page translates as 'He has a tendency to misunderstand things.'"
  "mr-4391":
    native: "to show by doing"
    notes:
      "u1": "From the proverb करून (karun) दाखवावें (dākhvāvem̐), बोलून (bolun) दाखवू (dākhvu) नये (naye)."
  "mr-4392":
    native: "to say aloud"
    notes:
      "u1": "From the proverb करून (karun) दाखवावें (dākhvāvem̐), बोलून (bolun) दाखवू (dākhvu) नये (naye), the same saying as करून (karun) दाखवणे (dākhvṇe)."
  "mr-4393":
    native: "to hear (someone) out"
    notes:
      "u1": "From the proverb ऐकून (aikun) घेत (ghet) नाही (nāhi), त्याला (tyālā) सांगू (sāṅgu) नये (naye) काही (kāhi)."
