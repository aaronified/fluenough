schema: 1
id: "mr-en-careers"
kind: "layer"
core: "mr-careers"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Careers"
description: "Jobs and professions: engineers, lawyers and artists, the skills and training to get them, and what makes a career succeed. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-1462":
    native: "career"
    notes:
      "n1": "{1} is a career, the work a person does over many years, a loanword from English."
    examples:
      "माझं करिअर आता सुरू झालं.": { native: "My career has now started.", bases: { "सुरू": "started", "झालं": "to become" } }
      "करिअरसाठी चांगलं शिक्षण हवं.": { native: "A good education is needed for a career.", bases: { "शिक्षण": "education", "करिअरसाठी": "career" } }
  "mr-1463":
    native: "profession, occupation"
    notes:
      "n1": "{1} is a profession, a word for the work one does to earn a living."
    examples:
      "तुमचा पेशा काय आहे?": { native: "What is your profession?", bases: { "आहे": "to be" } }
      "आमचा पेशा शेती आहे.": { native: "Our occupation is farming.", bases: { "आहे": "to be" } }
  "mr-1464":
    native: "skill"
    notes:
      "n1": "{1} is a skill, a practised ability."
    examples:
      "त्याच्याकडे चांगलं कौशल्य आहे.": { native: "He has a good skill.", bases: { "आहे": "to be" } }
      "नवीन कौशल्य शिकायला वेळ लागतो.": { native: "It takes time to learn a new skill.", bases: { "नवीन": "new", "लागतो": "to take" } }
  "mr-1465":
    native: "experience"
    notes:
      "n1": "{1} is experience, what one has learnt by doing a thing."
    examples:
      "मला या कामाचा अनुभव आहे.": { native: "I have experience in this work.", bases: { "आहे": "to be" } }
      "अनुभवाने शिकतो.": { native: "One learns through experience.", bases: { "अनुभवाने": "through experience" } }
  "mr-1466":
    native: "degree (academic)"
    notes:
      "n1": "{1} is an academic degree from a college or university."
    examples:
      "तिने इंजिनिअरिंगची पदवी घेतली.": { native: "She took an engineering degree.", bases: { "इंजिनिअरिंगची": "of engineering" } }
      "पदवी मिळवायला चार वर्षं लागतात.": { native: "It takes four years to get a degree.", bases: { "लागतात": "to take" } }
  "mr-1467":
    native: "engineer"
    notes:
      "n1": "{1} is an engineer."
    examples:
      "अभियंता पूल बांधतो.": { native: "The engineer builds the bridge.", bases: { "बांधतो": "to build" } }
      "माझा भाऊ अभियंता आहे.": { native: "My brother is an engineer.", bases: { "आहे": "to be" } }
  "mr-1468":
    native: "lawyer, advocate"
    notes:
      "n1": "{1} is a lawyer."
    examples:
      "वकील न्यायालयात बोलले.": "The lawyer spoke in court."
      "वकिलांची फी जास्त आहे.": { native: "The lawyer's fee is high.", bases: { "फी": "fee", "जास्त": "high", "आहे": "to be", "वकिलांची": "lawyer, advocate" } }
  "mr-1469":
    native: "pilot"
    notes:
      "n1": "{1} is a pilot who flies an aeroplane, a loanword from English."
    examples:
      "पायलट विमान उडवतो.": { native: "The pilot flies the plane.", bases: { "उडवतो": "to fly" } }
      "माझा मित्र पायलट आहे.": { native: "My friend is a pilot.", bases: { "आहे": "to be" } }
  "mr-1470":
    native: "artist, performer"
    notes:
      "n1": "{1} is an artist or a performer."
    examples:
      "कलाकारांनी सुंदर नाच केला.": { native: "The artists danced beautifully.", bases: { "कलाकारांनी": "artist, performer" } }
      "ती चांगली कलाकार आहे.": { native: "She is a good artist.", bases: { "आहे": "to be" } }
  "mr-1471":
    native: "singer"
    notes:
      "n1": "{1} is a male singer. A female singer is गायिका (gāyikā)."
    examples:
      "गायक छान गातो.": { native: "The singer sings nicely.", bases: { "गातो": "to sing" } }
      "गायकाला पुरस्कार मिळाला.": { native: "The singer got an award.", bases: { "पुरस्कार": "award", "मिळाला": "to get", "गायकाला": "singer" } }
  "mr-1472":
    native: "writer, author"
    notes:
      "n1": "{1} is a writer or an author. A woman writer is लेखिका (lekhikā)."
    examples:
      "लेखक नवीन कादंबरी लिहितो.": { native: "The writer writes a new novel.", bases: { "नवीन": "new" } }
      "लेखकाची पुस्तकं प्रसिद्ध आहेत.": { native: "The writer's books are famous.", bases: { "प्रसिद्ध": "famous", "आहेत": "to be", "लेखकाची": "writer, author" } }
  "mr-1473":
    native: "player, sportsperson"
    notes:
      "n1": "{1} is a sportsperson, a player in a game."
    examples:
      "खेळाडू मैदानात उतरले.": "The players came onto the field."
      "तो चांगला खेळाडू आहे.": { native: "He is a good player.", bases: { "आहे": "to be" } }
  "mr-1474":
    native: "merchant, trader"
    notes:
      "n1": "{1} is a merchant or a trader."
    examples:
      "व्यापारी दुकानात बसलेला होता.": { native: "The merchant was sitting in the shop.", bases: { "बसलेला": "sitting", "होता": "to be" } }
      "व्यापाऱ्याने वजन केलं.": { native: "The merchant weighed it.", bases: { "वजन": "weight", "व्यापाऱ्याने": "merchant, trader" } }
  "mr-1475":
    native: "craftsman, artisan"
    notes:
      "n1": "{1} is a skilled craftsman who makes things by hand."
    examples:
      "कारागीर सुंदर भांडी बनवतो.": "The craftsman makes beautiful pots."
      "कारागिराचं काम कौतुकास्पद आहे.": { native: "The craftsman's work is praiseworthy.", bases: { "आहे": "to be", "कारागिराचं": "craftsman, artisan", "कौतुकास्पद": "praiseworthy" } }
  "mr-1476":
    native: "training"
    notes:
      "n1": "{1} is training, learning a job or skill from others."
    examples:
      "नवीन कर्मचाऱ्यांना प्रशिक्षण दिलं.": { native: "New staff were given training.", bases: { "नवीन": "new" } }
      "प्रशिक्षणासाठी शहरात गेलो.": { native: "I went to the city for training.", bases: { "शहरात": "to the city", "प्रशिक्षणासाठी": "training" } }
  "mr-1477":
    native: "opportunity"
    notes:
      "n1": "{1} is an opportunity, a chance to do something."
    examples:
      "ही चांगली संधी आहे.": { native: "This is a good opportunity.", bases: { "आहे": "to be" } }
      "संधी सोडू नका.": "Do not miss the chance."
  "mr-1478":
    native: "successful"
    notes:
      "n1": "{1} describes someone or something successful."
    examples:
      "तो यशस्वी व्यापारी आहे.": { native: "He is a successful merchant.", bases: { "आहे": "to be" } }
      "कार्यक्रम यशस्वी झाला.": { native: "The programme was successful.", bases: { "कार्यक्रम": "programme", "झाला": "to become" } }
  "mr-1479":
    native: "skilled, expert"
    notes:
      "n1": "{1} describes someone who is skilled at work."
    examples:
      "ती कुशल शिवणकाम करते.": { native: "She is skilled at sewing.", bases: { "शिवणकाम": "sewing" } }
      "कुशल कामगारांना जास्त पगार मिळतो.": { native: "Skilled workers get more salary.", bases: { "जास्त": "more", "मिळतो": "to get" } }
  "mr-1480":
    native: "to choose, to select"
    notes:
      "n1": "{1} is choosing one thing from several."
    examples:
      "मी शिक्षण क्षेत्र निवडलं.": { native: "I chose the field of teaching.", bases: { "क्षेत्र": "field", "निवडलं": "to choose, to select", "शिक्षण": "education" } }
      "कोणता पर्याय निवडशील?": { native: "Which option will you choose?", bases: { "पर्याय": "option", "निवडशील": "to choose, to select" } }
  "mr-1481":
    native: "to succeed"
    notes:
      "n1": "{1} is succeeding at a plan or a career."
    bases:
      "होणे": "to be; to become"
    examples:
      "तो व्यवसायात यशस्वी झाला.": { native: "He succeeded in business.", bases: { "झाला": "to become" } }
      "मेहनतीने माणूस यशस्वी होतो.": { native: "Through hard work a person succeeds.", bases: { "मेहनतीने": "through hard work", "होतो": "to become" } }
