cards:
  "mr-5664":
    native: "I eat poha for breakfast."
    bases: { "नाश्त्याला": "for breakfast", "खातो": "eat" }
    confusables: { "w1": { why: "Rice, not poha: भात (bhāt) is cooked rice." }, "f1": { why: "Past: खाल्ला (khāllā) means ate, not eat." } }
    notes: { "n1": "For breakfast is नाश्त्याला (nāśtyālā): नाश्ता (nāśtā), breakfast, takes the oblique form नाश्त्या (nāśtyā) before -ला (-lā) for a meal or time." }
  "mr-5665":
    native: "I like puri."
    bases: { "मला": "to me", "आवडते": "like" }
    confusables: { "w1": { why: "I, not to me: मी (mi) means I, and मला (malā) means to me." }, "f1": { why: "Masculine: आवडतो (āvaḍto) is for a masculine thing; पुरी (puri) is feminine." } }
    notes: { "n1": "Liking is said with मला (malā), to me, and आवडते (āvaḍte) agrees with the liked thing, the feminine पुरी (puri)." }
  "mr-5666":
    native: "I like vada pav."
    bases: { "मला": "to me", "आवडतो": "like" }
    confusables: { "w1": { why: "I, not to me: मी (mi) means I, and मला (malā) means to me." }, "f1": { why: "Feminine: आवडते (āvaḍte) agrees with a feminine thing; वडापाव (vaḍāpāv) is masculine." } }
    notes: { "n1": "Liking is said with मला (malā), to me: the liked thing is the subject, so आवडतो (āvaḍto) agrees with the masculine वडापाव (vaḍāpāv)." }
  "mr-5667":
    native: "I want to drink lassi."
    bases: { "मला": "to me", "प्यायची": "to drink", "आहे": "is" }
    confusables: { "w1": { why: "Tea, not lassi: चहा (cahā) is tea." }, "f1": { why: "Present: पितो (pito) is the present; प्यायची (pyāyaci) आहे (āhe) means want to drink." } }
    notes: { "n1": "Want to drink is प्यायची (pyāyaci) आहे (āhe): the verb takes -यची (-yacī), which agrees with the feminine लस्सी (lassi), lassi." }
  "mr-5668":
    native: "I do not like rice."
    bases: { "मला": "to me", "आवडत": "like" }
    confusables: { "w1": { why: "I, not to me: मी (mi) means I, and मला (malā) means to me." }, "f1": { why: "Feminine: आवडते (āvaḍte) is for a feminine thing; भात (bhāt) is masculine." } }
    notes: { "n1": "Don't like is आवडत (āvaḍat) नाही (nāhi): the verb stem with -त (-t) is followed by नाही (nāhi), 'not'." }
  "mr-5669":
    native: "Give me the bill."
    bases: { "मला": "to me", "द्या": "give" }
    confusables: { "w1": { why: "Take, not give: घ्या (ghyā) means take." }, "f1": { why: "Past: दिले (dile) is the past; the sentence is an order." } }
    notes: { "n1": "Give me the bill is मला (malā) बिल (bil) द्या (dyā): मला (malā), to me, is the receiver, and द्या (dyā) is the polite command of देणे (deṇe)." }
  "mr-5670":
    native: "I like the thali."
    bases: { "मला": "to me", "आवडते": "like" }
    confusables: { "w1": { why: "I, not to me: मी (mi) means I, and मला (malā) means to me." }, "f1": { why: "Masculine: आवडतो (āvaḍto) is for a masculine thing; थाळी (thāḷi) is feminine." } }
  "mr-5671":
    native: "I am vegetarian."
    bases: { "आहे": "am" }
    confusables: { "w1": { why: "Non-vegetarian: मांसाहारी (māṁsāhāri) is the opposite." }, "f1": { why: "Plural: आहेत (āhet) is for several people; this is one speaker." } }
  "mr-5672":
    native: "Eat the fritters."
    bases: { "खा": "eat" }
    confusables: { "w1": { why: "Drink, not eat: पी (pi) means drink." }, "f1": { why: "Past: खाल्ली (khālli) is the past; the sentence is a command." } }
    notes: { "n1": "Eat is खा (khā) for a friend and for a polite listener alike, since the course's imperative table gives the same form for खाणे (khāṇe)." }
  "mr-5673":
    native: "Eat curd rice."
    bases: { "खा": "eat" }
    confusables: { "w1": { why: "Tea, not curd rice: चहा (cahā) is tea." }, "f1": { why: "Past: खाल्ला (khāllā) is the past; खा (khā) is the order to eat." } }
  "mr-5674":
    native: "Is this vegetarian?"
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "Non-vegetarian: मांसाहारी (māṁsāhāri) is the opposite." }, "f1": { why: "Plural: आहेत (āhet) is for several things; हे (he) with one thing takes आहे (āhe)." } }
