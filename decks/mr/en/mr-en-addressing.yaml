schema: 1
id: "mr-en-addressing"
kind: "layer"
core: "mr-addressing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Addressing people"
license: "CC0-1.0"
description: "What to call a shopkeeper, a driver or an older woman: Marathi speakers address strangers as family, and call out with अहो (aho), अरे (are) and अगं (agam̐). Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0145":
    notes:
      "n1": "The safe 'you' for anyone you don't know well. Its verb takes the plural: तुम्ही कुठे जाता? (tumhi kuthe jata?), where are you going?"
  "mr-0137":
    notes:
      "n1": "In formal speech, to a guest or in a speech, आपण (āpaṇ) is the most polite 'you': आपण कुठून आलात? (apan kuthun alat?), where have you come from?"
  "mr-0192":
    native: "elder brother; a young man"
    notes:
      "n1": "Any young man about your age or a little older: a driver, a waiter, a shopkeeper. Also after a name: सुनीलदादा (sunildādā)."
  "mr-0193":
    native: "elder sister; a young woman"
    notes:
      "n1": "Any young woman about your age or a little older. Also after a name: सुनीताताई (sunitātāi)."
  "mr-0194":
    native: "uncle (father's brother); an older man"
    notes:
      "n1": "Any man of your parents' age: a shopkeeper, a neighbour, a rickshaw driver."
  "mr-0195":
    native: "aunt (father's brother's wife); an older woman"
    notes:
      "n1": "Any woman of your parents' age."
  "mr-0196":
    native: "aunt (mother's sister); a woman who helps at home"
    notes:
      "n1": "Also what many families call a woman who cooks or cleans for them, as a sign of respect."
  "mr-0197":
    native: "grandmother; an old woman"
  "mr-0198":
    native: "grandfather; an old man"
  "mr-0199":
    native: "sir"
    notes:
      "n1": "To an official, a boss or a customer. Also after a surname: पाटीलसाहेब (pāṭilsāheb)."
  "mr-0200":
    native: "excuse me; hello there (respectful)"
    notes:
      "n1": "The polite way to get anyone's attention: अहो (aho), ऐका! (aho, aika!), excuse me, listen! Traditionally also how a wife calls her husband."
  "mr-0201":
    native: "hey (to a man or boy you know well)"
    notes:
      "n1": "Familiar: to a friend, a younger brother, a child. Used with तू (tu)."
  "mr-0202":
    native: "hey (to a woman or girl you know well)"
    notes:
      "n1": "The familiar call to a woman, used with तू (tu). Also written अग (ag)."
  "mr-0203":
    native: "madam"
    notes:
      "n1": "To a teacher, an official or a woman in an office. Its partner is सर (sar), sir."
