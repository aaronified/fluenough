# Layer for mr-culture-1: each passage's English rendering (the builder's own) and a note on where it is printed.
schema: 1
id: "mr-en-culture-1"
kind: "layer"
core: "mr-culture-1"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: sant poets"
description: "Short passages of Marathi devotional verse by Dnyaneshwar, Tukaram and Samarth Ramdas, each with its English rendering and a note. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-4000":
    native: "I bow to the elephant-faced one, who is happiness and the abode of happiness."
    notes:
      "n1": "The opening lines of the Savai poem, after the prose note that introduces the form, as printed on mr.wikisource."
  "mr-4001":
    native: "A great mountain of resolve, a support to many people."
    notes:
      "n1": "The first stanza of the poem Nishchayacha Mahameru, as printed on mr.wikisource."
  "mr-4002":
    native: "For the one in whom heaps of kindness to others arise in abundance."
    notes:
      "n1": "A later stanza of the poem Nishchayacha Mahameru, as printed on mr.wikisource."
  "mr-4003":
    native: "Always be alert; never be distracted or unsettled."
    notes:
      "n1": "The first two lines of verse 1 of the poem Shivrajas Athavave, as printed on mr.wikisource."
  "mr-4004":
    native: "Give up some harshness and hold on to some gentleness."
    notes:
      "n1": "The first two lines of verse 2 of the poem Shivrajas Athavave, as printed on mr.wikisource."
  "mr-4005":
    native: "Day after day I have burned with remorse, O King Rama; O most compassionate one, dissolve the delusion of this world."
    notes:
      "n1": "The opening of the Karunashtake, a set of prayers by Ramdas, as printed on mr.wikisource."
  "mr-4006":
    native: "Listeners, be at peace; now I will tell you of the excellent qualities."
    notes:
      "n1": "The opening verse of Uttam Gun, Ramdas's list of good conduct, as printed on mr.wikisource."
  "mr-4007":
    native: "O mind, good mind, walk only the path of devotion, and you will naturally attain Sri Hari."
    notes:
      "n1": "The first couplet of verse 2 of the Manache Shlok, as printed on mr.wikisource."
  "mr-4008":
    native: "O mind, give up sinful intentions, and hold true intentions in your heart."
    notes:
      "n1": "The first couplet of verse 5 of the Manache Shlok, as printed on mr.wikisource."
  "mr-4009":
    native: "Do not walk a road without asking the way; do not eat a fruit without knowing what it is."
    notes:
      "n1": "Verse 2 of Uttam Gun, as printed on mr.wikisource."
  "mr-4010":
    native: "That beautiful form stands on the brick, with its hands placed on its hips."
    notes:
      "n1": "The first stanza of abhang 2 in the opening section of the Gatha, as printed on mr.wikisource."
  "mr-4011":
    native: "He who is the lord of the ganas and of all virtues is the root and the start of the one without qualities."
    notes:
      "n1": "The opening couplet of verse 1 of the 205 Manache Shlok, as printed on mr.wikisource."
  "mr-4012":
    native: "In the morning the mind should keep thinking of Rama, and the speech should first utter the name of Rama."
    notes:
      "n1": "The first couplet of verse 3 of the Manache Shlok, as printed on mr.wikisource."
  "mr-4013":
    native: "When the body is given up, let fame remain behind; O good mind, hold to this very action."
    notes:
      "n1": "The first couplet of verse 8 of the Manache Shlok, as printed on mr.wikisource."
  "mr-4014":
    native: "O Rama, my whole life has passed without devotion, and I wasted it in pursuit of self-interest in kin, people and wealth."
    notes:
      "n1": "The first couplet of verse 2 of the Karunashtake, as printed on mr.wikisource."
  "mr-4015":
    native: "O god, you are Ganesha, the light of all understanding; says Nivritti's servant, please listen."
    notes:
      "n1": "The second verse of the first chapter of the Dnyaneshwari, in which the author calls himself a servant of Nivritti."
  "mr-4016":
    native: "Tuka says: my only happiness is to see the holy face with delight."
    notes:
      "n1": "The last stanza of abhang 2 in the opening section of the Gatha, as printed on mr.wikisource."
  "mr-4017":
    native: "O mind, do not hold anger, which causes sorrow; O mind, do not hold desire, which brings many disturbances."
    notes:
      "n1": "The first couplet of verse 6 of the Manache Shlok, as printed on mr.wikisource."
