cards:
  "mr-5160": {"native": "This dog is mine.", "bases": {"माझा": "mine", "आहे": "is"}, "confusables": {"w1": {"why": "She, not this dog: ती (ti) means she."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one dog takes आहे (āhe)."}}, "notes": {"n1": "माझा (mājhā), mine, ends in -ा (-ā) because कुत्रा (kutrā), dog, is masculine: the possessive agrees with the thing owned."}}
  "mr-5161": {"native": "The cow is in the field.", "bases": {"शेतात": "in the field", "आहे": "is"}, "confusables": {"w1": {"why": "They, not the cow: ते (te) means they."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one cow takes आहे (āhe)."}}, "notes": {"n1": "शेतात (śetāt), in the field, is the oblique of शेत (śet), field, with -ात (-āt), 'in'."}}
  "mr-5162": {"native": "The horse runs in the field.", "bases": {"शेतात": "in the field", "पळतो": "runs"}, "confusables": {"w1": {"why": "They, not the horse: ते (te) means they."}, "f1": {"why": "Feminine: पळते (paḷte) is for a feminine subject; the horse is masculine, so पळतो (paḷto) is right."}}}
  "mr-5163": {"native": "The hen lays eggs.", "bases": {"अंडी": "eggs", "देते": "lays"}, "confusables": {"w1": {"why": "He, not the hen: तो (to) means he."}, "f1": {"why": "Masculine: देतो (deto) is for a masculine subject; the hen is feminine, so देते (dete)."}}, "notes": {"n1": "देते (dete), lays, agrees with the hen कोंबडी (kombaḍi), the doer; it does not agree with the eggs अंडी (aṇḍi), which are the object."}}
  "mr-5164": {"native": "The lion lives in the forest.", "bases": {"जंगलात": "in the forest", "राहतो": "lives"}, "confusables": {"w1": {"why": "They: ते (te) means they, for more than one."}, "f1": {"why": "Feminine: राहते (rāhte) is for a feminine subject; the lion is masculine, so राहतो (rāhto)."}}, "notes": {"n1": "जंगलात (jaṅgalāt), in the forest, is the oblique of जंगल (jaṅgal), forest, with -ात (-āt), 'in'."}}
  "mr-5165": {"native": "The rabbit sits in the field.", "bases": {"शेतात": "in the field", "बसतो": "sits"}, "confusables": {"w1": {"why": "She, not the rabbit: ती (ti) means she."}, "f1": {"why": "Feminine: बसते (baste) is for a feminine subject; the rabbit is masculine, so बसतो (basto)."}}, "notes": {"n1": "शेतात (śetāt), in the field, takes the same -ात (-āt), 'in', added to शेत (śet), field."}}
  "mr-5166": {"native": "The ox works.", "bases": {"करतो": "works"}, "confusables": {"w1": {"why": "They, not the ox: ते (te) means they."}, "f1": {"why": "Feminine: करते (karte) is for a feminine subject; the ox is masculine, so करतो (karto)."}}, "notes": {"n1": "काम करणे (kām karṇe), to work, is a noun with करणे (karṇe), do; करतो (karto) takes the masculine ending for बैल (bail), ox."}}
  "mr-5167": {"native": "The buffalo drinks water.", "bases": {"पिते": "drinks"}, "confusables": {"w1": {"why": "He, not the buffalo: तो (to) means he."}, "f1": {"why": "Masculine: पितो (pito) is for a masculine subject; the buffalo is feminine, so पिते (pite)."}}, "notes": {"n1": "पिते (pite), drinks, agrees with म्हैस (mhais), buffalo, which is feminine, not with the पाणी (pāṇi), water, it drinks."}}
  "mr-5168": {"native": "My horse is in the house.", "bases": {"माझा": "my", "घरात": "in the house", "आहे": "is"}, "confusables": {"w1": {"why": "She, not the horse: ती (ti) means she."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one horse takes आहे (āhe)."}}, "notes": {"n1": "घरात (gharāt), in the house, is the oblique of घर (ghar), house, with -ात (-āt), 'in'."}}
  "mr-5169": {"native": "This monkey is on the tree.", "bases": {"झाडावर": "on the tree", "आहे": "is"}, "confusables": {"w1": {"why": "Masculine: हा (hā) goes with a masculine noun; माकड (mākaḍ) is neuter, so हे (he) is right."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one monkey takes आहे (āhe)."}}, "notes": {"n1": "झाडावर (jhāḍāvar), on the tree, is the oblique of झाड (jhāḍ), tree, with -ावर (-āvar), 'on'."}}
  "mr-5170": {"native": "The dog goes home.", "bases": {"घरी": "home", "जातो": "goes"}, "confusables": {"w1": {"why": "They, not the dog: ते (te) means they."}, "f1": {"why": "Feminine: जाते (jāte) is for a feminine subject; the dog is masculine, so जातो (jāto)."}}, "notes": {"n1": "घरी (ghari), home, takes the old -ई (-ī) ending, as in मी घरी जातो (mi ghari jāto), I'm going home."}}
  "mr-5171": {"native": "The duck swims.", "bases": {"पोहते": "swims"}, "confusables": {"w1": {"why": "He, not the duck: तो (to) means he."}, "f1": {"why": "Masculine: पोहतो (pohto) is for a masculine subject; बदक (badak) takes the feminine ending, so पोहते (pohte)."}}}
