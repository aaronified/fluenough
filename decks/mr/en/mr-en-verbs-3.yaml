schema: 1
id: "mr-en-verbs-3"
kind: "layer"
core: "mr-verbs-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs 3"
description: "Verbs for finding, carrying, remembering and telling: to search, to forget, to carry, to show and to leave. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-1173":
    native: "to search, to look for"
    notes:
      "n1": "{1} is searching for a thing or an answer."
    examples:
      "मी चावी शोधतो.": "I am looking for the key."
      "पोलीस चोराला शोधत आहेत.": { native: "The police are searching for the thief.", bases: { "आहेत": "to be" } }
  "mr-1174":
    native: "to lose (a thing)"
    notes:
      "n1": "{1} is losing something, so it is no longer where you left it."
    examples:
      "माझी पिशवी हरवली.": "I lost my bag."
      "मुलगा रस्त्यात हरवला.": "The boy got lost on the road."
  "mr-1175":
    native: "to forget"
    notes:
      "n1": "{1} is forgetting something you knew."
    examples:
      "मी नाव विसरलो.": "I forgot the name."
      "तू काही विसरू नकोस.": "Do not forget anything."
  "mr-1176":
    native: "to remember"
    notes:
      "n1": "{1} is remembering. It is used like लक्षात येणे (lakṣāt yeṇe), to come to mind."
    examples:
      "मला तुझं नाव आठवत नाही.": { native: "I do not remember your name.", bases: { "नाही": "not" } }
      "मला ते दिवस आठवतात.": "I remember those days."
  "mr-1177":
    native: "to ask"
    notes:
      "n1": "{1} is asking a question."
    examples:
      "शिक्षकांना प्रश्न विचारा.": { native: "Ask the teacher a question.", bases: { "प्रश्न": "question" } }
      "त्याने पत्ता विचारला.": "He asked for the address."
  "mr-1178":
    native: "to show"
    notes:
      "n1": "{1} is showing something to someone."
    examples:
      "मला तुझी वही दाखव.": "Show me your notebook."
      "तिने फोटो दाखवला.": "She showed the photo."
  "mr-1179":
    native: "to hold, to grip"
    notes:
      "n1": "{1} is holding something with a hand."
    examples:
      "आजीचा हात धरा.": "Hold grandmother's hand."
      "त्याने दोरी घट्ट धरली.": "He held the rope tightly."
  "mr-1180":
    native: "to leave; to let go"
    notes:
      "n1": "{1} is leaving someone or letting something go."
    examples:
      "हात सोड.": "Let go of my hand."
      "तो गाव सोडून गेला.": "He left the village and went away."
  "mr-1181":
    native: "to walk about, to roam"
    notes:
      "n1": "{1} is walking about for pleasure, or turning."
    examples:
      "संध्याकाळी बागेत फिरतो.": "In the evening I walk about in the garden."
      "चाक जोरात फिरतं.": "The wheel turns fast."
  "mr-1182":
    native: "to live, to stay"
    notes:
      "n1": "{1} is staying or living in a place."
    examples:
      "तो पुण्यात राहतो.": { native: "He lives in Pune.", bases: { "पुण्यात": "in Pune" } }
      "आम्ही दोन दिवस राहिलो.": "We stayed for two days."
  "mr-1183":
    native: "to return, to come back"
    notes:
      "n1": "{1} is returning to a place."
    examples:
      "तो संध्याकाळी घरी परतला.": "He returned home in the evening."
      "आई उद्या परत येईल.": "Mother will come back tomorrow."
  "mr-1184":
    native: "to run away, to flee"
    notes:
      "n1": "{1} is running away fast from danger."
    examples:
      "कुत्रा पळून गेला.": "The dog ran away."
      "चोर पळाला.": "The thief ran away."
  "mr-1185":
    native: "to cry"
    notes:
      "n1": "{1} is crying."
    examples:
      "बाळ रडतं.": { native: "The baby is crying.", bases: { "बाळ": "baby" } }
      "ती का रडत होती?": { native: "Why was she crying?", bases: { "होती": "to be" } }
  "mr-1186":
    native: "to find out"
    notes:
      "n1": "{1} is finding out something after a search."
    examples:
      "त्याने चोर शोधून काढला.": "He found out the thief."
      "खरं काय ते शोधून काढू.": "Let's find out what is true."
  "mr-1187":
    native: "to finish, to end"
    notes:
      "n1": "{1} is finishing something, bringing it to an end."
    examples:
      "काम संपवा.": "Finish the work."
      "त्याने जेवण संपवलं.": "He finished the meal."
  "mr-1188":
    native: "to take away"
    notes:
      "n1": "{1} is taking something or someone to another place."
    examples:
      "मी पुस्तक घरी नेलं.": "I took the book home."
      "आजी मुलाला डॉक्टरकडे नेते.": "Grandmother takes the child to the doctor."
  "mr-1189":
    native: "to push"
    notes:
      "n1": "{1} is pushing something away from you."
    examples:
      "दार ढकल.": "Push the door."
      "गर्दीत कोणी तरी ढकललं.": { native: "Someone pushed in the crowd.", bases: { "गर्दीत": "in the crowd" } }
