schema: 1
id: "mr-en-verbs-3"
kind: "layer"
core: "mr-verbs-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs 3"
description: "Verbs for finding, carrying, remembering and telling: to search, to forget, to carry, to show and to leave. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-1173":
    native: "to search, to look for"
    notes:
      "n1": "{1} is searching for a thing or an answer."
    examples:
      "मी चावी शोधतो.": { native: "I am looking for the key.", bases: { "शोधतो": "to search, to look for", "चावी": "key" } }
      "पोलीस चोराला शोधत आहेत.": { native: "The police are searching for the thief.", bases: { "आहेत": "to be", "शोधत": "to search, to look for", "चोराला": "the thief" } }
  "mr-1174":
    native: "to lose (a thing)"
    notes:
      "n1": "{1} is losing something, so it is no longer where you left it."
    examples:
      "माझी पिशवी हरवली.": { native: "I lost my bag.", bases: { "हरवली": "to lose (a thing)" } }
      "मुलगा रस्त्यात हरवला.": { native: "The boy got lost on the road.", bases: { "हरवला": "to lose (a thing)" } }
  "mr-1175":
    native: "to forget"
    notes:
      "n1": "{1} is forgetting something you knew."
    examples:
      "मी नाव विसरलो.": { native: "I forgot the name.", bases: { "विसरलो": "to forget" } }
      "तू काही विसरू नकोस.": { native: "Do not forget anything.", bases: { "विसरू": "to forget" } }
  "mr-1176":
    native: "to remember"
    notes:
      "n1": "{1} is remembering. It is used like लक्षात येणे (lakṣāt yeṇe), to come to mind."
    examples:
      "मला तुझं नाव आठवत नाही.": { native: "I do not remember your name.", bases: { "नाही": "not", "आठवत": "to remember" } }
      "मला ते दिवस आठवतात.": { native: "I remember those days.", bases: { "आठवतात": "to remember" } }
  "mr-1177":
    native: "to ask"
    notes:
      "n1": "{1} is asking a question."
    examples:
      "शिक्षकांना प्रश्न विचारा.": { native: "Ask the teacher a question.", bases: { "प्रश्न": "question", "विचारा": "to ask" } }
      "त्याने पत्ता विचारला.": { native: "He asked for the address.", bases: { "विचारला": "to ask" } }
  "mr-1178":
    native: "to show"
    notes:
      "n1": "{1} is showing something to someone."
    examples:
      "मला तुझी वही दाखव.": { native: "Show me your notebook.", bases: { "दाखव": "to show" } }
      "तिने फोटो दाखवला.": { native: "She showed the photo.", bases: { "दाखवला": "to show" } }
  "mr-1179":
    native: "to hold, to grip"
    notes:
      "n1": "{1} is holding something with a hand."
    examples:
      "आजीचा हात धरा.": { native: "Hold grandmother's hand.", bases: { "धरा": "to hold, to grip" } }
      "त्याने दोरी घट्ट धरली.": { native: "He held the rope tightly.", bases: { "धरली": "to hold, to grip", "दोरी": "rope", "घट्ट": "tightly" } }
  "mr-1180":
    native: "to leave; to let go"
    notes:
      "n1": "{1} is leaving someone or letting something go."
    examples:
      "हात सोड.": { native: "Let go of my hand.", bases: { "सोड": "to leave; to let go" } }
      "तो गाव सोडून गेला.": { native: "He left the village and went away.", bases: { "सोडून": "to leave; to let go" } }
  "mr-1181":
    native: "to walk about, to roam"
    notes:
      "n1": "{1} is walking about for pleasure, or turning."
    examples:
      "संध्याकाळी बागेत फिरतो.": { native: "In the evening I walk about in the garden.", bases: { "फिरतो": "to walk about, to roam" } }
      "चाक जोरात फिरतं.": { native: "The wheel turns fast.", bases: { "फिरतं": "to walk about, to roam", "चाक": "wheel", "जोरात": "loudly" } }
  "mr-1182":
    native: "to live, to stay"
    notes:
      "n1": "{1} is staying or living in a place."
    examples:
      "तो पुण्यात राहतो.": { native: "He lives in Pune.", bases: { "पुण्यात": "in Pune", "राहतो": "to live, to stay" } }
      "आम्ही दोन दिवस राहिलो.": { native: "We stayed for two days.", bases: { "राहिलो": "to live, to stay" } }
  "mr-1183":
    native: "to return, to come back"
    notes:
      "n1": "{1} is returning to a place."
    examples:
      "तो संध्याकाळी घरी परतला.": { native: "He returned home in the evening.", bases: { "परतला": "to return, to come back" } }
      "आई उद्या परत येईल.": { native: "Mother will come back tomorrow.", bases: { "परत": "back" } }
  "mr-1184":
    native: "to run away, to flee"
    notes:
      "n1": "{1} is running away fast from danger."
    examples:
      "कुत्रा पळून गेला.": { native: "The dog ran away.", bases: { "पळून": "to run away, to flee" } }
      "चोर पळाला.": { native: "The thief ran away.", bases: { "पळाला": "to run away, to flee", "चोर": "thief" } }
  "mr-1185":
    native: "to cry"
    notes:
      "n1": "{1} is crying."
    examples:
      "बाळ रडतं.": { native: "The baby is crying.", bases: { "बाळ": "baby", "रडतं": "to cry" } }
      "ती का रडत होती?": { native: "Why was she crying?", bases: { "होती": "to be", "रडत": "to cry" } }
  "mr-1186":
    native: "to find out"
    notes:
      "n1": "{1} is finding out something after a search."
    examples:
      "त्याने चोर शोधून काढला.": { native: "He found out the thief.", bases: { "चोर": "thief" } }
      "खरं काय ते शोधून काढू.": "Let's find out what is true."
  "mr-1187":
    native: "to finish, to end"
    notes:
      "n1": "{1} is finishing something, bringing it to an end."
    examples:
      "काम संपवा.": { native: "Finish the work.", bases: { "संपवा": "to finish, to end" } }
      "त्याने जेवण संपवलं.": { native: "He finished the meal.", bases: { "संपवलं": "to finish, to end" } }
  "mr-1188":
    native: "to take away"
    notes:
      "n1": "{1} is taking something or someone to another place."
    examples:
      "मी पुस्तक घरी नेलं.": { native: "I took the book home.", bases: { "नेलं": "to take away" } }
      "आजी मुलाला डॉक्टरकडे नेते.": { native: "Grandmother takes the child to the doctor.", bases: { "नेते": "to take away" } }
  "mr-1189":
    native: "to push"
    notes:
      "n1": "{1} is pushing something away from you."
    examples:
      "दार ढकल.": { native: "Push the door.", bases: { "ढकल": "to push" } }
      "गर्दीत कोणी तरी ढकललं.": { native: "Someone pushed in the crowd.", bases: { "गर्दीत": "in the crowd", "ढकललं": "to push" } }
