schema: 1
id: "mr-en-script-reading"
kind: "layer"
core: "mr-script-reading"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words to read"
license: "CC-BY-SA-4.0"
description: "Short everyday words written with letters alone, no vowel signs: the headline, the standing line, ळ (ḷa), and the vowel you do not see, at work. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0048":
    native: "house; home"
    notes:
      "n1": "Two letters under one headline. घ (gha) is gha and र (ra) is ra, but the last a isn't said: ghar."
    "examples": {
      "आई घर सजवते.": {"native": "Mother decorates the house.", "bases": {"सजवते": "to decorate", "घर": "house; home"}},
      "कमाईतून घर चालतं.": {"native": "The household runs on the earnings.", "bases": {"कमाईतून": "earnings, income", "चालतं": "to run, to work", "घर": "house; home"}}
    }
  "mr-0049":
    native: "world"
    notes:
      "n1": "ज (ja) before a is said dz in Marathi: dzag. The last a is quiet."
    "examples": {
      "मी त्या जगाची कल्पना केली.": {"native": "I imagined that world.", "bases": {"जगाची": "world"}}
    }
  "mr-0050":
    native: "lotus"
    notes:
      "n1": "Three letters and no vowel written: ka-ma-l, the last one the curled-back ळ (ḷa)."
  "mr-0051":
    native: "tap; water pipe"
    notes:
      "n1": "न (na) and ळ (ḷa): the first l is on the teeth, this one curled back."
    "examples": {
      "स्नानगृहाचा नळ गळतो.": {"native": "The bathroom tap is leaking.", "bases": {"गळतो": "to leak", "स्नानगृहाचा": "bathroom", "नळ": "tap; water pipe"}}
    }
  "mr-0052":
    native: "bus; sit! (to a friend)"
    notes:
      "n1": "ब (ba) has a line across it; without it, it would be व (va). As 'bus' it is feminine: बस आली (bas āli), the bus has come."
    "examples": {
      "बसमध्ये चढा.": {"native": "Get on the bus.", "bases": {"चढा": "to get on, to board", "बसमध्ये": "bus"}},
      "बस इथे थांबते.": {"native": "The bus stops here.", "bases": {"बस": "bus", "थांबते": "to stop"}}
    }
  "mr-0053":
    native: "mind; heart"
    notes:
      "n1": "म (ma) and न (na), each with its a, and the last one quiet."
    "examples": {
      "त्याच्या मनात दया आहे.": {"native": "He has compassion in his heart.", "bases": {"आहे": "to be", "मनात": "mind; heart"}},
      "ओवी ऐकताना मन भरून येतं.": {"native": "Listening to a folk verse, the heart is filled.", "bases": {"मन": "mind; heart"}}
    }
  "mr-0054":
    native: "forest"
    notes:
      "n1": "व (va) has no line across it; ब (ba) does."
  "mr-0055":
    native: "rate; price (per unit)"
    notes:
      "n1": "द (da), on the teeth, and र (ra). Also 'every': दर दिवशी (dar divśi), every day."
    "examples": {
      "खोलीचं भाडं दर महिन्याला द्यायचं.": {"native": "The room rent is paid every month.", "bases": {}}
    }
  "mr-0056":
    native: "fruit"
    notes:
      "n1": "फ (pha) is प (pa) with a curl, and a breath after it: ph. Many say it with an f."
    "examples": {
      "विक्रेत्याकडे फळं आहेत.": {"native": "The seller has fruit.", "bases": {"आहेत": "to be", "विक्रेत्याकडे": "seller", "फळं": "fruit"}}
    }
  "mr-0057":
    native: "turmeric"
    notes:
      "n1": "ह (ha) has no standing line; the middle a is said here: ha-la-d."
    "examples": {
      "नवरीने हळदीचा रंग लावला.": {"native": "The bride put on the turmeric colour.", "bases": {"लावला": "to put on", "नवरीने": "bride", "रंग": "colours", "हळदीचा": "turmeric"}}
    }
  "mr-0058":
    native: "city; town"
    notes:
      "n1": "श (śa) has a gap in its headline."
    "examples": {
      "कारखाना शहराबाहेर आहे.": {"native": "The factory is outside the city.", "bases": {"शहराबाहेर": "outside the city", "आहे": "to be"}},
      "प्रशिक्षणासाठी शहरात गेलो.": {"native": "I went to the city for training.", "bases": {"शहरात": "to the city", "प्रशिक्षणासाठी": "training"}}
    }
  "mr-0059":
    native: "cloud"
    notes:
      "n1": "ढ (ḍha) is curled back, with a breath after it."
    "examples": {
      "ढग गडगडले.": {"native": "The clouds rumbled.", "bases": {"गडगडले": "to rumble"}},
      "आकाशात ढग आहेत.": {"native": "There are clouds in the sky.", "bases": {"आहेत": "to be", "आकाशात": "sky"}}
    }
  "mr-0060":
    native: "cup"
    notes:
      "n1": "From English, written with letters alone."
    "examples": {
      "चहा कपात ओत.": {"native": "Pour the tea into the cup.", "bases": {"कपात": "cup", "ओत": "to pour"}}
    }
  "mr-0061":
    native: "grass"
    notes:
      "n1": "Three letters: ga-va-t."
    "examples": {
      "गाय गवत खाते.": {"native": "The cow eats grass.", "bases": {"गवत": "grass", "खाते": "to eat"}},
      "मेंढी गवत खाते.": {"native": "The sheep eats grass.", "bases": {"गवत": "grass", "खाते": "to eat"}}
    }
  "mr-0062":
    native: "straight; straight on"
    notes:
      "n1": "Also 'simple, honest' of a person. Asking the way: सरळ जा (saraḷ jā), go straight on."
    "examples": {
      "सरळ बसा, पाठ ताठ ठेवा.": {"native": "Sit up straight, keep your back upright.", "bases": {"सरळ": "straight", "बसा": "to sit", "ताठ": "upright", "ठेवा": "to keep"}}
    }
