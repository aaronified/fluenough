schema: 1
id: "mr-en-body"
kind: "layer"
core: "mr-body"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The body"
license: "CC-BY-SA-4.0"
description: "The parts of the body, and where it hurts. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-0805":
    native: "head"
    notes:
      "n1": "माझे डोके दुखते (mājhe ḍoke dukhte), my head hurts."
    examples:
      "माझे डोके दुखते.": { native: "My head hurts.", bases: { "माझे": "my", "दुखते": "to hurt" } }
      "तुझे डोके ठीक आहे का?": { native: "Is your head all right?", bases: { "तुझे": "your", "ठीक": "fine", "आहे": "to be", "का": "question word" } }
  "mr-0806":
    native: "eye"
    notes:
      "n1": "The plural is डोळे (ḍoḷe), eyes."
    examples:
      "माझे डोळे मोठे आहेत.": { native: "My eyes are big.", bases: { "माझे": "my", "डोळे": "eyes", "मोठे": "big", "आहेत": "to be" } }
      "त्याचा डोळा दुखतो.": { native: "His eye hurts.", bases: { "त्याचा": "he", "दुखतो": "to hurt" } }
  "mr-0807":
    native: "ear"
    notes:
      "n1": "कान नीट ऐका (kān niṭ aikā), listen carefully; the verb for listening is ऐकणे (aikṇe)."
    examples:
      "माझा कान दुखतो.": { native: "My ear hurts.", bases: { "माझा": "my", "दुखतो": "to hurt" } }
      "कान नीट ऐका.": { native: "Listen carefully.", bases: { "ऐका": "to listen" } }
  "mr-0808":
    native: "nose"
    notes:
      "n1": "नाक वाहते (nāk vāhte), the nose runs (cold)."
    examples:
      "नाक वाहते.": { native: "My nose is running.", bases: { "वाहते": "to run" } }
      "माझे नाक लाल आहे.": { native: "My nose is red.", bases: { "माझे": "my", "लाल": "red", "आहे": "to be" } }
  "mr-0809":
    native: "mouth"
    notes:
      "n1": "तोंड उघडा (toṇḍ ughḍā), open your mouth."
    examples:
      "तोंड उघडा.": { native: "Open your mouth.", bases: { "उघडा": "to open" } }
      "तोंड बंद करा.": { native: "Close your mouth.", bases: { "बंद": "closed", "करा": "to do" } }
  "mr-0810":
    native: "tooth"
    notes:
      "n1": "दात घासणे (dāt ghāsṇe), to brush the teeth."
    examples:
      "माझा दात दुखतो.": { native: "My tooth hurts.", bases: { "माझा": "my", "दुखतो": "to hurt" } }
      "दात घासा.": { native: "Brush your teeth.", bases: { "घासा": "to brush" } }
  "mr-0811":
    native: "hair"
    notes:
      "n1": "केस (kes) is used in the plural form: लांब केस (lāmb kes), long hair."
    examples:
      "तिचे केस लांब आहेत.": { native: "Her hair is long.", bases: { "तिचे": "her", "आहेत": "to be" } }
      "त्याचे केस काळे आहेत.": { native: "His hair is black.", bases: { "त्याचे": "he", "काळे": "black", "आहेत": "to be" } }
  "mr-0812":
    native: "neck"
    notes:
      "n1": "मान (mān) is also the word for respect."
    examples:
      "माझी मान दुखते.": { native: "My neck hurts.", bases: { "माझी": "my", "दुखते": "to hurt" } }
      "तिची मान लांब आहे.": { native: "Her neck is long.", bases: { "तिची": "her", "आहे": "to be" } }
  "mr-0813":
    native: "shoulder"
    notes:
      "n1": "खांदा (khāndā) takes दुखतो (dukhto) for pain."
    examples:
      "माझा खांदा दुखतो.": { native: "My shoulder hurts.", bases: { "माझा": "my", "दुखतो": "to hurt" } }
      "त्याचा खांदा मोठा आहे.": { native: "His shoulder is big.", bases: { "त्याचा": "he", "मोठा": "big", "आहे": "to be" } }
  "mr-0814":
    native: "hand; arm"
    notes:
      "n1": "दोन्ही हात (donhi hāt), both hands."
    examples:
      "माझा हात दुखतो.": { native: "My arm hurts.", bases: { "माझा": "my", "दुखतो": "to hurt" } }
      "दोन्ही हात वर करा.": { native: "Raise both hands.", bases: { "वर": "up", "करा": "to do" } }
  "mr-0815":
    native: "finger; toe"
    notes:
      "n1": "बोट (boṭ), finger or toe."
    examples:
      "माझे बोट कापले.": { native: "I cut my finger.", bases: { "माझे": "my", "कापले": "to cut" } }
      "त्याचे बोट लहान आहे.": { native: "His finger is small.", bases: { "त्याचे": "he", "लहान": "small", "आहे": "to be" } }
  "mr-0816":
    native: "stomach"
    notes:
      "n1": "पोट दुखते (poṭ dukhte), the stomach hurts."
    examples:
      "माझे पोट दुखते.": { native: "My stomach hurts.", bases: { "माझे": "my", "दुखते": "to hurt" } }
      "तिचे पोट भरले आहे.": { native: "Her stomach is full.", bases: { "तिचे": "her", "भरले": "to fill", "आहे": "to be" } }
  "mr-0817":
    native: "leg; foot"
    notes:
      "n1": "पायाने (pāyāne), on foot, as in पायाने चालणे (pāyāne cālṇe), to walk."
    examples:
      "माझा पाय दुखतो.": { native: "My leg hurts.", bases: { "माझा": "my", "दुखतो": "to hurt" } }
      "तो पायाने चालतो.": { native: "He walks on foot.", bases: { "पायाने": "on foot" } }
  "mr-0818":
    native: "knee"
    notes:
      "n1": "गुडघा वाकवा (guḍghā vākvā), bend the knee."
    examples:
      "माझा गुडघा दुखतो.": { native: "My knee hurts.", bases: { "माझा": "my", "दुखतो": "to hurt" } }
      "गुडघा वाकवा.": { native: "Bend your knee.", bases: { "वाकवा": "to bend" } }
  "mr-0819":
    native: "back"
    notes:
      "n1": "सरळ बसा (saraḷ basā), sit up straight, पाठ ताठ ठेवा (pāṭh tāṭh ṭhevā), keep your back upright."
    examples:
      "माझी पाठ दुखते.": { native: "My back hurts.", bases: { "माझी": "my", "दुखते": "to hurt" } }
      "सरळ बसा, पाठ ताठ ठेवा.": { native: "Sit up straight, keep your back upright.", bases: { "सरळ": "straight", "बसा": "to sit", "ताठ": "upright", "ठेवा": "to keep" } }
  "mr-0820":
    native: "chest"
    notes:
      "n1": "छातीत दुखते (chātit dukhte), the chest hurts."
    examples:
      "माझी छाती दुखते.": { native: "My chest hurts.", bases: { "माझी": "my", "दुखते": "to hurt" } }
      "छातीत दुखते.": { native: "The chest hurts.", bases: { "छातीत": "in the chest", "दुखते": "to hurt" } }
  "mr-0821":
    native: "lip"
    notes:
      "n1": "ओठ (oṭh), lip or lips."
    examples:
      "माझे ओठ कोरडे आहेत.": { native: "My lips are dry.", bases: { "माझे": "my", "कोरडे": "dry", "आहेत": "to be" } }
      "त्याचे ओठ लाल आहेत.": { native: "His lips are red.", bases: { "त्याचे": "he", "लाल": "red", "आहेत": "to be" } }
  "mr-0822":
    native: "tongue"
    notes:
      "n1": "जीभ बाहेर काढा (jibh bāher kāḍhā), stick out your tongue."
    examples:
      "तिची जीभ जळली.": { native: "Her tongue burned.", bases: { "तिची": "her", "जळली": "to burn" } }
      "जीभ बाहेर काढा.": { native: "Stick out your tongue.", bases: { "बाहेर": "outside", "काढा": "to take out" } }
  "mr-0823":
    native: "face"
    notes:
      "n1": "चेहरा (cehrā) also means appearance: आनंदी चेहरा (ānandi cehrā), a happy face."
    examples:
      "तिचा चेहरा आनंदी आहे.": { native: "Her face is happy.", bases: { "तिचा": "her", "आहे": "to be" } }
      "त्याचा चेहरा दुःखी आहे.": { native: "His face is sad.", bases: { "त्याचा": "he", "आहे": "to be" } }
  "mr-0824":
    native: "heart"
    notes:
      "n1": "हृदय (hruday) is used for the heart's beat: जोरात धडधडते (jorāt dhaḍdhḍte), it beats loudly."
    examples:
      "माझे हृदय जोरात धडधडते.": { native: "My heart beats loudly.", bases: { "माझे": "my", "जोरात": "loudly", "धडधडते": "to pound" } }
      "त्याचे हृदय चांगले आहे.": { native: "His heart is good.", bases: { "त्याचे": "he", "चांगले": "good", "आहे": "to be" } }
  "mr-0825":
    native: "brain"
    notes:
      "n1": "मेंदू (mendu) is the word for the brain, not the mind in general."
    examples:
      "माझा मेंदू थकला आहे.": { native: "My brain is tired.", bases: { "माझा": "my", "थकला": "to get tired", "आहे": "to be" } }
      "मेंदू विचार करतो.": { native: "The brain thinks.", bases: { "विचार": "thought", "करतो": "to do" } }
  "mr-0826":
    native: "nail"
    notes:
      "n1": "नखे (nakhe) is the plural of नख (nakh), nail; the word is used in the plural."
    examples:
      "त्याची नखे लांब आहेत.": { native: "His nails are long.", bases: { "त्याची": "he", "आहेत": "to be" } }
      "नखे स्वच्छ ठेवा.": { native: "Keep the nails clean.", bases: { "स्वच्छ": "clean", "ठेवा": "to keep" } }
  "mr-0827":
    native: "throat"
    notes:
      "n1": "घसा दुखतो (ghasā dukhto), the throat hurts."
    examples:
      "माझा घसा दुखतो.": { native: "My throat hurts.", bases: { "माझा": "my", "दुखतो": "to hurt" } }
      "माझा घसा कोरडा आहे.": { native: "My throat is dry.", bases: { "माझा": "my", "कोरडा": "dry", "आहे": "to be" } }
  "mr-0828":
    native: "waist; lower back"
    notes:
      "n1": "कंबरेत (kambaret), at the waist."
    examples:
      "माझी कंबर दुखते.": { native: "My lower back hurts.", bases: { "माझी": "my", "दुखते": "to hurt" } }
      "तो कंबरेत वाकतो.": { native: "He bends at the waist.", bases: { "कंबरेत": "at the waist", "वाकतो": "to bend" } }
  "mr-0829":
    native: "heel"
    notes:
      "n1": "टाच (ṭāc) is the back of the foot."
    examples:
      "माझी टाच दुखते.": { native: "My heel hurts.", bases: { "माझी": "my", "दुखते": "to hurt" } }
      "त्याची टाच मोठी आहे.": { native: "His heel is big.", bases: { "त्याची": "he", "मोठी": "big", "आहे": "to be" } }
  "mr-0830":
    native: "elbow"
    notes:
      "n1": "कोपर (kopar), elbow."
    examples:
      "माझे कोपर दुखते.": { native: "My elbow hurts.", bases: { "माझे": "my", "दुखते": "to hurt" } }
      "कोपर टेबलावर ठेवू नका.": { native: "Do not put your elbows on the table.", bases: { "टेबलावर": "on the table", "ठेवू": "to keep", "नका": "do not" } }
  "mr-0831":
    native: "thigh; lap"
    notes:
      "n1": "मांडीवर (māṇḍivar), on the lap."
    examples:
      "माझी मांडी दुखते.": { native: "My thigh hurts.", bases: { "माझी": "my", "दुखते": "to hurt" } }
      "मुले मांडीवर बसतात.": { native: "The children sit on the lap.", bases: { "मांडीवर": "on the lap", "बसतात": "to sit" } }
  "mr-0832":
    native: "eyelid"
    notes:
      "n1": "पापणी फडफडते (pāpṇi phaḍphḍte), the eyelid flutters."
    examples:
      "माझी पापणी फडफडते.": { native: "My eyelid flutters.", bases: { "माझी": "my", "फडफडते": "to flutter" } }
      "त्याच्या पापणीवर धूळ आहे.": { native: "There is dust on his eyelid.", bases: { "त्याच्या": "he", "पापणीवर": "on the eyelid", "धूळ": "dust", "आहे": "to be" } }
  "mr-0833":
    native: "eyebrow"
    notes:
      "n1": "भुवई (bhuvai), eyebrow."
    examples:
      "तिची भुवई काळी आहे.": { native: "Her eyebrow is black.", bases: { "तिची": "her", "काळी": "black", "आहे": "to be" } }
      "भुवई वर करा.": { native: "Raise your eyebrow.", bases: { "वर": "up", "करा": "to do" } }
  "mr-0834":
    native: "cheek"
    notes:
      "n1": "गाल (gāl) is the cheek of the face."
    examples:
      "तिचा गाल लाल आहे.": { native: "Her cheek is red.", bases: { "तिचा": "her", "लाल": "red", "आहे": "to be" } }
      "त्याचे गाल गरम आहेत.": { native: "His cheeks are warm.", bases: { "त्याचे": "he", "गरम": "warm", "आहेत": "to be" } }
