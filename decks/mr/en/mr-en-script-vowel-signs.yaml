schema: 1
id: "mr-en-script-vowel-signs"
kind: "layer"
core: "mr-script-vowel-signs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Marathi vowel signs"
license: "CC-BY-SA-4.0"
description: "After a consonant a vowel is written as a sign (matra) on it: after it, above, below, or, for i, before it. Here on क (ka) and on म (ma), with the dot, the two dots and the mark that takes the vowel away. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0063":
    native: "kaa (k + the aa sign)"
    notes:
      "n1": "The aa sign ा (ā) is a standing line after the consonant: काका (kākā, uncle). Compare क (ka) on its own, which is 'ka' with the short a."
    "examples": {
      "जाऊ नका.": {"native": "Please don't go.", "bases": {"जाऊ": "to go", "नका": "do not"}},
      "धूळ झटका.": {"native": "Shake off the dust.", "bases": {"झटका": "to shake"}}
    }
  "mr-0064":
    native: "ki (k + the i sign)"
    notes:
      "n1": "The i sign ि (i) is written before the consonant but said after it: you see ि (i) then क (ka), and say ki. किल्ला (killā, fort)."
    "examples": {
      "कर किती लागेल?": {"native": "How much tax will apply?", "bases": {"लागेल": "to apply"}},
      "किती वेळ लागेल?": {"native": "How long will it take?", "bases": {"लागेल": "to be felt; to take (time); to be necessary"}}
    }
  "mr-0065":
    native: "kii (k + the ii sign)"
    notes:
      "n1": "The ii sign ी (i) comes after the consonant, curling over it to the right: कीडा (kiḍā, insect)."
    "examples": {
      "गुंतवणुकीचा विचार करा.": {"native": "Think about the investment.", "bases": {"गुंतवणुकीचा": "investment"}},
      "चुकीसाठी शिक्षा होते.": {"native": "A mistake is punished.", "bases": {"चुकीसाठी": "for a mistake", "होते": "to become", "शिक्षा": "punishment"}}
    }
  "mr-0066":
    native: "ku (k + the u sign)"
    notes:
      "n1": "The u sign ु (u) hangs below: कुत्रा (kutrā, dog)."
    "examples": {
      "करंजी कुरकुरीत असते.": {"native": "A karanji is crisp.", "bases": {"असते": "to be", "कुरकुरीत": "crisp"}},
      "कुठल्या ठिकाणी जायचं?": {"native": "Which place should we go to?", "bases": {"कुठल्या": "which", "ठिकाणी": "in the place"}}
    }
  "mr-0067":
    native: "kuu (k + the uu sign)"
    notes:
      "n1": "The uu sign ू (u) hangs below too, turned the other way: भूक (bhuk, hunger). On र (ra) both signs change shape: रु (ru) and रू (ru)."
    "examples": {
      "मी हा चाकू वापरतो.": {"native": "I use this knife.", "bases": {"मी": "I", "चाकू": "knife", "वापरतो": "to use"}},
      "रिंग ऐकू येत नाही.": {"native": "I cannot hear the ring.", "bases": {"नाही": "not"}}
    }
  "mr-0068":
    native: "kru (k + the ru sign)"
    notes:
      "n1": "The ru sign ृ (ru) is a small hook below, in words from Sanskrit: कृपया (krupayā, please). Marathi says it 'ru'. A recogniser writes 'kru' as क्रु (kru), so it is drilled by reading and writing only."
    "examples": {
      "कृपया आत या.": {"native": "Please come in.", "bases": {"कृपया": "please", "या": "to come"}},
      "कृपया हळू बोला.": {"native": "Please speak slowly.", "bases": {"कृपया": "please", "बोला": "to speak"}}
    }
  "mr-0069":
    native: "ke (k + the e sign)"
    notes:
      "n1": "The e sign े (e) is a stroke above: केळे (keḷe, banana)."
    "examples": {
      "सूटकेस उघडा.": {"native": "Open the suitcase.", "bases": {}},
      "आई भुकेली आहे.": {"native": "Mother is hungry.", "bases": {"भुकेली": "hungry", "आहे": "to be"}}
    }
  "mr-0070":
    native: "kai (k + the ai sign)"
    notes:
      "n1": "The ai sign ै (ai) is two strokes above: कैरी (kairi, green mango)."
  "mr-0071":
    native: "ko (k + the o sign)"
    notes:
      "n1": "The o sign ो (o) is a standing line with a stroke above: कोण (koṇ, who)."
    "examples": {
      "इथे कोणी नाही.": {"native": "There is nobody here.", "bases": {"इथे": "here", "नाही": "not"}},
      "कोडमध्ये चूक आहे.": {"native": "There is a mistake in the code.", "bases": {"चूक": "mistake", "आहे": "to be", "कोडमध्ये": "code"}}
    }
  "mr-0072":
    native: "kau (k + the au sign)"
    notes:
      "n1": "The au sign ौ (au) is a standing line with two strokes above: कौतुक (kautuk, praise; fond pride)."
    "examples": {
      "कारागिराचं काम कौतुकास्पद आहे.": {"native": "The craftsman's work is praiseworthy.", "bases": {"आहे": "to be", "कारागिराचं": "craftsman, artisan", "कौतुकास्पद": "praiseworthy"}},
      "त्याची सहनशीलता कौतुकास्पद आहे.": {"native": "His patience is praiseworthy.", "bases": {"कौतुकास्पद": "praiseworthy", "आहे": "to be"}}
    }
  "mr-0073":
    native: "kam, kan (k + the dot, anusvaar)"
    notes:
      "n1": "The dot ं (am̐) above, the anusvar, is the nasal that suits the next consonant, n or m: कंगवा (kaṅgvā, comb), आंबा (āmbā, mango). At the end of a word in speech it marks a nasal a: मुलं (mulam̐, children). A mark rather than a sound of its own, so it is drilled by reading and writing only."
    "examples": {
      "आकाशकंदील रंगीबेरंगी आहे.": {"native": "The lantern is colourful.", "bases": {"आहे": "to be", "रंगीबेरंगी": "colourful"}},
      "घरावर आकाशकंदील लावला.": {"native": "I hung a lantern on the house.", "bases": {"लावला": "to hang"}}
    }
  "mr-0074":
    native: "kah (k + the two dots, visarga)"
    notes:
      "n1": "Two dots after a letter, the visarga, are a breath of h, in a few words from Sanskrit: दुःख (duḥkh, sorrow). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  "mr-0075":
    native: "k (with the halant: no vowel)"
    notes:
      "n1": "The small slanting stroke below, the halant ्, takes the vowel away: क् (k) is 'k' alone. Two consonants usually join instead, so it is rare: विद्वान् (vidvān, learned). A mark rather than a sound of its own, so it is drilled by reading and writing only."
    "examples": {
      "विक्रेता हसला.": {"native": "The seller smiled.", "bases": {"हसला": "to smile"}},
      "स्क्रीन फुटली.": {"native": "The screen broke.", "bases": {"फुटली": "to break"}}
    }
  "mr-0076":
    native: "bae (b + the ae sign)"
    notes:
      "n1": "The sign ॅ (ê), a small moon above, is the 'a' of English 'bat', in English words: बॅग (bêg) and बॅट (bêṭ) are said as in English. A recogniser may write it otherwise, so it is drilled by reading and writing only."
    "examples": {
      "बॅटरी संपली.": {"native": "The battery has run out.", "bases": {"संपली": "to end"}},
      "नवीन बॅट आणली.": {"native": "I brought a new bat.", "bases": {"नवीन": "new"}}
    }
  "mr-0077":
    native: "do (d + the open o sign)"
    notes:
      "n1": "The sign ॉ (ô) is the o sign with a moon above: the open 'o' of British 'hot', in English words: डॉक्टर (ḍôkṭar, doctor)."
    "examples": {
      "डॉक्टर मला तपासतात.": {"native": "The doctor examines me.", "bases": {"तपासतात": "to check, to examine"}},
      "डॉक्टरांचा सल्ला घ्या.": {"native": "Take the doctor's advice.", "bases": {}}
    }
  "mr-0078":
    native: "maa (m + the aa sign)"
    notes:
      "n1": "The same aa sign on another consonant: each sign keeps its place on every consonant. मामा (māmā, uncle on the mother's side)."
    "examples": {
      "राजीनामा स्वीकारला.": {"native": "The resignation was accepted.", "bases": {"स्वीकारला": "to accept"}}
    }
  "mr-0079":
    native: "mi (m + the i sign)"
    notes:
      "n1": "The i sign before म (ma), said after it: मिरची (mirci, chilli)."
    "examples": {
      "भांडण मिटवलं.": {"native": "The quarrel was settled.", "bases": {"मिटवलं": "to settle"}},
      "वाद मिटवा.": {"native": "Settle the argument.", "bases": {"मिटवा": "to settle"}}
    }
  "mr-0080":
    native: "mii (m + the ii sign); I"
    notes:
      "n1": "The ii sign after म (ma). On its own, मी (mi) is the word 'I'."
    "examples": {
      "बातमीपत्र संपलं.": {"native": "The bulletin has ended.", "bases": {"संपलं": "to end"}},
      "मला समजले.": {"native": "I understood.", "bases": {"मला": "I", "समजले": "to understand"}}
    }
  "mr-0081":
    native: "mu (m + the u sign)"
    notes:
      "n1": "The u sign below म (ma): मुलगा (mulgā, boy)."
    "examples": {
      "तापमानवाढीमुळे बर्फ वितळतो.": {"native": "Because of global warming ice melts.", "bases": {"बर्फ": "ice", "वितळतो": "to melt", "तापमानवाढीमुळे": "global warming"}},
      "पत्रकाराने मुलाखत घेतली.": {"native": "The journalist took an interview.", "bases": {"पत्रकाराने": "journalist"}}
    }
  "mr-0082":
    native: "muu (m + the uu sign)"
    notes:
      "n1": "The uu sign below म (ma): मूल (mul, child)."
    "examples": {
      "शिल्पकाराने मूर्ती घडवली.": {"native": "The sculptor shaped the statue.", "bases": {"मूर्ती": "statue", "घडवली": "to shape", "शिल्पकाराने": "sculptor"}},
      "गणपतीची मूर्ती सुंदर आहे.": {"native": "The statue of Ganesh is beautiful.", "bases": {"आहे": "to be", "गणपतीची": "Ganesh; the Ganesh festival", "मूर्ती": "statue"}}
    }
  "mr-0083":
    native: "me (m + the e sign)"
    notes:
      "n1": "The e sign above म (ma): मेथी (methi, fenugreek)."
    "examples": {
      "एकमेकांवर प्रेम करा.": {"native": "Love one another.", "bases": {"एकमेकांवर": "each other"}},
      "कॅमेऱ्यात फोटो काढला.": {"native": "I took a photo with the camera.", "bases": {"कॅमेऱ्यात": "camera"}}
    }
  "mr-0084":
    native: "mai (m + the ai sign)"
    notes:
      "n1": "The ai sign above म (ma): मैदान (maidān, open ground)."
    "examples": {
      "खेळाडू मैदानात उतरले.": {"native": "The players came onto the field.", "bases": {}},
      "बॉल मैदानाबाहेर गेला.": {"native": "The ball went out of the ground.", "bases": {}}
    }
  "mr-0085":
    native: "mo (m + the o sign)"
    notes:
      "n1": "The o sign on म (ma): मोर (mor, peacock)."
    "examples": {
      "मोबाईल वाजतोय.": {"native": "The mobile is ringing.", "bases": {"वाजतोय": "to ring"}},
      "कढई मोठी आहे.": {"native": "The wok is big.", "bases": {"मोठी": "big", "आहे": "to be"}}
    }
  "mr-0086":
    native: "mau (m + the au sign)"
    notes:
      "n1": "The au sign on म (ma): मौज (mauj, fun)."
