schema: 1
id: "mr-en-phrasebook"
kind: "layer"
core: "mr-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty phrases to say whole from the first day, before their words are taught: greetings and thanks, yes and no, your name, asking for Marathi to be slower, and asking for help. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC0-1.0"
cards:
  "mr-0144":
    native: "hello; goodbye"
    notes:
      "n1": "Said with palms pressed together, to anyone, at any time of day. Also नमस्ते (namaste)."
    bases:
      "नमस्कार": "hello; goodbye"
  "mr-0146":
    native: "How are you? (respectful)"
    notes:
      "n1": "To a friend: कसा आहेस? (kasa ahes?) to a man, कशी आहेस? (kashi ahes?) to a woman."
    bases:
      "आहात": "to be"
  "mr-0147":
    native: "I'm fine."
    notes:
      "n1": "Also मी बरा आहे (mi barā āhe) from a man, मी बरी आहे (mi bari āhe) from a woman."
    bases:
      "ठीक": "fine; all right"
      "आहे": "to be"
  "mr-0148":
    native: "thank you"
    notes:
      "n1": "Formal. Many people simply say थँक्यू (tham̐kyu), and among family thanks are often left out."
    bases:
      "धन्यवाद": "thank you"
  "mr-0149":
    native: "Thank you; I'm grateful."
    notes:
      "n1": "Warmer than धन्यवाद (dhanyavād): मी तुमचा आभारी आहे (mi tumcā ābhāri āhe), I'm grateful to you; a woman says आभारी (ābhāri) too."
    bases:
      "आभारी": "grateful"
      "आहे": "to be"
  "mr-0150":
    native: "OK; all right"
    notes:
      "n1": "In speech also बरं (baram̐): बरं (baram̐), येतो (bara, yeto), all right, I'll be off."
    bases:
      "ठीक": "fine; all right"
      "आहे": "to be"
  "mr-0151":
    native: "goodbye (said by a man leaving)"
    notes:
      "n1": "Literally 'I come': the one leaving says 'I'll come back'. A woman says येते (yete). A plain जातो (jāto), 'I go', can sound final."
    bases:
      "येतो": "to come"
  "mr-0156":
    native: "Sorry; excuse me."
    notes:
      "n1": "Literally 'please forgive'. Also सॉरी (sôri), from English."
    bases:
      "माफ": "sorry; pardon"
      "करा": "to do; to make"
  "mr-0157":
    native: "please"
    notes:
      "n1": "Formal and written, on signs and in letters. In speech the polite ending of the verb does the work: पाणी द्या (pāṇi dyā), some water, please."
    bases:
      "कृपया": "please"
  "mr-0168":
    native: "yes"
    notes:
      "n1": "होय (hoy) is a little more formal. Often just a nod, or the head tilted side to side."
    bases:
      "हो": "yes"
  "mr-0169":
    native: "no; not"
    notes:
      "n1": "Also 'there isn't': पाणी नाही (pāṇi nāhi), there's no water. After a verb it is 'not': मी जात नाही (mi jāt nāhi), I don't go."
    bases:
      "नाही": "no; not"
  "mr-0205":
    native: "My name is Anita."
    notes:
      "n1": "माझे (mājhe) agrees with नाव (nāv), which is neuter. Also simply मी अनिता (mi anitā), I'm Anita."
    bases:
      "माझे": "my"
      "अनिता": "Anita (a woman's name)"
      "आहे": "to be"
  "mr-0152":
    native: "I don't know Marathi."
    notes:
      "n1": "Literally 'Marathi does not come to me'."
    bases:
      "मराठी": "Marathi"
      "येत": "to come"
  "mr-0153":
    native: "I'm still learning Marathi."
    bases:
      "अजून": "still; yet"
      "मराठी": "Marathi"
      "शिकत": "to learn"
      "आहे": "to be"
  "mr-0154":
    native: "Please speak slowly."
    notes:
      "n1": "जरा (jarā), 'a little', softens a request, and the ending -आ (-ā) makes it polite: बसा (basā), please sit."
    bases:
      "जरा": "a little"
      "हळू": "slowly"
      "बोला": "to speak"
  "mr-0155":
    native: "Please say that again."
    bases:
      "पुन्हा": "again"
      "सांगा": "to say; to tell"
  "mr-0180":
    native: "I don't know."
    bases:
      "माहीत": "known"
  "mr-0603":
    native: "I don't feel well."
    bases:
      "बरे": "well"
      "वाटत": "to feel; to seem"
  "mr-0599":
    native: "I'm lost. (a man speaking)"
    notes:
      "n1": "A woman says हरवले (harvle). Or ask the way: मला रस्ता सापडत नाही (malā rastā sāpḍat nāhi), I can't find the way."
    bases:
      "हरवलो": "to lose; to be lost"
      "आहे": "to be"
  "mr-0594":
    native: "Help!"
    notes:
      "n1": "'Please help'. The emergency number in India is 112."
    bases:
      "मदत": "help"
      "करा": "to do; to make"
