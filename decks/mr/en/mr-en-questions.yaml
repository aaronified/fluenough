schema: 1
id: "mr-en-questions"
kind: "layer"
core: "mr-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Yes, no and questions"
license: "CC0-1.0"
description: "Yes and no, the question words, and how a sentence becomes a question. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0170":
    native: "what?"
    notes:
      "n1": "Also a mild 'what!' of surprise, and at the end of a sentence a question marker: तुम्ही येणार आहात काय (tumhi yeṇār āhāt kāy)?"
  "mr-0171":
    native: "who?"
    notes:
      "n1": "ण (ṇa) is curled back: kon."
  "mr-0172":
    native: "where?"
    notes:
      "n1": "Where to: कुठे जाता? (kuthe jata?), where are you going?"
  "mr-0173":
    native: "when?"
  "mr-0174":
    native: "why?"
    notes:
      "n1": "At the end of a sentence का (kā) makes a yes-or-no question instead: चहा घेणार का? (chaha ghenar ka?), will you have tea?"
  "mr-0175":
    native: "how?"
    notes:
      "n1": "It agrees with what it asks about: कसा (kasā) for a man, कशी (kaśi) for a woman, कसे (kase) for a thing or a respectful तुम्ही (tumhi)."
  "mr-0176":
    native: "how much? how many?"
    notes:
      "n1": "किती वाजले? (kiti vajle?), what time is it?"
  "mr-0177":
    native: "which?"
    notes:
      "n1": "Agrees with its noun: कोणता रस्ता (which road), कोणती बस (which bus), कोणते घर (which house)."
  "mr-0178":
    native: "What is this?"
    bases:
      "हे": "this"
      "आहे": "to be"
  "mr-0179":
    native: "Do you know?"
    notes:
      "n1": "'Is it known to you?': the one who knows takes -ला (-lā)."
    bases:
      "माहीत": "known"
      "आहे": "to be"
