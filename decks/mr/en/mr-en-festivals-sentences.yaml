cards:
  "mr-5640":
    native: "Everyone together celebrates Holi."
    bases: { "सगळे": "everyone", "मिळून": "together", "साजरी": "celebrated", "करतात": "do" }
    confusables: { "w1": { why: "I, not everyone: मी (mi) means I." }, "f1": { why: "Masculine: साजरा (sājrā) agrees with a masculine noun, not होळी (hoḷi), which is feminine." } }
  "mr-5641":
    native: "Today I drew a rangoli at home."
    bases: { "घरी": "at home", "काढली": "drew" }
    confusables: { "w1": { why: "He, not I: तो (to) means he, and मी (mi) means I." }, "f1": { why: "Masculine: काढला (kāḍhlā) agrees with a masculine thing, not रांगोळी (rāṅgoḷi), which is feminine." } }
  "mr-5642":
    native: "They eat festival snacks at home."
    bases: { "घरी": "at home", "खातात": "eat" }
    confusables: { "w1": { why: "She, not they: ती (ti) means she." }, "f1": { why: "Singular: खाते (khāte) is for one woman; ते (te) takes खातात (khātāt)." } }
  "mr-5643":
    native: "Tomorrow we will perform the puja."
    bases: { "करू": "will do" }
    confusables: { "w1": { why: "Yesterday, not tomorrow: काल (kāl) means yesterday." }, "f1": { why: "Past: केली (keli) is the past tense; the sentence is about tomorrow." } }
  "mr-5644":
    native: "On the festival they offer food to the god."
    bases: { "सणाला": "on the festival", "देवाला": "to the god", "दाखवतात": "offer" }
    confusables: { "w1": { why: "He, not they: तो (to) means he." }, "f1": { why: "One man: दाखवतो (dākhavto) is for one man; ते (te) takes दाखवतात (dākhavtāt)." } }
  "mr-5645":
    native: "The children burst a firecracker."
    bases: { "मुलांनी": "the children", "फोडला": "burst" }
    confusables: { "w1": { why: "Present, not past: फोडतात (phoḍtāt) is the present; the sentence is past." }, "f2": { why: "Plural: फटाके (phaṭāke) means several firecrackers; one is फटाका (phaṭākā)." } }
  "mr-5646":
    native: "After the puja everyone takes the prasad."
    bases: { "पूजेनंतर": "after the puja", "सगळे": "everyone", "घेतात": "take" }
    confusables: { "w1": { why: "Before, not after: आधी (ādhi) means before." }, "f1": { why: "One man: घेतो (gheto) is for one man; सगळे (sagḷe) takes घेतात (ghetāt)." } }
  "mr-5647":
    native: "Today is my birthday."
    bases: { "माझा": "my", "आहे": "is" }
    confusables: { "w1": { why: "I, not my: मी (mi) means I, and माझा (mājhā) means my." }, "f1": { why: "Feminine: माझी (mājhi) agrees with a feminine noun; वाढदिवस (vāḍhdivas) is masculine." } }
  "mr-5648":
    native: "Give everyone your good wishes."
    bases: { "सगळ्यांना": "everyone", "द्या": "give" }
    confusables: { "w1": { why: "Take, not give: घ्या (ghyā) means take." }, "f1": { why: "Past: दिली (dili) is the past; this sentence is an order." } }
  "mr-5649":
    native: "The procession will come now."
    bases: { "येईल": "will come" }
    confusables: { "w1": { why: "Go, not come: जाईल (jāil) means will go." }, "f1": { why: "Present: येते (yete) is present; the sentence is future." } }
  "mr-5650":
    native: "Everyone dances with joy."
    bases: { "आनंदाने": "with joy", "नाचतात": "dance" }
    confusables: { "w1": { why: "Cry, not dance: रडतात (raḍtāt) means they cry." }, "f1": { why: "One man: नाचतो (nācto) is for one man; सगळे (sagḷe) takes नाचतात (nāctāt)." } }
  "mr-5651":
    native: "This is a traditional dance."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "New, not traditional: नवीन (navin) means new." }, "w2": { why: "That or he, not this: तो (to) means he or that, while हे (he) means this." } }
  "mr-5652":
    native: "God gives joy."
    bases: { "देतो": "gives" }
    confusables: { "w1": { why: "Takes, not gives: घेतो (gheto) means takes." }, "f1": { why: "Feminine: देते (dete) agrees with a feminine subject; देव (dev) is masculine." } }
