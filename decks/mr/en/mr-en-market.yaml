schema: 1
id: "mr-en-market"
kind: "layer"
core: "mr-market"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Market"
license: "CC0-1.0"
description: "Asking the price, bargaining, paying: what a market stall needs. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0369":
    native: "How much does it come to?"
    notes:
      "n1": "'How much has it become?', when you have chosen and want to pay. For one thing: हे कितीला? (he kitila?), how much is this? होणे (hoṇe) changes its stem in the past: झा- (jhā-)."
    bases:
      "झाले": "to be; to become"
  "mr-0370":
    native: "price"
    notes:
      "n1": "The anusvar before म (ma) is said m: kimmat."
  "mr-0371":
    native: "rupee"
    notes:
      "n1": "More than one: रुपये (rupaye). शंभर रुपये (śambhar rupye), a hundred rupees."
  "mr-0372":
    native: "money"
    notes:
      "n1": "Plural, like 'funds': पैसे आहेत (paise āhet), there's money. One पैसा (paisā) is a hundredth of a rupee."
  "mr-0373":
    native: "change; small notes and coins"
    notes:
      "n1": "सुटे आहेत का? (sute ahet ka?), do you have change?"
    bases:
      "सुटे": "loose (of money, change)"
  "mr-0374":
    native: "That's too expensive!"
    notes:
      "n1": "खूप (khup) is 'very, a lot'. असणे (asṇe) changes its stem in the present: आह- (āh-)."
    bases:
      "खूप": "very; a lot"
      "आहे": "to be"
  "mr-0375":
    native: "Please lower it a little."
    notes:
      "n1": "The polite way to bargain: 'make it a little less'. Bargaining is expected at markets and stalls, not in shops with fixed prices."
    bases:
      "थोडे": "a little; some"
      "कमी": "less"
      "करा": "to do; to make"
  "mr-0376":
    native: "shop"
  "mr-0377":
    native: "please give (me)"
    notes:
      "n1": "एक किलो द्या (ek kilo dyā), a kilo, please. To a friend: दे (de)."
  "mr-0378":
    native: "kilo"
    notes:
      "n1": "अर्धा किलो (ardhā kilo), half a kilo; पाव किलो (pāv kilo), a quarter kilo."
  "mr-0379":
    native: "Nothing else."
    notes:
      "n1": "नको (nako) is 'don't want'. The seller will ask आणखी काही? (ankhi kahi?), anything else?"
    bases:
      "आणखी": "more; else"
      "काही": "some; anything"
  "mr-0380":
    native: "cheap"
  "mr-0381":
    native: "expensive"
  "mr-0382":
    native: "bag (for shopping)"
    notes:
      "n1": "Many shops charge for a plastic bag, so bring your own: पिशवी आहे (piśvi āhe), I have a bag."
  "mr-0383":
    native: "market"
    notes:
      "n1": "भाजी बाजार (bhāji bājār), the vegetable market. From Persian."
