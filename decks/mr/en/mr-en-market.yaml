schema: 1
id: "mr-en-market"
kind: "layer"
core: "mr-market"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Market"
license: "CC-BY-SA-4.0"
description: "Asking the price, bargaining, paying: what a market stall needs. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0369":
    native: "How much does it come to?"
    notes:
      "n1": "'How much has it become?', when you have chosen and want to pay. For one thing: हे कितीला? (he kitila?), how much is this? होणे (hoṇe) changes its stem in the past: झा- (jhā-)."
    bases:
      "झाले": "to be; to become"
  "mr-0370":
    native: "price"
    notes:
      "n1": "The anusvar before म (ma) is said m: kimmat."
    "examples": {
      "टॅग वर किंमत आहे.": {"native": "The price is on the tag.", "bases": {"आहे": "to be"}},
      "दागिन्यांची किंमत जास्त आहे.": {"native": "The jewellery's price is high.", "bases": {"जास्त": "high", "आहे": "to be", "दागिन्यांची": "jewellery, ornament", "किंमत": "price"}}
    }
  "mr-0371":
    native: "rupee"
    notes:
      "n1": "More than one: रुपये (rupaye). शंभर रुपये (śambhar rupye), a hundred rupees."
  "mr-0372":
    native: "money"
    notes:
      "n1": "Plural, like 'funds': पैसे आहेत (paise āhet), there's money. One पैसा (paisā) is a hundredth of a rupee."
    "examples": {
      "पैसे मोजा.": {"native": "Count the money.", "bases": {"मोजा": "to count"}}
    }
  "mr-0373":
    native: "change; small notes and coins"
    notes:
      "n1": "सुटे आहेत का? (sute ahet ka?), do you have change?"
    bases:
      "सुटे": "loose (of money, change)"
  "mr-0374":
    native: "That's too expensive!"
    notes:
      "n1": "खूप (khup) is 'very, a lot'. असणे (asṇe) changes its stem in the present: आह- (āh-)."
    bases:
      "खूप": "very; a lot"
      "आहे": "to be"
  "mr-0375":
    native: "Please lower it a little."
    notes:
      "n1": "The polite way to bargain: 'make it a little less'. Bargaining is expected at markets and stalls, not in shops with fixed prices."
    bases:
      "थोडे": "a little; some"
      "कमी": "less"
      "करा": "to do; to make"
  "mr-0376":
    native: "shop"
    "examples": {
      "ग्राहक दुकानात आले.": {"native": "Customers came into the shop.", "bases": {"दुकानात": "shop"}},
      "दुकान सकाळी उघडते.": {"native": "The shop opens in the morning.", "bases": {"सकाळी": "morning", "उघडते": "to open"}}
    }
  "mr-0377":
    native: "please give (me)"
    notes:
      "n1": "एक किलो द्या (ek kilo dyā), a kilo, please. To a friend: दे (de)."
    "examples": {
      "रोकड द्या.": {"native": "Give cash.", "bases": {}},
      "इडलीबरोबर चटणी द्या.": {"native": "Give chutney with the idli.", "bases": {"इडलीबरोबर": "with the idli", "द्या": "to give"}}
    }
  "mr-0378":
    native: "kilo"
    notes:
      "n1": "अर्धा किलो (ardhā kilo), half a kilo; पाव किलो (pāv kilo), a quarter kilo."
    "examples": {
      "मला अर्धा किलो तांदूळ हवा आहे.": {"native": "I want half a kilo of rice.", "bases": {"मला": "I", "आहे": "to be"}},
      "मला पाव किलो साखर हवी आहे.": {"native": "I want a quarter kilo of sugar.", "bases": {"मला": "I", "आहे": "to be"}}
    }
  "mr-0379":
    native: "Nothing else."
    notes:
      "n1": "नको (nako) is 'don't want'. The seller will ask आणखी काही? (ankhi kahi?), anything else?"
    bases:
      "आणखी": "more; else"
      "काही": "some; anything"
  "mr-0380":
    native: "cheap"
    "examples": {
      "इंटरनेट स्वस्त आहे.": {"native": "The internet is cheap.", "bases": {"आहे": "to be"}},
      "वांगी स्वस्त आहेत.": {"native": "Brinjals are cheap.", "bases": {"आहेत": "to be", "स्वस्त": "cheap"}}
    }
  "mr-0381":
    native: "expensive"
    "examples": {
      "खूप महाग आहे!": {"native": "That's too expensive!", "bases": {"खूप": "very; a lot", "आहे": "to be"}},
      "हा ड्रेस महाग आहे.": {"native": "This dress is expensive.", "bases": {"महाग": "expensive", "आहे": "to be"}}
    }
  "mr-0382":
    native: "bag (for shopping)"
    notes:
      "n1": "Many shops charge for a plastic bag, so bring your own: पिशवी आहे (piśvi āhe), I have a bag."
    "examples": {
      "तो पिशवी उचलतो.": {"native": "He picks up the bag.", "bases": {"उचलतो": "to lift"}},
      "तो पिशवी भरतो.": {"native": "He fills the bag.", "bases": {"भरतो": "to fill"}}
    }
  "mr-0383":
    native: "market"
    notes:
      "n1": "भाजी बाजार (bhāji bājār), the vegetable market. From Persian."
    "examples": {
      "ती बाजारात जाते.": {"native": "She goes to the market.", "bases": {"जाते": "to go", "बाजारात": "market"}}
    }
