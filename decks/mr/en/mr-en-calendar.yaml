schema: 1
id: "mr-en-calendar"
kind: "layer"
core: "mr-calendar"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Months and years"
license: "CC-BY-SA-4.0"
description: "The months as Marathi says them, the three seasons, the date, and the year's two great festivals. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0514":
    native: "month"
    notes:
      "n1": "पुढच्या महिन्यात (puḍhcyā mahinyāt), next month."
    "examples": {
      "महिन्याचं बजेट ठरवलं.": {"native": "I decided the monthly budget.", "bases": {"महिन्याचं": "month"}},
      "पुढच्या महिन्यात निवडणूक आहे.": {"native": "The election is next month.", "bases": {"पुढच्या": "next", "आहे": "to be", "महिन्यात": "month"}}
    }
  "mr-0515":
    native: "year"
    notes:
      "n1": "A year is read as a number: दोन हजार पंचवीस (don hajār pañcvis), 2025. या वर्षी (yā varṣi), this year."
    "examples": {
      "खटला पाच वर्षं चालला.": {"native": "The case went on for five years.", "bases": {"चालला": "to go on", "वर्षं": "year"}},
      "ती शंभर वर्षं जगली.": {"native": "She lived a hundred years.", "bases": {"जगली": "to live (be alive)", "वर्षं": "year"}}
    }
  "mr-0516":
    native: "January"
    notes:
      "n1": "The months are the English ones, said the Marathi way. The traditional months (चैत्र (caitr), वैशाख (vaiśākh) …) are used for festivals."
  "mr-0517":
    native: "February"
  "mr-0518":
    native: "March"
  "mr-0519":
    native: "April"
  "mr-0520":
    native: "May"
    notes:
      "n1": "The hottest month, before the monsoon."
  "mr-0521":
    native: "June"
    notes:
      "n1": "The monsoon usually reaches Maharashtra in June."
    "examples": {
      "मान्सून जूनमध्ये येतो.": {"native": "The monsoon comes in June.", "bases": {"जूनमध्ये": "in June"}}
    }
  "mr-0522":
    native: "July"
  "mr-0523":
    native: "August"
    "examples": {
      "१५ ऑगस्टला स्वातंत्र्य दिवस साजरा होतो.": {"native": "Independence Day is celebrated on the 15th of August.", "bases": {"होतो": "to be", "ऑगस्टला": "August"}}
    }
  "mr-0524":
    native: "September"
  "mr-0525":
    native: "October"
  "mr-0526":
    native: "November"
    notes:
      "n1": "Marathi writes English v as व्ह (vh), said as a plain v."
    "examples": {
      "माझा भाऊ नोव्हेंबरमध्ये जन्मला.": {"native": "My brother was born in November.", "bases": {"जन्मला": "to be born", "नोव्हेंबरमध्ये": "November"}}
    }
  "mr-0527":
    native: "December"
  "mr-0528":
    native: "date"
    notes:
      "n1": "आज काय तारीख आहे? (aj kay tarikh ahe?), what's the date today?"
    "examples": {
      "पावतीवर तारीख आहे.": {"native": "The receipt has the date on it.", "bases": {"आहे": "to be", "पावतीवर": "receipt"}},
      "लग्नाची तारीख ठरवली.": {"native": "We fixed the wedding date.", "bases": {"ठरवली": "to fix, to decide", "तारीख": "date"}}
    }
  "mr-0529":
    native: "summer; the hot season"
    notes:
      "n1": "Roughly March to May."
    "examples": {
      "उन्हाळ्यात पाणीटंचाई असते.": {"native": "There is water shortage in summer.", "bases": {"असते": "to be", "उन्हाळ्यात": "summer; the hot season"}},
      "उन्हाळ्यात सरबत प्या.": {"native": "Drink sherbet in summer.", "bases": {"उन्हाळ्यात": "in summer", "प्या": "to drink"}}
    }
  "mr-0530":
    native: "the rainy season; the monsoon"
    notes:
      "n1": "From पाऊस (pāus), rain: पाऊस पडतोय (pāus paḍtoy), it's raining."
    "examples": {
      "पावसाळ्यात पेरणी होते.": {"native": "Sowing is done in the monsoon.", "bases": {"होते": "to be", "पावसाळ्यात": "rainy season; the monsoon"}},
      "पावसाळ्यात खूप पाऊस असतो.": {"native": "There is a lot of rain in the monsoon.", "bases": {"असतो": "to be", "पावसाळ्यात": "in the monsoon"}}
    }
  "mr-0531":
    native: "winter; the cool season"
  "mr-0532":
    native: "Gudi Padwa, the Marathi new year"
    notes:
      "n1": "The first day of the month of चैत्र (caitr), in March or April, when a गुढी (guḍhi), a pole dressed with cloth and a pot, is raised outside homes."
  "mr-0533":
    native: "Diwali"
    notes:
      "n1": "With the curled-back ळ (ḷa). दिवाळीच्या शुभेच्छा! (divalichya shubhechchha!), happy Diwali!"
    "examples": {
      "दिवाळीत करंजी खाते.": {"native": "I eat karanji at Diwali.", "bases": {"दिवाळीत": "Diwali"}},
      "दिवाळीला पुरणपोळी करतात.": {"native": "They make puran poli at Diwali.", "bases": {"दिवाळीला": "at Diwali", "करतात": "to do"}}
    }
