schema: 1
id: "mr-en-clothes"
kind: "layer"
core: "mr-clothes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Clothes and colours"
license: "CC-BY-SA-4.0"
description: "Clothes, and the colours and sizes that go with them. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-0865":
    native: "shirt"
    notes:
      "n1": "A shirt is worn on the top: शर्ट घालणे (śarṭ ghālṇe), to wear a shirt."
    examples:
      "हा शर्ट नवीन आहे.": { native: "This shirt is new.", bases: { "नवीन": "new", "आहे": "to be" } }
      "त्याने निळा शर्ट घातला.": { native: "He wore a blue shirt.", bases: { "घातला": "to wear" } }
  "mr-0866":
    native: "trousers"
    notes:
      "n1": "Trousers: पँट (pam̐ṭ), a loan word; they are worn with a शर्ट (śarṭ), a shirt."
    examples:
      "माझी पँट लांब आहे.": { native: "My trousers are long.", bases: { "माझी": "my", "आहे": "to be" } }
      "ती पँट धुते.": { native: "She washes the trousers.", bases: { "धुते": "to wash" } }
  "mr-0867":
    native: "sari"
    notes:
      "n1": "A sari is worn by women: साडी नेसणे (sāḍi nesṇe), to wear a sari."
    examples:
      "आई लाल साडी घालते.": { native: "Mother wears a red sari.", bases: { "लाल": "red", "घालते": "to wear" } }
      "साडी सुंदर आहे.": { native: "The sari is beautiful.", bases: { "सुंदर": "beautiful", "आहे": "to be" } }
  "mr-0868":
    native: "dress"
    notes:
      "n1": "A dress is ड्रेस (ḍres), a loan word, worn by girls and women."
    examples:
      "हा ड्रेस महाग आहे.": { native: "This dress is expensive.", bases: { "महाग": "expensive", "आहे": "to be" } }
      "मुलीने पिवळा ड्रेस घातला.": { native: "The girl wore a yellow dress.", bases: { "मुलीने": "girl", "घातला": "to wear" } }
  "mr-0869":
    native: "kurta"
    notes:
      "n1": "A long shirt worn with पँट (pam̐ṭ), trousers, is a kurta."
    examples:
      "हा कुर्ता पांढरा आहे.": { native: "This kurta is white.", bases: { "पांढरा": "white", "आहे": "to be" } }
      "माझा कुर्ता मोठा आहे.": { native: "My kurta is big.", bases: { "माझा": "my", "मोठा": "big", "आहे": "to be" } }
  "mr-0870":
    native: "socks"
    notes:
      "n1": "Socks: मोजे (moje), worn with बूट (buṭ), boots."
    examples:
      "माझे मोजे कुठे आहेत?": { native: "Where are my socks?", bases: { "माझे": "my", "कुठे": "where", "आहेत": "to be" } }
      "हे मोजे स्वच्छ आहेत.": { native: "These socks are clean.", bases: { "हे": "this", "स्वच्छ": "clean", "आहेत": "to be" } }
  "mr-0871":
    native: "boots; shoes"
    notes:
      "n1": "Boots are worn outside, so बाहेर (bāher) is their place word."
    examples:
      "माझे बूट जड आहेत.": { native: "My boots are heavy.", bases: { "माझे": "my", "जड": "heavy", "आहेत": "to be" } }
      "बूट बाहेर ठेवा.": { native: "Put the boots outside.", bases: { "बाहेर": "outside", "ठेवा": "to keep" } }
  "mr-0872":
    native: "slipper; sandal"
    notes:
      "n1": "Slippers are worn at home: घरात (gharāt), at home."
    examples:
      "चप्पल दारात आहे.": { native: "The slippers are at the door.", bases: { "दारात": "at the door", "आहे": "to be" } }
      "त्याची चप्पल तुटली.": { native: "His slipper broke.", bases: { "त्याची": "he", "तुटली": "to break" } }
  "mr-0873":
    native: "sweater"
    notes:
      "n1": "A sweater for the cold: थंडी (thaṇḍi), cold weather."
    examples:
      "थंडी आहे, स्वेटर घाला.": { native: "It is cold; wear a sweater.", bases: { "थंडी": "cold", "आहे": "to be", "घाला": "to wear" } }
      "हा स्वेटर उबदार आहे.": { native: "This sweater is warm.", bases: { "उबदार": "warm", "आहे": "to be" } }
  "mr-0874":
    native: "jacket"
    notes:
      "n1": "A jacket is जॅकेट (jêkeṭ), a loan word, worn over a shirt."
    examples:
      "हे जॅकेट महाग आहे.": { native: "This jacket is expensive.", bases: { "महाग": "expensive", "आहे": "to be" } }
      "पावसात जॅकेट वापरा.": { native: "Use a jacket in the rain.", bases: { "पावसात": "in the rain", "वापरा": "to use" } }
  "mr-0875":
    native: "coat"
    notes:
      "n1": "A coat is worn in winter, हिवाळ्यात (hivāḷyāt); the season is हिवाळा (hivāḷā), winter."
    examples:
      "त्याचा कोट काळा आहे.": { native: "His coat is black.", bases: { "त्याचा": "he", "काळा": "black", "आहे": "to be" } }
      "तिने कोट घातला.": { native: "She put on a coat.", bases: { "घातला": "to wear" } }
  "mr-0876":
    native: "handkerchief"
    notes:
      "n1": "A handkerchief: रुमाल (rumāl) is used to wipe the face."
    examples:
      "हा रुमाल स्वच्छ आहे.": { native: "This handkerchief is clean.", bases: { "स्वच्छ": "clean", "आहे": "to be" } }
      "मला रुमाल द्या.": { native: "Give me a handkerchief.", bases: { "मला": "I", "द्या": "to give" } }
  "mr-0877":
    native: "belt"
    notes:
      "n1": "A belt for the trousers: कमरेला (kamrelā), at the waist."
    examples:
      "बेल्ट लहान आहे.": { native: "The belt is small.", bases: { "लहान": "small", "आहे": "to be" } }
      "बेल्ट कमरेला बांधा.": { native: "Tie the belt at the waist.", bases: { "कमरेला": "at the waist", "बांधा": "to tie" } }
  "mr-0878":
    native: "scarf; dupatta"
    notes:
      "n1": "A long scarf worn with a kurta: ओढणी घेणे (oḍhṇi gheṇe), to take a scarf."
    examples:
      "ओढणी लांब आहे.": { native: "The scarf is long.", bases: { "लांब": "long", "आहे": "to be" } }
      "ती गुलाबी ओढणी घेते.": { native: "She takes a pink scarf.", bases: { "गुलाबी": "pink", "घेते": "to take" } }
  "mr-0879":
    native: "ring"
    notes:
      "n1": "A ring is jewellery: सोन्याची अंगठी (sonyāci aṅgaṭhi), a gold ring."
    examples:
      "ही अंगठी सोन्याची आहे.": { native: "This ring is gold.", bases: { "सोन्याची": "gold", "आहे": "to be" } }
      "त्याने अंगठी हरवली.": { native: "He lost the ring.", bases: { "हरवली": "to lose" } }
  "mr-0880":
    native: "red"
    notes:
      "n1": "लाल (lāl) does not change for gender."
    examples:
      "हे फूल लाल आहे.": { native: "This flower is red.", bases: { "फूल": "flower", "आहे": "to be" } }
      "लाल रंग छान आहे.": { native: "Red is a nice colour.", bases: { "रंग": "colour", "आहे": "to be" } }
  "mr-0881":
    native: "blue"
    notes:
      "n1": "Neuter निळे (niḷe), blue, as in निळे आकाश (niḷe ākāś), the blue sky."
    examples:
      "आकाश निळे आहे.": { native: "The sky is blue.", bases: { "आकाश": "sky", "निळे": "blue", "आहे": "to be" } }
      "हा शर्ट निळा आहे.": { native: "This shirt is blue.", bases: { "आहे": "to be" } }
  "mr-0882":
    native: "green"
    notes:
      "n1": "Feminine हिरवी (hirvi), neuter हिरवे (hirve)."
    examples:
      "झाड हिरवे आहे.": { native: "The tree is green.", bases: { "झाड": "tree", "हिरवे": "green", "आहे": "to be" } }
      "हिरवी भाजी ताजी आहे.": { native: "The green vegetable is fresh.", bases: { "हिरवी": "green", "भाजी": "vegetable", "ताजी": "fresh", "आहे": "to be" } }
  "mr-0883":
    native: "yellow"
    notes:
      "n1": "Neuter पिवळे (pivḷe), feminine पिवळी (pivḷi)."
    examples:
      "केळे पिवळे आहे.": { native: "The banana is yellow.", bases: { "पिवळे": "yellow", "आहे": "to be" } }
      "पिवळी फुले सुंदर आहेत.": { native: "The yellow flowers are beautiful.", bases: { "पिवळी": "yellow", "फुले": "flowers", "आहेत": "to be" } }
  "mr-0884":
    native: "white"
    notes:
      "n1": "Feminine पांढरी (pāṇḍhari), neuter पांढरे (pāṇḍhare)."
    examples:
      "दूध पांढरे आहे.": { native: "Milk is white.", bases: { "पांढरे": "white", "आहे": "to be" } }
      "पांढरी चादर स्वच्छ आहे.": { native: "The white sheet is clean.", bases: { "पांढरी": "white", "स्वच्छ": "clean", "आहे": "to be" } }
  "mr-0885":
    native: "black"
    notes:
      "n1": "Feminine काळी (kāḷi), neuter काळे (kāḷe)."
    examples:
      "कुत्रा काळा आहे.": { native: "The dog is black.", bases: { "कुत्रा": "dog", "आहे": "to be" } }
      "काळी मांजर घरात आहे.": { native: "The black cat is in the house.", bases: { "काळी": "black", "मांजर": "cat", "घरात": "in the house", "आहे": "to be" } }
  "mr-0886":
    native: "pink"
    notes:
      "n1": "गुलाबी (gulābi) is pink. It is made from गुलाब (gulāb), rose, and it does not change for gender or number."
    examples:
      "हा फ्रॉक गुलाबी आहे.": { native: "This frock is pink.", bases: { "फ्रॉक": "frock", "आहे": "to be" } }
      "गुलाबी रंग मला आवडतो.": { native: "I like pink.", bases: { "रंग": "colour", "मला": "I" } }
  "mr-0887":
    native: "medium"
    notes:
      "n1": "For sizes: मध्यम आकार (madhyam ākār), a medium size."
    examples:
      "माझ्यासाठी मध्यम आकार योग्य आहे.": { native: "A medium size suits me.", bases: { "माझ्यासाठी": "me", "आकार": "size", "योग्य": "suitable", "आहे": "to be" } }
      "मला मध्यम आकाराचा शर्ट हवा आहे.": { native: "I want a medium-size shirt.", bases: { "मला": "I", "आकाराचा": "of size", "आहे": "to be" } }
  "mr-1001":
    native: "Colours: seven words"
    explanation: "Seven colour words, each a word of its own: लाल (lāl), red; निळा (niḷā), blue; हिरवा (hirvā), green; पिवळा (pivḷā), yellow; पांढरा (pāṇḍharā), white; काळा (kāḷā), black; गुलाबी (gulābi), pink."
