id: "mr-en-multiword-5"
kind: "layer"
core: "mr-multiword-5"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: dative subjects"
description: "Phrases where the one who feels, wants or gets something takes -ला (-lā), as मला (malā) and तिला (tilā) do, and the verb agrees with what is felt or wanted. Sentences are from the pages the phrases come from. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-4435":
    native: "I felt bad."
    notes:
      "u1": "The experiencer takes -ला (-lā), and वाटले (vāṭle) is the past of वाटणे (vāṭṇe), to feel. A sentence: काल (kāl) मला (malā) खूप (khup) वाईट (vāiṭ) वाटले (vāṭle)."
    bases:
      "वाटले": "to feel, think"
  "mr-4436":
    native: "She felt better."
    notes:
      "u1": "The experiencer takes -ला (-lā): तिला (tilā) is the -ला (-lā) form of ती (ti), she. A sentence: गरम (garam) पाण्याने (pāṇyāne) आंघोळ (āṅghoḷ) केल्यावर (kelyāvar) तिला (tilā) बरे (bare) वाटले (vāṭle)."
    bases:
      "वाटले": "to feel, think"
  "mr-4437":
    native: "It seems incomprehensible to me."
    notes:
      "u1": "The experiencer takes -ला (-lā), and वाटते (vāṭte) is the present of वाटणे (vāṭṇe); here it means seems. A sentence: त्याचे (tyāce) वागणे (vāgṇe) मला (malā) अगोचर (agocar) वाटते (vāṭte)."
    bases:
      "वाटते": "to feel, think"
  "mr-4438":
    native: "I get motion sick."
    notes:
      "u1": "The experiencer takes -ला (-lā). A sentence: मला (malā) गाडी (gāḍi) लागते (lāgte), म्हणून (mhaṇun) मी (mi) प्रवासात (pravāsāt) खिडकीजवळ (khiḍkijvaḷ) बसतो (basto)."
  "mr-4439":
    native: "The children got bored."
    notes:
      "u1": "The experiencer takes -ला (-lā) or its plural form, as मुलांना (mulānnā) does. A sentence: दवाखान्यात (davākhānyāt) वाट (vāṭ) पाहत (pāhat) असताना (astānā) मुलांना (mulānnā) प्रचंड (pracaṇḍ) कंटाळा (kaṇṭāḷā) आला (ālā)."
  "mr-4440":
    native: "I want coffee."
    notes:
      "u1": "The experiencer takes -ला (-lā). The page's sentence is this phrase; पाहिजे (pāhije) is taught in the needs deck."
  "mr-4441":
    native: "She feels nauseous."
    notes:
      "u1": "The experiencer takes -ला (-lā): तिला (tilā) is the -ला (-lā) form of ती (ti), she. A sentence: पित्त (pitt) झाल्यामुळे (jhālyāmuḷe) तिला (tilā) आज (āj) मळमळते (maḷmḷte)."
  "mr-4442":
    native: "I am able to work."
    notes:
      "u1": "The experiencer takes -ला (-lā). A sentence: मला (malā) आता (ātā) काम (kām) करवते (karvte)."
  "mr-4443":
    native: "I can walk (20 km)."
    notes:
      "u1": "The experiencer takes -ला (-lā). A sentence with a distance: मला (malā) दररोज (darroj) 20 कि.मी. (ki.mi.) चालविते (cālvite)."
  "mr-4444":
    native: "The teacher cannot carry them."
    notes:
      "u1": "The experiencer takes -ला (-lā) or its plural form. A sentence: बाईंना (bāinnā) वह्या (vahyā) वर्गात (vargāt) आणवत (āṇvat) नाही (nāhi)."
  "mr-4445":
    native: "The sick man can sit."
    notes:
      "u1": "The experiencer takes -ला (-lā). A sentence: त्या (tyā) आजारी (ājāri) माणसाला (māṇsālā) आता (ātā) थोडे (thoḍe) बसवते (basvte)."
  "mr-4446":
    native: "A person gains sense."
    notes:
      "u1": "The experiencer takes -ला (-lā). The phrase comes from a proverb: आधी (ādhi) जाते (jāte) अक्कल (akkal) मग (mag) सुचते (sucte) शहाणपण (śahāṇpaṇ)."
  "mr-4447":
    native: "He took a fancy."
    notes:
      "u1": "The experiencer takes -ला (-lā). The page's sentence, from a proverb: त्याला (tyālā) गाडी (gāḍi) फिरवायची (phirvāyci) हौस (haus) आली (āli)."
