schema: 1
id: "mr-en-verbs"
kind: "layer"
core: "mr-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Everyday verbs"
license: "CC-BY-SA-4.0"
description: "The verbs of the day: getting up, eating, going, speaking, giving and taking. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-0708":
    native: "to eat"
    notes:
      "n1": "Its past stem is खाल- (khāl-), from खाणे (khāṇe): त्याने आंबा खाल्ला (tyāne āmbā khallā), he ate a mango."
    examples:
      "तो भात खातो.": { native: "He eats rice.", bases: { "खातो": "to eat" } }
      "मुले आंबे खातात.": { native: "The children eat mangoes.", bases: { "खातात": "to eat" } }
  "mr-0709":
    native: "to drink"
    notes:
      "n1": "Its past stem is प्य- (py-), from पिणे (piṇe): ती दूध प्यायली (ti dudh pyāyali), she drank milk."
    examples:
      "ती दूध पिते.": { native: "She drinks milk.", bases: { "पिते": "to drink" } }
      "तो रोज चहा पितो.": { native: "He drinks tea every day.", bases: { "पितो": "to drink" } }
  "mr-0710":
    native: "to go"
    notes:
      "n1": "Its past stem is गेल- (gel-), from जाणे (jāṇe): तो शाळेत गेला (to śāḷet gelā), he went to school."
    examples:
      "तो शाळेत जातो.": { native: "He goes to school.", bases: { "शाळेत": "school", "जातो": "to go" } }
      "ती बाजारात जाते.": { native: "She goes to the market.", bases: { "जाते": "to go" } }
  "mr-0711":
    native: "to come"
    notes:
      "n1": "Its past stem is आल- (āl-), from येणे (yeṇe): तो आला (to ālā), he came."
    examples:
      "तो उद्या येईल.": { native: "He will come tomorrow.", bases: { "येईल": "to come" } }
      "ती लवकर घरी येते.": { native: "She comes home early.", bases: { "येते": "to come" } }
  "mr-0712":
    native: "to do; to make"
    notes:
      "n1": "Many verbs are a noun and करणे (karṇe): काम करणे (kām karṇe), to work."
    examples:
      "तो रोज काम करतो.": { native: "He works every day.", bases: { "करतो": "to do" } }
      "ती उद्या काम करणार आहे.": { native: "She will work tomorrow.", bases: { "करणार": "to do", "आहे": "to be" } }
  "mr-0713":
    native: "to speak; to talk"
    notes:
      "n1": "With a language's name it means to speak it: मी इंग्रजी बोलतो (mi iṅgraji bolto), I speak English."
    examples:
      "ती फोनवर बोलते.": { native: "She talks on the phone.", bases: { "फोनवर": "phone", "बोलते": "to speak" } }
      "तो माझ्याशी बोलतो.": { native: "He talks to me.", bases: { "माझ्याशी": "I", "बोलतो": "to speak" } }
  "mr-0714":
    native: "to see; to look at; to watch"
    notes:
      "n1": "With टीव्ही (ṭivhi), TV, it means to watch TV: टीव्ही पाहणे (ṭivhi pāhṇe)."
    examples:
      "तो चित्र पाहतो.": { native: "He looks at the picture.", bases: { "चित्र": "picture", "पाहतो": "to see" } }
      "मुले टीव्ही पाहतात.": { native: "The children watch TV.", bases: { "टीव्ही": "TV", "पाहतात": "to see" } }
  "mr-0715":
    native: "to hear; to listen"
    notes:
      "n1": "Its past for a woman is ऐकली (aikli), she heard; for a man ऐकला (aiklā), he heard."
    examples:
      "ती संगीत ऐकते.": { native: "She listens to music.", bases: { "संगीत": "music", "ऐकते": "to hear" } }
      "तो रेडिओ ऐकतो.": { native: "He listens to the radio.", bases: { "रेडिओ": "radio", "ऐकतो": "to hear" } }
  "mr-0716":
    native: "to write"
    notes:
      "n1": "A letter is पत्र (patr): पत्र लिहिणे (patr lihiṇe), to write a letter."
    examples:
      "ती पत्र लिहिते.": { native: "She writes a letter.", bases: { "पत्र": "letter", "लिहिते": "to write" } }
      "तो रोज डायरी लिहितो.": { native: "He writes in his diary every day.", bases: { "डायरी": "diary", "लिहितो": "to write" } }
  "mr-0717":
    native: "to learn"
    notes:
      "n1": "With a language it means to learn that language: मराठी शिकणे (marāṭhi śikṇe), to learn Marathi."
    examples:
      "ती मराठी शिकते.": { native: "She learns Marathi.", bases: { "मराठी": "Marathi", "शिकते": "to learn" } }
      "मुले शाळेत शिकतात.": { native: "The children learn at school.", bases: { "शाळेत": "school", "शिकतात": "to learn" } }
  "mr-0718":
    native: "to teach"
    notes:
      "n1": "It is the causative of शिकणे (śikṇe), to learn: it means to teach."
    examples:
      "ती शाळेत शिकवते.": { native: "She teaches at school.", bases: { "शाळेत": "school", "शिकवते": "to teach" } }
      "ते मुलांना गणित शिकवतात.": { native: "They teach the children maths.", bases: { "गणित": "mathematics", "शिकवतात": "to teach" } }
  "mr-0719":
    native: "to understand"
    notes:
      "n1": "Its past for a woman is समजली (samjli), she understood; for a man समजला (samjlā), he understood."
    examples:
      "मला समजले.": { native: "I understood.", bases: { "मला": "I", "समजले": "to understand" } }
      "तू मराठी समजतोस का?": { native: "Do you understand Marathi?", bases: { "मराठी": "Marathi", "समजतोस": "to understand", "का": "question word" } }
  "mr-0720":
    native: "to tell; to say"
    notes:
      "n1": "Telling a story is गोष्ट सांगणे (goṣṭ sāṅgaṇe)."
    examples:
      "आई मुलांना गोष्ट सांगते.": { native: "Mother tells the children a story.", bases: { "गोष्ट": "story", "सांगते": "to tell" } }
      "कृपया मला पत्ता सांगा.": { native: "Please tell me the address.", bases: { "कृपया": "please", "मला": "I", "पत्ता": "address", "सांगा": "to tell" } }
  "mr-0721":
    native: "to give"
    notes:
      "n1": "Its past stem is दिल- (dil-), from देणे (deṇe): दिला (dilā), he gave; दिली (dili), she gave."
    examples:
      "मी तुला पुस्तक देतो.": { native: "I give you a book.", bases: { "मी": "I", "देतो": "to give" } }
      "ती मुलाला चॉकलेट देते.": { native: "She gives the boy a chocolate.", bases: { "चॉकलेट": "chocolate", "देते": "to give" } }
  "mr-0722":
    native: "to take"
    notes:
      "n1": "Its past is घेतला (ghetlā), he took; a woman says घेतली (ghetli), she took."
    examples:
      "मी चहा घेतो.": { native: "I have tea.", bases: { "मी": "I", "घेतो": "to take" } }
      "ती छत्री घेते.": { native: "She takes an umbrella.", bases: { "छत्री": "umbrella", "घेते": "to take" } }
  "mr-0723":
    native: "to keep; to put down"
    notes:
      "n1": "To put something in the fridge: फ्रिजमध्ये ठेवणे (phrijmadhye ṭhevṇe), to keep in the fridge."
    examples:
      "दूध फ्रिजमध्ये ठेवा.": { native: "Keep the milk in the fridge.", bases: { "फ्रिजमध्ये": "fridge", "ठेवा": "to keep" } }
      "त्याने पैसे कपाटात ठेवले.": { native: "He put the money in the cupboard.", bases: { "कपाटात": "cupboard", "ठेवले": "to keep" } }
  "mr-0724":
    native: "to open"
    notes:
      "n1": "Its opposite is बंद करणे (band karṇe), to close (mr-0539)."
    examples:
      "दुकान सकाळी उघडते.": { native: "The shop opens in the morning.", bases: { "सकाळी": "morning", "उघडते": "to open" } }
      "त्याने दार उघडले.": { native: "He opened the door.", bases: { "उघडले": "to open" } }
  "mr-0725":
    native: "to play"
    notes:
      "n1": "A game is खेळ (kheḷ), and खेळणे (kheḷṇe) is to play it."
    examples:
      "मुले अंगणात खेळतात.": { native: "The children play in the yard.", bases: { "अंगणात": "yard", "खेळतात": "to play" } }
      "ती रोज संध्याकाळी खेळते.": { native: "She plays every evening.", bases: { "संध्याकाळी": "evening", "खेळते": "to play" } }
