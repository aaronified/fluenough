schema: 1
id: "mr-en-grammar-adjectives"
kind: "layer"
core: "mr-grammar-adjectives"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing words"
license: "CC0-1.0"
description: "Big, good, new: a describing word that ends in -आ (-ā) agrees with its noun in three genders. Others never change. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "Adjective agreement"
  slot_name: "agreement"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "mothaa": "big; older"
    "chhotaa": "small; little"
    "chaanglaa": "good"
    "navaa": "new"
    "junaa": "old (of things)"
    "kaalaa": "black"
    "paandhraa": "white"
    "pivlaa": "yellow"
    "hirvaa": "green"
    "taajaa": "fresh"
  notes: "A describing word in -आ (-ā) changes with its noun: मोठा मुलगा (moṭhā mulgā), a big boy; मोठी मुलगी (moṭhi mulgi), a big girl; मोठे घर (moṭhe ghar), a big house; मोठे मुलगे (moṭhe mulge), big boys; मोठ्या मुली (moṭhyā muli), big girls. Before a noun with an ending, every gender takes -्या (-yā): मोठ्या घरात (moṭhyā gharāt), in a big house. A neuter plural takes -ई (-i): मोठी घरे (moṭhi ghare). Words that don't end in -आ (-ā) never change: लाल (red), सुंदर (beautiful), छान (nice), गरम (hot), थंड (cold), महाग (expensive)."
