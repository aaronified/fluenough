schema: 1
id: "mr-en-grammar-postpositions"
kind: "layer"
core: "mr-grammar-postpositions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Endings and postpositions"
license: "CC0-1.0"
description: "In, to, from, with, for: words after the noun, which Marathi writes joined to it. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0433":
    native: "at home; home"
    notes:
      "n1": "An old ending, -ई (-i), kept for home: मी घरी आहे (mi ghari āhe), I'm at home; मी घरी जातो (mi ghari jāto), I'm going home."
  "mr-0434":
    native: "in the market; to the market"
    notes:
      "n1": "-त (-ta) is 'in', and with a verb of going 'into': बाजारात जा (bājārāt jā), go to the market. बाजार (bājār) adds -ा- (ā) before it."
  "mr-0435":
    native: "on the table"
    notes:
      "n1": "-वर (-var) is 'on': टेबल (ṭebal) + -ा- (ā) + -वर (-var). Its opposite is -खाली (-khāli), under: टेबलाखाली (ṭeblākhāli)."
  "mr-0436":
    native: "to Pune"
    notes:
      "n1": "-ला (-lā) is 'to' a place. पुणे (puṇe) changes to पुण्या- (puṇyā-) before an ending."
  "mr-0437":
    native: "from Mumbai"
    notes:
      "n1": "-हून (-hun) is 'from' a place. After a noun ending in a consonant it is often -ऊन (-un): घरून (gharun), from home."
  "mr-0438":
    native: "by bus"
    notes:
      "n1": "-ने (-ne) is 'by, with' a means: हाताने (hātāne), by hand."
  "mr-0439":
    native: "for me"
    notes:
      "n1": "-साठी (-sāṭhi) is 'for'. A pronoun takes its possessive stem: माझ्या- (mājhyā-), तुझ्या- (tujhyā-), तुमच्या- (tumacyā-)."
  "mr-0440":
    native: "with you"
    notes:
      "n1": "-बरोबर (-barobar) is 'with, together with'. Also -सोबत (sobat)."
  "mr-0441":
    native: "near the house"
    notes:
      "n1": "-जवळ (-javaḷ) is 'near'. Likewise -समोर (-samor), opposite; -मागे (-māge), behind."
  "mr-0442":
    native: "after the meal"
    notes:
      "n1": "-नंतर (-nantar) is 'after', and -आधी (-ādhi) 'before': जेवणाआधी (jevaṇāādhi), before the meal."
  "mr-0443":
    native: "since the morning"
    notes:
      "n1": "-पासून (-pāsun) is 'since, from': कालपासून (kālpāsun), since yesterday."
  "mr-0444":
    native: "until tomorrow"
    notes:
      "n1": "-पर्यंत (-paryant) is 'until, as far as': स्टेशनपर्यंत (sṭeśnparyant), as far as the station."
  "mr-0445":
    native: "with him (to talk, to deal)"
    notes:
      "n1": "-शी (-śi) is 'with' for talking, meeting and quarrelling: मी त्याच्याशी बोलतो (mi tyācyāśi bolto), I talk with him."
