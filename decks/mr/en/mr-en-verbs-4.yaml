schema: 1
id: "mr-en-verbs-4"
kind: "layer"
core: "mr-verbs-4"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs 4"
description: "Verbs for changing things: to break, to pour, to dry, to soak, to hide and to spill, with the verbs of growing up and living. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-1698":
    native: "to look after, to manage"
    notes:
      "n1": "{1} is caring for someone or keeping something in order."
    examples:
      "आजी नातवाला सांभाळते.": { native: "Grandmother looks after the grandchild.", bases: { "नातवाला": "the grandchild", "सांभाळते": "to look after, to manage" } }
      "घर नीट सांभाळा.": { native: "Look after the house well.", bases: { "सांभाळा": "to look after, to manage" } }
  "mr-1699":
    native: "to catch fire, to burn"
    notes:
      "n1": "{1} is starting to burn, or lighting up."
    examples:
      "चूल पेटली.": { native: "The stove was lit.", bases: { "पेटली": "to catch fire, to burn" } }
      "दिवा पेटवा.": { native: "Light the lamp.", bases: { "पेटवा": "to light" } }
  "mr-1700":
    native: "to go out (fire, light)"
    notes:
      "n1": "{1} is a fire or light going out."
    examples:
      "आग विझली.": { native: "The fire went out.", bases: { "विझली": "to go out (fire, light)" } }
      "दिवा विझवून झोप.": { native: "Put out the lamp and sleep.", bases: { "विझवून": "to put out" } }
  "mr-1701":
    native: "to break, to cut off"
    notes:
      "n1": "{1} is breaking something into pieces or cutting it off."
    examples:
      "फांदी तोडली.": { native: "I broke a branch.", bases: { "फांदी": "branch", "तोडली": "to break, to cut off" } }
      "त्याने काच तोडली.": { native: "He broke the glass.", bases: { "काच": "glass", "तोडली": "to break, to cut off" } }
  "mr-1702":
    native: "to break open, to crack"
    notes:
      "n1": "{1} is breaking something open, such as a nut or an egg."
    examples:
      "नारळ फोडला.": { native: "I broke the coconut.", bases: { "नारळ": "coconut", "फोडला": "to break open, to crack" } }
      "अंडं फोडून पाहा.": { native: "Break the egg open and see.", bases: { "फोडून": "to break open, to crack" } }
  "mr-1703":
    native: "to break (a thing), to bend"
    notes:
      "n1": "{1} is breaking or bending something, such as a stick or a promise."
    examples:
      "काठी मोडली.": { native: "The stick broke.", bases: { "काठी": "stick", "मोडली": "to break (a thing), to bend" } }
      "त्याने वचन मोडलं.": { native: "He broke his promise.", bases: { "वचन": "promise", "मोडलं": "to break (a thing), to bend" } }
  "mr-1704":
    native: "to join, to connect"
    notes:
      "n1": "{1} is joining two things together."
    examples:
      "दोन तुकडे जोडले.": { native: "I joined the two pieces.", bases: { "जोडले": "to join, to connect" } }
      "फोन चार्जरला जोडा.": { native: "Connect the phone to the charger.", bases: { "जोडा": "to join, to connect" } }
  "mr-1705":
    native: "to bend"
    notes:
      "n1": "{1} is bending the body or a thing."
    examples:
      "तो खाली वाकला.": { native: "He bent down.", bases: { "खाली": "down", "वाकला": "to bend" } }
      "झाड वाऱ्याने वाकलं.": { native: "The tree bent in the wind.", bases: { "वाकलं": "to bend" } }
  "mr-1706":
    native: "to strain, to filter"
    notes:
      "n1": "{1} is straining a liquid through a cloth or a sieve."
    examples:
      "चहा गाळून घ्या.": { native: "Strain the tea and take it.", bases: { "गाळून": "to strain, to filter" } }
      "दूध गाळलं.": { native: "I strained the milk.", bases: { "गाळलं": "to strain, to filter" } }
  "mr-1707":
    native: "to dry (in the sun)"
    notes:
      "n1": "{1} is drying something in the sun or air."
    examples:
      "कपडे उन्हात वाळवा.": { native: "Dry the clothes in the sun.", bases: { "वाळवा": "to dry (in the sun)" } }
      "मिरच्या वाळवल्या.": { native: "I dried the chillies.", bases: { "वाळवल्या": "to dry (in the sun)" } }
  "mr-1708":
    native: "to hide (oneself)"
    notes:
      "n1": "{1} is hiding oneself from someone."
    examples:
      "मुलं दारामागे लपली.": { native: "The children hid behind the door.", bases: { "लपली": "to hide (oneself)" } }
      "तो कुठे लपला?": { native: "Where did he hide?", bases: { "कुठे": "where", "लपला": "to hide (oneself)" } }
  "mr-1709":
    native: "to hide (a thing)"
    notes:
      "n1": "{1} is hiding something from sight."
    examples:
      "चोकलेट लपवलं.": { native: "I hid the chocolate.", bases: { "चोकलेट": "chocolate", "लपवलं": "to hide (a thing)" } }
      "पैसे कुठे लपवले?": { native: "Where did you hide the money?", bases: { "कुठे": "where", "लपवले": "to hide (a thing)" } }
  "mr-1710":
    native: "to spill"
    notes:
      "n1": "{1} is spilling a liquid or grain by accident."
    examples:
      "दूध सांडलं.": { native: "The milk spilled.", bases: { "सांडलं": "to spill" } }
      "चहा कपड्यावर सांडला.": { native: "Tea spilled on the clothes.", bases: { "कपड्यावर": "on the clothes", "सांडला": "to spill" } }
  "mr-1711":
    native: "to spread (news, a thing)"
    notes:
      "n1": "{1} is spreading something out or around."
    examples:
      "बातमी पसरवू नका.": { native: "Do not spread the news.", bases: { "पसरवू": "to spread (news, a thing)" } }
      "सतरंजी जमिनीवर पसरवली.": { native: "I spread the mat on the floor.", bases: { "सतरंजी": "mat", "जमिनीवर": "on the floor", "पसरवली": "to spread (news, a thing)" } }
  "mr-1712":
    native: "to tidy up, to control"
    notes:
      "n1": "{1} is tidying a room or controlling oneself."
    examples:
      "खोली आवरली.": { native: "I tidied the room.", bases: { "आवरली": "to tidy up, to control" } }
      "स्वतःला आवर.": { native: "Control yourself.", bases: { "आवर": "to tidy up, to control" } }
  "mr-1713":
    native: "to live (be alive)"
    notes:
      "n1": "{1} is living, being alive."
    examples:
      "ती शंभर वर्षं जगली.": { native: "She lived a hundred years.", bases: { "जगली": "to live (be alive)" } }
      "माणूस अन्नावर जगतो.": { native: "A person lives on food.", bases: { "अन्नावर": "on food", "जगतो": "to live (be alive)" } }
  "mr-1714":
    native: "to die"
    notes:
      "n1": "{1} is dying."
    examples:
      "झाड मेलं.": { native: "The tree died.", bases: { "मेलं": "to die" } }
      "तो दुःखाने मेला.": { native: "He died of sorrow.", bases: { "मेला": "to die" } }
  "mr-1715":
    native: "to be born"
    notes:
      "n1": "{1} is coming into life."
    examples:
      "ती कुठे जन्मली?": { native: "Where was she born?", bases: { "कुठे": "where", "जन्मली": "to be born" } }
      "माझा भाऊ नोव्हेंबरमध्ये जन्मला.": { native: "My brother was born in November.", bases: { "जन्मला": "to be born" } }
  "mr-1716":
    native: "to raise, to bring up"
    notes:
      "n1": "{1} is bringing up a child or making something grow."
    examples:
      "आईने मुलांना वाढवलं.": { native: "Mother brought up the children.", bases: { "वाढवलं": "to raise, to bring up" } }
      "झाडं वाढवा.": { native: "Grow the trees.", bases: { "वाढवा": "to raise, to bring up" } }
  "mr-1717":
    native: "to feed (someone)"
    notes:
      "n1": "{1} is feeding someone by putting food in their mouth."
    examples:
      "आजी नातवाला भरवते.": { native: "Grandmother feeds the grandchild.", bases: { "नातवाला": "the grandchild", "भरवते": "to feed (someone)" } }
      "बाळाला भरव.": { native: "Feed the baby.", bases: { "बाळाला": "the baby", "भरव": "to feed (someone)" } }
  "mr-1718":
    native: "to fly (a kite), to blow away"
    notes:
      "n1": "{1} is making something fly, like a kite, or blowing it away."
    examples:
      "मुलं पतंग उडवत होती.": { native: "The children were flying kites.", bases: { "पतंग": "kites", "होती": "to be", "उडवत": "to fly (a kite), to blow away" } }
      "वाऱ्याने कागद उडवला.": { native: "The wind blew the paper away.", bases: { "उडवला": "to fly (a kite), to blow away" } }
  "mr-1719":
    native: "to bow, to lean"
    notes:
      "n1": "{1} is bowing the head or leaning forward."
    examples:
      "तो नम्रपणे झुकला.": { native: "He bowed humbly.", bases: { "नम्रपणे": "humbly", "झुकला": "to bow, to lean" } }
      "फुलांचं झाड फांद्यांनी झुकलं.": { native: "The flower tree bent with its branches.", bases: { "फुलांचं": "of flowers", "फांद्यांनी": "with the branches", "झुकलं": "to bow, to lean" } }
  "mr-1720":
    native: "to push in, to enter forcibly"
    notes:
      "n1": "{1} is pushing into a place, often in a crowd."
    examples:
      "गर्दीत कोणीतरी घुसलं.": { native: "Someone pushed into the crowd.", bases: { "गर्दीत": "into the crowd", "घुसलं": "to push in, to enter forcibly" } }
      "रांगेत घुसू नका.": { native: "Do not push into the queue.", bases: { "घुसू": "to push in, to enter forcibly" } }
  "mr-1721":
    native: "to put on, to raise"
    notes:
      "n1": "{1} is putting something on top of another, or raising it."
    examples:
      "भांड्यावर झाकण चढवा.": { native: "Put the lid on the pot.", bases: { "भांड्यावर": "on the pot", "झाकण": "lid", "चढवा": "to put on, to raise" } }
      "पातेलं चुलीवर चढवलं.": { native: "I put the pan on the stove.", bases: { "पातेलं": "pan", "चुलीवर": "on the stove", "चढवलं": "to put on, to raise" } }
