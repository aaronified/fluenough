cards:
  "mr-6740":
    native: "Look after the house."
    bases: { "सांभाळा": "look after" }
    confusables: { "w1": { why: "To tidy up or control: आवरणे (āvrṇe) means to tidy up." }, "w2": { why: "To feed someone: भरवणे (bharvṇe) means to feed." } }
  "mr-6741":
    native: "The fire caught."
    bases: { "पेटली": "caught fire" }
    confusables: { "w1": { why: "To go out, the opposite: विझणे (vijhṇe) means to go out." }, "w2": { why: "To break a thing: मोडणे (moḍṇe) means to break." } }
  "mr-6742":
    native: "The lamp went out."
    bases: { "विझला": "went out" }
    confusables: { "w1": { why: "To catch fire, the opposite: पेटणे (peṭṇe) means to catch fire." }, "w2": { why: "To hide oneself: लपणे (lapṇe) means to hide oneself." } }
  "mr-6743":
    native: "Break off the branch."
    bases: { "तोडा": "break off" }
    confusables: { "w1": { why: "To break open: फोडणे (phoḍṇe) means to break open." }, "w2": { why: "To join: जोडणे (joḍṇe) means to join." } }
  "mr-6744":
    native: "Crack the egg."
    bases: { "फोडा": "crack" }
    confusables: { "w1": { why: "To break into pieces: तोडणे (toḍṇe) means to break into pieces." }, "w2": { why: "To spill: सांडणे (sāṇḍaṇe) means to spill." } }
  "mr-6745":
    native: "Join the rope."
    bases: { "जोडा": "join" }
    confusables: { "w1": { why: "To break a thing, not to join: मोडणे (moḍṇe) means to break." }, "w2": { why: "To bend: वाकणे (vākṇe) means to bend." } }
  "mr-6746":
    native: "Strain the milk."
    bases: { "गाळा": "strain" }
    confusables: { "w1": { why: "To dry in the sun: वाळवणे (vāḷvṇe) means to dry." }, "w2": { why: "To spill by accident: सांडणे (sāṇḍaṇe) means to spill." } }
  "mr-6747":
    native: "Dry the clothes."
    bases: { "वाळवा": "dry" }
    confusables: { "w1": { why: "To strain a liquid: गाळणे (gāḷṇe) means to strain." }, "w2": { why: "To tidy up: आवरणे (āvrṇe) means to tidy up." } }
  "mr-6748":
    native: "He hid."
    bases: { "लपला": "hid" }
    confusables: { "w1": { why: "To hide a thing, not oneself: लपवणे (lapvṇe) means to hide a thing." }, "w2": { why: "To live, be alive: जगणे (jagṇe) means to live." } }
  "mr-6749":
    native: "The water spilled."
    bases: { "सांडले": "spilled" }
    confusables: { "w1": { why: "To spread out: पसरवणे (pasrvṇe) means to spread." }, "w2": { why: "To strain a liquid: गाळणे (gāḷṇe) means to strain." } }
  "mr-6750":
    native: "Tidy up the rubbish."
    bases: { "आवरा": "tidy up" }
    confusables: { "w1": { why: "To spread out: पसरवणे (pasrvṇe) means to spread." }, "w2": { why: "To look after: सांभाळणे (sāmbhāḷṇe) means to look after." } }
  "mr-6751":
    native: "Grow the tree."
    bases: { "वाढवा": "grow" }
    confusables: { "w1": { why: "To live: जगणे (jagṇe) means to live." }, "w2": { why: "To die, the opposite of growing: मरणे (marṇe) means to die." } }
  "mr-6752":
    native: "Fly the kite."
    bases: { "उडवा": "fly" }
    confusables: { "w1": { why: "To bow or lean: झुकणे (jhukṇe) means to bow." }, "w2": { why: "To push in: घुसणे (ghusṇe) means to push into a place." } }
  "mr-6753":
    native: "Feed the baby."
    bases: { "बाळाला": "to the baby", "भरवा": "feed" }
    confusables: { "w1": { why: "To bring up a child: वाढवणे (vāḍhvṇe) means to bring up or grow." }, "w2": { why: "To be born: जन्मणे (janmaṇe) means to be born." } }
