schema: 1
id: "mr-en-hobbies"
kind: "layer"
core: "mr-hobbies"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hobbies"
description: "Reading, music, gardening, swimming and photography: what people do in their free time, and the words for practising and competing. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-1129":
    native: "hobby"
    notes:
      "n1": "{1} is a hobby, something you do for pleasure."
    examples:
      "माझा छंद काय आहे?": { native: "What is your hobby?", bases: { "आहे": "to be" } }
      "वाचन हा माझा आवडता छंद आहे.": { native: "Reading is my favourite hobby.", bases: { "आहे": "to be" } }
  "mr-1130":
    native: "reading"
    notes:
      "n1": "{1} is reading, the act of reading for pleasure."
    examples:
      "वाचन करायला आवडतं.": "I like to read."
      "रात्री वाचनात वेळ जातो.": { native: "I spend time reading at night.", bases: { "वाचनात": "reading" } }
  "mr-1131":
    native: "music"
    notes:
      "n1": "{1} is music, singing and playing instruments."
    examples:
      "मला संगीत ऐकायला आवडतं.": "I like listening to music."
      "संगीत शिकायला सुरुवात केली.": { native: "I started learning music.", bases: { "सुरुवात": "beginning" } }
  "mr-1132":
    native: "guitar"
    notes:
      "n1": "{1} is a guitar, a loanword from English."
    examples:
      "तो गिटार वाजवतो.": { native: "He plays the guitar.", bases: { "वाजवतो": "to play" } }
      "गिटार नवीन आहे.": { native: "The guitar is new.", bases: { "आहे": "to be" } }
  "mr-1133":
    native: "flute"
    notes:
      "n1": "{1} is a bamboo flute."
    examples:
      "बासरीचा सूर गोड आहे.": { native: "The flute's tune is sweet.", bases: { "आहे": "to be", "बासरीचा": "flute", "सूर": "tune" } }
      "कृष्णाच्या हातात बासरी असते.": { native: "Krishna holds a flute.", bases: { "असते": "to be", "कृष्णाच्या": "Krishna's" } }
  "mr-1134":
    native: "gardening"
    notes:
      "n1": "{1} is gardening, looking after plants."
    examples:
      "आजी बागकाम करते.": "Grandmother does gardening."
      "बागकाम करायला छान वाटतं.": { native: "Gardening feels nice.", bases: { "वाटतं": "to feel" } }
  "mr-1135":
    native: "trekking, wandering"
    notes:
      "n1": "{1} is wandering or trekking for fun, especially in the hills."
    examples:
      "शनिवारी डोंगरात भटकंती करतो.": "On Saturday I go trekking in the hills."
      "भटकंती खूप मजेदार असते.": { native: "Trekking is very fun.", bases: { "असते": "to be", "मजेदार": "funny" } }
  "mr-1136":
    native: "to run"
    notes:
      "n1": "{1} is the verb for running."
    examples:
      "सकाळी उद्यानात धावतो.": { native: "In the morning I run in the park.", bases: { "धावतो": "to run" } }
      "तो शाळेपर्यंत धावला.": { native: "He ran as far as the school.", bases: { "धावला": "to run" } }
  "mr-1137":
    native: "camera"
    notes:
      "n1": "{1} is a camera, a loanword from English."
    examples:
      "माझा कॅमेरा जुना आहे.": { native: "My camera is old.", bases: { "आहे": "to be" } }
      "कॅमेऱ्यात फोटो काढला.": { native: "I took a photo with the camera.", bases: { "कॅमेऱ्यात": "camera" } }
  "mr-1138":
    native: "photography"
    notes:
      "n1": "{1} is photography, a loanword from English."
    examples:
      "मला फोटोग्राफी आवडते.": "I like photography."
      "फोटोग्राफीचा कोर्स केला.": { native: "I took a photography course.", bases: { "फोटोग्राफीचा": "photography", "कोर्स": "course" } }
  "mr-1139":
    native: "club"
    notes:
      "n1": "{1} is a club, a group that meets for a hobby."
    examples:
      "आम्ही संगीताचा क्लब सुरू केला.": { native: "We started a music club.", bases: { "सुरू": "started" } }
      "क्लब रविवारी भरतो.": { native: "The club meets on Sunday.", bases: { "रविवारी": "on Sunday" } }
  "mr-1140":
    native: "practice"
    notes:
      "n1": "{1} is practice: doing a skill again and again."
    examples:
      "रोज सराव करा.": "Practise every day."
      "सरावामुळे गाणं सुधारलं.": { native: "Practice improved the singing.", bases: { "सुधारलं": "to improve", "सरावामुळे": "practice" } }
  "mr-1141":
    native: "competition"
    notes:
      "n1": "{1} is a competition or contest."
    examples:
      "उद्या संगीत स्पर्धा आहे.": { native: "There is a music competition tomorrow.", bases: { "आहे": "to be" } }
      "स्पर्धेत तो पहिला आला.": { native: "He came first in the competition.", bases: { "पहिला": "first", "स्पर्धेत": "competition" } }
  "mr-1142":
    native: "to win"
    notes:
      "n1": "{1} is the verb for winning."
    examples:
      "आमची टीम जिंकली.": { native: "Our team won.", bases: { "जिंकली": "to win", "टीम": "team" } }
      "तू नेहमी जिंकतोस.": { native: "You always win.", bases: { "जिंकतोस": "to win" } }
  "mr-1143":
    native: "to lose (a game)"
    notes:
      "n1": "{1} is the verb for losing a game or a fight. For losing a thing, use हरवणे (harvṇe)."
    examples:
      "ते सामना हरले.": { native: "They lost the match.", bases: { "हरले": "to lose" } }
      "मी खेळात हरलो.": { native: "I lost the game.", bases: { "हरलो": "to lose", "खेळात": "in the game" } }
  "mr-1144":
    native: "mountain climbing"
    notes:
      "n1": "{1} is mountain climbing."
    examples:
      "त्याला गिर्यारोहण आवडतं.": "He likes mountain climbing."
      "गिर्यारोहणासाठी खास बूट लागतात.": { native: "Mountain climbing needs special boots.", bases: { "लागतात": "to need", "गिर्यारोहणासाठी": "mountain climbing", "खास": "special" } }
  "mr-1145":
    native: "painting, drawing"
    notes:
      "n1": "{1} is painting and drawing as an art."
    examples:
      "तिला चित्रकला आवडते.": "She likes painting."
      "चित्रकलेचा वर्ग सुरू झाला.": { native: "The painting class started.", bases: { "वर्ग": "class", "सुरू": "started", "झाला": "to become", "चित्रकलेचा": "painting, drawing" } }
