schema: 1
id: "mr-en-eating-out"
kind: "layer"
core: "mr-eating-out"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Eating out"
license: "CC-BY-SA-4.0"
description: "Ordering, asking for less spice, Maharashtra's everyday food, and paying the bill. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0558":
    native: "water"
    notes:
      "n1": "पाणी द्या (pāṇi dyā), some water, please. Bottled water: बिसलेरी (bisleri), after a brand, or पाण्याची बाटली (pāṇyāci bāṭli)."
    "examples": {
      "पाणी वाचवा.": {"native": "Save water.", "bases": {"वाचवा": "to save"}},
      "इथे पाणी आहे.": {"native": "There is water here.", "bases": {"आहे": "to be"}}
    }
  "mr-0559":
    native: "tea"
    notes:
      "n1": "Said tsahaa. Strong, sweet, with milk; a small glass is a कटिंग (kaṭiṅg), a half."
    "examples": {
      "चहा कपड्यावर सांडला.": {"native": "Tea spilled on the clothes.", "bases": {"कपड्यावर": "on the clothes", "सांडला": "to spill"}},
      "चहा कपात ओत.": {"native": "Pour the tea into the cup.", "bases": {"कपात": "cup", "ओत": "to pour"}}
    }
  "mr-0560":
    native: "coffee"
    "examples": {
      "मला कॉफी आवडते.": {"native": "I like coffee.", "bases": {}}
    }
  "mr-0561":
    native: "cooked rice"
    notes:
      "n1": "Uncooked rice is तांदूळ (tānduḷ). वरणभात (varaṇbhāt), rice with plain dal, is the everyday comfort food."
    "examples": {
      "आई भात शिजवते.": {"native": "Mother cooks the rice.", "bases": {"शिजवते": "to cook"}},
      "तो भात खातो.": {"native": "He eats rice.", "bases": {"खातो": "to eat"}}
    }
  "mr-0562":
    native: "menu"
  "mr-0563":
    native: "bill"
    "examples": {
      "बिल आणा.": {"native": "The bill, please.", "bases": {"आणा": "to bring"}}
    }
  "mr-0564":
    native: "The bill, please."
    notes:
      "n1": "'Bring the bill'. आणणे (āṇṇe) is 'to bring'."
    bases:
      "आणा": "to bring"
  "mr-0565":
    native: "spicy hot; chilli powder"
    notes:
      "n1": "कमी तिखट (kami tikhaṭ), not too spicy. Kolhapur is famous for its very hot food."
    "examples": {
      "कमी तिखट करा.": {"native": "Make it less spicy, please.", "bases": {"कमी": "less", "करा": "to do; to make"}},
      "चटणी तिखट आहे.": {"native": "The chutney is spicy.", "bases": {"आहे": "to be", "तिखट": "spicy hot; chilli powder"}}
    }
  "mr-0566":
    native: "sweet"
    notes:
      "n1": "Also 'lovely' of a child or a voice. A sweet is गोड पदार्थ (goḍ padārth), or simply गोड (goḍ): जेवणानंतर काहीतरी गोड (jevaṇānantar kāhitari goḍ), something sweet after the meal."
    "examples": {
      "ऊस गोड असतो.": {"native": "Sugarcane is sweet.", "bases": {"असतो": "to be", "गोड": "sweet"}},
      "खीर गोड आहे.": {"native": "The kheer is sweet.", "bases": {"गोड": "sweet", "आहे": "to be"}}
    }
  "mr-0567":
    native: "One tea for me, please."
  "mr-0568":
    native: "Make it less spicy, please."
    bases:
      "कमी": "less"
      "करा": "to do; to make"
  "mr-0569":
    native: "It's very good!"
    notes:
      "n1": "छान (chān), 'nice, lovely', never changes. Of food also: खूप चविष्ट आहे (khup caviṣṭa āhe), it's delicious. असणे (asṇe) changes its stem in the present: आह- (āh-)."
    bases:
      "खूप": "very; a lot"
      "छान": "nice; very good"
      "आहे": "to be"
  "mr-0570":
    native: "chapati"
    notes:
      "n1": "Also चपाती (capāti). Plural पोळ्या (poḷyā). A sweet stuffed one is a पुरणपोळी (puraṇpoḷi)."
    "examples": {
      "तव्यावर पोळी भाजा.": {"native": "Cook the flatbread on the pan.", "bases": {"तव्यावर": "on the pan", "भाजा": "to roast", "पोळी": "chapati"}},
      "पोळीवर तूप लावा.": {"native": "Put ghee on the flatbread.", "bases": {"लावा": "to apply", "पोळीवर": "chapati"}}
    }
  "mr-0571":
    native: "millet flatbread"
    notes:
      "n1": "Made of jowar or bajri, eaten with पिठले (piṭhle), a gram-flour curry, in villages across Maharashtra."
    "examples": {
      "ज्वारीची भाकरी आवडते.": {"native": "I like sorghum bread.", "bases": {"ज्वारीची": "sorghum, jowar"}},
      "थंडीत बाजरीची भाकरी खातात.": {"native": "In the cold they eat millet bread.", "bases": {"बाजरीची": "pearl millet"}}
    }
  "mr-0572":
    native: "vada pav"
    notes:
      "n1": "A spiced potato fritter in a bread roll, the snack of Mumbai. पाव (pāv), bread, is from Portuguese pão."
  "mr-0573":
    native: "set meal on a plate"
    notes:
      "n1": "Several dishes, bread and rice, often refilled: a meal at a fixed price."
  "mr-0574":
    native: "restaurant; eating place"
    notes:
      "n1": "In Maharashtra an हॉटेल (hôṭel) is usually somewhere to eat; a place to stay is a लॉज (lôj) or a hotel with rooms."
    "examples": {
      "हे हॉटेल शाकाहारी आहे.": {"native": "This hotel is vegetarian.", "bases": {"हे": "this", "आहे": "to be"}}
    }
