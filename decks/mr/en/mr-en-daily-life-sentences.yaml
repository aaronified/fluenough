cards:
  "mr-5363":
    native: "She gets up early every morning."
    confusables: { "f1": { why: "उठतो (uṭhto) is for one man; this sentence has a woman." }, "w1": { why: "उशिरा (uśirā) means late, the opposite of early." } }
  "mr-5364":
    native: "They always have breakfast at home."
    confusables: { "f1": { why: "करतो (karto) is for one man; this sentence has more than one person." }, "w1": { why: "कधीकधी (kadhikadhi) means sometimes, not always." } }
    notes: { "n1": "नाश्ता करणे (nāśtā karṇe), to have breakfast: the noun नाश्ता (nāśtā) with करणे (karṇe), to do." }
  "mr-5365":
    native: "The children go to sleep at seven."
    bases: { "मुले": "children" }
    confusables: { "f1": { why: "झोपतो (jhopto) is for one man, not a group of children." }, "w1": { why: "लवकर (lavkar) means early; the sentence gives the exact time." } }
    notes: { "n1": "सात वाजता (sāt vājtā), at seven o'clock: a number with वाजता (vājtā), at the hour." }
  "mr-5366":
    native: "She brushes her teeth in the morning."
    confusables: { "f1": { why: "घासतो (ghāsto) is for one man; this sentence has a woman." }, "w1": { why: "उठणे (uṭhṇe) means to get up, not to brush." } }
    notes: { "n1": "दात घासणे (dāt ghāsṇe), to brush one's teeth: the noun दात (dāt), teeth, with the verb घासणे (ghāsṇe)." }
  "mr-5367":
    native: "Have breakfast in the morning."
    confusables: { "f1": { why: "कर (kar) is the informal order, said to a child or a friend." }, "w1": { why: "जेवण (jevaṇ) means a meal such as lunch or dinner, not breakfast." } }
    notes: { "n1": "करा (karā), do, is the polite order: -ा (-ā) for a polite you, as in नाश्ता करा (nāśtā karā), have breakfast." }
  "mr-5368":
    native: "She goes to work every day."
    confusables: { "f1": { why: "जातो (jāto) is for one man; this sentence has a woman." }, "w1": { why: "घरी (ghari) means at home, not at work." } }
  "mr-5369":
    native: "They eat and then sleep at night."
    confusables: { "f1": { why: "जेवतात (jevtāt) means they eat, without the link to sleep." }, "w1": { why: "जेवण (jevaṇ) is a meal, a noun, not the verb to eat." } }
    notes: { "n1": "जेवून (jevun), having eaten, links two actions with the same doer: the -ून (-un) form, then झोपतात (jhoptāt), they sleep." }
  "mr-5370":
    native: "She walks every morning."
    confusables: { "f1": { why: "चालतो (cālto) is for one man; this sentence has a woman." }, "w1": { why: "वाचणे (vācṇe) means to read, not to walk." } }
  "mr-5371":
    native: "Mother reads a book at night."
    confusables: { "f1": { why: "वाचतो (vācto) is for one man; आई (āi) is a woman." }, "w1": { why: "चालणे (cālṇe) means to walk, not to read." } }
  "mr-5372":
    native: "She sometimes eats late."
    confusables: { "f1": { why: "जेवतो (jevto) is for one man; this sentence has a woman." }, "w1": { why: "नेहमी (nehmi) means always, not sometimes." } }
    notes: { "n1": "कधीकधी (kadhikadhi), sometimes, is कधी (kadhi), when, said twice." }
  "mr-5373":
    native: "She washes clothes on Monday."
    bases: { "कपडे": "clothes" }
    confusables: { "f1": { why: "धुतो (dhuto) is for one man; this sentence has a woman." }, "w1": { why: "रोज (roj) means every day, not on one day of the week." } }
  "mr-5374":
    native: "She comes back home."
    bases: { "परत": "back" }
    confusables: { "f1": { why: "येतो (yeto) is for one man; this sentence has a woman." }, "w1": { why: "कामावर जाणे (kāmāvar jāṇe) means to go to work, away from home." } }
