schema: 1
id: "mr-en-family"
kind: "layer"
core: "mr-family"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Family"
license: "CC-BY-SA-4.0"
description: "Parents, brothers and sisters, grandparents, and the aunts and uncles on each side, each with its own word. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0217":
    native: "mother"
    notes:
      "n1": "Most children call their mother आई (āi), and say तू (tu) to her."
    "examples": {
      "आई अंडे तळते.": {"native": "Mother fries the egg.", "bases": {"तळते": "to fry"}},
      "आई कपडे धुते.": {"native": "Mother washes clothes.", "bases": {"धुते": "to wash (clothes)", "कपडे": "clothes"}}
    }
  "mr-0218":
    native: "father"
    notes:
      "n1": "Respectful, and plural in form: माझे वडील (mājhe vaḍil), my father. Speaking to him, most say बाबा (bābā)."
  "mr-0219":
    native: "dad; father"
    "examples": {
      "बाबा आजारी आहेत.": {"native": "Dad is ill.", "bases": {"बाबा": "dad", "आहेत": "to be"}},
      "बाबा गाडीतून उतरले.": {"native": "Father got off the train.", "bases": {"उतरले": "to get off, to alight"}}
    }
  "mr-0220":
    native: "brother"
    notes:
      "n1": "An elder brother is called दादा (dādā). In many places भाऊ (bhāu) is also any man, and a title after a name."
    "examples": {
      "तो माझा भाऊ आहे.": {"native": "He is my brother.", "bases": {"माझा": "my", "आहे": "is"}},
      "दोन भावांमध्ये दुरावा आला.": {"native": "A rift came between the two brothers.", "bases": {"भावांमध्ये": "brother"}}
    }
  "mr-0221":
    native: "sister"
    notes:
      "n1": "An elder sister is called ताई (tāi). Plural: बहिणी (bahiṇi)."
    "examples": {
      "ती माझी बहीण आहे.": {"native": "She is my sister.", "bases": {"माझी": "my", "आहे": "is"}},
      "बहिणीने बॅडमिंटनमध्ये पदक जिंकलं.": {"native": "My sister won a medal in badminton.", "bases": {"बॅडमिंटनमध्ये": "badminton", "बहिणीने": "sister"}}
    }
  "mr-0222":
    native: "son; boy"
    notes:
      "n1": "Plural मुलगे (mulge)."
    "examples": {
      "मुलगा बर्गर खातो.": {"native": "The boy eats a burger.", "bases": {"खातो": "to eat", "मुलगा": "son; boy"}}
    }
  "mr-0223":
    native: "daughter; girl"
    notes:
      "n1": "Plural मुली (muli)."
    "examples": {
      "मुलगी तबला वाजवते.": {"native": "The girl plays the tabla.", "bases": {"वाजवते": "to play (an instrument)", "मुलगी": "daughter; girl"}}
    }
  "mr-0224":
    native: "child"
    notes:
      "n1": "Neuter, boy or girl. Plural मुले (mule), in speech मुलं (mulam̐): तुम्हाला मुले आहेत का (tumhālā mule āhet kā)? Do you have children?"
    "examples": {
      "आई मुलांवर चिडली.": {"native": "Mother got irritated with the children.", "bases": {"चिडली": "to get irritated", "मुलांवर": "child"}},
      "आईने मुलांना वाढवलं.": {"native": "Mother brought up the children.", "bases": {"वाढवलं": "to raise, to bring up", "मुलांना": "child"}}
    }
  "mr-0225":
    native: "parents"
    notes:
      "n1": "'Mother-father', plural: माझे आई-वडील पुण्यात राहतात (mājhe āi-vaḍil puṇyāt rāhtāt), my parents live in Pune."
  "mr-0226":
    native: "husband"
    notes:
      "n1": "Formally पती (pati)."
    "examples": {
      "हा माझा नवरा आहे.": {"native": "This is my husband.", "bases": {"माझा": "my", "आहे": "is"}}
    }
  "mr-0227":
    native: "wife"
    notes:
      "n1": "Formally पत्नी (patni)."
  "mr-0197":
    notes:
      "n1": "Grandmother on either side: Marathi does not tell them apart."
  "mr-0198":
    notes:
      "n1": "Grandfather on either side."
  "mr-0194":
    notes:
      "n1": "Your father's brother. Your mother's brother is मामा (māmā)."
  "mr-0195":
    notes:
      "n1": "काकाची बायको (kākāci bāyko), the wife of your father's brother."
  "mr-0228":
    native: "aunt (father's sister)"
  "mr-0229":
    native: "uncle (mother's brother)"
  "mr-0230":
    native: "aunt (mother's brother's wife)"
  "mr-0196":
    notes:
      "n1": "Your mother's sister. Her husband is your काका (kākā) too, or मावसा (māvsā)."
  "mr-0231":
    native: "family"
    notes:
      "n1": "In speech also घरचे (gharce), 'the people of the house'."
    "examples": {
      "शेतीवर अनेक कुटुंबं जगतात.": {"native": "Many families live by farming.", "bases": {"जगतात": "to live", "शेतीवर": "farming, agriculture", "अनेक": "many", "कुटुंबं": "family"}},
      "गरीब कुटुंबं शिकायला संधी मिळावी.": {"native": "Poor families should get a chance to study.", "bases": {"मिळावी": "to get", "कुटुंबं": "family"}}
    }
  "mr-0232":
    native: "mother-in-law"
  "mr-0233":
    native: "father-in-law"
    notes:
      "n1": "Respectful and plural in form, like वडील (vaḍil)."
