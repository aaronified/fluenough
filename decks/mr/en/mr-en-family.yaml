schema: 1
id: "mr-en-family"
kind: "layer"
core: "mr-family"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Family"
license: "CC0-1.0"
description: "Parents, brothers and sisters, grandparents, and the aunts and uncles on each side, each with its own word. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0217":
    native: "mother"
    notes:
      "n1": "Most children call their mother आई (āi), and say तू (tu) to her."
  "mr-0218":
    native: "father"
    notes:
      "n1": "Respectful, and plural in form: माझे वडील (mājhe vaḍil), my father. Speaking to him, most say बाबा (bābā)."
  "mr-0219":
    native: "dad; father"
  "mr-0220":
    native: "brother"
    notes:
      "n1": "An elder brother is called दादा (dādā). In many places भाऊ (bhāu) is also any man, and a title after a name."
  "mr-0221":
    native: "sister"
    notes:
      "n1": "An elder sister is called ताई (tāi). Plural: बहिणी (bahiṇi)."
  "mr-0222":
    native: "son; boy"
    notes:
      "n1": "Plural मुलगे (mulge)."
  "mr-0223":
    native: "daughter; girl"
    notes:
      "n1": "Plural मुली (muli)."
  "mr-0224":
    native: "child"
    notes:
      "n1": "Neuter, boy or girl. Plural मुले (mule), in speech मुलं (mulam̐): तुम्हाला मुले आहेत का (tumhālā mule āhet kā)? Do you have children?"
  "mr-0225":
    native: "parents"
    notes:
      "n1": "'Mother-father', plural: माझे आई-वडील पुण्यात राहतात (mājhe āi-vaḍil puṇyāt rāhtāt), my parents live in Pune."
  "mr-0226":
    native: "husband"
    notes:
      "n1": "Formally पती (pati)."
  "mr-0227":
    native: "wife"
    notes:
      "n1": "Formally पत्नी (patni)."
  "mr-0197":
    notes:
      "n1": "Grandmother on either side: Marathi does not tell them apart."
  "mr-0198":
    notes:
      "n1": "Grandfather on either side."
  "mr-0194":
    notes:
      "n1": "Your father's brother. Your mother's brother is मामा (māmā)."
  "mr-0195":
    notes:
      "n1": "काकाची बायको (kākāci bāyko), the wife of your father's brother."
  "mr-0228":
    native: "aunt (father's sister)"
  "mr-0229":
    native: "uncle (mother's brother)"
  "mr-0230":
    native: "aunt (mother's brother's wife)"
  "mr-0196":
    notes:
      "n1": "Your mother's sister. Her husband is your काका (kākā) too, or मावसा (māvsā)."
  "mr-0231":
    native: "family"
    notes:
      "n1": "In speech also घरचे (gharce), 'the people of the house'."
  "mr-0232":
    native: "mother-in-law"
  "mr-0233":
    native: "father-in-law"
    notes:
      "n1": "Respectful and plural in form, like वडील (vaḍil)."
