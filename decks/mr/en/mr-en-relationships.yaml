schema: 1
id: "mr-en-relationships"
kind: "layer"
core: "mr-relationships"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Relationships"
description: "People we are close to: friends, in-laws and relatives, trust, quarrels and making up, with the words to say how you feel about them. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-1628":
    native: "relationship, bond"
    notes:
      "n1": "{1} is a relationship or bond between people, such as family."
    examples:
      "आमचं नातं खूप जुनं आहे.": { native: "Our relationship is very old.", bases: { "आहे": "to be" } }
      "नाती जपायला हवीत.": "Relationships should be kept."
  "mr-1629":
    native: "friendship"
    notes:
      "n1": "{1} is friendship."
    examples:
      "आमची मैत्री लहानपणापासूनची आहे.": { native: "Our friendship is from childhood.", bases: { "लहानपणापासूनची": "from childhood", "आहे": "to be" } }
      "मैत्री टिकवणं सोपं नसतं.": { native: "Keeping a friendship is not easy.", bases: { "टिकवणं": "to keep", "नसतं": "not" } }
  "mr-1630":
    native: "partner, spouse"
    notes:
      "n1": "{1} is a partner or a spouse."
    examples:
      "माझा जोडीदार चांगला आहे.": { native: "My partner is good.", bases: { "आहे": "to be" } }
      "जोडीदाराशी बोलणं महत्त्वाचं असतं.": { native: "Talking with a partner is important.", bases: { "महत्त्वाचं": "important", "असतं": "to be", "जोडीदाराशी": "partner, spouse" } }
  "mr-1631":
    native: "daughter-in-law"
    notes:
      "n1": "{1} is a daughter-in-law."
    examples:
      "सून घरी आली.": "The daughter-in-law came home."
      "सुनेने सगळ्यांसाठी स्वयंपाक केला.": { native: "The daughter-in-law cooked for everyone.", bases: { "सुनेने": "daughter-in-law" } }
  "mr-1632":
    native: "son-in-law"
    notes:
      "n1": "{1} is a son-in-law, a daughter's husband."
    examples:
      "जावई आज येणार आहेत.": { native: "The son-in-law is coming today.", bases: { "आहेत": "to be" } }
      "जावयाला भेटवस्तू दिली.": { native: "I gave a gift to the son-in-law.", bases: { "जावयाला": "son-in-law" } }
  "mr-1633":
    native: "husband's younger brother"
    notes:
      "n1": "{1} is a husband's younger brother, a brother-in-law."
    examples:
      "माझा दीर शाळेत शिकवतो.": "My husband's younger brother teaches at school."
      "दीर आणि मी एकत्र राहतो.": "My brother-in-law and I live together."
  "mr-1634":
    native: "brother's wife, sister-in-law"
    notes:
      "n1": "{1} is one's brother's wife, or a sister-in-law."
    examples:
      "वहिनी स्वयंपाकघरात आहेत.": { native: "The sister-in-law is in the kitchen.", bases: { "आहेत": "to be" } }
      "वहिनीनी भेट दिली.": { native: "My sister-in-law gave a gift.", bases: { "वहिनीनी": "brother's wife, sister-in-law" } }
  "mr-1635":
    native: "company, closeness"
    notes:
      "n1": "{1} is the company of someone, being together."
    examples:
      "तुझा सहवास आवडतो.": "I like your company."
      "आजीच्या सहवासात खूप शिकलो.": { native: "I learnt a lot in grandmother's company.", bases: { "सहवासात": "company, closeness" } }
  "mr-1636":
    native: "trust, belief"
    notes:
      "n1": "{1} is trust in someone, or belief."
    examples:
      "माझा तुझ्यावर विश्वास आहे.": { native: "I trust you.", bases: { "आहे": "to be" } }
      "विश्वास तुटला.": { native: "The trust was broken.", bases: { "तुटला": "to break" } }
  "mr-1637":
    native: "misunderstanding"
    notes:
      "n1": "{1} is a misunderstanding, a wrong idea about someone."
    examples:
      "हा फक्त गैरसमज होता.": { native: "It was only a misunderstanding.", bases: { "होता": "to be" } }
      "गैरसमज दूर करायला हवा.": { native: "The misunderstanding should be cleared up.", bases: { "दूर": "away" } }
  "mr-1638":
    native: "quarrel"
    notes:
      "n1": "{1} is a quarrel between people."
    examples:
      "दोघांचं भांडण झालं.": { native: "The two of them quarrelled.", bases: { "दोघांचं": "of the two", "झालं": "to become" } }
      "भांडण मिटवलं.": { native: "The quarrel was settled.", bases: { "मिटवलं": "to settle" } }
  "mr-1639":
    native: "estrangement, distance"
    notes:
      "n1": "{1} is a rift or distance between people who were close."
    examples:
      "दोन भावांमध्ये दुरावा आला.": "A rift came between the two brothers."
      "दुरावा कमी करा.": { native: "Reduce the distance.", bases: { "कमी": "less" } }
  "mr-1640":
    native: "affection, warmth"
    notes:
      "n1": "{1} is affection or warmth towards someone."
    examples:
      "गावात लोकांची आपुलकी आहे.": { native: "The people of the village have warmth.", bases: { "आहे": "to be" } }
      "तिच्या बोलण्यात आपुलकी होती.": { native: "There was warmth in her talk.", bases: { "होती": "to be" } }
  "mr-1641":
    native: "to quarrel"
    notes:
      "n1": "{1} is quarrelling with someone."
    examples:
      "ते का भांडत आहेत?": { native: "Why are they quarrelling?", bases: { "आहेत": "to be", "भांडत": "to quarrel" } }
      "भावंडं नेहमी भांडतात.": { native: "Siblings always quarrel.", bases: { "भावंडं": "siblings", "भांडतात": "to quarrel" } }
  "mr-1642":
    native: "to forgive"
    notes:
      "n1": "{1} is pardoning someone for a fault."
    examples:
      "मला माफ कर.": "Forgive me."
      "तिने त्याला माफ केलं.": "She forgave him."
  "mr-1643":
    native: "to trust"
    notes:
      "n1": "{1} is trusting someone."
    examples:
      "माझा तुझ्यावर विश्वास ठेवा.": "Trust me."
      "ती कोणावरही पटकन विश्वास ठेवत नाही.": { native: "She does not trust anyone quickly.", bases: { "नाही": "not" } }
  "mr-1644":
    native: "to treat with warmth"
    notes:
      "n1": "{1} is treating someone kindly and warmly."
    examples:
      "सगळ्यांशी आपुलकीने वागा.": { native: "Treat everyone warmly.", bases: { "वागा": "to behave" } }
      "ती पाहुण्यांशी आपुलकीने वागते.": { native: "She treats the guests warmly.", bases: { "वागते": "to behave" } }
