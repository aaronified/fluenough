cards:
  "mr-5836":
    native: "My hobby is reading."
    bases: { "माझा": "my", "आहे": "is" }
    confusables: { "w1": { why: "तू (tu) means you; माझा (mājhā) means my." }, "f1": { why: "आहेत (āhet) is plural; छंद (chand) is one hobby, so आहे (āhe) is used." } }
  "mr-5837":
    native: "I run every morning."
    bases: { "धावतो": "run" }
    confusables: { "w1": { why: "आता (ātā) means now; सकाळी (sakāḷi) means in the morning." }, "f1": { why: "धावते (dhāvte) is the feminine form, for a woman runner." } }
  "mr-5838":
    native: "He plays the guitar nicely."
    bases: { "वाजवतो": "plays" }
    confusables: { "w1": { why: "ती (ti) means she; तो (to) means he." }, "f1": { why: "वाजवते (vājavte) is the feminine form, for a woman player." } }
  "mr-5839":
    native: "I like listening to music."
    bases: { "मला": "to me", "ऐकायला": "to listen", "आवडते": "like" }
    confusables: { "w1": { why: "नाही (nāhi) means not, which would say I do not like it." }, "w2": { why: "तू (tu) means you; मला (malā) means to me." } }
  "mr-5840":
    native: "She learns painting."
    bases: { "शिकते": "learns" }
    confusables: { "w1": { why: "तो (to) means he, not she." }, "f1": { why: "शिकतो (śikto) is masculine; ती (ti) is she, so शिकते (śikte) is used." } }
  "mr-5841":
    native: "We will go trekking tomorrow."
    bases: { "भटकंतीला": "trekking", "जाऊ": "will go" }
    confusables: { "w1": { why: "आता (ātā) means now; उद्या (udyā) means tomorrow." }, "w2": { why: "तू (tu) means you, not we." } }
  "mr-5842":
    native: "Did you win?"
    bases: { "जिंकलास": "won", "का": "a question marker" }
    confusables: { "w1": { why: "तो (to) means he; तू (tu) means you." }, "f1": { why: "जिंकलो (jiṅkalo) means we won or I won, not a question to you." } }
  "mr-5843":
    native: "Mountain climbing is difficult."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "नाही (nāhi) means not, which would say it is not difficult." }, "f1": { why: "आहेत (āhet) is plural; the activity is one thing, so आहे (āhe) is used." } }
  "mr-5844":
    native: "I have a camera."
    bases: { "माझ्याकडे": "with me", "आहे": "is" }
    confusables: { "w1": { why: "तू (tu) means you; माझ्याकडे (mājhyākaḍe) means with me." }, "f1": { why: "आहेत (āhet) is plural; one camera takes आहे (āhe)." } }
  "mr-5845":
    native: "Our club's competition is tomorrow."
    bases: { "आमच्या": "our", "क्लबची": "of the club", "आहे": "is" }
    confusables: { "w1": { why: "आता (ātā) means now; उद्या (udyā) means tomorrow." }, "w2": { why: "आम्ही (āmhi) means we, not our." } }
  "mr-5846":
    native: "He lost this competition."
    bases: { "हरला": "lost" }
    confusables: { "w1": { why: "ती (ti) means she, not he." }, "w2": { why: "जिंकला (jiṅkalā) means he won, the opposite of हरला (harlā)." } }
  "mr-5847":
    native: "I like gardening."
    bases: { "मला": "to me", "आवडते": "like" }
    confusables: { "w1": { why: "नाही (nāhi) means not, which would say I do not like gardening." }, "f1": { why: "आवडतो (āvaḍto) is the masculine form; बागकाम (bāgkām) takes आवडते (āvaḍte)." } }
