cards:
  "mr-6420":
    native: "My relationship with him is good."
    bases: { "माझे": "my", "आणि": "and", "त्याचे": "his", "चांगले": "good", "आहे": "is" }
    confusables: { "w1": { why: "तुमचे (tumce) means your, polite." }, "f1": { why: "चांगली (cāṅgali) is the feminine form, so it does not fit नाते (nāte)." }, "w2": { why: "वाईट (vāiṭ) means bad, the opposite of चांगले (cāṅgale)." } }
  "mr-6421":
    native: "Our friendship is very old."
    bases: { "आमची": "our", "खूप": "very", "जुनी": "old", "आहे": "is" }
    confusables: { "w1": { why: "आमचा (āmcā) is masculine; मैत्री (maitri) is feminine." }, "f1": { why: "जुना (junā) is masculine, so it does not fit मैत्री (maitri)." }, "w2": { why: "नवीन (navin) means new, the opposite of जुनी (juni)." } }
  "mr-6422":
    native: "He is my partner."
    bases: { "तो": "he", "माझा": "my", "आहे": "is" }
    confusables: { "w1": { why: "ती (ti) means she." }, "f1": { why: "आहेत (āhet) is plural." }, "w2": { why: "माझी (mājhi) is feminine, so it does not fit जोडीदार (joḍidār)." } }
  "mr-6423":
    native: "My sister-in-law is coming today."
    bases: { "माझी": "my", "आज": "today", "येणार": "coming", "आहे": "is" }
    confusables: { "w1": { why: "दीर (dir) means husband's elder brother." }, "f1": { why: "येतो (yeto) is the simple present: comes." }, "w2": { why: "सून (sun) means daughter-in-law." } }
    notes: { "n1": "Is coming is येणार (yeṇār) आहे (āhe): the -णार (-ṇār) form with आहे (āhe) is the everyday future, beside -ईल (-īl)." }
  "mr-6424":
    native: "They trust each other."
    bases: { "ते": "they", "एकमेकांवर": "on each other", "ठेवतात": "keep" }
    confusables: { "w1": { why: "तो (to) means he." }, "f1": { why: "ठेवतो (ṭhevto) is for one man." }, "w2": { why: "मैत्री (maitri) means friendship." } }
    notes: { "n1": "Trust is विश्वास (viśvās) ठेवणे (ṭhevṇe): the noun विश्वास (viśvās), trust, plus ठेवणे (ṭhevṇe), to keep." }
  "mr-6425":
    native: "I forgive you."
    bases: { "मी": "I", "तुला": "you", "माफ": "forgiveness", "करतो": "do" }
    confusables: { "w1": { why: "मला (malā) means to me." }, "f1": { why: "करतात (kartāt) is for more than one person." }, "w2": { why: "माफी (māphi) is the noun for apology or forgiveness." } }
    notes: { "n1": "Forgive is माफ (māph) करणे (karṇe), with माफ (māph), forgiveness, plus करणे (karṇe), to do." }
  "mr-6426":
    native: "He treats people with warmth."
    bases: { "तो": "he", "आपुलकीने": "with warmth", "वागतो": "behave" }
    confusables: { "w1": { why: "ती (ti) means she." }, "f1": { why: "वागते (vāgte) is for a woman." }, "w2": { why: "भांडणे (bhāṇḍaṇe) means quarrelling." } }
    notes: { "n1": "Warmly is आपुलकीने (āpulkine): the -ने (-ne) on आपुलकी (āpulki), warmth, makes the manner adverb." }
  "mr-6427":
    native: "Clear up the misunderstanding."
    bases: { "दूर": "away", "कर": "do (informal)" }
    confusables: { "w1": { why: "भांडण (bhāṇḍaṇ) means a quarrel." }, "f1": { why: "करा (karā) is polite; कर (kar) is informal." }, "w2": { why: "दुरावा (durāvā) means a rift." } }
    notes: { "n1": "Remove a misunderstanding is गैरसमज (gairsamaj) दूर (dur) करणे (karṇe): दूर (dur), away, goes before करणे (karṇe), to do, and कर (kar) is the friend form." }
  "mr-6428":
    native: "There is a rift between them."
    bases: { "त्यांच्यात": "between them", "आहे": "is" }
    confusables: { "w1": { why: "विश्वास (viśvās) means trust." }, "f1": { why: "आहेत (āhet) is plural." }, "w2": { why: "आपुलकी (āpulki) means affection, the opposite." } }
    notes: { "n1": "Between them is त्यांच्यात (tyāñcyāt): the plural oblique त्यांच्या (tyāñcyā) takes -त (-t), 'in' or 'between'." }
  "mr-6429":
    native: "The son-in-law is coming to eat today."
    bases: { "आज": "today", "जेवायला": "to eat", "येणार": "coming", "आहे": "is" }
    confusables: { "w1": { why: "सून (sun) means daughter-in-law." }, "f1": { why: "येतो (yeto) is the simple present." }, "w2": { why: "मुलगा (mulgā) means son." } }
    notes: { "n1": "To eat is जेवायला (jevāylā): the verb takes -ायला (-āylā) for a short purpose, 'to' or 'in order to'." }
  "mr-6430":
    native: "My brother and his wife are coming today."
    bases: { "माझा": "my", "आणि": "and", "त्याची": "his", "आज": "today", "येणार": "coming", "आहेत": "are" }
    confusables: { "w1": { why: "वहिनी (vahini) means sister-in-law." }, "f1": { why: "आहे (āhe) is singular." }, "w2": { why: "दीर (dir) means husband's elder brother." } }
    notes: { "n1": "Are coming is येणार (yeṇār) आहेत (āhet): the -णार (-ṇār) form is the same as in येणार (yeṇār) आहे (āhe), while आहेत (āhet), are, agrees with the two people." }
