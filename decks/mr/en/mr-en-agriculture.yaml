schema: 1
id: "mr-en-agriculture"
kind: "layer"
core: "mr-agriculture"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Agriculture"
description: "Farming in Maharashtra: the crops such as jowar and sugarcane, sowing and harvest, the plough, water and the words for a farmer's year. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-1502":
    native: "farming, agriculture"
    notes:
      "n1": "{1} is farming, the work of growing crops and keeping animals."
    examples:
      "आमची शेती मोठी आहे.": { native: "Our farm is big.", bases: { "आहे": "to be" } }
      "शेतीवर अनेक कुटुंबं जगतात.": { native: "Many families live by farming.", bases: { "जगतात": "to live", "शेतीवर": "farming, agriculture" } }
  "mr-1503":
    native: "crop"
    notes:
      "n1": "{1} is a crop grown in a field."
    examples:
      "यंदा पीक चांगलं आलं.": { native: "This year the crop came up well.", bases: { "यंदा": "this year" } }
      "पिकांचं नुकसान झालं.": { native: "The crops were damaged.", bases: { "नुकसान": "damage", "झालं": "to become", "पिकांचं": "crop" } }
  "mr-1504":
    native: "seed"
    notes:
      "n1": "{1} is a seed."
    examples:
      "बी पेरलं.": "I sowed the seed."
      "चांगलं बी निवडा.": "Choose a good seed."
  "mr-1505":
    native: "fertiliser, manure"
    notes:
      "n1": "{1} is fertiliser or manure put on the soil."
    examples:
      "शेतात खत टाका.": { native: "Put fertiliser in the field.", bases: { "टाका": "to put" } }
      "खताचा वापर वाढला.": { native: "The use of fertiliser increased.", bases: { "वापर": "use", "खताचा": "fertiliser, manure" } }
  "mr-1506":
    native: "irrigation"
    notes:
      "n1": "{1} is irrigation, watering fields by channel or pump."
    examples:
      "शेताला सिंचन करा.": "Irrigate the field."
      "सिंचनामुळे पीक वाढलं.": { native: "Because of irrigation the crop grew.", bases: { "सिंचनामुळे": "irrigation" } }
  "mr-1507":
    native: "well"
    notes:
      "n1": "{1} is a well for water, dug in the ground."
    examples:
      "शेतात विहीर आहे.": { native: "There is a well in the field.", bases: { "आहे": "to be" } }
      "विहिरीचं पाणी गोड आहे.": { native: "The well's water is sweet.", bases: { "आहे": "to be", "विहिरीचं": "well" } }
  "mr-1508":
    native: "canal"
    notes:
      "n1": "{1} is a canal that carries water to fields."
    examples:
      "कालव्यातून पाणी येतं.": { native: "Water comes through the canal.", bases: { "कालव्यातून": "canal" } }
      "कालवा स्वच्छ करा.": "Clean the canal."
  "mr-1509":
    native: "dam"
    notes:
      "n1": "{1} is a dam that stores water."
    examples:
      "धरण भरलं.": "The dam is full."
      "धरणामुळे शेतीला पाणी मिळतं.": { native: "Because of the dam the farms get water.", bases: { "मिळतं": "to get", "धरणामुळे": "dam" } }
  "mr-1510":
    native: "plough"
    notes:
      "n1": "{1} is a plough pulled by oxen to turn the soil."
    examples:
      "नांगराने शेत नांगरलं.": { native: "The field was ploughed with the plough.", bases: { "नांगरलं": "to plough", "नांगराने": "plough" } }
      "नांगर जुना झाला.": { native: "The plough has become old.", bases: { "झाला": "to become" } }
  "mr-1511":
    native: "tractor"
    notes:
      "n1": "{1} is a tractor, a loanword from English."
    examples:
      "ट्रॅक्टर शेतात चालतो.": "The tractor runs in the field."
      "नवीन ट्रॅक्टर घेतला.": { native: "I bought a new tractor.", bases: { "नवीन": "new" } }
  "mr-1512":
    native: "harvest, reaping"
    notes:
      "n1": "{1} is the harvest, when the crop is cut."
    examples:
      "कापणीचा हंगाम आला.": { native: "The harvest season has come.", bases: { "हंगाम": "season", "कापणीचा": "harvest, reaping" } }
      "कापणीच्या वेळी सगळे शेतात होते.": { native: "At harvest time everyone was in the field.", bases: { "होते": "to be", "कापणीच्या": "harvest, reaping" } }
  "mr-1513":
    native: "sowing"
    notes:
      "n1": "{1} is sowing, putting seeds into the soil."
    examples:
      "पावसाळ्यात पेरणी होते.": { native: "Sowing is done in the monsoon.", bases: { "होते": "to be" } }
      "पेरणीसाठी बियाणं आणलं.": { native: "I brought seed for sowing.", bases: { "बियाणं": "seed", "पेरणीसाठी": "sowing" } }
  "mr-1514":
    native: "sorghum, jowar"
    notes:
      "n1": "{1} is sorghum, a grain grown in Maharashtra."
    examples:
      "ज्वारीची भाकरी आवडते.": { native: "I like sorghum bread.", bases: { "ज्वारीची": "sorghum, jowar" } }
      "शेतात ज्वारी पिकली.": { native: "Sorghum grew in the field.", bases: { "पिकली": "to grow" } }
  "mr-1515":
    native: "pearl millet"
    notes:
      "n1": "{1} is pearl millet, a grain."
    examples:
      "बाजरी पौष्टिक असते.": { native: "Millet is nutritious.", bases: { "असते": "to be" } }
      "थंडीत बाजरीची भाकरी खातात.": { native: "In the cold they eat millet bread.", bases: { "बाजरीची": "pearl millet" } }
  "mr-1516":
    native: "wheat"
    notes:
      "n1": "{1} is wheat."
    examples:
      "गव्हाचं पीक चांगलं आहे.": { native: "The wheat crop is good.", bases: { "आहे": "to be", "गव्हाचं": "wheat" } }
      "गहू दळून पीठ करा.": { native: "Grind the wheat into flour.", bases: { "दळून": "to grind" } }
  "mr-1517":
    native: "sugarcane"
    notes:
      "n1": "{1} is sugarcane, a tall grass used for sugar."
    examples:
      "ऊस गोड असतो.": { native: "Sugarcane is sweet.", bases: { "असतो": "to be" } }
      "शेतात ऊस उभा आहे.": { native: "Sugarcane stands in the field.", bases: { "उभा": "standing", "आहे": "to be" } }
  "mr-1518":
    native: "animal husbandry"
    notes:
      "n1": "{1} is looking after farm animals."
    examples:
      "पशुपालन हा शेतीचा भाग आहे.": { native: "Animal husbandry is part of farming.", bases: { "आहे": "to be" } }
      "गावात पशुपालन जास्त आहे.": { native: "There is more animal husbandry in the village.", bases: { "जास्त": "more", "आहे": "to be" } }
  "mr-1519":
    native: "labourer"
    notes:
      "n1": "{1} is a labourer who works for wages."
    examples:
      "शेतात मजूर काम करतात.": "Labourers work in the field."
      "मजुरांना रोज पैसे मिळतात.": { native: "The labourers get money every day.", bases: { "मिळतात": "to get", "मजुरांना": "labourer" } }
  "mr-1520":
    native: "to sow"
    notes:
      "n1": "{1} is sowing seeds in the soil."
    examples:
      "शेतकरी बी पेरतो.": { native: "The farmer sows seeds.", bases: { "पेरतो": "to sow" } }
      "पेरलेलं बी उगवलं.": { native: "The sown seed sprouted.", bases: { "पेरलेलं": "to sow" } }
  "mr-1521":
    native: "to grow (crops)"
    notes:
      "n1": "{1} is growing a crop on the land."
    examples:
      "तो गहू पिकवतो.": { native: "He grows wheat.", bases: { "पिकवतो": "to grow (crops)" } }
      "आम्ही भाज्या पिकवतो.": { native: "We grow vegetables.", bases: { "पिकवतो": "to grow (crops)" } }
