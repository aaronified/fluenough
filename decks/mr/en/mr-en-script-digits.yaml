schema: 1
id: "mr-en-script-digits"
kind: "layer"
core: "mr-script-digits"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Marathi digits"
license: "CC-BY-SA-4.0"
description: "The ten digits of the Devanagari script, ० (0) to ९ (9), each with its Marathi number word. Marathi uses these digits more than Hindi does: newspapers, calendars and many signs print them."
tags: ["beginner", "unreviewed", "script"]
cards:
  "mr-0665":
    native: "0 (zero)"
    notes:
      "n1": "A small oval, written ० (0). The Marathi word is शून्य (śūnya), and it is the number nothing."
  "mr-0666":
    native: "1 (one)"
    notes:
      "n1": "Easily mixed up with ९ (9). The १ (1) is an upright stroke with a small hook at its top; the ९ (9) has a closed loop at its top and a tail. The word is एक (ek, one)."
  "mr-0667":
    native: "2 (two)"
    notes:
      "n1": "The digit of दोन (don, two). Marathi says दोन (don) where Hindi says दो (dō)."
  "mr-0668":
    native: "3 (three)"
    notes:
      "n1": "The digit of तीन (tin, three)."
  "mr-0669":
    native: "4 (four)"
    notes:
      "n1": "The word is चार (cār, four)."
  "mr-0670":
    native: "5 (five)"
    notes:
      "n1": "The digit of पाच (pāc, five). Marathi says पाच (pāc), not Hindi's पाँच (pām̐c)."
  "mr-0671":
    native: "6 (six)"
    notes:
      "n1": "The digit of सहा (sahā, six). Marathi says सहा (sahā), not Hindi's छह (chah)."
  "mr-0672":
    native: "7 (seven)"
    notes:
      "n1": "The digit of सात (sāt, seven)."
  "mr-0673":
    native: "8 (eight)"
    notes:
      "n1": "The digit of आठ (āṭh, eight)."
  "mr-0674":
    native: "9 (nine)"
    notes:
      "n1": "The digit of नऊ (nau, nine). Look for the closed loop at its top, which the १ (1) does not have."
