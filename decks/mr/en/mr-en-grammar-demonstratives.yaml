schema: 1
id: "mr-en-grammar-demonstratives"
kind: "layer"
core: "mr-grammar-demonstratives"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "This and that"
license: "CC0-1.0"
description: "हा (hā) and तो (to), in three genders, and the words built on इ- (i-) and ति- (ti-): here, this way, like this, so much. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "Near and far"
  slot_name: "near or far"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "masc": "a man, or a masculine noun"
    "fem": "a woman, or a feminine noun"
    "neut": "a neuter noun; these, those (masculine)"
    "fem-pl": "women, or feminine nouns"
    "place": "at a place"
    "way": "towards a place"
    "manner": "in this way"
    "amount": "so much"
  notes: "'This' is हा (hā), ही (hi) or हे (he), 'that' is तो (to), ती (ti) or ते (te), agreeing with the noun: हा मुलगा (hā mulgā), this boy; ही मुलगी (hi mulgi), this girl; हे घर (he ghar), this house. They are also 'he', 'she' and 'it'. Most of the other words for near things start with इ- (i-), and for far ones with ति- (ti-). The older इथे (ithe) and तिथे (tithe) are also written येथे (yethe) and तेथे (tethe)."
