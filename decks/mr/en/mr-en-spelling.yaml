schema: 1
id: "mr-en-spelling"
kind: "layer"
core: "mr-spelling"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Marathi spellings, old and new"
license: "CC0-1.0"
description: "Older print wrote many dots (anusvars) that were not said, and short final vowels where today's rules write long ones. The spelling rules Maharashtra adopted in the 1960s changed both, and books printed before them look like this. Recognition only. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0647":
    native: "no; not; today नाही (nāhi)"
    notes:
      "n1": "Older print put a dot on many final vowels, marking a nasal that had long stopped being said. Today's rules leave it out."
  "mr-0648":
    native: "that; it; today ते (te)"
    notes:
      "n1": "The same unsaid dot, on a neuter word."
  "mr-0649":
    native: "here; today येथे (yethe)"
  "mr-0650":
    native: "why; today का (kā)"
  "mr-0651":
    native: "at home; today घरी (ghari)"
  "mr-0652":
    native: "I do; today करतो (karto)"
    notes:
      "n1": "Older and bookish verb forms kept an -इ- (-i-) that speech had dropped: करितो (karito), करितात (karitāt). Today: करतो (karto), करतात (kartāt)."
  "mr-0653":
    native: "am; today आहे (āhe)"
    notes:
      "n1": "मी आहें (mi āhem̐), I am, in older print, told apart from तो आहे (to āhe) by the dot."
  "mr-0654":
    native: "poet; today कवी (kavi)"
    notes:
      "n1": "Words from Sanskrit kept their short final i and u. Today's rules write them long when they stand alone, as Marathi says them: कवी (kavi), and short inside a compound: कविसंमेलन (kavisammelan), a poets' gathering."
  "mr-0655":
    native: "teacher; guru; today गुरू (guru)"
    notes:
      "n1": "The same rule for u: गुरू (guru) alone, गुरुवार (Thursday) in a compound."
