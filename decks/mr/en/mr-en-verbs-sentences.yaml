tags: ["unreviewed"]
cards:
  "mr-6812":
    native: "I drink milk every day."
    confusables: { "w1": { why: "खाणे (khāṇe) means to eat food, not to drink." }, "f1": { why: "पिते (pite) is said of a woman." } }
  "mr-6813":
    native: "She teaches the children Marathi."
    bases: { "मुलांना": "children (to the children)", "मराठी": "Marathi" }
    confusables: { "w1": { why: "शिकणे (śikṇe) means to learn, not to teach." }, "f1": { why: "शिकवतो (śikvto) is said of a man." } }
  "mr-6814":
    native: "He gets up every morning."
    confusables: { "w1": { why: "झोपणे (jhopṇe) means to sleep, not to get up." }, "f1": { why: "उठते (uṭhte) is said of a woman." }, "w2": { why: "जेवणे (jevṇe) means to eat a meal, not to get up." } }
  "mr-6815":
    native: "I am eating my meal now."
    confusables: { "w1": { why: "खाणे (khāṇe) means to eat food in general." }, "f1": { why: "जेवते (jevte) is said of a woman." } }
  "mr-6816":
    native: "Mother tells the boy a story."
    bases: { "मुलाला": "boy (to the boy)" }
    confusables: { "w1": { why: "बोलणे (bolṇe) means to talk, not to tell a story." }, "f1": { why: "सांगतो (sāṅgato) is said of a man." } }
  "mr-6817":
    native: "I am playing now."
    confusables: { "w1": { why: "पाहणे (pāhṇe) means to watch or look at, not to play." }, "f1": { why: "खेळते (kheḷte) is said of a woman." } }
  "mr-6818":
    native: "He reads my book."
    bases: { "माझे": "my (of me)" }
    confusables: { "w1": { why: "पाहणे (pāhṇe) means to look at, not to read." }, "f1": { why: "वाचते (vācte) is said of a woman." }, "w2": { why: "लिहिणे (lihiṇe) means to write, not to read." } }
  "mr-6819":
    native: "He walks every day."
    confusables: { "w1": { why: "जाणे (jāṇe) means to go to a place, not to walk." }, "f1": { why: "चालते (cālte) is said of a woman." } }
  "mr-6820":
    native: "She writes me a letter."
    bases: { "मला": "me (to me)" }
    confusables: { "w1": { why: "देणे (deṇe) means to give, not to write." }, "f1": { why: "लिहितो (lihito) is said of a man." } }
  "mr-6821":
    native: "Tell me."
    bases: { "मला": "me (to me)" }
    confusables: { "w1": { why: "घेणे (gheṇe) means to take, not to tell." }, "f1": { why: "सांगतो (sāṅgato) is a statement, I or he tells; सांगा (sāṅgā) is an order." } }
  "mr-6822":
    native: "Open the door."
    confusables: { "w1": { why: "ठेवणे (ṭhevṇe) means to keep or put down, not to open." }, "f1": { why: "उघडले (ughḍle) is past tense: opened; उघडा (ughḍā) is an order." } }
  "mr-6823":
    native: "She goes to work every day."
    confusables: { "w1": { why: "येणे (yeṇe) means to come, not to go." }, "f1": { why: "जातो (jāto) is said of a man." } }
