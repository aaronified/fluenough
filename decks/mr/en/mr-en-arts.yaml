schema: 1
id: "mr-en-arts"
kind: "layer"
core: "mr-arts"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Arts"
description: "The arts: painting and sculpture, the instruments of Maharashtrian music, folk poetry and the stage, with the words to talk about them. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-1545":
    native: "art"
    notes:
      "n1": "{1} is art, a skill used to make beautiful things."
    examples:
      "ही कला खूप सुंदर आहे.": { native: "This art is very beautiful.", bases: { "आहे": "to be" } }
      "कलेला वय नसतं.": { native: "Art has no age.", bases: { "नसतं": "not", "कलेला": "art" } }
  "mr-1546":
    native: "picture, painting"
    notes:
      "n1": "{1} is a picture or a painting."
    examples:
      "भिंतीवर सुंदर चित्र लावलं.": { native: "I hung a beautiful picture on the wall.", bases: { "भिंतीवर": "on the wall", "लावलं": "to hang" } }
      "त्याने चित्र काढलं.": "He drew a picture."
  "mr-1547":
    native: "painter, artist"
    notes:
      "n1": "{1} is a painter. The feminine is चित्रकर्ती (citrakartī)."
    examples:
      "चित्रकार रंग मिसळतो.": { native: "The painter mixes colours.", bases: { "रंग": "colours" } }
      "चित्रकाराचं प्रदर्शन आहे.": { native: "The painter has an exhibition.", bases: { "आहे": "to be", "चित्रकाराचं": "painter, artist" } }
  "mr-1548":
    native: "sculpture, craft"
    notes:
      "n1": "{1} is a sculpture or a crafted object."
    examples:
      "हे शिल्प दगडाचं आहे.": { native: "This sculpture is of stone.", bases: { "दगडाचं": "of stone", "आहे": "to be" } }
      "शिल्पावर सुरेख कोरीव काम आहे.": { native: "The sculpture has fine carving.", bases: { "आहे": "to be", "शिल्पावर": "sculpture, craft" } }
  "mr-1549":
    native: "sculptor"
    notes:
      "n1": "{1} is a sculptor who carves or shapes sculptures."
    examples:
      "शिल्पकार दगड कोरतो.": { native: "The sculptor carves stone.", bases: { "दगड": "stone" } }
      "शिल्पकाराने मूर्ती घडवली.": { native: "The sculptor shaped the statue.", bases: { "मूर्ती": "statue", "घडवली": "to shape", "शिल्पकाराने": "sculptor" } }
  "mr-1550":
    native: "dance (classical)"
    notes:
      "n1": "{1} is dance, especially a classical or folk dance."
    examples:
      "नृत्य पाहायला आवडतं.": "I like to watch dance."
      "भरतनाट्यम हे नृत्य आहे.": { native: "Bharatanatyam is a dance.", bases: { "आहे": "to be" } }
  "mr-1551":
    native: "musical instrument"
    notes:
      "n1": "{1} is a musical instrument."
    examples:
      "सगळ्यांनी आपापली वाद्यं वाजवली.": "Everyone played their own instruments."
      "हे वाद्य जुनं आहे.": { native: "This instrument is old.", bases: { "आहे": "to be" } }
  "mr-1552":
    native: "tabla"
    notes:
      "n1": "{1} is a tabla, a pair of hand drums played in Indian music."
    examples:
      "तबला सुरेल वाजला.": { native: "The tabla played sweetly.", bases: { "वाजला": "to play" } }
      "तो तबला शिकतो.": "He learns the tabla."
  "mr-1553":
    native: "dholak, small drum"
    notes:
      "n1": "{1} is a dholak, a small barrel drum."
    examples:
      "ढोलकीच्या तालावर नाचतात.": { native: "They dance to the beat of the dholak.", bases: { "तालावर": "to the beat", "ढोलकीच्या": "dholak, small drum" } }
      "ढोलकी जोरात वाजली.": { native: "The dholak played loudly.", bases: { "जोरात": "loudly", "वाजली": "to play" } }
  "mr-1554":
    native: "poem"
    notes:
      "n1": "{1} is a poem."
    examples:
      "ती सुंदर कविता लिहिते.": "She writes beautiful poems."
      "कविता मोठ्याने वाचा.": { native: "Read the poem aloud.", bases: { "मोठ्याने": "aloud" } }
  "mr-1555":
    native: "poet"
    notes:
      "n1": "{1} is a poet. The feminine is कवयित्री (kavayitrī)."
    examples:
      "कवी प्रेमाबद्दल लिहितो.": "The poet writes about love."
      "कवीने नवीन कविता सादर केली.": { native: "The poet presented a new poem.", bases: { "नवीन": "new", "सादर": "presented", "कवीने": "poet" } }
  "mr-1556":
    native: "folk verse (ovi)"
    notes:
      "n1": "{1} is a traditional folk verse sung by women while they work."
    examples:
      "आजी ओवी म्हणते.": { native: "Grandmother sings a folk verse.", bases: { "म्हणते": "to sing" } }
      "ओवी ऐकताना मन भरून येतं.": "Listening to a folk verse, the heart is filled."
  "mr-1557":
    native: "lavani, folk dance"
    notes:
      "n1": "{1} is lavani, a folk song and dance of Maharashtra."
    examples:
      "लावणी नृत्य रंगभूमीवर होतं.": { native: "Lavani dance was staged on the stage.", bases: { "रंगभूमीवर": "on the stage", "होतं": "to be" } }
      "लावणीची सुंदर चाल आहे.": { native: "The lavani has a beautiful tune.", bases: { "चाल": "tune", "आहे": "to be", "लावणीची": "lavani, folk dance" } }
  "mr-1558":
    native: "stage"
    notes:
      "n1": "{1} is a stage for performances."
    examples:
      "रंगमंचावर नाटक सुरू झालं.": { native: "The play started on the stage.", bases: { "सुरू": "started", "झालं": "to become", "रंगमंचावर": "stage" } }
      "कलाकार रंगमंचावर आले.": "The artists came onto the stage."
  "mr-1559":
    native: "exhibition"
    notes:
      "n1": "{1} is an exhibition of art or things."
    examples:
      "प्रदर्शनी आज शेवटची आहे.": { native: "The exhibition is on its last day today.", bases: { "शेवटची": "last", "आहे": "to be" } }
      "प्रदर्शनीत अनेक चित्रं आहेत.": { native: "There are many pictures at the exhibition.", bases: { "आहेत": "to be", "प्रदर्शनीत": "exhibition" } }
  "mr-1560":
    native: "melodious, tuneful"
    notes:
      "n1": "{1} describes a voice or a tune that sounds sweet."
    examples:
      "तिचा आवाज सुरेल आहे.": { native: "Her voice is melodious.", bases: { "आवाज": "voice", "आहे": "to be" } }
      "सुरेल गाणं ऐकलं.": "I heard a tuneful song."
  "mr-1561":
    native: "carved, engraved"
    notes:
      "n1": "{1} describes a surface cut with a design."
    examples:
      "दारावर कोरीव काम आहे.": { native: "There is carving on the door.", bases: { "आहे": "to be" } }
      "कोरीव दगड सुंदर दिसतो.": { native: "The carved stone looks beautiful.", bases: { "दगड": "stone", "दिसतो": "to appear" } }
  "mr-1562":
    native: "to sing"
    notes:
      "n1": "{1} is singing. The noun form is गाणं (gāṇaṁ), a song."
    examples:
      "ती छान गाते.": { native: "She sings nicely.", bases: { "गाते": "to sing" } }
      "आम्ही मिळून गाणं गायलो.": { native: "We sang a song together.", bases: { "गायलो": "to sing" } }
  "mr-1563":
    native: "to paint, to colour"
    notes:
      "n1": "{1} is painting or colouring a surface."
    examples:
      "भिंत निळ्या रंगाने रंगवली.": { native: "I painted the wall blue.", bases: { "रंगाने": "with colour", "रंगवली": "to paint, to colour" } }
      "मुलांनी चित्र रंगवलं.": { native: "The children coloured the picture.", bases: { "रंगवलं": "to paint, to colour" } }
  "mr-1564":
    native: "to carve"
    notes:
      "n1": "{1} is carving a design into stone or wood."
    examples:
      "शिल्पकार दगडावर नक्षी कोरतो.": { native: "The sculptor carves a design on the stone.", bases: { "दगडावर": "on the stone", "कोरतो": "to carve" } }
      "लाकडावर सुंदर नक्षी कोरली.": { native: "A beautiful design was carved on the wood.", bases: { "लाकडावर": "on the wood", "कोरली": "to carve" } }
  "mr-1565":
    native: "to play (an instrument)"
    notes:
      "n1": "{1} is playing a musical instrument."
    examples:
      "तो बासरी वाजवतो.": { native: "He plays the flute.", bases: { "वाजवतो": "to play (an instrument)" } }
      "मुलगी तबला वाजवते.": { native: "The girl plays the tabla.", bases: { "वाजवते": "to play (an instrument)" } }
