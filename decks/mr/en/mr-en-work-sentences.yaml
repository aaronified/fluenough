id: "mr-en-work-sentences"
kind: "layer"
core: "mr-work-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences about work"
license: "CC-BY-SA-4.0"
description: "Short sentences that use the words of this unit. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-6848":
    native: "My mother is a doctor."
    bases: { "माझी": "my (of me)", "आहे": "is" }
    notes:
      "n1": "माझी (mājhī), my, agrees with आई (āī), mother, a feminine noun, not with the speaker."
    confusables: { "w1": { why: "शिक्षक (śikṣak) means teacher, not doctor." }, "f1": { why: "आहेत (āhet) is plural; आई (āi) is one mother." }, "w2": { why: "ड्रायव्हर (ḍrāyavhar) is a driver, not a doctor." } }
  "mr-6849":
    native: "He goes to the office every day."
    confusables: { "w1": { why: "येणे (yeṇe) means to come, not to go." }, "f1": { why: "जाते (jāte) is said of a woman." }, "w2": { why: "नोकरी (nokri) is a job, not the office." } }
  "mr-6850":
    native: "My work is good."
    bases: { "माझे": "my (of me)", "आहे": "is" }
    confusables: { "w1": { why: "नोकरी (nokri) is a job or post; काम (kām) is work or a task." }, "f1": { why: "आहेत (āhet) is plural; काम (kām) is one work." }, "w2": { why: "व्यवसाय (vyavsāy) is a business or profession." } }
  "mr-6851":
    native: "The salary is paid every month."
    bases: { "महिन्याला": "month (every month)", "मिळतो": "gets, is paid" }
    confusables: { "w1": { why: "सुट्टी (suṭṭi) is a holiday or a day off, not pay." }, "f1": { why: "मिळते (miḷte) is for a feminine subject." }, "w2": { why: "पैसे (paise) is money in general; पगार (pagār) is pay for work." } }
  "mr-6852":
    native: "Tomorrow is a day off."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "आज (āj) means today, not tomorrow." }, "f1": { why: "सुट्ट्या (suṭṭyā) is the plural: holidays." }, "w2": { why: "मीटिंग (miṭiṅg) is a meeting, not a day off." } }
  "mr-6853":
    native: "The meeting is in the afternoon."
    bases: { "दुपारी": "afternoon (in the afternoon)", "आहे": "is" }
    confusables: { "w1": { why: "बैठक (baiṭhak) also means meeting." }, "f1": { why: "आहेत (āhet) is plural; one meeting takes आहे (āhe)." }, "w2": { why: "सकाळी (sakāḷi) means in the morning, not the afternoon." } }
  "mr-6854":
    native: "The farmer works in the field."
    bases: { "शेतात": "field (in the field)" }
    notes:
      "n1": "काम करणे (kām karṇe), to work: the noun काम (kām), work, plus करणे (karṇe), to do."
    confusables: { "w1": { why: "दुकानदार (dukāndār) is a shopkeeper, not a farmer." }, "f1": { why: "करते (karte) is said of a woman." }, "w2": { why: "शिक्षक (śikṣak) is a teacher, not a farmer." } }
  "mr-6855":
    native: "The owner is in the office."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "बॉस (bôs) is a boss, the one in charge." }, "f1": { why: "आहेत (āhet) is plural; one owner takes आहे (āhe)." }, "w2": { why: "व्यवसाय (vyavsāy) is a business, not the owner." } }
  "mr-6856":
    native: "What work do you do?"
    confusables: { "w1": { why: "तो (to) means he, not you." }, "f1": { why: "करता (kartā) is the polite form; करतोस (kartos) is the informal form used here." }, "w2": { why: "तुम्ही (tumhi) is the polite or plural you." } }
  "mr-6857":
    native: "He is an engineer."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "ड्रायव्हर (ḍrāyavhar) is a driver, who drives a vehicle." }, "f1": { why: "आहेत (āhet) is plural: for more than one person." }, "w2": { why: "विद्यार्थी (vidyārthi) is a student." } }
  "mr-6858":
    native: "Students learn at school."
    confusables: { "w1": { why: "शिक्षक (śikṣak) is a teacher, who teaches." }, "f1": { why: "शिकतो (śikto) is said of one man; several students take शिकतात (śiktāt)." }, "w2": { why: "शिकवणे (śikvṇe) means to teach, not to learn." } }
  "mr-6859":
    native: "The company is big."
    bases: { "मोठी": "big (feminine)", "आहे": "is" }
    confusables: { "w1": { why: "ऑफिस (ôphis) is an office, a place." }, "f1": { why: "आहेत (āhet) is plural; one company takes आहे (āhe)." }, "w2": { why: "व्यवसाय (vyavsāy) is a business, not the company." } }
