# Layer for mr-culture-4: each passage's English rendering (the builder's own) and a note on where it is printed.
schema: 1
id: "mr-en-culture-4"
kind: "layer"
core: "mr-culture-4"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: older verse"
description: "Short passages of Marathi verse by Dnyaneshwar, Namdev, Eknath, Samarth Ramdas, Tukaram, Honaji Bala, Jyotirao Phule, Amrutrai and Vaman Pandit, each with its English rendering and a note. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-4150":
    native: "The giver of happiness and remover of sorrow, Ganesha takes away the troubles of obstacles and fills us with his love and grace."
    notes:
      "n1": "The opening lines of the aarti to Ganesha, as printed in the Marathi Wikipedia article on it, which names Samarth Ramdas as its author."
  "mr-4151":
    native: "O dark-hued Shridhara, the dawn has broken; rise quickly, O garland-wearer, for the sun has come up over the eastern hill."
    notes:
      "n1": "The opening lines of a bhupali (dawn song), as transcribed on Marathi Wikisource, which names Honaji Bala as its author."
  "mr-4152":
    native: "Sing the glorious ballad of Chhatrapati Shivaji of the Bhosale line, the pride of the cultivators."
    notes:
      "n1": "The opening couplet of Phule's powada on Shivaji, as printed on Marathi Wikisource."
  "mr-4153":
    native: "Oh, hold on to some refuge, whatever it may be."
    notes:
      "n1": "The opening line of a pad by Amrutrai, printed under his name in an 1883 anthology of verse by several poets on Marathi Wikisource."
  "mr-4154":
    native: "Enjoy all things in keeping with your own duty, and enjoy them in their proper time, as the verse says."
    notes:
      "n1": "A verse of Vaman Pandit's Ramayana, printed in the 1883 anthology of verse by several poets on Marathi Wikisource."
  "mr-4155":
    native: "First I bow to the lord of the ganas, the son of Uma and Shankar."
    notes:
      "n1": "The opening lines of an abhang collection attributed to Namdev, as headed on Marathi Wikisource; the lines invoke Ganesha."
  "mr-4156":
    native: "Now may the soul of the universe be pleased by this sacrifice of words, and being pleased, grant me this gift, the Pasayadan."
    notes:
      "n1": "The opening lines of the Pasayadan, as printed on mr.wikisource, whose page names Dnyaneshwar as its author."
  "mr-4157":
    native: "May the wickedness of the wicked be dispelled, may love for good deeds grow in them, and may the beings of the world be bound together in friendship."
    notes:
      "n1": "The lines that follow the opening of the Pasayadan, as printed on mr.wikisource."
  "mr-4158":
    native: "Hail to the auspicious lord of the banyan, who hides the appearance of the world and then reveals it, having appeared as the one who swallows."
    notes:
      "n1": "The first ovi of Changdev Pasashti, as printed on mr.wikisource, whose page names Dnyaneshwar as its author."
  "mr-4159":
    native: "This entire word-Brahman is that same beautiful form, and there its faultless body of letters shines forth."
    notes:
      "n1": "An ovi of the first chapter of the Dnyaneshwari, as printed on mr.wikisource, whose page names Dnyaneshwar as its author."
  "mr-4160":
    native: "You sit in the ocean of milk, so run and grant me a meeting; Shiva of Kailas worships you, so run and grant me a meeting."
    notes:
      "n1": "The abhang as printed on mr.wikisource, whose page names Namdev as its author."
  "mr-4161":
    native: "Just as the chakravaka bird weeps in separation, and as lost children cry for their mother, so it has come to me now."
    notes:
      "n1": "The abhang as printed on mr.wikisource, whose page names Namdev as its author."
  "mr-4162":
    native: "Therefore I bow to you as you are, both with form and without form; then the limbs lose their separateness, and worshipper and worshipped become one."
    notes:
      "n1": "An ovi of the first chapter of the Bhavartha Ramayan, as printed on mr.wikisource, whose page names Eknath as its author."
  "mr-4163":
    native: "Do not speak without reflection, do not walk without planning, do not move without restraint, and do not act at all in haste."
    notes:
      "n1": "The third verse of Uttam Gun, as printed on mr.wikisource, whose page names Samarth Ramdas as its author."
  "mr-4164":
    native: "Just as water will not flow when a drainage channel is blocked, so the minds of good people must understand things."
    notes:
      "n1": "The fourth verse of Shivrajas Athavave, as printed on mr.wikisource, whose page names Samarth Ramdas as its author."
  "mr-4165":
    native: "I, your bard, praise you, O Rama, and always sing of your glorious renown."
    notes:
      "n1": "The opening lines of the poem Savai, as printed on mr.wikisource, whose page names Samarth Ramdas as its author."
  "mr-4166":
    native: "O monkey, son of Anjani and messenger of Rama, great giver of life, you raise up everyone with strength."
    notes:
      "n1": "The first verse of Chaturdash Maruti Stotre, as printed on mr.wikisource, whose page names Samarth Ramdas as its author."
  "mr-4167":
    native: "Standing lovely on the brick with his feet evenly placed, may my mind rest on Hari; I need no worldly things, and O God, let my longing be for nothing else."
    notes:
      "n1": "The first abhang of the Tukaram Gatha, as printed on mr.wikisource, whose page names Tukaram as its author."
