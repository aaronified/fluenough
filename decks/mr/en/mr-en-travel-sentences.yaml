schema: 1
id: "mr-en-travel-sentences"
kind: "layer"
core: "mr-travel-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences with travel"
license: "CC-BY-SA-4.0"
description: "Short sentences that use the words for travel, places and stays. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-6700":
    native: "This is a beautiful place."
    bases: { "सुंदर": "beautiful", "आहे": "is" }
    confusables: { "w1": { why: "A monument, built to remember: स्मारक (smārak) is a monument." }, "w2": { why: "An attraction, a thing that draws visitors: आकर्षण (ākarṣaṇ) is an attraction." } }
    notes: { "n1": "एक (ek), one, before a noun also serves as 'a': एक सुंदर ठिकाण (ek sundar ṭhikāṇ), a beautiful place." }
  "mr-6701":
    native: "This monument is very old."
    bases: { "जुने": "old", "खूप": "very", "आहे": "is" }
    confusables: { "w1": { why: "A person, not a thing: पर्यटक (paryaṭak) is a tourist, a person." }, "w2": { why: "New, the opposite of old: नवीन (navin) means new." } }
    notes: { "n1": "जुने (june), old, takes -े (-e) for स्मारक (smārak), a neuter noun: a describing word in -आ (-ā) changes with its noun." }
  "mr-6702":
    native: "Tourists visit the fort."
    bases: { "किल्ल्याला": "to the fort", "देतात": "visit" }
    confusables: { "w1": { why: "Tourism, the idea: पर्यटन (paryaṭan) is tourism, not a person." }, "w2": { why: "One man: देतो (deto) means he gives; the tourists are many." } }
    notes: { "n1": "भेट देणे (bheṭ deṇe), to visit: the noun भेट (bheṭ), visit, with देणे (deṇe), to give." }
  "mr-6703":
    native: "Where is the suitcase?"
    bases: { "कुठे": "where", "आहे": "is" }
    confusables: { "w1": { why: "Luggage, the things inside: सामान (sāmān) is luggage." }, "w2": { why: "A place to stay: हॉस्टेल (hôsṭel) is a hostel." } }
  "mr-6704":
    native: "Stay at the hostel."
    bases: { "हॉस्टेलमध्ये": "in the hostel", "राहा": "stay" }
    confusables: { "w1": { why: "A tent, for camping: तंबू (tambu) is a tent, not a hostel." }, "w2": { why: "A foreign country: विदेश (videś) means abroad." } }
  "mr-6705":
    native: "Is there a booking?"
    bases: { "आहे": "is", "का": "a question marker" }
    confusables: { "w1": { why: "A fare or rent, not a booking: भाडं (bhāḍam) is a fare or rent." }, "w2": { why: "When, not whether: कधी (kadhi) asks when." } }
    notes: { "n1": "आहे (āhe), there is, with a thing: बुकिंग (bukiṅg) आहे (āhe) means there is a booking, and का (kā) makes it a question." }
  "mr-6706":
    native: "Walk about with the guide."
    bases: { "सोबत": "with", "फिरा": "walk about" }
    confusables: { "w1": { why: "The phrase for going sightseeing is फिरायला (phirāylā) जाणे (jāṇe), to go out for a walk." }, "w2": { why: "To get down, another verb: उतरा (utrā) means get off." } }
  "mr-6707":
    native: "Put the luggage in the bag."
    bases: { "बॅगेत": "in the bag", "ठेवा": "put" }
    confusables: { "w1": { why: "A suitcase, a bag for clothes: सूटकेस (suṭkes) is a suitcase." }, "w2": { why: "To take out, the opposite: काढा (kāḍhā) means take out." } }
  "mr-6708":
    native: "I want to go abroad."
    bases: { "मला": "to me", "विदेशात": "abroad", "जायचे": "to go", "आहे": "is" }
    confusables: { "w1": { why: "Local, not abroad: देशी (deśi) means local or native." }, "w2": { why: "To come, the opposite of going: येणे (yeṇe) means to come." } }
    notes: { "n1": "With मला (malā), जायचे आहे (jāyce āhe) means I want to go or I have to go, the infinitive जायचे (jāyce), to go, with आहे (āhe)." }
  "mr-6709":
    native: "We got to know each other."
    bases: { "आमची": "our", "झाली": "happened" }
    confusables: { "w1": { why: "A visit, not an acquaintance: भेट (bheṭ) is a visit." }, "w2": { why: "A name, one thing you learn about someone: नाव (nāv) means name." } }
    notes: { "n1": "झाली (jhālī), happened, agrees with ओळख (oḷakh), a feminine subject: the past of होणे (hoṇe), to become or happen." }
  "mr-6710":
    native: "This is a local fruit."
    bases: { "देशी": "local", "आहे": "is" }
    confusables: { "w1": { why: "Abroad, the opposite: विदेश (videś) means abroad." }, "w2": { why: "Foreign, from another country: परदेशी (paradeśi) means foreign." } }
  "mr-6711":
    native: "Set up the tent here."
    bases: { "इथे": "here", "लावा": "set up" }
    confusables: { "w1": { why: "A monument, not a tent: स्मारक (smārak) is a monument." }, "w2": { why: "Another place to stay: हॉस्टेल (hôsṭel) is a hostel." } }
