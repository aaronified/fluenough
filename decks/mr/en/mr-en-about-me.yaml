schema: 1
id: "mr-en-about-me"
kind: "layer"
core: "mr-about-me"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "About me"
license: "CC-BY-SA-4.0"
description: "Your name, where you are from, where you live, your age and the languages you speak. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0204":
    native: "name"
    notes:
      "n1": "Neuter: माझे नाव (mājhe nāv), my name. The same word also means 'boat', and then it is feminine: ती नाव (ti nāv), that boat."
    "examples": {
      "मी नाव विसरलो.": {"native": "I forgot the name.", "bases": {"विसरलो": "to forget"}},
      "तुमचे नाव काय आहे?": {"native": "What is your name?", "bases": {"तुमचे": "your", "आहे": "to be"}}
    }
  "mr-0206":
    native: "I'm from England. (a man speaking)"
    notes:
      "n1": "'I am England's': -चा (-cā) agrees with the speaker, so a woman says इंग्लंडची (iṅglaṇḍci). Also मी इंग्लंडहून आलो आहे (mi iṅglaṇḍahun ālo āhe), I've come from England. असणे (asṇe) changes its stem in the present: आह- (āh-)."
    bases:
      "इंग्लंडचा": "England"
      "आहे": "to be"
  "mr-0207":
    native: "I live in Pune. (a man speaking)"
    notes:
      "n1": "पुणे (puṇe) becomes पुण्या- (puṇyā-) before -त (-ta), 'in'. A woman says राहते (rāhte)."
    bases:
      "पुण्यात": "Pune"
      "राहतो": "to live; to stay"
  "mr-0208":
    native: "country"
    notes:
      "n1": "तुमचा देश कोणता? (tumcha desh konta?), which is your country?"
    "examples": {
      "देशासाठी बलिदान दिलं.": {"native": "He sacrificed for the country.", "bases": {"देशासाठी": "country"}},
      "भारत लोकशाही देश आहे.": {"native": "India is a democracy.", "bases": {"आहे": "to be", "भारत": "India"}}
    }
  "mr-0209":
    native: "village; home town"
    notes:
      "n1": "Even city people speak of their गाव (gāv), the place their family comes from: तुमचे गाव कोणते? (tumche gav konte?)."
    "examples": {
      "आमदार गावात आले.": {"native": "The MLA came to the village.", "bases": {"गावात": "village; home town"}},
      "बातमी गावभर पसरली.": {"native": "The news spread all over the village.", "bases": {"पसरली": "to spread", "गावभर": "village; home town"}}
    }
  "mr-0058":
    notes:
      "n1": "मी मुंबई शहरात राहतो (mi mumbai śahrāt rāhto), I live in the city of Mumbai."
  "mr-0210":
    native: "age"
    "examples": {
      "कलेला वय नसतं.": {"native": "Art has no age.", "bases": {"नसतं": "not", "कलेला": "art", "वय": "age"}},
      "तुमचे वय किती आहे?": {"native": "How old are you?", "bases": {"तुमचे": "your", "आहे": "to be"}}
    }
  "mr-0211":
    native: "How old are you?"
    notes:
      "n1": "'Your age how much is?'. An answer: मी तीस वर्षांचा आहे (mi tis varṣāñcā āhe), I'm thirty; a woman says वर्षांची (varṣāñci). असणे (asṇe) changes its stem in the present: आह- (āh-)."
    bases:
      "तुमचे": "your"
      "आहे": "to be"
  "mr-0212":
    native: "wedding; marriage"
    notes:
      "n1": "माझे लग्न झाले आहे (mājhe lagna jhāle āhe), I'm married: 'my wedding has happened'. The final a is said after the conjunct."
    "examples": {
      "लग्न करणे": {"native": "to marry", "bases": {"करणे": "to do; to make"}},
      "कुणाशी लग्न ठरलं?": {"native": "Who was the wedding fixed with?", "bases": {"ठरलं": "to be fixed"}}
    }
  "mr-0213":
    native: "friend (a man)"
    "examples": {
      "एकटेपणा घालवायला मित्रांना भेटतो.": {"native": "To pass the loneliness, I meet my friends.", "bases": {"घालवायला": "to pass", "भेटतो": "to meet", "मित्रांना": "friend (a man)"}},
      "तू माझा मित्र आहेस.": {"native": "You are my friend.", "bases": {"माझा": "my", "आहेस": "are"}}
    }
  "mr-0214":
    native: "friend (a woman)"
    "examples": {
      "ही माझी मैत्रीण आहे.": {"native": "This is my friend.", "bases": {"माझी": "my", "आहे": "is"}}
    }
  "mr-0215":
    native: "language"
    notes:
      "n1": "मराठी भाषा (marāṭhi bhāṣā), the Marathi language."
    "examples": {
      "देशी भाषा शिका.": {"native": "Learn the local language.", "bases": {"भाषा": "language"}}
    }
  "mr-0216":
    native: "I speak English. (a man speaking)"
    notes:
      "n1": "इंग्रजी (iṅgraji) is English. A woman says बोलते (bolte)."
    bases:
      "इंग्रजी": "English"
      "बोलतो": "to speak"
