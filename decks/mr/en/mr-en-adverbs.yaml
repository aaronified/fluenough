schema: 1
id: "mr-en-adverbs"
kind: "layer"
core: "mr-adverbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Adverbs: how often, how well, when"
license: "CC-BY-SA-4.0"
description: "How often, how well and when things are done, and where. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-0726":
    native: "rarely; seldom"
    notes:
      "n1": "The opposite is नेहमी (nehmī), always (mr-0506)."
    examples:
      "तो क्वचित चित्रपट पाहतो.": { native: "He rarely watches films.", bases: { "चित्रपट": "film", "पाहतो": "to see" } }
      "ती क्वचित बाहेर जेवते.": { native: "She rarely eats out.", bases: { "बाहेर": "outside" } }
  "mr-0727":
    native: "often; many times"
    notes:
      "n1": "कधीकधी (kadhīkadhī) means sometimes, and अनेकदा (anekadā) means often: keep them apart."
    examples:
      "मी अनेकदा तिथे जातो.": { native: "I often go there.", bases: { "मी": "I", "जातो": "to go" } }
      "ती अनेकदा फोन करते.": { native: "She often phones.", bases: { "फोन": "phone", "करते": "to do" } }
  "mr-0728":
    native: "usually; as a rule"
    notes:
      "n1": "It comes before the verb: तो सहसा उशिरा येतो (to sahasā uśirā yeto), he usually comes late."
    examples:
      "तो सहसा सात वाजता उठतो.": "He usually gets up at seven."
      "ती सहसा घरी जेवते.": "She usually eats at home."
  "mr-0729":
    native: "well"
    notes:
      "n1": "From चांगला (cāṅgalā), good: the form ending in -े (-e) is the adverb, after a verb: ती चांगले गाते (tī cāṅgle gāte), she sings well."
    examples:
      "ती चांगले गाते.": { native: "She sings well.", bases: { "गाते": "to sing" } }
      "तो चांगले चालतो.": "He walks well."
  "mr-0730":
    native: "badly"
    notes:
      "n1": "From वाईट (vāīṭ), bad: after a verb it means badly."
    examples:
      "तो वाईट बोलतो.": { native: "He speaks badly.", bases: { "बोलतो": "to speak" } }
      "ती हे काम वाईट करते.": { native: "She does this work badly.", bases: { "करते": "to do" } }
  "mr-0731":
    native: "slowly; quietly"
    notes:
      "n1": "From हळू (haḷū), slow: जरा हळू बोला (jarā haḷū bolā), speak a little more quietly."
    examples:
      "तो हळू चालतो.": "He walks slowly."
      "कृपया हळू बोला.": { native: "Please speak slowly.", bases: { "कृपया": "please", "बोला": "to speak" } }
  "mr-0732":
    native: "quickly; at once"
    notes:
      "n1": "It is often used with a command: पटकन या (paṭkan yā), come quickly."
    examples:
      "तो पटकन खातो.": { native: "He eats quickly.", bases: { "खातो": "to eat" } }
      "पटकन या!": { native: "Come quickly!", bases: { "या": "to come" } }
  "mr-0733":
    native: "properly; neatly; carefully"
    notes:
      "n1": "As an adjective नीट (nīṭ) means tidy: नीट खोली (nīṭ kholī), a tidy room (mr-0459: खोली (kholī))."
    examples:
      "तिने काम नीट केले.": { native: "She did the work properly.", bases: { "केले": "to do" } }
      "दार नीट बंद करा.": { native: "Close the door properly.", bases: { "बंद": "closed", "करा": "to do" } }
  "mr-0734":
    native: "before; first; earlier"
    notes:
      "n1": "Also 'first': आधी तुम्ही (ādhī tumhī), you first."
    examples:
      "मी आधी जेवतो, मग काम करतो.": { native: "I eat first, then I work.", bases: { "मी": "I", "मग": "then", "करतो": "to do" } }
      "ती आधी घरी गेली.": { native: "She went home first.", bases: { "गेली": "to go" } }
  "mr-0735":
    native: "after; afterwards; later"
    notes:
      "n1": "After a noun it means after: जेवणानंतर (jevaṇānantar), after the meal (mr-0442)."
    examples:
      "आम्ही नंतर भेटू.": { native: "We will meet later.", bases: { "आम्ही": "we", "भेटू": "to meet" } }
      "ती नंतर येईल.": { native: "She will come later.", bases: { "येईल": "to come" } }
  "mr-0736":
    native: "in the morning"
    notes:
      "n1": "सकाळी (sakāḷī) is the form used for 'in the morning'; its noun is सकाळ (sakāḷ), morning (mr-0477)."
    examples:
      "मी सकाळी फिरतो.": { native: "I go for a walk in the morning.", bases: { "मी": "I", "फिरतो": "to walk about" } }
      "ती सकाळी लवकर उठते.": "She gets up early in the morning."
  "mr-0737":
    native: "in the evening"
    notes:
      "n1": "Its noun is संध्याकाळ (sandhyākāḷ), evening (mr-0479)."
    examples:
      "संध्याकाळी आम्ही फिरायला जातो.": { native: "In the evening we go out for a walk.", bases: { "आम्ही": "we", "फिरायला": "to walk about", "जातो": "to go" } }
      "मुले संध्याकाळी खेळतात.": { native: "The children play in the evening.", bases: { "खेळतात": "to play" } }
  "mr-0738":
    native: "here"
    notes:
      "n1": "In इथे थांबा (ithe thāmbā), stop here (mr-0426), it is the same word."
    examples:
      "तो इथे राहतो.": { native: "He lives here.", bases: { "राहतो": "to live" } }
      "इथे पाणी आहे.": { native: "There is water here.", bases: { "आहे": "to be" } }
  "mr-0739":
    native: "there"
    notes:
      "n1": "Pair it with इथे (ithe), here: इथे आणि तिथे (ithe āṇi tithe), here and there."
    examples:
      "पुस्तक तिथे आहे.": { native: "The book is there.", bases: { "आहे": "to be" } }
      "ती तिथे जाते.": { native: "She goes there.", bases: { "जाते": "to go" } }
  "mr-0740":
    native: "up; above; on top"
    notes:
      "n1": "Its opposite is खाली (khālī), down."
    examples:
      "विमान वर उडते.": { native: "The plane flies up.", bases: { "विमान": "plane", "उडते": "to fly" } }
      "वर या!": { native: "Come up!", bases: { "या": "to come" } }
  "mr-0741":
    native: "inside; in"
    notes:
      "n1": "Its opposite is बाहेर (bāher), outside."
    examples:
      "मुले आत खेळतात.": { native: "The children play inside.", bases: { "खेळतात": "to play" } }
      "कृपया आत या.": { native: "Please come in.", bases: { "कृपया": "please", "या": "to come" } }
