native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences with the calendar"
license: "CC-BY-SA-4.0"
description: "Short sentences about months, seasons and dates. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-5207": {"native": "A year has twelve months.", "bases": {"वर्षात": "in a year", "बारा": "twelve", "महिने": "months", "असतात": "are"}, "confusables": {"w1": {"why": "Date, not year: तारीख (tārikh) means date."}, "f1": {"why": "Singular: असते (aste) is for one thing; twelve months take असतात (astāt)."}}}
  "mr-5208": {"native": "What is today's date?", "bases": {"आज": "today", "कोणती": "which", "आहे": "is"}, "confusables": {"w1": {"why": "Month, not date: महिना (mahinā) means month."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; a date is one thing, so आहे (āhe)."}}, "notes": {"n1": "कोणती (koṇti), which, is the feminine form of कोणता (koṇtā) and agrees with तारीख (tārikh), date, a feminine noun."}}
  "mr-5209": {"native": "It is the month of March.", "bases": {"आहे": "is"}, "confusables": {"w1": {"why": "April, not March: एप्रिल (epril) means April."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one month takes आहे (āhe)."}}}
  "mr-5210": {"native": "Diwali is a festival.", "bases": {"सण": "festival", "आहे": "is"}, "confusables": {"w1": {"why": "Gudi Padwa, not Diwali: गुढीपाडवा (guḍhipāḍvā) is the Marathi new year."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one festival takes आहे (āhe)."}}}
  "mr-5211": {"native": "Children play in the summer.", "bases": {"उन्हाळ्यात": "in the summer", "खेळतात": "play"}, "confusables": {"w1": {"why": "Monsoon, not summer: पावसाळा (pāvsāḷā) means the monsoon."}, "f1": {"why": "Singular: खेळतो (kheḷto) is for one man; children are plural, so खेळतात (kheḷtāt)."}}, "notes": {"n1": "उन्हाळा (unhāḷā), summer, becomes उन्हाळ्या- (unhāḷyā-) before -त (-t), 'in': उन्हाळ्यात (unhāḷyāt), in the summer."}}
  "mr-5212": {"native": "In the monsoon, rain falls.", "bases": {"पावसाळ्यात": "in the monsoon", "पाऊस": "rain", "पडतो": "falls"}, "confusables": {"w1": {"why": "Winter, not monsoon: हिवाळा (hivāḷā) means winter."}, "f1": {"why": "Feminine: पडते (paḍte) is for a feminine subject; पाऊस (pāus) is masculine, so पडतो (paḍto) is right."}}, "notes": {"n1": "पाऊस पडणे (pāus paḍṇe), to rain, is literally rain falls, from the verb पडणे (paḍṇe), to fall."}}
  "mr-5213": {"native": "Winter is cold.", "bases": {"थंड": "cold", "असतो": "is"}, "confusables": {"w1": {"why": "Monsoon, not winter: पावसाळा (pāvsāḷā) means the monsoon."}, "f1": {"why": "Feminine: असते (aste) is for a feminine subject; हिवाळा (hivāḷā) is masculine, so असतो (asto) is right."}}}
  "mr-5214": {"native": "Gudi Padwa is in March or April.", "bases": {"किंवा": "or", "एप्रिलमध्ये": "in April", "असतो": "is"}, "confusables": {"w1": {"why": "Diwali, not Gudi Padwa: दिवाळी (divāḷi) means Diwali."}, "f1": {"why": "Feminine: असते (aste) is for a feminine subject; गुढीपाडवा (guḍhipāḍvā) is masculine, so असतो (asto) is right."}}, "notes": {"n1": "-मध्ये (-madhye), in, follows a month name: एप्रिलमध्ये (eprilmadhye), in April."}}
  "mr-5215": {"native": "The rain comes in June.", "bases": {"महिन्यात": "in the month", "पाऊस": "rain", "येतो": "comes"}, "confusables": {"w1": {"why": "July, not June: जुलै (julai) means July."}, "f1": {"why": "Feminine: येते (yete) is for a feminine subject; पाऊस (pāus) is masculine, so येतो (yeto) is right."}}, "notes": {"n1": "महिना (mahinā), month, becomes महिन्या- (mahinyā-) before -त (-t), 'in': महिन्यात (mahinyāt), in the month."}}
  "mr-5216": {"native": "December is the last month.", "bases": {"शेवटचा": "last", "आहे": "is"}, "confusables": {"w1": {"why": "November, not December: नोव्हेंबर (novhembar) means November."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one month takes आहे (āhe)."}}, "notes": {"n1": "शेवटचा (śevṭcā), last, is the masculine form and agrees with महिना (mahinā), month, like any describing word in -आ (-ā)."}}
  "mr-5217": {"native": "In August it is the monsoon season.", "bases": {"महिन्यात": "in the month", "असतो": "is"}, "confusables": {"w1": {"why": "September, not August: सप्टेंबर (sapṭembar) means September."}, "f1": {"why": "Feminine: असते (aste) is for a feminine subject; पावसाळा (pāvsāḷā) is masculine, so असतो (asto) is right."}}, "notes": {"n1": "महिन्यात (mahinyāt), in the month, is महिना (mahinā) with -्या- (-yā-) added before -त (-t), 'in'."}}
  "mr-5218": {"native": "Today's date is the tenth.", "bases": {"आजची": "today's", "दहा": "ten", "आहे": "is"}, "confusables": {"w1": {"why": "Month, not date: महिना (mahinā) means month."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one date takes आहे (āhe)."}}, "notes": {"n1": "आजची (ājci), today's, is आज (āj), today, with -ची (-ci) added to agree with the feminine तारीख (tārikh), date."}}
