schema: 1
id: "mr-en-registers"
kind: "layer"
core: "mr-registers"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Written Marathi and spoken Marathi"
license: "CC-BY-SA-4.0"
description: "Marathi is written in a standard close to the speech of Pune, but speech runs words together and writes its neuter endings as -ं (am̐), while signs and offices use formal words from Sanskrit that nobody says at home. Here they are side by side. Recognition only. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0148":
    notes:
      "n1": "Formal. Between friends, often थँक्स (tham̐ks), or nothing at all."
  "mr-0157":
    notes:
      "n1": "Formal and written: कृपया शांतता राखा (krupayā śāntatā rākhā), please keep quiet, on a sign. In speech the polite verb ending is enough."
  "mr-0137":
    notes:
      "n1": "As 'you', formal: in speeches, to a guest, on the telephone to a stranger, and in shops that want your custom."
    "examples": {
      "आपण जाऊया.": {"native": "Let's go.", "bases": {"जाऊया": "to go"}},
      "आपण शहिदांना स्मरण करतो.": {"native": "We remember the martyrs.", "bases": {"शहिदांना": "the martyrs", "स्मरण": "remembrance"}}
    }
  "mr-0409":
    notes:
      "n1": "The written form. Speech says मुलं (mulam̐), and dialogue in books and films writes it so: a neuter -े (e) is said, and often written, as -ं (am̐)."
    "examples": {
      "उद्यानात मुले खेळतात.": {"native": "Children play in the park.", "bases": {"उद्यानात": "in the park", "खेळतात": "to play", "मुले": "children; boys"}},
      "मुले अंगणात खेळतात.": {"native": "The children play in the yard.", "bases": {"अंगणात": "yard", "खेळतात": "to play"}}
    }
  "mr-0615":
    native: "done; it's happened (spoken form of झाले (jhāle))"
    notes:
      "n1": "The written ending -ए (-e) of a neuter or of a past is said as a nasal a: झाले (jhāle), झालं (jhālam̐); केले (kele), केलं (kelam̐); मुले (mule), मुलं (mulam̐). काय झालं? (kay jhala?), what happened?"
    "examples": {
      "पेमेंट झालं.": {"native": "The payment is done.", "bases": {"झालं": "to become"}},
      "काम पूर्ण झालं.": {"native": "The work was completed.", "bases": {"झालं": "to become", "पूर्ण": "complete"}}
    }
  "mr-0616":
    native: "isn't (spoken)"
    notes:
      "n1": "Spoken for नाही आहे (nāhi āhe): तो घरी नाहीये (to ghari nāhiye), he isn't at home. Written Marathi says नाही (nāhi)."
  "mr-0617":
    native: "toilet (on signs)"
    notes:
      "n1": "'Cleanliness house': what the sign says. Ask for the टॉयलेट (ṭôyleṭ) or बाथरूम (bāthrum)."
  "mr-0618":
    native: "no smoking"
    notes:
      "n1": "-ऊ नये (-u naye) is 'one should not', the language of notices: येथे थुंकू नये (yethe thuṅku naye), do not spit here."
    bases:
      "धूम्रपान": "smoking"
      "करू": "to do; to make"
      "नये": "must not"
  "mr-0619":
    native: "entry; entrance"
    notes:
      "n1": "On signs: प्रवेश बंद (praveś band), no entry."
  "mr-0620":
    native: "mobile phone (formal)"
    notes:
      "n1": "'Roaming sound', on forms and in official letters. Everyone says मोबाइल (mobāil)."
  "mr-0621":
    native: "telephone (formal)"
    notes:
      "n1": "'Far sound'. In speech, फोन (phon)."
  "mr-0622":
    native: "computer (formal)"
    notes:
      "n1": "'Calculator'. In speech, कॉम्प्युटर (kômpyuṭar)."
    "examples": {
      "तो संगणक चालवतो.": {"native": "He operates the computer.", "bases": {"चालवतो": "to run, to operate", "संगणक": "computer (formal)"}},
      "संगणकात व्हायरस आला.": {"native": "A virus came into the computer.", "bases": {"संगणकात": "computer (formal)"}}
    }
  "mr-0623":
    native: "government"
    notes:
      "n1": "महाराष्ट्र शासन (mahārāṣṭr śāsan), the Government of Maharashtra, on every official notice. In speech, सरकार (sarkār)."
  "mr-0624":
    native: "for (formal)"
    notes:
      "n1": "Written and formal: मुलांकरिता (mulāṅkaritā), for children. In speech, -साठी (-sāṭhi)."
  "mr-0625":
    native: "happened (older form of झाले (jhāle))"
    notes:
      "n1": "Older and poetic writing; today झाले (jhāle)."
