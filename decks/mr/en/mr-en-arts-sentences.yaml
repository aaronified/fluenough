cards:
  "mr-5183": {"native": "The painter draws a picture.", "bases": {"काढतो": "draws"}, "confusables": {"w1": {"why": "Poem, not picture: कविता (kavitā) means poem."}, "f1": {"why": "Feminine: काढते (kāḍhte) is for a feminine subject; the painter is masculine, so काढतो (kāḍhto)."}}}
  "mr-5184": {"native": "She sings songs.", "bases": {"गाते": "sings"}, "confusables": {"w1": {"why": "They, not she: ते (te) means they."}, "f1": {"why": "Masculine: गातो (gāto) is for a man; for a woman the form is गाते (gāte)."}}}
  "mr-5185": {"native": "He plays the tabla.", "bases": {"वाजवतो": "plays"}, "confusables": {"w1": {"why": "She, not he: ती (ti) means she."}, "f1": {"why": "Feminine: वाजवते (vājvte) is for a woman; the sentence has a man, so वाजवतो (vājvto)."}}}
  "mr-5186": {"native": "She plays the dholak.", "bases": {"वाजवते": "plays"}, "confusables": {"w1": {"why": "He, not she: तो (to) means he."}, "f1": {"why": "Masculine: वाजवतो (vājvto) is for a man; for a woman the form is वाजवते (vājvte)."}}}
  "mr-5187": {"native": "The poet writes poetry.", "bases": {"करतो": "writes"}, "confusables": {"w1": {"why": "Painter, not poet: चित्रकार (citrakār) means painter."}, "f1": {"why": "Feminine: करते (karte) is for a woman; the poet is a man, so करतो (karto)."}}}
  "mr-5188": {"native": "This ovi is old.", "bases": {"जुनी": "old", "आहे": "is"}, "confusables": {"w1": {"why": "Masculine: हा (hā) goes with a masculine noun; ओवी (ovi) is feminine, so ही (hi) is right."}, "f1": {"why": "Masculine: जुना (junā) goes with a masculine noun; ओवी (ovi) is feminine, so जुनी (juni) is right."}}}
  "mr-5189": {"native": "She dances the lavani.", "bases": {"नाचते": "dances"}, "confusables": {"w1": {"why": "He, not she: तो (to) means he."}, "f1": {"why": "Masculine: नाचतो (nācto) is for a man; for a woman the form is नाचते (nācte)."}}}
  "mr-5190": {"native": "There are performers on the stage.", "bases": {"रंगमंचावर": "on the stage", "आहेत": "are"}, "confusables": {"w1": {"why": "Sculptor, not performer: शिल्पकार (śilpakār) means sculptor."}, "f1": {"why": "Singular: आहे (āhe) is for one thing; the sentence has several performers, so आहेत (āhet)."}}}
  "mr-5191": {"native": "This sculpture is carved.", "bases": {"आहे": "is"}, "confusables": {"w1": {"why": "Masculine: हा (hā) goes with a masculine noun; शिल्प (śilp) is neuter, so हे (he) is right."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one sculpture takes आहे (āhe)."}}}
  "mr-5192": {"native": "The sculptor makes a sculpture.", "bases": {"बनवतो": "makes"}, "confusables": {"w1": {"why": "Picture, not sculpture: चित्र (citra) means picture."}, "f1": {"why": "Feminine: बनवते (banvte) is for a woman; the sculptor is a man, so बनवतो (banvto)."}}}
  "mr-5193": {"native": "The children play instruments.", "bases": {"वाजवतात": "play"}, "confusables": {"w1": {"why": "They: ते (te) means they, for more than one."}, "f1": {"why": "Singular: वाजवतो (vājvto) is for one man; the children are plural, so वाजवतात (vājvtāt)."}}}
  "mr-5194": {"native": "There are pictures at the exhibition.", "bases": {"प्रदर्शनीत": "at the exhibition", "चित्रे": "pictures", "आहेत": "are"}, "confusables": {"w1": {"why": "Sculptor, not picture: शिल्पकार (śilpakār) means sculptor."}, "f1": {"why": "Singular: आहे (āhe) is for one thing; the sentence has several pictures, so आहेत (āhet)."}}}
