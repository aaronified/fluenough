schema: 1
id: "mr-en-grammar-articles"
kind: "layer"
core: "mr-grammar-articles"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "No articles: a and the"
license: "CC0-1.0"
description: "Marathi has no 'a' or 'the'. How it says them anyway. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0384":
    native: "book; a book; the book"
    notes:
      "n1": "A bare noun is 'a book' or 'the book': context decides. पुस्तक टेबलावर आहे (pustak ṭebalāvar āhe), the book is on the table."
  "mr-0139":
    notes:
      "n1": "एक (ek), 'one', serves for 'a' when the 'one' matters, as when something is new to the story: एक पुस्तक घेतले (ek pustak ghetle), I bought a book."
  "mr-0385":
    native: "this book; the book (here)"
    notes:
      "n1": "For 'the', point with this or that: हे पुस्तक (he pustak), this book; ते पुस्तक (te pustak), that book."
  "mr-0386":
    native: "that boy; the boy"
    notes:
      "n1": "तो (to), 'that', often does the work of 'the' for someone already mentioned."
  "mr-0387":
    native: "a girl; one girl"
  "mr-0388":
    native: "someone"
    notes:
      "n1": "कोणी (koṇi), who, with -तरी (-tari), 'some': दारावर कोणीतरी आहे (dārāvar koṇitari āhe), there's someone at the door."
  "mr-0389":
    native: "something"
    notes:
      "n1": "काही (kāhi), some, with -तरी (-tari): काहीतरी खा (kāhitari khā), eat something."
