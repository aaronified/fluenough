id: "mr-en-multiword-2"
kind: "layer"
core: "mr-multiword-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: conjunct verbs, part 2"
description: "Twenty-three verb phrases of a noun and a light verb (karṇe, hoṇe, mārṇe, gheṇe, deṇe, yeṇe, lāgṇe). Glosses are as the pages named in the addendum give them. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "mr-4360":
    native: "to bathe; to take a bath"
    notes:
      "u1": "Noun plus करणे (karṇe). Example from en.wiktionary, which gives no translation: गरम (garam) पाण्याने (pāṇyāne) आंघोळ (āṅghoḷ) केल्यावर (kelyāvar) तिला (tilā) बरे (bare) वाटले (vāṭle)."
  "mr-4361":
    native: "to fast; to abstain from food"
    notes:
      "u1": "Noun plus करणे (karṇe). en.wiktionary gives the synonym उपास (upās) करणे (karṇe)."
  "mr-4362":
    native: "to fast; to abstain from food"
    notes:
      "u1": "Noun plus करणे (karṇe). en.wiktionary gives the synonym उपवास (upvās) करणे (karṇe)."
  "mr-4363":
    native: "to imagine, conceive, or suppose mentally"
    notes:
      "u1": "Noun plus करणे (karṇe). The sense is mental: to imagine or suppose in the mind."
  "mr-4364":
    native: "to worry"
    notes:
      "u1": "Noun plus करणे (karṇe). For taking care of, see काळजी (kāḷji) घेणे (gheṇe)."
  "mr-4365":
    native: "to take care of"
    notes:
      "u1": "Noun plus घेणे (gheṇe). For worrying, see काळजी (kāḷji) करणे (karṇe)."
  "mr-4366":
    native: "to perform an act or action"
    notes:
      "u1": "Noun plus करणे (karṇe), the light verb of this family."
  "mr-4367":
    native: "to act carelessly, irresponsibly, or without taking something seriously"
    notes:
      "u1": "Noun plus करणे (karṇe). Example from en.wiktionary, which gives no translation: आगीजवळ (āgijavaḷ) असा (asā) खेळ (kheḷ) करू (karu) नकोस (nakos)."
  "mr-4368":
    native: "to collect, gather"
    notes:
      "u1": "Noun plus करणे (karṇe). The partner is गोळा (goḷā) होणे (hoṇe)."
  "mr-4369":
    native: "to gather; to assemble"
    notes:
      "u1": "Noun plus होणे (hoṇe). The partner is गोळा (goḷā) करणे (karṇe)."
  "mr-4370":
    native: "to misunderstand"
    notes:
      "u1": "Noun plus होणे (hoṇe). Example from en.wiktionary, which gives no translation: या (yā) भूमिकेसाठी (bhumikesāṭhi) त्यांचा (tyāñcā) सर्व (sarv) बाजूंनी (bājunni) गैरसमज (gairsamaj) झाला (jhālā)."
  "mr-4371":
    native: "to exaggerate; to make a fuss about"
    notes:
      "u1": "Noun plus करणे (karṇe). en.wiktionary glosses it as 'to exaggerate, make a fuss about'."
  "mr-4372":
    native: "to outdo; to best"
    notes:
      "u1": "Noun plus करणे (karṇe). en.wiktionary gives 'to best' as its gloss."
  "mr-4373":
    native: "to jump; to leap into the air; to dive or jump into (water, etc.)"
    notes:
      "u1": "Noun plus मारणे (mārṇe). en.wiktionary gives both senses: jumping, and diving or jumping into water."
  "mr-4374":
    native: "to shoot"
    notes:
      "u1": "Noun plus मारणे (mārṇe). en.wiktionary gives the synonym गोळी (goḷi) झाडणे (jhāḍṇe)."
  "mr-4375":
    native: "to taunt, mock, or make a pointed remark at someone"
    notes:
      "u1": "Noun plus मारणे (mārṇe). The remark is aimed at someone, as the gloss says."
  "mr-4376":
    native: "to take shelter; seek or obtain refuge or lodging"
    notes:
      "u1": "Noun plus घेणे (gheṇe). Example from en.wiktionary, which gives no translation: पावसापासून (pāvsāpāsun) वाचण्यासाठी (vācaṇyāsāṭhi) त्यांनी (tyānni) देवळात (devḷāt) थारा (thārā) घेतला (ghetlā)."
  "mr-4377":
    native: "to give shelter to; to provide refuge, lodging, or a place to stay"
    notes:
      "u1": "Noun plus देणे (deṇe). Example from en.wiktionary, which gives no translation: वादळाच्या (vādaḷācyā) रात्री (rātri) गावकऱ्यांनी (gāvkaryānni) प्रवाशांना (pravāśānnā) थारा (thārā) दिला (dilā)."
  "mr-4378":
    native: "to take responsibility; to assume responsibility"
    notes:
      "u1": "Noun plus घेणे (gheṇe)."
  "mr-4379":
    native: "to guarantee; to (give a) guarantee"
    notes:
      "u1": "Noun plus देणे (deṇe)."
  "mr-4380":
    native: "to breathe, take a breath"
    notes:
      "u1": "Noun plus घेणे (gheṇe)."
  "mr-4381":
    native: "to pant, gasp; breathe in a quick or labored manner"
    notes:
      "u1": "Noun plus लागणे (lāgṇe)."
  "mr-4382":
    native: "for the sky to become overcast"
    notes:
      "u1": "Noun plus येणे (yeṇe). The subject is the sky: it becomes overcast."
