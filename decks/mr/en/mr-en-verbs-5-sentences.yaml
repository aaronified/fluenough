description: "Short sentences that use the words of this unit. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-6800":
    native: "Teachers explain the lesson."
    confusables: { "w1": { why: "शिक्षक (śikṣak) is the teacher; विद्यार्थी (vidyārthi) is the student, the one who learns, not the one who explains." }, "f1": { why: "समजावतो (samjāvto) is for one man; several teachers take समजावतात (samjāvtāt)." } }
  "mr-6801":
    native: "I recognise you."
    confusables: { "w1": { why: "तो (to) means he, not I." }, "f1": { why: "ओळखतात (oḷkhtāt) means they recognise, for several people, not I." } }
  "mr-6802":
    native: "He solves maths problems."
    confusables: { "w1": { why: "तू (tu) means you, not he." }, "f1": { why: "सोडवतात (soḍvtāt) is for more than one person." } }
  "mr-6803":
    native: "His health gets worse."
    confusables: { "w1": { why: "सुधारणे (sudhārṇe) means to improve, the opposite of getting worse." }, "f1": { why: "बिघडतो (bighḍto) is for a masculine subject; तब्येत (tabyet) is feminine, so it takes बिघडते (bighaḍte)." } }
  "mr-6804":
    native: "I accept your offer."
    confusables: { "w1": { why: "नाकारणे (nākārṇe) means to refuse, the opposite of accepting." }, "f1": { why: "स्वीकारतात (svikārtāt) means they accept, for several people, not I." } }
  "mr-6805":
    native: "This rope breaks."
    confusables: { "w1": { why: "अडकणे (aḍkṇe) means to get stuck, not to break." }, "f1": { why: "तुटतो (tuṭto) is for a masculine subject; दोरी (dori) is feminine, so it takes तुटते (tuṭte)." } }
  "mr-6806":
    native: "I deliver the letter."
    confusables: { "w1": { why: "लिहिणे (lihiṇe) means to write, not to deliver." }, "f1": { why: "पोहोचवतात (pohocvtāt) is for several people, not I." } }
  "mr-6807":
    native: "Children collect flowers."
    bases: { "फुले": "flower (plural)" }
    confusables: { "w1": { why: "घेणे (gheṇe) means to take one thing, not to collect many." }, "f1": { why: "करतो (karto) is for one person; several children take करतात (kartāt)." } }
  "mr-6808":
    native: "He gathers everyone together."
    bases: { "सगळ्यांना": "all, everyone" }
    confusables: { "w1": { why: "जमणे (jamṇe) means people gather by themselves, with no one doing the gathering." }, "f1": { why: "जमवतात (jamvtāt) is for several people, not him." } }
  "mr-6809":
    native: "She thinks about this."
    bases: { "याचा": "this (of this)" }
    confusables: { "w1": { why: "विचारते (vicārte) means she asks, a different verb; करते (karte) makes the verb to think." }, "f1": { why: "करतो (karto) is for a man; she takes करते (karte)." } }
  "mr-6810":
    native: "He convinces me."
    bases: { "मला": "me" }
    confusables: { "w1": { why: "पटणे (paṭṇe) means to be convincing or to make sense, by itself." }, "f1": { why: "पटवला (paṭvlā) is past tense: he convinced." } }
  "mr-6811":
    native: "Mother explains the lesson to her daughter."
    bases: { "मुलीला": "daughter (to the daughter)" }
    confusables: { "w1": { why: "बहीण (bahiṇ) is a sister, not a mother." }, "w2": { why: "मुलगा (mulgā) is a son or a boy, not a girl." }, "f1": { why: "समजावतो (samjāvto) is said of a man." } }
