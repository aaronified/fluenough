schema: 1
id: "mr-en-help"
kind: "layer"
core: "mr-help"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Help"
license: "CC-BY-SA-4.0"
description: "Asking for help, doctors and medicine, and saying you are lost. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0238":
    notes:
      "n1": "डॉक्टरांना बोलवा (ḍôkṭarānnā bolvā), call a doctor: a doctor is spoken of in the respectful plural."
  "mr-0595":
    native: "clinic; the doctor's"
    notes:
      "n1": "A local doctor's practice, where most people go first."
  "mr-0596":
    native: "hospital"
    notes:
      "n1": "Formal, and on signs. In speech, हॉस्पिटल (hôspiṭal)."
    "examples": {
      "जखमींना रुग्णालयात नेलं.": {"native": "The injured were taken to hospital.", "bases": {"जखमींना": "injured", "रुग्णालयात": "hospital"}}
    }
  "mr-0597":
    native: "medicine"
    notes:
      "n1": "A chemist's is a मेडिकल (meḍikal) or औषधाचे दुकान (auṣdhāce dukān)."
    "examples": {
      "औषध औषधालयात मिळते.": {"native": "Medicine is available at the pharmacy.", "bases": {"औषधालयात": "at the pharmacy", "मिळते": "to get", "औषध": "medicine"}},
      "औषध कडू आहे.": {"native": "The medicine is bitter.", "bases": {"आहे": "to be", "औषध": "medicine"}}
    }
  "mr-0598":
    native: "police"
    notes:
      "n1": "पोलीस स्टेशन (polis sṭeśan), police station; formally पोलीस ठाणे (polis ṭhāṇe)."
    "examples": {
      "पोलिसांकडे तक्रार नोंदवली.": {"native": "I registered a complaint with the police.", "bases": {"नोंदवली": "to register", "पोलिसांकडे": "police"}},
      "त्याने पोलिसांत तक्रार केली.": {"native": "He filed a complaint with the police.", "bases": {"पोलिसांत": "police"}}
    }
  "mr-0600":
    native: "I've lost my wallet."
    notes:
      "n1": "'My wallet got lost': the thing lost is the subject. माझा फोन हरवला (mājhā phon harvlā), I've lost my phone."
    bases:
      "माझे": "my"
      "पाकीट": "wallet"
      "हरवले": "to lose; to be lost"
  "mr-0601":
    native: "it hurts; it aches"
    notes:
      "n1": "Agrees with what hurts: माझे डोके दुखते (mājhe ḍoke dukhte), I have a headache; माझा पाय दुखतो (mājhā pāy dukhto), my leg hurts."
    "examples": {
      "छातीत दुखते.": {"native": "The chest hurts.", "bases": {"छातीत": "in the chest", "दुखते": "to hurt"}},
      "माझी कंबर दुखते.": {"native": "My lower back hurts.", "bases": {"माझी": "my", "दुखते": "to hurt"}}
    }
  "mr-0602":
    native: "fever"
    notes:
      "n1": "मला ताप आला आहे (malā tāp ālā āhe), I've got a fever: 'fever has come to me'."
  "mr-0604":
    native: "Careful!"
    notes:
      "n1": "Also a goodbye: सांभाळून जा (sāmbhāḷun jā), go carefully."
  "mr-0605":
    native: "fire"
    "examples": {
      "आग विझली.": {"native": "The fire went out.", "bases": {"विझली": "to go out (fire, light)"}},
      "आग वेगाने पसरत होती.": {"native": "The fire was spreading fast.", "bases": {"वेगाने": "fast", "होती": "to be", "पसरत": "to spread"}}
    }
  "mr-0606":
    native: "accident"
