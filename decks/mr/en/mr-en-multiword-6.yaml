id: "mr-en-multiword-6"
kind: "layer"
core: "mr-multiword-6"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: compound verbs, part 2"
description: "Nine verb phrases in which a verb is joined to a helper: टाकणे (ṭākṇe) for completion, लागणे (lāgṇe) for the start of an action, देणे (deṇe) for permission, पाहणे (pāhṇe) for a wish or an attempt, या (yā) for 'let us', and जाणे (jāṇe) for the passive. The meanings are as stated in Dhongde and Wali (2009) and in the course's addendum, and are not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "mr-4460":
    native: "to finish off; to get rid of"
    notes:
      "u1": "Compound verb: the -un form of खाणे (khāṇe) plus the V2 टाकणे (ṭākṇe), which marks completion."
    bases:
      "टाकणे": "get rid of (as a helper verb, marking completion)"
  "mr-4461":
    native: "to begin to play"
    notes:
      "u1": "Compound verb: the -u form of खेळणे (kheḷṇe) plus the inceptive लागणे (lāgṇe), which marks the start of an action."
    bases:
      "लागणे": "to commence (a particular activity)"
  "mr-4462":
    native: "to let (someone) go"
    notes:
      "u1": "Compound verb: the -u form of जाणे (jāṇe) plus the permissive देणे (deṇe), which lets the action happen."
  "mr-4463":
    native: "to wish or try to do"
    notes:
      "u1": "Compound verb: the -u form of करणे (karṇe) plus पाहणे (pāhṇe), a desiderative that marks a wish or an attempt."
  "mr-4464":
    native: "let us win"
    notes:
      "u1": "Hortative: the -u form of जिंकणे (jiṅkṇe) plus या (yā) gives 'let us' do the action."
    bases:
      "या": "hortative particle: let us"
  "mr-4465":
    native: "to do (something) completely"
    notes:
      "u1": "Compound verb: the -un form of करणे (karṇe) plus the V2 टाकणे (ṭākṇe), which marks completion."
    bases:
      "टाकणे": "get rid of (as a helper verb, marking completion)"
  "mr-4466":
    native: "to write out"
    notes:
      "u1": "Compound verb: the -un form of लिहिणे (lihiṇe) plus काढणे (kāḍhṇe), which adds intensity to the action."
  "mr-4467":
    native: "to finish writing; to write off"
    notes:
      "u1": "Compound verb: the -un form of लिहिणे (lihiṇe) plus the V2 टाकणे (ṭākṇe), which marks completion."
    bases:
      "टाकणे": "get rid of (as a helper verb, marking completion)"
  "mr-4468":
    native: "the passive of खाणे (khāṇe), with जाणे (jāṇe) as the passive marker"
    notes:
      "u1": "Passive: जाणे (jāṇe) marks the passive voice, here with the form खाल्ला (khāllā) of खाणे (khāṇe)."
