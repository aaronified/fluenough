schema: 1
id: "mr-en-grammar-reported-speech"
kind: "layer"
core: "mr-grammar-reported-speech"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Reported speech: he said that"
license: "CC-BY-SA-4.0"
description: "He said that he would come, she told me that it was late: reporting what someone else said with की and the past of the speech verb. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "Reported speech: the past of the speech verb, then की (kī, that)"
  slot_name: "speaker"
  prompt: "{lemma} ({gloss}), {slot}"
  slots: { "तो": "he said that", "ती": "she said that", "ते": "they said that" }
  entries:
    "sangne": "to tell; to say"
    "vicarne": "to ask"
    "bolne": "to speak"
    "kalvane": "to inform"
    "sucavne": "to suggest"
    "tharvane": "to decide"
  notes: "To pass on what someone said, put the speaker, then the past of the speech verb, then की (kī), that: तो म्हणाला की उद्या येईन (to mhaṇālā kī udyā yeīn), he said that he would come tomorrow. The speech verb is म्हणणे (mhaṇṇe), to say; a short report can end with असं (asaṁ), like this, as in तो असं म्हणाला (to asaṁ mhaṇālā), he said so. Tense and person move: the words said in the first person change to the third: मी येईन becomes तो येईल (mī yeīn becomes to yeīl), I will come becomes he will come."
