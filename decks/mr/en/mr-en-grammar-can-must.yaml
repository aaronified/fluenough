schema: 1
id: "mr-en-grammar-can-must"
kind: "layer"
core: "mr-grammar-can-must"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Can, may and must"
license: "CC0-1.0"
description: "Ability, knowing how, permission, need and duty: शकणे (śakṇe), येणे (yeṇe), हवे (have) and लागणे (lāgṇe). Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0639":
    native: "I can go. (a man speaking)"
    notes:
      "n1": "The verb in -ऊ (-u), then शकणे (śakṇe), 'to be able', in its person: तू जाऊ शकतोस (tu jāu śaktos), ते जाऊ शकतात (te jāu śaktāt). A woman says शकते (śakte)."
    bases:
      "जाऊ": "to go"
      "शकतो": "to be able"
  "mr-0640":
    native: "I can swim; I know how to swim."
    notes:
      "n1": "A skill 'comes to' you: the verb in -ता (-tā), then येते (yete). As with a language: मला मराठी येते (malā marāṭhi yete)."
    bases:
      "पोहता": "to swim"
      "येते": "to come"
  "mr-0641":
    native: "I can't drive."
    notes:
      "n1": "चालवणे (cālvṇe), to drive; to run (a machine, a business)."
    bases:
      "चालवता": "to drive"
      "येत": "to come"
  "mr-0642":
    native: "May I come in?"
    notes:
      "n1": "Asking leave: the verb in -ऊ (-u) with का (kā). मी बसू का (mi basu kā)?, may I sit down?"
    bases:
      "आत": "inside"
      "येऊ": "to come"
  "mr-0643":
    native: "I must go; I should go."
    notes:
      "n1": "The verb in -आयला (-āylā) with हवे (have) or पाहिजे (pāhije): मला जायला पाहिजे (malā jāylā pāhije), the same."
    bases:
      "जायला": "to go"
  "mr-0644":
    native: "I'll have to go to work tomorrow."
    notes:
      "n1": "The verb in -आवे (-āve) with लागणे (lāgṇe) is 'have to', something you can't avoid: मला जावे लागले (malā jāve lāgle), I had to go."
    bases:
      "जावे": "to go"
      "लागेल": "to be felt; to take (time); to be necessary"
  "mr-0645":
    native: "You may sit here."
    notes:
      "n1": "शकणे (śakṇe) gives permission too. Simply बसा (basā), please sit, is warmer."
    bases:
      "इथे": "here"
      "बसू": "to sit"
      "शकता": "to be able"
  "mr-0646":
    native: "You mustn't take photos here."
    notes:
      "n1": "-ऊ नये (-u naye), 'one should not', the language of rules and notices. फोटो काढणे (phoṭo kāḍhṇe), to take a photo."
    bases:
      "इथे": "here"
      "फोटो": "photo"
      "काढू": "to take out; to take (a photo)"
      "नये": "must not"
