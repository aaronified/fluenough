schema: 1
id: "mr-en-script-conjuncts"
kind: "layer"
core: "mr-script-conjuncts"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Marathi conjuncts"
license: "CC0-1.0"
description: "Two consonants with no vowel between them join: the first is usually written as a half letter, without its standing line. Four join in shapes of their own, r takes three forms, and Marathi has its own eyelash r. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0087":
    native: "k + curled-back sh (ksh)"
    notes:
      "n1": "Its own shape, nothing like its parts: पक्षी (pakṣi, bird). Marathi counts it as a letter of the alphabet."
  "mr-0088":
    native: "t + r (tr)"
    notes:
      "n1": "Its own shape, त (ta) joined with र (ra): मित्र (mitra, friend). A word that ends in a conjunct keeps its last a in Marathi: mitra, not mitr."
  "mr-0089":
    native: "j + ny, said dny"
    notes:
      "n1": "Its own shape. Marathi says it 'dny', where Hindi says 'gy': ज्ञान (dnyān, knowledge). It is a letter of the Marathi alphabet."
  "mr-0090":
    native: "sh + r (shr)"
    notes:
      "n1": "Its own shape: श्रावण (śrāvaṇ, the month of the monsoon festivals)."
  "mr-0091":
    native: "p + r (the r stroke)"
    notes:
      "n1": "A र (ra) after a consonant is a small slanting stroke at its foot: प्रवास (pravās, journey)."
  "mr-0092":
    native: "curled-back t + r"
    notes:
      "n1": "After ट (ṭa) or ड (ḍa), र (ra) is written as a small caret below: ट्रेन (ṭren, train)."
  "mr-0093":
    native: "r + y (the reph)"
    notes:
      "n1": "A र (ra) before another consonant is usually a small hook above that consonant, the reph: सूर्य (surya, sun)."
  "mr-0094":
    native: "r + y (the eyelash r)"
    notes:
      "n1": "In many Marathi words where r meets y, the r is a small eyelash instead of a reph: दुसऱ्या (dusryā, other; second), कैऱ्या (kairyā, green mangoes). It sounds the same as र्य (rya), so it is drilled by reading and writing only."
  "mr-0095":
    native: "k + k (half क (ka))"
    notes:
      "n1": "The first क (ka) is written without its hook on the right and joins the second: पक्का (pakkā, firm; certain). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  "mr-0096":
    native: "ch + ch (half च (ca))"
    notes:
      "n1": "Half च (ca) joined to च (ca): कच्चा (kaccā, raw; unripe). Drilled by reading and writing only."
  "mr-0097":
    native: "t + t (half त (ta))"
    notes:
      "n1": "Half त (ta) joined to त (ta): पत्ता (pattā, address). Drilled by reading and writing only."
  "mr-0098":
    native: "l + l (half ल (la))"
    notes:
      "n1": "Half ल (la) joined to ल (la): किल्ला (killā, fort). Drilled by reading and writing only."
  "mr-0099":
    native: "n + n (half न (na))"
    notes:
      "n1": "Half न (na) joined to न (na): पन्नास (pannās, fifty). Drilled by reading and writing only."
  "mr-0100":
    native: "p + p (half प (pa))"
    notes:
      "n1": "Half प (pa) joined to प (pa): गप्पा (gappā, a chat). Drilled by reading and writing only."
  "mr-0101":
    native: "curled-back t + t (stacked)"
    notes:
      "n1": "ट (ṭa) has no standing line, so it can't be halved: the second ट (ṭa) is stacked below the first. पट्टा (paṭṭā, strap; belt). Drilled by reading and writing only."
  "mr-0102":
    native: "d + dh (stacked)"
    notes:
      "n1": "द (da) stacks too, with ध (dha) below it: शुद्ध (śuddha, pure)."
  "mr-0103":
    native: "d + y"
    notes:
      "n1": "द (da) with a small य (ya) joined after it: विद्यार्थी (vidyārthi, student)."
  "mr-0104":
    native: "s + t (half स (sa))"
    notes:
      "n1": "Half स (sa) joined to त (ta): रस्ता (rastā, road)."
  "mr-0105":
    native: "s + th (half स (sa))"
    notes:
      "n1": "Half स (sa) joined to थ (tha): स्थानक (sthānak, station)."
  "mr-0106":
    native: "k + t"
    notes:
      "n1": "क (ka) without its hook, joined to त (ta): फक्त (phakta, only). The final a stays after a conjunct."
  "mr-0107":
    native: "sh + ch"
    notes:
      "n1": "Half श (śa) joined to च (ca): पश्चिम (paścim, west)."
  "mr-0108":
    native: "m with a breath (mh)"
    notes:
      "n1": "Marathi joins h to m, n and l to give them a breath: तुम्ही (tumhi, you), आम्ही (āmhi, we)."
  "mr-0109":
    native: "n with a breath (nh)"
    notes:
      "n1": "Half न (na) joined to ह (ha): उन्हाळा (unhāḷā, summer)."
  "mr-0110":
    native: "l with a breath (lh)"
    notes:
      "n1": "Half ल (la) joined to ह (ha): कोल्हा (kolhā, jackal), and the city of कोल्हापूर (kolhāpur)."
