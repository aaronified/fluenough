schema: 1
id: "mr-en-script-conjuncts"
kind: "layer"
core: "mr-script-conjuncts"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Marathi conjuncts"
license: "CC-BY-SA-4.0"
description: "Two consonants with no vowel between them join: the first is usually written as a half letter, without its standing line. Four join in shapes of their own, r takes three forms, and Marathi has its own eyelash r. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0087":
    native: "k + curled-back sh (ksh)"
    notes:
      "n1": "Its own shape, nothing like its parts: पक्षी (pakṣi, bird). Marathi counts it as a letter of the alphabet."
    "examples": {
      "पक्षी उडतो.": {"native": "The bird flies.", "bases": {"उडतो": "to fly"}},
      "वृक्ष लावा.": {"native": "Plant a tree.", "bases": {"लावा": "to plant"}}
    }
  "mr-0088":
    native: "t + r (tr)"
    notes:
      "n1": "Its own shape, त (ta) joined with र (ra): मित्र (mitra, friend). A word that ends in a conjunct keeps its last a in Marathi: mitra, not mitr."
    "examples": {
      "ओळखपत्र दाखवा.": {"native": "Show your identity card.", "bases": {}},
      "ओळखपत्र हरवलं.": {"native": "I lost the identity card.", "bases": {}}
    }
  "mr-0089":
    native: "j + ny, said dny"
    notes:
      "n1": "Its own shape. Marathi says it 'dny', where Hindi says 'gy': ज्ञान (dnyān, knowledge). It is a letter of the Marathi alphabet."
    "examples": {
      "कृतज्ञता व्यक्त करतो.": {"native": "I express my gratitude.", "bases": {"व्यक्त": "express"}},
      "तंत्रज्ञान वेगाने बदलतं.": {"native": "Technology changes fast.", "bases": {"वेगाने": "fast"}}
    }
  "mr-0090":
    native: "sh + r (shr)"
    notes:
      "n1": "Its own shape: श्रावण (śrāvaṇ, the month of the monsoon festivals)."
    "examples": {
      "ती श्रीमंत आहे.": {"native": "She is rich.", "bases": {"आहे": "to be"}},
      "विश्रांतीने थकवा जातो.": {"native": "Rest removes the tiredness.", "bases": {}}
    }
  "mr-0091":
    native: "p + r (the r stroke)"
    notes:
      "n1": "A र (ra) after a consonant is a small slanting stroke at its foot: प्रवास (pravās, journey)."
    "examples": {
      "प्रमाणपत्र मिळालं.": {"native": "I got the certificate.", "bases": {"मिळालं": "to get"}},
      "अहवाल प्रिंट करा.": {"native": "Print the report.", "bases": {"प्रिंट": "print"}}
    }
  "mr-0092":
    native: "curled-back t + r"
    notes:
      "n1": "After ट (ṭa) or ड (ḍa), र (ra) is written as a small caret below: ट्रेन (ṭren, train)."
    "examples": {
      "पेट्रोल संपले.": {"native": "The petrol has run out.", "bases": {"संपले": "to run out"}},
      "आंतरराष्ट्रीय बातम्या पाहिल्या.": {"native": "I watched the international news.", "bases": {}}
    }
  "mr-0093":
    native: "r + y (the reph)"
    notes:
      "n1": "A र (ra) before another consonant is usually a small hook above that consonant, the reph: सूर्य (surya, sun)."
    "examples": {
      "धैर्यवान व्हा.": {"native": "Be brave.", "bases": {"व्हा": "to become"}},
      "सूर्य मावळला.": {"native": "The sun set.", "bases": {"मावळला": "to set"}}
    }
  "mr-0094":
    native: "r + y (the eyelash r)"
    notes:
      "n1": "In many Marathi words where r meets y, the r is a small eyelash instead of a reph: दुसऱ्या (dusryā, other; second), कैऱ्या (kairyā, green mangoes). It sounds the same as र्य (rya), so it is drilled by reading and writing only."
    "examples": {
      "अधिकाऱ्यांनी फॉर्म तपासला.": {"native": "The officers checked the form.", "bases": {"अधिकाऱ्यांनी": "officer, official"}},
      "इशाऱ्याकडे लक्ष द्या.": {"native": "Pay attention to the warning.", "bases": {"लक्ष": "attention", "इशाऱ्याकडे": "warning"}}
    }
  "mr-0095":
    native: "k + k (half क (ka))"
    notes:
      "n1": "The first क (ka) is written without its hook on the right and joins the second: पक्का (pakkā, firm; certain). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "उन्हात चक्कर आली.": {"native": "I felt dizzy in the sun.", "bases": {}},
      "तो धक्क्यातून सावरला.": {"native": "He recovered from the shock.", "bases": {"धक्क्यातून": "from the shock", "सावरला": "to recover, to steady oneself"}}
    }
  "mr-0096":
    native: "ch + ch (half च (ca))"
    notes:
      "n1": "Half च (ca) joined to च (ca): कच्चा (kaccā, raw; unripe). Drilled by reading and writing only."
    "examples": {
      "कच्चा कांदा खाऊ नका.": {"native": "Do not eat raw onion.", "bases": {}},
      "हा आंबा कच्चा आहे.": {"native": "This mango is unripe.", "bases": {"आहे": "to be"}}
    }
  "mr-0097":
    native: "t + t (half त (ta))"
    notes:
      "n1": "Half त (ta) joined to त (ta): पत्ता (pattā, address). Drilled by reading and writing only."
    "examples": {
      "वृत्तवाहिनी लावा.": {"native": "Put on the news channel.", "bases": {"लावा": "to put on"}},
      "उत्तरेकडे डोंगर आहेत.": {"native": "There are mountains to the north.", "bases": {"आहेत": "to be", "उत्तरेकडे": "north"}}
    }
  "mr-0098":
    native: "l + l (half ल (la))"
    notes:
      "n1": "Half ल (la) joined to ल (la): किल्ला (killā, fort). Drilled by reading and writing only."
    "examples": {
      "आम्ही किल्ल्यावर जातो.": {"native": "We go to the fort.", "bases": {"आम्ही": "we", "किल्ल्यावर": "to the fort", "जातो": "to go"}},
      "किल्ला उंच आहे.": {"native": "The fort is high.", "bases": {"उंच": "high", "आहे": "to be"}}
    }
  "mr-0099":
    native: "n + n (half न (na))"
    notes:
      "n1": "Half न (na) joined to न (na): पन्नास (pannās, fifty). Drilled by reading and writing only."
    "examples": {
      "उत्पन्नाचा दाखला आणा.": {"native": "Bring the income certificate.", "bases": {"दाखला": "certificate", "उत्पन्नाचा": "income"}},
      "कर्नाटकात कन्नड बोलतात.": {"native": "In Karnataka they speak Kannada.", "bases": {"कर्नाटकात": "Karnataka", "कन्नड": "Kannada"}}
    }
  "mr-0100":
    native: "p + p (half प (pa))"
    notes:
      "n1": "Half प (pa) joined to प (pa): गप्पा (gappā, a chat). Drilled by reading and writing only."
    "examples": {
      "आम्ही गप्पांमध्ये गुंतलो.": {"native": "We got caught up in conversation.", "bases": {"गप्पांमध्ये": "in conversation", "गुंतलो": "to be involved, to be engaged"}},
      "चप्पल दारात आहे.": {"native": "The slippers are at the door.", "bases": {"दारात": "at the door", "आहे": "to be"}}
    }
  "mr-0101":
    native: "curled-back t + t (stacked)"
    notes:
      "n1": "ट (ṭa) has no standing line, so it can't be halved: the second ट (ṭa) is stacked below the first. पट्टा (paṭṭā, strap; belt). Drilled by reading and writing only."
    "examples": {
      "भाडेपट्टा नोंदवला.": {"native": "The lease was registered.", "bases": {"नोंदवला": "to register"}},
      "कर्मचाऱ्यांना सुट्टी मिळाली.": {"native": "The staff got a holiday.", "bases": {"मिळाली": "to get", "कर्मचाऱ्यांना": "employee, staff"}}
    }
  "mr-0102":
    native: "d + dh (stacked)"
    notes:
      "n1": "द (da) stacks too, with ध (dha) below it: शुद्ध (śuddha, pure)."
    "examples": {
      "बातमी प्रसिद्ध झाली.": {"native": "The news was published.", "bases": {"प्रसिद्ध": "published", "झाली": "to become"}},
      "वीर योद्धा लढला.": {"native": "The brave warrior fought.", "bases": {"योद्धा": "warrior"}}
    }
  "mr-0103":
    native: "d + y"
    notes:
      "n1": "द (da) with a small य (ya) joined after it: विद्यार्थी (vidyārthi, student)."
    "examples": {
      "उद्या तपासणी आहे.": {"native": "There is a check-up tomorrow.", "bases": {"आहे": "to be"}},
      "उद्या परीक्षा आहे.": {"native": "There is an exam tomorrow.", "bases": {"आहे": "to be"}}
    }
  "mr-0104":
    native: "s + t (half स (sa))"
    notes:
      "n1": "Half स (sa) joined to त (ta): रस्ता (rastā, road)."
    "examples": {
      "इस्त्री कुठे आहे?": {"native": "Where is the iron?", "bases": {"आहे": "to be"}},
      "जावयाला भेटवस्तू दिली.": {"native": "I gave a gift to the son-in-law.", "bases": {"जावयाला": "son-in-law"}}
    }
  "mr-0105":
    native: "s + th (half स (sa))"
    notes:
      "n1": "Half स (sa) joined to थ (tha): स्थानक (sthānak, station)."
    "examples": {
      "बसस्थानक जवळ आहे.": {"native": "The bus station is near.", "bases": {"आहे": "to be"}},
      "बसस्थानकावर गाडी थांबते.": {"native": "The bus stops at the bus station.", "bases": {"बसस्थानकावर": "at the bus station", "थांबते": "to stop"}}
    }
  "mr-0106":
    native: "k + t"
    notes:
      "n1": "क (ka) without its hook, joined to त (ta): फक्त (phakta, only). The final a stays after a conjunct."
    "examples": {
      "जखमेतून रक्त येतंय.": {"native": "Blood is coming from the wound.", "bases": {}},
      "त्यांचा रक्तदाब वाढला.": {"native": "Their blood pressure went up.", "bases": {}}
    }
  "mr-0107":
    native: "sh + ch"
    notes:
      "n1": "Half श (śa) joined to च (ca): पश्चिम (paścim, west)."
    "examples": {
      "समुद्र पश्चिमेला आहे.": {"native": "The sea is to the west.", "bases": {"आहे": "to be", "पश्चिमेला": "west"}},
      "सूर्य पश्चिमेला मावळतो.": {"native": "The sun sets in the west.", "bases": {"पश्चिमेला": "west"}}
    }
  "mr-0108":
    native: "m with a breath (mh)"
    notes:
      "n1": "Marathi joins h to m, n and l to give them a breath: तुम्ही (tumhi, you), आम्ही (āmhi, we)."
    "examples": {
      "आम्ही तंबू लावला.": {"native": "We put up a tent.", "bases": {"लावला": "to put up"}},
      "आम्ही थिएटरमध्ये जाऊ.": {"native": "We will go to the theatre.", "bases": {"आम्ही": "we", "थिएटरमध्ये": "to the theatre", "जाऊ": "to go"}}
    }
  "mr-0109":
    native: "n with a breath (nh)"
    notes:
      "n1": "Half न (na) joined to ह (ha): उन्हाळा (unhāḷā, summer)."
    "examples": {
      "पुन्हा सांगा.": {"native": "Please say that again.", "bases": {"पुन्हा": "again", "सांगा": "to say; to tell"}},
      "उन्हात जाऊ नको.": {"native": "Do not go out in the sun.", "bases": {"उन्हात": "sunshine, sun's heat"}}
    }
  "mr-0110":
    native: "l with a breath (lh)"
    notes:
      "n1": "Half ल (la) joined to ह (ha): कोल्हा (kolhā, jackal), and the city of कोल्हापूर (kolhāpur)."
    "examples": {
      "शेजारचा जिल्हा मोठा आहे.": {"native": "The neighbouring district is big.", "bases": {"आहे": "to be"}},
      "पुणे जिल्ह्यात पाऊस जास्त आहे.": {"native": "There is more rain in Pune district.", "bases": {"जास्त": "more", "आहे": "to be", "जिल्ह्यात": "district", "पुणे": "Pune"}}
    }
