schema: 1
id: "mr-en-script-consonants"
kind: "layer"
core: "mr-script-consonants"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Marathi consonants"
license: "CC0-1.0"
description: "Every consonant, each carrying its vowel a: the plain and breathy ones, on the teeth and curled back, the two sounds of च (ca) and ज (ja), and ळ (ḷa), the curled-back l that Hindi lacks. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0014":
    native: "k (ka)"
    notes:
      "n1": "Like the 'k' of 'skin', with no puff of breath. Every consonant carries the short a (अ) unless a sign changes it. कमळ (kamaḷ, lotus)."
  "mr-0015":
    native: "kh, with a breath (kha)"
    notes:
      "n1": "क (ka) with a puff of breath after it. It changes the word: खिडकी (khiḍki, window)."
  "mr-0016":
    native: "g (ga)"
    notes:
      "n1": "Like the 'g' of 'go': गाय (gāy, cow)."
  "mr-0017":
    native: "gh, with a breath (gha)"
    notes:
      "n1": "ग (ga) with a breath after it: घर (ghar, house)."
  "mr-0018":
    native: "ng (as in 'sing')"
    notes:
      "n1": "Seen in a few words from Sanskrit, such as वाङ्मय (vāṅmay, literature); Marathi usually writes the dot ं (am̐) instead. Hardly ever heard on its own, so it is drilled by reading and writing only."
  "mr-0019":
    native: "ch or ts (ca)"
    notes:
      "n1": "Two sounds. Before i and e, and in words from Sanskrit, the 'ch' of 'church': चिमणी (cimṇi, sparrow). Before a, o and u in most Marathi words it is 'ts', as in 'cats': चहा (cahā, tea) is said tsahaa. The readings write ch for both."
  "mr-0020":
    native: "chh, with a breath (cha)"
    notes:
      "n1": "च (ca) with a breath after it: छत्री (chatri, umbrella)."
  "mr-0021":
    native: "j or dz (ja)"
    notes:
      "n1": "Two sounds, like च (ca). Before i and e, the 'j' of 'judge': जेवण (jevaṇ, meal). Before a, o and u in most Marathi words it is 'dz', as in 'adze': जग (jag, world) is said dzag."
  "mr-0022":
    native: "jh or dzh, with a breath (jha)"
    notes:
      "n1": "ज (ja) with a breath after it, and like ज (ja) it is 'dz' before a, o and u in Marathi words: झाड (jhāḍ, tree)."
  "mr-0023":
    native: "ny (in conjuncts)"
    notes:
      "n1": "Seen almost only inside conjuncts from Sanskrit, above all ज्ञ (dnya). Hardly ever heard on its own, so it is drilled by reading and writing only."
  "mr-0024":
    native: "t, curled back (ṭa)"
    notes:
      "n1": "The tongue tip curls back to touch the roof of the mouth: retroflex. English 't' is close to this. Compare त (ta): टोपी (ṭopi, cap)."
  "mr-0025":
    native: "th, curled back, with a breath (ṭha)"
    notes:
      "n1": "ट (ṭa) with a breath after it. Not the 'th' of 'think': ठिकाण (ṭhikāṇ, place)."
  "mr-0026":
    native: "d, curled back (ḍa)"
    notes:
      "n1": "The tongue tip curls back, as for ट (ṭa). English 'd' is close to this. Compare द (da): डोळा (ḍoḷā, eye)."
  "mr-0027":
    native: "dh, curled back, with a breath (ḍha)"
    notes:
      "n1": "ड (ḍa) with a breath after it: ढग (ḍhag, cloud)."
  "mr-0028":
    native: "n, curled back (ṇa)"
    notes:
      "n1": "The tongue tip curls back, as for ट (ṭa). Unlike Hindi, Marathi says it clearly and uses it all the time, inside and at the end of words, though never at the start: पाणी (pāṇi, water), आपण (āpaṇ, we)."
  "mr-0029":
    native: "t, on the teeth (ta)"
    notes:
      "n1": "The tongue touches the back of the upper teeth: dental. English has no such t; it sounds softer. Compare ट (ṭa): ताट (tāṭ, plate)."
  "mr-0030":
    native: "th, on the teeth, with a breath (tha)"
    notes:
      "n1": "त (ta) with a breath after it. Not the 'th' of 'think': थंड (thaṇḍ, cold)."
  "mr-0031":
    native: "d, on the teeth (da)"
    notes:
      "n1": "The tongue touches the back of the upper teeth, as for त (ta). Compare ड (ḍa): दार (dār, door)."
  "mr-0032":
    native: "dh, on the teeth, with a breath (dha)"
    notes:
      "n1": "द (da) with a breath after it. Not the 'th' of 'this': धन्यवाद (dhanyavād, thank you)."
  "mr-0033":
    native: "n (na)"
    notes:
      "n1": "The 'n' of 'no', with the tongue on the teeth: नाव (nāv, name; boat)."
  "mr-0034":
    native: "p (pa)"
    notes:
      "n1": "Like the 'p' of 'spin', with no puff of breath: पाणी (pāṇi, water)."
  "mr-0035":
    native: "ph or f (pha)"
    notes:
      "n1": "प (pa) with a breath after it: फूल (phul, flower). Many speakers say it like English 'f', and Marathi writes English f with it, with no dot: फोन (fon, phone)."
  "mr-0036":
    native: "b (ba)"
    notes:
      "n1": "Like the 'b' of 'boy': बाळ (bāḷ, baby)."
  "mr-0037":
    native: "bh, with a breath (bha)"
    notes:
      "n1": "ब (ba) with a breath after it. Not 'v': भात (bhāt, cooked rice)."
  "mr-0038":
    native: "m (ma)"
    notes:
      "n1": "Like the 'm' of 'mother': मासा (māsā, fish)."
  "mr-0039":
    native: "y (ya)"
    notes:
      "n1": "Like the 'y' of 'yes': यश (yaś, success)."
  "mr-0040":
    native: "r (ra)"
    notes:
      "n1": "A single tap of the tongue, like the 'tt' of American 'butter'. Never silent: रस्ता (rastā, road)."
  "mr-0041":
    native: "l, on the teeth (la)"
    notes:
      "n1": "A clear 'l', as at the start of 'leaf', with the tongue near the teeth. Compare ळ (ḷa): लिंबू (limbu, lemon)."
  "mr-0042":
    native: "v or w (va)"
    notes:
      "n1": "Between English 'v' and 'w': वाघ (vāgh, tiger)."
  "mr-0043":
    native: "sh (śa)"
    notes:
      "n1": "The 'sh' of 'shop': शाळा (śāḷā, school)."
  "mr-0044":
    native: "sh, curled back (ṣa)"
    notes:
      "n1": "Curled back in careful speech, in words from Sanskrit: भाषा (bhāṣā, language). It sounds like श (śa) in everyday speech, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  "mr-0045":
    native: "s (sa)"
    notes:
      "n1": "The 's' of 'sun', never 'sh': साप (sāp, snake)."
  "mr-0046":
    native: "h (ha)"
    notes:
      "n1": "Like the 'h' of 'hat': हात (hāt, hand)."
  "mr-0047":
    native: "l, curled back (ḷa)"
    notes:
      "n1": "The tongue tip curls back, as for ट (ṭa), and says an l. Hindi has no such letter; Marathi uses it everywhere, and it changes the word: काळ (kāḷ, time; an age), with the curled-back l, against काल (kāl, yesterday), with the l on the teeth. It never starts a word: शाळा (śāḷā, school)."
