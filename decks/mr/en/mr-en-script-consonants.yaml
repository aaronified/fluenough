schema: 1
id: "mr-en-script-consonants"
kind: "layer"
core: "mr-script-consonants"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Marathi consonants"
license: "CC-BY-SA-4.0"
description: "Every consonant, each carrying its vowel a: the plain and breathy ones, on the teeth and curled back, the two sounds of च (ca) and ज (ja), and ळ (ḷa), the curled-back l that Hindi lacks. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0014":
    native: "k (ka)"
    notes:
      "n1": "Like the 'k' of 'skin', with no puff of breath. Every consonant carries the short a (अ) unless a sign changes it. कमळ (kamaḷ, lotus)."
    "examples": {
      "अनुभवाने शिकतो.": {"native": "One learns through experience.", "bases": {"अनुभवाने": "through experience"}}
    }
  "mr-0015":
    native: "kh, with a breath (kha)"
    notes:
      "n1": "क (ka) with a puff of breath after it. It changes the word: खिडकी (khiḍki, window)."
    "examples": {
      "खडू संपला.": {"native": "The chalk has run out.", "bases": {"संपला": "to end"}},
      "खरं सांग.": {"native": "Tell the truth.", "bases": {}}
    }
  "mr-0016":
    native: "g (ga)"
    notes:
      "n1": "Like the 'g' of 'go': गाय (gāy, cow)."
    "examples": {
      "अभिमानाने सांगितलं.": {"native": "I said it proudly.", "bases": {"अभिमानाने": "proudly"}},
      "गाजर कापा.": {"native": "Cut the carrot.", "bases": {"कापा": "to cut"}}
    }
  "mr-0017":
    native: "gh, with a breath (gha)"
    notes:
      "n1": "ग (ga) with a breath after it: घर (ghar, house)."
    "examples": {
      "गुडघा वाकवा.": {"native": "Bend your knee.", "bases": {"वाकवा": "to bend"}},
      "घर सजवलं.": {"native": "I decorated the house.", "bases": {"सजवलं": "to decorate"}}
    }
  "mr-0018":
    native: "ng (as in 'sing')"
    notes:
      "n1": "Seen in a few words from Sanskrit, such as वाङ्मय (vāṅmay, literature); Marathi usually writes the dot ं (am̐) instead. Hardly ever heard on its own, so it is drilled by reading and writing only."
  "mr-0019":
    native: "ch or ts (ca)"
    notes:
      "n1": "Two sounds. Before i and e, and in words from Sanskrit, the 'ch' of 'church': चिमणी (cimṇi, sparrow). Before a, o and u in most Marathi words it is 'ts', as in 'cats': चहा (cahā, tea) is said tsahaa. The readings write ch for both."
    "examples": {
      "चंद्र उगवला.": {"native": "The moon rose.", "bases": {"उगवला": "to rise (sun, moon)"}},
      "चूल पेटली.": {"native": "The stove was lit.", "bases": {"पेटली": "to catch fire, to burn", "चूल": "stove"}}
    }
  "mr-0020":
    native: "chh, with a breath (cha)"
    notes:
      "n1": "च (ca) with a breath after it: छत्री (chatri, umbrella)."
    "examples": {
      "कालवा स्वच्छ करा.": {"native": "Clean the canal.", "bases": {}},
      "खरेदी छान झाली.": {"native": "The shopping went well.", "bases": {"झाली": "to become"}}
    }
  "mr-0021":
    native: "j or dz (ja)"
    notes:
      "n1": "Two sounds, like च (ca). Before i and e, the 'j' of 'judge': जेवण (jevaṇ, meal). Before a, o and u in most Marathi words it is 'dz', as in 'adze': जग (jag, world) is said dzag."
    "examples": {
      "अर्ज भरा.": {"native": "Fill in the application.", "bases": {}},
      "कामावर जाणे": {"native": "to go to work", "bases": {"जाणे": "to go"}}
    }
  "mr-0022":
    native: "jh or dzh, with a breath (jha)"
    notes:
      "n1": "ज (ja) with a breath after it, and like ज (ja) it is 'dz' before a, o and u in Marathi words: झाड (jhāḍ, tree)."
    "examples": {
      "किती झाले?": {"native": "How much does it come to?", "bases": {"झाले": "to be; to become"}},
      "झाड मेलं.": {"native": "The tree died.", "bases": {"मेलं": "to die"}}
    }
  "mr-0023":
    native: "ny (in conjuncts)"
    notes:
      "n1": "Seen almost only inside conjuncts from Sanskrit, above all ज्ञ (dnya). Hardly ever heard on its own, so it is drilled by reading and writing only."
    "examples": {
      "तंत्रज्ञानामुळे काम सोपं झालं.": {"native": "Because of technology the work became easy.", "bases": {"झालं": "to become", "तंत्रज्ञानामुळे": "technology"}},
      "मी तुझी कृतज्ञ आहे.": {"native": "I am grateful to you.", "bases": {"आहे": "to be", "कृतज्ञ": "grateful"}}
    }
  "mr-0024":
    native: "t, curled back (ṭa)"
    notes:
      "n1": "The tongue tip curls back to touch the roof of the mouth: retroflex. English 't' is close to this. Compare त (ta): टोपी (ṭopi, cap)."
    "examples": {
      "खाऊन टाक.": {"native": "Eat it up. (to a friend)", "bases": {"खाऊन": "to eat", "टाक": "to put; to throw"}},
      "गारपीट थांबली.": {"native": "The hailstorm stopped.", "bases": {}}
    }
  "mr-0025":
    native: "th, curled back, with a breath (ṭha)"
    notes:
      "n1": "ट (ṭa) with a breath after it. Not the 'th' of 'think': ठिकाण (ṭhikāṇ, place)."
    "examples": {
      "काठी मोडली.": {"native": "The stick broke.", "bases": {"काठी": "stick", "मोडली": "to break (a thing), to bend"}}
    }
  "mr-0026":
    native: "d, curled back (ḍa)"
    notes:
      "n1": "The tongue tip curls back, as for ट (ṭa). English 'd' is close to this. Compare द (da): डोळा (ḍoḷā, eye)."
    "examples": {
      "कपडे धुणे": {"native": "to wash clothes", "bases": {"कपडे": "clothes", "धुणे": "to wash"}},
      "कावळा ओरडतो.": {"native": "The crow caws.", "bases": {"ओरडतो": "to crow"}}
    }
  "mr-0027":
    native: "dh, curled back, with a breath (ḍha)"
    notes:
      "n1": "ड (ḍa) with a breath after it: ढग (ḍhag, cloud)."
    "examples": {
      "झाडं वाढवा.": {"native": "Grow the trees.", "bases": {"वाढवा": "to raise, to bring up"}},
      "टॅग काढा.": {"native": "Take off the tag.", "bases": {}}
    }
  "mr-0028":
    native: "n, curled back (ṇa)"
    notes:
      "n1": "The tongue tip curls back, as for ट (ṭa). Unlike Hindi, Marathi says it clearly and uses it all the time, inside and at the end of words, though never at the start: पाणी (pāṇi, water), आपण (āpaṇ, we)."
    "examples": {
      "काम करणे": {"native": "to work", "bases": {"करणे": "to do; to make"}},
      "तयार होणे": {"native": "to get ready", "bases": {"तयार": "ready", "होणे": "to be; to become"}}
    }
  "mr-0029":
    native: "t, on the teeth (ta)"
    notes:
      "n1": "The tongue touches the back of the upper teeth: dental. English has no such t; it sounds softer. Compare ट (ṭa): ताट (tāṭ, plate)."
    "examples": {
      "कसे आहात?": {"native": "How are you? (respectful)", "bases": {"आहात": "to be"}},
      "किती वाजले?": {"native": "What time is it?", "bases": {"वाजले": "to strike (the hour); to be felt (cold)"}}
    }
  "mr-0030":
    native: "th, on the teeth, with a breath (tha)"
    notes:
      "n1": "त (ta) with a breath after it. Not the 'th' of 'think': थंड (thaṇḍ, cold)."
    "examples": {
      "इथे थांबा.": {"native": "Stop here, please.", "bases": {"इथे": "here", "थांबा": "to stop; to wait"}},
      "जंगलतोड थांबवा.": {"native": "Stop deforestation.", "bases": {"थांबवा": "to stop"}}
    }
  "mr-0031":
    native: "d, on the teeth (da)"
    notes:
      "n1": "The tongue touches the back of the upper teeth, as for त (ta). Compare ड (ḍa): दार (dār, door)."
    "examples": {
      "खोडरबर दे.": {"native": "Give me the eraser.", "bases": {}},
      "डोळे दुखतात.": {"native": "The eyes hurt.", "bases": {"दुखतात": "to hurt, to ache", "डोळे": "eyes"}}
    }
  "mr-0032":
    native: "dh, on the teeth, with a breath (dha)"
    notes:
      "n1": "द (da) with a breath after it. Not the 'th' of 'this': धन्यवाद (dhanyavād, thank you)."
    "examples": {
      "दूध सांडलं.": {"native": "The milk spilled.", "bases": {"सांडलं": "to spill"}},
      "धरण भरलं.": {"native": "The dam is full.", "bases": {}}
    }
  "mr-0033":
    native: "n (na)"
    notes:
      "n1": "The 'n' of 'no', with the tongue on the teeth: नाव (nāv, name; boat)."
  "mr-0034":
    native: "p (pa)"
    notes:
      "n1": "Like the 'p' of 'spin', with no puff of breath: पाणी (pāṇi, water)."
    "examples": {
      "ऑफर संपली.": {"native": "The offer has ended.", "bases": {"संपली": "to end"}},
      "काम संपवा.": {"native": "Finish the work.", "bases": {"संपवा": "to finish, to end"}}
    }
  "mr-0035":
    native: "ph or f (pha)"
    notes:
      "n1": "प (pa) with a breath after it: फूल (phul, flower). Many speakers say it like English 'f', and Marathi writes English f with it, with no dot: फोन (fon, phone)."
    "examples": {
      "ग्लास फुटला.": {"native": "The glass broke.", "bases": {"फुटला": "to break"}},
      "नारळ फोडला.": {"native": "I broke the coconut.", "bases": {"नारळ": "coconut", "फोडला": "to break open, to crack"}}
    }
  "mr-0036":
    native: "b (ba)"
    notes:
      "n1": "Like the 'b' of 'boy': बाळ (bāḷ, baby)."
    "examples": {
      "डबा उघडा.": {"native": "Open the tin.", "bases": {"उघडा": "to open"}},
      "डॉक्टरांना बोलवा.": {"native": "Call the doctor.", "bases": {"बोलवा": "to call (for help)"}}
    }
  "mr-0037":
    native: "bh, with a breath (bha)"
    notes:
      "n1": "ब (ba) with a breath after it. Not 'v': भात (bhāt, cooked rice)."
    "examples": {
      "पराभवातून शिका.": {"native": "Learn from defeat.", "bases": {"पराभवातून": "defeat"}}
    }
  "mr-0038":
    native: "m (ma)"
    notes:
      "n1": "Like the 'm' of 'mother': मासा (māsā, fish)."
    "examples": {
      "नम्रतेने वागा.": {"native": "Behave with humility.", "bases": {"वागा": "to behave", "नम्रतेने": "humility, politeness"}},
      "बरं, मग?": {"native": "Well, then?", "bases": {"बरं": "well", "मग": "then"}}
    }
  "mr-0039":
    native: "y (ya)"
    notes:
      "n1": "Like the 'y' of 'yes': यश (yaś, success)."
    "examples": {
      "काय रे?": {"native": "What's up? (to a guy)", "bases": {"रे": "(said to a man, informally)"}},
      "घेऊन या.": {"native": "Please bring it.", "bases": {"घेऊन": "to take", "या": "to come"}}
    }
  "mr-0040":
    native: "r (ra)"
    notes:
      "n1": "A single tap of the tongue, like the 'tt' of American 'butter'. Never silent: रस्ता (rastā, road)."
    "examples": {
      "चोर पळाला.": {"native": "The thief ran away.", "bases": {"पळाला": "to run away, to flee", "चोर": "thief"}},
      "थांब्यावर थांबा.": {"native": "Wait at the stop.", "bases": {"थांब्यावर": "stop (bus stop)"}}
    }
  "mr-0041":
    native: "l, on the teeth (la)"
    notes:
      "n1": "A clear 'l', as at the start of 'leaf', with the tongue near the teeth. Compare ळ (ḷa): लिंबू (limbu, lemon)."
    "examples": {
      "चोकलेट लपवलं.": {"native": "I hid the chocolate.", "bases": {"चोकलेट": "chocolate", "लपवलं": "to hide (a thing)"}},
      "डेटा संपला.": {"native": "The data has run out.", "bases": {"संपला": "to end"}}
    }
  "mr-0042":
    native: "v or w (va)"
    notes:
      "n1": "Between English 'v' and 'w': वाघ (vāgh, tiger)."
    "examples": {
      "दया दाखवा.": {"native": "Show compassion.", "bases": {}},
      "दरवाजा उघडा.": {"native": "Open the door.", "bases": {}}
    }
  "mr-0043":
    native: "sh (śa)"
    notes:
      "n1": "The 'sh' of 'shop': शाळा (śāḷā, school)."
    "examples": {
      "नकाशा बघ.": {"native": "Look at the map.", "bases": {"बघ": "to look"}},
      "ब्लाउज शिवला.": {"native": "I sewed a blouse.", "bases": {"शिवला": "to sew", "ब्लाउज": "blouse"}}
    }
  "mr-0044":
    native: "sh, curled back (ṣa)"
    notes:
      "n1": "Curled back in careful speech, in words from Sanskrit: भाषा (bhāṣā, language). It sounds like श (śa) in everyday speech, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
    "examples": {
      "आजी चष्मा घालते.": {"native": "Grandmother wears glasses.", "bases": {"घालते": "to wear"}},
      "आरक्षण नाही मिळालं.": {"native": "I did not get a reservation.", "bases": {"मिळालं": "to get", "नाही": "not"}}
    }
  "mr-0045":
    native: "s (sa)"
    notes:
      "n1": "The 's' of 'sun', never 'sh': साप (sāp, snake)."
    "examples": {
      "दात घासणे": {"native": "to brush one's teeth", "bases": {"दात": "tooth", "घासणे": "to brush"}},
      "दात घासा.": {"native": "Brush your teeth.", "bases": {"घासा": "to brush"}}
    }
  "mr-0046":
    native: "h (ha)"
    notes:
      "n1": "Like the 'h' of 'hat': हात (hāt, hand)."
    "examples": {
      "नदी वाहते.": {"native": "The river flows.", "bases": {"वाहते": "to flow"}},
      "नदीत पोहतात.": {"native": "They swim in the river.", "bases": {"नदीत": "in the river", "पोहतात": "to swim"}}
    }
  "mr-0047":
    native: "l, curled back (ḷa)"
    notes:
      "n1": "The tongue tip curls back, as for ट (ṭa), and says an l. Hindi has no such letter; Marathi uses it everywhere, and it changes the word: काळ (kāḷ, time; an age), with the curled-back l, against काल (kāl, yesterday), with the l on the teeth. It never starts a word: शाळा (śāḷā, school)."
    "examples": {
      "गोळी गिळा.": {"native": "Swallow the tablet.", "bases": {"गिळा": "to swallow"}},
      "घोडा पळतो.": {"native": "The horse runs.", "bases": {"पळतो": "to run"}}
    }
