native: { code: "en", iso639_3: "eng", name: "English" }
name: "Business: in a meeting"
license: "CC-BY-SA-4.0"
description: "Phrases for a work meeting: the agenda, asking to speak, agreeing or not, and the next steps. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-8050":
    native: "What is the agenda of today's meeting?"
  "mr-8051":
    native: "I would like to say something."
  "mr-8052":
    native: "I am not convinced by this."
    notes: { n1: "पटत (paṭat) नाही (nāhi) literally means does not fit the mind, so it is a polite way to say you do not agree." }
  "mr-8053":
    native: "How long will this meeting last?"
  "mr-8054":
    native: "When is the next meeting?"
  "mr-8055":
    native: "Let's get to the point."
  "mr-8056":
    native: "Let's decide this today."
  "mr-8057":
    native: "Let's meet again next week."
  "mr-8058":
    native: "Please note down these points."
