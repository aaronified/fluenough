cards:
  "mr-5696":
    native: "I need milk."
    bases: { "मला": "to me", "हवे": "needed", "आहे": "is" }
    confusables: { "w1": { why: "I, not to me: मी (mi) means I, and मला (malā) means to me." }, "f1": { why: "Feminine: हवी (havi) would agree with a feminine noun; दूध (dudh) is neuter." } }
    notes: { "n1": "Often with आहे (āhe): मला दूध हवे आहे (malā dudh have āhe), I need milk, is the usual way to say I need something." }
  "mr-5697":
    native: "Cut the potato."
    bases: { "कापा": "cut" }
    confusables: { "w1": { why: "Eat, not cut: खा (khā) means eat." }, "f1": { why: "Present: कापतो (kāpto) is for one man; the order takes कापा (kāpā)." } }
    notes: { "n1": "कापा (kāpā), cut, is the polite order: the stem plus -ा (-ā), for a polite you." }
  "mr-5698":
    native: "They eat mangoes."
    bases: { "खातात": "eat" }
    confusables: { "w1": { why: "Banana, not mango: केळे (keḷe) is banana." }, "f1": { why: "One man: खातो (khāto) is for one man; ते (te) takes खातात (khātāt)." } }
  "mr-5699":
    native: "Is this salt?"
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "Sugar, not salt: साखर (sākhar) is sugar." }, "f1": { why: "Plural: आहेत (āhet) is for several things; this is one thing." } }
  "mr-5700":
    native: "Take the flour."
    bases: { "घ्या": "take" }
    confusables: { "w1": { why: "Give, not take: द्या (dyā) means give." }, "f1": { why: "Present: घेतो (gheto) is for one man; the order takes घ्या (ghyā)." } }
  "mr-5701":
    native: "Do you like fish?"
    bases: { "तुम्हाला": "to you", "आवडतो": "like" }
    confusables: { "w1": { why: "Chicken, not fish: चिकन (cikan) is chicken." }, "f1": { why: "Feminine: आवडते (āvaḍte) is for a feminine thing; मासा (māsā) is masculine." } }
    notes: { "n1": "तुम्हाला (tumhālā), to you, is the one who likes, and the verb agrees with what is liked: मासा (māsā), a masculine noun." }
  "mr-5702":
    native: "Where is the vegetable dish?"
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "Who, not where: कोण (koṇ) asks who." }, "f1": { why: "Plural: आहेत (āhet) is for several things." } }
  "mr-5703":
    native: "Eat the egg."
    bases: { "खा": "eat" }
    confusables: { "w1": { why: "Drink, not eat: पी (pi) means drink." }, "f1": { why: "Past: खाल्ले (khālle) is the past; खा (khā) is the order." } }
  "mr-5704":
    native: "I need sugar."
    bases: { "मला": "to me", "हवी": "needed", "आहे": "is" }
    confusables: { "w1": { why: "I, not to me: मी (mi) means I, and मला (malā) means to me." }, "f1": { why: "Neuter: हवे (have) agrees with a neuter noun; साखर (sākhar) is feminine." } }
    notes: { "n1": "पाहिजे (pāhije) never changes for gender, so मला साखर पाहिजे (malā sākhar pāhije), I need sugar, is also said." }
  "mr-5705":
    native: "They drink milk."
    bases: { "पितात": "drink" }
    confusables: { "w1": { why: "Salt, not milk: मीठ (miṭh) is salt." }, "f1": { why: "One man: पितो (pito) is for one man; ते (te) takes पितात (pitāt)." } }
  "mr-5706":
    native: "Do you eat chilli?"
    bases: { "खाता": "eat" }
    confusables: { "w1": { why: "Mango, not chilli: आंबा (āmbā) is mango." }, "f1": { why: "One man: खातो (khāto) is for one man; तुम्ही (tumhi) takes खाता (khātā)." } }
    notes: { "n1": "तुम्ही (tumhī) takes -ता (-tā), as in खाता (khātā), eat." }
