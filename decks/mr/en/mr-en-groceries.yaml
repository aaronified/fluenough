schema: 1
id: "mr-en-groceries"
kind: "layer"
core: "mr-groceries"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Groceries"
license: "CC-BY-SA-4.0"
description: "Vegetables, fruit, fish, eggs and the staples. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0390":
    native: "vegetables; a vegetable dish"
    notes:
      "n1": "Both the vegetables at the market and the dish made from them: बटाट्याची भाजी (baṭāṭyāci bhāji), potato curry. A seller is a भाजीवाला (bhājivālā)."
    "examples": {
      "आम्ही भाज्या पिकवतो.": {"native": "We grow vegetables.", "bases": {"पिकवतो": "to grow (crops)", "भाज्या": "vegetables; a vegetable dish"}},
      "कोबीची भाजी खा.": {"native": "Eat the cabbage curry.", "bases": {"कोबीची": "of cabbage", "खा": "to eat", "भाजी": "vegetables; a vegetable dish"}}
    }
  "mr-0391":
    native: "onion"
    notes:
      "n1": "Plural कांदे (kānde). Maharashtra grows much of India's onions, around Nashik."
    "examples": {
      "कांदा बारीक चिरा.": {"native": "Chop the onion finely.", "bases": {"बारीक": "fine; small", "चिरा": "to chop"}},
      "ती कांदा कापते.": {"native": "She cuts the onion.", "bases": {"कापते": "to cut"}}
    }
  "mr-0392":
    native: "potato"
    notes:
      "n1": "From Portuguese batata, as in the वडा (vaḍā) of वडापाव (vaḍāpāv): बटाटावडा (baṭāṭāvaḍā)."
    "examples": {
      "तो बटाटा कापतो.": {"native": "He cuts the potato.", "bases": {"कापतो": "to cut"}}
    }
  "mr-0393":
    native: "tomato"
  "mr-0394":
    native: "fish"
    notes:
      "n1": "Plural मासे (māse), which is what you buy: मासे आहेत का? (mase ahet ka?). On the coast, pomfret is पापलेट (pāpleṭ) and Bombay duck बोंबील (bombil)."
    "examples": {
      "ती मासा तळते.": {"native": "She fries the fish.", "bases": {"तळते": "to fry"}}
    }
  "mr-0395":
    native: "chicken (meat)"
    notes:
      "n1": "Goat meat is मटण (maṭaṇ)."
    "examples": {
      "शंभर ग्रॅम चिकन घ्या.": {"native": "Take a hundred grams of chicken.", "bases": {"घ्या": "to take"}}
    }
  "mr-0396":
    native: "egg"
    notes:
      "n1": "Plural अंडी (aṇḍi): सहा अंडी द्या (sahā aṇḍi dyā), six eggs, please. In speech also अंडं (aṇḍam̐)."
    "examples": {
      "अंडं फोडून पाहा.": {"native": "Break the egg open and see.", "bases": {"फोडून": "to break open, to crack", "अंडं": "egg"}},
      "कोंबडी अंडी देते.": {"native": "The hen lays eggs.", "bases": {"देते": "to give", "अंडी": "egg"}}
    }
  "mr-0397":
    native: "rice (uncooked)"
    notes:
      "n1": "Cooked rice is भात (bhāt)."
    "examples": {
      "आजी तांदूळ वेचते.": {"native": "Grandmother picks the rice grains.", "bases": {"वेचते": "to pick (one by one)", "तांदूळ": "rice (uncooked)"}},
      "तांदूळ पाण्यात भिजवतो.": {"native": "He soaks the rice in water.", "bases": {"पाण्यात": "in water", "भिजवतो": "to soak"}}
    }
  "mr-0398":
    native: "flour"
    notes:
      "n1": "गव्हाचे पीठ (gavhāce piṭh), wheat flour."
    "examples": {
      "गहू दळून पीठ करा.": {"native": "Grind the wheat into flour.", "bases": {"दळून": "to grind"}},
      "तो पीठ आणि पाणी मिसळतो.": {"native": "He mixes the flour and water.", "bases": {"मिसळतो": "to mix"}}
    }
  "mr-0399":
    native: "lentils; dal"
    notes:
      "n1": "Both the dry lentils and the dish. The everyday cooked dal is वरण (varaṇ), and its spicier cousin आमटी (āmṭi)."
    "examples": {
      "डाळ पौष्टिक असते.": {"native": "Lentils are nutritious.", "bases": {"असते": "to be", "डाळ": "lentils; dal"}},
      "डाळ रात्री भिजवा.": {"native": "Soak the lentils at night.", "bases": {"रात्री": "night", "भिजवा": "to soak"}}
    }
  "mr-0400":
    native: "sugar"
    "examples": {
      "मुंग्या साखर नेतात.": {"native": "The ants carry off sugar.", "bases": {"मुंग्या": "ants", "नेतात": "to carry off", "साखर": "sugar"}},
      "एक चमचा साखर द्या.": {"native": "Give me a spoonful of sugar.", "bases": {"द्या": "to give"}}
    }
  "mr-0401":
    native: "salt"
    "examples": {
      "मीठ घाला.": {"native": "Add salt.", "bases": {"घाला": "to put in"}},
      "स्वयंपाकात मीठ घातलं.": {"native": "I put salt in the cooking.", "bases": {"स्वयंपाकात": "cooking (at home)"}}
    }
  "mr-0402":
    native: "oil"
    "examples": {
      "कढईत तेल घाला.": {"native": "Put oil in the wok.", "bases": {"कढईत": "in the wok", "घाला": "to put in"}},
      "दोन लिटर तेल आणा.": {"native": "Bring two litres of oil.", "bases": {"आणा": "to bring"}}
    }
  "mr-0403":
    native: "milk"
    "examples": {
      "दूध उकळते.": {"native": "The milk boils.", "bases": {"उकळते": "to boil"}},
      "दूध गाळलं.": {"native": "I strained the milk.", "bases": {"गाळलं": "to strain, to filter", "दूध": "milk"}}
    }
  "mr-0056":
    notes:
      "n1": "Fruit in general. A fruit seller is a फळवाला (phaḷvālā)."
  "mr-0404":
    native: "mango"
    notes:
      "n1": "The anusvar before ब (ba) is said m. The famous Alphonso of the Konkan coast is हापूस (hāpus)."
    "examples": {
      "त्याने आंबा खाल्ला.": {"native": "He ate a mango.", "bases": {"त्याने": "he; that", "खाल्ला": "to eat"}},
      "मला आंबे आवडतात.": {"native": "I like mangoes.", "bases": {"आंबे": "mango"}}
    }
  "mr-0405":
    native: "banana"
    notes:
      "n1": "In speech केळं (keḷam̐). Plural केळी (keḷi), and bananas are sold by the dozen, डझन (ḍajhan)."
    "examples": {
      "केळे पिवळे आहे.": {"native": "The banana is yellow.", "bases": {"पिवळे": "yellow", "आहे": "to be"}},
      "माकड केळे खाते.": {"native": "The monkey eats a banana.", "bases": {"खाते": "to eat", "केळे": "banana"}}
    }
  "mr-0406":
    native: "chilli"
    notes:
      "n1": "हिरवी मिरची (hirvi mirci), green chilli."
    "examples": {
      "मिरच्या वाळवल्या.": {"native": "I dried the chillies.", "bases": {"वाळवल्या": "to dry (in the sun)", "मिरच्या": "chilli"}}
    }
