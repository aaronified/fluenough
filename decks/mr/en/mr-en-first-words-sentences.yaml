cards:
  "mr-5653":
    native: "Where do you live?"
    bases: { "राहता": "live" }
    confusables: { "w1": { why: "Who, not where: कोण (koṇ) asks who." }, "f1": { why: "One man: राहतो (rāhto) is for one man; तुम्ही (tumhi) takes राहता (rāhtā)." } }
  "mr-5654":
    native: "Are you fine?"
    bases: { "आहात": "are" }
    confusables: { "w1": { why: "Yes, an answer: हो (ho) answers yes; this is a question, not an answer." }, "f1": { why: "Singular: आहे (āhe) is for one person; तुम्ही (tumhi) takes आहात (āhāt)." } }
  "mr-5655":
    native: "Yes, I want some water."
    bases: { "मला": "to me", "हवे": "needed", "आहे": "is" }
    confusables: { "w1": { why: "No: नाही (nāhi) means no; हो (ho) is yes." }, "f1": { why: "Feminine: हवी (havi) would agree with a feminine noun; पाणी (pāṇi) takes हवे (have)." } }
    notes: { "n1": "Wanting is said with the dative: मला (malā), to me, is the one who wants, and हवे (have), needed, goes with पाणी (pāṇi), water, which is what is wanted." }
  "mr-5656":
    native: "What is this?"
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "Who, not what: कोण (koṇ) asks who." }, "w2": { why: "Where, not what: कुठे (kuṭhe) asks where." }, "f1": { why: "Plural: आहेत (āhet) is for several things; हे (he) with one thing takes आहे (āhe)." } }
  "mr-5657":
    native: "Yes, that's fine."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "No, the opposite of yes: नाही (nāhi) means no." }, "f1": { why: "Plural: आहेत (āhet) is for several things; this is one." } }
  "mr-5658":
    native: "This water is good."
    bases: { "चांगले": "good", "आहे": "is" }
    confusables: { "w1": { why: "Masculine: चांगला (cāṅglā) agrees with a masculine noun; पाणी (pāṇi) takes चांगले (cāṅgle)." }, "f1": { why: "Feminine: चांगली (cāṅgli) agrees with a feminine noun, and पाणी (pāṇi) is not one." } }
  "mr-5659":
    native: "What do you drink?"
    bases: { "पिता": "drink" }
    confusables: { "w1": { why: "Who, not what: कोण (koṇ) asks who." }, "f1": { why: "One man: पितो (pito) is for one man; तुम्ही (tumhi) takes पिता (pitā)." } }
  "mr-5660":
    native: "Give me water."
    bases: { "मला": "to me", "द्या": "give" }
    confusables: { "w1": { why: "Take, not give: घ्या (ghyā) means take." }, "f1": { why: "Past: दिले (dile) is the past; the sentence is an order to give." } }
    notes: { "n1": "Asking politely uses द्या (dyā), the polite command of देणे (deṇe), to give; to a friend the form is दे (de)." }
  "mr-5661":
    native: "Where is the water?"
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "Who, not where: कोण (koṇ) asks who." }, "w2": { why: "What, not where: काय (kāy) asks what." } }
  "mr-5662":
    native: "Okay, I am coming."
    bases: { "येतो": "come" }
    confusables: { "w1": { why: "No: नाही (nāhi) means no." }, "f1": { why: "Plural: येतात (yetāt) is for several people; मी (mi) is one person." } }
  "mr-5663":
    native: "Who is it?"
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "Where, not who: कुठे (kuṭhe) asks where." }, "w2": { why: "What, not who: काय (kāy) asks what." } }
