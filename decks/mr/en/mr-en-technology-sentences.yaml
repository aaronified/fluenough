cards:
  "mr-6535":
    native: "He makes a new program."
    bases: { "नवीन": "new" }
    confusables: { "w1": { why: "She, not he: ती (ti) means she." }, "f1": { why: "Feminine: करते (karte) is for a woman; तो (to) is he, so करतो (karto)." } }
  "mr-6536":
    native: "My computer was repaired."
    bases: { "माझा": "my", "झाला": "was (passive)" }
    confusables: { "w1": { why: "He, not my computer: तो (to) means he." }, "f1": { why: "Feminine: झाली (jhāli) is for a feminine subject; संगणक (saṅgaṇak) is masculine, so झाला (jhālā)." } }
  "mr-6537":
    native: "The website is online."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "Server, not website: सर्व्हर (sarvhar) is the computer that serves websites." }, "f1": { why: "Plural: आहेत (āhet) is for more than one; one website takes आहे (āhe)." } }
  "mr-6538":
    native: "Keep the code safe."
    bases: { "सुरक्षित": "safe", "ठेवा": "keep" }
    confusables: { "w1": { why: "Security, not safe: सुरक्षा (surakṣā) is the noun for security." }, "f1": { why: "Present, a statement: ठेवतो (ṭhevto) means keeps; ठेवा (ṭhevā) is a polite request." } }
  "mr-6539":
    native: "The data is on the server."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "Website, not data: वेबसाइट (vebsāiṭ) is a website." }, "w2": { why: "Here, not on the server: इथे (ithe) means here." } }
  "mr-6540":
    native: "The robot works."
    bases: { "काम": "work" }
    confusables: { "w1": { why: "She, not the robot: ती (ti) means she." }, "f1": { why: "Plural: करतात (kartāt) is for more than one; one robot takes करतो (karto)." } }
  "mr-6541":
    native: "Where does energy come from?"
    bases: { "कुठून": "from where" }
    confusables: { "w1": { why: "There, not from where: तिथे (tithe) means there." }, "f1": { why: "Masculine: येतो (yeto) goes with a masculine subject; ऊर्जा (urjā) is feminine, so येते (yete)." } }
  "mr-6542":
    native: "Artificial intelligence is useful."
    bases: { "उपयोगी": "useful", "आहे": "is" }
    confusables: { "w1": { why: "Technology, not intelligence: तंत्रज्ञान (tantradnyān) means technology." }, "f1": { why: "Plural: आहेत (āhet) is for more than one; this one field takes आहे (āhe)." } }
  "mr-6543":
    native: "Change the security password."
    bases: { "पासवर्ड": "password" }
    confusables: { "w1": { why: "Virus, not security: व्हायरस (vhāyras) is a virus." }, "f1": { why: "Present, a statement: बदलतो (badlto) means changes; बदला (badlā) is a polite request." } }
  "mr-6544":
    native: "He uploads the file."
    bases: { "फाइल": "file" }
    confusables: { "w1": { why: "She, not he: ती (ti) means she." }, "f1": { why: "Feminine: करते (karte) is for a woman; तो (to) is he, so करतो (karto)." } }
