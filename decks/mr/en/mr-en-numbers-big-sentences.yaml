cards:
  "mr-6211":
    native: "I have a hundred rupees."
    bases: { "माझ्याकडे": "at my place", "शंभर": "one hundred", "रुपये": "rupees", "आहेत": "are" }
    confusables: { "w1": { why: "Ninety: नव्वद (navvad) is ninety." }, "f1": { why: "Singular: आहे (āhe) is for one thing; the rupees are plural, so आहेत (āhet) is used." } }
  "mr-6212":
    native: "This book costs three hundred rupees."
    bases: { "तीनशे": "three hundred", "रुपयांचे": "rupees' worth", "आहे": "is" }
    confusables: { "w1": { why: "Four hundred: चारशे (cārśe) is four hundred." }, "f1": { why: "Plural: आहेत (āhet) is for more than one; this is one book, so आहे (āhe) is used." } }
  "mr-6213":
    native: "A thousand people live in the village."
    bases: { "गावात": "in the village", "हजार": "a thousand", "राहतात": "live" }
    confusables: { "w1": { why: "Lakh: लाख (lākh) is a hundred thousand." }, "f1": { why: "Singular: राहतो (rāhto) is for one man; many people take राहतात (rāhtāt)." } }
  "mr-6214":
    native: "Our school has four hundred children."
    bases: { "आमच्या": "our", "शाळेत": "in the school", "चारशे": "four hundred", "मुले": "children", "आहेत": "are" }
    confusables: { "w1": { why: "Seven hundred: सातशे (sātśe) is seven hundred." }, "f1": { why: "Singular: मूल (mul) is one child; many children take मुले (mule)." } }
  "mr-6215":
    native: "This house was built fifty years ago."
    bases: { "पन्नास": "fifty", "वर्षांपूर्वी": "years ago", "बांधले": "was built" }
    confusables: { "w1": { why: "Sixty: साठ (sāṭh) is sixty." }, "f1": { why: "Present: बांधतो (bāndhato) means builds now; the sentence is about the past, so बांधले (bāndhale) is used." } }
  "mr-6216":
    native: "A hundred thousand people live in the city."
    bases: { "लाख": "a hundred thousand", "शहरात": "in the city", "राहतात": "live" }
    confusables: { "w1": { why: "Thousand: हजार (hajār) is one thousand." }, "f1": { why: "Singular: राहतो (rāhto) is for one man, not for many people." } }
  "mr-6217":
    native: "My grandfather is eighty years old."
    bases: { "माझे": "my", "ऐंशी": "eighty", "वर्षांचे": "of years", "आहेत": "are" }
    confusables: { "w1": { why: "Ninety: नव्वद (navvad) is ninety." }, "f1": { why: "Singular: आहे (āhe) is for one thing; here the verb takes the plural आहेत (āhet)." } }
  "mr-6218":
    native: "An hour and a quarter has passed."
    bases: { "सव्वा": "one and a quarter", "तास": "hours", "झाला": "has passed" }
    confusables: { "w1": { why: "One and a half: दीड (diḍ) is one and a half, not a quarter more." }, "f1": { why: "Neuter or plural: झाले (jhāle) agrees with a neuter or plural subject, and तास (tās) as subject takes झाला (jhālā)." } }
  "mr-6219":
    native: "Give one and a half kilos of rice."
    bases: { "दीड": "one and a half", "द्या": "give (polite)" }
    confusables: { "w1": { why: "Two and a half: अडीच (aḍic) is two and a half." }, "f1": { why: "Take: घ्या (ghyā) means take, not give." } }
  "mr-6220":
    native: "It is half past two."
    bases: { "अडीच": "two and a half", "वाजले": "has struck" }
    confusables: { "w1": { why: "One and a half: दीड (diḍ) is one and a half." }, "w2": { why: "Quarter to: पावणे (pāvṇe) is a quarter before the hour, not a half." } }
  "mr-6221":
    native: "It is a quarter to eight."
    bases: { "पावणे": "a quarter to", "आठ": "eight", "वाजले": "has struck" }
    confusables: { "w1": { why: "Half past: साडे (sāḍe) is used for half past the hour, not a quarter to." }, "w2": { why: "Quarter past: सव्वा (savvā) is a quarter past, not a quarter to." } }
  "mr-6222":
    native: "This shirt costs nine hundred rupees."
    bases: { "नऊशे": "nine hundred", "रुपयांचा": "rupees' worth", "आहे": "is" }
    confusables: { "w1": { why: "Two hundred: दोनशे (donśe) is two hundred." }, "f1": { why: "Neuter: रुपयांचे (rupyāñce) agrees with a neuter noun, and शर्ट (śarṭ) is masculine." } }
