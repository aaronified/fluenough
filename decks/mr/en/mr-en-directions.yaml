schema: 1
id: "mr-en-directions"
kind: "layer"
core: "mr-directions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Directions"
license: "CC0-1.0"
description: "Left, right, straight on, and asking where something is. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0446":
    native: "to the left; on the left"
    notes:
      "n1": "डावा (ḍāvā) is 'left', and -कडे (-kaḍe) 'towards': डावीकडे वळा (ḍāvikaḍe vaḷā), turn left."
  "mr-0447":
    native: "to the right; on the right"
    notes:
      "n1": "उजवा (ujvā) is 'right'."
  "mr-0062":
    native: "straight on"
    notes:
      "n1": "सरळ जा (saraḷ jā), go straight on."
  "mr-0448":
    native: "ahead; further on"
    notes:
      "n1": "थोडे पुढे (thoḍe puḍhe), a little further on."
  "mr-0449":
    native: "behind; back"
    notes:
      "n1": "स्टेशनच्या मागे (sṭeśancyā māge), behind the station."
  "mr-0450":
    native: "near; nearby"
    notes:
      "n1": "इथे जवळ (ithe javaḷ), near here."
  "mr-0451":
    native: "far; long"
    notes:
      "n1": "खूप लांब आहे का? (khup lamb ahe ka?), is it very far?"
  "mr-0452":
    native: "Where is the station?"
    notes:
      "n1": "Any place before कुठे आहे (kuṭhe āhe): दवाखाना कुठे आहे (davākhānā kuṭhe āhe)?, where is the clinic? असणे (asṇe) changes its stem in the present: आह- (āh-)."
    bases:
      "आहे": "to be"
  "mr-0453":
    native: "turn (please)"
    notes:
      "n1": "From वळणे (vaḷṇe), to turn. A turning in the road is a वळण (vaḷaṇ)."
  "mr-0454":
    native: "corner"
    notes:
      "n1": "कोपऱ्यावर (kopryāvar), at the corner, with the eyelash r."
  "mr-0455":
    native: "square; crossroads"
    notes:
      "n1": "Many are named, and given as landmarks: शिवाजी चौक (śivāji cauk)."
  "mr-0456":
    native: "opposite; in front"
    notes:
      "n1": "बँकेसमोर (bam̐kesamor), opposite the bank."
  "mr-0457":
    native: "bridge"
  "mr-0458":
    native: "traffic lights"
    notes:
      "n1": "Directions are given by them: दुसऱ्या सिग्नलला डावीकडे (dusryā signallā ḍāvikaḍe), left at the second lights."
