native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences with more adjectives"
license: "CC-BY-SA-4.0"
description: "Short sentences that describe people, food, places and things, built from the adjectives of More adjectives. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-5034":
    native: "He is a clever boy."
    bases: { "तो": "he", "हुशार": "clever", "मुलगा": "boy", "आहे": "is" }
    notes:
      "n1": "हुशार (huśār) ends in a consonant, so it never changes: हुशार मुलगी (huśār mulgi), a clever girl."
    confusables: { "w1": { why: "Lazy, the opposite: आळशी (āḷśi) means lazy." }, "w2": { why: "Girl: मुलगी (mulgi) is a girl, so मुलगा (mulgā) is needed." } }
  "mr-5035":
    native: "She is hard-working."
    bases: { "ती": "she", "मेहनती": "hard-working", "आहे": "is" }
    confusables: { "w1": { why: "He, not she: तो (to) means he." }, "f1": { why: "Plural: आहेत (āhet) is for several people; one woman takes आहे (āhe)." } }
  "mr-5036":
    native: "He is lazy."
    bases: { "तो": "he", "आळशी": "lazy", "आहे": "is" }
    confusables: { "w1": { why: "Clever, the opposite: हुशार (huśār) means clever." }, "w2": { why: "Hard-working, the opposite: मेहनती (mehnti) means hard-working." } }
  "mr-5037":
    native: "My grandmother is kind."
    bases: { "माझी": "my", "आजी": "grandmother", "दयाळू": "kind", "आहे": "is" }
    notes:
      "n1": "माझी (mājhi) agrees with आजी (āji), grandmother, a feminine noun: my takes the form of what is owned, not of the speaker."
    confusables: { "w1": { why: "Short-tempered, the opposite: रागीट (rāgiṭ) means short-tempered." }, "f1": { why: "Plural: आहेत (āhet) is for several people; one grandmother takes आहे (āhe)." } }
  "mr-5038":
    native: "This milk is fresh."
    bases: { "हे": "this", "दूध": "milk", "ताजे": "fresh", "आहे": "is" }
    confusables: { "w1": { why: "Stale, the opposite: शिळा (śiḷā) means stale." }, "w2": { why: "Hot, not fresh: गरम (garam) means hot." } }
  "mr-5039":
    native: "These mangoes are raw."
    bases: { "हे": "these", "आंबे": "mangoes", "कच्चे": "raw; unripe", "आहेत": "are" }
    notes:
      "n1": "कच्चा (kaccā) becomes कच्चे (kacce) for several mangoes, as आंबा (āmbā) becomes आंबे (āmbe): a masculine noun in -आ (-ā) takes -े (-e) in the plural."
    confusables: { "w1": { why: "Sour, a taste: आंबट (āmbaṭ) means sour, not raw." }, "f1": { why: "Singular: आहे (āhe) is for one thing; several mangoes take आहेत (āhet)." } }
  "mr-5040":
    native: "The lemon is sour."
    bases: { "लिंबू": "lemon", "आंबट": "sour", "आहे": "is" }
    confusables: { "w1": { why: "Bitter, a different taste: कडू (kaḍu) means bitter." }, "w2": { why: "Sweet, the opposite taste: गोड (goḍ) means sweet." } }
  "mr-5041":
    native: "The medicine is bitter."
    bases: { "औषध": "medicine", "कडू": "bitter", "आहे": "is" }
    confusables: { "w1": { why: "Sour: आंबट (āmbaṭ) means sour, not bitter." }, "f1": { why: "Plural: आहेत (āhet) is for several things; one medicine takes आहे (āhe)." } }
  "mr-5042":
    native: "I am thirsty (said by a man)."
    bases: { "मी": "I", "तहानलेला": "thirsty", "आहे": "am" }
    confusables: { "w1": { why: "Hungry, not thirsty: भुकेला (bhukelā) means hungry." }, "f1": { why: "Feminine: तहानलेली (tahānleli) is for a woman, and this sentence is said by a man." } }
  "mr-5043":
    native: "The road is empty."
    bases: { "रस्ता": "road", "रिकामा": "empty", "आहे": "is" }
    notes:
      "n1": "रिकामा (rikāmā) keeps -ा (-ā) because रस्ता (rastā), road, is masculine, as मोठा मुलगा (moṭhā mulgā), a big boy."
    confusables: { "w1": { why: "Dense, not empty: दाट (dāṭ) means dense." }, "w2": { why: "Full, the opposite of empty: भरलेला (bharlelā) means full." } }
  "mr-5044":
    native: "The forest is dense."
    bases: { "जंगल": "forest", "दाट": "dense", "आहे": "is" }
    confusables: { "w1": { why: "Thin, not dense: पातळ (pātaḷ) means thin." }, "f1": { why: "Plural: आहेत (āhet) would need several things; the forest is one thing, so आहे (āhe) is used." } }
  "mr-5045":
    native: "My brother is short-tempered."
    bases: { "माझा": "my", "भाऊ": "brother", "रागीट": "short-tempered", "आहे": "is" }
    notes:
      "n1": "माझा (mājhā) agrees with भाऊ (bhāu), brother, a masculine noun, so it ends in -ा (-ā), while माझी बहीण (mājhī bahiṇ), my sister, ends in -ी (-ī)."
    confusables: { "w1": { why: "Honest, another quality: प्रामाणिक (prāmāṇik) means honest." }, "w2": { why: "Sister, not brother: बहीण (bahiṇ) means sister." } }
  "mr-5046":
    native: "He is young."
    bases: { "तो": "he", "तरुण": "young", "आहे": "is" }
    confusables: { "w1": { why: "Old, the opposite: म्हातारा (mhātārā) means old." }, "f1": { why: "Plural: आहेत (āhet) is for several people; one man takes आहे (āhe)." } }
  "mr-5047":
    native: "The old man is at home."
    bases: { "म्हातारा": "old", "माणूस": "man", "घरी": "at home", "आहे": "is" }
    notes:
      "n1": "घरी (ghari) is घर (ghar), home, with an old ending -ई (-i) that means 'at': घरी आहे (ghari āhe), is at home."
    confusables: { "w1": { why: "Young, the opposite: तरुण (taruṇ) means young." }, "w2": { why: "Outside: बाहेर (bāher) means outside, not घरी (ghari)." } }
