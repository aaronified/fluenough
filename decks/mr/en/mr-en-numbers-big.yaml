schema: 1
id: "mr-en-numbers-big"
kind: "layer"
core: "mr-numbers-big"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Tens and big numbers"
license: "CC-BY-SA-4.0"
description: "Every number from 21 to 99, the hundreds, a thousand, lakh and crore, and the quarters and halves every market uses. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0272":
    native: "30, thirty"
    notes:
      "n1": "Every number from 21 to 99 has its own word in Marathi, as in Hindi: 26 is सव्वीस (savvis), not 'twenty six'. This deck teaches every one."
  "mr-0273":
    native: "40, forty"
    notes:
      "n1": "With the curled-back ळ (ḷa)."
    "examples": {
      "आज तापमान चाळीस अंश आहे.": {"native": "The temperature is forty degrees today.", "bases": {"आहे": "to be"}}
    }
  "mr-0274":
    native: "50, fifty"
    notes:
      "n1": "From 51 to 58 it is shortened: बावन्न (bāvanna), 52, त्रेपन्न (trepanna), 53. 49 keeps the full word: एकोणपन्नास (ekoṇpannās)."
    "examples": {
      "पृष्ठ क्रमांक पन्नास उघडा.": {"native": "Open to page number fifty.", "bases": {"क्रमांक": "number"}}
    }
  "mr-0275":
    native: "60, sixty"
    notes:
      "n1": "Do not mix it with सात (sāt), 7. From 61 to 68 it becomes सष्ठ (saṣṭh): बासष्ठ (bāsaṣṭha), 62; 59 keeps it, एकोणसाठ (ekoṇsāṭh)."
  "mr-0276":
    native: "70, seventy"
    notes:
      "n1": "Do not mix it with सतरा (satrā), 17. From 71 on it takes a form with ह (h), such as हत्तर (hattar) in बाहत्तर (bāhattar), 72."
  "mr-0277":
    native: "80, eighty"
    notes:
      "n1": "Not built from आठ (āṭh), 8. It stays whole in 81 to 88: ब्याऐंशी (byāaiṁśi), 82; 79 is एकोणऐंशी (ekoṇaiṁśi)."
  "mr-0278":
    native: "90, ninety"
    notes:
      "n1": "Not built from नऊ (nau), 9. From 91 to 98 it becomes ण्णव (ṇṇav): ब्याण्णव (byāṇṇav), 92; 89 keeps it, एकोणनव्वद (ekoṇnavvad)."
  "mr-0279":
    native: "100, a hundred"
    notes:
      "n1": "A hundred on its own. After a number, 'hundred' is -शे (-śe), written as one word with it: दोनशे (donśe), 200."
    "examples": {
      "शंभराची नोट द्या.": {"native": "Give a hundred-rupee note.", "bases": {"शंभराची": "100, a hundred"}},
      "त्याने शंभर धावा केल्या.": {"native": "He scored a hundred runs.", "bases": {"धावा": "runs", "शंभर": "100, a hundred"}}
    }
  "mr-0280":
    native: "one hundred (with more after it)"
    notes:
      "n1": "Before more digits a hundred is एकशे (ekśe): एकशे वीस (ekśe vis), 120. Many prices are said in hundreds: अकराशे (akrāśe), eleven hundred, 1,100."
  "mr-0281":
    native: "200, two hundred"
    notes:
      "n1": "Two is the plain दोन (don) before शे (śe), not the blended form of बावीस (bāvis), 22: in the hundreds the unit keeps its own form."
  "mr-0282":
    native: "300, three hundred"
    notes:
      "n1": "Three is the plain तीन (tin) before शे (śe), not the form in तेवीस (tevis), 23, or त्रेचाळीस (trecāḷis), 43."
  "mr-0283":
    native: "400, four hundred"
    notes:
      "n1": "Four is the plain चार (cār) before शे (śe), not the form in चौतीस (cautis), 34, or चोवीस (covis), 24."
  "mr-0284":
    native: "500, five hundred"
    notes:
      "n1": "पाचशेची नोट (pācśeci noṭ), a 500-rupee note."
    "examples": {
      "पाचशे ग्रॅम साखर द्या.": {"native": "Give me five hundred grams of sugar.", "bases": {"द्या": "to give"}}
    }
  "mr-0285":
    native: "600, six hundred"
    notes:
      "n1": "Six is the full सहा (sahā) before शे (śe), unlike छत्तीस (chattis), 36, or सव्वीस (savvis), 26."
  "mr-0286":
    native: "700, seven hundred"
    notes:
      "n1": "In सातशे वर्षं जुना (sātśe varṣam̐ junā), the adjective जुना (junā) agrees with किल्ला (killā), the masculine fort, not with the number or with वर्षं (varṣam̐). Seven is the plain सात (sāt), unlike सत्तावीस (sattāvis), 27."
    "examples": {
      "हा किल्ला सातशे वर्षं जुना आहे.": {"native": "This fort is seven hundred years old.", "bases": {"आहे": "to be"}}
    }
  "mr-0287":
    native: "800, eight hundred"
    notes:
      "n1": "Eight is the full आठ (āṭh) before शे (śe), unlike अठरा (aṭhrā), 18, or अडतीस (aḍtis), 38."
  "mr-0288":
    native: "900, nine hundred"
    notes:
      "n1": "Nine is नऊ (nau) before शे (śe), as on its own, not the form in नव्वद (navvad), 90."
  "mr-0289":
    native: "1,000, a thousand"
    notes:
      "n1": "दोन हजार पंचवीस (don hajār pañcvis), 2025. Marathi writes it without the dot below that Hindi puts in हज़ार (hazār)."
  "mr-0290":
    native: "1,00,000, a lakh (a hundred thousand)"
    notes:
      "n1": "Indian numbering counts in lakhs and crores, and places its commas to match: 1,00,000 is one lakh, 10,00,000 ten lakh. Prices, salaries and populations are all given this way."
  "mr-0291":
    native: "1,00,00,000, a crore (ten million)"
    notes:
      "n1": "A hundred lakh."
  "mr-0292":
    native: "1¼; and a quarter"
    notes:
      "n1": "Before another number, a quarter more: सव्वादोन (savvādon), 2¼, and on the clock 2:15. सव्वाशे (savvāśe) is 125."
  "mr-0293":
    native: "1½, one and a half"
    notes:
      "n1": "With शे (śe) and हजार (hajār) too: दीडशे (diḍśe) is 150, दीड हजार (diḍ hajār) 1,500. On the clock, दीड वाजता (diḍ vājtā) is at 1:30. Heard constantly in markets."
  "mr-0294":
    native: "2½, two and a half"
    notes:
      "n1": "अडीचशे (aḍicśe) is 250, and अडीच वाजता (aḍic vājtā) at 2:30. From 3½ on, Marathi says साडे (sāḍe)."
  "mr-0295":
    native: "and a half (from 3½ on)"
    notes:
      "n1": "Joined to the number: साडेतीन (sāḍetin), 3½; साडेतीनशे (sāḍetinśe), 350; साडेचार वाजता (sāḍecār vājtā), at 4:30."
  "mr-0296":
    native: "a quarter less"
    notes:
      "n1": "Joined to the number: पावणेदोन (pāvṇedon), 1¾; पावणेपाच वाजता (pāvṇepāc vājtā), at a quarter to five."
  "mr-0297":
    native: "21, twenty-one"
    notes:
      "n1": "Each number from 21 to 99 is one word, the unit blended into the ten, often irregularly: learn them as words. Before each ten comes एकोण- (ekoṇ-), 'one less': एकोणतीस (ekoṇtis), 29."
  "mr-0298":
    native: "22, twenty-two"
    notes:
      "n1": "The two inside it is the same as in बावन्न (bāvanna), 52, and बासष्ठ (bāsaṣṭha), 62, and is not दोन (don); 32 is बत्तीस (battis)."
  "mr-0299":
    native: "23, twenty-three"
    notes:
      "n1": "The three inside it is the same as in तेहतीस (tehtis), 33, but 43 is त्रेचाळीस (trecāḷis)."
  "mr-0300":
    native: "24, twenty-four"
    notes:
      "n1": "Four has the same shape in चोपन्न (copanna), 54, but 34 is चौतीस (cautis) and 44 is चव्वेचाळीस (cavvecāḷis)."
  "mr-0301":
    native: "25, twenty-five"
    notes:
      "n1": "Five is easy to see here, as in पंचावन्न (pañcāvanna), 55, but 35 is पस्तीस (pastis) and 65 is पासष्ठ (pāsaṣṭha)."
  "mr-0302":
    native: "26, twenty-six"
    notes:
      "n1": "Six is blended in with a doubled व (vv), not said as सहा (sahā). 36 is छत्तीस (chattis) and 56 is छप्पन्न (chappanna)."
  "mr-0303":
    native: "27, twenty-seven"
    notes:
      "n1": "Seven has the same shape in सत्तावन्न (sattāvanna), 57, but 37 is सदतीस (sadtis)."
  "mr-0304":
    native: "28, twenty-eight"
    notes:
      "n1": "Eight has a doubled ठ्ठ (ṭṭh), as in अठ्ठावन्न (aṭṭhāvanna), 58, but 38 is अडतीस (aḍtis)."
  "mr-0305":
    native: "29, twenty-nine"
    notes:
      "n1": "It is built on तीस (tis), 30, not on वीस (vis), 20: 'one less than thirty'. Same with एकोणचाळीस (ekoṇcāḷis), 39."
  "mr-0306":
    native: "31, thirty-one"
    notes:
      "n1": "One is the plain एक (ek) here, as in एकवीस (ekvis), 21, but 41 is एक्केचाळीस (ekkecāḷis), with a doubled क (kk)."
  "mr-0307":
    native: "32, thirty-two"
    notes:
      "n1": "Two is blended in, not दोन (don); compare बावीस (bāvis), 22, and बेचाळीस (becāḷis), 42. Each ten shapes it a little differently."
  "mr-0308":
    native: "33, thirty-three"
    notes:
      "n1": "Three has an ह (h) here, where 23 has a व (v): तेवीस (tevis)."
  "mr-0309":
    native: "34, thirty-four"
    notes:
      "n1": "Four has the same shape in चौसष्ठ (causaṣṭha), 64, and चौदा (caudā), 14, but 24 is चोवीस (covis)."
  "mr-0310":
    native: "35, thirty-five"
    notes:
      "n1": "Five is short here, unlike पंचवीस (pañcvis), 25, and पंचेचाळीस (pañcecāḷis), 45."
  "mr-0311":
    native: "36, thirty-six"
    notes:
      "n1": "Six starts with छ (cha) here and in छप्पन्न (chappanna), 56, but 26 is सव्वीस (savvis) and 66 is सहासष्ठ (sahāsaṣṭha)."
  "mr-0312":
    native: "37, thirty-seven"
    notes:
      "n1": "Seven is blended in with द (d); compare सदुसष्ठ (sadusaṣṭha), 67, and सत्तावीस (sattāvis), 27."
  "mr-0313":
    native: "38, thirty-eight"
    notes:
      "n1": "Eight is blended in with ड (ḍ); compare अडुसष्ठ (aḍusaṣṭha), 68, but 28 is अठ्ठावीस (aṭṭhāvis)."
  "mr-0314":
    native: "39, thirty-nine"
    notes:
      "n1": "It is built on चाळीस (cāḷis), 40, not on तीस (tis), 30: 'one less than forty'."
  "mr-0315":
    native: "41, forty-one"
    notes:
      "n1": "One is blended in with a doubled क (kk), unlike the plain एकतीस (ektis), 31."
  "mr-0316":
    native: "42, forty-two"
    notes:
      "n1": "Two is blended in, not दोन (don), as in बावीस (bāvis), 22, and बत्तीस (battis), 32."
  "mr-0317":
    native: "43, forty-three"
    notes:
      "n1": "Three has the same shape in त्रेपन्न (trepanna), 53, and त्रेसष्ठ (tresaṣṭha), 63, but 23 is तेवीस (tevis)."
  "mr-0318":
    native: "44, forty-four"
    notes:
      "n1": "Four has a doubled व (vv) here; 34 is चौतीस (cautis) and 54 is चोपन्न (copanna)."
  "mr-0319":
    native: "45, forty-five"
    notes:
      "n1": "Five is easy to see here, as in पंचवीस (pañcvis), 25, but 35 is पस्तीस (pastis)."
  "mr-0320":
    native: "46, forty-six"
    notes:
      "n1": "Six changes shape in each ten: 26 is सव्वीस (savvis), 36 is छत्तीस (chattis), 56 is छप्पन्न (chappanna)."
  "mr-0321":
    native: "47, forty-seven"
    notes:
      "n1": "Seven has a doubled त्त (tt), as in सत्तावीस (sattāvis), 27, and सत्तावन्न (sattāvanna), 57; 37 is सदतीस (sadtis)."
  "mr-0322":
    native: "48, forty-eight"
    notes:
      "n1": "Eight has a doubled ठ्ठ (ṭṭh), as in अठ्ठावीस (aṭṭhāvis), 28; 38 is अडतीस (aḍtis)."
  "mr-0323":
    native: "49, forty-nine"
    notes:
      "n1": "Built on the whole of पन्नास (pannās), 50, 'one less than fifty'; from 51 to 58 the fifty is shortened, as in बावन्न (bāvanna), 52."
  "mr-0324":
    native: "51, fifty-one"
    notes:
      "n1": "From 51 to 58 पन्नास (pannās), 50, is shortened. The one has a doubled क्क (kk), as in एक्केचाळीस (ekkecāḷis), 41."
  "mr-0325":
    native: "52, fifty-two"
    notes:
      "n1": "Two has the same shape in बावीस (bāvis), 22, and बासष्ठ (bāsaṣṭha), 62, not दोन (don)."
  "mr-0326":
    native: "53, fifty-three"
    notes:
      "n1": "Three has the same shape in त्रेचाळीस (trecāḷis), 43, and त्रेसष्ठ (tresaṣṭha), 63."
  "mr-0327":
    native: "54, fifty-four"
    notes:
      "n1": "Four has the same shape in चोवीस (covis), 24; 44 is चव्वेचाळीस (cavvecāḷis)."
  "mr-0328":
    native: "55, fifty-five"
    notes:
      "n1": "Five is easy to see here, as in पंचवीस (pañcvis), 25, and पंचेचाळीस (pañcecāḷis), 45."
  "mr-0329":
    native: "56, fifty-six"
    notes:
      "n1": "Six starts with छ (cha) and has a doubled प्प (pp); compare छत्तीस (chattis), 36."
  "mr-0330":
    native: "57, fifty-seven"
    notes:
      "n1": "Seven has the same shape in सत्तावीस (sattāvis), 27; 37 is सदतीस (sadtis)."
  "mr-0331":
    native: "58, fifty-eight"
    notes:
      "n1": "Eight has the same shape in अठ्ठावीस (aṭṭhāvis), 28; 38 is अडतीस (aḍtis)."
  "mr-0332":
    native: "59, fifty-nine"
    notes:
      "n1": "It is built on साठ (sāṭh), 60, not on पन्नास (pannās), 50: 'one less than sixty'."
  "mr-0333":
    native: "61, sixty-one"
    notes:
      "n1": "The sixties end in -सष्ठ (-saṣṭh), also printed -सष्ट (-saṣṭ)."
  "mr-0334":
    native: "62, sixty-two"
    notes:
      "n1": "Sixty is सष्ठ (saṣṭh) here, as in एकसष्ठ (eksaṣṭha), 61. The two is the same as in बावन्न (bāvanna), 52."
  "mr-0335":
    native: "63, sixty-three"
    notes:
      "n1": "Three has the same shape in त्रेचाळीस (trecāḷis), 43, and त्रेपन्न (trepanna), 53."
  "mr-0336":
    native: "64, sixty-four"
    notes:
      "n1": "Four has the same shape in चौतीस (cautis), 34."
  "mr-0337":
    native: "65, sixty-five"
    notes:
      "n1": "Five is short here, as in पस्तीस (pastis), 35, not the longer form of पंचवीस (pañcvis), 25."
  "mr-0338":
    native: "66, sixty-six"
    notes:
      "n1": "Six is the full सहा (sahā) here, unlike छत्तीस (chattis), 36, and सेहेचाळीस (sehecāḷis), 46."
  "mr-0339":
    native: "67, sixty-seven"
    notes:
      "n1": "Seven is blended in with द (d), as in सदतीस (sadtis), 37."
  "mr-0340":
    native: "68, sixty-eight"
    notes:
      "n1": "Eight is blended in with ड (ḍ), as in अडतीस (aḍtis), 38."
  "mr-0341":
    native: "69, sixty-nine"
    notes:
      "n1": "It is built on सत्तर (sattar), 70, 'one less than seventy'."
  "mr-0342":
    native: "71, seventy-one"
    notes:
      "n1": "The one has a doubled क्क (kk), as in एक्कावन्न (ekkāvanna), 51; seventy is हत्तर (hattar) here."
  "mr-0343":
    native: "72, seventy-two"
    notes:
      "n1": "Two has the same shape as in बावन्न (bāvanna), 52, and बासष्ठ (bāsaṣṭha), 62; seventy is हत्तर (hattar) here."
  "mr-0344":
    native: "73, seventy-three"
    notes:
      "n1": "Three has the same shape in त्र्याऐंशी (tryāaiṁśi), 83, and त्र्याण्णव (tryāṇṇav), 93; 43 is त्रेचाळीस (trecāḷis)."
  "mr-0345":
    native: "74, seventy-four"
    notes:
      "n1": "With the eyelash r, ऱ्या (ryā)."
  "mr-0346":
    native: "75, seventy-five"
    notes:
      "n1": "Five has the same shape in पंच्याऐंशी (pañcyāaiṁśi), 85, and पंच्याण्णव (pañcyāṇṇav), 95."
  "mr-0347":
    native: "76, seventy-six"
    notes:
      "n1": "Six has the same shape in शहाऐंशी (śahāaiṁśi), 86, and शहाण्णव (śahāṇṇav), 96."
  "mr-0348":
    native: "77, seventy-seven"
    notes:
      "n1": "Compare the seven in सत्त्याऐंशी (sattyāaiṁśi), 87, which is spelled with a longer conjunct."
  "mr-0349":
    native: "78, seventy-eight"
    notes:
      "n1": "Eight has the same shape in अठ्ठ्याऐंशी (aṭṭhyāaiṁśi), 88, and अठ्ठ्याण्णव (aṭṭhyāṇṇav), 98."
  "mr-0350":
    native: "79, seventy-nine"
    notes:
      "n1": "Built on ऐंशी (aiṁśi), 80, 'one less than eighty'."
  "mr-0351":
    native: "81, eighty-one"
    notes:
      "n1": "One has the same shape in एक्याण्णव (ekyāṇṇav), 91; eighty is ऐंशी (aiṁśi) here, as in 80."
  "mr-0352":
    native: "82, eighty-two"
    notes:
      "n1": "Two has the same shape in ब्याण्णव (byāṇṇav), 92; 72 is बाहत्तर (bāhattar)."
  "mr-0353":
    native: "83, eighty-three"
    notes:
      "n1": "Three has the same shape in त्र्याहत्तर (tryāhattar), 73."
  "mr-0354":
    native: "84, eighty-four"
    notes:
      "n1": "Four is the same as in चौऱ्याहत्तर (cauryāhattar), 74, and चौऱ्याण्णव (cauryāṇṇav), 94; the eyelash r (ऱ) is easy to miss."
  "mr-0355":
    native: "85, eighty-five"
    notes:
      "n1": "Five has the same shape in पंच्याहत्तर (pañcyāhattar), 75."
  "mr-0356":
    native: "86, eighty-six"
    notes:
      "n1": "Six has the same shape in शहात्तर (śahāttar), 76."
  "mr-0357":
    native: "87, eighty-seven"
    notes:
      "n1": "Seven has the same shape in सत्त्याण्णव (sattyāṇṇav), 97; 77 is spelled सत्याहत्तर (satyāhattar), with a shorter conjunct."
  "mr-0358":
    native: "88, eighty-eight"
    notes:
      "n1": "Eight has the same shape in अठ्ठ्याहत्तर (aṭṭhyāhattar), 78."
  "mr-0359":
    native: "89, eighty-nine"
    notes:
      "n1": "Built on नव्वद (navvad), 90, 'one less than ninety'."
  "mr-0360":
    native: "91, ninety-one"
    notes:
      "n1": "The one is the same as in एक्याऐंशी (ekyāaiṁśi), 81; ninety is ण्णव (ṇṇav) in 91 to 98."
  "mr-0361":
    native: "92, ninety-two"
    notes:
      "n1": "Two has the same shape in ब्याऐंशी (byāaiṁśi), 82."
  "mr-0362":
    native: "93, ninety-three"
    notes:
      "n1": "Three has the same shape in त्र्याऐंशी (tryāaiṁśi), 83."
  "mr-0363":
    native: "94, ninety-four"
    notes:
      "n1": "Four is the same as in चौऱ्याऐंशी (cauryāaiṁśi), 84; the eyelash r (ऱ) is easy to miss."
  "mr-0364":
    native: "95, ninety-five"
    notes:
      "n1": "Five has the same shape in पंच्याऐंशी (pañcyāaiṁśi), 85."
  "mr-0365":
    native: "96, ninety-six"
    notes:
      "n1": "Six has the same shape in शहाऐंशी (śahāaiṁśi), 86."
  "mr-0366":
    native: "97, ninety-seven"
    notes:
      "n1": "Seven has the same shape in सत्त्याऐंशी (sattyāaiṁśi), 87."
  "mr-0367":
    native: "98, ninety-eight"
    notes:
      "n1": "Eight has the same shape in अठ्ठ्याऐंशी (aṭṭhyāaiṁśi), 88."
  "mr-0368":
    native: "99, ninety-nine"
    notes:
      "n1": "The last two-digit number: it is the 90s ending, as in अठ्ठ्याण्णव (aṭṭhyāṇṇav), 98, with nine blended in, and is not said as नऊ (nau) with नव्वद (navvad)."
