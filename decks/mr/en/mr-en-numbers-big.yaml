schema: 1
id: "mr-en-numbers-big"
kind: "layer"
core: "mr-numbers-big"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Tens and big numbers"
license: "CC0-1.0"
description: "Every number from 21 to 99, the hundreds, a thousand, lakh and crore, and the quarters and halves every market uses. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0272":
    native: "30, thirty"
    notes:
      "n1": "Every number from 21 to 99 has its own word in Marathi, as in Hindi: 26 is सव्वीस (savvis), not 'twenty six'. This deck teaches every one."
  "mr-0273":
    native: "40, forty"
    notes:
      "n1": "With the curled-back ळ (ḷa)."
  "mr-0274":
    native: "50, fifty"
  "mr-0275":
    native: "60, sixty"
  "mr-0276":
    native: "70, seventy"
  "mr-0277":
    native: "80, eighty"
  "mr-0278":
    native: "90, ninety"
  "mr-0279":
    native: "100, a hundred"
    notes:
      "n1": "A hundred on its own. After a number, 'hundred' is -शे (-śe), written as one word with it: दोनशे (donśe), 200."
  "mr-0280":
    native: "one hundred (with more after it)"
    notes:
      "n1": "Before more digits a hundred is एकशे (ekśe): एकशे वीस (ekśe vis), 120. Many prices are said in hundreds: अकराशे (akrāśe), eleven hundred, 1,100."
  "mr-0281":
    native: "200, two hundred"
  "mr-0282":
    native: "300, three hundred"
  "mr-0283":
    native: "400, four hundred"
  "mr-0284":
    native: "500, five hundred"
    notes:
      "n1": "पाचशेची नोट (pācśeci noṭ), a 500-rupee note."
  "mr-0285":
    native: "600, six hundred"
  "mr-0286":
    native: "700, seven hundred"
  "mr-0287":
    native: "800, eight hundred"
  "mr-0288":
    native: "900, nine hundred"
  "mr-0289":
    native: "1,000, a thousand"
    notes:
      "n1": "दोन हजार पंचवीस (don hajār pañcvis), 2025. Marathi writes it without the dot below that Hindi puts in हज़ार (hazār)."
  "mr-0290":
    native: "1,00,000, a lakh (a hundred thousand)"
    notes:
      "n1": "Indian numbering counts in lakhs and crores, and places its commas to match: 1,00,000 is one lakh, 10,00,000 ten lakh. Prices, salaries and populations are all given this way."
  "mr-0291":
    native: "1,00,00,000, a crore (ten million)"
    notes:
      "n1": "A hundred lakh."
  "mr-0292":
    native: "1¼; and a quarter"
    notes:
      "n1": "Before another number, a quarter more: सव्वादोन (savvādon), 2¼, and on the clock 2:15. सव्वाशे (savvāśe) is 125."
  "mr-0293":
    native: "1½, one and a half"
    notes:
      "n1": "With शे (śe) and हजार (hajār) too: दीडशे (diḍśe) is 150, दीड हजार (diḍ hajār) 1,500. On the clock, दीड वाजता (diḍ vājtā) is at 1:30. Heard constantly in markets."
  "mr-0294":
    native: "2½, two and a half"
    notes:
      "n1": "अडीचशे (aḍicśe) is 250, and अडीच वाजता (aḍic vājtā) at 2:30. From 3½ on, Marathi says साडे (sāḍe)."
  "mr-0295":
    native: "and a half (from 3½ on)"
    notes:
      "n1": "Joined to the number: साडेतीन (sāḍetin), 3½; साडेतीनशे (sāḍetinśe), 350; साडेचार वाजता (sāḍecār vājtā), at 4:30."
  "mr-0296":
    native: "a quarter less"
    notes:
      "n1": "Joined to the number: पावणेदोन (pāvṇedon), 1¾; पावणेपाच वाजता (pāvṇepāc vājtā), at a quarter to five."
  "mr-0297":
    native: "21, twenty-one"
    notes:
      "n1": "Each number from 21 to 99 is one word, the unit blended into the ten, often irregularly: learn them as words. Before each ten comes एकोण- (ekoṇ-), 'one less': एकोणतीस (ekoṇtis), 29."
