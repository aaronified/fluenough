schema: 1
id: "mr-en-cinema"
kind: "layer"
core: "mr-cinema"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Cinema"
description: "Going to the cinema and the theatre: films, actors and directors, the story and the songs, and how to say what you thought of a film. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-1522":
    native: "film, movie"
    notes:
      "n1": "{1} is a film. In everyday talk it is called सिनेमा (sinemā)."
    examples:
      "हा चित्रपट खूप आवडला.": "I liked this film very much."
      "नवीन चित्रपट कधी येतो?": { native: "When does the new film come out?", bases: { "नवीन": "new" } }
  "mr-1523":
    native: "cinema hall"
    notes:
      "n1": "{1} is a cinema hall where films are shown."
    examples:
      "सिनेमागृह मोठं आहे.": { native: "The cinema hall is big.", bases: { "आहे": "to be" } }
      "सिनेमागृहात खूप गर्दी होती.": { native: "There was a big crowd in the cinema hall.", bases: { "गर्दी": "crowd", "होती": "to be", "सिनेमागृहात": "cinema hall" } }
  "mr-1524":
    native: "play, drama"
    notes:
      "n1": "{1} is a play or a drama performed on stage."
    examples:
      "आम्ही नाटक पाहिलं.": "We watched a play."
      "नाटक रंगभूमीवर सादर झालं.": { native: "The play was staged on the stage.", bases: { "रंगभूमीवर": "on the stage", "सादर": "staged", "झालं": "to become" } }
  "mr-1525":
    native: "actor"
    notes:
      "n1": "{1} is an actor. The actress is अभिनेत्री (abhinetrī)."
    examples:
      "तो चांगला अभिनेता आहे.": { native: "He is a good actor.", bases: { "आहे": "to be" } }
      "अभिनेत्याने चांगलं काम केलं.": { native: "The actor did a good job.", bases: { "अभिनेत्याने": "actor" } }
  "mr-1526":
    native: "actress"
    notes:
      "n1": "{1} is an actress."
    examples:
      "ती प्रसिद्ध अभिनेत्री आहे.": { native: "She is a famous actress.", bases: { "प्रसिद्ध": "famous", "आहे": "to be" } }
      "अभिनेत्रीचा अभिनय सुंदर होता.": { native: "The actress's acting was beautiful.", bases: { "होता": "to be", "अभिनेत्रीचा": "actress" } }
  "mr-1527":
    native: "director"
    notes:
      "n1": "{1} is a film director."
    examples:
      "दिग्दर्शकाने नवीन चित्रपट बनवला.": { native: "The director made a new film.", bases: { "नवीन": "new", "दिग्दर्शकाने": "director" } }
      "दिग्दर्शक मुलाखत देत होते.": { native: "The director was giving an interview.", bases: { "होते": "to be" } }
  "mr-1528":
    native: "story, plot"
    notes:
      "n1": "{1} is a story."
    examples:
      "या चित्रपटाची कथा सुंदर आहे.": { native: "The story of this film is beautiful.", bases: { "आहे": "to be" } }
      "आजी रोज कथा सांगते.": "Grandmother tells a story every day."
  "mr-1529":
    native: "plot of a story"
    notes:
      "n1": "{1} is the plot of a film or a book, its sequence of events."
    examples:
      "कथानक थोडं कंटाळवाणं होतं.": { native: "The plot was a bit boring.", bases: { "कंटाळवाणं": "boring", "होतं": "to be", "थोडं": "a little" } }
      "कथानक अचानक बदललं.": { native: "The plot changed suddenly.", bases: { "अचानक": "suddenly" } }
  "mr-1530":
    native: "hero (male lead)"
    notes:
      "n1": "{1} is the male hero of a film. The female hero is नायिका (nāyikā)."
    examples:
      "चित्रपटाचा नायक खूप देखणा आहे.": { native: "The hero of the film is very handsome.", bases: { "देखणा": "handsome", "आहे": "to be" } }
      "नायकाचा डायलॉग गाजला.": { native: "The hero's dialogue became famous.", bases: { "डायलॉग": "dialogue", "गाजला": "to become famous", "नायकाचा": "hero (male lead)" } }
  "mr-1531":
    native: "villain"
    notes:
      "n1": "{1} is the villain of a film."
    examples:
      "खलनायकाला सगळे घाबरतात.": { native: "Everyone fears the villain.", bases: { "खलनायकाला": "villain" } }
      "तो या चित्रपटात खलनायक आहे.": { native: "He is the villain in this film.", bases: { "आहे": "to be" } }
  "mr-1532":
    native: "comic, funny"
    notes:
      "n1": "{1} describes a film or a person that makes people laugh."
    examples:
      "हा विनोदी चित्रपट आहे.": { native: "This is a comedy film.", bases: { "आहे": "to be" } }
      "त्याचा विनोदी स्वभाव आवडतो.": { native: "I like his funny nature.", bases: { "स्वभाव": "nature" } }
  "mr-1533":
    native: "romantic"
    notes:
      "n1": "{1} describes a film or story about love, a loanword from English."
    examples:
      "हा रोमँटिक सिनेमा आहे.": { native: "This is a romantic film.", bases: { "आहे": "to be" } }
      "गाणी फार रोमँटिक होती.": { native: "The songs were very romantic.", bases: { "होती": "to be", "फार": "very" } }
  "mr-1534":
    native: "horror film"
    notes:
      "n1": "{1} is a horror film, the film that makes you afraid."
    examples:
      "भयपट बघायला मला भीती वाटते.": { native: "I am afraid to watch horror films.", bases: { "बघायला": "to watch", "वाटते": "to feel" } }
      "भयपट रात्री पाहिला.": "I watched a horror film at night."
  "mr-1535":
    native: "song"
    notes:
      "n1": "{1} is a song."
    examples:
      "हे गाणं खूप गोड आहे.": { native: "This song is very sweet.", bases: { "आहे": "to be" } }
      "गाणं ऐकत होतो.": { native: "I was listening to a song.", bases: { "होतो": "to be" } }
  "mr-1536":
    native: "composer, music director"
    notes:
      "n1": "{1} is a composer or music director of a film."
    examples:
      "संगीतकाराने सुंदर चाल दिली.": { native: "The composer gave a beautiful tune.", bases: { "चाल": "tune", "संगीतकाराने": "composer, music director" } }
      "हे गाणं कोणी संगीतबद्ध केलं?": { native: "Who composed this song?", bases: { "संगीतबद्ध": "composed" } }
  "mr-1537":
    native: "playback singer"
    notes:
      "n1": "{1} is a singer who sings the songs for an actor in a film."
    examples:
      "पार्श्वगायकाने गाणं गायलं.": { native: "The playback singer sang the song.", bases: { "गायलं": "to sing", "पार्श्वगायकाने": "playback singer" } }
      "हा पार्श्वगायक खूप लोकप्रिय आहे.": { native: "This playback singer is very popular.", bases: { "लोकप्रिय": "popular", "आहे": "to be" } }
  "mr-1538":
    native: "screen, curtain"
    notes:
      "n1": "{1} is a screen in a cinema or a stage curtain."
    examples:
      "पडद्यावर चित्रपट दिसतो.": { native: "The film appears on the screen.", bases: { "दिसतो": "to appear", "पडद्यावर": "screen, curtain" } }
      "पडदा उघडला.": "The curtain opened."
  "mr-1539":
    native: "audience, spectator"
    notes:
      "n1": "{1} is an audience or a spectator."
    examples:
      "प्रेक्षकांनी टाळ्या वाजवल्या.": { native: "The audience clapped.", bases: { "टाळ्या": "claps", "वाजवल्या": "to play", "प्रेक्षकांनी": "audience, spectator" } }
      "प्रेक्षक हसत होते.": { native: "The audience was laughing.", bases: { "होते": "to be" } }
  "mr-1540":
    native: "dialogue"
    notes:
      "n1": "{1} is a dialogue, the words the actors speak to each other."
    examples:
      "संवाद खूप मजेदार होते.": { native: "The dialogues were very funny.", bases: { "मजेदार": "funny", "होते": "to be" } }
      "त्या संवादाची चर्चा झाली.": { native: "That dialogue was discussed.", bases: { "चर्चा": "discussion", "झाली": "to become", "संवादाची": "dialogue" } }
  "mr-1541":
    native: "serial, TV series"
    notes:
      "n1": "{1} is a serial or a TV series."
    examples:
      "ही मालिका रोज रात्री असते.": { native: "This serial is on every night.", bases: { "असते": "to be" } }
      "मालिका पाहत बसलो.": { native: "I sat watching the serial.", bases: { "बसलो": "to sit" } }
  "mr-1542":
    native: "acting"
    notes:
      "n1": "{1} is acting, the art of an actor."
    examples:
      "त्याचा अभिनय चांगला होता.": { native: "His acting was good.", bases: { "होता": "to be" } }
      "अभिनयाचा सराव करतो.": { native: "I practise acting.", bases: { "अभिनयाचा": "acting" } }
  "mr-1543":
    native: "to act"
    notes:
      "n1": "{1} is acting in a film or on stage."
    examples:
      "ती नाटकात अभिनय करते.": "She acts in plays."
      "त्याने चित्रपटात अभिनय केला.": "He acted in the film."
  "mr-1544":
    native: "to release (a film)"
    notes:
      "n1": "{1} is releasing a film for people to see."
    bases:
      "प्रदर्शित": "released"
    examples:
      "हा चित्रपट उद्या प्रदर्शित होणार आहे.": { native: "This film will be released tomorrow.", bases: { "होणार": "to be", "आहे": "to be", "प्रदर्शित": "released" } }
      "त्यांनी नवा चित्रपट प्रदर्शित केला.": { native: "They released a new film.", bases: { "नवा": "new", "प्रदर्शित": "released" } }
