name: "Present: what you usually do"
license: "CC0-1.0"
description: "I go, she lives, they speak: habits and facts, by person and gender. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "Present habitual"
  slot_name: "person and gender"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "jaane": "to go"
    "karne": "to do"
    "raahne": "to live; to stay"
    "bolne": "to speak"
  notes: "The stem, then -त- (-ta-), then an ending that agrees with the doer: -तो (-to) for he, -ते (-te) shared by she and it, -तात (-tāt) for more than one. With मी (mi) and तू (tu) the speaker's or listener's gender shows: a man says मी जातो (mi jāto), a woman मी जाते (mi jāte). आम्ही (āmhi) takes -तो (-to) whoever speaks, and तुम्ही (tumhi) takes -ता (-tā), for one person or many. This tense is for habits and facts: मी रोज चहा पितो (mi roj cahā pito), I drink tea every day. For what is happening now, see the present continuous."
