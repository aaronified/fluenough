schema: 1
id: "mr-en-transport"
kind: "layer"
core: "mr-transport"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bus, auto, cab"
license: "CC-BY-SA-4.0"
description: "Getting a ride, agreeing the fare and getting off where you want. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0420":
    native: "auto-rickshaw"
    notes:
      "n1": "Feminine: रिक्षा आली (rikṣā āli), the rickshaw has come. In Pune and Mumbai's suburbs they run on the meter."
    "examples": {
      "रिक्षाचं भाडं किती?": {"native": "What is the rickshaw fare?", "bases": {"किती": "how much", "रिक्षाचं": "auto-rickshaw"}}
    }
  "mr-0421":
    native: "taxi"
  "mr-0052":
    native: "bus"
    notes:
      "n1": "Feminine: बस आली (bas āli). A state-run bus between towns is the एसटी (esṭi), and a city bus in Mumbai is a बेस्ट (besṭ)."
  "mr-0422":
    native: "station"
    notes:
      "n1": "Formally स्थानक (sthānak), as on signs: रेल्वे स्थानक (relve sthānak), railway station."
    "examples": {
      "स्टेशनला चला.": {"native": "To the station, please.", "bases": {"स्टेशनला": "station"}},
      "स्टेशन कुठे आहे?": {"native": "Where is the station?", "bases": {"आहे": "to be"}}
    }
  "mr-0423":
    native: "ticket"
    "examples": {
      "तिकिटाचं आरक्षण झालं.": {"native": "The ticket reservation is done.", "bases": {"झालं": "to become", "तिकिटाचं": "ticket"}},
      "तिकीट बुक केलं.": {"native": "I booked the ticket.", "bases": {"बुक": "to book"}}
    }
  "mr-0424":
    native: "fare; rent"
    notes:
      "n1": "किती भाडे? (kiti bhade?), what's the fare? In speech भाडं (bhāḍam̐)."
  "mr-0425":
    native: "Go by the meter, please."
    notes:
      "n1": "-ने (-ne) is 'by': बसने (basne), by bus."
    bases:
      "मीटरने": "meter"
  "mr-0426":
    native: "Stop here, please."
    notes:
      "n1": "थांबा (thāmbā) is also 'wait': जरा थांबा (jarā thāmbā), wait a moment."
    bases:
      "इथे": "here"
      "थांबा": "to stop; to wait"
  "mr-0427":
    native: "Where do you want to go?"
    notes:
      "n1": "What the driver asks: 'where is it to go?'. असणे (asṇe) changes its stem in the present: आह- (āh-)."
    bases:
      "जायचे": "to go"
      "आहे": "to be"
  "mr-0428":
    native: "To the station, please."
    notes:
      "n1": "'Go to the station': -ला (-lā) is 'to', and चला (calā) a polite 'let's go'."
  "mr-0429":
    native: "local train (in Mumbai)"
    notes:
      "n1": "Mumbai's suburban trains. Fast trains are फास्ट (fāsṭ), stopping ones स्लो (slo)."
  "mr-0430":
    native: "car; vehicle; train"
    notes:
      "n1": "Any vehicle, and also a train or a handcart stall: वडापावची गाडी (vaḍāpāvci gāḍi), a vada pav cart."
    "examples": {
      "गाडी चिखलात अडकली.": {"native": "The car got stuck in the mud.", "bases": {"चिखलात": "in the mud", "अडकली": "to get stuck"}},
      "गाडी पार्किंगमध्ये लावा.": {"native": "Park the car in the parking.", "bases": {"लावा": "to park", "पार्किंगमध्ये": "parking"}}
    }
  "mr-0431":
    native: "airport"
    notes:
      "n1": "'Aeroplane ground': विमान (vimān), aeroplane. In speech often एअरपोर्ट (earporṭ)."
  "mr-0432":
    native: "I want to get off here."
    notes:
      "n1": "उतरणे (utrṇe), to get off; to get down. Its opposite is चढणे (caḍhṇe), to get on. असणे (asṇe) changes its stem in the present: आह- (āh-)."
    bases:
      "इथे": "here"
      "उतरायचे": "to get off"
      "आहे": "to be"
