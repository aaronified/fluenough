tags: ["unreviewed"]
cards:
  "mr-5800":
    native: "I exercise every day."
    bases: { "करतो": "do" }
    confusables: { "w1": { why: "तो (to) means he, not I: मी (mi) is I." }, "f1": { why: "करते (karte) is the feminine form, so it would say that a woman does it." } }
    notes: { "n1": "Exercise is said with व्यायाम करणे (vyāyām karṇe), a noun plus करणे (karṇe), to do." }
  "mr-5801":
    native: "Is your diet nutritious?"
    bases: { "तुमचा": "your", "आहे": "is", "का": "a question marker" }
    confusables: { "w1": { why: "नाही (nāhi) means not, which would turn the question into a negative one." }, "f1": { why: "आहेत (āhet) is for two or more; आहार (āhār) is one thing, so आहे (āhe) is used." } }
  "mr-5802":
    native: "I get good sleep at night."
    bases: { "मला": "to me", "रात्री": "at night", "चांगली": "good", "लागते": "get" }
    confusables: { "w1": { why: "रोज (roj) means every day; the sentence says at night, रात्री (rātri)." }, "f1": { why: "लागतो (lāgto) is for a masculine thing; झोप (jhop) is feminine, so लागते (lāgte) is used." } }
    notes: { "n1": "Getting sleep is said with the dative: मला (malā), to me, is the one who gets it, and झोप (jhop), sleep, is the subject." }
  "mr-5803":
    native: "My father has diabetes."
    bases: { "माझ्या": "my", "वडिलांना": "to the father", "आहे": "has" }
    confusables: { "w1": { why: "ती (ti) means she; this sentence is about a father." }, "f1": { why: "आहेत (āhet) is for two or more; मधुमेह (madhumeh) is one illness, so आहे (āhe) is used." } }
    notes: { "n1": "Having an illness is said with the dative: वडिलांना (vaḍilānnā), to the father, and मधुमेह (madhumeh), diabetes, is the subject of आहे (āhe)." }
  "mr-5804":
    native: "The doctor told me to exercise."
    bases: { "डॉक्टरांनी": "the doctor", "मला": "me", "करायला": "to do", "सांगितले": "told" }
    confusables: { "w1": { why: "तू (tu) means you; the doctor told मला (malā), so the listener is not the one told." }, "w2": { why: "आता (ātā) means now; the advice was given in the past." } }
  "mr-5805":
    native: "Smoking is bad for health."
    bases: { "आरोग्यासाठी": "for health", "आहे": "is" }
    confusables: { "w1": { why: "चांगले (cāṅgale) means good, the opposite of वाईट (vāiṭ)." }, "w2": { why: "नाही (nāhi) means not, which would reverse the sentence." } }
    notes: { "n1": "'For health' is आरोग्यासाठी (ārogyāsāṭhi): -साठी (-sāṭhi), 'for', comes after the noun's oblique form, not its plain form." }
  "mr-5806":
    native: "I got the vaccine."
    bases: { "घेतली": "got" }
    confusables: { "w1": { why: "तो (to) means he, not I." }, "f1": { why: "घेतला (ghetlā) is masculine; लस (las) is feminine, so घेतली (ghetli) is used." } }
    notes: { "n1": "Getting a vaccine is said with लस घेणे (las gheṇe), a noun plus घेणे (gheṇe), to take." }
  "mr-5807":
    native: "Is there a treatment for this disease?"
    bases: { "या": "this", "आजारावर": "for this disease", "आहे": "is", "का": "a question marker" }
    confusables: { "w1": { why: "कधी (kadhi) asks when, not whether there is a treatment." }, "f1": { why: "आहेत (āhet) is plural; उपचार (upcār) is one thing, so आहे (āhe) is used." } }
  "mr-5808":
    native: "I know first aid."
    bases: { "मला": "to me", "माहीत": "known; aware of", "आहे": "is" }
    confusables: { "w1": { why: "नाही (nāhi) means not, which would reverse the meaning." }, "f1": { why: "आहेत (āhet) is plural, but the subject here is one person, so आहे (āhe) is used." } }
    notes: { "n1": "Knowing is said with माहीत (māhit), known, and आहे (āhe): मला माहीत आहे (malā māhit āhe) is 'I know'." }
  "mr-5809":
    native: "Take care."
    bases: { "घ्या": "take (polite)" }
    confusables: { "w1": { why: "नाही (nāhi) means not; the sentence is a polite command." }, "f1": { why: "घे (ghe) is the command for one person you know well; घ्या (ghyā) is polite." } }
    notes: { "n1": "Take care is काळजी घ्या (kāḷji ghyā): घ्या (ghyā) is the polite command of घेणे (gheṇe), to take, while the friend form is घे (ghe)." }
  "mr-5810":
    native: "He will recover soon."
    bases: { "होईल": "will become" }
    confusables: { "w1": { why: "आता (ātā) means now; लवकर (lavkar) means soon." }, "f1": { why: "होतो (hoto) is the past tense, not the future." }, "w2": { why: "ती (ti) means she; the sentence is about a man." } }
    notes: { "n1": "Getting well is said with बरा होणे (barā hoṇe), 'to become well', with होणे (hoṇe), to become." }
  "mr-5811":
    native: "Eat food that has vitamins."
    bases: { "असलेले": "that has", "अन्न": "food", "खा": "eat" }
    confusables: { "w1": { why: "इथे (ithe) means here; the sentence is about food." }, "f1": { why: "असलेली (asleli) is feminine; अन्न (anna) is neuter, so असलेले (aslele) is used." } }
    notes: { "n1": "The relative phrase comes before its noun: जीवनसत्त्व असलेले (jivansattva aslele), having vitamins, stands before अन्न (anna), food." }
