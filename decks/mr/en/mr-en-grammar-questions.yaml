schema: 1
id: "mr-en-grammar-questions"
kind: "layer"
core: "mr-grammar-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Basic questions"
license: "CC0-1.0"
description: "Yes-or-no questions with का (kā) at the end, and question words in the middle, before the verb. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0181":
    native: "Do you speak Marathi?"
    notes:
      "n1": "A yes-or-no question: the statement with का (kā) at the end."
    bases:
      "मराठी": "Marathi"
      "बोलता": "to speak"
  "mr-0182":
    native: "What is your name?"
    notes:
      "n1": "The question word stands where the answer would: माझे नाव अनिता आहे (mājhe nāv anitā āhe), my name is Anita. असणे (asṇe) changes its stem in the present: आह- (āh-)."
    bases:
      "तुमचे": "your"
      "आहे": "to be"
  "mr-0183":
    native: "Where do you live?"
    bases:
      "राहता": "to live; to stay"
  "mr-0184":
    native: "What time is it?"
    notes:
      "n1": "Literally 'how many have struck?', of the clock."
    bases:
      "वाजले": "to strike (the hour); to be felt (cold)"
  "mr-0185":
    native: "Who is this? (a man)"
    notes:
      "n1": "Of a woman: ही कोण आहे? (hi kon ahe?). असणे (asṇe) changes its stem in the present: आह- (āh-)."
    bases:
      "हा": "this"
      "आहे": "to be"
  "mr-0186":
    native: "When will the bus come?"
    bases:
      "येईल": "to come"
  "mr-0187":
    native: "Why have you come?"
    notes:
      "n1": "का (kā) in the middle, before the verb, is 'why'; at the end it only makes a question. Said bluntly, this can sound rude: कसं काय येणं केलंत? (kasa kay yena kelant?) is the gentle way. येणे (yeṇe) changes its stem in the past: आ- (ā-)."
    bases:
      "आलात": "to come"
  "mr-0188":
    native: "How much does this cost?"
    notes:
      "n1": "'Its price how much is?'. At a stall, simply हे कितीला? (he kitila?). असणे (asṇe) changes its stem in the present: आह- (āh-)."
    bases:
      "याची": "this"
      "आहे": "to be"
  "mr-0189":
    native: "Will you have some tea?"
    notes:
      "n1": "Literally 'will you take tea?'. Asked of every guest; saying no once is polite, and it will be offered again."
    bases:
      "घेणार": "to take"
  "mr-0190":
    native: "Which bus goes to the station?"
    notes:
      "n1": "कोणती (koṇti) agrees with बस (bas), which is feminine."
    bases:
      "जाते": "to go"
  "mr-0191":
    native: "Have you eaten?"
    notes:
      "n1": "Literally 'has the meal happened?', asked as a friendly greeting around mealtimes. In speech, जेवण झालं का? (jevan jhala ka?). होणे (hoṇe) changes its stem in the past: झा- (jhā-)."
    bases:
      "झाले": "to be; to become"
