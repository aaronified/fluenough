schema: 1
id: "mr-en-addressing-sentences"
kind: "layer"
core: "mr-addressing-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences for addressing people"
license: "CC-BY-SA-4.0"
description: "Short sentences that call people by family words and polite words such as अहो (aho), अरे (are) and अगं (agam̐), built from the words of Addressing people. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-5022":
    native: "Excuse me, sir, come here."
    bases: { "अहो": "excuse me", "साहेब": "sir", "इथे": "here", "या": "come" }
    confusables: { "w1": { why: "There, not here: तिथे (tithe) means there." }, "w2": { why: "Go: जा (jā) means go, the opposite of come, या (yā)." } }
    notes: { "n1": "या (yā), come, is the polite order of येणे (yeṇe): the friend form is ये (ye), and the stem changes to या (yā) for a polite you." }
  "mr-5023":
    native: "Hey brother, come here."
    bases: { "अरे": "hey", "दादा": "brother", "इथे": "here", "ये": "come" }
    confusables: { "w1": { why: "Elder sister, not brother: ताई (tāi) means elder sister." }, "f1": { why: "Polite: या (yā) is the respectful form, not for a brother you know well." } }
  "mr-5024":
    native: "Hey sister, are you here?"
    bases: { "अगं": "hey", "ताई": "sister", "तू": "you", "इथे": "here", "आहेस": "are", "का": "a question marker" }
    confusables: { "w1": { why: "Said to a man or boy: अरे (are) is for a man, so अगं (agam̐) is used with a sister." }, "w2": { why: "Brother, not sister: दादा (dādā) means elder brother." } }
    notes: { "n1": "तू (tū) takes आहेस (āhes), are, while तुम्ही (tumhī) takes आहात (āhāt): the verb follows the word for you." }
  "mr-5025":
    native: "Grandmother, how are you?"
    bases: { "आजी": "grandmother", "तुम्ही": "you (polite)", "कसे": "how", "आहात": "are" }
    confusables: { "w1": { why: "Grandfather, not grandmother: आजोबा (ājobā) means grandfather." }, "f1": { why: "Informal: आहेस (āhes) is for a person you know well; तुम्ही (tumhi) takes आहात (āhāt)." } }
  "mr-5026":
    native: "Grandfather, give me some water."
    bases: { "आजोबा": "grandfather", "मला": "to me", "पाणी": "water", "द्या": "give" }
    confusables: { "w1": { why: "Grandmother, not grandfather: आजी (āji) means grandmother." }, "w2": { why: "Take: घ्या (ghyā) means take, while this sentence asks for something to be given, द्या (dyā)." } }
  "mr-5027":
    native: "Uncle, where will you go?"
    bases: { "काका": "uncle", "तुम्ही": "you (polite)", "कुठे": "where", "जाणार": "will go" }
    confusables: { "w1": { why: "Aunt, not uncle: काकू (kāku) is an aunt, a father's brother's wife." }, "w2": { why: "When, not where: कधी (kadhi)? asks when." } }
    notes: { "n1": "जाणार (jāṇār), will go, is the -णार (-ṇār) future, which does not show gender." }
  "mr-5028":
    native: "Aunt, will you have tea?"
    bases: { "काकू": "aunt", "चहा": "tea", "घेणार": "will take", "का": "a question marker" }
    confusables: { "w1": { why: "Uncle, not aunt: काका (kākā) is an uncle." }, "w2": { why: "Water, not tea: पाणी (pāṇi) means water." } }
    notes: { "n1": "घेणार (gheṇār), will take, is the -णार (-ṇār) future; का (kā) at the end makes it a yes-or-no question." }
  "mr-5029":
    native: "Auntie, how much is this?"
    bases: { "मावशी": "aunt (mother's sister)", "हे": "this", "किती": "how much", "आहे": "is" }
    confusables: { "w1": { why: "Grandmother: आजी (āji) is a grandmother, not an aunt." }, "f1": { why: "Plural: आहेत (āhet) is for several things; this is one thing, so आहे (āhe) is used." } }
  "mr-5030":
    native: "Madam, sit here."
    bases: { "मॅडम": "madam", "इथे": "here", "बसा": "sit" }
    confusables: { "w1": { why: "Sir, not madam: साहेब (sāheb) is used for a man." }, "w2": { why: "Standing: उभे (ubhe) means standing, but this sentence asks for sitting, बसा (basā)." } }
    notes: { "n1": "बसा (basā), sit, is the polite order: -ा (-ā) for a polite you, as with मॅडम (mêḍam), madam." }
  "mr-5031":
    native: "My grandmother lives in the village."
    bases: { "माझी": "my", "आजी": "grandmother", "गावात": "in the village", "राहते": "lives" }
    confusables: { "w1": { why: "Grandfather, not grandmother: आजोबा (ājobā) means grandfather." }, "f1": { why: "Masculine: राहतो (rāhto) goes with a man; आजी (āji) is a woman, so राहते (rāhte) is used." } }
    notes: { "n1": "गावात (gāvāt), in the village: गाव (gāv) adds -ा- (-ā-) before -त (-t), 'in', as घरात (gharāt) does." }
  "mr-5032":
    native: "The elder brother and elder sister are at home."
    bases: { "दादा": "elder brother", "आणि": "and", "ताई": "elder sister", "घरी": "at home", "आहेत": "are" }
    confusables: { "w1": { why: "Uncle: काका (kākā) is an uncle, not a brother or sister." }, "f1": { why: "Singular: आहे (āhe) is for one person; two people take आहेत (āhet)." } }
  "mr-5033":
    native: "Uncle is ill."
    bases: { "काका": "uncle", "आजारी": "ill", "आहेत": "is" }
    confusables: { "w1": { why: "Aunt, not uncle: काकू (kāku) is an aunt." }, "w2": { why: "Well: बरा (barā) means well, the opposite of ill, आजारी (ājāri)." } }
