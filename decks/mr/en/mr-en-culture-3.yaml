# Layer for mr-culture-3: each passage's English rendering (the builder's own) and a note on where it is printed.
schema: 1
id: "mr-en-culture-3"
kind: "layer"
core: "mr-culture-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: modern poets"
description: "Short passages of Marathi poems by Balkavi, Ram Ganesh Gadkari, Keshavsut and Bhaskar Ramchandra Tambe, each with its English rendering and a note. Not yet checked by a Marathi speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "mr-4100":
    native: "Give me a trumpet, and I will blow it with my own breath."
    notes:
      "n1": "The opening couplet of the poem Tutari, as printed on mr.wikisource."
  "mr-4101":
    native: "Why do you ask who we are; we are the beloved ones."
    notes:
      "n1": "The opening line of the poem Amhi Kon, as printed on mr.wikisource."
  "mr-4102":
    native: "I am a brave soldier of a new age with new energy; let us see who can bring me to heel."
    notes:
      "n1": "The opening couplet of the poem Nava Shipai, as printed on mr.wikisource."
  "mr-4103":
    native: "The night was dark, and the heart was full of regrets."
    notes:
      "n1": "The opening couplet of the poem Sataricha Bol, as printed on mr.wikisource."
  "mr-4104":
    native: "Let the cup be filled to the brim, and let the foam rise quickly."
    notes:
      "n1": "The opening line of the poem Sphurti, as printed on mr.wikisource."
  "mr-4105":
    native: "Your name is on my lips and your image is in my eyes; these restless thoughts have become steady."
    notes:
      "n1": "The opening couplet of the poem Tujhe Nam Mukhi, as printed on mr.wikisource."
  "mr-4106":
    native: "The courtyard had been swept clean and smeared with cow dung, and the morning sun spread its light over that feast for the eyes."
    notes:
      "n1": "The opening couplet of the poem Rangoli Ghaltana Pahun, as printed on mr.wikisource."
  "mr-4107":
    native: "People will say alas for a moment; when I am gone, what work will remain?"
    notes:
      "n1": "The opening couplet of the poem Jan Palbhar Mhanatil, Haay Haay, as printed on mr.wikisource."
  "mr-4108":
    native: "Green carpets of tender grass spread out, and on that lovely carpet the flower-queen was playing."
    notes:
      "n1": "The opening lines of the poem Phulrani, as printed on mr.wikisource."
  "mr-4109":
    native: "If you want love, first offer your life as a sacrifice; if you want love, take your head off and hold it in your palm."
    notes:
      "n1": "The opening couplet of the poem Preeti Havi Tar, as printed on mr.wikisource."
  "mr-4110":
    native: "Inside the dome of the mind a song keeps echoing; its meaning is unclear, and there is no rest in it."
    notes:
      "n1": "The opening lines of the poem Shunya Manacha Ghumat, as printed on mr.wikisource."
  "mr-4111":
    native: "On one bank and on the other the green spreads, and a dusky blue stream flows winding through the islands."
    notes:
      "n1": "The opening lines of the poem Audumbar, as printed on mr.wikisource."
  "mr-4112":
    native: "I do not know where this sadness comes from, and I cannot tell what is piercing the innermost depth of my heart."
    notes:
      "n1": "The opening lines of the poem Kothuni Yete Mala Kalena, as printed on mr.wikisource."
  "mr-4113":
    native: "Chirp, chirp, chirp; you over there, who are you, Kapila-Mavshi, Kapila-Mavshi, why do you break up your nest and leave?"
    notes:
      "n1": "The opening lines of the poem Gharta, as printed on mr.wikisource."
  "mr-4114":
    native: "At this frightening hour of the night, when the forest roars with dread, little bird, why are you singing, and what is your purpose?"
    notes:
      "n1": "The opening lines of the poem Ganarya Pakshyas, as printed on mr.wikisource."
  "mr-4115":
    native: "Good child, why are you awake in vain? Sleep, sleep, Shivaraya; past midnight an hour has gone by, mother, yet my eyes will not close."
    notes:
      "n1": "The opening lines of the lullaby Shivrayancha Palna, as printed on mr.wikisource, whose page names Gadkari as its author."
  "mr-4116":
    native: "To wake the world, Keshavsut went away singing; England, the land of Shelley, became his maternal home."
    notes:
      "n1": "The opening lines of the poem Keshavsut Mele?, as printed on mr.wikisource, whose page names Gadkari as its author."
  "mr-4117":
    native: "Three evenings have come, my friend, and I give you my promise: from today on you are dearer to my heart than life itself."
    notes:
      "n1": "The opening lines of the poem Teeni Sanja Sakhe, as printed on mr.wikisource."
