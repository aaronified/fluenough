description: "Short sentences that use the words of this unit. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-5525":
    native: "Let us save the environment."
    bases: { "वाचवू": "let us save" }
    confusables: { "w1": { why: "टाळणे (ṭāḷṇe) means to avoid, not to save." }, "w2": { why: "पुनर्वापर (punarvāpar) is recycling, one way to save." } }
  "mr-5526":
    native: "Save the trees."
    bases: { "वाचवा": "save (please)" }
    confusables: { "w1": { why: "जंगलतोड (jaṅgaltoḍ) is cutting down forests, the harm to avoid." }, "w2": { why: "वन्यजीव (vanyajiv) is wildlife, not trees." } }
  "mr-5527":
    native: "The air is polluted."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "प्रदूषण (praduṣaṇ) is the noun pollution, not the adjective polluted." }, "w2": { why: "हरित (harit) means green, not polluted." } }
  "mr-5528":
    native: "The dust increased."
    bases: { "वाढली": "increased" }
    confusables: { "w1": { why: "धूर (dhur) is smoke, not dust." }, "w2": { why: "कमी करणे (kami karṇe) means to reduce, the opposite of growing." } }
  "mr-5529":
    native: "There is a water shortage."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "सांडपाणी (sāṇḍapāṇi) is wastewater, not a shortage." }, "w2": { why: "पर्यावरण (paryāvaraṇ) is the environment as a whole." } }
  "mr-5530":
    native: "Stop deforestation."
    bases: { "थांबवा": "stop (please)" }
    confusables: { "w1": { why: "तापमानवाढ (tāpmānvāḍh) is global warming, a different harm." }, "w2": { why: "वाचवणे (vācavṇe) is to save, the aim of stopping it." } }
  "mr-5531":
    native: "Reduce pollution."
    bases: { "कमी": "less", "करा": "do (please)" }
    confusables: { "w1": { why: "प्रदूषित (praduṣit) is polluted, a state, not the act of reducing." }, "w2": { why: "टाळणे (ṭāḷṇe) means to avoid." } }
  "mr-5532":
    native: "Reduce the rubbish."
    bases: { "कमी": "less", "करा": "do (please)" }
    confusables: { "w1": { why: "पुनर्वापर (punarvāpar) is recycling, one way to reduce waste." }, "w2": { why: "धूर (dhur) is smoke, not waste." } }
  "mr-5533":
    native: "Protect the natural forest."
    bases: { "जपा": "protect (please)" }
    confusables: { "w1": { why: "हरित (harit) means green, not natural." }, "w2": { why: "संरक्षण (saṁrakṣaṇ) is the noun protection, not the verb to protect." } }
  "mr-5534":
    native: "Avoid smoke."
    bases: { "टाळा": "avoid (please)" }
    confusables: { "w1": { why: "धूळ (dhuḷ) is dust, not smoke." }, "w2": { why: "जपणे (japṇe) means to take care of, not to avoid." } }
  "mr-5535":
    native: "Wildlife protection is important."
    bases: { "महत्त्वाचे": "important", "आहे": "is" }
    confusables: { "w1": { why: "संवर्धन (saṁvardhan) means conservation or growth, a near word for protection." }, "w2": { why: "नैसर्गिक (naisargik) means natural, not important." } }
