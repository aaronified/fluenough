cards:
  "mr-5195": {"native": "My eye hurts.", "bases": {"माझा": "my", "दुखतो": "hurts"}, "confusables": {"w1": {"why": "They, not my eye: ते (te) means they."}, "f1": {"why": "Feminine: दुखते (dukhte) is for a feminine noun; डोळा (ḍoḷā) is masculine, so दुखतो (dukhto)."}}, "notes": {"n1": "माझा (mājhā), my, ends in -ा (-ā) because डोळा (ḍoḷā), eye, is masculine: the possessive agrees with the thing owned."}}
  "mr-5196": {"native": "He shakes his hand.", "bases": {"हलवतो": "shakes"}, "confusables": {"w1": {"why": "She, not he: ती (ti) means she."}, "f1": {"why": "Feminine: हलवते (halvte) is for a woman; the sentence has a man, so हलवतो (halvto)."}}}
  "mr-5197": {"native": "The girl's eyes are big.", "bases": {"मुलीचे": "the girl's", "डोळे": "eyes", "मोठे": "big", "आहेत": "are"}, "confusables": {"w1": {"why": "Boy, not girl: मुलगा (mulgā) means boy."}, "f1": {"why": "Feminine: मोठी (moṭhi) goes with a feminine noun; डोळे (ḍoḷe) is plural, so मोठे (moṭhe) is right."}}, "notes": {"n1": "मुलीचे (mulice), the girl's, ends in -चे (-ce) because it agrees with डोळे (ḍoḷe), eyes, which is a masculine plural."}}
  "mr-5198": {"native": "My teeth are white.", "bases": {"माझे": "my", "पांढरे": "white", "आहेत": "are"}, "confusables": {"w1": {"why": "Red, not white: लाल (lāl) means red."}, "f1": {"why": "Feminine: पांढरी (pāṇḍhari) goes with a feminine noun; दात (dāt) takes the plural पांढरे (pāṇḍhare)."}}, "notes": {"n1": "माझे (mājhe), my, ends in -े (-e) because दात (dāt), teeth, is a masculine plural noun, and the possessive takes -े (-e) before one."}}
  "mr-5199": {"native": "His hands are big.", "bases": {"त्याचे": "his", "मोठे": "big", "आहेत": "are"}, "confusables": {"w1": {"why": "He, not his: तो (to) means he."}, "f1": {"why": "Singular: आहे (āhe) is for one thing; two hands take आहेत (āhet)."}}, "notes": {"n1": "त्याचे (tyāce), his, ends in -े (-e) because हात (hāt), hands, is a masculine plural here, and the possessive takes -े (-e) before one."}}
  "mr-5200": {"native": "My tongue is red.", "bases": {"माझी": "my", "आहे": "is"}, "confusables": {"w1": {"why": "White, not red: पांढरा (pāṇḍharā) means white."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one tongue takes आहे (āhe)."}}, "notes": {"n1": "माझी (mājhi), my, ends in -ी (-ī) because जीभ (jibh), tongue, is feminine."}}
  "mr-5201": {"native": "The doctor checks the eyes.", "bases": {"डोळे": "eyes", "तपासतो": "checks"}, "confusables": {"w1": {"why": "Teacher, not doctor: शिक्षक (śikṣak) means teacher."}, "f1": {"why": "Feminine: तपासते (tapāste) is for a woman; the doctor is a man, so तपासतो (tapāsto)."}}, "notes": {"n1": "तपासतो (tapāsto), checks, agrees with the doctor डॉक्टर (ḍôkṭar), who does the checking, not with the eyes डोळे (ḍoḷe) that are checked."}}
  "mr-5202": {"native": "His nose is small.", "bases": {"त्याचे": "his", "आहे": "is"}, "confusables": {"w1": {"why": "Big, not small: मोठा (moṭhā) means big."}, "f1": {"why": "Plural: आहेत (āhet) is for more than one; one nose takes आहे (āhe)."}}, "notes": {"n1": "त्याचे (tyāce), his, ends in -े (-e) because नाक (nāk), nose, is neuter."}}
  "mr-5203": {"native": "There is hair on the head.", "bases": {"डोक्यावर": "on the head", "आहेत": "there is"}, "confusables": {"w1": {"why": "Eye, not head: डोळा (ḍoḷā) means eye."}, "f1": {"why": "Singular: आहे (āhe) is for one thing; the sentence has several hairs, so आहेत (āhet)."}}, "notes": {"n1": "डोक्यावर (ḍokyāvar), on the head, takes the oblique डोक्या (ḍokyā) of डोके (ḍoke), head, before -वर (-var), 'on'."}}
  "mr-5204": {"native": "My back hurts.", "bases": {"माझी": "my", "दुखते": "hurts"}, "confusables": {"w1": {"why": "She, not my back: ती (ti) means she."}, "f1": {"why": "Masculine: दुखतो (dukhto) goes with a masculine noun; पाठ (pāṭh) is feminine, so दुखते (dukhte) is right."}}, "notes": {"n1": "माझी (mājhi), my, ends in -ी (-ī) because पाठ (pāṭh), back, is feminine, and दुखते (dukhte) agrees with it."}}
  "mr-5205": {"native": "His teeth are good.", "bases": {"त्याचे": "his", "चांगले": "good", "आहेत": "are"}, "confusables": {"w1": {"why": "He, not his: तो (to) means he."}, "f1": {"why": "Singular: आहे (āhe) is for one thing; several teeth take आहेत (āhet)."}}, "notes": {"n1": "त्याचे (tyāce), his, ends in -े (-e) because दात (dāt), teeth, is a masculine plural noun, and the possessive takes -े (-e) before one."}}
  "mr-5206": {"native": "She shakes her head.", "bases": {"हलवते": "shakes"}, "confusables": {"w1": {"why": "They: ते (te) means they."}, "f1": {"why": "Masculine: हलवतो (halvto) is for a man; the sentence has a woman, so हलवते (halvte)."}}}
