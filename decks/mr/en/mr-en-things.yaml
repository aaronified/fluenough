schema: 1
id: "mr-en-things"
kind: "layer"
core: "mr-things"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Things around you"
license: "CC-BY-SA-4.0"
description: "Everyday objects: what you write with, carry, wear on the head, cook in and lock up. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-0835":
    native: "pen"
    notes:
      "n1": "A pen for writing: पेन्सिल (pensil), a pencil, is another writing tool."
    examples:
      "हे पेन माझे आहे.": { native: "This pen is mine.", bases: { "माझे": "my", "आहे": "to be" } }
      "माझ्याकडे एक पेन आहे.": { native: "I have a pen.", bases: { "माझ्याकडे": "I", "आहे": "to be" } }
  "mr-0836":
    native: "pencil"
    notes:
      "n1": "A pencil is used for writing: पेन्सिलीने लिहा (pensiline lihā), write with a pencil."
    examples:
      "ही पेन्सिल तुझी आहे.": { native: "This pencil is yours.", bases: { "तुझी": "your", "आहे": "to be" } }
      "मला एक पेन्सिल हवी आहे.": { native: "I want a pencil.", bases: { "मला": "I", "आहे": "to be" } }
  "mr-0837":
    native: "notebook"
    notes:
      "n1": "A notebook is वही (vahi); it is different from पुस्तक (pustak), a book."
    examples:
      "ही वही नवीन आहे.": { native: "This notebook is new.", bases: { "आहे": "to be" } }
      "तो रोज वही उघडतो.": { native: "He opens the notebook every day.", bases: { "उघडतो": "to open" } }
  "mr-0838":
    native: "paper"
    notes:
      "n1": "कागद (kāgad) is also a letter: कागदावर (kāgdāvar), on paper, as on a page."
    examples:
      "मला कागद द्या.": { native: "Give me some paper.", bases: { "मला": "I", "द्या": "to give" } }
      "तिने कागदावर लिहिले.": { native: "She wrote on the paper.", bases: { "कागदावर": "on paper", "लिहिले": "to write" } }
  "mr-0839":
    native: "file"
    notes:
      "n1": "An office file: फाईल (phāil) is kept in the ऑफिस (ôphis), the office."
    examples:
      "ही फाईल कुठे आहे?": { native: "Where is this file?", bases: { "कुठे": "where", "आहे": "to be" } }
      "ती फाईल टेबलावर ठेवते.": { native: "She puts the file on the table.", bases: { "टेबलावर": "on the table", "ठेवते": "to keep" } }
  "mr-0840":
    native: "watch; clock"
    notes:
      "n1": "घड्याळ (ghaḍyāḷ) is also a clock on the wall: भिंतीवरचे घड्याळ (bhintivrce ghaḍyāḷ), the wall clock."
    examples:
      "माझे घड्याळ बंद आहे.": { native: "My watch has stopped.", bases: { "माझे": "my", "बंद": "closed", "आहे": "to be" } }
      "घड्याळात आठ वाजले.": { native: "The clock has struck eight.", bases: { "घड्याळात": "in the clock", "वाजले": "to strike" } }
  "mr-0841":
    native: "umbrella"
    notes:
      "n1": "छत्री (chatri) is used in the rain: पाऊस आहे (pāus āhe), it is raining."
    examples:
      "पाऊस आहे, छत्री घे.": { native: "It is raining; take an umbrella.", bases: { "पाऊस": "rain", "आहे": "to be", "घे": "to take" } }
      "तो छत्री विसरला.": { native: "He forgot the umbrella.", bases: { "विसरला": "to forget" } }
  "mr-0842":
    native: "bag"
    notes:
      "n1": "A bag for a trip: बॅगेत (bêget), in the bag, is the place word."
    examples:
      "माझी बॅग जड आहे.": { native: "My bag is heavy.", bases: { "माझी": "my", "जड": "heavy", "आहे": "to be" } }
      "बॅगेत पुस्तक आहे.": { native: "There is a book in the bag.", bases: { "बॅगेत": "in the bag", "आहे": "to be" } }
  "mr-0843":
    native: "glasses"
    notes:
      "n1": "The word is used in the plural: चष्मे (caṣme), glasses; चष्मा (caṣmā) for one pair."
    examples:
      "माझा चष्मा कुठे आहे?": { native: "Where are my glasses?", bases: { "माझा": "my", "कुठे": "where", "आहे": "to be" } }
      "आजी चष्मा घालते.": { native: "Grandmother wears glasses.", bases: { "घालते": "to wear" } }
  "mr-0844":
    native: "mirror"
    notes:
      "n1": "आरसा (ārsā) is used for looking at yourself: आरशात बघणे (ārśāt baghṇe), to look in the mirror."
    examples:
      "आरसा भिंतीवर आहे.": { native: "The mirror is on the wall.", bases: { "भिंतीवर": "on the wall", "आहे": "to be" } }
      "ती आरशात बघते.": { native: "She looks in the mirror.", bases: { "आरशात": "in the mirror", "बघते": "to look" } }
  "mr-0845":
    native: "comb"
    notes:
      "n1": "A comb for hair: केस (kes), hair, is combed with it."
    examples:
      "माझा कंगवा कुठे आहे?": { native: "Where is my comb?", bases: { "माझा": "my", "कुठे": "where", "आहे": "to be" } }
      "तिने कंगवा घेतला.": { native: "She took the comb.", bases: { "घेतला": "to take" } }
  "mr-0846":
    native: "soap"
    notes:
      "n1": "साबणाने (sābṇāne), with soap, as in हात साबणाने धुवा (hāt sābṇāne dhuvā), wash your hands with soap."
    examples:
      "हात साबणाने धुवा.": { native: "Wash your hands with soap.", bases: { "हात": "hand", "साबणाने": "with soap", "धुवा": "to wash" } }
      "साबण कुठे आहे?": { native: "Where is the soap?", bases: { "कुठे": "where", "आहे": "to be" } }
  "mr-0847":
    native: "towel"
    notes:
      "n1": "A towel after a bath: आंघोळीनंतर (āṅghoḷinantar), after a bath."
    examples:
      "टॉवेल स्वच्छ आहे.": { native: "The towel is clean.", bases: { "आहे": "to be" } }
      "त्याने टॉवेल घेतला.": { native: "He took the towel.", bases: { "घेतला": "to take" } }
  "mr-0848":
    native: "bedsheet"
    notes:
      "n1": "A sheet for the bed: अंथरुण (antharuṇ), bedding, is the wider word."
    examples:
      "चादर पांढरी आहे.": { native: "The sheet is white.", bases: { "पांढरी": "white", "आहे": "to be" } }
      "पलंगावर चादर आहे.": { native: "There is a sheet on the bed.", bases: { "पलंगावर": "on the bed", "आहे": "to be" } }
  "mr-0849":
    native: "pillow"
    notes:
      "n1": "The pillow is for sleeping: झोपताना (jhoptānā), when you sleep."
    examples:
      "उशी मऊ आहे.": { native: "The pillow is soft.", bases: { "मऊ": "soft", "आहे": "to be" } }
      "झोपताना उशी वापरा.": { native: "Use a pillow when you sleep.", bases: { "झोपताना": "to sleep", "वापरा": "to use" } }
  "mr-0850":
    native: "blanket"
    notes:
      "n1": "A blanket for the cold: थंडी (thaṇḍi), cold weather, is the reason to use it."
    examples:
      "हे ब्लँकेट उबदार आहे.": { native: "This blanket is warm.", bases: { "उबदार": "warm", "आहे": "to be" } }
      "मला ब्लँकेट हवे आहे.": { native: "I want a blanket.", bases: { "मला": "I", "आहे": "to be" } }
  "mr-0851":
    native: "plate"
    notes:
      "n1": "A plate for a meal: जेवणाचे ताट (jevṇāce tāṭ), a meal plate."
    examples:
      "ताट टेबलावर आहे.": { native: "The plate is on the table.", bases: { "टेबलावर": "on the table", "आहे": "to be" } }
      "ताट स्वच्छ करा.": { native: "Clean the plate.", bases: { "स्वच्छ": "clean", "करा": "to do" } }
  "mr-0852":
    native: "glass (for drinking)"
    notes:
      "n1": "A drinking glass: ग्लासभर (glāsbhar), a glassful, is a measure."
    examples:
      "एक ग्लास पाणी द्या.": { native: "Give me a glass of water.", bases: { "द्या": "to give" } }
      "ग्लास फुटला.": { native: "The glass broke.", bases: { "फुटला": "to break" } }
  "mr-0853":
    native: "fork"
    notes:
      "n1": "A fork at a meal: काट्याने (kāṭyāne), with a fork."
    examples:
      "काटा आणि चमचा ठेवा.": { native: "Put out the fork and the spoon.", bases: { "ठेवा": "to keep" } }
      "तो काट्याने खातो.": { native: "He eats with a fork.", bases: { "काट्याने": "with a fork", "खातो": "to eat" } }
  "mr-0854":
    native: "knife"
    notes:
      "n1": "A knife for cutting: सुरीने (surine), with a knife."
    examples:
      "सुरी धारदार आहे.": { native: "The knife is sharp.", bases: { "धारदार": "sharp", "आहे": "to be" } }
      "सुरीने भाजी कापा.": { native: "Cut the vegetables with a knife.", bases: { "सुरीने": "with a knife", "कापा": "to cut" } }
  "mr-0855":
    native: "pot; saucepan"
    notes:
      "n1": "A pot for cooking: पातेल्यात (pātelyāt), in the pot."
    examples:
      "पातेले गरम आहे.": { native: "The pot is hot.", bases: { "गरम": "hot", "आहे": "to be" } }
      "पातेल्यात दूध उकळते.": { native: "The milk boils in the pot.", bases: { "पातेल्यात": "in the pot", "उकळते": "to boil" } }
  "mr-0856":
    native: "wok; deep pan"
    notes:
      "n1": "A wok for frying: कढईत (kaḍhait), in the wok."
    examples:
      "कढई मोठी आहे.": { native: "The wok is big.", bases: { "मोठी": "big", "आहे": "to be" } }
      "कढईत तेल घाला.": { native: "Put oil in the wok.", bases: { "कढईत": "in the wok", "घाला": "to put in" } }
  "mr-0857":
    native: "griddle; pan"
    notes:
      "n1": "A flat pan for flatbread: तव्यावर (tavyāvar), on the pan."
    examples:
      "तवा गरम झाला.": { native: "The pan became hot.", bases: { "गरम": "hot", "झाला": "to become" } }
      "तव्यावर पोळी भाजा.": { native: "Cook the flatbread on the pan.", bases: { "तव्यावर": "on the pan", "भाजा": "to roast" } }
  "mr-0858":
    native: "phone"
    notes:
      "n1": "A formal word for the phone is भ्रमणध्वनी (bhramṇadhvani)."
    examples:
      "माझा फोन बंद आहे.": { native: "My phone is off.", bases: { "माझा": "my", "बंद": "closed", "आहे": "to be" } }
      "फोन कुठे आहे?": { native: "Where is the phone?", bases: { "कुठे": "where", "आहे": "to be" } }
  "mr-0859":
    native: "lock"
    notes:
      "n1": "A lock for a door: दाराला कुलूप (dārālā kulup), a lock on the door."
    examples:
      "कुलूप बंद आहे.": { native: "The lock is shut.", bases: { "बंद": "closed", "आहे": "to be" } }
      "दाराला कुलूप आहे.": { native: "The door has a lock.", bases: { "दाराला": "on the door", "आहे": "to be" } }
  "mr-0860":
    native: "bottle"
    notes:
      "n1": "A bottle for water: पाण्याची बाटली (pāṇyāci bāṭli), a water bottle."
    examples:
      "बाटली रिकामी आहे.": { native: "The bottle is empty.", bases: { "रिकामी": "empty", "आहे": "to be" } }
      "बाटलीत पाणी भरा.": { native: "Fill the bottle with water.", bases: { "बाटलीत": "in the bottle", "भरा": "to fill" } }
  "mr-0861":
    native: "cap; hat"
    notes:
      "n1": "A cap for the head: डोक्यावर (ḍokyāvar), on the head."
    examples:
      "टोपी डोक्यावर आहे.": { native: "The cap is on the head.", bases: { "डोक्यावर": "on the head", "आहे": "to be" } }
      "तो लाल टोपी घालतो.": { native: "He wears a red cap.", bases: { "लाल": "red", "घालतो": "to wear" } }
  "mr-0862":
    native: "card"
    notes:
      "n1": "A bank or ID card: कार्डने (kārḍane), by card."
    examples:
      "हे कार्ड तुझे आहे का?": { native: "Is this card yours?", bases: { "तुझे": "your", "आहे": "to be", "का": "question word" } }
  "mr-0863":
    native: "tin; box"
    notes:
      "n1": "A tin or box with a lid: डब्यात (ḍabyāt), in the tin."
    examples:
      "डब्यात बिस्किटे आहेत.": { native: "There are biscuits in the tin.", bases: { "डब्यात": "in the tin", "बिस्किटे": "biscuit", "आहेत": "to be" } }
      "डबा उघडा.": { native: "Open the tin.", bases: { "उघडा": "to open" } }
  "mr-0864":
    native: "box; case"
    notes:
      "n1": "A box or case: पेटी (peṭi) is larger than डबा (ḍabā), a tin."
    examples:
      "ही पेटी जड आहे.": { native: "This box is heavy.", bases: { "जड": "heavy", "आहे": "to be" } }
      "पेटी उघडा.": { native: "Open the box.", bases: { "उघडा": "to open" } }
