cards:
  "mr-5495":
    native: "Please give me water."
    bases: { "मला": "to me", "द्या": "give (please)" }
    confusables: { "w1": { why: "चहा (cahā) is tea, not water." }, "w2": { why: "कॉफी (kôfi) is coffee, not water." } }
  "mr-5496":
    native: "This rice is very spicy."
    bases: { "हे": "this", "आहे": "is" }
    confusables: { "w1": { why: "गोड (goḍ) means sweet, not spicy." }, "f1": { why: "Plural: आहेत (āhet) is for two or more things; भात (bhāt) is one dish." } }
  "mr-5497":
    native: "The restaurant is near."
    bases: { "आहे": "is" }
    confusables: { "w1": { why: "लांब (lāmb) means far, the opposite of near." }, "w2": { why: "मेनू (menu) is the menu, not a place to eat." } }
  "mr-5498":
    native: "Please give the menu."
    bases: { "द्या": "give (please)" }
    confusables: { "w1": { why: "बिल (bil) is the bill, not the menu." }, "w2": { why: "थाळी (thāḷi) is a set meal, which you choose from the menu." } }
  "mr-5499":
    native: "Bring some water."
    bases: { "आणा": "bring (please)" }
    confusables: { "w1": { why: "चहा (cahā) is tea, not water." }, "w2": { why: "थाळी (thāḷi) is a set meal, not a drink." } }
  "mr-5500":
    native: "The millet flatbread is hot."
    bases: { "आहे": "is", "गरम": "hot" }
    confusables: { "w1": { why: "पोळी (poḷi) is a flatbread, not millet bread." }, "w2": { why: "वडापाव (vaḍāpāv) is a snack, not a flatbread." } }
  "mr-5501":
    native: "Let's eat at the restaurant."
    bases: { "हॉटेलमध्ये": "at the restaurant", "जेवू": "let's eat" }
    confusables: { "w1": { why: "भात (bhāt) is rice, a food, not a place." }, "w2": { why: "वडापाव (vaḍāpāv) is a snack, not a place." } }
  "mr-5502":
    native: "I will have tea tomorrow."
    bases: { "घेईन": "will have", "उद्या": "tomorrow" }
    confusables: { "w1": { why: "कॉफी (kôfi) is coffee, not tea." }, "f1": { why: "घेतला (ghetlā) is the past: I already had it." } }
  "mr-5503":
    native: "How much is the bill?"
    bases: { "किती": "how much" }
    confusables: { "w1": { why: "मेनू (menu) is the menu, not the price." }, "w2": { why: "चहा (cahā) is tea, not a price." } }
  "mr-5504":
    native: "This tea is very sweet."
    bases: { "हा": "this", "आहे": "is" }
    confusables: { "w1": { why: "तिखट (tikhaṭ) means spicy, not sweet." }, "w2": { why: "भात (bhāt) is cooked rice, not tea." } }
  "mr-5505":
    native: "I like vada pav."
    bases: { "मला": "to me", "आवडतो": "like (it pleases me)" }
    confusables: { "w1": { why: "थाळी (thāḷi) is a set meal, a different dish." }, "w2": { why: "पोळी (poḷi) is a flatbread, a different food." } }
