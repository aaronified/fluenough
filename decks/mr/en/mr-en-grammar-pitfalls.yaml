id: "mr-en-grammar-pitfalls"
kind: "layer"
core: "mr-grammar-pitfalls"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Pitfalls"
license: "CC0-1.0"
description: "The mistakes English speakers make most in Marathi, and a few Hindi speakers make. Not yet checked by a Marathi speaker: please report any mistake."
cards:
  "mr-0607":
    native: "I read the book."
    notes:
      "n1": "With an object, the past agrees with the object, not with you: पुस्तक (pustak) is neuter, so वाचले (vācle), whether a man or a woman reads it."
  "mr-0608":
    native: "He ate a mango."
    notes:
      "n1": "He, she and they take -ने (-ne) with such a past: त्याने (tyāne), तिने (tine), त्यांनी (tyānni). The verb agrees with आंबा (āmbā), masculine. मी (mi) and तू (tu) do not change: मी आंबा खाल्ला (mi āmbā khāllā)."
  "mr-0609":
    native: "She made tea."
    notes:
      "n1": "केला (kelā), masculine, for चहा (cahā), though a woman made it."
  "mr-0610":
    native: "I know Marathi."
    notes:
      "n1": "A language or a skill 'comes to' you: मला पोहता येते (malā pohtā yete), I can swim. Not मी मराठी जाणतो (mi marāṭhi jāṇto)."
  "mr-0611":
    native: "I'll come tomorrow."
    notes:
      "n1": "For Hindi speakers: Hindi कल (kal) is both yesterday and tomorrow, but Marathi काल (kāl) is only yesterday. Tomorrow is उद्या (udyā)."
  "mr-0612":
    native: "Let's go."
    notes:
      "n1": "आपण (āpaṇ) includes the listener. आम्ही जाऊ (āmhi jāu) would mean 'we (not you) will go', and leave them behind."
  "mr-0613":
    native: "Where were you?"
    notes:
      "n1": "तुम्ही (tumhi) takes the plural even for one person: होता (hotā), not the तू (tu) form होतास (hotās)."
  "mr-0614":
    native: "I went. (a woman speaking)"
    notes:
      "n1": "Learners who are women often copy the man's form from books. A woman says मी गेले (mi gele), मी आले (mi āle), मी जाते (mi jāte): the verb shows the speaker's gender."
