description: "Short sentences that use the words of this unit. Not yet checked by a Marathi speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "mr-6860":
    native: "My interview is tomorrow."
    bases: { "माझी": "my (of me)", "आहे": "is" }
    confusables: { "w1": { why: "अर्ज (arj) is a written application." }, "f1": { why: "आहेत (āhet) is plural; मुलाखत (mulākhat) is one interview." }, "w2": { why: "बैठक (baiṭhak) is a meeting, not an interview." } }
    notes: { "n1": "माझी (mājhi), my, agrees with मुलाखत (mulākhat), a feminine thing owned, not with the owner." }
  "mr-6861":
    native: "I filled in an application for the company."
    bases: { "भरला": "filled in" }
    confusables: { "w1": { why: "अर्ज करणे (arj karṇe) means to apply, the verb." }, "f1": { why: "भरतो (bharto) is present tense; भरला (bharlā) is past." }, "w2": { why: "राजीनामा (rājināmā) is a resignation, leaving a job." } }
    notes: { "n1": "मी (mi) keeps its form in the past, and भरला (bharlā) agrees with अर्ज (arj), a masculine object: the verb follows the object, not the doer." }
  "mr-6862":
    native: "The manager reads the project report."
    confusables: { "w1": { why: "बॉस (bôs) is the boss, a loan word." }, "f1": { why: "वाचते (vācte) is said of a woman." }, "w2": { why: "पाहणे (pāhṇe) means to look at, not to read." } }
    notes: { "n1": "प्रकल्पाचा (prakalpācā), of the project, takes -चा (-cā) to agree with अहवाल (ahvāl), a masculine thing owned." }
  "mr-6863":
    native: "The staff come to the office."
    confusables: { "w1": { why: "जाणे (jāṇe) means to go, not to come." }, "f1": { why: "येतो (yeto) is said of one man." }, "w2": { why: "सहकारी (sahkāri) is a colleague, one co-worker." } }
    notes: { "n1": "कार्यालयात (kāryālayāt), in the office: कार्यालय (kāryālay) adds -ा- (-ā-) before -त (-t), 'in'." }
  "mr-6864":
    native: "I completed the project."
    bases: { "पूर्ण": "complete; finished" }
    confusables: { "w1": { why: "सादर करणे (sādar karṇe) means to submit." }, "f1": { why: "पूर्ण करतो (purṇa karto) is present: I complete." }, "w2": { why: "अहवाल (ahvāl) is a report, a document." } }
    notes: { "n1": "मी (mi) keeps its form, and केला (kelā), did, agrees with the masculine object प्रकल्प (prakalp): पूर्ण करणे (purṇa karṇe) means to complete." }
  "mr-6865":
    native: "I have to submit the report."
    bases: { "मला": "I (to me)", "सादर": "submitted; presented", "आहे": "is" }
    confusables: { "w1": { why: "पूर्ण करणे (purṇa karṇe) means to complete." }, "f1": { why: "आहेत (āhet) is plural; one report takes आहे (āhe)." }, "w2": { why: "प्रकल्प (prakalp) is a project, not the report." } }
    notes: { "n1": "करायचा (karāycā), to do, agrees with the masculine object अहवाल (ahvāl), the thing to be done." }
  "mr-6866":
    native: "She will get a promotion."
    bases: { "मिळेल": "will get" }
    confusables: { "w1": { why: "राजीनामा (rājināmā) is a resignation, the opposite of promotion." }, "f1": { why: "मिळाली (miḷāli) is past tense: got." }, "w2": { why: "पगार (pagār) is salary, not promotion." } }
    notes: { "n1": "तिला (tilā), to her, is the one who gets the promotion, and the future मिळेल (miḷel) does not show gender." }
  "mr-6867":
    native: "The office printer broke."
    confusables: { "w1": { why: "तुटणे (tuṭṇe) means to break apart into pieces." }, "f1": { why: "बिघडते (bighḍte) is present, for a feminine thing." }, "w2": { why: "ऑफिस (ôphis) is the office, the place." } }
    notes: { "n1": "बिघडला (bighaḍlā), broke down, agrees with प्रिंटर (priṇṭar), a masculine noun: a verb with no object agrees with its subject." }
  "mr-6868":
    native: "Send the application online."
    bases: { "पाठवा": "send (polite order)" }
    confusables: { "w1": { why: "सादर करणे (sādar karṇe) means to submit." }, "f1": { why: "पाठवला (pāṭhvlā) is past tense: sent." }, "w2": { why: "अहवाल (ahvāl) is a report, not an application." } }
    notes: { "n1": "पाठवा (pāṭhavā), send, is the polite order: the stem plus -ा (-ā), as for a polite you." }
  "mr-6869":
    native: "The workers come to work in the morning."
    confusables: { "w1": { why: "सहकारी (sahkāri) is a colleague, not a worker." }, "f1": { why: "येते (yete) is said of a woman." }, "w2": { why: "कर्मचारी (karmacāri) is a staff member, an employee." } }
    notes: { "n1": "कामावर (kāmāvar), at work: काम (kām) adds -ा- (-ā-) before -वर (-var), the ending that 'on' takes." }
  "mr-6870":
    native: "The meeting will be held today."
    bases: { "होणार": "will be held", "आहे": "is" }
    confusables: { "w1": { why: "मीटिंग (miṭiṅg) is also a meeting." }, "f1": { why: "होते (hote) is past tense: was." }, "w2": { why: "उद्या (udyā) is tomorrow, not today." } }
    notes: { "n1": "होणार (hoṇār), will be held, is the -णार (-ṇār) future of होणे (hoṇe), to happen." }
  "mr-6871":
    native: "I want a promotion."
    bases: { "मला": "I (to me)", "हवी": "wanted (feminine)", "आहे": "is" }
    confusables: { "w1": { why: "राजीनामा (rājināmā) is a resignation, the opposite." }, "f1": { why: "आहेत (āhet) is plural; one wish takes आहे (āhe)." }, "w2": { why: "नोकरी (nokri) is a job, not a promotion." } }
    notes: { "n1": "हवी (havi), wanted, agrees with बढती (baḍhti), a feminine noun: with मला (malā), to me, हवी (havi) आहे (āhe) means I want it." }
