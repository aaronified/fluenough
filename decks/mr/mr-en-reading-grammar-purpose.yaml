  "sentences":
  - "text": "हा कोर्स मराठी बोलण्यासाठी आहे."
    "reading": "hā kors marāṭhi bolaṇyāsāṭhi āhe."
    "ipa": "ɦa kors məraʈʰi boləɳjasaʈʰi aɦe"
  - "text": "हा कोर्स नोकरीसाठी उपयोगी आहे."
    "reading": "hā kors nokrisāṭhi upyogi āhe."
    "ipa": "ɦa kors nokrisaʈʰi upjoɡi aɦe"
  - "text": "आठवड्यातून तीन वेळा वर्ग असतो."
    "reading": "āṭhvaḍyātun tin veḷā varg asto."
    "ipa": "aʈʰʋəɖjat̪un t̪in ʋeɭa ʋərɡ əst̪o"
  - "text": "प्रवास करण्यासाठी काही शब्द शिका."
    "reading": "pravās karaṇyāsāṭhi kāhi śabd śikā."
    "ipa": "prəʋas kərəɳjasaʈʰi kaɦi ʃəbd̪ ʃika"
  - "text": "नाव नोंदणीसाठी आजच ऑफिसमध्ये या."
    "reading": "nāv nondaṇisāṭhi ājac ôphismadhye yā."
    "ipa": "naʋ nond̪əɳisaʈʰi adzəts ɔpʰisməd̪ʱje ja"
