schema: 1
id: mr-en-transport
name: "Bus, auto, cab"
kind: vocab
theme: transport
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Getting a ride, agreeing the fare and getting off where you want. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0420
    target: "रिक्षा"
    native: "auto-rickshaw"
    reading: "riksha"
    pos: "noun"
    gender: "f"
    notes: "Feminine: रिक्षा आली (riksha ali), the rickshaw has come. In Pune and Mumbai's suburbs they run on the meter."
  - id: mr-0421
    target: "टॅक्सी"
    native: "taxi"
    reading: "taksi"
    pos: "noun"
    gender: "f"
  - ref: mr-0052
    native: "bus"
    notes: "Feminine: बस आली. A state-run bus between towns is the एसटी (esti), and a city bus in Mumbai is a बेस्ट (best)."
  - id: mr-0422
    target: "स्टेशन"
    native: "station"
    reading: "steshan"
    pos: "noun"
    gender: "n"
    notes: "Formally स्थानक (sthanak), as on signs: रेल्वे स्थानक, railway station."
  - id: mr-0423
    target: "तिकीट"
    native: "ticket"
    reading: "tikit"
    pos: "noun"
    gender: "n"
  - id: mr-0424
    target: "भाडे"
    native: "fare; rent"
    reading: "bhade"
    pos: "noun"
    gender: "n"
    notes: "किती भाडे? (kiti bhade?), what's the fare? In speech भाडं (bhada)."
  - id: mr-0425
    target: "मीटरने चला."
    native: "Go by the meter, please."
    reading: "mitarne chala."
    pos: "phrase"
    notes: "-ने is 'by': बसने (basne), by bus."
  - id: mr-0426
    target: "इथे थांबा."
    native: "Stop here, please."
    reading: "ithe thamba."
    pos: "phrase"
    notes: "थांबा is also 'wait': जरा थांबा (jara thamba), wait a moment."
  - id: mr-0427
    target: "कुठे जायचे आहे?"
    native: "Where do you want to go?"
    reading: "kuthe jayche ahe?"
    pos: "phrase"
    notes: "What the driver asks: 'where is it to go?'."
  - id: mr-0428
    target: "स्टेशनला चला."
    native: "To the station, please."
    reading: "steshanla chala."
    pos: "phrase"
    notes: "'Go to the station': -ला is 'to', and चला a polite 'let's go'."
  - id: mr-0429
    target: "लोकल"
    native: "local train (in Mumbai)"
    reading: "lokal"
    pos: "noun"
    gender: "f"
    notes: "Mumbai's suburban trains. Fast trains are फास्ट (fast), stopping ones स्लो (slo)."
  - id: mr-0430
    target: "गाडी"
    native: "car; vehicle; train"
    reading: "gadi"
    pos: "noun"
    gender: "f"
    notes: "Any vehicle, and also a train or a handcart stall: वडापावची गाडी (vadapavchi gadi), a vada pav cart."
  - id: mr-0431
    target: "विमानतळ"
    native: "airport"
    reading: "vimantal"
    pos: "noun"
    gender: "m"
    notes: "'Aeroplane ground': विमान (viman), aeroplane. In speech often एअरपोर्ट."
  - id: mr-0432
    target: "मला इथे उतरायचे आहे."
    native: "I want to get off here."
    reading: "mala ithe utrayche ahe."
    pos: "phrase"
    notes: "उतरणे, to get off; to get down. Its opposite is चढणे (chadhne), to get on."
