schema: 1
id: mr-en-transport
name: "Bus, auto, cab"
kind: vocab
theme: transport
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Getting a ride, agreeing the fare and getting off where you want. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0420
    target: "रिक्षा"
    native: "auto-rickshaw"
    reading: "rikṣā"
    ipa: "rikʂa"
    pos: "noun"
    gender: "f"
    notes: "Feminine: रिक्षा आली (rikṣā āli), the rickshaw has come. In Pune and Mumbai's suburbs they run on the meter."
  - id: mr-0421
    target: "टॅक्सी"
    native: "taxi"
    reading: "ṭêksi"
    ipa: "ʈæksi"
    pos: "noun"
    gender: "f"
  - ref: mr-0052
    native: "bus"
    notes: "Feminine: बस आली (bas āli). A state-run bus between towns is the एसटी (esṭi), and a city bus in Mumbai is a बेस्ट (besṭ)."
  - id: mr-0422
    target: "स्टेशन"
    native: "station"
    reading: "sṭeśan"
    ipa: "sʈeʃən"
    pos: "noun"
    gender: "n"
    notes: "Formally स्थानक (sthānak), as on signs: रेल्वे स्थानक (relve sthānak), railway station."
  - id: mr-0423
    target: "तिकीट"
    native: "ticket"
    reading: "tikiṭ"
    ipa: "t̪ikiʈ"
    pos: "noun"
    gender: "n"
  - id: mr-0424
    target: "भाडे"
    native: "fare; rent"
    reading: "bhāḍe"
    ipa: "bʱaɖe"
    pos: "noun"
    gender: "n"
    notes: "किती भाडे? (kiti bhade?), what's the fare? In speech भाडं (bhāḍam̐)."
  - id: mr-0425
    target: "मीटरने चला."
    native: "Go by the meter, please."
    reading: "miṭarne calā."
    ipa: "miʈərne tsəla"
    pos: "phrase"
    notes: "-ने (-ne) is 'by': बसने (basne), by bus."
  - id: mr-0426
    target: "इथे थांबा."
    native: "Stop here, please."
    reading: "ithe thāmbā."
    ipa: "it̪ʰe t̪ʰamba"
    pos: "phrase"
    notes: "थांबा (thāmbā) is also 'wait': जरा थांबा (jarā thāmbā), wait a moment."
  - id: mr-0427
    target: "कुठे जायचे आहे?"
    native: "Where do you want to go?"
    reading: "kuṭhe jāyce āhe?"
    ipa: "kuʈʰe dzajtʃe aɦe"
    pos: "phrase"
    notes: "What the driver asks: 'where is it to go?'."
  - id: mr-0428
    target: "स्टेशनला चला."
    native: "To the station, please."
    reading: "sṭeśanlā calā."
    ipa: "sʈeʃənla tsəla"
    pos: "phrase"
    notes: "'Go to the station': -ला (-lā) is 'to', and चला (calā) a polite 'let's go'."
  - id: mr-0429
    target: "लोकल"
    native: "local train (in Mumbai)"
    reading: "lokal"
    ipa: "lokəl"
    pos: "noun"
    gender: "f"
    notes: "Mumbai's suburban trains. Fast trains are फास्ट (fāsṭ), stopping ones स्लो (slo)."
  - id: mr-0430
    target: "गाडी"
    native: "car; vehicle; train"
    reading: "gāḍi"
    ipa: "ɡaɖi"
    pos: "noun"
    gender: "f"
    notes: "Any vehicle, and also a train or a handcart stall: वडापावची गाडी (vaḍāpāvci gāḍi), a vada pav cart."
  - id: mr-0431
    target: "विमानतळ"
    native: "airport"
    reading: "vimāntaḷ"
    ipa: "ʋimant̪əɭ"
    pos: "noun"
    gender: "m"
    notes: "'Aeroplane ground': विमान (vimān), aeroplane. In speech often एअरपोर्ट (earporṭ)."
  - id: mr-0432
    target: "मला इथे उतरायचे आहे."
    native: "I want to get off here."
    reading: "malā ithe utrāyce āhe."
    ipa: "məla it̪ʰe ut̪rajtʃe aɦe"
    pos: "phrase"
    notes: "उतरणे (utrṇe), to get off; to get down. Its opposite is चढणे (caḍhṇe), to get on."
