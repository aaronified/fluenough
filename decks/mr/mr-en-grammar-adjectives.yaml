schema: 1
id: mr-en-grammar-adjectives
name: "Describing words"
kind: grammar
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Big, good, new: a describing word that ends in -आ agrees with its noun in three genders. Others never change. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Adjective agreement"
  slot_name: "agreement"
  slots: ["with a masculine noun", "with a feminine noun", "with a neuter noun, or a masculine plural", "with a feminine plural, or before an ending"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "A describing word in -आ changes with its noun: मोठा मुलगा, a big boy; मोठी मुलगी, a big girl; मोठे घर, a big house; मोठे मुलगे, big boys; मोठ्या मुली, big girls. Before a noun with an ending, every gender takes -्या: मोठ्या घरात, in a big house. A neuter plural takes -ई: मोठी घरे. Words that don't end in -आ never change: लाल (red), सुंदर (beautiful), छान (nice), गरम (hot), थंड (cold), महाग (expensive)."
  entries:
    - lemma: "मोठा"
      key: mothaa
      reading: "motha"
      gloss: "big; older"
      forms:
        "with a masculine noun": "मोठा"
        "with a feminine noun": "मोठी"
        "with a neuter noun, or a masculine plural": "मोठे"
        "with a feminine plural, or before an ending": "मोठ्या"
      readings:
        "with a masculine noun": "motha"
        "with a feminine noun": "mothi"
        "with a neuter noun, or a masculine plural": "mothe"
        "with a feminine plural, or before an ending": "mothya"
    - lemma: "छोटा"
      key: chhotaa
      reading: "chhota"
      gloss: "small; little"
      forms:
        "with a masculine noun": "छोटा"
        "with a feminine noun": "छोटी"
        "with a neuter noun, or a masculine plural": "छोटे"
        "with a feminine plural, or before an ending": "छोट्या"
      readings:
        "with a masculine noun": "chhota"
        "with a feminine noun": "chhoti"
        "with a neuter noun, or a masculine plural": "chhote"
        "with a feminine plural, or before an ending": "chhotya"
    - lemma: "चांगला"
      key: chaanglaa
      reading: "changla"
      gloss: "good"
      forms:
        "with a masculine noun": "चांगला"
        "with a feminine noun": "चांगली"
        "with a neuter noun, or a masculine plural": "चांगले"
        "with a feminine plural, or before an ending": "चांगल्या"
      readings:
        "with a masculine noun": "changla"
        "with a feminine noun": "changli"
        "with a neuter noun, or a masculine plural": "changle"
        "with a feminine plural, or before an ending": "changlya"
    - lemma: "नवा"
      key: navaa
      reading: "nava"
      gloss: "new"
      forms:
        "with a masculine noun": "नवा"
        "with a feminine noun": "नवी"
        "with a neuter noun, or a masculine plural": "नवे"
        "with a feminine plural, or before an ending": "नव्या"
      readings:
        "with a masculine noun": "nava"
        "with a feminine noun": "navi"
