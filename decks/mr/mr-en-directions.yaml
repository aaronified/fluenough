schema: 1
id: mr-en-directions
name: "Directions"
kind: vocab
theme: directions
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Left, right, straight on, and asking where something is. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0446
    target: "डावीकडे"
    native: "to the left; on the left"
    reading: "daaviikade"
    pos: "adv"
    notes: "डावा (daavaa) is 'left', and -कडे 'towards': डावीकडे वळा, turn left."
  - id: mr-0447
    target: "उजवीकडे"
    native: "to the right; on the right"
    reading: "ujviikade"
    pos: "adv"
    notes: "उजवा (ujvaa) is 'right'."
  - ref: mr-0062
    native: "straight on"
    notes: "सरळ जा (saral jaa), go straight on."
  - id: mr-0448
    target: "पुढे"
    native: "ahead; further on"
    reading: "pudhe"
    pos: "adv"
    notes: "थोडे पुढे (thode pudhe), a little further on."
  - id: mr-0449
    target: "मागे"
    native: "behind; back"
    reading: "maage"
    pos: "adv"
    notes: "स्टेशनच्या मागे (steshanchyaa maage), behind the station."
  - id: mr-0450
    target: "जवळ"
    native: "near; nearby"
    reading: "javal"
    pos: "adv"
    notes: "इथे जवळ (ithe javal), near here."
  - id: mr-0451
    target: "लांब"
    native: "far; long"
    reading: "laamb"
    pos: "adv"
    notes: "खूप लांब आहे का? (khuup laamb aahe kaa?), is it very far?"
  - id: mr-0452
    target: "स्टेशन कुठे आहे?"
    native: "Where is the station?"
    reading: "steshan kuthe aahe?"
    pos: "phrase"
    notes: "Any place before कुठे आहे: दवाखाना कुठे आहे?, where is the clinic?"
  - id: mr-0453
    target: "वळा"
    native: "turn (please)"
    reading: "valaa"
    pos: "verb"
    notes: "From वळणे (valne), to turn. A turning in the road is a वळण (valan)."
  - id: mr-0454
    target: "कोपरा"
    native: "corner"
    reading: "kopraa"
    pos: "noun"
    gender: "m"
    notes: "कोपऱ्यावर (koparyaavar), at the corner, with the eyelash r."
  - id: mr-0455
    target: "चौक"
    native: "square; crossroads"
    reading: "chauk"
    pos: "noun"
    gender: "m"
    notes: "Many are named, and given as landmarks: शिवाजी चौक."
  - id: mr-0456
    target: "समोर"
    native: "opposite; in front"
    reading: "samor"
    pos: "adv"
    notes: "बँकेसमोर (baenkesamor), opposite the bank."
  - id: mr-0457
    target: "पूल"
    native: "bridge"
    reading: "puul"
    pos: "noun"
    gender: "m"
  - id: mr-0458
    target: "सिग्नल"
    native: "traffic lights"
    reading: "signal"
    pos: "noun"
    gender: "m"
    notes: "Directions are given by them: दुसऱ्या सिग्नलला डावीकडे (dusryaa signallaa daaviikade), left at the second lights."
