id: mr-en-home
name: "Home and neighbourhood"
kind: vocab
theme: home
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The rooms of a home, what is in them, and the building and street around it. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - ref: mr-0048
    notes: "Both the building and home: माझे घर (majhe ghar), my house. At home is घरी (ghari)."
  - id: mr-0459
    target: "खोली"
    native: "room"
    reading: "kholi"
    pos: "noun"
    gender: "f"
    notes: "Plural खोल्या (kholya). A flat is described by its rooms: वन बीएचके, one bedroom, hall and kitchen."
  - id: mr-0460
    target: "स्वयंपाकघर"
    native: "kitchen"
    reading: "svayampakghar"
    pos: "noun"
    gender: "n"
    notes: "'Cooking house': स्वयंपाक (svayampak), cooking."
  - id: mr-0461
    target: "बाथरूम"
    native: "bathroom"
    reading: "bathrum"
    pos: "noun"
    notes: "The traditional word is न्हाणीघर (nhanighar)."
  - id: mr-0462
    target: "शौचालय"
    native: "toilet"
    reading: "shauchalay"
    pos: "noun"
    gender: "n"
    notes: "Formal, and on signs. In speech, टॉयलेट (toyalet) or संडास (sandas)."
  - ref: mr-0111
    notes: "दार उघडा (dar ughda), open the door, please; दार बंद करा, close the door."
  - id: mr-0463
    target: "खिडकी"
    native: "window"
    reading: "khidki"
    pos: "noun"
    gender: "f"
    notes: "Plural खिडक्या (khidkya)."
  - id: mr-0464
    target: "पलंग"
    native: "bed"
    reading: "palang"
    pos: "noun"
    gender: "m"
  - id: mr-0465
    target: "खुर्ची"
    native: "chair"
    reading: "khurchi"
    pos: "noun"
    gender: "f"
  - id: mr-0466
    target: "टेबल"
    native: "table"
    reading: "tebal"
    pos: "noun"
    gender: "n"
  - id: mr-0467
    target: "पंखा"
    native: "fan"
    reading: "pankha"
    pos: "noun"
    gender: "m"
    notes: "पंखा लावा (pankha lava), put the fan on, please."
  - id: mr-0468
    target: "दिवा"
    native: "lamp; light"
    reading: "diva"
    pos: "noun"
    gender: "m"
    notes: "दिवा लावा (diva lava), turn the light on; दिवा बंद करा, turn it off."
  - id: mr-0469
    target: "किल्ली"
    native: "key"
    reading: "killi"
    pos: "noun"
    gender: "f"
    notes: "Also चावी (chavi), from Portuguese chave."
  - id: mr-0470
    target: "शेजारी"
    native: "neighbour; next door"
    reading: "shejari"
    pos: "noun"
    gender: "m"
    notes: "Also 'next to': शाळेच्या शेजारी, next to the school."
  - id: mr-0471
    target: "इमारत"
    native: "building"
    reading: "imarat"
    pos: "noun"
    gender: "f"
    notes: "In Mumbai and Pune a block of flats is often a सोसायटी (sosayti), a housing society."
  - id: mr-0472
    target: "मजला"
    native: "floor; storey"
    reading: "majla"
    pos: "noun"
    gender: "m"
    notes: "पहिला मजला (pahila majla), the first floor, above the ground floor, as in Britain."
  - ref: mr-0424
    native: "rent; fare"
    notes: "घरभाडे (gharbhade), the rent of a house."
  - ref: mr-0114
    notes: "A garden or a park; a public park is also an उद्यान (udyan)."
  - id: mr-0473
    target: "गल्ली"
    native: "lane"
    reading: "galli"
    pos: "noun"
    gender: "f"
    notes: "A narrow street. Cricket in the lane is गल्ली क्रिकेट."
