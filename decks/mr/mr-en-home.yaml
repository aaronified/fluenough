description: "The rooms of a home, what is in them, and the building and street around it. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - ref: mr-0048
    notes: "Both the building and home: माझे घर (mājhe ghar), my house. At home is घरी (ghari)."
  - id: mr-0459
    target: "खोली"
    native: "room"
    reading: "kholi"
    ipa: "kʰoli"
    pos: "noun"
    gender: "f"
    notes: "Plural खोल्या (kholyā). A flat is described by its rooms: वन बीएचके, one bedroom, hall and kitchen."
  - id: mr-0460
    target: "स्वयंपाकघर"
    native: "kitchen"
    reading: "svayampākghar"
    ipa: "sʋəjəmpakɡʱər"
    pos: "noun"
    gender: "n"
    notes: "'Cooking house': स्वयंपाक (svayampāk), cooking."
  - id: mr-0461
    target: "बाथरूम"
    native: "bathroom"
    reading: "bāthrum"
    ipa: "bat̪ʰrum"
    pos: "noun"
    notes: "The traditional word is न्हाणीघर (nhāṇighar)."
  - id: mr-0462
    target: "शौचालय"
    native: "toilet"
    reading: "śaucālay"
    ipa: "ʃəutsaləj"
    pos: "noun"
    gender: "n"
    notes: "Formal, and on signs. In speech, टॉयलेट (ṭôyaleṭ) or संडास (saṇḍās)."
  - ref: mr-0111
    notes: "दार उघडा (dār ughḍā), open the door, please; दार बंद करा, close the door."
  - id: mr-0463
    target: "खिडकी"
    native: "window"
    reading: "khiḍki"
    ipa: "kʰiɖki"
    pos: "noun"
    gender: "f"
    notes: "Plural खिडक्या (khiḍkyā)."
  - id: mr-0464
    target: "पलंग"
    native: "bed"
    reading: "palaṅg"
    ipa: "pələŋɡ"
    pos: "noun"
    gender: "m"
  - id: mr-0465
    target: "खुर्ची"
    native: "chair"
    reading: "khurci"
    ipa: "kʰurtʃi"
    pos: "noun"
    gender: "f"
  - id: mr-0466
    target: "टेबल"
    native: "table"
    reading: "ṭebal"
    ipa: "ʈebəl"
    pos: "noun"
    gender: "n"
  - id: mr-0467
    target: "पंखा"
    native: "fan"
    reading: "paṅkhā"
    ipa: "pəŋkʰa"
    pos: "noun"
    gender: "m"
    notes: "पंखा लावा (paṅkhā lāvā), put the fan on, please."
  - id: mr-0468
    target: "दिवा"
    native: "lamp; light"
    reading: "divā"
    ipa: "d̪iʋa"
    pos: "noun"
    gender: "m"
    notes: "दिवा लावा (divā lāvā), turn the light on; दिवा बंद करा, turn it off."
  - id: mr-0469
    target: "किल्ली"
    native: "key"
    reading: "killi"
    ipa: "killi"
    pos: "noun"
    gender: "f"
    notes: "Also चावी (cāvi), from Portuguese chave."
  - id: mr-0470
    target: "शेजारी"
    native: "neighbour; next door"
    reading: "śejāri"
    ipa: "ʃedzari"
    pos: "noun"
    gender: "m"
    notes: "Also 'next to': शाळेच्या शेजारी, next to the school."
  - id: mr-0471
    target: "इमारत"
    native: "building"
    reading: "imārat"
    ipa: "imarət̪"
    pos: "noun"
    gender: "f"
    notes: "In Mumbai and Pune a block of flats is often a सोसायटी (sosāyṭi), a housing society."
  - id: mr-0472
    target: "मजला"
    native: "floor; storey"
    reading: "majlā"
    ipa: "mədzla"
    pos: "noun"
    gender: "m"
    notes: "पहिला मजला (pahilā majlā), the first floor, above the ground floor, as in Britain."
  - ref: mr-0424
    native: "rent; fare"
    notes: "घरभाडे (gharbhāḍe), the rent of a house."
  - ref: mr-0114
    notes: "A garden or a park; a public park is also an उद्यान (udyān)."
  - id: mr-0473
    target: "गल्ली"
    native: "lane"
    reading: "galli"
    ipa: "ɡəlli"
    pos: "noun"
    gender: "f"
    notes: "A narrow street. Cricket in the lane is गल्ली क्रिकेट."
