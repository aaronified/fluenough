  "title": "Making tea"
  "sentences":
  - "text": "पातेलीत पाणी ओता."
    "reading": "pātelit pāṇi otā."
    "ipa": "pat̪elit̪ paɳi ot̪a"
  - "text": "पाणी गॅसवर ठेवा."
    "reading": "pāṇi gêsvar ṭhevā."
    "ipa": "paɳi ɡæsʋər ʈʰeʋa"
  - "text": "पाणी उकळल्यावर त्यात चहा टाका."
    "reading": "pāṇi ukḷalyāvar tyāt cahā ṭākā."
    "ipa": "paɳi ukɭəljaʋər t̪jat̪ tsəɦa ʈaka"
  - "text": "नंतर त्यात दूध आणि साखर घाला."
    "reading": "nantar tyāt dudh āṇi sākhar ghālā."
    "ipa": "nənt̪ər t̪jat̪ d̪ud̪ʱ aɳi sakʰər ɡʱala"
  - "text": "पाच मिनिटे चहा उकळू द्या."
    "reading": "pāc miniṭe cahā ukḷu dyā."
    "ipa": "pats miniʈe tsəɦa ukɭu d̪ja"
  - "text": "मग कपात चहा ओता."
    "reading": "mag kapāt cahā otā."
    "ipa": "məɡ kəpat̪ tsəɦa ot̪a"
