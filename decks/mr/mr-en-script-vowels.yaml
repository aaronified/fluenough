schema: 1
id: mr-en-script-vowels
name: "Marathi vowels"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The vowels as they are written on their own, at the start of a word, with the two Marathi adds for English words. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: mr-0001
    target: "अ"
    native: "a, short (the vowel every consonant carries)"
    reading: "a"
    notes: "Like the 'u' of 'but'. Every consonant carries it unless a sign changes it, and Marathi drops it at the end of most words: घर is ghar, not ghara. On its own: अननस (ananas, pineapple)."
  - id: mr-0002
    target: "आ"
    native: "aa, long"
    reading: "a"
    notes: "The 'a' of 'father'. It is a different vowel from अ, not only a longer one, and it changes the word: आई (ai, mother)."
  - id: mr-0003
    target: "इ"
    native: "i, short"
    reading: "i"
    notes: "Like the 'i' of 'sit': इमारत (imarat, building)."
  - id: mr-0004
    target: "ई"
    native: "ii, long"
    reading: "i"
    notes: "The 'ee' of 'see': ईश्वर (ishvar, God). In everyday Marathi इ and ई sound much alike, and the spelling rules decide which is written: a Marathi word that ends in i ends in ई, as मी (mi, I) and पाणी (pani, water) do."
  - id: mr-0005
    target: "उ"
    native: "u, short"
    reading: "u"
    notes: "Like the 'u' of 'put': उंदीर (undir, mouse; rat)."
  - id: mr-0006
    target: "ऊ"
    native: "uu, long"
    reading: "u"
    notes: "The 'oo' of 'food': ऊस (us, sugarcane). As with इ and ई, speech barely tells उ from ऊ, and a Marathi word that ends in u ends in ऊ: तू (tu, you)."
  - id: mr-0007
    target: "ऋ"
    native: "ru (a vowel letter)"
    reading: "ru"
    modes: [recognition, production]
    notes: "Marathi says it 'ru', where Hindi says 'ri', in words from Sanskrit: ऋषी (rushi, sage). A recogniser writes the sound as रु, so it is drilled by reading and writing only."
  - id: mr-0008
    target: "ए"
    native: "e (as in 'café')"
    reading: "e"
    notes: "Like the 'e' of 'café', without the glide of English 'say': एक (ek, one)."
  - id: mr-0009
    target: "ऐ"
    native: "ai (as in 'kite')"
    reading: "ai"
    notes: "A glide from a to i, like the 'i' of 'kite'. Hindi says this letter as a long open e; Marathi keeps the glide: ऐका (aika, listen!)."
  - id: mr-0010
    target: "ओ"
    native: "o (as in 'go')"
    reading: "o"
    notes: "Like the 'o' of 'go', without the glide English adds: ओठ (oth, lip)."
  - id: mr-0011
    target: "औ"
    native: "au (as in 'cow')"
    reading: "au"
    notes: "A glide from a to u, like the 'ow' of 'cow': औषध (aushadh, medicine)."
  - id: mr-0012
    target: "ॲ"
    native: "ae, as in 'bat' (in English words)"
    reading: "a"
    modes: [recognition, production]
    notes: "Marathi writes the 'a' of English 'bat' with this letter: ॲसिड (asid, acid). After a consonant it is the sign ॅ: बॅग (bag) is said as in English. A recogniser may write it as ए, so it is drilled by reading and writing only."
  - id: mr-0013
    target: "ऑ"
    native: "o, as in 'hot' (in English words)"
    reading: "o"
    notes: "The open 'o' of British 'hot', for English words: ऑफिस (ofis, office). After a consonant it is the sign ॉ: डॉक्टर (doktar, doctor)."
