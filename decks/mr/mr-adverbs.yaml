cards:
  - id: "mr-0726"
    target: "क्वचित"
    reading: "kvacit"
    ipa: "kʋətʃit̪"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "तो क्वचित चित्रपट पाहतो.", reading: "to kvacit citrapaṭ pāhto.", ipa: "t̪o kʋətʃit̪ tʃit̪rəpəʈ paɦt̪o", bases: [{ word: "चित्रपट", base: "चित्रपट", reading: "citrapaṭ" }, { word: "पाहतो", base: "पाहणे", reading: "pāhṇe" }] }
      - { target: "ती क्वचित बाहेर जेवते.", reading: "ti kvacit bāher jevte.", ipa: "t̪i kʋətʃit̪ baɦer dʒeʋt̪e", bases: [{ word: "बाहेर", base: "बाहेर", reading: "bāher" }, { word: "जेवते", ref: "mr-0499" }] }
  - id: "mr-0727"
    target: "अनेकदा"
    reading: "anekdā"
    ipa: "ənekd̪a"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "मी अनेकदा तिथे जातो.", reading: "mi anekdā tithe jāto.", ipa: "mi ənekd̪a t̪it̪ʰe dzat̪o", bases: [{ word: "मी", base: "मी", reading: "mi" }, { word: "जातो", base: "जाणे", reading: "jāṇe" }] }
      - { target: "ती अनेकदा फोन करते.", reading: "ti anekdā phon karte.", ipa: "t̪i ənekd̪a pʰon kərt̪e", bases: [{ word: "फोन", base: "फोन", reading: "phon" }, { word: "करते", base: "करणे", reading: "karṇe" }] }
  - id: "mr-0728"
    target: "सहसा"
    reading: "sahsā"
    ipa: "səɦsa"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "तो सहसा सात वाजता उठतो.", reading: "to sahsā sāt vājtā uṭhto.", ipa: "t̪o səɦsa sat̪ ʋadzt̪a uʈʰt̪o", bases: [{ word: "उठतो", ref: "mr-0494" }] }
      - { target: "ती सहसा घरी जेवते.", reading: "ti sahsā ghari jevte.", ipa: "t̪i səɦsa ɡʱəri dʒeʋt̪e", bases: [{ word: "जेवते", ref: "mr-0499" }] }
  - id: "mr-0729"
    target: "चांगले"
    reading: "cāṅgale"
    ipa: "tsaŋɡəle"
    pos: "adv"
    notes:
      - { id: "n1", kind: "behaviour" }
    examples:
      - { target: "ती चांगले गाते.", reading: "ti cāṅgale gāte.", ipa: "t̪i tsaŋɡəle ɡat̪e", bases: [{ word: "गाते", base: "गाणे", reading: "gāṇe" }] }
      - { target: "तो चांगले चालतो.", reading: "to cāṅgale cālto.", ipa: "t̪o tsaŋɡəle tsalt̪o", bases: [{ word: "चालतो", ref: "mr-0512" }] }
  - id: "mr-0730"
    target: "वाईट"
    reading: "vāiṭ"
    ipa: "ʋaiʈ"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "तो वाईट बोलतो.", reading: "to vāiṭ bolto.", ipa: "t̪o ʋaiʈ bolt̪o", bases: [{ word: "बोलतो", base: "बोलणे", reading: "bolṇe" }] }
      - { target: "ती हे काम वाईट करते.", reading: "ti he kām vāiṭ karte.", ipa: "t̪i ɦe kam ʋaiʈ kərt̪e", bases: [{ word: "करते", base: "करणे", reading: "karṇe" }] }
  - id: "mr-0731"
    target: "हळू"
    reading: "haḷu"
    ipa: "ɦəɭu"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "तो हळू चालतो.", reading: "to haḷu cālto.", ipa: "t̪o ɦəɭu tsalt̪o", bases: [{ word: "चालतो", ref: "mr-0512" }] }
      - { target: "कृपया हळू बोला.", reading: "krupayā haḷu bolā.", ipa: "krupəja ɦəɭu bola", bases: [{ word: "कृपया", base: "कृपया", reading: "krupayā" }, { word: "बोला", base: "बोलणे", reading: "bolṇe" }] }
  - id: "mr-0732"
    target: "पटकन"
    reading: "paṭkan"
    ipa: "pəʈkən"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "तो पटकन खातो.", reading: "to paṭkan khāto.", ipa: "t̪o pəʈkən kʰat̪o", bases: [{ word: "खातो", base: "खाणे", reading: "khāṇe" }] }
      - { target: "पटकन या!", reading: "paṭkan yā!", ipa: "pəʈkən ja", bases: [{ word: "या", base: "येणे", reading: "yeṇe" }] }
  - id: "mr-0733"
    target: "नीट"
    reading: "niṭ"
    ipa: "niʈ"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "तिने काम नीट केले.", reading: "tine kām niṭ kele.", ipa: "t̪ine kam niʈ kele", bases: [{ word: "तिने", ref: "mr-0677" }, { word: "केले", base: "करणे", reading: "karṇe" }] }
      - { target: "दार नीट बंद करा.", reading: "dār niṭ band karā.", ipa: "d̪ar niʈ bənd̪ kəra", bases: [{ word: "बंद", base: "बंद", reading: "band" }, { word: "करा", base: "करणे", reading: "karṇe" }] }
  - id: "mr-0734"
    target: "आधी"
    reading: "ādhi"
    ipa: "ad̪ʱi"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "मी आधी जेवतो, मग काम करतो.", reading: "mi ādhi jevto, mag kām karto.", ipa: "mi ad̪ʱi dʒeʋt̪o məɡ kam kərt̪o", bases: [{ word: "मी", base: "मी", reading: "mi" }, { word: "जेवतो", ref: "mr-0499" }, { word: "मग", base: "मग", reading: "mag" }, { word: "करतो", base: "करणे", reading: "karṇe" }] }
      - { target: "ती आधी घरी गेली.", reading: "ti ādhi ghari geli.", ipa: "t̪i ad̪ʱi ɡʱəri ɡeli", bases: [{ word: "गेली", base: "जाणे", reading: "jāṇe" }] }
  - id: "mr-0735"
    target: "नंतर"
    reading: "nantar"
    ipa: "nənt̪ər"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "आम्ही नंतर भेटू.", reading: "āmhi nantar bheṭu.", ipa: "amɦi nənt̪ər bʱeʈu", bases: [{ word: "आम्ही", base: "आम्ही", reading: "āmhi" }, { word: "भेटू", base: "भेटणे", reading: "bheṭṇe" }] }
      - { target: "ती नंतर येईल.", reading: "ti nantar yeil.", ipa: "t̪i nənt̪ər jeil", bases: [{ word: "येईल", base: "येणे", reading: "yeṇe" }] }
  - id: "mr-0736"
    target: "सकाळी"
    reading: "sakāḷi"
    ipa: "səkaɭi"
    pos: "adv"
    notes:
      - { id: "n1", kind: "behaviour" }
    examples:
      - { target: "मी सकाळी फिरतो.", reading: "mi sakāḷi phirto.", ipa: "mi səkaɭi pʰirt̪o", bases: [{ word: "मी", base: "मी", reading: "mi" }, { word: "फिरतो", base: "फिरणे", reading: "phirṇe" }] }
      - { target: "ती सकाळी लवकर उठते.", reading: "ti sakāḷi lavkar uṭhte.", ipa: "t̪i səkaɭi ləʋkər uʈʰt̪e", bases: [{ word: "उठते", ref: "mr-0494" }] }
  - id: "mr-0737"
    target: "संध्याकाळी"
    reading: "sandhyākāḷi"
    ipa: "sənd̪ʱjakaɭi"
    pos: "adv"
    notes:
      - { id: "n1", kind: "behaviour" }
    examples:
      - { target: "संध्याकाळी आम्ही फिरायला जातो.", reading: "sandhyākāḷi āmhi phirāylā jāto.", ipa: "sənd̪ʱjakaɭi amɦi pʰirajla dzat̪o", bases: [{ word: "आम्ही", base: "आम्ही", reading: "āmhi" }, { word: "फिरायला", base: "फिरणे", reading: "phirṇe" }, { word: "जातो", base: "जाणे", reading: "jāṇe" }] }
      - { target: "मुले संध्याकाळी खेळतात.", reading: "mule sandhyākāḷi kheḷtāt.", ipa: "mule sənd̪ʱjakaɭi kʰeɭt̪at̪", bases: [{ word: "खेळतात", base: "खेळणे", reading: "kheḷṇe" }] }
  - id: "mr-0738"
    target: "इथे"
    reading: "ithe"
    ipa: "it̪ʰe"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "तो इथे राहतो.", reading: "to ithe rāhto.", ipa: "t̪o it̪ʰe raɦt̪o", bases: [{ word: "राहतो", base: "राहणे", reading: "rāhṇe" }] }
      - { target: "इथे पाणी आहे.", reading: "ithe pāṇi āhe.", ipa: "it̪ʰe paɳi aɦe", bases: [{ word: "आहे", base: "असणे", reading: "asṇe" }] }
  - id: "mr-0739"
    target: "तिथे"
    reading: "tithe"
    ipa: "t̪it̪ʰe"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "पुस्तक तिथे आहे.", reading: "pustak tithe āhe.", ipa: "pust̪ək t̪it̪ʰe aɦe", bases: [{ word: "आहे", base: "असणे", reading: "asṇe" }] }
      - { target: "ती तिथे जाते.", reading: "ti tithe jāte.", ipa: "t̪i t̪it̪ʰe dzat̪e", bases: [{ word: "जाते", base: "जाणे", reading: "jāṇe" }] }
  - id: "mr-0740"
    target: "वर"
    reading: "var"
    ipa: "ʋər"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "विमान वर उडते.", reading: "vimān var uḍte.", ipa: "ʋiman ʋər uɖt̪e", bases: [{ word: "विमान", base: "विमान", reading: "vimān" }, { word: "उडते", base: "उडणे", reading: "uḍṇe" }] }
      - { target: "वर या!", reading: "var yā!", ipa: "ʋər ja", bases: [{ word: "या", base: "येणे", reading: "yeṇe" }] }
  - id: "mr-0741"
    target: "आत"
    reading: "āt"
    ipa: "at̪"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage" }
    examples:
      - { target: "मुले आत खेळतात.", reading: "mule āt kheḷtāt.", ipa: "mule at̪ kʰeɭt̪at̪", bases: [{ word: "खेळतात", base: "खेळणे", reading: "kheḷṇe" }] }
      - { target: "कृपया आत या.", reading: "krupayā āt yā.", ipa: "krupəja at̪ ja", bases: [{ word: "कृपया", base: "कृपया", reading: "krupayā" }, { word: "या", base: "येणे", reading: "yeṇe" }] }
