schema: 1
id: mr-en-grammar-be
name: "To be: आहे, होता, नाही"
kind: grammar
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Am, was, am not, will be: असणे in the present, the past, the negative and the future. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "असणे by tense"
  slot_name: "person and gender"
  slots: ["मी (m)", "मी (f)", "आम्ही", "तू (m)", "तू (f)", "तुम्ही", "तो", "ती", "ते (it)", "ते (they)", "त्या (they, f)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "आहे comes last and says what or where someone is: मी शिक्षक आहे, I'm a teacher; मी घरी आहे, I'm at home. It is also 'there is', and with -कडे 'have': माझ्याकडे गाडी आहे. The present and the future do not show gender; the past does: a man says मी होतो, a woman मी होते. 'Am not' replaces आहे with नाही: मी घरी नाही. 'Was not' is नव्हतो, नव्हते …: मी घरी नव्हतो. तुम्ही takes the plural, for one person or many."
  entries:
    - lemma: "असणे, now"
      key: aahe
      gloss: "to be, present"
      forms:
        "मी (m)": "आहे"
        "मी (f)": "आहे"
        "आम्ही": "आहोत"
        "तू (m)": "आहेस"
        "तू (f)": "आहेस"
        "तुम्ही": "आहात"
        "तो": "आहे"
        "ती": "आहे"
        "ते (it)": "आहे"
        "ते (they)": "आहेत"
        "त्या (they, f)": "आहेत"
    - lemma: "असणे, then"
      key: hotaa
      gloss: "to be, past"
      forms:
        "मी (m)": "होतो"
        "मी (f)": "होते"
        "आम्ही": "होतो"
        "तू (m)": "होतास"
        "तू (f)": "होतीस"
        "तुम्ही": ["होता", "होतात"]
        "तो": "होता"
        "ती": "होती"
        "ते (it)": "होते"
        "ते (they)": "होते"
        "त्या (they, f)": "होत्या"
    - lemma: "असणे, not"
      key: naahii
      gloss: "not to be, present"
      forms:
        "मी (m)": "नाही"
        "मी (f)": "नाही"
        "आम्ही": "नाही"
        "तू (m)": "नाहीस"
        "तू (f)": "नाहीस"
        "तुम्ही": "नाही"
        "तो": "नाही"
        "ती": "नाही"
        "ते (it)": "नाही"
        "ते (they)": "नाहीत"
        "त्या (they, f)": "नाहीत"
    - lemma: "असणे, later"
      key: asel
      gloss: "to be, future"
      forms:
        "मी (m)": "असेन"
        "मी (f)": "असेन"
        "आम्ही": "असू"
        "तू (m)": "असशील"
        "तू (f)": "असशील"
        "तुम्ही": "असाल"
        "तो": "असेल"
        "ती": "असेल"
        "ते (it)": "असेल"
        "ते (they)": "असतील"
        "त्या (they, f)": "असतील"
