schema: 1
id: mr-en-registers
name: "Written Marathi and spoken Marathi"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Marathi is written in a standard close to the speech of Pune, but speech runs words together and writes its neuter endings as -ं (am̐), while signs and offices use formal words from Sanskrit that nobody says at home. Here they are side by side. Recognition only. Not yet checked by a Marathi speaker: please report any mistake."
tags: [reading, unreviewed]
cards:
  - ref: mr-0148
    notes: "Formal. Between friends, often थँक्स (tham̐ks), or nothing at all."
    modes: [recognition]
  - ref: mr-0157
    notes: "Formal and written: कृपया शांतता राखा (krupayā śāntatā rākhā), please keep quiet, on a sign. In speech the polite verb ending is enough."
    modes: [recognition]
  - ref: mr-0137
    notes: "As 'you', formal: in speeches, to a guest, on the telephone to a stranger, and in shops that want your custom."
    modes: [recognition]
  - ref: mr-0409
    notes: "The written form. Speech says मुलं (mulam̐), and dialogue in books and films writes it so: a neuter -े (e) is said, and often written, as -ं (am̐)."
    modes: [recognition]
  - id: mr-0615
    target: "झालं"
    native: "done; it's happened (spoken form of झाले (jhāle))"
    reading: "jhālam̐"
    ipa: "dzʱalə̃"
    pos: "other"
    modes: [recognition]
    notes: "The written ending -ए (-e) of a neuter or of a past is said as a nasal a: झाले (jhāle), झालं (jhālam̐); केले (kele), केलं (kelam̐); मुले (mule), मुलं (mulam̐). काय झालं? (kay jhala?), what happened?"
  - id: mr-0616
    target: "नाहीये"
    native: "isn't (spoken)"
    reading: "nāhiye"
    ipa: "naɦije"
    pos: "other"
    modes: [recognition]
    notes: "Spoken for नाही आहे (nāhi āhe): तो घरी नाहीये (to ghari nāhiye), he isn't at home. Written Marathi says नाही (nāhi)."
  - id: mr-0617
    target: "स्वच्छतागृह"
    native: "toilet (on signs)"
    reading: "svacchatāgruh"
    ipa: "sʋətstʃʰət̪aɡruɦ"
    pos: "noun"
    gender: "n"
    modes: [recognition]
    notes: "'Cleanliness house': what the sign says. Ask for the टॉयलेट (ṭôyleṭ) or बाथरूम (bāthrum)."
  - id: mr-0618
    target: "धूम्रपान करू नये"
    native: "no smoking"
    reading: "dhumrapān karu naye"
    ipa: "d̪ʱumrəpan kəru nəje"
    pos: "phrase"
    modes: [recognition]
    notes: "-ऊ नये (-u naye) is 'one should not', the language of notices: येथे थुंकू नये (yethe thuṅku naye), do not spit here."
  - id: mr-0619
    target: "प्रवेश"
    native: "entry; entrance"
    reading: "praveś"
    ipa: "prəʋeʃ"
    pos: "noun"
    gender: "m"
    modes: [recognition]
    notes: "On signs: प्रवेश बंद (praveś band), no entry."
  - id: mr-0620
    target: "भ्रमणध्वनी"
    native: "mobile phone (formal)"
    picture: "📱"
    reading: "bhramaṇdhvani"
    ipa: "bʱrəməɳd̪ʱʋəni"
    pos: "noun"
    gender: "m"
    modes: [recognition]
    notes: "'Roaming sound', on forms and in official letters. Everyone says मोबाइल (mobāil)."
  - id: mr-0621
    target: "दूरध्वनी"
    native: "telephone (formal)"
    picture: "☎"
    reading: "durdhvani"
    ipa: "d̪urd̪ʱʋəni"
    pos: "noun"
    gender: "m"
    modes: [recognition]
    notes: "'Far sound'. In speech, फोन (phon)."
  - id: mr-0622
    target: "संगणक"
    native: "computer (formal)"
    picture: "💻"
    reading: "saṅgaṇak"
    ipa: "səŋɡəɳək"
    pos: "noun"
    gender: "m"
    modes: [recognition]
    notes: "'Calculator'. In speech, कॉम्प्युटर (kômpyuṭar)."
  - id: mr-0623
    target: "शासन"
    native: "government"
    reading: "śāsan"
    ipa: "ʃasən"
    pos: "noun"
    gender: "n"
    modes: [recognition]
    notes: "महाराष्ट्र शासन (mahārāṣṭr śāsan), the Government of Maharashtra, on every official notice. In speech, सरकार (sarkār)."
  - id: mr-0624
    target: "करिता"
    native: "for (formal)"
    reading: "karitā"
    ipa: "kərit̪a"
    pos: "other"
    modes: [recognition]
    notes: "Written and formal: मुलांकरिता (mulāṅkaritā), for children. In speech, -साठी (-sāṭhi)."
  - id: mr-0625
    target: "जाहले"
    native: "happened (older form of झाले (jhāle))"
    reading: "jāhle"
    ipa: "dzaɦle"
    pos: "other"
    modes: [recognition]
    notes: "Older and poetic writing; today झाले (jhāle)."
