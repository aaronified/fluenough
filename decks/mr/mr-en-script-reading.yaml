schema: 1
id: mr-en-script-reading
name: "First words to read"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Short everyday words written with letters alone, no vowel signs: the headline, the standing line, ळ (ḷa), and the vowel you do not see, at work. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: mr-0048
    target: "घर"
    native: "house; home"
    picture: "🏠"
    reading: "ghar"
    ipa: "ɡʱər"
    pos: "noun"
    gender: "n"
    notes: "Two letters under one headline. घ (gha) is gha and र (ra) is ra, but the last a isn't said: ghar."
  - id: mr-0049
    target: "जग"
    native: "world"
    picture: "🌏"
    reading: "jag"
    ipa: "dzəɡ"
    pos: "noun"
    gender: "n"
    notes: "ज (ja) before a is said dz in Marathi: dzag. The last a is quiet."
  - id: mr-0050
    target: "कमळ"
    native: "lotus"
    picture: "🪷"
    reading: "kamaḷ"
    ipa: "kəməɭ"
    pos: "noun"
    gender: "n"
    notes: "Three letters and no vowel written: ka-ma-l, the last one the curled-back ळ (ḷa)."
  - id: mr-0051
    target: "नळ"
    native: "tap; water pipe"
    reading: "naḷ"
    ipa: "nəɭ"
    pos: "noun"
    gender: "m"
    notes: "न (na) and ळ (ḷa): the first l is on the teeth, this one curled back."
  - id: mr-0052
    target: "बस"
    native: "bus; sit! (to a friend)"
    reading: "bas"
    ipa: "bəs"
    pos: "noun"
    gender: "f"
    notes: "ब (ba) has a line across it; without it, it would be व (va). As 'bus' it is feminine: बस आली (bas āli), the bus has come."
  - id: mr-0053
    target: "मन"
    native: "mind; heart"
    reading: "man"
    ipa: "mən"
    pos: "noun"
    gender: "n"
    notes: "म (ma) and न (na), each with its a, and the last one quiet."
  - id: mr-0054
    target: "वन"
    native: "forest"
    reading: "van"
    ipa: "ʋən"
    pos: "noun"
    gender: "n"
    notes: "व (va) has no line across it; ब (ba) does."
  - id: mr-0055
    target: "दर"
    native: "rate; price (per unit)"
    reading: "dar"
    ipa: "d̪ər"
    pos: "noun"
    gender: "m"
    notes: "द (da), on the teeth, and र (ra). Also 'every': दर दिवशी (dar divśi), every day."
  - id: mr-0056
    target: "फळ"
    native: "fruit"
    reading: "phaḷ"
    ipa: "pʰəɭ"
    pos: "noun"
    gender: "n"
    notes: "फ (pha) is प (pa) with a curl, and a breath after it: ph. Many say it with an f."
  - id: mr-0057
    target: "हळद"
    native: "turmeric"
    reading: "haḷad"
    ipa: "ɦəɭəd̪"
    pos: "noun"
    gender: "f"
    notes: "ह (ha) has no standing line; the middle a is said here: ha-la-d."
  - id: mr-0058
    target: "शहर"
    native: "city; town"
    picture: "🏙"
    reading: "śahar"
    ipa: "ʃəɦər"
    pos: "noun"
    gender: "n"
    notes: "श (śa) has a gap in its headline."
  - id: mr-0059
    target: "ढग"
    native: "cloud"
    picture: "☁"
    reading: "ḍhag"
    ipa: "ɖʱəɡ"
    pos: "noun"
    gender: "m"
    notes: "ढ (ḍha) is curled back, with a breath after it."
  - id: mr-0060
    target: "कप"
    native: "cup"
    reading: "kap"
    ipa: "kəp"
    pos: "noun"
    gender: "m"
    notes: "From English, written with letters alone."
  - id: mr-0061
    target: "गवत"
    native: "grass"
    reading: "gavat"
    ipa: "ɡəʋət̪"
    pos: "noun"
    gender: "n"
    notes: "Three letters: ga-va-t."
  - id: mr-0062
    target: "सरळ"
    native: "straight; straight on"
    reading: "saraḷ"
    ipa: "sərəɭ"
    pos: "adv"
    notes: "Also 'simple, honest' of a person. Asking the way: सरळ जा (saraḷ jā), go straight on."
