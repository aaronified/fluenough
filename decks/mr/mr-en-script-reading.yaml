schema: 1
id: mr-en-script-reading
name: "First words to read"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Short everyday words written with letters alone, no vowel signs: the headline, the standing line, ळ, and the vowel you do not see, at work. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: mr-0048
    target: "घर"
    native: "house; home"
    reading: "ghar"
    pos: "noun"
    gender: "n"
    notes: "Two letters under one headline. घ is gha and र is ra, but the last a isn't said: ghar."
  - id: mr-0049
    target: "जग"
    native: "world"
    reading: "jag"
    pos: "noun"
    gender: "n"
    notes: "ज before a is said dz in Marathi: dzag. The last a is quiet."
  - id: mr-0050
    target: "कमळ"
    native: "lotus"
    reading: "kamal"
    pos: "noun"
    gender: "n"
    notes: "Three letters and no vowel written: ka-ma-l, the last one the curled-back ळ."
  - id: mr-0051
    target: "नळ"
    native: "tap; water pipe"
    reading: "nal"
    pos: "noun"
    gender: "m"
    notes: "न and ळ: the first l is on the teeth, this one curled back."
  - id: mr-0052
    target: "बस"
    native: "bus; sit! (to a friend)"
    reading: "bas"
    pos: "noun"
    gender: "f"
    notes: "ब has a line across it; without it, it would be व. As 'bus' it is feminine: बस आली (bas aalii), the bus has come."
  - id: mr-0053
    target: "मन"
    native: "mind; heart"
    reading: "man"
    pos: "noun"
    gender: "n"
    notes: "म and न, each with its a, and the last one quiet."
  - id: mr-0054
    target: "वन"
    native: "forest"
    reading: "van"
    pos: "noun"
    gender: "n"
    notes: "व has no line across it; ब does."
  - id: mr-0055
    target: "दर"
    native: "rate; price (per unit)"
    reading: "dar"
    pos: "noun"
    gender: "m"
    notes: "द, on the teeth, and र. Also 'every': दर दिवशी (dar divshii), every day."
  - id: mr-0056
    target: "फळ"
    native: "fruit"
    reading: "phal"
    pos: "noun"
    gender: "n"
    notes: "फ is प with a curl, and a breath after it: ph. Many say it with an f."
  - id: mr-0057
    target: "हळद"
    native: "turmeric"
    reading: "halad"
    pos: "noun"
    gender: "f"
    notes: "ह has no standing line; the middle a is said here: ha-la-d."
  - id: mr-0058
    target: "शहर"
    native: "city; town"
    reading: "shahar"
    pos: "noun"
    gender: "n"
    notes: "श has a gap in its headline."
  - id: mr-0059
    target: "ढग"
    native: "cloud"
    reading: "dhag"
    pos: "noun"
    gender: "m"
    notes: "ढ is curled back, with a breath after it."
  - id: mr-0060
    target: "कप"
    native: "cup"
    reading: "kap"
    pos: "noun"
    gender: "m"
    notes: "From English, written with letters alone."
  - id: mr-0061
    target: "गवत"
    native: "grass"
    reading: "gavat"
    pos: "noun"
    gender: "n"
    notes: "Three letters: ga-va-t."
  - id: mr-0062
    target: "सरळ"
    native: "straight; straight on"
    reading: "saral"
    pos: "adv"
    notes: "Also 'simple, honest' of a person. Asking the way: सरळ जा (saral jaa), go straight on."
