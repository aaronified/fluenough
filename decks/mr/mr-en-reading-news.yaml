  "sentences":
  - "text": "पहिला मथळा: नवीन रस्ता सुरू झाला."
    "reading": "pahilā mathḷā: navin rastā suru jhālā."
    "ipa": "pəɦila mət̪ʰɭa nəʋin rəst̪a suru dzʱala"
  - "text": "दुसरा मथळा: शहरात पाऊस पडला."
    "reading": "dusrā mathḷā: śahrāt pāus paḍlā."
    "ipa": "d̪usra mət̪ʰɭa ʃəɦrat̪ paus pəɖla"
  - "text": "तिसरा मथळा: शाळेची नवी इमारत तयार आहे."
    "reading": "tisrā mathḷā: śāḷeci navi imārat tayār āhe."
    "ipa": "t̪isra mət̪ʰɭa ʃaɭetʃi nəʋi imarət̪ t̪əjar aɦe"
  - "text": "चौथा मथळा: उद्या क्रिकेट सामना आहे."
    "reading": "cauthā mathḷā: udyā krikeṭ sāmnā āhe."
    "ipa": "tsəut̪ʰa mət̪ʰɭa ud̪ja krikeʈ samna aɦe"
