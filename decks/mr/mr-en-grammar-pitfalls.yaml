description: "The mistakes English speakers make most in Marathi, and a few Hindi speakers make. Not yet checked by a Marathi speaker: please report any mistake."
tags: [unreviewed, grammar]
cards:
  - id: mr-0607
    target: "मी पुस्तक वाचले."
    native: "I read the book."
    reading: "mi pustak vācle."
    ipa: "mi pust̪ək ʋatsle"
    pos: "phrase"
    notes: "With an object, the past agrees with the object, not with you: पुस्तक (pustak) is neuter, so वाचले (vācle), whether a man or a woman reads it."
  - id: mr-0608
    target: "त्याने आंबा खाल्ला."
    native: "He ate a mango."
    reading: "tyāne āmbā khāllā."
    ipa: "t̪jane amba kʰalla"
    pos: "phrase"
    notes: "He, she and they take -ने (-ne) with such a past: त्याने (tyāne), तिने (tine), त्यांनी (tyānni). The verb agrees with आंबा (āmbā), masculine. मी (mi) and तू (tu) do not change: मी आंबा खाल्ला (mi āmbā khāllā)."
  - id: mr-0609
    target: "तिने चहा केला."
    native: "She made tea."
    reading: "tine cahā kelā."
    ipa: "t̪ine tsəɦa kela"
    pos: "phrase"
    notes: "केला (kelā), masculine, for चहा (cahā), though a woman made it."
  - id: mr-0610
    target: "मला मराठी येते."
    native: "I know Marathi."
    reading: "malā marāṭhi yete."
    ipa: "məla məraʈʰi jet̪e"
    pos: "phrase"
    notes: "A language or a skill 'comes to' you: मला पोहता येते (malā pohtā yete), I can swim. Not मी मराठी जाणतो (mi marāṭhi jāṇto)."
  - id: mr-0611
    target: "मी उद्या येईन."
    native: "I'll come tomorrow."
    reading: "mi udyā yein."
    ipa: "mi ud̪ja jein"
    pos: "phrase"
    notes: "For Hindi speakers: Hindi कल (kal) is both yesterday and tomorrow, but Marathi काल (kāl) is only yesterday. Tomorrow is उद्या (udyā)."
  - id: mr-0612
    target: "आपण जाऊया."
    native: "Let's go."
    reading: "āpaṇ jāuyā."
    ipa: "apəɳ dzauja"
    alt_target: ["आपण जाऊ या."]
    pos: "phrase"
    notes: "आपण (āpaṇ) includes the listener. आम्ही जाऊ (āmhi jāu) would mean 'we (not you) will go', and leave them behind."
  - id: mr-0613
    target: "तुम्ही कुठे होता?"
    native: "Where were you?"
    reading: "tumhi kuṭhe hotā?"
    ipa: "t̪umɦi kuʈʰe ɦot̪a"
    pos: "phrase"
    notes: "तुम्ही (tumhi) takes the plural even for one person: होता (hotā), not the तू (tu) form होतास (hotās)."
  - id: mr-0614
    target: "मी गेले."
    native: "I went. (a woman speaking)"
    reading: "mi gele."
    ipa: "mi ɡele"
    pos: "phrase"
    notes: "Learners who are women often copy the man's form from books. A woman says मी गेले (mi gele), मी आले (mi āle), मी जाते (mi jāte): the verb shows the speaker's gender."
