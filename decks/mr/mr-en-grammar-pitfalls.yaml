id: mr-en-grammar-pitfalls
name: "Pitfalls"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The mistakes English speakers make most in Marathi, and a few Hindi speakers make. Not yet checked by a Marathi speaker: please report any mistake."
tags: [unreviewed, grammar]
cards:
  - id: mr-0607
    target: "मी पुस्तक वाचले."
    native: "I read the book."
    reading: "mii pustak vaachle."
    pos: "phrase"
    notes: "With an object, the past agrees with the object, not with you: पुस्तक is neuter, so वाचले, whether a man or a woman reads it."
  - id: mr-0608
    target: "त्याने आंबा खाल्ला."
    native: "He ate a mango."
    reading: "tyaane aambaa khaallaa."
    pos: "phrase"
    notes: "He, she and they take -ने with such a past: त्याने, तिने, त्यांनी. The verb agrees with आंबा, masculine. मी and तू do not change: मी आंबा खाल्ला."
  - id: mr-0609
    target: "तिने चहा केला."
    native: "She made tea."
    reading: "tine chahaa kelaa."
    pos: "phrase"
    notes: "केला, masculine, for चहा, though a woman made it."
  - id: mr-0610
    target: "मला मराठी येते."
    native: "I know Marathi."
    reading: "malaa maraathii yete."
    pos: "phrase"
    notes: "A language or a skill 'comes to' you: मला पोहता येते, I can swim. Not मी मराठी जाणतो."
  - id: mr-0611
    target: "मी उद्या येईन."
    native: "I'll come tomorrow."
    reading: "mii udyaa yeiin."
    pos: "phrase"
    notes: "For Hindi speakers: Hindi कल is both yesterday and tomorrow, but Marathi काल is only yesterday. Tomorrow is उद्या."
  - id: mr-0612
    target: "आपण जाऊया."
    native: "Let's go."
    reading: "aapan jaauuyaa."
    alt_target: ["आपण जाऊ या."]
    pos: "phrase"
    notes: "आपण includes the listener. आम्ही जाऊ would mean 'we (not you) will go', and leave them behind."
  - id: mr-0613
    target: "तुम्ही कुठे होता?"
    native: "Where were you?"
    reading: "tumhii kuthe hotaa?"
    pos: "phrase"
    notes: "तुम्ही takes the plural even for one person: होता, not the तू form होतास."
  - id: mr-0614
    target: "मी गेले."
    native: "I went. (a woman speaking)"
    reading: "mii gele."
    pos: "phrase"
    notes: "Learners who are women often copy the man's form from books. A woman says मी गेले, मी आले, मी जाते: the verb shows the speaker's gender."
