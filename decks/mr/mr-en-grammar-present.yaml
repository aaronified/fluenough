schema: 1
id: mr-en-grammar-present
name: "Present: what you usually do"
kind: grammar
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I go, she lives, they speak: habits and facts, by person and gender. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Present habitual"
  slot_name: "person and gender"
  slots: ["मी (m)", "मी (f)", "आम्ही", "तू (m)", "तू (f)", "तुम्ही", "तो", "ती", "ते (it)", "ते (they)", "त्या (they, f)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The stem, then -त-, then an ending that agrees with the doer: -तो for a man, -ते for a woman or a thing, -तात for more than one. With मी and तू the speaker's or listener's gender shows: a man says मी जातो, a woman मी जाते. आम्ही takes -तो whoever speaks, and तुम्ही takes -ता, for one person or many. This tense is for habits and facts: मी रोज चहा पितो, I drink tea every day. For what is happening now, see the present continuous."
  entries:
    - lemma: "जाणे"
      key: jaane
      reading: "jane"
      gloss: "to go"
      forms:
        "मी (m)": "जातो"
        "मी (f)": "जाते"
        "आम्ही": "जातो"
        "तू (m)": "जातोस"
        "तू (f)": "जातेस"
        "तुम्ही": "जाता"
        "तो": "जातो"
        "ती": "जाते"
        "ते (it)": "जाते"
        "ते (they)": "जातात"
        "त्या (they, f)": "जातात"
      readings:
        "मी (m)": "jato"
        "मी (f)": "jate"
        "आम्ही": "jato"
        "तू (m)": "jatos"
        "तू (f)": "jates"
        "तुम्ही": "jata"
        "तो": "jato"
        "ती": "jate"
        "ते (it)": "jate"
        "ते (they)": "jatat"
        "त्या (they, f)": "jatat"
    - lemma: "करणे"
      key: karne
      reading: "karne"
      gloss: "to do"
      forms:
        "मी (m)": "करतो"
        "मी (f)": "करते"
