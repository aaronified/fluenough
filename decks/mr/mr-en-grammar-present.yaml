        "मी (f)": "जाते"
        "आम्ही": "जातो"
        "तू (m)": "जातोस"
        "तू (f)": "जातेस"
        "तुम्ही": "जाता"
        "तो": "जातो"
        "ती": "जाते"
        "ते (it)": "जाते"
        "ते (they)": "जातात"
        "त्या (they, f)": "जातात"
      readings:
