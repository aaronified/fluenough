schema: 1
id: mr-en-grammar-conjunct-verbs
name: "Noun + करणे and होणे, and feelings that come to you"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Many Marathi verbs are a noun with करणे, do, or होणे, become: मदत करणे, to help. And hunger, sleep and fear are things that come to you: मला भूक लागली, I'm hungry. Not yet checked by a Marathi speaker: please report any mistake."
tags: [unreviewed, grammar]
cards:
  - id: mr-0534
    target: "काम करणे"
    native: "to work"
    reading: "kām karṇe"
    ipa: "kam kərɳe"
    pos: "phrase"
    notes: "'To do work': मी बँकेत काम करतो (mi bam̐ket kām karto), I work in a bank."
  - id: mr-0535
    target: "मदत करणे"
    native: "to help"
    reading: "madat karṇe"
    ipa: "məd̪ət̪ kərɳe"
    pos: "phrase"
    notes: "The one helped takes -ला: मला मदत करा (malā madat karā), please help me."
  - id: mr-0536
    target: "फोन करणे"
    native: "to phone"
    reading: "fon karṇe"
    ipa: "fon kərɳe"
    pos: "phrase"
    notes: "मी तुम्हाला फोन करीन (mi tumhālā fon karin), I'll phone you."
  - id: mr-0537
    target: "सुरू करणे"
    native: "to start (something)"
    reading: "suru karṇe"
    ipa: "suru kərɳe"
    pos: "phrase"
    notes: "With करणे someone starts something; with होणे it starts by itself: काम सुरू केले, (they) started the work; काम सुरू झाले, the work started."
  - id: mr-0538
    target: "सुरू होणे"
    native: "to start; to begin"
    reading: "suru hoṇe"
    ipa: "suru ɦoɳe"
    pos: "phrase"
    notes: "चित्रपट कधी सुरू होईल? (chitrapat kadhi suru hoil?), when will the film start?"
  - id: mr-0539
    target: "बंद करणे"
    native: "to close; to switch off"
    reading: "band karṇe"
    ipa: "bənd̪ kərɳe"
    pos: "phrase"
    notes: "बंद is 'shut, off': दुकान बंद आहे, the shop is closed. Its opposite is उघडणे (ughaḍṇe), to open."
  - id: mr-0540
    target: "लग्न करणे"
    native: "to marry"
    reading: "lagna karṇe"
    ipa: "ləɡnə kərɳe"
    pos: "phrase"
    notes: "'To do a wedding': त्यांनी लग्न केले (tyānni lagna kele), they got married."
  - id: mr-0541
    target: "तयार होणे"
    native: "to get ready"
    reading: "tayār hoṇe"
    ipa: "t̪əjar ɦoɳe"
    pos: "phrase"
    notes: "तयार is 'ready': मी तयार आहे, I'm ready."
  - id: mr-0542
    target: "मला भूक लागली आहे."
    native: "I'm hungry."
    reading: "malā bhuk lāgli āhe."
    ipa: "məla bʱuk laɡli aɦe"
    pos: "phrase"
    notes: "'Hunger has struck me': the one who feels it takes -ला, and the verb agrees with भूक, which is feminine. Often just मला भूक लागली."
  - id: mr-0543
    target: "मला तहान लागली आहे."
    native: "I'm thirsty."
    reading: "malā tahān lāgli āhe."
    ipa: "məla t̪əɦan laɡli aɦe"
    pos: "phrase"
    notes: "तहान (tahān), thirst, is feminine too."
  - id: mr-0544
    target: "मला झोप येत आहे."
    native: "I'm sleepy."
    reading: "malā jhop yet āhe."
    ipa: "məla dzʱop jet̪ aɦe"
    alt_target: ["मला झोप येतेय."]
    pos: "phrase"
    notes: "'Sleep is coming to me'."
  - id: mr-0545
    target: "मला भीती वाटते."
    native: "I'm scared."
    reading: "malā bhiti vāṭte."
    ipa: "məla bʱit̪i ʋaʈt̪e"
    pos: "phrase"
    notes: "वाटणे is 'to feel, to seem': मला बरे वाटत नाही (malā bare vāṭat nāhi), I don't feel well."
  - id: mr-0546
    target: "मला तुझी आठवण येते."
    native: "I miss you."
    reading: "malā tujhi āṭhvaṇ yete."
    ipa: "məla t̪udʒʱi aʈʰʋəɳ jet̪e"
    pos: "phrase"
    notes: "'Your memory comes to me'. To someone you call तुम्ही: मला तुमची आठवण येते."
  - id: mr-0547
    target: "मला राग आला."
    native: "I got angry."
    reading: "malā rāg ālā."
    ipa: "məla raɡ ala"
    pos: "phrase"
    notes: "'Anger came to me': राग is masculine, so आला."
  - id: mr-0548
    target: "मला थंडी वाजते."
    native: "I feel cold."
    reading: "malā thaṇḍi vājte."
    ipa: "məla t̪ʰəɳɖi ʋadzt̪e"
    pos: "phrase"
    notes: "'Cold sounds on me'. थंडी (thaṇḍi) is cold weather."
