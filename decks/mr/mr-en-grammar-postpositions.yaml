schema: 1
id: mr-en-grammar-postpositions
name: "Endings and postpositions"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "In, to, from, with, for: words after the noun, which Marathi writes joined to it. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: mr-0433
    target: "घरी"
    native: "at home; home"
    reading: "ghari"
    pos: "adv"
    notes: "An old ending, -ई, kept for home: मी घरी आहे, I'm at home; मी घरी जातो, I'm going home."
  - id: mr-0434
    target: "बाजारात"
    native: "in the market; to the market"
    reading: "bajarat"
    pos: "other"
    notes: "-त is 'in', and with a verb of going 'into': बाजारात जा, go to the market. बाजार adds -ा- before it."
  - id: mr-0435
    target: "टेबलावर"
    native: "on the table"
    reading: "tebalavar"
    pos: "other"
    notes: "-वर is 'on': टेबल (tebal) + -ा- + -वर. Its opposite is -खाली, under: टेबलाखाली."
  - id: mr-0436
    target: "पुण्याला"
    native: "to Pune"
    reading: "punyala"
    pos: "other"
    notes: "-ला is 'to' a place. पुणे changes to पुण्या- before an ending."
  - id: mr-0437
    target: "मुंबईहून"
    native: "from Mumbai"
    reading: "mumbaihun"
    pos: "other"
    notes: "-हून is 'from' a place. After a noun ending in a consonant it is often -ऊन: घरून (gharun), from home."
  - id: mr-0438
    target: "बसने"
    native: "by bus"
    reading: "basne"
    pos: "other"
    notes: "-ने is 'by, with' a means: हाताने (hatane), by hand."
  - id: mr-0439
    target: "माझ्यासाठी"
    native: "for me"
    reading: "majhyasathi"
    pos: "other"
    notes: "-साठी is 'for'. A pronoun takes its possessive stem: माझ्या-, तुझ्या-, तुमच्या-."
  - id: mr-0440
    target: "तुमच्याबरोबर"
    native: "with you"
    reading: "tumchyabarobar"
    pos: "other"
    notes: "-बरोबर is 'with, together with'. Also -सोबत (sobat)."
  - id: mr-0441
    target: "घराजवळ"
    native: "near the house"
    reading: "gharajaval"
    pos: "other"
    notes: "-जवळ is 'near'. Likewise -समोर, opposite; -मागे, behind."
  - id: mr-0442
    target: "जेवणानंतर"
    native: "after the meal"
    reading: "jevananantar"
    pos: "other"
    notes: "-नंतर is 'after', and -आधी 'before': जेवणाआधी (jevanaadhi), before the meal."
  - id: mr-0443
    target: "सकाळपासून"
    native: "since the morning"
    reading: "sakalpasun"
    pos: "other"
    notes: "-पासून is 'since, from': कालपासून (kalpasun), since yesterday."
  - id: mr-0444
    target: "उद्यापर्यंत"
    native: "until tomorrow"
    reading: "udyaparyant"
    pos: "other"
    notes: "-पर्यंत is 'until, as far as': स्टेशनपर्यंत, as far as the station."
  - id: mr-0445
    target: "त्याच्याशी"
    native: "with him (to talk, to deal)"
    reading: "tyachyashi"
    pos: "other"
    notes: "-शी is 'with' for talking, meeting and quarrelling: मी त्याच्याशी बोलतो, I talk with him."
