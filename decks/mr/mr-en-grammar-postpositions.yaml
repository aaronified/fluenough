schema: 1
id: mr-en-grammar-postpositions
name: "Endings and postpositions"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "In, to, from, with, for: words after the noun, which Marathi writes joined to it. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - id: mr-0433
    target: "घरी"
    native: "at home; home"
    reading: "ghari"
    ipa: "ɡʱəri"
    pos: "adv"
    notes: "An old ending, -ई (-i), kept for home: मी घरी आहे (mi ghari āhe), I'm at home; मी घरी जातो (mi ghari jāto), I'm going home."
  - id: mr-0434
    target: "बाजारात"
    native: "in the market; to the market"
    reading: "bājārāt"
    ipa: "badzarat̪"
    pos: "other"
    notes: "-त (-ta) is 'in', and with a verb of going 'into': बाजारात जा (bājārāt jā), go to the market. बाजार (bājār) adds -ा- (ā) before it."
  - id: mr-0435
    target: "टेबलावर"
    native: "on the table"
    reading: "ṭebalāvar"
    ipa: "ʈebəlaʋər"
    pos: "other"
    notes: "-वर (-var) is 'on': टेबल (ṭebal) + -ा- (ā) + -वर (-var). Its opposite is -खाली (-khāli), under: टेबलाखाली (ṭeblākhāli)."
  - id: mr-0436
    target: "पुण्याला"
    native: "to Pune"
    reading: "puṇyālā"
    ipa: "puɳjala"
    pos: "other"
    notes: "-ला (-lā) is 'to' a place. पुणे (puṇe) changes to पुण्या- (puṇyā-) before an ending."
  - id: mr-0437
    target: "मुंबईहून"
    native: "from Mumbai"
    reading: "mumbaihun"
    ipa: "mumbəiɦun"
    pos: "other"
    notes: "-हून (-hun) is 'from' a place. After a noun ending in a consonant it is often -ऊन (-un): घरून (gharun), from home."
  - id: mr-0438
    target: "बसने"
    native: "by bus"
    reading: "basne"
    ipa: "bəsne"
    pos: "other"
    notes: "-ने (-ne) is 'by, with' a means: हाताने (hātāne), by hand."
  - id: mr-0439
    target: "माझ्यासाठी"
    native: "for me"
    reading: "mājhyāsāṭhi"
    ipa: "madʒʱjasaʈʰi"
    pos: "other"
    notes: "-साठी (-sāṭhi) is 'for'. A pronoun takes its possessive stem: माझ्या- (mājhyā-), तुझ्या- (tujhyā-), तुमच्या- (tumacyā-)."
  - id: mr-0440
    target: "तुमच्याबरोबर"
    native: "with you"
    reading: "tumcyābarobar"
    ipa: "t̪umtʃjabərobər"
    pos: "other"
    notes: "-बरोबर (-barobar) is 'with, together with'. Also -सोबत (sobat)."
  - id: mr-0441
    target: "घराजवळ"
    native: "near the house"
    reading: "gharājavaḷ"
    ipa: "ɡʱəradzəʋəɭ"
    pos: "other"
    notes: "-जवळ (-javaḷ) is 'near'. Likewise -समोर (-samor), opposite; -मागे (-māge), behind."
  - id: mr-0442
    target: "जेवणानंतर"
    native: "after the meal"
    reading: "jevaṇānantar"
    ipa: "dʒeʋəɳanənt̪ər"
    pos: "other"
    notes: "-नंतर (-nantar) is 'after', and -आधी (-ādhi) 'before': जेवणाआधी (jevaṇāādhi), before the meal."
  - id: mr-0443
    target: "सकाळपासून"
    native: "since the morning"
    reading: "sakāḷpāsun"
    ipa: "səkaɭpasun"
    pos: "other"
    notes: "-पासून (-pāsun) is 'since, from': कालपासून (kālpāsun), since yesterday."
  - id: mr-0444
    target: "उद्यापर्यंत"
    native: "until tomorrow"
    reading: "udyāparyant"
    ipa: "ud̪japərjənt̪"
    pos: "other"
    notes: "-पर्यंत (-paryant) is 'until, as far as': स्टेशनपर्यंत (sṭeśnparyant), as far as the station."
  - id: mr-0445
    target: "त्याच्याशी"
    native: "with him (to talk, to deal)"
    reading: "tyācyāśi"
    ipa: "t̪jatʃjaʃi"
    pos: "other"
    notes: "-शी (-śi) is 'with' for talking, meeting and quarrelling: मी त्याच्याशी बोलतो (mi tyācyāśi bolto), I talk with him."
