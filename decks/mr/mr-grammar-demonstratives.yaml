        "near: हा (hā), इ- (i-)": "he"
        "far: तो (to), ति- (ti-)": "te"
      ipas:
        "near: हा (hā), इ- (i-)": "ɦe"
        "far: तो (to), ति- (ti-)": "t̪e"
    - lemma: "these, those (feminine)"
      key: "fem-pl"
      forms:
        "near: हा (hā), इ- (i-)": ["या", "ह्या"]
        "far: तो (to), ति- (ti-)": "त्या"
      readings:
        "near: हा (hā), इ- (i-)": ["yā", "hyā"]
        "far: तो (to), ति- (ti-)": "tyā"
      ipas:
        "near: हा (hā), इ- (i-)": "ja"
        "far: तो (to), ति- (ti-)": "t̪ja"
