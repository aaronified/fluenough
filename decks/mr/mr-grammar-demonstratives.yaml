      key: "masc"
      forms:
        "near: हा (hā), इ- (i-)": "हा"
        "far: तो (to), ति- (ti-)": "तो"
      readings:
        "near: हा (hā), इ- (i-)": "hā"
        "far: तो (to), ति- (ti-)": "to"
      ipas:
        "near: हा (hā), इ- (i-)": "ɦa"
        "far: तो (to), ति- (ti-)": "t̪o"
    - lemma: "this, that (feminine)"
      key: "fem"
      forms:
        "near: हा (hā), इ- (i-)": "ही"
        "far: तो (to), ति- (ti-)": "ती"
      readings:
        "near: हा (hā), इ- (i-)": "hi"
        "far: तो (to), ति- (ti-)": "ti"
      ipas:
        "near: हा (hā), इ- (i-)": "ɦi"
        "far: तो (to), ति- (ti-)": "t̪i"
    - lemma: "this, that (neuter)"
      key: "neut"
      forms:
        "near: हा (hā), इ- (i-)": "हे"
        "far: तो (to), ति- (ti-)": "ते"
