  "sentences":
  - "text": "चित्रांचे प्रदर्शन पुढच्या आठवड्यात भरणार आहे."
    "reading": "citrāñce pradarśan puḍhacyā āṭhvaḍyāt bharṇār āhe."
    "ipa": "tʃit̪raɲtʃe prəd̪ərʃən puɖʱətʃja aʈʰʋəɖjat̪ bʱərɳar aɦe"
  - "text": "प्रदर्शन सकाळी दहा वाजता सुरू होईल."
    "reading": "pradarśan sakāḷi dahā vājtā suru hoil."
    "ipa": "prəd̪ərʃən səkaɭi d̪əɦa ʋadzt̪a suru ɦoil"
  - "text": "येथे अनेक कलाकार असतील."
    "reading": "yethe anek kalākār astil."
    "ipa": "jet̪ʰe ənek kəlakar əst̪il"
  - "text": "प्रवेश मोफत आहे."
    "reading": "praveś mophat āhe."
    "ipa": "prəʋeʃ mopʰət̪ aɦe"
  - "text": "हे प्रदर्शन शुक्रवारी बंद असेल."
    "reading": "he pradarśan śukravāri band asel."
    "ipa": "ɦe prəd̪ərʃən ʃukrəʋari bənd̪ əsel"
