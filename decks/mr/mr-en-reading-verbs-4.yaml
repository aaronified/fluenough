- "id": "mr-short-story"
  "title": "The farmer's stone"
  "sentences":
  - "text": "एक शेतकरी रोज नदीवर जायचा."
    "reading": "ek śetkri roj nadivar jāycā."
    "ipa": "ek ʃet̪kri rodz nəd̪iʋər dzajtsa"
  - "text": "एक दिवस त्याला नदीत एक सुंदर दगड दिसला."
    "reading": "ek divas tyālā nadit ek sundar dagaḍ dislā."
    "ipa": "ek d̪iʋəs t̪jala nəd̪it̪ ek sund̪ər d̪əɡəɖ d̪isla"
  - "text": "त्याने तो दगड घरी नेला."
    "reading": "tyāne to dagaḍ ghari nelā."
    "ipa": "t̪jane t̪o d̪əɡəɖ ɡʱəri nela"
  - "text": "घरी आल्यावर तो दगड सोन्याचा होता."
    "reading": "ghari ālyāvar to dagaḍ sonyācā hotā."
    "ipa": "ɡʱəri aljaʋər t̪o d̪əɡəɖ sonjatsa ɦot̪a"
  - "text": "शेतकरी खूप आनंदी झाला."
    "reading": "śetkri khup ānandi jhālā."
    "ipa": "ʃet̪kri kʰup anənd̪i dzʱala"
  - "text": "पण त्याने विचार केला आणि तो दगड परत नदीत ठेवला."
    "reading": "paṇ tyāne vicār kelā āṇi to dagaḍ parat nadit ṭhevlā."
    "ipa": "pəɳ t̪jane ʋitsar kela aɳi t̪o d̪əɡəɖ pərət̪ nəd̪it̪ ʈʰeʋla"
