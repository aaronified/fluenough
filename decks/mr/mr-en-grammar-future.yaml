schema: 1
id: mr-en-grammar-future
name: "Future"
kind: grammar
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I will go, they will come: the future, which does not show gender, and the -णार form everyday speech uses beside it. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Future"
  slot_name: "person"
  slots: ["मी", "आम्ही", "तू", "तुम्ही", "तो / ती / ते", "ते / त्या (they)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The endings: मी -ईन or -एन, आम्ही -ऊ, तू -शील, तुम्ही -आल, he, she or it -ईल or -एल, they -तील. येणे, घेणे and देणे change their vowel for तुम्ही: याल, घ्याल, द्याल. आम्ही जाऊ is also 'let's go', and with आपण it includes the listener: आपण जाऊ. Speech also uses -णार, which never changes: मी उद्या जाणार, I'm going tomorrow; तुम्ही येणार का?, will you come?"
  entries:
    - lemma: "जाणे"
      key: jaane
      reading: "jāṇe"
      ipa: "dzaɳe"
      gloss: "to go"
      forms:
        "मी": "जाईन"
        "आम्ही": "जाऊ"
        "तू": "जाशील"
        "तुम्ही": "जाल"
        "तो / ती / ते": "जाईल"
        "ते / त्या (they)": "जातील"
      readings:
        "मी": "jāin"
        "आम्ही": "jāu"
        "तू": "jāśil"
        "तुम्ही": "jāl"
        "तो / ती / ते": "jāil"
        "ते / त्या (they)": "jātil"
      ipas:
        "मी": "dzain"
        "आम्ही": "dzau"
        "तू": "dzaʃil"
        "तुम्ही": "dzal"
        "तो / ती / ते": "dzail"
        "ते / त्या (they)": "dzat̪il"
    - lemma: "येणे"
      key: yene
      reading: "yeṇe"
      ipa: "jeɳe"
      gloss: "to come"
      forms:
        "मी": "येईन"
        "आम्ही": "येऊ"
        "तू": "येशील"
        "तुम्ही": "याल"
        "तो / ती / ते": "येईल"
        "ते / त्या (they)": "येतील"
      readings:
        "मी": "yein"
        "आम्ही": "yeu"
        "तू": "yeśil"
        "तुम्ही": "yāl"
        "तो / ती / ते": "yeil"
        "ते / त्या (they)": "yetil"
      ipas:
        "मी": "jein"
        "आम्ही": "jeu"
        "तू": "jeʃil"
        "तुम्ही": "jal"
        "तो / ती / ते": "jeil"
        "ते / त्या (they)": "jet̪il"
    - lemma: "करणे"
      key: karne
      reading: "karṇe"
      ipa: "kərɳe"
      gloss: "to do"
      forms:
