      key: mii
      reading: "mi"
      ipa: "mi"
      gloss: "I"
      forms:
        "possessive, masculine: माझा (mājhā) …": "माझा"
        "possessive, feminine: माझी (mājhi) …": "माझी"
        "to, and as object: मला (malā) …": "मला"
        "with, have: माझ्याकडे (mājhyākḍe) …": "माझ्याकडे"
      readings:
        "possessive, masculine: माझा (mājhā) …": "mājhā"
        "possessive, feminine: माझी (mājhi) …": "mājhi"
        "to, and as object: मला (malā) …": "malā"
        "with, have: माझ्याकडे (mājhyākḍe) …": "mājhyākaḍe"
      ipas:
        "possessive, masculine: माझा (mājhā) …": "madzʱa"
        "possessive, feminine: माझी (mājhi) …": "madʒʱi"
        "to, and as object: मला (malā) …": "məla"
        "with, have: माझ्याकडे (mājhyākḍe) …": "madʒʱjakəɖe"
