      - { target: "आमचा पेशा शेती आहे.", reading: "āmcā peśā śeti āhe.", ipa: "amtsa peʃa ʃet̪i aɦe", bases: [{ word: "आमचा", ref: "mr-0138" }, { word: "आहे", base: "असणे", reading: "asṇe" }] }
  - id: "mr-1464"
