  - id: "mr-1462"
    target: "करिअर"
    reading: "kariar"
    ipa: "kəriər"
    pos: "noun"
    gender: "n"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "करिअर", reading: "kariar" }] }
    examples:
      - { target: "माझं करिअर आता सुरू झालं.", reading: "mājham̐ kariar ātā suru jhālam̐.", ipa: "madzʱə̃ kəriər at̪a suru dzʱalə̃", bases: [{ word: "माझं", ref: "mr-0080" }, { word: "सुरू", base: "सुरू", reading: "suru" }, { word: "झालं", base: "होणे", reading: "hoṇe" }] }
      - { target: "करिअरसाठी चांगलं शिक्षण हवं.", reading: "kariarsāṭhi cāṅgalam̐ śikṣaṇ havam̐.", ipa: "kəriərsaʈʰi tsaŋɡələ̃ ʃikʂəɳ ɦəʋə̃", bases: [{ word: "करिअरसाठी", base: "करिअर", reading: "kariar" }, { word: "चांगलं", ref: "mr-0759" }, { word: "शिक्षण", base: "शिक्षण", reading: "śikṣaṇ" }, { word: "हवं", ref: "mr-1018" }] }
