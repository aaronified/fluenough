# The order Marathi is taught from English in: one unit per line. First a
# few words and basic sentences, the sounds English lacks and how Marathi
# grammar differs from English; then five more themes, each with the grammar
# that goes with it; then the script, before the rest. Every mr-en deck is
# listed exactly once. See ADR-0013 and docs/DECK-FORMAT.md.
schema: 1
kind: path
id: mr-en-path
language: mr
native: en
# The decks that need the alphabet: a learner who learns without it
# skips them.
alphabet:
  - mr-en-script-vowels
  - mr-en-script-consonants
  - mr-en-script-reading
  - mr-en-script-vowel-signs
  - mr-en-script-conjuncts
  - mr-en-spelling
  - mr-en-reading-sunitacha-ravivar
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  - [mr-en-first-words, mr-en-grammar-sentences, "*"]
  - [mr-en-sound-differences]
  - [mr-en-grammar-differences]
  - [mr-en-questions, mr-en-grammar-questions, "*"]
  - [mr-en-addressing, mr-en-grammar-pronouns, "*"]
  - [mr-en-about-me, mr-en-grammar-present, "*"]
  - [mr-en-family, mr-en-grammar-be, "*"]
  - [mr-en-work, mr-en-grammar-demonstratives, "*"]
  - [mr-en-script-vowels, mr-en-script-consonants, mr-en-script-reading]
  - [mr-en-script-vowel-signs, mr-en-script-conjuncts]
  - [mr-en-numbers-1-20, "*"]
  - [mr-en-numbers-big, "*"]
  - [mr-en-market, mr-en-grammar-nouns, mr-en-grammar-articles, "*"]
  - [mr-en-groceries, mr-en-grammar-gender-number, mr-en-grammar-needs, "*"]
  - [mr-en-transport, mr-en-grammar-postpositions, "*"]
  - [mr-en-directions, mr-en-grammar-continuous, "*"]
  - [mr-en-home, mr-en-grammar-adjectives, "*"]
  - [mr-en-time, mr-en-grammar-future, "*"]
  - [mr-en-daily-life, mr-en-grammar-negative, "*"]
  - [mr-en-calendar, mr-en-grammar-past, "*"]
  - [mr-en-grammar-past-more, mr-en-grammar-conjunct-verbs]
  - [mr-en-grammar-compound-verbs]
  - [mr-en-eating-out, mr-en-grammar-conjunctions, mr-en-grammar-likes, "*"]
  - [mr-en-help, mr-en-grammar-irregular, mr-en-grammar-pitfalls, "*"]
  - [mr-en-registers]
  - [mr-en-slang]
  - [mr-en-grammar-can-must]
  - [mr-en-spelling]
  - [mr-en-reading-sunitacha-ravivar]
  - ["*"]
