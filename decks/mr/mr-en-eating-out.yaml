id: mr-en-eating-out
name: "Eating out"
kind: vocab
theme: eating-out
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Ordering, asking for less spice, Maharashtra's everyday food, and paying the bill. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0558
    target: "पाणी"
    native: "water"
    reading: "pāṇi"
    ipa: "paɳi"
    pos: "noun"
    gender: "n"
    notes: "पाणी द्या (pāṇi dyā), some water, please. Bottled water: बिसलेरी (bisleri), after a brand, or पाण्याची बाटली (pāṇyāci bāṭli)."
  - id: mr-0559
    target: "चहा"
    native: "tea"
    reading: "cahā"
    ipa: "tsəɦa"
    pos: "noun"
    gender: "m"
    notes: "Said tsahaa. Strong, sweet, with milk; a small glass is a कटिंग (kaṭiṅg), a half."
  - id: mr-0560
    target: "कॉफी"
    native: "coffee"
    reading: "kôfi"
    ipa: "kɔfi"
    pos: "noun"
    gender: "f"
  - id: mr-0561
    target: "भात"
    native: "cooked rice"
    reading: "bhāt"
    ipa: "bʱat̪"
    pos: "noun"
    gender: "m"
    notes: "Uncooked rice is तांदूळ (tānduḷ). वरणभात (varaṇbhāt), rice with plain dal, is the everyday comfort food."
  - id: mr-0562
    target: "मेनू"
    native: "menu"
    reading: "menu"
    ipa: "menu"
    pos: "noun"
    gender: "m"
  - id: mr-0563
    target: "बिल"
    native: "bill"
    reading: "bil"
    ipa: "bil"
    pos: "noun"
    gender: "n"
  - id: mr-0564
    target: "बिल आणा."
    native: "The bill, please."
    reading: "bil āṇā."
    ipa: "bil aɳa"
    pos: "phrase"
    notes: "'Bring the bill'. आणणे is 'to bring'."
  - id: mr-0565
    target: "तिखट"
    native: "spicy hot; chilli powder"
    reading: "tikhaṭ"
    ipa: "t̪ikʰəʈ"
    pos: "adj"
    notes: "कमी तिखट (kami tikhaṭ), not too spicy. Kolhapur is famous for its very hot food."
  - id: mr-0566
    target: "गोड"
    native: "sweet"
    reading: "goḍ"
    ipa: "ɡoɖ"
    pos: "adj"
    notes: "Also 'lovely' of a child or a voice. A sweet is गोड पदार्थ, or simply गोड: जेवणानंतर काहीतरी गोड, something sweet after the meal."
  - id: mr-0567
    target: "मला एक चहा द्या."
    native: "One tea for me, please."
    reading: "malā ek cahā dyā."
    ipa: "məla ek tsəɦa d̪ja"
    pos: "phrase"
  - id: mr-0568
    target: "कमी तिखट करा."
    native: "Make it less spicy, please."
    reading: "kami tikhaṭ karā."
    ipa: "kəmi t̪ikʰəʈ kəra"
    pos: "phrase"
  - id: mr-0569
    target: "खूप छान आहे!"
    native: "It's very good!"
    reading: "khup chān āhe!"
    ipa: "kʰup tʃʰan aɦe"
    pos: "phrase"
    notes: "छान, 'nice, lovely', never changes. Of food also: खूप चविष्ट आहे (khup caviṣṭa āhe), it's delicious."
  - id: mr-0570
    target: "पोळी"
    native: "chapati"
    reading: "poḷi"
    ipa: "poɭi"
    pos: "noun"
    gender: "f"
    notes: "Also चपाती (capāti). Plural पोळ्या (poḷyā). A sweet stuffed one is a पुरणपोळी (puraṇpoḷi)."
  - id: mr-0571
    target: "भाकरी"
    native: "millet flatbread"
    reading: "bhākri"
    ipa: "bʱakri"
    pos: "noun"
    gender: "f"
    notes: "Made of jowar or bajri, eaten with पिठले (piṭhle), a gram-flour curry, in villages across Maharashtra."
  - id: mr-0572
    target: "वडापाव"
    native: "vada pav"
    reading: "vaḍāpāv"
    ipa: "ʋəɖapaʋ"
    pos: "noun"
    gender: "m"
    notes: "A spiced potato fritter in a bread roll, the snack of Mumbai. पाव, bread, is from Portuguese pão."
  - id: mr-0573
    target: "थाळी"
    native: "set meal on a plate"
    reading: "thāḷi"
    ipa: "t̪ʰaɭi"
    pos: "noun"
    gender: "f"
    notes: "Several dishes, bread and rice, often refilled: a meal at a fixed price."
  - id: mr-0574
    target: "हॉटेल"
    native: "restaurant; eating place"
    reading: "hôṭel"
    ipa: "ɦɔʈel"
    pos: "noun"
    gender: "n"
    notes: "In Maharashtra an हॉटेल is usually somewhere to eat; a place to stay is a लॉज (lôj) or a hotel with rooms."
