id: mr-en-eating-out
name: "Eating out"
kind: vocab
theme: eating-out
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Ordering, asking for less spice, Maharashtra's everyday food, and paying the bill. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0558
    target: "पाणी"
    native: "water"
    reading: "paanii"
    pos: "noun"
    gender: "n"
    notes: "पाणी द्या (paanii dyaa), some water, please. Bottled water: बिसलेरी (bislerii), after a brand, or पाण्याची बाटली (paanyaachii baatlii)."
  - id: mr-0559
    target: "चहा"
    native: "tea"
    reading: "chahaa"
    pos: "noun"
    gender: "m"
    notes: "Said tsahaa. Strong, sweet, with milk; a small glass is a कटिंग (kating), a half."
  - id: mr-0560
    target: "कॉफी"
    native: "coffee"
    reading: "kophii"
    pos: "noun"
    gender: "f"
  - id: mr-0561
    target: "भात"
    native: "cooked rice"
    reading: "bhaat"
    pos: "noun"
    gender: "m"
    notes: "Uncooked rice is तांदूळ (taanduul). वरणभात (varanbhaat), rice with plain dal, is the everyday comfort food."
  - id: mr-0562
    target: "मेनू"
    native: "menu"
    reading: "menuu"
    pos: "noun"
    gender: "m"
  - id: mr-0563
    target: "बिल"
    native: "bill"
    reading: "bil"
    pos: "noun"
    gender: "n"
  - id: mr-0564
    target: "बिल आणा."
    native: "The bill, please."
    reading: "bil aanaa."
    pos: "phrase"
    notes: "'Bring the bill'. आणणे is 'to bring'."
  - id: mr-0565
    target: "तिखट"
    native: "spicy hot; chilli powder"
    reading: "tikhat"
    pos: "adj"
    notes: "कमी तिखट (kamii tikhat), not too spicy. Kolhapur is famous for its very hot food."
  - id: mr-0566
    target: "गोड"
    native: "sweet"
    reading: "god"
    pos: "adj"
    notes: "Also 'lovely' of a child or a voice. A sweet is गोड पदार्थ, or simply गोड: जेवणानंतर काहीतरी गोड, something sweet after the meal."
  - id: mr-0567
    target: "मला एक चहा द्या."
    native: "One tea for me, please."
    reading: "malaa ek chahaa dyaa."
    pos: "phrase"
  - id: mr-0568
    target: "कमी तिखट करा."
    native: "Make it less spicy, please."
    reading: "kamii tikhat karaa."
    pos: "phrase"
  - id: mr-0569
    target: "खूप छान आहे!"
    native: "It's very good!"
    reading: "khuup chhaan aahe!"
    pos: "phrase"
    notes: "छान, 'nice, lovely', never changes. Of food also: खूप चविष्ट आहे (khuup chavishta aahe), it's delicious."
  - id: mr-0570
    target: "पोळी"
    native: "chapati"
    reading: "polii"
    pos: "noun"
    gender: "f"
    notes: "Also चपाती (chapaatii). Plural पोळ्या (polyaa). A sweet stuffed one is a पुरणपोळी (puranpolii)."
  - id: mr-0571
    target: "भाकरी"
    native: "millet flatbread"
    reading: "bhaakrii"
    pos: "noun"
    gender: "f"
    notes: "Made of jowar or bajri, eaten with पिठले (pithle), a gram-flour curry, in villages across Maharashtra."
  - id: mr-0572
    target: "वडापाव"
    native: "vada pav"
    reading: "vadaapaav"
    pos: "noun"
    gender: "m"
    notes: "A spiced potato fritter in a bread roll, the snack of Mumbai. पाव, bread, is from Portuguese pão."
  - id: mr-0573
    target: "थाळी"
    native: "set meal on a plate"
    reading: "thaalii"
    pos: "noun"
    gender: "f"
    notes: "Several dishes, bread and rice, often refilled: a meal at a fixed price."
  - id: mr-0574
    target: "हॉटेल"
    native: "restaurant; eating place"
    reading: "hotel"
    pos: "noun"
    gender: "n"
    notes: "In Maharashtra an हॉटेल is usually somewhere to eat; a place to stay is a लॉज (loj) or a hotel with rooms."
